<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>华严宗 · 法脉全景</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{--bg:#f6f2e8;--panel:#fdfaf3;--card:#fefdf9;--gold:#b8863c;--blue:#5e8b9e;--green:#7d9a6e;--red:#c46b5d;--text:#3d3427;--text2:#7a7262;--line:#e5ddd0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;display:flex;flex-direction:column}
#header{background:linear-gradient(135deg,#e8e0d2,#efe6d8);padding:8px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
#header h1{font-size:1.1em;color:var(--gold);font-weight:600}
#header .sub{font-size:0.7em;color:var(--text2)}
#tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);padding:0 14px}
#tabs button{padding:10px 20px;border:none;background:none;color:var(--text2);cursor:pointer;font-size:0.85em;border-bottom:3px solid transparent;transition:all 0.25s;font-weight:500}
#tabs button:hover{color:var(--text)}
#tabs button.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:600}
.tab-content{display:none;flex:1;overflow:hidden;animation:fadein 0.3s ease}
.tab-content.active{display:flex;flex-direction:column}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#search-bar{display:flex;gap:6px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center}
#search-bar input{border:1px solid var(--line);border-radius:14px;padding:5px 12px;font-size:0.8em;background:var(--card);color:var(--text);width:220px;outline:none}
#main-row{display:flex;flex:1;min-height:0}
#tl-panel{flex:1;position:relative;background:var(--panel);overflow-y:auto;overflow-x:hidden;min-width:0;cursor:grab}
#tl-panel canvas{display:block;position:absolute;top:0;left:0}
#side{width:380px;display:flex;flex-direction:column;min-width:240px;border-left:1px solid var(--line)}
#map-wrap{flex:1;min-height:200px;position:relative}
#map{width:100%;height:100%}
#info-box{background:var(--panel);border-top:1px solid var(--line);padding:14px 16px;font-size:0.82em;min-height:150px;overflow-y:auto;color:var(--text)}
#info-box .empty{text-align:center;color:var(--text2);padding-top:20px}
#info-box h3{color:var(--gold);font-size:1.1em;margin-bottom:4px}
#controls{background:var(--panel);padding:6px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)}
#controls button{padding:4px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text2);cursor:pointer;font-size:0.73em;transition:all 0.2s}
#controls button:hover{background:#f0ebe0;color:var(--text);border-color:var(--gold)}
#controls button.active{background:var(--gold);color:#fff;border-color:var(--gold)}
#tl-tooltip{position:absolute;background:var(--card);color:var(--text);padding:10px 14px;border-radius:8px;font-size:0.82em;pointer-events:none;opacity:0;transition:opacity 0.15s;max-width:300px;z-index:100;box-shadow:0 4px 14px rgba(60,40,20,0.14);border:1px solid var(--line)}
#tl-tooltip h3{color:var(--gold);margin-bottom:3px}
.leaflet-popup-content{font-size:0.85em;color:var(--text)}
.leaflet-popup-content b{color:var(--gold)}
#gap-view,#practice-view{flex:1;background:var(--bg);overflow-y:auto;padding:22px 26px}
.section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;width:100%}
.section h2{color:var(--gold);font-size:1.05em;margin-bottom:6px}
.v-table{width:100%;border-collapse:collapse;font-size:0.82em}
.v-table th{background:linear-gradient(180deg,#f5efe4,#efe6d8);color:var(--text);padding:8px 10px;text-align:left;font-weight:600}
.v-table td{padding:7px 10px;border-bottom:1px solid var(--line)}
.badge{padding:2px 8px;border-radius:10px;font-size:0.7em;font-weight:600}
.bA{color:var(--red)} .bB{color:#c8893e} .bC{color:#a08020} .bD{color:var(--blue)} .bE{color:var(--green)}
.miss{color:var(--red);font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:0.78em;font-weight:600;margin:2px 4px}
.stage-box{border-left:4px solid var(--gold);padding:8px 14px;margin:8px 0;background:rgba(200,150,60,0.04);border-radius:0 8px 8px 0;font-size:0.85em;line-height:1.7}
.stage-box b{color:var(--gold)}
@media(max-width:768px){body{overflow:auto}#header h1{font-size:0.9em}#header .sub{display:none}#main-row{flex-direction:column}#tl-panel{height:50vh;min-height:300px}#side{width:100%!important;flex-direction:row}#map-wrap{height:30vh}#controls button{font-size:0.65em}}
</style>
</head>

</div>

<script>// ═══ DATA ═══
var GRAPH = {"nodes": [{"id": "person_000a", "n": "龙树", "dy": "古印度", "ti": "华严宗远祖（八宗共祖）", "li": "华严宗远祖", "tp": "patriarch", "b": null, "d": null, "bio": "大乘中观学派创始人。据传入龙宫取回《华严经》下本十万偈流传人间。造《十住毗婆沙论》（《十地品》注释，又称《大不思议论》），被华严宗奉为法统源头。", "wk": ["十住毗婆沙论", "中论"]}, {"id": "person_000b", "n": "世亲", "dy": "古印度", "ti": "唯识宗祖师", "li": null, "tp": "scholar", "b": null, "d": null, "bio": "古印度唯识学派大师。造《十地经论》十二卷，系统注释《华严经·十地品》，其「六相」等名相创新深刻影响华严宗教学。汉译催生了南北朝地论师学派。", "wk": ["十地经论", "唯识三十颂"]}, {"id": "person_006", "n": "佛驮跋陀罗", "dy": "东晋", "ti": "六十华严译者", "li": null, "tp": "translator", "b": 359, "d": 429, "bio": "北天竺迦毗罗卫国人。来华译经大师，于建康道场寺译出《六十华严》（旧华严），共七处八会三十四品。还译《大般泥洹经》等。", "wk": ["大方广佛华严经（六十华严，T09n0278）"]}, {"id": "person_007", "n": "实叉难陀", "dy": "唐", "ti": "八十华严译者", "li": null, "tp": "translator", "b": 652, "d": 710, "bio": "于阗国（今新疆和田）人。奉武则天命来华，主译八十卷《华严经》（T10n0279），法藏曾参与其译场证义。还译《大乘入楞伽经》《大方广普贤所说经》（T0847）等。", "wk": ["大方广佛华严经（八十华严，T10n0279）", "大方广普贤所说经（T0847）"]}, {"id": "person_008", "n": "般若", "dy": "唐", "ti": "四十华严译者", "li": null, "tp": "translator", "b": null, "d": null, "bio": "罽宾国（今克什米尔）人。唐贞元年间来华，译出《四十华严》（T10n0293），即全本《入法界品》。文末《普贤菩萨行愿赞》为藏汉佛教共同尊奉。", "wk": ["大方广佛华严经（四十华严，T10n0293）"]}, {"id": "person_007b", "n": "支娄迦谶", "dy": "后汉", "ti": "最早汉译华严经文者", "li": null, "tp": "translator", "b": null, "d": null, "bio": "月氏国人。后汉桓帝时来华。译出《佛说兜沙经》（T10n0280），为《华严经》中最早被翻译过来的单行经（对应《如来名号品》）。", "wk": ["佛说兜沙经（T10n0280）"]}, {"id": "person_001", "n": "杜顺", "dy": "唐", "ti": "华严初祖", "li": "华严五祖", "tp": "patriarch", "b": 557, "d": 640, "bio": "华严宗初祖。雍州万年人。年十八出家于因圣寺。以《华严法界观门》开创华严宗观法体系。唐太宗赐号'帝心'。", "wk": ["华严法界观门", "华严五教止观"]}, {"id": "person_002", "n": "智俨", "dy": "唐", "ti": "华严二祖", "li": "华严五祖", "tp": "patriarch", "b": 602, "d": 668, "bio": "华严宗二祖。天水人。从杜顺出家，后于至相寺从慧光学华严。著《华严经搜玄记》开华严宗经疏之先河，为法藏之师。", "wk": ["华严经搜玄记", "华严一乘十玄门"]}, {"id": "person_003", "n": "法藏", "dy": "唐", "ti": "华严三祖·实际创立者", "li": "华严五祖", "tp": "patriarch", "b": 643, "d": 712, "bio": "华严宗实际创立者。祖籍康居，生于长安。从智俨学《华严》。参与实叉难陀译场。武则天赐号'贤首'。系统化'五教十宗'判教与'法界观门'观法。讲说《华严经》三十余遍。", "wk": ["华严一乘教义分齐章（五教章）", "华严经探玄记"]}, {"id": "person_004", "n": "澄观", "dy": "唐", "ti": "华严四祖·集大成者", "li": "华严五祖", "tp": "patriarch", "b": 738, "d": 839, "bio": "华严宗四祖。越州山阴人。历学律、禅、三论、天台、华严诸宗。著《华严经疏》六十卷、《演义钞》九十卷，为华严教学集大成者。历七帝之师。德宗赐号'清凉'。", "wk": ["华严经疏（华严大疏）", "华严经随疏演义钞"]}, {"id": "person_005", "n": "宗密", "dy": "唐", "ti": "华严五祖·禅教融合者", "li": "华严五祖", "tp": "patriarch", "b": 780, "d": 841, "bio": "华严宗五祖。果州西充人。初习儒学，后从遂州道圆禅师出家（禅宗荷泽系）。后遇澄观受学华严。融合禅教，著《禅源诸诠集都序》《华严原人论》。", "wk": ["注华严法界观门", "禅源诸诠集都序"]}, {"id": "person_009", "n": "李通玄", "dy": "唐", "ti": "华严居士学者", "li": "李通玄系", "tp": "scholar", "b": 635, "d": 730, "bio": "唐代华严学重要在家学者。深通儒释，专精《华严》，于方山著《新华严经论》四十卷。以《易经》融会华严，方法独树一帜。", "wk": ["新华严经论", "华严经决疑论"]}, {"id": "person_011", "n": "净源", "dy": "宋", "ti": "宋代华严中兴之祖", "li": "华严五祖", "tp": "patriarch", "b": 1011, "d": 1088, "bio": "宋代华严宗重要复兴者。住杭州慧因寺。传法于高丽义天，义天归国后送金书《华严经》三种译本供养慧因寺。慧因寺世称'华严第一道场'。", "wk": ["华严经疏注", "华严妄尽还源观疏"]}, {"id": "person_010", "n": "义天", "dy": "宋", "ti": "高丽华严初祖", "li": "高丽华严", "tp": "scholar", "b": 1055, "d": 1101, "bio": "高丽文宗第四子。入宋求法于杭州慧因寺，从净源法师受华严教法。回国后编《新编诸宗教藏总录》（义天录），为华严文献学的奠基性著作。", "wk": ["新编诸宗教藏总录（义天录）", "圆宗文类"]}, {"id": "person_021", "n": "高原明昱", "dy": "明", "ti": "华严宗第二十五世", "li": "华严五祖", "tp": "patriarch", "b": null, "d": null, "bio": "明代华严宗祖师，华严宗第二十五世传人。自他起华严法脉兼传慈恩宗（唯识/法相宗），开创'贤首兼慈恩'传承体系。钦因长老等现代传人皆属此高原法系。", "wk": []}, {"id": "person_012", "n": "月霞", "dy": "清", "ti": "近现代华严复兴先驱", "li": "月霞系", "tp": "patriarch", "b": 1858, "d": 1917, "bio": "清末民初华严宗复兴的关键人物。于常熟兴福寺创立华严大学（1914年），为中国近代第一所华严专宗教育机构，培养了一批现代华严学僧。", "wk": []}, {"id": "person_031", "n": "应慈", "dy": "近现代", "ti": "近代华严座主", "li": "月霞系", "tp": "patriarch", "b": 1873, "d": 1965, "bio": "月霞长老师弟。继承月霞遗志，长期在上海等地弘传华严，被尊为'华严座主'。真禅法师之师。平生讲《华严经》多遍。", "wk": []}, {"id": "person_013", "n": "常惺", "dy": "近现代", "ti": "", "li": "月霞系", "tp": "patriarch", "b": 1896, "d": 1939, "bio": "月霞长老弟子。继月霞之后主持华严大学，于北京、上海等地弘传华严。曾任闽南佛学院院长。", "wk": []}, {"id": "person_018", "n": "智光", "dy": "近现代", "ti": "华严莲社首任住持", "li": "智光系", "tp": "patriarch", "b": 1889, "d": 1963, "bio": "近代华严学者。台北华严莲社第一任住持（1952年创社），开启台湾华严宗弘传事业。", "wk": []}, {"id": "person_015", "n": "南亭", "dy": "近现代", "ti": "华严莲社第二任住持", "li": "华严莲社", "tp": "patriarch", "b": 1900, "d": 1982, "bio": "智光法师弟子。1952年与师智光共创台北华严莲社，任第二任住持。长期弘传华严教观，为台湾华严宗发展奠基人。", "wk": []}, {"id": "person_016", "n": "成一", "dy": "当代", "ti": "华严莲社第三任住持·华严专宗学院创办人", "li": "华严莲社", "tp": "patriarch", "b": 1914, "d": 2011, "bio": "江苏泰县人。15岁出家。1949年赴台，协助师祖南亭和尚创办华严莲社，1972年继任住持。1975年创办华严专宗学院，以'专修、专研、专弘华严'为宗旨。1985年创立美国华严莲社。著有多部华严学著作。1988年后恢复泰州光孝寺等大陆祖庭。", "wk": ["成一和尚著作集"]}, {"id": "person_032", "n": "了中", "dy": "当代", "ti": "华严莲社第四任住持", "li": "华严莲社", "tp": "patriarch", "b": 1932, "d": 2022, "bio": "华严莲社第四任住持。延续'专研、专修、专弘'华严的莲社传统。", "wk": []}, {"id": "person_033", "n": "净海", "dy": "当代", "ti": "华严莲社第五任住持", "li": "华严莲社", "tp": "patriarch", "b": null, "d": null, "bio": "华严莲社第五任住持。", "wk": []}, {"id": "person_017", "n": "贤度", "dy": "当代", "ti": "华严莲社第六任住持·华严专宗学院院长", "li": "华严莲社", "tp": "patriarch", "b": 1960, "d": null, "bio": "当代华严宗女性法嗣传承者。成一法师弟子。2005年获印度德里大学哲学博士。推动华严现代化转型：发行《华严乐坛》专辑、AI多媒体文创演绎五十三参。著有《华严学讲义》《华严净土思想与念佛法门》等。", "wk": ["华严学讲义", "华严净土思想与念佛法门"]}, {"id": "person_034", "n": "明度", "dy": "当代", "ti": "华严莲社第七任住持", "li": "华严莲社", "tp": "patriarch", "b": null, "d": null, "bio": "贤度法师之后，续掌华严莲社。贤首宗'明众生本际，悟诸佛果源'演字辈之一。", "wk": []}, {"id": "person_041", "n": "钦因", "dy": "当代", "ti": "贤首宗第四十一世·高原法系第十七世", "li": "贤首宗高原法系", "tp": "patriarch", "b": null, "d": null, "bio": "台湾树林福慧寺住持。贤首宗高原法系第四十一世传人（高原明昱为第25世）。2008年8月30日将华严宗衣钵传予海云继梦。另传法嗣予大慧法师、果峻法师、净严法师、宏慧法师等。演字：'明众生本际，悟诸佛果源'。", "wk": []}, {"id": "person_042", "n": "海云继梦", "dy": "当代", "ti": "三脉汇一的当代华严传承者·大华严寺导师", "li": "普贤乘华严宗", "tp": "patriarch", "b": 1950, "d": null, "bio": "俗名陈鹤山，台湾宜兰人。中兴大学经济系毕业。1991年于梦参长老座下出家（临济宗第四十七代，法名昌一，号继梦）。2008年受钦因长老传华严宗衣钵（贤首宗第四十二世）。同年得印度胜师子王菩萨传大乘瑜伽行法。汇三脉归一，开创'普贤乘华严宗'，复兴失传八百余年的'东山法门'。现为南投大华严寺导师。建立'无", "wk": []}, {"id": "person_043", "n": "体佛", "dy": "当代", "ti": "贤首禅苑", "li": "贤首宗高原法系", "tp": "patriarch", "b": null, "d": null, "bio": "钦因长老法嗣之一。创立贤首禅苑，弘扬华严禅法。", "wk": []}, {"id": "person_019", "n": "梦参", "dy": "当代", "ti": "当代华严弘扬巨擘", "li": "临济宗", "tp": "practitioner", "b": 1915, "d": 2017, "bio": "当代高僧，临济宗第四十六代。曾于五台山闭关修行多年。晚年大力弘扬《华严经》，讲说全本《八十华严》影响深远。1991年破例为海云继梦剃度（梦中得地藏菩萨示现），赐法名昌一。", "wk": ["华严经讲记（全本）"]}, {"id": "person_014", "n": "慈舟", "dy": "近现代", "ti": "", "li": "慈舟系", "tp": "scholar", "b": 1877, "d": 1958, "bio": "近代华严学者。长期于北京广济寺、济南等地讲说华严。著《华严经普贤行愿品亲闻记》，对《普贤行愿品》在现代的弘扬有重要推动。", "wk": ["华严经普贤行愿品亲闻记"]}, {"id": "person_044", "n": "真禅", "dy": "当代", "ti": "大陆当代华严禅实践者", "li": "临济宗", "tp": "patriarch", "b": 1916, "d": 1995, "bio": "当代大陆弘扬华严的代表性高僧。'禅宗临济、教在华严、行归地藏普贤'。师承应慈法师。1980年代后在玉佛寺多次主持华严佛七法会，宣讲《普贤行愿品》《十地品》。著有《玉佛丈室集》十集。", "wk": ["玉佛丈室集"]}, {"id": "person_045", "n": "如孝", "dy": "当代", "ti": "华严宗第四十一世法脉传人", "li": "华严宗", "tp": "scholar", "b": null, "d": null, "bio": "当代华严思想学者。师承星云长老、传印长老、法映长老。十余年研究华严思想当代实践。提出'别教一乘三类体系''法界十门体系''八纲体系'等。著有《生命的艺术》《修行的艺术》等丛书。2024年在《三秦宗教》刊发论文。", "wk": ["生命的艺术", "修行的艺术"]}, {"id": "person_046", "n": "雪窦", "dy": "当代", "ti": "美国华严莲社", "li": null, "tp": "scholar", "b": null, "d": null, "bio": "美国华严莲社相关人员，推动华严教法在海外英语世界的传播。", "wk": []}, {"id": "person_020", "n": "胜友", "dy": "唐", "ti": "藏译华严经主译之一", "li": null, "tp": "translator", "b": null, "d": null, "bio": "印度译师。与智军（Ye shes sde）、遍照护（Vairocana）约9世纪初将《华严经》译为藏文（德格版Toh 44）。译自中亚于阗原本。", "wk": ["藏译华严经（Toh 44）"]}, {"id": "person_020b", "n": "智军", "dy": "唐", "ti": "藏译华严经主译之一", "li": null, "tp": "translator", "b": null, "d": null, "bio": "吐蕃著名译师。与印度胜友合作将《华严经》从于阗本译为藏文。为吐蕃王朝佛教翻译事业的核心人物。", "wk": ["藏译华严经（Toh 44）"]}, {"id": "person_050", "n": "审祥", "dy": "唐/日本", "ti": "日本华严宗初传", "li": "日本华严", "tp": "patriarch", "b": null, "d": 742, "bio": "新罗僧。来华从法藏学华严。后赴日本，于东大寺宣讲《华严经》，为日本华严宗之初传。", "wk": []}, {"id": "person_j01", "n": "良弁", "dy": "唐/日本", "ti": "东大寺初代别当", "li": "日本华严", "tp": "patriarch", "b": 689, "d": 773, "bio": "审祥弟子。东大寺开山。主持《华严经》讲说。", "wk": []}, {"id": "person_j02", "n": "实忠", "dy": "日本", "ti": "东大寺二代", "li": "日本华严", " function onMD(e){if(e.target.tagName==="CANVAS"){tl.drag=true;tl.lastX=e.clientX;}}
function onMM(e){
  if(!tl.drag){
    var p=document.getElementById("tl-panel"),r=p.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    var hit=tl.hitRects.find(function(h){return mx>=h.x&&mx<=h.x+h.w&&my>=h.y&&my<=h.y+h.h;});
    var tip=document.getElementById("tl-tooltip");
    if(hit){var pp=hit.person;tip.style.opacity="1";tip.innerHTML="<h3>"+pp.n+"</h3>"+(pp.ti||"")+" · "+pp.dy+" · "+(pp.b||"?")+"–"+(pp.d||"?");tip.style.left=(e.pageX+14)+"px";tip.style.top=(e.pageY-20)+"px";}
    else{tip.style.opacity="0";}
    return;
  }
  var dx=e.clientX-tl.lastX;tl.ox+=dx;tl.lastX=e.clientX;drawTL(selectedId);
}
function onMU(){tl.drag=false;}
function onClick(e){
  if(tl.drag||Math.abs(e.clientX-tl.lastX)>3)return;
  var p=document.getElementById("tl-panel"),r=p.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  var hit=tl.hitRects.find(function(h){return mx>=h.x&&mx<=h.x+h.w&&my>=h.y&&my<=h.y+h.h;});
  if(hit){selectPerson(hit.person.id);}else{clearSelection();}
}

function switchTab(tab){
  document.querySelectorAll("#tabs button").forEach(function(b){b.classList.remove("active");});

  document.querySelectorAll(".tab-content").forEach(function(t){t.classList.remove("active");});

}
