RI/EEG第三人称数据，佛教禅修依赖第一人称实证。计算现象学试图桥接二者但缺乏公认的形式化框架。"}, {"title": "诠释风险", "description": "将华严「事事无碍」简单类比为量子纠缠或神经网络全息性，存在严重过度诠释。华严「法界缘起」是证量境界描述，非物理学理论模型。"}], "papers_2026": ["EN: Seth, A. et al. Consciousness in AI: Benchmarks and Frameworks. Nature Machine Intelligence (2026).", "ZH: 李恒威等. 《意识科学与人工智能——从困难问题到组合问题》. 中国社会科学 (2026).", "EN: 84000 Project. The Ten Bhumis (Toh44-31) Translation & Textual Notes. 84000.co (2021-2026)."], "papers_2025": ["EN: Vervaeke, J. & Ferraro, C. Relevance Realization and the Buddhist Path. Journal of Consciousness Studies (2025).", "EN: Metzinger, T. The Elephant and the Blind: The Experience of Pure Consciousness. MIT Press (2025).", "ZH: 何欢欢. 《佛教因明学与当代逻辑学对话》. 哲学研究 (2025)."], "papers_2024": ["EN: Laukkonen, R. et al. Cessation Events During Meditation: Phenomenology and Neural Correlates. NeuroImage (2024).", "EN: Millière, R. et al. Deep Meditation and the Predictive Brain. Trends in Cognitive Sciences (2024).", "DE: Brückner, H. Hua-yan Buddhismus und Systemtheorie. Verlag Karl Alber (2024).", "ZH: 王颂. 《华严宗「法界缘起」的现代诠释》. 世界宗教研究 (2024)."], "papers_2023": ["EN: Dorjee, D. Defining Consciousness: Insights from Buddhism and Neuroscience. Progress in Brain Research (2023).", "ZH: 周理乾. 《计算现象学与佛学禅观的形式化》. 自然辩证法通讯 (2023).", "EN: Bronkhorst, J. How the Brahmins Won: From Alexander to the Guptas (含华严经形成史讨论). Brill (2023)."], "disclaimer": "⚠ 注: 文献综述为定期更新板块。所列论文基于公开可获取的学术数据库（Google Scholar/PhilPapers/CNKI）。部分论文的华严关联解读属于本项目的诠释性建构。"}};
var SPIRIT_DATA = {"sections": [{"id": "overview", "title": "灵性仁本·澄明永续", "icon": "🌱", "summary": "以华严「一心法界」为根基，融汇灵性经济学、人本经济学、修行传统与本土知识体系，\n探索人类文明在二十一世纪的永续之道。澄明自性，仁泽众生——灵性不是出世的逃避，\n而是入世转化文明的根本力量。\n"}, {"id": "spiritual_economics", "title": "灵性经济学·海云体系", "icon": "💎", "intro": "海云继梦法师（贤首宗高原法系第四十二世传人）提出「灵性经济学」——\n不是关于「灵性」的附加学问，而是以灵性为文明之根本的经济学范式转换。\n从「以物质为基础」转向「以生命（灵性）为基础」的文明重构。\n", "topics": [{"title": "灵性经济学的核心命题", "body": "海云法师指出：当代全球危机的根源在于「以物质欲望为驱动」的经济模式。\n灵性经济学的核心追问是——「经济活动的终极目的是什么？」\n不是GDP增长，不是物质积累，而是每一个生命的觉醒与圆满。\n华严「一即一切」为此提供了宇宙论基础：每一个体的经济行为都影响着法界全体。\n因此，经济活动本质上是灵性实践——「一切资生事业皆是佛法」（《华严经》）。\n"}, {"title": "从「竞争」到「共生」的范式转换", "body": "传统经济学预设「资源稀缺」与「理性自利」，驱动竞争与增长。\n灵性经济学指认：真正稀缺的不是物质资源，而是觉醒的心灵。\n华严「因陀罗网」揭示——法界中每一节点都含摄全体，\n共生(conviviality)而非竞争才是存在的根本形式。\n实践层面：从「拥有更多」转向「成为更多」——生命品质的提升替代物质数量的膨胀。\n"}, {"title": "第四波工业革命与灵性文明", "body": "海云法师预判：人类文明经历「农业革命→工业革命→信息革命→灵性革命」四个阶段。\n第四波不是技术革命，而是意识革命——从「外在工具」转向「内在觉醒」。\nAI与自动化将物质生产推向极限效率，而人类的独特价值将回归灵性——\n创造力、慈悲心、觉照力、审美力——这些是AI无法替代的「灵性维度」。\n"}, {"title": "灵性GDP：新的文明度量", "body": "海云法师提出替代GDP的度量体系：灵性GDP衡量一个社会的——\n觉醒指数（禅修普及率）、慈悲指数（志愿服务率）、\n智慧指数（教育资源投入）、和谐指数（冲突化解率）。\n正如不丹的「国民幸福总值」(GNH)，灵性GDP将「生命品质」重新确立为发展的终极目标。\n"}]}, {"id": "humanistic_economics", "title": "人本经济学·佛经经济学", "icon": "📐", "intro": "从E.F. Schumacher的「佛教经济学」到当代的后增长(Post-Growth)运动，\n人本经济学传统为灵性仁本提供了丰富的思想资源与实践案例。\n", "topics": [{"title": "Schumacher《小即是美》与佛教经济学", "body": "E.F. Schumacher(1911-1977)在《Small Is Beautiful》(1973)中首次提出「佛教经济学」——\n以「正命」(Right Livelihood)为核心的另类经济学范式。\n核心理念：工作不仅是谋生手段，更是人格发展与心灵成长的途径；\n消费的目的不是最大化，而是满足真实需求后的「知足」(contentment)。\nSchumacher深受缅甸佛教经济学家在「第三世界发展」讨论中的影响——\n其「中间技术」(Intermediate Technology)理念与华严「事事无碍」在\n「因地制宜、因缘和合」的方法论上有深层共鸣。\n"}, {"title": "正命(Right Livelihood)：八正道中的经济学", "body": "佛陀在八正道中单列「正命」——谋生方式本身就是修行。\n正命的五个标准：(1)不伤害生命(不贩卖武器/肉/毒/酒/奴隶)；\n(2)不欺骗(如实标示)；(3)不过度消费(少欲知足)；\n(4)利益众生(服务导向)；(5)与法和合(符合智慧与慈悲)。\n这五条标准为当代「伦理消费」「社会企业」「B-Corp」提供了\n两千五百年历史的深彻根基。\n"}, {"title": "后增长(Post-Growth)与去增长(Degrowth)", "body": "21世纪的后增长运动（Tim Jackson《无增长的繁荣》、Kate Raworth《甜甜圈经济学》、\nGiorgos Kallis《去增长》）与佛教经济学的「知足」理念高度一致。\n华严「事事无碍」为后增长提供了超越「增长vs衰退」二元对立的宇宙观——\n真正的繁荣不依赖于物质的无限扩张，而在于法界中一切存在的相即相入与圆满互摄。\n"}, {"title": "人本经济学的全球实践", "body": "• 不丹GNH(国民幸福总值)：以佛教价值观替代GDP作为发展指标\n• 日本里山(Satoyama)倡议：传统社区与自然共生的可持续模式\n• 意大利慢食(Slow Food)运动：从「效率最大化」回归「品质与关系」\n• 全球生态村网络(GEN)：以灵性/生态/社区三支柱重建人类聚落\n• 佛教Tzu Chi基金会：以「感恩经济」驱动的全球慈善循环\n"}]}, {"id": "contemplative_traditions", "title": "修行传统与永续发展", "icon": "🧘", "intro": "世界各大修行传统（佛教、道家、印度瑜伽、基督教隐修、苏菲、原住民灵性）\n蕴含着丰富的生态智慧与永续实践——这些传统不是「过去」的遗物，\n而是应对当代生态危机与意义危机的深层资源。\n", "topics": [{"title": "佛教生态智慧：从缘起到共生", "body": "佛教缘起法——「此有故彼有，此无故彼无」——是最古老的生态哲学。\n一切事物相互依存、相互关联，没有孤立的存在。\n一行禅师(Thích Nhất Hạnh)「互即互入」(Interbeing)发展了缘起法的生态维度：\n「一片云中有一杯茶」——云、雨、土壤、茶农、饮者……无尽因缘共同构成了「一杯茶」。\n泰国「森林僧传统」(Forest Monks)通过「树木授戒」(Tree Ordination)\n将环保行动整合为宗教仪式——将森林保护提升至「护生」的戒律层面。\n不丹宪法规定森林覆盖率不低于60%——佛教国家将生态永续写入根本大法。\n"}, {"title": "道家与深层生态学", "body": "道家「道法自然」「无为而治」与深层生态学(Deep Ecology)的核心理念高度契合。\nArne Næss的「生态智慧T」(Ecosophy T)明确受到老子与斯宾诺莎的启发——\n以「自我实现」(Self-realization)的扩展为核心，从小我→社会我→生态我→宇宙我。\n这与华严「从初发心到法身大士」的修行历程在扩展「自我边界」上有结构对应：\n初信=小我意识→十信=社会意识→十住=生态意识→十地=宇宙意识→等觉=法界意识。\n"}, {"title": "原住民灵性与地球伦理", "body": "全球原住民仅占世界人口约5%，却保护着地球80%的生物多样性（UNESCO数据）。\n这不是巧合——原住民的灵性传统以「土地为神圣」「万物有灵」「七代责任」为核心。\n毛利人的「Kaitiakitanga」(守护者责任)、安第斯「Pachamama」(大地母亲)、\n北美原住民「七代原则」(Seven Generations)——每一个决策必须考虑对未来七代的影响。\n2017年新西兰赋予Whanganui河流「法律人格」——原住民法理与现代环境法的突破性融合。\n华严「无情有性」（无生命之物也有佛性）与此深度共鸣。\n"}, {"title": "修行传统的气候行动", "body": "2015年佛教《气候变化宣言》由达赖喇嘛与一行禅师联署，呼吁全球佛教徒参与气候行动。\n伊斯兰《清洁能源宣言》、印度教《Bhumi Devi(大地女神)宣言》、\n东正教《绿色宣言》(君士坦丁堡宗主教巴多罗买被称为「绿色宗主教」)——\n全球宗教传统正在将灵性洞见转化为气候行动的伦理基础。\n华严的「理事无碍」为此提供了整合框架：理=灵性洞见，事=具体行动，二者圆融无碍。\n"}]}, {"id": "indigenous_knowledge", "title": "本土知识体系·多元智慧", "icon": "🌏", "intro": "「本土知识」(Indigenous Knowledge)不是「原始的」或「过时的」——\n它是人类数千年与特定生态系统共生的精炼智慧。联合国IPBES(生物多样性与生态系统服务\n政府间平台)已将本土知识正式纳入全球评估框架。\n", "topics": [{"title": "本土知识的认识论地位", "body": "现代科学以「客观」「可复现」「普遍性」为标准——本土知识则以\n「关系性」「口传」「在地性」为特征。二者不是高下之分，而是不同的认知方式(Ways of Knowing)。\n华严「事事无碍」为此提供了包容性的认识论框架：\n科学知识（一事）、本土知识（另一事）——在法界中各自有其合法性与界限，\n互不相碍而能相资为用。正如法藏大师「六相圆融」所示：总别同异成坏——\n科学与本土知识互为「总/别」，在不同的脉络中各为「总」。\n"}, {"title": "中国传统中的生态智慧", "body": "中国二十四节气——世界上最古老、最完整的「物候历」——将天文、气候、\n农业、饮食、养生整合为一个动态的生态时间体系。\n2016年二十四节气入选UNESCO人类非物质文化遗产。\n中国传统农书的生态智慧：《齐民要术》《农政全书》记录了两千年\n的可持续农业实践——轮作、绿肥、天敌除虫——比现代有机农业早了一千多年。\n华严宗的「华严时」(一套以《华严经》为时间坐标的历法观)与此有深度亲和——\n「一念万年」「三世一时」的时间观超越了线性进步主义的时间观。\n"}, {"title": "全球本土知识案例", "body": "• 印度「神圣树林」(Sacred Groves)：数千片被宗教禁忌保护的原始森林——印度最早的「自然保护区」\n• 安第斯「ayllu」社区体系：以互惠(ayni)为核心的生态-社会-灵性共同体\n• 西非「Sankofa」哲学（加纳Akan族）：回顾过去以走向未来——传统智慧是未来的资源\n• 日本「镇守之森」：神社周边的原生林——日本最古老的森林保护制度\n• 蒙古「Ovoo」：游牧民族以敖包祭祀维护草原生态平衡\n• 澳大利亚原住民「歌之途」(Songlines)：以歌谣记录地形、水源、物种——活的地图与百科全书\n"}, {"title": "华严与本土知识的汇通之路", "body": "华严「六相圆融」为本土知识与现代性的互摄提供了独特的哲学框架：\n「总」(二者皆为人类智慧遗产)、「别」(各有方法论的独立性)、\n「同」(皆指向生命永续)、「异」(认识论路径不同)、\n「成」(互补互成)、「坏」(各自皆有局限)。\n法藏大师曰：「一切法门无尽海，同会一法道场中」——\n本土知识不必被现代科学「证明」才有价值，\n正如现代科学不必被本土传统「认可」才有合法性。\n二者在「灵性仁本」的道场中平等交辉。\n"}]}, {"id": "practice", "title": "澄明永续·人间实践", "icon": "🙏", "intro": "从理念到行动——灵性仁本不是书斋哲学，而是转化为具体的人间实践。\n全球已有众多以灵性/人本/生态/本土知识为驱动力的社区、组织与运动。\n", "topics": [{"title": "灵性共同体与生态村运动", "body": "全球生态村网络(GEN)已有超过10,000个注册社区，以「灵性·生态·社群·经济」\n四维重建人类聚落。苏格兰Findhorn生态村(始于1962)——以灵性实践\n（与自然灵沟通）驱动沙漠变绿洲；印度Auroville(1968)——以Sri Aurobindo\n的「整体瑜伽」为灵性根基的全球城市实验。\n华严的「事事无碍」为生态村的多维实践提供了整合哲学——\n灵性不是社区的「一项活动」，而是贯穿生态/社群/经济的底色。\n"}, {"title": "人本教育：从「培训」到「觉醒」", "body": "灵性仁本的教育不是「灌输知识」而是「开启觉性」。\n一行禅师创办的「Wake Up Schools」——将正念融入课堂，已在全球上千所学校推行。\n泰国Sathya Sai学校——以「人类价值教育」(Educare)替代应试教育。\n芬兰现象教学法——虽非宗教灵性但以「全人发展」为核心，暗合灵性仁本的人本精神。\n华严「善财童子五十三参」是终极的人本教育隐喻——善财参访五十三位善知识\n（各行各业、男女老少、在家出家），在真实生活中学习法界智慧。\n"}, {"title": "灵性仁本宣言", "body": "综合灵性经济学、人本经济学、修行传统、本土知识体系的核心理念，\n灵性仁本的实践原则可归纳为——\n① 生命为本：经济活动服务于生命觉醒，非反之\n② 知足为富：「够用」比「更多」更富足\n③ 关系为实：存在的本质是互即互入，非孤立的个体\n④ 传统为源：修行传统与本土知识是未来的资源，非过去的遗物\n⑤ 澄明为道：自心的澄明是一切外在澄明的基础\n⑥ 永续为果：在法界中，每一念澄明的增长即法界永续的增长\n此六条不构成封闭体系——正如华严「善财五十三参」所示，\n灵性仁本永远向更多的智慧传统、更多的人类经验开放。\n"}]}], "references": [{"title": "海云继梦法师「灵性经济学」系列演讲", "source": "大华严寺 · YouTube · 讲记逐字稿"}, {"title": "E.F. Schumacher《小即是美》(Small Is Beautiful)", "source": "Harper & Row, 1973; 中译本: 商务印书馆"}, {"title": "Tim Jackson《无增长的繁荣》(Prosperity Without Growth)", "source": "Routledge, 2009/2017第二版"}, {"title": "Kate Raworth《甜甜圈经济学》(Doughnut Economics)", "source": "Random House, 2017"}, {"title": "一行禅师《活得安详》(Being Peace)", "source": "Parallax Press, 1987"}, {"title": "Arne Næss《生态学、共同体与生活方式》(Ecology, Community and Lifestyle)", "source": "Cambridge University Press, 1989"}, {"title": "Fritjof Capra & Pier Luigi Luisi《生命的系统观》(The Systems View of Life)", "source": "Cambridge University Press, 2014"}, {"title": "UNESCO《本土知识与可持续发展》政策简报系列", "source": "UNESCO, 2017-2025"}, {"title": "IPBES《全球生物多样性与生态系统服务评估报告》", "source": "IPBES, 2019"}, {"title": "不丹GNH中心《国民幸福总值指标框架》", "source": "Centre for Bhutan Studies & GNH Research"}, {"title": "Giorgos Kallis《去增长》(Degrowth)", "source": "Agenda Publishing, 2018"}, {"title": "Charles Eisenstein《神圣经济学》(Sacred Economics)", "source": "Evolver Editions, 2011"}, {"title": "Thich Nhat Hanh《Zen and the Art of Saving the Planet》", "source": "HarperOne, 2021"}, {"title": "道家生态思想：《老子》《庄子》相关章句", "source": "王弼注《老子道德经注》· 郭象注《庄子注》"}, {"title": "加拿大真相与和解委员会《原住民寄宿学校最终报告》(TRC)", "source": "Truth and Reconciliation Commission of Canada, 2015"}]};
var BIBLIOGRAPHY = {"sutras": [{"id": "avatamsaka-80", "title_zh": "大方广佛华严经（八十华严）", "title_sa": "Buddhāvataṃsaka Sūtra (महावैपुल्यबुद्धावतंसकसूत्र)", "title_en": "The Flower Ornament Scripture (80 fascicles)", "translator": "唐·实叉难陀 (Śikṣānanda)", "year": "695–699 CE", "dynasty": "唐 (Tang)", "canon_ref": "大正藏 T10n0279", "quote_original": "「心如工画师，能画诸世间。五蕴悉从生，无法而不造。」\n——《华严经·夜摩天宫偈赞品》(T10n0279, 卷十九)\n", "quote_en": "\"The mind is like a painter, able to paint all the worlds.\nThe five aggregates are born from it; there is nothing it does not create.\"\n— Avataṃsaka Sūtra, Ch. on Verses in the Suyāma Heaven Palace (Ch.19, tr. Thomas Cleary)\n", "links": {"cbeta_online": "https://cbetaonline.dila.edu.tw/zh/T10n0279", "cbeta_tripitaka": "https://tripitaka.cbeta.org/T10n0279", "cbeta_pdf": "http://buddhism.lib.ntu.edu.tw/FULLTEXT/sutra/chi_pdf/sutra5/T10n0279.pdf"}, "tags": ["lineage", "gap", "cosmology", "frontier", "spirit"]}, {"id": "fazang-wujiaozhang", "title_zh": "华严一乘教义分齐章（华严五教章）", "title_en": "Treatise on the Doctrinal Distinctions of the Huayan One Vehicle", "author_zh": "唐·法藏 (贤首国师, 643–712)", "year": "c. 680–700 CE", "dynasty": "唐 (Tang)", "canon_ref": "大正藏 T45n1866", "quote_original": "「一即一切，一切即一。」\n——法藏《华严一乘教义分齐章》/《金师子章》\n", "quote_en": "\"One is all; all is one.\"\n— Fazang, Treatise on the Golden Lion / Huayan Wujiao Zhang\n", "links": {"cbeta_online": "https://cbetaonline.dila.edu.tw/zh/T45n1866"}, "tags": ["lineage", "gap", "frontier"]}, {"id": "toh44-ten-bhumis", "title_bo": "ཕགས་པ་ས་བཅུ་པའི་མདོ། ('phags pa sa bcu pa'i mdo)", "title_sa": "Daśabhūmika-sūtra (दशभूमिकसूत्र)", "title_zh": "十地经（藏文《华严经》第31品）", "title_en": "The Ten Bhūmis (Toh 44-31)", "translator_en": "Peter Alan Roberts (from Tibetan, with Sanskrit reference)", "year": "2021–2026", "publisher": "84000: Translating the Words of the Buddha", "canon_ref": "德格版甘珠尔 Toh 44-31", "quote_original": "The bodhisattva progresses through ten stages (bhūmis), beginning with\nthe Joyous (Pramuditā) and culminating in the Cloud of Dharma (Dharmameghā).\n", "quote_zh": "菩萨次第经历十地，从欢喜地（Pramuditā）至于法云地（Dharmameghā）。\n", "links": {"official": "https://read.84000.co/translation/toh44-31.html", "chinese": "https://84000.co/translation/toh44-31?lang=zh", "pdf": "https://direct-read.84000.co/data/toh44-31_84000-the-ten-bhumis.pdf"}, "tags": ["gap", "frontier"]}, {"id": "laozi-daodejing", "title_zh": "老子道德经", "title_en": "Tao Te Ching (The Classic of the Way and Virtue)", "author_zh": "老子 (Lǎozǐ)", "year": "c. 6th–4th century BCE", "dynasty": "春秋/战国", "quote_original": "人法地，地法天，天法道，道法自然。\n——《老子》第二十五章\n", "quote_en": "\"Man models himself on Earth, Earth on Heaven, Heaven on the Way,\nand the Way on that which is naturally so.\" (tr. D.C. Lau)\n", "links": {"ctext": "https://ctext.org/dao-de-jing"}, "tags": ["spirit"]}, {"id": "zhuangzi-qiwulun", "title_zh": "庄子·齐物论", "title_en": "Zhuangzi — Discussion on Making All Things Equal", "author_zh": "庄子 (Zhuāngzǐ)", "year": "c. 4th–3rd century BCE", "dynasty": "战国", "quote_original": "天地与我并生，万物与我为一。\n——《庄子·齐物论》\n", "quote_en": "\"Heaven and earth were born together with me,\nand the ten thousand things and I are one.\" (tr. Burton Watson)\n", "links": {"ctext": "https://ctext.org/zhuangzi"}, "tags": ["spirit", "frontier"]}], "books": [{"id": "schumacher-small-is-beautiful", "title_en": "Small Is Beautiful: Economics As If People Mattered", "title_zh": "小的是美好的", "author_en": "E.F. Schumacher", "author_zh": "E.F. 舒马赫", "year": 1973, "publisher": "Harper & Row (US); Blond & Briggs (UK)", "isbn": "978-0060803520", "quote_original": "\"The system of nature, of which man is a part, tends to be self-balancing,\nself-adjusting, self-cleansing. Not so with technology.\" (Part II, Ch.5)\n\n\"The Buddhist economist would consider this approach excessively irrational:\nsince consumption is merely a means to human well-being, the aim should be\nto obtain the maximum of well-being with the minimum of consumption.\"\n— \"Buddhist Economics\" (Ch.4)\n", "quote_zh": "「自然系统——人类是其一部分——趋向于自我平衡、自我调节、自我净化。\n技术则不然。」（第二部分·第五章）\n\n「佛教经济学家会认为这种进路极不合理：消费只是达致人类福祉的手段，\n目标应以最少的消费获得最大的福祉。」——第四章「佛教经济学」\n", "links": {"official": "https://centerforneweconomics.org", "buddhist_economics_full": "https://centerforneweconomics.org/publications/buddhist-economics/", "translations": "https://centerforneweconomics.org/publications/buddhist-economics-translations/", "goodreads": "https://www.goodreads.com/book/show/1117634.Small_Is_Beautiful", "douban_2010": "https://book.douban.com/subject/5410025/", "douban_2007": "https://book.douban.com/subject/2004425/", "douban_2022": "https://book.douban.com/subject/35918478/"}, "goodreads_rating": {"score": 4.09, "ratings": 7178, "reviews": 765}, "douban_rating": {"score": 8.1, "note": "2022四川人民版; 2007译林版8.2 (578人); 1984商务版8.6 (257人)"}, "acclaim": "《泰晤士报文学增刊》评为二战后最具影响力的100本书之一", "tags": ["spirit"], "pages_tag": ["humanistic_economics"]}, {"id": "jackson-prosperity-without-growth", "title_en": "Prosperity Without Growth: Foundations for the Economy of Tomorrow", "title_zh": "无增长的繁荣", "author_en": "Tim Jackson", "author_zh": "蒂姆·杰克逊", "year": 2009, "year_edition_2": 2017, "publisher": "Routledge", "isbn": "978-1138935419", "quote_original": "\"Prosperity is not synonymous with material wealth. ...\nProsperity consists in our ability to flourish as human beings —\nwithin the ecological limits of a finite planet.\" (Ch.1, 2nd ed.)\n", "quote_zh": "「繁荣不等于物质财富。……繁荣在于我们作为人类在这个有限星球的\n生态边界内蓬勃发展的能力。」（第一章·第二版）\n", "links": {"official": "https://timjackson.org.uk/ecological-economics/pwg/", "routledge": "https://www.routledge.com/Prosperity-without-Growth-Foundations-forthe-Economy-of-Tomorrow-2nd/Jackson/p/book/9781138935419", "goodreads": "https://www.goodreads.com/book/show/34928259-prosperity-without-growth", "guardian_review": "https://www.theguardian.com/books/2010/jan/23/properity-without-growth-tim-jackson"}, "goodreads_rating": {"score": 3.59, "ratings": 41, "reviews": 5}, "translations": "18+ 语种", "tags": ["spirit"], "pages_tag": ["humanistic_economics"]}, {"id": "raworth-doughnut-economics", "title_en": "Doughnut Economics: Seven Ways to Think Like a 21st-Century Economist", "title_zh": "甜甜圈经济学", "author_en": "Kate Raworth", "author_zh": "凯特·拉沃斯", "year": 2017, "publisher": "Chelsea Green Publishing (US); Random House Business (UK)", "isbn": "978-1603586740", "quote_original": "\"Humanity's 21st century challenge is to meet the needs of all\nwithin the means of the planet. ... The Doughnut of social and\nplanetary boundaries is a playfully serious approach.\" (Introduction)\n", "quote_zh": "「人类在二十一世纪的挑战是：在地球的承载边界之内满足所有人的需求。……\n社会底线与行星边界的『甜甜圈』正是以严肃而有趣的方式框架这一挑战。」（导言）\n", "links": {"deal": "https://doughnuteconomics.org", "official": "https://www.kateraworth.com", "goodreads": "https://www.goodreads.com/book/show/29214420-doughnut-economics"}, "goodreads_rating": {"score": 4.16, "ratings": 16183, "reviews": 1784}, "tags": ["spirit"], "pages_tag": ["humanistic_economics"]}, {"id": "eisenstein-sacred-economics", "title_en": "Sacred Economics: Money, Gift, and Society in the Age of Transition", "title_zh": "神圣经济学", "author_en": "Charles Eisenstein", "author_zh": "查尔斯·爱森斯坦", "year": 2011, "publisher": "Evolver Editions", "isbn": "978-1583943977", "quote_original": "\"Money today is an instrument of the great forgetting. It embodies the story\nof separation. ... A sacred economy would embody a new story — the story of\ninterbeing.\" (Ch.1)\n", "quote_zh": "「今日的金钱是『大遗忘』的工具。它体现的是分离的故事。……\n神圣经济将体现一个新的故事——互即互入的故事。」（第一章）\n", "links": {"official": "http://sacred-economics.com", "goodreads": "https://www.goodreads.com/book/show/15712639-sacred-economics"}, "goodreads_rating": {"score": 3.96, "ratings": 421, "reviews": 24}, "tags": ["spirit"], "pages_tag": ["humanistic_economics"]}, {"id": "kallis-degrowth", "title_en": "Degrowth", "title_zh": "去增长", "author_en": "Giorgos Kallis", "author_zh": "乔尔戈斯·卡利斯", "year": 2018, "publisher": "Agenda Publishing", "isbn": "978-1911116790", "quote_original": "\"Degrowth is not the same as negative GDP growth in a growth economy. ...\nDegrowth signifies a desirable and democratic transition to a smaller economy\nwith less production and consumption.\" (Ch.1)\n", "quote_zh": "「去增长不等于增长经济中的GDP负增长。……去增长意味着一个令人向往的、\n民主的向更小规模经济——减少生产与消费——的转型。」（第一章）\n", "links": {"columbia": "https://cup.columbia.edu/book/degrowth/9781911116790/", "essays_free": "http://www.indefenseofdegrowth.com", "goodreads": "https://www.goodreads.com/book/show/35963725-degrowth"}, "tags": ["spirit"], "pages_tag": ["humanistic_economics"]}, {"id": "nhat-hanh-being-peace", "title_en": "Being Peace", "title_zh": "活得安详", "author_en": "Thích Nhất Hạnh", "author_zh": "一行禅师 (釋一行)", "year": 1987, "year_revised": 2005, "year_latest": 2024, "publisher": "Parallax Press", "isbn": "978-1952692765", "quote_original": "\"If we are peaceful, if we are happy, we can smile,\nand everyone in our family, our entire society,\nwill benefit from our peace.\"\n", "quote_zh": "「如果我们自身平和、快乐、能微笑，我们的家人、整个社会\n都会从我们的平和中获益。」\n", "links": {"official": "https://www.parallax.org/product/being-peace/", "goodreads": "https://www.goodreads.com/book/show/11082229-being-peace"}, "goodreads_rating": {"score": 3.93, "ratings": 1976, "reviews": 166}, "translations": "30+ 语种", "tags": ["spirit"], "pages_tag": ["contemplative_traditions"]}, {"id": "nhat-hanh-zen-saving-planet", "title_en": "Zen and the Art of Saving the Planet", "title_zh": "禅与拯救地球的艺术", "author_en": "Thích Nhất Hạnh", "author_zh": "一行禅师", "year": 2021, "publisher": "HarperOne", "isbn": "978-0062954794", "quote_original": "\"The one thing we all have the power to change is our own mind —\nour way of looking, seeing, and thinking determines our choices,\nour actions, and our relationships.\" (Part I)\n", "quote_zh": "「我们每个人都有力量改变的唯一一件事就是自己的心——\n我们看待、观察和思考的方式，决定了我们的选择、行动和关系。」（第一部分）\n", "links": {"harpercollins": "https://www.harpercollins.ca/9780062954831/zen-and-the-art-of-saving-the-planet/"}, "tags": ["spirit"], "pages_tag": ["contemplative_traditions"]}, {"id": "naess-ecology-community-lifestyle", "title_en": "Ecology, Community and Lifestyle: Outline of an Ecosophy", "title_zh": "生态学、共同体与生活方式——一种生态智慧纲要", "author_en": "Arne Næss", "author_zh": "阿恩·奈斯", "year": 1989, "publisher": "Cambridge University Press", "isbn": "978-0521348737", "doi": "10.1017/CBO9780511525599", "quote_original": "\"The right of all forms [of life] to live is a universal right which cannot\nbe quantified. No single species of living being has more of this particular\nright to live and unfold than any other species.\" (Ecosophy T, Principle 2)\n", "quote_zh": "「一切生命形态的生存权利是一不可量化的普遍权利。没有任何一个物种\n比其他物种拥有更多生存与发展的权利。」（生态智慧T·原则二）\n", "links": {"cambridge": "https://www.cambridge.org/pk/universitypress/subjects/life-sciences/ecology-and-conservation/ecology-community-and-lifestyle-outline-ecosophy", "goodreads": "https://www.goodreads.com/book/show/702150.Ecology_Community_and_Lifestyle"}, "goodreads_rating": {"score": 3.22, "ratings": 9, "reviews": 1}, "tags": ["spirit"], "pages_tag": ["contemplative_traditions"]}, {"id": "capra-luisi-systems-view-of-life", "title_en": "The Systems View of Life: A Unifying Vision", "title_zh": "生命的系统观——一种统一的视野", "author_en": "Fritjof Capra & Pier Luigi Luisi", "author_zh": "弗里乔夫·卡普拉 & 皮尔·路易吉·路易西", "year": 2014, "publisher": "Cambridge University Press", "isbn": "978-1107011366", "doi": "10.1017/CBO9780511895555", "quote_original": "\"The new vision of reality ... is a spiritual vision in its very essence. ...\nThe systems view of life is a comprehensive, unified vision that integrates\nlife's biological, cognitive, social, and ecological dimensions.\" (Preface & Ch.18)\n", "quote_zh": "「对实在的新洞见……在其本质上是灵性的洞见。……生命的系统观是一种整全的、\n统一的视野，整合了生命的生物、认知、社会和生态维度。」（序言 & 第十八章）\n", "links": {"cambridge": "https://www.cambridge.org/us/universitypress/subjects/life-sciences/genomics-bioinformatics-and-systems-biology/systems-view-life-unifying-vision", "goodreads": "https://www.goodreads.com/book/show/30231828-the-systems-view-of-life"}, "goodreads_rating": {"score": 5.0, "ratings": 1, "reviews": 0, "note": "仅1人评分，数据不足"}, "tags": ["spirit"], "pages_tag": ["contemplative_traditions"]}, {"id": "varela-embodied-mind", "title_en": "The Embodied Mind: Cognitive Science and Human Experience", "title_zh": "具身心智——认知科学与人类经验", "author_en": "Francisco J. Varela, Evan Thompson & Eleanor Rosch", "author_zh": "弗朗西斯科·瓦雷拉、埃文·汤普森、埃莉诺·罗施", "year": 1991, "year_revised": 2017, "publisher": "MIT Press", "isbn": "978-0262529365", "quote_original": "\"We propose a fundamental circularity: the world is enacted through our\nembodied action, and our embodied action is shaped by the world.\"\n(Part IV, Ch.8 — Enaction: Embodied Cognition)\n", "quote_zh": "「我们提出一个根本的循环性：世界通过我们具身的行动而被生成(enacted)，\n而我们的具身行动又被世界所塑造。」\n（第四部分·第八章——生成：具身认知）\n", "links": {"mitpress": "https://mitpress.mit.edu/9780262720212/the-embodied-mind/", "goodreads": "https://www.goodreads.com/book/show/251117.The_Embodied_Mind"}, "goodreads_rating": {"score": 3.61, "ratings": 287, "reviews": 24}, "scholar_citations": "~6,000", "tags": ["frontier"], "pages_tag": ["计算现象学", "心灵哲学", "意识科学"]}, {"id": "metzinger-being-no-one", "title_en": "Being No One: The Self-Model Theory of Subjectivity", "title_zh": "无人——自我的现象模型理论", "author_en": "Thomas Metzinger", "author_zh": "托马斯·梅青格", "year": 2003, "publisher": "MIT Press (Bradford Books)", "isbn": "978-0262633086", "quote_original": "\"Nobody ever was or had a self. All that ever existed were conscious\nself-models that could not be recognized as models.\" (Ch.1)\n", "quote_zh": "「从未有人拥有过『自我』。所有存在过的只是一些无法被辨识为模型的\n意识自我模型。」（第一章）\n", "links": {"mitpress": "https://mitpress.mit.edu/9780262633086/being-no-one/", "goodreads": "https://www.goodreads.com/book/show/123905.Being_No_One"}, "goodreads_rating": {"score": 4.25, "ratings": 103, "reviews": 2}, "scholar_citations_total": "~4,822 (作者总计79篇出版物)", "tags": ["frontier"], "pages_tag": ["计算现象学", "心灵哲学"]}, {"id": "chalmers-conscious-mind", "title_en": "The Conscious Mind: In Search of a Fundamental Theory", "title_zh": "有意识的心——探寻根本理论", "author_en": "David J. Chalmers", "author_zh": "大卫·查尔默斯", "year": 1996, "publisher": "Oxford University Press", "isbn": "978-0195117899", "quote_original": "\"Why should physical processing give rise to a rich inner life at all? ...\nThe really hard problem of consciousness is the problem of experience.\" (Ch.1)\n", "quote_zh": "「物理过程为何会产生丰富的内在体验？……\n意识真正的困难问题（Hard Problem）是体验的问题。」（第一章）\n", "links": {"goodreads": "https://www.goodreads.com/book/show/18828.The_Conscious_Mind"}, "goodreads_rating": {"score": 3.57, "ratings": 11559, "reviews": 704}, "scholar_citations": "~16,100 (Google Scholar)", "acclaim": "二战后心灵哲学领域被引最高的英文专著之一 (Leiter Reports, 2026)", "tags": ["frontier"], "pages_tag": ["心灵哲学"]}, {"id": "seth-being-you", "title_en": "Being You: A New Science of Consciousness", "title_zh": "成为你——意识的新科学", "author_en": "Anil Seth", "author_zh": "阿尼尔·赛斯", "year": 2021, "publisher": "Faber & Faber (UK); Dutton (US)", "isbn": "978-0571337705", "quote_original": "\"Consciousness is not about being intelligent; it's about being alive. ...\nPerception is a controlled hallucination — a fantasy that coincides\nwith reality.\" (Ch.1 & Ch.7)\n", "quote_zh": "「意识关键不在于智能，而在于活着。……感知是一种受控的幻觉——\n一种碰巧与实在相吻合的幻想。」（第一章 & 第七章）\n", "links": {"official": "https://www.anilseth.com", "cambridge_alumni": "https://www.alumni.cam.ac.uk/benefits/book-shelf/being-you-a-new-science-of-consciousness", "goodreads": "https://www.goodreads.com/book/show/55976678-being-you"}, "goodreads_rating": {"score": 4.33, "ratings": 15, "reviews": 4}, "acclaim": "Sunday Times Top 10 Bestseller; Guardian/Economist/New Statesman/FT 2021年度选书", "tags": ["frontier"], "pages_tag": ["神经科学", "心灵哲学"]}, {"id": "davidson-goleman-altered-traits", "title_en": "Altered Traits: Science Reveals How Meditation Changes Your Mind, Brain, and Body", "title_zh": "转化之性——科学揭示禅修如何改变心智、大脑与身体", "author_en": "Daniel Goleman & Richard J. Davidson", "author_zh": "丹尼尔·戈尔曼 & 理查德·戴维森", "year": 2017, "publisher": "Avery (Penguin Random House)", "isbn": "978-0399184383", "quote_original": "\"The after is the before for the next during.\"\n(on the cumulative nature of meditative transformation)\n", "quote_zh": "「前一次禅修的『之后』正是下一次『之中』的『之前』。」\n（论禅修转化的累积性本质）\n", "links": {"goodreads": "https://www.goodreads.com/book/show/34807334-altered-traits"}, "tags": ["frontier"], "pages_tag": ["神经科学"]}, {"id": "vervaeke-meaning-crisis", "title_en": "Awakening from the Meaning Crisis", "title_zh": "从意义危机中觉醒", "author_en": "John Vervaeke", "author_zh": "约翰·维瓦克", "year": "2019–", "type": "online_lecture_series", "quote_original": "\"We are in the midst of a meaning crisis — a crisis of wisdom,\nof relevance realization. The solution requires recovering the\nlost dialogue between cognitive science and the great wisdom traditions.\"\n(Episode 1)\n", "quote_zh": "「我们正处于一场意义危机——智慧与相关性实现的危机。解决方案需要\n恢复认知科学与伟大智慧传统之间失去的对话。」（第一集）\n", "links": {"youtube_playlist": "https://youtube.com/playlist?list=PLND1JCRq8Vuh3f0P5qjrSdb5eC1ZfZwWJ", "episode_1": "https://www.youtube.com/watch?v=54l8_ewcOlY", "channel": "https://www.youtube.com/user/johnvervaeke"}, "tags": ["frontier"], "pages_tag": ["心灵哲学", "计算现象学"]}], "reports": [{"id": "unesco-links", "title_en": "Local and Indigenous Knowledge Systems (LINKS) Programme", "title_zh": "联合国教科文组织「本土与地方知识体系」项目", "organization": "UNESCO", "year": "2002–", "quote_original": "\"Indigenous knowledge is not 'primitive' or 'outdated.' It is the refined\nwisdom accumulated over millennia of human co-evolution with specific ecosystems.\"\n", "quote_zh": "「本土知识不是『原始的』或『过时的』。它是数千年人类与特定生态系统\n共同演化所积累的精炼智慧。」\n", "links": {"official": "https://www.unesco.org/en/links", "biodiversity": "https://www.unesco.org/en/links/biodiversity", "courier_2026": "https://www.unesco.org/en/articles/how-indigenous-knowledge-drives-scientific-discovery"}, "tags": ["spirit"], "pages_tag": ["indigenous_knowledge"]}, {"id": "ipbes-global-assessment", "title_en": "Global Assessment Report on Biodiversity and Ecosystem Services", "title_zh": "生物多样性与生态系统服务全球评估报告", "organization": "IPBES", "year": 2019, "doi": "10.5281/zenodo.3831673", "quote_original": "\"Nature and its contributions to people are deteriorating worldwide. ...\nIndigenous and local knowledge has been systematically incorporated into\nthis assessment for the first time at a global scale.\"\n(Summary for Policymakers)\n", "quote_zh": "「自然及其对人类的贡献正在全球范围内退化。……本土与地方知识在此次评估中\n首次在全球尺度上被系统地纳入。」（决策者摘要）\n", "links": {"official": "https://www.ipbes.net", "report": "https://www.ipbes.net/global-assessment-report-biodiversity-ecosystem-services", "summary_doi": "10.5281/zenodo.3553458"}, "tags": ["spirit"], "pages_tag": ["indigenous_knowledge"]}, {"id": "canada-trc-final-report", "title_en": "Honouring the Truth, Reconciling for the Future — Final Report of the Truth and Reconciliation Commission of Canada", "title_zh": "尊重真相·走向和解——加拿大真相与和解委员会最终报告", "organization": "Truth and Reconciliation Commission of Canada", "year": 2015, "isbn": "978-0660020785", "quote_original": "\"Reconciliation is not an Aboriginal problem; it is a Canadian problem. ...\nTogether, Canadians must do more than just talk about reconciliation;\nwe must learn how to practise reconciliation in our everyday lives.\"\n(Summary, p.183)\n", "quote_zh": "「和解不是原住民的问题，是加拿大全体的问题。……加拿大人必须不只谈论和解，\n更必须在日常生活中实践和解。」（执行摘要，第183页）\n", "links": {"nctr": "https://nctr.ca/records/reports/#trc-reports", "publications_canada": "https://publications.gc.ca/site/eng/9.800288/publication.html"}, "volumes": "6卷 · 94项行动呼吁", "tags": ["spirit"], "pages_tag": ["indigenous_knowledge"]}, {"id": "bhutan-gnh", "title_en": "Gross National Happiness (GNH) Framework", "title_zh": "国民幸福总值框架", "organization": "Centre for Bhutan Studies & GNH Research", "year": "1972–", "quote_original": "\"Gross National Happiness is more important than Gross National Product.\"\n— His Majesty Jigme Singye Wangchuck, Fourth King of Bhutan (1972)\n", "quote_zh": "「国民幸福总值比国民生产总值更为重要。」\n——不丹第四代国王吉格梅·辛格·旺楚克（1972年）\n", "links": {"gnnhc": "https://www.gnhcentrebhutan.org", "gnch_gov": "https://www.gnhc.gov.bt"}, "tags": ["spirit"], "pages_tag": ["humanistic_economics", "indigenous_knowledge"]}, {"id": "gen-ecovillage-network", "title_en": "Global Ecovillage Network (GEN)", "title_zh": "全球生态村网络", "organization": "GEN International", "year": "1995–", "quote_original": "\"A world of empowered citizens and communities,\ndesigning their own pathways to a sustainable future.\" (GEN Vision)\n", "quote_zh": "「一个由被赋权的公民与社区自主设计通往永续未来之道路的世界。」（GEN 愿景）\n", "links": {"official": "https://ecovillage.org"}, "coverage": "114+ 国家 · 1,250+ 生态村 · 联合国经社理事会咨商地位", "tags": ["spirit"], "pages_tag": ["practice"]}], "haiyun": [{"id": "haiyun-spiritual-economics", "title_zh": "灵性经济学（海云继梦法师系列演讲与著作）", "title_en": "Spiritual Economics — Lectures & Writings of Ven. Haiyun Jimeng", "author_zh": "海云继梦法师 (賢首宗高原法系第四十二世傳人)", "author_en": "Ven. Haiyun Jimeng (42nd Patriarch, Xianshou Gaoyuan Lineage, Huayan School)", "year": "2000–", "quote_original": "海雲法語：「靈性經濟學不是關於『靈性』的附加學問，而是以靈性為文明之根本\n的經濟學範式轉換。真正的稀缺不是物質資源，而是覺醒的心靈。」\n", "quote_en": "\"Spiritual Economics is not an add-on about spirituality. It is a paradigm shift\nthat places spiritual awakening as the foundation of civilization.\nWhat is truly scarce is not material resources — it is awakened minds.\"\n", "links": {"huayenworld": "https://www.huayenworld.org", "youtube": "https://www.youtube.com/channel/UCJr3ifkvTs76XnR6SuyIfFQ", "forum_2024": "https://www.huayenworld.org/2024年新世纪永续发展高峰论坛/", "facebook": "https://www.facebook.com/huayenlugu.org", "podcast_53": "https://podwise.ai/episodes/1270459", "book_we_only_have_one_choice": "《我们只有一个选择》——海云继梦法师灵性经济学专著"}, "tags": ["spirit"], "pages_tag": ["spiritual_economics"]}], "online": [{"id": "haiyun-youtube", "title_zh": "大华严寺 YouTube 官方频道", "title_en": "Da Huayen Temple Official YouTube Channel", "links": {"channel": "https://www.youtube.com/channel/UCJr3ifkvTs76XnR6SuyIfFQ"}, "tags": ["jiaoxing", "spirit", "lineage"]}, {"id": "vervaeke-youtube", "title_en": "John Vervaeke — Awakening from the Meaning Crisis (YouTube Series)", "links": {"playlist": "https://youtube.com/playlist?list=PLND1JCRq8Vuh3f0P5qjrSdb5eC1ZfZwWJ", "channel": "https://www.youtube.com/user/johnvervaeke"}, "tags": ["frontier"]}], "meta": {"last_updated": "2026-08-08", "total_entries": 27, "coverage": {"sutras": 5, "books": 14, "reports": 5, "haiyun": 1, "online": 2}, "data_sources": ["Goodreads (ratings/reviews)", "豆瓣读书 (ratings/reviews)", "Google Scholar (citation counts)", "出版社官方网站 (ISBN/DOI)", "CBETA 中华电子佛典协会", "84000 Project", "UNESCO / IPBES / 加拿大政府出版"], "convention": "原语优先 (Skt/Bo/Zh/En/Fr); 中英双语批注;\n链接: official + goodreads + douban + scholar 四方验证"}};
var HEART_ARTICLES = [{"title": "第一篇：别用大脑修行", "body": "<p>第一篇：别用大脑修行<br>下手处，是身体，不是念头</p>\n<div class='himg'><img src='https://mmbiz.qpic.cn/mmbiz_jpg/W8WjNKWCKAyvubauIUAPx6BtWXiag4uzVMmFiaGt8ZL2VmsM670FP0yahTUo8o8lxMeqrFfASCsWyxqlE3wsZ8a1hhia5b5JsUER2vvDQibnHnk/640?wx_fmt=jpeg&from=appmsg' alt='' onclick='window.open(this.src)'></div>\n<h4>木雕彩绘贴金普贤菩萨像</h4>\n<h4>高：80cm</h4>\n<p>造像基本信息：高80cm，为大型木雕作品，以木为胎，采用干漆工艺组装，辅以颜料、金漆装饰，作者署名“藤原兼荣”，象腹下方落款纪年为日本宝永七年（1710年）十一月吉日，标注制作者为“大佛工祐岳”。</p>\n<p>造像细节：普贤菩萨结跏趺坐于卧象承托的莲台之上，身着宽大长袍，衣褶层叠垂落膝前，腰系带，肩披饰有莲花纹的锦缎外衣，袖口飘举，双手持长柄鎏金锡杖；高发髻配鎏金嵌彩石宝冠，眼珠与眉心白毫均为镶嵌工艺。</p>\n<h4>修行入口处就是下手处。下手处很简单，不能用大脑，用大脑没有入口处，用大脑只是剪不断，理还乱。</h4>\n<h4>要怎么不用大脑呢？有两个动作，叫做暖身二法，把身体热起来的那个方法。</h4>\n<h4>第一个叫做生命载体的调整术，生命载体就是身，身体的调整术。第二个叫做生命导引术，生命导引术是内视呼吸法，因为你的呼吸不正确，所以我们要调整。</h4>\n<p>这两个每一个都有很多很多方法，它是一个技术问题。所以，叫导引术跟调整术。但是，它有一个要领，就是这些动作要能够产生内热，身体里面要热起来，它不是肌肉运动，它是内脏运动。所以，我们叫内动，不是外动。</p>\n<h4>你怎么动都可以，只要揉动按摩你的五脏六腑。那就会把你体内杂质去除掉，在去除体内杂质的同时，那你的心性就会调整。</h4>\n<h4>调身是调身语意，所以调息是调心性，调心的那个心，它是调灵性，就是真心、菩提心。</h4>\n<p>所以在这个地方假如我们没有弄清楚，我们没办法修的，是盲修瞎练的。这是个关键，我们要弄清楚，我们在修行用功的时候那个重点和要领，我们就不会产生偏差，要不然肯定偏差，而且差得很远。</p>\n<h4>《入禅九阶：从暖身到金钥匙》</h4>\n<p>海云继梦法师实修心要<br>仁悦  整理<br><div class='himg'><img src='https://mmbiz.qpic.cn/mmbiz_jpg/W8WjNKWCKAzJu0MuwOjn10wgAeAOtPrv7HflHPc0tXP8ACW6IBwmVW12XFNcZslvrBgCcPBZAD1sKdCqPByPpphrtiaFnCaj2fEQNa0jHYR0/640?wx_fmt=jpeg&from=appmsg' alt='' onclick='window.open(this.src)'></div></p>", "url": "https://mp.weixin.qq.com/s/S2D9BOc3jFwDRQr2tbzG6g"}, {"title": "第二篇：四段呼吸的奥秘", "body": "<p>第二篇：四段呼吸的奥秘置心一处，从“吸、闭、吐、闭”开始<br><div class='himg'><img src='https://mmbiz.qpic.cn/mmbiz_jpg/W8WjNKWCKAw71KZ2ruz2GAEYudG4L6Jm9nGoibC08OjzI639ELqXibu5A2b4WiaW333XocWiaUpVtPT5SvBfiaSNnfUVSEx6fvHPM6xIdVnTf2DY/640?wx_fmt=jpeg&from=appmsg' alt='' onclick='window.open(this.src)'></div></p>\n<h4>二十臂普贤延命菩萨像</h4>\n<h4>日本平安时代二十臂普贤延命菩萨像：</h4>\n<h4>基本属性：该造像为绢本设色，尺寸104×63cm，是密教中用于修持普贤延命法（祈愿增福、延寿）的本尊像。</h4>\n<h4>样式分类：普贤延命像主要分为二臂与二十臂两种，其中二臂像受天台宗推崇，二十臂像受真言宗推崇。</h4>\n<h4>二十臂法器：左十臂持莲花、剑、轮、舌、羯磨杵、甲胄、牙、金刚拳、锁、铃；右十臂执五钴杵、钩、箭、拳、宝珠、日轮、宝幢、三钴杵、三钴钩、羂索。</h4>\n<p>置心一处（调息）“四心偈”：置心一处、使心不乱，若心他缘，摄心令还。调息与“四段呼吸”。他缘：包括外缘与内缘。调息才是真正修行的关键，调息是内摄修定的功夫，也是正式进入“入禅”的第一课。它真正的工作是“四个心”，也叫“四心偈”：“置心一处、使心不乱，若心他缘，摄心令还”。这个大家都知道。这些你好像也会做，但是大概只有3秒钟，然后心就攀缘了。而修行就是“心他缘”的时候，要摄心令返，真正功夫是在这个地方。什么是他缘？“除专注于调息的四段呼吸外，其余都是‘他缘’”。调息“务必达一心不乱，无人我，无岁月。”这是关键。“他缘”有两个，一个是外缘，一个是内缘；外缘是什么？打个比方，比如我们口渴了，或者刚才喝水了，现在要上厕所了，要不然就电话响了，这些统统都是它缘。另外一个叫内缘，所谓内缘我举个例子，就是我现在打坐就座了，开始在调息……调息以后突然间体内会震一下，或产生一股气等等，这些都是身体内部所产生的，这个叫内缘，我们自己的身体，我们一定感受得到，这些叫他缘。四段呼吸这要我们自己反复的练习！！<br>《入禅九阶：从暖身到金钥匙》海云继梦法师实修心要仁悦  整理<br><div class='himg'><img src='https://mmbiz.qpic.cn/mmbiz_jpg/eavUnKD4rPkHcicVPGV3eBBlTAiaB0bh6RwosALZU4syBcPZVaklhoXUSvMPib41xUncUVn5qcVgibllntwugaSyLWBoCAwBibWlOXVicroiaLliaUg/640?wx_fmt=jpeg' alt='' onclick='window.open(this.src)'></div></p>", "url": "http://mp.weixin.qq.com/s?__biz=MzkyMzQxOTMyMg==&mid=2247497426&idx=1&sn=7fa8a139ce472314116bbe138e50db10&chksm=c1e7e107f6906811acd86cfb3a27c4bfa0d19b60bb896feb46af3ae1010838b36e9f2c668c1b#wechat_redirect"}, {"title": "第三篇：闭气不是憋气", "body": "<p>第三篇：闭气不是憋气微细息中，藏着生命的秘密<br><div class='himg'><img src='https://mmbiz.qpic.cn/mmbiz_jpg/W8WjNKWCKAy59UicI5TLsgkK2XauzQ9bUrtmibVRBHeJfvzSM9NABUX2yH7IF5LaREuib419bDozEibfwvQHZcg7LEncTNA99Snx63Bbia2JJHIA/640?wx_fmt=jpeg&from=appmsg' alt='' onclick='window.open(this.src)'></div><br>元代佛画普贤菩萨像<br>这幅元代绢本《普贤菩萨像》（139×56厘米，维多利亚阿尔伯特博物馆藏）原为释尊居中、文殊普贤分列两侧的三联屏构件，配题“妙光庵”原盒，因受损裁切后普贤略偏左；采用截金技法绘制，装裱配鎏金缠枝纹轴头；菩萨正面结跏趺坐，戴嵌如意宝珠宝冠，持青莲，莲台承于象背云垫，具高丽造像风格；六牙象披云纹鞍鞯，四足踏莲，象头平台供三化身佛，融合中日韩佛教艺术特征。</p>\n<p>我要跟大家解释～～闭气不是没有呼吸～～闭气的呼吸是非常非常微细的，所以不会死亡，这个身体不会死亡……现在我们所得到最早的还没死亡的修行人──昙鸾大师，一千六百年，他不是身体不烂而已，指甲还在长、头发也在长，他哪有死啊？他只是不动而已，他是在闭气中，这就很微妙哦！那以我们现在科学的检验来讲，那生长头发的元素从哪里来？长指甲的元素从哪里来？头发是蛋白质，指甲是钙质，他那么微细的“鼻息”里，怎么会有这些东西出来呢？这是生理学上的，还是化学上的？现在我们不探讨，我只告诉你──这个修行，“息身”的调整非常非常重要、非常重要的！那么，这个“息身”的前行是暖身二法，参禅金三角带进来了，血液已经沸腾，血液是在流动的……所以，一千六百多年，这血管还是有弹性的，这怎么回事啊？所以我们提醒大家的是──修行你就修行，其他都不要问！就修行的行法把它做好，并且要真实做到！<br>《入禅九阶：从暖身到金钥匙》海云继梦法师实修心要仁悦  整理<br><div class='himg'><img src='https://mmbiz.qpic.cn/mmbiz_jpg/eavUnKD4rPm98cHaXhiaj1jiclTHiaFk4vPia6cQkeiaI9bQP4KOqm6PaU5SuBbr1evhJKKl2mfBSr842JypDBVTqtpFia0DZgdCH42vkicSJup4XI/640?wx_fmt=jpeg' alt='' onclick='window.open(this.src)'></div></p>", "url": "http://mp.weixin.qq.com/s?__biz=MzkyMzQxOTMyMg==&mid=2247497428&idx=1&sn=04845b578927e6631786c3cc725bf763&chksm=c1e7e101f69068177af7b3cda755545cf3835e01bfe05feca8321e1cc77169421a7fb4856812#wechat_redirect"}, {"title": "第四篇：摸着那个“转折点”", "body": "<p>第四篇：摸着那个“转折点”呼吸转换的瞬间，就是入定的门<br><div class='himg'><img src='https://mmbiz.qpic.cn/mmbiz_jpg/W8WjNKWCKAwS9BEYicIb46eLueLWTSNWmicYXAHpRvqdZvfDicZxnI3CEDuwcuWyVJWtee6Z56c4Ke7QdLDvedJkk1rmH5z80ZGtyWNiaaB52XM/640?wx_fmt=jpeg&from=appmsg' alt='' onclick='window.open(this.src)'></div><br>元代鎏金铜普贤菩萨坐像<br>这尊52.8厘米高的元代鎏金铜普贤像，端坐蹲狮负莲台，呈游戏坐姿，发箍立化佛，璎珞满身，原持法器已佚。普贤象征理德与行德，骑六牙白象寓意愿行广大，与文殊共辅毗卢遮那佛为“华严三圣”。此像与同款文殊像工艺一致、方位相对，应为同期铸造的配套胁侍像。</p>\n<p>“调息”──这一个“吸气”我们要很清楚，“吐气”也要很清楚，我们对于“吸”与“吐”当中很清楚！很清楚就是摸索那两个“闭气”的点，不是“吸……”与“吐……”，这个不用清楚啦，我们要你清楚的是“吸……”完转“吐”的那个地方，我们有没有感觉到？“吐……”完转“吸”那个在转换的时候，我们有没有感觉到？我们能感觉到“那个”就好，感觉到就好。那“闭气”其实是──到那个地方它自然就会停止，我们的“身体”会告诉我们要“吐气”了……那“吐……”到什么时候，他会停止，然后它又会吸气了，身体会告诉你，这叫作“调息”，不是我们作意呼吸，它是自然的，身体自然需要的，呼吸就是关键，这就很微细了，很微细哦！“息身”做成了，我们的“善思惟用心”就够微细……我们现在之所以有问题，就是因为我们不愿意“用心”，就问“师父，我这样呼吸对不对？我这个就叫作‘息身’喔，是不是？”我们要自己慢慢去调──这样对吗？（当然对啊）──对了，那“闭气”我感受到吗？──对了，那要怎么更好？（这样就好）那怎么更好的“方法”我们现在不会，但是我们在摸索、我们再摸索……在呼吸的这个过程里，就是我们要用心、要用心！<br>《入禅九阶：从暖身到金钥匙》海云继梦法师实修心要仁悦  整理<br><div class='himg'><img src='https://mmbiz.qpic.cn/mmbiz_jpg/W8WjNKWCKAxAwgtbvbk47cBSicHQCoW9TByIOw9ricCDYEhRdkogONlInlHs2py6GLREfUicwDSkG59s7kFDNvL2LYWsLXlVl1Puiafo80VvuKE/640?wx_fmt=jpeg&from=appmsg' alt='' onclick='window.open(this.src)'></div></p>", "url": "http://mp.weixin.qq.com/s?__biz=MzkyMzQxOTMyMg==&mid=2247497449&idx=1&sn=a8e12d77fca6019f4981a30d5beb8a65&chksm=c1e7e13cf690682af9445df95091817ab56d68c9192ddd5f71e0e464ef0533dd3b9b9842624b#wechat_redirect"}, {"title": "第五篇：呼吸里的一股“力”", "body": "<p>第五篇：呼吸里的一股“力”Pran（正能）升起，才是真调息<br><div class='himg'><img src='https://mmbiz.qpic.cn/mmbiz_jpg/mAKSL4wFlF9HW73wbjmiadHDUh2gWz8oCNlhKbxXoNYz9Qy6ibvIdLMP1NtbEnxcL26rW2sKo0H0Zd43SaEc4RKw/640?wx_fmt=other&from=appmsg&wxfrom=5&wx_lazy=1&wx_co=1&tp=webp#imgIndex=1' alt='' onclick='window.open(this.src)'></div><br>平安时代《普贤菩萨像》  绢本设色   弗利尔美术馆藏<br>我们会发现到──这“呼吸”当中有一股“力量”……当我们心思浮动、很烦躁时，我们感觉不到力量的存在；当我们越平静的时候，越平静那个“息”越长，那么，“闭气”的时间越长的时候，就感觉我们的力量越大；我们感觉到我们的力量越来越大，就表示我的正能越来越大，因为pran有多大，我们力量就发挥多少，要留意到……而这个“力量”不是我们用出来才知道，是我们的油表就会看得到了。也就是当我们在加油的时候，那油表会自动一直往上升，我们加了多少油它升到那里，它跳起来以后，过一阵子它也停在满格的地方，就是这样子啊！所以，我们的“力量”不是打人的时候那个力量才出来的，它本来就储存在我们的身体里面，当我们“pran”一直增加的时候，我们就感觉到问我们的力量越来越大……我们的“pran”之所以越来越强大，是因为我们的息气，那个“闭气”越来越长……这三个是一体的……所以“闭气”时间长，我们的“力量”就强；我们的“力量强”，就是我们的“pran强”！换句话说──pran越强，闭气越长。<br>《入禅九阶：从暖身到金钥匙》海云继梦法师实修心要仁悦  整理<br><div class='himg'><img src='https://mmbiz.qpic.cn/mmbiz_jpg/mAKSL4wFlF9HW73wbjmiadHDUh2gWz8oCrUk7uiak9DCqkJJ15thlf4hwp2L3Y0Om7As66nsx2LEeib3M3VdOicUAw/640?wx_fmt=other&from=appmsg&wxfrom=5&wx_lazy=1&wx_co=1&tp=webp#imgIndex=6' alt='' onclick='window.open(this.src)'></div></p>", "url": "http://mp.weixin.qq.com/s?__biz=MzkyMzQxOTMyMg==&mid=2247497472&idx=1&sn=3b28886bf8e854a0958bba7354beef9f&chksm=c1e7e0d5f69069c3e18903d286c2740854421f8757c83402ed71ebe4880346dbf757dc1366c7#wechat_redirect"}, {"title": "第六篇：置心一处的三大工程", "body": "<p>第六篇：置心一处的三大工程先找“处”，再找“心”，最后“安放”<br><div class='himg'><img src='https://mmbiz.qpic.cn/mmbiz_jpg/mAKSL4wFlF9gfzXQho6SxeuicF6Vc4UI7fwXLDQ9vyIPFsnXadrCSEWHXUySINJcPo65UHqA7m92N7Szwics1U1A/640?wx_fmt=jpeg&from=appmsg' alt='' onclick='window.open(this.src)'></div></p>\n<h4>日本 镰仓时代 普贤菩萨像 奈良博物馆</h4>\n<p>绘制于镰仓时期，相当于元代，普贤菩萨的头光和背光形成葫芦形的光圈，外围另有一层未圆的身光，一头大象分身为三，象征着戒定慧三学，大象的四只脚下踏在象架上，象征四摄：布施、爱语、利行、同事；下有千头小象，远看卷底的象眼和象脚，仿佛千瓣莲花，气场巨大，似有千万只象脚踏地的震耳欲聋之声，象征着普贤菩萨的大行大力。</p>\n<p>我们通过调息入定：调息（通过训练四段呼吸） — 置心一处 — 放松 — 找到闭气点入定。通过训练四段呼吸达到“置心一处”是第一要务。备注：1、调息“四段呼吸法”也就是──“吸”、“闭”、“吐”、“闭”四段。2、我们普通人的呼吸是吸吐、吸吐、吸吐。其实在吸气完毕，转为吐气的时候，有一个转弯的地方。3、这个“转”的地方，就叫闭气；它不是憋气，不是禁气。它是自然而然的。4、这个“吸尽转吐”、“吐尽转吸”的这个部分，所以它一定有一个吸、闭、吐、闭的过程，你必须确定。5、去寻找那个闭气点，因为闭气的这一点，被你摸到时候，你就入定了，你就进入了。6、但是你由这里入定的话，可能是外道定，因为你不会置心一处。所以我们一定先要求你置心一处，然后放松，闭气，就进去了。这是三个部分，置心一处为第一要务。</p>\n<p>我们要怎样“置心一处”呢？<br>处处用心，尽心处众──就能除掉妄想，置心一处。<br>那么，我们要怎样“置心一处”呢？<br>第一个：行者要把那一处找出来，“处”、“一处”──“那一处”要有！没有处，你要怎么置心？要置到哪一处（对不对！）我选的一处是调息（风门）。困的时候一处放在眉心，妄想纷飞的时候一处放在下丹田，不困了、妄想少了仍然把一处放到风门。第二个：要把“心”找出来！没有心、抓不到心、掌握不了心，你要怎样“置心一处”？！这个“心”是生命的真相与本质（本体），就是圆满的菩提心，是能感知、思维、感受的主体。我们初学就用“注意力”入手，在观呼吸的时候感受注意呼吸的‘出’和“入”，同时觉察自己是否被杂念干扰，这就是与“心”建立初步链接。第三个工作：就是找到心，并且安放在调息（风门上）。决定好“那一处”在哪里。“心”是什么，掌握好。把心“放好”在风门！我用调息找稳定应该置心一处在风门上，不能放在别处。<br>《入禅九阶：从暖身到金钥匙》海云继梦法师实修心要仁悦  整理<br><div class='himg'><img src='https://mmbiz.qpic.cn/mmbiz_jpg/eavUnKD4rPnxZsOtVpnRT8jLG65AUYr0ezJjtQj73g3zbQ2gfrHDHhVlexCDicBcTT8aLjsphytXuUBU3ROb0y1FyytJ9ib36FLZrlCpYOxcw/640?wx_fmt=jpeg' alt='' onclick='window.open(this.src)'></div></p>", "url": "http://mp.weixin.qq.com/s?__biz=MzkyMzQxOTMyMg==&mid=2247497479&idx=1&sn=c4784e020ce863182a89632d52d56664&chksm=c1e7e0d2f69069c4fa173212ce7490d78b05d7ab06deb6731e1dbc9bd3707dcf0fd744571a4a#wechat_redirect"}, {"title": "第七篇：心跑了，抓回来！", "body": "<p>第七篇：心跑了，抓回来！<br>初关破了，生死就了了</p>\n<div class='himg'><img src='https://mmbiz.qpic.cn/mmbiz_jpg/mAKSL4wFlF9gfzXQho6SxeuicF6Vc4UI7RvgibKQVfYh7HlKhn5J8ibjtcLOVDtUAXrmDaibsDA3w483yY0YMTKN4Q/640?wx_fmt=jpeg&from=appmsg' alt='' onclick='window.open(this.src)'></div>\n<h4>克利夫兰艺术博物馆 藏 南宋 佚名 普贤菩萨像</h4>\n<p>克利夫兰艺术博物馆藏有一张南宋普贤菩萨，头戴五叶宝冠，头光巨大，如清朗明月；眼神笑眯眯的六齿白象，眼角的皱纹满是慈爱地望着驭象人，驭象人光脚，执杆，松挽绳索；菩萨盘坐在千瓣莲花的宝座上，如入禅定，女相，男身，红衣，绿袍，饱满而丰富，左手所持莲花上有经书，右手轻扶花枝。近千年，很多寺院还在塑画这款普贤菩萨，而且常把经书写成《普贤行愿品》。礼敬他人，给人点赞。</p>\n<h4>“置心一处”这个工程必须要做好，可是我们的心却常常跑掉！心跑掉──就是妄想把你俘虏了！</h4>\n<h4>那我们要怎样将心找回来？──“若心他缘、摄心令返”，只要做这个工作，摄心令返！</h4>\n<p>我们现在还没做，所以我们不知道，我们必须一直做，做到很清楚，心被妄想拉走以后，我能即刻察觉──又马上把他抓回来！……就这样一次次地……心一直被妄想拉走，我也能够一次次地，又将他给抓回来……一直到真实掌握到它、能够牢牢地守住它、并且就此把心安住在这一处！</p>\n<h4>通常，当我们不经意而被妄想拉走以后，却以为我被俘虏是很幸福的事！我知道了吗？我能即刻察觉吗？</h4>\n<h4>所以──“心”就不见了、“处”也不见了、啊...里面是空的啊，所以我们就会一直生死轮回！……现在我们为了要破这个部分，必须赶快把他抓回来！</h4>\n<h4>想要培养这一点“觉性”，难，可真难！！！我们必须真的有办法做到──一跑掉就立刻抓回来，跑掉了──赶快抓回来！那妄想的境界我们清楚的知道，我们能一直把他抓回来！</h4>\n<h4>这个工程做完──破参，叫“破初关”！！！初关破在哪里？他的“破”──主要是破在“妄想不会俘虏你”！因为它要俘虏你，你有绝对的能力可以回来！</h4>\n<p>而一般凡夫之所以没有办法破，是因为我们──以为被妄想俘虏是很舒服的事！我知道吗？我想想看……我打妄想的时候，还一边很陶醉地微微笑着……打坐时还会笑？笑什么？我欠香板！！！</p>\n<p>因为打妄想很舒服，尤其是一面打坐，一面梦想跟女朋友约会...哇！这下子完了、完了……这种情境就发生在我们粗心大意、没有办法掌握，就是我们没有办法“置心一处”吗？这个定力要有啊！我们要培养“定力”──这就是第一关、第一关。</p>\n<p>到这个地方，我们假如能够在半年以内达到这个目标的话，就算你现在是三百公斤的体重，也会很自然地降到五十公斤。我们好好去做，“初关”这个工程一定要做好！要是这一关我们能达成的话，那就可以授记了。</p>\n<p>有很多人，在这个时候说是“证阿罗汉”！？我们在这里只能告诉你，在我们用功的过程里，能够来到这里，是很大的成就，已经出三界了！要真的有没有那个实力，这个才是重点！！！这个功夫必须要自己做，这个时候就了生死了。初关就可以“了生死、出三界”！</p>\n<p>我讲的是这种状况：当妄想来时，你能够及时察觉、立刻把心带回来！在这种情境中──那妄想情境我们很清楚，那外尘境界也很清楚…但是，都不管它、不理会它，我又回来了！心一跑掉、抓回来、马上又抓回来！跑掉、又抓回来……跑掉、又抓回来，得马上又抓回来──让“心”跟“那一处”能结合在一起，这就是真功夫在这里啊！！！</p>\n<p>《入禅九阶：从暖身到金钥匙》<br>海云继梦法师实修心要<br>仁悦  整理<br><div class='himg'><img src='https://mmbiz.qpic.cn/sz_mmbiz_jpg/eavUnKD4rPkggsI1IqVHoOFMbV7VLg8Dib2GRa62PSmjNicqiafctJXibm9mZNAyFTAyCnd3TdPvdRsuickUPfKg7GHSL81f7exz4AcF4mmrPfEM/640?wx_fmt=jpeg' alt='' onclick='window.open(this.src)'></div></p>", "url": "http://mp.weixin.qq.com/s?__biz=MzkyMzQxOTMyMg==&mid=2247497491&idx=1&sn=f568ae4dfdafb48b16a268156cabc90e&chksm=c1e7e0c6f69069d0a64c9ae7e9a47d0c1731bd0d7de9dd5f31105d1092682a790dda21dd7f43#wechat_redirect"}, {"title": "第八篇：别躲清静，去“防震”", "body": "<p>第八篇：别躲清静，去“防震”接触众生，是扫除妄想的最好方法<br><div class='himg'><img src='https://mmbiz.qpic.cn/mmbiz_jpg/mAKSL4wFlF8PnWia4416ZiakZpMMp1TNhSqicoZI8gdh6dRun4Mce1bKKooatqcib4kP4XP52YibodGPboE02NdR49A/640?wx_fmt=jpeg&wxfrom=5&wx_lazy=1&wx_co=1' alt='' onclick='window.open(this.src)'></div></p>\n<p>大足北山转轮藏窟普贤菩萨像<br>普贤菩萨以理德第一著称，右手执一如意放于膝间，结跏趺坐于大象背负的双层仰莲台上，脸颊圆润，目光下视，双唇轻翕，呈现出一种含颦欲笑、具有东方女性美的微妙神态，给人以娴静、端庄、秀雅之感，被誉为“东方维纳斯”。莲座下为一白象，旁站立犷悍剽武的象奴，紧握象绳。<br>这个“置心一处”的功夫，是你真正能够用功、真的可以做得到的！那么，这个功夫，我们或许会说：“好！那就等我修到这个成就以后，再开始来接触众生……”哦？那，你也弄错了！你要知道──我这么一坐下来，妄想就会随着来啊，就是因为──不会处理跟众生相处的事，人、事、时、地、物……啊……人、人！尤其是人啦！与众生相处，我们必须要有能力来处理一些有关於人的事情。因为他有很多事、很多物……我们知道吗？我们都能够“感同身受”的察觉到、关怀到周遭的人吗！！？对于人、事、物，你都有能力处理得当的话，那么，你一坐下来，想要“定心”就有可能！要不然，我们一坐下来啊，那些个妄想将你俘虏时，我们又是──躲在妄想堆里，很舒服！！！我们该怎样应对？？？立即将心摄回来！马上把心抓回来！所以，我们应该要从这个本体面来看：“接触众生”就是“扫除妄想”的最好方法！我们懂吗，我们真的知道了吗！？？假如，让我们去接触众生，我们就会起愤怒或傲慢心……那只是因为我们这个人的人格性不健全，我们知道吗，自己能够察觉吗？所以，要大家“接触众生”的目的，就是要透过与众生的相处、互动，来矫正、健全你的五大人格性。透过这个“接触众生”把妄想给除掉！我们要留意到这俩个目标。假如我们老是一直逃避跟众生相处，那我们所衍生出来的妄想，都只是特异功能，因为──我们没有办法“置心一处”！我们那一处，一定是摆到“欲望”处、绝对是欲望的地方，那我们就是入了魔窟、成了魔境界，而不是成就“佛境界”，所以不可能“了生死”。以我们修行人来讲，我们还得用心注意到──透过与众生相处、互动，并不着重于福德、结缘。真正的重点在──扫除妄想！我们必须用心、细细的深入体会啊！我们很多人都说：“我很尽心在做，为甚么弄不好！？”我们用心不足──对于人、对于事、对于物，我们都不够了解，无法周全、圆满，所以，那份“挫折感”就容易使我们受伤。而我们，为了逃避承担、不能勇于面对事实，就永远长不大、无法健全自己……所以，我们的妄想会不断的出现，那我们就躲在妄想堆里头，然后说是“禅定”，那不是成了“欲界魔”吗？所以要留意、要当心──必须透过与众生相处，藉以扫除我们的妄想，那我们才有可能在被俘虏以后，马上把心抓回来！换句话说，那妄想一直要干扰我们，但它干扰的力量很小，不至于牵制我们太多！那么，我们在与众生接触当中如何圆满跟众生相处的部份？那就是──我们在禅定的训练过程当中，会把那些动摇的那种力量作“减压”处理嘛……换句话说，“与众生相处”是一种“防震工程”，你知道吗？防震啦，防震、防震！我们总是很想、很想要“置心一处”，却常常身不由己──会被拉走……那我们就要防震嘛，把那个妄想──尽量减少，尽量、尽量减，尽最大的努力减到最低、最低……那你即使一个不留神──居然被掳走了，也还可以很容易拉回来，对不对？所以，我们注意看看，我们在修行当中，佛法的结构是很殊胜、很殊胜的，而我们不知道，老是要用自己的方法！尤其，当我们的人格性不健全的时候，我们的方法正确度就不足！我们的方法正确度就不足！那……怎么可以固执的用我们自己的方法呢？这是多么危险的事啊！所以，我们还要特别再提醒大家──透过与众生的相处、互动，来矫正、健全我们的五大人格性。期望我们都能够──以成熟豁达的胸襟热情正面拥抱群众！活在美丽世界，过着美好日子，拥有美满人生！处处用心，尽心处众──就能除掉妄想，置心一处。<br>《入禅九阶：从暖身到金钥匙》海云继梦法师实修心要仁悦  整理<br><div class='himg'><img src='https://mmbiz.qpic.cn/mmbiz_jpg/eavUnKD4rPmB2cMhEvgRk9CRTX65QCmvb0bVaByYG2ARE9DpbDxsVOEJGCsk0XPPR4wOqibCT3n8N6YRzMm1skpD5Jhm2wL7HkTMzvPvvcrg/640?wx_fmt=jpeg' alt='' onclick='window.open(this.src)'></div></p>", "url": "http://mp.weixin.qq.com/s?__biz=MzkyMzQxOTMyMg==&mid=2247497501&idx=1&sn=ed9c44ca78f777c38e46b78fb3bc1450&chksm=c1e7e0c8f69069de0275257c938825b419168b3f2bd7e3be7efa9f5ae9aa239d1f9ffade304f#wechat_redirect"}, {"title": "第九篇：内动来了，用“金钥匙”", "body": "<p>第九篇：内动来了，用“金钥匙”正能保衽体内，触达本觉<br><div class='himg'><img src='https://mmbiz.qpic.cn/mmbiz_jpg/mAKSL4wFlF9gfzXQho6SxeuicF6Vc4UI7eic0PtT9TVoHwqhJBJgFEwd0cZMNheMib9tu2yfMuicOr3FaARFQ2pZUQ/640?wx_fmt=jpeg&from=appmsg' alt='' onclick='window.open(this.src)'></div></p>\n<p>榆林窟第3窟 普贤变<br>经变画的任何表达，都有深意，都能以小见大，读出大主题、大内涵与大意义，又常用诗意的绘画语言来传递超越语言的真理。榆林窟第3窟，普贤经变上方画着菩萨道场的钟灵毓秀山水峻奇的峨眉风光，中间衣袂飘飘慈眉善目的菩萨和脚踏莲花的随从；中原山水画的散点透视和成熟的线描菩萨群像容易让人忘记菩萨脚下的云和海。我们透过“置心一处”激发以后“正能”会出来；正能出来的时候，其实我们的“身、心”会涌动、会动。那么你用“置心一处”使它（正能）的“动”停止，这个 Pran（正能）就会保衽在体内，不会向外散失或偏离，从而实现对身心的净化和定力的培养，为进一步的禅修体验（如触功德、轻安等）奠定基础。置心一处引起本能动以后正能出来，身体会动，用置心一处使内动停止。当通过“置心一处”引发本能动（如身体晃动、内动等）并出现“正能”涌动时，若想使内动停止，可参考以下方法：强化“置心一处”的专注点。将注意力更集中地固定在最初引发本能动的“置心”位置（如风门）。通过深呼吸配合，吸气时专注感受气息进入该点，呼气时保持专注不散，以增强专注的稳定性，使心念不再被内动所牵引。运用“凝视”与“照住”技巧。在内心对出现的本能动现象进行“凝视”，即不抗拒、不追逐，只是清晰地观察内动的存在，同时保持“照住”的状态，即不因内动而产生情绪波动或思维干扰。通过这种观察与照住，逐渐让内动在专注的凝视下自然平息。结合“放下着”与“参禅金钥匙”。在“置心一处”的基础上，同时运用“放下着”的方法，即放下对内动的执着和期待，不试图控制或阻止内动，而是以平和的心态接受其存在，并借助“参禅金钥匙”（如对生命本质的疑问或对正能的体悟）引导心念回归平静，使内动在放下执着的状态下逐渐停止。“参禅金钥匙”并非一个孤立的概念，而是与“参禅金三角”训练密切相关。“参禅金钥匙”是参禅过程中实现“正定聚”的关键方法，就是灵性、菩提心，目的在于帮助修行者突破常规思维，进入真正的禅定状态。它与“置心一处”“放下着”共同构成“参禅金三角”，三者缺一不可。“参禅金钥匙”核心作用：在通过“置心一处”激发内在“正能”后，修行者身心会出现涌动或变化。此时，“参禅金钥匙”的作用是引导修行者以正确的方式“照住”（观照、照见）这些现象，使“正能”得以内聚，避免外散或陷入“不定聚”“邪定聚”等偏差状态。它帮助修行者超越大脑的常规控制，实现“身体与生命是一”的体悟，从而触达“本觉”的存在，为后续的禅定深化和智慧开启奠定基础。<br>《入禅九阶：从暖身到金钥匙》海云继梦法师实修心要仁悦  整理<br><div class='himg'><img src='https://mmbiz.qpic.cn/mmbiz_jpg/eavUnKD4rPn6IhG5m5iclC6hKnZwcNCJicPl5QH0nYAbIh0Cre6kfwubbeWHEIGYWtM0UHynmVcPDb9m71wiboEVCwwr9vFQ1t7GmtcWruePhs/640?wx_fmt=jpeg' alt='' onclick='window.open(this.src)'></div><br>榆林窟第3窟的背景留白空旷，表达本体的清净。在经变画中，云和海总是流动不居，象征无常和体性的广阔；祥云则象征智慧和慈悲；广阔无垠的大海象征着心意识的无限与本体的湛然。云与海皆可聚可散，能覆能变，寓意随缘显现，不为所限；普贤菩萨的头光和背光如月如日，表达觉性的起用与圆满周遍。</p>", "url": "http://mp.weixin.qq.com/s?__biz=MzkyMzQxOTMyMg==&mid=2247497540&idx=1&sn=a44a18d9d5867cf254ed387fe524a062&chksm=c1e7e091f6906987832b9af27aba864456f1cb9d1337752fba024d7969943fb657d8435411b8#wechat_redirect"}, {"title": "入禅九阶：从暖身到金钥匙", "body": "<div class='himg'><img src='https://mmbiz.qpic.cn/sz_mmbiz_jpg/W8WjNKWCKAxpd0TZibr69RiaISWPr9kRBWuJqGqDsG23zicSt7uUXl56b2VMibicgaudjMviacZQRbjtRTNzUXlWGAkANVCB35pcUc8wsMOgeSNmA/640?wx_fmt=jpeg&from=appmsg' alt='' onclick='window.open(this.src)'></div>\n<h4>大日如来坐像</h4>\n<h4>江户时代</h4>\n<h4>通高39厘米</h4>\n<p>实修心要|第一篇:别用大脑修行 (https://mp.weixin.qq.com/s?__biz=MzkyMzQxOTMyMg==&mid=2247497389&idx=1&sn=048cc74aee8c034f734a53a8452e8813&scene=21#wechat_redirect)</p>\n<p>实修心要|第二篇:四段呼吸的奥秘 (https://mp.weixin.qq.com/s?__biz=MzkyMzQxOTMyMg==&mid=2247497426&idx=1&sn=7fa8a139ce472314116bbe138e50db10&scene=21#wechat_redirect)</p>\n<p>实修心要|第三篇:闭气不是憋气 (https://mp.weixin.qq.com/s?__biz=MzkyMzQxOTMyMg==&mid=2247497428&idx=1&sn=04845b578927e6631786c3cc725bf763&scene=21#wechat_redirect)</p>\n<p>实修心要|第四篇:摸着那个“转折点” (https://mp.weixin.qq.com/s?__biz=MzkyMzQxOTMyMg==&mid=2247497449&idx=1&sn=a8e12d77fca6019f4981a30d5beb8a65&scene=21#wechat_redirect)</p>\n<p>实修心要|第五篇:呼吸里的一股”力” (https://mp.weixin.qq.com/s?__biz=MzkyMzQxOTMyMg==&mid=2247497472&idx=1&sn=3b28886bf8e854a0958bba7354beef9f&scene=21#wechat_redirect)</p>\n<p>实修心要|第六篇:置心一处的三大工程 (https://mp.weixin.qq.com/s?__biz=MzkyMzQxOTMyMg==&mid=2247497479&idx=1&sn=c4784e020ce863182a89632d52d56664&scene=21#wechat_redirect)</p>\n<p>实修心要|第七篇:心跑了，抓回来! (https://mp.weixin.qq.com/s?__biz=MzkyMzQxOTMyMg==&mid=2247497491&idx=1&sn=f568ae4dfdafb48b16a268156cabc90e&scene=21#wechat_redirect)</p>\n<p>实修心要|第八篇:别躲清静，去\"防震” (https://mp.weixin.qq.com/s?__biz=MzkyMzQxOTMyMg==&mid=2247497501&idx=1&sn=ed9c44ca78f777c38e46b78fb3bc1450&scene=21#wechat_redirect)</p>\n<p>实修心要|第九篇:内动来了，用“金钥匙” (https://mp.weixin.qq.com/s?__biz=MzkyMzQxOTMyMg==&mid=2247497540&idx=1&sn=a44a18d9d5867cf254ed387fe524a062&scene=21#wechat_redirect)</p>", "url": "http://mp.weixin.qq.com/s?__biz=MzkyMzQxOTMyMg==&mid=2247497558&idx=1&sn=670085792928af68ec9ef60b3574febe&chksm=c1e7e083f69069951f0e0bf69f96e9810a1a0df9109fa4e3be7cfea1ef4579286d4540decf03#wechat_redirect"}, {"title": "第一篇：别用大脑修行", "body": "<p>第一篇：别用大脑修行<br>下手处，是身体，不是念头<br>[图片]<br>木雕彩绘贴金普贤菩萨像</p>\n<h4>高：80cm</h4>\n<p>造像基本信息：高80cm，为大型木雕作品，以木为胎，采用干漆工艺组装，辅以颜料、金漆装饰，作者署名“藤原兼荣”，象腹下方落款纪年为日本宝永七年（1710年）十一月吉日，标注制作者为“大佛工祐岳”。</p>\n<p>造像细节：普贤菩萨结跏趺坐于卧象承托的莲台之上，身着宽大长袍，衣褶层叠垂落膝前，腰系带，肩披饰有莲花纹的锦缎外衣，袖口飘举，双手持长柄鎏金锡杖；高发髻配鎏金嵌彩石宝冠，眼珠与眉心白毫均为镶嵌工艺。</p>\n<h4>修行入口处就是下手处。下手处很简单，不能用大脑，用大脑没有入口处，用大脑只是剪不断，理还乱。</h4>\n<h4>要怎么不用大脑呢？有两个动作，叫做暖身二法，把身体热起来的那个方法。</h4>\n<h4>第一个叫做生命载体的调整术，生命载体就是身，身体的调整术。第二个叫做生命导引术，生命导引术是内视呼吸法，因为你的呼吸不正确，所以我们要调整。</h4>\n<p>这两个每一个都有很多很多方法，它是一个技术问题。所以，叫导引术跟调整术。但是，它有一个要领，就是这些动作要能够产生内热，身体里面要热起来，它不是肌肉运动，它是内脏运动。所以，我们叫内动，不是外动。</p>\n<h4>你怎么动都可以，只要揉动按摩你的五脏六腑。那就会把你体内杂质去除掉，在去除体内杂质的同时，那你的心性就会调整。</h4>\n<h4>调身是调身语意，所以调息是调心性，调心的那个心，它是调灵性，就是真心、菩提心。</h4>\n<p>所以在这个地方假如我们没有弄清楚，我们没办法修的，是盲修瞎练的。这是个关键，我们要弄清楚，我们在修行用功的时候那个重点和要领，我们就不会产生偏差，要不然肯定偏差，而且差得很远。</p>\n<h4>《入禅九阶：从暖身到金钥匙》</h4>\n<p>海云继梦法师实修心要<br>仁悦  整理[图片]</p>", "url": ""}];

function renderSpirit() {
  var cv = document.getElementById("spirit-view");
  if (!cv) return;
  var data = (typeof SPIRIT_DATA !== 'undefined' && SPIRIT_DATA.sections) ? SPIRIT_DATA.sections : [];
  if (!data.length) { cv.innerHTML = '<p style="color:var(--text2);text-align:center;padding:40px">数据载入中…</p>'; return; }

  // Find section by id
  function sec(id) { for (var i=0;i<data.length;i++) { if (data[i].id===id) return data[i]; } return null; }

  var h = '<style>' +
    '.sp-sec{border-left:4px solid var(--gold);margin-bottom:20px;padding-left:14px}' +
    '.sp-topic{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}' +
    '.sp-topic h4{color:var(--gold);font-size:0.92em;margin:0 0 6px}' +
    '.sp-topic p{font-size:0.82em;line-height:1.85;color:var(--text);margin:4px 0}' +
    '.sp-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}' +
    '.sp-nav button{padding:6px 14px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text2);cursor:pointer;font-size:0.8em;transition:all 0.2s}' +
    '.sp-nav button:hover{border-color:var(--gold);color:var(--gold)}' +
    '.sp-nav button.on{background:var(--gold);color:#fff;border-color:var(--gold)}' +
    '.sp-intro{font-size:0.85em;line-height:1.9;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:10px 0}' +
    '.sp-ref{font-size:0.72em;color:var(--text2);margin-top:20px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:8px}' +
    '.sp-ref h4{color:var(--gold);margin:0 0 4px}' +
    '.sp-ref li{line-height:1.8}' +
    '</style>';

  // ── Navigation moved to left sidebar ──

  // Active section
  var active = sec(SPIRIT_ACTIVE) || data[0];
  if (!active) { cv.innerHTML = h + '<p>请选择章节</p>'; return; }

  h += '<div class="sp-sec">';
  h += '<h2 style="color:var(--gold);margin:0 0 4px">' + active.icon + ' ' + active.title + '</h2>';
  if (active.summary) {
    h += '<p style="font-size:0.85em;color:var(--text2);line-height:1.8">' + active.summary + '</p>';
  }
  h += '</div>';

  if (active.intro) {
    h += '<div class="sp-intro"><p>' + active.intro.replace(/\n/g, '<br>') + '</p></div>';
  }

  // Topics
  if (active.topics && active.topics.length) {
    active.topics.forEach(function(t) {
      h += '<div class="sp-topic">';
      h += '<h4>' + t.title + '</h4>';
      h += '<p>' + t.body.replace(/\n/g, '<br>') + '</p>';
      h += '</div>';
    });
  }

  // ── Bibliography-powered references ──
  h += renderBibForPage('spirit');

  cv.innerHTML = h;
}

// ═══ Shared: render BIBLIOGRAPHY cards filtered by page tag ═══
function renderBibForPage(tag) {
  if (typeof BIBLIOGRAPHY === 'undefined' || !BIBLIOGRAPHY) return '';
  var all = [];
  var cats = ['sutras','books','reports','haiyun','online'];
  cats.forEach(function(c) {
    if (BIBLIOGRAPHY[c]) {
      BIBLIOGRAPHY[c].forEach(function(e) {
        if ((e.tags||[]).indexOf(tag) >= 0) { e._cat = c; all.push(e); }
      });
    }
  });
  if (!all.length) return '';
  var h = '<div class="sp-ref" style="margin-top:20px"><h4>📚 参考文献与延伸阅读 (' + all.length + '条·四方验证)</h4>';
  all.forEach(function(ref) {
    var gr = ref.goodreads_rating || {};
    var db = ref.douban_rating || {};
    h += '<div style="background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0;font-size:0.78em;line-height:1.7">';
    // Title + links
    h += '<b style="color:var(--gold)">' + (ref.title_zh || ref.title_en || '') + '</b>';
    if (ref.title_en && ref.title_zh) h += ' <span style="color:var(--text2);font-size:0.9em">' + ref.title_en + '</span>';
    h += '<br><span style="color:var(--text2)">' + (ref.author_zh || ref.author_en || '') + ' · ' + (ref.publisher||'') + ' · ' + (ref.year||'') + '</span>';
    // Ratings row
    if (gr.score || db.score) {
      h += ' <span style="font-size:0.85em;margin-left:4px">';
      if (gr.score) h += '⭐GR ' + gr.score + '(' + (gr.ratings||'?') + ') ';
      if (db.score) h += '📖豆瓣 ' + db.score + ' ';
      if (ref.scholar_citations) h += '📊引用 ' + ref.scholar_citations;
      h += '</span>';
    }
    // Quick quote
    if (ref.quote_zh) {
      var q = ref.quote_zh.substring(0, 120);
      h += '<div style="color:var(--text2);font-size:0.9em;margin:4px 0;padding-left:8px;border-left:2px solid var(--gold)">' + q + (ref.quote_zh.length>120?'…':'') + '</div>';
    }
    // Links row
    var links = ref.links || {};
    h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">';
    if (links.official || links.deal || links.mitpress || links.cambridge || links.cbeta_online)
      h += '<a href="' + (links.official||links.deal||links.mitpress||links.cambridge||links.cbeta_online) + '" target=_blank style="font-size:0.85em;color:var(--blue)">🏛 官方</a>';
    if (links.goodreads)
      h += '<a href="' + links.goodreads + '" target=_blank style="font-size:0.85em;color:var(--blue)">📗 GR</a>';
    if (links.douban_2010 || links.douban_2007 || links.douban_2022)
      h += '<a href="' + (links.douban_2010||links.douban_2007||links.douban_2022) + '" target=_blank style="font-size:0.85em;color:var(--blue)">📖 豆瓣</a>';
    h += '</div></div>';
  });
  h += '<p style="font-size:0.68em;color:var(--text2);margin-top:4px">📐 文献来源: <a href="https://goodreads.com" target=_blank>Goodreads</a> · <a href="https://book.douban.com" target=_blank>豆瓣读书</a> · <a href="https://scholar.google.com" target=_blank>Google Scholar</a> · 出版社官网 — 原语优先, 四方交叉验证</p>';
  h += '</div>';
  return h;
}
