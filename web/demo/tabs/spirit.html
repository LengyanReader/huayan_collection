://cbeta.buddhism.org.hk/xml/T45/T45n1884_001.xml", "禅源诸诠集都序": "https://cbeta.buddhism.org.hk/xml/T48/T48n2015_001.xml", "圆觉经大疏释义钞": "https://cbeta.buddhism.org.hk/xml/X09/X09n0245_001.xml", "华严原人论": "https://cbeta.buddhism.org.hk/xml/T45/T45n1886_001.xml", "华严经行愿品疏钞": "https://cbeta.buddhism.org.hk/xml/X05/X05n0229_001.xml"}, "v": 1}, {"id": "person_009", "n": "李通玄", "dy": "唐", "ti": "华严居士学者", "li": "李通玄系", "multi": [], "tp": "scholar", "b": 635, "d": 730, "bio": "唐代华严学重要在家学者。深通儒释，专精《华严》，于方山著《新华严经论》四十卷。以《易经》融会华严，方法独树一帜。", "wk": ["新华严经论", "华严经决疑论"], "wl": {"新华严经论": "https://cbeta.buddhism.org.hk/xml/T36/T36n1739_001.xml", "华严经决疑论": "https://cbeta.buddhism.org.hk/xml/T36/T36n1741_001.xml"}, "v": 1}, {"id": "person_011", "n": "净源", "dy": "宋", "ti": "宋代华严中兴之祖", "li": "华严五祖", "multi": [], "tp": "patriarch", "b": 1011, "d": 1088, "bio": "宋代华严宗重要复兴者。住杭州慧因寺。传法于高丽义天，义天归国后送金书《华严经》三种译本供养慧因寺。慧因寺世称'华严第一道场'。", "wk": ["华严经疏注", "华严妄尽还源观疏"], "wl": {}, "v": 1}, {"id": "person_010", "n": "义天", "dy": "宋", "ti": "高丽华严初祖", "li": "高丽华严", "multi": [], "tp": "scholar", "b": 1055, "d": 1101, "bio": "高丽文宗第四子。入宋求法于杭州慧因寺，从净源法师受华严教法。回国后编《新编诸宗教藏总录》（义天录），为华严文献学的奠基性著作。", "wk": ["新编诸宗教藏总录（义天录）", "圆宗文类"], "wl": {}, "v": 1}, {"id": "person_021", "n": "高原明昱", "dy": "明", "ti": "华严宗第二十五世", "li": "华严五祖", "multi": [], "tp": "patriarch", "b": null, "d": null, "bio": "明代华严宗祖师，华严宗第二十五世传人。自他起华严法脉兼传慈恩宗（唯识/法相宗），开创'贤首兼慈恩'传承体系。钦因长老等现代传人皆属此高原法系。", "wk": [], "wl": {}, "v": 0}, {"id": "person_012", "n": "月霞", "dy": "清", "ti": "近现代华严复兴先驱", "li": "月霞系", "multi": [], "tp": "patriarch", "b": 1858, "d": 1917, "bio": "清末民初华严宗复兴的关键人物。于常熟兴福寺创立华严大学（1914年），为中国近代第一所华严专宗教育机构，培养了一批现代华严学僧。", "wk": [], "wl": {}, "v": 0}, {"id": "person_031", "n": "应慈", "dy": "近现代", "ti": "近代华严座主", "li": "月霞系", "multi": [], "tp": "patriarch", "b": 1873, "d": 1965, "bio": "月霞长老师弟。继承月霞遗志，长期在上海等地弘传华严，被尊为'华严座主'。真禅法师之师。平生讲《华严经》多遍。", "wk": [], "wl": {}, "v": 0}, {"id": "person_013", "n": "常惺", "dy": "近现代", "ti": "", "li": "月霞系", "multi": [], "tp": "patriarch", "b": 1896, "d": 1939, "bio": "月霞长老弟子。继月霞之后主持华严大学，于北京、上海等地弘传华严。曾任闽南佛学院院长。", "wk": [], "wl": {}, "v": 0}, {"id": "person_018", "n": "智光", "dy": "近现代", "ti": "华严莲社首任住持", "li": "智光系", "multi": [], "tp": "patriarch", "b": 1889, "d": 1963, "bio": "近代华严学者。台北华严莲社第一任住持（1952年创社），开启台湾华严宗弘传事业。", "wk": [], "wl": {}, "v": 0}, {"id": "person_015", "n": "南亭", "dy": "近现代", "ti": "华严莲社第二任住持", "li": "华严莲社", "multi": [], "tp": "patriarch", "b": 1900, "d": 1982, "bio": "智光法师弟子。1952年与师智光共创台北华严莲社，任第二任住持。长期弘传华严教观，为台湾华严宗发展奠基人。", "wk": [], "wl": {}, "v": 0}, {"id": "person_016", "n": "成一", "dy": "当代", "ti": "华严莲社第三任住持·华严专宗学院创办人", "li": "华严莲社", "multi": [], "tp": "patriarch", "b": 1914, "d": 2011, "bio": "江苏泰县人。15岁出家。1949年赴台，协助师祖南亭和尚创办华严莲社，1972年继任住持。1975年创办华严专宗学院，以'专修、专研、专弘华严'为宗旨。1985年创立美国华严莲社。著有多部华严学著作。1988年后恢复泰州光孝寺等大陆祖庭。", "wk": ["成一和尚著作集"], "wl": {}, "v": 0}, {"id": "person_032", "n": "了中", "dy": "当代", "ti": "华严莲社第四任住持", "li": "华严莲社", "multi": [], "tp": "patriarch", "b": 1932, "d": 2022, "bio": "华严莲社第四任住持。延续'专研、专修、专弘'华严的莲社传统。", "wk": [], "wl": {}, "v": 0}, {"id": "person_033", "n": "净海", "dy": "当代", "ti": "华严莲社第五任住持", "li": "华严莲社", "multi": [], "tp": "patriarch", "b": null, "d": null, "bio": "华严莲社第五任住持。", "wk": [], "wl": {}, "v": 0}, {"id": "person_017", "n": "贤度", "dy": "当代", "ti": "华严莲社第六任住持·华严专宗学院院长", "li": "华严莲社", "multi": [], "tp": "patriarch", "b": 1960, "d": null, "bio": "当代华严宗女性法嗣传承者。成一法师弟子。2005年获印度德里大学哲学博士。推动华严现代化转型：发行《华严乐坛》专辑、AI多媒体文创演绎五十三参。著有《华严学讲义》《华严净土思想与念佛法门》等。", "wk": ["华严学讲义", "华严净土思想与念佛法门", "大海的印迹：贤度法师传"], "wl": {}, "v": 0}, {"id": "person_034", "n": "明度", "dy": "当代", "ti": "华严莲社第七任住持", "li": "华严莲社", "multi": [], "tp": "patriarch", "b": null, "d": null, "bio": "贤度法师之后，续掌华严莲社。贤首宗'明众生本际，悟诸佛果源'演字辈之一。", "wk": [], "wl": {}, "v": 0}, {"id": "person_041", "n": "钦因", "dy": "当代", "ti": "贤首宗第四十一世·高原法系第十七世", "li": "贤首宗高原法系", "multi": [], "tp": "patriarch", "b": 1928, "d": null, "bio": "北京人，俗名阎凤麟。贤首宗高原法系第41世。2008年9月21日于台北大华严寺举行传法大典，将法脉衣钵传予海云继梦(42世)。", "wk": [], "wl": {}, "v": 0}, {"id": "person_042", "n": "海云继梦", "dy": "当代", "ti": "三脉汇一的当代华严传承者·大华严寺导师", "li": "贤首宗高原法系", "multi": ["临济宗"], "tp": "patriarch", "b": 1950, "d": null, "bio": "俗名陈鹤山，台湾宜兰人。中兴大学经济系毕业。1991年于梦参长老座下出家（临济宗第四十七代，法名昌一，号继梦）。2008年受钦因长老传华严宗衣钵（贤首宗第四十二世）。同年得印度胜师子王菩萨传大乘瑜伽行法。汇三脉归一，开创'普贤乘华严宗'，复兴失传八百余年的'东山法门'。现为南投大华严寺导师。建立'无", "wk": [], "wl": {}, "v": 0}, {"id": "person_043", "n": "体佛", "dy": "当代", "ti": "贤首禅苑", "li": "贤首宗高原法系", "multi": [], "tp": "patriarch", "b": null, "d": null, "bio": "钦因长老法嗣之一。创立贤首禅苑，弘扬华严禅法。", "wk": [], "wl": {}, "v": 0}, {"id": "person_019", "n": "梦参", "dy": "当代", "ti": "当代华严弘扬巨擘", "li": "临济宗", "multi": [], "tp": "practitioner", "b": 1915, "d": 2017, "bio": "当代高僧，临济宗第四十六代。曾于五台山闭关修行多年。晚年大力弘扬《华严经》，讲说全本《八十华严》影响深远。1991年破例为海云继梦剃度（梦中得地藏菩萨示现），赐法名昌一。", "wk": ["华严经讲记（全本）"], "wl": {}, "v": 0}, {"id": "person_014", "n": "慈舟", "dy": "近现代", "ti": "", "li": "慈舟系", "multi": [], "tp": "scholar", "b": 1877, "d": 1958, "bio": "近代华严学者。长期于北京广济寺、济南等地讲说华严。著《华严经普贤行愿品亲闻记》，对《普贤行愿品》在现代的弘扬有重要推动。", "wk": ["华严经普贤行愿品亲闻记"], "wl": {}, "v": 0}, {"id": "person_044", "n": "真禅", "dy": "当代", "ti": "大陆当代华严禅实践者", "li": "月霞系", "multi": ["临济宗"], "tp": "patriarch", "b": 1916, "d": 1995, "bio": "当代大陆弘扬华严的代表性高僧。'禅宗临济、教在华严、行归地藏普贤'。师承应慈法师。1980年代后在玉佛寺多次主持华严佛七法会，宣讲《普贤行愿品》《十地品》。著有《玉佛丈室集》十集。", "wk": ["玉佛丈室集"], "wl": {}, "v": 0}, {"id": "person_045", "n": "如孝", "dy": "当代", "ti": "华严宗第四十一世法脉传人", "li": "华严宗", "multi": [], "tp": "scholar", "b": null, "d": null, "bio": "当代华严思想学者。师承星云长老、传印长老、法映长老。十余年研究华严思想当代实践。提出'别教一乘三类体系''法界十门体系''八纲体系'等。著有《生命的艺术》《修行的艺术》等丛书。2024年在《三秦宗教》刊发论文。", "wk": ["生命的艺术", "修行的艺术"], "wl": {}, "v": 0}, {"id": "person_046", "n": "雪窦", "dy": "当代", "ti": "美国华严莲社", "li": null, "multi": [], "tp": "scholar", "b": null, "d": null, "bio": "美国华严莲社相关人员，推动华严教法在海外英语世界的传播。", "wk": [], "wl": {}, "v": 0}, {"id": "person_020", "n": "胜友", "dy": "唐", "ti": "藏译华严经主译之一", "li": null, "multi": [], "tp": "translator", "b": null, "d": null, "bio": "印度译师。与智军（Ye shes sde）、遍照护（Vairocana）约9世纪初将《华严经》译为藏文（德格版Toh 44）。译自中亚于阗原本。", "wk": ["藏译华严经（Toh 44）"], "wl": {}, "v": 0}, {"id": "person_020b", "n": "智军", "dy": "唐", "ti": "藏译华严经主译之一", "li": null, "multi": [], "tp": "translator", "b": null, "d": null, "bio": "吐蕃著名译师。与印度胜友合作将《华严经》从于阗本译为藏文。为吐蕃王朝佛教翻译事业的核心人物。", "wk": ["藏译华严经（Toh 44）"], "wl": {}, "v": 1}, {"id": "person_050", "n": "审祥", "dy": "唐/日本", "ti": "日本华严宗初传", "li": "日本华严", "multi": [], "tp": "patriarch", "b": null, "d": 742, "bio": "新罗僧。来华从法藏学华严。后赴日本，于东大寺宣讲《华严经》，为日本华严宗之初传。", "wk": [], "wl": {}, "v": 0}, {"id": "person_110", "n": "法显", "dy": "东晋", "ti": "西行求法先驱", "li": "求法僧", "multi": [], "tp": "practitioner", "b": 337, "d": 422, "bio": "东晋高僧。399年以65岁高龄从长安出发,经河西走廊、西域、中亚至印度,历时14年游历30余国。412年海路归国。著《佛国记》记录印度佛教圣迹,为中国首位完成印度求法之旅的僧人。", "wk": ["佛国记(高僧法显传)"], "wl": {}, "v": 1}, {"id": "person_111", "n": "玄奘", "dy": "唐", "ti": "大翻译家·法相宗创始人", "li": "求法僧", "multi": [], "tp": "translator", "b": 602, "d": 664, "bio": "唐代高僧。629年从长安西行,经西域中亚至印度那烂陀寺,师从戒贤。645年归国携657部梵本,主持译场译经75部1335卷。著《大唐西域记》,创中国法相唯识宗。", "wk": ["大唐西域记", "大般若经", "成唯识论"], "wl": {}, "v": 1}, {"id": "person_112", "n": "义净", "dy": "唐", "ti": "海上求法僧·译经家", "li": "求法僧", "multi": [], "tp": "translator", "b": 635, "d": 713, "bio": "唐代高僧。671年从广州乘波斯船经海路至印度,游历那烂陀寺等30余国。695年归国携梵本400余部,译经56部230卷,偏重律藏。著《南海寄归内法传》《大唐西域求法高僧传》。与法显、玄奘并称三大求法僧。", "wk": ["南海寄归内法传", "大唐西域求法高僧传"], "wl": {}, "v": 1}, {"id": "person_113", "n": "真谛", "dy": "梁/陈", "ti": "四大译经师之一", "li": "译师", "multi": [], "tp": "translator", "b": 499, "d": 569, "bio": "西印度优禅尼国人。梁大同十二年(546)来华,值梁末战乱辗转各地译经。译《摄大乘论》《俱舍论》等64部278卷,系统传译瑜伽行派唯识学。与鸠摩罗什、玄奘、义净并称四大译经师。", "wk": ["摄大乘论", "俱舍论", "大乘起信论(重译)"], "wl": {}, "v": 1}, {"id": "person_114", "n": "求那跋陀罗", "dy": "刘宋", "ti": "楞伽经主译", "li": "译师", "multi": [], "tp": "translator", "b": 394, "d": 468, "bio": "中印度人。刘宋元嘉十二年(435)经海路至广州,后至建康译经。译《楞伽经》《胜鬘经》《杂阿含经》等52部134卷。其楞伽译本后为禅宗初祖达摩授与二祖慧可,影响禅宗思想深远,亦与华严如来藏思想有深层义学会通。", "wk": ["楞伽阿跋多罗宝经", "胜鬘经", "杂阿含经"], "wl": {}, "v": 1}, {"id": "person_115", "n": "不空", "dy": "唐", "ti": "密宗开元三大士之一", "li": "译师", "multi": [], "tp": "translator", "b": 705, "d": 774, "bio": "师子国(斯里兰卡)人,一说北印度人。幼来华师事金刚智。741年赴师子国和印度求法,746年归国携梵本500余部。译《金刚顶经》等密教经典,与善无畏、金刚智并称开元三大士。华严宗密法(秽迹金刚)与此传承有历史关联。", "wk": ["金刚顶经", "大乘密严经"], "wl": {}, "v": 1}, {"id": "person_116", "n": "竺法护", "dy": "西晋", "ti": "敦煌菩萨·大译经家", "li": "译师", "multi": [], "tp": "translator", "b": 239, "d": 316, "bio": "月氏侨民,世居敦煌。随师游历西域诸国,通晓36国语言。译经149部,包括华严经中《渐备一切智德经》(十地品异译)、《等目菩萨三昧经》(十定品异译)、《如来兴显经》(如来出现品异译)等多部华严单行经。被尊为'敦煌菩萨'。", "wk": ["渐备一切智德经", "如来兴显经", "正法华经"], "wl": {}, "v": 1}, {"id": "person_117", "n": "慧超", "dy": "唐/新罗", "ti": "新罗求法僧", "li": "求法僧", "multi": [], "tp": "practitioner", "b": 704, "d": 787, "bio": "新罗僧。约723年从中国出发经海路至印度,游历五天竺佛教圣迹。727年归国后著《往五天竺国传》记录印度、中亚、西域见闻。该书敦煌残卷于1908年为伯希和发现,为研究8世纪中亚印度的珍贵一手文献。", "wk": ["往五天竺国传"], "wl": {}, "v": 1}, {"id": "person_120", "n": "善无畏", "dy": "唐", "ti": "开元三大士之首·密宗初传", "li": "译师", "multi": [], "tp": "translator", "b": 637, "d": 735, "bio": "中印度人,甘露王后裔。716年至长安,玄宗礼为国师。译《大日经》七卷,传胎藏界密法。与金刚智、不空并称开元三大士,为中国密宗奠基人。弟子一行协助译经并著《大日经疏》。", "wk": ["大日经(大毗卢遮那成佛神变加持经)", "苏婆呼童子请问经"], "wl": {}, "v": 1}, {"id": "person_121", "n": "金刚智", "dy": "唐", "ti": "开元三大士·金刚界密法", "li": "译师", "multi": [], "tp": "translator", "b": 671, "d": 741, "bio": "南印度摩赖耶国人。719年经海路至广州,次年抵长安。译《金刚顶经》传金刚界密法。与善无畏、不空并称开元三大士。弟子不空继承其法脉,后传入日本成真言宗。", "wk": ["金刚顶瑜伽中略出念诵经", "七俱胝佛母准提大明陀罗尼经"], "wl": {}, "v": 1}, {"id": "person_122", "n": "一行", "dy": "唐", "ti": "天文学家·密宗学僧", "li": "译师", "multi": [], "tp": "scholar", "b": 683, "d": 727, "bio": "唐代高僧,俗名张遂。精通天文历算,制《大衍历》。师事善无畏,协助译《大日经》并著《大日经疏》二十卷,为密宗义学之奠基著作。一行亦曾参学禅宗北宗普寂。", "wk": ["大日经疏", "大衍历"], "wl": {}, "v": 1}, {"id": "person_123", "n": "慧果", "dy": "唐", "ti": "密宗第七祖·青龙寺", "li": "译师", "multi": [], "tp": "patriarch", "b": 746, "d": 805, "bio": "唐代密宗高僧。师事不空,兼承善无畏胎藏界与金刚智金刚界两部密法。住长安青龙寺,为密宗集大成者。日本空海入唐即从慧果受法,归国后创立日本真言宗。", "wk": [], "wl": {}, "v": 1}, {"id": "person_124", "n": "空海", "dy": "唐/日本", "ti": "日本真言宗开祖·弘法大师", "li": "日本华严", "multi": [], "tp": "patriarch", "b": 774, "d": 835, "bio": "日本真言宗开祖。804年入唐,于长安青龙寺从慧果受两部密法。806年归国后于高野山开创真言宗。著《十住心论》以华严判教框架判摄显密诸宗,体现密教与华严义学之深层对话。", "wk": ["十住心论", "即身成佛义", "秘密曼荼罗十住心论"], "wl": {}, "v": 1}, {"id": "person_125", "n": "六师外道", "dy": "古印度", "ti": "佛陀时代非佛教思想家", "li": "印度源流", "multi": [], "tp": "scholar", "b": null, "d": null, "bio": "与释迦牟尼同时代的六位印度思想家。据《沙门果经》记载:富兰那迦叶(道德否定论)、末伽梨拘舍罗(宿命论)、散若夷毗罗梨子(不可知论)、阿耆多翅舍钦婆罗(唯物论)、迦罗鸠驮迦旃延(原子论)、尼乾陀若提子(耆那教创始人)。佛教教义正是在与这些学派的对话与辩驳中确立的。", "wk": [], "wl": {}, "v": 1}, {"id": "person_126", "n": "成观法师", "dy": "当代", "ti": "华严宗42世·真言宗53世阿阇梨·大毘卢寺住持", "li": "贤首宗高原法系", "multi": [], "tp": "patriarch", "b": 1947, "d": null, "bio": "台北人,台师大英语系毕业(1972),美国德州TCU英研所深造。1988年于纽约庄严寺依天台宗45代显明老和尚出家,同年于基隆海会寺受三坛大戒。1996年于日本高野山入坛受金胎两部大法,得传法灌顶阿阇梨位,为真言宗53世。2010年4月24日于台北福慧寺依钦因长老受华严兼慈恩法脉,为高原法系贤首宗4", "wk": ["楞伽经义贯", "大佛顶首楞严经义贯", "大乘百法明门论今注", "唯识三十论颂义贯"], "wl": {}, "v": 1}, {"id": "person_f01", "n": "思元慧三", "dy": "近现代", "ti": "高原法系40世·福慧寺开山", "li": "贤首宗高原法系", "tp": "patriarch", "b": 1901, "d": 1986, "bio": "宛平人，俗姓霍。北京广善寺第11代住持。1948年赴台，创树林福慧寺。民国37年来台时已47岁，随身仅带一尊华严三圣像。为高原法系在台根本道场开创者。", "wk": []}, {"id": "person_f02", "n": "体化性果", "dy": "当代", "ti": "福慧寺第三代住持", "li": "贤首宗高原法系", "tp": "patriarch", "b": 1950, "d": null, "bio": "钦因长老法嗣。福慧寺第三代住持。继承贤首宗高原法系在台弘法事业。", "wk": []}, {"id": "person_j01", "n": "良弁", "dy": "唐/日本", "ti": "东大寺初代别当", "li": "日本华严", "tp": "patriarch", "b": 689, "d": 773, "bio": "审祥弟子。东大寺开山。主持《华严经》讲说。", "wk": []}, {"id": "person_j02", "n": "实忠", "dy": "日本", "ti": "东大寺二代", "li": "日本华严", "tp": "patriarch", "b": 726, "d": 800, "bio": "良弁弟子。继承东大寺华严教学。", "wk": []}, {"id": "person_j03", "n": "等定", "dy": "日本", "ti": "东大寺华严", "li": "日本华严", "tp": "patriarch", "b": 800, "d": 870, "bio": "日本华严宗传承者。", "wk": []}, {"id": "person_j04", "n": "圣宝", "dy": "日本", "ti": "醍醐寺开山", "li": "日本华严", "tp": "patriarch", "b": 832, "d": 909, "bio": "理源大师。兼传真言与华严。", "wk": []}, {"id": "person_j05", "n": "观贤", "dy": "日本", "ti": "东大寺别当", "li": "日本华严", "tp": "patriarch", "b": 853, "d": 925, "bio": "东大寺华严教学之中兴。", "wk": []}, {"id": "person_s01", "n": "魏道儒", "dy": "当代", "ti": "中国社科院学部委员", "li": p": "patriarch", "b": null, "d": null, "bio": "梵名Dīpaṃkara。过去无量劫前之佛。据华严经如来名号品及本生经典，燃灯佛曾为释迦牟尼前身授记: 汝于来世当得作佛号释迦牟尼。此为华严经中佛佛相续无尽法界缘起之始。", "wk": [], "v": 1}, {"id": "person_106", "n": "迦叶佛", "dy": "远古印度", "ti": "贤劫第三佛·释迦前身之师", "li": "印度源流", "tp": "patriarch", "b": null, "d": null, "bio": "梵名Kāśyapa。贤劫千佛之第三尊，释迦牟尼佛之前一佛。据华严经，释迦成道时十方诸佛各遣菩萨来集，其中包括过去诸佛之法身显现。华严宗以十方三世无尽诸佛构成法界缘起之佛佛相望网络。", "wk": [], "v": 1}, {"id": "person_107", "n": "毗卢遮那佛", "dy": "法身常住", "ti": "华严教主·法身本源", "li": "印度源流", "tp": "patriarch", "b": null, "d": null, "bio": "梵名Vairocana，华严经之根本教主。意译光明遍照、大日如来。华严经以毗卢遮那佛法身为宇宙本体，十方三世一切诸佛皆为其化现。华严宗法界缘起、一即一切等核心教义皆围绕毗卢遮那佛法身展开。非历史人物，为华严教义之法身源头。", "wk": [], "v": 1}, {"id": "person_130", "n": "拉克鲁希", "dy": "远古印度", "ti": "湿婆神第28代化身·Lord Lakulish", "li": "大乘瑜伽行法", "tp": "patriarch", "b": null, "d": null, "bio": "Lord Lakulish。相传为4500年前湿婆神第28代化身,为印度古典瑜伽行法之原始指导者。其传承历经千年,于现代示现指导巴布基大瑜伽士。", "wk": [], "v": 0}, {"id": "person_131", "n": "巴布基", "dy": "近现代", "ti": "大瑜伽士·Babuji", "li": "大乘瑜伽行法", "tp": "practitioner", "b": null, "d": null, "bio": "Babuji(巴布基大瑜伽士)。Lord Lakulish示现指导的大成就者,传承古典瑜伽行法。", "wk": [], "v": 0}, {"id": "person_132", "n": "普拉梵纳德", "dy": "近现代", "ti": "Swami Pranavanad", "li": "大乘瑜伽行法", "tp": "practitioner", "b": 1884, "d": 1959, "bio": "Swami Pranavanad。1913年普贤菩萨于印度再度示现,为其传法。开创现代大乘瑜伽行法传承。", "wk": [], "v": 0}, {"id": "person_133", "n": "克利普梵纳德", "dy": "近现代", "ti": "Swami Kripalavanand", "li": "大乘瑜伽行法", "tp": "practitioner", "b": 1913, "d": 1981, "bio": "Swami Kripalavanand。1932年从普拉梵纳德接法,继续弘扬大乘瑜伽行法。", "wk": [], "v": 0}, {"id": "person_134", "n": "胜师子王菩萨", "dy": "当代", "ti": "Swami Rajarshi Muni·印度国师", "li": "大乘瑜伽行法", "tp": "practitioner", "b": 1931, "d": 2023, "bio": "Swami Rajarshi Muni(惹查西牟尼)。1971年从克利普梵纳德接法。1993年Lakulish以灵性形象示现,遂创立LIFE Mission。被尊为印度国师,2019年获印度总理奖。2008年12月于阿弥塔巴市传大乘瑜伽行法灌顶予海云继梦。已圆寂(约2023年)。", "wk": [], "v": 0}, {"id": "person_140", "n": "罗摩克里希纳", "dy": "1836–1886", "ti": "Ramakrishna·近代印度灵性复兴之源", "li": "参考线", "tp": "practitioner", "b": 1836, "d": 1886, "bio": "R var GAP = {"vs": [{"n": "藏文德格版 (Toh 44)", "c": 45, "v": "4册", "t": "胜友、智军", "p": "9世纪初"}, {"n": "汉文八十华严 (T10n0279)", "c": 39, "v": "80卷", "t": "实叉难陀", "p": "699年"}, {"n": "汉文六十华严 (T09n0278)", "c": 34, "v": "60卷", "t": "佛驮跋陀罗", "p": "420年"}, {"n": "汉文四十华严 (T10n0293)", "c": 1, "v": "40卷", "t": "般若", "p": "798年"}], "sm": {"A": 2, "B": 3, "C": 3, "D": 1, "E": 32}, "cs": [{"bo": 7, "z80": 7, "ti": "如来名号品", "sa": "", "tp": "C", "sm": "藏文此品位于《如来华严品》之后，故品目序号从汉文第7品变为藏文第12品。内容基本对应但结构位置不同。"}, {"bo": 11, "z80": null, "ti": "如来华严品", "sa": "Tathāgatāvataṃsaka", "tp": "A", "sm": "藏文独有品目。汉文六十华严、八十华严、四十华严均无此品。"}, {"bo": 27, "z80": 26, "ti": "十地品", "sa": "", "tp": "B", "sm": "藏文十地品可能源自更完整的梵本，结构接近独立《十地经》(Daśabhūmika)。与汉文十地品在细节上有参差。"}, {"bo": 28, "z80": null, "ti": "普贤宣说品", "sa": "Samantabhadraparivarta", "tp": "A", "sm": "藏文独有品目。汉文六十华严、八十华严、四十华严均无此品。"}, {"bo": 33, "z80": 31, "ti": "寿量品", "sa": "", "tp": "B", "sm": "藏文可能有更详尽的诸佛寿量描述。"}, {"bo": 39, "z80": 37, "ti": "如来出现品", "sa": "", "tp": "C", "sm": "六十华严无此品（仅34品）。八十华严对应《如来出现品》，六十华严对应第33品《宝王如来性起品》，名称和结构均有不同。"}, {"bo": 40, "z80": 38, "ti": "离世间品", "sa": "", "tp": "B", "sm": "藏文此品有部分独特异译段落，与汉文同名品内容有实质性参差。"}, {"bo": 41, "z80": 39, "ti": "入法界品", "sa": "Gaṇḍavyūha", "tp": "C", "sm": "四十华严即此品全本。藏文《入法界品》为全本。六十华严缺此品（仅有34品）。汉文有多个别译本。"}], "wn": ["⚠ T0309 法藏判为非十住品亦非十地品"], "content": {"core_finding": "藏文《华严经》(Toh44)译自中亚于阗原本，而非印度梵本。汉文《八十华严》亦由于阗请来梵本，但两者所据底本已不同——九世纪时华严梵本已多系分化。藏文45品中有2品为汉文三译所完全缺失（如来华严品、普贤宣说品），另有3品有实质性内容参差。", "diff_summary": {"categories": {"A": {"icon": "🔴", "label": "藏文独有品目", "color": "#c46b5d", "description": "汉文三译完全缺失"}, "B": {"icon": "🟠", "label": "内容实质性参差", "color": "#c8893e", "description": "同名品内容有显著差异"}, "C": {"icon": "🟡", "label": "结构/开合不同", "color": "#a08020", "description": "品目序号名称开合不同"}, "D": {"icon": "🔵", "label": "品目级微小差异", "color": "#5e8b9e", "description": "个别段落不同"}, "E": {"icon": "🟢", "label": "汉藏基本对应", "color": "#7d9a6e", "description": "32品大致一致"}}}, "case_studies": [{"id": 1, "title": "案例一: Samantabhadra 译名差异", "content": "藏文「kun tu bzang po」→ 汉译多作「普贤」。但84000翻译注释指出，汉文个别处作「普贤尊」（pu xian zun, Lord Samantabhadra），而藏文保持统一译法。此差异反映汉译者对不同语境下的敬称处理。\n"}, {"id": 2, "title": "案例二: gata 多义歧出", "content": "同一梵文词 gata（「已去/已至」 vs 「现在/存在」），藏文和汉文译者在不同品中选择不同义项，导致同一段落产生「如来已去」和「如来现前」两种截然不同的理解。\n"}, {"id": 3, "title": "案例三: 底本系谱分化", "content": "德格版Tshalpa系与Themephangma系之间，同一品末偈颂有出入（后者缺末偈）。84000翻译以Tshalpa为底本，Themephangma异读入校注。此说明藏文大藏经内部亦存在版本分化。\n"}, {"id": 4, "title": "案例四: 「如孝子心」版本歧异", "content": "同一段落: 六十华严作「发孝子心，见善知识无厌足故」；八十华严增「承顺颜色故」；四十华严又增「承事供养」。藏文本将su-putra直译，未添加「孝」的汉文化概念。越晚译本解释性附加语越长。\n"}], "scholarly_perspectives": [{"author": "Imre Hamar", "affiliation": "Eötvös Loránd University, 匈牙利科学院博士", "content": "「华严经在印度和中亚并非一时一地之作，而是由多部原本独立的单行经（如《十地品》《入法界品》）于公元2-4世纪逐步汇集而成。藏汉译本的差异，本质上是不同编纂阶段和不同地域传统的反映。」—— 参见其博士论文 The Buddhāvatamsaka-sūtra and Its Chinese Interpretation (2014) 及 The Metaphor of the Painter (SOS 13·2, 2014).\n"}, {"author": "高明道", "affiliation": "台湾华严学者", "content": "「南极汉文《华严经》，由于译者抉择各异，撰述注释的古德就有不同空间可发挥。参考藏译本便可发现，诠释的领域又不一样。即使有印度语文本可供对照，个人的解读终究脱离不了诠释。」\n"}, {"author": "84000翻译团队 (Peter Alan Roberts 等)", "content": "「华严经的梵文原本在古代即存在至少两种以上版本。证据包括「观世音/观自在」拼写差异——法藏《探玄记》卷19明确记载了这种拼写分歧。」\n"}], "methodology_84000": {"intro": "84000项目（Peter Alan Roberts团队）在翻译Toh44时采用多底本对校方法，其翻译注释体系为汉藏对勘提供了重要参考框架：", "categories": ["① 梵-藏歧异: 藏译本与现存梵文写本的出入（藏译者是否据另本或误读）", "② 甘珠尔版本间异读: 德格/斯托克/永乐/理塘/康熙/那塘/拉萨/Choné 八种版本的异文记录", "③ 抄写错误: 藏文抄本中的明显笔误（如 rgyu 误作 sgyu ma「幻」）", "④ 注释书佐证: 据世亲《十地经论》及 Sūryasiddha 注释判定疑误字", "⑤ 汉译旁证: 当梵藏歧异无法判定时，以汉译本（实叉难陀/佛驮跋陀罗）作为第三参照系", "⑥ 数字出入: 如《十地品》梵本作「百千俱胝」，德格版甘珠尔改为极大数，而世亲注释支持梵本简数"]}, "structural_differences": "汉译「会」制度 vs 藏译连续品目\n\n汉文八十华严按七处九会（七个地点·九次法会）组织经文；六十华严为七处八会。此为汉地祖师（智俨/法藏/澄观）判释所立。\n\n藏文 Toh44 不采用「会」的分组体系——45品为连续编号，无中间层的法会分组。这一结构差异意味着：汉文读者透过「会」的框架理解华严经的教义递进，而藏文读者直接面对45品的内容序列。两种组织方式各代表不同的解经传统，不能简单互译。\n", "consensus_table": [{"topic": "藏译本底本是否为于阗本", "viewpoint": "BDRC目录标注为于阗译出。部分学者认为有印度梵本中介", "consensus": "85% consensus", "color": "#7d9a6e"}, {"topic": "Ch.11 如来华严品是否为独立经典后并入", "viewpoint": "结构分析支持独立说，但无直接文献证据", "consensus": "disputed", "color": "#c8893e"}, {"topic": "「观世音/观自在」拼写差异是否证明多版本", "viewpoint": "法藏《探玄记》卷19明确记载差异；质疑者认为仅是音译习惯", "consensus": "60% consensus", "color": "#a08020"}, {"topic": "藏文《离世间品》异译段落的来源", "viewpoint": "可能反映更古老的于阗传承；学界尚未系统对勘", "consensus": "unknown", "color": "#c46b5d"}], "priority_roadmap": [{"level": "P0", "color": "#c46b5d", "label": "最高优先", "content": "Ch.11 如来华严品 · Ch.28 普贤宣说品 — 汉文三译全缺，学术价值最高。\n获取路径: ① BDRC/BUDA API (buda.bdrc.io, 需注册) → Toh44 Unicode电子文本 ② 84000项目: 已发布入法界品(2021), Ch.11+Ch.28尚未发布 ③ 兜底: 学术论文中对藏文独有品目的研究摘要。目前P0阶段可先整理已知内容结构大纲。\n"}, {"level": "P1", "color": "#c8893e", "label": "高优先", "content": "Ch.27 十地品 · Ch.40 离世间品 — 有鸠摩罗什《十住经》、世亲《十地经论》、竺法护《度世品经》等别译可作对勘桥梁。\n"}, {"level": "P2", "color": "#a08020", "label": "中优先", "content": "Ch.33 寿量品 · Ch.39 如来出现品 — 有玄奘《显无边佛土功德经》和竺法护《如来兴显经》等别译可对照。\n"}], "version_evolution": [{"t": "龙宫原本", "s": "约2世纪", "l": "印度", "lang": "梵", "c": "#9e8b6e", "n": "上中下三本·下本十万偈", "w": 120}, {"t": "兜沙经", "s": "167", "l": "洛阳", "lang": "汉", "c": "#a09080", "n": "支娄迦谶·1卷", "w": 110}, {"t": "六十华严", "s": "420", "l": "建康", "lang": "汉", "c": "#b8863c", "n": "佛驮跋陀罗·60卷34品", "w": 130}, {"t": "八十华严", "s": "699", "l": "洛阳", "lang": "汉", "c": "#b8863c", "n": "实叉难陀·80卷39品", "w": 130}, {"t": "四十华严", "s": "798", "l": "长安", "lang": "汉", "c": "#b8863c", "n": "般若·40卷入法界品", "w": 130}, {"t": "藏译华严", "s": "~830", "l": "吐蕃", "lang": "藏", "c": "#c46b5d", "n": "胜友/智军·4册45品", "w": 130}, {"t": "尼泊尔写本", "s": "11-12c", "l": "加德满都", "lang": "梵", "c": "#9e8b6e", "n": "梵文残卷", "w": 100}, {"t": "西夏译本", "s": "11-13c", "l": "西夏", "lang": "西夏", "c": "#8b7a9e", "n": "据八十华严译", "w": 110}, {"t": "回鹘译本", "s": "13-14c", "l": "高昌", "lang": "回鹘", "c": "#8b7a9e", "n": "安藏译", "w": 90}, {"t": "满文译本", "s": "18c", "l": "北京", "lang": "满", "c": "#8b7a9e", "n": "四体合璧", "w": 100}, {"t": "Cleary英译", "s": "1984-87", "l": "美国", "lang": "英", "c": "#5e8b9e", "n": "据八十华严", "w": 110}, {"t": "Dharmamitra", "s": "2022", "l": "美国", "lang": "英", "c": "#5e8b9 var EVENTS = {"africa_timeline": {"events": [{"y": -500, "lat": 10.0, "lng": 8.0, "z": 5, "label": "诺克文化·西非铁器文明", "info": "尼日利亚高原诺克文化·赤陶雕塑·撒哈拉以南最早铁器文明·班图扩张前奏", "region": "africa", "source": "UNESCO《非洲通史》/ J.D.Fage《非洲史》"}, {"y": 300, "lat": 14.0, "lng": 38.0, "z": 5, "label": "阿克苏姆帝国·埃塞俄比亚高原", "info": "阿克苏姆崛起·红海贸易枢纽·铸造金币·最早基督教国家之一·方尖碑", "region": "africa", "source": "UNESCO《非洲通史》/ J.D.Fage《非洲史》"}, {"y": 700, "lat": 17.0, "lng": -5.0, "z": 4, "label": "加纳帝国·跨撒哈拉黄金贸易", "info": "西非首个大帝国·跨撒哈拉黄金之路·\"黄金之国\"美誉", "region": "africa", "source": "UNESCO《非洲通史》/ J.D.Fage《非洲史》"}, {"y": 1000, "lat": -20.0, "lng": 30.0, "z": 5, "label": "大津巴布韦石城", "info": "绍纳人石构建筑群·印度洋贸易内陆枢纽·黄金象牙出口·非洲最大史前石构", "region": "africa", "source": "UNESCO《非洲通史》/ J.D.Fage《非洲史》"}, {"y": 1230, "lat": 14.0, "lng": -8.0, "z": 4, "label": "桑迪亚塔·马里帝国建立", "info": "桑迪亚塔·凯塔建立马里帝国·尼亚尼为都·曼德宪章·口述史诗《松迪亚塔》", "region": "africa", "source": "UNESCO《非洲通史》/ J.D.Fage《非洲史》"}, {"y": 1324, "lat": 14.0, "lng": -8.0, "z": 4, "label": "曼萨·穆萨赴麦加朝圣", "info": "马里皇帝曼萨·穆萨携带巨量黄金震撼开罗·廷巴克图学术城兴起·桑科雷大学", "region": "africa", "source": "UNESCO《非洲通史》/ J.D.Fage《非洲史》"}, {"y": 1464, "lat": 16.0, "lng": 0.0, "z": 4, "label": "桑尼·阿里·桑海帝国", "info": "桑尼·阿里建桑海帝国·取代马里·廷巴克图与杰内学术商贸中心", "region": "africa", "source": "UNESCO《非洲通史》/ J.D.Fage《非洲史》"}, {"y": 1500, "lat": 6.0, "lng": 5.0, "z": 5, "label": "贝宁王国·青铜艺术巅峰", "info": "埃多人贝宁王国全盛·青铜浮雕与象牙雕刻·奥巴王权·与葡萄牙贸易", "region": "africa", "source": "UNESCO《非洲通史》/ J.D.Fage《非洲史》"}, {"y": 1650, "lat": 5.0, "lng": 2.0, "z": 4, "label": "跨大西洋奴隶贸易高峰", "info": "欧洲三角贸易·西非人口锐减·非洲社会结构巨变·刚果王国衰落", "region": "africa", "source": "UNESCO《非洲通史》/ J.D.Fage《非洲史》"}, {"y": 1804, "lat": 13.0, "lng": 5.0, "z": 5, "label": "奥斯曼·丹·福迪奥·索科托", "info": "奥斯曼·丹·福迪奥发动圣战·建立索科托哈里发国·豪萨兰伊斯兰化", "region": "africa", "source": "UNESCO《非洲通史》/ J.D.Fage《非洲史》"}, {"y": 1818, "lat": -28.0, "lng": 30.0, "z": 5, "label": "恰卡·祖鲁帝国", "info": "恰卡(Shaka Zulu)统一祖鲁诸部·军事改革·祖鲁王国崛起·南部非洲格局重塑", "region": "africa", "source": "UNESCO《非洲通史》/ J.D.Fage《非洲史》"}, {"y": 1884, "lat": -5.0, "lng": 25.0, "z": 3, "label": "柏林会议·瓜分非洲", "info": "欧洲列强柏林西非会议·划定殖民边界无视族群分布·刚果自由邦暴行", "region": "africa", "source": "UNESCO《非洲通史》/ J.D.Fage《非洲史》"}, {"y": 1957, "lat": 5.5, "lng": -0.2, "z": 5, "label": "恩克鲁玛·加纳率先独立", "info": "加纳率先独立·恩克鲁玛领导·泛非主义·撒哈拉以南非洲非殖民化开端", "region": "africa", "source": "UNESCO《非洲通史》/ J.D.Fage《非洲史》"}, {"y": 1960, "lat": 0.0, "lng": 25.0, "z": 3, "label": "非洲独立年·17国独立", "info": "十七个非洲国家同年独立·法属非洲解体·泛非主义高涨", "region": "africa", "source": "UNESCO《非洲通史》/ J.D.Fage《非洲史》"}, {"y": 1994, "lat": -26.0, "lng": 28.0, "z": 5, "label": "曼德拉·南非废除种族隔离", "info": "曼德拉当选总统·种族隔离制度废除·真相与和解委员会", "region": "africa", "source": "UNESCO《非洲通史》/ J.D.Fage《非洲史》"}]}, "anim_waypoints": {"waypoints": [{"y": -1500, "lat": 29, "lng": 76, "z": 3, "label": "吠陀文明·梨俱吠陀", "info": "雅利安人入印,吠陀宗教体系形成。轮回、业力、禅定概念萌芽。"}, {"y": -800, "lat": 26.5, "lng": 82, "z": 3, "label": "奥义书哲人·梵我哲学", "info": "梵(Brahman)与阿特曼(ātman)概念提出。佛教「无我」说在此对话中形成。"}, {"y": -600, "lat": 34.0, "lng": 114.0, "z": 5, "rel": "daoist", "label": "☯老子·《道德经》", "info": "老子(约前6世纪),道家学派创始人。据《史记》为周守藏室之史,居洛邑。后见周衰,西出函谷关,应关令尹喜之请著《道德经》五千言而去。", "src": "《史记·老子韩非列传》"}, {"y": -570, "lat": 34.6, "lng": 112.4, "z": 5, "rel": "daoist", "label": "☯老子·周守藏室之史", "info": "老子居洛邑任周王室守藏室之史(国家图书馆馆长)。在此期间博览典籍,形成其道法自然的哲学体系。", "src": "《史记·老子韩非列传》"}, {"y": -551, "lat": 35.6, "lng": 116.9, "z": 5, "rel": "confucian", "label": "📖孔子诞生·鲁国陬邑", "info": "孔子(前551-前479)生于鲁国陬邑(今山东曲阜)。父叔梁纥,母颜徵在。三岁丧父,家贫而好学。", "src": "《史记·孔子世家》"}, {"y": -522, "lat": 35.6, "lng": 116.9, "z": 5, "rel": "confucian", "label": "📖孔子·三十而立·始教", "info": "孔子约三十岁时开始授徒讲学,创办私学。主张有教无类,打破贵族对教育的垄断。", "src": "《史记·孔子世家》"}, {"y": -497, "lat": 36.0, "lng": 117.0, "z": 5, "rel": "confucian", "label": "📖孔子·周游列国", "info": "孔子55岁离开鲁国,开始14年周游列国之旅。先后至卫宋陈蔡等十余国,宣扬仁政德治,然终不见用。途中困于陈蔡之间,仍弦歌不辍。", "src": "《史记·孔子世家》"}, {"y": -484, "lat": 35.6, "lng": 116.9, "z": 5, "rel": "confucian", "label": "📖孔子·归鲁删述六经", "info": "68岁归鲁。整理《诗》《书》《礼》《乐》《易》《春秋》六经,为中国文化传承做出奠基性贡献。", "src": "《史记·孔子世家》"}, {"y": -479, "lat": 35.6, "lng": 116.9, "z": 5, "rel": "confucian", "label": "📖孔子逝世·儒学历程开始", "info": "73岁卒于鲁国。弟子编《论语》,儒学逐渐成为中华文明主流思想,后与佛教形成长达两千年的融突关系。"}, {"y": -372, "lat": 35.5, "lng": 117.0, "z": 5, "rel": "confucian", "label": "📖孟子·性善论", "info": "孟子(约前372-前289),战国儒家代表。提出性善论仁政说。其心性之学后与佛教如来藏思想有深层对话空间。", "src": "《史记·孟子荀卿列传》"}, {"y": -335, "lat": 36.0, "lng": 117.0, "z": 5, "rel": "confucian", "label": "📖孟子·游说齐梁", "info": "孟子效法孔子周游列国,先后至齐梁等国宣扬仁政王道。齐宣王时曾为客卿,但主张终不见用。晚年退而与弟子万章等作《孟子》七篇。", "src": "《史记·孟子荀卿列传》"}, {"y": -469, "lat": 37.9, "lng": 23.7, "z": 4, "rel": "western", "label": "🏛苏格拉底·雅典", "info": "苏格拉底(前469-前399),古希腊哲学奠基人。与孔子大致同时代,东西方哲学两大源头并行发展。", "bg": true, "src": "西洋哲学史"}, {"y": -334, "lat": 33.0, "lng": 44.0, "z": 3, "rel": "western", "label": "🏛亚历山大大帝东征", "info": "亚历山大东征至印度河流域,希腊文化与印度文明首次大规模接触。为后来犍陀罗佛教艺术的出现埋下伏笔。", "bg": true, "src": "世界史"}, {"y": -369, "lat": 33.5, "lng": 115.0, "z": 5, "rel": "daoist", "label": "☯庄子·蒙地漆园吏", "info": "庄子(约前369-前286)生于宋国蒙地(今豫皖交界)。曾任漆园吏,后弃官隐居。楚威王曾聘其为相,庄子笑拒:宁游戏污渎之中自快,无为有国者所羁。", "src": "《史记·老子韩非列传》"}, {"y": -300, "lat": 33.5, "lng": 115.0, "z": 5, "rel": "daoist", "label": "☯庄子·著《南华真经》", "info": "庄子晚年著书十万余言。《逍遥游》论精神自由,《齐物论》破主客二元,《养生主》说庖丁解牛。其坐忘心斋之说后与佛教禅观相通。", "src": "《庄子》/《史记》"}, {"y": -313, "lat": 35.0, "lng": 116.0, "z": 5, "rel": "confucian", "label": "📖荀子·性恶论", "info": "荀子(约前313-前238),战国儒家。性恶隆礼重法。其天人之分与佛教缘起论有可比较处。", "src": "《史记·孟子荀卿列传》"}, {"y": -563, "lat": 27.5, "lng": 83.3, "z": 5, "label": "释迦诞生·蓝毗尼园", "info": "悉达多太子生于迦毗罗卫。幼受婆罗门教育,后出家求道。"}, {"y": -528, "lat": 24.7, "lng": 85, "z": 5, "label": "释迦成道·菩提伽耶", "info": "35岁菩提树下觉悟。华严宗传统:此后三七日于定中说《华严经》,揭示法界缘起。"}, {"y": -500, "lat": 25.5, "lng": 83.0, "z": 4, "label": "六师外道·印度思想百花齐放", "info": "佛陀时代六大非佛教思想家活跃。耆那教(尼乾陀若提子)、唯物论(阿耆多)、宿命论(末伽梨)等与佛教同时竞争。佛教正是在这一多元思想生态中确立其独特教义。", "bg": true, "src": "《沙门果经》(DN 2)"}, {"y": -528, "lat": 25.4, "lng": 83, "z": 5, "label": "初转法轮·鹿野苑", "info": "为五比丘说四圣谛八正道。僧团成立,佛教诞生。此后45年游化讲经。"}, {"y": -483, "lat": 26.74, "lng": 83.89, "z": 5, "label": "释迦入灭·拘尸那罗", "info": "80岁于拘尸那罗入灭。弟子结集经律,佛教由此向四方传播。"}, {"y": -260, "lat": 25.3, "lng": 83, "z": 4, "label": "阿育王·佛教走出印度", "info": "阿育王皈依,派传教师向中亚东南亚传播。第三次结集。佛教从区域宗教变为世界宗教。", "src": "阿育王石刻诏书"}, {"y": -200, "lat": 34.0, "lng": 72.0, "z": 4, "label": "希腊·犍陀罗佛教艺术(有争议)", "info": "希腊-巴克特里亚时期佛教与希腊艺术在犍陀罗相遇。最早佛像出现时间学界有争议:一说公元前1世纪,一说公元1世纪。犍陀罗在佛教东传中的枢纽地位则无争议。", "src": "佛教艺术史(有学术争议)"}, {"y": -100, "lat": 33.7, "lng": 72.8, "z": 4, "label": "犍陀罗·大乘经论结集", "info": "犍陀罗地区成为大乘佛教发展重镇。般若经、华严经等大乘经典在此地区逐步形成。", "src": "佛教文献学"}, {"y": 65, "lat": 33.7, "lng": 72.8, "z": 4, "label": "迦腻色迦王·犍陀罗结集", "info": "贵霜帝国第四次结集。佛法深入中亚,犍陀罗成东传枢纽。大乘经论在此大量结集。"}, {"y": 80, "lat": 27.5, "lng": 77.7, "z": 4, "label": "马鸣·大乘起信论", "info": "造《大乘起信论》。一心二门之说后为华严心性论与判教体系的重要理论基础。"}, {"y": -136, "lat": 34.3, "lng": 108.9, "z": 5, "rel": "confucian", "label": "📖汉武帝·独尊儒术", "info": "董仲舒建议罢黜百家独尊儒术。儒学成为汉朝官方意识形态,后来佛教入华时与儒家伦理产生深刻碰撞与融合。", "src": "《汉书·董仲舒传》"}, {"y": 0, "lat": 31.7, "lng": 35.2, "z": 4, "rel": "western", "label": "✝耶稣诞生·伯利恒", "info": "耶稣基督诞生于犹太伯利恒。基督教此后逐渐发展为世界性宗教,与佛教在欧亚大陆两端并行发展。", "bg": true, "src": "《新约圣经》"}, {"y": 34, "lat": 32.0, "lng": 108.0, "z": 5, "rel": "daoist", "label": "☯张道陵诞生·沛国丰县", "info": "张道陵(34-156),原名张陵,沛国丰县人(今江苏丰县)。早年通晓五经,后弃儒学道。", "src": "《后汉书》《神仙传》"}, {"y": 100, "lat": 30.0, "lng": 105.0, "z": 5, "rel": "daoist", "label": "☯张道陵·入蜀鹤鸣山", "info": "张道陵入蜀至鹤鸣山(今四川大邑)。在此得太上老君亲授天师之位,创正一盟威之道(五斗米道)。", "src": "《神仙传》"}, {"y": 142, "lat": 30.5, "lng": 104.0, "z": 5, "rel": "daoist", "label": "☯张道陵·青城山·道教正式创立", "info": "张道陵在青城山设二十四治(教区),正式建立天师道。奉老子为教祖,以《道德经》为根本经典,《老子想尔注》阐发教义。道教从此成为有组织的宗教。", "src": "《后汉书·刘焉传》《神仙传》"}, {"y": 156, "lat": 30.5, "lng": 104.0, "z": 5, "rel": "daoist", "label": "☯张道陵·飞升·系师张衡继任", "info": "张道陵于青城山飞升(逝世),享年123岁。其子张衡继任为第二代天师(系师),孙张鲁为第三代天师,天师世家由此传承至今。", "src": "《神仙传》《三国志·张鲁传》"}, {"y": 167, "lat": 34.7, "lng": 112.4, "z": 5, "label": "支谶译兜沙经·华严首入汉地", "info": "月氏僧支娄迦谶至洛阳,译《佛说兜沙经》。虽仅1卷,却是华严经文首次汉译。"}, {"y": 320, "lat": 25.1, "lng": 85.4, "z": 4, "label": "无著·世亲·那烂陀寺", "info": "瑜伽行派于那烂陀弘传。世亲造《十地经论》,后经汉译催生地论学派。"}, {"y": 344, "lat": 41.7, "lng": 82.9, "z": 4, "label": "鸠摩罗什出生·龟兹", "info": "罗什生于西域龟兹。后至长安成四大译师之首,译十住经等为华严学奠基。"}, {"y": 359, "lat": 34, "lng": 72, "z": 4, "label": "佛驮跋陀罗·北天竺", "info": "觉贤生于北天竺。后至建康首译六十华严全本。"}, {"y": 401, "lat": 34.3, "lng": 108.9, "z": 5, "label": "罗什至长安·译经运动", "info": "弘始三年至长安,八百沙门参与译场。译中论/十住经/法华经等。"}, {"y": 320, "lat": 30.0, "lng": 115.0, "z": 5, "rel": "daoist", "label": "☯葛洪·《抱朴子》", "info": "葛洪(283-363),晋代道教思想家。著《抱朴子》内篇系统阐述道教神仙理论。道教从此有了完整的理论体系。", "bg": true, "src": "《晋书·葛洪传》"}, {"y": 399, "lat": 34.3, "lng": 108.9, "z": 5, "label": "法显西行·长安出发", "info": "法显(337-422)以65岁高龄从长安出发,经河西走廊、敦煌、鄯善、于阗,越葱岭至印度。同行11人,途中或返或亡。", "src": "《佛国记》"}, {"y": 405, "lat": 37.1, "lng": 79.9, "z": 5, "label": "法显·于阗·观行像盛会", "info": "法显至于阗国,恰逢盛大的行像法会。记录于阗佛教繁荣景象。于阗后为藏译华严底本来源。", "src": "《佛国记》"}, {"y": 410, "lat": 25.1, "lng": 85.4, "z": 5, "label": "法显·抵达中天竺", "info": "法显越过葱岭雪山进入印度。游历那烂陀、菩提伽耶、鹿野苑等圣迹,学梵书梵语,抄写戒律。", "src": "《佛国记》"}, {"y": 420, "lat": 32.1, "lng": 118.8, "z": 5, "label": "六十华严·建康道场寺", "info": "佛驮跋陀罗译六十华严34品。华严经首次以全貌呈现汉地。"}, {"y": 468, "lat": 34.7, "lng": 112.4, "z": 5, "label": "慧光·地论南道派", "info": "从勒那摩提学十地经论,开地论南道。其学数代传至智俨法藏,为华严义学前身。"}, {"y": 313, "lat": 41.0, "lng": 28.9, "z": 4, "rel": "western", "label": "✝米兰敕令·基督教合法化", "info": "罗马皇帝君士坦丁颁布米兰敕令,基督教在罗马帝国合法化。从此基督教与佛教在欧亚大陆两端各自传播发展。", "bg": true, "src": "罗马帝国史"}, {"y": 508, "lat": 34.7, "lng": 112.4, "z": 5, "label": "十地经论·洛阳译出", "info": "菩提流支译世亲十地经论。催生南北朝最重要的义学流派:地论学派。"}, {"y": 557, "lat": 33.9, "lng": 109, "z": 6, "label": "杜顺·终南山·华严创宗", "info": "著法界观门/五教止观。以法界三观和五教止观为华严宗奠定修行理论基础。"}, {"y": 597, "lat": 29.2, "lng": 121, "z": 5, "label": "智𫖮·天台宗成立", "info": "天台宗于天台山成立(中国最早宗派)。华严判教中「同教一乘」即针对天台而设。"}, {"y": 602, "lat": 33.9, "lng": 109, "z": 6, "label": "智俨·华严二祖", "info": "从杜顺出家,著搜玄记/一乘十玄门。开创华严宗经疏传统,为法藏之师。"}, {"y": 643, "lat": 34.3, "lng": 108.9, "z": 6, "label": "法藏·华严三祖·宗派确立", "info": "系统化五教十宗判教。武则天赐号贤首。参与八十华严译场证义。华严宗至此正式确立。"}, {"y": 629, "lat": 34.3, "lng": 108.9, "z": 5, "label": "玄奘西行·长安出发", "info": "玄奘(602-664)29岁从长安出发,经秦州、凉州、瓜州,偷渡玉门关,穿越莫贺延碛沙漠,九死一生抵高昌。", "src": "《大唐大慈恩寺三藏法师传》"}, {"y": 631, "lat": 25.1, "lng": 85.4, "z": 5, "label": "玄奘·抵达那烂陀寺", "info": "玄奘越兴都库什山进入印度,在那烂陀寺师从戒贤法师,学习瑜伽师地论等。戒贤为无著世亲瑜伽行派传人。", "src": "《大慈恩寺三藏法师传》"}, {"y": 643, "lat": 24.7, "lng": 84.9, "z": 5, "label": "玄奘·曲女城无遮大会", "info": "戒日王为玄奘在曲女城举行无遮大会,18国王齐聚。玄奘立真唯识量,18日无人能破,获大乘天和解脱天尊号。", "src": "《大慈恩寺三藏法师传》"}, {"y": 645, "lat": 34.3, "lng": 108.9, "z": 5, "label": "玄奘归国·唯识宗兴起", "info": "玄奘携657部梵本归国,创唯识宗。华严性宗与唯识相宗形成教内深度对话。"}, {"y": 671, "lat": 23.1, "lng": 113.3, "z": 5, "label": "义净·广州乘船赴印", "info": "义净(635-713)37岁从广州搭乘波斯商船出发,经南海诸国至印度。选择海路避开了西域战乱,开辟求法新路线。", "src": "《南海寄归内法传》"}, {"y": 675, "lat": 25.1, "lng": 85.4, "z": 5, "label": "义净·那烂陀寺留学", "info": "义净抵达那烂陀寺,留学十载。学习瑜伽、中观、因明,并抄写戒律典籍。期间还到访王舍城灵鹫山等圣迹。", "src": "《南海寄归内法传》"}, {"y": 695, "lat": 34.3, "lng": 108.9, "z": 5, "label": "义净归国·洛阳", "info": "义净携梵本400余部归国,武则天亲迎于洛阳。后主持译场译经56部230卷,偏重律藏。与法显、玄奘并称中国三大求法僧。", "src": "《宋高僧传》卷一"}, {"y": 652, "lat": 37.1, "lng": 79.9, "z": 4, "label": "实叉难陀·于阗", "info": "生于于阗。于阗为中亚佛教枢纽:既是实叉难陀故乡,又是藏译华严底本来源。"}, {"y": 699, "lat": 34.7, "lng": 112.4, "z": 6, "label": "八十华严·洛阳佛授记寺", "info": "实叉难陀译八十华严39品。法藏证义。后世流传最广汉译本。"}, {"y": 712, "lat": 34.3, "lng": 108.9, "z": 6, "label": "法藏圆寂·长安", "info": "华严三祖圆寂。讲华严经三十余遍,著五教章/探玄记。实际创立者功业圆满。"}, {"y": 713, "lat": 24.8, "lng": 113.6, "z": 5, "label": "慧能入灭·南宗禅兴起", "info": "六祖慧能入灭。南宗禅此后大盛。华严五祖宗密兼为禅宗荷泽传人,开启禅教融合。"}, {"y": 780, "lat": 34, "lng": 108.7, "z": 6, "label": "宗密·圭峰·禅教融合", "info": "华严五祖宗密住圭峰。著禅源诸诠集都序,融合华严与禅宗。教禅一致思想基础确立。"}, {"y": 798, "lat": 34.3, "lng": 108.9, "z": 6, "label": "四十华严·长安", "info": "般若三藏译四十华严(入法界品全本)。善财五十三参完整故事得以汉译。"}, {"y": 716, "lat": 34.3, "lng": 108.9, "z": 6, "label": "善无畏·金刚智·开元三大士", "info": "善无畏(637-735)716年至长安译大日经传胎藏界。金刚智(671-741)719年至长安译金刚顶经传金刚界。与不空并称开元三大士,中国密宗奠基。", "src": "《宋高僧传》"}, {"y": 725, "lat": 34.3, "lng": 108.9, "z": 6, "label": "一行·大日经疏·大衍历", "info": "一行(683-727)师事善无畏,协助译大日经并著疏二十卷。制大衍历为唐代最精确历法。兼通天文学与密宗义学。", "src": "《宋高僧传》卷五"}, {"y": 800, "lat": 29.7, "lng": 91.1, "z": 4, "label": "藏译华严·吐蕃", "info": "胜友/智军将于阗本华严译为藏文Toh44(45品)。华严经中亚于阗传入西藏。"}, {"y": 805, "lat": 34.3, "lng": 108.9, "z": 6, "label": "慧果·青龙寺·密宗集大成", "info": "慧果(746-805)兼承善无畏胎藏界与金刚智金刚界两部密法。住长安青龙寺,为密宗第七祖。日本空海从此受法。", "src": "空海《御请来目录》"}, {"y": 806, "lat": 34.2, "lng": 135.6, "z": 6, "label": "空海归国·日本真言宗创立", "info": "空海(774-835)804年入唐从慧果受法,806年归国于高野山开创日本真言宗。著十住心论以华严判教框架判摄显密诸宗。", "src": "日本佛教史"}, {"y": 839, "lat": 39, "lng": 113.6, "z": 6, "label": "澄观圆寂·五台山", "info": "华严四祖圆寂。著华严经疏60卷/演义钞90卷。集大成者,历七帝之师。"}, {"y": 610, "lat": 21.4, "lng": 39.8, "z": 4, "rel": "islamic", "label": "☪穆罕默德·伊斯兰教创立", "info": "穆罕默德在麦加开始传播伊斯兰教。世界三大宗教格局(佛教/基督教/伊斯兰教)至此确立。", "bg": true, "src": "《古兰经》/伊斯兰教史"}, {"y": 841, "lat": 34, "lng": 108.7, "z": 5, "label": "宗密圆寂·华严盛极而衰", "info": "五祖宗密圆寂。次年武宗灭佛,华严典籍大量焚毁,此后转入隐传阶段。"}, {"y": 845, "lat": 34.3, "lng": 108.9, "z": 5, "label": "会昌法难·华严典籍焚毁", "info": "唐武宗灭佛。华严传承几近断绝。此后义学隐传,直至宋代复兴。"}, {"y": 800, "lat": 30.0, "lng": 112.0, "z": 5, "rel": "daoist", "label": "☯吕洞宾·道教内丹", "info": "吕洞宾(约798-?),唐末五代道教宗师。后被尊为八仙之一。其内丹学说吸收佛教禅宗心性论,体现佛道深度融合。", "bg": true, "src": "道教神仙传"}, {"y": 868, "lat": 40.0, "lng": 94.8, "z": 5, "label": "金刚经雕版·敦煌", "info": "敦煌出土咸通九年(868年)雕版印刷金刚经,世界现存最早有纪年的印刷品。佛教经典的传播方式从此革命性变化。", "src": "大英图书馆藏敦煌文献"}, {"y": 907, "lat": 34.3, "lng": 108.9, "z": 5, "label": "唐亡·五代十国", "info": "唐朝灭亡,进入五代十国分裂时期。北方战乱频繁,佛教学术重心南移。吴越钱氏、南唐李氏保护佛教。", "src": "中国通史"}, {"y": 973, "lat": 37.6, "lng": 127, "z": 5, "label": "均如·统一高丽华严", "info": "高丽学僧均如统一华严南北二宗。著三宝章圆通钞。早于义天,为高丽华严前驱。"}, {"y": 1011, "lat": 30.2, "lng": 120.1, "z": 6, "label": "净源中兴·杭州慧因寺", "info": "宋代华严复兴。慧因寺世称华严第一道场。后义天入宋求法于此。"}, {"y": 1038, "lat": 30.2, "lng": 120.1, "z": 6, "label": "子璿·兼弘贤首天台", "info": "长水子璿著起信论疏笔削记。兼弘贤首与天台,体现宋代宗派融合趋势。"}, {"y": 1050, "lat": 34.0, "lng": 113.0, "z": 5, "rel": "confucian", "label": "📖宋明理学兴起", "info": "周敦颐(1017-1073)创太极图说,张载(1020-1077)立气论,二程(1032-1085)发明天理。理学吸收佛教心性论与华严理事无碍思维,开儒学新纪元。", "src": "《宋史·道学传》"}, {"y": 1085, "lat": 30.2, "lng": 120.1, "z": 6, "label": "义天入宋·杭州慧因寺", "info": "高丽王子义天从净源受华严。归国编义天录。华严经杭州传入朝鲜半岛。"}, {"y": 1101, "lat": 37.6, "lng": 127, "z": 5, "label": "义天圆寂·高丽开京", "info": "义天圆寂。此后高丽学僧继续弘扬,朝鲜半岛成东亚华严重镇。"}, {"y": 1173, "lat": 35, "lng": 135.8, "z": 5, "label": "明惠中兴·日本高山寺", "info": "明惠复兴日本华严。高山寺开山,兼弘戒律真言。东亚华严网络最终一环形成。"}, {"y": 1271, "lat": 39.9, "lng": 116.4, "z": 5, "label": "元朝·八思巴帝师", "info": "元朝建立,藏传佛教入汉。八思巴为国师。海云继梦认为此后禅宗正法心法失传七~八百年。"}, {"y": 1200, "lat": 28.0, "lng": 118.0, "z": 5, "rel": "confucian", "label": "📖朱熹·理学集大成", "info": "朱熹(1130-1200)集北宋理学大成,确立程朱理学体系。其格物穷理与华严事事无碍有可比较的认识论结构。朱子学后传入朝鲜日本,影响东亚思想史。", "src": "《宋元学案》"}, {"y": 1368, "lat": 32.0, "lng": 118.8, "z": 5, "label": "明朝建立·洪武", "info": "朱元璋建都南京,早年曾出家为僧。明初设立僧官制度,整顿佛教,天下寺院分禅讲教三类管理。", "src": "《明史》"}, {"y": 1409, "lat": 29.6, "lng": 91.1, "z": 5, "label": "宗喀巴·格鲁派创立", "info": "宗喀巴大师在拉萨创大昭寺传召法会,格鲁派(黄教)正式确立。藏传佛教进入新的发展阶段。", "src": "藏传佛教史"}, {"y": 1508, "lat": 26.5, "lng": 106.7, "z": 5, "rel": "confucian", "label": "📖王阳明·龙场悟道", "info": "王守仁(1472-1529)在贵州龙场悟道,提出知行合一。阳明心学与禅宗明心见性有深度亲缘性,其「致良知」近于佛教本觉思想。后传入日本,影响明治维新。", "src": "《明儒学案》"}, {"y": 1517, "lat": 51.0, "lng": 11.0, "z": 4, "rel": "western", "label": "✝马丁·路德·宗教改革", "info": "马丁·路德在维滕堡贴出九十五条论纲,欧洲宗教改革开始。此后基督教世界分裂,西方进入宗教多元化时代。", "bg": true, "src": "世界史"}, {"y": 1687, "lat": 52.0, "lng": -0.1, "z": 4, "rel": "western", "label": "🔬牛顿·自然哲学原理", "info": "牛顿发表《自然哲学的数学原理》,科学革命达到高峰。此后科学与宗教的关系成为西方思想核心议题,与佛教对宇宙的解释形成遥远对照。", "bg": true, "src": "科学史"}, {"y": 1578, "lat": 38.0, "lng": 110.0, "z": 5, "label": "俺答汗·达赖喇嘛封号", "info": "蒙古俺答汗迎请三世达赖索南嘉措,赠予达赖喇嘛称号。藏传佛教与蒙古政治力量结合。", "src": "蒙藏佛教史"}, {"y": 1600, "lat": 30.2, "lng": 120.1, "z": 5, "label": "明末四大师·佛教复兴", "info": "紫柏/憨山/莲池/澫益四大师推动晚明佛教全面复兴。华严学亦受此波影响。"}, {"y": 1644, "lat": 39.9, "lng": 116.4, "z": 5, "label": "清军入关·明亡", "info": "清朝建立。顺治帝笃信佛教,礼敬禅僧。清初佛教在战乱后逐步恢复。", "src": "《清史稿》"}, {"y": 1641, "lat": 30.2, "lng": 120.1, "z": 6, "label": "续法·清代华严集大成", "info": "著贤首五教仪整理判教,编华严宗佛祖传梳理谱系。讲经二十余遍。"}, {"y": 1720, "lat": 30.0, "lng": 91.0, "z": 5, "label": "康熙平定西藏", "info": "清军入藏,确立对西藏的管辖。藏传佛教格鲁派与清廷关系制度化。", "src": "《清圣祖实录》"}, {"y": 1793, "lat": 29.6, "lng": 91.1, "z": 5, "label": "乾隆·钦定藏内善后章程", "info": "确立金瓶掣签制度。藏传佛教活佛转世纳入国家管理。", "src": "《卫藏通志》"}, {"y": 1860, "lat": 32.0, "lng": 118.8, "z": 5, "label": "太平天国·佛教重创", "info": "太平军占据江南,大量寺院被毁,经书遭焚。江南佛教遭受空前打击。", "src": "中国近代佛教史"}, {"y": 1898, "lat": 39.9, "lng": 116.4, "z": 5, "label": "戊戌变法·庙产兴学", "info": "张之洞提出庙产兴学主张,将寺院财产充作教育经费。此政策持续影响近代佛教至民国。", "src": "《劝学篇》"}, {"y": 1880, "lat": 34.0, "lng": 109.0, "z": 5, "rel": "daoist", "label": "☯陈撄宁·现代道教复兴", "info": "陈撄宁(1880-1969),近代道教重要学者。创办《仙学》月刊,提倡仙学独立于儒释,推动道教的现代化转型。", "bg": true, "src": "中国道教史"}, {"y": 1912, "lat": 34.5, "lng": 110.0, "z": 5, "rel": "daoist", "label": "☯张志顺·全真高道", "info": "张志顺(1912-2015),全真龙门派第二十一代传人。以百岁高龄仍坚持修行传道,被认为是近代道家实修的典范人物。", "bg": true, "src": "道教人物志"}, {"y": 1914, "lat": 31.7, "lng": 120.7, "z": 7, "label": "华严大学·常熟兴福寺", "info": "月霞创立近代第一所华严专宗教育机构。培养常惺/持松等现代学僧。"}, {"y": 1936, "lat": 34.3, "lng": 108.9, "z": 5, "rel": "daoist", "label": "☯任法融·中国道协会长", "info": "任法融(1936-2021),原中国道教协会会长。著《道德经释义》等,以现代语言诠释道家经典。推动道教与当代社会对话。", "bg": true, "src": "中国道教协会"}, {"y": 1952, "lat": 25, "lng": 121.6, "z": 7, "label": "华严莲社·台北", "info": "智光/南亭创社,开启台湾华严弘传。成一/贤度相继,发展为现代学术教育中心。"}, {"y": 1975, "lat": 25, "lng": 121.5, "z": 7, "label": "华严专宗学院·台北", "info": "成一法师创办,以专修/专研/专弘华严为宗旨。当代最重要华严教育机构。"}, {"y": 1991, "lat": 25, "lng": 121.5, "z": 7, "label": "梦参剃度·临济47代", "info": "海云继梦(陈鹤山)于梦参老和尚座下剃度,法名昌一号继梦。此前十年以在家身弘法,奠定现代语言诠释华严的教学风格。"}, {"y": 2004, "lat": 34.2, "lng": 108.9, "z": 6, "label": "西安弘法·社科院演讲", "info": "受聘陕师大华严研究所荣誉所长。社科院演讲(首位登台出家人)。2006-2010北京广化寺系统弘讲四十华严全本。"}, {"y": 2008, "lat": 23.9, "lng": 120.9, "z": 9, "label": "三脉汇流·普贤乘确立", "info": "★核心★钦因传华严衣钵(贤首42世)+胜师子王菩萨传瑜伽行。三脉归一开创普贤乘华严宗。技术面(数随止)+工程面(ABC心法)双轨。四阶段:出离→菩提→菩萨→普贤乘。"}, {"y": 2011, "lat": 25, "lng": 121.5, "z": 7, "label": "华严六科·五大行法定型", "info": "六科(概论/经教/禅法/戒律/净土/密法)+五大行法(禅净律密经教)完整出版。三部曲(非常坛经/金刚经/心经)确立修行框架。"}, {"y": 2013, "lat": 25, "lng": 121.5, "z": 7, "label": "海云华严研究所成立", "info": "熊琬教授任所长。华严学报创刊(已出14期)。忍可灌顶制度+禅观一览表公开发  135.6, "z": 6, "label": "空海归国·日本真言宗", "info": "空海804年入唐从慧果受法·806年归国于高野山开创日本真言宗", "region": "mi", "source": "空海《御请来目录》/ 日本佛教史"}, {"y": 67, "lat": 34.7, "lng": 112.4, "z": 5, "label": "白马寺·佛教正式入华", "info": "汉明帝梦金人·遣使西域·迦叶摩腾与竺法兰以白马驮经至洛阳·中国第一座佛寺", "region": "general", "source": "《高僧传》卷一"}, {"y": 148, "lat": 34.7, "lng": 112.4, "z": 5, "label": "安世高·洛阳译经", "info": "安息王子安世高至洛阳·首次系统汉译小乘禅经·汉传译经之始", "region": "general", "source": "《高僧传》卷一"}, {"y": 167, "lat": 34.7, "lng": 112.4, "z": 5, "label": "支娄迦谶·大乘经首译", "info": "月氏僧支谶至洛阳·译《道行般若》《兜沙经》(华严首译)·大乘佛教入华", "region": "general", "source": "《高僧传》卷一"}, {"y": 401, "lat": 34.3, "lng": 108.9, "z": 5, "label": "鸠摩罗什至长安·译经巅峰", "info": "罗什主持中国史上最大译场·八百沙门·译中论/法华/十住经·深刻影响华严天台禅宗", "region": "general", "source": "《出三藏记集》卷十四"}, {"y": 960, "lat": 34.3, "lng": 108.9, "z": 5, "label": "宋代·佛教中国化完成", "info": "宋太祖敕刻《开宝藏》·各宗判教学说成熟·禅净合流·居士佛教兴起", "region": "general", "source": "汤用彤《隋唐佛教史稿》"}, {"y": 1600, "lat": 30.0, "lng": 120.0, "z": 5, "label": "明末四大师·佛教复兴", "info": "紫柏·憨山·莲池·澫益四大师推动晚明佛教全面复兴·禅教律净密融合", "region": "general", "source": "吕澂《中国佛学源流略讲》"}, {"y": 1866, "lat": 34.0, "lng": 109.0, "z": 5, "label": "杨文会·金陵刻经处", "info": "杨文会(杨仁山)创金陵刻经处·近代佛教复兴运动先驱·培养太虚等人才", "region": "general", "source": "中国近代佛教史"}, {"y": 1922, "lat": 32.0, "lng": 118.8, "z": 5, "label": "太虚·人生佛教·武昌佛学院", "info": "太虚创办武昌佛学院·提倡\"人生佛教\"·教理教制教产三大革命·现代佛教教育先驱", "region": "general", "source": "中国近代佛教史"}]}, "huayan_annotations": {"persons": {"person_000a": {"note": "华严宗奉为远祖。据传入龙宫取回《华严经》下本十万偈。造《十住毗婆沙论》注释《十地品》，为华严义学最早论释之一。其「中道空性」思想经华严宗发展为「真空绝相观」。", "level": "direct"}, "person_000b": {"note": "造《十地经论》，首创「六相」名相（总别同异成坏），后被华严宗吸收为「六相圆融」义。其唯识学说经地论师传承，构成华严宗义学前身。", "level": "direct"}, "person_001": {"note": "华严初祖。著《法界观门》开创华严观法体系，「真空观·理事无碍观·周遍含容观」三观为华严宗修行核心框架。传说其以神通示现「帝网无尽观」。", "level": "direct"}, "person_002": {"note": "华严二祖。著《搜玄记》开华严经疏之先河。创「十玄门」义理，系统化华严宗的「一即一切」圆融思想，为法藏集大成奠定基础。", "level": "direct"}, "person_003": {"note": "华严三祖·实际创立者。系统化「五教十宗」判教与「法界缘起」义理。著《华严五教章》《探玄记》《金师子章》。以殿前金师子为武则天说华严，为佛教中国化之典范。", "level": "direct"}, "person_004": {"note": "华严四祖·集大成者。著《华严经疏》六十卷、《演义钞》九十卷。历七帝之师，德宗赐号「清凉」。融会禅教诸宗入华严体系。", "level": "direct"}, "person_005": {"note": "华严五祖·禅教融合者。著《禅源诸诠集都序》融会禅宗与华严。其《原人论》以华严圆教判摄儒道释三家，为跨传统对话的先驱。", "level": "direct"}, "person_006": {"note": "六十华严译者。首次将华严经完整译为汉文（七处八会三十四品），为华严思想传入汉地之始。与鸠摩罗什在禅法上有分歧而南下。", "level": "direct"}, "person_007": {"note": "八十华严译者。于阗人。其译本（七处九会三十九品）为后世华严宗的根本经典依据。法藏曾参与其译场证义，译经与创宗同步进行。", "level": "direct"}, "person_009": {"note": "唐代华严居士学者。以《易经》融会华严，方法独特。著《新华严经论》四十卷，其「东方智慧」路线与法藏「西方梵文」路线形成华严中国化的双轨。", "level": "direct"}, "person_010": {"note": "高丽王子。入宋从净源受华严，归国编《义天录》为华严文献学奠基。华严宗经其传入朝鲜半岛，形成海东华严传统。", "level": "direct"}, "person_011": {"note": "宋代华严中兴之祖。住杭州慧因寺，传法义天。义天归国后送金书华严经供养，慧因寺世称「华严第一道场」。", "level": "direct"}, "person_042": {"note": "当代华严传承者。2008年三脉汇一（临济+华严+大乘瑜伽）。提出「普贤乘华严宗」新定位，复兴失传八百年的「东山法门」。将华严修行重构为可操作的「工程面/技术面」双轨体系。", "level": "direct"}, "person_101": {"note": "古印度大乘论师。传统著录为《大乘起信论》作者。该论「一心二门三大四信五门」之说为华严宗判教与心性论提供了核心理论资源。法藏著《大乘起信论义记》为最权威注释之一。", "level": "direct"}, "person_102": {"note": "瑜伽行派创始人。其唯识学说经世亲《十地经论》传入汉地，深刻影响地论学派。华严宗「法界缘起」思想与瑜伽行派「唯识无境」有深层义学对话——华严以「性起」对瑜伽之「缘起」。", "level": "indirect"}, "person_103": {"note": "四大译师之首。译《十住经》（十地品别译）、《十住毗婆沙论》为华严学在汉地的传播提供了关键文本基础。其「中观空性」精义经华严宗发展为「真空妙有」之中道观。", "level": "indirect"}, "person_104": {"note": "译《十地经论》十二卷，直接催生了南北朝地论学派。地论师南道派（慧光系）经数代传承至智俨、法藏，构成华严宗义学之远源。", "level": "indirect"}, "person_105": {"note": "华严经中「佛佛相续无尽法界缘起」之始。据《如来名号品》，十方三世无尽诸佛构成华严宗「法界缘起」之佛佛相望网络。", "level": "direct"}, "person_107": {"note": "华严经根本教主。法身遍一切处。华严宗「法界缘起」「一即一切」等核心教义皆围绕毗卢遮那佛法身展开——非历史人物，为华严教义之法身源头。", "level": "direct"}, "person_100": {"note": "华严宗传统认为《华严经》为释迦成道后最初三七日于菩提树下为法身大士所说。此说虽非历史批判学的结论，但构成了华严宗「华严为顿教圆教」之判教基础。", "level": "direct"}, "person_060": {"note": "新罗学僧。与义湘同代。其《起信论疏》与法藏《起信论义记》并称东亚起信论三大疏。海东华严传统的重要先驱。", "level": "indirect"}, "person_061": {"note": "海东华严初祖。入唐从智俨学华严，与法藏同学。归国创浮石寺。其《华严一乘法界图》以诗偈图式浓缩华严法界观——为华严义学的东亚传播之关键人物。", "level": "direct"}, "person_070": {"note": "法藏上首弟子。改五教为四教、以十门代十玄，被澄观系统批判。慧苑的「异解」是推动澄观重新集大成的关键动力——在思想史上「错误」往往比「正确」更能激发体系完善。", "level": "direct"}, "person_080": {"note": "清代华严集大成者。著《贤首五教仪》系统整理法藏判教，编《华严宗佛祖传》梳理传承谱系。为华严宗在清代的中兴之祖。", "level": "direct"}, "person_090": {"note": "北魏地论师南道派始祖。从勒那摩提学《十地经论》，世称「光统律师」。其学说经数代传承至智俨、法藏，是为华严宗义学之远源。", "level": "indirect"}, "person_110": {"note": "西行求法先驱。399年以65岁高龄从长安出发至印度，历时14年。其《佛国记》记录的印度佛教圣迹为后世理解华严经中的地理描述提供了实地参照。", "level": "indirect"}, "person_111": {"note": "大翻译家·法相宗创始人。其译《大般若经》六百卷与华严经同属大乘圆教体系。华严宗与法相宗在判教上有深层对话——华严以「性起」对法相之「缘起阿赖耶」。", "level": "dialogue"}, "person_112": {"note": "海上求法僧。其翻译偏重律藏。《南海寄归内法传》记录7世纪印度佛教实践，与华严经中的修行体系有互补参考价值。", "level": "indirect"}, "person_140": {"note": "19世纪印度神秘主义者。主张「各宗教皆为通向同一真理的路径」。与华严宗「事事无碍法界」在宗教多元主义的哲学基础上形成跨文化对话——华严以「一即一切」破宗派之执。", "level": "dialogue"}, "person_142": {"note": "印度整体瑜伽创立者。其「超心智演化」哲学——物质向精神的进化——与华严「法界缘起」中一切法相即相入的动态世界观有深层对话空间：二者皆否定终极的二元分离。", "level": "dialogue"}, "person_143": {"note": "印度不二论大师。其「Who am I?」参问法门直证自性。与华严宗「能所双泯」「真如实观」在修行论上有可比拟处——皆以消解自我虚妄为入道之门。", "level": "parallel"}, "person_150": {"note": "那烂陀寺中观大师。著《入菩萨行论》。其「自他交换」菩提心修法与华严《普贤行愿品》「代众生苦」的菩萨行思想互相参照——不同传统在利他精神上的殊途同归。", "level": "parallel"}, "person_152": {"note": "藏传格鲁派创始人。其《菩提道次第广论》以三士道次第接引凡夫。与华严宗五教判教（小始终顿圆）在修行阶段论上有结构性的对比研究价值——皆以渐次引归圆顿。", "level": "dialogue"}, "person_134": {"note": "印度国师·大乘瑜伽行法传承者。2008年于阿弥塔巴市传大乘瑜伽行法灌顶予海云继梦。此传法事件标志着印度古典瑜伽行法与汉传华严宗在当代的汇流——「三脉汇一」之瑜伽行支。", "level": "direct"}, "person_daoan": {"note": "中国佛教奠基人。首创僧团统一「释」姓、编定经录、确立戒律。其弥勒净土信仰与华严毗卢遮那净土在「法身佛」信仰上有结构呼应。道安的经典整理工作为后来华严经的翻译与研究奠定了制度基础。", "level": "indirect"}, "person_huiyuan": {"note": "净土宗初祖。庐山白莲社念佛结社开中国净土宗先河。其《沙门不敬王者论》的宗教独立立场与华严宗「事事无碍」的入世圆融构成中国佛教「出世」与「即世」的经典张力。庐山与终南山(华严发源地)隔江相望——净土与华严的地理对话。", "level": "dialogue"}, "person_sengzhao": {"note": "鸠摩罗什高足·解空第一。著《肇论》以中观空性融会老庄语言——「般若无知论」「物不迁论」。其「真空」思想经华严宗发展为「真空绝相观」(杜顺法界三观之第一观)，为中观空性向华严法界观的义理过渡之关键。", "level": "indirect"}, "person_daoxuan": {"note": "南山律宗创始人。著《续高僧传》为研究华严祖师(杜顺、智俨、法藏)最重要的原始文献。《四分律删繁补阙行事钞》的戒律体系与华严菩萨戒(梵网经)在「以戒摄教」上有互补。终南山净业寺与至相寺(华严祖庭)同在终南山——律宗与华严宗的地理共生。", "level": "indirect"}, "person_hongren": {"note": "禅宗五祖。创「东山法门」以《楞伽经》印心。海云继梦复兴「东山法门」之名，将华严禅观溯源至道信-弘忍-慧能一系——以此建立「华严禅」与「东山法门」的谱系连续性，为华严宗在当代的「禅观化」提供历史合法性。", "level": "indirect"}, "person_linji": {"note": "临济宗创始人。「无位真人」「随处作主」的峻烈禅风与华严「事事无碍」在日常行为中的自由落实形成深度对话——临济的「立处即真」与华严的「当相即道」在超越二元对立的实践哲学上殊途同归。", "level": "dialogue"}, "person_yongming": {"note": "禅净双修倡导者。著《宗镜录》百卷以「一心」统摄诸宗，与华严「一心法界」的圆融旨趣深层相通。其「四料简」(有禅有净土/无禅无净土)确立净土在末法时代的修行地位——华严宗后世亦吸收此融合理路。", "level": "parallel"}, "person_hanshan": {"note": "明末四大高僧。刺血书《华严经》于五台山。其《楞严经通议》大量引用澄观《华严经疏》。憨山中兴曹溪南华寺(六祖道场)，体现明末「禅教融合」中华严义学对禅宗的渗透。", "level": "indirect"}, "person_gehong": {"note": "丹鼎派集大成者。著《抱朴子》内外篇，内篇言丹道、外篇言儒术。「玄者自然之始祖」的宇宙论与华严「法界缘起」在「终极实在」的描述上有跨传统对话——葛洪以「玄」为万物本根，华严以「法界」为万法之源。", "level": "dialogue"}, "person_chengtuan": {"note": "希夷先生·睡仙。著《无极图》授周敦颐，间接催生了理学宇宙论。周敦颐《太极图说》的「无极而太极」与华严「法界缘起」的「真空生妙有」在宇宙生成模式上有结构相似性——道教内丹、儒家理学、华严佛学在北宋形成思想三角。", "level": "dialogue"}, "person_qiuchuji": {"note": "全真龙门派创始人。万里西行见成吉思汗「一言止杀」——宗教智慧介入世俗权力的经典案例。与华严祖师法藏为武则天说法(金师子章)、澄观为七帝之师相呼应：皆在最高权力面前以智慧转化暴力。", "level": "parallel"}, "person_guangyu": {"note": "清学开山·亭林先生。著《日知录》以考证方法重建经学。「天下兴亡匹夫有责」的担当精神与华严「即世间而证法界」的入世取向在实践哲学上有对话空间——顾炎武以「经世致用」回应时代危机，华严以「事事无碍」圆融世间与出世。", "level": "dialogue"}, "person_anshigao": {"note": "汉译佛经第一人。译《安般守意经》为中国禅学之始。其「安般守意」数息法与华严禅观「数随止」三法中的「数法」在技术上有直接的渊源关系——中国佛教禅观从安世高到杜顺的千年传承脉络。", "level": "indirect"}, "person_shenxiu": {"note": "北宗禅创始人。武后迎为国师。「身是菩提树，心如明镜台」的渐修路线与华严宗「五教止观」的渐进体系在方法论上有可比拟处——皆以渐修次第为入道之门。神秀的「观心」与华严「驻佇心观」在技术面上亦有对应。", "level": "parallel"}, "person_zhuhong": {"note": "明末四大高僧·净土宗八祖。著《竹窗随笔》倡禅净融合。其云栖道场的念佛结社模式与华严宗的「普贤行愿」在日常实践中的落实形成对比——净土以「念佛」为行门，华严以「普贤行」为行门。", "level": "parallel"}, "person_ouyi": {"note": "明末四大高僧。著《阅藏知津》为佛教目录学经典，《周易禅解》以禅解易——与李通玄以易解华严形成有趣的「方向相反」：李通玄以易入佛，蕅益以佛解易。二者皆体现中国佛教与儒家经典的双向诠释传统。", "level": "dialogue"}, "person_zhangsanfeng": {"note": "太极拳祖师。创内家拳以「松柔克刚」「以静制动」为要。太极拳的「松」与华严禅观的「舍识用根」在身心转化的技术面上有可比拟处——皆以放松身心为入门。武当山与禅宗少林并称——道教内丹与佛教禅观在身体技术上的并行发展。", "level": "dialogue"}, "person_ludongbin": {"note": "八仙之首·纯阳真人。「黄粱一梦」典故出自其与钟离权的相遇——以梦境破执著。与华严「事事无碍」中破「法执」的修行逻辑有可比拟处：皆以超越对现象世界的执著为入道之门。", "level": "parallel"}, "person_huangzongxi": {"note": "梨洲先生·启蒙思想家。著《明夷待访录》批判君主专制，《明儒学案》为中国第一部学术史。其「天下为主君为客」的民主思想与华严「一即一切」的平等观在政治哲学上有跨传统对话——华严以「法界平等」破一切等级之执。", "level": "dialogue"}, "person_wangfuzhi": {"note": "船山先生·唯物主义先驱。「六经责我开生面」的学术担当与华严「事事无碍」在方法论上有可比拟处——皆以动态的、整体的视角把握实在。王夫之「气一元论」与华严「法界缘起」在万物一体观上有结构对应。", "level": "dialogue"}, "person_simaqian": {"note": "太史公·《史记》作者。其「究天人之际通古今之变」的历史哲学与华严「法界缘起」的时间观——过去现在未来三世贯通——在历史意识上有跨传统对话：司马迁以史为鉴，华严以「一念摄无尽劫」超越线性时间。", "level": "dialogue"}, "person_j06": {"note": "日本华严中兴之祖·高山寺开山。著《摧邪轮》批判净土宗法然，复兴东大寺华严教学。明惠的「华严复兴」与宋代净源的「华严中兴」在东亚华严史上形成隔海呼应——十二三世纪华严宗在日本和中国的同步再生。", "level": "direct"}, "person_124": {"note": "日本真言宗开祖·弘法大师。入唐从慧果受密法，归国后于高野山创真言宗。著《十住心论》以华严判教框架判摄显密诸宗——将华严宗「五教十宗」与密宗「十住心」结合，为东亚佛教判教思想的创造性融合。", "level": "direct"}}, "events": [{"year": -563, "note": "释迦诞生。华严宗传统将华严经的教说定位在佛陀成道后的「最初三七日」，以此确立华严为「顿教」——佛陀最初直说的圆满大法。"}, {"year": -528, "note": "释迦成道。华严宗的「法界缘起」义理即从此觉悟的核心体验出发——佛陀在一念中顿见法界实相。"}, {"year": 167, "note": "支娄迦谶译《兜沙经》。这是《华严经》最早被翻译为汉文的单行经（对应《如来名号品》），标志着华严思想的汉传起点。"}, {"year": 344, "note": "鸠摩罗什诞生。其《十住经》译本为华严宗核心品目《十地品》在汉地的首次系统引入。"}, {"year": 401, "note": "鸠摩罗什抵长安。逍遥园译场开启中国历史上规模最大的佛经翻译工程，为华严学在中国的传播奠定了术语和义理基础。"}, {"year": 420, "note": "佛驮跋陀罗译出《六十华严》，华严经首次以完整形态进入汉文世界。"}, {"year": 508, "note": "菩提流支译《十地经论》，南北朝地论学派兴起——这是华严宗义学最重要的远源。"}, {"year": 557, "note": "杜顺诞生。一位开创性的禅僧，将华严经的义理转化为可操作的观法体系——华严宗由此从「经典注释」走向「修行宗派」。"}, {"year": 643, "note": "法藏诞生。华严宗将在他的手中完成从学派到宗派的飞跃——「贤首国师」的判教体系至今仍为华严教义的权威框架。"}, {"year": 699, "note": "实叉难陀译出《八十华严》（七处九会），华严宗的根本经典定型。法藏参与译场证义——译经与创宗同步进行。"}, {"year": 780, "note": "宗密诞生。其「禅教融合」的思想路线将深远影响后世华严宗的走向——华严从此不再是纯粹义学，而有了禅观的实践维度。"}, {"year": 1055, "note": "义天诞生。这位高丽王子将把华严宗带向朝鲜半岛——华严宗从此成为东亚佛教的共同遗产。"}, {"year": 1085, "note": "义天入宋求法于杭州慧因寺，华严宗传入朝鲜半岛。此事件标志着华严思想从「中国宗派」向「东亚传统」的转型。"}, {"year": 1858, "note": "月霞诞生。清末民初的华严复兴将由此人开启——华严大学的创立为现代华严学术研究奠定了基础。"}, {"year": 1914, "note": "月霞于常熟兴福寺创立华严大学，中国近代第一所华严专宗教育机构——「宗学」传统向现代「学术」的转型。"}, {"year": 1952, "note": "华严莲社在台北创立——华严宗在台湾落地生根，开启了海外弘传的新篇章。"}, {"year": 2008, "note": "海云继梦三脉汇流：受钦因传华严衣钵（贤首42世）+ 受胜师子王菩萨传瑜伽行法——华严宗在当代的「三脉汇一」标志着古典传统的新一轮创造性整合。"}, {"year": 2026, "note": "「九九华严」讲座 + 支提山大华严寺动土——华严宗在AI时代的自我更新与空间落地。"}]}, "key_events": {"events": [{"y": -1500, "l": "吠陀文明兴起·梨俱吠陀结集", "c": "#b0a898", "tp": "远源"}, {"y": -800, "l": "奥义书时代·梵我哲学形成", "c": "#b0a898", "tp": "远源"}, {"y": -500, "l": "沙门思潮·六师外道·思想百花齐放", "c": "#b0a898", "tp": "远源"}, {"y": -483, "l": "释迦入灭·佛教创立", "c": "#9e8b6e", "p": "释迦牟尼", "tp": "宗教"}, {"y": 80, "l": "马鸣造大乘起信论", "c": "#9e8b6e", "p": "马鸣", "tp": "义学"}, {"y": 167, "l": "支谶译兜沙经(最早华严)", "c": "#a09080", "p": "支娄迦谶", "tp": "翻译"}, {"y": 401, "l": "鸠摩罗什至长安·译十住经", "c": "#a09080", "p": "鸠摩罗什", "tp": "翻译"}, {"y": 420, "l": "六十华严译出(建康)", "c": "#b8863c", "p": "佛驮跋陀罗", "tp": "翻译"}, {"y": 508, "l": "十地经论译出·地论学派兴起", "c": "#5e8b9e", "p": "菩提流支", "tp": "义学"}, {"y": 550, "l": "地论师南北分派·相州南道/北道", "c": "#5e8b9e", "tp": "义学"}, {"y": 557, "l": "杜顺创华严宗·法界观门", "c": "#b8863c", "p": "杜顺", "tp": "禅观"}, {"y": 699, "l": "八十华严译出·法藏证义", "c": "#b8863c", "p": "法藏", "tp": "翻译"}, {"y": 712, "l": "法藏圆寂·贤首教学确立", "c": "#b8863c", "p": "法藏", "tp": "义学"}, {"y": 798, "l": "四十华严译出(入法界品全)", "c": "#b8863c", "p": "般若", "tp": "翻译"}, {"y": 800, "l": "胜友/智军藏译华严(于阗本)", "c": "#c46b5d", "tp": "翻译"}, {"y": 645, "l": "玄奘归国·唯识宗兴起", "c": "#8b7a9e", "tp": "宗派"}, {"y": 713, "l": "慧能入灭·南宗禅兴起", "c": "#8b7a9e", "tp": "宗派"}, {"y": 738, "l": "澄观出生·历学八宗", "c": "#b8863c", "p": "澄观", "tp": "义学"}, {"y": 780, "l": "宗密融合禅教·禅源诸诠", "c": "#7d9a6e", "p": "宗密", "tp": "禅观"}, {"y": 841, "l": "宗密圆寂·华严宗盛极而衰", "c": "#b8863c", "p": "宗密", "tp": "义学"}, {"y": 845, "l": "唐武宗灭佛·华严典籍大量焚毁", "c": "#c46b5d", "tp": "法难"}, {"y": 960, "l": "宋统一·佛教义学复兴", "c": "#c8893e", "tp": "文化"}, {"y": 973, "l": "均如统一高丽华严南北宗", "c": "#6d9a6e", "p": "均如", "tp": "义学"}, {"y": 1011, "l": "净源中兴·慧因寺华严道场", "c": "#b8863c", "p": "净源", "tp": "义学"}, {"y": 1038, "l": "子璿兼弘贤首天台·起信论疏", "c": "#c8893e", "p": "子璿", "tp": "宗派"}, {"y": 1085, "l": "义天入宋求法·华严东传高丽", "c": "#6d9a6e", "p": "义天", "tp": "文化"}, {"y": 1271, "l": "元朝建立·藏传佛教入汉·八思巴帝师", "c": "#8b7a9e", .0, "ev": "成道后至鹿野苑为五比丘初转法轮,讲四圣谛八正道。佛教僧团成立。此后45年游化恒河流域,讲经三百余会。", "src": "《杂阿含经》"}, {"y": -483, "p": "释迦牟尼", "lat": 26.7, "lng": 83.9, "ev": "80岁时于拘尸那罗入灭。佛教由此向四方传播。华严宗法身思想将释迦入灭理解为「化身隐而法身常」,毗卢遮那佛永恒说法于华藏世界。", "src": "《大般涅槃经》"}, {"y": -260, "p": "阿育王", "lat": 25.3, "lng": 83.0, "ev": "阿育王皈依佛教,派传教师向四方传播佛法。第三次结集后佛教开始向中亚、东南亚扩散。", "src": "阿育王石刻诏书"}, {"y": 65, "p": "迦腻色迦王", "lat": 33.7, "lng": 72.8, "ev": "贵霜帝国迦腻色迦王于犍陀罗举行第四次结集。佛法由印度深入中亚,犍陀罗成为佛教东传的枢纽站。", "src": "佛教史·贵霜时期"}, {"y": 80, "p": "马鸣", "lat": 27.5, "lng": 77.7, "ev": "马鸣菩萨造《大乘起信论》。该论「一心二门」之说后成为华严宗心性论与判教体系的重要理论基础。", "src": "传统著录"}, {"y": 167, "p": "支娄迦谶", "lat": 34.7, "lng": 112.4, "ev": "月氏僧支谶来华至洛阳,译《佛说兜沙经》。此为华严经文最早汉译,仅1卷,对应《如来名号品》。", "src": "《高僧传》卷一"}, {"y": 320, "p": "无著·世亲", "lat": 25.1, "lng": 85.4, "ev": "无著、世亲兄弟于那烂陀弘传瑜伽行派。世亲造《十地经论》,后经菩提流支汉译催生地论学派。", "src": "《大唐西域记》卷九"}, {"y": 344, "p": "鸠摩罗什", "lat": 41.7, "lng": 82.9, "ev": "罗什生于龟兹。401年至长安,主持史上最大译场。译《十住经》(十地品别译)、《十住毗婆沙论》等,为华严学提供关键文本基础。", "src": "《高僧传》卷二"}, {"y": 359, "p": "佛驮跋陀罗", "lat": 34.0, "lng": 72.0, "ev": "觉贤生于北天竺迦毗罗卫。后至建康译出《六十华严》34品。此为《华严经》首次汉译全本。", "src": "《高僧传》卷二"}, {"y": 401, "p": "鸠摩罗什", "lat": 34.3, "lng": 108.9, "ev": "罗什至长安逍遥园。主持中国史上最大译场,八百沙门参与。译出《十住经》《中论》《法华经》等,深刻影响华严义学。", "src": "《出三藏记集》卷十四"}, {"y": 420, "p": "佛驮跋陀罗", "lat": 32.1, "lng": 118.8, "ev": "六十华严译出于建康道场寺。七处八会三十四品。法业等百余人参与笔受。华严经首次以全貌呈现于汉地。", "src": "《出三藏记集》卷九"}, {"y": 468, "p": "慧光", "lat": 34.7, "lng": 112.4, "ev": "慧光生于北魏。从勒那摩提学《十地经论》,开地论南道派。后被尊为四分律宗初祖。其学经数代传至智俨、法藏,是为华严宗义学之前身。", "src": "《续高僧传》卷二十一"}, {"y": 508, "p": "菩提流支", "lat": 34.7, "lng": 112.4, "ev": "北印度僧菩提流支至洛阳,与勒那摩提译世亲《十地经论》十二卷。此论催生了南北朝最重要的义学流派——地论学派。", "src": "《续高僧传》卷一"}, {"y": 557, "p": "杜顺", "lat": 33.9, "lng": 109.0, "ev": "杜顺于终南山开创华严宗。著《华严法界观门》《五教止观》。以「法界三观」和「五教止观」为华严宗奠定修行理论基础。", "src": "《续高僧传》卷二十五"}, {"y": 643, "p": "法藏", "lat": 34.3, "lng": 108.9, "ev": "法藏生于长安。从智俨学华严。后系统化「五教十宗」判教,著《华严五教章》等。武则天赐号「贤首」。参与八十华严译场证义。华严宗至此正式确立。", "src": "《宋高僧传》卷五"}, {"y": 652, "p": "实叉难陀", "lat": 37.1, "lng": 79.9, "ev": "实叉难陀生于于阗。后奉武则天诏来华译经。于阗在中亚佛教网络中地位关键——既是实叉难陀故乡,又是藏译华严底本来源。", "src": "《宋高僧传》卷二"}, {"y": 699, "p": "实叉难陀·法藏", "lat": 34.7, "lng": 112.4, "ev": "八十华严译出于洛阳佛授记寺。法藏参与证义。七处九会三十九品,为后世流传最广的汉译本。", "src": "《宋高僧传》卷二"}, {"y": 780, "p": "宗密", "lat": 34.0, "lng": 108.7, "ev": "宗密住终南山圭峰。融合禅宗(荷泽系)与华严,著《禅源诸诠集都序》。华严与禅宗的深度融合,奠定了「教禅一致」的思想基础。", "src": "《宋高僧传》卷六"}, {"y": 800, "p": "胜友·智军", "lat": 29.7, "lng": 91.1, "ev": "胜友、智军等于吐蕃将《华严经》由于阗本译为藏文(Toh44)。华严传入西藏,形成独立于汉译的藏传华严传承。", "src": "德格版甘珠尔目录"}, {"y": 1085, "p": "义天", "lat": 30.2, "lng": 120.1, "ev": "高丽王子义天入宋,于杭州慧因寺从净源受华严。华严经由杭州传入朝鲜半岛。义天归国后编《义天录》,为华严文献学奠基。", "src": "《高丽史》卷九十"}, {"y": 1173, "p": "明惠", "lat": 35.0, "lng": 135.8, "ev": "日本华严中兴之祖明惠于京都高山寺复兴华严。兼弘戒律与真言。日本华严经历镰仓时代再兴,形成东亚华严网络最终一环。", "src": "日本佛教史"}]}, "western_timeline": {"events": [{"y": -1500, "lat": 37.9, "lng": 23.7, "z": 5, "label": "迈锡尼文明", "info": "希腊青铜文明·特洛伊战争传说", "region": "europe", "source": "Will Durant《世界文明史》/ J.M.Roberts《全球史》"}, {"y": -800, "lat": 38.0, "lng": 23.7, "z": 6, "label": "古希腊城邦兴起", "info": "雅典·斯巴达·民主制度萌芽·荷马史诗", "region": "europe", "source": "Will Durant《世界文明史》/ J.M.Roberts《全球史》"}, {"y": -509, "lat": 41.9, "lng": 12.5, "z": 6, "label": "罗马共和国建立", "info": "推翻君主制·元老院共和", "region": "europe", "source": "Will Durant《世界文明史》/ J.M.Roberts《全球史》"}, {"y": -336, "lat": 40.6, "lng": 22.9, "z": 6, "label": "亚历山大帝国", "info": "马其顿征服希腊→波斯→印度·希腊化时代", "region": "europe", "source": "Will Durant《世界文明史》/ J.M.Roberts《全球史》"}, {"y": -27, "lat": 41.9, "lng": 12.5, "z": 6, "label": "罗马帝国建立", "info": "屋大维称奥古斯都·Pax Romana", "region": "europe", "source": "Will Durant《世界文明史》/ J.M.Roberts《全球史》"}, {"y": 313, "lat": 41.9, "lng": 12.5, "z": 6, "label": "米兰敕令·基督教合法化", "info": "君士坦丁大帝承认基督教", "region": "europe", "source": "Will Durant《世界文明史》/ J.M.Roberts《全球史》"}, {"y": 330, "lat": 41.0, "lng": 28.9, "z": 6, "label": "君士坦丁堡建都", "info": "罗马帝国迁都拜占庭·东罗马时代", "region": "europe", "source": "Will Durant《世界文明史》/ J.M.Roberts《全球史》"}, {"y": 476, "lat": 41.9, "lng": 12.5, "z": 5, "label": "西罗马帝国灭亡", "info": "日耳曼人入侵·欧洲进入中世纪",
