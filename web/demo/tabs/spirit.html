var PRACTICE_DATA = {"cultivation_system": {"subpage": "修行体系", "wip_notice": {"text": "本页面内容基于大华严寺官网(2025.11版)和海云继梦和上已公开的讲经视频/音频/逐字稿/出版物整理。\n法师讲法内容不断更新演化，当前整理仍不完整，需要大量结构化梳理和补充核实，仅供参考，持续更新中。\n最新修行体系请以大华严寺官网为准。\n", "updated": "2026-08-02"}, "header": {"title": "华严教行 — 普贤乘修行体系", "description": "参考大华严寺海云继梦和上所立 普贤乘华严宗 修行体系。以华严禅法为核心，透过心法工程止住安心、令真心起作用。体系涵盖从资粮道到正行、从初信到法身大士的完整修行次第。\n"}, "three_stages": [{"name": "禅修入门", "subtitle": "发心工程（资粮道）", "detail": "五科：戒·律·调身·调息·调心", "color": "gold", "description": "三门必修: 人格健康+出离心+菩提心。含五科（戒·律·调身·调息·调心）。技术面: 纯化禅(动→静)→象限转移→瞬间定。工程面: 心性培养+戒律基础。官网: 「发心——出三界、入法界之志,建立信根与定位。」\n"}, {"name": "禅修前行", "subtitle": "内摄工程", "detail": "安般守意·四种观法", "color": "blue", "description": "核心: 安那般那数息观(数.随.止)。官网: 「调息安稳,气息有序;守意——令心不外驰,身息心三者逐步协同。」观法次第: 驻佇心观(停心前行)->唯心识观(钝根先修.毗钵舍那)->真如实观(利根直修.奢摩他)->毗婆舍那->奢摩他。详见「📐 禅观法要」子页。\n"}, {"name": "禅修正行", "subtitle": "等持工程（内观）", "detail": "三摩呬多→三摩钵底→三摩地", "color": "red", "description": "前半程三摩呬多→后半程三摩钵底→究竟三摩地。官网: 「以观导定、以定成观,当下验果,不逐境界名相而重身心之柔和、稳定、清明。」课程配比: 70%修行面 + 30%健康面。延伸: 一日禅·二日禅·忍可禅七。\n"}], "four_stages_blueprint": {"description": "据海云法师《四十华严讲记》第四卷第67讲及大华严寺官网「修行蓝图」页面。整套蓝图涵盖从信众到证量的完整阶次。\n", "stages": [{"name": "出离乘", "description": "出离心→出离道→出离行。以脱离轮回、了生死为基础动机，建立「出三界、入法界」之志。\n"}, {"name": "菩提乘", "description": "菩提心→菩提道→菩提行。发心求觉悟。法师称此「只是起步」。\n"}, {"name": "菩萨乘", "description": "菩萨心→菩萨道→菩萨行。法师称此「还没有究竟」——仍属因地修行。\n"}, {"name": "普贤乘", "description": "普贤心→普贤行→普贤道。究竟归趣。法师称「究竟要到普贤乘来」——此即「普贤乘华严宗」名称的义理出处。\n", "is_ultimate": true}]}, "six_subjects": {"description": "海云法师将传统华严义学重组为可依次修学的课程架构。「五大行法」即六科中除总论外的五项——禅、净、律、密、经教——主张华严宗并非纯粹「解门」而有完整「行门」。\n", "subjects": [{"name": "华严学概论", "content": "华严经结构·五教十宗·法界缘起（总纲性导论）"}, {"name": "华严经教行法", "content": "经文解读·修行法门·善财五十三参（经教门）"}, {"name": "华严禅行法", "content": "安般守意·置心一处·三摩地次第（禅门）"}, {"name": "华严戒律观", "content": "菩萨戒·梵网经·现代持戒（律门）"}, {"name": "华严净土法门", "content": "华藏世界·毗卢遮那净土（净门）"}, {"name": "华严密法", "content": "华严字母·曼荼罗·真言持诵·秽迹金刚法（密门）"}]}, "three_lineages": {"description": "海云法师对三条汇流法脉在体系中各自的功能分工（据大华严寺官网及讲记）：\n", "lineages": [{"name": "中观论派", "role": "解", "description": "义理/空性论证——负责「理解」层面的理论基础。\n"}, {"name": "华严思想", "role": "架构", "description": "提供整体的世界观与义理框架——「事事无碍法界」「法界缘起」等核心世界观。\n"}, {"name": "瑜伽行派", "role": "行", "description": "禅观正行/实修技术来源。源自印度 Maha Yoga 传承（胜师子王菩萨），法师将其等同于「禅宗的禅观正行」。\n", "note": "官网将这支传承直接注解为「大乘瑜伽行派／Yogācāra 之行门精义」，读者可留意其中的诠释性跨度。\n"}]}, "four_projects": {"projects": [{"name": "结界工程", "description": "短期共修——调整身心频率的具体操作"}, {"name": "华藏工程", "description": "双重意涵: ①个人前行阶段必修课程（建立语言/思维模式）②跨世代文明教育志业——法师称「华藏工程五百年」\n"}, {"name": "华严大学", "description": "体制化培育弘法与研究人才的当代项目（非月霞法师等创办的历史性华严大学）"}, {"name": "BQ广场", "description": "四大工程之一，目前公开资料中未见「BQ」具体所指的清晰界定"}]}, "cognitive_levels": {"description": "法师自创的认知层次术语，用以区分凡夫、行者、法身大士三个阶段所依靠的不同认知机制：\n", "levels": [{"name": "识性", "stage": "凡夫阶段", "description": "「能」——妄想心。「识性的能绑虚妄的身」——凡夫是「身心混杂」状态。\n"}, {"name": "根性", "stage": "初果至四果阶段", "description": "「所」。此阶段关键操作是「舍识用根」。\n"}, {"name": "智", "stage": "十信位圆满之后", "description": "此后「以智为先导」，不再「以所为先导」。\n", "note": "法师坦承这套区分是借助现代汉语语法结构对古典义理的诠释性翻译，非声称唯一表述。\n"}]}, "three_refuges": {"intro": "海云法师在传统「皈依三宝」之外，提出更具操作性的归依框架：\n", "practice_attitude": "法师强调「自顾灵山，不顾名山」「知道不算，做到才算」——真正的修行来自扎实的日常践行。\n", "items": [{"name": "缘念道场", "description": "缘念僧团，以道场为修行依止处"}, {"name": "缘念善知识", "description": "缘念具体指导的师长，接受僧团制度性指导"}, {"name": "缘念法门", "description": "缘念自己实际修学的具体法门，不杂修不盲从"}]}, "latest_news": [{"year": "2023", "title": "国立台北大学杰出校友", "description": "获遴选为母校杰出校友(2023年)。2024年1月促成华严学会与台北大学签署学术合作协议(一期两年.合计三期共六年),合办「新世纪永续发展」高峰论坛(2024-2025年)。\n"}, {"year": "2026", "title": "「九九华严」五年讲座（TICC）", "description": "于台北国际会议中心举行，每月举办。将华严哲理「转化为通俗易懂的现代心理学与生命科学」语言，回应「AI科技与永续新时代」的挑战——「AI给得了答案，但给得了心安吗？」\n"}, {"year": "2026.7.9", "title": "支提山大华严寺动土", "description": "苗栗县通霄镇。面向台湾海峡，与福建宁德支提华严祖庭隔海相望——「山海相应、法脉相承」。四百余位护法善信参与，五十三位嘉宾共同执铲（呼应善财五十三参）。\n"}, {"year": "ongoing", "title": "第四期佛教", "description": "大华严寺官网对海云法师使命的表述——「以中兴汉传佛教，开展第四期佛教思想发展为使命」。目前尚未见对第一至第三期的系统性论述。\n"}], "evolution_timeline": [{"period": "1981-1991", "node": "在家讲经探索期", "feature": "以现代语言诠释华严·业余讲经·无僧团建制"}, {"period": "1991.12.22", "node": "梦参老和尚剃度(弥陀诞日)", "feature": "临济宗第47代·确立僧团身份·正式出家弘法"}, {"period": "2004-2010", "node": "西安/北京系统弘法", "feature": "陕师大华严研究所·社科院演讲(2005.1)·北京广化寺《四十华严》全本讲解(2006.11-2010.6)"}, {"period": "2008", "node": "三脉汇流", "feature": "钦因传华严衣钵(贤首42世, 9月10日求法.9月21日传法大典)+印度胜师子王菩萨传瑜伽行法(年底)\n提出「普贤乘华严宗」·工程面/技术面双轨教学确立\n"}, {"period": "2011-2013", "node": "密集出版·框架定型", "feature": "华严六科·五大行法·三部曲·禅观体系完整出版"}, {"period": "2014-2019", "node": "讲经扩展·制度细化", "feature": "药师/地藏/各品讲记密集出版·忍可灌顶制度·华严专宗学院"}, {"period": "2020-2023", "node": "数位化转型", "feature": "线上讲经·电子书出版·国立台北大学杰出校友(2023)"}, {"period": "2024-2026", "node": "第四期佛教·AI时代", "feature": "九九华严五年讲座(TICC)·支提山大华严寺动土(2026.7)·台北大学合作"}]}, "meditation_essentials": {"subpage": "禅观法要", "system_overview": {"description": "海云继梦和上华严禅观三阶段: 资粮道(发心工程.驻佇心观) → 前行(界内定.四种观法) → 正行(界外定.法界三观)。技术面(修定.身法)与工程面(修慧.心法)始终双轨并行。\n", "stages_table": {"headers": ["阶段", "定位", "核心工程", "观法", "禅定", "果位"], "rows": [{"stage": "资粮道", "position": "发心工程\n界外准备", "core_engineering": "五科(戒.律.调身.调息.调心)\n驻佇心观(停心)\n净化禅->象限转移\n", "observation": "驻佇心观\n(根本前行)", "meditation": "瞬定境(妙高定)\n粗住->细住->欲界定", "fruition": "三信位前\n(发心位)", "rowspan": 2}, {"stage": "", "position": "", "core_engineering": "", "observation": "", "meditation": "", "fruition": "", "note": "制度入门: 前行三年(教材/听经笔记/华藏工程)->禅师团审核->正授行法。三要件各有三。\n课程配比70%修行面+30%健康面。一日禅.二日禅.忍可禅七。\n"}, {"stage": "前行", "position": "内摄工程\n界内定", "core_engineering": "安那般那数息观\n(数.随.止)\n安般守意\n", "observation": "数法/随法", "meditation": "粗住->细住\n->欲界定->未到定", "fruition": "二信~四信位", "rowspan": 2}, {"stage": "", "position": "", "core_engineering": "", "observation": "止法+四种观法\n(1)唯心识(初-二信)\n(2)真如实(二信+)\n(3)毗婆舍那(中信)\n(4)奢摩他(后信)\n", "meditation": "四天王定->忉利定\n->空居天定->色界定\n->无色界定->出界定", "fruition": "初信~十信位\n初果(初信)->四果(七信)->十信满心\n"}, {"stage": "正行", "position": "等持工程\n界外定", "core_engineering": "三摩呬多->三摩钵底\n->三摩地(海印三昧)\n", "observation": "杜顺法界三观\n(真空绝相.理事无碍.周遍含容)\n", "meditation": "初禅定关口:\n左转->四禅八定(外道)\n右转->四果成就(解脱)\n", "fruition": "十信满心\n->初住至七地(37位)", "rowspan": 2}, {"stage": "", "position": "", "core_engineering": "四次灌顶\n(1)忍可(破无明)\n(2)行者(证初果)\n(3)进阶(能所合一)\n(4)高阶(能所双泯)\n", "observation": "界外定.无功用行", "meditation": "", "fruition": "八地至妙觉(5位)\n共42位圆满"}]}, "source_note": "三阶段架构名称据大华严寺官网「修行蓝图: 华严禅观全程」(2025年11月访问)。观法细节(四种观法/界内定界外定/果位对应等)据海云继梦《四十华严讲记》第67讲(2009.2.26)+《海云继梦禅观概论》(2015)+《迈向佛陀的境界》(2011)。凡官网与讲记表述有异处,以官网为框架、讲记为展开。\n"}, "two_paths": {"description": "海云和上将修行路径分为两条: 次第道(圣解脱道/智德门)与圆融道(普贤道/福德门)。核心差异: 次第道必须证得空性、即身成就; 圆融道不必证空性,凡夫亦可修,具足信根即可,经分段生死至他方净土证无生。法师明确开示:「凡夫行圆融道,就是没有那个充分条件,你没有证得空性。你行圆融道就那么一个条件,要尽形寿行菩萨道,对三宝具足信心。」但凡夫行圆融道须避讳「聚财」与「聚众」,否则在缺乏空性的前提下易入歧途。若避此忌,报尽必生净土。华严禅观三段教学法(前行->正授行法->妙行)中,前两区块属入法界次第道,第三区块「妙行」属已入法界后的圆融道。\n", "comparison_table": {"headers": ["维度", "次第道(入法界次第道)", "圆融道(法界圆融道)"], "rows": [{"dimension": "空性条件", "cidi": "必须证得空性", "yuanrong": "不必证空性,以信根具足替代"}, {"dimension": "生死方式", "cidi": "变易生死,即身成就(依色身)", "yuanrong": "分段生死,即生成就(依法身),经他方净土证无生"}, {"dimension": "实践目标", "cidi": "目的论明显,止观双运.定慧等持", "yuanrong": "无明显目的性,重行法过程,以信愿行为归"}, {"dimension": "核心技术", "cidi": "以「定」为范围,置心一处为归", "yuanrong": "以歌咏赞叹诸佛为归,理事合一地置心一处"}, {"dimension": "工程面", "cidi": "以《大经》(华严经)为归", "yuanrong": "以十大愿王为依归"}, {"dimension": "性质", "cidi": "由凡入圣——清除人性杂质恶质,由粗糙转入精微", "yuanrong": "由圣入圣——法身本具但迷不晓,藉佛号唱颂内引法身"}]}, "three_conditions": {"description": "三大核心条件: (1)对三宝的具足信——信心绝对,毫无折扣,100分 (2)尽形寿奋进于菩萨道——定位明确,一辈子做一件事(事修),从生命尊重与人性关怀出发服务众生 (3)一再的归零功课——每日反复检视自身,遇到挫折压力则拜忏(一百零八拜),将业力寄放在法界。\n", "warning": "凡夫行圆融道的避讳: 必须避讳「聚财」与「聚众」,否则在缺乏空性的前提下易入歧途——善者落人天善道,恶者成魔成精。若避此忌,报尽必生净土。\n", "examples": "法师以德雷莎修女为例: 具足对上帝的绝对信心(信根),一辈子只做「服务最穷的人」这一件事(事修),尽形寿不改——「行一法即行一切法」。梦参老和尚被关33年仍坚守信仰,亦属圆融道行者的典范。\n", "source": "出处: 海云继梦《华严禅观的入法界次第道》(fjdh.cn 2013.9) . 《四十华严讲记》第14讲.第68讲 . https://www.fjdh.cn/wumin/2013/09/175337285861.html\n"}, "ten_vows": {"description": "普贤十大愿王是善财童子五十三参的总结与精要——「《入不思议解脱境界普贤行愿品》中,不思议解脱境界即是法界,而普贤行愿是直接入法界的行法。」海云和上先后五次重要讲解: 1992年台北初讲.2001年5月加拿大湛山精舍(共52讲,分三册出版: 《普贤行愿》2002/《不思议解脱》2003/《大方广境界》2003).2006年台北(《普贤十大愿王行法精要》).2007年槟城+2008年新加坡(合并出版《十大愿王修行法要》)。另有2011年昆明开示系列(fjdh.cn收录)。\n", "hierarchy": {"title": "十大愿王三层次结构", "levels": [{"level": "根本（第1-3愿）", "items": "礼敬诸佛.称赞如来.广修供养", "position": "真正要实修的根本,可各选一门主修"}, {"level": "补充（第4愿）", "items": "忏悔业障", "position": "修前三愿遇挫折时以此补救,具关键性地位"}, {"level": "圆融扩大（第5-7愿）", "items": "随喜功德.请转法轮.请佛住世", "position": "使基础修行圆满"}, {"level": "无限扩大（第8-10愿）", "items": "常随佛学(百).恒顺众生(千/重重无尽).普皆迴向(万/无有止境)", "position": "代表无限的扩大——「虚空界尽.众生界尽.众生业尽.众生烦恼尽,我此愿力无有穷尽」"}]}, "core_principles": "(1)普贤行愿力——海云和上在2011年昆明《普贤行愿品》开示中指出: 「普贤菩萨是法界的第一尊佛,你看得到,你能够认识到佛的第一个形象,就是普贤菩萨。那么在自性海中所修行的法,都叫普贤行愿。你在自性海中所修行的法,所产生的威神力,叫做普贤行愿力。」「我以普贤行愿力故,深心信解,如对目前」(即亲自体验证得,非推测想象)\n(2)四无尽观——每一大愿皆以虚空界尽.众生界尽.众生业尽.众生烦恼尽为所依,四者无有尽故修行无有穷尽,心量无限放大\n(3)念念相续无有疲厌——倾向于圆融道行法,不可一曝十寒。\n", "source": "出处: 《普贤十大愿王行法精要》(空庭书苑, 2006年台北讲记, ISBN 9789867484734) . 《十大愿王修行法要》(空庭书苑, 2007槟城+2008新加坡) . 2011年昆明开示系列(fjdh.cn收录) . https://findbook.com.tw/9789867484734\n"}}, "stage1_foundation": {"title": "第一阶段: 禅修入门 — 发心工程（资粮道）", "description": "资粮道是一切禅观的基础准备，约需1-3年。核心任务是发心工程——使行者从散乱中「静下来」。通过「驻佇心观」(停心)将心初步收摄，成为「堪受法器」后方可进入前行。\n", "sections": [{"title": "制度性入门 — 修行不是DIY", "content": "法师强调:「它是一套制度」——个人能走到哪一步靠「法的传承」，但能否进入这套体系靠「宗的传承」建制。\n\n前行三年: 完成道场指定基础教材、听经笔记(共修时核实)、每周共修、参加「华藏工程」建立语言和思维模式。经禅师团同意、道场推荐、禅师团审核，方取得「正授行法」资格。\n\n五科训练: 戒.律.调身.调息.调心。课程配比: 70%修行面(戒/律/调心)+30%健康面(调身/调息)。\n\n三要件各有三: (1)心性要件-行者先决条件 (2)内摄要件-调身+调息=暖身二法 (3)内观要件-等持工程三昧基础，属一乘不共别圆。\n\n出处: 大华严寺官网「资粮道」页面 . 海云继梦《四十华严讲记》第67讲(2009年2月26日开示, fjdh.cn收录逐字稿)\n"}, {"title": "调身.调息.调心 — 五科训练详解", "content": "五科(戒.律.调身.调息.调心)是资粮道的实操基础。海云和上指出: 身.息.心三者一体不二——调息可及于调身,调身效果又可及于调心。实际行法中三者同时并行,非先后次第。核心著作: 《煖身: 华严禅修入门》(布克文化 2021, ISBN 9789865405984)。\n", "subsections": [{"title": "调身 — 毗卢遮那七支坐相", "description": "据海云和上《迈向佛陀的境界——华严禅前行概论》第六章「毗卢遮那七支坐法」(fjdh.cn收录全文)。和上强调:「七支坐相的目的,旨在调身……若人以此来摄心,即能顿证佛性海。」\n", "items": [{"name": "(1)跏趺坐", "detail": "双盘为佳,单盘或金刚坐亦可。臀与两膝三点鼎立成正三角形,稳固久坐不倾"}, {"name": "(2)手结定印", "detail": "两掌相迭掌心向上,拇指轻拄(指甲碰指甲即可)。「五心向上」(两掌心/两足心/顶门)令气流畅"}, {"name": "(3)头正颈正", "detail": "头不左右偏。「头正、颈正」与「脊直、肩平」构成十字形"}, {"name": "(4)脊直肩平", "detail": "脊椎挺直,两肩平正放松,神经/血液/内分泌系统自然运作"}, {"name": "(5)眼平视", "detail": "眼帘自然下垂以遮光为度,取「三分慈眼」。「此三相摄三千威仪」(头正/脊直/眼平视)"}, {"name": "(6)舌抵颚", "detail": "舌尖轻顶上颚齿龈(上门牙牙龈处),口水自然由舌根两旁下流入咽喉"}, {"name": "(7)收下颚", "detail": "头不前后偏,百会穴与海底穴重迭。如此方能「经劫不替」,久坐不倾"}]}, {"title": "调息 — 息之四相与数息法", "description": "息之四相出自智者大师《释禅波罗蜜次第法门》,海云和上在《禅修前行》第六集(fjdh.cn 2013.11)中引用并详加解说: 「守风则散,守喘则结,守气则劳,守息即定。」\n", "breath_phases": [{"name": "风相", "feature": "鼻息粗重,出入有声", "meaning": "身心不安宁->先安心,放下身心世界"}, {"name": "喘相", "feature": "息无声但出入结滞不通", "meaning": "身体多病->宽放身体,放松情绪"}, {"name": "气相", "feature": "息不结滞但不细", "meaning": "初修状态->观想气行遍毛孔肢节,愈微愈妙"}, {"name": "息相", "feature": "无声.不结.不粗,出入绵密若存若亡", "meaning": "调相——可入定"}], "counting_method": "数息要领: 注意力集中于「风门」(鼻中膈底部,两鼻孔间接近上唇处),觉知息入息出。在「息入尽」及「息出尽」的换气处数息(一入一出为一圈)。初学者从数「一至三」起,稳定后增至「一至五」->「一至七」->「一至十」。\n"}, {"title": "调心 — 治沉.浮.宽.急四相", "heart_phases": [{"name": "沉相", "symptom": "昏沉欲睡.精神涣散.低头垂颈", "remedy": "补充营养(综合维他命);意守风门,守息入息出"}, {"name": "浮相", "symptom": "精神亢奋.心念多缘.身躁动", "remedy": "少食五辛.补品.牛羊肉等;系念丹田"}, {"name": "宽相", "symptom": "心意不举.身好躺卧.口中多水", "remedy": "饮食多温热少寒凉;摄身挺腰,心安住息中"}, {"name": "急相", "symptom": "胸中疼痛.气上举不调", "remedy": "多食寒凉少食燥热;放宽身心,意不卑不亢"}], "note": "若风门举意仍无效,可提意至眉间(风门至眉间称「金刚宝剑」,道家称「小周天」)。"}, {"title": "入相.住相.出相 — 一座禅修的三阶段", "phases": [{"name": "入相（由粗到细）", "detail": "调身(七支坐相)->调息(觉息相.数息)->调心(治沉浮宽急)"}, {"name": "住相（住于细中）", "detail": "摄心于息,同时觉知身.息.心三相是否调和,随觉随治"}, {"name": "出相（由细到粗）", "detail": "先放心异缘(调心)->开口放气,息从百脉散(调息)->微动身躯.肩臂.头颈.双足,揉毛孔.摩掌熨眼(调身),待身热后方可出入,站定后拍打全身"}]}], "source": "出处: 《煖身: 华严禅修入门》(布克文化 2021, ISBN 9789865405984) . 七支坐相原文: 海云和上《迈向佛陀的境界——华严禅前行概论》第六章(fjdh.cn 2013.11) https://www.fjdh.cn/wumin/2013/11/183343302811.html . 《禅修正行》第12集 . 《禅修前行》第6集 . https://play.google.com/store/books/details?id=QREREAAAQBAJ\n"}, {"title": "驻佇心观(停心工程) — 一切禅观的根本前行", "content": "海云法师:「你要能够停下心来，然后，我们要观心！停心是一个前行，都办不到了，怎么观心啊？」核心次第: 「停心」->「观心」。\n\n停心(体.相二门):\n体上停心: 心念不起，六根对六尘境界不会攀缘。\n相上停心: 不妄加猜测、攀缘分别。标准——「心是不是静止下来，像墙壁一样，动都不动！」\n\n四种停心方法:\n(1)参话头: 「看话头就是把心停在那里」\n(2)置心一处: 心安鼻端风门,心跑掉就拉回来\n(3)数息/随息: 从呼吸入手\n(4)依禅堂规矩: 该动则动.该静则静.身心放下。\n\n观心与验证:\n停心之后才能观心——六根对六尘如何作用,看得清清楚楚,「没有任何推理、没有任何意识形态」。法师强调:「不停心你看不到！」六项自检: 空.明.定.智.善心.柔软。\n\n出处: 海云继梦《华严禅行法—禅观》第四集 . https://www.fjdh.cn/wumin/2013/11/165329303084.html . https://www.fjdh.cn/wumin/2013/09/155711285715.html\n"}]}, "stage2_preparation": {"title": "第二阶段: 禅修前行 — 内摄工程", "description": "前行是禅观体系的核心训练阶段，在界内定中进行。四种观法构成工程面主干，贯穿初信至十信位。前二种出自《占察善恶业报经》(T17n0839)，后二种是标准大乘止观。\n", "sections": [{"title": "技术面.工程面双轨详解", "subsections": [{"title": "参禅金三角 — 置心一处 . 放轻松 . 息入息出", "description": "参禅金三角是海云和上禅修教学中 最核心的入门架构,三个条件缺一不可。法师强调:「这三点若能做到及格,触功德就会发起,身心得到调整,人格性可达七十五分以上。完成参禅金三角即进入心一境性。」\n", "elements": [{"name": "(1)置心一处", "description": "将心念安住「风门」(鼻孔气息出入处)", "operation": "用数息法从一到十循环计数。莫用大脑推理思考,只用感受"}, {"name": "(2)放轻松", "description": "身体肌肉.神经系统都要放下;心理上也完全放松,不起执着", "operation": "不能为了专注而肩膀紧绷。「呼吸归呼吸,妄想归妄想」——不跟妄想纠缠"}, {"name": "(3)息入息出清楚", "description": "对呼吸的出入看得清清楚楚,不能昏沉睡着", "operation": "「六根门头全开放」——心在宁静中保持鲜活。守住风门,身心放松,妄念停止"}], "full_process": "整体流程: 调身(七支坐相)->调息(自然呼吸,数息1-10)->置心一处于风门->同时放松身心->息入息出清清楚楚->达成金三角(心一境性)->触功德发起(轻安舒服感)->继续觉照根性->象限转移->破无明->入菩提道。\n", "warning": "警示: 修得轻安感后不可耽于禅味,否则会掉入四禅八定而失去对根性的觉照。\n", "source": "出处: 海云继梦《何谓参禅金三角》(fjdh.cn 2013.12) . https://www.fjdh.cn/fjask/2013/12/133616318955.html . http://read.goodweb.top/news/news_view.asp?newsid=82958\n"}, {"title": "技术面: 安那般那 — 数.随.止三法", "methods": [{"name": "数法", "state": "粗住->细住->欲界定", "operation": "置心风门,1数到10循环。克服四种妄想: 心理/物理/生理/社会制度", "pitfall": "⚠ 掉入「舒服禅」——枯木禅非真修"}, {"name": "随法", "state": "欲界定->未到定", "operation": "注意「息入尽」与「息出尽」的每一个细节。妄想被堵住", "pitfall": "追求境界名相,忽略身心柔和"}, {"name": "止法", "state": "置心一处.心一境性", "operation": "所有妄想脱落,心境合一。八触十功德", "pitfall": "⚠ 左转入外道禅;须「右转」向四果"}]}, {"title": "工程面: 三阶段心法 + 三层功夫", "stages": [{"name": "A阶段", "detail": "感受息之长短与动静差异"}, {"name": "B阶段", "detail": "洞悉呼吸因果轨迹(法师称「生命的秘笈」)"}, {"name": "C阶段", "detail": "心王.心所.境界(公开资料未完全展开)"}], "three_layers": "内摄(技术面): 「妄想一起,把心抓回来放在风门」\n内观(工程面): 在数随止中感受法身存在,分三级: 寂而常照/照而常寂/寂照双亡\n禅观: 粗(数随止中感受)->细(置心一处后)->微妙(十信圆满后)\n"}], "source": "出处: 大华严寺官网「修行蓝图」. 海云继梦《禅修正行》《禅观》系列 . 《海云继梦禅观概论》(2015)第四章\n"}, {"title": "四种观法体系 — 前行工程面核心", "table": {"headers": ["观法", "信位", "禅定", "工程", "核心操作", "成就"], "rows": [{"name": "(1)唯心识观", "stage": "初信~二信", "meditation": "四天王定(煖法)", "engineering": "自省三业", "operation": "守记内心;避免无记攀缘;行禅/闭眼抬手训练", "achievement": "色寂三昧"}, {"name": "(2)真如实观", "stage": "二信位+", "meditation": "忉利定(顶法)", "engineering": "观五蕴流转", "operation": "思惟心性无生无灭;反观自性;超越四空定", "achievement": "相似空三昧->心寂三昧->一行三昧"}, {"name": "(3)毗婆舍那观", "stage": "中信位", "meditation": "空居天定->色界定", "engineering": "观根尘识;照住色受间", "operation": "观六根六尘六识流动;照住色受动态止观", "achievement": "渐舍五识(色界定)"}, {"name": "(4)奢摩他观", "stage": "后信位", "meditation": "无色界定->出界定", "engineering": "照见五蕴空;入正真位", "operation": "舍意识;能所双泯;照见五蕴皆空", "achievement": "十信满心;入法界;圆教初住位"}]}, "classical_source": "《占察善恶业报经》:「若欲依一实境界修信解者,应当学习二种观道。何等为二?一者唯心识观,二者真如实观。」海云法师称此经为「小本华严」。\nhttps://cbeta.buddhism.org.hk/xml/T17/T17n0839_002.xml\n", "sharp_dull_differentiation": "利钝分判: 利根者(阴盖轻微.散乱心少)->直修真如实观; 钝根者(染着情厚.心难调伏)->先修唯心识观。海云法师补充: 钝根先以唯心识观摄心,令妄想降伏后方转入真如实观,此即「由相入性」。\n", "detail_1_title": "(1) 唯心识观 — 毗钵舍那(观).法相宗.钝根先修", "detail_1_content": "定位: 初信~二信位。工程: 自省三业(身.语.意),在定中境中唯观一切三业「唯心生.唯心灭」。四天王定是行者从「定外境」转入「定内境」的起点,属坚信位「煖法」;忉利定属「顶法」,不仅唯见三业之既成,更能见到「三业中心之所由起」。\n\n「学唯心识观者,于一切时一切处,随身口意所有作业,悉当观察,知唯是心。勿令使心无记攀缘,不自觉知。」「一切法唯心想生。若使离心,则无一法一相而能自见有差别也。」\n\n两大重点: (正面)守记内心-念念清楚;(反面)避免无记攀缘-口头禅.摸头发等惯性动作。\n具体训练: (1)闭眼抬手-「手在哪里?你知道吗?要很清楚地感知到」 (2)行禅-脚步慢慢抬起->停->放下,清清楚楚了知 (3)口诀-「唯心识观就是不用大脑,让灵性生命浮现出来」。得色寂三昧。\n", "detail_2_title": "(2) 真如实观 — 奢摩他(止).法性宗.利根直修", "detail_2_content": "定位: 二信位及以上。工程: 观五蕴流转。与唯心识观的差别: 前者看「身语意三业(表层)」,后者深入「五蕴(身心基本元素)」的微观生灭。法理: 大乘起信论「一心开二门」—唯心识观对心生灭门(心之用),真如实观对心真如门(心之体)。\n\n「思惟心性无生无灭,不住见闻觉知,永离一切分别之想,渐渐能过空处.识处.无少处.非想非非想处等定境界相,得相似空三昧。」「展转能入心寂三昧……即复能入一行三昧,见佛无数,发深广行心,住坚信位。」\n\n海云判摄[语境: 2013年高雄《占察善恶业报经》开示]: 「唯心识观是让你了解心的存在跟作用-它像流水一样,前念接后念。真如实观是直接去看那个源头-心性的本源,无生无灭的那个。」\n", "detail_3_title": "(3) 毗婆舍那观 — 深化观照.中信位", "detail_3_content": "定位: 中信位(约五~六信位)。含两个递进层面: (a)观照六根六尘相接时的六识流动-比唯心识观更精微,从行为觉知深入到感知通道机制 (b)照住色与受之间的动态止观-「色」(物质性感受)与「受」(心理性感受)的细微边界。成就: 渐舍五识,进入色界定。\n", "detail_4_title": "(4) 奢摩他观 — 究竟止观.后信位.能所双泯", "detail_4_content": "定位: 后信位(七~十信位)。三步骤: (a)舍意识-三界定功总纲最后阶段 (b)能所双泯-完全泯除主客二元对立,即《心经》「照见五蕴皆空」 (c)入正真位.十信满心-得「能所双泯」,正式「入法界」,成圆教初住位,转入正行。\n", "three_realms_discarding": {"title": "三界定功总纲(海云法师判摄)", "rows": [{"realm": "欲界定", "core": "捨妄念", "observation": "唯心识观+真如实观", "stage": "初信~四信位"}, {"realm": "色界定", "core": "捨五识", "observation": "毗婆舍那观", "stage": "五信~六信位"}, {"realm": "无色界定", "core": "捨意识", "observation": "奢摩他观", "stage": "七信~九信位"}, {"realm": "出界定", "core": "能所双泯.入法界", "observation": "奢摩他观究竟", "stage": "十信满心"}]}, "source": "出处: 《非常占察经》讲记三册(空庭书苑 2015-2017, ISBN 9789867484918/4932/4949) . 播客「普賢乘華嚴宗」S18(46集) . https://podcasts.apple.com/au/podcast/普賢乘華嚴宗/id1523368889 . https://open.spotify.com/show/2ZDlq4cOOiynQvlzPARkmc\n"}, {"title": "十信法门.果位对应 — 四种观法的阶位映射", "content": "海云法师将声闻「四果」与华严「十信位」逐级对应。「破根本无明」是初果的门槛而非彻悟终点——「破根本无明才叫做悟后起修！」[语境: 2009年2月26日《四十华严讲记》第67讲, 台北]\n", "mapping_table": {"headers": ["传统果位", "华严信位", "对应观法", "禅定层次", "关键标准"], "rows": [{"fruition": "初果(预流果)", "stage": "初信位", "observation": "唯心识观", "meditation": "四天王定(煖法)", "standard": "「舍识用根」"}, {"fruition": "—", "stage": "二信位", "observation": "唯心识->真如实", "meditation": "忉利定(顶法)", "standard": "确认菩提心.毗卢遮那七支坐相.收心工程"}, {"fruition": "二果(一来果)", "stage": "三信位", "observation": "真如实观", "meditation": "欲界空居天定", "standard": "开始运用「观照」.具轻安三相+天王三德"}, {"fruition": "—", "stage": "四信位", "observation": "真如实观", "meditation": "同上", "standard": "安般守意工程: 置心于风门"}, {"fruition": "三果(不还果)", "stage": "五信位", "observation": "毗婆舍那观", "meditation": "色界定", "standard": "渐舍五识"}, {"fruition": "四果向", "stage": "六信位", "observation": "毗婆舍那观", "meditation": "色界定", "standard": "照住-色受动态止观"}, {"fruition": "四果(阿罗汉)", "stage": "七信位", "observation": "奢摩他观", "meditation": "无色界定", "standard": "我法二执尚未双破"}, {"fruition": "发心破法执", "stage": "八信位", "observation": "奢摩他观", "meditation": "无色界定", "standard": "回小向大"}, {"fruition": "我执法执双破", "stage": "九信位", "observation": "奢摩他观", "meditation": "出界定", "standard": "渐舍意识"}, {"fruition": "十信位圆满", "stage": "十信位", "observation": "奢摩他究竟", "meditation": "出界定.入法界", "standard": "能所双泯=照见五蕴皆空.成圆教初住位"}]}, "post_note": "十信位之后: 初住位至七地(37位.正行.对应金刚界曼荼罗37尊)->八地至妙觉(5位.无功用行)——共42位圆满佛果。\n"}, {"title": "三重观照技术: 观照.照住.照见", "content": "贯穿四种观法的操作层面技术: 观照(二果开始,能所分离,唯心识观在此运作)-> 照住(至四果,能所合一,毗婆舍那观在此深化)-> 照见(十信满心,能所双泯,奢摩他观在此圆满)。\n\n法师说明:《心经》《金刚经》在他的判摄里都属于圆教初住位的教法——证量标的其实是「十信位圆满.入法界」之后的境界。\n"}]}, "stage3_main": {"title": "第三阶段: 禅修正行 — 等持工程（内观）", "description": "十信满心之后,转入正行。等持工程为官网正式名称。前半程三摩呬多(samahita),后半程定慧等持(三摩钵底 samapatti),究竟等至(三摩地 samadhi)。官网: 「以观导定、以定成观,当下验果,端身正坐,置心风门,依次第而进,步步可检核。」海云和上在讲记中进一步以「界内定/界外定」区分前行与正行的禅定层次,并以杜顺法界三观为究竟指导。\n", "sections": [{"title": "杜顺法界三观 — 正行核心指导框架", "content": "杜顺和尚(华严初祖)所立三重观法,是华严禅观正行的究竟指导。海云和上指出: 龙树将三法印汇归一法印——空性(真空绝相观);杜顺进一步推进为理事无碍观;最终倡事事无碍观(周遍含容观)——举事即能通事,无需再透过理的转辙,此唯法身大士之行径。\n", "table": {"headers": ["观法", "对应法界", "核心义理", "海云法师判摄"], "rows": [{"name": "(1)真空绝相观", "realm": "理法界", "theory": "会色归空,明空即色,空色无碍。一切法当体即空", "interpretation": "龙树空性一法印之极致——理无碍即阿罗汉空性观"}, {"name": "(2)理事无碍观", "realm": "理事无碍法界", "theory": "理遍于事,事遍于理。理(真如)不碍事(万象),事不碍理", "interpretation": "事无碍即生活中的一切事物——「吾辈行者,亦当力行乎此」"}, {"name": "(3)周遍含容观", "realm": "事事无碍法界", "theory": "事如理融,遍摄无碍。如因陀罗网,一即一切,重重无尽", "interpretation": "举事即通事,不经理之转辙——唯法身大士境界。即海印三昧现前"}]}, "source": "出处: 杜顺《法界观门》 . 海云继梦《迈向佛陀的境界》(空庭书苑 2011) . http://wuming.xuefo.net/nr/6/59482.html\n"}, {"title": "正授行法 — 四次灌顶制度", "table": {"headers": ["灌顶", "目标", "关键"], "rows": [{"name": "(1)忍可灌顶", "goal": "破根本无明", "key": "约十人中八人被「踢出去」重修"}, {"name": "(2)行者灌顶", "goal": "证初果.寻生命原形", "key": "通过后取得正式「行者」资格"}, {"name": "(3)进阶灌顶", "goal": "能所合一.破我法二执", "key": "成就四智"}, {"name": "(4)高阶灌顶", "goal": "能所双泯.入法界", "key": "「照见根性,能所双泯」=「照见五蕴皆空」"}]}}, {"title": "三摩呬多.三摩钵底.三摩地", "table": {"headers": ["名相", "梵语", "定位", "操作要点"], "rows": [{"name": "三摩呬多", "sanskrit": "Samahita", "position": "入定前.专注调心", "operation": "粗住->细住->欲界定。排除妄想执著"}, {"name": "三摩钵底", "sanskrit": "Samapatti", "position": "以观导定.定慧双运", "operation": "勘定三界定。须善知识勘定"}, {"name": "三摩地", "sanskrit": "Samadhi", "position": "究竟.心一境性.海印三昧", "operation": "出入自在。破法执我执"}]}, "note": "术语说明: 「三摩地」(samadhi)标准译语为「等持」,「三摩钵底」(samapatti)标准译语为「等至」。大华严寺官方资料中的配对与此恰好相反——此系道场自身的术语使用习惯。\n"}]}, "classical_foundations": {"title": "古典义理地基 — 杜顺和尚五教止观", "description": "华严初祖杜顺大师所立五教止观,是华严宗禅观的古典义理框架。海云和上的四种观法是实际操作体系,五教止观则是其背后的意识状态分类学——二者构成「行」与「解」的互补关系。\n", "entries": [{"name": "一.法有我无门(小乘教)", "content": "破除「我执」,体悟我空,但法执犹存。对应四禅八定。", "hy_mapping": "在海云体系中对应: 资粮道阶段的基本停心功夫。"}, {"name": "二.生即无生门(大乘始教)", "content": "体悟「法空」——外境皆由阿赖耶识变现。", "hy_mapping": "在海云体系中对应: 唯心识观——「知唯是心」的义理背景。"}, {"name": "三.事理圆融门(大乘终教)", "content": "空有不二,理事圆融无碍。", "hy_mapping": "在海云体系中对应: 真如实观——理(真如)与事(五蕴流转)融合的义理背景。"}, {"name": "四.语观双绝门(大乘顿教)", "content": "言语道断,心行处灭。", "hy_mapping": "在海云体系中对应: 奢摩他观——「舍意识」「能所双泯」的义理背景。"}, {"name": "五.华严三昧门(一乘圆教.究竟)", "content": "见法界缘起之相——万象影现,一即一切、圆融无碍。此即海印三昧。", "hy_mapping": "在海云体系中对应: 正行究竟——三摩地.海印三昧.法界三观现前.42位圆满。"}]}, "xianshou_wujiao": {"title": "贤首五教仪 — 华严判教: 小.始.终.顿.圆", "description": "贤首五教仪由华严三祖法藏(贤首国师)创立,清续法大师集大成,是华严宗判教理论的核心框架。海云继梦和上称判教为「文化解剖学」——将印度佛教文明基因与中国文明基因进行重组的方式。五教与杜顺五教止观一一对应: 小教(法有我无门).始教(生即无生门).终教(事理圆融门).顿教(语观双绝门).圆教(华严三昧门)。法师于2008年5月19日至7月17日在台北讲授《贤首五教仪—法界观》,可确认至少53集。播客音频于2020年3月9日前后由「海云继梦法师讲经」频道集中上传至Spotify/Apple Podcast等平台。\n", "table": {"headers": ["五教", "核心义理", "海云法师判摄", "修证品数"], "rows": [{"name": "小教", "theory": "只说人空,不明法空。依六识三毒建立染净根本。\n「如木作灰,如色归空,断烦恼障,灭分段死」\n", "interpretation": "封闭型心态,只执一法门。总相念=始教十回向", "grades": "—"}, {"name": "始教", "theory": "分空始教(般若)与相始教(唯识)。说一切皆空或分别诸法性相。定性二乘不成佛\n", "interpretation": "「如镜离垢,如月出云,断二障,灭二死,显二空,证二果」", "grades": "十二品"}, {"name": "终教", "theory": "说如来藏随缘成阿赖耶识。定性二乘.无性阐提悉当成佛。少说法相,广说真性\n", "interpretation": "「如器成金,如冰即水」——将事相会归于理体,大乘至极之说", "grades": "四十二品"}, {"name": "顿教", "theory": "一念不生,即名为佛。唯是一念,无时可说。无明不起时即无时空;无明起时便有三大阿僧祇劫\n", "interpretation": "「如狂迷歇,如睡梦觉」——一切烦恼本来自离,不是烦恼缠你,是你招揽烦恼。关键: 置心一处", "grades": "五十二品"}, {"name": "圆教", "theory": "一切即一,一即一切。念劫圆融,自在无碍。一位即一切位,十信满心即摄五位成正觉。依普贤法界,性相圆融,主伴无尽\n", "interpretation": "「如拆棉花,如融金狮」——不破而圆融,一切时分同时具足。初住至妙觉,三地超顿教妙觉", "grades": "六十二品"}]}, "gradual_vs_sudden": {"title": "渐教.顿教的实践义 — 从判教到操作", "content": "海云和上将判教转化为实际操作: 渐教(始教+终教)——次第修证路线,对应四种观法中的唯心识观->真如实观->毗婆舍那观,一级一级深入。顿教——「一念不生,即名为佛」「唯是一念,无时可说」。关键操作: 置心一处——守住风门(或佛号.咒语.数息),其他六尘境界一概不理,「能置心一处,一切烦恼自然离开」。顿教与始教.终教的根本区别: 小教与始教都在「无明的前提下」讲时间与次第;顿教直接告诉你无明不起时,即无时间可得——这是大脑想象不到.言语道断的境界。\n出处: 海云继梦《贤首五教仪—法界观》第40-45集(2008.7.8-7.10)\n"}, "source": "出处: 海云继梦 2008年台北《贤首五教仪—法界观》53集+ . https://www.listennotes.com/podcasts/海云继梦法师讲经-播客/ . https://open.spotify.com/show/2ZDlq4cOOiynQvlzPARkmc . 续法《贤首五教仪》原著\n"}, "yicheng_bieyuan": {"title": "一乘不共别圆 — 普贤乘的判教定位", "description": "「一乘不共别圆」是华严宗对自身教义的最高定位——「别人所没有的,所以叫做『别』」。「不共」谓不与三乘共,独为圆顿大根菩萨所说;「别圆」指有别于天台宗以《法华》为圆教的立场,华严自许为最圆满的别教一乘。海云和上特别强调: 这种不共别圆的特质不在理论层面,而在行法的内在蕴藏——「他在经文里头表达得很清楚,但是因为你不懂这种语言模式跟思维模式,所以你以为经文好像讲故事一样讲过去。」\n", "table": {"headers": ["概念", "定位", "特点"], "rows": [{"name": "别教一乘", "position": "《华严经》——纯圆至实,别于三乘", "features": "智俨《孔目章》:「别教者,别于三乘故。」法藏《五教章》: 分「性海果分」(佛自证,不可说)与「缘起因分」(普贤境界,可说)\n"}, {"name": "同教一乘", "position": "《法华经》——会三归一,摄末归本", "features": "智俨: 开三乘方便显一乘真实。法藏判同教一乘较别教一乘低一位,因须「会三归一」方显一乘"}]}, "puxian_interpretation": "海云和上以「普贤乘」名其体系——此即华严别教一乘的实践展开。法师在《四十华严讲记》第68讲中指出: 「普贤乘」的关键在直接兑现,非如三乘出离需次第渐修——「能观心即生成报身(文殊),所观心则生成法身(普贤),置心一处可滋长法身慧命。」并强调此不共别圆的特质不在理论,而在行法的内在蕴藏——「他在经文里头表达得很清楚,但是因为你不懂这种语言模式跟思维模式,所以你以为经文好像讲故事一样讲过去。」[语境: 2009年《四十华严》第68讲,台北]\n", "source": "出处: 智俨《华严经孔目章》.法藏《五教章》.海云继梦《四十华严讲记》第68讲 . 《华严学报》第3期(2012)\n"}, "important_texts": [{"name": "法藏《华严金师子章》 — 十门妙诠华严法界玄奥", "content": "《金师子章》是华严三祖法藏为武则天讲解华严奥义之作——以殿中金狮子为喻,从明缘起.辨色空.约三性.显无相.说无生.论五教.勒十玄.括六相.成菩提.入涅槃十门,仅约一千五百字,妙诠华严法界玄奥。海云继梦和上于2006年在台北开示,共14集。后由空庭书苑整理出版为《华严金师子章讲记》(265页,2010年出版)。讲记逐字稿于2013年11月由fjdh.cn(佛教导航)集中发布。\n\n核心判摄: 十段分三——(1~3)缘起/色空/三性=基础理论 (4~5)无相/无生=般若空性 (6)五教=判教入华严 (7)十玄=事事无碍最高境界 (8)六相=综合圆融(初地) (9)成菩提=二次圆融 (10)入涅槃=三次圆融,重重无尽。\n\n十玄门要义: 同时具足相应门(金体与师子相同时成立).因陀罗网境界门(一一毛处各有金师子,重重无尽,一即一切).十世隔法异成门(九世融于一念)。\n\n修行三区块: 凡夫区(变异念->善恶念->净识念).行者区(初果向到破我法二执).法身区(根本智->后得智->自受用->他受用)。法师强调:「知道不算,做到才算。」\n\n出处: 海云继梦《华严金师子章讲记》(空庭书苑 2010) . http://wuming.xuefo.net/nr/7/70462.html . https://www.got1shop.com/mobile/index.php?m=default&c=goods&a=index&id=3459706\n"}, {"name": "澄观《心要法门》 — 「至道本乎其心,心法本乎无住」", "content": "《心要法门》是华严四祖清凉澄观大师(738-839)所撰,全文仅数百字,阐述「至道本乎其心,心法本乎无住」的华严心法核心要义——无住心体是华严禅观的终极归趣。海云继梦和上以现代语言逐段译解,出版为《解心: 心要法门讲记》(空庭书苑 2001年6月30日初版, ISBN 9573067129, 326页; 宗教文化出版社 2005年9月简体版, 187页)。\n\n核心思想: 「无住心体」——真心不执著于任何一处,灵知不昧,性相寂然,包含德用,该摄内外。能证此者,即入法界。「心法本乎无住」——一切心法的根本在于无住,无住即不执取,不执取即解脱。\n\n海云法师判摄: 此即华严禅观的终极指向——四种观法(唯心识->真如实->毗婆舍那->奢摩他)层层深入,最终所证即是此「无住心体」。「无心于万物,而万物未尝无」——不是消灭万物,而是于万物中不执取,此即事事无碍法界的日常体现。\n\n法师后续出版《是心,非心,还是心!——从心要法门谈心》(空庭书苑 2013, ISBN 9789867484710),进一步深化「无住心体」与华严禅观修行次第的内在关联。\n\n出处: 海云继梦《解心: 心要法门讲记》(空庭书苑 2001/宗教文化出版社 2005) . https://www.buybook.tw/book-0010164666.htm . https://webpac.taichung.gov.tw/bookDetail/730070\n"}, {"name": "华严三品行法 — 净行品·梵行品·普贤行愿品", "content": "据《华藏妙海》听经笔记整理,海云和上将华严三品对应修行三阶段: 净行品——前行阶段的修行法门,信位菩萨所修,在日常生活中即可修; 梵行品——正行阶段的修行法门; 普贤行愿品——成佛以后的修学法门,「众生有尽,我愿无穷」。三品都是行门,构成从初学到究竟的完整行法链条。\n\n结界工程(据同来源): 结界是针对自己弱点,在自己能力范围内做最妥善的调整与安排,是个人修行资粮道的基础。从结界中可以学到如何肯定自己、认识自己——「结界工程是个人资粮道的基础」。\n\n出处: 《华藏妙海》听经笔记整理版(docs/notes4it目录)。\n弥勒菩萨章: 海云和上于善财五十三参第51参详讲弥勒菩萨——毗卢遮那庄严藏楼阁,共12集视频(B站 BV1X142147EN)+播客(Podwise)。此为法师关于弥勒的最主要讲记,目前文字整理尚不完整,建议直接观看视频。\n"}], "verification": {"title": "贯穿全程 — 验证机制.关键原则", "sections": [{"title": "验证机制 — 200+测验 & 归零重修", "content": "法师强调修行进程「绝对理性」「不能讲人情」: 全程设有两百余种具体测验——制造顺境诱发贪着反应、制造逆境激发嗔心反应。\n\n失败重修的规则极为严格: 并非退回上一级,而是打回初信(初果)从头开始——「四果再重修,就从这个地方开始,再从初果开始。」\n"}, {"title": "三大关键原则", "content": "(1)不走四禅八定: 法师称其为「共外道法」——「我们不走那条路,我们直接走出三界。」[语境: 2009年《四十华严讲记》第67讲]\n\n(2)大脑临界点: 置心一处之前可运用理性思维;一旦跨过初果门槛,必须弃用概念思维——「只要用大脑,初果进不去,就这么简单。」[语境: 2009年《四十华严讲记》第67讲]\n\n(3)两种歧路: 置心一处后产生「舒服.喜悦.轻安」或「恐惧」。若被执取,两种都会导向外道禅——必须连这类感受也一并放下。\n"}]}, "reference_table": {"description": "以下为本文所依据的全部第一手来源。内容以大华严寺官方资料.海云继梦和上讲经逐字稿.正式出版物为主,凡涉及诠释性跨度之处均已随文标注。\n", "headers": ["类别", "资源名称", "详情", "获取方式"], "rows": [{"category": "📖书籍", "name": "《非常占察经》一.二.三册", "detail": "海雲和上《占察善恶业报经》讲记.空庭书苑 2015-2017. ISBN: 9789867484918/4932/4949", "links": [{"text": "购买", "url": "https://www.got1shop.com/goods.php?id=281160"}, {"text": "图书馆", "url": "https://webpac.taichung.gov.tw/bookDetail/670127"}]}, {"category": "📖书籍", "name": "《海云继梦禅观概论》", "detail": "空庭书苑 2015. ISBN: 9789867484888", "links": [{"text": "购买", "url": "https://got1dev.got1shop.com/goods.php?id=219111"}]}, {"category": "📖书籍", "name": "《迈向佛陀的境界——华严禅前行概论》", "detail": "空庭书苑 2011. ISBN: 9789867484512", "links": [{"text": "Google Play", "url": "https://play.google.com/store/books/details?id=Mm36CgAAQBAJ"}]}, {"category": "🎙播客", "name": "普賢乘華嚴宗 S18《佔察善惡業報經》", "detail": "46集(已完结). 2013年高雄/台北开示", "links": [{"text": "Apple Podcast", "url": "https://podcasts.apple.com/au/podcast/普賢乘華嚴宗/id1523368889"}, {"text": "Spotify", "url": "https://open.spotify.com/show/2ZDlq4cOOiynQvlzPARkmc"}]}, {"category": "📺视频", "name": "大華嚴寺官方YouTube @huayen-world", "detail": "海雲法語.華嚴教海.Shorts.藥師經講座.九九華嚴", "links": [{"text": "YouTube频道", "url": "https://www.youtube.com/@huayen-world"}]}, {"category": "📝文字", "name": "fjdh.cn 佛教导航 — 海云继梦文集", "detail": "《华严禅行法—禅观》逐字稿.《禅修正行》系列.《四十华严讲记》第67讲", "links": [{"text": "禅观第四集", "url": "https://www.fjdh.cn/wumin/2013/11/165329303084.html"}, {"text": "停心.观心", "url": "https://www.fjdh.cn/wumin/2013/09/155711285715.html"}]}, {"category": "🌐官网", "name": "大华严寺全球资讯网 huayenworld.org", "detail": "「华严禅」专栏: 源流与传承.修行蓝图.资粮道.占察行法", "links": [{"text": "官网首页", "url": "https://www.huayenworld.org/"}, {"text": "修行蓝图全文", "url": "https://www.huayenworld.org/%e8%8f%af%e5%9a%b4%e7%a6%aa%e7%b0%a1%e4%bb%8b%e7%89%b9%e8%89%b2/"}]}, {"category": "🌐经典", "name": "CBETA 《占察善恶业报经》", "detail": "大正藏 T17n0839.天竺三藏菩提灯译", "links": [{"text": "CBETA 原文", "url": "https://cbeta.buddhism.org.hk/xml/T17/T17n0839_002.xml"}]}, {"category": "📄论文", "name": "《普贤乘禅观行法初探》", "detai nworld.org/%e8%8f%af%e5%9a%b4%e7%a6%aa%e7%b0%a1%e4%bb%8b%e7%89%b9%e8%89%b2/"}}, "heart_xref": {"entries": {"别用大脑": {"r1_huayan": "◆ 调身·调息·调心(五科训练): 海云和上《煖身:华严禅修入门》(布克文化2021)系统阐述,强调「身·息·心三者一体不二」。本文「暖身二法」即五科中调身+调息的实操展开。\n◆ 驻佇心观(停心工程): 《华严禅行法—禅观》第四集:「你要能够停下心来,然后我们要观心!停心是一个前行。」本文「不能用大脑」即停心基本操作。\n◆ 华严初祖·杜顺《法界观门》真空观·泯绝无寄(CBETA T45n1884):「不可言即色不即色,亦不可言即空不即空,一切法皆不可,不可亦不可,此语亦不受。迥绝无寄,非言所及,非解所到。」此即「不能用大脑」的华严宗源头——「生心动念,即乖法体、失正念故。」\n◆ 华严四祖·澄观: 「心心无住,念念无着。」与本文「不用大脑,用身体感知」归趣一致。\n◆ 参禅金三角: fjdh.cn(2013.12)「置心一处·放轻松·息入息出很清楚」。\n", "r1_source": "禅观法要→调身调息调心·驻佇心观 · T45n1884 法界观门", "r2_other": "◆ 天台·智者大师《小止观》调和第四(CBETA T46n1915): 「行者修习,善调五事,必使和适,则三昧易生。」调身——「不宽不急,是身调相。」调息——息有四相(风喘气息),「守风则散,守喘则结,守气则劳,守息即定。不涩不滑,是调息相。」调心——治沉浮宽急,「不沉不浮,是心调相。」身息心三事「的无前后,随不调者而调适之。」与本文调身调息调心体系完全互证。\n◆ 禅宗·《六祖坛经》坐禅品(CBETA T48n2008): 「外于一切善恶境界,心念不起,名为坐;内见自性不动,名为禅。」「外离相为禅,内不乱为定。」坛经之禅定不在形躯而在心性——但惠能同时批判「空心静坐,百物不思」的枯禅(与本文「不能用大脑」非弃绝思维而是转向身体感知,有对应之妙)。\n◆ 道家·庄子心斋: 《庄子·人间世》:「若一志,无听之以耳而听之以心,无听之以心而听之以气。听止于耳,心止于符。气也者,虚而待物者也。唯道集虚。虚者,心斋也。」「听之以气」即甩开意识思维,归于气息感知——与本文「不能用大脑,用身体感知」异曲同工。郭象注:「遗耳目,去心意,而付气性之自得。」\n◆ 道家·列子·心凝形释: 《列子·黄帝》:「心凝形释,骨肉都融,不觉形之所倚,足之所履。」与停心后身心消融的状态相通。\n◆ 儒家·《大学》知止: 「知止而后有定,定而后能静,静而后能安。」知止即大脑停歇——与「不能用大脑」的先秦儒学源头遥相呼应。\n◆ 瑜伽·Pratyahara(制感): Patanjali《瑜伽经》2.54-55: 感官从外境收摄向内,如心之本形——对应本文从「大脑外驰」转向「身体内觉」。\n", "r2_source": "CBETA T46n1915 · T48n2008 ·《老子》《庄子》《列子》《大学》·《瑜伽经》2.54"}, "四段呼吸": {"r1_huayan": "◆ 安那般那数息观(数·随·止): 禅观法要·技术面详解。数法1→10循环;随法注意「息入尽」与「息出尽」每一细节。本文「四段呼吸——息入·息住·息出·息停」对应随法对呼吸全过程的精细觉知。\n◆ 华严三祖·法藏《妄尽还源观》(CBETA T45n1876): 第二门「依体起二用」中,海印三昧心如大海澄净万象影现——此澄净之用,以息之细密调柔为入门方便。法藏云:「言海印者,真如本觉也。妄尽心澄,万象齐现。」调息至「息相」(出入绵绵若存若亡)即是「妄尽心澄」的前行基础。\n◆ 息之四相: 从粗至细——风→喘→气→息,四段呼吸的清晰觉知正是从「气相」趋入「息相」的关键。\n", "r1_source": "禅观法要→安那般那数息观· 调息息之四相 · T45n1876 妄尽还源观", "r2_other": "◆ 天台·《小止观》息之四相(CBETA T46n1915): 「不声不结不粗,出入绵绵,若存若亡,资神安稳,情抱悦豫——此是息相也。守风则散,守喘则结,守气则劳,守息即定。」海云和上息之四相全出于此。\n◆ 南传·安那般那念(MN 118): 十六阶段安般念从「知入息长」到「观灭·观舍」，与四段呼吸有对应的微观觉照结构。\n◆ 道家·《抱朴子》胎息: 「得胎息者,能不以鼻口嘘吸,如在胞胎之中,则道成矣。」即息相「出入绵密若存若亡」之极致。\n◆ 藏传·密勒日巴尊者: 《十万歌集》:「气之出入往来处,即是心之所行处。」「持气之法如灯烛,微风不动光焰 乘", "texts": "《华严经》(六十/八十华严)", "doctrine": "事事无碍法界——一即一切，一切即一。主伴圆融，重重无尽。", "key_concept": "法界缘起·性起·事事无碍·十玄门·六相圆融", "position": "华严为最胜圆教——超越诸教而融摄诸教。"}]}, {"id": "shizong", "title": "十宗 — 以理开宗", "description": "法藏在五教之下，更立十宗，以所宗之理为判摄标准。\n从「我法俱有」到「圆明具德」，层层递进：\n", "schools": [{"false": 1, "name": "我法俱有宗", "doctrine": "犊子部等——执我法俱为实有", "level": "小乘"}, {"false": 2, "name": "法有我无宗", "doctrine": "说一切有部——法有我无", "level": "小乘"}, {"false": 3, "name": "法无去来宗", "doctrine": "大众部——现在有", "过未无": null, "level": "小乘"}, {"false": 4, "name": "现通假实宗", "doctrine": "说假部——现在法有假有实", "level": "小乘"}, {"false": 5, "name": "俗妄真实宗", "doctrine": "说出世部——世俗虚妄", "出世真实": null, "level": "小乘"}, {"false": 6, "name": "诸法但名宗", "doctrine": "一说部——一切诸法唯有假名", "level": "小乘"}, {"false": 7, "name": "一切皆空宗", "doctrine": "大乘始教——般若中观", "一切法空": null, "level": "始教"}, {"false": 8, "name": "真德不空宗", "doctrine": "大乘终教——真如妙有", "如来藏不空": null, "level": "终教"}, {"false": 9, "name": "相想俱绝宗", "doctrine": "顿教——言语道断", "心行处灭": null, "level": "顿教"}, {"false": 10, "name": "圆明具德宗", "doctrine": "圆教——主伴圆融", "重重无尽": null, "level": "圆教"}]}, {"id": "yicheng", "title": "一乘不共别圆 — 海云法师的当代判摄", "classic_ref": "海云继梦法师《华严经》讲记系列 / 大华严寺修行体系", "description": "海云继梦法师在继承法藏五教判的基础上，以「普贤乘」重新诠释华严判教，\n提出「一乘不共别圆」——华严不是「五教中的圆教」，而是超越并融摄一切\n教法的「不共别圆」。不是「第五教」而是「唯一乘」。\n", "key_points": [{"title": "「同教一乘」与「别教一乘」的区分", "body": "法藏《五教章》区分「同教一乘」（法华为代表——会三乘归一乘，开权显实）\n与「别教一乘」（华严为代表——不共三乘，直显佛果境界）。\n海云法师强调：「别教」不是排斥，而是「不共」——华严直显佛陀\n成道时的内证境界，不经过三乘的迂回。\n"}, {"title": "普贤乘 — 从「判教」到「行法」", "body": "海云法师将华严判教从「教相判释」推至「修行实践」——普贤乘。\n普贤乘不只是一个名相，而是一套完整的从初发心到成佛的修行体系：\n资粮道→前行→正行→妙行→究竟。\n智俨「搜玄」→法藏「探玄」→海云「行玄」——三阶段的历史推进。\n"}, {"title": "华严判教与当代文明对话", "body": "华严「事事无碍」不是排他的——在判教框架中，小始终顿圆不是\n互相排斥的「等级」，而是法界中互摄互入的「事事」。\n当代意义：(1) 宗教多元论——各宗教传统在法界中各有位置；\n(2) 科学与佛教——科学知识为「事法界」，华严义理为「理法界」；\n(3) 跨文化伦理——事事无碍为全球化时代的文明对话提供框架。\n"}]}, {"id": "futian", "title": "华严判教与其他宗派判教的比较", "description": "汉传佛教四大判教体系横向对比：", "comparisons": [{"school": "天台宗 (Tiantai)", "founder": "智顗 (538-597)", "system": "五时八教", "five_periods": "华严时·阿含时·方等时·般若时·法华涅槃时", "eight_teachings": "化仪四教(顿/渐/秘密/不定) + 化法四教(藏/通/别/圆)", "relation_to_huayan": "天台以《法华》为纯圆独妙，华严被判为「带别之圆」（犹带别教痕迹）。\n华严则以自身为「别教一乘」，高于法华的「同教一乘」。\n这场「圆教之争」持续千年，至今未有定论。\n"}, {"school": "唯识宗 (Faxiang/Yogācāra)", "founder": "玄奘·窥基", "system": "三时教", "three_periods": "有教(阿含)·空教(般若)·中道教(唯识)", "relation_to_huayan": "法藏判唯识为「大乘始教·相始教」。华严认为唯识的「阿赖耶缘起」\n未及「法界缘起」的圆融。但唯识的「转识成智」与华严的「妄尽心明」\n在实践论上有互补空间。\n"}, {"school": "禅宗 (Chan/Zen)", "founder": "菩提达摩→慧能", "system": "教外别传·不立文字", "relation_to_huayan": "法藏判禅宗为「顿教」。华严五祖宗密同时是禅宗法嗣，\n著《禅源诸诠集都序》融会禅教。海云法师将华严禅观溯源至\n「东山法门」——禅宗实践与华严义理在当代「普贤乘」中合流。\n"}]}], "references": ["法藏《华严一乘教义分齐章》(《华严五教章》) — CBETA T45n1866", "法藏《金师子章》— CBETA T45n1880", "智俨《搜玄记》— CBETA T35n1732", "宗密《禅源诸诠集都序》— CBETA T48n2015", "海云继梦《华严经》讲记系列 — 大华严寺", "陈永革《法藏评传》— 南京大学出版社", "牟宗三《佛性与般若》(1977) — 从哲学角度评判华严天台判教之争"]}};
