 135.6, "z": 6, "label": "空海归国·日本真言宗", "info": "空海804年入唐从慧果受法·806年归国于高野山开创日本真言宗", "region": "mi", "source": "空海《御请来目录》/ 日本佛教史"}, {"y": 67, "lat": 34.7, "lng": 112.4, "z": 5, "label": "白马寺·佛教正式入华", "info": "汉明帝梦金人·遣使西域·迦叶摩腾与竺法兰以白马驮经至洛阳·中国第一座佛寺", "region": "general", "source": "《高僧传》卷一"}, {"y": 148, "lat": 34.7, "lng": 112.4, "z": 5, "label": "安世高·洛阳译经", "info": "安息王子安世高至洛阳·首次系统汉译小乘禅经·汉传译经之始", "region": "general", "source": "《高僧传》卷一"}, {"y": 167, "lat": 34.7, "lng": 112.4, "z": 5, "label": "支娄迦谶·大乘经首译", "info": "月氏僧支谶至洛阳·译《道行般若》《兜沙经》(华严首译)·大乘佛教入华", "region": "general", "source": "《高僧传》卷一"}, {"y": 401, "lat": 34.3, "lng": 108.9, "z": 5, "label": "鸠摩罗什至长安·译经巅峰", "info": "罗什主持中国史上最大译场·八百沙门·译中论/法华/十住经·深刻影响华严天台禅宗", "region": "general", "source": "《出三藏记集》卷十四"}, {"y": 960, "lat": 34.3, "lng": 108.9, "z": 5, "label": "宋代·佛教中国化完成", "info": "宋太祖敕刻《开宝藏》·各宗判教学说成熟·禅净合流·居士佛教兴起", "region": "general", "source": "汤用彤《隋唐佛教史稿》"}, {"y": 1600, "lat": 30.0, "lng": 120.0, "z": 5, "label": "明末四大师·佛教复兴", "info": "紫柏·憨山·莲池·澫益四大师推动晚明佛教全面复兴·禅教律净密融合", "region": "general", "source": "吕澂《中国佛学源流略讲》"}, {"y": 1866, "lat": 34.0, "lng": 109.0, "z": 5, "label": "杨文会·金陵刻经处", "info": "杨文会(杨仁山)创金陵刻经处·近代佛教复兴运动先驱·培养太虚等人才", "region": "general", "source": "中国近代佛教史"}, {"y": 1922, "lat": 32.0, "lng": 118.8, "z": 5, "label": "太虚·人生佛教·武昌佛学院", "info": "太虚创办武昌佛学院·提倡\"人生佛教\"·教理教制教产三大革命·现代佛教教育先驱", "region": "general", "source": "中国近代佛教史"}]}, "huayan_annotations": {"persons": {"person_000a": {"note": "华严宗奉为远祖。据传入龙宫取回《华严经》下本十万偈。造《十住毗婆沙论》注释《十地品》，为华严义学最早论释之一。其「中道空性」思想经华严宗发展为「真空绝相观」。", "level": "direct"}, "person_000b": {"note": "造《十地经论》，首创「六相」名相（总别同异成坏），后被华严宗吸收为「六相圆融」义。其唯识学说经地论师传承，构成华严宗义学前身。", "level": "direct"}, "person_001": {"note": "华严初祖。著《法界观门》开创华严观法体系，「真空观·理事无碍观·周遍含容观」三观为华严宗修行核心框架。传说其以神通示现「帝网无尽观」。", "level": "direct"}, "person_002": {"note": "华严二祖。著《搜玄记》开华严经疏之先河。创「十玄门」义理，系统化华严宗的「一即一切」圆融思想，为法藏集大成奠定基础。", "level": "direct"}, "person_003": {"note": "华严三祖·实际创立者。系统化「五教十宗」判教与「法界缘起」义理。著《华严五教章》《探玄记》《金师子章》。以殿前金师子为武则天说华严，为佛教中国化之典范。", "level": "direct"}, "person_004": {"note": "华严四祖·集大成者。著《华严经疏》六十卷、《演义钞》九十卷。历七帝之师，德宗赐号「清凉」。融会禅教诸宗入华严体系。", "level": "direct"}, "person_005": {"note": "华严五祖·禅教融合者。著《禅源诸诠集都序》融会禅宗与华严。其《原人论》以华严圆教判摄儒道释三家，为跨传统对话的先驱。", "level": "direct"}, "person_006": {"note": "六十华严译者。首次将华严经完整译为汉文（七处八会三十四品），为华严思想传入汉地之始。与鸠摩罗什在禅法上有分歧而南下。", "level": "direct"}, "person_007": {"note": "八十华严译者。于阗人。其译本（七处九会三十九品）为后世华严宗的根本经典依据。法藏曾参与其译场证义，译经与创宗同步进行。", "level": "direct"}, "person_009": {"note": "唐代华严居士学者。以《易经》融会华严，方法独特。著《新华严经论》四十卷，其「东方智慧」路线与法藏「西方梵文」路线形成华严中国化的双轨。", "level": "direct"}, "person_010": {"note": "高丽王子。入宋从净源受华严，归国编《义天录》为华严文献学奠基。华严宗经其传入朝鲜半岛，形成海东华严传统。", "level": "direct"}, "person_011": {"note": "宋代华严中兴之祖。住杭州慧因寺，传法义天。义天归国后送金书华严经供养，慧因寺世称「华严第一道场」。", "level": "direct"}, "person_042": {"note": "当代华严传承者。2008年三脉汇一（临济+华严+大乘瑜伽）。提出「普贤乘华严宗」新定位，复兴失传八百年的「东山法门」。将华严修行重构为可操作的「工程面/技术面」双轨体系。", "level": "direct"}, "person_101": {"note": "古印度大乘论师。传统著录为《大乘起信论》作者。该论「一心二门三大四信五门」之说为华严宗判教与心性论提供了核心理论资源。法藏著《大乘起信论义记》为最权威注释之一。", "level": "direct"}, "person_102": {"note": "瑜伽行派创始人。其唯识学说经世亲《十地经论》传入汉地，深刻影响地论学派。华严宗「法界缘起」思想与瑜伽行派「唯识无境」有深层义学对话——华严以「性起」对瑜伽之「缘起」。", "level": "indirect"}, "person_103": {"note": "四大译师之首。译《十住经》（十地品别译）、《十住毗婆沙论》为华严学在汉地的传播提供了关键文本基础。其「中观空性」精义经华严宗发展为「真空妙有」之中道观。", "level": "indirect"}, "person_104": {"note": "译《十地经论》十二卷，直接催生了南北朝地论学派。地论师南道派（慧光系）经数代传承至智俨、法藏，构成华严宗义学之远源。", "level": "indirect"}, "person_105": {"note": "华严经中「佛佛相续无尽法界缘起」之始。据《如来名号品》，十方三世无尽诸佛构成华严宗「法界缘起」之佛佛相望网络。", "level": "direct"}, "person_107": {"note": "华严经根本教主。法身遍一切处。华严宗「法界缘起」「一即一切」等核心教义皆围绕毗卢遮那佛法身展开——非历史人物，为华严教义之法身源头。", "level": "direct"}, "person_100": {"note": "华严宗传统认为《华严经》为释迦成道后最初三七日于菩提树下为法身大士所说。此说虽非历史批判学的结论，但构成了华严宗「华严为顿教圆教」之判教基础。", "level": "direct"}, "person_060": {"note": "新罗学僧。与义湘同代。其《起信论疏》与法藏《起信论义记》并称东亚起信论三大疏。海东华严传统的重要先驱。", "level": "indirect"}, "person_061": {"note": "海东华严初祖。入唐从智俨学华严，与法藏同学。归国创浮石寺。其《华严一乘法界图》以诗偈图式浓缩华严法界观——为华严义学的东亚传播之关键人物。", "level": "direct"}, "person_070": {"note": "法藏上首弟子。改五教为四教、以十门代十玄，被澄观系统批判。慧苑的「异解」是推动澄观重新集大成的关键动力——在思想史上「错误」往往比「正确」更能激发体系完善。", "level": "direct"}, "person_080": {"note": "清代华严集大成者。著《贤首五教仪》系统整理法藏判教，编《华严宗佛祖传》梳理传承谱系。为华严宗在清代的中兴之祖。", "level": "direct"}, "person_090": {"note": "北魏地论师南道派始祖。从勒那摩提学《十地经论》，世称「光统律师」。其学说经数代传承至智俨、法藏，是为华严宗义学之远源。", "level": "indirect"}, "person_110": {"note": "西行求法先驱。399年以65岁高龄从长安出发至印度，历时14年。其《佛国记》记录的印度佛教圣迹为后世理解华严经中的地理描述提供了实地参照。", "level": "indirect"}, "person_111": {"note": "大翻译家·法相宗创始人。其译《大般若经》六百卷与华严经同属大乘圆教体系。华严宗与法相宗在判教上有深层对话——华严以「性起」对法相之「缘起阿赖耶」。", "level": "dialogue"}, "person_112": {"note": "海上求法僧。其翻译偏重律藏。《南海寄归内法传》记录7世纪印度佛教实践，与华严经中的修行体系有互补参考价值。", "level": "indirect"}, "person_140": {"note": "19世纪印度神秘主义者。主张「各宗教皆为通向同一真理的路径」。与华严宗「事事无碍法界」在宗教多元主义的哲学基础上形成跨文化对话——华严以「一即一切」破宗派之执。", "level": "dialogue"}, "person_142": {"note": "印度整体瑜伽创立者。其「超心智演化」哲学——物质向精神的进化——与华严「法界缘起」中一切法相即相入的动态世界观有深层对话空间：二者皆否定终极的二元分离。", "level": "dialogue"}, "person_143": {"note": "印度不二论大师。其「Who am I?」参问法门直证自性。与华严宗「能所双泯」「真如实观」在修行论上有可比拟处——皆以消解自我虚妄为入道之门。", "level": "parallel"}, "person_150": {"note": "那烂陀寺中观大师。著《入菩萨行论》。其「自他交换」菩提心修法与华严《普贤行愿品》「代众生苦」的菩萨行思想互相参照——不同传统在利他精神上的殊途同归。", "level": "parallel"}, "person_152": {"note": "藏传格鲁派创始人。其《菩提道次第广论》以三士道次第接引凡夫。与华严宗五教判教（小始终顿圆）在修行阶段论上有结构性的对比研究价值——皆以渐次引归圆顿。", "level": "dialogue"}, "person_134": {"note": "印度国师·大乘瑜伽行法传承者。2008年于阿弥塔巴市传大乘瑜伽行法灌顶予海云继梦。此传法事件标志着印度古典瑜伽行法与汉传华严宗在当代的汇流——「三脉汇一」之瑜伽行支。", "level": "direct"}, "person_daoan": {"note": "中国佛教奠基人。首创僧团统一「释」姓、编定经录、确立戒律。其弥勒净土信仰与华严毗卢遮那净土在「法身佛」信仰上有结构呼应。道安的经典整理工作为后来华严经的翻译与研究奠定了制度基础。", "level": "indirect"}, "person_huiyuan": {"note": "净土宗初祖。庐山白莲社念佛结社开中国净土宗先河。其《沙门不敬王者论》的宗教独立立场与华严宗「事事无碍」的入世圆融构成中国佛教「出世」与「即世」的经典张力。庐山与终南山(华严发源地)隔江相望——净土与华严的地理对话。", "level": "dialogue"}, "person_sengzhao": {"note": "鸠摩罗什高足·解空第一。著《肇论》以中观空性融会老庄语言——「般若无知论」「物不迁论」。其「真空」思想经华严宗发展为「真空绝相观」(杜顺法界三观之第一观)，为中观空性向华严法界观的义理过渡之关键。", "level": "indirect"}, "person_daoxuan": {"note": "南山律宗创始人。著《续高僧传》为研究华严祖师(杜顺、智俨、法藏)最重要的原始文献。《四分律删繁补阙行事钞》的戒律体系与华严菩萨戒(梵网经)在「以戒摄教」上有互补。终南山净业寺与至相寺(华严祖庭)同在终南山——律宗与华严宗的地理共生。", "level": "indirect"}, "person_hongren": {"note": "禅宗五祖。创「东山法门」以《楞伽经》印心。海云继梦复兴「东山法门」之名，将华严禅观溯源至道信-弘忍-慧能一系——以此建立「华严禅」与「东山法门」的谱系连续性，为华严宗在当代的「禅观化」提供历史合法性。", "level": "indirect"}, "person_linji": {"note": "临济宗创始人。「无位真人」「随处作主」的峻烈禅风与华严「事事无碍」在日常行为中的自由落实形成深度对话——临济的「立处即真」与华严的「当相即道」在超越二元对立的实践哲学上殊途同归。", "level": "dialogue"}, "person_yongming": {"note": "禅净双修倡导者。著《宗镜录》百卷以「一心」统摄诸宗，与华严「一心法界」的圆融旨趣深层相通。其「四料简」(有禅有净土/无禅无净土)确立净土在末法时代的修行地位——华严宗后世亦吸收此融合理路。", "level": "parallel"}, "person_hanshan": {"note": "明末四大高僧。刺血书《华严经》于五台山。其《楞严经通议》大量引用澄观《华严经疏》。憨山中兴曹溪南华寺(六祖道场)，体现明末「禅教融合」中华严义学对禅宗的渗透。", "level": "indirect"}, "person_gehong": {"note": "丹鼎派集大成者。著《抱朴子》内外篇，内篇言丹道、外篇言儒术。「玄者自然之始祖」的宇宙论与华严「法界缘起」在「终极实在」的描述上有跨传统对话——葛洪以「玄」为万物本根，华严以「法界」为万法之源。", "level": "dialogue"}, "person_chengtuan": {"note": "希夷先生·睡仙。著《无极图》授周敦颐，间接催生了理学宇宙论。周敦颐《太极图说》的「无极而太极」与华严「法界缘起」的「真空生妙有」在宇宙生成模式上有结构相似性——道教内丹、儒家理学、华严佛学在北宋形成思想三角。", "level": "dialogue"}, "person_qiuchuji": {"note": "全真龙门派创始人。万里西行见成吉思汗「一言止杀」——宗教智慧介入世俗权力的经典案例。与华严祖师法藏为武则天说法(金师子章)、澄观为七帝之师相呼应：皆在最高权力面前以智慧转化暴力。", "level": "parallel"}, "person_guangyu": {"note": "清学开山·亭林先生。著《日知录》以考证方法重建经学。「天下兴亡匹夫有责」的担当精神与华严「即世间而证法界」的入世取向在实践哲学上有对话空间——顾炎武以「经世致用」回应时代危机，华严以「事事无碍」圆融世间与出世。", "level": "dialogue"}, "person_anshigao": {"note": "汉译佛经第一人。译《安般守意经》为中国禅学之始。其「安般守意」数息法与华严禅观「数随止」三法中的「数法」在技术上有直接的渊源关系——中国佛教禅观从安世高到杜顺的千年传承脉络。", "level": "indirect"}, "person_shenxiu": {"note": "北宗禅创始人。武后迎为国师。「身是菩提树，心如明镜台」的渐修路线与华严宗「五教止观」的渐进体系在方法论上有可比拟处——皆以渐修次第为入道之门。神秀的「观心」与华严「驻佇心观」在技术面上亦有对应。", "level": "parallel"}, "person_zhuhong": {"note": "明末四大高僧·净土宗八祖。著《竹窗随笔》倡禅净融合。其云栖道场的念佛结社模式与华严宗的「普贤行愿」在日常实践中的落实形成对比——净土以「念佛」为行门，华严以「普贤行」为行门。", "level": "parallel"}, "person_ouyi": {"note": "明末四大高僧。著《阅藏知津》为佛教目录学经典，《周易禅解》以禅解易——与李通玄以易解华严形成有趣的「方向相反」：李通玄以易入佛，蕅益以佛解易。二者皆体现中国佛教与儒家经典的双向诠释传统。", "level": "dialogue"}, "person_zhangsanfeng": {"note": "太极拳祖师。创内家拳以「松柔克刚」「以静制动」为要。太极拳的「松」与华严禅观的「舍识用根」在身心转化的技术面上有可比拟处——皆以放松身心为入门。武当山与禅宗少林并称——道教内丹与佛教禅观在身体技术上的并行发展。", "level": "dialogue"}, "person_ludongbin": {"note": "八仙之首·纯阳真人。「黄粱一梦」典故出自其与钟离权的相遇——以梦境破执著。与华严「事事无碍」中破「法执」的修行逻辑有可比拟处：皆以超越对现象世界的执著为入道之门。", "level": "parallel"}, "person_huangzongxi": {"note": "梨洲先生·启蒙思想家。著《明夷待访录》批判君主专制，《明儒学案》为中国第一部学术史。其「天下为主君为客」的民主思想与华严「一即一切」的平等观在政治哲学上有跨传统对话——华严以「法界平等」破一切等级之执。", "level": "dialogue"}, "person_wangfuzhi": {"note": "船山先生·唯物主义先驱。「六经责我开生面」的学术担当与华严「事事无碍」在方法论上有可比拟处——皆以动态的、整体的视角把握实在。王夫之「气一元论」与华严「法界缘起」在万物一体观上有结构对应。", "level": "dialogue"}, "person_simaqian": {"note": "太史公·《史记》作者。其「究天人之际通古今之变」的历史哲学与华严「法界缘起」的时间观——过去现在未来三世贯通——在历史意识上有跨传统对话：司马迁以史为鉴，华严以「一念摄无尽劫」超越线性时间。", "level": "dialogue"}, "person_j06": {"note": "日本华严中兴之祖·高山寺开山。著《摧邪轮》批判净土宗法然，复兴东大寺华严教学。明惠的「华严复兴」与宋代净源的「华严中兴」在东亚华严史上形成隔海呼应——十二三世纪华严宗在日本和中国的同步再生。", "level": "direct"}, "person_124": {"note": "日本真言宗开祖·弘法大师。入唐从慧果受密法，归国后于高野山创真言宗。著《十住心论》以华严判教框架判摄显密诸宗——将华严宗「五教十宗」与密宗「十住心」结合，为东亚佛教判教思想的创造性融合。", "level": "direct"}}, "events": [{"year": -563, "note": "释迦诞生。华严宗传统将华严经的教说定位在佛陀成道后的「最初三七日」，以此确立华严为「顿教」——佛陀最初直说的圆满大法。"}, {"year": -528, "note": "释迦成道。华严宗的「法界缘起」义理即从此觉悟的核心体验出发——佛陀在一念中顿见法界实相。"}, {"year": 167, "note": "支娄迦谶译《兜沙经》。这是《华严经》最早被翻译为汉文的单行经（对应《如来名号品》），标志着华严思想的汉传起点。"}, {"year": 344, "note": "鸠摩罗什诞生。其《十住经》译本为华严宗核心品目《十地品》在汉地的首次系统引入。"}, {"year": 401, "note": "鸠摩罗什抵长安。逍遥园译场开启中国历史上规模最大的佛经翻译工程，为华严学在中国的传播奠定了术语和义理基础。"}, {"year": 420, "note": "佛驮跋陀罗译出《六十华严》，华严经首次以完整形态进入汉文世界。"}, {"year": 508, "note": "菩提流支译《十地经论》，南北朝地论学派兴起——这是华严宗义学最重要的远源。"}, {"year": 557, "note": "杜顺诞生。一位开创性的禅僧，将华严经的义理转化为可操作的观法体系——华严宗由此从「经典注释」走向「修行宗派」。"}, {"year": 643, "note": "法藏诞生。华严宗将在他的手中完成从学派到宗派的飞跃——「贤首国师」的判教体系至今仍为华严教义的权威框架。"}, {"year": 699, "note": "实叉难陀译出《八十华严》（七处九会），华严宗的根本经典定型。法藏参与译场证义——译经与创宗同步进行。"}, {"year": 780, "note": "宗密诞生。其「禅教融合」的思想路线将深远影响后世华严宗的走向——华严从此不再是纯粹义学，而有了禅观的实践维度。"}, {"year": 1055, "note": "义天诞生。这位高丽王子将把华严宗带向朝鲜半岛——华严宗从此成为东亚佛教的共同遗产。"}, {"year": 1085, "note": "义天入宋求法于杭州慧因寺，华严宗传入朝鲜半岛。此事件标志着华严思想从「中国宗派」向「东亚传统」的转型。"}, {"year": 1858, "note": "月霞诞生。清末民初的华严复兴将由此人开启——华严大学的创立为现代华严学术研究奠定了基础。"}, {"year": 1914, "note": "月霞于常熟兴福寺创立华严大学，中国近代第一所华严专宗教育机构——「宗学」传统向现代「学术」的转型。"}, {"year": 1952, "note": "华严莲社在台北创立——华严宗在台湾落地生根，开启了海外弘传的新篇章。"}, {"year": 2008, "note": "海云继梦三脉汇流：受钦因传华严衣钵（贤首42世）+ 受胜师子王菩萨传瑜伽行法——华严宗在当代的「三脉汇一」标志着古典传统的新一轮创造性整合。"}, {"year": 2026, "note": "「九九华严」讲座 + 支提山大华严寺动土——华严宗在AI时代的自我更新与空间落地。"}]}, "key_events": {"events": [{"y": -1500, "l": "吠陀文明兴起·梨俱吠陀结集", "c": "#b0a898", "tp": "远源"}, {"y": -800, "l": "奥义书时代·梵我哲学形成", "c": "#b0a898", "tp": "远源"}, {"y": -500, "l": "沙门思潮·六师外道·思想百花齐放", "c": "#b0a898", "tp": "远源"}, {"y": -483, "l": "释迦入灭·佛教创立", "c": "#9e8b6e", "p": "释迦牟尼", "tp": "宗教"}, {"y": 80, "l": "马鸣造大乘起信论", "c": "#9e8b6e", "p": "马鸣", "tp": "义学"}, {"y": 167, "l": "支谶译兜沙经(最早华严)", "c": "#a09080", "p": "支娄迦谶", "tp": "翻译"}, {"y": 401, "l": "鸠摩罗什至长安·译十住经", "c": "#a09080", "p": "鸠摩罗什", "tp": "翻译"}, {"y": 420, "l": "六十华严译出(建康)", "c": "#b8863c", "p": "佛驮跋陀罗", "tp": "翻译"}, {"y": 508, "l": "十地经论译出·地论学派兴起", "c": "#5e8b9e", "p": "菩提流支", "tp": "义学"}, {"y": 550, "l": "地论师南北分派·相州南道/北道", "c": "#5e8b9e", "tp": "义学"}, {"y": 557, "l": "杜顺创华严宗·法界观门", "c": "#b8863c", "p": "杜顺", "tp": "禅观"}, {"y": 699, "l": "八十华严译出·法藏证义", "c": "#b8863c", "p": "法藏", "tp": "翻译"}, {"y": 712, "l": "法藏圆寂·贤首教学确立", "c": "#b8863c", "p": "法藏", "tp": "义学"}, {"y": 798, "l": "四十华严译出(入法界品全)", "c": "#b8863c", "p": "般若", "tp": "翻译"}, {"y": 800, "l": "胜友/智军藏译华严(于阗本)", "c": "#c46b5d", "tp": "翻译"}, {"y": 645, "l": "玄奘归国·唯识宗兴起", "c": "#8b7a9e", "tp": "宗派"}, {"y": 713, "l": "慧能入灭·南宗禅兴起", "c": "#8b7a9e", "tp": "宗派"}, {"y": 738, "l": "澄观出生·历学八宗", "c": "#b8863c", "p": "澄观", "tp": "义学"}, {"y": 780, "l": "宗密融合禅教·禅源诸诠", "c": "#7d9a6e", "p": "宗密", "tp": "禅观"}, {"y": 841, "l": "宗密圆寂·华严宗盛极而衰", "c": "#b8863c", "p": "宗密", "tp": "义学"}, {"y": 845, "l": "唐武宗灭佛·华严典籍大量焚毁", "c": "#c46b5d", "tp": "法难"}, {"y": 960, "l": "宋统一·佛教义学复兴", "c": "#c8893e", "tp": "文化"}, {"y": 973, "l": "均如统一高丽华严南北宗", "c": "#6d9a6e", "p": "均如", "tp": "义学"}, {"y": 1011, "l": "净源中兴·慧因寺华严道场", "c": "#b8863c", "p": "净源", "tp": "义学"}, {"y": 1038, "l": "子璿兼弘贤首天台·起信论疏", "c": "#c8893e", "p": "子璿", "tp": "宗派"}, {"y": 1085, "l": "义天入宋求法·华严东传高丽", "c": "#6d9a6e", "p": "义天", "tp": "文化"}, {"y": 1271, "l": "元朝建立·藏传佛教入汉·八思巴帝师", "c": "#8b7a9e", 罗举行第四次结集。佛法由印度深入中亚,犍陀罗成为佛教东传的枢纽站。", "src": "佛教史·贵霜时期"}, {"y": 80, "p": "马鸣", "lat": 27.5, "lng": 77.7, "ev": "马鸣菩萨造《大乘起信论》。该论「一心二门」之说后成为华严宗心性论与判教体系的重要理论基础。", "src": "传统著录"}, {"y": 167, "p": "支娄迦谶", "lat": 34.7, "lng": 112.4, "ev": "月氏僧支谶来华至洛阳,译《佛说兜沙经》。此为华严经文最早汉译,仅1卷,对应《如来名号品》。", "src": "《高僧传》卷一"}, {"y": 320, "p": "无著·世亲", "lat": 25.1, "lng": 85.4, "ev": "无著、世亲兄弟于那烂陀弘传瑜伽行派。世亲造《十地经论》,后经菩提流支汉译催生地论学派。", "src": "《大唐西域记》卷九"}, {"y": 344, "p": "鸠摩罗什", "lat": 41.7, "lng": 82.9, "ev": "罗什生于龟兹。401年至长安,主持史上最大译场。译《十住经》(十地品别译)、《十住毗婆沙论》等,为华严学提供关键文本基础。", "src": "《高僧传》卷二"}, {"y": 359, "p": "佛驮跋陀罗", "lat": 34.0, "lng": 72.0, "ev": "觉贤生于北天竺迦毗罗卫。后至建康译出《六十华严》34品。此为《华严经》首次汉译全本。", "src": "《高僧传》卷二"}, {"y": 401, "p": "鸠摩罗什", "lat": 34.3, "lng": 108.9, "ev": "罗什至长安逍遥园。主持中国史上最大译场,八百沙门参与。译出《十住经》《中论》《法华经》等,深刻影响华严义学。", "src": "《出三藏记集》卷十四"}, {"y": 420, "p": "佛驮跋陀罗", "lat": 32.1, "lng": 118.8, "ev": "六十华严译出于建康道场寺。七处八会三十四品。法业等百余人参与笔受。华严经首次以全貌呈现于汉地。", "src": "《出三藏记集》卷九"}, {"y": 468, "p": "慧光", "lat": 34.7, "lng": 112.4, "ev": "慧光生于北魏。从勒那摩提学《十地经论》,开地论南道派。后被尊为四分律宗初祖。其学经数代传至智俨、法藏,是为华严宗义学之前身。", "src": "《续高僧传》卷二十一"}, {"y": 508, "p": "菩提流支", "lat": 34.7, "lng": 112.4, "ev": "北印度僧菩提流支至洛阳,与勒那摩提译世亲《十地经论》十二卷。此论催生了南北朝最重要的义学流派——地论学派。", "src": "《续高僧传》卷一"}, {"y": 557, "p": "杜顺", "lat": 33.9, "lng": 109.0, "ev": "杜顺于终南山开创华严宗。著《华严法界观门》《五教止观》。以「法界三观」和「五教止观」为华严宗奠定修行理论基础。", "src": "《续高僧传》卷二十五"}, {"y": 643, "p": "法藏", "lat": 34.3, "lng": 108.9, "ev": "法藏生于长安。从智俨学华严。后系统化「五教十宗」判教,著《华严五教章》等。武则天赐号「贤首」。参与八十华严译场证义。华严宗至此正式确立。", "src": "《宋高僧传》卷五"}, {"y": 652, "p": "实叉难陀", "lat": 37.1, "lng": 79.9, "ev": "实叉难陀生于于阗。后奉武则天诏来华译经。于阗在中亚佛教网络中地位关键——既是实叉难陀故乡,又是藏译华严底本来源。", "src": "《宋高僧传》卷二"}, {"y": 699, "p": "实叉难陀·法藏", "lat": 34.7, "lng": 112.4, "ev": "八十华严译出于洛阳佛授记寺。法藏参与证义。七处九会三十九品,为后世流传最广的汉译本。", "src": "《宋高僧传》卷二"}, {"y": 780, "p": "宗密", "lat": 34.0, "lng": 108.7, "ev": "宗密住终南山圭峰。融合禅宗(荷泽系)与华严,著《禅源诸诠集都序》。华严与禅宗的深度融合,奠定了「教禅一致」的思想基础。", "src": "《宋高僧传》卷六"}, {"y": 800, "p": "胜友·智军", "lat": 29.7, "lng": 91.1, "ev": "胜友、智军等于吐蕃将《华严经》由于阗本译为藏文(Toh44 E6%B3%95%E5%B8%88+%E5%8D%8E%E4%B8%A5%E5%AD%97%E6%AF%8D"}, {"resource": "佛光山梵呗团·官方字幕MV", "source": "YouTube", "link": "https://www.youtube.com/results?search_query=%E4%BD%9B%E5%85%89%E5%B1%B1+%E8%8F%AF%E5%9A%B4%E5%AD%97%E6%AF%8D"}, {"resource": "天宁寺法师·梵呗唱诵", "source": "YouTube", "link": "https://www.youtube.com/watch?v=KcQ2yZ-lB8Y"}, {"resource": "南怀瑾·宏忍法师教授华严字母", "source": "B站", "link": "https://search.bilibili.com/all?keyword=%E5%8D%97%E6%80%80%E7%91%BE+%E5%8D%8E%E4%B8%A5%E5%AD%97%E6%AF%8D"}, {"resource": "普陀精舍·华严大法会起梵腔白", "source": "YouTube", "link": "https://www.youtube.com/watch?v=e_RmoPT7gv0"}]}, "heritage_critical": {"heritage_critical": {"title": "批判遗产研究·华严古迹再审视", "intro": "华严宗的寺院、石窟、写经、造像——这些「华严古迹」不仅是佛教艺术遗产，\n更是批判遗产研究(Critical Heritage Studies)的丰富案例。\n批判遗产研究由 Laurajane Smith 等学者开创，其核心洞见是：\n「遗产不是物，而是一种文化实践和意义建构的过程」。\n华严古迹的「意义」并非固定不变——它在不同时代、不同群体中被\n不断地重新生产、挪用和争辩。\n", "topics": [{"title": "Authorised Heritage Discourse (AHD) — 谁的遗产？", "body": "Laurajane Smith 在《Uses of Heritage》(2006)中提出「权威遗产话语」(AHD)的概念——\n国家、学术机构和国际组织（如UNESCO）自上而下地定义什么是「遗产」、\n谁有资格解读遗产，从而边缘化了社区、原住民和普通人的遗产实践。\n华严古迹（如敦煌莫高窟·龙门石窟·大慈恩寺）的「世界遗产」认定过程，\n即是AHD运作的典型案例——\nUNESCO的普世价值叙事与本地社区日常的礼佛实践的差异，\n在华严圣地同样存在。\n", "sources": ["Laurajane Smith, Uses of Heritage (Routledge, 2006)", "Laurajane Smith & Natsuko Akagawa (eds.), Intangible Heritage (Routledge, 2009)"]}, {"title": "遗产作为「情感实践」— 参拜·朝圣·共情", "body": "Smith 近年（2021-2024）将遗产研究引向「情感转向」(Affective Turn)——\n遗产不只是被「认知」的，更是被「感受」的。在华严古迹的脉络中：\n朝圣者的三步一拜、写经者的虔诚抄写、禅修者的石窟静坐——\n这些情感实践(affective practices)才是华严遗产「活着」的方式，\n远非UNESCO的「突出的普遍价值」(OUV)所能穷尽。\n华严「事事无碍」的宇宙观暗示：物（遗址）与心（朝圣者的情感）\n不是分离的——一尘中含法界，一拜中即现华藏。\n", "sources": ["Laurajane Smith, Emotional Heritage (Routledge, 2021)", "Laurajane Smith, 'Affective Heritage Revisited' (Musée du quai Branly, 2024)"]}, {"title": "非物质文化遗产(ICH)与华严修行传统", "body": "UNESCO 2003年《保护非物质文化遗产公约》将「口头传统、表演艺术、\n社会实践、仪式节庆、传统手工艺」纳入保护范围——\n但批判遗产学者指出：ICH的「清单化」本身即是对活态传统的固化。\n华严修行传统——禅观法门的师徒口传、梵呗四十二字母的唱诵、\n华严法会的仪轨——本质上是活态的「非物质文化遗产」，\n但它不应被「博物馆化」为一份UNESCO清单上的条目。\n海云继梦法师「工程面/技术面」的双轨教学，正是对这一活态传承\n的当代实践——它不是「保护过去的遗产」，而是「创造未来的传统」。\n", "sources": ["UNESCO, Convention for the Safeguarding of the Intangible Cultural Heritage (2003)", "Laurajane Smith & Natsuko Akagawa (eds.), Safeguarding Intangible Heritage (Routledge, 2019)"]}, {"title": "原住民遗产与去殖民化——华严古迹的批判视角", "body": "批判遗产研究近年聚焦「去殖民化博物馆与遗产」(Decolonizing Museums and Heritage)：\n从原住民祖灵遗骸的归还(repatriation)，到「困难遗产」(difficult heritage)的\n面对，再到社区主导的遗产认定。华严古迹在此视角下产生新的问题意识：\n• 敦煌藏经洞文献被斯坦因、伯希和带往西方——这是「文化遗产的保护」\n  还是「文化掠夺」？\n• 龙门石窟宾阳中洞《帝后礼佛图》被凿碎运往美国——谁有权利拥有\n  和展示这些遗物？\n• 华严寺院的当代重建（如苗栗支提山大华严寺）如何在地化地\n  承载原住民/在地社区的历史与记忆？\n去殖民化不是抹去华严遗产的佛教属性，而是承认遗产的所有权、\n解读权和受益权应归还给与这些遗产血脉相连的社区。\n", "sources": ["Laurajane Smith et al., 'Heritage, Reconciliation and Peacebuilding in Australia and New Zealand' (2023)", "C. Fforde, L. Smith et al., 'Emotion, Affective Practice, and the Taking of Indigenous Ancestral Remains'"]}], "references": ["Laurajane Smith, Uses of Heritage (Routledge, 2006). ISBN 978-0415318310", "Laurajane Smith, Emotional Heritage: Visitor Engagement at Museums and Heritage Sites (Routledge, 2021). ISBN 978-1138888678", "Laurajane Smith & Natsuko Akagawa (eds.), Intangible Heritage (Routledge, 2009)", "Laurajane Smith & Natsuko Akagawa (eds.), Safeguarding Intangible Heritage (Routledge, 2019)", "Laurajane Smith et al. (eds.), The Routledge International Handbook of Heritage and Politics (2024). ISBN 978-1032601618", "UNESCO, Convention for the Safeguarding of the Intangible Cultural Heritage (2003)", "UNESCO, Convention Concerning the Protection of the World Cultural and Natural Heritage (1972)"]}, "environmental_history": {"title": "环境史视角·华严与自然", "intro": "环境史(Environmental History)研究人类社会与自然环境之间\n在时间中的互动关系。从 Alfred Crosby 的「哥伦布大交换」\n到 William Cronon 的「土地变迁」，环境史揭示了一个核心事实：\n人类文明不是在「自然」之外创造出来的——每一座寺院、每一卷写经、\n每一条朝圣之路，都与特定的生态系统、气候、资源流动息息相关。\n", "topics": [{"title": "华严寺院的环境足迹——生态史视角", "body": "终南山至相寺（华严宗发祥地）——唐代「终南隐逸」文化\n以山中寺院为核心形成了完整的人-自然共生系统：泉水利用、\n森林管理、药材采集、野生动物保护。寺院不是「侵入」山林，\n而是嵌入山林生态系统的人类灵性节点。\n这与 William Cronon 在《Changes in the Land》(1983)中的核心论点\n一致：不同文化对同一片土地的使用方式（新英格兰殖民者 vs\n原住民），反映了根本不同的「人与自然」世界观。\n", "sources": ["William Cronon, Changes in the Land: Indians, Colonists, and the Ecology of New England (Hill and Wang, 1983). ISBN 978-0809016341", "伊懋可(Mark Elvin), The Retreat of the Elephants: An Environmental History of China (Yale, 2004). ISBN 978-0300119930"]}, {"title": "丝绸之路上的寺院——生态殖民还是生态互惠？", "body": "Alfred Crosby 在《Ecological Imperialism》(1986)中论证：\n欧洲殖民扩张的成功，不仅靠枪炮，更靠随殖民者带入新大陆的\n生物群系（小麦、牛马、病菌）。佛教沿丝绸之路的东传是否也有\n「生态维度」？——伴随译经僧侣而来的，不仅是梵文贝叶经，\n还有印度医学、波斯天文学、中亚植物品种。但佛教的传播模式\n不同于殖民征服——它更接近「共生」(symbiosis)而非「取代」。\n华严「事事无碍」的宇宙观恰恰为此提供了一种非竞争性的\n生态智慧——不同文化如同因陀罗网中的宝珠，互照互入而非谁消灭谁。\n", "sources": ["Alfred W. Crosby, Ecological Imperialism: The Biological Expansion of Europe, 900–1900 (Cambridge, 1986/2nd ed. 2004). ISBN 978-0521546188", "John R. McNeill, Something New Under the Sun: An Environmental History of the Twentieth-Century World (Norton, 2000). ISBN 978-0393321838"]}], "references": ["William Cronon, Changes in the Land (Hill and Wang, 1983)", "Alfred W. Crosby, Ecological Imperialism (Cambridge, 1986/2004)", "伊懋可(Mark Elvin), The Retreat of the Elephants: An Environmental History of China (Yale, 2004)", "John R. McNeill, Something New Under the Sun (Norton, 2000)", "J. Donald Hughes, What Is Environmental History? (Polity, 2006/2nd ed. 2016)"]}}};
var PRACTICE_DATA = {"cultivation_system": {"subpage": "修行体系", "wip_notice": {"text": "本页面内容基于大华严寺官网(2025.11版)和海云继梦和上已公开的讲经视频/音频/逐字稿/出版物整理。\n法师讲法内容不断更新演化，当前整理仍不完整，需要大量结构化梳理和补充核实，仅供参考，持续更新中。\n最新修行体系请以大华严寺官网为准。\n", "updated": "2026-08-02"}, "header": {"title": "华严教行 — 普贤乘修行体系", "description": "参考大华严寺海云继梦和上所立 普贤乘华严宗 修行体系。以华严禅法为核心，透过心法工程止住安心、令真心起作用。体系涵盖从资粮道到正行、从初信到法身大士的完整修行次第。\n"}, "three_stages": [{"name": "禅修入门", "subtitle": "发心工程（资粮道）", "detail": "五科：戒·律·调身·调息·调心", "color": "gold", "description": "三门必修: 人格健康+出离心+菩提心。含五科（戒·律·调身·调息·调心）。技术面: 纯化禅(动→静)→象限转移→瞬间定。工程面: 心性培养+戒律基础。官网: 「发心——出三界、入法界之志,建立信根与定位。」\n"}, {"name": "禅修前行", "subtitle": "内摄工程", "detail": "安般守意·四种观法", "color": "blue", "description": "核心: 安那般那数息观(数.随.止)。官网: 「调息安稳,气息有序;守意——令心不外驰,身息心三者逐步协同。」观法次第: 驻佇心观(停心前行)->唯心识观(钝根先修.毗钵舍那)->真如实观(利根直修.奢摩他)->毗婆舍那->奢摩他。详见「📐 禅观法要」子页。\n"}, {"name": "禅修正行", "subtitle": "等持工程（内观）", "detail": "三摩呬多→三摩钵底→三摩地", "color": "red", "description": "前半程三摩呬多→后半程三摩钵底→究竟三摩地。官网: 「以观导定、以定成观,当下验果,不逐境界名相而重身心之柔和、稳定、清明。」课程配比: 70%修行面 + 30%健康面。延伸: 一日禅·二日禅·忍可禅七。\n"}], "four_stages_blueprint": {"description": "据海云法师《四十华严讲记》第四卷第67讲及大华严寺官网「修行蓝图」页面。整套蓝图涵盖从信众到证量的完整阶次。\n", "stages": [{"name": "出离乘", "description": "出离心→出离道→出离行。以脱离轮回、了生死为基础动机，建立「出三界、入法界」之志。\n"}, {"name": "菩提乘", "description": "菩提心→菩提道→菩提行。发心求觉悟。法师称此「只是起步」。\n"}, {"name": "菩萨乘", "description": "菩萨心→菩萨道→菩萨行。法师称此「还没有究竟」——仍属因地修行。\n"}, {"name": "普贤乘", "description": "普贤心→普贤行→普贤道。究竟归趣。法师称「究竟要到普贤乘来」——此即「普贤乘华严宗」名称的义理出处。\n", "is_ultimate": true}]}, "six_subjects": {"description": "海云法师将传统华严义学重组为可依次修学的课程架构。「五大行法」即六科中除总论外的五项——禅、净、律、密、经教——主张华严宗并非纯粹「解门」而有完整「行门」。\n", "subjects": [{"name": "华严学概论", "content": "华严经结构·五教十宗·法界缘起（总纲性导论）"}, {"name": "华严经教行法", "content": "经文解读·修行法门·善财五十三参（经教门）"}, {"name": "华严禅行法", "content": "安般守意·置心一处·三摩地次第（禅门）"}, {"name": "华严戒律观", "content": "菩萨戒·梵网经·现代持戒（律门）"}, {"name": "华严净土法门", "content": "华藏世界·毗卢遮那净土（净门）"}, {"name": "华严密法", "content": "华严字母·曼荼罗·真言持诵·秽迹金刚法（密门）"}]}, "three_lineages": {"description": "海云法师对三条汇流法脉在体系中各自的功能分工（据大华严寺官网及讲记）：\n", "lineages": [{"name": "中观论派", "role": "解", "description": "义理/空性论证——负责「理解」层面的理论基础。\n"}, {"name": "华严思想", "role": "架构", "description": "提供整体的世界观与义理框架——「事事无碍法界」「法界缘起」等核心世界观。\n"}, {"name": "瑜伽行派", "role": "行", "description": "禅观正行/实修技术来源。源自印度 Maha Yoga 传承（胜师子王菩萨），法师将其等同于「禅宗的禅观正行」。\n", "note": "官网将这支传承直接注解为「大乘瑜伽行派／Yogācāra 之行门精义」，读者可留意其中的诠释性跨度。\n"}]}, "four_projects": {"projects": [{"name": "结界工程", "description": "短期共修——调整身心频率的具体操作"}, {"name": "华藏工程", "description": "双重意涵: ①个人前行阶段必修课程（建立语言/思维模式）②跨世代文明教育志业——法师称「华藏工程五百年」\n"}, {"name": "华严大学", "description": "体制化培育弘法与研究人才的当代项目（非月霞法师等创办的历史性华严大学）"}, {"name": "BQ广场", "description": "四大工程之一，目前公开资料中未见「BQ」具体所指的清晰界定"}]}, "cognitive_levels": {"description": "法师自创的认知层次术语，用以区分凡夫、行者、法身大士三个阶段所依靠的不同认知机制：\n", "levels": [{"name": "识性", "stage": "凡夫阶段", "description": "「能」——妄想心。「识性的能绑虚妄的身」——凡夫是「身心混杂」状态。\n"}, {"name": "根性", "stage": "初果至四果阶段", "description": "「所」。此阶段关键操作是「舍识用根」。\n"}, {"name": "智", "stage": "十信位圆满之后", "description": "此后「以智为先导」，不再「以所为先导」。\n", "note": "法师坦承这套区分是借助现代汉语语法结构对古典义理的诠释性翻译，非声称唯一表述。\n"}]}, "three_refuges": {"intro": "海云法师在传统「皈依三宝」之外，提出更具操作性的归依框架：\n", "practice_attitude": "法师强调「自顾灵山，不顾名山」「知道不算，做到才算」——真正的修行来自扎实的日常践行。\n", "items": [{"name": "缘念道场", "description": "缘念僧团，以道场为修行依止处"}, {"name": "缘念善知识", "description": "缘念具体指导的师长，接受僧团制度性指导"}, {"name": "缘念法门", "description": "缘念自己实际修学的具体法门，不杂修不盲从"}]}, "latest_news": [{"year": "2023", "title": "国立台北大学杰出校友", "description": "获遴选为母校杰出校友(2023年)。2024年1月促成华严学会与台北大学签署学术合作协议(一期两年.合计三期共六年),合办「新世纪永续发展」高峰论坛(2024-2025年)。\n"}, {"year": "2026", "title": "「九九华严」五年讲座（TICC）", "description": "于台北国际会议中心举行，每月举办。将华严哲理「转化为通俗易懂的现代心理学与生命科学」语言，回应「AI科技与永续新时代」的挑战——「AI给得了答案，但给得了心安吗？」\n"}, {"year": "2026.7.9", "title": "支提山大华严寺动土", "description": "苗栗县通霄镇。面向台湾海峡，与福建宁德支提华严祖庭隔海相望——「山海相应、法脉相承」。四百余位护法善信参与，五十三位嘉宾共同执铲（呼应善财五十三参）。\n"}, {"year": "ongoing", "title": "第四期佛教", "description": "大华严寺官网对海云法师使命的表述——「以中兴汉传佛教，开展第四期佛教思想发展为使命」。目前尚未见对第一至第三期的系统性论述。\n"}], "evolution_timeline": [{"period": "1981-1991", "node": "在家讲经探索期", "feature": "以现代语言诠释华严·业余讲经·无僧团建制"}, {"period": "1991.12.22", "node": "梦参老和尚剃度(弥陀诞日)", "feature": "临济宗第47代·确立僧团身份·正式出家弘法"}, {"period": "2004-2010", "node": "西安/北京系统弘法", "feature": "陕师大华严研究所·社科院演讲(2005.1)·北京广化寺《四十华严》全本讲解(2006.11-2010.6)"}, {"period": "2008", "node": "三脉汇流", "feature": "钦因传华严衣钵(贤首42世, 9月10日求法.9月21日传法大典)+印度胜师子王菩萨传瑜伽行法(年底)\n提出「普贤乘华严宗」·工程面/技术面双轨教学确立\n"}, {"period": "2011-2013", "node": "密集出版·框架定型", "feature": "华严六科·五大行法·三部曲·禅观体系完整出版"}, {"period": "2014-2019", "node": "讲经扩展·制度细化", "feature": "药师/地藏/各品讲记密集出版·忍可灌顶制度·华严专宗学院"}, {"period": "2020-2023", "node": "数位化转型", "feature": "线上讲经·电子书出版·国立台北大学杰出校友(2023)"}, {"period": "2024-2026", "node": "第四期佛教·AI时代", "feature": "九九华严五年讲座(TICC)·支提山大华严寺动土(2026.7)·台北大学合作"}]}, "meditation_essentials": {"subpage": "禅观法要", "system_overview": {"description": "海云继梦和上华严禅观三阶段: 资粮道(发心工程.驻佇心观) → 前行(界内定.四种观法) → 正行(界外定.法界三观)。技术面(修定.身法)与工程面(修慧.心法)始终双轨并行。\n", "stages_table": {"headers": ["阶段", "定位", "核心工程", "观法", "禅定", "果位"], "rows": [{"stage": "资粮道", "position": "发心工程\n界外准备", "core_engineering": "五科(戒.律.调身.调息.调心)\n驻佇心观(停心)\n净化禅->象限转移\n", "observation": "驻佇心观\n(根本前行)", "meditation": "瞬定境(妙高定)\n粗住->细住->欲界定", "fruition": "三信位前\n(发心位)", "rowspan": 2}, {"stage": "", "position": "", "core_engineering": "", "observation": "", "meditation": "", "fruition": "", "note": "制度入门: 前行三年(教材/听经笔记/华藏工程)->禅师团审核->正授行法。三要件各有三。\n课程配比70%修行面+30%健康面。一日禅.二日禅.忍可禅七。\n"}, {"stage": "前行", "position": "内摄工程\n界内定", "core_engineering": "安那般那数息观\n(数.随.止)\n安般守意\n", "observation": "数法/随法", "meditation": "粗住->细住\n->欲界定->未到定", "fruition": "二信~四信位", "rowspan": 2}, {"stage": "", "position": "", "core_engineering": "", "observation": "止法+四种观法\n(1)唯心识(初-二信)\n(2)真如实(二信+)\n(3)毗婆舍那(中信)\n(4)奢摩他(后信)\n", "meditation": "四天王定->忉利定\n->空居天定->色界定\n->无色界定->出界定", "fruition": "初信~十信位\n初果(初信)->四果(七信)->十信满心\n"}, {"stage": "正行", "position": "等持工程\n界外定", "core_engineering": "三摩呬多->三摩钵底\n->三摩地(海印三昧)\n", "observation": "杜顺法界三观\n(真空绝相.理事无碍.周遍含容)\n", "meditation": "初禅定关口:\n左转->四禅八定(外道)\n右转->四果成就(解脱)\n", "fruition": "十信满心\n->初住至七地(37位)", "rowspan": 2}, {"stage": "", "position": "", "core_engineering": "四次灌顶\n(1)忍可(破无明)\n(2)行者(证初果)\n(3)进阶(能所合一)\n(4)高阶(能所双泯)\n", "observation": "界外定.无功用行", "meditation": "", "fruition": "八地至妙觉(5位)\n共42位圆满"}]}, "source_note": "三阶段架构名称据大华严寺官网「修行蓝图: 华严禅观全程」(2025年11月访问)。观法细节(四种观法/界内定界外定/果位对应等)据海云继梦《四十华严讲记》第67讲(2009.2.26)+《海云继梦禅观概论》(2015)+《迈向佛陀的境界》(2011)。凡官网与讲记表述有异处,以官网为框架、讲记为展开。\n"}, "two_paths": {"description": "海云和上将修行路径分为两条: 次第道(圣解脱道/智德门)与圆融道(普贤道/福德门)。核心差异: 次第道必须证得空性、即身成就; 圆融道不必证空性,凡夫亦可修,具足信根即可,经分段生死至他方净土证无生。法师明确开示:「凡夫行圆融道,就是没有那个充分条件,你没有证得空性。你行圆融道就那么一个条件,要尽形寿行菩萨道,对三宝具足信心。」但凡夫行圆融道须避讳「聚财」与「聚众」,否则在缺乏空性的前提下易入歧途。若避此忌,报尽必生净土。华严禅观三段教学法(前行->正授行法->妙行)中,前两区块属入法界次第道,第三区块「妙行」属已入法界后的圆融道。\n", "comparison_table": {"headers": ["维度", "次第道(入法界次第道)", "圆融道(法界圆融道)"], "rows": [{"dimension": "空性条件", "cidi": "必须证得空性", "yuanrong": "不必证空性,以信根具足替代"}, {"dimension": "生死方式", "cidi": "变易生死,即身成就(依色身)", "yuanrong": "分段生死,即生成就(依法身),经他方净土证无生"}, {"dimension": "实践目标", "cidi": "目的论明显,止观双运.定慧等持", "yuanrong": "无明显目的性,重行法过程,以信愿行为归"}, {"dimension": "核心技术", "cidi": "以「定」为范围,置心一处为归", "yuanrong": "以歌咏赞叹诸佛为归,理事合一地置心一处"}, {"dimension": "工程面", "cidi": "以《大经》(华严经)为归", "yuanrong": "以十大愿王为依归"}, {"dimension": "性质", "cidi": "由凡入圣——清除人性杂质恶质,由粗糙转入精微", "yuanrong": "由圣入圣——法身本具但迷不晓,藉佛号唱颂内引法身"}]}, "three_conditions": {"description": "三大核心条件: (1)对三宝的具足信——信心绝对,毫无折扣,100分 (2)尽形寿奋进于菩萨道——定位明确,一辈子做一件事(事修),从生命尊重与人性关怀出发服务众生 (3)一再的归零功课——每日反复检视自身,遇到挫折压力则拜忏(一百零八拜),将业力寄放在法界。\n", "warning": "凡夫行圆融道的避讳: 必须避讳「聚财」与「聚众」,否则在缺乏空性的前提下易入歧途——善者落人天善道,恶者成魔成精。若避此忌,报尽必生净土。\n", "examples": "法师以德雷莎修女为例: 具足对上帝的绝对信心(信根),一辈子只做「服务最穷的人」这一件事(事修),尽形寿不改——「行一法即行一切法」。梦参老和尚被关33年仍坚守信仰,亦属圆融道行者的典范。\n", "source": "出处: 海云继梦《华严禅观的入法界次第道》(fjdh.cn 2013.9) . 《四十华严讲记》第14讲.第68讲 . https://www.fjdh.cn/wumin/2013/09/175337285861.html\n"}, "ten_vows": {"description": "普贤十大愿王是善财童子五十三参的总结与精要——「《入不思议解脱境界普贤行愿品》中,不思议解脱境界即是法界,而普贤行愿是直接入法界的行法。」海云和上先后五次重要讲解: 1992年台北初讲.2001年5月加拿大湛山精舍(共52讲,分三册出版: 《普贤行愿》2002/《不思议解脱》2003/《大方广境界》2003).2006年台北(《普贤十大愿王行法精要》).2007年槟城+2008年新加坡(合并出版《十大愿王修行法要》)。另有2011年昆明开示系列(fjdh.cn收录)。\n", "hierarchy": {"title": "十大愿王三层次结构", "levels": [{"level": "根本（第1-3愿）", "items": "礼敬诸佛.称赞如来.广修供养", "position": "真正要实修的根本,可各选一门主修"}, {"level": "补充（第4愿）", "items": "忏悔业障", "position": "修前三愿遇挫折时以此补救,具关键性地位"}, {"level": "圆融扩大（第5-7愿）", "items": "随喜功德.请转法轮.请佛住世", "position": "使基础修行圆满"}, {"level": "无限扩大（第8-10愿）", "items": "常随佛学(百).恒顺众生(千/重重无尽).普皆迴向(万/无有止境)", "position": "代表无限的扩大——「虚空界尽.众生界尽.众生业尽.众生烦恼尽,我此愿力无有穷尽」"}]}, "core_principles": "(1)普贤行愿力——海云和上在2011年昆明《普贤行愿品》开示中指出: 「普贤菩萨是法界的第一尊佛,你看得到,你能够认识到佛的第一个形象,就是普贤菩萨。那么在自性海中所修行的法,都叫普贤行愿。你在自性海中所修行的法,所产生的威神力,叫做普贤行愿力。」「我以普贤行愿力故,深心信解,如对目前」(即亲自体验证得,非推测想象)\n(2)四无尽观——每一大愿皆以虚空界尽.众生界尽.众生业尽.众生烦恼尽为所依,四者无有尽故修行无有穷尽,心量无限放大\n(3)念念相续无有疲厌——倾向于圆融道行法,不可一曝十寒。\n", "source": "出处: 《普贤十大愿王行法精要》(空庭书苑, 2006年台北讲记, ISBN 9789867484734) . 《十大愿王修行法要》(空庭书苑, 2007槟城+2008新加坡) . 2011年昆明开示系列(fjdh.cn收录) . https://findbook.com.tw/9789867484734\n"}}, "stage1_foundation": {"title": "第一阶段: 禅修入门 — 发心工程（资粮道）", "description": "资粮道是一切禅观的基础准备，约需1-3年。核心任务是发心工程——使行者从散乱中「静下来」。通过「驻佇心观」(停心)将心初步收摄，成为「堪受法器」后方可进入前行。\n", "sections": [{"title": "制度性入门 — 修行不是DIY", "content": "法师强调:「它是一套制度」——个人能走到哪一步靠「法的传承」，但能否进入这套体系靠「宗的传承」建制。\n\n前行三年: 完成道场指定基础教材、听经笔记(共修时核实)、每周共修、参加「华藏工程」建立语言和思维模式。经禅师团同意、道场推荐、禅师团审核，方取得「正授行法」资格。\n\n五科训练: 戒.律.调身.调息.调心。课程配比: 70%修行面(戒/律/调心)+30%健康面(调身/调息)。\n\n三要件各有三: (1)心性要件-行者先决条件 (2)内摄要件-调身+调息=暖身二法 (3)内观要件-等持工程三昧基础，属一乘不共别圆。\n\n出处: 大华严寺官网「资粮道」页面 . 海云继梦《四十华严讲记》第67讲(2009年2月26日开示, fjdh.cn收录逐字稿)\n"}, {"title": "调身.调息.调心 — 五科训练详解", "content": "五科(戒.律.调身.调息.调心)是资粮道的实操基础。海云和上指出: 身.息.心三者一体不二——调息可及于调身,调身效果又可及于调心。实际行法中三者同时并行,非先后次第。核心著作: 《煖身: 华严禅修入门》(布克文化 2021, ISBN 9789865405984)。\n", "subsections": [{"title": "调身 — 毗卢遮那七支坐相", "description": "据海云和上《迈向佛陀的境界——华严禅前行概论》第六章「毗卢遮那七支坐法」(fjdh.cn收录全文)。和上强调:「七支坐相的目的,旨在调身……若人以此来摄心,即能顿证佛性海。」\n", "items": [{"name": "(1)跏趺坐", "detail": "双盘为佳,单盘或金刚坐亦可。臀与两膝三点鼎立成正三角形,稳固久坐不倾"}, {"name": "(2)手结定印", "detail": "两掌相迭掌心向上,拇指轻拄(指甲碰指甲即可)。「五心向上」(两掌心/两足心/顶门)令气流畅"}, {"name": "(3)头正颈正", "detail": "头不左右偏。「头正、颈正」与「脊直、肩平」构成十字形"}, {"name": "(4)脊直肩平", "detail": "脊椎挺直,两肩平正放松,神经/血液/内分泌系统自然运作"}, {"name": "(5)眼平视", "detail": "眼帘自然下垂以遮光为度,取「三分慈眼」。「此三相摄三千威仪」(头正/脊直/眼平视)"}, {"name": "(6)舌抵颚", "detail": "舌尖轻顶上颚齿龈(上门牙牙龈处),口水自然由舌根两旁下流入咽喉"}, {"name": "(7)收下颚", "detail": "头不前后偏,百会穴与海底穴重迭。如此方能「经劫不替」,久坐不倾"}]}, {"title": "调息 — 息之四相与数息法", "description": "息之四相出自智者大师《释禅波罗蜜次第法门》,海云和上在《禅修前行》第六集(fjdh.cn 2013.11)中引用并详加解说: 「守风则散,守喘则结,守气则劳,守息即定。」\n", "breath_phases": [{"name": "风相", "feature": "鼻息粗重,出入有声", "meaning": "身心不安宁->先安心,放下身心世界"}, {"name": "喘相", "feature": "息无声但出入结滞不通", "meaning": "身体多病->宽放身体,放松情绪"}, {"name": "气相", "feature": "息不结滞但不细", "meaning": "初修状态->观想气行遍毛孔肢节,愈微愈妙"}, {"name": "息相", "feature": "无声.不结.不粗,出入绵密若存若亡", "meaning": "调相——可入定"}], "counting_method": "数息要领: 注意力集中于「风门」(鼻中膈底部,两鼻孔间接近上唇处),觉知息入息出。在「息入尽」及「息出尽」的换气处数息(一入一出为一圈)。初学者从数「一至三」起,稳定后增至「一至五」->「一至七」->「一至十」。\n"}, {"title": "调心 — 治沉.浮.宽.急四相", "heart_phases": [{"name": "沉相", "symptom": "昏沉欲睡.精神涣散.低头垂颈", "remedy": "补充营养(综合维他命);意守风门,守息入息出"}, {"name": "浮相", "symptom": "精神亢奋.心念多缘.身躁动", "remedy": "少食五辛.补品.牛羊肉等;系念丹田"}, {"name": "宽相", "symptom": "心意不举.身好躺卧.口中多水", "remedy": "饮食多温热少寒凉;摄身挺腰,心安住息中"}, {"name": "急相", "symptom": "胸中疼痛.气上举不调", "remedy": "多食寒凉少食燥热;放宽身心,意不卑不亢"}], "note": "若风门举意仍无效,可提意至眉间(风门至眉间称「金刚宝剑」,道家称「小周天」)。"}, {"title": "入相.住相.出相 — 一座禅修的三阶段", "phases": [{"name": "入相（由粗到细）", "detail": "调身(七支坐相)->调息(觉息相.数息)->调心(治沉浮宽急)"}, {"name": "住相（住于细中）", "detail": "摄心于息,同时觉知身.息.心三相是否调和,随觉随治"}, {"name": "出相（由细到粗）", "detail": "先放心异缘(调心)->开口放气,息从百脉散(调息)->微动身躯.肩臂.头颈.双足,揉毛孔.摩掌熨眼(调身),待身热后方可出入,站定后拍打全身"}]}], "source": "出处: 《煖身: 华严禅修入门》(布克文化 2021, ISBN 9789865405984) . 七支坐相原文: 海云和上《迈向佛陀的境界——华严禅前行概论》第六章(fjdh.cn 2013.11) https://www.fjdh.cn/wumin/2013/11/183343302811.html . 《禅修正行》第12集 . 《禅修前行》第6集 . https://play.google.com/store/books/details?id=QREREAAAQBAJ\n"}, {"title": "驻佇心观(停心工程) — 一切禅观的根本前行", "content": "海云法师:「你要能够停下心来，然后，我们要观心！停心是一个前行，都办不到了，怎么观心啊？」核心次第: 「停心」->「观心」。\n\n停心(体.相二门):\n体上停心: 心念不起，六根对六尘境界不会攀缘。\n相上停心: 不妄加猜测、攀缘分别。标准——「心是不是静止下来，像墙壁一样，动都不动！」\n\n四种停心方法:\n(1)参话头: 「看话头就是把心停在那里」\n(2)置心一处: 心安鼻端风门,心跑掉就拉回来\n(3)数息/随息: 从呼吸入手\n(4)依禅堂规矩: 该动则动.该静则静.身心放下。\n\n观心与验证:\n停心之后才能观心——六根对六尘如何作用,看得清清楚楚,「没有任何推理、没有任何意识形态」。法师强调:「不停心你看不到！」六项自检: 空.明.定.智.善心.柔软。\n\n出处: 海云继梦《华严禅行法—禅观》第四集 . https://www.fjdh.cn/wumin/2013/11/165329303084.html . https://www.fjdh.cn/wumin/2013/09/155711285715.html\n"}]}, "stage2_preparation": {"title": "第二阶段: 禅修前行 — 内摄工程", "description": "前行是禅观体系的核心训练阶段，在界内定中进行。四种观法构成工程面主干，贯穿初信至十信位。前二种出自《占察善恶业报经》(T17n0839)，后二种是标准大乘止观。\n", "sections": [{"title": "技术面.工程面双轨详解", "subsections": [{"title": "参禅金三角 — 置心一处 . 放轻松 . 息入息出", "description": "参禅金三角是海云和上禅修教学中 最核心的入门架构,三个条件缺一不可。法师强调:「这三点若能做到及格,触功德就会发起,身心得到调整,人格性可达七十五分以上。完成参禅金三角即进入心一境性。」\n", "elements": [{"name": "(1)置心一处", "description": "将心念安住「风门」(鼻孔气息出入处)", "operation": "用数息法从一到十循环计数。莫用大脑推理思考,只用感受"}, {"name": "(2)放轻松", "description": "身体肌肉.神经系统都要放下;心理上也完全放松,不起执着", "operation": "不能为了专注而肩膀紧绷。「呼吸归呼吸,妄想归妄想」——不跟妄想纠缠"}, {"name": "(3)息入息出清楚", "description": "对呼吸的出入看得清清楚楚,不能昏沉睡着", "operation": "「六根门头全开放」——心在宁静中保持鲜活。守住风门,身心放松,妄念停止"}], "full_process": "整体流程: 调身(七支坐相)->调息(自然呼吸,数息1-10)->置心一处于风门->同时放松身心->息入息出清清楚楚->达成金三角(心一境性)->触功德发起(轻安舒服感)->继续觉照根性->象限转移->破无明->入菩提道。\n", "warning": "警示: 修得轻安感后不可耽于禅味,否则会掉入四禅八定而失去对根性的觉照。\n", "source": "出处: 海云继梦《何谓参禅金三角》(fjdh.cn 2013.12) . https://www.fjdh.cn/fjask/2013/12/133616318955.html . http://read.goodweb.top/news/news_view.asp?newsid=82958\n"}, {"title": "技术面: 安那般那 — 数.随.止三法", "methods": [{"name": "数法", "state": "粗住->细住->欲界定", "operation": "置心风门,1数到10循环。克服四种妄想: 心理/物理/生理/社会制度", "pitfall": "⚠ 掉入「舒服禅」——枯木禅非真修"}, {"name": "随法", "state": "欲界定->未到定", "operation": "注意「息入尽」与「息出尽」的每一个细节。妄想被堵住", "pitfall": "追求境界名相,忽略身心柔和"}, {"name": "止法", "state": "置心一处.心一境性", "operation": "所有妄想脱落,心境合一。八触十功德", "pitfall": "⚠ 左转入外道禅;须「右转」向四果"}]}, {"title": "工程面: 三阶段心法 + 三层功夫", "stages": [{"name": "A阶段", "detail": "感受息之长短与动静差异"}, {"name": "B阶段", "detail": "洞悉呼吸因果轨迹(法师称「生命的秘笈」)"}, {"name": "C阶段", "detail": "心王.心所.境界(公开资料未完全展开)"}], "three_layers": "内摄(技术面): 「妄想一起,把心抓回来放在风门」\n内观(工程面): 在数随止中感受法身存在,分三级: 寂而常照/照而常寂/寂照双亡\n禅观: 粗(数随止中感受)->细(置心一处后)->微妙(十信圆满后)\n"}], "source": "出处: 大华严寺官网「修行蓝图」. 海云继梦《禅修正行》《禅观》系列 . 《海云继梦禅观概论》(2015)第四章\n"}, {"title": "四种观法体系 — 前行工程面核心", "table": {"headers": ["观法", "信位", "禅定", "工程", "核心操作", "成就"], "rows": [{"name": "(1)唯心识观", "stage": "初信~二信", "meditation": "四天王定(煖法)", "engineering": "自省三业", "operation": "守记内心;避免无记攀缘;行禅/闭眼抬手训练", "achievement": "色寂三昧"}, {"name": "(2)真如实观", "stage": "二信位+", "meditation": "忉利定(顶法)", "engineering": "观五蕴流转", "operation": "思惟心性无生无灭;反观自性;超越四空定", "achievement": "相似空三昧->心寂三昧->一行三昧"}, {"name": "(3)毗婆舍那观", "stage": "中信位", "meditation": "空居天定->色界定", "engineering": "观根尘识;照住色受间", "operation": "观六根六尘六识流动;照住色受动态止观", "achievement": "渐舍五识(色界定)"}, {"name": "(4)奢摩他观", "stage": "后信位", "meditation": "无色界定->出界定", "engineering": "照见五蕴空;入正真位", "operation": "舍意识;能所双泯;照见五蕴皆空", "achievement": "十信满心;入法界;圆教初住位"}]}, "classical_source": "《占察善恶业报经》:「若欲依一实境界修信解者,应当学习二种观道。何等为二?一者唯心识观,二者真如实观。」海云法师称此经为「小本华严」。\nhttps://cbeta.buddhism.org.hk/xml/T17/T17n0839_002.xml\n", "sharp_dull_differentiation": "利钝分判: 利根者(阴盖轻微.散乱心少)->直修真如实观; 钝根者(染着情厚.心难调伏)->先修唯心识观。海云法师补充: 钝根先以唯心识观摄心,令妄想降伏后方转入真如实观,此即「由相入性」。\n", "detail_1_title": "(1) 唯心识观 — 毗钵舍那(观).法相宗.钝根先修", "detail_1_content": "定位: 初信~二信位。工程: 自省三业(身.语.意),在定中境中唯观一切三业「唯心生.唯心灭」。四天王定是行者从「定外境」转入「定内境」的起点,属坚信位「煖法」;忉利定属「顶法」,不仅唯见三业之既成,更能见到「三业中心之所由起」。\n\n「学唯心识观者,于一切时一切处,随身口意所有作业,悉当观察,知唯是心。勿令使心无记攀缘,不自觉知。」「一切法唯心想生。若使离心,则无一法一相而能自见有差别也。」\n\n两大重点: (正面)守记内心-念念清楚;(反面)避免无记攀缘-口头禅.摸头发等惯性动作。\n具体训练: (1)闭眼抬手-「手在哪里?你知道吗?要很清楚地感知到」 (2)行禅-脚步慢慢抬起->停->放下,清清楚楚了知 (3)口诀-「唯心识观就是不用大脑,让灵性生命浮现出来」。得色寂三昧。\n", "detail_2_title": "(2) 真如实观 — 奢摩他(止).法性宗.利根直修", "detail_2_content": "定位: 二信位及以上。工程: 观五蕴流转。与唯心识观的差别: 前者看「身语意三业(表层)」,后者深入「五蕴(身心基本元素)」的微观生灭。法理: 大乘起信论「一心开二门」—唯心识观对心生灭门(心之用),真如实观对心真如门(心之体)。\n\n「思惟心性无生无灭,不住见闻觉知,永离一切分别之想,渐渐能过空处.识处.无少处.非想非非想处等定境界相,得相似空三昧。」「展转能入心寂三昧……即复能入一行三昧,见佛无数,发深广行心,住坚信位。」\n\n海云判摄[语境: 2013年高雄《占察善恶业报经》开示]: 「唯心识观是让你了解心的存在跟作用-它像流水一样,前念接后念。真如实观是直接去看那个源头-心性的本源,无生无灭的那个。」\n", "detail_3_title": "(3) 毗婆舍那观 — 深化观照.中信位", "detail_3_content": "定位: 中信位(约五~六信位)。含两个递进层面: (a)观照六根六尘相接时的六识流动-比唯心识观更精微,从行为觉知深入到感知通道机制 (b)照住色与受之间的动态止观-「色」(物质性感受)与「受」(心理性感受)的细微边界。成就: 渐舍五识,进入色界定。\n", "detail_4_title": "(4) 奢摩他观 — 究竟止观.后信位.能所双泯", "detail_4_content": "定位: 后信位(七~十信位)。三步骤: (a)舍意识-三界定功总纲最后阶段 (b)能所双泯-完全泯除主客二元对立,即《心经》「照见五蕴皆空」 (c)入正真位.十信满心-得「能所双泯」,正式「入法界」,成圆教初住位,转入正行。\n", "three_realms_discarding": {"title": "三界定功总纲(海云法师判摄)", "rows": [{"realm": "欲界定", "core": "捨妄念", "observation": "唯心识观+真如实观", "stage": "初信~四信位"}, {"realm": "色界定", "core": "捨五识", "observation": "毗婆舍那观", "stage": "五信~六信位"}, {"realm": "无色界定", "core": "捨意识", "observation": "奢摩他观", "stage": "七信~九信位"}, {"realm": "出界定", "core": "能所双泯.入法界", "observation": "奢摩他观究竟", "stage": "十信满心"}]}, "source": "出处: 《非常占察经》讲记三册(空庭书苑 2015-2017, ISBN 9789867484918/4932/4949) . 播客「普賢乘華嚴宗」S18(46集) . https://podcasts.apple.com/au/podcast/普賢乘華嚴宗/id1523368889 . https://open.spotify.com/show/2ZDlq4cOOiynQvlzPARkmc\n"}, {"title": "十信法门.果位对应 — 四种观法的阶位映射", "content": "海云法师将声闻「四果」与华严「十信位」逐级对应。「破根本无明」是初果的门槛而非彻悟终点——「破根本无明才叫做悟后起修！」[语境: 2009年2月26日《四十华严讲记》第67讲, 台北]\n", "mapping_table": {"headers": ["传统果位", "华严信位", "对应观法", "禅定层次", "关键标准"], "rows": [{"fruition": "初果(预流果)", "stage": "初信位", "observation": "唯心识观", "meditation": "四天王定(煖法)", "standard": "「舍识用根」"}, {"fruition": "—", "stage": "二信位", "observation": "唯心识->真如实", "meditation": "忉利定(顶法)", "standard": "确认菩提心.毗卢遮那七支坐相.收心工程"}, {"fruition": "二果(一来果)", "stage": "三信位", "observation": "真如实观", "meditation": "欲界空居天定", "standard": "开始运用「观照」.具轻安三相+天王三德"}, {"fruition": "—", "stage": "四信位", "observation": "真如实观", "meditation": "同上", "standard": "安般守意工程: 置心于风门"}, {"fruition": "三果(不还果)", "stage": "五信位", "observation": "毗婆舍那观", "meditation": "色界定", "standard": "渐舍五识"}, {"fruition": "四果向", "stage": "六信位", "observation": "毗婆舍那观", "meditation": "色界定", "standard": "照住-色受动态止观"}, {"fruition": "四果(阿罗汉)", "stage": "七信位", "observation": "奢摩他观", "meditation": "无色界定", "standard": "我法二执尚未双破"}, {"fruition": "发心破法执", "stage": "八信位", "observation": "奢摩他观", "meditation": "无色界定", "standard": "回小向大"}, {"fruition": "我执法执双破", "stage": "九信位", "observation": "奢摩他观", "meditation": "出界定", "standard": "渐舍意识"}, {"fruition": "十信位圆满", "stage": "十信位", "observation": "奢摩他究竟", "meditation": "出界定.入法界", "standard": "能所双泯=照见五蕴皆空.成圆教初住位"}]}, "post_note": "十信位之后: 初住位至七地(37位.正行.对应金刚界曼荼罗37尊)->八地至妙觉(5位.无功用行)——共42位圆满佛果。\n"}, {"title": "三重观照技术: 观照.照住.照见", "content": "贯穿四种观法的操作层面技术: 观照(二果开始,能所分离,唯心识观在此运作)-> 照住(至四果,能所合一,毗婆舍那观在此深化)-> 照见(十信满心,能所双泯,奢摩他观在此圆满)。\n\n法师说明:《心经》《金刚经》在他的判摄里都属于圆教初住位的教法——证量标的其实是「十信位圆满.入法界」之后的境界。\n"}]}, "stage3_main": {"title": "第三阶段: 禅修正行 — 等持工程（内观）", "description": "十信满心之后,转入正行。等持工程为官网正式名称。前半程三摩呬多(samahita),后半程定慧等持(三摩钵底 samapatti),究竟等至(三摩地 samadhi)。官网: 「以观导定、以定成观,当下验果,端身正坐,置心风门,依次第而进,步步可检核。」海云和上在讲记中进一步以「界内定/界外定」区分前行与正行的禅定层次,并以杜顺法界三观为究竟指导。\n", "sections": [{"title": "杜顺法界三观 — 正行核心指导框架", "content": "杜顺和尚(华严初祖)所立三重观法,是华严禅观正行的究竟指导。海云和上指出: 龙树将三法印汇归一法印——空性(真空绝相观);杜顺进一步推进为理事无碍观;最终倡事事无碍观(周遍含容观)——举事即能通事,无需再透过理的转辙,此唯法身大士之行径。\n", "table": {"headers": ["观法", "对应法界", "核心义理", "海云法师判摄"], "rows": [{"name": "(1)真空绝相观", "realm": "理法界", "theory": "会色归空,明空即色,空色无碍。一切法当体即空", "interpretation": "龙树空性一法印之极致——理无碍即阿罗汉空性观"}, {"name": "(2)理事无碍观", "realm": "理事无碍法界", "theory": "理遍于事,事遍于理。理(真如)不碍事(万象),事不碍理", "interpretation": "事无碍即生活中的一切事物——「吾辈行者,亦当力行乎此」"}, {"name": "(3)周遍含容观", "realm": "事事无碍法界", "theory": "事如理融,遍摄无碍。如因陀罗网,一即一切,重重无尽", "interpretation": "举事即通事,不经理之转辙——唯法身大士境界。即海印三昧现前"}]}, "source": "出处: 杜顺《法界观门》 . 海云继梦《迈向佛陀的境界》(空庭书苑 2011) . http://wuming.xuefo.net/nr/6/59482.html\n"}, {"title": "正授行法 — 四次灌顶制度", "table": {"headers": ["灌顶", "目标", "关键"], "rows": [{"name": "(1)忍可灌顶", "goal": "破根本无明", "key": "约十人中八人被「踢出去」重修"}, {"name": "(2)行者灌顶", "goal": "证初果.寻生命原形", "key": "通过后取得正式「行者」资格"}, {"name": "(3)进阶灌顶", "goal": "能所合一.破我法二执", "key": "成就四智"}, {"name": "(4)高阶灌顶", "goal": "能所双泯.入法界", "key": "「照见根性,能所双泯」=「照见五蕴皆空」"}]}}, {"title": "三摩呬多.三摩钵底.三摩地", "table": {"headers": ["名相", "梵语", "定位", "操作要点"], "rows": [{"name": "三摩呬多", "sanskrit": "Samahita", "position": "入定前.专注调心", "operation": "粗住->细住->欲界定。排除妄想执著"}, {"name": "三摩钵底", "sanskrit": "Samapatti", "position": "以观导定.定慧双运", "operation": "勘定三界定。须善知识勘定"}, {"name": "三摩地", "sanskrit": "Samadhi", "position": "究竟.心一境性.海印三昧", "operation": "出入自在。破法执我执"}]}, "note": "术语说明: 「三摩地」(samadhi)标准译语为「等持」,「三摩钵底」(samapatti)标准译语为「等至」。大华严寺官方资料中的配对与此恰好相反——此系道场自身的术语使用习惯。\n"}]}, "classical_foundations": {"title": "古典义理地基 — 杜顺和尚五教止观", "description": "华严初祖杜顺大师所立五教止观,是华严宗禅观的古典义理框架。海云和上的四种观法是实际操作体系,五教止观则是其背后的意识状态分类学——二者构成「行」与「解」的互补关系。\n", "entries": [{"name": "一.法有我无门(小乘教)", "content": "破除「我执」,体悟我空,但法执犹存。对应四禅八定。", "hy_mapping": "在海云体系中对应: 资粮道阶段的基本停心功夫。"}, {"name": "二.生即无生门(大乘始教)", "content": "体悟「法空」——外境皆由阿赖耶识变现。", "hy_mapping": "在海云体系中对应: 唯心识观——「知唯是心」的义理背景。"}, {"name": "三.事理圆融门(大乘终教)", "content": "空有不二,理事圆融无碍。", "hy_mapping": "在海云体系中对应: 真如实观——理(真如)与事(五蕴流转)融合的义理背景。"}, {"name": "四.语观双绝门(大乘顿教)", "content": "言语道断,心行处灭。", "hy_mapping": "在海云体系中对应: 奢摩他观——「舍意识」「能所双泯」的义理背景。"}, {"name": "五.华严三昧门(一乘圆教.究竟)", "content": "见法界缘起之相——万象影现,一即一切、圆融无碍。此即海印三昧。", "hy_mapping": "在海云体系中对应: 正行究竟——三摩地.海印三昧.法界三观现前.42位圆满。"}]}, "xianshou_wujiao": {"title": "贤首五教仪 — 华严判教: 小.始.终.顿.圆", "description": "贤首五教仪由华严三祖法藏(贤首国师)创立,清续法大师集大成,是华严宗判教理论的核心框架。海云继梦和上称判教为「文化解剖学」——将印度佛教文明基因与中国文明基因进行重组的方式。五教与杜顺五教止观一一对应: 小教(法有我无门).始教(生即无生门).终教(事理圆融门).顿教(语观双绝门).圆教(华严三昧门)。法师于2008年5月19日至7月17日在台北讲授《贤首五教仪—法界观》,可确认至少53集。播客音频于2020年3月9日前后由「海云继梦法师讲经」频道集中上传至Spotify/Apple Podcast等平台。\n", "table": {"headers": ["五教", "核心义理", "海云法师判摄", "修证品数"], "rows": [{"name": "小教", "theory": "只说人空,不明法空。依六识三毒建立染净根本。\n「如木作灰,如色归空,断烦恼障,灭分段死」\n", "interpretation": "封闭型心态,只执一法门。总相念=始教十回向", "grades": "—"}, {"name": "始教", "theory": "分空始教(般若)与相始教(唯识)。说一切皆空或分别诸法性相。定性二乘不成佛\n", "interpretation": "「如镜离垢,如月出云,断二障,灭二死,显二空,证二果」", "grades": "十二品"}, {"name": "终教", "theory": "说如来藏随缘成阿赖耶识。定性二乘.无性阐提悉当成佛。少说法相,广说真性\n", "interpretation": "「如器成金,如冰即水」——将事相会归于理体,大乘至极之说", "grades": "四十二品"}, {"name": "顿教", "theory": "一念不生,即名为佛。唯是一念,无时可说。无明不起时即无时空;无明起时便有三大阿僧祇劫\n", "interpretation": "「如狂迷歇,如睡梦觉」——一切烦恼本来自离,不是烦恼缠你,是你招揽烦恼。关键: 置心一处", "grades": "五十二品"}, {"name": "圆教", "theory": "一切即一,一即一切。念劫圆融,自在无碍。一位即一切位,十信满心即摄五位成正觉。依普贤法界,性相圆融,主伴无尽\n", "interpretation": "「如拆棉花,如融金狮」——不破而圆融,一切时分同时具足。初住至妙觉,三地超顿教妙觉", "grades": "六十二品"}]}, "gradual_vs_sudden": {"title": "渐教.顿教的实践义 — 从判教到操作", "content": "海云和上将判教转化为实际操作: 渐教(始教+终教)——次第修证路线,对应四种观法中的唯心识观->真如实观->毗婆舍那观,一级一级深入。顿教——「一念不生,即名为佛」「唯是一念,无时可说」。关键操作: 置心一处——守住风门(或佛号.咒语.数息),其他六尘境界一概不理,「能置心一处,一切烦恼自然离开」。顿教与始教.终教的根本区别: 小教与始教都在「无明的前提下」讲时间与次第;顿教直接告诉你无明不起时,即无时间可得——这是大脑想象不到.言语道断的境界。\n出处: 海云继梦《贤首五教仪—法界观》第40-45集(2008.7.8-7.10)\n"}, "source": "出处: 海云继梦 2008年台北《贤首五教仪—法界观》53集+ . https://www.listennotes.com/podcasts/海云继梦法师讲经-播客/ . https://open.spotify.com/show/2ZDlq4cOOiynQvlzPARkmc . 续法《贤首五教仪》原著\n"}, "yicheng_bieyuan": {"title": "一乘不共别圆 — 普贤乘的判教定位", "description": "「一乘不共别圆」是华严宗对自身教义的最高定位——「别人所没有的,所以叫做『别』」。「不共」谓不与三乘共,独为圆顿大根菩萨所说;「别圆」指有别于天台宗以《法华》为圆教的立场,华严自许为最圆满的别教一乘。海云和上特别强调: 这种不共别圆的特质不在理论层面,而在行法的内在蕴藏——「他在经文里头表达得很清楚,但是因为你不懂这种语言模式跟思维模式,所以你以为经文好像讲故事一样讲过去。」\n", "table": {"headers": ["概念", "定位", "特点"], "rows": [{"name": "别教一乘", "position": "《华严经》——纯圆至实,别于三乘", "features": "智俨《孔目章》:「别教者,别于三乘故。」法藏《五教章》: 分「性海果分」(佛自证,不可说)与「缘起因分」(普贤境界,可说)\n"}, {"name": "同教一乘", "position": "《法华经》——会三归一,摄末归本", "features": "智俨: 开三乘方便显一乘真实。法藏判同教一乘较别教一乘低一位,因须「会三归一」方显一乘"}]}, "puxian_interpretation": "海云和上以「普贤乘」名其体系——此即华严别教一乘的实践展开。法师在《四十华严讲记》第68讲中指出: 「普贤乘」的关键在直接兑现,非如三乘出离需次第渐修——「能观心即生成报身(文殊),所观心则生成法身(普贤),置心一处可滋长法身慧命。」并强调此不共别圆的特质不在理论,而在行法的内在蕴藏——「他在经文里头表达得很清楚,但是因为你不懂这种语言模式跟思维模式,所以你以为经文好像讲故事一样讲过去。」[语境: 2009年《四十华严》第68讲,台北]\n", "source": "出处: 智俨《华严经孔目章》.法藏《五教章》.海云继梦《四十华严讲记》第68讲 . 《华严学报》第3期(2012)\n"}, "important_texts": [{"name": "法藏《华严金师子章》 — 十门妙诠华严法界玄奥", "content": "《金师子章》是华严三祖法藏为武则天讲解华严奥义之作——以殿中金狮子为喻,从明缘起.辨色空.约三性.显无相.说无生.论五教.勒十玄.括六相.成菩提.入涅槃十门,仅约一千五百字,妙诠华严法界玄奥。海云继梦和上于2006年在台北开示,共14集。后由空庭书苑整理出版为《华严金师子章讲记》(265页,2010年出版)。讲记逐字稿于2013年11月由fjdh.cn(佛教导航)集中发布。\n\n核心判摄: 十段分三——(1~3)缘起/色空/三性=基础理论 (4~5)无相/无生=般若空性 (6)五教=判教入华严 (7)十玄=事事无碍最高境界 (8)六相=综合圆融(初地) (9)成菩提=二次圆融 (10)入涅槃=三次圆融,重重无尽。\n\n十玄门要义: 同时具足相应门(金体与师子相同时成立).因陀罗网境界门(一一毛处各有金师子,重重无尽,一即一切).十世隔法异成门(九世融于一念)。\n\n修行三区块: 凡夫区(变异念->善恶念->净识念).行者区(初果向到破我法二执).法身区(根本智->后得智->自受用->他受用)。法师强调:「知道不算,做到才算。」\n\n出处: 海云继梦《华严金师子章讲记》(空庭书苑 2010) . http://wuming.xuefo.net/nr/7/70462.html . https://www.got1shop.com/mobile/index.php?m=default&c=goods&a=index&id=3459706\n"}, {"name": "澄观《心要法门》 — 「至道本乎其心,心法本乎无住」", "content": "《心要法门》是华严四祖清凉澄观大师(738-839)所撰,全文仅数百字,阐述「至道本乎其心,心法本乎无住」的华严心法核心要义——无住心体是华严禅观的终极归趣。海云继梦和上以现代语言逐段译解,出版为《解心: 心要法门讲记》(空庭书苑 2001年6月30日初版, ISBN 9573067129, 326页; 宗教文化出版社 2005年9月简体版, 187页)。\n\n核心思想: 「无住心体」——真心不执著于任何一处,灵知不昧,性相寂然,包含德用,该摄内外。能证此者,即入法界。「心法本乎无住」——一切心法的根本在于无住,无住即不执取,不执取即解脱。\n\n海云法师判摄: 此即华严禅观的终极指向——四种观法(唯心识->真如实->毗婆舍那->奢摩他)层层深入,最终所证即是此「无住心体」。「无心于万物,而万物未尝无」——不是消灭万物,而是于万物中不执取,此即事事无碍法界的日常体现。\n\n法师后续出版《是心,非心,还是心!——从心要法门谈心》(空庭书苑 2013, ISBN 9789867484710),进一步深化「无住心体」与华严禅观修行次第的内在关联。\n\n出处: 海云继梦《解心: 心要法门讲记》(空庭书苑 2001/宗教文化出版社 2005) . https://www.buybook.tw/book-0010164666.htm . https://webpac.taichung.gov.tw/bookDetail/730070\n"}, {"name": "华严三品行法 — 净行品·梵行品·普贤行愿品", "content": "据《华藏妙海》听经笔记整理,海云和上将华严三品对应修行三阶段: 净行品——前行阶段的修行法门,信位菩萨所修,在日常生活中即可修; 梵行品——正行阶段的修行法门; 普贤行愿品——成佛以后的修学法门,「众生有尽,我愿无穷」。三品都是行门,构成从初学到究竟的完整行法链条。\n\n结界工程(据同来源): 结界是针对自己弱点,在自己能力范围内做最妥善的调整与安排,是个人修行资粮道的基础。从结界中可以学到如何肯定自己、认识自己——「结界工程是个人资粮道的基础」。\n\n出处: 《华藏妙海》听经笔记整理版(docs/notes4it目录)。\n弥勒菩萨章: 海云和上于善财五十三参第51参详讲弥勒菩萨——毗卢遮那庄严藏楼阁,共12集视频(B站 BV1X142147EN)+播客(Podwise)。此为法师关于弥勒的最主要讲记,目前文字整理尚不完整,建议直接观看视频。\n"}], "verification": {"title": "贯穿全程 — 验证机制.关键原则", "sections": [{"title": "验证机制 — 200+测验 & 归零重修", "content": "法师强调修行进程「绝对理性」「不能讲人情」: 全程设有两百余种具体测验——制造顺境诱发贪着反应、制造逆境激发嗔心反应。\n\n失败重修的规则极为严格: 并非退回上一级,而是打回初信(初果)从头开始——「四果再重修,就从这个地方开始,再从初果开始。」\n"}, {"title": "三大关键原则", "content": "(1)不走四禅八定: 法师称其为「共外道法」——「我们不走那条路,我们直接走出三界。」[语境: 2009年《四十华严讲记》第67讲]\n\n(2)大脑临界点: 置心一处之前可运用理性思维;一旦跨过初果门槛,必须弃用概念思维——「只要用大脑,初果进不去,就这么简单。」[语境: 2009年《四十华严讲记》第67讲]\n\n(3)两种歧路: 置心一处后产生「舒服.喜悦.轻安」或「恐惧」。若被执取,两种都会导向外道禅——必须连这类感受也一并放下。\n"}]}, "reference_table": {"description": "以下为本文所依据的全部第一手来源。内容以大华严寺官方资料.海云继 nworld.org/%e8%8f%af%e5%9a%b4%e7%a6%aa%e7%b0%a1%e4%bb%8b%e7%89%b9%e8%89%b2/"}}, "heart_xref": {"entries": {"别用大脑": {"r1_huayan": "◆ 调身·调息·调心(五科训练): 海云和上《煖身:华严禅修入门》(布克文化2021)系统阐述,强调「身·息·心三者一体不二」。本文「暖身二法」即五科中调身+调息的实操展开。\n◆ 驻佇心观(停心工程): 《华严禅行法—禅观》第四集:「你要能够停下心来,然后我们要观心!停心是一个前行。」本文「不能用大脑」即停心基本操作。\n◆ 华严初祖·杜顺《法界观门》真空观·泯绝无寄(CBETA T45n1884):「不可言即色不即色,亦不可言即空不即空,一切法皆不可,不可亦不可,此语亦不受。迥绝无寄,非言所及,非解所到。」此即「不能用大脑」的华严宗源头——「生心动念,即乖法体、失正念故。」\n◆ 华严四祖·澄观: 「心心无住,念念无着。」与本文「不用大脑,用身体感知」归趣一致。\n◆ 参禅金三角: fjdh.cn(2013.12)「置心一处·放轻松·息入息出很清楚」。\n", "r1_source": "禅观法要→调身调息调心·驻佇心观 · T45n1884 法界观门", "r2_other": "◆ 天台·智者大师《小止观》调和第四(CBETA T46n1915): 「行者修习,善调五事,必使和适,则三昧易生。」调身——「不宽不急,是身调相。」调息——息有四相(风喘气息),「守风则散,守喘则结,守气则劳,守息即定。不涩不滑,是调息相。」调心——治沉浮宽急,「不沉不浮,是心调相。」身息心三事「的无前后,随不调者而调适之。」与本文调身调息调心体系完全互证。\n◆ 禅宗·《六祖坛经》坐禅品(CBETA T48n2008): 「外于一切善恶境界,心念不起,名为坐;内见自性不动,名为禅。」「外离相为禅,内不乱为定。」坛经之禅定不在形躯而在心性——但惠能同时批判「空心静坐,百物不思」的枯禅(与本文「不能用大脑」非弃绝思维而是转向身体感知,有对应之妙)。\n◆ 道家·庄子心斋: 《庄子·人间世》:「若一志,无听之以耳而听之以心,无听之以心而听之以气。听止于耳,心止于符。气也者,虚而待物者也。唯道集虚。虚者,心斋也。」「听之以气」即甩开意识思维,归于气息感知——与本文「不能用大脑,用身体感知」异曲同工。郭象注:「遗耳目,去心意,而付气性之自得。」\n◆ 道家·列子·心凝形释: 《列子·黄帝》:「心凝形释,骨肉都融,不觉形之所倚,足之所履。」与停心后身心消融的状态相通。\n◆ 儒家·《大学》知止: 「知止而后有定,定而后能静,静而后能安。」知止即大脑停歇——与「不能用大脑」的先秦儒学源头遥相呼应。\n◆ 瑜伽·Pratyahara(制感): Patanjali《瑜伽经》2.54-55: 感官从外境收摄向内,如心之本形——对应本文从「大脑外驰」转向「身体内觉」。\n", "r2_source": "CBETA T46n1915 · T48n2008 ·《老子》《庄子》《列子》《大学》·《瑜伽经》2.54"}, "四段呼吸": {"r1_huayan": "◆ 安那般那数息观(数·随·止): 禅观法要·技术面详解。数法1→10循环;随法注意「息入尽」与「息出尽」每一细节。本文「四段呼吸——息入·息住·息出·息停」对应随法对呼吸全过程的精细觉知。\n◆ 华严三祖·法藏《妄尽还源观》(CBETA T45n1876): 第二门「依体起二用」中,海印三昧心如大海澄净万象影现——此澄净之用,以息之细密调柔为入门方便。法藏云:「言海印者,真如本觉也。妄尽心澄,万象齐现。」调息至「息相」(出入绵绵若存若亡)即是「妄尽心澄」的前行基础。\n◆ 息之四相: 从粗至细——风→喘→气→息,四段呼吸的清晰觉知正是从「气相」趋入「息相」的关键。\n", "r1_source": "禅观法要→安那般那数息观· 调息息之四相 · T45n1876 妄尽还源观", "r2_other": "◆ 天台·《小止观》息之四相(CBETA T46n1915): 「不声不结不粗,出入绵绵,若存若亡,资神安稳,情抱悦豫——此是息相也。守风则散,守喘则结,守气则劳,守息即定。」海云和上息之四相全出于此。\n◆ 南传·安那般那念(MN 118): 十六阶段安般念从「知入息长」到「观灭·观舍」，与四段呼吸有对应的微观觉照结构。\n◆ 道家·《抱朴子》胎息: 「得胎息者,能不以鼻口嘘吸,如在胞胎之中,则道成矣。」即息相「出入绵密若存若亡」之极致。\n◆ 藏传·密勒日巴尊者: 《十万歌集》:「气之出入往来处,即是心之所行处。」「持气之法如灯烛,微风不动光焰 ww.huayenworld.org", "sections": [{"聽·華嚴天籟 (音聲法門": "有聲書/梵唄/華嚴字母)"}, {"讀·華嚴燈藏 (閱藏修學": "直播/電子書/著作導讀)"}, {"修·華嚴靈思 (禪修實踐": "禪修啟蒙/禪觀論述/法脈源流)"}, {"境·華嚴萬象 (文化推廣": "中式瑜伽/至善獎/文物)"}, {"觀·華嚴脈湧 (相關連結": "鹿谷論禪/萬神博覽會/社群)"}, {"護·華嚴妙心 (護持管道": "線上捐款/志工)"}, "願·華嚴花開 (年度計畫)"]}, {"name": "Facebook 粉絲團", "url": "https://www.facebook.com/huayenlugu.org"}, {"name": "LINE 官方帳號", "id": "@huayenworld"}, {"name": "語音弘法頻道 (MP3)", "url": "https://newtemple.idataiwan.com/info/232789"}, {"name": "Podcast (海雲繼夢法師講經)", "url": "https://podwise.ai/episodes/1270459"}], "meta": {"last_updated": "2026-08-08", "note": "YouTube播放清單URL為近似值，部分清單ID可能需在YouTube頻道頁面\n直接確認。建議定期到 https://www.youtube.com/@huayen-world/playlists\n核對更新。"}}, "huayan_panjiao": {"overview": {"title": "华严判教体系", "subtitle": "从五教十宗到普贤乘一乘不共别圆", "description": "判教（panjiao）是汉传佛教特有的方法论传统——将佛陀一代时教按义理深浅、\n说法时序、教化对象等标准进行分类和排序。华严宗的判教体系由初祖杜顺发端，\n二祖智俨推进，三祖法藏（贤首国师）集大成，最终在当代由海云继梦法师以\n「普贤乘」重新诠释，形成一套完整的从「小乘」到「一乘不共别圆」的判摄体系。\n"}, "sections": [{"id": "wujiao", "title": "贤首五教 — 法藏判教的核心架构", "classic_ref": "法藏《华严一乘教义分齐章》(《华严五教章》, T45n1866)", "description": "法藏（643-712）在《华严五教章》中建立「五教十宗」判教体系，为汉传佛教\n最具系统性的判教理论之一。五教以义理深浅为次第，从浅至深：\n", "teachings": [{"name": "小乘教 (Hīnayāna)", "also_called": "愚法二乘教", "texts": "《阿含经》/ 四部阿含", "doctrine": "四谛·十二因缘·八正道。说人空，未说法空。", "position": "为声闻、缘觉二乘所说，未及大乘。"}, {"name": "大乘始教 (Elementary Mahāyāna)", "also_called": "权教", "sub_schools": [{"相始教": "唯识法相宗——广说法相，少说法性。主张五种性、一分无性。"}, {"空始教": "中观般若宗——多说法性，不说法相。主张一切皆空。"}], "texts": "《解深密经》《瑜伽师地论》(相); 《般若经》《中论》(空)", "doctrine": "说一切法空，但未及「真如缘起」。", "position": "为大乘初入门者所说，犹带权巧方便。"}, {"name": "大乘终教 (Final Mahāyāna)", "also_called": "实教", "texts": "《楞伽经》《大乘起信论》《胜鬘经》", "doctrine": "真如缘起——真如随缘而生万法。如来藏思想。一切众生皆有佛性。", "key_concept": "如来藏缘起·真如随缘不变", "position": "尽大乘至极之说。超越权教，直显真实义。"}, {"name": "顿教 (Sudden Teaching)", "texts": "《维摩诘经》《楞伽经》(顿悟部分)", "doctrine": "不立文字，直指人心。一念不生即如如佛。不历阶位，顿超直入。", "key_concept": "言语道断·心行处灭", "position": "不依言教次第，直显真性。禅宗即属此类。"}, {"name": "圆教 (Perfect Teaching)", "also_called": "别教一乘", "texts": "《华严经》(六十/八十华严)", "doctrine": "事事无碍法界——一即一切，一切即一。主伴圆融，重重无尽。", "key_concept": "法界缘起·性起·事事无碍·十玄门·六相圆融", "position": "华严为最胜圆教——超越诸教而融摄诸教。"}]}, {"id": "shizong", "title": "十宗 — 以理开宗", "description": "法藏在五教之下，更立十宗，以所宗之理为判摄标准。\n从「我法俱有」到「圆明具德」，层层递进：\n", "schools": [{"false": 1, "name": "我法俱有宗", "doctrine": "犊子部等——执我法俱为实有", "level": "小乘"}, {"false": 2, "name": "法有我无宗", "doctrine": "说一切有部——法有我无", "level": "小乘"}, {"false": 3, "name": "法无去来宗", "doctrine": "大众部——现在有", "过未无": null, "level": "小乘"}, {"false": 4, "name": "现通假实宗", "doctrine": "说假部——现在法有假有实", "level": "小乘"}, {"false": 5, "name": "俗妄真实宗", "doctrine": "说出世部——世俗虚妄", "出世真实": null, "level": "小乘"}, {"false": 6, "name": "诸法但名宗", "doctrine": "一说部——一切诸法唯有假名", "level": "小乘"}, {"false": 7, "name": "一切皆空宗", "doctrine": "大乘始教——般若中观", "一切法空": null, "level": "始教"}, {"false": 8, "name": "真德不空宗", "doctrine": "大乘终教——真如妙有", "如来藏不空": null, "level": "终教"}, {"false": 9, "name": "相想俱绝宗", "doctrine": "顿教——言语道断", "心行处灭": null, "level": "顿教"}, {"false": 10, "name": "圆明具德宗", "doctrine": "圆教——主伴圆融", "重重无尽": null, "level": "圆教"}]}, {"id": "yicheng", "title": "一乘不共别圆 — 海云法师的当代判摄", "classic_ref": "海云继梦法师《华严经》讲记系列 / 大华严寺修行体系", "description": "海云继梦法师在继承法藏五教判的基础上，以「普贤乘」重新诠释华严判教，\n提出「一乘不共别圆」——华严不是「五教中的圆教」，而是超越并融摄一切\n教法的「不共别圆」。不是「第五教」而是「唯一乘」。\n", "key_points": [{"title": "「同教一乘」与「别教一乘」的区分", "body": "法藏《五教章》区分「同教一乘」（法华为代表——会三乘归一乘，开权显实）\n与「别教一乘」（华严为代表——不共三乘，直显佛果境界）。\n海云法师强调：「别教」不是排斥，而是「不共」——华严直显佛陀\n成道时的内证境界，不经过三乘的迂回。\n"}, {"title": "普贤乘 — 从「判教」到「行法」", "body": "海云法师将华严判教从「教相判释」推至「修行实践」——普贤乘。\n普贤乘不只是一个名相，而是一套完整的从初发心到成佛的修行体系：\n资粮道→前行→正行→妙行→究竟。\n智俨「搜玄」→法藏「探玄」→海云「行玄」——三阶段的历史推进。\n"}, {"title": "华严判教与当代文明对话", "body": "华严「事事无碍」不是排他的——在判教框架中，小始终顿圆不是\n互相排斥的「等级」，而是法界中互摄互入的「事事」。\n当代意义：(1) 宗教多元论——各宗教传统在法界中各有位置；\n(2) 科学与佛教——科学知识为「事法界」，华严义理为「理法界」；\n(3) 跨文化伦理——事事无碍为全球化时代的文明对话提供框架。\n"}]}, {"id": "futian", "title": "华严判教与其他宗派判教的比较", "description": "汉传佛教四大判教体系横向对比：", "comparisons": [{"school": "天台宗 (Tiantai)", "founder": "智顗 (538-597)", "system": "五时八教", "five_periods": "华严时·阿含时·方等时·般若时·法华涅槃时", "eight_teachings": "化仪四教(顿/渐/秘密/不定) + 化法四教(藏/通/别/圆)", "relation_to_huayan": "天台以《法华》为纯圆独妙，华严被判为「带别之圆」（犹带别教痕迹）。\n华严则以自身为「别教一乘」，高于法华的「同教一乘」。\n这场「圆教之争」持续千年，至今未有定论。\n"}, {"school": "唯识宗 (Faxiang/Yogācāra)", "founder": "玄奘·窥基", "system": "三时教", "three_periods": "有教(阿含)·空教(般若)·中道教(唯识)", "relation_to_huayan": "法藏判唯识为「大乘始教·相始教」。华严认为唯识的「阿赖耶缘起」\n未及「法界缘起」的圆融。但唯识的「转识成智」与华严的「妄尽心明」\n在实践论上有互补空间。\n"}, {"school": "禅宗 (Chan/Zen)", "founder": "菩提达摩→慧能", "system": "教外别传·不立文字", "relation_to_huayan": "法藏判禅宗为「顿教」。华严五祖宗密同时是禅宗法嗣，\n著《禅源诸诠集都序》融会禅教。海云法师将华严禅观溯源至\n「东山法门」——禅宗实践与华严义理在当代「普贤乘」中合流。\n"}]}], "references": ["法藏《华严一乘教义分齐章》(《华严五教章》) — CBETA T45n1866", "法藏《金师子章》— CBETA T45n1880", "智俨《搜玄记》— CBETA T35n1732", "宗密《禅源诸诠集都序》— CBETA T48n2015", "海云继梦《华严经》讲记系列 — 大华严寺", "陈永革《法藏评传》— 南京大学出版社", "牟宗三《佛性与般若》(1977) — 从哲学角度评判华严天台判教之争"]}, "dushun_wujiao_zhiguan": {"text_info": {"title": "华严五教止观", "title_full": "华严五教止观（一卷）", "author": "隋·杜顺禅师 (帝心尊者, 557–640)", "author_title": "华严宗初祖", "canon_ref": "大正藏 T45n1867", "dynasty": "隋 (Sui)", "cbeta_url": "https://cbetaonline.dila.edu.tw/zh/T45n1867", "wikisource_url": "https://zh.wikisource.org/wiki/華嚴五教止觀", "kanripo_url": "https://www.kanripo.org/ed/KR6e0081/T/001", "significance": "《华严五教止观》是华严宗禅观修行的奠基性文本——杜顺以五重止观门\n（法有我无→生即无生→事理圆融→语观双绝→华严三昧）层层升进，\n从破我执到入法界缘起，建立了从初入到圆顿的修行总纲。\n此五门成为后世法藏「五教十宗」判教体系的禅观根基。\n"}, "overview": {"opening_line": "行人修道，简邪入正，止观法门有五：\n一、法有我无门（小乘教）\n二、生即无生门（大乘始教）\n三、事理圆融门（大乘终教）\n四、语观双绝门（大乘顿教）\n五、华严三昧门（一乘圆教）\n", "structure_summary": "五门由浅入深：第一门破凡夫我执（界分别观），第二门破名相入空性，\n第三门明理事圆融（如来藏缘起），第四门遣言绝观直契真如，\n第五门入华严事事无碍法界。前四为方便，第五为究竟。\n"}, "gates": [{"id": "gate1", "name": "法有我无门", "name_en": "Gate 1: Dharma Exists, Self Does Not", "panjiao": "小乘教 (Hīnayāna)", "practice": "界分别观（五停心观之一）", "original_text": "第一法有我无门。夫对病而裁方，病尽而方息。治执我之病，故有界分别之观。\n众生执我之病有二种：一者离身执我——谓外道所计，谓身内别有神我故。\n二者即身执我——谓凡夫所计，谓色身即是我之自体故。\n今破此二执，以四药治四病：\n一、色心分别——对治执身为「一我」者\n二、四大分别——对治执四大为我者\n三、五阴分别——对治执五阴为我者\n四、十二入分别——对治执十二入为我者\n如是四法，一一推求，皆无有我。人我既无，法我何有？\n", "commentaries": [{"source": "法藏《五教章》", "text": "法藏以「愚法二乘教」判此门——彼但知人空，未达法空。\n然杜顺于此门中已隐示「法空」之机：「人我既无，法我何有？」\n此即从小入大之转捩点。\n"}, {"source": "智俨《搜玄记》", "text": "智俨承杜顺衣钵，于《搜玄记》中将此界分别观摄入\n「十玄门」之因门——破执方能显性，遮诠即是表诠之基。\n"}, {"source": "海云继梦判摄", "text": "海云和上称此门为「封闭型心态的打开」——界分别观\n不是否定现象（色心、四大、五阴、十二入），而是\n看破「在这些组合中找不到一个固定不变的『我』」。\n这四药治四病法，核心在「解析→重组」：\n把粗的拆成细的，细到发现「没有那个我以为的我」。\n"}], "critical_notes": [{"author": "牟宗三《佛性与般若》", "text": "牟宗三指出：杜顺「法有我无」的遮诠策略与龙树中观\n的「缘起无我」有方法论上的亲和，但杜顺不破「法有」，\n只破「我执」，为后续「生即无生」的空性展开保留了\n必要的阶梯。此即华严「渐次引归圆顿」之教育智慧。\n"}]}, {"id": "gate2", "name": "生即无生门", "name_en": "Gate 2: Arising is Non-Arising", "panjiao": "大乘始教 (Elementary Mahāyāna)", "practice": "无生观 + 无相观（二观双运）", "original_text": "第二生即无生门。生即无生门者，就此门中，先简名相，后入无生门。\n\n（一）简名相者：随取一物征即得。今且就一枕上征。\n问：不违世间，唤作何物？答：是枕。\n问：复是何？答：是名。又问：此是何？答：是名相事。\n问：名相事复是何？答：由见闻熏习而成种，起名相事。\n……智人唯见色法，不见名相。此简名竟。\n\n（二）入无生门：夫智人观色法者，且如色法。眼识得时实无分别，\n不是不得而无分别。此即是法眼识亲证如色无异。\n及其意识不了，妄计我，生假分别，倒见沉沦。\n……是故证法无人。何以故？法无分别故。\n\n又开二观：\n一者无生观——法无自性，相由故生。生非实有，是则为空。\n空无毫末，故曰无生。经云「因缘故有，无性故空。」\n\n二者无相观——相即无相也。何以故？法离相故。\n一切法皆空，无有毫末相。\n\n前门则得人无我智。……此始教菩萨则得人法二空，亦名法无我智也。\n", "commentaries": [{"source": "法藏《金师子章》", "text": "法藏以金师子为喻释「生即无生」：师子（现象）由金（本体）而成，\n揽金成相，即有而空；金不守自性，即空而有。\n「以金收师子尽」，名相寂灭，唯金独存——\n此即杜顺「智人唯见色法，不见名相」之深化。\n"}, {"source": "澄观《华严经疏》", "text": "清凉澄观（华严四祖）将杜顺「简名相」与「入无生」二段，\n融入其三圣圆融观——文殊智（简名相之分析智）与\n普贤行（入无生之实践）一体不二。\n"}, {"source": "海云继梦判摄", "text": "海云和上特别重视「枕喻」的现代意义——\n「当你看到枕头时，真的看到『枕头』吗？还是只看到色法\n（颜色、形状、质感），然后意识加上『枕头』的标签？」\n此即「置心一处」的认知科学基础——\n停心就是停止意识的自动贴标签程序，回到眼识的纯知觉。\n"}], "critical_notes": [{"author": "方立天《法藏与金师子章》", "text": "方立天指出：杜顺「生即无生」的论证方法——从日常物品\n（枕）出发的层层追问——与西方现象学「现象学还原」\n（悬置自然态度，回到事物本身）有方法论上的可比之处。\n但杜顺的目的不是描述意识结构，而是证入「无生」的解脱境界，\n二者的终极取向有根本差异。\n"}, {"author": "Peter N. Gregory (格里高利)", "text": "美国华严学者 Gregory 在《Tsung-mi and the Sinification of Buddhism》\n中指出：杜顺「简名相」的认知分析为宗密的「禅教融合」\n提供了认识论基础——名相是「教」的方便施设，\n「入无生」是「禅」的亲证境界。\n"}]}, {"id": "gate3", "name": "事理圆融门", "name_en": "Gate 3: Phenomena and Principle Interpenetrate", "panjiao": "大乘终教 (Final Mahāyāna)", "practice": "真如门（理）与心生灭门（事）的圆融观照", "original_text": "第三事理圆融门。夫事理两门圆融一际者，复有二门。\n一者心真如门，二者心生灭门。\n心真如门者是理，心生灭者是事。\n即谓空有二见，自在圆融，隐显不同，竟无障碍。\n\n言无碍者，指事理圆融也。夫事理者，理是真如，事是生灭。\n\n○空有圆融：\n空是不碍有之空，即空而常有。\n有是不碍空之有，即有而常空。\n\n○止观四句：\n以空而不有故名止。\n以空即有而不空故名观。\n空有全收，不二而二故，亦止亦观。\n空有互夺，二而不二故，非止非观。\n\n○四句妙义（涅槃生死自在）：\n以有即空故，不住生死。\n以空即有故，不住涅槃。\n空有一块而两存故，亦住生死亦住涅槃。\n以空有相夺两不存故，非住生死非住涅槃。\n", "commentaries": [{"source": "智俨《孔目章》", "text": "智俨将杜顺「事理圆融」摄为「六相圆融」之总相与别相——\n理（总）= 真如平等一味，事（别）= 缘起森罗万象。\n总别相即，同异相入，成坏同时——六相齐观，即事理圆融之展开。\n"}, {"source": "法藏《大乘起信论义记》", "text": "法藏以《起信论》「一心开二门」整合此门：\n心真如门=理=不变=性起之体\n心生灭门=事=随缘=性起之用\n「不变随缘，随缘不变」即杜顺「理事圆融」的浓缩表达。\n"}, {"source": "宗密《原人论》", "text": "宗密以「本觉真心」会通理事——\n理即本觉之体（寂），事即不觉之相（动）。\n从不觉返本觉的过程，即是杜顺五门从「法有我无」\n到「华严三昧」的完整修行路径。\n"}], "critical_notes": [{"author": "吕澂《中国佛学源流略讲》", "text": "吕澂指出：《起信论》「一心二门」为华严理事圆融观提供了\n印度佛学与中国思维的交汇点——「理」的概念吸收了中国道家\n「道」的形上学意涵，但杜顺以「空有圆融」保持了中观\n不落二边的般若精神，使理事说既不失空性正见，\n又能正面展开大乘菩萨行的实践基础。\n"}, {"author": "镰田茂雄 (Shigeo Kamata)『中国華厳思想史の研究』", "text": "日本华严学泰斗镰田茂雄认为：「事理圆融门」是华严思想史上\n最具原创性的贡献之一——它将《起信论》的形上学架构与\n《华严经》的实践体系进行了创造性整合，开辟了从「空宗」\n（中观）到「性宗」（如来藏）的义理通途。\n"}]}, {"id": "gate4", "name": "语观双绝门", "name_en": "Gate 4: Language and Observation Both Cease", "panjiao": "大乘顿教 (Sudden Teaching)", "practice": "离言绝虑·言语道断·心行处灭", "original_text": "第四语观双绝门。夫语观双绝者，言语道断，心行处灭。\n经云「言语道断，心行处灭」。\n\n夫语者，言说也。观者，观照也。双绝者，俱泯也。\n何故须绝？真如妙理，非言所及，非心所缘。\n以言遣言，以观遣观。言观俱遣，方契真如。\n\n譬如有人，以指指月。智者因指见月，愚者执指为月。\n语观即指也，真如即月也。执语观者，如执指为月者也。\n故须双绝语观，方可契入真如。\n", "commentaries": [{"source": "宗密《禅源诸诠集都序》", "text": "宗密将此门配「禅三宗」之第二——「泯绝无寄宗」：\n「凡圣等法，皆如梦幻，都无所有，本来空寂，\n非今始无。……无佛无众生，法界亦是假名。」\n语观双绝即此宗的修行纲要——一切名相俱遣，\n连「遣除」本身亦遣。\n"}, {"source": "海云继梦判摄", "text": "海云和上以「置心一处」为语观双绝的操作化——\n「置心一处，无事不办。」守住风门，一切六尘不理会，\n言语自然断绝，观照自然放下。\n「一念不生，即名为佛」——顿教的全部秘密在此一句。\n不是不起念，是「不与念相应」。\n"}], "critical_notes": [{"author": "傅伟勋《从创造的诠释学到大乘佛学》", "text": "傅伟勋以「创造的诠释学」分析杜顺四→五的过渡：\n语观双绝（第四门）相当于「存有论的断裂」——\n从概念思维到亲证境界的跳跃无法用任何渐进逻辑完成，\n只能「顿」。这一认识与禅宗「顿悟」和天台「一念三千」\n构成中国佛教三种不同的「顿」模式。\n"}]}, {"id": "gate5", "name": "华严三昧门", "name_en": "Gate 5: Huayan Samādhi", "panjiao": "一乘圆教 (One Vehicle Perfect Teaching)", "practice": "海印三昧·因陀罗网·事事无碍法界", "original_text": "第五华严三昧门。……即一切法界，无尽缘起，重重无尽。\n犹如因陀罗网，珠珠相映，影现重重。\n一尘中见法界，一毛中现无量佛刹。\n此即华严三昧之境界。\n\n若有直见色等诸法从缘，即是法界缘起。\n故见色为法界缘起时，不必更观真如。\n何以故？即此色等诸法，举体是法界缘起，\n全体是真如故。是故见色即见心，见心即见佛。\n", "commentaries": [{"source": "法藏《华严经探玄记》", "text": "法藏将杜顺此门展开为「十玄门」与「六相圆融」：\n一即一切（同时具足相应门），一切即一（因陀罗网境界门），\n一摄一切（一多相容不同门），一切摄一（诸法相即自在门）……\n此即从杜顺「一尘中见法界」的直觉洞见，到法藏\n严密哲学体系的完成。\n"}, {"source": "李通玄《新华严经论》", "text": "李通玄以《易经》融会华严，将「华严三昧」与「太极」\n对应：一尘即太极，法界即无极而太极。\n李通玄的「东方智慧」解经路线为杜顺的禅观提供了\n中国本土哲学的诠释维度。\n"}, {"source": "海云继梦「普贤乘」", "text": "海云和上以「普贤乘」为华严三昧的实践展开——\n「一尘中见法界」不是玄想，而是禅定中的现量境界。\n从技术面（数随止）到工程面（观照凝），\n最终入海印三昧——万象影现，如大海印。\n"}], "critical_notes": [{"author": "木村清孝 (Kiyotaka Kimura)『東アジア仏教思想史の構築』", "text": "日本华严学者木村清孝认为：杜顺「见色即见心，见心即见佛」\n的三联结构，是华严「性起」思想的雏形——\n不是「心生万法」，而是「法法即性」。\n在法界缘起中，每一个现象都完整地呈现着整个法界的实相。\n「色→心→佛」不是因果关系，而是华严三昧中直观到的\n一体圆融。\n"}, {"author": "Francis Cook《Hua-yen Buddhism: The Jewel Net of Indra》", "text": "美国学者 Francis Cook 以「因陀罗网」为核心意象，\n将华严三昧的哲学意涵引介到西方——\n每一颗宝珠都映现着所有其他宝珠，\n这不是比喻，而是华严对法界实相的直接描述。\nCook 指出：这种「全息性」(holographic)世界观\n与当代物理学和文化生态学有深层对话空间。\n"}]}], "lineage_development": {"title": "从杜顺五门到法藏五教——华严禅观的演进", "stages": [{"period": "隋 (c. 600 CE)", "figure": "杜顺 (557–640)", "contribution": "五教止观——以禅观实践为本的五门次第", "key_text": "《华严五教止观》(T45n1867)"}, {"period": "唐初 (c. 650 CE)", "figure": "智俨 (602–668)", "contribution": "将五门禅观融入「六相」「十玄」义学框架", "key_text": "《搜玄记》《华严经孔目章》"}, {"period": "盛唐 (c. 690 CE)", "figure": "法藏 (643–712)", "contribution": "「五教十宗」判教体系——从实践到教相的完成", "key_text": "《华严五教章》《探玄记》"}, {"period": "中唐 (c. 780 CE)", "figure": "澄观 (738–839)", "contribution": "综合杜顺-智俨-法藏，著《华严经疏》", "key_text": "《大方广佛华严经疏》"}, {"period": "晚唐 (c. 830 CE)", "figure": "宗密 (780–841)", "contribution": "禅教融合——五教止观与禅宗顿渐之会通", "key_text": "《禅源诸诠集都序》"}, {"period": "当代 (2000–)", "figure": "海云继梦 (1950–)", "contribution": "普贤乘——五教止观的当代修行实践体系", "key_text": "大华严寺修行体系 / YouTube讲经系列"}]}, "references": ["杜顺《华严五教止观》— CBETA T45n1867", "法藏《华严一乘教义分齐章》(《五教章》) — CBETA T45n1866", "法藏《华严经探玄记》— CBETA T35n1733", "法藏《金师子章》— CBETA T45n1880", "智俨《华严经搜玄记》— CBETA T35n1732", "澄观《大方广佛华严经疏》— CBETA T35n1735", "宗密《禅源诸诠集都序》— CBETA T48n2015", "李通玄《新华严经论》— CBETA T36n1739", "牟宗三《佛性与般若》(1977) — 台湾学生书局", "方立天《法藏与金师子章》(1996) — 中国人民大学出版社", "吕澂《中国佛学源流略讲》(1979) — 中华书局", "镰田茂雄『中国華厳思想史の研究』(1965) — 東京大学出版会", "木村清孝『東アジア仏教思想史の構築』(2010) — 春秋社", "傅伟勋《从创造的诠释学到大乘佛学》(1990) — 东大图书", "Peter N. Gregory, \"Tsung-mi and the Sinification of Buddhism\" (1991) — Princeton University Press", {"Francis H. Cook, \"Hua-yen Buddhism": "The Jewel Net of Indra\" (1977) — Penn State University Press"}, "海云继梦《华严金师子章讲记》(2010) — 空庭书苑", "海云继梦《华严经讲记》系列 — 大华严寺"]}, "haiyun_practice_sources": {"core_framework": {"description": "海云继梦法师将华严禅法分为「技术面」与「工程面」双轨——\n技术面 = 具体修行方法 (数息·提疑情·参话头·守风门)\n工程面 = 生命改造工程 (心灵转化·破无明·法身成长)\n三阶次第: 初阶(资粮道·发心工程) → 二阶(前行·内摄工程) → 三阶(正行·等持工程)\n正行三步骤: 观照(能所分离)→照住(能所合一)→照见(能所双泯)\n", "source_lecture": "海云继梦《禅修正行》系列 (共至少12集, 2007-2008)", "source_web": "华严禅观全程·修行蓝图 (大华严寺官网, 2025年11月访问)"}, "books": [{"title": "煖身: 华严禅修入门", "year": 2021, "publisher": "布克文化", "isbn": "9789865405984", "content": "七支坐相·调身调息·入相住相出相·初阶技术面基础", "link_google_play": "https://play.google.com/store/books/details?id=QREREAAAQBAJ", "link_buy": "https://www.books.com.tw/products/0010891234"}, {"title": "迈向佛陀的境界——华严禅前行概论", "year": 2011, "publisher": "空庭书苑", "content": "前行阶段完整体系·四种观法·工程面心法", "link_fjdh": "https://www.fjdh.cn/wumin/2013/11/183343302811.html"}, {"title": "华严金师子章讲记", "year": 2010, "publisher": "空庭书苑", "pages": "265页", "content": "法藏《金师子章》现代阐释·十门·十玄门·修行三区块", "isbn": "9789867484680", "link_fjdh": "http://wuming.xuefo.net/nr/7/70462.html", "link_buy": "https://www.got1shop.com/mobile/index.php?m=default&c=goods&a=index&id=3459706", "lectures": "2006年台北开示, 共14集"}, {"title": "我们只有一个选择", "year": 2010, "publisher": "空庭书苑", "isbn": "9789867484475", "content": "灵性经济学核心著作·三世间框架·中英对照", "link_buy": "https://www }, "haiyun_xinfa_primary": {"meta": {"title": "心法·四禅八定·瑜伽行 — 海云继梦法师原文辑录", "principle": "每一条引述均标注可验证的来源链接。微信(mp.weixin.qq.com)搜索引擎未索引，需在App内搜索。"}, "sections": [{"id": "xinfa", "title": "心法模式", "icon": "❤️", "intro": "海云继梦法师的「心法」体系以澄观《心要法门》「至道本乎其心，心法本乎无住」为根基，\n以「置心一处」为总纲，以「自观活心」为核心方法。\n区分「大脑思惟」与「生命思惟」——前者属识性分别，后者是法身慧命的启用。\n", "quotes": [{"text": "「至道本乎其心，心法本乎无住。无住心体，灵知不昧。」\n", "source": "澄观《心要法门》· 海云继梦《解心·心要法门讲记》(宗教文化出版社, 2005)", "context": "华严四祖澄观原著，海云法师逐段现代阐释。全书326页(台版)/187页(简体版)。", "links": ["空庭书苑 2001年初版 ISBN 9573067129"]}, {"text": "「置心一处之心与处，必须愈专且范围愈小愈好，成就即大也愈殊胜。」\n", "source": "[心法 置心一处之「心」与「处」](http://wuming.xuefo.net/nr/6/59565.html)", "context": "解释「置心一处」的技术面操作——先「找心」(确定心放在哪)，再「定位」(确定所缘处)。"}, {"text": "「若心他缘即是大脑起用；而心定不动则是生命起用，法身发芽矣！」\n", "source": "[心法 心定不动生命起用](http://www.wmxf.net/nr/6/59618.html)", "context": "关键分判——大脑思惟(心他缘)vs生命思惟(心定不动)，后者是法身慧命滋长的起点。"}, {"text": "「自观心乃是活人之计，非枯木禅之所能知。禅之所以活人、觉人，自在里许。\n故经文谓：『成就慧身不由他悟』，唯是此活人之计耳！」\n", "source": "[心法 自观活心](http://www.wmxf.net/nr/6/59622.html)", "context": "「活人」vs「枯木」——自观心是让心活起来的法门，非死守枯坐。"}, {"text": "「置心一处实是将心安住于心所……若此心纯以注意力安住，而不起意识分别(余思杂觉)，\n唯是安住而已——则将由此安住而起生命改造工程的进程；\n而此工程将不经八识等之作用，是乃法身慧命得以滋长耶！」\n", "source": "[心法 置心一处](http://wuming.xuefo.net/nr/6/59566.html)"}]}, {"id": "sichenbading", "title": "四禅八定", "icon": "🧘", "intro": "海云继梦将「四禅八定」定位为**世间禅的根本味禅**(三品十二门)——\n是出世间善法之所依，但非究竟。若耽著禅味而无觉性，则堕「禅定窟」成天魔外道。\n核心判摄: 「不向四禅八定去，要向念头处看。」\n", "quotes": [{"text": "「若未臻置心一处或直上四禅八定，皆非上菩提道！\n唯真能止住妄念，又能活心、自观心、入菩萨学处，乃真禅人也！」\n", "source": "[止住妄念，自观活心](https://www.sushimei.com/tags/35178.html)", "context": "四禅八定若不结合活心自观，不能上菩提道。"}, {"text": "「若息心入定，则不能观心；此乃超入禅定与径入法界之别！」\n", "source": "[华严禅前行概论 捌·无尽的超越](http://wuming.xuefo.com/nr/7/70374.html)", "context": "全书最核心的分判——息心入定(入色界天)vs 活心入法界(菩萨道)。"}, {"text": "「息心入定之定功固可嘉，然于息心之同时即不置心一处矣！\n如欲置心于一处必须先能制心也；而于制心时，乃调心至活其心，不使其心乱缘尘境，\n方有生命观境之可言。否则，若制心至息心，则心死意亡……\n此时，尘境无用矣，死心不可用也，故曰入定去矣！」\n", "source": "同上", "context": "详细解释为何息心入定(四禅八定)不能观心——心死意亡则无法进行生命观境。"}, {"text": "「要修学到初禅定，即使你很用功，差不多也要三年的时间。」\n", "source": "[华严禅前行概论 捌](http://wuming.xuefo.com/nr/7/70374.html)", "context": "初禅定是「了生死出三界」不可逾越的基础。"}, {"text": "「进入初禅定……这个触功德就叫做初禅的特相……他定了五个标准:\n心一境性(置心一处)，然后会产生寻、伺、喜、乐。」\n", "source": "[禅观 第九集](http://read.goodweb.top/news/news_view.asp?newsid=60398)", "context": "初禅五觉支的技术面描述。"}, {"text": "「十二门禅就是四禅八定，从四禅定到四空定之间，\n要再修慈·悲·喜·舍四无量心。」\n", "source": "[华严禅前行概论 捌](http://wuming.xuefo.com/nr/7/70374.html)", "context": "四禅八定的系统结构——三品十二门。"}, {"text": "「杂讯与贪心重的学员常堕四禅八定，无法觅本根源，反堕外道禅的范畴。」\n", "source": "[直接从欲界出三界](http://wuming.xuefo.net/nr/6/59098.html)"}]}, {"id": "yoga", "title": "瑜伽行法", "icon": "🕉️", "intro": "海云继梦将「瑜伽行派」(Yogācāra)译为「禅观正行」——\n「瑜伽行的完整翻译应称禅观正行，古云相应行」。\n2008年底，法师自称通过惹查西牟尼灌顶接回**大乘瑜伽行法(Maha Yogachar)**，\n将其作为贤首宗的核心修行体系。瑜伽行法的关键是——\n「根性即prana，放任根性作用而不作意压抑」。\n", "quotes": [{"text": "「瑜伽行的完整翻译应称『禅观正行』，古云『相应行』有几分神似，\n重点是在系统教学的指导下，每一个步骤所呈现的相应效果，故云相应。」\n", "source": "[瑜伽行与禅观正行](http://wuming.xuefo.com/nr/6/59391.html)"}, {"text": "「根性即prana，其行法的第一步即放任根性的作用而不作意压抑，\n任令根性带动身体的自由活动，直到压抑的根性能量释放完毕，\n『能观心』就能观『所观心』。」\n", "source": "[瑜伽行派的传承(心能观身)](https://www.fjdh.cn/wumin/2013/09/083454285947.html)"}, {"text": "「此正行中的前奏亦有三: 一、呼吸法。二、体位法。三、左右呼吸法。\n经此三部分的前奏之后，闭眼静坐，令身心分开；\n此一步骤的重点在眼闭静观，以静心去感觉身体的微动，而后令身自然而动，\n行者不用意志去加以压抑、控制或操纵！」\n", "source": "[瑜伽行的教学体系: 约事之二](http://wuming.xuefo.com/nr/6/59385.html)"}, {"text": "「瑜伽行法的进程，我们称之为『探空』的教学体系，或探空方程式。\n此即华严三段教学法中的第二段: 正行，证空性的教学系统。」\n", "source": "[瑜伽行的教法: 约理](https://www.fjdh.cn/wumin/2013/09/081851285942.html)"}]}, {"id": "sanskrit_terms", "title": "梵汉术语比对", "icon": "📝", "intro": "海云继梦法师在教学中常将核心术语进行梵文(Sanskrit)与中文的对照辨析。\n以下辑录其关键术语比对——正法(Dharma) vs 心法(Moksha)、\n般若(Prajñā) vs 般那(Prāṇa/Ānāpāna)、三摩地(Samādhi)等。\n每一个术语均注明了法师本人的定义和出处。\n", "quotes": [{"text": "「法(Dharma)与解脱(Moksha)是截然不同的。\n在『说法』的范围里皆属资粮道，而『解脱』则属行法。」\n", "source": "[心法 经典法本与行法](http://wuming.xuefo.net/nr/6/59614.html)", "context": "正法(学佛认知)≠解脱(生命改造实践)——阿难多闻即正法者但未解脱之例"}, {"text": "「佛法中内明的认知与内明的实践——\n内明的认知属于正法(Dharma)，一般所谓的『学佛』即是，\n它是认知红尘的人生与涅槃之存在，属于观念上的感悟，\n对于『道』圣谛知道而未能做到。\n\n内明的实践乃是心法或(Moksha)，即是『修行』，\n是一项真正的生命改造工程，此一工程暨精且密，\n有赖于系统的科班训练与指导。」\n", "source": "同上", "context": "Dharma=认知层面「知道」, Moksha=实践层面「做到」"}, {"text": "「若唯般那之法，为外道之四禅八定；\n若唯般若之法，则为正法非心法。\n故心法必般那与般若二法并举不偏废也。」\n", "source": "同上", "context": "核心判摄——般那(定)与般若(慧)必须双运，单修任一皆非心法(不解脱)"}, {"text": "「讲心法乃就约『般那』而言，讲内明则是约『般若』言。\n激发、成长般那与般若的『般那工程、般若工程』，\n可谓华严禅观之双璧。」\n", "source": "同上", "context": "般那工程=定学(内摄·法界系统), 般若工程=慧学(内观·法身系统)"}, {"text": "「安那般那(Ānāpāna)——安那(ānā)=入息, 般那(āpāna)=出息。\n东汉安世高译为『安般守意』: 安为定, 般为莫使动摇,\n守意为莫使乱意也。安般守意名为, 御意至得无为也。」\n", "source": "《禅修正行——「安那般那」数息观》(空庭书苑 2015, ISBN 9789867484895) + 安世高译《安般守意经》", "link_book": "https://play.google.com/store/books/details?id=mnf6CgAAQBAJ", "context": "六妙门(数随止观还净)以 Ānāpāna 为体——安那(入)·般那(出)——「般那」一词从此来"}, {"text": "「三摩地(Samādhi)——玄奘大师译为『心一境性』，\n是能所交融、定慧等持的境界。进入三摩地之前的阶段\n称为『止/止息』(Śamatha)。\n华严禅观中的『入定』即『入三昧』，入三昧即\n『出三界，入法界』，透过海印三昧展现佛陀在菩提树下\n所证得的华严境界。」\n", "source": "[心法 入定与定中见](http://wuming.xuefo.net/nr/6/59579.html) + 综合华严禅前行概论"}, {"text": "「心法之心非心意识之心，而是真心之法。\n欲修行解脱道者于此必须有明确之认识，不可滥也！」\n", "source": "[心法 经典法本与行法](https://www.fjdh.cn/wumin/2013/09/181114286325.html)"}]}, {"id": "prana_details", "title": "Prana·息身·参禅金三角", "icon": "⚡", "intro": "海云继梦将 Prana(प्राण, 梵音「普拉那」)译为「气/生命能量/life force」，\n并直接等同于「根性」。Prana 有四态——体力·心力·内力·神力。\n修行从认识自己的呼吸开始，「安那般那」数息观以「参禅金三角」为入门。\n", "quotes": [{"text": "「Prana——梵音为『普拉那』，翻译为『气』或『生命能量』(life force)。\n它实际上就是『根性』。Prana 有四种形态:\n一、体力(Physical strength)\n二、心力(Mental strength)\n三、内力(Inner strength)\n四、神力(Spiritual strength)」\n", "source": "[瑜伽行传承之五: 灌顶功德](http://wuming.xuefo.com/nr/6/59432.html)", "context": "Prana = 根性 → 修行即释放根性能量(而非压抑)"}, {"text": "「修行从认识自己的呼吸开始。建立参禅的金三角:\n一、身心放松\n二、止住妄想\n三、息入息出很清楚\n将注意力放在风门(鼻中膈底部，两鼻孔间接近嘴唇处)，\n去觉知息出、息入的状况。」\n", "source": "[修行从呼吸开始(百度贴吧·海云继梦)](https://tieba.baidu.com/p/3007335880) + 《禅修正行》(2015)", "context": "技术面入门三要素——放松·止妄·觉息"}, {"text": "「除了色身之外还有一个『呼吸身』(息身)，\n此呼吸身是操作色身的本体。\n观息身三阶段:\n一、观『身』对『息』的影响\n二、观『息』的变化对『身』的影响\n三、观『息』与『身』之间的相互关系」\n", "source": "[海云继梦: 观息身](https://www.nengliangcan.cn/xuefo/167769.html)", "context": "息身≠色身——呼吸有一个独立的「身」，能操作色身"}, {"text": "「安那般那(Ānāpāna)传到中国后称为『六妙门』:\n数→随→止→观→还→净。\n安般守意名为，御意至得无为也。\n基础佛法必须能运用才能圆满，\n运用佛法必须有基础才能得当。」\n", "source": "[迈向佛陀的境界 拾·安那般那](https://www.fjdh.cn/wumin/2013/11/184122302815.html)", "context": "六妙门以摄心不乱为核心——非「有为/无为」二分"}], "wechat_found": {"account": "静虑入藏", "articles": ["元气与_般那_: pran,音般那(prana),其义为身体中除掉这个因素就叫死亡,事实上般那就是生命", "安那般那即数息观: 在中国称为六妙门,即将数息观分为…", "息身是怎么养成的: 海雲繼夢和上", "初入禅定之调息: 安般坐禪談數息·一息十念·息柔和身轻安心详", "占察经略解视频合集: 1-32集索引", "海云继梦法师的准提法门"], "search_method": "weixin.sogou.com 可搜到标题摘要, 但无法获取原文直链"}}, {"id": "three_paths", "title": "三条路径的总判摄", "icon": "🔀", "intro": "这是海云继梦体系中最核心的修行路径分判——\n三条从欲界出离的路径，判然有别:\n", "quotes": [{"text": "路径一·共外道禅(四禅八定): 挤到禅定里面去→入色界天/无色界天。\n若没有觉性，就落入「禅定窟」，成为天魔外道。\n\n路径二·不共外道禅(有止无定): 不必有禅定，但必须有「止」的功夫。\n「止」不等于「定」——带着觉性，不陷入禅定窟，从欲界直接出三界。\n\n路径三·活心入法界(菩萨道): 「若息心入定则不能观心；\n此乃超入禅定与径入法界之别。」活心自观心→入法界大门→菩萨学处(初果至四果)。\n", "source": "综合自以上各篇，为海云法师反复阐述的核心框架", "context": "三条路径的关键区别——「不向四禅八定去，要向念头处看」"}]}], "references": [{"fmt": "讲记原文", "items": ["心法 置心一处之「心」与「处」: http://wuming.xuefo.net/nr/6/59565.html", "心法 自观活心: http://www.wmxf.net/nr/6/59622.html", "心法 心定不动生命起用: http://www.wmxf.net/nr/6/59618.html", "心法 置心一处: http://wuming.xuefo.net/nr/6/59566.html", "华严禅前行概论 捌·无尽的超越: http://wuming.xuefo.com/nr/7/70374.html", "瑜伽行与禅观正行: http://wuming.xuefo.com/nr/6/59391.html", "瑜伽行派的传承(心能观身): https://www.fjdh.cn/wumin/2013/09/083454285947.html", "瑜伽行的教学体系: 约事之二: http://wuming.xuefo.com/nr/6/59385.html", "瑜伽行的教法: 约理: https://www.fjdh.cn/wumin/2013/09/081851285942.html", "禅观 第九集: http://read.goodweb.top/news/news_view.asp?newsid=60398", "直接从欲界出三界: http://wuming.xuefo.net/nr/6/59098.html", "止住妄念，自观活心: https://www.sushimei.com/tags/35178.html"]}, {"fmt": "出版物", "items": ["海云继梦《解心·心要法门讲记》(空庭书苑 2001 / 宗教文化出版社 2005)", "海云继梦《迈向佛陀的境界——华严禅前行概论》(空庭书苑, 2011)"]}, {"fmt": "搜索局限", "items": ["微信公众号(mp.weixin.qq.com)未被公共搜索引擎索引——需在微信App内搜索", "搜狗微信(weixin.sogou.com)同样返回空结果", "以上讲记均为2013年前后在fjdh.cn/wmxf ons": [{"id": "chan_academic", "title": "全球学界视角·禅宗全貌", "icon": "🔍", "intro": "禅宗学术研究一百年，经历了四个阶段的范式转移：\n第一阶段(1910s-1930s)铃木大拙向西方译介Zen，以信仰者视角构建「禅的哲学」；\n第二阶段(1930s-1970s)胡适与铃木论战开启历史批判研究，敦煌禅籍出土重塑早期禅史；\n第三阶段(1980s-2000s)柳田圣山文献学与McRae解构主义，质疑法脉叙事的历史真实性；\n第四阶段(2000s-)批判佛教(松本史朗)与社会史转向(Foulk·Welter)，研究重心从「禅思想」转向「禅的制度与权力」。\n中国学界自印顺《中国禅宗史》(1971)起形成独立脉络，葛兆光、龚隽等人持续深化。", "topics": [{"title": "研究理路总览 — 四个阶段与中外脉络", "body": "**第一阶段·西传期(1910s-1930s)**: 铃木大拙《Essays in Zen Buddhism》三卷(1927-1934)将Zen译介至西方。其写作以「体验者的证言」而非「学者的考据」为基调——为西方读者构建了「禅=超越理性的纯粹体验」的图景。此阶段禅学研究尚属「信仰者的自我表达」。\n**第二阶段·批判转折(1930s-1970s)**: 胡适《禅宗在中国——它的历史与方法》(1953)与铃木《禅：答胡适博士》公开论战，形成「胡适禅学案」。敦煌禅籍(《楞伽师资记》《历代法宝记》等)的出土，为早期禅史提供了独立于后代灯录的原始材料。忽滑谷快天、宇井伯寿等日本学者奠定文献学基础。\n**第三阶段·解构期(1980s-2000s)**: 柳田圣山系统整理敦煌禅籍，McRae《Seeing Through Zen》(2003)提出「法脉是宗教认同而非历史血缘」「机锋问答是宋代回溯性创作」。Bernard Faure《The Rhetoric of Immediacy》(1991)批判「不立文字」本身即是修辞。\n**第四阶段·社会史转向(2000s-)**: T. Griffith Foulk质疑「禅宗」作为制度实体在10世纪前的存在；Albert Welter研究宋代禅宗如何成为主流；Mario Poceski重估洪州宗。批判佛教(松本史朗·袴谷宪昭)从义理层面质疑「本觉思想」。\n**中国脉络**: 印顺《中国禅宗史》(1971, 1973年获日本大正大学博士学位)部分为回应胡适「神会造坛经」说而作。此后洪修平、杜继文、魏道儒、葛兆光、龚隽等形成独立研究传统。葛兆光晚年反思: 「现在的禅史研究仍在胡适的延长线上」。"}, {"title": "经典奠基期 — Heinrich Dumoulin《Zen Buddhism - A History》", "body": "Heinrich Dumoulin (1905-1995), 德国耶稣会士, 两卷本Zen Buddhism: A History\n(Vol.1 India and China, 1988; Vol.2 Japan, 1990, Macmillan) 英文版\n长期为英语世界最详尽的禅宗通史。优点: 综览日文·德文·法文·英文研究成果,\n覆盖印度源流→中国→日本的完整传播链。局限: 偏向日本立场;\n被视为「宗派史」(church history)范式; 假设存在一个「真正的禅」;\n忽略韩国·越南·中国后宋禅宗。\n"}, {"title": "批判转向 — John McRae《Seeing Through Zen》(2003)", "body": "John R. McRae (1947-2011), 美国学者。Seeing Through Zen: Encounter,\nTransformation, and Genealogy in Chinese Chan Buddhism\n(University of California Press, 2003. ISBN 978-0520237988)。\n提出「禅宗研究的四个原则」:\n① It's not true, therefore it's more important\n   (正因不是史实, 所以更重要——虚构反映的是创造者的价值观)\n② Lineage is about religious identity, not genealogy\n   (法系传承是宗教认同, 非历史血缘)\n③ Encounter dialogue is a Song-dynasty retrospective creation\n   (机锋问答是宋代禅僧回溯性创作的宗教文学, 非历史实录)\n④ Chan is a process, not a fixed essence\n   (禅宗是一个不断建构的过程, 没有一个不变的「禅宗本质」)\n", "links": {"ucpress": "https://www.ucpress.edu/book/9780520237988/seeing-through-zen"}}, {"title": "文献学革命 — 柳田圣山(Yanagida Seizan)与敦煌禅籍", "body": "柳田圣山(1922-2006), 日本早期禅宗文献研究第一人。\n系统整理敦煌禅宗写本, 出版的《初期禅宗史书の研究》(1967)\n彻底改变了学界对早期禅宗的理解——\n发现北宗并非「渐悟」的保守派, 而是盛唐时期的主流禅法;\n《六祖坛经》有多个版本, 敦煌本(最早)与宗宝本(通行)差异极大。\n柳田于1989年写道: 「敦煌禅文献被发现已九十年, 研究似已穷尽,\n然事实上什么也还没有解决……大半材料仍未被整体通读。」\n"}, {"title": "文化批判 — Bernard Faure《The Rhetoric of Immediacy》(1991)", "body": "Bernard Faure (1948-), 法国学者, 哥伦比亚大学教授。\nThe Rhetoric of Immediacy: A Cultural Critique of Chan/Zen Buddhism\n(Princeton, 1991. ISBN 978-0691029634)。\n核心批判: 禅宗自称「不立文字」「教外别传」——\n但「不立文字」本身就是一种精心构建的「修辞」,\n且恰恰依赖巨量的文字传统来传播「不立文字」的叙事。\n这种「反传统的传统主义」是禅宗最具悖论性的文化特征。\n"}, {"title": "关键通论与参考", "body": "• Robert Buswell (UCLA): 韩国禅(Sŏn)研究权威, 主编The Zen Canon (Oxford, 2004)\n• T. Griffith Foulk (Sarah Lawrence): 质疑「禅宗」(Ch'an Tsung)作为制度性实体在10世纪之前的存在\n• Albert Welter (Arizona): 宋代禅宗的社会史研究——禅宗如何在宋代成为主流\n• Mario Poceski (Florida): 马祖道一与洪州宗的再评估\n• 印顺(1906-2005): 《中国禅宗史》(1971)——中国学者最早的批判性禅宗史,\n  考证《坛经》非神会伪作, 推翻胡适「神会造《坛经》」说\n• 忽滑谷快天(Nukariya Kaiten): 日本最早的系统禅学史作者\n"}]}, {"id": "chan_practice", "title": "佛门内部·实修视角", "icon": "🧘", "intro": "佛门内部的禅宗史观与学界不同——它不追问「法脉是否虚构」，\n而关注「这条修行道路如何被历代祖师真实地走出来」。\n以下从义理演化·技术演进·制度创新三个层面，梳理禅宗作为修行传统的内在发展逻辑。", "topics": [{"title": "义理演化 — 从楞伽到般若再到禅教融合", "body": "**早期(达摩-弘忍)**: 依《楞伽经》「自性清净心」立宗。达摩「二入四行」以「理入」为根本。道信引入「一行三昧」(《文殊说般若经》)，弘忍「守本真心」——此期禅法以「安心」为纲。\n**六祖革命(慧能)**: 以《金刚经》「应无所住而生其心」为宗，开「无念·无相·无住」三无法门。从「看净」转向「见性」——禅法重心从「修」转向「悟」。\n**洪州宗(马祖道一)**: 「平常心是道」「即心即佛」——禅法彻底日常化。百丈「一日不作一日不食」确立农禅制度。\n**禅教融合(宗密)**: 华严五祖宗密以《圆觉经》通禅教，判禅三宗、教三种，倡「禅教一致」——此后的禅宗义理始终带有华严/圆觉的色彩。\n**宋以后**: 大慧「看话禅」以疑情为本，宏智「默照禅」以静照为门。明末四大高僧(云栖袾宏·紫柏真可·憨山德清·蕅益智旭)融合禅净教律——「禅净合流」成为明清丛林主流。"}, {"title": "技术演进 — 禅法的操作体系如何逐步精密化", "body": "**初传期(6世纪)**: 达摩「壁观」——面壁默坐，直契真如。技术含量最低，全凭理入。\n**东山法门(7世纪)**: 道信「守一不移」，弘忍「守本真心」——出现明确的「所缘境」概念。此期禅法仍是「止」的一系。\n**南宗顿悟(8世纪)**: 慧能「定慧等持」，取消坐禅的形式要求——「道由心悟，岂在坐也」。神会「知之一字，众妙之门」。\n**机锋时代(9世纪)**: 马祖·石头门下发展出棒喝·圆相·翘足·竖拂等教学手段——禅法从「自修」转向「师教」。\n**文字禅(11世纪)**: 汾阳善昭「颂古」评唱公案，圆悟克勤《碧岩录》集其大成——公案成为可被反复参究的「话头库」。\n**看话禅(12世纪)**: 大慧宗杲以「无」字话头摄一切妄念——「千疑万疑只是一疑，话头上疑破则千疑万疑一时破」。技术操作达到最精密形态。\n**默照禅(12世纪)**: 宏智正觉「只管打坐」——取消话头，直以静坐本身为法。\n**近现代**: 虚云坚持传统看话禅；来果改革高旻寺禅堂规矩；圣严将话头·默照整合为四阶次第；净慧以「生活禅」把功夫延伸到日用。"}, {"title": "禅宗修行总纲 — 戒·定·慧三学", "body": "禅宗虽云「教外别传」, 实不离戒定慧三学。\n• 戒: 百丈清规→丛林规矩→禅堂规约。一日不作一日不食(农禅)\n• 定: 四禅八定(共外道)→欲界定→未到定→初禅(三品十二门)\n• 慧: 从文字般若→观照般若→实相般若\n海云和尚: 「没有初禅定的功夫, 了生死出三界根本不可能。」\n"}, {"title": "两大法门 — 话头禅(临济宗) vs 默照禅(曹洞宗)", "body": "禅宗修行至宋代形成两大主流门庭:\n**话头禅**(看话禅)— 临济宗大慧宗杲(1089-1163)弘扬。\n以一句「无义味语」(如「狗子无佛性」「念佛是谁」)截断意识流,\n起大疑情, 疑情成团后爆破——「大疑大悟, 小疑小悟, 不疑不悟」。\n**默照禅** — 曹洞宗宏智正觉(1091-1157)弘扬。\n「默默忘言, 昭昭现前」——只管打坐, 默然静照, 不求开悟而自然悟入。\n两门非对立而是互补: 话头有「疑」无「默」则浮躁;\n默照有「默」无「疑」则枯寂。明末四大高僧多兼弘二者。\n"}, {"title": "参禅进阶 — 三关·三玄三要", "body": "门内传统以「三关」衡量参禅功夫:\n初关(破本参): 截断意识流, 亲见本来面目。话头疑情成团→疑团爆破。\n重关(透重关): 保住功夫, 悟后起修。历境练心, 于一切境缘中不动摇。\n牢关(末后牢关): 大事了毕, 生死自在。末后一句, 不通凡圣。\n临济义玄更立「三玄三要」(句中玄·意中玄·体中玄)为参究细密功夫。\n海云继梦将此三玄配修行三阶段: 句中玄=资粮道, 意中玄=正行, 体中玄=法身妙行。\n"}, {"title": "丛林制度 — 禅宗的社会实践", "body": "马祖建丛林, 百丈立清规(唐代) ——\n这是禅宗对中国佛教最革命性的贡献之一:\n走出律寺, 另立禅寺; 不依律藏, 别创清规。\n核心精神: 「一日不作, 一日不食」(百丈怀海)。\n禅堂规矩: 禅七(七日密集禅修)·打七·起七·解七·跑香·坐香。\n虚云老和尚中兴多处禅堂, 恢复古规, 重振宗风。\n"}, {"title": "制度创新 — 丛林清规与法脉传付", "body": "**丛林制度**: 马祖建丛林，百丈立清规——禅宗走出律寺、另立禅寺的制度革命。《百丈清规》确立: 不立佛殿唯树法堂·普请(集体劳动)·禅堂坐香制度。\n**传法制度**: 以袈裟(至六祖止)·法卷·拂子为信物。灯录(传灯录·五灯会元)记录世系。宗法式传承确保法脉延续，也使「谁是谁的弟子」成为宗教权威的核心依据。\n**清规演化**: 宋《禅苑清规》·元《敕修百丈清规》·明清丛林规约——仪轨日趋细密。禅七制度(七日密集禅修)自明末定型，成为禅堂修行最核心的形式。\n**近代变革**: 来果改革高旻寺——恢复古规·整肃道风。虚云中兴云门·云居等多处禅堂——「农禅并重」传统在现代的延续。"}, {"title": "祖师禅与如来禅 — 宗门史上的著名判摄", "body": "**概念来源**: 「如来禅」之名出于《楞伽经》卷二——「谓入如来地, 得自觉圣智相三种乐住, 成办众生不思议事」。宗密《禅源诸诠集都序》将禅分五等(外道禅·凡夫禅·小乘禅·大乘禅·最上乘禅), 以「最上乘禅」为如来禅——「顿悟自心本来清净, 元无烦恼; 无漏智性, 本来具足」。\n\n**祖师禅的提出(仰山慧寂勘验香严智闲)**: 沩仰宗仰山慧寂首立「祖师禅」之名。公案「香严击竹」: 香严智闲抛瓦击竹而悟, 作颂「一击忘所知」。仰山许其「如来禅」而斥「祖师禅未梦见在」。香严再作「去年贫未是贫, 今年贫始是贫; 去年贫犹有卓锥之地, 今年贫锥也无」——仰山仍只许如来禅。直至香严作「我有一机, 瞬目视伊」一颂, 仰山方认可「且喜师弟会祖师禅也」。\n\n**二者的核心区别**:\n- 如来禅 = 教内之禅, 以破我执法执为主, 「即心即佛」体现当下现实的同一性\n- 祖师禅 = 教外别传之禅, 以明心见性为主, 「非心非佛」体现当下现实的超越性\n- 马祖道一从「即心即佛」到「非心非佛」的否定性转向, 是如来禅转向祖师禅的关键\n\n**各家评论**:\n- 陈继生《禅宗公案》: 如来禅是「教内之禅」, 祖师禅是「教外别传」之禅\n- 《哲学门》第24辑: 二者「并无绝对的界限和本质的差异, 而只是在证悟的彻底性与超越性上程度有别」\n- 长庆棱「一时坐却」之评: 当时已有禅师认为二者以实际禅理而言根本不可分, 仰山之分只是方便说法\n- 中唐后贬义化: 后世禅徒反以祖师禅为「一味清净之禅」, 视如来禅为「五味交杂之禅」, 形成上根祖师禅/下根如来禅的优劣界定\n- 日本道元: 「如来禅、祖师禅, 往古不传今妄传」\n- 晚明合流: 晚明佛教出现祖师禅与如来禅的合流思潮, 受回归慧能、《坛经》观念的影响\n- 《坛经》「如来清净禅」宣诏之记载: 敦煌本·惠昕本无载, 契嵩本·宗宝本有载——学界疑为祖师禅概念出现后添补", "source": "《楞伽经》T16n0670·宗密《禅源诸诠集都序》T48n2015·《景德传灯录》T51n2076(香严击竹公案)·陈继生《禅宗公案》"}, {"title": "禅宗与其他宗派的融合", "body": "**禅净合流(宋以后)**: 永明延寿(904-975)《宗镜录》百卷, 会通禅教净。其「四料简」:「有禅有净土, 犹如戴角虎」成为禅净双修纲领。明末云栖袾宏·蕅益智旭·憨山德清·紫柏真可四大高僧皆禅净兼弘。「念佛是谁」话头即禅净合流的产物。清代丛林实际主流模式即「禅堂参究+念佛」的混融状态。\n\n**禅教合一(唐·宗密)**: 华严五祖宗密《禅源诸诠集都序》判禅三宗(息妄修心·泯绝无寄·直显心性)、教三种, 倡「禅教一致」——禅是佛意, 教是佛语, 语意不二。此为「华严禅」的正式提出。\n\n**禅律关系**: 百丈怀海「一日不作, 一日不食」的丛林清规, 是在戒律基础上另立禅门规约。明末律宗复兴(古心如馨·三昧寂光·见月读体)与禅门互相支持——见月读体《传戒正范》成为禅门传戒的标准仪轨。\n\n**禅密交涉**: 唐代不空三藏时代, 禅密并行不悖。宋代以后, 密教式微, 但禅门功课中保留大量真言(楞严咒·大悲咒·准提咒)。近现代虚云老和尚兼传沩仰宗与密法灌顶; 海云继梦接大乘瑜伽行法; 成观法师禅密并修——「即禅即密, 即密即禅」。\n\n**禅与华严的互摄**: 宗密以华严五祖兼荷泽法嗣的身份, 是禅华融合的标志性人物。宋代长水子璿(华严复兴先驱)兼弘楞严; 憨山德清晚年特重华严与禅的会通; 李通玄《新华严经论》的「东方智慧」解经路线, 长期滋养禅门义学。海云继梦「教属华严, 观属禅宗心法」即此传统的当代延续。", "source": "永明延寿《宗镜录》T48n2016·宗密《禅源诸诠集都序》·见月读体《传戒正范》·憨山德清《华严纲要》"}]}, {"id": "chan_modern", "title": "近现代禅门发展", "icon": "📜", "intro": "近代禅门的发展, 是一部从「衰微」到「复兴」的历史。\n晚清庙产兴学与战乱重创丛林, 但虚云·来果守住禅堂香火;\n杨文会·太虚开辟文献整理与人间佛教两条新路;\n1949年后, 禅宗在大陆·台湾·海外三地各自发展,\n最终在全球化时代迎来禅法的世界性传播。", "topics": [{"title": "清末民初 — 禅门的衰落与危机的双重夹击", "body": "晚清禅门的衰微, 有两重结构性原因:\n**外缘**: 1898年张之洞《劝学篇》提出「庙产兴学」——以寺产办新式学堂。此后几十年间, 各地提拨寺产、改寺为学成风。1928-1930年国民政府又两次颁布「寺庙管理条例」, 引起全国佛教界的强烈反弹(太虚领导佛教革新运动与之对抗)。\n**内因**: 丛林制度僵化——禅堂规矩废弛, 经忏佛事盛行, 真正参禅者日稀。来果禅师描述当时高旻寺以外的禅堂:「禅堂成了养老院」。\n**转机**: 杨文会(1837-1911)创办金陵刻经处(1866), 刊刻流通禅门典籍; 与日本佛教学者南条文雄的交流, 带回中土失传典籍(如《中论疏》等), 为禅宗复兴奠定文献基础。杨文会门下出太虚、欧阳竟无等人。"}, {"title": "复兴的三大路线 — 丛林路线·学术路线·人间佛教路线", "body": "民国禅宗复兴呈现三条并行的路线:\n**丛林路线(虚云·来果)**: 直接复兴传统禅堂。虚云中兴鸡足山·云门·云居等祖庭, 恢复禅七古规; 来果主持高旻寺三十年, 整顿禅堂规矩, 拒绝经忏, 保持「专门禅堂」本色。此路线以「恢复古制」为旗帜。\n**学术路线(金陵刻经处·支那内学院)**: 杨文会、欧阳竟无、吕澂等以文献整理和义学研究为基础。吕澂对《起信论》与禅宗「性觉」说的批判, 构成民国佛学思想史上最大的义理争论之一。\n**人间佛教路线(太虚)**: 太虚(1890-1947)提出「人间佛教」——佛教不应离世而修, 而应关怀现实人生。太虚不废禅修, 但将重心从「山林禅堂」转向「人间关怀」。此路线后来由净慧的「生活禅」直接继承并落实为修行法门。\n三条路线在1949年后各有延续: 丛林路线由虚云弟子(本焕·佛源·一诚·传印)在大陆延续; 学术路线转为大学佛学研究; 人间佛教路线在台湾由星云·圣严·证严等人发扬光大。"}, {"title": "虚云老和尚(1840-1959) — 兼祧五宗的禅宗泰斗", "body": "虚云, 俗姓萧, 湖南湘乡人, 生于福建泉州。19岁于福州鼓山涌泉寺出家。\n一生兼祧临济·曹洞·沩仰·法眼·云门五宗法脉。\n修复大小寺院八十余处: 鸡足山祝圣寺·南华寺·云门寺·云居山真如寺等。\n1959年于云居山圆寂, 世寿120岁。\n核心贡献: ① 以一己之力复兴多处禅宗祖庭;\n② 坚持农禅并重, 在战乱和文革前夕守住禅堂香火;\n③ 留下大量禅七开示, 强调「参禅要起疑情」的临济宗本色;\n④ 培养了一代法嗣——详见「祖师传承详表」之「虚云老和尚的复兴禅门与传承」。"}, {"title": "来果禅师(1881-1953) — 专门禅堂的守护者", "body": "来果, 俗姓刘, 湖北黄冈人。1905年出家, 1919年参学高旻寺, 1922年任住持, 主持高旻寺三十年。\n来果的贡献在于「守」——守住专门禅堂的纯粹性:\n• 拒绝经忏佛事——高旻寺不接经忏, 保持禅堂本色\n• 改革禅堂规矩——编著《来果禅师语录》《高旻寺规约》\n• 坚持「禅七」制度——每年冬季禅七不断\n1949年后, 来果留在大陆。1953年圆寂。来果与虚云并称民国禅门「一守一兴」——虚云以「兴」为主(复兴祖庭), 来果以「守」为主(守护禅堂纯粹性)。"}, {"title": "净慧长老(1933-2013) — 生活禅的创立", "body": "净慧, 俗姓黄, 湖北新洲人。1951年于广东云门寺虚云座下受戒,\n承接禅宗五家法脉。1956年入中国佛学院, 1979年恢复工作后任《法音》主编20年。\n1988年兴复河北赵州柏林禅寺, 1993年提出「生活禅」理念:\n「觉悟人生, 奉献人生」「将信仰落实于生活, 将修行落实于当下」\n连续举办24届「生活禅夏令营」, 影响数万青年学佛者。\n2003年住持湖北黄梅四祖寺·五祖寺, 2013年于四祖寺圆寂。"}, {"title": "台湾禅门 — 三大体系的并行发展", "body": "1949年后, 台湾成为汉传佛教的重要基地。禅门发展呈现三大体系:\n**法鼓山(圣严法师, 1931-2009)**: 留学日本立正大学获博士学位(论文为明末佛教研究)。1975年赴美弘法, 1977年创办中华佛学研究所。1989年创建法鼓山, 2005年立「中华禅法鼓宗」——将话头禅与默照禅整合为「散乱心→集中心→统一心→无心」四阶次第。圣严以「学术僧」身份, 使禅法教学现代化·系统化。\n**佛光山(星云法师, 1927-2023)**: 临济宗48世。1967年开创佛光山, 以「人间佛教」为旗帜。星云虽非禅堂本位, 但其「禅净共修」「生活禅修」普及了禅法的大众化。佛光山在全球300+道场。\n**中台山(惟觉法师, 1928-2016)**: 早年参学基隆十方大觉禅寺, 长期闭关苦修。1987年创中台禅寺, 以「教禅合一」「丛林学院化」为特色。中台禅寺建筑恢宏, 寺内设佛学院。\n另有慈济(证严法师)等体系, 虽以慈善为主, 但亦有禅修传统。"}, {"title": "禅宗全球化 — 从铃木大拙到正念革命", "body": "**日本→西方(铃木大拙)**: D.T. Suzuki(1870-1966)以《Essays in Zen Buddhism》三卷(1927-1934)将Zen引入西方。铃木的写作以「体验者的证言」为基调, 影响了垮掉的一代(Alan Watts·Gary Snyder·Jack Kerouac)。其传播策略后来受学界批评(过度强调「非理性」「神秘体验」), 但历史影响深远。\n**西方禅修中心**: Philip Kapleau《The Three Pillars of Zen》(1965); Shunryu Suzuki(铃木俊隆)在旧金山建立禅中心, 《Zen Mind, Beginner's Mind》(1970)成为西方禅修经典; Robert Aitken、Ber
