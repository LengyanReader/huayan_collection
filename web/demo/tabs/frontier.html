var GRAPH = {"nodes": [{"id": "person_000a", "n": "龙树", "dy": "古印度", "ti": "华严宗远祖（八宗共祖）", "li": "华严宗远祖", "multi": [], "tp": "patriarch", "b": null, "d": null, "bio": "大乘中观学派创始人。据传入龙宫取回《华严经》下本十万偈流传人间。造《十住毗婆沙论》（《十地品》注释，又称《大不思议论》），被华严宗奉为法统源头。", "wk": ["十住毗婆沙论", "中论"], "wl": {}, "v": 0}, {"id": "person_000b", "n": "世亲", "dy": "古印度", "ti": "唯识宗祖师", "li": null, "multi": [], "tp": "scholar", "b": null, "d": null, "bio": "古印度唯识学派大师。造《十地经论》十二卷，系统注释《华严经·十地品》，其「六相」等名相创新深刻影响华严宗教学。汉译催生了南北朝地论师学派。", "wk": ["十地经论", "唯识三十颂"], "wl": {}, "v": 1}, {"id": "person_006", "n": "佛驮跋陀罗", "dy": "东晋", "ti": "六十华严译者", "li": null, "multi": [], "tp": "translator", "b": 359, "d": 429, "bio": "北天竺迦毗罗卫国人。来华译经大师，于建康道场寺译出《六十华严》（旧华严），共七处八会三十四品。还译《大般泥洹经》等。", "wk": ["大方广佛华严经（六十华严，T09n0278）"], "wl": {}, "v": 1}, {"id": "person_007", "n": "实叉难陀", "dy": "唐", "ti": "八十华严译者", "li": null, "multi": [], "tp": "translator", "b": 652, "d": 710, "bio": "于阗国（今新疆和田）人。奉武则天命来华，主译八十卷《华严经》（T10n0279），法藏曾参与其译场证义。还译《大乘入楞伽经》《大方广普贤所说经》（T0847）等。", "wk": ["大方广佛华严经（八十华严，T10n0279）", "大方广普贤所说经（T0847）"], "wl": {}, "v": 1}, {"id": "person_008", "n": "般若", "dy": "唐", "ti": "四十华严译者", "li": null, "multi": [], "tp": "translator", "b": null, "d": null, "bio": "罽宾国（今克什米尔）人。唐贞元年间来华，译出《四十华严》（T10n0293），即全本《入法界品》。文末《普贤菩萨行愿赞》为藏汉佛教共同尊奉。", "wk": ["大方广佛华严经（四十华严，T10n0293）"], "wl": {}, "v": 1}, {"id": "person_007b", "n": "支娄迦谶", "dy": "后汉", "ti": "最早汉译华严经文者", "li": null, "multi": [], "tp": "translator", "b": null, "d": null, "bio": "月氏国人。后汉桓帝时来华。译出《佛说兜沙经》（T10n0280），为《华严经》中最早被翻译过来的单行经（对应《如来名号品》）。", "wk": ["佛说兜沙经（T10n0280）"], "wl": {}, "v": 1}, {"id": "person_001", "n": "杜顺", "dy": "唐", "ti": "华严初祖", "li": "华严五祖", "multi": [], "tp": "patriarch", "b": 557, "d": 640, "bio": "华严宗初祖。雍州万年人。年十八出家于因圣寺。以《华严法界观门》开创华严宗观法体系。唐太宗赐号'帝心'。", "wk": ["华严法界观门", "华严五教止观"], "wl": {"华严法界观门": "https://cbeta.buddhism.org.hk/xml/T45/T45n1884_001.xml", "华严五教止观": "https://cbeta.buddhism.org.hk/xml/T45/T45n1867_001.xml"}, "v": 1}, {"id": "person_002", "n": "智俨", "dy": "唐", "ti": "华严二祖", "li": "华严五祖", "multi": [], "tp": "patriarch", "b": 602, "d": 668, "bio": "华严宗二祖。天水人。从杜顺出家，后于至相寺从慧光学华严。著《华严经搜玄记》开华严宗经疏之先河，为法藏之师。", "wk": ["华严经搜玄记", "华严一乘十玄门", "华严五十要问答"], "wl": {"华严经搜玄记": "https://cbeta.buddhism.org.hk/xml/T35/T35n1732_001.xml", "华严一乘十玄门": "https://cbeta.buddhism.org.hk/xml/T45/T45n1868_001.xml", "华严五十要问答": "https://cbeta.buddhism.org.hk/xml/T45/T45n1869_001.xml"}, "v": 1}, {"id": "person_003", "n": "法藏", "dy": "唐", "ti": "华严三祖·实际创立者", "li": "华严五祖", "multi": ["译师"], "tp": "patriarch", "b": 643, "d": 712, "bio": "华严宗实际创立者。祖籍康居，生于长安。从智俨学《华严》。参与实叉难陀译场。武则天赐号'贤首'。系统化'五教十宗'判教与'法界观门'观法。讲说《华严经》三十余遍。", "wk": ["华严一乘教义分齐章（五教章）", "华严经探玄记", "华严经义海百门", "华严金师子章", "大乘起信论义记", "十二门论宗致义记"], "wl": {"华严一乘教义分齐章（五教章）": "https://cbeta.buddhism.org.hk/xml/T45/T45n1866_001.xml", "华严经探玄记": "https://cbeta.buddhism.org.hk/xml/T35/T35n1733_001.xml", "华严经义海百门": "https://cbeta.buddhism.org.hk/xml/T45/T45n1875_001.xml", "华严金师子章": "https://cbeta.buddhism.org.hk/xml/T45/T45n1880_001.xml", "大乘起信论义记": "https://cbeta.buddhism.org.hk/xml/T44/T44n1846_001.xml", "十二门论宗致义记": "https://cbeta.buddhism.org.hk/xml/T42/T42n1826_001.xml"}, "v": 1}, {"id": "person_004", "n": "澄观", "dy": "唐", "ti": "华严四祖·集大成者", "li": "华严五祖", "multi": [], "tp": "patriarch", "b": 738, "d": 839, "bio": "华严宗四祖。越州山阴人。历学律、禅、三论、天台、华严诸宗。著《华严经疏》六十卷、《演义钞》九十卷，为华严教学集大成者。历七帝之师。德宗赐号'清凉'。", "wk": ["华严经疏（华严大疏）", "华严经随疏演义钞", "华严法界玄镜", "三圣圆融观门"], "wl": {"华严经疏（华严大疏）": "https://cbeta.buddhism.org.hk/xml/T35/T35n1735_001.xml", "华严经随疏演义钞": "https://cbeta.buddhism.org.hk/xml/T36/T36n1736_001.xml", "华严法界玄镜": "https://cbeta.buddhism.org.hk/xml/T45/T45n1883_001.xml", "三圣圆融观门": "https://cbeta.buddhism.org.hk/xml/T45/T45n1882_001.xml"}, "v": 1}, {"id": "person_005", "n": "宗密", "dy": "唐", "ti": "华严五祖·禅教融合者", "li": "华严五祖", "multi": [], "tp": "patriarch", "b": 780, "d": 841, "bio": "华严宗五祖。果州西充人。初习儒学，后从遂州道圆禅师出家（禅宗荷泽系）。后遇澄观受学华严。融合禅教，著《禅源诸诠集都序》《华严原人论》。", "wk": ["注华严法界观门", "禅源诸诠集都序", "圆觉经大疏释义钞", "华严原人论", "华严经行愿品疏钞"], "wl": {"注华严法界观门": "https://cbeta.buddhism.org.hk/xml/T45/T45n1884_001.xml", "禅源诸诠集都序": "https://cbeta.buddhism.org.hk/xml/T48/T48n2015_001.xml", "圆觉经大疏释义钞": "https://cbeta.buddhism.org.hk/xml/X09/X09n0245_001.xml", "华严原人论": "https://cbeta.buddhism.org.hk/xml/T45/T45n1886_001.xml", "华严经行愿品疏钞": "https://cbeta.buddhism.org.hk/xml/X05/X05n0229_001.xml"}, "v": 1}, {"id": "person_009", "n": "李通玄", "dy": "唐", "ti": "华严居士学者", "li": "李通玄系", "multi": [], "tp": "scholar", "b": 635, "d": 730, "bio": "唐代华严学重要在家学者。深通儒释，专精《华严》，于方山著《新华严经论》四十卷。以《易经》融会华严，方法独树一帜。", "wk": ["新华严经论", "华严经决疑论"], "wl": {"新华严经论": "https://cbeta.buddhism.org.hk/xml/T36/T36n1739_001.xml", "华严经决疑论": "https://cbeta.buddhism.org.hk/xml/T36/T36n1741_001.xml"}, "v": 1}, {"id": "person_011", "n": "净源", "dy": "宋", "ti": "宋代华严中兴之祖", "li": "华严五祖", "multi": [], "tp": "patriarch", "b": 1011, "d": 1088, "bio": "宋代华严宗重要复兴者。住杭州慧因寺。传法于高丽义天，义天归国后送金书《华严经》三种译本供养慧因寺。慧因寺世称'华严第一道场'。", "wk": ["华严经疏注", "华严妄尽还源观疏"], "wl": {}, "v": 1}, {"id": "person_010", "n": "义天", "dy": "宋", "ti": "高丽华严初祖", "li": "高丽华严", "multi": [], "tp": "scholar", "b": 1055, "d": 1101, "bio": "高丽文宗第四子。入宋求法于杭州慧因寺，从净源法师受华严教法。回国后编《新编诸宗教藏总录》（义天录），为华严文献学的奠基性著作。", "wk": ["新编诸宗教藏总录（义天录）", "圆宗文类"], "wl": {}, "v": 1}, {"id": "person_021", "n": "高原明昱", "dy": "明", "ti": "华严宗第二十五世", "li": "华严五祖", "multi": [], "tp": "patriarch", "b": null, "d": null, "bio": "明代华严宗祖师，华严宗第二十五世传人。自他起华严法脉兼传慈恩宗（唯识/法相宗），开创'贤首兼慈恩'传承体系。钦因长老等现代传人皆属此高原法系。", "wk": [], "wl": {}, "v": 0}, {"id": "person_012", "n": "月霞", "dy": "清", "ti": "近现代华严复兴先驱", "li": "月霞系", "multi": [], "tp": "patriarch", "b": 1858, "d": 1917, "bio": "清末民初华严宗复兴的关键人物。于常熟兴福寺创立华严大学（1914年），为中国近代第一所华严专宗教育机构，培养了一批现代华严学僧。", "wk": [], "wl": {}, "v": 0}, {"id": "person_031", "n": "应慈", "dy": "近现代", "ti": "近代华严座主", "li": "月霞系", "multi": [], "tp": "patriarch", "b": 1873, "d": 1965, "bio": "月霞长老师弟。继承月霞遗志，长期在上海等地弘传华严，被尊为'华严座主'。真禅法师之师。平生讲《华严经》多遍。", "wk": [], "wl": {}, "v": 0}, {"id": "person_013", "n": "常惺", "dy": "近现代", "ti": "", "li": "月霞系", "multi": [], "tp": "patriarch", "b": 1896, "d": 1939, "bio": "月霞长老弟子。继月霞之后主持华严大学，于北京、上海等地弘传华严。曾任闽南佛学院院长。", "wk": [], "wl": {}, "v": 0}, {"id": "person_018", "n": "智光", "dy": "近现代", "ti": "华严莲社首任住持", "li": "智光系", "multi": [], "tp": "patriarch", "b": 1889, "d": 1963, "bio": "近代华严学者。台北华严莲社第一任住持（1952年创社），开启台湾华严宗弘传事业。", "wk": [], "wl": {}, "v": 0}, {"id": "person_015", "n": "南亭", "dy": "近现代", "ti": "华严莲社第二任住持", "li": "华严莲社", "multi": [], "tp": "patriarch", "b": 1900, "d": 1982, "bio": "智光法师弟子。1952年与师智光共创台北华严莲社，任第二任住持。长期弘传华严教观，为台湾华严宗发展奠基人。", "wk": [], "wl": {}, "v": 0}, {"id": "person_016", "n": "成一", "dy": "当代", "ti": "华严莲社第三任住持·华严专宗学院创办人", "li": "华严莲社", "multi": [], "tp": "patriarch", "b": 1914, "d": 2011, "bio": "江苏泰县人。15岁出家。1949年赴台，协助师祖南亭和尚创办华严莲社，1972年继任住持。1975年创办华严专宗学院，以'专修、专研、专弘华严'为宗旨。1985年创立美国华严莲社。著有多部华严学著作。1988年后恢复泰州光孝寺等大陆祖庭。", "wk": ["成一和尚著作集"], "wl": {}, "v": 0}, {"id": "person_032", "n": "了中", "dy": "当代", "ti": "华严莲社第四任住持", "li": "华严莲社", "multi": [], "tp": "patriarch", "b": 1932, "d": 2022, "bio": "华严莲社第四任住持。延续'专研、专修、专弘'华严的莲社传统。", "wk": [], "wl": {}, "v": 0}, {"id": "person_033", "n": "净海", "dy": "当代", "ti": "华严莲社第五任住持", "li": "华严莲社", "multi": [], "tp": "patriarch", "b": null, "d": null, "bio": "华严莲社第五任住持。", "wk": [], "wl": {}, "v": 0}, {"id": "person_017", "n": "贤度", "dy": "当代", "ti": "华严莲社第六任住持·华严专宗学院院长", "li": "华严莲社", "multi": [], "tp": "patriarch", "b": 1960, "d": null, "bio": "当代华严宗女性法嗣传承者。成一法师弟子。2005年获印度德里大学哲学博士。推动华严现代化转型：发行《华严乐坛》专辑、AI多媒体文创演绎五十三参。著有《华严学讲义》《华严净土思想与念佛法门》等。", "wk": ["华严学讲义", "华严净土思想与念佛法门", "大海的印迹：贤度法师传"], "wl": {}, "v": 0}, {"id": "person_034", "n": "明度", "dy": "当代", "ti": "华严莲社第七任住持", "li": "华严莲社", "multi": [], "tp": "patriarch", "b": null, "d": null, "bio": "贤度法师之后，续掌华严莲社。贤首宗'明众生本际，悟诸佛果源'演字辈之一。", "wk": [], "wl": {}, "v": 0}, {"id": "person_041", "n": "钦因", "dy": "当代", "ti": "贤首宗第四十一世·高原法系第十七世", "li": "贤首宗高原法系", "multi": [], "tp": "patriarch", "b": 1928, "d": null, "bio": "北京人，俗名阎凤麟。贤首宗高原法系第41世。2008年9月21日于台北大华严寺举行传法大典，将法脉衣钵传予海云继梦(42世)。", "wk": [], "wl": {}, "v": 0}, {"id": "person_042", "n": "海云继梦", "dy": "当代", "ti": "三脉汇一的当代华严传承者·大华严寺导师", "li": "贤首宗高原法系", "multi": ["临济宗"], "tp": "patriarch", "b": 1950, "d": null, "bio": "俗名陈鹤山，台湾宜兰人。中兴大学经济系毕业。1991年于梦参长老座下出家（临济宗第四十七代，法名昌一，号继梦）。2008年受钦因长老传华严宗衣钵（贤首宗第四十二世）。同年得印度胜师子王菩萨传大乘瑜伽行法。汇三脉归一，开创'普贤乘华严宗'，复兴失传八百余年的'东山法门'。现为南投大华严寺导师。建立'无", "wk": [], "wl": {}, "v": 0}, {"id": "person_043", "n": "体佛", "dy": "当代", "ti": "贤首禅苑", "li": "贤首宗高原法系", "multi": [], "tp": "patriarch", "b": null, "d": null, "bio": "钦因长老法嗣之一。创立贤首禅苑，弘扬华严禅法。", "wk": [], "wl": {}, "v": 0}, {"id": "person_019", "n": "梦参", "dy": "当代", "ti": "当代华严弘扬巨擘", "li": "临济宗", "multi": [], "tp": "practitioner", "b": 1915, "d": 2017, "bio": "当代高僧，临济宗第四十六代。曾于五台山闭关修行多年。晚年大力弘扬《华严经》，讲说全本《八十华严》影响深远。1991年破例为海云继梦剃度（梦中得地藏菩萨示现），赐法名昌一。", "wk": ["华严经讲记（全本）"], "wl": {}, "v": 0}, {"id": "person_014", "n": "慈舟", "dy": "近现代", "ti": "", "li": "慈舟系", "multi": [], "tp": "scholar", "b": 1877, "d": 1958, "bio": "近代华严学者。长期于北京广济寺、济南等地讲说华严。著《华严经普贤行愿品亲闻记》，对《普贤行愿品》在现代的弘扬有重要推动。", "wk": ["华严经普贤行愿品亲闻记"], "wl": {}, "v": 0}, {"id": "person_044", "n": "真禅", "dy": "当代", "ti": "大陆当代华严禅实践者", "li": "月霞系", "multi": ["临济宗"], "tp": "patriarch", "b": 1916, "d": 1995, "bio": "当代大陆弘扬华严的代表性高僧。'禅宗临济、教在华严、行归地藏普贤'。师承应慈法师。1980年代后在玉佛寺多次主持华严佛七法会，宣讲《普贤行愿品》《十地品》。著有《玉佛丈室集》十集。", "wk": ["玉佛丈室集"], "wl": {}, "v": 0}, {"id": "person_045", "n": "如孝", "dy": "当代", "ti": "华严宗第四十一世法脉传人", "li": "华严宗", "multi": [], "tp": "scholar", "b": null, "d": null, "bio": "当代华严思想学者。师承星云长老、传印长老、法映长老。十余年研究华严思想当代实践。提出'别教一乘三类体系''法界十门体系''八纲体系'等。著有《生命的艺术》《修行的艺术》等丛书。2024年在《三秦宗教》刊发论文。", "wk": ["生命的艺术", "修行的艺术"], "wl": {}, "v": 0}, {"id": "person_046", "n": "雪窦", "dy": "当代", "ti": "美国华严莲社", "li": null, "multi": [], "tp": "scholar", "b": null, "d": null, "bio": "美国华严莲社相关人员，推动华严教法在海外英语世界的传播。", "wk": [], "wl": {}, "v": 0}, {"id": "person_020", "n": "胜友", "dy": "唐", "ti": "藏译华严经主译之一", "li": null, "multi": [], "tp": "translator", "b": null, "d": null, "bio": "印度译师。与智军（Ye shes sde）、遍照护（Vairocana）约9世纪初将《华严经》译为藏文（德格版Toh 44）。译自中亚于阗原本。", "wk": ["藏译华严经（Toh 44）"], "wl": {}, "v": 0}, {"id": "person_020b", "n": "智军", "dy": "唐", "ti": "藏译华严经主译之一", "li": null, "multi": [], "tp": "translator", "b": null, "d": null, "bio": "吐蕃著名译师。与印度胜友合作将《华严经》从于阗本译为藏文。为吐蕃王朝佛教翻译事业的核心人物。", "wk": ["藏译华严经（Toh 44）"], "wl": {}, "v": 1}, {"id": "person_050", "n": "审祥", "dy": "唐/日本", "ti": "日本华严宗初传", "li": "日本华严", "multi": [], "tp": "patriarch", "b": null, "d": 742, "bio": "新罗僧。来华从法藏学华严。后赴日本，于东大寺宣讲《华严经》，为日本华严宗之初传。", "wk": [], "wl": {}, "v": 0}, {"id": "person_110", "n": "法显", "dy": "东晋", "ti": "西行求法先驱", "li": "求法僧", "multi": [], "tp": "practitioner", "b": 337, "d": 422, "bio": "东晋高僧。399年以65岁高龄从长安出发,经河西走廊、西域、中亚至印度,历时14年游历30余国。412年海路归国。著《佛国记》记录印度佛教圣迹,为中国首位完成印度求法之旅的僧人。", "wk": ["佛国记(高僧法显传)"], "wl": {}, "v": 1}, {"id": "person_111", "n": "玄奘", "dy": "唐", "ti": "大翻译家·法相宗创始人", "li": "求法僧", "multi": [], "tp": "translator", "b": 602, "d": 664, "bio": "唐代高僧。629年从长安西行,经西域中亚至印度那烂陀寺,师从戒贤。645年归国携657部梵本,主持译场译经75部1335卷。著《大唐西域记》,创中国法相唯识宗。", "wk": ["大唐西域记", "大般若经", "成唯识论"], "wl": {}, "v": 1}, {"id": "person_112", "n": "义净", "dy": "唐", "ti": "海上求法僧·译经家", "li": "求法僧", "multi": [], "tp": "translator", "b": 635, "d": 713, "bio": "唐代高僧。671年从广州乘波斯船经海路至印度,游历那烂陀寺等30余国。695年归国携梵本400余部,译经56部230卷,偏重律藏。著《南海寄归内法传》《大唐西域求法高僧传》。与法显、玄奘并称三大求法僧。", "wk": ["南海寄归内法传", "大唐西域求法高僧传"], "wl": {}, "v": 1}, {"id": "person_113", "n": "真谛", "dy": "梁/陈", "ti": "四大译经师之一", "li": "译师", "multi": [], "tp": "translator", "b": 499, "d": 569, "bio": "西印度优禅尼国人。梁大同十二年(546)来华,值梁末战乱辗转各地译经。译《摄大乘论》《俱舍论》等64部278卷,系统传译瑜伽行派唯识学。与鸠摩罗什、玄奘、义净并称四大译经师。", "wk": ["摄大乘论", "俱舍论", "大乘起信论(重译)"], "wl": {}, "v": 1}, {"id": "person_114", "n": "求那跋陀罗", "dy": "刘宋", "ti": "楞伽经主译", "li": "译师", "multi": [], "tp": "translator", "b": 394, "d": 468, "bio": "中印度人。刘宋元嘉十二年(435)经海路至广州,后至建康译经。译《楞伽经》《胜鬘经》《杂阿含经》等52部134卷。其楞伽译本后为禅宗初祖达摩授与二祖慧可,影响禅宗思想深远,亦与华严如来藏思想有深层义学会通。", "wk": ["楞伽阿跋多罗宝经", "胜鬘经", "杂阿含经"], "wl": {}, "v": 1}, {"id": "person_115", "n": "不空", "dy": "唐", "ti": "密宗开元三大士之一", "li": "译师", "multi": [], "tp": "translator", "b": 705, "d": 774, "bio": "师子国(斯里兰卡)人,一说北印度人。幼来华师事金刚智。741年赴师子国和印度求法,746年归国携梵本500余部。译《金刚顶经》等密教经典,与善无畏、金刚智并称开元三大士。华严宗密法(秽迹金刚)与此传承有历史关联。", "wk": ["金刚顶经", "大乘密严经"], "wl": {}, "v": 1}, {"id": "person_116", "n": "竺法护", "dy": "西晋", "ti": "敦煌菩萨·大译经家", "li": "译师", "multi": [], "tp": "translator", "b": 239, "d": 316, "bio": "月氏侨民,世居敦煌。随师游历西域诸国,通晓36国语言。译经149部,包括华严经中《渐备一切智德经》(十地品异译)、《等目菩萨三昧经》(十定品异译)、《如来兴显经》(如来出现品异译)等多部华严单行经。被尊为'敦煌菩萨'。", "wk": ["渐备一切智德经", "如来兴显经", "正法华经"], "wl": {}, "v": 1}, {"id": "person_117", "n": "慧超", "dy": "唐/新罗", "ti": "新罗求法僧", "li": "求法僧", "multi": [], "tp": "practitioner", "b": 704, "d": 787, "bio": "新罗僧。约723年从中国出发经海路至印度,游历五天竺佛教圣迹。727年归国后著《往五天竺国传》记录印度、中亚、西域见闻。该书敦煌残卷于1908年为伯希和发现,为研究8世纪中亚印度的珍贵一手文献。", "wk": ["往五天竺国传"], "wl": {}, "v": 1}, {"id": "person_120", "n": "善无畏", "dy": "唐", "ti": "开元三大士之首·密宗初传", "li": "译师", "multi": [], "tp": "translator", "b": 637, "d": 735, "bio": "中印度人,甘露王后裔。716年至长安,玄宗礼为国师。译《大日经》七卷,传胎藏界密法。与金刚智、不空并称开元三大士,为中国密宗奠基人。弟子一行协助译经并著《大日经疏》。", "wk": ["大日经(大毗卢遮那成佛神变加持经)", "苏婆呼童子请问经"], "wl": {}, "v": 1}, {"id": "person_121", "n": "金刚智", "dy": "唐", "ti": "开元三大士·金刚界密法", "li": "译师", "multi": [], "tp": "translator", "b": 671, "d": 741, "bio": "南印度摩赖耶国人。719年经海路至广州,次年抵长安。译《金刚顶经》传金刚界密法。与善无畏、不空并称开元三大士。弟子不空继承其法脉,后传入日本成真言宗。", "wk": ["金刚顶瑜伽中略出念诵经", "七俱胝佛母准提大明陀罗尼经"], "wl": {}, "v": 1}, {"id": "person_122", "n": "一行", "dy": "唐", "ti": "天文学家·密宗学僧", "li": "译师", "multi": [], "tp": "scholar", "b": 683, "d": 727, "bio": "唐代高僧,俗名张遂。精通天文历算,制《大衍历》。师事善无畏,协助译《大日经》并著《大日经疏》二十卷,为密宗义学之奠基著作。一行亦曾参学禅宗北宗普寂。", "wk": ["大日经疏", "大衍历"], "wl": {}, "v": 1}, {"id": "person_123", "n": "慧果", "dy": "唐", "ti": "密宗第七祖·青龙寺", "li": "译师", "multi": [], "tp": "patriarch", "b": 746, "d": 805, "bio": "唐代密宗高僧。师事不空,兼承善无畏胎藏界与金刚智金刚界两部密法。住长安青龙寺,为密宗集大成者。日本空海入唐即从慧果受法,归国后创立日本真言宗。", "wk": [], "wl": {}, "v": 1}, {"id": "person_124", "n": "空海", "dy": "唐/日本", "ti": "日本真言宗开祖·弘法大师", "li": "日本华严", "multi": [], "tp": "patriarch", "b": 774, "d": 835, "bio": "日本真言宗开祖。804年入唐,于长安青龙寺从慧果受两部密法。806年归国后于高野山开创真言宗。著《十住心论》以华严判教框架判摄显密诸宗,体现密教与华严义学之深层对话。", "wk": ["十住心论", "即身成佛义", "秘密曼荼罗十住心论"], "wl": {}, "v": 1}, {"id": "person_125", "n": "六师外道", "dy": "古印度", "ti": "佛陀时代非佛教思想家", "li": "印度源流", "multi": [], "tp": "scholar", "b": null, "d": null, "bio": "与释迦牟尼同时代的六位印度思想家。据《沙门果经》记载:富兰那迦叶(道德否定论)、末伽梨拘舍罗(宿命论)、散若夷毗罗梨子(不可知论)、阿耆多翅舍钦婆罗(唯物论)、迦罗鸠驮迦旃延(原子论)、尼乾陀若提子(耆那教创始人)。佛教教义正是在与这些学派的对话与辩驳中确立的。", "wk": [], "wl": {}, "v": 1}, {"id": "person_126", "n": "成观法师", "dy": "当代", "ti": "华严宗42世·真言宗53世阿阇梨·大毘卢寺住持", "li": "贤首宗高原法系", "multi": [], "tp": "patriarch", "b": 1947, "d": null, "bio": "台北人,台师大英语系毕业(1972),美国德州TCU英研所深造。1988年于纽约庄严寺依天台宗45代显明老和尚出家,同年于基隆海会寺受三坛大戒。1996年于日本高野山入坛受金胎两部大法,得传法灌顶阿阇梨位,为真言宗53世。2010年4月24日于台北福慧寺依钦因长老受华严兼慈恩法脉,为高原法系贤首宗4", "wk": ["楞伽经义贯", "大佛顶首楞严经义贯", "大乘百法明门论今注", "唯识三十论颂义贯"], "wl": {}, "v": 1}, {"id": "person_f01", "n": "思元慧三", "dy": "近现代", "ti": "高原法系40世·福慧寺开山", "li": "贤首宗高原法系", "tp": "patriarch", "b": 1901, "d": 1986, "bio": "宛平人，俗姓霍。北京广善寺第11代住持。1948年赴台，创树林福慧寺。民国37年来台时已47岁，随身仅带一尊华严三圣像。为高原法系在台根本道场开创者。", "wk": []}, {"id": "person_f02", "n": "体化性果", "dy": "当代", "ti": "福慧寺第三代住持", "li": "贤首宗高原法系", "tp": "patriarch", "b": 1950, "d": null, "bio": "钦因长老法嗣。福慧寺第三代住持。继承贤首宗高原法系在台弘法事业。", "wk": []}, {"id": "person_j01", "n": "良弁", "dy": "唐/日本", "ti": "东大寺初代别当", "li": "日本华严", "tp": "patriarch", "b": 689, "d": 773, "bio": "审祥弟子。东大寺开山。主持《华严经》讲说。", "wk": []}, {"id": "person_j02", "n": "实忠", "dy": "日本", "ti": "东大寺二代", "li": "日本华严", "tp": "patriarch", "b": 726, "d": 800, "bio": "良弁弟子。继承东大寺华严教学。", "wk": []}, {"id": "person_j03", "n": "等定", "dy": "日本", "ti": "东大寺华严", "li": "日本华严", "tp": "patriarch", "b": 800, "d": 870, "bio": "日本华严宗传承者。", "wk": []}, {"id": "person_j04", "n": "圣宝", "dy": "日本", "ti": "醍醐寺开山", "li": "日本华严", "tp": "patriarch", "b": 832, "d": 909, "bio": "理源大师。兼传真言与华严。", "wk": []}, {"id": "person_j05", "n": "观贤", "dy": "日本", "ti": "东大寺别当", "li": "日本华严", "tp": "patriarch", "b": 853, "d": 925, "bio": "东大寺华严教学之中兴。", "wk": []}, {"id": "person_s01", "n": "魏道儒", "dy": "当代", "ti": "中国社科院学部委员", "li": p": "patriarch", "b": null, "d": null, "bio": "梵名Dīpaṃkara。过去无量劫前之佛。据华严经如来名号品及本生经典，燃灯佛曾为释迦牟尼前身授记: 汝于来世当得作佛号释迦牟尼。此为华严经中佛佛相续无尽法界缘起之始。", "wk": [], "v": 1}, {"id": "person_106", "n": "迦叶佛", "dy": "远古印度", "ti": "贤劫第三佛·释迦前身之师", "li": "印度源流", "tp": "patriarch", "b": null, "d": null, "bio": "梵名Kāśyapa。贤劫千佛之第三尊，释迦牟尼佛之前一佛。据华严经，释迦成道时十方诸佛各遣菩萨来集，其中包括过去诸佛之法身显现。华严宗以十方三世无尽诸佛构成法界缘起之佛佛相望网络。", "wk": [], "v": 1}, {"id": "person_107", "n": "毗卢遮那佛", "dy": "法身常住", "ti": "华严教主·法身本源", "li": "印度源流", "tp": "patriarch", "b": null, "d": null, "bio": "梵名Vairocana，华严经之根本教主。意译光明遍照、大日如来。华严经以毗卢遮那佛法身为宇宙本体，十方三世一切诸佛皆为其化现。华严宗法界缘起、一即一切等核心教义皆围绕毗卢遮那佛法身展开。非历史人物，为华严教义之法身源头。", "wk": [], "v": 1}, {"id": "person_130", "n": "拉克鲁希", "dy": "远古印度", "ti": "湿婆神第28代化身·Lord Lakulish", "li": "大乘瑜伽行法", "tp": "patriarch", "b": null, "d": null, "bio": "Lord Lakulish。相传为4500年前湿婆神第28代化身,为印度古典瑜伽行法之原始指导者。其传承历经千年,于现代示现指导巴布基大瑜伽士。", "wk": [], "v": 0}, {"id": "person_131", "n": "巴布基", "dy": "近现代", "ti": "大瑜伽士·Babuji", "li": "大乘瑜伽行法", "tp": "practitioner", "b": null, "d": null, "bio": "Babuji(巴布基大瑜伽士)。Lord Lakulish示现指导的大成就者,传承古典瑜伽行法。", "wk": [], "v": 0}, {"id": "person_132", "n": "普拉梵纳德", "dy": "近现代", "ti": "Swami Pranavanad", "li": "大乘瑜伽行法", "tp": "practitioner", "b": 1884, "d": 1959, "bio": "Swami Pranavanad。1913年普贤菩萨于印度再度示现,为其传法。开创现代大乘瑜伽行法传承。", "wk": [], "v": 0}, {"id": "person_133", "n": "克利普梵纳德", "dy": "近现代", "ti": "Swami Kripalavanand", "li": "大乘瑜伽行法", "tp": "practitioner", "b": 1913, "d": 1981, "bio": "Swami Kripalavanand。1932年从普拉梵纳德接法,继续弘扬大乘瑜伽行法。", "wk": [], "v": 0}, {"id": "person_134", "n": "胜师子王菩萨", "dy": "当代", "ti": "Swami Rajarshi Muni·印度国师", "li": "大乘瑜伽行法", "tp": "practitioner", "b": 1931, "d": 2023, "bio": "Swami Rajarshi Muni(惹查西牟尼)。1971年从克利普梵纳德接法。1993年Lakulish以灵性形象示现,遂创立LIFE Mission。被尊为印度国师,2019年获印度总理奖。2008年12月于阿弥塔巴市传大乘瑜伽行法灌顶予海云继梦。已圆寂(约2023年)。", "wk": [], "v": 0}, {"id": "person_140", "n": "罗摩克里希纳", "dy": "1836–1886", "ti": "Ramakrishna·近代印度灵性复兴之源", "li": "参考线", "tp": "practitioner", "b": 1836, "d": 1886, "bio": "R var GAP = {"vs": [{"n": "藏文德格版 (Toh 44)", "c": 45, "v": "4册", "t": "胜友、智军", "p": "9世纪初"}, {"n": "汉文八十华严 (T10n0279)", "c": 39, "v": "80卷", "t": "实叉难陀", "p": "699年"}, {"n": "汉文六十华严 (T09n0278)", "c": 34, "v": "60卷", "t": "佛驮跋陀罗", "p": "420年"}, {"n": "汉文四十华严 (T10n0293)", "c": 1, "v": "40卷", "t": "般若", "p": "798年"}], "sm": {"A": 2, "B": 3, "C": 3, "D": 1, "E": 32}, "cs": [{"bo": 7, "z80": 7, "ti": "如来名号品", "sa": "", "tp": "C", "sm": "藏文此品位于《如来华严品》之后，故品目序号从汉文第7品变为藏文第12品。内容基本对应但结构位置不同。"}, {"bo": 11, "z80": null, "ti": "如来华严品", "sa": "Tathāgatāvataṃsaka", "tp": "A", "sm": "藏文独有品目。汉文六十华严、八十华严、四十华严均无此品。"}, {"bo": 27, "z80": 26, "ti": "十地品", "sa": "", "tp": "B", "sm": "藏文十地品可能源自更完整的梵本，结构接近独立《十地经》(Daśabhūmika)。与汉文十地品在细节上有参差。"}, {"bo": 28, "z80": null, "ti": "普贤宣说品", "sa": "Samantabhadraparivarta", "tp": "A", "sm": "藏文独有品目。汉文六十华严、八十华严、四十华严均无此品。"}, {"bo": 33, "z80": 31, "ti": "寿量品", "sa": "", "tp": "B", "sm": "藏文可能有更详尽的诸佛寿量描述。"}, {"bo": 39, "z80": 37, "ti": "如来出现品", "sa": "", "tp": "C", "sm": "六十华严无此品（仅34品）。八十华严对应《如来出现品》，六十华严对应第33品《宝王如来性起品》，名称和结构均有不同。"}, {"bo": 40, "z80": 38, "ti": "离世间品", "sa": "", "tp": "B", "sm": "藏文此品有部分独特异译段落，与汉文同名品内容有实质性参差。"}, {"bo": 41, "z80": 39, "ti": "入法界品", "sa": "Gaṇḍavyūha", "tp": "C", "sm": "四十华严即此品全本。藏文《入法界品》为全本。六十华严缺此品（仅有34品）。汉文有多个别译本。"}], "wn": ["⚠ T0309 法藏判为非十住品亦非十地品"], "content": {"core_finding": "藏文《华严经》(Toh44)译自中亚于阗原本，而非印度梵本。汉文《八十华严》亦由于阗请来梵本，但两者所据底本已不同——九世纪时华严梵本已多系分化。藏文45品中有2品为汉文三译所完全缺失（如来华严品、普贤宣说品），另有3品有实质性内容参差。", "diff_summary": {"categories": {"A": {"icon": "🔴", "label": "藏文独有品目", "color": "#c46b5d", "description": "汉文三译完全缺失"}, "B": {"icon": "🟠", "label": "内容实质性参差", "color": "#c8893e", "description": "同名品内容有显著差异"}, "C": {"icon": "🟡", "label": "结构/开合不同", "color": "#a08020", "description": "品目序号名称开合不同"}, "D": {"icon": "🔵", "label": "品目级微小差异", "color": "#5e8b9e", "description": "个别段落不同"}, "E": {"icon": "🟢", "label": "汉藏基本对应", "color": "#7d9a6e", "description": "32品大致一致"}}}, "case_studies": [{"id": 1, "title": "案例一: Samantabhadra 译名差异", "content": "藏文「kun tu bzang po」→ 汉译多作「普贤」。但84000翻译注释指出，汉文个别处作「普贤尊」（pu xian zun, Lord Samantabhadra），而藏文保持统一译法。此差异反映汉译者对不同语境下的敬称处理。\n"}, {"id": 2, "title": "案例二: gata 多义歧出", "content": "同一梵文词 gata（「已去/已至」 vs 「现在/存在」），藏文和汉文译者在不同品中选择不同义项，导致同一段落产生「如来已去」和「如来现前」两种截然不同的理解。\n"}, {"id": 3, "title": "案例三: 底本系谱分化", "content": "德格版Tshalpa系与Themephangma系之间，同一品末偈颂有出入（后者缺末偈）。84000翻译以Tshalpa为底本，Themephangma异读入校注。此说明藏文大藏经内部亦存在版本分化。\n"}, {"id": 4, "title": "案例四: 「如孝子心」版本歧异", "content": "同一段落: 六十华严作「发孝子心，见善知识无厌足故」；八十华严增「承顺颜色故」；四十华严又增「承事供养」。藏文本将su-putra直译，未添加「孝」的汉文化概念。越晚译本解释性附加语越长。\n"}], "scholarly_perspectives": [{"author": "Imre Hamar", "affiliation": "Eötvös Loránd University, 匈牙利科学院博士", "content": "「华严经在印度和中亚并非一时一地之作，而是由多部原本独立的单行经（如《十地品》《入法界品》）于公元2-4世纪逐步汇集而成。藏汉译本的差异，本质上是不同编纂阶段和不同地域传统的反映。」—— 参见其博士论文 The Buddhāvatamsaka-sūtra and Its Chinese Interpretation (2014) 及 The Metaphor of the Painter (SOS 13·2, 2014).\n"}, {"author": "高明道", "affiliation": "台湾华严学者", "content": "「南极汉文《华严经》，由于译者抉择各异，撰述注释的古德就有不同空间可发挥。参考藏译本便可发现，诠释的领域又不一样。即使有印度语文本可供对照，个人的解读终究脱离不了诠释。」\n"}, {"author": "84000翻译团队 (Peter Alan Roberts 等)", "content": "「华严经的梵文原本在古代即存在至少两种以上版本。证据包括「观世音/观自在」拼写差异——法藏《探玄记》卷19明确记载了这种拼写分歧。」\n"}], "methodology_84000": {"intro": "84000项目（Peter Alan Roberts团队）在翻译Toh44时采用多底本对校方法，其翻译注释体系为汉藏对勘提供了重要参考框架：", "categories": ["① 梵-藏歧异: 藏译本与现存梵文写本的出入（藏译者是否据另本或误读）", "② 甘珠尔版本间异读: 德格/斯托克/永乐/理塘/康熙/那塘/拉萨/Choné 八种版本的异文记录", "③ 抄写错误: 藏文抄本中的明显笔误（如 rgyu 误作 sgyu ma「幻」）", "④ 注释书佐证: 据世亲《十地经论》及 Sūryasiddha 注释判定疑误字", "⑤ 汉译旁证: 当梵藏歧异无法判定时，以汉译本（实叉难陀/佛驮跋陀罗）作为第三参照系", "⑥ 数字出入: 如《十地品》梵本作「百千俱胝」，德格版甘珠尔改为极大数，而世亲注释支持梵本简数"]}, "structural_differences": "汉译「会」制度 vs 藏译连续品目\n\n汉文八十华严按七处九会（七个地点·九次法会）组织经文；六十华严为七处八会。此为汉地祖师（智俨/法藏/澄观）判释所立。\n\n藏文 Toh44 不采用「会」的分组体系——45品为连续编号，无中间层的法会分组。这一结构差异意味着：汉文读者透过「会」的框架理解华严经的教义递进，而藏文读者直接面对45品的内容序列。两种组织方式各代表不同的解经传统，不能简单互译。\n", "consensus_table": [{"topic": "藏译本底本是否为于阗本", "viewpoint": "BDRC目录标注为于阗译出。部分学者认为有印度梵本中介", "consensus": "85% consensus", "color": "#7d9a6e"}, {"topic": "Ch.11 如来华严品是否为独立经典后并入", "viewpoint": "结构分析支持独立说，但无直接文献证据", "consensus": "disputed", "color": "#c8893e"}, {"topic": "「观世音/观自在」拼写差异是否证明多版本", "viewpoint": "法藏《探玄记》卷19明确记载差异；质疑者认为仅是音译习惯", "consensus": "60% consensus", "color": "#a08020"}, {"topic": "藏文《离世间品》异译段落的来源", "viewpoint": "可能反映更古老的于阗传承；学界尚未系统对勘", "consensus": "unknown", "color": "#c46b5d"}], "priority_roadmap": [{"level": "P0", "color": "#c46b5d", "label": "最高优先", "content": "Ch.11 如来华严品 · Ch.28 普贤宣说品 — 汉文三译全缺，学术价值最高。\n获取路径: ① BDRC/BUDA API (buda.bdrc.io, 需注册) → Toh44 Unicode电子文本 ② 84000项目: 已发布入法界品(2021), Ch.11+Ch.28尚未发布 ③ 兜底: 学术论文中对藏文独有品目的研究摘要。目前P0阶段可先整理已知内容结构大纲。\n"}, {"level": "P1", "color": "#c8893e", "label": "高优先", "content": "Ch.27 十地品 · Ch.40 离世间品 — 有鸠摩罗什《十住经》、世亲《十地经论》、竺法护《度世品经》等别译可作对勘桥梁。\n"}, {"level": "P2", "color": "#a08020", "label": "中优先", "content": "Ch.33 寿量品 · Ch.39 如来出现品 — 有玄奘《显无边佛土功德经》和竺法护《如来兴显经》等别译可对照。\n"}], "version_evolution": [{"t": "龙宫原本", "s": "约2世纪", "l": "印度", "lang": "梵", "c": "#9e8b6e", "n": "上中下三本·下本十万偈", "w": 120}, {"t": "兜沙经", "s": "167", "l": "洛阳", "lang": "汉", "c": "#a09080", "n": "支娄迦谶·1卷", "w": 110}, {"t": "六十华严", "s": "420", "l": "建康", "lang": "汉", "c": "#b8863c", "n": "佛驮跋陀罗·60卷34品", "w": 130}, {"t": "八十华严", "s": "699", "l": "洛阳", "lang": "汉", "c": "#b8863c", "n": "实叉难陀·80卷39品", "w": 130}, {"t": "四十华严", "s": "798", "l": "长安", "lang": "汉", "c": "#b8863c", "n": "般若·40卷入法界品", "w": 130}, {"t": "藏译华严", "s": "~830", "l": "吐蕃", "lang": "藏", "c": "#c46b5d", "n": "胜友/智军·4册45品", "w": 130}, {"t": "尼泊尔写本", "s": "11-12c", "l": "加德满都", "lang": "梵", "c": "#9e8b6e", "n": "梵文残卷", "w": 100}, {"t": "西夏译本", "s": "11-13c", "l": "西夏", "lang": "西夏", "c": "#8b7a9e", "n": "据八十华严译", "w": 110}, {"t": "回鹘译本", "s": "13-14c", "l": "高昌", "lang": "回鹘", "c": "#8b7a9e", "n": "安藏译", "w": 90}, {"t": "满文译本", "s": "18c", "l": "北京", "lang": "满", "c": "#8b7a9e", "n": "四体合璧", "w": 100}, {"t": "Cleary英译", "s": "1984-87", "l": "美国", "lang": "英", "c": "#5e8b9e", "n": "据八十华严", "w": 110}, {"t": "Dharmamitra", "s": "2022", "l": "美国", "lang": "英", "c": "#5e8b9e", "n": "据八十华严·3册", "w": 120}, {"t": "84000英译", "s": "2021-", "l": "国际", "lang": "英", "c": "#c46b5d", "n": "据藏文Toh44", "w": 110}], "references": ["Imre Hamar. The Buddhāvatamsaka-sūtra and Its Chinese Interpretation. 匈牙利科学院博士论文, 2014.", "Imre Hamar. The Metaphor of the Painter in the Avatamsaka-sutra and Its Chinese Interpretations. SOS 13·2, 2014.", "Peter Alan Roberts (tr.). The Stem Array (Gaṇḍavyūha, Toh 44-45). 84000 Project, 2021.", "高明道. 《谈谈翻译与诠释——以《华严》数偈为例》. 《法光》第236期, 2009.", "孙飞鹏. 《〈华严经〉卷十一夏汉文本对勘研究》. 《西夏学》第十辑(2013年第2期), 页75-80.", "吴国圣. 华严经典中的「牛头」——以梵、于阗、汉、藏、满文佛经译本为主的讨论. 2015.", "铃木大拙 (D.T. Suzuki). 三本《华严经》的异同及其要义. 《禅论集之三·菩萨行处》.", "邓葶愉. 再雕高丽藏之周本《华严经》版本源流考. 华严专宗学院, 2020.", "庄垣内正弘、百济康义等. 回鹘文《华严经》与汉文底本对应研究."], "data_sources": ["Asian Legacy Library (ALL) — Kangyur ZIP (122MB) · 藏文 Wylie 转写全45品", "84000 Project — Toh44-31/Toh44-45 英译 PDF + 校勘注", "BDRC/BUDA — Work ID WA0RK0044 · 德格版6函扫描件 (library.bdrc.io)", "ACIP — Release KD0044 · 藏文纯文本 (asianclassics.org → Asian Legacy Library)", "CBETA — 汉文大藏经全文 (cbetaonline.dila.edu.tw)"], "links": [{"text": "84000 The Ten Bhūmis (Toh44-31)", "url": "https://84000.co/translation/toh44-31"}, {"text": "The Stem Array (Toh44-45)", "url": "https://read.84000.co/translation/toh44-45.html"}, {"text": "84000 Scholar's Room", "url": "https://scholar.84000.co/article/a-multitude-of-buddhas-kangyur-section"}, {"text": "CBETA 八十华严 T10n0279", "url": "https://cbetaonline.dila.edu.tw/zh/T10n0279"}, {"text": "CBETA 六十华严 T09n0278", "url": "https://cbetaonline.dila.edu.tw/zh/T09n0278"}]}, "avatamsaka_studies": {"sections": [{"id": "origins", "title": "起源与形成", "icon": "🌏", "intro": "《华严经》(Skt. Buddhāvataṃsaka)并非一次性成书。学术界公认:\n原本独立的华严类小品经典(如《十地经》《入法界品》《兜沙经》等),\n约在公元2-4世纪间, 从南印度→北印度→中亚(西域)流传过程中不断汇集增补,\n最终在**于阗(今新疆和田)**编纂集成为大本《华严经》。\n", "topics": [{"title": "于阗编纂说——学术共识", "body": "支持于阗为最终编纂地的关键证据:\n(1) 文献证据: 印度本土只有单品流传, 龙树《大智度论》及寂天《集菩萨学论》\n所引华严类经典均未超出少数零部, 说明印度本无大部《华严经》。\n(2) 语言证据: 梵本《树严经》及八十华严卷五十八中出现\"ysa\"一词,\n属于**于阗文而非梵文**, 暗示最终编纂地在于阗。\n(3) 结构风格: 七处九会(天上四处·人间三处)的编排方式,\n与印度其他大乘经典的丛书式结构风格迥异, 带有异乡色彩。\n(4) 地理线索: 《菩萨住处品》指出文殊道场在\"东北方清凉山\"(即五台山),\n透露该经形成地点离中国不远。\n(5) 早期单品(如《兜沙经》《十地经》)约在公元1-2世纪产生,\n早于龙树时代(约2世纪), 后流传至西北印度和中亚。\n", "sources": ["印顺《初期大乘佛教之起源与开展》第十三章「华严法门」", "平川彰《印度佛教史》(春秋社, 1979)", "木村清孝《初期中国华严思想の研究》(春秋社, 1977)"]}, {"title": "于阗——华严经的故乡", "body": "**于阗**(Khotan, 今新疆和田)是《华严经》形成与传播的最大策源地:\n(1) 遮拘迦国(于阗东南二千余里)「宫中自有摩诃般若·大集·华严三部」,\n各十万偈(据闍那崛多传记)。\n(2) 玄奘归国途经斫句迦(子合)时, 记载该国「大乘经典部数甚多,\n十万颂为部, 凡有十数」。\n(3) 晋译六十华严的底本(三万六千偈)由支法领**从于阗取回**。\n(4) 唐译八十华严的底本由武则天遣使**赴于阗求得**。\n(5) 藏文《华严经》(Toh44, 45品)原本同样**来自于阗**。\n(6) 海云继梦法师断言: 「《华严经》的故乡在西域」——\n于阗地处中国·印度·巴比伦·埃及·希腊罗马五大古文明中心,\n《华严经》是人类五大古文明的精华结晶。\n", "sources": ["海云继梦《华严思想的承先与启后》(讲记, 大华严寺)", "羽溪了谛《西域之佛教》(1923)"]}, {"title": "三龙传说——海云继梦的表法诠释", "body": "传统说法: 佛陀成道后宣讲华严, 大龙菩萨结集藏于龙宫。\n九百年后龙树菩萨入龙宫诵出十万偈, 流传人间。\n海云继梦法师将此「三龙传说」做了自性表法的诠释——\n**大龙菩萨** = 具大善根之人(非特指个体)\n**龙宫** = **自性海**(人人本具的佛性, 非海中龙宫)\n**龙树菩萨** = 有大善根且能起大作用饶益众生的人\n合而言之: 「有大善根的人, 把佛陀的教法汇集起来,\n从自性海中把它开发出来, 贡献给大众。」\n《华严经》的诞生, 本质是真理的存在由隐而显——\n古今中外的大德, 皆可名之为龙树、大龙, 乃至皆为法身大士。\n", "sources": ["海云继梦《华严思想的承先与启后》讲记(fjdh.cn)", "海云继梦《华严经导读》系列(空庭书苑)"]}]}, {"id": "transmission", "title": "翻译与流传", "icon": "📜", "topics": [{"title": "三大汉译本对照", "body": "| 译本 | 译者 | 年代 | 卷/品 | 底本来源 |\n|------|------|------|--------|----------|\n| **六十华严**(晋译) | 佛陀跋陀罗(天竺) | 418-421 | 60卷/34品 | 支法领从于阗取回, 三万六千偈 |\n| **八十华严**(唐译) | 实叉难陀(于阗) | 695-699 | 80卷/39品 | 武则天遣使赴于阗求得梵本 |\n| **四十华严** | 般若(罽宾) | 796 | 40卷(仅入法界品) | 南印度乌荼国所进抄本 |\n另有东汉至唐单品别译约**三十余种**(支谦·竺法护·鸠摩罗什等)。\n藏文《华严经》(Toh44)含45品, 译自于阗本, 有2品为汉文三译完全缺失。\n", "sources": ["CBETA T09n0278(六十华严)·T10n0279(八十华严)·T10n0293(四十华严)", "84000 Project: Toh44 translation"], "links": {"cbeta_60": "https://cbetaonline.dila.edu.tw/zh/T09n0278", "cbeta_80": "https://cbetaonline.dila.edu.tw/zh/T10n0279", "cbeta_40": "https://cbetaonline.dila.edu.tw/zh/T10n0293", "toh44": "https://read.84000.co/translation/toh44-31.html"}}, {"title": "华严经本分类(六种经本)", "body": "依法藏《探玄记》及澄观《华严经疏钞》, 经本共有六种:\n**恒本** — 如来恒常所说, 不可结集, 非凡夫受持\n**大本(普眼经)** — 须弥山聚笔、四大海水墨方能书写一品\n**上本** — 龙树于龙宫所见, 偈颂有十三千大千世界微尘数\n**中本** — 四十九万八千八百偈·一千二百品, 仍秘藏龙宫\n**下本** — 十万偈·三十八品(或四十八品), 龙树从龙宫带出弘传\n**略本** — 人间流传的六十卷本和八十卷本\n上·中二本因非凡夫力所能受持, 故龙树未携出龙宫。人间所传实为略本。\n", "sources": ["法藏《华严经探玄记》T35n1733", "澄观《大方广佛华严经疏》T35n1735"]}, {"title": "向东亚的传播", "body": "**朝鲜**: 7世纪中, 新罗僧义湘入唐受学于智俨(华严二祖),\n回国后成为朝鲜华严宗初祖。\n**日本**: 8世纪中, 唐僧道睿东渡日本弘传华严, 成为日本华严宗初祖。\n东大寺为日本华严宗大本山, 大佛(卢舍那佛)即依《华严经》所造。\n12-13世纪, 明惠上人(1173-1232)中兴日本华严,\n与法然·亲鸾·道元·日莲等并列为镰仓佛教重要祖师。\n", "sources": ["镰田茂雄《朝鲜佛教史》(东京大学出版会, 1980)", "镰田茂雄《中国华严思想史の研究》(东京大学出版会, 1965)"]}]}, {"id": "structure", "title": "结构关系与表法", "icon": "🏛", "topics": [{"title": "七处九会——空间结构", "body": "八十华严以**七处九会**为框架: 人间三处(菩提场·普光明殿·逝多林) +\n天上四处(忉利天·夜摩天·兜率天·他化天)。普光明殿重复三次,\n故七处共九会。第一会(菩提场)说毗卢遮那佛依报庄严;\n第二至第八会说十信·十住·十行·十回向·十地·等觉·妙觉;\n第九会(逝多林)善财童子五十三参——从理论到实践的圆满一周。\n", "sources": ["澄观《华严经疏》中对七处九会的详细科判"]}, {"title": "三十九品——内容结构", "body": "八十华严39品可归纳为五大部分:\n(1) **举果劝乐生信分**(第1-6品): 毗卢遮那佛依正庄严\n(2) **修因契果生解分**(第7-34品): 十信·十住·十行·十回向·十地·等觉\n(3) **托法进修成行分**(第35-38品): 普贤行·四弘誓愿·十忍·寿命\n(4) **依人证入成德分**(第39品入法界品): 善财五十三参\n(5) 晋译另有**普贤行愿品**为流通分。\n全经由信→解→行→证四阶段构成完整的菩萨道修行地图。\n", "sources": ["澄观科判(华严经疏)", "方东美《华严宗哲学》(1980, 黎明文化)"]}, {"title": "表意表法——毗卢遮那与华藏世界", "body": "(1) **毗卢遮那**(Vairocana) = 法身佛, 非历史佛陀, 而是法界之体——\n「光明遍照」之义, 代表法界真理的遍在性与全照性。\n(2) **华藏世界海** = 毗卢遮那佛的净土, 二十重世界层层叠绕,\n每一世界有微尘数佛刹围绕——这不是物理宇宙的描述,\n而是**事事无碍法界的表法**: 一尘中含法界, 一毛中现无量佛刹。\n(3) **十** = 华严的核心数字表法: 十信·十住·十行·十回向·十地·十玄门·\n十方·十世……「十」代表**圆满**与**无尽**——菩萨道的修行是圆满的、\n无尽的行愿, 非线性的「到达终点」。\n", "sources": ["方立天《华严金师子章校释》(中华书局, 1983)", "Francis Cook, Hua-yen Buddhism: The Jewel Net of Indra (Penn State, 1977)"]}]}, {"id": "doctrinal", "title": "义学阐释", "icon": "📖", "topics": [{"title": "核心教义体系", "body": "(1) **法界缘起** — 一切现象在法界中互依互入, 非孤立的因果链,\n而是全息的法界整体。与「业感缘起」「阿赖耶缘起」「真如缘起」\n并列为大乘佛教四大缘起论, 且为最圆满者。\n(2) **四法界观** — 事法界(现象界)→理法界(真如界)→\n理事无碍法界(真如与现象相即)→事事无碍法界(一切现象互不相碍)。\n此为杜顺→法藏的华严禅观核心。\n(3) **十玄门** — 法藏以十对玄妙的范畴(同时具足·因陀罗网·秘密隐显·\n微细相容·十世隔法·诸藏纯杂·一多相容·诸法相即·唯心回转·托事显法)\n阐明事事无碍的具体展开, 是华严义学的最精密表达。\n(4) **六相圆融** — 总别·同异·成坏——三对六范畴同时具足,\n认识任一事物即含摄全部六相, 是「一即一切」的认识论基础。\n", "sources": ["法藏《华严一乘教义分齐章》(T45n1866)", "法藏《华严金师子章》(T45n1880)", "方立天《华严金师子章校释》(中华书局, 1983)"]}, {"title": "历代祖师的义学贡献", "body": "**杜顺(557-640)** — 五教止观·法界观门 → 禅观实践奠基\n**智俨(602-668)** — 搜玄记·孔目章 → 六相·十玄初构\n**法藏(643-712)** — 探玄记·五教章·金师子章 → 五教十宗判教·十玄门完成\n**澄观(738-839)** — 华严经疏·随疏演义钞 → 八十华严科判·三圣圆融\n**宗密(780-841)** — 原人论·禅源诸诠集都序 → 禅教融合·会通儒道\n**李通玄(635-730)** — 新华严经论 → 以易经融会华严·长者系代表\n", "sources": ["CBETA 对应经号见各祖师条目"]}, {"title": "近现代学术研究", "body": "**中国**: 方东美《华严宗哲学》(1980)、方立天《法藏评传》(2006)、\n吕澂《中国佛学源流略讲》(1979)、魏道儒《中国华严宗通史》(1998)\n**日本**: 镰田茂雄《中国华严思想史の研究》(1965)、\n木村清孝《初期中国华严思想の研究》(1977)、\n平川彰《印度佛教史》(1979)\n**西方**: Francis Cook, *Hua-yen Buddhism: The Jewel Net of Indra* (Penn State, 1977);\nPeter N. Gregory, *Tsung-mi and the Sinification of Buddhism* (Princeton, 1991);\nThomas Cleary, *The Flower Ornament Scripture* (Shambhala, 1993, 全译本);\nImre Hamar (ed.), *Reflecting Mirrors: Perspectives on Huayan Buddhism* (Harrassowitz, 2007)\n", "sources": ["以上著作均可在 Google Scholar / Goodreads / 豆瓣 检索", "Cleary全译本: https://www.shambhala.com/the-flower-ornament-scripture.html"]}]}, {"id": "global_research", "title": "全球华严研究", "icon": "🌐", "topics": [{"title": "华严学报 (Journal of Huayen Buddhism)", "body": "台湾中华民国佛教华严学会于**2011年**创办的华严佛学专业学术半年刊。\nISSN: 2222-6885 · 出版地: 新北市中和区\n主编/推动者: 海云继梦法师(时任华严学会导师·陕西师范大学华严研究所所长)\n已出版至第8期(2014.12), 电子版可在CEPS中文电子期刊服务查阅(覆盖2011.04-2021.06)。\n代表性论文主题: 华严经众生观与十地·佛境界与法界观想·\n澄观《华严法界玄镜》禅修哲学·华严在云南大理的传播·\n宋代三大士图像学·日本华严图像创新·华严思想与现代思潮\n", "links": {"huayenworld": "https://www.huayenworld.org (华严学术中心-学报各期目录与摘要)", "ceps": "CEPS中文电子期刊服务 (2011-2021)", "princeton_catalog": "https://catalog.princeton.edu/catalog/99125426018406421"}}, {"title": "国际华严研究关键著作", "body": "(1) **Robert M. Gimello & Peter N. Gregory (eds.), *Studies in Ch'an and Hua-yen***\nUniversity of Hawai'i Press, 1983. ISBN 978-0824808351\n开创性论文集, 含Gimello论李通玄·Gregory论宗密判教等。\n(2) **Imre Hamar (ed.), *Reflecting Mirrors: Perspectives on Huayan Buddhism***\nHarrassowitz Verlag, 2007. ISBN 978-3447055093\n欧洲华严研究的里程碑式论文集, 含12篇英文论文覆盖华严义学·历史·东亚传播。\n(3) **Francis H. Cook, *Hua-yen Buddhism: The Jewel Net of Indra***\nPenn State University Press, 1977. ISBN 978-0271021904\n西方第一本系统介绍华严宗的英文专著, 以因陀罗网为核心意象。\n(4) **Peter N. Gregory, *Tsung-mi and the Sinification of Buddhism***\nPrinceton University Press, 1991. ISBN 978-0691073735\n华严五祖宗密的最权威英文研究, 获美国宗教学会图书奖。\n(5) **Thomas Cleary, *The Flower Ornament Scripture: A Translation of the Avatamsaka Sutra***\nShambhala, 1993. ISBN 978-0877739401\n华严经英文全译本(据八十华严), 至今仍是英语世界最完整译本。\n"}, {"title": "国际学术期刊中的华严研究", "body": "华严研究散见于以下国际期刊而非集中于单一刊物——\n**Journal of the International Association of Buddhist Studies**:\nGregory, \"The Teaching of Men and Gods: The Doctrinal and Social Basis of Lay Buddhist Practice in Hua-yen\"\n**Journal of Chinese Philosophy**: Imre Hamar, \"Interpretation of Yogācāra Philosophy in Huayan Buddhism\" (2010)\n**Philosophy East and West**: Nicholaos Jones, \"The Architecture of Fazang's Six Characteristics\" (2019)\n**Hualin International Journal of Buddhist Studies** (华林国际佛学学刊): 华严研究多语论文\n**Journal of Global Buddhism**: Hammerstrom, \"Avataṃsaka Transnationalism in Modern Sinitic Buddhism\" (2016)\n**Korean Hwaŏm 研究**: 《普照思想》(Pojo sasang)·《韩国佛教学》(Han'guk Pulgyohak) 大量刊载知讷·义湘·均如等韩国华严祖师研究\n**日本华严/华厳研究**: 《印度学佛教学研究》·《东方学报》·《仏教学研究》 刊载镰田茂雄·木村清孝·伊藤瑞叡等论文\n"}, {"title": "东亚华严研究重镇", "body": "**中国**: 陕西师范大学华严研究所(海云继梦曾任所长)·南京大学·复旦大学·北京大学\n**台湾**: 中华民国佛教华严学会·华严专宗学院·华严莲社(贤度法师)·法鼓文理学院\n**日本**: 大谷大学(Otani)·龙谷大学(Ryukoku)·东京大学·京都大学人文科学研究所\n**韩国**: 东国大学(Dongguk)·中央僧伽大学·普照思想研究院\n**欧美**: University of Hawai'i·Stanford·Harvard·Columbia·SOAS(London)·Eötvös Loránd(Budapest, Hamar所在)\n"}, {"title": "华严经学研究方法论", "body": "现代华严经学研究的三个主要进路:\n(1) **历史文献学进路**: 文本校勘·成经史重构·译本比较(印顺·木村清孝·平川彰)\n(2) **哲学义理学进路**: 法界缘起·四法界·六相十玄的逻辑结构与哲学意涵(Francis Cook·方立天·Hamar)\n(3) **跨文化/跨学科进路**: 华严与系统论·全息论·AI神经网络的对话(Capra·Varela·环保伦理学)\n三种进路互补——历史文献学提供事实基础, 哲学义理学展释义理深度,\n跨学科进路开拓当代对话空间。\n"}]}], "references": ["印顺《初期大乘佛教之起源与开展》第十三章「华严法门」(正闻出版社, 1981)", "镰田茂雄《中国华严思想史の研究》(东京大学出版会, 1965)", "木村清孝《初期中国华严思想の研究》(春秋社, 1977)", "方东美《华严宗哲学》(黎明文化, 1980)", "方立天《法藏评传》(中国人民大学出版社, 2006)", "方立天《华严金师子章校释》(中华书局, 1983)", "魏道儒《中国华严宗通史》(江苏古籍出版社, 1998)", "Francis H. Cook, Hua-yen Buddhism: The Jewel Net of Indra (Penn State, 1977). ISBN 978-0271021904", "Peter N. Gregory, Tsung-mi and the Sinification of Buddhism (Princeton, 1991). ISBN 978-0691073735", "Thomas Cleary, The Flower Ornament Scripture: A Translation of the Avatamsaka Sutra (Shambhala, 1993). ISBN 978-0877739401", "海云继梦《华严思想的承先与启后》讲记", "海云继梦《华严经导读》系列(空庭书苑)", "CBETA 中华电子佛典协会: T09n0278(六十)·T10n0279(八十)·T10n0293(四十)", "84000 Project: The Ten Bhumis (Toh44-31)", "吕澂《中国佛学源流略讲》(中华书局, 1979)", {"id": "modern_masters", "title": "海云·贤度两位法师·结构研究", "icon": "🎓", "topics": [{"title": "海云继梦「九九華嚴」结构诠释", "body": "海云继梦法师将《八十华严》(前59卷) +《四十华严》(后40卷)=「九九華嚴」，\n形成「理行圆融」的整体架构——八十华严为「理」(思想基础)，四十华严为「行」(实修行愿)。\n此99卷框架超越了传统的「七处九会」单一结构观，将全经解读为「信→解→行→证」的完整菩萨道。\n相关著作: 《九九華嚴玄談》5册 (空庭书苑, 2026)。讲法: YouTube @huayen-world 九九華嚴系列。\n核心判摄: 「华严经不是一部经，而是一套完整的生命改造工程手册。」\n"}, {"title": "贤度法师·华严结构学", "body": "贤度法师(Bhiksuni Xiandu, 1937-)，华严莲社住持，华严专宗学院院长，\n智光老和尚法孙，致力于华严义学的学院化研究与教学。\n代表作《华严经讲义》系列、《华严学概论》等，对华严经的「七处九会」结构、\n「信解行证」四分科判、以及华严判教体系有系统性的现代阐述。\n其讲记注重文献学考辨与修行实践的结合，为当代学院化的华严义学研究提供了重要范本。\n华严专宗学院官网: https://www.huayencollege.org\n华严莲社: 台北华严莲社 (1949年创社)，贤度法师为第三代住持。\n"}, {"title": "澄观《华严经疏》科判研究", "body": "澄观《大方广佛华严经疏》(T35n1735) 是华严经最详尽科判。\n澄观以「十门分别」为全经分科——十门中前五门为「玄义」(总体诠释框架)，\n后五门为「文义」(逐品科判)。海云继梦在《探玄記懸談講記》中\n对澄观的科判体系做了现代梳理，强调「玄谈」(悬谈)是理解华严经的\n方法论前设——不先掌握玄谈框架，直接读经文如同「没有地图的旅行」。\n"}], "references": ["海云继梦《九九華嚴玄談》5册 (空庭书苑, 2026)", "海云继梦《探玄記懸談講記》4册 (空庭书苑)", "贤度法师《华严经讲义》系列 (华严莲社)", "贤度法师《华严学概论》 (华严莲社)", "华严专宗学院: https://www.huayencollege.org", "澄观《大方广佛华严经疏》T35n1735", "澄观《大方广佛华严经随疏演义钞》T36n1736"]}]}, "intertextual_canon": {"schools": [{"id": "tiantai", "name": "天台宗 / Tiantai / 法华", "texts": [{"t": "妙法莲华经", "n": "T09n0262·鸠摩罗什译·7卷28品", "d": "天台根本经。会三归一，开权显实。", "l": "https://cbetaonlin la.edu.tw/zh/T01n0001"}, {"t": "清净道论", "n": "觉音(Buddhaghosa,5c)", "d": "南传修行体系总纲。戒定慧。", "l": "https://en.wikipedia.org/wiki/Visuddhimagga"}]}, {"id": "hetuvidya", "name": "因明 / Buddhist Logic", "texts": [{"t": "因明入正理论", "n": "T32n1630·商羯罗主·玄奘译", "d": "八门二益。因明入门。", "l": "https://cbetaonline.dila.edu.tw/zh/T32n1630"}, {"t": "因明正理门论", "n": "T32n1628·陈那·玄奘译", "d": "新因明奠基。三支比量。", "l": "https://cbetaonline.dila.edu.tw/zh/T32n1628"}]}]}, "panjiao_hupan": {"sections": [{"id": "overview", "title": "判教互判总论", "icon": "⚖️", "intro": "判教（教相判释）是各大传统内部自我定位与互相评判的普遍现象：将全部教法（或学说）组织为有次第的体系，确立本宗所依经典/文本的最高地位，并为修行（实践）提供「地图」。\n佛教判教最成体系；儒、道、耶、回、印度教、学术界与科技圈各有同构的「判教」现象。本页逐一梳理各系统判教的立场、思想、修行定位、义学定位、判教依据及其源流演变。\n", "topics": [{"title": "判教的性质与双重功能", "body": "「判教」即**教相判释**：按义理高下深浅、说法先后次序，把浩繁的经教组织成一个有结构、有次第的体系。\n其功能有二：①**义学定位**——确立本宗所依经典的了义地位；②**修行定位**——判摄的次第即修行的地图。各宗判教本质上都是为了确立本宗所依经典的最高地位（唯吉藏以「诸经平等」的「无所得」立场为异数）。\n南北朝涅槃师判教「为中国佛教开创了判教这一极其重要的方法论，后来成为中国佛教教理思想建构的基本方法论」。\n", "source": "王仲尧《南北朝涅槃师的判教及其价值意义》(佛光山人间佛教研究院 fgsihb.org) · 《吉藏大师判教思想之研究》(中国佛学院《法源》总第20期 2002)"}, {"title": "三系判教的三大经典范式", "body": "**宗密《禅源诸诠集都序》三种教**（与禅三宗一一配对，总会为一味）：\n• 密意依性说相教（法相唯识＝有宗）↔ 息妄修心宗\n• 密意破相显性教（般若中观＝空宗）↔ 泯绝无寄宗\n• 显示真心即性教（如来藏＝性宗）↔ 直显心性宗\n**印顺《印度之佛教》(1942) 大乘三系**：性空唯名论（龙树）·虚妄唯识论（无著世亲）·真常唯心论（楞伽·密严·涅槃·金光明系）\n**太虚三宗**：法性空慧宗 · 法相唯识宗 · 法界圆觉宗（天台·华严·禅）\n", "source": "宗密《禅源诸诠集都序》(T48n2015) · 印顺《印度之佛教》(正闻学社1943; 中华书局2011) · 太虚《佛法总抉择谈》《论大乘三宗》"}, {"title": "三系对照表", "body": "| 系 | 代表经论 | 核心命题 | 判教位置（法藏五教十宗） |\n| --- | --- | --- | --- |\n| 空宗 | 般若经·《中论》 | 缘起性空·八不中道 | 大乘始教（空始教）·一切皆空宗 |\n| 有宗 | 解深密经·瑜伽师地论·成唯识论 | 万法唯识·三性三无性 | 大乘始教（相始教）·说相教 |\n| 性宗 | 楞伽·密严·涅槃·起信论 | 真如缘起·如来藏·性起 | 终教·真德不空宗；顿教·相想俱绝宗 |\n| 圆教 | 《华严经》 | 事事无碍·主伴具足 | 一乘圆教·圆明具德宗（不共别圆） |\n", "source": "法藏《华严一乘教义分齐章》(T45n1866) 五教十宗 · 宗密《禅源诸诠集都序》"}]}, {"id": "nanbei", "title": "判教前史 · 南三北七", "icon": "🌱", "intro": "判教非隋唐宗派才有：其嚆矢在北凉昙无谶译《涅槃经》的「五味」比喻，经竺道生、慧观、刘虬等南北朝涅槃师的发展，形成「南三北七」十家判教，天台智者大师在《法华玄义》中总括并超越之。\n", "topics": [{"title": "嚆矢：昙无谶与竺道生", "body": "据汤用彤等研究，判教活动**创始于北凉昙无谶**（385-433）：所译《大般涅槃经》卷十四以「从牛出乳、从乳出酪、从酪出生酥、从生酥出熟酥、从熟酥出醍醐」比喻教义高下深浅，树立教相判释之嚆矢。\n其后**竺道生**就如来说法立「善净、方便、真实、无余」**四法轮**之别，并唱导顿悟成佛。\n", "source": "汤用彤《汉魏两晋南北朝佛教史》 · 韩焕忠《华严判教论》(齐鲁书社)"}, {"title": "慧观「二教五时」— 体系化判教之始", "body": "刘宋**慧观**（鸠摩罗什高足，曾参与修治南本《涅槃经》）立「**二教五时**」：\n• **顿教**：《华严经》；\n• **渐教**五时：①有相教（阿含）②无相教（般若）③抑扬教（维摩·思益，抑声闻扬菩萨）④同归教（法华，开三显一）⑤常住教（涅槃，佛身常住）。\n蓝日昌指出其划时代意义：**首次确立大、小乘经教之分**——此后判教与佛典目录编制基本都按此体系归纳区分。\n", "source": "韩焕忠《华严判教论》 · 蓝日昌《慧观判教观研究》 · 《高僧传》卷七"}, {"title": "刘虬「五时七阶」", "body": "南齐隐士**刘虬**（437-495）在慧观五时基础上**增添人天教**：人天教→有相教→无相教→同归教→常住教（据隋慧远《大乘义章》记载）；又依《无量义经》序以「七阶」判经典关系。\n慧观与刘虬被视为**江南最早的判教家**，但其判教尚属对诸经外形的分类，未达内容的化法层面。\n", "source": "隋·净影慧远《大乘义章》 · 圣凯法师《地论学派的判教思想与南朝佛教》(fjdh.cn)"}, {"title": "「南三北七」十家", "body": "智顗《法华玄义》总括南北朝判教为「**南三北七**」十家（「南三北七，义成百家」）：\n**江南三家**（顿渐不定三教判）：①虎丘岌法师——有相、无相、常住三时；②宗爱法师——有相、无相、同归、常住四时；③僧柔、慧次承慧观——五时。\n**江北七家**：①刘虬五时；②菩提流支——半字教与满字教；③佛陀三藏、光统律师（慧光）——因缘、假名、诳相、常四宗；④自轨法师——加「法界宗」为五宗；⑤安廪法师——因缘、假名、诳相、真、常、圆六宗；⑥北地某禅师——有相、无相二种大乘；⑦鸠摩罗什——一音教。\n王仲尧指出：南方三家及北方刘虬一家**都属于涅槃师系统的判教**。\n", "source": "智顗《法华玄义》卷十「南三北七」 · 王仲尧《南北朝涅槃师的判教及其价值意义》(fgsihb.org)"}]}, {"id": "tiantai", "title": "天台五时八教", "icon": "🌸", "intro": "天台智者大师综贯「南三北七」而超越之，以《法华经》为中心建立判教体系。注意学术史考证：「五时八教」完整表述非智顗一人一次提出，而是经灌顶、湛然、谛观历代祖师逐步定型。\n", "topics": [{"title": "五时 — 佛说法的时序", "body": "依《涅槃经·圣行品》「五味相生」（乳→酪→生酥→熟酥→醍醐）分佛一生说法为**五时**：\n①华严时（如日出先照高山·乳）②阿含时（鹿苑说四谛十二因缘·酪）③方等时（维摩·思益·楞伽·胜鬘，弹偏折小叹大褒圆·生酥）④般若时（般若系·熟酥）⑤法华涅槃时（如日轮当午·醍醐，最高最圆满）。\n", "source": "智顗《法华玄义》 · 谛观《天台四教仪》五味相生配对"}, {"title": "化仪四教与化法四教", "body": "**化仪四教**（说法形式，「譬如药方」）：**顿、渐、秘密、不定**。「秘密」教为智顗首创——他在南北朝通行「顿渐不定」之外增加「显—密」范畴。\n**化法四教**（说法内容，「譬如药味」）：**藏、通、别、圆**。藏教（小乘三藏·析空观）→通教（体空观，通前通后）→别教（界外独菩萨法·次第观）→圆教（圆妙圆满圆足圆顿·一心三观）。\n", "source": "智顗《法华玄义》 · 灌顶《天台八教大意》 · 李四龙《略论智顗的「秘教」思想》(philosophy.org.cn)"}, {"title": "三种教相 — 判教大纲", "body": "智顗《法华玄义》卷一上立「**三种教相**」为判教大纲：①根性融不融相（根机）②化导始终不始终相（佛意）③师弟远近不远近相（本迹）——从三方面论证《法华》殊胜：前四时为权，唯法华开权显实、废权立实、「纯圆独妙」。\n", "source": "智顗《法华玄义》卷一 · 圣严法师《天台心钥——教观纲宗贯注》(ddc.shengyen.org)"}, {"title": "演变：从三教相到「五时八教」定型", "body": "学术史考证：智顗原本判教着重「三种教相」，说法形式只有**顿、渐、不定**三教；「秘密」为智顗首创。\n→ 弟子**灌顶**《天台八教大意》明确区分化仪/化法；\n→ 九祖**湛然**《法华玄义释签》始有「五时八教」连称；\n→ 高丽**谛观**《天台四教仪》将五时与五味、化仪一一相配，宣称「天台智者大师，以五时八教，判释东流一代圣教，罄无不尽」——自此成为天台判教基本框架。\n「若将完整的『五时八教』说直接视为智顗原本的判教思想，则显然是一种误会。」\n", "source": "天台宗判教演变研究 (检索考证) · 谛观《天台四教仪》"}]}, {"id": "madhyamaka", "title": "空宗·三论 — 二藏三轮", "icon": "🌌", "intro": "三论宗吉藏以「无所得」立场判教：破五时说而立二藏，会三乘而归法华。与诸宗「抬高本宗」不同，吉藏强调「诸经平等」——判教是破执的工具而非立宗的手段。\n", "topics": [{"title": "二藏 — 破五时之说", "body": "吉藏（549-623，嘉祥大师）继承罗什、僧肇、法朗一系，对慧观「五时」判教持批判态度：「**但应立大小二教，不应制于五时**」。\n**二藏**：声闻藏（小乘）与菩萨藏（大乘），亦称半字教/满字教；吉藏引《大品经》《法华经》《涅槃经》三经及《智度论》《地持论》《正观论》三论为据，论证经论中只有二藏而没有五时。\n", "source": "吉藏《三论玄义》 · 《吉藏大师判教思想之研究》(中国佛学院《法源》总第20期)"}, {"title": "三轮 — 法华会归的结构", "body": "**三轮**（三法轮）：①**根本法轮**——佛初成道华严会上说《华严经》（一因一果）；②**枝末法轮**——《华严》后《法华》前，因薄福钝根众生不堪一乘，故「于一佛乘分别说三」的一切大小乘经；③**摄末归本法轮**——《法华经》会三归一。\n按此判摄《般若》当属枝末，但吉藏认为般若属大乘，仍归根本法轮。三论宗实以**二藏为主、三轮为辅**。\n", "source": "吉藏《三论玄义》 · 佛光大辞典「三轮教」词条 (fodian.cc)"}, {"title": "「诸经平等」的无所得立场", "body": "与其他宗派抬高本宗经典不同，吉藏强调「**诸经平等**」「是法平等无有高下」，判教旨在**破斥有所得之执**，体现般若实相无所得的特色，反映隋唐佛教走向融合的趋势。\n后世华严家澄观批评吉藏三轮「**收义不尽**」：因《法华》之前亦说大乘，不可将《般若》等全判为枝末。\n", "source": "《吉藏大师判教思想之研究》(zgfxy.cn) · 澄观《华严经疏》对三轮之评"}]}, {"id": "yogacara", "title": "有宗·唯识 — 三时判教", "icon": "🔬", "intro": "唯识宗依《解深密经》立「有、空、中」三时判教，以第三时中道了义为自宗依据——与天台五时、华严五教鼎足而立。\n", "topics": [{"title": "解深密经的三时", "body": "《解深密经·无自性相品》判一代圣教为**三时**：\n①**初时**（有教/转法轮）：鹿野苑为声闻说四谛；\n②**二时**（空教/照法轮）：为大乘说般若诸法皆空、无自性，以「**隐密相**」说法；\n③**三时**（中道教/持法轮）：说三性及真如不空等唯识中道，以「**显了相**」说法，遣除第二时空执，普为三乘。\n", "source": "《解深密经·无自性相品》(T16n0676)"}, {"title": "真谛与玄奘的立说", "body": "三时教为**真谛、玄奘**所立：真谛依《金光明经》立转、照、持三轮（成道后七年转小乘四谛→七年后说般若明空→三十年后说《解深密》明空有）；玄奘依《解深密经》《瑜伽师地论》立同样结构。\n玄奘在印度曾亲见**戒贤与师子光**各立三时以争「了义」——《解深密经》被唯识家奉为了义之教。\n", "source": "中国佛学院《华严三时判教说》(zgfxy.cn) · 《大唐大慈恩寺三藏法师传》"}, {"title": "法藏的评判", "body": "法藏批评玄奘及印度中观派的三时判教**未将《华严经》包摄进去**，均不圆满——此即华严宗立「五教」、以圆教《华严》为最高判摄的因由之一。\n天台智顗则以五时八教突出《法华》为纯圆之教。三宗互评表明：各宗判教本质上都是为确立本宗所依经典的最高地位。\n", "source": "中国佛学院《华严三时判教说》(zgfxy.cn) · 法藏《华严一乘教义分齐章》"}]}, {"id": "xingzong", "title": "性宗·真常 — 直显真心", "icon": "🌄", "intro": "性宗以「直显」为宗：一切众生本有空寂真心，名为佛性、如来藏、心地。宗密判为「显示真心即性教」——中国佛教义理的主流命脉，由《起信论》真如缘起开出华严「性起」说。\n", "topics": [{"title": "宗密「显示真心即性教」", "body": "宗密：「一切众生皆有空寂真心，无始本来，性自清净，明明不昧，了了常知，尽未来际，常住不灭，**名为佛性，亦名如来藏，亦名心地**。」「灵知之心，即是真性，与佛无异。」\n所依经论：《华严》《密严》《圆觉》《佛顶》《胜鬘》《如来藏》《法华》《涅槃》等四十余部经，《宝性》《佛性》《起信》《十地》《法界》《涅槃》等十五部论。\n宗密并批评前两教：「如何破相之党，但云寂灭，不许真知；说相之家，执凡异圣，不许即佛。」\n", "source": "宗密《禅源诸诠集都序》(T48n2015)"}, {"title": "起信论与真如缘起", "body": "《大乘起信论》一心开二门：心真如门（不变）·心生灭门（随缘），真如缘起「不变随缘、随缘不变」。\n法藏判之为终教「真德不空宗」；华严宗「**性起**」说（智俨、法藏）即由此开出：性起＝依体起用，佛果之体性显现为无尽法界。\n", "source": "《大乘起信论》(T32n1666) · 法藏《华严一乘教义分齐章》(T45n1866)"}, {"title": "中土佛性论的源头：竺道生", "body": "竺道生（355-434）见法显六卷《泥洹》言「除一阐提，皆有佛性」，独发「**一阐提人皆得成佛**」——「夫禀质二仪，皆有涅槃正因。阐提含生之类，何得独无佛性？盖是经来未尽耳。」\n被摈出僧团后「生公说法，顽石点头」；及北本《大般涅槃经》传至，经文与之符契，被追尊「涅槃圣」。汤用彤：「后日谈心性主顿悟者，盖不得不以生公为始祖矣。」\n", "source": "赖永海《中国佛性论》 · 汤用彤《汉魏两晋南北朝佛教史》 · 《高僧传》卷七"}]}, {"id": "tathagatagarbha", "title": "如来藏 — 专论与争议", "icon": "💎", "intro": "如来藏（tathāgatagarbha）思想是「空有直性」议题的漩涡中心：它既是性宗的教理内核，也是近现代「起信论真伪」「批判佛教」两大论争的焦点。\n", "topics": [{"title": "经典与论典的谱系", "body": "早期如来藏系三部经：《如来藏经》《不增不减经》《胜鬘经》（高崎直道之说）；另有《楞伽》《密严》《大法鼓》《央掘魔罗》等。\n论典以《宝性论》（Ratnagotravibhāga）为最系统——以《如来藏经》「九譬喻」证成如来藏为烦恼所缠，是其理论核心；梵文校勘本以 E. H. Johnston 1950年刊本为国际通用标准。\n", "source": "高崎直道《如来藏思想的形成》(春秋社1974) · A Study on the Ratnagotravibhāga (Uttaratantra), Serie Orientale Roma XXXIII"}, {"title": "本寂与本觉 — 吕澂的判分", "body": "吕澂《试论中国佛学有关心性的基本思想》提出著名的「**心性本寂**」（印度）与「**心性本觉**」（中国）之区分，认为中国佛学以「本觉」理解心性明净属「性觉」之说，将中国化佛教判定为「相似佛学」。\n支那内学院由此驳《起信》、难《楞严》、疑《圆觉》《占察》《仁王》《梵网》，对中国化佛教传统发起根本质疑。\n", "source": "吕澂《试论中国佛学有关心性的基本思想》 · 刘鹿鸣《「慈宗」构建与近代弥勒信仰复兴中的理论抉择》(aisixiang.com)"}, {"title": "批判佛教的挑战与佛门驳议", "body": "日本驹泽大学袴谷宪昭、松本史朗：「如来藏思想不是佛教」——它是「**基体论**」（dhātu-vāda），主张单一实在的基体生起多元诸法，违背缘起与无我。松本引《大乘阿毘达磨经》「无始时来界，一切法等依，由此有诸趣，及涅槃证得」一偈为证。\n台湾释恒清《「批判佛教」驳议》（《国立台湾大学哲学论评》第24期，2001）依《胜鬘经》《大般涅槃经》《宝性论》《佛性论》反驳：如来藏（佛性）思想恰恰是实践中平等、正义的理论基础。\n林镇国认为批判佛教的真正意图指向社会现实与文化批判；周贵华指出其与内学院「相似佛教」判在「发生论的一元论」定性上一致。\n", "source": "释恒清《「批判佛教」驳议》, 《台大哲学论评》24期 (pdcnet.org) · 周贵华《日本「批判佛教」思潮：反应与研究》(fjdh.cn)"}, {"title": "海云法师：如来即自性", "body": "海云法师《华严经·如来出现品》讲记：众生内在本有「取之不盡、用之不竭的寶藏」——「釋迦牟尼佛管它叫『**如來**』，我們稱其為『**自性**』」；「我們的自性、佛性呈現、開展，此即**如來出現**」。\n法师强调：**必须先证得空性**为基础，如来（佛自性）才能显现——「没有空性……那是人天善法，不是菩萨道的大功德」。\n", "source": "海云继梦《自性啟航——華嚴經如來出現品卷一講記》(空庭書苑2003) · 《四十华严讲记》第23讲 (fjdh.cn)"}]}, {"id": "debates", "title": "近现代论争 — 空有之诤与起信真伪", "icon": "⚔️", "intro": "1920-40年代，支那内学院与武昌佛学院围绕唯识、起信论、如来藏展开的论争，是「判教互判」在近代最高强度的学术对决，其思想效应延续至今。\n", "topics": [{"title": "内学院与武昌佛学院的对垒", "body": "1922年欧阳竟无在南京创办支那内学院，太虚在武昌创办武昌佛学院，并列为两大佛学中心。\n内学院以专精唯识而道定一尊，对中国佛学天台、华严、禅宗猛攻猛破；欧阳竟无《唯识抉择谈》出，太虚作《佛法总抉择谈》依唯识三性（遍计所执性、依他起性、圆成实性）通论大乘回应。\n", "source": "太虚《佛法总抉择谈》 · 刘鹿鸣《「慈宗」构建与近代弥勒信仰复兴中的理论抉择》(aisixiang.com)"}, {"title": "起信论真伪论争全景", "body": "• 隋法经《众经目录》已编《起信论》入「众经疑惑部」；\n• 日本望月信亨、梁启超（1922《大乘起信论考证》）据史料考证断为伪作；\n• 吕澂《起信与楞伽》从七个观点证明《起信论》是伪论——非从梵本译出，乃沿袭魏译《楞伽》「如来藏与藏识不同」之误而来；\n• 太虚「从《成唯识论》寻得此论立说之依据点」以唯识释起信辩护；\n• 印顺认为纵有译错，《起信》「真妄和合」结构吻合「真常唯心论」；\n• 牟宗三批评吕澂：「如来藏藏识」是复合词，有取性与解性两面，吕只取前一义。\n", "source": "圣严法师对近代起信论真伪两系之总结 (ddc.shengyen.org) · 吕澂《起信与楞伽》 · 梁启超《大乘起信论考证》"}, {"title": "太虚与印顺之诤", "body": "1942年印顺将《印度之佛教》书稿寄请太虚作序，太虚撰《议印度之佛教》《再议印度之佛教》，批评印顺「独尊龙树」「孤取人间为本」；印顺以《敬答议印度之佛教》回应。\n这场争论被视为「人间佛教」（印顺）与「人生佛教」（太虚）路线分歧的重要前哨战。\n", "source": "印顺《印度之佛教》·《敬答议印度之佛教》 · 太虚《再议印度之佛教》 · 侯坤宏《从太虚大师到印顺法师：一个思想史角度的观察》(fjdh.cn)"}]}, {"id": "ekayana", "title": "一佛乘 — 会三归一与别教一乘", "icon": "🛞", "intro": "「一佛乘」（eka-yāna）之争是台贤两宗判教对决的主战场：《法华》会三归一为「同教一乘」，华严直显不共为「别教一乘」。\n", "topics": [{"title": "法华的会三归一", "body": "《法华经·方便品》：「十方佛土中，唯有一乘法，无二亦无三。」\n天台《四教仪集注》以四义释「一」：**教一**（唯一佛乘）、**行一**（「正直舍方便，但说无上道」）、**人一**（「但为菩萨，不为小乘」）、**理一**（「世间相常住」）。\n天台自居圆教，判《华严》「兼别教而非纯圆教」，唯《法华》「部圆教圆」纯圆独妙。\n", "source": "《法华经·方便品》(T09n0262) · 《天台四教仪集注》"}, {"title": "华严的别教一乘", "body": "法藏《华严一乘教义分齐章》（《五教章》）开十门，首门「建立一乘」，将一乘分「**别教**」「**同教**」二门（初由二祖智俨提出，法藏集大成）：\n• **别教一乘**（《华严》）：如来自证自悟境界，主伴具足无量教义、事事无碍、因果无二、三世间本来圆满；分「性海果分」（不可说——「因分可说，果分不可说」）与「缘起因分」（普贤境界）；\n• **同教一乘**（《法华》）：会三归一，与三乘教义相通、权实圆融，仍带权教性质。\n澄观：「百川不摄大海，大海必摄百川」。\n", "source": "法藏《华严一乘教义分齐章》(T45n1866) · 释正持《别教一乘与同教一乘之同异——以〈五教章〉为主》(huayencollege.org)"}, {"title": "太虚的超宗派立场", "body": "太虚《佛教各宗派源流》：「清凉判法华兼终教非纯圆教，天台判华严兼别教非纯圆教，此乃独标自宗殊胜，令学者死尽偷心以起行趣证等。」\n究实而言「八宗皆实非权，皆圆非偏，皆妙非麤；皆究竟菩提故，皆同一教乘故」。\n", "source": "太虚《佛教各宗派源流》 · 太虚《我怎样判摄一切佛法》(books.fo)"}]}, {"id": "yuanjiao", "title": "共同圆与不共别圆", "icon": "🏔️", "intro": "「共同圆教」与「不共别圆」是海云法师对法藏同别二教判的现代诠释：法华摄三归一为共同圆，华严直显佛果为不共别圆——「没有三车，只有露地大白牛车」。\n", "topics": [{"title": "五教十宗的判摄", "body": "法藏「就法分教，教类有五」：**小乘教**（人空法有）→ **大乘始教**（空门：般若中观，一分无性）→ **终教**（不空门：起信如来藏，一切众生皆有佛性）→ **顿教**（绝言真如：楞伽，言说顿绝）→ **圆教**（华严别教一乘，事事无碍）。\n十宗后四：一切皆空宗（始·空）、真德不空宗（终·性宗）、相想俱绝宗（顿）、圆明具德宗（圆）。\n", "source": "法藏《华严一乘教义分齐章》(T45n1866) · 方立天《法藏》五教章研究"}, {"title": "海云法师：共同圆教 vs 不共别圆", "body": "海云法师《三圣圆融观》：「《法华经》上讲的佛乘，并非『一乘』，而是『共教』、是『同教』、『圆教』，所以称之为『**共同圆教**』」——核心是「摄三归一」「会三归一」，三车之外露地另有大白牛车，属「圣解脱道」，可思可议。\n华严则是「**不共别圆**」：不共教、别教、圆教，「真理即是如此，与三乘无关」——「**没有三车，只有露地大白牛车**」：一出三界，通通证入大白牛车境界。\n大乘分菩萨乘（波罗蜜乘）与一佛乘；一佛乘之下再分：密宗金刚乘属共同圆教；华严一佛乘特称「**普贤乘**」，为最高层次。\n", "source": "海云继梦《三圣圆融观》 (fjdh.cn: https://www.fjdh.cn/wumin/2013/09/085114285451.html)"}, {"title": "「不共」在真发菩提心", "body": "「不共」究竟不共在哪里？海云法师：在「**真发阿耨多罗三藐三菩提心**」——不是形式上的发心，而是心真的在转化。真发菩提心理、事两个前提：\n• 理：对三宝具足信根，以普贤菩萨为本尊；\n• 事：尽形寿行菩萨道；一切荣耀归三宝，一切挫折向普贤本尊忏悔。\n真发心后「一切法皆可修行」——绘画、音乐、舞蹈、运动皆是普贤乘，「于一切法成最正觉」。\n", "source": "海云继梦《三圣圆融观》 (fjdh.cn)"}, {"title": "普贤圆融道与法界力", "body": "华严教行称「**普贤圆融道**」（圆融道），「**不用大脑在大地上成就**」；所讲的是「**法界力**」——像万有引力一样本来存在，并非净土宗所说的「他力」，而是法界的本然运作。\n禅宗的「教外别传」其实也没有离开不共别圆的范畴。法华的大白牛，在华严是直接兑现，能直接证得法、报、化三身。\n", "source": "海云继梦《三圣圆融观》 (fjdh.cn) · 《同证法报化三身》(wuming.xuefo.com)"}]}, {"id": "hupan", "title": "诸宗互判与合流", "icon": "🤝", "intro": "判教成熟之后，宗派之间与宗派内部展开了持续的互判：天台山家山外之争、台贤互判、禅教之争、台净合流——互判既是义学划界，也是融合的动力。\n", "topics": [{"title": "天台山家山外之争（约980-1030）", "body": "五代末天台典籍自高丽、日本回传复兴，但因文献久疏、受贤首慈恩学说及「兼讲」思潮影响，天台教义被夹杂混淆，引发**山家（四明知礼，960-1028，四明）与山外（慈光晤恩一系，钱塘；孤山智圆976-1022等）**三四十年的正统之争。\n四大论题：①《金光明经玄义》广略本真伪（知礼《释难扶宗记》《十义书》《观心二百问》，历时七年）；②**真心观vs妄心观**（山外受华严慈恩影响主真心观；知礼主妄心观）；③**别理随缘与理具三千**（知礼「若不谈体具者，随缘与不随缘，皆属别教」——以「理具」简别天台性具与华严性起）；④《十不二门指要钞》之诤（后衍生仁岳「后山外」）。\n知礼被推为「中兴天台」第十七代祖；南宋广智、神照、南屏三家承其说，山家终代表天台盛行于世。\n", "source": "吴忠伟《圆教的自拘——山家山外之争与宋代制度佛学》(philosophychina.cssn.cn) · 知礼《观无量寿经疏妙宗钞》研究 (minlun.org.tw) · 龚隽《北宋天台宗对〈大乘起信论〉与〈十不二门〉的诠释与论争》(wuming.xuefo.com)"}, {"title": "台贤互判与智圆的反弹", "body": "天台判华严「兼别教而非纯圆」；清凉判法华「兼终教非纯圆」——太虚总结为「独标自宗殊胜」。\n山外智圆则批评「近人不晓，乃谓华严、起信宗师所谈圆极但是今家别教者，谬之甚矣」——真如须具三千法，「若非本具，云何能造」。湛然引入《起信论》「真如随缘」后，天台与华严界限模糊，正是山家山外分裂的义理根源。\n", "source": "龚隽《北宋天台宗对〈大乘起信论〉与〈十不二门〉的诠释与论争》(wuming.xuefo.com) · 太虚《佛教各宗派源流》"}, {"title": "禅教之判与合流", "body": "宗密《禅源诸诠集都序》倡**教禅一致**：以三种教配禅三宗，「一一证之，然后总会为一味」——「今时弟子彼此迷源，修心者，以经论为别宗；讲说者，以禅门为别法」正是宗密要弥合的裂痕。\n永明延寿主张**禅教兼重、性相融合**，主动融合诸宗（其融会姿态甚至被学者视为促使天台山家山外论争产生的外部因素之一）。\n", "source": "宗密《禅源诸诠集都序》 · 悟殷法师《记〈中国佛教史略〉之特见》(xuefo.com) · 吴忠伟《圆教的自拘》(cssn.cn)"}, {"title": "台净合流：教演天台，行归净土", "body": "知礼晚年力作《观无量寿经疏妙宗钞》（六十二岁成书，六十八岁加《料简十三科》）以天台圆宗诠释净土教义，确立「**教演天台，行归净土**」的修学方向，首唱**台净融合**之论，并弥补善导「凡夫入报土」论义理之不足。\n", "source": "知礼《观无量寿经疏妙宗钞》研究 (minlun.org.tw)"}]}, {"id": "zangchuan", "title": "藏传判教 — 九乘与四部宗义", "icon": "🐉", "intro": "藏传判教自成体系：宁玛以「大圆满」为标准立九乘；格鲁以「应成中观」为究竟了义；「自空」与「他空」之争贯穿藏传思想史。\n", "topics": [{"title": "宁玛派九乘判教", "body": "宁玛派以「大圆满」为标准将一切佛法判为**九乘**（另列世间二类）：\n• 世间法：颠倒外道乘；因循人天乘（人乘五戒/天乘十善）；\n• **显三乘**（集聚招引三外乘）：声闻、独觉、菩萨；\n• **外密三乘**（苦行明觉内三乘）：事部、行部、瑜伽部；\n• **内密三乘**（深密随转方便三内乘）：摩诃瑜伽（生起）、阿努瑜伽（教敕）、阿底瑜伽（大圆满，分心部/界部/要门部）。\n九乘次第由前弘期**吉祥积译师**开创，**隆钦饶绛巴（1308-1363）**在《七宝藏论·宗论藏》中系统化。\n", "source": "土观·罗桑却吉尼玛《宗派源流》(1801) · 何杰峰《藏传佛教判教研究》(巴蜀书社) · 谈锡永《〈四法宝鬘〉导读》(xuefo.com)"}, {"title": "四部宗义与「大中观」", "body": "显教三乘内摄印度**四部宗义**（「四宗河」）：毗婆沙（有部）·经量部·唯识宗·中观宗；中观又分**外宗**（自续派、应成派——说一切无自性）与**内宗**（他空中观、唯识中观——「**大中观**」）。\n宁玛判三转法轮：初转四谛、二转无自性为不了义，**三转法轮的他空大中观见为究竟了义**。敦珠法王《四部宗义要略》（谈锡永译）认为如来藏思想为佛家最究竟见，藏传宁玛、萨迦、噶举、觉囊及汉传诸宗皆依此建立，统称「大中观」。\n", "source": "敦珠法王《四部宗义要略》(谈锡永译, 附《九乘次第论集》) · 何杰峰《藏传佛教判教研究》"}, {"title": "格鲁派的应成中观立场", "body": "格鲁派以**佛护、月称的中观应成派见为佛的究竟了义思想**——与宁玛派显教判释「南辕北辙」；格鲁派的出现被视为藏传思潮「由佛性论转向般若学」的重要标志。\n见修分歧：宁玛主张众生心体本净、顿悟自性元成；格鲁否认本具之说，认为众生心染污，须离垢清净、长时积集福智二资粮方能成佛。\n隆钦巴曾将应成中观置于显宗最高位；后世宁玛学者则认为应成中观虽非了义，在实修次第中有「下学上达」的作用。\n", "source": "何杰峰《藏传佛教判教研究》(巴蜀书社) · 谈锡永《〈四法宝鬘〉导读》"}]}, {"id": "dzogchen", "title": "大圆满觉与觉囊他空", "icon": "🏔️", "intro": "「大圆满觉」在汉传语境对应《圆觉经》「圆满觉性」，在藏传语境对应大圆满（Dzogchen）之觉空无别——两者皆以「心性本净、光明本具」为共同义理结构，与如来藏系同源；觉囊「他空见」则是藏传最彻底的如来藏正统论。\n", "topics": [{"title": "藏传大圆满（Dzogchen）", "body": "大圆满（佐巴钦波）为宁玛九乘之顶（阿底瑜伽），主张**心性本具光明自然智**；实修有**彻却**（立断）与**妥噶**（顿超）。\n隆钦巴（14世纪，无垢光尊者）著《七宝藏》集大成，建立龙钦心髓；吉美林巴（1729/30-1798）获其净相传承，撰《功德藏》。大圆满与汉地禅宗关系长期受讨论，隆钦巴本人有对和尚教法属上等根器者的阐述。\n", "source": "中国西藏网《试论藏传佛教大圆满法与汉地禅的关系问题》(tibet.cn) · 《大圆满心性休息》讲解 (bicwny.com)"}, {"title": "觉囊他空见 — 藏传如来藏正统论", "body": "觉囊派「**他空见**」（gzhan stong）：中观「诸法无自性」仅适用于世俗谛；与佛之无量功德无可异离的胜义谛应视为「他空」——所空者是客尘垢染。笃布巴·协饶坚赞（1292-1361）《山法了义海论》：「他空胜义谛常恒不变，周遍一切情器世界，**与如来藏同一意义**，在因位时即已本有。」\n觉囊以《如来藏经》等末转法轮为究竟了义；与格鲁自空见完全对立。多罗那他（1575-1643）著《印度佛教史》；五世达赖时卫藏觉囊遭禁绝，今存四川壤塘、青海果洛等传承。\n", "source": "土观《宗派源流》 · 沈卫荣主编《他空见与如来藏——觉囊派人物、教法、艺术和历史研究》(北京大学出版社)"}, {"title": "汉地圆觉传统 — 宗密的圆满觉性", "body": "《圆觉经》：「知幻即离，不作方便；离幻即觉，亦无渐次。」\n宗密依《圆觉经》开悟（804年），判其教相：与终教「彼此克体全相摄属」（「此经亦依如来藏故」）、属大乘顿教、分摄圆教（有理事无碍、缺事事无碍）。\n核心命题：「**如来圆觉，妙心涅槃，即名佛性**」；「生本成佛，唯是《圆觉》《华严》」。与《华严》「虽文有广略，妙轨同侪」。\n", "source": "宗密《圆觉经大疏》《圆觉经大疏钞》 · 董群《融合的佛教》第七章 (fjdh.cn) · 龚隽《从〈华严经〉到〈圆觉经〉：唐代华严教学中的经典转移》"}]}, {"id": "japan", "title": "日本判教 — 显密二教与十住心", "icon": "🗾", "intro": "日本佛教移植中国判教传统，称「教相判释」；空海《辨显密二教论》《十住心论》以密教为最高判摄，促成日本由奈良六宗式学派佛教向宗派佛教转化。\n", "topics": [{"title": "空海《辨显密二教论》— 显密二教判", "body": "空海（774-835）804年入唐，从青龙寺惠果受两部灌顶，为唐密第八祖；806年归国创真言宗。他入唐时中国尚无密教判教著作，其判教具开创性。\n《辨显密二教论》（二卷）：横向将全部佛法分为**显教与密教**——释迦等应化身所说为显教（浅显），《大日经》《金刚顶经》等大日如来法身所说为密教（秘奥）；主张「**显劣密胜**」，以六大（体）、四曼（相）、三密（用）为纲要，主张即身成佛。\n", "source": "空海《辨显密二教论》(T77n2427) · 《弘法大师空海密教思想研究》 · 陕西佛教祖庭文化资料 (sxlib.org.cn)"}, {"title": "《十住心论》— 九显一密", "body": "空海依《大日经·住心品》，将信奉者心境由浅入深分**十住心**：①异生羝羊心（凡夫）②愚童持斋心（儒教）③婴童无畏心（外道·老庄）④唯蕴无我心（声闻）⑤拔业因种心（缘觉）⑥他缘大乘心（法相宗）⑦觉心不生心（三论宗）⑧一道无为心（天台宗）⑨极无自性心（华严宗）⑩秘密庄严心（真言密宗）。\n前九为显教，唯第十为密教——「**九显一密**」；由此**真言第一、华严第二、天台第三、三论第四、法相第五**。\n学者指出此体系可与黑格尔《精神现象学》相比拟——描述人心逐渐升华的过程，而非单纯佛说顺序。\n", "source": "空海《秘密曼荼罗十住心论》《秘藏宝钥》(830年天长七年奉诏进献) · 《弘法大师空海密教思想研究》"}, {"title": "日本诸家判教谱系", "body": "日本判教主要代表：真言**空海**显密二教判及十住心；台密**安然**五时五教；净土真宗**亲鸾**二双四重；**日莲**立「五纲」之说（从教、机、时、国、师法先后等角度判释佛法）。\n日莲宗与净土宗、净土真宗、时宗等同属镰仓新佛教——日本僧人依据汉译佛经和中国著作自创的民族宗派，适应武士和平民信仰需求。\n空海的判教促成日本佛教由奈良六宗式的学派佛教向宗派佛教转化，深刻影响平安后期佛教发展。\n", "source": "末木文美士《日本佛教中判教(教判)的展开——经典解释的基础》 · 空海《辨显密二教论》"}]}, {"id": "rujia", "title": "儒家判教传统 — 道统与学案", "icon": "📜", "intro": "儒家虽不言「判教」，却有其结构对应物：韩非「儒分为八」的学派谱系、韩愈的「道统」说、汉宋之学案、今古文之辨、朱陆之辩——都是儒家版的「教相判释」与「互判」。\n", "topics": [{"title": "儒分为八 — 最早的学派谱系", "body": "《韩非子·显学》：「自孔子之死也，有子张之儒，有子思之儒，有颜氏之儒，有孟氏之儒，有漆雕氏之儒，有仲良氏之儒，有孙氏之儒，有乐正氏之儒。」\n韩非的判语：「孔墨之后，儒分为八，墨离为三，**取舍相反、不同，而皆自谓真孔墨**」——八派观点各异，却都自称孔门正宗。\n八派中影响最大者为孟氏（孟子）与孙氏（荀子，避汉宣帝讳称孙卿）；子思、孟子后世合称「思孟学派」；郭沫若认为应补子夏氏之儒（韩非因视法家出于子夏而剔除）。\n", "source": "《韩非子·显学》 · 刘泽华《中国文化发展中的「复古」迷思》(rujiazg.com) · 张岱年主编《孔子大辞典》"}, {"title": "道统说 — 儒家的「判教大纲」", "body": "韩愈《原道》首次完整构建儒家「**道统**」：「尧以是传之舜，舜以是传之禹，禹以是传之汤，汤以是传之文武周公，文武周公传之孔子，孔子传之孟轲，**轲之死，不得其传焉**。」其构建目的是抗衡佛教，并极力推尊孟子。\n后世批评甚烈：康有为指斥「后世之道术不明统绪不著者，皆韩愈粗疏灭裂之罪」；近代经学史研究指出「从孔子直接到孟子」是韩愈之后的一套理论，不正确。朱熹虽称赞韩愈「有辟佛老之功」，却把续接道统之功归于周敦颐和二程。\n", "source": "韩愈《原道》 · 康有为对韩愈道统之批评 (ctext.org 皇朝经世文新编) · 近代经学史研究"}, {"title": "今古文经学之争", "body": "秦焚书后，五经靠儒生记忆背诵流传，以汉隶书写，称**今文经学**；后孔子故居发现战国「蝌蚪文」儒经，刘歆加以整理，称**古文经学**——两派在文本与解读方法上均有差异。\n后经**郑玄**基本统一今古文，争议渐息；至清末疑古之风再起：康有为认为东汉以来经学多出刘歆伪造，乃新莽一朝之学，此说后被学者驳斥。\n", "source": "中国经学史讲义 (book.douban.com) · 康有为《新学伪经考》之评述"}, {"title": "朱陆鹅湖之会（1175）", "body": "淳熙二年（1175），吕祖谦约朱熹与陆九渊、陆九龄会于信州铅山鹅湖寺，「欲会归于一，而定所适从」。据陆门朱亨道记载：「元晦之意欲令人泛观博览而后归之约，二陆之意欲先发明人之本心而后使之博览。朱以陆之教人为太简，陆以朱之教人为支离。」\n陆九渊和诗：「**易简工夫终久大，支离事业竟浮沉**。」三年后朱熹和诗：「旧学商量加邃密，新知培养转深沉。」\n义理根源：朱熹「**性即理**」（理是客观实体，须格物穷理）；陆九渊「**心即理**」「宇宙即是吾心，吾心即是宇宙」（本心源出孟子四心）。黄宗羲总结：二人「同植纲常，同扶名教，同宗孔孟」。\n鹅湖之会开启了中国书院会讲与思辨探究的先河；1181年朱熹邀陆九渊白鹿洞讲「义利之辨」，刻石存之。\n", "source": "韩星《〈中庸〉「尊德性而道问学」章疏解》(rujiazg.com) · 中国孔子基金会「鹅湖之会」条目 (chinakongzi.org) · 《宋元学案·象山学案》"}]}, {"id": "daojia", "title": "道家道教的判教", "icon": "🎋", "intro": "中国最早的「学术判教」出自道家一脉：《庄子·天下》开学术史之先河，司马谈《论六家要指》创「以家论学」之法；道教则以「三洞四辅」七部体制组织全部经籍，并以《夷夏论》参与佛道互判。\n", "topics": [{"title": "《庄子·天下》— 学术史开山", "body": "《天下》篇被学界视为**中国学术史的开山之作**，对六经有经典评述：「《诗》以道志，《书》以道事，《礼》以道行，《乐》以道和，《易》以道阴阳，《春秋》以道名分。」\n熊十力推崇其「于六经各以一二字总括其旨，皆足以包通全经，含藏万理」，《论六经》实以《天下》篇为依据。\n庄子评诸子限于战国中期（儒墨道名各家），并感叹「**道术为天下裂**」——对诸子分流抱有失望，主张回归整全之道。\n", "source": "《庄子·天下》 · 熊十力《论六经》 · 论「九流十家」的建构历程——从《天下》篇到《汉志》(cqvip.com)"}, {"title": "司马谈《论六家要指》— 以家论学之始", "body": "司马谈（约前165-前110，太史令）《论六家要指》仅千字左右，但**首次以「家」论学**：先秦多以人论学（荀子《非十二子》、庄子《天下》只评个人），司马谈始据「要旨」分「家」，首分诸子为**阴阳、儒、墨、名、法、道德六家**，并首次将「道家」作为学派论述。\n评判标准为「**务为治**」：「夫阴阳、儒、墨、名、法、道德，此务为治者也，直所从言之异路，有省不省耳。」学术立场上崇信黄老，欲以道家统摄诸子。\n", "source": "司马谈《论六家要指》(《史记·太史公自序》引) · 「务为治」——读司马谈《论六家要旨》(光明日报 2020-05-11)"}, {"title": "《汉书·艺文志》九流十家", "body": "刘歆《七略》→班固《汉书·艺文志》，在司马谈六家基础上扩展为「**九流十家**」，以六艺统摄诸子，附「诸子出于王官」说；并将司马谈所称「道家」降格为「杂家」。\n学界指出：「九流十家」之说并非对先秦思想的忠实还原，而是基于时代思潮与自身学术立场的**理论建构**。\n", "source": "《汉书·艺文志·诸子略》 · 论「九流十家」的建构历程——从《天下》篇到《汉志》(cqvip.com)"}, {"title": "道教三洞四辅 — 七部道书体制", "body": "刘宋**陆修静**奉敕作《三洞经书目录》，以「**三洞**」总括《上清经》（洞真）、《灵宝经》（洞玄）、《三皇经》（洞神）三大系统经书——以三洞总括各派经书是陆修静的创造，在融会各道派、使道教整体化规范化方面作用重大。\n但三洞不载《太清经》与《道德经》，遂「增四辅以益三洞」——**太清、太平、太玄、正一**四辅，成**七部**体制。陈国符《道藏源流考》考定：七部法始于《正一经》（创立者孟景翼），非孟法师《玉纬七部经书目》。\n", "source": "陈国符《道藏源流考》 · 百年道学精华集成·经籍考古卷 (詹石窗总主编)"}, {"title": "顾欢《夷夏论》— 佛道互判", "body": "顾欢（吴郡盐官人）作《夷夏论》（刘宋末年），核心论旨：\n• 「**道则佛也，佛则道也。其圣则符，其迹则反**」——二教圣道相符而教迹相反；\n• 「舟车均于致远，而有川陆之节」——佛道齐乎达化，而有夷夏之别，「舍华效夷」则悖德犯顺；\n• 优劣之辨：「佛教文而博，言华而引，经繁而显；道教质而精，言实而抑，经简而幽」；「佛是破恶之方，道是兴善之术」。\n", "source": "顾欢《夷夏论》(《全齐文》卷二十二, 严可均辑)"}]}, {"id": "world", "title": "世界宗教的判教", "icon": "🌍", "intro": "判教现象不限于佛教：基督教三大传统、伊斯兰教法学派、印度教六派哲学——各大宗教内部同样以「正统—异端」「教法—学派」的结构组织自我与他者。\n", "topics": [{"title": "基督教 — 三大传统与神学路线", "body": "基督教经历1054年东西教会分裂与1517年宗教改革，形成**天主教、东正教、新教**三大传统——各传统各有教义判准（教宗权威/大公传统/唯独圣经）。\n当代神学内部又有「判教」：分析哲学与大陆哲学的分野深刻影响神学——以耶鲁大学为中心的**后自由主义学派**（Lindbeck、Hans Frei、Stanley Hauerwas、Kathryn Tanner）在与分析哲学传统对话方面走得最远，主要借鉴**后期维特根斯坦**（《哲学研究》），而非以弗雷格、罗素为代表的分析哲学主流所继承的早期维特根斯坦（《逻辑哲学论》）；宗教哲学家如 Richard Swinburne（后皈依东正教）则为分析式宗教哲学的典范。\n", "source": "St. Vladimir Theological Quarterly Vol. 47 Issue 2 (2003) (archive.org) — 分析哲学与大陆哲学在神学中的体现"}, {"title": "伊斯兰 — 逊尼什叶与四大教法学派", "body": "逊尼派与什叶派的分歧源于先知穆罕默德去世后**继承人问题**：多数人主张推选领导人（逊尼），另一些追随先知堂弟兼女婿阿里（什叶）。680年阿里之子侯赛因于卡尔巴拉遇难；第六任伊玛目贾法尔·萨迪克（卒765）的教义成为什叶**贾法里学派**的基础。\n逊尼派教法学派初期多达数百，至11世纪定型为**四大教法学派**：哈乃斐派（艾布·哈尼法，8世纪中叶，重类比推理「意见派」，奥斯曼帝国采纳，信众最多）、马立克派（马立克《穆宛塔》，重麦地那传统与公益）、沙斐仪派（兼采两长，确立四大法源：古兰/圣训/类比/公议）、罕百里派（重经典圣训，沙特主流）。\n什叶派教法学分**阿赫巴尔学派**与**乌苏勒学派**（现居主导，重当代权威教法学家决断）。\n", "source": "维基百科「伊斯兰教法学」(zh.wikipedia.org) · 教法史 (baike.baidu.com)"}, {"title": "印度教 — 六派哲学与不二论", "body": "印度古代哲学按对待吠陀权威的态度分**正统派与非正统派**（异流三派：顺世论、耆那教、佛教）。尊奉吠陀的**六派哲学**：\n①数论派（迦毗罗，《数论颂》——神我Purusha与自性Prakriti二原理）②瑜伽派（巴丹阇梨《瑜伽经》）③正理派（乔达摩《正理经》，重逻辑）④胜论派（羯那陀《胜论经》，六句义）⑤弥曼差派（耆米尼《弥曼差经》，重祭祀）⑥吠檀多派（巴达罗耶那《梵经》，「梵我一元论」，印度哲学主流）。\n**商羯罗**复兴吠檀多**不二论**：「梵我不二」——事物与梵不二，梵的幻力（无明）使人执差别，消除无明即解脱。\n", "source": "姚卫群编译《古印度六派哲学经典》(商务印书馆2003) · 木村泰贤《印度六派哲学》(2022中译本)"}]}, {"id": "academic", "title": "学术与哲学流派的判教", "icon": "🎓", "intro": "学术界同样有自己的「判教」：司马谈六家、汉志九流是其古典形态；现代则有分析哲学与大陆哲学的分野、1923年科玄论战、库恩的「范式」之争。\n", "topics": [{"title": "分析哲学与大陆哲学的分野", "body": "20世纪哲学最大的「判教」是**分析哲学**与**大陆哲学**的分野。有中国学者将其放大为世界三种文化、三种哲学的划分：西方思维是分析思维→**分析哲学**；印度和阿拉伯思维是辩证思维→**宗教哲学**（与宗教传统紧密相连）；中国思维是综合思维→（被称）模糊哲学。该说主张中国哲学应汲取分析哲学之长以弥补分析思维的不足，同时汲取宗教哲学之长以弥补精神信仰的不足。\n", "source": "《中国哲学向何处去？——兼论世界三种文化、三种哲学》(河北学刊 2007年06期, cnki)"}, {"title": "科玄论战（1923）— 科学主义的判教", "body": "1923年2月张君劢清华演讲《人生观》，提出科学与人生观**五点差异**（客观/主观、推理/直觉、分析/综合、因果律/自由意志、想象统一/人格单一），结论「科学无论如何发达，而人生观问题之解决，决非科学所能为力」。\n丁文江在《努力周报》发表《玄学与科学——评张君劢的〈人生观〉》，斥其为「玄学鬼」附身。论战形成**科学派**（丁文江、胡适、吴稚晖）、**玄学派**（张君劢、梁启超、张东荪）、**唯物史观派**（陈独秀、瞿秋白）三大阵营；1918年梁启超《欧游心影录》「科学万能之梦」的反思是玄学派的思想背景。\n刘钝（2023）指出：今日中国思想界三种主要思潮——马克思主义、自由主义、文化保守主义——在科玄论战中均可觅到踪影。\n", "source": "林毓生《民初「科学主义」的兴起与含意》(aisixiang.com) · 刘钝《「科玄论战」百年：回顾与展望》(ucas.edu.cn 2023) · 维基文库《丁文江的传记·〈玄学与科学〉的论争(1923)》"}, {"title": "库恩「范式」— 科学界的判教模型", "body": "库恩1962年《科学革命的结构》创立**历史主义学派**，提出「**范式**」转换理论：科学共同体遵循「前科学—常规科学—危机—革命—新的常规科学」的周期性结构；科学革命本质是「范式转换」。\n**不可通约性**：不同范式下的科学语言无法完全互译（库恩强调「不可通约不是不可比」）。\n批判方：波普尔（《常规科学及其危险》，抨击其相对主义）、拉卡托斯（「不可能有什么逻辑，只有发现的心理学」）、沃特金斯（科学共同体「类似宗教团体」）——1965年伦敦国际科学哲学研讨会为集中爆发点。拉卡托斯另立「**科学研究纲领**」（硬核、保护带、启示规则）以保留科学的合理性。\n", "source": "方在庆《库恩的身份认同——纪念〈科学革命的结构〉问世50周年》(philosophychina.cssn.cn) · 历史主义学派条目 (baike.baidu.com)"}]}, {"id": "tech", "title": "科技圈的判教 — 范式与路线之争", "icon": "🔭", "intro": "科技圈的分派与互判同样激烈：量子力学诠释之争、量子引力三大路线之争、AI三大学派之争——各自有「本体论立场」与「究竟方案」，与判教结构高度同构。\n", "topics": [{"title": "玻尔与爱因斯坦 — 量子诠释之争", "body": "爱因斯坦与玻尔围绕量子力学展开**三次论战**（测不准原理两次 + EPR）。1935年EPR论文借复合系统思想实验论证量子力学「并不为物理实在提供一个完全的描述」；玻尔在35天后即致信《自然》并以同标题发文回应，说明EPR所提问题是一切量子现象所共有。\n李田（2011）指出：爱因斯坦—玻尔之争是20世纪物理学史经典案例——「重大科学革命的科学争论背后必定是最根本的哲学问题之争」。\n当代诠释分裂更甚：范·弗拉森模态诠释、Fuchs的QBism、哥本哈根诠释、多世界诠释并存，量子信息学家Adán Cabello称诠释争论领域为「**疯狂地图**」（a map of madness）。\n", "source": "李田《科学争论中的逻辑推理——量子革命中的爱因斯坦-玻尔论战》(《自然辩证法研究》2011) · arXiv:2101.00255 Bohr’s Anti-Realist Realism (ar5iv.labs.arxiv.org)"}, {"title": "量子引力三大路线 — 三种世界观", "body": "量子引力竞争的三大路径：**弦理论**（高维几何框架——「几何本体论」）、**圈量子引力**（自旋网络方案——「关系本体论」）、**信息基础论**（量子信息编码——「信息本体论」）。\n该研究认为：量子引力理论的竞争「本质上是三种世界观之争」，各路线表面上互不相容，但「可能各自捕获了真理的不同侧面」——多元竞争最终或走向统一；并展望「时空本身作为计算资源」的可能性。\n", "source": "《第五章：引力理论的未来图景——黑洞信息悖论与量子引力：万物理论的前哨战》(aiknowledge.cn)"}, {"title": "AI三大学派 — 符号·连接·行为", "body": "人工智能学界形成**三大学派**：「符号主义研究抽象思维，连接主义研究形象思维，行为主义研究感知思维」。\n• **符号主义**（智能即程序）：源于数理逻辑；西蒙、麦卡锡、纽厄尔、费根鲍姆；里程碑：LT逻辑理论机（1956）→专家系统DENTRAL（1968）→「深蓝」战胜卡斯帕罗夫（1997）；长期主导AI。\n• **连接主义**（智能即仿生）：源于仿生学；术语由赫布1940年代提出；里程碑：MP模型（1943）→感知机（1957）→反向传播（1986）→辛顿深度信念网络（2006）→深度学习；DeepSeek（2024）降低成本。\n• **行为主义**（智能即控制）：源于40-50年代控制论；重感知与行动，不需知识表示；代表：布鲁克斯六足行走机器人；影响强化学习。\n三派形成是还原论「分而治之」的结果（仿功能→符号主义，仿结构→连接主义，仿行为→行为主义）；当前趋势是**三派深度融合**（ChatGPT、Sora、DeepSeek推动感知→认知、专用→通用）。\n", "source": "《人工智能三大学派的理论分野》(中国社会科学报 2025-05-22, cssn.cn)"}]}, {"id": "masters", "title": "海云·成观两位法师的阐释与评述", "icon": "🌊", "intro": "两位法师分属贤首宗第四十二世（海云继梦，贤首兼慈恩宗高原法系）与贤首兼慈恩宗第四十二世（成观法师，天台出家·东密阿阇梨·曹洞传人），对判教互判议题各有系统的宗内评述。\n", "topics": [{"title": "海云法师：空有性在华严判教中的位置", "body": "《四十华严讲记》第12讲：唯识／法相宗＝大乘始教（修真空观）；性宗＝大乘终教、真性宗＝大乘顿教（理事无碍观）；华严本宗＝法界宗（周遍含容观）。\n华严的包容性相当大，但从批判的角度看，要求又极为严格。\n", "source": "海云继梦《四十华严讲记》第一卷 第12讲 (fjdh.cn)"}, {"title": "海云法师：唯识与唯性的判摄总纲", "body": "「唯识」研究**缘起法界**（如《地藏经》「起心动念无不是业无不是罪」），法印苦空无常无我，目标寂灭涅槃；「唯性」契**性起法界**，破一分无明证一分法身，目标常乐我净，涅槃后依体起用饶益众生。\n修行必须「转唯识成唯性」——苦空无常无我只是达到常乐我净的媒介和过渡。\n", "source": "海云继梦《菩萨问明品讲记》第二章 (wuming.xuefo.net)"}, {"title": "海云法师：语言模式论", "body": "《华严金狮子章讲记》第十一：「法相宗有法相宗的语言模式，法性宗有法性宗的语言模式，**空宗有空宗的语言模式，性宗有性宗的语言模式**」，须透过华严宗的语言模式才能了解华严论文背后的整个状态。\n本体层层递进：金性是本体→空性是本体→空性、佛性、法性皆本体则空性又成相。以六相圆融看世间即转「法界」，本来寂灭，一真法界。\n", "source": "海云继梦《华严金狮子章讲记》第十一 (wuming.xuefo.net: http://wuming.xuefo.net/nr/7/70462.html)"}, {"title": "海云法师：一佛乘的现代判摄", "body": "修行四阶次：小乘（出离心/出离道）→ 中乘（缘觉）→ 菩萨乘（波罗蜜乘）→ **普贤乘**（华严不共别圆，最高）。\n共同圆教只强调到菩萨行；不共别圆强调普贤行、普贤心、普贤乘——「不可思议的解脱境界」，与三乘完全无关。\n", "source": "海云继梦《三圣圆融观》 (fjdh.cn)"}, {"title": "成观法师：性相不二、诸宗圆融", "body": "• 性相二宗如鸟之双翼，相辅相成；《起信论》是「小本的《楞伽经》」，性相圆融；\n• 解深密经、华严经、密严经、楞伽经四部皆是「性相圆融」经典，且同为显密二教所共尊；\n• 达摩以《楞伽经》印心（六祖始改为《金刚经》），禅宗正法眼藏原本「性相不分、显密不分」；后世分门修学是因众生根器转钝，「**并非法本有分派，而实系人根转浅所致**」；\n• 性相融会即「如来知见」——学性者不解相、学相者不了性是学佛最大难题之一；「执摸象之解」而自是非他、互相攻讦者「即是迷人，枉受辛勤，不入正理」。\n", "source": "成观法师《八识规矩颂义贯》相宗系列总序 (fjdh.cn) · 《楞伽阿跋多罗宝经义贯》卷第二 (fjdh.cn)"}, {"title": "成观法师：末法退化史观", "body": "成观法师《天台小止观讲解》判各宗退化：\n• 禅宗：达摩依《楞伽》印心→五祖《金刚经》→唐宋参公案→宋末参话头→明清沦为「口头禅」（耍口头禅者为「禅和子」）；\n• 密教：唐密仪轨散佚「只剩下几个法，而且都是没有完全的仪轨」，只剩咒乃至印；\n• 净土：慧远大师修念佛三昧、般舟三昧、十六观，非散心念佛可成；「法就越来越少、越来越简化，然后简化到法几乎都没有了叫做末法」。\n", "source": "成观法师《天台小止观讲解》第三十八集 (wuming.xuefo.com: http://wuming.xuefo.com/nr/6/61435.html)"}, {"title": "成观法师：译经宏愿与护法事业", "body": "成观法师（1947-，台北人）1988年依天台宗第45代显明老和尚出家，1996年获日本高野山真言宗第53世阿阇梨位，2010年承贤首宗兼慈恩宗第四十二世法脉，另具曹洞宗传承；1991年创办台北大毘卢寺，主修禅密，推行汉传东密。\n任「楞严座主、法华译主、华严译主」，建「新逍遥园译经院」将华严、法华等经译为英文——「唯有广译英文、存于世界各地，方能使佛陀正法的传承长久住世」。\n", "source": "百度百科「成观法师」 · 成观法师《天台小止观讲解》第三十八集"}]}], "references": ["智顗《法华玄义》· 灌顶《天台八教大意》· 湛然《法华玄义释签》· 谛观《天台四教仪》· 吉藏《三论玄义》 (CBETA)", "宗密《禅源诸诠集都序》T48n2015 · 法藏《华严一乘教义分齐章》T45n1866 · 《解深密经》T16n0676 · 《大乘起信论》T32n1666 (CBETA)", "汤用彤《汉魏两晋南北朝佛教史》 · 韩焕忠《华严判教论》(齐鲁书社) · 王仲尧《南北朝涅槃师的判教及其价值意义》", "印顺《印度之佛教》·《游心法海六十年》 · 太虚《佛法总抉择谈》《我怎样判摄一切佛法》《佛教各宗派源流》 · 吕澂《起信与楞伽》《试论中国佛学有关心性的基本思想》", "高崎直道《如来藏思想的形成》(春秋社1974) · 释恒清《「批判佛教」驳议》(台大哲学论评24期2001) · 周贵华《日本「批判佛教」思潮：反应与研究》", "赖永海《中国佛性论》 · 吴忠伟《圆教的自拘——山家山外之争与宋代制度佛学》 · 龚隽《北宋天台宗对〈大乘起信论〉与〈十不二门〉的诠释与论争》", "土观·罗桑却吉尼玛《宗派源流》(1801) · 何杰峰《藏传佛教判教研究》(巴蜀书社) · 敦珠法王《四部宗义要略》(谈锡永译) · 沈卫荣主编《他空见与如来藏》(北京大学出版社)", "空海《辨显密二教论》T77n2427 ·《秘密曼荼罗十住心论》·《秘藏宝钥》 · 末木文美士《日本佛教中判教(教判)的展开》", "《韩非子·显学》 · 韩愈《原道》 · 《宋元学案·象山学案》 · 韩星《〈中庸〉「尊德性而道问学」章疏解》", "《庄子·天下》 · 司马谈《论六家要指》(《史记·太史公自序》) · 《汉书·艺文志·诸子略》 · 陈国符《道藏源流考》 · 顾欢《夷夏论》(《全齐文》卷二十二)", "姚卫群编译《古印度六派哲学经典》(商务印书馆2003) · 木村泰贤《印度六派哲学》 · 维基百科「伊斯兰教法学」", "林毓生《民初「科学主义」的兴起与含意》 · 刘钝《「科玄论战」百年：回顾与展望》(2023) · 方在庆《库恩的身份认同》 · 库恩《科学革命的结构》(1962)", "李田《科学争论中的逻辑推理——量子革命中的爱因斯坦-玻尔论战》(自然辩证法研究2011) · 《人工智能三大学派的理论分野》(中国社会科学报2025-05-22) · 量子引力三路线综述 (aiknowledge.cn)", "海云继梦《四十华严讲记》《菩萨问明品讲记》《华严金狮子章讲记》《三圣圆融观》《自性啟航》(空庭书院) · 成观法师《楞伽经义贯》《八识规矩颂义贯》《天台小止观讲解》(大毘卢寺)"]}};

, "z": 5, "rel": "confucian", "label": "📖孔子逝世·儒学历程开始", "info": "73岁卒于鲁国。弟子编《论语》,儒学逐渐成为中华文明主流思想,后与佛教形成长达两千年的融突关系。"}, {"y": -372, "lat": 35.5, "lng": 117.0, "z": 5, "rel": "confucian", "label": "📖孟子·性善论", "info": "孟子(约前372-前289),战国儒家代表。提出性善论仁政说。其心性之学后与佛教如来藏思想有深层对话空间。", "src": "《史记·孟子荀卿列传》"}, {"y": -335, "lat": 36.0, "lng": 117.0, "z": 5, "rel": "confucian", "label": "📖孟子·游说齐梁", "info": "孟子效法孔子周游列国,先后至齐梁等国宣扬仁政王道。齐宣王时曾为客卿,但主张终不见用。晚年退而与弟子万章等作《孟子》七篇。", "src": "《史记·孟子荀卿列传》"}, {"y": -469, "lat": 37.9, "lng": 23.7, "z": 4, "rel": "western", "label": "🏛苏格拉底·雅典", "info": "苏格拉底(前469-前399),古希腊哲学奠基人。与孔子大致同时代,东西方哲学两大源头并行发展。", "bg": true, "src": "西洋哲学史"}, {"y": -334, "lat": 33.0, "lng": 44.0, "z": 3, "rel": "western", "label": "🏛亚历山大大帝东征", "info": "亚历山大东征至印度河流域,希腊文化与印度文明首次大规模接触。为后来犍陀罗佛教艺术的出现埋下伏笔。", "bg": true, "src": "世界史"}, {"y": -369, "lat": 33.5, "lng": 115.0, "z": 5, "rel": "daoist", "label": "☯庄子·蒙地漆园吏", "info": "庄子(约前369-前286)生于宋国蒙地(今豫皖交界)。曾任漆园吏,后弃官隐居。楚威王曾聘其为相,庄子笑拒:宁游戏污渎之中自快,无为有国者所羁。", "src": "《史记·老子韩非列传》"}, {"y": -300, "lat": 33.5, "lng": 115.0, "z": 5, "rel": "daoist", "label": "☯庄子·著《南华真经》", "info": "庄子晚年著书十万余言。《逍遥游》论精神自由,《齐物论》破主客二元,《养生主》说庖丁解牛。其坐忘心斋之说后与佛教禅观相通。", "src": "《庄子》/《史记》"}, {"y": -313, "lat": 35.0, "lng": 116.0, "z": 5, "rel": "confucian", "label": "📖荀子·性恶论", "info": "荀子(约前313-前238),战国儒家。性恶隆礼重法。其天人之分与佛教缘起论有可比较处。", "src": "《史记·孟子荀卿列传》"}, {"y": -563, "lat": 27.5, "lng": 83.3, "z": 5, "label": "释迦诞生·蓝毗尼园", "info": "悉达多太子生于迦毗罗卫。幼受婆罗门教育,后出家求道。"}, {"y": -528, "lat": 24.7, "lng": 85, "z": 5, "label": "释迦成道·菩提伽耶", "info": "35岁菩提树下觉悟。华严宗传统:此后三七日于定中说《华严经》,揭示法界缘起。"}, {"y": -500, "lat": 25.5, "lng": 83.0, "z": 4, "label": "六师外道·印度思想百花齐放", "info": "佛陀时代六大非佛教思想家活跃。耆那教(尼乾陀若提子)、唯物论(阿耆多)、宿命论(末伽梨)等与佛教同时竞争。佛教正是在这一多元思想生态中确立其独特教义。", "bg": true, "src": "《沙门果经》(DN 2)"}, {"y": -528, "lat": 25.4, "lng": 83, "z": 5, "label": "初转法轮·鹿野苑", "info": "为五比丘说四圣谛八正道。僧团成立,佛教诞生。此后45年游化讲经。"}, {"y": -483, "lat": 26.74, "lng": 83.89, "z": 5, "label": "释迦入灭·拘尸那罗", "info": "80岁于拘尸那罗入灭。弟子结集经律,佛教由此向四方传播。"}, {"y": -260, "lat": 25.3, "lng": 83, "z": 4, "label": "阿育王·佛教走出印度", "info": "阿育王皈依,派传教师向中亚东南亚传播。第三次结集。佛教从区域宗教变为世界宗教。", "src": "阿育王石刻诏书"}, {"y": -200, "lat": 34.0, "lng": 72.0, "z": 4, "label": "希腊·犍陀罗佛教艺术(有争议)", "info": "希腊-巴克特里亚时期佛教与希腊艺术在犍陀罗相遇。最早佛像出现时间学界有争议:一说公元前1世纪,一说公元1世纪。犍陀罗在佛教东传中的枢纽地位则无争议。", "src": "佛教艺术史(有学术争议)"}, {"y": -100, "lat": 33.7, "lng": 72.8, "z": 4, "label": "犍陀罗·大乘经论结集", "info": "犍陀罗地区成为大乘佛教发展重镇。般若经、华严经等大乘经典在此地区逐步形成。", "src": "佛教文献学"}, {"y": 65, "lat": 33.7, "lng": 72.8, "z": 4, "label": "迦腻色迦王·犍陀罗结集", "info": "贵霜帝国第四次结集。佛法深入中亚,犍陀罗成东传枢纽。大乘经论在此大量结集。"}, {"y": 80, "lat": 27.5, "lng": 77.7, "z": 4, "label": "马鸣·大乘起信论", "info": "造《大乘起信论》。一心二门之说后为华严心性论与判教体系的重要理论基础。"}, {"y": -136, "lat": 34.3, "lng": 108.9, "z": 5, "rel": "confucian", "label": "📖汉武帝·独尊儒术", "info": "董仲舒建议罢黜百家独尊儒术。儒学成为汉朝官方意识形态,后来佛教入华时与儒家伦理产生深刻碰撞与融合。", "src": "《汉书·董仲舒传》"}, {"y": 0, "lat": 31.7, "lng": 35.2, "z": 4, "rel": "western", "label": "✝耶稣诞生·伯利恒", "info": "耶稣基督诞生于犹太伯利恒。基督教此后逐渐发展为世界性宗教,与佛教在欧亚大陆两端并行发展。", "bg": true, "src": "《新约圣经》"}, {"y": 34, "lat": 32.0, "lng": 108.0, "z": 5, "rel": "daoist", "label": "☯张道陵诞生·沛国丰县", "info": "张道陵(34-156),原名张陵,沛国丰县人(今江苏丰县)。早年通晓五经,后弃儒学道。", "src": "《后汉书》《神仙传》"}, {"y": 100, "lat": 30.0, "lng": 105.0, "z": 5, "rel": "daoist", "label": "☯张道陵·入蜀鹤鸣山", "info": "张道陵入蜀至鹤鸣山(今四川大邑)。在此得太上老君亲授天师之位,创正一盟威之道(五斗米道)。", "src": "《神仙传》"}, {"y": 142, "lat": 30.5, "lng": 104.0, "z": 5, "rel": "daoist", "label": "☯张道陵·青城山·道教正式创立", "info": "张道陵在青城山设二十四治(教区),正式建立天师道。奉老子为教祖,以《道德经》为根本经典,《老子想尔注》阐发教义。道教从此成为有组织的宗教。", "src": "《后汉书·刘焉传》《神仙传》"}, {"y": 156, "lat": 30.5, "lng": 104.0, "z": 5, "rel": "daoist", "label": "☯张道陵·飞升·系师张衡继任", "info": "张道陵于青城山飞升(逝世),享年123岁。其子张衡继任为第二代天师(系师),孙张鲁为第三代天师,天师世家由此传承至今。", "src": "《神仙传》《三国志·张鲁传》"}, {"y": 167, "lat": 34.7, "lng": 112.4, "z": 5, "label": "支谶译兜沙经·华严首入汉地", "info": "月氏僧支娄迦谶至洛阳,译《佛说兜沙经》。虽仅1卷,却是华严经文首次汉译。"}, {"y": 320, "lat": 25.1, "lng": 85.4, "z": 4, "label": "无著·世亲·那烂陀寺", "info": "瑜伽行派于那烂陀弘传。世亲造《十地经论》,后经汉译催生地论学派。"}, {"y": 344, "lat": 41.7, "lng": 82.9, "z": 4, "label": "鸠摩罗什出生·龟兹", "info": "罗什生于西域龟兹。后至长安成四大译师之首,译十住经等为华严学奠基。"}, {"y": 359, "lat": 34, "lng": 72, "z": 4, "label": "佛驮跋陀罗·北天竺", "info": "觉贤生于北天竺。后至建康首译六十华严全本。"}, {"y": 401, "lat": 34.3, "lng": 108.9, "z": 5, "label": "罗什至长安·译经运动", "info": "弘始三年至长安,八百沙门参与译场。译中论/十住经/法华经等。"}, {"y": 320, "lat": 30.0, "lng": 115.0, "z": 5, "rel": "daoist", "label": "☯葛洪·《抱朴子》", "info": "葛洪(283-363),晋代道教思想家。著《抱朴子》内篇系统阐述道教神仙理论。道教从此有了完整的理论体系。", "bg": true, "src": "《晋书·葛洪传》"}, {"y": 399, "lat": 34.3, "lng": 108.9, "z": 5, "label": "法显西行·长安出发", "info": "法显(337-422)以65岁高龄从长安出发,经河西走廊、敦煌、鄯善、于阗,越葱岭至印度。同行11人,途中或返或亡。", "src": "《佛国记》"}, {"y": 405, "lat": 37.1, "lng": 79.9, "z": 5, "label": "法显·于阗·观行像盛会", "info": "法显至于阗国,恰逢盛大的行像法会。记录于阗佛教繁荣景象。于阗后为藏译华严底本来源。", "src": "《佛国记》"}, {"y": 410, "lat": 25.1, "lng": 85.4, "z": 5, "label": "法显·抵达中天竺", "info": "法显越过葱岭雪山进入印度。游历那烂陀、菩提伽耶、鹿野苑等圣迹,学梵书梵语,抄写戒律。", "src": "《佛国记》"}, {"y": 420, "lat": 32.1, "lng": 118.8, "z": 5, "label": "六十华严·建康道场寺", "info": "佛驮跋陀罗译六十华严34品。华严经首次以全貌呈现汉地。"}, {"y": 468, "lat": 34.7, "lng": 112.4, "z": 5, "label": "慧光·地论南道派", "info": "从勒那摩提学十地经论,开地论南道。其学数代传至智俨法藏,为华严义学前身。"}, {"y": 313, "lat": 41.0, "lng": 28.9, "z": 4, "rel": "western", "label": "✝米兰敕令·基督教合法化", "info": "罗马皇帝君士坦丁颁布米兰敕令,基督教在罗马帝国合法化。从此基督教与佛教在欧亚大陆两端各自传播发展。", "bg": true, "src": "罗马帝国史"}, {"y": 508, "lat": 34.7, "lng": 112.4, "z": 5, "label": "十地经论·洛阳译出", "info": "菩提流支译世亲十地经论。催生南北朝最重要的义学流派:地论学派。"}, {"y": 557, "lat": 33.9, "lng": 109, "z": 6, "label": "杜顺·终南山·华严创宗", "info": "著法界观门/五教止观。以法界三观和五教止观为华严宗奠定修行理论基础。"}, {"y": 597, "lat": 29.2, "lng": 121, "z": 5, "label": "智𫖮·天台宗成立", "info": "天台宗于天台山成立(中国最早宗派)。华严判教中「同教一乘」即针对天台而设。"}, {"y": 602, "lat": 33.9, "lng": 109, "z": 6, "label": "智俨·华严二祖", "info": "从杜顺出家,著搜玄记/一乘十玄门。开创华严宗经疏传统,为法藏之师。"}, {"y": 643, "lat": 34.3, "lng": 108.9, "z": 6, "label": "法藏·华严三祖·宗派确立", "info": "系统化五教十宗判教。武则天赐号贤首。参与八十华严译场证义。华严宗至此正式确立。"}, {"y": 629, "lat": 34.3, "lng": 108.9, "z": 5, "label": "玄奘西行·长安出发", "info": "玄奘(602-664)29岁从长安出发,经秦州、凉州、瓜州,偷渡玉门关,穿越莫贺延碛沙漠,九死一生抵高昌。", "src": "《大唐大慈恩寺三藏法师传》"}, {"y": 631, "lat": 25.1, "lng": 85.4, "z": 5, "label": "玄奘·抵达那烂陀寺", "info": "玄奘越兴都库什山进入印度,在那烂陀寺师从戒贤法师,学习瑜伽师地论等。戒贤为无著世亲瑜伽行派传人。", "src": "《大慈恩寺三藏法师传》"}, {"y": 643, "lat": 24.7, "lng": 84.9, "z": 5, "label": "玄奘·曲女城无遮大会", "info": "戒日王为玄奘在曲女城举行无遮大会,18国王齐聚。玄奘立真唯识量,18日无人能破,获大乘天和解脱天尊号。", "src": "《大慈恩寺三藏法师传》"}, {"y": 645, "lat": 34.3, "lng": 108.9, "z": 5, "label": "玄奘归国·唯识宗兴起", "info": "玄奘携657部梵本归国,创唯识宗。华严性宗与唯识相宗形成教内深度对话。"}, {"y": 671, "lat": 23.1, "lng": 113.3, "z": 5, "label": "义净·广州乘船赴印", "info": "义净(635-713)37岁从广州搭乘波斯商船出发,经南海诸国至印度。选择海路避开了西域战乱,开辟求法新路线。", "src": "《南海寄归内法传》"}, {"y": 675, "lat": 25.1, "lng": 85.4, "z": 5, "label": "义净·那烂陀寺留学", "info": "义净抵达那烂陀寺,留学十载。学习瑜伽、中观、因明,并抄写戒律典籍。期间还到访王舍城灵鹫山等圣迹。", "src": "《南海寄归内法传》"}, {"y": 695, "lat": 34.3, "lng": 108.9, "z": 5, "label": "义净归国·洛阳", "info": "义净携梵本400余部归国,武则天亲迎于洛阳。后主持译场译经56部230卷,偏重律藏。与法显、玄奘并称中国三大求法僧。", "src": "《宋高僧传》卷一"}, {"y": 652, "lat": 37.1, "lng": 79.9, "z": 4, "label": "实叉难陀·于阗", "info": "生于于阗。于阗为中亚佛教枢纽:既是实叉难陀故乡,又是藏译华严底本来源。"}, {"y": 699, "lat": 34.7, "lng": 112.4, "z": 6, "label": "八十华严·洛阳佛授记寺", "info": "实叉难陀译八十华严39品。法藏证义。后世流传最广汉译本。"}, {"y": 712, "lat": 34.3, "lng": 108.9, "z": 6, "label": "法藏圆寂·长安", "info": "华严三祖圆寂。讲华严经三十余遍,著五教章/探玄记。实际创立者功业圆满。"}, {"y": 713, "lat": 24.8, "lng": 113.6, "z": 5, "label": "慧能入灭·南宗禅兴起", "info": "六祖慧能入灭。南宗禅此后大盛。华严五祖宗密兼为禅宗荷泽传人,开启禅教融合。"}, {"y": 780, "lat": 34, "lng": 108.7, "z": 6, "label": "宗密·圭峰·禅教融合", "info": "华严五祖宗密住圭峰。著禅源诸诠集都序,融合华严与禅宗。教禅一致思想基础确立。"}, {"y": 798, "lat": 34.3, "lng": 108.9, "z": 6, "label": "四十华严·长安", "info": "般若三藏译四十华严(入法界品全本)。善财五十三参完整故事得以汉译。"}, {"y": 716, "lat": 34.3, "lng": 108.9, "z": 6, "label": "善无畏·金刚智·开元三大士", "info": "善无畏(637-735)716年至长安译大日经传胎藏界。金刚智(671-741)719年至长安译金刚顶经传金刚界。与不空并称开元三大士,中国密宗奠基。", "src": "《宋高僧传》"}, {"y": 725, "lat": 34.3, "lng": 108.9, "z": 6, "label": "一行·大日经疏·大衍历", "info": "一行(683-727)师事善无畏,协助译大日经并著疏二十卷。制大衍历为唐代最精确历法。兼通天文学与密宗义学。", "src": "《宋高僧传》卷五"}, {"y": 800, "lat": 29.7, "lng": 91.1, "z": 4, "label": "藏译华严·吐蕃", "info": "胜友/智军将于阗本华严译为藏文Toh44(45品)。华严经中亚于阗传入西藏。"}, {"y": 805, "lat": 34.3, "lng": 108.9, "z": 6, "label": "慧果·青龙寺·密宗集大成", "info": "慧果(746-805)兼承善无畏胎藏界与金刚智金刚界两部密法。住长安青龙寺,为密宗第七祖。日本空海从此受法。", "src": "空海《御请来目录》"}, {"y": 806, "lat": 34.2, "lng": 135.6, "z": 6, "label": "空海归国·日本真言宗创立", "info": "空海(774-835)804年入唐从慧果受法,806年归国于高野山开创日本真言宗。著十住心论以华严判教框架判摄显密诸宗。", "src": "日本佛教史"}, {"y": 839, "lat": 39, "lng": 113.6, "z": 6, "label": "澄观圆寂·五台山", "info": "华严四祖圆寂。著华严经疏60卷/演义钞90卷。集大成者,历七帝之师。"}, {"y": 610, "lat": 21.4, "lng": 39.8, "z": 4, "rel": "islamic", "label": "☪穆罕默德·伊斯兰教创立", "info": "穆罕默德在麦加开始传播伊斯兰教。世界三大宗教格局(佛教/基督教/伊斯兰教)至此确立。", "bg": true, "src": "《古兰经》/伊斯兰教史"}, {"y": 841, "lat": 34, "lng": 108.7, "z": 5, "label": "宗密圆寂·华严盛极而衰", "info": "五祖宗密圆寂。次年武宗灭佛,华严典籍大量焚毁,此后转入隐传阶段。"}, {"y": 845, "lat": 34.3, "lng": 108.9, "z": 5, "label": "会昌法难·华严典籍焚毁", "info": "唐武宗灭佛。华严传承几近断绝。此后义学隐传,直至宋代复兴。"}, {"y": 800, "lat": 30.0, "lng": 112.0, "z": 5, "rel": "daoist", "label": "☯吕洞宾·道教内丹", "info": "吕洞宾(约798-?),唐末五代道教宗师。后被尊为八仙之一。其内丹学说吸收佛教禅宗心性论,体现佛道深度融合。", "bg": true, "src": "道教神仙传"}, {"y": 868, "lat": 40.0, "lng": 94.8, "z": 5, "label": "金刚经雕版·敦煌", "info": "敦煌出土咸通九年(868年)雕版印刷金刚经,世界现存最早有纪年的印刷品。佛教经典的传播方式从此革命性变化。", "src": "大英图书馆藏敦煌文献"}, {"y": 907, "lat": 34.3, "lng": 108.9, "z": 5, "label": "唐亡·五代十国", "info": "唐朝灭亡,进入五代十国分裂时期。北方战乱频繁,佛教学术重心南移。吴越钱氏、南唐李氏保护佛教。", "src": "中国通史"}, {"y": 973, "lat": 37.6, "lng": 127, "z": 5, "label": "均如·统一高丽华严", "info": "高丽学僧均如统一华严南北二宗。著三宝章圆通钞。早于义天,为高丽华严前驱。"}, {"y": 1011, "lat": 30.2, "lng": 120.1, "z": 6, "label": "净源中兴·杭州慧因寺", "info": "宋代华严复兴。慧因寺世称华严第一道场。后义天入宋求法于此。"}, {"y": 1038, "lat": 30.2, "lng": 120.1, "z": 6, "label": "子璿·兼弘贤首天台", "info": "长水子璿著起信论疏笔削记。兼弘贤首与天台,体现宋代宗派融合趋势。"}, {"y": 1050, "lat": 34.0, "lng": 113.0, "z": 5, "rel": "confucian", "label": "📖宋明理学兴起", "info": "周敦颐(1017-1073)创太极图说,张载(1020-1077)立气论,二程(1032-1085)发明天理。理学吸收佛教心性论与华严理事无碍思维,开儒学新纪元。", "src": "《宋史·道学传》"}, {"y": 1085, "lat": 30.2, "lng": 120.1, "z": 6, "label": "义天入宋·杭州慧因寺", "info": "高丽王子义天从净源受华严。归国编义天录。华严经杭州传入朝鲜半岛。"}, {"y": 1101, "lat": 37.6, "lng": 127, "z": 5, "label": "义天圆寂·高丽开京", "info": "义天圆寂。此后高丽学僧继续弘扬,朝鲜半岛成东亚华严重镇。"}, {"y": 1173, "lat": 35, "lng": 135.8, "z": 5, "label": "明惠中兴·日本高山寺", "info": "明惠复兴日本华严。高山寺开山,兼弘戒律真言。东亚华严网络最终一环形成。"}, {"y": 1271, "lat": 39.9, "lng": 116.4, "z": 5, "label": "元朝·八思巴帝师", "info": "元朝建立,藏传佛教入汉。八思巴为国师。海云继梦认为此后禅宗正法心法失传七~八百年。"}, {"y": 1200, "lat": 28.0, "lng": 118.0, "z": 5, "rel": "confucian", "label": "📖朱熹·理学集大成", "info": "朱熹(1130-1200)集北宋理学大成,确立程朱理学体系。其格物穷理与华严事事无碍有可比较的认识论结构。朱子学后传入朝鲜日本,影响东亚思想史。", "src": "《宋元学案》"}, {"y": 1368, "lat": 32.0, "lng": 118.8, "z": 5, "label": "明朝建立·洪武", "info": "朱元璋建都南京,早年曾出家为僧。明初设立僧官制度,整顿佛教,天下寺院分禅讲教三类管理。", "src": "《明史》"}, {"y": 1409, "lat": 29.6, "lng": 91.1, "z": 5, "label": "宗喀巴·格鲁派创立", "info": "宗喀巴大师在拉萨创大昭寺传召法会,格鲁派(黄教)正式确立。藏传佛教进入新的发展阶段。", "src": "藏传佛教史"}, {"y": 1508, "lat": 26.5, "lng": 106.7, "z": 5, "rel": "confucian", "label": "📖王阳明·龙场悟道", "info": "王守仁(1472-1529)在贵州龙场悟道,提出知行合一。阳明心学与禅宗明心见性有深度亲缘性,其「致良知」近于佛教本觉思想。后传入日本,影响明治维新。", "src": "《明儒学案》"}, {"y": 1517, "lat": 51.0, "lng": 11.0, "z": 4, "rel": "western", "label": "✝马丁·路德·宗教改革", "info": "马丁·路德在维滕堡贴出九十五条论纲,欧洲宗教改革开始。此后基督教世界分裂,西方进入宗教多元化时代。", "bg": true, "src": "世界史"}, {"y": 1687, "lat": 52.0, "lng": -0.1, "z": 4, "rel": "western", "label": "🔬牛顿·自然哲学原理", "info": "牛顿发表《自然哲学的数学原理》,科学革命达到高峰。此后科学与宗教的关系成为西方思想核心议题,与佛教对宇宙的解释形成遥远对照。", "bg": true, "src": "科学史"}, {"y": 1578, "lat": 38.0, "lng": 110.0, "z": 5, "label": "俺答汗·达赖喇嘛封号", "info": "蒙古俺答汗迎请三世达赖索南嘉措,赠予达赖喇嘛称号。藏传佛教与蒙古政治力量结合。", "src": "蒙藏佛教史"}, {"y": 1600, "lat": 30.2, "lng": 120.1, "z": 5, "label": "明末四大师·佛教复兴", "info": "紫柏/憨山/莲池/澫益四大师推动晚明佛教全面复兴。华严学亦受此波影响。"}, {"y": 1644, "lat": 39.9, "lng": 116.4, "z": 5, "label": "清军入关·明亡", "info": "清朝建立。顺治帝笃信佛教,礼敬禅僧。清初佛教在战乱后逐步恢复。", "src": "《清史稿》"}, {"y": 1641, "lat": 30.2, "lng": 120.1, "z": 6, "label": "续法·清代华严集大成", "info": "著贤首五教仪整理判教,编华严宗佛祖传梳理谱系。讲经二十余遍。"}, {"y": 1720, "lat": 30.0, "lng": 91.0, "z": 5, "label": "康熙平定西藏", "info": "清军入藏,确立对西藏的管辖。藏传佛教格鲁派与清廷关系制度化。", "src": "《清圣祖实录》"}, {"y": 1793, "lat": 29.6, "lng": 91.1, "z": 5, "label": "乾隆·钦定藏内善后章程", "info": "确立金瓶掣签制度。藏传佛教活佛转世纳入国家管理。", "src": "《卫藏通志》"}, {"y": 1860, "lat": 32.0, "lng": 118.8, "z": 5, "label": "太平天国·佛教重创", "info": "太平军占据江南,大量寺院被毁,经书遭焚。江南佛教遭受空前打击。", "src": "中国近代佛教史"}, {"y": 1898, "lat": 39.9, "lng": 116.4, "z": 5, "label": "戊戌变法·庙产兴学", "info": "张之洞提出庙产兴学主张,将寺院财产充作教育经费。此政策持续影响近代佛教至民国。", "src": "《劝学篇》"}, {"y": 1880, "lat": 34.0, "lng": 109.0, "z": 5, "rel": "daoist", "label": "☯陈撄宁·现代道教复兴", "info": "陈撄宁(1880-1969),近代道教重要学者。创办《仙学》月刊,提倡仙学独立于儒释,推动道教的现代化转型。", "bg": true, "src": "中国道教史"}, {"y": 1912, "lat": 34.5, "lng": 110.0, "z": 5, "rel": "daoist", "label": "☯张志顺·全真高道", "info": "张志顺(1912-2015),全真龙门派第二十一代传人。以百岁高龄仍坚持修行传道,被认为是近代道家实修的典范人物。", "bg": true, "src": "道教人物志"}, {"y": 1914, "lat": 31.7, "lng": 120.7, "z": 7, "label": "华严大学·常熟兴福寺", "info": "月霞创立近代第一所华严专宗教育机构。培养常惺/持松等现代学僧。"}, {"y": 1936, "lat": 34.3, "lng": 108.9, "z": 5, "rel": "daoist", "label": "☯任法融·中国道协会长", "info": "任法融(1936-2021),原中国道教协会会长。著《道德经释义》等,以现代语言诠释道家经典。推动道教与当代社会对话。", "bg": true, "src": "中国道教协会"}, {"y": 1952, "lat": 25, "lng": 121.6, "z": 7, "label": "华严莲社·台北", "info": "智光/南亭创社,开启台湾华严弘传。成一/贤度相继,发展为现代学术教育中心。"}, {"y": 1975, "lat": 25, "lng": 121.5, "z": 7, "label": "华严专宗学院·台北", "info": "成一法师创办,以专修/专研/专弘华严为宗旨。当代最重要华严教育机构。"}, {"y": 1991, "lat": 25, "lng": 121.5, "z": 7, "label": "梦参剃度·临济47代", "info": "海云继梦(陈鹤山)于梦参老和尚座下剃度,法名昌一号继梦。此前十年以在家身弘法,奠定现代语言诠释华严的教学风格。"}, {"y": 2004, "lat": 34.2, "lng": 108.9, "z": 6, "label": "西安弘法·社科院演讲", "info": "受聘陕师大华严研究所荣誉所长。社科院演讲(首位登台出家人)。2006-2010北京广化寺系统弘讲四十华严全本。"}, {"y": 2008, "lat": 23.9, "lng": 120.9, "z": 9, "label": "三脉汇流·普贤乘确立", "info": "★核心★钦因传华严衣钵(贤首42世)+胜师子王菩萨传瑜伽行。三脉归一开创普贤乘华严宗。技术面(数随止)+工程面(ABC心法)双轨。四阶段:出离→菩提→菩萨→普贤乘。"}, {"y": 2011, "lat": 25, "lng": 121.5, "z": 7, "label": "华严六科·五大行法定型", "info": "六科(概论/经教/禅法/戒律/净土/密法)+五大行法(禅净律密经教)完整出版。三部曲(非常坛经/金刚经/心经)确立修行框架。"}, {"y": 2013, "lat": 25, "lng": 121.5, "z": 7, "label": "海云华严研究所成立", "info": "熊琬教授任所长。华严学报创刊(已出14期)。忍可灌顶制度+禅观一览表公开发
