var GRAPH = {"nodes": [{"id": "person_000a", "n": "龙树", "dy": "古印度", "ti": "华严宗远祖（八宗共祖）", "li": "华严宗远祖", "multi": [], "tp": "patriarch", "b": null, "d": null, "bio": "大乘中观学派创始人。据传入龙宫取回《华严经》下本十万偈流传人间。造《十住毗婆沙论》（《十地品》注释，又称《大不思议论》），被华严宗奉为法统源头。", "wk": ["十住毗婆沙论", "中论"], "wl": {}, "v": 0}, {"id": "person_000b", "n": "世亲", "dy": "古印度", "ti": "唯识宗祖师", "li": null, "multi": [], "tp": "scholar", "b": null, "d": null, "bio": "古印度唯识学派大师。造《十地经论》十二卷，系统注释《华严经·十地品》，其「六相」等名相创新深刻影响华严宗教学。汉译催生了南北朝地论师学派。", "wk": ["十地经论", "唯识三十颂"], "wl": {}, "v": 1}, {"id": "person_006", "n": "佛驮跋陀罗", "dy": "东晋", "ti": "六十华严译者", "li": null, "multi": [], "tp": "translator", "b": 359, "d": 429, "bio": "北天竺迦毗罗卫国人。来华译经大师，于建康道场寺译出《六十华严》（旧华严），共七处八会三十四品。还译《大般泥洹经》等。", "wk": ["大方广佛华严经（六十华严，T09n0278）"], "wl": {}, "v": 1}, {"id": "person_007", "n": "实叉难陀", "dy": "唐", "ti": "八十华严译者", "li": null, "multi": [], "tp": "translator", "b": 652, "d": 710, "bio": "于阗国（今新疆和田）人。奉武则天命来华，主译八十卷《华严经》（T10n0279），法藏曾参与其译场证义。还译《大乘入楞伽经》《大方广普贤所说经》（T0847）等。", "wk": ["大方广佛华严经（八十华严，T10n0279）", "大方广普贤所说经（T0847）"], "wl": {}, "v": 1}, {"id": "person_008", "n": "般若", "dy": "唐", "ti": "四十华严译者", "li": null, "multi": [], "tp": "translator", "b": null, "d": null, "bio": "罽宾国（今克什米尔）人。唐贞元年间来华，译出《四十华严》（T10n0293），即全本《入法界品》。文末《普贤菩萨行愿赞》为藏汉佛教共同尊奉。", "wk": ["大方广佛华严经（四十华严，T10n0293）"], "wl": {}, "v": 1}, {"id": "person_007b", "n": "支娄迦谶", "dy": "后汉", "ti": "最早汉译华严经文者", "li": null, "multi": [], "tp": "translator", "b": null, "d": null, "bio": "月氏国人。后汉桓帝时来华。译出《佛说兜沙经》（T10n0280），为《华严经》中最早被翻译过来的单行经（对应《如来名号品》）。", "wk": ["佛说兜沙经（T10n0280）"], "wl": {}, "v": 1}, {"id": "person_001", "n": "杜顺", "dy": "唐", "ti": "华严初祖", "li": "华严五祖", "multi": [], "tp": "patriarch", "b": 557, "d": 640, "bio": "华严宗初祖。雍州万年人。年十八出家于因圣寺。以《华严法界观门》开创华严宗观法体系。唐太宗赐号'帝心'。", "wk": ["华严法界观门", "华严五教止观"], "wl": {"华严法界观门": "https://cbeta.buddhism.org.hk/xml/T45/T45n1884_001.xml", "华严五教止观": "https://cbeta.buddhism.org.hk/xml/T45/T45n1867_001.xml"}, "v": 1}, {"id": "person_002", "n": "智俨", "dy": "唐", "ti": "华严二祖", "li": "华严五祖", "multi": [], "tp": "patriarch", "b": 602, "d": 668, "bio": "华严宗二祖。天水人。从杜顺出家，后于至相寺从慧光学华严。著《华严经搜玄记》开华严宗经疏之先河，为法藏之师。", "wk": ["华严经搜玄记", "华严一乘十玄门", "华严五十要问答"], "wl": {"华严经搜玄记": "https://cbeta.buddhism.org.hk/xml/T35/T35n1732_001.xml", "华严一乘十玄门": "https://cbeta.buddhism.org.hk/xml/T45/T45n1868_001.xml", "华严五十要问答": "https://cbeta.buddhism.org.hk/xml/T45/T45n1869_001.xml"}, "v": 1}, {"id": "person_003", "n": "法藏", "dy": "唐", "ti": "华严三祖·实际创立者", "li": "华严五祖", "multi": ["译师"], "tp": "patriarch", "b": 643, "d": 712, "bio": "华严宗实际创立者。祖籍康居，生于长安。从智俨学《华严》。参与实叉难陀译场。武则天赐号'贤首'。系统化'五教十宗'判教与'法界观门'观法。讲说《华严经》三十余遍。", "wk": ["华严一乘教义分齐章（五教章）", "华严经探玄记", "华严经义海百门", "华严金师子章", "大乘起信论义记", "十二门论宗致义记"], "wl": {"华严一乘教义分齐章（五教章）": "https://cbeta.buddhism.org.hk/xml/T45/T45n1866_001.xml", "华严经探玄记": "https://cbeta.buddhism.org.hk/xml/T35/T35n1733_001.xml", "华严经义海百门": "https://cbeta.buddhism.org.hk/xml/T45/T45n1875_001.xml", "华严金师子章": "https://cbeta.buddhism.org.hk/xml/T45/T45n1880_001.xml", "大乘起信论义记": "https://cbeta.buddhism.org.hk/xml/T44/T44n1846_001.xml", "十二门论宗致义记": "https://cbeta.buddhism.org.hk/xml/T42/T42n1826_001.xml"}, "v": 1}, {"id": "person_004", "n": "澄观", "dy": "唐", "ti": "华严四祖·集大成者", "li": "华严五祖", "multi": [], "tp": "patriarch", "b": 738, "d": 839, "bio": "华严宗四祖。越州山阴人。历学律、禅、三论、天台、华严诸宗。著《华严经疏》六十卷、《演义钞》九十卷，为华严教学集大成者。历七帝之师。德宗赐号'清凉'。", "wk": ["华严经疏（华严大疏）", "华严经随疏演义钞", "华严法界玄镜", "三圣圆融观门"], "wl": {"华严经疏（华严大疏）": "https://cbeta.buddhism.org.hk/xml/T35/T35n1735_001.xml", "华严经随疏演义钞": "https://cbeta.buddhism.org.hk/xml/T36/T36n1736_001.xml", "华严法界玄镜": "https://cbeta.buddhism.org.hk/xml/T45/T45n1883_001.xml", "三圣圆融观门": "https://cbeta.buddhism.org.hk/xml/T45/T45n1882_001.xml"}, "v": 1}, {"id": "person_005", "n": "宗密", "dy": "唐", "ti": "华严五祖·禅教融合者", "li": "华严五祖", "multi": [], "tp": "patriarch", "b": 780, "d": 841, "bio": "华严宗五祖。果州西充人。初习儒学，后从遂州道圆禅师出家（禅宗荷泽系）。后遇澄观受学华严。融合禅教，著《禅源诸诠集都序》《华严原人论》。", "wk": ["注华严法界观门", "禅源诸诠集都序", "圆觉经大疏释义钞", "华严原人论", "华严经行愿品疏钞"], "wl": {"注华严法界观门": "https://cbeta.buddhism.org.hk/xml/T45/T45n1884_001.xml", "禅源诸诠集都序": "https://cbeta.buddhism.org.hk/xml/T48/T48n2015_001.xml", "圆觉经大疏释义钞": "https://cbeta.buddhism.org.hk/xml/X09/X09n0245_001.xml", "华严原人论": "https://cbeta.buddhism.org.hk/xml/T45/T45n1886_001.xml", "华严经行愿品疏钞": "https://cbeta.buddhism.org.hk/xml/X05/X05n0229_001.xml"}, "v": 1}, {"id": "person_009", "n": "李通玄", "dy": "唐", "ti": "华严居士学者", "li": "李通玄系", "multi": [], "tp": "scholar", "b": 635, "d": 730, "bio": "唐代华严学重要在家学者。深通儒释，专精《华严》，于方山著《新华严经论》四十卷。以《易经》融会华严，方法独树一帜。", "wk": ["新华严经论", "华严经决疑论"], "wl": {"新华严经论": "https://cbeta.buddhism.org.hk/xml/T36/T36n1739_001.xml", "华严经决疑论": "https://cbeta.buddhism.org.hk/xml/T36/T36n1741_001.xml"}, "v": 1}, {"id": "person_011", "n": "净源", "dy": "宋", "ti": "宋代华严中兴之祖", "li": "华严五祖", "multi": [], "tp": "patriarch", "b": 1011, "d": 1088, "bio": "宋代华严宗重要复兴者。住杭州慧因寺。传法于高丽义天，义天归国后送金书《华严经》三种译本供养慧因寺。慧因寺世称'华严第一道场'。", "wk": ["华严经疏注", "华严妄尽还源观疏"], "wl": {}, "v": 1}, {"id": "person_010", "n": "义天", "dy": "宋", "ti": "高丽华严初祖", "li": "高丽华严", "multi": [], "tp": "scholar", "b": 1055, "d": 1101, "bio": "高丽文宗第四子。入宋求法于杭州慧因寺，从净源法师受华严教法。回国后编《新编诸宗教藏总录》（义天录），为华严文献学的奠基性著作。", "wk": ["新编诸宗教藏总录（义天录）", "圆宗文类"], "wl": {}, "v": 1}, {"id": "person_021", "n": "高原明昱", "dy": "明", "ti": "华严宗第二十五世", "li": "华严五祖", "multi": [], "tp": "patriarch", "b": null, "d": null, "bio": "明代华严宗祖师，华严宗第二十五世传人。自他起华严法脉兼传慈恩宗（唯识/法相宗），开创'贤首兼慈恩'传承体系。钦因长老等现代传人皆属此高原法系。", "wk": [], "wl": {}, "v": 0}, {"id": "person_012", "n": "月霞", "dy": "清", "ti": "近现代华严复兴先驱", "li": "月霞系", "multi": [], "tp": "patriarch", "b": 1858, "d": 1917, "bio": "清末民初华严宗复兴的关键人物。于常熟兴福寺创立华严大学（1914年），为中国近代第一所华严专宗教育机构，培养了一批现代华严学僧。", "wk": [], "wl": {}, "v": 0}, {"id": "person_031", "n": "应慈", "dy": "近现代", "ti": "近代华严座主", "li": "月霞系", "multi": [], "tp": "patriarch", "b": 1873, "d": 1965, "bio": "月霞长老师弟。继承月霞遗志，长期在上海等地弘传华严，被尊为'华严座主'。真禅法师之师。平生讲《华严经》多遍。", "wk": [], "wl": {}, "v": 0}, {"id": "person_013", "n": "常惺", "dy": "近现代", "ti": "", "li": "月霞系", "multi": [], "tp": "patriarch", "b": 1896, "d": 1939, "bio": "月霞长老弟子。继月霞之后主持华严大学，于北京、上海等地弘传华严。曾任闽南佛学院院长。", "wk": [], "wl": {}, "v": 0}, {"id": "person_018", "n": "智光", "dy": "近现代", "ti": "华严莲社首任住持", "li": "智光系", "multi": [], "tp": "patriarch", "b": 1889, "d": 1963, "bio": "近代华严学者。台北华严莲社第一任住持（1952年创社），开启台湾华严宗弘传事业。", "wk": [], "wl": {}, "v": 0}, {"id": "person_015", "n": "南亭", "dy": "近现代", "ti": "华严莲社第二任住持", "li": "华严莲社", "multi": [], "tp": "patriarch", "b": 1900, "d": 1982, "bio": "智光法师弟子。1952年与师智光共创台北华严莲社，任第二任住持。长期弘传华严教观，为台湾华严宗发展奠基人。", "wk": [], "wl": {}, "v": 0}, {"id": "person_016", "n": "成一", "dy": "当代", "ti": "华严莲社第三任住持·华严专宗学院创办人", "li": "华严莲社", "multi": [], "tp": "patriarch", "b": 1914, "d": 2011, "bio": "江苏泰县人。15岁出家。1949年赴台，协助师祖南亭和尚创办华严莲社，1972年继任住持。1975年创办华严专宗学院，以'专修、专研、专弘华严'为宗旨。1985年创立美国华严莲社。著有多部华严学著作。1988年后恢复泰州光孝寺等大陆祖庭。", "wk": ["成一和尚著作集"], "wl": {}, "v": 0}, {"id": "person_032", "n": "了中", "dy": "当代", "ti": "华严莲社第四任住持", "li": "华严莲社", "multi": [], "tp": "patriarch", "b": 1932, "d": 2022, "bio": "华严莲社第四任住持。延续'专研、专修、专弘'华严的莲社传统。", "wk": [], "wl": {}, "v": 0}, {"id": "person_033", "n": "净海", "dy": "当代", "ti": "华严莲社第五任住持", "li": "华严莲社", "multi": [], "tp": "patriarch", "b": null, "d": null, "bio": "华严莲社第五任住持。", "wk": [], "wl": {}, "v": 0}, {"id": "person_017", "n": "贤度", "dy": "当代", "ti": "华严莲社第六任住持·华严专宗学院院长", "li": "华严莲社", "multi": [], "tp": "patriarch", "b": 1960, "d": null, "bio": "当代华严宗女性法嗣传承者。成一法师弟子。2005年获印度德里大学哲学博士。推动华严现代化转型：发行《华严乐坛》专辑、AI多媒体文创演绎五十三参。著有《华严学讲义》《华严净土思想与念佛法门》等。", "wk": ["华严学讲义", "华严净土思想与念佛法门", "大海的印迹：贤度法师传"], "wl": {}, "v": 0}, {"id": "person_034", "n": "明度", "dy": "当代", "ti": "华严莲社第七任住持", "li": "华严莲社", "multi": [], "tp": "patriarch", "b": null, "d": null, "bio": "贤度法师之后，续掌华严莲社。贤首宗'明众生本际，悟诸佛果源'演字辈之一。", "wk": [], "wl": {}, "v": 0}, {"id": "person_041", "n": "钦因", "dy": "当代", "ti": "贤首宗第四十一世·高原法系第十七世", "li": "贤首宗高原法系", "multi": [], "tp": "patriarch", "b": 1928, "d": null, "bio": "北京人，俗名阎凤麟。贤首宗高原法系第41世。2008年9月21日于台北大华严寺举行传法大典，将法脉衣钵传予海云继梦(42世)。", "wk": [], "wl": {}, "v": 0}, {"id": "person_042", "n": "海云继梦", "dy": "当代", "ti": "三脉汇一的当代华严传承者·大华严寺导师", "li": "贤首宗高原法系", "multi": ["临济宗"], "tp": "patriarch", "b": 1950, "d": null, "bio": "俗名陈鹤山，台湾宜兰人。中兴大学经济系毕业。1991年于梦参长老座下出家（临济宗第四十七代，法名昌一，号继梦）。2008年受钦因长老传华严宗衣钵（贤首宗第四十二世）。同年得印度胜师子王菩萨传大乘瑜伽行法。汇三脉归一，开创'普贤乘华严宗'，复兴失传八百余年的'东山法门'。现为南投大华严寺导师。建立'无", "wk": [], "wl": {}, "v": 0}, {"id": "person_043", "n": "体佛", "dy": "当代", "ti": "贤首禅苑", "li": "贤首宗高原法系", "multi": [], "tp": "patriarch", "b": null, "d": null, "bio": "钦因长老法嗣之一。创立贤首禅苑，弘扬华严禅法。", "wk": [], "wl": {}, "v": 0}, {"id": "person_019", "n": "梦参", "dy": "当代", "ti": "当代华严弘扬巨擘", "li": "临济宗", "multi": [], "tp": "practitioner", "b": 1915, "d": 2017, "bio": "当代高僧，临济宗第四十六代。曾于五台山闭关修行多年。晚年大力弘扬《华严经》，讲说全本《八十华严》影响深远。1991年破例为海云继梦剃度（梦中得地藏菩萨示现），赐法名昌一。", "wk": ["华严经讲记（全本）"], "wl": {}, "v": 0}, {"id": "person_014", "n": "慈舟", "dy": "近现代", "ti": "", "li": "慈舟系", "multi": [], "tp": "scholar", "b": 1877, "d": 1958, "bio": "近代华严学者。长期于北京广济寺、济南等地讲说华严。著《华严经普贤行愿品亲闻记》，对《普贤行愿品》在现代的弘扬有重要推动。", "wk": ["华严经普贤行愿品亲闻记"], "wl": {}, "v": 0}, {"id": "person_044", "n": "真禅", "dy": "当代", "ti": "大陆当代华严禅实践者", "li": "月霞系", "multi": ["临济宗"], "tp": "patriarch", "b": 1916, "d": 1995, "bio": "当代大陆弘扬华严的代表性高僧。'禅宗临济、教在华严、行归地藏普贤'。师承应慈法师。1980年代后在玉佛寺多次主持华严佛七法会，宣讲《普贤行愿品》《十地品》。著有《玉佛丈室集》十集。", "wk": ["玉佛丈室集"], "wl": {}, "v": 0}, {"id": "person_045", "n": "如孝", "dy": "当代", "ti": "华严宗第四十一世法脉传人", "li": "华严宗", "multi": [], "tp": "scholar", "b": null, "d": null, "bio": "当代华严思想学者。师承星云长老、传印长老、法映长老。十余年研究华严思想当代实践。提出'别教一乘三类体系''法界十门体系''八纲体系'等。著有《生命的艺术》《修行的艺术》等丛书。2024年在《三秦宗教》刊发论文。", "wk": ["生命的艺术", "修行的艺术"], "wl": {}, "v": 0}, {"id": "person_046", "n": "雪窦", "dy": "当代", "ti": "美国华严莲社", "li": null, "multi": [], "tp": "scholar", "b": null, "d": null, "bio": "美国华严莲社相关人员，推动华严教法在海外英语世界的传播。", "wk": [], "wl": {}, "v": 0}, {"id": "person_020", "n": "胜友", "dy": "唐", "ti": "藏译华严经主译之一", "li": null, "multi": [], "tp": "translator", "b": null, "d": null, "bio": "印度译师。与智军（Ye shes sde）、遍照护（Vairocana）约9世纪初将《华严经》译为藏文（德格版Toh 44）。译自中亚于阗原本。", "wk": ["藏译华严经（Toh 44）"], "wl": {}, "v": 0}, {"id": "person_020b", "n": "智军", "dy": "唐", "ti": "藏译华严经主译之一", "li": null, "multi": [], "tp": "translator", "b": null, "d": null, "bio": "吐蕃著名译师。与印度胜友合作将《华严经》从于阗本译为藏文。为吐蕃王朝佛教翻译事业的核心人物。", "wk": ["藏译华严经（Toh 44）"], "wl": {}, "v": 1}, {"id": "person_050", "n": "审祥", "dy": "唐/日本", "ti": "日本华严宗初传", "li": "日本华严", "multi": [], "tp": "patriarch", "b": null, "d": 742, "bio": "新罗僧。来华从法藏学华严。后赴日本，于东大寺宣讲《华严经》，为日本华严宗之初传。", "wk": [], "wl": {}, "v": 0}, {"id": "person_110", "n": "法显", "dy": "东晋", "ti": "西行求法先驱", "li": "求法僧", "multi": [], "tp": "practitioner", "b": 337, "d": 422, "bio": "东晋高僧。399年以65岁高龄从长安出发,经河西走廊、西域、中亚至印度,历时14年游历30余国。412年海路归国。著《佛国记》记录印度佛教圣迹,为中国首位完成印度求法之旅的僧人。", "wk": ["佛国记(高僧法显传)"], "wl": {}, "v": 1}, {"id": "person_111", "n": "玄奘", "dy": "唐", "ti": "大翻译家·法相宗创始人", "li": "求法僧", "multi": [], "tp": "translator", "b": 602, "d": 664, "bio": "唐代高僧。629年从长安西行,经西域中亚至印度那烂陀寺,师从戒贤。645年归国携657部梵本,主持译场译经75部1335卷。著《大唐西域记》,创中国法相唯识宗。", "wk": ["大唐西域记", "大般若经", "成唯识论"], "wl": {}, "v": 1}, {"id": "person_112", "n": "义净", "dy": "唐", "ti": "海上求法僧·译经家", "li": "求法僧", "multi": [], "tp": "translator", "b": 635, "d": 713, "bio": "唐代高僧。671年从广州乘波斯船经海路至印度,游历那烂陀寺等30余国。695年归国携梵本400余部,译经56部230卷,偏重律藏。著《南海寄归内法传》《大唐西域求法高僧传》。与法显、玄奘并称三大求法僧。", "wk": ["南海寄归内法传", "大唐西域求法高僧传"], "wl": {}, "v": 1}, {"id": "person_113", "n": "真谛", "dy": "梁/陈", "ti": "四大译经师之一", "li": "译师", "multi": [], "tp": "translator", "b": 499, "d": 569, "bio": "西印度优禅尼国人。梁大同十二年(546)来华,值梁末战乱辗转各地译经。译《摄大乘论》《俱舍论》等64部278卷,系统传译瑜伽行派唯识学。与鸠摩罗什、玄奘、义净并称四大译经师。", "wk": ["摄大乘论", "俱舍论", "大乘起信论(重译)"], "wl": {}, "v": 1}, {"id": "person_114", "n": "求那跋陀罗", "dy": "刘宋", "ti": "楞伽经主译", "li": "译师", "multi": [], "tp": "translator", "b": 394, "d": 468, "bio": "中印度人。刘宋元嘉十二年(435)经海路至广州,后至建康译经。译《楞伽经》《胜鬘经》《杂阿含经》等52部134卷。其楞伽译本后为禅宗初祖达摩授与二祖慧可,影响禅宗思想深远,亦与华严如来藏思想有深层义学会通。", "wk": ["楞伽阿跋多罗宝经", "胜鬘经", "杂阿含经"], "wl": {}, "v": 1}, {"id": "person_115", "n": "不空", "dy": "唐", "ti": "密宗开元三大士之一", "li": "译师", "multi": [], "tp": "translator", "b": 705, "d": 774, "bio": "师子国(斯里兰卡)人,一说北印度人。幼来华师事金刚智。741年赴师子国和印度求法,746年归国携梵本500余部。译《金刚顶经》等密教经典,与善无畏、金刚智并称开元三大士。华严宗密法(秽迹金刚)与此传承有历史关联。", "wk": ["金刚顶经", "大乘密严经"], "wl": {}, "v": 1}, {"id": "person_116", "n": "竺法护", "dy": "西晋", "ti": "敦煌菩萨·大译经家", "li": "译师", "multi": [], "tp": "translator", "b": 239, "d": 316, "bio": "月氏侨民,世居敦煌。随师游历西域诸国,通晓36国语言。译经149部,包括华严经中《渐备一切智德经》(十地品异译)、《等目菩萨三昧经》(十定品异译)、《如来兴显经》(如来出现品异译)等多部华严单行经。被尊为'敦煌菩萨'。", "wk": ["渐备一切智德经", "如来兴显经", "正法华经"], "wl": {}, "v": 1}, {"id": "person_117", "n": "慧超", "dy": "唐/新罗", "ti": "新罗求法僧", "li": "求法僧", "multi": [], "tp": "practitioner", "b": 704, "d": 787, "bio": "新罗僧。约723年从中国出发经海路至印度,游历五天竺佛教圣迹。727年归国后著《往五天竺国传》记录印度、中亚、西域见闻。该书敦煌残卷于1908年为伯希和发现,为研究8世纪中亚印度的珍贵一手文献。", "wk": ["往五天竺国传"], "wl": {}, "v": 1}, {"id": "person_120", "n": "善无畏", "dy": "唐", "ti": "开元三大士之首·密宗初传", "li": "译师", "multi": [], "tp": "translator", "b": 637, "d": 735, "bio": "中印度人,甘露王后裔。716年至长安,玄宗礼为国师。译《大日经》七卷,传胎藏界密法。与金刚智、不空并称开元三大士,为中国密宗奠基人。弟子一行协助译经并著《大日经疏》。", "wk": ["大日经(大毗卢遮那成佛神变加持经)", "苏婆呼童子请问经"], "wl": {}, "v": 1}, {"id": "person_121", "n": "金刚智", "dy": "唐", "ti": "开元三大士·金刚界密法", "li": "译师", "multi": [], "tp": "translator", "b": 671, "d": 741, "bio": "南印度摩赖耶国人。719年经海路至广州,次年抵长安。译《金刚顶经》传金刚界密法。与善无畏、不空并称开元三大士。弟子不空继承其法脉,后传入日本成真言宗。", "wk": ["金刚顶瑜伽中略出念诵经", "七俱胝佛母准提大明陀罗尼经"], "wl": {}, "v": 1}, {"id": "person_122", "n": "一行", "dy": "唐", "ti": "天文学家·密宗学僧", "li": "译师", "multi": [], "tp": "scholar", "b": 683, "d": 727, "bio": "唐代高僧,俗名张遂。精通天文历算,制《大衍历》。师事善无畏,协助译《大日经》并著《大日经疏》二十卷,为密宗义学之奠基著作。一行亦曾参学禅宗北宗普寂。", "wk": ["大日经疏", "大衍历"], "wl": {}, "v": 1}, {"id": "person_123", "n": "慧果", "dy": "唐", "ti": "密宗第七祖·青龙寺", "li": "译师", "multi": [], "tp": "patriarch", "b": 746, "d": 805, "bio": "唐代密宗高僧。师事不空,兼承善无畏胎藏界与金刚智金刚界两部密法。住长安青龙寺,为密宗集大成者。日本空海入唐即从慧果受法,归国后创立日本真言宗。", "wk": [], "wl": {}, "v": 1}, {"id": "person_124", "n": "空海", "dy": "唐/日本", "ti": "日本真言宗开祖·弘法大师", "li": "日本华严", "multi": [], "tp": "patriarch", "b": 774, "d": 835, "bio": "日本真言宗开祖。804年入唐,于长安青龙寺从慧果受两部密法。806年归国后于高野山开创真言宗。著《十住心论》以华严判教框架判摄显密诸宗,体现密教与华严义学之深层对话。", "wk": ["十住心论", "即身成佛义", "秘密曼荼罗十住心论"], "wl": {}, "v": 1}, {"id": "person_125", "n": "六师外道", "dy": "古印度", "ti": "佛陀时代非佛教思想家", "li": "印度源流", "multi": [], "tp": "scholar", "b": null, "d": null, "bio": "与释迦牟尼同时代的六位印度思想家。据《沙门果经》记载:富兰那迦叶(道德否定论)、末伽梨拘舍罗(宿命论)、散若夷毗罗梨子(不可知论)、阿耆多翅舍钦婆罗(唯物论)、迦罗鸠驮迦旃延(原子论)、尼乾陀若提子(耆那教创始人)。佛教教义正是在与这些学派的对话与辩驳中确立的。", "wk": [], "wl": {}, "v": 1}, {"id": "person_126", "n": "成观法师", "dy": "当代", "ti": "华严宗42世·真言宗53世阿阇梨·大毘卢寺住持", "li": "贤首宗高原法系", "multi": [], "tp": "patriarch", "b": 1947, "d": null, "bio": "台北人,台师大英语系毕业(1972),美国德州TCU英研所深造。1988年于纽约庄严寺依天台宗45代显明老和尚出家,同年于基隆海会寺受三坛大戒。1996年于日本高野山入坛受金胎两部大法,得传法灌顶阿阇梨位,为真言宗53世。2010年4月24日于台北福慧寺依钦因长老受华严兼慈恩法脉,为高原法系贤首宗4", "wk": ["楞伽经义贯", "大佛顶首楞严经义贯", "大乘百法明门论今注", "唯识三十论颂义贯"], "wl": {}, "v": 1}, {"id": "person_f01", "n": "思元慧三", "dy": "近现代", "ti": "高原法系40世·福慧寺开山", "li": "贤首宗高原法系", "tp": "patriarch", "b": 1901, "d": 1986, "bio": "宛平人，俗姓霍。北京广善寺第11代住持。1948年赴台，创树林福慧寺。民国37年来台时已47岁，随身仅带一尊华严三圣像。为高原法系在台根本道场开创者。", "wk": []}, {"id": "person_f02", "n": "体化性果", "dy": "当代", "ti": "福慧寺第三代住持", "li": "贤首宗高原法系", "tp": "patriarch", "b": 1950, "d": null, "bio": "钦因长老法嗣。福慧寺第三代住持。继承贤首宗高原法系在台弘法事业。", "wk": []}, {"id": "person_j01", "n": "良弁", "dy": "唐/日本", "ti": "东大寺初代别当", "li": "日本华严", "tp": "patriarch", "b": 689, "d": 773, "bio": "审祥弟子。东大寺开山。主持《华严经》讲说。", "wk": []}, {"id": "person_j02", "n": "实忠", "dy": "日本", "ti": "东大寺二代", "li": "日本华严", "tp": "patriarch", "b": 726, "d": 800, "bio": "良弁弟子。继承东大寺华严教学。", "wk": []}, {"id": "person_j03", "n": "等定", "dy": "日本", "ti": "东大寺华严", "li": "日本华严", "tp": "patriarch", "b": 800, "d": 870, "bio": "日本华严宗传承者。", "wk": []}, {"id": "person_j04", "n": "圣宝", "dy": "日本", "ti": "醍醐寺开山", "li": "日本华严", "tp": "patriarch", "b": 832, "d": 909, "bio": "理源大师。兼传真言与华严。", "wk": []}, {"id": "person_j05", "n": "观贤", "dy": "日本", "ti": "东大寺别当", "li": "日本华严", "tp": "patriarch", "b": 853, "d": 925, "bio": "东大寺华严教学之中兴。", "wk": []}, {"id": "person_s01", "n": "魏道儒", "dy": "当代", "ti": "中国社科院学部委员", "li": "当代学者", "tp": "scholar", "b": 1955, "d": null, "bio": "中国社会科学院学部委员。著有《中国华严宗通史》。", "wk": ["中国华严宗通史"]}, {"id": "person_s02", "n": "王颂", "dy": "当代", "ti": "北京大学教授", "li": "当代学者", "tp": "scholar", "b": 1965, "d": null, "bio": "北京大学哲学系教授。华严思想与佛教史研究。", "wk": []}, {"id": "person_s03", "n": "邱高兴", "dy": "当代", "ti": "中国人民大学教授", "li": "当代学者", "tp": "scholar", "b": 1966, "d": null, "bio": "中国人民大学哲学院教授。华严宗与佛教中国化研究。", "wk": ["华严宗与佛教中国化"]}, {"id": "person_s04", "n": "张文良", "dy": "当代", "ti": "中国人民大学教授", "li": "当代学者", "tp": "scholar", "b": 1966, "d": null, "bio": "中国人民大学佛教与宗教学理论研究所教授。华严思想研究。", "wk": []}, {"id": "person_060", "n": "元晓", "dy": "唐/新罗", "ti": "新罗华严学僧", "li": "高丽华严", "tp": "scholar", "b": 617, "d": 686, "bio": "新罗学僧。与义湘同代，二人曾结伴入唐但中途折返。后自悟大乘起信论奥义。著华严经疏、起信论疏，与法藏、慧远并称东亚起信论三大疏。对朝鲜半岛华严思想影响深远。", "wk": ["华严经疏", "大乘起信论疏", "十门和诤论"]}, {"id": "person_070", "n": "慧苑", "dy": "唐", "ti": "法藏弟子·华严异解者", "li": "华严五祖", "tp": "scholar", "b": 673, "d": 743, "bio": "法藏上首弟子。著续华严经略疏刊定记，改五教为四教、以十门代十玄。澄观在华严经疏中系统批判其说。慧苑异解是推动澄观集大成的关键思想动力。", "wk": ["续华严经略疏刊定记", "华严旋澓章"]}, {"id": "person_080", "n": "续法", "dy": "清", "ti": "清代华严集大成者", "li": "华严五祖", "tp": "patriarch", "b": 1641, "d": 1728, "bio": "清代华严宗最重要弘传者。字柏亭，号灌顶，仁和人。著贤首五教仪系统整理法藏判教；编华严宗佛祖传梳理传承谱系。讲华严经二十余遍，为清代华严学集大成者。", "wk": ["贤首五教仪", "华严宗佛祖传", "法界宗莲花章"], "v": 1}, {"id": "person_061", "n": "义湘", "dy": "唐/新罗", "ti": "海东华严初祖", "li": "高丽华严", "tp": "patriarch", "b": 625, "d": 702, "bio": "新罗僧。与元晓结伴入唐求法，元晓中途折返，义湘独至长安从智俨学华严。归国后创浮石寺，被尊为海东华严初祖。", "wk": ["华严一乘法界图", "白花道场发愿文"], "v": 1}, {"id": "person_090", "n": "慧光", "dy": "北魏", "ti": "地论师南道派始祖", "li": "华严五祖", "tp": "scholar", "b": 468, "d": 537, "bio": "北魏地论师。从勒那摩提学十地经论，开创地论南道派。世称光统律师。其学说经数代传承至智俨、法藏，是为华严宗义学前身。", "wk": ["十地经论疏", "四分律疏"], "v": 1}, {"id": "person_091", "n": "子璿", "dy": "宋", "ti": "宋代华严学者", "li": "华严五祖", "tp": "scholar", "b": 965, "d": 1038, "bio": "宋代华严重要学者。长水子璿，秀州人。从洪敏学楞严，后谒慧觉禅师悟入。著起信论疏笔削记，兼弘贤首与天台。", "wk": ["起信论疏笔削记", "楞严经义疏注经"], "v": 0}, {"id": "person_062", "n": "均如", "dy": "高丽", "ti": "高丽华严学僧", "li": "高丽华严", "tp": "scholar", "b": 923, "d": 973, "bio": "高丽初期华严学僧。统一高丽华严南北二宗之分歧。著华严经三宝章圆通钞等。早于义天，为高丽华严之前驱。", "wk": ["华严经三宝章圆通钞", "十句章圆通记"], "v": 0}, {"id": "person_j06", "n": "明惠", "dy": "日本", "ti": "日本华严中兴之祖", "li": "日本华严", "tp": "patriarch", "b": 1173, "d": 1232, "bio": "日本镰仓时代华严宗中兴之祖。高山寺开山。复兴东大寺华严教学，兼弘戒律与真言。对日本华严宗有再造之功。", "wk": ["摧邪轮", "华严缘起"], "v": 0}, {"id": "person_j07", "n": "凝然", "dy": "日本", "ti": "东大寺学僧", "li": "日本华严", "tp": "scholar", "b": 1240, "d": 1321, "bio": "日本镰仓时代东大寺学僧。著八宗纲要系统介绍中国八宗要义；著华严法界义镜等。为日本华严教学之集大成者。", "wk": ["八宗纲要", "华严法界义镜", "华严经疏会本"], "v": 0}, {"id": "person_092", "n": "持松", "dy": "近现代", "ti": "月霞系法嗣·华严大学校长", "li": "月霞系", "tp": "patriarch", "b": 1894, "d": 1972, "bio": "月霞长老弟子。继常惺之后任华严大学校长。兼弘密法，为近代华严与密教兼通的代表人物。著有贤密教衡等。", "wk": ["贤密教衡", "华严宗教义始末记"], "v": 0}, {"id": "person_100", "n": "释迦牟尼", "dy": "古印度", "ti": "佛教创始人·华严经教说者", "li": "印度源流", "tp": "patriarch", "b": -563, "d": -483, "bio": "佛教创始人。据华严宗传统，华严经为释迦成道后最初三七日于菩提树下为法身大士所说。为一切法脉之根源。", "wk": [], "v": 1}, {"id": "person_101", "n": "马鸣", "dy": "古印度", "ti": "大乘论师·起信论造者", "li": "印度源流", "tp": "scholar", "b": 80, "d": 150, "bio": "古印度大乘佛教论师。传统著录为大乘起信论作者。该论一心二门三大四信五门之说，为华严宗判教与心性论提供了重要理论资源。", "wk": ["大乘起信论"], "v": 1}, {"id": "person_102", "n": "无著", "dy": "古印度", "ti": "瑜伽行派创始人", "li": "印度源流", "tp": "scholar", "b": 310, "d": 390, "bio": "古印度瑜伽行派(Yogācāra)创始人。世亲之兄。其唯识学说经世亲十地经论传入汉地，深刻影响地论学派及华严宗法界缘起思想的形成。", "wk": ["瑜伽师地论", "摄大乘论"], "v": 1}, {"id": "person_103", "n": "鸠摩罗什", "dy": "后秦", "ti": "四大译经师之首", "li": "译师", "tp": "translator", "b": 344, "d": 413, "bio": "龟兹人。后秦弘始三年(401)至长安，主持中国历史上规模最大的译场。译十住经(T0286,即十地品别译)、十住毗婆沙论、法华经等。其译经为华严学在中国的传播提供了关键文本基础。", "wk": ["十住经", "十住毗婆沙论", "中论", "法华经"], "v": 1}, {"id": "person_104", "n": "菩提流支", "dy": "北魏", "ti": "十地经论主译", "li": "译师", "tp": "translator", "b": null, "d": 527, "bio": "北印度人。北魏永平元年(508)至洛阳，与勒那摩提等译世亲十地经论十二卷。此论译出直接催生了南北朝地论学派，被视为华严宗义学之远源。", "wk": ["十地经论"], "v": 1}, {"id": "person_105", "n": "燃灯佛", "dy": "远古印度", "ti": "授记释迦成佛之过去佛", "li": "印度源流", "tp": "patriarch", "b": null, "d": null, "bio": "梵名Dīpaṃkara。过去无量劫前之佛。据华严经如来名号品及本生经典，燃灯佛曾为释迦牟尼前身授记: 汝于来世当得作佛号释迦牟尼。此为华严经中佛佛相续无尽法界缘起之始。", "wk": [], "v": 1}, {"id": "person_106", "n": "迦叶佛", "dy": "远古印度", "ti": "贤劫第三佛·释迦前身之师", "li": "印度源流", "tp": "patriarch", "b": null, "d": null, "bio": "梵名Kāśyapa。贤劫千佛之第三尊，释迦牟尼佛之前一佛。据华严经，释迦成道时十方诸佛各遣菩萨来集，其中包括过去诸佛之法身显现。华严宗以十方三世无尽诸佛构成法界缘起之佛佛相望网络。", "wk": [], "v": 1}, {"id": "person_107", "n": "毗卢遮那佛", "dy": "法身常住", "ti": "华严教主·法身本源", "li": "印度源流", "tp": "patriarch", "b": null, "d": null, "bio": "梵名Vairocana，华严经之根本教主。意译光明遍照、大日如来。华严经以毗卢遮那佛法身为宇宙本体，十方三世一切诸佛皆为其化现。华严宗法界缘起、一即一切等核心教义皆围绕毗卢遮那佛法身展开。非历史人物，为华严教义之法身源头。", "wk": [], "v": 1}, {"id": "person_130", "n": "拉克鲁希", "dy": "远古印度", "ti": "湿婆神第28代化身·Lord Lakulish", "li": "大乘瑜伽行法", "tp": "patriarch", "b": null, "d": null, "bio": "Lord Lakulish。相传为4500年前湿婆神第28代化身,为印度古典瑜伽行法之原始指导者。其传承历经千年,于现代示现指导巴布基大瑜伽士。", "wk": [], "v": 0}, {"id": "person_131", "n": "巴布基", "dy": "近现代", "ti": "大瑜伽士·Babuji", "li": "大乘瑜伽行法", "tp": "practitioner", "b": null, "d": null, "bio": "Babuji(巴布基大瑜伽士)。Lord Lakulish示现指导的大成就者,传承古典瑜伽行法。", "wk": [], "v": 0}, {"id": "person_132", "n": "普拉梵纳德", "dy": "近现代", "ti": "Swami Pranavanad", "li": "大乘瑜伽行法", "tp": "practitioner", "b": 1884, "d": 1959, "bio": "Swami Pranavanad。1913年普贤菩萨于印度再度示现,为其传法。开创现代大乘瑜伽行法传承。", "wk": [], "v": 0}, {"id": "person_133", "n": "克利普梵纳德", "dy": "近现代", "ti": "Swami Kripalavanand", "li": "大乘瑜伽行法", "tp": "practitioner", "b": 1913, "d": 1981, "bio": "Swami Kripalavanand。1932年从普拉梵纳德接法,继续弘扬大乘瑜伽行法。", "wk": [], "v": 0}, {"id": "person_134", "n": "胜师子王菩萨", "dy": "当代", "ti": "Swami Rajarshi Muni·印度国师", "li": "大乘瑜伽行法", "tp": "practitioner", "b": 1931, "d": 2023, "bio": "Swami Rajarshi Muni(惹查西牟尼)。1971年从克利普梵纳德接法。1993年Lakulish以灵性形象示现,遂创立LIFE Mission。被尊为印度国师,2019年获印度总理奖。2008年12月于阿弥塔巴市传大乘瑜伽行法灌顶予海云继梦。已圆寂(约2023年)。", "wk": [], "v": 0}, {"id": "person_140", "n": "罗摩克里希纳", "dy": "1836–1886", "ti": "Ramakrishna·近代印度灵性复兴之源", "li": "参考线", "tp": "practitioner", "b": 1836, "d": 1886, "bio": "R var GAP = {"vs": [{"n": "藏文德格版 (Toh 44)", "c": 45, "v": "4册", "t": "胜友、智军", "p": "9世纪初"}, {"n": "汉文八十华严 (T10n0279)", "c": 39, "v": "80卷", "t": "实叉难陀", "p": "699年"}, {"n": "汉文六十华严 (T09n0278)", "c": 34, "v": "60卷", "t": "佛驮跋陀罗", "p": "420年"}, {"n": "汉文四十华严 (T10n0293)", "c": 1, "v": "40卷", "t": "般若", "p": "798年"}], "sm": {"A": 2, "B": 3, "C": 3, "D": 1, "E": 32}, "cs": [{"bo": 7, "z80": 7, "ti": "如来名号品", "sa": "", "tp": "C", "sm": "藏文此品位于《如来华严品》之后，故品目序号从汉文第7品变为藏文第12品。内容基本对应但结构位置不同。"}, {"bo": 11, "z80": null, "ti": "如来华严品", "sa": "Tathāgatāvataṃsaka", "tp": "A", "sm": "藏文独有品目。汉文六十华严、八十华严、四十华严均无此品。"}, {"bo": 27, "z80": 26, "ti": "十地品", "sa": "", "tp": "B", "sm": "藏文十地品可能源自更完整的梵本，结构接近独立《十地经》(Daśabhūmika)。与汉文十地品在细节上有参差。"}, {"bo": 28, "z80": null, "ti": "普贤宣说品", "sa": "Samantabhadraparivarta", "tp": "A", "sm": "藏文独有品目。汉文六十华严、八十华严、四十华严均无此品。"}, {"bo": 33, "z80": 31, "ti": "寿量品", "sa": "", "tp": "B", "sm": "藏文可能有更详尽的诸佛寿量描述。"}, {"bo": 39, "z80": 37, "ti": "如来出现品", "sa": "", "tp": "C", "sm": "六十华严无此品（仅34品）。八十华严对应《如来出现品》，六十华严对应第33品《宝王如来性起品》，名称和结构均有不同。"}, {"bo": 40, "z80": 38, "ti": "离世间品", "sa": "", "tp": "B", "sm": "藏文此品有部分独特异译段落，与汉文同名品内容有实质性参差。"}, {"bo": 41, "z80": 39, "ti": "入法界品", "sa": "Gaṇḍavyūha", "tp": "C", "sm": "四十华严即此品全本。藏文《入法界品》为全本。六十华严缺此品（仅有34品）。汉文有多个别译本。"}], "wn": ["⚠ T0309 法藏判为非十住品亦非十地品"], "content": {"core_finding": "藏文《华严经》(Toh44)译自中亚于阗原本，而非印度梵本。汉文《八十华严》亦由于阗请来梵本，但两者所据底本已不同——九世纪时华严梵本已多系分化。藏文45品中有2品为汉文三译所完全缺失（如来华严品、普贤宣说品），另有3品有实质性内容参差。", "diff_summary": {"categories": {"A": {"icon": "🔴", "label": "藏文独有品目", "color": "#c46b5d", "description": "汉文三译完全缺失"}, "B": {"icon": "🟠", "label": "内容实质性参差", "color": "#c8893e", "description": "同名品内容有显著差异"}, "C": {"icon": "🟡", "label": "结构/开合不同", "color": "#a08020", "description": "品目序号名称开合不同"}, "D": {"icon": "🔵", "label": "品目级微小差异", "color": "#5e8b9e", "description": "个别段落不同"}, "E": {"icon": "🟢", "label": "汉藏基本对应", "color": "#7d9a6e", "description": "32品大致一致"}}}, "case_studies": [{"id": 1, "title": "案例一: Samantabhadra 译名差异", "content": "藏文「kun tu bzang po」→ 汉译多作「普贤」。但84000翻译注释指出，汉文个别处作「普贤尊」（pu xian zun, Lord Samantabhadra），而藏文保持统一译法。此差异反映汉译者对不同语境下的敬称处理。\n"}, {"id": 2, "title": "案例二: gata 多义歧出", "content": "同一梵文词 gata（「已去/已至」 vs 「现在/存在」），藏文和汉文译者在不同品中选择不同义项，导致同一段落产生「如来已去」和「如来现前」两种截然不同的理解。\n"}, {"id": 3, "title": "案例三: 底本系谱分化", "content": "德格版Tshalpa系与Themephangma系之间，同一品末偈颂有出入（后者缺末偈）。84000翻译以Tshalpa为底本，Themephangma异读入校注。此说明藏文大藏经内部亦存在版本分化。\n"}, {"id": 4, "title": "案例四: 「如孝子心」版本歧异", "content": "同一段落: 六十华严作「发孝子心，见善知识无厌足故」；八十华严增「承顺颜色故」；四十华严又增「承事供养」。藏文本将su-putra直译，未添加「孝」的汉文化概念。越晚译本解释性附加语越长。\n"}], "scholarly_perspectives": [{"author": "Imre Hamar", "affiliation": "Eötvös Loránd University, 匈牙利科学院博士", "content": "「华严经在印度和中亚并非一时一地之作，而是由多部原本独立的单行经（如《十地品》《入法界品》）于公元2-4世纪逐步汇集而成。藏汉译本的差异，本质上是不同编纂阶段和不同地域传统的反映。」—— 参见其博士论文 The Buddhāvatamsaka-sūtra and Its Chinese Interpretation (2014) 及 The Metaphor of the Painter (SOS 13·2, 2014).\n"}, {"author": "高明道", "affiliation": "台湾华严学者", "content": "「南极汉文《华严经》，由于译者抉择各异，撰述注释的古德就有不同空间可发挥。参考藏译本便可发现，诠释的领域又不一样。即使有印度语文本可供对照，个人的解读终究脱离不了诠释。」\n"}, {"author": "84000翻译团队 (Peter Alan Roberts 等)", "content": "「华严经的梵文原本在古代即存在至少两种以上版本。证据包括「观世音/观自在」拼写差异——法藏《探玄记》卷19明确记载了这种拼写分歧。」\n"}], "methodology_84000": {"intro": "84000项目（Peter Alan Roberts团队）在翻译Toh44时采用多底本对校方法，其翻译注释体系为汉藏对勘提供了重要参考框架：", "categories": ["① 梵-藏歧异: 藏译本与现存梵文写本的出入（藏译者是否据另本或误读）", "② 甘珠尔版本间异读: 德格/斯托克/永乐/理塘/康熙/那塘/拉萨/Choné 八种版本的异文记录", "③ 抄写错误: 藏文抄本中的明显笔误（如 rgyu 误作 sgyu ma「幻」）", "④ 注释书佐证: 据世亲《十地经论》及 Sūryasiddha 注释判定疑误字", "⑤ 汉译旁证: 当梵藏歧异无法判定时，以汉译本（实叉难陀/佛驮跋陀罗）作为第三参照系", "⑥ 数字出入: 如《十地品》梵本作「百千俱胝」，德格版甘珠尔改为极大数，而世亲注释支持梵本简数"]}, "structural_differences": "汉译「会」制度 vs 藏译连续品目\n\n汉文八十华严按七处九会（七个地点·九次法会）组织经文；六十华严为七处八会。此为汉地祖师（智俨/法藏/澄观）判释所立。\n\n藏文 Toh44 不采用「会」的分组体系——45品为连续编号，无中间层的法会分组。这一结构差异意味着：汉文读者透过「会」的框架理解华严经的教义递进，而藏文读者直接面对45品的内容序列。两种组织方式各代表不同的解经传统，不能简单互译。\n", "consensus_table": [{"topic": "藏译本底本是否为于阗本", "viewpoint": "BDRC目录标注为于阗译出。部分学者认为有印度梵本中介", "consensus": "85% consensus", "color": "#7d9a6e"}, {"topic": "Ch.11 如来华严品是否为独立经典后并入", "viewpoint": "结构分析支持独立说，但无直接文献证据", "consensus": "disputed", "color": "#c8893e"}, {"topic": "「观世音/观自在」拼写差异是否证明多版本", "viewpoint": "法藏《探玄记》卷19明确记载差异；质疑者认为仅是音译习惯", "consensus": "60% consensus", "color": "#a08020"}, {"topic": "藏文《离世间品》异译段落的来源", "viewpoint": "可能反映更古老的于阗传承；学界尚未系统对勘", "consensus": "unknown", "color": "#c46b5d"}], "priority_roadmap": [{"level": "P0", "color": "#c46b5d", "label": "最高优先", "content": "Ch.11 如来华严品 · Ch.28 普贤宣说品 — 汉文三译全缺，学术价值最高。\n获取路径: ① BDRC/BUDA API (buda.bdrc.io, 需注册) → Toh44 Unicode电子文本 ② 84000项目: 已发布入法界品(2021), Ch.11+Ch.28尚未发布 ③ 兜底: 学术论文中对藏文独有品目的研究摘要。目前P0阶段可先整理已知内容结构大纲。\n"}, {"level": "P1", "color": "#c8893e", "label": "高优先", "content": "Ch.27 十地品 · Ch.40 离世间品 — 有鸠摩罗什《十住经》、世亲《十地经论》、竺法护《度世品经》等别译可作对勘桥梁。\n"}, {"level": "P2", "color": "#a08020", "label": "中优先", "content": "Ch.33 寿量品 · Ch.39 如来出现品 — 有玄奘《显无边佛土功德经》和竺法护《如来兴显经》等别译可对照。\n"}], "version_evolution": [{"t": "龙宫原本", "s": "约2世纪", "l": "印度", "lang": "梵", "c": "#9e8b6e", "n": "上中下三本·下本十万偈", "w": 120}, {"t": "兜沙经", "s": "167", "l": "洛阳", "lang": "汉", "c": "#a09080", "n": "支娄迦谶·1卷", "w": 110}, {"t": "六十华严", "s": "420", "l": "建康", "lang": "汉", "c": "#b8863c", "n": "佛驮跋陀罗·60卷34品", "w": 130}, {"t": "八十华严", "s": "699", "l": "洛阳", "lang": "汉", "c": "#b8863c", "n": "实叉难陀·80卷39品", "w": 130}, {"t": "四十华严", "s": "798", "l": "长安", "lang": "汉", "c": "#b8863c", "n": "般若·40卷入法界品", "w": 130}, {"t": "藏译华严", "s": "~830", "l": "吐蕃", "lang": "藏", "c": "#c46b5d", "n": "胜友/智军·4册45品", "w": 130}, {"t": "尼泊尔写本", "s": "11-12c", "l": "加德满都", "lang": "梵", "c": "#9e8b6e", "n": "梵文残卷", "w": 100}, {"t": "西夏译本", "s": "11-13c", "l": "西夏", "lang": "西夏", "c": "#8b7a9e", "n": "据八十华严译", "w": 110}, {"t": "回鹘译本", "s": "13-14c", "l": "高昌", "lang": "回鹘", "c": "#8b7a9e", "n": "安藏译", "w": 90}, {"t": "满文译本", "s": "18c", "l": "北京", "lang": "满", "c": "#8b7a9e", "n": "四体合璧", "w": 100}, {"t": "Cleary英译", "s": "1984-87", "l": "美国", "lang": "英", "c": "#5e8b9e", "n": "据八十华严", "w": 110}, {"t": "Dharmamitra", "s": "2022", "l": "美国", "lang": "英", "c": "#5e8b9e", "n": "据八十华严·3册", "w": 120}, {"t": "84000英译", "s": "2021-", "l": "国际", "lang": "英", "c": "#c46b5d", "n": "据藏文Toh44", "w": 110}], "references": ["Imre Hamar. The Buddhāvatamsaka-sūtra and Its Chinese Interpretation. 匈牙利科学院博士论文, 2014.", "Imre Hamar. The Metaphor of the Painter in the Avatamsaka-sutra and Its Chinese Interpretations. SOS 13·2, 2014.", "Peter Alan Roberts (tr.). The Stem Array (Gaṇḍavyūha, Toh 44-45). 84000 Project, 2021.", "高明道. 《谈谈翻译与诠释——以《华严》数偈为例》. 《法光》第236期, 2009.", "孙飞鹏. 《〈华严经〉卷十一夏汉文本对勘研究》. 《西夏学》第十辑(2013年第2期), 页75-80.", "吴国圣. 华严经典中的「牛头」——以梵、于阗、汉、藏、满文佛经译本为主的讨论. 2015.", "铃木大拙 (D.T. Suzuki). 三本《华严经》的异同及其要义. 《禅论集之三·菩萨行处》.", "邓葶愉. 再雕高丽藏之周本《华严经》版本源流考. 华严专宗学院, 2020.", "庄垣内正弘、百济康义等. 回鹘文《华严经》与汉文底本对应研究."], "data_sources": ["Asian Legacy Library (ALL) — Kangyur ZIP (122MB) · 藏文 Wylie 转写全45品", "84000 Project — Toh44-31/Toh44-45 英译 PDF + 校勘注", "BDRC/BUDA — Work ID WA0RK0044 · 德格版6函扫描件 (library.bdrc.io)", "ACIP — Release KD0044 · 藏文纯文本 (asianclassics.org → Asian Legacy Library)", "CBETA — 汉文大藏经全文 (cbetaonline.dila.edu.tw)"], "links": [{"text": "84000 The Ten Bhūmis (Toh44-31)", "url": "https://84000.co/translation/toh44-31"}, {"text": "The Stem Array (Toh44-45)", "url": "https://read.84000.co/translation/toh44-45.html"}, {"text": "84000 Scholar's Room", "url": "https://scholar.84000.co/article/a-multitude-of-buddhas-kangyur-section"}, {"text": "CBETA 八十华严 T10n0279", "url": "https://cbetaonline.dila.edu.tw/zh/T10n0279"}, {"text": "CBETA 六十华严 T09n0278", "url": "https://cbetaonline.dila.edu.tw/zh/T09n0278"}]}};

3c", "p": "续法", "tp": "义学"}, {"y": 1914, "l": "华严大学创立(常熟)", "c": "#5e8b9e", "p": "月霞", "tp": "教育"}, {"y": 1952, "l": "华严莲社创社(台北)", "c": "#5e8b9e", "p": "南亭", "tp": "文化"}, {"y": 1975, "l": "华严专宗学院成立(台北)", "c": "#5e8b9e", "p": "成一", "tp": "教育"}, {"y": 2008, "l": "钦因传衣钵·三脉汇流", "c": "#c46b5d", "p": "海云继梦", "tp": "传承"}, {"y": 2021, "l": "84000英译入法界品出版", "c": "#5e8b9e", "tp": "翻译"}, {"y": 2026, "l": "九九华严·支提山动土·AI时代", "c": "#6d9a6e", "tp": "当代"}]}, "anim_waypoints": {"waypoints": [{"y": -1500, "lat": 29, "lng": 76, "z": 3, "label": "吠陀文明·梨俱吠陀", "info": "雅利安人入印,吠陀宗教体系形成。轮回、业力、禅定概念萌芽。"}, {"y": -800, "lat": 26.5, "lng": 82, "z": 3, "label": "奥义书哲人·梵我哲学", "info": "梵(Brahman)与阿特曼(ātman)概念提出。佛教「无我」说在此对话中形成。"}, {"y": -600, "lat": 34.0, "lng": 114.0, "z": 5, "rel": "daoist", "label": "☯老子·《道德经》", "info": "老子(约前6世纪),道家学派创始人。据《史记》为周守藏室之史,居洛邑。后见周衰,西出函谷关,应关令尹喜之请著《道德经》五千言而去。", "src": "《史记·老子韩非列传》"}, {"y": -570, "lat": 34.6, "lng": 112.4, "z": 5, "rel": "daoist", "label": "☯老子·周守藏室之史", "info": "老子居洛邑任周王室守藏室之史(国家图书馆馆长)。在此期间博览典籍,形成其道法自然的哲学体系。", "src": "《史记·老子韩非列传》"}, {"y": -551, "lat": 35.6, "lng": 116.9, "z": 5, "rel": "confucian", "label": "📖孔子诞生·鲁国陬邑", "info": "孔子(前551-前479)生于鲁国陬邑(今山东曲阜)。父叔梁纥,母颜徵在。三岁丧父,家贫而好学。", "src": "《史记·孔子世家》"}, {"y": -522, "lat": 35.6, "lng": 116.9, "z": 5, "rel": "confucian", "label": "📖孔子·三十而立·始教", "info": "孔子约三十岁时开始授徒讲学,创办私学。主张有教无类,打破贵族对教育的垄断。", "src": "《史记·孔子世家》"}, {"y": -497, "lat": 36.0, "lng": 117.0, "z": 5, "rel": "confucian", "label": "📖孔子·周游列国", "info": "孔子55岁离开鲁国,开始14年周游列国之旅。先后至卫宋陈蔡等十余国,宣扬仁政德治,然终不见用。途中困于陈蔡之间,仍弦歌不辍。", "src": "《史记·孔子世家》"}, {"y": -484, "lat": 35.6, "lng": 116.9, "z": 5, "rel": "confucian", "label": "📖孔子·归鲁删述六经", "info": "68岁归鲁。整理《诗》《书》《礼》《乐》《易》《春秋》六经,为中国文化传承做出奠基性贡献。", "src": "《史记·孔子世家》"}, {"y": -479, "lat": 35.6, "lng": 116.9, "z": 5, "rel": "confucian", "label": "📖孔子逝世·儒学历程开始", "info": "73岁卒于鲁国。弟子编《论语》,儒学逐渐成为中华文明主流思想,后与佛教形成长达两千年的融突关系。"}, {"y": -372, "lat": 35.5, "lng": 117.0, "z": 5, "rel": "confucian", "label": "📖孟子·性善论", "info": "孟子(约前372-前289),战国儒家代表。提出性善论仁政说。其心性之学后与佛教如来藏思想有深层对话空间。", "src": "《史记·孟子荀卿列传》"}, {"y": -335, "lat": 36.0, "lng": 117.0, "z": 5, "rel": "confucian", "label": "📖孟子·游说齐梁", "info": "孟子效法孔子周游列国,先后至齐梁等国宣扬仁政王道。齐宣王时曾为客卿,但主张终不见用。晚年退而与弟子万章等作《孟子》七篇。", "src": "《史记·孟子荀卿列传》"}, {"y": -469, "lat": 37.9, "lng": 23.7, "z": 4, "rel": "western", "label": "🏛苏格拉底·雅典", "info": "苏格拉底(前469-前399),古希腊哲学奠基人。与孔子大致同时代,东西方哲学两大源头并行发展。", "bg": true, "src": "西洋哲学史"}, {"y": -334, "lat": 33.0, "lng": 44.0, "z": 3, "rel": "western", "label": "🏛亚历山大大帝东征", "info": "亚历山大东征至印度河流域,希腊文化与印度文明首次大规模接触。为后来犍陀罗佛教艺术的出现埋下伏笔。", "bg": true, "src": "世界史"}, {"y": -369, "lat": 33.5, "lng": 115.0, "z": 5, "rel": "daoist", "label": "☯庄子·蒙地漆园吏", "info": "庄子(约前369-前286)生于宋国蒙地(今豫皖交界)。曾任漆园吏,后弃官隐居。楚威王曾聘其为相,庄子笑拒:宁游戏污渎之中自快,无为有国者所羁。", "src": "《史记·老子韩非列传》"}, {"y": -300, "lat": 33.5, "lng": 115.0, "z": 5, "rel": "daoist", "label": "☯庄子·著《南华真经》", "info": "庄子晚年著书十万余言。《逍遥游》论精神自由,《齐物论》破主客二元,《养生主》说庖丁解牛。其坐忘心斋之说后与佛教禅观相通。", "src": "《庄子》/《史记》"}, {"y": -313, "lat": 35.0, "lng": 116.0, "z": 5, "rel": "confucian", "label": "📖荀子·性恶论", "info": "荀子(约前313-前238),战国儒家。性恶隆礼重法。其天人之分与佛教缘起论有可比较处。", "src": "《史记·孟子荀卿列传》"}, {"y": -563, "lat": 27.5, "lng": 83.3, "z": 5, "label": "释迦诞生·蓝毗尼园", "info": "悉达多太子生于迦毗罗卫。幼受婆罗门教育,后出家求道。"}, {"y": -528, "lat": 24.7, "lng": 85, "z": 5, "label": "释迦成道·菩提伽耶", "info": "35岁菩提树下觉悟。华严宗传统:此后三七日于定中说《华严经》,揭示法界缘起。"}, {"y": -500, "lat": 25.5, "lng": 83.0, "z": 4, "label": "六师外道·印度思想百花齐放", "info": "佛陀时代六大非佛教思想家活跃。耆那教(尼乾陀若提子)、唯物论(阿耆多)、宿命论(末伽梨)等与佛教同时竞争。佛教正是在这一多元思想生态中确立其独特教义。", "bg": true, "src": "《沙门果经》(DN 2)"}, {"y": -528, "lat": 25.4, "lng": 83, "z": 5, "label": "初转法轮·鹿野苑", "info": "为五比丘说四圣谛八正道。僧团成立,佛教诞生。此后45年游化讲经。"}, {"y": -483, "lat": 26.74, "lng": 83.89, "z": 5, "label": "释迦入灭·拘尸那罗", "info": "80岁于拘尸那罗入灭。弟子结集经律,佛教由此向四方传播。"}, {"y": -260, "lat": 25.3, "lng": 83, "z": 4, "label": "阿育王·佛教走出印度", "info": "阿育王皈依,派传教师向中亚东南亚传播。第三次结集。佛教从区域宗教变为世界宗教。", "src": "阿育王石刻诏书"}, {"y": -200, "lat": 34.0, "lng": 72.0, "z": 4, "label": "希腊·犍陀罗佛教艺术(有争议)", "info": "希腊-巴克特里亚时期佛教与希腊艺术在犍陀罗相遇。最早佛像出现时间学界有争议:一说公元前1世纪,一说公元1世纪。犍陀罗在佛教东传中的枢纽地位则无争议。", "src": "佛教艺术史(有学术争议)"}, {"y": -100, "lat": 33.7, "lng": 72.8, "z": 4, "label": "犍陀罗·大乘经论结集", "info": "犍陀罗地区成为大乘佛教发展重镇。般若经、华严经等大乘经典在此地区逐步形成。", "src": "佛教文献学"}, {"y": 65, "lat": 33.7, "lng": 72.8, "z": 4, "label": "迦腻色迦王·犍陀罗结集", "info": "贵霜帝国第四次结集。佛法深入中亚,犍陀罗成东传枢纽。大乘经论在此大量结集。"}, {"y": 80, "lat": 27.5, "lng": 77.7, "z": 4, "label": "马鸣·大乘起信论", "info": "造《大乘起信论》。一心二门之说后为华严心性论与判教体系的重要理论基础。"}, {"y": -136, "lat": 34.3, "lng": 108.9, "z": 5, "rel": "confucian", "label": "📖汉武帝·独尊儒术", "info": "董仲舒建议罢黜百家独尊儒术。儒学成为汉朝官方意识形态,后来佛教入华时与儒家伦理产生深刻碰撞与融合。", "src": "《汉书·董仲舒传》"}, {"y": 0, "lat": 31.7, "lng": 35.2, "z": 4, "rel": "western", "label": "✝耶稣诞生·伯利恒", "info": "耶稣基督诞生于犹太伯利恒。基督教此后逐渐发展为世界性宗教,与佛教在欧亚大陆两端并行发展。", "bg": true, "src": "《新约圣经》"}, {"y": 34, "lat": 32.0, "lng": 108.0, "z": 5, "rel": "daoist", "label": "☯张道陵诞生·沛国丰县", "info": "张道陵(34-156),原名张陵,沛国丰县人(今江苏丰县)。早年通晓五经,后弃儒学道。", "src": "《后汉书》《神仙传》"}, {"y": 100, "lat": 30.0, "lng": 105.0, "z": 5, "rel": "daoist", "label": "☯张道陵·入蜀鹤鸣山", "info": "张道陵入蜀至鹤鸣山(今四川大邑)。在此得太上老君亲授天师之位,创正一盟威之道(五斗米道)。", "src": "《神仙传》"}, {"y": 142, "lat": 30.5, "lng": 104.0, "z": 5, "rel": "daoist", "label": "☯张道陵·青城山·道教正式创立", "info": "张道陵在青城山设二十四治(教区),正式建立天师道。奉老子为教祖,以《道德经》为根本经典,《老子想尔注》阐发教义。道教从此成为有组织的宗教。", "src": "《后汉书·刘焉传》《神仙传》"}, {"y": 156, "lat": 30.5, "lng": 104.0, "z": 5, "rel": "daoist", "label": "☯张道陵·飞升·系师张衡继任", "info": "张道陵于青城山飞升(逝世),享年123岁。其子张衡继任为第二代天师(系师),孙张鲁为第三代天师,天师世家由此传承至今。", "src": "《神仙传》《三国志·张鲁传》"}, {"y": 167, "lat": 34.7, "lng": 112.4, "z": 5, "label": "支谶译兜沙经·华严首入汉地", "info": "月氏僧支娄迦谶至洛阳,译《佛说兜沙经》。虽仅1卷,却是华严经文首次汉译。"}, {"y": 320, "lat": 25.1, "lng": 85.4, "z": 4, "label": "无著·世亲·那烂陀寺", "info": "瑜伽行派于那烂陀弘传。世亲造《十地经论》,后经汉译催生地论学派。"}, {"y": 344, "lat": 41.7, "lng": 82.9, "z": 4, "label": "鸠摩罗什出生·龟兹", "info": "罗什生于西域龟兹。后至长安成四大译师之首,译十住经等为华严学奠基。"}, {"y": 359, "lat": 34, "lng": 72, "z": 4, "label": "佛驮跋陀罗·北天竺", "info": "觉贤生于北天竺。后至建康首译六十华严全本。"}, {"y": 401, "lat": 34.3, "lng": 108.9, "z": 5, "label": "罗什至长安·译经运动", "info": "弘始三年至长安,八百沙门参与译场。译中论/十住经/法华经等。"}, {"y": 320, "lat": 30.0, "lng": 115.0, "z": 5, "rel": "daoist", "label": "☯葛洪·《抱朴子》", "info": "葛洪(283-363),晋代道教思想家。著《抱朴子》内篇系统阐述道教神仙理论。道教从此有了完整的理论体系。", "bg": true, "src": "《晋书·葛洪传》"}, {"y": 399, "lat": 34.3, "lng": 108.9, "z": 5, "label": "法显西行·长安出发", "info": "法显(337-422)以65岁高龄从长安出发,经河西走廊、敦煌、鄯善、于阗,越葱岭至印度。同行11人,途中或返或亡。", "src": "《佛国记》"}, {"y": 405, "lat": 37.1, "lng": 79.9, "z": 5, "label": "法显·于阗·观行像盛会", "info": "法显至于阗国,恰逢盛大的行像法会。记录于阗佛教繁荣景象。于阗后为藏译华严底本来源。", "src": "《佛国记》"}, {"y": 410, "lat": 25.1, "lng": 85.4, "z": 5, "label": "法显·抵达中天竺", "info": "法显越过葱岭雪山进入印度。游历那烂陀、菩提伽耶、鹿野苑等圣迹,学梵书梵语,抄写戒律。", "src": "《佛国记》"}, {"y": 420, "lat": 32.1, "lng": 118.8, "z": 5, "label": "六十华严·建康道场寺", "info": "佛驮跋陀罗译六十华严34品。华严经首次以全貌呈现汉地。"}, {"y": 468, "lat": 34.7, "lng": 112.4, "z": 5, "label": "慧光·地论南道派", "info": "从勒那摩提学十地经论,开地论南道。其学数代传至智俨法藏,为华严义学前身。"}, {"y": 313, "lat": 41.0, "lng": 28.9, "z": 4, "rel": "western", "label": "✝米兰敕令·基督教合法化", "info": "罗马皇帝君士坦丁颁布米兰敕令,基督教在罗马帝国合法化。从此基督教与佛教在欧亚大陆两端各自传播发展。", "bg": true, "src": "罗马帝国史"}, {"y": 508, "lat": 34.7, "lng": 112.4, "z": 5, "label": "十地经论·洛阳译出", "info": "菩提流支译世亲十地经论。催生南北朝最重要的义学流派:地论学派。"}, {"y": 557, "lat": 33.9, "lng": 109, "z": 6, "label": "杜顺·终南山·华严创宗", "info": "著法界观门/五教止观。以法界三观和五教止观为华严宗奠定修行理论基础。"}, {"y": 597, "lat": 29.2, "lng": 121, "z": 5, "label": "智𫖮·天台宗成立", "info": "天台宗于天台山成立(中国最早宗派)。华严判教中「同教一乘」即针对天台而设。"}, {"y": 602, "lat": 33.9, "lng": 109, "z": 6, "label": "智俨·华严二祖", "info": "从杜顺出家,著搜玄记/一乘十玄门。开创华严宗经疏传统,为法藏之师。"}, {"y": 643, "lat": 34.3, "lng": 108.9, "z": 6, "label": "法藏·华严三祖·宗派确立", "info": "系统化五教十宗判教。武则天赐号贤首。参与八十华严译场证义。华严宗至此正式确立。"}, {"y": 629, "lat": 34.3, "lng": 108.9, "z": 5, "label": "玄奘西行·长安出发", "info": "玄奘(602-664)29岁从长安出发,经秦州、凉州、瓜州,偷渡玉门关,穿越莫贺延碛沙漠,九死一生抵高昌。", "src": "《大唐大慈恩寺三藏法师传》"}, {"y": 631, "lat": 25.1, "lng": 85.4, "z": 5, "label": "玄奘·抵达那烂陀寺", "info": "玄奘越兴都库什山进入印度,在那烂陀寺师从戒贤法师,学习瑜伽师地论等。戒贤为无著世亲瑜伽行派传人。", "src": "《大慈恩寺三藏法师传》"}, {"y": 643, "lat": 24.7, "lng": 84.9, "z": 5, "label": "玄奘·曲女城无遮大会", "info": "戒日王为玄奘在曲女城举行无遮大会,18国王齐聚。玄奘立真唯识量,18日无人能破,获大乘天和解脱天尊号。", "src": "《大慈恩寺三藏法师传》"}, {"y": 645, "lat": 34.3, "lng": 108.9, "z": 5, "label": "玄奘归国·唯识宗兴起", "info": "玄奘携657部梵本归国,创唯识宗。华严性宗与唯识相宗形成教内深度对话。"}, {"y": 671, "lat": 23.1, "lng": 113.3, "z": 5, "label": "义净·广州乘船赴印", "info": "义净(635-713)37岁从广州搭乘波斯商船出发,经南海诸国至印度。选择海路避开了西域战乱,开辟求法新路线。", "src": "《南海寄归内法传》"}, {"y": 675, "lat": 25.1, "lng": 85.4, "z": 5, "label": "义净·那烂陀寺留学", "info": "义净抵达那烂陀寺,留学十载。学习瑜伽、中观、因明,并抄写戒律典籍。期间还到访王舍城灵鹫山等圣迹。", "src": "《南海寄归内法传》"}, {"y": 695, "lat": 34.3, "lng": 108.9, "z": 5, "label": "义净归国·洛阳", "info": "义净携梵本400余部归国,武则天亲迎于洛阳。后主持译场译经56部230卷,偏重律藏。与法显、玄奘并称中国三大求法僧。", "src": "《宋高僧传》卷一"}, {"y": 652, "lat": 37.1, "lng": 79.9, "z": 4, "label": "实叉难陀·于阗", "info": "生于于阗。于阗为中亚佛教枢纽:既是实叉难陀故乡,又是藏译华严底本来源。"}, {"y": 699, "lat": 34.7, "lng": 112.4, "z": 6, "label": "八十华严·洛阳佛授记寺", "info": "实叉难陀译八十华严39品。法藏证义。后世流传最广汉译本。"}, {"y": 712, "lat": 34.3, "lng": 108.9, "z": 6, "label": "法藏圆寂·长安", "info": "华严三祖圆寂。讲华严经三十余遍,著五教章/探玄记。实际创立者功业圆满。"}, {"y": 713, "lat": 24.8, "lng": 113.6, "z": 5, "label": "慧能入灭·南宗禅兴起", "info": "六祖慧能入灭。南宗禅此后大盛。华严五祖宗密兼为禅宗荷泽传人,开启禅教融合。"}, {"y": 780, "lat": 34, "lng": 108.7, "z": 6, "label": "宗密·圭峰·禅教融合", "info": "华严五祖宗密住圭峰。著禅源诸诠集都序,融合华严与禅宗。教禅一致思想基础确立。"}, {"y": 798, "lat": 34.3, "lng": 108.9, "z": 6, "label": "四十华严·长安", "info": "般若三藏译四十华严(入法界品全本)。善财五十三参完整故事得以汉译。"}, {"y": 716, "lat": 34.3, "lng": 108.9, "z": 6, "label": "善无畏·金刚智·开元三大士", "info": "善无畏(637-735)716年至长安译大日经传胎藏界。金刚智(671-741)719年至长安译金刚顶经传金刚界。与不空并称开元三大士,中国密宗奠基。", "src": "《宋高僧传》"}, {"y": 725, "lat": 34.3, "lng": 108.9, "z": 6, "label": "一行·大日经疏·大衍历", "info": "一行(683-727)师事善无畏,协助译大日经并著疏二十卷。制大衍历为唐代最精确历法。兼通天文学与密宗义学。", "src": "《宋高僧传》卷五"}, {"y": 800, "lat": 29.7, "lng": 91.1, "z": 4, "label": "藏译华严·吐蕃", "info": "胜友/智军将于阗本华严译为藏文Toh44(45品)。华严经中亚于阗传入西藏。"}, {"y": 805, "lat": 34.3, "lng": 108.9, "z": 6, "label": "慧果·青龙寺·密宗集大成", "info": "慧果(746-805)兼承善无畏胎藏界与金刚智金刚界两部密法。住长安青龙寺,为密宗第七祖。日本空海从此受法。", "src": "空海《御请来目录》"}, {"y": 806, "lat": 34.2, "lng": 135.6, "z": 6, "label": "空海归国·日本真言宗创立", "info": "空海(774-835)804年入唐从慧果受法,806年归国于高野山开创日本真言宗。著十住心论以华严判教框架判摄显密诸宗。", "src": "日本佛教史"}, {"y": 839, "lat": 39, "lng": 113.6, "z": 6, "label": "澄观圆寂·五台山", "info": "华严四祖圆寂。著华严经疏60卷/演义钞90卷。集大成者,历七帝之师。"}, {"y": 610, "lat": 21.4, "lng": 39.8, "z": 4, "rel": "islamic", "label": "☪穆罕默德·伊斯兰教创立", "info": "穆罕默德在麦加开始传播伊斯兰教。世界三大宗教格局(佛教/基督教/伊斯兰教)至此确立。", "bg": true, "src": "《古兰经》/伊斯兰教史"}, {"y": 841, "lat": 34, "lng": 108.7, "z": 5, "label": "宗密圆寂·华严盛极而衰", "info": "五祖宗密圆寂。次年武宗灭佛,华严典籍大量焚毁,此后转入隐传阶段。"}, {"y": 845, "lat": 34.3, "lng": 108.9, "z": 5, "label": "会昌法难·华严典籍焚毁", "info": "唐武宗灭佛。华严传承几近断绝。此后义学隐传,直至宋代复兴。"}, {"y": 800, "lat": 30.0, "lng": 112.0, "z": 5, "rel": "daoist", "label": "☯吕洞宾·道教内丹", "info": "吕洞宾(约798-?),唐末五代道教宗师。后被尊为八仙之一。其内丹学说吸收佛教禅宗心性论,体现佛道深度融合。", "bg": true, "src": "道教神仙传"}, {"y": 868, "lat": 40.0, "lng": 94.8, "z": 5, "label": "金刚经雕版·敦煌", "info": "敦煌出土咸通九年(868年)雕版印刷金刚经,世界现存最早有纪年的印刷品。佛教经典的传播方式从此革命性变化。", "src": "大英图书馆藏敦煌文献"}, {"y": 907, "lat": 34.3, "lng": 108.9, "z": 5, "label": "唐亡·五代十国", "info": "唐朝灭亡,进入五代十国分裂时期。北方战乱频繁,佛教学术重心南移。吴越钱氏、南唐李氏保护佛教。", "src": "中国通史"}, {"y": 973, "lat": 37.6, "lng": 127, "z": 5, "label": "均如·统一高丽华严", "info": "高丽学僧均如统一华严南北二宗。著三宝章圆通钞。早于义天,为高丽华严前驱。"}, {"y": 1011, "lat": 30.2, "lng": 120.1, "z": 6, "label": "净源中兴·杭州慧因寺", "info": "宋代华严复兴。慧因寺世称华严第一道场。后义天入宋求法于此。"}, {"y": 1038, "lat": 30.2, "lng": 120.1, "z": 6, "label": "子璿·兼弘贤首天台", "info": "长水子璿著起信论疏笔削记。兼弘贤首与天台,体现宋代宗派融合趋势。"}, {"y": 1050, "lat": 34.0, "lng": 113.0, "z": 5, "rel": "confucian", "label": "📖宋明理学兴起", "info": "周敦颐(1017-1073)创太极图说,张载(1020-1077)立气论,二程(1032-1085)发明天理。理学吸收佛教心性论与华严理事无碍思维,开儒学新纪元。", "src": "《宋史·道学传》"}, {"y": 1085, "lat": 30.2, "lng": 120.1, "z": 6, "label": "义天入宋·杭州慧因寺", "info": "高丽王子义天从净源受华严。归国编义天录。华严经杭州传入朝鲜半岛。"}, {"y": 1101, "lat": 37.6, "lng": 127, "z": 5, "label": "义天圆寂·高丽开京", "info": "义天圆寂。此后高丽学僧继续弘扬,朝鲜半岛成东亚华严重镇。"}, {"y": 1173, "lat": 35, "lng": 135.8, "z": 5, "label": "明惠中兴·日本高山寺", "info": "明惠复兴日本华严。高山寺开山,兼弘戒律真言。东亚华严网络最终一环形成。"}, {"y": 1271, "lat": 39.9, "lng": 116.4, "z": 5, "label": "元朝·八思巴帝师", "info": "元朝建立,藏传佛教入汉。八思巴为国师。海云继梦认为此后禅宗正法心法失传七~八百年。"}, {"y": 1200, "lat": 28.0, "lng": 118.0, "z": 5, "rel": "confucian", "label": "📖朱熹·理学集大成", "info": "朱熹(1130-1200)集北宋理学大成,确立程朱理学体系。其格物穷理与华严事事无碍有可比较的认识论结构。朱子学后传入朝鲜日本,影响东亚思想史。", "src": "《宋元学案》"}, {"y": 1368, "lat": 32.0, "lng": 118.8, "z": 5, "label": "明朝建立·洪武", "info": "朱元璋建都南京,早年曾出家为僧。明初设立僧官制度,整顿佛教,天下寺院分禅讲教三类管理。", "src": "《明史》"}, {"y": 1409, "lat": 29.6, "lng": 91.1, "z": 5, "label": "宗喀巴·格鲁派创立", "info": "宗喀巴大师在拉萨创大昭寺传召法会,格鲁派(黄教)正式确立。藏传佛教进入新的发展阶段。", "src": "藏传佛教史"}, {"y": 1508, "lat": 26.5, "lng": 106.7, "z": 5, "rel": "confucian", "label": "📖王阳明·龙场悟道", "info": "王守仁(1472-1529)在贵州龙场悟道,提出知行合一。阳明心学与禅宗明心见性有深度亲缘性,其「致良知」近于佛教本觉思想。后传入日本,影响明治维新。", "src": "《明儒学案》"}, {"y": 1517, "lat": 51.0, "lng": 11.0, "z": 4, "rel": "western", "label": "✝马丁·路德·宗教改革", "info": "马丁·路德在维滕堡贴出九十五条论纲,欧洲宗教改革开始。此后基督教世界分裂,西方进入宗教多元化时代。", "bg": true, "src": "世界史"}, {"y": 1687, "lat": 52.0, "lng": -0.1, "z": 4, "rel": "western", "label": "🔬牛顿·自然哲学原理", "info": "牛顿发表《自然哲学的数学原理》,科学革命达到高峰。此后科学与宗教的关系成为西方思想核心议题,与佛教对宇宙的解释形成遥远对照。", "bg": true, "src": "科学史"}, {"y": 1578, "lat": 38.0, "lng": 110.0, "z": 5, "label": "俺答汗·达赖喇嘛封号", "info": "蒙古俺答汗迎请三世达赖索南嘉措,赠予达赖喇嘛称号。藏传佛教与蒙古政治力量结合。", "src": "蒙藏佛教史"}, {"y": 1600, "lat": 30.2, "lng": 120.1, "z": 5, "label": "明末四大师·佛教复兴", "info": "紫柏/憨山/莲池/澫益四大师推动晚明佛教全面复兴。华严学亦受此波影响。"}, {"y": 1644, "lat": 39.9, "lng": 116.4, "z": 5, "label": "清军入关·明亡", "info": "清朝建立。顺治帝笃信佛教,礼敬禅僧。清初佛教在战乱后逐步恢复。", "src": "《清史稿》"}, {"y": 1641, "lat": 30.2, "lng": 120.1, "z": 6, "label": "续法·清代华严集大成", "info": "著贤首五教仪整理判教,编华严宗佛祖传梳理谱系。讲经二十余遍。"}, {"y": 1720, "lat": 30.0, "lng": 91.0, "z": 5, "label": "康熙平定西藏", "info": "清军入藏,确立对西藏的管辖。藏传佛教格鲁派与清廷关系制度化。", "src": "《清圣祖实录》"}, {"y": 1793, "lat": 29.6, "lng": 91.1, "z": 5, "label": "乾隆·钦定藏内善后章程", "info": "确立金瓶掣签制度。藏传佛教活佛转世纳入国家管理。", "src": "《卫藏通志》"}, {"y": 1860, "lat": 32.0, "lng": 118.8, "z": 5, "label": "太平天国·佛教重创", "info": "太平军占据江南,大量寺院被毁,经书遭焚。江南佛教遭受空前打击。", "src": "中国近代佛教史"}, {"y": 1898, "lat": 39.9, "lng": 116.4, "z": 5, "label": "戊戌变法·庙产兴学", "info": "张之洞提出庙产兴学主张,将寺院财产充作教育经费。此政策持续影响近代佛教至民国。", "src": "《劝学篇》"}, {"y": 1880, "lat": 34.0, "lng": 109.0, "z": 5, "rel": "daoist", "label": "☯陈撄宁·现代道教复兴", "info": "陈撄宁(1880-1969),近代道教重要学者。创办《仙学》月刊,提倡仙学独立于儒释,推动道教的现代化转型。", "bg": true, "src": "中国道教史"}, {"y": 1912, "lat": 34.5, "lng": 110.0, "z": 5, "rel": "daoist", "label": "☯张志顺·全真高道", "info": "张志顺(1912-2015),全真龙门派第二十一代传人。以百岁高龄仍坚持修行传道,被认为是近代道家实修的典范人物。", "bg": true, "src": "道教人物志"}, {"y": 1914, "lat": 31.7, "lng": 120.7, "z": 7, "label": "华严大学·常熟兴福寺", "info": "月霞创立近代第一所华严专宗教育机构。培养常惺/持松等现代学僧。"}, {"y": 1936, "lat": 34.3, "lng": 108.9, "z": 5, "rel": "daoist", "label": "☯任法融·中国道协会长", "info": "任法融(1936-2021),原中国道教协会会长。著《道德经释义》等,以现代语言诠释道家经典。推动道教与当代社会对话。", "bg": true, "src": "中国道教协会"}, {"y": 1952, "lat": 25, "lng": 121.6, "z": 7, "label": "华严莲社·台北", "info": "智光/南亭创社,开启台湾华严弘传。成一/贤度相继,发展为现代学术教育中心。"}, {"y": 1975, "lat": 25, "lng": 121.5, "z": 7, "label": "华严专宗学院·台北", "info": "成一法师创办,以专修/专研/专弘华严为宗旨。当代最重要华严教育机构。"}, {"y": 1991, "lat": 25, "lng": 121.5, "z": 7, "label": "梦参剃度·临济47代", "info": "海云继梦(陈鹤山)于梦参老和尚座下剃度,法名昌一号继梦。此前十年以在家身弘法,奠定现代语言诠释华严的教学风格。"}, {"y": 2004, "lat": 34.2, "lng": 108.9, "z": 6, "label": "西安弘法·社科院演讲", "info": "受聘陕师大华严研究所荣誉所长。社科院演讲(首位登台出家人)。2006-2010北京广化寺系统弘讲四十华严全本。"}, {"y": 2008, "lat": 23.9, "lng": 120.9, "z": 9, "label": "三脉汇流·普贤乘确立", "info": "★核心★钦因传华严衣钵(贤首42世)+胜师子王菩萨传瑜伽行。三脉归一开创普贤乘华严宗。技术面(数随止)+工程面(ABC心法)双轨。四阶段:出离→菩提→菩萨→普贤乘。"}, {"y": 2011, "lat": 25, "lng": 121.5, "z": 7, "label": "华严六科·五大行法定型", "info": "六科(概论/经教/禅法/戒律/净土/密法)+五大行法(禅净律密经教)完整出版。三部曲(非常坛经/金刚经/心经)确立修行框架。"}, {"y": 2013, "lat": 25, "lng": 121.5, "z": 7, "label": "海云华严研究所成立", "info": "熊琬教授任所长。华严学报创刊(已出14期)。忍可灌顶制度+禅观一览表公开发布。修学体系从个人教学转向制度化僧团教育。"}, {"y": 2021, "lat": 27.7, "lng": 85.3, "z": 5, "label": "84000英译·华严回归国际", "info": "Peter Alan Roberts英译入法界品出版。藏文华严首次系统英译。"}, {"y": 2026, "lat": 24.5, "lng": 120.7, "z": 9, "label": "九九华严·支提山动土", "info": "台北TICC五年讲座。苗栗通霄支提山大华严寺动土,隔海与福建宁德支提华严祖庭相望。五十三位嘉宾执铲呼应善财五十三参。义理传播与道场建设双线并行。"}]}, "transmission_story": {"story": [{"y": -1500, "p": "吠陀仙人", "lat": 29.0, "lng": 76.0, "ev": "雅利安人进入印度,吠陀宗教体系形成。梨俱吠陀为印度最古老宗教文献。轮回(karma)、禅定(dhyāna)等概念开始萌芽,为后来佛教思想提供了深厚的文化土壤。", "src": "印度上古史"}, {"y": -800, "p": "奥义书哲人", "lat": 26.5, "lng": 82.0, "ev": "奥义书时代思想家提出梵(Brahman)与阿特曼(ātman)的哲学概念。佛教「无我」(anātman)说正是在与这一传统的对话和批判中形成。", "src": "奥义书文献"}, {"y": -563, "p": "释迦牟尼", "lat": 27.5, "lng": 83.3, "ev": "悉达多太子诞生于迦毗罗卫城蓝毗尼园(今尼泊尔)。幼年受婆罗门传统教育,后出家求道,经历六年苦行。", "src": "巴利文献·佛传"}, {"y": -528, "p": "释迦牟尼", "lat": 24.7, "lng": 84.99, "ev": "35岁时于菩提伽耶菩提树下觉悟成佛。华严宗传统认为《华严经》即于此后三七日中,于定中为法身大士所说,揭示法界缘起之宇宙实相。此为华严经教之源头。", "src": "华严宗传统"}, {"y": -528, "p": "释迦牟尼", "lat": 25.4, "lng": 83.0, "ev": "成道后至鹿野苑为五比丘初转法轮,讲四圣谛八正道。佛教僧团成立。此后45年游化恒河流域,讲经三百余会。", "src": "《杂阿含经》"}, {"y": -483, "p": "释迦牟尼", "lat": 26.7, "lng": 83.9, "ev": "80岁时于拘尸那罗入灭。佛教由此向四方传播。华严宗法身思想将释迦入灭理解为「化身隐而法身常」,毗卢遮那佛永恒说法于华藏世界。", "src": "《大般涅槃经》"}, {"y": -260, "p": "阿育王", "lat": 25.3, "lng": 83.0, "ev": "阿育王皈依佛教,派传教师向四方传播佛法。第三次结集后佛教开始向中亚、东南亚扩散。", "src": "阿育王石刻诏书"}, {"y": 65, "p": "迦腻色迦王", "lat": 33.7, "lng": 72.8, "ev": "贵霜帝国迦腻色迦王于犍陀罗举行第四次结集。佛法由印度深入中亚,犍陀罗成为佛教东传的枢纽站。", "src": "佛教史·贵霜时期"}, {"y": 80, "p": "马鸣", "lat": 27.5, "lng": 77.7, "ev": "马鸣菩萨造《大乘起信论》。该论「一心二门」之说后成为华严宗心性论与判教体系的重要理论基础。", "src": "传统著录"}, {"y": 167, "p": "支娄迦谶", "lat": 34.7, "lng": 112.4, "ev": "月氏僧支谶来华至洛阳,译《佛说兜沙经》。此为华严经文最早汉译,仅1卷,对应《如来名号品》。", "src": "《高僧传》卷一"}, {"y": 320, "p": "无著·世亲", "lat": 25.1, "lng": 85.4, "ev": "无著、世亲兄弟于那烂陀弘传瑜伽行派。世亲造《十地经论》,后经菩提流支汉译催生地论学派。", "src": "《大唐西域记》卷九"}, {"y": 344, "p": "鸠摩罗什", "lat": 41.7, "lng": 82.9, "ev": "罗什生于龟兹。401年至长安,主持史上最大译场。译《十住经》(十地品别译)、《十住毗婆沙论》等,为华严学提供关键文本基础。", "src": "《高僧传》卷二"}, {"y": 359, "p": "佛驮跋陀罗", "lat": 34.0, "lng": 72.0, "ev": "觉贤生于北天竺迦毗罗卫。后至建康译出《六十华严》34品。此为《华严经》首次汉译全本。", "src": "《高僧传》卷二"}, {"y": 401, "p": "鸠摩罗什", "lat": 34.3, "lng": 108.9, "ev": "罗什至长安逍遥园。主持中国史上最大译场,八百沙门参与。译出《十住经》《中论》《法华经》等,深刻影响华严义学。", "src": "《出三藏记集》卷十四"}, {"y": 420, "p": "佛驮跋陀罗", "lat": 32.1, "lng": 118.8, "ev": "六十华严译出于建康道场寺。七处八会三十四品。法业等百余人参与笔受。华严经首次以全貌呈现于汉地。", "src": "《出三藏记集》卷九"}, {"y": 468, "p": "慧光", "lat": 34.7, "lng": 112.4, "ev": "慧光生于北魏。从勒那摩提学《十地经论》,开地论南道派。后被尊为四分律宗初祖。其学经数代传至智俨、法藏,是为华严宗义学之前身。", "src": "《续高僧传》卷二十一"}, {"y": 508, "p": "菩提流支", "lat": 34.7, "lng": 112.4, "ev": "北印度僧菩提流支至洛阳,与勒那摩提译世亲《十地经论》十二卷。此论催生了南北朝最重要的义学流派——地论学派。", "src": "《续高僧传》卷一"}, {"y": 557, "p": "杜顺", "lat": 33.9, "lng": 109.0, "ev": "杜顺于终南山开创华严宗。著《华严法界观门》《五教止观》。以「法界三观」和「五教止观」为华严宗奠定修行理论基础。", "src": "《续高僧传》卷二十五"}, {"y": 643, "p": "法藏", "lat": 34.3, "lng": 108.9, "ev": "法藏生于长安。从智俨学华严。后系统化「五教十宗」判教,著《华严五教章》等。武则天赐号「贤首」。参与八十华严译场证义。华严宗至此正式确立。", "src": "《宋高僧传》卷五"}, {"y": 652, "p": "实叉难陀", "lat": 37.1, "lng": 79.9, "ev": "实叉难陀生于于阗。后奉武则天诏来华译经。于阗在中亚佛教网络中地位关键——既是实叉难陀故乡,又是藏译华严底本来源。", "src": "《宋高僧传》卷二"}, {"y": 699, "p": "实叉难陀·法藏", "lat": 34.7, "lng": 112.4, "ev": "八十华严译出于洛阳佛授记寺。法藏参与证义。七处九会三十九品,为后世流传最广的汉译本。", "src": "《宋高僧传》卷二"}, {"y": 780, "p": "宗密", "lat": 34.0, "lng": 108.7, "ev": "宗密住终南山圭峰。融合禅宗(荷泽系)与华严,著《禅源诸诠集都序》。华严与禅宗的深度融合,奠定了「教禅一致」的思想基础。", "src": "《宋高僧传》卷六"}, {"y": 800, "p": "胜友·智军", "lat": 29.7, "lng": 91.1, "ev": "胜友、智军等于吐蕃将《华严经》由于阗本译为藏文(Toh44)。华严传入西藏,形成独立于汉译的藏传华严传承。", "src": "德格版甘珠尔目录"}, {"y": 1085, "p": "义天", "lat": 30.2, "lng": 120.1, "ev": "高丽王子义天入宋,于杭州慧因寺从净源受华严。华严经由杭州传入朝鲜半岛。义天归国后编《义天录》,为华严文献学奠基。", "src": "《高丽史》卷九十"}, {"y": 1173, "p": "明惠", "lat": 35.0, "lng": 135.8, "ev": "日本华严中兴之祖明惠于京都高山寺复兴华严。兼弘戒律与真言。日本华严经历镰仓时代再兴,形成东亚华严网络最终一环。", "src": "日本佛教史"}]}, "theory_stages": {"stages": [{"label": "法界观门/五教止观", "s": 557, "e": 700, "c": "rgba(184,134,60,0.10)", "tc": "#b8863c"}, {"label": "五教十宗/法界缘起", "s": 643, "e": 820, "c": "rgba(94,139,158,0.10)", "tc": "#5e8b9e"}, {"label": "禅教融合", "s": 780, "e": 850, "c": "rgba(125,154,110,0.10)", "tc": "#7d9a6e"}, {"label": "义学沉寂·法脉隐传", "s": 850, "e": 1850, "c": "rgba(160,144,128,0.06)", "tc": "#a09080"}, {"label": "华严大学/现代复兴", "s": 1850, "e": 1981, "c": "rgba(196,107,93,0.10)", "tc": "#c46b5d"}, {"label": "普贤乘华严/东山法门", "s": 1981, "e": 2026, "c": "rgba(109,154,110,0.10)", "tc": "#6d9a6e"}]}, "practice_stages": {"stages": [{"label": "法界三昧观", "s": 557, "e": 640, "c": "rgba(184,134,60,0.06)", "tc": "#b8863c"}, {"label": "华严三昧观", "s": 643, "e": 820, "c": "rgba(125,154,110,0.06)", "tc": "#7d9a6e"}, {"label": "禅教融合观", "s": 780, "e": 850, "c": "rgba(94,139,158,0.06)", "tc": "#5e8b9e"}, {"label": "修行法脉隐传", "s": 850, "e": 1914, "c": "rgba(160,144,128,0.03)", "tc": "#a09080"}, {"label": "华严大学禅观", "s": 1914, "e": 1981, "c": "rgba(196,107,93,0.06)", "tc": "#c46b5d"}, {"label": "东山法门等持工程", "s": 1981, "e": 2026, "c": "rgba(109,154,110,0.06)", "tc": "#6d9a6e"}]}, "geo_flow": {"flow": [{"l": "终南山", "y": 590}, {"l": "洛阳", "y": 695}, {"l": "长安", "y": 700}, {"l": "五台山", "y": 790}, {"l": "杭州", "y": 1060}, {"l": "常熟/上海", "y": 1914}, {"l": "台北", "y": 1952}]}, "era_brackets": {"brackets": [{"label": "华严五祖时代", "s": 557, "e": 841}, {"label": "高丽华严传入", "s": 1085, "e": 1101}, {"label": "高原法系·明清中兴", "s": 1570, "e": 1700}, {"label": "华严大学·现代复兴", "s": 1858, "e": 1952}, {"label": "普贤乘·AI新时代", "s": 2008, "e": 2026}]}, "other_schools": {"schools": [{"n": "天台宗", "y": 597, "lat": 29.2, "lng": 121.0, "c": "#7d9a6e", "founder": "智𫖮", "loc": "天台山", "desc": "中国最早成立的佛教宗派。以《法华经》为根本经典。华严宗判教体系中「同教一乘」即针对天台而设。澄观曾参学天台。", "src": "《续高僧传》卷十七·智𫖮传 /《宋高僧传》卷五·澄观传"}, {"n": "三论宗", "y": 597, "lat": 34.3, "lng": 108.9, "c": "#a09080", "founder": "吉藏", "loc": "长安", "desc": "以《中论》《百论》《十二门论》立宗。华严宗继承三论空性论证方法，法藏判教将三论归入大乘始教。", "src": "《续高僧传》卷十一·吉藏传"}, {"n": "唯识宗", "y": 645, "lat": 34.3, "lng": 108.9, "c": "#8b7a9e", "founder": "玄奘", "loc": "长安", "desc": "以《成唯识论》立宗。与华严宗同源瑜伽行派但取径不同。玄奘译《显无边佛土功德经》(T0289)即华严寿量品别译。", "src": "《大唐大慈恩寺三藏法师传》"}, {"n": "净土宗", "y": 402, "lat": 29.6, "lng": 116.0, "c": "#b8863c", "founder": "慧远", "loc": "庐山", "desc": "以念佛往生为宗旨。华严经普贤行愿品为净土行者重视，华严「华藏世界」与净土「极乐世界」之间有深层义学互动。", "src": "《高僧传》卷六·慧远传"}, {"n": "禅宗", "y": 520, "lat": 34.5, "lng": 112.5, "c": "#d48476", "founder": "达摩→慧能", "loc": "少林寺→曹溪", "desc": "以教外别传为宗。华严五祖宗密同时是禅宗荷泽系传人，著《禅源诸诠集都序》系统融合禅教。澄观亦参谒禅门牛头宗。", "src": "《宋高僧传》卷六·宗密传 / 宗密《禅源诸诠集都序》"}, {"n": "律宗", "y": 626, "lat": 33.9, "lng": 109.0, "c": "#9e8b6e", "founder": "道宣", "loc": "终南山", "desc": "以四分律为根本。与华严宗同以终南山为根本道场。慧光(地论师·华严义学前身)同时被尊为四分律宗初祖。", "src": "《宋高僧传》卷十四·道宣传 / 《续高僧传》卷二十一·慧光传"}, {"n": "密宗", "y": 716, "lat": 34.3, "lng": 108.9, "c": "#c8893e", "founder": "善无畏·金刚智·不空", "loc": "长安", "desc": "唐代开元三大士传入。华严宗内贤首密法(秽迹金刚)自成体系。海云继梦所得印度瑜伽行传承亦与此有历史关联。", "src": "《宋高僧传》卷二·善无畏传 / 大华严寺官方资料"}]}, "loc_ancient": {"mapping": {"大慈恩寺": "唐长安·大慈恩寺", "终南山": "唐终南山·至相寺", "清凉山（五台山）": "唐清凉山·大华严寺", "圭峰": "唐终南山·圭峰草堂", "方山": "唐方山·李通玄著论处", "杭州慧因寺": "宋杭州·慧因高丽寺", "洛阳佛授记寺": "唐东都·佛授记寺", "台北华严莲社": "今台北·华严莲社", "北京广济寺": "今北京·广济寺", "常熟兴福寺": "清常熟·兴福寺(华严大学)", "于阗": "唐于阗·瞿萨旦那国", "敦煌": "唐沙州·敦煌", "尼泊尔加德满都谷地": "尼波罗国·加德满都谷地", "匡山（庐山）": "唐匡山·庐山", "奈良东大寺": "日本平城京·东大寺", "南投大华严寺": "今南投·云鹤山大华严寺", "台北福慧寺": "今台北·树林福慧寺", "印度那烂陀寺": "古印度·那烂陀寺"}}, "dynasty_boundaries": {"dynasties": [{"n": "唐", "s": 618, "e": 907, "c": "#b8863c", "bounds": [[18, 73], [42, 130]]}, {"n": "宋", "s": 960, "e": 1279, "c": "#5e8b9e", "bounds": [[20, 98], [40, 125]]}, {"n": "明", "s": 1368, "e": 1644, "c": "#c8893e", "bounds": [[18, 98], [43, 125]]}, {"n": "清", "s": 1644, "e": 1912, "c": "#8b7a9e", "bounds": [[18, 97], [44, 132]]}]}};
