<style>
:root{--bg:#f6f2e8;--panel:#fdfaf3;--card:#fefdf9;--gold:#b8863c;--blue:#5e8b9e;--green:#7d9a6e;--red:#c46b5d;--text:#3d3427;--text2:#7a7262;--line:#e5ddd0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;display:flex;flex-direction:column}
#header{background:linear-gradient(135deg,#e8e0d2,#efe6d8);padding:8px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
#header h1{font-size:1.1em;color:var(--gold);font-weight:600}
#header .sub{font-size:0.7em;color:var(--text2)}
#tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);padding:0 14px}
#tabs button{padding:10px 24px;border:none;background:none;color:var(--text2);cursor:pointer;font-size:0.85em;border-bottom:3px solid transparent;transition:all 0.25s;font-weight:500}
#tabs button:hover{color:var(--text)}

.tab-content{display:none;flex:1;overflow:hidden}
.tab-content.active{display:flex;flex-direction:column}
#search-bar{display:flex;gap:6px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center}
#search-bar input{border:1px solid var(--line);border-radius:14px;padding:5px 12px;font-size:0.8em;background:var(--card);color:var(--text);width:220px;outline:none}

#main-row{display:flex;flex:1;min-height:0}
#tl-panel{flex:1;position:relative;background:var(--panel);overflow:hidden;min-width:0}
#tl-panel canvas{display:block;position:absolute;top:0;left:0}
#side{width:380px;display:flex;flex-direction:column;min-width:240px;border-left:1px solid var(--line)}
#map-wrap{flex:1;min-height:200px;position:relative}
#map{width:100%;height:100%}
#info-box{background:var(--panel);border-top:1px solid var(--line);padding:14px 16px;font-size:0.82em;min-height:150px;overflow-y:auto;color:var(--text)}
#info-box .empty{text-align:center;color:var(--text2);padding-top:20px}
#controls{background:var(--panel);padding:6px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)}
#controls button{padding:4px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text2);cursor:pointer;font-size:0.73em;transition:all 0.2s}
#controls button:hover{background:#f0ebe0;color:var(--text);border-color:var(--gold)}
#controls button.active{background:var(--gold);color:#fff;border-color:var(--gold)}
#tl-tooltip{position:absolute;background:var(--card);color:var(--text);padding:10px 14px;border-radius:8px;font-size:0.82em;pointer-events:none;opacity:0;transition:opacity 0.15s;max-width:300px;z-index:100;box-shadow:0 4px 14px rgba(60,40,20,0.14);border:1px solid var(--line)}
#tl-tooltip h3{color:var(--gold);margin-bottom:3px}
.leaflet-popup-content{font-size:0.85em;color:var(--text)}
.leaflet-popup-content b{color:var(--gold)}
.leaflet-popup-content-wrapper{background:var(--card);border-radius:8px}
#gap-view,#practice-view{flex:1;background:var(--bg);overflow-y:auto;padding:22px 26px}
.section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;width:100%}
.v-table{width:100%;border-collapse:collapse;font-size:0.82em}
.v-table th{background:linear-gradient(180deg,#f5efe4,#efe6d8);color:var(--text);padding:8px 10px;text-align:left;font-weight:600}
.v-table td{padding:7px 10px;border-bottom:1px solid var(--line)}
.badge{padding:2px 8px;border-radius:10px;font-size:0.7em;font-weight:600}
.bA{color:var(--red)} .bB{color:#c8893e} .bC{color:#a08020} .bD{color:var(--blue)} .bE{color:var(--green)}
.miss{color:var(--red);font-weight:600}
@media(max-width:768px){body{overflow:auto}#header h1{font-size:0.95em}#header .sub{display:none}#main-row{flex-direction:column}#tl-panel{height:50vh;min-height:300px}#side{width:100%!important;flex-direction:row}#map-wrap{height:30vh}#controls button{font-size:0.68em}}
</style>
</head>

", "works": ["华严经搜玄记", "华严一乘十玄门"]}, {"id": "person_003", "name": "法藏", "dynasty": "唐", "title": "华严三祖·实际创立者", "lineage": "华严五祖", "type": "patriarch", "birth": 643, "death": 712, "bio": "华严宗实际创立者。祖籍康居，生于长安。从智俨学《华严》。参与实叉难陀译场。武则天赐号'贤首'。系统化'五教十宗'判教与'法界观门'观法。讲说《华严经》三十余遍。", "works": ["华严一乘教义分齐章（五教章）", "华严经探玄记"]}, {"id": "person_004", "name": "澄观", "dynasty": "唐", "title": "华严四祖·集大成者", "lineage": "华严五祖", "type": "patriarch", "birth": 738, "death": 839, "bio": "华严宗四祖。越州山阴人。历学律、禅、三论、天台、华严诸宗。著《华严经疏》六十卷、《演义钞》九十卷，为华严教学集大成者。历七帝之师。德宗赐号'清凉'。", "works": ["华严经疏（华严大疏）", "华严经随疏演义钞"]}, {"id": "person_005", "name": "宗密", "dynasty": "唐", "title": "华严五祖·禅教融合者", "lineage": "华严五祖", "type": "patriarch", "birth": 780, "death": 841, "bio": "华严宗五祖。果州西充人。初习儒学，后从遂州道圆禅师出家（禅宗荷泽系）。后遇澄观受学华严。融合禅教，著《禅源诸诠集都序》《华严原人论》。", "works": ["注华严法界观门", "禅源诸诠集都序"]}, {"id": "person_009", "name": "李通玄", "dynasty": "唐", "title": "华严居士学者", "lineage": "李通玄系", "type": "scholar", "birth": 635, "death": 730, "bio": "唐代华严学重要在家学者。深通儒释，专精《华严》，于方山著《新华严经论》四十卷。以《易经》融会华严，方法独树一帜。", "works": ["新华严经论", "华严经决疑论"]}, {"id": "person_011", "name": "净源", "dynasty": "宋", "title": "宋代华严中兴之祖", "lineage": "华严五祖", "type": "patriarch", "birth": 1011, "death": 1088, "bio": "宋代华严宗重要复兴者。住杭州慧因寺。传法于高丽义天，义天归国后送金书《华严经》三种译本供养慧因寺。慧因寺世称'华严第一道场'。", "works": ["华严经疏注", "华严妄尽还源观疏"]}, {"id": "person_010", "name": "义天", "dynasty": "宋", "title": "高丽华严初祖", "lineage": "高丽华严", "type": "scholar", "birth": 1055, "death": 1101, "bio": "高丽文宗第四子。入宋求法于杭州慧因寺，从净源法师受华严教法。回国后编《新编诸宗教藏总录》（义天录），为华严文献学的奠基性著作。", "works": ["新编诸宗教藏总录（义天录）", "圆宗文类"]}, {"id": "person_021", "name": "高原明昱", "dynasty": "明", "title": "华严宗第二十五世", "lineage": "华严五祖", "type": "patriarch", "birth": null, "death": null, "bio": "明代华严宗祖师，华严宗第二十五世传人。自他起华严法脉兼传慈恩宗（唯识/法相宗），开创'贤首兼慈恩'传承体系。钦因长老等现代传人皆属此高原法系。", "works": []}, {"id": "person_012", "name": "月霞", "dynasty": "清", "title": "近现代华严复兴先驱", "lineage": "月霞系", "type": "patriarch", "birth": 1858, "death": 1917, "bio": "清末民初华严宗复兴的关键人物。于常熟兴福寺创立华严大学（1914年），为中国近代第一所华严专宗教育机构，培养了一批现代华严学僧。", "works": []}, {"id": "person_031", "name": "应慈", "dynasty": "近现代", "title": "近代华严座主", "lineage": "月霞系", "type": "patriarch", "birth": 1873, "death": 1965, "bio": "月霞长老师弟。继承月霞遗志，长期在上海等地弘传华严，被尊为'华严座主'。真禅法师之师。平生讲《华严经》多遍。", "works": []}, {"id": "person_013", "name": "常惺", "dynasty": "近现代", "title": "", "lineage": "月霞系", "type": "patriarch", "birth": 1896, "death": 1939, "bio": "月霞长老弟子。继月霞之后主持华严大学，于北京、上海等地弘传华严。曾任闽南佛学院院长。", "works": []}, {"id": "person_018", "name": "智光", "dynasty": "近现代", "title": "华严莲社首任住持", "lineage": "智光系", "type": "patriarch", "birth": 1889, "death": 1963, "bio": "近代华严学者。台北华严莲社第一任住持（1952年创社），开启台湾华严宗弘传事业。", "works": []}, {"id": "person_015", "name": "南亭", "dynasty": "近现代", "title": "华严莲社第二任住持", "lineage": "华严莲社", "type": "patriarch", "birth": 1900, "death": 1982, "bio": "智光法师弟子。1952年与师智光共创台北华严莲社，任第二任住持。长期弘传华严教观，为台湾华严宗发展奠基人。", "works": []}, {"id": "person_016", "name": "成一", "dynasty": "当代", "title": "华严莲社第三任住持·华严专宗学院创办人", "lineage": "华严莲社", "type": "patriarch", "birth": 1914, "death": 2011, "bio": "江苏泰县人。15岁出家。1949年赴台，协助师祖南亭和尚创办华严莲社，1972年继任住持。1975年创办华严专宗学院，以'专修、专研、专弘华严'为宗旨。1985年创立美国华严莲社。著有多部华严学著作。1988年后恢复泰州光孝寺等大陆祖庭。", "works": ["成一和尚著作集"]}, {"id": "person_032", "name": "了中", "dynasty": "当代", "title": "华严莲社第四任住持", "lineage": "华严莲社", "type": "patriarch", "birth": 1932, "death": 2022, "bio": "华严莲社第四任住持。延续'专研、专修、专弘'华严的莲社传统。", "works": []}, {"id": "person_033", "name": "净海", "dynasty": "当代", "title": "华严莲社第五任住持", "lineage": "华严莲社", "type": "patriarch", "birth": null, "death": null, "bio": "华严莲社第五任住持。", "works": []}, {"id": "person_017", "name": "贤度", "dynasty": "当代", "title": "华严莲社第六任住持·华严专宗学院院长", "lineage": "华严莲社", "type": "patriarch", "birth": 1960, "death": null, "bio": "当代华严宗女性法嗣传承者。成一法师弟子。2005年获印度德里大学哲学博士。推动华严现代化转型：发行《华严乐坛》专辑、AI多媒体文创演绎五十三参。著有《华严学讲义》《华严净土思想与念佛法门》等。", "works": ["华严学讲义", "华严净土思想与念佛法门"]}, {"id": "person_034", "name": "明度", "dynasty": "当代", "title": "华严莲社第七任住持", "lineage": "华严莲社", "type": "patriarch", "birth": null, "death": null, "bio": "贤度法师之后，续掌华严莲社。贤首宗'明众生本际，悟诸佛果源'演字辈之一。", "works": []}, {"id": "person_041", "name": "钦因", "dynasty": "当代", "title": "贤首宗第四十一世·高原法系第十七世", "lineage": "贤首宗高原法系", "type": "patriarch", "birth": null, "death": null, "bio": "台湾树林福慧寺住持。贤首宗高原法系第四十一世传人（高原明昱为第25世）。2008年8月30日将华严宗衣钵传予海云继梦。另传法嗣予大慧法师、果峻法师、净严法师、宏慧法师等。演字：'明众生本际，悟诸佛果源'。", "works": []}, {"id": "person_042", "name": "海云继梦", "dynasty": "当代", "title": "三脉汇一的当代华严传承者·大华严寺导师", "lineage": "普贤乘华严宗", "type": "patriarch", "birth": 1950, "death": null, "bio": "俗名陈鹤山，台湾宜兰人。中兴大学经济系毕业。1991年于梦参长老座下出家（临济宗第四十七代，法名昌一，号继梦）。2008年受钦因长老传华严宗衣钵（贤首宗第四十二世）。同年得印度胜师子王菩萨传大乘瑜伽行法。汇三脉归一，开创'普贤乘华严宗'，复兴失传八百余年的'东山法门'。现为南投大华严寺导师。建立'无", "works": []}, {"id": "person_043", "name": "体佛", "dynasty": "当代", "title": "贤首禅苑", "lineage": "贤首宗高原法系", "type": "patriarch", "birth": null, "death": null, "bio": "钦因长老法嗣之一。创立贤首禅苑，弘扬华严禅法。", "works": []}, {"id": "person_019", "name": "梦参", "dynasty": "当代", "title": "当代华严弘扬巨擘", "lineage": "临济宗", "type": "practitioner", "birth": 1915, "death": 2017, "bio": "当代高僧，临济宗第四十六代。曾于五台山闭关修行多年。晚年大力弘扬《华严经》，讲说全本《八十华严》影响深远。1991年破例为海云继梦剃度（梦中得地藏菩萨示现），赐法名昌一。", "works": ["华严经讲记（全本）"]}, {"id": "person_014", "name": "慈舟", "dynasty": "近现代", "title": "", "lineage": "慈舟系", "type": "scholar", "birth": 1877, "death": 1958, "bio": "近代华严学者。长期于北京广济寺、济南等地讲说华严。著《华严经普贤行愿品亲闻记》，对《普贤行愿品》在现代的弘扬有重要推动。", "works": ["华严经普贤行愿品亲闻记"]}, {"id": "person_044", "name": "真禅", "dynasty": "当代", "title": "大陆当代华严禅实践者", "lineage": "临济宗", "type": "patriarch", "birth": 1916, "death": 1995, "bio": "当代大陆弘扬华严的代表性高僧。'禅宗临济、教在华严、行归地藏普贤'。师承应慈法师。1980年代后在玉佛寺多次主持华严佛七法会，宣讲《普贤行愿品》《十地品》。著有《玉佛丈室集》十集。", "works": ["玉佛丈室集"]}, {"id": "person_045", "name": "如孝", "dynasty": "当代", "title": "华严宗第四十一世法脉传人", "lineage": "华严宗", "type": "scholar", "birth": null, "death": null, "bio": "当代华严思想学者。师承星云长老、传印长老、法映长老。十余年研究华严思想当代实践。提出'别教一乘三类体系''法界十门体系''八纲体系'等。著有《生命的艺术》《修行的艺术》等丛书。2024年在《三秦宗教》刊发论文。", "works": ["生命的艺术", "修行的艺术"]}, {"id": "person_046", "name": "雪窦", "dynasty": "当代", "title": "美国华严莲社", "     +(students.length?"⬇ 传法: "+students.map(function(t){return t.name;}).join("、")+"<br>":"")
    +(p.bio||"");
  // Map fly
  if(map&&locs.length>0){var loc=locs[0];map.flyTo([loc.lat,loc.lng],locs.length===1?10:8,{duration:0.8});}
}
function clearSelection(){selectedId=null;drawTL(null);document.getElementById("info-box").innerHTML="<div class=empty>👆 点击时间轴上的人物</div>";}

// --- INTERACTION ---
function onWheel(e){e.preventDefault();var panel=document.getElementById("tl-panel");var rect=panel.getBoundingClientRect();var mx=e.clientX-rect.left;var before=(mx-tl.ox)/tl.scale;tl.scale*=e.deltaY<0?1.12:0.89;tl.scale=Math.max(0.12,Math.min(6,tl.scale));tl.ox=mx-before*tl.scale;drawTL(selectedId);}
function onMD(e){if(e.target.tagName==="CANVAS"){tl.drag=true;tl.lastX=e.clientX;}}
function onMM(e){
  if(!tl.drag){
    var panel=document.getElementById("tl-panel"),rect=panel.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
    var hit=tl.hitRects.find(function(h){return mx>=h.x&&mx<=h.x+h.w&&my>=h.y&&my<=h.y+h.h;});
    var tip=document.getElementById("tl-tooltip");
    if(hit){var p=hit.person;tip.style.opacity="1";tip.innerHTML="<h3>"+p.name+"</h3>"+(p.title||"")+" · "+p.dynasty+" · "+(p.birth||"?")+"–"+(p.death||"?");tip.style.left=(e.pageX+14)+"px";tip.style.top=(e.pageY-20)+"px";}
    else{tip.style.opacity="0";}
    return;
  }
  var dx=e.clientX-tl.lastX;tl.ox+=dx;tl.lastX=e.clientX;drawTL(selectedId);
}
function onMU(){tl.drag=false;}
function onClick(e){
  if(tl.drag||Math.abs(e.clientX-tl.lastX)>3)return;
  var panel=document.getElementById("tl-panel"),rect=panel.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
  var hit=tl.hitRects.find(function(h){return mx>=h.x&&mx<=h.x+h.w&&my>=h.y&&my<=h.y+h.h;});
  if(hit){selectPerson(hit.person.id);}else{clearSelection();}
}

// --- TABS ---
document.getElementById("tabs").addEventListener("click",function(e){

  document.querySelectorAll("#tabs button").forEach(function(b){b.classList.remove("active");});
  e.target.classList.add("active");
  document.querySelectorAll(".tab-content").forEach(function(t){t.classList.remove("active");});
  document.getElementById("tab-"+e.target.dataset.tab).classList.add("active");
  if(e.target.dataset.tab==="lineage"){setTimeout(function(){resizeTL();drawTL(selectedId);if(map)map.invalidateSize();},200);}
});

  h+="<p style=line-height:1.8><b style=color:#a08020>P2 — 中优先:</b> Ch.33 寿量品 · Ch.39 如来出现品 — 有玄奘《显无边佛土功德经》和竺法护《如来兴显经》等别译可对照。</p>";
  h+="</div>";

  // ── References ──
  h+="<div class=section><h2>📚 参考文献</h2><p style=font-size:0.82em;line-height:1.9>";
