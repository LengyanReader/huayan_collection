<script>
var ARTICLE = {"id": "huayan-studies", "file": "articles/huayan-studies.html", "title": "华严经学·三十九品深度研究", "title_sub": "品目·批注·版本对照 · 祖师大德与学者阐释", "icon": "📖", "version": "", "meta": "", "doc": "docs/华严经学_三十九品深度研究.md", "doc_md": "# 华严经学·三十九品深度研究\n\n> 华严经的起源与形成 / 品目结构与版本对照 / 祖师大德批注与学者阐释 / 梵藏汉英多语对读 / 华严宗义学体系\n\n> 本文目录（自动生成，点击跳转）：以上 H2 段落标题即为通篇目录；全文逐品详解见 `data/translation/avatamsaka_studies.yaml`（华严经学页），本文为独立导航与对照总表。\n\n## 一、华严经的起源与形成\n\n《华严经》(Skt. *Buddhāvataṃsaka*, T278/T279) 并非一次性成书, 而是历经数百年的渐进编纂过程。本节综合学界共识与争议, 梳理其从单品到大集的完整历程。\n\n### 1.1 四阶段发展史\n\n**第一阶段：原型华严 (Proto-Avataṃsaka, 约公元1—2世纪)**\n\n最早的华严类经典已作为独立经本流传。Jan Nattier (2005) 将这批最早的单品统称为 \"Proto-Avataṃsaka\", 认为它们构成了华严经典的核心「胚胎」, 其中已包含华严的基本宇宙观与菩萨道框架。\n\n主要单品包括：\n\n- 《兜沙经》(T600) — 后汉支谶译 (178—189), 对应八十华严「如来名号品」「光明觉品」, 是最早可考的华严单品, 叙述佛陀以名号度化众生。\n- 《菩萨本业经》(T601) — 吴·支谦译 (约222—253), 对应「净行品」「十住品」等, 阐述菩萨修行的基本框架。\n- 《诸菩萨求佛本业经》(T282, 失译) — 进一步阐述菩萨道修行。\n- 《菩萨十住行道品》(T283, 失译) — 菩萨十住修行的又一译本。\n\nNattier 通过文本分析提出了一个突破性重建方案：T600 并非一部独立经典, 而是一部更长文本的残存部分, 原本至少包含三个后来被独立编目的经本：T600 + T282 + T283, 三者共同构成了一部完整的\"原型华严\"单品。支谦译 T601 则是同一重建文本的另一译本 (different recension)。\n\n一个关键神学发现：在原型华严阶段, **释迦牟尼佛 (Sākyamuni) 而非毗卢遮那佛 (Vairocana) 才是核心佛陀**。后来的修订者将毗卢遮那佛提升至宇宙至高佛的地位——这是一个非同寻常的神学转变, 标志着华严思想从早期以历史佛陀为中心, 转向以法身佛为终极实在的宇宙论框架。\n\n**第二阶段：核心经典的确立 (约2—4世纪)**\n\n以《十地经》(Daśabhūmika-sūtra) 为核心的华严经典群逐步形成：\n\n- 《十地经》— 华严经中最重要的单品之一, 阐述菩萨修行的十个阶位 (欢喜地→法云地), 在印度佛教中被广泛引用。\n- 《渐备一切智德经》(竺法护译) — 与十地经相关的另一版本, 阐述菩萨渐次修习的过程。\n- 《入法界品》(Gaṇḍavyūha) — 善财童子五十三参的叙事核心, 描述菩萨从初发心到究竟成佛的完整修行历程。\n- 《如来兴显经》(Tathāgatotpattisaṃbhava-nirdeśa) — 阐述如来出现的因缘。\n\n这些经典在流传过程中逐步被「发现」为同一佛所说的不同部分。值得注意的是, 十地经与入法界品后来各自形成了独立的梵文传承, 在中亚乃至东亚佛教中都有深远影响。\n\n**第三阶段：大本结集与增补 (约3—5世纪)**\n\n在于阗地区, 独立的经典被编辑、整合为大本《华严经》。编辑者删除了各独立经本原有的「如是我闻」开篇语, 将「一时」改写为「尔时」以统一叙事; 删除了各独立经本的结尾语; 部分品目的地点与听众相关语句被删除, 以整合为七处九会的统一框架。最终形成三万六千偈 (六十华严底本) 或四万五千偈 (八十华严底本) 的大本。\n\nImre Hamar (2026) 进一步论证, 这一编纂过程并非简单的文本汇编, 而是一项需要「大量物质资源以及一个规模庞大、组织完善的僧团的制度性支持」的系统工程。于阗拥有「显著的王室护持」, 为如此宏大的编纂项目提供了必要的物质基础与制度保障。\n\n**第四阶段：跨语言传播 (约4世纪以后)**\n\n大本《华严经》从于阗向外传播：\n\n- **汉译**：418—421年佛陀跋陀罗译六十华严 (34品); 695—699年实叉难陀译八十华严 (39品)\n- **藏译**：约9世纪由智军 (Ye shes sde) 等译出藏文华严 (45品), 译自于阗本, 比汉译多出「如来华严品」「普贤宣说品」等2品\n- **梵本**：现存梵文华严仅为单品残本 (十地经·入法界品·普贤行愿赞等), 智俨 (602—668) 曾记录大慈恩寺所藏梵本的详细规格 (541叶·每叶55字·20行)\n\n### 1.2 印度根源：独立经典的独立生命\n\nPeter Skilling & Saerji (2013) 在《The Circulation of the Buddhāvataṃsaka in India》(ARIRIAB 16:193—216) 中证明：在印度, 华严经的各组成部分**从未作为大部《华严经》的一部分被引用**, 而是始终以独立经典的身份流传。这意味着「华严经」作为一个整体, 可能从未在印度存在过。\n\n构成华严经的四大印度独立经典：\n\n1. **《十地经》**(Daśabhūmika-sūtra) — 华严经中最古老的可辨识成分。大竹晋认为它必然早于华严经群中所有其他经典。该经在印度被独立广泛引用：龙树《十地毘婆沙论》是对它的注释; 《宝性论》也引用了它。现存梵文单行本 (P.L. Vaidya 校刊)。\n2. **《入法界品》**(Gaṇḍavyūha) — 华严经中最长的单品 (约占全经四分之一), 叙述善财童子五十三参。最古老的于阗发现的梵文写本 (Hodgson 2(A)) 末尾附有**于阗文题记**, 证明该写本产自于阗语环境。\n3. **《普贤行愿赞》**(Bhadracaryāpraṇidhāna) — 普贤十大愿的偈颂体文本, 常附于入法界品之末。独立梵文本存世。\n4. **《十地经论》/《菩萨地》**(Daśabhūmika-saṃgraha / Bodhisattvabhūmi) — 在梵文和藏文中均有广泛独立流传。\n\nSkilling & Saerji 的年表显示：从公元4世纪到9世纪, 华严经家族的经典在南亚持续被引用, 但始终以独立身份出现。寂天 (Śāntideva, 685—763) 在《集菩萨学论》中引用华严各品时, 仍使用独立经名而非「华严经某品」——这说明即便在8世纪, 华严经作为一个整体可能仍未在印度为人所知。\n\n### 1.3 于阗编纂说与学术争议\n\n**支持于阗为编纂地的关键证据：**\n\n(1) 文献证据：印度本土只有单品流传, 龙树《大智度论》及寂天《集菩萨学论》所引华严类经典均未超出少数零部。\n(2) 语言证据：梵本《树严经》及八十华严卷五十八中出现 \"ysa\" 一词, 属于**于阗文而非梵文**, 暗示最终编纂地在于阗。这是编纂者的「母语指纹」。\n(3) 结构风格：七处九会 (天上四处·人间三处) 的编排方式, 与印度其他大乘经典的丛书式结构风格迥异。\n(4) 地理线索：《菩萨住处品》指出文殊道场在「东北方清凉山」(即五台山), 透露该经形成地点离中国不远。\n(5) 皇家支持：Hamar (2021) 论证于阗在3—5世纪由皇家大规模赞助大乘经典, 为编纂提供了必要的物质基础。\n\n**主要反对意见：**\n\n- **石崎研 (Seok Gil-am, 2015)**：五点反驳——文献仅证明流通; 地理视野偏向西北印度; 阿毗达磨回应遍布全经 (4世纪中叶于阗已是大乘主导); 于阗佛教遗迹年代偏晚; 塔信仰在西北印度最盛。\n- **大竹晋 / 平川彰**：主张印度本土编纂, 认为文本中保留的某些特征更符合印度写经传统而非中亚编辑实践。\n- **Park, Hyunjin (2014)**：于阗说的主要依据只能证明于阗是**流通地**而非**编纂地**。\n\n**目前学术状态**：于阗编纂说仍为主流, 但印度西北编纂说获得越来越多支持。两种假说均承认华严经的各组成部分起源于印度, 最终的大本编纂发生在中亚或西北印度, 具体地点仍有争议。\n\n### 1.4 断代问题：何时编成？\n\n**下限 (Terminus ante quem)：420年以前** — 佛陀跋陀罗于418—420年完成六十华严的翻译, 底本由支法领从于阗取回。这说明「完整版」华严经的梵文底本必须在约400年以前已经存在。Divākara (日照, 680年抵长安) 后来带来 Gaṇḍavyūha 梵文写本, 与法藏一同校对旧译, 发现有**九个段落**在所有梵文写本中均存在但佛陀跋陀罗漏译了, 证实420年的底本已是固定内容的完整文本。\n\n**上限：约公元1—2世纪** — 最早的华严单品 (兜沙经, T600) 由支谶于178—189年译出, 说明其印度原型至少可追溯至公元1—2世纪。\n\n**学术共识**：核心编纂约在**3—4世纪**, 持续增补至5世纪。Britannica 称「最可能在4世纪以梵文编成」; Gimello (2005/1987) 定为「3世纪末或4世纪」。\n\n一个重要认识：华严经从未有过一个「定本」。从六十华严 (36,000偈) 到八十华严 (45,000偈) 再到藏译 (45品), 经典的内容和品目一直在扩展。\n\n---\n\n## 二、品目结构与版本对照\n\n### 2.1 七处九会：空间结构\n\n华严经的叙事以「七处九会」为框架——佛陀成道后, 于七处 (四处天上、三处人间) 共九次法会中宣说华严大法：\n\n| 会次 | 地点 | 场所 | 主要内容 |\n|------|------|------|---------|\n| 第一会 | 菩提场 | 世间净眼普严殿 | 如来依正因果——万行之本 |\n| 第二会 | 菩提场 | 普光明殿 | 信位——十信·十宽 |\n| 第三会 | 利天宫 | 须弥顶上 | 解位——十住·发行 |\n| 第四会 | 夜摩天宫 | 时分天宫 | 行位——十行·长养 |\n| 第五会 | 兜率天宫 | 他化自在天 | 回向位——十回向·拔济 |\n| 第六会 | 他化自在天 | — | 地位——十地·证修 |\n| 第七会 | 普光明殿 | — | 等妙二觉——因圆果满 |\n| 第八会 | 普光明殿 | — | 总说因果——二千行门 |\n| 第九会 | 逝多林 | 毗卢遮那庄严藏楼阁 | 入法界——善财五十三参 |\n\n法藏《华严经探玄记》以「七处」为华严经的空间结构, 澄观《华严经疏钞》进一步以「九会」配「五周因果」, 义理体系严密。\n\n### 2.2 五周因果：义理结构\n\n华严宗以「五周因果」统摄八十华严的品目结构, 信·解·行·证四位列配七处九会：\n\n| 周 | 位 | 品目范围 | 会 |\n|---|------|---------|---|\n| 第一周·所信因果周 | 信位 | 品1—12 (卷1—15) | 第一会·第二会 |\n| 第二周·差别因果周 | 解位 | 品13—22 (卷16—31) | 第三会·第四会 |\n| 第三周·平等因果周 | 回向位 | 品23—25 (卷32—39) | 第五会 |\n| 第四周·成行因果周 | 行位 | 品26—38 (卷40—59) | 第六会·第七会·第八会 |\n| 第五周·证入因果周 | 证位 | 品39 (卷60—80) | 第九会 |\n\n### 2.3 四译本品目对照表\n\n下表列示八十华严 (T279)、六十华严 (T278)、四十华严 (T1974) 与藏译 (Toh44, 45品) 的完整品目对应。藏译多出如来华严品与普贤宣说品二品。\n\n| 会 | 品次 | 八十华严 | 六十华严 | 四十华严 | 藏译(Toh44) |\n|---|------|---------|---------|---------|------------|\n| 第一会 | ① | 世主妙严品 | 卢舍那佛品(含) | — | 卢舍那佛品(含) |\n| | ② | 如来现相品 | (同上,合) | — | (分5章) |\n| | ③ | 普贤三昧品 | (同上) | — | (同) |\n| | ④ | 世界成就品 | (同上) | — | (同) |\n| | ⑤ | 华藏世界品 | (同上) | — | (分5章) |\n| | ⑥ | 毗卢遮那品 | 卢舍那佛品 | — | 卢舍那佛品 |\n| 第二会 | ⑦ | 如来名号品 | 如来名号品 | — | 如来名号品 |\n| | ⑧ | 四圣谛品 | 四圣谛品 | — | 四圣谛品 |\n| | ⑨ | 光明觉品 | 光明觉品 | — | 光明觉品 |\n| | ⑩ | 菩萨问明品 | 菩萨问明品 | — | 菩萨问明品 |\n| | ⑪ | 净行品 | 净行品 | — | 净行品 |\n| | ⑫ | 贤首品 | 贤首品 | — | 贤首品 |\n| 第三会 | ⑬ | 升忉利天宫品 | 忉利天宫品 | — | 忉利天宫品 |\n| | ⑭ | 忉利天宫偈赞品 | 忉利天宫偈赞品 | — | 忉利天宫偈赞品 |\n| | ⑮ | 十住品 | 十住品 | — | 十住品 |\n| | ⑯ | 梵行品 | 梵行品 | — | 梵行品 |\n| | ⑰ | 初发心功德品 | 初发心功德品 | — | 初发心功德品 |\n| | ⑱ | 明法品 | 明法品 | — 原理。\n版本对照：六十华严同名; 藏译同名。\n\n**⑧ 四圣谛品** (Catvāriāryasatyāni)\n以四圣谛 (苦·集·灭·道) 为框架, 宣说无量四谛法门, 每一世界各有不同的四谛体系。此品为声闻教法被大乘圆融吸收的典型范例。\n批注：印顺谓此品「说明大乘非离声闻乘而别有, 是即声闻乘而超越之」。\n\n**⑨ 光明觉品** (Prabhāvajra)\n以十首偈颂阐明佛光明照十方世界, 每一世界中各有佛菩萨的因果行愿, 显示「佛光普照」的华严核心观念。\n\n**⑩ 菩萨问明品** (Bodhisattvaparipṛcchā)\n文殊师利菩萨与十方诸大菩萨互相问答, 宣说十种甚深法界——不生不灭、不垢不净等, 开示「法界甚深」的空性义理。\n批注：法藏以此品为「解门之始」——从信入解, 以文殊妙智照见法界实相。\n\n**⑪ 净行品** (Vimalakarmaprabhāda)\n文殊答智首菩萨问, 宣说一百四十一愿门 (各版本数目略有不同), 菩萨于日常生活中的一切所作皆回向众生, 为华严「普贤行愿」的实践基础。\n批注：澄观以此品为「信位之总要」——十信位的核心即「净行」, 以愿力统摄一切修行。\n\n**⑫ 贤首品** (Bhadrakarman)\n贤首菩萨以十种比喻显示佛功德之不可思议, 广说如来十力·四无所畏·十八不共法等, 为信位的圆满总结。\n批注：海云继梦以此品为「信满入位」之标志——信位圆满, 即入初住。\n\n---\n\n## 四、第三会—第六会：解位（卷16-39, 品13-26）\n\n### 第三会：忉利天宫说——十住位（品13—18, 卷16—22）\n\n第三会佛陀上升忉利天宫 (Trāyastriṃśa), 宣说十住位法门——菩萨从初发心到安住不退的十个阶位。\n\n**⑬ 升忉利天宫品** (Trāyastriṃśārohaṇa)\n叙述佛陀升忉利天宫的过程与因缘, 以宝帐·华盖·音乐等庄严道场。\n版本对照：六十华严「忉利天宫品」; 藏译同名。\n\n**⑭ 忉利天宫偈赞品** (Gāthā)\n十方诸佛各以偈颂赞叹毗卢遮那佛的功德, 以一百二十一颂总赞如来依正因果。\n\n**⑮ 十住品** (Daśasthāna)\n宣说菩萨十住位——初发心住·治地住·修行住·生贵住·方便具足住·正心住·不退住·童真住·法王子住·灌顶住。此品为华严菩萨行位的次第纲目。\n批注：法藏《探玄记》详释十住各住所断惑·所证理·所修业; 印顺谓「十住位的特色, 在于以正观为核心」。\n\n**⑯ 梵行品** (Brahmavihāra)\n宣说梵行 (清净行) 的实相——一切法即虚空·幻·梦·影·响·焰·化, 菩萨于如是观中修习梵行, 为华严「即事而真」的实践典范。\n\n**⑰ 初发心功德品** (Prathamacittotpādaguṇa)\n广说初发心的功德——初发心时即摄一切佛法, 一念之中有不可说不可说初发心功德。此品为华严「初心即究竟」思想的集中表达。\n批注：方东美谓此品「把初发心的庄严与功德推到极致, 显示华严'因该果海、果彻因源'的圆融精神」。\n\n**⑱ 明法品** (Dharmapratibhāsa)\n明菩萨住位所行之法——以十波罗蜜为纲, 广说菩萨所应修习的一切法门。\n\n### 第四会：夜摩天宫说——十行位（品19—22, 卷23—27）\n\n第四会佛陀上升夜摩天宫 (Yaṃa), 宣说十行位法门——菩萨从欢喜行到真实行的实践阶位。\n\n**⑲ 升夜摩天宫品** (Yāmarohaṇa)\n叙述佛陀上升夜摩天宫的因缘, 以种种华盖·宝网·天乐庄严道场。\n\n**⑳ 夜摩天宫偈赞品** (Gāthā)\n十方菩萨以偈颂赞叹如来功德, 共一百一十一颂。\n\n**㉑ 十行品** (Daśakarmasthāna)\n宣说菩萨十行——欢喜行·饶益行·无瞋恨行·无尽行·离痴乱行·善现行·无著行·难得行·善法行·真实行。此品以「行」为核心, 强调菩萨于一切世间中广行利他。\n批注：澄观以此品为「解行相应」之关键——由解起行, 行满解深。\n\n**㉒ 十无尽藏品** (Daśākṣayadharmakoti)\n宣说十无尽藏——施·戒·忍·精进·禅·般若·方便·愿·力·智, 为菩萨十行的具体修学内容。\n\n### 第五会：兜率天宫说——十回向位（品23—25, 卷28—39）\n\n第五会佛陀上升兜率天宫 (Tuṣita), 宣说十回向位法门——菩萨以大悲心将一切功德回向众生与佛道。\n\n**㉓ 升兜率天宫品** (Tuṣitarohaṇa)\n叙述佛陀升兜率天宫的因缘与庄严。\n\n**㉔ 兜率天宫偈赞品** (Gāthā)\n十方菩萨以偈颂赞叹, 为回向位的序分。\n\n**㉕ 十回向品** (Daśapariṇāmanā)\n宣说菩萨十回向——救护一切众生离众生相回向·不坏回向·等一切佛回向·至一切处回向·无尽功德藏回向·随顺平等善根回向·随顺等观一切众生回向·真如相回向·无缚解脱回向·入法界无量回向。此品为华严经中最长的品目之一 (共35卷), 详述菩萨以大悲心统摄一切修行。\n批注：海云继梦以此品为「行位之总纲」——回向即是「以果地觉, 转化因地心」; 印顺谓「十回向位的核心是大悲, 与十行位的利他行互相发明」。\n\n### 第六会：他化自在天说——十地位（品26, 卷40—49）\n\n第六会佛陀于他化自在天 (Paranirmitavaśavartin) 宣说十地法门, 为华严菩萨行的最高阶位。\n\n**㉖ 十地品** (Daśabhūmika)\n华严经中最重要的品目之一, 宣说菩萨十地——欢喜地·离垢地·发光地·焰慧地·难胜地·现前地·远行地·不动地·善慧地·法云地。每一地各有三相：所得行·所对治·所满足。此品在印度曾作为独立经典广泛流传, 龙树《十地毘婆沙论》即是对它的注释。\n版本对照：六十华严同名; 藏译同名; 独立梵文本存世 (P.L. Vaidya 校刊)。\n批注：法藏《探玄记》以「六相圆融」释十地之义理结构; 澄观疏钞以「理事无碍」释每一地之断证; 方东美称十地品为「华严宗修行论的脊柱」。\n\n---\n\n## 五、第七会·第八会：行位（卷40-59, 品27-38）\n\n第七会为华严经中品目最多的会, 宣说十定·十通·十忍等广大法门, 为因圆果满的前导。第八会以离世间品总摄因果。\n\n### 第七会：普光明殿重说——因圆果满（品27—42, 卷50—59）\n\n**㉗ 十定品** (Daśasamādhi)\n宣说菩萨十种大三昧——普光大三昧·妙光大三昧·次第遍往诸佛国土大三昧等。此品**仅见于八十华严与藏译, 六十华严无此品**, 为编纂过程中增补的品目之一。\n\n**㉘ 十通品** (Daśabhijñā)\n宣说菩萨十种神通——天眼·天耳·知他心·宿住·天眼·漏尽等通, 以神通力广度众生。\n\n**㉙ 十忍品** (Daśakṣānti)\n宣说菩萨十种忍——音声忍·顺忍·无生法忍等, 为华严「忍」学的集中表达。\n\n**㉚ 阿僧祇品** (Asaṃkhyeya)\n宣说阿僧祇 (无量数) 的数量系统, 以「不可说不可说转」等极大数目显示佛功德的不可思议。\n\n**㉛ 如来寿量品** (Tathāgatāyus)\n阐明如来寿命无量——过去·现在·未来三世平等, 一切劫即一念, 一念即一切劫, 为华严「念劫圆融」的时间观。\n\n**㉜ 诸菩萨住处品** (Bodhisattvanivāsa)\n列出诸大菩萨的住处——文殊师利住「东北方清凉山」(五台山), 观世音住「南海补陀落迦」等, 为后来中国佛教圣地信仰的文献基础。\n\n**㉝ 佛不思议法品** (Tathāgatācintyadharmāṇāṃnirdeśa)\n广说佛之不思议法——佛身无量·佛土无量·佛力无量, 以二十种不思议法显示如来境界的超越性。\n\n**㉞ 如来十身相海品** (Daśakāyavarṇabhāsvara)\n详述如来十身——菩提身·愿身·化身·力持身·相好庄严身·威势身·意生身·福德身·法身·智身, 以九十七种大人相显示佛身的圆满庄严。\n\n**㉟ 如来随好光明功德品** (Raśmivarṇāṅgula)\n叙述如来随好光明的功德——每一随好光明普照十方世界, 令众生离苦得乐。\n\n**㊱ 普贤行品** (Samantabhadracaryā)\n普贤菩萨宣说十种大愿, 为华严「行门」的核心。此品与入法界品中的普贤十大愿王遥相呼应, 为华严行愿思想的集中表达。\n批注：澄观以此品为「行位之总结」——一切菩萨行以普贤大行为究竟。\n\n**㊲ 如来出现品** (Tathāgatotpattisaṃbhava)\n宣说如来出现的因缘——以十种无上因缘显示如来从因地到果地的全过程, 为「因圆果满」的总结。\n版本对照：六十华严名「如来兴显经」; 藏译「如来出现品」。\n\n### 第八会：普光明殿说——总摄因果（品43, 卷53—59）\n\n**㊳ 离世间品** (Lokottara)\n以毗卢遮那佛为主, 宣说二百个问答 (十波罗蜜 × 十善巧), 总摄从初发心到究竟成佛的一切法门。此品为华严经中「行门」的总纲, 以问答形式层层深入, 兼摄信·解·行·证四位。\n批注：法藏以此品为「行布圆融」的典型——行布 (次第) 与圆融 (即入) 在此品中得到最充分的展示。\n\n---\n\n## 六、第九会：证位（卷60-80, 品39）\n\n### 第九会：逝多林说——入法界（品39, 卷60—80）\n\n第九会为华严经的最终会, 佛陀于逝多林 (Jetavana) 毗卢遮那庄严藏楼阁中, 由毗卢遮那佛放光入楼阁门, 善财童子五十三参, 证入法界。\n\n**㊴ 入法界品** (Gaṇḍavyūha)\n华严经中最长的品目 (共21卷, 约占全经四分之一), 叙述善财童子 (Sudhana) 从文殊师利处发菩提心后, 依次参访五十三位善知识——从德云比丘到普贤菩萨, 最后证入毗卢遮那法界。\n\n此品是华严经中**最古老的独立经典之一**, 约成于公元200—300年, 后来被作为华严经的最终品目加入。现存梵文写本——最古老的于阗发现的 Gaṇḍavyūha 梵文写本 (Hodgson 2(A)) 末尾附有于阗文题记。四十华严 (T1974) 即般若 (Prajñā) 于798年所译的入法界品单行本。\n\n善财五十三参的结构是一个完整的修行地图：\n\n- **初参至十参** (德云比丘→解脱长者)：发心与信位\n- **十一参至二十参** (海幢比丘→不动优婆夷)：解位与住位\n- **二十一参至三十参** (正趣菩萨→大天)：行位与回向位\n- **三十一参至四十参** (安住地神→德生童子)：地位与等觉\n- **四十一参至五十三参** (慈氏童女→普贤菩萨)：证入法界\n\n最后, 善财参访普贤菩萨, 普贤以长行宣说「离普贤一毛孔中, 有不可说不可说一切佛刹」, 善财于一一毛孔中证入无量法界, 即身证得毗卢遮那法身。\n\n批注：海云继梦以此品为「华严的归宿」——全经从信到解、从解到行、从行到证, 最终以入法界品圆满; 方东美称此品为「哲学与宗教的最高统一——以生命实践完成宇宙真理的证入」; 印顺谓「入法界品的善财求法, 是大乘佛教修行论的集大成者」。\n\n---\n\n## 七、华严宗的形成与义学体系\n\n华严宗以《华严经》为根本经典, 经由五代祖师的阐发, 形成了中国佛教最具哲学深度的宗派之一。\n\n### 五祖传承\n\n1. **杜顺** (557—640)：华严宗初祖。著《华严五教止观》《华严法界观门》, 奠定华严观行体系的基础。以「法界观」为华严修行的总纲——真空观·理事无碍观·周遍含容观。\n\n2. **智俨** (602—668)：华严宗二祖。著《华严搜玄记》《华严孔目章》《华严五十要问答》, 首创「六相圆融」与「十玄门」的义理框架, 为华严宗的教理体系提供了系统化的理论支撑。曾记录大慈恩寺所藏梵本华严的详细规格 (541叶·每叶55字·20行)。\n\n3. **法藏** (643—712)：华严宗实际创立者。著《华严经探玄记》《华严一乘教义分齐章》《华严金狮子章》等, 完成华严宗的判教体系 (五教十宗), 建立「四法界」(事法界·理法界·理事无碍法界·事事无碍法界) 与「十玄缘起」的完整哲学体系。\n\n4. **澄观** (738—839)：华严宗四祖。著《华严经疏钞》(八十华严的完整注疏), 以「四法界」统摄全经, 提出「四法界观」(法界·理法界·理事无碍法界·事事无碍法界), 为华严义学的集大成者。\n\n5. **宗密** (780—841)：华严宗五祖。著《华严原人论》《禅源诸诠集都序》, 融通华严与禅宗, 主张「教禅一致」, 为华严宗在唐末的转型提供了新的理论框架。\n\n### 义学体系的核心概念\n\n- **法界缘起**：一切法互为缘起, 一法即一切法, 一切法即一法。\n- **四法界**：事法界·理法界·理事无碍法界·事事无碍法界, 为华严哲学的总纲。\n- **十玄门**：同时具足相应门·因陀罗网境界门·微细相容安立门等十门, 显示事事无碍的圆融境界。\n- **六相圆融**：总相·别相·同相·异相·成相·坏相, 一切法的六种面相互相圆融。\n- **五教判**：小教·始教·终教·顿教·圆教, 华严宗自判为「圆教」——一乘圆教, 统摄一切教法。\n\n---\n\n## 八、主要参考文献\n\n### 原典\n\n- 《大方广佛华严经》六十卷, 东晋佛陀跋陀罗译 (T278, CBETA)\n- 《大方广佛华严经》八十卷, 唐实叉难陀译 (T279, CBETA)\n- 《大方广佛华严经》四十卷, 唐般若译 (T1974, CBETA)\n- *Buddhāvataṃsakasūtra* (Toh44), 藏文大藏经\n- *Daśabhūmikasūtra*, P.L. Vaidya 校刊 (Buddhist Sanskrit Texts No.7)\n- *Gaṇḍavyūha*, Hodgson 梵文写本 (Hodgson 2(A))\n\n### 祖师注疏\n\n- 杜顺《华严五教止观》《华严法界观门》\n- 智俨《华严搜玄记》《华严孔目章》《华严五十要问答》\n- 法藏《华严经探玄记》《华严一乘教义分齐章》《华严金狮子章》\n- 澄观《华严经疏钞》(八十华严完整注疏)\n- 宗密《华严原人论》《禅源诸诠集都序》\n\n### 现代学术\n\n- 印顺《初期大乘佛教之起源与开展》第十三章「华严法门」\n- 方东美《华严宗哲学》\n- 木村清孝《初期中国华严思想の研究》(春秋社, 1977)\n- Jan Nattier, \"The Proto-History of the Buddhāvataṃsaka\" (ARIRIAB 8, 2005:323—360)\n- Imre Hamar, \"The History of the Buddhāvataṃsaka-sūtra\" in *Reflecting Mirrors* (2007:139—167)\n- Imre Hamar, \"The Buddhāvataṃsaka-sūtra in the History of Buddhism\" (2026)\n- Peter Skilling & Saerji, \"The Circulation of the Buddhāvataṃsaka in India\" (ARIRIAB 16, 2013:193—216)\n- Seok Gil-am, \"Was the Avataṃsaka Sūtra Compiled in Khotan?\" (Korean J. Buddhist Studies 42, 2015:83—112)\n- H.R. Park, \"The Differences and Editing Process of Chapter Divisions\" (IBK 62:2, 2014)\n- Ōtake Susumu, \"On the Origin of the Buddhāvataṃsaka\" in Hamar ed., *Reflecting Mirrors* (2007:87—108)\n- 堀晃, \"On the Structure and Format of the Tibetan Buddhāvataṃsakasūtra\" (Toyobunko, 2024)\n- Robert Gimello, \"Avataṃsaka Buddhism\" (1987/2005)\n- 海云继梦《华严经讲座》系列\n\n---\n\n*本篇基于 avatamsaka_studies.yaml 数据与上述文献综合而成, 版本对照以 CBETA 大正藏与 Toh44 藏文大藏经为准。*\n", "data_source": "", "data_pool": "practice", "back": {"tab": "gap", "view": "avatamsaka-studies", "label": "文献页 · 华严经学"}};

  var embed=(typeof _mdDocEmbed==='function')?_mdDocEmbed(a.doc_md||''):{html:'',toc:[]};

  // ── 面包屑 ──
  h+='<div style="font-size:0.74em;color:var(--text2);margin-bottom:12px;">';
  h+='<a href="../index.html" style="color:var(--blue);text-decoration:none">主页</a> › ';
  h+='<a href="index.html" style="color:var(--blue);text-decoration:none">独立文章目录</a>';
  if(a.back && a.back.tab){
    h+=' › <a href="../tabs/'+a.back.tab+'.html" style="color:var(--blue);text-decoration:none">'+a.back.label+'</a>';
  }
  h+='</div>';

  // ── 页头横幅 ──
  h+='<div style="background:linear-gradient(120deg,rgba(184,134,60,0.12),rgba(94,139,158,0.08));border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px;">';
  h+='  <div style="font-size:0.76em;color:var(--text2);letter-spacing:0.5px">📄 独立文章页</div>';
  h+='  <h2 style="color:var(--gold);margin:6px 0 4px">'+(a.icon?a.icon+' ':'')+a.title+'</h2>';
  if(a.title_sub)h+='  <div style="font-size:0.85em;color:var(--text2)">'+a.title_sub+'</div>';
  if(a.version)h+='  <div style="font-size:0.78em;color:var(--text2);margin-top:6px">'+a.version+'</div>';
  if(a.back && a.back.tab){
    h+='  <a href="../tabs/'+a.back.tab+'.html" style="font-size:0.75em;color:var(--blue);margin-top:10px;display:inline-block">← 返回 '+a.back.label+'</a>';
  }
  h+='</div>';

  // ── 导览 ──
  if(a.meta){
    h+='<div class="section" style="border-left:4px solid var(--gold)"><h2>📌 导览</h2>';
    h+='<p style="font-size:0.8em;line-height:1.9;white-space:pre-line">'+_mdInline(a.meta)+'</p></div>';
  }

  // ── 自动目录 ──
  if(embed.toc.length){
    h+='<div class="section"><h2>🧭 本文目录</h2>';
    h+='<div style="column-width:250px;column-gap:26px;font-size:0.8em;line-height:1.75">';
    embed.toc.forEach(function(t){
      var pad=(t.lv>2?'padding-left:'+((t.lv-2)*16)+'px;':'');
      h+='<div style="'+pad+'"><a href="#'+t.id+'" style="color:'+(t.lv===2?'var(--gold)':'var(--text2)')+';text-decoration:none">'+t.text+'</a></div>';
    });
    h+='</div></div>';
  }

  // ── 全文 ──
  h+='<div class="section" style="border-left:4px solid var(--gold)" id="article-full">';
  h+='<h2 style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px"><span>📄 '+a.title+' · 全文</span>'
    +'<button id="article-en-toggle" class="f-nav-btn" onclick="toggleArticleEN()" title="在「含英文批注」与「仅中文正文」之间切换显示">🌐 英文批注：显示</button></h2>';
  h+=embed.html;
  h+='</div>';

  // ── 页脚 ──
  h+='<div style="margin-top:18px;padding-top:10px;border-top:1px solid var(--line);font-size:0.74em;color:var(--text2)">';
  h+='<a href="index.html" style="color:var(--blue);text-decoration:none">📚 返回独立文章目录</a>';
  if(a.back && a.back.tab){
    h+=' · <a href="../tabs/'+a.back.tab+'.html" style="color:var(--blue);text-decoration:none">'+a.back.label+'</a>';
  }
  h+='</div>';

  root.innerHTML=h;

  // ── 阅读模式：识别「英文/术语批注」块，支持仅中文正文切换 ──
  _initArticleENMode();

  // ── 支持 #锚点 直达（目录跳转用真实 id 锚点）──
  if(location.hash){
    setTimeout(function(){
      var el=document.getElementById(location.hash.slice(1));
      if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    },80);
  }
}

if(document.readyState!=='loading'){renderArticle();}
else{document.addEventListener('DOMContentLoaded',renderArticle);}

// ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|🔑|术语格义|主题对读注|卷末批注)/.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);
  }
}
function _applyArticleENMode(){
  var full=document.getElementById('article-full');
  var btn=document.getElementById('article-en-toggle');
  var hide=(sessionStorage.getItem('article_en_hide')||'')==='1';
  if(full) full.classList.toggle('en-hidden', hide);
  if(btn) btn.textContent=hide?'🌐 英文批注：展开':'🌐 英文批注：显示';
}
</script>
</body>
</html>
