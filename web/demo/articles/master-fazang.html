<script>
var ARTICLE = {"id": "master-fazang", "file": "articles/master-fazang.html", "title": "法藏（贤首国师）", "title_sub": "华严祖师 · 华严三祖 · 实际创立者", "icon": "🧑", "version": "", "meta": "", "doc": "docs/法藏贤首国师全方位文献综述.md", "doc_md": "# 法藏（贤首国师，643–712）全方位文献综述\n\n> 整理日期：2026-08-20\n> 性质：以华严宗三祖、贤首宗实际创立者法藏为中心的全球文献综述——涵盖传记史料、著作全录、东亚传承谱系、汉语/日本/西方/韩国学界研究，以及佛教内部与当代修行界的传承、表述与讲法。\n> 方法论：所有书目与史实均经检索核实，随文标明出处；凡存疑或考订有异之处，一律以「考」字标注并存两说。本文为研究底稿，后续拟整合进 Demo 华严文献/法脉传承页面。\n\n---\n\n## 目录\n\n1. [法藏其人：生平、时代与历史地位](#一法藏其人生平时代与历史地位)\n2. [师承与法脉：从华严五祖到东亚诸系](#二师承与法脉从华严五祖到东亚诸系)\n3. [著作与文献全录](#三著作与文献全录)\n4. [核心教理思想](#四核心教理思想)\n5. [全球学术研究综述](#五全球学术研究综述)\n6. [佛教内部与修行界的传承、表述与讲法](#六佛教内部与修行界的传承表述与讲法)\n7. [一手传记史料举要](#七一手传记史料举要)\n8. [参考文献总表](#八参考文献总表)\n\n---\n\n## 一、法藏其人：生平、时代与历史地位\n\n### 1.1 基本信息\n\n- **法名**：法藏（Fǎzàng / Fa-tsang）\n- **字号**：字贤首（Xiánshǒu / Hsien-shou），故世称「贤首大师」；因俗姓康，又称**康法藏、康藏、康藏国师**。\n- **生卒**：唐贞观十七年（643）生于长安，唐先天元年（712）圆寂，世寿69岁。\n- **称号**：华严宗三祖；武则天赐号**贤首国师**，唐中宗赐别号**国一法师**（一说国一大师，见后述）。\n- **家世**：俗姓康氏，祖先为**康居国**（Sogdiana，中亚撒马尔罕一带）人。曾祖任康居国丞相，祖父时迁居长安，以康为姓。父康谧，唐朝赠左侍中（一说左卫中郎将）。（出处：崔致远《法藏和尚传》T50n2054；《宋高僧传》卷五）\n\n【考】康居国的具体范围，学界一般认同在唐代西域至中亚地区；国学分歧在于「康居」与「粟特」（Sogdiana）的关系——法藏家族属粟特康姓胡人的共识，见 Chen Jinhua 2007 与方立天 1991。陈金华在《Philosopher, Practitioner, Politician》（Brill, 2007）中，以专章考订法藏的粟特血统如何塑造其跨文化交流身份。\n\n### 1.2 生平要事\n\n| 时间 | 事件 | 出处 |\n|------|------|------|\n| 643（贞观十七年） | 生于长安 | 《宋高僧传》卷五；崔致远《法藏和尚传》 |\n| 约658–668 | 年十六师事**智俨**于云华寺（一说至相寺），尽得其学 | 同上 |\n| 668（总章元年） | 智俨入灭，法藏承其学统，与同门义湘（新罗）齐名 | 《宋高僧传》；魏道儒《中国华严宗通史》 |\n| 670（咸亨元年）前后 | 受命出家、剃度于云华寺；此后历任太原寺、大荐福寺、佛授记寺、崇福寺等 | 崔致远《法藏和尚传》 |\n| 680（永隆元年） | 与地婆诃罗（日照三藏）在长安补译六十《华严经·入法界品》阙文，法藏任笔受/证义 | 崔致远《法藏和尚传》；《华严经传记》 |\n| 695–699（证圣元年至圣历二年） | **实叉难陀译八十卷《华严经》**，法藏任笔受、证义，武则天亲制序 | 《宋高僧传》；IEP「Fazang」条 |\n| 约700（久视年间）前后 | 于洛阳长生殿为武则天讲《华严经》，以金师子为喻，门人录为**《华严经金师子章》** | 《华严经金师子章》题记；方立天《华严金师子章校释》 |\n| 705（神龙元年） | 中宗复位，法藏受中宗、睿宗礼敬，为授菩萨戒 | 《宋高僧传》；Chen Jinhua 2007 |\n| 712（先天元年） | 十一月十四日（一说）圆寂于大荐福寺，葬长安神禾原华严寺（少陵原）南 | 《宋高僧传》；灵隐寺纪念文 |\n\n### 1.3 与皇权政治：武周佛教的「国师」\n\n法藏一生恰逢武周鼎盛期，是唐代政治佛教（politicized Buddhism）最典型的僧侣之一。陈金华在《Philosopher, Practitioner, Politician: The Many Lives of Fazang (643–712)》（Leiden: Brill, 2007）一书标题即概括其三重面相——**哲学家、修行者、政治家**。要点如下：\n\n- **译经与政治合法化**：八十《华严经》译成于武周定鼎之时，为武则天「转轮圣王」「菩萨应身」的政治叙事提供了经典依据（IEP「Fazang」条；Chen Jinhua 2007）。\n- **金师子章**：应武则天请，于洛阳长生殿以金狮子像讲解「无尽缘起」「事事无碍」，后由弟子整理成文（T1881）。\n- **镜殿教学法**：据《法藏和尚传》等记载，法藏为武则天建「镜殿」——八方上下置十面铜镜，中置佛像、燃烛，交光互影、重重无尽，以直观演示华严「十玄门」「相即相入」之理。这一做法被今人称为中国最早的「装置化」教理演示之一（Hamar ed. 2007 前言；Chen Jinhua 2007）。\n- **学界专论**：Chen Jinhua, \"More Than a Philosopher: Fazang (643-712) as a Politician and Miracle-worker,\" *History of Religions* 42.4 (2003): 320–358；陈金华《舍利与王权——武后对佛舍利的政治利用》，陆辰叶译，《汉语佛学评论》第5辑（上海古籍出版社，2017），pp.3–75。\n- 西方政治史学视角另见：Antonino Forte 对武周政治宣传的研究（*Political Propaganda and Ideology in China at the End of the Seventh Century*, 1976/2005），其中对法藏政治角色的论述被广泛征引。\n\n【考】「法藏参与华严三译」为常见俗说。实际：六十卷（418–422，佛驮跋陀罗译）早于法藏出生；八十卷（695–699）法藏任笔受/证义属实；四十卷《华严经》（795–796，般若译）时法藏已圆寂，**并未参与**。此点须在页面表述时更正。（出处：Gregory, *Tsung-mi and the Sinification of Buddhism*, 1991, pp.9, 62；Hamar 2007）\n\n### 1.4 历史地位\n\n法藏被普遍视为**华严宗的实际上创建者与系统化者**（the systematizer），尽管谱系上列为三祖（Britannica「Fazang」条；SEP「Huayan Buddhism」条）。其功绩在于：\n\n1. 完成**华严教学体系的集大成**：将杜顺、智俨的零散教义整合为「五教十宗」「十玄门」「六相圆融」「四法界」「法界缘起」的完整教观体系。\n2. 参与**译经**：补译六十华严入法界品阙文、任八十华严笔受证义。\n3. 开创**判教与宗派自觉**：以《华严一乘教义分齐章》（五教章）建立华严自宗判教，与天台判教抗衡。\n4. 其学统经澄观、宗密延续为「贤首宗」，并传入朝鲜（海东华严）与日本（东大寺华严）。\n\n### 1.5 法藏与同时代人物关系图谱\n\n> 本节按「佛门 / 政权 / 儒道 / 家族」四类，系统梳理法藏与同时代人物的人际网络。凡史料无直接记载者，以「【考】」标注或明言「无直接交游记载」，不臆补。\n\n#### ① 佛门中人（师门·同参·译场·律门）\n\n| 人物 | 关系 | 事实要点 | 出处 |\n|------|------|---------|------|\n| 智俨（602–668） | 亲师 | 法藏年十六师事智俨，尽得「六相十玄」之学；智俨临终将法藏托付道成、薄尘 | 崔致远《法藏和尚传》T2054；《宋高僧传》卷五 |\n| 义湘（625–702） | 同门 | 同为智俨弟子，归新罗开海东华严；法藏致书（《寄海东书》）并赠《探玄记》《一乘教分记》 | 崔致远传；Forte 2000；义天《圆宗文类》 |\n| 道成、薄尘 | 同门·度师 | 受智俨托付护持法藏；后连状荐举，度为沙弥，令隶属太原寺 | 《中国佛教人物》法藏条（引《五祖略记》）；崔致远传 |\n| 慧苑 | 嗣法弟子 | 续成《华严经传记》，著《华严经刊定记》；对师说「三时判教」有修正，世称「慧苑异议」 | 《宋高僧传》卷五；王颂2017 |\n| 宗一 | 弟子 | 续成法藏未竟之《新华严经略疏》20卷 | 崔致远传 |\n| 惠英 | 弟子 | 与慧苑同续《华严经传记》 | 王颂2017 |\n| 宏观、文超、智光 | 弟子 | 中宗诏书赞法藏「慈云掩荫，法雨含滋」；敕集百法师祷雨，七日甘霖 | 祈雨/译场 | 灵隐寺纪念文；崔致远传 |\n| 710（景云元年） | 睿宗从法藏受菩萨戒 | 戒师 | 中华典藏；灵隐寺纪念文 |\n| 712（先天元年） | 法藏于长安大荐福寺圆寂，世寿70（一说69）；葬于神禾原华严寺南；玄宗赠鸿胪卿、绢1200匹，妃主公主礼忏施舍 | 圆寂 | 崔致远传；灵隐寺纪念文；《宋高僧传》 |\n\n【注】以上关系图谱与编年主要依据崔致远《法藏和尚传》（T2054）、《宋高僧传》（T2061）、《开元释教录》卷九、《释氏稽古略》卷三、《中国佛教人物》（黄忏华撰）及 Chen Jinhua 2007、Forte 2000 等现代考订；凡传说性细节（燃指、梦日、地动、祈雨）均另标出处，存疑处以「【考】」注明。本节可整合进 Demo Tab1 法脉传承页，作为法藏人物节点的「关系网」与「大事年表」侧栏。\n\n## 二、师承与法脉：从华严五祖到东亚诸系\n\n### 2.1 华严五祖体系\n\n| 世系 | 人物 | 生卒 | 主要贡献 |\n|------|------|------|----------|\n| 初祖 | 杜顺（法顺） | 557–640 | 传《法界观》《五教止观》（传承性止观） |\n| 二祖 | 智俨 | 602–668 | 著《华严经搜玄记》，建立「十玄」「六相」雏形 |\n| **三祖** | **法藏（贤首）** | **643–712** | 集大成，著《探玄记》《五教章》《金师子章》 |\n| 四祖 | 澄观（清凉） | 738–839 | 著《华严经疏》《随疏演义钞》，融合华严与禅 |\n| 五祖 | 宗密（圭峰） | 780–841 | 著《原人论》《禅源诸诠集都序》，华严禅之完成者 |\n\n（出处：鎌田茂雄《华严の思想》第2章；魏道儒《中国华严宗通史》）\n\n【注】「五祖」体系为后人追认（参见 Gimello 1976 对法藏史传写作的分析），现代学术视为宗派建构的产物，但对理解法藏之传承位置仍具枢纽意义。\n\n### 2.2 法藏的师承与同门\n\n- **师承**：法藏十六岁师事智俨，尽得其「六相」「十玄」之学；智俨之学上承杜顺。法藏虽居三祖位，实则承担了「把智俨的教学纲领展开为体系性教义」的工作（SEP「Huayan Buddhism」；Gimello 1976）。\n- **同门·义湘（625–702）**：新罗僧人义湘与法藏同为智俨弟子，归国后开**海东华严（新罗华严）**之端，住浮石寺，著《华严一乘法界图》。法藏曾致书义湘（《寄海东书》）并赠《探玄记》《一乘教分记》等章疏（义天《圆宗文类》残卷；Forte 2000；崔致远《法藏和尚传》）。\n\n### 2.3 法藏的弟子与后学\n\n- **慧苑**：法藏嗣法弟子，著《华严经刊定记》《华严经音义》，然对师说（如「三时判教」）有所修正，后世有「慧苑异议」之说，亦因此未列入祖位（学术讨论见 Nhuir 博论：佛教宗派内部思想歧异——以华严宗慧苑与澄观为例）。\n- **宗一**：续成法藏未竟之《新华严经略疏》20卷。\n- **惠英**：与慧苑同续《华严经传记》（考订见王颂论文，见下）。\n\n### 2.4 海东（韩国）华严\n\n- **义湘**与法藏为同门，其《一乘法界图》与法藏《金师子章》构成华严「教」与「观」的东西两翼。\n- **均如（923–973）**：高丽僧，著**《释华严教分记圆通钞》十卷**（法藏《五教章》的现存最早注疏）、《释探玄记圆通钞》28卷（佚）、《华严经三宝章圆通记》等，几乎囊括对法藏、智俨著作的注释。其书于海印寺藏经阁发现，经金知见整理为《均如大师华严学全书》（CBETA著录）。均如所见《五教章》本文与宋本有异，对法藏原著校勘具关键价值。又据道津綾乃 2020，T1874《华严经明法品内立三宝章》本文或即均如撰（详见3.4疑伪节）。【考】\n- **义天（1055–1101）**：高丽王子僧，1085–1086入宋，从杭州慧因寺（高丽寺）净源学华严，编《新编诸宗教藏总录》《圆宗文类》（残存3卷，CBETA X1015）。朴鎔辰2018年论文指出其卷十四《诸文行位类》即采法藏《探玄记》。\n- 当代韩国研究：高翊晋《韩国华严思想研究》（东国大学佛教文化研究所）等。\n\n### 2.5 日本华严（Kegon）\n\n- **东传路线**：《华严经》于养老六年（722）首次书写；天平八年（736）唐律师**道璿**携华严章疏入日（【考】传华严入日者为道璿而非鉴真，鉴真属律宗）。\n- **审祥（Shinshō）**：新罗僧，入唐从法藏学法，后于东大寺开讲《华严经》，为日本讲华严第一人、日本华严初祖；传良辨（689–773）。圣武天皇敕建东大寺（大华严寺）。\n- **镰仓二巨匠**：\n  - **凝然（1240–1321）**：东大寺戒坛院住持，著《五教章通路记》52卷，系统整理华严教学。\n  - **明惠（高辨，1173–1232）**：高山寺开基，弘「华严十重唯识」观。\n- 东大寺系（尊胜院）与高山寺系构成日本华严两大传统。\n\n### 2.6 近现代中国大陆与台湾的复兴\n\n- **月霞系（民国华严复兴）**：月霞（1858–1917，一说1861–1918）1913年于上海哈同花园设**华严大学**，1917年任常熟兴福寺住持并迁学入寺。门人有持松、常惺（著《贤首概要》）、慈舟、智光等，形成近代贤首宗复兴的主流谱系。（【考】月霞生卒两说并存，兹并列。）\n- **华严莲社系（台湾）**：1952年智光、南亭、成一于台北创社；成一1972年接任住持，1975年创办**华严专宗学院**；贤度为现任董事长/院长。此系承智光—南亭—成一之月霞谱系。\n- **大华严寺·海云继梦**：海云继梦（1950生），自称**贤首宗42世**（高原法系18世）、临济宗47世，师承梦参、钦因，南投大华严寺创办人，当代台湾最活跃的华严弘传体系之一。其讲记包括《华严经探玄记》悬谈系列、《贤首五教仪讲记》《华严金师子章讲记》（2010）、《华严学导论》（2009）等。\n- **祖庭现状**：西安华严寺（少陵原）存杜顺塔与澄观塔（2006年列为第六批全国重点文物保护单位，2009年启动重建）；法藏塔今不存。终南山华严寺另有镜殿之复原小殿（见 Hamar 2007 前言）。\n\n---\n\n## 三、著作与文献全录\n\n> 编号以 CBETA / deerpark.app 现行登记为准（法藏·唐名下共 **27 部**：大正藏 22 部 + 卍续藏 5 部）。另有同名「法藏（明）」著作（如《三峰藏和尚语录》），勿混。\n\n### 3.1 大正藏所收（22部）\n\n| # | 书名 | 卷数 | 藏经号 | 内容概要 |\n|---|------|------|--------|----------|\n| 1 | 《般若波罗蜜多心经略疏》 | 1 | T1712 | 心经注疏，贤首晚年（约702）之作 |\n| 2 | 《华严经探玄记》 | 20 | T1733 | 《六十华严》体系性注疏，法藏判教与法界缘起学说之成熟表述 |\n| 3 | 《花严经文义纲目》 | 1 | T1734 | 华严经文义门目之纲要 |\n| 4 | 《入楞伽心玄义》 | 1 | T1790 | 《入楞伽经》要义诠释 |\n| 5 | 《梵网经菩萨戒本疏》 | 6 | T1813 | 《梵网经》戒本疏释，律与华严会通 |\n| 6 | 《十二门论宗致义记》 | 2 | T1826 | 龙树《十二门论》注疏，体现与中观的交涉 |\n| 7 | 《大乘法界无差别论疏》 | 1 | T1838 | 论疏，法界缘起之学 |\n| 8 | 《大乘起信论义记》 | 3 | T1846 | 起信论最权威注疏之一 |\n| 9 | 《大乘起信论义记别记》 | 1 | T1847 | 义记之别记 |\n| 10 | 《华严一乘教义分齐章》（五教章） | 4 | T1866 | 五教十宗判教之总纲，法藏代表作 |\n| 11 | 《华严经旨归》 | 1 | T1871 | 华严经十门义旨之归趣 |\n| 12 | 《华严策林》 | 1 | T1872 | 策问体，六门问答 |\n| 13 | 《华严经问答》 | 2 | T1873 | 设问答明华严义 |\n| 14 | 《华严经明法品内立三宝章》 | 2 | T1874 | 三宝、流转、法界缘起、圆音、法身、十世、玄义七门 |\n| 15 | 《华严经义海百门》 | 1 | T1875 | 十门、一百个义门，缘起观之密集论说 |\n| 16 | 《修华严奥旨妄尽还源观》 | 1 | T1876 | 六门观法（显一体、起二用、示三遍、行四德、入五止、起六观） |\n| 17 | 《华严游心法界记》 | 1 | T1877 | 五门观法 |\n| 18 | 《华严发菩提心章》 | 1 | T1878 | 发心、简教、显过、表德四章；表德章全引杜顺《法界观》文 |\n| 19 | 《华严经关脉义记》 | 1 | T1879a | 华严经义脉之记释（【考】大正藏题法藏，学界或考为弟子文超撰） |\n| 20 | 《金师子章云间类解》 | 1 | T1880 | 法藏述、宋·净源解 |\n| 21 | 《华严经金师子章注》 | 1 | T1881 | 法藏撰、宋·承迁注 |\n| 22 | 《华严经传记》 | 5 | T2073 | 华严经流传与感应之史传（【考】续成/非亲撰问题，见下） |\n\n### 3.2 卍续藏所收（5部）\n\n| 书名 | 卷数 | 藏经号 | 说明 |\n|------|------|--------|------|\n| 《大乘密严经疏》 | 4（第一卷佚，存3） | X0368 | 地婆诃罗译《密严经》之疏 |\n| 《般若心经略疏显正记》 | 3 | X0531 | 「唐·法藏疏，宋·仲希记」 |\n| 《大乘起信论疏略》 | 2 | X0765 | 「法藏造疏、明·德清（憨山）纂略」 |\n| 《止观科节》 | 1 | X0917 | 题法藏，归属存疑 |\n| 《华严经普贤观行法门》 | 1 | X0991 | 普贤观十门止观+普贤行（有元禄元年1688序） |\n\n### 3.3 藏外 / 散佚之作\n\n据崔致远《法藏和尚传》（T2054）与历代著录：\n\n- **《华严三昧章》/《华严三昧观》**：杨仁山1900年由南条文雄得自高丽古写本，金陵刻经处校刻流布。（详考见「疑伪」节）\n- **《新华严经略疏》12卷**（未竟稿）：门人宗一续20卷、慧苑续16卷；另有《新华严经序注》1卷。\n- 佚失：**《楞伽经疏》7卷**、**《法华经疏》7卷**、《华严翻梵语》、《华严梵语及音义》等。\n\n### 3.4 疑伪与著作归属问题（重点）\n\n1. **《华严经传记》T2073**：王颂《华严经传记考：年代·撰者·史源》（2017年首届佛教史论坛）主张：法藏生前已有门人协助集撰、〈智俨传〉非法藏亲撰、门人慧苑、惠英续成；陈金华评议则提出〈纂灵记〉或为法藏草稿。\n2. **《修华严奥旨妄尽还源观》T1876**：宋代已有著作权之争——孤山智圆归于杜顺，宋·净源撰校勘记力主法藏撰（《大正藏》卷末附净源记）。\n3. **《华严三昧章》与《华严发菩提心章》T1878**：T1878凡例（梅尾南都诸本参订）谓世传〈三昧章〉「文大同此章」，疑为「后学误以今章残编为三昧章」；而杨仁山《遗书》与南条文雄往来书牍记载另一说——法藏另有《华严三昧观》，崔致远传已用其「直心中十心名目」；1900年南条文雄自高丽访得题名《华严三昧章》之古写本，经杨仁山覆书判定「与菩提心章同而阙法界观之文，二书同出一本，即华严三昧观无疑」，金陵刻经处校刻流布。即：**传世〈三昧章〉与〈发菩提心章〉同源于《华严三昧观》**，二者非相互对立的伪作。\n4. **《华严经关脉义记》T1879a**：现代研究（如平燕红等）多考为法藏弟子**文超**撰。\n5. **《止观科节》X0917**：归属证据薄弱，宜注「存疑」。\n6. **《华严游心法界记》T1877**：作者归属存在争议（见 Nicholaos Jones \"Fazang 法藏 Website\" 所引 Liefke & Plassen 文；其内容与杜顺《华严五教止观》T1867 多相重叠，后者有 Cleary 1983, pp.45–68 全译，相关讨论见 *The Review of Korean Studies* 23.1 (2020)，DOI 10.25024/review.2020.23.1.35）。\n7. **《华严经明法品内立三宝章》T1874**：大正藏题法藏撰（T45n1874，题「魏国西寺沙门法藏述」），然 Jones 网站引道津綾乃（Dōtsu Ayano）《華厳経明法品内三宝章の諸本》*印度学仏教学研究* 68.2 (2020): 686–692（DOI 10.4259/ibk.68.2_686），主张本文作者或为高丽僧**均如（Kyunyŏ）**——均如另著《华严经三宝章圆通记》注疏此章。此说若成立，T1874 当移入海东华严著作之列。【考】\n\n### 3.5 现代校释与整理本\n\n| 书 | 编者 | 出版 | 说明 |\n|----|------|------|------|\n| 《华严金师子章校释》 | 方立天 | 中华书局 1983年9月 | 中国佛教典籍选刊，ISBN 9787101000535 |\n| 《华严金师子章今译》 | 方立天 | 巴蜀书社 1990 | — |\n| 《华严金师子章》（释译） | 方立天 | 台北·佛光文化 1996 | 中国佛教经典宝藏系列 |\n| 《法藏》 | 方立天 | 台北·东大图书 1991 | 世界哲学家丛书，附年表索引 |\n| 《法藏评传》 | 方立天 | 京华出版社 1995 | — |\n| 《中国佛教思想资料选编》第二卷（隋唐五代） | 石峻、楼宇烈、方立天等编 | 中华书局 | 收法藏重要著作选辑（义海百门、金师子章、还源观等）；2014年全集本10卷 |\n| 866）。\n- **当代分析重构**：Nicholaos Jones, \"The Architecture of Fazang's Six Characteristics,\" *British Journal for the History of Philosophy* 27.3 (2019): 468–491；Seunghak Koh, \"The Huayan Philosophers Fazang and Li Tongxuan on the 'Six Marks' and the 'Sphere of Edification,'\" *The Eastern Buddhist* 46.2 (2015): 1–18。\n\n### 4.5 法界缘起与性起\n\n- 华严以「法界缘起」（Dharma-dhātu dependent origination）替代唯识「赖耶缘起」、中观「性空缘起」。\n- 「性起」（nature-arising, 起必性起）源于智俨，法藏系统发挥——一切诸法皆从「法性」本来具足中升起，不需外缘；此与天台「性具」相映成趣。\n- **学术研究**：Imre Hamar, \"Nature Origination in Huayan Exegesis,\" *BEFEO* 94 (2007)：33–50；廖明活《华严宗性起思想的形成》（《中国文哲研究集刊》第6期，1995）。\n\n### 4.6 三性思想\n\n- 法藏以如来藏/真如为体，融通唯识三性（遍计所执、依他起、圆成实）为「三性同异义」——遍计性当体即空，依他性从缘起无性，圆成性即真如。三性相互融摄，圆成实与依他起非一非异。\n- **学术研究**：Liu Ming-Wood, \"The Three-Nature Doctrine and Its Interpretation in Hua-Yen Buddhism,\" *T'oung Pao* 68.4/5 (1982): 181–220；《法藏三性思想研究》博论（2002，NDLTD收录）；Whalen Lai 相关论述。\n\n### 4.7 与唯识、中观、天台的关系\n\n- **对唯识的批判与融摄**：Whalen Lai, \"The Defeat of Vijñāptimātratā in China: Fa-tsang on Fa-hsing and Fa-hsiang,\" *Journal of Chinese Philosophy* 13 (1986): 1–19——法藏以「性宗」（法性宗）判摄唯识「相宗」（法相宗），此一判释模式对后世影响深远。\n- **对中观的会通**：《十二门论宗致义记》（T1826）、《华严游心法界记》体现法藏对中观「二谛」的华严化处理（Whalen Lai, \"Nonduality of the Two Truths in Sinitic Mādhyamika,\" *JIABS* 2.2 (1979)）。\n- **与天台的判教对峙**：五教章「别教一乘/同教一乘」之判引发两宗长期争论（许瑞菁博论；Chan Ju Mun, *The History of Doctrinal Classification in Chinese Buddhism*, Ph.D. Wisconsin, 2002）。\n- **起信论诠释**：《大乘起信论义记》（T1846）以「一心开二门」「真如/生灭」结构奠立华严「性起」之理论根基，是东亚如来藏思想最重要的注疏之一。\n\n### 4.8 修行论\n\n- **《修华严奥旨妄尽还源观》**（T1876）：「显一体（自性清净圆明体）、起二用（海印森罗常住用、法界圆明自在用）、示三遍、行四德、入五止、起六观」，是华严观行的纲要文本，宋以来亦有净源之校勘、智圆之争议。\n- **《华严经义海百门》**（T1875）、**《华严游心法界记》**（T1877）、**《华严策林》**（T1872）：以问答/策论体展开法界缘起观。\n- **《华严经普贤观行法门》**（X0991）：普贤观十门止观。\n\n---\n\n## 五、全球学术研究综述\n\n### 5.1 汉语学界（大陆·台湾·香港）\n\n**通史与专论**\n\n| 书目 | 版本 | 说明 |\n|------|------|------|\n| 魏道儒《中国华严宗通史》 | 江苏古籍出版社1998；凤凰出版社2008再版；空庭书苑2007繁体修订版 | 中国大陆华严研究代表作 |\n| 方立天《法藏》 | 台北·东大图书1991 | 附年表索引 |\n| 方立天《法藏评传》 | 京华出版社1995 | — |\n| 汤用彤《隋唐佛教史稿》 Sōuxuán jì and the Origins of Huayan Hermeneutics,\" *Acta Koreana* 18.2 (2015): 487–516。\n\n### 5.5 当代哲学诠释（分析哲学·过程哲学·比较哲学）\n\n英语哲学界近年兴起对法藏的「分析重构」传统：\n\n- **Nicholaos Jones**：《Fazang's Total Power Mereology》*JCP* (2009)；《The Architecture of Fazang's Six Characteristics》*BJHP* 27.3 (2019)；《Interpreting Interdependence in Fazang's Metaphysics》*JEAP* 2 (2022)；《Prolegomenon for Fazang's Essay on the Golden Lion》*BJHP* 33.1 (2024)；*Metaphors for Interdependence: Fazang's Buddhist Metaphysics*（Oxford University Press, 2025-06-06）。\n\n> **★ 重点推荐：Fazang 法藏 Website**（Nicholaos Jones 主持，University of Alabama in Huntsville）\n> 网址：https://sites.google.com/view/fazang/home（另有 v1.0 离线 PDF 版可下载）\n> 性质：**英语学界最完整、最系统的法藏专题文献库**，五页结构：Home / Fazang's Writings / Secondary Sources / Key Teachings / Influences。\n> - **Writings**：逐部著录法藏著作的 T/X 号，并逐部列出全部英译（如金师子章 T1881 收 Fung 1952、de Bary 1960、Chan 1963、Chang 1971、Van Norden 2014、Wong 2016、Johnson 2020 七种译本）；并设「Questionable Attribution」栏，处理 T1874（疑为均如撰）、T1877（与杜顺《五教止观》关系）等归属问题。\n> - **Secondary Sources**：按「专著」「学位论文」两栏整理英语学界全部法藏研究书目，收有 King 1975、Lai 1975、Oh 1976、Gimello 1976、Liu 1979、Nakasone 1980、de Vries 2024 等博士论文。\n> - **Key Teachings**：以主题为纲（相入相即、一心二门、三性、五教、六相），每条附法藏原典出处（T45.1866/T1874/T1881 等）与最新研究文献。\n> - **Influences**：梳理法藏思想来源（龙树、世亲、众贤、鸠摩罗什、佛陀跋陀罗、慧远、智顗、玄奘、智俨、元晓、义湘、实叉难陀），每条附中译本与英译本链接。\n> 本综述 3.6 译本表与 5.3 西文书目已与该网站逐条对勘合并。\n- **Ricki Bliss**：华严 mereology/整体论研究。\n- **过程哲学比较**：Odin 1982；Dale S. Wright, *Emptiness and Paradox in the Thought of Fa-tsang*（Ph.D. Iowa, 1980）；Bong-Choul Hwang（1994）；近年仍有续作（Shahideh 2021, M.A.）。\n- **Graham Priest**：《The Golden Lion》in *The Fifth Corner of Four*（Oxford, 2018）——以四角逻辑分析金师子章。\n- **Ronald Y. Nakasone**：*The Huan-Yuan-Kuan: A Study of the Hua-yen Interpretation of Pratītyasamutpāda*（Ph.D. Wisconsin, 1980）——妄尽还源观专论（含全译）；新著 *Mapping the Pathways of Huayan Buddhist Thought: Its Origins, Unfolding, and Relevance*（Peter Lang, 2022）。\n- **Dirck Vorenkamp**：*Hua-yen Buddhism: Faith and Time in Fa-tsang's Thought*（Ph.D. Wisconsin, 1997）。\n- **Alex Owens**：《Inventing Indra's Net》（Ph.D. Lancaster, 2022）——「因陀罗网」作为20世纪建构隐喻之谱系学研究，对 Eliot、铃木大拙、Watts、Capra、Cook 五位关键作者的分析。\n- **当代比较**：Zheng Liu, \"When Merleau-Ponty Encounters Fazang,\" *Religions* 16.11 (2025)；Jinsub Song 华严伦理与AI伦理（Ph.D. 2024）；Weiyu Lin 探玄记导论（M.A. UBC, 2021）。\n\n---\n\n## 六、佛教内部与修行界的传承、表述与讲法\n\n### 6.1 历史传承中的表述\n\n- **法藏自述与史传**：《华严经传记》（T2073）为华严宗「自我呈现」的基础文献；崔致远《法藏和尚传》（T2054）按「十心」体例（族姓、游学、削染、讲演、传译、著述、修身、济俗、通智、垂范）系统叙述法藏言行成就。\n- **华严宗内的正统表述**：澄观《华严经疏》《随疏演义钞》以法藏之学为基底；宗密《禅源诸诠集都序》《原人论》承法藏判教而归于「华严禅」。\n- **日本华严表述**：凝然《八宗纲要》《五教章通路记》整理法藏教学；明惠以「十重唯识」圆融观行。\n- **韩国华严表述**：均如《释华严教分记圆通钞》以华严「教法」注疏法藏；义天《圆宗文类》辑录法藏章疏。\n\n### 6.2 当代讲法资源（讲经·讲记·网络课程）\n\n| 法师/机构 | 资源 | 说明 |\n|-----------|------|------|\n| **海云继梦法师**（贤首宗42世，大华严寺） | 《华严经探玄记》悬谈讲记（一）–（四）（空庭书苑2006）、《贤首五教仪讲记》（2006）、《华严金师子章讲记》（2010）、《华严学导论》（2009）、《华严经导读》（2006）、《华严玄谈》（圆明出版社1996） | 当代对法藏《探玄记》/五教章进行系统讲说的最完整体系之一 |\n| **净空法师** | 《修华严奥旨妄尽还源观讲记》（上下册） | 对法藏观门文本的当代讲说 |\n| **体佛法师**（贤首禅苑） | 《妄尽还源观》视频/讲记 | 观行文本的实修导向讲说 |\n| **贤度法师**（华严莲社/华严专宗学院） | 《华严学讲义》《新修华严经疏钞》等著作集 | 台湾华严专宗教学 |\n| **月霞系/华严专宗学院** | 贤首宗教学传统 | 近代以来延续的法藏教学研习 |\n\n【考】成观法师、济群法师、慧光法师等是否系统讲授法藏著作，检索未见明确文献；济群法师之学修以唯识、菩提道次第为主（其对《辩中边论》「先共后不共」的处理见三十七道品综述）。凡未证实者不列入上表。\n\n### 6.3 修行界对法藏著作的研习（其他宗派视角）\n\n- **禅宗**：法藏思想经澄观、宗密传入禅门，形成「华严禅」传统（吉津宜英《華嚴禪の思想史的研究》）；当代曹洞宗修证义与华严「事事无碍」的会通亦多引法藏。\n- **天台/唯识**：判教对峙之外，法藏《起信论义记》《梵网经菩萨戒本疏》为跨宗派研习对象。\n- **藏传视角**（参考）：华严「性起」与如来藏思想在噶举/宁玛的会通是当代比较佛教课题，但法藏原典在藏传系统并无直接译介，须明确区分。\n\n---\n\n## 七、一手传记史料举要\n\n| 史料 | 藏经号 | 性质 |\n|------|--------|------|\n| 崔致远《唐大荐福寺故寺主翻经大德法藏和尚传》 | T2054（卍续藏一三四册） | 新罗文人崔致远撰（904），最详尽的一手传记，按「十心」十义体例 |\n| 赞宁《宋高僧传》卷五〈法藏传〉 | T2061 | 北宋官修传记 |\n| 志磐《佛祖统纪》卷二十九 | T2035 | 南宋天台立场之史传（对法藏有宗派性评价） |\n| 《华严经传记》 | T2073 | 法藏主持编纂（门人续成）之华严感应/流传史 |\n| 阎朝隐《大唐荐福寺故大德康藏法师之碑》（碑文） | 见 T2054 附录著录 | 同时代碑铭（史源见 IEP 引注） |\n\n---\n\n## 八、参考文献总表\n\n### 一手原典（CBETA 可在线查阅）\n\n- 《华严经探玄记》T1733；《华严一乘教义分齐章》（五教章）T1866；《华严经金师子章》T1881；《华严经旨归》T1871；《华严策林》T1872；《华严经问答》T1873；《华严经明法品内立三宝章》T1874；《华严经义海百门》T1875；《修华严奥旨妄尽还源观》T1876；《华严游 bsite\"**（sites.google.com/view/fazang，v1.0 另有 PDF 版）——英语学界最完整的法藏文献库。\n- Rothschild N.H., \"Fazang (Fa-tsang, 643–712),\" IEP。\n- Van Norden Bryan & Jones Nicholaos, \"Huayan Buddhism,\" SEP, 2019。\n- Hammerstrom Erik, *The Huayan University Network: The Teaching and Practice of Avataṃsaka Buddhism in Twentieth-Century China*, Columbia University Press, 2020。\n- Nakasone Ronald Y., *Mapping the Pathways of Huayan Buddhist Thought*, Peter Lang, 2022。\n- Prince Tony, *Universal Enlightenment: An Introduction to the Teachings and Practices of Huayen Buddhism*, 2022。\n- Connelly Ben, *Inside the Flower Garland Sutra: Huayan Buddhism and the Modern World*, Wisdom, 2025。\n- King Sallie Behn, *Commentary to the Hua-Yan Dharma-Realm Meditation*, Ph.D. UBC, 1975。\n- Lai Whalen Wai-lun, *The Awakening of Faith in Mahāyāna: A Study of the Unfolding of Sinitic Mahāyāna Motifs*, Ph.D. Harvard, 1975。\n- Oh Kang Nam, *A Study of Hua-Yen Buddhism*, Ph.D. McMaster, 1976。\n- de Vries Fedde Maarten, *Thinking Through Texts*, Ph.D. UC Berkeley, 2024。\n- Dōtsu Ayano 道津綾乃, 「華厳経明法品内三宝章の諸本」, *印度学仏教学研究* 68.2 (2020): 686–692（T1874 归属均如之考，DOI 10.4259/ibk.68.2_686）。\n\n### 数字资源\n\n- CBETA 线上阅读：https://cbetaonline.dila.edu.tw/（T1733/T1866/T1881/T1846/T2054/T2073 等）\n- deerpark.app 法藏（唐）著录：https://deerpark.app/creator/%E6%B3%95%E8%97%8F\n- BDK America（《五教章》2023英译免费 PDF）：https://www.bdkamerica.org/\n- **Fazang 法藏 Website（Nicholaos Jones）★**：https://sites.google.com/view/fazang/home —— 英语学界最完整的法藏文献库。五页结构：Writings（逐部著录 T 号+全部英译+疑伪栏）、Secondary Sources（专著+学位论文两栏）、Key Teachings（教义要点附原典出处）、Influences（思想来源）；另有 v1.0 离线 PDF 版可下载（Google Drive）。本综述 3.6/5.3 已与其逐条对勘。\n- 大华严寺：https://www.huayen.org.tw/（海云继梦讲记）\n- 华严莲社/华严专宗学院：https://www.huayen.org.tw/（贤度法师）\n- PhilPapers「The Huayan School of Chinese Buddhism」书目区\n\n---\n\n## 附：整合进页面的建议\n\n本文献综述后续可整合进 Demo 的以下位置：\n\n1. **Tab2 华严文献·文本系谱**：新增法藏著作节点（T1733/T1866/T1881 等），链接 CBETA。\n2. **Tab1 法脉传承**：法藏人物详情面板可引用本文生平/师承/著作概要；义湘、均如、义天、澄观、宗密、凝然、明惠等东亚传承节点可补齐。\n3. **Tab3 华严教行·修行体系**：可新增「法藏观行法要」（妄尽还源观/义海百门/游心法界记）小节，并链接海云继梦、净空、体佛等当代讲记。\n4. **参考文献管理**：按 docs/reference-management.md 规范，可将本文书目录入 reference 库。\n\n> 本综述为研究底稿，个别条目（如《止观科节》归属、月霞生卒、高峰了州/石井教道著作）标注「考」者仍需以原书复核。", "back": {"tab": "gap", "view": "master-fazang", "label": "华严文献 · 华严祖师"}};

<script>
// ═══ 独立文章页渲染器 (articles/<id>.html) ═══
// ARTICLE 已由 build.py 内嵌；依赖 common.js 中的 _mdFullToHTML/_mdInline/_mdDocEmbed。
function renderArticle(){
  var a=(typeof ARTICLE!=='undefined')?ARTICLE:null;
  var root=document.getElementById('article-root');
  if(!root){return;}
  if(!a){root.innerHTML='<p style=font-size:0.85em;color:var(--red)>文章数据缺失（ARTICLE 未定义）。</p>';return;}

  var embed=(typeof _mdDocEmbed==='function')?_mdDocEmbed(a.doc_md||''):{html:'',toc:[]};
  var h='';

  // ── 面包屑 ──
  h+='<div style="font-size:0.74em;color:var(--text2);margin-bottom:12px;">';
  h+='<a href="../index.html" style="color:var(--blue);text-decoration:none">主页</a> › ';
  h+='<a href="index.html" style="color:var(--blue);text-decoration:none">独立文章目录</a>';
  if(a.back && a.back.tab){
    h+=' › <a href="../tabs/'+a.back.tab+'.html" style="color:var(--blue);text-decoration:none">'+a.back.label+'</a>';
  }
  h+='</div>';

  // ── 页头横幅 ──
  h+='<div style="background:linear-gradient(120deg,rgba(184,134,60,0.12),rgba(94,139,158,0.08));border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px;">';
  h+='  <div style="font-size:0.76em;color:var(--text2);letter-spacing:0.5px">📄 独立文章页</div>';
  h+='  <h2 style="color:var(--gold);margin:6px 0 4px">'+(a.icon?a.icon+' ':'')+a.title+'</h2>';
  if(a.title_sub)h+='  <div style="font-size:0.85em;color:var(--text2)">'+a.title_sub+'</div>';
  if(a.version)h+='  <div style="font-size:0.78em;color:var(--text2);margin-top:6px">'+a.version+'</div>';
  if(a.back && a.back.tab){
    h+='  <a href="../tabs/'+a.back.tab+'.html" style="font-size:0.75em;color:var(--blue);margin-top:10px;display:inline-block">← 返回 '+a.back.label+'</a>';
  }
  h+='</div>';

  // ── 导览 ──
  if(a.meta){
    h+='<div class="section" style="border-left:4px solid var(--gold)"><h2>📌 导览</h2>';
    h+='<p style="font-size:0.8em;line-height:1.9;white-space:pre-line">'+_mdInline(a.meta)+'</p></div>';
  }

  // ── 自动目录 ──
  if(embed.toc.length){
    h+='<div class="section"><h2>🧭 本文目录</h2>';
    h+='<div style="column-width:250px;column-gap:26px;font-size:0.8em;line-height:1.75">';

  // ── 全文 ──
  h+='<div class="section" style="border-left:4px solid var(--gold)" id="article-full">';

    +'<button id="article-en-toggle" class="f-nav-btn" onclick="toggleArticleEN()" title="在「含英文批注」与「仅中文正文」之间切换显示">🌐 英文批注：显示</button></h2>';

  root.innerHTML=h;

  // ── 阅读模式：识别「英文/术语批注」块，支持仅中文正文切换 ──

if(document.readyState!=='loading'){renderArticle();}

// ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|🔑|术语格义|主题对读注|卷末批注)/.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=localStorage.getItem('article_en_hide')==='1';
  localStorage.setItem('article_en_hide', cur?'0':'1');

  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);
  }

function _applyArticleENMode(){
  var full=document.getElementById('article-full');
  var btn=document.getElementById('article-en-toggle');
  var hide=localStorage.getItem('article_en_hide')==='1';
  if(full) full.classList.toggle('en-hidden', hide);
  if(btn) btn.textContent=hide?'🌐 英文批注：展开':'🌐 英文批注：显示';
}
