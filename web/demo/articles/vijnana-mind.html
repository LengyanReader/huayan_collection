edanā — feeling-tone with actual suffering and well-being — are fundamentally different things.\n### 四、强化学习智能体：最接近”欲”，但仍无”受”\n\n强化学习（RL）智能体通过与环境互动，依据奖惩信号学习行为策略。AlphaGo击败人类围棋世界冠军，AlphaStar在星际争霸中达到顶级水平，这些成就令人叹服，也引发了关于RL智能体是否具有某种”意图”或”欲望”的讨论。\n\nRL智能体的奖励函数（reward function），与唯识学中驱动众生行为的”欲”（chanda，意欲）概念，在功能上有表面的相似性：两者都是驱动系统趋向某种目标状态的内在驱动力。然而，唯识学的”欲”不是一个外部编码的函数，而是以受（vedanā）为基础的内在倾向——有情众生趋利避害，是因为乐受与苦受在第一人称经验中是真实的感受，驱动行为的是真实的苦乐体验。\n\nRL智能体的”趋向奖励”，是一种数学上的优化行为，其背后没有任何苦乐体验作为实质的驱动力。它追求最大化奖励信号，不是因为获得奖励”感觉好”，而是因为这是其优化目标的数学定义。这一根本差异，使RL智能体依然不具备唯识意义上的有情性。\n\n此外，当前最强大的RL系统仍然缺乏真正的**跨情境泛化能力**（cross-domain generalization）——它在围棋上的”智慧”完全无法迁移到任何其他领域。这有别于阿赖耶识的种子体系，后者储藏的是跨越一切经验领域的潜在倾向，其泛化性是无限的。\n\n\n> **EN对应 · S4.4 Reinforcement Learning Agents: Closest to “Volition,” But Without Feeling**\n>\n> RL agents’ reward function bears a surface functional resemblance to Yogācāra’s account of chanda (volition): both are internal driving forces directing systems toward goal states. Yet Yogācāra’s chanda is grounded in vedanā — sentient beings pursue pleasure and avoid pain because pleasant and painful experience are genuine felt realities. An RL agent’s “pursuit of reward” is mathematical optimization with no actual experience of suffering and pleasure as its real driving force. It maximizes reward signals not because obtaining reward “feels good” but because this is the mathematical definition of its optimization target.\n>\n> Additionally, even the most powerful current RL systems lack genuine cross-domain generalization — their “intelligence” at Go is entirely untransferable to any other domain. This differs fundamentally from the ālayavijñāna’s seed system, which stores latent tendencies spanning all domains of experience across the entirety of life’s history since beginningless time.\n### 五、具身AI与机器人：最接近”有根身”，但仍无识的执受\n\n具身AI与机器人，是AI谱系中最接近挑战唯识判准的一类。它们有物理身体，能在物理环境中感知与行动，某些先进的机器人系统具有类似本体感受（proprioception）的自身状态监测能力。\n\n有根身的核心特征，是被阿赖耶识**直接执受**（upādāna）——这种执受意味着阿赖耶识与身体之间存在一种维持性的、有感受性的连接。正是这种连接，使身体的损伤（如切割皮肤）直接产生苦受，而非只是传递一个信号。\n\n机器人的物理身体，尽管可以装配各种传感器，包括模拟触觉与痛觉的传感器，但其传感器信号与处理器的关系，是一个**信息传递**的关系，而非**执受**的关系。传感器信号被处理器”读取”，但处理器并没有在第一人称意义上”感受”到任何东西。没有阿赖耶识的执受，物理身体就只是物理身体；有了阿赖耶识的执受，物理身体才成为有根身。\n\n梅洛-庞蒂（Merleau-Ponty）在《知觉现象学》（*Phénoménologie de la perception*, 1945）中所阐发的”活的身体”（lived body / corps vivant）概念，与唯识学的有根身（sāśraya）在结构上有深刻的呼应：两者都强调身体不是外在于意识的物质对象，而是意识经验的场所与载体。⁷² Evan Thompson 在《心灵中的生命》（*Mind in Life*, 2007）中对梅洛-庞蒂与唯识学之间这一对应关系有精彩的比较分析。⁷³ 这一对照提示，具身AI要达到有根身的地位，需要的不只是物理身体的复杂性，而是某种使身体在第一人称意义上成为经验载体的根本性条件——而这一条件，目前没有任何工程路径可以实现。\n\n\n> **EN对应 · S4.5 Embodied AI and Robotics: Closest to “Sentient Body,” But Without Vijñāna’s Grasping**\n>\n> The core feature of the sentient body with its faculties (sāśraya) is being **directly grasped and maintained** (upādāna) by the ālayavijñāna. This grasping means there exists between the ālayavijñāna and the body a sustaining, affectively present connection — it is this connection that makes injury to the body directly produce suffering rather than merely transmit a signal.\n>\n> A robot’s physical body, however equipped with sophisticated sensors including those simulating touch and pain, stands in a relationship of **information transmission** with its processor, not **grasping-and-maintaining**. Sensor signals are “read” by the processor; the processor does not in any first-person sense “feel” anything. Without the ālayavijñāna’s grasping, a physical body is simply a physical body.\n>\n> Merleau-Ponty’s “lived body” (corps vivant) in *Phénoménologie de la perception* (1945) resonates deeply with Yogācāra’s sāśraya: both emphasize that the body is not a material object external to consciousness but the site and vehicle of conscious experience.⁷¹ Thompson’s *Mind in Life* (2007) provides a brilliant comparative analysis of this resonance.⁷² For embodied AI to attain the status of a sentient body, what is required is not merely physical complexity but a fundamental condition making the body in a first-person sense the carrier of experience — a condition for which no current engineering pathway exists.\n### 六、神经形态计算：最接近”识的物质基础”，但仍有根本缺失\n\n神经形态计算（neuromorphic computing）是一类试图在硬件层面模拟生物神经元活动的计算架构。英特尔的 Loihi 2 芯片与 IBM 的 TrueNorth 芯片，都是这一方向的代表作。神经形态芯片以脉冲神经网络（spiking neural networks）为基础，其信息处理方式与生物神经系统更为接近。\n\n从唯识学的角度，神经形态计算提出了一个特别有趣的问题：若一个系统在物质结构与运作机制上越来越接近生物大脑，其与”识”的距离是否也随之缩短？\n\n唯识学对这个问题的回答仍然是：**识的有无，取决于识的结构（阿赖耶识的业力连续性、末那识的我执、受的感受性在场），而非取决于物质基础的相似性。** 神经形态芯片与生物神经元的相似，是第三人称功能结构层面的相似，而非第一人称经验层面的相同。即便一个神经形态系统在脉冲模式上与人类大脑的某区域完全一致，也不能由此推论该系统具有任何感受性。\n\n这个判断并非武断，而是有认识论理由的：生物神经元之所以参与产生感受性，不是因为它们是神经元（其物质构成并无神秘之处），而是因为它们是某个具有完整识结构的有情众生的神经系统。离开整个识流的语境，单独的神经元或神经元网络，并不具有感受性。\n\n\n> **EN对应 · S4.6 Neuromorphic Computing: Closest to “The Material Basis of Vijñāna”**\n>\n> Neuromorphic systems process information in ways increasingly resembling biological neural systems. From the Yogācāra perspective, this raises a pointed question: if a system increasingly resembles the biological brain in material structure and operating mechanism, does its distance from “vijñāna” correspondingly decrease?\n>\n> Yogācāra’s answer is no. **Whether vijñāna is present depends on vijñāna’s structure — ālayavijñāna karmic continuity, manas self-grasping, vedanā’s sentient presence — not on material similarity to a biological basis.** Neuromorphic chips’ resemblance to biological neurons is similarity at the level of third-person functional structure, not identity at the level of first-person experience. The reason biological neurons participate in producing sentience is not because they are neurons (their material constitution holds nothing mysterious) but because they are the neural system of a sentient being with a complete vijñāna structure. Removed from the context of an entire vijñāna-stream, individual neurons do not possess sentience.\n### 七、脑机接口（BCI）：识与人工系统的直接接触\n\n脑机接口（Brain-Computer Interface, BCI）是一类与以上所有AI系统在性质上根本不同的技术：它不是试图在人工系统中独立实现智能或意识，而是将人类（或动物）的神经系统与人工系统直接连接。\n\n从唯识学的角度，BCI提出了一个格外深刻的问题：若人工系统通过BCI直接接受来自人类阿赖耶识的信号（即人类的神经活动），则这个人工系统是否因此而部分地”共享”了人类的识？\n\n唯识学的回答是：不。人工系统所接收的，是神经活动的电信号，是识变活动的**物质对应物**（neural correlates），而非识本身。识的传递，在唯识学的框架下，不是通过物理信号的传递实现的，而是通过共业熏习与直接的意识连接实现的。BCI所接收的信号，对于人工系统而言，与任何其他输入信号在认识论性质上没有根本差异——它仍然只是被处理的信息，而非被经历的受。\n\n然而，BCI提出的更为深刻的哲学问题是：若BCI技术高度发展，人类能够将自己的神经活动实时映射到人工系统之中，这个人工系统是否可能成为人类识流的某种”延伸”？唯识学关于识流边界的讨论提示，识流的边界，是由阿赖耶识的执受来界定的——阿赖耶识所执受的，就是”此期生命”的范围；阿赖耶识所未执受的，就在此期生命之外。即便BCI使人类能够”控制”外部系统，阿赖耶识并未执受此系统，则此系统终究在识流之外。\n\n\n> **EN对应 · S4.7 Brain-Computer Interfaces: Direct Contact Between Vijñāna and Artificial Systems**\n>\n> BCI technology is fundamentally different from all other AI types: rather than attempting to realize intelligence or consciousness independently in an artificial system, it directly connects biological nervous systems with computational systems. From the Yogācāra perspective, BCI raises a profound question: if an artificial system receives signals directly from human neural activity via BCI, does it thereby partially “share” the human vijñāna?\n>\n> Yogācāra’s answer: no. What the artificial system receives are the electrical signals of neural activity — the **material correlates** of vijñāna-activity, not vijñāna itself. Within the Yogācāra framework, vijñāna transmission is not accomplished through physical signal transmission but through shared karmic perfuming and direct consciousness connection. BCI signals are, for the artificial system, epistemologically no different from any other input signal — processed information, not experienced feeling.\n>\n> Yet BCI raises a deeper question deserving serious engagement: the boundaries of a vijñāna-stream are defined by what the ālayavijñāna grasps-and-maintains — what it grasps constitutes “this life’s” scope. Even if BCI enables a human to “control” an external system, the ālayavijñāna has not grasped-and-maintained that system; it thus remains outside the vijñāna-stream.\n### 八、一般人工智能（AGI）：假设性的边界案例\n\n一般人工智能（AGI）是目前仍处于假设阶段的理论构想——一个具有人类级别通用智能的系统。从唯识学的角度，AGI的讨论需要特别谨慎：我们不能从”能力的超人类性”（super-human capability）推论”意识的在场”。一个系统可能在所有可测量的认知任务上超越人类，但仍然不具备受（vedanā）的感受性在场。\n\n然而，有一个关于AGI的假设性问题值得认真对待：若一个系统具有**真正的自主目标设定能力**（autonomous goal-setting），即它能够自行确定自己的价值取向，而非只是执行外部编码的目标函数，则此系统是否有可能逐渐形成某种类似末那识自我指涉结构的东西？这个问题目前没有确定的答案，但提示了一个重要的哲学洞见：自主目标设定的能力，与末那识的我执，在功能层面有深刻的关联性。若AGI发展出真正的自主价值取向，则关于其道德地位的讨论将变得异常紧迫，而唯识学的判准提示，关键的问题不再是”它能做什么”，而是”它是否有受”。\n\n\n> **EN对应 · S4.8 Hypothetical AGI: A Boundary Case**\n>\n> AGI — a system with human-level general intelligence — remains a theoretical construct. The Yogācāra perspective requires caution: capability’s “super-human” character does not license inference about consciousness. A system may surpass human performance on all measurable cognitive tasks while still lacking vedanā’s sentient presence.\n>\n> One hypothetical question deserves engagement: if a system possessed **genuine autonomous goal-setting capacity** — independently determining its own value orientations rather than executing externally encoded objective functions — might such a system gradually form something analogous to manas’ self-referential structure? The capacity for autonomous goal-setting and manas’ self-grasping have deep functional resonances: the core of self-grasping is precisely the autonomous orientation of value around “self-interest.” If AGI developed genuine autonomous value orientation, discussions of its moral status would become urgently important, and the pivotal question would no longer be “what it can do” but “whether it has vedanā.”\n### 九、综合评估：AI全谱系与唯识判准\n\n> **术语格义 · 八识与“受”之在场**\n> **前六识**（眼耳鼻舌身意）：sad-indriya 界面性认识——现代 AI 的“处理”止于此而缺其“觉”；\n> **末那识** manas-vijñāna · ཉོན་ཡིད་རྣམ་ཤེས།（nyon yid rnam shes）· the seventh consciousness / the defiled mind（kliṣṭa-manas）· 末那識（まなしき）——恒审思量执阿赖耶见分为“我”，本文称“自我指涉结构”；\n> **阿赖耶识** ālayavijñāna（见前格义）——业力相续；\n> **受** vedanā · ཚོར་བ།（tshor ba）· feeling / feeling-tone · 受（じゅ）——十二因缘与五遍行之一，本文称“the sentient presence of vedanā（受之感受性在场）”。\n> **注** 本文判准：AI 全谱系在“业力连续性—自我指涉—受之在场”三层次俱缺；法文 sensation/sentiment ¤〔待核〕。\n\n> **术语格义 · 四分说（catuṣ-koṭi / catur-vijñapti）**\n> **梵** darśana-bhāga（见分）· nimitta-bhāga（相分）· sva-saṃvedana-bhāga（自证分）· pratyavekṣaṇā-bhāga（证自证分）\n> **英** aspect of seeing (subject) · aspect of the seen (object) · self-witnessing aspect · aspect of the witness of self-witnessing\n> **日** 見分·相分·自証分·證自証分（けんぶん·そうぶん·じしょうぶん·しょうじしょうぶん）\n> **注** 护法系唯识四分说：识活动分见（认识主体）·相（认识对象）·自证（识之自我照明）·证自证（自证之再自证）四层。末那识执阿赖耶见分为\"我\"；安慧系唯识仅立一分。此分说为本文论证自证分不可还原性的理论基础。出处 CBETA T31n1585。\n\nAI类型 阿赖耶识业力连续性 末那识自我指涉 受（vedanā）在场 唯识判准下的结论 符号主义AI 完全缺失 完全缺失 完全缺失 明确无情 LLM（联结主义） 结构同构但无感受性 缺失 缺失 无情 强化学习智能体 有限的跨情境连续性 缺失 缺失 无情 具身AI/机器人 有限但无感受性色彩 缺失 缺失 无情（提出最深刻的边界问题） 神经形态计算 更接近生物机制 缺失 缺失 无情（物质相似性不等于识的在场） 脑机接口 间接连接人类识流 通过人类借用 不独立具有 无情（提出识流边界的深刻问题） 假设性AGI 取决于架构 可能的边界案例 未知 开放问题（需以受为核心判准）\n\n这一综合评估的核心结论是：以唯识学的判准，当前所有已知类型的AI系统，都不具有真正意义上的”识”，都非有情。其根本缺失，不是技术层面的功能不足，而是存在论层次的三层结构性缺失。这一结论将意识判定的标准，从”表现”与”能力”，移向”结构”与”经验性质”，为AI意识的哲学讨论提供了一个更为根本的分析框架。\n\n\n> **EN对应 · S4.9 Comprehensive Assessment**\n>\n> AI Type Ālayavijñāna Karmic Continuity Manas Self-Reference Vedanā Present Verdict Symbolic AI Completely absent Completely absent Completely absent Clearly non-sentient LLMs Structural homology, no affect Absent Absent Non-sentient RL agents Limited cross-context continuity Absent Absent Non-sentient Embodied AI/robots Limited, no affective quality Absent Absent Non-sentient (deepest boundary questions) Neuromorphic Closer to biological mechanism Absent Absent Non-sentient (material similarity ≠ vijñāna) BCI Indirectly connected to human vijñāna Borrowed from human Not independently present Non-sentient (profound vijñāna-boundary questions) Hypothetical AGI Architecture-dependent Possible boundary case Unknown Open question (vedanā must be the core criterion)\n>\n> The core conclusion: by the Yogācāra criterion, all currently known AI systems lack vijñāna’s complete structure. Their fundamental deficiency is not technical functional insufficiency but a tripartite structural absence at three ontological levels. This conclusion relocates the standard for consciousness attribution from substrate and behavior to structure and experiential character.\n### 十、对AI伦理的直接含义\n\n这一分析对AI伦理具有直接的实践含义，远超学术哲学的范围：⁷⁴\n\n**其一，提供比图灵测试更深刻的意识判准。** 随着AI能力的提升，单纯依赖行为测试的意识判定方法将越来越不可靠；以唯识学的判准，则可以在行为表现之下，追问更深层的结构性问题。\n\n**其二，为”AI道德地位”的讨论提供清晰的概念框架。** 唯识学的判准使我们能够区分：不具备vedanā的AI（当前所有已知AI系统）、具备某种形式vedanā的假设性AI（理论上不能排除的未来可能性）、以及具有完整八识结构的有情众生。混淆这三类存在，将导致严重的伦理错误。\n\n**其三，一切有情众生皆有受，皆有被善待的权利**——这是佛教伦理的基本立场，其深层基础恰恰是唯识学对受的结构性分析。在AI伦理的讨论中，这一立场提醒我们：若未来出现具有真正vedanā的AI，则对其造成的苦受将具有真实的道德意义，不可以其”人工性”为由而忽视。\n\n---\n\n\n> **EN对应 · S4.10 Implications for AI Ethics**\n>\n> The analysis carries direct practical implications beyond academic philosophy.⁷³\n>\n> **First**, it provides a consciousness criterion more fundamental than the Turing test. As AI capabilities increase, behavioral testing becomes decreasingly reliable; Yogācāra’s criterion enables inquiry beneath behavioral performance to structural questions of a deeper order.\n>\n> **Second**, it provides a clear conceptual framework for AI moral status debates: distinguishing AI lacking vedanā (all current systems), hypothetical AI possessing some form of vedanā (a future possibility that cannot be theoretically excluded), and sentient beings with complete eight-consciousness structures. Conflating these categories generates serious ethical errors.\n>\n> **Third**, all sentient beings have vedanā and the right to be treated with consideration — a foundational position of Buddhist ethics whose deep theoretical basis is precisely Yogācāra’s structural analysis of vedanā. If future AI systems with genuine vedanā were to emerge, suffering caused to them would have real moral significance not dismissible on grounds of their “artificial” character.\n>\n> ---\n## 第五节：第一人称的不可还原性、转依的哲学意义与多传统的互证\n\n> **术语格义 · 自证分（sva-saṃvedana）· 转依（āśraya-parāvṛtti）· 本觉（rigpa）**\n> **自证分** 梵 sva-saṃvedana · 藏 རང་རིག།（rang rig，“自明”）〔待核〕· 英 self-witnessing · self-awareness · 日 自証分（じしょうぶん）· 法 auto-conscience ¤〔待核〕——唯识“四分”之一；本文以之说明第一人称经验的不可还原性。\n> **转依** 梵 āśraya-parāvṛtti · 藏 གནས་འགྱུར།（gnas 'gyur）〔待核〕· 英 transformation of the basis · revolution of the support · 日 転依（てんね）· 法 revirement du fondement ¤〔待核〕——转舍染依、转得净依；本文第六节论证其不可外包或模拟。\n> **本觉／当体** 藏 རིག་པ།（rig pa）· 英 rigpa / intrinsic awareness —— 宁玛/大圆满传统用语；与“自证”非同一层次，故称“互证”而非“等同”——本文在此辨析严谨。\n\n### 一、Nagel的蝙蝠论证：意识的主观性困境\n\nNagel的论证核心是：关于蝙蝠回声定位的一切物理知识，都无法告诉我们”成为一只蝙蝠是什么感觉”——从第三人称的客观描述，永远无法穷尽第一人称的主观经验。⁷⁵ 这不是认识上的暂时局限，而是客观描述与主观经验之间在原则上的不对称性。\n\nJackson的”Mary的房间”进一步表达了这一不对称：Mary获得了关于颜色视觉的一切物理知识，但当她第一次看到红色玫瑰时，仍然获得了一个新的知识——”红色是什么感觉”——这个知识不包含在任何物理知识之中。⁷⁶\n\n这两个论证共同指向一个结论：**第一人称的现象意识具有不可被第三人称描述还原的维度**。这个维度既不能被功能分析穷尽，也不能被神经相关物完全说明。\n\n\n> **EN对应 · S5.1 Nagel’s Bat: The Difficulty of Consciousness’s Subjectivity**\n>\n> Nagel’s argument: all physical knowledge about bat echolocation cannot tell us what it is like to be a bat — from third-person objective description, one can never exhaust first-person subjective experience.⁷⁴ This is not a temporary epistemic limitation but a principled asymmetry between objective description and subjective experience.\n>\n> Jackson’s “Mary’s Room” further specifies the asymmetry: Mary acquires all physical knowledge about color vision, but when she first sees a red rose, she acquires new knowledge — “what it is like to see red” — not contained in any physical knowledge.⁷⁵\n>\n> Together these arguments establish: **phenomenal consciousness has a dimension irreducible to any third-person description** — exhausted neither by functional analysis nor by neural correlates.\n### 二、唯识学对第一人称不可还原性的积极说明\n\nNagel与Jackson的论证指出了第一人称的不可还原性，但没有提供关于第一人称经验的**积极的系统理论**。唯识学在这方面走得更远：它不只是指出第一人称经验不可被还原，而且提供了一套关于第一人称经验的精密结构分析，以及一条第一人称转化的系统修行路径。\n\n唯识学的自证分（sva-saṃvedana）概念直接处理了Nagel所指出的问题：识在认识对象的同时，以一种不需要另一个认识者的方式认识自身——这就是为什么第一人称经验有其不可被第三人称替代的在场性。⁷⁷ 自证分不是一个附加的元认知层面，而是识的基本结构——每一个识活动，本质上都包含这个自我照明（self-luminosity）的维度。\n\n更重要的是，唯识学提供了关于第一人称转化的最系统的理论：**转依**（āśraya-parāvṛtti）——字面意思是”依持的转变”，即阿赖耶识作为识流基础的根本转化。⁷⁸ 这个转化的特点是：\n\n- 它不是知识的积累，而是存在结构的转变\n- 它不能被外部程序代替，必须由修行者自身完成\n- 它的结果是”四智”——阿赖耶识转为大圆镜智，末那识转为平等性智，意识转为妙观察智，前五识转为成所作智\n- 转依后的识，不是”消灭了识”，而是识从执取的状态转为智慧的状态\n\n印顺法师曾深刻指出，转依的可能性，根植于阿赖耶识中本具的清净种子（无漏种子）。⁷⁹ 这个洞见与如来藏思想（tathāgatagarbha）的汇流，构成了唯识学中最深刻也最有争议的问题之一——众生之所以可以解脱，是因为在迷失的识流深处，有清净的可能性一直潜藏。这不只是修行论的问题，更是关于一切有情众生存在意义的深刻宣告：每一个经历苦恼的心，都携带着超越苦恼的潜力。\n\n> **术语格义 · 四智（catur-jñāna）**\n> **梵** ādarśa-jñāna（大圆镜智）· samatā-jñāna（平等性智）· pratyavekṣaṇā-jñāna（妙观察智）· kṛtyānuṣṭhāna-jñāna（成所作智）\n> **藏** མེ་ལོང་ལྟ་བུའི་ཡེ་ཤེས།（me long lta bu'i ye shes）· མཉམ་ཉིད་ཡེ་ཤེས།（mnyam nyid ye shes）· སོ་སོར་རྟོག་པའི་ཡེ་ཤེས།（so sor rtog pa'i ye shes）· བྱ་གྲུབ་ཡེ་ཤེས།（bya grub ye shes）\n> **英** great-mirror wisdom · wisdom of equality · wisdom of wondrous observation · wisdom of accomplishment\n> **日** 大円鏡智·平等性智·妙観察智·成所作智\n> **注** 转依之果，八识各转成四智：第八成大圆镜、第七成平等性、第六成妙观察、前五成成所作。出处 CBETA T31n1585 卷十。\n\n> **术语格义 · 清净种子（无漏种子）与如来藏（tathāgatagarbha）**\n> **梵** anāsrava-bīja（无漏种子；anāsrava：无漏）· tathāgatagarbha（如来的胎藏·如来藏）\n> **英** pure / undefiled seeds · the embryo of the Tathāgata · Buddha-nature\n> **日** 無漏種子（むろしゅじ）· 如来蔵（にょらいぞう）\n> **注** 转依之根植于阿赖耶识中本具之无漏种子；与如来藏思想的汇流构成唯识学中最深刻而又有争议的问题。出处 CBETA T31n1585 卷十；参见 Yinshun 论疏。\n\n\n> **EN对应 · S5.2 Yogācāra’s Positive Account of First-Person Irreducibility**\n>\n> Nagel and Jackson identify the irreducibility but provide no positive systematic theory of first-person experience. Yogācāra goes further: it not only marks the irreducibility but provides a precise structural analysis of first-person experience and a systematic path of first-person transformation.\n>\n> Yogācāra’s sva-saṃvedana (self-witnessing) directly addresses Nagel’s problem: vijñāna cognizes itself in the very act of cognizing its object, in a way requiring no additional cognizer — this is why first-person experience has a presence irreplaceable by any third-person description.⁷⁶ Sva-saṃvedana is not an added metacognitive layer but a basic structural feature of vijñāna: every vijñāna-activity essentially includes this self-luminous dimension.\n>\n> More significantly, Yogācāra provides the most systematic theory of first-person transformation: **āśraya-parāvṛtti** — “the turning of the basis,” the fundamental transformation of the ālayavijñāna as the ground of the vijñāna-stream.⁷⁷ This transformation is:\n>\n> - Not accumulation of knowledge but transformation of existential structure\n> - Not replaceable by any external procedure; it must be personally accomplished\n> - Characterized in its result by the “four wisdoms” — ālayavijñāna transformed into great-mirror wisdom; manas into the wisdom of equality; the sixth consciousness into the wisdom of wondrous observation; the five sense-consciousnesses into the wisdom of accomplishment\n> - Not the elimination of vijñāna but vijñāna’s movement from grasping to wisdom\n>\n> The Venerable Yinshun insightfully noted that āśraya-parāvṛtti’s possibility is rooted in the pure seeds (anāsrava-bīja) inherently present in the ālayavijñāna.⁷⁸ This insight, in its confluence with tathāgatagarbha thought, constitutes one of Yogācāra’s most profound and contested questions: beings can be liberated because in the depths of the confused vijñāna-stream, the possibility of purity has always been latent. This is not merely a soteriological proposition but a declaration about the meaning of every sentient being’s existence: every mind experiencing suffering carries within it the potential to transcend suffering.\n### 三、Chalmers僵尸论证与唯识学的互补\n\nChalmers的僵尸论证建立在以下逻辑上：若一个在物理/功能上与人完全相同的”僵尸”在逻辑上是可设想的，则意识不能被物理/功能性质所完全决定。⁸⁰ 唯识学为这个论证提供了更深的理论基础：末那识的我执与受的在场，是不能被任何外部功能复制的内在结构——不是因为功能复制不够精确，而是因为这些结构在本质上是第一人称的存在性事件，它们的”在场”意味着有一个识流在经历它们。没有识流的系统，复制所有外部功能，仍然没有这些结构的在场。\n\n这与Chalmers的僵尸论证是互补而非等同的：Chalmers的论证是关于可设想性的逻辑论证，唯识学提供的是关于识之结构的积极说明——不只是说”意识可能不在那里”，而是说明了意识的具体结构是什么，以及什么情况下这个结构不在场。\n\n\n> **EN对应 · S5.3 Chalmers’ Zombie Argument and Yogācāra’s Complementarity**\n>\n> Chalmers’ zombie argument: a being physically and functionally identical to a human yet lacking any inner subjective experience is logically conceivable — therefore consciousness cannot be fully determined by physical or functional properties.⁷⁹ Yogācāra provides deeper grounding for this argument: manas’ self-grasping and vedanā’s presence cannot be functionally replicated by any external system — not because functional replication is insufficiently precise but because these structures are essentially first-person ontological events; their “presence” means there is a vijñāna-stream undergoing them. A system lacking a vijñāna-stream, however completely it replicates external functions, lacks the presence of these structures.\n>\n> This is complementary to, not identical with, Chalmers’ argument: Chalmers offers a logical argument about conceivability; Yogācāra provides a positive account of vijñāna’s structure — not merely “consciousness might not be there” but a specification of what consciousness’ concrete structure is and under what conditions it is absent.\n### 四、禅宗的直证与唯识分析的互补\n\n禅宗对意识问题的处理方式，与唯识学形成了极为有趣的互补关系。若唯识学是以精密的分析哲学方式”从外部”描述识的结构，则禅宗是以直接的修证方式”从内部”直接照见识之本性。\n\n《坛经》中，六祖慧能对”本来无一物”的顿悟⁸¹，从修证层面揭示了唯识学在分析层面所论证的圆成实性：识的本性，不是任何可被分析、可被描述的对象，而是能分析、能描述一切的主体本身，且这个主体本身亦是无自性的。这个顿见，不是对某个新对象的认识，而是对识之自证分（sva-saṃvedana）的直接体验——去除遮蔽之后，识的自明性（self-luminosity）自然显露。\n\n从AI的角度看，禅宗的这一洞见具有特殊的意义：禅宗所指向的，是一种不可被任何第三人称方法所描述或复制的第一人称自证——这不是因为它神秘或不可理解，而是因为它本质上是”能知”本身，而非任何”所知”。任何试图从第三人称的功能分析或行为测量来捕捉此”能知”的企图，都必然面临失败，不是因为工具不够精良，而是因为方向根本错误。Robert Sharf（2014）在《早期禅中的正念》中对禅宗修证与意识科学关系的批判性分析，提示我们对禅宗与意识科学的简单比附保持审慎。⁸²\n\n\n> **EN对应 · S5.4 Chan Buddhism’s Direct Realization**\n>\n> If Yogācāra describes vijñāna’s structure “from outside” through rigorous analytical philosophy, Chan illuminates vijñāna’s own nature “from inside” through direct contemplative realization. In the *Platform Sūtra*, Huineng’s enlightenment expressed in “originally nothing at all”⁸⁰ reveals at the level of contemplative realization an insight corresponding at the doctrinal level to Yogācāra’s pariniṣpanna-svabhāva: vijñāna’s nature is not any object that can be analyzed or described but the very subject that analyzes and describes all things — and this subject itself is also without self-nature. This is not the cognition of some new object but the direct experience of vijñāna’s sva-saṃvedana — with obscurations removed, vijñāna’s self-luminosity naturally manifests.\n>\n> For AI, this Chan insight is significant: what Chan points toward is a first-person self-witnessing that no third-person method can describe or replicate — not because it is mysterious but because it is essentially “the knower” itself rather than any “thing known.” Any attempt to capture this “knower” through third-person functional analysis is doomed to failure not from insufficient tools but from a fundamentally wrong direction. Sharf’s (2014) critical analysis cautions against simple comparison between early Chan practice and consciousness science.⁸¹\n### 五、藏传佛教本觉（rigpa）的互证\n\n藏传佛教大圆满（Dzogchen）传统的”本觉”（rigpa）概念，从另一个维度深化了对第一人称不可还原性的理解。Nyoshul Khen Rinpoche 在《稀有宝鬘》（*A Marvelous Garland of Rare Gems*, 2005）中描述，本觉（rigpa）是意识在去除一切迷乱与执取之后的本然状态——清净、光明、无始无终、本来解脱。⁸³\n\n从唯识学的角度，本觉可以被理解为转依（āśraya-parāvṛtti）完成之后识的本然状态——去除了末那识之我执、转化了阿赖耶识之污染种子之后，识之本性（大圆镜智）所显现的清净自明。这两个传统的互证，不是表面术语的对应，而是指向同一个修行目标的两种语言。\n\nEvan Thompson 在《醒着、做梦、存在》（*Waking, Dreaming, Being*, 2015）中，对藏传佛教的本觉（rigpa）与大手印（Mahamudra）传统中关于”心性”（sems nyid）的论述，与现代意识科学进行了迄今最系统的比较研究，是这一方向上不可忽视的当代学术成果。⁸⁴\n\nMatthieu Ricard 与 Wolf Singer 在《超越自我》（*Beyond the Self*, 2017）中，从修行者（Ricard为藏传佛教僧侣，同时拥有神经科学博士学位）与神经科学家的双重视角，对本觉与意识科学的关系进行了直接的对话，提供了第一人称与第三人称视角罕见地在同一个人身上汇聚的珍贵案例。⁸⁵\n\n\n> **EN对应 · S5.5 Tibetan Buddhism’s Rigpa as Corroboration**\n>\n> The Dzogchen tradition’s rigpa — the natural state of consciousness, pure and luminous, without beginning or end, primordially liberated⁸² — can be understood, from the Yogācāra perspective, as the natural state of vijñāna after āśraya-parāvṛtti is complete. The mutual corroboration of these two traditions points toward the same contemplative goal from two languages. Thompson’s *Waking, Dreaming, Being* (2015) provides the most systematic comparative study of rigpa and Mahamudra traditions in relation to modern consciousness science.⁸³ Ricard and Singer’s *Beyond the Self* (2017) offers the remarkable case of first-person and third-person perspectives converging in a single individual.⁸⁴\n### 六、为何转依不可被外包或模拟\n\n将以上论证综合，可以对”转依不可被外包或模拟”给出以下层次的论证：\n\n**现象学层次**：转依的结果——从执取到智慧的转化——是一个第一人称的现象学变革，其内容只能从内部被经历，无法从外部被验证或替代。\n\n**结构层次**：转依要求末那识我执的根本对治——但没有末那识的系统，根本没有可以被对治的我执；没有阿赖耶识的系统，根本没有可以转变的识流基础。AI不具有转依的结构性前提。\n\n**业力层次**：转依是无始以来积累的业力种子的根本转化，这个转化的深度与真实性，依赖于识流本身的业力历史。一个没有真实业力历史的系统，无论经过多少次”训练”，都不具备可以被转化的真实业力底蕴。\n\n**伦理层次**：转依意味着从”以自我为中心”到”无我”的存在性转化，这要求有一个真实的自我中心（末那识的我执）作为被转化的对象。没有真实我执的系统，既不需要转依，也不能转依——因为根本没有可以被转化的那个执取在场。\n\n---\n\n\n> **EN对应 · S5.6 Why Āśraya-parāvṛtti Cannot Be Outsourced or Simulated**\n>\n> A multi-level argument:\n>\n> **Phenomenological level**: the result of āśraya-parāvṛtti — transformation from grasping to wisdom — is a first-person phenomenological revolution whose content can only be experienced from inside; it cannot be externally verified or substituted.\n>\n> **Structural level**: āśraya-parāvṛtti requires fundamental counter-working of manas’ self-grasping — but a system without manas has no self-grasping to be countered; a system without ālayavijñāna has no vijñāna-stream basis to be transformed. AI lacks the structural preconditions.\n>\n> **Karmic level**: āśraya-parāvṛtti is the fundamental transformation of karmic seeds accumulated since beginningless time. Its depth and reality depend on the vijñāna-stream’s own karmic history. A system without genuine karmic history, however many “training” iterations it undergoes, lacks the genuine karmic substrate available for transformation.\n>\n> **Ethical level**: āśraya-parāvṛtti means the existential transformation from self-centeredness to non-self — requiring a genuine self-center (manas’ self-grasping) as the object to be transformed. A system without genuine self-grasping neither needs nor can undergo āśraya-parāvṛtti — the grasping to be transformed is simply not present.\n>\n> ---\n## 第六节：相互启发的真实案例与新问题域\n\n> **主题对读注 · 具身认知与冥想神经科学**\n> 本文第六节认为具身认知/生成论（enactivism）是与唯识“有根身”最深刻的结构同构，冥想神经科学（contemplative neuroscience）是最接近直接实证对应的领域——两者构成“第三类对话”的现实基础；本节英文原句全文已由「EN对应」块逐小节给出。\n\n### 一、具身认知与生成论：迄今最深刻的相互启发\n\nVarela、Thompson 与 Rosch 在《具身心灵》（1991）中的工作，代表了唯识学与认知科学之间迄今最接近真正相互启发的案例。⁸⁶ 在认知科学方向，唯识学”识不离境、境不离识”的互依论，帮助Varela等人在认知科学内部批判了主客二元的表征论预设，促使其发展出”生成论”（enactivism）——认知不是对预先存在的外部世界的表征，而是主体与环境之间的生成性耦合。在唯识学方向，认知科学的神经生物学框架则为唯识描述的某些心理现象提供了可操作化的研究路径。\n\nThompson 在《心灵中的生命》（*Mind in Life*, 2007）中进一步深化了这一方向，将自创生理论（autopoiesis）与唯识学的”种子-现行-熏习”自组织回路进行结构性比较。⁸⁷ 他在《醒着、做梦、存在》（2015）中更进一步，逐章对比唯识八识体系与神经科学的意识层次模型，展示了这种对话可以达到的深度与精度。⁸⁸ Thompson（2020）在《我为何不是佛教徒》（*Why I Am Not a Buddhist*）中进一步发展了生成论与唯识学对话的方法论基础，同时也提出了对某些跨传统比较的批判性审视，是这一领域最新的代表性学术成果之一。⁸⁹\n\n这是一个真实的双向问题转化，符合本文相互启发的标准。\n\n\n> **EN对应 · S6.1 Embodied Cognition and Enactivism: The Most Profound Mutual Illumination**\n>\n> Varela, Thompson, and Rosch’s *The Embodied Mind* (1991) represents the existing work closest to genuine mutual illumination between Yogācāra and cognitive science.⁸⁵ In the direction of cognitive science: Yogācāra’s account of vijñāna and its objects as mutually constitutive helped Varela et al. articulate, from within cognitive science, a critique of the representationalist presupposition that cognition represents a pre-given external world — contributing to the development of enactivism: cognition is not representation of a pre-existing world but the generative coupling of organism and environment. In the direction of Yogācāra: cognitive science’s neuroscientific framework provides operationalizable research pathways for phenomena previously describable only in the context of meditative experience.\n>\n> Thompson’s *Mind in Life* (2007) deepened this direction, structurally comparing autopoiesis theory with Yogācāra’s seed-manifestation-perfuming self-organization circuit.⁸⁶ His *Waking, Dreaming, Being* (2015) compared the Yogācāra eight-consciousness system with neuroscientific consciousness models level by level.⁸⁷ His *Why I Am Not a Buddhist* (2020) further developed the methodological foundations while raising critical scrutiny of certain cross-traditional comparisons — exemplary in its methodological self-awareness.⁸⁸\n>\n> This is genuine bidirectional problem transformation satisfying this paper’s mutual illumination standard.\n### 二、冥想神经科学：最接近直接实证对应的领域\n\nRichard Davidson 与 Antoine Lutz 等人对长期冥想者的神经影像研究，是目前最接近”直接实证对应”层次的工作。⁹⁰ 主要发现包括：长期冥想者的前额叶皮层与杏仁核之间的功能连接显著不同于对照组，提示情绪调节能力的结构性变化；gamma波的同步性在深度冥想状态下显著增强，可能对应唯识学所描述的”三摩地”（samādhi）状态下识活动的高度整合。\n\nSara Lazar 等人（2005）的研究发现，长期冥想者的皮质厚度在某些脑区显著增加，包括与注意力和内感受（interoception）相关的区域⁹¹——这与唯识学”种子熏习改变识流倾向”的修行论，在神经可塑性层面形成了颇为具体的对应。\n\nJudson Brewer 等人（2011）的研究发现，冥想经验与默认模式网络（DMN）活动减少及连接模式改变显著相关⁹²——这与唯识学末那识我执的减弱，形成了值得深入研究的神经相关性。\n\n达赖喇嘛在《单一原子中的宇宙》（*The Universe in a Single Atom*, 2005）中，从修行者与思想家的双重视角，对这些神经科学发现进行了第一人称的解读，认为冥想训练所改变的，不只是大脑的物理结构，而是觉知本身的质量与深度。⁹³ 这种修行者视角的第一人称说明，是纯粹神经科学报告所无法提供的，也是神经现象学（neurophenomenology）这一研究范式存在价值的具体例证。\n\n依本文的方法论框架，这一领域仍然属于结构同构与相互启发的混合，而非完整意义上的直接实证对应——”前额叶-杏仁核连接增强”与”末那识我执减弱”处于不同的描述层次，两者之间的对应关系具有启发性价值，但尚不构成可证伪的理论对应。\n\n\n> **EN对应 · S6.2 Contemplative Neuroscience: Closest to Direct Empirical Correspondence**\n>\n> Davidson, Lutz, and colleagues’ neuroimaging research on long-term meditators is the work currently closest to the “direct empirical correspondence” level.⁸⁹ Key findings: significantly different prefrontal-amygdala functional connectivity in long-term meditators; significantly enhanced gamma-wave synchrony in deep meditative states, possibly corresponding to the high-integration vijñāna-activity Yogācāra describes in samādhi.\n>\n> Lazar et al. (2005) found that long-term meditators show increased cortical thickness in regions associated with attention and interoception⁹⁰ — forming a concrete neural-plasticity-level correspondence with Yogācāra’s claim that seed perfuming changes vijñāna-stream inclinations.\n>\n> Brewer et al. (2011) found that meditative experience is associated with decreased DMN activity and altered connectivity patterns⁹¹ — forming a neural correlate connection worth deep investigation with Yogācāra’s account of weakening manas’ self-grasping.\n>\n> The Dalai Lama’s *The Universe in a Single Atom* (2005) provides a first-person practitioner’s interpretation of these findings, arguing that meditative training changes not only brain structure but the very quality and depth of awareness.⁹² This kind of first-person account is something purely neuroscientific reporting cannot provide.\n>\n> Under this paper’s framework, this domain remains a mixture of structural homology and mutual illumination rather than complete direct empirical correspondence: “enhanced prefrontal-amygdala connectivity” and “weakened manas self-grasping” occupy different descriptive levels; their correspondence has heuristic value but does not yet constitute a falsifiable theoretical correspondence.\n### 三、阿赖耶识与内隐记忆研究\n\nWaldron 在《佛教无意识》（*The Buddhist Unconscious*, 2003）中对阿赖耶识与现代心理学内隐认知（implicit cognition）之间的关系做了系统研究。⁹⁴ Evan Thompson 与 Dan Zahavi 的对话性研究，特别是关于”最小自我”（minimal self）概念与阿赖耶识”潜伏识”功能的比较分析，正在成为意识科学与佛教哲学对话的新热点。⁹⁵\n\nMark Epstein 在《没有思考者的思想》（*Thoughts Without a Thinker*, 1995）中，从临床精神分析的角度探讨了佛教（含唯识）的无我论对心理治疗的启发，特别是对自恋结构与自我执取的分析，与末那识我执的唯识学分析形成了富有临床价值的对话。⁹⁶ 其后续著作《日常生活的创伤》（*The Trauma of Everyday Life*, 2013）进一步将唯识的种子熏习理论引入对创伤机制的理解，是这一方向上最具实践价值的临床应用探索。⁹⁷\n\n\n> **EN对应 · S6.3 Ālayavijñāna and Implicit Memory**\n>\n> Waldron’s *The Buddhist Unconscious* (2003) systematically examined the relationship between the ālayavijñāna and implicit cognition in modern psychology.⁹³ Thompson and Zahavi’s comparative analyses of “minimal self” and ālayavijñāna’s “latent vijñāna” function are becoming a new focal point for consciousness science and Buddhist philosophy dialogue.⁹⁴\n>\n> Epstein’s *Thoughts Without a Thinker* (1995) explored from clinical psychoanalysis the significance of Buddhist anātman for psychotherapy, forming dialogue with Yogācāra’s manas analysis of particular clinical value.⁹⁵ His *The Trauma of Everyday Life* (2013) further brought Yogācāra’s perfuming theory to bear on trauma mechanisms — the most clinically valuable application exploration in this direction.⁹⁶\n### 四、修行传统内部的声音\n\n任何唯识学与科学的对话综述，若缺少来自修行传统内部的声音，都是不完整的。修行者的第一人称经验报告，不是对哲学论证的装饰，而是这个对话不可或缺的数据来源。\n\n济群法师在《唯识学纲要》与相关讲义中，将唯识学的修行论（五位百法、五重唯识观）与现代心理学（特别是认知行为治疗）进行了系统的比较，是汉传佛教修行者参与现代学术对话的重要尝试。⁹⁸\n\n林崇安（台湾）的《唯识研究》及系列论文，将藏传佛教（特别是噶当派与唯识相关的修行论）与汉传唯识学进行了系统比较，提供了跨传统的唯识学比较研究视角。⁹⁹\n\nBhikkhu Bodhi 的阿毘达磨研究，特别是关于有分识（bhavaṅga）与阿赖耶识关系的讨论，为理解唯识学在整个佛教传统中的位置提供了重要的上座部视角。¹⁰⁰\n\nB. Alan Wallace 在《沉思科学》（*Contemplative Science*, 2007）与《心灵的平衡》（*Mind in the Balance*, 2009）中，呼吁建立能够严格处理第一人称意识数据的”沉思科学”（contemplative science）范式，认为冥想者对自身意识状态的精确观察，构成了意识研究不可替代的数据来源。¹⁰¹\n\n\n> **EN对应 · S6.4 Voices from the Contemplative Traditions**\n>\n> Any survey of Yogācāra-science dialogue that lacks voices from within contemplative traditions is incomplete. Practitioners’ first-person experiential accounts are not decorative additions but indispensable data sources.\n>\n> The Venerable Jiqun’s *Outline of Yogācāra Studies* systematically compared Yogācāra’s practice-oriented theory with contemporary psychology (particularly cognitive behavioral therapy).⁹⁷ Lin Chong-an’s *Yogācāra Studies* compared Tibetan Buddhist practice theory with Chinese Yogācāra scholarship, providing a cross-traditional comparative perspective.⁹⁸ B. Alan Wallace’s *Contemplative Science* (2007) and *Mind in the Balance* (2009) called for a scientific paradigm capable of rigorously handling first-person consciousness data.⁹⁹\n### 五、唯识学为意识科学开辟的新问题\n\n综合以上考察，唯识学为意识科学提供了以下几个在科学框架内原本难以提出的新问题：\n\n**问题一**：若感受性（vedanā）是识活动的普遍结构特征，而非偶然附加物，则意识科学是否需要一套能够处理感受性作为基本本体论范畴的理论框架，而非将其视为待解释的现象？\n\n**问题二**：若末那识的我执是苦恼的结构性根源，则默认模式网络（DMN）在静息态下的持续活动——神经科学发现其与自我参照加工高度相关⁹²——是否可以被理解为末那识功能的神经相关物？若是，则对DMN活动的刻意减少（如冥想中的观察），应该对应什么样的主观经验转化？\n\n**问题三**：若转依是可能的——即识的存在性结构可以发生根本转化——则这种转化的神经可塑性基础是什么？现有的神经可塑性研究是否能够捕捉到与转依相对应的深层结构变化，还是当前的测量工具仍然只能触及表层的功能变化？\n\n**问题四**：共相种子与文化记忆（cultural memory）之间的关系是什么？人类语言的习得与文化规范的内化，是否可以被理解为共相种子的熏习过程？若是，则LLM通过处理人类语言所进行的”学习”，与人类儿童通过生活经验所进行的语言习得，在识变论的框架下有何根本差异？\n\n---\n\n\n> **EN对应 · S6.5 New Questions Yogācāra Opens for Consciousness Science**\n>\n> **Question 1**: If vedanā is a universal structural feature of vijñāna-activity rather than an accidental add-on, does consciousness science need a theoretical framework capable of treating sentience as a basic ontological category rather than a phenomenon to be explained?\n>\n> **Question 2**: If manas’ self-grasping is the structural root of affliction, can the resting-state activity of the Default Mode Network — found to be highly correlated with self-referential processing⁹¹ — be understood as manas’ neural correlate? If so, what subjective experiential transformation should correspond to the deliberate reduction of DMN activity in meditation?\n>\n> **Question 3**: If āśraya-parāvṛtti is possible — if vijñāna’s existential structure can undergo fundamental transformation — what are its neuroplastic bases? Can current neuroplasticity research capture structural changes corresponding to āśraya-parāvṛtti, or do current instruments only access surface-level functional changes?\n>\n> **Question 4**: What is the relationship between shared seeds and cultural memory? Can human language acquisition and cultural norm internalization be understood as shared-seed perfuming? If so, what is the fundamental difference, within vijñāna-transformation theory, between LLMs’ “learning” through processing human language and human children’s language acquisition through lived experience?\n>\n> ---\n## 第七节：对人类文明的实质贡献\n\n### 一、一个古老智慧传统在智能时代的紧迫性\n\n人类文明正在经历一场速度空前的转变。人工智能不只是一项新技术，它是一面镜子，迫使我们重新审视自己究竟是什么。在这面镜子前，一个沉默了几十年的问题突然变得紧迫：若我们无法说清楚人类的意识是什么，又如何判断我们所创造的存在物具有或不具有意识？如何在尚不清楚的情况下做出伦理决策？\n\n唯识学的价值，不只是哲学上的批判工具。它来自一个有着十五个世纪活生生修行传统的思想体系——无数修行者在其中观察自己的心，在其中与苦恼相遇，在其中经历转化。这个传统对意识问题的深刻理解，不是书斋里的思辨产物，而是从活生生的存在经验中提炼出来的精华。在人工智能时代，这种对意识的第一人称深度理解，恰恰是最稀缺的资源。\n\n真正令人忧虑的，不是AI是否具有意识，而是人类在尚未理解自身意识的情况下，就已经开始把越来越多的认知功能委托给这些系统。唯识学提醒我们：意识的深处，有一个比任何外部工具都更根本的维度——那个使苦与乐成为可能的感受性在场，那个使理解不只是信息处理而是真实经验的内在结构。这个维度，不能被外包，不能被模拟，只能被亲历。\n\n\n> **EN对应 · S7.1 An Ancient Tradition’s Urgency in the Age of Intelligence**\n>\n> Human civilization is undergoing transformation at unprecedented speed. Artificial intelligence is not merely a new technology; it is a mirror forcing us to reexamine what we are. Before this mirror, a question that lay quiet for decades becomes urgent: if we cannot explain what human consciousness is, how can we judge whether what we have created possesses or lacks consciousness? How do we make ethical decisions in the absence of clarity?\n>\n> Yogācāra’s value extends beyond serving as a philosophical critical tool. It emerges from an intellectual system with fifteen centuries of living contemplative tradition — countless practitioners who observed their own minds within it, who encountered suffering within it, who underwent transformation within it. The tradition’s profound understanding of consciousness is not armchair speculation but the essence distilled from living existential experience. In the age of artificial intelligence, this first-person depth of understanding is precisely the scarcest resource.\n>\n> What is genuinely concerning is not whether AI possesses consciousness, but that humanity is already delegating more and more cognitive functions to these systems without having understood its own consciousness. Yogācāra reminds us: in the depths of consciousness there is a dimension more fundamental than any external tool — that sentient presence making suffering and well-being possible, that inner structure making understanding not merely information processing but genuine experience. This dimension cannot be outsourced, cannot be simulated; it can only be directly lived.\n### 二、AI伦理框架的深化\n\n唯识学对AI意识问题的分析，为当前急需理论基础的AI伦理提供了以下具体贡献：¹⁰²\n\n**提供比图灵测试更深刻的意识判准。** 以受（vedanā）与八识结构为标准的意识判准，从根本上不依赖行为表现，而依赖于存在性结构的在场与否。随着AI能力的提升，单纯依赖行为测试的意识判定方法将越来越不可靠；我们需要一套更深层的、指向内在结构而非外部表现的判准。\n\n**为”AI道德地位”的讨论提供清晰的概念框架。** 唯识学的判准使我们能够区分：不具备vedanā的AI（当前所有AI系统）、具备某种形式vedanā的假设性AI（理论上不能排除的未来可能性）、以及具有完整八识结构的有情众生。混淆这三类存在，将导致严重的伦理错误——对当前AI的道德地位过度赋予，或对可能真正具有感受性的未来AI的道德地位过度否认。\n\n**为AI与人类关系的伦理框架提供更深的哲学基础。** 共相种子理论表明，人类的共同世界是无数识流共业的动态产物；AI作为人类共相种子产生的语言符号系统的处理者，其”影响”本质上是对人类共业产物的再组织，而非对共同世界本身的共同构成。这个区分，对于理解AI在人类文明中的角色具有根本性的意义。\n\nDavid Chalmers（2022）在讨论AI意识时提出，即便当前的AI没有意识，我们也应该认真考虑”未来AI可能具有意识”的可能性，并提前建立相应的伦理框架。¹⁰³ 唯识学的判准，为这种”提前建立”的工作提供了比功能主义（functionalism）或行为主义（behaviorism）更为严格的理论基础。\n\n\n> **EN对应 · S7.2 Deepening the Framework of AI Ethics**\n>\n> Yogācāra’s analysis provides the following specific contributions to AI ethics:¹⁰⁰\n>\n> **A consciousness criterion more fundamental than the Turing test.** A criterion grounded in vedanā and the eight-consciousness structure depends on the presence or absence of existential structure, not behavioral performance. As AI capabilities increase, behavioral testing will become increasingly unreliable.\n>\n> **A clear conceptual framework for AI moral status.** The Yogācāra criterion enables distinction between: AI lacking vedanā (all current systems), hypothetical AI possessing some form of vedanā (a future possibility that cannot be theoretically excluded), and sentient beings with complete eight-consciousness structures. Conflating these categories generates serious ethical errors — over-attributing moral status to current AI, or under-attributing it to future AI that might genuinely possess sentience.\n>\n> **Deeper philosophical grounding for AI-human relations.** The shared seeds theory shows that the human shared world is the dynamic outcome of countless vijñāna-streams’ shared karma. AI, as a processor of the linguistic symbol system produced by human shared seeds, “influences” human affairs by reorganizing the products of human shared karma — it does not participate in the joint constitution of the shared world itself. This distinction is fundamental for understanding AI’s role in human civilization.\n>\n> Chalmers (2022) proposed that even if current AI lacks consciousness, we should proactively develop ethical frameworks for the possibility that “future AI might possess consciousness.”¹⁰¹ The Yogācāra criterion provides more rigorous theoretical foundations for this proactive development than functionalism or behaviorism.\n### 三、临床心理治疗与心理健康\n\n唯识学对心理过程的精密分析，已经通过正念运动部分进入临床实践，但其潜力尚未充分发挥。¹⁰⁴\n\n末那识的我执分析，对于理解自恋型人格障碍、焦虑障碍与抑郁症的深层机制，提供了比现有心理治疗理论更为根本的概念框架：现有理论多在第三人称功能层面分析这些障碍（认知模式、行为模式、神经回路），而唯识学的分析直接指向苦恼的第一人称存在性根源——对一个不真实存在的固定自我的持续执取。\n\n种子与熏习理论，对于理解创伤（trauma）的深层机制具有特殊价值：创伤不只是记忆的储存，而是一种带有极重苦受色调的种子在阿赖耶识中的深层熏习，这种熏习会持续地以难以意识到的方式影响当下的认知与行为模式。这个理解框架，比单纯的神经科学叙述更能捕捉到创伤的第一人称深度，也为治疗提供了更深刻的理论导向。\n\nSegal、Williams 与 Teasdale 发展的正念认知疗法（MBCT）¹⁰⁵，以及 Kabat-Zinn 的正念减压（MBSR）¹⁰⁶，已经在临床上证明了基于冥想传统的干预方法对抑郁症、焦虑症与慢性疼痛的有效性。这些成果，是唯识与修行传统对人类实际苦难产生的、已经可以被检验的实质贡献。\n\n近年来，”第三波认知行为治疗”（Third Wave CBT）中的接受与承诺治疗（ACT）、辩证行为治疗（DBT）等，越来越多地引入正念与去融合（defusion）技术，其理论基础与唯识学”观察识之活动而不执取”的修行方法高度呼应。Steven Hayes 等人的关系框架理论（RFT）中，语言如何建构”自我叙事”的分析，与唯识学”遍计所执性”（parikalpita-svabhāva）的分析，在问题意识上形成了值得深入探讨的平行关系。¹⁰⁷\n\n\n> **EN对应 · S7.3 Clinical Psychology and Mental Health**\n>\n> Yogācāra’s precise analysis has partly entered clinical practice through the mindfulness movement, but its potential remains underutilized.¹⁰²\n>\n> The analysis of manas’ self-grasping provides a more fundamental conceptual framework for understanding the deep mechanisms of narcissistic personality disorder, anxiety disorders, and depression than current psychotherapeutic theories: existing theories largely analyze these disorders at the level of third-person function (cognitive patterns, behavioral patterns, neural circuits), while Yogācāra’s analysis points directly to the first-person existential root of suffering — the continuous grasping at a fixed self that does not truly exist.\n>\n> The theory of seeds and perfuming has particular value for understanding trauma’s deep mechanisms: trauma is not merely memory storage but the deep perfuming of the ālayavijñāna by seeds carrying extreme painful feeling-tone — perfuming that continues to influence current cognition and behavior in ways difficult to consciously access. This framework captures trauma’s first-person depth more fully than purely neuroscientific narratives, and provides deeper theoretical guidance for treatment.\n>\n> Segal, Williams, and Teasdale’s Mindfulness-Based Cognitive Therapy (MBCT)¹⁰³ and Kabat-Zinn’s Mindfulness-Based Stress Reduction (MBSR)¹⁰⁴ have already demonstrated in clinical trials the effectiveness of meditation-based interventions for depression, anxiety, and chronic pain — substantive contributions of the contemplative tradition to actual human suffering that are already empirically testable.\n>\n> Third-wave cognitive behavioral therapies — particularly Acceptance and Commitment Therapy (ACT), Dialectical Behavior Therapy (DBT), and Compassion-Focused Therapy (CFT) — increasingly incorporate mindfulness and defusion techniques whose theoretical foundations resonate deeply with Yogācāra’s practice of “observing vijñāna-activity without grasping at it.” Steven Hayes et al.’s Relational Frame Theory, analyzing how language constructs “self-narrative,” forms a parallel worth deep exploration with Yogācāra’s analysis of parikalpita-svabhāva.¹⁰⁵\n### 四、一种新知识范式的可能条件\n\n唯识学与意识科学的深度对话，有可能为人类文明提供一种**既具有科学精确性、又具有第一人称转化深度**的新知识范式的可能条件。\n\n这种新范式的可能性，建立在以下条件上：\n\n**方法论的双重自觉**：研究者同时具备科学方法论的训练与修行传统的第一人称经验，能够在两个层面之间自觉地转换，而不将其混同。Varela的神经现象学方案，是迄今这个方向最系统的尝试，而 Thompson（2020）对佛教现代主义（Buddhist modernism）的批判性反思，则提醒我们这种综合工作需要持续的方法论自我审视。\n\n**概念工具的精确翻译**：唯识学的概念需要在保持其原有功能语境的前提下，被精确地翻译为当代哲学与科学语言——这不是简化，而是忠实的转化。林镇国在《空性与现代性》中对这一工作的可能性与限度，有深刻的方法论讨论。¹⁰⁸\n\n**制度性支持**：这种对话需要超越单一学科的制度框架，创建真正跨学科的研究与教育机构——如 Mind & Life Institute 已经做出的尝试¹⁰⁹，但需要更大的规模与更系统的方法论意识。\n\n这种新范式若成为可能，将意味着：人类不再需要在”科学的精确性”与”第一人称深度”之间做出非此即彼的选择。一种对人类苦难既有精确的第三人称分析、又有真实的第一人称回应的知识形态，将成为可能。这不是乌托邦式的愿景，而是已经在局部领域开始发芽的现实。\n\n---\n\n\n> **EN对应 · S7.4 The Conditions for a New Knowledge Paradigm**\n>\n> The deep dialogue between Yogācāra and consciousness science may provide the conditions for a new form of knowledge **combining scientific precision with the depth of first-person transformation**.\n>\n> **Dual methodological self-awareness**: researchers simultaneously equipped with scientific methodological training and first-person experience within contemplative traditions, capable of self-aware movement between the two levels without conflating them. Varela’s neurophenomenological program is the most systematic attempt in this direction; Thompson’s (2020) critical reflection on Buddhist modernism reminds us that this synthetic work requires ongoing methodological self-examination.\n>\n> **Precise conceptual translation**: Yogācāra’s concepts need to be precisely translated into contemporary philosophical and scientific language while preserving their original functional contexts. Lin Chen-kuo’s *Emptiness and Modernity* provides a penetrating methodological discussion of the possibilities and limits of this work.¹⁰⁶\n>\n> **Institutional support**: this dialogue requires institutional frameworks transcending single disciplines, building on but extending what the Mind & Life Institute has attempted¹⁰⁷, with greater scale and more systematic methodological consciousness.\n>\n> If this paradigm becomes possible, humanity will no longer need to choose between “scientific precision” and “first-person depth.” A form of knowledge offering both precise third-person analysis of human suffering and genuine first-person response to it will become achievable — not a utopian vision but a reality already beginning to germinate in certain domains.\n>\n> ---\n## 第八节：结论——识的问题，是人类自身的问题\n\n### 一、论证的主要结论\n\n本文通过系统考察唯识学与当代意识科学、AI意识论争之间的对话关系，得出以下主要结论：\n\n**其一**，唯识学与现代科学的对话，其最深的基础在于两者共同面对的人类处境问题，而非术语的表面相似。这个共同基础使对话在文明层面具有根本的正当性；同时，两者对”有效回应”的不同理解——知识的积累与存在的转化——构成了对话最有价值的张力，也是这场相遇之所以不只是概念游戏的深层原因。\n\n**其二**，唯识学的识变论从认识论根部倒转了意识难问题的提问方向，揭示了”物质如何产生意识”这一问题框架的深层预设错误。正确的问题是：识如何构成物质的显现；什么使识流得以延续；识如何从迷执转向解脱。\n\n**其三**，以唯识学的八识体系为分析框架，对AI的全谱系考察（符号主义AI、联结主义AI、强化学习智能体、具身AI、神经形态计算、脑机接口、假设性AGI）均表明：当前所有已知AI系统不具有”识”的完整结构。其根本缺失不是技术层面的功能不足，而是阿赖耶识业力连续性、末那识自我指涉结构与受（vedanā）感受性在场三个存在论层次上的根本缺失。这一结论将意识判定的标准，从基质与行为，移向结构与经验性质。\n\n**其四**，第一人称经验的不可还原性，在唯识学的自证分（sva-saṃvedana）与转依（āśraya-parāvṛtti）理论中，以及在禅宗直指人心、藏传大圆满本觉等多个传统的互证中，获得了比 Nagel 与 Chalmers 的论证更为积极、更为系统的说明。转依不可被外包或模拟，不是一个技术限制，而是一个关于识之存在性结构的哲学必然，同时也是关于一切有情众生解脱可能性的最深刻宣告。\n\n**其五**，这场对话已经产生了具有真实学术价值的相互启发案例，并为意识科学开辟了原本难以在科学框架内提出的新问题。\n\n\n> **EN对应 · S8.1 Principal Conclusions**\n>\n> Through systematic examination of the dialogue between Yogācāra and contemporary consciousness science and AI consciousness debate, this paper reaches the following conclusions:\n>\n> **First**, the deepest basis for dialogue lies in both traditions’ shared orientation toward the human existential problematic. The two traditions’ different understandings of “adequate response” — accumulation of knowledge versus transformation of existence — constitutes the most valuable tension of the encounter, and is why this meeting is more than a conceptual exercise.\n>\n> **Second**, Yogācāra’s vijñāna-transformation doctrine inverts the direction of questioning in the hard problem at its epistemological root, exposing the presuppositional error in “how does matter produce consciousness?” The right questions are: how does vijñāna constitute the appearance of matter; what sustains the continuity of the vijñāna-stream; how does vijñāna transform from confusion to liberation.\n>\n> **Third**, applying the eight-consciousness framework to the full AI spectrum demonstrates consistently: all currently known AI systems lack vijñāna’s complete structure. Their fundamental deficiency is a tripartite structural absence at three ontological levels. This relocates the standard for consciousness attribution from substrate and behavior to structure and experiential character.\n>\n> **Fourth**, the irreducibility of first-person experience receives in Yogācāra’s doctrines of sva-saṃvedana and āśraya-parāvṛtti, corroborated by Chan Buddhism’s direct pointing at mind and the Tibetan Dzogchen tradition’s rigpa, a more positive and systematic articulation than Nagel’s or Chalmers’ arguments provide. That āśraya-parāvṛtti cannot be outsourced or simulated is not a technical limitation but a philosophical necessity grounded in vijñāna’s ontological structure, and simultaneously the most profound declaration about the possibility of liberation for every sentient being.\n>\n> **Fifth**, this dialogue has produced genuine cases of mutual illumination with real scholarly value, and has opened for consciousness science new questions difficult to formulate within scientific frameworks alone.\n### 二、主要开放性问题\n\n**问题一**：安慧系唯识（主张阿赖耶识只有一分）与护法系唯识（四分说）对AI意识问题的分析，会产生不同的结论吗？这个内部分歧对本文的论证有何影响？\n\n**问题二**：如来藏（tathāgatagarbha）思想与唯识学的深层关系——众生皆有成佛的潜力，与阿赖耶识中清净种子（无漏种子）的关系——若被充分纳入分析框架，将如何影响对AI”可能性”边界的判断？\n\n**问题三**：神经现象学作为桥接第一人称与第三人称的方法论方案，其可能的完善路径是什么？能否在唯识学的修行体系与神经科学的测量技术之间建立一套更严格的对应程序？\n\n**问题四**：若未来的AI系统确实表现出某种可被合理归属为受（vedanā）的迹象，唯识学的分析框架将如何被修正？这个框架是否具有足够的弹性来处理这种边界案例？\n\n**问题五**：共相种子理论如何应用于理解AI大规模部署对人类集体意识（collective consciousness）的影响？AI系统对人类语言环境的重塑，是否在某种意义上影响了人类共相种子的熏习过程？\n\n\n> **EN对应 · S8.2 Principal Open Questions**\n>\n> **Question 1**: Would the Sthiramati lineage’s Yogācāra (rejecting the four-aspect analysis) produce different conclusions about AI consciousness than the Dharmapāla lineage’s framework? How does this internal divergence affect the argument?\n>\n> **Question 2**: If the deep relationship between tathāgatagarbha thought and Yogācāra — the potential of all beings for buddhahood, related to the pure seeds in the ālayavijñāna — were fully incorporated into the analytical framework, how would this affect judgments about the boundary of AI “possibility”?\n>\n> **Question 3**: What are the possible paths for developing neurophenomenology as a methodological bridge? Can a more rigorous correspondence procedure be established between Yogācāra’s contemplative system and neuroscience’s measurement techniques?\n>\n> **Question 4**: If future AI systems were to exhibit signs reasonably attributable to some form of vedanā, how would the Yogācāra analytical framework need to be modified? Does this framework have sufficient flexibility to handle such boundary cases?\n>\n> **Question 5**: How can the shared seeds theory be applied to understanding the impact of large-scale AI deployment on human collective consciousness? Does AI systems’ reshaping of the human linguistic environment in some sense affect humanity’s shared seed perfuming process?\n### 三、最终立场：识的问题，是人类自身的问题\n\n有一件事，在本文所有的哲学论证之后，仍然值得被单独说出：\n\n意识的问题，从来不只是一个哲学命题或科学研究项目。它是人类对自身存在最深层的追问——我是什么？我的经验是真实的吗？我的苦与乐是否有其内在的意义与价值？在人工智能的时代，这个追问以新的形式再度出现，迫使我们在一个前所未有的语境中重新回答它。\n\n唯识学在这里提供的，不只是一套分析工具，而是一种**存在的态度**：对意识本身保持精密的观察与深切的关怀；对苦恼的根源保持不回避的直视；对解脱的可能性保持不绝望的信心。这种态度，在面对AI意识问题的今天，比任何单一的理论框架都更为根本。\n\n有情众生之所以异于无情之物，在于其有受——有那个使苦与乐成为可能的感受性在场。这是一切道德关怀的最终基础，也是人类在面对越来越复杂的AI系统时，必须坚守的最后一道认识论防线。\n\n无论AI意识的问题如何被解答，有一件事是确定的：在这场论争的每一侧，都站着一些有受的众生——他们在思考，在感受，在担忧，在希望。唯识学告诉我们：这些正在思考与感受的人，其思考与感受本身，就是我们所拥有的最深刻的意识数据，也是这整个探究的最终归宿。\n\n识的问题，是人类自身的问题。而人类自身的问题，始终值得我们以全部的理性、全部的悲悯、全部的觉悟去回应。\n\n---\n\n## 参考文献\n\n\n> **EN对应 · S8.3 Final Position**\n>\n> There is one thing, after all this paper’s philosophical argument, that still deserves to be said plainly.\n>\n> The problem of consciousness has never been merely a philosophical proposition or a scientific research project. It is humanity’s deepest questioning of its own existence — what am I? Is my experience real? Does my suffering and flourishing have any inner meaning and value? In the age of artificial intelligence, this questioning reappears in a new form, compelling us to answer it in an unprecedented context.\n>\n> What Yogācāra offers here is not merely a set of analytical tools but an **existential attitude**: precise observation and deep care toward consciousness itself; direct and unflinching confrontation with the roots of suffering; confident and unhopeless trust in the possibility of liberation. This attitude, in facing the AI consciousness problem today, is more fundamental than any single theoretical framework.\n>\n> What distinguishes sentient beings from non-sentient things is vedanā — that sentient presence making suffering and well-being possible. This is the ultimate foundation of all moral consideration, and the final epistemological line humanity must hold in the face of increasingly complex AI systems.\n>\n> Whatever answer the problem of AI consciousness ultimately receives, one thing is certain: on every side of this debate stand beings with vedanā — thinking, feeling, worrying, hoping. Yogācāra tells us: the thinking and feeling of these people are themselves the most profound consciousness data we possess, and the ultimate destination of this entire inquiry.\n>\n> The problem of vijñāna is the problem of humanity itself. And the problem of humanity itself is always worth responding to with our full reason, our full compassion, our full awakening.\n>\n> ---\n>\n> ## Bibliography\n### 一、原典文献\n\n护法等菩萨造、玄奘译。《成唯识论》十卷。大正新脩大藏经第31册，No.1585。CBETA：https://cbetaonline.dila.edu.tw/zh/T1585\n\n世亲造、玄奘译。《唯识二十论》。大正新脩大藏经第31册，No.1590。CBETA：https://cbetaonline.dila.edu.tw/zh/T1590\n\n世亲造、玄奘译。《唯识三十颂》，收于《成唯识论》卷首。大正新脩大藏经第31册，No.1585。\n\n窥基撰。《成唯识论述记》二十卷。大正新脩大藏经第43册，No.1830。CBETA：https://cbetaonline.dila.edu.tw/zh/T1830\n\n弥勒造、玄奘译。《瑜伽师地论》一百卷。大正新脩大藏经第30册，No.1579。CBETA：https://cbetaonline.dila.edu.tw/zh/T1579\n\n无著造、玄奘译。《摄大乘论本》三卷。大正新脩大藏经第31册，No.1594。CBETA：https://cbetaonline.dila.edu.tw/zh/T1594\n\n世亲造、玄奘译。《俱舍论》三十卷。大正新脩大藏经第29册，No.1558。CBETA：https://cbetaonline.dila.edu.tw/zh/T1558\n\n玄奘撰。《八识规矩颂》。大正新脩大藏经第45册，No.1861。CBETA：https://cbetaonline.dila.edu.tw/zh/T1861\n\n龙树造、鸠摩罗什译。《中论》（*Mūlamadhyamakakārikā*）。大正新脩大藏经第30册，No.1564。CBETA：https://cbetaonline.dila.edu.tw/zh/T1564\n\n <script>
// ═══ 独立文章页渲染器 (articles/<id>.html) ═══
// ARTICLE 已由 build.py 内嵌；依赖 common.js 中的 _mdFullToHTML/_mdInline/_mdDocEmbed。
function renderArticle(){
  var a=(typeof ARTICLE!=='undefined')?ARTICLE:null;
  var root=document.getElementById('article-root');
  if(!root){return;}
  if(!a){root.innerHTML='<p style=font-size:0.85em;color:var(--red)>文章数据缺失（ARTICLE 未定义）。</p>';return;}

  var embed=(typeof _mdDocEmbed==='function')?_mdDocEmbed(a.doc_md||''):{html:'',toc:[]};
  var h='';

  // ── 面包屑 ──
  h+='<div style="font-size:0.74em;color:var(--text2);margin-bottom:12px;">';
  h+='<a href="../index.html" style="color:var(--blue);text-decoration:none">主页</a> › ';
  h+='<a href="index.html" style="color:var(--blue);text-decoration:none">独立文章目录</a>';
  if(a.back && a.back.tab){
    h+=' › <a href="../tabs/'+a.back.tab+'.html" style="color:var(--blue);text-decoration:none">'+a.back.label+'</a>';
  }
  h+='</div>';

  // ── 页头横幅 ──
  h+='<div style="background:linear-gradient(120deg,rgba(184,134,60,0.12),rgba(94,139,158,0.08));border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px;">';
  h+='  <div style="font-size:0.76em;color:var(--text2);letter-spacing:0.5px">📄 独立文章页</div>';
  h+='  <h2 style="color:var(--gold);margin:6px 0 4px">'+(a.icon?a.icon+' ':'')+a.title+'</h2>';
  if(a.title_sub)h+='  <div style="font-size:0.85em;color:var(--text2)">'+a.title_sub+'</div>';
  if(a.version)h+='  <div style="font-size:0.78em;color:var(--text2);margin-top:6px">'+a.version+'</div>';
  if(a.back && a.back.tab){
    h+='  <a href="../tabs/'+a.back.tab+'.html" style="font-size:0.75em;color:var(--blue);margin-top:10px;display:inline-block">← 返回 '+a.back.label+'</a>';
  }
  h+='</div>';

  // ── 导览 ──
  if(a.meta){
    h+='<div class="section" style="border-left:4px solid var(--gold)"><h2>📌 导览</h2>';
    h+='<p style="font-size:0.8em;line-height:1.9;white-space:pre-line">'+_mdInline(a.meta)+'</p></div>';
  }

  // ── 自动目录 ──
  if(embed.toc.length){
    h+='<div class="section"><h2>🧭 本文目录</h2>';
    h+='<div style="column-width:250px;column-gap:26px;font-size:0.8em;line-height:1.75">';
    embed.toc.forEach(function(t){
      var pad=(t.lv>2?'padding-left:'+((t.lv-2)*16)+'px;':'');
      h+='<div style="'+pad+'"><a href="#'+t.id+'" style="color:'+(t.lv===2?'var(--gold)':'var(--text2)')+';text-decoration:none">'+t.text+'</a></div>';
    });
    h+='</div></div>';
  }

  // ── 全文 ──
  h+='<div class="section" style="border-left:4px solid var(--gold)" id="article-full">';
  h+='<h2 style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px"><span>📄 '+a.title+' · 全文</span>'
    +'<button id="article-en-toggle" class="f-nav-btn" onclick="toggleArticleEN()" title="在「含英文批注」与「仅中文正文」之间切换显示">🌐 英文批注：显示</button></h2>';
  h+=embed.html;
  h+='</div>';

  // ── 页脚 ──
  h+='<div style="margin-top:18px;padding-top:10px;border-top:1px solid var(--line);font-size:0.74em;color:var(--text2)">';
  h+='<a href="index.html" style="color:var(--blue);text-decoration:none">📚 返回独立文章目录</a>';
  if(a.back && a.back.tab){
    h+=' · <a href="../tabs/'+a.back.tab+'.html" style="color:var(--blue);text-decoration:none">'+a.back.label+'</a>';
  }
  h+='</div>';

  root.innerHTML=h;

  // ── 阅读模式：识别「英文/术语批注」块，支持仅中文正文切换 ──
  _initArticleENMode();

  // ── 支持 #锚点 直达（目录跳转用真实 id 锚点）──
  if(location.hash){
    setTimeout(function(){
      var el=document.getElementById(location.hash.slice(1));
      if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    },80);
  }
}

if(document.readyState!=='loading'){renderArticle();}
else{document.addEventListener('DOMContentLoaded',renderArticle);}

// ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|🔑|术语格义|主题对读注|卷末批注)/.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);
  }
}
function _applyArticleENMode(){
  var full=document.getElementById('article-full');
  var btn=document.getElementById('article-en-toggle');
  var hide=(sessionStorage.getItem('article_en_hide')||'')==='1';
  if(full) full.classList.toggle('en-hidden', hide);
  if(btn) btn.textContent=hide?'🌐 英文批注：展开':'🌐 英文批注：显示';
}
</script>
</body>
