证得佛果，而非如显教一般须经历漫长劫数的渐修。此一\"三密相应\"修法的核心教理依据是\"六大缘起\"（地水火风空识六大周遍法界、彼此无碍）与\"阿字本不生\"（阿字为一切文字、一切法之根本，其本性即\"本不生\"，象喻诸法自性空寂而又缘起宛然）两大命题，修行须以曼荼罗（坛城）观想为骨架，配合灌顶、护摩等仪轨次第展开，\"菩提心为因，大悲为根本，方便为究竟\"三句义贯穿全部修证历程。\n\n唐武宗会昌灭佛（845）之后，金刚界、胎藏界两部纯密在中国本土基本失传，反赖此前入唐求法的日本僧人（最澄、空海等）将其完整移植至日本，形成后世所称\"东密\"（真言宗，空海所传）与\"台密\"（天台宗兼弘密法一系，最澄及其后继者圆仁、圆珍所传，见前节）两大支流，延续至今；中国本土则仅剩若干杂密性质的修行方式（如蒙山施食、放焰口等仪轨）流传民间，已不再被视为独立宗派。唐密在其发源地本土的中断与在日本的完整保存、繁衍，构成了汉传佛教史上一段颇具戏剧性的传承断裂与异地赓续的公案，也是理解今日东亚密教格局（唐密本土湮没、东密台密海外昌盛、藏传密教独立发展）的关键背景。\n\n\n\n> **EN对应 · Part Eleven: Esoteric Buddhist Meditation (I)—The \"Three Mysteries in Correspondence\" of Chinese Esoteric Buddhism**\n>\n> Esoteric Buddhist (Vajrayāna, Mantrayāna) contemplative practice represents, beyond the Southern School, both the weightiest and the most intricately elaborate strand of all. Its Chinese and Tibetan branches, though sharing a common origin in late Indian Mahāyāna–Vajrayāna Buddhism, developed historically independently of one another; this study treats them in two separate parts, beginning with the Chinese (\"Tangmi,\" 唐密, \"Tang Esotericism\") system.\n>\n> In the eighth century, during the Kaiyuan era of Emperor Xuanzong of Tang (716–720), the Indian Esoteric masters Śubhakarasiṃha, Vajrabodhi, and Amoghavajra arrived successively in China; under the patronage of the Tang imperial house they systematically translated a large body of Esoteric scriptures and propagated Esoteric teaching at Da Xingshan Monastery in Chang'an and elsewhere—an event known to history as the arrival of the \"Three Great Masters of the Kaiyuan Era\" (開元三大士), marking the formal establishment of \"Tang Esotericism,\" centered on the two \"Pure\" Esoteric systems of the Vajra-Realm and Womb-Realm maṇḍalas (this followed an earlier period in which only scattered \"miscellaneous Esoteric\" elements had been introduced, without yet forming a systematic body of doctrine and ritual). Śubhakarasiṃha, assisted by Yixing, translated the *Mahāvairocana Sūtra* (大日經) at Da Fuxian Monastery in Luoyang, marking the beginning of the Womb-Realm Esoteric teaching's transmission to China; Vajrabodhi subsequently translated the *Jingangding Yuqie Zhonglüe Chu Niansong Fa* (金剛頂瑜伽中略出念誦法) and other texts, transmitting the Vajra-Realm teaching; his disciple Amoghavajra, having received the empowerments of both maṇḍala systems from the ācārya Samantabhadra in Siṃhala (present-day Sri Lanka), returned to China and translated the *Sarvatathāgatatattvasaṃgraha* (Jin'gangding Jing 金剛頂經) and ten other works totaling 143 fascicles—Tang Esotericism thereby reached its full flowering, its patriarchal seats at Da Xingshan and Qinglong Monasteries flourishing greatly.\n>\n> The doctrine of Tang Esotericism centers on the goal of \"becoming Buddha in this very body\" (即身成佛): through the practitioner's cultivation of the \"three mysteries\" (三密)—forming mudrās with the hands (body-mystery), reciting mantras/dhāraṇīs with the mouth (speech-mystery), and visualizing the tutelary deity with the mind (mind-mystery)—the practitioner enters into correspondence with the \"three mysteries\" of the tutelary buddha or bodhisattva's own body, speech, and mind (\"the correspondence of the three mysteries,\" \"empowerment through the three mysteries\"), thereby transforming the ordinary body into the buddha-body and realizing buddhahood in this very lifetime, rather than requiring the immeasurable eons of gradual cultivation demanded by the exoteric teachings. This method of \"correspondence of the three mysteries\" rests doctrinally on two central theses: \"dependent origination of the six great elements\" (六大緣起, the six elements of earth, water, fire, wind, space, and consciousness pervade the entire Dharma-realm, mutually unobstructed) and \"the letter A is fundamentally unborn\" (阿字本不生, the letter A is the root of all letters and all dharmas, and its very nature—\"fundamentally unborn\"—symbolizes how all dharmas are, in their essential nature, empty and quiescent while yet arising through dependent origination). Practice must take maṇḍala (altar-realm) visualization as its structural framework, proceeding through the sequential unfolding of empowerment, homa fire rituals, and other prescribed rites, with the three phrases \"bodhicitta as cause, great compassion as root, skillful means as consummation\" running through the entire course of practice and realization.\n>\n> Following Emperor Wuzong's suppression of Buddhism during the Huichang era (845), the two Pure Esoteric systems of the Vajra-Realm and Womb-Realm largely disappeared from China proper; they survived only because Japanese monks who had earlier traveled to Tang China to seek the Dharma—Saichō, Kūkai, and others—had already transplanted the teaching intact to Japan, where it gave rise to what later became known as the \"Tōmitsu\" lineage (東密, \"Esotericism\" as transmitted by Kūkai's Shingon school) and the \"Taimitsu\" lineage (台密, the branch of the Tendai school that also propagated Esoteric teaching, transmitted by Saichō and his successors Ennin and Enchin, discussed above)—two traditions that continue to this day. In China proper, only certain practices of a \"miscellaneous Esoteric\" character (such as the Mengshan rite of feeding hungry ghosts, and the Flaming-Mouth rite) survived among the folk tradition, no longer regarded as an independent school. The severance of Tang Esotericism's transmission in its land of origin, alongside its complete preservation and continued flourishing in Japan, together constitute a rather dramatic episode of transmission-rupture and displaced continuation in the history of Chinese Buddhism—and form essential background for understanding today's East Asian Esoteric landscape (Tang Esotericism's disappearance from its native soil; the flourishing of Tōmitsu and Taimitsu overseas; and the independent development of Tibetan Esoteric Buddhism).\n>\n>\n\n> **EN对应 · Part Eleven: Esoteric Buddhist Meditation (I)—The \"Three Mysteries in Correspondence\" of Chinese Esoteric Buddhism**\n>\n> Esoteric Buddhist (Vajrayāna, Mantrayāna) contemplative practice represents, beyond the Southern School, both the weightiest and the most intricately elaborate strand of all. Its Chinese and Tibetan branches, though sharing a common origin in late Indian Mahāyāna–Vajrayāna Buddhism, developed historically independently of one another; this study treats them in two separate parts, beginning with the Chinese (\"Tangmi,\" 唐密, \"Tang Esotericism\") system.\n>\n> In the eighth century, during the Kaiyuan era of Emperor Xuanzong of Tang (716–720), the Indian Esoteric masters Śubhakarasiṃha, Vajrabodhi, and Amoghavajra arrived successively in China; under the patronage of the Tang imperial house they systematically translated a large body of Esoteric scriptures and propagated Esoteric teaching at Da Xingshan Monastery in Chang'an and elsewhere—an event known to history as the arrival of the \"Three Great Masters of the Kaiyuan Era\" (開元三大士), marking the formal establishment of \"Tang Esotericism,\" centered on the two \"Pure\" Esoteric systems of the Vajra-Realm and Womb-Realm maṇḍalas (this followed an earlier period in which only scattered \"miscellaneous Esoteric\" elements had been introduced, without yet forming a systematic body of doctrine and ritual). Śubhakarasiṃha, assisted by Yixing, translated the *Mahāvairocana Sūtra* (大日經) at Da Fuxian Monastery in Luoyang, marking the beginning of the Womb-Realm Esoteric teaching's transmission to China; Vajrabodhi subsequently translated the *Jingangding Yuqie Zhonglüe Chu Niansong Fa* (金剛頂瑜伽中略出念誦法) and other texts, transmitting the Vajra-Realm teaching; his disciple Amoghavajra, having received the empowerments of both maṇḍala systems from the ācārya Samantabhadra in Siṃhala (present-day Sri Lanka), returned to China and translated the *Sarvatathāgatatattvasaṃgraha* (Jin'gangding Jing 金剛頂經) and ten other works totaling 143 fascicles—Tang Esotericism thereby reached its full flowering, its patriarchal seats at Da Xingshan and Qinglong Monasteries flourishing greatly.\n>\n> The doctrine of Tang Esotericism centers on the goal of \"becoming Buddha in this very body\" (即身成佛): through the practitioner's cultivation of the \"three mysteries\" (三密)—forming mudrās with the hands (body-mystery), reciting mantras/dhāraṇīs with the mouth (speech-mystery), and visualizing the tutelary deity with the mind (mind-mystery)—the practitioner enters into correspondence with the \"three mysteries\" of the tutelary buddha or bodhisattva's own body, speech, and mind (\"the correspondence of the three mysteries,\" \"empowerment through the three mysteries\"), thereby transforming the ordinary body into the buddha-body and realizing buddhahood in this very lifetime, rather than requiring the immeasurable eons of gradual cultivation demanded by the exoteric teachings. This method of \"correspondence of the three mysteries\" rests doctrinally on two central theses: \"dependent origination of the six great elements\" (六大緣起, the six elements of earth, water, fire, wind, space, and consciousness pervade the entire Dharma-realm, mutually unobstructed) and \"the letter A is fundamentally unborn\" (阿字本不生, the letter A is the root of all letters and all dharmas, and its very nature—\"fundamentally unborn\"—symbolizes how all dharmas are, in their essential nature, empty and quiescent while yet arising through dependent origination). Practice must take maṇḍala (altar-realm) visualization as its structural framework, proceeding through the sequential unfolding of empowerment, homa fire rituals, and other prescribed rites, with the three phrases \"bodhicitta as cause, great compassion as root, skillful means as consummation\" running through the entire course of practice and realization.\n>\n> Following Emperor Wuzong's suppression of Buddhism during the Huichang era (845), the two Pure Esoteric systems of the Vajra-Realm and Womb-Realm largely disappeared from China proper; they survived only because Japanese monks who had earlier traveled to Tang China to seek the Dharma—Saichō, Kūkai, and others—had already transplanted the teaching intact to Japan, where it gave rise to what later became known as the \"Tōmitsu\" lineage (東密, \"Esotericism\" as transmitted by Kūkai's Shingon school) and the \"Taimitsu\" lineage (台密, the branch of the Tendai school that also propagated Esoteric teaching, transmitted by Saichō and his successors Ennin and Enchin, discussed above)—two traditions that continue to this day. In China proper, only certain practices of a \"miscellaneous Esoteric\" character (such as the Mengshan rite of feeding hungry ghosts, and the Flaming-Mouth rite) survived among the folk tradition, no longer regarded as an independent school. The severance of Tang Esotericism's transmission in its land of origin, alongside its complete preservation and continued flourishing in Japan, together constitute a rather dramatic episode of transmission-rupture and displaced continuation in the history of Chinese Buddhism—and form essential background for understanding today's East Asian Esoteric landscape (Tang Esotericism's disappearance from its native soil; the flourishing of Tōmitsu and Taimitsu overseas; and the independent development of Tibetan Esoteric Buddhism).\n>\n> ---\n>\n\n## 第十二部分　密教禅观（二）：藏传佛教的大手印与大圆满\n\n\n与经由印度直接海路、陆路传入中国内地又东传日本的唐密不同，藏传佛教密法（金刚乘）经历了更为漫长、复杂的\"前弘期\"\"后弘期\"传播过程，形成宁玛（旧译）、噶举、萨迦、格鲁（新译）等诸大教派，而\"讲究心性的解脱道\"在藏传佛教中最具代表性的两大体系，正是新译派的大手印与旧译派的大圆满，二者常被并称为藏传佛教修行论述的\"两大主流\"。\n\n\n> **EN对应 · Part Twelve: Esoteric Buddhist Meditation (II)—Tibetan Buddhism's Mahāmudrā and Dzogchen**\n>\n> Unlike Tang Esotericism, which was transmitted directly to China proper by sea and land from India and then further east to Japan, Tibetan Buddhist Esoteric teaching (Vajrayāna) underwent a far more prolonged and complex process of transmission, through the \"early diffusion\" and \"later diffusion\" periods, giving rise to the Nyingma (old-translation), Kagyu, Sakya, and Gelug (new-translation) schools, among others. Within Tibetan Buddhism, the two most representative systems for \"the path of liberation focused on the nature of mind\" are Mahāmudrā, of the new-translation schools, and Dzogchen, of the old-translation school—the two traditions often spoken of together as the \"two main currents\" of Tibetan Buddhist contemplative teaching.\n>\n\n### 一、大手印（Mahāmudrā）：噶举派的解脱道\n\n\n\"大手印\"是梵语 Mahāmudrā 的意译，\"摩诃\"（大）意指遍及一切现象与运动的同一究竟本源，\"母陀罗\"（印）则喻指姿态、象征或印证之意，合称意指以究竟智慧\"印证\"一切现象、宇宙万有本自一味的修证法门。大手印法门相传源出印度大成就者萨罗哈，经龙树及历代祖师口耳相传，至那洛巴传予西藏噶举派祖师玛尔巴，玛尔巴归藏后传予密勒日巴，密勒日巴传冈波巴，冈波巴始将大手印教法与噶当派\"道次第\"教学法结合、系统化传布，奠定噶举派\"大手印\"传承的基本格局。\n\n大手印通常依修证入路不同分为三类：**经教大手印**（显教大手印），以中观见与他空如来藏思想为基础，主要参考《三摩地王经》《宝性论》等经论；**密教大手印**，须经密续灌顶，依生起次第（观想本尊）、圆满次第（气、脉、明点之修习，尤以\"那洛六法\"为噶举派最精要的圆满次第教授）次第引入；**心髓大手印**，则由上师亲自对弟子作身、语、意口诀直指，\"心心相印\"直接引介心性本体，帝洛巴对那洛巴的教导（即著名的《恒河大手印》）即为此类教授之代表。噶举派修法体系将\"密续与大手印之道\"合而论之：显教大手印将中观空性见与密乘方便道所引生之大乐相结合，以此现证法、报、化三身，是噶举派区别于藏传佛教其他教派最核心的独特标识。\n\n\n> **EN对应 · 1. Mahāmudrā: The Path of Liberation in the Kagyu School**\n>\n> \"Mahāmudrā\" is a translation of the Sanskrit term, in which \"mahā\" (\"great\") refers to the single ultimate source pervading all phenomena and all movement, while \"mudrā\" (\"seal\") suggests a gesture, symbol, or seal of confirmation—the compound term thus denoting a method of practice and realization in which ultimate wisdom \"seals\" or confirms that all phenomena, the entire universe, share a single, uniform taste. The Mahāmudrā teaching is traditionally traced back to the Indian mahāsiddha Saraha (active around the first century BCE), transmitted orally through Nāgārjuna and successive generations of masters down to Nāropa, who transmitted it to Marpa, founding patriarch of the Tibetan Kagyu school; upon returning to Tibet, Marpa transmitted it to Milarepa, who transmitted it to Gampopa—it was Gampopa who first combined the Mahāmudrā teachings with the \"stages of the path\" (Lamrim) pedagogical method of the Kadam school, systematizing them and thereby laying the basic framework for the Kagyu school's transmission of Mahāmudrā.\n>\n> Mahāmudrā is customarily divided, according to the differing approaches by which it may be entered into practice, into three types: **Sūtra-based Mahāmudrā** (also called Exoteric Mahāmudrā), grounded in the Madhyamaka view and the thought of the extrinsic-emptiness tathāgatagarbha, drawing primarily on the *Samādhirāja Sūtra*, the *Ratnagotravibhāga*, and other scriptures and treatises; **Tantra-based Mahāmudrā**, which requires tantric empowerment and proceeds through the sequential introduction of the generation stage (visualizing a tutelary deity, such as Vajravārāhī or Cakrasaṃvara) and the completion stage (cultivation of the subtle winds, channels, and drops—among which the \"Six Yogas of Nāropa\" constitute the most essential completion-stage teaching within the Kagyu school); and **Essence Mahāmudrā**, in which the guru directly transmits pointing-out instructions on body, speech, and mind to the disciple in person, \"mind sealing mind,\" directly introducing the disciple to the very essence of the nature of mind—Tilopa's instruction to Nāropa (the celebrated \"Ganges Mahāmudrā\") represents the classic example of this type of teaching. The Kagyu school's system of practice treats \"the tantric path and the path of Mahāmudrā\" as a unified whole: Sūtra-based Mahāmudrā's view of emptiness, drawn from the Madhyamaka tradition, is fused with the great bliss generated through the tantric path of skillful means, and through this fusion the practitioner directly realizes the three bodies—dharmakāya, saṃbhogakāya, and nirmāṇakāya—which stands as the single most distinctive hallmark differentiating the Kagyu school from the other schools of Tibetan Buddhism.\n>\n\n### 二、大圆满（Dzogchen）：宁玛派的阿底瑜伽\n\n\n大圆满（藏语音译\"佐钦\"\"竹箐\"），又称阿底瑜伽（Atiyoga，\"无上瑜伽\"），是宁玛派（旧译派）教理体系\"九乘判教\"中内密三乘之最高乘、被视为一切佛法与一切密法之顶尖。宁玛派传统信仰认为，大圆满法源出法身普贤王如来，历经报身金刚萨埵、化身极喜金刚（约7—8世纪西印度乌仗那国人，学界一般认为的可信人间初祖）传予妙吉祥友、吉祥狮子，再由莲花生大士、无垢友等于8世纪传入西藏，大圆满经典虽多以\"伏藏\"（掘藏）形式重新面世，但据信相当部分确系由梵文原本译出而非藏人自造，隆钦饶绛巴（1308—1364，\"遍知法王\"）则被视为大圆满教理体系之集大成者。\n\n大圆满法门依内容层次分为心部、界部、教授部（口诀部）三类，以教授部为最高，教授部又依修证方式分为**立断**（彻却，Trekchö）与**顿超**（脱噶／妥噶，Thögal）二支，后者以前者为基础。立断法以证悟\"心体本净\"这一大圆满根本理论为目的，虽名\"立断\"，实际修证仍须经历相当程度的渐修方能顿悟本净心体；顿超法则被视为\"以光修证法性自然智\"的更高阶修法，能于现生成就\"光明身\"，获得广大自在利生事业与天眼、神足、寿命等自在通力，故在大圆满诸法中被列为最为究竟之修法。\n\n大手印与大圆满作为藏传佛教\"讲究心性的解脱道\"两大主流，历代祖师著述中不乏对二者异同的比较讨论——例如均强调\"针对具体人根基的不共教法\"（直指心性、\"平常心\"用而无修）与\"针对一切人的共通教法\"（次第发展寂止胜观、以理抉择二无我）两种教学路径并存，均警示后学不应偏废次第基础教法而空谈\"直指\"。此类内部反思本身即体现出藏传密教心性论传统丰厚的义理自觉与修证经验积累，其精微复杂程度，较之汉传南宗禅有过之而无不及，且二者历史上鲜有直接的法脉交涉。\n\n\n\n> **EN对应 · 2. Dzogchen: The Atiyoga of the Nyingma School**\n>\n> Dzogchen (a transliteration of the Tibetan for \"Great Perfection,\" also translated as Atiyoga, \"the utmost yoga\") is the highest of the three inner tantric vehicles within the \"nine vehicles\" doctrinal classification system of the Nyingma (old-translation) school, regarded as the very pinnacle of the entire Buddhadharma and of all tantric teaching. According to Nyingma tradition, Dzogchen teaching originates with the dharmakāya buddha Samantabhadra, transmitted through the saṃbhogakāya Vajrasattva to the nirmāṇakāya Garab Dorje (active roughly in the seventh–eighth century, a figure from Oḍḍiyāna in northwestern India, generally regarded by scholarship as the earliest credible human patriarch of the lineage), who transmitted it to Mañjuśrīmitra and Śrī Siṃha, and thence, through Padmasambhava, Vimalamitra, and others, into Tibet in the eighth century. Although many Dzogchen scriptures have reappeared in the form of \"terma\" (rediscovered treasure-texts), it is believed that a considerable portion were genuinely translated from Sanskrit originals rather than composed by Tibetans themselves; Longchenpa (1308–1364, honored as the \"Omniscient Dharma-King\") is generally regarded as the figure who brought the Dzogchen doctrinal system to its full culmination.\n>\n> Dzogchen teaching is divided by content into three classes: the Mind Series, the Space Series, and the Instruction Series (also called the Esoteric Instruction Series), with the Instruction Series regarded as the highest; the Instruction Series is in turn divided, according to method of practice and realization, into two branches: **Trekchö** (\"cutting through,\" \"breakthrough\") and **Thögal** (\"leaping over,\" \"direct crossing\"), with the latter building upon the former as its foundation. Trekchö takes as its goal the realization of Dzogchen's fundamental doctrine that \"the essence of mind is originally pure\"; although called \"cutting through,\" actual practice still generally requires a considerable degree of gradual cultivation before the practitioner can suddenly awaken to this originally pure essence of mind. Thögal, by contrast, is regarded as a still higher-level practice—\"realizing the innate wisdom of dharmatā [ultimate reality] through the medium of light\"—capable of achieving, within this very life, the \"rainbow body\" (or \"great transference body,\" \"vase body of youth\"), attaining vast and unimpeded powers for benefiting sentient beings, along with such self-mastered supernormal abilities as the divine eye, unobstructed movement, and control over one's own lifespan—for which reason it is ranked among all Dzogchen teachings as the most ultimate and consummate form of practice.\n>\n> Mahāmudrā and Dzogchen, as the \"two main currents\" of the mind-nature-focused path of liberation within Tibetan Buddhism, have been the subject of extensive comparative discussion by successive generations of masters within their own respective traditions—both, for instance, emphasize the coexistence of two distinct pedagogical paths: an \"uncommon teaching\" suited to practitioners of a particular capacity (directly pointing out the nature of mind, employing \"ordinary mind\" without contrived cultivation) and a \"common teaching\" applicable to all practitioners (the gradual development of calm-abiding and special insight, and the discernment of the two forms of selflessness through reasoned analysis)—and both traditions caution later students against neglecting the foundational, graduated teachings in favor of an empty, abstract discourse of \"direct pointing-out.\" This kind of internal self-reflection in itself reflects the rich doctrinal self-awareness and accumulated experience of practice and realization within the Tibetan Esoteric tradition of mind-nature theory—a degree of subtlety and complexity in no way inferior to that of Chinese Southern-School Chan—and the two traditions have historically had little in the way of direct lineage contact with one another.\n>\n> ---\n>\n\n## 第十三部分　南传上座部止观：从\"禅那\"本源到20世纪内观复兴\n\n\n若要在全部佛教传统中追溯\"禅\"这一概念最古老的源头，则理应回到南传上座部所依据的巴利经典系统——因为\"禅那\"（jhāna，梵语 dhyāna）本身正是汉字\"禅\"之音译所本，而四种色界禅那（四禅）及无色界四空定合称\"四禅八定\"，本就是佛陀教法中一切禅修方法所依止的共同心理学基础框架，从原始佛教直到南宗顿悟禅法，理论上均无法自外于这一基础框架而奢谈\"禅\"之实践。\n\n\n> **EN对应 · Part Thirteen: Theravāda Śamatha-Vipassanā—From the Origin of \"Jhāna\" to the Twentieth-Century Vipassanā Revival**\n>\n> If one wishes, across the full range of Buddhist traditions, to trace \"Chan\" back to its most ancient root, one must return to the Pāli scriptural system on which Theravāda Buddhism is based—for \"jhāna\" (Sanskrit *dhyāna*) is itself precisely the term from which the Chinese character \"chan\" (禪) derives as a transliteration, and the four form-realm jhānas together with the four formless attainments (jointly, the \"four jhānas and eight samādhis,\" 四禪八定) constitute the shared psychological foundation underlying every method of meditative practice within the Buddha's teaching—a foundation from which no form of Buddhist \"Chan,\" from original Buddhism all the way down to the Southern School's sudden-awakening teaching, can, in principle, be considered independent.\n>\n\n### 一、止（奢摩他）与观（毗婆舍那）\n\n\n南传上座部将修行整体分为二种：**奢摩他**（samatha，止）与**毗婆舍那**（vipassanā，观），二者合称\"止观\"，其内涵与前述天台止观、唯识止观等大乘体系中的同名概念既有相通之处，亦有教理上的细微差异。修奢摩他者将心专注固守于一特定所缘境（业处，kammaṭṭhāna），逐渐进入\"安止定\"，依次第证得四种禅那；修毗婆舍那者则以慧观照诸法无常、苦、无我之实相，最终导向解脱智的现起。现代南传上座部佛教，尤以缅甸禅系为代表，进一步将修行者依止观修习方式的不同区分为\"止乘者\"（先修深定再转修观）与\"干观者\"（纯观者，不经由深定、直接以简约方式修观），后一路径正是20世纪缅甸内观复兴运动之所以能够在不要求信众具备长期出家闲居条件的前提下大范围推广的方法论基础。\n\n\n> **EN对应 · 1. Śamatha and Vipassanā**\n>\n> Theravāda Buddhism divides the whole of practice into two categories: **śamatha** (奢摩他, \"calm-abiding,\" or \"stopping,\" 止) and **vipassanā** (毗婆舍那, \"insight,\" or \"contemplation,\" 觀)—together, \"śamatha-vipassanā\"—concepts that overlap in meaning to a considerable degree with, yet also differ subtly in doctrine from, the identically-named concepts found in the Mahāyāna zhiguan systems of Tiantai and Vijñaptimātratā discussed above. The practitioner of śamatha fixes the mind single-pointedly upon a chosen object of meditation (a \"meditation subject,\" *kammaṭṭhāna*), gradually entering \"absorption concentration\" (appanā) and progressively attaining the four jhānas in sequence; the practitioner of vipassanā, by contrast, uses wisdom to contemplate the true nature of all phenomena as impermanent, suffering, and without self, ultimately giving rise to liberating wisdom. Modern Theravāda Buddhism, particularly as represented by the Burmese meditation lineages, further distinguishes practitioners, according to their manner of undertaking śamatha-vipassanā practice, into \"samatha-yānika\" (samatha-vehicle practitioners, who cultivate deep concentration first before turning to insight practice) and \"vipassanā-yānika\" or \"sukkha-vipassaka\" (\"dry-insight,\" or \"pure-insight\" practitioners, who bypass deep concentration and proceed directly to insight practice through a simplified approach)—it is this latter approach that forms the methodological basis on which the twentieth-century Burmese vipassanā revival movement was able to spread so widely, without requiring practitioners to meet the demanding preconditions of long-term monastic seclusion.\n>\n\n### 二、20世纪缅甸内观复兴：雷迪尊者、马哈希尊者、乌巴庆与葛印卡\n\n\n上座部止观传统绵延两千余年，至19世纪末至20世纪前期，在英国殖民统治下的缅甸经历了一场影响深远的现代复兴运动，其社会文化意义不仅在于禅法本身的技术革新，更在于将这一原本\"僧尼专属\"的深奥修行传统，转化为可为在家世俗大众普遍修习、且部分脱离特定宗教身份认同的\"普世\"身心训练方法，最终在20世纪后期演变为席卷全球的\"内观\"（Vipassana）与\"正念\"（Mindfulness）两场运动的共同源头。\n\n**雷迪尊者**（Ledi Sayadaw，1846—1923）是这场复兴运动公认的开创者，他在20世纪初对传统内观禅修法进行了系统性革新，使之能够为更广泛的世俗信众所修习，这一努力本身即构成了缅甸民众抵御英国殖民统治文化影响、进行本土佛教文化复兴的一部分。雷迪尊者一系法脉传承为：铁吉长老（Saya Thetgyi）—乌巴庆长老（Sayagyi U Ba Khin，缅甸政府审计总长、在家居士）—**葛印卡**（S.N. Goenka，1924—2013）。葛印卡自1969年起将此内观法门\"反哺\"其祖籍地印度，其后广传欧美、日本、澳洲、泰国、尼泊尔等地，发展出以十日为一期、面向不特定宗教背景大众开放的标准化内观课程，成为当代全球范围内传播最广的上座部禅修体系之一。\n\n与此并行发展、影响力同样深远的是**马哈希尊者**（Mahasi Sayadaw，1904—1982）一系，以《大念处经》为根本依据，系统建立起以\"标记\"（noting）当下身心现象为核心技术的内观禅法，1945年历时七个月完成缅文巨著《内观禅修手册》，战后在仰光\"佛陀教法中心\"广传其法，门下弟子遍及东南亚、进而传播至欧美，包括杰克·孔菲尔德（Jack Kornfield）、约瑟夫·葛斯坦（Joseph Goldstein）等在美国创立\"内观禅修社\"（Insight Meditation Society）的重要西方传法者，均直接或间接承此一系法脉。\n\n\n> **EN对应 · 2. The Twentieth-Century Burmese Vipassanā Revival: Ledi Sayadaw, Mahasi Sayadaw, U Ba Khin, and Goenka**\n>\n> The Theravāda śamatha-vipassanā tradition has continued unbroken for over two thousand years; from the late nineteenth into the early twentieth century, under British colonial rule, Burma underwent a far-reaching modern revival movement whose social and cultural significance lay not only in technical innovations to the meditation method itself, but, more fundamentally, in the transformation of what had previously been an esoteric practice tradition confined to the monastic order into a \"universal\" method of body-mind training that could be widely practiced by lay society at large, and that, to a considerable degree, could be detached from any specific religious identity—ultimately becoming, in the latter half of the twentieth century, the shared point of origin for two movements that would sweep the globe: \"Vipassana\" and \"Mindfulness.\"\n>\n> **Ledi Sayadaw** (1846–1923) is universally recognized as the founder of this revival movement; in the early twentieth century he carried out a systematic reform of traditional insight-meditation methods, making them accessible to a far broader range of lay practitioners—an effort that was itself part of the Burmese people's cultural resistance to British colonial influence and their broader movement of indigenous Buddhist revival. Ledi Sayadaw's lineage of transmission runs: Saya Thetgyi—Sayagyi U Ba Khin (auditor-general of the Burmese government, a lay practitioner)—**S.N. Goenka** (1924–2013). From 1969 onward, Goenka \"returned\" this insight-meditation teaching to his ancestral homeland of India, subsequently spreading it widely to Europe, the Americas, Japan, Australia, Thailand, Nepal, and elsewhere, developing a standardized ten-day course format open to the general public regardless of religious background—today one of the most widely propagated systems of Theravāda meditation practice in the world.\n>\n> Developing in parallel, and of no less profound an influence, is the lineage of **Mahasi Sayadaw** (1904–1982), which takes the *Satipaṭṭhāna Sutta* as its fundamental scriptural basis and establishes a system of insight meditation centered on the core technique of \"noting\" present-moment phenomena of body and mind. In 1945, after seven months of sustained effort, he completed his monumental Burmese-language work, the *Manual of Insight* (an English translation was not fully published until 2016, by Wisdom Publications); after the war he propagated this method widely from the Buddhasāsana Yeiktha center in Rangoon, and his disciples spread throughout Southeast Asia and subsequently to Europe and the Americas—including Jack Kornfield and Joseph Goldstein, the important Western Dharma-teachers who founded the Insight Meditation Society in the United States, both of whom trace their own lineage directly or indirectly back to this tradition.\n>\n\n### 三、正念运动的兴起及其与南传内观的关系\n\n\n马哈希内观传统经由孔菲尔德、葛斯坦等美国本土修行者的\"消化与转译\"，逐渐发展出适应西方社会文化心理特质的传播方式，与此同时，另一位深受禅修影响的美国学者乔·卡巴金（Jon Kabat-Zinn）则走出了一条更进一步\"去宗教化\"、\"临床化\"的道路——此即下文将述及的\"正念减压\"（MBSR）运动，其与南传止观传统之间千丝万缕而又不无张力的关系，值得在本文最后一部分单独详加讨论。\n\n\n\n> **EN对应 · 3. The Rise of the Mindfulness Movement and Its Relationship to Theravāda Insight Meditation**\n>\n> Through the \"digestion and translation\" carried out by Kornfield, Goldstein, and other American practitioners trained in the Mahasi insight tradition, this lineage gradually developed a mode of transmission adapted to the intellectual and cultural sensibilities of Western society. At the same time, another American scholar deeply influenced by meditative practice, Jon Kabat-Zinn, forged a path that went a step further still—one of \"de-religionization\" and \"clinicalization\"—giving rise to what is discussed below as the \"Mindfulness-Based Stress Reduction\" (MBSR) movement, whose relationship to the Theravāda śamatha-vipassanā tradition—intricately interwoven, yet not without its own tensions—deserves separate and detailed treatment in the final part of this study.\n>\n> ---\n>\n\n## 第十四部分　比较视野：中国本土的静虑传统（非佛教）\n\n\n作为对本项研究的必要补充，也响应笔者一贯秉持的跨宗教比较视角，本节简要考察两支虽非佛教、却在漫长历史中与佛教禅法发生过深刻互动、且在汉语文献中有时也被笼统冠以\"静坐\"等相近语汇的中国本土静虑传统：道家的心斋坐忘之学，与宋明理学的静坐工夫论。二者严格而言均不在\"禅\"（佛教意义上的 dhyāna）这一概念的本有范畴之内，故仅作为比较性、背景性材料处理，不与前述佛教诸禅法体系并列为本文正文的同等分量章节。\n\n\n> **EN对应 · Part Fourteen: A Comparative Perspective—Indigenous Chinese Traditions of Quiet Contemplation (Non-Buddhist)**\n>\n> As a necessary supplement to this study, and in keeping with the comparative cross-religious perspective this author has consistently maintained, this part briefly examines two traditions that, although not Buddhist, interacted deeply with Buddhist meditation over the course of a long history, and are sometimes loosely grouped together in Chinese-language sources under similar terms such as \"quiet sitting\": the Daoist tradition of \"fasting the mind\" and \"sitting in forgetfulness,\" and the quiet-sitting tradition of Song-Ming Neo-Confucianism. Strictly speaking, neither properly falls within the category of \"Chan\" (*dhyāna*) in its Buddhist sense, and so both are treated here only as comparative, background material, rather than being placed alongside the various Buddhist meditation systems discussed above as chapters of equal weight in the main body of this study.\n>\n\n### 一、庄子的\"心斋\"与\"坐忘\"\n\n\n《庄子》内篇中两则借孔子、颜回对话形式展开的著名寓言，历来被视为道家静虑修养论的源头性文本。《人间世》篇借孔子之口阐释\"心斋\"：\"若一志，无听之以耳而听之以心，无听之以心而听之以气。听止于耳，心止于符。气也者，虚而待物者也。唯道集虚，虚者，心斋也\"——即摒除感官与心智层面的分别执取，令心神虚静专一，以\"气\"之虚而待物的状态感通大道，此虚静空明之境即所谓\"心斋\"。《大宗师》篇则借颜回之口层层递进地展示\"坐忘\"境界的达成过程：先\"忘仁义\"，再\"忘礼乐\"，终至\"堕肢体，黜聪明，离形去知，同于大通\"——即彻底舍离形骸与心智的分别造作，与大道浑然为一，是道家修养论所能达到的最高精神自由境界。\n\n心斋、坐忘二说虽早出于战国中期，其\"虚静寡欲、物我两忘\"的精神旨趣，对后世佛教禅宗（尤其经\"格义\"阶段以老庄词汇比配般若空观概念的历史过程）与道教气功、内丹修炼理论，均产生了不可低估的深远影响，学界一般认为二者之间存在相当程度的双向渗透与话语借用关系，唯其具体历史脉络仍是佛道交涉史研究中的复杂课题，非本文所能详论。\n\n\n> **EN对应 · 1. Zhuangzi's \"Fasting the Mind\" and \"Sitting in Forgetfulness\"**\n>\n> Two celebrated parables in the Inner Chapters of the *Zhuangzi*, each cast in the form of a dialogue between Confucius and Yan Hui, have traditionally been regarded as the fountainhead texts of the Daoist tradition of contemplative self-cultivation. In the chapter \"In the World of Men\" (人間世), Confucius is made to expound \"fasting the mind\" (心齋): \"Unify your intention. Do not listen with your ears, but listen with your mind. Do not listen with your mind, but listen with your qi. Hearing stops at the ears; the mind stops at what tallies with it. But qi is empty, and waits on all things. The Way gathers in emptiness alone. Emptiness—this is the fasting of the mind\"—that is, one sets aside the discriminating grasp of both the senses and the intellect, allowing the spirit to become empty, quiescent, and unified, and, in this state of emptiness that \"waits upon\" things, one becomes attuned to the Way itself; this state of empty, quiescent clarity is precisely what is meant by \"fasting the mind.\" In the chapter \"The Great and Venerable Teacher\" (大宗師), Yan Hui is made to describe, in progressively deepening stages, the attainment of \"sitting in forgetfulness\" (坐忘): first \"forgetting benevolence and righteousness,\" then \"forgetting rites and music,\" and finally \"casting off the limbs and body, dismissing sight and hearing, departing from bodily form and abandoning knowledge, becoming one with the Great Pervader\"—that is, thoroughly relinquishing the discriminating constructions of both body and mind, becoming one, undivided, with the Way itself—the highest state of spiritual freedom attainable within the Daoist framework of self-cultivation.\n>\n> Though the doctrines of \"fasting the mind\" and \"sitting in forgetfulness\" first emerged as early as the mid-Warring States period, their spiritual orientation of \"emptiness, quiescence, few desires; forgetting both self and world\" exerted an influence, impossible to overstate, on both later Buddhist Chan (particularly during the period of \"matching concepts,\" when Prajñāpāramitā emptiness-concepts were rendered through the vocabulary of Laozi and Zhuangzi) and on the theoretical traditions of Daoist breathing-cultivation and internal alchemy. Scholars generally hold that a considerable degree of mutual, bidirectional interpenetration and borrowing of discourse occurred between the two traditions—though the precise historical pathways of this exchange remain a complex subject within the study of Buddhist-Daoist interaction, one beyond the scope of full treatment here.\n>\n\n### 二、宋明理学的静坐传统：从\"主静\"到\"主敬\"再到\"江门之学\"\n\n\n宋明理学（道学）诸大家的修养工夫论，同样构成了一条与佛教禅观既相区隔又深受影响、绵延数百年的\"静虑\"支线。北宋周敦颐（1017—1073）《太极图说》提出\"圣人定之以中正仁义而主静，立人极焉\"，后世概括为\"主静立人极\"说，是理学静坐工夫论的开山纲领；然而周敦颐门下二程（程颢、程颐）虽曾从学于周氏，其思想体系却转而以\"天理\"为核心本体，修养工夫相应地由\"主静\"转向\"主敬\"——即通过持续保持\"敬\"的心理状态以体认至实不虚之天理，而非专注于\"静坐\"这一特定的身体姿态与修行形式本身，这一\"从主静到主敬\"的转变，本身即反映出理学内部对\"是否应特别强调静坐\"这一问题存在的深刻分歧。\n\n至南宋朱熹，对周敦颐\"主静立人极\"说作出详尽注解，将\"中正仁义\"析为\"阳动\"\"阴静\"两面，而\"静者常为主\"，仍在教理阐释层面延续、深化了\"主静\"一脉的理论脉络。真正将\"静坐\"发展为一套具体可操作、且被后学明确视为\"入道法门\"的修养技术者，是明代陈献章（1428—1500，白沙先生，广东新会人，江门学派创始人）：其为学宗旨即所谓\"于静坐中养出端倪\"，通过静坐澄心以体认、涵养道德本心之自然显发，此说经其弟子湛若水（1466—1560，甘泉先生）修正、发展为\"随处体认天理\"——湛若水明确主张天理并不专赖\"默坐澄心\"方可体认，无论静坐抑或应事接物，皆可随处体认——白沙心学、甘泉心学与其后大盛的阳明心学，共同构成有明一代心学思潮的主体。王阳明门下王畿曾将阳明\"师门\"教法概括为三种入悟途径：\"从知解而得者谓之解悟\"\"从静坐而得者谓之证悟\"\"从人事练习而得者……谓之彻悟\"，并将陈白沙的主静工夫归入\"证悟\"一路而非阳明本人更为看重的\"彻悟\"一路，这一评价虽出自阳明后学立场、未必公允，却清晰勾勒出宋明理学内部\"静坐\"作为一种修证工夫的历史位置及其争议——它既是理学工夫论谱系中真实存在、绵延数百年的一条重要支线，又始终未能取得如天台一心三观、僧稠四念处那样在佛教内部\"独立成宗\"式的地位，而是始终依附并服务于理学\"存天理、复本心\"这一根本性的儒家伦理关怀。\n\n\n\n> **EN对应 · 2. The Quiet-Sitting Tradition in Song-Ming Neo-Confucianism: From \"Emphasizing Quiescence\" to \"Emphasizing Reverent Attentiveness\" to the \"Jiangmen Learning\"**\n>\n> The tradition of cultivational discipline among the great masters of Song-Ming Neo-Confucianism (Daoxue) likewise forms a strand—closely interwoven with, yet independent of, Buddhist contemplative practice—of \"quiet contemplation\" spanning several centuries. Zhou Dunyi (周敦頤, 1017–1073) of the Northern Song, in his *Taijitu Shuo* (太極圖說, \"Explanation of the Diagram of the Supreme Ultimate\"), proposed that \"the sage settles these [the Way of Heaven, Earth, and Human] through centrality, rightness, benevolence, and righteousness, emphasizing quiescence, and thereby establishes the ultimate standard for humanity\"—later summarized as the doctrine of \"emphasizing quiescence to establish the ultimate standard for humanity\" (主靜立人極), the founding statement of Neo-Confucian quiet-sitting cultivational theory. Yet the Cheng brothers (Cheng Hao and Cheng Yi), although they had studied under Zhou Dunyi, turned in their own philosophical system toward \"principle\" (li, 天理) as the core ontological category, and their corresponding cultivational discipline shifted accordingly from \"emphasizing quiescence\" to \"emphasizing reverent attentiveness\" (主敬)—that is, apprehending the substantial and unwavering principle of Heaven through the sustained maintenance of a psychological state of \"reverent attentiveness\" (focus, gravity, and freedom from laxity), rather than focusing on \"quiet sitting\" as a particular bodily posture and form of practice in its own right. This shift \"from emphasizing quiescence to emphasizing reverent attentiveness\" in itself reflects a profound divergence of opinion within Neo-Confucianism over whether quiet sitting ought to be given special emphasis at all.\n>\n> By the time of Zhu Xi in the Southern Song, an extensive commentary had been produced on Zhou Dunyi's doctrine of \"emphasizing quiescence to establish the ultimate standard for humanity,\" analyzing \"centrality, rightness, benevolence, and righteousness\" into the two aspects of \"yang in motion\" and \"yin in quiescence,\" with \"quiescence ever serving as the ruling principle\"—still working, at the level of doctrinal exegesis, to extend and deepen the theoretical lineage of \"emphasizing quiescence.\" The figure who truly developed \"quiet sitting\" into a concrete, practicable technique of cultivation—one explicitly regarded by his own later followers as a \"gateway into the Way\"—was Chen Xianzhang (陳獻章, 1428–1500, styled Baisha, a native of Xinhui in Guangdong, founder of the Jiangmen school) of the Ming dynasty: his fundamental teaching held that one should \"nurture the sprouts [of moral feeling] from within quiet sitting\" (於靜坐中養出端倪)—cultivating and clarifying the mind through quiet sitting so as to apprehend and nourish the natural manifestation of the innate moral mind (its \"sprouts\"). This teaching was subsequently revised and developed by his disciple Zhan Ruoshui (湛若水, 1466–1560, styled Ganquan) into the doctrine of \"apprehending the Principle of Heaven wherever one may be\" (隨處體認天理)—Zhan Ruoshui held explicitly that the Principle of Heaven need not be apprehended solely through \"quietly sitting to clarify the mind\"; whether through quiet sitting or through engagement with worldly affairs, the Principle of Heaven could be apprehended anywhere. The Baisha school of mind-learning, the Ganquan school of mind-learning, and the subsequently ascendant Yangming school of mind-learning together constitute the main body of the Ming-dynasty intellectual current known as \"the learning of the mind\" (xinxue). Wang Ji, a disciple of Wang Yangming, once summarized his master's own teaching as encompassing three distinct paths to awakening: \"awakening attained through intellectual understanding is called 'analytical awakening'; awakening attained through quiet sitting is called 'verificational awakening'; and awakening attained through practical engagement with worldly affairs... is called 'thorough awakening'\"—and he classified Chen Baisha's practice of emphasizing quiescence under the category of \"verificational awakening,\" rather than the \"thorough awakening\" that Wang Yangming himself held in higher regard. Though this assessment, offered from the standpoint of a later follower of Yangming, may not be entirely impartial, it nonetheless clearly delineates the historical position—and the controversy surrounding that position—that \"quiet sitting\" occupied as a form of cultivational discipline within Song-Ming Neo-Confucianism: it was, on the one hand, a genuinely significant strand within the broader genealogy of Neo-Confucian cultivational theory, persisting across several centuries; yet, on the other hand, it never achieved the kind of independent, school-founding status that Tiantai's \"threefold contemplation within a single mind\" or Sengchou's \"four foundations of mindfulness\" achieved within Buddhism, but remained instead subordinate to, and in service of, Neo-Confucianism's own more fundamental Confucian ethical concern: \"preserving the Principle of Heaven, recovering the original mind.\"\n>\n> ---\n>\n\n## 第十五部分　现代衍生：世俗化\"正念\"运动的多重渊源\n\n\n20世纪后期以来，源出佛教禅观传统、却经过相当程度\"去宗教化\"与\"临床化\"转型的\"正念\"（mindfulness）概念与相关训练方法，在全球范围内——包括医学、心理治疗、教育、企业管理乃至体育训练等世俗领域——获得了空前广泛的传播，构成了当代\"禅法在六祖南宗以外\"最引人注目的当代衍生现象，值得作为本项研究的收尾一并纳入考察。\n\n这一运动最具代表性的奠基人物是分子生物学出身的乔·卡巴金（Jon Kabat-Zinn，1944— ），1979年他在美国麻省大学医学院创立\"减压诊所\"，开发出为期八周、结合坐禅、身体扫描、正念伸展与哈达瑜伽的\"正念减压\"（Mindfulness-Based Stress Reduction，MBSR）课程体系，1990年出版《多灾多难的生命》（*Full Catastrophe Living*）一书，此后MBSR课程扩展至全球逾700家医院、诊所与研究机构，深刻影响了心身医学、临床心理学乃至企业培训等诸多领域，2014年美国《时代》周刊更以\"正念革命\"为题作专题报道。\n\n值得特别辨析的是，卡巴金本人的修行渊源实际上相当多元，并不能简单归结为对南传内观传统的单一继承：据其本人及相关传记资料，他早年曾师从菲利普·凯普乐（Philip Kapleau）、一行禅师（Thich Nhat Hanh）、崇山禅师（Seung Sahn）等禅宗（Zen）系统的老师——其中一行禅师属越南临济宗、崇山禅师属韩国曹溪宗，二者严格而言均属\"六祖一系\"在东亚的历史性延伸，是南宗禅系统本身而非本文主题意义上的\"六祖以外\"传统——同时也是\"剑桥禅中心\"（Cambridge Zen Center）的创始成员之一，其个人修行实践还兼摄哈达瑜伽、南传毗婆舍那内观、及曹洞宗与印度不二论吠檀多（Advaita Vedanta）的教法。换言之，MBSR的实际思想渊源是南宗禅、南传上座部内观、瑜伽等多元传统经卡巴金本人熔铸整合的产物，而非学界与大众媒体通常简化理解的\"MBSR=世俗化的南传内观\"这一单一谱系叙事；这一辨析本身，恰恰呼应了本文通篇所强调的方法论警醒：任何对\"禅法谱系\"的简单化、单线化叙述，都容易掩盖其实际历史生成过程中错综复杂的多源交汇性质。\n\n\n\n> **EN对应 · Part Fifteen: A Modern Derivative—The Multiple Origins of the Secularized \"Mindfulness\" Movement**\n>\n> Since the latter half of the twentieth century, the concept of \"mindfulness\"—and the associated training methods derived from Buddhist contemplative tradition, yet substantially transformed through a process of \"de-religionization\" and \"clinicalization\"—have achieved unprecedented, worldwide diffusion across secular domains including medicine, psychotherapy, education, corporate management, and even athletic training. This constitutes the most conspicuous contemporary derivative phenomenon of \"Chan beyond Huineng's Southern School\" in the present day, and merits inclusion as the concluding subject of this study.\n>\n> The most representative founding figure of this movement is Jon Kabat-Zinn (b. 1944), trained originally in molecular biology. In 1979 he founded the Stress Reduction Clinic at the University of Massachusetts Medical School, developing the eight-week \"Mindfulness-Based Stress Reduction\" (MBSR) course, which combines seated meditation, the body scan, mindful stretching, and hatha yoga. In 1990 he published *Full Catastrophe Living*; MBSR courses have since expanded to more than 700 hospitals, clinics, and research institutions worldwide, exerting a profound influence on psychosomatic medicine, clinical psychology, corporate training, and numerous other fields—in 2014, *Time* magazine ran a feature story under the title \"The Mindful Revolution.\"\n>\n> It is particularly worth clarifying that Kabat-Zinn's own roots in practice are, in fact, considerably more diverse, and cannot simply be reduced to a single line of inheritance from the Theravāda insight-meditation tradition: according to his own accounts and related biographical material, he studied in his early years under teachers within the Zen tradition, including Philip Kapleau, Thich Nhat Hanh, and Seung Sahn—of whom Thich Nhat Hanh belongs to the Vietnamese Lâm Tế (Linji) lineage (the Liễu Quán and Trúc Lâm traditions, too, were profoundly shaped by Chinese Chan) and Seung Sahn to the Korean Jogye Order—both of which, strictly speaking, belong to the historical eastward extension of \"Huineng's lineage\" itself into East Asia, and are thus part of the Southern School Chan system proper, not instances of the \"beyond Huineng\" tradition that is this study's subject. Kabat-Zinn was also a founding member of the Cambridge Zen Center, and his own personal practice further encompasses hatha yoga, Theravāda vipassanā insight meditation, and the teachings of the Sōtō Zen school and Advaita Vedanta. In other words, the actual intellectual roots of MBSR are the product of Kabat-Zinn's own personal synthesis of multiple traditions—Southern-School Chan, Theravāda insight meditation, and yoga among them—rather than the far simpler genealogical narrative commonly assumed in both scholarly and popular media accounts, that \"MBSR equals a secularized form of Theravāda insight meditation.\" This clarification itself echoes the methodological caution that has run throughout this entire study: any oversimplified, single-lineage narrative of \"the genealogy of Chan traditions\" risks obscuring the intricate, multi-source confluence that actually characterizes their historical formation.\n>\n>\n\n> **EN对应 · Part Fifteen: A Modern Derivative—The Multiple Origins of the Secularized \"Mindfulness\" Movement**\n>\n> Since the latter half of the twentieth century, the concept of \"mindfulness\"—and the associated training methods derived from Buddhist contemplative tradition, yet substantially transformed through a process of \"de-religionization\" and \"clinicalization\"—have achieved unprecedented, worldwide diffusion across secular domains including medicine, psychotherapy, education, corporate management, and even athletic training. This constitutes the most conspicuous contemporary derivative phenomenon of \"Chan beyond Huineng's Southern School\" in the present day, and merits inclusion as the concluding subject of this study.\n>\n> The most representative founding figure of this movement is Jon Kabat-Zinn (b. 1944), trained originally in molecular biology. In 1979 he founded the Stress Reduction Clinic at the University of Massachusetts Medical School, developing the eight-week \"Mindfulness-Based Stress Reduction\" (MBSR) course, which combines seated meditation, the body scan, mindful stretching, and hatha yoga. In 1990 he published *Full Catastrophe Living*; MBSR courses have since expanded to more than 700 hospitals, clinics, and research institutions worldwide, exerting a profound influence on psychosomatic medicine, clinical psychology, corporate training, and numerous other fields—in 2014, *Time* magazine ran a feature story under the title \"The Mindful Revolution.\"\n>\n> It is particularly worth clarifying that Kabat-Zinn's own roots in practice are, in fact, considerably more diverse, and cannot simply be reduced to a single line of inheritance from the Theravāda insight-meditation tradition: according to his own accounts and related biographical material, he studied in his early years under teachers within the Zen tradition, including Philip Kapleau, Thich Nhat Hanh, and Seung Sahn—of whom Th 以及依《华严经》\"法界缘起\"而立、由杜顺至澄观递相完备化的华严法界三观（四法界）体系。这几支传统均产生并流传于汉语佛教文化圈内，与达摩诸系共享大乘佛教的基本教理框架，却各自依据不同的经典依据、师承系统、修证技术独立发展。\n\n**其三，同源于印度大乘—金刚乘佛教、却经由不同地理路径独立发展的密教诸传统。** 汉传唐密（三密相应、曼荼罗观想）与藏传密教（大手印、大圆满）虽同溯印度晚期密教渊源，历史上却鲜有直接交涉，各自在中国内地与青藏高原发展出高度精微、自成体系的甚深禅观修证次第——而藏地密教禅观史，更因摩诃衍\"顿渐之诤\"与蜀地禅系的先期西传，与本文第六部分所述的\"六祖以外\"诸系产生了直接的历史交涉。\n\n**其四，与达摩系分享共同印度渊源、却在部派佛教分裂后独立保存至今的南传上座部止观传统。** 其\"四禅八定\"框架本是\"禅\"字最原初的意涵所指，20世纪以来经雷迪尊者、马哈希尊者、乌巴庆、葛印卡等一系列缅甸禅师的现代化革新，进一步演化出面向全球在家大众开放的内观运动，并与卡巴金所创MBSR一道，共同构成了当代世俗社会中最广为人知的\"禅法\"衍生形态。\n\n**其五，与佛教禅法长期互动却本非佛教的中国本土静虑传统。** 道家心斋坐忘之学与宋明理学静坐工夫论，虽在概念范畴上不属佛教\"禅\"（dhyāna）之本义，却在中国思想史的具体历史进程中与佛教禅观发生过深刻的双向渗透，构成理解\"禅\"这一概念在汉语文化语境中复杂外延的必要参照系。\n\n最后需要再次强调本文所秉持的方法论立场：以上诸传统之所以长期在大众认知乃至部分教内论述中被\"六祖南宗禅\"这一后出却影响力空前的叙事所遮蔽，很大程度上是历史书写本身的产物——灯录体史书\"教外别传、以心传心\"的叙事策略、神会及其后继者的持续论辩努力、及南宗禅自身在宋代以降取得的压倒性社会文化地位，共同塑造了一种将\"禅\"几乎等同于\"南宗禅宗\"的通俗理解定式。20世纪以来敦煌文献的发现、考古材料（如小南海石窟）的出土、以及胡适、印顺、柳田圣山直至艾宏略等几代学者的持续文献学与历史学考订工作，正是在不断打破这一定式、逐步恢复\"禅\"作为一个远比\"南宗禅\"更为古老、更为多元的宗教实践范畴之本来面目。本文的写作，正是在这一学术脉络的延长线上所作的一次系统性梳理尝试。\n\n\n> **EN对应 · Conclusion: The Genealogical Landscape of the Various Meditation Traditions, and Methodological Reflections**\n>\n> Drawing together the findings of the fifteen parts above, the traditions surveyed under the heading \"Chan or meditation methods beyond Huineng's Southern School\" may broadly be grouped into the following several genealogical strands—strands that are at once relatively independent of one another and yet deeply interwoven and interpenetrating:\n>\n> **First, branches internal to the Bodhidharma lineage that nonetheless failed to enter the orthodox \"Huineng—Five Houses and Seven Schools\" narrative.** This is the newly emphasized focus of this study following the mid-course correction to its scope: the original teachings of the five shared patriarchs—Bodhidharma, Huike, Sengcan, Daoxin, and Hongren—themselves (the Two Entrances and Four Practices, wall-contemplation, the East Mountain Teaching's doctrine of \"guarding the mind\"), together with the philological problem of \"layered accretion\" in the source material; the Sengchou lineage's four-foundations-of-mindfulness meditation, whose standing in the Northern Dynasties at one point eclipsed that of the Bodhidharma–Huike lineage; the gradual-cultivation meditation teaching of Shenxiu's Northern School, \"Dharma-Master of the Two Capitals, Teacher to Three Emperors\" in the High Tang; the independently developing Prajñā-based Chan of the Oxhead School, which would later resonate strikingly with the Southern School's own sudden-awakening doctrine; and the Jingzhong and Baotang schools of Sichuan, which formed a three-way rivalry with the Northern and Southern Schools and spread still farther, into Tibet. Together, these traditions reveal a core historical fact: the now-familiar single-line genealogy of Chan, with its \"special transmission outside the teachings, mind-to-mind transmission,\" is the product of a prolonged contest over historical narrative-construction, waged by Shenhui and his successors—it is not the natural, sole possible course that Chan's development had to take. At numerous specific junctures in this history, \"orthodoxy\" and \"mainstream status\" simply failed to coincide; the power of contingent factors—imperial patronage, geographical and institutional resources, the vigor of one's later disciples—to shape the historical record has been no less significant than the relative depth or sophistication of doctrine itself.\n>\n> **Second, independent Chinese traditions that share a common origin with, yet diverged from, the various branches of the Bodhidharma lineage, tracing their doctrinal roots to different bodies of Indian scripture and treatise literature.** This includes the An Shigao–Kumārajīva lineage of translated meditation sūtras, already systematically established before Bodhidharma's arrival in China; the Tiantai zhiguan system, developing independently with doctrinal roots tracing directly to Nāgārjunian Madhyamaka; the Pure Land buddha-recollection samādhi tradition, traceable to the *Pratyutpanna Samādhi Sūtra*; the five-fold vijñaptimātratā contemplation, grounded in the *Yogācārabhūmi-śāstra*; and the Huayan Dharmadhātu contemplation (the four Dharmadhātus), grounded in the *Avataṃsaka Sūtra*'s \"dependent origination of the Dharmadhātu\" and progressively completed from Dushun through Chengguan. All of these traditions arose and circulated within the Chinese-language Buddhist cultural sphere, sharing the basic doctrinal framework of Mahāyāna Buddhism with the various branches of the Bodhidharma lineage, yet each developing independently on the basis of its own distinct scriptural foundations, lineages of transmission, and techniques of practice and realization.\n>\n> **Third, Esoteric Buddhist traditions sharing a common origin in Indian Mahāyāna–Vajrayāna Buddhism, yet developing independently along different geographical pathways.** Chinese Tang Esotericism (the correspondence of the three mysteries, maṇḍala visualization) and Tibetan Esoteric Buddhism (Mahāmudrā, Dzogchen), though both tracing back to late Indian Esoteric origins, historically had little in the way of direct contact, each developing, within China proper and on the Tibetan plateau respectively, highly refined and internally coherent systems of profound contemplative practice and realization—and Tibet's own history of Esoteric contemplative practice, moreover, through Moheyan's \"Debate of Sudden and Gradual\" and the earlier transmission of the Sichuan lineages, came into direct historical contact with the very \"beyond Huineng\" traditions described in Part Six of this study.\n>\n> **Fourth, the Theravāda śamatha-vipassanā tradition, sharing a common Indian origin with the various branches of the Bodhidharma lineage yet preserved independently, intact, since the schism of the early Buddhist schools, down to the present day.** Its framework of \"the four jhānas and eight samādhis\" is the very origin of what \"Chan\" originally signified; since the twentieth century, through the modernizing reforms of a series of Burmese meditation masters—Ledi Sayadaw, Mahasi Sayadaw, U Ba Khin, Goenka, and others—it has further given rise to an insight-meditation movement open to lay practitioners the world over, which, together with the MBSR movement founded by Kabat-Zinn, now together constitute the most widely recognized contemporary derivative forms of \"Chan\" practice in secular society.\n>\n> **Fifth, indigenous Chinese traditions of quiet contemplation that, while not Buddhist, interacted deeply with Buddhist meditation over a long history.** The Daoist tradition of \"fasting the mind\" and \"sitting in forgetfulness,\" and the Song-Ming Neo-Confucian tradition of quiet-sitting cultivational discipline, though falling outside the proper conceptual category of Buddhist \"Chan\" (*dhyāna*), nonetheless underwent profound bidirectional interpenetration with Buddhist contemplative practice over the specific course of Chinese intellectual history, providing an essential frame of reference for understanding the full complexity of what \"Chan\" has come to mean within the Chinese-language cultural context.\n>\n> A final point bears re-emphasis regarding the methodological stance this study has maintained throughout: the reason these various traditions have, for so long, been overshadowed in popular understanding—and even within a portion of internal Buddhist discourse—by the later-arising yet extraordinarily influential narrative of \"Huineng's Southern School,\" is, to a considerable degree, itself a product of historical narrative-construction: the transmission-record literature's rhetorical strategy of \"a special transmission outside the teachings, mind-to-mind transmission,\" the sustained polemical efforts of Shenhui and his successors, and the overwhelming social and cultural dominance the Southern School itself achieved from the Song dynasty onward, together shaped a popular understanding that treats \"Chan\" as all but synonymous with \"the Southern School of the Chan sect.\" The twentieth-century discovery of the Dunhuang manuscripts, the excavation of archaeological materials such as the Xiaonanhai caves, and the sustained philological and historical scholarship of successive generations of scholars—from Hu Shi and Yinshun to Yanagida Seizan and, more recently, Eric Greene—represent precisely the ongoing effort to break through this popular understanding, and gradually to restore \"Chan\" to its true original character: a category of religious practice far more ancient, and far more plural, than \"the Southern School\" alone. The writing of this study is itself an attempt at a systematic synthesis undertaken along the continuing trajectory of that scholarly effort.\n>\n\n> **EN对应 · Conclusion: The Genealogical Landscape of the Various Meditation Traditions, and Methodological Reflections**\n>\n> Drawing together the findings of the fifteen parts above, the traditions surveyed under the heading \"Chan or meditation methods beyond Huineng's Southern School\" may broadly be grouped into the following several genealogical strands—strands that are at once relatively independent of one another and yet deeply interwoven and interpenetrating:\n>\n> **First, branches internal to the Bodhidharma lineage that nonetheless failed to enter the orthodox \"Huineng—Five Houses and Seven Schools\" narrative.** This is the newly emphasized focus of this study following the mid-course correction to its scope: the original teachings of the five shared patriarchs—Bodhidharma, Huike, Sengcan, Daoxin, and Hongren—themselves (the Two Entrances and Four Practices, wall-contemplation, the East Mountain Teaching's doctrine of \"guarding the mind\"), together with the philological problem of \"layered accretion\" in the source material; the Sengchou lineage's four-foundations-of-mindfulness meditation, whose standing in the Northern Dynasties at one point eclipsed that of the Bodhidharma–Huike lineage; the gradual-cultivation meditation teaching of Shenxiu's Northern School, \"Dharma-Master of the Two Capitals, Teacher to Three Emperors\" in the High Tang; the independently developing Prajñā-based Chan of the Oxhead School, which would later resonate strikingly with the Southern School's own sudden-awakening doctrine; and the Jingzhong and Baotang schools of Sichuan, which formed a three-way rivalry with the Northern and Southern Schools and spread still farther, into Tibet. Together, these traditions reveal a core historical fact: the now-familiar single-line genealogy of Chan, with its \"special transmission outside the teachings, mind-to-mind transmission,\" is the product of a prolonged contest over historical narrative-construction, waged by Shenhui and his successors—it is not the natural, sole possible course that Chan's development had to take. At numerous specific junctures in this history, \"orthodoxy\" and \"mainstream status\" simply failed to coincide; the power of contingent factors—imperial patronage, geographical and institutional resources, the vigor of one's later disciples—to shape the historical record has been no less significant than the relative depth or sophistication of doctrine itself.\n>\n> **Second, independent Chinese traditions that share a common origin with, yet diverged from, the various branches of the Bodhidharma lineage, tracing their doctrinal roots to different bodies of Indian scripture and treatise literature.** This includes the An Shigao–Kumārajīva lineage of translated meditation sūtras, already systematically established before Bodhidharma's arrival in China; the Tiantai zhiguan system, developing independently with doctrinal roots tracing directly to Nāgārjunian Madhyamaka; the Pure Land buddha-recollection samādhi tradition, traceable to the *Pratyutpanna Samādhi Sūtra*; the five-fold vijñaptimātratā contemplation, grounded in the *Yogācārabhūmi-śāstra*; and the Huayan Dharmadhātu contemplation (the four Dharmadhātus), grounded in the *Avataṃsaka Sūtra*'s \"dependent origination of the Dharmadhātu\" and progressively completed from Dushun through Chengguan. All of these traditions arose and circulated within the Chinese-language Buddhist cultural sphere, sharing the basic doctrinal framework of Mahāyāna Buddhism with the various branches of the Bodhidharma lineage, yet each developing independently on the basis of its own distinct scriptural foundations, lineages of transmission, and techniques of practice and realization.\n>\n> **Third, Esoteric Buddhist traditions sharing a common origin in Indian Mahāyāna–Vajrayāna Buddhism, yet developing independently along different geographical pathways.** Chinese Tang Esotericism (the correspondence of the three mysteries, maṇḍala visualization) and Tibetan Esoteric Buddhism (Mahāmudrā, Dzogchen), though both tracing back to late Indian Esoteric origins, historically had little in the way of direct contact, each developing, within China proper and on the Tibetan plateau respectively, highly refined and internally coherent systems of profound contemplative practice and realization—and Tibet's own history of Esoteric contemplative practice, moreover, through Moheyan's \"Debate of Sudden and Gradual\" and the earlier transmission of the Sichuan lineages, came into direct historical contact with the very \"beyond Huineng\" traditions described in Part Six of this study.\n>\n> **Fourth, the Theravāda śamatha-vipassanā tradition, sharing a common Indian origin with the various branches of the Bodhidharma lineage yet preserved independently, intact, since the schism of the early Buddhist schools, down to the present day.** Its framework of \"the four jhānas and eight samādhis\" is the very origin of what \"Chan\" originally signified; since the twentieth century, through the modernizing reforms of a series of Burmese meditation masters—Ledi Sayadaw, Mahasi Sayadaw, U Ba Khin, Goenka, and others—it has further given rise to an insight-meditation movement open to lay practitioners the world over, which, together with the MBSR movement founded by Kabat-Zinn, now together constitute the most widely recognized contemporary derivative forms of \"Chan\" practice in secular society.\n>\n> **Fifth, indigenous Chinese traditions of quiet contemplation that, while not Buddhist, interacted deeply with Buddhist meditation over a long history.** The Daoist tradition of \"fasting the mind\" and \"sitting in forgetfulness,\" and the Song-Ming Neo-Confucian tradition of quiet-sitting cultivational discipline, though falling outside the proper conceptual category of Buddhist \"Chan\" (*dhyāna*), nonetheless underwent profound bidirectional interpenetration with Buddhist contemplative practice over the specific course of Chinese intellectual history, providing an essential frame of reference for understanding the full complexity of what \"Chan\" has come to mean within the Chinese-language cultural context.\n>\n> A final point bears re-emphasis regarding the methodological stance this study has maintained throughout: the reason these various traditions have, for so long, been overshadowed in popular understanding—and even within a portion of internal Buddhist discourse—by the later-arising yet extraordinarily influential narrative of \"Huineng's Southern School,\" is, to a considerable degree, itself a product of historical narrative-construction: the transmission-record literature's rhetorical strategy of \"a special transmission outside the teachings, mind-to-mind transmission,\" the sustained polemical efforts of Shenhui and his successors, and the overwhelming social and cultural dominance the Southern School itself achieved from the Song dynasty onward, together shaped a popular understanding that treats \"Chan\" as all but synonymous with \"the Southern School of the Chan sect.\" The twentieth-century discovery of the Dunhuang manuscripts, the excavation of archaeological materials such as the Xiaonanhai caves, and the sustained philological and historical scholarship of successive generations of scholars—from Hu Shi and Yinshun to Yanagida Seizan and, more recently, Eric Greene—represent precisely the ongoing effort to break through this popular understanding, and gradually to restore \"Chan\" to its true original character: a category of religious practice far more ancient, and far more plural, than \"the Southern School\" alone. The writing of this study is itself an attempt at a systematic synthesis undertaken along the continuing trajectory of that scholarly effort.\n>\n\n## 附：值得进一步深入研究的方向\n\n\n鉴于本文性质为综览全局的系统性研究，以下若干专题若作为独立的深度研究对象，料想仍有大量可以继续深挖的空间，谨此列出供后续参考：\n\n- 神秀北宗禅法的专题深度研究（《观心论》《大乘无生方便门》的义理结构完整重构，及其与晚明《楞严经》相关论述可能存在的隐性关联）\n- 牛头宗《绝观论》的完整义理脉络解析，及其\"无情有性\"说对天台湛然、乃至宋代以降三教心性论融合的具体影响路径\n- 蜀地净众宗、保唐宗与《六祖坛经》\"无念、无相、无住\"三句术语之间关系的专题文献学考订\n- 摩诃衍\"顿渐之诤\"藏汉双语文献的完整比较研究\n- 僧稠系禅法的专题深度研究（含《稠禅师意》等相关文献的义理重构、与三阶教信行一系的具体师承关系考订）\n- 艾宏略\"Chan Before Chan\"及\"The Secrets of Buddhist Meditation\"二书的完整论证脉络与其在西方学界引发的后续讨论\n- 大手印、大圆满二系在见地与修证次第上的详细比较研究\n- 缅甸内观复兴运动的社会史脉络（含其与缅甸民族主义、反殖民文化运动的关系）\n- 华严法界观（尤其杜顺《法界观门》与《五教止观》）与天台止观在观行结构上的专题比较研究\n\n\n> **EN对应 · Appendix: Directions for Further Research**\n>\n> Given that this study is, by its nature, a broad-ranging systematic survey, the following topics, were any one of them to be pursued as an independent subject of in-depth research, would surely offer considerable further room for excavation; they are listed here for future reference:\n>\n> - A dedicated, in-depth study of Shenxiu's Northern School meditation teaching (a complete reconstruction of the doctrinal structure of the *Guanxin Lun* and the *Dasheng Wusheng Fangbian Men*, and an investigation of the possible latent connections between this teaching and the late-Ming *Śūraṅgama Sūtra*)\n> - A complete analysis of the doctrinal structure of the Oxhead School's *Jueguan Lun*, and a study of the specific pathways through which its doctrine that \"even the insentient possess Buddha-nature\" influenced Zhanran of the Tiantai school and, more broadly, the Song-dynasty and later synthesis of mind-nature theory across the \"three teachings\" of Confucianism, Buddhism, and Daoism\n> - A dedicated philological investigation into the relationship between the terminology of the Sichuan Jingzhong and Baotang schools and the \"no-thought, no-characteristic, no-abiding\" three-phrase formula of the *Platform Sūtra*\n> - A complete comparative study of the Chinese- and Tibetan-language sources concerning Moheyan's \"Debate of Sudden and Gradual\"\n> - A dedicated, in-depth study of Sengchou-lineage meditation teaching (including a doctrinal reconstruction of related texts such as the *Chou Chanshi Yi*, and a detailed examination of its specific lineage entanglements with Xinxing's Three Levels movement)\n> - A complete account of the argumentative structure of Eric Greene's *Chan Before Chan* and *The Secrets of Buddhist Meditation*, and of the subsequent scholarly discussion these two works have generated in Western academia\n> - A detailed comparative study of the views and stages of practice and realization in the Mahāmudrā and Dzogchen systems\n> - A social-historical study of the Burmese vipassanā revival movement (including its relationship to Burmese nationalism and the broader anti-colonial cultural movement)\n> - A dedicated comparative study of the contemplative structures of the Huayan Dharmadhātu contemplation (particularly Dushun's *Fajie Guan Men* and *Wujiao Zhiguan*) and Tiantai zhiguan\n>\n\n> **EN对应 · Appendix: Directions for Further Research**\n>\n> Given that this study is, by its nature, a broad-ranging systematic survey, the following topics, were any one of them to be pursued as an independent subject of in-depth research, would surely offer considerable further room for excavation; they are listed here for future reference:\n>\n> - A dedicated, in-depth study of Shenxiu's Northern School meditation teaching (a complete reconstruction of the doctrinal structure of the *Guanxin Lun* and the *Dasheng Wusheng Fangbian Men*, and an investigation of the possible latent connections between this teaching and the late-Ming *Śūraṅgama Sūtra*)\n> - A complete analysis of the doctrinal structure of the Oxhead School's *Jueguan Lun*, and a study of the specific pathways through which its doctrine that \"even the insentient possess Buddha-nature\" influenced Zhanran of the Tiantai school and, more broadly, the Song-dynasty and later synthesis of mind-nature theory across the \"three teachings\" of Confucianism, Buddhism, and Daoism\n> - A dedicated philological investigation into the relationship between the terminology of the Sichuan Jingzhong and Baotang schools and the \"no-thought, no-characteristic, no-abiding\" three-phrase formula of the *Platform Sūtra*\n> - A complete comparative study of the Chinese- and Tibetan-language sources concerning Moheyan's \"Debate of Sudden and Gradual\"\n> - A dedicated, in-depth study of Sengchou-lineage meditation teaching (including a doctrinal reconstruction of related texts such as the *Chou Chanshi Yi*, and a detailed examination of its specific lineage entanglements with Xinxing's Three Levels movement)\n> - A complete account of the argumentative structure of Eric Greene's *Chan Before Chan* and *The Secrets of Buddhist Meditation*, and of the subsequent scholarly discussion these two works have generated in Western academia\n> - A detailed comparative study of the views and stages of practice and realization in the Mahāmudrā and Dzogchen systems\n> - A social-historical study of the Burmese vipassanā revival movement (including its relationship to Burmese nationalism and the broader anti-colonial cultural movement)\n> - A dedicated comparative study of the contemplative structures of the Huayan Dharmadhātu contemplation (particularly Dushun's *Fajie Guan Men* and *Wujiao Zhiguan*) and Tiantai zhiguan\n>\n\n## 主要参考文献（举要）\n\n\n**汉译佛教原典与早期禅籍（按大正藏／敦煌写本著录）**\n\n安世高译《佛说大   if(a.title_sub)h+='  <div style="font-size:0.85em;color:var(--text2)">'+a.title_sub+'</div>';
  if(a.version)h+='  <div style="font-size:0.78em;color:var(--text2);margin-top:6px">'+a.version+'</div>';
  if(a.back && a.back.tab){
    h+='  <a href="../tabs/'+a.back.tab+'.html" style="font-size:0.75em;color:var(--blue);margin-top:10px;display:inline-block">← 返回 '+a.back.label+'</a>';
  }
  h+='</div>';

  // ── 导览 ──
  if(a.meta){
    h+='<div class="section" style="border-left:4px solid var(--gold)"><h2>📌 导览</h2>';
    h+='<p style="font-size:0.8em;line-height:1.9;white-space:pre-line">'+_mdInline(a.meta)+'</p></div>';
  }

  // ── 自动目录 ──
  if(embed.toc.length){
    h+='<div class="section"><h2>🧭 本文目录</h2>';
    h+='<div style="column-width:250px;column-gap:26px;font-size:0.8em;line-height:1.75">';
    embed.toc.forEach(function(t){
      var pad=(t.lv>2?'padding-left:'+((t.lv-2)*16)+'px;':'');
      h+='<div style="'+pad+'"><a href="#'+t.id+'" style="color:'+(t.lv===2?'var(--gold)':'var(--text2)')+';text-decoration:none">'+t.text+'</a></div>';
    });
    h+='</div></div>';
  }

  // ── 全文 ──
  h+='<div class="section" style="border-left:4px solid var(--gold)" id="article-full">';
  h+='<h2 style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px"><span>📄 '+a.title+' · 全文</span>'
    +'<button id="article-en-toggle" class="f-nav-btn" onclick="toggleArticleEN()" title="在「含英文批注」与「仅中文正文」之间切换显示">🌐 英文批注：显示</button></h2>';
  h+=embed.html;
  h+='</div>';

  // ── 页脚 ──
  h+='<div style="margin-top:18px;padding-top:10px;border-top:1px solid var(--line);font-size:0.74em;color:var(--text2)">';
  h+='<a href="index.html" style="color:var(--blue);text-decoration:none">📚 返回独立文章目录</a>';
  if(a.back && a.back.tab){
    h+=' · <a href="../tabs/'+a.back.tab+'.html" style="color:var(--blue);text-decoration:none">'+a.back.label+'</a>';
  }
  h+='</div>';

  root.innerHTML=h;

  // ── 阅读模式：识别「英文/术语批注」块，支持仅中文正文切换 ──
  _initArticleENMode();

  // ── 支持 #锚点 直达（目录跳转用真实 id 锚点）──
  if(location.hash){
    setTimeout(function(){
      var el=document.getElementById(location.hash.slice(1));
      if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    },80);
  }
}

if(document.readyState!=='loading'){renderArticle();}
else{document.addEventListener('DOMContentLoaded',renderArticle);}

// ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|🔑|术语格义|主题对读注|卷末批注)/.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);
  }
}
function _applyArticleENMode(){
  var full=document.getElementById('article-full');
  var btn=document.getElementById('article-en-toggle');
  var hide=(sessionStorage.getItem('article_en_hide')||'')==='1';
  if(full) full.classList.toggle('en-hidden', hide);
  if(btn) btn.textContent=hide?'🌐 英文批注：展开':'🌐 英文批注：显示';
}
</script>
</body>
</html>
