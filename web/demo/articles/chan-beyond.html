var ARTICLE = {"id": "chan-beyond", "file": "articles/chan-beyond.html", "title": "六祖南宗禅以外的禅法传统", "title_sub": "禅法全览 · 达摩系诸支与南宗以外诸禅法 · 中英对读", "icon": "🧘", "version": "", "meta": "", "doc": "docs/禅法传统_中英对读_合并.md", "doc_md": "# 六祖南宗禅以外的禅法传统研究\n### ——达摩系诸支与南宗以外诸禅法的全面考察\n\n> **EN对应 · Document Title**\n>\n> **EN对应 · Chan Traditions Beyond Huineng's Southern School**\n>\n> A Comprehensive Study of the Bodhidharma Lineage's Other Branches and Meditation Systems Outside It\n\n## 导论：范畴界定、研究框架与方法论\n\n\n\"禅\"，梵语 dhyāna（禅那）、巴利语 jhāna 的音译简称，本义为\"静虑\"\"思惟修\"，是印度沙门传统（尤其瑜伽行者传统）中普遍使用的心一境性修习方法，后被佛教吸收为\"三无漏学\"（戒定慧）之\"定学\"的核心内容，广泛见于《瑜伽经》八支瑜伽第七支、原始佛教四禅八定等语境。因此\"禅\"字在最广义上，其外延远远超出汉传佛教史上以菩提达摩为初祖、经慧可、僧璨、道信、弘忍，至惠能而\"教外别传\"、后分化为五家七宗（临济、曹洞、沩仰、云门、法眼）及东传朝鲜半岛（曹溪宗诸派）、日本（临济宗、曹洞宗、黄檗宗）、越南（了观、竹林、临济诸派）的宗派性\"禅宗\"（Chan School）。\n\n本项研究即以此为出发点：系统考察在这一以达摩为标志性初祖的宗派谱系之外，佛教（及与佛教密切互动的中国本土思想）传统中一切具有实质意义的\"禅\"或\"禅法\"体系——既包括达摩之前已经存在、且在相当长时间内比达摩一系更具社会影响力的汉传早期禅法，也包括与达摩系同时代却循独立法脉发展的天台止观、净土禅观、唯识观法，还包括汉藏两支密教的甚深禅观，以及南传上座部保存至今、并在20世纪掀起全球性复兴运动的止观传统。最后，为求\"全面\"之实，本文亦将简要涉及与佛教禅法长期互动、有时甚至被笼统地也称为\"静坐\"或与之比较的儒家（宋明理学）静坐传统与道家静虑传统，并简述当代世俗化\"正念\"（mindfulness）运动的渊源。\n\n需要预先说明的方法论要点有三：\n\n**第一，史料层级的区分。** 汉传佛教史上，教内传灯史书（如《景德传灯录》《传法正宗记》）与教史类文献（如《高僧传》《续高僧传》《宋高僧传》）对同一人物、同一事件往往有不同的、甚至彼此矛盾的记载，加之20世纪初敦煌文献的发现，从根本上动摇了许多传统\"正统\"叙事的可靠性。本文将尽量以时代较早、可信度较高的史料（如道宣《续高僧传》相对于晚出的灯录文献）为基础，并在关键处明确标注现有研究的确定性程度与学界分歧，不作无根据的确定性断言。\n\n**第二，教内与学术两种视角的并重。** 对每一禅法体系，本文既尝试呈现其内部教理立场下的自我理解（如天台宗自身的师资传承观、宁玛派对大圆满法源的信仰叙述），也引入现代佛教学术研究（尤其是20世纪以来的文献学、历史学考订成果）对这些自我理解的检验与修正，两者并置而不简单地以一方否定另一方。\n\n**第三，边界的划定——一处重要的范围修正。** 若以整个\"达摩一系禅宗\"（即菩提达摩至五家七宗的完整法脉）为排除范围，失之过宽：这会将达摩、慧可、僧璨、道信、弘忍等\"共同祖师\"本身的原始教法，连同盛唐一度声势凌驾于南宗之上的神秀\"北宗\"、旁出独立发展的\"牛头宗\"，以及蜀地\"净众宗\"\"保唐宗\"等一系列在后世\"教外别传\"正统叙事形成过程中逐渐被边缘化、乃至从主流历史书写中\"落选\"出局的早期禅法支派，也一并排除在外——而这些支派恰恰是达摩系禅法内部最富历史张力、也最能体现\"正统\"与\"主流\"之历史生成过程的部分，理应是本项研究的重点而非盲区。\n\n因此，本文将排除范围精确限定为：由荷泽神会所极力标举、经《坛经》定型、以惠能为\"六祖\"、其后开出五家七宗（临济、曹洞、沩仰、云门、法眼）、并东传朝鲜半岛（曹溪宗诸派）、日本（临济宗、曹洞宗、黄檗宗）、越南（了观、竹林、临济诸派）的**\"六祖一系南宗禅\"**——这是历史上最终\"胜出\"、并延续至今的禅宗主流法脉。凡不属于此一惠能—南宗谱系认同、或历史上独立于此一谱系发展的一切\"禅\"或\"禅法\"体系，均属本文考察范围；这样一来，达摩至弘忍的共同早期禅法、神秀北宗、牛头宗、蜀地禅系等，便一并纳入了正文的重点章节，而不再仅作边界性的脚注处理。\n\n全文共分十五个部分：（一）达摩以前的早期汉译禅法；（二）与达摩系并行独立的北朝禅法主流——僧稠系；（三）达摩至弘忍：共同的早期禅法与\"东山法门\"的形成；（四）北宗禅——神秀一系及其历史地位的沉浮；（五）牛头宗——法融一系的般若禅；（六）蜀地禅系：净众宗、保唐宗及其西传吐蕃；（七）天台止观体系；（八）净土禅观；（九）唯识观法；（十）华严法界观；（十一）汉传密教禅观；（十二）藏传密教禅观（大手印与大圆满）；（十三）南传上座部止观与20世纪内观复兴；（十四）比较视野下的中国本土静虑传统；（十五）现代世俗化正念运动。末附结语、后续研究方向建议与主要参考文献。\n\n\n\n> **EN对应 · Introduction: Scope, Framework, and Methodology**\n>\n> \"Chan\" (禪) is a transliteration of the Sanskrit *dhyāna* (禪那), corresponding to the Pali *jhāna*, meaning \"quiet contemplation\" or \"cultivation through reflection.\" It denotes a family of one-pointed concentration practices widespread across Indian śramaṇa traditions—particularly yogic lineages—later absorbed into Buddhism as the core of the \"training in concentration\" (定學) within the Threefold Training (śīla-samādhi-prajñā, 戒定慧). It appears broadly in contexts ranging from the seventh limb of the Yoga Sutra's eightfold path to the \"four dhyānas and eight samādhis\" (四禪八定) of early Buddhism. In its broadest sense, then, \"Chan\" extends far beyond the sectarian \"Chan School\" that Chinese Buddhist history traces from Bodhidharma (菩提達摩) as founding patriarch, through Huike (慧可), Sengcan (僧璨), Daoxin (道信), and Hongren (弘忍), to Huineng (惠能)—whose \"special transmission outside the teachings\" then branched into the Five Houses and Seven Schools (Linji, Caodong, Guiyang, Yunmen, Fayan), and which subsequently spread to the Korean peninsula (the Jogye Order and its branches), Japan (Rinzai, Sōtō, Ōbaku), and Vietnam (Liễu Quán, Trúc Lâm, and Lâm Tế lineages).\n>\n> This study takes that distinction as its point of departure: it systematically surveys every substantively independent \"Chan\" or meditation system within Buddhism—and within Chinese indigenous thought insofar as it interacted closely with Buddhism—that falls outside this sectarian lineage marked by Bodhidharma as its emblematic founder. This includes early Chinese meditation traditions that predate Bodhidharma and that, for a considerable period, carried more social influence than the Bodhidharma lineage itself; it includes the Tiantai (天台) contemplative system, Pure Land meditative practice, and Yogācāra contemplation, each of which developed along an independent lineage contemporaneous with the Bodhidharma school; it includes the profound contemplative systems of both the Chinese and Tibetan branches of Esoteric Buddhism; and it includes the Theravāda śamatha-vipassanā tradition, preserved intact to this day, which sparked a worldwide revival movement in the twentieth century. Finally, in the interest of genuine comprehensiveness, this study will also briefly address two traditions that are not Buddhist per se but that interacted deeply with Buddhist meditation and are sometimes loosely grouped with it under the rubric of \"quiet sitting\"—the Confucian (Song-Ming Neo-Confucian) quiet-sitting tradition and the Daoist tradition of stilling the mind—and will conclude with a brief account of the origins of the modern, secularized \"mindfulness\" movement.\n>\n> Three methodological points require advance clarification:\n>\n> **First, the stratification of source material.** In the history of Chinese Buddhism, sectarian transmission histories (such as the *Jingde Chuandeng Lu* 景德傳燈錄 and *Chuanfa Zhengzong Ji* 傳法正宗記) frequently diverge from—and sometimes flatly contradict—the more historiographical genre of monk biographies (such as the *Gaoseng Zhuan* 高僧傳, *Xu Gaoseng Zhuan* 續高僧傳, and *Song Gaoseng Zhuan* 宋高僧傳) on the same figures and events; the discovery of the Dunhuang manuscripts in the early twentieth century further destabilized the reliability of many traditional \"orthodox\" narratives at their foundations. This study relies, wherever possible, on earlier and more credible sources (Daoxuan's *Xu Gaoseng Zhuan*, for instance, is generally preferred over the later transmission-record literature), and explicitly flags the degree of certainty and the state of scholarly disagreement at key junctures, rather than asserting unfounded certainty.\n>\n> **Second, the parallel treatment of insider and academic perspectives.** For each meditation system examined, this study attempts both to present its own internal doctrinal self-understanding (such as the Tiantai school's own view of its dharma-transmission, or the Nyingma school's own account of Dzogchen's provenance) and to bring modern academic Buddhological scholarship—particularly the philological and historical findings of the twentieth century onward—to bear on, test, and where necessary revise, that self-understanding. The two are placed side by side rather than having one simply cancel out the other.\n>\n> **Third, an important mid-course correction to the scope.** Defining the excluded zone as the entirety of the \"Bodhidharma-lineage Chan School\" (i.e., the complete lineage running from Bodhidharma through the Five Houses and Seven Schools) would cast too wide a net: it would exclude the original teachings of the \"shared patriarchs\" themselves—Bodhidharma, Huike, Sengcan, Daoxin, and Hongren—along with Shenxiu's (神秀) \"Northern School,\" which at one point in the High Tang eclipsed the Southern School in prominence; the independently-developing Oxhead School (Niutou School, 牛頭宗); and a series of early meditation lineages—including the Jingzhong (淨眾) and Baotang (保唐) schools of Sichuan—that were gradually marginalized, and eventually written out of the mainstream historical record altogether, in the course of the later \"special transmission outside the teachings\" orthodox narrative taking shape. These are precisely the branches richest in historical tension within the Bodhidharma lineage, and the ones that most vividly illustrate how \"orthodoxy\" and \"mainstream\" status come to be historically constructed—they ought to be a central focus of this study, not a blind spot.\n>\n> This study therefore defines the excluded zone precisely as: the lineage vigorously championed by Heze Shenhui (荷澤神會), codified through the *Platform Sūtra* (壇經), which takes Huineng as the \"Sixth Patriarch\" and subsequently branches into the Five Houses and Seven Schools (Linji, Caodong, Guiyang, Yunmen, Fayan), and which spread eastward to the Korean peninsula (the various branches of the Jogye Order), Japan (Rinzai, Sōtō, and Ōbaku), and Vietnam (the Liễu Quán, Trúc Lâm, and Lâm Tế lineages)—in short, **\"Huineng's Southern School.\"** This is the branch that ultimately \"won\" the historical contest and survives as the mainstream lineage today. Every \"Chan\" or meditation system that does not identify with this Huineng–Southern School lineage, or that developed historically independent of it, falls within the scope of this study. This means that the shared early teachings from Bodhidharma through Hongren, the Northern School under Shenxiu, the Oxhead School, and the Sichuan lineages are now included as central chapters in their own right, rather than being relegated to boundary-case footnotes.\n>\n> The study is organized into fifteen parts: (1) early Chinese translations of meditation texts predating Bodhidharma; (2) the Sengchou (僧稠) lineage, the dominant Northern Dynasties meditation tradition developing in parallel with the Bodhidharma school; (3) Bodhidharma through Hongren: the shared early teachings and the formation of the \"East Mountain Teaching\"; (4) the Northern School under Shenxiu and the rise and fall of its historical standing; (5) the Oxhead School and Farong's (法融) Prajñā-based Chan; (6) the Sichuan lineages—the Jingzhong and Baotang schools—and their transmission into Tibet; (7) the Tiantai contemplative system; (8) Pure Land meditation; (9) Yogācāra contemplation; (10) the Huayan (華嚴) Dharmadhātu contemplation; (11) Chinese Esoteric Buddhist meditation; (12) Tibetan Esoteric meditation (Mahāmudrā and Dzogchen); (13) Theravāda śamatha-vipassanā and the twentieth-century vipassanā revival; (14) a comparative look at indigenous Chinese traditions of quiet contemplation; and (15) the modern, secularized mindfulness movement. A conclusion, suggestions for further research, and a select bibliography follow.\n>\n>\n\n> **EN对应 · Introduction: Scope, Framework, and Methodology**\n>\n> \"Chan\" (禪) is a transliteration of the Sanskrit *dhyāna* (禪那), corresponding to the Pali *jhāna*, meaning \"quiet contemplation\" or \"cultivation through reflection.\" It denotes a family of one-pointed concentration practices widespread across Indian śramaṇa traditions—particularly yogic lineages—later absorbed into Buddhism as the core of the \"training in concentration\" (定學) within the Threefold Training (śīla-samādhi-prajñā, 戒定慧). It appears broadly in contexts ranging from the seventh limb of the Yoga Sutra's eightfold path to the \"four dhyānas and eight samādhis\" (四禪八定) of early Buddhism. In its broadest sense, then, \"Chan\" extends far beyond the sectarian \"Chan School\" that Chinese Buddhist history traces from Bodhidharma (菩提達摩) as founding patriarch, through Huike (慧可), Sengcan (僧璨), Daoxin (道信), and Hongren (弘忍), to Huineng (惠能)—whose \"special transmission outside the teachings\" then branched into the Five Houses and Seven Schools (Linji, Caodong, Guiyang, Yunmen, Fayan), and which subsequently spread to the Korean peninsula (the Jogye Order and its branches), Japan (Rinzai, Sōtō, Ōbaku), and Vietnam (Liễu Quán, Trúc Lâm, and Lâm Tế lineages).\n>\n> This study takes that distinction as its point of departure: it systematically surveys every substantively independent \"Chan\" or meditation system within Buddhism—and within Chinese indigenous thought insofar as it interacted closely with Buddhism—that falls outside this sectarian lineage marked by Bodhidharma as its emblematic founder. This includes early Chinese meditation traditions that predate Bodhidharma and that, for a considerable period, carried more social influence than the Bodhidharma lineage itself; it includes the Tiantai (天台) contemplative system, Pure Land meditative practice, and Yogācāra contemplation, each of which developed along an independent lineage contemporaneous with the Bodhidharma school; it includes the profound contemplative systems of both the Chinese and Tibetan branches of Esoteric Buddhism; and it includes the Theravāda śamatha-vipassanā tradition, preserved intact to this day, which sparked a worldwide revival movement in the twentieth century. Finally, in the interest of genuine comprehensiveness, this study will also briefly address two traditions that are not Buddhist per se but that interacted deeply with Buddhist meditation and are sometimes loosely grouped with it under the rubric of \"quiet sitting\"—the Confucian (Song-Ming Neo-Confucian) quiet-sitting tradition and the Daoist tradition of stilling the mind—and will conclude with a brief account of the origins of the modern, secularized \"mindfulness\" movement.\n>\n> Three methodological points require advance clarification:\n>\n> **First, the stratification of source material.** In the history of Chinese Buddhism, sectarian transmission histories (such as the *Jingde Chuandeng Lu* 景德傳燈錄 and *Chuanfa Zhengzong Ji* 傳法正宗記) frequently diverge from—and sometimes flatly contradict—the more historiographical genre of monk biographies (such as the *Gaoseng Zhuan* 高僧傳, *Xu Gaoseng Zhuan* 續高僧傳, and *Song Gaoseng Zhuan* 宋高僧傳) on the same figures and events; the discovery of the Dunhuang manuscripts in the early twentieth century further destabilized the reliability of many traditional \"orthodox\" narratives at their foundations. This study relies, wherever possible, on earlier and more credible sources (Daoxuan's *Xu Gaoseng Zhuan*, for instance, is generally preferred over the later transmission-record literature), and explicitly flags the degree of certainty and the state of scholarly disagreement at key junctures, rather than asserting unfounded certainty.\n>\n> **Second, the parallel treatment of insider and academic perspectives.** For each meditation system examined, this study attempts both to present its own internal doctrinal self-understanding (such as the Tiantai school's own view of its dharma-transmission, or the Nyingma school's own account of Dzogchen's provenance) and to bring modern academic Buddhological scholarship—particularly the philological and historical findings of the twentieth century onward—to bear on, test, and where necessary revise, that self-understanding. The two are placed side by side rather than having one simply cancel out the other.\n>\n> **Third, an important mid-course correction to the scope.** Defining the excluded zone as the entirety of the \"Bodhidharma-lineage Chan School\" (i.e., the complete lineage running from Bodhidharma through the Five Houses and Seven Schools) would cast too wide a net: it would exclude the original teachings of the \"shared patriarchs\" themselves—Bodhidharma, Huike, Sengcan, Daoxin, and Hongren—along with Shenxiu's (神秀) \"Northern School,\" which at one point in the High Tang eclipsed the Southern School in prominence; the independently-developing Oxhead School (Niutou School, 牛頭宗); and a series of early meditation lineages—including the Jingzhong (淨眾) and Baotang (保唐) schools of Sichuan—that were gradually marginalized, and eventually written out of the mainstream historical record altogether, in the course of the later \"special transmission outside the teachings\" orthodox narrative taking shape. These are precisely the branches richest in historical tension within the Bodhidharma lineage, and the ones that most vividly illustrate how \"orthodoxy\" and \"mainstream\" status come to be historically constructed—they ought to be a central focus of this study, not a blind spot.\n>\n> This study therefore defines the excluded zone precisely as: the lineage vigorously championed by Heze Shenhui (荷澤神會), codified through the *Platform Sūtra* (壇經), which takes Huineng as the \"Sixth Patriarch\" and subsequently branches into the Five Houses and Seven Schools (Linji, Caodong, Guiyang, Yunmen, Fayan), and which spread eastward to the Korean peninsula (the various branches of the Jogye Order), Japan (Rinzai, Sōtō, and Ōbaku), and Vietnam (the Liễu Quán, Trúc Lâm, and Lâm Tế lineages)—in short, **\"Huineng's Southern School.\"** This is the branch that ultimately \"won\" the historical contest and survives as the mainstream lineage today. Every \"Chan\" or meditation system that does not identify with this Huineng–Southern School lineage, or that developed historically independent of it, falls within the scope of this study. This means that the shared early teachings from Bodhidharma through Hongren, the Northern School under Shenxiu, the Oxhead School, and the Sichuan lineages are now included as central chapters in their own right, rather than being relegated to boundary-case footnotes.\n>\n> The study is organized into fifteen parts: (1) early Chinese translations of meditation texts predating Bodhidharma; (2) the Sengchou (僧稠) lineage, the dominant Northern Dynasties meditation tradition developing in parallel with the Bodhidharma school; (3) Bodhidharma through Hongren: the shared early teachings and the formation of the \"East Mountain Teaching\"; (4) the Northern School under Shenxiu and the rise and fall of its historical standing; (5) the Oxhead School and Farong's (法融) Prajñā-based Chan; (6) the Sichuan lineages—the Jingzhong and Baotang schools—and their transmission into Tibet; (7) the Tiantai contemplative system; (8) Pure Land meditation; (9) Yogācāra contemplation; (10) the Huayan (華嚴) Dharmadhātu contemplation; (11) Chinese Esoteric Buddhist meditation; (12) Tibetan Esoteric meditation (Mahāmudrā and Dzogchen); (13) Theravāda śamatha-vipassanā and the twentieth-century vipassanā revival; (14) a comparative look at indigenous Chinese traditions of quiet contemplation; and (15) the modern, secularized mindfulness movement. A conclusion, suggestions for further research, and a select bibliography follow.\n>\n> ---\n>\n\n## 第一部分　达摩以前：汉译佛典中的早期禅法（约2世纪—5世纪初）\n\n\n在菩提达摩本人的生卒年代与来华年代迄今仍无定论（学界一般系于5世纪末至6世纪初，即南朝宋末至梁初）的情况下，中国佛教史上实际上早已存在一套历时三百余年、脉络清晰的禅修传译传统。这套传统不仅早于达摩，而且其影响持续渗透进达摩系及后世几乎一切汉传禅法之中——换言之，\"禅经\"传统构成了整个汉传佛教禅观文化的地基。\n\n\n> **EN对应 · Part One: Before Bodhidharma—Early Meditation Texts in Chinese Translation (c. 2nd–early 5th Century)**\n>\n> Bodhidharma's own birth and death dates, and even the date of his arrival in China, remain unsettled (scholarly opinion generally places his period of activity in the late fifth to early sixth century, i.e., the transition from the Liu Song to the Liang dynasty). Yet Chinese Buddhist history had already possessed, for some three centuries before this, a clearly documented tradition of translating and transmitting meditation texts. This tradition not only predates Bodhidharma; its influence continued to permeate the Bodhidharma lineage and nearly every subsequent tradition of Chinese Buddhist meditation. In other words, the \"meditation sūtra\" (禪經) tradition forms the very foundation on which the entire edifice of Chinese Buddhist contemplative culture was built.\n>\n\n### 一、安世高系：说一切有部禅法与\"数息守意\"\n\n\n汉传佛教史上第一位系统翻译禅修典籍的译师，是东汉桓帝建和二年（148）抵达洛阳的安息（今伊朗东北部）僧人安世高。据梁代慧皎《高僧传》记载，安世高\"博晓经藏，尤精阿毗昙学，讽持禅经，备尽其妙\"，在华二十余年间译出经论三十余部，其中与禅修直接相关者以《佛说大安般守意经》（二卷）最为重要，另有《阴持入经》《禅行法想经》《道地经》（据僧伽罗刹《修行道地经》节译）等。\n\n\"安般守意\"是梵语\"安那般那念\"（ānāpānasmṛti，出入息念）的音译加意译合成词：\"安那\"指入息，\"般那\"指出息，\"守意\"即以念（正念）摄持散乱之心。此经所述禅法以观察呼吸为下手方便，展开为数息、相随、止、观、还、净\"六妙门\"的次第，同时结合不净观、慈心观、因缘观、界分别观（连同数息观合称\"五停心观\"）以对治贪、嗔、痴、思觉纷飞及诸烦恼等分之心。其禅学立场属说一切有部（Sarvāstivāda）系统，重阿毗昙式的精密心所分析，与后世达摩系\"直指人心\"的顿悟取径在方法论上迥然不同。\n\n《安般守意经》的传本历史本身也是一段值得注意的文献学公案：三国吴康僧会为之作注（今仅存其序），东晋支愍度、谢敷、支遁、道安等亦相继为之注疏，然诸家注本均已散佚。20世纪学界一度认为传世《大安般守意经》已非安世高原译，而是后世译文与注释混编而成的\"扩充本\"；1999年，日本学者落合俊典在大阪府天野山金刚寺发现更接近原译面貌的《（小）安般守意经》古写本，为此经文献层次的厘清提供了新材料，敦煌遗书中亦存有相关残卷（如S4221号）。这一发现史本身即提示我们：对早期禅经的研究高度依赖写本文献学的持续进展，许多结论仍具有开放性。\n\n\n> **EN对应 · 1. An Shigao's Lineage: Sarvāstivādin Meditation and \"Mindfulness of Breathing\"**\n>\n> The first translator to systematically render meditation texts into Chinese was An Shigao (安世高), a monk from Parthia (Anxi 安息, in present-day northeastern Iran) who reached Luoyang in the second year of the Jianhe reign of Emperor Huan of the Eastern Han (148 CE). According to the *Gaoseng Zhuan* compiled by Huijiao of the Liang dynasty, An Shigao was \"thoroughly versed in the scriptural canon, especially expert in Abhidharma studies, and recited the meditation sūtras, having mastered their subtleties to the utmost.\" Over more than twenty years in China he translated upward of thirty works; among those directly concerned with meditation, the most important is the *Scripture on the Mindfulness of In-and-Out Breathing* (Foshuo Da Anban Shouyi Jing 佛說大安般守意經, two fascicles), alongside the *Yinchiru Jing* (陰持入經), the *Chanxing Faxiang Jing* (禪行法想經), and the *Daodi Jing* (道地經, an abridged translation from Saṅgharakṣa's *Yogācārabhūmi*, i.e. the *Xiuxing Daodi Jing*).\n>\n> \"Ānāpāna-smṛti\" (安般守意) is a compound transliteration-cum-translation of the Sanskrit *ānāpānasmṛti* (\"mindfulness of in- and out-breath\"): \"ana\" refers to inhalation, \"pana\" to exhalation, and \"shouyi\" (守意, \"guarding the mind\") renders *smṛti*, mindfulness that holds the scattered mind in check. The meditation method this scripture describes takes the observation of the breath as its point of entry, unfolding through the \"six wondrous gates\" (六妙門) of counting, following, stopping, contemplating, returning, and purifying, in combination with the contemplation of impurity, loving-kindness, dependent origination, and the analysis of the elements (which, together with breath-counting, make up the \"five methods for stilling the mind,\" 五停心觀) as antidotes to craving, aversion, delusion, scattered discursive thought, and mixed afflictions. Doctrinally it belongs to the Sarvāstivādin (說一切有部) system, emphasizing the fine-grained analysis of mental factors characteristic of Abhidharma—a methodology strikingly different from the later Bodhidharma lineage's approach of \"directly pointing to the mind.\"\n>\n> The textual history of the *Anban Shouyi Jing* is itself a noteworthy case study in philology: Kang Senghui of the Wu kingdom during the Three Kingdoms period wrote a commentary on it (only his preface survives today), and Zhi Mindu, Xie Fu, Zhi Dun, and Dao'an of the Eastern Jin all subsequently wrote sub-commentaries, though all of these have since been lost. Twentieth-century scholarship at one point held that the transmitted *Da Anban Shouyi Jing* was no longer An Shigao's original translation but rather a later \"expanded edition\" in which translated text and commentary had become intermingled; in 1999 the Japanese scholar Ochiai Toshinori discovered, at Kongō-ji temple on Mount Amano in Osaka Prefecture, an older manuscript of a \"(Lesser) Anban Shouyi Jing\" that more closely approximates the original translation, providing new material for sorting out the textual strata of this scripture; related fragments also survive among the Dunhuang manuscripts (e.g., S.4221). This discovery history in itself suggests that research on the early meditation sūtras remains heavily dependent on the ongoing progress of manuscript philology, and that many conclusions remain provisional.\n>\n\n### 二、鸠摩罗什系：五门禅与大乘禅要的初步整合\n\n\n后秦弘始三年（401）鸠摩罗什抵长安，此后十余年间在译出《大品般若经》《法华经》《维摩诘经》《中论》《百论》《十二门论》等般若中观类经论的同时，也系统译出一批禅修典籍，主要有：\n\n- 《坐禅三昧经》（又称《禅经》《菩萨禅法经》《禅法要》，弘始四年即402年译出）：此经并非罗什个人所造，而是汇集婆须蜜、僧伽罗叉、沤波崛、僧伽斯那、勒比丘、马鸣、鸠摩罗陀等七家禅要而成的汇编本，故有\"关中禅经\"之称（与稍后佛陀跋陀罗所译\"庐山禅经\"相对）。上卷详述对治贪欲、嗔恚、愚痴、思觉纷飞及诸烦恼等分心态的\"五门禅法\"，即不净观、慈心观、因缘观、数息观（阿那般那）、念佛观，分别对应五种根本烦恼倾向；下卷则续说四禅、四无色定、五通、四念处等声闻禅观次第，最后并及菩萨五门禅法与三法忍，以马鸣所造二十偈作结，兼具说一切有部与大乘视角。\n- 《禅法要解》（二卷，弘始四年至十四年间陆续译出，又称《禅要经》）：不逐句注解，而是提要式地讲解禅修要法，涉及净观、不净观、四禅、四无量心、四空定、四谛观及慈悲喜舍诸法门，收于《大正藏》第十五册。\n- 另有《思惟略要法》《禅秘要经》等，据《出三藏记集》《历代三宝记》著录，同属这一时期系统弘传禅法的努力。\n\n罗什门下僧睿在《关中出禅经序》中回顾说，在罗什东来之前，中土所传的禅法文献\"虽是其事，既不根悉，又无受法\"，即缺乏完整的修学次第与传承依据，直到罗什携来诸家禅要，\"禅法\"才在中国获得了较为系统的义理与方法基础。值得注意的是，这批禅经本身即是印度、西域多位禅师（僧伽罗叉等）修学经验的汇编整理，而非出自某一人之创见，其\"集众家所长\"的性质与后世强调单线\"以心传心\"祖统的禅宗叙事方式形成鲜明对照。\n\n\n> **EN对应 · 2. Kumārajīva's Lineage: The Five Gates of Chan and the Early Synthesis of Mahāyāna Meditation Essentials**\n>\n> Kumārajīva (鳩摩羅什) reached Chang'an in the third year of the Hongshi reign of the Later Qin (401 CE). Over the following decade or so, alongside translating the *Larger Prajñāpāramitā Sūtra*, the *Lotus Sūtra*, the *Vimalakīrti Sūtra*, the *Mūlamadhyamakakārikā*, the *Śata-śāstra*, and the *Dvādaśanikāya-śāstra*—works of the Prajñāpāramitā and Madhyamaka corpus—he also systematically translated a body of meditation texts, chief among them:\n>\n> - The *Zuochan Sanmei Jing* (坐禪三昧經, also known as the *Chan Jing*, *Bodhisattva Chanfa Jing*, or *Chanfa Yao*; translated in the fourth year of Hongshi, 402 CE): this text was not composed by Kumārajīva himself but is a compilation drawing on the meditation teachings of seven masters—Vasumitra, Saṅgharakṣa, Upagupta, Saṅghasena, the Bhikṣu Le, Aśvaghoṣa, and Kumāralāta—hence its alternative name, the \"Guanzhong Chan Jing\" (關中禪經, \"Meditation Scripture of the Guanzhong Region\"), a designation that pairs it with the \"Lushan Chan Jing\" (廬山禪經, \"Meditation Scripture of Mount Lu\") translated somewhat later by Buddhabhadra. The upper fascicle sets out in detail the \"five gates of Chan\" (五門禪法) for counteracting the mental states of craving, aversion, delusion, scattered discursive thought, and evenly-mixed afflictions: contemplation of impurity, loving-kindness contemplation, contemplation of dependent origination, mindfulness of breathing (ānāpāna), and buddha-recollection contemplation, each corresponding to one of the five root afflictive tendencies; the lower fascicle goes on to treat the four dhyānas, the four formless attainments, the five supernormal powers, the four foundations of mindfulness, and other śrāvaka-vehicle contemplative stages, concluding with the bodhisattva's five gates and the three forbearances, capped by twenty verses attributed to Aśvaghoṣa—the whole combining Sarvāstivādin and Mahāyāna perspectives.\n> - The *Chanfa Yaojie* (禪法要解, two fascicles, translated in stages between the fourth and fourteenth years of Hongshi, also known as the *Chanyao Jing*): rather than a line-by-line commentary, this text offers a summary exposition of essential meditation methods, covering the contemplations of purity and impurity, the four dhyānas, the four immeasurables, the four formless attainments, contemplation of the four noble truths, and the practices of loving-kindness, compassion, sympathetic joy, and equanimity; it is preserved in fascicle fifteen of the Taishō canon.\n> - Also from this period, per the catalogue records of the *Chu Sanzang Ji Ji* and the *Lidai Sanbao Ji*, are the *Siwei Lüeyao Fa* (思惟略要法) and the *Chan Miyao Jing* (禪祕要經), part of the same systematic effort to propagate meditation methods in this era.\n>\n> Sengrui, a disciple of Kumārajīva, recalled in his *Preface to the Meditation Scriptures Issued from Guanzhong* that before Kumārajīva's arrival in the East, the meditation literature circulating in China \"though covering the subject matter, lacked thorough grounding and offered no method of reception\"—that is, it lacked a complete curriculum of practice and a basis of transmission—and that only once Kumārajīva brought the essential teachings of the various masters did \"Chan method\" acquire a relatively systematic doctrinal and methodological foundation in China. It is worth noting that this body of meditation sūtras was itself a compiled synthesis of the practical experience of multiple Indian and Central Asian meditation masters (Saṅgharakṣa and others), rather than the insight of any single originating figure—a \"drawing together of the strengths of many houses\" that stands in sharp contrast to the later Chan narrative's emphasis on a single unbroken lineage of \"mind-to-mind transmission.\"\n>\n\n### 三、\"达摩多罗禅经\"：一桩具有典范意义的历史性名号淆乱\n\n\n在早期禅经谱系中，有一部经典的名称本身即构成一则值得深入辨析的学术公案，对于厘清\"达摩\"字号与达摩以前禅法之间的关系极具方法论意义。\n\n此经原名《修行方便禅经》（又称《禅经修行方便》《修行地不净观经》），由佛陀跋陀罗（Buddhabhadra，一译佛驮跋陀罗，迦毗罗卫释迦族后裔）应庐山慧远之请，于东晋义熙七年至八年（411—412）间在庐山译出，内容为罽宾（今克什米尔一带）禅师佛大先（Buddhasena，一译佛陀斯那）所传的说一切有部系渐修禅法，故与\"关中禅经\"（《坐禅三昧经》）并称，号为\"庐山禅经\"。\n\n然而，此经后世经录中被误题为《达摩多罗禅经》，并以此名收入历代大藏经流通至今。经文序分追溯的传法谱系中，确实提到一位\"尊者达摩多罗\"（Dharmatrāta）——此达摩多罗乃罽宾禅法传承谱系中佛大先之前的一位论师兼禅师，与说一切有部阿毗达磨学关系密切；其确切年代虽难考定，然据传承辈份推算，应远早于5世纪初佛陀跋陀罗译经之时，更远早于5世纪末至6世纪初来华的\"菩提达摩\"，二者仅因汉译名号偶然相同（\"达摩\"为\"达摩多罗／菩提达摩\"共有的省称）而被后世不谙原委的抄经者、目录编纂者误认混同。现代学界（汤用彤等已作辨正）已基本澄清：此经与后来禅宗初祖菩提达摩之间并无实际的师承或文本关系，\"达摩多罗禅经\"之名实为一个流传千余年的历史性误题。\n\n这一公案之所以值得特别提出，不仅因为它直接关涉本文的辨题任务，也因为它提示我们：中国佛教文献传抄、经录编纂过程中\"层累造成\"的现象，同样发生在禅法文献领域，而不限于教内传灯谱系的建构。饶有意味的是，据近代学者考订，此经在隋唐以后传习渐衰——一方面因智顗《摩訶止观》等天台止观著作、以及禅宗本身\"师资相传\"式教学法的兴起分流了修学者的注意力，另一方面此经沿用大量说一切有部旧译阿毗昙术语，对隋唐以降的读者而言艰涩难通，直至近现代方重新得到学界与教界的关注。\n\n\n> **EN对应 · 3. The \"Dharmatrāta Meditation Scripture\": A Paradigmatic Case of Historical Name-Confusion**\n>\n> Within the genealogy of early meditation scriptures, one text's very title constitutes a case study worth examining closely in its own right—one with real methodological bearing on how we should understand the relationship between the name \"Damo\" (達摩, \"Dharma[trāta/Bodhidharma]\") and the meditation traditions that predate Bodhidharma.\n>\n> This scripture's original title was the *Xiuxing Fangbian Chan Jing* (修行方便禪經, also known as the *Chan Jing Xiuxing Fangbian* or *Xiuxing Di Bujing Guan Jing*). It was translated at Mount Lu by Buddhabhadra (佛陀跋陀羅, a descendant of the Śākya clan of Kapilavastu), at the request of Huiyuan (慧遠) of Mount Lu, between the seventh and eighth years of the Yixi reign of the Eastern Jin (411–412 CE). Its content transmits the gradual Sarvāstivādin-lineage meditation methods of the Kashmiri meditation master Buddhasena (佛大先, also rendered Buddhasena); paired with the \"Guanzhong Chan Jing\" (the *Zuochan Sanmei Jing*), it accordingly became known as the \"Lushan Chan Jing.\"\n>\n> In later catalogues, however, this scripture came to be mistitled the *Damoduoluo Chan Jing* (達摩多羅禪經, \"Dharmatrāta Meditation Scripture\"), and has circulated under that name in every edition of the canon down to the present. The scripture's preface, in tracing its lineage of transmission, does indeed mention a certain \"Venerable Dharmatrāta\" (尊者達摩多羅)—but this Dharmatrāta was a teacher within the Kashmiri lineage of meditation transmission, positioned before Buddhasena, an ābhidharmika-cum-meditation-master closely associated with Sarvāstivādin scholasticism. His exact dates are difficult to establish with certainty, but by the reckoning of generational succession he must considerably predate Buddhabhadra's translation work in the early fifth century, and still more so the \"Bodhidharma\" (菩提達摩) who arrived in China at the very end of the fifth or beginning of the sixth century. The two figures share only the coincidence of an abbreviated Chinese rendering—\"Damo\" (達摩) serving as shorthand for both \"Damoduoluo/Dharmatrāta\" and \"Putidamo/Bodhidharma\"—and were conflated by later copyists and cataloguers unfamiliar with the underlying details. Modern scholarship (Tang Yongtong and others have already offered correctives here) has by now largely clarified that this scripture bears no actual lineage or textual relationship to the founding patriarch of the Chan School who came later; the title \"Dharmatrāta Meditation Scripture\" is, in fact, a historical mistitling that has persisted for over a millennium.\n>\n> This case deserves particular emphasis, not only because it bears directly on the disambiguating task of this study, but because it alerts us to something more general: the phenomenon of \"accretion through layered transmission\" in the copying and cataloguing of Chinese Buddhist texts occurs within the field of meditation literature just as it does in the construction of sectarian transmission genealogies. Intriguingly, modern scholars have also noted that this scripture's popularity declined after the Sui-Tang period—partly because Zhiyi's *Mohe Zhiguan* and other Tiantai contemplative works, together with the rise of the Chan school's own \"master-to-disciple\" pedagogical style, drew practitioners' attention elsewhere, and partly because the scripture's extensive use of older Sarvāstivādin Abhidharma terminology made it difficult reading for audiences from the Sui-Tang period onward—only regaining scholarly and religious attention in the modern era.\n>\n\n### 四、道安、慧远与庐山禅慧传统\n\n\n东晋道安（312—385）虽以般若学\"格义\"批判者、经录编纂者（《综理众经目录》）、僧团制度奠基人著称于世，但其本人亦曾为安世高所译诸禅经作注（今多已佚），显示禅观修习在这一\"义学\"色彩浓厚的僧团中同样占有一席之地。\n\n道安门下慧远（334—416）继承师说，东晋太元十五年（390，一说稍早）于庐山与刘遗民等僧俗一百二十三人结\"白莲社\"，于阿弥陀佛像前立誓同修念佛，共期往生净土，为中国佛教史上有明确记载的最早结社念佛之举，后世净土宗传统追认慧远为\"初祖\"。特别值得强调的是，慧远所依据的主要经典是《般舟三昧经》而非后世流行的持名念佛系统，其修法以\"观想念佛\"为主——常观想\"佛身有三十二相八十种好，巨亿光明彻照\"，且明确\"以禅智为宗\"，即将念佛观纳入禅观体系而非仅作为一种独立于禅修之外的信仰仪式。也正因为慧远的禅智并重，他才会在义熙年间力邀因\"废弃立文\"争议而处境尴尬的佛陀跋陀罗入庐山避难、译经、教禅，促成了\"庐山禅经\"的诞生——道安、慧远一系的禅慧传统，因此构成了连接安世高、鸠摩罗什早期禅经系统与后续庐山禅经、乃至净土念佛三昧传统的重要历史枢纽。\n\n\n\n> **EN对应 · 4. Dao'an, Huiyuan, and the Meditation-and-Wisdom Tradition of Mount Lu**\n>\n> Dao'an (道安, 312–385) of the Eastern Jin is best known as a critic of the \"matching concepts\" (geyi 格義) approach to Prajñāpāramitā studies, as the compiler of a scriptural catalogue (the *Zongli Zhongjing Mulu*), and as a founder of monastic institutional practice (including the standardization of \"Shi\" 釋 as the surname for all monastics). Yet he also wrote commentaries—now mostly lost—on the meditation scriptures translated by An Shigao, showing that contemplative practice held a real place even within this heavily \"doctrinal\" monastic community.\n>\n> Dao'an's disciple Huiyuan (慧遠, 334–416) carried this legacy forward: in the fifteenth year of the Taiyuan reign of the Eastern Jin (390 CE, by some accounts slightly earlier), he and 123 monastic and lay followers, including Liu Yimin, formed the \"White Lotus Society\" at Mount Lu, taking a vow before an image of Amitābha Buddha to jointly cultivate buddha-recollection and together aspire to rebirth in the Pure Land—the earliest clearly documented instance of a communal buddha-recollection society in Chinese Buddhist history, on the strength of which later Pure Land tradition retrospectively honored Huiyuan as its \"first patriarch.\" It is particularly worth emphasizing that the primary scripture on which Huiyuan relied was the *Pratyutpanna Samādhi Sūtra* (般舟三昧經) rather than the vocal-recitation-based system that would later become prevalent; his practice centered on \"visualization buddha-recollection\" (觀想念佛)—habitually visualizing how \"the Buddha's body possesses the thirty-two marks and eighty minor characteristics, radiant with a hundred million points of light\"—and he explicitly held that his practice \"took meditative wisdom as its foundation\" (以禪智為宗), that is, he incorporated buddha-recollection contemplation within the framework of meditative practice rather than treating it as a devotional rite separate from meditation. It was precisely because Huiyuan gave equal weight to meditation and wisdom that he was moved, during the Yixi reign, to invite Buddhabhadra—then in an awkward position owing to a controversy over \"abandoning the established rules\"—to take refuge at Mount Lu, translate scriptures, and teach meditation there, giving rise to the \"Lushan Chan Jing.\" The meditation-and-wisdom tradition of Dao'an and Huiyuan thus forms a crucial historical hinge connecting the early meditation-sūtra systems of An Shigao and Kumārajīva to the subsequent Lushan Chan Jing and, further still, to the tradition of Pure Land buddha-recollection samādhi.\n>\n> ---\n>\n\n## 第二部分　与达摩系并行独立的北朝禅法主流：僧稠系及其同侪\n\n\n如果说达摩一系禅宗后来居上、终成汉传佛教修行论述的主流乃至代名词，那么在其成立的南北朝至隋唐之际，情况恰恰相反：真正在北方佛教中心邺城（东魏北齐都城）享有崇高地位、并获得王室持续供养的禅法传承，是以僧稠为代表的另一系统，而非达摩—慧可一脉。这一历史事实在传统禅宗内部叙事中长期被边缘化，直到20世纪以来的史学考订（尤其汤用彤《汉魏两晋南北朝佛教史》、印顺《中国禅宗史》）与近三十年的考古发现、以及晚近以艾宏略（Eric M. Greene）为代表的西方学界研究，才重新获得其应有的历史分量。\n\n\n> **EN对应 · Part Two: The Dominant Northern Dynasties Meditation Tradition, Developing in Parallel with the Bodhidharma Lineage—The Sengchou School and Its Contemporaries**\n>\n> If the Bodhidharma lineage eventually overtook all rivals to become the mainstream—indeed, virtually synonymous with—Chinese Buddhist discourse on practice, then in the period of its own formation, from the Northern and Southern Dynasties through the Sui-Tang transition, the actual situation was quite the reverse: the meditation lineage that truly held preeminent status at Ye (鄴城, capital of the Eastern Wei and Northern Qi), the great Buddhist center of the North, and that received sustained imperial patronage, was the tradition represented by Sengchou (僧稠)—not the Bodhidharma–Huike lineage. This historical fact was long marginalized within the Chan school's own internal narrative, and only regained its due historical weight through twentieth-century historical scholarship (notably Tang Yongtong's *History of Buddhism in the Wei, Jin, and Northern and Southern Dynasties* and Yinshun's *History of the Chan School*), archaeological discoveries of the past thirty years, and recent Western scholarship represented by Eric M. Greene.\n>\n\n### 一、僧稠的生平与\"四念处\"禅法\n\n\n僧稠（480—560），俗姓孙，昌黎（今河北）人，出身太学博士，早年通习经史，28岁投钜鹿景明寺僧寔法师出家，其后师从\"佛陀禅师\"（跋陀，北魏时来华、曾任少林寺开山住持的西域高僧，与达摩所师承的南天竺禅系并非同一支）门下的道房习禅，终得道房之传而自成一系，法脉略作：佛陀禅师—道房—僧稠。北魏孝明帝曾三次征召僧稠出山而不应命；北魏孝武帝永熙元年（532）特为其在尚书谷建禅室、集徒供养；东魏、北齐历朝帝王对其礼遇有加，北齐文宣帝高洋更于天保三年（552）敕令在邺城西南龙山为其营建精舍，\"接轸登山\"、\"置库贮之以供常费\"，僧稠因此获\"国师大德\"之尊号，其禅法风靡邺下、声势之盛，非同时代任何其他禅师可比，包括达摩门下的慧可在内。\n\n僧稠禅法的核心是\"四念处\"（观身不净、观受是苦、观心无常、观法无我），义理依据主要是南朝宋畺良耶舍所译《观无量寿佛经》与北凉昙无谶所译《大般涅槃经·圣行品》中的\"四念处法\"，属大小乘杂糅、重视具体身心观察次第的渐修体系，与达摩系\"藉教悟宗\"\"直指人心\"式的顿悟取向形成鲜明对照。唐代道宣在《续高僧传·习禅篇总论》中对二者作过一段常被后世学者引用的经典评断：他形容菩提达摩\"大乘壁观，功业最高，在世学流，仰如归市\"，同时又将僧稠与达摩并举为\"二宗\"：\"稠、怀念处，清范可崇；摩法虚宗，玄旨幽赜\"——意即僧稠一系以四念处为代表的禅法明确、易于遵循，而达摩一系\"虚宗\"意旨幽微玄奥、不易把握。这段评语虽出自后世亦将达摩系奉为权威的道宣之手，却丝毫未流露出后世将达摩系视为唯一\"正统\"的门户之见，恰恰反映了初唐时人心目中僧稠、达摩二系分庭抗礼、甚至僧稠更受尊崇的历史实况。\n\n\n> **EN对应 · 1. Sengchou's Life and His \"Four Foundations of Mindfulness\" Meditation**\n>\n> Sengchou (僧稠, 480–560), lay surname Sun, was a native of Changli (in present-day Hebei). Born into a family of Imperial Academy scholars, he was well versed in the classics and histories in his youth. At age twenty-eight he left home under Master Sengshi at Jingming Monastery in Julu, and subsequently studied meditation under Daofang (道房), a disciple of \"Chan Master Buddha\" (Fotuo 佛陀, also called Batuo 跋陀, a Central Asian monk who came to China during the Northern Wei and served as founding abbot of Shaolin Monastery—a distinct lineage from the South Indian meditation tradition through which Bodhidharma himself trained). Sengchou eventually received Daofang's transmission and established his own tradition; the lineage may be summarized as: Chan Master Buddha—Daofang—Sengchou. Emperor Xiaoming of the Northern Wei summoned Sengchou from his retreat three times, each time without success; in the first year of the Yongxi reign of Emperor Xiaowu of the Northern Wei (532), a meditation hall was specially built for him in Shangshu Valley, where he gathered disciples under imperial patronage. Successive rulers of the Eastern Wei and Northern Qi treated him with great favor; Emperor Wenxuan of Northern Qi, Gao Yang, decreed in the third year of the Tianbao reign (552) that a retreat be built for him on Longshan, southwest of Ye, \"extending a carriage-path up the mountain\" and \"establishing a treasury to fund his regular expenses.\" Sengchou thereby received the honorific title \"National Preceptor, Great Virtuous One\" (國師大德); his meditation teaching swept through the Ye region with a force unmatched by any other meditation master of the era—including Huike, disciple of Bodhidharma himself.\n>\n> The core of Sengchou's meditation method was the \"four foundations of mindfulness\" (四念處: contemplating the body as impure, sensation as suffering, mind as impermanent, and phenomena as devoid of self), doctrinally grounded chiefly in the \"four foundations of mindfulness\" teachings found in the *Contemplation of Amitāyus Sūtra* (translated by Kālayaśas of the Liu Song) and the \"Chapter on Sagely Practice\" of the *Mahāparinirvāṇa Sūtra* (translated by Dharmakṣema of the Northern Liang)—a hybrid Hīnayāna-Mahāyāna system emphasizing concrete, step-by-step observation of body and mind, standing in sharp contrast to the Bodhidharma lineage's sudden-awakening orientation of \"entering principle by means of the teaching\" and \"directly pointing to the mind.\" In the *Xu Gaoseng Zhuan*, in the general discussion of the \"Practitioners of Meditation\" chapter, the Tang-dynasty historian Daoxuan offers an assessment of the two that later scholars have often cited: he describes Bodhidharma's teaching as \"wall-contemplation of the Mahāyāna, of the highest achievement, to which students of his generation looked up as though flocking to a marketplace,\" while at the same time placing Sengchou and Bodhidharma side by side as \"two traditions\": \"Chou, cherishing the foundations of mindfulness, [his] pure model may be revered; Damo's dharma is of the void tradition, its dark purport deep and recondite\" (稠、懷念處，清範可崇；摩法虛宗，玄旨幽賾)—meaning that Sengchou's four-foundations-of-mindfulness tradition was clear and readily followed (\"its pure model may be revered\"), while Bodhidharma's \"tradition of the void\" was subtle and difficult to grasp (\"its dark purport deep and recondite\"). Though this assessment comes from the very same Daoxuan whom later generations, including the Bodhidharma lineage's own heirs, would regard as an authority, it betrays not the slightest trace of the later tendency to treat the Bodhidharma lineage as the sole \"orthodoxy\"—it reflects, rather, the actual state of affairs in the minds of early Tang contemporaries, for whom the Sengchou and Bodhidharma traditions stood as equals, with Sengchou if anything the more highly esteemed of the two.\n>\n\n### 二、考古实证：小南海石窟与禅观图像\n\n\n僧稠系禅法的历史地位，近数十年来获得了重要的考古学佐证。河南安阳西南小南海（又称灵山寺石窟）现存中、西、东三座小型石窟，开凿于北齐天保元年至六年（550—555），据窟外《板经题记》，中窟由灵山寺僧方法师等发起营造，\"至六年中，国师大德稠禅师重莹（营）修成，相好斯备\"，僧稠圆寂（560年，乾明元年）后，其弟子等\"依准观法，遂镂石班经\"，将《大般涅槃经·圣行品·四念处法》与《华严经》偈赞刊刻于窟外崖面，与僧稠生前所据禅观经典直接对应；窟内三壁分别造卢舍那（或释迦）、阿弥陀（并十六观浮雕）、弥勒（并说法浮雕）三尊，学者考订认为，中窟西壁所刻正是依南朝宋畺良耶舍所译《观无量寿佛经》\"十六观\"题材而作的阿弥陀净土变相，显示僧稠一系的禅观实践并不限于四念处，也兼摄净土观想一脉，与前述慧远系\"观想念佛\"传统遥相呼应。\n\n学者已指出，北齐邺下禅学大体可分为两大系统：\"瑜伽师宗的跋陀系禅法\"（即僧稠所出的佛陀禅师一脉，因其禅法近于说一切有部瑜伽师系统而得名）与\"楞伽学派的达摩系禅法\"（即达摩、慧可依《楞伽经》\"藉教悟宗\"的一系），而\"跋陀系僧稠禅法独步邺下，引领北朝禅法之风\"——僧稠系不仅在教理内容上与达摩系判然有别，在地缘与政治资源上也占据压倒性优势。此一由造像题记、刻经、图像组合等实物证据支撑起来的历史图景，与依赖后世灯录史书建构出的\"达摩系一枝独秀\"印象形成了强烈反差，也正是艾宏略《禅之前的禅：中国佛教中的禅修、忏悔与观相经验》（*Chan Before Chan: Meditation, Repentance, and Visionary Experience in Chinese Buddhism*, University of Hawai'i Press, 2021）及其姊妹篇《佛教禅修的秘密：中国中古早期观相类禅经》（*The Secrets of Buddhist Meditation: Visionary Meditation Texts from Early Medieval China*, 同年同社出版）这两部近年被评价为\"范式转移之作\"的西方学界研究所着力揭示的核心论点之一：在8世纪禅宗真正成型之前，中国佛教徒理解与实践\"禅\"的方式，是以获得可供资深禅师解读、以判定修行者身心清净或染污程度的\"观相\"（visionary）经验为核心，并与忏悔仪式（chanhui）密切交织在一起的一整套宗教文化，而非后世禅宗叙事所预设的、以\"顿悟\"为单一目标的线性发展史。\n\n\n> **EN对应 · 2. Archaeological Evidence: The Xiaonanhai Caves and Meditation Imagery**\n>\n> The historical standing of the Sengchou lineage has received important archaeological corroboration in recent decades. The Xiaonanhai Caves (also known as the Lingshan Temple Caves), southwest of Anyang in Henan, comprise three small grottoes—Central, Western, and Eastern—excavated between the first and sixth years of the Tianbao reign of the Northern Qi (550–555). According to the inscribed sutra text outside the caves, the Central Cave was initiated by the monk Fang of Lingshan Temple and others; \"by the sixth year, the National Preceptor, Great Virtuous One, Chan Master Chou, further embellished and completed it, its features now complete.\" After Sengchou's death in 560 (the first year of the Qianming reign), his disciples, \"following his contemplative method, accordingly carved the sūtra text into the stone in sections,\" inscribing the \"Four Foundations of Mindfulness\" chapter from the \"Chapter on Sagely Practice\" of the *Mahāparinirvāṇa Sūtra* together with verses from the *Avataṃsaka Sūtra* onto the cliff face outside the caves—corresponding directly to the very meditation scriptures on which Sengchou relied during his lifetime. The interior walls of the three caves are carved respectively with images of Vairocana (or Śākyamuni), Amitābha (accompanied by relief carvings of the sixteen contemplations), and Maitreya (accompanied by relief carvings of his preaching); scholars have determined that the relief on the west wall of the Central Cave specifically depicts an Amitābha Pure Land transformation tableau based on the \"sixteen contemplations\" theme found in Kālayaśas's Liu-Song translation of the *Contemplation of Amitāyus Sūtra*—indicating that the Sengchou lineage's contemplative practice was not confined to the four foundations of mindfulness alone, but also encompassed the Pure Land visualization tradition, echoing the \"visualization buddha-recollection\" tradition of Huiyuan's lineage discussed above.\n>\n> Scholars have pointed out that Buddhist meditation studies at Ye under the Northern Qi can broadly be divided into two systems: \"the Buddhabhadra-lineage meditation method of the Yogācāra-master tradition\" (i.e., the lineage descending from Chan Master Buddha through which Sengchou emerged, so named because its meditation method resembles the Sarvāstivādin Yogācāra-master system) and \"the Bodhidharma-lineage meditation method of the Laṅkāvatāra school\" (i.e., the tradition of Bodhidharma and Huike based on \"entering principle by means of the teaching\" via the *Laṅkāvatāra Sūtra*)—with \"the Buddhabhadra-lineage Sengchou meditation method standing alone at Ye, leading the fashion in Northern Dynasties meditation practice.\" The Sengchou lineage differed from the Bodhidharma lineage not only in doctrinal content but held an overwhelming advantage in geographic and political resources as well. This historical picture, supported by physical evidence—inscriptions, carved sūtras, and iconographic programs—stands in stark contrast to the impression of a lone-flourishing \"Bodhidharma lineage\" constructed by reliance on the later transmission-record literature. It is precisely this picture that Eric Greene's *Chan Before Chan: Meditation, Repentance, and Visionary Experience in Chinese Buddhism* (University of Hawai'i Press, 2021) and its companion volume *The Secrets of Buddhist Meditation: Visionary Meditation Texts from Early Medieval China* (same press, same year)—both recently praised as \"paradigm-shifting\" works of Western scholarship—labor to bring into focus. One of their central arguments is this: before the true formation of the Chan school in the eighth century, the way Chinese Buddhists understood and practiced \"Chan\" centered on obtaining \"visionary\" experiences that a senior meditation master could then interpret to determine the degree of purity or defilement in the practitioner's body and mind—an entire religious culture closely interwoven with rites of repentance (chanhui 懺悔)—rather than the linear developmental history, oriented toward \"sudden awakening\" as its sole goal, presupposed by the later Chan narrative.\n>\n\n### 三、僧稠系法脉的延续及其他北朝禅师\n\n\n僧稠门下四大弟子——昙询（520—599，弟子真慧569—615）、僧邕（543—631，后转入信行创立的三阶教）、智舜（533—604，弟子智赞）、智旻（弟子智首567—635，智首门下即为唐代律宗南山宗开创者、《续高僧传》作者道宣本人）——法脉绵延至初唐，其中僧稠系与三阶教、南山律宗之间千丝万缕的师承联系，也是理解初唐佛教制度史的重要线索之一。值得一提的是，道宣本人的律学师承正是出自僧稠一系而非达摩一系，这或许有助于解释《续高僧传》何以能对僧稠、达摩二系并存共尊的历史实况给予相对公允的记述。\n\n与僧稠同时而略晚的另一位北朝重要禅师是僧实（476—563），北周朝廷尊礼有加，据传保定年间（561—565）周太祖曾言\"师才深德大，宜庇道俗，以隆礼典\"，去世后敕令\"图写形像，仍置大福田寺\"，其历史地位与僧稠相近而略逊，同属独立于达摩系之外、深受北朝王室尊崇的禅法权威。\n\n此外，晚近学界（如艾宏略\"Chan before Chan\"一书的相关章节）对道宣《续高僧传》中一段常被误读为\"意在推尊达摩系\"的批评性文字提出了新的诠释：有研究指出，道宣此段议论实际针对的可能并非达摩及其后学本身，而是信行（540—594）所创立、同样与僧稠系存在师承交涉的\"三阶教\"，这提示我们，七世纪佛教内部围绕\"禅\"之意涵与正当性的论争，其参与方远比\"达摩系 vs. 非达摩系\"的简单二分复杂得多，仍有待学界持续厘清。\n\n\n> **EN对应 · 3. The Continuation of the Sengchou Lineage and Other Northern Dynasties Meditation Masters**\n>\n> Sengchou's four principal disciples—Tanxun (曇詢, 520–599, whose own disciple was Zhenhui, 569–615), Sengyong (僧邕, 543–631, who later joined the Three Levels movement founded by Xinxing), Zhishun (智舜, 533–604, whose disciple was Zhizan), and Zhimin (whose disciple Zhishou, 567–635, was himself the teacher of Daoxuan—founder of the Nanshan Vinaya lineage in the Tang and author of the *Xu Gaoseng Zhuan*)—carried the lineage forward into the early Tang. The tangled web of connections between the Sengchou lineage, the Three Levels movement, and the Nanshan Vinaya lineage is itself an important thread for understanding early Tang Buddhist institutional history. It is worth noting that Daoxuan's own vinaya-lineage training descended from the Sengchou tradition rather than the Bodhidharma tradition—which may help explain why the *Xu Gaoseng Zhuan* is able to give a relatively even-handed account of the historical reality in which the Sengchou and Bodhidharma traditions coexisted, each commanding its own respect.\n>\n> Another important Northern Dynasties meditation master, roughly contemporary with but slightly later than Sengchou, was Sengshi (僧實, 476–563), who was held in great esteem by the Northern Zhou court. Tradition holds that during the Baoding era (561–565), Emperor Taizu of Zhou remarked, \"This master's talent runs deep and his virtue is great; he ought to shelter both clergy and laity, that we may exalt the rites due him,\" and that upon his death an imperial decree ordered that \"his likeness be painted and enshrined at the Great Field of Merit Monastery.\" His historical standing was comparable to, if slightly beneath, Sengchou's—another meditation authority who, independent of the Bodhidharma lineage, received deep veneration from the Northern Dynasties court.\n>\n> It is further worth noting that recent scholarship (including the relevant chapters of Greene's *Chan Before Chan*) has offered a new interpretation of a passage in Daoxuan's *Xu Gaoseng Zhuan* often misread as \"intended to elevate the Bodhidharma lineage\": some research suggests that the actual target of Daoxuan's criticism in this passage may not have been Bodhidharma and his followers at all, but rather the Three Levels movement (三階教) founded by Xinxing (信行, 540–594), which likewise had lineage entanglements with the Sengchou tradition. This suggests that the debates within seventh-century Buddhism over the meaning and legitimacy of \"Chan\" involved far more parties than a simple binary of \"Bodhidharma lineage versus non-Bodhidharma lineage,\" a matter that still awaits further clarification by scholars.\n>\n\n### 四、地论师、摄论师与北朝禅观文化的交织\n\n\n与僧稠系禅法大体同时，北朝还存在着以研习世亲《十地经论》为中心的\"地论师\"（分相州南道、北道二系）与以研习无著《摄大乘论》、经真谛系统传入的\"摄论师\"两大瑜伽行唯识学派别。二者虽以经院义学著称，未必以\"禅法\"（具体修习方法）本身为标志，但其阿赖耶识、如来藏缘起等心性理论，实际上为北朝禅观修习提供了重要的义理支撑，二者之间存在相当程度的人物交涉与思想互渗——例如与小南海、灵泉寺石窟营造密切相关的地论宗高僧道凭、灵裕师徒，其营造刻经活动即与僧稠系禅窟毗邻而立，反映出北朝\"重义学的地论摄论师\"与\"重实修的禅师\"之间并非截然两分的僧团生态，而是同处一地、彼此渗透的思想共同体。\n\n\n> **EN对应 · 4. The Dilun and Shelun Masters: Intersections with Northern Dynasties Meditation Culture**\n>\n> Roughly contemporaneous with the Sengchou lineage, the Northern Dynasties also saw the emergence of two Yogācāra scholastic lineages: the \"Dilun masters\" (地論師, divided into Southern and Northern Xiangzhou branches), centered on the study of Vasubandhu's *Daśabhūmika-śāstra*, and the \"Shelun masters\" (攝論師), centered on the study of Asaṅga's *Mahāyānasaṃgraha* as transmitted through Paramārtha. Though these were scholastic lineages known chiefly for doctrinal exegesis rather than for meditation methods per se, their theories of the ālayavijñāna and tathāgatagarbha-based dependent origination in fact provided important doctrinal support for Northern Dynasties meditative practice, and there was considerable personal interaction and mutual influence between the two currents—for instance, the Dilun masters Daoping and Lingyu, closely associated with the construction of the Xiaonanhai and Lingquan Temple caves, carried out their own cave-construction and sūtra-inscription activities immediately adjacent to the Sengchou-lineage meditation caves, reflecting a Northern Dynasties monastic ecology in which the \"doctrinally-oriented Dilun and Shelun masters\" and the \"practice-oriented meditation masters\" were by no means sharply separated, but rather formed an interpenetrating community of thought occupying the same physical space.\n>\n\n### 五、敦煌文献与现代学术史：从胡适到艾宏略\n\n\n上述对僧稠系乃至更广泛的\"达摩以前／达摩之外\"禅法传统的重新发现，从根本上得益于20世纪初敦煌藏经洞文献的出土。伯希和、斯坦因等携出的大批写本中，包含相当数量此前仅见于经录著录、正本久已散佚的早期禅籍与禅宗\"前史\"文献，为重写这段历史提供了第一手材料。\n\n在利用这批材料重构禅宗前史与达摩系形成过程的学术谱系中，胡适（1891—1962）率先以近代历史考据方法系统研究敦煌禅籍，其结论（如对神会在南宗禅确立过程中的关键作用、对《坛经》版本演变史的考订等）虽因方法论上偏重\"历史考证\"而受到铃木大拙等持\"禅悟真髓不可化约为历史事实\"立场学者的批评，但开创之功不可磨灭。其后，印顺法师（1906—2005）积数十年治学功力，撰成《中国禅宗史——从印度禅到中华禅》（1971年出版，1973年因此获日本大正大学文学博士学位），对达摩禅、东山法门、牛头宗兴起、《坛经》成立与曹溪禅分化等问题作了迄今仍具权威性的系统梳理。与此同时，日本学者柳田圣山《初期禅宗史书之研究》（1967）、宇井伯寿《禅宗史研究》、关口真大《达摩大师之研究》等一系列文献学考订成果，与印顺的研究相互印证、相互推进，共同奠定了当代禅宗前史与早期禅法研究的基本文献学框架。\n\n进入21世纪，以艾宏略（耶鲁大学学者，专治中古中国佛教史）为代表的新一代学者，在充分消化上述文献学成果的基础上，进一步引入宗教史、艺术史（如前述小南海石窟图像研究）、乃至符号学理论视角，系统重新评估了僧稠系、\"观相\"禅法、忏悔仪轨在中古中国佛教修行文化中的核心地位，其论著已被学界评价为\"消解了长期以来将中古早期禅修视为成熟禅宗之'预备阶段'的目的论叙事\"。可以说，一部完整的\"六祖南宗禅以外的禅法史\"，很大程度上正是这一敦煌学、石窟考古学与文献学百年积累的产物。\n\n\n\n> **EN对应 · 5. The Dunhuang Manuscripts and Modern Scholarly History: From Hu Shi to Eric Greene**\n>\n> The rediscovery of the Sengchou lineage—and, more broadly, of the entire \"pre-Bodhidharma / non-Bodhidharma\" meditation tradition—owes its foundation to the early-twentieth-century excavation of the Dunhuang sūtra cave. Among the large cache of manuscripts removed by Paul Pelliot, Aurel Stein, and others were a considerable number of early meditation texts and \"pre-history of Chan\" documents previously known only from catalogue entries, their original texts long since lost—providing first-hand material for rewriting this chapter of history.\n>\n> In the scholarly lineage that has drawn on this material to reconstruct the pre-history of Chan and the process by which the Bodhidharma lineage took shape, Hu Shi (胡適, 1891–1962) was the pioneer, applying modern historical-critical methods systematically to the Dunhuang Chan manuscripts for the first time. His conclusions—such as his account of the pivotal role Shenhui played in establishing the Southern School's orthodoxy, and his textual-critical work on the evolution of the various recensions of the *Platform Sūtra*—drew notable criticism, on methodological grounds (an overemphasis on historical-critical method, in the view of critics like D.T. Suzuki, who held that the essence of Chan awakening could not be reduced to historical fact), yet his pioneering contribution remains undeniable. Later, Master Yinshun (印順, 1906–2005), drawing on decades of scholarly labor, completed his *History of the Chan School: From Indian Dhyāna to Chinese Chan* (1971; he was awarded a doctorate in literature from Taishō University in Japan in 1973 on the strength of this work), which offered a systematic account, still authoritative today, of the Bodhidharma tradition, the East Mountain Teaching, the rise of the Oxhead School, the formation of the *Platform Sūtra*, and the differentiation of Caoxi Chan. In parallel, the Japanese scholars Yanagida Seizan (柳田聖山, *A Study of Early Chan Historical Texts*, 1967), Ui Hakuju (宇井伯壽, *Studies in Chan History*), and Sekiguchi Shindai (關口真大, *A Study of the Great Master Bodhidharma*), among others, produced a series of philological findings that corroborated and advanced Yinshun's research in tandem, jointly establishing the basic philological framework for the study of the pre-history of Chan and early meditation methods that continues to this day.\n>\n> Into the twenty-first century, a new generation of scholars represented by Eric Greene (a scholar at Yale University specializing in medieval Chinese Buddhist history) has, building on and fully digesting these philological findings, further introduced perspectives from religious history, art history (such as the iconographic studies of the Xiaonanhai caves discussed above), and even semiotic theory, systematically reassessing the central place occupied by the Sengchou lineage, \"visionary\" meditation practice, and repentance ritual within medieval Chinese Buddhist practice culture. This body of scholarship has been praised for having \"dissolved the long-standing teleological narrative that treated early medieval meditation practice merely as a 'preparatory stage' for the mature Chan school.\" It may fairly be said that a complete \"history of meditation traditions beyond Huineng's Southern School\" is, to a great extent, the product of this century of cumulative work in Dunhuang studies, cave-archaeology, and philology.\n>\n> ---\n>\n\n## 第三部分　达摩至弘忍：共同的早期禅法与\"东山法门\"的形成\n\n\n在着手考察北宗、牛头宗、蜀地诸系等\"落选于\"后世南宗正统叙事的早期禅系之前，有必要先回到达摩、慧可、僧璨、道信、弘忍这五位在南宗、北宗两方均予承认的\"共同祖师\"本身——因为恰恰是他们各自的具体禅法实践与教学内容，在后世\"教外别传、以心传心\"的谱系化叙事定型之后，反而在很大程度上被简化、乃至被追认为仅是通往六祖惠能\"顿悟见性\"说的单向铺垫，其自身独立的思想面貌与修证方法，长期未获应有的独立关注。20世纪以来的文献学考订，尤其是敦煌写本的发现与胡适、印顺等学者的系统整理，使我们得以在相当程度上恢复这几位祖师各自禅法的本来面目。\n\n\n> **EN对应 · Part Three: Bodhidharma Through Hongren—The Shared Early Teachings and the Formation of the \"East Mountain Teaching\"**\n>\n> Before turning to the Northern School, the Oxhead School, the Sichuan lineages, and other early Chan traditions \"eliminated\" from the later Southern School orthodox narrative, it is necessary first to return to the \"shared patriarchs\" themselves—Bodhidharma, Huike, Sengcan, Daoxin, and Hongren—figures acknowledged by both the Southern and Northern Schools alike. For it is precisely their individual meditation practices and teachings that, once the later genealogical narrative of \"a special transmission outside the teachings, mind-to-mind transmission\" had crystallized, came to be simplified, or even retroactively recast as mere stepping-stones toward Huineng's doctrine of \"sudden awakening and seeing one's nature\"—their own independent intellectual profiles and methods of practice long failing to receive the independent attention they deserve. Twentieth-century philological scholarship, particularly the discovery of the Dunhuang manuscripts and the systematic work of scholars such as Hu Shi and Yinshun, allows us to recover, to a considerable degree, the original character of each patriarch's own teaching.\n>\n\n### 一、菩提达摩：二入四行与壁观\n\n\n现存能够确证出自达摩本人（或至少是其身边弟子直接记录）教法的最早文献，是由达摩弟子昙林作序、记录整理的《二入四行论》，1935年由日本学者铃木大拙首次据敦煌写本（伯希和北宿99号等）公之于世，其后经柳田圣山系统校订整理，成为研究达摩禅法最权威的原始依据，远比晚出的灯录传说更为可信。\n\n据此论，达摩禅法可概括为\"二入\"\"四行\"：**理入**，谓\"藉教悟宗\"——深信一切众生同一真性，只为客尘妄想所覆而不能显了；若能舍妄归真，\"凝住壁观，无自无他，凡圣等一，坚住不移，更不随于文教\"，便与真理冥然相符，此即\"理入\"，亦即后世所称\"壁观\"法门之所本。**行入**，则谓\"四行\"：报冤行（甘心忍受宿业苦报而无怨）、随缘行（得失随缘，心无增减）、无所求行（断除贪求）、称法行（契合自性清净之理而行）。据昙林序文，达摩尝以\"如是安心，如是发行，如是顺物，如是方便\"四句口诀直接教示慧可、道育二弟子——\"安心\"即壁观，\"发行\"即四行，\"顺物\"谓防护讥嫌，\"方便\"谓遣其不着。道宣《续高僧传》记载达摩\"以此法开化魏土，识真之士从奉归悟，录其言语，卷流于世\"，可见其禅法在当时确曾形诸文字流传，而非全然\"不立文字\"——这一点常为后世过度强调\"教外别传\"的南宗叙事所忽略。达摩禅法虽以\"直指人心\"的顿悟取向著称，\"壁观\"作为一种具体的禅坐方法，却也带有相当程度的止观修习色彩，与纯然\"不假方便\"的顿悟说仍有微妙区别，这一点也是后世禅思想史演变中值得细究之处。\n\n\n> **EN对应 · 1. Bodhidharma: The Two Entrances and Four Practices, and Wall-Contemplation**\n>\n> The earliest surviving text that can be confirmed as deriving from Bodhidharma himself (or at least directly recorded by disciples close to him) is the *Erru Sixing Lun* (二入四行論, \"Treatise on the Two Entrances and Four Practices\"), prefaced and compiled by Bodhidharma's disciple Tanlin (曇林). It was first brought to light in 1935 by the Japanese scholar D.T. Suzuki on the basis of Dunhuang manuscripts (including Pelliot Chinois 99), and subsequently critically edited by Yanagida Seizan; it stands as the most authoritative primary source for the study of Bodhidharma's meditation teaching, far more reliable than the later transmission-record legends.\n>\n> According to this treatise, Bodhidharma's teaching can be summarized as \"two entrances\" and \"four practices.\" The **entrance of principle** (理入) refers to \"entering principle by means of the teaching\" (藉教悟宗)—deeply believing that all sentient beings share the same true nature, obscured only by adventitious defilement and false thought, such that it cannot manifest; if one can abandon the false and return to the true, \"abiding fixedly in wall-contemplation, without self and other, ordinary and sage being equal and one, firmly abiding without shifting, no longer following after written teachings,\" one then tallies silently with the principle—this is the \"entrance of principle,\" and it is likewise the basis for what later came to be called the method of \"wall-contemplation\" (壁觀). The **four practices** are: the practice of requiting enmity (accepting the suffering of past karmic retribution willingly, without resentment), the practice of according with conditions (neither gain nor loss disturbing the mind), the practice of seeking nothing (cutting off craving), and the practice of according with the Dharma (acting in accordance with the principle of one's own inherently pure nature). According to Tanlin's preface, Bodhidharma taught his two disciples Huike and Daoyu directly with a four-phrase formula: \"thus stilling the mind, thus arousing practice, thus according with things, thus employing skillful means\"—\"stilling the mind\" refers to wall-contemplation, \"arousing practice\" to the four practices, \"according with things\" to guarding against slander and ill will, and \"skillful means\" to relinquishing attachment. Daoxuan's *Xu Gaoseng Zhuan* records that Bodhidharma \"used this teaching to enlighten the land of Wei; those with genuine understanding who received his teaching attained realization, and his words were recorded and circulated in the world\"—showing that his teaching was indeed committed to writing and circulated at the time, rather than being wholly \"without reliance on words,\" a point often overlooked by the later Southern School narrative's overemphasis on \"a special transmission outside the teachings.\" Although Bodhidharma's meditation teaching is renowned for its sudden-awakening orientation of \"directly pointing to the mind,\" \"wall-contemplation\" as a concrete method of seated meditation carries a considerable degree of śamatha-vipassanā coloring, and remains subtly distinct from a purely sudden-awakening approach unmediated by any expedient means—a point that repays close attention in later accounts of the evolution of Chan thought.\n>\n\n### 二、慧可、僧璨：史料的缺环与传说的层累\n\n\n慧可（487—593）事迹见于道宣《续高僧传》，早年精通儒学，四十岁至嵩山从达摩学禅六年，尽得其法；后因时人不能接受达摩禅法而屡遭责难，北周武帝灭佛（574）期间与达摩另一弟子昙林共同\"护经论\"，577年隐居舒州皖公山，度僧璨出家。值得注意的是，后世广为流传的\"慧可断臂求法\"传说，据现代学者考订，很可能是将昙林本人真实遭遇\"遇贼砍臂\"（因而得\"无臂林\"之号）的史事，与慧可求法的叙事相互讹传混同的产物——道宣《续高僧传·慧可传》原文仅记慧可晚年\"遭贼斫臂，以法御心，不觉痛苦\"，并未提及\"立雪断臂\"的求法情节，此一情节实由后出的《宝林传》《楞伽师资记》《景德传灯录》等辗转传抄增益而成，是禅宗史料\"层累造成\"现象的一个典型例证。\n\n僧璨的史料状况更为稀薄：《续高僧传》本传付之阙如，仅在附篇\"习禅六之余\"道信本传中，间接提及\"又有二僧，莫知何来，入舒州皖公山静修禅业，（道信）闻而往赴，便蒙授法，随逐依学，遂经十年\"——印顺据僧璨曾往皖公山近邻之独山活动的旁证，推断此\"二僧\"中当有僧璨在内，\"道信从僧璨得法，应属可信\"，但这终究是一个基于地理旁证的推断，而非直接的文献确证。可以说，在达摩至弘忍五代传承中，除僧璨、道信之间史料稍显薄弱外，其余各代师承关系大体尚有《续高僧传》可据，然而各祖生平细节仍\"多为拼凑而成，语焉不详，内容矛盾重重\"——正如学者杜继文所感慨，对待禅宗自身留下的历史记载，若全信禅家自己的记载、当成无误的史实，非上当不可；但若完全离开它们，对禅宗的研究又无从进行，这一两难处境，恰是研究早期禅史必须时刻自觉的方法论前提。689年（唐永昌元年）所立、现存最早的禅宗世系石刻《唐中岳沙门释法如禅师行状碑》，碑文明言\"（达摩）入魏传可，可传璨，璨传信，信传忍，忍传如\"，即达摩、慧可、僧璨、道信、弘忍，终于法如本人——这通碑原是为确立法如作为弘忍衣钵正传\"第六代\"继承人的身份而立。饶富历史意味的是，法如恰于立碑的689年圆寂，此后中原禅众一度顿失所依，方才转而归向声望渐起的神秀座下：法如因此堪称禅宗史上一位近乎被彻底遗忘的\"候补六祖\"，其\"落选\"与神秀北宗的崛起几乎发生于同一历史时刻，绝非偶然（详见下节）。此碑另引前述《庐山出修行方便禅经统序》追溯更早的印度传法世系（佛—阿难—末田地—舍那婆斯……），可见法如一系同样援引这部\"非达摩系\"经典的权威以自重，二者间的文献关联饶有趣味。无论如何，达摩至弘忍这一共同谱系段落，后来无论北宗（经弘忍传秀）、南宗（经弘忍传能）抑或牛头宗（经道信传融），均一体承认，然学者指出，这一共同谱系本身\"当是在弘忍之后追溯而成\"，即便如此，也从侧面说明弘忍以前的传承在当时已具有相当程度的公共可信度。\n\n\n> **EN对应 · 2. Huike and Sengcan: Gaps in the Historical Record and the Layered Accretion of Legend**\n>\n> Huike's (慧可, 487–593) activities are recorded in Daoxuan's *Xu Gaoseng Zhuan*. Well versed in Confucian learning in his youth, he traveled at age forty to Mount Song to study under Bodhidharma for six years, fully receiving his teaching. He subsequently faced repeated censure, as his contemporaries could not accept Bodhidharma's meditation teaching; during Emperor Wu of Northern Zhou's suppression of Buddhism (574), he and Tanlin, another of Bodhidharma's disciples, worked together to \"protect the scriptures and images,\" and in 577 he retreated into seclusion at Mount Wangong in Shuzhou, where he ordained Sengcan. It is worth noting that the widely circulated later legend of \"Huike severing his arm to seek the Dharma\" is, according to modern scholarly analysis, very likely a conflation of Tanlin's own genuine misfortune—he was attacked by bandits and had an arm severed, earning him the epithet \"Armless Lin\"—with the narrative of Huike's quest for the Dharma. The original text of Daoxuan's *Xu Gaoseng Zhuan* biography of Huike records only that, in his later years, Huike \"suffered the severing of an arm by bandits, and through the Dharma governed his mind, feeling no pain\"; it makes no mention of any episode of \"standing in the snow and severing his arm\" in the course of seeking the Dharma. This episode was in fact added through successive retellings in later texts—the *Baolin Zhuan*, the *Lengqie Shizi Ji*, the *Jingde Chuandeng Lu*, and so on—a textbook example of the \"layered accretion\" phenomenon in Chan historical sources.\n>\n> The historical record for Sengcan is even thinner: the *Xu Gaoseng Zhuan* offers no independent biography of him at all; he is mentioned only in passing, within the appended \"Remaining Accounts\" section of Daoxin's biography, where it is noted that \"there were also two monks, of unknown origin, who entered Mount Wangong in Shuzhou to cultivate meditation practice in seclusion; [Daoxin], hearing of this, went to join them, and thereupon received the Dharma from them, following and studying under them for ten years.\" Yinshun, on the basis of circumstantial evidence that Sengcan was known to have frequented nearby Mount Du, close to Mount Wangong, inferred that these \"two monks\" likely included Sengcan, concluding that \"it is credible that Daoxin received the Dharma from Sengcan\"—but this remains, in the end, an inference from geographical circumstance rather than a direct textual confirmation. It may fairly be said that, of the five-generation transmission from Bodhidharma to Hongren, apart from the somewhat thin documentation of the link between Sengcan and Daoxin, the master-disciple relationships of the other generations are on the whole documentable in the *Xu Gaoseng Zhuan*; yet the biographical details of each patriarch remain \"largely pieced together, vague in particulars, and riddled with internal contradiction\"—as the scholar Du Jiwen once lamented regarding the historical records left by the Chan tradition itself: to believe the Chan school's own records entirely, taking them as unerring historical fact, is certainly to be led astray; yet to set them aside entirely makes research on Chan impossible in the first place. This dilemma is precisely the methodological premise that any study of early Chan history must remain constantly conscious of. The earliest surviving stone inscription recording a Chan lineage, the *Epitaph for the Chan Master Faru of Mount Song* (唐中嶽沙門釋法如禪師行狀碑), erected in 689 CE (the first year of the Yongchang reign of the Tang), states explicitly: \"[Bodhidharma] entered Wei and transmitted to Ke; Ke transmitted to Can; Can transmitted to Xin; Xin transmitted to Ren; Ren transmitted to Ru\"—that is, Bodhidharma, Huike, Sengcan, Daoxin, Hongren, culminating in Faru (法如) himself. This stele was originally erected to establish Faru's status as the legitimate \"sixth-generation\" heir to Hongren's robe and bowl. Intriguingly, Faru died in precisely the same year the stele was erected, 689; thereafter the Chan community in the central plains, having lost its point of reference, turned instead to the increasingly prominent Shenxiu—Faru may thus fairly be called a nearly-forgotten \"candidate Sixth Patriarch\" in the history of the Chan school, and it is surely no coincidence that his \"elimination\" from the record coincided almost exactly with the rise of Shenxiu's Northern School (as will be discussed further below). This same stele also cites the aforementioned preface to the *Lushan Chan Jing* to trace an even earlier Indian lineage of transmission (Buddha—Ānanda—Madhyāntika—Śāṇavāsa...)—showing that the Faru lineage likewise invoked the authority of this very \"non-Bodhidharma\" scripture to bolster its own standing, a textual connection worth noting in its own right. In any case, this shared segment of the lineage from Bodhidharma to Hongren was subsequently acknowledged uniformly by the Northern School (which traced its transmission from Hongren through Shenxiu), the Southern School (through Huineng), and the Oxhead School (through Daoxin to Farong) alike—though scholars point out that this shared genealogy itself \"must have been retrospectively constructed after Hongren's time.\" Even so, this fact suggests that the transmission prior to Hongren already carried a considerable degree of public credibility at the time.\n>\n\n### 三、道信与弘忍：\"东山法门\"的真正奠基\n\n\n如果说达摩、慧可、僧璨三代更多还是个体禅师\"头陀行\"式云游修行、门下弟子亦相对松散的状态，那么从道信（580—651）开始，情况发生了根本性转变：道信率弟子定居湖北黄梅双峰山，一改此前达摩系禅人\"居无定所\"的作风，垦荒自给、聚众定居数十年，门下僧团达五百乃至上千人之众；其弟子弘忍（601—674）继而在双峰山之东的冯茂山另立道场，即\"东山寺\"，故道信、弘忍一系合称\"东山法门\"。学界近数十年来渐趋一项重要共识：与其说中国禅宗\"创始于达摩\"或\"创始于惠能\"，不如说它真正\"初创于道信，完成于弘忍\"——正是道信、弘忍以半个多世纪的持续努力，在教理与教团组织两方面进行了多重改革建树，才标志着禅宗作为一个成熟的、中国化佛教新宗派在历史上真正得以成立。\n\n道信著有《入道安心要方便法门》（全文由净觉《楞伽师资记》引录），其禅法要旨据《楞伽师资记》概括为二：\"依《楞伽经》，诸佛心第一\"（承袭达摩系\"藉教悟宗\"以《楞伽经》为印证经典的传统），与\"依《文殊说般若经》，一行三昧，即念佛心是佛，妄念是凡夫\"（吸收般若类经典\"一行三昧\"法门，并将其与\"念佛\"法门相结合）。可见道信禅法已明确融摄般若\"一行三昧\"与念佛观心为一体，其\"守一\"\"看心\"等具体方便，与前述净土念佛三昧、后述天台止观等其他\"非南宗\"传统之间，事实上存在相当程度的方法论交叉与相互借鉴，这也进一步印证了本文导论所强调的：各支禅法传统之间的历史边界，远比后世宗派意识形态所描绘的更为流动、渗透。\n\n弘忍继承并发展道信禅法，其思想集中见于门人所记《修心要论》，核心为\"守本真心\"（简称\"守心\"）说：主张众生自心本来清净，只因妄念覆盖而不显，只需\"守本真心，妄念不生\"，即可\"了了见知，究竟得脱\"，此说较之达摩\"壁观\"、道信\"念佛净心\"，进一步将修行工夫收摄、简化至一个更为直截的\"守心\"要诀之上，为其后神秀、乃至惠能一系各自不同方向的进一步简化、发展，都预留下了充分的诠释空间。据《传法宝纪》记载，\"及忍、如、大通之世，则法门大启，根机不择，齐速念佛名，令净心\"——可见弘忍东山门下传法之初，念佛法门与禅观教学仍紧密结合、并未截然二分，这与后世持名念佛渐次独立于禅宗之外的历史走向形成有趣对照。弘忍门下人才济济，据《楞伽师资记》《历代法宝记》等文献，其\"十大弟子\"通常举出神秀、智诜、老安（惠安）、法如、玄赜、惠能等人，弘忍认为神秀于《楞伽经》\"领宗得意\"最为契合己意，智诜、刘主簿\"具文才\"，惠安\"有高行\"，法如、惠能、智德\"堪为一方师\"——这一评价本身，也提示出弘忍门下弟子各有专擅、并未预设某一弟子必然是\"唯一正统\"继承人的历史实况，为其后\"东山法门\"迅速分化为北宗、南宗、牛头宗、蜀地诸系等多个并行支派，埋下了内在的可能性。\n\n\n\n> **EN对应 · 3. Daoxin and Hongren: The True Founding of the \"East Mountain Teaching\"**\n>\n> If Bodhidharma, Huike, and Sengcan represent, for the most part, a period of itinerant, individual \"ascetic-practice\" style cultivation, with relatively loosely organized followings, then a fundamental transformation began with Daoxin (道信, 580–651): he led his disciples to settle permanently at Twin Peaks Mountain (Shuangfeng Shan) in Huangmei, Hubei—a break from the previous Bodhidharma-lineage pattern of having \"no fixed abode\"—clearing land, achieving self-sufficiency, and gathering a settled community that, over several decades, grew to between five hundred and a thousand members. His disciple Hongren (弘忍, 601–674) subsequently established a separate practice center at Fengmao Mountain, east of Twin Peaks, known as \"East Mountain Monastery\" (東山寺)—hence the lineage of Daoxin and Hongren together came to be called the \"East Mountain Teaching\" (東山法門). Scholarly consensus over recent decades has increasingly converged on an important point: rather than saying Chinese Chan \"was founded by Bodhidharma\" or \"was founded by Huineng,\" it would be more accurate to say that it was truly \"founded by Daoxin and brought to completion by Hongren\"—it was the sustained efforts of Daoxin and Hongren, over more than half a century, in both doctrinal innovation and monastic organizational reform, that marked the genuine historical establishment of Chan as a mature, sinicized new school of Buddhism.\n>\n> Daoxin authored the *Rudao Anxin Yao Fangbian Famen* (入道安心要方便法門, \"Essential Expedient Methods for Entering the Path and Stilling the Mind\"; the full text is preserved through its citation in Jingjue's *Lengqie Shizi Ji*). His meditation teaching, as summarized in the *Lengqie Shizi Ji*, rests on two textual pillars: \"Following the *Laṅkāvatāra Sūtra*, the mind of all buddhas is foremost\" (inheriting the Bodhidharma lineage's tradition of taking the *Laṅkāvatāra Sūtra* as its scripture of confirmation for \"entering principle by means of the teaching\"), and \"Following the *Prajñāpāramitā Sūtra Spoken by Mañjuśrī*, the one-practice samādhi—that is, the mind that recollects the Buddha is itself Buddha, while a mind of false thought is that of an ordinary being\" (absorbing the \"one-practice samādhi\" (一行三昧) method from the Prajñāpāramitā corpus and fusing it with buddha-recollection practice). It is clear that Daoxin's meditation teaching had already explicitly integrated the Prajñāpāramitā-derived \"one-practice samādhi\" with contemplative buddha-recollection into a single system; his concrete expedient methods of \"guarding the one\" and \"observing the mind\" demonstrate a considerable degree of methodological overlap and mutual borrowing with the Pure Land buddha-recollection samādhi tradition discussed above, and with the Tiantai contemplative system discussed below—both \"non-Southern-School\" traditions in their own right—further confirming this study's introductory point: the historical boundaries between the various meditation traditions are far more fluid and interpenetrating than later sectarian ideology has depicted them to be.\n>\n> Hongren inherited and further developed Daoxin's meditation teaching; his thought is concentrated in the *Xiuxin Yao Lun* (修心要論, \"Treatise on the Essentials of Cultivating the Mind\"), recorded by his disciples. Its core teaching is \"guarding the fundamental true mind\" (守本真心, abbreviated \"guarding the mind,\" 守心): it holds that the mind of sentient beings is originally pure, obscured only by the covering of false thought; one need only \"guard the fundamental true mind, so that false thought does not arise,\" to attain \"clear and complete realization and knowledge, ultimate liberation.\" Compared to Bodhidharma's \"wall-contemplation\" and Daoxin's \"purifying the mind through buddha-recollection,\" this teaching further condenses and simplifies practical cultivation into a still more direct essential formula of \"guarding the mind\"—leaving ample interpretive room for the further simplifications and developments that Shenxiu's lineage, and Huineng's lineage, would each independently pursue afterward. According to the *Chuanfa Baoji* (傳法寶紀), \"by the time of Ren [Hongren], Ru [Faru], and Datong [Shenxiu], the Dharma-gate had opened wide, admitting all capacities without discrimination, all alike swiftly reciting the Buddha's name, that the mind be purified\"—showing that, at the outset of the East Mountain lineage's transmission under Hongren, buddha-recollection practice remained closely integrated with meditative instruction, not yet sharply distinguished from it, an interesting contrast to the later historical trajectory in which vocal-recitation buddha-name practice gradually became independent of the Chan school. Hongren's disciples were numerous and talented; according to the *Lengqie Shizi Ji*, the *Lidai Fabao Ji*, and other texts, his \"ten great disciples\" are typically listed as including Shenxiu, Zhishen, Lao'an (Huian), Faru, Xuanze, and Huineng, among others. Hongren himself is recorded as judging that Shenxiu had \"grasped the essential purport\" of the *Laṅkāvatāra Sūtra* most fully in accord with his own understanding, that Zhishen and the Registrar Liu were \"possessed of literary talent,\" that Huian was \"of lofty conduct,\" and that Faru, Huineng, and Zhide were each \"capable of serving as a teacher in his own region\"—an evaluation that in itself reveals the historical reality that Hongren's disciples each excelled in their own particular strengths, with no single disciple presupposed as the inevitable \"sole orthodox\" successor. This laid the internal groundwork for the East Mountain Teaching's rapid subsequent differentiation into the Northern School, the Southern School, the Oxhead School, the Sichuan lineages, and other parallel branches.\n>\n> ---\n>\n\n## 第四部分　北宗禅：神秀一系及其历史地位的沉浮\n\n\n在弘忍身后由\"东山法门\"分化而出的诸支派中，最初声势最盛、且长期获得唐王朝最高统治阶层礼遇者，并非后世独尊的惠能\"南宗\"，而是以神秀为代表的\"北宗\"——这是理解\"六祖以外\"禅法版图时，最为关键、也最容易被通俗禅宗史叙事所遮蔽的一段历史。\n\n\n> **EN对应 · Part Four: The Northern School—Shenxiu's Lineage and the Rise and Fall of Its Historical Standing**\n>\n> Among the various branches into which the \"East Mountain Teaching\" differentiated after Hongren's death, the one that initially carried the greatest weight, and that for a long period enjoyed the favor of the highest levels of the Tang court, was not the \"Southern School\" later exalted above all others, but rather the \"Northern School\" represented by Shenxiu (神秀)—this is the most crucial, and also the most easily obscured by conventional popular accounts of Chan history, chapter in the story of \"traditions beyond Huineng.\"\n>\n\n### 一、神秀生平：\"两京法主，三帝国师\"\n\n\n神秀（606—706），俗姓李，早年博览经史，及长出家，五十岁时至黄梅东山参谒弘忍，从事打柴汲水等劳役以求法，深受弘忍器重，居弘忍门下\"上座\"（首座弟子），弘忍称其对《楞伽经》\"领宗得意\"，最为契合己意。弘忍去世后，神秀先在江陵当阳山玉泉寺弘法数十年，声名渐盛；武周久视年间，武则天遣使迎其入京，\"肩舆上殿，亲加跪礼\"，此后历经武后、中宗、睿宗三朝，皆奉其为帝室戒师，获\"两京法主，三帝国师\"（长安、洛阳两京僧俗共尊的说法主，武后、中宗、睿宗三代帝王的门师）之尊号，圆寂后谥\"大通禅师\"。神秀在世之日，声势之隆，一时\"两京之间皆宗神秀\"，与同门师弟惠能于岭南弘法之南北分立局面，时称\"南能北秀\"，然而就当时的社会影响力与制度性资源而言，神秀一系明显居于压倒性优势地位——这一点与前述北朝僧稠系相对达摩—慧可系的历史优势颇有相似的结构：在禅宗史的多个阶段，\"正统\"与\"主流\"、\"教内后世追认的道统\"与\"当时的实际社会影响力\"，往往并不重合。\n\n神秀门下弟子十九人，其中嵩山普寂、京师义福声望最著，普寂之后更被时人推为\"达摩一宗的正统法嗣\"；普寂门人道璇则将北宗禅法传至日本，是禅宗（而非仅止于后述天台、密教）东传日本的又一条独立管道。\n\n\n> **EN对应 · 1. Shenxiu's Life: \"Dharma-Master of the Two Capitals, Teacher to Three Emperors\"**\n>\n> Shenxiu (神秀, 606–706), lay surname Li, was extensively read in the classics and histories in his youth. Upon reaching adulthood he left home, and at age fifty traveled to Mount Dongshan in Huangmei to pay his respects to Hongren, undertaking such labor as gathering firewood and drawing water in his quest for the Dharma; he won Hongren's deep esteem and occupied the position of \"chief seat\" (上座) among Hongren's disciples—Hongren judged that Shenxiu had \"grasped the essential purport\" of the *Laṅkāvatāra Sūtra* most fully in accord with his own understanding. After Hongren's death, Shenxiu taught for several decades at Yuquan Monastery on Mount Dangyang in Jiangling, his reputation gradually growing; around the Jiushi era of the Wu Zhou, Empress Wu Zetian dispatched an envoy to welcome him to the capital, where he was \"carried on a palanquin up to the throne hall, [the empress] herself bowing to him in reverence.\" Thereafter, across the reigns of Empress Wu, Emperor Zhongzong, and Emperor Ruizong, he was honored as preceptor to the imperial house, earning the title \"Dharma-Master of the Two Capitals, Teacher to Three Emperors\" (兩京法主，三帝國師)—that is, the acknowledged teaching-master for the monastic and lay communities of both capitals, Chang'an and Luoyang, and the personal teacher of three successive emperors: Empress Wu, Zhongzong, and Ruizong. Upon his death he was granted the posthumous title \"Chan Master of Great Penetration\" (大通禪師). In his lifetime Shenxiu's prestige was such that, for a time, \"all within the two capitals revered Shenxiu\"; the situation in which he and his fellow-disciple Huineng, teaching in the far south of Lingnan, held sway over their respective northern and southern spheres came to be known as \"Neng in the South, Xiu in the North.\" Yet in terms of actual social influence and institutional resources at the time, Shenxiu's lineage held an overwhelming advantage—a structural parallel to the earlier advantage the Sengchou lineage held over the Bodhidharma–Hui
