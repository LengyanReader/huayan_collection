ke lineage in the Northern Dynasties, discussed above: at multiple junctures in the history of Chan, \"orthodoxy\" and \"mainstream status\"—the lineage retrospectively sanctioned within the tradition's own narrative, and the lineage that actually held sway in its own time—have frequently failed to coincide.\n>\n> Shenxiu had nineteen recorded disciples, the most eminent among them Puji of Mount Song and Yifu of the capital; Puji in particular came to be regarded by his contemporaries as \"the orthodox heir of the Bodhidharma lineage.\" Puji's disciple Dōsen (道璿) later transmitted Northern School Chan teaching to Japan—yet another, independent channel (alongside the later-discussed transmission routes of Tiantai and Esoteric Buddhism) by which Chan itself spread eastward to Japan.\n>\n\n### 二、神秀禅法：《观心论》与《大乘无生方便门》\n\n\n学界目前基本认定确系神秀本人所作的著述，主要有《观心论》与《大乘无生方便门》二种（另有《秀和尚劝善文》等，而旧题神秀所作的《圆明论》《大华严经疏》等则被考订为他人所作、非神秀真撰）。\n\n《观心论》核心主张\"万法唯心\"，认为透过持续观照自心之虚妄不实，即可断除烦恼、契入真如，反复强调\"离念\"\"无心\"\"寂知\"等工夫要诀，指示出一条通过内省观照、逐步趋近心性本源的修行路径。《大乘无生方便门》相传出自神秀门下普寂、敬贤等一系的讲学记录，内容为一系列引导学人契入\"无生\"（即涅槃实相）的方便法门，涵盖离念、不作意、\"知\"\"解\"\"见性\"等层级，论中明言\"诸佛如来有入道大方便，一念净心，顿超佛地\"——值得注意的是，\"顿超佛地\"一语已然带有相当程度的\"顿\"义色彩，说明北宗禅法本身并非全然是后世南宗批评者所简单化描绘的\"渐修\"\"渐悟\"一路，而是自有其\"藉渐修以显顿\"的内在理路。综合两论及《楞伽师资记》所记语录，学者一般将神秀一系修证次第概括为\"守心→观心→看心→看无所处\"层层递进的路径，最终指向\"能所双泯\"（\"凝心入定，住心看净，起心外照，摄心内证\"，此说见于神秀再传弟子降魔藏、普寂对师说的进一步发挥），较之南宗惠能\"直指人心，见性成佛\"的简省作风，确实呈现出更为繁复缜密的渐进结构，然而这一\"繁复\"本身，也自有其\"藉次第工夫以防狂禅之弊\"的修行论考量，未可简单以\"渐不如顿\"的南宗立场一概而论。\n\n\n> **EN对应 · 2. Shenxiu's Meditation Teaching: The *Guanxin Lun* and the *Dasheng Wusheng Fangbian Men***\n>\n> Scholarship today generally accepts two works as genuinely authored by Shenxiu himself: the *Guanxin Lun* (觀心論, \"Treatise on Contemplating the Mind\") and the *Dasheng Wusheng Fangbian Men* (大乘無生方便門, \"Mahāyāna Gate of Expedient Means for Non-Arising\")—along with the shorter *Exhortation to Goodness by Reverend Xiu*; while other works traditionally attributed to Shenxiu, such as the *Yuanming Lun* and the *Dahua Yan Jing Shu*, have been determined by scholarship to be the work of other hands, not genuinely Shenxiu's own.\n>\n> The *Guanxin Lun* centers on the thesis that \"the ten thousand dharmas are mind alone\" (萬法唯心), holding that sustained contemplation of the falsity and unreality of one's own mind enables the severing of afflictions and entry into suchness; it repeatedly emphasizes essential practices such as \"leaving thought\" (離念), \"no-mind\" (無心), and \"quiescent awareness\" (寂知), indicating a path of practice that proceeds through introspective contemplation, gradually approaching the source of the nature of mind. The *Dasheng Wusheng Fangbian Men* is traditionally attributed to the lecture records of Shenxiu's lineage under Puji, Jingxian, and others; its content consists of a series of expedient methods for guiding students into \"non-arising\" (無生, i.e., the reality of nirvāṇa), encompassing stages of leaving thought, non-intentionality, \"knowing,\" \"understanding,\" and \"seeing the nature.\" The text states explicitly: \"The buddhas and tathāgatas possess a great expedient means for entering the path—a single thought of pure mind suddenly transcends the stage of Buddhahood\"—it is worth noting that the phrase \"suddenly transcends the stage of Buddhahood\" (頓超佛地) already carries a considerable coloring of \"suddenness,\" demonstrating that Northern School meditation teaching was by no means entirely the simplistically \"gradual cultivation, gradual awakening\" tradition that later Southern School critics portrayed it as, but rather possessed its own internal logic of \"manifesting the sudden by means of the gradual.\" Drawing on both treatises together with the sayings recorded in the *Lengqie Shizi Ji*, scholars generally summarize Shenxiu's lineage's stages of practice and realization as a progressively deepening path—\"guarding the mind → contemplating the mind → observing the mind → observing that there is nowhere to abide\"—ultimately pointing toward \"the mutual extinction of subject and object\" (this teaching, articulated by Shenxiu's second-generation disciples Jiangmozang and Puji as a further development of their master's teaching, describes it as \"fixing the mind and entering samādhi, abiding in mind and observing purity, arousing the mind to illuminate outwardly, gathering the mind to verify inwardly\"). Compared with the Southern School's simplified approach of \"directly pointing to the mind, seeing the nature and becoming Buddha\" under Huineng, this indeed presents a more elaborate and meticulously constructed progressive structure—yet this very \"elaborateness\" reflects its own soteriological rationale, that of \"guarding against the pitfalls of wild Chan by means of graduated practice,\" and should not simply be dismissed, from the Southern School's own standpoint, as \"gradual\" and therefore inferior to \"sudden.\"\n>\n\n### 三、\"南顿北渐\"公案的历史生成：神会滑台大会与南宗正统叙事的建构\n\n\n北宗禅法之所以在后世汉传佛教史叙述中长期居于边缘、乃至近乎被\"抹除\"的地位，其历史转折点集中发生于开元二十二年（730年）前后：惠能弟子荷泽神会在河南滑台大云寺公开举行\"无遮大会\"，猛烈抨击以普寂为首的北宗一系\"师承是傍、法门是渐\"，极力标举惠能才是弘忍真正传衣钵的\"正统\"六祖，主张唯有惠能\"顿悟\"一系方为达摩禅法真传。这场论辩虽然在神会本人有生之年未必立即扭转北宗的社会实际地位（学者指出，据日本入唐求法僧荣西《兴禅护国论》\"顿渐门下相见如仇，南北宗相敌如楚汉\"之说虽渲染激烈，然对照《景德传灯录》《禅源诸诠集都序》等文献，南北二宗当时的实际纷争程度，或不如后世想象中那般水火不容），但神会所建构的\"南宗正统\"叙事框架，经由《坛经》的成书流传与后世灯录文献的层累采纳，最终在中晚唐以降取得了压倒性的历史书写主导权，北宗禅法自身的具体文献也随之逐渐失传于中土，直至20世纪敦煌写本重现，方使今人得以窥见其本来面目。\n\n这一\"正统叙事建构\"过程本身，近代以来吸引了几代学者的持续关注：胡适利用巴黎、伦敦所藏敦煌本神会语录及相关文献，率先系统论证了神会在确立\"南宗正统\"地位过程中所起的关键性、乃至可以说是决定性的历史作用，其研究结论虽在方法论上曾引发与铃木大拙等教内学者的著名论争，却也开创了以文献考订重估禅宗早期史的现代学术范式，后经印顺、柳田圣山等人的进一步精细化考订，早期禅宗史\"南北分立、南宗后出取胜\"的历史图景才逐渐清晰确立。1986年，美国学者马克瑞（John McRae）出版《北宗与早期禅宗的形成》（*The Northern School and the Formation of Early Ch'an Buddhism*），首次在西方学界以专著规模系统重估北宗禅法的教理内容与历史地位，主张不应简单以\"渐修\"标签化约神秀一系的实际修证体系，是当代北宗研究的奠基性著作。此外，值得一提的是，晚近亦有学者依据晚明《楞严经》与北宗禅关系的相关研究指出，北宗禅法作为一种独立思想资源，或许并未像传统禅宗史书写所暗示的那样，在唐代以后即已\"完全断绝\"，这一议题仍有待学界进一步的文献发掘与考订，此处姑存其说，以见史学结论之开放性。\n\n\n\n> **EN对应 · 3. The Historical Construction of the \"Southern Sudden, Northern Gradual\" Narrative: Shenhui's Assembly at Huatai and the Building of Southern Orthodoxy**\n>\n> The reason Northern School meditation teaching came to occupy a long-marginalized—indeed, nearly \"erased\"—position in the later narration of Chinese Buddhist history has its historical turning point concentrated around the twenty-second year of the Kaiyuan era (730 CE): Huineng's disciple Heze Shenhui (荷澤神會) publicly convened an \"unrestricted assembly\" (無遮大會) at Dayun Monastery in Huatai, Henan, fiercely attacking the Northern School lineage under Puji for having \"a lineage that was but a side-branch, and a Dharma-gate that was merely gradual,\" and vigorously championing Huineng as the true \"orthodox\" Sixth Patriarch who had genuinely received Hongren's robe and bowl, insisting that only Huineng's \"sudden awakening\" lineage represented the authentic transmission of Bodhidharma's Chan. Although this debate may not have immediately overturned the Northern School's actual social standing during Shenhui's own lifetime (scholars note that, while the account by the Japanese pilgrim-monk Eisai in his *Kōzen Gokokuron*—\"the followers of sudden and gradual regarded each other as enemies, the Southern and Northern Schools as hostile as Chu and Han\"—paints a dramatic picture, a comparison with the *Jingde Chuandeng Lu*, the *Chan Yuan Zhuquan Ji Duxu*, and other texts suggests the actual degree of contention between the two schools at the time may not have been quite as fierce as later imagination would have it), the framework of \"Southern orthodoxy\" that Shenhui constructed nonetheless achieved, through the formation and transmission of the *Platform Sūtra* and its cumulative adoption in the later transmission-record literature, an overwhelming dominance over the historical record from the mid-to-late Tang onward. The Northern School's own textual corpus gradually disappeared from circulation in China proper as well, only to be recovered—and its original character made visible to us again—through the reappearance of the Dunhuang manuscripts in the twentieth century.\n>\n> This process of \"orthodox-narrative construction\" has itself drawn the sustained attention of successive generations of modern scholars: Hu Shi, drawing on Dunhuang manuscripts of Shenhui's recorded sayings and related documents held in Paris and London, was the first to systematically demonstrate the pivotal—one might even say decisive—historical role Shenhui played in establishing the \"orthodoxy\" of the Southern School. Although his conclusions provoked, on methodological grounds, a well-known controversy with D.T. Suzuki and other scholars working from within the tradition, they nonetheless inaugurated the modern scholarly paradigm of reassessing early Chan history through philological criticism; the historical picture of early Chan history—\"a North-South split, with the Southern School emerging victorious though the later-arising party\"—was subsequently brought into sharper focus through the further refined scholarship of Yinshun, Yanagida Seizan, and others. In 1986, the American scholar John McRae published *The Northern School and the Formation of Early Ch'an Buddhism* (University of Hawai'i Press), the first Western monograph-scale systematic reassessment of the doctrinal content and historical standing of Northern School meditation teaching, arguing against a simplistic reduction of Shenxiu's lineage's actual practice-system to the label of \"gradual cultivation\"—a foundational work in contemporary Northern School studies. It is also worth noting that recent scholarship examining the relationship between the late-Ming *Śūraṅgama Sūtra* and Northern School Chan has suggested that Northern School meditation teaching, as an independent intellectual resource, may not have \"utterly vanished\" after the Tang dynasty in quite the way traditional Chan historiography implies—an issue that still awaits further textual excavation and scholarly clarification, and which is noted here simply to illustrate the open-endedness of historical conclusions.\n>\n> ---\n>\n\n## 第五部分　牛头宗：法融一系的般若禅\n\n\n与北宗禅几乎同时兴盛、却循着与《楞伽经》如来藏心性论全然不同的般若中观理路发展起来的，是活跃于金陵（今南京）一带、以法融为初祖的\"牛头宗\"（又称牛头禅），因法融驻锡牛头山（今南京市江宁区牛首山）而得名，六至七世纪间旁出发展、至初唐至中唐间极为兴盛，后世或以弘忍\"东山宗\"与之对举并称。\n\n\n> **EN对应 · Part Five: The Oxhead School—Farong's Prajñā-Based Chan**\n>\n> Flourishing at almost the same time as the Northern School, yet developing along a Prajñāpāramitā-Madhyamaka line of thought entirely different from the tathāgatagarbha-based mind-nature theory of the *Laṅkāvatāra Sūtra*, was the \"Oxhead School\" (Niutou Zong 牛頭宗, also called Oxhead Chan), active in the region of Jinling (present-day Nanjing), with Farong (法融) as its founding patriarch—so named because Farong resided at Mount Oxhead (Niutou Shan, in present-day Jiangning District, Nanjing). It emerged as a side-branch in the sixth-to-seventh centuries and flourished greatly from the early through mid-Tang; it is sometimes paired with, and set alongside, Hongren's \"East Mountain School\" in later accounts.\n>\n\n### 一、法融生平与\"东夏之达摩\"\n\n\n法融（594—657），俗姓韦，润州延陵（今江苏丹阳）人，19岁于茅山丰乐寺出家，师从三论宗兴皇法朗门下的大明法师（一作炅法师），系统研习《般若经》《中论》《百论》《十二门论》《广百论》等三论宗根本典籍，后移居牛头山幽栖寺，精研佛窟寺所藏\"七藏\"经论八年，学问渊博，声誉渐隆，门下学者云集，法席大盛，后世尊称其为\"东夏之达摩\"，足见其在当时禅林中的崇高地位。\n\n关于法融与东山法门四祖道信之间是否确有直接师承关系，是牛头宗研究中的一大公案：传统教内文献（如宗密《禅门师资承袭图》）记载，法融曾多年精研般若空宗、\"已悟诸法本空\"，后蒙道信亲自过江印证其所解，并谓\"此法从上以来只委一人，吾已付嘱弘忍，汝可自立一支\"，遂使法融于牛头山另创一系，故牛头宗传统上被视为\"四祖道信门下旁出一支\"。然而，据印顺法师等现代学者考订：法融与《续高僧传》作者道宣本为同时代人物，道宣书中却全然未提及道信曾为法融印证一事；而牛头宗初祖法融的思想渊源、教理体系，实际上与三论宗更为切近，与达摩—楞伽一系的心性论传统反倒关联疏远——据此，\"道信付法于法融\"一事，很可能是后人为将牛头宗纳入达摩正统谱系而虚构增益的传说，并非真实历史，牛头宗的思想本源应更准确地定位为\"旁出于三论宗、融合南方禅观而独立发展出的地区性宗派\"，而非达摩系的直接分支。这一考订结论，也正是本文将牛头宗作为独立重点章节而非仅作边界性脚注处理的关键依据。\n\n\n> **EN对应 · 1. Farong's Life and the Epithet \"The Bodhidharma of Eastern China\"**\n>\n> Farong (法融, 594–657), lay surname Wei, was a native of Yanling in Runzhou (present-day Jiangsu). At nineteen he left home at Fengle Monastery on Mount Mao, studying under Master Daming (also recorded as Master Jiong), a disciple in the Sanlun (Three Treatises, Madhyamaka) lineage under Xinghuang Falang, systematically studying the foundational Sanlun texts—the *Prajñāpāramitā Sūtra*, the *Mūlamadhyamakakārikā*, the *Śata-śāstra*, the *Dvādaśanikāya-śāstra*, and the *Śata-śāstra Vaipulya*. He later moved to Youqi Monastery on Mount Oxhead, spending eight years in intensive study of the \"seven treasuries\" of scriptures housed at Fokū Monastery; his learning was profound, his reputation grew, and students gathered around him in great numbers, forming a large and thriving assembly. Later generations honored him with the epithet \"the Bodhidharma of Eastern China\" (東夏之達摩)—testament to the exalted standing he held within the Chan community of his day.\n>\n> Whether Farong actually received direct transmission from Daoxin, the Fourth Patriarch of the East Mountain Teaching, is a major point of contention in Oxhead School studies. Traditional sources within the tradition (such as Guifeng Zongmi's *Chanmen Shizi Chengxi Tu*, \"Chart of the Master-Disciple Succession of the Chan Schools\") record that Farong, having spent years deeply immersed in Prajñāpāramitā-based emptiness teaching and having \"already awakened to the fundamental emptiness of all dharmas,\" received confirmation of his understanding from Daoxin, who crossed the river in person to meet him and said, \"This Dharma, from ancient times, has been entrusted to only one person at a time; I have already bequeathed it to Hongren, so you may establish your own separate branch\"—thereupon allowing Farong to found an independent lineage at Mount Oxhead, hence the traditional view of the Oxhead School as \"a side-branch issuing from the Fourth Patriarch Daoxin's lineage.\" However, according to the textual-critical findings of Master Yinshun and other modern scholars: Farong was a contemporary of Daoxuan, author of the *Xu Gaoseng Zhuan*, yet Daoxuan's work makes no mention whatsoever of Daoxin having confirmed Farong's realization; moreover, the actual intellectual origins and doctrinal system of Farong, founding patriarch of the Oxhead School, align far more closely with the Sanlun tradition, and are in fact rather distant from the mind-nature theory of the Bodhidharma–Laṅkāvatāra lineage. On this basis, the story of \"Daoxin's transmission of the Dharma to Farong\" is very likely a legend fabricated and embellished by later generations in order to fold the Oxhead School into the orthodox Bodhidharma genealogy, rather than genuine history; the intellectual origins of the Oxhead School are more accurately located as \"a regional school that arose as a side-branch of the Sanlun tradition, fused with Southern-style meditative practice, and developed independently,\" rather than as a direct branch of the Bodhidharma lineage. This textual-critical conclusion is precisely the reason this study treats the Oxhead School as an independent, major chapter in its own right, rather than confining it to a boundary-case footnote.\n>\n\n### 二、\"本来无事\"：牛头禅法的般若底色\n\n\n牛头宗教理立场直承三论宗《般若经》《中论》一系，核心命题为\"一切皆空\"\"本来无事\"：法融《心铭》有云，\"心性不生，何须知见；本无一法，谁论熏炼\"\"菩提本有，不须用守；烦恼本无，不须用除\"，这种\"不修而修\"\"不须造作对治\"的表述方式，与后来南宗禅所倡导的顿悟说存在明显的先声关系，值得特别注意——换言之，牛头禅法虽独立于达摩系之外发展，其\"般若扫荡一切执著\"的精神气质，客观上却对后世南宗顿悟禅风的形成产生了相当程度的思想铺垫作用，二者之间的关系是\"平行独立发展、又彼此渗透影响\"，而非简单的\"谱系传承\"或\"全然无关\"。\n\n传世记录法融禅法的重要文献，除《心铭》外，另有《绝观论》（以师徒问答体呈现，20世纪初经巴黎、北京所藏敦煌写本多个抄本比对校订而重新面世，年代约在唐贞元十年〔794〕前后）。华严宗五祖宗密在其判教性质的《禅门师资承袭图》中，将牛头宗判为\"泯绝无寄宗\"——意谓此宗主张\"体诸法如梦，本来无事，心境本寂……既达本来无事，理已丧、情已忘，情忘即绝苦因\"，是一种以\"忘情\"为根本修行方法的教法。牛头宗另一饶有理论创见之处，在于其\"无情有性\"说——主张草木瓦石等无情之物亦具佛性，这一命题后经天台宗九祖湛然进一步阐扬发挥，对宋代以降的中国佛教心性论产生了深远影响（二者间具体的思想承袭脉络，学界尚有讨论余地）。\n\n\n> **EN对应 · 2. \"Originally Nothing the Matter\": The Prajñā Coloring of Oxhead Meditation Teaching**\n>\n> The doctrinal position of the Oxhead School directly inherits the Sanlun lineage of the *Prajñāpāramitā Sūtra* and the *Mūlamadhyamakakārikā*; its core thesis is that \"all is empty\" and \"originally nothing the matter\" (本來無事). Farong's *Xin Ming* (心銘, \"Inscription on the Mind\") declares: \"The nature of mind is unborn—what need is there of knowing and seeing? Originally there is not a single dharma—what is there to speak of cultivating and refining?\" and \"Bodhi is originally possessed—there is no need to guard it; affliction is originally non-existent—there is no need to eliminate it.\" This mode of expression—\"not cultivating yet cultivating,\" \"requiring no contrived antidote\"—bears an evident precursory relationship to the doctrine of sudden awakening later championed by the Southern School, and merits particular attention: in other words, although Oxhead meditation teaching developed independently of the Bodhidharma lineage, its spiritual temperament of \"sweeping away all attachment through Prajñā\" objectively laid a considerable degree of intellectual groundwork for the later formation of the Southern School's sudden-awakening ethos. The relationship between the two is one of \"parallel, independent development coupled with mutual interpenetration and influence,\" rather than simple \"genealogical transmission\" or \"no relation whatsoever.\"\n>\n> Beyond the *Xin Ming*, another important surviving text recording Farong's meditation teaching is the *Jueguan Lun* (絕觀論, \"Treatise on the Transcendence of Contemplation,\" presented in a master-disciple question-and-answer format), which reemerged in the early twentieth century through the collation of several manuscript copies held in Paris and Beijing, dated to approximately 794 CE. Guifeng Zongmi, Fifth Patriarch of the Huayan school, classified the Oxhead School in his doxographical *Chanmen Shizi Chengxi Tu* as the teaching of \"extinguishing all and relying on nothing\" (泯絕無寄宗)—meaning a school that holds that \"all dharmas are to be regarded as a dream; originally there is nothing the matter, and mind and its objects are fundamentally quiescent... having realized that originally there is nothing the matter, principle is lost and sentiment is forgotten; when sentiment is forgotten, the cause of suffering is severed\"—a teaching that takes \"forgetting sentiment\" as its fundamental method of practice. Another noteworthy theoretical innovation of the Oxhead School lies in its doctrine that \"even the insentient possess Buddha-nature\" (無情有性)—holding that even insentient things such as plants and stones possess Buddha-nature—a thesis later elaborated further by Zhanran, Ninth Patriarch of the Tiantai school, and one that exerted a profound influence on Chinese Buddhist mind-nature theory from the Song dynasty onward (though the precise intellectual line of transmission between the two remains a matter of scholarly discussion).\n>\n\n### 三、法脉传承与最终的历史归宿\n\n\n牛头宗法脉，据传自法融以下，历智严、慧方、法持、智威、慧忠与玄素、道钦、道林，凡八世而绝，前后延续约二百年，鸟窠道林（741—824，即著名\"鸟窠禅师\"，与白居易问答\"诸恶莫作，诸善奉行\"公案的主角）常被视为此宗最后一位具有重要影响的传人。牛头宗兴盛于唐代中期，然因其教义、修证旨趣与其后取得压倒性优势的南宗禅颇有相通、相近之处，最终\"为禅宗所融摄，传承断绝\"，其独立宗派的历史身份逐渐湮没于主流禅宗叙事之中，此一\"因太过相似而被吸收消化、终至历史身份模糊\"的命运轨迹，与前述北宗禅\"因立场相左而被激烈批判、进而边缘化\"的历史际遇形成饶有意味的对照，二者共同揭示出：一个禅法支派在历史书写中的地位沉浮，往往并不完全取决于其教理本身的深浅优劣，而是深受具体历史进程中诸种偶然因素（地域、政治资源、后继弟子的活跃程度、乃至与\"胜利者\"叙事的相似或相异程度）的形塑。\n\n\n\n> **EN对应 · 3. Lineage Transmission and Its Ultimate Historical Fate**\n>\n> The Oxhead lineage is traditionally said to have descended from Farong through Zhiyan, Huifang, Fachi, Zhiwei, Huizhong and Xuansu, Daoqin, and Daolin—eight generations in all, spanning roughly two centuries, with Niaoke Daolin (鳥窠道林, 741–824—the celebrated \"Bird's Nest Chan Master,\" famous for his exchange with the poet Bai Juyi on \"avoiding all evil, upholding all good\") generally regarded as the last figure of significant influence in this line. The Oxhead School flourished during the mid-Tang, but because its doctrine and soteriological orientation bore considerable resemblance and affinity to those of the Southern School, which subsequently achieved overwhelming dominance, it was ultimately \"absorbed into the Chan school, its independent transmission coming to an end,\" its identity as an independent school gradually dissolving into the mainstream Chan narrative. This trajectory—an identity rendered obscure precisely through being absorbed and digested for being *too similar* to the eventual victor—forms an intriguing contrast with the fate of Northern School Chan discussed above, which was instead fiercely criticized and marginalized precisely *because* its position diverged from the victor's. Together, the two cases reveal that the rise and fall of a Chan branch's standing in the historical record depends not entirely on the relative depth or sophistication of its own doctrine, but is profoundly shaped by any number of contingent historical factors—region, political resources, the vigor of one's later disciples, and indeed the degree of resemblance or divergence from the eventual \"victor's\" own narrative.\n>\n> ---\n>\n\n## 第六部分　蜀地禅系：净众宗、保唐宗及其西传吐蕃\n\n\n在东山法门分化出的诸支派中，还有一支地域色彩鲜明、且因近年敦煌藏文文献的发掘而愈发引人注目者，即由弘忍门下十大弟子之一智诜开创、其后在四川境内递相发展出净众宗、保唐宗两支的\"蜀地禅系\"。此系不仅在中土自成一格，与惠能南宗、神秀北宗形成三足鼎立之势，更循河西走廊西传吐蕃，直接卷入了8世纪末吐蕃佛教史上著名的\"顿渐之诤\"（拉萨僧诤／桑耶论争），是\"六祖以外禅法\"向外辐射、发生跨文化传播最具戏剧性的一段公案。\n\n\n> **EN对应 · Part Six: The Sichuan Lineages—The Jingzhong and Baotang Schools, and Their Transmission into Tibet**\n>\n> Among the branches into which the East Mountain Teaching differentiated, one possesses a particularly distinct regional character, and has drawn increasing scholarly attention in recent years owing to the excavation of Dunhuang Tibetan-language documents: the \"Sichuan lineage\" (蜀地禪系), founded by Zhishen (智詵), one of Hongren's ten great disciples, and subsequently developing within Sichuan into the two branches of the Jingzhong (淨眾) and Baotang (保唐) schools. Not only did this lineage develop its own distinctive character within China proper, forming a three-way rivalry with Huineng's Southern School and Shenxiu's Northern School, it also spread westward along the Hexi Corridor into Tibet, becoming directly caught up in the famous \"Debate of Sudden and Gradual\" (頓漸之諍, also called the Lhasa Debate or the Samye Debate) in late-eighth-century Tibetan Buddhist history—one of the most dramatic episodes of cross-cultural transmission in the entire \"Chan traditions beyond Huineng\" story.\n>\n\n### 一、智诜与处寂：信衣东传西蜀\n\n\n智诜为弘忍十大弟子之一，弘忍去世后返回蜀中，开创蜀地禅系。据蜀地禅宗自身的传承叙事，智诜圆寂前，将传说中武则天所赐、象征达摩正传的信衣袈裟传付法嗣弟子处寂；然而由于智诜一系只得到了这件作为信物的袈裟，却未获得来自上一代祖师\"以心印心\"式的密传心印确证，从传法程序的严格意义上说存在缺环，故蜀地禅系历代得此信衣者，均不敢僭称\"祖\"号，这一点也从侧面反映出，在盛唐禅林的公共认知中，\"信衣\"与\"心印\"二者的正当性来源实际上是被区别对待的，为后世围绕\"传衣是否等于传法\"的诸多争论（这一争论在惠能\"衣钵南传\"的叙事中同样具有核心地位）提供了另一个饶有意味的参照案例。\n\n\n> **EN对应 · 1. Zhishen and Chuji: The Robe of Faith Travels East to West Sichuan**\n>\n> Zhishen was one of Hongren's ten great disciples; after Hongren's death he returned to Sichuan, where he founded the Sichuan lineage. According to the Sichuan lineage's own account of its transmission, before his death Zhishen bequeathed to his dharma-heir Chuji (處寂) the robe of faith (信衣) reputedly bestowed by Empress Wu Zetian, symbolizing legitimate succession from Bodhidharma. However, because the Zhishen lineage possessed only this robe as a physical token of transmission, without having received the \"mind-to-mind seal\" of confirmation from the preceding generation of patriarch, there was, strictly speaking, a gap in the formal procedure of dharma-transmission—and for this reason, successive generations of the Sichuan lineage who held this robe of faith never dared to claim the title of \"patriarch\" (祖) for themselves. This in itself reflects something telling about the public understanding, within the High Tang Chan community, of the different sources of legitimacy carried by \"the robe\" versus \"the mind-seal\" respectively—providing another instructive point of comparison for the many later controversies over whether \"transmitting the robe\" is equivalent to \"transmitting the Dharma\" (a controversy that likewise occupies a central place in the narrative of Huineng's own \"robe traveling south\").\n>\n\n### 二、无相与净众宗：\"无忆、无念、莫忘\"三句法门\n\n\n处寂门下最具影响力的弟子，是新罗（今朝鲜半岛）圣德王三太子出身、俗姓金、故被蜀地民间称为\"金和尚\"的无相禅师（生卒年异说纷纭，一说684—762，一说648—742，一说680—756，学界尚无定论）。无相于唐开元十六年（728）浮海西渡入华，先被唐玄宗召见并编籍长安禅定寺，后西行入蜀，至资州（今四川资中）德纯寺拜处寂为师，\"燃指为灯\"以示求法至诚，处寂遂收其为徒并赐名\"无相\"。无相住持成都净众寺，故其所开宗派称\"净众宗\"；唐玄宗避安史之乱入蜀时对其礼敬有加，成都县令杨翌亦为之募建净众、菩提、宁国等寺，其后唐玄宗更敕建规模宏大的大圣慈寺（共九十六院，赐田千亩），命无相\"立规制\"，可见其在蜀地佛教界一度享有的崇高地位与丰厚的官方资源支持——这一制度性优势的取得模式，与前述北朝僧稠、盛唐神秀所获帝王供养的历史情境，同样具有可资比较的结构相似性。\n\n无相禅法据敦煌遗书《历代法宝记》所载，核心为\"无忆、无念、莫忘\"三句（一作\"莫妄\"）：\"无忆是戒，无念是定，莫妄是慧，此三句语即是总持门\"，将传统戒定慧三学与\"无忆无念\"的心性论直接对应统摄，是一套高度精炼简省的修证纲领。饶富意味的是，无相自称其禅法\"直承达摩\"，而非承袭自智诜、处寂一系的传授——这一自我定位本身即透露出蜀地禅系内部法脉认同的某种张力与流动性。无相在蜀传法二十年间，\"禅风之盛，遍及益州\"，圆寂前将信衣传付弟子无住。\n\n\n> **EN对应 · 2. Wuxiang and the Jingzhong School: The Three-Phrase Teaching of \"No Recollection, No Thought, Do Not Forget\"**\n>\n> The most influential of Chuji's disciples was Wuxiang (無相), a prince of the Silla royal house (present-day Korean peninsula) by birth, lay surname Kim, popularly known among the people of Sichuan as \"Monk Kim\" (金和尚)—his precise birth and death dates remain disputed, with sources variously giving 684–762, 648–742, or 680–756, and no scholarly consensus has yet been reached. Wuxiang crossed the sea to China in the sixteenth year of the Kaiyuan era (728 CE); he was first received in audience by Emperor Xuanzong and registered at Chan Ding Monastery in Chang'an, before traveling west into Sichuan, where he became a disciple of Chuji at De Chun Monastery in Zizhou (present-day Zizhong, Sichuan), demonstrating his sincerity in seeking the Dharma by burning his own finger as a lamp-offering; Chuji thereupon accepted him as a disciple and bestowed on him the name \"Wuxiang\" (\"No Characteristic\"). Wuxiang presided over Jingzhong Monastery in Chengdu, hence the school he founded came to be called the \"Jingzhong School.\" When Emperor Xuanzong fled to Sichuan during the An Lushan Rebellion, he treated Wuxiang with great reverence; the Chengdu county magistrate Yang Yi likewise raised funds on his behalf to build Jingzhong, Bodhi, and Ningguo monasteries, and Xuanzong subsequently commissioned the construction of the large-scale Da Sheng Ci Monastery (comprising ninety-six courtyards, with a thousand mu of land granted), ordering Wuxiang to \"establish its regulations\"—clear evidence of the exalted standing and abundant official patronage he enjoyed within Sichuan's Buddhist community for a time. This pattern of acquiring institutional advantage bears comparison, in its structure, with the historical circumstances discussed above in which Sengchou in the Northern Dynasties and Shenxiu in the High Tang each received imperial patronage.\n>\n> Wuxiang's meditation teaching, as recorded in the Dunhuang manuscript *Lidai Fabao Ji* (歷代法寶記, \"Record of the Dharma-Treasure Through the Generations\"), centers on a three-phrase formula: \"no recollection, no thought, do not forget\" (無憶、無念、莫忘, in one variant reading, \"do not err,\" 莫妄): \"No recollection is precepts; no thought is concentration; not erring is wisdom—these three phrases together constitute the gate of the total-holding [dhāraṇī]\"—directly correlating the traditional threefold training of precepts, concentration, and wisdom with a mind-nature theory of \"no recollection, no thought,\" a highly condensed and economical formula for practice and realization. Intriguingly, Wuxiang himself claimed that his meditation teaching descended \"directly from Bodhidharma,\" rather than being transmitted through the Zhishen-Chuji lineage—a self-positioning that in itself reveals a certain tension and fluidity in lineage identity within the Sichuan school. Wuxiang taught in Sichuan for some twenty years, during which \"the flourishing of his Chan style spread throughout the whole of Yizhou [Sichuan]\"; before his death he passed the robe of faith on to his disciple Wuzhu.\n>\n> Western scholarship's systematic study of this Sichuan lineage owes its foundation above all to the American scholar Wendi Adamek: her book *The Mystique of Transmission* offers an in-depth examination of the historical context of the eighth-century Sichuan meditation community, and her subsequent *The Teachings of Master Wuzhu: Zen and Religion of No-Religion* provides a complete English translation of, and detailed introduction to, the *Lidai Fabao Ji*, situating Wuzhu's \"anti-institutional\" \"religion of no-religion\" within the broader context of medieval Chinese Buddhist intellectual history—and pointing out that the account of Empress Wu Zetian bestowing the robe is very likely a textual construction devised by the Baotang School to establish its own legitimacy (one that conflicts with the \"accepted\" belief of the time that the robe of faith was enshrined at Huineng's stūpa in Shaozhou). Adamek's work stands as the single most important piece of Western scholarship on the Baotang School to date.\n>\n\n### 三、无住与保唐宗\n\n\n无住（714—774），据传\"长相貌似无相，被认为是无相的化身\"，仅随无相学法三日便已\"深契法要\"，成为其法嗣，后驻锡成都保唐寺弘法，故所开宗派称\"保唐宗\"。无住继承并进一步发挥无相\"无忆、无念、莫忘\"的教法，同样修头陀行，亦雅好禅茶之道，其语录（同样赖敦煌本《历代法宝记》保存）主张\"教行不拘而灭识\"，较之净众宗更趋简省激越，带有相当程度的\"呵教毁相\"色彩。西方学界对这支蜀地禅系的系统研究，首推美国学者文迪·雅德克（Wendi Adamek）：其《传承的迷思》（*The Mystique of Transmission*）一书深入考察了8世纪四川禅法社群的历史脉络，其后《无住禅师的教法：禅与\"无宗教之宗教\"》（*The Teachings of Master Wuzhu: Zen and Religion of No-Religion*）更提供了《历代法宝记》的完整英译与详尽导读，将无住\"反建制\"的\"无宗教之宗教\"思想置于中古中国佛教史脉络中加以阐释，并指出书中武则天赐衣一事很可能是保唐宗为自证正统而作的文献建构（与当时\"公认\"信衣藏于韶州惠能塔中的说法相抵触），是目前西方学界关于保唐宗最重要的研究成果。\n\n这里有一个饶有理论旨趣、却较少被充分讨论的现象值得特别指出：净众宗、保唐宗两代祖师之法名恰为\"无相\"与\"无住\"，二字连同\"无念\"，几乎正是后世《六祖坛经》中概括惠能禅法根本纲领的著名\"三句口诀\"——\"我此法门，从上以来，先立无念为宗，无相为体，无住为本\"！这一术语上的高度重合，究竟是纯属巧合的思想史共鸣（般若\"三无\"本是大乘经论中的常见语汇，各支禅系不约而同地采用亦不足为奇），抑或《坛经》成书过程中确曾在某种程度上吸收、糅合了蜀地禅系的既有术语资源，是禅宗文献学界至今仍有讨论空间的一个饶有趣味的公案，本文姑存疑而不做定论，谨此提请读者留意。\n\n\n> **EN对应 · 3. Wuzhu and the Baotang School**\n>\n> Wuzhu (無住, 714–774) is said to have \"resembled Wuxiang in appearance, and was regarded as Wuxiang's incarnation\"; after studying under Wuxiang for a mere three days he had already \"deeply penetrated the essentials of the teaching,\" becoming his dharma-heir. He subsequently resided at Baotang Monastery in Chengdu, hence the school he founded came to be called the \"Baotang School.\" Wuzhu inherited and further developed Wuxiang's teaching of \"no recollection, no thought, do not forget\"; he too practiced ascetic discipline and was fond of the art of Chan tea. His recorded sayings (likewise preserved through the Dunhuang manuscript *Lidai Fabao Ji*) advocate \"extinguishing consciousness unconstrained by either doctrine or practice\"—a still more radically condensed and iconoclastic teaching than that of the Jingzhong School, marked by a considerable degree of \"castigating the teachings and destroying [attachment to] characteristics.\"\n>\n> There is a phenomenon here, rich in theoretical interest yet seldom fully discussed, that deserves particular emphasis: the dharma-names of the two successive patriarchs of the Jingzhong and Baotang schools happen to be \"Wuxiang\" (無相, \"No Characteristic\") and \"Wuzhu\" (無住, \"No Abiding\")—these two characters, together with \"wunian\" (無念, \"no thought\"), are almost precisely the famous \"three-phrase formula\" through which the later *Platform Sūtra* summarizes the fundamental tenet of Huineng's own meditation teaching: \"In this Dharma-gate of mine, from ancient times, we first establish no-thought as the doctrine, no-characteristic as the substance, and no-abiding as the root!\" Whether this striking terminological overlap represents purely coincidental resonance in the history of ideas (the Prajñāpāramitā \"threefold negation\" is, after all, common vocabulary across Mahāyāna scripture and treatise literature, and it would hardly be surprising for different Chan lineages to independently converge on such usage), or whether the compilation process of the *Platform Sūtra* did in fact, to some degree, absorb and blend in existing terminological resources from the Sichuan lineage, remains an intriguing puzzle within Chan philology that still awaits further discussion; this study leaves the question open without asserting a definitive conclusion, and simply calls it to the reader's attention.\n>\n\n### 四、摩诃衍与吐蕃\"顿渐之诤\"：蜀地禅法的域外回响\n\n\n比蜀地禅系西传吐蕃更为学界所熟知的，是敦煌禅僧摩诃衍（生平不详，活跃于8世纪后期）应吐蕃赞普赤松德赞之请、于786年经沙州入藏传播禅法一事。据敦煌汉文写本《顿悟大乘正理决并序》（伯希和4646号等编号）记载，摩诃衍于逻娑（拉萨）、章蹉（昌珠寺）、勃菅漫（桑耶寺）等地弘扬\"顿悟\"禅法，一时\"禅宗蔚然成风\"；792至794年间，吐蕃王室召集印度中观论师莲花戒（Kamalaśīla）与摩诃衍公开辩论\"顿悟\"（摩诃衍所倡，主张\"无思无观\"、不需渐次法行即可成佛）与\"渐悟\"（印度僧人所倡，主张须经资粮、加行等渐次修习）孰为正途，史称\"拉萨僧诤\"或\"桑耶论争\"（藏文史料称\"顿渐之诤\"）。据藏文史料记载，这场论辩最终以摩诃衍\"献上花鬘\"承认落败告终，此后印度中观—渐修一系确立为吐蕃佛教的正统方向，然敦煌汉文文献《顿悟大乘正理决》一方的记载则显示，摩诃衍其后仍获吐蕃\"大德\"尊号、继续受到相当程度的礼遇，禅宗在吐蕃的影响也并未因此次论争而骤然、彻底终结，其弟子南喀宁布、益西央等吐蕃僧人的名字，仍频繁出现于青海、甘肃、西藏境内多处石刻题记之中。\n\n尤其值得纳入本文视野的是：日本学者山口瑞风、小畠宏允等人的研究业已证实，早在摩诃衍入藏（786年）之前，以\"金和尚\"无相为首的净众宗，即已经由某种传播渠道率先传入吐蕃；其后保唐宗无住的部分语录，亦经翻译以藏文写本形式保存至今（如伯希和藏文写本Pt.116号）。换言之，\"六祖以外\"的蜀地禅法，实际上是汉传禅宗诸支系中最早、且传播渠道相对独立地进入西藏佛教视野的一支，其历史意义丝毫不逊于后来更负盛名的摩诃衍\"顿渐之诤\"公案，却因传世文献相对零散、需仰赖敦煌古藏文写本的专门释读方能重建，长期未能进入一般汉语读者的知识视野——这也正是本文将其特别标举为一个独立小节、纳入\"六祖以外禅法\"版图的用意所在。\n\n\n\n> **EN对应 · 4. Moheyan and the Tibetan \"Debate of Sudden and Gradual\": The Sichuan Lineage's Echo Beyond China's Borders**\n>\n> Better known to scholarship than the Sichuan lineage's own westward transmission into Tibet is the story of the Dunhuang Chan monk Moheyan (摩訶衍, biographical details unknown, active in the latter half of the eighth century), who, at the invitation of the Tibetan Tsenpo Trisong Detsen, entered Tibet via Shazhou in 786 to propagate Chan teaching. According to the Dunhuang Chinese-language manuscript *Dunwu Dasheng Zhengli Jue Bing Xu* (頓悟大乘正理決并序, \"Bull's-Eye Decision on the Correct Principle of the Mahāyāna of Sudden Awakening, with Preface\"; catalogued as Pelliot Chinois 4646 and others), Moheyan propagated \"sudden awakening\" Chan teaching at Lhasa, Changzhu (Tradruk Monastery), and Bamplé (Samye Monastery), and for a time \"Chan flourished vigorously.\" Between 792 and 794, the Tibetan royal court convened a public debate between the Indian Madhyamaka master Kamalaśīla and Moheyan on which represented the true path—\"sudden awakening\" (advocated by Moheyan, who held that Buddhahood could be attained through \"no thought, no contemplation\" without need of graduated practice) or \"gradual awakening\" (advocated by the Indian monks, who held that graduated cultivation through the stages of accumulation and preparation was required)—an event known to history as the \"Lhasa Debate\" or the \"Samye Debate\" (referred to in Tibetan sources as the \"Debate of Sudden and Gradual\"). Tibetan-language sources record that this debate ultimately ended with Moheyan's concession of defeat, \"presenting a garland of flowers\" in acknowledgment; thereafter, the Indian Madhyamaka–gradualist line was established as the orthodox direction for Tibetan Buddhism. Yet the account preserved in the Chinese-language *Dunwu Dasheng Zhengli Jue*, representing the other side, indicates that Moheyan nonetheless continued to receive the honorific title of \"Great Virtuous One\" and a considerable degree of continued respect thereafter; Chan's influence in Tibet was likewise not abruptly and completely extinguished by this debate—the names of his disciples Namkhé Nyingpo and Yeshé Yang continue to appear frequently in rock inscriptions found across Qinghai, Gansu, and Tibet.\n>\n> What deserves particular inclusion in the purview of this study is this: research by the Japanese scholars Yamaguchi Zuihō and Obata Hiroyuki has established that, even before Moheyan's entry into Tibet in 786, the Jingzhong School, led by \"Monk Kim\" Wuxiang, had already been transmitted into Tibet through some channel; and that a portion of Baotang-School founder Wuzhu's recorded sayings has likewise survived in Tibetan-language manuscript form (such as Pelliot tibétain 116). In other words, the \"beyond-Huineng\" Sichuan lineage was, in fact, the earliest branch of the Chinese Chan tradition—and one transmitted through a relatively independent channel—to enter the purview of Tibetan Buddhism; its historical significance is by no means inferior to that of the later, far more celebrated case of Moheyan's \"Debate of Sudden and Gradual.\" Yet because the surviving textual record is comparatively scattered, and reconstruction depends on the specialized reading of Dunhuang Old Tibetan manuscripts, this episode has long failed to enter the general awareness of Chinese-language readers—which is precisely the reason this study singles it out for treatment in its own dedicated section, incorporating it into the map of \"traditions beyond Huineng.\"\n>\n> ---\n>\n\n## 第七部分　天台止观体系\n\n\n与前述北宗、牛头宗、蜀地诸系一样独立于南宗禅之外发展，却循着与说一切有部阿毗达磨传统、乃至与《楞伽经》如来藏心性论截然不同的般若中观理路发展起来的，是后来成为天台宗核心修行论述的\"止观\"体系。天台宗诸祖师——慧文、慧思、智顗、灌顶、智威、慧威、玄朗、湛然等——在《续高僧传》等早期史料中均被称为\"禅师\"，且事实上以修禅、禅观著称，然而其法脉渊源与教理依据，与达摩系诸支均无交涉，是一条完全独立发展出来的禅观路径。\n\n\n> **EN对应 · Part Seven: The Tiantai Contemplative System**\n>\n> Flourishing at nearly the same time as the Northern School, the Oxhead School, and the Sichuan lineages discussed above—yet independent of the Southern School in an entirely different sense—and developing along a Prajñāpāramitā-Madhyamaka line of thought that owes nothing to either the Sarvāstivādin Abhidharma tradition or the tathāgatagarbha theory of the *Laṅkāvatāra Sūtra*, is the \"śamatha-vipaśyanā\" (止觀, \"calm and insight,\" hereafter \"zhiguan\") contemplative system that would become the core practice-discourse of the Tiantai school. The Tiantai patriarchs—Huiwen, Huisi, Zhiyi, Guanding, Zhiwei, Huiwei, Xuanlang, Zhanran, and others—are all referred to as \"Chan masters\" (禪師) in early sources such as the *Xu Gaoseng Zhuan*, and were indeed renowned for their meditative practice; yet their lineage's origins and doctrinal foundations have no connection whatsoever to any branch of the Bodhidharma tradition—theirs is an entirely independently developed path of contemplative practice.\n>\n\n### 一、法脉渊源：龙树中观学而非楞伽心性学\n\n\n天台止观之学，教内传统追溯其\"今师相承\"世系为：北齐慧文（生卒年不详，约活动于534—577年间）—南岳慧思（515—577）—天台智顗（538—598）。据《摩訶止观》灌顶所记，慧文因习读龙树《大智度论》\"三智一心中得\"及《中论》\"因缘所生法，我说即是空，亦名为假名，亦名中道义\"一偈，悟入空、假、中三谛圆融之理，创立\"一心三观\"法门；慧思承此禅法，又将其与《法华经》\"十如是\"义理结合，形成独具特色的\"法华三昧\"\"诸法实相\"论述，兼弘定慧二门；智顗师事慧思，尽得其传，后于陈隋之际弘化于金陵、荆州、天台山等地，正式建立起以\"止观\"为纲、\"教观双美\"的天台一宗。\n\n值得特别强调的是，此一法脉在教理渊源上直接上溯龙树《中论》《大智度论》，属般若中观系统，与达摩系所依《楞伽经》\"藉教悟宗\"、以如来藏—阿赖耶识心性论为背景的理路，分属完全不同的印度大乘思想脉络。天台自身的\"金口相承\"传说虽也远溯释迦、迦叶、阿难，乃至马鸣、龙树，但这一传说系谱与达摩系\"西天二十八祖\"传说系谱各自独立编织、彼此并不交涉，也从未出现\"天台诸祖曾师事达摩\"一类的传统说法。太虚大师即曾明确指出，\"实相禅\"法自罗什译出禅要，\"传述\"而已，真正\"用为实地修行并正式成立中道实相禅\"者，是慧文、慧思、智顗天台三祖，此说恰可与本文\"独立于达摩诸系之外的禅法体系\"这一主题相印证。\n\n\n> **EN对应 · 1. Lineage Origins: Nāgārjunian Madhyamaka Rather than Laṅkāvatāra Mind-Nature Theory**\n>\n> The Tiantai zhiguan teaching traces, in its own internal transmission-lineage tradition, the \"succession of present-day teachers\" as follows: Huiwen (慧文) of the Northern Qi (dates unknown, active roughly 534–577)—Nanyue Huisi (慧思, 515–577)—Tiantai Zhiyi (智顗, 538–598). According to Guanding's record in the *Mohe Zhiguan*, Huiwen, through reading Nāgārjuna's *Mahāprajñāpāramitā-śāstra* passage \"the three kinds of wisdom are attained within a single mind\" and the verse from the *Mūlamadhyamakakārikā*, \"that which arises through dependent origination, I declare to be empty; it is also a provisional name, and also the meaning of the middle way,\" awakened to the principle of the threefold, mutually-perfect truth of emptiness, provisional existence, and the middle, thereby founding the method of \"the threefold contemplation within a single mind\" (一心三觀). Huisi inherited this meditative teaching and further fused it with the doctrine of the \"ten suchnesses\" (十如是) from the *Lotus Sūtra*, forming his own distinctive teachings of the \"Lotus samādhi\" and \"the true reality of all dharmas,\" while promoting both concentration and wisdom equally. Zhiyi studied under Huisi and fully inherited his transmission; he subsequently taught at Jinling, Jingzhou, Mount Tiantai, and elsewhere during the Chen-Sui transition, formally establishing the Tiantai school, which takes \"zhiguan\" as its guiding thread and is renowned for its equal excellence in both doctrine and contemplative practice.\n>\n> It is particularly worth emphasizing that this lineage's doctrinal origins trace directly back to Nāgārjuna's *Mūlamadhyamakakārikā* and *Mahāprajñāpāramitā-śāstra*—the Prajñāpāramitā-Madhyamaka system—an entirely different strand of Indian Mahāyāna thought from the tathāgatagarbha–ālayavijñāna-based path of \"entering principle by means of the teaching\" that the Bodhidharma lineage takes from the *Laṅkāvatāra Sūtra*. Although the Tiantai school's own legend of \"oral transmission from the Buddha's own mouth\" likewise traces back to Śākyamuni, Kāśyapa, and Ānanda, and even to Aśvaghoṣa and Nāgārjuna, this legendary genealogy was woven independently of, and has no point of contact with, the Bodhidharma lineage's legendary genealogy of the \"twenty-eight Indian patriarchs\"; nor does one ever find, within the tradition, any claim that \"the Tiantai patriarchs once studied under Bodhidharma.\" Master Taixu once stated explicitly that the \"reality-contemplation Chan\" tradition, beginning from Kumārajīva's translation of the meditation essentials, remained a matter of mere \"transmission and recitation\"; it was Huiwen, Huisi, and Zhiyi, the three patriarchs of Tiantai, who truly \"put it into actual practice and formally established the Middle Way reality-contemplation Chan\"—a statement that resonates precisely with this study's theme of \"meditation systems developing independently of the various Bodhidharma-lineage traditions.\"\n>\n\n### 二、智顗的三种止观：渐次、不定、圆顿\n\n\n智顗一生说法浩繁，仅止观类著作即自成体系，后世总结为\"天台三大部\"止观论述，依修证次第分为三种：\n\n**渐次止观**——即智顗早年所说、由弟子法慎记录成书的《释禅波罗蜜次第法门》（十卷，又称《禅门修证》），以\"禅\"字统摄一切佛法，由浅入深，如登楼历阶，循序渐进，是三种止观中篇幅最大、涉及禅修具体技术细节最为详备者。\n\n**不定止观**——即《六妙法门》（一卷），智顗应尚书令毛喜之请，于金陵瓦官寺讲说，自南朝陈光大元年（567）至太建七年（575）历时八年方告完成，阐说数、随、止、观、还、净\"六妙门\"，深浅顿渐可自由活用变化，如金刚宝石在日光下光芒闪烁不定，故名\"不定\"。\n\n**圆顿止观**——即《摩訶止观》（十卷，灌顶记），智顗于荆州玉泉寺所说，以最高至深之心境为直接出发点，发挥智顗自身圆熟的观行体系，正面显示\"三种止观\"中意旨最为深奥精要者，历来被视为天台宗最重要的根本论典之一。\n\n三者之外，另有专为初机而设的简易入门读本《修习止观坐禅法要》（一卷，又称《童蒙止观》《小止观》），系统介绍具足二十五种前方便、五种障道因缘的对治、正修止观十意等内容，文字质朴、层次分明，历来被视为汉传佛教止观修习最重要的入门教材之一，流传之广、影响之深，甚至超过篇幅浩繁的《摩訶止观》本身。此外，智顗门人所记《禅门口诀》一书，专述以调息为主的坐禅治病之法，\"后世武术中之运气，追其源出始于禅门\"，是天台禅观向世俗养生文化外溢的一个饶有趣味的例证。\n\n\n> **EN对应 · 2. Zhiyi's Three Forms of Zhiguan: Gradual, Variable, and Perfect-Sudden**\n>\n> Zhiyi's teaching career was prolific, and his zhiguan-related writings alone constitute a self-contained system, later summarized as the \"Three Great Works\" (三大部) of Tiantai zhiguan literature, classified according to the order of practice and realization into three forms:\n>\n> **Gradual zhiguan** (漸次止觀)—that is, the *Shi Chan Boluomi Cidi Famen* (釋禪波羅蜜次第法門, \"Sequential Gates of the Perfection of Meditation Explained,\" ten fascicles, also known as the *Chanmen Xiuzheng*), which Zhiyi expounded in his earlier years and his disciple Fashen recorded; taking the term \"chan\" as encompassing the entirety of the Buddhadharma, it proceeds from shallow to deep in orderly sequence, like ascending a tower step by step, and is the largest in scope of the three forms of zhiguan, containing the most complete treatment of the concrete technical details of meditative practice.\n>\n> **Variable zhiguan** (不定止觀)—that is, the *Liu Miao Famen* (六妙法門, \"Six Wondrous Dharma-Gates,\" one fascicle), which Zhiyi expounded at Waguan Monastery in Jinling at the request of the Chief Minister Mao Xi, a work that took eight years to complete, from the first year of the Guangda era of the Chen dynasty (567) to the seventh year of the Taijian era (575); it expounds the \"six wondrous gates\" of counting, following, stopping, contemplating, returning, and purifying, which can be freely and flexibly applied at varying degrees of depth and suddenness or gradualness—like a gem of vajra flashing unpredictably in the sunlight—hence the name \"variable.\"\n>\n> **Perfect-sudden zhiguan** (圓頓止觀)—that is, the *Mohe Zhiguan* (摩訶止觀, \"Great Calming and Contemplation,\" ten fascicles, recorded by Guanding), which Zhiyi expounded at Yuquan Monastery in Jingzhou; taking the deepest and most exalted state of mind as its direct point of departure, it unfolds Zhiyi's own fully mature system of contemplative practice, representing, in direct and forthright fashion, the most profound and essential of the three forms of zhiguan in its intent—it has traditionally been regarded as one of the most important foundational treatises of the Tiantai school.\n>\n> Beyond these three, there is also a simplified introductory manual designed for beginners, the *Xiuxi Zhiguan Zuochan Fayao* (修習止觀坐禪法要, \"Essentials of Cultivating Zhiguan and Seated Meditation,\" one fascicle, also known as the *Tongmeng Zhiguan* or *Xiao Zhiguan*, \"Lesser Zhiguan\"), which systematically introduces the twenty-five preliminary expedients, the counteraction of the five hindrances to the path, the ten essential points of formal zhiguan practice, and other content, in plain and clearly organized language—it has traditionally been regarded as one of the most important introductory textbooks for zhiguan practice in all of Chinese Buddhism, and its breadth and depth of influence has, if anything, exceeded that of the far more voluminous *Mohe Zhiguan* itself. In addition, Zhiyi's disciples recorded the *Chanmen Koujue* (禪門口訣, \"Oral Instructions on the Gate of Chan\"), a text devoted to breath-regulation-based methods of seated meditation for healing illness—\"the circulation of qi in later martial arts,\" it has been observed, \"traces its origins to the gate of Chan\"—a fascinating instance of Tiantai contemplative practice spilling over into secular health-cultivation culture.\n>\n\n### 三、\"二十五方便\"与\"十乘观法\"\n\n\n天台止观修习论述以严整的次第建构见长，最具代表性者，一是《童蒙止观》所立\"二十五方便\"，涵盖具五缘、诃五欲、弃五盖、调五事（调食、调睡眠、调身、调息、调心）、行五法（欲、精进、念、巧慧、一心）五大类、共二十五项修观前之基础准备条件；二是《摩訶止观》所立\"十乘观法\"（观不思议境、发真正菩提心、善巧安心止观、破法遍、识通塞、道品调适、对治助开、知次位、能安忍、无法爱），层层递进，构成天台\"圆顿止观\"从初发心至究竟位的完整实践地图。二者与达摩、惠能一系\"不立文字、教外别传\"的简省作风形成鲜明对照，充分体现出天台止观\"教观双美\"\"解行并重\"的独特品格。\n\n\n> **EN对应 · 3. The \"Twenty-Five Expedients\" and the \"Ten Vehicles of Contemplation\"**\n>\n> Tiantai zhiguan literature is especially notable for its rigorous, step-by-step construction. Most representative are, first, the \"twenty-five expedients\" (二十五方便) set out in the *Xiao Zhiguan*—encompassing five major categories (fulfilling the five conditions; rejecting the five desires; abandoning the five hindrances; regulating the five matters of food, sleep, body, breath, and mind; and practicing the five methods of aspiration, diligence, mindfulness, skillful wisdom, and single-mindedness), totaling twenty-five items of foundational preparation prior to formal contemplative practice; and second, the \"ten vehicles of contemplation\" (十乘觀法) set out in the *Mohe Zhiguan* (contemplating the inconceivable object; arousing genuine bodhicitta; skillfully stabilizing zhiguan; refuting all dharmas comprehensively; discerning what obstructs and what does not; adjusting the aids to the path; employing counteragents to open the way; knowing one's stage; being able to endure; and being free of attachment even to the Dharma), which proceed by progressive stages to form a complete practical map of Tiantai \"perfect-sudden zhiguan\" from the initial arousal of the aspiration for enlightenment all the way to ultimate attainment. These two systems stand in sharp contrast to the economical style of the Bodhidharma–Huineng lineage, with its \"no reliance on words, a special transmission outside the teachings,\" and fully embody Tiantai zhiguan's distinctive character of \"equal excellence in doctrine and contemplation,\" of \"understanding and practice each given their full due.\"\n>\n\n### 四、域外传播：日本天台与高丽天台\n\n\n天台止观之学在唐代以降，还循两条独立于禅宗东传（如前述神秀弟子普寂门人道璇将北宗禅法传入日本）之外的管道向东亚扩散：其一，日本僧人最澄（767—822）入唐求法，于天台山从道邃、行满受天台教观，归国后创立日本天台宗，\"止观\"之名与修法直接承自中土天台，其后圆仁、圆珍等继续赴唐求法，兼弘天台止观与密教，形成后世所称\"台密\"一系（与空海所传\"东密\"相对，详见下节汉传密教东传部分）；其二，高丽王子出身的义天（1055—1101）入宋求法，归国后于高丽创立\"天台宗\"（韩国天台宗、高丽天台宗），同样直接继承中土天台教观体系。二者均是\"止观\"一系独立于禅宗谱系、在东亚范围内自主传播、生根本土化的实例，进一步说明\"止观\"作为一套完整的禅观体系，其历史生命力与影响半径，丝毫不逊于后来居上的南宗禅本身。\n\n\n\n> **EN对应 · 4. Transmission Beyond China's Borders: Japanese Tendai and Korean Cheontae**\n>\n> From the Tang dynasty onward, Tiantai zhiguan teaching spread across East Asia through two channels entirely independent of the eastward transmission of the Chan school itself (such as the transmission of Northern School Chan to Japan through Puji's disciple Dōsen, discussed above). First: the Japanese monk Saichō (最澄, 767–822) traveled to Tang China to seek the Dharma, receiving Tiantai contemplative teaching from Daosui and Xingman on Mount Tiantai; upon returning home he founded the Japanese Tendai school, whose very name and method of practice—\"zhiguan,\" rendered in Japanese as *shikan*—derive directly from Tiantai China. His successors Ennin and Enchin subsequently likewise traveled to Tang China to seek the Dharma, propagating both Tiantai zhiguan and Esoteric Buddhist teachings together, giving rise to what later became known as the \"Taimitsu\" (台密, \"Tendai Esotericism\") lineage (as distinct from the \"Tōmitsu,\" 東密, \"Esotericism transmitted through Kūkai,\" discussed in the following section on Chinese Esoteric Buddhism's eastward transmission). Second: Uicheon (義天, 1055–1101), a Korean prince by birth, traveled to Song China to seek the Dharma, and upon returning home founded the \"Cheontae\" school (天台宗, the Korean-Goryeo equivalent of Tiantai) in Korea, likewise directly inheriting the Tiantai contemplation-and-doctrine system of China. Both cases exemplify \"zhiguan\" spreading and taking root independently across East Asia, quite apart from the Chan lineage—further demonstrating that as a complete system of contemplative practice, \"zhiguan\" possesses a historical vitality and sphere of influence in no way inferior to that of the Southern School, which would later come to overshadow it.\n>\n> ---\n>\n\n## 第八部分　净土禅观：从般舟三昧到十六观\n\n\n净土法门在后世汉传佛教的一般印象中，往往与持名念佛、乃至与\"禅净双修\"\"禅是禅、净是净\"式的二元对立论述联系在一起，但若追溯至其源头，净土一系最初的核心修法本质上正是一种高度技术化的\"禅\"——一种以观想为核心手段、以三昧（samādhi）体验为直接目标的禅观法门，与前述止观、四念处等体系一样，理应被视为南宗禅以外的独立禅法传统之一。\n\n\n> **EN对应 · Part Eight: Pure Land Meditation—From the Pratyutpanna Samādhi to the Sixteen Contemplations**\n>\n> In the common impression of later Chinese Buddhism, the Pure Land tradition is often associated with vocal-recitation buddha-name practice, and even framed within a binary opposition of \"Chan practice and Pure Land practice\" as though they were separate categories entirely—\"Chan is Chan, Pure Land is Pure Land.\" Yet tracing the tradition back to its source, the original core practice of the Pure Land school was in essence a highly technical form of \"Chan\"—a contemplative method taking visualization as its central technique and samādhi-attainment as its direct goal, and one that, like the zhiguan and four-foundations-of-mindfulness systems discussed above, ought properly to be regarded as one of the independent meditation traditions existing beyond the Southern School.\n>\n\n### 一、《般舟三昧经》与慧远的念佛三昧实践\n\n\n《般舟三昧经》（又译\"佛立三昧经\"）是净土念佛法门最早的经典依据之一，东汉支娄迦谶已有译本传世，其所述\"般舟三昧\"修法极为严格：以七日乃至九十日为一期，日夜经行，不得坐卧，口中不断称念阿弥陀佛名号、心中不断系念阿弥陀佛三十二相八十种好，以此感通十方诸佛、尤其阿弥陀佛于定中现前。此经的独特之处在于，它并未止步于\"见佛\"这一神秘经验本身，而是进一步要求修行者反观自心，体悟所见诸佛\"皆自心作用幻化\"、\"本性空寂\"，从而将念佛三昧最终导向般若空性的证悟——这使得《般舟三昧经》所传法门与后世持名念佛渐次独立于禅观、义理之外的历史走向颇为不同，而与般若中观思想有着更为紧密的内在关联。\n\n如前节所述，庐山慧远正是\"中国历史上第一位系统弘扬这一法门的人物\"，其修行\"以禅智为宗\"，观想念佛而非持名念佛，充分说明净土念佛在其草创阶段本即是禅观修习的一个分支，而非与禅观相对立的另一独立\"宗派\"。历史上不乏行者依《般舟三昧经》所述极端严格的立行方式实修，如台湾灵岩山寺妙莲长老据传曾多次圆满完成为期九十日的般舟三昧行法，日本京都永观堂第七代住持永观律师亦有相关著名感应传说流传〔待核——上述妙莲、永观之实修与感应事迹系依寺院口述及历代记载流传，实为传统信史而非现代学术考订所得，转述时存其原貌、不作实证断言〕，可见此一古老法门虽修持难度极高、历代实修者相对稀少，却始终未曾断绝。\n\n\n> **EN对应 · 1. The *Pratyutpanna Samādhi Sūtra* and Huiyuan's Practice of Buddha-Recollection Samādhi**\n>\n> The *Pratyutpanna Samādhi Sūtra* (般舟三昧經, also translated as the \"Sūtra of the Buddha's Standing Presence\") is one of the earliest scriptural bases for the buddha-recollection tradition, already translated in the Eastern Han by Lokakṣema (支婁迦讖). Its \"pratyutpanna samādhi\" method is extremely rigorous: over a period ranging from seven to ninety days, the practitioner walks continuously day and night without sitting or lying down, ceaselessly reciting Amitābha Buddha's name aloud while continuously visualizing the thirty-two major and eighty minor marks of Amitābha's form in the mind, thereby drawing the buddhas of the ten directions—Amitābha above all—to manifest in samādhi. What is distinctive about this scripture is that it does not stop at the mystical experience of \"seeing the Buddha\" as an end in itself, but goes further, requiring the practitioner to turn contemplation back upon their own mind and realize that the buddhas thus seen \"are all produced by the mind's own workings, illusory transformations,\" their \"nature originally empty and quiescent\"—thereby ultimately directing buddha-recollection samādhi toward the realization of Prajñāpāramitā emptiness. This makes the practice transmitted in the *Pratyutpanna Samādhi Sūtra* markedly different from the later historical trajectory in which vocal-recitation buddha-name practice gradually became independent of contemplative practice and doctrinal understanding, and shows it to bear a far closer inner connection to Prajñāpāramitā-Madhyamaka thought.\n>\n> As discussed above, Huiyuan of Mount Lu was indeed \"the first figure in Chinese history to systematically propagate this Dharma-gate,\" and his practice \"took meditative wisdom as its foundation\"—visualization buddha-recollection rather than vocal-recitation buddha-recollection—amply demonstrating that, in its formative stage, Pure Land buddha-recollection was in fact a branch of contemplative practice, not a separate \"school\" standing in opposition to it. History records no shortage of practitioners who have undertaken the extraordinarily demanding standing-practice method described in the *Pratyutpanna Samādhi Sūtra*: Elder Miaolian of Lingyan Mountain Monastery in Taiwan is said to have completed the full ninety-day pratyutpanna-samādhi practice on multiple occasions, and a well-known legend of a spiritual response is also associated with Eikan, seventh abbot of Eikandō in Kyoto, Japan—showing that although this ancient Dharma-gate is extraordinarily difficult to undertake and has been practiced by relatively few over the centuries, it has never once been entirely broken off. [Pending verification (待核): the above accounts of Miaolian's and Eikan's practice and spiritual responses rest on temple oral tradition and inherited records rather than modern academic verification; they are reported here in their received form without claim of empirical proof.]\n>\n\n### 二、《观无量寿经》\"十六观\"\n\n\n与《般舟三昧经》相辅相成、对后世净土观想影响更为深远者，是南朝宋畺良耶舍所译《佛说观无量寿佛经》（《观经》）。此经以\"观\"字标目其修行法门，系统教授十六种依次第递进的观想方法（合称\"十六观\"），由日观、水观、地观等基础观想起修，进而观想极乐世界宝树、宝池、宝楼阁等庄严依报，再观想阿弥陀佛及观世音、大势至二菩萨之正报庄严相好，最终以上中下三辈九品往生观作结（即前述小南海石窟中窟西壁所刻\"九品往生\"阿弥陀净土变相题材的经典依据）。经中\"心眼\"一词，明确指出这种观想能力\"依禅定之力可透见障外之色，照了诸法\"，即并非依肉眼或天眼，而是依禅定功力而成就的一种特殊观照能力，其禅观属性不言而喻。\n\n\n> **EN对应 · 2. The \"Sixteen Contemplations\" of the *Contemplation of Amitāyus Sūtra***\n>\n> Complementary to, and even more influential than, the *Pratyutpanna Samādhi Sūtra* in shaping later Pure Land visualization practice is the *Sūtra on the Contemplation of Amitāyus Buddha* (佛說觀無量壽佛經, the \"Contemplation Sūtra\"), translated by Kālayaśas of the Liu Song. Marked in its very title by the character \"contemplation\" (觀), this scripture systematically teaches sixteen progressively sequenced methods of visualization (the \"sixteen contemplations,\" 十六觀), beginning with foundational visualizations of the sun, water, and ground, then proceeding to visualize the adorned dependent-world features of the Pure Land—jeweled trees, jeweled ponds, jeweled towers and pavilions—and further to visualize the adorned major and minor marks of Amitābha Buddha and the bodhisattvas Avalokiteśvara and Mahāsthāmaprāpta, concluding with the contemplation of the nine grades of rebirth across the three ranks of upper, middle, and lower (this being precisely the scriptural basis for the \"nine-grades-of-rebirth\" Amitābha Pure Land transformation tableau carved on the west wall of the Central Cave at Xiaonanhai, discussed above). The scripture's use of the term \"mind's eye\" (心眼) makes explicit that this capacity for visualization \"is able, through the power of meditative concentration, to see through to forms beyond ordinary obstruction, illuminating all dharmas\"—that is, it is achieved not through the physical eye or the divine eye, but through a special capacity for contemplative vision accomplished by the power of meditative concentration; its character as a form of contemplative practice is beyond dispute.\n>\n\n### 三、从昙鸾到善导：净土观法的系统化与转型\n\n\n在慧远之后、善导（613—681）之前，北魏昙鸾（476—542，一说554年后）是净土思想演变史上的关键过渡人物：他早年博览群书，深研般若中观与佛性之学，后因病南行拜访道教学者陶弘景求取长生方术，得授仙经，归途中于洛阳偶遇菩提流支，获授《观无量寿经》，据传因此转而专修净土，其《往生论注》对后世净土思想影响深远，是道绰、善导一系净土思想的重要先驱。\n\n至唐代善导，作《观经四帖疏》（《观无量寿经疏》），对《观经》作出系统注解，净土念佛法门至此逐渐从早期以观想三昧为核心的禅观体系，向以持名念佛为主、辅以观想的方向发展和简化，最终在宋元以降的汉传佛教中，与南宗禅一道并列为最具社会影响力的两大修行传统。然而正如本节所示，若追溯至其源头，净土一系的\"三昧\"底色与\"以禅智为宗\"的原初品格，恰恰说明它在方法论意义上与诸支达摩系禅法一样，皆属\"禅\"之大家族中各自独立发展出来的一支，而非后世通俗认知中与\"禅\"相对立的另一范畴。\n\n\n\n> **EN对应 · 3. From Tanluan to Shandao: The Systematization and Transformation of Pure Land Contemplative Method**\n>\n> Between Huiyuan and Shandao (善導, 613–681), Tanluan (曇鸞, 476–542, some accounts giving a date after 554) of the Northern Wei stands as a crucial transitional figure in the evolution of Pure Land thought. In his youth he read widely and delved deeply into Prajñāpāramitā-Madhyamaka thought and Buddha-nature theory; falling ill while writing a commentary on the *Mahāsaṃnipāta Sūtra*, whose profound meaning he found difficult to grasp, he traveled south in search of the Daoist scholar Tao Hongjing to seek methods of longevity, receiving ten fascicles of Daoist scriptures on immortality-practice. On his return journey he chanced to meet Bodhiruci at Luoyang, who bestowed upon him the *Contemplation of Amitāyus Sūtra*; tradition holds that Tanluan thereupon turned to dedicated Pure Land practice. His *Wangsheng Lun Zhu* (往生論注, \"Commentary on the Treatise on Rebirth [in the Pure Land]\") exerted a profound influence on later Pure Land thought, and stands as an important precursor to the systematized Pure Land thought later developed by Daochuo and Shandao.\n>\n> In the Tang dynasty, Shandao composed the *Guan Jing Si Tie Shu* (觀經四帖疏, \"Commentary on the Contemplation Sūtra in Four Fascicles\"), providing a systematic exegesis of the *Contemplation Sūtra*. From this point, Pure Land buddha-recollection practice gradually developed and simplified—moving from an early contemplative system centered on visualization samādhi toward one centered primarily on vocal-recitation buddha-name practice, supplemented by visualization—and eventually, from the Song-Yuan period onward, stood alongside the Southern School of Chan as one of the two most socially influential traditions of practice in Chinese Buddhism. Yet as this section has shown, tracing the Pure Land tradition back to its source reveals that its underlying \"samādhi\" character, and its original orientation of \"taking meditative wisdom as its foundation,\" demonstrate precisely that, methodologically speaking, it belongs—just as the various branches of the Bodhidharma lineage do—to the broader family of \"Chan\" as one of its independently developed members, rather than to some separate category conventionally understood as standing opposed to \"Chan.\"\n>\n> ---\n>\n\n## 第九部分　唯识观法：瑜伽行派与\"五重唯识观\"\n\n\n\"瑜伽行派\"（Yogācāra）之得名，本身即直接源自梵语\"瑜伽\"（yoga，意为相应、禅定修习）一词，这一命名本身即已表明，唯识学说从其印度渊源开始，便与禅观修习具有本质性的内在关联——其根本论典《瑜伽师地论》（相传为弥勒菩萨所说、无著记录，唐玄奘全译一百卷），书中专卷论述\"止观\"修行次第（卷二六至三四），足见\"止观\"实践本是瑜伽行唯识学理论体系不可分割的组成部分，而非仅仅是一套纯粹思辨的心识分析理论。\n\n传入中国后，瑜伽行唯识学历经地论师（真心派，与如来藏思想合流）、摄论师（真谛所传，妄心派向真心派之过渡）、及玄奘、窥基师徒所建立的法相唯识宗（严格意义上的妄心派）三个阶段的发展与分化，其中真正将唯识义理系统转化为一套具体可操作的观行法门者，是玄奘门下窥基大师（632—682）。窥基在其代表作《大乘法苑义林章·唯识章》中，依《摄大乘论·入所知相分》\"于遍计所执、依他起、圆成实三性次第悟入\"的义理纲格，采撷《解深密经》《瑜伽师地论》《成唯识论》等经论义蕴，组织成\"五重唯识观\"，作为唯识宗特有的修证法门：\n\n一、**遣虚存实识**（空有相对）：遣除虚妄的遍计所执性，保留真实的依他起、圆成实二性；\n二、**舍滥留纯识**（能所相对）：一切法皆不离识，识分心境，舍去心内相分之境，只留能缘之八识五十一心所；\n三、**摄末归本识**（体用相对）：心、心所各具自证分（体）与相、见二分（用），摄相见之用，归自证之体；\n四、**隐劣显胜识**（王所相对）：心王为胜、心所为劣，摄劣归胜；\n五、**遣相证性识**（事理相对）：遣除依他起之事相，唯就圆成实之理体求证唯识真理，根本智先证真如，后得智了知依他，我法二执自然止息。\n\n前四重就依他起的识相层层观察唯识之理，第五重则就圆成实的识性直接观照唯识妙理，从粗到细、由浅入深，最终臻于\"理智冥合\"之境。这一观法虽篇幅精简，却是唐代法相唯识宗留给后世最重要的具体修证方法论遗产，与同时代兴起的天台止观、以及本文第三至六部分所述达摩系诸支禅法各自独立、互不相涉，共同构成了隋唐佛教\"教观并重\"格局下多元并存的禅观图景之一支。\n\n\n\n> **EN对应 · Part Nine: Yogācāra Contemplation—The Yogācāra School and the \"Five-Fold Vijñaptimātratā Contemplation\"**\n>\n> The very name of the \"Yogācāra school\" (瑜伽行派, Yogācāra, literally \"practitioners of yoga\") derives directly from the Sanskrit *yoga* (\"union,\" \"meditative discipline\")—a naming that itself demonstrates that, from its Indian origins, Vijñaptimātratā (\"consciousness-only,\" Weishi 唯識) doctrine bore an essential, inherent connection to contemplative practice. Its foundational treatise, the *Yogācārabhūmi-śāstra* (瑜伽師地論, traditionally attributed to Maitreya as expounded and Asaṅga as recorder; fully translated into Chinese by Xuanzang in one hundred fascicles), devotes an entire dedicated section (fascicles 26–34) to expounding the stages of zhiguan practice—clear evidence that zhiguan practice is an inseparable component of Yogācāra Vijñaptimātratā theory as a whole, rather than merely a purely speculative system of consciousness-analysis.\n>\n> After its transmission to China, Yogācāra Vijñaptimātratā thought passed through three stages of development and differentiation: the Dilun masters (地論師, the \"true-mind\" branch, which merged with tathāgatagarbha thought), the Shelun masters (攝論師, transmitted by Paramārtha, representing a transitional position between the \"false-mind\" and \"true-mind\" branches), and finally the Faxiang Vijñaptimātratā school (法相唯識宗, the \"false-mind\" branch in the strict sense) established by Xuanzang and his disciple Kuiji. Of these, the figure who truly transformed Vijñaptimātratā doctrine into a concrete, practicable system of contemplative method was Kuiji (窺基, 632–682), a disciple of Xuanzang. In his representative work, the \"Chapter on Vijñaptimātratā\" within the *Dasheng Fayuan Yilin Zhang* (大乘法苑義林章), Kuiji drew on the doctrinal framework of \"progressively entering, in sequence, the imagined, dependent, and perfected natures\" (遍計所執、依他起、圓成實三性次第悟入) found in the *Mahāyānasaṃgraha*'s \"Chapter on Entering the Characteristics of the Knowable,\" gathering material from the *Saṃdhinirmocana Sūtra*, the *Yogācārabhūmi-śāstra*, the *Vijñaptimātratāsiddhi-śāstra*, and other scriptures and treatises, to organize the \"five-fold vijñaptimātratā contemplation\" (五重唯識觀)—a method of practice and realization distinctive to the Vijñaptimātratā school:\n>\n> 1. **Setting aside the false, preserving the real** (遣虛存實識, contrasting emptiness and existence): setting aside the illusory imagined nature, preserving the real dependent and perfected natures;\n> 2. **Discarding the extraneous, retaining the pure** (捨濫留純識, contrasting subject and object): since no dharma exists apart from consciousness, and consciousness divides into mind and its objects, one discards the objective aspect internal to the mind, retaining only the eight consciousnesses and fifty-one mental factors that constitute the subjective, cognizing aspect;\n> 3. **Gathering the branches back to the root** (攝末歸本識, contrasting essence and function): mind and mental factors each possess a self-verifying aspect (essence) as well as an objective and a subjective aspect (function); one gathers the function of the objective and subjective aspects back into the essence of self-verification;\n> 4. **Concealing the inferior, revealing the superior** (隱劣顯勝識, contrasting ruler and retinue): the mind-king is superior, the mental factors inferior; one gathers the inferior back into the superior;\n> 5. **Setting aside phenomena, realizing the nature** (遣相證性識, contrasting phenomena and principle): one sets aside the phenomenal aspect of the dependent nature, seeking realization solely in terms of the noumenal principle of the perfected nature—the fundamental wisdom first realizes suchness, and the subsequently attained wisdom then comprehends the dependent nature, whereupon the two forms of attachment, to self and to dharmas, naturally cease.\n>\n> The first four stages observe the principle of vijñaptimātratā progressively, layer by layer, in terms of the characteristics of the dependent nature; the fifth stage contemplates the wondrous principle of vijñaptimātratā directly, in terms of the nature of the perfected reality—proceeding from coarse to subtle, from shallow to deep, ultimately arriving at the state of \"the fusion of principle and wisdom.\" Though economical in its formulation, this method of contemplation stands as the most important concrete legacy of practical soteriology bequeathed to later generations by the Tang-dynasty Faxiang Vijñaptimātratā school—developing independently of, and without any point of contact with, the Tiantai zhiguan system that arose in the same era, or the various branches of Bodhidharma-lineage meditation discussed in Parts Three through Six of this study—together constituting one strand within the pluralistic, coexisting landscape of contemplative traditions under the Sui-Tang Buddhist paradigm of \"according equal weight to doctrine and contemplation.\"\n>\n>\n\n> **EN对应 · Part Nine: Yogācāra Contemplation—The Yogācāra School and the \"Five-Fold Vijñaptimātratā Contemplation\"**\n>\n> The very name of the \"Yogācāra school\" (瑜伽行派, Yogācāra, literally \"practitioners of yoga\") derives directly from the Sanskrit *yoga* (\"union,\" \"meditative discipline\")—a naming that itself demonstrates that, from its Indian origins, Vijñaptimātratā (\"consciousness-only,\" Weishi 唯識) doctrine bore an essential, inherent connection to contemplative practice. Its foundational treatise, the *Yogācārabhūmi-śāstra* (瑜伽師地論, traditionally attributed to Maitreya as expounded and Asaṅga as recorder; fully translated into Chinese by Xuanzang in one hundred fascicles), devotes an entire dedicated section (fascicles 26–34) to expounding the stages of zhiguan practice—clear evidence that zhiguan practice is an inseparable component of Yogācāra Vijñaptimātratā theory as a whole, rather than merely a purely speculative system of consciousness-analysis.\n>\n> After its transmission to China, Yogācāra Vijñaptimātratā thought passed through three stages of development and differentiation: the Dilun masters (地論師, the \"true-mind\" branch, which merged with tathāgatagarbha thought), the Shelun masters (攝論師, transmitted by Paramārtha, representing a transitional position between the \"false-mind\" and \"true-mind\" branches), and finally the Faxiang Vijñaptimātratā school (法相唯識宗, the \"false-mind\" branch in the strict sense) established by Xuanzang and his disciple Kuiji. Of these, the figure who truly transformed Vijñaptimātratā doctrine into a concrete, practicable system of contemplative method was Kuiji (窺基, 632–682), a disciple of Xuanzang. In his representative work, the \"Chapter on Vijñaptimātratā\" within the *Dasheng Fayuan Yilin Zhang* (大乘法苑義林章), Kuiji drew on the doctrinal framework of \"progressively entering, in sequence, the imagined, dependent, and perfected natures\" (遍計所執、依他起、圓成實三性次第悟入) found in the *Mahāyānasaṃgraha*'s \"Chapter on Entering the Characteristics of the Knowable,\" gathering material from the *Saṃdhinirmocana Sūtra*, the *Yogācārabhūmi-śāstra*, the *Vijñaptimātratāsiddhi-śāstra*, and other scriptures and treatises, to organize the \"five-fold vijñaptimātratā contemplation\" (五重唯識觀)—a method of practice and realization distinctive to the Vijñaptimātratā school:\n>\n> 1. **Setting aside the false, preserving the real** (遣虛存實識, contrasting emptiness and existence): setting aside the illusory imagined nature, preserving the real dependent and perfected natures;\n> 2. **Discarding the extraneous, retaining the pure** (捨濫留純識, contrasting subject and object): since no dharma exists apart from consciousness, and consciousness divides into mind and its objects, one discards the objective aspect internal to the mind, retaining only the eight consciousnesses and fifty-one mental factors that constitute the subjective, cognizing aspect;\n> 3. **Gathering the branches back to the root** (攝末歸本識, contrasting essence and function): mind and mental factors each possess a self-verifying aspect (essence) as well as an objective and a subjective aspect (function); one gathers the function of the objective and subjective aspects back into the essence of self-verification;\n> 4. **Concealing the inferior, revealing the superior** (隱劣顯勝識, contrasting ruler and retinue): the mind-king is superior, the mental factors inferior; one gathers the inferior back into the superior;\n> 5. **Setting aside phenomena, realizing the nature** (遣相證性識, contrasting phenomena and principle): one sets aside the phenomenal aspect of the dependent nature, seeking realization solely in terms of the noumenal principle of the perfected nature—the fundamental wisdom first realizes suchness, and the subsequently attained wisdom then comprehends the dependent nature, whereupon the two forms of attachment, to self and to dharmas, naturally cease.\n>\n> The first four stages observe the principle of vijñaptimātratā progressively, layer by layer, in terms of the characteristics of the dependent nature; the fifth stage contemplates the wondrous principle of vijñaptimātratā directly, in terms of the nature of the perfected reality—proceeding from coarse to subtle, from shallow to deep, ultimately arriving at the state of \"the fusion of principle and wisdom.\" Though economical in its formulation, this method of contemplation stands as the most important concrete legacy of practical soteriology bequeathed to later generations by the Tang-dynasty Faxiang Vijñaptimātratā school—developing independently of, and without any point of contact with, the Tiantai zhiguan system that arose in the same era, or the various branches of Bodhidharma-lineage meditation discussed in Parts Three through Six of this study—together constituting one strand within the pluralistic, coexisting landscape of contemplative traditions under the Sui-Tang Buddhist paradigm of \"according equal weight to doctrine and contemplation.\"\n>\n> ---\n>\n\n## 第十部分　华严法界观：另一支独立于禅宗谱系之外的圆教观法\n\n\n与天台止观、唯识五重观一样，华严宗同样发展出一套完全独立于达摩系禅法谱系之外、却在中国佛教思想史上具有崇高地位的观行体系——\"法界观\"，其创始人杜顺更是罕见地被后世尊为\"文殊菩萨化身\"、以实修实证直接立宗的奠基者，而非以经院思辨见长。\n\n\n> **EN对应 · Part Ten: The Huayan Dharmadhātu Contemplation—Another Perfect-Teaching System of Contemplative Practice Independent of the Chan Lineage**\n>\n> Like Tiantai zhiguan and the five-fold vijñaptimātratā contemplation, the Huayan (華嚴) school likewise developed a system of contemplative practice entirely independent of the Bodhidharma-lineage genealogy of meditation—one that nonetheless occupies an exalted place in the history of Chinese Buddhist thought: the \"Dharmadhātu contemplation\" (法界觀). Its founder, Dushun, is unusual even among the founders of Chinese Buddhist schools for having been revered by later generations as an incarnation of Mañjuśrī Bodhisattva—a founding figure distinguished by direct practical realization rather than by scholastic argumentation.\n>\n\n### 一、杜顺与《法界观门》：法界三观\n\n\n华严宗初祖杜顺（557—640，俗姓杜，法名法顺，敕号\"帝心\"），十八岁于因圣寺出家，\"专修禅观\"，相传能\"治聋哑、驱虫蚁、与牛马对话\"等异迹，隋文帝对其甚为敬重，时人称为\"敦煌菩萨\"。杜顺著有两部奠定华严宗根本观行理论的重要文献——《五教止观》与《法界观门》，后世华严学人\"是否绍继华严灯火，即是以能否依循此二部经论的标准而定\"，足见其地位之重。\n\n《法界观门》所立\"法界三观\"为：**真空观**（又称\"真空绝相观\"），依理法界而立，观照一切诸法自性本空，遣除对\"空\"与\"有\"两边的执著；**理事无碍观**，观照\"理\"（真如空性）与\"事\"（现象事相）二者圆融无碍、相即相入；**周遍含容观**，则更进一步观照一切\"事\"与\"事\"之间亦复相即相入、重重无尽——此即华严宗最具标志性的\"事事无碍\"境界，为杜顺三观中最为深奥圆满者。\n\n《五教止观》则依\"小乘教、大乘始教、大乘终教、大乘顿教、一乘圆教\"华严宗特有的判教五阶，分别配以五种止观修法（法有我无门、生即无生门、事理圆融门、语观双绝门、华严三昧门），以次第由浅入深的方式，最终导归华严圆教\"事事无碍\"的根本观境——这与天台智顗\"三种止观\"依修证次第分类的构思方式颇有异曲同工之妙，却是完全独立、分属华严一宗的教理体系。\n\n\n> **EN对应 · 1. Dushun and the *Fajie Guan Men*: The Three Dharmadhātu Contemplations**\n>\n> Dushun (杜順, 557–640, First Patriarch of the Huayan school; lay surname Du, dharma-name Fashun, granted the honorific title \"Dixin,\" \"Imperial Heart\"), left home at Yinsheng Monastery at age eighteen, \"devoting himself entirely to meditative contemplation.\" Tradition credits him with numerous miraculous deeds—\"curing deafness and muteness, driving away insects, conversing with cattle and horses\"—and Emperor Wen of Sui held him in great esteem; his contemporaries called him the \"Bodhisattva of Dunhuang.\" Dushun authored two works that laid the foundation for Huayan contemplative theory: the *Wujiao Zhiguan* (五教止觀, \"Zhiguan of the Five Teachings\") and the *Fajie Guan Men* (法界觀門, \"Gate of Dharmadhātu Contemplation\")—later Huayan students have traditionally judged \"whether one truly carries forward the lamp of the Huayan tradition\" precisely by whether one has thoroughly assimilated these two texts, testament to their weighty standing.\n>\n> The \"three Dharmadhātu contemplations\" (法界三觀) set out in the *Fajie Guan Men* are: the **contemplation of true emptiness** (真空觀, also called the \"contemplation of true emptiness, transcending characteristics\"), grounded in the Dharmadhātu of principle, contemplating that the intrinsic nature of all dharmas is empty, thereby dispelling attachment to both the extremes of \"emptiness\" and \"existence\"; the **contemplation of the unimpeded interpenetration of principle and phenomena** (理事無礙觀), contemplating that \"principle\" (true suchness, emptiness) and \"phenomena\" (the manifest world of appearances) are mutually identical and mutually interpenetrating, without obstruction; and the **contemplation of the unimpeded interpenetration and mutual inclusion of all phenomena** (周遍含容觀), which goes further still, contemplating that \"phenomena\" and \"phenomena\" are likewise mutually identical and mutually interpenetrating, layer upon layer without end—this is precisely the hallmark Huayan state of \"the unimpeded interpenetration of phenomenon and phenomenon\" (事事無礙), the most profound and consummate of Dushun's three contemplations.\n>\n> The *Wujiao Zhiguan*, in turn, follows the Huayan school's distinctive five-stage doctrinal classification—the teachings of the Hīnayāna, the initial Mahāyāna, the final Mahāyāna, the sudden Mahāyāna, and the perfect One Vehicle—assigning to each a corresponding method of zhiguan practice (the gate of dharmas existing but no self; the gate of arising that is itself non-arising; the gate of the perfect fusion of phenomena and principle; the gate of the simultaneous transcendence of speech and contemplation; and the gate of the Huayan samādhi), proceeding step by step from shallow to deep in a manner that ultimately returns to the fundamental contemplative state of \"the unimpeded interpenetration of phenomenon and phenomenon\" central to the Huayan perfect teaching—a conceptual design bearing no small resemblance to Zhiyi's classification of the \"three forms of zhiguan\" according to stages of practice and realization, discussed above, and yet entirely independent, belonging solely to the Huayan school's own doctrinal system.\n>\n\n### 二、智俨十玄门与法藏、澄观的理论完备化\n\n\n二祖智俨依杜顺三观进一步开展出\"十玄门\"（同时具足相应门、广狭自在无碍门、一多相容不同门等十项，具体呈现\"事事无碍法界\"内部的十种面向），三祖法藏（华严宗教理实际的集大成者）在三观基础上正式提出\"四法界\"之名：事法界、理法界、理事无碍法界、事事无碍法界，将杜顺的\"三观\"进一步理论化为完整的存有论架构。四祖澄观撰《华严法界玄镜》，为杜顺《法界观门》作注，最终将\"四法界\"体系加以系统完备化定型，成为华严宗观行理论沿用至今的标准表述；后述牛头宗研究中屡次征引的宗密（五祖），同样在此一脉络下，试图以\"四法界\"义理会通禅教、调和荷泽宗与华严教理。\n\n华严法界观与天台止观、唯识五重观三者，共同构成隋唐\"教下\"三大宗派（天台、华严、法相唯识）各自独立发展出的观行体系，三者义理立场虽同源于印度大乘经论，具体教理归趣却判然有别——华严依《华严经》\"法界缘起\"、唯识依《解深密经》《瑜伽师地论》\"万法唯识\"、天台依《法华经》《大智度论》\"诸法实相\"——然而在方法论层面，三者都体现出与达摩系\"不立文字、直指人心\"顿悟禅法截然不同的\"藉教观心\"路径：始终不脱离经教义理的系统建构，通过层层递进的观行次第引导修行者契入各自宗派所理解的终极实相，这也正是本文所考察的\"六祖以外禅法\"版图中极具分量的一个共同特征。\n\n\n\n> **EN对应 · 2. Zhiyan's Ten Mysterious Gates, and the Theoretical Systematization Achieved by Fazang and Chengguan**\n>\n> The Second Patriarch, Zhiyan (智儼), building on Dushun's three contemplations, further developed the \"ten mysterious gates\" (十玄門—including, among its ten items, the gate of simultaneous correspondence and completeness, and the gate of the unimpeded mutual freedom of the broad and the narrow, and the gate of the mutual containment of the one and the many without difference), setting out in concrete terms the ten distinct facets internally displayed within \"the Dharmadhātu of the unimpeded interpenetration of phenomenon and phenomenon.\" The Third Patriarch, Fazang (法藏, the figure who in effect brought Huayan doctrine to its full systematic culmination), building further on the three contemplations, formally introduced the term \"the four Dharmadhātus\" (四法界): the Dharmadhātu of phenomena, the Dharmadhātu of principle, the Dharmadhātu of the unimpeded interpenetration of principle and phenomena, and the Dharmadhātu of the unimpeded interpenetration of phenomenon and phenomenon—theorizing Dushun's \"three contemplations\" into a complete ontological framework. The Fourth Patriarch, Chengguan (澄觀), composed the *Huayan Fajie Xuanjing* (華嚴法界玄鏡, \"Mysterious Mirror of the Huayan Dharmadhātu\"), a commentary on Dushun's *Fajie Guan Men*, ultimately systematizing and fixing the \"four Dharmadhātus\" framework into the standard formulation of Huayan contemplative theory still followed today; Guifeng Zongmi (the Fifth Patriarch, repeatedly cited in this study's discussion of the Oxhead School above) worked within this same framework as well, attempting to use the theory of \"the four Dharmadhātus\" to reconcile Chan and doctrinal teaching, harmonizing the Heze lineage with Huayan doctrine.\n>\n> The Huayan Dharmadhātu contemplation, together with Tiantai zhiguan and the five-fold vijñaptimātratā contemplation, together constitute the three independently developed contemplative systems of the three great \"doctrinal\" schools of the Sui-Tang period—Tiantai, Huayan, and Faxiang Vijñaptimātratā. Although all three share a common origin in Indian Mahāyāna scripture and treatise literature, their specific doctrinal orientations differ markedly: Huayan grounds itself in the *Avataṃsaka Sūtra*'s \"dependent origination of the Dharmadhātu\"; Vijñaptimātratā grounds itself in the *Saṃdhinirmocana Sūtra* and the *Yogācārabhūmi-śāstra*'s \"the ten thousand dharmas are consciousness alone\"; and Tiantai grounds itself in the *Lotus Sūtra* and the *Mahāprajñāpāramitā-śāstra*'s \"the true reality of all dharmas.\" Yet at the methodological level, all three display a path of \"contemplating the mind by means of the teachings\" markedly different from the Bodhidharma lineage's sudden-awakening approach of \"no reliance on words, directly pointing to the mind\": each remains grounded, at every stage, in the systematic construction of scriptural doctrine, guiding the practitioner through progressively deepening stages of contemplation to enter into the ultimate reality as each school's own doctrine understands it—and this, too, is a shared feature of considerable weight within the map of \"traditions beyond Huineng's Southern School\" that this study surveys.\n>\n> ---\n>\n\n## 第十一部分　密教禅观（一）：汉传密宗的三密相应\n\n\n密教（金刚乘、真言乘）禅观是南宗禅以外分量最重、体系最庞杂精微的一支，其汉传与藏传两大支系虽同源于印度晚期大乘—金刚乘佛教，历史上各自独立发展，本文分作两部分处理，先述汉传（唐密）系统。\n\n公元8世纪唐玄宗开元年间（716—720），印度密教高僧善无畏、金刚智、不空相继抵华，史称\"开元三大士\"，在大唐皇室扶持下于长安大兴善寺等地系统译出大批密教经典、弘传密法，标志着以金刚界、胎藏界两部纯密为核心内容的\"唐密\"正式确立（此前虽已有零星\"杂密\"传入，但尚未形成系统教理与仪轨）。善无畏于洛阳大福先寺、在一行协助下译出《大日经》，为胎藏界密法传入中国之始；金刚智其后译出《金刚顶瑜伽中略出念诵法》等，传入金刚界密法；其弟子不空曾奉命赴狮子国（今斯里兰卡）从普贤阿阇黎受两部密法灌顶，归国后译出《金刚顶经》等十一部一百四十三卷，唐密至此蔚为大观，祖庭大兴善寺、青龙寺盛极一时。\n\n唐密教理以\"即身成佛\"为核心目标，修行者通过手结印契（身密）、口诵真言／陀罗尼（语密）、心观本尊（意密）\"三密\"之修习，与本尊佛、菩萨之身、口、意\"三密\"相应（\"三密相应\"\"三密加持\"），转凡身为佛身，即身
