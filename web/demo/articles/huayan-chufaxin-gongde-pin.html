<script>
var ARTICLE = {"id": "huayan-chufaxin-gongde-pin", "file": "articles/huayan-chufaxin-gongde-pin.html", "title": "九九华严第十七品 初发心功德品之拼读", "title_sub": "华严经第十七品·第三会十住位胜进德·跨卷十七–十八·第三会最长品·品界CJK8207（长行4785＋重颂3388·27单元）·天帝释问·法慧先叹十难·再以十一大喻层层校量（利樂眾生→供佛及生·後後過於前前）·就法略示十二句配如来十力·动地兴供·他方证成（万佛同名法慧·皆号清淨心如來）·一百二十一颂重颂·歌羅分（竖析·百分之一）／優波尼沙陀（近少）校量数释义·澄观疏窗10187（四门·释文七分）·法藏8432·慧苑10145·通玄5164·合论14624·智俨〔缺口〕·六十〈初发心菩萨功德品第十三〉在卷九〔未入库·待核〕·六要素齐备·数据层实测", "icon": "📖", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第三会_忉利天宫_差别因果周/华严经细读_第十七部_初发心功德品.md", "doc_md": "# 华严经细读·第十七部：初发心功德品（卷第十七–十八·品十七）\n\n> **EN · Close Reading of the Avatamsaka Sutra, Part Seventeen: The Chapter on the Merit of the First Resolve of Awakening**\n\n> **底本**：唐·实叉难陀译《大方广佛华严经》（八十华严）T10n0279。**范围：卷第十七至卷第十八·本品全文（品号第十七）**。本品属**第三会「忉利天宫会」·差别因果周之「十住位」胜进德**，为**第三会第五品**——紧接第十六品《梵行品》「位中通行」之后，广叹**初发心之功德**，以十一大喻层层校量，显发心即与三世诸佛平等之胜德。澄观来意判：「前二品明位及行，今顯勝德」。\n> **立稿**：2026-10-26（L.197 充实批）。承第一会（品 1-6）、第二会（品 7-12）、第三会首部（品 13-16）之体例与校勘纪律。\n\n---\n\n## 〇、凡例（简要）\n\n一、**校勘底本**：以 T10n0279（八十华严）为底本。六十华严（T09n0278·本品相当者为〈初发心菩萨功德品第十三〉**起卷九 `p.0449c22`·跨卷十**·全本 `T09n0278.xml` 六十卷已在仓，拆卷 txt 仅 1–8，故六十原文**本批未及全录**〔未竟〕）、四十华严（T10n0293·无初发心功德品·彼但入法界品别行）不作底本；**本品正文一律以八十为准，绝不据他译补写**。\n\n二、**品读主从**：以八十华严为叙事主轴；六十对读因本批未录卷九–十原文，如实标注〔未竟〕，不臆造对齐（承第二会 P8 铁律）。\n\n三、**引文回源**：本品引经文照 CBETA T10n0279 繁体原字形、逐字回源；不得以记忆或他品经文冒充。异文各照底本、不统一。注疏窗口注入档之 `<<<PAGE N>>>` 分页符（含断行分裂者·70 处）已全数剔除（L.199·正文 CJK 计数不变机检）；康熙部首变体已归一正字。\n\n四、**标识符**：〔待核〕存疑·〔本文判断〕推断·〔未竟〕未完成。\n\n---\n\n<!-- ATLAS:BEGIN P17 -->\n### 〇之零、导读指南（阅读路径与方法）\n\n**定位：** 考证型细读（philological close reading），以「可复核性」为第一优先。本品为第三会**最长之品**，全品只是一件事：**以无分限之法，校有分限之喻**。读法当**以喻为纲**——十一喻层层转胜，而至末仍曰「不可说」。\n**本品一句：** **初发心功德，無有能得知其際者**——十一喻皆可数，而所校之法不可数；喻有尽，法无尽。\n**路径：** 〇之二（二图四表）→ 一（品题与脉络）→ 二（全文逐段）→ 四（义理与名相）→ 五（诸家会读）→ 七（数据层）→ 附录按需查阅。\n**方法：** 先经文后诠释；〔实测〕／〔本文判断〕／〔存疑待核〕三分；负面证据同样入账；结构覆盖 100%，个体择要。\n**读前三问：** ① 十一喻何以必须「后后过于前前」而不能并列举？② 发心功德既「不可说」，何故又说八千余字？③ 本品与第十六品末句「不由他悟」是何关系？\n\n## 〇之二、本品内容地图（未入其门，先观其海）\n\n> **本节体例。** 图与表之数据，一律取自本文已回源核定之 §二逐段表与 §7.1／§7.5 实测数；**凡属推断者标〔本文判断〕，不入图**。图各看一事，勿求一图而尽本品。\n\n### 〇之二.0 提要\n\n本品为**第三会最长品**：品界 **CJK 8,207**——长行 **4,785**（58.3%）＋ 重颂 **3,388**（41.3%）＋ 品题译场 21。**二十七单元**＝1 head＋25 p＋1 lg＋1 byline。重颂为七言，**净句段 484・均长 7.0 言**，通 **121 颂**。品题「初發心功德品第十七」，译场「于闐國三藏實叉難陀奉　制譯」。全品结构：天王请说→叹深难说（十难）→**约喻校量（十一喻）**→就法略示→动地兴供→他方证成（万佛同名）→以偈重颂。\n\n| 图 | 画什么 | 一句话 |\n|---|---|---|\n| **图 〇-1　十一大喻·层层转胜图** | 喻如何转 | 后后过于前前，故皆捨置前前、更举后后——十一级而上 |\n| **图 〇-2　喻有分限·法无限图** | 数如何穷 | 长行 4,785／重颂 3,388；阿僧祇 21・无量 46・不可说不可说 4 |\n\n**〔读法之序〕**　先观图 〇-1 得十一喻之次第与「转胜」之法，次观图 〇-2 得「喻有分限·法无限」之数理，次读〇之二.3 之坐标，然后入 §二逐段。**喻既尽，方知不可尽。**\n\n> **EN corresponding · Map of the Chapter.** The longest chapter of the third assembly: 8,207 characters, 4,785 of prose and 3,388 of verse (121 ślokas of seven-character lines). It says one thing only — that the merit of the first arousal of the mind cannot be measured — and it says it by eleven similes, each surpassing the last, each with four parts and ten layers within, until the similes run out and the point stands: what is measured is finite, the measuring is not.\n\n### 〇之二.1 图 〇-1　十一大喻·层层转胜图\n\n<figure>\n<svg viewBox=\"0 0 1000 600\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"24\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">十一大喻：後後過於前前，捨置前前更舉後後</text>\n<text x=\"500\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a7a5e\">喻名与单元依澄观科（`T1735`·§7.5.2）；每喻具舉喻·徵問·領答·校量四句，一一喻內皆有十重</text>\n\n<g font-size=\"11.5\" fill=\"#5a5147\">\n<text x=\"26\" y=\"78\">1</text><rect x=\"56\" y=\"64\" width=\"30\" height=\"18\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"96\" y=\"78\">利樂眾生喻</text><text x=\"230\" y=\"78\" font-size=\"10.5\" fill=\"#8a7a5e\">供養樂具·持戒修善</text><text x=\"470\" y=\"78\" font-size=\"10.5\" fill=\"#8a7a5e\">80-004–008</text>\n<text x=\"26\" y=\"110\">2</text><rect x=\"56\" y=\"96\" width=\"46\" height=\"18\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"112\" y=\"110\">速疾步剎喻</text><text x=\"230\" y=\"110\" font-size=\"10.5\" fill=\"#8a7a5e\">一念過剎·展轉至十</text><text x=\"470\" y=\"110\" font-size=\"10.5\" fill=\"#8a7a5e\">80-009</text>\n<text x=\"26\" y=\"142\">3</text><rect x=\"56\" y=\"128\" width=\"62\" height=\"18\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"128\" y=\"142\">知劫成壞喻</text><text x=\"230\" y=\"142\" font-size=\"10.5\" fill=\"#8a7a5e\">知世界成壞劫數</text><text x=\"470\" y=\"142\" font-size=\"10.5\" fill=\"#8a7a5e\">80-010</text>\n<text x=\"26\" y=\"174\">4</text><rect x=\"56\" y=\"160\" width=\"78\" height=\"18\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"144\" y=\"174\">善知勝解喻</text><text x=\"230\" y=\"174\" font-size=\"10.5\" fill=\"#8a7a5e\">知眾生種種差別解</text><text x=\"470\" y=\"174\" font-size=\"10.5\" fill=\"#8a7a5e\">80-011</text>\n<text x=\"26\" y=\"206\">5</text><rect x=\"56\" y=\"192\" width=\"94\" height=\"18\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"160\" y=\"206\">善知諸根喻</text><text x=\"230\" y=\"206\" font-size=\"10.5\" fill=\"#8a7a5e\">知眾生諸根差別</text><text x=\"470\" y=\"206\" font-size=\"10.5\" fill=\"#8a7a5e\">80-012</text>\n<text x=\"26\" y=\"238\">6</text><rect x=\"56\" y=\"224\" width=\"110\" height=\"18\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"176\" y=\"238\">善知欲樂喻</text><text x=\"300\" y=\"238\" font-size=\"10.5\" fill=\"#8a7a5e\">知眾生種種欲樂</text><text x=\"470\" y=\"238\" font-size=\"10.5\" fill=\"#8a7a5e\">80-013</text>\n<text x=\"26\" y=\"270\">7</text><rect x=\"56\" y=\"256\" width=\"126\" height=\"18\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"192\" y=\"270\">善知方便喻</text><text x=\"300\" y=\"270\" font-size=\"10.5\" fill=\"#8a7a5e\">知眾生種種方便</text><text x=\"470\" y=\"270\" font-size=\"10.5\" fill=\"#8a7a5e\">80-014</text>\n<text x=\"26\" y=\"302\">8</text><rect x=\"56\" y=\"288\" width=\"142\" height=\"18\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"208\" y=\"302\">善知他心喻</text><text x=\"300\" y=\"302\" font-size=\"10.5\" fill=\"#8a7a5e\">知眾生種種差別心</text><text x=\"470\" y=\"302\" font-size=\"10.5\" fill=\"#8a7a5e\">80-015</text>\n<text x=\"26\" y=\"334\">9</text><rect x=\"56\" y=\"320\" width=\"158\" height=\"18\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"224\" y=\"334\">善知業相喻</text><text x=\"300\" y=\"334\" font-size=\"10.5\" fill=\"#8a7a5e\">知眾生種種差別業</text><text x=\"470\" y=\"334\" font-size=\"10.5\" fill=\"#8a7a5e\">80-016</text>\n<text x=\"26\" y=\"366\">10</text><rect x=\"56\" y=\"352\" width=\"174\" height=\"18\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"240\" y=\"366\">善知煩惱喻</text><text x=\"300\" y=\"366\" font-size=\"10.5\" fill=\"#8a7a5e\">知眾生種種煩惱</text><text x=\"470\" y=\"366\" font-size=\"10.5\" fill=\"#8a7a5e\">80-017</text>\n<text x=\"26\" y=\"398\">11</text><rect x=\"56\" y=\"384\" width=\"196\" height=\"18\" fill=\"#f7ecd2\" stroke=\"#b8863c\" stroke-width=\"1.4\"/><text x=\"262\" y=\"398\" font-weight=\"bold\" fill=\"#7a5a28\">供佛及生喻</text><text x=\"360\" y=\"398\" font-size=\"10.5\" fill=\"#8a7a5e\">供養無邊諸佛及眾生</text><text x=\"540\" y=\"398\" font-size=\"10.5\" fill=\"#8a7a5e\">80-018–020</text>\n</g>\n\n<line x1=\"56\" y1=\"412\" x2=\"252\" y2=\"412\" stroke=\"#b8863c\"/>\n<path d=\"M 56 412 L 66 407 L 66 417 Z\" fill=\"#b8863c\"/>\n<text x=\"60\" y=\"432\" font-size=\"10.5\" fill=\"#b8863c\">渐次转胜</text>\n\n<text x=\"600\" y=\"78\" font-size=\"11.5\" fill=\"#7a5a28\">读此阶之三事</text>\n<text x=\"600\" y=\"104\" font-size=\"11.5\" fill=\"#5a5147\">① <tspan font-weight=\"bold\">不可并列</tspan>：若十一喻并列，则读者择一而足；</text>\n<text x=\"600\" y=\"124\" font-size=\"11.5\" fill=\"#5a5147\">　 必「捨前举后」，乃显「无有一喻能尽」。</text>\n<text x=\"600\" y=\"150\" font-size=\"11.5\" fill=\"#5a5147\">② <tspan font-weight=\"bold\">后后胜前前</tspan>：所校之数愈后愈大，</text>\n<text x=\"600\" y=\"170\" font-size=\"11.5\" fill=\"#5a5147\">　 而所校之法（发心功德）始终不动。</text>\n<text x=\"600\" y=\"196\" font-size=\"11.5\" fill=\"#5a5147\">③ <tspan font-weight=\"bold\">四句十重</tspan>：每喻皆具舉喻·徵問·領答·校量，</text>\n<text x=\"600\" y=\"216\" font-size=\"11.5\" fill=\"#5a5147\">　 一一喻内「皆有十重」——<tspan font-weight=\"bold\">结构之密在全经之首</tspan>。</text>\n\n<rect x=\"600\" y=\"240\" width=\"370\" height=\"130\" rx=\"5\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/>\n<text x=\"616\" y=\"262\" font-size=\"11.5\" font-weight=\"bold\" fill=\"#7a5a28\">第十一喻之结：喻尽而法不尽</text>\n<text x=\"616\" y=\"284\" font-size=\"10.5\" fill=\"#5a5147\">「供養東方無數諸佛及無數世界所有眾生，</text>\n<text x=\"616\" y=\"302\" font-size=\"10.5\" fill=\"#5a5147\">　 恭敬尊重，禮拜讚歎……」</text>\n<text x=\"616\" y=\"324\" font-size=\"10.5\" fill=\"#5a5147\">校量至此而止：<tspan font-weight=\"bold\">所校者愈大，愈见其不及</tspan>。</text>\n<text x=\"616\" y=\"346\" font-size=\"10.5\" fill=\"#b8863c\">→ 喻有分限，法无限（图 〇-2）</text>\n\n<text x=\"26\" y=\"470\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 十一喻之名，本文悉依澄观科；喻内之次序与单元，据 §7.5.2 表与 §2.3–2.6 逐段核定。</text>\n<text x=\"26\" y=\"494\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 第一喻独占五单元（80-004–008），余十喻各一至三单元——<tspan font-weight=\"bold\">首喻立式，余喻效之</tspan>。</text>\n<text x=\"26\" y=\"518\" font-size=\"11.5\" fill=\"#7a5a28\">※ 本品之「校量」非算术，是<tspan font-weight=\"bold\">归谬</tspan>：设一极大之数，证其犹不及，则所证者非数所能及。〔本文判断〕</text>\n<text x=\"26\" y=\"542\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 重颂 121 颂（3,388 字）为长行之重述，不与十一喻一一对应；颂以七言，净句段 484·均长 7.0。</text>\n<text x=\"26\" y=\"566\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 他方证成段「万佛同名」——以他方之证，证此方之说；与第十三品「十佛曾入」同一手法。</text>\n</svg>\n<figcaption><b>图 〇-1　十一大喻·层层转胜图。</b>十一喻自「利乐众生」升至「供佛及生」，一级一级捨前举后。<b>不可并列，是此法之要</b>：若十一喻并列，读者择一而足；必捨前举后，乃显「无有一喻能尽」〔本文判断〕。每喻具四句、内含十重，<b>结构之密为全经之首</b>。至第十一喻而止，所校者愈大，愈见其不及——<b>喻有分限，法无限</b>。<div class=\"en-line\">Fig. 0-1. Eleven similes rising from benefiting beings to honouring Buddhas beyond count, each discarding the last. They cannot be laid side by side: if they were, a reader could take one and be satisfied. Each has four parts and ten layers within — the densest structure in the whole sūtra. At the eleventh the similes stop, and the larger the measure, the more plainly it falls short.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. **读一喻，须读其「捨」字。** 「捨置前前，更舉後後」——**捨是此法的一半**；不读捨，则十一喻成十一例。\n2. **校量不是算数，是归谬。** 设极大之数而证其不及，则所证者非数所能及——**故终以「不可说」收**。\n3. **四句十重，宜取一喻细读。** 十一喻全读则疲；**取第一喻（80-004–008）读透，余十喻之式自明**。\n\n### 〇之二.2 图 〇-2　喻有分限·法无限图\n\n<figure>\n<svg viewBox=\"0 0 1000 560\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"24\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">八千二百字，只证一句「不可说」</text>\n<text x=\"500\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a7a5e\">左：体量分配；右：校量数词频（body80 CJK-only 实测·§7.5.1）</text>\n\n<text x=\"30\" y=\"80\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#7a5a28\">体量</text>\n<rect x=\"30\" y=\"92\" width=\"300\" height=\"230\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/>\n<rect x=\"46\" y=\"106\" width=\"268\" height=\"126\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/>\n<text x=\"180\" y=\"160\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#7a5a28\">長行 4,785</text>\n<text x=\"180\" y=\"180\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5147\">25 p　·　58.3%</text>\n<text x=\"180\" y=\"210\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8a7a5e\">十一喻皆在此</text>\n<rect x=\"46\" y=\"238\" width=\"190\" height=\"74\" fill=\"#d9c9a4\" stroke=\"#c9b98f\"/>\n<text x=\"141\" y=\"272\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#7a5a28\">重頌 3,388</text>\n<text x=\"141\" y=\"292\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#5a5147\">1 lg　·　41.3%　·　121 頌</text>\n<text x=\"30\" y=\"342\" font-size=\"10.5\" fill=\"#8a7a5e\">品题＋译场 21（0.3%）</text>\n<text x=\"30\" y=\"364\" font-size=\"10.5\" fill=\"#7a5a28\">合计 8,207＝第三会最长品</text>\n\n<text x=\"380\" y=\"80\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#7a5a28\">校量数词频（1 次＝6px）</text>\n<g font-size=\"11\" fill=\"#5a5147\">\n<text x=\"380\" y=\"110\">無量</text><rect x=\"470\" y=\"98\" width=\"276\" height=\"16\" fill=\"#d9c9a4\" stroke=\"#c9b98f\"/><text x=\"754\" y=\"111\" fill=\"#7a5a28\">46</text>\n<text x=\"380\" y=\"136\">佛子</text><rect x=\"470\" y=\"124\" width=\"228\" height=\"16\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"706\" y=\"137\">38</text>\n<text x=\"380\" y=\"162\">十方</text><rect x=\"470\" y=\"150\" width=\"228\" height=\"16\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"706\" y=\"163\">38</text>\n<text x=\"380\" y=\"188\">阿耨多羅三藐三菩提心</text><rect x=\"470\" y=\"176\" width=\"186\" height=\"16\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"664\" y=\"189\">31</text>\n<text x=\"380\" y=\"214\">阿僧祇</text><rect x=\"470\" y=\"202\" width=\"126\" height=\"16\" fill=\"#f7ecd2\" stroke=\"#b8863c\" stroke-width=\"1.3\"/><text x=\"604\" y=\"215\" font-weight=\"bold\" fill=\"#7a5a28\">21</text>\n<text x=\"380\" y=\"240\">初發心</text><rect x=\"470\" y=\"228\" width=\"66\" height=\"16\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"544\" y=\"241\">11</text>\n<text x=\"380\" y=\"266\">那由他</text><rect x=\"470\" y=\"254\" width=\"48\" height=\"16\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"526\" y=\"267\">8</text>\n<text x=\"380\" y=\"292\">微塵數</text><rect x=\"470\" y=\"280\" width=\"30\" height=\"16\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"508\" y=\"293\">5</text>\n<text x=\"380\" y=\"318\">優波尼沙陀</text><rect x=\"470\" y=\"306\" width=\"24\" height=\"16\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"502\" y=\"319\">4</text>\n<text x=\"380\" y=\"344\">不可說不可說</text><rect x=\"470\" y=\"332\" width=\"24\" height=\"16\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"502\" y=\"345\">4</text>\n</g>\n\n<line x1=\"30\" y1=\"382\" x2=\"970\" y2=\"382\" stroke=\"#c9b98f\"/>\n<text x=\"30\" y=\"408\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#b8863c\">数之梯：阿僧祇 → 那由他 → 不可說不可說 → 喻 → 法</text>\n<text x=\"30\" y=\"432\" font-size=\"11.5\" fill=\"#5a5147\">前四者皆是「有分限之极」：阿僧祇（无数）·那由他（千万亿）·不可说不可说（言语道断）——<tspan font-weight=\"bold\">而皆不足以校发心功德</tspan>。</text>\n<text x=\"30\" y=\"456\" font-size=\"11.5\" fill=\"#5a5147\">故第十一喻后,不说「更多」，而说「無有能得知其際者」——<tspan font-weight=\"bold\">从「量」跳到「无量」,不是加法,是换轴</tspan>。〔本文判断〕</text>\n\n<rect x=\"30\" y=\"476\" width=\"940\" height=\"56\" rx=\"4\" fill=\"#f7ecd2\" stroke=\"#b8863c\"/>\n<text x=\"46\" y=\"496\" font-size=\"11.5\" font-weight=\"bold\" fill=\"#7a5a28\">〔数理之眼〕凡校量之文，其效不在末数之大，而在「捨」之次数：十一捨而后不可说，则读者自弃其计量之习。</text>\n<text x=\"46\" y=\"516\" font-size=\"11\" fill=\"#8a7a5e\">此与第十四品以十为量、以无尽为归同法，而此品以「捨」行之，彼品以「引」行之。</text>\n</svg>\n<figcaption><b>图 〇-2　喻有分限·法无限图。</b>左为体量（长行 4,785・重颂 3,388），右为校量数词频。<b>关键不在「无量」46 见之多，而在数梯之顶</b>：阿僧祇→那由他→不可说不可说，皆是「有分限之极」，而皆不足以校发心功德。<b>故末不说「更多」，而说「無有能得知其際者」——从「量」跳到「无量」，不是加法，是换轴</b>〔本文判断〕。<div class=\"en-line\">Fig. 0-2. Left, the body: 4,785 of prose, 3,388 of verse. Right, the frequency of measuring words. What matters is not that \\\"measureless\\\" occurs 46 times but where the ladder ends: asaṃkhya, nayuta, \\\"unutterable upon unutterable\\\" — each an extremity of the finite, and none sufficient. So the close is not \\\"more\\\" but \\\"no one can know its limit\\\": not addition but a change of axis.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. **数词之频，不作「重点」读。** 「无量」46 见只证其反复；**要者在「捨」之结构**，不在词频之高低。\n2. **「不可说」不是修辞上的放弃，是方法论上的转身。** 说不可说，仍说八千字——**所说者为「何以不可说」，非「不可说者为何」**。\n3. **与第十四品对看，见两种「无尽」。** 彼以「引」至无尽（递引链），此以「捨」至无尽（十一喻）——**一纵一横，同归无尽**。\n\n### 〇之二.3 本品在第三会（忉利天宫·说十住）之坐标\n\n本品为第三会第五品，**十住之「德」**：前二品（15–16）立位与行，此品校量「初发心」之功德——**位行之极，归于初心**。澄观判此品为「**勝進**」：十住自分已毕，此明趣入十行之胜进功德。\n\n| 品 | 卷 | 位／科 | 一句提撕 | 与本品之关系 |\n|---|---|---|---|---|\n| 15 十住 | 卷16 | 第三会·正说·位 | 十住双十，百颂 | 位立 |\n| 16 梵行 | 卷17 | 第三会·正说·行 | 十法推徵，离相梵行 | 行净 |\n| **17 初发心功德（本品）** | 卷17–18 | 第三会·**胜进·德** | 十一喻校量，121 颂 | 德显 |\n| 18 明法 | 卷18 | 第三会·**收束·法** | 十法矩阵，双颂 | 德归诸法 |\n| 19 昇夜摩天宮 | 卷19 | 第四会·十行·发起 | 不起而升（重演） | 第三会竟，四会启 |\n\n### 〇之二.4 本品形式特征（与邻品对看）\n\n本品之特色在**以校量为全部内容**：八千余字，不出「发心功德不可量」一事，而层层设喻以证之。**在三十九品中，以如此长的篇幅、只作一件事（校量）者，唯此一品**〔本文判断·据本文所核诸品〕。\n\n| 特征 | 本品表现〔实测〕 | 邻品之对照 | 读法上的后果 |\n|---|---|---|---|\n| 篇幅 | CJK 8,207（第三会最长） | 第十六品 923（第三会最短） | 同会之中，相去近九倍 |\n| 内容单一 | 全品只「校量发心功德」一事 | 第十八品十五组十法，条目繁多 | 一以深，一以广 |\n| 校量结构 | 十一喻，后后胜前前，皆捨置前前 | 第八品四十名并列（矩阵，不转胜） | 一为链，一为阵 |\n| 数与语 | 阿僧祇 21・无量 46・不可说不可说 4 | 第十八品阿僧祇仅 1 | 一会之内，数语之偏至此 |\n| 重颂 | 121 颂・3,388 字（41.3%） | 第十八品双颂仅 588（10.6%） | 一以颂重述，一以颂点缀 |\n| 证成 | 他方万佛同名证成 | 第十三品十佛曾入证成 | 两品同以「他证」立信 |\n\n### 〇之二.5 五种读法（导览）\n\n| 读法 | 路径 | 适合谁 | 得什么 |\n|---|---|---|---|\n| **喻读** | 只读十一喻之「举喻」一句 | 初读本篇者 | 得十一喻之次第 |\n| **一喻读** | 取第一喻（80-004–008）读透 | 欲见四句十重者 | 得校量之全式 |\n| **数读** | 只观图 〇-2 与 §7.5.1 词频 | 好数量级者 | 见「换轴」之法 |\n| **颂读** | 读 §2.7 重颂，比其与长行之异同 | 欲见重颂体者 | 知颂为长行之重述 |\n| **承读** | 本品 §2.4 → 第十八品 §2.1 | 欲见会终者 | 见「德」如何收为「法」 |\n\n### 〇之二.6 数与位之谱：本品之数，四等分录\n\n华严之数非计数之数。本品所涉之数，来源不一，性质亦不一；**先分其等，后论其义**，则不为数目所惑。\n\n| 等第 | 数 | 出处 | 性质 |\n|---|---|---|---|\n| **T0 经文明文** | 「無有能得知其際者」 | `T10n0279` 卷十七–十八 | 校量之结语 |\n| **T0 经文明文** | 十一喻之「举喻」句 | 同上·80-004–020 | 喻体之实 |\n| **T0 本文实测** | **8,207 字／长行 4,785＋颂 3,388** | §7.1 `_e17_stats.py` | 计数（本文自测） |\n| **T0 本文实测** | 27 单元・121 颂・净句段 484（均 7.0 言） | §7.1／§7.5.3 | 计数（本文自测） |\n| **T1 澄观《疏》** | 「此十一喻，後後過於前前，故皆捨置前前更舉後後，巧顯深勝」 | `T1735` 本品段 | 十一喻之科判 |\n| **T1 澄观《疏》** | 「又諸喻內，一一皆有十重」 | `T1735` 本品段 | 四句十重之据〔L.206 回源订正：原引作一一喻中皆有十重，非疏原文〕 |\n| **T2 六十** | 〈發心菩薩功德品第十三〉 | `T09n0278` | 品次对照 |\n\n> **〔读法〕** 本品之数有两层：**体量之数**（8,207・4,785・3,388・121）与**校量之数**（阿僧祇・那由他・不可说不可说）。**两层不可混**：前者是本文实测，后者是经文所设之喻限。若以喻限当实测，则疑经；若以实测当喻限，则失旨。\n\n<!-- ATLAS:END P17 -->\n\n## 一、概述与品题解义\n\n### 1.1 品题释义\n\n**品名**：**初发心功德品**（八十华严**第十七品**，唐·实叉难陀译）。全篇跨《大方广佛华严经》**卷第十七至卷第十八**，紧接第十六品《梵行品》之后、第十八品《明法品》之前，为**第三会「忉利天宫会」第五品·十住位胜进德**。\n\n**「初发心功德」**——澄观《疏》（T1735）：「初有二義。一三種發心之初。二十住之初發。亦二義。一發起上求。二三德開發」·法藏《探玄记》（T1733·六十品题作〈發心菩薩功德品第十三〉）：「初釋名者，本覺內薰，大心創起，故云發心。行成位立，名為菩薩。功超遠劫，德廣塵沙，故云功德」·慧苑《刊定记》（X0221）：「按梵本，名初發心菩薩功德藏品。初者，十住中第一住故。發心者，起三種心，增上脩諸行故」。\n\n### 1.2 品位与脉络（承上启下）\n\n**澄观来意**（T1735）：「謂前二品明位及行。今顯勝德。舉初況後，巧顯深勝，故次來也。又前品末云『初發心時便成正覺』，未知此心有何功用，頓得爾耶，今釋此義故次來也」——本品承第十六品末句「初發心時即得阿耨多羅三藐三菩提」之伏笔，正面广叹发心功德。\n\n**承上启下**：\n- **承上**：第十五品明十住位次、第十六品明位中通行，本品即「位」「行」既立之后，显其**胜德**——初发心所摄功德无边；\n- **本品**：天帝释问·法慧答——先叹深难说（十难），次以**十一大喻**层层校量，就法略示（十二句·配如来十力），动地兴供·他方证成，末以**一百二十一颂**重颂；\n- **启下**：第十八品《明法品》结会归劝，广列十佛名号。\n\n### 1.3 篇幅与结构预览（实测）\n\n品界 T10n0279 CJK-only @109945–118152·**CJK 8207**：长行 4,785＋重颂 3,388（lg·七言·净句段 484）。平文器 27 单元＝1 head＋25 p＋1 lg＋1 byline。本品为**第三会最长品**，纯由「约喻校量」推极功德数量级。详见 §七数据层。\n\n### 1.4 核心要义\n\n一、**叹深难说·十难**——「此義甚深，難說、難知、難分別、難信解、難證、難行、難通達、難思惟、難度量、難趣入」（80-003），法慧「承佛威神之力」方得为说。\n\n二、**十一大喻·校量功德**——以供养、步刹、知劫、知解、知根、知欲、知方便、知心、知业、知烦恼、供佛十一重喻，层层转胜（「後後過於前前」），显「菩薩初發阿耨多羅三藐三菩提心功德善根，無有能得知其際者」。\n\n三、**发心即与三世诸佛平等**——「纔發心時，即為十方一切諸佛所共稱歎……即與三世諸佛同等，即與三世諸佛如來境界平等，即與三世諸佛如來功德平等」（80-020），为华严「初發心時便成正覺」顿旨之正面展开。\n\n### 1.5 经文文本现象与信度标识\n\n- 「法  慧菩薩言」五字独立为 p（80-002·与 80-001 文内语重叠·平文器重计）；\n- 「即說頌言」两处（80-023 末、80-024 独立），系 CBETA 分段所致之句末提示重出；\n- 长行数词「優波尼沙陀」（80-006、80-008、80-020）为校量数之极细位，澄观释为「近少」。\n\n### 1.7 核心要义小结\n\n本品一句话：**天帝问发心功德·法慧先叹十难·再以十一大喻层层校量·显初发心即与三世诸佛平等·终以一廿一颂重颂结劝**——将第十六品末句「初发心即得菩提」之顿旨，以数量级的极量对比展开为可诵之德海〔本文判断〕。\n\n---\n\n## 二、卷第十七–十八（初发心功德品第十七·本品全文）\n\n### 2.0 结构总表（据经切分·澄观释文七分）\n\n| 段号 | 澄观科判 | 单元 | 内容 | CJK（实测） |\n|---|---|---|---|---|\n| 甲·天王请说 | 一天王請說分 | 80-001·80-002 | 天帝释问发心功德其量几何·法慧言 | 34 |\n| 乙·叹深难说 | 二歎深難說分 | 80-003 | 此义甚深·十难·承佛威神方说 | 44 |\n| 丙·约喻校量 | 三約喻校量分 | 80-004–80-020 | 十一大喻层层转胜·发心无际 | 约 2,900 |\n| 丁·就法略示 | 四就法略示分 | 含 80-008/80-020 | 十二句·配如来十力·为不断如来种性故 | 摄于丙 |\n| 戊·动地兴供 | 五動地興供分 | 80-021 | 十方万佛刹六种震动·雨天华天宝 | 92 |\n| 己·他方证成 | 六他方證成分 | 80-022 | 万佛同名法慧现身印可·皆号清净心如来 | 328 |\n| 庚·以偈重颂 | 七以偈重頌分 | 80-023–80-025 | 一百二十一颂·结德劝赞 | 3,388＋ |\n| 辛·品题·卷题 | — | 80-000·80-026 | 品题＋于闐译场 byline | 21 |\n\n### 2.1 天王请说（80-001）\n\n> 爾時，天帝釋白法慧菩薩言：「佛子！菩薩初發菩提之心，所得功德，其量幾何？」\n\n**疏解**：问主**天帝释**——澄观：「初中天帝問者。在彼宮故。聞前速成生疑念故。菩提心是萬行主故。問法慧者。是會主故」（T1735）。所问「菩薩初發菩提之心，所得功德，其量幾何」——正问第十六品末句「初发心即得菩提」之功德分剂。\n\n### 2.2 叹深难说·十难（80-003）\n\n> 「此義甚深，難說、難知、難分別、難信解、難證、難行、難通達、難思惟、難度量、難趣入。雖然，我當承佛威神之力而為汝說。」\n\n**疏解**：澄观判「於中初句總。言甚深者。謂約時深徹後際。約德深至佛果。約理深同法界。約行深包萬行。並深中之極故云甚深」；下**十句别**「由斯十義故曰甚深」——離言故難宣示、無相故超心識、非自力辯能分別、非劣慧能信解、……「此六後後劣於前前，巧顯深也」（T1735）。\n\n### 2.3 约喻校量·第一利乐众生喻（80-004–80-006）\n\n> 「佛子！假使有人以一切樂具，供養東方阿僧祇世界所有眾生，經於一劫，然後教令淨持五戒；南、西、北方，四維、上、下，亦復如是。」……「佛子！此人功德比菩薩初發心功德，百分不及一，千分不及一，百千分不及一；如是，億分、百億分、千億分、百千億分、那由他億分、百那由他億分、千那由他億分、百千那由他億分、數分、歌羅分、算分、諭分、優波尼沙陀分，亦不及一。」\n\n**疏解**：澄观科**约喻校量分**「中有十一大喻」，「然此十一喻，後後過於前前，故皆捨置前前更舉後後，巧顯深勝」（T1735）。此第一喻举「供养—持戒」之福，较以发心功德则「百分不及一」乃至「優波尼沙陀分亦不及一」。\n\n### 2.4 就法略示·为不断如来种性故（80-008）\n\n> 「何以故？佛子！一切諸佛初發心時，不但為以一切樂具，供養十方十阿僧祇世界所有眾生，經於百劫，乃至百千那由他億劫故，發菩提心；……為令如來種性不斷故，為充遍一切世界故，為度脫一切世界眾生故，為悉知一切世界成壞故……發於無上菩提之心。」\n\n**疏解**：「就法略示分」澄观判「於中有十二句。初三總相對前辨勝……下九句即下十喻之本」，并以九句配**如来十力智**——「一即第三知劫成壞喻本……九知佛境界平等即第十一供佛喻本」（T1735）。发心之所以不可量，以其境无限、为不断如来种性故。\n\n### 2.5 动地兴供（80-021）\n\n> 爾時，佛神力故，十方各一萬佛剎微塵數世界六種震動。所謂：動、遍動、等遍動，起、遍起、等遍起，涌、遍涌、等遍涌，震、遍震、等遍震，吼、遍吼、等遍吼，擊、遍擊、等遍擊。雨眾天華、天香、天末香、天華鬘、天衣、天寶、天莊嚴具，作天妓樂，放天光明及天音聲。\n\n**疏解**：澄观科「五動地興供分」。六种震动各三（动·遍动·等遍动……击·遍击·等遍击），以瑞相显发心功德之感通。\n\n### 2.6 他方证成·万佛同名（80-022）\n\n> 是時，十方各過十佛剎微塵數世界外，有萬佛剎微塵數佛，同名：法慧，各現其身，在法慧菩薩前作如是言：「善哉！善哉！法慧！汝於今者，能說此法；我等十方各萬佛剎微塵數佛，亦說是法；一切諸佛，悉如是說。」……「於當來世過千不可說無邊劫，同一劫中而得作佛，出興於世，皆號：清淨心如來。」\n\n**疏解**：澄观科「六他方證成分」。十方万佛同名「法慧」现身印可，为发心菩萨授记「皆号清净心如来」，显此法为一切诸佛共说。\n\n### 2.7 以偈重颂（80-025·一百二十一颂）\n\n本品末法慧以**一百二十一颂**重颂长行。澄观科：「正顯偈辭。有一百二十一頌。文分三段。初八十二偈，超頌就法略示。二有三十四偈，却頌就喻校量。三有五偈結德勸讚，令景慕發心」（T1735）。首颂：\n\n> 「為利世間發大心，其心普遍於十方，眾生國土三世法，佛及菩薩最勝海。」\n\n末颂结劝：\n\n> 「欲見十方一切佛，欲施無盡功德藏，欲滅眾生諸苦惱，宜應速發菩提心。」\n\n以下按 CBETA T10n0279 平文器 27 单元（1 head + 25 p + 1 lg + 1 byline）逐段照录八十华严〈初發心功德品第十七〉全文。各段标号与 §2.0 结构总表对应。\n\n**80-000**（`head`·CJK 9）：\n\n> 初發心功德品第十七\n\n**80-001**（`p`·CJK 29）：\n\n> 爾時，天帝釋白法慧菩薩言：「佛子！菩薩初發  菩提之心，所得功德，其量幾何？」\n\n**80-002**（`p`·CJK 5）：\n\n> 法  慧菩薩言：\n\n**80-003**（`p`·CJK 44）：\n\n> 「此義甚深，難說、難知、難分別、難信解、難證、難  行、難通達、難思惟、難度量、難趣入。雖然，我當  承佛威神之力而為汝說。\n\n**80-004**（`p`·CJK 63）：\n\n> 「佛子！假使有人以  一切樂具，供養東方阿僧祇世界所有眾生，  經於一劫，然後教令淨持五戒；南、西、北方，四  維、上、下，亦復如是。佛子！於汝意云何，此人功  德寧為多不？」\n\n**80-005**（`p`·CJK 21）：\n\n> 天帝言：「佛子！此人功德，唯佛  能知，其餘一切無能量者。」\n\n**80-006**（`p`·CJK 87）：\n\n> 「佛  子！此人功德比菩薩初發心功德，百分不及  一，千分不及一，百千分不及一；如是，億分、百  億分、千億分、百千億分、那由他億分、百那由  他億分、千那由他億分、百千那由他億分、數  分、歌羅分、算分、諭分、優波尼沙陀分，亦不  及一。\n\n**80-007**（`p`·CJK 150）：\n\n> 「佛子！且置此諭。假使有人以一切樂  具，供養十方十阿僧祇世界所有眾生，經於  百劫，然後教令修十善道；如是供養，經於  千劫，教住四禪；經於百千劫，教住四無量心；  經於億劫，教住四無色定；經於百億劫，教  住須陀洹果；經於千億劫，教住斯陀含果；  經於百千億劫，教住阿那含果；經於那由他  億劫，教住阿羅漢果；經於百千那由他億劫，  教住辟支佛道。佛子！於意云何，是人功德  寧為多不？」\n\n**80-008**（`p`·CJK 290）：\n\n> 「佛子！此人功德比菩薩初發  心功德，百分不及一，千分不及一，百千分  不及一，乃至優波尼沙陀分亦不及一。何以  故？佛子！一切諸佛初發心時，不但為以一  切樂具，供養十方十阿僧祇世界所有眾  生，經於百劫，乃至百千那由他億劫故，發菩  提心；不但為教爾所眾生，令修五戒、十善業  道，教住四禪、四無量心、四無色定，教得須  陀洹果、斯陀含果、阿那含果、阿羅漢果、辟  支佛道故，發菩提心；為令如來種性不斷  故，為充遍一切世界故，為度脫一切世界眾  生故，為悉知一切世界成壞故，為悉知一切  世界中眾生垢淨故，為悉知一切世界自  性清淨故，為悉知一切眾生心樂煩惱習氣  故，為悉知一切眾生死此生彼故，為悉知  一切眾生諸根方便故，為悉知一切眾生  心行故，為悉知一切眾生三世智故，為悉  知一切佛境界平等故，發於無上菩提之心。\n\n**80-009**（`p`·CJK 378）：\n\n> 「佛子！復置此諭。假使有人，於一念頃，能過  東方阿僧祇世界；念念如是，盡阿僧祇劫，  此諸世界無有能得知其邊際。又第二人，於  一念頃，能過前人阿僧祇劫所過世界；如是，  亦盡阿僧祇劫。次第展轉，乃至第十。南、西、北  方，四維、上、下，亦復如是。佛子！此十方中，凡  有百人，一一如是過諸世界，是諸世界可知  邊際；菩薩初發阿耨多羅三藐三菩提心所  有善根，無有能得知其際者。何以故？佛子！  菩薩不齊限，但為往爾所世界得了知故，  發菩提心；為了知十方世界故，發菩提心。   所謂：欲了知妙世界即是麁世界，麁世界  即是妙世界；仰世界即是覆世界，覆世界即  是仰世界；小世界即是大世界，大世界即是  小世界；廣世界即是狹世界，狹世界即是廣  世界；一世界即是不可說世界，不可說世界  即是一世界；不可說世界入一世界，一世界  入不可說世界；穢世界即是淨世界，淨世  界即是穢世界。欲知一毛端中，一切世界差  別性；一切世界中，一毛端一體性。欲知一世  界中出生一切世界，欲知一切世界無體性。  欲以一念心盡知一切廣大世界而無障  礙故，發阿耨多羅三藐三菩提心。\n\n**80-010**（`p`·CJK 373）：\n\n> 「佛子！復  置此諭。假使有人，於一念頃，能知東方阿  僧祇世界成壞劫數；念念如是，盡阿僧祇  劫，此諸劫數無有能得知其邊際。有第二  人，於一念頃，能知前人阿僧祇劫所知劫  數。如是廣說，乃至第十。南、西、北方，四維、上、  下，亦復如是。佛子！此十方阿僧祇世界成壞  劫數，可知邊際；菩薩初發阿耨多羅三藐三  菩提心功德善根，無有能得知其際者。何  以故？菩薩不齊限，但為知爾所世界成壞  劫數故，發阿耨多羅三藐三菩提心；為悉知  一切世界成壞劫盡無餘故，發阿耨多羅  三藐三菩提心。所謂：知長劫與短劫平等，  短劫與長劫平等；一劫與無數劫平等，無  數劫與一劫平等；有佛劫與無佛劫平等，無  佛劫與有佛劫平等；一佛劫中有不可說佛，  不可說佛劫中有一佛；有量劫與無量劫  平等，無量劫與有量劫平等；有盡劫與無盡   劫平等，無盡劫與有盡劫平等；不可說劫  與一念平等，一念與不可說劫平等；一切劫  入非劫，非劫入一切劫。欲於一念中盡知前  際、後際，及現在一切世界成壞劫故，發阿耨  多羅三藐三菩提心，是名：初發心大誓莊嚴  了知一切劫神通智。\n\n**80-011**（`p`·CJK 467）：\n\n> 「佛子！復置此諭。假使  有人，於一念頃，能知東方阿僧祇世界所有  眾生種種差別解；念念如是，盡阿僧祇劫。  有第二人，於一念頃，能知前人阿僧祇劫  所知眾生諸解差別；如是，亦盡阿僧祇劫。  次第展轉，乃至第十。南、西、北方，四維、上、下，  亦復如是。佛子！此十方眾生種種差別解，可  知邊際；菩薩初發阿耨多羅三藐三菩提心  功德善根，無有能得知其際者。何以故？佛  子！菩薩不齊限，但為知爾所眾生解故，發阿  耨多羅三藐三菩提心；為盡知一切世界所  有眾生種種差別解故，發阿耨多羅三藐三  菩提心。所謂：欲知一切差別解無邊故，一眾  生解、無數眾生解平等故；欲得不可說差  別解方便智光明故；欲悉知眾生海各各  差別解，盡無餘故；欲悉知過、現、未來，善、不善  種種無量解故；欲悉知相似解、不相似解故；  欲悉知一切解即是一解，一解即是一切解  故；欲得如來解力故；欲悉知有上解、無上  解、有餘解、無餘解、等解、不等解差別故；欲  悉知有依解、無依解、共解、不共解、有邊解、無  邊解、差別解、無差別解、善解、不善解、世間  解、出世間解差別故；欲於一切妙解、大解、  無量解、正位解中，得如來解脫無障礙智故；   欲以無量方便，悉知十方一切眾生界，一一  眾生淨解、染解、廣解、略解、細解、麁解，盡無餘  故；欲悉知深密解、方便解、分別解、自然解、隨  因所起解、隨緣所起解，一切解網悉無餘  故，發阿耨多羅三藐三菩提心。\n\n**80-012**（`p`·CJK 199）：\n\n> 「佛子！復置此  諭。假使有人，於一念頃，能知東方無數世  界一切眾生諸根差別；念念如是，經阿僧祇  劫。有第二人，於一念頃，能知前人阿僧祇  劫念念所知諸根差別。如是廣說，乃至第  十。南、西、北方，四維、上、下，亦復如是。佛子！此  十方世界所有眾生諸根差別，可知邊際；菩  薩初發阿耨多羅三藐三菩提心功德善根，  無有能得知其際者。何以故？菩薩不齊限，但  為知爾所世界眾生根故，發阿耨多羅三藐  三菩提心；為盡知一切世界中一切眾生  根種種差別，廣說乃至，欲盡知一切諸根  網故，發阿耨多羅三藐三菩提心。\n\n**80-013**（`p`·CJK 168）：\n\n> 「佛子！復  置此諭。假使有人，於一念頃，能知東方無  數世界所有眾生種種欲樂；念念如是，  盡阿僧祇劫。次第廣說，乃至第十。南、西、北方，  四維、上、下，亦復如是。此十方眾生所有欲  樂，可知邊際；菩薩初發阿耨多羅三藐三菩  提心功德善根，無有能得知其際者。何以  故？佛子！菩薩不齊限，但為知爾所眾生欲樂  故，發阿耨多羅三藐三菩提心；為盡知一  切世界所有眾生種種欲樂，廣說乃至，欲盡  知一切欲樂網故，發阿耨多羅三藐三菩提  心。\n\n**80-014**（`p`·CJK 163）：\n\n> 「佛子！復置此諭。假使有人，於一念頃，能  知東方無數世界所有眾生種種方便。如   是廣說，乃至第十。南、西、北方，四維、上、下，亦復  如是。此十方眾生種種方便，可知邊際；  菩薩初發阿耨多羅三藐三菩提心功德善  根，無有能得知其際者。何以故？佛子！菩  薩不齊限，但為知爾所世界眾生種種方便  故，發阿耨多羅三藐三菩提心；為盡知一切  世界所有眾生種種方便，廣說乃至，欲盡  知一切方便網故，發阿耨多羅三藐三菩提  心。\n\n**80-015**（`p`·CJK 146）：\n\n> 「佛子！復置此諭。假使有人，於一念頃，能  知東方無數世界所有眾生種種差別心。  廣說乃至，此十方世界所有眾生種種差別  心，可知邊際；菩薩初發阿耨多羅三藐三菩  提心功德善根，無有能得知其際者。何以故？  佛子！菩薩不齊限，但為知爾所眾生心故，  發阿耨多羅三藐三菩提心；為悉知盡法界、  虛空界無邊眾生種種心，乃至欲盡知一  切心網故，發阿耨多羅三藐三菩提心。\n\n**80-016**（`p`·CJK 132）：\n\n> 「佛子！  復置此諭。假使有人，於一念頃，能知東方  無數世界所有眾生種種差別業。廣說乃至，  此十方眾生種種差別業，可知邊際；菩薩  初發阿耨多羅三藐三菩提心善根邊際，不  可得知。何以故？佛子！菩薩不齊限，但為知爾  所眾生業故，發阿耨多羅三藐三菩提心；  欲悉知三世一切眾生業，乃至欲悉知一切  業網故，發阿耨多羅三藐三菩提心。\n\n**80-017**（`p`·CJK 390）：\n\n> 「佛子！  復置此諭。假使有人，於一念頃，能知東方  無數世界所有眾生種種煩惱；念念如是，  盡阿僧祇劫，此諸煩惱種種差別，無有能得  知其邊際。有第二人，於一念頃，能知前人   阿僧祇劫所知眾生煩惱差別；如是，復盡阿  僧祇劫。次第廣說，乃至第十。南、西、北方，四維、  上、下，亦復如是。佛子！此十方眾生煩惱差  別，可知邊際；菩薩初發阿耨多羅三藐三菩  提心善根邊際，不可得知。何以故？佛子！  菩薩不齊限，但為知爾所世界眾生煩惱故，  發阿耨多羅三藐三菩提心；為盡知一切世  界所有眾生煩惱差別故，發阿耨多羅三  藐三菩提心。所謂：欲盡知輕煩惱、重煩惱、眠  煩惱、起煩惱，一一眾生無量煩惱種種差別、  種種覺觀，淨治一切諸雜染故；欲盡知依無  明煩惱、愛相應煩惱，斷一切諸有趣煩惱結  故；欲盡知貪分煩惱、瞋分煩惱、癡分煩惱、等  分煩惱，斷一切煩惱根本故；欲悉知我煩惱、  我所煩惱、我慢煩惱，覺悟一切煩惱盡無餘  故；欲悉知從顛倒分別生根本煩惱、隨煩惱，  因身見生六十二見，調伏一切煩惱故；欲  悉知蓋煩惱、障煩惱，發大悲救護心，斷一切  煩惱網，令一切智性清淨故，發阿耨多羅  三藐三菩提心。\n\n**80-018**（`p`·CJK 179）：\n\n> 「佛子！復置此諭。假使有人，  於一念頃，以諸種種上味飲食、香華、衣服、幢  幡、傘蓋，及僧伽藍、上妙宮殿、寶帳、網幔，種種  莊嚴師子之座及眾妙寶，供養東方無數諸  佛，及無數世界所有眾生，恭敬尊重，禮拜讚  歎，曲躬瞻仰，相續不絕，經無數劫。又勸  彼眾生，悉令如是供養於佛。至佛滅後，各  為起塔。其塔高廣，無數世界眾寶所成種  種莊嚴。一一塔中，各有無數如來形像，光明  遍照無數世界，經無數劫。南、西、北方，四維、上、   下，亦復如是。佛子！於汝意云何，此人功德  寧為多不？」\n\n**80-019**（`p`·CJK 15）：\n\n> 天帝言：「是人功德，唯佛乃知，餘無  能測。」\n\n**80-020**（`p`·CJK 882）：\n\n> 「佛子！復置此諭。  假使復有第二人，於一念中，能作前人及  無數世界所有眾生無數劫中供養之事；念  念如是，以無量種供養之具，供養無量諸佛  如來，及無量世界所有眾生，經無量劫。其第  三人，乃至第十人，皆亦如是，於一念中能作  前人所有供養；念念如是，以無邊、無等、不可  數、不可稱、不可思、不可量、不可說、不可說不  可說供養之具，供養無邊乃至不可說不可  說諸佛，及爾許世界所有眾生，經無邊乃至  不可說不可說劫。至佛滅後，各為起塔，其塔  高廣。乃至住劫，亦復如是。佛子！此前功  德比菩薩初發心功德，百分不及一，千分不  及一，百千分不及一，乃至優波尼沙陀分  亦不及一。何以故？佛子！菩薩摩訶薩不齊  限，但為供養爾所佛故，發阿耨多羅三藐三  菩提心；為供養盡法界、虛空界，不可說不可  說十方無量去、來、現在所有諸佛故，發阿耨  多羅三藐三菩提心。發是心已，能知前際一  切諸佛始成正覺及般涅槃，能信後際一切  諸佛所有善根，能知現在一切諸佛所有智  慧。彼諸佛所有功德，此菩薩能信、能受、能  修、能得、能知、能證、能成就，能與諸佛平等  一性。何以故？此菩薩為不斷一切如來種性  故，發心；為充遍一切世界故，發心；為度脫   一切世界眾生故，發心；為悉知一切世界成  壞故，發心；為悉知一切眾生垢淨故，發心；為  悉知一切世界三有清淨故，發心；為悉知一  切眾生心樂煩惱習氣故，發心；為悉知一切  眾生死此生彼故，發心；為悉知一切眾生  諸根方便故，發心；為悉知一切眾生心行故，  發心；為悉知一切眾生三世智故，發心。以  發心故，常為三世一切諸佛之所憶念，當得  三世一切諸佛無上菩提；即為三世一切諸  佛與其妙法，即與三世一切諸佛體性平等；  已修三世一切諸佛助道之法，成就三世一  切諸佛力、無所畏；莊嚴三世一切諸佛不共  佛法，悉得法界一切諸佛說法智慧。何以  故？以是發心，當得佛故。應知此人即與  三世諸佛同等，即與三世諸佛如來境界平  等，即與三世諸佛如來功德平等，得如來一  身、無量身究竟平等真實智慧。纔發心時，  即為十方一切諸佛所共稱歎，即能說法  教化調伏一切世界所有眾生，即能震動  一切世界，即能光照一切世界，即能息滅一  切世界諸惡道苦，即能嚴淨一切國土，即  能於一切世界中示現成佛，即能令一切眾  生皆得歡喜，即能入一切法界性，即能持一  切佛種性，即能得一切佛智慧光明。此初發  心菩薩，不於三世少有所得。所謂：若諸佛，  若諸佛法；若菩薩，若菩薩法；若獨覺，若獨覺  法；若聲聞，若聲聞法；若世間，若世間法；若  出世間，若出世間法；若眾生，若眾生法。唯求  一切智；於諸法界，心無所著。」\n\n**80-021**（`p`·CJK 92）：\n\n> 爾時，佛神力   故，十方各一萬佛剎微塵數世界六種震動。  所謂：動、遍動、等遍動，起、遍起、等遍起，涌、  遍涌、等遍涌，震、遍震、等遍震，吼、遍吼、等  遍吼，擊、遍擊、等遍擊。雨眾天華、天香、天  末香、天華鬘、天衣、天寶、天莊嚴具，作天妓  樂，放天光明及天音聲。\n\n**80-022**（`p`·CJK 328）：\n\n> 是時，十方各過十佛  剎微塵數世界外，有萬佛剎微塵數佛，同  名：法慧，各現其身，在法慧菩薩前作如是言：  「善哉！善哉！法慧！汝於今者，能說此法；我等  十方各萬佛剎微塵數佛，亦說是法；一切諸  佛，悉如是說。汝說此法時，有萬佛剎微塵數  菩薩發菩提心。我等今者，悉授其記，於當來  世過千不可說無邊劫，同一劫中而得作  佛，出興於世，皆號：清淨心如來，所住世界各  各差別。我等悉當護持此法，令未來世一切  菩薩，未曾聞者皆悉得聞。如此娑婆世界四  天下須彌頂上說如是法，令諸眾生聞已受  化；如是十方百千億那由他無數、無量、無邊、  無等、不可數、不可稱、不可思、不可量、不可說，  盡法界、虛空界，諸世界中亦說此法教化眾  生。其說法者，同名：法慧；悉以佛神力故，世尊  本願力故，為欲顯示佛法故，為以智光普照  故，為欲開闡實義故，為令證得法性故，為  令眾會悉歡喜故，為欲開示佛法因故，為得  一切佛平等故，為了法界無有二故，說如是  法。」\n\n**80-023**（`p`·CJK 110）：\n\n> 爾時，法慧菩薩普觀盡虛空界十方國土一  切眾會，欲悉成就諸眾生故，欲悉淨治諸業  果報故，欲悉開顯清淨法界故，欲悉拔除雜   染根本故，欲悉增長廣大信解故，欲悉令知  無量眾生根故，欲悉令知三世法平等故，欲  悉令觀察涅槃界故，欲增長自清淨善根故；  承佛威力，即說頌言：\n\n**80-024**（`p`·CJK 4）：\n\n> 即說頌言：\n\n**80-025**（`lg`·CJK 3388）：\n\n>\n\n> 「為利世間發大心，其心普遍於十方，\n> 眾生國土三世法，佛及菩薩最勝海。\n> 究竟虛空等法界，所有一切諸世間，\n> 如諸佛法皆往詣，如是發心無退轉。\n> 慈念眾生無暫捨，離諸惱害普饒益，\n> 光明照世為所歸，十力護念難思議。\n> 十方國土悉趣入，一切色形皆示現，\n> 如佛福智廣無邊，隨順修因無所著。\n> 有剎仰住或傍覆，麁妙廣大無量種，\n> 菩薩一發最上心，悉能往詣皆無礙。\n> 菩薩勝行不可說，皆勤修習無所住，\n> 見一切佛常欣樂，普入於其深法海。\n> 哀愍五趣諸群生，令除垢穢普清淨，\n> 紹隆佛種不斷絕，摧滅魔宮無有餘。\n> 已住如來平等性，善修微妙方便道，\n> 於佛境界起信心，得佛灌頂心無著。\n> 兩足尊所念報恩，心如金剛不可沮，\n> 於佛所行能照了，自然修習菩提行。\n> 諸趣差別想無量，業果及心亦非一，\n> 乃至根性種種殊，一發大心悉明見。\n> 其心廣大等法界，無依無變如虛空，\n> 趣向佛智無所取，諦了實際離分別。\n> 知眾生心無生想，了達諸法無法想，\n> 雖普分別無分別，億那由剎皆往詣。\n> 無量諸佛妙法藏，隨順觀察悉能入，\n> 眾生根行靡不知，到如是處如世尊。\n> 清淨大願恒相應，樂供如來不退轉，\n> 人天見者無厭足，常為諸佛所護念。\n> 其心清淨無所依，雖觀深法而不取，\n> 如是思惟無量劫，於三世中無所著。\n> 其心堅固難制沮，趣佛菩提無障礙，\n> 志求妙道除蒙惑，周行法界不告勞。\n> 知語言法皆寂滅，但入真如絕異解，\n> 諸佛境界悉順觀，達於三世心無礙。\n> 菩薩始發廣大心，即能遍往十方剎，\n> 法門無量不可說，智光普照皆明了。\n> 大悲廣度最無比，慈心普遍等虛空，\n> 而於眾生不分別，如是清淨遊於世。\n> 十方眾生悉慰安，一切所作皆真實，\n> 恒以淨心不異語，常為諸佛共加護。\n> 過去所有皆憶念，未來一切悉分別，\n> 十方世界普入中，為度眾生令出離。\n> 菩薩具足妙智光，善了因緣無有疑，\n> 一切迷惑皆除斷，如是而遊於法界。\n> 魔王宮殿悉摧破，眾生翳膜咸除滅，\n> 離諸分別心不動，善了如來之境界。\n> 三世疑網悉已除，於如來所起淨信，\n> 以信得成不動智，智清淨故解真實。\n> 為令眾生得出離，盡於後際普饒益，\n> 長時勤苦心無厭，乃至地獄亦安受。\n> 福智無量皆具足，眾生根欲悉了知，\n> 及諸業行無不見，如其所樂為說法。\n> 了知一切空無我，慈念眾生恒不捨，\n> 以一大悲微妙音，普入世間而演說。\n> 放大光明種種色，普照眾生除黑闇，\n> 光中菩薩坐蓮華，為眾闡揚清淨法。\n> 於一毛端現眾剎，諸大菩薩皆充滿，\n> 眾會智慧各不同，悉能明了眾生心。\n> 十方世界不可說，一念周行無不盡，\n> 利益眾生供養佛，於諸佛所問深義。\n> 於諸如來作父想，為利眾生修覺行，\n> 智慧善巧通法藏，入深智處無所著。\n> 隨順思惟說法界，經無量劫不可盡，\n> 智雖善入無處所，無有疲厭無所著。\n> 三世諸佛家中生，證得如來妙法身，\n> 普為群生現眾色，譬如幻師無不作。\n> 或現始修殊勝行，或現初生及出家，\n> 或現樹下成菩提，或為眾生示涅槃。\n> 菩薩所住希有法，唯佛境界非二乘，\n> 身語意想皆已除，種種隨宜悉能現。\n> 菩薩所得諸佛法，眾生思惟發狂亂，\n> 智入實際心無礙，普現如來自在力。\n> 此於世間無與等，何況復增殊勝行，\n> 雖未具足一切智，已獲如來自在力。\n> 已住究竟一乘道，深入微妙最上法，\n> 善知眾生時非時，為利益故現神通。\n> 分身遍滿一切剎，放淨光明除世闇，\n> 譬如龍王起大雲，普雨妙雨悉充洽。\n> 觀察眾生如幻夢，以業力故常流轉，\n> 大悲哀愍咸救拔，為說無為淨法性。\n> 佛力無量此亦然，譬如虛空無有邊，\n> 為令眾生得解脫，億劫勤修而不倦。\n> 種種思惟妙功德，善修無上第一業，\n> 於諸勝行恒不捨，專念生成一切智。\n> 一身示現無量身，一切世界悉周遍，\n> 其心清淨無分別，一念難思力如是。\n> 於諸世間不分別，於一切法無妄想，\n> 雖觀諸法而不取，恒救眾生無所度。\n> 一切世間唯是想，於中種種各差別，\n> 知想境界險且深，為現神通而救脫。\n> 譬如幻師自在力，菩薩神變亦如是，\n> 身遍法界及虛空，隨眾生心靡不見。\n> 能所分別二俱離，雜染清淨無所取，\n> 若縛若解智悉忘，但願普與眾生樂。\n> 一切世間唯想力，以智而入心無畏，\n> 思惟諸法亦復然，三世推求不可得。\n> 能入過去畢前際，能入未來畢後際，\n> 能入現在一切處，常勤觀察無所有。\n> 隨順涅槃寂滅法，住於無諍無所依，\n> 心如實際無與等，專向菩提永不退。\n> 修諸勝行無退怯，安住菩提不動搖，\n> 佛及菩薩與世間，盡於法界皆明了。\n> 欲得最勝第一道，為一切智解脫王，\n> 應當速發菩提心，永盡諸漏利群生。\n> 趣向菩提心清淨，功德廣大不可說，\n> 為利眾生故稱述，汝等諸賢應善聽。\n> 無量世界盡為塵，一一塵中無量剎，\n> 其中諸佛皆無量，悉能明見無所取。\n> 善知眾生無生想，善知言語無語想，\n> 於諸世界心無礙，悉善了知無所著。\n> 其心廣大如虛空，於三世事悉明達，\n> 一切疑惑皆除滅，正觀佛法無所取。\n> 十方無量諸國土，一念往詣心無著，\n> 了達世間眾苦法，悉住無生真實際。\n> 無量難思諸佛所，悉往彼會而覲謁，\n> 常為上首問如來，菩薩所修諸願行。\n> 心常憶念十方佛，而無所依無所取，\n> 恒勸眾生種善根，莊嚴國土令清淨。\n> 一切眾生三有處，以無礙眼咸觀察，\n> 所有習性諸根解，無量無邊悉明見。\n> 眾生心樂悉了知，如是隨宜為說法，\n> 於諸染淨皆通達，令彼修治入於道。\n> 無量無數諸三昧，菩薩一念皆能入，\n> 於中想智及所緣，悉善了知得自在。\n> 菩薩獲此廣大智，疾向菩提無所礙，\n> 為欲利益諸群生，處處宣揚大人法。\n> 善知世間長短劫，一月半月及晝夜，\n> 國土各別性平等，常勤觀察不放逸。\n> 普詣十方諸世界，而於方處無所取，\n> 嚴淨國土悉無餘，亦不曾生淨分別。\n> 眾生是處若非處，及以諸業感報別，\n> 隨順思惟入佛力，於此一切悉了知。\n> 一切世間種種性，種種所行住三有，\n> 利根及與中下根，如是一切咸觀察。\n> 淨與不淨種種解，勝劣及中悉明見，\n> 一切眾生至處行，三有相續皆能說。\n> 禪定解脫諸三昧，染淨因起各不同，\n> 及以先世苦樂殊，淨修佛力咸能見。\n> 眾生業惑續諸趣，斷此諸趣得寂滅，\n> 種種漏法永不生，并其習種悉了知。\n> 如來煩惱皆除盡，大智光明照於世，\n> 菩薩於佛十力中，雖未證得亦無疑。\n> 菩薩於一毛孔中，普現十方無量剎，\n> 或有雜染或清淨，種種業作皆能了。\n> 一微塵中無量剎，無量諸佛及佛子，\n> 諸剎各別無雜亂，如一一切悉明見。\n> 於一毛孔見十方，盡虛空界諸世間，\n> 無有一處空無佛，如是佛剎悉清淨。\n> 於毛孔中見佛剎，復見一切諸眾生，\n> 三世六趣各不同，晝夜月時有縛解。\n> 如是大智諸菩薩，專心趣向法王位，\n> 於佛所住順思惟，而獲無邊大歡喜。\n> 菩薩分身無量億，供養一切諸如來，\n> 神通變現勝無比，佛所行處皆能住。\n> 無量佛所皆鑽仰，所有法藏悉耽味，\n> 見佛聞法勤修行，如飲甘露心歡喜。\n> 已獲如來勝三昧，善入諸法智增長，\n> 信心不動如須彌，普作群生功德藏。\n> 慈心廣大遍眾生，悉願疾成一切智，\n> 而恒無著無依處，離諸煩惱得自在。\n> 哀愍眾生廣大智，普攝一切同於己，\n> 知空無相無真實，而行其心不懈退。\n> 菩薩發心功德量，億劫稱揚不可盡，\n> 以出一切諸如來，獨覺聲聞安樂故。\n> 十方國土諸眾生，皆悉施安無量劫，\n> 勸持五戒及十善，四禪四等諸定處，\n> 復於多劫施安樂，令斷諸惑成羅漢；\n> 彼諸福聚雖無量，不與發心功德比。\n> 又教億眾成緣覺，獲無諍行微妙道，\n> 以彼而校菩提心，算數譬諭無能及。\n> 一念能過塵數剎，如是經於無量劫，\n> 此諸剎數尚可量，發心功德不可知。\n> 過去未來及現在，所有劫數無邊量，\n> 此諸劫數猶可知，發心功德無能測。\n> 以菩提心遍十方，所有分別靡不知，\n> 一念三世悉明達，利益無量眾生故。\n> 十方世界諸眾生，欲解方便意所行，\n> 及以虛空際可測，發心功德難知量。\n> 菩薩志願等十方，慈心普洽諸群生，\n> 悉使修成佛功德，是故其力無邊際。\n> 眾生欲解心所樂，諸根方便行各別，\n> 於一念中悉了知，一切智智心同等。\n> 一切眾生諸惑業，三有相續無暫斷，\n> 此諸邊際尚可知，發心功德難思議。\n> 發心能離業煩惱，供養一切諸如來，\n> 業惑既離相續斷，普於三世得解脫。\n> 一念供養無邊佛，亦供無數諸眾生，\n> 悉以香華及妙鬘，寶幢幡蓋上衣服，\n> 美食珍座經行處，種種宮殿悉嚴好，\n> 毘盧遮那妙寶珠，如意摩尼發光耀。\n> 念念如是持供養，經無量劫不可說；\n> 其人福聚雖復多，不及發心功德大。\n> 所說種種眾譬諭，無有能及菩提心，\n> 以諸三世人中尊，皆從發心而得生。\n> 發心無礙無齊限，欲求其量不可得，\n> 一切智智誓必成，所有眾生皆永度。\n> 發心廣大等虛空，生諸功德同法界，\n> 所行普遍如無異，永離眾著佛平等。\n> 一切法門無不入，一切國土悉能往，\n> 一切智境咸通達，一切功德皆成就。\n> 一切能捨恒相續，淨諸戒品無所著，\n> 具足無上大功德，常勤精進不退轉。\n> 入深禪定恒思惟，廣大智慧共相應，\n> 此是菩薩最勝地，出生一切普賢道。\n> 三世一切諸如來，靡不護念初發心，\n> 悉以三昧陀羅尼，神通變化共莊嚴。\n> 十方眾生無有量，世界虛空亦如是，\n> 發心無量過於彼，是故能生一切佛。\n> 菩提心是十力本，亦為四辯無畏本，\n> 十八不共亦復然，莫不皆從發心得。\n> 諸佛色相莊嚴身，及以平等妙法身，\n> 智慧無著所應供，悉以發心而得有。\n> 一切獨覺聲聞乘，色界諸禪三昧樂，\n> 及無色界諸三昧，悉以發心作其本。\n> 一切人天自在樂，及以諸趣種種樂，\n> 進定根力等眾樂，靡不皆由初發心。\n> 以因發起廣大心，則能修行六種度，\n> 勸諸眾生行正行，於三界中受安樂。\n> 住佛無礙實義智，所有妙業咸開闡，\n> 能令無量諸眾生，悉斷惑業向涅槃。\n> 智慧光明如淨日，眾行具足猶滿月，\n> 功德常盈譬巨海，無垢無礙同虛空。\n> 普發無邊功德願，悉與一切眾生樂，\n> 盡未來際依願行，常勤修習度眾生。\n> 無量大願難思議，願令眾生悉清淨，\n> 空無相願無依處，以願力故皆明顯。\n> 了法自性如虛空，一切寂滅悉平等，\n> 法門無數不可說，為眾生說無所著。\n> 十方世界諸如來，悉共讚歎初發心，\n> 此心無量德所嚴，能到彼岸同於佛。\n> 如眾生數爾許劫，說其功德不可盡，\n> 以住如來廣大家，三界諸法無能諭。\n> 欲知一切諸佛法，宜應速發菩提心，\n> 此心功德中最勝，必得如來無礙智。\n> 眾生心行可數知，國土微塵亦復然，\n> 虛空邊際乍可量，發心功德無能測。\n> 出生三世一切佛，成就世間一切樂，\n> 增長一切勝功德，永斷一切諸疑惑。\n> 開示一切妙境界，盡除一切諸障礙，\n> 成就一切清淨剎，出生一切如來智。\n> 欲見十方一切佛，欲施無盡功德藏，\n> 欲滅眾生諸苦惱，宜應速發菩提心。」\n>\n\n**80-026**（`byline`·CJK 12）：\n\n> 于闐國三藏實叉難陀奉 制譯\n\n---\n\n## 三、旁参与前接\n\n### 3.1 前接·第十六品《梵行品》\n\n本品紧承第十六品。第十六品末句「初發心時即得阿耨多羅三藐三菩提」为本品开宗——澄观来意明言：「又前品末云初發心時便成正覺，未知此心有何功用，頓得爾耶，今釋此義故次來也」（T1735）。梵行以离相明「位中之行」，本品以校量显「位中之德」。\n\n### 3.2 后接·第十八品《明法品》\n\n本品广叹发心功德既毕，第十八品《明法品》结会归劝、广列十佛名号，为第三会之别行缘起。\n\n### 3.3 旁参\n\n- 《梵行品》末「初發心時即得阿耨多羅三藐三菩提」——本品宗纲之直接前语；\n- 《贤首品》（第十二品）「信为道元功德母」——发心功德与信位之极相呼应；\n- 《起信论》——慧苑《刊定记》引「發心有三種：一信成就、二解行、三證」，判本品当「解行发心」（X0221）。\n\n---\n\n## 四、义理要点与名相\n\n### 4.1 叹深难说·十难与「承佛威神」\n\n法慧先叹「此義甚深」列**十难**（难说、难知、难分别、难信解、难证、难行、难通达、难思惟、难度量、难趣入），非谓不可说，乃「法體深廣去疑令樂故。下寄言顯說未盡其源故」（澄观·T1735）。十难中前四「能所對辨」（离言、无相、非自力辩、非劣慧），后六「通能所证」，「後後劣於前前，巧顯深也」。\n\n### 4.2 十一大喻·层层转胜\n\n校量以**十一喻**（利乐众生、速疾步刹、知劫成坏、善知胜解、善知诸根、善知欲乐、善知方便、善知他心、善知业相、善知烦恼、供佛及生）递进，澄观判「後後過於前前，故皆捨置前前更舉後後」。每喻具四句（举喻·征问·领答·校量），一一喻内「皆有十重」。所校量者，是有分限之数；能校量之发心功德，则「無有能得知其際者」——喻有分限，法无限耳。\n\n### 4.3 发心即与三世诸佛平等\n\n本品极则之句：「纔發心時，即為十方一切諸佛所共稱歎……應知此人即與三世諸佛同等，即與三世諸佛如來境界平等，即與三世諸佛如來功德平等，得如來一身無量身究竟平等真實智慧」（80-020）。澄观判「初心具後之德，唯慧境故」——初发心即摄后位一切功德，非因果混滥，乃「发心毕竟二不别」之性起圆义。\n\n### 4.5 名相表\n\n| 名相 | 训释 | 出处 |\n|---|---|---|\n| 初发心（prathama-citta-utpāda） | 三种发心之初·十住之初发 | 品题·T1735 |\n| 解行发心 | 三发心之一（信成就·解行·证） | X0221 引《起信论》 |\n| 十一大喻 | 利乐众生乃至供佛及生·层层转胜 | T1735·80-004–80-020 |\n| 阿僧祇（asamkhyeya） | 无央数·校量数基 | 80-004 |\n| 那由他（nayuta） | 由数·亿 | 80-006 |\n| 歌羅分 | 竖析·人身上毛·百分（十六分）之一 | T1735 释 |\n| 優波尼沙陀（upanīṣad） | 近少·少许相近比类之分·极微细位 | T1735 释 |\n| 六种震动 | 动·遍动·等遍动……击·遍击·等遍击 | 80-021 |\n| 清淨心如來 | 万佛授记当来同号 | 80-022 |\n| 一百二十一颂 | 重颂三段（八十二·三十四·五） | T1735 科·80-025 |\n\n### 4.6 小结\n\n本品以「德」立教：叹深显难、校量显广、就法显宗、动地证通、他方证成、重颂结劝——**发心之德，喻有尽而法无边**〔本文判断〕。\n\n---\n\n## 五、注疏选要（诸家会读）\n\n### 5.1 澄观《大方广佛华严经疏》（T1735）——「初發心功德品第十七」段\n\n澄观本品疏窗 nsh @239289–249476·长 **10,187**（raw 口径·本疏于 CBETA 档中标卷第十九–二十），科承**四门**：来意·释名·宗趣·释文。其中「释文」正判**七分**（天王请说·叹深难说·约喻校量·就法略示·动地兴供·他方证成·以偈重颂）。\n\n澄观疏窗口 T1735·NFKD 坐标 @239289-249476·raw len=10187·科判四门（来意·释名·宗趣·释文），释文正判**七分**（天王请说·叹深难说·约喻校量·就法略示·动地兴供·他方证成·以偈重颂）。\n\n以下按疏文自然段 60 字标尺分段照录，保留 CBETA 繁体原字形：\n\n> 初發心功德品第十七\n初來意者。謂前二品明位及行。今顯勝德。舉初況後巧顯深勝。故次\n來也。又前品末云初發心時便成正覺。未知\n> 此心有何功用。頓得爾\n耶。今釋此義故次來也。二釋名者。初有二義。一三種發心之初。二\n十住之初發。亦二義。一發起上求。二三\n> 德開發。能知三世佛智故。\n永斷一切疑網故。得如來一身無量身等故。在於信位久已研窮。至此\n位中豁然開悟。故得功齊果位攝德無\n> 邊。受斯稱矣。三宗趣者。即以\n初心攝德為宗。令物窮究發心為趣。然住會發心。定是信成就攝。解\n行及證自在後文。生如來家。自\n> 約解說。不應謂此便是證收。若謂久\n習無明云何頓成大智者。豈不聞冥室千年之闇一燈倏忽頓除耶。若謂\n云何能知三世佛法者豈不聞\n> 具縛凡夫。能知如來祕密藏耶。餘義至文\n當釋。夫機差教別聖旨深玄。並未證真如同居學地。共詳聖智誠曰才\n難。且以淺為深有符理\n> 之得。以深為淺有謗法之愆。以遠為近則有益\n於行人。以近為遠則法非我分。諸佛說教貴在俯就物機。後輩學人若\n欲高推聖境。儻失大利豈不傷哉。且夕釣磻谿朝升台輔。豈與夫明經\n常選。而語其優劣者哉。況纔生王宮貴極臣佐。寧\n> 同百戰夷項備歷艱\n辛。況十千劫之功高。亦非聊爾人耳。是以語其智等虛空而非類。論\n其德碎塵剎而難量。極念劫之圓融。盡法門之\n> 重現。初心契於智海。\n豈有邊涯。猶微滴入於天池齊無終始。故經云。發心畢竟二不別。如\n是二心先心難。法慧仰推良在此也。如或\n> 未喻勝鬘有文。推佛能知。\n斯言無過餘如賢首品。次正釋文長分為七。一天王請說分。二歎深難\n說分。三約喻校量分。四就法略示分\n> 。五動地興供分。六他方證成\n分。七以偈重頌分。又釋於中分二。初長行。後偈頌。前中亦二。初\n此界後結通。前中亦二。初正說。\n> 後證成。前中亦二。先問後答。今\n依前辨。初中天帝問者。在彼宮故。聞前速成生疑念故。菩提心是萬\n行主故。問法慧者。是會主故\n> 。初心具後之德。唯慧境故。下正顯問\n端。雖則正問功德下。法慧答功德之量。便顯發心之相。是為菩薩善\n巧辯才。第二法慧菩薩言\n> 下。歎深難說。所以歎者。法體深廣去疑令\n樂故。下寄言顯說未盡其源故。於中初句總。言甚深者。謂約時深徹\n後際。約德深至佛果\n> 。約理深同法界。約行深包萬行。並深中之極故\n云甚深。又數廣難量理玄叵測。雖深非甚。今即少而多即事而理。初\n心具後是謂甚深\n> 。下十句別由斯十義。故曰甚深。於中初四能所對\n辨。各前能後所。一離言故難宣示。二無相故超心\n> 識。三非自力辯能\n分別。四非劣慧能信解。後六通能所證。五非有所得及一慧能證。六\n非起行及一行能行。七次第修慧不能通達。八\n> 九思慧不能思惟籌度。\n十聞慧不能信向趣入。此六後後劣於前前。巧顯深也。所以廣說難\n者。非唯成上甚深。正誡今後令信。第三雖\n> 然下。約喻校量分於中\n二。初結前生後。謂約自力則甚深。承力則可說。二佛子下。正顯校\n量中有十一大喻。一利樂眾生喻。二速疾\n> 步剎喻。三知劫成壞喻。四\n善知勝解喻。五善知諸根喻。六善知欲樂喻。七善知方便喻。八善知\n他心喻。九善知業相喻。十善知煩惱\n> 喻。十一供佛及生喻。然此十一\n喻。後後過於前前故皆捨置前前更舉後後。巧顯深勝。又此諸喻合有\n通別。通但通合發心德廣。謂如\n> 初喻中便合云。為悉知一切世界成壞\n等。此不同於喻也。別謂所合同喻。但喻有分限。法無限耳。如初喻\n合云。不但為以一切樂具供\n> 養十方等。初一具通具別。下十略無通\n合。此諸喻文皆應有四。一舉喻二徵問。三領答四校量。初後具四。\n中九略無中二。又諸喻內\n> 一一皆有十重。皆應舉喻問答校量。文無者\n略。今初。喻十重中。初一廣說。後九略明。初中有四。一舉廣事。\n二徵問三答顯廣。四\n> 辨超過。今初有三。先與現世益。文有三廣為供\n具田時。次然後下。與後世樂。後南西下。類餘九方。二徵問。三答\n廣並可知。四超過中云歌羅者。此云豎析。人身上毛。為百分中之一\n分也。或曰。十六分中之一分義。譯為校量分。\n> 優波尼沙陀者。此云\n近少。謂少許相近比類之分也。百千後即云億分者。中等數也。後九\n略說中文四同前。今初併舉九事樂具皆同。\n> 一切所經劫數漸漸增多。\n其所教法轉轉增勝。據初世界亦合漸增。以此十前文標一故。餘無者\n略。若十方共十則界不增。第四校量中\n> 三。初辨超過。二何以故者\n徵。徵意云前。云功德除佛難知。何以比此猶少非類。三釋意有二。\n一別翻前喻。謂發心無限前有限故。\n> 亦是反釋。二為令如來種性不斷\n下。通對前十總顯具德。亦是順釋。於中有十二句。初三總相對前辨\n勝。一翻前小果。二翻前限處。\n> 三翻前有限眾生。下九句即下十喻之\n本。一即第三知劫成壞喻本。二即第四善知勝解喻本。故下文云。乃\n至垢解淨解等。三却是第二\n> 速疾步剎喻本。四即第六及第十本。五即\n第九本。六即五七本。七八皆第八喻本。九知佛境界平等。即第十一\n供佛喻本。此中九句即\n> 佛。十力智。一知成壞垢淨自性。即業報智。\n心樂即種種解智。知煩惱即漏盡智。生死即天眼智。諸根即根勝劣\n智。方便即禪解脫三\n> 昧智。此及佛境並是一切至處道智。心行即種種\n界智。三世智即宿命智。其處非處智以是總故。亦是前三總句中攝。\n然此所知皆約一\n> 切無齊限也。下文廣釋其相。第二佛子復置下。明速\n疾步剎喻。然次下。九喻文皆分四。初舉廣喻。\n> 二辨超過。三徵四\n釋。釋中皆先反釋後順釋。今初喻中前三可知。四釋中先反釋彰前不\n及。後為了知下順釋。辨此過前。於中十一句\n> 初句總。所謂下。別知\n世界相即相入無障礙義。前七正明即入。八一毛端下二對。釋上即入\n所由。略舉三門。初以法性融通門釋。謂\n> 一切世界差別性。與一毛端\n體性無二故。是故事隨性融。此彼相即事攬性起。彼此相入各有同體\n異體。準上思之。九一世界中出生一\n> 切世界者。此約緣起門釋。謂諸\n緣起更互相生。有其二義。一約體有體無體義。是故相即。二約用有\n力無力義。是故相入。亦有同體\n> 異體義。並準上思之。欲知一切世界\n無體性者。約無自性門。以大非定大故。能即小等。十總結。欲以一\n念盡知如是廣無邊際。重重\n> 即入無障礙事故。發菩提心。又此言知。\n偈中亦身往彼。第三佛子下。知劫成壞喻。文亦有四。初明喻廣大。\n舉成攝住舉壞兼空。二\n> 佛子下。對辨超過。三徵四釋。釋中亦二。先\n反釋後順釋。順中三。初總次所謂下別。三是名下。結能知智別中言\n平等者。通相即相\n> 入。就緣就性唯心等殊。皆無障礙故云平等。一長\n短者。如娑婆為短安樂為長。遞傳相望以為長短。二三及四文並可\n知。五量無量者\n> 。如勝蓮華界。劫更無有上。名為無量。已下皆有\n量。六有成壞則有盡。無成壞則無盡。標中但云成壞。從多分說。亦\n麁盡細不盡。七念劫相望。八劫非劫自有三義。一約未經增\n減\n。縱百\n千年名為非劫。若經增減成壞名劫。二如\n> 勝蓮華剎既不可校量。亦無\n劫數故名非劫。三推妄歸真劫入非劫。依真起妄非劫入劫。斯則前七\n事事無礙。此乃理事無礙。九一念速\n> 知兼總包無盡。以斯無限安可比\n前。三結能知智。即十通中。知盡未來際劫神通也。第四佛子下。善\n知勝解喻。文四同前。初舉廣喻\n> 。梵云阿地目多。此云勝解。謂於決\n定境印持為性。不可引轉為業。今譯存略耳。釋中亦先反後順。順中\n初總。後所謂下別。別中總\n> 有十三句。初有八句總相以辨。後有五句\n一一別明。前中又二。初三解。為得方便解智光。此光通因通果。於\n中一廣二深。約理等故\n> 。三即能知。後五句。為得佛十力中勝解智\n力。解一切法。初一約人。謂眾生海解故。次一約時及性。三約境明\n似不似。上皆明所知\n> 廣。四事事相即顯所知深。上皆所知後一能知。\n即得十力之一也。第二從欲悉知有上。下一一別明。上但云多。未識\n差別之相。今略\n> 示之。於中五句各是一義。初句三對。約佛菩薩相\n望。一妙覺無上餘皆有上。此約竪論。二約橫辨盡未盡。故三同位互\n望為等。高下\n> 位相望為不等。第二句有六對。約五乘凡聖相望差別。\n有依無依。約自性差別。託於根境及稱真故。二約淺深差別。甚深般\n若不共小\n> 乘故。三約境差別。佛解無邊餘未盡故。四約二諦。世諦差\n別勝義無差故。五巧拙差別。六漏無漏差\n> 別。第三句有四解。約佛乘\n說。一深故。二廣故。三無分量故。四契真如正位得果解故。事理無\n礙故。無二礙故。第四句三對。唯約\n> 眾生以辨差別。於中初能知方\n便。不礙空而知假故。後悉知下。明其所知。有三對六解。與惑相應\n名染。不相應名淨。廣略者。約境\n> 及作意差別。麁細者。約行相差\n別。委悉不委悉故。第五句三對。多約知聖教解。於中文二。先正\n明。二一切下。通結前文。初中深\n> 密者。開則深約方廣一乘。密謂密\n意。合則深即是密。以祕以妙即事而真故。二方便者。略有三種。一\n進趣方便。謂見道前方便道是\n> 。二施為方便。即第七波羅蜜。依實起\n權皆善巧故。實無此事假施設有故。三集成方便。諸法同體巧相集\n成。如六相巧成可名方便。\n> 今並能解。言分別者。凡於一法多門決擇\n故。言自然者。法爾本覺內熏發故。隨因所起者。過去聞熏之所發\n故。或於現在正思惟等而\n> 能知故。言隨緣所起者。謂得善友增上緣\n力。所開悟故。二一切下總結。廣多交絡故如網也。為此無限而起大\n心。豈同前喻。第五知\n> 根智。第六知欲樂。欲謂於所樂境希望為性。\n勤依為業。即勝解智所攝。會釋如前。第七知方便者。即禪善巧及至\n處道智方便三種。\n> 如向所辨所望別故。無相濫失。第八知心義兼王\n所。即他心智。第九知業即業報智。上皆文四。同前可知。辨其名\n體。具如初會十力章中。廣顯差別如第九地。第十佛子復置下。明知\n煩惱差別喻。文亦分四。前三可知。第四釋中亦先\n> 反後順。順中初總\n後所謂下別。別有六門。各先惑後治。謂非但空知。意在斷故。初門\n總明後一義兼總別。中間四門別舉其重。今初\n> 門中輕重眠起。通下諸\n惑故名為總。就中輕重總中之總。以品言之。一切煩惱各有輕重。約\n起惑者。心有異故。據難易斷現行為輕。\n> 種子為重。即眠起是。又分\n別為輕俱生為重。若據破壞三寶焚燒善根。則邪見最重餘悉名輕。若\n據損惱自他障菩薩道。瞋恚最重餘悉\n> 名輕。若據發潤生死流轉。無明\n愛取為重。若依為諸惑根。則三毒為重。若依障初聖道不受聖教。見\n慢為重。若據遠隨現行障無學道\n> 。我愛慢為重。餘可名輕若煩惱當體\n相望。十大煩惱為重。隨惑為輕。隨煩惱中大中小隨。展轉輕重。又\n正使為重習氣為輕。更有異\n> 門可略言也。言眠起者。眠即種子眠伏藏\n識。起即對境發起現行。言一一眾生無量煩惱。總結多端。種種差別\n如後略說。廣唯佛知。\n> 種種覺觀通能所治。有染淨故。染為所治。煩\n惱依故。如欲恚害覺。能生貪等無量煩惱。涅槃加五說有八覺。一欲\n覺。求可意事。二\n> 瞋覺。念欲瞋他。三惱覺。念欲惱他。四親里覺。\n憶念親緣。五國土覺。念世安危。六不死覺。積財資養。七族姓覺。\n念族高下。八\n> 輕侮覺。侮即是慢。念自恃欺人。此等非一故云種種。\n皆能引起一切煩惱。對上一一眾生無量煩惱。\n> 亦名引起分別。言淨治\n者。欲以不淨觀治。瞋以慈治。惱害以悲治。次四以無常觀治。後一\n以無我我所觀治。故云種種覺觀淨治一切\n> 雜染。第二依流轉門。於所\n治中即癡愛發潤。斷一切下明治。由癡愛故。諸趣流轉。從癡有愛菩\n薩病生故。一切眾生三有五趣三結要\n> 當斷盡。一欲界諸愛別名欲結。\n二上二界愛合名有結。三三界無明名無明結。三結亦名三漏。即上癡\n愛斷已永盡生死流故。第三依病\n> 行門。四分分別。分是性義。各據偏\n多受貪等名。名為不等。三分俱多名為等分。然不出三。此三別名三\n不善根。故治中云斷根本也\n> 。第四依通諸識門。明我我所。謂第七識\n恒執第八為內我故。惑謂為我所染之起慢。故云我慢。通至第六。內\n執我身外執資具。恃己\n> 陵人。又此我者。亦兼法我。若盡此惑則諸惑\n皆盡。故治中云盡無餘也。第五約相生門。以利鈍分別先鈍後利。故\n淨名推身。以欲貪\n> 為本。欲貪以虛妄分別為本。虛妄分別以顛倒想為\n本。顛倒想以無住為本。今以無住非煩惱故略不言耳。而順明之。從\n顛倒虛妄分別\n> 生貪等惑。依貪等惑有諸隨惑。展轉相生。顛倒想者。\n不淨計淨等故。利中即身見為本。生六十二見。此有二說。一依三世\n五蘊。至\n> 下當明。二依異道邪見。具如瑜伽八十七說。第六約出家修\n行門。以障蓋分別。蓋謂五蓋。已見上文。障即二障。此亦總。結前\n<<\n諸惑不離二障。發大悲下。明能治道。謂救有障者。護修行者。此言\n在末。義兼總結。謂菩薩發心不自為\n> 己。但以大悲救護一切。令斷上\n來諸惑之網。斷之何。為令本智清淨。然能治道。雖復眾多不出二\n種。一通二別。別如上來隨分開示\n> 。如不能斷應宜轉治。謂如起貪以\n不淨觀治之。不去當起慈悲。緣於前境。應以淨法與之。云何出家無\n慈悲心。反更染污。如是隨便\n> 種種迴轉。皆以無得而為方便。所言通\n者。但當深觀第一義諦。謂當觀諸惑即是本覺菩提。故無行云。貪欲\n即是道。恚癡亦復然。如\n> 是三法中具一切佛法故。惑性智性皆本淨\n故。但由虛妄分別凡夫不了。如大富盲人動轉為寶所傷。二乘熱狂。\n謂為蟲蛇驚走遠避。權\n> 菩薩輩猶謂有之可斷。今乘一切智乘以淨慧\n眼。觀惑即真。則煩惱自虛智性常淨。是為開佛知見。使得清淨。不\n斷煩惱而入涅槃。有\n> 斯悲智。如是知斷發菩提心。豈與夫前喻同年而\n語哉。第十一明供佛及生喻文三。初舉喻校量。二徵。三釋。今初分\n二。前廣明一人\n> 。後略辨九人。初中有四。一舉廣喻。二問。三答。\n四校量顯勝。初中有二。初廣說東方。後南西下略例九方。初中又\n二。先明佛在\n> 供養。後至佛滅下明滅後供養。前中又二。先自行後又\n勸下化他。前中有四深勝。一供具廣妙。二供田廣勝。謂無數界悲敬\n田故。三\n> 供心勝恭敬等故。四供時勝。相續無數劫故。此自行已勝。\n況於教他。況復滅後況於餘方。餘並可知\n> 。後略辨九人中二。先舉廣\n喻。二佛子下校量顯勝前中九人展轉遞望。念敵多劫數量復增。此中\n如第一人一念以無數供。至第二人皆\n> 增至無量。乃至第十增至不可說\n不可說。皆積當位之念。以至當位極時也。後校量可知。二徵意云。\n其第十人供福。已至不可說不可\n> 說。全比容許不齊。何以不及少分。\n第三釋中分二。先反顯不為齊限。明前不及此。後為供養盡法界下順\n釋。以無限故辨此過。前略\n> 申十種。一時過。謂窮三際念劫重重時\n故。二處過。謂該十方相即入故。三供過。謂盡法界稱理之供故。四\n田過。謂盡虛空界塵毛等\n> 處。諸如來身各充法界故。五心過。謂一一\n念中。各以無盡供。供無盡佛。經無盡劫心猶不足故。六悲過。自作\n教他。以此善根唯為\n> 眾生令先成佛。我亦供養故。七智過。了達三\n事。隨其一一稱法界故。如海一滴。則具百川之味。芥子之空已無分\n限。八善巧過。能\n> 以一事為多攝多為一。善巧成就融攝諸位。真實行\n故。九所求過。唯為菩提不為餘趣故。十平等過。謂生佛自他供與不\n供。皆平等故\n> 。束上十義總不出三。一無齊限故。二稱法性故。三事\n事無礙故。無此三意設更重重廣喻。亦不及少分。第四發是心已下。\n就法略示\n> 分。前喻顯大心因廣。此明攝德深勝亦是讚勝勸學文中有\n二。一發是心已者。牒前諸喻所校量心。二能知下明此大心所攝功\n德。於中有五。一解行圓滿。二妙果當成。三與佛平等。四能作佛\n事。五大智現前。初中三。一總舉所知。現\n> 佛正覺但云智慧。過佛示\n滅故加涅槃。當佛在因云善根也。過現已從緣應可得云知。未來未有\n但可云信。亦信一切皆當佛也。二彼諸\n> 下攝以修證。有為能得無為能\n知。能證使智身成就法身等佛。古德判此一段。為攝位修成。謂於諸\n佛功德智慧能信是十信。信成就故\n> 。後攝初故。能受是十住。能修是\n十行。能知是十向。得證是十地。謂本智證後智。得能成就。是結因\n究竟。能與佛等是果滿。平等\n> 謂與諸佛能證所證平等無二故。初心即\n攝諸位。乃至佛果亦是一理。三徵釋所以。何以初心即滿因位。釋意\n云。以等真性所為無齊限\n> 故。有十一句。初總餘別。文並同前初喻中\n辨。第二以發心故下。妙果當成分二。初標因得果。二徵釋所由。今\n初得於八事。一解契\n> 佛心故為憶念。二入正定聚故當得菩提。三真器\n已成故佛授妙法。妙法者即如來知見也。四知心性故與佛平等。五圓\n修助道六度四攝\n> 。六力等未證亦定無疑。故云成就。七十八不共修習\n莊嚴。八得四無礙辨名說法智慧。上七皆言三世明其豎該。今云法\n界。辨其橫攝\n> 。前後影略。二徵釋所由中。初徵意云何以發心即得果\n法。釋云。以是發心為因。決定當得佛故。望圓極之果故定當成。約\n見性成智\n> 身。上品云即得故。晉經梵本。此中皆云即是佛故者。當此\n義也。第三應知下與佛平等者。見性均故\n> 。發心畢竟二不別也。文有\n四句。初總餘別。總言等佛何所等耶。有三種等。一所緣境界。及分\n齊境界等。二大悲大定力無畏等。皆\n> 悉平等。三得知身無從。亦無積\n聚。隨物分別見種種身。如是智慧與佛平等。第四纔發心時下。能作\n佛事有十一句。皆是纔發即得。\n> 言即得者有二意故。一約法圓融。初\n心攝諸位故。通說諸位相攝。總有三類。一以行攝位。如十信中具一\n切位。賢首品說。二以位攝\n> 位。如十住滿即得成佛。如十住品。及法\n界品海幢比丘處說。其十行十向十地皆爾。各如自品說。三初心攝\n終。如十住初心即攝諸位\n> 。如此品說。並就因位滿說。如普賢作用大\n分同佛。猶未是佛。此中亦爾。二約見性齊故。說與佛等具諸佛法\n豎。論位次優劣非無。\n> 若爾此與歷別何異。請以喻顯。若彼虛室置之\n一燈。光周室內。加二加三乃至百千。各各重重遍於室內。雖同周遍\n不妨後後益。明初\n> 心等佛若彼一燈。妙覺等初同第百千。若器中盛\n燈。雖復百千共置一室。互不相見。歷別修行類同此也。依於此義\n故。初心即云振動\n> 光照一切世界。登地已上却說百剎千剎。如理思\n之。又即由此義廢高就下。十住之中即齊地故。第五此初發下明大智\n現前。此文二意\n> 。一別是一段。謂以無著大智求菩提故。二通釋上四\n段。謂由於一切無所著故。稱性圓融能成能攝一切功德文中分二。初\n正明無著。後釋其所由。前中初總所謂下別。謂從三世門見佛法僧非\n佛法僧。同三世攝。於中三位。初八清淨次\n> 四通染淨。後二唯染。後\n唯求下釋不著所由。文含多意。一云。唯為菩提故云求一切智。不餘\n趣向故於法界佛等無著。此雖有理不順\n> 今文。以佛及佛法豈非一切智\n耶。二云。求之於己不求佛等。求之於己尚未免求。今釋有二。一只\n為求一切智故。求而無著。以有所\n> 著非真求故。故淨名云。夫求法\n者。於一切法應無所求。了法無求順一切智。二者言求者不壞相也。\n不著者稱法性也。性相雙鑑。終\n> 日求而無所求。經云無所求中吾故求\n之矣。第五爾時下動地興供分。全同上文。第六是時十方下。十方證\n成分。望於上文有同有異。\n> 同義可知。異有三種即為三段。一佛現證\n成異前菩薩。二顯益證成前文所無。三結通無盡。前略此廣加說因\n故。今初也。先現身次讚\n> 說。後引已同。以初心攝德深廣恐難信受。\n故佛自證。二汝說此法時下顯益證成。益通二世。初益現在。後我等\n悉當護持已下。顯及\n> 當來。今初清淨心者。以聞菩提心見心性故。而\n經多劫者。然餘教說定三僧祇。此宗所明劫數不定。略有四類。一或\n展則無量。不可\n> 說不可說剎塵。如法界品說。二或千不可說。或減或\n增。如威光太子及此中說。三或一生二生。如善財童子兜率天子。四\n初心即得如\n> 前所說。所乘之法既自在圓融。能乘之人亦遲速不定。念\n劫融故。故彌勒云。一切菩薩無量劫修。善\n> 財一生皆得。起信則以若\n遲若速。皆為方便。此宗則以楷定為權。並有聖言無煩固執。不以長\n時而生退怯。不以速證而起輕心。若遲\n> 若疾誓要當剋。是佛意也。後\n益末世令信仰故。今之聞者。皆由佛力願深愧信行。三如此下結通無\n盡。是證佛結通非經家也。先明說\n> 遍。後其說法下示所說同。文中有\n三。一說人同。二說儀同。謂神力本願故。三說意同。為欲下是此文\n大旨。同前十住並顯可知。第\n> 七爾時下以偈重頌分。先辨偈意有十一\n句。初一後一是說偈儀。而離開者欲顯中九。皆承佛力該十方故。中\n九正明所謂。初總餘別。\n> 別中四對。一淨業顯理。二除惑開信。妄想\n分別為雜染根。三知病識藥。四觀果淨因。即由利他自業便淨。第二\n正顯偈辭。有一百二\n> 十一頌。文分三段。初八十二偈。超頌就法略\n示。二有三十四偈。却頌就喻校量。三有五偈結德勸讚令景慕發心。\n歎深難說遍於三段\n> 。又歎為長行偈頌之本。故略不頌之初中文亦分\n五。初有十七偈。頌第一解行圓滿。二菩薩始發下十七頌。超頌第四\n能作佛事。三菩\n> 薩所住下十八偈。却頌第三得佛平等。四趣向菩提下\n六偈半。頌第五大智現前。五恒勸眾生下。二十三偈半。頌第二妙果\n當成。文不\n> 次者。顯德無前後故。又長行明先同果體。後同果用。偈\n頌明用可在。今果明當得。大智通遍故。前後互明。初中文分為二。\n初一偈。頌前正明解行圓滿。然初句。是總舉發心為因。餘十六偈頌\n前徵釋。於中有七。初一偈頌充遍一切\n> 世界。二有二偈。頌為欲度脫\n一切世界眾生。三有一偈。頌知世界成壞。知者意在往化覲佛故四一\n偈半。頌為悉知一切眾生垢淨故。\n> 及一切世界三有清淨。知垢意在令\n淨故。五趣三有名左右耳。五紹隆下兩偈半。却頌為不斷如來種性\n故。初半摧邪顯正即紹隆義。次\n> 句示佛種之體性。次二句即起佛種\n緣。餘是種起之相。化化不絕是報佛恩。心如金剛是種性義。照佛所\n行修菩提行。則佛種不斷也。\n> 六五偈。頌知眾生心樂煩惱習氣下。四\n種發心。於中初偈。總明所知事。想是妄想即煩惱也。業即習氣果即\n死此生彼。心即心行根性\n> 即諸根。次二偈顯知之體相。皆即事入玄。\n次偈非唯知病亦識法藥。故如世尊。後偈非唯空知。行願相符能為實\n益。七有三偈。頌知\n> 一切眾生三世智。謂離三世障故。障有十種。一\n煩惱雜染障。二觸境迷倒障。三長時懈怠障。四取著因果障。五邪教\n邪師引轉障。六\n> 趣下乘障。七麁相現前障。八於遍趣行無堪能障。九\n隨言生解障。十不亡能所障。如次十句各一對治。末後二句總結通\n達。第二菩薩\n> 始發下有十七偈。頌上能作佛事。總分為十。初二偈。\n頌即能說法教化調伏一切眾生。以悲智相導故。二有一偈頌諸佛讚\n歎。歎必加\n> 故。三有一偈。頌即能振動一切世界。動入互舉。四菩薩\n具足下六偈。頌即能息滅一切諸惡道苦。於\n> 中具悲智之德。故能拔因\n果之苦。而無我人。五有一偈。頌即能光照一切世界。照世意在照諸\n眾生。六一偈。頌即能嚴淨一切國土。\n> 毛孔現剎即神通嚴也。七有一\n偈半。頌上即令一切眾生歡喜。供佛問法但為益物故。八一偈半。頌\n上即能入一切法界性。初半聞而通\n> 達。次半思而兼說。後半修而無\n著。九有半偈。依修而證。頌即能持一切佛種性也。十有一偈半。頌\n即能示現成佛。第三菩薩所住下\n> 十八偈。頌得佛平等。於中分四。初\n三偈半頌佛境界平等。初偈分齊境。次偈兼所證所緣境。後一偈半舉\n況顯勝。二善知下四偈半。\n> 頌功德平等。三有一偈。頌前文得如來一\n身無量身平等。四於諸下九偈。頌真實智慧。於中有四。初四頌。發\n離一切妄想廣大心。二\n> 有二頌。發窮三際廣大心。三有二頌。發順涅\n槃菩提廣大心。四一偈結勸可知。第四趣向菩提下六偈半。頌大智現\n前。於中初一結前\n> 生後。餘正頌大智現前。初偈於佛無著。次偈即若\n眾生若眾生法。次偈即若佛若佛法。次偈若世間若世間法。次偈若菩\n薩若菩薩法。\n> 二乘文略。後半偈頌上結文。念十方佛即求一切智。無\n依無取。即於諸法界心無所著。第五有二十三偈半。頌前妙果當成。\n於中有九\n> 。初三偈半頌常為一切諸佛護念。以具德故。二半偈。頌當\n得無上菩提。三半偈。頌與其妙法。大人法者八大人覺也。四有一\n偈。頌佛體平等。時處平等即佛體故。五有一偈。頌已修三世諸佛助\n道之法。六有六偈。頌成就三世諸佛力\n> 無所畏。廣十力之別名。略無\n畏之都號。於中五偈半別明十力。後半偈顯得分齊。七有五偈。頌已\n莊嚴三世諸佛不共佛法。三世間圓\n> 融不共權小故。八五偈。頌悉得諸\n佛說法智慧力。九一偈。結德無盡並屬初心。該前諸段大文第二十方\n國土下。三十四頌。頌前約喻\n> 校量。於中分二。先十四頌。正頌前喻\n可知。後二十偈。通釋諸喻不及所由。前雖略釋今此廣辨。又長行中\n多隨喻別明。今此總辨。\n> 亦總相頌前歎深難說。若將別配。則令難證\n等互有所局。於中分三。初半偈結前生後。次十七偈半正釋所由。後\n二偈結德無盡。就正\n> 釋中分三。初一偈標章。次十二偈半別釋。三四\n偈顯德圓滿。今初也。謂標出生無盡體相無限。二章二別釋中。初四\n偈釋無齊限。或\n> 一句是一義。後一偈半頌六度義。可以意得。後八偈\n半釋出生無盡。於中分三。初二偈半結前生後。以體無限故出生無盡\n也。次菩提\n> 心是下四偈。正顯出生為本。出生乃一義耳。後二偈略釋\n為本所由。由修六度為菩薩乘本。由勸正行為人天乘本。由闡妙業通\n為三乘\n> 涅槃之本。三四偈顯德圓滿。中初偈總顯。次二偈別顯願滿。\n後一偈別明智圓。第三二偈結德無盡可知。大文第三欲知下結勸發心\n於\n> 中三。初半偈正勸。次三偈半釋勸所由。總舉具足一切德故。後一\n偈結勸速發。\n大方廣佛華嚴經疏\n> 卷第十九\n大方廣佛華嚴經疏卷第二十\n唐清涼山大華嚴寺沙門澄觀撰\n\n### 5.2 法藏《探玄记》（T1733·六十品题〈發心菩薩功德品第十三〉）段\n\n法藏疏窗 @162219–170651·长 **8,432**。释名、来意三、分四段科。\n\n法藏窗口 T1733（六十品题〈發心菩薩功德品第十三〉）·NFKD @162219-170651·len=8432·释名·来意三·分四段科：\n\n> 發心菩薩功德品第十三\n初釋名者本覺內薰大心創起故云發心。行成位立名為菩薩。功超遠劫\n德廣塵沙故云功德。此明菩薩初發心\n> 之功德。是此所辨為簡二乘故云\n菩薩。簡終心故云初發。此明發心所攝功德。非辨發心之相故以題\n名。\n二來意者有三。一前住及梵明行位體。今顯其勝德故來也。二前品末\n初發心時便成正覺未知此心有何功德便能如此。為\n> 來釋此義故也。三\n前二品以法就機說令行位有分齊。今則以機就法顯德量無限。是故前\n二通同別二教。今則唯明別教為一乘玄妙\n> 故。下偈中以美言詞讚述故\n次來也。\n三宗趣者。辨初發心攝普賢德具因果分量與法界等。是其宗也。\n四釋文於此品中有說分為\n> 四分。初請。二說。三證。四頌。今說於中\n有二。初長行散說。後偈頌總攝。前中亦二。初此界後結通。前中亦\n二。初正說後證\n> 成。前中亦二。初問後答。\n答中三。初總歎甚深令生希欲。二校量顯勝生其淨信。三當相辨深令\n生正解。初問中天帝問者在天故\n> 顯功德自在故。法慧說者稱法之慧方\n窮功德之際。二說中二。初歎深令信。二雖然下正說令解。又釋前起\n其希欲後正授法理。又\n> 釋前顯體甚深後明用廣大。又釋前顯義大深後\n顯教大廣故也。前中初句總六句別。一自不能知。二他聞不信。三思\n惟不解。四言\n> 宣不明。五修慧不能通。六報生智不能分別。故甚深\n也。又釋一教量難知。二義深難信。三思惟難解。四應教難說。五欲\n證難通。六數極故難分別也。\n第二校量顯勝中總有十一段校量。一約益物校量喻。二約步剎校量\n喻。\n> 三算劫成壞喻。四善知欲樂喻。五善知諸根喻。六善知悕望喻。\n七善知方便喻。八善知他心意喻。九善知業相喻。十善知煩惱喻。\n> 十\n一供佛功德喻。論中攝以為六。初三為三。次五為一。次二為一。後\n一為一。故為六也。釋有三門。一對前六甚深。二約菩薩\n> 菩提心相\n似。三約治六障。初中有二。先校量顯勝。後何以故下釋勝所由。前\n中有十重為二。初一別說後九通說。初中有四。一\n> 舉廣事二正徵問。\n三答顯廣。四辨超過。初中亦有四廣。一所供廣謂僧祇眾生等。二供\n事廣謂一切樂具。三供時廣謂一劫等。四\n> 利益廣令修五戒等。下九中\n亦四。初併舉九事。於中亦具四廣。准初知之。但增多等為異。二問\n三答四超過並可知耳。二釋顯勝\n> 中二。初何以故正徵責。徵責有二\n意。一云如前所說功德甚多。何因比此而非類。故釋云。初發心菩薩\n不為齊限爾所等故非比也\n> 。二云初心菩薩有何勝德而超過前位。釋云\n悉欲不斷佛種等故。是故過前也。下諸文皆准之。二佛子下釋成。釋\n成中二。先明不\n> 為齊限事故發心。顯前四廣非為廣也。二欲不斷佛種\n下明為無齊限事故發心。是故顯此超過彼也。此中有十二句。初一位\n過。是總以菩提心是佛種菩薩恒起名不斷。又菩薩化眾生立如來種中\n不令取小果亦名不斷。不同前五戒\n> 也。餘句是別。一是心過。準下應\n云欲以慈悲心充滿十方界。翻前十僧祇界等。二行過。謂欲度一切眾\n生。翻前限局故云一切也\n> 。三知器相成壞過。是知所化處。謂知成壞\n差別。又知成即壞等。是佛一切智。是故廣也。四知器中眾生報類垢\n淨皆由業異。即\n> 是業力智也。五知前器體本淨是如理智也。六知所化\n生使習麁細是流盡智。謂知彼即空亦即成障等也。七是生死智通即天\n眼力也\n> 。八根力智。九他心智。十是三達智亦有宿命智。十一亦如理\n智。又此十一中。初二是大悲餘九是大智。智中第五及十一是佛地一\n>\n切智。餘是一切種智。並無分齊故是故超過也。\n第二步剎校量喻中亦二。先明喻所不及。後何以故下釋顯勝相。前中\n喻相有一\n> 百重。初十重別說。餘者總說。釋中二。先徵責。後釋成。\n釋成中亦二。先明不為齊限事故顯前不及後。悉為下明無齊限故顯此\n\n> 過前。此中亦十二句。初二約悲心。初總標。後別釋。謂欲令度得果\n故云為也。次十約智。為成自在智故。於中初一總知。次八別\n> 顯。後\n一結意。又初一平漫普遍知。次八重重即入無礙知。此中一大小相\n即。二多少相即。三廣狹。四一多。五相入。六染淨。\n> 七帝網。八相\n生。此八中有二義。謂相即相入。此二各有二。謂同體異體。此二復\n有二義。得\n> 成即入。一約緣起門。二約真性門。初中亦二義。一約\n體。有空有義故得相即。二約用。有有力無力義故得相入。約緣。有\n待不\n> 待義故有同異二門也。約性亦二義。一不壞緣故相入。二緣相盡\n故相即。並圓融無礙自在之義。準上思之。\n第三算劫校量喻。此\n> 中亦二。初明喻所不能及。後何以故下釋超過之\n相。初中亦二。先辨喻廣大。二對顯超過。前中初辨東方有十重倍倍\n可知。後類\n> 結九方亦各十也。二釋中先徵後釋。釋中二。初不為齊限\n知爾所等故是故過前也。後菩薩欲悉了知下明為知無齊限事故是故不\n可\n> 喻也。此中有十句。初一總知。次八別知。云何分別知耶。謂如是\n即入重重相攝自在無礙如是知耳。亦可初是平遍而知後重重即入\n> 無礙\n而知顯純熟之相。此八中。一長短相即者。長是大劫短是小劫。又娑\n婆界是短劫安樂界等是長劫。相即故無礙也。二一多相\n> 即。三約佛有\n無。如莊嚴劫及賢劫等。是有佛劫。如過星宿劫後有六萬二千劫。空\n過無有佛。以此二劫相即故也。四約佛多少者\n> 。如星宿劫中有八萬佛\n出。是一劫中無量佛也。如大通智勝佛出世時。梵王讚云或千劫等空\n過無有佛今始得見大通一佛。亦相即\n> 故云也。五異無異者。是純雜無\n礙。或過未名異現在名無異。過未入現現入過未故云也。六盡不\n> 盡\n者。是存滅無礙。如天人見劫盡此土常安穩等。七一念即無量劫。以\n積念成劫無別劫體故即念也。八有無相入者。推妄歸真。\n> 劫入無劫。\n依真起妄。無劫入劫。又初以事從理。後以理從事。故無礙也。結中\n初總結所知。後結其本誓。是故功德等於佛果故\n> 不可說也。\n第四知眾生欲樂校量中亦二。初明喻所不能及。十方各有十重。倍倍\n可知。後何以故下釋超過。於中初責勝所由。後\n> 釋勝所以。此中先不\n為齊限等明前不及。此後欲悉知下明過前之相。此中初一句是總。謂\n以如來一切眾生欲樂智力。知於眾生欲\n> 樂之海故云種種欲樂也。下別\n顯中有二。初約法別知。後一一眾生下約人通知。論名前為遍知後名\n微細知亦得。前是異相後是同\n> 相。前中有二十三句。一約眾生求心。\n別名無量欲。同期一果名即一欲。雖同期一果。然求行恒別故云不壞\n一切欲性。又以悕望\n> 之念無二。同是別境中欲數所攝。心法不殊故云\n即一。而所樂差別故云不壞等也。此約一眾生心前後欲樂多端而相即\n無礙耳。二\n> 樂欲繁多深廣如海。三異類眾生欲樂心海緣起無礙故相即\n也。又知一眾生善惡無記。一切眾生亦爾故云也。四於一眾生隨三際\n中\n> 。前後欲樂種種而知。一一眾生悲皆如是故云一切等也。五於中流\n類同者名相似。所樂異者名不\n> 相似。六約三乘欲別名一切。同歸一乘\n名即一欲。實即一乘名為一欲。權開三乘名一切欲。又約緣起無礙。\n通自他等位可知。七\n> 同佛果智。是十力中欲樂智力故也。八求三乘等\n名有上欲。求一乘名無上欲。九於所求處若是究竟名無餘欲。反上名\n有餘。十求\n> 理名等。求事名不等。十一託餘心所是有所依。獨起欲數\n名無所依。又依境起欲名有依。知境唯心心智無寄名無依。十二同求\n名\n> 共。異求名不共十三欲在因位名有邊。至佛果位名無邊。以惑障盡\n故。十四順理名善欲。違理名不善。十五隨流名世。返流名出。\n> 十六\n求佛智德名大智欲。十七求佛斷德名淨欲。十八過凡小位名勝欲。十\n九求成菩薩諸地證智波若之欲。又論中釋。大智欲在種\n> 性位。淨欲是\n見位勝是修位。無礙智是八地已上無功用位。二十在佛果位。大智無\n礙圓明解脫。二十一染而不染名清淨欲。不染\n> 而染名不清淨。又若離\n世名利名淨。求世名利名不淨。二十二多求名廣。少求名狹。又大悲\n救生名廣專求自脫名狹。二十三求深\n> 名細求淺為麁。下約人辨欲同相\n中。初舉十數列名有八。此是減數十也。一因生死苦逼遂樂涅槃。謂\n因苦念樂。如囚求脫。二於\n> 善惡事中。因聞思惟而生欲樂故名方便\n欲。三於可意事求名悕望欲。四得已不捨名味著欲。五由宿因種子生\n名隨因生。又從思想\n> 生。經云欲欲知汝本但從思想生。我今不思汝。\n汝還不得生。六外託境生名隨緣生。又為善惡發\n> 化引生亦名隨緣生。\n七無法不求名盡欲。又求涅槃盡滅亦名盡欲。八廣求諸法名一切欲。\n又求無邊菩提亦名一切欲。下總結中。\n> 欲網者有三義。一難脫義。如\n世羅網魚鳥難脫。由種種欲網生死難出。此約染欲。二澇漉義。如世\n網澇漉。謂起淨欲漉諸有情令\n> 出生死苦海。下文云。智慧王所說欲為\n諸法本。應起清淨欲志求無上道。此約淨欲。三隱映義。如帝網差\n別。染淨等欲交涉無礙\n> 重重相入故云網也。此約欲體。\n第五知根校量準例。亦應具顯為類同。故文中略辨。為求如來十力中\n種種諸根智力。\n第六悕望\n> 與前欲何別。通即是一。於中分別。欲據始故根前說之。悕\n望就終故根後說之。\n第七知方便者。造緣起行名方便。是發業方便故\n> 不同業。\n第八知心意者為求如來他心智故。前明心法此辨心體。\n第九知業者為求佛十力中業智力也。此上五門並略舉。類上欲門\n> 應\n知。\n第十知煩惱校量中二。先明喻所不能及。後釋顯勝相。勝相中先徵後\n釋。釋中先不為\n> 齊限知故顯此過前。後悉欲分別下為無齊限流盡智力\n故明前所不及也。此中初句總。所謂下別顯。有十八句。略作十門分\n別。初\n> 二句約輕重分別。謂率略心起名輕煩惱。慇厚心起名重煩惱。\n又微起易止名輕。麁起難息名重。又正使為重殘習為輕。又本煩惱為\n>\n重隨煩惱為輕。又隨中小隨輕。上中重。可知。二有二句。約使纏分\n別。使謂十使即五見及疑貪瞋癡慢。纏謂十纏即無慚無愧睡\n> 悔慳嫉掉\n眠忿及覆。地持瑜伽說八纏除忿覆。何故除者。為有論師說。忿覆是\n使性。謂忿是瞋使性。覆是貪使性。為貪他利覆藏\n> 已過。使纏何別\n者。雜心云。根本名使。津液為纏垢。急縛名纏。輕縛名垢。又此中\n結即是九結可知。三有二句。約因果分別。\n> 一一眾生無量煩惱是貪瞋\n癡等所起果。煩惱覺觀是煩惱因由彼而生故。涅槃經說有八種覺觀。\n故云種種。一欲覺求可意事。二瞋\n> 覺念欲瞋他。三惱覺念欲惱他。四\n親里覺憶念親緣。五國土覺念世安危。六不死覺積財資養。七族姓覺\n念族高下。八輕侮覺侮是\n> 慢念自恃欺人。四有二句。約本末分別。亦\n是癡愛分別。謂無明是無明住地。依無明起是恒沙上煩惱。愛是欲色\n有三愛。是有愛住地相應是與愛相應之煩惱也。謂因愛生憂等。五有\n四句。約三不善根分別可知。六有二句。地\n> 起分別。初句是五住起。\n後句是五住地也。七約利鈍分別。我我所是利。慢是鈍。八約相生次\n第分別。邪念虛妄是心想見三倒。\n> 生煩惱是從三倒生四倒。九約諸見\n本末分別。謂六十二見皆依身見生。以彼為本故。十有二句。約過患\n分別。蓋謂五蓋即貪瞋睡\n> 眠掉悔及疑。覆蓋行人不得禪智故名蓋也。\n障謂二障即煩惱所知。以所知障亦得名煩惱故。下結中以煩惱難脫通\n名惑網。由委細\n> 了知一切煩惱是一切種智。皆欲斷令永盡。是大慈悲\n也。\n第十一供養佛功德校量中二。初舉事校量明喻所不及。後何以故下釋\n\n> 顯超過。前中有十重。初一重別說餘九總說。前中四。初舉廣。二對\n問廣不。三答顯極廣。四校量顯勝。初中先舉東方後類餘九。\n> 前中有\n五。初一念見多佛多眾生。二自於多時。興多供。三勸前眾生同已\n供。四自起勝塔供。五勸他亦同起塔供。餘文可知。\n\n> 就釋顯超過中二。先徵後釋。徵問意云。且如東方一念即見無邊諸\n佛。以此念力經無量劫供。明佛等甚廣如東方餘亦爾。即顯極廣\n> 。如\n一人既爾更復勸他一切眾生亦如是。況復倍倍過前。至第十明此功德\n分限難知。因何比此\n> 發心功德。乃至於不可說分中不及其一故云何以\n故也。下釋中。先明不為齊限故顯前劣此。後欲悉下為無齊限故顯此\n過前。此中\n> 過相雖復無量。太略而言有六種。一處過。謂盡欲供養十\n方無盡法界虛空等無盡世界處佛故。此通帝網等處故不同前。二時\n過。\n> 謂盡三世佛即通九世十世等無盡重重時也。三佛過。謂盡佛境界\n所有諸佛皆供養故非但如前。四供過。謂盡法界中有自他色心理事\n> 行\n等並以供養。非但如前。五心過。謂於前無盡佛境一一佛所各以無盡\n供事各經無盡時供心猶不盡是故過也。六行過。謂了達能\n> 所三事平等\n圓融無礙故過也。問只可全比非等。豈可不可說分中不同一分耶。答\n此發心功德即同法界。不可分折故。縱不可說分\n> 中一分亦即遍法界。\n無問多少皆無比也。如常住僧穀米一斛亦遍十方僧乃至一合亦遍十方\n僧。以是不可分故。思之可知。\n第三\n> 當相顯深中二。先標後釋。初中發是心已者。牒前諸喻所校量之\n心。即是標發心字。得知下標辨功德甚深。於中初攝因盡故深。二\n> 等\n佛果故深。此中是發徹後際之菩提。心是窮盡佛境也。前中初舉所知\n境。謂知三世佛功德智慧。二成深行。謂信向是十信。受\n> 持是十住。\n修習是十行十迴。得證是初地已上。身證是十地滿已還。又內證為得\n證。相外彰故\n> 云身證。如小乘中以滅盡定為身證。此亦同也。又初是\n行證後位證。又初智相應後身相應。又可得證約因圓身證約果滿。二\n悉等\n> 諸佛功德者是等佛果故深也。二何以故下釋前二標。於中三。初\n釋因等。次釋果等。後結因分齊。初中先徵問。謂何以知初發心已\n> 即\n能證得三世諸佛大福智耶。下釋中二十句。顯謂同三世佛音所行路故\n云等也。於中初十一句外化德。後九句內自德。又前是悲\n> 德。後是智\n德。前中初一句是總。謂化眾生使發菩提心。紹繼佛種故云不斷也。\n後十句別顯。一起愍物心。二作救度意。三知所\n> 化住處。四知所化類\n別。謂善惡業起苦樂報故云垢淨起。亦是十力中業智力也。五起廣大\n意亦是令離業障。六知所化惑障輕重。\n> 亦是求流盡智力。亦是令斷煩\n惱障。七知輪轉相。亦是天眼智力。亦是令捨報障。八知根生熟。是\n起行所依即是諸根智力。九知\n> 心造修正明起行。亦是他心智力。十總\n結所知。亦是三達智力也。下九句求佛自利德中。初一是總餘八別。\n於中初二因果分別。\n> 初知菩提果。二知菩提因。謂淨法是也。次二理\n行分別。初知理法平等。二知智行清淨。次四體德分別。初三佛德。\n一十力。二\n> 無畏。三不共。後一佛體。謂實智平等故也。二釋果等\n中。先徵起後釋成。釋成中。初一句總。二別。三結。初中即是佛故\n者。\n> 有人釋。或云因中說果。或云解同佛境。或云約理平等。若約三\n乘教亦得如上說。今尋上下文。\n> 約一乘圓教始終相攝。圓融無礙。得\n始即是終。窮終方原始。一由陀羅尼門緣起相攝故。二由普賢菩提心\n遍該六位故。即因是果\n> 也。三由法性無始終故。發心入始即正是終故\n也。是故上文云初發心時便成正覺具足慧身不由他悟此之謂也。二別\n中有十五句。\n> 初五句約佛內德盈滿等。後十句約佛外化用普周等。初\n中一總四別。別中初二所依法等。一俗諦境。二真諦境。後二能依德\n等。\n> 一身。二智。二外用中初一總餘九別。別中初三化令出苦。一動\n令生信。二照令驚覺。三正令出苦。後五化令入法。一嚴化處。二\n> 現\n成佛。三現通令喜。四正令入法。五入法已護令不失。後一結外化\n智。又釋。此十五句中。初一總十四別。別中初五句是智正\n> 覺世間自\n在等。於中初二約法等。一所緣及分齊等。二理教等。下三三業等。\n謂所化約語業辨也。次四器世間自在等。於中。一\n> 動。二照。三除。\n四嚴。後五眾生世間自在等。一為現。二令欣。三授法。四護持。五\n得果。若不護恐墮二乘地故也。第三結因\n> 分齊中。不離三世之中三寶\n眾生染淨等法者。此有二義。一由菩薩得通三世之身。是故常遍三際\n無所不在故也。二由菩薩得即法\n> 界之身。竪含染淨橫遍三際故云不\n離。餘文可知第二顯實證成中二。先顯實中。一動地。二雨供。三振\n音。四放光。二證成中二\n> 。先現身證。後舉益證。前中何故佛自證\n者。以初發心即攝佛因果此事難信故佛自證。又表因果\n> 同性故。又表\n勝進之因果攝成故。二舉益中。舉彼一切世界之中法慧所說。既有此\n益。明知。此法決定不虛。亦以此說難信受故\n> 致此證也。由此心藏攝\n德圓淨故名淨心如來。上來此一世界中說竟。\n第二結通中二。先顯法普周無盡世界。後有十句。釋遍所由\n> 。謂何故\n此法遍於十方說處說人說法及證悉皆同耶。釋佛力等十句故也。一此\n舍那佛及一切佛各以現在威神之力同共加持故使然\n> 也。二諸佛本願之\n所攝持。三為欲顯示佛所得法。理數如此遍十方故。四明佛智光使普\n照故。五欲令解悟真理普遍故。六法界緣\n> 起相由法爾故須遍說。七為\n欣大法者示此稱性廣大之法令歡喜故。八佛德普周欲具讚故。九顯示\n十方一切諸佛同所得法。謂平等\n> 無差故也。十為令解知十方法界無二\n轍故。由是十義故說普遍所以說十。亦是式則顯無盡耳。上下諸文結\n通之義。並準此知之。\n> 上來此界他方總無盡世界一切處長行散說竟。\n第二大段偈頌總持中二。先序說意。後正重頌。初中十句。一以十方\n無盡世界同說\n> 此法故須觀也。二欲令十方一切眾海悉同聞故。三為顯\n自心如空無偏局故。四觀成就眾生之法門故。五觀稱法性雖淨如空而\n因果\n> 不失故也。六欲令離惑。七得一乘解脫。八了達根海。九會緣入\n實。十現自無盡發心功德令眾見\n> 已而修學故。就正頌中總有二百四十\n一頌半分四。初一百六十三頌半逆頌前第三段當相之文。二有二十九\n頌頌前第二喻校量文。\n> 三有三十九頌頌前最初略顯甚深文。四有十頌\n結歎顯勝。就初文中長分有二十七段。初六頌頌前欲令慈悲心充滿十\n方世界等文。\n> 二從欲悉分別知下七頌頌前欲悉知一切世界廣狹即入等\n文。此中並顯作用益生等。三從欲令諸佛種下三頌頌前欲不斷佛種故\n等文\n> 。四從信心不可沮下二頌頌前悉得諸佛智慧光明文。五從悉能分\n別知下二頌頌前欲知眾生種種業種種心種種根性等文。六菩提心無\n> 量\n下六頌頌前欲得法界等三世諸佛平等智慧文。七從清淨無量心下二頌\n頌前供養一切佛文。八於諸甚深法下八頌頌前得佛智慧因\n> 緣文。謂智\n慧所因即是甚深三昧及從真如境所生也。此中並顯通慧作用故也。九\n從具足大悲心下九頌頌前度脫一切眾生等文。十\n> 從世界若成壞下三頌\n頌前知世界成壞等文。謂此成壞唯佛智境。今信佛無疑故亦了知。十\n一從盡於未來際下五頌半頌前休息一切\n> 世界眾生諸惡道苦。十二從菩\n薩放大光。下七頌頌前悉能普照一切世界。此中兼辨所照剎中問佛說\n法。十三從明淨利智慧下四頌\n> 頌前與三世諸佛正法等文。十四從清淨\n妙法身下十一頌頌前悉於一切世界示現成佛等文。十五一身悉充滿下\n八頌頌前得佛智慧等\n> 平等文。十六從一切諸世界下八頌頌前得如來一\n身無量身等文。十七從其心無所染下十頌頌前亦\n> 與三世佛境界等文。\n此是分齊境界有十種齊等。一離染等。二救生等。三智慧等。四相好\n等。五所知等。六證理等。七深定等。\n> 八行堅等。九心安等。十充滿\n等。十八從欲求道師慧下二頌舉德勸修。十九從菩薩摩訶薩下四頌顯\n說分齊。上二不頌前文。二十\n> 從善分別眾生下六頌頌前得三世諸佛智\n慧光明。謂照俗境常在真故。二十一從無量不可數下四頌頌前悉能嚴\n淨一切世界文。二十\n> 二從慧眼無障礙下八頌頌前與諸佛所化眾生皆悉\n同等。二十三悉能分別下四頌頌前知劫長短相即相入等文。二十四成\n就智慧力下\n> 十二頌通頌前初心所得佛十力智。二十五從一一毛孔中下\n九頌頌前悉能震動無量世界。謂入帝網等。二十六如是深法門下七頌\n頌\n> 前悉欲長養諸佛智慧文。二十七從菩薩摩訶薩下六頌頌前菩薩不離\n諸佛菩薩及二乘眾生等文。上來至此總是逆頌第三段。當相辨文\n> 竟。\n自下第二。有二十九頌頌前第二約喻校量文。於中初六頌頌第一益生\n喻。二從無量無有邊下二頌頌前第二步剎喻。三從去來\n> 現在劫下有四\n頌頌前第三算劫喻。四十方世界中下六偈頌前欲等五喻。謂一欲二悕\n望三根四方便五心法合可知。五一切眾生類下\n> 四頌頌前第九第十知業\n煩惱二喻。六十方諸世界下七頌頌前第十一供養諸佛。上來第二大段\n喻校量竟。第三三世人中尊下有三十\n> 九頌。頌前第一標歎顯深文。於\n中分七。初有七頌頌前最初總句甚深之文。謂深徹佛果故。深超\n> 群有\n故。深同法性故。深用普遍故。深智遠知故。並如文可知。二常修妙\n下有七頌頌前第二難知甚深。於中初四句深廣難知。次\n> 二佛以深德加\n持難知。後一結德難知。謂德如虛空非算能知故名難知也。三初發菩\n提心下五頌頌前難信甚深。謂以初發心即成佛\n> 果無邊功德此難信受故\n也四一切辟支佛下八頌頌前難解甚深。謂令二乘三界所得安樂。乃在\n菩薩初發心中。此事難解。是故文中\n> 。初四頌標二位得樂。各二頌。\n後四釋彼二位得樂所由。亦各二頌可知。五無量智慧明下五頌頌前難\n說甚深。謂智深德廣業用數\n> 多言說難及故云稱讚不可盡也。六普觀一\n切法下四頌頌前難通甚深。謂心住平等為眾說法。二位相違令極相\n順。甚難通會故也。\n> 七無量妙功德下三頌頌前難分別甚深。謂此初心\n同佛位際限難分故也。第四大段欲得一切佛下十頌結歎勸修。初二舉\n德勸修。次\n> 二顯德深廣。次四顯德用勝能。後二勸學究竟。\n\n### 5.3 慧苑《续华严略疏刊定记》（X0221）段\n\n慧苑疏窗 @185641–195786·长 **10,145**。四门同前·释名（梵本「功德藏品」·三发心·引《起信论》·增上脩诸行）。\n\n慧苑窗口 X0221·@185641-195786·len=10145·四门同前·梵本「初發心菩薩功德藏品」·三发心（引《起信论》）·增上脩诸行：\n\n> 初發心功德品第十七\n將釋此品。四門同前。\n初釋名中二。先得名。後釋名。前中。按梵本。名初發心菩薩功德藏\n品。初者十住\n> 中第一住故。發心者。起三種心。增上脩諸行故。此即\n三發心中解行發心也。起信云。發心有三種。一信成就。二解行。三\n證。\n> 解行發心者。當知轉勝。以是菩薩從初正信\n已\n來於第一阿僧祇劫\n將欲滿故。於真如法中。深解現前。所脩離相。乃至廣說。順\n> 法性。\n脩諸波羅蜜。餘二發心。具說如彼。菩薩者。約位以顯人故。功德\n者。約人以顯德故。即此脩行力用圓滿饒益。\n己\n得\n> 在\n己\n故。藏者謂此\n菩薩。初發心中。蘊積無邊勝功德故。\n後釋名者。初住之發心。依主釋\n> 。以此發心通三賢故。初發心之菩\n薩。初發心菩薩之功德初發心菩薩功德之藏。皆依主釋。\n二來意中二義。一由前二品。明住自\n> 分勝進行。今此顯彼行之功德故\n來也。二由前品末云。初發心時。即得阿耨菩提。彼中雖有言。未釋\n其義。今此解彼。是故來也\n> 。\n三宗趣者。以辨初發心具攝普真法界因果為宗。令種性菩薩皆增勇銳\n為趣。\n四釋文中二。初長行。後爾時法慧下偈頌。前中\n> 二。初明此界所說。\n後如此娑婆下結通十方。前中四。一請段分。二法慧菩薩下解釋分。\n三爾時佛神力下現瑞分。四是時十方下\n> 證成分。\n初中。何故天帝問者。在彼宮故。聞前所說。生疑念故。疑云。初心\n有幾功德。前說初心即得佛耶。\n第二解釋分中三\n> 。初歎所問深難。二雖然下法喻廣顯。三發是心\n已\n下\n直就法說。\n初中何不即辨。先且歎者\n> 。有二義故。一約說深玄理合先讚故。二欲\n令聞者用心異常故。文中十一句分二。初一總歎。言此義者。義謂境\n義。功德分量智\n> 所知故。甚深者。且理玄叵測。數廣難量。雖深非甚\n也。今乃即少而多。即事而理。深之至極。故曰甚深。後十句別難\n者。開總\n> 成別。皆帶總句。謂彼甚深功德之量。一非言說境故。二非\n生滅識所知故。三非妄想心能分別故。四非依次第門起信解境故。五\n\n> 非有所得境故。六非有無相行境故。七非有終極故。八非籌量境故。\n九非分量得故。十無路無門可趣可入故。或前總句為標。後別\n> 句為\n釋。釋是能成。標是所成。謂由十難顯甚深故。\n第二法喻廣顯中。先牒前起後。後佛子假使下正顯。前中。云雖然\n者。牒\n> 前十句雖依身力難說等也。我常下起後。謂承佛力可得說也。\n後正顯中有十一大喻。顯功德量。一供生及益喻。二者法多剎喻。三\n>\n知劫成壞喻。四者他勝解喻。五者他諸根喻。六知欲樂喻。七者他方\n便喻。八者他心行喻。九者他業行喻。十者他煩惱喻。十一\n> 知供佛功\n德喻。\n初中三。先校量顯勝。二何以故徵。三佛子一切下釋勝所由。初中有\n十重校\n> 量。初一廣說。餘九略顯。初中四。一舉廣事。二佛子於意下\n徵問。三天帝下答。四法慧下辨超過。初中有四事廣。一供具。謂一\n>\n切樂具。二供田。謂阿僧剎中眾生。三供時。謂一劫。四利益。謂令\n修五戒。後九略顯中。供及供田並同。云一切樂具十阿僧剎\n> 中眾生。\n而供及益各別。謂百劫千劫百千劫億劫百億劫千億百千億那由他億百\n千那由億劫。此中數劫。次百千後。即對億者。以\n> 百千為百萬為億\n故。此百百變數名也。下並准知。益謂十善四禪四無量四無色定四果\n辟支果。\n二釋勝所由中四。一問答顯多。\n> 二法慧下比少猶劣。三何以故徵。四\n佛子下釋。初二可知。三徵意云。如前功德。既唯佛能知。何因比此\n極少之分。猶非類耶。\n> 四釋中二。初反顯。謂不為齊限等故。後為令\n下順釋。謂為無限等故。前中明初心無限故所生德亦即無限。非如所\n喻供具等四皆\n> 有限也。後順釋中十二句。初句總。餘句別。總得初發\n心時。誓令眾生悉當成佛。佛種不斷。非只令得五戒乃至緣覺。別中\n一心\n> 廣往下頌應云為。以大慈光遍一切世界。翻前十阿僧祇世界故。\n二行廣。謂為廣一切等故。三為知處廣。謂得一種智。知十方剎幾\n> 成\n壞等。四為知所作廣。謂知眾生報類垢淨。五知剎實體或法性主。六\n為知眾生心樂欲異煩惱\n> 輕重習氣麤細。七為知眾生死生差別智。八為\n知眾生根生熟。九為知心令差別。十為知三世業報智。十一為知佛平\n等境。上十一\n> 句皆所為無限故超彼也。\n二佛子復置此喻下。明知行多剎喻。於中四。初顯喻廣大。二佛子此\n下辨菩薩超過。三何以故徵。四佛\n> 子下釋超所由。初中二。先東方十\n重。言且置者。置猶止也。下皆准此。後南西下類通九方。總約百人\n所行世界。二辨超過中。\n> 可知。三徵意同前。四報中二。先反顯。謂\n非如彼有限故超也。後為了下順釋中十一句。初一總攝。後所謂下\n別。於中十句。初\n> 五及第七顯相即。謂麤妙覆仰小大廣狹一多淨穢。\n六一多相入。八微細多少剎體差別無差別。九一中出多多無性。十令\n知諸廣剎\n> 盡。問所云為欲了知諸剎即入等者。云何了知。\n答准下頌中。往彼諸剎。今此但是了知諸剎故。喻中知彼能速行者。\n所往多剎菩\n> 薩。非但知彼有限一類有顯之剎。乃知盡知種種異剎。及\n知諸剎無碍之相。是故超彼。其無碍相體德位業用本修因。具如經。\n前\n> 顯義門訖。\n第三佛子復置下知劫成壞喻。於中四。初顯喻廣大。二菩薩初發心下\n明超過。三何\n> 以故徵。四菩薩下釋。初中三。一辨東方十人。二南方\n下類顯九方。三佛子此下總結百人。此雖略成壞。實亦該攝住空。釋\n四劫\n> 相。具如劫章。二超過可知。三徵意准前。四釋中二。初反顯初\n心不齊故。後為悉下順釋。前中可知。順釋中三。初總比所謂下列\n> 。\n後是名下釋前為欲知等之意。初中可知。問何故總中云為知世界成壞\n盡。而別中乃說諸劫長短等平等義及相入等無碍相邪。\n\n> 答前總中通標成壞劫。簡非成壞者。而別中所顯。還知論後壞劫平等\n義相入無碍相。若爾何故亦說無量無盡劫耶。\n釋曰。由為有\n> 量有盡相從說故。二別中九句。初長短。如下壽量品\n說。娑婆界內劫唯短矣。首剎中劫唯長。中間諸分內劫。上下遞望。\n亦長亦\n> 短。言平等者。有二義。一准十地論釋。長短等雖異。相入義\n齊故。云平等。二劫長短一多等俱以無性為性故。二一劫者。或長或\n>\n短。但取其一無數者。即是阿僧祇劫也。三有無佛者。謂如莊嚴劫賢\n劫星宿劫等。是有佛劫。從此\n已\n後六萬三千劫。空過無\n> 佛出。是無佛\n劫。四一多劫有多一佛者。如勝音剎。種種莊嚴劫有十須彌山塵數佛\n出。是一劫中有不可說佛。又如頌云。如來無\n> 量曠劫行。自然正覺出\n世間。於當來世無量劫。身應一切如大雲。是不可說劫中有一佛也。\n五\n> 量無量劫者。謂勝蓮華界\n已\n下諸剎內劫。皆可比上為其一。曰可據\n量故。有限量故。是有量劫也。然即彼勝蓮華世界內劫。更\n> 無有上可\n比。曰故無限量故。是無量劫也。六盡無盡劫者。謂諸成壞剎內劫。\n有盡時故。是有盡劫。彼勝蓮華界非成壞剎故。劫\n> 無有盡。是無盡\n劫。七念須劫可知。八劫非劫相入者。劫謂成壞中火等非劫。謂劫前\n時分。若依俱舍第十二說。百二十剎那為一\n> 怛剎那。六十怛剎那為一\n臘縛。三十臘縛為一牟呼栗多。三十牟呼栗多為一晝夜。三十晝夜為\n一月。十二月為年。年中分三際。\n> 謂寒熱雨。從此\n已\n後。未至成壞中\n大劫量\n已\n來。雖多時分。怛以年名之。謂百千年等。非以劫名之故。\n亦名非劫故。彼\n> 文云如是\n已\n辨剎那至年劫量不同。今次當辨。若准此\n經十定品說。始從剎那須臾晝夜六時一日五日半月一月一時一年乃至\n百\n> 千那由他億年。皆是非劫。從此\n已\n去方名為劫。廣說如彼第三定\n中。又下文第六十四中。毗目仙人執善財手。令自見身。於諸\n> 佛經歷\n年劫。大同前說。又有釋云法性為非劫者。慮恐難通。所以者何。若\n是法性。則不唯非劫。亦非色等一切法故。又亦不唯\n> 非非劫等。法性\n即是一切法故。若不爾者。法性與劫。如何相入。又應但顯理事無\n[得-彳]無相入義。非事事無[得-彳]業\n> 用門也。九念須知三世剎內劫成\n壞空中二。初發心所為事。後發阿耨下能為心。前中念須知廣。但顯\n別相。非總結前。猶是同前。於成壞劫。所欲知故。後能為心者。此\n語令遍前八句中略故。此顯前喻所明。但是知一類剎中\n> 一類劫。然是\n有限知有碍知。而初心菩薩誓欲知種種剎種種劫。皆無限量理事。理\n事體用無[得-彳]。是故超彼不可比也。三\n> 釋前為欲知言者。謂前總別\n句中。為欲知言比言應合句句安之。略故不具。此云是名初發心者。\n牒前也。大誓莊嚴者。釋為欲也\n> 。了知一切劫等者。了知智神通者。\n依通發慧而了知故。此同下第四知盡未來際劫智神通。第四佛子復置\n下明知他勝解喻。按此\n> 中梵本云阿地目多。阿地□也目多解也。譯家\n存略故但云解。文中四。初舉喻顯。二佛子此下明初心超過。三何以\n故徵可知。四\n> 佛子下釋。初中二。先舉東方十人。後南西下類通九\n方。前中二。先廣說二人。謂初人一知念類剎中眾生勝解。積如是\n念。次經\n> 無數劫眾生解。第二人無間知前無數劫所知積如是念後經無\n數劫知。後次第下略舉八展轉望前以念知。劫所知後類通九方。總一\n\n> 百人也。明超過中。謂彼解雖多。猶可知邊。初心功德難得其際。三\n徵可知。四釋中二。先反顯。謂不作齊限發心故。後為盡下順\n> 釋。於\n中二。初總可知。後所謂下別。別中二。初標三章。後欲悉知眾生海\n下依章開釋。前中三者。一欲知諸解差別故。二欲知\n> 彼差別解一多平\n等故。三欲得佛果能知差別解之智光方便。後依章開釋中。十句分\n三。初三句\n> 開釋初章。欲知眾生。謂欲知眾生海各各差別解無邊故。\n欲知三世三性差別解無邊故。略無無記性也。欲知相似不相似差別解\n無\n> 邊故。次一句釋第二章。平等有三種。一約想。謂此彼見解類同\n故。二約性。謂此彼俱無自性故。三約無[得-彳]。謂此彼平望\n> 俱相即\n故。雖通三義。前依相即故此句釋。後六句釋前第三章中三。初一句\n釋前能知智光明。謂智是佛十力智種種解智力。次二\n> 句釋佛智所知不\n可說差別解。於中初句內。明六種解釋前不可說差別解。一從凡夫至\n等覺\n已\n來所有勝解。皆名有上。二唯妙\n> 覺解名為無上。三於所解境。\n未能究盡。名有餘。四解\n已\n了終極名無餘解。五此彼解齊名等。六反\n此不等。後句內明十二種\n> 。解釋前不可說差別解。一謂凡夫及二乘見\n有為法有和合相故名有依解。二菩薩反彼名無依解。三世出世人同境\n異解名為不共。\n> 四自類同解名之為共。或大小乘人同解緣生故有是\n共。菩薩解此緣生。未曾不空。與二乘異。名為不共。五緣虗空等境\n無邊解故\n> 。名無邊解。六緣餘一切有限高齊境故名有邊解。或執斷計\n常。名有邊解。離此見故名曰無邊。七緣諸有為名差別解。八緣無為\n\n> 境名無差別。餘四可知。後三句釋前得佛種種解智之方便。就初句中\n五。前四別顯。後一總結。前四內。一解一切法無性即真故名\n> 妙解。\n二解一一事皆包法界故名大解。三解無量境名無量解。或解難量境名\n無量解。四無分別\n> 慧現證真解名正位解。後一結前四種解等中。得佛\n無[得-彳]智此即是因。亦名方便。次一句釋佛解智知境。種種勝解不\n同。\n> 於中二。先標能知之意。後悉知下顯所知之解。有六。一不與諸\n見相應名淨解。二反上名染。三遍知名廣。四反上名略。五委照名\n>\n細。六粗了名麤。後一句釋佛解智知境同前。於中二。先舉所知之\n解。後一切下總結。前中有六種解。一解方廣至奧名深。然非\n> 下乘所\n測名密。二臨事製宜權實善巧故云方便。三凡於一多法門決擇。故云\n分別。四於曾更事。慣習淳熟。不待作意。任運勝解\n> 。故云自然。五\n從親因生解故。本疏云宿因所發。六從增上緣生解故。本疏云善發開\n悟。後總結有三。一勝解多類。不可具陳。\n> 故總結如細。二解類雖\n多。悉欲知盡。三結為知盡故發心。\n第五佛子復置下。明知他諸根喻中四。初喻廣。二佛子此下明發心超\n>\n彼。三何以故徵。四菩薩下釋。釋中反顯順釋同前。順釋中總別准\n前。別中據三業等多分同前。故云廣說乃至等。\n第六佛子復\n> 置下。明知他欲樂喻。文四同前。\n第七佛子復置下。明知他方便喻。文四同前。方便有二種。一造業加\n行名為方便。二所作善巧。今此並通。餘意准前。\n第八佛子復置下。明知他心王喻。亦兼心所。除此文中前深心所文四\n\n> 及意。並准前釋。\n第九佛子復置下。明知他業喻。謂善不善漏無漏等。文。四及意同\n前。\n第十佛子復置下。明知他煩惱喻。文\n> 中四。初明喻廣百人准前。二佛\n子此下明發心超彼。三何以故徵。徵意同前。四佛子下釋。釋中二。\n初反顯。後為盡下順釋。順\n> 釋中先總。後所謂下別。別中二。先以六\n門別釋。後發大悲下總結兼別。前中第一門內文有二。先知。後治知\n中有三喻。一輕重\n> 一對。略辨十種。一五住地煩惱中。前四為輕。障\n見脩道故。後一為重。障大菩提故。二分別為輕。少時頓斷故。俱生\n為重。多\n> 時漸斷故。三諸斷品內。下品道斷者為輕。中上品道斷者為\n重。中品道斷者為輕。上品道斷者為重。同等分者為輕。稱境起故。\n\n> 多分者為重。通境起故。五隨惑為輕。大惑為重。小隨為輕。中大為\n重。中隨為輕。大隨為重。六迷事為輕。後智亦斷故。迷理為\n> 重。正\n體智斷故。七習氣為輕。正使為重。八暫起起羸劣起者為輕。多起常\n起猛利起者為重。\n> 九不與邪邊見相應起者為輕。反上為重。十現行為\n輕。種子為重。見脩二執皆後斷故。約識分別。如理應思。二眠起一\n對。眠謂\n> 隨眠即諸種子。起謂現起。彼種現行。三一一眾生下覺觀一\n對。謂惡覺觀與惑相。一一眾生。種種覺觀無量煩惱。涅槃說有八種\n\n> 覺觀。一欲覺。求可意事。二嗔覺。念欲嗔他。三惱覺。念欲惱他。\n四親里覺。憶念親緣。五國土覺念世安危。六不死覺。積財資\n> 養。七\n族姓覺。念族高下。八輕侮覺。是慢自恃欺人。後治中。謂菩薩於諸\n煩惱悉欲知者。意在對治。不欲但知而\n已\n。第二\n> 門中文二同前。前中\n無明與愛一對。謂發業無明潤生愛等。後斷中。為斷眾生結生相續\n故。須知此。第三門中文二。准前。前中\n> 等分非等分一對。非等分。\n謂於貪等劣境起增上貪等故。等分者。稱境起故。後斷中。為斷惑根\n故。須知此。第四門中文二准前\n> 。前中利鈍一對。我我所是利。慢是\n鈍。或我及我所一對。慢通二故。後斷中。為覺悟我我所空。故而知\n也。第五門中文二同前\n> 。前中有三對。一顛倒分別與餘一切為一對。\n二根本隨惑一對。三身見與六十二見為一對。後斷中可知。第六門中\n文二同前。前\n> 中蓋障一對。謂五蓋。即貪。恚。疑。惡作。睡眠。惛\n沉。掉舉也。障謂二障三障。或二三中但煩惱障。後斷中。兼於總\n別。於\n> 中二。先明發心所為。後發阿耨下明能發心。前中四。一非\n救。二慈護。三令斷惑。四令智淨。\n> 後能發心可知。\n第十一佛子復置下。明供佛功德喻。文中三。一喻據量。二何以下\n徵。三佛子釋。初中二。先廣說一人喻。後佛\n> 子復置下略說九人喻。\n前中二。先明供廣。後佛子於汝下問答顯勝。前中二。先廣說東方。\n後南西下略准九方。前中五。一供具\n> 廣。謂種種上味等。二供田廣。\n謂東方多剎中佛及眾生。三供時廣。謂念念如是。乃至經無數劫。四\n剎行廣。謂令彼眾生如\n己\n>\n供養。五顯彼佛滅後供廣。於中有六。一造\n多佛塔。二高廣。三多嚴。四塔各像。五像各光照多剎。六經多劫。\n後九方略准中\n> 一一同前。後問答顯勝中二。先問答顯供福皆多。後佛\n子此人下。明前供福比後發心不可為擬。並可知。\n後略說九人中二。先顯\n> 供福甚多。後佛子此前下。將供福比發心福不\n可為擬。前中九人展轉遞望。無數多劫。數量復增。同阿僧祇品內。\n從無數至不可\n> 說不可說中間雖有超然。大方依比。此中如第一人。一\n念以無數供。供十方各無數佛及無數剎各無數眾生。如是念念經無數\n劫。\n> 佛滅度後。造塔供時等。亦各無數。此中無數之言。至第二人。\n皆增至無量。第三增至無邊。第四無等。第五不可數。第六不可稱\n> 。\n第七不可思。第八不可量。第九不可說。第十不可說不可說。如第二\n人。一念中作第一人無\n> 數劫供事。第三人一念中作第二無量劫供事。\n乃至第十人一念中作第九人不可說劫供事。餘佛數等准知。又皆以後\n位一念。望前\n> 位極時。則以如是之念。相續至自位極時也。後約供福\n比發心福不可擬中。乃至少分比前極數。亦不相及。\n二徵意云。彼第十人\n> 所供生福數雖不至不可說不可說轉。然得供養之\n福。豈不比於發心少分福邪。\n三釋中二。先反顯。後為供下順釋。釋意。供福雖\n> 多。心經有限。發\n心縱少。少即無限。無限有二種。一事。二理。事謂心境。心為能\n限。境為所限。心於供具供田。不以數量時\n> 劫為限。而以無限為限。\n由此少福亦無有限。從無限心之所生故。理謂彼福。若多若少。皆是\n法性相應所起。是故少分亦稱性無\n> 限也。故反顯中云不齊限但為等。\n順釋中。為供盡法界虗空界等。\n第三直就法說中二。初牒前所校量心。後能知下明所攝功德。\n> 前中云\n發是心\n已\n者。簡未發時。故云\n已\n也後攝功德中四。一攝佛功德。二以\n發心故下明得果法。三纔發心下約時化用。\n> 四此初發下顯所作無著。\n初中四。一標三世佛功德能信能知。過現世法\n已\n從緣應故可得知。未\n> >\n來法未有故但可信。二彼諸下正明攝德。謂此菩薩聞三世佛功德汝能\n信受等。文中八句。勒為三位。初四句三賢。謂信受兩句\n> 同是十住。\n此中信者。即十住之信。不應劫發十信信故。謂於三世佛所有功德。\n起深勝解故。受謂於彼領納心無逆故。次修一句\n> 是十行。謂於信受隨\n順行故。次得一句是十迴向。謂以所順行迴向不失能獲證故。次知證\n成就三句。是同十地。知謂加行智解了\n> 如故。證謂正體智冥契如故。\n或正體如前後得名。知成就者。謂因行圓滿故。後一句與諸佛平等一\n性者。能同佛果故。三何以下\n> 徵。徵意云。以何義故。此菩薩於三世\n佛功德。即能信受。乃至能與佛果一體。同此菩薩下釋。釋中十一\n句。初一總。餘十別。\n> 文並同前。不煩更述。\n二得果法中二。先顯當得。復應知下明即得。然當得者果佛故。即得\n者因佛故。攝法同等。因果不離。若\n> 因不攝果法盡。則非法性果之\n因。若果法不全即是因。則非法性因之果。因果之相不一。因果之體\n不異。如是因果果因。非即非\n> 離。鎔融無碍。方為法界因果。也前中\n文二。初四字明能得所由。後常為下明所得果法。就所得法中三。初\n正顯所得。二何以下\n> 徵。三以是下釋。初中八句。一得果護念令增善\n不退。二由不退當必得果。三感佛授與自所得法。四與三世同一體\n性。五脩成諸佛助道行。六三世佛力無畏皆成就。七以三世佛不共法\n為嚴。八得盡法界佛說法無[得-彳]解\n> 智。二徵意云何不說由三賢十地\n萬行圓滿得佛果法。但云由初心得。三釋中意云。以此初心是萬行本\n故。二即得果法中五句。初\n> 一總。餘四別。初總云與佛同等。未顯所\n因並別之狀故。別說同事一境界者。如問明品及出現品說。二功德\n者。謂攝度悲定力無\n> 畏等諸功德海。三與佛隨應現身一多無[得-彳]同\n等同得法界大智與佛同等。或此後兩句合為一事。謂得隨機現身一多\n無[得\n> -彳]智故。\n三約時作用者。謂纔發心時。即得此應用故。文中十一句。一得諸佛\n同讚。二能調化。三能同多剎。四能光照多剎\n> 。五滅惡道苦。六嚴淨\n多剎。七示成多佛。八攝機令喜。九能證法性。十能繼佛種。十一得\n佛智因。\n四明所緣無著中二。初總\n> 標無能所著。次所謂下別列無所著境。後唯\n求下雙結無能所著。初中云不於三世業者。即後所列三寶現世世所攝\n故。了知不離自\n> 心性故。離此無少別物為所得。無別少心為能得。次\n別列中七對十四句。前四後一五對約人法。五六兩對約名義。或總約\n名義。\n> 後總結中二。先一句明無所著意意等一切智。後於謂下正雙結\n無所著行。諸法界是差別事境。餘\n> 可知。問前列中。既云於佛及佛法\n無所得。後結中。云唯求一切智常不相違。答正前佛無所得。則是唯\n求一切智也。上來第二解\n> 釋分竟第三現瑞分中二。初標現瑞所因。謂\n佛神力故。後十方下明所現瑞。於中。先明動剎瑞。後雨眾下明雨物\n瑞。前中二。初\n> 標動遠近。後所謂下顯震動相。略顯如前。廣辨如\n章。雨物瑞中十事音聲謂歌讚。\n第四證成分中內四。初十方佛現身證成。於中\n> 四。一來更剎量。二有\n萬下佛數量。三顯佛名表所說法同說法表名故。四各現下正明現身。\n二作如是下讚說證成。三我等下引同\n> 說證。四汝說此下舉益證成。舉\n益證成中二。先明益現世。復有二種。一發心益。二授記益。後我等\n下益未來。可知。上來明此\n> 世界中說竟。後結通十方無盡世界說法中\n二。先明結通普遍盡空剎內同說此法。後悉以下釋遍所由。前中二。\n初明說處。十二重\n> 數內。前十略同阿僧祇品中。從第一百四數後十箇\n數內。後二顯無限量。後亦說下明所說所作。能說者名並同。後釋遍\n所由中十\n> 句。一由此界他方諸佛威神令十方同說。二由毗盧宿願。三\n由為顯佛自得法。四由為以佛智照。五由為開實義。六由為令眾生證\n\n> 法性。七由為會眾聞稱根法。八由為開佛所得法本因。九由為得諸佛\n無[得-彳]用。互望無異\n> 法。十由為令眾生了事法界無二。上來第一大\n段長行竟第二大段。偈頌中二。先辨說偈意。後為利下正顯偈詞。前\n中十句。一普\n> 觀十方同說此法之集會顯法界法門。法爾如是。不謀而\n應故。二欲普成就故。三欲普令絕惡業不受苦故。四欲普令客塵斂。\n顯本\n> 自清淨性故。五普欲令拔去無明住地惑故。六普欲令增普門信證\n信故。七普欲令知眾生三乘根器及信等諸根故。八普欲令知三世一\n> 相\n故。九普欲令觀生死即涅槃故。十法慧自欲增長無漏善根故。故說此\n偈也第二正顯偈詞中。總有一百二十一頌。古來諸德不判\n> 此文。唯本\n疏有科。然望前長行解釋分中三段次第。此乃翻彼。從後向前。謂初\n八十二頌。頌前第三直就法說文。次十方國下一\n> 十五頌。頌前第二諸\n喻廣說文。後發心無[得-彳]下二十四頌。頌前第一歎問深難之。初中\n四。初五十一頌。頌自分行滿。次\n> 欲得下二頌。結歸初心。次無量下\n二十八頌。明勝進行滿。後菩薩下一頌結屬初心。就初自分行滿中。\n分為十二節。初三頌。頌\n> 前發心充滿十方界。第二頌。梵本云。盡虗\n空界如法界。充滿世間如佛法。一切遍行。如諸佛剎世不退故。隨入\n十方國土下三頌\n> 。頌前知一切世界成壞等。按梵本云。菩薩常脩最勝\n行。依細無依不可說。於諸佛智見無厭。彼能隨入法海流。三哀愍五\n趣下三\n> 頌。頌前為不斷如來種性。四諸趣差下五頌。頌前知眾生心行\n諸根及大願供佛等。五其心清淨下\n> 三頌。頌前知法甚深智。六菩薩始\n發下四頌。頌前發心即能說法調伏十方眾生智。七菩薩具足下三頌。\n頌前得三世佛智慧光明。\n> 八為令眾生下五頌。明忍苦說法體用行。九\n十方世界下六頌。顯供佛請法證理起用。亦即頌頌前現成佛等。十菩\n薩所得下七頌。\n> 頌圓滿成果用。於中第四頌。按梵本云。身滿諸剎勇\n猛土。放勝光網遍世間。普照眾生陰闇冥。如龍王雨演大法。十一一\n身示現\n> 下四頌。明身心廣大。亦頌前一身無量身等。十二能所分別下\n五頌明絕妄契真。頌前等真法界等。二欲得最勝下二頌明結歸初心\n\n> 者。前深廣大功德海。皆此初心之德。是故勤令脩學。結結\n己\n所說。\n三明勝進行滿二十八頌中分八。初二頌。明三種世間無染\n> 行。二其心\n廣大下兩頌。明悲智深廣行。三無量難思下四頌。明請法嚴土知根說\n法。四無量無數下四頌。明定慧自在知劫脩短。\n> 五眾生是嚴下六頌。\n明知佛十力自在德。六菩薩於一毛孔下四頌。明見三種世間如因陀羅\n網。七如是大智下三頌。明順佛普供聞\n> 供歡喜。按梵本云。如是無畏\n諸菩薩。次二句同漢本。第四句。梵云。於如來所獲大喜。次一頌。\n梵本云。變身種種無量億。現\n> 前供養十方佛。示現最勝神通力。佛所\n行處皆隨往。八\n己\n護如來下三頌。明定慧信悲無著深勝。於中第三\n頌。梵本云。彼得\n> 廣大哀愍竟。於諸眾生同\n己\n相。見\n己\n除妄倍精勤。\n行空無相等虗空。四菩薩發心下一頌\n> 結上諸德。皆發心功德量無齊限\n故。讚述難盡。上辨前直就法說竟。第二大段頌諸喻廣說一十五偈\n中。文顯可知。然第十頌。梵\n> 本。世間種種惑業轉。由此三業恒相\n續。彼諸邊際有盡窮。勝菩提心無限極。第十一頌。梵本云。云何解\n脫業煩惱。發心供養如\n> 來故。煩惱既離業亦除。哀愍三世皆令孔。\n第三大段頌歎問深難二十四偈中分二。前二十三頌正頌長行。末後一\n頌舉益勸脩。前\n> 中分十。初三頌明發心深廣。頌前甚深及難趣入。於\n中初頌。梵本云。菩提心謂無著際。一切有量此無量。到眾生性菩提\n岸。一\n> 切智智最勝力。次頌。梵本云。菩提心等虗空界。生諸功德如\n法界。所行普遍同真如。一切性離猶善逝。二一切能捨下二頌明行廣\n>\n大。頌難知。三三世一切下二頌明德門普。頌前難知。四菩提心下二\n頌明初心成佛。頌前難信解。於中。第二頌內後兩句云智慧\n> 等者。梵\n本云。智慧無著應供尊。根本皆由發心得。五一切獨覺下三頌。明能\n出生世出世樂。頌前難證。六往佛無[得-彳]下\n> 二頌。明智日行月德海\n淨空無不圓滿。頌前難行。七普發下二頌明行願圓備。頌前難通達。\n八了法自性下二頌明深廣同佛。頌前\n> 難思惟。九如眾生數六二頌。明\n以住佛家必得佛智設經多劫說德無盡。頌前難說。十眾生心行下三\n> >\n頌。頌以能出生三世界及世間樂是故心塵虗空不可比量。頌難度量。\n二末後一頌舉益勸脩。初發心功德品釋竟。\n\n### 5.4 李通玄《新华严经论》（T1739）段\n\n李通玄疏窗 @197438–202602·长 **5,164**。以「初發心之士功德難量」立论，因陀罗网重重相入释发心之福智境。\n\n通玄窗口 T1739·@197438-202602·len=5164·「初發心之士功德難量」·因陀罗网重重相入·四行一颂：\n\n> 初發心功德品第十七\n夫以初發心之士功德難量。舉等虛空無以比其類。磨盡剎塵無以酬其\n匹。虛空但明無相之大。一切剎塵但明\n> 形礙之廣焉。能對其菩提心之\n福智之境。其智也。於剎那之際滿十方。現身如雲狀。因陀羅網妙像\n相入光影重重。各各以一言音\n> 普周法界。說等眾生。教門如雨。灑眾\n生心得清淨樂。爾其福也。妙相莊嚴與華藏而同其體。為初發心之際\n與十方諸佛等住無盡\n> 劫海。在剎那之中延促相似。如一小流入大海中\n與大海等。以水體不別故。如初發心菩薩纔入諸佛大智慧流中等佛功\n德故。為初\n> 入與究竟時無延促。又智慧一故為誓度眾生悉令成佛。志\n願等故。又如十方世界盡末為塵。一一塵中。有無量佛剎無量眾生。\n如\n> 菩提心大智慧身。於一剎那際等一切剎塵。供養諸佛教化眾生。一\n時等遍。但以智慧力故。法如是故。智遍周故。亦不作神通變化\n> 之\n想。初發心菩薩志樂廣大。與佛界眾生界等無限量故。故今此品所歎\n初發菩提心。以十種功德廣大難量無比不可喻。於此佛果\n> 根本不動大\n智不思議法界乘而發心者。如輪王大子初生之時具足王相。如師子王\n之子威勢與父相似體不異故。如初發菩提心菩薩\n> 。初生如來智慧種性\n家時。智慧所知不異佛故。三世時劫無延促見不異佛故。志樂廣大教\n化眾\n> 生不異佛故。從初發心乘如來一切智乘。不出剎那際成等正覺。\n教化眾生不異佛故。設於三乘順世情教說三祇劫而成佛者。畢竟迴\n> 心\n入此一切智境界乘。方得成佛。如法華經。即是所迴三乘入一切智境\n界之教。如龍女一剎那際三生成佛者是也。一切眾生總須\n> 悟此法方得\n成佛。不可取如來三乘中順世方便之言。以法如是故。如此品下文\n云。初發心菩薩纔發心時。即為十方一切諸佛所共\n> 稱歎。即能說法教\n化調伏一切世界所有眾生。乃至示現成佛等。廣如此品下文所說。此\n品之內長行總有四十段經意也。頌有二百\n> 四十二行。以歎初發心菩薩\n之功德。其文如下。將釋此品。約作三門分別。一釋品名目。二釋品\n來意。三隨文釋義。\n一釋品名\n> 目者。此品初發心功德品者。創始發心見無古今。名之為\n初。無心智應。名之為發。身邊見盡。名之為心。不為而成大果。名\n之\n> 為功。但化利一切不欣來報。自獲無邊妙相莊嚴故。名之為德。又\n福智遍周。名之為功。事無不達。名之為德。品者均分義。二釋\n> 品來\n意者。前品說有淨行之功。此品所明淨行之中無邊功德。是故此品須\n來。三隨文釋義者。復分二門。第一長科經意。第二隨\n> 文解說。第一\n長科經意者。從初爾時已下至品末已來。長科為四十段。一爾時已\n下。至其量幾\n> 何有一行半經。是天帝請說發心功德分。二法慧菩薩言\n已下。至而為汝說可三行半經。明初發心功德甚深十種難知許說分。\n三佛\n> 子已下。至無能量者可有五行經。明一人所供十方各一阿僧祇世\n界眾生。并令淨持五戒且舉功德廣大難量分。四法慧菩薩已下。至\n> 亦\n不及一有五行經。明將前所有廣多供養功德不可比對初發心功德無比\n喻分。五佛子已下。至唯佛能知有十行經。且舉如上功德\n> 廣大分。六\n法慧菩薩言已下。至亦不及一。可兩行半經。明前功德不可比對。初\n發心功德喻分。七何以故已下。至無上菩提之心\n> 。於中有十五行經。\n明初心菩薩為起無限心教化一切眾生不斷佛種性分。八佛子復置此喻\n已下。至可知邊際。可有七行經。且舉\n> 速行邊際可知分。九菩薩初發\n心已下。至三藐三菩提心。可有十五行經。明初心菩薩所知世界境界\n無限難知分。十佛子復置此喻\n> 已下。至可知邊際。可有六行半經。且\n舉速知劫數成壞廣多可知分。十一菩薩初發心已下。至了知一切劫神\n通智。可有十六行經\n> 。明初發心菩薩了劫成壞難知分。十二復置此喻\n已下。至可知邊際。可有六行經。且舉所解廣大猶可能知分。十三菩\n薩初發心至\n> 三藐三菩提心。可有二十二行經。明初發心菩薩知解廣大\n難知分。十四佛子復置此喻已下。至可知邊際。可有六行經。且舉知\n眾\n> 生根廣多猶能可知分。十五菩薩初發心已下。至三藐三菩提心。可\n有五行半經。明初發心菩薩善\n> 知眾生根性廣大難量分。十六佛子復置\n此喻已下。至可知邊際。可有四行經。且舉所欲樂廣大猶能可知分。\n十七菩薩初發心已下\n> 。至三藐三菩提心。可有六行經。明初心菩薩所\n知一切眾生欲樂廣大難知分。十八佛子復置此喻已下。至可知邊際。\n可有四行經\n> 。明且舉所知眾生方便廣大猶可知分。十九菩薩初發心已\n下。至菩提心。可有六行經。明初心菩薩善知一切眾生種種方便廣大\n難\n> 知分。二十佛子復置此喻已下。至可知邊際。可有三行經。且舉所\n有一切眾生心廣大猶可知分。二十一菩薩初發心已下。有五行半\n> 經。\n明初發心菩薩知一切眾生差別心廣大難知分。二十二佛子復置此喻已\n下。至不可得知。有四行經。且舉所有眾生業廣大猶可\n> 知分。二十三\n何以故已下。至三藐三菩提心。可有三行經。明初心菩薩知眾生差別\n業廣大難知分。二十四佛子復置此喻已下。至\n> 可知邊際。有七行經。\n且舉知眾生煩惱廣大猶可能知分。二十五菩薩初發心已下。至三藐三\n菩提心。有十六行經。明初心菩薩所\n> 行一切眾生煩惱廣大難知分。二\n十六佛子復置此喻已下。至亦復如是。可有九行半經。且明供養廣大\n難知猶知分。二十七佛子於\n> 汝意云何已下。至亦不及一。可有三行\n經。明初發心功德廣大難知分。二十八佛子復置是喻。至亦復如是。\n有十行半經。明且舉\n> 供養及起塔高廣猶知分。二十九佛子此前功德已\n下。至發是心已。有六行半經。明初心菩薩供養\n> 廣大難量分。次直就\n法說分。三十能知前際一切諸佛已下。至能與諸佛平等一性。可有四\n行經。是明初發心已能知三世諸佛。成\n> 佛及涅槃智慧平等分。攝功德\n分。三十一何以故已下。至知一切眾生三世智故發心。可有九行經。\n明菩薩初發心志意所求甚深深\n> 廣分。三十二以發心故已下。至得法界\n一切諸佛說法智慧。可有六行經。明菩薩發心已得三世一切諸佛憶念\n與法及自力昇進分。\n> 得果佛因佛。三十三何以故已下。至即得一切佛\n智慧光明。有十行半經。明纔初發心菩薩成佛利生同三世諸佛分。化\n用分。三十\n> 四此初發心菩薩已下。至於諸法界心無所著。有四行半\n經。明初發心菩薩志樂所知世間出世間法無著分。三十五爾時佛神力\n故已\n> 下。有三行半經。明大地動分。三十六天雨眾華已下。有兩行\n經。明諸天興供分。三十七是時已下。有四行半經。明十方同號佛來\n>\n現其前歎譽許可法同分。三十八汝說此法時已下。有五行經。明說此\n法時十方各過萬佛剎微塵數菩薩發心受記分。三十九如此世\n> 界已下。\n有九行半經。明十方所說法人及法一時同說分。四十爾時法慧菩薩已\n下。有六行半經。明法慧菩薩觀欲所緣之法說頌稱\n> 歎分。已下頌文有\n二百四十二行。四行一頌。其頌有六十段頌都計有二百四十行。末後\n兩行頌。總結頌意。歎勸發心。有一百六\n> 十八行。是總都歎佛果以\n來。五位及信等諸法。明初發心者志樂智德總含一切諸佛智德。體用\n\n> 始成。一念初發心菩薩位也。方明初發心境與心不二。若志樂毫氂不\n似如來所修法身悲智願行者。不名初發心菩薩故。以此初頌有\n> 一百六\n十八行。且總歎信等六位因果及如來智德。總歎令初發心者法之相\n似。然後七十四行。頌始重頌前四十段中。校量發心功\n> 德廣大之量。\n新華嚴經論卷第十七\n新華嚴經論卷第十八\n長者李通玄撰\n第二隨文解釋者。如\n> 前挍量初發心功德四十段文中。最初一段帝釋\n請。如文可知。第二文中。舉初發心有十種廣大難知法。如文可知。\n第三段中。正\n> 舉供養廣大。第四段中。正明將人所供不可挍量如歌羅\n分者。是將多比少。不如喻如析人身上毛作百分。將前人所作功德。\n不如\n> 初發心菩薩百分毛中一分毛許功德。又云。優波尼沙陀分者。謂\n少許相近類之。無限善根不可將有限比對。餘如文自明。第五段中\n> 云\n教修十善道者。身三口四意三。是欲界生天善上者云四禪色界業也。\n初禪滅憂。二禪滅苦。三禪滅喜。四禪唯寂靜。云教住四\n> 無量心。此\n是有為中慈悲喜捨。云教住四無色定。此是無色界定。已上是三界中\n善業。云教住須陀洹果謂。初斷見惑捨異生性。\n> 初獲聖性入聖行流\n故。故名入流。云教住斯陀含果。此云一來。謂此聖者雖斷欲界六品\n惑。然為有餘。三品未斷。令此聖者一度\n> 來欲界生故名一來果。云教\n住阿那含果。此云不還。謂斷欲界九品惑盡。從此生色界。更不來欲\n界受生。故名不還。此十使中。\n> 見道疑未能明了不入羅漢果。如十使\n煩惱。一身見。二邊見。三見取。四戒取。五邪見。已前五\n> 為利使。\n已後五為鈍使。見諦斷。六貪七瞋。八癡。九慢。十疑此五鈍使。能\n迷隨行之事。此之十使。前五利使。須陀洹見諦之\n> 後。伏之不起。後\n五鈍使薄。斯陀含斷欲界六種惑。非無色界貪。於瞋癡慢三種。微而\n且薄。現行不生。非種無故為上二界報且\n> 無瞋為修定伏而現行不起。\n須斯二果有厭患。而不令增長。常求出世之心。以此不成三界沈淪種\n子。阿那含厭令永息。唯有見道\n> 疑。以見道不分明。不能頓超三界業\n果。阿羅漢為見道無疑。三界業果一時盡故。望前三果。設斷九種煩\n惱。唯有疑在。不得名\n> 為斷煩惱。為見諦。無明未明。總名厭伏。不\n得名斷。又羅漢辟支佛。但欣出世。淨土菩薩及空觀菩薩。為但欣出\n世行六波羅蜜\n> 。總是折伏現行無明。不得名為永斷煩惱。為且以空觀\n折伏無明。不了無明從本已來是不動智佛為不了根本。以空折伏使令\n不起\n> 。乃至十地但得意生身等。不名以如來一切種智生身。以作十真\n如等觀斷十種麁重。不了無明本是如來根本智故。大用恒寂故。一\n> 乘\n佛果教中依佛果發心。初發心時達根本無明。是根本無分別智。成差\n別智大用法門。初心之上圓滿一切諸佛共所乘門。名乘一\n> 切智乘。若\n智悲願行毫釐不似佛。信心亦不成。何況住佛所住生在如來一切種智\n家。生為佛真子具諸佛事。以智不異願行平等大\n> 悲不異。無限境界不\n異。過去未來劫差別與一念不異。應如是定慧照之可見。此是名依佛\n菩薩\n> 正善知識依根本智發心。如下文纔發心菩薩能於十方示身成佛\n者。為初發心時。乘如來不思議一切智乘。得佛種智。生如來法界之\n>\n家。乘佛一分之智慧大慈悲勢分。即能如是示身成佛。如下頌云。菩\n薩於佛十力中雖未證得亦無疑。菩薩於一毛孔中普現十方無\n> 量剎如是\n總明初發心菩薩之德。為得如來一分智慧勢分如是。如輪王大子權統\n王政亦得自在。一分與父王相似。如動地興供明法\n> 威力亦明。大眾法\n悅心悅。地動明心境體無二故。境由心現故。如十方各過萬佛剎微塵\n數佛。同名法慧來現其前者。為明與十方\n> 諸佛智慧合故。萬佛剎塵者\n明昇進修行啟迷悟法之量。十信十十住百。十行千。總是明昇進見諦\n解迷悟法之名。如下萬佛剎微塵\n> 數菩薩發心。受過千不可說劫成佛之\n記。皆同號之為清淨心者。亦明達如是千不可說劫量法門總清淨故。\n故佛號清淨心。非是實\n> 有如情所見長遠之劫也。總明當位隨迷悟法之\n名。不是存其劫量之說如妄情所見也。自此已下直至品末如文。自具\n如文。稱歎如\n> 是已下二百四十二行頌一百六十八行。總歎佛果及信等\n六位。法門已下。七十四行所歎此品之內挍量發心功德廣大難比。如\n文具\n> 明。隨文稱歎。四行一頌准例知之。如是挍量初發心功德。設使\n以等虛空無限境界。以一切樂具總供養無限眾生。皆令得人天勝樂\n> 。\n又教令得四沙門果及辟支佛及三乘出世菩提。如是虛空境界及所度眾\n生雖等。然未令所化眾\n> 生得成佛。亦不可比。於此教中初發心乘如來\n大智等佛所行。普化眾生皆成佛故發菩提心。以是義故。所舉境界廣\n狹不等。所化\n> 眾生成佛不成佛不等故。不可為比故。是故此品下文\n云。初發心菩薩不於三世少有所得。所謂若諸佛若諸佛法。若菩薩若\n菩薩法\n> 。若獨覺若獨覺法。若聲聞若聲聞法。乃至廣說如經。但為唯\n求一切智於諸法界心無所著發菩提心。略說菩提。其法有四。一聲聞\n>\n菩提。二緣覺菩提。三權教菩提。四一乘菩薩佛果菩提。前三並是出\n世菩提。佛果菩提是法身大智大悲真俗萬行法界圓滿菩提。\n> 無出入\n故。三乘菩提雖觀四諦十二緣。而亦未知四諦十二緣之實體。非獨二\n乘未知。三種意生身菩薩位登十地。猶未能悉知。唯\n> 一乘菩薩以智方\n知。至十地品具明。但且略而總言。三乘中觀苦集滅道及十二緣生。\n及行六波羅蜜菩薩。厭苦欣真但求出世。大\n> 悲菩薩方云留惑潤生。一\n乘菩薩以智觀四諦十二緣生。無明即智苦諦即聖諦。於生死涅槃無解\n縛性。是故此經名苦聖諦集聖諦。\n> 如是十聖諦十二因緣總是法界自性\n無縛無解自在之緣。不名無明。不名苦諦如是總觀萬法。如是名為一\n乘法界緣起智悲自在任性\n> 緣生。一切眼耳鼻舌身。莫不皆是法界緣起\n自在法門。一切諸佛知見神通力。以此而有。但以禪定觀照諸波羅蜜\n而顯發之。是故學者應如是修如是悟入。已下頌文四行一頌。如文自\n具。不煩更解。有智之士隨文稱歎令眾發心\n> 。\n\n### 5.5 李通玄《华严经合论》（X0223）段\n\n合论疏窗 @324670–339294·长 **14,624**（本品诸家中最长）。【論】体，与 T1739 同源而文繁。\n\n合论窗口 X0223·@324670-339294·len=14624（本品诸家最长）·【論】体·经论交映：\n\n> 初發心功德品第十七\n【論】夫以初發心之士功德難量舉等虗空無以比其類磨盡剎塵無以酬\n其匹虗空但明無相之大一切剎塵但明形\n> 礙之廣焉能對其菩提心福智之\n境其智也於剎那之際滿十方現身如雲狀因陀羅網妙像相入光影重重各\n各以一言音普周法界說等眾生\n> 教門如雨灑眾生心得清涼樂爾其福也妙\n相莊嚴與華藏而同其體為初發心之際與十方諸佛等住無盡劫海在剎那\n之中延促相似如一小\n> 流入大海中與大海等以水體不別故如初發心菩薩\n纔入諸佛大智慧流中等佛功德故為初入與究竟時無延促又智慧一故為\n誓度眾生悉\n> 令成佛志願等故又如十方世界盡抹為塵一一塵中有無量佛\n剎無量眾生如菩提心大智慧身於一剎那際等一切剎塵供養諸佛教化眾\n生\n> 一時等徧但以智慧力故法如是故智徧周故亦不作神通變化之想初發\n心菩薩志樂廣大與佛界眾生界等無限量故故今此品所歎初發菩提\n> 心以\n十種功德廣大難量無比不可喻於此佛果根本不動大智不思議法界乘而\n發心者如輪王太子初生之時具足王相如師子王之子威勢\n> 與父相似體不\n異故如初發菩提心菩薩初生如來智慧種性家時智慧所知不異佛故三世\n時劫無延促\n> 見不異佛故志樂廣大教化眾生不異佛故從初發心乘如來一\n切智乘不出剎那際成等正覺教化眾生不異佛故設於三乘順世情教說三\n祇\n> 劫而成佛者畢竟迴心入此一切智境界乘方得成佛如法華經即是所迴\n三乘入一切智境界之教如龍女一剎那際一生成佛者是也一切眾生\n> 總須\n悟如此法方得成佛不可取如來三乘中順世方便之言以法如是故如此品\n下文云初發心菩薩纔發心時即為十方一切諸佛所共稱歎\n> 即能說法教化\n調伏一切世界所有眾生乃至示現成佛等廣如此品下文所說此品之內長\n行總有四十段經意也頌有二百四十二行以歎初\n> 發心菩薩之功德其文如\n下將釋此品約作三門分別一釋品名目二釋品來意三隨文釋義第一釋品\n名目者此品名初發心功德品者創始發\n> 心見無古今名之為初無心智應名\n之為發身邊見盡名之為心不為而成大果名之為功但化利一切不忻來報\n自獲無邊妙相莊嚴故名之為\n> 德又福智徧周名之為功事無不達名之為德\n品脉均分教義第二釋品來意者前品既有淨行之功此品所明淨行之中無\n邊功德是故此品須\n> 來第三隨文釋義者復分二門第一長科經意第二隨文\n解脫第一長科經意者從初爾時\n已\n下至品末\n已\n來長科為四十段。\n【經】\n> 爾時天帝釋白法慧菩薩言佛子菩薩初發菩提之心所得功德其量\n幾何。\n【論】一爾時\n已\n下至\n> 其量幾何有一行半經是天帝請證發心功德分。\n【經】法慧菩薩言此義甚深難說難知難分別難信解難證難行難通達難\n思惟難度量難\n> 趣入雖然我當承佛威神之力而為汝說。\n【論】二法慧菩薩言\n已\n下至而為汝說可三行半經明初發心功德甚深十\n種難知許說分。\n>\n【經】佛子假使有人以一切樂具供養東方阿僧祇世界所有眾生經於一\n劫然後教令淨持五戒南西北方四維上下亦復如是佛子於汝意\n> 云何此人\n功德寧為多不天帝言佛子此人功德唯佛能知其餘一切無能量者。\n【論】三佛子\n已\n下至無能量者可五行經明一人所供\n> 十方各一阿僧祇世\n界眾生并令淨持五戒且舉功德廣大難量分。\n【經】法慧菩薩言佛子此人功德比菩薩初發心功德百分不及一千分\n> 不\n及一百千分不及一如是億分百億分千億分百千億分那由他億分百那由\n他億分千那由他億分百千那由他億分數分歌羅分算分喻分\n> 優波尼沙陀\n分亦不及一。\n【論】四法慧菩薩\n已\n下至亦不及一有五行半經明將前所有廣多供\n> 養功\n德不可比對初發心功德無比近喻分正明將人所供養不可校量如歌羅分\n者是將多比少不如喻如折人身上毛作百分將前人所作功\n> 德不如初發心\n菩薩百分毛中一分毛許功德又云優波尼沙陀分者謂少許相近類之無限\n善根不可將有限比對餘如文自明。\n【經】佛\n> 子且置此喻假使有人以一切樂具供養十方十阿僧祇世界所有\n眾生經於百劫然後教令修十善道如是供養經於千劫教住四禪經於百千\n\n> 劫教住四無量心經於億劫教住四無色定經於百億劫教住須陀洹果經於\n千億劫教住斯陀含果經於百千億劫教住阿那\n含\n果經於那由\n> 他億劫教住\n阿羅漢果經於百千那由他億劫教住辟支佛道佛子於意云何是人功德寧\n為多不天帝言佛子此人功德唯佛能知。\n【論】\n> 五佛子\n已\n下至唯佛能知有十行經明且舉如上功德廣大分云教住\n十善道者身三口四意三是欲界生天善上者出世善云四禪色界業也\n> 初禪\n滅憂二禪滅苦三禪滅喜四禪唯寂靜云教住四無量心此是有為中慈悲喜\n捨云教住四無色定此是無色界定\n已\n上是三界中善業\n> 云教住須陀洹果謂\n初斷見惑捨異生性初獲聖性入聖行流故故名入流云教住斯陀含果此云\n一來謂此聖者雖斷欲界六品惑然為有餘三\n> 品未斷令此聖者一度來欲界\n生故名一來果云教住阿那含果此云不還謂斷欲界九品惑盡從此生色界\n>\n更不來欲界受生故名不來此十使中見道疑未能明了不入羅漢果如十使\n煩惱一身見二邊見三見取四戒取五邪見\n已\n前五為利使\n\n> 已\n後五鈍使見諦\n斷六貪七瞋八癡九慢十疑此五鈍使能迷隨行之事此之十使前五利使須\n陀洹見諦之後伏之不起後五鈍使薄貪瞋癡\n> 斯陀含斷欲界六種惑非無色\n界貪於瞋癡慢三種微而且薄現行不生非種無故為上二界報且無瞋為修\n定伏而現行不起為須斯二果有厭\n> 患而不令增長常求出世之心以此不成\n三界沈淪種子阿那含厭令永息唯有見道疑以見道不分明不能頓超三界\n業果阿羅漢為見道無疑\n> 三界業果一時盡故望前三果設斷九種煩惱唯有\n疑在不得名為斷煩惱為見諦無明未明總名厭伏不得名斷又羅漢辟支佛\n但忻出世淨土\n> 菩薩及空觀菩薩為但忻出世行六波羅蜜總是折伏現行無\n明不得名為永斷煩惱為且以空觀折伏無明不了無明從本\n已\n來是不動智\n\n> 佛為不了根本以空折伏使令不起乃至十地但得意生身等不名如來一切\n種智生以作十真如等觀斷十種麤重不了無明本是如來根本智故\n> 大用恒\n寂故一乘佛果教中依佛果發心初發心時達根本無明是根本無分別智成\n差別智大用法門初心之上圓滿一切諸佛共所乘門名乘\n> 一切智乘若智悲\n願行毫釐不似佛信心亦不成何況住佛所住生在如來一切種智家生為佛\n真子具諸佛事以智不異願行平等大悲不異無\n> 限境界不異過去未來劫差\n別與一念不異應如是定慧照之可見此是名依佛菩薩正善知識依根本智\n\n> 發心如下文纔發心菩薩能十方示身成佛者為初發心時乘如來不思議一\n切智乘得佛種智生如來法界之家乘佛一分之智慧大慈悲勢分即\n> 能如是\n示身成佛如下頌云菩薩於佛十力中雖未證得亦無疑菩薩於一毛孔中普\n現十方無量剎如是總明初發心菩薩之德為得如來一分\n> 智力勢分如是如\n輪王太子權統王政亦得自在一分與父王相似。\n【經】法慧菩薩言佛子此人功德比菩薩初發心功德百分不及一千分\n> 不\n及一百千分不及一乃至優波尼沙陀分亦不及一。\n【論】六法慧菩薩言\n已\n下至亦不及一可兩行半經明前功德不可比對初\n發\n> 心功德喻分。\n【經】何以故佛子一切諸佛初發心時不但為以一切樂具供養十方十阿\n僧祇世界所有眾生經於百劫乃至百千那由他億\n> 劫故發菩提心不但為教\n爾所眾生令修五戒十善業道教住四禪四無量心四無色定教得須陀洹果\n斯陀含果阿那含果阿羅漢果辟支佛道\n> 故發菩提心為令如來種性不斷故\n為充徧一切世界故為度脫一切世界眾生故為悉知一切世界成壞故為悉\n知一切世界中眾生垢淨故為\n> 悉知一切世界自性清淨故為悉知一切眾生\n心樂煩惱習氣故為悉知一切眾生死此生彼故為悉知一切\n> 眾生諸根方便\n故為悉知一切眾生心行故為悉知一切眾生三世智故為悉知一切佛境界\n平等故發於無上菩提之心。\n【論】七何以故\n>\n已\n下至無上菩提之心有十四行半經明初發心菩薩為起\n無限心教化一切眾生不斷佛種性分。\n【經】佛子復置此喻假使有人於一\n> 念頃能過東方阿僧祇世界念念如是\n盡阿僧祇劫此諸世界無有能得知其邊際有第二人於一念頃能過前人阿\n僧祇劫所過世界如是亦盡\n> 阿僧祇劫次第展轉乃至第十南西北方四維上\n下亦復如是佛子此十方中凡有百人一一如是過諸世界是諸世界可知邊\n際。\n【論】八\n> 佛子復置此喻\n已\n下至可知邊際有七行經明且舉速行邊際廣大\n可知喻分。\n【經】菩薩初發阿耨多羅三藐三菩提心所有善根無有\n> 能得知其際者何\n以故佛子菩薩不齊限但為往爾所世界得了知故發菩提心為了知十方世\n界故發菩提心所謂欲了知妙世界即是麤世界\n> 麤世界即是妙世界仰世界\n即是覆世界覆世界即是仰世界小世界即是大世界大世界即是小世界廣\n\n> 世界即是狹世界狹世界即是廣世界一世界即是不可說世界不可說世界\n即是一世界不可說世界入一世界一世界入不可說世界穢世界即\n> 是淨世\n界淨世界即是穢世界欲知一毛端中一切世界差別性一切世界中一毛端\n一體性欲知一世界中出生一切世界欲知一切世界無體\n> 性欲以一念心盡\n知一切廣大世界而無障礙故發阿耨多羅三藐三菩提心。\n【論】九菩薩初發心\n已\n下至三藐三菩提心可十五行經\n> 明初發心菩薩所\n知世界境界無限難知分。\n【經】佛子復置此喻假使有人於一念頃能知東方阿僧祇世界成壞劫數\n念念如是盡阿僧\n> 祇劫此諸劫數無有能得知其邊際有第二人於一念頃能\n知前人阿僧祇劫所知劫數如是廣說乃至第十南西北方四維上下亦復如\n是佛子\n> 此十方阿僧祇世界成壞劫數可知邊際。\n【論】十佛子復置此喻\n已\n下至可知邊際可六行半經明且舉速知劫數成\n壞廣多可知分。\n>\n【經】菩薩初發阿耨多羅三藐三菩提心功德善根無有能得知其際者何\n以故菩薩不齊限但為知爾\n> 所世界成壞劫數故發阿耨多羅三藐三菩提心\n為悉知一切世界成壞劫盡無餘故發阿耨多羅三藐三菩提心所謂知長劫\n與短劫平等短劫\n> 與長劫平等一劫與無數劫平等無數劫與一劫平等有佛\n劫與無佛劫平等無佛劫與有佛劫平等一佛劫中有不可說佛不可說佛劫\n中有一\n> 佛有量劫與無量劫平等無量劫與有量劫平等有盡劫與無盡劫平\n等無盡劫與有盡劫平等不可說劫與一念平等一念與不可說劫平等一切\n>\n劫入非劫非劫入一切劫欲於一念中盡知前際後際及現在一切世界成壞\n劫故發阿耨多羅三藐三菩提心是名初發心大誓莊嚴了知一切\n> 劫神通\n智。\n【論】十一菩薩初發心\n已\n下至了知一切劫神通智可十六行經明初發心\n菩薩了劫成壞難知分。\n【經】佛子復置\n> 此喻假使有人於一念頃能知東方阿僧祇世界所有眾生\n種種差別解念念如是盡阿僧祇劫有第二人於一念頃能知前人阿僧祇劫\n所知眾\n> 生諸解差別如是亦盡阿僧祇劫次第展轉乃至第十南西北方四維\n上下亦復如是佛子此十方眾生種種差別解可知邊際。\n【論】十二復\n> 置此喻\n已\n下至可知邊際可六行經明且舉所解廣大猶可能\n知分。\n【經】菩薩初發阿耨多羅三\n> 藐三菩提心功德善根無有能得知其際者何\n以故佛子菩薩不齊限但為知爾所眾生解故發阿耨多羅三藐三菩提心為\n盡知一切世界所有\n> 眾生種種差別解故發阿耨多羅三藐三菩提心所謂欲\n知一切差別解無邊故一眾生解無數眾生解平等故欲得不可說差別解方\n便智光明\n> 故欲悉知眾生海各各差別解盡無餘故欲悉知過現未來善不善\n種種無量解故欲悉知相似解不相似解故欲悉知一切解即是一解一解即\n\n> 是一切解故欲得如來解力故欲悉知有上解無上解有餘解無餘解等解不\n等解差別故欲悉知有依解無依解共解不共解有邊解無邊解差別\n> 解無差\n別解善解不善解世間解出世間解差別故欲於一切妙解大解無量解正位\n解中得如來解脫無障礙智故欲以無量方便悉知十方一\n> 切眾生界一一眾\n生淨解染解廣解略解細解麤解盡無餘故欲悉知深密解方便解分別解自\n然解隨因所起解隨緣所起解一切解網悉無餘\n> 故發阿耨多羅三藐三菩提\n心。\n【論】十三菩薩初發心\n已\n下至三藐三菩提心可二十行半經明初發心菩\n薩知解廣大難知分。\n\n>\n【經】佛子復置此喻假使有人於一念頃能知東方無數世界一切眾生諸\n根差別念念如是經阿僧祇劫\n> 有第二人於一念頃能知前人阿僧祇劫念念\n所知諸根差別如是廣說乃至第十南西北方四維上下亦復如是佛子此十\n方世界所有眾生諸\n> 根差別可知邊際。\n【論】十四佛子復置此喻\n已\n下至可知邊際可六行經明且舉知眾生根廣\n多猶能可知分。\n【經】菩薩初發阿\n> 耨多羅三藐三菩提心功德善根無有能得知其際者何\n以故菩薩不齊限但為知爾所世界眾生根故發阿耨多羅三藐三菩提心為\n盡知一切\n> 世界中一切眾生根種種差別廣說乃至欲盡知一切諸根網故發\n阿耨多羅三藐三菩提心。\n【論】十五菩薩初發心\n已\n下至三藐三菩\n> 提心可五行半經明初發心菩薩\n善知眾生根性廣大難量分。\n【經】佛子復置此喻假使有人於一念頃能知東方無數世界所有眾生種\n\n> 種欲樂念念如是盡阿僧祇劫次第廣說乃至第十南西北方四維上下亦復\n如是此十方眾生所有欲樂可知邊際。\n【論】十六佛子復置此喻\n已\n下至可知邊際可四行經明且舉所欲樂廣大\n猶可知分。\n【經】菩薩初發阿耨多羅三藐三\n> 菩提心功德善根無有能得知其際者何\n以故佛子菩薩不齊限但為知爾所眾生欲樂故發阿耨多羅三藐三菩提心\n為盡知一切世界所有眾\n> 生種種欲樂廣說乃至欲盡知一切欲樂網故發阿\n耨多羅三藐三菩提心。\n【論】十七菩薩初發心\n已\n下至三藐三菩提心可六行經明\n> 初心菩薩所知\n一切眾生欲樂廣大難知分。\n【經】佛子復置此喻假使有人於一念頃能知東方無數世界所有眾生種\n種方便如是廣說\n> 乃至第十南西北方四維上下亦復如是此十方眾生種種\n方便可知邊際。\n【論】十八佛子復置此喻\n已\n下至可知邊際可四行經明且\n> 舉所知眾生方\n便廣大猶可知分。\n【經】菩薩初發阿耨多羅三藐三菩提心功德善根無有能得知其際者何\n以故佛子菩薩不齊限但為知爾所世界眾生種種方便故發阿耨多羅三藐\n三菩提心為盡知一切世界所有眾生種種方便廣說乃至\n> 欲盡知一切方便\n網故發阿耨多羅三藐三菩提心。\n【論
