】十九菩薩初發心\n已\n下至三菩提心可六行經明初心菩薩善知一切\n眾生\n> 種種方便廣大難知分。\n【經】佛子復置此喻假使有人於一念頃能知東方無數世界所有眾生種\n種差別心廣說乃至此十方世界所有眾\n> 生種種差別心可知邊際。\n【論】二十佛子復置此喻\n已\n下至可知邊際可三行經且舉所有一切眾生\n心廣大猶可知分。\n【經】菩\n> 薩初發阿耨多羅三藐三菩提心功德善根無有能得知其際者何\n以故佛子菩薩不齊限但為知爾所眾生心故發阿耨多羅三藐三菩提心為\n\n> 悉知盡法界虗空界無邊眾生種種心乃至欲盡知一切心網故發阿耨多羅\n三藐三菩提心。\n【論】二十一菩薩初發心\n已\n下至三菩提\n> 心可五行半經明初發心菩薩知\n一切眾生差別心廣大難知分。\n【經】佛子復置此喻假使有人於一\n> 念頃能知東方無數世界所有眾生種\n種差別業廣說乃至此十方眾生種種差別業可知邊際菩薩初發阿耨多羅\n三藐三菩提心善根邊際不\n> 可得知。\n【論】二十二佛子復置此喻\n已\n下至不可得知有四行經明且舉所有眾生\n業廣大猶可知分。\n【經】何以故佛子菩薩不\n> 齊限但為知爾所眾生業故發阿耨多羅三藐三\n菩提心欲悉知三世一切眾生業乃至欲悉知一切業網故發阿耨多羅三藐\n三菩提心。\n【\n> 論】二十三何以故\n已\n下至三菩提心可三行半經明初心菩薩知眾生差\n別業廣大難知分。\n【經】佛子復置此喻假使有人於一念頃\n> 能知東方無數世界所有眾生種\n種煩惱念念如是盡阿僧祇劫此諸煩惱種種差別無有能得知其邊際有第\n二人於一念頃能知前人阿僧祇\n> 劫所知眾生煩惱差別如是復盡阿僧祇劫\n次第廣說乃至第十南西北方四維上下亦復如是佛子此十方\n> 眾生煩惱差\n別可知邊際。\n【論】二十四佛子復置此喻\n已\n下至可知邊際有七行經且舉如眾生煩惱\n廣大猶可能知分。\n【經】\n> 菩薩初發阿耨多羅三藐三菩提心善根邊際不可得知何以故佛子\n菩薩不齊限但為知爾所世界眾生煩惱故發阿耨多羅三藐三菩提心為盡\n>\n知一切世界所有眾生煩惱差別故發阿耨多羅三藐三菩提心所謂欲盡知\n輕煩惱重煩惱眠煩惱起煩惱一一眾生無量煩惱種種差別種種\n> 覺觀淨治\n一切諸襍染故欲盡知依無明煩惱愛相應煩惱斷一切諸有趣煩惱結故欲\n盡知貪分煩惱瞋分煩惱癡分煩惱等分煩惱斷一切煩\n> 惱根本故欲悉知我\n煩惱我所煩惱我慢煩惱覺悟一切煩惱盡無餘故欲悉知從顛倒分別生根\n本煩惱隨煩惱因身見生六十二見調伏一切\n> 煩惱故欲悉知蓋煩惱障煩惱\n發大悲救護心斷一切煩惱網令一切智性清淨故發阿耨多羅三藐三菩提\n心。\n【論】二十五菩薩初發心\n>\n已\n下至三藐三菩提心有十六行經明初心菩薩\n所知一切眾生煩惱廣大難知分。\n【經】佛子復\n> 置此喻假使有人於一念頃以諸種種上味飲食香華衣服幢\n幡傘蓋及僧伽藍上妙宮殿寶帳網幔種種莊嚴師子之座及眾妙寶供養東\n方無\n> 數諸佛及無數世界所有眾生恭敬尊重禮拜讚歎曲躬瞻仰相續不絕\n經無數劫又歡彼眾生悉令如是供養於佛至佛滅後各為起塔其塔高廣\n> 無\n數世界眾寶所成種種莊嚴一一塔中各有無數如來形像光明徧照無量世\n界經無數劫南西北方四維上下亦復如是。\n【論】二十六\n> 佛子復置此喻\n已\n下至亦復如是可九行半經且明供養廣大\n難知猶可知分。\n【經】佛子於汝意云何此人功德寧為多不天帝言是人\n> 功德唯佛乃知餘\n無能測佛子此人功德比菩薩初發心功德百分不及一千分不及一百千分\n不及一乃至優波尼沙陀分亦不及一。\n【論\n> 】二十七佛子於汝意云何\n已\n下至亦不及一可四行半經明初發心供\n養廣大難知分。\n【經】佛子復置此喻假使復有第二人於一念\n> 中能作前人及無數世界所\n有眾生無數劫中供養之事念念如是以無量種供養之具供養無量諸佛如\n\n> 來及無量世界所有眾生經無量劫其第三人乃至第十人皆亦如是於一念\n中能作前人所有供養念念如是以無邊無等不可數不可稱不可思\n> 不可量\n不可說不可說不可說供養之具供養無邊乃至不可說不可說諸佛及爾許\n世界所有眾生經無邊乃至不可說不可說劫至佛滅後各\n> 為起塔其塔高廣\n乃至住劫亦復如是。\n【論】二十八佛子復置是喻至亦復如是有十行半經明且舉供養及起塔\n廣多猶可知分。\n【\n> 經】佛子此前功德比菩薩初發心功德百分不及一千分不及一百千分\n不及一乃至優波尼沙陀分亦不及一何以故佛子菩薩摩訶薩不齊限\n> 但為\n供養爾所佛故發阿耨多羅三藐三菩提心為供養盡法界虗空界不可說不\n可說十方無量去來現在所有諸佛故發阿耨多羅三藐三菩\n> 提心發是心\n已\n。\n【論】二十九佛子此前功德\n已\n下至發是心\n已\n有七行經明初心菩薩供養\n功德廣大難知分次直就法說分\n> 。\n【經】能知前際一切諸佛始成正覺及般涅槃能信後際一切諸佛所有善\n根能知現在一切諸佛所\n> 有智慧彼諸佛所有功德此菩薩能信能受能修能\n得能知能證能成就能與諸佛平等一性。\n【論】三十能知前際一切諸佛\n已\n下至能\n> 與諸佛平等一性可四行經是初\n發心\n已\n能知三世諸佛成佛及涅槃智慧平等分攝佛功德分。\n【經】何以故此菩薩為不斷一切如來\n> 種性故發心為充徧一切世界故發\n心為度脫一切世界眾生故發心為悉知一切世界成壞故發心為悉知一切\n眾生垢淨故發心為悉知一切\n> 世界三有清淨故發心為悉知一切眾生心樂\n煩惱習氣故發心為悉知一切眾生死此生彼故發心為悉知一切眾生諸根\n方便故發心為悉知\n> 一切眾生心行故發心為悉知一切眾生三世智故發\n心。\n【論】三十一何以故\n已\n下至三世智故發心可九行經明菩薩初發心志意\n\n> 所求甚深深廣分。\n【經】以發心故常為三世一切諸佛之所憶念當得三世一切諸佛無上菩\n提即為三世一切諸佛與其妙法即與三世一\n> 切諸佛體性平等\n已\n修三世一\n切諸佛助道之法成就三世一切諸佛力無所畏莊嚴三世一切諸佛不共佛\n法悉得法界一切諸佛說法智慧。\n【論】三十二以發心故\n已\n下至說法智慧有六行經明菩薩發心\n已\n得三世\n一切諸佛憶\n> 念與法及自力昇進分得果佛因佛分。\n【經】何以故以是發心當得佛故應如此人即與三世諸佛同等即與三世\n諸佛如來境界平等即與\n> 三世諸佛如來功德平等得如來一身無量身究竟\n平等真實智慧纔發心時即為十方一切諸佛所共稱歎即能說法教化調伏\n一切世界所有\n> 眾生即能震動一切世界即能光照一切世界即能息滅一切\n世界諸惡道苦即能嚴淨一切國土即能於一切世界中示現成佛即能令一\n切眾\n> 生皆得歡喜即能入一切法界性即能持一切佛種性即能得一切佛智\n慧光明。\n【論】三十三何以故\n已\n下至智慧光明有十行半經明\n> 纔初發心菩薩成佛\n利生同三世諸佛分化用分無著分。\n【經】此初發心菩薩不於三世少有所得所謂若諸佛若諸佛法若菩薩若\n菩薩\n> 法若獨覺若獨覺法若聲聞若聲聞法若世間若世間法若出世間若出\n世間法若眾生若眾生法唯求一切智於諸法界心無所著。\n【論】三十四此初發心菩薩\n已\n下至心無所著有四行半經明初發心菩薩\n志樂所知世間出世間無限分瑞分\n> 。\n大方廣佛新華嚴經合論卷第三十四\n音切\n屍\n(式之切)\n。\n蟲\n(直弓切)\n。\n視\n(是音)\n。\n顧\n(古悟切)\n。\n矢\n(式視切)\n。\n喉\n(矦音)\n。\n吻\n(武粉切)\n。\n抑\n(於力切)\n。\n訊\n\n>\n(信音)\n。\n預\n(羊洳切)\n。\n羯\n(揭音)\n。\n剃\n(他計切)\n。\n髮\n(發音)\n\n> 。\n傘\n(蘇早切)\n。\n纔\n(才音)\n。\n頃\n(去頸切)\n。\n窺\n(去隨切)\n。\n釐\n\n> (里之切)\n。\n恰\n(苦洽切)\n。\n廓\n(苦郭切)\n。\n匹\n(疋音)\n。\n大方廣佛新華嚴經合論卷第三十五\n唐于闐國三藏沙門實叉難陀譯經\n唐太原方山長者李通玄造論\n唐福州開元\n> 寺沙門志寧釐經合論\n初發心功德品第十七之餘\n【經】爾時佛神力故十方各一萬佛剎微塵數世界六種震動所謂動徧動\n等徧動起徧\n> 起等徧起踊徧踊等徧踊震徧震等徧震吼徧吼等徧吼擊徧擊\n等徧擊。\n【論】三十五爾時佛神力\n已\n下至等徧擊有三行半經明大地\n> 震動分。\n【經】兩眾天華天香天末香天華鬘天衣天寶天莊嚴具作天妓樂放天光\n明及天音聲。\n\n> 【論】三十六天雨眾華\n已\n下至及天音聲有兩行經明諸天興供分證成分\n如動地興供明法威力亦明大眾法悅心悅地動明心境體無二\n> 故境由心現\n故。\n【經】是時十方各過十佛剎微塵數世界外有萬佛剎微塵數佛同名法慧\n各現其身在法慧菩薩前作如是言善哉善哉\n> 法慧汝於今者能說此法我等\n十方各萬佛剎微塵數佛亦說是法一切諸佛悉如是說。\n【論】三十七是時十方\n已\n下至悉如是說有四\n> 行半經明十方同號佛來現\n其前歎譽許可法同分如十方各過萬佛剎微塵數佛同名法慧來現其前者\n為明與十方諸佛智慧合故萬佛剎塵\n> 者明昇進修行啟迷悟法之量十信十\n十住百十行千總是明昇進見諦解迷悟法之名。\n【經】汝說此法時有萬佛剎微塵數菩薩發菩提心\n> 我等今者悉授其記於\n當來世過千不可說無邊劫同一劫中而得作佛出興於世皆號清淨心如來\n所住世界各各差別我等悉當護持此法令\n> 未來世一切菩薩未曾聞者皆悉\n得聞。\n【論】三十八汝說此法時\n已\n下至皆悉得聞有五行經明說此法時十方各\n過萬佛剎塵菩薩發心授記分如萬佛剎微塵數菩薩發心授過千不可說劫\n成佛之記皆同號之為清淨心者亦明達如是千\n> 不可說劫量法門總清淨故\n故佛號清淨心非是實有如情所見長遠之劫也總明當位隨迷悟法之名不\n是存其劫量之說如妄情所見也自此\n>\n已\n下直至品末如文自具如文稱歎。\n【經】如此娑婆世界四天下須彌頂上說如是法令諸眾生聞\n已\n受化如是\n十方百千億那由\n> 他無數無量無邊無等不可數不可稱不可思不可量不可\n說盡法界虗空界諸世界中亦說此法教化眾生其說法者同名法慧悉以佛\n神力故\n> 世尊本願力故為欲顯示佛法故為以智光普照故為欲開闡實義故\n為令證得法性故為令眾會悉歡喜故為欲開示佛法因故為得一切佛平等\n>\n故為了法界無有二故說如是法。\n【論】三十九如此娑婆世界\n已\n下至說如是法有九行半經明十方所說法\n人及法門一時同說分\n> 。\n【經】爾時法慧菩薩普觀盡虗空界十方國土一切眾會欲悉成就諸眾生\n故欲悉淨治諸業果報故欲悉開顯清淨法界故欲悉拔除襍染\n> 根本故欲悉\n增長廣大信解故欲悉令知無量眾生根故欲悉令知三世法平等故欲悉令\n觀察涅槃界故欲增長自清淨善根故承佛威力即說\n> 頌言。\n【論】四十爾時法慧\n已\n下至說頌有六行半經明法慧菩薩觀欲所緣之法\n說頌稱歎分\n\n> 已\n下頌文有二百四十二行四行一頌其頌有六十段頌都計有\n二百四十行末後兩行頌總結頌意歎勸發心初一百六十八行是總都歎佛\n\n> 果\n已\n來五位及信等諸法明初發心者志樂智德總含一切諸佛智德體用始\n成一念初發心菩薩位也方明初發心境與心不二若志樂毫釐\n> 不似如來所\n修法身悲智願行者不名初發心菩薩故。\n【經】\n為利世間發大心\n其心普徧於十方\n眾生國土三世法\n佛及菩薩最勝\n> 海\n究竟虗空等法界\n所有一切諸世間\n如諸佛法皆往詣\n如是發心無退轉\n慈念眾生無暫捨\n離諸惱害普饒益\n光明照世為所歸\n\n> 十方護念難思議\n十方國土悉趣入\n一切色形皆示現\n如佛福智廣無邊\n隨順修因無所著\n有剎仰住或傍覆\n麤妙廣大無量種\n菩薩\n> 一發最上心\n悉能往詣皆無礙\n菩薩勝行不可說\n皆勤修習無所住\n見一切佛常欣樂\n普入於其深\n> 法海\n哀愍五趣諸羣生\n令除垢穢普清淨\n紹隆佛種不斷絕\n摧滅魔宮無有餘\n已\n住如來平等性\n善修微妙方便道\n於佛境界起信\n> 心\n得佛灌頂心無著\n兩足尊所念報恩\n心如金剛不可沮\n於佛所行能照了\n自然修習菩提行\n諸趣差別想無量\n業果及心亦非一\n\n> 乃至根性種種殊\n一發大心悉明見\n其心廣大等法界\n無依無變如虗空\n趣向佛智無所取\n諦了實際離分別\n知眾生心無生想\n了達\n> 諸法無法想\n雖普分別無分別\n億那由剎皆往詣\n無量諸佛妙法藏\n隨順觀察悉能入\n眾生根行靡不知\n到如是處如世尊\n清淨大願\n> 恒相應\n樂供如來不退轉\n人天見者無厭足\n常為諸佛所護念\n其心清淨無所依\n雖觀深法而不取\n>\n如是思惟無量劫\n於三世中無所著\n其心堅固難制沮\n趣佛菩提無障礙\n志求妙道除蒙惑\n周行法界不告勞\n知語言法皆寂滅\n但\n> 入真如絕異解\n諸佛境界悉順觀\n達於三世心無礙\n菩薩始發廣大心\n即能徧往十方剎\n法門無量不可說\n智光普照皆明了\n大悲廣\n> 度最無比\n慈心普徧等虗空\n而於眾生不分別\n如是清淨遊於世\n十方眾生悉慰安\n一切所作皆真實\n恒以淨心不異語\n常為諸佛共\n> 加護\n過去所有皆憶念\n未來一切悉分別\n十方世界普入中\n為度眾生令出離\n菩薩具足妙智光\n善了因緣無有疑\n一切迷惑皆除斷\n>\n如是而遊於法界\n魔王宮殿悉摧破\n眾生翳膜咸除滅\n離諸分別心不動\n善了如來之境界\n三世\n> 疑網悉\n已\n除\n於如來所起淨信\n以信得成不動智\n智清淨故解真實\n為令眾生得出離\n盡於後際普饒益\n長時勤苦心無厭\n乃至\n> 地獄亦安受\n福智無量皆具足\n眾生根欲悉了知\n及諸業行無不見\n如其所樂為說法\n了知一切空無我\n慈念眾生恒不捨\n以一大悲\n> 微妙音\n普入世間而演說\n放大光明種種色\n普照眾生除黑闇\n光中菩薩坐蓮華\n為眾闡揚清淨法\n於一毛端現眾剎\n諸大菩薩皆充\n> 滿\n眾會智慧各不同\n悉能明了眾生心\n十方世界不可說\n一念周行無不盡\n利益眾生供養佛\n於諸佛所問深義\n於諸如來作父想\n\n> 為利眾生修覺行\n智慧善巧通法藏\n入深智處無所著\n隨順思惟說法界\n經無量劫不可盡\n智雖善入無處所\n無有疲厭無所著\n<<\n三世諸佛家中生\n證得如來妙法身\n普為羣生現眾色\n譬如幻師無不作\n或現始修殊勝行\n或現初生及\n> 出家\n或現樹下成菩提\n或為眾生示涅槃\n菩薩所住希有法\n唯佛境界非二乘\n身語意想皆\n已\n除\n種種隨宜悉能現\n菩薩所得諸\n> 佛法\n眾生思惟發狂亂\n智入實際心無礙\n普現如來自在力\n此於世間無與等\n何況復增殊勝行\n雖未具足一切智\n已\n獲如來自在\n> 力\n已\n住究竟一乘道\n深入微妙最上法\n善知眾生時非時\n為利益故現神通\n分身徧滿一切剎\n放淨光明除世闇\n譬如龍王起大雲\n>\n普雨妙雨悉充洽\n觀察眾生如幻夢\n以業力故常流轉\n大悲哀愍咸救拔\n為說無為淨法性\n佛力無量此亦然\n譬如虗空無有邊\n為\n> 令眾生得解脫\n億劫勤修而不倦\n種種思惟妙功德\n善修無上第一業\n於諸勝行恒不捨\n專念生成\n> 一切智\n一身示現無量身\n一切世界悉周徧\n其心清淨無分別\n一念難思力如是\n於諸世間不分別\n於一切法無妄想\n雖觀諸法而不\n> 取\n恒救眾生無所度\n一切世間唯是想\n於中種種各差別\n知想境界險且深\n為現神通而救脫\n譬如幻師自在力\n菩薩神變亦如是\n\n> 身徧法界及虗空\n隨眾生心靡不見\n能所分別二俱離\n襍染清淨無所取\n若縛若解智悉忘\n但願普與眾生樂\n一切世間唯想力\n以智\n> 而入心無畏\n思惟諸法亦復然\n三世推求不可得\n能入過去畢前際\n能入未來畢後際\n能入現在一切處\n常勤觀察無所有\n隨順涅槃\n> 寂滅法\n住於無諍無所依\n心如實際無與等\n專向菩提永不退\n修諸勝行無退怯\n安住菩提不動搖\n>\n佛及菩薩與世間\n盡於法界皆明了\n欲得最勝第一道\n為一切智解脫王\n應當速發菩提心\n永盡諸漏利羣生\n趣向菩提心清淨\n功\n> 德廣大不可說\n為利眾生故稱述\n汝等諸賢應善聽\n無量世界盡為塵\n一一塵中無量剎\n其中諸佛皆無量\n悉能明見無所取\n善知眾\n> 生無生想\n善知言語無語想\n於諸世界心無礙\n悉善了知無所著\n其心廣大如虗空\n於三世事悉明達\n一切疑惑皆除滅\n正觀佛法無\n> 所取\n十方無量諸國土\n一念往詣心無著\n了達世間眾苦法\n悉住無生真實際\n無量難思諸佛所\n悉往彼會而覲謁\n常為上首問如來\n>\n菩薩所修諸願行\n心常憶念十方佛\n而無所依無所取\n恒勸眾生種善根\n莊嚴國土令清淨\n一切\n> 趣生三有處\n以無礙眼咸觀察\n所有習性諸根解\n無量無邊悉明見\n眾生心樂悉了知\n如是隨宜為說法\n於諸染淨皆通達\n令彼修治\n> 入於道\n無量無數諸三昧\n菩薩一念皆能入\n於中想智及所緣\n悉善了知得自在\n菩薩獲此廣大智\n疾向菩提無所礙\n為欲利益諸羣\n> 生\n處處宣揚大人法\n善知世間長短劫\n一月半月及晝夜\n國土各別性平等\n常勤觀察不放逸\n普詣十方諸世界\n而於方處無所取\n\n> 嚴淨國土悉無餘\n亦不曾生淨分別\n眾生是處若非處\n及以諸業感報別\n隨順思惟入佛力\n於此一切悉了知\n一切世間種種性\n種種\n> 所行住三有\n利根及與中下根\n如是一切咸觀察\n淨與不淨種種解\n勝劣及中悉明見\n一切眾生至處行\n三有相續皆能說\n禪定解脫諸三昧\n染淨因起各不同\n及以先世苦樂殊\n淨修佛力咸能見\n眾生業惑續諸趣\n斷此諸趣得寂滅\n>\n種種漏法永不生\n并其習種悉了知\n如來煩惱皆除盡\n大智光明照於世\n菩薩於佛十力中\n雖未證得亦無疑\n菩薩於一毛孔中\n普\n> 現十方無量剎\n或有襍染或清淨\n種種業作皆能了\n一微塵中無量剎\n無量諸佛及佛子\n諸剎各別無襍亂\n如一一切悉明見\n於一毛\n> 孔見十方\n盡虗空界諸世間\n無有一處空無佛\n如是佛剎悉清淨\n於毛孔中見佛剎\n復見一切諸眾生\n三世六趣各不同\n晝夜月時有\n> 縛解\n如是大智諸菩薩\n專心趣向法王位\n於佛所住順思惟\n而獲無邊大歡喜\n菩薩分身無量億\n供養一切諸如來\n神通變現勝無比\n>\n佛所行處皆能住\n無量佛所皆鑽仰\n所有法藏悉躭味\n見佛聞法勤修行\n如飲甘露心歡喜\n已\n\n> 獲如來勝三昧\n善入諸法智增長\n信心不動如須彌\n普作羣生功德藏\n慈心廣大徧眾生\n悉願疾成一切智\n而恒無著無依處\n離諸煩\n> 惱得自在\n哀愍眾生廣大智\n普攝一切同於\n己\n知空無相無真實\n而行其心不懈退\n菩薩發心功德量\n億劫稱揚不可盡\n以出一切\n> 諸如來\n獨覺聲聞安樂故\n十方國土諸眾生\n皆悉施安無量劫\n勸持五戒及十善\n四禪四等諸定處\n復於多劫施安樂\n令斷諸惑成羅\n> 漢\n彼諸福聚雖無量\n不與發心功德比\n【論】以此初頌有一百六十八行且總歎信等六位因果及如來智德總歎\n令初發心者法之相似\n> 。\n【經】\n又教億眾成緣覺\n獲無諍行微妙道\n以彼而校菩提心\n算數譬喻無能及\n一念能過塵\n> 數剎\n如是經於無量劫\n此諸剎數尚可量\n發心功德不可知\n過去未來及現在\n所有劫數無邊量\n此諸劫數猶可知\n發心功德無能測\n>\n以菩提心徧十方\n所有分別靡不知\n一念三世悉明達\n利益無量眾生故\n十方世界諸眾生\n欲解方便意所行\n及以虗空際可測\n發\n> 心功德難知量\n菩薩志願等十方\n慈心普洽諸羣生\n悉使修成佛功德\n是故其力無邊際\n眾生欲解心所樂\n諸根方便行各別\n於一念\n> 中悉了知\n一切智智心同等\n一切眾生諸惑業\n三有相續無暫斷\n此諸邊際尚可知\n發心功德難思議\n> >\n發心能離業煩惱\n供養一切諸如來\n業惑既離相續斷\n普於三世得解脫\n一念供養無邊佛\n亦供無數諸眾生\n悉以香華及妙鬘\n\n> 寶幢幡蓋上衣服\n美食珍座經行處\n種種宮殿悉嚴好\n毗盧遮那妙寶珠\n如意摩尼發光曜\n念念如是持供養\n經無量劫不可說\n其人\n> 福聚雖復多\n不及發心功德大\n所說種種眾譬喻\n無有能及菩提心\n以諸三世人中尊\n皆從發心而得生\n發心無礙無齊限\n欲求其量\n> 不可得\n一切智智誓必成\n所有眾生皆永度\n發心廣大等虗空\n生諸功德同法界\n所行普徧如無異\n永離眾著佛平等\n一切法門無不\n> 入\n一切國土悉能往\n一切智境咸通達\n一切功德皆成就\n一切能捨恒相續\n淨諸戒品無所著\n具\n> 足無上大功德\n常勤精進不退轉\n入深禪定恒思惟\n廣大智慧共相應\n此是菩薩最勝地\n出生一切普賢道\n三世一切諸如來\n靡不護\n> 念初發心\n悉以三昧陀羅尼\n神通變化共莊嚴\n十方眾生無有量\n世界虗空亦如是\n發心無量過於彼\n是故能生一切佛\n菩提心是十\n> 力本\n亦為四辯無畏本\n十八不共亦復然\n莫不皆從發心得\n諸佛色相莊嚴身\n及以平等妙法身\n智慧無著所應供\n悉以發心而得有\n>\n一切獨覺聲聞乘\n色界諸禪三昧樂\n及無色界諸三昧\n悉以發心作其本\n一切人天自在樂\n及以諸趣種種樂\n進定根力等眾樂\n靡\n> 不皆由初發心\n以因發起廣大心\n則能修行六種度\n勸諸眾生行正行\n於三界中受安樂\n住佛無礙\n> 實義智\n所有妙業咸開闡\n能令無量諸眾生\n悉斷惑業向涅槃\n智慧光明如淨日\n眾行具足猶滿月\n功德常盈譬巨海\n無垢無礙同虗\n> 空\n普發無邊功德願\n悉與一切眾生樂\n盡未來際依願行\n常勤修習度眾生\n無量大願難思議\n願令眾生悉清淨\n空無相願無依處\n\n> 以願力故皆明顯\n了法自性如虗空\n一切寂滅悉平等\n法門無數不可說\n為眾生說無所著\n十方世界諸如來\n悉共讚歎初發心\n此心\n> 無量德所嚴\n能到彼岸同於佛\n如眾生數爾許劫\n說其功德不可盡\n以住如來廣大家\n三界諸法無能喻\n欲知一切諸佛法\n宜應速發\n> 菩提心\n此心功德中最勝\n必得如來無礙智\n眾生心行可數知\n國土微塵亦復然\n虗空邊際乍可量\n>\n發心功德無能測\n出生三世一切佛\n成就世間一切樂\n增長一切勝功德\n永斷一切諸疑惑\n開示一切妙境界\n盡除一切諸障礙\n成\n> 就一切清淨剎\n出生一切如來智\n欲見十方一切佛\n欲施無盡功德藏\n欲滅眾生諸苦惱\n宜應速發菩提心\n【論】然後七十四行頌始\n> 重頌前四十段中校量發心功德廣大之量如文\n具明隨文稱歎四行一頌准例知之如是校量初發心功德設使以等虗空無\n限境以一切樂具\n> 總供養無限眾生皆令得人天勝樂又教令得四沙門果及\n辟支佛及三乘出世菩提如是虗空境界及所度眾生雖等然未令所化眾生\n得成佛\n> 亦不可比於此教中初發心乘如來大智等佛所行普化眾生皆成佛\n故發菩提心以是義故雖然所舉境界廣狹雖等所化眾生成佛不成佛不等\n>\n故不可為比故是故此品下文云初發心菩薩不於三世少有所得所謂若諸\n佛若諸佛法若菩薩若菩薩法若獨覺若獨覺法若聲聞若聲聞法\n> 乃至廣說\n如經但為唯求一切智於諸法界心無所著發菩提心略說菩提其法有四一\n聲聞菩提二緣覺\n> 菩提三權教菩薩菩提四一乘菩薩佛果菩提前三竝是出\n世菩提佛果菩提是法身大智大悲真俗萬行法界圓滿菩提無出入故三乘\n菩提雖\n> 觀四諦十二緣而亦未知四諦十二緣之實體非獨二乘不知三種意\n生身菩薩位登十地猶未能悉知唯一乘菩薩以智方知至十地品具明但且\n>\n略而總言三乘中觀苦集滅道及十二緣生及行六波羅蜜菩薩厭苦忻真但\n求出世大悲菩薩方云留惑潤生一乘菩薩以智觀四諦十二緣生\n> 無明即智\n苦諦即聖諦於生死涅槃無解縛性是故此經名苦聖諦集聖諦如是十聖諦\n十十二因緣總是法界自性無縛無解自在之緣不名無\n> 明不名苦諦如是總\n觀萬法如是名為一乘法界緣起智悲自在任性緣生一切眼耳鼻舌身莫不\n皆是法界緣起自在法門一切諸佛知見神通\n> 道力以此而有但以禪定觀照\n諸波羅蜜而顯發之是故學者應如是修如是悟入\n已\n下頌文四行一頌如文\n自具不煩更釋有智之士隨文\n> 稱歎令眾發心。\n\n### 5.6 智俨《搜玄记》（T1732）——本品无窗口〔缺口〕\n\n智俨《华严经搜玄记》现存卷帙不覆本品（搜玄记残本止于前段），故本品**〔无智俨窗口·缺口·待后续整仓补〕**。如实标注，不臆造。\n\n### 5.7 海云继梦讲记旁参（玄谈段·只标不改）\n\n- 讲记 ep10 §A01（七處九會研議·十處判）于术语表记第三處忉利天宮：\"這個地方開始就講行法了\"——讲者以**行**字点第三会之开；本品居该会\"發心勝德\"一环（前二品明位及行·今顯勝德），于理解本会十住法门之整体方向可为旁参〔讲师玄谈·非正行〕〔⚖宏观架构语·非文本科判〕。\n- 讲记 ep11 §A10–A11（玄谈段第三会分）：\"智首所問於第三會開頭・就是以四品經（為首）\"，列\"十住品・梵行品・初發心功德品・（明法品）為首\"、\"這個四品從漸教解門的立場來講起步\"——本品居讲者四品之**第三**；然讲者只标名目、未及本品行相之释〔⚖品名次第係玄谈段口诵科判·待 Ep13+ 依 `T10n0279` 品目核〕。\n- 本品**正行段逐字讲记**：讲记正行段（ep13–15）未及第三会〔正行讲记·未上架·待补〕；讲者之说疑误只标不改、不入经文疏解（编务总则）。\n\n---\n\n## 六、八十 / 六十对读\n\n### 6.1 六十品题对应\n\n| 八十（T10n0279） | 六十（T09n0278） | 卷次 | 入库状态 |\n|---|---|---|---|\n| 初發心功德品第十七 | 初发心菩萨功德品第十三 | 卷第九–十（`p.0449c22` 起） | **〔本批未录·未竟〕** |\n\n### 6.2 对读说明\n\n本品在六十华严相当者为〈初发心菩萨功德品第十三〉，**起卷九 `p.0449c22`，历卷十至 `p.0458c13`**（CJK 9,555·L.206 实测）。全本 `T09n0278.xml` 六十卷已在仓；`data/references/cbeta_txt/` 拆卷 txt 仅 1–8，属工作语料口径而非底本缺失（〔L.206 订正〕原「卷九尚未入库」为过期陈述）。本品六十原文**本批未及全录**〔未竟〕。校勘口径：仅登记品题对应关系（八十第十七 ↔ 六十第十三），**不作正文逐字对读**，不臆造等值（承第二会 P8 铁律）。\n\n本品在六十华严（T09n0278）相当者为〈初发心菩萨功德品第十三〉，**起卷九 `p.0449c22`·跨卷十**（CJK 9,555）。全本 `T09n0278.xml` 已在仓（拆卷 txt 仅 1–8 为工作语料口径〔L.206 订正〕），本品六十全文照录**本批未及**〔未竟〕。\n\n| 八十（T10n0279） | 六十（T09n0278） | 卷次 | 状态 |\n|---|---|---|---|\n| 初發心功德品第十七 | 初发心菩萨功德品第十三 | 卷第九–十 | 〔本批未录·未竟〕 |\n\n**口径**：仅登记品题对应（八十第十七 ↔ 六十第十三），不作正文逐字对读，不臆造等值（承第二会 P8 铁律）。卷九入库后可补 §6.3 六十全本照录〔未竟·待后续批〕。\n\n---\n\n## 七、数据层\n\n### 7.1 单元切分（实测）\n\n平文器 27 单元＝1 head（品题）＋25 p（长行）＋1 lg（重颂 3,388）＋1 byline（于闐译场）。\n\n### 7.2 字数与结构\n\n- 品界 CJK-only 总 **8,207**：长行 p 4,785＋重颂 lg 3,388＋品题/byline 21（余为标点差）；\n- 重颂七言为主·净句段 484·均长 7.0 言。\n\n### 7.3 品题与译场\n\n品题「初發心功德品第十七」（80-000）；byline「于闐國三藏實叉難陀奉 制譯」（80-026）。\n\n### 7.4 文本现象\n\n- 「法  慧菩薩言」独立 p（80-002·重计）；\n- 「即說頌言」重出（80-023 末、80-024）；\n- 数词「優波尼沙陀」四见，为校量数极细位。\n\n### 7.5 数据科学四视角（本品重点·功德数量级）\n\n本品为第三会最长品（CJK 8,207），核心为「约喻校量分」以**十一大喻**层层推极发心功德之数量级。数据科学视角聚焦校量数词之递增结构与长行/重颂之体量分布。\n\n#### 7.5.1 校量数量级·词频分布\n\n| 关键词 | 频次（body80 nsh·10,187）。\n\n### 附录二·十一大喻次第\n\n利樂眾生喻→速疾步剎喻→知劫成壞喻→善知勝解喻→善知諸根喻→善知欲樂喻→善知方便喻→善知他心喻→善知業相喻→善知煩惱喻→供佛及生喻。（T1735·SH @1200–1260）\n\n### 附录三·校量数词表（澄观释）\n\n| 数词 | 澄观训释 | 出处 |\n|---|---|---|\n| 阿僧祇 | 无央数（asamkhyeya） | 校量基 |\n| 那由他 | 由数·亿（nayuta） | 80-006 |\n| 歌羅分 | 「此云豎析。人身上毛。為百分中之一分也。或曰十六分中之一分義。譯為校量分」 | T1735 |\n| 優波尼沙陀 | 「此云近少。謂少許相近比類之分也」 | T1735 |\n\n### 附录四'：澄观疏本科段全文照录\n\n以下按 NFKD 归一口径逐 60 字分段照录 T1735〈初發心功德品第十七〉窗口全文（raw @239289-249476·len=10187）：\n\n`[SH-0000]` 初發心功德品第十七\n初來意者。謂前二品明位及行。今顯勝德。舉初況後巧顯深勝。故次\n來也。又前品末云初發心時便成正覺。未知\n`[SH-0060]` 此心有何功用。頓得爾\n耶。今釋此義故次來也。二釋名者。初有二義。一三種發心之初。二\n十住之初發。亦二義。一發起上求。二三\n`[SH-0120]` 德開發。能知三世佛智故。\n永斷一切疑網故。得如來一身無量身等故。在於信位久已研窮。至此\n位中豁然開悟。故得功齊果位攝德無\n`[SH-0180]` 邊。受斯稱矣。三宗趣者。即以\n初心攝德為宗。令物窮究發心為趣。然住會發心。定是信成就攝。解\n行及證自在後文。生如來家。自\n`[SH-0240]` 約解說。不應謂此便是證收。若謂久\n習無明云何頓成大智者。豈不聞冥室千年之闇一燈倏忽頓除耶。若謂\n云何能知三世佛法者豈不聞\n`[SH-0300]` 具縛凡夫。能知如來祕密藏耶。餘義至文\n當釋。夫機差教別聖旨深玄。並未證真如同居學地。共詳聖智誠曰才\n難。且以淺為深有符理\n`[SH-0360]` 之得。以深為淺有謗法之愆。以遠為近則有益\n於行人。以近為遠則法非我分。諸佛說教貴在俯就物機。後輩學人若\n`[SH-0420]`\n欲高推聖境。儻失大利豈不傷哉。且夕釣磻谿朝升台輔。豈與夫明經\n常選。而語其優劣者哉。況纔生王宮貴極臣佐。寧\n`[SH-0480]` 同百戰夷項備歷艱\n辛。況十千劫之功高。亦非聊爾人耳。是以語其智等虛空而非類。論\n其德碎塵剎而難量。極念劫之圓融。盡法門之\n`[SH-0540]` 重現。初心契於智海。\n豈有邊涯。猶微滴入於天池齊無終始。故經云。發心畢竟二不別。如\n是二心先心難。法慧仰推良在此也。如或\n`[SH-0600]` 未喻勝鬘有文。推佛能知。\n斯言無過餘如賢首品。次正釋文長分為七。一天王請說分。二歎深難\n說分。三約喻校量分。四就法略示分\n`[SH-0660]` 。五動地興供分。六他方證成\n分。七以偈重頌分。又釋於中分二。初長行。後偈頌。前中亦二。初\n此界後結通。前中亦二。初正說。\n`[SH-0720]` 後證成。前中亦二。先問後答。今\n依前辨。初中天帝問者。在彼宮故。聞前速成生疑念故。菩提心是萬\n行主故。問法慧者。是會主故\n`[SH-0780]` 。初心具後之德。唯慧境故。下正顯問\n端。雖則正問功德下。法慧答功德之量。便顯發心之相。是為菩薩善\n巧辯才。第二法慧菩薩言\n`[SH-0840]` 下。歎深難說。所以歎者。法體深廣去疑令\n樂故。下寄言顯說未盡其源故。於中初句總。言甚深者。謂約時深徹\n後際。約德深至佛果\n`[SH-0900]` 。約理深同法界。約行深包萬行。並深中之極故\n云甚深。又數廣難量理玄叵測。雖深非甚。今即少而多即事而理。初\n心具後是謂甚深\n`[SH-0960]` 。下十句別由斯十義。故曰甚深。於中初四能所對\n辨。各前能後所。一離言故難宣示。二無相故超心\n`[SH-1020]` 識。三非自力辯能\n分別。四非劣慧能信解。後六通能所證。五非有所得及一慧能證。六\n非起行及一行能行。七次第修慧不能通達。八\n`[SH-1080]` 九思慧不能思惟籌度。\n十聞慧不能信向趣入。此六後後劣於前前。巧顯深也。所以廣說難\n者。非唯成上甚深。正誡今後令信。第三雖\n`[SH-1140]` 然下。約喻校量分於中\n二。初結前生後。謂約自力則甚深。承力則可說。二佛子下。正顯校\n量中有十一大喻。一利樂眾生喻。二速疾\n`[SH-1200]` 步剎喻。三知劫成壞喻。四\n善知勝解喻。五善知諸根喻。六善知欲樂喻。七善知方便喻。八善知\n他心喻。九善知業相喻。十善知煩惱\n`[SH-1260]` 喻。十一供佛及生喻。然此十一\n喻。後後過於前前故皆捨置前前更舉後後。巧顯深勝。又此諸喻合有\n通別。通但通合發心德廣。謂如\n`[SH-1320]` 初喻中便合云。為悉知一切世界成壞\n等。此不同於喻也。別謂所合同喻。但喻有分限。法無限耳。如初喻\n合云。不但為以一切樂具供\n`[SH-1380]` 養十方等。初一具通具別。下十略無通\n合。此諸喻文皆應有四。一舉喻二徵問。三領答四校量。初後具四。\n中九略無中二。又諸喻內\n`[SH-1440]` 一一皆有十重。皆應舉喻問答校量。文無者\n略。今初。喻十重中。初一廣說。後九略明。初中有四。一舉廣事。\n二徵問三答顯廣。四\n`[SH-1500]` 辨超過。今初有三。先與現世益。文有三廣為供\n具田時。次然後下。與後世樂。後南西下。類餘九方。二徵問。三答\n`[SH-1560]`\n廣並可知。四超過中云歌羅者。此云豎析。人身上毛。為百分中之一\n分也。或曰。十六分中之一分義。譯為校量分。\n`[SH-1620]` 優波尼沙陀者。此云\n近少。謂少許相近比類之分也。百千後即云億分者。中等數也。後九\n略說中文四同前。今初併舉九事樂具皆同。\n`[SH-1680]` 一切所經劫數漸漸增多。\n其所教法轉轉增勝。據初世界亦合漸增。以此十前文標一故。餘無者\n略。若十方共十則界不增。第四校量中\n`[SH-1740]` 三。初辨超過。二何以故者\n徵。徵意云前。云功德除佛難知。何以比此猶少非類。三釋意有二。\n一別翻前喻。謂發心無限前有限故。\n`[SH-1800]` 亦是反釋。二為令如來種性不斷\n下。通對前十總顯具德。亦是順釋。於中有十二句。初三總相對前辨\n勝。一翻前小果。二翻前限處。\n`[SH-1860]` 三翻前有限眾生。下九句即下十喻之\n本。一即第三知劫成壞喻本。二即第四善知勝解喻本。故下文云。乃\n至垢解淨解等。三却是第二\n`[SH-1920]` 速疾步剎喻本。四即第六及第十本。五即\n第九本。六即五七本。七八皆第八喻本。九知佛境界平等。即第十一\n供佛喻本。此中九句即\n`[SH-1980]` 佛。十力智。一知成壞垢淨自性。即業報智。\n心樂即種種解智。知煩惱即漏盡智。生死即天眼智。諸根即根勝劣\n智。方便即禪解脫三\n`[SH-2040]` 昧智。此及佛境並是一切至處道智。心行即種種\n界智。三世智即宿命智。其處非處智以是總故。亦是前三總句中攝。\n然此所知皆約一\n`[SH-2100]` 切無齊限也。下文廣釋其相。第二佛子復置下。明速\n疾步剎喻。然次下。九喻文皆分四。初舉廣喻。\n`[SH-2160]` 二辨超過。三徵四\n釋。釋中皆先反釋後順釋。今初喻中前三可知。四釋中先反釋彰前不\n及。後為了知下順釋。辨此過前。於中十一句\n`[SH-2220]` 初句總。所謂下。別知\n世界相即相入無障礙義。前七正明即入。八一毛端下二對。釋上即入\n所由。略舉三門。初以法性融通門釋。謂\n`[SH-2280]` 一切世界差別性。與一毛端\n體性無二故。是故事隨性融。此彼相即事攬性起。彼此相入各有同體\n異體。準上思之。九一世界中出生一\n`[SH-2340]` 切世界者。此約緣起門釋。謂諸\n緣起更互相生。有其二義。一約體有體無體義。是故相即。二約用有\n力無力義。是故相入。亦有同體\n`[SH-2400]` 異體義。並準上思之。欲知一切世界\n無體性者。約無自性門。以大非定大故。能即小等。十總結。欲以一\n念盡知如是廣無邊際。重重\n`[SH-2460]` 即入無障礙事故。發菩提心。又此言知。\n偈中亦身往彼。第三佛子下。知劫成壞喻。文亦有四。初明喻廣大。\n舉成攝住舉壞兼空。二\n`[SH-2520]` 佛子下。對辨超過。三徵四釋。釋中亦二。先\n反釋後順釋。順中三。初總次所謂下別。三是名下。結能知智別中言\n平等者。通相即相\n`[SH-2580]` 入。就緣就性唯心等殊。皆無障礙故云平等。一長\n短者。如娑婆為短安樂為長。遞傳相望以為長短。二三及四文並可\n知。五量無量者\n`[SH-2640]` 。如勝蓮華界。劫更無有上。名為無量。已下皆有\n量。六有成壞則有盡。無成壞則無盡。標中但云成壞。從多分說。亦\n`[SH-2700]`\n麁盡細不盡。七念劫相望。八劫非劫自有三義。一約未經增\n減\n。縱百\n千年名為非劫。若經增減成壞名劫。二如\n`[SH-2760]` 勝蓮華剎既不可校量。亦無\n劫數故名非劫。三推妄歸真劫入非劫。依真起妄非劫入劫。斯則前七\n事事無礙。此乃理事無礙。九一念速\n`[SH-2820]` 知兼總包無盡。以斯無限安可比\n前。三結能知智。即十通中。知盡未來際劫神通也。第四佛子下。善\n知勝解喻。文四同前。初舉廣喻\n`[SH-2880]` 。梵云阿地目多。此云勝解。謂於決\n定境印持為性。不可引轉為業。今譯存略耳。釋中亦先反後順。順中\n初總。後所謂下別。別中總\n`[SH-2940]` 有十三句。初有八句總相以辨。後有五句\n一一別明。前中又二。初三解。為得方便解智光。此光通因通果。於\n中一廣二深。約理等故\n`[SH-3000]` 。三即能知。後五句。為得佛十力中勝解智\n力。解一切法。初一約人。謂眾生海解故。次一約時及性。三約境明\n似不似。上皆明所知\n`[SH-3060]` 廣。四事事相即顯所知深。上皆所知後一能知。\n即得十力之一也。第二從欲悉知有上。下一一別明。上但云多。未識\n差別之相。今略\n`[SH-3120]` 示之。於中五句各是一義。初句三對。約佛菩薩相\n望。一妙覺無上餘皆有上。此約竪論。二約橫辨盡未盡。故三同位互\n望為等。高下\n`[SH-3180]` 位相望為不等。第二句有六對。約五乘凡聖相望差別。\n有依無依。約自性差別。託於根境及稱真故。二約淺深差別。甚深般\n若不共小\n`[SH-3240]` 乘故。三約境差別。佛解無邊餘未盡故。四約二諦。世諦差\n別勝義無差故。五巧拙差別。六漏無漏差\n`[SH-3300]` 別。第三句有四解。約佛乘\n說。一深故。二廣故。三無分量故。四契真如正位得果解故。事理無\n礙故。無二礙故。第四句三對。唯約\n`[SH-3360]` 眾生以辨差別。於中初能知方\n便。不礙空而知假故。後悉知下。明其所知。有三對六解。與惑相應\n名染。不相應名淨。廣略者。約境\n`[SH-3420]` 及作意差別。麁細者。約行相差\n別。委悉不委悉故。第五句三對。多約知聖教解。於中文二。先正\n明。二一切下。通結前文。初中深\n`[SH-3480]` 密者。開則深約方廣一乘。密謂密\n意。合則深即是密。以祕以妙即事而真故。二方便者。略有三種。一\n進趣方便。謂見道前方便道是\n`[SH-3540]` 。二施為方便。即第七波羅蜜。依實起\n權皆善巧故。實無此事假施設有故。三集成方便。諸法同體巧相集\n成。如六相巧成可名方便。\n`[SH-3600]` 今並能解。言分別者。凡於一法多門決擇\n故。言自然者。法爾本覺內熏發故。隨因所起者。過去聞熏之所發\n故。或於現在正思惟等而\n`[SH-3660]` 能知故。言隨緣所起者。謂得善友增上緣\n力。所開悟故。二一切下總結。廣多交絡故如網也。為此無限而起大\n心。豈同前喻。第五知\n`[SH-3720]` 根智。第六知欲樂。欲謂於所樂境希望為性。\n勤依為業。即勝解智所攝。會釋如前。第七知方便者。即禪善巧及至\n處道智方便三種。\n`[SH-3780]` 如向所辨所望別故。無相濫失。第八知心義兼王\n所。即他心智。第九知業即業報智。上皆文四。同前可知。辨其名\n`[SH-3840]`\n體。具如初會十力章中。廣顯差別如第九地。第十佛子復置下。明知\n煩惱差別喻。文亦分四。前三可知。第四釋中亦先\n`[SH-3900]` 反後順。順中初總\n後所謂下別。別有六門。各先惑後治。謂非但空知。意在斷故。初門\n總明後一義兼總別。中間四門別舉其重。今初\n`[SH-3960]` 門中輕重眠起。通下諸\n惑故名為總。就中輕重總中之總。以品言之。一切煩惱各有輕重。約\n起惑者。心有異故。據難易斷現行為輕。\n`[SH-4020]` 種子為重。即眠起是。又分\n別為輕俱生為重。若據破壞三寶焚燒善根。則邪見最重餘悉名輕。若\n據損惱自他障菩薩道。瞋恚最重餘悉\n`[SH-4080]` 名輕。若據發潤生死流轉。無明\n愛取為重。若依為諸惑根。則三毒為重。若依障初聖道不受聖教。見\n慢為重。若據遠隨現行障無學道\n`[SH-4140]` 。我愛慢為重。餘可名輕若煩惱當體\n相望。十大煩惱為重。隨惑為輕。隨煩惱中大中小隨。展轉輕重。又\n正使為重習氣為輕。更有異\n`[SH-4200]` 門可略言也。言眠起者。眠即種子眠伏藏\n識。起即對境發起現行。言一一眾生無量煩惱。總結多端。種種差別\n如後略說。廣唯佛知。\n`[SH-4260]` 種種覺觀通能所治。有染淨故。染為所治。煩\n惱依故。如欲恚害覺。能生貪等無量煩惱。涅槃加五說有八覺。一欲\n覺。求可意事。二\n`[SH-4320]` 瞋覺。念欲瞋他。三惱覺。念欲惱他。四親里覺。\n憶念親緣。五國土覺。念世安危。六不死覺。積財資養。七族姓覺。\n念族高下。八\n`[SH-4380]` 輕侮覺。侮即是慢。念自恃欺人。此等非一故云種種。\n皆能引起一切煩惱。對上一一眾生無量煩惱。\n`[SH-4440]` 亦名引起分別。言淨治\n者。欲以不淨觀治。瞋以慈治。惱害以悲治。次四以無常觀治。後一\n以無我我所觀治。故云種種覺觀淨治一切\n`[SH-4500]` 雜染。第二依流轉門。於所\n治中即癡愛發潤。斷一切下明治。由癡愛故。諸趣流轉。從癡有愛菩\n薩病生故。一切眾生三有五趣三結要\n`[SH-4560]` 當斷盡。一欲界諸愛別名欲結。\n二上二界愛合名有結。三三界無明名無明結。三結亦名三漏。即上癡\n愛斷已永盡生死流故。第三依病\n`[SH-4620]` 行門。四分分別。分是性義。各據偏\n多受貪等名。名為不等。三分俱多名為等分。然不出三。此三別名三\n不善根。故治中云斷根本也\n`[SH-4680]` 。第四依通諸識門。明我我所。謂第七識\n恒執第八為內我故。惑謂為我所染之起慢。故云我慢。通至第六。內\n執我身外執資具。恃己\n`[SH-4740]` 陵人。又此我者。亦兼法我。若盡此惑則諸惑\n皆盡。故治中云盡無餘也。第五約相生門。以利鈍分別先鈍後利。故\n淨名推身。以欲貪\n`[SH-4800]` 為本。欲貪以虛妄分別為本。虛妄分別以顛倒想為\n本。顛倒想以無住為本。今以無住非煩惱故略不言耳。而順明之。從\n顛倒虛妄分別\n`[SH-4860]` 生貪等惑。依貪等惑有諸隨惑。展轉相生。顛倒想者。\n不淨計淨等故。利中即身見為本。生六十二見。此有二說。一依三世\n五蘊。至\n`[SH-4920]` 下當明。二依異道邪見。具如瑜伽八十七說。第六約出家修\n行門。以障蓋分別。蓋謂五蓋。已見上文。障即二障。此亦總。結前\n<<\n`[SH-4980]`\n諸惑不離二障。發大悲下。明能治道。謂救有障者。護修行者。此言\n在末。義兼總結。謂菩薩發心不自為\n`[SH-5040]` 己。但以大悲救護一切。令斷上\n來諸惑之網。斷之何。為令本智清淨。然能治道。雖復眾多不出二\n種。一通二別。別如上來隨分開示\n`[SH-5100]` 。如不能斷應宜轉治。謂如起貪以\n不淨觀治之。不去當起慈悲。緣於前境。應以淨法與之。云何出家無\n慈悲心。反更染污。如是隨便\n`[SH-5160]` 種種迴轉。皆以無得而為方便。所言通\n者。但當深觀第一義諦。謂當觀諸惑即是本覺菩提。故無行云。貪欲\n即是道。恚癡亦復然。如\n`[SH-5220]` 是三法中具一切佛法故。惑性智性皆本淨\n故。但由虛妄分別凡夫不了。如大富盲人動轉為寶所傷。二乘熱狂。\n謂為蟲蛇驚走遠避。權\n`[SH-5280]` 菩薩輩猶謂有之可斷。今乘一切智乘以淨慧\n眼。觀惑即真。則煩惱自虛智性常淨。是為開佛知見。使得清淨。不\n斷煩惱而入涅槃。有\n`[SH-5340]` 斯悲智。如是知斷發菩提心。豈與夫前喻同年而\n語哉。第十一明供佛及生喻文三。初舉喻校量。二徵。三釋。今初分\n二。前廣明一人\n`[SH-5400]` 。後略辨九人。初中有四。一舉廣喻。二問。三答。\n四校量顯勝。初中有二。初廣說東方。後南西下略例九方。初中又\n二。先明佛在\n`[SH-5460]` 供養。後至佛滅下明滅後供養。前中又二。先自行後又\n勸下化他。前中有四深勝。一供具廣妙。二供田廣勝。謂無數界悲敬\n田故。三\n`[SH-5520]` 供心勝恭敬等故。四供時勝。相續無數劫故。此自行已勝。\n況於教他。況復滅後況於餘方。餘並可知\n`[SH-5580]` 。後略辨九人中二。先舉廣\n喻。二佛子下校量顯勝前中九人展轉遞望。念敵多劫數量復增。此中\n如第一人一念以無數供。至第二人皆\n`[SH-5640]` 增至無量。乃至第十增至不可說\n不可說。皆積當位之念。以至當位極時也。後校量可知。二徵意云。\n其第十人供福。已至不可說不可\n`[SH-5700]` 說。全比容許不齊。何以不及少分。\n第三釋中分二。先反顯不為齊限。明前不及此。後為供養盡法界下順\n釋。以無限故辨此過。前略\n`[SH-5760]` 申十種。一時過。謂窮三際念劫重重時\n故。二處過。謂該十方相即入故。三供過。謂盡法界稱理之供故。四\n田過。謂盡虛空界塵毛等\n`[SH-5820]` 處。諸如來身各充法界故。五心過。謂一一\n念中。各以無盡供。供無盡佛。經無盡劫心猶不足故。六悲過。自作\n教他。以此善根唯為\n`[SH-5880]` 眾生令先成佛。我亦供養故。七智過。了達三\n事。隨其一一稱法界故。如海一滴。則具百川之味。芥子之空已無分\n限。八善巧過。能\n`[SH-5940]` 以一事為多攝多為一。善巧成就融攝諸位。真實行\n故。九所求過。唯為菩提不為餘趣故。十平等過。謂生佛自他供與不\n供。皆平等故\n`[SH-6000]` 。束上十義總不出三。一無齊限故。二稱法性故。三事\n事無礙故。無此三意設更重重廣喻。亦不及少分。第四發是心已下。\n就法略示\n`[SH-6060]` 分。前喻顯大心因廣。此明攝德深勝亦是讚勝勸學文中有\n二。一發是心已者。牒前諸喻所校量心。二能知下明此大心所攝功\n`[SH-6120]`\n德。於中有五。一解行圓滿。二妙果當成。三與佛平等。四能作佛\n事。五大智現前。初中三。一總舉所知。現\n`[SH-6180]` 佛正覺但云智慧。過佛示\n滅故加涅槃。當佛在因云善根也。過現已從緣應可得云知。未來未有\n但可云信。亦信一切皆當佛也。二彼諸\n`[SH-6240]` 下攝以修證。有為能得無為能\n知。能證使智身成就法身等佛。古德判此一段。為攝位修成。謂於諸\n佛功德智慧能信是十信。信成就故\n`[SH-6300]` 。後攝初故。能受是十住。能修是\n十行。能知是十向。得證是十地。謂本智證後智。得能成就。是結因\n究竟。能與佛等是果滿。平等\n`[SH-6360]` 謂與諸佛能證所證平等無二故。初心即\n攝諸位。乃至佛果亦是一理。三徵釋所以。何以初心即滿因位。釋意\n云。以等真性所為無齊限\n`[SH-6420]` 故。有十一句。初總餘別。文並同前初喻中\n辨。第二以發心故下。妙果當成分二。初標因得果。二徵釋所由。今\n初得於八事。一解契\n`[SH-6480]` 佛心故為憶念。二入正定聚故當得菩提。三真器\n已成故佛授妙法。妙法者即如來知見也。四知心性故與佛平等。五圓\n修助道六度四攝\n`[SH-6540]` 。六力等未證亦定無疑。故云成就。七十八不共修習\n莊嚴。八得四無礙辨名說法智慧。上七皆言三世明其豎該。今云法\n界。辨其橫攝\n`[SH-6600]` 。前後影略。二徵釋所由中。初徵意云何以發心即得果\n法。釋云。以是發心為因。決定當得佛故。望圓極之果故定當成。約\n見性成智\n`[SH-6660]` 身。上品云即得故。晉經梵本。此中皆云即是佛故者。當此\n義也。第三應知下與佛平等者。見性均故\n`[SH-6720]` 。發心畢竟二不別也。文有\n四句。初總餘別。總言等佛何所等耶。有三種等。一所緣境界。及分\n齊境界等。二大悲大定力無畏等。皆\n`[SH-6780]` 悉平等。三得知身無從。亦無積\n聚。隨物分別見種種身。如是智慧與佛平等。第四纔發心時下。能作\n佛事有十一句。皆是纔發即得。\n`[SH-6840]` 言即得者有二意故。一約法圓融。初\n心攝諸位故。通說諸位相攝。總有三類。一以行攝位。如十信中具一\n切位。賢首品說。二以位攝\n`[SH-6900]` 位。如十住滿即得成佛。如十住品。及法\n界品海幢比丘處說。其十行十向十地皆爾。各如自品說。三初心攝\n終。如十住初心即攝諸位\n`[SH-6960]` 。如此品說。並就因位滿說。如普賢作用大\n分同佛。猶未是佛。此中亦爾。二約見性齊故。說與佛等具諸佛法\n豎。論位次優劣非無。\n`[SH-7020]` 若爾此與歷別何異。請以喻顯。若彼虛室置之\n一燈。光周室內。加二加三乃至百千。各各重重遍於室內。雖同周遍\n不妨後後益。明初\n`[SH-7080]` 心等佛若彼一燈。妙覺等初同第百千。若器中盛\n燈。雖復百千共置一室。互不相見。歷別修行類同此也。依於此義\n故。初心即云振動\n`[SH-7140]` 光照一切世界。登地已上却說百剎千剎。如理思\n之。又即由此義廢高就下。十住之中即齊地故。第五此初發下明大智\n現前。此文二意\n`[SH-7200]` 。一別是一段。謂以無著大智求菩提故。二通釋上四\n段。謂由於一切無所著故。稱性圓融能成能攝一切功德文中分二。初\n`[SH-7260]`\n正明無著。後釋其所由。前中初總所謂下別。謂從三世門見佛法僧非\n佛法僧。同三世攝。於中三位。初八清淨次\n`[SH-7320]` 四通染淨。後二唯染。後\n唯求下釋不著所由。文含多意。一云。唯為菩提故云求一切智。不餘\n趣向故於法界佛等無著。此雖有理不順\n`[SH-7380]` 今文。以佛及佛法豈非一切智\n耶。二云。求之於己不求佛等。求之於己尚未免求。今釋有二。一只\n為求一切智故。求而無著。以有所\n`[SH-7440]` 著非真求故。故淨名云。夫求法\n者。於一切法應無所求。了法無求順一切智。二者言求者不壞相也。\n不著者稱法性也。性相雙鑑。終\n`[SH-7500]` 日求而無所求。經云無所求中吾故求\n之矣。第五爾時下動地興供分。全同上文。第六是時十方下。十方證\n成分。望於上文有同有異。\n`[SH-7560]` 同義可知。異有三種即為三段。一佛現證\n成異前菩薩。二顯益證成前文所無。三結通無盡。前略此廣加說因\n故。今初也。先現身次讚\n`[SH-7620]` 說。後引已同。以初心攝德深廣恐難信受。\n故佛自證。二汝說此法時下顯益證成。益通二世。初益現在。後我等\n悉當護持已下。顯及\n`[SH-7680]` 當來。今初清淨心者。以聞菩提心見心性故。而\n經多劫者。然餘教說定三僧祇。此宗所明劫數不定。略有四類。一或\n展則無量。不可\n`[SH-7740]` 說不可說剎塵。如法界品說。二或千不可說。或減或\n增。如威光太子及此中說。三或一生二生。如善財童子兜率天子。四\n初心即得如\n`[SH-7800]` 前所說。所乘之法既自在圓融。能乘之人亦遲速不定。念\n劫融故。故彌勒云。一切菩薩無量劫修。善\n`[SH-7860]` 財一生皆得。起信則以若\n遲若速。皆為方便。此宗則以楷定為權。並有聖言無煩固執。不以長\n時而生退怯。不以速證而起輕心。若遲\n`[SH-7920]` 若疾誓要當剋。是佛意也。後\n益末世令信仰故。今之聞者。皆由佛力願深愧信行。三如此下結通無\n盡。是證佛結通非經家也。先明說\n`[SH-7980]` 遍。後其說法下示所說同。文中有\n三。一說人同。二說儀同。謂神力本願故。三說意同。為欲下是此文\n大旨。同前十住並顯可知。第\n`[SH-8040]` 七爾時下以偈重頌分。先辨偈意有十一\n句。初一後一是說偈儀。而離開者欲顯中九。皆承佛力該十方故。中\n九正明所謂。初總餘別。\n`[SH-8100]` 別中四對。一淨業顯理。二除惑開信。妄想\n分別為雜染根。三知病識藥。四觀果淨因。即由利他自業便淨。第二\n正顯偈辭。有一百二\n`[SH-8160]` 十一頌。文分三段。初八十二偈。超頌就法略\n示。二有三十四偈。却頌就喻校量。三有五偈結德勸讚令景慕發心。\n歎深難說遍於三段\n`[SH-8220]` 。又歎為長行偈頌之本。故略不頌之初中文亦分\n五。初有十七偈。頌第一解行圓滿。二菩薩始發下十七頌。超頌第四\n能作佛事。三菩\n`[SH-8280]` 薩所住下十八偈。却頌第三得佛平等。四趣向菩提下\n六偈半。頌第五大智現前。五恒勸眾生下。二十三偈半。頌第二妙果\n當成。文不\n`[SH-8340]` 次者。顯德無前後故。又長行明先同果體。後同果用。偈\n頌明用可在。今果明當得。大智通遍故。前後互明。初中文分為二。\n`[SH-8400]`\n初一偈。頌前正明解行圓滿。然初句。是總舉發心為因。餘十六偈頌\n前徵釋。於中有七。初一偈頌充遍一切\n`[SH-8460]` 世界。二有二偈。頌為欲度脫\n一切世界眾生。三有一偈。頌知世界成壞。知者意在往化覲佛故四一\n偈半。頌為悉知一切眾生垢淨故。\n`[SH-8520]` 及一切世界三有清淨。知垢意在令\n淨故。五趣三有名左右耳。五紹隆下兩偈半。却頌為不斷如來種性\n故。初半摧邪顯正即紹隆義。次\n`[SH-8580]` 句示佛種之體性。次二句即起佛種\n緣。餘是種起之相。化化不絕是報佛恩。心如金剛是種性義。照佛所\n行修菩提行。則佛種不斷也。\n`[SH-8640]` 六五偈。頌知眾生心樂煩惱習氣下。四\n種發心。於中初偈。總明所知事。想是妄想即煩惱也。業即習氣果即\n死此生彼。心即心行根性\n`[SH-8700]` 即諸根。次二偈顯知之體相。皆即事入玄。\n次偈非唯知病亦識法藥。故如世尊。後偈非唯空知。行願相符能為實\n益。七有三偈。頌知\n`[SH-8760]` 一切眾生三世智。謂離三世障故。障有十種。一\n煩惱雜染障。二觸境迷倒障。三長時懈怠障。四取著因果障。五邪教\n邪師引轉障。六\n`[SH-8820]` 趣下乘障。七麁相現前障。八於遍趣行無堪能障。九\n隨言生解障。十不亡能所障。如次十句各一對治。末後二句總結通\n達。第二菩薩\n`[SH-8880]` 始發下有十七偈。頌上能作佛事。總分為十。初二偈。\n頌即能說法教化調伏一切眾生。以悲智相導故。二有一偈頌諸佛讚\n歎。歎必加\n`[SH-8940]` 故。三有一偈。頌即能振動一切世界。動入互舉。四菩薩\n具足下六偈。頌即能息滅一切諸惡道苦。於\n`[SH-9000]` 中具悲智之德。故能拔因\n果之苦。而無我人。五有一偈。頌即能光照一切世界。照世意在照諸\n眾生。六一偈。頌即能嚴淨一切國土。\n`[SH-9060]` 毛孔現剎即神通嚴也。七有一\n偈半。頌上即令一切眾生歡喜。供佛問法但為益物故。八一偈半。頌\n上即能入一切法界性。初半聞而通\n`[SH-9120]` 達。次半思而兼說。後半修而無\n著。九有半偈。依修而證。頌即能持一切佛種性也。十有一偈半。頌\n即能示現成佛。第三菩薩所住下\n`[SH-9180]` 十八偈。頌得佛平等。於中分四。初\n三偈半頌佛境界平等。初偈分齊境。次偈兼所證所緣境。後一偈半舉\n況顯勝。二善知下四偈半。\n`[SH-9240]` 頌功德平等。三有一偈。頌前文得如來一\n身無量身平等。四於諸下九偈。頌真實智慧。於中有四。初四頌。發\n離一切妄想廣大心。二\n`[SH-9300]` 有二頌。發窮三際廣大心。三有二頌。發順涅\n槃菩提廣大心。四一偈結勸可知。第四趣向菩提下六偈半。頌大智現\n前。於中初一結前\n`[SH-9360]` 生後。餘正頌大智現前。初偈於佛無著。次偈即若\n眾生若眾生法。次偈即若佛若佛法。次偈若世間若世間法。次偈若菩\n薩若菩薩法。\n`[SH-9420]` 二乘文略。後半偈頌上結文。念十方佛即求一切智。無\n依無取。即於諸法界心無所著。第五有二十三偈半。頌前妙果當成。\n於中有九\n`[SH-9480]` 。初三偈半頌常為一切諸佛護念。以具德故。二半偈。頌當\n得無上菩提。三半偈。頌與其妙法。大人法者八大人覺也。四有一\n`[SH-9540]`\n偈。頌佛體平等。時處平等即佛體故。五有一偈。頌已修三世諸佛助\n道之法。六有六偈。頌成就三世諸佛力\n`[SH-9600]` 無所畏。廣十力之別名。略無\n畏之都號。於中五偈半別明十力。後半偈顯得分齊。七有五偈。頌已\n莊嚴三世諸佛不共佛法。三世間圓\n`[SH-9660]` 融不共權小故。八五偈。頌悉得諸\n佛說法智慧力。九一偈。結德無盡並屬初心。該前諸段大文第二十方\n國土下。三十四頌。頌前約喻\n`[SH-9720]` 校量。於中分二。先十四頌。正頌前喻\n可知。後二十偈。通釋諸喻不及所由。前雖略釋今此廣辨。又長行中\n多隨喻別明。今此總辨。\n`[SH-9780]` 亦總相頌前歎深難說。若將別配。則令難證\n等互有所局。於中分三。初半偈結前生後。次十七偈半正釋所由。後\n二偈結德無盡。就正\n`[SH-9840]` 釋中分三。初一偈標章。次十二偈半別釋。三四\n偈顯德圓滿。今初也。謂標出生無盡體相無限。二章二別釋中。初四\n偈釋無齊限。或\n`[SH-9900]` 一句是一義。後一偈半頌六度義。可以意得。後八偈\n半釋出生無盡。於中分三。初二偈半結前生後。以體無限故出生無盡\n也。次菩提\n`[SH-9960]` 心是下四偈。正顯出生為本。出生乃一義耳。後二偈略釋\n為本所由。由修六度為菩薩乘本。由勸正行為人天乘本。由闡妙業通\n為三乘\n`[SH-10020]` 涅槃之本。三四偈顯德圓滿。中初偈總顯。次二偈別顯願滿。\n後一偈別明智圓。第三二偈結德無盡可知。大文第三欲知下結勸發心\n於\n`[SH-10080]` 中三。初半偈正勸。次三偈半釋勸所由。總舉具足一切德故。後一\n偈結勸速發。\n大方廣佛華嚴經疏\n`[SH-10140]` 卷第十九\n大方廣佛華嚴經疏卷第二十\n唐清涼山大華嚴寺沙門澄觀撰\n\n疏末：**大方廣佛華嚴經疏卷第十九**（见窗口末段·本品疏毕）。\n\n### 附录五：对读简表\n\n| 对读维度 | 八十（本品） | 六十相当品 | 状态 |\n|---|---|---|---|\n| 品题 | 初發心功德品第十七 | 初发心菩萨功德品第十三 | 登记对应 |\n| 卷次 | 卷第十七–十八 | 卷第九–十（`p.0449c22` 起） | 〔本批未录·未竟〕 |\n| 正文 CJK | 8,207（27 单元） | — | 不臆造等值 |\n| 偈颂 | 一百廿一颂（重颂 3,388） | — | 〔待核〕 |\n| 对读口径 | 仅登记品题（十八会序次） | 法藏《探玄记》科之 | 承 P8 铁律 |\n\n### 附录六：存疑一览\n\n①六十〈初发心菩萨功德品第十三〉卷九–十原文本批未录〔未竟〕；②智俨《搜玄记》不覆本品〔缺口〕；③讲记正行段未及第三会〔未上架·待补〕；④讲记 ep11 四品科判属玄谈段〔⚖待 Ep13+ 核〕。\n\n### 附录七：引用书目\n\n- 《大方廣佛華嚴經》T10n0279·CBETA（底本）\n- 《華嚴經》T09n0278·CBETA（六十·本品卷九–十·`p.0449c22` 起〔本批未录〕）\n- 澄观《大方廣佛華嚴經疏》T1735\n- 法藏《華嚴經探玄記》T1733\n- 慧苑《續華嚴經略疏刊定記》X0221\n- 李通玄《新華嚴經論》T1739\n- 佚名《華嚴經合論》X0223\n- 智俨《華嚴經搜玄記》T1732〔本品无窗口〕\n- 海云继梦讲记 ep10/ep11·`.md`（玄谈段·旁参）\n\n### 附录八：术语对照\n\n| 中文 | Sanskrit / English | 备注 |\n|---|---|---|\n| 阿僧祇 | asamkhyeya | 无央数·校量基 |\n| 那由他 | nayuta | 由数·亿 |\n| 歌羅分 | （kalā） | 豎析毛端分·或十六分一（澄观训） |\n| 優波尼沙陀 | （upaniṣad） | 近少分（澄观训） |\n| 菩提心 | bodhicitta · mind of awakening | 全站固定译 |\n     });

}

}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}

</script>
</body>
