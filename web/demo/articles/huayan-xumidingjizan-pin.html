ent(90deg,#f0f0f0,#fafafa);border:1px solid #ccc;border-radius:6px;padding:8px 12px;text-align:center;font-size:0.85em;\">第十三品·升须弥山顶品<br/>长行：佛昇须弥·帝释请·十佛偈赞</div>\n<div style=\"text-align:center;color:#666;\">↓ <b>重颂</b>（长行既说·今以偈扬）</div>\n<div style=\"background:linear-gradient(90deg,#e6ffe6,#f7fff7);border:1px solid #8fd98f;border-radius:6px;padding:8px 12px;text-align:center;font-size:0.85em;\"><b>第十四品·须弥顶上偈赞品（本品）</b><br/>十菩萨各承佛威·说十颂·凡百颂</div>\n<div style=\"text-align:center;color:#666;\">↓ <b>正说</b>（将演住门·先陈体性）</div>\n<div style=\"background:linear-gradient(90deg,#fff2e6,#fffaf7);border:1px solid #d9b38c;border-radius:6px;padding:8px 12px;text-align:center;font-size:0.85em;\">第十五品·十住品<br/>法慧入定·佛加·正说十住位</div>\n</div>\n<div style=\"margin-top:10px;font-size:0.76em;color:#666;\">澄观来意判：「既明化主赴感。今辨助化讚揚。將演住⾨先陳體性。性即佛智先讚如來。故品來也」（`T1735` 卷第十六）——本品在「化主赴感」（P13）与「正说住门」（P15）之间，行**助化赞扬·先陈体性**之职。</div>\n</div>\n\n#### 图 〇-2　十菩萨·十颂·三列名数矩阵导览\n\n<div style=\"background:rgba(94,139,158,0.04);border:1px solid var(--line, #d9cdb8);border-radius:8px;padding:16px;margin:12px 0;overflow-x:auto;\">\n<div style=\"display:flex;gap:20px;flex-wrap:wrap;align-items:stretch;\">\n<div style=\"flex:1;min-width:220px;border:1px solid #8fb3d9;border-radius:6px;padding:10px 12px;background:linear-gradient(180deg,#e6f3ff,#f7fbff);\">\n<div style=\"font-weight:600;text-align:center;margin-bottom:6px;font-size:0.85em;\">集会段（80-01·长行 CJK314）</div>\n<div style=\"font-size:0.78em;\">十菩萨名（皆「慧」）·十华世界（所从来土）·十月佛（各于佛所净修梵行）——三列各十·次第相配；「隨所來方，各化作毘盧遮那藏師子之座」；世尊两足指放百千亿妙色光明。</div>\n</div>\n<div style=\"display:flex;align-items:center;color:#666;\">⇄</div>\n<div style=\"flex:1;min-width:220px;border:1px solid #8fd98f;border-radius:6px;padding:10px 12px;background:linear-gradient(180deg,#e6ffe6,#f7fff7);\">\n<div style=\"font-weight:600;text-align:center;margin-bottom:6px;font-size:0.85em;\">偈赞段（80-02–80-21·十颂群）</div>\n<div style=\"font-size:0.78em;\">10×（起式 p ＋ 颂群 lg）：每菩萨「承佛威力，普觀十方而說頌言」，各十颂（40 五言句·lg CJK200）——通计 100 颂·400 句·2,000 字。法慧总叙·余九别叹·坚固慧结叹无尽。</div>\n</div>\n</div>\n</div>\n\n---\n\n## 〇、凡例（简要）\n\n一、**校勘底本**：以 `T10n0279`（八十华严）为底本。六十华严（`T09n0278`·本品相当者为〈菩薩雲集妙勝殿上說偈品第十〉，本机仅卷七存段）、四十华严（`T10n0293`）不作底本；**本品颂文一律以八十为正文，六十仅供对读，绝不据他译补写本品缺段**。\n\n二、**品读主从**：以八十华严为叙事主轴，六十为辅读与对读。主从仅指骨架取自何本，非谓其余可略。\n\n三、**疏解三层**：其下「疏解」为依经文直解；「名相」为训释与梵汉（凡无把握者标〔待核〕）；「会读」为注疏家与讲记等之判，非经证，凡引皆逐字回源。\n\n四、**引文可回源**：凡引经皆照 CBETA 底本原字形（繁体·异体），可回源可复核；凡引注疏皆注明经号与段落，无把握者标〔待核〕。**不擅改经文，亦不据听录回改底本。**\n\n五、**存疑必标**：凡未能确证者标〔待核〕；凡属本席推断者标「〔本文判断〕」；凡讲者之说疑误者只标不改。\n\n六、**附品体例（本品要例）**：本品为第十三品《升须弥山顶品》之**重颂**（应颂·祇夜），经文体例如此，非后人缀集——底本品题节点原只十字「**須彌頂上偈讚品第十四**」（CJK10·平文器 SKIP anchor／space 等标签后取净 title·无副题杂字）。重颂之所颂，澄观判定：**法慧初颂「叙此品放光」「叙前品请赞」「三重叙此品」**——即重说通贯 P13–P14 两品法会，而九菩萨颂别叹当位法门的佛果体性，**非逐字逐句翻长行**；以一一对应长行之句期待重颂者，失其体例（详见 §三、§4.1）。\n\n七、**版本差异之惯例**：凡藏译、梵本、六十／四十华严与本品的分品、用字、文段有无、内容增减之别，**悉举而比之**，注版本与信度；**严禁以「藏译云」冒充未见之原文**。六十侧自**善慧菩萨**起颂文转入卷八（本机六十入库止于卷七·卷八未入库），凡此皆如实标〔跨卷未竟〕（§6.1′）。\n\n八、**计数口径**：字数以剥标点之 CJK 口径计（含品题）；句数以句末标点（。！？）计；颂以四句颂计（每 lg 四十句·十颂）。本品品界实测 **CJK 2,510**（含品题十字·净 2,500），详见 §七。\n\n---\n\n## 一、概述与品题解义\n\n### 1.1 品题释义\n\n**品名**：**须弥顶上偈赞品**（八十华严**第十四品**，唐·实叉难陀译）。全篇在《大方广佛华严经》**卷第十六**，紧接第十三品《升须弥山顶品》之后、第十五品《十住品》之前，为**第三会「忉利天宫会」第二品·附品（重颂）**。\n\n**「須彌頂上偈讚」**——澄观《疏》释名（`T1735`）：「**須彌約處讚稱佛德。依處有讚故立此名。亦頂上之讚揀餘處也。**」处（须弥顶·妙胜殿）＋法（偈赞佛德）之**依主释**。慧苑《刊定记》（`X0221`）同判「依處以標顯。依主釋也」，并出梵本全题：「**若依梵本。具名應云如來於須彌頂神變集會菩薩說偈品**」——梵本題面具含如來、須彌頂、神變集會、菩薩說偈四義，漢題約之。（李通玄《论》别以「以法慧等⼗箇菩薩。各以⾃當位隨位進修之法。還⾃以偈讚之」释「偈赞」名目，见 §5.3。）\n\n**「偈」之体**：本品颂为**五言四句一颂**（双句行·每 `<lg>` 十颂·四十句），与 P13 帝释十佛颂同式；长行与偈颂之对偶关系见 §4.1。\n\n### 1.2 品位与脉络（承上启下）\n\n**在华严经三十九品中之位**：第三会（忉利天宫）第二品，八十华严**第十四品**，占**卷第十六**。\n\n**判位**——**法藏五分**（`T1733`）：本品与 P13 同属第二会至第六会「**修因契果生解分**」·十住位。\n\n**澄观**（`T1735`）科第三会六品「**分為二分。初二品方便發起。後四品當會正說**」，且判偈赞一品「**義有兩兼**」（一是方便·谓前品化主赴机后品助化赞佛；二是所依·谓三天说法各有偈赞）——本品居「方便发起」之第二，**通前（重颂 P13）启后（先陈住体）**。\n\n**智俨**（`T1732`）：「此會有六品分三。初⼆品明⽅便發起。次⼆品明正位相。次⼆品明後成滿⾜⾏相」——本品居三分之「方便发起」次。\n\n**李通玄**（`T1739`）都会此十住六品经意：「**一昇須彌頂品。明信終昇進。二須彌頂上偈讚品。明偈讚當位之法勸修昇進之理。三十住品。明當位所⾏之⾏**……」——以本品明偈讚當位之法、勸修昇進之理。\n\n**承上启下**：\n- **承上**：第十三品明佛昇须弥、帝释请佛、十佛偈赞（长行＋一颂群）；本品即其**应颂**——法会场面重以偈扬；\n- **本品**：十方十「慧」菩萨集会·佛足指放光·十菩萨各说十颂赞佛——颂内容从**叙法会**（法慧）转入**叹佛体性·显当位解行**（余九），以偈颂形式先陈「住性即佛智」；\n- **启下**：第十五品《十住品》法慧入无量方便定、蒙佛加被正说十住位次——「**將演住門先陳體性。性即佛智先讚如來**」（`T1735` 释来意）。\n\n### 1.3 篇幅与结构预览\n\n本品为**长颂之品**（较 P13 长行反为巨）。`_e14_full.py` 平文器实测：品界（須彌頂上偈讚品第十四→十住品第十五）**CJK 2,510**（含品题十字·净 2,500·与 `_p9_11_audit.py` body80 同口径）。品题＋**二十一个正文单元**（11 个 p ＋ 10 个 lg）：80-01 集会长行（CJK314）；80-02–80-20 十个「起式 p」（CJK18–19）；80-03–80-21 十个颂群 `lg`（**每 lg 恰 CJK200**·四十句·十颂·逐 lg 验见 §7.1）。\n\n**颂数总计**：十菩萨 × 十颂 = **百颂**·**四百五言句**·颂文本千言 ×2 ＝ CJK 2,000；合长行 314＋起式百八余字·通品界 2,510。\n\n**二十四段结构表**（品题＋集会＋10×〔起式＋颂群〕·右系澄观十段科）见 §2.0。\n\n### 1.4 核心要义\n\n本品义摄三枢：\n\n**一、重颂之职·赞佛即赞住体**。十颂百首不重长行事相之繁，而**收归佛德体性**：法慧总叙「佛以種種身，遊行遍世間，法界無所礙」，余九各从一经（不见佛·真见佛·佛法无人说·妄取真实相·离分别见·无尽与尽·生死涅槃二俱不可得·闻佛名离狱·无著无念·大悲出世）叹如来「难思议」——**住性即佛智，故将说住先赞佛**（澄观来意判）。\n\n**二、名数三列·以名表法**。十菩萨名**皆同「慧」**、十世界**皆同「华」**、十佛号**皆同「月」**——澄观判：「慧即⼗解能⾒法故」「世界名同同名華者。位相創開無著感果故」「同名⽉者。表位中佛果智明闇息恩益清涼應器周故」；三列各十、次第配于十住（§4.2 表）。又「彼諸菩薩所有名字、世界、佛號，**悉等無別**」——此方他方全同，一法界大会之相。\n\n**三、足指放光·位胜进之表**。「世尊從兩足指放百千億妙色光明」——李通玄判放光处随位升进：「**⼗信⾜輪下放光。此⼗住中⾜指端放光。明位勝進。⼗⾏⾜趺。⼗迴向膝上。⼗地眉間毫中放光**」（`T1739`）；足指「**拒地得住有力。成位不退⽽⾏有恒。數位過前加於千也**」（`T1735`）。\n\n> **EN gist**：*A recitation-chapter (geyapada): the ten \"慧\" bodhisattvas from ten flower-worlds, each before his moon-named Buddha, re-voice in verse the assembly, the light, and the very nature of the Ten Abodes—praising the Buddha as the substance of the dwelling—before the Dharma-Wisdom chapter proper opens.*\n\n### 1.5 经文文本现象与信度标识\n\n**〔起式微差·一二对九〕威神／威力·颂曰／颂言**：首起式（法慧·80-02）作「**爾時，法慧菩薩承佛威神，普觀十方而說頌曰**」（CJK18），其后九起式例作「承佛**威力**……而說**頌言**」——实测品界 bodyC：「承佛威神」×1、「承佛威力」×9；「而說頌曰」×1、「而說頌言」×9。**首说独异·余九一律**，系经文起式之自然变异，非错简（不据后九改首·不据首改后九·各照底本）。\n\n**〔起式微差·特例〕精進慧「觀察十方」**：十起式中九作「**普觀十方**」，唯精进慧起式（80-10）作「**觀察十方**」——实测作\"普觀十方\"×9、\"觀察十方\"×1。校勘记只登记不改（§6.4）。\n\n**〔嵌套引号·品界孤例〕**：智慧菩萨颂（80-15）「若生如是想：『**此佛此最勝**。』」——品界内唯一双引号内套单引号处（外层双引号十组全闭合·见 §7.1）；句末标点实测 。×106 ，×334 ！？×3。\n\n**〔重颂非一一对应〕**：本品百颂并不逐句翻 P13 长行：澄观判法慧颂内之分布「初⼀敘**此品**放光。次⼀敘**前品**請讚。餘三**重敘此品**」——所颂通贯两品法会；九菩萨颂更转入当位法门体性之叹（非 P13 文句）。**以\"翻案长行\"求一二对应者，误其体例**〔本文判断·综诸家科〕。\n\n**〔品题原字形〕**：底本品题净十字「須彌頂上偈讚品第十四」（平文器 SKIP anchor 标签后实测 CJK10·无杂字）；六十侧品题十三字「菩薩雲集妙勝殿上說偈品第十」——两译题目结构全异（处·法题 vs 集会·殿·说偈题），各照底本。\n\n### 1.6 版本差异之惯例与本品之版本情况\n\n- **八十（`T10n0279`·唐·实叉难陀）**：品 14〈須彌頂上偈讚品第十四〉，第三会第二品·重颂附品。\n- **六十（`T09n0278`·晋·佛驮跋陀罗）**：相当品为〈**菩薩雲集妙勝殿上說偈品第十**〉（juan7 尾起·至卷末存 CJK 1,421）——集会段三列名数全具（菩萨名十/十同、世界名同根三、佛号同名五），颂文**仅法慧至精进慧五菩萨段闭合**（五颂块·五十颂），善慧以下跨卷八·**本机未入库**〔跨卷未竟〕（§6.1′）。\n- **四十（`T10n0293`·唐·般若）**：全经唯「入法界品」，**无相当之偈赞品**，不取对读（§6.2）。\n- **藏译（`Toh 44`·Dege 45 品）**：本机**未入库逐字对勘**〔未竟〕，只标传闻相当之品次，不冒充原文（§6.3）。\n\n### 1.7 核心要义小结\n\n本品以百颂重扬 P13 法会，将十住之「体」先于「相」呈出：集会三列名数（慧·华·月）以名表位，十颂各依一经叹佛难思，足指放光表位胜进，结颂\"无数亿劫中，说亦不能尽\"收归无尽。诸家科判（澄观三分十段·智俨偈数科段·慧苑四门·法藏散科无题·李通玄十一段长科）同趣：**助化赞扬·先陈体性·劝修升进**。\n\n---\n\n## 二、卷第十六（须弥顶上偈赞品第十四·本品全文）\n\n### 2.0 结构总表（据经切分）\n\n本品二十二单元（80-00 品题 head ＋ 80-01 集会 p ＋ 10×〔起式 p ＋ 颂群 lg〕），依 `_e14_dump.txt` 平文器实测；澄观科品「**總為三分。第一集眾分。第二放光分。第三偈讚分**」（`T1735`），偈赞分中「**⼗菩薩說。即為⼗段。初⼀是總餘九為別**」：\n\n| 经单元 | 三分科 | 事 | 起句（照底本） | CJK |\n|---|---|---|---|---|\n| 80-00 | — | 品题 | 須彌頂上偈讚品第十四 | 10 |\n| 80-01 | 集眾·放光 | 十方菩萨集会·三列名数·化座·足指放光 | 爾時，佛神力故，十方各有一大菩薩…… | 314 |\n| 80-02／80-03 | 偈讚·初一总 | 法慧承佛威神说十颂 | 「佛放淨光明，普見世導師，……」 | 18／200 |\n| 80-04／80-05 | 别一 | 一切慧十颂 | 「假使百千劫，常見於如來，……」 | 19／200 |\n| 80-06／80-07 | 别二 | 胜慧十颂 | 「如來大智慧，希有無等倫，……」 | 18／200 |\n| 80-08／80-09 | 别三 | 功德慧十颂 | 「諸法無真實，妄取真實相，……」 | 19／200 |\n| 80-10／80-11 | 别四 | 精进慧十颂 | 「若住於分別，則壞清淨眼，……」 | 19／200 |\n| 80-12／80-13 | 别五 | 善慧十颂 | 「希有大勇健，無量諸如來，……」 | 18／200 |\n| 80-14／80-15 | 别六 | 智慧十颂 | 「我聞最勝教，即生智慧光，……」 | 18／200 |\n| 80-16／80-17 | 别七 | 真实慧十颂 | 「寧受地獄苦，得聞諸佛名，……」 | 19／200 |\n| 80-18／80-19 | 别八 | 无上慧十颂 | 「無上摩訶薩，遠離眾生想，……」 | 19／200 |\n| 80-20／80-21 | 别九 | 坚固慧十颂·结叹 | 「偉哉大光明，勇健無上士，……」 | 19／200 |\n\n### 2.1 集会段·三列名数与放光（80-01）\n\n长行一段 CJK314，具四事：\n\n**一·集会**：「爾時，佛神力故，十方各有一大菩薩，一一各與佛剎微塵數菩薩俱，從百佛剎微塵數國土外諸世界中而來集會」——集因为佛神力（澄观判\"一集因同皆佛⼒故\"）；来处「百佛剎微塵數」较前会之「十」为增（澄观：\"前⼗此百位已增故\"·慧苑「謂前⼗此百。顯漸增之相」）。\n\n**二·三列名数**：「其名曰：法慧菩薩、一切慧菩薩、勝慧菩薩、功德慧菩薩、精進慧菩薩、善慧菩薩、智慧菩薩、真實慧菩薩、無上慧菩薩、堅固慧菩薩。**所從來土**……因陀羅華世界……虛空華世界。**各於佛所淨修梵行**……殊特月佛……明了月佛」——菩萨·世界·佛号三列各十、次第相配（全表及表法义见 §4.2；与六十名数对照见 §6.1）。\n\n**三·化座·结通**：「是諸菩薩至佛所已，頂禮佛足；隨所來方，各化作**毘盧遮那藏師子之座**，於其座上結跏趺坐。如此世界中，須彌頂上，菩薩來集；一切世界，悉亦如是，彼諸菩薩所有名字、世界、佛號，**悉等無別**」——此方他方全同，澄观\"重疊無礙無不互⾒。為⼀法界圓明⼤會\"。\n\n**四·放光**：「爾時，世尊**從兩足指**放**百千億妙色光明**，普照十方一切世界須彌頂上帝釋宮中，佛及大眾靡不皆現」——放光分（澄观科\"⽂義有六。⼀時。⼆主。三處。四數。五相。六业\"；处·足指义见 §1.4、§4.3）。\n\n**疏解**：一处经文本位（忉利天宫·须弥顶），十方世界「悉亦如是」——本会与普光法堂会之「齐现」手法（P9·P13）一贯：**此处即处处**〔本文判断〕。\n\n### 2.2 法慧总赞颂（80-02·80-03）\n\n起式独作「承佛**威神**……說**頌曰**」（§1.5）。十颂总叙法会，澄观科「**⼗頌分三。初五敘因佛光⾒多盛事。初⼀敘此品放光。次⼀敘前品請讚。餘三重敘此品。次⼆勸觀佛⼒。更發勝⼼。即前品不起而升。後三舉因結果**」。\n\n首颂标纲：「**佛放淨光明，普見世導師，須彌山王頂，妙勝殿中住**」；第二颂即带前品：「**一切釋天王，請佛入宮殿，悉以十妙頌，稱讚諸如來**」——\"十妙颂\"自指 P13 帝释十佛颂（互见锚·§3.1）。三至六颂叙集会同名同土（「彼會諸菩薩，皆同我等名」）；七至九颂翻出\"不起而升\"：「**佛子汝應觀，如來自在力，一切閻浮提，皆言佛在中。我等今見佛，住於須彌頂，十方悉亦然，如來自在力**」；末三颂举因结果：「一一世界中，發心求佛道，依於如是願，修習菩提行」→「**慧光恒普照，世闇悉除滅，一切無等倫，云何可測知**」。\n\n**会读**：慧苑判前十颂\"前七敘會中事。後三舉因釋成\"，于叙前品天王请佛偈赞处明**重颂通贯两品**（`X0221`·§5.2″）。\n\n### 2.3 一切慧颂（80-04·80-05）\n\n颂意（澄观）：「**了⼀切法真實之性。淨⼼地故**」·配第二治地住·南方。十颂分六（§5.1 长摘）。\n\n首颂立\"妄见不见佛\"案：「**假使百千劫**，常見於如來，不依真實義，而觀救世者。是人取諸相，增長癡惑網，繫縛生死獄，盲冥不見佛」——即使常见如来，不依真实义观，增长痴网、盲冥不见。二至五颂转真见：「觀察於諸法，自性無所有……」·「一切法無生，一切法無滅，若能如是解，諸佛常現前」；「**法性本空寂，無取亦無見，性空即是佛，不可得思量**」。末颂递引：「**法慧先已說，如來真實性，我從彼了知，菩提難思議**」——递引链之第一环（§2.12 表）。\n\n### 2.4 胜慧颂（80-06·80-07）\n\n颂意：「**以解佛勝智隨空⼼淨**」·「為顯欲令菩薩智慧明了。即⼤智了如及佛性故」·配第三修行住·西方。十颂分四：初一看智为迷悟本，次四正显迷悟，次四喻前得失，后一推功有在（澄观細科·raw 照录附录四′）。\n\n关键颂：「**譬如闇中寶，無燈不可見，佛法無人說，雖慧莫能了**」——四喻双陈（暗中宝·目翳·明净日瞽莫见·除翳舍想）。「佛法無人說，雖慧莫能了」一联，澄观因之大发《涅槃》\"正因·缘因·了因·生因\"佛性之论（疏窗 S-2160–S-3240 长段·引《涅槃经·狮子吼品》·详 §5.1〔附论〕）——本品疏解之最长义脉在此一颂。\n\n颂末递引：「**一切慧先說，諸佛菩提法，我從於彼聞，得見盧舍那**」。\n\n### 2.5 功德慧颂（80-08·80-09）\n\n颂意：「**⽣在佛家善解佛德**」·「顯於三世中⼼得平等。了知⾃⼼窮法空故」·配第四生贵住·北方。十颂分四：初四明凡小妄觉，次四示其真觉，一偈佛觉双圆，一偈推功有本。\n\n起颂：「**諸法無真實，妄取真實相，是故諸凡夫，輪迴生死獄**」；要句「**無見即是見，能見一切法，於法若有見，此則無所見**」；结叹「**奇哉大導師，自覺能覺他**」——澄观引《智论》\"若人见般若是则为被缚、若人见般若是则为解脱\"双句释中道见（§5.1）。末递引：「**勝慧先已說，如來所悟法，我等從彼聞，能知佛真性**」。\n\n### 2.6 精进慧颂（80-10·80-11）\n\n起式独作「**觀察十方**」（§1.5 特例）。颂意：「**以勤觀真理集無量善。俱無住故**」·「欲令其⼼轉復精進。無所染著」·配第五方便住·东北方。十颂分二：前九观法（初三所执无相·次三缘起无生·后三圆成无性），后一推功。\n\n要颂：「**若能了邪法，如實不顛倒，知妄本自真，見佛則清淨**」；「世間言語法，眾生妄分別，知世皆無生，乃是見世間」；末「**如德慧所說，此名見佛者，所有一切行，體性皆寂滅**」——\"德慧\"即功德慧之略称（递引链·§2.12）。\n\n### 2.7 善慧颂（80-12·80-13）\n\n颂意：「**成就般若慧鑑不動。可謂善矣**」·「欲令其⼼轉復增進。得不退轉無⽣法忍」·配第六正心住·东南方。十颂分四：初二见佛，次三见法，次三观成利益，后二推见有依。\n\n要颂：「**一切凡夫行，莫不速歸盡，其性如虛空，故說無有盡**」；「所說無盡中，無眾生可得，知眾生性爾，則見大名稱」——尽与无尽互成（澄观\"自性無盡故。得有難思盡\"）。结递引：「**正覺善開示，一法清淨道，精進慧大士，演說無量法**」——颂中明指精进慧（名出经文本字·\"頌中明指\"非增字）。\n\n### 2.8 智慧颂（80-14·80-15）\n\n颂意：「**決斷不動所以名智**」·「於⼀切法皆能出離。文中⽣死涅槃皆善離故」·配第七不退住·西南方。十颂分二：初一引己励众，余偈希众同己（前六示迷·后三启悟）。\n\n要颂：「**有諍說生死，無諍即涅槃，生死及涅槃，二俱不可得**」；「若生如是想：『此佛此最勝。』顛倒非實義，不能見正覺」（品界唯一嵌套引号处·§1.5）；结「正覺過去世，未來及現在，永斷分別根，是故說名佛」。**此颂无末尾递引**（§2.12 链注）。\n\n### 2.9 真实慧颂（80-16·80-17）\n\n颂意：「**⼼不顛倒是真實慧**」·「於法不顛倒如實覺了。是善巧義」·配第八童真住·西北方。十颂分二：前二「依實立名。名能益物」，后八「顯名下之實。辨益所由」（后八再三科：觉妄证实三·双觉二谛一·非觉而觉四·即妙觉义）。\n\n起颂最切信仰：「**寧受地獄苦，得聞諸佛名，不受無量樂，而不聞佛名**」——澄观判「受苦聞名速解脫故。受樂不聞反沈淪故」。要颂「**一切法無相，是則佛真體**」「**一切法無住，定處不可得，諸佛住於此，究竟不動搖**」——「无住之住」为十住体性之直接经证（§4.1）。**此颂无末尾递引**。\n\n### 2.10 无上慧颂（80-18·80-19）\n\n颂意：「**名如初頌。⼜從法王教⽣當紹佛位。故名無上**」·「欲令增進⼼無障礙」·配第九法王子住·下方。十颂分三：初一释已名义，次八显佛胜德（前六内证德·后二外化德），后一推功结益。\n\n要颂：「**如來光普照，滅除眾暗冥，是光非有照，亦復非無照**」；「**無中無有二，無二亦復無，三界一切空，是則諸佛見**」——澄观「拂前無⼆之迹」一段（执无二之见还成二）为本品中观味最浓之疏。结递引：「**如是實慧說，諸佛妙法性，若聞此法者，當得清淨眼**」——「实慧」即真实慧（§2.12）。\n\n### 2.11 坚固慧颂（80-20·80-21）\n\n颂意：「**智⼒成就不可壞故**」·「欲令增⻑⼀切種智。⽂云得淨慧眼了佛境故」·配第十灌顶住·上方。十颂分四：初偈总叹为物兴世智光遍照；次四别示悲相（观机·反释·正明兼显僧宝）；次三颂半见闻利益；后一颂半结德无尽。\n\n起颂：「**偉哉大光明，勇健無上士，為利群迷故，而興於世間**」；悲相颂「佛以大悲心，普觀諸眾生，見在三有中，輪迴受眾苦」；利益颂「**若見如來者，為得大善利，聞佛名生信，則是世間塔**」。**全品结颂**：「勝慧等菩薩，及我堅固慧，**無數億劫中，說亦不能盡**」——澄观「此為終極。故總舉前⼗」，十颂之叹佛归于是无尽。\n\n### 2.12 偈颂递引链·小结\n\n九颂群之末颂多「推功／递引」（澄观「亦謙⼰推⼈異乎凡情。令法鉤鎖殊塗同致。下八準之」）。实测品界内递引：\n\n| 颂群 | 递引句（照底本） | 指涉 |\n|---|---|---|\n| 一切慧 | 「法慧先已說，如來真實性」 | 法慧 |\n| 胜慧 | 「一切慧先說，諸佛菩提法」 | 一切慧 |\n| 功德慧 | 「勝慧先已說，如來所悟法」 | 胜慧 |\n| 精进慧 | 「如德慧所說，此名見佛者」 | 功德慧（略称「德慧」） |\n| 善慧 | 「精進慧大士，演說無量法」 | 精进慧 |\n| 智慧 | —（无递引） | — |\n| 真实慧 | —（无递引） | — |\n| 无上慧 | 「如是實慧說，諸佛妙法性」 | 真实慧（略称「实慧」） |\n| 坚固慧 | 「勝慧等菩薩，及我堅固慧」 | 总举前十·结叹无尽 |\n\n**链读**：前四颂顺次递相引用（法→一→胜→功→进→善·「钩锁」不断）；智慧·真实慧两颂独缺；无上慧遥接真实慧；坚固慧总收——**次第与缺环并存**〔本文判断·此链状结构之数据面见 §7.5〕。\n\n### 2.13 品全文逐段入文〔L.194 本批·全量入文〕\n\n**〔L.194 本批·全量入文〕**以下依 `_e14_full.py` 平文器单元序列（品界 `T10n0279` 卷十六·CJK-only @100923–103433·2,510 含品题／正文净 2,500·22 单元＝1 head＋11 p＋10 lg），**逐字照录全文·0 手抄**；每单元经注入器 assert 为 body80 连续子串（`_p9_11_audit.py` 复跑覆盖 §二）。体例：一品会集会长行（80-01）＋十菩萨说颂（起式 p×10·颂群 lg×10·每 lg 十颂四十五言句）——本品为 P13 长行之重颂（附品·§3.1），颂不别出义，文句与彼品长行互见。\n\n**（品题）80-00〔CJK10〕**\n\n> 須彌頂上偈讚品第十四\n\n**（一·集會放光請說）80-01〔CJK314〕**\n\n> 爾時，佛神力故，十方各有一大菩薩，一一各與佛剎微塵數菩薩俱，從百佛剎微塵數國土外諸世界中而來集會，其名曰：法慧菩薩、一切慧菩薩、勝慧菩薩、功德慧菩薩、精進慧菩薩、善慧菩薩、智慧菩薩、真實慧菩薩、無上慧菩薩、堅固慧菩薩。所從來土，所謂：因陀羅華世界、波頭摩華世界、寶華世界、優鉢羅華世界、金剛華世界、妙香華世界、悅意華世界、阿盧那華世界、那羅陀華世界、虛空華世界。各於佛所淨修梵行，所謂：殊特月佛、無盡月佛、不動月佛、風月佛、水月佛、解脫月佛、無上月佛、星宿月佛、清淨月佛、明了月佛。是諸菩薩至佛所已，頂禮佛足；隨所來方，各化作毘盧遮那藏師子之座，於其座上結跏趺坐。如此世界中，須彌頂上，菩薩來集；一切世界，悉亦如是，彼諸菩薩所有名字、世界、佛號，悉等無別。爾時，世尊從兩足指放百千億妙色光明，普照十方一切世界須彌頂上帝釋宮中，佛及大眾靡不皆現。\n\n**（法慧·第1段起式）80-02〔CJK18〕**\n\n> 爾時，法慧菩薩承佛威神，普觀十方而說頌曰：\n\n**（法慧·十颂）80-03〔CJK200〕**\n\n> 「佛放淨光明，普見世導師，須彌山王頂，妙勝殿中住。一切釋天王，請佛入宮殿，悉以十妙頌，稱讚諸如來。彼諸大會中，所有菩薩眾，皆從十方至，化座而安坐。彼會諸菩薩，皆同我等名，所從諸世界，名字亦如是。本國諸世尊，名號悉亦同，各於其佛所，淨修無上行。佛子汝應觀，如來自在力，一切閻浮提，皆言佛在中。我等今見佛，住於須彌頂，十方悉亦然，如來自在力。一一世界中，發心求佛道，依於如是願，修習菩提行。佛以種種身，遊行遍世間，法界無所礙，無能測量者。慧光恒普照，世闇悉除滅，一切無等倫，云何可測知！」\n\n**（一切慧·第2段起式）80-04〔CJK19〕**\n\n> 爾時，一切慧菩薩承佛威力，普觀十方而說頌言：\n\n**（一切慧·十颂）80-05〔CJK200〕**\n\n> 「假使百千劫，常見於如來，不依真實義，而觀救世者。是人取諸相，增長癡惑網，繫縛生死獄，盲冥不見佛。觀察於諸法，自性無所有，如其生滅相，但是假名說。一切法無生，一切法無滅，若能如是解，諸佛常現前。法性本空寂，無取亦無見，性空即是佛，不可得思量。若知一切法，體性皆如是，斯人則不為，煩惱所染著。凡夫見諸法，但隨於相轉，不了法無相，以是不見佛。牟尼離三世，諸相悉具足，住於無所住，普遍而不動。我觀一切法，皆悉得明了，今見於如來，決定無有疑。法慧先已說，如來真實性，我從彼了知，菩提難思議。」\n\n**（勝慧·第3段起式）80-06〔CJK18〕**\n\n> 爾時，勝慧菩薩承佛威力，普觀十方而說頌言：\n\n**（勝慧·十颂）80-07〔CJK200〕**\n\n> 「如來大智慧，希有無等倫，一切諸世間，思惟莫能及。凡夫妄觀察，取相不如理，佛離一切相，非彼所能見。迷惑無知者，妄取五蘊相，不了彼真性，是人不見佛。了知一切法，自性無所有，如是解法性，則見盧舍那。因前五蘊故，後蘊相續起，於此性了知，見佛難思議。譬如闇中寶，無燈不可見，佛法無人說，雖慧莫能了。亦如目有翳，不見淨妙色，如是不淨心，不見諸佛法。又如明淨日，瞽者莫能見，無有智慧心，終不見諸佛。若能除眼翳，捨離於色想，不見於諸法，則得見如來。一切慧先說，諸佛菩提法，我從於彼聞，得見盧舍那。」\n\n**（功德慧·第4段起式）80-08〔CJK19〕**\n\n> 爾時，功德慧菩薩承佛威力，普觀十方而說頌言：\n\n**（功德慧·十颂）80-09〔CJK200〕**\n\n> 「諸法無真實，妄取真實相，是故諸凡夫，輪迴生死獄。言辭所說法，小智妄分別，是故生障礙，不了於自心。不能了自心，云何知正道？彼由顛倒慧，增長一切惡。不見諸法空，恒受生死苦，斯人未能有，清淨法眼故。我昔受眾苦，由我不見佛，故當淨法眼，觀其所應見。若得見於佛，其心無所取，此人則能見，如佛所知法。若見佛真法，則名大智者，斯人有淨眼，能觀察世間。無見即是見，能見一切法，於法若有見，此則無所見。一切諸法性，無生亦無滅，奇哉大導師，自覺能覺他。勝慧先已說，如來所悟法，我等從彼聞，能知佛真性。」\n\n**（精進慧·第5段起式）80-10〔CJK19〕**\n\n> 爾時，精進慧菩薩承佛威力，觀察十方而說頌言：\n\n**（精進慧·十颂）80-11〔CJK200〕**\n\n> 「若住於分別，則壞清淨眼，愚癡邪見增，永不見諸佛。若能了邪法，如實不顛倒，知妄本自真，見佛則清淨。有見則為垢，此則未為見，遠離於諸見，如是乃見佛。世間言語法，眾生妄分別，知世皆無生，乃是見世間。若見見世間，見則世間相，如實等無異，此名真見者。若見等無異，於物不分別，是見離諸惑，無漏得自在。諸佛所開示，一切分別法，是悉不可得，彼性清淨故。法性本清淨，如空無有相，一切無能說，智者如是觀。遠離於法想，不樂一切法，此亦無所修，能見大牟尼。如德慧所說，此名見佛者，所有一切行，體性皆寂滅。」\n\n**（善慧·第6段起式）80-12〔CJK18〕**\n\n> 爾時，善慧菩薩承佛威力，普觀十方而說頌言：\n\n**（善慧·十颂）80-13〔CJK200〕**\n\n> 「希有大勇健，無量諸如來，離垢心解脫，自度能度彼。我見世間燈，如實不顛倒，如於無量劫，積智者所見。一切凡夫行，莫不速歸盡，其性如虛空，故說無有盡。智者說無盡，此亦無所說，自性無盡故，得有難思盡。所說無盡中，無眾生可得，知眾生性爾，則見大名稱。無見說為見，無生說眾生，若見若眾生，了知無體性。能見及所見，見者悉除遣，不壞於真法，此人了知佛。若人了知佛，及佛所說法，則能照世間，如佛盧舍那。正覺善開示，一法清淨道，精進慧大士，演說無量法。若有若無有，彼想皆除滅，如是能見佛，安住於實際。」\n\n**（智慧·第7段起式）80-14〔CJK18〕**\n\n> 爾時，智慧菩薩承佛威力，普觀十方而說頌言：\n\n**（智慧·十颂）80-15〔CJK200〕**\n\n> 「我聞最勝教，即生智慧光，普照十方界，悉見一切佛。此中無少物，但有假名字，若計有我人，則為入險道。諸取著凡夫，計身為實有，如來非所取，彼終不得見。此人無慧眼，不能得見佛，於無量劫中，流轉生死海。有諍說生死，無諍即涅槃，生死及涅槃，二俱不可得。若逐假名字，取著此二法，此人不如實，不知聖妙道。若生如是想：『此佛此最勝。』顛倒非實義，不能見正覺。能知此實體，寂滅真如相，則見正覺尊，超出語言道。言語說諸法，不能顯實相，平等乃能見，如法佛亦然。正覺過去世，未來及現在，永斷分別根，是故說名佛。」\n\n**（真實慧·第8段起式）80-16〔CJK19〕**\n\n> 爾時，真實慧菩薩承佛威力，普觀十方而說頌言：\n\n**（真實慧·十颂）80-17〔CJK200〕**\n\n> 「寧受地獄苦，得聞諸佛名，不受無量樂，而不聞佛名。所以於往昔，無數劫受苦，流轉生死中，不聞佛名故。於法不顛倒，如實而現證，離諸和合相，是名無上覺。現在非和合，去來亦復然，一切法無相，是則佛真體。若能如是觀，諸法甚深義，則見一切佛，法身真實相。於實見真實，非實見不實，如是究竟解，是故名為佛。佛法不可覺，了此名覺法，諸佛如是修，一法不可得。知以一故眾，知以眾故一，諸法無所依，但從和合起。無能作所作，唯從業想生，云何知如是？異此無有故。一切法無住，定處不可得，諸佛住於此，究竟不動搖。」\n\n**（無上慧·第9段起式）80-18〔CJK19〕**\n\n> 爾時，無上慧菩薩承佛威力，普觀十方而說頌言：\n\n**（無上慧·十颂）80-19〔CJK200〕**\n\n> 「無上摩訶薩，遠離眾生想，無有能過者，故號為無上。諸佛所得處，無作無分別，麁者無所有，微細亦復然。諸佛所行境，於中無有數，正覺遠離數，此是佛真法。如來光普照，滅除眾暗冥，是光非有照，亦復非無照。於法無所著，無念亦無染，無住無處所，不壞於法性。此中無有二，亦復無有一，大智善見者，如理巧安住。無中無有二，無二亦復無，三界一切空，是則諸佛見。凡夫無覺解，佛令住正法，諸法無所住，悟此見自身。非身而說身，非起而現起，無身亦無見，是佛無上身。如是實慧說，諸佛妙法性，若聞此法者，當得清淨眼。」\n\n**（堅固慧·第10段起式）80-20〔CJK19〕**\n\n> 爾時，堅固慧菩薩承佛威力，普觀十方而說頌言：\n\n**（堅固慧·十颂）80-21〔CJK200〕**\n\n> 「偉哉大光明，勇健無上士，為利群迷故，而興於世間。佛以大悲心，普觀諸眾生，見在三有中，輪迴受眾苦。唯除正等覺，具德尊導師，一切諸天人，無能救護者。若佛菩薩等，不出於世間，無有一眾生，而能得安樂。如來等正覺，及諸賢聖眾，出現於世間，能與眾生樂。若見如來者，為得大善利，聞佛名生信，則是世間塔。我等見世尊，為得大利益，聞如是妙法，悉當成佛道。諸菩薩過去，以佛威神力，得清淨慧眼，了諸佛境界。今見盧舍那，重增清淨信，佛智無邊際，演說不可盡。勝慧等菩薩，及我堅固慧，無數億劫中，說亦不能盡。」\n\n〔按〕十颂群各恰 CJK 200（四十五言句·十颂·`。×9–11 ，×28–30` 逐 lg 验见 `_e14_stats.py`）；结颂「勝慧等菩薩，及我堅固慧，無數億劫中，說亦不能盡」殿十段之后——说颂功德回向无尽。\n\n---\n\n## 三、旁参与前接\n\n### 3.1 前接·第十三品《升须弥山顶品》（重颂↔长行互见）\n\n本品即 P13 之应颂，互见锚实测如下：\n\n| 本品句（偈） | P13 长行所颂（照彼品） | 对应级 |\n|---|---|---|\n| 「佛放淨光明，普見世導師，須彌山王頂，妙勝殿中住」 | 80-01–02 佛離菩提樹上昇須弥·入妙勝殿 | 重叙·此品放光（80-01 长行亦在本品内重说） |\n| 「一切釋天王，請佛入宮殿，悉以十妙頌，稱讚諸如來」 | 80-03「善來」请＋80-06 帝释十佛颂 | **「十妙頌」三字直引前品偈**（互见锚·孤字证） |\n| 「彼會諸菩薩，皆同我等名，所從諸世界，名字亦如是」 | 本品 80-01 结通「悉等無別」之偈重说 | 重颂内自互见 |\n| 「一切閻浮提，皆言佛在中……十方悉亦然，如來自在力」 | 80-01「十方各有一大菩薩……皆言佛在中」·P13「不起而升」段 | 翻长行事为偈义 |\n\n〔按·体例〕重颂之「所颂」为**前品（P13）之请赞与本品（P14）自家长行**之合（澄观「初⼀敘此品放光。次⼀敘前品請讚。餘三重敘此品」——法慧十颂内自科如此）；故 P14 附品既是 P13 之重颂、亦自具长行（集会·放光），**非纯粹抄前**〔本文判断〕。P13 篇内已预告第十四品即本品（P14）之重颂（互见彼篇 §1.2）。\n\n### 3.2 后接·第十五品《十住品》\n\n本品十颂所叹即十住体性：澄观「**將演住⾨先陳體性。性即佛智先讚如來**」；李通玄「二須彌頂上偈讚品。明偈讚當位之法勸修昇進之理。三十住品。明當位所⾏之⾏」；法藏判会中四品分二「**初三品是當位⾏德。後⼀品是勝進趣後**」（十住·梵行·发心·明法）——本品为其前方便。十五品品界起头实测（`_e14_full.py` 以「十住品第十五」为右界锚）。\n\n### 3.3 旁参\n\n- **六十华严**：〈菩薩雲集妙勝殿上說偈品第十〉·同名十菩萨·异世界佛号名数·颂仅五菩萨段存（§6.1′）；\n- **P13 十佛颂（帝释·过去十佛）vs 本品十月佛（十菩萨各于佛所·当位佛果）**：二颂群一叙过去佛曾入此殿、一明现在各位所事佛——名数全异，不可混〔本文判断〕；\n- **《十住毗婆沙论》（龙树）**：十住义之早期独立论（本机未逐字对勘·〔待核〕·只存目）。\n\n---\n\n## 四、义理要点与名相\n\n### 4.1 重颂之功能·文体与义脉\n\n**（一）文体**：祇夜（重颂）之常规功能为「重说以利晚来」「要义再陈」；本品兼第三式——「**颂以扬体**」：长行叙事（集会·放光），偈颂即转入**佛果体性·当位解行**之叹。十颂不依 P13 之叙事次第铺排，而依不见佛→真见佛→无见是见→二俱不可得→无住之住→说不能尽之**义理次第**展开〔本文判断·综诸家科〕——此所以九菩萨颂超出「翻长行」范围。\n\n**（二）长行·偈颂同品并立**：本品自带长行（80-01）在前、百颂在后，故第三会「长行→重颂」之对偶（P13→P14）于本品内又自具一小结构（集会长行→偈赞），与 P13 内「长行→十佛颂」同调——**会中两品即一长颂对偶之全体**〔本文判断〕。\n\n**（三）「法身」颂眼**：「**佛以種種身，遊行遍世間，法界無所礙，無能測量者**」（法慧）·「**一切法無相，是則佛真體**」（真实慧）·「**三界一切空，是則諸佛見**」（无上慧）——三句可作全品义脉之标。\n\n### 4.2 名数三列·以名表法（十住配位表）\n\n澄观依八十次第配十住（`T1735` S-0270–S-0630·疏文照录）：\n\n| 次 | 菩萨 | 世界（八十） | 澄观世界表法 | 佛号（八十） | 澄观佛果表法 | 位·方 |\n|---|---|---|---|---|---|---|\n| 1 | 法慧 | 因陀羅華世界 | 發心主導世間 | 殊特月佛 | 以⼗難得法。可謂殊特 | 初發心住·东方 |\n| 2 | 一切慧 | 波頭摩華世界 | 淨治⼼地如蓮開 | 無盡月佛 | 發⼗⼤⼼不可窮盡 | 治地住·南方 |\n| 3 | 胜慧 | 寶華世界 | 修⾏圓淨 | 不動月佛 | 觀於空等不可傾動 | 修行住·西方 |\n| 4 | 功德慧 | 優鉢羅華世界 | ⽔⽣之貴 | 風月佛 | 了知業⾏生死涅槃。如風不住 | 生贵住·北方 |\n| 5 | 精进慧 | 金剛華世界 | ⽅便堅誓故 | 水月佛 | 饒益安樂⼀切眾⽣。如⽔普潤 | 方便住·东北方 |\n| 6 | 善慧 | 妙香華世界 | 正⼼無相如⾹氣 | 解脫月佛 | 聞⼗種法。⼼定不動故得解脫 | 正心住·东南方 |\n| 7 | 智慧 | 悅意華世界 | 不退意悅 | 無上月佛 | 聞⼗不退可謂無上 | 不退住·西南方 |\n| 8 | 真实慧 | 阿盧那華世界 | ⽇出時紅⾚·童真明淨 | 星宿月佛 | 三業無失。如星明淨。隨意受⽣燦然滿空 | 童真住·西北方 |\n| 9 | 无上慧 | 那羅陀華世界 | ⼈持·華香妙⼈皆佩（王子佩持法王軌度） | 清淨月佛 | 善知煩惱現起習氣。故得清淨 | 法王子住·下方 |\n| 10 | 坚固慧 | 虛空華世界 | 智遍如空 | 明了月佛 | 觀察無數眾⽣根欲智慧⼼境。餘不能知唯⾃明了 | 灌顶住·上方 |\n\n**三列通例**（澄观·慧苑同判）：菩萨名**同「慧」**——「慧即⼗解能⾒法故」（十解·十住之解）；世界**同「华」**——「位相創開無著感果」「依无著故」；佛号**同「月」**——「表位中佛果智明闇息恩益清涼應器周故」（月·清凉·智明·闇息）。名身三列（慧·华·月）即**行德·感果·智凉**之三翻表法〔本文判断〕。\n\n### 4.3 足指放光·位胜进之表\n\n- 澄观：「⾜指拒地得住有⼒。成位不退⽽⾏有恒。數位過前加於千也」——光数「百千亿」较前加「千」，位胜进故；\n- 李通玄五处放光位次表：「**⼗信⾜輪下放光。此⼗住中⾜指端放光。明位勝進。⼗⾏⾜趺。⼗迴向膝上。⼗地眉間毫中放光**」——升进之相；又判「還是第一會中現相品所放眉間之光。以果成信。入位之光。⾜指光者。明入此住位⾝⼼智慧宮殿。表入聖之初故是指端放光也」（`T1739`）——**初会眉间光与此会足指光通贯**；\n- 「普照十方一切世界須彌頂上帝釋宮中，佛及大眾靡不皆現」——一光互见·法界大会（澄观·慧苑同引「重叠无碍」义）。\n\n### 4.4 十住位之门·从颂入义\n\n本品十颂恰成**入位之教观次第**（依颂次·综疏科）：总叙见事（法慧）→ 不依真实观则虽常见如不见（一切慧）→ 智为迷悟本·佛法待人说（胜慧）→ 三世平等·自觉觉他（功德慧）→ 离分别见·三种观（精进慧）→ 无生法忍·尽与无尽（善慧）→ 生死涅槃二俱不可得（智慧）→ 闻名离狱·无住之住（真实慧）→ 无著无念·拂无二迹（无上慧）→ 大悲出世·说不能尽（坚固慧）〔本文判断·科意取澄观「颂意」十段〕。\n\n- 「**无住之住**」之要：「一切法無住，定處不可得，**諸佛住於此**，究竟不動搖」——十住以无住为住体，本品颂文自证（不待 P15）；\n- 「见佛」义之层转：盲冥不見佛→真見佛→無見即是見→不見於諸法則得見如來→永斷分別根是故說名佛——「见」字之辩证为本品行文主轴〔本文判断〕；\n- 胜慧段疏发《涅槃》佛性三因（正因·缘因·了因·生因）长论：疏窗 S-2160–S-3240 约千五百言，为**本品疏解之最大义蕴单元**（照录 §5.1〔附论〕·附录四′）。\n\n### 4.5 名相表\n\n| 名相 | 训释 | 出处 |\n|---|---|---|\n| 偈赞（应颂·祇夜） | 长行既说、重以偈扬；本品兼扬体性 | 澄观来意判 `T1735` |\n| 毘盧遮那藏師子之座 | 随所来方各自化座；遮那·遍·光藏之座 | 80-01；李通玄「毘盧者光也。遮那者遍也」（`T1739`） |\n| 因陀羅華 | 此云**能主**·（李通玄：「⾃他智慧果」义） | `T1739`；澄观配发心住 |\n| 波頭摩華 | 此云**赤莲华**（合论）·或莲华通称 | `X0223`；六十作「蓮華」 |\n| 阿盧那華 | 此云**日出时**·红赤之色·童真明净表 | `T1735` S-0360；六十但名「欢喜」非此对 |\n| 那羅陀華 | 此云**人持**·华香妙人皆佩 | `T1735` S-0360 |\n| 殊特月佛 等十月佛 | 各配十住果德（§4.2 表） | `T1735` S-0450 起 |\n| 十妙頌 | 法慧颂自指 P13 帝释十佛颂 | 80-03·互见锚 |\n| 世間塔 | 「聞佛名生信，則是世間塔」 | 80-21 |\n| 無生法忍 | 善慧颂意「得不退轉無生法忍」 | `T1735` S-4320 |\n\n### 4.6 小结\n\n本品以重颂之体，行扬体之实：三列名数表位、百颂转法身义、足指光显胜进；「说亦不能尽」一语收尽颂意。会读诸家之异同（法藏无独立题而散科、智俨数偈分段、澄观三分配位、李通玄表法升进、慧苑考梵题）适呈**附品之疏解史**——科判愈后愈密（§5.4）。\n\n---\n\n## 五、注疏选要（诸家会读）\n\n〔本节简要选摘·各家长文见 raw 窗口；L.194 注入件：§5.1 澄观长文全摘·附录四′科段全文照录〕\n\n### 5.1 澄观《大方广佛华严经疏》（`T1735`）——「須彌頂上偈讚品第十四」段（卷第十六）\n\n疏窗实测 @214595–221315·raw 长 6,720·「十頌」×10。科纲：**三分**（集眾·放光·偈讚）＋集会「**⽂有⼗同。義兼三異**」＋十段颂科（初一总·余九别）。要目：\n\n- **来意**：「既明化主赴感。今辨助化讚揚。將演住⾨先陳體性。性即佛智先讚如來。故品來也。」\n- **释名**：「須彌約處讚稱佛德。依處有讚故立此名。亦頂上之讚揀餘處也。」\n- **宗趣**：「以集眾放光偈讚為宗。為成正說為趣。⼜顯佛德為宗。令知住體為趣。」\n- **集会十同**：「一集因同皆佛⼒故。亦同會前時。⼆⼗⽅下主⾸同。三⼀⼀各下眷屬數同。四從百佛下。來處量同……五其名下表法名同……六所從來下世界名同……七各於下所事佛同……⼋是諸已下申禮敬同。九隨所來下威儀住同。⼗如此下結⼗⽅同。」\n- **放光六义**：「⽂義有六。⼀時。⼆主。三處。四數。五相。六業」；「一光照於一切則一切亦爾。重疊無礙無不互⾒。為⼀法界圓明⼤會。」\n- **十段颂科各「颂意」**：见 §2.2–2.11 各段首引；十世界·十月佛配十住全文见 §4.2。\n- **胜慧段佛性附论**（疏窗 S-2160–S-3240）：因「佛法無人說，雖慧莫能了」之颂，大发《涅槃》三因义·「灯喻双喻缘了」「乳中酪性」之辨·引「师子吼」经文·判「今此經宗。宗於法性故。以法性⽽為佛性。則非內非外隨物迷悟強說升沈」。\n\n\n**〔L.194 本批·疏科长文全摘〕**（`T1735` 卷第十六「須彌頂上偈讚品第十四」本科段·NFKD 1:1 重锚·引文照 raw 原字形·跨行连读剥空白·分页符剔除·窗 CJK 5479·raw @214595–221313·康熙部首原字形保留）\n\n*甲·来意（助化赞扬·将演住门先陈体性·性即佛智先赞如来）*：\n\n> 「須彌頂上偈讚品第⼗四初來意者。既明化主赴感。今辨助化讚揚。將演住⾨先陳體性。性即佛智先讚如來。故品來也。⼆釋名」\n\n*乙·释名（须弥约处赞称佛德·顶上之赞拣余处）*：\n\n> 「⼆釋名者。須彌約處讚稱佛德。依處有讚故立此名。亦頂上之讚揀餘處也。三宗趣」\n\n*丙·宗趣（集众放光偈赞为宗·为成正说为趣·显佛德为宗·令知住体为趣）*：\n\n> 「三宗趣者。以集眾放光偈讚為宗。為成正說為趣。⼜顯佛德為宗。令知住體為趣。第四釋文」\n\n*丁·释文总科（三分·集众分十同三异·世界华名别配十住·所事佛同）*：\n\n> 「第四釋文總為三分。第⼀集眾分。第⼆放光分。第三偈讚分。今初文有⼗同。義兼三異。謂五六七。⼀集因同皆佛⼒故。亦同會前時。⼆⼗⽅下主⾸同。三⼀⼀各下眷屬數同。四從百佛下。來處量同。前⼗此百位已增故。五其名下。表法名同。慧即⼗解能⾒法故。菩薩名異⾄偈釋之。六所從來下。世界名同同名華者。位相創開無著感果故。別即次第配於⼗住。⼀發⼼主導世間故。⼆淨治⼼地如蓮開故。三修⾏圓淨故。四⽔⽣之貴故。五⽅便堅誓故。六正⼼無相如香氣故。七不退意悅故。八阿盧那者。此云⽇出時。紅⾚之相童真明淨故。九那羅陀者。此云⼈持。以華香妙⼈皆佩故。王⼦佩持法王軌度故。⼗智遍如空故。亦可別明⼗住勝進⼗法。思之可知。七各於下。所事佛同。同名⽉者。表位中。佛果智明闇息恩益清涼。應器周故。別名即⼗住。⾃分⼗法之果。⼀以⼗難得法。可謂殊特。⼆發⼗⼤⼼不可窮盡。三觀於空等不可傾動。四了知業⾏⽣死涅槃。如風不住。五饒益安樂⼀切眾⽣。如⽔普潤。六聞⼗種法。⼼定不動故得解脫。七聞⼗不退可謂無上。八三業無失。如星明淨。隨意受⽣燦然滿空。神⾜⾃在若依空運轉。九善知煩惱現起習氣。故得清淨。⼗觀察無數眾⽣根欲智慧⼼境。餘不能知唯⾃明了。以此⼗因成茲⼗佛。上且隨要相屬以為此釋。委明其相如⼗住文。八是諸已下申禮敬同。九隨所來下威儀住同。⼗如此下結⼗⽅同。⼜上⼗⽅從東次第。如名號品問。準此結通。即於⼗⽅盡空世界。皆有菩薩⽽來集會者。且如東⽅過百剎塵⼟。外亦有眾集。未知彼因陀羅華世界為在何處。餘界亦爾。答如名號品。第⼆爾時下」\n\n*戊·放光分（文义六：一时·二主·三处·四数·五相·六业·足指义·重叠无碍一法界圆明大会）*：\n\n> 「第⼆爾時下。如來放光分。文義有六。⼀時。⼆主。三處。四數。五相。六業處。謂兩⾜指⾜指拒地得住有⼒。成位不退⽽⾏有恒。數位過前加於千也。相表解顯故云妙⾊。普照⼗⽅顯佛眾會。⼀光照於⼀切則⼀切亦爾。重疊無礙無不互⾒。為⼀法界圓明⼤會。第三爾時法慧下」\n\n*己·偈赞分十段之①（总科「初一是總餘九為別…」＋東方法慧颂科）*：\n\n> 「初⼀是總餘九為別。以法慧是說法主故。總敘此會本末事義。總顯佛德。餘九歎佛差別之德。總別共顯如來無礙之會。此⼗菩薩名亦表⼗住。其所說法表位勝進。勝進有⼆。⼀趣後位。⼆趣佛果。今約佛果。今初東⽅法慧總了佛法故。勝進中云。欲令菩薩於佛法中。⼼轉增廣。文中觀佛現⽤。及與往修皆周遍故。⼗頌分三。初五敘因佛光⾒多盛事。初⼀敘此品放光。次⼀敘前品請讚。餘三重敘此品。次⼆勸觀佛⼒。更發勝⼼。即前品不起⽽升。後三舉因結果。初⼀舉因後⼆結果。由因中⾏願剎剎⿑修故。果位⾝智遍應遍斷」\n\n*（已含段①·庚从段②起）*\n\n*庚2·十段之2（南·一切慧颂科）*：\n\n> 「第⼆南⽅⼀切慧者。了⼀切法真實之性。淨⼼地故。頌意為顯於諸眾⽣。增⻑⼤悲以稱實⽽觀救世者故。⼗頌分六。初⼆違理觀佛非⾒佛。次四了法真性真⾒佛。三有⼀偈迷性取法不⾒佛。四⼀偈。佛即同法為真佛。五⼀偈引已了法為⾒佛。六⼀偈。推功有本了真佛。初中前偈出其妄觀。假設⻑時以況暫⾒。後偈明其有損。由上不依真實則取相乖真。但⾒集網繫於苦獄。盲無慧眼。冥然不⾒佛之法⾝。然此遮取相故。假設⻑時無有多劫。全不了義。以⾒如來增智慧故。第⼆四偈。了法真性真⾒佛。於中⼆。前⼆真觀後⼆真⽌。前中初⼆句。空觀緣⽣無性故。次⼆句假觀隨俗假名故。次⼆句中。觀由前⽣滅⼀切諸法即無性故。相體即是不⽣滅也。後⼆句觀益。諸法如即是佛如。無⽣滅佛體本常。觀稱於如則佛常現。況三觀⼀⼼則佛之體⽤。無不現矣。後⼆真⽌中。以觀觀法能所紛動。故須寂之。初句牒前法性。次句泯其能所。法性本空非觀之使空。故無所取何有能⾒。次⼆句。⼼冥性佛故⽌絕思求。⼜上來空以遣有假以遣空。如則雙遣空假。形奪兩亡。若謂雙非還成戲論故。辨起⼼皆妄絕念⽅真。念本⾃無斯絕亦滅。故中論云。如來寂滅相分別有亦非。如是性空中思惟亦不可。⽤斯文也。後⼀顯觀益。⼼冥體性惑何由⽣。亦含三⽌意也。⼜亦通結⽌觀。稱上⽽觀⾒惑性空。即同佛性。何能染哉。第三⼀偈迷性中。上半取法次句迷性。末句結過。第四⼀偈。佛即同法如。謂同空法故離三世。同假法故相具⾜。同雙遣故無住無著。同如體故遍不動搖。第五⼀偈。引⼰中。此親⾃證希眾無惑。第六⼀偈推功有本者。非師⼼也。亦謙⼰推⼈異乎凡情。令法鉤鎖殊塗同致。下八準之」\n\n*庚3·十段之3（西·勝慧颂科）*：\n\n> 「第三⻄⽅勝慧。以解佛勝智隨空⼼淨。故以為名。頌意。為顯欲令菩薩智慧明了。即⼤智了如及佛性故。⼗頌分四。初⼀讚智為迷悟本。次四正顯迷悟。次四喻前得失。後⼀推功有在。今初。由難思故迷難則容有。思者故有悟。次四迷悟中。初⼆迷後⼆悟。迷中初⼀⼼外取境⽣想違理。故不能⾒無相之佛。後偈取蘊內相不了蘊性。故不⾒⼼佛。亦是愚法⼩乘。故名無知者。後⼆迷中前明倒想。內外俱妄。今有了因內外皆悟。初偈翻前外取。謂了⼀切法即⼼⾃性。性亦非性。情破理現則⾒舍那。稱於法性無內外也。後偈翻前內取。了蘊性相則⾒⾃⼼之佛。與盧舍那。非⼀非異故難思議。然此⼀偈文含多意。⼀但是蘊縛無有我⼈。則破前凡夫取我相也。⼆前後因依相續無性。則破凡⼩取法相也。此性即第⼀義空。第⼀義空即是佛性。⼜上性無所有正因性也。前解此了。皆了因性。此蘊相續。即是正因。亦名⽣因。⾔正因者。是中道義。中道即是佛性。謂現在陰滅中陰陰⽣。是現在陰終不變。為中陰五陰。故現陰非常如種⽣牙。種不⾄牙。雖不⾄牙⽽能⽣牙。此現在陰雖不⾄後。⽽能⽣後。則現陰非斷。⽽中陰五陰亦非⾃⽣。不從餘來。因現五陰⽣中陰陰。斯則後陰非無因。故後陰非常。既能續前故後陰非斷。非斷非常是中道義。正因性也。能⽣佛果故⽈⽣因。眾⽣佛性有⼆種因。⼀者正因。⼆者緣因。正因者謂諸眾⽣。是故五陰即正因也。緣因者。謂六波羅蜜。非蘊相⽣名緣因也。今以了因了彼正因。故⽈於此性了知。了即般若亦緣因也。第三四偈。喻前得失者。前三喻失後⼀喻得。前中⼆。初⼆喻內取失。於中初⼀顯無緣了不⾒正因。闇中寶者正因性也。圓滿可貴。所以稱寶。居於無明五陰室內。如在闇中。燈喻緣了之因。下半法合。無⼈說者。闕於緣因雖慧莫了。義含⼆意。⼀慧即正因。合上寶也。闕於緣因故不能了。⼆佛法即寶。以闕緣因。雖內有慧不成了因。不⾒真性。然則緣因即是了因。了因未必是於緣因。有親疎故。善友是於緣因⽽必是了。佛性名為了因。未必是緣。此約智慧性故。若以第⼀義空為佛性者。唯是正因。⽽非了因。但為了因所了。⽽非⽣因所⽣。若以智慧為佛性者。即是了因。若以五蘊為佛性者。名為正因。亦名⽣因。然復⽣必對了正必對緣。今燈⼀喻雙喻緣了。闇中之寶雙喻正了。義意包含。具如涅槃⼆⼗六七所辨。⼜上燈喻既是正義。何以涅槃師⼦吼立。佛不許耶。故師⼦吼⾔。⼀切眾⽣有佛性。性如乳中酪以有性故。要須緣因。何以故。欲明⾒故。緣因者即是了因。譬如闇中先有諸物。為欲⾒故以燈照了。若本無者燈何所照。故佛難⾔。若使乳中定有酪性。即是了因。若是了因復何須了。⼜善男⼦。⼀切眾⽣有佛性者。何須修習無量功德。若⾔修習是了因者。已同酪壞。結正義云。乳有酪者以定得故。佛性亦爾。眾⽣有者以當⾒故。然上諸義總有⼆意。⼀燈了於寶為正義者。約因性故師⼦吼立。佛不許者約果性故。⼆者燈喻正者。約其體性與有不異。佛不許者。約其現惑與無不殊。故知若⾔定有名為執著。若⾔定無是則妄語。應⾔眾⽣佛性亦有亦無。然眾⽣智慧是佛性因。菩提涅槃是佛性果。然則佛性非因非果。今此經宗。宗於法性故。以法性⽽為佛性。則非內非外隨物迷悟強說升沈。佛性要義不可不知。廣如別章。及涅槃師⼦吼品等說。後偈⽬有翳者。此喻了因。與惑俱故⾒不清淨。以不淨故不⾒佛法。佛法即⾒佛性。故涅槃云。佛性⼆種。⼀者是⾊⼆者非⾊。⾊者諸佛菩薩。非⾊者⼀切眾⽣。⾊者名為眼⾒。非⾊者名為聞⾒。佛性者非內非外。雖非內外然非失壞。故名眾⽣悉有佛性。⼆⼀偈。喻上外取之失。瞽謂全無於⽬如⿎⽪故。則全不⾒佛。無垢障為明淨⽬。取相是識非智慧眼。故不⾒也。三⼀偈。喻前悟中抉去取相之翳。捨於空華之像。絕⾒契如則⾒如佛。第四⼀偈。推功有在準上可知」\n\n*庚4·十段之4（北·功德慧颂科）*：\n\n> 「第四北⽅功德慧者。⽣在佛家善解佛德故。此頌意顯於三世中⼼得平等。了知⾃⼼窮法空故。⼗頌分四。初四明凡⼩妄覺。次四⽰其真覺。三有⼀偈佛覺雙圓。後⼀偈。推功有本。今初分⼆。初⼀偈。說凡迷緣起之無性。執著相⽽輪迴。後三頌通凡⼩。初⼀辨迷執隨⾔作解。可謂⼩智⼼外取法為妄分別。餘⼆偈明過失。初⼆句。曲徑趣寂迷⼀直道。次半有常等倒。⻑世間惡。有無常等⻑無明惡。次半不⾒⼆空。受⼆死苦。後半無實諦觀。何有法眼。三乘縱有亦不名諦。次四⽰其真覺中。初偈引⼰之損勸物成益。次偈教其真⾒。謂⾒佛無取即是⾒如。如即佛所知也。次偈教其了俗。上半躡前證真。下半⽅能了俗。後偈拂前⼆⾒。以成真⾒。謂上半取真俗之⾒忘。⽅⾒真俗之正理。下半反釋。謂有真俗之可⾒。不能⾒真俗之真源。故智論云。若⼈⾒般若是則為被縛。下半意也若不⾒般若是則得解脫。上半意也。若⼈⾒般若是則為解脫。即第六七偈意也。若不⾒般若是則為被縛。即第四偈意也。唯忘⾔者可究斯旨。第三⼀偈。顯佛⼆覺雙圓。不可覺中⽽⾃覺。故是⽈奇哉。知無眾⽣⽽能覺他。⼤導師也。第四可知」\n\n*庚5·十段之5（東北·精進慧颂科）*：\n\n> 「第五東北⽅精進慧。以勤觀真理集無量善。俱無住故。頌意。為顯欲令其⼼轉復精進。無所染著。文中由離分別如實⾒故。⼗頌分⼆。前九觀法後⼀推功。前中三。初三所執無相觀於中。初⼀舉分別過。後⼆顯無相觀。⼀離所取。上半知於情有。下半知於理無。如迷⽊⾒⿁。知⿁是迷有。名如實知⿁。知⿁本無舉體是⽊。名為⾒⽊。⼆離能取以所取空故。上半舉失。如若⾒⿁即不⾒⽊。下半顯得離於⿁⾒。⽅為⾒⽊。次三明緣起無⽣觀。⼀遣所緣。然依他⼆義。⼀者幻有從分別⽣即是上半。⼆者無性即是下半。⼆泯能緣。上半牒前⽣過。有無⽣⾒同世非實。下半⾒等無⽣名真⾒者。三辨觀益。後三明圓成無性觀。⼀牒前⼆無。謂能所分別皆不可得者。即圓成性淨故。⼆正顯真性。初句體有次句相無。此⼆融即故無能說。三觀成利益。及第⼆推功。文並可知」\n\n*庚6·十段之6（東南·善慧颂科）*：\n\n> 「第六東南⽅善慧菩薩。成就般若慧鑑不動。可謂善矣。此頌。為顯欲令其⼼轉復增進。得不退轉無⽣法忍。文中離垢解脫無體性故。⼗頌分四。初⼆⾒佛。次三⾒法。次三觀成利益。後⼆推⾒有依。今初前偈讚所⾒。上半標讚。下半釋成。智離所知⼼脫煩惱。兼⼆利故。⼆障難除眾⽣難度。⾃強不息為希有勇健。後偈中。能⾒謂我如實⾒。如⼤菩薩⾒。次三⾒法中。約眾⽣說。初偈正顯。盡即有為。諸⾏無常速起滅故。有為之性湛若虛空。便是無為體常遍故。次⼆偈拂迹入⽞。上半拂前無為。謂既如虛空。何有無為之相。次四句拂前有為。謂既約⾃性論無盡。則不壞於盡。故⽈難思。盡即無盡故無眾⽣也。後⼆句。觀成利益⾒法⾝也。次三觀成中。初偈顯法空。由下半了能所⾒緣成無性故。上半能所之⾒⾃亡。次⼆句顯我空。能所之法尚空。誰為能⾒之者。後⼆句顯實。但除上病不除真法。⼆空之體及所顯圓成。即真佛也。三⼀偈雙結知佛法益。文顯可知。四有⼆偈。推⾒有依者。謂佛說⼀道清淨。故能遣有。進慧演無量⾨。復能遣無。想滅理現⽅知如來。乃住無有無之際也。⼜智論云。法性為實證實為際。凡夫有實未能證也」\n\n*庚7·十段之7（西南·智慧颂科）*：\n\n> 「第七⻄南⽅智慧者。決斷不動所以名智。頌意。為顯於⼀切法皆能出離。文中⽣死涅槃皆善離故。⼗頌分⼆。初⼀引⼰勵眾。餘偈希眾同⼰。於中亦⼆。前六⽰迷後三啟悟。前中亦⼆。初⼀⼈執。理實無⼈橫計成險。餘皆法執。於中初⼆執世法。後三雙執世出世。今初。初⼆句明執。謂計蘊為實。不能觀⾝實相。餘皆明過。初⼆句執實乖理不⾒佛。次⼆句無慧不⾒佛。後⼆句但益流轉後三雙執中亦分為⼆。初⼆執法後⼀執佛。前中亦⼆。⼀立理⼆起執。初中上半假立。謂待前流轉⽣死。以立涅槃。煩惱名諍。觸動善品損害⾃他故名為諍。此有漏法諍隨增。故名為有諍。有彼諍故。故⽣死者有漏為體。無彼煩惱故稱涅槃。下半雙非。謂⽣死涅槃。俱因煩惱假立其名。何有真實。⼜⼆互相待故俱空。⼆互相奪故皆寂。後偈起執。上半執下半損。後⼀執佛中。亦上半執下半損。執有三義。⼀佛佛相望。⼆三⾝等相望。三⼼佛相望。後三啟悟中亦⼆。初⼆順理之得。後⼀舉佛釋成。前中亦⼆。半偈明順理⽽知。餘顯順知之益。益中亦⼆。半偈標⼀偈釋。云何超⾔。若取知能知寂未免於⾔。有所緣故。知⾃知知亦非無緣故。須能所平等等不失照故。無知之知不同⽊⽯。故云能⾒。後偈舉佛釋者。上云佛然。佛云何然。釋云。覺於三世離分別故。種習斯亡為斷根也。⼜亦無⼼捨於分別。名為斷根」\n\n*庚8·十段之8（西北·真實慧颂科）*：\n\n> 「第八⻄北⽅真實慧菩薩。⼼不顛倒是真實慧。頌意。為顯欲令增進於⼀切法。皆得善巧文⾔。於法不顛倒如實覺了。是善巧義⼗頌分⼆。前⼆明依實立名。名能益物。後八顯名下之實。辨益所由。今初前頌明損益。受苦聞名速解脫故。受樂不聞反沈淪故。後頌敘昔以成今說。後八中分三。初三覺妄證實。是覺察義。次⼀雙覺⼆諦。是覺照義。後四非覺⽽覺是妙覺義。今初也。初偈證實立名。初句揀似比量。無常計常常計無常等。是顛倒法。名似比量。次句證真現量。如眼⾒故。次句揀似現量。顯真現量。謂男女天地等⾒⼀合相。名似現量。⼀合相相不可得故。故名為離。非唯所覺離合。亦無如外之智與如合也。下句結名。次偈例去來。後偈成現觀。次⼀覺照者。真諦名實無和合故。俗諦非實假和合故。互融無雜名究竟解。夫實⾒者。尚不⾒實何況非實。⾒非實者知其即實。故中論云。⼀切法真實⼀切法非實。亦實亦非實非實非非實。是名諸佛法。後四非覺⽽覺者。初偈正顯如智。相離名不可覺。寂無遺照故名了此。要不可得⽅是真修。次⼆偈展轉釋成。初偈釋無⼀之義。上半相待⽽有。通同異體。下半緣⽣故空。則⼀多相盡矣。後偈上半。釋前偈下半。無能所作故無所依。從業想⽣故是和合。下半釋成上半。云何知無能所。異業想外無我所故。後有⼀偈結成妙義。上半所住下半能住。由無住故無所不住。謂不住有以即空故。故能住有契有實故。亦不住無無即有故。不住俱有無。無⼆體故。不住雙非不壞⼆相故。能住例知。既以無住為住。則⼼絕動搖。⽅契本覺湛然常住」\n\n*庚9·十段之9（下·無上慧颂科）*：\n\n> 「第九下⽅無上慧。名如初頌。⼜從法王教⽣當紹佛位。故名無上。頌意為顯欲令增進⼼無障礙。文云無著無念不住法故。⼗頌分三。初⼀釋已名義。次八顯佛勝德。後⼀推功結益。次八中分⼆。前六內證德。後⼆外化德。前中亦⼆。前偈正明證入。後五照境顯理。今初即菩提涅槃。以無所得得菩提故。處即涅槃本覺⾃然。故非造作。悟亦冥符則智無分別。三細已盡六麁居然。⼜不可以識識故無麁者。不可以智知故無細者。⼜有能所證名之為麁。無能所證⽬之為細。皆⾔語道斷故並無之。菩提涅槃絕⼼⾏故。後五中。初偈正明照境。境即俗境有能所故。即俗⽽真故云無數。⼼同無為故云遠離。是佛真法雙結能所。後四遣相顯理。皆躡迹遣滯。初偈。雙非顯中照理滅障。菩提涅槃離有無故。次⼆偈釋前雙非。⼀偈半釋非照義。初句是總次句能照無著。故云無念。亦不染此無念。次句所照無著。以無處所為所住故。次句不壞能所。次⼆句雙遣性相。次⼆句釋非無照。稱理照故。後偈拂前無⼆之迹。⾔無⼆者但⾔無有⼆。非謂有無⼆。若存無⼆之⾒則還成⼆。以無⼆必對⼆故遣之。⼜遣之以⾄於無遣。故云三界⼀切空。空謂第⼀義空。諸佛同⾒。後⼆外化德中。前偈正顯令住無住之覺。後偈釋成。⾝即非⾝故無可悟。悟⾝⾒起此⾒如⾝。⾝⾒兩亡真法⾝也。觀⾝實相觀佛亦然。故就佛結。推功可知」\n\n*庚10·十段之10（上·堅固慧颂科）*：\n\n> 「第⼗上⽅堅固慧者。智⼒成就不可壞故。頌意。為顯欲令增⻑⼀切種智。文云得淨慧眼了佛境故。⼗頌分四。初偈總歎為物興世。智光遍照⼤悲勇健。次四別⽰悲相。初偈觀機次⼆反以釋成。後⼀正明兼顯僧寶。次三頌半⾒聞利益。後⼀頌半結德無盡。此為終極故總舉前⼗」\n\n\n### 5.2 法藏《大方广佛华严经探玄记》（`T1733`）——附品无独立题·散科直证（卷十四·十住会）\n\n**体例登记**：`T1733` 通检**无「須彌頂上偈讚品第十四」独立科题**（实测锚 ×0；「說偈品」×3·首见@263 多系目录与他卷之称·未细检〔待核〕）——探玄记于第三会以**当位偈科散入十菩萨名义下**，此即**附品在早期科判中之存在形态**（如实登记·不谓其无解）。散段直证（raw 窗：`_e14_sources.txt` 散段旁证·堅固慧末现@149776 前后）：\n\n- 「九無上慧者慧離上相故。⼗偈分三。初⼀釋已名。次⼋顯佛德。於中初六辨佛內證德……後⼆顯佛外化德」；\n- 「⼗堅固慧者知佛恩不可壞故。⼗偈分三。初六舉佛恩深。次三慶已逢遇。後⼀結歎無盡。前中初⼀句標恩。餘釋顯恩相。⼀為物出現。⼆⾒物深苦。三明救苦唯佛。四與樂亦佛。五佛眾亦能。六⾒聞獲益。⼆慶遇中三。⼀慶已益。⼆眾同益。三重慶⾒智益。亦是結已所說。後⼀是總結上九⼈說。」\n\n**校读**：法藏科坚固慧「後⼀是總結上九⼈說」与经文「勝慧等菩薩，及我堅固慧，無數億劫中，說亦不能盡」恰应——探玄记虽无独立品题，**十颂逐段之科已具**（其第九·第十段直证·余八段散在卷内未遍检·〔未竟·待后续批〕）。\n\n### 5.2′ 智俨《华严经搜玄分齐通智方轨》（`T1732`）——十菩萨偈数科（卷三·搜玄记）\n\n智俨科**各颂群偈数·段数**（raw @34037–34509 区间·疏窗）：「四功德慧偈有五。初四明迷者失。次⼀⽰勝⽅便。次三明得法性益。次⼀歎佛利⽣⽅便。次⼀推功在本。五精進慧偈有三。初⼀彰失。次⼀辨德。次八廣辨觀式獲益相。八文內前四無相⽣。後四真實性也。六善慧偈有四。初⼆明有解能度⾃他。次五明無⽣故應真性。次⼀半歎解勝能。次⼀半推功在本。七智慧偈有三。初⼀明因教成正解。次六明迷教理者失。次三重成解德。八真實慧偈有五。初⼆挍量勝劣得失。次⼆辨所觀境。次⼀舉益勸學。次⼀釋知者名。次四⽰其觀儀。九無上慧偈有四。初⼀釋⼈名。次六歎⾃利。次⼆歎利他德。次⼀推功在本。⼗堅固慧偈有四。初四歎佛是真歸。次⼆舉德勸依。次⼆引⾃勸物令入。次⼆舉勝⼈顯德無盡以勸依也。」\n\n**校读**：智俨「偈有五／有三／有四」指**颂内义段组**非颂数（各人实皆十颂·§7.1 实测每 lg CJK200·10 颂）——三祖对同一颂群之分段各异（智俨义段·法藏三科·澄观四科），**数段之异正显颂文义转之多门**〔本文判断〕。搜玄记又总科第三会六品三分（§1.2 引）。\n\n### 5.2″ 慧苑《续华严经略疏刊定记》（`X0221`）——本品四门科（梵题直证）\n\n专段题命中 @160590（raw 窗口 `_e14_sources.txt`）：\n\n- **释名出梵本**：「若依梵本。具名應云**如來於須彌頂神變集會菩薩說偈品**。此即如來於須彌頂之神變集會菩薩說偈。依主釋也。」——本品**唯一梵题形制之直证**（不妄构梵文·只照录）；\n- **来意**：「前品明化主應機。是當會遠⽅便。今此明助化說偈。是當會近⽅便。故須來也。」——远方便／近方便双判；\n- **宗趣**：「以集眾偈讚為宗。成後正說為趣」；\n- **集众七事**：「⼀佛⼒者。集眾因也。⼆⼗⽅各有下明眾集⼤數。三從百佛下明來處近遠。謂前⼗此百。顯漸增之相。四其名下辨列其名。同名慧者。表⼗解故。五所從下明來處剎名。同名華者。表此解慧依無著故。六各於下明來處剎中。同名⽉者。表解開敷⼗⾏華故。七是諸下設般列坐」——三列表法之另一系（华·「解开敷十行华」异澄观）；\n- **颂科**：「三偈讚中⼗菩薩說偈。即為⼗段。初⼀是總。餘九是別。以法慧是說法主故。通敘此會本末事意。總顯佛德。餘九別歎佛理教等」；法慧「⼗頌分⼆。前七敘會中事。後三舉因釋成」；一切慧「⼗頌分四」·胜慧「⼗頌分四」各细科（raw 全窗照录·附录四′〔余段待注疏库全检·本批摘其窗内者〕）。\n\n### 5.3 李通玄《新华严经论》（`T1739`）——本品四门·十一段长科（专段题 @184414）\n\n- **四门**：「將釋此品約作四⾨分別。⼀釋品名⽬。⼆釋品來意。三都會此⼗住六品經意。四隨文釋義」；\n- **名目**：「以法慧等⼗箇菩薩。各以⾃當位隨位進修之法。還⾃以偈讚之。令信終菩薩倣之悟⼊故。此品名為偈讚品」——「偈赞」释为**当位菩萨自赞当位法**（非徒重颂·自门之见）；\n- **来意**：「明前已創昇須彌帝釋以偈歎佛。此品明⼗住位當位菩薩將當位法⾨以偈讚之。令信⼼者得⼊位故」；**三世佛判**：「初歎過去佛。次歎今現在佛。未來佛者。即⼊此位者是也。是故經中不云未來。⼗佛是過去佛。盧舍那是現在佛。修行始⼊位者。是未來佛」；\n- **六品都会**：§1.2 引（「明偈讚當位之法勸修昇進之理」）；\n- **十一段长科**：「⼀從爾時佛神⼒故已下有⼗九⾏半經。明佛以神⼒令眾來集分。⼆從法慧菩薩承威說頌已下。有⼗⾏頌。是明法慧菩薩歎佛放光集眾分。三爾時已下。明⼀切慧承威說。⼗⾏頌……⼗⼀爾時堅慧說⼗⾏頌。歎佛⼤悲出興利益」——**「十行颂」者，十菩萨各十颂之总身**；又长行内析七段（十九行半经分七·「七爾時已下一⾏經。明法慧菩薩說頌歎佛」）；\n- **表法释**：世界·佛号·座·放光五处位次（§4.2·§4.3 引）；又判「⼜云⼗⽅諸來法慧等⼗菩薩眾各於佛所淨修梵⾏者。明各於⾃⼼法⾝智慧能淨煩惱清涼如⽉處」——**颂中「各於佛所淨修梵行」被收归自心法身之释**（合论同调）。\n\n### 5.3′ 李通玄《华严经合论》（`X0223`）——「第十四之余」·十菩萨五门释（专段 @304067）\n\n合论本标「**須彌頂上偈讚品第⼗四之餘**」·逐菩萨**五门／四门**释（名·世界·佛果·座体·方所），要点：\n\n- 一切慧：「達⼀切法無體無性非迷執故。此當第⼆治地住修戒波羅蜜……波頭摩華此云⾚蓮華也為表戒相無染處世赫弈開敷」·南方·善财**海云比丘**（普眼法門）；\n- 胜慧：寶華·不動月·西方·善住比丘（無礙法門·忍波罗蜜）；功德慧：優鉢羅華（青莲）·風月·北方·弥伽长者（輪字法門·精进波罗蜜）；精进慧：金剛華·水月·东北方·解脱长者（禅·法性为体）；善慧：妙香華·解脫月·东南方·海幢比丘（般若）；智慧：悅意華·無上月·西南方·休捨优婆夷（满愿·慈悲）；真实慧：阿盧那華（红莲）·星宿月·西北方·仙人毗目瞿沙（出声可畏·智增）；无上慧：那羅陀華·……（力波罗蜜·法王子住）；\n- **体系**：十住 × 十波罗蜜 × 十方所 × **善财十知识**三重会配——合论以**法界人事地图**收本品（其「⼗⾏中佛果名號下名悉同……⼗迴向中佛果名號上名悉同……」判位名通例）。\n\n〔按〕合论所配善财知识次第·与《入法界品》本文之对勘非本批范围〔未竟·待后续批〕。\n\n### 5.4 诸家对读小结\n\n| 家 | 有无独立品题 | 科判骨架 | 特色判语 |\n|---|---|---|---|\n| 智俨 `T1732` | 无专题·六品科中散判 | 各人偈义段（五·三·四…） | 义段组·「前四無相⽣、後四真實性」 |\n| 法藏 `T1733` | **无独立题·散科** | 十人各三科（第九·十直证） | 「後⼀是總結上九⼈說」 |\n| 澄观 `T1735` | 有（卷第十六） | 三分＋十段·集会十同三异 | 来意「性即佛智先讚如來」·涅槃佛性附论 |\n| 慧苑 `X0221` | 有 | 四门同前·集众七事 | **梵本具题**·远近方便判 |\n| 李通玄 `T1739` | 有 | 四门·十一段·七段 | 当位自赞·三世佛·放光五位 |\n| 李通玄合论 `X0223` | 有（之余） | 每菩萨五门 | 十住×波罗蜜×善财知识会配 |\n\n**趋势**：法藏以前无附品独立科题（重颂并入当会科段）→ 澄观以下三分十段大备→ 李通玄转表法系。**附品之「附」在科判史上渐次脱落·颂文本体之地位渐升**〔本文判断〕。\n\n---\n\n## 六、文本对读与校勘\n\n### 6.1 与六十华严〈菩薩雲集妙勝殿上說偈品第十〉对读（卷七存段）\n\n**题目**：八十就**处·法**（须弥顶上偈赞）；六十就**集会·殿·行相**（菩萨云集妙胜殿上说偈）——两译题式异·各照底本。\n\n**存段实测**：juan7@8200–卷末（10,014）·CJK 1,421（品题 13·卷尾题 10·净 1,398）。「」×5·」×5——**五颂块全闭合**：法慧·一切慧·胜慧·功德慧·精进慧各起式×1；**善慧起×0**（以下转入卷八·本机未入库）——现存颂 100 偈行（CJK10 双句行）= 200 五言句 = 50 颂，恰当八十之半。**两译对照表（三列名数）**：\n\n| 次 | 菩萨（两译全同） | 八十世界 | 六十世界 | 八十佛号 | 六十佛号 | 同异 |\n|---|---|---|---|---|---|---|\n| 1 | 法慧 | 因陀羅華 | 因陀羅 | 殊特月佛 | 不變月 | 世界同根 |\n| 2 | 一切慧 | 波頭摩華 | 蓮華 | 無盡月佛 | 無盡月 | 佛号同 |\n| 3 | 胜慧 | 寶華 | 眾寶 | 不動月佛 | 不動月 | 佛号同 |\n| 4 | 功德慧 | 優鉢羅華 | 優鉢羅 | 風月佛 | 香風月 | 世界同根·佛号近对（風月↔香風月·〔本文判断〕） |\n| 5 | 精进慧 | 金剛華 | 妙行 | 水月佛 | 自在天月 | 异 |\n| 6 | 善慧 | 妙香華 | 善行 | 解脫月佛 | 清淨月 | 异 |\n| 7 | 智慧 | 悅意華 | 歡喜 | 無上月佛 | 無上月 | 佛号同 |\n| 8 | 真实慧 | 阿盧那華 | 星宿 | 星宿月佛 | 星宿月 | 佛号同（六十世界挪次） |\n| 9 | 无上慧 | 那羅陀華 | 無厭慈 | 清淨月佛 | 不衰變月 | 异 |\n| 10 | 坚固慧 | 虛空華 | 虛空 | 明了月佛 | 無量自在月 | 世界同根 |\n\n**实测统计**：菩萨名**两译同名 10/10**；世界名同根 **3/10**（因陀羅·優鉢羅·虛空）；佛号同名 **5/10**（無盡·不動·無上·星宿·清淨）——**同名根集中·异名亦有序**，不强齐、不互改（§1.6）。又六十集会式作「其世界名X；次名Y……」列名式，八十作「所謂：X世界、Y世界……」；六十「一一方各十世界」之「十」与八十「從百佛剎微塵數國土外」数量式异——**两译自歧各照**〔待核：孰为正〕。\n\n**颂文对读例**（现存五块·逐颂对照粗计）：六十法慧颂起「天人師悉現，一切嚴淨剎」vs 八十「佛放淨光明，普見世導師」——义同辞异（五言之整散·两译之常）；六十至精进慧颂止于卷末——八十 80-11 之对应颂在六十当在卷八〔跨卷未竟·不臆对〕。\n\n### 6.1′　六十《菩薩雲集妙勝殿上說偈品第十》卷七存段全本对照〔L.194 本批·全量入文〕\n\n（品界 `T09n0278` juan7「菩薩雲集妙勝殿上說偈品第十」→卷末·**跨卷未竟：卷八未入库**·善慧以下颂续卷八·本地不臆造跨卷对齐·109 段·CJK 1,421（品题 13·卷尾题 10·净 1,398）·以下逐段照录本地入库全段·不转写不断句·`_e14_full.py` 程序取自 `T09n0278`·0 手抄·每段行首「六十｜」之标记（即照录前缀·角括号内加竖线）为异译侧标识·本区在 §二 审计扫描区外）：\n\n> 六十｜菩薩雲集妙勝殿上說偈品第十\n\n> 六十｜爾時，十方各過百佛世界微塵數剎，一一方各十世界，其世界名因陀羅；次名蓮華；次名眾寶；次名優鉢羅；次名妙行；次名善行；次名歡喜；次名星宿；次名無厭慈；次名虛空。其佛號不變月；次號無盡月；次號不動月；次號香風月；次號自在天月；次號清淨月；次號無上月；次號星宿月；次號不衰變月；次號無量自在月。其菩薩名法慧；次名一切慧；次名勝慧；次名功德慧；次名精進慧；次名善慧；次名智慧；次名真實慧；次名無上慧；次名堅固慧。此諸菩薩各於其國佛所，淨修梵行。\n\n> 六十｜爾時，佛神力故，彼一一菩薩，各將一佛世界微塵數菩薩眷屬俱，來詣佛所，恭敬禮拜。又佛神力故，化作寶藏師子之座，結跏趺坐，充滿十方。如此世界須彌山頂，菩薩雲集；十方世界亦復如是。\n\n> 六十｜爾時，世尊從兩足指，放百千億妙色光明，普照十方一切世界諸四天下菩提樹下須彌山頂妙勝殿上，如來大眾，皆悉顯現。爾時，法慧菩薩承佛神力，普觀十方，以偈頌曰：\n\n> 六十｜「天人師悉現，一切嚴淨剎，\n\n> 六十｜須彌山王頂，帝釋妙勝殿，\n\n> 六十｜哀受天王請，故處其宮殿，\n\n> 六十｜一一各以十，吉祥偈讚佛。\n\n> 六十｜諸佛大眷屬，清淨菩薩眾，\n\n> 六十｜斯從十方來，跏趺正安坐。\n\n> 六十｜各同其名字，如我菩薩眾，\n\n> 六十｜捨離於本剎，往詣諸佛所。\n\n> 六十｜本國諸世尊，名號皆悉同，\n\n> 六十｜各於其佛所，淨修菩薩行。\n\n> 六十｜諸佛子當知，如來威神力，\n\n> 六十｜一切世界中，各謂佛在前。\n\n> 六十｜今我等見佛，坐釋妙勝殿，\n\n> 六十｜十方亦如是，如來自在力。\n\n> 六十｜一切世界中，發心求佛者，\n\n> 六十｜先立清淨願，修習菩薩行。\n\n> 六十｜菩薩淨修行，無量無數劫，\n\n> 六十｜於法界無礙，無能測量者。\n\n> 六十｜悉普照十方，滅除愚癡闇，\n\n> 六十｜一切無與等，是故莫能知。」\n\n> 六十｜爾時，一切慧菩薩承佛神力，普觀十方，以偈頌曰：\n\n> 六十｜「無量無數劫，雖常見如來，\n\n> 六十｜於此正法中，猶未覩真實，\n\n> 六十｜妄想取諸法，增長癡惑網，\n\n> 六十｜輪迴生死中，盲冥不見佛。\n\n> 六十｜雖復觀諸法，猶未見實相，\n\n> 六十｜一切法生滅，但著假名字，\n\n> 六十｜一切法無生，一切法無滅，\n\n> 六十｜若能如是解，諸佛常現前。\n\n> 六十｜無取亦無見，空寂無真實，\n\n> 六十｜諸佛本來空，不可得思量。\n\n> 六十｜若解一切法，不可思量者，\n\n> 六十｜彼於諸煩惱，其心無所染。\n\n> 六十｜虛妄取法相，是則為癡冥，\n\n> 六十｜是故不見佛，亦不得真實。\n\n> 六十｜牟尼離三世，相好悉具足，\n\n> 六十｜於住無所住，法界悉清淨。\n\n> 六十｜因緣故法生，因緣故法滅，\n\n> 六十｜如是觀如來，究竟離癡惑。\n\n> 六十｜法慧先已說，清淨微妙法，\n\n> 六十｜我從彼勝聞，菩提難思議。」\n\n> 六十｜爾時，勝慧菩薩承佛神力，普觀十方，以偈頌曰：\n\n> 六十｜「如來智甚深，一切莫能測，\n\n> 六十｜不知真實法，世間悉迷惑。\n\n> 六十｜童蒙思惟是，虛妄取諸法，\n\n> 六十｜是故不見佛，具足清淨相。\n\n> 六十｜愚癡心迷惑，妄取五陰相，\n\n> 六十｜不了真實性，是故不見佛。\n\n> 六十｜分別一切法，皆悉無真實，\n\n> 六十｜如是解諸法，則見盧舍那。\n\n> 六十｜因前五陰故，後陰相續生，\n\n> 六十｜次第解五陰，見佛難思議。\n\n> 六十｜如寶在闇處，無明故不見，\n\n> 六十｜真諦無說者，雖慧莫能覩。\n\n> 六十｜如目不明淨，不見微妙色，\n\n> 六十｜如是不淨心，不見諸佛法。\n\n> 六十｜猶如明淨日，無目者不見，\n\n> 六十｜若人心諂曲，終不覩諸佛。\n\n> 六十｜故當淨慧眼，觀察諸法相，\n\n> 六十｜見法相明了，猶如鏡中像。\n\n> 六十｜一切慧先說，清淨微妙法，\n\n> 六十｜我從彼勝聞，見佛盧舍那。」\n\n> 六十｜爾時，功德慧菩薩承佛神力，普觀十方，以偈頌曰：\n\n> 六十｜「諸法虛無實，妄取堅固相，\n\n> 六十｜是故童蒙者，常轉生死輪。\n\n> 六十｜不善非勝法，妄作勝法相，\n\n> 六十｜是故生障礙，愚癡常輪轉。\n\n> 六十｜不知八正道，云何知自心？\n\n> 六十｜彼因顛倒想，增長一切惡。\n\n> 六十｜不見諸法空，常受無量苦，\n\n> 六十｜彼人不成就，清淨法眼故。\n\n> 六十｜欲知一切心，先當求法眼，\n\n> 六十｜如我所說者，能見真實佛。\n\n> 六十｜若有見佛者，其心無所著，\n\n> 六十｜彼則見真實，如佛所說法。\n\n> 六十｜若見大智慧，如來妙法身，\n\n> 六十｜能見如來故，彼有清淨眼。\n\n> 六十｜無見乃能見，一切真實法，\n\n> 六十｜於法有所見，彼則無所見。\n\n> 六十｜妙哉真實法，佛以導眾生，\n\n> 六十｜一切諸有中，無生亦無死。\n\n> 六十｜勝慧先已說，清淨微妙法，\n\n> 六十｜我從彼勝聞，深解諸佛道。」\n\n> 六十｜爾時，精進慧菩薩承佛神力，普觀十方，以偈頌曰：\n\n> 六十｜「以諸妄想行，慧眼不清淨，\n\n> 六十｜愚癡邪見增，常不見諸佛。\n\n> 六十｜若能見邪偽，及以真實法，\n\n> 六十｜諦了實不實，則見清淨佛。\n\n> 六十｜見者則是垢，彼則無所見，\n\n> 六十｜諸佛離所見，是故見清淨。\n\n> 六十｜世間語言法，虛妄無真實，\n\n> 六十｜知世從緣起，能離生死患。\n\n> 六十｜世間非世間，觀察悉平等，\n\n> 六十｜二俱知真實，是名真見者。\n\n> 六十｜若能如是觀，漏盡得自在，\n\n> 六十｜非有亦非無，是名不二見。\n\n> 六十｜虛妄非虛妄，非是諸佛法，\n\n> 六十｜真實無二相，法性清淨故。\n\n> 六十｜法性自清淨，無相如虛空，\n\n> 六十｜一切無能說，智者如是觀。\n\n> 六十｜樂觀一切法，寂滅無所有，\n\n> 六十｜亦知不可修，能見牟尼尊。\n\n> 六十｜如是見佛者，功德不可量，\n\n> 六十｜一切所有行，寂靜空無相。」\n\n> 六十｜大方廣佛華嚴經卷第七\n\n〔按·两译段次对应〕集会三列名数（60-001↔80-01）·佛神力来集坐宝（60-002↔80-01 前段义）·足指放光普照（60-003↔80-01 末段·两译同「百千億妙色光明」而照处小异：八十「須彌頂上帝釋宮中」·六十「諸四天下菩提樹下須彌山頂妙勝殿上」·各照底本不统一）·法慧至精進慧五颂块（60-004–107↔80-03·05·07·09·11）——**存段五块与八十前五段颂一一相接**；善慧起颂缺（跨卷未竟·后五段颂无由对齐·不强配）。颂行 CJK10 双句·「」×5 全闭合（`_e14_stats.py` 实测）。\n\n---\n\n### 6.2 四十华严（`T10n0293`）\n\n四十华严唯「入法界品」，**无相当品**——本品不取对读。〔登记〕\n\n### 6.3 藏译对读（Toh 44）\n\n本机未入库藏译逐字·**〔未竟·待核〕**；不据二手目录冒充原文·只存「八十品十四」当于藏本何段之待检问题。〔登记〕\n\n### 6.4 校勘记\n\n一、**品题净字 ll=\"#5b4636\">智慧</text>\n  <text x=\"412\" y=\"72\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5b4636\">悅意華</text>\n  <text x=\"412\" y=\"88\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5b4636\">無上月</text>\n  <text x=\"412\" y=\"190\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#7a6a5a\">西南</text>\n  <rect x=\"446\" y=\"96\" width=\"52\" height=\"76\" fill=\"#7a8f6a\" opacity=\"0.85\"/>\n  <text x=\"472\" y=\"130\" font-size=\"10\" text-anchor=\"middle\" fill=\"#fff\">10颂</text>\n  <text x=\"472\" y=\"150\" font-size=\"9\" text-anchor=\"middle\" fill=\"#fff\">40句</text>\n  <text x=\"472\" y=\"56\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5b4636\">真實慧</text>\n  <text x=\"472\" y=\"72\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5b4636\">阿盧那華</text>\n  <text x=\"472\" y=\"88\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5b4636\">星宿月</text>\n  <text x=\"472\" y=\"190\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#7a6a5a\">西北</text>\n  <rect x=\"506\" y=\"96\" width=\"52\" height=\"76\" fill=\"#7a8f6a\" opacity=\"0.85\"/>\n  <text x=\"532\" y=\"130\" font-size=\"10\" text-anchor=\"middle\" fill=\"#fff\">10颂</text>\n  <text x=\"532\" y=\"150\" font-size=\"9\" text-anchor=\"middle\" fill=\"#fff\">40句</text>\n  <text x=\"532\" y=\"56\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5b4636\">無上慧</text>\n  <text x=\"532\" y=\"72\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5b4636\">那羅陀華</text>\n  <text x=\"532\" y=\"88\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5b4636\">清淨月</text>\n  <text x=\"532\" y=\"190\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#7a6a5a\">下</text>\n  <rect x=\"566\" y=\"96\" width=\"52\" height=\"76\" fill=\"#7a8f6a\" opacity=\"0.85\"/>\n  <text x=\"592\" y=\"130\" font-size=\"10\" text-anchor=\"middle\" fill=\"#fff\">10颂</text>\n  <text x=\"592\" y=\"150\" font-size=\"9\" text-anchor=\"middle\" fill=\"#fff\">40句</text>\n  <text x=\"592\" y=\"56\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5b4636\">堅固慧</text>\n  <text x=\"592\" y=\"72\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5b4636\">虛空華</text>\n  <text x=\"592\" y=\"88\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#5b4636\">明了月</text>\n  <text x=\"592\" y=\"190\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#7a6a5a\">上</text>\n  <text x=\"324\" y=\"208\" text-anchor=\"middle\" font-size=\"9\" fill=\"#7a6a5a\">上三行＝菩萨名／所来华世界／本佛月号（次序对应·§4.2）·下行＝澄观科方位（八方上下具·§7.3）</text>\n</svg>\n\n\n---\n\n## 八、附录（十一类）\n\n### 附录一：人名表\n\n**十菩萨**：法慧·一切慧·胜慧·功德慧·精进慧·善慧·智慧·真实慧·无上慧·坚固慧（皆「慧」名·两译全同·§4.2 表）。**十佛号（月名）**：殊特·無盡·不動·風·水·解脫·無上·星宿·清淨·明了（八十）。**六十别列**：不變月等十（§6.1 表）。\n\n### 附录二：名相表\n\n即 §4.5 增缩·梵语（因陀羅·波頭摩·優鉢羅·阿盧那·那羅陀）训义分见·〔待核〕者不强训。\n\n### 附录三：经文要句\n\n「佛放淨光明，普見世導師」·「悉以十妙頌，稱讚諸如來」·「性空即是佛，不可得思量」·「佛法無人說，雖慧莫能了」·「無見即是見，能見一切法」·「寧受地獄苦，得聞諸佛名」·「一切法無住，定處不可得，諸佛住於此，究竟不動搖」·「三界一切空，是則諸佛見」·「無數億劫中，說亦不能盡」。\n\n### 附录四：注疏引文汇\n\n§五全部引文之索引汇总（澄观·法藏·智俨·慧苑·李通玄论·合论——各标 `T1735`／`T1733`／`T1732`／`X0221`／`T1739`／`X0223` 与段落窗口）。\n\n### 附录四′：澄观疏本科段全文照录〔L.194 本批〕\n\n**附录四′·澄观《华严经疏》本科段全文照录**〔L.194 本批·达标基线补全〕（`T1735` 卷第十六「須彌頂上偈讚品第十四」段·raw @214595–221313·CJK-only 坐标回映切片·分页符行剔除·余照原档分行不转写不断句·康熙部首原字形保留（如「⽂」「⼗」「⾨」）·三分十段科界见 §5.1 甲–庚·本附录在 §二 审计区外不污引文审计·共 215 档行·窗 CJK 5,479）：\n\n> 須彌頂上偈讚品第⼗四\n\n> 初來意者。既明化主赴感。今辨助化讚揚。將演住⾨先陳體性。性即\n\n> 佛智先讚如來。故品來也。⼆釋名者。須彌約處讚稱佛德。依處有讚\n\n> 故立此名。亦頂上之讚揀餘處也。三宗趣者。以集眾放光偈讚為宗。\n\n> 為成正說為趣。⼜顯佛德為宗。令知住體為趣。第四釋文總為三分。\n\n> 第⼀集眾分。第⼆放光分。第三偈讚分。今初文有⼗同。義兼三異。\n\n> 謂五六七。⼀集因同皆佛⼒故。亦同會前時。⼆⼗⽅下主⾸同。三⼀\n\n> ⼀各下眷屬數同。四從百佛下。來處量同。前⼗此百位已增故。五其\n\n> 名下。表法名同。慧即⼗解能⾒法故。菩薩名異⾄偈釋之。六所從來\n\n> 下。世界名同同名華者。位相創開無著感果故。別即次第配於⼗住。\n\n> ⼀發⼼主導世間故。⼆淨治⼼地如蓮開故。三修⾏圓淨故。四⽔⽣之\n\n> 貴故。五⽅便堅誓故。六正⼼無相如香氣故。七不退意悅故。八阿盧\n\n> 那者。此云⽇出時。紅⾚之相童真明淨故。九那羅陀者。此云⼈持。\n\n> 以華香妙⼈皆佩故。王⼦佩持法王軌度故。⼗智遍如空故。亦可別明\n\n> ⼗住勝進⼗法。思之可知。七各於下。所事佛同。同名⽉者。表位\n\n> 中。佛果智明闇息恩益清涼。應器周故。別名即⼗住。⾃分⼗法之\n\n> 果。⼀以⼗難得法。可謂殊特。⼆發⼗⼤⼼不可窮盡。三觀於空等不\n\n> 可傾動。四了知業⾏⽣死涅槃。如風不住。五饒益安樂⼀切眾⽣。如\n\n> ⽔普潤。六聞⼗種法。⼼定不動故得解脫。七聞⼗不退可謂無上。八\n\n> 三業無失。如星明淨。隨意受⽣燦然滿空。神⾜⾃在若依空運轉。九\n\n> 善知煩惱現起習氣。故得清淨。⼗觀察無數眾⽣根欲智慧⼼境。餘不\n\n> 能知唯⾃明了。以此⼗因成茲⼗佛。上且隨要相屬以為此釋。委明其\n\n> 相如⼗住文。八是諸已下申禮敬同。九隨所來下威儀住同。⼗如此下\n\n> 結⼗⽅同。⼜上⼗⽅從東次第。如名號品問。準此結通。即於⼗⽅盡\n\n> 空世界。皆有菩薩⽽來集會者。且如東⽅過百剎塵⼟。外亦有眾集。\n\n> 未知彼因陀羅華世界為在何處。餘界亦爾。答如名號品。第⼆爾時\n\n> 下。如來放光分。文義有六。⼀時。⼆主。三處。四數。五相。六業\n\n> 處。謂兩⾜指⾜指拒地得住有⼒。成位不退⽽⾏有恒。數位過前加於\n\n> 千也。相表解顯故云妙⾊。普照⼗⽅顯佛眾會。⼀光照於⼀切則⼀切\n\n> 亦爾。重疊無礙無不互⾒。為⼀法界圓明⼤會。第三爾時法慧下。偈\n\n> 讚分中⼗菩薩說。即為⼗段。初⼀是總餘九為別。以法慧是說法主\n\n> 故。總敘此會本末事義。總顯佛德。餘九歎佛差別之德。總別共顯如\n\n> 來無礙之會。此⼗菩薩名亦表⼗住。其所說法表位勝進。勝進有⼆。\n\n> ⼀趣後位。⼆趣佛果。今約佛果。今初東⽅法慧總了佛法故。勝進中\n\n> 云。欲令菩薩於佛法中。⼼轉增廣。文中觀佛現⽤。及與往修皆周遍\n\n> 故。⼗頌分三。初五敘因佛光⾒多盛事。初⼀敘此品放光。次⼀敘前\n\n> 品請讚。餘三重敘此品。次⼆勸觀佛⼒。更發勝⼼。即前品不起⽽\n\n> 升。後三舉因結果。初⼀舉因後⼆結果。由因中⾏願剎剎⿑修故。果\n\n> 位⾝智遍應遍斷。第⼆南⽅⼀切慧者。了⼀切法真實之性。淨⼼地\n\n> 故。頌意為顯於諸眾⽣。增⻑⼤悲以稱實⽽觀救世者故。⼗頌分六。\n\n> 初⼆違理觀佛非⾒佛。次四了法真性真⾒佛。三有⼀偈迷性取法不⾒\n\n> 佛。四⼀偈。佛即同法為真佛。五⼀偈引已了法為⾒佛。六⼀偈。推\n\n> 功有本了真佛。初中前偈出其妄觀。假設⻑時以況暫⾒。後偈明其有\n\n> 損。由上不依真實則取相乖真。但⾒集網繫於苦獄。盲無慧眼。冥然\n\n> 不⾒佛之法⾝。然此遮取相故。假設⻑時無有多劫。全不了義。以⾒\n\n> 如來增智慧故。第⼆四偈。了法真性真⾒佛。於中⼆。前⼆真觀後⼆\n\n> 真⽌。前中初⼆句。空觀緣⽣無性故。次⼆句假觀隨俗假名故。次⼆\n\n> 句中。觀由前⽣滅⼀切諸法即無性故。相體即是不⽣滅也。後⼆句觀\n\n> 益。諸法如即是佛如。無⽣滅佛體本常。觀稱於如則佛常現。況三觀\n\n> ⼀⼼則佛之體⽤。無不現矣。後⼆真⽌中。以觀觀法能所紛動。故須\n\n> 寂之。初句牒前法性。次句泯其能所。法性本空非觀之使空。故無所\n\n> 取何有能⾒。次⼆句。⼼冥性佛故⽌絕思求。⼜上來空以遣有假以遣\n\n> 空。如則雙遣空假。形奪兩亡。若謂雙非還成戲論故。辨起⼼皆妄絕\n\n> 念⽅真。念本⾃無斯絕亦滅。故中論云。如來寂滅相分別有亦非。如\n\n> 是性空中思惟亦不可。⽤斯文也。後⼀顯觀益。⼼冥體性惑何由⽣。\n\n> 亦含三⽌意也。⼜亦通結⽌觀。稱上⽽觀⾒惑性空。即同佛性。何能\n\n> 染哉。第三⼀偈迷性中。上半取法次句迷性。末句結過。第四⼀偈。\n\n> 佛即同法如。謂同空法故離三世。同假法故相具⾜。同雙遣故無住無\n\n> 著。同如體故遍不動搖。第五⼀偈。引⼰中。此親⾃證希眾無惑。第\n\n> 六⼀偈推功有本者。非師⼼也。亦謙⼰推⼈異乎凡情。令法鉤鎖殊塗\n\n> 同致。下八準之。第三⻄⽅勝慧。以解佛勝智隨空⼼淨。故以為名。\n\n> 頌意。為顯欲令菩薩智慧明了。即⼤智了如及佛性故。⼗頌分四。初\n\n> ⼀讚智為迷悟本。次四正顯迷悟。次四喻前得失。後⼀推功有在。今\n\n> 初。由難思故迷難則容有。思者故有悟。次四迷悟中。初⼆迷後⼆\n\n> 悟。迷中初⼀⼼外取境⽣想違理。故不能⾒無相之佛。後偈取蘊內相\n\n> 不了蘊性。故不⾒⼼佛。亦是愚法⼩乘。故名無知者。後⼆迷中前明\n\n> 倒想。內外俱妄。今有了因內外皆悟。初偈翻前外取。謂了⼀切法即\n\n> ⼼⾃性。性亦非性。情破理現則⾒舍那。稱於法性無內外也。後偈翻\n\n> 前內取。了蘊性相則⾒⾃⼼之佛。與盧舍那。非⼀非異故難思議。然\n\n> 此⼀偈文\n\n> 含\n\n> 多意。⼀但是蘊縛無有我⼈。則破前凡夫取我相也。⼆前\n\n> 後因依相續無性。則破凡⼩取法相也。此性即第⼀義空。第⼀義空即\n\n> 是佛性。⼜上性無所有正因性也。前解此了。皆了因性。此蘊相續。\n\n> 即是正因。亦名⽣因。⾔正因者。是中道義。中道即是佛性。謂現在\n\n> 陰滅中陰陰⽣。是現在陰終不變。為中陰五陰。故現陰非常如種⽣\n\n> 牙。種不⾄牙。雖不⾄牙⽽能⽣牙。此現在陰雖不⾄後。⽽能⽣後。\n\n> 則現陰非斷。⽽中陰五陰亦非⾃⽣。不從餘來。因現五陰⽣中陰陰。\n\n> 斯則後陰非無因。故後陰非常。既能續前故後陰非斷。非斷非常是中\n\n> 道義。正因性也。能⽣佛果故⽈⽣因。眾⽣佛性有⼆種因。⼀者正\n\n> 因。⼆者緣因。正因者謂諸眾⽣。是故五陰即正因也。緣因者。謂六\n\n> 波羅蜜。非蘊相⽣名緣因也。今以了因了彼正因。故⽈於此性了知。\n\n> 了即般若亦緣因也。第三四偈。喻前得失者。前三喻失後⼀喻得。前\n\n> 中⼆。初⼆喻內取失。於中初⼀顯無緣了不⾒正因。闇中寶者正因性\n\n> 也。圓滿可貴。所以稱寶。居於無明五陰室內。如在闇中。燈喻緣了\n\n> 之因。下半法合。無⼈說者。闕於緣因雖慧莫了。義含⼆意。⼀慧即\n\n> 正因。合上寶也。闕於緣因故不能了。⼆佛法即寶。以闕緣因。雖內\n\n> 有慧不成了因。不⾒真性。然則緣因即是了因。了因未必是於緣因。\n\n> 有親疎故。善友是於緣因⽽必是了。佛性名為了因。未必是緣。此約\n\n> 智慧性故。若以第⼀義空為佛性者。唯是正因。⽽非了因。但為了因\n\n> 所了。⽽非⽣因所⽣。若以智慧為佛性者。即是了因。若以五蘊為佛\n\n> 性者。名為正因。亦名⽣因。然復⽣必對了正必對緣。今燈⼀喻雙喻\n\n> 緣了。闇中之寶雙喻正了。義意包含。具如涅槃⼆⼗六七所辨。⼜上\n\n> 燈喻既是正義。何以涅槃師⼦吼立。佛不許耶。故師⼦吼⾔。⼀切眾\n\n> ⽣有佛性。性如乳中酪以有性故。要須緣因。何以故。欲明⾒故。緣\n\n> 因者即是了因。譬如闇中先有諸物。為欲⾒故以燈照了。若本無者燈\n\n> 何所照。故佛難⾔。若使乳中定有酪性。即是了因。若是了因復何須\n\n> 了。⼜善男⼦。⼀切眾⽣有佛性者。何須修習無量功德。若⾔修習是\n\n> 了因者。已同酪壞。結正義云。乳有酪者以定得故。佛性亦爾。眾⽣\n\n> 有者以當⾒故。然上諸義總有⼆意。⼀燈了於寶為正義者。約因性故\n\n> 師⼦吼立。佛不許者約果性故。⼆者燈喻正者。約其體性與有不異。\n\n> 佛不許者。約其現惑與無不殊。故知若⾔定有名為執著。若⾔定無是\n\n> 則妄語。應⾔眾⽣佛性亦有亦無。然眾⽣智慧是佛性因。菩提涅槃是\n\n> 佛性果。然則佛性非因非果。今此經宗。宗於法性故。以法性⽽為佛\n\n> 性。則非內非外隨物迷悟強說升沈。佛性要義不可不知。廣如別章。\n\n> 及涅槃師⼦吼品等說。後偈⽬有翳者。此喻了因。與惑俱故⾒不清\n\n> 淨。以不淨故不⾒佛法。佛法即⾒佛性。故涅槃云。佛性⼆種。⼀者\n\n> 是⾊⼆者非⾊。⾊者諸佛菩薩。非⾊者⼀切眾⽣。⾊者名為眼⾒。非\n\n> ⾊者名為聞⾒。佛性者非內非外。雖非內外然非失壞。故名眾⽣悉有\n\n> 佛性。⼆⼀偈。喻上外取之失。瞽謂全無於⽬如⿎⽪故。則全不⾒\n\n> 佛。無垢障為明淨⽬。取相是識非智慧眼。故不⾒也。三⼀偈。喻前\n\n> 悟中抉去取相之翳。捨於空華之像。絕⾒契如則⾒如佛。第四⼀偈。\n\n> 推功有在準上可知。第四北⽅功德慧者。⽣在佛家善解佛德故。此頌\n\n> 意顯於三世中⼼得平等。了知⾃⼼窮法空故。⼗頌分四。初四明凡⼩\n\n> 妄覺。次四⽰其真覺。三有⼀偈佛覺雙圓。後⼀偈。推功有本。今初\n\n> 分⼆。初⼀偈。說凡迷緣起之無性。執著相⽽輪迴。後三頌通凡⼩。\n\n> 初⼀辨迷執隨⾔作解。可謂⼩智⼼外取法為妄分別。餘⼆偈明過失。\n\n> 初⼆句。曲徑趣寂迷⼀直道。次半有常等倒。⻑世間惡。有無常等⻑\n\n> 無明惡。次半不⾒⼆空。受⼆死苦。後半無實諦觀。何有法眼。三乘\n\n> 縱有亦不名諦。次四⽰其真覺中。初偈引⼰之損勸物成益。次偈教其\n\n> 真⾒。謂⾒佛無取即是⾒如。如即佛所知也。次偈教其了俗。上半躡\n\n> 前證真。下半⽅能了俗。後偈拂前⼆⾒。以成真⾒。謂上半取真俗之\n\n> ⾒忘。⽅⾒真俗之正理。下半反釋。謂有真俗之可⾒。不能⾒真俗之\n\n> 真源。故智論云。若⼈⾒般若是則為被縛。下半意也若不⾒般若是則\n\n> 得解脫。上半意也。若⼈⾒般若是則為解脫。即第六七偈意也。若不\n\n> ⾒般若是則為被縛。即第四偈意也。唯忘⾔者可究斯旨。第三⼀偈。\n\n> 顯佛⼆覺雙圓。不可覺中⽽⾃覺。故是⽈奇哉。知無眾⽣⽽能覺他。\n\n> ⼤導師也。第四可知。第五東北⽅精進慧。以勤觀真理集無量善。俱\n\n> 無住故。頌意。為顯欲令其⼼轉復精進。無所染著。文中由離分別如\n\n> 實⾒故。⼗頌分⼆。前九觀法後⼀推功。前中三。初三所執無相觀於\n\n> 中。初⼀舉分別過。後⼆顯無相觀。⼀離所取。上半知於情有。下半\n\n> 知於理無。如迷⽊⾒⿁。知⿁是迷有。名如實知⿁。知⿁本無舉體是\n\n> ⽊。名為⾒⽊。⼆離能取以所取空故。上半舉失。如若⾒⿁即不⾒\n\n> ⽊。下半顯得離於⿁⾒。⽅為⾒⽊。次三明緣起無⽣觀。⼀遣所緣。\n\n> 然依他⼆義。⼀者幻有從分別⽣即是上半。⼆者無性即是下半。⼆泯\n\n> 能緣。上半牒前⽣過。有無⽣⾒同世非實。下半⾒等無⽣名真⾒者。\n\n> 三辨觀益。後三明圓成無性觀。⼀牒前⼆無。謂能所分別皆不可得\n\n> 者。即圓成性淨故。⼆正顯真性。初句體有次句相無。此⼆融即故無\n\n> 能說。三觀成利益。及第⼆推功。文並可知。第六東南⽅善慧菩薩。\n\n> 成就般若慧鑑不動。可謂善矣。此頌。為顯欲令其⼼轉復增進。得不\n\n> 退轉無⽣法忍。文中離垢解脫無體性故。⼗頌分四。初⼆⾒佛。次三\n\n> ⾒法。次三觀成利益。後⼆推⾒有依。今初前偈讚所⾒。上半標讚。\n\n> 下半釋成。智離所知⼼脫煩惱。兼⼆利故。⼆障難除眾⽣難度。⾃強\n\n> 不息為希有勇健。後偈中。能⾒謂我如實⾒。如⼤菩薩⾒。次三⾒法\n\n> 中。約眾⽣說。初偈正顯。盡即有為。諸⾏無常速起滅故。有為之性\n\n> 湛若虛空。便是無為體常遍故。次⼆偈拂迹入⽞。上半拂前無為。謂\n\n> 既如虛空。何有無為之相。次四句拂前有為。謂既約⾃性論無盡。則\n\n> 不壞於盡。故⽈難思。盡即無盡故無眾⽣也。後⼆句。觀成利益⾒法\n\n> ⾝也。次三觀成中。初偈顯法空。由下半了能所⾒緣成無性故。上半\n\n> 能所之⾒⾃亡。次⼆句顯我空。能所之法尚空。誰為能⾒之者。後⼆\n\n> 句顯實。但除上病不除真法。⼆空之體及所顯圓成。即真佛也。三⼀\n\n> 偈雙結知佛法益。文顯可知。四有⼆偈。推⾒有依者。謂佛說⼀道清\n\n> 淨。故能遣有。進慧演無量⾨。復能遣無。想滅理現⽅知如來。乃住\n\n> 無有無之際也。⼜智論云。法性為實證實為際。凡夫有實未能證也。\n\n> 第七⻄南⽅智慧者。決斷不動所以名智。頌意。為顯於⼀切法皆能出\n\n> 離。文中⽣死涅槃皆善離故。⼗頌分⼆。初⼀引⼰勵眾。餘偈希眾同\n\n> ⼰。於中亦⼆。前六⽰迷後三啟悟。前中亦⼆。初⼀⼈執。理實無⼈\n\n> 橫計成險。餘皆法執。於中初⼆執世法。後三雙執世出世。今初。初\n\n> ⼆句明執。謂計蘊為實。不能觀⾝實相。餘皆明過。初⼆句執實乖理\n\n> 不⾒佛。次⼆句無慧不⾒佛。後⼆句但益流轉後三雙執中亦分為⼆。\n\n> 初⼆執法後⼀執佛。前中亦⼆。⼀立理⼆起執。初中上半假立。謂待\n\n> 前流轉⽣死。以立涅槃。煩惱名諍。觸動善品損害⾃他故名為諍。此\n\n> 有漏法諍隨增。故名為有諍。有彼諍故。故⽣死者有漏為體。無彼煩\n\n> 惱故稱涅槃。下半雙非。謂⽣死涅槃。俱因煩惱假立其名。何有真\n\n> 實。⼜⼆互相待故俱空。⼆互相奪故皆寂。後偈起執。上半執下半\n\n> 損。後⼀執佛中。亦上半執下半損。執有三義。⼀佛佛相望。⼆三⾝\n\n> 等相望。三⼼佛相望。後三啟悟中亦⼆。初⼆順理之得。後⼀舉佛釋\n\n> 成。前中亦⼆。半偈明順理⽽知。餘顯順知之益。益中亦⼆。半偈標\n\n> ⼀偈釋。云何超⾔。若取知能知寂未免於⾔。有所緣故。知⾃知知亦\n\n> 非無緣故。須能所平等等不失照故。無知之知不同⽊⽯。故云能⾒。\n\n> 後偈舉佛釋者。上云佛然。佛云何然。釋云。覺於三世離分別故。種\n\n> 習斯亡為斷根也。⼜亦無⼼捨於分別。名為斷根。第八⻄北⽅真實慧\n\n> 菩薩。⼼不顛倒是真實慧。頌意。為顯欲令增進於⼀切法。皆得善巧\n\n> 文⾔。於法不顛倒如實覺了。是善巧義⼗頌分⼆。前⼆明依實立名。\n\n> 名能益物。後八顯名下之實。辨益所由。今初前頌明損益。受苦聞名\n\n> 速解脫故。受樂不聞反沈淪故。後頌敘昔以成今說。後八中分三。初\n\n> 三覺妄證實。是覺察義。次⼀雙覺⼆諦。是覺照義。後四非覺⽽覺是\n\n> 妙覺義。今初也。初偈證實立名。初句揀似比量。無常計常常計無常\n\n> 等。是顛倒法。名似比量。次句證真現量。如眼⾒故。次句揀似現\n\n> 量。顯真現量。謂男女天地等⾒⼀合相。名似現量。⼀合相相不可得\n\n> 故。故名為離。非唯所覺離合。亦無如外之智與如合也。下句結名。\n\n> 次偈例去來。後偈成現觀。次⼀覺照者。真諦名實無和合故。俗諦非\n\n> 實假和合故。互融無雜名究竟解。夫實⾒者。尚不⾒實何況非實。⾒\n\n> 非實者知其即實。故中論云。⼀切法真實⼀切法非實。亦實亦非實非\n\n> 實非非實。是名諸佛法。後四非覺⽽覺者。初偈正顯如智。相離名不\n\n> 可覺。寂無遺照故名了此。要不可得⽅是真修。次⼆偈展轉釋成。初\n\n> 偈釋無⼀之義。上半相待⽽有。通同異體。下半緣⽣故空。則⼀多相\n\n> 盡矣。後偈上半。釋前偈下半。無能所作故無所依。從業想⽣故是和\n\n> 合。下半釋成上半。云何知無能所。異業想外無我所故。後有⼀偈結\n\n> 成妙義。上半所住下半能住。由無住故無所不住。謂不住有以即空\n\n> 故。故能住有契有實故。亦不住無無即有故。不住俱有無。無⼆體\n\n> 故。 // 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';

}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}

</script>
