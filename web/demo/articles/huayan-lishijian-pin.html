慧，具足一切最勝功德，入一切智智位。是為\n>\n> 第八所作業。菩薩摩訶薩住兜率宮，為欲供養諸如來故，以大神力興起種種諸供養具，名：殊勝可樂，遍法界、虛空界、一切世界供養諸佛；彼世界中無量眾生見此供養，皆發阿耨多羅三藐三菩提心。是為\n>\n> 第九所作業。菩薩摩訶薩住兜率天，出無量無邊如幻如影法門，周遍十方一切世界，示現種種色、種種相、種種形體、種種威儀、種種事業、種種方便、種種譬諭、種種言說，隨眾生心皆令歡喜。是為\n>\n> 第十所作業。佛子！是為菩薩摩訶薩住兜率天十種所作業。若諸菩薩成就此法，則能於後下生人間。「佛子！\n\n**（条 184／201）於兜率天將下生時，現十種事**：\n\n> 菩薩摩訶薩於兜率天將下生時，現十種事。何等為十？佛子！菩薩摩訶薩於兜率天下生之時，從於足下放大光明，名：安樂莊嚴，普照三千大千世界一切惡趣諸難眾生；觸斯光者，莫不皆得離苦安樂；得安樂已，悉知將有奇特大人出興于世。是為\n>\n> 第一所示現事。佛子！菩薩摩訶薩於兜率天下生之時，從於眉間白毫相中放大光明，名曰：覺悟，普照三千大千世界，照彼宿世一切同行諸菩薩身；彼諸菩薩蒙光照已，咸知菩薩將欲下生，各各出興無量供具，詣菩薩所而為供養。是為\n>\n> 第二所示現事。佛子！菩薩摩訶薩於兜率天將下生時，於右掌中放大光明，名：清淨境界，悉能嚴淨一切三千大千世界，其中若有已得無漏諸辟支佛覺斯光者，即捨壽命；若不覺者，光明力故，徙置他方餘世界中；一切諸魔及諸外道、有見眾生，皆亦徙置他方世界，唯除諸佛神力所持應化眾生。\n>\n> 是為\n>\n> 第三所示現事。佛子！菩薩摩訶薩於兜率天將下生時，從其兩膝放大光明，名：清淨莊嚴，普照一切諸天宮殿，下從護世，上至淨居，靡不周遍；彼諸天等，咸知菩薩於兜率天將欲下生，俱懷戀慕，悲歎憂惱，各持種種華鬘、衣服、塗香、末香、幡蓋、妓樂，詣菩薩所恭敬供養，隨逐下生乃至涅槃。\n>\n> 是為\n>\n> 第四所示現事。佛子！菩薩摩訶薩在兜率天將下生時，於卍字金剛莊嚴心藏中放大光明，名：無能勝幢，普照十方一切世界金剛力士；時，有百億金剛力士皆悉來集，隨逐侍衛，始於下生，乃至涅槃。是為\n>\n> 第五所示現事。佛子！菩薩摩訶薩於兜率天將下生時，從其身上一切毛孔放大光明，名：分別眾生，普照一切大千世界，遍觸一切諸菩薩身，復觸一切諸天世人；諸菩薩等咸作是念：『我應住此，供養如來，教化眾生。』是為\n>\n> 第六所示現事。佛子！菩薩摩訶薩於兜率天將下生時，從大摩尼寶藏殿中放大光明，名：善住觀察，照此菩薩當生之處所託王宮；其光照已，諸餘菩薩皆共隨逐下閻浮提，若於其家、若其聚落、若其城邑而現受生，為欲教化諸眾生故。是為\n>\n> 第七所示現事。佛子！菩薩摩訶薩於兜率天臨下生時，從天宮殿及大樓閣諸莊嚴中放大光明，名：一切宮殿清淨莊嚴，照所生母腹；光明照已，令菩薩母安隱快樂，具足成就一切功德，其母腹中自然而有廣大樓閣大摩尼寶而為莊嚴，為欲安處菩薩身故。\n>\n> 是為\n>\n> 第八所示現事。佛子！菩薩摩訶薩於兜率天臨下生時，從兩足下放大光明，名為：善住；若諸天子及諸梵天其命將終，蒙光照觸皆得住壽，供養菩薩從初下生乃至涅槃。是為\n>\n> 第九所示現事。佛子！菩薩摩訶薩於兜率天臨下生時，從隨好中放大光明，名曰：眼莊嚴，示現菩薩種種諸業；時，諸人、天或見菩薩住兜率天，或見入胎，或見初生，或見出家，或見成道，或見降魔，或見轉法輪，或見入涅槃。是為\n>\n> 第十所示現事。佛子！菩薩摩訶薩於身、於座、於宮殿、於樓閣中，放如是等百萬阿僧祇光明，悉現種種諸菩薩業；現是業已，具足一切功德法故，從兜率天下生人間。「佛子！\n\n**（条 185／201）示現處胎，有十種事**：\n\n> 菩薩摩訶薩示現處胎，有十種事。何等為十？佛子！菩薩摩訶薩為欲成就小心劣解諸眾生故，不欲令彼起如是念：『今此菩薩自然化生，智慧善根不從修得。』是故菩薩示現處胎。是為\n>\n> 第一事。菩薩摩訶薩為成熟父母及諸眷屬、宿世同行眾生善根，示現處胎。何以故？彼皆應以見於處胎成熟所有諸善根故。是為\n>\n> 第二事。菩薩摩訶薩入母胎時，正念正知，無有迷惑；住母胎已，心恒正念，亦無錯亂。是為\n>\n> 第三事。菩薩摩訶薩在母胎中常演說法，十方世界諸大菩薩、釋、梵、四王皆來集會，悉令獲得無量神力、無邊智慧，菩薩處胎成就如是辯才、勝用。是為\n>\n> 第四事。菩薩摩訶薩在母胎中集大眾會，以本願力教化一切諸菩薩眾。是為\n>\n> 第五事。菩薩摩訶薩於人中成佛，應具人間最勝受生，以此示現處於母胎。是為\n>\n> 第六事。菩薩摩訶薩在母胎中，三千大千世界眾生悉見菩薩，如明鏡中見其面像；爾時，大心天、龍、夜叉、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽、人、非人等，皆詣菩薩，恭敬供養。是為\n>\n> 第七事。菩薩摩訶薩在母胎中，他方世界一切最後生菩薩在母胎者，皆來共會，說大集法門，名：廣大智慧藏。是為\n>\n> 第八事。菩薩摩訶薩在母胎時，入離垢藏三昧，以三昧力，於母胎中現大宮殿，種種嚴飾悉皆妙好，兜率天宮不可為比，而令母身安隱無患。是為\n>\n> 第九事。菩薩摩訶薩住母胎時，以大威力興供養具，名：開大福德離垢藏，普遍十方一切世界，供養一切諸佛如來，彼諸如來咸為演說無邊菩薩住處法界藏。是為\n>\n> 第十事。佛子！是為菩薩摩訶薩示現處胎十種事。若諸菩薩了達此法，則能示現甚微細趣。「佛子！\n\n**（条 186／201）有十種甚微細趣**：\n\n> 菩薩摩訶薩有十種甚微細趣。何等為十？所謂：在母胎中，示現初發菩提心，乃至灌頂地；在母胎中，示現住兜率天；在母胎中，示現初生；在母胎中，示現童子地；在母胎中，示現處王宮；在母胎中，示現出家；在母胎中，示現苦行，往詣道場，成等正覺；在母胎中，示現轉法輪；在母胎中，示現般涅槃；在母胎中，示現大微細，謂：一切菩薩行一切如來自在神力無量差別門。佛子！是為菩薩摩訶薩在母胎中十種微細趣。若諸菩薩安住此法，則得如來無上大智慧微細趣。「佛子！\n\n**（条 187／201）有十種生**：\n\n> 菩薩摩訶薩有十種生。何等為十？所謂：遠離愚癡正念正知生；放大光明網普照三千大千世界生；住最後有更不受後身生；不生不起生；知三界如幻生；於十方世界普現身生；證一切智智身生；放一切佛光明普覺悟一切眾生身生；入大智觀察三昧身生；佛子！菩薩生時，震動一切佛剎，解脫一切眾生，除滅一切惡道，映蔽一切諸魔，無量菩薩皆來集會。佛子！是為菩薩摩訶薩十種生，為調伏眾生故，如是示現。「佛子！\n\n**（条 188／201）以十事故，示現微笑心自誓**：\n\n> 菩薩摩訶薩以十事故，示現微笑心自誓。何等為十？所謂：菩薩摩訶薩念言：『一切世間沒在欲泥，除我一人無能免濟。』如是知已，熙怡微笑心自誓。復念言：『一切世間煩惱所盲，唯我今者具足智慧。』如是知已，熙怡微笑心自誓。又念言：『我今因此假名身故，當得如來充滿三世無上法身。\n>\n> 』如是知已，熙怡微笑心自誓。菩薩爾時，以無障礙眼，遍觀十方所有梵天，乃至一切大自在天，作是念言：『此等眾生，皆自謂為有大智力。』如是知已，熙怡微笑心自誓。菩薩爾時觀諸眾生，久種善根，今皆退沒；如是知已，熙怡微笑心自誓。菩薩觀見世間種子，所種雖少，獲果甚多；\n>\n> 如是知已，熙怡微笑心自誓。菩薩觀見一切眾生，蒙佛所教，必得利益；如是知已，熙怡微笑心自誓。菩薩觀見過去世中同行菩薩，染著餘事，不得佛法廣大功德；如是知已，熙怡微笑心自誓。菩薩觀見過去世中同共集會諸天人等，至今猶在凡夫之地，不能捨離，亦不疲厭；\n>\n> 如是知已，熙怡微笑心自誓。菩薩爾時，為一切如來光明所觸，倍加欣慰，熙怡微笑心自誓。是為十。佛子！菩薩為調伏眾生故，如是示現。「佛子！\n\n**（条 189／201）以十事故，示行七步**：\n\n> 菩薩摩訶薩以十事故，示行七步。何等為十？所謂：現菩薩力故，示行七步；現施七財故，示行七步；滿地神願故，示行七步；現超三界相故，示行七步；現菩薩最勝行超過象王、牛王、師子王行故，示行七步；現金剛地相故，示行七步；現欲與眾生勇猛力故，示行七步；現修行七覺寶故，示行七步；現所得法不由他教故，示行七步；現於世間最勝無比故，示行七步。是為十。佛子！菩薩為調伏眾生故，如是示現。「佛子！\n\n**（条 190／201）以十事故，現處童子地**：\n\n> 菩薩摩訶薩以十事故，現處童子地。何等為十？所謂：為現通達一切世間文字、算計、圖書、印璽種種業故，處童子地；為現通達一切世間象馬、車乘、弧矢、劍戟種種業故，處童子地；為現通達一切世間文筆、談論、博弈、嬉戲種種事故，處童子地；為現遠離身、語、意業諸過失故，處童子地；為現入定住涅槃門，周遍十方無量世界故，處童子地；為現其力超過一切天、龍、夜叉、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽、釋、梵、護世、人、非人等故，處童子地；為現菩薩色相威光超過一切釋、梵、護世故，處童子地；為令耽著欲樂眾生歡喜樂法故，處童子地；為尊重正法，勤供養佛，周遍十方一切世界故，處童子地；為現得佛加被蒙法光明故，處童子地。是為十。「佛子！\n\n**（条 191／201）現童子地已，以十事故現處王宮**：\n\n> 菩薩摩訶薩現童子地已，以十事故現處王宮。何等為十？所謂：為令宿世同行眾生善根成熟故，現處王宮；為顯示菩薩善根力故，現處王宮；為諸人、天耽著樂具，示現菩薩大威德樂具故，現處王宮；順五濁世眾生心故，現處王宮；為現菩薩大威德力能於深宮入三昧故，現處王宮；為令宿世同願眾生滿其意故，現處王宮；欲令父母、親戚、眷屬滿所願故，現處王宮；欲以妓樂出妙法音供養一切諸如來故，現處王宮；欲於宮內住微妙三昧，始從成佛乃至涅槃皆示現故，現處王宮；為隨順守護諸佛法故，現處王宮。是為十。最後身菩薩如是示現處王宮已，然後出家。「佛子！\n\n**（条 192／201）以十事故，示現出家**：\n\n> 菩薩摩訶薩以十事故，示現出家。何等為十？所謂：為厭居家故，示現出家；為著家眾生令捨離故，示現出家；為隨順信樂聖人道故，示現出家；為宣揚讚歎出家功德故，示現出家；為顯永離二邊見故，示現出家；為令眾生離欲樂、我樂故，示現出家；為先現出三界相故，示現出家；為現自在不屬他故，示現出家；為顯當得如來十力、無畏法故，示現出家；最後菩薩法應爾故，示現出家。是為十。菩薩以此調伏眾生。「佛子！\n\n**（条 193／201）為十種事故，示行苦行**：\n\n> 菩薩摩訶薩為十種事故，示行苦行。何等為十？所謂：為成就劣解眾生故，示行苦行；為拔邪見眾生故，示行苦行；為不信業報眾生令見業報故，示行苦行；為隨順雜染世界法應爾故，示行苦行；示能忍劬勞勤修道故，示行苦行；為令眾生樂求法故，示行苦行；為著欲樂、我樂眾生故，示行苦行；為顯菩薩起行殊勝，乃至最後生猶不捨勤精進故，示行苦行；為令眾生樂寂靜法，增長善根故，示行苦行；為諸天、世人諸根未熟，待時成熟故，示行苦行。是為十。菩薩以此方便調伏一切眾生。「佛子！\n\n**（条 194／201）往詣道場有十種事**：\n\n> 菩薩摩訶薩往詣道場有十種事。何等為十？所謂：詣道場時，照耀一切世界；詣道場時，震動一切世界；詣道場時，於一切世界普現其身；詣道場時，覺悟一切菩薩及一切宿世同行眾生；詣道場時，示現道場一切莊嚴；詣道場時，隨諸眾生心之所欲，而為現身種種威儀，及菩提樹一切莊嚴；詣道場時，現見十方一切如來；詣道場時，舉足、下足常入三昧，念念成佛無有超隔；詣道場時，一切天、龍、夜叉、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽、釋、梵、護世一切諸王各不相知，而興種種上妙供養；詣道場時，以無礙智，普觀一切諸佛如來於一切世界修菩薩行而成正覺。是為十。菩薩以此教化眾生。「佛子！\n\n**（条 195／201）坐道場有十種事**：\n\n> 菩薩摩訶薩坐道場有十種事。何等為十？所謂：坐道場時，種種震動一切世界；坐道場時，平等照耀一切世界；坐道場時，除滅一切諸惡趣苦；坐道場時，令一切世界金剛所成；坐道場時，普觀一切諸佛如來師子之座；坐道場時，心如虛空，無所分別；坐道場時，隨其所應，現身威儀；坐道場時，隨順安住金剛三昧；坐道場時，受一切如來神力所持清淨妙處；坐道場時，自善根力悉能加被一切眾生。是為十。「佛子！\n\n**（条 196／201）坐道場時，有十種奇特未曾有事**：\n\n> 菩薩摩訶薩坐道場時，有十種奇特未曾有事。何等為十？佛子！菩薩摩訶薩坐道場時，十方世界一切如來皆現其前，咸舉右手而稱讚言：『善哉善哉！無上導師！』是為\n>\n> 第一未曾有事。菩薩摩訶薩坐道場時，一切如來皆悉護念，與其威力，是為\n>\n> 第二未曾有事。菩薩摩訶薩坐道場時，宿世同行諸菩薩眾悉來圍遶，以種種莊嚴具恭敬供養，是為\n>\n> 第三未曾有事。菩薩摩訶薩坐道場時，一切世界草木、叢林諸無情物，皆曲身低影，歸向道場，是為\n>\n> 第四未曾有事。菩薩摩訶薩坐道場時，入三昧，名：觀察法界，此三昧力能令菩薩一切諸行悉得圓滿，是為\n>\n> 第五未曾有事。菩薩摩訶薩坐道場時，得陀羅尼，名：最上離垢妙光海藏，能受一切諸佛如來大雲法雨，是為\n>\n> 第六未曾有事。菩薩摩訶薩坐道場時，以威德力興上妙供具，遍一切世界供養諸佛，是為\n>\n> 第七未曾有事。菩薩摩訶薩坐道場時，住最勝智，悉現了知一切眾生諸根意行，是為\n>\n> 第八未曾有事。菩薩摩訶薩坐道場時，入三昧，名：善覺，此三昧力能令其身充滿三世盡虛空界一切世界，是為\n>\n> 第九未曾有事。菩薩摩訶薩坐道場時，得離垢光明無礙大智，令其身業普入三世，是為\n>\n> 第十未曾有事。佛子！是為菩薩摩訶薩坐道場時，十種奇特未曾有事。「佛子！\n\n**（条 197／201）坐道場時，觀十種義故，示現降魔**：\n\n> 菩薩摩訶薩坐道場時，觀十種義故，示現降魔。何等為十？所謂：為濁世眾生樂於鬪戰，欲顯菩薩威德力故，示現降魔；為諸天、世人有懷疑者，斷彼疑故，示現降魔；為教化調伏諸魔軍故，示現降魔；為欲令諸天、世人樂軍陣者，咸來聚觀，心調伏故，示現降魔；為顯示菩薩所有威力世無能敵故，示現降魔；為欲發起一切眾生勇猛力故，示現降魔；為哀愍末世諸眾生故，示現降魔；為欲顯示乃至道場猶有魔軍而來觸惱，此後乃得超魔境界故，示現降魔；為顯煩惱業用羸劣，大慈善根勢力強盛故，示現降魔；為欲隨順濁惡世界所行法故，示現降魔。是為十。「佛子！\n\n**（条 198／201）有十種成如來力**：\n\n> 菩薩摩訶薩有十種成如來力。何等為十？所謂：超過一切眾魔煩惱業故，成如來力；具足一切菩薩行，遊戲一切菩薩三昧門故，成如來力；具足一切菩薩廣大禪定故，成如來力；圓滿一切白淨助道法故，成如來力；得一切法智慧光明，善思惟分別故，成如來力；其身周遍一切世界故，成如來力；所出言音悉與一切眾生心等故，成如來力；能以神力加持一切故，成如來力；與三世諸佛身、語、意業等無有異，於一念中了三世法故，成如來力；得善覺智三昧，具如來十力，所謂：是處非處智力乃至漏盡智力故，成如來力。是為十。若諸菩薩具此十力，則名：如來、應、正等覺。「佛子！\n\n**（条 199／201）轉大法輪有十種事**：\n\n> 如來、應、正等覺轉大法輪有十種事。何等為十？一者，具足清淨四無畏智；二者，出生四辯隨順音聲；三者，善能開闡四真諦相；四者，隨順諸佛無礙解脫；五者，能令眾生心皆淨信；六者，所有言說皆不唐捐，能拔眾生諸苦毒箭；七者，大悲願力之所加持；八者，隨出音聲普遍十方一切世界；九者，於阿僧祇劫說法不斷；十者，隨所說法皆能生起根、力、覺道、禪定、解脫、三昧等法。佛子！諸佛如來轉於法輪，有如是等無量種事。「佛子！\n\n**（条 200／201）轉法輪時，以十事故，於眾生心中種白淨法，無空過者**：\n\n> 如來、應、正等覺轉法輪時，以十事故，於眾生心中種白淨法，無空過者。何等為十？所謂：過去願力故；大悲所持故；不捨眾生故；智慧自在，隨其所樂為說法故；必應其時，未曾失故；隨其所宜，無妄說故；知三世智，善了知故；其身最勝，無與等故；言辭自在，無能測故；智慧自在，隨所發言悉開悟故。是為十。「佛子！\n\n**（条 201／201）作佛事已，觀十種義故，示般涅槃**：\n\n> 如來、應、正等覺作佛事已，觀十種義故，示般涅槃。何等為十？所謂：示一切行實無常故；示一切有為非安隱故；示大涅槃是安隱處，無怖畏故；以諸人、天樂著色身，為現色身是無常法，令其願住淨法身故；示無常力不可轉故；示一切有為不隨心住，不自在故；示一切三有皆如幻化，不堅牢故；示涅槃性究竟堅牢，不可壞故；示一切法無生無起而有聚集、散壞相故；佛子！諸佛世尊作佛事已，所願滿已，轉法輪已，應化度者皆化度已，有諸菩薩應受尊號成記別已，法應如是入於不變大般涅槃。佛子！是為如來、應、正等覺觀十義故，示般涅槃。「佛子！此法門名：菩薩廣大清淨行。無量諸佛所共宣說，能令智者了無量義皆生歡喜，令一切菩薩大願、大行皆得相續。佛子！若有眾生得聞此法，聞已信解，解已修行，必得疾成阿耨多羅三藐三菩提。何以故？以如說修行故。佛子！若諸菩薩不如說行，當知是人於佛菩提則為永離，是故菩薩應如說行。\n\n### 2.5 如来赞·品名句（程序全引）\n\n> 佛子！此一切菩薩功德行處．決定義華．普入一切法．普生一切智．超諸世間．離二乘道．不與一切諸眾生共．悉能照了一切法門．增長眾生出世善根．離世間法門品，應尊重，應聽受，應誦持，應思惟，應願樂，應修行；若能如是，當知是人疾得阿耨多羅三藐三菩提。」說此品時，佛神力故，及此法門法如是故，十方無量無邊阿僧祇世界皆大震動，大光普照。爾時，十方諸佛皆現普賢菩薩前，讚言：「善哉善哉！佛子！乃能說此諸菩薩摩訶薩功德行處．決定義華．普入一切佛法．出世間法門品。佛子！汝已善學此法，善說此法。汝以威力護持此法，我等諸佛悉皆隨喜；如我等諸佛隨喜於汝，一切諸佛悉亦如是。佛子！我等諸佛悉共同心護持此經，令現在、未來諸菩薩眾未曾聞者皆當得聞。」爾時，普賢菩薩摩訶薩承佛神力，觀察十方一切大眾洎于法界而說頌言：「\n\n### 2.6 结偈（4,374 字·程序全引）\n\n> 「於無量劫修苦行，從無量佛正法生，令無量眾住菩提，彼無等行聽我說。供無量佛而捨著，廣度群生不作想，求佛功德心無依，彼勝妙行我今說。離三界魔煩惱業，具聖功德最勝行，滅諸癡惑心寂然，我今說彼所行道。永離世間諸誑幻，種種變化示眾生，心生住滅現眾事，說彼所能令眾喜。\n>\n> 見諸眾生生老死，煩惱憂橫所纏迫，欲令解脫教發心，彼功德行應聽受。施戒忍進禪智慧，方便慈悲喜捨等，百千萬劫常修行，彼人功德仁應聽。千萬億劫求菩提，所有身命皆無吝，願益群生不為己，彼慈愍行我今說。無量億劫演其德，如海一滴未為少，功德無比不可諭，以佛威神今略說。\n>\n> 其心無高下，求道無厭倦，普使諸眾生，住善增淨法。智慧普饒益，如樹如河泉，亦如於大地，一切所依處。菩薩如蓮華，慈根安隱莖，智慧為眾蘂，戒品為香潔。佛放法光明，令彼得開敷，不著有為水，見者皆欣樂。菩薩妙法樹，生於直心地，信種慈悲根，智慧以為身，方便為枝幹，五度為繁密，定葉神通華，一切智為果。\n>\n> 最上力為蔦，垂陰覆三界。菩薩師子王，白淨法為身。四諦為其足，正念以為頸，慈眼智慧首，頂繫解脫繒，勝義空谷中，吼法怖眾魔。菩薩為商主，普見諸群生，在生死曠野，煩惱險惡處，魔賊之所攝，癡盲失正道，示其正直路，令入無畏城。菩薩見眾生，三毒煩惱病，種種諸苦惱，長夜所煎迫；\n>\n> 為發大悲心，廣說對治門，八萬四千種，滅除眾苦患。菩薩為法王，正道化眾生，令遠惡修善，專求佛功德；一切諸佛所，灌頂授尊記，廣施眾聖財，菩提分珍寶。菩薩轉法輪，如佛之所轉，戒轂三昧輞，智莊慧為劍，既破煩惱賊，亦殄眾魔怨，一切諸外道，見之無不散。\n>\n> 菩薩智慧海，深廣無涯際，正法味盈洽，覺分寶充滿，大心無邊岸，一切智為潮，眾生莫能測，說之不可盡。菩薩須彌山，超出於世間，神通三昧峯，大心安不動；若有親近者，同其智慧色，逈絕眾境界，一切無不覩。菩薩如金剛，志求一切智，信心及苦行，堅固不可動；\n>\n> 其心無所畏，饒益諸群生，眾魔與煩惱，一切悉摧滅。菩薩大慈悲，譬如重密雲，三明發電光，神足震雷音，普以四辯才，雨八功德水，潤洽於一切，令除煩惱熱。菩薩正法城，般若以為牆，慚愧為深塹，智慧為却敵，廣開解脫門，正念恒防守，四諦坦王道，六通集兵仗，復建大法幢，周迴遍其下；\n>\n> 三有諸魔眾，一切無能入。菩薩迦樓羅，如意為堅足，方便勇猛翅，慈悲明淨眼，住一切智樹，觀三有大海，搏撮天人龍，安置涅槃岸。菩薩正法日，出現於世間，戒品圓滿輪，神足速疾行，照以智慧光，長諸根力藥，滅除煩惱闇，消竭愛欲海。菩薩智光月，法界以為輪，遊於畢竟空，世間無不見；\n>\n> 三界識心內，隨時有增減；二乘星宿中，一切無儔匹。菩薩大法王，功德莊嚴身，相好皆具足，人天悉瞻仰，方便清淨目，智慧金剛杵，於法得自在，以道化群生。菩薩大梵王，自在超三有，業惑悉皆斷，慈捨靡不具，處處示現身，開悟以法音，於彼三界中，拔諸邪見根。\n>\n> 菩薩自在天，超過生死地，境界常清淨，智慧無退轉，絕彼下乘道，受諸灌頂法，功德智慧具，名稱靡不聞。菩薩智慧心，清淨如虛空，無性無依處，一切不可得，有大自在力，能成世間事，自具清淨行，令眾生亦然。菩薩方便地，饒益諸眾生；菩薩慈悲水，澣滌諸煩惱；\n>\n> 菩薩智慧火，燒諸惑習薪；菩薩無住風，遊行三有空。菩薩如珍寶，能濟貧窮厄；菩薩如金剛，能摧顛倒見；菩薩如瓔珞，莊嚴三有身；菩薩如摩尼，增長一切行。菩薩德如華，常發菩提分；菩薩願如鬘，恒繫眾生首。菩薩淨戒香，堅持無缺犯；菩薩智塗香，普熏於三界。\n>\n> 菩薩力如帳，能遮煩惱塵；菩薩智如幢，能摧我慢敵。妙行為繒綵，莊嚴於智慧，慚愧作衣服，普覆諸群生。菩薩無礙乘，巾之出三界；菩薩大力象，其心善調伏；菩薩神足馬，騰步超諸有；菩薩說法龍，普雨眾生心；菩薩優曇華，世間難值遇；菩薩大勇將，眾魔悉降伏；\n>\n> 菩薩轉法輪，如佛之所轉；菩薩燈破闇，眾生見正道；菩薩功德河，恒順正道流；菩薩精進橋，廣度諸群品。大智與弘誓，共作堅牢船，引接諸眾生，安置菩提岸。菩薩遊戲園，真實樂眾生；菩薩解脫華，莊嚴智宮殿；菩薩如妙藥，滅除煩惱病；菩薩如雪山，出生智慧藥。\n>\n> 菩薩等於佛，覺悟諸群生，佛心豈有他，正覺覺世間。如佛之所來，菩薩如是來；亦如一切智，以智入普門。菩薩善開導，一切諸群生；菩薩自然覺，一切智境界。菩薩無量力，世間莫能壞；菩薩無畏智，知眾生及法。一切諸世間，色相各差別，音聲及名字，悉能分別知。\n>\n> 雖離於名色，而現種種相；一切諸眾生，莫能測其道。如是等功德，菩薩悉成就，了性皆無性，有無無所著。如是一切智，無盡無所依，我今當演說，令眾生歡喜。雖知諸法相，如幻悉空寂，而以悲願心，及佛威神力，現神通變化，種種無量事；如是諸功德，汝等應聽受。\n>\n> 一身能示現，無量差別身，無心無境界，普應一切眾。一音中具演，一切諸言音；眾生語言法，隨類皆能作。永離煩惱身，而現自在身，知法不可說，而作種種說。其心常寂滅，清淨如虛空，而普莊嚴剎，示現一切眾。於身無所著，而能示現身；一切世間中，隨應而受生。\n>\n> 雖生一切處，亦不住受生，知身如虛空，種種隨心現。菩薩身無邊，普現一切處，常恭敬供養，最勝兩足尊。香華眾妓樂，幢幡及寶蓋，恒以深淨心，供養於諸佛。不離一佛會，普在諸佛所，於彼大眾中，問難聽受法。聞法入三昧，一一無量門，起定亦復然，示現無窮盡。\n>\n> 智慧巧方便，了世皆如幻，而能現世間，無邊諸幻法。示現種種色，亦現心及語，入諸想網中，而恒無所著。或現初發心，利益於世間；或現久修行，廣大無邊際，施戒忍精進，禪定及智慧，四梵四攝等，一切最勝法。或現行成滿，得忍無分別；或現一生繫，諸佛與灌頂。\n>\n> 或現聲聞相，或復現緣覺，處處般涅槃，不捨菩提行。或現為帝釋，或現為梵王，或天女圍遶，或時獨宴默。或現為比丘，寂靜調其心；或現自在王，統理世間法。或現巧術女，或現修苦行，或現受五欲，或現入諸禪。或現初始生，或少或老死。若有思議者，心疑發狂亂。\n>\n> 或現在天宮，或現始降神，或入或住胎，成佛轉法輪。或生或涅槃，或現入學堂，或在采女中，或離俗修禪。或坐菩提樹，自然成正覺；或現轉法輪，或現始求道。或現為佛身，宴坐無量剎；或修不退道，積集菩提具。深入無數劫，皆悉到彼岸；無量劫一念，一念無量劫。\n>\n> 一切劫非劫，為世示現劫，無來無積集，成就諸劫事。於一微塵中，普見一切佛；十方一切處，無處而不有。國土眾生法，次第悉皆見；經無量劫數，究竟不可盡。菩薩知眾生，廣大無有邊；彼一眾生身，無量因緣起。如知一無量，一切悉亦然；隨其所通達，教諸未學者。\n>\n> 悉知眾生根，上中下不同；亦知根轉移，應化不應化；一根一切根，展轉因緣力，微細各差別，次第無錯亂。又知其欲解，一切煩惱習；亦知去來今，所有諸心行。了達一切行，無來亦無去；既知其行已，為說無上法。雜染清淨行，種種悉了知，一念得菩提，成就一切智。\n>\n> 住佛不思議，究竟智慧心，一念悉能知，一切眾生行。菩薩神通智，功力已自在，能於一念中，往詣無邊剎。如是速疾往，盡於無數劫，無處而不周，莫動毫端分。譬如工幻師，示現種種色，於彼幻中求，無色無非色。菩薩亦如是，以方便智幻，種種皆示現，充滿於世間。\n>\n> 譬如淨日月，皎鏡在虛空，影現於眾水，不為水所雜。菩薩淨法輪，當知亦如是，現世間心水，不為世所雜。如人睡夢中，造作種種事，雖經億千歲，一夜未終盡。菩薩住法性，示現一切事，無量劫可極，一念智無盡。譬如山谷中，及以宮殿間，種種皆響應，而實無分別。\n>\n> 菩薩住法性，能以自在智，廣出隨類音，亦復無分別。如有見陽焰，想之以為水，馳逐不得飲，展轉更增渴。眾生煩惱心，應知亦如是；菩薩起慈愍，救之令出離。觀色如聚沫，受如水上泡，想如熱時焰，諸行如芭蕉。心識猶如幻，示現種種事；如是知諸蘊，智者無所著。\n>\n> 諸處悉空寂，如機關動轉；諸界性永離，妄現於世間。菩薩住真實，寂滅\n>\n> 第一義，種種廣宣暢，而心無所依。無來亦無去，亦復無有住，煩惱業苦因，三種恒流轉。緣起非有無，非實亦非虛，如是入中道，說之無所著。能於一念中，普現三世心，欲色無色界，一切種種事。隨順三律儀，演說三解脫，建立三乘道，成就一切智。\n>\n> 了達處非處，諸業及諸根，界解與禪定，一切至處道。宿命念天眼，滅除一切惑，知佛十種力，而未能成就。了達諸法空，而常求妙法，不與煩惱合，而亦不盡漏。廣知出離道，而以度眾生，於此得無畏，不捨修諸行。無謬無違道，亦不失正念，精進欲三昧，觀慧無損減。\n>\n> 三聚皆清淨，三世悉明達，大慈愍眾生，一切無障礙。由入此法門，得成如是行，我說其少分，功德莊嚴義。窮於無數劫，說彼行無盡，我今說少分，如大地一塵。依於佛智住，起於奇特想，修行最勝行，具足大慈悲。精勤自安隱，教化諸含識，安住淨戒中，具諸授記行。\n>\n> 能入佛功德，眾生行及剎，劫世悉亦知，無有疲厭想。差別智總持，通達真實義，思惟說無比，寂靜等正覺。發於普賢心，及修其行願，慈悲因緣力，趣道意清淨。修行波羅蜜，究竟隨覺智，證知力自在，成無上菩提。成就平等智，演說最勝法，能持具妙辯，逮得法王處。\n>\n> 遠離於諸著，演說心平等，出生於智慧，變化得菩提。住持一切劫，智者大欣慰，深入及依止，無畏無疑惑。了達不思議，巧密善分別，善入諸三昧，普見智境界。究竟諸解脫，遊戲諸通明，纏縛悉永離，園林恣遊處。白法為宮殿，諸行可欣樂，現無量莊嚴，於世心無動。\n>\n> 深心善觀察，妙辯能開演，清淨菩提印，智光照一切。所住無等比，其心不下劣，立志如大山，種德若深海。如寶安住法，被甲誓願心，發起於大事，究竟無能壞。得授菩提記，安住廣大心，祕藏無窮盡，覺悟一切法。世智皆自在，妙用無障礙，眾生一切剎，及以種種法。\n>\n> 身願與境界，智慧神通等，示現於世間，無量百千億。遊戲及境界，自在無能制，力無畏不共，一切業莊嚴。諸身及身業，語及淨修語，以得守護故，成辦十種事。菩薩心發心，及以心周遍，諸根無散動，獲得最勝根。深心增勝心，遠離於諂誑；種種決定解，普入於世間。\n>\n> 捨彼煩惱習，取茲最勝道，巧修使圓滿，逮成一切智。離退入正位，決定證寂滅，出生佛法道，成就功德號。道及無量道，乃至莊嚴道，次第善安住，悉皆無所著。手足及腹藏，金剛以為心，被以慈哀甲，具足眾器仗。智首明達眼，菩提行為耳，清淨戒為鼻，滅闇無障礙。\n>\n> 辯才以為舌，無處不至身；最勝智為心，行住修諸業。道場師子坐，梵臥空為住，所行及觀察，普照如來境。遍觀眾生行，奮迅及哮吼，離貪行淨施，捨慢持淨戒，不瞋常忍辱，不懈恒精進，禪定得自在，智慧無所行，慈濟悲無倦，喜法捨煩惱；於諸境界中，知義亦知法。\n>\n> 福德悉成滿，智慧如利劍，普照樂多聞，明了趣向法。知魔及魔道，誓願咸捨離；見佛與佛業，發心皆攝取，離慢修智慧，不為魔力持；為佛所攝持，亦為法所持。現住兜率天，又現彼命終；示現住母胎，亦現微細趣。現生及微笑，亦現行七步；示修眾技術，亦示處深宮。\n>\n> 出家修苦行，往詣於道場，端坐放光明，覺悟諸群生，降魔成正覺，轉無上法輪，所現悉已終，入於大涅槃。彼諸菩薩行，無量劫修習，廣大無有邊，我今說少分。雖令無量眾，安住佛功德；眾生及法中，畢竟無所取。具足如是行，遊戲諸神通：毛端置眾剎，經於億千劫；\n>\n> 掌持無量剎，遍往身無倦，還來置本處，眾生不知覺。菩薩以一切，種種莊嚴剎，置於一毛孔，真實悉令見。復以一毛孔，普納一切海，大海無增減，眾生不嬈害。無量鐵圍山，手執碎為塵，一塵下一剎，盡此諸塵數。以此諸塵剎，復更末為塵；如是塵可知，菩薩智難量。\n>\n> 於一毛孔中，放無量光明；日月星宿光，摩尼珠火光，及以諸天光，一切皆映蔽，滅諸惡道苦，為說無上法。一切諸世間，種種差別音；菩薩以一音，一切皆能演。決定分別說，一切諸佛法，普使諸群生，聞之大歡喜。過去一切劫，安置未來今；未來現在劫，迴置過去世。\n>\n> 示現無量剎，燒然及成住；一切諸世間，悉在一毛孔。未來及現在，一切十方佛，靡不於身中，分明而顯現。深知變化法，善應眾生心，示現種種身，而皆無所著。或現於六趣，一切眾生身，梵釋護世身，諸天人眾身，聲聞緣覺身，諸佛如來身；或現菩薩身，修行一切智。\n>\n> 善入軟中上，眾生諸想網，示現成菩提，及以諸佛剎。了知諸想網，於想得自在，示修菩薩行，一切方便事。示現如是等，廣大諸神變；如是諸境界，舉世莫能知。雖現無所現，究竟轉增上，隨順眾生心，令行真實道。身語及與心，平等如虛空，淨戒為塗香，眾行為衣服，法繒嚴淨髻，一切智摩尼，功德靡不周，灌頂昇王位。\n>\n> 波羅蜜為輪，諸通以為象，神足以為馬，智慧為明珠。妙行為采女，四攝主藏臣，方便為主兵，菩薩轉輪王。三昧為城廓，空寂為宮殿，慈甲智慧劍，念弓明利箭。高張神力蓋，逈建智慧幢，忍力不動搖，直破魔王軍。總持為平地，眾行為河水，淨智為涌泉，妙慧作樹林。\n>\n> 空為澄淨池，覺分菡萏華，神力自莊嚴，三昧常娛樂。思惟為采女，甘露為美食，解脫味為漿，遊戲於三乘。此諸菩薩行，微妙轉增上，無量劫修行，其心不厭足。供養一切佛，嚴淨一切剎，普令一切眾，安住一切智。一切剎微塵，悉可知其數；一切虛空界，一沙可度量；\n>\n> 一切眾生心，念念可數知；佛子諸功德，說之不可盡。欲具此功德，及諸上妙法，欲使諸眾生，離苦常安樂，欲令身語意，悉與諸佛等，應發金剛心，學此功德行。」\n\n## 三、旁参与前接\n\n**承前**：品35〈如來出現品〉性起果德圆满——本品普贤重入三昧说行：**果后起行，行即离世间**；会处重回普光明殿（本经七处中之首处），首尾相照〔本文判断：第七会亦普光明殿——果行同殿，性起与离世间一体之两面〕。\n\n**启后**：品37...（*本文按：次品即全经末品〈入法界品〉第三十九——善财五十三参，行门之人间展开*）——二千行门至此收束为**一善财之行**；法界实证，俟末品。\n\n## 四、义理要点\n\n**【要点提炼】**\n\n1. **二百问×十答＝二千行门**（「二百」为传统成句；八十本实测 201 问）：实测「何等為十」201 条（§2.4 名目总表 201 行·含子目）——行门不立单条，皆以十数成组；组名自「依」「奇特想」「行」至「成如來力」「事」，覆盖菩萨道全境。\n2. **问体杂陈**：普慧之问「何等為X？」「云何X？」「何故X？」杂发（§2.3 实测 201 问句）——问无定式而答必成十，**问可以散，行必有则**。\n3. **佛事段之「示现」语法**：后段答文连用「以十事故，示現微笑／示行七步／現處童子地／示現出家……」——八相成道被重述为**调伏众生之示范**（为调伏众生故，如是示现）。\n4. **品名自证**：如来赞语即品之别题——「出世間法門品」：**离世间者，出世间法门之总持**，非厌离世间。\n\n**【阐释】**（〔本文判断〕）本品是全经的**行法辞典**：二千行门（传统成句）的条目，每条皆「条件—行相—成效」三段式（安住此法，則得／則能）。其编辑学意义在「组」：十数为华严之法数底盘，二百组（成句）即二百个十进制概念格——检索任何菩萨行主题，本品皆有其条目。而「離世間」三字须依如来赞语读：**出世间法门**——离的不是世间之境，是世间之执；二千行门即在人间行持中展开，故曰「离世间不离世间而离」。\n\n**【启发】**读此品宜作**工具书读法**：不必通读背诵，先取与自己功课相应之组（如「勤精進」「清淨施」「魔所攝持」），持其一组十门为日课；再以「示现」段八相之问自问——佛之示现皆为调伏，我之行止何所调伏？结偈「應發金剛心，學此功德行」——金刚心者，二千门之总开关。\n\n**【对照】**：四十华严（T0293）无本品〔实测：T0293 唯入法界品〕；六十华严〈離世間品〉同题对应（逐组对勘〔待深化批〕）。二千行门与〈十地品〉六度、〈十回向〉十向之层级关系——深化批制主题索引〔未竟〕。\n\n## 五、注疏选要\n\n### 5.1 澄观（`T1735`·深化批补引·存目）\n\n> 離世間品1離世間品第三十八已上入第五十三經初明來意。來意有三:一分來,前明修因契果生解分,則於法起解;今明託法進修成行分,則依解起行,義次第故。二會來者,前會因圓果滿生解之終,此會正行處世無染,通於始終,故次來也。三品來者,前品出現之果殊勝,今明依彼起行圓融,故次來也。雖一分一會一品是同,所對既殊,來意亦別。第二釋名。亦有三別:一分名者,沒彼位名,但彰行法,欲顯行位無礙、前後圓融,故以名也。二會名者,約法不異分名,約處名三會普光明殿之會。第七重會,會終歸始故。雖越四天,同為生解之會;今復重會,通對彼分始終,依解成行,故會普光。而前分生解差別,故寄歷處以顯淺深;今分起行圓融,故一會並收因果,亦表成行不離普光明智故。此中不隔餘處,何有重會之義?若約次第,前時後時即是重義。若約圓融,就義名重,故不動前二而升四天。二七相望亦何所隔,明知約義亦猶燈光涉入無礙,亦似燈炷重發重明。約人,名普慧普賢問答之會。三品名有二:一得名、二釋名。今初,又二:一異名。下文十義,至彼當辨。有別行本名度世經,度即離義。又有別行名普賢菩薩答難二千經,此就能離人法受稱。二正辨本稱,總由超絕世染故受其名。別有三義:一約法、二約行、三約位。約法之中,先世、後離世。有三類:一約事相有二世間,謂器及有情,此約依正分之。二約麁細亦二:一有為世間、二無為世間,此約分段、變易分之。以變易非三有攝,名之無為。故《勝鬘》云「有為生死,無為生死。」然麁細雖殊,體不出二。三約染淨有三:於初二中,加智正覺示同世間,不同世故,如《地論》辨。二明離者,離有二義:一性離,世間性空即是出世間故;二明事離,行成無染故。力林頌云「三世五蘊法,說名為世間。彼滅非世間,如是但假名。」滅通二義,於事離中有似離真離、分離全離,次下當辨。二約行者,略為四句:一隨、二離、三俱、四泯。言隨者,凡夫沈溺世蘊,非離非隨。二乘無悲不能隨世,雖離非真。菩薩能隨,方為真離,故以隨釋離。二離者,有大智故了世性離,處而不染亦異凡小。三俱者,悲故常行世間,智故不染世法。既以世與性離無二為其境,故以悲智無二為其行。境行融通有其三句:一悲無不智,則世無不離,是以常在世間未曾不出。二智無不悲故,離無不世,是以恒越世表,無不遊世。三雙融故動靜無二,唯是一念,所謂無念。無念等故,世與出世無有障礙。四俱泯者,謂境既世與性離,形奪兩亡,故令悲智俱融,二念雙絕。又由境行相由,形奪齊離,則絕待離言。融前四句皆無障礙,方為真離世間也。三約位者,凡夫染而非離,二乘分離非真,謂果離分段、因唯事離,非今所明。菩薩具上真行,可得名離,而非究竟。唯佛為離,故經云「佛常在世間,而不染世法。」然今文中備六位之行即是行離,行所依位即是位離,故若事若理、若因若果皆名離也。二釋名者,約法事離,無他受稱。離非世間,即相違釋。若約性離,通持業釋。約行四句,前三句俱通持業、相違二,事理離故。泯句並非六釋。亦可持業,泯即離故。第三宗趣。頓彰六位理事二離為宗,令體性離頓成真離究竟為趣。第四釋文。長科十分,一序分、二三昧分、三發起分、四起分、五請分、六說分、七結勸分、八現瑞分、九證成分、十重頌分。今初,有三:一器世間圓滿,義如前釋。二「妙悟」下智正覺世間圓滿。「三與不可說」下眾生世間圓滿。二中明佛二十一種殊勝功德,廣引諸論,已見〈升兜率品〉。今但略明,初句為總,具下二十一種功德,故云妙悟皆滿。後「二行」下別。於中,前四自利、餘皆利他。前中,一智德、二斷德、三恩德、四作用平等德。今初,二行永絕,即於所知一向無障轉功德。《佛地經》名不二現行。「不」字,此宜言無,即永絕義。謂佛智德離所知障,非如聲聞極遠時處等有不知故。有知不知即是二行,今無不知,故云永絕。二達無相法,則於有無無二相真如最勝清淨能入功德。彼經名趣無相法,趣謂趣入,即此達義。然無相法,體即真如。無彼有無二相,故名無相。諸法中最,淨無客塵,令自他入,勝於二乘,名最勝清淨。三住於佛住者,即無功用佛事不休息功德。世親釋云「謂住佛所住無所住處」,此即釋經;於此住中常作佛事無有休息,此即解論。四得佛平等,即於法身中所依意樂作事無差別功德。謂諸佛有三事無差:一所依智同、二益生意樂同、三報化作業同,故云平等。五到無障處,則修一切障對治功德。世親釋云「謂一切時常修覺慧,對治一切障故。」此明覺慧為能治;一切障即二障,為所治。六不可轉法,即降伏一切外道功德。謂教證二道,他不能動故。七所行無礙,即生在世間不為世法所礙功德。謂利衰等八法不能拘故。八立不思議,即安立正法功德。謂安立十二分教,餘不能思故。九普見三世,即授記功德。謂記別過未,皆如現在故。十身恒充滿一切國土,即一切世界示現受用變化身功德。謂二種身遍二種國故。十一智恒明達一切諸法,即斷疑功德。謂自於一切境善決定故,能決他疑。十二了一切行,即令入種種行功德。二釋,《攝論》易故不解。意云:遍了一切有情性行,隨根令入故。十三盡一切疑,即當來法生妙智功德。謂聲聞言其全無善根,如來知其久遠微善,後當生故。十四無能測身,即如其勝解示現功德。謂隨諸有情種種勝解,現金色等身,雖現此身而無分別,如末尼等故無能測。十五一切菩薩等所求智,即無量所依調伏有情加行功德。謂由無量菩薩所依,為欲調伏諸有情故,發起加行。佛增上力,聞法為先,獲得妙智。異類菩薩攝受付囑,展轉傳來相續無間而轉,由此證得一切菩薩等所求智。意云:佛智為一切菩薩等所求故。十六到佛無二究竟彼岸,即平等法身波羅蜜多成滿功德。平等即無二義,無二法身為波羅蜜多所依。十七具足如來平等解脫,即隨其勝解示現差別佛土功德。此中解脫即是勝解,隨物勝解所宜。如來勝解能現金銀等土,佛佛皆然,故云平等。十八證無中邊佛平等地,即三種佛身方處無分限功德。世親云「謂佛法身不可分限爾所方處受用變化,亦不可說爾所世界。」十九盡於法界,即窮生死際常現利樂一切有情功德。二十等虛空界,即無盡功德。謂佛實智如空無盡故。今經缺最後窮未來際,總別合有二十一句,義如前說。然《佛地》、《攝論》約受用身,此約十身。所以知者,處摩竭提國是變化土,而歎受用功德,明知二身二國本相融故;不要地前地上,則五位通見故。第三眾生世間圓滿,中二:先舉數歎德、後「其名」下列名歎德。前則多人具德,後則勝人具德。前中二:先舉數揀定;二「悉具菩薩」下歎具勝德,分三:初總標、二「所謂」下別顯、後「成就」下總結。別中十九句,皆不出方便智慧。分二:前十歎自分德、後「於一念」下九句勝進德。今初,前八皆有智慧方便,依體起用故。前五以善能為句首、六知空不壞業果、七知根器別明識病、八持法化之;後二明有方便慧,皆即事歸實。後勝進中,初句總明速成果智,餘皆果智之用,及後總結,文並可知。第二列名歎德,中二:初列名結數、二「皆悉」下歎德。文有十句,初總、餘別。別中,一契理願圓,普眼滿故。二攝法上首,為普化故。三受持正法,有普慧故。四不斷佛種,普見有性故。五知佛化儀,光普徹故。六示現成佛,觀見無故。七淨染機,照其源故。八摧他障,有智幢故。九證法界,覺法性故。上之九句別明,則初句為願、餘八為行。通說則皆普賢願,宿誓今滿故,如十大願並普賢行現緣所作故,故總句云成就行願。又此十句,十人通具,文云皆悉成故,亦句顯一人之德,當釋名故。故總句為普賢,餘九如次前已配釋。大文第二「爾時普賢」下三昧分。普賢入者,是會主故,說普行故。佛華嚴者,萬行披敷,嚴法身故。即以法界行門心海為體,持無限故。說法成行,發起為用,依此能故。大文第三「入此三昧時」下明發起分。先明地動,警群機故;後顯出聲,令聞法故。前皆有加而無發起,此有發起而無加分者,前表解可從他,故有他加;此表行由己立,故自力發起。又表行依解起,無別法故不加。攝解成行,亦須入定。聖旨多端,不可一準。大文第四「然後從」下起分,三義如前。大文第五「爾時普慧」下請分,分三:初總標問意、二「佛子」下正顯問端、三「善哉佛子」下結請願說。今初。當機眾集說法時至,此為問意。何以前來諸會先問後定,今乃翻?此此有二意:一說儀無定。前表重法,感而後應;此明悲深,觀機欲說。眾既已集,故先入定,令知說主。二約所表,則前明從相入實,以成正解;此中依體起用,以成正行,故不同也。\n\n……（疏文后段从略——全文回源 `T1735`）\n\n（《疏》卷五十一·本品疏文全段·程序抽取逐字回源·后正释从略——来意/释名/宗趣/正释四门见引·L.472）\n\n### 5.2 诸家（程序取窗实引·L.310/L.314）\n\n（程序抽取逐字回源·各一段·L.472）\n\n**澄观《隨疏演義鈔》**（1124 字·程序抽取·句界截断）：\n\n> 離世間品云。修此法者。少作功力疾得菩提等。言以淺為深虛其功者。猶如世尊為止亂想。令數息看心。為厭苦者令出三界。眾生不了耽味為真。勤苦不已。多用功力所獲至微。不得涅槃一日之價。故云虛其功故。即虛廢功力也。疏。莊嚴聖教令深廣故者。第三意也。謂分析權實空有。取捨偏圓遲速。方知佛法微妙深玄。無不包攝。譬猶不泛大海豈識邊涯。不識土石安知真寶。故智論釋法施云。依隨經論廣作義理。為立名字皆名法施。又若不分權實。則謂三教大同。今明大乘尚有權實。何況小耶。小乘比大。由若螢光方於日照。小是佛教尚被斥訶。況於儒道比之佛法。則天地懸隔矣。以此重重揀之。方知佛法深奧。疏。諸聖教中自有分故者。第四意也。如解深密。立三時不同解節。金光明立三輪之異。涅槃自分半滿。又約五味之差。皆佛自分也。疏。諸大菩薩亦開教故者。第五意也。若無著之扶五性及與三時。龍樹之判四門共與不共。皆揀權實有取捨也。疏。以斯多義下。第三雙結離合。而捨合從離。第二古今違順中。先敘此方。後明⻄域。前中先總標。後別釋。一一師中多分為二。先敘昔義。後辯順違。一音中疏上之下辯順違。先出彼意。言各得圓音一>>義者。言含縱奪。縱之則順下出現品。明如來圓音有其十義。十義之後。復六句融通。今但得十義中之一耳。初師則順善口天女一聲之中。與百千種樂而共相應。則佛一音之中有多音也。後師則順如水一味隨器成異。則如來本無多音。故云各得一義耳。又此二義。若不會釋。敵體相違。互不相許。則齊楚俱失。並應奪之。若取各自所宗故。各得一義而與之耳。然並為教本下。又都奪耳。疏。二立二種教。隋遠法師亦同此立者。彼涅槃疏。初云。聖教雖眾。略有二種。一聲聞藏。二菩薩藏是也。疏。斯則文下。二辯順違。先明其順。順於至教。涅槃半滿。前已廣引。疏。蓋是對小下。辯違。上云順者。但順通相之意。未知佛之深旨。半滿之言。顯在小大密意而說。復有以權為半以實為滿。則大乘中有半滿矣。亦猶緣覺聲聞開之有異。則成二乘。合之有同。總稱為小。權實亦爾。開之有異。權可稱半。合之大同。故並稱滿。是則實教唯滿。小教唯半。權大乘者。亦半亦滿也。疏。此雖約機下。辯順違。直出其立意不離半滿。半滿順違。即此順違也。言不出半滿者。頓即前滿。漸具半滿。以具有三乘。二乘是半。大乘是滿。故以機就教有直有曲。故分漸頓耳。>>疏。三唐初印法師下。第三師先敘昔義。中有三。初總標。二屈曲下。正立。三又此下。揀異。疏。此約化儀以判下。辯順違。先順後違。順中三。初一句總出立意。第二遮破釋成。第三結成昔義。今初。第一半滿。約所說法立。第二漸頓約機以立。今此一師約化儀立。謂佛以法化生。有曲直故。即化法儀式不同耳。疏。然華嚴下。第二遮破釋成。謂刊定記不許此師立義。先破總名。後破四異。今為昔通。則遮其破耳。文即分二。先救總名。後救四異。今初。至故云屈曲。是救其破於總名。彼疏破中。先牒義竟云。若爾涅槃法華維摩楞伽密嚴勝鬘佛藏經等。皆釋迦說。應不明於如來藏性實相法界等(此破屈曲以有平道故)華嚴梵網。既舍那說。何故華嚴說於四諦。普賢行等品中。皆云隨諸眾生所應調伏。作如是說。又問。明淨行梵行三賢十地。離世間入法界等。諸品之中。不應皆說對治行法等(此破平道以有屈曲故也)今疏云雖有隨諸眾生各別調伏者。\n\n……（后文从略）\n\n**李通玄《新華嚴經論》**（1007 字·程序抽取·句界截断）：\n\n> 離世間品。明以法界自體本寂定大智為普賢行體。即明覺行遍周。佛華者。覺行也。三昧者。本覺體也。五入法界品。明根本法界本。體大智佛果遍周。此五種遍周。總以法界為體。總是一遍周法門。此五遍周該收諸位諸差別故。恐人不解失其意趣。一部經內五處序致。題目鉤連前後相攝。為明此經以法體本無次第本末兩頭中間時分⻑短故。如王寶印一時普印無前後成文也。以法寶印普印諸位。但明五位十住十行等進修習氣不同故。性無差別。以總別同異成壞十玄六相義融通道理自明。此六字義為緣起三對。六字都該萬法。一總別一對。二同異一對。三成壞一對。總不相離。不可癈一留一。亦不可雙立。亦不可雙捨。總是斷常生滅中邊等見。皆是情量。不了任法自性緣生。此乃以無思正慧力方解。以思而知之者。且信心也。此是初地菩薩。觀察世間一切緣起法。雖總同時。不繫俱有。雖總具別。皆無自性。不可繫法俱無。餘兩對亦然。皆是有無非有無俱不俱常無常情所繫故。如一切緣生法。如空中響。>>本自無為應物成音。如善筮蓍龜者。無思無為。不鬼不神。而應緣能知萬有而告人。古今吉凶如指掌者也。應如是知。任法緣起非如情也。一多總別諸同異門。一切成壞。皆非前後同時等繫。法界法門道理亦復如是。皆非前後有無同時俱不俱或滅或留情所繫故。皆是性起大悲無作大願。任法緣起稱無作智。非故非新。施設轉正法輪。出生滅沒。皆不可作故新去來解。皆是如來無生滅智自在力故。雖異二乘自寂取證。滅情亡智。即以起大願等利諸眾生。而無願想。雖以大慈大悲饒益眾生。而無愛想。雖入生死不沒淤泥。雖在涅槃。十方世界利人不息。皆是如來無性無依無作智力。皆不可作去來現在古今之解。四定其正宗者。有三種正宗。一隨位正宗。二隨品正宗。三大體正宗。一若隨位正宗。十信十住十行十迴向十地十一地。各有正宗。十信以佛根本不動智以為正宗。十住以證入法界智如來果德理體妙慧以為正宗。十行以佛根本智起普賢行進修。以為正宗。十向以理智圓融真俗起興大願以成悲智。使令理智大悲均平不偏靜亂以為正宗。十地以蘊修悲智使令慣習功濟以為正宗。十一地以普賢行等眾生情流充滿法界>>海任用利生以為正宗。此為隨位正宗。二若以一部教門。四十品內。當品自有正宗。隨品名目總是可知。三以一部教大體正宗。以如來大智法界性絕古今體用圓滿一乘佛果以為正宗。常以此佛果正宗。以為開示悟入進修。使令慣習成就。又此經四十品中。以法界品為正宗。餘品為伴。為十方諸佛以自心分別煩惱。成一切智一切種智法界體用。以為所乘成正覺故。此根本煩惱非三乘所知故。二乘且折伏而不起。菩薩以空觀折伏無現行故。廣如勝鬘經說。一切眾生以法界門以為開示悟入。明如來根本智是眾生分別心。契同無二故。則法界自在故。以是義故。十住初心便成正覺。以將十行十向十地十一地法門。治令慣習智悲成就。\n\n……（后文从略）\n\n**李通玄《華嚴經合論》**（996 字·程序抽取·句界截断）：\n\n> 離世間品是常住世間無限利生不與情合作業相應即如善財所表行中憶念文殊初友便聞普賢名及見自身入普賢身是也此是自成佛果竟常行普賢無始終行此普賢行亦明不移本普光明無依住智古人釋云重會普光法堂三會普光法堂總非重及三故大體明但以一箇普光明無依住大智圓會初發心因及佛果并修行行滿此三事總不離此智時亦不遷為明依智發心始終無情見之跡故第九如來不出不沒佛智恒果門者即如第十會中說法界一品經是以法界是佛之恒果故第十表通信六位人法所進求門即如覺城東會大塔廟處善財見文殊菩薩并已下入位中五位善知識是也此已上十門從普光明殿說十信已來總重敘使令學者易解經意故并以略舉善財知識表法次第和會令易解故第三重敘佛所說法處及座體者其義有三一敘說法之處及意趣二敘放光之處及意趣三敘座體及意趣第一敘說法處及意趣者其處有十其意趣有十一第一菩提場菩提樹下一會在熈連河邊去優樓頻螺迦葉聚落五里是一牛吼地是阿蘭若處得道依世間法如此是化眾生法則佛無此也乃至昇天總是所表法則>>若望如來以智體徧周十方恒徧而無來去對現色身故此明與世成法有可倣學也此一段是如來舉自果法勸眾生修行門第二會於普光明殿此承上古德說云去菩提樹三里又云龍造此將未可也普光明殿者約所顯得普光明智所報居之殿智體廣大無限量也所報之境無限重重等周法界如經初所陳其地堅固金剛所成寶樹行列宮殿樓閣等是皆煥耀光明徧周法界此明智體報居之宅徧一切處一切處總在纖毫之內不可拘其處所以智徧觀其宅亦復徧周十方總是無限境也於此普光明殿說十信法門明以舉果成信還將智果報得宅中說本不動智佛以為信位明信自心是不動智佛約此以為信體心外有法不成信心故即如來根本智宅還信自心所有分別是如來根本普光明大智本無動故只為迷本不為動故第三會於須彌山頂上說十住表入理契智非生滅心所得至故如須彌山在大海中高八萬四千由旬非手足攀攬所及明八萬四千塵勞山住煩惱大海於一切法無思無為即煩惱海枯竭塵勞山便成一切智山煩惱海便成性海若起心思慮所有攀緣塵勞山逾高煩惱海逾深不可至其智頂明以定為方便是故法慧菩薩入方便三昧方說此法門當知亡思即智現在想即迷存滯寂智潛情虗智發此乃見道之初生佛智慧家之始約表出凡超世同天自在得智慧山之頂又以方便定止心不亂為山體故以艮為山為止此為十住位也初生佛智慧家住佛所住明依定發慧像須彌山故第四會夜摩天宮說十行此以上天空居表約智>>慧法空而為行體即處世無染又明此天名時分天明菩薩處行知根生熟時非時也不妄利生又知何惑增多何惑減少\n\n……（后文从略）\n\n**慧苑《續華嚴略疏刊定記》**（1000 字·程序抽取·句界截断）：\n\n> 離世間品中十種清淨施果故。彼云菩薩安住此法。則得如來無上清淨廣大施。二是彼後文十種捨無量果故。彼云若菩薩安住此法。則得如來無上廣大清淨捨。四中三義。一非劣願。二得佛解脫。三得正後二智。或唯後得。五中三義。一能無盡施。二入佛福智。六證佛智有二義。一超劣。二自在。七得佛通。八得無限智契實教理。九中利物與作生佛智緣二堪為勝田。十中。一愛佛。二勤善。三樂佛智。十一中。一無功用遊剎。二違疾遊剎。十二中。一分身通。二事佛。十三中。一得勝身。二遍遊無倦。十四中。一得大身。二速至。三任意往。四無退。十五中。一得佛威。二速通現化。十六中。行安樂行。順菩薩道。如法華安樂行品說。安樂行有四種。一者菩薩行處親近處。行處謂住忍辱柔和善順不卒卒暴。亦不驚。於法無所行觀法實相等。於親近處。謂不近國王大臣等外道文筆兇戲不律儀求聲聞四眾。不問訊。不與小女等語。不近五不男。不畜年少弟子等。二者觀一切法空如實相。乃至云。但以因緣有。從顛倒生故。說常樂觀如是法相。三者於末法中。欲說是經。住安樂行。不說人乃經過。不輕餘法師。不說他⻑短。不>>讚毀聲聞人。不生怨嫌。有問難不以小乘答。但以大乘令得一切種智。受持讀誦此經。莫懷嫉妬諂誑。勿輕罵學佛道者求其⻑短。勿惱令疑悔。於一切眾生平等說法。以順法故不多不少。乃至深愛法者。亦不為多說。四者於末世持是經者。於在家人中。生大慈心。於非菩薩人中。生大悲心。念言是人失如來方便。隨宜說法。不聞不知。乃至不解是經。我得阿耨菩提時。隨在何地。引之令住是法。具說如彼。十七中。一得普賢行。少功力疾得菩提故。二十力圓。三智慧滿。四神通具。十八證平等法乘。十九中。一普行究竟。二成佛。二十證佛所證法性。法性是所乘。智能乘故。三結。四意。並可知。二施菩薩知識中四。一牒前。二以諸下釋。三是為下結。四為令下迴向意。初中三同前可知。>>二釋中二十願。一憶持所聞教。二中。一同善善友義利。謂現當益。世出世益。離惡攝善。福德智慧。或此四對並同善友。或除世益。由菩薩於唯世益或不作故。如瑜伽菩薩地說。二攝取眾生共同善根。三中。於善友四事。一親近。二尊重。三供養。四凡所為皆隨發心。四中。一得樂欲善。二身不離善友。五中。一常值善友。二順善友教。六中。於善友心有四事。一愛樂不離。二相續。三不更樂惡友。四不曾錯誤妄失。七中二種。一捨身事。二順命事。亦忘已見事。八中三。一為友攝。二脩慈。三離惡。九中聽聞善友正法。十中三種。一與友同善行果。二與諸菩薩同行願。三成佛十力。十一中二種。一受持友說。二得友定用智通。十二中二種。一受持正法。二脩說行滿。十三中一願令乘二乘人及乘權大乘者同乘實教大乘故。由三權是積漸行無別實果。實果唯在實乘有故。言無障礙者。願彼假名菩薩等。速同乘一無[得-彳]乘。而離行布趣寂等稽滯之礙故。一切智道者。梵本云鉢也縛娑囊。此云究竟成就一切智性。其兩箇乘字。梵本中。\n\n……（后文从略）\n\n**道霈《華嚴經疏論纂要》**（805 字·程序抽取·句界截断）：\n\n> 離世間品智慧助道具中。既云隨順六堅固法。有等覺明矣。文中分二。前三品正答前問。後三品總顯深廣。今初分二。前二品明業用廣大。後一品明智慧深玄。前中亦二。初品就定明用。後品就通明用。前中分五。一序分。二請分。三示說者分。四本分。五說分。初中三。初總顯三成就。二別顯三成就。三別顯眾成就。今初。爾時世尊。在摩竭提國阿蘭若法菩提場中。○二別顯三成就。始成正覺。於普光明殿。入剎那際諸佛三昧。以一切智自神通力現如來身。清淨無礙。無所依止.無有攀緣。住奢摩他.最極寂靜。具大威德。無所染著。能令見者.悉得開悟。隨宜出興.不失於時。恒住一相。所謂無相。【疏】二分三。初約主顯時。二於普光明下。約主彰處。三入剎那下。就德顯主。於中十句。即攝二十一種功德中二十別句。總句.即前始成正覺故。(【鈔】二十一種功德。要尋升兜率品。自當曉之。然此段文.亦是古德所不能知。今以攝佛功德釋之.有如符契。智者當曉。)一入剎那際三昧者。即窮法真源。謂時之極促.名曰剎那。窮彼剎那.時相都寂。無際之際.名剎那際。即攝二句。謂二行永絕.及達無相法。若有二行.則有剎那。二行既絕.則剎那無際。由達清淨真如本無相故。所以此中特名入剎那際者。為顯將說等覺位故。菩薩地盡。唯有果累無常。生相未寂。猶名識藏。若以無間智.覺心初起。心無初相。遠離微細念故。即無剎那。若入此際.即見心性常住。名究竟覺。故云諸佛三昧。亦顯差別歷位.不離最初剎那際故。(所以此中者。有二。一總徵說意。前後歎德皆無故。菩薩地盡下。二釋剎那際。然有二釋。初以本業起信.參而釋之。菩薩地盡.是起信文。義通二處。言唯有果累無常者。即本業下卷經云。菩薩爾時住大寂門中。登大山臺。入百千三昧。證佛儀用。唯有果累無常。生滅二心。心心無為。行過十地。解與佛同。坐佛坐處等。釋曰。果累無常生滅者。未轉依位。變易生死.名為果累。體是無常。有生滅也。言生相未寂者。即起信意。業相未亡也。猶名識藏者。亦起信意。未顯現法身故。上辨等覺尚有剎那。未至其際。若以無間下。釋成際義。剎那盡處.名之為際。故云即無剎那。亦起信文。前已曾引。若入此下。釋諸佛三昧。亦起信文。應有問言。上云菩薩地盡是等覺者。何名諸佛三昧。故引此文.成諸佛義。亦顯前來差別下。是第二義。上約合前後無際。今明後際不離初際。是窮生死之本際。)二以一切智自神通力.現如來身。\n\n……（后文从略）\n\n\n\n**法藏《華嚴經探玄記》**（1501 字·程序抽取逐字回源·句界截断）：\n\n> 離世間品十種變化等。九佛名號海者對根宜聞名號非一。如名號品。一一世界有百億萬等。十佛壽量海者應機脩短虧盈萬差略有十位。如壽命品說。上來果問竟。第二因問中五句。初一句總下四句別。一明十住初發心住等。二即十行中十度行也。三願者即十迴向大願也。四智慧藏者即十地中以智為性。含攝蘊積故。如下地品菩薩同名藏等是也。第三結請中唯願慈悲者。明佛有說因不疲倦故。方便者顯佛巧說令易解。故由悲發心由巧得解。二頌中為顯奇故。不以常口說。表依正無礙故供具中說。即是下剎說耳。九頌分二。初三歎德請。後六舉法請。前中初二歎佛請。明具說因故。後一歎眾請。明具說緣故。前中初一顯佛自德圓。初半辨因盡過去現果無功。後半用窮來際無思普應。雲者灑法雨故潤機緣故自無本故。後一明外化備。謂初半令滅惡生善。後半令離苦得樂。又初令得涅槃。後令得菩提。二無量下明歎眾請中。一心者心無異念故。合掌者身無慢怠故。觀最勝者住念向佛故。下半總舉所念願佛開闡。第二舉法請中分三。初三頌舉前初十句。於中初一頌內有六句。一地。二境。三持。四智。五力。六無畏。下句結請。次一頌中有三句。一定。二行三自在即神力是也。下句請說。後一頌頌勝法。亦是示現菩提等可知。第二一頌頌第二十句。以三業不離六根>>故同頌也。第三二頌頌第三十句。初頌內有五海。後頌中有二海。餘三海及因問總攝故云無量無邊等。下句結請。第二答相中古來諸德亦有將此諸問配下諸會中答之。此判恐謬。以第二會等自別有問別有答故。四番問答不交雜故。是故總於此品竝通答也。以下說分具果因二說故。就此文中⻑分有十一面光集眾分二毫光示法分三法主入定分四諸佛加持分五大眾同請分六定中略說分七起定成益分八毛光讚德分九許說令喜分十正陳法海分。初中二。先放光後集眾。前中亦二。先身光遍覺。二光語呼召。此二亦即答上佛光明音聲問。初中亦二。先此光照彼。二諸菩薩下尋光見此。前中有五。初知念者領疑也。以將欲答故即放光所因也。二明光出處。面門者諸德有三釋。一云是口。一云是面之正容非別口也。光統師云。鼻下口上中間是也。准下施鼻文亦如所說。今釋依梵語稱面及口并門悉名目佉。是故翻此目佉為面門也。故知此中通舉其事。口者為表教道遐被也。面者正對向機也。門者開法攝生也。齒者勝用也。謂思咀法味故。治碎惑障故。以緣起具德相差別故。云一一各放>>塵數光也。三別顯所出有十門。通論一一皆通三世間等。別明初六佛海。次二器海。次一眾生海。後一法界方便海。又前八意業記說輪。次一身業神通輪。後一語業正教輪。四攝眷屬。五所照處。此中放光有四意。一現相表實。二驚起信心。三照觸救苦。四為集眾遠召。是故彼眾依光覩此知所集處。頌中九偈半。有四義。初六頌半通舉佛德以勸往。次一別明能說以勸詣。次一別標所說以勸觀。後一通結佛德顯深廣。此四皆以後釋前思之可見。初中二。先舉德。後人尊下勸往。前中三。初二身業。一體一用。次二意業。一用一體。後一語業。勸中初半勸為法。次半勸多眾。次半教興供。雖圓音頓說九世願海。然不壞本法故非一念也。即標下所說法門也。餘文可知。第二集眾中先明諸會有四義。一有無。二來處遠近。三本處名等不同。四偈歎及前後。初中六七二會無。以證位及行熟俱皆離相故。餘六皆有。所為可知。凡集新眾有四意。一為攝機。二為證法。三為興供。四明眾圓。第二遠近者初二十剎塵。三百。四千。五萬。以寄位漸增故。八過不可說者顯證法深故。第三者一處二佛三菩薩四供多少竝隨會應知。第四者初二會無偈讚。以起修始故。餘四皆有。以顯法位增故。又前五定前集。以從修入證故。第八定後集。以依證起用故。>>二釋文中有二。⻑行偈頌。初中亦二。先眾集。二顯德。初中亦二。先集後結。初中十方即為十段。一一方皆有七。一器海名。二剎名十二佛國土等。此二是所依法相。但通別為異。三佛名。四菩薩。此二是能入智。但滿分為異。五主伴俱來。明具德圓滿。六興供供佛順益義。謂因順果也。七依本方坐。明攝散歸靜。何故先辨東方。謂顯開明之始故。順彼方故。以⻄域方儀以東為上故。其堂殿皆面向東。如祇洹寺菩提寺皆面向東。如來說法亦多分面向東。故面門光出正即向東。問下文此華藏界無邊。云何此中有東等耶。答以華藏界是邊無邊不二故名無邊。如下說。無邊邊不二故名有邊。\n\n……（后文从略）\n\n**道霈《華嚴經疏論纂要》·第二窗**（1200 字·程序抽取逐字回源·句界截断）：\n\n> 離世間品十十所明。後如是等下。總結不見。○第三不見所由者。然皆廢本從迹。以顯一乘因果。不共深玄。篤諸後學。令習因種。文中二。先徵後釋。徵意云。身廁祇園。目對尊會。而莫覩神變。其故何耶。後釋意云。彼境殊勝。宿因現緣。並皆闕故。其猶日月麗天.盲者不覩。雷霆震地.聾者不聞。道契則隣。不在身近故。菩薩自遠而至。聲聞在會不知。文自廣釋。分為三別。初法。次喻。後徵以結成。今初分二。先明闕宿因故。後明闕現緣故。今初。何以故。以善根不同故。【疏】分四。初一總標大小善差。二舉劣異勝。三舉勝揀劣。四結不見聞。今初。有小善根.得廁嘉會。大小善異.不覩希奇。本不修習見佛自在善根故。本不讚說十方世界一切佛剎清淨功德故。本不稱歎諸佛世尊種種神變故。本不於生死流轉之中發阿耨多羅三藐三菩提心故。本不令他住菩提心故。本不能令如來種性不斷絕故。本不攝受諸眾生故。本不勸他修習菩薩波羅蜜故。本在生死流轉之時.不勸眾生求於最勝大智眼故。本不修習生一切智諸善根故。本不成就如來出世諸善根故。本不得嚴淨佛剎神通智故。【疏】二本不修下。舉劣異勝。有十八句。前十二句。釋不見佛果之因。後六句。釋不見菩薩之因。前中初句總。餘句別。由不讚等。即是不集見佛自在善根。於中二。初二句不讚果故。後九句不修因故。於中亦二。前五句闕自分行。後四句闕勝進行。亦是前明狹心。後顯劣心。故不能見。本不得諸菩薩眼所知境故。本不求超出世間不共菩提諸善根故。本不發一切菩薩諸大願故。本不從如來加被之所生故。本不知諸法如幻。菩薩如夢故。本不得諸大菩薩廣大歡喜故。【疏】二釋不見菩薩所因。一不見十眼所見無礙法界。二闕無障礙智之因。若但修真常離念。即共二乘菩提之善。法華遊戲神通。即聞而不樂。此中樂而不聞。餘可思之。(【鈔】法華遊戲神通等者。舉法華揀異。亦是通妨。今云揀異者。即法華信解品。四大聲聞自敘云。世尊往昔說法既久。我時在座。身體疲懈。但念空無相無作。於菩薩法。遊戲神通。淨佛國土。成就眾生。心不喜樂。即聞而不樂也。下偈兼出不樂所以。云一切諸法。皆悉空寂。無生無滅。無大無小。無漏無為。如是思惟。不生喜樂。釋曰。既了無生。故不喜樂。是以結云。勿滯寂故。八地云。諸法真常離心念。二乘於此亦能得也。言通妨者。此何令其不聞。彼何令其得聞。此義至下釋之。)既本因中不修不見。願諸後學。修見佛因。勿滯冥寂。如是皆是普賢菩薩智眼境界。不與一切二乘所共。【疏】第三舉勝揀劣。言如是等者。指前佛神通等所不見法。普賢智境.即是舉勝。不共二乘.名為揀劣。以是因緣。諸大聲聞不能見。不能知。不能聞。不能入。不能得。不能念。不能觀察。不能籌量。不能思惟。不能分別。是故雖在逝多林中。不見如來諸大神變。【疏】第四結不見聞。以前闕因。境勝因緣。故不能見。於中初後總明。中十別顯。謂眼不見。心不知。耳不聞。本有不證。新成不獲。無方便不能念觀。無後得不能籌量淺深。思惟旨趣。分別事理。○第二明闕現緣故不見中三。初明無勝德行故不見。次明住自乘解脫故不見。後結成不見。今初。復次諸大聲聞。無如是善根故。無如是智眼故。無如是三昧故。無如是解脫故。無如是神通故。無如是威德故。無如是勢力故。無如是自在故。無如是住處故。無如是境界故。是故於此不能知。不能見。不能入。不能證。不能住。不能解。不能觀察。不能忍受。不能趣向。不能遊履。又亦不能廣為他人開闡解說。稱揚示現。引導勸進。令其趣向。令其修習。令其安住。令其證入。【疏】分二。先十句明無勝德行。即是前所不見境。\n\n……（后文从略）\n\n**智俨《華嚴經搜玄分齊通智方軌》（T1732·二祖早期疏释）**（1005 字·程序抽取逐字回源·句界截断）：\n\n> 離世間品第三十三解行法相動靜無礙此會成也。四門同上。>>一釋名者。離者行體淨義也。世間者所離之法。世者時。聞者中。但在時中者名世間也。二來意者有二。一辨教興會來由。此下第三依緣修行成德分。所以來者。上既得法。次須依法就緣使修成行德故也。故下二品文中皆有勸辭。故知二品來者。前聖性現前。欲得不與凡共分齊故次來也。三宗者分別有二。一約人。人有正助。二人各有體相用。問此人與下知識人何異。答此是能宣教人。下知識是教所詮法人也准取之。二約法。法謂行法。即一乘道品也。三乘及小乘名數雖同三十七而意異也。廣如諸經。一乘之行學亦有始。若依定學明始分齊者。若約迴心人即用非至定及初禪定等為學始。若據直進人。即用光得意言定為初學始。若約一乘不共教。據行即寂靜勝三昧為初學始。若約行解即華嚴定為初學始。若約行位即十行位定為初學始。若約人知識軌則用師子奮迅定為初學始。若約解信等即用淨藏定等為初學始。若約正解用性起法門為初學始。若約解位即十解位定為初學始。此等約歸向本實為言。頓悟人意言無分別定為初也。餘可准知耳。四釋文者此下有二分。初品明託法進修分。二入法界下明依人入證>>分。問何故對法不明入證。下約人方始入證。答法是所依。善巧由智。若不依善達機儀勝人。雖自有法未可得證也。故經云知識全梵行也。問上來法及此成行並無聲聞。下法界知識即通辨聲聞何也。答上法是頓。此行亦頓。為此無聲聞。下法界中有二意。一為人有勝巧。引小成大。為明人德故說小也。二顯法界發心始通二迴故。此二品何故分二處說。答祇桓重閣攝化之始。普光堂起行之初故也。故上來明菩薩起行發於普光。下明文殊教化起於重閣也。所以知。此重會別本云乃能重啟斯義問故知也。此文有七。初序。次入定。三起。四請。五爾時普賢告下正說。六品末證成。七偈頌。初文有四。初時。二佛。三處。四同聞眾。處中有二。初辨處。二依處成佛德。何故於此歎德。以因果淳熟功歸化主故也。又行相可責故。德文有三。初總辨。二自分行。三能與一切下利他行。四同聞有二。初總列數歎德此初文有四。初舉俱。二略歎德有二。初練始異終。二練新異舊。三具足成就下別歎德。四具足如是下結。三別歎德中有二。初自分德。二於一念中下他分德。自分中初自利。二善攝眾生下利他。第二列名歎德中有二。初列名。此略列。所以此文菩薩名同普者。為行體順理成無異相故也。次歎德中有四初總。二隨諸世下攝法為首行。三悉能受持下護持正法行。四隨諸下示成大事行。二入定中有三。初入定。二>>列名。三明定力。所以此名華嚴定。表行嚴果故。三明起定同前可知。四請問中所以獨普慧為法先問。彰今但以慧導行也。復顯機廣大故。但慧發於體。故普慧略問二 修成行分，表示發起修行的圓融，在此一會中收因和果，表示成就修行不離普光明的智慧。就人而言，稱為普慧、普賢問答的一會。就品的名稱而論，〈離世間品〉，就事相而言，有二個世間，一個器世間，山河大地，表示依報；一個為有情世間，表示正報。就粗細而言，一為有為世間，有分段生死；一為無為世間，表示變易生死。就染淨而言，所謂「離」，一為性離，表示世間性空，即是出世間；二明事離，表示修行成滿而無染垢。就階位而言，凡夫尚處染垢而非離，二乘人雖離開塵垢但未完全到達真如；菩薩具備真正離開塵垢，而有真正的修行，可稱得上離，但還未到達究竟；唯有到達開悟的佛才能稱為離。《法身經》記載：佛常在世間而不染世法不分別世間敬禮無所觀。\n\n**新加坡華嚴禪寺《網路白話華嚴經淺釋》·六位判攝與等覺三義**（225 字·限量引用·句界截断·来源：hgs.sg 在线文本·釋法欣 整理）：\n\n> 普慧菩薩開始的這段經文科判上屬於請分。初開始是標出問的意思，佛子下，正示開問。經文初顯示當機眾已聚集，說法的時機已到，將經文要問的問題內容依修行階位製表如下：表中有六種階位，但常說十信不入位，而以十行為開始的修行階位，以普賢行總括六位，在〈度世經〉記載：唯願解脫諸菩薩行，從始至終，令無疑。此《華嚴經》及《瓔珞本業經》等判於六位，皆以信未入位，十住為首，指三賢，十聖，等，妙覺。等覺的階位有三種意義：或攝屬前，是十地的勝進位；或攝屬後，即稱為佛；或別開位，在無垢地。在經文最後的五十一句，只有後四句屬於妙覺位，其餘都是等覺位。\n### 5.3 海云《勘玄記04》講記選段（全程等距十段＋六区选段八段＋八位分释八段）\n\n（勘玄记04 讲记主带 P76-369 共 106,894 字；全书六区结构＝序篇 P14-62·绪论 P52-63·正说经首 P76-79·二百问与答组细释 P74-294·偈颂结构 P295-343·结论 P343-369；此为全程十二等分之十段取样＋六区选段八段（序篇2·绪论2·经首·二百问·偈颂·结论）＋八位分释八段·覆盖序篇源流至八位答组细释与结劝——完整逐段入文待后续批·OCR 字准约 90-95%·引前须对原书核）\n\n**〔导读〕勘玄记04 阅读路径与关键判读**（据 OCR 提取本·页码为 PDF 页）\n\n- **六区与读序**：序篇 P14-62（普贤四乘行法·19,110 字）→ 绪论 P52-63（三番六位因果·3,623 字）→ 正说经首 P76-79（无极佛·因陀罗网太极佛·4,489 字）→ 二百问＋答组细释 P74-294（75,051 字）→ 偈颂 P295-343（21,026 字）→ 结论 P343-369（11,356 字）。〔本文判断：初读可先经首、次二百问与八位选段，序篇、绪论留作回读；欲通读则依原书序次。〕\n- **普贤乘**：海云判《华严》行法为「普贤乘」，谓《离世间品》为「再转」之法轮、「普贤乘行法」之直接具体化（P96）；并谓「普贤行法即是华严行法，普贤行者即是华严行者」（P84·OCR 有残误）。\n- **八位与六位**：经文具「八位行法」，与「古典华严」通称的「六位行法」及《度世品经》六段分法有别；海云以此判「大乘」转「普贤乘」之思想变化（结论区 P343-350）。\n- **五段修法**：以「五段修法」（象限转移·镜观）为普贤乘独门工夫，谓八位行法「位位皆有五段行法」，故〈普贤行愿品〉十大愿王「愿愿亦皆五段修法」（P309-329）。\n- **新创名相**：「无极佛／太极佛」（经首章 P76-79）、「具格法身／无极法身」（P275-278）、「位前普贤／位中普贤／位后普贤」（P275-278·P309）——海云自标其中「同属新创」者，引用宜并读原书。\n- **三身佛＝体相用**：结论以「法身佛为体、报身佛为用、化身佛为相」总收，并判「等觉—妙觉—圆觉」三段落皆属等觉位之开展（P343-356）。\n\n**段3·勘玄记04 PDF 页 124 起**（670 字·程序抽取·OCR 字准约 90-95%·引前须对原书核）：\n\n> 亦是法界生命本質的確立,此下十二法則明列靈性存在的十二項特質。五、十種波羅蜜:此為具足如來無上大智波羅蜜之因。六、十種智隨覺:此為得一切法自在光明,所願皆滿。能於一念頃解了一切佛法,成等正覺之因。七、十種證知:此乃得如來一切法無上善巧方便之前行。八、十種力:此乃如來無上殊勝智力之前行。九、十種平等:此乃一切諸佛無上平等法之基本架構。十、十種佛法實義句:此為一切智智無上真實義的基本結構。十一、十種說法:此乃如來無上巧說法的根本因。十二、十種持:此為如來無上大智住持力之根本因。三、十種辯才:此為如來無上巧辯才因。十四、十種自在:此乃如來無上大智自在之主因。十五、十 至一到五世紀,是佛教史自印度轉入西域的變化時期,其中詳情尚有待學者進一步研究。換言之,即佛教思想的舞台,已由印度轉進西域了。而此一時期的西域文明是以佛教文明為核心,此一歷史被人類遺忘了一一樓蘭古國、高昌古國、敦克爾孜石窟的遺盅,乃至文獻記載中西域之繁榮與昌盛,歷歷昭昭,可見此一歷史文化的時空上背景不容忽視。二、佛教思想離開印度進入西域,正是大乘勃發的時期,此時的思想開放(佛教思想走出原始教義的時刻)是為主觀因素,而在異地發展新的思惟及思考方向,更促進原有的開放思想,此則為客觀因素。在主、客觀因素的相乘效果上,大乘思想更為燦爛,因此各項綜合式的學說乃相繼而生,於此思想環境下,遂對佛教思想的形成發展與走向,起了一定的影響,進而形塑了西域佛教的思想模式,從而在傳入中國之後進一步成熟而成為典型的中國佛教。\n\n……（后文从略）\n**海云继梦《勘玄記04》·序篇·六位·七位·八位行法之演進**（P24-26 · 635 字·程序抽取·OCR 字准约 90-95%·引前须对原书核）：\n\n> 《度世品經》的「六位行法」是「古典華嚴行法說」的第一說,故第一段被判為「十信位」,而將等覺與妙覺位合併為「等妙位」。今去〈離世間品》,從思想的成熟與演化的過程看,《離世間品的!方法論」在《大經》的分類上可稱為|第二番遍明行法因果」,但不宜再稱為第二番遍明「六位」行法因果,因為「大人位」及「妙覺位」已屬「事事無礙法界」的範圍,而將「大人位」列為「第六位」之雙滬行仍可視為第六位,而果行之妙覺乃純「事事無礙」,必須另立一位。茲將上述「六位行法說」重理一番如下表:四的昧之資糧道、前人|全站有以信位之出離果為基礎,2生是日四Ha日as唔四RE處、界、緣起等)即'所」起行(“能」隨境起用)《離世間品》中的此「七位行法說」才能完整表達《華嚴經》中的全盤行法概念,或稱為「普賢乘」行法的全貌,茲逐一分數端說明:第一侵”三段汀法井熱一、出離道在十信位攝,其中初信位即初果位,七信、ˋ九信為阿羅漢位,十信位為轉'以一切智引導身語意」而入「法界」。二、菩薩道在十行位中攝,此乃「真若薩」也,非應酬語中的稱調,而是能以行德化眾生,故稱'覺有情」也,有「能」有「所」之謂也。三、普賢道在大人位中攝,此普賢道居「無功用行」,允非常放逸天之修行陷阱狀態,而是真正的普賢行者。不但能將「能、所」合一,乃至雙江、無作而作,此普臣行願力已成為'行者」之生命因素了。第二人節七伎沂法今三一、前行之出離道一一正法行之次第二、五段行法之普賢行一一普賢行之特殊三、「事事無礙」之果行階段一一形而上的行法(本書暫略,將另關專書論述此三階段行法才是《華嚴經》行法的全盤狀態,能徹底說明「法界」中「真理」存在及「真理」運行的上、下迴向,以及下迴向中如何返元到形而上「本體界」,乃至本體界總相在世間的存在與活動狀態,茲分述如次又攻爸「撕殺耳」角〈拘加看難〉喜二芍克自剖苗圖茹汗之出離道一一正法汗的次第「出離道」\n\n……（后文从略）\n**海云继梦《勘玄記04》·緒論·九會入定與三賢十聖位之三昧別**（P52-54 · 649 字·程序抽取·OCR 字准约 90-95%·引前须对原书核）：\n\n> 五會:十向,金剛憶入菩薩智光三昧六會:十地,金剛藏入菩薩大智慧光明三昧七會:等、妙,如來入譚那除三昧八會:普賢入佛華嚴三昧九會:如來入師子頻申三昧「三昧」帥「三摩地」,華言「正定」。所謂正定乃「真人的生活境界」,然此境甚廣,極致可鯛法界,故有種種三昧,乃約類以別。今此九會亦約類以別,重點在三賢十聖位之三昧別:初貢位:稱無量方便三昧中貢位:稱善思惟三昧上四位:稱智光三昧登地位:稱大智光三昧「初賢位」為人法界之工程面建設,旨在全面性地觸及法界存在之實況,故居無量方便之立場。「中賢位」乃和人法界「能」的成長,此「能」是「以一切智引導身口意」而達到「止於至善」。此觸及法界全域之「能」並非一切智,而是以此般若之一切智故,在引導身口意業遊於法界。然此法界中「能、所」存在中的「能」,則是一切智引導身口意業遊於法界後,所生之「能」。此「能」刀是「普賢行願力」,以為培養此「能」之基礎,故和善思惟三昧,善思惟用以培養並出生普賢行願力也。「上賢」及「登地」之三昧名「智光」及「大智光」,則更是普臣行願力的成熟與妙用展現之說明也。十行位之行法有其一定之行法程式,然此乃正定之行、法界之行,不同於解脫道之技術面。解脫道的技術面乃在參禪金三角與覺性之作用,其他如色身之淨化,乃至心意識之規範皆屬工程面,意在掃除生命中之雜質。而今,正定之行的技術面乃在以波羅蜜為媒介,而波羅蜜必以法界之前提人為依託,若不達法界之邊際即不能希盡法界,又何以稱波羅蜜為耶?而於無量波羅蜜中,此方仍以「十波羅蜜」為藍本,此十行位則以前四為具體之行法媒介,後六皆以成就境而言,足見 此聖境?此一「法界地」始從「初發心住」逮至「法雲地」皆同一法界也。故其要件必先再重述一遍一者、具「解脫乘」標準:即具有十信滿心,證果羅漢以上之資格條件,為充分條件。此非一般自以為是的認為,而是具有漏盡通之阿羅漢,故不可自以為是的一廂情願,行者宜自勉之。二者、具「普賢勝」基因:即具有普賢乘」之「普賢心」及「普賢行法」之基本素養,此一必要條件乃自入宗門起即須培養的三要件:1.人格性健全;2.處眾生戒圓滿;3.自淨戒深化。此三要件為自事相上要求,而經中二十二法信位,為理上之標準。一為自實務基礎上真下功夫,為實踐之執行面;一為理論上之指導,為工程面。換言之,理論面需有實際執行之驗證,而執行面亦需有理論上之指導與勘驗,兩相吻合,方符'理事圓融無礙」之基本命題。所以,除了解脫道之定功外,「普賢乘」的基因,實是正定之三昧前提;若行者初涉本宗之門,不與此一要求,霄至入禪定」才要求三昧中的「能、所」要件,則行者必落禪定坑,而無法啟動「三昧耶」之要件,鏡觀與壁觀之實踐必有困難,因而入定之後,欲起觀境,是有障礙也。亦因此而無法入正定,又如何行於法界之中,勢在紅塵中運識性以解說,是乃知解之徒,非是大乘「一乘」\n\n……（后文从略）\n\n**海云继梦《勘玄記04》·行位三十法：法界力之四相**（P139-141 · 620 字·程序抽取·OCR 字准约 90-95%·引前须对原书核）：\n\n> 行位三十法大分為四:第一、法界力的本質四法第二、法界力的作用相有九法第三、法界力的具足相有十三法第四、法界力的圓滿相有四法行位乃約「能」而言,自文字相上言類似「行法」,尤以第一番遍明因果中為然;而於此品中,靜靜的位說「法界存在」中生命的存在與「法界生活」之狀漾時,不禁讓人感到佛法中的基本界線是多麼的明確,絲毫紊亂不得。在《華嚴經》誕生的國度中(西域)是一個分工明確的綠洲國度,因此,想要進入[法界」來進行「法界行」並不難,只要具備基本條件就可以了。然而,在法界行之前,「法界生命」的特質即此三賢位,此三分是「法身大士」的實習以及檢驗的標準,先測「法界生命」,再測「法界力」,然後才是「法界行」的「前行」實習,今去「行位三十法」。四十旦扣沾歡果喜三第莫匝三.背半人(一)有十種深入佛法:一、入過去世一切世界。二、入未來世一切世界。三、入現在世世界數、世界行、世界說、世界清淨。四、入一切世界種種性。五、入一切眾生種種業報。六、入一切菩薩種種行。七、知過去一切佛次第。八、知未來一切佛次第。九、知現在十方虛空法界等一切諸佛國土眾會說法調伏。十、知世間法、聲聞法、獨覺法、菩薩法、如來法,雖知諸法皆無分別,而說種種法悉入法界,無所入故,如其法說無所取著。]各全(了四、五三)有十種發無畏心:、滅一切障礙業發無畏心。、於佛滅後護持正法發無畏心。、降服一切魔發無畏心。不惜身命發無畏心。、挫破一切外道邪論發無畏心。、令一切眾生歡喜發無畏心。、令一切眾生皆悉歡喜發無畏心。、調伏一切天龍八部發無加心。、離二乘地入甚深法發無畏心。、於長劫行菩薩行心無疲厭,發無畏心。(四)有發十種無疑惑心,於一切佛法心無疑惑:、以六度四無量心攝一切眾生無疑。、承事供養未來一切諸佛無疑。、以種種妙實莊嚴一切世界無疑。\n\n……（后文从略）\n\n**海云继梦《勘玄記04》·向位二十八法：能所合一**（P207-208 · 632 字·程序抽取·OCR 字准约 90-95%·引前须对原书核）：\n\n> 而此迴向位正是將此法身所應具備之「能」與「所」的條件「合而為一」,術語通稱「能所合一」,此「合」實為此三段:第一段十法'在陳述融合之狀態,可謂氣勢如虹。第二段十一法,實為十法,在陳述法身存在的十個活動,面面自在無礙的作用。第三段七法,言法身的自身相。此三段法雖雲「迴向位」,其實是住、行、向「三賢位」的綜合版。換言之,前住、行位乃分解之說明,也就是分解動作的說明;而此迴向位則是綜合運用的說明,雖雲綜合,仍不離「能」與「所」也。「信位」與「迴向位」之間,有「一層相似、一層異」,心說成旋.其一、「信位」是在「普賢乘」的資糧位上,其定義是指要「人法界證法身」前,必先具備之要件;而「入法界」之後又將如何,此位向不提及。然,「人和人法界」前要有的條件,在「入法界」後就已經產生轉變,而變成另一在「法界」中的執行要件,是故「人和法界」前所要的是一種別邪正的能力。易言之,法界生命與識性生命之間的主要差異是什麼?一個已發心的行者,要如何棄識性結構的生命,而架構法界生命的成立?這就是信位中的「菩薩人生」。其二、「迴向位」是指「普賢乘」中的「具格普賢」,或可稱為「具位普賢」,亦妤是已具備法界中「普皿乘」資格的「普賢行者」,他是已具法身的法界人。其實,在住、行、向三位中人皆可屬「具格普賢」,其已人法界,只是將「具權十膩所潤癌暴喜三第他匝王.帳半今格普賢」分三階次來介紹而已。而此「能」朗行位中介紹,「所」人九住位中介紹,「能所合一」妤指法身具足之狀態。何以在〈離世間品》中,《華嚴經”要如此繁複的介紹法身的具格條件?此一理論恐怕是人類史上唯一的紀錄一一法身存在的具格條件,此一紀錄更說明(由果向因看),行者欲人法界,於三昧的養成中,何以獨重「鏡觀」中的「能所合一」,乃至於是「真能」與「真所」之合一,為正定之要件,實乃因地正、果殊勝之原委也。此旋華嚴禪觀中一再強調「鏡觀」\n\n……（后文从略）\n\n**海云继梦《勘玄記04》·七地位三十法：登地位為法身正行**（P209-211 · 623 字·程序抽取·OCR 字准约 90-95%·引前须对原书核）：\n\n> 第六節迷地位三十法「登地位」的行法為法身大士的正行規範。登地位為初地到七地,是依於「六位行法」中,初地至七地為「有功用行」,而八地以去為「無功用行」,故將七地以前列為「登地位」,八地以去分為[大人位」。「登地位」屬和人太極佛的位次之行,故稱為法身之正行,以行入太極之境也。若依邏輯等次,太極佛為七地位,實則太極佛具有初地至七地之一切功德耶,是故「太極境」為登地位之總稱也。「登地位」雖緣自「六位行法」,卻沒緣自六位行法樺才業您嘎若暴加三第他旭和王.敵剖全中的「七菩提分行」,《大華嚴經》中的此等語言及思惟模式是一大特色。由方方面面來切人,卻又互相連繫成一有機之思想網絡,而非一再地重覆或互不相和干,朗使第三番行法中的無量法亦如是。此番「登地位行法」三十法中分三段,雖亦可將七菩提分隱為七段三十法,然已非重點,重點在此三十法中的第一段第一、二法之「身業」與「身」,以及迴向位中的最後兩法,「業」與「身」有著相互勾索的關係。其中「何等為身?」一法,於「三位行法」(即向位、登地位及大人位)中各出現一次,然此「三身」分列「法身」(妤向位之身)之成立因緣(或稱因素)、「太極佛身」(分登地位之身)的成立因緣,乃至「無極佛身」(翁大人位之身)的成立因緣,此「三身」頻頻出現又擠在一起,非無因緣也。皆在說明此三位次的本質上其各所具備之因素,皆約本體而論。而「登地位」與「迴向位」的銜接,亦有其本質上之意義。妤迴向位言至法身本體的成立與具格以後(妤當下),即進行其法身之動也,此「動」即是「太極佛」中的登地之行。然此行即以「身語意業」之行而明示之,是為登地位中的初段十法。(一)有十種身業:一、一身充滿一切世界身業。二、於一切眾生前悉能示現身業。三、於一切趣悉能受生身業。四、遊行一切世界身業。五、往詣一切諸佛眾會身業。\n\n……（后文从略）\n\n**海云继梦《勘玄記04》·大人位二十法：體、相、用四段**（P231-233 · 630 字·程序抽取·OCR 字准约 90-95%·引前须对原书核）：\n\n> 第七朗大人位二十法「大人位」在理論上是從「六位行法」中的「有無功用行位」列出,妤第八地的不動地、第九地的法師位,以及第十地的授職位,此三地合稱「大人位」。其本質上是已得形而上本體界無極佛之本體,所以在「八位行法」的二十法當中,其第一段八法為內本體,第二段六法為外本體,第三段行住坐臥四法為「用」本體,第四段住處、行處二法為「相」本體。此中自「迴向位」以來三位,皆提及法身的本體,即普慧所問的「何等為身」?而普賢所答的三種法身皆有不同,茲略示如下:權才業息中區暴車三第地軸王.周半今|(一)有十種足:一、持戒足,殊勝大願悉成滿故。進足,集一切菩提分法不退'隨眾生欲令歡喜故。\"不離一佛剎往一切佛|,'願求一切殊勝法故。六、堅苟足,一切所作成究竟故。七、隨順足,不違一切尊者教故。'聞持一切佛所說法不\"為眾演說無怯弱故。十、修行足,一切諸唄悉遠離故。(二)有十種手:一、深信手,於佛所說一向恐可究竟受持故。二、布施手,有來求者隨其所欲皆令充滿故。和殼3和舒展右掌相迎引四、當五、$導舉,,授與眾生拔出欲|,;集眾福德無疲厭悉斷一切眾生疑|,'四暴流中救溺眾,所有妙法悉以開以智慧藥滅身心下衣圭科績衝,開法光明破煩惱暗故。九、站(三)有十種腹一王血=一PvP、離詭曲腹,心清淨故。、離幻偽腹,性質直故。、不虛假腹,無險度故。、無欺奪腹,於一切物無所貪故。、斷煩惱腹,具智慧故。、清淨心腹,離諸惡故。、觀察飲食腹,念如實法故。、觀察無作腹,覺悟緣起故。、覺悟一切出離道腹,善成熟深2oe、遠離一切邊見垢腹,令一切眾生得入佛腹故。(四)有十種藏:、不斷佛種是菩薩藏,開示佛法無量威德故。、增長法種是菩薩藏,出生智慧廣大光明故。、住持僧種是菩薩藏,令其得入不退法輪故。、覺悟正定眾生是菩薩藏,善隨其時不嗡一念故。、究竟成熟不定眾生是菩薩藏,令因相續無有間斷故。\n\n……（后文从略）\n\n**海云继梦《勘玄記04》·等覺位三十二法：等、妙之設**（P245-247 · 657 字·程序抽取·OCR 字准约 90-95%·引前须对原书核）：\n\n> 第八節等覺位三十二法[等覺位」與「妙等覺位」的設置乃至稱呼,是有別於小乘教中「佛果位」與「阿羅漢位」之區別,然小乘教中認為「成佛」果位為一終點的修行概念,並不為大乘教乃至一權老畢無趾區暴車三第季回和王.關半念乘教之認同。「同教三乘」與「別教一乘」之間的見解杰有差異,但皆不認同「佛果位」的設立,故皆用等覺、妙覺位。[成佛」果位為終極目標的修行概念,之所以不能成立的原因是「成佛」入涅槃之後,無法處理並詮釋「成佛」之後的淵槃境界,若無法交待,則「成佛」就是虛設的勾當。所以,「別教一乘」不認同「成佛之道」的說法,而改用等覺、妙覺位的說法,此中有兩部分理論必須先闊清:一、法界中的法身是處於涅槃境,而此涅槃境從何處起?至於何方?二、「等覺」為行者的終極目標',而「妙覺」只是隨緣示現,示現成佛後,入涅租,又回等覺位,所以《法華經》稱「釋名在婆婆已成佛八千軟」,即此之謂也。首先帥是「涅槃境有多寬廣」?「淵槃境」就是所謂「生命的故鄉」。要返回「生命的故鄉」,就是經由「參禪金三角」產生「象限轉移」,而人「彌勒內院!,並經彌勒內院的熟成而入法界。此「法界」即是「淵槃境」,故雲:「返回生命的故鄉就是證人淵槃」,此帥有餘依淵槃。自此起即屬淵槃境的起點。自此起點,經十住、十行、十迴向、登地,到等覺,而人「!無餘依淵槃」。等覺為「無餘依淵槃」起用的部分,此「用」即隨緣示現、顯相,以成妙覺,怒世人所謂「八相成道」之佛位。然佛顯相,緣畫之後入滅,還是回到等覺位,所以這個生命故鄉是如此的寬廣,不增不減、無淨無垢,純然自在的出和人。故又稱:[不住三界、不出三界、不入三界」,亦稱「不來不去、不生不滅」。這些詞彙都不是枯澀的、空泛的說詞,而是一種真實存在的描述,這也是真實生命的寫照與定義。此即證:何以稱「婆婆的一切皆虛幻,唯涅槃境之法界為真實」的原因,所以,涅槃中的生命是永恆的、恆動的、燦爛又芬芳的,此乃姿婆慮幻生命所無法想像的。\n\n……（后文从略）\n\n**海云继梦《勘玄記04》·妙覺位十九法：八位行法總疏理**（P275-276 · 626 字·程序抽取·OCR 字准约 90-95%·引前须对原书核）：\n\n> 妙覺位十九法在進入「妙覺」的個別分析之前,有對八位行法作全面疏理之必要。首先,「[八位行法」可分兩部分,帥「具格法身」與「無極法身」兩部分,茲逐一分析如下:一、具格法身具格法身位的狹義定義為第十迴向位,而廣義的通稱則為「三賢位」,故具格法身又稱為位前普賢。此三賢位為「法王子」的資格,故稱「法身大士」,而信位則屬三賢位的前行,故可稱為「種子位」。此位妤在毗盧淨土中熟成,「毗慮淨土」人女兜率內院,於今之當值官即是彌勒菩薩,故今世眾生多稱毗盧淨土為「彌勒內院」。何以「兜率內院」會是毗盧遮那佛之淨土耶?此議有二答:一、以經為證,即善財所參之「喲盧遮那佛大莊嚴重閣」,不就直接說明此「大莊嚴重閣」即是毗盧遮那佛之淨土嗎?只是世人重'法身」之彌勒而忽略了法界」之淨土。二、「兜率」為紅塵之識性世界,“內院」為出塵之根性世相才昌租尖草暴加三第他旭王.過吝全界與智慧世界,所以菩提種子是在此淨土中熟成的,職是之故有三:1.「淨土」是用以熟成菩提種子的地方,而三賢位」是菩提種子發芽後的熟成階段,故稱「入法界」,亦稱「法身大士」或「法王子」。2.「兜率」分內、外院乃法如是故,「外」則紅塵紛擾,唯能知足、反思,止息外塵之誘惑,方能覺知行道,若此而行道,則能一超直入,轉外向內,橫出三界詭!3.約行法言,居「內院」乃約「內明」,熟成、漏盡之功,故內院行者有三要件:I樓心於道不受塵擾:棲心於道內也,方可居「閣」,而不受塵擾乃外院紅塵也;而紅塵本不息也,若行者常請假外出,同非佛跳牆也。此約行者則是不論俗事、不論人事、不論己事,但論「內境」。本紅塵萬尺浪本不息也,行者欲建人間淨土,不在平息外在的紅塵,而在不受其擾。不是不涉紅塵,而是不著紅塵,而是「內境存內明」,無明雖過而不留。「無常起落頻趾門,內心如如不相應」,是為行者住內院。本約行法,居「內院」\n\n……（后文从略）\n\n### 〇之二.9 文化资产参证（名胜·造像·图绘·L.448 落位）\n\n> **体例**：图像著录体系（登记册 `lishijian_imagery.yaml`·唯一权威著录源）；授权 Commons 可核验（CC0）；**A/B/C 三分**——本批 1 件（B 类：莲华题域）；凡边界不混同。\n\n<figure style=\"margin:14px 0 20px;text-align:center\">\n<img class=\"doc-img\" src=\"https://thumb.wikimedia function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');

    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}

}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}
