      var cls = p.getAttribute ? (p.getAttribute('class')||'') : '';

  function linkify(){

})();

<script>
var ARTICLE = {"id": "huayan-lishijian-pin", "file": "articles/huayan-lishijian-pin.html", "title": "九九华严第三十八品 离世间品之拼读", "title_sub": "", "icon": "🚪", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第八会_普光明殿_离世间/华严经细读_第三十八部_离世间品.md", "doc_md": "# 华严经细读·第三十八部《离世间品》之拼读\n\n> **EN · The Chapter on Leaving the World (Transcending the Worldly)**\n\n> **底本**：八十华严 `T10n0279`。**范围：卷第五十三～五十九（離世間品第三十八·本品全文·跨七卷）**。本品属**第八会「普光明殿会」·二千行门**（传统成句；问数实测见〇之零「问数考」）。\n\n---\n\n## 〇、凡例\n\n一、底本 `T10n0279`。二、引文程序注入（0 手抄·逐字回源）。三、存疑标〔待核〕推断标〔本文判断〕。四、体量自陈：**骨架成篇**（序分＋入定＋普慧问句＋201 条名目总表＋如来赞＋结偈全引）；答组答文（约 45K CJK）＝ L.275–L.279 逐批全引预登记。五、**数目字分两层**：「二百问」为传统成句（英公偈、古注、讲记引文照录不改）；**八十本 `T10n0279` 实测 201 问、六十本 `T09n0278` 200 问**——凡编者叙述、表格、图注一律用实测数，问数考见〇之零。六、**答组表条序**：`（条 n／201）` 为名目表条序（含答中子目），非问句序号；传统「二百组二千酬」为成句——对六十本 200×10＝2,000 精确，对八十本为约称（L.487 补「有十種眼」一组）。\n\n<!-- ATLAS:BEGIN P36 -->\n### 〇之零、导读指南（阅读路径与方法）\n\n**定位：** 考证型细读（philological close reading），以「可复核性」为第一优先。本品 54,872 CJK 跨七卷（卷53–59），普慧云兴二百问（英公成句·约数；八十本实测 201 问）、普贤瓶泻二千酬（传统成句；八十本答组 201，六十本 200）——读法以**工具书**为纲：每条「条件—行相—成效」三段式；如来赞「出世間法門品」正名：离世间者，离世间之执非离世间之境。\n**本品一句：** **普慧云兴二百问〔约数·八十本实测 201〕，普贤瓶泻二千酬——行门如瓶泻，离世间不离世间而离。**\n**路径：** 〇之二（二图四表）→ 一（品题与脉络）→ 二（全文逐段）→ 四（义理与名相）→ 五（诸家会读）→ 七（数据层）→ 附录按需查阅。\n**方法：** 先经文后诠释；〔实测〕／〔本文判断〕／〔存疑待核〕三分；负面证据同样入账；结构覆盖 100%，个体择要。\n**读前三问：** ①二百余问如何读？（问数考见下）②二千行门如何检索？③「离世间」离的是什么？\n\n**【问数考】**（L.478 实测＋书目核对）古注八源一致称「二百问／二千酬」——智俨《搜玄记》「普慧略問二百句，普賢廣答二千句」；法藏《探玄记》「以略標二百問為本，廣答二千為相」；澄观《疏》「答前門二百問，問一答十……成其二千普賢勝行」，并引英公偈「雲興二百問，瓶瀉二千酬」；《演义钞》引九会礼赞「懸河二百問，瓶瀉二千酬」；李通玄《新华严经论》与《合论》「普慧菩薩有二百問」；道霈《纂要》「普慧雲興二百問，普賢瓶瀉二千酬」；海云《勘玄記04》「普慧雲興二百問」。**然「二百」为传统成句／约数**：本文实测八十本 `T10n0279` 普慧问段**问号 201 个**（较六十本多第6问「何等為心得安隱？」）；六十本 `T09n0278` 问段半角问号**恰 200 个**；两本答组：八十本随 201 问一一作答（含「心得安隱」「眼」两组），六十本 200 问／200 答；传统「二百组二千酬」为成句——对六十本 200×10＝2,000 精确，对八十本为约称。§2.4 名目表按八十本列 **201 条**（含答中子目，如无碍用十子目、道四子目），条数与问数非同一口径。**语义清点**（逐条核验，非仅计数）：八十本问段共 201 个疑问句，全部以「何等為／何故／云何／以何等故」发端；篇首「佛子！願為演說：」为祈请框架（其下第一问「何等為菩薩摩訶薩依？」计入问数），篇末「善哉！佛子！如是等法，願為演說！」为总结祈请，**不计入问数**——故 201 为语义实数，无遗漏、无重复计。\n\n## 〇之二、本品内容地图（未入其门，先观其海）\n\n> **本节体例。** 图与表之数据，一律取自本文已回源核定之 §二逐段表与 §7.1／§7.5 实测数；**凡属推断者标〔本文判断〕，不入图**。图各看一事，勿求一图而尽本品。\n\n### 〇之二.0 提要\n\n本品占**卷第五十三～五十九**，剥校勘 **CJK 54,872 字**。**长行 331 段＋偈组 1（结偈 5,238 字）**；结构：**序分（莲华藏师子座）→ 普贤入佛华庄严三昧 → 普慧问句（八十本 201／六十本 200）→ 答组十门（201 条名目）→ 如来赞（品名句）→ 结偈**。\n\n| 图 | 画什么 | 一句话 |\n|---|---|---|\n| **图 〇-1　二百问二千酬图** | 问酬结构 | 一问酬十·二问答千 |\n| **图 〇-2　行门三段式图** | 条件—行相—成效 | 安住此法，則得／則能 |\n\n**〔读法之序〕**　先观图 〇-1 以得其问（201 问与 201 条名目），次观图 〇-2 以得其式（行门三段式），次用 §2.4 总表检索（52卡全引），次读 §4 义理，末以 §7 核量。\n\n> **EN corresponding · Map of the Chapter.** Puhui asks two hundred questions (a traditional count; 201 in the 80-fascicle text); Samantabhadra answers each with ten — two thousand gates of practice — sealed as the gateway of world-transcending dharma and a closing verse urging the diamond mind.\n\n### 〇之二.1 图 〇-1　二百问二千酬图\n\n<figure>\n<svg viewBox=\"0 0 1000 220\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"26\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">普慧云兴二百问（成句）·普贤瓶泻二千酬——八十本问句实测 201（§2.3-2.4）</text>\n<rect x=\"80\" y=\"56\" width=\"260\" height=\"120\" rx=\"10\" fill=\"#f6efe1\" stroke=\"#b8863c\"/>\n<text x=\"210\" y=\"88\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"#7a5a28\">普慧菩薩</text>\n<text x=\"210\" y=\"116\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5147\">二百余问（八十本 201 问句实测）</text>\n<text x=\"210\" y=\"140\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8a7a5e\">「何等為X？云何X？何故X？」杂发</text>\n<rect x=\"660\" y=\"56\" width=\"260\" height=\"120\" rx=\"10\" fill=\"none\" stroke=\"#d4a03c\" stroke-dasharray=\"5,3\"/>\n<text x=\"790\" y=\"88\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"#7a5a28\">普賢菩薩</text>\n<text x=\"790\" y=\"116\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5147\">201 条名目（含子目）·传统「二百组二千酬」</text>\n<text x=\"790\" y=\"140\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8a7a5e\">「何等為十？……是為十」三十四叠式</text>\n<text x=\"500\" y=\"120\" text-anchor=\"middle\" font-size=\"15\" fill=\"#7a5a28\">⇒</text>\n<text x=\"500\" y=\"204\" text-anchor=\"middle\" font-size=\"12\" fill=\"#5a5147\">问可以散，行必有则——如来赞「功德行處．決定義華．普入一切佛法．出世間法門品」</text>\n</svg>\n<figcaption><b>图 〇-1　二百问二千酬图。</b>问酬结构：八十本 201 问→201 条名目（含子目）；传统「二百组二千酬」为成句（§2.3-2.4；「二百问」为传统成句，问数考见〇之零）。<div class=\"en-line\">Fig. 0-1. Two hundred questions (a traditional count; 201 in the 80-fascicle text), two thousand answers.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. 问式读法：杂陈之问。\n2. 组式读法：十数成组。\n3. 赞语读法：品名自证。\n\n### 〇之二.2 图 〇-2　行门三段式图\n\n<figure>\n<svg viewBox=\"0 0 1000 200\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"26\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">行门三段式（§2.4 二千条同构）</text>\n<rect x=\"60\" y=\"60\" width=\"270\" height=\"86\" rx=\"10\" fill=\"#f6efe1\" stroke=\"#b8863c\"/>\n<text x=\"195\" y=\"88\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"bold\" fill=\"#7a5a28\">条件</text>\n<text x=\"195\" y=\"112\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5147\">安住此十法</text>\n<text x=\"195\" y=\"132\" text-anchor=\"middle\" font-size=\"9\" fill=\"#8a7a5e\">以何为基</text><rect x=\"360\" y=\"60\" width=\"270\" height=\"86\" rx=\"10\" fill=\"#f6efe1\" stroke=\"#b8863c\"/>\n<text x=\"495\" y=\"88\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"bold\" fill=\"#7a5a28\">行相</text>\n<text x=\"495\" y=\"114\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5147\">所谓：…（十项行相）</text>\n<text x=\"495\" y=\"132\" text-anchor=\"middle\" font-size=\"9\" fill=\"#8a7a5e\">行何</text><rect x=\"660\" y=\"60\" width=\"270\" height=\"86\" rx=\"10\" fill=\"#f6efe1\" stroke=\"#b8863c\"/>\n<text x=\"795\" y=\"88\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"bold\" fill=\"#7a5a28\">成效</text>\n<text x=\"795\" y=\"116\" text-anchor=\"m 实测** | 同题对应 | `T09n0278` | 对读未竟（L.312 矩阵已立） |\n| **T0·藏本实测** | 〔核订〕 | L.201 TOC | 对勘未竟 |\n\n> 【读法】本品之数以「**门**」为性：二千门同构——读时以检索代通读，一组十门持之终身。\n\n\n<!-- ATLAS:END P36 -->\n\n## 一、概述与品题解义\n\n**品名**：**離世間品第三十八**。说主：**普賢菩薩**（入「佛華莊嚴」三昧起，答普慧菩萨二百余问（八十本实测 201 句））。**实测**：品文净 **54,872 CJK**（跨七卷 120 页），331 `<p>`＋1 `<lg>`。\n\n**【定位】**第八会总纲——**普慧云兴二百问，普贤瓶泻二千酬**：普慧菩萨发问（八十本实测 201 句、六十本 200 句），普贤以「二百组」十种法（传统成句；八十本答组 201）一一酬答；如来赞为「功德行處．決定義華．普入一切佛法．出世間法門品」，结偈劝发金刚心。本会重归普光明殿——**从果分（第七会）转入行海（第八会）**，离世间之行即起于性起之果。\n\n**【一句】****一问酬十，二问答千；行门如瓶泻，离世间不离世间而离。**\n\n## 二、本品全文注\n\n### 2.0′ 玄记体总纲（据澄观《华严经疏》`T1735`·L.371·疏文程序切片回源）\n\n**门目（疏文实录·至四釋文前）**：\n\n> 離世間品1離世間品\n>\n> 第三十八已上入\n>\n> 第五十三經初明來意。來意有三:一分來,前明修因契果生解分,則於法起解;今明託法進修成行分,則依解起行,義次第故。二會來者,前會因圓果滿生解之終,此會正行處世無染,通於始終,故次來也。三品來者,前品出現之果殊勝,今明依彼起行圓融,故次來也。\n>\n> 雖一分一會一品是同,所對既殊,來意亦別。\n>\n> 第二釋名。亦有三別:一分名者,沒彼位名,但彰行法,欲顯行位無礙、前後圓融,故以名也。二會名者,約法不異分名,約處名三會普光明殿之會。\n>\n> 第七重會,會終歸始故。雖越四天,同為生解之會;今復重會,通對彼分始終,依解成行,故會普光。而前分生解差別,故寄歷處以顯淺深;今分起行圓融,故一會並收因果,亦表成行不離普光明智故。此中不隔餘處,何有重會之義?若約次第,前時後時即是重義。\n>\n> 若約圓融,就義名重,故不動前二而升四天。二七相望亦何所隔,明知約義亦猶燈光涉入無礙,亦似燈炷重發重明。約人,名普慧普賢問答之會。三品名有二:一得名、二釋名。今初,又二:一異名。下文十義,至彼當辨。有別行本名度世經,度即離義。\n>\n> 又有別行名普賢菩薩答難二千經,此就能離人法受稱。二正辨本稱,總由超絕世染故受其名。別有三義:一約法、二約行、三約位。約法之中,先世、後離世。有三類:一約事相有二世間,謂器及有情,此約依正分之。二約麁細亦二:一有為世間、二無為世間,此約分段、變易分之。\n>\n> 以變易非三有攝,名之無為。故《勝鬘》云「有為生死,無為生死。」然麁細雖殊,體不出二。三約染淨有三:於初二中,加智正覺示同世間,不同世故,如《地論》辨。二明離者,離有二義:一性離,世間性空即是出世間故;二明事離,行成無染故。\n>\n> 力林頌云「三世五蘊法,說名為世間。彼滅非世間,如是但假名。」滅通二義,於事離中有似離真離、分離全離,次下當辨。二約行者,略為四句:一隨、二離、三俱、四泯。言隨者,凡夫沈溺世蘊,非離非隨。二乘無悲不能隨世,雖離非真。菩薩能隨,方為真離,故以隨釋離。\n>\n> 二離者,有大智故了世性離,處而不染亦異凡小。三俱者,悲故常行世間,智故不染世法。既以世與性離無二為其境,故以悲智無二為其行。境行融通有其三句:一悲無不智,則世無不離,是以常在世間未曾不出。二智無不悲故,離無不世,是以恒越世表,無不遊世。\n>\n> 三雙融故動靜無二,唯是一念,所謂無念。無念等故,世與出世無有障礙。四俱泯者,謂境既世與性離,形奪兩亡,故令悲智俱融,二念雙絕。又由境行相由,形奪齊離,則絕待離言。融前四句皆無障礙,方為真離世間也。三約位者,凡夫染而非離,二乘分離非真,謂果離分段、因唯事離,非今所明。\n>\n> 菩薩具上真行,可得名離,而非究竟。唯佛為離,故經云「佛常在世間,而不染世法。」然今文中備六位之行即是行離,行所依位即是位離,故若事若理、若因若果皆名離也。二釋名者,約法事離,無他受稱。離非世間,即相違釋。若約性離,通持業釋。\n>\n> 約行四句,前三句俱通持業、相違二,事理離故。泯句並非六釋。亦可持業,泯即離故。\n>\n> 第三宗趣。頓彰六位理事二離為宗,令體性離頓成真離究竟為趣。第\n\n**释文**（疏文实录）：\n\n四釋文。長科十分,一序分、二三昧分、三發起分、四起分、五請分、六說分、七結勸分、八現瑞分、九證成分、十重頌分。今初,有三:一器世間圓滿,義如前釋。二「妙悟」下智正覺世間圓滿。「三與不可說」下眾生世間圓滿。二中明佛二十一種殊勝功德,廣引諸論,已見〈升兜率品〉。今但略明,初句為總,具下二十一種功德,故云妙悟皆滿。後「二行」下別。於中,前四自利、餘皆利他。前中,一智德、二斷德、三恩德、四作用平等德。今初,二行永絕,即於所知一向無障轉功德。《佛地經》名不二現行。「不」字,此宜言無,即永絕義。謂佛智德離所知障,非如聲聞極遠時處等有不知故。有知不知即是二行,今無不知,故云永絕。二達無相法,則於有無無二相真如最勝清淨能入功德。彼經名趣無相法,趣謂趣入,即此達義。然無相法,體即真如。無彼有無二相,故名無相。諸法中最,淨無客塵,令自他入,勝於二乘,名最勝清淨。三住於佛住者,即無功用佛事不休息功德。世親釋云「謂住佛所住無所住處」,此即釋經;於此住中常作佛事無有休息,此即解論。四得佛平等,即於法身中所依意樂作事無差別功德。謂諸佛有三事無差:一所依智同、二益生意樂同、三報化作業同,故云平等。五到無障處,則修一切障對治功德。世親釋云「謂一切時常修覺慧,對治一切障故。」此明覺慧為能治;一切障即二障,為所治。六不可轉法,即降伏一切外道功德。謂教證二道,他不能動故。七所行無礙,即生在世間不為世法所礙功德。謂利衰等八法不能拘故。八立不思議,即安立正法功德。謂安立十二分教,餘不能思故。九普見三世,即授記功德。謂記別過未,皆如現在故。十身恒充滿一切國土,即一切世界示現受用變化身功德。謂二種身遍二種國故。十一智恒明達一切諸法,即斷疑功德。謂自於一切境善決定故,能決他疑。十二了一切行,即令入種種行功德。二釋,《攝論》易故不解。意云:遍了一切有情性行,隨根令入故。十三盡一切疑,即當來法生妙智功德。謂聲聞言其全無善根,如來知其久遠微善,後當生故。十四無能測身,即如其勝解示現功德。謂隨諸有情種種勝解,現金色等身,雖現此身而無分別,如末尼等故無能測。十五一切菩薩等所求智,即無量所依調伏有情加行功德。謂由無量菩薩所依,為欲調伏諸有情故,發起加行。佛增上力,聞法為先,獲得妙智。異類菩薩攝受付囑,展轉傳來相續無間而轉,由此證得一切菩薩等所求智。意云:佛智為一切菩薩等所求故。十六到佛無二究竟彼岸,即平等法身波羅蜜多成滿功德。平等即無二義,無二法身為波羅蜜多所依。十七具足如來平等解脫,即隨其勝解示現差別佛土功德。此中解脫即是勝解,隨物勝解所宜。如來勝解能現金銀等土,佛佛皆然,故云平等。十八證無中邊佛平等地,即三種佛身方處無分限功德。世親云「謂佛法身不可分限爾所方處受用變化,亦不可說爾所世界。」十九盡於法界,即窮生死際常現利樂一切有情功德。二十等虛空界,即無盡功德。謂佛實智如空無盡故。今經缺最後窮未來際,總別合有二十一句,義如前說。然《佛地》、《攝論》約受用身,此約十身。所以知者,處摩竭提國是變化土,而歎受用功德,明知二身二國本相融故;不要地前地上,則五位通見故。第三眾生世間圓滿,中二:先舉數歎德、後「其名」下列名歎德。前則多人具德,後則勝人具德。前中二:先舉數揀定;二「悉具菩薩」下歎具勝德,分三:初總標、二「所謂」下別顯、後「成就」下總結。別中十九句,皆不出方便智慧。分二:前十歎自分德、後「於一念」下九句勝進德。今初,前八皆有智慧方便,依體起用故。前五以善能為句首、六知空不壞業果、七知根器別明識病、八持法化之;後二明有方便慧,皆即事歸實。後勝進中,初句總明速成果智,餘皆果智之用,及後總結,文並可知。第二列名歎德,中二:初列名結數、二「皆悉」下歎德。文有十句,初總、餘別。別中,一契理願圓,普眼滿故。二攝法上首,為普化故。三受持正法,有普慧故。四不斷佛種,普見有性故。五知佛化儀,光普徹故。六示現成佛,觀見無故。七淨染機,照其源故。八摧他障,有智幢故。九證法界,覺法性故。上之九句別明,則初句為願、餘八為行。通說則皆普賢願,宿誓今滿故,如十大願並普賢行現緣所作故,故總句云成就行願。又此十句,十人通具,文云皆悉成故,亦句顯一人之德,當釋名故。故總句為普賢,餘九如次前已配釋。大文第二「爾時普賢」下三昧分。普賢入者,是會主故,說普行故。佛華嚴者,萬行披敷,嚴法身故。即以法界行門心海為體,持無限故。說法成行,發起為用,依此能故。大文第三「入此三昧時」下明發起分。先明地動,警群機故;後顯出聲,令聞法故。前皆有加而無發起,此有發起而無加分者,前表解可從他,故有他加;此表行由己立,故自力發起。又表行依解起,無別法故不加。攝解成行,亦須入定。聖旨多端,不可一準。大文第四「然後從」下起分,三義如前。大文第五「爾時普慧」下請分,分三:初總標問意、二「佛子」下正顯問端、三「善哉佛子」下結請願說。今初。當機眾集說法時至,此為問意。何以前來諸會先問後定,今乃翻?此此有二意:一說儀無定。前表重法,感而後應;此明悲深,觀機欲說。眾既已集,故先入定,令知說主。二約所表,則前明從相入實,以成正解;此中依體起用,以成正行,故不同也。普慧問者,稱法界慧,能發行故。一人問者,行獨已成,非如解故。第二正顯問端中有二百句,其別行《度世經》別作六番問答,番番之中皆先問、次答、後動地現瑞,顯益證成。古來諸德皆依彼文用科此經,以為六段:初二十句問十信行、二從「發普賢心」下二十句問十住行、三從「力持」下三十句問十行之行、四從「如寶住」下二十九句問十迴向行、五從「身業」下五十句問十地行、六從「觀察」下五十一句問因圓果滿行。其第四段中,句雖三十,以無礙用一句是總標虛句,故此有二十九句。此經總三遍說六位,此當第二約行說也,以普賢行該六位故。故《度世經》初請云「唯願解說諸菩薩行,從始至終令無疑故。」彼經雖不配於信等,既云從始至終,末後復明成佛,則知決是六位之行。此經所以不問答相間者,意取位中之行,不取位故,如下圓融。若剋定約位,何殊差別因果?此經上下及《本業經》等判於六位,皆以信未入位,十住為首,謂三賢十聖等妙覺故。今何以不開等覺而取信耶?此有深意。彼及此前意在於位,取位成說;今此意明於行,故十信之行正居行始。等覺之位有其三義,或攝屬前十地勝進;或攝屬後,即名佛故;或別開位,無垢地故。今為說行攝屬因圓之中故,五十一句唯後四句屬妙覺位,餘皆等覺。若爾,此中依言依菩提心等,豈非發心住耶?此難尤非。第二段初發普賢心,豈非發心住耶?十信之初豈無發心耶?故賢首云:「菩薩發意求菩提,非是無因無有緣等,正是發心所依。」不究斯旨,空張援據。大文第六「爾時普賢菩薩告」下說分,中二:先總告、二「佛子」下正答。答前門二百問,問一答十,以顯無盡,成其二千普賢勝行,故英公云:「雲興二百問,瓶瀉二千酬。」釋此二千,略為五門:一約因果、二分行位、三顯普別、四明統收、五辨行相,前問例此。今初有四:一約大位,前五為因、後一為果。或後四門為果、餘皆是因。二約細辨,一一皆徹佛果,故諸文末皆結得佛,是則二千並通因果。三或總屬因,普賢位行示成佛故。四或皆屬果,下文多云「雖得成佛,不斷菩薩行」故。二分行位者,亦有四義:一束行成位,分成六分故。二總屬位收,以行並是位中行故。三總屬行,普賢行體不依位故。四一行遍六位,位位通修故。如此無礙,方為普賢行。然文正顯後二,以攬行成位,位虛行實故。故問答併舉,不分六番,意在此也。三普別者,謂一行相必遍一切,然恒不雜。不雜故,別義殊分。必遍故,普義該攝。猶如錦文,眾色成文,常普常別縷縷交徹,非如繡成;行法亦爾,即普是別,即別成普,皆無障礙。若爾,此則普別具足,何以獨名普賢行耶?非謂守普而不能別,亦非作別而失於普,實謂能別而不壞普,故名普賢行也。又普必有別,但語一別未必有普,如一縷非錦,非是錦中縷故。四統收攝者,復有四重:一以位收位,六位各各收一切位故。一位即具二千,為萬二千行也。上云一地之中具足一切諸地功德。二以門收門,即二百門,一一各收一切門,即成二百二百為四萬行。三以行收行,一行具一切行,則有二千箇二千行成四兆行。四以略攝廣,此二千行,下頌結云「如大地一塵」,以此一塵之略,說不離十方之廣地,是故攝廣亦無不盡。此乃等無極之法界,越無際之虛空。下頌云「虛空可度量,菩薩德無盡」,斯之謂矣。五辨行相,即隨文釋。釋寄相別,即分六段:今初二百句,答前信行二十句問。文分三別:初九門明自分行滿、二「入諸菩薩」下八門勝進行圓。三「差別智」下三門明二行究竟。今初,一門一類即為九段。首明依者,起行所依故,謂依託菩提心等成萬行故。〈賢首品〉云「菩薩發意求菩提,非是無因無有緣」等。然二百門,多分五別:一總標、二徵數、三列釋、四結數、五顯修勝益。或缺後二、或缺第五,至文當知。今此依中,文具有五。初二可知。就列釋中十句,各先標名、後釋義。一依菩提心者,十皆名依,已為眾行之首,而菩提心復是十中之初,以是萬行之本,故貫二千之首。釋云不忘失者,忘失菩提心修諸善根,則是魔業故。依斯不忘,能成萬行。此句為總。二上雖內有勝心,若外不依善友,行亦無成。故大聖謂善財言:「求善知識,是無上菩提最初因緣。」釋云如一者,若不心行符契,豈為我友?三若不增修善根,遇友何益?四隨所修善,須到彼岸。五非獨十度觸境皆通,上四自利六願七行並通自他。上皆依法,後三依人。八勝侶智同、九十唯佛究竟,為所依處故,淨心供養以成福德,長稟慈訓以成智嚴。又前五自分,後五勝進。六廣菩提心,七廣二四五,後三廣第二。四結,可知。五顯修勝益者,由依上十成佛大智,為一切所依,斯為勝益。豈得不修?故亦名勸修。第二奇特想者,前依因緣以成諸行。今依勝想以攝善根,翻妄想源,次所依故,並出常想,受奇特名。即上文中常欲利樂諸眾生等利益之想也。十中,一以他善同己者,隨喜於他,情無彼此故,互為主伴相資益故,同體性故,即我所行故,自他相即故,四六願行亦然。二一毫微善皆是佛因故,《法華》中舉手低頭皆已成佛。三下至闡提皆有佛性故。五《思益》云「知離名為法」故。七諸性相法,佛所證故。文殊云:「我不見一法非佛法者,皆不可得故。」諸軌儀法皆佛所流,《涅槃》云「外道之法亦如來正法之餘」故。八因言契理,而理非言,故名言道。九佛以覺他圓滿,故為慈父。十如來即諸法如義,故無有二。益中,無想之想名善巧想。第三十種行,依勝想之解,造修大行。想唯在心,行通三業。空想不行,亦無成辦。即上文中修學處也。釋中唯九者,準晉本,此脫第三善學一切戒。具十為五對:一下化上求、二止惡進善、三妙止深觀、四修因嚴剎、五敬友事師。第四善知識者,行起必依善友,故次明之。未知善令知、未識惡令識,故凡所順益皆我善友,故十皆益也。上云即得親近善知識是。第五精進者,行友既具,必須策勤。於此十事,離身心相而進修不雜,故上云勤修佛功德。第六心得安隱,進成二利故獲心安,自利故智心安、利他故悲心安,即上文增上最勝心。十中,初一行本。次二離過,一無諍三昧,離一切諍;二越凡小,凡謂凡夫,愚即愚法小乘。次二進善。次三證入,一入位、二入法、三入益。謂謗有二義:一麁,言此非佛說等,其過彌大。二細,謂說不契實,其過則微。若無細謗,證實方能。後二因圓果滿。得益中,究竟安隱謂菩提涅槃。第七成就眾生者,上通明二利心安,今別明利物成就,故上云「則能慈愍度眾生。」然有二義:一以此十通用成就一切眾生;二各成一類眾生,謂一成就慳貪貧窮眾生、二成恃形色憍慢眾生、三疑法、四佷戾、五貪愛、六樂二乘、七不樂嚴剎、八不欣佛果、九邪歸依、十邪智狡猾。以經中十法如次成就。第八戒者,欲成就眾生,須自止惡行善。十中若忘菩提心,乃至諸根犯境,皆名破菩薩戒。故上云「堅固大悲心則不破」也。此十三聚,如應思之。第九受記法者,既離過德成,自驗己行必招當果故,自知受記故。上云「若得無生深法忍,則為諸佛所授記。」即此中一義。一見理深悲,即發心殊勝、得果無疑;若因他厭苦則非殊勝,未定得記。二無厭修。三長時修。四無餘修。五契理修。餘五可知。於此十中隨有其一,即自知得記。此辨得記之行,非顯受記相殊,如《瑜伽》等。又此約十信橫具,餘約豎位不同。上來自分行竟。第二八門明勝進行中,既自分行成故勝進,入諸所入之處等,即為八段。今初,入菩薩,入有二義:一證得義、二觀達義。入因則通證,通達入果,唯達未證。此下五門皆是智入,四五二入亦通身入,今此即是入因。所以入者,即彼所修是我所修,互相資益為同行故。故《度世經》名不相求短,即上文中神通深密用等十句可知。第二入諸如來,是入果。所以入者,必當證入故。上云「則以佛德自莊嚴。」第三入眾生行。前二入能化,此明入所化心行等。上云「悉能調伏諸眾生」等。問中脫於「行」字,行有多種,如文可知。十時非時,謂熟未熟等。不知時者,非大法師。第四入世界,對佛是依報,對生是化處。上云「普隨諸趣而現身」。結云普入者,不離此十故,一時頓入非前後故。第五入劫者,即是化時。此下三門皆是成上一念悉知,無有餘也。十中前五直入,後五約相即入。此相即入有二意:一彼劫相即,智入彼故;二由彼劫相攝相入故,但入能攝,即入彼所攝等。餘如前〈發心品〉。第六說三世者,前劫此世,長短有異,通皆時分,並是十世隔法異成。十中,前九別、後一總。別中,三世各三,故成九世。未來是續起法故,未來未來名為無盡。過去已起故,過去過去不名無盡。現在現在即事可見,例過未之現在,故云平等。過未之現在非可見故,但對前後立現在名。然此三世何以成九?古人釋云:義說為九,實唯有五。意云:如五日相望,前三為過去三世、從後取三為未來三世、處中取三為現在三世。若依此釋,進無九世之體,退過三世之數,云何一念得具九耶?今謂:若不令九緣起相由,但以三世緣起相由,即九世成矣。謂過去因現未,則過去之中有現未,現未各因二世亦然,是以三世各三。故《中觀》云「若法所因出,是法不異因。」《中論》破執,則一中有三為過;此明離過之用,則一中有三為德。以病成藥,豈不良哉。總云一念者,前之九世相望以立,今攝末歸本不離一念,即此一念現在,是過去未來、是未來過去,自具三世。三世相由,九十具矣。故以一融九,雖九而常一;以九融一,雖一而常九。九一無礙,沒果絕言,假十圓融為入門矣。況積念成世,念外無世耶?又無念等故。又法性同故。此有四義,後三通於餘宗。第七知三世者,前之二段明法上之時,此辨時中之法,即化生之法,隨彼安立而化故,是上所知之法故。晉經名三世間,《度世經》名入於三處,皆意取其中事也。十中初七知安立諦;次一通二,成上安立事無有盡,生下非安立性無可盡;後二知非安立。第八無疲厭心。既所化無邊,求法化之而無厭怠,由上即知煩惱無所起故。十中,初四上求;次四下化;後二通二,謂遊剎近佛化生故,思惟二利行法故。上八門勝進行竟。第三有三門,明前二行究竟。今初一門明所持差別智究竟。上云「則以智慧辯才力,隨眾生心而化誘」也。第二陀羅尼,即能持究竟。上云「修行諸度勝解脫」等。十中,初一聞持、次四義持、次四廣聞持之用、後一收上義持。又初四如次持教行理果;次二重顯持行,即定慧故;次一持理,不思議故;次二重顯教;後一重顯果。第三說十種佛,上能持所持皆是佛法,今知法主究竟。上云「則得灌頂而升位」等。十信滿心便得佛故,然此十佛與下十種見佛名義全同,與前十身名有同異而義亦無殊。一示成正覺故,即前菩提身。二願生兜率故,與前全同。三萬行因感故,即前相好莊嚴身。四自身舍利住持故,即力持身。五涅槃佛,化必示滅故,即前化身。六法界佛,真無漏界故,即前法身。七依唯心故,即威勢身。雖光明亦能攝伏,心伏最勝,如慈心降魔等。八常在定故,即福德身,定為福之最故。九了本性故,即前智身,大圓鏡智、平等性智皆本有故。故下云「明了見十,隨所欲樂,無不現故。」即意生身故。晉經云如意佛。然佛就內覺,身多就相故,立名不同。餘廣如別章,略如八地。大文第二「發普賢心」下有二十門,答前二十句問,明十住行法。古德同分為四:初六門別明發心住義。二「十種波羅蜜」下六門明餘九住中所成內德行。三從「十種說法」下三門明諸住中外化行。四從「十種自在」下有五門明無礙殊勝行非不有理。今取順十住,經文二十門,如次明十住行,但與前行互有廣略,影顯解中之行廣無盡故。若依圓融,行行遍通,若不壞相,不妨次第。初四門明初住行、二三各有二門、四五各一、後五皆二門。今初四門明發心住,初一總明、後三別顯。今初總發,名普賢心。前十住中自分之內,即緣佛十力發心,但廣發心之境;今發普賢心,則廣發心之相,影略明故。普賢心者,即菩提心。菩提心就果以明,普賢心約相用說,橫周法界、豎窮未來故。十中初三悲護眾生心、次六約起願心。於中,一求果智,即前緣佛十力;二求因行、三豎、四廣,四皆上求願。「忍施」下化願,後一智心,即三心菩提也。又前七護小乘,於中初三護陜心、後四護小心;餘三護煩惱心,故異凡小是菩提心。又初三眾生無邊誓願度,度生無悋,故一切施也;次一佛道無上誓願成;次三法門無盡誓願學;後三煩惱無邊誓願斷。即四弘誓願觀理發心。二「有十種普賢行法」下別明菩提心。此門即大願心,亦即是前勝進行。所謂勤供養佛、樂住生死等。文相多同,恐繁不會。三有十種大悲,即別明悲心。初一總,謂外無善友可依、內無自德可怙故;餘九別。初五欲求眾生,但縱目前之情故;次一有求眾生故,沒生死海。後三邪梵行求眾生,無明邪見之所病故,但欲邪法故。四有十種菩提心因緣,別顯智心觀境推理,發心別故。此與前自分行中發心因緣亦互影略。十中,前五以薩埵為緣,初句總、餘四別。別中,一令滅妄苦、二得真滅、三斷癡集、四證真道,即推無作四諦理發菩提心。後五以菩提心為緣,初二福智因、後三希福智果。然上二段文含二意:一成上發心住中行;二成下治地住中行,謂十種大悲,即廣彼自分中十心之一。菩提因緣前五,即彼自分中初之五心,一利益、二大悲、三安樂、四憐愍、五安住。後五即彼此互缺。第二「近善知識」下二門,正明治地住中行。此門明勝進中近善知識文中標內兼是顯意。列中,前六事友、後四同修無異。求者,不求名聞利養及過失故。二十種清淨,即勝進近友之果,故云起如是心即得。此十即是前文了達,於義如法修行,遠離愚迷,安住不動。梵云波利戍提,此有二義:一遍清淨,即此十種。二極清淨,即下第六十四段。列中,初六三業淨,前三體淨、後三用淨;次二主伴果報淨;後二願行淨。第三「波羅蜜」下有二門,明修行住中行,此門即自分行。彼開一慧為十觀察,今總顯修具修十度,十度皆總相而釋,一一多含,故施云一切皆捨等。智即方便,進趣佛力權智,立以智名。神通即力度,晉名神力。法即是智,從所知名法。二十種智隨覺,由前行成無倒了達,隨事隨理善覺知故。即前勝進十法觀察眾生界等,亦有影略,恐繁不會。第四證知一門,明生貴住中行。即彼自分行,由前了達故,能證知證故,於聖教中生。十中,初三總知一切法、次五廣前知眾生、九菩薩行願即前業行中攝、後一即知涅槃對生死故。其勝進但了佛法,無別行相,故略不明。第五十種力,即具足方便住中行。準梵本,此名積集,即方便具足之義。下第九十五即是十力。前十住中但云所修諸行皆為眾生,不知修何?今顯所修之行。又入即了達,兼其勝進解眾生等。於中,前六解法力、餘四上求力。第六「十種平等」下二門,明正心住。此門即自分行,由了平等,故聞讚毀心定不動。然平等之言,通有三義:一事等,謂十類各各相望,如說眾生等有佛性,乃至諸佛同一法身,一心一智等;二者理等,謂此十類等一真故;三心等,由了前二即之於心,故於十境不生高下。十中,一於眾生等,謂無怨親故;二於善惡不生分別故;三見染見淨無高下故;四同一真道而出離故;五無一善根不為佛故;六於諸同行如自己故;七一一大願徹來際故;八不謂般若勝檀等故;九隨一一行徹事理故;十不謂此佛此最勝故。二十種佛法實義句者,即彼勝進中行,與前雖少前却,而義多同。於中,初一約遍計,都無實故;次四約依他;後五約圓成。一無名相中假名說故,餘四各一義可知。第七「說十種法」下有二門,明不退住中行。於中,初一自分、後一勝進。前中,由能說深廣法,故聞說心不退轉。十中,說業性等成如來力,隨義演說令菩薩不退,《涅槃》二十八中廣明退不退相。餘文可知。二十種持,持謂受持奉行,非但宣之於口。十句可知。第八「十種辯才」下二門,明童真住中行。此門即自分行,由三業無失故,有無著辯。由知眾生欲解,故辯令他喜。後門即彼勝進,現變化自在身等,皆自在義。第九「十種無著」下二門,明王子住中行。此門由無著故,能善知十法;後門由平等故,勝進學法王處法。第十「十種出生智」下二門,明灌頂位中行。此門明成就十智學佛十智;後十種變化故,能動剎等。然此變化即實如化,非要化作。上來數段文相並顯,雖有深旨,類前可知。大方廣佛華嚴經疏卷第五十一2大方廣佛華嚴經疏卷第五十二已下入五十三經唐清涼山大華嚴寺沙門澄觀撰大文第三「十種力持」下有三十門,答前十行三十句問。古德分三:初六門,明大志曠遠行;二從「十種不思議」下九門,明定慧業用行;三從「十種園林」下十五門,明德備成滿行。然約圓融,此意非無。今不壞次,亦次第顯十行中行。第一行有三門,二三行各一,第四行二門,第五行六門,次四行各二門,第十行有九門,至文當知。所以用門多少者,檀在初故具三,戒忍通世間故唯一,定慧尊勝故有多門。智中既多,故般若中略,餘次勝故但用二門。又此十行雖約十度,而義多含,故文中或就十度明義、或就行名以釋。今初三門,明歡喜行中之行。三中,初明力持。此含總別,總者以是十行之首,依此十事加持建立能起諸行故,《度世經》名十建立。別即歡喜行中凡所布施,皆為修習諸佛本所修行等故,是建立行意。十中,初三三寶即境界持。眾生即僧寶,菩薩之僧即眾生世間故;餘七行持悲所作業故,正起行故、願持行故、有悲智境行方成故。時即起行之時。後二福智。然第十地大盡分中有十一持,第四加煩惱持故。論判行持中,初二逆行,彼約應化不斷,所以加之;今但約為行本,故無煩惱。彼有供養持及劫持,無境界持及善力持;此以時中攝劫,彼以行攝善力依境起供,故並無異。餘名並同,具如彼釋。既數名不同,案名以釋,此無僧寶,有教化眾生,亦未爽通理。上辨陀羅尼即總持文義,次云受持即領納\n\n（……释文余段照录从略·全文 32241 字·见 `T1735` 原文）\n\n> 体例：docs/工程治理/玄记体重排体例_v1.md——疏文照录；下节逐段层保持不动，与此总纲互指。\n\n\n### 2.1 序分·莲华藏师子座（程序全引）\n\n> 離世間品爾時，世尊在摩竭提國阿蘭若法菩提場中普光明殿，坐蓮華藏師子之座，妙悟皆滿，二行永絕，達無相法；住於佛住，得佛平等，到無障處不可轉法；所行無礙，立不思議，普見三世；身恒充遍一切國土，智恒明達一切諸法；了一切行，盡一切疑，無能測身；\n>\n> 一切菩薩等所求智，到佛無二究竟彼岸，具足如來平等解脫，證無中邊佛平等地，盡於法界等虛空界。與不可說百千億那由他佛剎微塵數菩薩摩訶薩俱，皆一生當得阿耨多羅三藐三菩提，各從他方種種國土而共來集，悉具菩薩方便智慧。所謂：善能觀察一切眾生，以方便力，令其調伏，住菩薩法；\n>\n> 善能觀察一切世界，以方便力，普皆往詣；善能觀察涅槃境界，思惟籌量永離一切戲論分別，而修妙行無有間斷；善能攝受一切眾生，善入無量諸方便法，知諸眾生空無所有而不壞業果；善知眾生心使、諸根境界方便種種差別；悉能受持三世佛法，自得解了，復為他說；\n>\n> 於世、出世無量諸法，皆善安住，知其真實；於有為、無為一切諸法，悉善觀察，知無有二；於一念中，悉能獲得三世諸佛所有智慧；於念念中，悉能示現成等正覺，令一切眾生發心成道；於一眾生心之所緣，悉知一切眾生境界；雖入如來一切智地，而不捨菩薩行諸所作業，智慧方便而無所作；\n>\n> 為一一眾生住無量劫，而於阿僧祇劫難可值遇，轉正法輪調伏眾生皆不唐捐，三世諸佛清淨行願悉已具足；成就如是無量功德，一切如來於無邊劫說不可盡。其名曰：普賢菩薩、普眼菩薩、普化菩薩、普慧菩薩、普見菩薩、普光菩薩、普觀菩薩、普照菩薩、普幢菩薩、普覺菩薩……。\n>\n> 如是等十不可說百千億那由他佛剎微塵數，皆悉成就普賢行願，深心大願皆已圓滿；一切諸佛出興世處，悉能往詣請轉法輪；善能受持諸佛法眼，不斷一切諸佛種性；善知一切諸佛興世授記次第、名號、國土、成等正覺、轉於法輪；無佛世界現身成佛，能令一切雜染眾生皆悉清淨；\n>\n> 能滅一切菩薩業障，入於無礙清淨法界。爾時，\n\n**【句释】**（疏训释·体例 v1 第3条·L.435·据澄观《华严经疏》`T1735`）：\n- 「前明修因契果生解分，則於法起解；今明託法進修成行分，則依解起行」——分来：前修因契果生解（于法起解）·今托法进修成行（依解起行）——义次第。\n- 「不動前二而升四天」——重会普光明殿之义：约次第前时后时即是重义·约圆融就义名重——不动前二而升四天，灯光涉入无碍。\n- 「有別行本名度世經」——别行本对照：别行名〔度世經〕（度即离义）·又普贤菩萨答难二千经——能离人法受称。\n\n### 2.2 普贤入佛华庄严三昧（程序全引）\n\n> 普賢菩薩摩訶薩入廣大三昧，名：佛華莊嚴；入此三昧時，十方所有一切世界六種、十八相動，出大音聲靡不皆聞；然後從其三昧而起。爾時，普慧菩薩知眾已集，問普賢菩薩\n\n### 2.3 普慧菩萨问句（八十本 201 问·六十本 200 问·程序全引）\n\n> 言：「佛子！願為演說：何等為菩薩摩訶薩依？何等為奇特想？何等為行？何等為善知識？何等為勤精進？何等為心得安隱？何等為成就眾生？何等為戒？何等為自知受記？何等為入菩薩？何等為入如來？何等為入眾生心行？何等為入世界？何等為入劫？\n>\n> 何等為說三世？何等為入三世？何等為發無疲厭心？何等為差別智？何等為陀羅尼？何等為演說佛？何等為發普賢心？何等為普賢行法？以何等故而起大悲？何等為發菩提心因緣？何等為於善知識起尊重心？何等為清淨？何等為諸波羅蜜？何等為智隨覺？\n>\n> 何等為證知？何等為力？何等為平等？何等為佛法實義句？何等為說法？何等為持？何等為辯才？何等為自在？何等為無著性？何等為平等心？何等為出生智慧？何等為變化？何等為力持？何等為得大欣慰？何等為深入佛法？何等為依止？何等為發無畏心？\n>\n> 何等為發無疑惑心？何等為不思議？何等為巧密語？何等為巧分別智？何等為入三昧？何等為遍入？何等為解脫門？何等為神通？何等為明？何等為解脫？何等為園林？何等為宮殿？何等為所樂？何等為莊嚴？何等為發不動心？何等為不捨深大心？何等為觀察？\n>\n> 何等為說法？何等為清淨？何等為印？何等為智光照？何等為無等住？何等為無下劣心？何等為如山增上心？何等為入無上菩提如海智？何等為如寶住？何等為發如金剛大乘誓願心？何等為大發起？何等為究竟大事？何等為不壞信？何等為授記？何等為善根迴向？\n>\n> 何等為得智慧？何等為發無邊廣大心？何等為伏藏？何等為律儀？何等為自在？何等為無礙用？何等為眾生無礙用？何等為剎無礙用？何等為法無礙用？何等為身無礙用？何等為願無礙用？何等為境界無礙用？何等為智無礙用？何等為神通無礙用？何等為神力無礙用？\n>\n> 何等為力無礙用？何等為遊戲？何等為境界？何等為力？何等為無畏？何等為不共法？何等為業？何等為身？何等為身業？何等為身？何等為語？何等為淨修語業？何等為得守護？何等為成辦大事？何等為心？何等為發心？何等為周遍心？何等為諸根？\n>\n> 何等為深心？何等為增上深心？何等為勤修？何等為決定解？何等為決定解入世界？何等為決定解入眾生界？何等為習氣？何等為取？何等為修？何等為成就佛法？何等為退失佛法道？何等為離生道？何等為決定法？何等為出生佛法道？何等為大丈夫名號？\n>\n> 何等為道？何等為無量道？何等為助道？何等為修道？何等為莊嚴道？何等為足？何等為手？何等為腹？何等為藏？何等為心？何等為被甲？何等為器仗？何等為首？何等為眼？何等為耳？何等為鼻？何等為舌？何等為身？何等為意？何等為行？何等為住？\n>\n> 何等為坐？何等為臥？何等為所住處？何等為所行處？何等為觀察？何等為普觀察？何等為奮迅？何等為師子吼？何等為清淨施？何等為清淨戒？何等為清淨忍？何等為清淨精進？何等為清淨定？何等為清淨慧？何等為清淨慈？何等為清淨悲？何等為清淨喜？\n>\n> 何等為清淨捨？何等為義？何等為法？何等為福德助道具？何等為智慧助道具？何等為明足？何等為求法？何等為明了法？何等為修行法？何等為魔？何等為魔業？何等為捨離魔業？何等為見佛？何等為佛業？何等為慢業？何等為智業？何等為魔所攝持？\n>\n> 何等為佛所攝持？何等為法所攝持？何等為住兜率天所作業？何故於兜率天宮歿？何故現處胎？何等為現微細趣？何故現初生？何故現微笑？何故示行七步？何故現童子地？何故現處內宮？何故現出家？何故示苦行？云何往詣道場？云何坐道場？何等為坐道場時奇特相？\n>\n> 何故示降魔？何等為成如來力？云何轉法輪？何故因轉法輪得白淨法？何故如來、應、正等覺示般涅槃？善哉！佛子！如是等法，願為演說！」爾時，\n\n\n> **【勘玄记04·八段分段表】**（P84·海云继梦分法·与本文实测 201 问逐段吻合——22+20+30+28+30+20+32+19＝201）：\n>\n> | 位 | 问号区间 | 段首问 → 段末问 | 备注 |\n> |---|---|---|---|\n> | 信位  |\n| 181 | 能棄捨此魔所攝持，則得十種佛所攝持 |\n| 182 | 有十種法所攝持 |\n| 183 | 住兜率天，有十種所作業 |\n| 184 | 於兜率天將下生時，現十種事 |\n| 185 | 示現處胎，有十種事 |\n| 186 | 有十種甚微細趣 |\n| 187 | 有十種生 |\n| 188 | 以十事故，示現微笑心自誓 |\n| 189 | 以十事故，示行七步 |\n| 190 | 以十事故，現處童子地 |\n| 191 | 現童子地已，以十事故現處王宮 |\n| 192 | 以十事故，示現出家 |\n| 193 | 為十種事故，示行苦行 |\n| 194 | 往詣道場有十種事 |\n| 195 | 坐道場有十種事 |\n| 196 | 坐道場時，有十種奇特未曾有事 |\n| 197 | 坐道場時，觀十種義故，示現降魔 |\n| 198 | 有十種成如來力 |\n| 199 | 轉大法輪有十種事 |\n| 200 | 轉法輪時，以十事故，於眾生心中種白淨法，無空過者 |\n| 201 | 作佛事已，觀十種義故，示般涅槃 |\n\n**〔L.275 批·组 1–40 注入·5,390 CJK·0 手抄〕**\n\n**（条 1／201）有十種依**：\n\n> 菩薩摩訶薩有十種依。何等為十？所謂：以菩提心為依，恒不忘失故；以善知識為依，和合如一故；以善根為依，修集增長故；以波羅蜜為依，具足修行故；以一切法為依，究竟出離故；以大願為依，增長菩提故；以諸行為依，普皆成就故；以一切菩薩為依，同一智慧故；以供養諸佛為依，信心清淨故；以一切如來為依，如慈父教誨不斷故。是為十。若諸菩薩安住此法，則得為如來無上大智所依處。「佛子！\n\n**（条 2／201）有十種奇特想**：\n\n> 菩薩摩訶薩有十種奇特想。何等為十？所謂：於一切善根生自善根想；於一切善根生菩提種子想；於一切眾生生菩提器想；於一切願生自願想；於一切法生出離想；於一切行生自行想；於一切法生佛法想；於一切語言法生語言道想；於一切佛生慈父想；於一切如來生無二想。是為十。若諸菩薩安住此法，則得無上善巧想。「佛子！\n\n**（条 3／201）有十種行**：\n\n> 菩薩摩訶薩有十種行。何等為十？所謂：一切眾生行，普令成熟故；一切求法行，咸悉修學故；一切善根行，悉使增長故；一切三昧行，一心不亂故；一切智慧行，無不了知故；一切修習行，無不能修故；一切佛剎行，皆悉莊嚴故；一切善友行，恭敬供養故；一切如來行，尊重承事故。是為十。若諸菩薩安住此法，則得如來無上大智慧行。「佛子！\n\n**（条 4／201）有十種善知識**：\n\n> 菩薩摩訶薩有十種善知識。何等為十？所謂：令住菩提心善知識；令生善根善知識；令行諸波羅蜜善知識；令解說一切法善知識；令成熟一切眾生善知識；令得決定辯才善知識；令不著一切世間善知識；令於一切劫修行無厭倦善知識；令安住普賢行善知識；令入一切佛智所入善知識。是為十。「佛子！\n\n**（条 5／201）有十種勤精進**：\n\n> 菩薩摩訶薩有十種勤精進。何等為十？所謂：教化一切眾生勤精進；深入一切法勤精進；嚴淨一切世界勤精進；修行一切菩薩所學勤精進；滅除一切眾生惡勤精進；止息一切三惡道苦勤精進；摧破一切眾魔勤精進；願為一切眾生作清淨眼勤精進；供養一切諸佛勤精進；令一切如來皆悉歡喜勤精進。是為十。若諸菩薩安住此法，則得具足如來無上精進波羅蜜。「佛子！\n\n**（条 6／201）有十種心得安隱**：\n\n> 菩薩摩訶薩有十種心得安隱。何等為十？所謂：自住菩提心，亦當令他住菩提心，心得安隱；自究竟離忿諍，亦當令他離忿諍，心得安隱；自離凡愚法，亦令他離凡愚法，心得安隱；自勤修善根，亦令他勤修善根，心得安隱；自住波羅蜜道，亦令他住波羅蜜道，心得安隱；自生在佛家，亦當令他生於佛家，心得安隱；自深入無自性真實法，亦令他入無自性真實法，心得安隱；自不誹謗一切佛法，亦令他不誹謗一切佛法，心得安隱；自滿一切智菩提願，亦令他滿一切智菩提願，心得安隱；自深入一切如來無盡智藏，亦令他入一切如來無盡智藏，心得安隱。是為十。若諸菩薩安住此法，則得如來無上大智安隱。「佛子！\n\n**（条 7／201）有十種成就眾生**：\n\n> 菩薩摩訶薩有十種成就眾生。何等為十？所謂：以布施成就眾生；以色身成就眾生；以說法成就眾生；以同行成就眾生；以無染著成就眾生；以開示菩薩行成就眾生；以熾然示現一切世界成就眾生；以示現佛法大威德成就眾生；以種種神通變現成就眾生；以種種微密善巧方便成就眾生。是為十。菩薩以此成就眾生界。「佛子！\n\n**（条 8／201）有十種戒**：\n\n> 菩薩摩訶薩有十種戒。何等為十？所謂：不捨菩提心戒；遠離二乘地戒；觀察利益一切眾生戒；令一切眾生住佛法戒；修一切菩薩所學戒；於一切法無所得戒；以一切善根迴向菩提戒；不著一切如來身戒；思惟一切法離取著戒；諸根律儀戒。是為十。若諸菩薩安住此法，則得如來無上廣大戒波羅蜜。「佛子！\n\n**（条 9／201）有十種受記法，菩薩以此自知受記**：\n\n> 菩薩摩訶薩有十種受記法，菩薩以此自知受記。何等為十？所謂：以殊勝意發菩提心，自知受記；永不厭捨諸菩薩行，自知受記；住一切劫行菩薩行，自知受記；修一切佛法，自知受記；於一切佛教一向深信，自知受記；修一切善根皆令成就，自知受記；置一切眾生於佛菩提，自知受記；於一切善知識和合無二，自知受記；於一切善知識起如來想，自知受記；恒勤守護菩提本願，自知受記。是為十。「佛子！\n\n**（条 10／201）有十種入，入諸菩薩**：\n\n> 菩薩摩訶薩有十種入，入諸菩薩。何等為十？所謂：入本願；入行；入聚；入諸波羅蜜；入成就；入差別願；入種種解；入莊嚴佛土；入神力自在；入示現受生。是為十。菩薩以此普入三世一切菩薩。「佛子！\n\n**（条 11／201）有十種入，入諸如來**：\n\n> 菩薩摩訶薩有十種入，入諸如來。何等為十？所謂：入無邊成正覺；入無邊轉法輪；入無邊方便法；入無邊差別音聲；入無邊調伏眾生；入無邊神力自在；入無邊種種差別身；入無邊三昧；入無邊力、無所畏；入無邊示現涅槃。是為十。菩薩以此普入三世一切如來。「佛子！\n\n**（条 12／201）有十種入眾生行**：\n\n> 菩薩摩訶薩有十種入眾生行。何等為十？所謂：入一切眾生過去行；入一切眾生未來行；入一切眾生現在行；入一切眾生善行；入一切眾生不善行；入一切眾生心行；入一切眾生根行；入一切眾生解行；入一切眾生煩惱習氣行；入一切眾生教化調伏時、非時行。是為十。菩薩以此普入一切諸眾生行。「佛子！\n\n**（条 13／201）有十種入世界**：\n\n> 菩薩摩訶薩有十種入世界。何等為十？所謂：入染世界；入淨世界；入小世界；入大世界；入微塵中世界；入微細世界；入覆世界；入仰世界；入有佛世界；入無佛世界。是為十。菩薩以此普入十方一切世界。「佛子！\n\n**（条 14／201）有十種入劫**：\n\n> 菩薩摩訶薩有十種入劫。何等為十？所謂：入過去劫；入未來劫；入現在劫；入可數劫；入不可數劫；入可數劫即不可數劫；入不可數劫即可數劫；入一切劫即非劫；入非劫即一切劫；入一切劫即一念。是為十。菩薩以此普入一切劫。「佛子！\n\n**（条 15／201）有十種說三世**：\n\n> 菩薩摩訶薩有十種說三世。何等為十？所謂：過去世說過去世；過去世說未來世；過去世說現在世；未來世說過去世；未來世說現在世；未來世說無盡；現在世說過去世；現在世說未來世；現在世說平等；現在世說三世即一念。是為十。菩薩以此普說三世。「佛子！\n\n**（条 16／201）有十種知三世**：\n\n> 菩薩摩訶薩有十種知三世。何等為十？所謂：知諸安立；知諸語言；知諸談議；知諸軌則；知諸稱謂；知諸制令；知其假名；知其無盡；知其寂滅；知一切空。是為十。菩薩以此普知一切三世諸法。「佛子！\n\n**（条 17／201）發十種無疲厭心**：\n\n> 菩薩摩訶薩發十種無疲厭心。何等為十？所謂：供養一切諸佛無疲厭心；親近一切善知識無疲厭心；求一切法無疲厭心；聽聞正法無疲厭心；宣說正法無疲厭心；教化調伏一切眾生無疲厭心；置一切眾生於佛菩提無疲厭心；於一一世界經不可說不可說劫行菩薩行無疲厭心；遊行一切世界無疲厭心；觀察思惟一切佛法無疲厭心。是為十。若諸菩薩安住此法，則得如來無疲厭無上大智。「佛子！\n\n**（条 18／201）有十種差別智**：\n\n> 菩薩摩訶薩有十種差別智。何等為十？所謂：知眾生差別智；知諸根差別智；知業報差別智；知受生差別智；知世界差別智；知法界差別智；知諸佛差別智；知諸法差別智；知三世差別智；知一切語言道差別智。是為十。若諸菩薩安住此法，則得如來無上廣大差別智。「佛子！\n\n**（条 19／201）有十種陀羅尼**：\n\n> 菩薩摩訶薩有十種陀羅尼。何等為十？所謂：聞持陀羅尼，持一切法不忘失故；修行陀羅尼，如實巧觀一切法故；思惟陀羅尼，了知一切諸法性故；法光明陀羅尼，照不思議諸佛法故；三昧陀羅尼，普於現在一切佛所聽聞正法心不亂故；圓音陀羅尼，解了不思議音聲語言故；三世陀羅尼，演說三世不可思議諸佛法故；種種辯才陀羅尼，演說無邊諸佛法故；出生無礙耳陀羅尼，不可說佛所說之法悉能聞故；一切佛法陀羅尼，安住如來力、無畏故。是為十。若諸菩薩欲得此法，當勤修學。「佛子！\n\n**（条 20／201）說十種佛**：\n\n> 菩薩摩訶薩說十種佛。何等為十？所謂：成正覺佛；願佛；業報佛；住持佛；涅槃佛；法界佛；心佛；三昧佛；本性佛；隨樂佛。是為十。「佛子！\n\n**（条 21／201）發十種普賢心**：\n\n> 菩薩摩訶薩發十種普賢心。何等為十？所謂：發大慈心，救護一切眾生故；發大悲心，代一切眾生受苦故；發一切施心，悉捨所有故；發念一切智為首心，樂求一切佛法故；發功德莊嚴心，學一切菩薩行故；發如金剛心，一切處受生不忘失故；發如海心，一切白淨法悉流入故；發如大山王心，一切惡言皆忍受故；發安隱心，施一切眾生無怖畏故；發般若波羅蜜究竟心，巧觀一切法無所有故。是為十。若諸菩薩安住此心，疾得成就普賢善巧智。「佛子！\n\n**（条 22／201）有十種普賢行法**：\n\n> 菩薩摩訶薩有十種普賢行法。何等為十？所謂：願住未來一切劫普賢行法；願供養恭敬未來一切佛普賢行法；願安置一切眾生於普賢菩薩行普賢行法；願積集一切善根普賢行法；願入一切波羅蜜普賢行法；願滿足一切菩薩行普賢行法；願莊嚴一切世界普賢行法；願生一切佛剎普賢行法；願善觀察一切法普賢行法；願於一切佛國土成無上菩提普賢行法。是為十。若諸菩薩勤修此法，疾得滿足普賢行願。「佛子！\n\n**（条 23／201）以十種觀眾生而起大悲**：\n\n> 菩薩摩訶薩以十種觀眾生而起大悲。何等為十？所謂：觀察眾生無依無怙而起大悲；觀察眾生性不調順而起大悲；觀察眾生貧無善根而起大悲；觀察眾生長夜睡眠而起大悲；觀察眾生行不善法而起大悲；觀察眾生欲縛所縛而起大悲；觀察眾生沒生死海而起大悲；觀察眾生長嬰疾苦而起大悲；觀察眾生無善法欲而起大悲；觀察眾生失諸佛法而起大悲。是為十。菩薩恒以此心觀察眾生。「佛子！\n\n**（条 24／201）有十種發菩提心因緣**：\n\n> 菩薩摩訶薩有十種發菩提心因緣。何等為十？所謂：為教化調伏一切眾生故，發菩提心；為除滅一切眾生苦聚故，發菩提心；為與一切眾生具足安樂故，發菩提心；為斷一切眾生愚癡故，發菩提心；為與一切眾生佛智故，發菩提心；為恭敬供養一切諸佛故，發菩提心；為隨如來教，令佛歡喜故，發菩提心；為見一切佛色身相好故，發菩提心；為入一切佛廣大智慧故，發菩提心；為顯現諸佛力、無所畏故，發菩提心。是為十。「佛子！\n\n**（条 25／201）發無上菩提心，為悟入一切智智故，親近供養善知識時，應起十種心**：\n\n> 若菩薩發無上菩提心，為悟入一切智智故，親近供養善知識時，應起十種心。何等為十？所謂：起給侍心、歡喜心、無違心、隨順心、無異求心、一向心、同善根心、同願心、如來心、同圓滿行心。是為十。「佛子！\n\n**（条 26／201）起如是心，則得十種清淨**：\n\n> 若菩薩摩訶薩起如是心，則得十種清淨。何等為十？所謂：深心清淨，到於究竟無失壞故；色身清淨，隨其所宜為示現故；音聲清淨，了達一切諸語言故；辯才清淨，善說無邊諸佛法故；智慧清淨，捨離一切愚癡暗故；受生清淨，具足菩薩自在力故；眷屬清淨，成就過去同行眾生諸善根故；果報清淨，除滅一切諸業障故；大願清淨，與諸菩薩性無二故；諸行清淨，以普賢乘而出離故。是為十。「佛子！\n\n**（条 27／201）有十種波羅蜜**：\n\n> 菩薩摩訶薩有十種波羅蜜。何等為十？所謂：施波羅蜜，悉捨一切諸所有故；戒波羅蜜，淨佛戒故；忍波羅蜜，住佛忍故；精進波羅蜜，一切所作不退轉故；禪波羅蜜，念一境故；般若波羅蜜，如實觀察一切法故；智波羅蜜，入佛力故；願波羅蜜，滿足普賢諸大願故；神通波羅蜜，示現一切自在用故；法波羅蜜，普入一切諸佛法故。是為十。若諸菩薩安住此法，則得具足如來無上大智波羅蜜。「佛子！\n\n**（条 28／201）有十種智隨覺**：\n\n> 菩薩摩訶薩有十種智隨覺。何等為十？所謂：一切世界無量差別智隨覺；一切眾生界不可思議智隨覺；一切諸法一入種種種種入一智隨覺；一切法界廣大智隨覺；一切虛空界究竟智隨覺；一切世界入過去世智隨覺；一切世界入未來世智隨覺；一切世界入現在世智隨覺；一切如來無量行願皆於一智而得圓滿智隨覺；三世諸佛皆同一行而得出離智隨覺。是為十。若諸菩薩安住此法，則得一切法自在光明，所願皆滿，於一念頃悉能解了一切佛法成等正覺。「佛子！\n\n**（条 29／201）有十種證知**：\n\n> 菩薩摩訶薩有十種證知。何等為十？所謂：知一切法一相；知一切法無量相；知一切法在一念；知一切眾生心行無礙；知一切眾生諸根平等；知一切眾生煩惱習氣行；知一切眾生心使行；知一切眾生善、不善行；知一切菩薩願行自在住持變化；知一切如來具足十力成等正覺。是為十。若諸菩薩安住此法，則得一切法善巧方便。「佛子！\n\n**（条 30／201）有十種力**：\n\n> 菩薩摩訶薩有十種力。何等為十？所謂：入一切法自性力；入一切法如化力；入一切法如幻力；入一切法皆是佛法力；於一切法無染著力；於一切法甚明解力；於一切善知識恒不捨離尊重心力；令一切善根順至無上智王力；於一切佛法深信不謗力；令一切智心不退善巧力。是為十。若諸菩薩安住此法，則具如來無上諸力。「佛子！\n\n**（条 31／201）有十種平等**：\n\n> 菩薩摩訶薩有十種平等。何等為十？所謂：於一切眾生平等、一切法平等、一切剎平等、一切深心平等、一切善根平等、一切菩薩平等、一切願平等、一切波羅蜜平等、一切行平等、一切佛平等。是為十。若諸菩薩安住此法，則得一切諸佛無上平等法。「佛子！\n\n**（条 32／201）有十種佛法實義句**：\n\n> 菩薩摩訶薩有十種佛法實義句。何等為十？所謂：一切法但有名；一切法猶如幻；一切法猶如影；一切法但緣起；一切法業清淨；一切法但文字所作；一切法實際；一切法無相；一切法第一義；一切法法界。是為十。若諸菩薩安住此法，則善入一切智智無上真實義。「佛子！\n\n**（条 33／201）說十種法**：\n\n> 菩薩摩訶薩說十種法。何等為十？所謂：說甚深法；說廣大法；說種種法；說一切智法；說隨順波羅蜜法；說出生如來力法；說三世相應法；說令菩薩不退法；說讚歎佛功德法；說一切菩薩學一切佛平等、一切如來境界相應法。是為十。若諸菩薩安住此法，則得如來無上巧說法。「佛子！\n\n**（条 34／201）有十種持**：\n\n> 菩薩摩訶薩有十種持。何等為十？所謂：持所集一切福德善根；持一切如來所說法；持一切譬諭；持一切法理趣門；持一切出生陀羅尼門；持一切除疑惑法；持成就一切菩薩法；持一切如來所說平等三昧門；持一切法照明門；持一切諸佛神通遊戲力。是為十。若諸菩薩安住此法，則得如來無上大智住持力。「佛子！\n\n**（条 35／201）有十種辯才**：\n\n> 菩薩摩訶薩有十種辯才。何等為十？所謂：於一切法無分別辯才；於一切法無所作辯才；於一切法無所著辯才；於一切法了達空辯才；於一切法無疑暗辯才；於一切法佛加被辯才；於一切法自覺悟辯才；於一切法文句差別善巧辯才；於一切法真實說辯才；隨一切眾生心令歡喜辯才。是為十。若諸菩薩安住此法，則得如來無上巧妙辯才。「佛子！\n\n**（条 36／201）有十種自在**：\n\n> 菩薩摩訶薩有十種自在。何等為十？所謂：教化調伏一切眾生自在；普照一切法自在；修一切善根行自在；廣大智自在；無所依戒自在；一切善根迴向菩提自在；精進不退轉自在；智慧摧破一切眾魔自在；隨所樂欲令發菩提心自在；隨所應化現成正覺自在。是為十。若諸菩薩安住此法，則得如來無上大智自在。「佛子！\n\n**（条 37／201）有十種無著**：\n\n> 菩薩摩訶薩有十種無著。何等為十？所謂：於一切世界無著；於一切眾生無著；於一切法無著；於一切所作無著；於一切善根無著；於一切受生處無著；於一切願無著；於一切行無著；於一切菩薩無著；於一切佛無著。是為十。若諸菩薩安住此法，則能速轉一切眾想，得無上清淨智慧。「佛子！\n\n**（条 38／201）有十種平等心**：\n\n> 菩薩摩訶薩有十種平等心。何等為十？所謂：積集一切功德平等心；發一切差別願平等心；於一切眾生身平等心；於一切眾生業報平等心；於一切法平等心；於一切淨穢國土平等心；於一切眾生解平等心；於一切行無所分別平等心；於一切佛力無畏平等心；於一切如來智慧平等心。是為十。若諸菩薩安住其中，則得如來無上大平等心。「佛子！\n\n**（条 39／201）有十種出生智慧**：\n\n> 菩薩摩訶薩有十種出生智慧。何等為十？所謂：知一切眾生解出生智慧；知一切佛剎種種差別出生智慧；知十方網分齊出生智慧；知覆仰等一切世界出生智慧；知一切法一性、種種性廣大住出生智慧；知一切種種身出生智慧；知一切世間顛倒妄想悉無所著出生智慧；知一切法究竟皆以一道出離出生智慧；知如來神力能入一切法界出生智慧；知三世一切眾生佛種不斷出生智慧。是為十。若諸菩薩安住此法，則於諸法無不了達。「佛子！\n\n**（条 40／201）有十種變化**：\n\n> 菩薩摩訶薩有十種變化。何等為十？所謂：一切眾生變化；一切身變化；一切剎變化；一切供養變化；一切音聲變化；一切行願變化；一切教化調伏眾生變化；一切成正覺變化；一切說法變化；一切加持變化。是為十。若諸菩薩安住此法，則得具足一切無上變化法。「佛子！\n\n**〔L.276 批·组 41–80 注入·14,134 CJK·0 手抄〕**\n\n**（条 41／201）有十種力持**：\n\n> 菩薩摩訶薩有十種力持。何等為十？所謂：佛力持；法力持；眾生力持；業力持；行力持；願力持；境界力持；時力持；善力持；智力持。是為十。若諸菩薩安住此法，則於一切法得無上自在力持。「佛子！\n\n**（条 42／201）有十種大欣慰**：\n\n> 菩薩摩訶薩有十種大欣慰。何等為十？所謂：諸菩薩發如是心：『盡未來世所有諸佛出興于世，我當皆得隨逐承事令生歡喜。』如是思惟，心大欣慰。復作是念：『彼諸如來出興於世，我當悉以無上供具恭敬供養。』如是思惟，心大欣慰。復作是念：『我於諸佛所興供養時，彼諸如來必示誨我法，我悉以深心恭敬聽受、如說修行，於菩薩地必得已生、現生、當生。\n>\n> 』如是思惟，心大欣慰。復作是念：『我當於不可說不可說劫行菩薩行，常與一切諸佛菩薩而得共俱。』如是思惟，心大欣慰。復作是念：『我於往昔未發無上大菩提心，有諸怖畏，所謂：不活畏、惡名畏、死畏、墮惡道畏、大眾威德畏。自一發心，悉皆遠離，不驚不恐，不畏不懼，不怯不怖，一切眾魔及諸外道所不能壞。\n>\n> 』如是思惟，心大欣慰。復作是念：『我當令一切眾生成無上菩提；成菩提已，我當於彼佛所修菩薩行盡其形壽，以大信心興所應供佛諸供養具而為供養；及涅槃後，各起無量塔供養舍利，及受持守護所有遺法。』如是思惟，心大欣慰。又作是念：『十方所有一切世界，我當悉以無上莊嚴而莊嚴之，皆令具足種種奇妙平等清淨，復以種種大神通力住持震動，光明照曜普使周遍。\n>\n> 』如是思惟，心大欣慰。復作是念：『我當斷一切眾生疑惑，淨一切眾生欲樂，啟一切眾生心意，滅一切眾生煩惱，閉一切眾生惡道門，開一切眾生善趣門，破一切眾生黑闇，與一切眾生光明，令一切眾生離眾魔業，使一切眾生至安隱處。』如是思惟，心大欣慰。\n>\n> 菩薩摩訶薩復作是念：『諸佛如來如優曇華，難可值遇，於無量劫莫能一見。我當於未來世欲見如來則便得見，諸佛如來常不捨我，恒住我所，令我得見，為我說法無有斷絕；既聞法已，心意清淨，遠離諂曲，質直無偽，於念念中常見諸佛。』如是思惟，心大欣慰。\n>\n> 復作是念：『我於未來當得成佛，以佛神力，於一切世界，為一切眾生各別示現成等正覺清淨無畏大師子吼，以本大願周遍法界，擊大法鼓，雨大法雨，作大法施，於無量劫常演正法，大悲所持身、語、意業無有疲厭。』如是思惟，心大欣慰。佛子！\n>\n> 是為菩薩摩訶薩十種大欣慰。若諸菩薩安住此法，則得無上成正覺智慧大欣慰。「佛子！\n\n**（条 43／201）有十種深入佛法**：\n\n> 菩薩摩訶薩有十種深入佛法。何等為十？所謂：入過去世一切世界；入未來世一切世界；入現在世世界數、世界行、世界說、世界清淨；入一切世界種種性；入一切眾生種種業報；入一切菩薩種種行；知過去一切佛次第；知未來一切佛次第；知現在十方虛空法界等一切諸佛、國土眾會、說法調伏；知世間法、聲聞法、獨覺法、菩薩法、如來法，雖知諸法皆無分別而說種種法，悉入法界無所入故，如其法說無所取著。是為十。若諸菩薩安住此法，則得入於阿耨多羅三藐三菩提大智慧甚深性。「佛子！\n\n**（条 44／201）有十種依止，菩薩依此行菩薩行**：\n\n> 菩薩摩訶薩有十種依止，菩薩依此行菩薩行。何等為十？所謂：依止供養一切諸佛，行菩薩行；依止調伏一切眾生，行菩薩行；依止親近一切善友，行菩薩行；依止積集一切善根，行菩薩行；依止嚴淨一切佛土，行菩薩行；依止不捨一切眾生，行菩薩行；依止深入一切波羅蜜，行菩薩行；依止滿足一切菩薩願，行菩薩行；依止無量菩提心，行菩薩行；依止一切佛菩提，行菩薩行。是為十。菩薩依此行菩薩行。「佛子！\n\n**（条 45／201）有十種發無畏心**：\n\n> 菩薩摩訶薩有十種發無畏心。何等為十？所謂：滅一切障礙業，發無畏心；於佛滅後護持正法，發無畏心；降伏一切魔，發無畏心；不惜身命，發無畏心；摧破一切外道邪論，發無畏心；令一切眾生歡喜，發無畏心；令一切眾會皆悉歡喜，發無畏心；調伏一切天、龍、夜叉、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽，發無畏心；離二乘地，入甚深法，發無畏心；於不可說不可說劫行菩薩行，心無疲厭，發無畏心。是為十。若諸菩薩安住此法，則得如來無上大智無所畏心。「佛子！\n\n**（条 46／201）發十種無疑心，於一切佛法心無疑惑**：\n\n> 菩薩摩訶薩發十種無疑心，於一切佛法心無疑惑。何等為十？所謂：菩薩摩訶薩發如是心：『我當以布施，攝一切眾生；以戒、忍、精進、禪定、智慧、慈、悲、喜、捨，攝一切眾生。』發此心時，決定無疑；若生疑心，無有是處。是為\n>\n> 第一發無疑心。菩薩摩訶薩又作是念：『未來諸佛出興于世，我當一切承事供養。』發此心時，決定無疑；若生疑心，無有是處。是為\n>\n> 第二發無疑心。菩薩摩訶薩又作是念：『我當以種種奇妙光明網，周遍莊嚴一切世界。』發此心時，決定無疑；若生疑心，無有是處。是為\n>\n> 第三發無疑心。菩薩摩訶薩又作是念：『我當盡未來劫修菩薩行。無數、無量、無邊、無等、不可數、不可稱、不可思、不可量、不可說、不可說不可說，過諸算數，究竟法界、虛空界一切眾生，我當悉以無上教化調伏法而成熟之。』發此心時，決定無疑；\n>\n> 若生疑心，無有是處。是為\n>\n> 第四發無疑心。菩薩摩訶薩又作是念：『我當修菩薩行，滿大誓願，具一切智，安住其中。』發此心時，決定無疑；若生疑心，無有是處。是為\n>\n> 第五發無疑心。菩薩摩訶薩又作是念：『我當普為一切世間行菩薩行，為一切法清淨光明，照明一切所有佛法。』發此心時，決定無疑；若生疑心，無有是處。是為\n>\n> 第六發無疑心。菩薩摩訶薩又作是念：『我當知一切法皆是佛法，隨眾生心，為其演說，悉令開悟。』發此心時，決定無疑；若生疑心，無有是處。是為\n>\n> 第七發無疑心。菩薩摩訶薩又作是念：『我當於一切法得無障礙門，知一切障礙不可得故；其心如是，無有疑惑，住真實性，乃至成於阿耨多羅三藐三菩提。』發此心時，決定無疑；若生疑心，無有是處。是為\n>\n> 第八發無疑心。菩薩摩訶薩又作是念：『我當知一切法莫不皆是出世間法，遠離一切妄想顛倒，以一莊嚴而自莊嚴而無所莊嚴；於此自了，不由他悟。』發此心時，決定無疑；若生疑心，無有是處。是為\n>\n> 第九發無疑心。菩薩摩訶薩又作是念：『我當於一切法成最正覺，離一切妄想顛倒故，得一念相應智故，若一若異不可得故，離一切數故，究竟無為故，離一切言說故，住不可說境界際故。』發此心時，決定無疑；若生疑心，無有是處。是為\n>\n> 第十發無疑心。若諸菩薩安住此法，則於一切佛法心無所疑。「佛子！\n\n**（条 47／201）有十種不可思議**：\n\n> 菩薩摩訶薩有十種不可思議。何等為十？所謂：一切善根，不可思議。一切誓願，不可思議。知一切法如幻，不可思議。發菩提心修菩薩行，善根不失，無所分別，不可思議。雖深入一切法，亦不取滅度，以一切願未成滿故，不可思議。修菩薩道而示現降神、入胎、誕生、出家、苦行、往詣道場、降伏眾魔、成最正覺、轉正法輪、入般涅槃，神變自在無有休息，不捨悲願救護眾生，不可思議。\n>\n> 雖能示現如來十力神變自在，而亦不捨等法界心教化眾生，不可思議。知一切法無相是相，相是無相，無分別是分別，分別是無分別，非有是有，有是非有，無作是作，作是無作，非說是說，說是非說，不可思議。知心與菩提等，知菩提與心等，心及菩提與眾生等，亦不生心顛倒、想顛倒、見顛倒，不可思議。\n>\n> 於念念中入滅盡定，盡一切漏而不證實際，亦不盡有漏善根；雖知一切法無漏，而知漏盡，亦知漏滅；雖知佛法即世間法，世間法即佛法，而不於佛法中分別世間法，不於世間法中分別佛法；一切諸法悉入法界，無所入故；知一切法皆無二，無變易故；\n>\n> 是為\n>\n> 第十不可思議。佛子！是為菩薩摩訶薩十種不可思議。若諸菩薩安住其中，則得一切諸佛無上不可思議法。「佛子！\n\n**（条 48／201）有十種巧密語**：\n\n> 菩薩摩訶薩有十種巧密語。何等為十？所謂：於一切佛經中，巧密語；於一切受生處，巧密語；於一切菩薩神通變現、成等正覺，巧密語；於一切眾生業報，巧密語；於一切眾生所起染淨，巧密語；於一切法究竟無障礙門，巧密語；於一切虛空界，一一方處悉有世界或成或壞，間無空處，巧密語；於一切法界、一切十方，乃至微細處，悉有如來示現初生，乃至成佛、入般涅槃，充滿法界悉分別見，巧密語；見一切眾生平等涅槃無變易故，而不捨大願，以一切智願未得圓滿令滿足故，巧密語；雖知一切法不由他悟，而不捨離諸善知識，於如來所轉加尊敬，與善知識和合無二，於諸善根修集種植，迴向安住，同一所作，同一體性，同一出離，同一成就，巧密語。是為十。若諸菩薩安住其中，則得如來無上善巧微密語。「佛子！\n\n**（条 49／201）有十種巧分別智**：\n\n> 菩薩摩訶薩有十種巧分別智。何等為十？所謂：入一切剎巧分別智；入一切眾生處巧分別智；入一切眾生心行巧分別智；入一切眾生根巧分別智；入一切眾生業報巧分別智；入一切聲聞行巧分別智；入一切獨覺行巧分別智；入一切菩薩行巧分別智；入一切世間法巧分別智；入一切佛法巧分別智。是為十。若諸菩薩安住其中，則得一切諸佛無上善巧分別諸法智。「佛子！\n\n**（条 50／201）有十種入三昧**：\n\n> 菩薩摩訶薩有十種入三昧。何等為十？所謂：於一切世界入三昧；於一切眾生身入三昧；於一切法入三昧；見一切佛入三昧；住一切劫入三昧；從三昧起現不思議身入三昧；於一切佛身入三昧；覺悟一切眾生平等入三昧；一念中入一切菩薩三昧智入三昧；一念中以無礙智成就一切諸菩薩行願無有休息入三昧。是為十。若諸菩薩安住其中，則得一切諸佛無上善巧三昧法。「佛子！\n\n**（条 51／201）有十種遍入**：\n\n> 菩薩摩訶薩有十種遍入。何等為十？所謂：眾生遍入；國土遍入；世間種種相遍入；火災遍入；水災遍入；佛遍入；莊嚴遍入；如來無邊功德身遍入；一切種種說法遍入；一切如來種種供養遍入。是為十。若諸菩薩安住其中，則得如來無上大智遍入法。「佛子！\n\n**（条 52／201）有十種解脫門**：\n\n> 菩薩摩訶薩有十種解脫門。何等為十？所謂：一身周遍一切世界解脫門；於一切世界示現無量種種色相解脫門；以一切世界入一佛剎解脫門；普加持一切眾生界解脫門；以一切佛莊嚴身充滿一切世界解脫門；於自身中見一切世界解脫門；一念中往一切世界解脫門；於一世界示現一切如來出世解脫門；一身充滿一切法界解脫門；一念中示現一切佛遊戲神通解脫門。是為十。若諸菩薩安住其中，則得如來無上解脫門。「佛子！\n\n**（条 53／201）有十種神通**：\n\n> 菩薩摩訶薩有十種神通。何等為十？所謂：憶念宿命方便智通；天耳無礙方便智通；知他眾生不思議心行方便智通；天眼觀察無有障礙方便智通；隨眾生心現不思議大神通力方便智通；一身普現無量世界方便智通；一念遍入不可說不可說世界方便智通；出生無量莊嚴具，莊嚴不思議世界方便智通；示現不可說變化身方便智通；隨不思議眾生心，於不可說世界現成阿耨多羅三藐三菩提方便智通。是為十。若諸菩薩安住其中，則得如來無上大善巧神通，為一切眾生種種示現，令其修學。「佛子！\n\n**（条 54／201）有十種明**：\n\n> 菩薩摩訶薩有十種明。何等為十？所謂：知一切眾生業報，善巧智明。知一切眾生境界，寂滅清淨，無諸戲論，善巧智明。知一切眾生種種所緣唯是一相悉不可得，一切諸法皆如金剛，善巧智明。能以無量微妙音聲，普聞十方一切世界，善巧智明。普壞一切心所染著，善巧智明。\n>\n> 能以方便示現受生或不受生，善巧智明。捨離一切想、受境界，善巧智明。知一切法非相、非無相，一性無性，無所分別，而能了知種種諸法，於無量劫分別演說，住於法界，成阿耨多羅三藐三菩提，善巧智明。菩薩摩訶薩知一切眾生生本無有生，了達受生不可得故，而知因、知緣、知事、知境界、知行、知生、知滅、知言說、知迷惑、知離迷惑、知顛倒、知離顛倒、知雜染、知清淨、知生死、知涅槃、知可得、知不可得、知執著、知無執著、知住、知動、知去、知還、知起、知不起、知失壞、知出離、知成熟、知諸根、知調伏，隨其所應種種教化，未曾忘失菩薩所行。\n>\n> 何以故？菩薩但為利益眾生故，發阿耨多羅三藐三菩提心，無餘所為。是故，菩薩常化眾生，身無疲倦，不違一切世間所作。是名：緣起善巧智明。菩薩摩訶薩於佛無著，不起著心；於法無著，不起著心；於剎無著，不起著心；於眾生無著，不起著心；\n>\n> 不見有眾生而行教化調伏說法，然亦不捨菩薩諸行，大悲大願，見佛聞法，隨順修行，依於如來種諸善根，恭敬供養無有休息，能以神力震動十方無量世界，其心廣大等法界故，知種種說法，知眾生數，知眾生差別，知苦生，知苦滅，知一切行皆如影像，行菩薩行，永斷一切受生根本，但為救護一切眾生，行菩薩行而無所行，隨順一切諸佛種性，發如大山王心，知一切虛妄顛倒，入一切種智門，智慧廣大不可傾動，當成正覺，於生死海平等濟渡一切眾生，善巧智明。\n>\n> 是為十。若諸菩薩安住其中，則得如來無上大善巧智明。「佛子！\n\n**（条 55／201）有十種解脫**：\n\n> 菩薩摩訶薩有十種解脫。何等為十？所謂：煩惱解脫；邪見解脫；諸取解脫；蘊、界、處解脫；超二乘解脫；無生法忍解脫；於一切世間、一切剎、一切眾生、一切法離著解脫；無邊住解脫；發起一切菩薩行入如來無分別地解脫；於一念中悉能了知一切三世解脫。是為十。若諸菩薩安住此法，則能施作無上佛事，教化成熟一切眾生。「佛子！\n\n**（条 56／201）有十種園林**：\n\n> 菩薩摩訶薩有十種園林。何等為十？所謂：生死是菩薩園林，無厭捨故；教化眾生是菩薩園林，不疲倦故；住一切劫是菩薩園林，攝諸大行故；清淨世界是菩薩園林，自所止住故；一切魔宮殿是菩薩園林，降伏彼眾故；思惟所聞法是菩薩園林，如理觀察故；六波羅蜜、四攝事、三十七菩提分法是菩薩園林，紹繼慈父境界故；十力、四無所畏、十八不共乃至一切佛法是菩薩園林，不念餘法故；示現一切菩薩威力自在神通是菩薩園林，以大神力轉正法輪調伏眾生無休息故；一念於一切處為一切眾生示成正覺是菩薩園林，法身周遍盡虛空一切世界故。是為十。若諸菩薩安住此法，則得如來無上離憂惱、大安樂行。「佛子！\n\n**（条 57／201）有十種宮殿**：\n\n> 菩薩摩訶薩有十種宮殿。何等為十？所謂：菩提心是菩薩宮殿，恒不忘失故；十善業道福德智慧是菩薩宮殿，教化欲界眾生故；四梵住禪定是菩薩宮殿，教化色界眾生故；生淨居天是菩薩宮殿，一切煩惱不染故；生無色界是菩薩宮殿，令諸眾生離難處故；生雜染世界是菩薩宮殿，令一切眾生斷煩惱故；現處內宮妻子、眷屬是菩薩宮殿，成就往昔同行眾生故；現居輪王、護世、釋、梵是菩薩宮殿，為調伏自在心眾生故；住一切菩薩行遊戲神通皆得自在是菩薩宮殿，善遊戲諸禪解脫三昧智慧故；一切佛所受無上自在、一切智王灌頂記是菩薩宮殿，住十力莊嚴作一切法王自在事故。是為十。若諸菩薩安住其中，則得法灌頂，於一切世間神力自在。「佛子！\n\n**（条 58／201）有十種所樂**：\n\n> 菩薩摩訶薩有十種所樂。何等為十？所謂：樂正念，心不散亂故；樂智慧，分別諸法故；樂往詣一切佛所，聽法無厭故；樂諸佛，充滿十方無邊際故；樂菩薩，自在為諸眾生以無量門而現身故；樂諸三昧門，於一三昧門入一切三昧門故；樂陀羅尼，持法不忘轉授眾生故；樂無礙辯才，於一文一句經不可說劫分別演說無窮盡故；樂成正覺，為一切眾生以無量門示現於身成正覺故；樂轉法輪，摧滅一切異道法故。是為十。若諸菩薩安住此法，則得一切諸佛如來無上法樂。「佛子！\n\n**（条 59／201）有十種莊嚴**：\n\n> 菩薩摩訶薩有十種莊嚴。何等為十？所謂：力莊嚴，不可壞故；無畏莊嚴，無能伏故；義莊嚴，說不可說義無窮盡故；法莊嚴，八萬四千法聚觀察演說無忘失故；願莊嚴，一切菩薩所發弘誓無退轉故；行莊嚴，修普賢行而出離故；剎莊嚴，以一切剎作一剎故；普音莊嚴，周遍一切諸佛世界雨法雨故；力持莊嚴，於一切劫行無數行不斷絕故；變化莊嚴，於一眾生身示現一切眾生數等身，令一切眾生悉得知見，求一切智無退轉故。是為十。若諸菩薩安住此法，則得如來一切無上法莊嚴。「佛子！\n\n**（条 60／201）發十種不動心**：\n\n> 菩薩摩訶薩發十種不動心。何等為十？所謂：於一切所有悉皆能捨不動心；思惟觀察一切佛法不動心；憶念供養一切諸佛不動心；於一切眾生誓無惱害不動心；普攝眾生不揀怨親不動心；求一切佛法無有休息不動心；一切眾生數等不可說不可說劫，行菩薩行不生疲厭亦無退轉不動心；成就有根信、無濁信、清淨信、極清淨信、離垢信、明徹信、恭敬供養一切佛信、不退轉信、不可盡信、無能壞信、大歡喜踊躍信不動心；成就出生一切智方便道不動心；聞一切菩薩行法信受不謗不動心。是為十。若諸菩薩安住此法，則得無上一切智不動心。「佛子！\n\n**（条 61／201）有十種不捨深大心**：\n\n> 菩薩摩訶薩有十種不捨深大心。何等為十？所謂：不捨成滿一切佛菩提深大心；不捨教化調伏一切眾生深大心；不捨不斷一切諸佛種性深大心；不捨親近一切善知識深大心；不捨供養一切諸佛深大心；不捨專求一切大乘功德法深大心；不捨於一切佛所修行梵行、護持淨戒深大心；不捨親近一切菩薩深大心；不捨求一切佛法方便護持深大心；不捨滿一切菩薩行願、集一切諸佛法深大心。是為十。若諸菩薩安住其中，則能不捨一切佛法。「佛子！\n\n**（条 62／201）有十種智慧觀察**：\n\n> 菩薩摩訶薩有十種智慧觀察。何等為十？所謂：善巧分別說一切法智慧觀察；了知三世一切善根智慧觀察；了知一切諸菩薩行自在變化智慧觀察；了知一切諸法義門智慧觀察；了知一切諸佛威力智慧觀察；了知一切陀羅尼門智慧觀察；於一切世界普說正法智慧觀察；入一切法界智慧觀察；知一切十方不可思議智慧觀察；知一切佛法智慧光明無有障礙智慧觀察。是為十。若諸菩薩安住其中，則得如來無上大智慧觀察。「佛子！\n\n**（条 63／201）有十種說法**：\n\n> 菩薩摩訶薩有十種說法。何等為十？所謂：說一切法皆從緣起；說一切法皆悉如幻；說一切法無有乖諍；說一切法無有邊際；說一切法無所依止；說一切法猶如金剛；說一切法皆悉如如；說一切法皆悉寂靜；說一切法皆悉出離；說一切法皆住一義，本性成就。是為十。若諸菩薩安住其中，則能善巧說一切法。「佛子！\n\n**（条 64／201）有十種清淨**：\n\n> 菩薩摩訶薩有十種清淨。何等為十？所謂：深心清淨；斷疑清淨；離見清淨；境界清淨；求一切智清淨；辯才清淨；無畏清淨；住一切菩薩智清淨；受一切菩薩律儀清淨；具足成就無上菩提、三十二種百福相、白淨法、一切善根清淨。是為十。若諸菩薩安住其中，則得一切如來無上清淨法。「佛子！\n\n**（条 65／201）有十種印**：\n\n> 菩薩摩訶薩有十種印。何等為十？所謂：菩薩摩訶薩知苦苦、壞苦、行苦，專求佛法，不生懈怠，行菩薩行，無有疲懈，不驚不畏，不恐不怖，不捨大願，求一切智，堅固不退，究竟阿耨多羅三藐三菩提，是為\n>\n> 第一印。菩薩摩訶薩見有眾生愚癡狂亂，或以麁弊惡語而相毀辱，或以刀杖瓦石而加損害，終不以此境界捨菩薩心，但忍辱柔和，專修佛法，住最勝道，入離生位，是為\n>\n> 第二印。菩薩摩訶薩聞說與一切智相應甚深佛法，能以自智，深信忍可，解了趣入，是為\n>\n> 第三印。菩薩摩訶薩又作是念：『我發深心求一切智，我當成佛得阿耨多羅三藐三菩提。一切眾生流轉五趣受無量苦，亦當令其發菩提心，深信歡喜，勤修精進，堅固不退。』是為\n>\n> 第四印。菩薩摩訶薩知如來智無有邊際，不以齊限測如來智；菩薩曾於無量佛所聞如來智無有邊際故，能不以齊限測度；一切世間文字所說皆有齊限，悉不能知如來智慧；是為\n>\n> 第五印。菩薩摩訶薩於阿耨多羅三藐三菩提得最勝欲、甚深欲、廣欲、大欲、種種欲、無能勝欲、無上欲、堅固欲、眾魔外道并其眷屬無能壞欲、求一切智不退轉欲，菩薩住如是等欲，於無上菩提畢竟不退，是為\n>\n> 第六印。菩薩摩訶薩行菩薩行，不顧身命，無能沮壞，發心趣向一切智故，一切智性常現前故，得一切佛智光明故，終不捨離佛菩提，終不捨離善知識，是為\n>\n> 第七印。菩薩摩訶薩若見善男子、善女人趣大乘者，令其增長求佛法心，令其安住一切善根，令其攝取一切智心，令其不退無上菩提，是為\n>\n> 第八印。菩薩摩訶薩令一切眾生得平等心，勸令勤修一切智道，以大悲心而為說法，令於阿耨多羅三藐三菩提永不退轉，是為\n>\n> 第九印。菩薩摩訶薩與三世諸佛同一善根，不斷一切諸佛種性，究竟得至一切智智，是為\n>\n> 第十印。佛子！是為菩薩摩訶薩十種印。菩薩以此速成阿耨多羅三藐三菩提，具足如來一切法無上智印。「佛子！\n\n**（条 66／201）有十種智光照**：\n\n> 菩薩摩訶薩有十種智光照。何等為十？所謂：知定當成阿耨多羅三藐三菩提智光照；見一切佛智光照；見一切眾生死此生彼智光照；解一切修多羅法門智光照；依善知識發菩提心集諸善根智光照；示現一切諸佛智光照；教化一切眾生悉令安住如來地智光照；演說不可思議廣大法門智光照；善巧了知一切諸佛神通威力智光照；滿足一切諸波羅蜜智光照。是為十。若諸菩薩安住此法，則得一切諸佛無上智光照。「佛子！\n\n**（条 67／201）有十種無等住，一切眾生、聲聞、獨覺悉無與等**：\n\n> 菩薩摩訶薩有十種無等住，一切眾生、聲聞、獨覺悉無與等。何等為十？所謂：菩薩摩訶薩雖觀實際而不取證，以一切願未成滿故，是為\n>\n> 第一無等住。菩薩摩訶薩種等法界一切善根，而不於中有少執著，是為\n>\n> 第二無等住。菩薩摩訶薩修菩薩行，知其如化，以一切法悉寂滅故，而於佛法不生疑惑，是為\n>\n> 第三無等住。菩薩摩訶薩雖離世間所有妄想，然能作意，於不可說劫行菩薩行，滿足大願，終不中起疲厭之心，是為\n>\n> 第四無等住。菩薩摩訶薩於一切法無所取著，以一切法性寂滅故，而不證涅槃。何以故？一切智道未成滿故，是為\n>\n> 第五無等住。菩薩摩訶薩知一切劫皆即非劫，而真實說一切劫數，是為\n>\n> 第六無等住。菩薩摩訶薩知一切法悉無所作，而不捨作道，求諸佛法，是為\n>\n> 第七無等住。菩薩摩訶薩知三界唯心、三世唯心，而了知其心無量無邊，是為\n>\n> 第八無等住。菩薩摩訶薩為一眾生，於不可說劫行菩薩行，欲令安住一切智地；如為一眾生，為一切眾生悉亦如是，而不生疲厭，是為\n>\n> 第九無等住。菩薩摩訶薩雖修行圓滿，而不證菩提。何以故？菩薩作如是念：『我之所作本為眾生，是故我應久處生死，方便利益，皆令安住無上佛道。』是為\n>\n> 第十無等住。佛子！是為菩薩摩訶薩十種無等住。若諸菩薩安住其中，則得無上大智、一切佛法無等住。「佛子！\n\n**（条 68／201）發十種無下劣心**：\n\n> 菩薩摩訶薩發十種無下劣心。何等為十？佛子！菩薩摩訶薩作如是念：『我當降伏一切天魔及其眷屬。』是為\n>\n> 第一無下劣心。又作是念：『我當悉破一切外道及其邪法。』是為\n>\n> 第二無下劣心。又作是念：『我當於一切眾生善言開諭皆令歡喜。』是為\n>\n> 第三無下劣心。又作是念：『我當成滿遍法界一切波羅蜜行。』是為\n>\n> 第四無下劣心。又作是念：『我當積集一切福德藏。』是為\n>\n> 第五無下劣心。又作是念：『無上菩提廣大難成，我當修行悉令圓滿。』是為\n>\n> 第六無下劣心。又作是念：『我當以無上教化、無上調伏，教化調伏一切眾生。』是為\n>\n> 第七無下劣心。又作是念：『一切世界種種不同，我當以無量身成等正覺。』是為\n>\n> 第八無下劣心。又作是念：『我修菩薩行時，若有眾生來從我乞手足、耳鼻、血肉、骨髓、妻子、象馬乃至王位，如是一切悉皆能捨，不生一念憂悔之心，但為利益一切眾生，不求果報，以大悲為首，大慈究竟。』是為\n>\n> 第九無下劣心。又作是念：『三世所有一切諸佛，一切佛法、一切眾生、一切國土、一切世間、一切三世、一切虛空界、一切法界、一切語言施設界、一切寂滅涅槃界，如是一切種種諸法，我當以一念相應慧，悉知悉覺，悉見悉證，悉修悉斷，然於其中無分別、離分別、無種種無差別、無功德、無境界、非有非無、非一非二。\n>\n> 以不二智知一切二，以無相智知一切相，以無分別智知一切分別，以無異智知一切異，以無差別智知一切差別，以無世間智知一切世間，以無世智知一切世，以無眾生智知一切眾生，以無執著智知一切執著，以無住處智知一切住處，以無雜染智知一切雜染，以無盡智知一切盡，以究竟法界智於一切世界示現身，以離言音智示不可說言音，以一自性智入於無自性，以一境界智現種種境界；\n>\n> 知一切法不可說，而現大自在言說，證一切智地；為教化調伏一切眾生故，於一切世間示現大神通變化。』是為\n>\n> 第十無下劣心。佛子！是為菩薩摩訶薩發十種無下劣心。若諸菩薩安住此心，則得一切最上無下劣佛法。「佛子！\n\n**（条 69／201）於阿耨多羅三藐三菩提，有十種如山增上心**：\n\n> 菩薩摩訶薩於阿耨多羅三藐三菩提，有十種如山增上心。何等為十？佛子！菩薩摩訶薩常作意勤修一切智法，是為\n>\n> 第一如山增上心。恒觀一切法本性空無所得，是為\n>\n> 第二如山增上心。願於無量劫行菩薩行，修一切白淨法，以住一切白淨法故，知見如來無量智慧，是為\n>\n> 第三如山增上心。為求一切佛法故，等心敬奉諸善知識，無異希求，無盜法心，唯生尊重，未曾有意，一切所有悉皆能捨，是為\n>\n> 第四如山增上心。若有眾生罵辱、毀謗、打棒、屠割，苦其形體，乃至斷命，如是等事悉皆能受，終不因此生動亂心、生瞋害心，亦不退捨大悲弘誓，更令增長無有休息。何以故？菩薩於一切法如實出離，捨成就故；證得一切諸如來法，忍辱柔和已自在故。\n>\n> 是為\n>\n> 第五如山增上心。菩薩摩訶薩成就增上大功德，所謂：天增上功德、人增上功德、色增上功德、力增上功德、眷屬增上功德、欲增上功德、王位增上功德、自在增上功德、福德增上功德、智慧增上功德。雖復成就如是功德，終不於此而生染著，所謂：不著味、不著欲、不著財富、不著眷屬；\n>\n> 但深樂法，隨法去、隨法住、隨法趣向、隨法究竟，以法為依、以法為救、以法為歸、以法為舍，守護法、愛樂法、希求法、思惟法。佛子！菩薩摩訶薩雖復具受種種法樂，而常遠離眾魔境界。何以故？菩薩摩訶薩於過去世發如是心：『我當令一切眾生皆悉永離眾魔境界，住佛境界故。\n>\n> 』是為\n>\n> 第六如山增上心。菩薩摩訶薩為求阿耨多羅三藐三菩提，已於無量阿僧祇劫行菩薩道精勤匪懈，猶謂：『我今始發阿耨多羅三藐三菩提心。』行菩薩行，亦不驚、亦不怖、亦不畏。雖能一念即成阿耨多羅三藐三菩提，然為眾生故，於無量劫行菩薩行無有休息，是為\n>\n> 第七如山增上心。菩薩摩訶薩知一切眾生性不和善，難調難度，不能知恩，不能報恩，是故為其發大誓願，欲令皆得心意自在，所行無礙，捨離惡念，不於他所生諸煩惱，是為\n>\n> 第八如山增上心。菩薩摩訶薩復作是念：『非他令我發菩提心，亦不待人助我修行。我自發心，集諸佛法，誓期自勉，盡未來劫行菩薩道，成阿耨多羅三藐三菩提。是故我今修菩薩行，當淨自心亦淨他心，當知自境界亦知他境界，我當悉與三世諸佛境界平等。\n>\n> 』是為\n>\n> 第九如山增上心。菩薩摩訶薩作如是觀：『無有一法修菩薩行，無有一法滿菩薩行，無有一法教化調伏一切眾生，無有一法供養恭敬一切諸佛，無有一法於阿耨多羅三藐三菩提已成、今成、當成，無有一法已說、今說、當說，說者及法俱不可得，而亦不捨阿耨多羅三藐三菩提願。\n>\n> 』何以故？菩薩求一切法皆無所得，如是出生阿耨多羅三藐三菩提。是故，於法雖無所得，而勤修習增上善業，清淨對治，智慧圓滿，念念增長，一切具足。其心於此不驚不怖，不作是念：『若一切法皆悉寂滅，我有何義求於無上菩提之道？』是為\n>\n> 第十如山增上心。佛子！是為菩薩摩訶薩於阿耨多羅三藐三菩提十種如山增上心。若諸菩薩安住其中，則得如來無上大智山王增上心。「佛子！\n\n**（条 70／201）有十種入阿耨多羅三藐三菩提如海智**：\n\n> 菩薩摩訶薩有十種入阿耨多羅三藐三菩提如海智。何等為十？所謂：入一切無量眾生界，是為\n>\n> 第一如海智。入一切世界而不起分別，是為\n>\n> 第二如海智。知一切虛空界無量無礙，普入十方一切差別世界網，是為\n>\n> 第三如海智。菩薩摩訶薩善入法界，所謂：無礙入、不斷入、不常入、無量入、不生入、不滅入、一切入，悉了知故，是為\n>\n> 第四如海智。菩薩摩訶薩於過去、未來、現在諸佛、菩薩、法師、聲聞、獨覺及一切凡夫所集善根已集、現集、當集，三世諸佛於阿耨多羅三藐三菩提已成、今成、當成所有善根，三世諸佛說法調伏一切眾生已說、今說、當說所有善根，於彼一切皆悉了知，深信隨喜，願樂修習，無有厭足，是為\n>\n> 第五如海智。菩薩摩訶薩於念念中入過去世不可說劫，於一劫中，或百億佛出世，或千億佛出世，或百千億佛出世，或無數、或無量、或無邊、或無等、或不可數、或不可稱、或不可思、或不可量、或不可說、或不可說不可說，超過算數諸佛世尊出興于世，及彼諸佛道場眾會聲聞、菩薩說法調伏，一切眾生壽命延促，法住久近，如是一切悉皆明見；\n>\n> 如一劫，一切諸劫皆亦如是。其無佛劫所有眾生，有於阿耨多羅三藐三菩提種諸善根，亦悉了知；若有眾生善根熟已，於未來世當得見佛，亦悉了知。如是觀察過去世不可說不可說劫，心無厭足，是為\n>\n> 第六如海智。菩薩摩訶薩入未來世，觀察分別一切諸劫無量無邊，知何劫有佛，何劫無佛，何劫有幾如來出世，一一如來名號何等，住何世界，世界名何，度幾眾生，壽命幾時。如是觀察，盡未來際皆悉了知，不可窮盡而無厭足，是為\n>\n> 第七如海智。菩薩摩訶薩入現在世觀察思惟，於念念中普見十方無邊品類不可說世界，皆有諸佛於無上菩提已成、今成、當成，往詣道場菩提樹下，坐吉祥草，降伏魔軍，成阿耨多羅三藐三菩提；從此起已，入於城邑，昇天宮殿，說微妙法，轉大法輪，示現神通，調伏眾生，乃至付囑阿耨多羅三藐三菩提法，捨於壽命，入般涅槃；\n>\n> 入涅槃已，結集法藏令久住世，莊嚴佛塔種種供養。亦見彼世界所有眾生，值佛聞法，受持諷誦，憶念思惟，增長慧解。如是觀察普遍十方，而於佛法無有錯謬。何以故？菩薩摩訶薩了知諸佛皆悉如夢，而能往詣一切佛所恭敬供養。菩薩爾時，不著自身、不著諸佛、不著世界、不著眾會、不著說法、不著劫數，然見佛聞法，觀察世界，入諸劫數，無有厭足，是為\n>\n> 第八如海智。菩薩摩訶薩於不可說不可說劫一一劫中，供養恭敬不可說不可說無量諸佛，示現自身歿此生彼，以出過三界一切供具而為供養，并及供養菩薩、聲聞、一切大眾；一一如來般涅槃後，皆以無上供具供養舍利，及廣行惠施滿足眾生。佛子！\n>\n> 菩薩摩訶薩以不可思議心、不求報心、究竟心、饒益心，於不可說不可說劫，為阿耨多羅三藐三菩提故，供養諸佛，饒益眾生，護持正法，開示演說，是為\n>\n> 第九如海智。菩薩摩訶薩於一切佛所、一切菩薩所、一切法師所，一向專求菩薩所說法、菩薩所學法、菩薩所教法、菩薩修行法、菩薩清淨法、菩薩成熟法、菩薩調伏法、菩薩平等法、菩薩出離法、菩薩總持法；得此法已，受持讀誦，分別解說，無有厭足；\n>\n> 令無量眾生，於佛法中，發一切智相應心，入真實相，於阿耨多羅三藐三菩提得不退轉。菩薩如是於不可說不可說劫無有厭足，是為\n>\n> 第十如海智。佛子！是為菩薩摩訶薩十種入阿耨多羅三藐三菩提如海智。若諸菩薩安住此法，則得一切諸佛無上大智慧海。「佛子！\n\n**（条 71／201）於阿耨多羅三藐三菩提，有十種如寶住**：\n\n> 菩薩摩訶薩於阿耨多羅三藐三菩提，有十種如寶住。何等為十？佛子！菩薩摩訶薩悉能往詣無數世界諸如來所，瞻覲頂禮，承事供養，是為\n>\n> 第一如寶住。於不思議諸如來所，聽聞正法，受持憶念，不令忘失，分別思惟，覺慧增長，如是所作充滿十方，是為\n>\n> 第二如寶住。於此剎歿，餘處現生，而於佛法無所迷惑，是為\n>\n> 第三如寶住。知從一法出一切法，而能各各分別演說，以一切法種種義究竟皆是一義故，是為\n>\n> 第四如寶住。知厭離煩惱，知止息煩惱，知防護煩惱，知除斷煩惱，修菩薩行不證實際，究竟到於實際彼岸，方便善巧，善學所學，令往昔願行皆得成滿，身不疲倦，是為\n>\n> 第五如寶住。知一切眾生心所分別皆無處所，而亦說有種種方處；雖無分別、無所造作，為欲調伏一切眾生而有修行、而有所作，是為\n>\n> 第六如寶住。知一切法皆同一性，所謂：無性，無種種性，無無量性，無可算數性，無可稱量性，無色無相，若一若多皆不可得，而決定了知此是諸佛法、此是菩薩法、此是獨覺法、此是聲聞法、此是凡夫法、此是善法、此是不善法、此是世間法、此是出世間法、此是過失法、此是無過失法、此是有漏法、此是無漏法，乃至此是有為法、此是無為法，是為\n>\n> 第七如寶住。菩薩摩訶薩求佛不可得、求菩薩不可得、求法不可得、求眾生不可得，而亦不捨調伏眾生令於諸法成正覺願。何以故？菩薩摩訶薩善巧觀察，知一切眾生分別，知一切眾生境界，方便化導令得涅槃；為欲滿足化眾生願，熾然修行菩薩行故。\n>\n> 是為\n>\n> 第八如寶住。菩薩摩訶薩知善巧說法、示現涅槃，為度眾生所有方便，一切皆是心想建立，非是顛倒，亦非虛誑。何以故？菩薩了知一切諸法三世平等、如如不動、實際無住，不見有一眾生已受化、今受化、當受化，亦自了知無所修行，無有少法若生若滅而可得者，而依於一切法，令所願不空。\n>\n> 是為\n>\n> 第九如寶住。菩薩摩訶薩於不思議無量諸佛一一佛所，聞不可說不可說授記法，名號各異，劫數不同；從於一劫乃至不可說不可說劫常如是聞，聞已修行，不驚不怖，不迷不惑，知如來智不思議故，如來授記言無二故，自身行願殊勝力故，隨應受化令成阿耨多羅三藐三菩提滿等法界一切願故，是為\n>\n> 第十如寶住。佛子！是為菩薩摩訶薩於阿耨多羅三藐三菩提十種如寶住。若諸菩薩安住此法，則得諸佛無上大智慧寶。「佛子！\n\n**（条 72／201）發十種如金剛大乘誓願心**：\n\n> 菩薩摩訶薩發十種如金剛大乘誓願心。何等為十？佛子！菩薩摩訶薩作如是念：『一切諸法，無有邊際，不可窮盡。我當以盡三世智，普皆覺了，無有遺餘。』是為\n>\n> 第一如金剛大乘誓願心。菩薩摩訶薩又作是念：『於一毛端處有無量無邊眾生，何況一切法界！我當皆以無上涅槃而滅度之。』是為\n>\n> 第二如金剛大乘誓願心。菩薩摩訶薩又作是念：『十方世界，無量無邊，無有齊限，不可窮盡。我當以諸佛國土最上莊嚴，莊嚴如是一切世界，所有莊嚴皆悉真實。』是為\n>\n> 第三如金剛大乘誓願心。菩薩摩訶薩又作是念：『一切眾生，無量無邊，無有齊限，不可窮盡。我當以一切善根，迴向於彼無上智光，照曜於彼。』是為\n>\n> 第四如金剛大乘誓願心。菩薩摩訶薩又作是念：『一切諸佛，無量無邊，無有齊限，不可窮盡。我當以所種善根迴向供養，悉令周遍，無所闕少，然後我當成阿耨多羅三藐三菩提。』是為\n>\n> 第五如金剛大乘誓願心。佛子！菩薩摩訶薩見一切佛，聞所說法生大歡喜，不著自身，不著佛身，解如來身非實非虛、非有非無、非性非無性、非色非無色、非相非無相、非生非滅，實無所有，亦不壞有。何以故？不可以一切性相而取著故。是為\n>\n> 第六如金剛大乘誓願心。佛子！菩薩摩訶薩，或有眾生訶罵毀呰、撾打楚撻，或截手足，或割耳鼻，或挑其目，或級其頭；如是一切皆能忍受，終不因此生恚害心。於不可說不可說無央數劫修菩薩行，攝受眾生恒無廢捨。何以故？菩薩摩訶薩已善觀察一切諸法無有二相，心不動亂，能捨自身忍其苦故。\n>\n> 是為\n>\n> 第七如金剛大乘誓願心。佛子！菩薩摩訶薩又作是念：『未來世劫，無量無邊，無有齊限，不可窮盡。我當盡彼劫，於一世界，行菩薩道教化眾生；如一世界，盡法界、虛空界、一切世界悉亦如是，而心不驚、不怖、不畏。何以故？為菩薩道法應如是，為一切眾生而修行故。\n>\n> 』是為\n>\n> 第八如金剛大乘誓願心。佛子！菩薩摩訶薩又作是念：『阿耨多羅三藐三菩提以心為本，心若清淨，則能圓滿一切善根，於佛菩提必得自在，欲成阿耨多羅三藐三菩提隨意即成。若欲除斷一切取緣，住一向道，我亦能得，而我不斷，為欲究竟佛菩提故，亦不即證無上菩提。\n>\n> 何以故？為滿本願，盡一切世界行菩薩行化眾生故。』是為\n>\n> 第九如金剛大乘誓願心。佛子！菩薩摩訶薩知佛不可得、菩提不可得、菩薩不可得、一切法不可得、眾生不可得、心不可得、行不可得、過去不可得、未來不可得、現在不可得、一切世間不可得、有為無為不可得。菩薩如是寂靜住、甚深住、寂滅住、無諍住、無言住、無二住、無等住、自性住、如理住、解脫住、涅槃住、實際住，而亦不捨一切大願，不捨薩婆若心，不捨菩薩行，不捨教化眾生，不捨諸波羅蜜，不捨調伏眾生，不捨承事諸佛，不捨演說諸法，不捨莊嚴世界。\n>\n> 何以故？菩薩摩訶薩發大願故，雖復了達一切法相，大慈悲心轉更增長，無量功德皆具修行，於諸眾生心不捨離。何以故？『一切諸法皆無所有，凡夫愚迷不知不覺，我當令彼悉得開悟，於諸法性分明照了。』何以故？『一切諸佛安住寂滅，而以大悲心，於諸世間說法教化曾無休息。\n>\n> 我今云何而捨大悲？又我先發廣大誓願心，發決定利益一切眾生心，發積集一切善根心，發安住善巧迴向心，發出生甚深智慧心，發含受一切眾生心，發於一切眾生平等心；作真實語、不虛誑語，願與一切眾生無上大法，願不斷一切諸佛種性。今一切眾生未得解脫、未成正覺、未具佛法，大願未滿，云何而欲捨離大悲？\n>\n> 』是為\n>\n> 第十如金剛大乘誓願心。佛子！是為菩薩摩訶薩發十種如金剛大乘誓願心。若諸菩薩安住此法，則得如來金剛性無上大神通智「佛子！\n\n**（条 73／201）有十種大發起**：\n\n> 菩薩摩訶薩有十種大發起。何等為十？佛子！菩薩摩訶薩作如是念：『我當供養恭敬一切諸佛。』是為\n>\n> 第一大發起。又作是念：『我當長養一切菩薩所有善根。』是為\n>\n> 第二大發起。又作是念：『我當於一切如來般涅槃後，莊嚴佛塔，以一切華、一切鬘、一切香、一切塗香、一切末香、一切衣、一切蓋、一切幢、一切幡而供養之，受持守護彼佛正法。』是為\n>\n> 第三大發起。又作是念：『我當教化調伏一切眾生，令得阿耨多羅三藐三菩提。』是為\n>\n> 第四大發起。又作是念：『我當以諸佛國土無上莊嚴，而以莊嚴一切世界。』是為\n>\n> 第五大發起。又作是念：『我當發大悲心，為一眾生，於一切世界，一一各盡未來際劫行菩薩行；如為一眾生，為一切眾生悉亦如是，皆令得佛無上菩提，乃至不生一念疲懈。』是為\n>\n> 第六大發起。又作是念：『彼諸如來無量無邊，我當於一如來所，經不思議劫恭敬供養；如於一如來，於一切如來悉亦如是。』是為\n>\n> 第七大發起。菩薩摩訶薩又作是念：『彼諸如來滅度之後，我當為一一如來所有舍利各起寶塔，其量高廣與不可說諸世界等；造佛形像亦復如是，於不可思議劫以一切寶幢、幡蓋、香華、衣服而為供養，不生一念厭倦之心。為成就佛法故，為供養諸佛故，為教化眾生故，為護持正法開示演說故。\n>\n> 』是為\n>\n> 第八大發起。菩薩摩訶薩又作是念：『我當以此善根成無上菩提，得入一切諸如來地，與一切如來體性平等。』是為\n>\n> 第九大發起。菩薩摩訶薩復作是念：『我當成正覺已，於一切世界不可說劫，演說正法，示現不可思議自在神通，身、語及意不生疲倦，不離正法。以佛力所持故，為一切眾生勤行大願故，大慈為首故，大悲究竟故，達無相法故，住真實語故，證一切法皆寂滅故；\n>\n> 知一切眾生悉不可得而亦不違諸業所作故，與三世佛同一體故，周遍法界、虛空界故，通達諸法無相故，成就不生不滅故，具足一切佛法故，以大願力調伏眾生，作大佛事無有休息。』是為\n>\n> 第十大發起。佛子！是為菩薩摩訶薩十種大發起。若諸菩薩安住此法，則不斷菩薩行，具足如來無上大智。「佛子！\n\n**（条 74／201）有十種究竟大事**：\n\n> 菩薩摩訶薩有十種究竟大事。何等為十？所謂：恭敬供養一切如來究竟大事；隨所念眾生悉能救護究竟大事；專求一切佛法究竟大事；積集一切善根究竟大事；思惟一切佛法究竟大事；滿足一切誓願究竟大事；成就一切菩薩行究竟大事；奉事一切善知識究竟大事；往詣一切世界諸如來所究竟大事；聞持一切諸佛正法究竟大事。是為十。若諸菩薩安住此法，則得阿耨多羅三藐三菩提大智慧究竟事。「佛子！\n\n**（条 75／201）有十種不壞信**：\n\n> 菩薩摩訶薩有十種不壞信。何等為十？所謂：於一切佛不壞信；於一切佛法不壞信；於一切聖僧不壞信；於一切菩薩不壞信；於一切善知識不壞信；於一切眾生不壞信；於一切菩薩大願不壞信；於一切菩薩行不壞信；於恭敬供養一切諸佛不壞信；於菩薩巧密方便教化調伏一切眾生不壞信。是為十。若諸菩薩安住此法，則得諸佛無上大智慧不壞信。「佛子！\n\n**（条 76／201）有十種得授記**：\n\n> 菩薩摩訶薩有十種得授記。何等為十？所謂：內有甚深解得授記；能隨順起菩薩諸善根得授記；修廣大行得授記；現前得授記；不現前得授記；因自心證菩提得授記；成就忍得授記；教化調伏眾生得授記；究竟一切劫數得授記；一切菩薩行自在得授記。是為十。若諸菩薩安住此法，則於一切諸佛所而得授記。「佛子！\n\n**（条 77／201）有十種善根迴向，菩薩由此能以一切善根悉皆迴向**：\n\n> 菩薩摩訶薩有十種善根迴向，菩薩由此能以一切善根悉皆迴向。何等為十？所謂：以我善根同善知識願，如是成就，莫別成就；以我善根同善知識心，如是成就，莫別成就；以我善根同善知識行，如是成就，莫別成就；以我善根同善知識善根，如是成就，莫別成就；以我善根同善知識平等，如是成就，莫別成就；以我善根同善知識念，如是成就，莫別成就；以我善根同善知識清淨，如是成就，莫別成就；以我善根同善知識所住，如是成就，莫別成就；以我善根同善知識成滿，如是成就，莫別成就；以我善根同善知識不壞，如是成就，莫別成就。是為十。若諸菩薩安住此法，則得無上善根迴向。「佛子！\n\n**（条 78／201）有十種得智慧**：\n\n> 菩薩摩訶薩有十種得智慧。何等為十？所謂：於施自在得智慧；深解一切佛法得智慧；入如來無邊智得智慧；於一切問答中能斷疑得智慧；入於智者義得智慧；深解一切如來於一切佛法中言音善巧得智慧；深解於諸佛所種少善根必能滿足一切白淨法獲如來無量智得智慧；成就菩薩不思議住得智慧；於一念中悉能往詣不可說佛剎得智慧；覺一切佛菩提、入一切法界聞持一切佛所說法、深入一切如來種種莊嚴言音得智慧。是為十。若諸菩薩安住此法，則得一切諸佛無上現證智。「佛子！\n\n**（条 79／201）有十種發無量無邊廣大心**：\n\n> 菩薩摩訶薩有十種發無量無邊廣大心。何等為十？所謂：於一切諸佛所，發無量無邊廣大心；觀一切眾生界，發無量無邊廣大心；觀一切剎、一切世、一切法界，發無量無邊廣大心；觀察一切法皆如虛空，發無量無邊廣大心；觀察一切菩薩廣大行，發無量無邊廣大心；正念三世一切諸佛，發無量無邊廣大心；觀不思議諸業果報，發無量無邊廣大心；嚴淨一切佛剎，發無量無邊廣大心；遍入一切諸佛大會，發無量無邊廣大心；觀察一切如來妙音，發無量無邊廣大心。是為十。若諸菩薩安住此心，則得一切佛法無量無邊廣大智慧海。「佛子！\n\n**（条 80／201）有十種伏藏**：\n\n> 菩薩摩訶薩有十種伏藏。何等為十？所謂：知一切法是起功德行藏；知一切法是正思惟藏；知一切法是陀羅尼照明藏；知一切法是辯才開演藏；知一切法是不可說善覺真實藏；知一切佛自在神通是觀察示現藏；知一切法是善巧出生平等藏；知一切法是常見一切諸佛藏；知一切不思議劫是善了皆如幻住藏；知一切諸佛菩薩是發生歡喜淨信藏。是為十。若諸菩薩安住此法，則得一切諸佛無上智慧法藏，悉能調伏一切眾生。「佛子！\n\n**〔L.277 批·组 81–120 注入·9,348 CJK·0 手抄〕**\n\n**（条 81／201）有十種律儀**：\n\n> 菩薩摩訶薩有十種律儀。何等為十？所謂：於一切佛法不生誹謗律儀；於一切佛所信樂心不可壞律儀；於一切菩薩所起尊重恭敬律儀；於一切善知識所終不捨愛樂心律儀；於一切聲聞、獨覺不生憶念心律儀；遠離一切退菩薩道律儀；不起一切損害眾生心律儀；修一切善根皆令究竟律儀；於一切魔悉能降伏律儀；於一切波羅蜜皆令滿足律儀。是為十。若諸菩薩安住此法，則得無上大智律儀。「佛子！\n\n**（条 82／201）有十種自在**：\n\n> 菩薩摩訶薩有十種自在。何等為十？所謂：命自在，於不可說劫住壽命故；心自在，智慧能入阿僧祇諸三昧故；資具自在，能以無量莊嚴莊嚴一切世界故；業自在，隨時受報故；受生自在，於一切世界示現受生故；解自在，於一切世界見佛充滿故；願自在，隨欲隨時於諸剎中成正覺故；神力自在，示現一切大神變故；法自在，示現無邊諸法門故；智自在，於念念中示現如來十力、無畏、成正覺故。是為十。若諸菩薩安住此法，則得圓滿一切諸佛諸波羅蜜智慧神力菩提自在。「佛子！\n\n**（条 83／201）有十種無礙用**：\n\n> 菩薩摩訶薩有十種無礙用。何等為十？所謂：眾生無礙用；國土無礙用；法無礙用；身無礙用；願無礙用；境界無礙用；智無礙用；神通無礙用；神力無礙用；力無礙用。「佛子！云何為菩薩摩訶薩眾生等無礙用？「佛子！\n\n**（条 84／201）有十種眾生無礙用**：\n\n> 菩薩摩訶薩有十種眾生無礙用。何等為十？所謂：知一切眾生無眾生無礙用；知一切眾生但想所持無礙用；為一切眾生說法未曾失時無礙用；普化現一切眾生界無礙用；置一切眾生於一毛孔中而不迫隘無礙用；為一切眾生示現他方一切世界令其悉見無礙用；為一切眾生示現釋、梵、護世諸天身無礙用；為一切眾生示現聲聞、辟支佛寂靜威儀無礙用；為一切眾生示現菩薩行無礙用；為一切眾生示現諸佛色身相好、一切智力、成等正覺無礙用。是為十。「佛子！\n\n**（条 85／201）有十種國土無礙用**：\n\n> 菩薩摩訶薩有十種國土無礙用。何等為十？所謂：一切剎作一剎無礙用；一切剎入一毛孔無礙用；知一切剎無有盡無礙用；一身結跏坐充滿一切剎無礙用；一身中現一切剎無礙用；震動一切剎不令眾生恐怖無礙用；以一切剎莊嚴具莊嚴一剎無礙用；以一剎莊嚴具莊嚴一切剎無礙用；以一如來一眾會遍一切佛剎示現眾生無礙用；一切小剎、中剎、大剎、廣剎、深剎、仰剎、覆剎、側剎、正剎，遍諸方網，無量差別，以此普示一切眾生無礙用。是為十。「佛子！\n\n**（条 86／201）有十種法無礙用**：\n\n> 菩薩摩訶薩有十種法無礙用。何等為十？所謂：知一切法入一法、一法入一切法，而亦不違眾生心解無礙用；從般若波羅蜜出生一切法，為他解說悉令開悟無礙用；知一切法離文字，而令眾生皆得悟入無礙用；知一切法入一相，而能演說無量法相無礙用；知一切法離言說，能為他說無邊法門無礙用；於一切法善轉普門字輪無礙用；以一切法入一法門而不相違，於不可說劫說不窮盡無礙用；以一切法悉入佛法，令諸眾生皆得悟解無礙用；知一切法無有邊際無礙用；知一切法無障礙際，猶如幻網無量差別，於無量劫為眾生說不可窮盡無礙用。是為十。「佛子！\n\n**（条 87／201）有十種身無礙用**：\n\n> 菩薩摩訶薩有十種身無礙用。何等為十？所謂：以一切眾生身入己身無礙用；以己身入一切眾生身無礙用；一切佛身入一佛身無礙用；一佛身入一切佛身無礙用；一切剎入己身無礙用；以一身充遍一切三世法示現眾生無礙用；於一身示現無邊身入三昧無礙用；於一身示現眾生數等身成正覺無礙用；於一切眾生身現一眾生身、於一眾生身現一切眾生身無礙用；於一切眾生身示現法身、於法身示現一切眾生身無礙用。是為十。「佛子！\n\n**（条 88／201）有十種願無礙用**：\n\n> 菩薩摩訶薩有十種願無礙用。何等為十？所謂：以一切菩薩願作自願無礙用；以一切佛成菩提願力示現自成正覺無礙用；隨所化眾生自成阿耨多羅三藐三菩提無礙用；於一切無邊際劫大願不斷無礙用；遠離識身，不著智身，以自在願現一切身無礙用；捨棄自身成滿他願無礙用；普教化一切眾生而不捨大願無礙用；於一切劫行菩薩行而大願不斷無礙用；於一毛孔現成正覺，以願力故，充遍一切諸佛國土，於不可說不可說世界，為一一眾生如是示現無礙用；說一句法遍一切法界，興大正法雲，耀解脫電光，震實法雷音，雨甘露味雨，以大願力充洽一切諸眾生界無礙用。是為十。「佛子！\n\n**（条 89／201）有十種境界無礙用**：\n\n> 菩薩摩訶薩有十種境界無礙用。何等為十？所謂：在法界境界而不捨眾生境界無礙用；在佛境界而不捨魔境界無礙用；在涅槃境界而不捨生死境界無礙用；入一切智境界而不斷菩薩種性境界無礙用；住寂靜境界而不捨散亂境界無礙用；住無去、無來、無戲論、無相狀、無體性、無言說、如虛空境界而不捨一切眾生戲論境界無礙用；住諸力解脫境界而不捨一切諸方所境界無礙用；入無眾生際境界而不捨教化一切眾生無礙用；住禪定解脫、神通明智、寂靜境界而於一切世界示現受生無礙用；住如來一切行莊嚴成正覺境界而現一切聲聞、辟支佛寂靜威儀無礙用。是為十。「佛子！\n\n**（条 90／201）有十種智無礙用**：\n\n> 菩薩摩訶薩有十種智無礙用。何等為十？所謂：無盡辯才無礙用；一切總持無有忘失無礙用；能決定知、決定說一切眾生諸根無礙用；於一念中以無礙智知一切眾生心之所行無礙用；知一切眾生欲樂、隨眠、習氣、煩惱病，隨應授藥無礙用；一念能入如來十力無礙用；以無礙智知三世一切劫及其中眾生無礙用；於念念中現成正覺示現眾生無有斷絕無礙用；於一眾生想知一切眾生業無礙用；於一眾生音解一切眾生語無礙用。是為十。「佛子！\n\n**（条 91／201）有十種神通無礙用**：\n\n> 菩薩摩訶薩有十種神通無礙用。何等為十？所謂：於一身示現一切世界身無礙用；於一佛眾會聽受一切佛眾會中所說法無礙用；於一眾生心念中成就不可說無上菩提開悟一切眾生心無礙用；以一音現一切世界差別言音，令諸眾生各得解了無礙用；一念中現盡前際一切劫所有業果種種差別，令諸眾生悉得知見無礙用；一微塵出現廣大佛剎無量莊嚴無礙用；令一切世界具足莊嚴無礙用；普入一切三世無礙用；放大法光明現一切諸佛菩提、眾生行願無礙用；善守護一切天、龍、夜叉、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽、釋、梵、護世、聲聞、獨覺、菩薩、所有如來十力、菩薩善根無礙用。是為十。若諸菩薩得此無礙用，則能普入一切佛法。「佛子！\n\n**（条 92／201）有十種神力無礙用**：\n\n> 菩薩摩訶薩有十種神力無礙用。何等為十？所謂：以不可說世界置一塵中無礙用；於一塵中現等法界一切佛剎無礙用；以一切大海水置一毛孔，周旋往返十方世界，而於眾生無所觸嬈無礙用；以不可說世界內自身中，示現一切神通所作無礙用；以一毛繫不可數金剛圍山，持以遊行一切世界，不令眾生生恐怖心無礙用；以不可說劫作一劫，一劫作不可說劫，於中示現成壞差別，不令眾生心有恐怖無礙用；於一切世界現水、火、風災種種變壞而不惱眾生無礙用；一切世界三災壞時，悉能護持一切眾生資生之具不令損缺無礙用；以一手持不思議世界，擲不可說世界之外，不令眾生有驚怖想無礙用；說一切剎同於虛空，令諸眾生悉得悟解無礙用。是為十。「佛子！\n\n**（条 93／201）有十種力無礙用**：\n\n> 菩薩摩訶薩有十種力無礙用。何等為十？所謂：眾生力無礙用，教化調伏不捨離故；剎力無礙用，示現不可說莊嚴而莊嚴故；法力無礙用，令一切身入無身故；劫力無礙用，修行不斷故；佛力無礙用，覺悟睡眠故；行力無礙用，攝取一切菩薩行故；如來力無礙用，度脫一切眾生故；無師力無礙用，自覺一切諸法故；一切智力無礙用，以一切智成正覺故；大悲力無礙用，不捨一切眾生故。是為十。「佛子！如是名為：菩薩摩訶薩十種無礙用。若有得此十無礙用者，於阿耨多羅三藐三菩提欲成、不成，隨意無違，雖成正覺而亦不斷行菩薩行。何以故？菩薩摩訶薩發大誓願，入無邊無礙用門，善巧示現故。「佛子！\n\n**（条 94／201）有十種遊戲，**：\n\n> 菩薩摩訶薩有十種遊戲，何等為十？所謂：以眾生身作剎身，而亦不壞眾生身，是菩薩遊戲；以剎身作眾生身，而亦不壞於剎身，是菩薩遊戲；於佛身示現聲聞、獨覺身，而不損減如來身，是菩薩遊戲；於聲聞、獨覺身示現如來身，而不增長聲聞、獨覺身，是菩薩遊戲；於菩薩行身示現成正覺身，而亦不斷菩薩行身，是菩薩遊戲；於成正覺身示現修菩薩行身，而亦不減成菩提身，是菩薩遊戲；於涅槃界示現生死身，而不著生死，是菩薩遊戲；於生死界示現涅槃，亦不究竟入於涅槃，是菩薩遊戲；入於三昧而示現行、住、坐、臥一切業，亦不捨三昧正受，是菩薩遊戲；在一佛所聞法受持，其身不動，而以三昧力，於不可說諸佛會中各各現身，亦不分身，亦不起定，而聞法受持相續不斷，如是念念於一一三昧身各出生不可說不可說三昧身，如是次第一切諸劫猶可窮盡，而菩薩三昧身不可窮盡，是菩薩遊戲。是為十。若諸菩薩安住此法，則得如來無上大智遊戲。「佛子！\n\n**（条 95／201）有十種境界**：\n\n> 菩薩摩訶薩有十種境界。何等為十？所謂：示現無邊法界門，令眾生得入，是菩薩境界；示現一切世界無量妙莊嚴，令眾生得入，是菩薩境界；化往一切眾生界，悉方便開悟，是菩薩境界；於如來身出菩薩身，於菩薩身出如來身，是菩薩境界；於虛空界現世界，於世界現虛空界，是菩薩境界；於生死界現涅槃界，於涅槃界現生死界，是菩薩境界；於一眾生語言中，出生一切佛法語言，是菩薩境界；以無邊身現作一身，一身作一切差別身，是菩薩境界；以一身充滿一切法界，是菩薩境界；於一念中，令一切眾生發菩提心，各現無量身成等正覺，是菩薩境界。是為十。若諸菩薩安住此法，則得如來無上大智慧境界。「佛子！\n\n**（条 96／201）有十種力**：\n\n> 菩薩摩訶薩有十種力。何等為十？所謂：深心力，不雜一切世情故；增上深心力，不捨一切佛法故；方便力，諸有所作究竟故；智力，了知一切心行故；願力，一切所求令滿故；行力，盡未來際不斷故；乘力，能出生一切乘，而不捨大乘故；神變力，於一一毛孔中，各各示現一切清淨世界一切如來出興世故；菩提力，令一切眾生發心成佛無斷絕故；轉法輪力，說一句法悉稱一切眾生諸根性欲故。是為十。若諸菩薩安住此法，則得諸佛無上一切智十力。「佛子！\n\n**（条 97／201）有十種無畏**：\n\n> 菩薩摩訶薩有十種無畏。何等為十？佛子！菩薩摩訶薩悉能聞持一切言說，作如是念：『設有眾生無量無邊從十方來，以百千大法而問於我。我於彼問不見微少難可答相；以不見故，心得無畏，究竟到彼大無畏岸，隨其所問悉能酬對，斷其疑惑無有怯弱。\n>\n> 』是為菩薩\n>\n> 第一無畏。佛子！菩薩摩訶薩得如來灌頂無礙辯才，到於一切文字言音開示祕密究竟彼岸，作如是念：『設有眾生無量無邊從十方來，以無量法而問於我。我於彼問不見微少難可答相；以不見故，心得無畏，究竟到彼大無畏岸，隨其所問悉能酬對，斷其疑惑無有恐懼。\n>\n> 』是為菩薩\n>\n> 第二無畏。佛子！菩薩摩訶薩知一切法空，離我、離我所，無作、無作者，無知者，無命者，無養育者，無補伽羅，離蘊、界、處，永出諸見，心如虛空，作如是念：『不見眾生有微少相能損惱我身、語、意業。』何以故？菩薩遠離我、我所故，不見諸法有少性相。\n>\n> 以不見故，心得無畏，究竟到彼大無畏岸，堅固勇猛，不可沮壞，是為菩薩\n>\n> 第三無畏。佛子！菩薩摩訶薩佛力所護、佛力所持，住佛威儀，所行真實，無有變易，作如是念：『我不見有少分威儀，令諸眾生生訶責相。』以不見故，心得無畏，於大眾中安隱說法，是為菩薩\n>\n> 第四無畏。佛子！菩薩摩訶薩身、語、意業皆悉清淨，鮮白柔和，遠離眾惡，作如是念：『我不自見身、語、意業而有少分可訶責相。』以不見故，心得無畏，能令眾生住於佛法，是為菩薩\n>\n> 第五無畏。佛子！菩薩摩訶薩，金剛力士、天、龍、夜叉、乾闥婆、阿脩羅、帝釋、梵王、四天王等常隨侍衛，一切如來護念不捨。菩薩摩訶薩作如是念：『我不見有眾魔外道有見眾生能來障我行菩薩道少分之相。』以不見故，心得無畏，究竟到彼大無畏岸，發歡喜心行菩薩行，是為菩薩\n>\n> 第六無畏。佛子！菩薩摩訶薩已得成就\n>\n> 第一念根，心無忘失佛所悅可，作如是念：『如來所說成菩提道文字句法，我不於中見有少分忘失之相。』以不見故，心得無畏，受持一切如來正法行菩薩行，是為菩薩\n>\n> 第七無畏。佛子！菩薩摩訶薩智慧方便悉已通達，菩薩諸力皆得究竟，常勤教化一切眾生，恒以願心繫佛菩提，而為悲愍眾生故，成就眾生故，於煩惱濁世示現受生、種族尊貴、眷屬圓滿、所欲從心、歡娛快樂，而作是念：『我雖與此眷屬聚會，不見少相而可貪著，廢我修行禪定、解脫，及諸三昧、總持、辯才、菩薩道法。\n>\n> 』何以故？菩薩摩訶薩於一切法已得自在到於彼岸，修菩薩行誓不斷絕，不見世間有一境界而能惑亂菩薩道者。以不見故，心得無畏，究竟到彼大無畏岸，以大願力於一切世界示現受生，是為菩薩\n>\n> 第八無畏。佛子！菩薩摩訶薩恒不忘失薩婆若心，乘於大乘行菩薩行，以一切智大心勢力，示現一切聲聞、獨覺寂靜威儀，作是念言：『我不自見當於二乘而取出離少分之相。』以不見故，心得無畏，到彼無上大無畏岸，普能示現一切乘道，究竟滿足平等大乘，是為菩薩\n>\n> 第九無畏。佛子！菩薩摩訶薩成就一切諸白淨法，具足善根，圓滿神通，究竟住於諸佛菩提，滿足一切諸菩薩行，於諸佛所受一切智灌頂之記，而常化眾生行菩薩道，作如是念：『我不自見有一眾生應可成熟而不能現諸佛自在而成熟相。』以不見故，心得無畏，究竟到彼大無畏岸，不斷菩薩行，不捨菩薩願，隨所應化一切眾生現佛境界而化度之，是為菩薩\n>\n> 第十無畏。佛子！是為菩薩摩訶薩十種無畏。若諸菩薩安住此法，則得諸佛無上大無畏，而亦不捨菩薩無畏。「佛子！\n\n**（条 98／201）有十種不共法**：\n\n> 菩薩摩訶薩有十種不共法。何等為十？佛子！菩薩摩訶薩不由他教，自然修行六波羅蜜——常樂大施，不生慳吝；恒持淨戒，無所毀犯；具足忍辱，心不動搖；有大精進，未曾退轉；善入諸禪，永無散亂；巧修智慧，悉除惡見。是為\n>\n> 第一不由他教隨順波羅蜜道修六度不共法。佛子！菩薩摩訶薩普能攝受一切眾生。所謂：以財及法而行惠施，正念現前，和顏愛語，其心歡喜，示如實義，令得悟解諸佛菩提，無有憎嫌，平等利益。是為\n>\n> 第二不由他教順四攝道勤攝眾生不共法。佛子！菩薩摩訶薩善巧迴向，所謂：不求果報迴向、順佛菩提迴向、不著一切世間禪定三昧迴向、為利益一切眾生迴向、為不斷如來智慧迴向。是為\n>\n> 第三不由他教為諸眾生發起善根求佛智慧不共法。佛子！菩薩摩訶薩到善巧方便究竟彼岸，心恒顧復一切眾生，不厭世俗凡愚境界，不樂二乘出離之道，不著己樂，唯勤化度，善能入出禪定解脫，於諸三昧悉得自在，往來生死如遊園觀，未曾暫起疲厭之心；\n>\n> 或住魔宮，或為釋天、梵王、世主，一切生處靡不於中而現其身；或於外道眾中出家，而恒遠離一切邪見；一切世間文詞、呪術、字印、算數，乃至遊戲、歌舞之法，悉皆示現，無不精巧；或時示作端正婦人，智慧才能世中\n>\n> 第一；於諸世間、出世間法能問能說，問答斷疑皆得究竟；一切世間、出世間事亦悉通達到於彼岸，一切眾生恒來瞻仰；雖現聲聞、辟支佛威儀，而不失大乘心；雖念念中示成正覺，而不斷菩薩行。是為\n>\n> 第四不由他教方便善巧究竟彼岸不共法。佛子！菩薩摩訶薩善知權實雙行道，智慧自在，到於究竟。所謂：住於涅槃而示現生死，知無眾生而勤行教化，究竟寂滅而現起煩惱，住一堅密智慧法身而普現無量諸眾生身，常入深禪定而示受欲樂，常遠離三界而不捨眾生，常樂法樂而現有采女歌詠嬉戲，雖以眾相好莊嚴其身而示受醜陋貧賤之形，常積集眾善無諸過惡而現生地獄、畜生、餓鬼，雖已到於佛智彼岸而亦不捨菩薩智身。\n>\n> 菩薩摩訶薩成就如是無量智慧，聲聞、獨覺尚不能知，何況一切童蒙眾生！是為\n>\n> 第五不由他教權實雙行不共法。佛子！菩薩摩訶薩身、口、意業，隨智慧行皆悉清淨。所謂：具足大慈永離殺心，乃至具足正解無有邪見。是為\n>\n> 第六不由他教身、口、意業隨智慧行不共法。佛子！菩薩摩訶薩具足大悲，不捨眾生，代一切眾生而受諸苦，所謂：地獄苦、畜生苦、餓鬼苦。為利益故，不生勞倦，唯專度脫一切眾生，未曾耽染五欲境界，常為精勤滅除眾苦。是為\n>\n> 第七不由他教常起大悲不共法。佛子！菩薩摩訶薩常為眾生之所樂見，梵王、帝釋、四天王等一切眾生見無厭足。何以故？菩薩摩訶薩久遠世來，行業清淨無有過失，是故眾生見者無厭。是為\n>\n> 第八不由他教一切眾生皆悉樂見不共法。佛子！菩薩摩訶薩於薩婆若大誓莊嚴志樂堅固，雖處凡夫、聲聞、獨覺險難之處，終不退失一切智心明淨妙寶。佛子！如有寶珠，名：淨莊嚴，置泥澇中光色不改，能令濁水悉皆澄淨。菩薩摩訶薩亦復如是，雖在凡愚雜濁等處，終不失壞求一切智清淨寶心，而能令彼諸惡眾生遠離妄見、煩惱、穢濁，得求一切智清淨心寶。\n>\n> 是為\n>\n> 第九不由他教在眾難處不失一切智心寶不共法。佛子！菩薩摩訶薩成就自覺境界智，無師自悟，究竟自在到於彼岸，離垢法繒以冠其首，而於善友不捨親近，於諸如來常樂尊重，是為\n>\n> 第十不由他教得最上法不離善知識、不捨尊重佛不共法。佛子！是為菩薩摩訶薩十種不共法。若諸菩薩安住其中，則得如來無上廣大不共法。「佛子！\n\n**（条 99／201）有十種業**：\n\n> 菩薩摩訶薩有十種業。何等為十？所謂：一切世界業，悉能嚴淨故；一切諸佛業，悉能供養故；一切菩薩業，同種善根故；一切眾生業，悉能教化故；一切未來業，盡未來際攝取故；一切神力業，不離一世界遍至一切世界故；一切光明業，放無邊色光明，一一光中有蓮華座，各有菩薩結跏趺坐而顯現故；一切三寶種不斷業，諸佛滅後，守護住持諸佛法故；一切變化業，於一切世界說法教化諸眾生故；一切加持業，於一念中隨諸眾生心之所欲皆為示現，令一切願悉成滿故。是為十。若諸菩薩安住此法，則得如來無上廣大業。「佛子！\n\n**（条 100／201）有十種身**：\n\n> 菩薩摩訶薩有十種身。何等為十？所謂：不來身，於一切世間不受生故；不去身，於一切世間求不得故；不實身，一切世間如實得故；不虛身，以如實理示世間故；不盡身，盡未來際無斷絕故；堅固身，一切眾魔不能壞故；不動身，眾魔外道不能動故；具相身，示現清淨百福相故；無相身，法相究竟悉無相故；普至身，與三世佛同一身故。是為十。若諸菩薩安住此法，則得如來無上無盡之身。「佛子！\n\n**（条 101／201）有十種身業**：\n\n> 菩薩摩訶薩有十種身業。何等為十？所謂：一身充滿一切世界身業；於一切眾生前悉能示現身業；於一切趣悉能受生身業；遊行一切世界身業；往詣一切諸佛眾會身業；能以一手普覆一切世界身業；能以一手磨一切世界金剛圍山碎如微塵身業；於自身中現一切佛剎成壞示於眾生身業；以一身容受一切眾生界身業；於自身中普現一切清淨佛剎，一切眾生於中成道身業。是為十。若諸菩薩安住此法，則得如來無上佛業，悉能覺悟一切眾生。「佛子！\n\n**（条 102／201）復有十種身**：\n\n> 菩薩摩訶薩復有十種身。何等為十？所謂：諸波羅蜜身，悉正修行故；四攝身，不捨一切眾生故；大悲身，代一切眾生受無量苦無疲厭故；大慈身，救護一切眾生故；福德身，饒益一切眾生故；智慧身，與一切佛身同一性故；法身，永離諸趣受生故；方便身，於一切處現前故；神力身，示現一切神變故；菩提身，隨樂、隨時成正覺故。是為十。若諸菩薩安住此法，則得如來無上大智慧身。「佛子！\n\n**（条 103／201）有十種語**：\n\n> 菩薩摩訶薩有十種語。何等為十？所謂：柔軟語，使一切眾生皆安隱故；甘露語，令一切眾生悉清涼故；不誑語，所有言說皆如實故；真實語，乃至夢中無妄語故；廣大語，一切釋、梵、四天王等皆尊敬故；甚深語，顯示法性故；堅固語，說法無盡故；正直語，發言易了故；種種語，隨時示現故；開悟一切眾生語，隨其欲樂令解了故。是為十。若諸菩薩安住此法，則得如來無上微妙語。「佛子！\n\n**（条 104／201）有十種淨修語業**：\n\n> 菩薩摩訶薩有十種淨修語業。何等為十？所謂：樂聽聞如來音聲淨修語業；樂聞說菩薩功德淨修語業；不說一切眾生不樂聞語淨修語業；真實遠離語四過失淨修語業；歡喜踊躍讚歎如來淨修語業；如來塔所高聲讚佛如實功德淨修語業；以深淨心施眾生法淨修語業；音樂歌頌讚歎如來淨修語業；於諸佛所聽聞正法不惜身命淨修語業；捨身承事一切菩薩及諸法師而受妙法淨修語業。是為十。「佛子！\n\n**（条 105／201）以此十事淨修語業，則得十種守護**：\n\n> 若菩薩摩訶薩以此十事淨修語業，則得十種守護。何等為十？所謂：天王為首，一切天眾而為守護；龍王為首，一切龍眾而為守護；夜叉王為首，乾闥婆王為首，阿脩羅王為首，迦樓羅王為首，緊那羅王為首，摩睺羅伽王為首，梵王為首，一一皆與自己徒眾而為守護；如來法王為首，一切法師皆悉守護。是為十。「佛子！\n\n**（条 106／201）得此守護已，則能成辦十種大事**：\n\n> 菩薩摩訶薩得此守護已，則能成辦十種大事。何等為十？所謂：一切眾生皆令歡喜，一切世界悉能往詣，一切諸根皆能了知，一切勝解悉令清淨，一切煩惱皆令除斷，一切習氣皆令捨離，一切欲樂皆令明潔，一切深心悉使增長，一切法界悉令周遍，一切涅槃普令明見。是為十。「佛子！\n\n**（条 107／201）有十種心**：\n\n> 菩薩摩訶薩有十種心。何等為十？所謂：如大地心，能持、能長一切眾生諸善根故；如大海心，一切諸佛無量無邊大智法水悉流入故；如須彌山王心，置一切眾生於出世間最上善根處故；如摩尼寶王心，樂欲清淨無雜染故；如金剛心，決定深入一切法故；如金剛圍山心，諸魔外道不能動故；如蓮華心，一切世法不能染故；如優曇鉢華心，一切劫中難值遇故；如淨日心，破闇障故；如虛空心，不可量故。是為十。若諸菩薩安住其中，則得如來無上大清淨心。「佛子！\n\n**（条 108／201）有十種發心**：\n\n> 菩薩摩訶薩有十種發心。何等為十？所謂：發我當度脫一切眾生心；發我當令一切眾生除斷煩惱心；發我當令一切眾生消滅習氣心；發我當斷除一切疑惑心；發我當除滅一切眾生苦惱心；發我當除滅一切惡道諸難心；發我當敬順一切如來心；發我當善學一切菩薩所學心；發我當於一切世間一一毛端處現一切佛成正覺心；發我當於一切世界擊無上法鼓，令諸眾生隨其根欲悉得悟解心。是為十。若諸菩薩安住其中，則得如來無上大發起能事心。「佛子！\n\n**（条 109／201）有十種周遍心**：\n\n> 菩薩摩訶薩有十種周遍心。何等為十？所謂：周遍一切虛空心，發意廣大故；周遍一切法界心，深入無邊故；周遍一切三世心，一念悉知故；周遍一切佛出現心，於入胎、誕生、出家、成道、轉法輪、般涅槃悉明了故；周遍一切眾生心，悉知根、欲、習氣故；周遍一切智慧心，隨順了知法界故；周遍一切無邊心，知諸幻網差別故；周遍一切無生心，不得諸法自性故；周遍一切無礙心，不住自心、他心故；周遍一切自在心，一念普現成佛故。是為十。若諸菩薩安住其中，則得無量無上佛法周遍莊嚴。「佛子！\n\n**（条 110／201）有十種根**：\n\n> 菩薩摩訶薩有十種根。何等為十？所謂：歡喜根，見一切佛信不壞故；希望根，所聞佛法皆悟解故；不退根，一切作事皆究竟故；安住根，不斷一切菩薩行故；微細根，入般若波羅蜜微妙理故；不休息根，究竟一切眾生事故；如金剛根，證知一切諸法性故；金剛光焰根，普照一切佛境界故；無差別根，一切如來同一身故；無礙際根，深入如來十種力故。是為十。若諸菩薩安住其中，則得如來無上大智圓滿根。「佛子！\n\n**（条 111／201）有十種深心**：\n\n> 菩薩摩訶薩有十種深心。何等為十？所謂：不染一切世間法深心；不雜一切二乘道深心；了達一切佛菩提深心；隨順一切智智道深心；不為一切眾魔外道所動深心；淨修一切如來圓滿智深心；受持一切所聞法深心；不著一切受生處深心；具足一切微細智深心；修一切諸佛法深心。是為十。若諸菩薩安住其中，則得一切智無上清淨深心。「佛子！\n\n**（条 112／201）有十種增上深心**：\n\n> 菩薩摩訶薩有十種增上深心。何等為十？所謂：不退轉增上深心，積集一切善根故；離疑惑增上深心，解一切如來密語故；正持增上深心，大願大行所流故；最勝增上深心，深入一切佛法故；為主增上深心，一切佛法自在故；廣大增上深心，普入種種法門故；上首增上深心，一切所作成辦故；自在增上深心，一切三昧神通變化莊嚴故；安住增上深心，攝受本願故；無休息增上深心，成熟一切眾生故。是為十。若諸菩薩安住此法，則得一切諸佛無上清淨增上深心。「佛子！\n\n**（条 113／201）有十種勤修**：\n\n> 菩薩摩訶薩有十種勤修。何等為十？所謂：布施勤修，悉捨一切，不求報故；持戒勤修，頭陀苦行，少欲知足，無所欺故；忍辱勤修，離自他想，忍一切惡，畢竟不生恚害心故；精進勤修，身、語、意業未曾散亂，一切所作皆不退轉，至究竟故；禪定勤修，解脫三昧，出現神通，離一切欲煩惱鬪諍諸眷屬故；智慧勤修，修習積聚一切功德無厭倦故；大慈勤修，知諸眾生無自性故；大悲勤修，知諸法空，普代一切眾生受苦無疲厭故；覺悟如來十力勤修，了達無礙示眾生故；不退法輪勤修，轉至一切眾生心故。是為十。若諸菩薩安住此法，則得如來無上大智慧勤修。「佛子！\n\n**（条 114／201）有十種決定解**：\n\n> 菩薩摩訶薩有十種決定解。何等為十？所謂：最上決定解，種植尊重善根故；莊嚴決定解，出生種種莊嚴故；廣大決定解，其心未曾狹劣故；寂滅決定解，能入甚深法性故；普遍決定解，發心無所不及故；堪任決定解，能受佛力加持故；堅固決定解，摧破一切魔業故；明斷決定解，了知一切業報故；現前決定解，隨意能現神通故；紹隆決定解，一切佛所得記故；自在決定解，隨意、隨時成佛故。是為十。若諸菩薩安住此法，則得如來無上決定解。「佛子！\n\n**（条 115／201）有十種決定解知諸世界**：\n\n> 菩薩摩訶薩有十種決定解知諸世界。何等為十？所謂：知一切世界入一世界；知一世界入一切世界；知一切世界，一如來身、一蓮華座皆悉周遍；知一切世界皆如虛空；知一切世界具佛莊嚴；知一切世界菩薩充滿；知一切世界入一毛孔；知一切世界入一眾生身；知一切世界，一佛菩提樹、一佛道場皆悉周遍；知一切世界一音普遍，令諸眾生各別了知，心生歡喜。是為十。若諸菩薩安住此法，則得如來無上佛剎廣大決定解。「佛子！\n\n**（条 116／201）有十種決定解知眾生界**：\n\n> 菩薩摩訶薩有十種決定解知眾生界。何等為十？所謂：知一切眾生界本性無實；知一切眾生界悉入一眾生身；知一切眾生界悉入菩薩身；知一切眾生界悉入如來藏；知一眾生身普入一切眾生界；知一切眾生界悉堪為諸佛法器；知一切眾生界，隨其所欲，為現釋、梵、護世身；知一切眾生界，隨其所欲，為現聲聞、獨覺寂靜威儀；知一切眾生界，為現菩薩功德莊嚴身；知一切眾生界，為現如來相好寂靜威儀，開悟眾生。是為十。若諸菩薩安住此法，則得如來無上大威力決定解。「佛子！\n\n**（条 117／201）有十種習氣**：\n\n> 菩薩摩訶薩有十種習氣。何等為十？所謂：菩提心習氣；善根習氣；教化眾生習氣；見佛習氣；於清淨世界受生習氣；行習氣；願習氣；波羅蜜習氣；思惟平等法習氣；種種境界差別習氣。是為十。若諸菩薩安住此法，則永離一切煩惱習氣，得如來大智習氣非習氣智。「佛子！\n\n**（条 118／201）有十種取，以此不斷諸菩薩行**：\n\n> 菩薩摩訶薩有十種取，以此不斷諸菩薩行。何等為十？所謂：取一切眾生界，究竟教化故；取一切世界，究竟嚴淨故；取如來，修菩薩行為供養故；取善根，積集諸佛相好功德故；取大悲，滅一切眾生苦故；取大慈，與一切眾生一切智樂故；取波羅蜜，積集菩薩諸莊嚴故；取善巧方便，於一切處皆示現故；取菩提，得無礙智故；略說菩薩取一切法，於一切處悉以明智而現了故。是為十。若諸菩薩安住此取，則能不斷諸菩薩行，得一切如來無上無所取法。「佛子！\n\n**（条 119／201）有十種修**：\n\n> 菩薩摩訶薩有十種修。何等為十？所謂：修諸波羅蜜；修學；修慧；修義；修法；修出離；修示現；修勤行匪懈；修成等正覺；修轉正法輪。是為十。若諸菩薩安住其中，則得無上修修一切法。「佛子！\n\n**（条 120／201）有十種成就佛法**：\n\n> 菩薩摩訶薩有十種成就佛法。何等為十？所謂：不離善知識成就佛法；深信佛語成就佛法；不謗正法成就佛法；以無量無盡善根迴向成就佛法；信解如來境界無邊際成就佛法；知一切世界境界成就佛法；不捨法界境界成就佛法；遠離諸魔境界成就佛法；正念一切諸佛境界成就佛法；樂求如來十力境界成就佛法。是為十。若諸菩薩安住此法，則得成就如來無上大智慧。「佛子！\n\n**〔L.278 批·组 121–160 注入·9,042 CJK·0 手抄〕**\n\n**（条 121／201）有十種退失佛法，應當遠離**：\n\n> 菩薩摩訶薩有十種退失佛法，應當遠離。何等為十？所謂：輕慢善知識退失佛法；畏生死苦退失佛法；厭修菩薩行退失佛法；不樂住世間退失佛法；耽著三昧退失佛法；執取善根退失佛法；誹謗正法退失佛法；斷菩薩行退失佛法；樂二乘道退失佛法；嫌恨諸菩薩退失佛法。是為十。若諸菩薩遠離此法，則入菩薩離生道。「佛子！\n\n**（条 122／201）有十種離生道**：\n\n> 菩薩摩訶薩有十種離生道。何等為十？所謂：出生般若波羅蜜而恒觀察一切眾生，是為一；遠離諸見而度脫一切見縛眾生，是為二；不念一切相而不捨一切著相眾生，是為三；超過三界而常在一切世界，是為四；永離煩惱而與一切眾生共居，是為五；得離欲法而常以大悲哀愍一切著欲眾生，是為六；常樂寂靜而恒示現一切眷屬，是為七；離世間生而死此生彼起菩薩行，是為八；不染一切世間法而不斷一切世間所作，是為九；諸佛菩提已現其前而不捨菩薩一切願行，是為十。佛子！是為菩薩摩訶薩十種離生道，出離世間，不與世共，而亦不雜二乘之行。若諸菩薩安住此法，則得菩薩決定法。「佛子！\n\n**（条 123／201）有十種決定法**：\n\n> 菩薩摩訶薩有十種決定法。何等為十？所謂；決定於如來種族中生；決定於諸佛境界中住；決定了知菩薩所作事；決定安住諸波羅蜜；決定得預如來眾會；決定能顯如來種性；決定安住如來力；決定深入佛菩提；決定與一切如來同一身；決定與一切如來所住無有二。是為十。「佛子！\n\n**（条 124／201）有十種出生佛法道**：\n\n> 菩薩摩訶薩有十種出生佛法道。何等為十？所謂：隨順善友是出生佛法道，同種善根故；深心信解是出生佛法道，知佛自在故；發大誓願是出生佛法道，其心寬廣故；忍自善根是出生佛法道，知業不失故；一切劫修行無厭足是出生佛法道，盡未來際故；阿僧祇世界皆示現是出生佛法道，成熟眾生故；不斷菩薩行是出生佛法道，增長大悲故；無量心是出生佛法道，一念遍一切虛空界故；殊勝行是出生佛法道，本所修行無失壞故；如來種是出生佛法道，令一切眾生樂發菩提心，以一切善法資持故。是為十。若諸菩薩安住此法，則得大丈夫名號。「佛子！\n\n**（条 125／201）有十種大丈夫名號**：\n\n> 菩薩摩訶薩有十種大丈夫名號。何等為十？所謂：名為：菩提薩埵，菩提智所生故；名為：摩訶薩埵，安住大乘故；名為：第一薩埵，證第一法故；名為：勝薩埵，覺悟勝法故；名為：最勝薩埵，智慧最勝故；名為：上薩埵，起上精進故；名為：無上薩埵，開示無上法故；名為：力薩埵，廣知十力故；名為：無等薩埵，世間無比故；名為：不思議薩埵，一念成佛故。是為十。若諸菩薩得此名號，則成就菩薩道。「佛子！\n\n**（条 126／201）有十種道**：\n\n> 菩薩摩訶薩有十種道。何等為十？所謂：一道是菩薩道，不捨獨一菩提心故。二道是菩薩道，出生智慧及方便故。三道是菩薩道，行空、無相、無願，不著三界故。四行是菩薩道，懺除罪障，隨喜福德，恭敬尊重勸請如來，善巧迴向無休息故。五根是菩薩道，安住淨信堅固不動，起大精進所作究竟，一向正念無異攀緣，巧知三昧入出方便，善能分別智慧境界故。\n>\n> 六通是菩薩道。所謂；天眼，悉見一切世界所有眾色，知諸眾生死此生彼故；天耳，悉聞諸佛說法，受持憶念，廣為眾生隨根演暢故；他心智，能知他心，自在無礙故；宿命念，憶知過去一切劫數，增長善根故；神足通，隨所應化一切眾生，種種為現，令樂法故；\n>\n> 漏盡智，現證實際，起菩薩行不斷絕故。七念是菩薩道。所謂：念佛，於一毛孔見無量佛，開悟一切眾生心故；念法，不離一如來眾會，於一切如來眾會中親承妙法，隨諸眾生根性欲樂而為演說，令悟入故；念僧，恒相續見無有休息，於一切世間見菩薩故；\n>\n> 念捨，了知一切菩薩捨行，增長廣大布施心故；念戒，不捨菩提心，以一切善根迴向眾生故；念天，常憶念兜率陀天宮一生補處菩薩故；念眾生，智慧方便教化調伏，普及一切無間斷故。隨順菩提八聖道是菩薩道。所謂：行正見道，遠離一切諸邪見故；\n>\n> 起正思惟，捨妄分別，心常隨順一切智故；常行正語，離語四過，順聖言故；恒修正業，教化眾生令調伏故；安住正命，頭陀知足，威儀審正，隨順菩提行四聖種，一切過失皆永離故；起正精進，勤修一切菩薩苦行，入佛十力無罣礙故；心常正念，悉能憶持一切言音，除滅世間散動心故；\n>\n> 心常正定，善入菩薩不思議解脫門，於一三昧中出生一切諸三昧故。入九次第定是菩薩道。所謂；離欲恚害，而以一切語業說法無礙；滅除覺觀，而以一切智覺觀教化眾生；捨離喜愛，而見一切佛，心大歡喜；離世間樂，而隨順出世菩薩道樂；從此不動，入無色定，而亦不捨欲、色受生；\n>\n> 雖住滅一切想受定，而亦不息菩薩行故。學佛十力是菩薩道。所謂：善知是處、非處智；善知一切眾生、去、來現在業報因果智；善知一切眾生上、中、下根不同隨宜說法智；善知一切眾生種種無量性智；善知一切眾生軟、中、上解差別令入法方便智；\n>\n> 遍一切世間、一切剎、一切三世、一切劫，普現如來形相威儀而亦不捨菩薩所行智；善知一切諸禪解脫及諸三昧若垢若淨、時與非時，方便出生諸菩薩解脫門智；知一切眾生於諸趣中死此生彼差別智；於一念中悉知三世一切劫數智；善知一切眾生樂欲、諸使、惑習滅盡智，而不捨離諸菩薩行。\n>\n> 是為十。若諸菩薩安住此法，則得一切如來無上巧方便道。「佛子！菩薩摩訶薩有無量道、無量助道、無量修道、無量莊嚴道。「佛子！\n\n**（条 127／201）有十種無量道**：\n\n> 菩薩摩訶薩有十種無量道。何等為十？所謂：虛空無量故，菩薩道亦無量；法界無邊故，菩薩道亦無量；眾生界無盡故，菩薩道亦無量；世界無際故，菩薩道亦無量；劫數不可盡故，菩薩道亦無量；一切眾生語言法無量故，菩薩道亦無量；如來身無量故，菩薩道亦無量；佛音聲無量故，菩薩道亦無量；如來力無量故，菩薩道亦無量；一切智智無量故，菩薩道亦無量。是為十。「佛子！\n\n**（条 128／201）有十種無量助道**：\n\n> 菩薩摩訶薩有十種無量助道。何等為十？所謂：如虛空界無量，菩薩集助道亦無量；如法界無邊，菩薩集助道亦無邊；如眾生界無盡，菩薩集助道亦無盡；如世界無際，菩薩集助道亦無際；如劫數說不可盡，菩薩集助道亦一切世間說不能盡；如眾生語言法無量，菩薩集助道出生智慧知語言法亦無量；如如來身無量，菩薩集助道遍一切眾生、一切剎、一切世、一切劫亦無量；如佛音聲無量，菩薩出一言音周遍法界，一切眾生無不聞知故，所集助道亦無量；如佛力無量，菩薩承如來力積集助道亦無量；如一切智智無量，菩薩積集助道亦如是無有量。是為十。若諸菩薩安住此法，則得如來無量智慧。「佛子！\n\n**（条 129／201）有十種無量修道**：\n\n> 菩薩摩訶薩有十種無量修道。何等為十？所謂：不來不去修，身、語、意業無動作故；不增不減修，如本性故；非有非無修，無自性故；如幻如夢、如影如響、如鏡中像、如熱時焰、如水中月修，離一切執著故；空、無相、無願、無作修，明見三界而集福德不休息故；不可說、無言說、離言說修，遠離施設安立法故；不壞法界修，智慧現知一切法故；不壞真如實際修，普入真如實際虛空際故；廣大智慧修，諸有所作力無盡故；住如來十力、四無所畏、一切智智平等修，現見一切法無疑惑故。是為十。若諸菩薩安住此法，則得如來一切智無上善巧修。「佛子！\n\n**（条 130／201）有十種莊嚴道**：\n\n> 菩薩摩訶薩有十種莊嚴道。何等為十？佛子！菩薩摩訶薩不離欲界，入色界、無色界禪定解脫及諸三昧，亦不因此而受彼生，是為\n>\n> 第一莊嚴道。智慧現前，入聲聞道，不以此道而取出離，是為\n>\n> 第二莊嚴道。智慧現前，入辟支佛道，而起大悲無有休息，是為\n>\n> 第三莊嚴道。雖有人、天眷屬圍遶，百千采女歌舞侍從，未曾暫捨禪定解脫及諸三昧，是為\n>\n> 第四莊嚴道。與一切眾生受諸欲樂共相娛樂，乃至未曾於一念間捨離菩薩平等三昧，是為\n>\n> 第五莊嚴道。已到一切世間彼岸，於諸世法悉無所著，而亦不捨度眾生行，是為\n>\n> 第六莊嚴道。安住正道、正智、正見，而能示入一切邪道，不取為實，不執為淨，令彼眾生遠離邪法，是為\n>\n> 第七莊嚴道。常善護持如來淨戒，身、語、意業無諸過失，為欲教化犯戒眾生，示行一切凡愚之行，雖已具足清淨福德住菩薩趣，而示生於一切地獄、畜生、餓鬼及諸險難、貧窮等處，令彼眾生皆得解脫，而實菩薩不生彼趣，是為\n>\n> 第八莊嚴道。不由他教，得無礙辯，智慧光明普能照了一切佛法，為一切如來神力所持，與一切諸佛同一法身，成就一切堅固大人明淨密法，安住一切平等諸乘，諸佛境界皆現其前，具足一切世智光明，照見一切諸眾生界，能為眾生作知法師，而示求正法未曾休息，雖實與眾生作無上師，而示行尊敬闍梨和尚。\n>\n> 何以故？菩薩摩訶薩善巧方便住菩薩道，隨其所應皆為示現。是為\n>\n> 第九莊嚴道。善根具足，諸行究竟，一切如來所共灌頂，到一切法自在彼岸，無礙法繒以冠其首；其身遍至一切世界，普現如來無礙之身，於法自在最上究竟，轉於無礙清淨法輪；一切菩薩自在之法皆已成就，而為眾生故，於一切國土示現受生；與三世諸佛同一境界，而不廢菩薩行，不捨菩薩法，不懈菩薩業，不離菩薩道，不弛菩薩儀，不斷菩薩取，不息菩薩巧方便，不絕菩薩所作事，不厭菩薩生成用，不止菩薩住持力。\n>\n> 何以故？菩薩欲疾證阿耨多羅三藐三菩提，觀一切智門修菩薩行無休息故。是為\n>\n> 第十莊嚴道。若諸菩薩安住此法，則得如來無上大莊嚴道，亦不捨菩薩道。「佛子！\n\n**（条 131／201）有十種足**：\n\n> 菩薩摩訶薩有十種足。何等為十？所謂持戒足，殊勝大願悉成滿故；精進足，集一切菩提分法不退轉故；神通足，隨眾生欲令歡喜故；神力足，不離一佛剎往一切佛剎故；深心足，願求一切殊勝法故；堅誓足，一切所作咸究竟故；隨順足，不違一切尊者教故；樂法足，聞持一切佛所說法不疲懈故；法雨足，為眾演說無怯弱故；修行足，一切諸惡悉遠離故。是為十。若諸菩薩安住此法，則得如來無上最勝足，若一舉步，悉能遍至一切世界。「佛子！\n\n**（条 132／201）有十種手**：\n\n> 菩薩摩訶薩有十種手。何等為十？所謂：深信手，於佛所說，一向忍可，究竟受持故；布施手，有來求者，隨其所欲皆令充滿故；先意問訊手，舒展右掌相迎引故；供養諸佛手，集眾福德無疲厭故；多聞善巧手，悉斷一切眾生疑故；令超三界手，授與眾生拔出欲泥故；置於彼岸手，四暴流中救溺眾生故；不吝正法手，所有妙法悉以開示故；善用眾論手，以智慧藥滅身心病故；恒持智寶手，開法光明破煩惱闇故。是為十。若諸菩薩安住此法，則得如來無上手，普覆十方一切世界。「佛子！\n\n**（条 133／201）有十種腹**：\n\n> 菩薩摩訶薩有十種腹。何等為十？所謂；離諂曲腹，心清淨故；離幻偽腹，性質直故；不虛假腹，無險詖故；無欺奪腹，於一切物無所貪故；斷煩惱腹，具智慧故；清淨心腹，離諸惡故；觀察飲食腹，念如實法故；觀察無作腹，覺悟緣起故；覺悟一切出離道腹，善成熟深心故；遠離一切邊見垢腹，令一切眾生得入佛腹故。是為十。若諸菩薩安住此法，則得如來無上廣大腹，悉能容受一切眾生。「佛子！\n\n**（条 134／201）有十種藏**：\n\n> 菩薩摩訶薩有十種藏。何等為十？所謂：不斷佛種是菩薩藏，開示佛法無量威德故；增長法種是菩薩藏，出生智慧廣大光明故；住持僧種是菩薩藏，令其得入不退法輪故；覺悟正定眾生是菩薩藏，善隨其時不逾一念故；究竟成熟不定眾生是菩薩藏，令因相續無有間斷故；為邪定眾生發起大悲是菩薩藏，令未來因悉得成就故；滿佛十力不可壞因是菩薩藏，具降伏魔軍無對善根故；最勝無畏大師子吼是菩薩藏，令一切眾生皆歡喜故；得佛十八不共法是菩薩藏，智慧普入一切處故；普了知一切眾生、一切剎、一切法、一切佛是菩薩藏，於一念中悉明見故。是為十。若諸菩薩安住此法，則得如來無上善根不可壞大智慧藏。「佛子！\n\n**（条 135／201）有十種心**：\n\n> 菩薩摩訶薩有十種心。何等為十？所謂：精勤心，一切所作悉究竟故；不懈心，積集相好福德行故；大勇健心，摧破一切諸魔軍故；如理行心，除滅一切諸煩惱故；不退轉心，乃至菩提終不息故；性清淨心，知心不動無所著故；知眾生心，隨其解欲令出離故；令入佛法大梵住心，知諸眾生種種解欲，不以別乘而救護故；空、無相、無願、無作心，見三界相不取著故；卐字相金剛堅固勝藏莊嚴心，一切眾生數等魔來乃至不能動一毛故。是為十。若諸菩薩安住此法，則得如來無上大智光明藏心。「佛子！\n\n**（条 136／201）有十種被甲**：\n\n> 菩薩摩訶薩有十種被甲。何等為十？所謂：被大慈甲，救護一切眾生故；被大悲甲，堪忍一切諸苦故；被大願甲，一切所作究竟故；被迴向甲，建立一切佛莊嚴故；被福德甲，饒益一切諸眾生故，被波羅蜜甲，度脫一切諸含識故；被智慧甲，滅一切眾生煩惱闇故；被善巧方便甲，生普門善根故；被一切智心堅固不散亂甲，不樂餘乘故；被一心決定甲，於一切法離疑惑故。是為十。若諸菩薩安住此法，則被如來無上甲冑，悉能摧伏一切魔軍。「佛子！\n\n**（条 137／201）有十種器仗**：\n\n> 菩薩摩訶薩有十種器仗。何等為十？所謂；布施是菩薩器仗，摧破一切慳吝故；持戒是菩薩器仗，棄捨一切毀犯故；平等是菩薩器仗，斷除一切分別故；智慧是菩薩器仗，消滅一切煩惱故；正命是菩薩器仗，遠離一切邪命故；善巧方便是菩薩器仗，於一切處示現故；略說貪、瞋、癡等一切煩惱是菩薩器仗，以煩惱門度眾生故；生死是菩薩器仗，不斷菩薩行教化眾生故；說如實法是菩薩器仗，能破一切執著故；一切智是菩薩器仗，不捨菩薩行門故。是為十。若諸菩薩安住此法，則能除滅一切眾生長夜所集煩惱結使。「佛子！\n\n**（条 138／201）有十種首**：\n\n> 菩薩摩訶薩有十種首。何等為十？所謂：涅槃首，無能見頂故；尊敬首，一切人、天所敬禮故；廣大勝解首，三千界中最為勝故；第一善根首，三界眾生咸供養故；荷戴眾生首，成就頂上肉髻相故；不輕賤他首，於一切處常尊勝故；般若波羅蜜首，長養一切功德法故；方便智相應首，普現一切同類身故；教化一切眾生首，以一切眾生為弟子故；守護諸佛法眼首，能令三寶種不斷絕故。是為十。若諸菩薩安住此法，則得如來無上大智慧首。\n\n**（条 139／201）有十種眼**：\n\n> 菩薩摩訶薩有十種眼。所謂：肉眼，見一切色故；天眼，見一切眾生心故；慧眼，見一切眾生諸根境界故；法眼，見一切法如實相故；佛眼，見如來十力故；智眼，知見諸法故；光明眼，見佛光明故；出生死眼，見涅槃故；無礙眼，所見無障故；一切智眼，見普門法界故。是為十。若諸菩薩安住此法，則得如來無上大智慧眼\n\n**（条 140／201）有十種耳**：\n\n> 菩薩摩訶薩有十種耳。何等為十？所謂：聞讚歎聲，斷除貪愛；聞毀呰聲，斷除瞋恚；聞說二乘，不著不求；聞菩薩道，歡喜踊躍；聞地獄等諸苦難處，起大悲心，發弘誓願；聞說人、天勝妙之事，知彼皆是無常之法；聞有讚歎諸佛功德，勤加精進，令速圓滿；聞說六度、四攝等法，發心修行，願到彼岸；聞十方世界一切音聲，悉知如響，入不可說甚深妙義；菩薩摩訶薩從初發心乃至道場，常聞正法未曾暫息，而恒不捨化眾生事。是為十。若諸菩薩成就此法，則得如來無上大智慧耳。「佛子！\n\n**（条 141／201）有十種鼻**：\n\n> 菩薩摩訶薩有十種鼻。何等為十？所謂：聞諸臭物不以為臭；聞諸香氣不以為香；香臭俱聞，其心平等；非香非臭，安住於捨；若聞眾生衣服、臥具及其肢體所有香臭，則能知彼貪、恚、愚癡等分之行；若聞諸伏藏草木等香，皆如對目前，分明辨了；若聞下至阿鼻地獄、上至有頂眾生之香，皆知彼過去所行之行；若聞諸聲聞布施、持戒、多聞慧香，住一切智心，不令散動；若聞一切菩薩行香，以平等慧入如來地；聞一切佛智境界香，亦不廢捨諸菩薩行。是為十。若諸菩薩成就此法，則得如來無量無邊清淨鼻。「佛子！\n\n**（条 142／201）有十種舌**：\n\n> 菩薩摩訶薩有十種舌。何等為十？所謂：開示演說無盡眾生行舌；開示演說無盡法門舌；讚歎諸佛無盡功德舌；演暢辭辯無盡舌；開闡大乘助道舌；遍覆十方虛空舌；普照一切佛剎舌；普使眾生悟解舌；悉令諸佛歎喜舌；降伏一切諸魔外道，除滅一切生死煩惱，令至涅槃舌。是為十。若諸菩薩成就此法，則得如來遍覆一切諸佛國土無上舌。「佛子！\n\n**（条 143／201）有十種身**：\n\n> 菩薩摩訶薩有十種身。何等為十？所謂：人身，為教化一切諸人故；非人身，為教化地獄、畜生、餓鬼故；天身，為教化欲界、色界、無色界眾生故；學身，示現學地故；無學身，示現阿羅漢地故；獨覺身，教化令入辟支佛地故；菩薩身，令成就大乘故；如來身，智水灌頂故；意生身，善巧出生故；無漏法身，以無功用示現一切眾生身故。是為十。若諸菩薩成就此法，則得如來無上之身。「佛子！\n\n**（条 144／201）有十種意**：\n\n> 菩薩摩訶薩有十種意。何等為十？所謂上首意，發起一切善根故；安住意，深信堅固不動故；深入意，隨順佛法而解故；內了意，知諸眾生心樂故；無亂意，一切煩惱不雜故；明淨意，客塵不能染著故；善觀眾生意，無有一念失時故；善擇所作意，未曾一處生過故；密護諸根意，調伏不令馳散故；善入三昧意，深入佛三昧無我、我所故。是為十。若諸菩薩安住此法，則得一切佛無上意。「佛子！\n\n**（条 145／201）有十種行**：\n\n> 菩薩摩訶薩有十種行。何等為十？所謂：聞法行，愛樂於法故；說法行，利益眾生故；離貪、恚，癡怖畏行，調伏自心故；欲界行，教化欲界眾生故；色、無色界三昧行，令速轉還故；趣向法義行，速得智慧故；一切生處行，自在教化眾生故；一切佛剎行，禮拜供養諸佛故；涅槃行，不斷生死相續故；成滿一切佛法行，不捨菩薩法行故。是為十。若諸菩薩安住此法，則得如來無來無去行。「佛子！\n\n**（条 146／201）有十種住**：\n\n> 菩薩摩訶薩有十種住。何等為十？所謂：菩提心住，曾不忘失故；波羅蜜住，不厭助道故；說法住，增長智慧故；阿蘭若住，證大禪定故；隨順一切智頭陀知足四聖種住，少欲少事故；深信住，荷負正法故；親近如來住，學佛威儀故；出生神通住，圓滿大智故；得忍住，滿足授記故；道場住，具足力、無畏、一切佛法故。是為十。若諸菩薩安住此法，則得一切智無上住。「佛子！\n\n**（条 147／201）有十種坐**：\n\n> 菩薩摩訶薩有十種坐。何等為十？所謂：轉輪王坐，興十善道故；四天王坐，於一切世間自在安立佛法故；帝釋坐，與一切眾生為勝主故；梵天坐，於自他心得自在故；師子坐，能說法故；正法坐，以總持辯才力而開示故；堅固坐，誓願究竟故；大慈坐，令惡眾生悉歡喜故；大悲坐，忍一切苦不疲厭故；金剛坐，降伏眾魔及外道故。是為十。若諸菩薩安住此法，則得如來無上正覺坐。「佛子！\n\n**（条 148／201）有十種臥**：\n\n> 菩薩摩訶薩有十種臥。何等為十？所謂：寂靜臥，身心憺怕故；禪定臥，如理修行故；三昧臥，身心柔軟故；梵天臥，不惱自他故；善業臥，於後不悔故；正信臥，不可傾動故；正道臥，善友開覺故；妙願臥，善巧迴向故；一切事畢臥，所作成辦故；捨諸功用臥，一切慣習故。是為十。若諸菩薩安住此法，則得如來無上大法臥，悉能開悟一切眾生。「佛子！\n\n**（条 149／201）有十種所住處**：\n\n> 菩薩摩訶薩有十種所住處。何等為十？所謂；以大慈為所住處，於一切眾生心平等故；以大悲為所住處，不輕未學故；以大喜為所住處，離一切憂惱故；以大捨為所住處，於有為、無為平等故；以一切波羅蜜為所住處，菩提心為首故；以一切空為所住處，善巧觀察故；以無相為所住處，不出正位故；以無願為所住處，觀察受生故；以念慧為所住處，忍法成滿故；以一切法平等為所住處，得授記別故。是為十。若諸菩薩安住此法，則得如來無上無礙所住處。「佛子！\n\n**（条 150／201）有十種所行處**：\n\n> 菩薩摩訶薩有十種所行處。何等為十？所謂：以正念為所行處，滿足念處故；以諸趣為所行處，正覺法趣故；以智慧為所行處，得佛歡喜故；以波羅蜜為所行處，滿足一切智智故；以四攝為所行處，教化眾生故；以生死為所行處，積集善根故；以與一切眾生雜談戲為所行處，隨應教化令永離故；以神通為所行處，知一切眾生諸根境界故；以善巧方便為所行處，般若波羅蜜相應故；以道場為所行處，成一切智而不斷菩薩行故。是為十。若諸菩薩安住此法，則得如來無上大智慧所行處。「佛子！\n\n**（条 151／201）有十種觀察**：\n\n> 菩薩摩訶薩有十種觀察。何等為十？所謂：知諸業觀察，微細悉見故；知諸趣觀察，不取眾生故；知諸根觀察，了達無根故；知諸法觀察，不壞法界故；見佛法觀察，勤修佛眼故；得智慧觀察，如理說法故；無生忍觀察，決了佛法故；不退地觀察，滅一切煩惱，超出三界、二乘地故；灌頂地觀察，於一切佛法自在不動故；善覺智三昧觀察，於一切十方施作佛事故。是為十。若諸菩薩安住此法，則得如來無上大觀察智。「佛子！\n\n**（条 152／201）有十種普觀察**：\n\n> 菩薩摩訶薩有十種普觀察。何等為十？所謂：普觀一切諸來求者，以無違心滿其意故；普觀一切犯戒眾生，安置如來淨戒中故；普觀一切害心眾生，安置如來忍力中故；普觀一切懈怠眾生，勸令精勤不捨荷負大乘擔故；普觀一切亂心眾生，令住如來一切智地無散動故；普觀一切惡慧眾生，令除疑惑破有見故；普觀一切平等善友，順其教命住佛法故；普觀一切所聞之法，疾得證見最上義故；普觀一切無邊眾生，常不捨離大悲力故；普觀一切諸佛之法，速得成就一切智故。是為十。若諸菩薩安住此法，則得如來無上大智慧普觀察。「佛子！\n\n**（条 153／201）有十種奮迅**：\n\n> 菩薩摩訶薩有十種奮迅。何等為十？所謂：牛王奮迅，映蔽一切天、龍、夜叉、乾闥婆等諸大眾故；象王奮迅，心善調柔，荷負一切諸眾生故；龍王奮迅，興大法密雲，耀解脫電光，震如實義雷，降諸根、力、覺分、禪定、解脫、三昧甘露雨故；大金翅鳥王奮迅，竭貪愛水，破愚癡㲉，搏撮煩惱諸惡毒龍，令出生死大苦海故；大師子王奮迅，安住無畏平等大智以為器仗，摧伏眾魔及外道故；勇健奮迅，能於生死大戰陣中摧滅一切煩惱怨故；大智奮迅，知蘊、界、處及諸緣起，自在開示一切法故；陀羅尼奮迅，以念慧力持法不忘，隨眾生根為宣說故；辯才奮迅，無礙迅疾分別一切，咸令受益心歡喜故；如來奮迅，一切智智助道之法皆悉成滿，以一念相應慧，所應得者一切皆得，所應悟者一切皆悟，坐師子座降魔怨敵，成阿耨多羅三藐三菩提故。是為十。若諸菩薩安住此法，則得諸佛於一切法無上自在奮迅。「佛子！\n\n**（条 154／201）有十種師子吼**：\n\n> 菩薩摩訶薩有十種師子吼。何等為十？所謂：唱言：『我當必定成正等覺。』是菩提心大師子吼。『我當令一切眾生，未度者度，未脫者脫，未安者安，未涅槃者令得涅槃。』是大悲大師子吼。『我當令佛、法、僧種無有斷絕。』是報如來恩大師子吼。\n>\n> 『我當嚴淨一切佛剎。』是究竟堅誓大師子吼。『我當除滅一切惡道及諸難處。』是自持淨戒大師子吼。『我當滿足一切諸佛身、語及意相好莊嚴。』是求福無厭大師子吼。『我當成滿一切諸佛所有智慧。』是求智無厭大師子吼。『我當除滅一切眾魔及諸魔業。\n>\n> 』是修正行斷諸煩惱大師子吼。『我當了知一切諸法無我，無眾生、無壽命、無補伽羅，空、無相、無願，淨如虛空。』是無生法忍大師子吼。最後生菩薩震動一切諸佛國土悉令嚴淨，是時，一切釋、梵、四王咸來讚請：『唯願菩薩以無生法而現受生！\n>\n> 』菩薩則以無礙慧眼普觀世間：『一切眾生無如我者。』即於王宮示現誕生，自行七步大師子吼：『我於世間最勝\n>\n> 第一，我當永盡生死邊際。』是如說而作大師子吼。是為十。若諸菩薩安住此法，則得如來無上大師子吼。「佛子！\n\n**（条 155／201）有十種清淨施**：\n\n> 菩薩摩訶薩有十種清淨施。何等為十？所謂：平等施，不揀眾生故；隨意施，滿其所願故；不亂施，令得利益故；隨宜施，知上、中、下故；不住施，不求果報故；開捨施，心不戀著故；一切施，究竟清淨故；迴向菩提施，遠離有為、無為故；教化眾生施，乃至道場不捨故；三輪清淨施，於施者、受者及以施物正念觀察如虛空故。是為十。若諸菩薩安住此法，則得如來無上清淨廣大施。「佛子！\n\n**（条 156／201）有十種清淨戒**：\n\n> 菩薩摩訶薩有十種清淨戒。何等為十？所謂：身清淨戒，護身三惡故；語清淨戒，離語四過故；心清淨戒，永離貪、瞋、邪見故；不破一切學處清淨戒，於一切人、天中作尊主故；守護菩提心清淨戒，不樂小乘故；守護如來所制清淨戒，乃至微細罪生大怖畏故；隱密護持清淨戒，善拔犯戒眾生故；不作一切惡清淨戒，誓修一切善法故；遠離一切有見清淨戒，於戒無著故；守護一切眾生清淨戒，發起大悲故。是為十。若諸菩薩安住此法，則得如來無上無過失清淨戒。「佛子！\n\n**（条 157／201）有十種清淨忍**：\n\n> 菩薩摩訶薩有十種清淨忍。何等為十？所謂：安受呰辱清淨忍，護諸眾生故；安受刀杖清淨忍，善護自他故；不生恚害清淨忍，其心不動故；不責卑賤清淨忍，為上能寬故；有歸咸救清淨忍，捨自身命故；遠離我慢清淨忍，不輕未學故；殘毀不瞋清淨忍，觀察如幻故；有犯無報清淨忍，不見自他故；不隨煩惱清淨忍，離諸境界故；隨順菩薩真實智知一切法無生清淨忍，不由他教，入一切智境界故。是為十。若諸菩薩安住其中，則得一切諸佛不由他悟無上法忍。「佛子！\n\n**（条 158／201）有十種清淨精進**：\n\n> 菩薩摩訶薩有十種清淨精進。何等為十？所謂：身清淨精進，承事供養諸佛菩薩及諸師長，尊重福田不退轉故；語清淨精進，隨所聞法廣為他說，讚佛功德無疲倦故；意清淨精進，善能入出慈、悲、喜、捨、禪定、解脫及諸三昧無休息故；正直心清淨精進，無誑無諂，無曲無偽，一切勤修無退轉故；增勝心清淨精進，志常趣求上上智慧，願具一切白淨法故；不唐捐清淨精進，攝取布施、戒、忍、多聞及不放逸乃至菩提無中息故；摧伏一切魔清淨精進，悉能除滅貪欲、瞋恚、愚癡、邪見、一切煩惱、諸纏蓋故；成滿智慧光清淨精進，有所施為悉善觀察，咸使究竟，不令後悔，得一切佛不共法故；無來無去清淨精進，得如實智，入法界門，身、語及心皆悉平等，了相非相，無所著故；成就法光清淨精進，超過諸地，得佛灌頂，以無漏身而示歿生、出家、成道、說法、滅度，具足如是普賢事故。是為十。若諸菩薩安住此法，則得如來無上大清淨精進。「佛子！\n\n**（条 159／201）有十種清淨禪**：\n\n> 菩薩摩訶薩有十種清淨禪。何等為十？所謂：常樂出家清淨禪，捨一切所有故；得真善友清淨禪，示教正道故；住阿蘭若忍風雨等清淨禪，離我、我所故；離憒閙眾生清淨禪，常樂寂靜故；心業調柔清淨禪，守護諸根故；心智寂滅清淨禪，一切音聲、諸禪定刺不能亂故；覺道方便清淨禪，觀察一切皆現證故；離於味著清淨禪，不捨欲界故；發起通明清淨禪，知一切眾生根性故；自在遊戲清淨禪，入佛三昧，知無我故。是為十。若諸菩薩安住其中，則得如來無上大清淨禪。「佛子！\n\n**（条 160／201）有十種清淨慧**：\n\n> 菩薩摩訶薩有十種清淨慧。何等為十？所謂：知一切因清淨慧，不壞果報故；知一切緣清淨慧，不違和合故；知不斷不常清淨慧，了達緣起皆如實故；拔一切見清淨慧，於眾生相無取捨故；觀一切眾生心行清淨慧，了知如幻故；廣大辯才清淨慧，分別諸法、問答無礙故；一切諸魔、外道、聲聞、獨覺所不能知清淨慧，深入一切如來智故；見一切佛微妙法身、見一切眾生本性清淨、見一切法皆悉寂滅、見一切剎同於虛空清淨慧，知一切相皆無礙故；一切總持、辯才、方便波羅蜜清淨慧，令得一切最勝智故；一念相應金剛智了一切法平等清淨慧，得一切法最尊智故。是為十。若諸菩薩安住其中，則得如來無障礙大智慧。「佛子！\n\n**（条 161／201）有十種清淨慈**：\n\n> 菩薩摩訶薩有十種清淨慈。何等為十？所謂：等心清淨慈，普攝眾生無所揀擇故；饒益清淨慈，隨有所作皆令歡喜故；攝物同己清淨慈，究竟皆令出生死故；不捨世間清淨慈，心常緣念集善根故；能至解脫清淨慈，普使眾生除滅一切諸煩惱故；出生菩提清淨慈，普使眾生發求一切智心故；世間無礙清淨慈，放大光明平等普照故；充滿虛空清淨慈，救護眾生無處不至故；法緣清淨慈，證於如如真實法故；無緣清淨慈，入於菩薩離生性故。是為十。若諸菩薩安住此法，則得如來無上廣大清淨慈。「佛子！\n\n**〔L.279 批·组 161–200 注入·11,714 CJK·0 手抄〕**\n\n**（条 162／201）有十種清淨悲**：\n\n> 菩薩摩訶薩有十種清淨悲。何等為十？所謂：無儔伴清淨悲，獨發其心故。無疲厭清淨悲，代一切眾生受苦，不以為勞故。難處受生清淨悲，為度眾生故。善趣受生清淨悲，示現無常故。為邪定眾生清淨悲，歷劫不捨弘誓故。不著己樂清淨悲，普與眾生快樂故。不求恩報清淨悲，修潔其心故。能除顛倒清淨悲，說如實法故。菩薩摩訶薩知一切法本性清淨、無染著、無熱惱，以客塵煩惱故而受眾苦；如是知已，於諸眾生而起大悲，名：本性清淨，為說無垢清淨光明法故。菩薩摩訶薩知一切法如空中鳥迹，眾生癡翳不能照了；觀察於彼，起大悲心，名：真實智，為其開示涅槃法故。是為十。若諸菩薩安住此法，則得如來無上廣大清淨悲。「佛子！\n\n**（条 163／201）有十種清淨喜**：\n\n> 菩薩摩訶薩有十種清淨喜。何等為十？所謂：發菩提心清淨喜；悉捨所有清淨喜；不嫌棄破戒眾生而教化成就清淨喜；能忍受造惡眾生，誓願救度清淨喜；捨身求法不生悔心清淨喜；自捨欲樂，常樂法樂清淨喜；令一切眾生捨資生樂，常樂法樂清淨喜；見一切佛恭敬供養無有厭足，法界平等清淨喜；令一切眾生愛樂禪定、解脫、三昧遊戲入出清淨喜；心樂具行順菩薩道一切苦行，證得牟尼寂靜不動無上定慧清淨喜。是為十。若諸菩薩安住此法，則得如來無上廣大清淨喜。「佛子！\n\n**（条 164／201）有十種清淨捨**：\n\n> 菩薩摩訶薩有十種清淨捨。何等為十？所謂：一切眾生恭敬供養，不生愛著清淨捨；一切眾生輕慢毀辱，不生瞋恚清淨捨；常行世間，不為世間八法所染清淨捨；於法器眾生待時而化，於無法器亦不生嫌清淨捨；不求二乘學、無學法清淨捨；心常遠離一切欲樂、順煩惱法清淨捨；不歎二乘、厭離生死清淨捨；遠離一切世間語，非涅槃語、非離欲語、不順理語、惱亂他語、聲聞獨覺語，略說乃至一切障菩薩道語皆悉遠離清淨捨；或有眾生，根已成熟發生念慧而未能知最上之法，待時方化清淨捨；或有眾生，菩薩往昔已曾教化至於佛地方可調伏，彼亦待時清淨捨；菩薩摩訶薩於彼二人，無高無下，無取無捨，遠離一切種種分別，恒住正定，入如實法，心得堪忍清淨捨。是為十。若諸菩薩安住其中，則得如來無上廣大清淨捨。「佛子！\n\n**（条 165／201）有十種義**：\n\n> 菩薩摩訶薩有十種義。何等為十？所謂：多聞義，堅固修行故；法義，善巧思擇故；空義，第一義空故；寂靜義，離諸眾生諠憒故；不可說義，不著一切語言故；如實義，了達三世平等故；法界義，一切諸法一味故；真如義，一切如來順入故；實際義，了知究竟如實故；大般涅槃義，滅一切苦而修菩薩諸行故。是為十。若諸菩薩安住此法，則得一切智無上義。「佛子！\n\n**（条 166／201）有十種法**：\n\n> 菩薩摩訶薩有十種法。何等為十？所謂：真實法，如說修行故；離取法，能取、所取悉離故；無諍法，無有一切惑諍故；寂滅法，滅除一切熱惱故；離欲法，一切貪欲皆斷故；無分別法，攀緣分別永息故；無生法，猶如虛空不動故；無為法，離生、住、滅諸相故；本性法，自性無染清淨故；捨一切烏波提涅槃法，能生一切菩薩行，修習不斷故。是為十。若諸菩薩安住其中，則得如來無上廣大法。「佛子！\n\n**（条 167／201）有十種福德助道具**：\n\n> 菩薩摩訶薩有十種福德助道具。何等為十？所謂：勸眾生起菩提心，是菩薩福德助道具；不斷三寶種故。隨順十種迴向，是菩薩福德助道具；斷一切不善法，集一切善法故。智慧誘誨，是菩薩福德助道具；超過三界福德故。心無疲倦，是菩薩福德助道具；\n>\n> 究竟度脫一切眾生故。悉捨內外一切所有，是菩薩福德助道具；於一切物無所著故。為滿足相好精進不退，是菩薩福德助道具；開門大施無所限故。上、中、下三品善根，悉以迴向無上菩提，心無所輕，是菩薩福德助道具；善巧方便相應故。於邪定、下劣、不善眾生，皆生大悲，不懷輕賤，是菩薩福德助道具；\n>\n> 常起大人弘誓心故。恭敬供養一切如來，於一切菩薩起如來想，令一切眾生皆生歡喜，是菩薩福德助道具；守本志願極堅牢故。菩薩摩訶薩於阿僧祇劫積集善根，自欲取證無上菩提如在掌中，然悉捨與一切眾生，心無憂惱亦無悔恨，其心廣大等虛空界，此是菩薩福德助道具；\n>\n> 起大智慧證大法故。是為十。若諸菩薩安住其中，則具足如來無上廣大福德聚。「佛子！\n\n**（条 168／201）有十種智慧助道具**：\n\n> 菩薩摩訶薩有十種智慧助道具。何等為十？所謂：親近多聞真善知識，恭敬供養，尊重禮拜，種種隨順，不違其教，是為一；一切正直無虛矯故。永離憍慢，常行謙敬，身、語、意業無有麁獷，柔和善順，不偽不曲，是為二；其身堪作佛法器故。念慧隨覺未曾散亂，慚愧柔和，心安不動，常憶六念，常行六敬，常隨順住六堅固法，是為三；\n>\n> 與十種智為方便故。樂法、樂義，以法為樂，常樂聽聞無有厭足，捨離世論及世言說，專心聽受出世間語，遠離小乘，入大乘慧，是為四；一心憶念無散動故。六波羅蜜心專荷負，四種梵住行已成熟，隨順明法悉善修行，聰敏智人皆勤請問，遠離惡趣，歸向善道，心常愛樂，正念觀察，調伏己情，守護他意，是為五；\n>\n> 堅固修行真實行故。常樂出離，不著三有，恒覺自心，曾無惡念，三覺已絕，三業皆善，決定了知心之自性，是為六；能令自他心清淨故。觀察五蘊皆如幻事，界如毒蛇，處如空聚，一切諸法如幻、如焰、如水中月、如夢、如影、如響、如像、如空中畫、如旋火輪、如虹霓色、如日月光，無相無形，非常非斷，不來不去，亦無所住，如是觀察，知一切法無生無滅，是為七；\n>\n> 知一切法性空寂故。菩薩摩訶薩聞一切法無我、無眾生、無壽者、無補伽羅、無心、無境、無貪瞋癡、無身、無物、無主、無待、無著、無行，如是一切皆無所有、悉歸寂滅，聞已深信，不疑不謗，是為八；以能成就圓滿解故。菩薩摩訶薩善調諸根，如理修行，恒住止觀，心意寂靜，一切動念皆悉不生，無我、無人、無作、無行、無計我想、無計我業、無有瘡疣、無有瘢痕，亦無於此所得之忍，身、語、意業無來無去，無有精進亦無勇猛，觀一切眾生、一切諸法，心皆平等而無所住，非此岸、非彼岸，此彼性離，無所從來，無所至去，常以智慧如是思惟，是為九；\n>\n> 到分別相彼岸處故。菩薩摩訶薩見緣起法故見法清淨，見法清淨故見國土清淨，見國土清淨故見虛空清淨，見虛空清淨故見法界清淨，見法界清淨故見智慧清淨，是為十；修行積集一切智故。佛子！是為菩薩摩訶薩十種智慧助道具。若諸菩薩安住此法，則得如來一切法無障礙清淨微妙智慧聚。\n>\n> 「佛子！\n\n**（条 169／201）有十種明足**：\n\n> 菩薩摩訶薩有十種明足。何等為十？所謂：善分別諸法明足；不取著諸法明足；離顛倒見明足；智慧光照諸根明足；巧發起正精進明足；能深入真諦智明足；滅煩惱業成就盡智無生智明足；天眼智普觀察明足；宿住念知前際清淨明足；漏盡神通智斷眾生諸漏明足。是為十。若諸菩薩安住此法，則得如來於一切佛法無上大光明。「佛子！\n\n**（条 170／201）有十種求法**：\n\n> 菩薩摩訶薩有十種求法。何等為十？所謂：直心求法，無有諂誑故；精進求法，遠離懈慢故；一向求法，不惜身命故；為斷一切眾生煩惱求法，不為名利恭敬故；為饒益自他一切眾生求法，不但自利故；為入智慧求法，不樂文字故；為出生死求法，不貪世樂故；為度眾生求法，發菩提心故；為斷一切眾生疑求法，令無猶豫故；為滿足佛法求法，不樂餘乘故。是為十。若諸菩薩安住此法，則得不由他教一切佛法大智慧。「佛子！\n\n**（条 171／201）有十種明了法**：\n\n> 菩薩摩訶薩有十種明了法。何等為十？所謂：隨順世俗生長善根，是童蒙凡夫明了法；得無礙不壞信，覺法自性，是隨信行人明了法；勤修習法，隨順法住，是隨法行人明了法；遠離八邪，向八正道，是第八人明了法；除滅眾結，斷生死漏，見真實諦，是須陀洹人明了法；觀味是患，知無往來，是斯陀含人明了法；不樂三界，求盡有漏，於受生法乃至一念不生愛著，是阿那含人明了法；獲六神通，得八解脫，九定、四辯悉皆成就，是阿羅漢人明了法；性樂觀察一味緣起，心常寂靜，知足少事，解因自得，悟不由他，成就種種神通智慧，是辟支佛人明了法；智慧廣大，諸根明利，常樂度脫一切眾生，勤修福智助道之法，如來所有十力、無畏、一切功德具足圓滿，是菩薩人明了法。是為十。若諸菩薩安住此法，則得如來無上大智明了法。「佛子！\n\n**（条 172／201）有十種修行法**：\n\n> 菩薩摩訶薩有十種修行法。何等為十？所謂：恭敬尊重諸善知識修行法；常為諸天之所覺悟修行法；於諸佛所常懷慚愧修行法；哀愍眾生不捨生死修行法；事必究竟心無變動修行法；專念隨逐發大乘心諸菩薩眾精勤修學修行法；遠離邪見勤求正道修行法；摧破眾魔及煩惱業修行法；知諸眾生根性勝劣而為說法令住佛地修行法；安住無邊廣大法界除滅煩惱令身清淨修行法。是為十。若諸菩薩安住其中，則得如來無上修行法。「佛子！\n\n**（条 173／201）有十種魔**：\n\n> 菩薩摩訶薩有十種魔。何等為十？所謂：蘊魔，生諸取故；煩惱魔，恒雜染故；業魔，能障礙故；心魔，起高慢故；死魔，捨生處故；天魔，自憍縱故；善根魔，恒執取故；三昧魔，久耽味故；善知識魔，起著心故；菩提法智魔，不願捨離故。是為十。菩薩摩訶薩應作方便，速求遠離。「佛子！\n\n**（条 174／201）有十種魔業**：\n\n> 菩薩摩訶薩有十種魔業。何等為十？所謂：忘失菩提心修諸善根，是為魔業；惡心布施，瞋心持戒，捨惡性人，遠懈怠者，輕慢亂意，譏嫌惡慧，是為魔業；於甚深法心生慳吝，有堪化者而不為說，若得財利恭敬供養，雖非法器而強為說，是為魔業；\n>\n> 不樂聽聞諸波羅蜜，假使聞說而不修行，雖亦修行多生懈怠，以懈怠故，志意狹劣，不求無上大菩提法，是為魔業；遠善知識，近惡知識，樂求二乘，不樂受生，志尚涅槃離欲寂靜，是為魔業；於菩薩所起瞋恚心，惡眼視之，求其罪釁，說其過惡，斷彼所有財利供養，是為魔業；\n>\n> 誹謗正法不樂聽聞，假使得聞便生毀呰，見人說法不生尊重，言自說是，餘說悉非，是為魔業；樂學世論巧術文詞，開闡二乘，隱覆深法，或以妙義授非其人，遠離菩提住於邪道，是為魔業；已得解脫、已安隱者常樂親近而供養之，未得解脫、未安隱者不肯親近亦不教化，是為魔業；\n>\n> 增長我慢，無有恭敬，於諸眾生多行惱害，不求正法真實智慧，其心弊惡難可開悟，是為魔業。是為十。菩薩摩訶薩應速遠離，勤求佛業。「佛子！\n\n**（条 175／201）有十種捨離魔業**：\n\n> 菩薩摩訶薩有十種捨離魔業。何等為十？所謂：近善知識恭敬供養，捨離魔業；不自尊舉，不自讚歎，捨離魔業；於佛深法信解不謗，捨離魔業；未曾忘失一切智心，捨離魔業；勤修妙行恒不放逸，捨離魔業；常求一切菩薩藏法，捨離魔業；恒演說法，心無疲倦，捨離魔業；歸依十方一切諸佛，起救護想，捨離魔業；信受憶念一切諸佛，神力加持，捨離魔業；與一切菩薩同種善根，平等無二，捨離魔業。是為十。若諸菩薩安住此法，則能出離一切魔道。「佛子！\n\n**（条 176／201）有十種見佛**：\n\n> 菩薩摩訶薩有十種見佛。何等為十？所謂：於安住世間成正覺佛無著見；願佛出生見；業報佛深信見；住持佛隨順見；涅槃佛深入見；法界佛普至見；心佛安住見；三昧佛無量無依見；本性佛明了見；隨樂佛普受見。是為十。若諸菩薩安住此法，則常得見無上如來。「佛子！\n\n**（条 177／201）有十種佛業**：\n\n> 菩薩摩訶薩有十種佛業。何等為十？所謂：隨時開導，是佛業；令正修行故。夢中令見，是佛業；覺昔善根故。為他演說所未聞經，是佛業；令生智斷疑故。為悔纏所纏者說出離法，是佛業；令離疑心故。若有眾生起慳吝心，乃至惡慧心、二乘心、損害心、疑惑心、散動心、憍慢心，為現如來眾相莊嚴身，是佛業；\n>\n> 生長過去善根故。於正法難遇時，廣為說法，令其聞已，得陀羅尼智、神通智，普能利益無量眾生，是佛業；勝解清淨故。若有魔事起，能以方便現虛空界等聲，說不損惱他法以為對治，令其開悟，眾魔聞已威光歇滅，是佛業；志樂殊勝，威德大故。\n>\n> 其心無間，常自守護，不令證入二乘正位，若有眾生根性未熟，終不為說解脫境界，是佛業；本願所作故。生死結漏一切皆離，修菩薩行相續不斷，以大悲心攝取眾生，令其起行究竟解脫，是佛業；不斷修行菩薩行故。菩薩摩訶薩了達自身及以眾生本來寂滅不驚不怖而勤修福智無有厭足，雖知一切法無有造作而亦不捨諸法自相，雖於諸境界永離貪欲而常樂瞻奉諸佛色身，雖知不由他悟入於法而種種方便求一切智，雖知諸國土皆如虛空而常樂莊嚴一切佛剎，雖恒觀察無人無我而教化眾生無有疲厭，雖於法界本來不動而以神通智力現眾變化，雖已成就一切智智而修菩薩行無有休息，雖知諸法不可言說而轉淨法輪令眾心喜，雖能示現諸佛神力而不厭捨菩薩之身，雖現入於大般涅槃而一切處示現受生，能作如是權實雙行法，是佛業。\n>\n> 是為十。若諸菩薩安住其中，則得不由他教無上無師廣大業。「佛子！\n\n**（条 178／201）有十種慢業**：\n\n> 菩薩摩訶薩有十種慢業。何等為十？所謂：於師、僧、父母、沙門、婆羅門、住於正道向正道者，尊重福田所而不恭敬，是慢業；或有法師獲最勝法，乘於大乘，知出要道，得陀羅尼，演說契經廣大之法無有休息，而於其所起高慢心，及於所說法不生恭敬，是慢業；\n>\n> 於眾會中聞說妙法，不肯歎美令人信受，是慢業；好起過慢，自高陵物，不見己失，不知自短，是慢業；好起過過慢，見有德人應讚不讚，見他讚歎不生歡喜，是慢業；見有法師為人說法，知是法、是律、是真實、是佛語，為嫌其人亦嫌其法，自起誹謗亦令他謗，是慢業；\n>\n> 自求高座，自稱法師，應受供給，不應執事，見有耆舊久修行人不起逢迎、不肯承事，是慢業；見有德人，顰蹙不喜，言辭麁獷，伺其過失，是慢業；見有聰慧知法之人，不肯親近恭敬供養，不肯諮問：『何等為善？何等不善？何等應作？何等不應作？\n>\n> 作何等業，於長夜中而得種種利益安樂？』愚癡頑很，我慢所吞，終不能見出要之道，是慢業；復有眾生慢心所覆，諸佛出世不能親近恭敬供養，新善不起，舊善消滅，不應說而說，不應諍而諍，未來必墮險難深坑，於百千劫尚不值佛，何況聞法！但以曾發菩提心故，終自醒悟，是慢業。\n>\n> 是為十。「\n\n**（条 179／201）離此慢業，則得十種智業**：\n\n> 若諸菩薩離此慢業，則得十種智業。何等為十？所謂：信解業報，不壞因果，是智業；不捨菩提心，常念諸佛，是智業；近善知識恭敬供養，其心尊重終無厭怠，是智業；樂法、樂義無有厭足，遠離邪念，勤修正念，是智業；於一切眾生離於我慢，於諸菩薩起如來想，愛重正法如惜己身，尊奉如來如護己命，於修行者生諸佛想，是智業；身、語、意業無諸不善，讚美賢聖，隨順菩提，是智業；不壞緣起，離諸邪見，破闇得明，照一切法，是智業；十種迴向隨順修行，於諸波羅蜜起慈母想，於善巧方便起慈父想，以深淨心入菩提舍，是智業；施、戒、多聞、止觀、福慧，如是一切助道之法常勤積集無有厭倦，是智業；若有一業為佛所讚，能破眾魔煩惱鬪諍，能離一切障、蓋、纏、縛，能教化調伏一切眾生，能隨順智慧攝取正法，能嚴淨佛剎，能發起通明，皆勤修習無有懈退，是智業。是為十。若諸菩薩安住其中，則得如來一切善巧方便無上大智業。「佛子！\n\n**（条 180／201）有十種魔所攝持**：\n\n> 菩薩摩訶薩有十種魔所攝持。何等為十？所謂：懈怠心，魔所攝持；志樂狹劣，魔所攝持；於少行生足，魔所攝持；受一非餘，魔所攝持；不發大願，魔所攝持；樂處寂滅，斷除煩惱，魔所攝持；永斷生死，魔所攝持；捨菩薩行，魔所攝持；不化眾生，魔所攝持；疑謗正法，魔所攝持。是為十。「\n\n**（条 181／201）能棄捨此魔所攝持，則得十種佛所攝持**：\n\n> 若諸菩薩能棄捨此魔所攝持，則得十種佛所攝持。何等為十？所謂：初始能發菩提之心，佛所攝持；於生生中持菩提心不令忘失，佛所攝持；覺諸魔事，悉能遠離，佛所攝持；聞諸波羅蜜，如說修行，佛所攝持；知生死苦而不厭惡，佛所攝持；觀甚深法，得無量果，佛所攝持；為諸眾生說二乘法，而不證取彼乘解脫，佛所攝持；樂觀無為法而不住其中，於有為、無為不生二想，佛所攝持；至無生處而現受生，佛所攝持；雖證得一切智，而起菩薩行，不斷菩薩種，佛所攝持。是為十。若諸菩薩安住其中，則得諸佛無上攝持力。「佛子！\n\n**（条 182／201）有十種法所攝持**：\n\n> 菩薩摩訶薩有十種法所攝持。何等為十？所謂：知一切行無常，法所攝持；知一切行苦，法所攝持；知一切行無我，法所攝持；知一切法寂滅涅槃，法所攝持；知諸法從緣起，無緣則不起，法所攝持；知不正思惟故起於無明，無明起故乃至老死起，不正思惟滅故無明滅，無明滅故乃至老死滅，法所攝持；知三解脫門出生聲聞乘，證無諍法出生獨覺乘，法所攝持；知六波羅蜜、四攝法出生大乘，法所攝持；知一切剎、一切法、一切眾生、一切世是佛智境界，法所攝持；知斷一切念，捨一切取，離前後際，隨順涅槃，法所攝持。是為十。若諸菩薩安住其中，則得一切諸佛無上法所攝持。「佛子！\n\n**（条 183／201）住兜率天，有十種所作業**：\n\n> 菩薩摩訶薩住兜率天，有十種所作業。何等為十？所謂：為欲界諸天子說厭離法言：『一切自在皆是無常，一切快樂悉當衰謝。』勸彼諸天發菩提心。是為\n>\n> 第一所作業。為色界諸天說入出諸禪解脫三昧，若於其中而生愛著，因愛復起身見、邪見、無明等者，則為其說如實智慧；若於一切色、非色法起顛倒想，以為清淨，為說不淨皆是無常，勸其令發菩提之心。是為\n>\n> 第二所作業。菩薩摩訶薩住兜率天，入三昧，名：光明莊嚴，身放光明，遍照三千大千世界，隨眾生心，以種種音而為說法；眾生聞已，信心清淨，命終生於兜率天中，勸其令發菩提之心。是為\n>\n> 第三所作業。菩薩摩訶薩在兜率天，以無障礙眼普見十方兜率天中一切菩薩，彼諸菩薩皆亦見此；互相見已，論說妙法，謂：降神母胎、初生、出家、往詣道場、具大莊嚴；而復示現往昔已來所行之行，以彼行故成此大智；所有功德不離本處，而能示現如是等事。\n>\n> 是為\n>\n> 第四所作業。菩薩摩訶薩住兜率天，十方一切兜率天宮諸菩薩眾，皆悉來集，恭敬圍遶；爾時，菩薩摩訶薩欲令彼諸菩薩皆滿其願生歡喜故，隨彼菩薩所應住地、所行所斷、所修所證，演說法門；彼諸菩薩聞說法已，皆大歡喜，得未曾有，各還本土所住宮殿。\n>\n> 是為\n>\n> 第五所作業。菩薩摩訶薩住兜率天時，欲界主天魔波旬，為欲壞亂菩薩業故，眷屬圍遶詣菩薩所；爾時，菩薩為摧伏魔軍故，住金剛道所攝般若波羅蜜方便善巧智慧門，以柔軟、麁獷二種語而為說法，令魔波旬不得其便；魔見菩薩自在威力，皆發阿耨多羅三藐三菩提心。\n>\n> 是為\n>\n> 第六所作業。菩薩摩訶薩住兜率天，知欲界諸天子不樂聞法；爾時，菩薩出大音聲，遍告之言：『今日菩薩當於宮中現希有事，若欲見者宜速往詣。』時，諸天子聞是語已，無量百千億那由他皆來集會；爾時，菩薩見諸天眾皆來集已，為現宮中諸希有事；\n>\n> 彼諸天子曾未見聞，既得見已，皆大歡喜，其心醉沒；又於樂中出聲告言：『諸仁者！一切諸行皆悉無常，一切諸行皆悉是苦，一切諸法皆悉無我，涅槃寂滅。』又復告言：『汝等皆應修菩薩行，皆當圓滿一切智智。』彼諸天子聞此法音，憂歎諮嗟而生厭離，靡不皆發菩提之心。\n>\n> 是為\n>\n> 第七所作業。菩薩摩訶薩住兜率宮，不捨本處，悉能往詣十方無量一切佛所，見諸如來親近禮拜恭敬聽法；爾時，諸佛欲令菩薩獲得最上灌頂法故，為說菩薩地，名：一切神通，以一念相應
