<script>
function copyPageLink(){
  var url = window.location.href;
  var toast = document.getElementById('share-toast');
  function done(msg, ok){
    if(toast){ toast.textContent = msg; toast.style.display='block'; setTimeout(function(){ toast.style.display='none'; }, 2600); }
    return ok;
  }
  function fallback(u){
    var ta = document.createElement('textarea'); ta.value = u; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done('✅ 本页独立地址已复制：' + u, true); }
    catch(e){ done('📋 请手动复制地址：' + u, false); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){ done('✅ 本页独立地址已复制：' + url, true); },
      function(){ fallback(url); });
  } else {
    fallback(url);
  }
}
</script>


<script>
var ARTICLE = {"id": "huayan-series-outline", "file": "articles/huayan-series-outline.html", "title": "华严经细读·系列总纲", "title_sub": "三十九品品目次第·各品精读方式规划 · 单品独读/多品合读 · 完备度自陈", "icon": "🗺", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读_系列总纲.md", "doc_md": "# 华严经细读·系列总纲（品目次第与精读规划）\n\n> **【体例声明】** 本系列**按八十华严三十九品之品目次第**推进，一部一品（或数品合读一部），每一部独立成篇、独立成址。**各品篇幅悬殊，故精读方式不一**：或单品独读，或数品合读，或以「卷一组群」为实际单位。**凡未开读者、未竟者、待核者，一律标明**，不以目录充作已读，不以骨架冒充细读。\n\n---\n\n## 一、系列定位与读法\n\n1. **底本**：唐·实叉难陀八十华严（`T10n0279`）。不用六十华严（`T10n0278`）、四十华严（`T10n0279` 四十卷本）改写本改写原典，俾免以异译乱原典；异本对照另设附录。\n2. **一部一品／数品合读**：三十九品中，有的一品独占多卷（如世主妙严品卷一至五、入法界品卷六十至八十），有的仅一卷乃至半卷（如四圣谛品、须弥顶上偈赞品）。**故不强求一品一部**，依实际篇幅与义理结构，或独读、或与相邻品合读。\n3. **篇内结构**：底本校勘 → 逐段疏解 → 名相训释（梵汉对勘）→ 解脱门/法门会读 → 中英对照 → 附录（对读·存疑·资源）。\n4. **完备度自陈**：每篇篇首必标**本篇细读覆盖率**（已细读之组／总组数），篇末必列〔未竟〕台账。**宁可标注未备，不可含混了语**。\n5. **讲记会读**：本项目 `docs/huayanhai` 存海云继梦法师等现代讲法讲记，逐组讲解，**凡引用皆给可点链接**（依〔编务总则 7·引用可点·出处可溯〕）。\n\n---\n\n## 二、三十九品品目次第与精读规划\n\n**卷次依本地《八十华严·大华严寺袖珍版》经文实测**（本版卷标 79 个，缺「卷第二十四」标，见〔校记〕）。\n\n| 品次 | 品名 | 卷次 | 篇长 | 拟精读方式 | 状态 |\n|---|---|---|---|---|---|\n| 1 | 世主妙严品 | 1–5 | **极长**（5 卷，32,713 字／1,151 句） | 单品独读·卷一组群详解 | 🔶 **进行中**（细读 4/50 组） |\n| 2 | 如来现相品 | 6 | 中 | 单品独读 | ⬜ 待开 |\n| 3 | 普贤三昧品 | 7 | 中 | 与第 2 品合读（同一会中） | ⬜ 待开 |\n| 4 | 世界成就品 | 7 | 中 | 单品独读（宇宙观要门） | ⬜ 待开 |\n| 5 | 华藏世界品 | 8–10 | 长 | 单品独读 | ⬜ 待开 |\n| 6 | 毗卢遮那品 | 11 | 中 | 单品独读 | ⬜ 待开 |\n| 7 | 如来名号品 | 12 | 中 | 单品独读 | ⬜ 待开 |\n| 8 | 四圣谛品 | 12 | **短** | 与第 7 品合读 | ⬜ 待开 |\n| 9 | 光明觉品 | 13 | 短 | 与第 10 品合读 | ⬜ 待开 |\n| 10 | 菩萨问明品 | 13 | 短 | 与第 9 品合读 | ⬜ 待开 |\n| 11 | 净行品 | 14 | 中 | 单品独读 | ⬜ 待开 |\n| 12 | 贤首品 | 14–15 | 中 | 单品独读 | ⬜ 待开 |\n| 13 | 升须弥山顶品 | 16 | 中 | 与第 14、15 品合读 | ⬜ 待开 |\n| 14 | 须弥顶上偈赞品 | 16 | **短**（附品） | 与第 13、15 品合读 | ⬜ 待开 |\n| 15 | 十住品 | 16–17 | 中 | 单品独读 | ⬜ 待开 |\n| 16 | 梵行品 | 17 | 中 | 与第 15、17 品合读 | ⬜ 待开 |\n| 17 | 初发心功德品 | 17–18 | 中 | 与第 16 品合读 | ⬜ 待开 |\n| 18 | 明法品 | 18 | 中 | 单品独读 | ⬜ 待开 |\n| 19 | 升夜摩天宫品 | 19 | 中 | 与第 20 品合读 | ⬜ 待开 |\n| 20 | 夜摩宫中偈赞品 | 19 | **短**（附品） | 与第 19 品合读 | ⬜ 待开 |\n| 21 | 十行品 | 20–21 | 长 | 单品独读 | ⬜ 待开 |\n| 22 | 十无尽藏品 | 21–22 | 中 | 与第 21 品合读 | ⬜ 待开 |\n| 23 | 升兜率天宫品 | 22 | 中 | 与第 24 品合读 | ⬜ 待开 |\n| 24 | 兜率宫中偈赞品 | 23 | **短**（附品） | 与第 23 品合读 | ⬜ 待开 |\n| 25 | 十回向品 | 24–33 | **极长**（10 卷） | 单品独读（十回向分十段） | ⬜ 待开 |\n| 26 | 十地品 | 34–39 | **极长**（6 卷） | 单品独读（十地分十段） | ⬜ 待开 |\n| 27 | 十定品 | 40–43 | 长 | 单品独读 | ⬜ 待开 |\n| 28 | 十通品 | 44 | 中 | 与第 27、29 品合读 | ⬜ 待开 |\n| 29 | 十忍品 | 44 | 中 | 与第 27、28 品合读 | ⬜ 待开 |\n| 30 | 阿僧祇品 | 45 | 中 | 与第 31、32 品合读 | ⬜ 待开 |\n| 31 | 如来寿量品 | 45 | 中 | 与第 30、32 品合读 | ⬜ 待开 |\n| 32 | 诸菩萨住处品 | 45 | 中 | 与第 30、31 品合读 | ⬜ 待开 |\n| 33 | 佛不思议法品 | 46–47 | 中 | 单品独读 | ⬜ 待开 |\n| 34 | 如来十身相海品 | 48 | 中 | 与第 35 品合读 | ⬜ 待开 |\n| 35 | 如来随好光明功德品 | 48 | 中 | 与第 34 品合读 | ⬜ 待开 |\n| 36 | 普贤行品 | 49 | 中 | 单品独读 | ⬜ 待开 |\n| 37 | 如来出现品 | 50–52 | 长 | 单品独读 | ⬜ 待开 |\n| 38 | 离世间品 | 53–59 | **极长**（7 卷） | 单品独读 | ⬜ 待开 |\n| 39 | 入法界品 | 60–80 | **最长**（21 卷） | 单品独读（或分多部） | ⬜ 待开 |\n\n**附品说明**：第 14、20、24 品为「偈赞品」，系正品之附（重颂前品），篇幅短，多与前品合读。八十卷本共 39 正品 ＋ 若干附品；本表所列 39 品为 CBETA `T10n0279` 目次。\n\n---\n\n## 三、已成篇与待续梯队\n\n### 3.1 已成篇\n\n| 篇 | 品次 | 状态 | 独立地址 |\n|---|---|---|---|\n| 第一部：世主妙严品 | 1 | 🔶 进行中·细读 4/50 组 | `web/demo/articles/shizhu-miaoyan.html` |\n\n### 3.2 待续梯队（建议推进次序）\n\n1. **第 2–3 品（如来现相、普贤三昧）**——与第一部同属第一会「宝楼阁会」，接续最便。\n2. **第 4–5 品（世界成就、华藏世界）**——宇宙观门户，为 Tab5「世主妙严」提供经证。\n3. **第 9–10 品（光明觉、菩萨问明）**——篇幅短，可作合读之先例。\n4. 其余依品目次序推进；第 25、26、39 品为三部大书，量最巨，须预留充分批次。\n\n---\n\n## 四、〔校记〕与〔存疑〕\n\n- **〔校记〕底本卷标缺失**：本项目所用《八十华严·大华严寺袖珍版》经文实测得**卷标 79 个**，缺「大方广佛华严经卷第二十四」卷标（其正文俱在）。故本表第 25 品十回向品之卷次，**据前后品界推定为卷 24–33**，其中卷 24 系推定，标〔待核〕。**品名目次 39 品则经实测与 CBETA 相合，可据。**\n- **〔存疑〕品次与附品之别**：偈赞品（第 14、20、24 等）在 CBETA 目次中列为独立品次，而在部分流通本中作正品之附。本表依 CBETA 目次列之，于「篇长」栏注明「附品」，其正附之别〔待考〕。\n- **〔未竟〕卷次精度**：本表卷次为品之起讫概数；品内逐卷之细分（如十住品跨 16–17 之确切分界），待逐品开读时以 CBETA 逐卷核之。\n\n---\n\n## 五、版本差异提示（六十／四十／藏）\n\n- 本系列主底本为**八十华严**。六十华严（`T10n0278`）少 21 品、名称亦异（如卷一为「世间净眼品」），四十华严（`T10n0279` 四十卷本）併「入法界」为末品。\n- 六十华严「世主妙严品」对应八十华严「世间净眼品＋佛功德门大海」等合併段，具体对读见第一部《世主妙严品》附录五。\n- 异本对读**另设附录**，不与主底本细读混同。\n\n---\n\n## 六、相关入口\n\n- **第一部·世主妙严品**：`web/demo/articles/shizhu-miaoyan.html`\n- **本项目经文底本**：`docs/huayanhai/义学专题/经论原典/`（八十华严繁／简／大正藏版、六十华严、四十华严）\n- **海云继梦讲记**：`docs/huayanhai/华严云海/浩瀚华严海/`\n- **CBETA 在线 T10n0279**：https://cbetaonline.dila.edu.tw/zh/T10n0279\n", "data_source": "", "data_pool": "practice", "back": {"tab": "gap", "view": "avatamsaka-studies", "label": "文献页 · 华严经学"}};
</script>
<script>
// ═══ 独立文章页渲染器 (articles/<id>.html) ═══
// ARTICLE 已由 build.py 内嵌；依赖 common.js 中的 _mdFullToHTML/_mdInline/_mdDocEmbed。
function renderArticle(){
  var a=(typeof ARTICLE!=='undefined')?ARTICLE:null;
  var root=document.getElementById('article-root');
  if(!root){return;}
  if(!a){root.innerHTML='<p style=font-size:0.85em;color:var(--red)>文章数据缺失（ARTICLE 未定义）。</p>';return;}

  var embed=(typeof _mdDocEmbed==='function')?_mdDocEmbed(a.doc_md||''):{html:'',toc:[]};
  var h='';

  // ── 面包屑 ──
  h+='<div style="font-size:0.74em;color:var(--text2);margin-bottom:12px;">';
  h+='<a href="../index.html" style="color:var(--blue);text-decoration:none">主页</a> › ';
  h+='<a href="index.html" style="color:var(--blue);text-decoration:none">独立文章目录</a>';
  if(a.back && a.back.tab){
    h+=' › <a href="../tabs/'+a.back.tab+'.html" style="color:var(--blue);text-decoration:none">'+a.back.label+'</a>';
  }
  h+='</div>';

  // ── 页头横幅 ──
  h+='<div style="background:linear-gradient(120deg,rgba(184,134,60,0.12),rgba(94,139,158,0.08));border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px;">';
  h+='  <div style="font-size:0.76em;color:var(--text2);letter-spacing:0.5px">📄 独立文章页</div>';
  h+='  <h2 style="color:var(--gold);margin:6px 0 4px">'+(a.icon?a.icon+' ':'')+a.title+'</h2>';
  if(a.title_sub)h+='  <div style="font-size:0.85em;color:var(--text2)">'+a.title_sub+'</div>';
  if(a.version)h+='  <div style="font-size:0.78em;color:var(--text2);margin-top:6px">'+a.version+'</div>';
  if(a.back && a.back.tab){
    h+='  <a href="../tabs/'+a.back.tab+'.html" style="font-size:0.75em;color:var(--blue);margin-top:10px;display:inline-block">← 返回 '+a.back.label+'</a>';
  }
  h+='</div>';

  // ── 导览 ──
  if(a.meta){
    h+='<div class="section" style="border-left:4px solid var(--gold)"><h2>📌 导览</h2>';
    h+='<p style="font-size:0.8em;line-height:1.9;white-space:pre-line">'+_mdInline(a.meta)+'</p></div>';
  }

  // ── 自动目录 ──
  if(embed.toc.length){
    h+='<div class="section"><h2>🧭 本文目录</h2>';
    h+='<div style="column-width:250px;column-gap:26px;font-size:0.8em;line-height:1.75">';
    embed.toc.forEach(function(t){
      var pad=(t.lv>2?'padding-left:'+((t.lv-2)*16)+'px;':'');
      h+='<div style="'+pad+'"><a href="#'+t.id+'" style="color:'+(t.lv===2?'var(--gold)':'var(--text2)')+';text-decoration:none">'+t.text+'</a></div>';
    });
    h+='</div></div>';
  }

  // ── 全文 ──
  h+='<div class="section" style="border-left:4px solid var(--gold)" id="article-full">';
  h+='<h2 style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px"><span>📄 '+a.title+' · 全文</span>'
    +'<button id="article-en-toggle" class="f-nav-btn" onclick="toggleArticleEN()" title="在「含英文批注」与「仅中文正文」之间切换显示">🌐 英文批注：显示</button></h2>';
  h+=embed.html;
  h+='</div>';

  // ── 页脚 ──
  h+='<div style="margin-top:18px;padding-top:10px;border-top:1px solid var(--line);font-size:0.74em;color:var(--text2)">';
  h+='<a href="index.html" style="color:var(--blue);text-decoration:none">📚 返回独立文章目录</a>';
  if(a.back && a.back.tab){
    h+=' · <a href="../tabs/'+a.back.tab+'.html" style="color:var(--blue);text-decoration:none">'+a.back.label+'</a>';
  }
  h+='</div>';

  root.innerHTML=h;

  // ── 阅读模式：识别「英文/术语批注」块，支持仅中文正文切换 ──
  _initArticleENMode();

  // ── 支持 #锚点 直达（目录跳转用真实 id 锚点）──
  if(location.hash){
    setTimeout(function(){
      var el=document.getElementById(location.hash.slice(1));
      if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    },80);
  }
}

if(document.readyState!=='loading'){renderArticle();}
else{document.addEventListener('DOMContentLoaded',renderArticle);}

// ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);
  }
}
function _applyArticleENMode(){
  var full=document.getElementById('article-full');
  var btn=document.getElementById('article-en-toggle');
  var hide=(sessionStorage.getItem('article_en_hide')||'')==='1';
  if(full) full.classList.toggle('en-hidden', hide);
  if(btn) btn.textContent=hide?'🌐 英文批注：展开':'🌐 英文批注：显示';
}
</script>
</body>
