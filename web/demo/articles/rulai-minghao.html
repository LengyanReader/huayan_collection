<script>
var ARTICLE = {"id": "rulai-minghao", "file": "articles/rulai-minghao.html", "title": "九九华严第七品 如来名号品之拼读", "title_sub": "华严经第七品·第二会首品·卷十二全篇·序请说三分·四十问·四天下十方名号（十方各十名）·娑婆百亿与娑婆十方名号·类通一切·名号二百一十一·八十与六十对读·藏译独有品〈如来华严品〉之辨·注疏诸家会读（澄观·法藏·李通玄·海云＋智俨·慧苑）·数据层·未完备已标明", "icon": "📖", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第二会_普光明殿_差别因果周/华严经细读_第七部_如来名号品.md", "doc_md": "# 华严经引读·第七部：如来名号品（卷十二·品七）\n\n> **EN · Close Reading of the Avataṃsaka Sūtra, Part Seven: The Chapter of the Tathāgata's Names**\n\n> **底本**：唐·实叉难陀译《大方广佛华严经》（八十华严）`T10n0279`。**范围：卷第十二（本品全文，品号第七）**。本品属**第二会「普光明殿会」·差别因果周（解）之始**。\n> **立稿**：2026-10-18。承第一会（品 1–6·卷 1–11）之体例与校勘纪律。\n> **本篇进度（覆盖率自陈）**：**全稿成篇**——§〇 凡例、§一 概述与品题解义、§二 全文逐段细读（序分／请分／说分三科·名号二十一品列表全出）、§三 旁参与前接、§四 义理要点与名相、§五 注疏选要·诸家会读（5.1 澄观／5.2 法藏／5.2′ 智俨／5.2″ 慧苑／5.3 李通玄／5.3′ 海云）、§六 文本对读与校勘（八十／六十／四十／藏译）、§七 结构分析·数据层、§八 附录十一类、§九 台账，**皆已成**。凡未能确证者标〔待核〕、属推断者标〔本文判断〕；**不以骨架冒充细读**。梵藏对勘、图像文物等未竟之点俱入 §八·附录四台账、§九台账。〔P7·L.191 充实批 2026-10-26〕①§2.5 十方云集逐方全文＋§2.13 名号二十一列全文逐列入文（23 单元程序化照录·0 手抄）②§5.1 疏科长文全摘甲–癸十段（raw 原字形）③§6.1′ 六十全本逐行照录（2,929 字）④§7.5 数据科学四视角＋图 7-1 名号矩阵 SVG⑤附录四′ 澄观疏本科段全文照录。〔P7·2026-10-24〕新增：兜沙经 `T10n0280` 本地入库直证（§6.3・含法藏「同名師利」之 T0 印证）；六十本娑婆十方列名逐名复验（§6.1）；英文品题与§1.4 要义四画龙睛 EN；数据层复算订两处小差异（含标点 4,198・「名號」13 见）。\n> **原则**：沿用既定校勘纪律、三层疏解（疏解／名相／会读）、存疑必标、推断必标「〔本文判断〕」、讲者之说疑误只标不改、三译主从分明、不擅改经文、可回源可复核。**引注疏原文一律繁体照底本、逐字回源并注经号与行号；会读按语用简体。**\n\n---\n\n## 〇、凡例（简要）\n\n一、**校勘底本**：以 `T10n0279` 为底本。六十华严（`T09n0278`）、四十华严（`T10n0293`）不作底本，但须品读并作对读；凡异译异说并列而不强断。\n二、**品读主从**：以八十华严为叙事主轴，六十为辅读与对读。主从仅指骨架取自何本，非谓其余可略。\n三、**疏解三层**：其下「疏解」为依经文直解；「名相」为训释与梵汉（凡无把握者标〔待核〕）；「会读」为注疏家与讲记等之判，非经证，凡引皆逐字回源。\n四、**引文可回源**：凡引经皆照 CBETA 底本原字形（繁体·异体），可回源可复核；凡引注疏皆注明经号与段落，无把握者标〔待核〕。**不擅改经文，亦不据听录回改底本。**\n五、**存疑必标**：凡未能确证者标〔待核〕；凡属本席推断者标「〔本文判断〕」；凡讲者之说疑误者只标不改。\n六、**文本现象与信度**：凡经文有缺文、增补、版本分合之别者，如实标识并系以文献/法义说明，给信度评级（见 §1.5）；**无从确证者只标〔疑阙〕／〔待核〕，不升级为断言**。\n七、**版本差异之惯例**：凡藏译、梵本、六十／四十华严与本品的分品、用字、文段有无、内容增减之别，**悉举而比之**，注版本与信度；**严禁以「藏译云」冒充未见之原文**。\n八、**计数口径**：字数以剥校勘之 CJK 口径计（含品题）；句数以句末标点（。！？）计；名号以「或名：」列举条目计。\n\n---\n\n<!-- ATLAS:BEGIN P7 -->\n### 〇之零、导读指南（阅读路径与方法）\n\n**定位：** 考证型细读（philological close reading），以「可复核性」为第一优先。本品为第二会之首，一味以「名号」为法，故读法以**数为纲、以名为纬**：二百一十一条名号，一条不可略，而一条亦不可执实。\n**本品一句：** **二百一十一条名号，只是一佛随物立称**——唱名而遍法界，即令信者信「自心是佛」。\n**路径：** 〇之二（二图四表）→ 一（品题与脉络）→ 二（全文逐段）→ 四（义理与名相）→ 五（诸家会读）→ 七（数据层）→ 附录按需查阅。\n**方法：** 先经文后诠释；〔实测〕／〔本文判断〕／〔存疑待核〕三分；负面证据同样入账；结构覆盖 100%，个体择要。\n**读前三问：** ① 211 条名号如何由 10 而 100 而 101 层层开出？② 何以名号品居第二会之首、次品却是四圣谛？③ 「或名」二字与「如來於彼」二十见，是何语法、是何法义？\n\n## 〇之二、本品内容地图（未入其门，先观其海）\n\n> **本节体例。** 图与表之数据，一律取自本文已回源核定之 §二逐段表与 §7.1／§7.5 实测数；**凡属推断者标〔本文判断〕，不入图**。图各看一事，勿求一图而尽本品。\n\n### 〇之二.0 提要\n\n本品占卷第十二全篇，**剥校勘 CJK 3,226 字**（含品题；正文净 3,219），而所举名号 **211 条**——字少而名多，是华严全经中「名相密度」最高之品。结构为三科：**序分**（标主时处·叹佛德十句·叹众德）→**请分**（念请·四十问）→**说分**（现通云集·文殊叹德·四天下中 10 名·四天下十方 100 名·娑婆百亿总标·娑婆十方 101 名·类通一切释差别所由）。若逐名读去，必困于名；先立二图，则见其「由一而多、多而不异」之骨。\n\n| 图 | 画什么 | 一句话 |\n|---|---|---|\n| **图 〇-1　名号四重遍周图** | 数从何来 | 10 → 100 → 101，两段相合为 211；条条皆「或名」 |\n| **图 〇-2　十一列名号矩阵（四天下段）** | 名从何方 | 中 1 列＋十方 10 列，每列十名；西北独十一 |\n\n**〔读法之序〕**　先观图 〇-1 以得其数（10→100→101→211），次观图 〇-2 以得其方（十一列各十名，而西北独十一），次读〇之二.3 之坐标、〇之二.6 之数等，然后入 §二逐段。**数既明，名始不滥。**\n\n> **EN corresponding · Map of the Chapter.** Book Twelve holds 3,226 CJK characters but 211 names — the densest name-cluster in the whole sūtra. The chapter opens with the assembly's forty questions and answers them not with doctrines but with names: ten in this four-continental world, a hundred across its ten directions, a bare total for the hundred billion four-continental worlds of Sahā, and a hundred and one across Sahā's neighbouring ten directions. Fig. 0-1 counts the cascade 10 → 100 → 101 = 211; Fig. 0-2 maps the eleven columns and marks the one textual anomaly (the north-west world yields eleven names, not ten).\n\n### 〇之二.1 图 〇-1　名号四重遍周图\n\n<figure>\n<svg viewBox=\"0 0 1000 540\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"26\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">名号四重：由一四天下而百亿四天下，由百亿而尽法界</text>\n<text x=\"500\" y=\"48\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a7a5e\">条长按名数比例（1 名＝4px）；右列为两段合计</text>\n\n<text x=\"30\" y=\"96\" font-size=\"13\" font-weight=\"bold\" fill=\"#7a5a28\">① 此四天下中</text>\n<text x=\"30\" y=\"114\" font-size=\"11\" fill=\"#8a7a5e\">一列 · 释迦名号</text>\n<rect x=\"250\" y=\"80\" width=\"40\" height=\"26\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/>\n<text x=\"304\" y=\"99\" font-size=\"12\" fill=\"#5a5147\">10 名（一切義成 · 圓滿月 · 師子吼 · 釋迦牟尼 · 第七仙 · 毘盧遮那 · 瞿曇氏 · 大沙門 · 最勝 · 導師）</text>\n\n<text x=\"30\" y=\"176\" font-size=\"13\" font-weight=\"bold\" fill=\"#7a5a28\">② 此四天下十方</text>\n<text x=\"30\" y=\"194\" font-size=\"11\" fill=\"#8a7a5e\">十列 · 各十名</text>\n<rect x=\"250\" y=\"160\" width=\"400\" height=\"26\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/>\n<text x=\"664\" y=\"179\" font-size=\"12\" fill=\"#5a5147\">10×10＝100 名</text>\n\n<line x1=\"250\" y1=\"204\" x2=\"650\" y2=\"204\" stroke=\"#c9b98f\"/>\n<text x=\"660\" y=\"224\" font-size=\"12\" font-weight=\"bold\" fill=\"#b8863c\">四天下段 110（11 列×10）</text>\n\n<text x=\"30\" y=\"286\" font-size=\"13\" font-weight=\"bold\" fill=\"#7a5a28\">③ 娑婆百亿四天下</text>\n<text x=\"30\" y=\"304\" font-size=\"11\" fill=\"#8a7a5e\">总标 · 不列名</text>\n<rect x=\"250\" y=\"270\" width=\"400\" height=\"26\" fill=\"none\" stroke=\"#c9b98f\" stroke-dasharray=\"5 4\"/>\n<text x=\"664\" y=\"289\" font-size=\"12\" fill=\"#5a5147\">「有百億萬種種名號」</text>\n\n<text x=\"30\" y=\"376\" font-size=\"13\" font-weight=\"bold\" fill=\"#7a5a28\">④ 娑婆邻近十方</text>\n<text x=\"30\" y=\"394\" font-size=\"11\" fill=\"#8a7a5e\">十列 · 西北独十一</text>\n<rect x=\"250\" y=\"360\" width=\"400\" height=\"26\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/>\n<rect x=\"650\" y=\"360\" width=\"4\" height=\"26\" fill=\"#b8863c\"/>\n<text x=\"664\" y=\"379\" font-size=\"12\" fill=\"#5a5147\">10×10＋1＝101 名</text>\n\n<line x1=\"250\" y1=\"404\" x2=\"650\" y2=\"404\" stroke=\"#c9b98f\"/>\n<text x=\"660\" y=\"424\" font-size=\"12\" font-weight=\"bold\" fill=\"#b8863c\">娑婆段 101（10 列·西北 11）</text>\n\n<rect x=\"250\" y=\"452\" width=\"700\" height=\"1\" fill=\"#d3c7ae\"/>\n<text x=\"30\" y=\"486\" font-size=\"14\" font-weight=\"bold\" fill=\"#b8863c\">合计 211 名</text>\n<text x=\"150\" y=\"486\" font-size=\"12\" fill=\"#5a5147\">「或名」211 见　·　「如來於彼」20 见　·　「如是等」21 见（§7.2 实测）</text>\n<text x=\"30\" y=\"512\" font-size=\"11.5\" fill=\"#8a7a5e\">※ ④段之「＋1」即西北方「歡喜」世界十一名的溢出；澄观已校「西北方名有十一者」，见 §6.1 校勘与图 〇-2。</text>\n</svg>\n<figcaption><b>图 〇-1　名号四重遍周图。</b>四层条长，各按名数比例。<b>前两层为「四天下段」（中一列＋十方十列，凡 110 名）；后两层为「娑婆段」（百亿总标＋邻近十方，凡 101 名）；两段相合 211。</b> 图中可见一事：经文明明说「有百億萬種種名號」，却只举 101 名——<b>举少以摄多，是本品之法，非经文之略</b>。〔本文判断〕<div class=\"en-line\">Fig. 0-1. Four bars, scaled to the number of names. The first two make the four-continental register (one central column plus ten directional columns, 110 names); the last two make the Sahā register (a bare total for the hundred billion worlds plus 101 names in the neighbouring ten directions). The text says there are hundreds of billions of names and then lists 101 — naming few in order to hold many.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. **两段各有其「总标」。** 四天下段以「其數十千」结，娑婆段以「百億萬種種名號」结；**所举之 211 是样本，不是全部**。凡读数目，先问「这是所举还是所有」。\n2. **101 之「1」不是笔误，是校勘事件。** 西北方「歡喜」世界列十一名，澄观已注「西北方名有十一者」，与密训「唯九」相对（§6.1）。**异文各照底本，不统一**，故图中留此一竖。\n3. **名数递增而句式不变。** 四层皆用「或名：X」同一句式，唯所被之境由一洲而十方、而百亿、而法界——**变者境，不变者名之语法**。此即下品「四圣谛」四十名之所本。\n\n### 〇之二.2 图 〇-2　十一列名号矩阵（四天下段）\n\n<figure>\n<svg viewBox=\"0 0 1000 520\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"24\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">「此四天下」之十一列：一洲居中，十界环列</text>\n<text x=\"500\" y=\"45\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a7a5e\">每格上一字为方，下二字为世界名，末注名数；悉依 T10n0279 卷十二逐字回源（§2.7–2.8）</text>\n\n<rect x=\"330\" y=\"70\" width=\"340\" height=\"54\" rx=\"4\" fill=\"#f3ecdf\" stroke=\"#c9b98f\"/>\n<text x=\"500\" y=\  y=\"188\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#5a5147\">妙觀察</text>\n<text x=\"877\" y=\"202\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8a7a5e\">10 名</text>\n\n<rect x=\"40\" y=\"228\" width=\"170\" height=\"52\" rx=\"4\" fill=\"#fff\" stroke=\"#c9b98f\"/>\n<text x=\"125\" y=\"248\" text-anchor=\"middle\" font-size=\"11\" fill=\"#8a7a5e\">東南</text>\n<text x=\"125\" y=\"266\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#5a5147\">喜樂</text>\n<text x=\"125\" y=\"280\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8a7a5e\">10 名</text>\n\n<rect x=\"228\" y=\"228\" width=\"170\" height=\"52\" rx=\"4\" fill=\"#fff\" stroke=\"#c9b98f\"/>\n<text x=\"313\" y=\"248\" text-anchor=\"middle\" font-size=\"11\" fill=\"#8a7a5e\">西南</text>\n<text x=\"313\" y=\"266\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#5a5147\">甚堅牢</text>\n<text x=\"313\" y=\"280\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8a7a5e\">10 名</text>\n\n<rect x=\"416\" y=\"228\" width=\"170\" height=\"52\" rx=\"4\" fill=\"#f7ecd2\" stroke=\"#b8863c\" stroke-width=\"1.6\"/>\n<text x=\"501\" y=\"248\" text-anchor=\"middle\" font-size=\"11\" fill=\"#b8863c\">西北</text>\n<text x=\"501\" y=\"266\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#7a5a28\">妙地</text>\n<text x=\"501\" y=\"280\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#b8863c\">10 名</text>\n\n<rect x=\"604\" y=\"228\" width=\"170\" height=\"52\" rx=\"4\" fill=\"#fff\" stroke=\"#c9b98f\"/>\n<text x=\"689\" y=\"248\" text-anchor=\"middle\" font-size=\"11\" fill=\"#8a7a5e\">下</text>\n<text x=\"689\" y=\"266\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#5a5147\">焰慧</text>\n<text x=\"689\" y=\"280\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8a7a5e\">10 名</text>\n\n<rect x=\"792\" y=\"228\" width=\"170\" height=\"52\" rx=\"4\" fill=\"#fff\" stroke=\"#c9b98f\"/>\n<text x=\"877\" y=\"248\" text-anchor=\"middle\" font-size=\"11\" fill=\"#8a7a5e\">上</text>\n<text x=\"877\" y=\"266\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#5a5147\">持地</text>\n<text x=\"877\" y=\"280\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8a7a5e\">10 名</text>\n</g>\n\n<rect x=\"330\" y=\"312\" width=\"340\" height=\"52\" rx=\"4\" fill=\"none\" stroke=\"#c9b98f\" stroke-dasharray=\"5 4\"/>\n<text x=\"500\" y=\"332\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#7a5a28\">此娑婆世界 · 百億四天下</text>\n<text x=\"500\" y=\"352\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5a5147\">「有百億萬種種名號」——总标，不列名</text>\n\n<line x1=\"40\" y1=\"392\" x2=\"960\" y2=\"392\" stroke=\"#e0d6c2\"/>\n<text x=\"40\" y=\"418\" font-size=\"12\" font-weight=\"bold\" fill=\"#7a5a28\">下段·娑婆邻近十方（另 10 列 101 名，见 §2.10）</text>\n<text x=\"40\" y=\"440\" font-size=\"11.5\" fill=\"#5a5147\">密訓 10 · 豐溢 10 · 離垢 10 · 豐樂 10 · 攝取 10 · 饒益 10 · 鮮少 10 · <tspan fill=\"#b8863c\" font-weight=\"bold\">歡喜 11</tspan> · 關𨷲 10 · 振音 10</text>\n<text x=\"40\" y=\"470\" font-size=\"11.5\" fill=\"#8a7a5e\">澄观：「密訓唯九者……乃是新本脫漏」「西北方名有十一者」——两处溢出，一缺一溢，各照底本（§6.1）。</text>\n<text x=\"40\" y=\"494\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 上段十一列之「中」列即释迦本名，故四天下段＝11 列×10＝110 名。</text>\n</svg>\n<figcaption><b>图 〇-2　十一列名号矩阵（四天下段）。</b>上段十界环一洲，凡十一列；下段为娑婆邻近十方，另十列。<b>二段合观，方见「名号遍周」不是一句空话，而是「一洲为心、十方为环、百亿为海」的三重扩张</b>。图中金色一格（西北妙地写「妙地」，下段西北为「歡喜」11 名）——<b>同为西北，上段十名、下段十一名，正是澄观校记所指</b>。<div class=\"en-line\">Fig. 0-2. Eleven columns around one continent: the centre plus the ten directions, ten names each. Below, Sahā's own ten neighbouring worlds, ten columns more. Two registers, one design — a continent at the centre, ten directions as a ring, a hundred billion worlds as the sea. The gold cell marks the one overflow: the north-west world yields eleven names.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. **「此四天下」不是「此世界」。** 上段之境是一洲（四天下），下段之境才是娑婆；**一洲已具十方十界，则一佛之名已遍十方**——此为本品由小入大之第一转。\n2. **名号之「或」字是用法，不是疑辞。** 「或名」者，随方随机而立此称，非谓佛有此名彼无名。**故读名号，当读其「随」，不当读其「异」。**\n3. **两处校勘，一缺一溢，皆不裁改。** 密训「唯九」、西北「十一」，澄观断为新本脱漏与溢出；本文照底本录，异文存于 §6.1，**不以己意补一名、删一名**。\n\n### 〇之二.3 本品在第二会（普光明殿·说十信）之坐标\n\n本品为第二会之首。第二会六品，依诸家共判，前三品明如来三业（所信之果），后三品明十信之解行德（能信之行）——**本品居其首，以「身业遍应」立信之体**。\n\n| 品 | 卷 | 位／科 | 一句提撕 | 与本品之关系 |\n|---|---|---|---|---|\n| **7 如来名号**（本品） | 卷12 | 十信·所信果·**身业** | 名号遍周，令信自心是佛 | —（本品） |\n| 8 四圣谛 | 卷12 | 十信·所信果·**口业** | 四谛四千名，随众生心悉令调伏 | 承本品之「名」，转而为「法」 |\n| 9 光明觉 | 卷13 | 十信·所信果·**意业** | 足轮放光，十段遍照 | 三业至此而毕 |\n| 10 菩萨问明 | 卷13 | 十信·**解** | 九首递问，文殊总酬 | 由果转因，解门开 |\n| 11 净行 | 卷14 | 十信·**行** | 一百四十一誓，遇事发愿 | 解而后行 |\n| 12 贤首 | 卷14–15 | 十信·**德** | 信为道元功德母 | 行而后德，十信满心 |\n\n### 〇之二.4 本品形式特征（与邻品对看）\n\n本品之「特色」不在义理之深，而在**形式之偏**：它以近三千三百字容纳二百一十一条名号，是全部三十九品中「名相密度」最高之品。读它若用读义理品之法，必失；须用读「陀罗尼品」之法——**以名摄义，以数见遍**。\n\n| 特征 | 本品表现〔实测〕 | 邻品之对照 | 读法上的后果 |\n|---|---|---|---|\n| 名相密度 | 3,226 字 / 211 名（约每 15 字一名） | 第八品 3,262 字 / 440 名，密度更高而篇幅相若 | 两品对读，可见第二会「以名说法」之极致 |\n| 句式重复 | 「或名」211 见、「如來於彼」20 见、「如是等」21 见 | 第八品作「或名」440 见 | 重复是结构，不是贫乏；句式为经之骨 |\n| 问而不答于文 | 四十问在前，说分不以义答，而以名答 | 第十品以偈酬问，逐问作答 | 本品之「答」是示现，非言说 |\n| 一多关系 | 一洲十名 → 十方百名 → 百亿总标 → 尽法界 | 第九品以光之远近表一多 | 名之遍与光之遍，同一法界 |\n| 校勘事件 | 密训唯九、西北十一（澄观已校） | 第八品十方世界名与旧图不符者已订正 | 凡异文，各照底本、不统一 |\n\n### 〇之二.5 五种读法（导览）\n\n| 读法 | 路径 | 适合谁 | 得什么 |\n|---|---|---|---|\n| **数读** | 〇之二 → §7.3 名号分布 → §2.7–2.10 各表 | 初读本篇者 | 先得 10／100／101／211 之骨 |\n| **方读** | 只读十方世界名与各方首名 | 欲见「随方立名」者 | 得十一列之矩阵（图 〇-2） |\n| **名读** | 取一洲十名，逐名核澄观释（§2.7） | 好名相训释者 | 见「一名一德」之训释法 |\n| **校读** | §6.1 六十对读＋§6.4 校勘记 | 欲核异文者 | 得密训九名、西北十一名之实 |\n| **承读** | 本品 §2.11 → 第八品 §2.2 | 欲见两会脉络者 | 见「名」如何转而为「谛」 |\n\n### 〇之二.6 数与位之谱：本品之数，四等分录\n\n华严之数非计数之数。本品所涉之数，来源不一，性质亦不一；**先分其等，后论其义**，则不为数目所惑。\n\n| 等第 | 数 | 出处 | 性质 |\n|---|---|---|---|\n| **T0 经文明文** | 「其數十千」（各列结句） | `T10n0279` 卷十二 | 喻限数，非计数 |\n| **T0 经文明文** | 「有百億萬種種名號」 | 同上 §2.9 | 总标，不列名 |\n| **T0 本文实测** | **211 名**（110＋101） | §7.3 逐名点数 | 计数（本文自测） |\n| **T0 本文实测** | 3,226 字（CJK 剥校勘） | §7.1 脚本 | 计数（本文自测） |\n| **T1 澄观《疏》** | 「密訓唯九」「西北方名有十一」 | `T1735` 卷十二末 | 注疏校记 |\n| **T1 澄观《疏》** | 「名號依身而立」 | `T1733`（法藏）·`T1735` 引 | 三业分判之据 |\n| **T2 转述** | 「名号品答四十问中之佛号问」 | 诸家科文，非经文明文 | 判摄语，须注家 |\n\n> **〔读法〕** 上表七行，惟「211」「3,226」二数为本文自测，其余皆出经文或注疏。**凡本文自测之数，皆附脚本于 §7.4，可覆算**；凡注疏之数，皆注经号卷次，可回源。二者不相混，是全篇「数」之纪律。\n\n<!-- ATLAS:END P7 -->\n\n## 一、概述与品题解义\n\n### 1.1 品题释义\n\n**品名**：**如来名号品**（八十华严**第七品**，唐·实叉难陀译）。全篇在《大方广佛华严经》**卷第十二**首篇。为**第二会「普光明殿会」差别因果周之始**。\n\n**「如來」**（*Tathāgata*）：佛十号之一。**「名號」**为二：**名**（*nāma*）为召体之号，「釋迦」等别称；**號**为标德之称，「如來」等十号通名。澄观「**召體曰名，表德為號。名別號通**」；李通玄「**有德即約德立名。其名可尊。稱之為號**」。\n\n**品题别释**——本品题紧接《如来现相品》已释之「如来」（参第二部 §1.1），本品所增在「名号」二字。澄观：「**如來即十之一。品中正說隨機就德以立別名。既表德之名。則亦名亦號。如來之名號依主釋也**」（`T1735`）。法藏：「**如來之名號依主釋。或如來則名號。以十號中如來為一故。於中名謂釋迦等別名。號謂十號諸佛通名**」（`T1733`）。智俨：「**名即通名。號者別號**」（`T1732`）。\n\n**李通玄之品名目**——约五缘以成佛号（`T1739`）：**一**以法界自体根本智缘（不動智佛等十智佛号）；**二**约如来示成正觉自德缘（十方诸佛共同十号，毘卢遮那为总名）；**三**明如来利生方便缘约位进修（信位不动智佛、住位月佛、行位眼佛、回向位妙佛、地位同妙）；**四**一切众生随根所乐缘（为佛、为天、为神、为主、为仁、为仙）；**五**法界体用平等缘——一切诸法总名佛号（「**一切法及名言皆是佛號故**」）。\n\n### 1.2 品位与脉络（承上启下）\n\n**在华严经三十九品中之位**：第二会（普光明殿）首品，八十华严**第七品**，占**卷第十二**。\n\n**判位**——**法藏五分**（`T1733`）：「初品是教起因緣分。二舍那品中一周問答名**舉果勸樂生信分**。三從第二會至第六會來一周問答名**修因契果生解分**。四第七會中一周問答名託法進修成行分。五第八會中一周問答名依人入證成德分。」——**本品为「修因契果生解分」之始**。\n**澄观**（`T1735`）：「**今明能生因果信解故。次來也**」；又「**前舉所信之境。今明能信之行**」。\n**李通玄**（`T1739`）：判第一会（品 1–6）为「**舉果勸修**」，第二会六品为「**以果成信**」——「信自心是佛與果佛不異故」。其长科：「從此品至賢首品，是第三長科文中。以果成信。信自己心之是佛分。」\n\n**承上启下**：\n- **承上**：第一会「所信因果周」（品1–6）明**所信之境**（举果劝修）。\n- **本品**：第二会首品，明**能信之行**——由如来名号遍周，令信者信「**自心是佛**」。\n- **启下**：次品《四圣谛品》第八明「口业说法遍周」（此品明「身业」遍应）。\n\n### 1.3 篇幅与结构预览（**本品＝卷第十二全篇**）\n\n- **本品范围**：卷第十二（`T10n0279`）。**实测 3,226 字**（CJK 剥校勘口径，含品题「如來名號品第七」7 字；**正文净 3,219 字**）；含标点 4,198 字；句末标点（。！？）121 处；独字 404〔详见 §7.1〕。\n- **结构骨架**（八十本三科）：\n  - **序分**：①世尊在摩竭提国阿兰若法菩提场·普光明殿坐（标主时处）→②妙悟皆满……普见三世（叹佛德）→③与十佛刹微尘数菩萨俱……过去现未来（叹众德）。\n  - **请分**：诸菩萨作是思惟……（念请·四十问）……愿佛世尊亦为我说。\n  - **说分**：①如来知念现神通·十方菩萨云集（文殊师利至贤首）；②文殊师利叹众希有·标不思议；③广显名号（此四天下中＋四天下十方＋娑婆百亿＋娑婆十方＋类通一切·释差别所由）。\n- **统计要点**：名号列举 **211 条**（四天下段 110 ＋ 娑婆段 101）；「或名」211 见；「如來於彼」20 见；「如是等」21 见；「名號」13 见〔详见 §7〕。\n\n### 1.4 核心要义\n\n本品要义四（详 §2、§4、§5）：\n\n1. **名号遍周·「名知名性離」**——如来以无量名号摄生，一切世间名皆佛名，「**十方世界無有一名非佛名者，名體性自解脫故**」（李通玄）。法门谓「**名即法界，法界即名**」之「一即一切」名号观〔按语〕。\n2. **信自心是佛**——第二会之旨「以果成信」：信「自己心之是佛」（李通玄）；信「我名如佛名」（澄观：「**信何法門信佛身名等於眾生。則知我名如佛名也**」）。\n3. **如来三业之身业**——正报中三业：此品**身业**遍应（名号依身而立）、四谛品**口业**普周、光明觉品**意业**遍觉（法藏、澄观、智俨三家判同）。\n4. **随名表法·不动智佛**——东方金色世界不動智佛为「**一切诸佛一切众生共有根本之智**」，「文殊师利」为「**自心妙择之慧**」；十方十世界·十智佛·十首菩萨，寄十信乃至五位进修（李通玄）。\n\n> **EN · the four key points (dragon-eye gloss)**\n> 1. **Names pervade everywhere** — the Tathāgata's names are innumerable, adapted to each world and each mind; \"a name and the name's own nature are apart\" (名知名性離), so every worldly name may be a Buddha-name.\n> 2. **Faith that one's own mind is Buddha** — the Second Assembly's aim: \"taking the fruit to seal faith\" (以果成信); to trust that one's own name is like the Buddha's name.\n> 3. **The bodily karma of the Tathāgata** — of the three karmas (body · speech · mind), this chapter manifests the all-pervading response of **body** (names established upon the body), the Four Noble Truths chapter that of **speech**, and the Light-Awakening chapter that of **mind**.\n> 4. **Names convey the doctrine** — the Immovable-Wisdom Tathāgata of the Golden World in the east stands for the root wisdom shared by all Buddhas and all sentient beings; Mañjuśrī stands for the mind's exquisite discerning wisdom (Li Tongxuan).\n\n### 1.5 经文文本现象与信度标识\n\n**标识符号集**：\n\n| 标识 | 含义 | 于本品之例 |\n|------|------|------|\n| 〔缺文〕 | 经文有脱文/阙漏（据校勘或版本比勘可证） | 详见 §6 校勘（八十北西「歡喜」11名、晋本对校） |\n| 〔疑阙〕 | 疑有阙文而未确 | 六十本「西北」11名等，存而不论 |\n| 〔等〕 | 经文固有之省略代表例（非残缺） | 各名号末「……」（「如是等」前之「或名……導師……。」） |\n\n**信度评级**（沿用本项目三级来源评级）：\n\n| 级 | 判据 | 例 |\n|----|------|----|\n| T0／一手 | 原典本身（CBETA 底本） | `T10n0279` 卷十二文字 |\n| T1／原典 | 同系统译本/注疏（异译、古注原本） | 六十华严、澄观疏、法藏探玄记、李通玄论、智俨搜玄记 |\n| T2／学术 | 同行评议论著、学术论文 | 藏译编目 |\n| T3／二手 | 百科、官网、口说转述 | 法师讲记听录 |\n\n**于本品之应用（据实）**：\n- 本品**非残缺品**，篇幅短（3,226 字）；名号各「或名……（如是等）」为**经文固有之〔等〕例**（省略代表），**非残缺**。\n- 本品**六十华严有对应品**（其第 3 品「普光堂如來名號品」）；**四十华严全无**（四十华严唯译本经〈入法界品〉）——属**版本分合与译本范围之差异**〔并存〕，非「缺」（§1.6）。\n\n### 1.6 版本差异之惯例与本品之版本情况\n\n> **惯例**：凡**藏译（Toh 44）、梵本残片、六十／四十华严**之对应段与本品有别者——不论**分品、用字、文段有无、内容增减**——**悉举而比对之**，并注版本与信度。**无别  此四天下东……南……西……北……四维……上下（十方各十名） | 10×10 名 |\n| 说五 | 娑婆百亿总标 | 此娑婆世界有百亿四天下……有百亿万种种名号 | 总标 |\n| 说六 | 娑婆十方名号 | 此娑婆世界东……南……西……北……四维……上下（十方各十名） | 10×10 名 |\n| 说七 | 类通一切·释由 | 如娑婆世界，如是东方百千亿……亦令众生如是知见而为说法 | 类通＋释由 |\n\n> **〔口径〕** 名号举列共 **211 条**（四天下段 11 列×10＝110；娑婆段 10 列，其中「西北」11 条，计 101）。「或名」211 见；「如來於彼」20 见；「如是等」21 见（§7.2）。\n\n### 2.1 序分一：标主时处\n\n**经文**：\n\n> 爾時，世尊在摩竭提國阿蘭若法菩提場中，始成正覺，於普光明殿坐蓮華藏師子之座，\n\n**疏解**：标「**主·时·处**」。八十本作「**摩竭提國阿蘭若法菩提場**」，而「**於普光明殿坐蓮華藏師子之座**」——**会处与场（菩提场）并举**。\n\n**名相**：\n- **摩竭提國**（*Magadha*）·**阿蘭若法**（*araṇya*「闲静处」）·**菩提場**（*bodhimaṇḍa*）——成道之处。\n- **普光明殿**（*Sarvajña-prabhā* 系语境）——**第二会说法处**。法藏释「普光法堂」有五义（约事·约法·约境·约智·约实，「無礙法界一塵一行皆遍因陀羅網重重顯現故稱為普」）；澄观有三释（殿是宝成光普照故／佛于中放普光故／佛于殿中说普法门慧光照世故）；智俨：「**普者德普。光者智光**」。\n- **蓮華藏師子之座**——法藏：「**蓮華藏者信行開敷離染攝德**」。\n\n**会读**：**「二处并举」之辨**——李通玄（`T1739`）：「**敘前初得菩提處并普光明殿。意明二處不異。為不移本處道場而身遍坐一切處故。為菩提場體是法界體故。為普光明殿是法界報居所都故**」；并斥旧解「由相近故須重敘」「見佛露居龍造普光明殿」「菩提場在熙連河邊相去三里」为「**三乘之說**」（李通玄之说，一家之判，非经证）。澄观（`T1735`）则谓「**處在菩提場東南可三里許熙連河曲。彼河之龍為佛造此**」（三家里谈并存，不强断）。\n\n### 2.2 序分二：叹佛德（十句）\n\n**经文**：\n\n> 妙悟皆滿，二行永絕；達無相法，住於佛住；得佛平等，到無障處；不可轉法，所行無礙；立不思議，普見三世。\n\n**疏解**：十句叹佛德，「**初總餘別**」。**总句**「妙悟皆滿」；别句九。\n\n**名相**（据澄观 `T1735`、法藏 `T1733` 引《摄论》《佛地论》）：\n| 句 | 释 |\n|---|---|\n| 妙悟皆滿 | 总。梵音「蘇含」妙善·正等，双照真俗故妙悟，备下诸句异于因故满。 |\n| 二行永絕 | 烦恼·所知；生死·涅槃，皆名二行，俱不现前为永绝。 |\n| 達無相法 | 清净真如名无相法，达者了也。 |\n| 住於佛住 | 如来常住大悲，任运利乐；常安止圣天梵住。 |\n| 得佛平等 | 所证·能证·化用皆等诸佛。 |\n| 到無障處 | 具能治道，解脱二障。 |\n| 不可轉法 | 所说教法，外道不能转。 |\n| 所行無礙 | 行诸世间，违顺魔怨不能碍。 |\n| 立不思議 | 安立教法，超言念故。 |\n| 普見三世 | 于三世境若事若理，了达记别无错谬。 |\n\n**会读**：此法藏判为「**文同攝論受用身二十一種殊勝功德中初十句**」；澄观「**準第八會初及深密經等，皆說佛有二十一種功德……今文有初十句，亦略釋耳**」。李通玄则以「五種遍周」贯之（示成正觉遍周·依正名号遍周·定体遍周·普贤行教遍周·法界圆满遍周）。\n\n### 2.3 序分三：叹众德\n\n**经文**：\n\n> 與十佛剎微塵數諸菩薩俱，莫不皆是一生補處，悉從他方而共來集，普善觀察諸眾生界、法界、世界、涅槃界、諸業果報、心行次第、一切文義，世、出世間，有為、無為，過、現、未來。\n\n**疏解**：**简定其人**（十佛刹尘数·大菩萨·一生补处·从他方来）＋**叹其实德**（普善观察十境）。\n\n**名相**：\n- **一生補處**——澄观：「**釋有二義。一約化相**（如弥勒，人中·天上·下降一生）**。二約實報一生**（四种变易生死中唯末后一种）。此文多约化相」；法藏：「一生有三义（约人中·天上·约下生之身）」；李通玄：「皆十地菩萨故……等觉位中普贤位熟道满功终方登佛果故名一生」。\n- **普善觀察十境**——众界·法界·世界·涅槃界·业果报·心行次第·文义·世间出世間·有为无为·过现未来（「普善观察」为能观智，「普」二义·「善」三义）。\n\n**会读**：李通玄「**悉從他方而共來集者。言他方共來集簡非舊眾。皆是不來而到。不去而遍**」；又释「迷名他方。悟名曰來」。\n\n### 2.4 请分：念请·四十问\n\n**经文**：\n\n> 時，諸菩薩作是思惟：「若世尊見愍我等，願隨所樂，開示佛剎、佛住、佛剎莊嚴、佛法性、佛剎清淨、佛所說法、佛剎體性、佛威德、佛剎成就、佛大菩提。如十方一切世界諸佛世尊，為成就一切菩薩故，令如來種性不斷故，救護一切眾生故，令諸眾生永離一切煩惱故，了知一切諸行故，演說一切諸法故，淨除一切雜染故，永斷一切疑網故，拔除一切希望故，滅壞一切愛著處故，說諸菩薩十住、十行、十迴向、十藏、十地、十願、十定、十通、十頂，及說如來地、如來境界、如來神力、如來所行、如來力、如來無畏、如來三昧、如來神通、如來自在、如來無礙、如來眼、如來耳、如來鼻、如來舌、如來身、如來意、如來辯才、如來智慧、如來最勝。願佛世尊，亦為我說！」\n\n**疏解**：**念请**。文分二：初十句直尔疑问（问十事），后三十八句引例请问（令佛种不断等十句＋说菩萨十位＋说如来十九事）。\n\n**名相·问数**：经文列举「佛剎……佛大菩提」十句＋菩萨九位（十住·十行·十回向·十藏·十地·十愿·十定·十通·十顶）＋如来十九事，共三十八句。诸家计数不一：\n- **澄观**「**句雖五十問但四十**。以第二十句是說意故」。\n- **法藏**引「裕梵等法師離為一百二十四問」「合中間九十問為九問。即總四十三問」「光統師合隨喜心等為一問。即為三十四問」，自判「**總分為三。初十問因所依果。次十問果所起因。後十四問因所得果**」。\n- **智俨**「**時眾請文有四十四句**」；「**大光師但作三十三問**」〔按：先際初五問名號品答·次二四諦答·次一光覺答〕。\n- **李通玄**「**於中有三十二問**」（一初四問·四種佛剎；二十八問菩薩住地佛眼耳等）；「**如是三十二問。直至如來出現品是答**」。\n\n〔**辨**〕**问数「四十／四十三／四十四／三十四／三十二」并存，各注所据**（各家计数与归并口径之别，与第二部四十问/三十七问之辨同例）。**不据一家回改他本，亦不掩诸说。**\n\n**会读**：李通玄「**前會（品1–6）是世主問舉佛果勸修信佛所得。此會是自信自身自心是佛。及入位修行故須再問**」（重问之由）。澄观「**前會果廣因略。此會因廣果略**」。\n\n### 2.5 说分一：如来现通·十方云集\n\n**经文**：\n\n> 爾時，世尊知諸菩薩心之所念，各隨其類，為現神通。現神通已，東方過十佛剎微塵數世界，有世界，名：金色，佛號：不動智。彼世界中，有菩薩，名：文殊師利，與十佛剎微塵數諸菩薩俱，來詣佛所，到已作禮，即於東方化作蓮華藏師子之座，結跏趺坐。南方過十佛剎微塵數世界，有世界，名：妙色，佛號：無礙智。彼有菩薩，名曰：覺首……（西方蓮華色·滅暗智·財首／北方薝蔔華色·威儀智·寶首／東北方優鉢羅華色·明相智·功德首／東南方金色·究竟智·目首／西南方寶色·最勝智·精進首／西北方金剛色·自在智·法首／下方玻瓈色·梵智·智首／上方平等色·觀察智·賢首）……結跏趺坐。\n\n**疏解**：**如来现通答（示相答）**＋**十方菩萨云集**。十方各具八义（远近·土名·佛号·上首·眷属·诣佛·致敬·化座安坐）。\n\n**十方世界·佛号·上首菩萨表**（据 `T10n0279` 卷十二）：\n\n| 方 | 世界名 | 佛号 | 上首菩萨 |\n|---|---|---|---|\n| 東 | 金色 | 不動智 | 文殊師利 |\n| 南 | 妙色 | 無礙智 | 覺首 |\n| 西 | 蓮華色 | 滅暗智 | 財首 |\n| 北 | 薝蔔華色 | 威儀智 | 寶首 |\n| 東北 | 優鉢羅華色 | 明相智 | 功德首 |\n| 東南 | 金色 | 究竟智 | 目首 |\n| 西南 | 寶色 | 最勝智 | 精進首 |\n| 西北 | 金剛色 | 自在智 | 法首 |\n| 下 | 玻瓈色 | 梵智 | 智首 |\n| 上 | 平等色 | 觀察智 | 賢首 |\n\n**十方云集·逐方全文入文〔L.191 本批〕**（`T10n0279` 卷十二·逐字（`_e7_full.py` 平文器·§7.4 锚口径）·`_e7_inject.py` 程序化十分切片·0 手抄）：\n\n> 爾時，世尊知諸菩薩心之所念，各隨其類，為現神通。現神通已，\n\n> 東方過十佛剎微塵數世界，有世界，名：金色，佛號：不動智。彼世界中，有菩薩，名：文殊師利，與十佛剎微塵數諸菩薩俱，來詣佛所，到已作禮，即於東方化作蓮華藏師子之座，結跏趺坐。\n\n> 南方過十佛剎微塵數世界，有世界，名：妙色，佛號：無礙智。彼有菩薩，名曰：覺首，與十佛剎微塵數諸菩薩俱，來詣佛所，到已作禮，即於南方化作蓮華藏師子之座，結跏趺坐。\n\n> 西方過十佛剎微塵數世界，有世界，名：蓮華色，佛號：滅暗智。彼有菩薩，名曰：財首，與十佛剎微塵數諸菩薩俱，來詣佛所，到已作禮，即於西方化作蓮華藏師子之座，結跏趺坐。\n\n> 北方過十佛剎微塵數世界，有世界，名：薝蔔華色，佛號：威儀智。彼有菩薩，名曰：寶首，與十佛剎微塵數諸菩薩俱，來詣佛所，到已作禮，即於北方化作蓮華藏師子之座，結跏趺坐。\n\n> 東北方過十佛剎微塵數世界，有世界，名：優鉢羅華色，佛號：明相智。彼有菩薩，名：功德首，與十佛剎微塵數諸菩薩俱，來詣佛所，到已作禮，即於東北方化作蓮華藏師子之座，結跏趺坐。\n\n> 東南方過十佛剎微塵數世界，有世界，名：金色，佛號：究竟智。彼有菩薩，名：目首，與十佛剎微塵數諸菩薩俱，來詣佛所，到已作禮，即於東南方化作蓮華藏師子之座，結跏趺坐。\n\n> 西南方過十佛剎微塵數世界，有世界，名：寶色，佛號：最勝智。彼有菩薩，名：精進首，與十佛剎微塵數諸菩薩俱，來詣佛所，到已作禮，即於西南方化作蓮華藏師子之座，結跏趺坐。\n\n> 西北方過十佛剎微塵數世界，有世界，名：金剛色，佛號：自在智。彼有菩薩，名：法首，與十佛剎微塵數諸菩薩俱，來詣佛所，到已作禮，即於西北方化作蓮華藏師子之座，結跏趺坐。\n\n> 下方過十佛剎微塵數世界，有世界，名：玻瓈色，佛號：梵智。彼有菩薩，名：智首，與十佛剎微塵數諸菩薩俱，來詣佛所，到已作禮，即於下方化作蓮華藏師子之座，結跏趺坐。\n\n> 上方過十佛剎微塵數世界，有世界，名：平等色，佛號：觀察智。彼有菩薩，名：賢首，與十佛剎微塵數諸菩薩俱，來詣佛所，到已作禮，即於上方化作蓮華藏師子之座，結跏趺坐。\n\n〔按〕十方依「遠近→土名→佛號→上首→眷屬→詣佛→致敬→化座」八句公式整复读（澄观科「一一方內文各有八」·§5.1 庚），十段 CJK 67·66·67·68·71·67·68·68·65·66（实测）——東北方一段最長（優鉢羅華色五字土名）。\n\n**名相·表法**：\n- **土皆名色**——澄观「**表信麁現故。亦表顯然可生信故**」；法藏「世界同名色者表信位法相麁顯著故」。\n- **佛号同智**——「**表信中最初始覺從本覺起故**」。\n- **菩萨同名首**——梵云「**室利**」（śrī）一名四实：一「首」·二「勝」·三「吉祥」·四「德」，故译者前后不同；「**以信為首。攝諸位故**」。\n- **文殊师利**——法藏略叙五义（名义·出处·师资·位次·德用）；澄观释「**菩薩妙德者。慧達佛境**」。\n\n**会读**：李通玄（`T1739`）分十门释十方来众（举佛刹方面·远近·世界名色·佛名号·上首菩萨名·大众之数·来已致敬·随方化座·座之名字·升座而坐）；且以**卦位表法**释「东方为震卦·为春生·为初·为长男·为首·为青龙」——**此李氏之「托事表法」，一家之判，非经证**。其要：「**金色世界是自心無染之理。文殊師利是自心善簡擇妙慧**」；又「**文殊師利。是自心妙擇之慧**」；言远近「**此云十佛剎微塵數世界之外來者。明隔十無明中**」。\n\n### 2.6 说分二：文殊叹德·标不思议\n\n**经文**：\n\n> 爾時，文殊師利菩薩摩訶薩，承佛威力，普觀一切菩薩眾會而作是言：「此諸菩薩甚為希有！諸佛子！佛國土不可思議，佛住、佛剎莊嚴、佛法性、佛剎清淨、佛說法、佛出現、佛剎成就、佛阿耨多羅三藐三菩提皆不可思議。何以故？諸佛子！十方世界一切諸佛，知諸眾生樂欲不同，隨其所應，說法調伏，如是乃至等法界、虛空界。」\n\n**疏解**：**叹众希有**＋**牒问总标**（牒前所问，作**九项**，标「不可思议」）＋**徵释**（「何以故」——以诸佛知众生乐欲不同，随机说）。\n\n**名相**：\n- **「何故問佛文殊答者」**——法藏「**以即同佛慧故。吉祥妙慧達土海故**」；澄观「**何不待請敬同佛故。何不待告承佛神力**」。\n- **「何不入定」**——法藏「**以信無位故**」；澄观「**以未入位性不定故**」，并列「说法之仪通有四句（定后说／说后定／定中说／不入说）」。\n- **牒问九项之辨**——前〈请分〉问**十事**（佛剎·佛住·佛剎莊嚴·佛法性·佛剎清淨·佛所說法·佛剎體性·佛威德·佛剎成就·佛大菩提）；此处文殊牒作**九项**（佛國土·佛住·佛剎莊嚴·佛法性·佛剎清淨·佛說法·佛出現·佛剎成就·佛阿耨多羅三藐三菩提）——**开合略异**（省「佛剎體性」「佛威德」二项，增「佛出現」一项），**照底本不擅改**〔本文判断〕。\n\n**会读**：澄观（`T1735`）「**以文殊示居此土生有十徵來自他方。體含萬德降魔制外通辨難思。化滿塵方用周三際……實為三世佛母**」；李通玄（`T1739`）「**為彰信心麁故不入定說**」（十信位不说入定，十住已去方入定说）。\n\n### 2.7 说分三：四天下中名号（10 名）\n\n**经文**：\n\n> 「諸佛子！如來於此娑婆世界諸四天下，種種身、種種名、種種色相、種種修短、種種壽量、種種處所、種種諸根、種種生處、種種語業、種種觀察，令諸眾生各別知見。」\n> 「諸佛子！如來於此四天下中，或名：一切義成，或名：圓滿月，或名：師子吼，或名：釋迦牟尼，或名：第七仙，或名：毘盧遮那，或名：瞿曇氏，或名：大沙門，或名：最勝，或名：導師……。如是等，其數十千，令諸眾生各別知見。」\n\n**疏解**：**别显「种种」十句**（身·名·色相·修短·寿量·处所·诸根·生处·语业·观察）→**于「此四天下中」举十名号**（此即娑婆四天下中）。\n\n**名号（10）**：一切義成（*Sarvārthasiddha*＝悉达）／圓滿月／師子吼／釋迦牟尼（*Śākyamuni*）／第七仙／毘盧遮那（*Vairocana*）／瞿曇氏（*Gautama*）／大沙門／最勝／導師。\n\n**名相**（澄观 `T1735`）：\n- **一切義成**即悉达多，「无事不成就故」。\n- **圓滿月**「惑断智圆，恩荫清凉故」。\n- **師子吼**「名决定说」。\n- **釋迦牟尼**「釋迦云能（能仁種）·牟尼云寂默（契寂理）」。\n- **第七仙**「七佛之末故」。\n- **毘盧遮那**「廣如前釋」（光明遍照）。\n- **瞿曇氏**「唯约姓也。此云地主」。\n- **大沙門**「此云息恶。无恶不息故」。\n- **最勝**「圣中极故」。**導師**「引导众生离险难故」。\n\n### 2.8 说分四：四天下十方名号（十方各十名）\n\n**经文**（节引）：\n\n> 「諸佛子！此四天下東，次有世界，名為：善護。如來於彼，或名：金剛，或名：自在……或名：斷言論……。如是等，其數十千，令諸眾生各別知見。」\n> 「諸佛子！此四天下南，次有世界，名為：難忍。……（帝釋……最勝……）」\n> 「諸佛子！此四天下西，次有世界，名為：親慧。……（水天……善住。）」\n> 「諸佛子！此四天下北，次有世界，名：有師子。……（大牟尼……苦行得……）」\n> 「諸佛子！此四天下東北方，次有世界，名：妙觀察。……（調伏魔……難出現……）」\n> 「諸佛子！此四天下東南方，次有世界，名為：喜樂。……（極威嚴……精進力……）」\n> 「諸佛子！此四天下西南方，次有世界，名：甚堅牢。……（安住……勝須彌……）」\n> 「諸佛子！此四天下西北方，次有世界，名為：妙地。……（普遍……住本……）」\n> 「諸佛子！此四天下次下方，有世界，名為：焰慧。……（集善根……普遍勝……）」\n> 「諸佛子！此四天下次上方，有世界，名曰：持地。……（有智慧……一道……）」\n\n**疏解**：「**此洲之鄰十界**」，十方各举十名号（共 **100 名**）。\n\n**名号表**（十方各十名，据 `T10n0279` 卷十二逐字回源）：\n\n| 方 | 世界 | 十名号 |\n|---|---|---|\n| 東 | 善護 | 金剛／自在／有智慧／難勝／雲王／無諍／能為主／心歡喜／無與等／斷言論 |\n| 南 | 難忍 | 帝釋／寶稱／離垢／實語／能調伏／具足喜／大名稱／能利益／無邊／最勝 |\n| 西 | 親慧 | 水天／喜見／最勝王／調伏天／真實慧／到究竟／歡喜／法慧／所作已辦／善住 |\n| 北 | 有師子 | 大牟尼／苦行／世所尊／最勝田／一切智／善意／清淨／瑿羅跋那／最上施／苦行得 |\n| 東北 | 妙觀察 | 調伏魔／成就／息滅／賢天／離貪／勝慧／心平等／無能勝／智慧音／難出現 |\n| 東南 | 喜樂 | 極威嚴／光焰聚／遍知／祕密／解脫／性安住／如法行／淨眼王／大勇健／精進力 |\n| 西南 | 甚堅牢 | 安住／智王／圓滿／不動／妙眼／頂王／自在音／一切施／持眾仙／勝須彌 |\n| 西北 | 妙地 | 普遍／光焰／摩尼髻／可憶念／無上義／常喜樂／性清淨／圓滿光／脩臂／住本 |\n| 下 | 焰慧 | 集善根／師子相／猛利慧／金色焰／一切知識／究竟音／作利益／到究竟／真實天／普遍勝 |\n| 上 | 持地 | 有智慧／清淨面／覺慧／上首／行莊嚴／發歡喜／意成滿／如盛火／持戒／一道 |\n\n**名相**：澄观随难略释（东方「斷言論」＝证离言故·诸能说过故；南方「帝釋」＝为天人主能称物心故；西方「水天」＝水善利万物天光净故；北方「瑿羅跋那」＝具云医湿弗罗跋那，医湿弗自在也、罗跋那声也，即圆音自在）。\n\n**会读**：李通玄以**卦位、五行、方位**释十方（东为震·春·青；南为离；西为兑·金；北为坎·君·师；东北为艮·小男·童蒙——「清凉山」表文殊发初信之童蒙），并谓「**在方无方。但举其法以况其理**」。此李氏**托事表法**之说，**一家之判，非经证**。\n\n### 2.9 说分五：娑婆百亿四天下（总标）\n\n**经文**：\n\n> 「諸佛子！此娑婆世界有百億四天下，如來於中，有百億萬種種名號，令諸眾生各別知見。」\n\n**疏解**：由「四天下」总括至「娑婆世界百亿四天下」，由「十千」升为「百亿万」。\n\n### 2.10 说分六：娑婆十方名号（十方各十名）\n\n**经文**（节引）：\n\n> 「諸佛子！此娑婆世界東，次有世界，名為：密訓。……（平等／殊勝／安慰／開曉意／聞慧／真實語／得自在／最勝身／大勇猛／無等智）」\n> 「諸佛子！此娑婆世界南，次有世界，名曰：豐溢。……（本性／勤意／無上尊／大智炬／無所依／光明藏／智慧藏／福德藏／天中天／大自在）」\n> 「諸佛子！此娑婆世界西，次有世界，名為：離垢。……（意成／知道／安住本／能解縛／通達義／樂分別／最勝見／調伏行／眾苦行／具足力）」\n> 「諸佛子！此娑婆世界北，次有世界，名曰：豐樂。……（薝蔔華色／日藏／善住／現神通／性超邁／慧日／無礙／如月現／迅疾風／清淨身）」\n> 「諸佛子！此娑婆世界東北方，次有世界，名為：攝取。……（永離苦／普解脫／大伏藏／解脫智／過去藏／寶光明／離世間／無礙地／淨信藏／心不動）」\n> 「諸佛子！此娑婆世界東南方，次有世界，名為：饒益。……（現光明／盡智／美音／勝根／莊嚴蓋／精進根／到分別彼岸／勝定／簡言辭／智慧海）」\n> 「諸佛子！此娑婆世界西南方，次有世界，名為：鮮少。……（牟尼主／具眾寶／世解脫／遍知根／勝言辭／明了見／根自在／大仙師／開導業／金剛師子）」\n> 「諸佛子！此娑婆世界西北方，次有世界，名為：歡喜。……（妙華聚／栴檀蓋／蓮華藏／超越諸法／法寶／復出生／淨妙蓋／廣大眼／有善法／專念法／網藏）〔**十一名，详 §6.1 校勘**〕」\n> 「諸佛子！此娑婆世界次下方，有世界，名為：關𨷲。……（發起焰／調伏毒／帝釋弓／無常所／覺悟本／斷增長／大速疾／常樂施／分別道／摧伏幢）」\n> 「諸佛子！此娑婆世界次上方，有世界，名曰：振音。……（勇猛幢／無量寶／樂大施／天光／吉興／超境界／一切主／不退輪／離眾惡／一切智）」\n\n**疏解**：「**彰娑婆邻近十方**」，十方各举十名号（共 **101 名**，其中西北 11 名）。以「百亿万种种名号」结。\n\n**名号表**：\n\n| 方 | 世界 | 十（十一）名号 |\n|---|---|---|\n| 東 | 密訓 | 平等／殊勝／安慰／開曉意／聞慧／真實語／得自在／最勝身／大勇猛／無等智 |\n| 南 | 豐溢 | 本性／勤意／無上尊／大智炬／無所依／光明藏／智慧藏／福德藏／天中天／大自在 |\n| 西 | 離垢 | 意成／知道／安住本／能解縛／通達義／樂分別／最勝見／調伏行／眾苦行／具足力 |\n| 北 | 豐樂 | 薝蔔華色／日藏／善住／現神通／性超邁／慧日／無礙／如月現／迅疾風／清淨身 |\n| 東北 | 攝取 | 永離苦／普解脫／大伏藏／解脫智／過去藏／寶光明／離世間／無礙地／淨信藏／心不動 |\n| 東南 | 饒益 | 現光明／盡智／美音／勝根／莊嚴蓋／精進根／到分別彼岸／勝定／簡言辭／智慧海 |\n| 西南 | 鮮少 | 牟尼主／具眾寶／世解脫／遍知根／勝言辭／明了見／根自在／大仙師／開導業／金剛師子 |\n| 西北 | 歡喜 | 妙華聚／栴檀蓋／蓮華藏／超越諸法／法寶／復出生／淨妙蓋／廣大眼／有善法／專念法／**網藏**（＝11） |\n| 下 | 關𨷲 | 發起焰／調伏毒／帝釋弓／無常所／覺悟本／斷增長／大速疾／常樂施／分別道／摧伏幢 |\n| 上 | 振音 | 勇猛幢／無量寶／樂大施／天光／吉興／超境界／一切主／不退輪／離眾惡／一切智 |\n\n**名相·校勘**（澄观 `T1735`）：澄观于「彰娑婆邻近十方」下注：「**密訓唯九者。勘晉經開曉意下闕一聞慧。南方唯二舊經。則具。乃是新本脫漏。準前後例不應獨此便略。西北方名有十一者。獨此有餘不成文體。此中專念法。應即是前所脫聞慧。亦是梵本之漏。注者誤安貝葉耳**。」——**澄观据此段（八十年本对照晋本）指「西北」多一名（11）、「密训」或阙一名之校勘**〔按：八十本今本密训实十名（含闻慧）、西北实十一名；澄观所据写本与今本或有出入，**并存待核**〕〔待核〕。\n\n### 2.11 说分七：类通一切·释差别所由\n\n**经文**：\n\n> 「諸佛子！如娑婆世界，如是東方百千億無數無量，無邊無等，不可數、不可稱、不可思、不可量、不可說，盡法界、虛空界、諸世界中，如來名號，種種不同；南、西、北方，四維、上、下，亦復如是。如世尊昔為菩薩時，以種種談論、種種語言、種種音聲，種種業，種種報，種種處，種種方便、種種根，種種信解、種種地位而得成熟，亦令眾生如是知見而為說法。」\n\n**疏解**：**类通一切**（如娑婆，如是十方尽法界虚空界，如来名号种种不同）＋**释差别所由**（如来昔为菩萨时，以种种方便成熟，亦令众生如是知见而为说法）。\n\n**名相**：澄观「**釋差別所由。此有二意。一自既由於差別名言等而得成就。今還倣古以差別熟他。二昔菩薩時隨機調物。今時出世稱本立名**」——一言「称本立名」，一言「倣古熟他」。\n\n**会读**：李通玄「**如世尊已下舉世尊往因所行。今為眾說**」；又总判本品「**非但論名號遍周。但是如來身口意業總皆遍周**」。此即全品之结归——一切名皆为度生而立，随物立称，令各别知见；六十本此句作「**是皆如來為菩薩時，有因緣者為度此故，種種方便……令諸眾生知如來法**」（异译对照，详 §6.1）。\n\n### 2.13 说分三–七·名号全文逐列入文〔L.191 本批·全量入文〕\n\n以下依 `_e7_full.py` 平文器单元序列（U07–U29·23 单元）**逐列照录全引**（`T10n0279` 卷十二·逐字（`_e7_full.py` 平文器·§7.4 锚口径）），段题依澄观四段科（§5.1 辛–癸）；§2.7–§2.11 之节引与名号表存旧不废，本节为**全文档**。\n\n**（子）此四天下中·十名〔U07〕**\n\n**经文（全引）**：\n\n> 「諸佛子！如來於此四天下中，或名：一切義成，或名：圓滿月，或名：師子吼，或名：釋迦牟尼，或名：第七仙，或名：毘盧遮那，或名：瞿曇氏，或名：大沙門，或名：最勝，或名：導師……。如是等，其數十千，令諸眾生各別知見。\n\n**（丑·1）此四天下東·世界名「善護」〔U08〕**\n\n**经文（全引）**：\n\n> 「諸佛子！此四天下東，次有世界，名為：善護。如來於彼，或名：金剛，或名：自在，或名：有智慧，或名：難勝，或名：雲王，或名：無諍，或名：能為主，或名：心歡喜，或名：無與等，或名：斷言論……。如是等，其數十千，令諸眾生各別知見。\n\n**（丑·2）此四天下南·世界名「難忍」〔U09〕**\n\n**经文（全引）**：\n\n> 「諸佛子！此四天下南，次有世界，名為：難忍。如來於彼，或名：帝釋，或名：寶稱，或名：離垢，或名：實語，或名：能調伏，或名：具足喜，或名：大名稱，或名：能利益，或名：無邊，或名：最勝……。如是等，其數十千，令諸眾生各別知見\n\n**（丑·3）此四天下西·世界名「親慧」〔U10〕**\n\n**经文（全引）**：\n\n> 「諸佛子！此四天下西，次有世界，名為：親慧。如來於彼，或名：水天，或名：喜見，或名：最勝王，或名：調伏天，或名：真實慧，或名：到究竟，或名：歡喜，或名：法慧，或名：所作已辦，或名：善住。……如是等，其數十千，令諸眾生各別知見。\n\n**（丑·4）此四天下北·世界名「有師子」〔U11〕**\n\n**经文（全引）**：\n\n> 「諸佛子！此四天下北，次有世界，名：有師子。如來於彼，或名：大牟尼，或名：苦行，或名：世所尊，或名：最勝田，或名：一切智，或名：善意，或名：清淨，或名：瑿羅跋那，或名：最上施，或名：苦行得……。如是等，其數十千，令諸眾生各別知見。\n\n**（丑·5）此四天下東北方·世界名「妙觀察」〔U12〕**\n\n**经文（全引）**：\n\n> 「諸佛子！此四天下東北方，次有世界，名：妙觀察。如來於彼，或名：調伏魔，或名：成就，或名：息滅，或名：賢天，或名：離貪，或名：勝慧，或名：心平等，或名：無能勝，或名：智慧音，或名：難出現……。如是等，其數十千，令諸眾生各別知見。\n\n**（丑·6）此四天下東南方·世界名「喜樂」〔U13〕**\n\n**经文（全引）**：\n\n> 「諸佛子！此四天下東南方，次有世界，名為：喜樂。如來於彼，或名：極威嚴，或名：光焰聚，或名：遍知，或名：祕密，或名：解脫，或名：性安住，或名：如法行，或名：淨眼王，或名：大勇健，或名：精進力……。如是等，其數十千，令諸眾生各別知見。\n\n**（丑·7）此四天下西南方·世界名「甚堅牢」〔U14〕**\n\n**经文（全引）**：\n\n> 「諸佛子！此四天下西南方，次有世界，名：甚堅牢。如來於彼，或名：安住，或名：智王，或名：圓滿，或名：不動，或名：妙眼，或名：頂王，或名：自在音，或名：一切施，或名：持眾仙，或名：勝須彌……。如是等，其數十千，令諸眾生各別知見。\n\n**（丑·8）此四天下西北方·世界名「妙地」〔U15〕**\n\n**经文（全引）**：\n\n> 「諸佛子！此四天下西北方，次有世界，名為：妙地。如來於彼，或名：普遍，或名：光焰，或名：摩尼髻，或名：可憶念，或名：無上義，或名：常喜樂，或名：性清淨，或名：圓滿光，或名：脩臂，或名：住本……。如是等，其數十千，令諸眾生各別知見。\n\n**（丑·9）此四天下次下方·世界名「焰慧」〔U16〕**\n\n**经文（全引）**：\n\n> 「諸佛子！此四天下次下方，有世界，名為：焰慧。如來於彼，或名：集善根，或名：師子相，或名：猛利慧，或名：金色焰，或名：一切知識，或名：究竟音，或名：作利益，或名：到究竟，或名：真實天，或名：普遍勝……。如是等，其數十千，令諸眾生各別知見。\n\n**（丑·10）此四天下次上方·世界名「持地」〔U17〕**\n\n**经文（全引）**：\n\n> 「諸佛子！此四天下次上方，有世界，名曰：持地。如來於彼，或名：有智慧，或名：清淨面，或名：覺慧，或名：上首，或名：行莊嚴，或名：發歡喜，或名：意成滿，或名：如盛火，或名：持戒，或名：一道……。如是等，其數十千，令諸眾生各別知見。\n\n**（寅）娑婆百亿·总标〔U18〕**\n\n**经文（全引）**：\n\n> 「諸佛子！此娑婆世界有百億四天下，如來於中，有百億萬種種名號，令諸眾生各別知見。\n\n**（卯·1）此娑婆世界東·世界名「密訓」〔U19〕**\n\n**经文（全引）**：\n\n> 「諸佛子！此娑婆世界東，次有世界，名為：密訓。如來於彼，或名：平等，或名：殊勝，或名：安慰，或名：開曉意，或名：聞慧，或名：真實語，或名：得自在，或名：最勝身，或名：大勇猛，或名：無等智……。如是等百億萬種種名號，令諸眾生各別知見。\n\n**（卯·2）此娑婆世界南·世界名「豐溢」〔U20〕**\n\n**经文（全引）**：\n\n> 「諸佛子！此娑婆世界南，次有世界，名曰：豐溢。如來於彼，或名：本性，或名：勤意，或名：無上尊，或名：大智炬，或名：無所依，或名：光明藏，或名：智慧藏，或名：福德藏，或名：天中天，或名：大自在……。如是等百億萬種種名號，令諸眾生各別知見。\n\n**（卯·3）此娑婆世界西·世界名「離垢」〔U21〕**\n\n**经文（全引）**：\n\n> 「諸佛子！此娑婆世界西，次有世界，名為：離垢。如來於彼，或名：意成，或名：知道，或名：安住本，或名：能解縛，或名：通達義，或名：樂分別，或名：最勝見，或名：調伏行，或名：眾苦行，或名：具足力……。如是等百億萬種種名號，令諸眾生各別知見。\n\n**（卯·4）此娑婆世界北·世界名「豐樂」〔U22〕**\n\n**经文（全引）**：\n\n> 「諸佛子！此娑婆世界北，次有世界，名曰：豐樂。如來於彼，或名：薝蔔華色，或名：日藏，或名：善住，或名：現神通，或名：性超邁，或名：慧日，或名：無礙，或名：如月現，或名：迅疾風，或名：清淨身……。如是等百億萬種種名號，令諸眾生各別知見。\n\n**（卯·5）此娑婆世界東北方·世界名「攝取」〔U23〕**\n\n**经文（全引）**：\n\n> 「諸佛子！此娑婆世界東北方，次有世界，名為：攝取。如來於彼，或名：永離苦，或名：普解脫，或名：大伏藏，或名：解脫智，或名：過去藏，或名：寶光明，或名：離世間，或名：無礙地，或名：淨信藏，或名：心不動……。如是等百億萬種種名號，令諸眾生各別知見。\n\n**（卯·6）此娑婆世界東南方·世界名「饒益」〔U24〕**\n\n**经文（全引）**：\n\n> 「諸佛子！此娑婆世界東南方，次有世界，名為：饒益。如來於彼，或名：現光明，或名：盡智，或名：美音，或名：勝根，或名：莊嚴蓋，或名：精進根，或名：到分別彼岸，或名：勝定，或名：簡言辭，或名：智慧海……。如是等百億萬種種名號，令諸眾生各別知見。\n\n**（卯·7）此娑婆世界西南方·世界名「鮮少」〔U25〕**\n\n**经文（全引）**：\n\n> 「諸佛子！此娑婆世界西南方，次有世界，名為：鮮少。如來於彼，或名：牟尼主，或名：具眾寶，或名：世解脫，或名：遍知根，或名：勝言辭，或名：明了見，或名：根自在，或名：大仙師，或名：開導業，或名：金剛師子……。如是等百億萬種種名號，令諸眾生各別知見。\n\n**（卯·8）此娑婆世界西北方·世界名「歡喜」〔U26〕**\n\n**经文（全引）**：\n\n> 「諸佛子！此娑婆世界西北方，次有世界，名為：歡喜。如來於彼，或名：妙華聚，或名：栴檀蓋，或名：蓮華藏，或名：超越諸法，或名：法寶，或名：復出生，或名：淨妙蓋，或名：廣大眼，或名：有善法，或名：專念法，或名：網藏……。如是等百億萬種種名號，令諸眾生各別知見。\n\n**（卯·9）此娑婆世界次下方·世界名「關𨷲」〔U27〕**\n\n**经文（全引）**：\n\n> 「諸佛子！此娑婆世界次下方，有世界，名為：關𨷲。如來於彼，或名：發起焰，或名：調伏毒，或名：帝釋弓，或名：無常所，或名：覺悟本，或名：斷增長，或名：大速疾，或名：常樂施，或名：分別道，或名：摧伏幢……。如是等百億萬種種名號，令諸眾生各別知見。\n\n**（卯·10）此娑婆世界次上方·世界名「振音」〔U28〕**\n\n**经文（全引）**：\n\n> 「諸佛子！此娑婆世界次上方，有世界，名曰：振音。如來於彼，或名：勇猛幢，或名：無量寶，或名：樂大施，或名：天光，或名：吉興，或名：超境界，或名：一切主，或名：不退輪，或名：離眾惡，或名：一切智……。如是等百億萬種種名號，令諸眾生各別知見。\n\n**（辰）类通一切·释差别所由〔U29〕**\n\n**经文（全引）**：\n\n> 「諸佛子！如娑婆世界，如是東方百千億無數無量，無邊無等，不可數、不可稱、不可思、不可量、不可說，盡法界、虛空界、諸世界中，如來名號，種種不同；南、西、北方，四維、上、下，亦復如是。如世尊昔為菩薩時，以種種談論、種種語言、種種音聲，種種業，種種報，種種處，種種方便、種種根，種種信解、種種地位而得成熟，亦令眾生如是知見而為說法。」\n\n〔列计实测〕此四天下中 10 名＋四天下十方 10 列各 10 名＝100＋娑婆十方 10 列（西北歡喜 11 名）＝101，总 **211 条**（与 §1.3／§2.0〔口径〕／§7.3 三处一致·`_e7_stats.py` 程序切分复核全中）。\n\n〔体式观察〕四天下系 11 列结「如是等，其數十千」，娑婆系 10 列结「如是等百億萬種種名號」（含 U18 总标，实测各×11），全 21 列皆终「令諸眾生各別知見」（含标段 U06·总标 U18 实测×23）——**结语三级：舉名十→数十千→百億萬**，正見澄观「名別號通」「隨機立稱」之科（§5.1 乙·癸）。\n\n---\n\n### 2.12 小结\n\n本品结构：**序（主时处·叹佛德·叹众德）→请（四十问）→说（现通集众·文殊叹不思议·广显名号·类通释由）**。其骨在「**名**」——由「此四天下中」（10 名）扩至「四天下十方」（100 名），由「娑婆百亿」（总标）扩至「娑婆十方」（101 名），再「类通」尽法界虚空界，末「释由」归于随物立名。正合李通玄「**一切處普賢菩薩。一切處金色世界。一切處文殊師利。一切處不動智佛**」之「遍周」义。\n\n---\n\n## 三、旁参与前接\n\n### 3.1 前接（第一会末·含藏译独有品）\n\n**前接（第一会末）**：《毗卢遮那品》第六（卷十一）——显毗卢遮那佛果德、刹海重重无尽之相。\n**前接（藏译独有品）**：**藏译**于〈毘盧遮那品〉（藏 10）之后、本品（藏 12）之前，**别有一汉译所无之品**——〈**如来华严品**〉（藏 11；梵 *Tathāgatāvataṃsaka*），位当第一会末。故藏译由初会入二会之间，多此一品为过渡（辨见 §6.4）。\n**承接关系**：第一会（品1–6）「所信之境」→ 第二会首品（本品）「能信之行」。李通玄「**前举所信之境。今明能信之行**」。\n### 3.2 后接与同会续品\n\n**后接（第二会次品）**：《四圣谛品》第八（卷十二末–十三）——明如来「口业说法遍周」，答前「佛所说」问。\n**同会续品**：《光明觉品》第九（意业）、《菩萨问明品》第十、《净行品》第十一、《贤首品》第十二。\n\n### 3.3 旁参\n\n- **单品别译**：《佛说兜沙经》（`T10n0280`，后汉·支娄迦谶译，约 167 年）——为《华严》最早汉译之单品，本机已入库直证（题记・译者・十方菩萨「同名師利」得 T0 印证；与本品结构平行而非逐字对应，详 §6.3）。〔本文判断〕此可佐证本品「名号召请十方」之型为《华严》最古老流传料之一。\n- **六十本对应**：《如来名号品第三》（`T09n0278` 卷四），详 §6.1。\n\n---\n\n## 四、义理要点与名相\n\n### 4.1 「名知名性离」——名号即法界\n李通玄五缘成佛号，其第五「法界体用平等缘」：「**一切諸法及以名言自體性離故。一切法自體性離即法界性。法界性即佛號故。一切法及名言皆是佛號故**」。即名与法界不二，故名遍法界。\n\n### 4.2 「信自心是佛」——第二会之旨\n李通玄判：「**以果成信。信自己心之是佛分**」；「**直信自心分別之性。是法界性中根本不動智佛**」。澄观：「**信何法門信佛身名等於眾生。則知我名如佛名也**」。\n\n### 4.3 三业分判——身·口·意\n法藏／澄观／智俨三家同判第二会初三品为如来三业：**名号品＝身业**（法藏「**名號依身而立**」）、**四谛品＝口业**、**光明觉品＝意业**。澄观《演義鈔》（`T1736` **卷十五**）亦云：「**故先明如來三業正報。謂身語意。身是其總故先明之。應物成身隨宜立號。故受之以如來名號品。……九身語既彰。意業將顯。**」\n\n### 4.4 十世界·十智佛·十首菩萨——表十信\n李通玄：「**直信自心分別之性。是法界性中根本不動智佛。金色世界是自心無染之理。文殊師利是自心善簡擇妙慧。覺首目首等菩薩是隨信心中理智現前**」；又「**指此金色世界不動智佛。令使直認是自心能分別智本無所動**」。十方十表十信进修之胜。\n\n### 4.5 「一即一切」之名号观\n〔本文判断〕本品以「**一名 ↔ 一切名**」「**一世界 ↔ 尽法界虚空界**」之对列，成立华严「**一即一切**」于「名言」层面之展现：于四天下中十名，四天下十方各十名，娑婆十方各十名，终「类通」尽法界。**然此为义理归纳，非经中明言**；经中明言者为「随其类现」「随其所应说法调伏」「种种名号令诸众生各别知见」。\n\n### 4.6 名相表\n\n| 名相 | 训释 | 出处 |\n|---|---|---|\n| 阿蘭若法 | 闲静处法 | 八十本经 |\n| 普光明殿 | 普者德普·光者智光（智俨）；宝成光普照／放普光／说普法门（澄观） | `T1732`／`T1735` |\n| 一生補處 | 化相（人中·天上·下降）+ 实报（末后变易） | `T1735` |\n| 名／號 | 召体曰名（別·释迦等）／表德为号（通·十号） | `T1735`／`T1733`／`T1739` |\n| 室利（śrī） | 首·胜·吉祥·德 一名四实 | `T1735`／`T1733` |\n| 毘盧遮那 | 光明遍照；毘云种种·卢遮那云遍照 | `T1739` |\n| 不動智佛 | 一切诸佛一切众生共有根本之智 | `T1739` |\n\n---\n\n## 五、注疏选要（诸家会读）\n\n> **〔体例〕** 引注疏原文一律繁体照底本、逐字回源并注经号与行号；会读按语用简体。凡转述者标〔转述〕，存疑标〔待核〕、推断标〔本文判断〕。**〔四家补位〕** 本品补列法藏·澄观·李通玄·海云四家，并补智俨（`T1732`，见 §5.2′）；慧苑（`X0221`）**本品之记不传**（见 §5.2″）——故智俨·慧苑之位如实标注。\n\n### 5.1 澄观《大方广佛华严经疏》（`T1735`）——「如来名号品第七」段\n\n**来源**：唐·清凉山大华严寺沙门澄观撰《大方广佛华严经疏》**卷第十二末–卷第十三**（经首署「如來名號品第七（此下第二修因契果生解分第二會初從此第十二經盡第十三經菩薩問明品）」）。本机 `data/references/cbeta_txt/T1735_澄观_华严经疏.txt`。\n\n**判品·「将释此品，五门分别」**（*five-gate analysis*: 來意 *purpose/occasion*、釋名 *explanation of title*、宗趣 *main tenet/aim*、問答 *questions & answers*、釋文 *exposition of the text*）：\n\n**（一）来意**（三重）：\n- **分来**：「**前既舉果令生信樂。今明能生因果信解故。次來也。**」\n- **会来**：「**生解之中信為其首故。又前舉所信之境。今明能信之行。故次來也。**」\n- **品来**：「**前品舉因顯果。成所信之境。今舉果辨因。彰能信之行。果中三業身為其總。故先來也。又遠答前名號海問故。**」\n\n**（二）释名**（三节）：\n- **分名**：「修因契果生解分。謂修五位之圓因。成十身之滿果。令諸菩薩解此相故。」\n- **会名**：「約處名**普光明殿會**。然有三釋。一以殿是寶成光普照故。二佛於其中放普光故。三佛於殿中。說普法門慧光照世。故立其名……約法則名**信行之會**。」\n- **品名**：「**如來現相品已釋。召體曰名表德為號。名別號通。一切諸佛通具十號。名釋迦等則不同故。如來即十之一。品中正說隨機就德以立別名。既表德之名。則亦名亦號。如來之名號依主釋也。**」\n\n**（三）宗趣**（三节）：\n- **分宗**：「**以修生修顯因果為宗。令諸菩薩修行契入為趣。**」\n- **会宗**：「若就總望，信解行德攝位為宗，通成佛果為趣。」「近望唯信為宗成位為趣。」\n- **品宗**：「**顯佛名號周遍為宗。隨機調化利益為趣。**」——又：「**此亦名正報因果。亦是所信。信何法門信佛身名等於眾生。則知我名如佛名也。**」\n\n**（四）问答**（五周因果·重举名号之由）：「前會約初義（标举境法明有所在），此會約後義（摄以就心令成信行）；前會果廣因略故名舉果，此會因廣果略故總攝為因。」「何不入定？以未入位性不定故。……說法之儀通有四句：一定後說（如諸會）·二說後定（如無量壽經等）·三定中說（如第九會）·四不入說（如此信中及第七會）。」\n\n**（五）释文**（三科：序分·请分·说分）：\n- **序分**：「初標主時處。二始成下別顯三事。三與十佛下輔翼圓滿。」「處在菩提場東南可三里許熙連河曲。彼河之龍為佛造此」。「妙悟皆滿者……梵音云蘇含於妙善及正等故……雙照真俗故稱妙悟。」（十句逐释，参 §2.2）\n- **请分**：「**然句雖五十問但四十。以第二十句是說意故。此四十問。望第一會有同有異。後二十句全同。前二十句大同小異。**」\n- **说分**：「**先如來現相答（由其念請故）。後文殊言說答（伴助主故。假言顯故）。**」十方众集「去此遠近皆十剎塵數者……今為說於生解因果漸漸增修。故但集娑婆隣次之剎。信行最劣故」。\n- **广显名号**：「**文分為四。一娑婆之內自有百億。二娑婆隣近即百億之外。三類通一切謂盡十方。四釋差別所由由隨物故。**」名号逐释（参 §2.7–2.8）；末「**釋差別所由。此有二意。一自既由於差別名言等而得成就。今還倣古以差別熟他。二昔菩薩時隨機調物。今時出世稱本立名。**」\n\n**〔L.191 本批·疏科长文全摘〕**（`T1735` 卷十二末–卷十三「如來名號品第七」本科段·NFKD 1:1 重锚·引文照 raw 原字形·跨行连读剥空白·分页符剔除）\n\n*甲·五门分别·来意三重*：\n\n> 「將釋此品。五門分別。初來意者先明分來。前既舉果令生信樂。今明能生因果信解故。次來也。二會來者。生解之中信為其首故。又前舉所信之境。今明能信之行。故次來也。三品來者。前品舉因顯果。成所信之境。今舉果辨因。彰能信之行。果中三業身為其總。故先來也。又遠答前名號海問故」\n\n*乙·释名（分名·会名·品名）*：\n\n> 「二釋名亦三。初分名修因契果生解分。謂修五位之圓因。成十身之滿果。令諸菩薩解此相故。即生修因契果之解。依主釋也。二會名。約處名普光明殿會。然有三釋。一以殿是寶成光普照故。二佛於其中放普光故。三佛於殿中。說普法門慧光照世。故立其名。依前一義即依主釋。後二有財。約法則名信行之會。三品名。如來現相品已釋。召體曰名表德為號。名別號通。一切諸佛通具十號。名釋迦等則不同故。如來即十之一。品中正說隨機就德以立別名。既表德之名。則亦名亦號。如來之名號依主釋也」\n\n*丙·宗趣（分·会·品）*：\n\n> 「三宗趣亦三。初分宗。謂以修生修顯因果為宗。令諸菩薩修行契入為趣。二會宗者。若就總望。信解行德攝位為宗。通成佛果為趣。信能必到如來地故。近望唯信為宗成位為趣。若依長科十分之宗。此下三品以為一分。即果用應機周遍法界。以為其宗。依此起信為趣故。此亦名正報因果。亦是所信。信何法門信佛身名等於眾生。則知我名如佛名也。信佛法門隨宜而立。知我妄念苦集亦全法門信佛意業光明遍照。則知自心無不知覺故。先古諸德。亦將上三品舉果分收。三品宗者。顯佛名號周遍為宗。隨機調化利益為趣。或上二皆宗生信為趣」\n\n*丁·问答（五周因果·重举名号·不入定·说法四句）*：\n\n> 「第四問答。問五周因果差別平等不同。何以分名合之為一。答通生差別平等解故。離於修生說何修顯故。問前會舉果本為生信。今何重舉名號等三。答凡約境生信有其二義。一標舉境法明有所在。二攝以就心令成信行。前會約初義。此會約後義。又前會果廣因略。故名舉果。此會因廣果略故總攝為因。先依後正文影略耳。若約鉤鎖者。自屬正報果故不同第七會說所成果。此中自辯信所依故。問何不入定。以未入位性不定故。若爾十定豈散善耶。然說法之儀通有四句。一定後說如諸會。二說後定如無量義經等。三定中說如第九會。無出言故。四不入說如此信中及第七會。諸文非一。第九表證唯證能說。一得永常不礙起用故。第七為表常在定故。又入為受加。彼不須加故不須入說。後入者說在行故。將起後故。是知動寂唯物聖無常規。故下文中辯十信之用。一方入正定餘方起出說。自在無礙也。餘會摩頂後說。此會說後摩頂。是知此經體勢縱橫不可定準」\n\n*戊·释文·三番问答总科＋序分（标主时处·主德十句·辅翼圆满）*：\n\n> 「第五釋文。若隨義約品科十分之中。此下三品。當果用應機普周分。若約隨法就會科十分之中。此一會當第二能信成德會。今就四番問答科。從此終第七會。即當第二修因契果生解分。若順諸會應直分問答。今為順文一會分三。第一序分。第二請分。第三說分。今先序分具如經初。但加普光以為小異。略分為三。初標主時處。二始成下別顯三事。三與十佛下。輔翼圓滿。二中分三。初別顯說時。二於普光下別顯說處。處在菩提場東南可三里許熙連河曲。彼河之龍為佛造此今舉總攝別。前標國名以本收末。上舉場稱故。下不動覺樹而遍十方。三妙悟下別顯主德。亦即示成正覺之相也。準第八會初及深密經等。皆說佛有二十一種功德。升兜率品當廣明之。今文有初十句。亦略釋耳。十句之中初總餘別。總中妙悟皆滿者。妙悟晉經名善覺。論經名正覺。良以。梵音云蘇含於妙善及正等故。譯者隨取悟即覺也。雙照真俗故稱妙悟。備下諸句異於因人。故復稱滿。別中一二行永絕者。煩惱所知生死涅槃。皆名二行。俱不現前名為永絕。二達無相法者。清淨真如名無相法。達者了也。三如來常住大悲。任運利樂。又常安止聖天梵住。故云住於佛住。四所證。能證。及以化用皆等諸佛。五具能治道解脫障故。六所說教法外道不能轉故。七行諸世間違順魔怨不能礙故。八安立教法超言念故。九於三世境若事若理。了達記別無錯謬故。具此九別成初總句。同異成壞準思可知。第三輔翼圓滿。文分二別。一標數揀定。二歎其勝德前中菩薩揀非凡小。補處明非下位。他方而來非舊眾也。言一生者。釋有二義。一約化相。謂如彌勒。此復有三。一人中一生。二天上一生。三下降一生。正取天中二。約實報一生。謂於四種變易生死中。唯有末後一種。名無有生死一位所繫。此文多約化相耳。二普善下歎德。德雖無量略歎一。普善觀察者能觀智也。普有二義。一普眾同有此德。二普觀十境善有三義。一善知相。二善知無相。三善知此二無礙。眾生界下。明其所觀。皆具上三義。十中初是總句所化眾生。次此生何來。由迷法界起於世界。我當令彼住涅槃界淨諸業果故。須識心行之病文義之藥。令厭世間欣出世間。不盡有為不住無為。上辨橫觀十法。今竪達三世觀涅槃。知已現當證觀諸業已現當造果報。已現當受心行已現當發餘可類知。亦以六相融之」\n\n*己·请分（四十问·依正间问·引例请问·住等行位答处）*：\n\n> 「第二時諸菩薩下。請分中二。先舉人標念。後若世尊下。正顯問端。然句雖五十問但四十。以第二十句是說意故。此四十問。望第一會有同有異。後二十句全同。前二十句大同小異。又復前後不同。初十句即前第三十海。前會即總說所觀深廣。此則別說如來依正。以前會中為總故。此會別顯信所依故。故前會皆致海言。此中但云剎等。第二十句前名菩薩十海。此列住等行位。前通諸會總顯圓融行布因故。此約當分。欲顯差別因之相故。後二十句雖則全同前總此別。又前即所信。今辨所成。欲顯所信所成體無異故。文句全同。若唯約義亦可分三。謂初十句。問佛德應機無方大用。辨因所依果。次十句。問菩薩行位即果所成因。後二十句。佛果勝德。顯因所成果。是則以佛為緣而起於因。還以此因而成於果。是此分之大意也。故論云。多聞熏習。無不從此法身流。無不還證此法身。即其義也。今取文義俱便。大分為二。初十句直爾疑問。後三十句引例請問。義不異前然。所依所成文應互有。但是影略不欲繁辭故。初會直爾興問。即此中引例。此中引例即彼直問又前但明一重所信故。合三十句果。今為分二段。故間之以因。今初十句先總顯請意。後開示下別列所疑。十句依正間問者。正報應機必依剎故。亦表依正無障礙故。五句依者。一剎類。二莊嚴。三清淨。四體性。五成就。上五即前二海。廣如四五二品。其佛住等五句即正報大用。一佛身遍住諸剎。佛心常住大悲。二所具功德。及所證法性。三隨機說法。四作用威光。五修行得證現成菩提。然此五即前會七海。一即佛海。二即解脫海。三即演說海。四即變化海。五即名號。及壽量海。波羅蜜海。其眾生海但是所化故略不舉。含諸海中。此之十句下。有言說及現相答。至下當知。第二如十方下。引例請問。文分為三。初十句標彼說意。明其有悲。後三十句。舉彼所說顯其有智。末後一句結以正請。彼佛既爾。此亦宜然。初中初句總。謂令諸菩薩行願成就故。餘九為別。一上繼佛種。二云何繼。以救眾生故。三云何救。令離惑故。四如何救。知彼根行故。五以何救說法藥故。六成何益。一除集諦染。二決道諦疑。三拔苦希望。四證滅愛處故。又成菩薩行具悲智也。具此悲智何所為耶。令佛種不斷。佛種不斷有何相耶。謂成三德。救護眾生成就恩德。永斷煩惱成於斷德。了知諸行成於智德。諸行有三。一者心行。二所行行。三所了行。謂一切行無常無相。即所了也。云何救護演說諸法。云何永斷淨諸雜染。永斷煩惱種現雙亡。除諸雜染謂唯現惑。云何成智。謂永斷疑網。智成何益斷諸希望。惑除何益滅諸愛著。一切著者。著有著空著行著果。不著諸法正智現前悲救眾生佛種不斷。是菩薩之要也。諸佛之本意也。所陳諸問。一一皆有斯益。又釋。一切菩薩是所成就。云何成就。不斷佛種即自成就。救護眾生成就於他。云何救護。謂離二障永斷煩惱。無煩惱障。了知一切無所知障。以何方便能斷二障。謂說諸法此煩惱障。其相云何。謂愛與見。除諸雜染絕愛煩惱。永斷疑網絕見煩惱。此所知障。其相云何。謂於境不了有所希望。法執未忘一切生著。今相無不了何所希望。達法性空當何所著。二障既寂二智現前。成菩提涅槃。謂不斷佛種則菩薩成就矣。第二說諸菩薩下。舉彼所說。文分為二。初十句問因。後二十句問果。今初文有九句。昔云。欠第九十忍一句。又以十信自不成位是住方便攝在住中。故不別問。故仁王經教化品云伏忍聖胎三十人。十信十止十堅心故。信住不分也。有義云。有四義故信不入位。一進退不定故。二雜修十心。無定階降故。三未隨法界修廣大行故。四未得法身。顯佛種性故。由斯不開十信。則成此會及第三會俱答十住問也。十行第四會答。十迴向第五會答。十藏第四會中答。以藏有二義。一收攝義。謂收攝諸行以用迴向。故答在迴向之前二出生義。以出生地上證智故。問居迴向之後。十地第六會答。十願初地中答。十定十通第七會答。各有自品。十頂一種答文不顯。古有多釋。一云。準梵網經。說十忍後有心地法門。即此十頂。理亦可通。但彼經說處乃有十一。初無菩提場會。但云方坐千光王座及妙光堂說十世界海。其二三四。與此三四五會處法全同。他化十地次第亦同。而化樂天說十禪定。初禪說十金剛心。二禪說十願。三禪說十忍。四禪摩醯首羅宮。說我本源蓮華藏世界盧舍那佛所說心地法門。不云重會普光及祇園重閣次第。又別難可會通。又此中問因。後更有果問。故彼佛心地。即後如來地等。非十頂也。有云。僧祇品答以準瓔珞等覺。別有頂位以因位窮終。今僧祇中說十大數。數中之極故云十頂。彼問雖十答有多數。對上定通。亦非其類故不可也。有云。壽量品答。彼中十重佛土。皆上為下頂極。至賢首佛剎名為十頂。又佛名第二。名此十一世界為上首故。但舉此初後十一。即顯過百萬阿僧祇世界壽量之數。此為標首。首即頂故。然復彼無別問。似有少理。但標此十界將為問端。對十地等甚不相例。今謂。新舊梵本俱無忍問。答中即有故。知彼忍即此頂也。言十頂者。因位終極。十定十通皆等覺位。十忍居後。又得頂名。問中約位終極。故名為頂。答據法門忍受。以智印定故云忍也。非位終極。不具十忍非有十忍。不極因位。二文更顯。故十忍品末云。通達此忍門成就無礙智。超過一切眾轉於無上輪等。既言超過即是頂義。亦猶四善根中忍頂法門。義相類故。不爾忍無別問。空答何為。設欲成十應脫十信。十信雖未成位。亦隨法界修廣大行。德用殊勝別一會答應有問故。若將十忍已下四品。共答頂問於理無失。俱是等覺之終極故。第二二十句。問所成果。全同初會。於中亦初十句。明內德成滿。後十句體相顯著。初中如來神力。前會名佛加持。即神力加持故。神通約外用無壅。神力約內有幹能。離世間品各有十事。其相自別。言無礙者。謂如來所作無能障礙也。上文名無能攝取等。義皆同也。後十中辯才是語業。智慧是意業。最勝是身業。準前會中。唯欠佛光明之一句。餘如前釋。其所答文亦如前引出現不思議相海品說。但前總會故引此文。所引之文正答今問。說者宜重引之。三願佛下結請。請同彼說故致亦言」\n\n*庚·说分·现相答＋众海雲集＋十菩萨表法（跨卷十二–十三题头）*：\n\n> 「請分竟。第三說分。於中通下六會。答此所問。準問長科亦為三分。此初三品答所依果問。二問明已下。答所修因問。三從不思議品下。答所成果問。其平等因果。因乃果中之因。果乃此果之用。故屬果收。初中分二。先如來現相答。由其念請故。又如來證窮故。後文殊言說答。伴助主故。假言顯故。今初分二。一佛現神通。二眾海雲集。今初。知其心念者。領念請也。現神通者。示相答也。言隨類者。有其三義。一隨疑者所宜異故。謂或示色令見。以聲令聞冥資令曉。皆是現通。以法界身圓明頓現也。二隨疑者流類別故。三隨疑者所疑異故。謂若疑十信。即見如來足輪放光周乎法界等。若疑十住。則見如來足指放光百剎塵外菩薩集等。如放光一事既爾。餘相皆然。故知初會現相遍於九會。此會現通通於一分。結集隨義編之作次耳。故下三會。皆有不起覺樹之言。第二現神通下。眾海雲集即現相。答初十句之問。光現佛剎答佛剎問。剎有金色等是剎莊嚴。既以金成亦答剎體。彼剎菩薩亦剎莊嚴。菩薩大寶以為嚴故。亦剎清淨純淨。佛剎唯菩薩故。淨修梵行是剎成就淨土行故。亦剎清淨所修淨故。此已上答五句依問。兼答五句正報土。各有佛及見如來坐蓮華藏。是答佛住。現通放光是答威德。名不動智等是答法性。見佛轉法輪是答說法。佛成正覺是答菩提。文雖在下義皆此具。光明覺現即現此故。十方眾集即為十段。一一方內文各有八。一遠近。二土名。三佛號。四上首。五眷屬。六詣佛。七到已致敬。八化座安坐。去此遠近皆十剎塵數者。前會為說所信因果深廣。故須遠集華藏之外十方剎海。今為說於生解因果漸漸增修。故但集娑婆隣次之剎。信行最劣故。復云十。後後漸增至法界品。還集剎海。初不云一直云十者。表無盡故。要剎塵者。比餘勝故。為有所表故。分階級非初信等。不是通方故。結及證成十方齊說。又隨迷名外悟處名來。而實佛土本無遠近。土皆名色者。表信麁現故。亦表顯然可生信故。佛號同智者。有信無智增無明故。信中之智。本覺起故。主同名首者。梵云室利。一名四實一首二勝。三吉祥四德。是以譯者前後不同。今通用之以信為首。攝諸位故。次第行中信最勝故。甚難得故。於生死中創發信心。為吉祥故。信能增長智功德等。一切德故。此十菩薩同表信門故。皆名室利。各隨一門達一切法。故復有差。次文當釋。亦有傳云。梵云室利。此云吉祥。室利云首。亦是一理。眷屬皆十剎塵者。表一一行攝無盡德故。皆詣佛者。有歸向故。餘如前會。又下菩薩名等。皆是表法。菩薩表所行之行。本剎表所證之理。佛名表所得之智。今初東方言金色者。心性無染與緣成器。為自體故。本智如空離覺所覺。湛然不動動即是妄。非曰智故。又縱成佛果不異凡故。即本覺智住心真如。菩薩妙德者。慧達佛境。處處文殊由慧揀擇。契於本智故分因果。二覺首者。覺心性也。無性不礙隨緣。隨緣不礙無性無礙智也。不染而染染而不染。俱難了知為妙色也。三財首者。法財教化即滅闇智。了眾生空如蓮不著。四寶首者。真俗無違可珍貴故。善知業果不犯威儀。性相無違。唯一乘旨。是為唯嗅瞻蔔華矣。五德首。了達如來應現說法之功德故。即是明於法相。又了佛德心明白也。若有此智。如青蓮華最為第一。六目首。福田照導如目將身。平等福田。為究竟智。是最可重故云金色。佛為福田以佛為境故。同上文殊依金色界。七精進首。正教甚深必在精進。能策萬行為最勝智。圓明可貴故。復云寶。八法首。法門雖多必在正行。於法能行方得自在。得般若之堅利。為金剛色。九智首。佛之助道雖無量門。智為上首能淨萬行。故云梵智。智淨體淨猶若玻瓈明徹無染。十賢首。前佛後佛一道清淨。由自性善故稱曰賢。能知此賢是觀察力。觀察本性常平等故。又十佛相望不動是體。餘皆是用。十菩薩相望。文殊為總。餘皆是別。以總導別故。九菩薩不離妙德。以前後流例略為此釋。惟虛己而求之。不信此理。甚深法門於我何預。大方廣佛華嚴經疏卷第十二大方廣佛華嚴經疏卷第十三唐清涼山大華嚴寺沙門澄觀撰」\n\n*辛·随门别显·四洲十名逐释*：\n\n> 「第二諸佛子下。隨門別顯。文分為三。初終此品辨身名差別。答上佛住之問近廣種種身等八句。以色相等皆屬身故。二四諦品。辨言教遍周。答佛所說法問。近廣種種語業。三光明覺品。明光輪窮照。答上威德法性菩提三問。近廣種種觀察。其五句依報。但有現相答。廣在前會故。今初廣上名者。然聖人無名為物立稱。若就德以立德無邊涯。若隨機立名等眾生界。雖復多種皆為隨宜生善滅惡見理而立。海印頓現不應生著也。文中分四。一娑婆之內自有百億。二娑婆隣近。即百億之外。三類通一切。謂盡十方。四釋差別所由。由隨物故。初中分三。初此四洲。二四洲之隣十界。三總結娑婆。今初亦三。初標處。次列名。後結數。他皆倣此。舉四洲者。昔云意取閻浮言總意別。餘三天下佛不出故。然雖不出。除北俱盧餘容有往。下並準之。一切義成即悉達也。無事不成就故。圓滿月者。惑斷智圓恩蔭清涼故。師子吼者。名決定說。釋迦牟尼者。釋迦云能。能仁種故。牟尼云寂默。契寂理故。第七仙者。七佛之末故。若取賢劫當第四仙。即喻也無欲染故。毘盧遮那。廣如前釋。瞿曇氏者。唯約姓也。此云地主。以從劫初代代相承。為轉輪王故。然上云釋迦。乃是族望。此即姓望故。智論第二云。釋迦牟尼姓瞿曇。故佛名經亦然。沙門此云息惡。無惡不息故。復稱大。最勝者聖中極故。德無加故。導師者。引導眾生離險難故。於生死海示眾寶故。然名含多義。略釋此十恐文繁博。餘但隨難解之」\n\n*壬·四洲之邻十界＋总结娑婆＋邻近十方（校勘：密訓缺闻慧·西北十一名·帝釋弓）*：\n\n> 「二此四天下東下。此洲之隣十界。即為十段。其善護等。皆四洲之通稱也。今初東方斷言論者。證離言故。無能說過故。南云帝釋者。為天人主能稱物心故。西云水天者。水善利萬物天光淨故。北方醫羅跋那者。具云醫濕弗羅跋那。醫濕弗。自在也。羅跋那者。聲也。即圓音自在耳。上云盛火者。盛火焚薪不擇林木。佛智利物無揀賢愚。問餘聖教說。大輪圍內平布百億。上即諸天下安地獄。如何此說上下皆有四洲。答此教所說事隨理融。隨說法處即是當中。縱極上際旁至大輪圍山。亦有十方互為主伴。以融為眷屬。本敷非多。十方界融亦準於此。因此略說娑婆融通。改非改相略有其五。一約事常定。如小乘說。二隨心見異。若身子梵王。三就佛而言本非淨穢。四隨法迴轉如上主伴互為。五潛入微塵。如前會說。若通論餘淨土更有五義。謂諸剎相入義。相即義。一具一切義。廣陜自在義。帝網重疊義。並如前後諸文所說。三諸佛子此娑婆下。總結娑婆。二諸佛子此下。彰娑婆隣近十方。亦為十段。密訓唯九者。勘晉經開曉意下闕一聞慧。南方唯二舊經。則具。乃是新本脫漏。準前後例不應獨此便略。西北方名有十一者。獨此有餘不成文體。此中專念法。應即是前所脫聞慧。亦是梵本之漏。注者誤安貝葉耳。下方云帝釋弓者。如來念定之弓。以明利箭能射業惑阿修羅故。然舊云法命主意。取帝釋以法教命為天主故。今云其弓但一事耳。若作宮室字。以處取人大同晉本。第三諸佛子如娑婆下。類通一切。準四諦品。更有舉此例餘十方亦如娑婆。互為主伴」\n\n*癸·类通一切＋释差别所由（二意：仿古熟他·称本立名）*：\n\n> 「第四如世尊下。釋差別所由。此有二意。一自既由於差別名言等。而得成就。今還倣古以差別熟他。二昔菩薩時隨機調物。今時出世稱本立名。如昔教眾生令空妄境。今成正覺為立超境界名。他皆倣此故而得成熟之言」\n\n### 5.2 法藏《大方广佛华严经探玄记》（`T1733`）——「名號品第三」段\n\n**来源**：唐·魏国西寺沙门法藏述《華嚴經探玄記》**卷第四**（「此從第二會初盡此會竟」；品题「**名號品第三**」）。本机 `data/references/cbeta_txt/T1733_法藏_探玄记.txt`。\n\n**判品·「亦作四門分別：初釋名、二來意、三宗趣、四釋文」**（*fourfold analysis*: 釋名·來意·宗趣·釋文；就六十本立论，「名號品」为六十本第三品）。\n\n**（一）释名**（三：分名·会名·品名）：\n- **分名**：「**自下明第二修因契果生解分。謂從此至第六會來。辨說所修五位之圓因成十身之滿果。**」\n- **会名**：「**名普光法堂會**。然釋有五義。一約事（佛於堂內放光普照故名普光）·二約法（真俗遐周曰普。妙智照達云光）·三約境·四唯約智·五約實（**無礙法界一塵一行。皆遍因陀羅網重重顯現。故稱為普**）。」\n- **品名**：「**如來之名號依主釋。或如來則名號。以十號中如來為一故。於中名謂釋迦等別名。號謂十號諸佛通名。又召體為名。標德為號。**」\n\n**（二）来意**（三：分来·会来·品来）：分来「**前既舉果勸生信樂。今明彼果能得之因令生正解故次來也**」；会来「**修因之中信最初故故次來也**」；品来（二释）「一云前品明依果。此明正报。正報之中不過三業。此品明身業遍應。謂名號依身而立故。四諦品明佛口業普周。光明覺品明佛意業遍覺」——**此三品＝如来三业**。\n\n**（三）宗趣**（三：分宗·会宗·品宗）：品宗「**一約相以如來身名普應廣益群生為宗。二約實以十佛國土海為宗。**」\n\n**（四）释文**（长分三：序分·请分·说分）：\n- **序分**：「相傳普光堂在菩提樹東南可三里許熙連河曲內。佛初成道諸龍見佛樹下露坐。遂為佛造此法堂」；十句德依《摄论》《佛地论》释（参 §2.2）。\n- **请分**：「裕梵等法師離為一百二十四問。……又若合中間九十問為九問。即總四十三問。光統師合隨喜心等為一問。即為三十四問。……今依此釋總分為三。初十問因所依果。次十問果所起因。後十四問因所得果。」\n- **说分**：「初此會中答前初十問前際佛法。」「**即如其像現神力者現像答也。……皆於如來法界身中無不圓明頓現其像**」。十方众「**世界同名色者表信位法相麁顯著故。佛同名智者表信中最初始覺從本覺起故。菩薩同名首者表信是因初故**」。文殊名义略叙五义（名义·出处·师资·位次·德用），「**此中十菩薩依梵本同名室利。兜沙經中亦同名師利**」。\n\n**【要点提炼】**（L.239 会读深化）\n\n1. **会名五义之递进**：约事→约法→约境→唯约智→**约实**（「无碍法界一尘一行皆遍因陀罗网重重显现故称为普」）——训「普光」五折，与第三部训「普贤」三法同法（§第三部 §5.3）。\n2. **品名依主释＋名号二分**：名＝别名（释迦等）·号＝通名（十号）；又「召体为名·标德为号」（上引品名段）——211 条名号之语法骨架。\n3. **三业判**：名号品＝身业遍应·四谛品＝口业普周·光明觉品＝意业遍觉（上引来意段）——第二会前三品之功能地图（§5.4 对读之纲）。\n4. **问数谱系**：裕梵 124／合中间 90 为 9 得 43／光统 34——与本文四十·李三十七·智俨二十三合成**五说问数谱系**（§2.1 逐项点定为准，诸说并存）。\n5. **「现像答也」**：「皆于如来法界身中无不圆明顿现其像」（上引说分段）——名号之答亦是**现像之答**（与第二部「以相代答」一脉）。\n6. **同名表位**：世界同名色（信位法相粗显）·佛同名智（信中最初始觉从本觉起）·菩萨同名首（信是因初）（上引说分段）——**名号即教位**，十方之「同」皆表法。\n\n### 5.2′ 智俨《搜玄分齊通智方軌》（`T1732`）——「普光堂如來名號品第三」段\n\n**来源**：唐·终南山至相寺沙门**智俨**（华严二祖，法藏之师）《搜玄分齊通智方軌》**卷上**（品题「**第二會普光堂如來名號品第三**」）。本机 `data/references/cbeta_txt/T1732_智俨_搜玄记.txt`（PDF 抽取本，康熙部首异体字已归一，仍待二次校对〔待核〕）。\n\n**智俨就六十本（`T09n0278`）立论**：六十本第三品「普光堂如來名號品」＝八十本第七品「如来名号品」。\n\n**「有四。一释名。二来意。三宗趣。四分文释。」**（*fourfold analysis*: 釋名·來意·宗趣·分文釋）：\n- **释名**（二）：「一處名。**普者德普。光者智光**。亦可光普。二品名者。**名即通名。號者別號**。」\n- **来意**（二）：「一会来意……**前舉淨土為所信境。次辨能信心故也**。二品来意者。**前辨所依土。次土中化主人名故也**。」\n- **宗体**（二：约人·约法）：「**名號品以化悲德自在相為宗。亦可是佛國海為宗。**」\n\n**【要点提炼】**（L.239）\n\n1. **训名二折**：处名「普者德普。光者智光」（亦可光普）·品名「名即通名。號者別号」（上引释名段）——较法藏五义之简版。\n2. **来意二重**：会来「前举净土为所信境。次辨能信心」·品来「前辨所依土。次土中化主人名」（上引来意段）——**境→能信→化主**三步。\n\n\n- **释文**：就前三品正报中「**初名號明佛身業。二四諦品是佛口業。三光明覺辨佛意業**」；长分为八（举处及化主并叹佛德·明所被机·明陈所疑事·辨集新众·文殊叹化事甚深·四谛品教法甚深·光觉品许说方便·明难品正陈行仪）。\n- **请数**：「**時眾請文有四十 四句**」；「大光師但作三十三問」；「先際內初五問名號品答。次二四諦答。次一光覺答。」\n\n### 5.2″ 慧苑《續華嚴略疏刊定記》（`X0221`）——**本品之记不传**\n\n**来源**：唐·静法寺沙门慧苑述《續華嚴略疏刊定記》（`X0221`）。本机 `data/references/cbeta_txt/X0221_慧苑_续华严略疏刊定记.txt`。\n\n**按**：`X0221` 卷第四末，于第一会竟处有校记者按语：「**卍按。如來名號品及四聖諦品之記恐不傳歟。**」——即**慧苑对本品的疏记「恐不传」**（第二会名号品、四谛品之记未传世）。故本品**慧苑一家之说不存**，如实标注，**不以他品之记冒充本品**。\n\n〔**说明**〕第一会（品2–6）各篇曾补慧苑 `§5.2″`；本品因慧苑之记不传，**§5.2″ 仅为存目与说明**，此项属**客观材料限制**（非编辑遗漏）。\n\n### 5.3 李通玄《新华严经论》（`T1739`）／《华严经合论》（`X0223`）——「如来名号品第七」段\n\n**来源**：唐·长者李通玄撰《新华严经论》**卷第十四**（品题「如來名號品第七」）；《合论》**卷第二十五–二十六**（品题「佛名號品第七」／「佛名號品第七之餘」）。本机 `cbeta_txt/T1739_李通玄_新华严经论.txt`、`X0223_李通玄_华严经合论.txt`。\n\n**第二会总判**：「**第二會六品經。明菩薩信心門。於此一會之中。自有序分正說分流通分。從第十二卷初爾時已下有四行半經。是序分。已下至賢首品。是正說分。賢首品末有三行半經。是流通分。**」\n\n**长科·「以果成信」**：「**從此品至賢首品。是第三長科文中。以果成信。信自己心之是佛分。於此一段之中約有六法。以成自心佛果。**」六法：一佛名号品（信佛名号遍一切世间名知名性离）·二四圣谛品·三光明觉品·四问明品·五净行品·六贤首品。\n\n**「將釋此品略作三門。一釋品來意。二釋品名目。三隨文釋意。」**（*threefold analysis*: 來意·名目·隨文釋意）\n\n**（一）释品来意**：「**明前之初會。但明如來成等正覺之身及智攝生。未明如來名號攝生廣狹。今此第二會普光明殿。方明佛果名號攝生故。**」「**前會明身智遍周。此會明名身及智俱遍周故。**」\n\n**（二）释品名目**（五缘成佛号，参 §1.1）：一以法界自体根本智缘·二约如来示成正觉自德缘·三明如来利生方便缘约位进修·四一切众生随根所乐缘·五法界体用平等缘。其**第五**：「**一切諸法及以名言自體性離故。一切法自體性離即法界性。法界性即佛號故。一切法及名言皆是佛號故。**」其**问答「名之与号何异」**：「**有德即約德立名。其名可尊。稱之為號。……若約此經佛號。總是約法約德立名。不同世俗也。**」\n\n**（三）随文释意**（当品长科四：叹德集众分·大众请法分·如来神通现法分·举法演说分）：\n- **叹德集众分**：「意明二處不異。為不移本處道場而身遍坐一切處故。」「五種遍周」：示成正觉遍周·依正名号遍周·定体遍周·普贤行教遍周·法界圆满遍周。\n- **大众请法分**：「於中有三十二問。……一初有四問問四種佛剎。二……二十八問菩薩住地佛眼耳等。」问重之由（前会信他佛果·此会自入信修行）。\n- **如来神通现法分**：十方菩萨来众「义分为十」（举佛刹方面·远近·世界名色·佛名号·上首菩萨名·大众之数·来已致敬·随方化座·座之名字·升座而坐）。**托事表法**：东方为震卦·春生·长男·头首·青龙；又「**此第二會舉十方諸佛根本之智凡聖共有之果。即一切處金色世界一切處不動智佛十智佛等是也**」「**文殊師利。是自心妙擇之慧**」。\n- **举法演说分**：文殊说名号遍周（详见 §2.7–2.11）。\n\n**【要点提炼】**（L.239）\n\n1. **第二会总判「以果成信」**：名号→四谛→光明觉→问明→净行→贤首六法「成自心佛果」，**信自己心之是佛**（上引「长科」段）——六品一义之总纲。\n2. **五缘成佛号**：法界自体根本智缘／示成正觉自德缘／利生方便约位缘／众生随根乐缘／**法界体用平等缘**（一切法及名言自体性离即法界性，法界性即佛号）（上引释品名目段）。\n3. **名之与号之辨**：「有德即约德立名。其名可尊。称之为号」；此经佛号**总约法约德立名**，不同世俗（上引段）。\n4. **托事表法之卦位说**：东方震卦·春生·长男·头首·青龙；金色世界/不动智佛＝「十方诸佛根本之智凡圣共有之果」·文殊＝「自心妙择之慧」（上引随文段）——**李氏以易卦+自心读方位与名号**，一家之判。\n5. **三十二问**：四问佛刹＋二十八问菩萨住地佛眼耳等（上引请法分段）——与本文四十·智俨二十三又出一数（§2.1 谱系）。\n\n**【阐释】**（〔本文判断〕）李氏「以果成信」与澄观「修因契果生解」（§5.2 分名）**同会而两向**：李自信入（果作所信），法藏自信起（因将开解）——第二会六品之读法，由此两向共撑。又「文殊＝自心妙择之慧·不动智佛＝凡圣共有之果」把名号品读成**自心地图**，为「信自心是佛」（§1.2）之长者系表述。\n\n### 5.3′ 会读（海云讲记）\n\n**来源**：海云继梦和上《八十华严·如来名号品》（01 集·总第 202 集·95.10.19）；及《八十华严导读》（西安草堂寺 201005）听录第 09 讲。本机 `docs/huayanhai/华严云海/浩瀚华严海/八十华严之如来名号品/无标题_1.txt`、`.../八十华严导读-西安草堂寺201005/听录/八十华严导读09_1.txt`。**（口说听录，属二手转写，措辞或有出入，凡与经不合者以经为正。）** 听录原文为**简体**，以下引海云语皆**照听录原文逐字引录（简体，不转繁体）**，以符「逐字回源」；听录标点参差（时见半角），引时依体例归一为全角，**字句不加改**。\n\n**（一）第二会之定位·文殊为会首**：\n> 「《华严经》要讲正文，正宗分，正式的开始是指从这个地方开始，这是属于第二会的部分。第一会的经文我们可以说是序言，他是在菩提树下讲的。这一会他是在普光明殿讲的……整个序言当中，他大概讲的三个部分，也就是毗卢遮那佛，文殊菩萨跟普贤菩萨。」（01 集）\n\n> 「……\"大、方、广\"这三个字，就是讲体、相、用。体，你去注意看看，就是毗卢遮那佛。相，就是普贤菩萨，用，就是文殊师利菩萨。……文殊师利菩萨，他就是无相法身。毗卢遮那佛是根本智，普贤菩萨就是后得智。」（01 集）\n\n**（二）「从能看」——本品与四谛品之对**：\n> 「……正面就从能的立场看，反面是从所的立场看。所以这一品的意思是从能的立场看，其实带着所的立场，哦。所的立场就是四圣谛品，下一品要讲的嘛。所以这一品从能的立场看嘛。你看一切境界都是如来境界，都是普贤境界。你从能去看，啊。所以你假如从能的来看的话，那就叫<如来名号品>。从所的立场来看，那，那，就叫<四圣谛品>。」（导读 09）\n\n**（三）本品之两层次结构**：\n> 「那么<如来名号品>这一品里呀，他分两个层次讲，第一个层次啊，是四天下。……一共上方、下方有十方。那第二个他是讲娑婆世界，不是四天下。第二个部份呐，此娑婆世界有百亿四天下。」（导读 09）\n\n**（四）「让心活起来」——名号之用意**：\n> 「我们所看的<如来名号品>上面所讲的能，从能去看，你不要执着。那么这个讲起来就是让我们的心怎么活起来。因为你一锁死就死啦……一活起来，如东方无量无边的名号，南西北方亦复如是，你是全方位会活起来的，这样的生命才有美感。」（导读 09）\n\n〔**对读**〕海云「从能／从所」之判，与法藏「此品明**身业**遍应·四谛品明**口业**普周·光明觉品明**意业**遍觉」之三业分判**可互参**：皆以本品为「能（身／能见）」、四谛品为「所（法／所说）」。**然二家立说角度不同，并存各注所据。**\n\n### 5.4 诸家对读小结\n\n| 项 | 澄观 `T1735`／`T1736` | 法藏 `T1733` | 智俨 `T1732` | 李通玄 `T1739` | 海云（讲记） |\n|---|---|---|---|---|---|\n| 所依本·品次 | 八十·**品第七** | 六十·**品第三** | 六十·**品第三** | 八十·**品第七** | 八十·品第七 |\n| 品名训释 | 召體曰名·表德為號；名別號通；「亦名亦號」（依主釋） | 名＝釋迦等別名·號＝十號通名；「召體為名·標德為號」 | 「名即通名·號者別號」 | 五缘成佛号；「約德立名……稱之為號」 | 「从能看」——就行者之「能」立名 |\n| 宗趣 | 顯佛名號周遍為宗·隨機調化利益為趣 | 約相＝身名普應廣益群生；約實＝十佛國土海 | 「化悲德自在相為宗，亦可是佛國海為宗」 | 以果成信·「名知名性离」 | 从能起用·「全方位会活起来」 |\n| 科判门数 | **五门**（來意·釋名·宗趣·問答·釋文） | **四门**（釋名·來意·宗趣·釋文） | **四门**（釋名·來意·宗趣·分文釋） | **三门**（來意·名目·隨文釋意） | ——（导读式两层次） |\n| 三业分判 | 「**先明如來三業正報。謂身語意。身是其總故先明之**……**九身語既彰。意業將顯**」（`T1736` 卷十五） | **此品＝身業**（名號依身而立）·四諦＝**口業**·光明覺＝**意業** | 「**初名號明佛身業**。二四諦品是佛口業。三光明覺辨佛意業」 | 「前會明身智遍周。此會明**名身及智俱遍周**」 | 本品＝「**能**」／四谛品＝「**所**」 |\n| 请数之判 | 「**句雖五十問但四十**」 | 依旧说（裕梵 124·光统 34）折为 10＋10＋14 | 「時眾請文有**四十 四句**」；大光师 33 问 | 「於中有**三十二問**」 | —— |\n| 位判·结论 | 第二会「**信行之会**」之始·正报因果 | 「信中最初始覺從本覺起」 | 「次辨能信心」 | 「信自己心之是佛」 | 第二会＝正宗分之始 |\n\n**一家之见**：五家皆以本品为第二会**首品**、为如来**正报**（三业）之发端，皆就「**名**」立说。其别有三：**① 科判之门数不同**——澄观五门最密，法藏·智俨四门，李通玄三门；**② 所依本不同**——法藏·智俨就**六十**（品第三）立论，澄观·李通玄就**八十**（品第七）立论；**③ 归趣不同**——澄观归于「名号周遍·随机调化」，李通玄归于「以果成信·信自心是佛」。然**诸家科判皆以「序分·请分·说分」为纲，品次虽异而品义不殊**〔本文判断〕。\n\n**「身业」之会归**：判本品为如来**三业**中之**身业**（名号依身而立），乃**法藏·智俨·澄观三家之共识**（`T1733`／`T1732`／`T1736` 卷十五）〔本文判断〕（参 §4.3）。海云「从能／从所」之判，与此「身·口·意（能·所）」之次第**可互参**——**然二家立说角度不同，并存各注所据**。三家之目既合，则本品「**名号周遍 ＝ 如来身业遍应**」之骨立矣。\n\n**请数不一之处理**：四十问之数，澄观「句雖五十問但四十」、智俨「四十 四句」、李通玄「三十二問」，法藏则据裕梵（124）·光统（34）旧说而折以「10＋10＋14」——**诸说并存，不强断何者为是**（依本系列「各照底本·异说并存」之例）。\n\n---\n\n**【会读启发】**（L.239·〔本文判断〕）\n\n1. **名号即教位**：法藏「世界同名色＝信位法相粗显」·李「十智佛＝凡圣共有之果」——二百一十一条名号不是索引而是**教科书**：每一条名都标一个信位之相。\n2. **问数五说的读法**：124／43／34／40／37／23 诸数并陈，非互斥而系**归并口径之谱**——读问数当问「谁在数、数什么」，不问「哪个对」（§2.1 逐项点定为本席立场，诸家自依其本）。\n3. **三品三业之地图价值**：身（名号）口（四谛）意（光明觉）之判使第二会结构可携行——读到后两品时，此图自验。\n4. **现代联结**：「名即通名、号即别号」＋「约德立名」＝通名/别名、属性/实例之别——211 条名号即「一佛之 211 个实例化」，数据库语言近之。\n\n## 六、文本对读与校勘\n\n### 6.1 八十华严（`T10n0279`）vs 六十华严（`T09n0278`）\n\n**对应关系**：八十本第 7 品「如来名号品」（卷十二）↔ 六十本第 3 品「如来名号品」（`T09n0278` 卷四）。**有对应品，非「缺」**。\n\n**结构平行**：六十本同具「序（佛德·众·菩萨念请）→如来现神力·十方云集→文殊叹→广显四天下与娑婆名号→类通」之骨架。\n\n**用字·内容之异（据 `T09n0278` 卷四逐字回源）**：\n\n| 项 | 八十本（`T10n0279`） | 六十本（`T09n0278`） |\n|---|---|---|\n| 说法处 | 摩竭提國**阿蘭若法菩提場**（并普光明殿） | 摩竭提國**寂滅道場**（普光法堂） |\n| 赞佛首句 | **妙悟皆滿** | **善覺智無二念** |\n| 十方世界名 | 金色／妙色／蓮華色／薝蔔華色／優鉢羅華色／金色／寶色／金剛色／玻瓈色／平等色 | 金色／**樂色**／**華色**／薝蔔華色／**青蓮華色**／金色／寶色／金剛色／玻瓈色／**如實色** |\n| 十方佛号 | 不動智／無礙智／滅暗智／威儀智／明相智／究竟智／最勝智／自在智／梵智／觀察智 | 不動智／**智火**／**習智**／**行智**／**明智**／究竟智／**上智**／自在智／梵智／**伏怨智** |\n| 十方上首 | 文殊師利／覺首／財首／寶首／**功德首**／目首／**精進首**／法首／智首／賢首 | 文殊師利／覺首／財首／寶首／**德首**／目首／**進首**／法首／智首／賢首 |\n| 四天下名 | 善護／**難忍**／**親慧**／**有師子**／**妙觀察**／喜樂／**甚堅牢**／**妙地**／**焰慧**／持地 | 善護／**難養**／**佛慧**／**師子言**／**安寧**／喜樂／**堅固**／**須菩提**／**焰道**／持地 |\n| 称数用语 | 「**其數十千**」／「百億萬種種名號」 | 「**其數一萬**」／「百億萬」（数值同·用语异） |\n| 娑婆东世界 | 密訓 | 密訓（**同**） |\n| 娑婆西北 | 歡喜（11 名） | 知足（11 名：華聚…五法藏） |\n| 娑婆东南 | 饒益（10 名） | 饒益（**11 名**：因緣…智海） |\n\n〔**辨**〕二本**同一骨架而名号异**，属**异译用字与传本之别**，**并列不强断**。其中**名号条数之异**（八十本娑婆西北 11、六十本娑婆东南 11）详见下〔校勘〕。\n\n**〔校勘·八十本娑婆西北「歡喜」十一名〕**：\n八十本「此娑婆世界西北方……名為：歡喜」下列 **11 名**（妙華聚／栴檀蓋／蓮華藏／超越諸法／法寶／復出生／淨妙蓋／廣大眼／有善法／專念法／網藏），较他列多「網藏」一名；六十本「知足」亦 11 名（華聚／栴檀蓋／蓮華藏／超越諸法／法顯／次起／善淨蓋／離垢善根／善言／專念法／五法藏）。**法藏、澄观均有校记**（澄观：「西北方名有十一者。獨此有餘不成文體。此中專念法。應即是前所脫聞慧。亦是梵本之漏。注者誤安貝葉耳」）。**本稿照底本列 11 名，不改；并存校记〔待核〕。**\n\n**〔校勘·八十本娑婆东「密訓」〕**：八十本列 10 名（平等／殊勝／安慰／開曉意／聞慧／真實語／得自在／最勝身／大勇猛／無等智）；六十本亦 10 名（平等／最勇／安慰／調意／聞慧／一切捨／自在／堅固身／大超越／無比智）。**澄观谓「密訓唯九者……闕一聞慧」，与今二本所见（皆具聞慧）不合，其所据写本或有出入〔待核〕。**\n\n**〔六十本娑婆十方列名复验（2026-10-24·P7）〕**取全本 `T09n0278.xml` 净界切片（如來名號品→四諦品第四・36154–39704），上表六十侧三列**逐名全中**——東密訓 10 名（平等／最勇／安慰／調意／聞慧／一切捨／自在／堅固身／大超越／無比智）、西北知足 11 名（華聚…五法藏）、東南饒益 11 名（因緣…智海）；「其數一萬」11 见；樂色／智火／難養／佛慧／師子言／安寧／堅固／須菩提／焰道／伏怨智诸异名逐一命中——**§6.1 表全部复验属实**（底本 `data/references/cbeta/T09n0278.xml`・sha256:a2bfcee6213f）。\n\n### 6.1′　六十《如來名號品第三》全本对照〔L.191 本批·全量入文〕\n\n品界 `T09n0278_juan4.txt` @5619–9206·CJK 2,929（含末行次品题头「大方廣佛華嚴經四諦」5 字·正文净 2,924）·以下**逐行照录原档分行**·不转写不断句（异译旧词与 §6.1 表逐项相应·「其數一萬」11 见·「或名／或號／或稱／或謂」四种前缀混用 30/92/81/10 见·`_e7_stats.py` 实测）：\n\n> 如來名號品第三\n> 佛在摩竭提國寂滅道場，初始得佛，普光法堂，坐蓮華藏師子座上，善覺智無二念，了達法性、住佛所住、等諸如來至無礙趣具不退法無壞境界，住不思議等達三世，與十佛國土微塵數等大菩薩俱，盡一生補處，悉從他方世界來集，了眾生性，深入法界，常善思量世間涅槃，明了業報眾生心行，悉能解知諸法義味，觀察世間、離世間法，究竟分別為無為性，去、來、現在靡不貫達。時，諸菩薩咸作是念：「唯願世尊哀愍我等，隨所志樂，示現佛剎、示佛所住、示佛國莊嚴、示諸佛法、示佛土清淨、示佛所說法、示佛剎體、示佛功德勢力、示隨佛剎起、示成正覺，開示十方一切如來所可分別菩薩：十住、十行、十迴向、十藏、十地、十願、十定、十自在、十頂菩薩隨喜心、不斷如來性、救眾生、滅煩惱、知眾行、解諸法、離垢穢、拔眾難、決疑網、竭愛欲、佛無上地、佛境界、佛住壽、佛行、佛力、佛無所畏、佛定、佛神足、佛勝法、佛不動轉、佛六情根、佛光、佛智、佛無上功德一切具足，如是等事，悉為我現。」\n> 爾時，世尊知諸菩薩心之所念，即如其像，現神通力。現神力已，東方過十佛剎微塵數國，有世界名金色，佛號不動智，有菩薩字文殊師利，與十佛土塵數菩薩來詣佛所，恭敬供養，頭面禮足，即於東方，化作蓮華藏師子之座，結跏趺坐。\n> 南方過十佛剎微塵數國，有世界名樂色，佛號智火，有菩薩字覺首，與十佛土塵數菩薩來詣佛所，恭敬供養，頭面禮足，即於南方，化作蓮華藏師子之座，結跏趺坐。\n> 西方過十佛剎微塵數國，有世界名華色，佛號習智，菩薩字財首，與十佛土塵數菩薩來詣佛所，恭敬供養，頭面禮足，即於西方，化作蓮華藏師子之座，結跏趺坐。\n> 北方過十佛剎微塵數國，有世界名薝蔔華色，佛號行智，菩薩字寶首，與十佛土塵數菩薩來詣佛所，恭敬供養，頭面禮足，即於北方，化作蓮華藏師子之座，結跏趺坐。\n> 東北方過十佛剎微塵數國，有世界名青蓮華色，佛號明智，菩薩字德首，與十佛土塵數菩薩來詣佛所，恭敬供養，頭面禮足，即於東北方，化作蓮華藏師子之座，結跏趺坐。\n> 東南方過十佛剎微塵數國，有世界名金色，佛號究竟智，菩薩字目首，與十佛土塵數菩薩來詣佛所，恭敬供養，頭面禮足，即於東南方，化作蓮華藏師子之座，結跏趺坐。\n> 西南方過十佛剎微塵數國，有世界名寶色，佛號上智，菩薩字進首，與十佛土塵數菩薩來詣佛所，恭敬供養，頭面禮足，即於西南方，化作蓮華藏師子之座，結跏趺坐。\n> 西北方過十佛剎微塵數國，有世界名金剛色，佛號自在智，菩薩字法首，與十佛土塵數菩薩來詣佛所，恭敬供養，頭面禮足，即於西北方，化作蓮華藏師子之座，結跏趺坐。\n> 下方過十佛剎微塵數國，有世界名玻瓈色，佛號梵智，菩薩字智首，與十佛土塵數菩薩來詣佛所，恭敬供養，頭面禮足，即於下方，化作蓮華藏師子之座，結跏趺坐。\n> 上方過十佛剎微塵數國，有世界名如實色，佛號伏怨智，菩薩字賢首，與十佛土塵數菩薩來詣佛所，恭敬供養，頭面禮足，即於上方，化作蓮華藏師子之座，結跏趺坐。\n> 是時，文殊師利菩薩承佛神力，觀察大眾，歎曰：「快哉！今菩薩會為未曾有。諸佛子！當知佛剎不可思議，佛住、佛國、佛法、佛剎清淨、佛說法、佛出世、佛剎起、諸佛阿耨多羅三藐三菩提皆不可思議。何以故？十方諸佛說法，知彼心行，隨化眾生，與虛空、法界等。何以故？此娑婆世界中，諸四天下教化一切種種身、種種名、處所、形色、長短、壽命、諸得、諸入、諸根生處、業報，如是種種，不同眾生，所見亦異。何以故？諸佛子！此四天下佛號不同，或稱悉達，或稱滿月，或稱師子吼，或稱釋迦牟尼，或稱神仙，或稱盧舍那，或稱瞿曇，或稱大沙門，或稱最勝，或稱能度。如是等稱佛名號，其數一萬。\n> 「諸佛子！次此東方有四天下，名曰善護，彼稱如來，或號金剛、或號尊勝、或號大智、或號不壞、或號雲王、或號無諍、或號平等、或號歡喜、或號無比、或號默然，如是等稱佛名號，其數一萬。\n> 「諸佛子！次此南方有四天下，名曰難養，彼稱如來，或名甘露灌、或名善名稱、或名離垢、或名實論師、或名調御、或名樂慧、或名大音、或名眾祐、或名無量、或名勝慧，如是等稱佛名號，其數一萬。\n> 「諸佛子！次此西方有四天下，名曰佛慧，彼稱如來，或謂性慧、或謂愛現、或謂無上王、或謂無恐怖、或謂實慧、或謂常化、或謂知足、或謂法慧、或謂究竟、或謂能忍，如是等稱佛名號，其數一萬。\n> 「諸佛子！次此北方有四天下，名師子言，彼稱如來，或稱大牟尼、或稱苦行、或稱婆伽婆、或稱福田、或稱一切智、或稱善意、或稱清淨、或稱伊那婆那、或稱勝鬘、或稱願行滿，如是等稱佛名號，其數一萬。\n> 「諸佛子！次此東北方有四天下，名曰安寧，彼稱如來，或號法王、或號等起、或號寂靜、或號妙天、或號離欲、或號勝慧、或號等心、或號無壞、或號慧音、或號遠來，如是等稱佛名號，其數一萬。\n> 「諸佛子！次此東南方有四天下，名曰喜樂，或稱如來，或名蓮華、或名慧火、或名知人、或名密教、或名解脫、或名自然安住、或名妙行成就、或名清淨眼王、或名上勇、或名精進力，如是等稱佛名號，其數一萬。\n> 「諸佛子！次此西南方有四天下，名曰堅固，彼稱如來，或稱不動、或稱慧王、或稱滿慧、或稱無動慧、或稱常悲、或稱頂王、或稱勝音、或稱一切施、或稱持仙、或稱勝須彌，如是等稱佛名號，其數一萬。\n> 「諸佛子！次此西北方有四天下，名須菩提，彼稱如來，或號普慧、或號光明成就、或號寶髻、或號應敬念、或號無上義、或號悅樂、或號本性清淨、或號光明滿、或號脩臂、或號本善住，如是等稱佛名號，其數一萬。\n> 「諸佛子！次此下方有四天下，名曰焰道，彼謂如來，或名長養善根、或名師子色、或名利智、或名真金焰、或名普親、或名梵音、或名饒益、或名究竟來、或名真天、或名平等施，如是等稱佛名號，其數一萬。\n> 「諸佛子！次此上方有四天下，名曰持地，彼謂如來，或稱猛慧、或稱無量清淨、或稱覺慧、或稱勇首、或稱妙莊嚴、或稱能發歡喜、或稱意成滿、或稱火光、或稱精進、或稱一乘。\n> 「諸佛子！如是持地四天下稱佛名號，其數一萬。此娑婆世界有如是等百億四天下，彼稱如來亦各不同，有百億萬。\n> 「諸佛子！此娑婆世界東，次有國土，名曰密訓，彼謂如來，或稱平等、或稱最勇、或稱安慰、或稱調意、或稱聞慧、或稱一切捨、或稱自在、或稱堅固身、或稱大超越、或稱無比智。諸佛子！如是密訓國土稱佛名號，有百億萬。\n> 「諸佛子！此世界南，次有國土，名曰最勇，彼謂如來，或稱自然清淨、或稱意至到、或稱能仁、或稱解脫王、或稱智慧王、或稱明行足、或稱善誓、或稱能寂滅、或稱大慈、或稱大悲，如是等稱佛名號，有百億萬。\n> 「諸佛子！此世界西，次有國土，名曰離垢，彼謂如來，或稱具足直心、或稱分別道、或稱善持、或稱解脫眾亂、或稱論師、或稱分別眾寶、或稱無上現、或稱來化、或稱一切苦行、或稱具足力，如是等稱佛名號，有百億萬。\n> 「諸佛子！此世界北，次有國土，名寶境界，彼謂如來，或稱薝蔔華色、或稱日藏、或稱依精進住、或稱等起住壽、或稱超實、或稱慧日、或稱無障礙、或稱月出、或稱慧火勢、或稱清淨身，如是等稱佛名號，有百億萬。\n> 「諸佛子！此世界東北，次有國土，名曰訶尼，彼稱如來，或號離苦、或號一切解脫、或號因緣具足、或號解脫智慧、或號過去藏、或號寶光、或號離世間、或號至離身地、或號端嚴藏、或號離瞋恚心，如是等稱佛名號，有百億萬。\n> 「諸佛子！此世界東南，次有國土，名曰饒益，彼稱如來，或號因緣、或號盡智、或號美音、或號根勝、或號莊嚴蓋、或號淨根、或號殊特、或號分別到彼岸、或號勝定、或號慈父、或號智海，如是等稱佛名號，有百億萬。\n> 「諸佛子！此世界西南，次有國土，名曰鮮少，彼稱如來，或號牟尼主、或號樂寶、或號不二觀、或號知智、或號謙意、或號有緣見、或號根主、或號天人師、或號建業、或號金剛華，如是等稱佛名號，有百億萬。\n> 「諸佛子！此世界西北，次有國土，名曰知足，彼稱如來，或號華聚，或號栴檀蓋、或號蓮華藏、或號超越諸法、或號法顯、或號次起、或號善淨蓋、或號離垢善根、或號善言、或號專念法、或號五法藏，如是等稱佛名號，有百億萬。\n> 「諸佛子！此世界下，次有國土，名離摶食，彼稱如來，或號真珠焰、或號普化、或號法命主、或號無為、或號覺根、或號離塵、或號風無礙、或號欣施、或號分別道、或號建幢，如是等稱佛名號，有百億萬。\n> 「諸佛子！此世界上，次有國土，名解脫音，彼稱如來，或號猛幢、或號無量寶、或號樂大施、或號天光、或號吉祥興、或號離死地、或號最勝、或號不退輪、或號離非法、或號修一切智。\n> 「諸佛子！此解脫音世界稱佛名號，有百億萬，如娑婆國土及十世界，如是東方百千億、不可量、不可數、不可思議、不可稱、無等、無邊、無分齊、不可說虛空、法界等世界中，眾生稱佛名號各各不同，南、西、北方，四維，上、下，亦復如是，是皆如來為菩薩時，有因緣者為度此故，種種方便、口業、音聲、行業、果報、法門、權道、諸根所樂，令諸眾生知如來法。」\n> 大方廣佛華嚴經四諦\n\n〔按〕六十侧结句两式：四天下系十一列「如是等稱佛名號，其數一萬」，娑婆系「諸佛子！如是X國土稱佛名號，有百億萬」或「如是等稱佛名號，有百億萬」——**举名各十而结数不同**，与八十系同构（§2.13〔体式观察〕）；上方振音／解脫音列及「其數一萬」末二处不结全句（60-022·60-033·实测），异于他列，各照底本、不统一。\n\n### 6.2 四十华严（`T10n0293`）\n\n**无本品**。四十华严（般若译）唯译本经〈入法界品〉（相当于八十本第 39 品），本品（第 7 品）不在其范围。**不涉及对读**。\n\n### 6.3 单品别译：《佛说兜沙经》（`T10n0280`）\n\n后汉·支娄迦谶译《佛说兜沙经》一卷，为《华严》最早汉译之单品，「内 ansform=\"rotate(90 394 402)\">鮮少</text>\n  <rect x=\"424\" y=\"250\" width=\"44\" height=154 fill=\"#c46b5d\" opacity=\"0.7\"/>\n  <text x=\"446\" y=\"246\" font-size=\"10\" text-anchor=\"middle\" fill=\"#3d6577\">11</text>\n  <text x=\"446\" y=\"402\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5b4636\" transform=\"rotate(90 446 402)\">歡喜</text>\n  <rect x=\"476\" y=\"250\" width=\"44\" height=140 fill=\"#5e8b9e\" opacity=\"0.7\"/>\n  <text x=\"498\" y=\"246\" font-size=\"10\" text-anchor=\"middle\" fill=\"#3d6577\">10</text>\n  <text x=\"498\" y=\"402\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5b4636\" transform=\"rotate(90 498 402)\">關𨷲</text>\n  <rect x=\"528\" y=\"250\" width=\"44\" height=140 fill=\"#5e8b9e\" opacity=\"0.7\"/>\n  <text x=\"550\" y=\"246\" font-size=\"10\" text-anchor=\"middle\" fill=\"#3d6577\">10</text>\n  <text x=\"550\" y=\"402\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5b4636\" transform=\"rotate(90 550 402)\">振音</text>\n  <text x=\"320\" y=\"424\" text-anchor=\"middle\" font-size=\"10\" fill=\"#7a6a5a\">总 211 条＝10＋100＋101（程序切分实测·与 §7.3 表一致）</text>\n</svg>\n\n---\n\n## 八、附录（十一类）\n\n### 附录一：本品基本数据\n\n| 项 | 值 |\n|---|---|\n| 品号 | 第 7 品 |\n| 会 | 第二会（普光明殿） |\n| 卷 | 卷第十二 |\n| 所据本 | `T10n0279`（八十华严·实叉难陀译） |\n| 六十本对应 | `T09n0278` 卷四·如来名号品第三 |\n| 字数 | 3,226（CJK·含品题；正文净 3,219） |\n| 名号条数 | 211 |\n\n### 附录二：十方世界·佛号·上首菩萨\n\n见 §2.5 表。\n\n### 附录三：名号全表\n\n见 §2.7（四天下中 10）、§2.8（四天下十方 100）、§2.10（娑婆十方 101）；〔L.191 本批〕**21 列经文全文已逐列入 §2.13**·复核件 `_e7_dump.txt`／`_e7_stats.txt`。\n\n### 附录四：未竟之点（待后续批）\n\n①梵本（题名·文段）；②藏译 Toh 44（**品名·品序已明**〔T2〕，见 §6.4；**文段**逐句对勘未竟）；③单品《兜沙经》（`T10n0280`）文段对应——**已关闭**（P7 本地直证·§6.3：结构对读・同名師利 T0 印证・非逐字对应）；④慧苑《刊定记》本品之记（今传本无，待访辑）；⑤八十本娑婆西北 11 名之校勘定论（澄观校记与今本之出入；六十侧列名已逐名复验·§6.1）。\n\n### 附录四′：澄观《华严经疏》本科段全文照录\n\n〔L.191 本批·达标基线补全〕（`T1735` 卷十二末–卷十三·raw @145839–154215·CJK-only 坐标回映切片·分页符行剔除·余照原档分行排段不转写不断句·康熙部首原字形（部首码位）已归一正字（L.199）·本附录在 §二 审计区外不污引文审计·共 254 档行·11 科段）：\n\n〔按〕照录止于「通自他也」（本品疏文之末·P7 窗尾锚）；旧按语曾称「上來三品。答初十句所依果問竟」结经句在次品《四聖諦品》疏末，L.192 回源实测订正：该句实出**次次品《光明覺品第九》疏段**（`T1735` raw @167279／@167378·P8 窗口止于光明覺品品题 @157264）；《四聖諦品》疏段自然止于「如是皆為調伏眾生」（P8 附录照录尾锚·两窗起点衔接不重叠）。**〇·品题·分注**\n\n> 如來名號品第七 (此下第二修因契果生解分第二會初從此第十二經盡第十三經菩薩問明\n\n> 品\n\n**甲·五门·来意三重**\n\n> 將釋此品。五門分別。初來意者先明分來。前既舉果令生信樂。今明 能生因果信解故。次來也。二會來者。生解之中信為其首故。又前舉\n\n> 所信之境。今明能信之行。故次來也。三品來者。前品舉因顯果。成 所信之境。今舉果辨因。彰能信之行。果中三業身為其總。故先來\n\n> 也。又遠答前名號海問故\n\n**乙·释名（分·会·品）**\n\n> 二釋名亦三。初分名修因契果生解分。謂 修五位之圓因。成十身之滿果。令諸菩薩解此相故。即生修因契果之\n\n> 解。依主釋也。二會名。約處名普光明殿會。然有三釋。一以殿是寶 成光普照故。二佛於其中放普光故。三佛於殿中。說普法門慧光照\n\n> 世。故立其名。依前一義即依主釋。後二有財。約法則名信行之會。 三品名。如來現相品已釋。召體曰名表德為號。名別號通。一切諸佛\n\n> 通具十號。名釋迦等則不同故。如來即十之一。品中正說隨機就德以 立別名。既表德之名。則亦名亦號。如來之名號依主釋也\n\n**丙·宗趣（分·会·品）**\n\n> 三宗趣亦 三。初分宗。謂以修生修顯因果為宗。令諸菩薩修行契入為趣。二會\n\n> 宗者。若就總望。信解行德攝位為宗。通成佛果為趣。信能必到如來 地故。近望唯信為宗成位為趣。若依長科十分之宗。此下三品以為一\n\n> 分。即果用應機周遍法界。以為其宗。依此起信為趣故。此亦名正報 因果。亦是所信。信何法門信佛身名等於眾生。則知我名如佛名也。\n\n> 信佛法門隨宜而立。知我妄念苦集亦全法門信佛意業光明遍照。則知 自心無不知覺故。先古諸德。亦將上三品舉果分收。三品宗者。顯佛\n\n> 名號周遍為宗。隨機調化利益為趣。或上二皆宗生信為趣\n\n**丁·问答（五周·不入定·四句）**\n\n> 第四問 答。問五周因果差別平等不同。何以分名合之為一。答通生差別平等\n\n> 解故。離於修生說何修顯故。問前會舉果本為生信。今何重舉名號等 三。答凡約境生信有其二義。一標舉境法明有所在。二攝以就心令成\n\n> 信行。前會約初義。此會約後義。又前會果廣因略。故名舉果。此會 因廣果略故總攝為因。先依後正文影略耳。若約鉤鎖者。自屬正報果\n\n> 故不同第七會說所成果。此中自辯信所依故。問何不入定。以未入位 性不定故。若爾十定豈散善耶。然說法之儀通有四句。一定後說如諸\n\n> 會。二說後定如無量義經等。三定中說如第九會。無出言故。四不入 說如此信中及第七會。諸文非一。第九表證唯證能說。一得永常不礙\n\n> 起用故。第七為表常在定故。又入為受加。彼不須加故不須入說。後 入者說在行故。將起後故。是知動寂唯物聖無常規。故下文中辯十信\n\n> 之用。一方入正定餘方起出說。自在無礙也。餘會摩頂後說。此會說 後摩頂。是知此經體勢縱橫不可定準\n\n**戊·释文·总科＋序分**\n\n> 第五釋文。若隨義約品科十分 之中。此下三品。當果用應機普周分。若約隨法就會科十分之中。此\n\n> 一會當第二能信成德會。今就四番問答科。從此終第七會。即當第二 修因契果生解分。若順諸會應直分問答。今為順文一會分三。第一序\n\n> 分。第二請分。第三說分。今先序分具如經初。但加普光以為小異。 略分為三。初標主時處。二始成下別顯三事。三與十佛下。輔翼圓\n\n> 滿。二中分三。初別顯說時。二於普光下別顯說處。處在菩提場東南 可三里許熙連河曲。彼河之龍為佛造此今舉總攝別。前標國名以本收\n\n> 末。上舉場稱故。下不動覺樹而遍十方。三妙悟下別顯主德。亦即示 成正覺之相也。準第八會初及深密經等。皆說佛有二十一種功德。升\n\n> 兜率品當廣明之。今文有初十句。亦略釋耳。十句之中初總餘別。總 中妙悟皆滿者。妙悟晉經名善覺。論經名正覺。良以。梵音云蘇含於\n\n> 妙善及正等故。譯者隨取悟即覺也。雙照真俗故稱妙悟。備下諸句異 於因人。故復稱滿。別中一二行永絕者。煩惱所知生死涅槃。皆名二\n\n> 行。俱不現前名為永絕。二達無相法者。清淨真如名無相法。達者了 也。三如來常住大悲。任運利樂。又常安止聖天梵住。故云住於佛\n\n> 住。四所證。能證。及以化用皆等諸佛。五具能治道解脫障故。六所 說教法外道不能轉故。七行諸世間違順魔怨不能礙故。八安立教法超\n\n> 言念故。九於三世境若事若理。了達記別無錯謬故。具此九別成初總 句。同異成壞準思可知。第三輔翼圓滿。文分二別。一標數揀定。二\n\n> 歎其勝德前中菩薩揀非凡小。補處明非下位。他方而來非舊眾也。言 一生者。釋有二義。一約化相。謂如彌勒。此復有三。一人中一生。\n\n> 二天上一生。三下降一生。正取天中二。約實報一生。謂於四種變易 生死中。唯有末後一種。名無有生死一位所繫。此文多約化相耳。二\n\n> 普善下歎德。德雖無量略歎一。普善觀察者能觀智也。普有二義。一 普眾同有此德。二普觀十境善有三義。一善知相。二善知無相。三善\n\n> 知此二無礙。眾生界下。明其所觀。皆具上三義。十中初是總句所化 眾生。次此生何來。由迷法界起於世界。我當令彼住涅槃界淨諸業果\n\n> 故。須識心行之病文義之藥。令厭世間欣出世間。不盡有為不住無 為。上辨橫觀十法。今竪達三世觀涅槃。知已現當證觀諸業已現當造\n\n> 果報。已現當受心行已現當發餘可類知。亦以六相融之\n\n**己·请分（四十问·十句依正·引例请问）**\n\n> 第二時諸菩 薩下。請分中二。先舉人標念。後若世尊下。正顯問端。然句雖五十\n\n> 問但四十。以第二十句是說意故。此四十問。望第一會有同有異。後 二十句全同。前二十句大同小異。又復前後不同。初十句即前第三十\n\n> 海。前會即總說所觀深廣。此則別說如來依正。以前會中為總故。此 會別顯信所依故。故前會皆致海言。此中但云剎等。第二十句前名菩\n\n> 薩十海。此列住等行位。前通諸會總顯圓融行布因故。此約當分。欲 顯差別因之相故。後二十句雖則全同前總此別。又前即所信。今辨所\n\n> 成。欲顯所信所成體無異故。文句全同。若唯約義亦可分三。謂初十 句。問佛德應機無方大用。辨因所依果。次十句。問菩薩行位即果所\n\n> 成因。後二十句。佛果勝德。顯因所成果。是則以佛為緣而起於因。 還以此因而成於果。是此分之大意也。故論云。多聞熏習。無不從此\n\n> 法身流。無不還證此法身。即其義也。今取文義俱便。大分為二。初 十句直爾疑問。後三十句引例請問。義不異前然。所依所成文應互\n\n> 有。但是影略不欲繁辭故。初會直爾興問。即此中引例。此中引例即 彼直問又前但明一重所信故。合三十句果。今為分二段。故間之以\n\n> 因。今初十句先總顯請意。後開示下別列所疑。十句依正間問者。正 報應機必依剎故。亦表依正無障礙故。五句依者。一剎類。二莊嚴。\n\n> 三清淨。四體性。五成就。上五即前二海。廣如四五二品。其佛住等 五句即正報大用。一佛身遍住諸剎。佛心常住大悲。二所具功德。及\n\n> 所證法性。三隨機說法。四作用威光。五修行得證現成菩提。然此五 即前會七海。一即佛海。二即解脫海。三即演說海。四即變化海。五\n\n> 即名號。及壽量海。波羅蜜海。其眾生海但是所化故略不舉。含諸海 中。此之十句下。有言說及現相答。至下當知。第二如十方下。引例\n\n> 請問。文分為三。初十句標彼說意。明其有悲。後三十句。舉彼所說 顯其有智。末後一句結以正請。彼佛既爾。此亦宜然。初中初句總。\n\n> 謂令諸菩薩行願成就故。餘九為別。一上繼佛種。二云何繼。以救眾 生故。三云何救。令離惑故。四如何救。知彼根行故。五以何救說法\n\n> 藥故。六成何益。一除集諦染。二決道諦疑。三拔苦希望。四證滅愛 處故。又成菩薩行具悲智也。具此悲智何所為耶。令佛種不斷。佛種\n\n> 不斷有何相耶。謂成三德。救護眾生成就恩德。永斷煩惱成於斷德。 了知諸行成於智德。諸行有三。一者心行。二所行行。三所了行。謂\n\n> 一切行無常無相。即所了也。云何救護演說諸法。云何永斷淨諸雜 染。永斷煩惱種現雙亡。除諸雜染謂唯現惑。云何成智。謂永斷疑\n\n> 網。智成何益斷諸希望。惑除何益滅諸愛著。一切著者。著有著空著 行著果。不著諸法正智現前悲救眾生佛種不斷。是菩薩之要也。諸佛\n\n> 之本意也。所陳諸問。一一皆有斯益。又釋。一切菩薩是所成就。云 何成就。不斷佛種即自成就。救護眾生成就於他。云何救護。謂離二\n\n> 障永斷煩惱。無煩惱障。了知一切無所知障。以何方便能斷二障。謂 說諸法此煩惱障。其相云何。謂愛與見。除諸雜染絕愛煩惱。永斷疑\n\n> 網絕見煩惱。此所知障。其相云何。謂於境不了有所希望。法執未忘 一切生著。今相無不了何所希望。達法性空當何所著。二障既寂二智\n\n> 現前。成菩提涅槃。謂不斷佛種則菩薩成就矣。第二說諸菩薩下。舉 彼所說。文分為二。初十句問因。後二十句問果。今初文有九句。昔\n\n> 云。欠第九十忍一句。又以十信自不成位是住方便攝在住中。故不別 問。故仁王經教化品云伏忍聖胎三十人。十信十止十堅心故。信住不\n\n> 分也。有義云。有四義故信不入位。一進退不定故。二雜修十心。無 定階降故。三未隨法界修廣大行故。四未得法身。顯佛種性故。由斯\n\n> 不開十信。則成此會及第三會俱答十住問也。十行第四會答。十迴向 第五會答。十藏第四會中答。以藏有二義。一收攝義。謂收攝諸行以\n\n> 用迴向。故答在迴向之前二出生義。以出生地上證智故。問居迴向之 後。十地第六會答。十願初地中答。十定十通第七會答。各有自品。\n\n> 十頂一種答文不顯。古有多釋。一云。準梵網經。說十忍後有心地法 門。即此十頂。理亦可通。但彼經說處乃有十一。初無菩提場會。但\n\n> 云方坐千光王座及妙光堂說十世界海。其二三四。與此三四五會處法 全同。他化十地次第亦同。而化樂天說十禪定。初禪說十金剛心。二\n\n> 禪說十願。三禪說十忍。四禪摩醯首羅宮。說我本源蓮華藏世界盧舍 那佛所說心地法門。不云重會普光及祇園重閣次第。又別難可會通。\n\n> 又此中問因。後更有果問。故彼佛心地。即後如來地等。非十頂也。 有云。僧祇品答以準瓔珞等覺。別有頂位以因位窮終。今僧祇中說十\n\n> 大數。數中之極故云十頂。彼問雖十答有多數。對上定通。亦非其類 故不可也。有云。壽量品答。彼中十重佛土。皆上為下頂極。至賢首\n\n> 佛剎名為十頂。又佛名第二。名此十一世界為上首故。但舉此初後十 一。即顯過百萬阿僧祇世界壽量之數。此為標首。首即頂故。然復彼\n\n> 無別問。似有少理。但標此十界將為問端。對十地等甚不相例。今 謂。新舊梵本俱無忍問。答中即有故。知彼忍即此頂也。言十頂者。\n\n> 因位終極。十定十通皆等覺位。十忍居後。又得頂名。問中約位終 極。故名為頂。答據法門忍受。以智印定故云忍也。非位終極。不具\n\n> 十忍非有十忍。不極因位。二文更顯。故十忍品末云。通達此忍門成 就無礙智。超過一切眾轉於無上輪等。既言超過即是頂義。亦猶四善\n\n> 根中忍頂法門。義相類故。不爾忍無別問。空答何為。設欲成十應脫 十信。十信雖未成位。亦隨法界修廣大行。德用殊勝別一會答應有問\n\n> 故。若將十忍已下四品。共答頂問於理無失。俱是等覺之終極故。第 二二十句。問所成果。全同初會。於中亦初十句。明內德成滿。後十\n\n> 句體相顯著。初中如來神力。前會名佛加持。即神力加持故。神通約 外用無壅。神力約內有幹能。離世間品各有十事。其相自別。言無礙\n\n> 者。謂如來所作無能障礙也。上文名無能攝取等。義皆同也。後十中 辯才是語業。智慧是意業。最勝是身業。準前會中。唯欠佛光明之一\n\n> 句。餘如前釋。其所答文亦如前引出現不思議相海品說。但前總會故 引此文。所引之文正答今問。說者宜重引之。三願佛下結請。請同彼\n\n> 說故致亦言\n\n**庚·说分·现相答＋众海雲集＋十菩萨表法**\n\n> 請分竟。第三說分。於中通下六會。答此所問。準問長 科亦為三分。此初三品答所依果問。二問明已下。答所修因問。三從\n\n> 不思議品下。答所成果問。其平等因果。因乃果中之因。果乃此果之 用。故屬果收。初中分二。先如來現相答。由其念請故。又如來證窮\n\n> 故。後文殊言說答。伴助主故。假言顯故。今初分二。一佛現神通。 二眾海雲集。今初。知其心念者。領念請也。現神通者。示相答也。\n\n> 言隨類者。有其三義。一隨疑者所宜異故。謂或示色令見。以聲令聞 冥資令曉。皆是現通。以法界身圓明頓現也。二隨疑者流類別故。三\n\n> 隨疑者所疑異故。謂若疑十信。即見如來足輪放光周乎法界等。若疑 十住。則見如來足指放光百剎塵外菩薩集等。如放光一事既爾。餘相\n\n> 皆然。故知初會現相遍於九會。此會現通通於一分。結集隨義編之作 次耳。故下三會。皆有不起覺樹之言。第二現神通下。眾海雲集即現\n\n> 相。答初十句之問。光現佛剎答佛剎問。剎有金色等是剎莊嚴。既以 金成亦答剎體。彼剎菩薩亦剎莊嚴。菩薩大寶以為嚴故。亦剎清淨純\n\n> 淨。佛剎唯菩薩故。淨修梵行是剎成就淨土行故。亦剎清淨所修淨 故。此已上答五句依問。兼答五句正報土。各有佛及見如來坐蓮華\n\n> 藏。是答佛住。現通放光是答威德。名不動智等是答法性。見佛轉法 輪是答說法。佛成正覺是答菩提。文雖在下義皆此具。光明覺現即現\n\n> 此故。十方眾集即為十段。一一方內文各有八。一遠近。二土名。三 佛號。四上首。五眷屬。六詣佛。七到已致敬。八化座安坐。去此遠\n\n> 近皆十剎塵數者。前會為說所信因果深廣。故須遠集華藏之外十方剎 海。今為說於生解因果漸漸增修。故但集娑婆隣次之剎。信行最劣\n\n> 故。復云十。後後漸增至法界品。還集剎海。初不云一直云十者。表 無盡故。要剎塵者。比餘勝故。為有所表故。分階級非初信等。不是\n\n> 通方故。結及證成十方齊說。又隨迷名外悟處名來。而實佛土本無遠 近。土皆名色者。表信麁現故。亦表顯然可生信故。佛號同智者。有\n\n> 信無智增無明故。信中之智。本覺起故。主同名首者。梵云室利。一 名四實一首二勝。三吉祥四德。是以譯者前後不同。今通用之以信為\n\n> 首。攝諸位故。次第行中信最勝故。甚難得故。於生死中創發信心。 為吉祥故。信能增長智功德等。一切德故。此十菩薩同表信門故。皆\n\n> 名室利。各隨一門達一切法。故復有差。次文當釋。亦有傳云。梵云 室利。此云吉祥。室利云首。亦是一理。眷屬皆十剎塵者。表一一行\n\n> 攝無盡德故。皆詣佛者。有歸向故。餘如前會。又下菩薩名等。皆是 表法。菩薩表所行之行。本剎表所證之理。佛名表所得之智。今初東\n\n> 方言金色者。心性無染與緣成器。為自體故。本智如空離覺所覺。湛 然不動動即是妄。非曰智故。又縱成佛果不異凡故。即本覺智住心真\n\n> 如。菩薩妙德者。慧達佛境。處處文殊由慧揀擇。契於本智故分因 果。二覺首者。覺心性也。無性不礙隨緣。隨緣不礙無性無礙智也。\n\n> 不染而染染而不染。俱難了知為妙色也。三財首者。法財教化即滅闇 智。了眾生空如蓮不著。四寶首者。真俗無違可珍貴故。善知業果不\n\n> 犯威儀。性相無違。唯一乘旨。是為唯嗅瞻蔔華矣。五德首。了達如 來應現說法之功德故。即是明於法相。又了佛德心明白也。若有此\n\n> 智。如青蓮華最為第一。六目首。福田照導如目將身。平等福田。為 究竟智。是最可重故云金色。佛為福田以佛為境故。同上文殊依金色\n\n> 界。七精進首。正教甚深必在精進。能策萬行為最勝智。圓明可貴 故。復云寶。八法首。法門雖多必在正行。於法能行方得自在。得般\n\n> 若之堅利。為金剛色。九智首。佛之助道雖無量門。智為上首能淨萬 行。故云梵智。智淨體淨猶若玻瓈明徹無染。十賢首。前佛後佛一道\n\n> 清淨。由自性善故稱曰賢。能知此賢是觀察力。觀察本性常平等故。 又十佛相望不動是體。餘皆是用。十菩薩相望。文\n\n> 殊 為總。餘皆是\n\n> 別。以總導別故。九菩薩不離妙德。以前後流例略為此釋。惟虛己而 求之。不信此理。甚深法門於我何預。\n\n> 大方廣佛華嚴經疏卷第十二 大方廣佛華嚴經疏卷第十三\n\n> 唐清涼山大華嚴寺沙門澄觀撰\n\n**辛·随门别显·四洲十名逐释**\n\n> 第二諸佛子 下。隨門別顯。文分為三。初終此品辨身名差別。答上佛住之問近廣\n\n> 種種身等八句。以色相等皆屬身故。二四諦品。辨言教遍周。答佛所 說法問。近廣種種語業。三光明覺品。明光輪窮照。答上威德法性菩\n\n> 提三問。近廣種種觀察。其五句依報。但有現相答。廣在前會故。今 初廣上名者。然聖人無名為物立稱。若就德以立德無邊涯。若隨機立\n\n> 名等眾生界。雖復多種皆為隨宜生善滅惡見理而立。海印頓現不應生 著也。文中分四。一娑婆之內自有百億。二娑婆隣近。即百億之外。\n\n> 三類通一切。謂盡十方。四釋差別所由。由隨物故。初中分三。初此 四洲。二四洲之隣十界。三總結娑婆。今初亦三。初標處。次列名。\n\n> 後結數。他皆倣此。舉四洲者。昔云意取閻浮言總意別。餘三天下佛 不出故。然雖不出。除北俱盧餘容有往。下並準之。一切義成即悉達\n\n> 也。無事不成就故。圓滿月者。惑斷智圓恩蔭清涼故。師子吼者。名 決定說。釋迦牟尼者。釋迦云能。能仁種故。牟尼云寂默。契寂理\n\n> 故。第七仙者。七佛之末故。若取賢劫當第四仙。即喻也無欲染故。 毘盧遮那。廣如前釋。瞿曇氏者。唯約姓也。此云地主。以從劫初代\n\n> 代相承。為轉輪王故。然上云釋迦。乃是族望。此即姓望故。智論第 二云。釋迦牟尼姓瞿曇。故佛名經亦然。沙門此云息惡。無惡不息\n\n> 故。復稱大。最勝者聖中極故。德無加故。導師者。引導眾生離險難 故。於生死海示眾寶故。然名含多義。略釋此十恐文繁博。餘但隨難\n\n> 解之\n\n**壬·邻十界·总结娑婆·邻近十方（校勘段）**\n\n> 二此四天下東下。此洲之隣十界。即為十段。其善護等。皆四 洲之通稱也。今初東方斷言論者。證離言故。無能說過故。南云帝釋\n\n> 者。為天人主能稱物心故。西云水天者。水善利萬物天光淨故。北方 醫羅跋那者。具云醫濕弗羅跋那。醫濕弗。自在也。羅跋那者。聲\n\n> 也。即圓音自在耳。上云盛火者。盛火焚薪不擇林木。佛智利物無揀 賢愚。問餘聖教說。大輪圍內平布百億。上即諸天下安地獄。如何此\n\n> 說上下皆有四洲。答此教所說事隨理融。隨說法處即是當中。縱極上 際旁至大輪圍山。亦有十方互為主伴。以融為眷屬。本敷非多。十方\n\n> 界融亦準於此。因此略說娑婆融通。改非改相略有其五。一約事常 定。如小乘說。二隨心見異。若身子梵王。三就佛而言本非淨穢。四\n\n> 隨法迴轉如上主伴互為。五潛入微塵。如前會說。若通論餘淨土更有 五義。謂諸剎相入義。相即義。一具一切義。廣陜自在義。帝網重疊\n\n> 義。並如前後諸文所說。三諸佛子此娑婆下。總結娑婆。二諸佛子此 下。彰娑婆隣近十方。亦為十段。密訓唯九者。勘晉經開曉意下闕一\n\n> 聞慧。南方唯二舊經。則具。乃是新本脫漏。準前後例不應獨此便 略。西北方名有十一者。獨此有餘不成文體。此中專念法。應即是前\n\n> 所脫聞慧。亦是梵本之漏。注者誤安貝葉耳。下方云帝釋弓者。如來 念定之弓。以明利箭能射業惑阿修羅故。然舊云法命主意。取帝釋以\n\n> 法教命為天主故。今云其弓但一事耳。若作宮室字。以處取人大同晉 本。第三諸佛子如娑婆下。類通一切。準四諦品。更有舉此例餘十方\n\n> 亦如娑婆。互為主伴\n\n**癸·类通一切·释差别所由**\n\n> 第四如世尊下。釋差別所由。此有二意。一自 既由於差別名言等。而得成就。今還倣古以差別熟他。二昔菩薩時隨\n\n> 機調物。今時出世稱本立名。如昔教眾生令空妄境。今成正覺為立超 境界名。他皆倣此故而得成熟之言\n\n### 附录五：信度评级应用\n\n见 §1.5。\n\n### 附录六：计数口径\n\n见 §7.1、§7.3。\n\n### 附录七：注疏书目\n\n`T1735`（澄观疏）·`T1736`（随疏演义钞，本品另见）·`T1733`（法藏探玄记）·`T1732`（智俨搜玄记）·`X0221`（慧苑刊定记·本品记不传）·`T1739`（李通玄论）·`X0223`（李通玄合论）。\n\n### 附录八：诸家各节索引\n\n（§5）：5.1 澄观（`T1735` 卷十二末–十三）／5.2 法藏（`T1733` 卷四）／5.2′ 智俨（`T1732` 卷上）／5.2″ 慧苑（`X0221`·记不传）／5.3 李通玄（`T1739` 卷十四）／5.3′ 海云（听录·01 集·导读 09）／5.4 诸家对读小结。\n\n### 附录九：会处订正\n\n本品处「摩竭提國阿蘭若法菩提場＋普光明殿」——第一会（品1–6）处名订正参第一会诸篇（`阿兰若法菩提场`）；本品会处为「普光明殿」，与第一会「菩提场」并举，诸家判异（参 §2.1 会读）。\n\n### 附录十：版本对照表\n\n见 §6.1。\n\n### 附录十一：偈颂/长行计数\n\n本品**无偈颂**（全为长行），句末标点 121，名号列表 21 列。\n\n---\n\n## 九、台账（成篇自陈）\n\n**本批补订（L.214·2026-10-28·前三会战役第 7 批·第二会复检之一）**：①**§1.6 项 4 过期陈述订正**——「本机无藏本，不臆造」→「德格本已入库（L.200），逐字对勘未作〔待核〕」（L.206 清扫时本处漏网）；②**§6.4 新增「藏 12 开篇实测」条**——德格 035 卷 fol 175b，藏 12 以经题＋bam po 15 起，续「བཅོམ་ལྡན་འདས་ཐོག་མ…」（世尊之初），与本品开篇「世尊…始成正覺」叙事相应〔对应判读〔本文判断〕·逐字对勘未作；TOC 出 `data/alignment/tibetan-derge-toc.json` L.201 提取〕；③**经文引块复 audit**（本批自建 `_l214_audit.py`：标签行＋连续 blockquote·NFKC＋部首归一＋剥 note/app＋全半角标点统一·底本为 `T10n0279.xml` 剥校勘紧缩本）——**34 块＝31 块逐字合＋3 块节略体例**（L516/L560 已标「节引」；L422 前半逐字合〔最长前缀 124 字达南方段〕、八方位以括注自明节略），0 讹字。审计器之修亦如实录：TEI 须剥 note/app 整块、底本半角标点与引文全角须统一归一，否则伪失配（首两轮 hit=4/miss=30 皆器误，已正）。\n\n**〔已成〕**：本篇全稿成篇——§〇 凡例、§一 概述与品题解义（1.1–1.7）、§二 全文逐段细读（2.0 结构总表＋序分 3 段＋请分＋说分七段＋小结；名号二十一列全出、共 211 条）、§三 旁参与前接（3.1–3.3）、§四 义理要点与名相（4.1–4.6）、§五 注疏选要·诸家会读（5.1 澄观／5.2 法藏／5.2′ 智俨／5.2″ 慧苑／5.3 李通玄／5.3′ 海云／5.4 诸家对读小结）、§六 文本对读与校勘（6.1–6.4）、§七 结构分析·数据层（7.1–7.4）、§八 附录十一类、§九 台账，**皆已成**。\n\n〔L.191 本批·审计口径自陈〕§2 新增全引皆由 `_e7_full.py` 平文器程序化取自 `T10n0279`，`_p9_11_audit.py` 复跑覆盖 §二（0 真 miss 方收口）；编者凡例／口径两 blockquote 按 L.187 成例入 EDIT_PRE function _initArticleENMode(){

    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);

    full.querySelectorAll('blockquote').forEach(function(bq){

      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });

  _applyArticleENMode();
}
