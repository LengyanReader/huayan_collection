var ARTICLE = {"id": "rulai-minghao", "file": "articles/rulai-minghao.html", "title": "九九华严第七品 如来名号品之拼读", "title_sub": "华严经第七品·第二会首品·卷十二全篇·序请说三分·四十问·四天下十方名号（十方各十名）·娑婆百亿与娑婆十方名号·类通一切·名号二百一十一·八十与六十对读·藏译独有品〈如来华严品〉之辨·注疏诸家会读（澄观·法藏·李通玄·海云＋智俨·慧苑）·数据层·未完备已标明", "icon": "📖", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第二会_普光明殿_差别因果周/华严经细读_第七部_如来名号品.md", "doc_md": "# 九九华严第七品 如来名号品之拼读\n\n> **底本**：唐·实叉难陀译《大方广佛华严经》（八十华严）`T10n0279`。**范围：卷第十二（本品全文，品号第七）**。本品属**第二会「普光明殿会」·差别因果周（解）之始**。\n> **立稿**：2026-10-18。承第一会（品 1–6·卷 1–11）之体例与校勘纪律。\n> **本篇进度（覆盖率自陈）**：**全稿成篇**——§〇 凡例、§一 概述与品题解义、§二 全文逐段细读（序分／请分／说分三科·名号二十一品列表全出）、§三 旁参与前接、§四 义理要点与名相、§五 注疏选要·诸家会读（5.1 澄观／5.2 法藏／5.2′ 智俨／5.2″ 慧苑／5.3 李通玄／5.3′ 海云）、§六 文本对读与校勘（八十／六十／四十／藏译）、§七 结构分析·数据层、§八 附录十一类、§九 台账，**皆已成**。凡未能确证者标〔待核〕、属推断者标〔本文判断〕；**不以骨架冒充细读**。梵藏对勘、图像文物等未竟之点俱入 §八·附录四台账、§九台账。\n> **原则**：沿用既定校勘纪律、三层疏解（疏解／名相／会读）、存疑必标、推断必标「〔本文判断〕」、讲者之说疑误只标不改、三译主从分明、不擅改经文、可回源可复核。**引注疏原文一律繁体照底本、逐字回源并注经号与行号；会读按语用简体。**\n\n---\n\n## 〇、凡例（简要）\n\n一、**校勘底本**：以 `T10n0279` 为底本。六十华严（`T09n0278`）、四十华严（`T10n0293`）不作底本，但须品读并作对读；凡异译异说并列而不强断。\n二、**品读主从**：以八十华严为叙事主轴，六十为辅读与对读。主从仅指骨架取自何本，非谓其余可略。\n三、**疏解三层**：其下「疏解」为依经文直解；「名相」为训释与梵汉（凡无把握者标〔待核〕）；「会读」为注疏家与讲记等之判，非经证，凡引皆逐字回源。\n四、**引文可回源**：凡引经皆照 CBETA 底本原字形（繁体·异体），可回源可复核；凡引注疏皆注明经号与段落，无把握者标〔待核〕。**不擅改经文，亦不据听录回改底本。**\n五、**存疑必标**：凡未能确证者标〔待核〕；凡属本席推断者标「〔本文判断〕」；凡讲者之说疑误者只标不改。\n六、**文本现象与信度**：凡经文有缺文、增补、版本分合之别者，如实标识并系以文献/法义说明，给信度评级（见 §1.5）；**无从确证者只标〔疑阙〕／〔待核〕，不升级为断言**。\n七、**版本差异之惯例**：凡藏译、梵本、六十／四十华严与本品的分品、用字、文段有无、内容增减之别，**悉举而比之**，注版本与信度；**严禁以「藏译云」冒充未见之原文**。\n八、**计数口径**：字数以剥校勘之 CJK 口径计（含品题）；句数以句末标点（。！？）计；名号以「或名：」列举条目计。\n\n---\n\n## 一、概述与品题解义\n\n### 1.1 品题释义\n\n**品名**：**如来名号品**（八十华严**第七品**，唐·实叉难陀译）。全篇在《大方广佛华严经》**卷第十二**首篇。为**第二会「普光明殿会」差别因果周之始**。\n\n**「如來」**（*Tathāgata*）：佛十号之一。**「名號」**为二：**名**（*nāma*）为召体之号，「釋迦」等别称；**號**为标德之称，「如來」等十号通名。澄观「**召體曰名，表德為號。名別號通**」；李通玄「**有德即約德立名。其名可尊。稱之為號**」。\n\n**品题别释**——本品题紧接《如来现相品》已释之「如来」（参第二部 §1.1），本品所增在「名号」二字。澄观：「**如來即十之一。品中正說隨機就德以立別名。既表德之名。則亦名亦號。如來之名號依主釋也**」（`T1735`）。法藏：「**如來之名號依主釋。或如來則名號。以十號中如來為一故。於中名謂釋迦等別名。號謂十號諸佛通名**」（`T1733`）。智俨：「**名即通名。號者別號**」（`T1732`）。\n\n**李通玄之品名目**——约五缘以成佛号（`T1739`）：**一**以法界自体根本智缘（不動智佛等十智佛号）；**二**约如来示成正觉自德缘（十方诸佛共同十号，毘卢遮那为总名）；**三**明如来利生方便缘约位进修（信位不动智佛、住位月佛、行位眼佛、回向位妙佛、地位同妙）；**四**一切众生随根所乐缘（为佛、为天、为神、为主、为仁、为仙）；**五**法界体用平等缘——一切诸法总名佛号（「**一切法及名言皆是佛號故**」）。\n\n### 1.2 品位与脉络（承上启下）\n\n**在华严经三十九品中之位**：第二会（普光明殿）首品，八十华严**第七品**，占**卷第十二**。\n\n**判位**——**法藏五分**（`T1733`）：「初品是教起因緣分。二舍那品中一周問答名**舉果勸樂生信分**。三從第二會至第六會來一周問答名**修因契果生解分**。四第七會中一周問答名託法進修成行分。五第八會中一周問答名依人入證成德分。」——**本品为「修因契果生解分」之始**。\n**澄观**（`T1735`）：「**今明能生因果信解故。次來也**」；又「**前舉所信之境。今明能信之行**」。\n**李通玄**（`T1739`）：判第一会（品 1–6）为「**舉果勸修**」，第二会六品为「**以果成信**」——「信自心是佛與果佛不異故」。其长科：「從此品至賢首品，是第三長科文中。以果成信。信自己心之是佛分。」\n\n**承上启下**：\n- **承上**：第一会「所信因果周」（品1–6）明**所信之境**（举果劝修）。\n- **本品**：第二会首品，明**能信之行**——由如来名号遍周，令信者信「**自心是佛**」。\n- **启下**：次品《四圣谛品》第八明「口业说法遍周」（此品明「身业」遍应）。\n\n### 1.3 篇幅与结构预览（**本品＝卷第十二全篇**）\n\n- **本品范围**：卷第十二（`T10n0279`）。**实测 3,226 字**（CJK 剥校勘口径，含品题「如來名號品第七」7 字；**正文净 3,219 字**）；含标点 4,199 字；句末标点（。！？）121 处；独字 404〔详见 §7.1〕。\n- **结构骨架**（八十本三科）：\n  - **序分**：①世尊在摩竭提国阿兰若法菩提场·普光明殿坐（标主时处）→②妙悟皆满……普见三世（叹佛德）→③与十佛刹微尘数菩萨俱……过去现未来（叹众德）。\n  - **请分**：诸菩萨作是思惟……（念请·四十问）……愿佛世尊亦为我说。\n  - **说分**：①如来知念现神通·十方菩萨云集（文殊师利至贤首）；②文殊师利叹众希有·标不思议；③广显名号（此四天下中＋四天下十方＋娑婆百亿＋娑婆十方＋类通一切·释差别所由）。\n- **统计要点**：名号列举 **211 条**（四天下段 110 ＋ 娑婆段 101）；「或名」211 见；「如來於彼」20 见；「如是等」21 见；「名號」12 见〔详见 §7〕。\n\n### 1.4 核心要义\n\n本品要义四（详 §2、§4、§5）：\n\n1. **名号遍周·「名知名性離」**——如来以无量名号摄生，一切世间名皆佛名，「**十方世界無有一名非佛名者，名體性自解脫故**」（李通玄）。法门谓「**名即法界，法界即名**」之「一即一切」名号观〔按语〕。\n2. **信自心是佛**——第二会之旨「以果成信」：信「自己心之是佛」（李通玄）；信「我名如佛名」（澄观：「**信何法門信佛身名等於眾生。則知我名如佛名也**」）。\n3. **如来三业之身业**——正报中三业：此品**身业**遍应（名号依身而立）、四谛品**口业**普周、光明觉品**意业**遍觉（法藏、澄观、智俨三家判同）。\n4. **随名表法·不动智佛**——东方金色世界不動智佛为「**一切诸佛一切众生共有根本之智**」，「文殊师利」为「**自心妙择之慧**」；十方十世界·十智佛·十首菩萨，寄十信乃至五位进修（李通玄）。\n\n### 1.5 经文文本现象与信度标识\n\n**标识符号集**：\n\n| 标识 | 含义 | 于本品之例 |\n|------|------|------|\n| 〔缺文〕 | 经文有脱文/阙漏（据校勘或版本比勘可证） | 详见 §6 校勘（八十北西「歡喜」11名、晋本对校） |\n| 〔疑阙〕 | 疑有阙文而未确 | 六十本「西北」11名等，存而不论 |\n| 〔等〕 | 经文固有之省略代表例（非残缺） | 各名号末「……」（「如是等」前之「或名……導師……。」） |\n\n**信度评级**（沿用本项目三级来源评级）：\n\n| 级 | 判据 | 例 |\n|----|------|----|\n| T0／一手 | 原典本身（CBETA 底本） | `T10n0279` 卷十二文字 |\n| T1／原典 | 同系统译本/注疏（异译、古注原本） | 六十华严、澄观疏、法藏探玄记、李通玄论、智俨搜玄记 |\n| T2／学术 | 同行评议论著、学术论文 | 藏译编目 |\n| T3／二手 | 百科、官网、口说转述 | 法师讲记听录 |\n\n**于本品之应用（据实）**：\n- 本品**非残缺品**，篇幅短（3,226 字）；名号各「或名……（如是等）」为**经文固有之〔等〕例**（省略代表），**非残缺**。\n- 本品**六十华严有对应品**（其第 3 品「普光堂如來名號品」）；**四十华严全无**（四十华严唯译本经〈入法界品〉）——属**版本分合与译本范围之差异**〔并存〕，非「缺」（§1.6）。\n\n### 1.6 版本差异之惯例与本品之版本情况\n\n> **惯例**：凡**藏译（Toh 44）、梵本残片、六十／四十华严**之对应段与本品有别者——不论**分品、用字、文段有无、内容增减**——**悉举而比对之**，并注版本与信度。**无别者亦标「与汉本大体同」**。\n\n**本品之版本情况**（据现有一手/二手材料，对读详 §六）：\n1. **六十华严（`T09n0278`）**：**有对应品**——〈**如来名号品第三**〉（六十本第 3 品·**卷第四**；据 CBETA **繁体原字形** `T09n0278` 卷四，存 `data/references/cbeta_txt/T09n0278_juan4.txt`）。其段与八十本品**结构平行而用字、次第、数目多异**（详 §6）：\n   - **说法处异**：八十作「**摩竭提國阿蘭若法菩提場**」；六十作「**摩竭提國寂滅道場**」。\n   - **十方世界名 / 佛号 / 菩萨名异**（八十 → 六十）：金色·不動智·文殊師利（同）／妙色·無礙智·覺首 → **樂色·智火·覺首**；蓮華色·滅暗智·財首 → **華色·習智·財首**；薝蔔華色·威儀智·寶首 → 薝蔔華色·**行智**·寶首；優鉢羅華色·明相智·功德首 → **青蓮華色·明智·德首**；金字·究竟智·目首（同）；寶色·最勝智·精進首 → 寶色·**上智·進首**；金剛色·自在智·法首（同）；玻瓈色·梵智·智首（同）；平等色·觀察智·賢首 → **如實色·伏怨智·賢首**。\n   - **四天下名异**：善護（同）／難忍 → **難養**；親慧 → **佛慧**；有師子 → **師子言**；妙觀察 → **安寧**；喜樂（同）；甚堅牢 → **堅固**；妙地 → **須菩提**；焰慧 → **焰道**；持地（同）。\n   - **名号数之记异**：八十作「**其數十千**」／「百億萬種種名號」；六十作「**其數一萬**」——**数值同**（十千＝一万），**用语异**。\n   - **条数异**：详见 §6.1。\n2. **四十华严（`T10n0293`）**：**无本品**（四十华严独译〈入法界品〉），不涉及。\n3. **梵本**：题名待核〔待核〕。\n4. **藏译（Toh 44）**：**本品当藏译第 12 品**而**名同**（「如来名号品」；据二手编目〔T2·待核〕；本机无藏本，**不臆造**）。**其前一品**（藏 **11**）即**汉译全缺**之〈**如来华严品**〉（藏 `de bzhin gshegs pa rmad ga cad`；梵 *Tathāgatāvataṃsaka*；84000 英译 \"The Universal Interpenetration of the Tathāgatas\"），**位当第一会末**（辨见 §6.4）。**品序差＝＋5**：藏译「初会」当汉品 1–6 而**析为十章**（差 4），又于汉第 6／7 品之间**夹入藏 11 一独有品**（差 1）。内容「基本对应而结构位置后移」〔T2〕。\n\n### 1.7 核心要义小结\n\n本品以一「**名**」字立骨：**如来现神通集众 → 文殊叹不思议 → 广显娑婆与十方之名号遍周 → 类通法界·释随物立名**。前会（品1–6）举「**所信之境**」，本品举「**能信之行**」；其要在「**名知名性離**」与「**信自心是佛**」二义——一切世间名皆佛名，名体性自解脱，故令信者由名入实，信自己是佛。为第二会「差别因果周」十信法门之发端。\n\n---\n\n## 二、卷第十二（如来名号品第七·本品全文）\n\n> **〔经文回源〕** 以下经文一律照 `T10n0279` 卷十二底本原字形（繁体）；标点为底本所具，**不擅改**。段落划分依八十本「序分／请分／说分」三科（`T1735`／`T1733`／`T1732`／`T1739` 诸家判同），逐段以「疏解／名相／会读」三层疏之。\n\n### 2.0 结构总表（据经切分）\n\n| 序 | 段（科） | 经段 | 内容 |\n|---|---------|------|------|\n| 序一 | 标主时处 | 尔时，世尊在摩竭提国……坐莲华藏师子之座 | 处·主 |\n| 序二 | 叹佛德 | 妙悟皆满……普见三世 | 十句功德 |\n| 序三 | 叹众德 | 与十佛刹微尘数诸菩萨俱……过·现·未来 | 众圆满 |\n| 请一 | 念请·四十问 | 时，诸菩萨作是思惟……亦为我说 | 四十问 |\n| 说一 | 如来现通·十方云集 | 尔时世尊知诸菩萨心之所念……结跏趺坐 | 十方十菩萨 |\n| 说二 | 文殊叹德·标不思议 | 尔时文殊师利……皆不可思议……等法界、虚空界 | 叹众＋总标 |\n| 说三 | 四天下中名号 | 诸佛子！如来于此娑婆世界诸四天下……此四天下中……（十名） | 10 名 |\n| 说四 | 四天下十方名号 | 此四天下东……南……西……北……四维……上下（十方各十名） | 10×10 名 |\n| 说五 | 娑婆百亿总标 | 此娑婆世界有百亿四天下……有百亿万种种名号 | 总标 |\n| 说六 | 娑婆十方名号 | 此娑婆世界东……南……西……北……四维……上下（十方各十名） | 10×10 名 |\n| 说七 | 类通一切·释由 | 如娑婆世界，如是东方百千亿……亦令众生如是知见而为说法 | 类通＋释由 |\n\n> **〔口径〕** 名号举列共 **211 条**（四天下段 11 列×10＝110；娑婆段 10 列，其中「西北」11 条，计 101）。「或名」211 见；「如來於彼」20 见；「如是等」21 见（§7.2）。\n\n### 2.1 序分一：标主时处\n\n**经文**：\n\n> 爾時，世尊在摩竭提國阿蘭若法菩提場中，始成正覺，於普光明殿坐蓮華藏師子之座，\n\n**疏解**：标「**主·时·处**」。八十本作「**摩竭提國阿蘭若法菩提場**」，而「**於普光明殿坐蓮華藏師子之座**」——**会处与场（菩提场）并举**。\n\n**名相**：\n- **摩竭提國**（*Magadha*）·**阿蘭若法**（*araṇya*「闲静处」）·**菩提場**（*bodhimaṇḍa*）——成道之处。\n- **普光明殿**（*Sarvajña-prabhā* 系语境）——**第二会说法处**。法藏释「普光法堂」有五义（约事·约法·约境·约智·约实，「無礙法界一塵一行皆遍因陀羅網重重顯現故稱為普」）；澄观有三释（殿是宝成光普照故／佛于中放普光故／佛于殿中说普法门慧光照世故）；智俨：「**普者德普。光者智光**」。\n- **蓮華藏師子之座**——法藏：「**蓮華藏者信行開敷離染攝德**」。\n\n**会读**：**「二处并举」之辨**——李通玄（`T1739`）：「**敘前初得菩提處并普光明殿。意明二處不異。為不移本處道場而身遍坐一切處故。為菩提場體是法界體故。為普光明殿是法界報居所都故**」；并斥旧解「由相近故須重敘」「見佛露居龍造普光明殿」「菩提場在熙連河邊相去三里」为「**三乘之說**」（李通玄之说，一家之判，非经证）。澄观（`T1735`）则谓「**處在菩提場東南可三里許熙連河曲。彼河之龍為佛造此**」（三家里谈并存，不强断）。\n\n### 2.2 序分二：叹佛德（十句）\n\n**经文**：\n\n> 妙悟皆滿，二行永絕；達無相法，住於佛住；得佛平等，到無障處；不可轉法，所行無礙；立不思議，普見三世。\n\n**疏解**：十句叹佛德，「**初總餘別**」。**总句**「妙悟皆滿」；别句九。\n\n**名相**（据澄观 `T1735`、法藏 `T1733` 引《摄论》《佛地论》）：\n| 句 | 释 |\n|---|---|\n| 妙悟皆滿 | 总。梵音「蘇含」妙善·正等，双照真俗故妙悟，备下诸句异于因故满。 |\n| 二行永絕 | 烦恼·所知；生死·涅槃，皆名二行，俱不现前为永绝。 |\n| 達無相法 | 清净真如名无相法，达者了也。 |\n| 住於佛住 | 如来常住大悲，任运利乐；常安止圣天梵住。 |\n| 得佛平等 | 所证·能证·化用皆等诸佛。 |\n| 到無障處 | 具能治道，解脱二障。 |\n| 不可轉法 | 所说教法，外道不能转。 |\n| 所行無礙 | 行诸世间，违顺魔怨不能碍。 |\n| 立不思議 | 安立教法，超言念故。 |\n| 普見三世 | 于三世境若事若理，了达记别无错谬。 |\n\n**会读**：此法藏判为「**文同攝論受用身二十一種殊勝功德中初十句**」；澄观「**準第八會初及深密經等，皆說佛有二十一種功德……今文有初十句，亦略釋耳**」。李通玄则以「五種遍周」贯之（示成正觉遍周·依正名号遍周·定体遍周·普贤行教遍周·法界圆满遍周）。\n\n### 2.3 序分三：叹众德\n\n**经文**：\n\n> 與十佛剎微塵數諸菩薩俱，莫不皆是一生補處，悉從他方而共來集，普善觀察諸眾生界、法界、世界、涅槃界、諸業果報、心行次第、一切文義，世、出世間，有為、無為，過、現、未來。\n\n**疏解**：**简定其人**（十佛刹尘数·大菩萨·一生补处·从他方来）＋**叹其实德**（普善观察十境）。\n\n**名相**：\n- **一生補處**——澄观：「**釋有二義。一約化相**（如弥勒，人中·天上·下降一生）**。二約實報一生**（四种变易生死中唯末后一种）。此文多约化相」；法藏：「一生有三义（约人中·天上·约下生之身）」；李通玄：「皆十地菩萨故……等觉位中普贤位熟道满功终方登佛果故名一生」。\n- **普善觀察十境**——众界·法界·世界·涅槃界·业果报·心行次第·文义·世间出世間·有为无为·过现未来（「普善观察」为能观智，「普」二义·「善」三义）。\n\n**会读**：李通玄「**悉從他方而共來集者。言他方共來集簡非舊眾。皆是不來而到。不去而遍**」；又释「迷名他方。悟名曰來」。\n\n### 2.4 请分：念请·四十问\n\n**经文**：\n\n> 時，諸菩薩作是思惟：「若世尊見愍我等，願隨所樂，開示佛剎、佛住、佛剎莊嚴、佛法性、佛剎清淨、佛所說法、佛剎體性、佛威德、佛剎成就、佛大菩提。如十方一切世界諸佛世尊，為成就一切菩薩故，令如來種性不斷故，救護一切眾生故，令諸眾生永離一切煩惱故，了知一切諸行故，演說一切諸法故，淨除一切雜染故，永斷一切疑網故，拔除一切希望故，滅壞一切愛著處故，說諸菩薩十住、十行、十迴向、十藏、十地、十願、十定、十通、十頂，及說如來地、如來境界、如來神力、如來所行、如來力、如來無畏、如來三昧、如來神通、如來自在、如來無礙、如來眼、如來耳、如來鼻、如來舌、如來身、如來意、如來辯才、如來智慧、如來最勝。願佛世尊，亦為我說！」\n\n**疏解**：**念请**。文分二：初十句直尔疑问（问十事），后三十八句引例请问（令佛种不断等十句＋说菩萨十位＋说如来十九事）。\n\n**名相·问数**：经文列举「佛剎……佛大菩提」十句＋菩萨九位（十住·十行·十回向·十藏·十地·十愿·十定·十通·十顶）＋如来十九事，共三十八句。诸家计数不一：\n- **澄观**「**句雖五十問但四十**。以第二十句是說意故」。\n- **法藏**引「裕梵等法師離為一百二十四問」「合中間九十問為九問。即總四十三問」「光統師合隨喜心等為一問。即為三十四問」，自判「**總分為三。初十問因所依果。次十問果所起因。後十四問因所得果**」。\n- **智俨**「**時眾請文有四十四句**」；「**大光師但作三十三問**」〔按：先際初五問名號品答·次二四諦答·次一光覺答〕。\n- **李通玄**「**於中有三十二問**」（一初四問·四種佛剎；二十八問菩薩住地佛眼耳等）；「**如是三十二問。直至如來出現品是答**」。\n\n〔**辨**〕**问数「四十／四十三／四十四／三十四／三十二」并存，各注所据**（各家计数与归并口径之别，与第二部四十问/三十七问之辨同例）。**不据一家回改他本，亦不掩诸说。**\n\n**会读**：李通玄「**前會（品1–6）是世主問舉佛果勸修信佛所得。此會是自信自身自心是佛。及入位修行故須再問**」（重问之由）。澄观「**前會果廣因略。此會因廣果略**」。\n\n### 2.5 说分一：如来现通·十方云集\n\n**经文**：\n\n> 爾時，世尊知諸菩薩心之所念，各隨其類，為現神通。現神通已，東方過十佛剎微塵數世界，有世界，名：金色，佛號：不動智。彼世界中，有菩薩，名：文殊師利，與十佛剎微塵數諸菩薩俱，來詣佛所，到已作禮，即於東方化作蓮華藏師子之座，結跏趺坐。南方過十佛剎微塵數世界，有世界，名：妙色，佛號：無礙智。彼有菩薩，名曰：覺首……（西方蓮華色·滅暗智·財首／北方薝蔔華色·威儀智·寶首／東北方優鉢羅華色·明相智·功德首／東南方金色·究竟智·目首／西南方寶色·最勝智·精進首／西北方金剛色·自在智·法首／下方玻瓈色·梵智·智首／上方平等色·觀察智·賢首）……結跏趺坐。\n\n**疏解**：**如来现通答（示相答）**＋**十方菩萨云集**。十方各具八义（远近·土名·佛号·上首·眷属·诣佛·致敬·化座安坐）。\n\n**十方世界·佛号·上首菩萨表**（据 `T10n0279` 卷十二）：\n\n| 方 | 世界名 | 佛号 | 上首菩萨 |\n|---|---|---|---|\n| 東 | 金色 | 不動智 | 文殊師利 |\n| 南 | 妙色 | 無礙智 | 覺首 |\n| 西 | 蓮華色 | 滅暗智 | 財首 |\n| 北 | 薝蔔華色 | 威儀智 | 寶首 |\n| 東北 | 優鉢羅華色 | 明相智 | 功德首 |\n| 東南 | 金色 | 究竟智 | 目首 |\n| 西南 | 寶色 | 最勝智 | 精進首 |\n| 西北 | 金剛色 | 自在智 | 法首 |\n| 下 | 玻瓈色 | 梵智 | 智首 |\n| 上 | 平等色 | 觀察智 | 賢首 |\n\n**名相·表法**：\n- **土皆名色**——澄观「**表信麁現故。亦表顯然可生信故**」；法藏「世界同名色者表信位法相麁顯著故」。\n- **佛号同智**——「**表信中最初始覺從本覺起故**」。\n- **菩萨同名首**——梵云「**室利**」（śrī）一名四实：一「首」·二「勝」·三「吉祥」·四「德」，故译者前后不同；「**以信為首。攝諸位故**」。\n- **文殊师利**——法藏略叙五义（名义·出处·师资·位次·德用）；澄观释「**菩薩妙德者。慧達佛境**」。\n\n**会读**：李通玄（`T1739`）分十门释十方来众（举佛刹方面·远近·世界名色·佛名号·上首菩萨名·大众之数·来已致敬·随方化座·座之名字·升座而坐）；且以**卦位表法**释「东方为震卦·为春生·为初·为长男·为首·为青龙」——**此李氏之「托事表法」，一家之判，非经证**。其要：「**金色世界是自心無染之理。文殊師利是自心善簡擇妙慧**」；又「**文殊師利。是自心妙擇之慧**」；言远近「**此云十佛剎微塵數世界之外來者。明隔十無明中**」。\n\n### 2.6 说分二：文殊叹德·标不思议\n\n**经文**：\n\n> 爾時，文殊師利菩薩摩訶薩，承佛威力，普觀一切菩薩眾會而作是言：「此諸菩薩甚為希有！諸佛子！佛國土不可思議，佛住、佛剎莊嚴、佛法性、佛剎清淨、佛說法、佛出現、佛剎成就、佛阿耨多羅三藐三菩提皆不可思議。何以故？諸佛子！十方世界一切諸佛，知諸眾生樂欲不同，隨其所應，說法調伏，如是乃至等法界、虛空界。」\n\n**疏解**：**叹众希有**＋**牒问总标**（牒前所问，作**九项**，标「不可思议」）＋**徵释**（「何以故」——以诸佛知众生乐欲不同，随机说）。\n\n**名相**：\n- **「何故問佛文殊答者」**——法藏「**以即同佛慧故。吉祥妙慧達土海故**」；澄观「**何不待請敬同佛故。何不待告承佛神力**」。\n- **「何不入定」**——法藏「**以信無位故**」；澄观「**以未入位性不定故**」，并列「说法之仪通有四句（定后说／说后定／定中说／不入说）」。\n- **牒问九项之辨**——前〈请分〉问**十事**（佛剎·佛住·佛剎莊嚴·佛法性·佛剎清淨·佛所說法·佛剎體性·佛威德·佛剎成就·佛大菩提）；此处文殊牒作**九项**（佛國土·佛住·佛剎莊嚴·佛法性·佛剎清淨·佛說法·佛出現·佛剎成就·佛阿耨多羅三藐三菩提）——**开合略异**（省「佛剎體性」「佛威德」二项，增「佛出現」一项），**照底本不擅改**〔本文判断〕。\n\n**会读**：澄观（`T1735`）「**以文殊示居此土生有十徵來自他方。體含萬德降魔制外通辨難思。化滿塵方用周三際……實為三世佛母**」；李通玄（`T1739`）「**為彰信心麁故不入定說**」（十信位不说入定，十住已去方入定说）。\n\n### 2.7 说分三：四天下中名号（10 名）\n\n**经文**：\n\n> 「諸佛子！如來於此娑婆世界諸四天下，種種身、種種名、種種色相、種種修短、種種壽量、種種處所、種種諸根、種種生處、種種語業、種種觀察，令諸眾生各別知見。」\n> 「諸佛子！如來於此四天下中，或名：一切義成，或名：圓滿月，或名：師子吼，或名：釋迦牟尼，或名：第七仙，或名：毘盧遮那，或名：瞿曇氏，或名：大沙門，或名：最勝，或名：導師……。如是等，其數十千，令諸眾生各別知見。」\n\n**疏解**：**别显「种种」十句**（身·名·色相·修短·寿量·处所·诸根·生处·语业·观察）→**于「此四天下中」举十名号**（此即娑婆四天下中）。\n\n**名号（10）**：一切義成（*Sarvārthasiddha*＝悉达）／圓滿月／師子吼／釋迦牟尼（*Śākyamuni*）／第七仙／毘盧遮那（*Vairocana*）／瞿曇氏（*Gautama*）／大沙門／最勝／導師。\n\n**名相**（澄观 `T1735`）：\n- **一切義成**即悉达多，「无事不成就故」。\n- **圓滿月**「惑断智圆，恩荫清凉故」。\n- **師子吼**「名决定说」。\n- **釋迦牟尼**「釋迦云能（能仁種）·牟尼云寂默（契寂理）」。\n- **第七仙**「七佛之末故」。\n- **毘盧遮那**「廣如前釋」（光明遍照）。\n- **瞿曇氏**「唯约姓也。此云地主」。\n- **大沙門**「此云息恶。无恶不息故」。\n- **最勝**「圣中极故」。**導師**「引导众生离险难故」。\n\n### 2.8 说分四：四天下十方名号（十方各十名）\n\n**经文**（节引）：\n\n> 「諸佛子！此四天下東，次有世界，名為：善護。如來於彼，或名：金剛，或名：自在……或名：斷言論……。如是等，其數十千，令諸眾生各別知見。」\n> 「諸佛子！此四天下南，次有世界，名為：難忍。……（帝釋……最勝……）」\n> 「諸佛子！此四天下西，次有世界，名為：親慧。……（水天……善住。）」\n> 「諸佛子！此四天下北，次有世界，名：有師子。……（大牟尼……苦行得……）」\n> 「諸佛子！此四天下東北方，次有世界，名：妙觀察。……（調伏魔……難出現……）」\n> 「諸佛子！此四天下東南方，次有世界，名為：喜樂。……（極威嚴……精進力……）」\n> 「諸佛子！此四天下西南方，次有世界，名：甚堅牢。……（安住……勝須彌……）」\n> 「諸佛子！此四天下西北方，次有世界，名為：妙地。……（普遍……住本……）」\n> 「諸佛子！此四天下次下方，有世界，名為：焰慧。……（集善根……普遍勝……）」\n> 「諸佛子！此四天下次上方，有世界，名曰：持地。……（有智慧……一道……）」\n\n**疏解**：「**此洲之鄰十界**」，十方各举十名号（共 **100 名**）。\n\n**名号表**（十方各十名，据 `T10n0279` 卷十二逐字回源）：\n\n| 方 | 世界 | 十名号 |\n|---|---|---|\n| 東 | 善護 | 金剛／自在／有智慧／難勝／雲王／無諍／能為主／心歡喜／無與等／斷言論 |\n| 南 | 難忍 | 帝釋／寶稱／離垢／實語／能調伏／具足喜／大名稱／能利益／無邊／最勝 |\n| 西 | 親慧 | 水天／喜見／最勝王／調伏天／真實慧／到究竟／歡喜／法慧／所作已辦／善住 |\n| 北 | 有師子 | 大牟尼／苦行／世所尊／最勝田／一切智／善意／清淨／瑿羅跋那／最上施／苦行得 |\n| 東北 | 妙觀察 | 調伏魔／成就／息滅／賢天／離貪／勝慧／心平等／無能勝／智慧音／難出現 |\n| 東南 | 喜樂 | 極威嚴／光焰聚／遍知／祕密／解脫／性安住／如法行／淨眼王／大勇健／精進力 |\n| 西南 | 甚堅牢 | 安住／智王／圓滿／不動／妙眼／頂王／自在音／一切施／持眾仙／勝須彌 |\n| 西北 | 妙地 | 普遍／光焰／摩尼髻／可憶念／無上義／常喜樂／性清淨／圓滿光／脩臂／住本 |\n| 下 | 焰慧 | 集善根／師子相／猛利慧／金色焰／一切知識／究竟音／作利益／到究竟／真實天／普遍勝 |\n| 上 | 持地 | 有智慧／清淨面／覺慧／上首／行莊嚴／發歡喜／意成滿／如盛火／持戒／一道 |\n\n**名相**：澄观随难略释（东方「斷言論」＝证离言故·诸能说过故；南方「帝釋」＝为天人主能称物心故；西方「水天」＝水善利万物天光净故；北方「瑿羅跋那」＝具云医湿弗罗跋那，医湿弗自在也、罗跋那声也，即圆音自在）。\n\n**会读**：李通玄以**卦位、五行、方位**释十方（东为震·春·青；南为离；西为兑·金；北为坎·君·师；东北为艮·小男·童蒙——「清凉山」表文殊发初信之童蒙），并谓「**在方无方。但举其法以况其理**」。此李氏**托事表法**之说，**一家之判，非经证**。\n\n### 2.9 说分五：娑婆百亿四天下（总标）\n\n**经文**：\n\n> 「諸佛子！此娑婆世界有百億四天下，如來於中，有百億萬種種名號，令諸眾生各別知見。」\n\n**疏解**：由「四天下」总括至「娑婆世界百亿四天下」，由「十千」升为「百亿万」。\n\n### 2.10 说分六：娑婆十方名号（十方各十名）\n\n**经文**（节引）：\n\n> 「諸佛子！此娑婆世界東，次有世界，名為：密訓。……（平等／殊勝／安慰／開曉意／聞慧／真實語／得自在／最勝身／大勇猛／無等智）」\n> 「諸佛子！此娑婆世界南，次有世界，名曰：豐溢。……（本性／勤意／無上尊／大智炬／無所依／光明藏／智慧藏／福德藏／天中天／大自在）」\n> 「諸佛子！此娑婆世界西，次有世界，名為：離垢。……（意成／知道／安住本／能解縛／通達義／樂分別／最勝見／調伏行／眾苦行／具足力）」\n> 「諸佛子！此娑婆世界北，次有世界，名曰：豐樂。……（薝蔔華色／日藏／善住／現神通／性超邁／慧日／無礙／如月現／迅疾風／清淨身）」\n> 「諸佛子！此娑婆世界東北方，次有世界，名為：攝取。……（永離苦／普解脫／大伏藏／解脫智／過去藏／寶光明／離世間／無礙地／淨信藏／心不動）」\n> 「諸佛子！此娑婆世界東南方，次有世界，名為：饒益。……（現光明／盡智／美音／勝根／莊嚴蓋／精進根／到分別彼岸／勝定／簡言辭／智慧海）」\n> 「諸佛子！此娑婆世界西南方，次有世界，名為：鮮少。……（牟尼主／具眾寶／世解脫／遍知根／勝言辭／明了見／根自在／大仙師／開導業／金剛師子）」\n> 「諸佛子！此娑婆世界西北方，次有世界，名為：歡喜。……（妙華聚／栴檀蓋／蓮華藏／超越諸法／法寶／復出生／淨妙蓋／廣大眼／有善法／專念法／網藏）〔**十一名，详 §6.1 校勘**〕」\n> 「諸佛子！此娑婆世界次下方，有世界，名為：關𨷲。……（發起焰／調伏毒／帝釋弓／無常所／覺悟本／斷增長／大速疾／常樂施／分別道／摧伏幢）」\n> 「諸佛子！此娑婆世界次上方，有世界，名曰：振音。……（勇猛幢／無量寶／樂大施／天光／吉興／超境界／一切主／不退輪／離眾惡／一切智）」\n\n**疏解**：「**彰娑婆邻近十方**」，十方各举十名号（共 **101 名**，其中西北 11 名）。以「百亿万种种名号」结。\n\n**名号表**：\n\n| 方 | 世界 | 十（十一）名号 |\n|---|---|---|\n| 東 | 密訓 | 平等／殊勝／安慰／開曉意／聞慧／真實語／得自在／最勝身／大勇猛／無等智 |\n| 南 | 豐溢 | 本性／勤意／無上尊／大智炬／無所依／光明藏／智慧藏／福德藏／天中天／大自在 |\n| 西 | 離垢 | 意成／知道／安住本／能解縛／通達義／樂分別／最勝見／調伏行／眾苦行／具足力 |\n| 北 | 豐樂 | 薝蔔華色／日藏／善住／現神通／性超邁／慧日／無礙／如月現／迅疾風／清淨身 |\n| 東北 | 攝取 | 永離苦／普解脫／大伏藏／解脫智／過去藏／寶光明／離世間／無礙地／淨信藏／心不動 |\n| 東南 | 饒益 | 現光明／盡智／美音／勝根／莊嚴蓋／精進根／到分別彼岸／勝定／簡言辭／智慧海 |\n| 西南 | 鮮少 | 牟尼主／具眾寶／世解脫／遍知根／勝言辭／明了見／根自在／大仙師／開導業／金剛師子 |\n| 西北 | 歡喜 | 妙華聚／栴檀蓋／蓮華藏／超越諸法／法寶／復出生／淨妙蓋／廣大眼／有善法／專念法／**網藏**（＝11） |\n| 下 | 關𨷲 | 發起焰／調伏毒／帝釋弓／無常所／覺悟本／斷增長／大速疾／常樂施／分別道／摧伏幢 |\n| 上 | 振音 | 勇猛幢／無量寶／樂大施／天光／吉興／超境界／一切主／不退輪／離眾惡／一切智 |\n\n**名相·校勘**（澄观 `T1735`）：澄观于「彰娑婆邻近十方」下注：「**密訓唯九者。勘晉經開曉意下闕一聞慧。南方唯二舊經。則具。乃是新本脫漏。準前後例不應獨此便略。西北方名有十一者。獨此有餘不成文體。此中專念法。應即是前所脫聞慧。亦是梵本之漏。注者誤安貝葉耳**。」——**澄观据此段（八十年本对照晋本）指「西北」多一名（11）、「密训」或阙一名之校勘**〔按：八十本今本密训实十名（含闻慧）、西北实十一名；澄观所据写本与今本或有出入，**并存待核**〕〔待核〕。\n\n### 2.11 说分七：类通一切·释差别所由\n\n**经文**：\n\n> 「諸佛子！如娑婆世界，如是東方百千億無數無量，無邊無等，不可數、不可稱、不可思、不可量、不可說，盡法界、虛空界、諸世界中，如來名號，種種不同；南、西、北方，四維、上、下，亦復如是。如世尊昔為菩薩時，以種種談論、種種語言、種種音聲，種種業，種種報，種種處，種種方便、種種根，種種信解、種種地位而得成熟，亦令眾生如是知見而為說法。」\n\n**疏解**：**类通一切**（如娑婆，如是十方尽法界虚空界，如来名号种种不同）＋**释差别所由**（如来昔为菩萨时，以种种方便成熟，亦令众生如是知见而为说法）。\n\n**名相**：澄观「**釋差別所由。此有二意。一自既由於差別名言等而得成就。今還倣古以差別熟他。二昔菩薩時隨機調物。今時出世稱本立名**」——一言「称本立名」，一言「倣古熟他」。\n\n**会读**：李通玄「**如世尊已下舉世尊往因所行。今為眾說**」；又总判本品「**非但論名號遍周。但是如來身口意業總皆遍周**」。此即全品之结归——一切名皆为度生而立，随物立称，令各别知见；六十本此句作「**是皆如來為菩薩時，有因緣者為度此故，種種方便……令諸眾生知如來法**」（异译对照，详 §6.1）。\n\n### 2.12 小结\n\n本品结构：**序（主时处·叹佛德·叹众德）→请（四十问）→说（现通集众·文殊叹不思议·广显名号·类通释由）**。其骨在「**名**」——由「此四天下中」（10 名）扩至「四天下十方」（100 名），由「娑婆百亿」（总标）扩至「娑婆十方」（101 名），再「类通」尽法界虚空界，末「释由」归于随物立名。正合李通玄「**一切處普賢菩薩。一切處金色世界。一切處文殊師利。一切處不動智佛**」之「遍周」义。\n\n---\n\n## 三、旁参与前接\n\n### 3.1 前接（第一会末·含藏译独有品）\n\n**前接（第一会末）**：《毗卢遮那品》第六（卷十一）——显毗卢遮那佛果德、刹海重重无尽之相。\n**前接（藏译独有品）**：**藏译**于〈毘盧遮那品〉（藏 10）之后、本品（藏 12）之前，**别有一汉译所无之品**——〈**如来华严品**〉（藏 11；梵 *Tathāgatāvataṃsaka*），位当第一会末。故藏译由初会入二会之间，多此一品为过渡（辨见 §6.4）。\n**承接关系**：第一会（品1–6）「所信之境」→ 第二会首品（本品）「能信之行」。李通玄「**前举所信之境。今明能信之行**」。\n### 3.2 后接与同会续品\n\n**后接（第二会次品）**：《四圣谛品》第八（卷十二末–十三）——明如来「口业说法遍周」，答前「佛所说」问。\n**同会续品**：《光明觉品》第九（意业）、《菩萨问明品》第十、《净行品》第十一、《贤首品》第十二。\n\n### 3.3 旁参\n\n- **单品别译**：《佛说兜沙经》（`T10n0280`，后汉·支娄迦谶译，约 167 年）——为《华严》最早汉译之单品，「内容对应于八十华严《如来名号品》的一部分」（二手编目，T2·参 §6.4）。〔本文判断〕此可佐证本品为《华严》最古老流传之单品之一。\n- **六十本对应**：《如来名号品第三》（`T09n0278` 卷四），详 §6.1。\n\n---\n\n## 四、义理要点与名相\n\n### 4.1 「名知名性离」——名号即法界\n李通玄五缘成佛号，其第五「法界体用平等缘」：「**一切諸法及以名言自體性離故。一切法自體性離即法界性。法界性即佛號故。一切法及名言皆是佛號故**」。即名与法界不二，故名遍法界。\n\n### 4.2 「信自心是佛」——第二会之旨\n李通玄判：「**以果成信。信自己心之是佛分**」；「**直信自心分別之性。是法界性中根本不動智佛**」。澄观：「**信何法門信佛身名等於眾生。則知我名如佛名也**」。\n\n### 4.3 三业分判——身·口·意\n法藏／澄观／智俨三家同判第二会初三品为如来三业：**名号品＝身业**（法藏「**名號依身而立**」）、**四谛品＝口业**、**光明觉品＝意业**。澄观《演義鈔》（`T1736` **卷十五**）亦云：「**故先明如來三業正報。謂身語意。身是其總故先明之。應物成身隨宜立號。故受之以如來名號品。……九身語既彰。意業將顯。**」\n\n### 4.4 十世界·十智佛·十首菩萨——表十信\n李通玄：「**直信自心分別之性。是法界性中根本不動智佛。金色世界是自心無染之理。文殊師利是自心善簡擇妙慧。覺首目首等菩薩是隨信心中理智現前**」；又「**指此金色世界不動智佛。令使直認是自心能分別智本無所動**」。十方十表十信进修之胜。\n\n### 4.5 「一即一切」之名号观\n〔本文判断〕本品以「**一名 ↔ 一切名**」「**一世界 ↔ 尽法界虚空界**」之对列，成立华严「**一即一切**」于「名言」层面之展现：于四天下中十名，四天下十方各十名，娑婆十方各十名，终「类通」尽法界。**然此为义理归纳，非经中明言**；经中明言者为「随其类现」「随其所应说法调伏」「种种名号令诸众生各别知见」。\n\n### 4.6 名相表\n\n| 名相 | 训释 | 出处 |\n|---|---|---|\n| 阿蘭若法 | 闲静处法 | 八十本经 |\n| 普光明殿 | 普者德普·光者智光（智俨）；宝成光普照／放普光／说普法门（澄观） | `T1732`／`T1735` |\n| 一生補處 | 化相（人中·天上·下降）+ 实报（末后变易） | `T1735` |\n| 名／號 | 召体曰名（別·释迦等）／表德为号（通·十号） | `T1735`／`T1733`／`T1739` |\n| 室利（śrī） | 首·胜·吉祥·德 一名四实 | `T1735`／`T1733` |\n| 毘盧遮那 | 光明遍照；毘云种种·卢遮那云遍照 | `T1739` |\n| 不動智佛 | 一切诸佛一切众生共有根本之智 | `T1739` |\n\n---\n\n## 五、注疏选要（诸家会读）\n\n> **〔体例〕** 引注疏原文一律繁体照底本、逐字回源并注经号与行号；会读按语用简体。凡转述者标〔转述〕，存疑标〔待核〕、推断标〔本文判断〕。**〔四家补位〕** 本品补列法藏·澄观·李通玄·海云四家，并补智俨（`T1732`，见 §5.2′）；慧苑（`X0221`）**本品之记不传**（见 §5.2″）——故智俨·慧苑之位如实标注。\n\n### 5.1 澄观《大方广佛华严经疏》（`T1735`）——「如来名号品第七」段\n\n**来源**：唐·清凉山大华严寺沙门澄观撰《大方广佛华严经疏》**卷第十二末–卷第十三**（经首署「如來名號品第七（此下第二修因契果生解分第二會初從此第十二經盡第十三經菩薩問明品）」）。本机 `data/references/cbeta_txt/T1735_澄观_华严经疏.txt`。\n\n**判品·「将释此品，五门分别」**（*five-gate analysis*: 來意 *purpose/occasion*、釋名 *explanation of title*、宗趣 *main tenet/aim*、問答 *questions & answers*、釋文 *exposition of the text*）：\n\n**（一）来意**（三重）：\n- **分来**：「**前既舉果令生信樂。今明能生因果信解故。次來也。**」\n- **会来**：「**生解之中信為其首故。又前舉所信之境。今明能信之行。故次來也。**」\n- **品来**：「**前品舉因顯果。成所信之境。今舉果辨因。彰能信之行。果中三業身為其總。故先來也。又遠答前名號海問故。**」\n\n**（二）释名**（三节）：\n- **分名**：「修因契果生解分。謂修五位之圓因。成十身之滿果。令諸菩薩解此相故。」\n- **会名**：「約處名**普光明殿會**。然有三釋。一以殿是寶成光普照故。二佛於其中放普光故。三佛於殿中。說普法門慧光照世。故立其名……約法則名**信行之會**。」\n- **品名**：「**如來現相品已釋。召體曰名表德為號。名別號通。一切諸佛通具十號。名釋迦等則不同故。如來即十之一。品中正說隨機就德以立別名。既表德之名。則亦名亦號。如來之名號依主釋也。**」\n\n**（三）宗趣**（三节）：\n- **分宗**：「**以修生修顯因果為宗。令諸菩薩修行契入為趣。**」\n- **会宗**：「若就總望，信解行德攝位為宗，通成佛果為趣。」「近望唯信為宗成位為趣。」\n- **品宗**：「**顯佛名號周遍為宗。隨機調化利益為趣。**」——又：「**此亦名正報因果。亦是所信。信何法門信佛身名等於眾生。則知我名如佛名也。**」\n\n**（四）问答**（五周因果·重举名号之由）：「前會約初義（标举境法明有所在），此會約後義（摄以就心令成信行）；前會果廣因略故名舉果，此會因廣果略故總攝為因。」「何不入定？以未入位性不定故。……說法之儀通有四句：一定後說（如諸會）·二說後定（如無量壽經等）·三定中說（如第九會）·四不入說（如此信中及第七會）。」\n\n**（五）释文**（三科：序分·请分·说分）：\n- **序分**：「初標主時處。二始成下別顯三事。三與十佛下輔翼圓滿。」「處在菩提場東南可三里許熙連河曲。彼河之龍為佛造此」。「妙悟皆滿者……梵音云蘇含於妙善及正等故……雙照真俗故稱妙悟。」（十句逐释，参 §2.2）\n- **请分**：「**然句雖五十問但四十。以第二十句是說意故。此四十問。望第一會有同有異。後二十句全同。前二十句大同小異。**」\n- **说分**：「**先如來現相答（由其念請故）。後文殊言說答（伴助主故。假言顯故）。**」十方众集「去此遠近皆十剎塵數者……今為說於生解因果漸漸增修。故但集娑婆隣次之剎。信行最劣故」。\n- **广显名号**：「**文分為四。一娑婆之內自有百億。二娑婆隣近即百億之外。三類通一切謂盡十方。四釋差別所由由隨物故。**」名号逐释（参 §2.7–2.8）；末「**釋差別所由。此有二意。一自既由於差別名言等而得成就。今還倣古以差別熟他。二昔菩薩時隨機調物。今時出世稱本立名。**」\n\n### 5.2 法藏《大方广佛华严经探玄记》（`T1733`）——「名號品第三」段\n\n**来源**：唐·魏国西寺沙门法藏述《華嚴經探玄記》**卷第四**（「此從第二會初盡此會竟」；品题「**名號品第三**」）。本机 `data/references/cbeta_txt/T1733_法藏_探玄记.txt`。\n\n**判品·「亦作四門分別：初釋名、二來意、三宗趣、四釋文」**（*fourfold analysis*: 釋名·來意·宗趣·釋文；就六十本立论，「名號品」为六十本第三品）。\n\n**（一）释名**（三：分名·会名·品名）：\n- **分名**：「**自下明第二修因契果生解分。謂從此至第六會來。辨說所修五位之圓因成十身之滿果。**」\n- **会名**：「**名普光法堂會**。然釋有五義。一約事（佛於堂內放光普照故名普光）·二約法（真俗遐周曰普。妙智照達云光）·三約境·四唯約智·五約實（**無礙法界一塵一行。皆遍因陀羅網重重顯現。故稱為普**）。」\n- **品名**：「**如來之名號依主釋。或如來則名號。以十號中如來為一故。於中名謂釋迦等別名。號謂十號諸佛通名。又召體為名。標德為號。**」\n\n**（二）来意**（三：分来·会来·品来）：分来「**前既舉果勸生信樂。今明彼果能得之因令生正解故次來也**」；会来「**修因之中信最初故故次來也**」；品来（二释）「一云前品明依果。此明正报。正報之中不過三業。此品明身業遍應。謂名號依身而立故。四諦品明佛口業普周。光明覺品明佛意業遍覺」——**此三品＝如来三业**。\n\n**（三）宗趣**（三：分宗·会宗·品宗）：品宗「**一約相以如來身名普應廣益群生為宗。二約實以十佛國土海為宗。**」\n\n**（四）释文**（长分三：序分·请分·说分）：\n- **序分**：「相傳普光堂在菩提樹東南可三里許熙連河曲內。佛初成道諸龍見佛樹下露坐。遂為佛造此法堂」；十句德依《摄论》《佛地论》释（参 §2.2）。\n- **请分**：「裕梵等法師離為一百二十四問。……又若合中間九十問為九問。即總四十三問。光統師合隨喜心等為一問。即為三十四問。……今依此釋總分為三。初十問因所依果。次十問果所起因。後十四問因所得果。」\n- **说分**：「初此會中答前初十問前際佛法。」「**即如其像現神力者現像答也。……皆於如來法界身中無不圓明頓現其像**」。十方众「**世界同名色者表信位法相麁顯著故。佛同名智者表信中最初始覺從本覺起故。菩薩同名首者表信是因初故**」。文殊名义略叙五义（名义·出处·师资·位次·德用），「**此中十菩薩依梵本同名室利。兜沙經中亦同名師利**」。\n\n### 5.2′ 智俨《搜玄分齊通智方軌》（`T1732`）——「普光堂如來名號品第三」段\n\n**来源**：唐·终南山至相寺沙门**智俨**（华严二祖，法藏之师）《搜玄分齊通智方軌》**卷上**（品题「**第二會普光堂如來名號品第三**」）。本机 `data/references/cbeta_txt/T1732_智俨_搜玄记.txt`（PDF 抽取本，康熙部首异体字已归一，仍待二次校对〔待核〕）。\n\n**智俨就六十本（`T09n0278`）立论**：六十本第三品「普光堂如來名號品」＝八十本第七品「如来名号品」。\n\n**「有四。一释名。二来意。三宗趣。四分文释。」**（*fourfold analysis*: 釋名·來意·宗趣·分文釋）：\n- **释名**（二）：「一處名。**普者德普。光者智光**。亦可光普。二品名者。**名即通名。號者別號**。」\n- **来意**（二）：「一会来意……**前舉淨土為所信境。次辨能信心故也**。二品来意者。**前辨所依土。次土中化主人名故也**。」\n- **宗体**（二：约人·约法）：「**名號品以化悲德自在相為宗。亦可是佛國海為宗。**」\n- **释文**：就前三品正报中「**初名號明佛身業。二四諦品是佛口業。三光明覺辨佛意業**」；长分为八（举处及化主并叹佛德·明所被机·明陈所疑事·辨集新众·文殊叹化事甚深·四谛品教法甚深·光觉品许说方便·明难品正陈行仪）。\n- **请数**：「**時眾請文有四十 四句**」；「大光師但作三十三問」；「先際內初五問名號品答。次二四諦答。次一光覺答。」\n\n### 5.2″ 慧苑《續華嚴略疏刊定記》（`X0221`）——**本品之记不传**\n\n**来源**：唐·静法寺沙门慧苑述《續華嚴略疏刊定記》（`X0221`）。本机 `data/references/cbeta_txt/X0221_慧苑_续华严略疏刊定记.txt`。\n\n**按**：`X0221` 卷第四末，于第一会竟处有校记者按语：「**卍按。如來名號品及四聖諦品之記恐不傳歟。**」——即**慧苑对本品的疏记「恐不传」**（第二会名号品、四谛品之记未传世）。故本品**慧苑一家之说不存**，如实标注，**不以他品之记冒充本品**。\n\n〔**说明**〕第一会（品2–6）各篇曾补慧苑 `§5.2″`；本品因慧苑之记不传，**§5.2″ 仅为存目与说明**，此项属**客观材料限制**（非编辑遗漏）。\n\n### 5.3 李通玄《新华严经论》（`T1739`）／《华严经合论》（`X0223`）——「如来名号品第七」段\n\n**来源**：唐·长者李通玄撰《新华严经论》**卷第十四**（品题「如來名號品第七」）；《合论》**卷第二十五–二十六**（品题「佛名號品第七」／「佛名號品第七之餘」）。本机 `cbeta_txt/T1739_李通玄_新华严经论.txt`、`X0223_李通玄_华严经合论.txt`。\n\n**第二会总判**：「**第二會六品經。明菩薩信心門。於此一會之中。自有序分正說分流通分。從第十二卷初爾時已下有四行半經。是序分。已下至賢首品。是正說分。賢首品末有三行半經。是流通分。**」\n\n**长科·「以果成信」**：「**從此品至賢首品。是第三長科文中。以果成信。信自己心之是佛分。於此一段之中約有六法。以成自心佛果。**」六法：一佛名号品（信佛名号遍一切世间名知名性离）·二四圣谛品·三光明觉品·四问明品·五净行品·六贤首品。\n\n**「將釋此品略作三門。一釋品來意。二釋品名目。三隨文釋意。」**（*threefold analysis*: 來意·名目·隨文釋意）\n\n**（一）释品来意**：「**明前之初會。但明如來成等正覺之身及智攝生。未明如來名號攝生廣狹。今此第二會普光明殿。方明佛果名號攝生故。**」「**前會明身智遍周。此會明名身及智俱遍周故。**」\n\n**（二）释品名目**（五缘成佛号，参 §1.1）：一以法界自体根本智缘·二约如来示成正觉自德缘·三明如来利生方便缘约位进修·四一切众生随根所乐缘·五法界体用平等缘。其**第五**：「**一切諸法及以名言自體性離故。一切法自體性離即法界性。法界性即佛號故。一切法及名言皆是佛號故。**」其**问答「名之与号何异」**：「**有德即約德立名。其名可尊。稱之為號。……若約此經佛號。總是約法約德立名。不同世俗也。**」\n\n**（三）随文释意**（当品长科四：叹德集众分·大众请法分·如来神通现法分·举法演说分）：\n- **叹德集众分**：「意明二處不異。為不移本處道場而身遍坐一切處故。」「五種遍周」：示成正觉遍周·依正名号遍周·定体遍周·普贤行教遍周·法界圆满遍周。\n- **大众请法分**：「於中有三十二問。……一初有四問問四種佛剎。二……二十八問菩薩住地佛眼耳等。」问重之由（前会信他佛果·此会自入信修行）。\n- **如来神通现法分**：十方菩萨来众「义分为十」（举佛刹方面·远近·世界名色·佛名号·上首菩萨名·大众之数·来已致敬·随方化座·座之名字·升座而坐）。**托事表法**：东方为震卦·春生·长男·头首·青龙；又「**此第二會舉十方諸佛根本之智凡聖共有之果。即一切處金色世界一切處不動智佛十智佛等是也**」「**文殊師利。是自心妙擇之慧**」。\n- **举法演说分**：文殊说名号遍周（详见 §2.7–2.11）。\n\n### 5.3′ 会读（海云讲记）\n\n**来源**：海云继梦和上《八十华严·如来名号品》（01 集·总第 202 集·95.10.19）；及《八十华严导读》（西安草堂寺 201005）听录第 09 讲。本机 `docs/huayanhai/华严云海/浩瀚华严海/八十华严之如来名号品/无标题_1.txt`、`.../八十华严导读-西安草堂寺201005/听录/八十华严导读09_1.txt`。**（口说听录，属二手转写，措辞或有出入，凡与经不合者以经为正。）** 听录原文为**简体**，以下引海云语皆**照听录原文逐字引录（简体，不转繁体）**，以符「逐字回源」；听录标点参差（时见半角），引时依体例归一为全角，**字句不加改**。\n\n**（一）第二会之定位·文殊为会首**：\n> 「《华严经》要讲正文，正宗分，正式的开始是指从这个地方开始，这是属于第二会的部分。第一会的经文我们可以说是序言，他是在菩提树下讲的。这一会他是在普光明殿讲的……整个序言当中，他大概讲的三个部分，也就是毗卢遮那佛，文殊菩萨跟普贤菩萨。」（01 集）\n\n> 「……\"大、方、广\"这三个字，就是讲体、相、用。体，你去注意看看，就是毗卢遮那佛。相，就是普贤菩萨，用，就是文殊师利菩萨。……文殊师利菩萨，他就是无相法身。毗卢遮那佛是根本智，普贤菩萨就是后得智。」（01 集）\n\n**（二）「从能看」——本品与四谛品之对**：\n> 「……正面就从能的立场看，反面是从所的立场看。所以这一品的意思是从能的立场看，其实带着所的立场，哦。所的立场就是四圣谛品，下一品要讲的嘛。所以这一品从能的立场看嘛。你看一切境界都是如来境界，都是普贤境界。你从能去看，啊。所以你假如从能的来看的话，那就叫<如来名号品>。从所的立场来看，那，那，就叫<四圣谛品>。」（导读 09）\n\n**（三）本品之两层次结构**：\n> 「那么<如来名号品>这一品里呀，他分两个层次讲，第一个层次啊，是四天下。……一共上方、下方有十方。那第二个他是讲娑婆世界，不是四天下。第二个部份呐，此娑婆世界有百亿四天下。」（导读 09）\n\n**（四）「让心活起来」——名号之用意**：\n> 「我们所看的<如来名号品>上面所讲的能，从能去看，你不要执着。那么这个讲起来就是让我们的心怎么活起来。因为你一锁死就死啦……一活起来，如东方无量无边的名号，南西北方亦复如是，你是全方位会活起来的，这样的生命才有美感。」（导读 09）\n\n〔**对读**〕海云「从能／从所」之判，与法藏「此品明**身业**遍应·四谛品明**口业**普周·光明觉品明**意业**遍觉」之三业分判**可互参**：皆以本品为「能（身／能见）」、四谛品为「所（法／所说）」。**然二家立说角度不同，并存各注所据。**\n\n### 5.4 诸家对读小结\n\n| 项 | 澄观 `T1735`／`T1736` | 法藏 `T1733` | 智俨 `T1732` | 李通玄 `T1739` | 海云（讲记） |\n|---|---|---|---|---|---|\n| 所依本·品次 | 八十·**品第七** | 六十·**品第三** | 六十·**品第三** | 八十·**品第七** | 八十·品第七 |\n| 品名训释 | 召體曰名·表德為號；名別號通；「亦名亦號」（依主釋） | 名＝釋迦等別名·號＝十號通名；「召體為名·標德為號」 | 「名即通名·號者別號」 | 五缘成佛号；「約德立名……稱之為號」 | 「从能看」——就行者之「能」立名 |\n| 宗趣 | 顯佛名號周遍為宗·隨機調化利益為趣 | 約相＝身名普應廣益群生；約實＝十佛國土海 | 「化悲德自在相為宗，亦可是佛國海為宗」 | 以果成信·「名知名性离」 | 从能起用·「全方位会活起来」 |\n| 科判门数 | **五门**（來意·釋名·宗趣·問答·釋文） | **四门**（釋名·來意·宗趣·釋文） | **四门**（釋名·來意·宗趣·分文釋） | **三门**（來意·名目·隨文釋意） | ——（导读式两层次） |\n| 三业分判 | 「**先明如來三業正報。謂身語意。身是其總故先明之**……**九身語既彰。意業將顯**」（`T1736` 卷十五） | **此品＝身業**（名號依身而立）·四諦＝**口業**·光明覺＝**意業** | 「**初名號明佛身業**。二四諦品是佛口業。三光明覺辨佛意業」 | 「前會明身智遍周。此會明**名身及智俱遍周**」 | 本品＝「**能**」／四谛品＝「**所**」 |\n| 请数之判 | 「**句雖五十問但四十**」 | 依旧说（裕梵 124·光统 34）折为 10＋10＋14 | 「時眾請文有**四十 四句**」；大光师 33 问 | 「於中有**三十二問**」 | —— |\n| 位判·结论 | 第二会「**信行之会**」之始·正报因果 | 「信中最初始覺從本覺起」 | 「次辨能信心」 | 「信自己心之是佛」 | 第二会＝正宗分之始 |\n\n**一家之见**：五家皆以本品为第二会**首品**、为如来**正报**（三业）之发端，皆就「**名**」立说。其别有三：**① 科判之门数不同**——澄观五门最密，法藏·智俨四门，李通玄三门；**② 所依本不同**——法藏·智俨就**六十**（品第三）立论，澄观·李通玄就**八十**（品第七）立论；**③ 归趣不同**——澄观归于「名号周遍·随机调化」，李通玄归于「以果成信·信自心是佛」。然**诸家科判皆以「序分·请分·说分」为纲，品次虽异而品义不殊**〔本文判断〕。\n\n**「身业」之会归**：判本品为如来**三业**中之**身业**（名号依身而立），乃**法藏·智俨·澄观三家之共识**（`T1733`／`T1732`／`T1736` 卷十五）〔本文判断〕（参 §4.3）。海云「从能／从所」之判，与此「身·口·意（能·所）」之次第**可互参**——**然二家立说角度不同，并存各注所据**。三家之目既合，则本品「**名号周遍 ＝ 如来身业遍应**」之骨立矣。\n\n**请数不一之处理**：四十问之数，澄观「句雖五十問但四十」、智俨「四十 四句」、李通玄「三十二問」，法藏则据裕梵（124）·光统（34）旧说而折以「10＋10＋14」——**诸说并存，不强断何者为是**（依本系列「各照底本·异说并存」之例）。\n\n---\n\n## 六、文本对读与校勘\n\n### 6.1 八十华严（`T10n0279`）vs 六十华严（`T09n0278`）\n\n**对应关系**：八十本第 7 品「如来名号品」（卷十二）↔ 六十本第 3 品「如来名号品」（`T09n0278` 卷四）。**有对应品，非「缺」**。\n\n**结构平行**：六十本同具「序（佛德·众·菩萨念请）→如来现神力·十方云集→文殊叹→广显四天下与娑婆名号→类通」之骨架。\n\n**用字·内容之异（据 `T09n0278` 卷四逐字回源）**：\n\n| 项 | 八十本（`T10n0279`） | 六十本（`T09n0278`） |\n|---|---|---|\n| 说法处 | 摩竭提國**阿蘭若法菩提場**（并普光明殿） | 摩竭提國**寂滅道場**（普光法堂） |\n| 赞佛首句 | **妙悟皆滿** | **善覺智無二念** |\n| 十方世界名 | 金色／妙色／蓮華色／薝蔔華色／優鉢羅華色／金色／寶色／金剛色／玻瓈色／平等色 | 金色／**樂色**／**華色**／薝蔔華色／**青蓮華色**／金色／寶色／金剛色／玻瓈色／**如實色** |\n| 十方佛号 | 不動智／無礙智／滅暗智／威儀智／明相智／究竟智／最勝智／自在智／梵智／觀察智 | 不動智／**智火**／**習智**／**行智**／**明智**／究竟智／**上智**／自在智／梵智／**伏怨智** |\n| 十方上首 | 文殊師利／覺首／財首／寶首／**功德首**／目首／**精進首**／法首／智首／賢首 | 文殊師利／覺首／財首／寶首／**德首**／目首／**進首**／法首／智首／賢首 |\n| 四天下名 | 善護／**難忍**／**親慧**／**有師子**／**妙觀察**／喜樂／**甚堅牢**／**妙地**／**焰慧**／持地 | 善護／**難養**／**佛慧**／**師子言**／**安寧**／喜樂／**堅固**／**須菩提**／**焰道**／持地 |\n| 称数用语 | 「**其數十千**」／「百億萬種種名號」 | 「**其數一萬**」／「百億萬」（数值同·用语异） |\n| 娑婆东世界 | 密訓 | 密訓（**同**） |\n| 娑婆西北 | 歡喜（11 名） | 知足（11 名：華聚…五法藏） |\n| 娑婆东南 | 饒益（10 名） | 饒益（**11 名**：因緣…智海） |\n\n〔**辨**〕二本**同一骨架而名号异**，属**异译用字与传本之别**，**并列不强断**。其中**名号条数之异**（八十本娑婆西北 11、六十本娑婆东南 11）详见下〔校勘〕。\n\n**〔校勘·八十本娑婆西北「歡喜」十一名〕**：\n八十本「此娑婆世界西北方……名為：歡喜」下列 **11 名**（妙華聚／栴檀蓋／蓮華藏／超越諸法／法寶／復出生／淨妙蓋／廣大眼／有善法／專念法／網藏），较他列多「網藏」一名；六十本「知足」亦 11 名（華聚／栴檀蓋／蓮華藏／超越諸法／法顯／次起／善淨蓋／離垢善根／善言／專念法／五法藏）。**法藏、澄观均有校记**（澄观：「西北方名有十一者。獨此有餘不成文體。此中專念法。應即是前所脫聞慧。亦是梵本之漏。注者誤安貝葉耳」）。**本稿照底本列 11 名，不改；并存校记〔待核〕。**\n\n**〔校勘·八十本娑婆东「密訓」〕**：八十本列 10 名（平等／殊勝／安慰／開曉意／聞慧／真實語／得自在／最勝身／大勇猛／無等智）；六十本亦 10 名（平等／最勇／安慰／調意／聞慧／一切捨／自在／堅固身／大超越／無比智）。**澄观谓「密訓唯九者……闕一聞慧」，与今二本所见（皆具聞慧）不合，其所据写本或有出入〔待核〕。**\n\n### 6.2 四十华严（`T10n0293`）\n\n**无本品**。四十华严（般若译）唯译本经〈入法界品〉（相当于八十本第 39 品），本品（第 7 品）不在其范围。**不涉及对读**。\n\n### 6.3 单品别译：《佛说兜沙经》（`T10n0280`）\n\n后汉·支娄迦谶译《佛说兜沙经》一卷，为《华严》最早汉译之单品，「内容对应于八十华严《如来名号品》的一部分」（二手编目，T2〔待核〕）。**具体文段对应与异同，本机未核【待核】**；法藏《探玄记》多处引「兜沙經」（如「十飛法」「同名師利」）可为佐证。\n\n### 6.4 藏译（Toh 44）\n\n**藏译概况**（据萨尔吉《試論〈華嚴經〉的構成與流布——以梵藏文獻為中心》〔T2〕）：藏文《华严》全名 `sangs rgyas phal po che`，德格等《甘珠尔》作 **45 品**、39,030 颂；胜友（Jinamitra）·智军（Ye shes sde）译，遍照校，原本来自西域于阗；**与汉本「品目分类不一致而基本内容一致」，多出二品**。\n\n**本品之藏译位次**（二手编目〔T2·待核〕；本机无藏译本，**不臆造**）：\n\n- **对应品**：本品〈如来名号品〉当藏译**第 12 品**（名同而位移）。其**前一品**（藏 **11**）为〈**如来华严品**〉——**汉译全缺**之品；其**前前品**（藏 **10**）即汉第 6 品〈毘盧遮那品〉。**品序差＝＋5**：藏译「初会」当汉品 1–6 而**析为十章**（差 4），又于汉 6／7 之间**夹入藏 11〈如来华严品〉**一汉译所无之品（差 1）。\n- **〈如来华严品〉之辨**（藏 `de bzhin gshegs pa rmad ga cad`；梵 *Tathāgatāvataṃsaka*；84000 英译 \"The Universal Interpenetration of the Tathāgatas\"）：**位当第一会与第二会之交**，本席**判归第一会末**〔本文判断〕。三证：**①位次**紧承汉 6〈毘盧遮那品〉；**②藏传段名**——据 84000 Scholar's Room，十六世纪 Pekar Zangpo 以「`de bzhin gshegs pa rmad ga cad`」为**前十一章**段名（＝藏 1–11，含此品）；**③法义**——据二手转述，此品「**无说法，唯放光**」，述「智慧广大海毗卢遮那如来」**掌中世界海**，纯是依正果德，其格与汉第二品〈如来现相品〉同一机杼，合第一会「**举果劝乐生信分·所信因果周**」之教相；本品起方转入「**修因契果生解分**」之信解行门。**反面**：若纯以藏译章序（初会＝藏 1–10）视之，亦可读为**第二会之首**，**二说并存**；「会」本汉传判教之目，藏译本无之，故此系**比对性·法义性判断**〔本文判断〕。〔全品次对照与依据一览，详第一会《毘盧遮那品》第六部 §3.3 与《如来现相品》第二部 §6.4。〕\n- **另一独有品**：藏译多出之二品，其一即上〈如来华严品〉（藏 11）；其二〈**普贤宣说品**〉（藏 32，位汉 26 十地品后·汉 27 十定品前；**别有单行汉译**《大方广普贤所说经》`T10n0298`）。\n\n**来源**：萨尔吉（2013）〔T2〕；84000《甘珠尔》英译编目与 Scholar's Room〔T2〕；中文维基「華嚴經」条所引〔T2〕；本仓 `data/translation/gap_analysis.md` §二（Ch.11 条）与 `docs/tabs/jiaoxing.html`（藏汉品目编目，`bo:11/12`）〔T2〕。**本机无藏译本**（德格版 Toh 44 未入库），凡涉藏文原文之字句、内容细目一律〔待核〕，**不据以入正文校勘**。\n\n---\n\n## 七、结构分析·数据层\n\n### 7.1 篇幅统计（`T10n0279` 卷十二，剥校勘 CJK 口径）\n\n| 项 | 值 |\n|---|---|\n| CJK 字数（含品题） | **3,226**（含品题「如來名號品第七」7 字）；**正文净 3,219** |\n| 含标点字符数 | **4,199**（含品题）／净 4,192 |\n| 句末标点（。！？） | **121** |\n| 「。」 | 92 |\n| 独字（字种） | **404**（含品题）／净 403 |\n\n〔口径〕取 CBETA `T10n0279`，剥控制符／`<note>`／`<rdg>`／`<app>`，再剥一切标签与空白（**剥校勘 CJK 口径**；字域 `[\\u3400-\\u9fff]`）；本品范围＝品题「如來名號品第七」起，止于「亦令眾生如是知見而為說法。」**（不越入次品《四聖諦品》）**。句数以句末标点（。！？）计。**可复算**（§7.4 脚本）。\n\n**〔口径订正〕** 本稿初计作「3,223 字／独字 406／含标点 4,197」，系**切片越界**——其读数实为「本品正文净 3,219＋次品品题『四聖諦品』4 字」（独字亦含次品之「四·聖·諦」），属**越界污染读数**（与第一部 2026-10-16 所记同弊）。今按**净界**（止于本品末）重定如上：**含品题 3,226／净 3,219**。\n\n### 7.2 关键词\n\n| 词 | 见数 | 说明 |\n|---|---|---|\n| 或名 | **211** | 名号列举条目（＝名号总条数） |\n| 名號 | 12 | 本品题语 |\n| 如來於彼 | 20 | 十方各世界（20 处「如来于彼」） |\n| 如來於此 | 2 | 此四天下中·此娑婆世界 |\n| 如是等 | 21 | 各名号列末之省略结 |\n| 其數十千 | 11 | 四天下段 11 列之结 |\n| 百億萬種種名號 | 11 | 娑婆段 11 列之结 |\n| 令諸眾生各別知見 | 23 | 各列结语 |\n| 不可思議 | 2 | 「佛國土不可思議」「皆不可思議」 |\n\n### 7.3 名号分布（结构计数）\n\n| 段 | 世界数 | 名号数 | 小计 |\n|---|---|---|---|\n| 此四天下中 | 1 | 10 | 10 |\n| 四天下十方 | 10 | 10×10 | 100 |\n| 娑婆百亿（总标） | — | — | — |\n| 娑婆十方 | 10 | 10×10＋1（西北 11） | 101 |\n| **合计** | — | — // ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);
  }
}
function _applyArticleENMode(){
  var full=document.getElementById('article-full');
  var btn=document.getElementById('article-en-toggle');
  var hide=(sessionStorage.getItem('article_en_hide')||'')==='1';

}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}

</script>
</body>
</html>
