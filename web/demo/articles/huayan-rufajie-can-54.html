var ARTICLE = {"id": "huayan-rufajie-can-54", "file": "articles/huayan-rufajie-can-54.html", "title": "入法界品 · 参54·普賢（★十愿王）", "title_sub": "★十愿王 · 菩薩｜逝多林（普贤身）｜十種廣大行願 ｜ 13,544 CJK · 六层：数据卡/主页照录/三译四件套/古注取窗疏论/EN/指针", "icon": "🧭", "version": "v1.0", "meta": "", "doc": "", "doc_md": "# 参54·普賢菩薩（摄归·含十愿王） —— 入法界品·五十三参子页\n\n> **体例与来源**：底本四十华严 `T10n0293`（般若译·善财历参）；对读八十 `T10n0279`、六十 `T09n0278`（引文各照底本）。本页由程序汇编（L.491）：§一 照录自主页《华严经细读·第三十九部》§参54 全文（参题解·要点·阐释·对照启发·三译深释表·经文全引——人工核订内容·原样保留，含其中〔本文判断〕〔待核〕标注）；§二 自四件套语料库（L.421/L.456）程序汇编；数据卡自行历图数据（L.407/L.413/L.415）。**阐释性文字之性质以原文标注为准；本页不新增判断。**\n\n> ← [参53·文殊](huayan-rufajie-can-53.html) ｜ 📘 [子页总目](huayan-rufajie-can-index.html) ｜ 🗺 [行历图](huayan-rufajie-journey.html) ｜ 📄 [主页 §参54](huayan-rufajie-pin.html)\n> **古注取窗（L.493→L.499 四源）**：§三 收澄观《华严经疏》（`T1735`）·澄观《随疏演义钞》（`T1736`·末会多总谈·部分参为类聚引）·李通玄《新华严经论》（`T1739`）·法藏《探玄记》（`T1733`·残存）逐参节引（程序取窗·单调锚定·句界截断·页码留痕）。程序抽取本字准待校，引前须对 CBETA 原书核。\n\n## 〇、本参数据卡（程序汇编·L.491）\n\n| 项 | 值 |\n|---|---|\n| 参号 | 第54参（54 卡号系·L.327/L.407 重排）｜摄归\n| 善知识·四十 | **普賢**（`T10n0293`）\n| ·八十 | 普賢（`T10n0279`）\n| ·六十 | 普賢（`T09n0278`）\n| 三译名判 | 摄归·同\n| 身份 | 菩薩\n| 处所 | 逝多林（普贤身）\n| 法门自陈（「我唯得/知此」） | 十種廣大行願\n| 本参经文 | 13,544 CJK（T0293 span 283,985–299,566）\n| 前参 | 参53·文殊（法门：（遥摩顶·指归普贤））\n| 特殊标记 | ★ 十愿王\n\n## 一、主页参节全文（照录·零删改）\n\n> 🧭 **本参子页·深度解读 ↗** [参54·数据卡·主页参节照录·三译四件套·延伸指针](huayan-rufajie-can-54.html)\n\n**参题解**：普賢菩薩——善财入普贤身（一一毛孔念念出一切世界极微尘数光明云，普照除灭众生苦患）；普贤自陈不可说劫菩萨行，终说**十种广大行愿**与〈普賢行願品〉颂段。摄归第二·全经归宿。\n\n**【要点提炼】**\n\n1. **十种广大行愿**：禮敬諸佛·稱讚如來·廣修供養·懺悔業障·隨喜功德·請轉法輪·請佛住世·常隨佛學·**恒順眾生**·**普皆迴向**——每一愿皆以「虛空界盡、眾生界盡……我禮乃盡；而虛空界乃至眾生煩惱不可盡故，我此禮敬無有窮盡……念念相續，無有間斷，身語意業無有疲厭」为格式。\n2. **恒顺众生**：第九愿「恒順眾生」——愿王里唯一以众生（非佛）为对象的总愿：「言恒順眾生者：謂盡法界虛空界十方剎海所有眾生種種差別……我皆於彼隨順而化」——**行愿的地面在众生**。\n3. **普賢行願品颂**：「文殊師利勇猛智，普賢慧行亦復然，我今迴向諸善根，隨彼一切常修學……**我此普賢殊勝行，無邊勝福皆迴向，普願沈溺諸眾生，速往無量光佛剎**」——两大士并称、导归无量光：回向的终点站在此点名。\n4. **流通与献经**：经尾流通分（文殊上首六千比丘·彌勒上首贤劫菩萨·普賢上首一生补处众闻法欢喜信受奉行）之后，附**乌茶国王献经表文**（家具·如实识别）；表文称善财所参为「**五十五聖者善知識**」——参数异说（五十三／五十五）之历史佐证〔如实存目〕。\n\n**【阐释】**（〔本文判断〕）参53是全经的**总闸门**：五十三参走完的一切法门，被十愿王收进十只愿篮——礼敬收身业、称赞收口业、供养收意业、忏悔收过去、随喜收他人功德、请转请住收法运、常随收师承、恒顺收众生、普皆迴向收总。善财在普贤毛孔中「念念出光明云」所见，即〈十身相海品〉的行法版；而「速往無量光佛剎」一句把华严的归处指向弥陀净土——**华严与净土在此经尾握手**，这是四十华严最独特的贡献，也是后世「华严归净土」行门的经据。参学至此：信（文殊）已满，行（普贤）已授，善财的故事结束，读者的故事开始。\n\n**【对照/启发】**：与〈十迴向品〉十向、〈十定品〉十定对读——三品皆以十数收束：回向炼愿、等觉炼定、愿王炼行，三「十」同构。启发：十愿王宜作为全书读完后的**日课总持**——五十三参是一次性的巡礼，十愿是每天的重演：礼敬·称赞·供养·忏悔·随喜·请转·请住·随学·顺生·回向，一日一圈，即一人一华严。\n\n**本参经文全引**（T0293·13,544 CJK·0 手抄）：\n\n> 見普賢菩薩，即於金剛海藏菩提道場如來師子座前，一切寶蓮華藏座上，起等虛空界廣大心、拔一切現前執著心、集一切德無染心、淨一切剎無想心、了一切法歡喜心、觀一切境無礙心、入一切方周遍心、行一切行無障心、淨一切智境界妙行自在心、觀一切菩薩道場莊嚴清淨明了心、深入一切如來法海廣大心、調伏成熟一切眾生周遍心、淨一切佛剎無量心、了一切眾會如影心、住一切劫無盡心、究竟如來力無所畏不共佛法無退轉心。\n>\n> 善財童子起如是心，以自善根所潤澤故；一切如來加被力故；普賢同分善根力故；欲見普賢，有十種瑞相。何等為十？\n>\n> 一者、見一切佛剎清淨，一切如來道場莊嚴；\n>\n> 二者、見一切佛剎清淨，無諸惡道一切雜類；\n>\n> 三者、見一切佛剎清淨，眾妙蓮華以為莊嚴；四者、見一切佛剎清淨，一切眾生身心清涼；五者、見一切佛剎清淨，眾寶為體，形色莊嚴；六者、見一切佛剎清淨，一切眾生種種形色相好嚴身；七者、見一切佛剎清淨，諸莊嚴雲普覆其上；八者、見一切佛剎清淨，一切眾生互起慈心遞相利益；\n>\n> 九者、見一切佛剎清淨，菩提道場形體莊嚴；十者、見一切佛剎清淨，一切眾生心常隨順憶念諸佛；是為十。又見十種大光明相，何等為十？\n>\n> 一者、見一切世界所有極微一一塵中，出一切世界極微塵數如來光網雲，周遍照耀；\n>\n> 二者、見一一塵中，出一切世界極微塵數如來圓光輪雲，無量無數，種種色相，周遍法界；\n>\n> 三者、見一一塵中，出一切世界極微塵數種種如來寶影像雲，周遍法界；四者、見一一塵中，出一切世界極微塵數種種如來光焰輪雲，周遍法界；五者、見一一塵中，出一切世界極微塵數種種妙香、塗香、燒香、華鬘等雲，周遍十方一切法界，出大音聲，稱讚普賢一切行願大功德海；\n>\n> 六者、見一一塵中，出一切世界極微塵數種種日月、星宿、光明雲，皆放普賢菩薩光明，遍滿法界；七者、見一一塵中，出一切世界極微塵數種種眾生形像燈雲，猶如佛光，遍照法界；八者、見一一塵中，出一切世界極微塵數種種如來身影像摩尼寶雲，周遍法界；\n>\n> 九者、見一一塵中，出一切世界極微塵數種種如來影像光明身雲，如大雲雨，普說一切如來大願，及威德力；十者、見一一塵中，出一切世界極微塵數種種菩薩圓滿光明影像身雲，隨諸眾生種種變化，普令一切皆生愛樂，如是所作，周遍法界；是為十。\n>\n> 爾時，善財童子見此十種光明相已，即作是念：「我今必見普賢菩薩。」於時，善財住自善根普光照力，住諸如來所護念力；能生佛法普智光明，於普賢行現前照了；於普賢願深入無際；於一切如來境界深心信解；於諸菩薩廣大境界得決定力，修集得見普賢之想，深入如來一切種智，普攝諸根令其寂靜，起大精進無有退轉，身心普現十方世界；\n>\n> 即以普眼觀察十方一切諸佛、菩薩眾會諸莊嚴具；一切境界，皆作得見普賢之想；以智慧眼，觀察普賢從初發心所行之道，其心廣大猶如虛空，大悲堅固猶若金剛，威德加持盡未來際，願不捨離普賢菩薩，以平等心行普賢行，念念隨順清淨自在，常得安住如來境界，成就普賢種種智地。\n>\n> 善財童子具足圓滿，如是觀已；即見普賢菩薩在於毘盧遮那如來、應、正等覺前，坐蓮華藏師子之座，諸菩薩眾所共圍遶；身相殊特，世無與等，智慧功德種種境界不可思議；一切菩薩微細觀察，無有邊際，與諸如來平等無二。善財童子見普賢身一一毛孔，念念中出一切世界極微塵數種種光明雲，遍法界、虛空界、一切世界，普光照耀，除滅一切眾生苦患；\n>\n> 見一一毛孔，念念中出一切佛剎極微塵數種種色圓光雲，令一切菩薩速疾增長廣大歡喜；見普賢菩薩頂及兩肩一一毛孔，念念中出一切佛剎極微塵數種種色香焰雲，遍法界、虛空界、一切諸佛眾會道場，雨大香雨而以普熏；見一一毛孔，念念中出一切佛剎極微塵數種種華雲，遍法界、虛空界、一切如來眾會道場，雨眾妙華；\n>\n> 見一一毛孔，念念中出一切佛剎極微塵數種種莊嚴香樹雲，遍法界、虛空界、一切如來眾會道場，雨於無盡塗香、末香、眾妙香藏；見一一毛孔，念念中出一切佛剎極微塵數種種衣服雲，遍法界、虛空界，雨眾妙衣，普覆莊嚴；見一一毛孔，念念中出一切佛剎極微塵數種種繒綵雲、種種雜寶瓔珞雲、種種如意寶雲，遍法界、虛空界、一切如來眾會道場，普雨一切瓔珞繒綵，令一切眾生成就愛樂；\n>\n> 見一一毛孔，念念中出一切佛剎極微塵數種種寶樹雲，遍法界、虛空界，復從一切寶樹藏中，流散一切星宿光雲，種種莊嚴，於一切如來眾會道場，雨諸妙寶；見一一毛孔，念念中出一切佛剎極微塵數種種色界天眾身雲，遍法界、虛空界，歎菩提心；\n>\n> 見一一毛孔，念念中出一切佛剎極微塵數種種梵天眷屬身雲，請諸如來轉妙法輪；見一一毛孔，念念中出一切佛剎極微塵數欲界天眾身雲，守護受持一切如來所說妙法；見一一毛孔，念念中出一切佛剎極微塵數三世一切諸佛剎雲，遍法界、虛空界，與諸眾生無依止者而作依止，無覆護者而作覆護，無歸趣者而作歸趣；\n>\n> 見一一毛孔，念念中出一切佛剎極微塵數清淨佛剎雲，遍法界、虛空界，一切諸佛於中出現，菩薩眾會清淨道場，令一切眾生愛敬信樂，皆得清淨；見一一毛孔，念念中出一切佛剎極微塵數淨、不淨佛剎雲，遍法界、虛空界，令雜染眾生皆得清淨；見一一毛孔，念念中出一切佛剎極微塵數不淨、淨佛剎雲，遍法界、虛空界，令純染眾生皆得清淨；\n>\n> 見一一毛孔，念念中出一切佛剎極微塵數眾生身雲，遍法界、虛空界，隨應教化一切眾生，令於阿耨多羅三藐三菩提而得成熟；見一一毛孔，念念中出一切佛剎極微塵數種種菩薩身雲，遍法界、虛空界，稱揚種種諸佛名號，令諸眾生增長善根；見一一毛孔，念念中出一切佛剎極微塵數種種菩薩身雲，遍法界、虛空界，宣揚顯示諸佛菩薩從初發意嚴淨佛剎所生善根；\n>\n> 見一一毛孔，念念中出一切佛剎極微塵數種種菩薩身雲，遍法界、虛空界一切佛剎，一一剎中為欲清淨普賢妙行，宣揚一切菩薩願海；見一一毛孔，念念中出一切佛剎極微塵數普賢菩薩行雲，令一切眾生愛樂修習，速得圓滿一切智體；見一一毛孔，念念中出一切佛剎極微塵數正覺身雲，於一切佛剎現成正覺，顯示種智，令諸菩薩普集大法，速疾增長，現前覺悟。\n>\n> 大方廣佛華嚴經卷\n>\n> 第三十八大方廣佛華嚴經大方廣佛華嚴經卷\n>\n> 第三十九罽賓國三藏般若奉詔譯入不思議解脫境界普賢行願品爾時，善財童子見普賢菩薩如是自在神通境界，歡喜踊躍，普遍身心。重復觀察，見普賢菩薩一一身分、一一肢節、一一毛孔，悉有三千大千世界；其中一切地、水、火、風大海四洲，須彌鐵圍及眾寶山國土、城邑、宮殿、園苑，乃至地獄、餓鬼、畜生、閻羅王界，天龍八部，人與非人，欲界、色界、無色界處所有形色，日月星宿，風、雲、雷、電，晝夜、月時及以年劫，諸佛出世，菩薩眾會，道場莊嚴，如是等事，悉皆明見。\n>\n> 如見此世界盡於東方，種種世界亦復如是。如東方，南、西、北方，四維，上、下，亦復如是。如見現在十方世界，盡過去際，盡未來際，種種世界相續不斷，亦如是見。各各差別，互相涉入，不相雜亂。如於此毘盧遮那如來寶蓮華藏師子座上，顯示如是遊戲神通；\n>\n> 於東方蓮華吉祥世界賢吉祥如來所，顯示一切遊戲神通，亦復如是。如賢吉祥如來所，如是盡於東方，南、西、北方，四維，上、下，一切世界亦復如是。如是十方一切佛剎一一塵中，皆有法界諸佛眾會，一一佛所皆有普賢坐寶蓮華師子之座，顯示一切遊戲神通，悉亦如是。\n>\n> 又於彼一一普賢身中皆見三世一切境界，猶如明鏡現其影像；所謂：一切佛剎、一切資具、一切眾生、一切佛出興、一切菩薩道場眾會；又聞一切眾生種種音聲、一切佛聲、一切如來轉法輪聲、一切如來遊戲神通聲、一切菩薩善誘誨聲；一切菩薩神通境界、菩薩智通、菩薩普集、菩薩說法、菩薩遊戲如是等聲。\n>\n> 爾時，善財童子見聞普賢菩薩如是無量不可思議遊戲神通，即得十種智波羅蜜；何等為十？\n>\n> 一者、於念念中令身遍滿一切佛剎智波羅蜜；\n>\n> 二者、於念念中悉能往詣一切佛所智波羅蜜；\n>\n> 三者、於念念中悉能供養一切如來智波羅蜜；四者、於念念中普於一切諸如來所聞法受持智波羅蜜；五者、於念念中微細觀察一切如來所有法輪智波羅蜜；六者、於念念中知一切佛不可思議大神通事智波羅蜜；七者、於念念中說一句法盡未來際辯才無盡智波羅蜜；\n>\n> 八者、於念念中智海現前觀一切法智波羅蜜；九者、於念念中得一切法界教海智波羅蜜；十者、於念念中得知一切眾生離眾生想智波羅蜜；十一、於念念中普賢慧行皆現在前智波羅蜜。善財童子既得是已，普賢菩薩即伸右手摩善財頂，善財即得深入一切佛剎極微塵數諸大三昧。\n>\n> 各以一切佛剎極微塵數三昧而為眷屬；一一三昧悉得一切昔所未見、昔所未聞一切佛剎極微塵數種種世界海諸佛大會，增長一切佛剎極微塵數一切智助道具，出現一切佛剎極微塵數一切智法門，成就一切佛剎極微塵數初發一切智心，深入一切佛剎極微塵數一切智大願海，出生一切佛剎極微塵數一切智出要道，修習一切佛剎極微塵數一切智菩薩行，圓滿一切佛剎極微塵數一切智速疾力，得一切佛剎極微塵數一切智普光照；\n>\n> 如此娑婆世界毘盧遮那佛所，普賢菩薩摩善財頂所獲法門，如是十方所有世界，及彼世界一一塵中、一切世界、一切佛所，普賢菩薩悉亦如是摩善財頂所得法門，亦皆同等。爾時，普賢菩薩摩訶薩告善財言：「善男子！汝見我此神通力不？」善財白言：「聖者！\n>\n> 唯然已見。此不思議大神通事，得佛智慧方能知之。」普賢菩薩告善財言：「善男子！我於不可說不可說劫行菩薩行，求一切智；一一劫中為欲清淨菩提心故，承事不可說不可說如來；一一劫中為集一切智福德具故，設不可說不可說佛剎極微塵數廣大施會，一切世間最勝無比，悉皆迴向一切眾生；\n>\n> 一一劫中為求一切智法故，以不可說不可說佛剎極微塵數財物而為大捨；一一劫中為求佛智故，以不可說不可說佛剎極微塵數國土、王位、村營、城邑、聚落、宮殿、妻子、眷屬，身分肢節、眼、耳、鼻、舌，乃至身命而為布施；一一劫中為求一切智首故，以不可說不可說佛剎極微塵數頭而為布施；\n>\n> 一一劫中為求一切智故，於不可說不可說佛剎極微塵數諸如來所，恭敬尊重，承事供養上妙衣服、臥具、醫藥，一切所須悉皆奉施，於其法中出家學道，受持法教，隨順修行。「善男子！我於爾所大劫海中，自憶未曾於一念間不順佛教；爾所劫中，未曾一念生瞋害心，我、我所心，自他差別心，未曾一念離菩提心，於生死中起疲厭心，生下劣心，懷嬾惰心，有障礙心，起迷惑心；\n>\n> 唯住無上不可沮壞一切智性大菩提心。善男子！我普嚴淨一切佛土，我以大悲救護眾生，教化成熟令其清淨；我供養承事一切諸佛、諸善知識，於彼諸佛、善知識所，為求正法，弘宣護持，一切內外悉皆能捨，乃至身命亦無所吝；如是無量相應圓滿所行之行，一切劫海說其因緣，劫海可盡，此不可盡。\n>\n> 善男子！我法海中無有一文一句非是捨施轉輪王位而求得者，非是悉捨一切所有而求得者。善男子！我所求法，皆為救護一切眾生，念念相續，微細觀察，令最勝法速得現前；願以智光照明開示一切世間，願為顯示出世間智，願令眾生悉得安樂，願普稱讚一切如來所有功德；\n>\n> 我如是等往昔圓滿相應行門，於不可說不可說佛剎極微塵數劫海說不可盡。是故，善男子！我以如是積集助道法力、增長諸善根力、廣大極深信力、修行諸功德力、如實觀察一切法力、成就一切智慧眼力、為諸如來所加持力、種種大願所引起力、無邊大悲不可動力、悉能清淨妙智通力、種種善友所攝受力；\n>\n> 由此等故，得此究竟三世平等清淨法身，及得無上清淨色身，超諸世間，而隨眾生種種心樂，普為現形；入一切剎、遍一切處，普能隨順示現神通，令諸眾生靡不欣樂。「善男子！汝見我此圓滿廣大威德身不？汝應微細思惟觀察。善男子！我此妙身無邊劫海之所成就，無量百千億那由他劫難得出現、難得覩見。\n>\n> 善男子！若有眾生未種善根及少善根，猶尚不得聞我名字，況見我身？善男子！若有眾生得聞我名，皆於阿耨多羅三藐三菩提得不退轉；若見、若念，若迎、若送，若暫隨逐，乃至夢中，皆亦如是。或有眾生一日一夜憶念於我，隨順修行而得成熟；或七日、七夜、半月、一月、半年、一年、百年、千年、一劫、百劫，乃至不可說不可說佛剎極微塵數劫，憶念於我而成熟者；\n>\n> 或一生、或百生、乃至不可說不可說佛剎極微塵數生，憶念於我而成熟者；或見我圓光、或見放光、或見色身、或見神通震動佛剎、或生恐怖、或生歡喜，皆得成熟。善男子！我以如是等佛剎極微塵數諸方便門，令諸眾生於阿耨多羅三藐三菩提得不退轉。\n>\n> 「\n>\n> 復次，善男子！若有眾生見聞於我清淨剎者，必得生我清淨剎中；若有眾生見聞於我清淨身者，必得生我清淨身中。善男子！汝應觀我此大威德清淨之身。」爾時，善財童子微細觀察普賢之身，見一一毛孔中有不可說不可說諸佛剎海；一一剎海皆有諸佛出興於世，遍滿其中，大菩薩眾海會圍遶；\n>\n> 彼諸剎海種種建立、種種形狀、種種莊嚴、種種大山周匝圍遶、種種色雲彌覆其上、種種佛出興、種種演說法，如是等事各各不同。如一毛孔，一切毛孔中、一一相中、一一好中、一一肢節中，皆亦如是。又見普賢菩薩於一一世界海中出一切佛剎極微塵數佛變化身雲，周遍十方一切世界，教化眾生，令於阿耨多羅三藐三菩提而得成熟。\n>\n> 時，善財童子隨順普賢善誘誨故，入普賢身及毛孔內十方一切諸世界中，教化眾生。\n>\n> 復次，善財童子所見佛剎極微塵數諸善知識，往詣親近，承事供養，積集增長一切善根，智慧光明，比此暫見普賢菩薩所得善根，百分不及一，千分不及一，百千分不及一，百千億分、數分、算分、諭分、優波尼沙陀分，亦不及一。善財童子從初發心乃至得見普賢菩薩，於其中間所入剎海，相續不斷；\n>\n> 今於普賢菩薩一毛孔中，一念所入諸佛剎海相續不斷，過前不可說不可說倍，如一毛孔，一切毛孔，悉亦如是。善財童子於普賢菩薩毛孔剎中行一步，過不可說不可說佛剎極微塵數世界，如是而行，盡未來際劫猶不能知一毛孔中種種剎海相續、剎海藏、剎海差別、剎海出生門、剎海成、剎海壞、剎海莊嚴所有邊際；\n>\n> 亦不能知佛海出現相續、佛海出現藏、佛海差別、佛海出生門、佛海生、佛海滅所有邊際；亦不能知菩薩眾會道場海相續、菩薩眾海藏、菩薩眾海差別、菩薩眾海出生門、菩薩眾海集、菩薩眾海散所有邊際；亦不能知入眾生界，知眾生根，教化調伏諸眾生界，覺悟成熟諸眾生智，菩薩所住自在神通、菩薩所入諸地諸道；\n>\n> 如是等海，皆悉不知究竟邊際。善財童子於普賢毛孔剎中，或有剎中一日而行，或有剎中一年而行，乃至不可說不可說佛剎極微塵數劫，如是而行；不動不出，念念周遍無邊剎海，教化調伏一切眾生，令向阿耨多羅三藐三菩提。當是之時，善財童子則次第得普賢菩薩諸行願海，皆悉平等；\n>\n> 與普賢等、與諸佛等、一身充滿一切世界等、諸行圓滿等、正覺現前等、神通大用等、種種法輪等、清淨辯才等、出生言辭等、種種音聲等、諸力無畏等、種種佛住等、大慈大悲等；如是乃至不可思議解脫自在悉皆同等。爾時，普賢菩薩摩訶薩觀察一切菩薩眾會及善財童子，而說偈言：「汝等應離諸疑垢，一心不亂而諦聽，我說如來滿諸度，一切解脫真實道。\n>\n> 出世調柔勝丈夫，其心清淨如虛空，常放智日大光明，普照世間除惑暗。如來難可得見聞，無量億劫今乃遇，如優曇華時一現，是故應聽佛功德。隨順世間諸所作，譬如幻士現眾業，但為悅可眾生心，未曾一念生分別。」爾時，一切菩薩聞此說已，一心渴仰發大誓願，欲聞如來真實義諦所有功德，咸作是念：「普賢菩薩諸行已圓，體性清淨，如說能行，如行而說，一切如來共所稱讚。\n>\n> 」作是念已，深生渴仰。爾時，普賢菩薩圓滿種種功德，智慧莊嚴，身心猶如蓮華，不著三界一切塵垢，告諸菩薩言：「汝等皆當一心諦聽，我今欲說佛功德海一滴之相。」即說偈言：「佛智廣大同虛空，普遍一切眾生心，了世妄想皆非有，不起種種異分別。\n>\n> 一念悉知三世法，亦了一切眾生根，譬如善巧大幻師，念念示現無邊量。隨諸眾生心行異，往昔諸業願樂力，令其所見各不同，而佛寂然無動念。或有處處見佛坐，充滿十方諸世界，或有其心不清淨，無量劫中不見佛，或有信解心無我，一念發意見如來，或有諂誑不淨心，億劫專求莫能遇，或一切處聞佛音，其音美妙令心悅，或有百千萬億劫，心不淨故不得聞，或見清淨大菩薩，充滿三千大千界，皆已具足普賢行，如來於中儼然坐。\n>\n> 或見此界妙無比，佛無量劫所嚴淨，毘盧遮那最勝尊，於中覺悟成菩提。或見蓮華勝妙剎，賢首如來住在中，無量菩薩眾圍遶，皆悉勤修普賢行。或有見佛無量壽，觀自在等共圍遶，悉已住於灌頂地，遍滿十方無量土。或有見此三千界，猶如妙喜具莊嚴，阿閦如來住在中，及如香象諸菩薩。\n>\n> 或見月覺大名稱，金剛幢等菩薩俱，住如圓鏡妙莊嚴，普遍十方清淨剎。或見日藏世所尊，住普光明清淨土，與得灌頂諸菩薩，充滿十方而說法。或見金剛大焰佛，與智幢等菩薩俱，周行一切廣大剎，說法除滅眾生闇。一一毛端不可說，諸佛具相三十二，菩薩眾會共圍遶，種種說法度眾生。\n>\n> 或見一一佛毛孔，具足莊嚴廣大剎，無量諸佛住其中，清淨佛子皆充滿。或見十方平等剎，而全在一極微中，無量菩薩悉充滿，不可說劫修諸行。或有見一毛端處，無量極微塵剎海，種種業起各差別，毘盧遮那轉法輪。或有世界不清淨，或清淨剎眾寶成，如來住壽無量時，乃至涅槃諸所現。\n>\n> 普盡十方諸世界，種種示現不思議，隨諸眾生心智殊，靡不化度令清淨。如是無上大調御，充滿十方國土中，示現種種神通力，我說少分汝當聽。或見釋迦成佛道，已經不可思議劫，或見今始為菩薩，十方利益諸群生，或有見此釋師子，供養諸佛修行道，或見人中最勝尊，顯示種種神通事，或見布施或持戒，或忍或進或諸禪，般若方便願力智，隨眾生心皆示現。\n>\n> 或見究竟波羅蜜，或見安住於諸地，總持三昧神通智，如是悉現盡無餘。或現修行無量劫，住於菩薩堪忍位，或見住於不退地，或現法水灌其頂，或現梵釋護世身，或現剎利婆羅門，種種色相所莊嚴，猶如幻師現眾像。或現兜率始降神，或見宮中受嬪御，或見棄捨諸榮樂，出離王宮行學道，或見始生或見滅，或示出家學異行，或見坐於菩提樹，摧伏魔軍成正覺，或有見佛始涅槃，或見起塔遍世間，或見塔中立影像，或隨眾生現身色，或見如來無量壽，與諸菩薩授尊記，而成真實大導師，次補住於安樂剎。\n>\n> 或見無量億千劫，作佛事已入涅槃，或見今始成菩提，或見正修諸妙行，或見如來清淨月，在於梵世及魔宮，自在天宮化樂宮，示現種種諸神變。或見在於兜率宮，無量諸天共圍遶，為彼說法令歡喜，一切淨心供養佛。或見住在夜摩天，忉利護世龍神處，如是一切諸宮殿，莫不於中現其像。\n>\n> 或於然燈世尊所，散華布髮為供養，從是了知深妙法，恒以此道化群生。或見久遠已涅槃，或見初始成菩提，或見住於無量劫，或見須臾即滅度，身相光明與壽命，智慧菩提及涅槃，眾會所化威儀聲，如是一一皆無量。或現其身極廣大，譬如須彌大寶山，或見跏趺不動搖，充滿無邊諸世界，或見圓光一尋量，或見千萬億由旬，或照無量國土中，或見充滿一切剎，或見佛壽八十年，或壽百千萬億歲，或住不可思議劫，如是展轉倍過是。\n>\n> 佛智通達淨無礙，剎那普了三世法，皆從心識因緣現，生滅無常無自性。於一剎中成正覺，一切剎處悉亦然，一切入一一亦爾，隨眾生心而示現。如來安住無上道，成就十力四無畏，圓滿智慧無障礙，轉於十二行法輪。普知苦集及滅道，微細分別緣起法，法義樂說辭無礙，因此無畏廣宣揚。\n>\n> 諸法無我無有相，業性不起亦不失，一切遠離如虛空，佛以方便能分別。如來如是轉法輪，普震十方諸國土，宮殿山河悉搖動，不使眾生有驚怖。如來普演廣大音，隨其根欲皆令解，悉使發心除惑垢，而佛未始生心念。或聞施戒忍精進，禪定般若方便智，或聞慈悲及喜捨，種種言辭差別聲，或聞四念四正勤，神足根力覺支道，諸念神通止觀等，無量方便諸法門。\n>\n> 龍神八部人非人，梵釋護世諸天眾，佛以一音為說法，隨其品類皆令解。或有貪欲瞋恚癡，忿覆慳嫉及憍諂，八萬四千煩惱異，令其聞說對治門。若白淨法未修治，令其聞說十學處，已能布施調伏者，令聞寂滅涅槃音。若人志劣無慈愍，厭惡生死自求離，令其聞說三脫門，使得出苦涅槃樂。\n>\n> 若有自性少諸欲，厭背三有求寂靜，令其聞說諸緣起，依獨覺乘而出離。若有清淨廣大心，圓滿施戒諸功德，親近如來具慈愍，令其聞說大乘音。或有國土聞一乘，或二或三或四五，如是乃至無有量，悉是如來方便力。涅槃寂靜無差別，智行勝劣有殊異，譬如虛空體性一，鳥飛遠近各不同。\n>\n> 佛體音聲亦如是，普遍一切虛空界，隨諸眾生心智殊，所聞所見各差別。佛以過去修諸行，能隨所樂演妙音，無心計念此與彼，我為誰說誰不說。如來面門放大光，具足八萬四千數，所說法門亦如是，普照於世除煩惱。圓滿清淨功德智，而常隨順三世間，猶如虛空無染著，為眾生故而顯示。\n>\n> 示有生老病死苦，亦示住壽處於世，雖順世間如是現，體性清淨如虛空。一切國土無有邊，眾生根樂亦無量，如來智眼皆明見，隨所應化示佛道。究竟十方虛空界，所有人天大眾中，隨其形相各不同，佛現其身亦如是。若在沙門大眾會，鬀除鬚髮服袈裟，執持衣鉢護諸根，令其歡喜息煩惱。\n>\n> 若時親近婆羅門，則為示現羸瘦身，執杖持瓶恒潔淨，具足智慧巧談說。吐故納新自充飽，吸風飲露無異食，或坐或立不動搖，現諸苦行摧異道。或持彼戒為世師，善達醫方等諸論，書數天文地眾相，及身休咎無不了。深入諸禪及解脫，三昧神通智慧行，言談諷詠共嬉戲，方便皆令住佛道。\n>\n> 或現上服以嚴身，首戴華冠蔭高蓋，四兵前後共圍遶，誓眾宣威伏小王。或為聽訟斷獄官，懲惡勸善多方便，所有與奪皆明審，令其欣敬盡欽承。或作輔弼諸大臣，善用諸王治政法，十方利益皆周遍，了達世間無有餘。或為粟散諸小王，或作飛行轉輪帝，令諸王子采女眾，悉皆授化奉修行。\n>\n> 或作護世四天王，或作夜叉龍等主，各為其眾而說法，一切皆令大欣慶。或作忉利大天王，住善法堂歡喜園，首戴華冠說妙法，諸天覲仰無能測。或住夜摩兜率天，化樂自在魔王所，居處摩尼寶宮殿，說真實行令調伏。或至梵天眾會中，說四無量諸禪道，普令歡喜便捨去，而莫知其往來相。\n>\n> 或至阿迦尼吒天，為說覺分諸寶華，及餘無量聖功德，然後捨去無知者。如來無礙智所見，其中一切諸眾生，悉以無邊方便門，種種教化令成熟。譬如幻師善幻術，現作種種諸幻事，佛化眾生亦如是，為其示現種種身。如淨月輪在虛空，令世眾生見盈缺，一切河池現影像，所有星宿奪光色。\n>\n> 如來智月出世間，亦以方便示增減，菩薩心水現影像，二乘星宿無光色。譬如大海寶充滿，清淨無濁無有邊，四洲所有諸眾生，一切於中現其像。佛身功德海亦爾，無垢無濁量無邊，乃至法界諸眾生，靡不於中現其像。譬如淨日放千光，不動本處遍十方，佛日光明亦如是，無去無來除世闇。\n>\n> 譬如龍王降大雨，不從身出及心出，而能霑洽悉周遍，滌除炎熱使清涼。如來法雨亦復然，不從於佛身心出，而能開悟諸含識，盡能滅除三毒火。如來清淨妙法身，一切三界無倫匹，超出世間言語道，本性非有亦非無。雖無所依無不依，如是無來亦無去，如空如日亦如夢，當於佛體如是觀。\n>\n> 三界有無一切法，不能與佛為譬諭，譬如山林鳥獸等，無有依空而住者。大海摩尼無量色，佛身差別亦復然，如來非色非非色，隨應而現無所住。虛空真如及實際，涅槃法性寂滅等，唯有如是真實法，可以顯示於如來。剎塵心念可數知，大海中水可飲盡，虛空可量風可繫，無人能說佛功德。\n>\n> 若有聞斯功德海，能生歡喜信樂心，如所稱揚悉當得，慎勿於此生疑念。」大方廣佛華嚴經卷\n>\n> 第三十九大方廣佛華嚴經大方廣佛華嚴經卷\n>\n> 第四十罽賓國三藏般若奉詔譯入不思議解脫境界普賢行願品爾時，普賢菩薩摩訶薩稱歎如來勝功德已，告諸菩薩及善財言：「善男子！如來功德，假使十方一切諸佛，經不可說不可說佛剎極微塵數劫，相續演說，不可窮盡。若欲成就此功德門，應修十種廣大行願。\n>\n> 何等為十？\n>\n> 一者、禮敬諸佛，\n>\n> 二者、稱讚如來，\n>\n> 三者、廣修供養，四者、懺悔業障，五者、隨喜功德，六者、請轉法輪，七者、請佛住世，八者、常隨佛學，九者、恒順眾生，十者、普皆迴向。」善財白言：「大聖！云何禮敬，乃至迴向？」普賢菩薩告善財言：「善男子！言禮敬諸佛者：所有盡法界、虛空界十方三世一切佛剎極微塵數諸佛世尊，我以普賢行願力故，起深信解，如對目前，悉以清淨身、語、意業，常修禮敬；\n>\n> 一一佛所，皆現不可說不可說佛剎極微塵數身，一一身遍禮不可說不可說佛剎極微塵數佛；虛空界盡，我禮乃盡，而虛空界不可盡故，我此禮敬，無有窮盡。如是乃至眾生界盡、眾生業盡、眾生煩惱盡，我禮乃盡。而眾生界乃至煩惱無有盡故，我此禮敬無有窮盡，念念相續，無有間斷，身、語、意業無有疲厭。\n>\n> 「\n>\n> 復次，善男子！言稱讚如來者：所有盡法界、虛空界十方三世一切剎土所有極微一一塵中，皆有一切世界極微塵數佛，一一佛所皆有菩薩海會圍遶，我當悉以甚深勝解，現前知見；各以出過辯才天女微妙舌根，一一舌根出無盡音聲海，一一音聲出一切言辭海，稱揚讚歎一切如來諸功德海，窮未來際相續不斷，盡於法界無不周遍。\n>\n> 如是虛空界盡、眾生界盡、眾生業盡、眾生煩惱盡，我讚乃盡。而虛空界乃至煩惱無有盡故，我此讚歎無有窮盡，念念相續，無有間斷，身、語、意業無有疲厭。「\n>\n> 復次，善男子！言廣修供養者：所有盡法界、虛空界十方三世一切佛剎極微塵中，一一各有一切世界極微塵數佛，一一佛所種種菩薩海會圍遶，我以普賢行願力故，起深信解，現前知見，悉以上妙諸供養具而為供養。所謂：華雲、鬘雲、天音樂雲、天傘蓋雲、天衣服雲、天種種香、塗香、燒香、末香，如是等雲，一一量如須彌山王；\n>\n> 然種種燈，酥燈、油燈、諸香油燈，一一燈炷如須彌山，一一燈油如大海水，以如是等諸供養具常為供養。善男子！諸供養中，法供養最。所謂：如說修行供養、利益眾生供養、攝受眾生供養、代眾生苦供養、勤修善根供養、不捨菩薩業供養、不離菩提心供養。\n>\n> 善男子！如前供養無量功德，比法供養一念功德百分不及一，千分不及一，百千俱胝那由他分、迦羅分、算分、數分、諭分、優婆尼沙陀分亦不及一。何以故？以諸如來尊重法故，以如說修行出生諸佛故。若諸菩薩行法供養，則得成就供養如來，如是修行是真供養故。\n>\n> 此廣大最勝供養虛空界盡、眾生界盡、眾生業盡、眾生煩惱盡，我供乃盡。而虛空界乃至煩惱不可盡故，我此供養亦無有盡，念念相續，無有間斷，身、語、意業無有疲厭。「\n>\n> 復次，善男子！言懺除業障者：菩薩自念我於過去無始劫中，由貪、瞋、癡發身、口、意，作諸惡業無量無邊。若此惡業有體相者，盡虛空界不能容受。我今悉以清淨三業，遍於法界極微塵剎一切諸佛菩薩眾前，誠心懺悔，後不復造，恒住淨戒一切功德。\n>\n> 如是虛空界盡、眾生界盡、眾生業盡、眾生煩惱盡，我懺乃盡。而虛空界乃至眾生煩惱不可盡故，我此懺悔無有窮盡，念念相續，無有間斷，身、語、意業無有疲厭。「\n>\n> 復次，善男子！言隨喜功德者：所有盡法界、虛空界十方三世一切佛剎極微塵數諸佛如來，從初發心為一切智，勤修福聚，不惜身命，經不可說不可說佛剎極微塵數劫，一一劫中捨不可說不可說佛剎極微塵數頭、目、手、足，如是一切難行、苦行，圓滿種種波羅蜜門，證入種種菩薩智地，成就諸佛無上菩提及般涅槃，分布舍利，所有善根，我皆隨喜。\n>\n> 及彼十方一切世界，六趣、四生一切種類所有功德，乃至一塵我皆隨喜。十方三世一切聲聞及辟支佛、有學、無學所有功德，我皆隨喜。一切菩薩所修無量難行、苦行，志求無上正等菩提廣大功德，我皆隨喜。如是虛空界盡、眾生界盡、眾生業盡、眾生煩惱盡，我此隨喜無有窮盡，念念相續，無有間斷，身、語、意業無有疲厭。\n>\n> 「\n>\n> 復次，善男子！言請轉法輪者：所有盡法界、虛空界十方三世一切佛剎極微塵中，一一各有不可說不可說佛剎極微塵數廣大佛剎，一一剎中念念有不可說不可說佛剎極微塵數一切諸佛成等正覺，一切菩薩海會圍遶，而我悉以身、口、意業種種方便，慇懃勸請轉妙法輪。\n>\n> 如是虛空界盡、眾生界盡、眾生業盡、眾生煩惱盡，我常勸請一切諸佛轉正法輪無有窮盡，念念相續，無有間斷，身、語、意業無有疲厭。「\n>\n> 復次，善男子！言請佛住世者：所有盡法界、虛空界十方三世一切佛剎極微塵數諸佛如來將欲示現般涅槃者，及諸菩薩、聲聞、緣覺、有學、無學，乃至一切諸善知識，我悉勸請莫入涅槃，經於一切佛剎極微塵數劫，為欲利樂一切眾生。如是虛空界盡、眾生界盡、眾生業盡、眾生煩惱盡，我此勸請無有窮盡，念念相續，無有間斷，身、語、意業無有疲厭。\n>\n> 「\n>\n> 復次，善男子！言常隨佛學者：如此娑婆世界毘盧遮那如來，從初發心精進不退，以不可說不可說身命而為布施；剝皮為紙，折骨為筆，刺血為墨，書寫經典，積如須彌，為重法故，不惜身命，何況王位、城邑、聚落、宮殿、園林一切所有，及餘種種難行、苦行，乃至樹下成大菩提，示種種神通，起種種變化，現種種佛身，處種種眾會：或處一切諸大菩薩眾會道場，或處聲聞及辟支佛眾會道場，或處轉輪聖王、小王眷屬眾會道場，或處剎利及婆羅門、長者、居士眾會道場，乃至或處天龍八部、人、非人等眾會道場。\n>\n> 處於如是種種眾會，以圓滿音，如大雷震，隨其樂欲，成熟眾生，乃至示現入於涅槃。如是一切，我皆隨學，如今世尊毘盧遮那，如是盡法界、虛空界十方三世一切佛剎，所有塵中一切如來皆亦如是，於念念中，我皆隨學。如是虛空界盡、眾生界盡、眾生業盡、眾生煩惱盡，我此隨學無有窮盡，念念相續，無有間斷，身、語、意業無有疲厭。\n>\n> 「\n>\n> 復次，善男子！言恒順眾生者：謂盡法界、虛空界十方剎海，所有眾生種種差別，所謂：卵生、胎生、濕生、化生，或有依於地、水、火、風而生住者，或有依空及諸卉木而生住者，種種生類、種種色身、種種形狀、種種相貌、種種壽量、種種族類、種種名號、種種心性、種種知見、種種欲樂、種種意行、種種威儀、種種衣服、種種飲食，處於種種村營、聚落、城邑、宮殿，乃至一切天龍八部、人、非人等，無足、二足、四足、多足，有色、無色，有想、無想、非有想、非無想，如是等類，我皆於彼隨順而轉，種種承事，種種供養，如敬父母，如奉師長，及阿羅漢乃至如來，等無有異。\n>\n> 於諸病苦為作良醫，於失道者示其正路，於闇夜中為作光明，於貧窮者令得伏藏，菩薩如是平等饒益一切眾生。何以故？菩薩若能隨順眾生，則為隨順供養諸佛；若於眾生尊重承事，則為尊重承事如來；若令眾生生歡喜者，則令一切如來歡喜。何以故？\n>\n> 諸佛如來以大悲心而為體故。因於眾生而起大悲，因於大悲生菩提心，因菩提心成等正覺。譬如曠野沙磧之中有大樹王，若根得水，枝葉、華果悉皆繁茂。生死曠野菩提樹王，亦復如是。一切眾生而為樹根，諸佛菩薩而為華果，以大悲水饒益眾生，則能成就諸佛菩薩智慧華果。\n>\n> 何以故？若諸菩薩以大悲水饒益眾生，則能成就阿耨多羅三藐三菩提故。是故菩提屬於眾生，若無眾生，一切菩薩終不能成無上正覺。善男子！汝於此義應如是解。以於眾生心平等故，則能成就圓滿大悲，以大悲心隨眾生故，則能成就供養如來。菩薩如是隨順眾生，虛空界盡、眾生界盡、眾生業盡、眾生煩惱盡，我此隨順無有窮盡，念念相續，無有間斷，身、語、意業無有疲厭。\n>\n> 「\n>\n> 復次，善男子！言普皆迴向者：從初禮拜乃至隨順，所有功德皆悉迴向盡法界、虛空界一切眾生，願令眾生常得安樂，無諸病苦；欲行惡法皆悉不成，所修善業皆速成就；關閉一切諸惡趣門，開示人天涅槃正路；若諸眾生因其積集諸惡業故，所感一切極重苦果我皆代受；\n>\n> 令彼眾生悉得解脫究竟成就無上菩提。菩薩如是所修迴向，虛空界盡、眾生界盡、眾生業盡、眾生煩惱盡，我此迴向無有窮盡，念念相續，無有間斷，身、語、意業無有疲厭。善男子！是為菩薩摩訶薩十種大願具足圓滿。若諸菩薩於此大願隨順趣入，則能成熟一切眾生，則能隨順阿耨多羅三藐三菩提，則能成滿普賢菩薩諸行願海。\n>\n> 是故，善男子！汝於此義應如是知：若有善男子、善女人以滿十方無量無邊、不可說不可說佛剎極微塵數一切世界上妙七寶，及諸人天最勝安樂，布施爾所一切世界所有眾生，供養爾所一切世界諸佛菩薩，經爾所佛剎極微塵數劫相續不斷所得功德，若復有人聞此願王一經於耳，所有功德比前功德百分不及一，千分不及一，乃至優波尼沙陀分亦不及一。\n>\n> 或復有人以深信心，於此大願受持讀誦，乃至書寫一四句偈，速能除滅五無間業，所有世間身心等病，種種苦惱，乃至佛剎極微塵數一切惡業，皆得銷除；一切魔軍、夜叉、羅剎、若鳩槃荼、若毘舍闍、若部多等飲血噉肉諸惡鬼神，皆悉遠離，或時發心親近守護。\n>\n> 是故若人誦此願者，行於世間無有障礙，如空中月出於雲翳，諸佛菩薩之所稱讚，一切人天皆應禮敬，一切眾生悉應供養。此善男子善得人身，圓滿普賢所有功德，不久當如普賢菩薩，速得成就微妙色身，具三十二大丈夫相，若生人天，所在之處常居勝族，悉能破壞一切惡趣，悉能遠離一切惡友，悉能制伏一切外道，悉能解脫一切煩惱，如師子王摧伏群獸，堪受一切眾生供養。\n>\n> 又復，是人臨命終時，最後剎那一切諸根悉皆散壞，一切親屬悉皆捨離，一切威勢悉皆退失，輔相、大臣、宮城內外，象馬車乘，珍寶伏藏，如是一切無復相隨，唯此願王不相捨離，於一切時引導其前。一剎那中即得往生極樂世界，到已即見阿彌陀佛、文殊師利菩薩、普賢菩薩、觀自在菩薩、彌勒菩薩等，此諸菩薩色相端嚴，功德具足，所共圍遶。\n>\n> 其人自見生蓮華中，蒙佛授記；得授記已，經於無數百千萬億那由他劫，普於十方不可說不可說世界，以智慧力隨眾生心而為利益。不久當坐菩提道場，降伏魔軍，成等正覺，轉妙法輪。能令佛剎極微塵數世界眾生發菩提心，隨其根性，教化成熟，乃至盡於未來劫海，廣能利益一切眾生。\n>\n> 善男子！彼諸眾生若聞、若信此大願王，受持讀誦，廣為人說，所有功德，除佛世尊餘無知者。是故汝等聞此願王，莫生疑念，應當諦受，受已能讀，讀已能誦，誦已能持，乃至書寫，廣為人說。是諸人等於一念中，所有行願皆得成就，所獲福聚無量無邊。\n>\n> 能於煩惱大苦海中拔濟眾生，令其出離，皆得往生阿彌陀佛極樂世界。」爾時，普賢菩薩摩訶薩欲重宣此義，普觀十方而說偈言：「所有十方世界中，三世一切人師子，我以清淨身語意，一切遍禮盡無餘。普賢行願威神力，普現一切如來前，一身復現剎塵身，一一遍禮剎塵佛。\n>\n> 於一塵中塵數佛，各處菩薩眾會中，無盡法界塵亦然，深信諸佛皆充滿。各以一切音聲海，普出無盡妙言辭，盡於未來一切劫，讚佛甚深功德海。以諸最勝妙華鬘，妓樂塗香及傘蓋，如是最勝莊嚴具，我以供養諸如來。最勝衣服最勝香，末香燒香與燈燭，一一皆如妙高聚，我悉供養諸如來。\n>\n> 我以廣大勝解心，深信一切三世佛，悉以普賢行願力，普遍供養諸如來。我昔所造諸惡業，皆由無始貪恚癡，從身語意之所生，一切我今皆懺悔。十方一切諸眾生，二乘有學及無學，一切如來與菩薩，所有功德皆隨喜。十方所有世間燈，最初成就菩提者，我今一切皆勸請，轉於無上妙法輪。\n>\n> 諸佛若欲示涅槃，我悉至誠而勸請，唯願久住剎塵劫，利樂一切諸眾生。所有禮讚供養福，請佛住世轉法輪，隨喜懺悔諸善根，迴向眾生及佛道。我隨一切如來學，修習普賢圓滿行，供養過去諸如來，及與現在十方佛。未來一切天人師，一切意樂皆圓滿，我願普隨三世學，速得成就大菩提。\n>\n> 所有十方一切剎，廣大清淨妙莊嚴，眾會圍遶諸如來，悉在菩提樹王下。十方所有諸眾生，願離憂患常安樂，獲得甚深正法利，滅除煩惱盡無餘。我為菩提修行時，一切趣中成宿命，常得出家修淨戒，無垢無破無穿漏。天龍夜叉鳩槃荼，乃至人與非人等，所有一切眾生語，悉以諸音而說法。\n>\n> 勤修清淨波羅蜜，恒不忘失菩提心，滅除障垢無有餘，一切妙行皆成就。於諸惑業及魔境，世間道中得解脫，猶如蓮華不著水，亦如日月不住空。悉除一切惡道苦，等與一切群生樂，如是經於剎塵劫，十方利益恒無盡。我常隨順諸眾生，盡於未來一切劫，恒修普賢廣大行，圓滿無上大菩提。\n>\n> 所有與我同行者，於一切處同集會，身口意業皆同等，一切行願同修學。所有益我善知識，為我顯示普賢行，常願與我同集會，於我常生歡喜心。願常面見諸如來，及諸佛子眾圍遶，於彼皆興廣大供，盡未來劫無疲厭。願持諸佛微妙法，光顯一切菩提行，究竟清淨普賢道，盡未來劫常修習。\n>\n> 我於一切諸有中，所修福智恒無盡，定慧方便及解脫，獲諸無盡功德藏。一塵中有塵數剎，一一剎有難思佛，一一佛處眾會中，我見恒演菩提行。普盡十方諸剎海，一一毛端三世海，佛海及與國土海，我遍修行經劫海。一切如來語清淨，一言具眾音聲海，隨諸眾生意樂音，一一流佛辯才海。\n>\n> 三世一切諸如來，於彼無盡語言海，恒轉理趣妙法輪，我深智力普能入。我能深入於未來，盡一切劫為一念，三世所有一切劫，為一念際我皆入。我於一念見三世，所有一切人師子，亦常入佛境界中，如幻解脫及威力。於一毛端極微中，出現三世莊嚴剎，十方塵剎諸毛端，我皆深入而嚴淨。\n>\n> 所有未來照世燈，成道轉法悟群有，究竟佛事示涅槃，我皆往詣而親近。速疾周遍神通力，普門遍入大乘力，智行普修功德力，威神普覆大慈力，遍淨莊嚴勝福力，無著無依智慧力，定慧方便諸威力，普能積集菩提力，清淨一切善業力，摧滅一切煩惱力，降伏一切諸魔力，圓滿普賢諸行力。\n>\n> 普能嚴淨諸剎海，解脫一切眾生海，善能分別諸法海，能甚深入智慧海，普能清淨諸行海，圓滿一切諸願海，親近供養諸佛海，修行無倦經劫海。三世一切諸如來，最勝菩提諸行願，我皆供養圓滿修，以普賢行悟菩提。一切如來有長子，彼名號曰普賢尊，我今迴向諸善根，願諸智行悉同彼。\n>\n> 願身口意恒清淨，諸行剎土亦復然，如是智慧號普賢，願我與彼皆同等。我為遍淨普賢行，文殊師利諸大願，滿彼事業盡無餘，未來際劫恒無倦。我所修行無有量，獲得無量諸功德，安住無量諸行中，了達一切神通力。文殊師利勇猛智，普賢慧行亦復然，我今迴向諸善根，隨彼一切常修學。\n>\n> 三世諸佛所稱歎，如是最勝諸大願，我今迴向諸善根，為得普賢殊勝行。願我臨欲命終時，盡除一切諸障礙，面見彼佛阿彌陀，即得往生安樂剎。我既往生彼國已，現前成就此大願，一切圓滿盡無餘，利樂一切眾生界。彼佛眾會咸清淨，我時於勝蓮華生，親覩如來無量光，現前授我菩提記。\n>\n> 蒙彼如來授記已，化身無數百俱胝，智力廣大遍十方，普利一切眾生界。乃至虛空世界盡，眾生及業煩惱盡，如是一切無盡時，我願究竟恒無盡。十方所有無邊剎，莊嚴眾寶供如來，最勝安樂施天人，經一切剎微塵劫。若人於此勝願王，一經於耳能生信，求勝菩提心渴仰，獲勝功德過於彼。\n>\n> 即常遠離惡知識，永離一切諸惡道，速見如來無量光，具此普賢最勝願。此人善得勝壽命，此人善來人中生，此人不久當成就，如彼普賢菩薩行。往昔由無智慧力，所造極惡五無間，誦此普賢大願王，一念速疾皆銷滅。族姓種類及容色，相好智慧咸圓滿，諸魔外道不能摧，堪為三界所應供。\n>\n> 速詣菩提大樹王，坐已降伏諸魔眾，成等正覺轉法輪，普利一切諸含識。若人於此普賢願，讀誦受持及演說，果報唯佛能證知，決定獲勝菩提道。若人誦此普賢願，我說少分之善根，一念一切悉皆圓，成就眾生清淨願。我此普賢殊勝行，無邊勝福皆迴向，普願沈溺諸眾生，速往無量光佛剎。\n>\n> 」爾時，普賢菩薩摩訶薩於如來前，說此普賢廣大願王清淨偈已，善財童子踊躍無量，一切菩薩皆大歡喜。如來讚言：「善哉！善哉！」爾時，世尊與諸聖者菩薩摩訶薩演說如是不可思議解脫境界勝法門時，文殊師利菩薩而為上首；諸大菩薩及所成熟六千比丘，彌勒菩薩而為上首；\n>\n> 賢劫一切諸大菩薩，無垢普賢菩薩而為上首；一生補處住灌頂位諸大菩薩，及餘十方種種世界普來集會一切剎海極微塵數諸菩薩摩訶薩眾，大智舍利弗、摩訶目犍連等而為上首；諸大聲聞并諸人天一切世主、天、龍、夜叉、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽、人、非人等一切大眾，聞佛所說，皆大歡喜，信受奉行。\n\n## 二、三译四件套对读（语料库·程序汇编）\n\n（本参为摄归参，四件套语料库（参2-51 历参口径）未覆盖；三译对读见主页 §6.4-6.7 与 §五之B。）\n\n**经文骨架（L.500·T0293 span 程序切分·句界均分六段·非科判）**：\n\n- **段1**（62 句 · 约 1317 CJK）：如是，以彌勒菩薩威神力故，及不思議幻智力故，得諸菩薩自在力故，見樓閣中一……\n- **段2**（62 句 · 约 1585 CJK）：善男子！……\n- **段3**（62 句 · 约 1195 CJK）：善財言：「云何是一切菩薩住處？……\n- **段4**（62 句 · 约 4732 CJK）：何以故？……\n- **段5**（62 句 · 约 2544 CJK）：善男子！……\n- **段6**（60 句 · 约 1683 CJK）：於一剎中成正覺，\n一切剎處悉亦然，\n一切入一一亦爾，\n隨眾生心而示現。……\n\n## 三、古注取窗（疏·钞·论·探玄记·程序取窗照录）\n\n**澄观《华严经疏》`T1735`（八十·寄位释）**（锚「普賢（末段）」·PDF/册页 1386 · 388 字·程序取窗·句界截断·引前须对原书核）：\n\n> 普賢下。廣陳德相令眾求滿。於中二。先\n⻑行重誡許說分齊。後偈頌廣顯佛德難思。九十五偈分二。先九十三\n\n偈別歎佛德。後二偈結德無盡。勸信勿疑。前中前八十偈法說。後十\n三偈喻明。然通讚毘盧遮那十身圓滿二十一種殊勝功德。即分二十一\n段。初有二偈。即於所知一向無障轉功德。謂佛無障礙智。於一切事\n品類差別。無著無礙故。二有一偈。明於有無無二相真如最清淨能入\n功德。謂了真如無二故無動念。三有三偈。即無功用佛事不休息功\n德。謂住佛無住處作佛事不休息。故云或見等。四有十五偈。即於法\n身中。所依意樂作事無差別功德。謂由諸佛所依智同。益生意樂同。\n報化作用同故。前經云得佛平等。亦同攝論四種意趣中平等意趣故。\n此廣列諸佛皆互相遍。此釋已妙。今更以文理證。此諸佛皆遮那之身\n謂此文言。此三十界阿閦在中。阿閦本在東方。今云在此明不異此。\n又無量壽佛月覺如來。皆遍十方豈容隔此。又皆言或見。則知一佛隨\n見不同。若言別讚餘佛。直言阿閦在此。何成讚德。況華藏剎海皆遮\n那化境。無量壽等未出剎種之中。豈非是此佛耶。法華央掘並說十方\n分身。\n\n**澄观《随疏演义钞》`T1736`（八十·钞于末会多总谈，部分参为类聚引）**（锚「普賢（末段）」·PDF/册页 2375 · 45 字·程序取窗·句界截断·引前须对原书核）：\n\n> 普賢法\n乃至失命終不離\n盡未來際願相應\n以此善根等法性\n普潤無盡眾生界\n一念多劫修普行\n盡成無上佛菩提\n\n\n\n**李通玄《新华严经论》`T1739`（八十）**（锚「普賢（末段）」·PDF/册页 975 · 34 字·程序取窗·句界截断·引前须对原书核）：\n\n> 普賢法界無始無終大圓明智。\n恒普印之常行無有出沒休廢之事十方常然身無內外。\n\n\n\n**法藏《探玄记》`T1733`（六十·残存）**（锚「普賢」·PDF/册页 1215 · 43 字·程序取窗·句界截断·引前须对原书核）：\n\n> 普賢自在法者。究竟要當終齊佛果如善財與\n諸佛等等也。上來於下本十萬偈花嚴內釋前分三萬六千偈竟。\n\n\n\n## 四、评注与延伸指针（只指不代·不生成无据内容）\n\n- **古注诸家**：本参取窗见 §三；更完整释文见主页 §6.2 李通玄《新华严经论》窗、§五之B 计数诸说辨析；澄观《华严经疏》总纲见主页 §2.0′。\n- **今人讲记**：海云继梦《华藏妙海》对读见主页 §6.2（〔OCR 待校〕）；九九华严讲记线见〈海云法师·九九华严讲记校勘工作台〉。\n- **平行线**：藏译 Toh 44 对应章见主页「藏译对读窗」；〈五十三参行历〉交互图可按身份/篇幅回看全程。\n- **本参标记**：★十愿王（行历图八处特殊标记之一）。\n\n> <span class=\"en-line\">**EN corresponding · Visit 54 — 普賢 (bodhisattva).** A bodhisattva at 逝多林（普贤身）; self-declared gateway: \"The Ten Great Vows of Samantabhadra\" 〔编者试译〕. Stage IV — Return & Consummation (Samantabhadra's Great Vows). Three-translation parallels: 40-fascicle `T10n0293` (base), 80 `T10n0279`, 60 `T09n0278` — see §二; classical commentary windows: Chengguan's *Huayan jing shu* `T1735` and Li Tongxuan's *Xin Huayan jing lun* `T1739` — see §三.</span>\n\n## 五、台账\n\n- L.493（2026-11-17）：古注取窗入 §三（疏/论 54/54 全覆盖·探玄记入法界品疏残存仅 13/54·未及者如实留空）；程序取窗·NFKC 归一·单调锚定·字准待校。\n- L.499（2026-11-17）：第四源《随疏演义钞》`T1736` 入 §三（40/54·钞于末会多总谈，部分窗为类聚引·已于源标签注明）。\n- L.491（2026-11-16）：子页建立——程序汇编（主页 §参54 照录＋行历数据卡＋四件套语料）；内容源批次 L.289–L.304（参批1-16）·L.316（参33 补卡）·L.407/L.413/L.415（行历·三译师名）·L.421/L.456（四件套语料库）。\n- 主页各参节后续修订后重跑 build 即自动同步本页 §一（运行时组装·无中间文件）。\n", "data_source": null, "data_pool": null, "back": {"tab": "gap", "view": "avatamsaka-studies", "label": "文献页 · 华严经学"}, "updated_at": "2026-11-16"};

// ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);

function _applyArticleENMode(){
  var full=document.getElementById('article-full');
  var btn=document.getElementById('article-en-toggle');

}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}
