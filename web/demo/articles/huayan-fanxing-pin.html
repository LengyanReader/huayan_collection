<script>
var ARTICLE = {"id": "huayan-fanxing-pin", "file": "articles/huayan-fanxing-pin.html", "title": "九九华严第十六品 梵行品之拼读", "title_sub": "华严经第十六品·第三会胜进·卷十七·品界CJK923（纯长行·无偈颂·5单元）·正念天子问·法慧推徵十法中梵行不可得·九喻遮遣·修十种法（如来十力·起大慈悲·了如幻如梦）·初发心时即得阿耨多羅三藐三菩提·与六十卷八全本对读（5行·CJK993·口/語异译）·注疏五家齐备·六要素齐备·数据层实测", "icon": "📖", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第三会_忉利天宫_差别因果周/华严经细读_第十六部_梵行品.md", "doc_md": "# 华严经细读·第十六部：梵行品（卷第十七·品十六）\n\n> **EN · Close Reading of the Avatamsaka Sutra, Part Sixteen: The Chapter on Brahmacariya (Pure Conduct)**\n\n> **底本**：唐·实叉难陀译《大方广佛华严经》（八十华严）T10n0279。**范围：卷第十七·本品全文（品号第十六）**。本品属**第三会「忉利天宫会」·差别因果周之「十住位」胜进**，为**第三会第四品**——紧接第十五品《十住品》正说十住位次之后的**胜进行门**，明「位中之通行」。澄观来意判六义之首：「前是正位，今辨位中之行」。\n> **立稿**：2026-10-26（L.196 充实批）。承第一会（品 1-6）、第二会（品 7-12）、第三会首部（品 13-15）之体例与校勘纪律。\n\n---\n\n## 〇、凡例（简要）\n\n一、**校勘底本**：以 T10n0279（八十华严）为底本。六十华严（T09n0278·本品相当者为〈梵行品第十二〉在卷第八·**入库**）、四十华严（T10n0293·无梵行品·彼但入法界品别行）不作底本；**本品正文一律以八十为准，六十仅供对读，绝不据他译补写**。\n\n二、**品读主从**：以八十华严为叙事主轴，六十为辅读与对读。\n\n三、**引文回源**：本品引经文照 CBETA T10n0279 繁体原字形、逐字回源；不得以记忆或他品经文冒充。异文各照底本、不统一。注疏窗口注入档之 `<<<PAGE N>>>` 分页符已剔除（L.199·CJK 计数不变机检）；原档康熙部首码位已归一正字（L.199）。\n\n四、**标识符**：〔待核〕存疑·〔本文判断〕推断·〔未竟〕未完成。\n\n---\n\n<!-- ATLAS:BEGIN P16 -->\n### 〇之零、导读指南（阅读路径与方法）\n\n**定位：** 考证型细读（philological close reading），以「可复核性」为第一优先。本品为第三会**最短之品**，纯以「推徵」为法：一一问「是梵行耶」，一一答「非」，遮至无所遮，方说「修十种法」。读法当**以遮为纲**。\n**本品一句：** **身非梵行、语非梵行、意非梵行，乃至戒非梵行**——十法俱遣，然后「梵行」之名始立。\n**路径：** 〇之二（二图四表）→ 一（品题与脉络）→ 二（全文逐段）→ 四（义理与名相）→ 五（诸家会读）→ 七（数据层）→ 附录按需查阅。\n**方法：** 先经文后诠释；〔实测〕／〔本文判断〕／〔存疑待核〕三分；负面证据同样入账；结构覆盖 100%，个体择要。\n**读前三问：** ① 十法（身·身业·语·语业·意·意业·佛·法·僧·戒）何以恰是此十？② 全品 923 字，何以为十住之「行」？③ 遮遣既尽，何以又须「修十种法」？\n\n## 〇之二、本品内容地图（未入其门，先观其海）\n\n> **本节体例。** 图与表之数据，一律取自本文已回源核定之 §二逐段表与 §7.1／§7.5 实测数；**凡属推断者标〔本文判断〕，不入图**。图各看一事，勿求一图而尽本品。\n\n### 〇之二.0 提要\n\n本品为**第三会最短、亦全经最短诸品之一**：品界 **CJK 923**（含品题 6·正文 917），**五单元＝1 head＋4 p**，**纯长行·无偈颂**（lg 0·颂 0·偈 0）。四段之量：问端 **50**・过渡 **5**・**推徵核心 669**（占 72.5%）・修十法 **193**（20.9%）。六十对读〈梵行品第十二〉卷八・正文 **993**（比八十多 70 字·核心段反少 133）。\n\n| 图 | 画什么 | 一句话 |\n|---|---|---|\n| **图 〇-1　十法推徵遮遣图** | 遮如何遍 | 身·身業·語·語業·意·意業·佛·法·僧·戒——一一「是梵行耶？」一一非 |\n| **图 〇-2　遮后更修·五段体量转折图** | 遮后何立 | 问端 50→过渡 5→推徵 669→修十法 193；遮尽而立 |\n\n**〔读法之序〕**　先观图 〇-1 得十法遮遣之遍，次观图 〇-2 得「遮后更修」之转折，次读〇之二.3 之坐标，然后入 §二逐段。**遮处既尽，立处自明。**\n\n> **EN corresponding · Map of the Chapter.** 923 characters — the shortest chapter of the third assembly. One question, ten items (body, bodily action, speech, verbal action, mind, mental action, Buddha, dharma, saṅgha, precepts), each answered \"is this the pure practice?\" with a negation, until nothing is left to negate; then, and only then, ten things to be cultivated. Fig. 0-1 shows the sweep of negation; Fig. 0-2 the turn from negation to practice.\n\n### 〇之二.1 图 〇-1　十法推徵遮遣图\n\n<figure>\n<svg viewBox=\"0 0 1000 500\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"24\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">十法推徵：一一問「是梵行耶」，一一答「非」</text>\n<text x=\"500\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a7a5e\">十法悉照 `T10n0279` 卷十七（§2.2）；三业各二（身·身業·語·語業·意·意業）＋三宝（佛·法·僧）＋戒</text>\n\n<g font-size=\"12\" fill=\"#5a5147\">\n<rect x=\"40\" y=\"66\" width=\"130\" height=\"28\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/><text x=\"105\" y=\"85\" text-anchor=\"middle\">身</text>\n<rect x=\"178\" y=\"66\" width=\"130\" height=\"28\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/><text x=\"243\" y=\"85\" text-anchor=\"middle\">身業</text>\n<rect x=\"316\" y=\"66\" width=\"130\" height=\"28\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/><text x=\"381\" y=\"85\" text-anchor=\"middle\">語</text>\n<rect x=\"454\" y=\"66\" width=\"130\" height=\"28\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/><text x=\"519\" y=\"85\" text-anchor=\"middle\">語業</text>\n<rect x=\"592\" y=\"66\" width=\"130\" height=\"28\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/><text x=\"657\" y=\"85\" text-anchor=\"middle\">意</text>\n<rect x=\"730\" y=\"66\" width=\"130\" height=\"28\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/><text x=\"795\" y=\"85\" text-anchor=\"middle\">意業</text>\n<rect x=\"40\" y=\"102\" width=\"130\" height=\"28\" fill=\"#f3ecdf\" stroke=\"#c9b98f\"/><text x=\"105\" y=\"121\" text-anchor=\"middle\">佛</text>\n<rect x=\"178\" y=\"102\" width=\"130\" height=\"28\" fill=\"#f3ecdf\" stroke=\"#c9b98f\"/><text x=\"243\" y=\"121\" text-anchor=\"middle\">法</text>\n<rect x=\"316\" y=\"102\" width=\"130\" height=\"28\" fill=\"#f3ecdf\" stroke=\"#c9b98f\"/><text x=\"381\" y=\"121\" text-anchor=\"middle\">僧</text>\n<rect x=\"454\" y=\"102\" width=\"130\" height=\"28\" fill=\"#f7ecd2\" stroke=\"#b8863c\" stroke-width=\"1.3\"/><text x=\"519\" y=\"121\" text-anchor=\"middle\">戒</text>\n</g>\n<text x=\"600\" y=\"121\" font-size=\"10.5\" fill=\"#8a7a5e\">（三宝＋戒·四法列第二行）</text>\n\n<line x1=\"40\" y1=\"148\" x2=\"960\" y2=\"148\" stroke=\"#c9b98f\"/>\n<text x=\"40\" y=\"172\" font-size=\"12\" font-weight=\"bold\" fill=\"#b8863c\">「為身是梵行耶？……乃至戒是梵行耶？」——一問遍十法</text>\n\n<text x=\"40\" y=\"204\" font-size=\"12\" font-weight=\"bold\" fill=\"#7a5a28\">答：一一非。理由三式（§2.2）</text>\n<g font-size=\"11.5\" fill=\"#5a5147\">\n<rect x=\"40\" y=\"216\" width=\"290\" height=\"72\" rx=\"4\" fill=\"#ffffff\" stroke=\"#e0d6c2\"/>\n<text x=\"60\" y=\"238\" font-weight=\"bold\">① 九喻非圣</text>\n<text x=\"60\" y=\"258\" font-size=\"10.5\" fill=\"#8a7a5e\">如幻·如夢·如影·如響·如化·如空</text>\n<text x=\"60\" y=\"276\" font-size=\"10.5\" fill=\"#8a7a5e\">无实体故，不可名为梵行</text>\n\n<rect x=\"350\" y=\"216\" width=\"290\" height=\"72\" rx=\"4\" fill=\"#ffffff\" stroke=\"#e0d6c2\"/>\n<text x=\"370\" y=\"238\" font-weight=\"bold\">② 離諸相</text>\n<text x=\"370\" y=\"258\" font-size=\"10.5\" fill=\"#8a7a5e\">梵行者，非有相·非无相</text>\n<text x=\"370\" y=\"276\" font-size=\"10.5\" fill=\"#8a7a5e\">取相即非，离相亦不可得</text>\n\n<rect x=\"660\" y=\"216\" width=\"300\" height=\"72\" rx=\"4\" fill=\"#ffffff\" stroke=\"#e0d6c2\"/>\n<text x=\"680\" y=\"238\" font-weight=\"bold\">③ 無所得</text>\n<text x=\"680\" y=\"258\" font-size=\"10.5\" fill=\"#8a7a5e\">若言「是梵行」，即有所得</text>\n<text x=\"680\" y=\"276\" font-size=\"10.5\" fill=\"#8a7a5e\">无所得故，乃名梵行</text>\n</g>\n\n<text x=\"40\" y=\"320\" font-size=\"12\" font-weight=\"bold\" fill=\"#7a5a28\">遮遣之结构：不是「否定十法」，是「否定『十法即梵行』之命题」</text>\n<text x=\"40\" y=\"344\" font-size=\"11.5\" fill=\"#5a5147\">十法本身不破（身·语·意·佛·法·僧·戒皆在），所破者<tspan font-weight=\"bold\">以之为梵行</tspan>之执——<tspan font-weight=\"bold\">法不破，执法破</tspan>。〔本文判断〕</text>\n\n<line x1=\"40\" y1=\"362\" x2=\"960\" y2=\"362\" stroke=\"#d3c7ae\"/>\n<text x=\"40\" y=\"388\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 十法之选，非随意：<tspan font-weight=\"bold\">三业各开体用（身／身業·語／語業·意／意業）成六，加三宝与戒成十</tspan>——</text>\n<text x=\"40\" y=\"410\" font-size=\"11.5\" fill=\"#8a7a5e\">　 六为「所修之器」，三宝为「所依之境」，戒为「所守之律」；十法盖尽修行之全域。</text>\n<text x=\"40\" y=\"436\" font-size=\"11.5\" fill=\"#7a5a28\">※ 本品推徵占 669 字（72.5%）——<tspan font-weight=\"bold\">全品之重，尽在遮门</tspan>；立门（修十法）仅 193 字。</text>\n<text x=\"40\" y=\"460\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 问端仅 50 字：「正念天子问·云何而得梵行清净」——<tspan font-weight=\"bold\">一问到底，无第二问</tspan>。</text>\n<text x=\"40\" y=\"484\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 六十侧核心段 536 字（比八十少 133），而问端多 19——两译详略互易，各照底本。</text>\n</svg>\n<figcaption><b>图 〇-1　十法推徵遮遣图。</b>十法一一受问：「为身是梵行耶？……乃至戒是梵行耶？」而一一答非。<b>所破者不是十法，是以十法为梵行之执</b>——法不破，执法破〔本文判断〕。三式理由（九喻非圣·离诸相·无所得）层层收窄，至「无所得」而无处可立。<b>本品 72.5% 的字数用于此遮门</b>；立门（修十法）仅 193 字。<div class=\"en-line\">Fig. 0-1. Ten items, each asked whether it is the pure practice, each answered no. What is negated is not the ten but the proposition that they *are* the practice: the dharmas stand, the grasping does not. Three grounds narrow successively — the nine similes, the absence of marks, the unattainability — until nothing is left to stand on. Nearly three quarters of the chapter is spent here; the positive half takes 193 characters.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. **遮不是虚无，是「不许以偏为全」。** 十法各是修行之一端，执一端为全体，则非；**故遮其执，不遮其法**。\n2. **「無所得」是遮门之极，也是立门之枢。** 无所立而后可修——**若先有所得，则修成执**。\n3. **十法之数当作「全域」读。** 三业开六、三宝加戒——**十非列举，是穷尽**。〔本文判断〕\n\n### 〇之二.2 图 〇-2　遮后更修·五段体量转折图\n\n<figure>\n<svg viewBox=\"0 0 1000 470\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"24\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">九百二十三字之分配：遮门七成二，立门二成</text>\n<text x=\"500\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a7a5e\">条长按 CJK 比例（1 字＝1.1px）；五单元＝1 head＋4 p（§7.5.2）</text>\n\n<g font-size=\"12\" fill=\"#5a5147\">\n<text x=\"30\" y=\"82\">品题</text><rect x=\"150\" y=\"68\" width=\"7\" height=\"20\" fill=\"#d9cdb8\" stroke=\"#c9b98f\"/><text x=\"166\" y=\"83\" font-size=\"11\" fill=\"#8a7a5e\">6</text>\n<text x=\"30\" y=\"112\">80-001 問端</text><rect x=\"150\" y=\"98\" width=\"55\" height=\"20\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"214\" y=\"113\" font-size=\"11\" fill=\"#8a7a5e\">50　正念天子問「云何而得梵行清净」</text>\n<text x=\"30\" y=\"142\">80-002 過渡</text><rect x=\"150\" y=\"128\" width=\"6\" height=\"20\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"165\" y=\"143\" font-size=\"11\" fill=\"#8a7a5e\">5　「法慧菩薩言」</text>\n<text x=\"30\" y=\"172\">80-003 推徵</text><rect x=\"150\" y=\"158\" width=\"736\" height=\"20\" fill=\"#f7ecd2\" stroke=\"#b8863c\" stroke-width=\"1.4\"/><text x=\"894\" y=\"173\" font-size=\"11.5\" font-weight=\"bold\" fill=\"#7a5a28\">669</text>\n<text x=\"30\" y=\"202\">80-004 修十法</text><rect x=\"150\" y=\"188\" width=\"212\" height=\"20\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"370\" y=\"203\" font-size=\"11\" fill=\"#8a7a5e\">193　十力·大慈悲·如幻如梦</text>\n</g>\n<text x=\"150\" y=\"228\" font-size=\"11\" fill=\"#b8863c\">↑ 推徵占 72.5%</text>\n<text x=\"150\" y=\"248\" font-size=\"11\" fill=\"#8a7a5e\">↑ 立门占 20.9%　·　问端与过渡共 6%</text>\n\n<line x1=\"30\" y1=\"266\" x2=\"970\" y2=\"266\" stroke=\"#c9b98f\"/>\n<text x=\"30\" y=\"292\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#7a5a28\">转折之枢：遮尽而立——末段 193 字全品之归宿</text>\n<text x=\"30\" y=\"316\" font-size=\"11.5\" fill=\"#5a5147\">「復應修習十種法。何者為十？所謂：處非處智、過現未來業報智、諸禪解脫三昧智、諸根勝劣智、</text>\n<text x=\"30\" y=\"336\" font-size=\"11.5\" fill=\"#5a5147\">種種解智、種種界智、一切至處道智、天眼無礙智、宿命無礙智、永斷習氣智。」——即如来十力之智境</text>\n\n<rect x=\"30\" y=\"352\" width=\"940\" height=\"52\" rx=\"4\" fill=\"#f7ecd2\" stroke=\"#b8863c\"/>\n<text x=\"46\" y=\"372\" font-size=\"11.5\" font-weight=\"bold\" fill=\"#7a5a28\">末句：「初發心時即得阿耨多羅三藐三菩提，知一切法即心自性，成就慧身，不由他悟。」</text>\n<text x=\"46\" y=\"392\" font-size=\"11\" fill=\"#8a7a5e\">此句直贯第十七品——<tspan font-weight=\"bold\">遮尽而立，立处即是初心</tspan>；故本品虽短，为全会之枢。</text>\n\n<text x=\"30\" y=\"432\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 五段之量：6＋50＋5＋669＋193＝923，与品界 CJK 全合（§7.5.2 守恒）。</text>\n<text x=\"30\" y=\"456\" font-size=\"11.5\" fill=\"#7a5a28\">※ 六十侧 993 字（多 70）：其核心段反少 133，而问端多 19——<tspan>两译之详略互易，非一详一略</tspan>。</text>\n</svg>\n<figcaption><b>图 〇-2　遮后更修·五段体量转折图。</b>九百二十三字之分配：<b>推徵 669（72.5%）、修十法 193（20.9%）、问端与过渡共 55（6%）</b>。全品之重尽在遮门，而立门只 193 字——<b>遮尽而立，立处即初心</b>。末句「初发心时即得阿耨多罗三藐三菩提，知一切法即心自性，成就慧身，不由他悟」直贯第十七品，<b>故本品虽为全会最短，实为全会之枢</b>。<div class=\"en-line\">Fig. 0-2. 923 characters: 669 of negation, 193 of practice, 55 of question and transition. The weight lies almost wholly in the sweeping-away; what is then established is ten forms of the Tathāgata's knowledge, and the chapter closes on the line that the first arousal of the mind itself attains awakening, knowing all dharmas as the mind's own nature — a body of wisdom, not awakened through another. Shortest in the assembly, and its hinge.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. **先读末段，回读遮门。** 知其所立，则遮门之每一「非」皆有着落；**否则九百字尽是空言**。\n2. **「不由他悟」两品同辞，当合看。** 此在梵行之末，彼在初发心之极——**一行一德，同证一悟**。\n3. **两译详略互易，最宜细辨。** 八十核心多 133 而问端少 19；**若以为「详者必后出」，则误**。\n\n### 〇之二.3 本品在第三会（忉利天宫·说十住）之坐标\n\n本品为第三会第四品（正说四品之二），**十住之「行」**：前品列位，本品明「位中所有之行」。澄观判此品「**以離相為梵行**」，与第十五品之「以十法为位」恰成体用。\n\n| 品 | 卷 | 位／科 | 一句提撕 | 与本品之关系 |\n|---|---|---|---|---|\n| 15 十住（前） | 卷16 | 第三会·正说·**位** | 十住双十，百颂 | 位已列 |\n| **16 梵行（本品）** | 卷17 | 第三会·正说·**行** | 十法推徵，离相梵行 | 位中必有行 |\n| 17 初发心功德 | 卷17–18 | 第三会·**胜进·德** | 十一喻校量，121 颂 | 行成而德显 |\n| 18 明法 | 卷18 | 第三会·**收束** | 十法矩阵 | 德归诸法 |\n\n### 〇之二.4 本品形式特征（与邻品对看）\n\n本品之特色在**「以遮为宗而极短」**：923 字，五单元，纯长行，无偈颂，**全品四分之三用于否定**。在三十九品中，**以如此短的篇幅、如此高的遮遣比例而成一品者，唯此一品**〔本文判断·据本文所核诸品〕。\n\n| 特征 | 本品表现〔实测〕 | 邻品之对照 | 读法上的后果 |\n|---|---|---|---|\n| 篇幅 | CJK 923（第三会最短） | 第十七品 8,207（第三会最长） | 同会之中，相去近九倍 |\n| 文体 | 纯长行・lg 0・颂 0・偈 0 | 第十五品长行＋百颂；第十七品长行＋121 颂 | 一会六品，唯此品全无偈 |\n| 遮遣比例 | 推徵 669／923＝72.5% | 第十八品以「立」为主（十法矩阵） | 一遮一立，恰成对照 |\n| 篇幅与译 | 八十 923／六十 993（差 +70） | 第十二品两译差仅 69 | 两译之差，未必同向 |\n| 单元 | 5（1 head＋4 p） | 第十七品 27；第十八品 32 | 单元少而字密 |\n| 枢机语 | 「初發心時即得…不由他悟」 | 第十七品全品即此句之展开 | 短品为长品之纲 |\n\n### 〇之二.5 五种读法（导览）\n\n| 读法 | 路径 | 适合谁 | 得什么 |\n|---|---|---|---|\n| **遮读** | 只读十法之「是梵行耶」与「非」 | 初读本篇者 | 得遮门之遍 |\n| **立读** | 只读 80-004 修十法一段 | 欲见归宿者 | 得十力之智境 |\n| **枢读** | 只读末句「不由他悟」 | 欲见全会脉络者 | 见短品之重 |\n| **校读** | §7.5.3 两译对读表 | 欲核文本者 | 得详略互易之实 |\n| **承读** | 本品末句 → 第十七品 §2.0 | 欲见展开者 | 见一句如何成八品之最 |\n\n### 〇之二.6 数与位之谱：本品之数，四等分录\n\n华严之数非计数之数。本品所涉之数，来源不一，性质亦不一；**先分其等，后论其义**，则不为数目所惑。\n\n| 等第 | 数 | 出处 | 性质 |\n|---|---|---|---|\n| **T0 经文明文** | 「為身是梵行耶？……乃至戒是梵行耶？」 | `T10n0279` 卷十七·80-003 | 十法推徵之问 |\n| **T0 经文明文** | 「初發心時即得阿耨多羅三藐三菩提……不由他悟」 | 同上·80-004 末 | 全品枢机 |\n| **T0 本文实测** | **923 字／正文 917／5 单元** | §7.5.2 | 计数（本文自测） |\n| **T0 本文实测** | 推徵 669・修十法 193・问端 50・过渡 5 | §7.5.2 | 计数（本文自测） |\n| **T1 澄观《疏》** | 以離相為梵行 | `T1735` 卷十七 | 释名之据 |\n| **T1 法藏《探玄记》** | 「梵行品第十二」（六十品次） | `T1733` 卷十一 | 品次对照 |\n| **T2 六十** | 正文 993・核心段 536・问端 69 | `T09n0278` 卷八 | 对读（详略互易） |\n\n> **〔读法〕** 本品之数最简：923・669・193・50・5。**五数之要，在「669 与 193 之比」**——遮与立近于 3.5:1。凡读此类以遮为宗之品，**比例即是教法**：遮不厌详，立不厌简。若倒转其比例，则成「以理废行」；若执其简而立，则成「执药成病」。\n\n<!-- ATLAS:END P16 -->\n\n## 一、概述与品题解义\n\n### 1.1 品题释义\n\n**品名**：**梵行品**（八十华严**第十六品**，唐·实叉难陀译）。全篇在《大方广佛华严经》**卷第十七**，紧接第十五品《十住品》之后、第十七品《初发心功德品》之前，为**第三会「忉利天宫会」第四品·胜进趣后**。\n\n**「梵行」**——澄观《疏》（T1735）：「具云勃嚂摩，此翻為淨……離染中極故名為梵，即梵為行故名梵行」·法藏《探玄记》（T1733）：「離妄念之染故云梵，會無我理故云行」·慧苑《刊定记》（X0221）：「梵是梵音，具云勃濫摩，此翻為淨行。淨行有二種，謂相及離相。聲聞唯依相脩，名為梵行；菩薩唯脩離相，名為梵行」·李通玄《论》（T1739）：「梵者此云淨也。以其淨行利眾生故，常居世間行一切行，化利眾生，無行可得，則無行不淨，是故名為梵行也」。\n\n### 1.2 品位与脉络（承上启下）\n\n**澄观来意六义**（T1735）：「一前是正位。今辨位中之行。故次來也。二前明諸位別行。今辨諸位通行。三前通道俗。今別顯出家所行。四前明隨相差別。今顯會緣入實。五為顯入住之因。謂自他二種梵行淨故。則入初住也。六別顯初住成佛。則類前諸位。位位成佛不由他悟之相也」——本品於第三會六品之「當位行德」中承**勝進趣後**之職，法藏判「初三品是當位行德。後一品是勝進趣後」〔待核〕。\n\n**承上启下**：\n- **承上**：第十五品明十住位次（初发心·灌顶），本品即其位中胜进行门——以十法观察显「无所得」之梵行体；\n- **本品**：正念天子问·法慧答——推徵十法（身·身業·語·語業·意·意業·佛·法·僧·戒）中梵行不可得·修習十種法（十力·觀察·起大慈悲·了如幻如夢）；\n- **启下**：第十七品《初发心功德品》广叹初发心功德——本品末句「初發心時即得阿耨多羅三藐三菩提」正是彼品宗纲之伏笔。\n\n### 1.3 篇幅与结构预览（实测）\n\n品界 T10n0279 CJK-only @109022-109945·**CJK 923**：品题 6＋正文 917（问端 50＋过渡 5＋答核心 669＋修十法 193）。平文器 5 单元＝1 head＋4 p。纯长行·无偈颂（lg 0·颂 0·偈 0）。六十对读〈梵行品第十二〉卷八·正文 CJK 993·5 行。详见 S7。\n\n### 1.4 核心要义\n\n一、**十法推徵·梵行不可得**——身·身業·語·語業·意·意業·佛·法·僧·戒，於此十中求梵行終不可得；非断灭·乃**離相**之真梵行（慧苑：「聲聞梵行乃是菩薩污行」）。\n\n二、**修习十种法·起大慈悲**——处非处智乃至永断习气智（十力·一一观察·有无量义）；「行無上業不求果報·了知境界如幻如夢如影如響亦如變化」。\n\n三、**初发心即得无上菩提**——本品末句「初發心時即得阿耨多羅三藐三菩提·知一切法即心自性·成就慧身不由他悟」，为华严「发心即成佛」顿教之经典出处。\n\n### 1.5 经文文本现象与信度标识\n\n- 「法  慧菩薩言」五字独立为 p·系平文器重计（80-002·与 80-001 文内语重叠·§1.5 口径）；\n- 「身身業語語業意意業」——六十本作「身、身業、口、口業、意、意業」，八十作「身、身業、語、語業、意、意業」——**口/語異譯**，各照底本不統一。\n\n### 1.7 核心要义小结\n\n本品一句话：**正念问梵行·法慧推徵十法不可得·修十力起悲·初发心即成正觉**——以遮诠表梵行离相之体，以十力显位中通行之用，以如幻梦影响结无住之宗，以初发心即得菩提开后品功德之门〔本文判断〕。\n\n---\n\n## 二、卷第十七（梵行品第十六·本品全文）\n\n### 2.0 结构总表（据经切分）\n\n| 段号 | 单元 | 内容 | CJK（实测） |\n|---|---|---|---|\n| 甲·问端 | 80-001 | 正念天子问·云何而得梵行清净 | 50 |\n| 乙·总标十法 | 80-003 前段 | 应以十法而为所缘·作意观察·身·身业·语·语业·意·意业·佛·法·僧·戒 | 含于丙 |\n| 丙·推徵 | 80-003 | 为身是梵行耶？乃至戒是梵行耶？·九喻非圣·离诸相·无所得 | 669 |\n| 丁·修十法 | 80-004 | 处非处智·十力·大慈悲·如幻如梦·初发心即得菩提 | 193 |\n| 戊·品题 | 80-000 | 品题六字 | 6 |\n\n### 2.1 问端（80-001）\n\n> 爾時，正念天子白法慧菩薩言：「佛子！一切世界諸菩薩眾，依如來教，染衣出家。云何而得梵行清淨，從菩薩位逮於無上菩提之道？」\n\n**疏解**：问主「正念天子」——李通玄释：「無念之念，名為正念。隨行無念，名為正念」（X0223）。所問「云何而得梵行清淨」——正問十住位中修何行而得净。\n\n### 2.2 法慧答·推徵十法（80-003）\n\n> 「佛子！菩薩摩訶薩修梵行時，應以十法而為所緣，作意觀察。所謂：身、身業、語、語業、意、意業、佛、法、僧、戒。」\n\n**疏解**：十法为所缘——澄观判此三业·三宝·戒为「总举所观境」（T1735）。推徵法：「為身是梵行耶？乃至戒是梵行耶？」——依次于十法中寻梵行皆不可得。以九喻遮遣（非善·非法·浑浊·臭恶·不净·可厌·违逆·杂染·死尸·虫聚）显若执身为梵行则成有过。\n\n### 2.3 修十种法·结归（80-004）\n\n> 「復應修習十種法。何者為十？所謂：處非處智、過現未來業報智、諸禪解脫三昧智、諸根勝劣智、種種解智、種種界智、一切至處道智、天眼無礙智、宿命無礙智、永斷習氣智。於如來十力，一一觀察；一一力中，有無量義，悉應諮問。聞已，應起大慈悲心，觀察眾生而不捨離；思惟諸法，無有休息；行無上業，不求果報；了知境界如幻如夢，如影如響，亦如變化。若諸菩薩能與如是觀行相應，於諸法中不生二解，一切佛法疾得現前，初發心時即得阿耨多羅三藐三菩提，知一切法即心自性，成就慧身，不由他悟。」\n\n**疏解**：十种法即如来十力之智境——修观成则「於諸法中不生二解」·「一切佛法疾得現前」。末句「**初發心時即得阿耨多羅三藐三菩提。知一切法即心自性，成就慧身，不由他悟**」为华严顿教根本命题，直贯第十七品。\n\n### 2.13 品全文逐段入文\n以下按 CBETA T10n0279 平文器 5 单元（1 head + 4 p）逐段照录八十华严〈梵行品第十六〉全文。各段标号与 §2.0 结构总表对应。\n\n**80-000**（`head`·CJK 6）：\n\n> 梵行品第十六\n\n**80-001**（`p`·CJK 50）：\n\n> 爾時，正念天子白法慧菩薩言：「佛子！一切世  界諸菩薩眾，依如來教，染衣出家。云何而得  梵行清淨，從菩薩位逮於無上菩提之道？」\n\n**80-002**（`p`·CJK 5）：\n\n> 法  慧菩薩言：\n\n**80-003**（`p`·CJK 669）：\n\n> 「佛子！菩薩摩訶薩修梵行時，應以  十法而為所緣，作意觀察。所謂：身、身業、語、  語業、意、意業、佛、法、僧、戒。應如是觀：為身是  梵行耶？乃至戒是梵行耶？若身是梵行者，  當知梵行則為非善、則為非法、則為渾濁、則  為臭惡、則為不淨、則為可厭、則為違逆、則為  雜染、則為死屍、則為蟲聚。若身業是梵行  者，梵行則是行住坐臥、左右顧視、屈伸俯仰。  若語是梵行者，梵行則是音聲風息、唇舌  喉吻、吐納抑縱、高低清濁。若語業是梵行者，  梵行則是起居問訊、略說、廣說、諭說、直說、  讚說、毀說、安立說、隨俗說、顯了說。若意是梵  行者，梵行則應是覺、是觀、是分別、是種種  分別、是憶念、是種種憶念、是思惟、是種種思  惟、是幻術、是眠夢。若意業是梵行者，當知  梵行則是思想、寒熱、飢渴、苦樂、憂喜。若佛是  梵行者，為色是佛耶？受是佛耶？想是佛耶？  行是佛耶？識是佛耶？為相是佛耶？好是佛  耶？神通是佛耶？業行是佛耶？果報是佛耶？  若法是梵行者，為寂滅是法耶？涅槃是法  耶？不生是法耶？不起是法耶？不可說是法   耶？無分別是法耶？無所行是法耶？不合集是  法耶？若僧是梵行者，為預流向是僧耶？預  流果是僧耶？一來向是僧耶？一來果是僧耶？  不還向是僧耶？不還果是僧耶？阿羅漢向是  僧耶？阿羅漢果是僧耶？三明是僧耶？六通  是僧耶？若戒是梵行者，為壇場是戒耶？問  清淨是戒耶？教威儀是戒耶？三說羯磨是  戒耶？和尚是戒耶？阿闍梨是戒耶？鬀髮  是戒耶？著袈裟衣是戒耶？乞食是戒耶？正  命是戒耶？如是觀已，於身無所取，於修無  所著，於法無所住；過去已滅，未來未至，  現在空寂；無作業者，無受報者；此世不移動，  彼世不改變。此中何法名為梵行？梵行從何  處來？誰之所有？體為是誰？由誰而作？為是  有，為是無？為是色，為非色？為是受，為非受？  為是想，為非想？為是行，為非行？為是識，為  非識？如是觀察，梵行法不可得故，三世法  皆空寂故，意無取著故，心無障礙故，所行無  二故，方便自在故，受無相法故，觀無相法  故，知佛法平等故，具一切佛法故，如是名為  清淨梵行。\n\n**80-004**（`p`·CJK 193）：\n\n> 「復應修習十種法。何者為十？所  謂：處非處智、過現未來業報智、諸禪解脫三  昧智、諸根勝劣智、種種解智、種種界智、一切  至處道智、天眼無礙智、宿命無礙智、永斷習  氣智。於如來十力，一一觀察；一一力中，有無  量義，悉應諮問。聞已，應起大慈悲心，觀察眾  生而不捨離；思惟諸法，無有休息；行無上  業，不求果報；了知境界如幻如夢，如影如  響，亦如變化。若諸菩薩能與如是觀行相應，   於諸法中不生二解，一切佛法疾得現前，初  發心時即得阿耨多羅三藐三菩提，知一切  法即心自性，成就慧身，不由他悟。」\n\n### 2.14 长行品题·卷题\n\n> 梵行品第十六\n\n**（品题）80-000〔CJK6〕**·本品纯长行·无重颂。\n\n---\n\n## 三、旁参与前接\n\n### 3.1 前接·第十五品《十住品》\n\n本品紧承十住位次。「前是正位，今辨位中之行」（澄观来意第一义·T1735）——十住以位次为纲，梵行以通行为用。\n\n### 3.2 后接·第十七品《初发心功德品》\n\n本品末句「初發心時即得阿耨多羅三藐三菩提」为后品开宗；后品广叹发心功德，即由本句「即心自性」之旨衍出。\n\n### 3.3 旁参\n\n- 《贤首品》（第十二品）：「信为道元功德母」·与本品「初发心即得菩提」同一信位之极；\n- 《净行品》（第十一品）：一百四十一愿·善用其心·与本品「於諸法中不生二解」同归无住。\n\n---\n\n## 四、义理要点与名相\n\n### 4.1 十法推徵·离相之梵行\n\n本品以**遮诠**（否定式论证）显梵行体：于身·语·意三业与佛·法·僧三宝及戒——十法中觅梵行**皆不可得**。非断灭空，乃「**離相**」之真净（慧苑：「菩薩唯脩離相，名為梵行」）。声闻著相，反成染污（X0221：「聲聞梵行，乃是菩薩污行」）。\n\n### 4.2 十力修习·位中通行\n\n第二层转：虽梵行不可得，仍须**修习十种法**（即佛十力智境）——「一一觀察·一一力中有無量義·悉應諮問」，由智导悲：「應起大慈悲心·觀察眾生而不捨離」，行無上業不求果報·了如幻如夢如影如響。\n\n### 4.3 初发心即得菩提\n\n本品末句为**华严性起顿教**之经典依据——「初發心時即得阿耨多羅三藐三菩提」，非因位即果位之义（非无修无证），而是**因果同时·性起本具**。澄观：「夫心性豈更有他。若見有他安稱為悟。既曰心性自亦不存。寂而能知名為正覺」（T1735 疏末）。\n\n### 4.5 名相表\n\n| 名相 | 训释 | 出处 |\n|---|---|---|\n| 梵行（Brahmacariya） | 净行；离相为真梵 | 品题·T1735·X0221 |\n| 勃滥摩 | 梵音具译（=brahmacariya） | X0221 |\n| 十法所缘 | 身·身业·语·语业·意·意业·佛·法·僧·戒 | 80-003 |\n| 如来十力 | 处非处智乃至永断习气智 | 80-004 |\n| 正念天子 | 无念之念·第一义天 | T1739 |\n| 如幻如梦如影如响 | 四（五）喻·境界无实 | 80-004 |\n| 初发心即得菩提 | 因果同时·性起顿教 | 80-004 末句 |\n\n### 4.6 小结\n\n本品以「行」立教：十法推徵·离相乃真·修十力起悲·初发心即成正觉——**梵行无得而得，是名真梵行**〔本文判断〕。\n\n---\n\n## 五、注疏选要（诸家会读）\n\n### 5.1 澄观《大方广佛华严经疏》（T1735）——「梵行品第十六」段（卷第十六·疏卷二十）\n\n澄观本品疏窗 nsh @234245-239289·长 5,044（raw 口径·本疏于 CBETA 档中标卷第二十），科承**四门**：来意（六义）·释名·宗趣·释文。\n澄观疏窗口 T1735·NFKD 坐标 @234245-239289·raw len=5044·科判四门：来意（六义）·释名·宗趣·释文。\n\n以下按疏文自然段落分节照录（60 字标尺分段·段间空行），保留 CBETA 繁体原字形：\n\n> 梵行品第十六\n(從第十七經盡夜摩宮中偈讚品)\n四門之中初來意有六。一前是正位。今辨位中之行。故次來也。二前\n明諸位別行。\n> 今辨諸位通行。三前通道俗。今別顯出家所行。四前明\n隨相差別。今顯會緣入實。五為顯入住之因。謂自他二種梵行淨故。\n則入初住\n> 也。六別顯初住成佛。則類前諸位。位位成佛不由他悟之相\n也。具上諸意有此品來。二釋名者。梵是西域之音。具云勃嚂摩。此\n翻為\n> 淨。揀上淨行立梵行名。離染中極故名為梵。即梵為行故名梵\n行。持業釋也。亦有云。真境為梵智契為行。或涅槃為梵修因為行。\n此\n> 二依主釋。梵行以何為體。體略有三。一者即戒。戒能防非故得稱\n梵。二者四等。三者是慧。涅槃五行中。梵行即四無量。亦七善知。\n>\n今此品中具含三義。然此三各二。戒有二者。一隨相二離相。今文即\n相無相。依如來教染衣出家乞食正命。是隨相也。於修無所著。\n> 則戒\n相如虛空。即離相也。四等二者。一有緣二無緣。生緣法緣皆名為\n有。今即緣無緣觀察眾生。\n> 而不捨離是有緣也。了知境界如幻如夢。\n即無緣也。慧有二者。一有分別二無分別。今即分別是無分別。謂於\n十法一一推徵。是分別\n> 也。觀無相法了知平等離念契玄。即無分別\n也。上三中二義。各初義通凡小。後義唯大乘。此二不二為實教梵\n行。若一行具一切佛法\n> 。方是華嚴之梵行也。梵即是淨。但以性淨故\n即行淨。行淨故則智慧淨。智慧淨故則心淨。心淨故一切功德淨。乃\n至成佛功歸於行。\n> 故云淨行。然前信中之淨。隨事造修悲智兼導。至\n此純熟了心自性。悲智無二故。小有不同。三宗趣者。即以悲智無二\n事理雙修觀行\n> 為宗。疾滿一切佛法為趣。第四釋文。文分為二。先問\n後答。今初亦二。先敘問答之人。正念天子問者。天者淨也。表所問\n事理染相\n> 絕故。梵依天行而得成故。念與無念二而不二。為正念也。\n法慧答者。表巧慧窮法。後佛子下。正顯問端。於中先舉所問境。次\n云何\n> 下。述所問相。問相有二。一問行淨所因。謂隨相持戒之梵行。\n云何得離相之清淨。故不應言淨劣梵也。二從菩薩下。問因所得果。\n\n> 第二法慧下答。答前二問即為二別。先答行淨所因。後若諸菩薩下。\n答因所成果。斯即觀成利益也。今初分二。先明自行清淨即離相之\n> 戒\n成。後復應修習下。明利他之行淨。即無緣之四等二種智慧。通在兩\n文為能淨故前中分四。一總示所應。二所謂下。列名略釋。三\n> 若身是\n下。廣陳修相。四如是觀已下。顯觀成相。今初。作意者。不墮無記\n故。觀察者。以慧推求\n> 故。二中初列十法。即列上所緣之境。後應如\n是觀下。釋上作意觀察所以。唯令觀十法者。一為成圓數。二梵行緣\n體不離此十。謂身\n> 口意三是行所依處。三業行因三寶行緣。戒謂行\n體。問以善三業歸於三寶。得受隨戒何要觀耶。答若不觀察。取相堅\n持同權小故。見\n> 戒從緣起心持戒為迷倒故。云何觀耶。廣在下文。今\n略釋之。意云十中隨一。若是餘九即非明假眾緣。以顯無性。況十中\n各十。一一\n> 推徵。相盡理現名真梵行。第三廣陳修相。即尋伺觀也。\n十法即為十段。前六通染。是故但約染淨相違。名非梵行。亦不析破\n彼法自\n> 體。後四唯淨順於梵行故。分析體空何有梵行。十中各先總牒\n觀境。後以十事徵顯其非。今初身具中。一非善者。身通不善體非順\n理\n> 。梵行善性體能順理。二法既殊明身非梵行。梵行何在他。皆倣\n此。當知梵行之言貫通諸句。二體是無記非可軌法。三飲食資成。四\n\n> 自相臭惡。五自性不淨。六種子住處等皆悉可厭。七四蛇違反。八業\n惑所依故。九是身無知。又要當死究竟不淨故。十八萬戶蟲戶有九\n>\n億。全以蟲聚成其身故。今此梵行體是可軌性。能澄淨芬馨清潔。賢\n聖所欣順法順教。體無雜染。與智相應眾善集成。彼豈當是於十\n> 事求\n梵行叵得。當知梵行離相離性下九準之。二身業者。身之作用名為身\n業。語意亦然。十中四儀\n> 無記。餘六通善惡故非梵行。三語具十事。\n初一語體次五語緣。謂風觸七處而出於聲。此略無臍輪牙齒。後吐納\n等四。是辨語相十事\n> 。望業皆是語體。此唯無記故非梵行。四語業十\n事通善惡故。亦非梵行。安立說者謂假施設。隨俗說者。隨世名言。\n餘可思準。第五\n> 觀意十事。覺是尋求觀是伺察。覺麁觀細是不定法。\n言分別者。以慧揀擇。三分別中是自性分別。七分別中任運分別。種\n種分別者。\n> 三中隨念計度故。七中餘六。謂有相無相尋求伺察染污不\n染污故。憶念者。追憶曾習唯緣過去。思惟者。以慧籌度通去來今。\n並有一\n> 多各成二種。上六皆別境攝。種種憶念義兼惡作。幻術通思通\n念。眠是不定意識亦行。但取境昧略。輕眠有夢。亦通善惡覺之勢\n故。\n> 此十是心所。不離心故同名意也。徵破準前。第六觀意業十事。\n皆意之用故名為業。約遍行五徵之。一思二想次四是觸。後四是受。\n\n> 作意一種總遍十段。故前云作意觀察。即上四段亦各一蘊。此中思等\n與意何別。但思等心所有二義故。一扶持心王屬前所攝。二依心起\n>\n用。屬此位收故。多從受境以辨。若欲破者。既約遍行通於三性故。\n非梵行餘準前知。第七觀佛十事觀於三身。若依小乘。初五法身\n> 。以\n無漏戒等及眷屬無漏五蘊。為法身故。次二報身。以三祇百劫所修感\n相好故。次一化身。神通化現故。業行通為三身之因。果報\n> 通語三身\n之果。若依大乘。前八皆是化身。後一報身。業行通語二身之因。涅\n槃是果離繫果故。菩\n> 提是報報本願故。今一一推徵。若一是佛餘者應\n非。一一皆佛則有多佛。和合成佛則無自性。故中論云。非陰。不離\n陰。此彼不相在\n> 。如來不有陰。何處有如來。陰合為如來。則無有自\n性。進退推求佛體寂滅。尚非是有豈當是無。邪見深厚者。則說無如\n來。諸法性\n> 空中思惟亦不可。是知真佛既超心境。依斯成行行豈相\n耶。第八觀法。但有八句者。應梵本脫漏。豈餘九皆十此獨八耶。若\n約有所表\n> 者。表除九十八使故。加十總觀破百八煩惱故。然法有教理\n行果。今就後三略能詮故。八中初一理法。次一果法。餘六通三約理\n可知\n> 。約行者。謂不善不生妄想不起。言語道斷智無分別。定無行處\n如智兩冥。此六究竟即是果相。今推徵云。若一是法餘則應非。一一\n\n> 皆爾。若謂總。是則和合不實。隨得一法即應得餘。和合而成則無和\n合。若以無合而為法者。無合之法豈當有耶。又此舉法皆舉寂滅不\n> 生\n等者。欲明一一自虛。法即非法梵行何從。第九觀僧十事。前八約人\n後二就德。且依小說。言預流者。始超凡地預聖流故。一來者\n> 。修惑\n未盡。一度來生欲界中故。不還者。欲界惑盡。更不還來生欲界故。\n阿羅漢者。此有三義。一名殺賊。已斷一切諸煩惱故。二\n> 名不生。三\n界之生永已盡故。三名為應。應受人天大供養故。有四向者。向於果\n故。謂斷三界見惑\n> 有十六心。至第十五道類忍時。名初果向。至第十\n六即入修道。名須陀洹果。欲界修惑分為九品。斷至五二向。斷六一\n來果。斷七或\n> 八品名第三果向。九品全斷盡即得不還果。次斷上二界\n修惑。乃至有頂八品惑盡。名阿羅漢向。三界見修都盡得阿羅漢果。\n今此欲明\n> 梵行。粗陳名目。若廣引婆沙俱舍雜集瑜伽則清淨梵行有累\n名數。力有餘者付在說時。此中觀意。謂僧名和合而有八輩。一若是\n僧餘\n> 則應非。又一一別辨則無眾義。集此無眾豈成眾耶。況於入流無\n所入等。以無為法而有差別。則其體自虛。後二就德。德若是僧何須\n\n> 八輩離法無人離人無法。一一窮究為僧者。誰僧體既虛梵行安寄。第\n十觀戒。戒為行體。亦賴眾緣。從緣成戒戒性如空。起心持者。是\n> 謂\n迷倒。無善無威儀不雜二乘心。是名持淨戒。此戒乃名真梵行也。其\n中十事。前八是受後二是隨。受中壇場得戒之處。問淨教儀並\n> 教授\n師。三說羯磨即得戒法。和尚得戒根本。阿闍黎者。正即二師。義兼\n七證。剃髮著衣是戒外相。隨中乞食四依之一。正命。謂離\n> 四邪五\n邪。若依菩薩戒類例上文。具如善戒經。及彌勒菩薩所造。受菩薩戒\n羯磨所辨。此上十境。正約菩薩傍兼聲聞。設依小受修觀\n> 則為菩薩。\n即如此方。又善戒經。欲受菩薩戒。皆先具受前之三戒。故所觀境通\n於大小。其能觀智唯實教大乘。上來尋伺觀竟。第四\n> 如是觀下。辨觀\n成之相。望前尋伺即為觀蓋。望後得正覺果。此但如實觀成。文分為\n三。初約所觀\n> 十境如實觀成。二此中何法下。約所成梵行如實觀成。\n三如是觀察下。結成梵行清淨之相。今初。有十句。初六句明三輪清\n淨觀。一\n> 不取能持戒眾生。言身兼口意也。二不著所修行事。三不住\n於戒法。亦即是事。亦通不住前法。次三句。以三時門明不住持戒\n時。兼\n> 釋上不取等言。三世推求不可得故。已滅未至空理易明。現在\n多滯偏語空寂。以剎那不住過未分之。故空寂也。次二句明二空觀\n成。\n> 作受者。人業報是法。後二句。以不遷理釋成因果空義。此世不\n移動。謂不從今至後。彼世不改變。謂不從後至今。是為因自昔滅無\n\n> 力感果。果不俱因無力酬因。何有報受。以物各性住性本空故。二約\n所成梵行如實觀成者。有十一句。初句總顯無名。十已空故。餘句\n> 為\n別。一不從十生。二非屬身等。皆十已空故。上二句約緣以徵。次二\n句就體以徵。初句明離前十外無別無作戒體。十外有體不假前\n> 十。次\n句亦無有作。作之受隨前已空故。次句雙非顯中。無性防非故。次五\n句約五陰。有二意。一就戒體。有說。無作戒體體即是色\n> 。有說。非\n色非心。五蘊之內。初一是色後四是心。今言為是色者。顯非是色。\n以其所立無表依表生。表色無表色。今明觀意。表色\n> 尚空。何有無\n表。為非色者。顯非非色也。從色生於戒尚不名為色。從色生於戒豈\n是非色耶。言為\n> 是識者。意顯非心。若言是心者。一切皆有心應常有\n梵行。是知非心也。若言非心木石應梵行。是知非非心也。若言非色\n非心行蘊攝\n> 者。但是行蘊應皆名戒。二就修行梵行不離五蘊。若即蘊\n者。有蘊皆梵行。若離蘊者。豈是我梵行。故後結云皆不可得。第三\n結成梵\n> 行清淨之相。以無得故。文有十一句。初句為總。次九句別顯\n無得。一由上三世皆空故。二由於身無所取。於修無所著故。三言心\n無\n> 障礙者。即前於法無所住故。於風行空無有礙故。四作受二念不現\n行故。五雖空不礙涉有故。六七涉有不迷於空故。受觀無相。受謂忍\n>\n可於心。觀謂起用於境。八結歸平等。大般若曼殊室利分云。我不見\n有一法非佛法者故。無法不等。九一收一切方顯具德圓融。末後\n> 一句\n總以結酬。由上義故名淨梵行。上辨自利行淨竟。第二復應下。明利\n他行淨。文分為二。初深觀果智。即利他之方。後慈念眾生\n> 成無緣四\n等。是則自利利他上求下化。皆具足也。今初文三。初舉法應修謂梵\n行體也。緣體宛然一心湛寂。梵行用也。不思不造萬行\n> 沸騰故。不但\n心觀圓明。復應廣集佛智。二何者下。徵起別列可知。三於如來下。\n結勸廣學。第二聞已下。慈念眾生成無緣四等。文\n> 有四句。一雙起慈\n悲。如犢母隨子。二思惟藥病成大法喜。三即行無求以成大捨。四智\n了諸境導成無緣。此中五喻廣如十忍然釋有通\n> 別。別者如幻似有不實\n故。似有故假不實故空。此二不二成中道智。如夢者。虛妄見故。如\n影者。\n> 從業緣現故。如響者。屬諸因緣故。如變化者。須臾變滅故。\n若如是了境。即終日化而無化。亦為眾生說如斯法。是謂利他梵行清\n淨\n> 也。第二大段若諸菩薩下。答因所成果問。文中分二。先牒前因\n深。初總指前文。不生二解則舉其要。即所行無二。二一切下。酬其\n\n> 果滿。先標後釋。今初。由理觀深玄。了性具足。萬行齊修故。令大\n果無邊德用現證在。即一切明其果大。疾現語其速證。後初發心下\n>\n釋。先釋疾現之言。後釋現前之相。今初。上言疾得疾在何時。故云\n初發心時。何法現前謂無上菩提也。後知一切下。釋現前之相。\n> 亦是\n出其所因。何者。夫初心為始正覺為終。何以初心便成正覺。故今釋\n云知一切法即心自性故。覺法自性即名為佛。故下經云。佛\n> 心豈有他\n正覺覺世間。斯良證也。斯則發者。是開發之發非發起之發也。何謂\n現前之相。夫佛智非深情迷謂遠。情亡智現則一體非遙\n> 。既言知一切\n法。即心自性。則知此心即一切法性。今理現自心。即心之性已備無\n邊之德矣。成就慧身者。上觀法盡也。正法當興今\n> 諸見亡也。佛智爰\n起。覺心則理現。理現則智圓。若鏡淨明生。非前非後非新非故。寂\n照湛然不由他悟者。成上慧身。即無師自然智\n> 也。又不由他悟是自覺\n也。知一切法是覺他也。成就慧身為覺滿也。成就慧身必資理發。見\n夫心性\n> 豈更有他。若見有他安稱為悟。既曰心性自亦不存。寂而能知\n名為正覺。豈唯定之方寸。不取則於人哉。況初後圓融不待言也。梵\n行\n> 品竟。\n\n### 5.2 法藏《大方广佛华严经探玄记》（T1733）——「梵行品第十二」段（卷第十一·六十品次）\n\n法藏释名三义：「離妄念之染故云梵·會無我理故云行」·六别释净梵之异。\n法藏窗口 T1733·NFKD @len=2798·释名三义·六别辨净梵之异：\n\n> 梵行品第十二\n初釋名者。離妄念之染故云梵。會無我理故云行。此行即梵。二離染\n中極名梵即真境也。智能證此故云行。三涅槃\n> 果為梵。以寂靜故。修\n因為行。此二梵之行。淨與梵何別者有六別。一約報。欲天為淨色天\n為\n> 梵。二約人。在家戒是淨。出家戒為梵。三行位。信中修為淨行。\n入位已去修為梵行。四約二利。三學自利為淨行。四等利他為梵\n> 行。\n此如涅槃經說。五約二行。隨事造修施戒等為淨行。離念契玄為梵\n行。如文。六約因果。涅槃為淨。道諦行為梵。經云梵行\n> 已立。是\n也。\n二來意者有五。一前位次行。謂前明正位今辨成位之行。故文云何修\n習梵行具足十住。二前明正位今辨依位起行\n> 。三前別此通。謂前十住\n之中各修一種別行。今辨諸位中同行之行。四前通此別。謂前辨位\n通。今別明出家人行。五前顯位相差\n> 別。今會緣入實。即前相後體故\n也。\n三宗趣者以無念正行為宗。所成十住位及速成佛等為趣。無念理觀略\n作五門\n(云云)\n\n> 。\n四釋文有二。初問後答。問中明受離染法之器故寄天子。離妄念器方\n能受故名正念。具下文天光女文也。文中初舉事信家。非\n> 家是空法非\n家也。二彼諸下正問有三。初問修梵行。二成位。三得果。答中所以\n法慧說者以照\n> 法之慧方能示法故也。於中亦三。初答修梵行問。二又\n復修習下答成位問。三如是觀者下答得果問。又亦可此品重更釋成上\n十住\n> 中初住之義。於中三。謂初釋上發心。二釋發心所得十力。三釋\n上自悟得果會同法界。是故即此初住具攝十住也。初中有四。一明\n> 尋\n思觀。二又知過去下明如實觀。三菩薩正念下觀成益相。四是名下結\n觀名。初中三。先舉十法為所觀。二應如是觀下以理徵破\n> 顯梵行真\n理。三當如是下結。何故但就十法觀者。以攝法略盡故。謂身口意是\n有為果。三業是彼因。佛法是出世果。僧戒是彼因\n> 。又出家人修出世\n行要依此十法方成梵行。謂三寶及戒是四不壞淨境。即所信所入也。\n身口意是能修行具。即能信能入也。三業\n> 是對境所修所成行。今推求\n此梵行在何法中。既求不得。即相盡理顯方為真實梵行。是故文中約\n此十法唯徵梵行不徵餘法。文中\n> 二。先以理案定。二若身是下縱破顯\n非。又初是總後別。初略後廣。此中徵覈十法。即為十初中若身是梵\n行者定其所立。下以理\n> 推徵。謂梵既淨法。身是雜穢故非也。以此身\n等六事是通染淨法故。但約染淨相違明非梵行。不破彼六之自體。後\n四是淨法。順\n> 梵行故。即別推折以顯真理。身中八句。初一總餘七\n別。一無可軌則非是出世之法。二飲食資成。三惡氣熢勃。四具三十\n六物。\n> 五垢污塵染。六邪命自養。七諸蟲唼食。依觀佛三昧經佛將成\n道魔來惱。時佛以白毫擬之。令彼\n> 魔女自見身內膿囊涕唾九孔根本生\n藏熟藏迴腑宛轉踊生諸蟲。有八萬戶戶有九億諸小蟲等遊戲走入小腸\n中。張口上向。大蟲遊戲\n> 入大腸中張口亦爾。唼食藏髓脈。生蟲細於\n秋毫數甚多。其女見此即便嘔吐等。又小乘中說。蟲頭向內蟲尾向\n外。編作人皮。又\n> 此蟲是觀境故雖實有之作蟲觀。時方見。如白骨等\n亦觀時見也。小乘即實。初教即空等準之。上來但是縱破。故云當知\n梵行則為\n> 蟲等。若具應云蟲等既非梵行。明知梵行不即是身。如身無\n梵餘門亦爾。以依此等成梵行是故於此十法求梵不得。離此十法亦求\n\n> 不得故。下文云何等是梵行。梵行法為在何處等。其意如此。隨文準\n知。\n二身業可知。\n三口中心觸者。是觸數緣境起言助發口\n> 業。俱舍論十六種觸中名增語\n觸。\n四口業中語言與前何別者。前約報體。後約業用故別也。實論口體屬\n身分攝。但取能發語邊\n> 名語。所發語法名語業。是故新翻為語業。古\n譯就相名口也。作無作是語業體中表無表義也。\n\n> 五意中幻夢者以睡中意識行故。夢中所見能所等事皆心幻作故也。此\n中覺觀等既是心法。猶是舉數以徵王也。\n六意業中約遍行五\n> 徵之。以是根本動作故。想是想數。施設是思。寒\n熱飢渴是觸。苦等是受。略無作意也。上來但染淨相反顯非梵。不待\n細破。後\n> 四順梵故別破。細折方顯真理故不同也。\n第七佛中。一約五陰。二約相好。三約神通業報者示金鎗等也。此上\n三處皆依前起後次\n> 第徵之。\n八法中六句。一淨教。二理果。三約緣生不生。四就體實不實。五就\n情為虛妄。六成壞為合散。此中通有三義。一淨謂\n> 初二句。二染謂虛\n妄。三非染非淨謂所餘句。以約三性隨見一分餘分性不異故俱非法\n也。又約執故。梁攝論云。計涅槃以無生寂\n> 靜為體能離三苦為用等。\n皆成法我及我所執。是故俱非法也。\n九僧中。一約位求僧。謂四向四果以同證無我。和合者誰。故無僧\n>\n也。二約德用求。謂三明六通。三約根求。謂鈍根羅漢假託時處方得\n解脫名時脫。利根反此名非時脫。\n十戒中尋思可知。上來是四尋思方便亦名求智。一以名求。二義求。\n三自性求。四差別求。\n自下第二明如實智觀。於\n> 中六。初徵梵行所依時。謂三世皆空。初總\n觀後別釋。謂此現在法無體可住故。無有流至過去世中。又由無體故\n無可續流至未來\n> 世。又以過去滅無故無物可相續流至於現在。又以未\n來無體故無法可起令至於現在。剎那前後當知亦爾。二徵梵行體。三\n徵梵行\n> 所依處。謂於上十法何者是梵。梵在何處。四徵梵行主。五約\n有無徵。六約五陰徵。第三觀成利益中。初觀成中先法說。如上約三\n>\n世觀十法皆空。故云分別三世諸法平等。後喻況。可知。二如是下明\n益相有二。初妄不礙心益。謂云何得不礙。以不取相故。何\n> 因不取。\n以無性故。二洞照法界益。法喻可知。又亦可前觀身等六法平等如\n空。後觀佛等四法如空。第四結名可知。答初問竟。\n> 自下答第二問。\n由前觀行成故更增修勝行入十住位。文中有三。初深觀果智。二增長\n大悲。三悉分別下以理導前二。即是三心三\n> 戒成三德三身等也。以彼\n上文於初住中得十力分故。今行成入位。最初辨也。初二文可知。第\n三內二。初法後喻。法中二。先以\n> 理導悲。謂不捨寂滅不捨眾生。以\n空有不二是眾生故。般若大悲是一心故。二以理導果。謂行無上業不\n求報者。以即空故不求。以不壞故常行。亦是止觀俱行空有不滯中道\n行也。何因得如此。以觀諸法如幻等故。無體如幻。\n> 現實如夢。有用\n如電。緣聚如響。成事如化。答第三問中二。初牒前二起後。起後中\n兩重顯少因得大果於中各二。先標後釋。初\n> 標中以少方便是因。疾得\n等是果。釋中何以少因而疾得大果。釋以常樂觀悲智空有等無二法\n故。是故疾得。故云斯有是處也。第\n> 二重中。標者初發心時是因。便\n成正覺是果。亦是轉釋前。謂前云疾得佛果未知何時名疾得。今釋發\n心時即得故。下云初發心菩\n> 薩即是佛故悉與三世諸如來等。此明行滿\n入位時即得普賢位故。一位即一切位乃至佛果無不圓備。故云正覺。\n下釋何因得如此。\n> 以知一切真實者。顯理圓也。具足慧身者智德備\n也。不由他悟者內自開覺也。豈是因中說果耳。此一乘普賢行位。因\n果圓融相即\n> 無礙故致然也。宜須思準之。\n\n### 5.2' 智俨《华严经搜玄分齐通智方轨》（T1732）——「梵行品第十二」段\n\n智俨四门同上·释名二种：「行中上淨故名梵行」·报与方便二梵。\n\n### 5.2'' 慧苑《续华严经略疏刊定记》（X0221）——「梵行品第十六」段（卷第十三）\n\n慧苑四门同前·释名：**相与离相二种**——「聲聞唯依相脩名為梵行，菩薩唯脩離相名為梵行。是以聲聞梵行乃是菩薩污行」·推徵显共通义。\n慧苑窗口 X0221·len=7657·相与离相二种·声闻梵行是菩萨污行·推徵显共通义：\n\n> 梵行品第十六\n將釋此品。四門同前。\n初釋名者。梵是梵音。具云勃濫摩。此翻為淨行。淨行有二種。謂相\n及離相。聲聞唯依相\n> 脩。名為梵行。菩薩唯脩離相。名為梵行。是以\n聲聞梵行。乃是菩薩污行。由執見故。但是假名。非真梵行。是故文\n中於戒等推\n> 徵。顯共無性。方為梵行。此即隨順觀世諦入第一義諦。\n所推二諦非即離境。是淨也。能推二諦非即離心。是行也。而此心境\n亦\n> 非即離。非即故梵之行。依主釋也。非離故梵即行。持業釋也。故\n文云。菩薩脩梵行時。應以十法而為所緣作意觀察。\n二來意中\n> 三。一前品明諸住別行。今顯諸住通行。故來也。二前明正\n位。今辨成位之行。故來也。三前品諸住之末。皆云有所聞法。即自\n\n>\n開解。不由他教。雖標其言。未顯其義。今此顯故來也。\n三宗趣者。以會相歸性為宗。速達無上\n> 菩提為趣。\n四釋文中二。先問。後法慧菩薩言下答。前中二。先經家標能所問\n人。後佛子下正顯問端。前中能問是正念天子者。\n> 正念表此所明能觀\n之心離斷常見故。天子者。表此所明所觀境淨故。法慧菩薩為所問\n者。謂以融真俗法之巧慧。答前問故。\n後\n> 正顯問端中三。一明能脩觀行人。謂出家菩薩。二云何下問得成梵\n行清淨所因。三從菩薩下問從因得果。\n後法慧答中二。初答第\n> 二問。後若諸菩薩下答第三問。何故不答今問\n者。初問通在後二答故。前中二。初總據能脩行人觀察十法為得梵行\n清淨所因。後\n> 所謂下別顯所脩行法。前中云十法為所緣者。是所觀境\n也。言作意觀察者。是能觀心也。後別顯所脩行法中二。初明自分行\n法。\n> 後復應脩習下辨勝進行法。前中二。先明對緣脩梵行觀。後如是\n觀\n已\n下辨觀成利益。前中二。先總顯。後若身下分別辨。\n<\n前中二。初列十法為觀境。後應如是下明觀心對境。略顯推徵。問何\n要觀此十法。顯梵行耶。\n答\n> 此十法是梵行緣故。謂梵行依戒。戒依眾緣。即自身三業。業具為\n能受體。三寶為能受緣。戒是所受法。若不觀察此十各無自性。\n> 但取\n相堅持為梵行者。使同權小無真梵行。是故要常觀此十法。問二乘法\n執持戒可使不同菩薩權教大乘脩二空戒望實教脩持。豈\n> 差別邪。\n答權大乘中。二空但依所執性說。若因緣生法似有不無。梵行依戒。\n戒從眾緣。即是彼立緣生不無之法。不無意存。不\n> 同所執。然不與圓\n成非一非異。故此不無。乃是理外之事。於能所護持。見有見無。以\n為梵行。故成唯識云。若不執菩提有情實\n> 有。無由發起猛利悲願。是\n故今此一一推徵。相盡現理為真梵行。後別辨中。依觀十境。即為十\n段。\n第一觀身中二。先牒。後\n> 破。破中十事。一云則為非善者。梵行是諸\n善所依。身是不善承所依故。二法既殊。明知身非梵行。梵行何在。\n二非法者。梵行\n> 可軌。身非可軌。是無記故。明知此身不是梵行。梵\n行何在。三渾濁者。梵行是至信出離所成。身是不信真實義心所得。\n是故身非梵行。若不爾者。則應世間一切迷其實義愚。而持戒者皆其\n梵行。准此。若違實教而持戒者。\n> 皆無真梵行也。四臭惡者。梵行戒\n香芬美。身是惑苦臭惡故。身非梵行。五不淨者。梵行清淨。身令不\n淨。謂種子住處自相自性\n> 畢竟故。身非梵行。六可厭者。梵行樂因。\n可以願求。身是苦果。如前不淨。可以厭捨。故非梵行。七違逆者。\n梵行是順勝義諦\n> 脩。身是違勝義諦得。故身非梵行。八雜染者。梵行\n純淨所成。身是雜染業起。故身非梵行。九死屍者。謂身無所知。無\n恩報等\n> 。同於死屍。有所覺知。屬身業故。死屍無知。既無梵行。身\n無知故無梵行也。十蟲聚者。依此經十藏品及觀佛三昧海經。皆說身\n>\n中有八萬戶蟲。小宗中說身即蟲聚故。觀佛三昧經云。身中有八萬戶\n蟲。戶有九億小蟲。大婆沙說。人身皮肉。並是蟲聚。蟲頭\n> 在內食人\n所食。蟲尾在外辨作人皮。今徵破云。身既蟲聚。身是梵行。蟲亦即\n身。蟲應梵行。蟲既不爾。身云何然。當知其身都\n> 非梵行。梵行何\n在。\n第二觀身業中二。先牒後破。前中身之作用名為身業。破中十事。言\n行住等者。謂住等並是身作用相。而\n> 此作用。皆依於身。前徵身無業\n依何起。說業所作。各具眾緣。一一之中何者是業。餘如前說。\n>\n第三語具十事。破中音聲風息者。謂風擊七處所發音聲。又胷舌唯等\n皆語業具。徵破云。此諸緣具。一一之中誰是具邪。若一是\n> 者。應不\n待餘。餘亦如是。若各相待則各無具。若不相待。亦無有具。具既不\n有。依何起業為受戒餘。戒緣無故則無無有戒。有\n> 戒故無梵行也。\n第四語業十事。破中安立說者。謂假施設說諸法故。隨俗說者。隨世\n名言說諸法故。顯了說者。離隱密相說諸法\n> 故。餘文可知。徵破云。\n前文徵破業具尚無。況此處有作業可得。又業一一各眾緣成。一一緣\n中何者是業。業既無矣。乃至何有\n> 梵行。\n第五觀意十事。破中覺觀者。覺麤觀細。思慧為性。令身安住不安住\n為相。分別者三分別中自性故。七分別中任運故。種\n> 種分別者。隨念\n計度故。有相無相尋求伺察染污不染污故。憶念者。於曾更境。但追\n記一故。種種憶念者。於多追記故。思惟者\n> 。於一籌度故。種種思惟\n者。於多籌度故。幻術者。能變現故。眠是四不定中眠數。輕眠有\n夢。取境昧略。徵破云。此中意是心\n> 王。餘是心所為業之具。既具多\n法。一一法中誰是具邪。若王是具。應不待所。若所是具。應不待\n王。諸所相望當知亦爾。推具\n> 既無。以何作業。成能受戒體。受體既\n無則無有戒。戒無故無梵行也。\n第六觀意業十事。破中\n> 分四。初思數。思能造業故。次一想數。是意\n加行。令意成業根本故。次四解數。識合根境。由業引境故。後四受\n數。亦由業引\n> 故。此亦業眷屬也。成唯識云。業之眷屬。亦立業名\n故。徵破云。前破業具體無。業\n已\n非有。況業眾法。令一一皆無。餘\n如\n> 前說。問寒熱等觸在五識地。今何別在意業中邪。\n答此由三義。一由相應義。謂意識與五有同緣境故。二由意識用強。\n有彼同分\n> 緣故。三由意識於極樂地有樂觸故。純苦趣中意有苦故。寒\n熱准故。問前業具中。有覺觀思憶等。後業中亦說思等。有何差別。\n\n> 答思等皆有二相。一體。二用。體謂自性。與王同是業之具故。用謂\n作用。與王相應。同一所緣而作業故。各有所據。故別列也。\n>\n第七觀佛者。受菩薩戒及聲聞戒。皆先歸三寶。為根本得戒所依。依\n戒有梵行。今約聲聞戒依。觀察梵行。所以者何。聲聞戒中\n> 不亡法執\n有無見等故。此徵破。破中十事。初五五蘊者。聲聞乘中。以無漏戒\n定慧解脫解脫知見及眷屬無漏五蘊。為佛法身。以\n> 百劫脩相好業。感\n三十二相八十種好有漏報。為佛報身。以神通變化。隨機應現種種形\n類。為佛化身。聲香味觸四塵為體。徵破\n> 云。若佛是梵行者。佛三身\n中各具多法。一一法中何者是佛。若一是佛。應不待餘。餘亦如是。\n>\n若各相待則無有佛。若不相待亦無有佛。佛既非有。依誰有戒。戒既\n不有梵行何憑。二相者。謂三十二相。一一相中何者是佛。\n> 餘如前\n說。三好者。謂八十種好。一一好中何者是佛。餘如前說。四神通\n者。謂六神通。初神境者。神謂等持不測之義。轉變外\n> 事難測量故。\n外事名境。二天眼者。眼謂照矚。天即四禪。彼界大造遠見無[得-彳]\n故。三天耳者。耳謂聽聞。天如前說。遠\n> 聞無[得-彳]故。四他心者。\n緣他心王。雖亦緣所。從定加行意樂立名。五宿住者。緣宿多生五蘊\n所住。六漏盡者。煩惱種現\n> 俱亡故。謂漏盡者。由通力能知他漏盡\n故。或漏盡者身中起通故。上並各於所緣。無倒了達。妙用無礙。俱\n名為通。徵破云。一\n> 一通中具有多法。一一法內何者是通。通既非\n有。將何為佛。佛尚不有。依何得戒。餘如前說。五行業者。謂經三\n大劫阿僧仚耶\n> 。脩菩薩行。六度四攝四無[得-彳]等無邊行業。徵破\n云。於彼諸行。一一之中何者是佛。遍推無佛。況有戒邪。餘如前\n說。\n> 六果報者。謂智斷二果。智有二種。一者盡智。二無生智。盡智\n者。謂正自智我\n已\n知苦斷集證滅脩道。無生智者。謂正自智我\n>\n已\n知苦\n斷集證滅。復知苦斷集證滅脩道。不應更復知苦斷集證滅脩道。徵破\n云。若有苦可知。乃至有道可脩。則無智果。智\n> 果既無。將何為佛。\n佛既非有。戒依誰得。戒既不有。梵行何從。所以者何。無智無得方\n得智\n> 果故。斷有二種。一者有餘依。二無餘依。依謂惑滅所得擇滅無\n為。作有餘依體。身智若滅。但是無常無記滅故。不待擇滅。重難\n> 前\n擇滅。作無餘依體。今徵破云。若有煩惱擇令斷滅。得斷果者。則無\n斷果。所以者何。無能所斷得斷果故。既有能所斷。則無\n> 斷果。斷果\n既無。將何為佛。佛既不有。依誰得戒。餘如前說。或彼有餘無有涅\n槃。涅槃唯屬彼有苦故。又無餘依亦無涅槃。無\n> 明住地及無漏業意生\n身等煩惱業報三餘在故。如佛性論第三中說。既無涅槃何名為佛。佛\n既非有。從誰得戒。何有梵行。\n第八\n> 觀法八事。破中初一理法。次三果法。次二教法。後二行法。徵\n破云。若理法是梵行者。則無梵行。以擇滅理有多數量。一一數中\n> 誰\n是理法。餘如前說。次三果法中。初一斷果。後二智果。斷果如前涅\n槃中說。後智果中。不生者無生智也。不起者盡智也。釋\n> 相徵破。並\n如前說。次二教法中。初約所說。後約能說。前中徵破云。所說教義\n字名句等。眾法合成而有所說。於中一一所說皆\n> 無。若即以此不可說\n法。為梵行者。則梵行非有。餘如前說。後能說中。無分別者。分別\n有二種。一言說。二尋伺。言加行故。\n> 而此能說加行及果。眾法合\n成。一一法中無能分別。若以如是無分別說為梵行者。則梵行非有。\n>\n餘如前說。後二行法中。初約行體。後約行用。前中依無所說也。教\n隨成行故。則行無所行。若以如是無所行法為梵行者。則梵\n> 行非有。\n餘如前說。後行用中。合集生果。為行業用。行體尚無。用依何起。\n餘如前說。\n第九觀僧十事。破中前八約名體破。\n> 後二約德用破。前中敘四向及\n果。諸說雖異。大意略同雜集婆沙。恐繁不述。今依瑜伽聲聞地。略\n顯其相。約般若以會觀。謂意\n> 無所入。名入流等。於中。先約名。後\n約體。前中初預流向者。謂見道位有二種。一真見道。謂世第一法無\n間。彼惑滅增上。引\n> 無分別智生。絕諸戲論。證人無我。所顯真性。\n依出世智也。二相見道。謂由前證真如\n已\n。欲差別說自所證處。即復\n擬議。\n> 彼真見道。作十六種。謂苦法忍。乃至道類智。總斷見道所斷\n一百一十二根本煩惱。謂迷欲界四諦。各十隨眠。色無色界各三十\n\n> 六。各除嗔故。此前十五心。皆為趣向所求果故。名之為向。徵破\n云。真見道中。絕諸戲論。不可名言。何有向邪。相見道中所斷\n> 迷諦\n惑之品數。皆是擬議。非如實故。亦無有向。又能所斷相對。及前後\n相望。皆從緣合。無一獨立。故無一法名為向者。既無\n> 有向。以誰為\n僧。既無有僧。梵行何託。二云預流果者。謂第十六心道類智。緣道\n諦故。得預\n> 聖流。名為預流。道類智生。得預流果。入脩道也。徵破\n云。果不自果。因向成果。向既不立。果何有邪。有因道類智生方制\n此\n> 果。又能所斷等眾緣合故。立此果名。故非有也。果既非有。說誰\n為僧。既無有僧。梵行何寄而得立邪。三云一來向者。謂脩道中\n>\n已\n斷\n欲界五品煩惱。安住彼道。即第六品無[得-彳]道。二義徵破。一斷惑\n五品合共成故。二住第六品無[得-彳]道。\n> 相望成故。結破如前。四云\n一來果者。謂\n已\n斷欲第六品惑安住彼道。即第六品解脫道。二義徵\n破。一約能所因故。二約能所\n> 住道。緣成離作。無有此果。結如前\n說。五云不還向者。謂脩道中\n已\n斷欲界七八品惑安住彼道。即第九品\n無[得-彳]道。\n> 二義徵破。准前向中。結亦准之。六云不還果者。謂於\n脩道\n已\n斷欲界第九品惑。安住勝道。即第九品解脫道。二義徵破。准\n\n> 前果中。結亦准之。云阿羅漢向者。謂前不還果中有五人。一中般。\n二生般。三有行般。四無行般。五阿羅漢向。斷色界并有頂地\n> 前八品\n惑盡。及第九品無[得-彳]道。皆名阿羅漢向。能所斷惑。及能所住\n道。二義徵破。准前可知。結亦准前。五人具釋。\n> 如雜集第十三說。\n八云阿羅漢果者。此有二種。一盡智。二無生智。謂有頂地第九品解\n脫道。有此二智。乃至未般無餘涅槃\n已\n>\n來。所有無漏聖慧。皆名阿羅\n漢果。斷惑住道。二義徵破。亦並准前。阿羅漢既非有。誰名為\n> 僧。\n僧既無矣。戒依誰有。戒既不有。梵行何從。上來約名破訖。\n二約體破者。謂有為無為二種果體。無為體者。謂初預流中。\n> 斷欲界\n四諦下見道惑盡。四品無為斷色無色界四諦下見道惑盡。四品無為。\n總有八品。向人七品。果人具八也。言有為者。取道\n> 類智俱生無漏五\n蘊二十九法。以為其體。謂善大地十種。即嗔。貪。無愧。信輕安。\n不放逸。不害。精進。捨等。通大地有十。\n> 謂想。欲。觸。慧。念。\n思解脫。憶。定。受等。覺觀心。五無表色四相及得也。二一來中無\n為體。向人斷欲脩五品惑。有五品\n> 無為。果人六品惑盡及各通。前見\n道八品。有十二十四等有為。同前二十九法。三不還中無為體向人斷\n欲脩七八二品。果人斷第\n> 九品惑盡。又各通前見道所斷。有十五十七\n品無為也。有為同前二十九法。四阿羅漢中無為體。向人斷四禪三空\n各九品脩惑盡。\n> 及有頂地前八品惑盡。果人斷第九品惑盡。并前總有\n一百四品無為也。有為體者。非想脩惑。向人第九品無[得-彳]道。果\n人\n> 第九品解脫道。數皆同前二十九法。俱生無漏五蘊為體。徵破云。\n向果所有有為無為為體。皆約數量。數量一一。誰是其體。若一\n> 是\n者。應待約餘。既待他。則無自。餘亦爾。推體既無。僧則非有。無\n僧故無戒。無戒故。無\n> 梵行。如是推無。方真梵行。\n後二約德用。破中初云三明者。一宿命明。亦名宿住隨念智證明。通\n達解了前際法故。二天眼明。\n> 亦名死生智證明。通達解了後際法故。\n三漏盡明。亦名漏盡智證明。通達解了涅槃性故。如次對治過未現愚\n故。徵破云。慧對治\n> 愚。方名為明。此則明非明也。明無故無德。無\n德用。德用既無。將何為僧。僧既非有。依誰有戒。戒無故無梵行\n也。五云六通\n> 者。一神境智證。二天眼智證。三天耳智證。四他心智\n證。五宿住隨念智證。六漏盡智證。皆名通者。於自所緣。無倒了\n達。妙\n> 用無[得-彳]故。徵破云。於六通中。依慧。依境。或依等持。\n緣合成用。用無自體。假為立名。德用既無。將何為僧。僧既是\n> 無。\n從何有戒。戒既非有。梵行何憑也。上來九門約梵行疎所依緣。徵顯\n梵行訖。\n自下第十據梵行親所依緣。徵顯梵行中二。\n> 初牒。後為壇場下徵破。\n於中十事。皆通聲聞菩薩戒緣。前八約受。後二據隨。前中初云壇場\n者。謂別結界二藏。各自有文。可\n> 知。二問清淨者。聲聞問十三難百\n遮等。菩薩問七逆等。三教威儀者。菩薩八萬。如梵網經說。聲聞三\n千如別行本及眾學等。四\n> 三說羯磨者。謂聲聞戒白四羯磨。受菩薩戒\n如善戒經及玄弉三藏所譯彌勒菩薩造菩薩受戒羯磨說\n> 。五和上者。聲\n聞戒。比丘為和上。菩薩戒。佛為和上。六阿闍梨者。聲聞有二。謂\n羯磨威儀也。菩薩戒唯一羯磨師。善戒云。\n> 大師者十方諸佛是。小師\n者我身是也。師有二種。一可見。二不可見。不可見者。十方諸佛菩\n薩僧是。可見者我是。今於可見不\n> 可見師邊。是人得菩薩戒。七剃髮\n八。著袈裟衣者。由是出家菩薩受戒故。後二隨戒內。初是四聖種中\n一也。後是離四五等邪命\n> 。四邪命。謂仰口。下口。方口。遣口活命\n故。五邪命。謂為利故。誑現奇特。為利故自說功德。為利故占相吉\n凶。高聲現威。\n> 望他敬畏。為利故講說經典。上來明對緣脩梵行觀\n訖。問上來十觀。為約受聲聞戒者起見破邪。為約受菩薩戒者起聲聞\n見破邪。\n> 若依前破。便乖本問亦違初答。若依後破僧謂中何故破四向\n果耶。\n答此中大意。通前二種。所以者何。善戒經云。受菩薩戒。要\n> 先具前\n三戒。方得與授。問遮難中先問此事。廣如彼說。\n自下第二辨成觀利益中二。初牒前推徵成觀。後如是觀察下正顯得\n益\n> 。前中二十一句分二。初十句牒成觀。後十一句牒推徵。前十句中\n分四。初三句明淨三輪觀。不取能持戒故。不著所污法故。不住\n> 戒法\n故。次戒三句明三世相盡觀。次兩句因果盡觀。作者受者不可得故。\n後兩句明法不至法觀\n> 。後牒推徵十一句中。初一總。後十別。別中分\n六。初一徵所從。次一徵所屬。次一徵體性。次一徵所由。次一徵有\n無。後五徵\n> 五蘊。後顯得益中十一句。初十別說。後一總結。前中初\n一句總。謂如是之言。牒前成觀推徵兩段文。即是答相。答相即是清\n淨\n> 梵行。言梵行法不可得者。即前十問一百事徵皆非梵行故。三世法\n空者。前依三世中求相盡故。二意無取著者。前離不取能持戒及\n> 脩行\n故。三心無障[得-彳]者。不住戒法故。四所行無二者。於一切所行\n境。皆照無性故。五方便自在者。善巧觀心常現前故\n> 。六受無相法\n者。於相盡言教深忍樂故。七觀無相法者。隨所見聞。皆觀無相故。\n八知佛法平等者。知佛自證此平等故。九由此\n> 梵行觀智。能具證得一\n切諸佛所證之法。後一句總結可知。上來自分行竟。\n自下第二明勝進行者。此即勝進行中之勝進也。文中\n> 三。初標。次\n徵。後列。初中以自分\n已\n成。仍須更進故。曰復應進門不出三慧。故\n云脩習仰學智力。故依十法。二徵可知。\n> 三列中四。一列名十力名\n義。如前分別。二於如來下觀十力名義。諮問勝\n已\n成於聞慧。於中\n二。先聞。後依教觀境。前中一\n> 一力有無量義者。謂諸智境。後觀境\n聞中。謂眾生不知處非處等理起悲不捨。三思惟下成於思慧\n> 。四行無\n上業下成於脩慧。於中二。先標。後釋。標云行無上業者。佛以力\n智。度生為業。今此菩薩亦依佛智力。度所緣境故。\n> 不求果報者有二\n種。一由智。謂了因果如幻等故無所求。二由悲。謂見眾生迷淪。理\n合救度故。不求後報。釋云。了知境界等者\n> 。謂了所度生也。身緣集\n無我我所如幻。受如夢中領納境界。想取境相分齊如影。行雖如響暫\n相應用然速遷流。心雖變現種種境\n> 界。如變化人。自尚非實。況有所\n作。或此五喻不別配屬。通譬人法。上來總辨自分勝進行。答前云何\n得梵行情淨問訖。\n自下\n> 第二答前從因至果問中二。先牒前起後。後一切佛法下正答前\n問。前中云能與如是觀相應者。指前十問觀察梵行。於諸法不二解\n\n> 者。即還是彼觀相應心。謂於一百事中。一一推徵悉無所有。差別見\n盡故。云不生二解。\n後正答中三。先總標。次初發下別釋。\n> 後知一切下出因。初中云一切\n佛法者。謂若如前脩梵行。得佛果所有理智法故。疾得現前者。現論\n在即故。次別釋。云初發心等\n> 者。前云疾得菩提。未定何時為疾故。\n此別明初發心時。謂十住中初發心住。創得成位故。云初發心時。此\n約因脩法性位上下相即觀說。三出因中二。先正顯。謂以知一切法即\n心自性故。離自心性更無別佛。乃至一切。後成\n> 就下結成。謂一切法\n既不離自心故。即是佛成就無師自然智。心外無他故。云不由他悟。\n上來二。初答得梵行清淨問。後答從菩\n> 薩位到菩提果問。雖兩段不\n同。總答問竟。上來有二。初正念天子問。後法慧菩薩答。兩段雖\n殊。共明一品經也。梵行品釋竟。\n>\n\n### 5.3 李通玄《新华严经论》（T1739）——「梵行品第十六」段（卷第十五）\n\n通玄三门：释品名目·释品来意·随文释义。以「無念之念名為正念·隨行無念名為正念」释问主；以「無行可得則無行不淨」释品名。\n通玄窗口 T1739·len=1155·三门分别·无念之念名正念·无行可得则无行不净：\n\n> 梵行品第十六\n將釋此品約作三門分別。一釋品名目。二釋品來意。三隨文釋義。\n一釋品名目者。何故云梵行品。梵者此云淨也。\n> 以其淨行利眾生故。\n常居世間行一切行。化利眾生。無行可得。則無行不淨。是故名為梵\n行也\n> 。又約能問之主。名曰正念。無念之念。名為正念。隨行無念。\n名為正念。行念總無。以斯益物名第一義天。以天有慈名為天子。\n> 又\n約能說之人。名為法慧。隨行無念名之為法。以法簡情名之為慧。起\n情乖理名無法慧。達理情亡名為法慧。今約能問之主所說\n> 法人及所說\n法。總名淨行品者。均分理教義。\n二釋品來意者。前品明住佛無所住之門故。還行無行之行。是故此品\n須來。無住\n> 之住名為佛住。無行之行利益無眾生之眾生。名為淨行。\n是故此品須來。\n三隨文釋義者。科此一品經。約作七門分別。第一爾時\n> 已下三行。是\n正念天子所請分。第二法慧菩薩已下。至佛法僧戒可兩行半經正舉十\n法。以為所觀之緣。第三應如是觀已下。至如\n> 是觀已。有二十六行半\n經。是正行觀法。第四從於身無所取已下。至名為清淨梵行。於中可\n有十行經。通觀三世及身受想行識佛\n> 法悉平等具足一切佛法分。第五\n復應修習十種法已下。至永斷習氣智。於中可三行半經。正舉如來十\n種智力令修習分。第六於如\n> 來十力已下。至不求果報。於中可三行\n經。勸修十力有迷諮問并起大悲分。第七了知境界已下。可四行半\n經。明了法如幻觀終獲益成佛分。如是依如上觀行令身口意業佛法僧\n戒色受想行識身邊二見三世遠近總無。又令能觀所\n> 觀心。總無不沈不\n掉。不生不滅。任理無思。如來十種智力因斯而現。夫佛智非沈。只\n為迷心逐相情虧也。智現一體非遙也。智\n> 現報障。都亡十方廓然自\n在。處塵不為小周空不為廣窮其跡也。十方無纖毫之蹤興其用也。不\n出剎那之際。法身遍周等虛空而無\n> 盡。若存其有即一切剎海現色像重\n重。若致其無萬境不可窺。其體以不思不為而知。眾法。將不造不作\n而辦。大功。非生死變其\n> 志。非苦樂移其性。若非神之稱理者。不可\n以情想。知不可以滅心得。以此如來設淨行之教。觀法盡也。正法當\n興。諸見亡也。\n> 佛智方起。是知見亡智應名初發心時便成正覺。成就\n慧身不由他悟。是故後學之士應法修行。不可以逐境沈淪迷流永劫。\n更欲解\n> 其上義慮將言豐障理以亂後學之心。但如上所說之經多小自然\n恰中。如一百四十願名淨行者十信位願中以成世間。知見萬法以為淨\n>\n行。此十住位中。以行體無為。名為淨行。以此淨行用成智用。自\n在。此淨行品成十住中初發心之佛果然。亦為已後十行十迴向\n> 十地\n等。作佛果故。從此無性之行行清淨故。一切諸行皆清淨故。諸行淨\n即智慧淨。智慧淨故其心淨。心淨即諸法淨。諸法淨故\n> 名法界淨。法\n界淨即其眾生淨。眾生淨即佛國土淨。行此法平等者。名為淨行也。\n\n### 5.3' 李通玄《华严经合论》（X0223）——「梵行品第十六」段（卷第十五）\n\n合论体·经论交映（先引经文·后【论】释），三门与《论》同而文句略异。\n合论窗口 X0223·len=2118·经论交映体（先经文后【论】释）：\n\n> 梵行品第十六\n【論】將釋此品約作三門分別一釋品名目二釋品來意三隨文釋義第一\n釋品名目者何故云梵行品梵者此云淨也云以其\n> 淨行利眾生故常居世間\n行一切行法化利眾生無行可得則無行不淨是故名為梵行也又約能問之\n主名曰正念無念之念名為正念隨行無\n> 念名為正念行念總無以斯益物名\n第一義天以天有慈名為天子又約能說之人名為法慧隨行無念名之為法\n以法簡情名之為慧起情乖理\n> 名無法慧達理情亡名為法慧今約能問之主\n所說法人及所說法總名淨行品品者均分理教義第二釋品來意者前品明\n住佛無所住之門故\n> 還行無行之行是故此品須來無住之住名為佛住無行\n之行利益無眾生之眾生名為淨行是故此品須來\n> 第三隨文釋義者科此一\n品經約作七門分別。\n【經】爾時正念天子白法慧菩薩言佛子一切世界諸菩薩眾依如來教染\n衣出家云何而\n> 得梵行清淨從菩薩位逮於無上菩提之道。\n【論】第一爾時\n已\n下三行經是正念天子所請分。\n【經】法慧菩薩言佛子菩薩摩訶薩\n> 修梵行時應以十法而為所緣作意觀\n察所謂身身業語語業意意業佛法僧戒。\n【論】第二法慧菩薩\n已\n下至佛法僧戒可兩行半經正\n> 舉十法以為所觀之\n緣分。\n【經】應如是觀為身是梵行耶乃至戒是梵行耶若身是梵行者當知梵行\n則為非善則為非法則為渾濁則為\n> 臭惡則為不淨則為可厭則為違逆則為\n襍染則為死屍則為蟲聚若身業是梵行者梵行則是行住坐臥左右顧視屈\n伸俯仰若語是梵行者梵\n> 行則是音聲風息脣舌喉吻吐納抑縱高低清濁若\n語業是梵行者梵行則是起居問訊略說廣說喻說直說讚說毀說安立說隨\n俗說顯了說若意是梵行者梵行則應是覺是觀是分別是種種分別是憶念\n是種種憶念是思惟是種種思惟是幻術是眠\n> 夢若意業是梵行者當知梵行\n則是思想寒熱飢渴苦樂憂喜若佛是梵行者為色是佛耶受是佛耶想是佛\n耶行是佛耶識是佛耶為相是佛耶\n> 好是佛耶神通是佛耶業行是佛耶果報\n是佛耶若法是梵行者為寂滅是法耶涅槃是法耶不生是法耶不起是法耶\n不可說是法耶無分別是\n> 法耶無所行是法耶不合集是法耶不隨順是法耶\n無所得是法耶若僧是梵行者為預流向是僧耶預流果是僧耶一來向是僧\n耶一來果是僧\n> 耶不還向是僧耶不還果是僧耶阿羅漢向是僧耶阿羅漢果\n是僧耶三明是僧耶六通是僧耶若戒是梵行者為壇場是戒耶問清淨是戒\n耶教\n> 威儀是戒耶三說羯磨是戒耶和尚是戒耶阿闍棃是戒耶剃髮是戒耶\n著袈裟衣是戒耶乞食是戒耶正命是戒耶如是觀\n已\n。\n【論】第\n> 三應如是觀\n已\n下至如是觀\n已\n有二十六行半經是正行觀法分。\n【經】於身無所取於修無所著於法無所住過去\n已\n滅未來未\n> 至現在空寂\n無作業者無受報者此世不移動彼世不改變此中何法名為梵行梵行從何\n處來誰之所有體為是誰由誰而作為是有為是無為\n> 是色為非色為是受為\n非受為是想為非想為是行為非行為是識為非識如是觀察梵行法不可得\n故三世法皆空寂故意無取著故心無障礙\n> 故所行無二故方便自在故受無\n相法故觀無相法故知佛法平等故具一切佛法故如是名為清淨梵行。\n>\n【論】第四從於身無所取\n已\n下至名為清淨梵行於中可有十行經通觀三\n世及身受想行識佛法悉平等具足一切佛法分。\n【經】\n> 復應修習十種法何者為十所謂處非處智過現未來業報智諸禪解\n脫三昧智諸根勝劣智種種解智種種界智一切至處道智天眼無礙智宿命\n>\n無礙智永斷習氣智。\n【論】第五復應修習十種法\n已\n下至永斷習氣智於中可三行半經正舉如\n來十種智力令修習分。\n【經】\n> 於如來十力一一觀察一一力中有無量義悉應諮問聞\n已\n應起大慈\n悲心觀察眾生而不捨離思惟諸法無有休息行無上業不求果報。\n\n> 【論】第六於如來十力\n已\n下至不求果報於中可三行經勸修十力有迷諮\n問并起大悲分。\n【經】了知境界如幻如夢如影如響亦如\n> 變化若諸菩薩能與如是觀行相\n應於諸法中不生二解一切佛法疾得現前初發心時即得阿耨多羅三藐\n> 三\n菩提知一切法即心自性成就慧身不由他悟。\n論第七了知境界\n已\n下可四行半經明了法如幻觀終獲益成佛分如是依如\n上觀行\n> 令身口意業佛法僧戒色受想行識身邊二見三世遠近總無又無能\n觀所觀心不沈不掉不生不滅任理無思如來十種智力因斯而現夫佛智非\n>\n深只為迷心逐相情虧也智隱一體也智現非遙智現執障都亡十方廓然自\n在處塵不為小周空不為大窮其跡也十方無纖毫之縱興其用則\n> 不出剎那\n之夫身行徧周等虗空而無盡若存其有即一切剎海現色像重重若置其無\n萬境不可窺其體以不思不惟而知眾法將不造不作而\n> 辦大功非生死知其\n志非苦樂移其性若非神之稱理者不可以情想知不可以滅心得以此如來\n設淨行之教觀法盡也始正法當興諸見亡也\n> 佛智方起是知見亡智應名初\n發心時便成正覺具足慧身不由他悟是故後學之士應法修行不可以逐境\n沈淪迷流永劫更欲解其上義慮將\n> 言豐障理以亂後學之心但如上所說之\n經多少自然恰中如一百四十願名淨行者是十信位中以願成世間知見萬\n法以為淨行此十住位中\n> 以行體無為無性名為淨行以此淨行用成智用自\n在此淨行品成十住中初發心之佛果亦為\n已\n後十行十迴向十地等作佛果\n故從此無\n> 性之行行清淨故一切諸行皆清淨故諸行淨則智慧淨智慧淨則\n其心淨其心淨則諸法淨諸法淨名法界\n> 淨法界淨即眾生淨眾生淨則佛國\n土淨行此法平等者名為淨行也。\n\n### 5.3'' 海云继梦讲记旁参（玄谈段·只标不改）\n\n- 讲记 ep10 §A01（七處九會研議·十處判）于术语表记第三處忉利天宮：\"這個地方開始就講行法了\"——讲者以**行**字点第三会之开；本品正居该会\"位中之通行\"，与讲者\"行法\"之判可为互参〔讲师玄谈·非正行〕〔⚖宏观架构语·非文本科判〕。\n- 讲记 ep11 §A10–A11：\"十住品・梵行品・初發心功德品・（明法品）為首\"、\"這個四品從漸教解門的立場來講起步\"——本品居讲者四品之**第二**；然讲记分品只标名目、未及本品行相之释〔⚖品名次第係玄谈段口诵科判·待 Ep13+ 依 `T10n0279` 品目核〕。\n- 本品**正行段逐字讲记**：讲记正行段（ep13–15）未及第三会〔正行讲记·未上架·待补〕；讲者之说疑误只标不改、不入经文疏解（编务总则）。\n\n### 5.4 诸家对读小结\n\n五家注疏同以「离相·无得」为本品位中通行之宗——澄观最广（来意六义·四门完备·疏末归心性）；法藏三义释名六别辨净梵；慧苑相/离相判声闻与菩萨之别；通玄「无念·无行」立顿趣·以问主释为正念之体。诸家会读：本品之「十法推徵」为华严梵行论之骨架，其旨归在**以般若空慧为梵行之体，以十力大悲为梵行之用，以初发心即得为梵行之果**〔本文判断〕。\n\n---\n\n## 六、文本对读与校勘\n\n### 6.1 与六十华严〈梵行品第十二〉对读（卷第八）\n\n两译梵行品极为对应：六十品次 12（依六十三十四品目）对八十品次 16；两译同为正念天子问·法慧答·纯长行·无偈颂。\n两译同为正念天子问·法慧答·纯长行·无偈颂。六十品次 12 对八十品次 16。以下逐行照录 T09n0278 卷第八〈梵行品第十二〉全文（5 行·CJK 993）：\n\n**[60-000]** CJK=13\n> 大方廣佛華嚴經梵行品第十二\n\n**[60-001]** CJK=69\n> 爾時，正念天子白法慧菩薩言：「佛子！一切世界中，諸菩薩摩訶薩信家、非家、出家學道，捨離俗飾，被服法衣，彼諸菩薩云何方便修習梵行，具足菩薩十住道地，速成無上平等菩提？」\n\n**[60-002]** CJK=536\n> 爾時，法慧菩薩答正念天子言：「正士！此菩薩摩訶薩一向專求無上菩提，先當分別十種之法。何等為十？所謂：身、身業、口、口業、意、意業、佛、法、僧、戒，應如是觀：為身是梵行耶？乃至戒是梵行耶？若身是梵行者，當知梵行則不清淨；當知梵行則為非法；當知梵行則為渾濁；當知梵行則為臭惡；當知梵行則為穢污；當知梵行則為塵垢；當知梵行則為諂曲；當知梵行則為八萬戶蟲。若身業是梵行者，當知身四威儀則為梵行；左右顧眄舉足下足則為梵行。若口是梵行者，當知音聲則為梵行；當知語言則為梵行；當知心觸則為梵行；當知舌動則為梵行；當知脣齒和合則為梵行。若口業是梵行者，當知語言則為梵行；當知所說作、無作、稱譏、毀譽，則為梵行。若意是梵行者，當知覺、觀、憶念、不忘、思惟、幻、夢等悉為梵行。若意業是梵行者，當知想是梵行；施設是梵行；寒、熱、飢、渴、苦、樂、憂、喜等悉是梵行。若佛是梵行者，為色是佛耶？為受、想、行、識是佛耶？為三十二相、八十種好是佛耶？為一切神通、業報是佛耶？若法是梵行者，為正教是法耶？為寂滅、離涅槃是法耶？為生、非生是法耶？為實、非實是法耶？為虛妄是法耶？為合、散是法耶？若僧是梵行者，為向須陀洹果是僧耶？為得須陀洹果是僧耶？為向斯陀含阿那含阿羅漢果是僧耶？為得斯陀含阿那含阿羅漢果是僧耶？為三明、六通是僧耶？為時解脫是僧耶？為非時解脫是僧耶？若戒是梵行者，為戒場是戒耶？為十眾是戒耶？為問清淨、不清淨是戒耶？為戒師是戒耶？為三羯磨和尚是戒耶？為鬀髮、法服、乞食是戒耶？菩薩摩訶薩當如是觀察十種法。\n\n**[60-003]** CJK=181\n> 「又，知過去無所至，未來無所有，現在無作者、無知者、無受報者，此世不至彼世，彼世不至此世。為何等法是梵行？梵行法為在何處？誰有是梵行法？此梵行法為是有耶？為是無耶？為是色法耶？為非色法耶？為是受、想、行、識法耶？為非受、想、行、識法耶？菩薩摩訶薩正念無障礙，觀察、分別三世諸法平等，猶如虛空，無有二相。如是觀者，智慧、方便無所罣礙。於一切法而不取相，一切諸法無自性故；於一切佛及諸佛法平等觀察，猶如虛空；是名菩薩摩訶薩方便修習清淨梵行。\n\n**[60-004]** CJK=194\n> 「又復修習增上十法。何等為十？所謂：是處非處智，去、來、現在諸業報智，一切諸禪三昧正受解脫垢淨起智，眾生諸根智，隨諸欲樂智，種種性智，至一切處道智，無障礙宿命智，無障礙天眼智，斷習氣智，是為十。如是觀察如來十力甚深無量，具足長養大慈悲心，悉分別眾生而不捨眾生，亦不捨寂滅；行無上業，不求果報；觀一切法如幻、如夢、如電、如響、如化。菩薩摩訶薩如是觀者，以少方便，疾得一切諸佛功德。常樂觀察無二法相，斯有是處。初發心時，便成正覺，知一切法真實之性，具足慧身，不由他悟。」\n\n**校勘**：口/語·信家非家/依如來教染衣出家·速成無上平等菩提/從菩薩位逮於無上菩提之道——异文各照底本不统一。\n\n### 6.2 四十华严（T10n0293）\n\n四十本无此品（彼但入法界品别行经）。\n\n### 6.4 校勘记\n\n- 口/語：六十作「口·口業」，八十作「語·語業」——各照底本不統一；\n- 信家、非家、出家學道（六十）↔ 依如來教、染衣出家（八十）——六十语较长；\n- 六十末「速成無上平等菩提」↔ 八十「從菩薩位逮於無上菩提之道」。\n\n---\n\n## 七、结构分析·数据层\n\n### 7.1 基本数据\n\n- 品界 CJK 923（含品题 6·正文 917）\n- 单元 5（1 head + 4 p）\n- 纯长行·无偈颂\n- 六十 CJK 993（差值 +70·六十略长）\n- 问端 50 + 答核心 669 + 修十法 193 = 正文 912 + 过渡 5 = 917\n\n### 7.2 关键词（品界 slice body80 实测频）\n\n| 关键词 | 频 |\n|---|---|\n| 梵行 | 25 |\n| 法 | 27 |\n| 佛 | 17 |\n| 戒 | 13 |\n| 僧 | 12 |\n| 身 | 7 |\n| 意 | 6 |\n| 菩薩 | 6 |\n| 語 | 4 |\n| 觀察 | 4 |\n\n### 7.5 十法推徵·双十结构·数据科学四视角\n#### 7.5.1 关键词频分布\n\n| 关键词 | 频次 | 条形 |\n|---|---|---|\n| 梵行 | 25 | █████████████████████████ |\n| 法 | 27 | ███████████████████████████ |\n| 佛 | 17 | █████████████████ |\n| 戒 | 13 | █████████████ |\n| 僧 | 12 | ████████████ |\n| 身 | 7 | ███████ |\n| 意 | 6 | ██████ |\n| 菩薩 | 6 | ██████ |\n| 語 | 4 | ████ |\n| 觀察 | 4 | ████ |\n\n#### 7.5.2 单元 CJK 结构\n\n| 段号 | 内容 | CJK | 占比 |\n|---|---|---|---|\n| 80-000 | 品题 | 6 | 0.7% |\n| 80-001 | 问端 | 50 | 5.4% |\n| 80-002 | 过流 | 5 | 0.5% |\n| 80-003 | 推徵核心 | 669 | 72.5% |\n| 80-004 | 修十法 | 193 | 20.9% |\n| **合计** | | **923** | 100% |\n\n#### 7.5.3 八十↔六十对读数据\n\n| 维度 | 八十 | 六十 | 差值 |\n|---|---|---|---|\n| CJK | 923 | 993 | +70 |\n| 行数/单元 | 5 | 5 | 0 |\n| 核心段 | 669 | 536 | −133 |\n| 修十法段 | 193 | 194 | +1 |\n| 问端 | 50 | 69 | +19 |\n\n#### 7.5.4 疏窗规模对比\n\n| 祖典 | len | 本品占比 |\n|---|---|---|\n| 澄观 T1735 | 5044 | — |\n| 慧苑 X0221 | 7657 | — |\n| 法藏 T1733 | 2798 | — |\n| 智俨 T1732 | 1095 | — |\n| 通玄 T1739 | 1155 | — |\n| 合论 X0223 | 2118 | — |\n\n#### 7.5.5 频计 SVG\n\n<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"400\" height=\"220\" viewBox=\"0 0 400 220\">\n<style>text{font:12px sans-serif}</style>\n<rect x=\"10\" y= ）。\n- 李通玄（`T1739`）：\"梵者此云淨也……是故名為梵行也\"（無行不淨之顿趣·§1.1）；《合論》（`X0223`）：\"無念之念。名為正念\"（释问主·§2.1）。\n- 智俨段（`T1732`·六十品题〈梵行品第十二〉）见 §5.2'；澄观疏本科段全文另见附录四'。\n\n### 附录四'：澄观疏本科段全文照录\n以下按 NFKD 归一口径逐 60 字分段照录 T1735〈梵行品第十六〉窗口全文（raw @234245-239289·len=5044）：\n\n`[SH-0000]` 梵行品第十六\n(從第十七經盡夜摩宮中偈讚品)\n四門之中初來意有六。一前是正位。今辨位中之行。故次來也。二前\n明諸位別行。\n`[SH-0060]` 今辨諸位通行。三前通道俗。今別顯出家所行。四前明\n隨相差別。今顯會緣入實。五為顯入住之因。謂自他二種梵行淨故。\n則入初住\n`[SH-0120]` 也。六別顯初住成佛。則類前諸位。位位成佛不由他悟之相\n也。具上諸意有此品來。二釋名者。梵是西域之音。具云勃嚂摩。此\n翻為\n`[SH-0180]` 淨。揀上淨行立梵行名。離染中極故名為梵。即梵為行故名梵\n行。持業釋也。亦有云。真境為梵智契為行。或涅槃為梵修因為行。\n此\n`[SH-0240]` 二依主釋。梵行以何為體。體略有三。一者即戒。戒能防非故得稱\n梵。二者四等。三者是慧。涅槃五行中。梵行即四無量。亦七善知。\n`[SH-0300]`\n今此品中具含三義。然此三各二。戒有二者。一隨相二離相。今文即\n相無相。依如來教染衣出家乞食正命。是隨相也。於修無所著。\n`[SH-0360]` 則戒\n相如虛空。即離相也。四等二者。一有緣二無緣。生緣法緣皆名為\n有。今即緣無緣觀察眾生。\n`[SH-0420]` 而不捨離是有緣也。了知境界如幻如夢。\n即無緣也。慧有二者。一有分別二無分別。今即分別是無分別。謂於\n十法一一推徵。是分別\n`[SH-0480]` 也。觀無相法了知平等離念契玄。即無分別\n也。上三中二義。各初義通凡小。後義唯大乘。此二不二為實教梵\n行。若一行具一切佛法\n`[SH-0540]` 。方是華嚴之梵行也。梵即是淨。但以性淨故\n即行淨。行淨故則智慧淨。智慧淨故則心淨。心淨故一切功德淨。乃\n至成佛功歸於行。\n`[SH-0600]` 故云淨行。然前信中之淨。隨事造修悲智兼導。至\n此純熟了心自性。悲智無二故。小有不同。三宗趣者。即以悲智無二\n事理雙修觀行\n`[SH-0660]` 為宗。疾滿一切佛法為趣。第四釋文。文分為二。先問\n後答。今初亦二。先敘問答之人。正念天子問者。天者淨也。表所問\n事理染相\n`[SH-0720]` 絕故。梵依天行而得成故。念與無念二而不二。為正念也。\n法慧答者。表巧慧窮法。後佛子下。正顯問端。於中先舉所問境。次\n云何\n`[SH-0780]` 下。述所問相。問相有二。一問行淨所因。謂隨相持戒之梵行。\n云何得離相之清淨。故不應言淨劣梵也。二從菩薩下。問因所得果。\n\n`[SH-0840]` 第二法慧下答。答前二問即為二別。先答行淨所因。後若諸菩薩下。\n答因所成果。斯即觀成利益也。今初分二。先明自行清淨即離相之\n`[SH-0900]` 戒\n成。後復應修習下。明利他之行淨。即無緣之四等二種智慧。通在兩\n文為能淨故前中分四。一總示所應。二所謂下。列名略釋。三\n`[SH-0960]` 若身是\n下。廣陳修相。四如是觀已下。顯觀成相。今初。作意者。不墮無記\n故。觀察者。以慧推求\n`[SH-1020]` 故。二中初列十法。即列上所緣之境。後應如\n是觀下。釋上作意觀察所以。唯令觀十法者。一為成圓數。二梵行緣\n體不離此十。謂身\n`[SH-1080]` 口意三是行所依處。三業行因三寶行緣。戒謂行\n體。問以善三業歸於三寶。得受隨戒何要觀耶。答若不觀察。取相堅\n持同權小故。見\n`[SH-1140]` 戒從緣起心持戒為迷倒故。云何觀耶。廣在下文。今\n略釋之。意云十中隨一。若是餘九即非明假眾緣。以顯無性。況十中\n各十。一一\n`[SH-1200]` 推徵。相盡理現名真梵行。第三廣陳修相。即尋伺觀也。\n十法即為十段。前六通染。是故但約染淨相違。名非梵行。亦不析破\n彼法自\n`[SH-1260]` 體。後四唯淨順於梵行故。分析體空何有梵行。十中各先總牒\n觀境。後以十事徵顯其非。今初身具中。一非善者。身通不善體非順\n理\n`[SH-1320]` 。梵行善性體能順理。二法既殊明身非梵行。梵行何在他。皆倣\n此。當知梵行之言貫通諸句。二體是無記非可軌法。三飲食資成。四\n\n`[SH-1380]` 自相臭惡。五自性不淨。六種子住處等皆悉可厭。七四蛇違反。八業\n惑所依故。九是身無知。又要當死究竟不淨故。十八萬戶蟲戶有九\n`[SH-1440]`\n億。全以蟲聚成其身故。今此梵行體是可軌性。能澄淨芬馨清潔。賢\n聖所欣順法順教。體無雜染。與智相應眾善集成。彼豈當是於十\n`[SH-1500]` 事求\n梵行叵得。當知梵行離相離性下九準之。二身業者。身之作用名為身\n業。語意亦然。十中四儀\n`[SH-1560]` 無記。餘六通善惡故非梵行。三語具十事。\n初一語體次五語緣。謂風觸七處而出於聲。此略無臍輪牙齒。後吐納\n等四。是辨語相十事\n`[SH-1620]` 。望業皆是語體。此唯無記故非梵行。四語業十\n事通善惡故。亦非梵行。安立說者謂假施設。隨俗說者。隨世名言。\n餘可思準。第五\n`[SH-1680]` 觀意十事。覺是尋求觀是伺察。覺麁觀細是不定法。\n言分別者。以慧揀擇。三分別中是自性分別。七分別中任運分別。種\n種分別者。\n`[SH-1740]` 三中隨念計度故。七中餘六。謂有相無相尋求伺察染污不\n染污故。憶念者。追憶曾習唯緣過去。思惟者。以慧籌度通去來今。\n並有一\n`[SH-1800]` 多各成二種。上六皆別境攝。種種憶念義兼惡作。幻術通思通\n念。眠是不定意識亦行。但取境昧略。輕眠有夢。亦通善惡覺之勢\n故。\n`[SH-1860]` 此十是心所。不離心故同名意也。徵破準前。第六觀意業十事。\n皆意之用故名為業。約遍行五徵之。一思二想次四是觸。後四是受。\n\n`[SH-1920]` 作意一種總遍十段。故前云作意觀察。即上四段亦各一蘊。此中思等\n與意何別。但思等心所有二義故。一扶持心王屬前所攝。二依心起\n`[SH-1980]`\n用。屬此位收故。多從受境以辨。若欲破者。既約遍行通於三性故。\n非梵行餘準前知。第七觀佛十事觀於三身。若依小乘。初五法身\n`[SH-2040]` 。以\n無漏戒等及眷屬無漏五蘊。為法身故。次二報身。以三祇百劫所修感\n相好故。次一化身。神通化現故。業行通為三身之因。果報\n`[SH-2100]` 通語三身\n之果。若依大乘。前八皆是化身。後一報身。業行通語二身之因。涅\n槃是果離繫果故。菩\n`[SH-2160]` 提是報報本願故。今一一推徵。若一是佛餘者應\n非。一一皆佛則有多佛。和合成佛則無自性。故中論云。非陰。不離\n陰。此彼不相在\n`[SH-2220]` 。如來不有陰。何處有如來。陰合為如來。則無有自\n性。進退推求佛體寂滅。尚非是有豈當是無。邪見深厚者。則說無如\n來。諸法性\n`[SH-2280]` 空中思惟亦不可。是知真佛既超心境。依斯成行行豈相\n耶。第八觀法。但有八句者。應梵本脫漏。豈餘九皆十此獨八耶。若\n約有所表\n`[SH-2340]` 者。表除九十八使故。加十總觀破百八煩惱故。然法有教理\n行果。今就後三略能詮故。八中初一理法。次一果法。餘六通三約理\n可知\n`[SH-2400]` 。約行者。謂不善不生妄想不起。言語道斷智無分別。定無行處\n如智兩冥。此六究竟即是果相。今推徵云。若一是法餘則應非。一一\n\n`[SH-2460]` 皆爾。若謂總。是則和合不實。隨得一法即應得餘。和合而成則無和\n合。若以無合而為法者。無合之法豈當有耶。又此舉法皆舉寂滅不\n`[SH-2520]` 生\n等者。欲明一一自虛。法即非法梵行何從。第九觀僧十事。前八約人\n後二就德。且依小說。言預流者。始超凡地預聖流故。一來者\n`[SH-2580]` 。修惑\n未盡。一度來生欲界中故。不還者。欲界惑盡。更不還來生欲界故。\n阿羅漢者。此有三義。一名殺賊。已斷一切諸煩惱故。二\n`[SH-2640]` 名不生。三\n界之生永已盡故。三名為應。應受人天大供養故。有四向者。向於果\n故。謂斷三界見惑\n`[SH-2700]` 有十六心。至第十五道類忍時。名初果向。至第十\n六即入修道。名須陀洹果。欲界修惑分為九品。斷至五二向。斷六一\n來果。斷七或\n`[SH-2760]` 八品名第三果向。九品全斷盡即得不還果。次斷上二界\n修惑。乃至有頂八品惑盡。名阿羅漢向。三界見修都盡得阿羅漢果。\n今此欲明\n`[SH-2820]` 梵行。粗陳名目。若廣引婆沙俱舍雜集瑜伽則清淨梵行有累\n名數。力有餘者付在說時。此中觀意。謂僧名和合而有八輩。一若是\n僧餘\n`[SH-2880]` 則應非。又一一別辨則無眾義。集此無眾豈成眾耶。況於入流無\n所入等。以無為法而有差別。則其體自虛。後二就德。德若是僧何須\n\n`[SH-2940]` 八輩離法無人離人無法。一一窮究為僧者。誰僧體既虛梵行安寄。第\n十觀戒。戒為行體。亦賴眾緣。從緣成戒戒性如空。起心持者。是\n`[SH-3000]` 謂\n迷倒。無善無威儀不雜二乘心。是名持淨戒。此戒乃名真梵行也。其\n中十事。前八是受後二是隨。受中壇場得戒之處。問淨教儀並\n`[SH-3060]` 教授\n師。三說羯磨即得戒法。和尚得戒根本。阿闍黎者。正即二師。義兼\n七證。剃髮著衣是戒外相。隨中乞食四依之一。正命。謂離\n`[SH-3120]` 四邪五\n邪。若依菩薩戒類例上文。具如善戒經。及彌勒菩薩所造。受菩薩戒\n羯磨所辨。此上十境。正約菩薩傍兼聲聞。設依小受修觀\n`[SH-3180]` 則為菩薩。\n即如此方。又善戒經。欲受菩薩戒。皆先具受前之三戒。故所觀境通\n於大小。其能觀智唯實教大乘。上來尋伺觀竟。第四\n`[SH-3240]` 如是觀下。辨觀\n成之相。望前尋伺即為觀蓋。望後得正覺果。此但如實觀成。文分為\n三。初約所觀\n`[SH-3300]` 十境如實觀成。二此中何法下。約所成梵行如實觀成。\n三如是觀察下。結成梵行清淨之相。今初。有十句。初六句明三輪清\n淨觀。一\n`[SH-3360]` 不取能持戒眾生。言身兼口意也。二不著所修行事。三不住\n於戒法。亦即是事。亦通不住前法。次三句。以三時門明不住持戒\n時。兼\n`[SH-3420]` 釋上不取等言。三世推求不可得故。已滅未至空理易明。現在\n多滯偏語空寂。以剎那不住過未分之。故空寂也。次二句明二空觀\n成。\n`[SH-3480]` 作受者。人業報是法。後二句。以不遷理釋成因果空義。此世不\n移動。謂不從今至後。彼世不改變。謂不從後至今。是為因自昔滅無\n\n`[SH-3540]` 力感果。果不俱因無力酬因。何有報受。以物各性住性本空故。二約\n所成梵行如實觀成者。有十一句。初句總顯無名。十已空故。餘句\n`[SH-3600]` 為\n別。一不從十生。二非屬身等。皆十已空故。上二句約緣以徵。次二\n句就體以徵。初句明離前十外無別無作戒體。十外有體不假前\n`[SH-3660]` 十。次\n句亦無有作。作之受隨前已空故。次句雙非顯中。無性防非故。次五\n句約五陰。有二意。一就戒體。有說。無作戒體體即是色\n`[SH-3720]` 。有說。非\n色非心。五蘊之內。初一是色後四是心。今言為是色者。顯非是色。\n以其所立無表依表生。表色無表色。今明觀意。表色\n`[SH-3780]` 尚空。何有無\n表。為非色者。顯非非色也。從色生於戒尚不名為色。從色生於戒豈\n是非色耶。言為\n`[SH-3840]` 是識者。意顯非心。若言是心者。一切皆有心應常有\n梵行。是知非心也。若言非心木石應梵行。是知非非心也。若言非色\n非心行蘊攝\n`[SH-3900]` 者。但是行蘊應皆名戒。二就修行梵行不離五蘊。若即蘊\n者。有蘊皆梵行。若離蘊者。豈是我梵行。故後結云皆不可得。第三\n結成梵\n`[SH-3960]` 行清淨之相。以無得故。文有十一句。初句為總。次九句別顯\n無得。一由上三世皆空故。二由於身無所取。於修無所著故。三言心\n無\n`[SH-4020]` 障礙者。即前於法無所住故。於風行空無有礙故。四作受二念不現\n行故。五雖空不礙涉有故。六七涉有不迷於空故。受觀無相。受謂忍\n`[SH-4080]`\n可於心。觀謂起用於境。八結歸平等。大般若曼殊室利分云。我不見\n有一法非佛法者故。無法不等。九一收一切方顯具德圓融。末後\n`[SH-4140]` 一句\n總以結酬。由上義故名淨梵行。上辨自利行淨竟。第二復應下。明利\n他行淨。文分為二。初深觀果智。即利他之方。後慈念眾生\n`[SH-4200]` 成無緣四\n等。是則自利利他上求下化。皆具足也。今初文三。初舉法應修謂梵\n行體也。緣體宛然一心湛寂。梵行用也。不思不造萬行\n`[SH-4260]` 沸騰故。不但\n心觀圓明。復應廣集佛智。二何者下。徵起別列可知。三於如來下。\n結勸廣學。第二聞已下。慈念眾生成無緣四等。文\n`[SH-4320]` 有四句。一雙起慈\n悲。如犢母隨子。二思惟藥病成大法喜。三即行無求以成大捨。四智\n了諸境導成無緣。此中五喻廣如十忍然釋有通\n`[SH-4380]` 別。別者如幻似有不實\n故。似有故假不實故空。此二不二成中道智。如夢者。虛妄見故。如\n影者。\n`[SH-4440]` 從業緣現故。如響者。屬諸因緣故。如變化者。須臾變滅故。\n若如是了境。即終日化而無化。亦為眾生說如斯法。是謂利他梵行清\n淨\n`[SH-4500]` 也。第二大段若諸菩薩下。答因所成果問。文中分二。先牒前因\n深。初總指前文。不生二解則舉其要。即所行無二。二一切下。酬其\n\n`[SH-4560]` 果滿。先標後釋。今初。由理觀深玄。了性具足。萬行齊修故。令大\n果無邊德用現證在。即一切明其果大。疾現語其速證。後初發心下\n`[SH-4620]`\n釋。先釋疾現之言。後釋現前之相。今初。上言疾得疾在何時。故云\n初發心時。何法現前謂無上菩提也。後知一切下。釋現前之相。\n`[SH-4680]` 亦是\n出其所因。何者。夫初心為始正覺為終。何以初心便成正覺。故今釋\n云知一切法即心自性故。覺法自性即名為佛。故下經云。佛\n`[SH-4740]` 心豈有他\n正覺覺世間。斯良證也。斯則發者。是開發之發非發起之發也。何謂\n現前之相。夫佛智非深情迷謂遠。情亡智現則一體非遙\n`[SH-4800]` 。既言知一切\n法。即心自性。則知此心即一切法性。今理現自心。即心之性已備無\n邊之德矣。成就慧身者。上觀法盡也。正法當興今\n`[SH-4860]` 諸見亡也。佛智爰\n起。覺心則理現。理現則智圓。若鏡淨明生。非前非後非新非故。寂\n照湛然不由他悟者。成上慧身。即無師自然智\n`[SH-4920]` 也。又不由他悟是自覺\n也。知一切法是覺他也。成就慧身為覺滿也。成就慧身必資理發。見\n夫心性\n`[SH-4980]` 豈更有他。若見有他安稱為悟。既曰心性自亦不存。寂而能知\n名為正覺。豈唯定之方寸。不取則於人哉。況初後圓融不待言也。梵\n行\n`[SH-5040]` 品竟。\n\n疏末标记：**梵行品竟**（见 SH-5040 段）。\n\n### 附录五：对读简表\n\n| 项 | 八十（T10n0279） | 六十（T09n0278·卷第八） |\n|---|---|---|\n| 品题 | 梵行品第十六 | 梵行品第十二 |\n| 正文 CJK | 923（含品题 6） | 993 |\n| 体 | 纯长行·无偈颂 | 纯长行·无偈颂 |\n| 推徵名目 | 身·身業·語·語業 | 身·身業·口·口業（口／語異譯） |\n| 问端语 | 依如來教、染衣出家 | 信家、非家、出家學道 |\n| 问末句 | 從菩薩位逮於無上菩提之道 | 速成無上平等菩提 |\n（§6.1 逐行照录·§6.4 校勘记·异文各照底本不统一）\n\n### 附录六：存疑一览\n\n① 法藏判\"初三品是當位行德，後一品是勝進趣後\"之当位／胜进配属〔待核·§1.2〕；② \"法 慧菩薩言\"五字独立为 p·系平文器重计假象（80-002·§1.5）；③ 海云讲记本品正行段逐字讲记未上架（§5.3''）。\n\n### 附录七：引用书目\n\n- `T10n0279` 唐·实叉难陀译《大方广佛华严经》（八十华严）·卷第十七\n- `T09n0278` 晋·佛驮跋陀罗译《大方广佛华严经》（六十华严）·卷第八（〈梵行品第十二〉·§6.1 逐行照录）\n- `T1735` 澄观《华严经疏》卷十六（本品段）· `T1733` 法藏《探玄记》卷十一 · `T1732` 智俨《搜玄记》\n- `X0221` 慧苑《续华严经略疏刊定记》卷十三 · `T1739`/`X0223` 李通玄《新华严经论》《华严经合论》卷十五\n- `data/catalog/chapters.yaml`（order 16·title_en \"The Practice of Purity\"）· `data/translation/glossary.yaml`\n- 海云继梦讲记 ep10／ep11（玄谈段旁参·`docs/经学文献/海云讲记_九九华严/episodes/`·§5.3''）\n- 本批提取件：`_e16_full.py`／`_e16_stats.py`／`_e16_sources.py`／`_e16_check_quotes.py`（引文审计 0 miss）\n\n### 附录八：术语对照\n\n（梵汉：梵行 *brahmacariya*〔X0221 转记\"勃濫摩\"·此翻為淨行〕·阿耨多羅三藐三菩提 *anuttarā-samyak-saṃbodhi*〔glossary：unsurpassed perfect enlightenment〕·如来十力〔梵名拟补·待核〕·正念天子〔梵名未译·待核〕）\n\n### 附录九：中英要目（EN Key-Point Correspondence）\n\n> 依全站固定术语表（`data/translation/glossary.yaml`·`data/catalog/chapters.yaml`）；英文以达意为务。〔2026-10-26〕\n\n| 中文 | English | 备注 |\n|---|---|---|\n| 梵行品 | The Chapter on Brahmacariya (Pure Conduct) | 篇头 EN·chapters.yaml title_en \"The Practice of Purity\" |\n| 梵行 | brahmacariya · pure conduct | §1.1·X0   var root=document.getElementById('article-root');
  if(!root){return;}
  if(!a){root.innerHTML='<p style=font-size:0.85em;color:var(--red)>文章数据缺失（ARTICLE 未定义）。</p>';return;}

  var embed=(typeof _mdDocEmbed==='function')?_mdDocEmbed(a.doc_md||''):{html:'',toc:[]};
  var h='';

  // ── 面包屑 ──
  h+='<div style="font-size:0.74em;color:var(--text2);margin-bottom:12px;">';
  h+='<a href="../index.html" style="color:var(--blue);text-decoration:none">主页</a> › ';
  h+='<a href="index.html" style="color:var(--blue);text-decoration:none">独立文章目录</a>';
  if(a.back && a.back.tab){
    h+=' › <a href="../tabs/'+a.back.tab+'.html" style="color:var(--blue);text-decoration:none">'+a.back.label+'</a>';
  }
  h+='</div>';

  // ── 页头横幅 ──
  h+='<div style="background:linear-gradient(120deg,rgba(184,134,60,0.12),rgba(94,139,158,0.08));border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px;">';
  h+='  <div style="font-size:0.76em;color:var(--text2);letter-spacing:0.5px">📄 独立文章页</div>';
  h+='  <h2 data-skip-toc="1" style="color:var(--gold);margin:6px 0 4px">'+(a.icon?a.icon+' ':'')+a.title+'</h2>';
  if(a.title_sub)h+='  <div style="font-size:0.85em;color:var(--text2)">'+a.title_sub+'</div>';
  if(a.version)h+='  <div style="font-size:0.78em;color:var(--text2);margin-top:6px">'+a.version+'</div>';
  if(a.back && a.back.tab){
    h+='  <a href="../tabs/'+a.back.tab+'.html" style="font-size:0.75em;color:var(--blue);margin-top:10px;display:inline-block">← 返回 '+a.back.label+'</a>';
  }
  h+='</div>';

  // ── 导览 ──
  if(a.meta){
    h+='<div class="section" style="border-left:4px solid var(--gold)" data-chrome="1"><h2>📌 导览</h2>';
    h+='<p style="font-size:0.8em;line-height:1.9;white-space:pre-line">'+_mdInline(a.meta)+'</p></div>';
  }

  // ── 自动目录 ──
  if(embed.toc.length){
    h+='<div class="section" data-chrome="1"><h2>🧭 本文目录</h2>';
    h+='<div style="column-width:250px;column-gap:26px;font-size:0.8em;line-height:1.75">';
    embed.toc.forEach(function(t){
      var pad=(t.lv>2?'padding-left:'+((t.lv-2)*16)+'px;':'');
      h+='<div style="'+pad+'"><a href="#'+t.id+'" style="color:'+(t.lv===2?'var(--gold)':'var(--text2)')+';text-decoration:none">'+t.text+'</a></div>';
    });
    h+='</div></div>';
  }

  // ── 会众全景流程图（MiaoyanFlow；简明结构流程图；置于目录之后、全文之前）──
  if((typeof renderMiaoyanFlow==='function')&&(typeof ARTICLE_ASSEMBLY!=='undefined')&&ARTICLE_ASSEMBLY&&(ARTICLE_ASSEMBLY.classes||[]).length){
    h+='<div class="section" data-chrome="1" id="article-flow" style="border-left:4px solid var(--gold)"></div>';
  }

  // ── 全文 ──
  h+='<div class="section" style="border-left:4px solid var(--gold)" id="article-full">';
  h+='<h2 data-skip-toc="1" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px"><span>📄 '+a.title+' · 全文</span>';
  h+='<span style="display:flex;gap:6px;flex-wrap:wrap">';
  // 名相会处知识图谱：仅当 build.py 内嵌了 ARTICLE_GRAPH（即 SQLite 中有本文名相表）时出现
  if((typeof ARTICLE_GRAPH!=='undefined')&&ARTICLE_GRAPH&&(ARTICLE_GRAPH.terms||[]).length){
    var _n=(ARTICLE_GRAPH.terms||[]).length,_e=(ARTICLE_GRAPH.links||[]).length;
    h+='<button class="f-nav-btn" onclick="openGraphPanel()" title="查看本文名相节点、边与信度分级">🕸 名相会处（'+_n+' 节点／'+_e+' 边）</button>';
  }
  // 会众名号数据剖面：仅当 build.py 内嵌了 ARTICLE_EDA（SQLite 中有本文 EDA 表）时出现
  if((typeof ARTICLE_EDA!=='undefined')&&ARTICLE_EDA&&ARTICLE_EDA.payload){
    var _m=ARTICLE_EDA.metrics||{};
    h+='<button class="f-nav-btn" onclick="edaGo()" title="查看会众名号的词素切分、语义域、群组剖面与共现网络">🔬 会众名号剖面（'+(_m.tokens_total||0)+' 词素位／'+(_m.distinct_tokens||0)+' 词素）</button>';
  }
  // 数据科学层：仅当 build.py 内嵌 ARTICLE_BI（本文有 miaoyan_bi.yaml 分析）时出现
  if((typeof ARTICLE_BI!=='undefined')&&ARTICLE_BI&&(typeof renderArticleBI==='function')){
    var _b=(ARTICLE_BI.scorecard&&ARTICLE_BI.scorecard.items)||[];
    h+='<button class="f-nav-btn" onclick="biGo()" title="跳至数据科学分析层：漏斗、语义域、交叉表、相似度、聚类、PCA、网络与稳健性">📊 数据科学（'+_b.length+' 项）</button>';
  }
  // 数据科学层（四视角）：仅当 build.py 内嵌 ARTICLE_DS（本文有 *_studies.yaml）时出现
  if((typeof ARTICLE_DS!=='undefined')&&ARTICLE_DS&&ARTICLE_DS.linguistic){
    h+='<button class="f-nav-btn" onclick="dsGo()" title="跳至数据科学层：语言统计·代数组合·拓扑·几何（同调·谱几何）四视角">📐 数据科学（四视角）</button>';
  }
  // 连环画 · 分镜信息图：仅当 build.py 内嵌 MIAOYAN_NARR / MIAOYAN_SB 任一时出现
  // （静态版面 + 维度信息图，取代原两套 Canvas 播放器）
  if((typeof renderStoryComic==='function')&&
     (((typeof MIAOYAN_NARR!=='undefined')&&MIAOYAN_NARR&&(MIAOYAN_NARR.beats||[]).length)||
      ((typeof MIAOYAN_SB!=='undefined')&&MIAOYAN_SB&&(MIAOYAN_SB.acts||[]).length))){
    var _parts=[];
    if((typeof MIAOYAN_SB!=='undefined')&&MIAOYAN_SB&&(MIAOYAN_SB.acts||[]).length){
      var _sbn=0;(MIAOYAN_SB.acts||[]).forEach(function(x){_sbn+=((x.shots)||[]).length;});
      _parts.push(MIAOYAN_SB.acts.length+' 幕 '+_sbn+' 镜');
    }
    if((typeof MIAOYAN_NARR!=='undefined')&&MIAOYAN_NARR&&(MIAOYAN_NARR.beats||[]).length){
      _parts.push(MIAOYAN_NARR.beats.length+' 拍');
    }
    h+='<button class="f-nav-btn" onclick="comicGo()" title="跳至连环画式分镜总览与各维度信息图（静态·可检索可打印）">🎞 连环画·信息图（'+_parts.join(' · ')+'）</button>';
  }
  // 会众全景流程：仅当 build.py 内嵌了 ARTICLE_ASSEMBLY 且已加载 renderMiaoyanFlow 时出现
  if((typeof renderMiaoyanFlow==='function')&&(typeof ARTICLE_ASSEMBLY!=='undefined')&&ARTICLE_ASSEMBLY&&(ARTICLE_ASSEMBLY.classes||[]).length){
    var _afc=(ARTICLE_ASSEMBLY.classes||[]),_afn=0;_afc.forEach(function(c){_afn+=(c.members||[]).length;});
    h+='<button class="f-nav-btn" onclick="flowGo()" title="跳至会众全景流程图：依经文列次四十类五环之结构流程图">🗺️ 全景流程（'+_afc.length+' 类／'+_afn+' 名）</button>';
  }
  h+='<button id="article-en-toggle" class="f-nav-btn" onclick="toggleArticleEN()" title="在「含英文批注」与「仅中文正文」之间切换显示">🌐 英文批注：显示</button>';
  h+='</span></h2>';
  h+=embed.html;
  h+='</div>';

  // ── 会众名号数据剖面（EDA；仅当 build.py 内嵌 ARTICLE_EDA 时出现，由 common.js renderArticleEDA 填充）──
  // 交互面板一律纳入默认折叠壳（panel-fold），点开方显；内容渲染入壳内 #article-eda-inner。
  if((typeof ARTICLE_EDA!=='undefined')&&ARTICLE_EDA&&ARTICLE_EDA.payload){
    h+='<div class="section" data-chrome="1" id="article-eda" style="border-left:4px solid var(--gold);padding:0">';
    h+=(typeof _foldShellHtml==='function')?_foldShellHtml('article-eda-inner','🔬 会众名号 · 数据剖面（交互）'):'';
    h+='</div>';
  }

  // ── 相关艺术品 · 文物 · 壁画 · 考古（renderArticleArtifacts 自带 <details> 折叠，无需再包）──
  if((typeof ARTICLE_ARTIFACTS!=='undefined')&&ARTICLE_ARTIFACTS&&(ARTICLE_ARTIFACTS.items||[]).length){
    h+='<div class="section" data-chrome="1" id="article-artifacts" style="border-left:4px solid var(--gold)"></div>';
  }

  // ── 数据科学层（miaoyan_bi.yaml 解释层；置于页脚之前）──
  // 面板自带 h2，恒展开会成附录十一后之独立一节；今包进折叠壳，内容渲染入 #bi-report-inner。
  if(typeof renderArticleBI==='function'){
    try{
      var _biHtml=renderArticleBI();
      if(_biHtml){
        h+='<div class="section" data-chrome="1" style="border-left:4px solid var(--gold);padding:0">';
        h+=(typeof _foldShellHtml==='function')?_foldShellHtml('bi-report-inner','📊 数据科学（解释·交互）'):_biHtml;
        h+='</div>';
      }
    }catch(e){}
  }

  // ── 数据科学层（四视角）面板：仅当内嵌 ARTICLE_DS 时出现（内容渲染入壳内 #ds-inner）──
  if((typeof ARTICLE_DS!=='undefined')&&ARTICLE_DS&&ARTICLE_DS.linguistic){
    h+='<div class="section" data-chrome="1" id="article-ds" style="border-left:4px solid var(--gold);padding:0">';
    h+=(typeof _foldShellHtml==='function')?_foldShellHtml('ds-inner','📐 数据科学 · 四视角（语言统计·代数组合·拓扑·几何（同调·谱））'):'';
    h+='</div>';
  }

  // ── 连环画式分镜总览 + 维度信息图（story_comic.js；静态零 Canvas）──
  // 仅当内嵌 MIAOYAN_NARR 或 MIAOYAN_SB 时出现；内容渲染入壳内 #story-comic-inner。
  if((typeof renderStoryComic==='function')&&
     (((typeof MIAOYAN_NARR!=='undefined')&&MIAOYAN_NARR&&(MIAOYAN_NARR.beats||[]).length)||
      ((typeof MIAOYAN_SB!=='undefined')&&MIAOYAN_SB&&(MIAOYAN_SB.acts||[]).length))){
    h+='<div class="section" data-chrome="1" id="story-comic" style="border-left:4px solid var(--gold);padding:0">';
    h+=(typeof _foldShellHtml==='function')?_foldShellHtml('story-comic-inner','🎞 连环画 · 分镜信息图'):'';
    h+='</div>';
  }

  // ── 页脚 ──
  h+='<div style="margin-top:18px;padding-top:10px;border-top:1px solid var(--line);font-size:0.74em;color:var(--text2)">';
  h+='<a href="index.html" style="color:var(--blue);text-decoration:none">📚 返回独立文章目录</a>';
  if(a.back && a.back.tab){
    h+=' · <a href="../tabs/'+a.back.tab+'.html" style="color:var(--blue);text-decoration:none">'+a.back.label+'</a>';
  }
  h+='</div>';

  root.innerHTML=h;

  // ── 命中文档名相（自动扫描＋显式标记）──
  if(typeof _markTermRefs==='function' && document.getElementById('article-full')){
    _markTermRefs('#article-full');
  }
  // ── 正文配图收为缩略图，点击看原图 ──
  if(typeof initDocImages==='function' && document.getElementById('article-full')){
    initDocImages('#article-full');
  }
  // ── 相关艺术品/文物/壁画/考古（默认折叠）──
  if(typeof renderArticleArtifacts==='function' && document.getElementById('article-artifacts')){
    renderArticleArtifacts('#article-artifacts');
  }
  // ── 会众名号数据剖面（EDA）：渲染入折叠壳内 ──
  if(typeof renderArticleEDA==='function' && document.getElementById('article-eda-inner')){
    renderArticleEDA('#article-eda-inner');
  }
  // ── 数据科学层（BI）：渲染入折叠壳内 #bi-report-inner（此前只发空壳，面板恒为空，2026-10-08 修复）──
  if(typeof renderArticleBI==='function' && document.getElementById('bi-report-inner')){
    try{ document.getElementById('bi-report-inner').innerHTML=renderArticleBI(); }catch(e){ console.warn('bi', e); }
  }
  // ── 数据科学层（四视角）：渲染入折叠壳内 #ds-inner ──
  if(typeof renderDataScience==='function' && document.getElementById('ds-inner')){
    try{ renderDataScience('#ds-inner'); }catch(e){ console.warn('ds', e); }
  }

  // ── 会众全景流程图（MiaoyanFlow；简明结构流程图）──
  if(typeof renderMiaoyanFlow==='function' && document.getElementById('article-flow')){
    try{ renderMiaoyanFlow('#article-flow'); }catch(e){ console.warn('flow', e); }
  }

  // ── 连环画 · 分镜信息图（静态）：渲染入折叠壳内 #story-comic-inner ──
  if(typeof renderStoryComic==='function' && document.getElementById('story-comic-inner')){
    try{ renderStoryComic('#story-comic-inner'); }catch(e){ console.warn('story-comic', e); }
  }

  // ── 阅读模式：识别「英文/术语批注」块，支持仅中文正文切换 ──
  _initArticleENMode();

  // ── 章节级折叠：h2/h3/h4/h5 分级折叠（默认全部折叠；标题 ▾ 号点击可单独收展）──
  // 依站点设置：正文（含附录）所有标题层次默认折叠。
  // 惟 EDA/数据科学/连环画·信息图 三面板已各自纳入 <details class="panel-fold"> 折叠壳，
  // 若再施 _foldDoc 便会「壳折叠＋内层节折叠」双重套叠，点开壳仍见其内复折——故此处不再对
  // 该三者施折叠；仅正文 #article-full 与页首会众流程 #article-flow 仍按 h2–h5 分级折叠。
  // 各节工具栏一概不生成（noBar），改由页首「一套」页面级控件统管全页折叠/展开。
  if(typeof _foldDoc==='function'){
    try{ _foldDoc('#article-full', {noBar:true}); }catch(e){}
    try{ _foldDoc('#article-flow .miaoyan-flow', {label:'会众全景流程', noBar:true}); }catch(e){}
  }
  // ── 页面级统一控件：整页仅此一对「全部折叠／全部展开」，兼管章节折叠与 <details>（表·图）──
  if(typeof _installPageBar==='function'){
    try{ _installPageBar({mountSel:'#article-full', rootSel:'#article-root'}); }catch(e){}
  }

  // ── 支持 #锚点 直达（目录跳转用真实 id 锚点；先展开折叠祖先节）──
  if(location.hash){
    setTimeout(function(){
      var el=document.getElementById(location.hash.slice(1));
      if(el){
        if(typeof _reveal==='function')window._reveal(el);
        el.scrollIntoView({behavior:'smooth',block:'start'});
      }
    },80);
  }
  // ── Mermaid 图表渲染（已禁用，使用 HTML/CSS 可视化） ──
}

if(document.readyState!=='loading'){renderArticle();}
else{document.addEventListener('DOMContentLoaded',renderArticle);}
