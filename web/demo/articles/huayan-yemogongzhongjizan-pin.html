    while(p && p !== document.body){
      var tag = p.tagName;

      var cls = p.getAttribute ? (p.getAttribute('class')||'') : '';

      p = p.parentElement;

  function linkify(){
    var root = document.getElementById('article-root');

    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);

})();

<script>
var ARTICLE = {"id": "huayan-yemogongzhongjizan-pin", "file": "articles/huayan-yemogongzhongjizan-pin.html", "title": "九九华严第二十品 夜摩宫中偈赞品之拼读", "title_sub": "第四会第二品·卷十九次品·品文2543·十菩萨偈赞102偈（功德林12+9×10）·承佛威力×10·觉林工画师喻=全经名段·承佛威力齐整=十行之人事预备·L.252核心成文·深化批预登记", "icon": "🎋", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第四会_夜摩天宫_差别因果周/华严经细读_第二十部_夜摩宫中偈赞品.md", "doc_md": "# 华严经细读·第二十部《夜摩宫中偈赞品》之拼读\n\n> **EN · Close Reading of the Avataṃsaka Sūtra, Part Twenty: The Chapter of Verses in the Yāma Palace**\n\n> **底本**：唐·实叉难陀译《大方广佛华严经》（八十华严）`T10n0279`。**范围：卷第十九次品（本品全文，品号第二十）**。本品属**第四会「夜摩天宫会」·赞德显体**，承昇夜摩天宫品（品 19）之「由致」，以十菩萨偈赞为「正宗」之预备。\n\n---\n\n## 〇、凡例（简要）\n\n一、**校勘底本**：八十华严 `T10n0279` 为底本；六十华严、四十华严、藏译（Toh 44 ch 25）对读，各照其本。\n二、**引文可回源**：经文引块由提取器程序注入（0 手抄）。\n三、**疏解三层**：疏解/名相/会读。\n四、**存疑必标**〔待核〕〔本文判断〕。\n五、**异文各照底本**。\n\n<!-- ATLAS:BEGIN P20 -->\n### 〇之零、导读指南（阅读路径与方法）\n\n**定位：** 考证型细读（philological close reading），以「可复核性」为第一优先。本品为第四会「赞德显体」——十林菩萨（功德林·慧林·勝林…智林）各承佛威力说十偈赞佛，纯偈赞体（无长行说法），一味以「赞」为法，故读法以**十赞十面**为纲。\n**本品一句：** **十菩萨各以自位赞佛——承佛威力×10 之齐整即本品之眼**；觉林「工画师」喻为全经名段（一切唯心造），智林「但随其自心」收束全品。\n**路径：** 〇之二（二图四表）→ 一（品题与脉络）→ 二（全文逐段）→ 四（义理与名相）→ 五（诸家会读）→ 七（数据层）→ 附录按需查阅。\n**方法：** 先经文后诠释；〔实测〕／〔本文判断〕／〔存疑待核〕三分；负面证据同样入账；结构覆盖 100%，个体择要。\n**读前三问：** ① 十菩萨何以皆名「林」？② 觉林「工画师」喻何以被后世引为华严唯心义之代表作？③ 十组偈各 10 偈（功德林 12）之齐整是编集还是义理？\n\n## 〇之二、本品内容地图（未入其门，先观其海）\n\n> **本节体例。** 图与表之数据，一律取自本文已回源核定之 §二逐段表与 §7.1／§7.5 实测数；**凡属推断者标〔本文判断〕，不入图**。图各看一事，勿求一图而尽本品。\n\n### 〇之二.0 提要\n\n本品占**卷第十九次品**，剥校勘 **CJK 2,543 字**（含品题 9 字）。结构为**序＋十赞**：序段（佛神力集众·十林菩萨名录 415 字）→十菩萨各「承佛威力……而说颂言」→偈组各 200 CJK＝10 偈（功德林组 240＝12 偈）→「承佛威力」**×10**。义理顶点＝觉林「工画师」喻（§4.1）。\n\n| 图 | 画什么 | 一句话 |\n|---|---|---|\n| **图 〇-1　十林十偈矩阵图** | 十赞之齐整结构 | 10 菩萨×10 偈（功德林 12）＝102 偈 |\n| **图 〇-2　工画师喻·色心四句图** | 觉林菩萨之义理顶点 | 大种中无色·色中无大种·不离大种·色可得立 |\n\n**〔读法之序〕**　先观图 〇-1 以得其齐整（十林菩萨×十偈之矩阵），次观图 〇-2 以得其义理（工画师喻之色心四句），次读〇之二.3 坐标、.6 数等，然后入 §二逐段。**赞既明，行始可入。**\n\n> **EN corresponding · Map of the Chapter.** Ten 'grove' bodhisattvas each offer ten verses of praise, introduced by a prose section listing their names. The ninth group — the Painter metaphor — is the sūtra's most famous passage on mind ('The mind is like a skilled painter'). Fig. 0-1 maps the ten-by-ten verse matrix; Fig. 0-2 unpacks the painter's fourfold negation of color and element.\n\n### 〇之二.1 图 〇-1　十林十偈矩阵图\n\n<figure>\n<svg viewBox=\"0 0 1000 420\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"26\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">十林菩萨十偈矩阵：承佛威力×10</text>\n<text x=\"500\" y=\"46\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#8a7a5e\">一格＝一偈；功德林独 12 偈（首组总叙）；合计 102 偈</text>\n<circle cx=\"70\" cy=\"100\" r=\"24\" fill=\"#d4a03c\" stroke=\"#b8863c\"/><text x=\"70\" y=\"105\" text-anchor=\"middle\" font-size=\"9\" fill=\"#fff\">功</text>\n<rect x=\"100\" y=\"80\" width=\"240\" height=\"40\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"220\" y=\"104\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#5a5147\">12 偈（总叙·佛光普照·佛坐夜摩）</text>\n<circle cx=\"70\" cy=\"160\" r=\"24\" fill=\"#b8863c\" stroke=\"#7a5a28\"/><text x=\"70\" y=\"165\" text-anchor=\"middle\" font-size=\"9\" fill=\"#fff\">慧</text>\n<rect x=\"100\" y=\"140\" width=\"200\" height=\"40\" fill=\"#f6efe1\" stroke=\"#c9b98f\"/><text x=\"200\" y=\"164\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#5a5147\">10 偈（难遇·放光普照）</text>\n<circle cx=\"70\" cy=\"220\" r=\"24\" fill=\"#b8863c\" stroke=\"#7a5a28\"/><text x=\"70\" y=\"225\" text-anchor=\"middle\" font-size=\"9\" fill=\"#fff\">勝</text>\n<rect x=\"100\" y=\"200\" width=\"200\" height=\"40\" fill=\"#f6efe1\" stroke=\"#c9b98f\"/><text x=\"200\" y=\"224\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#5a5147\">10 偈（孟夏赫日·光不可量）</text>\n<circle cx=\"70\" cy=\"280\" r=\"24\" fill=\"#b8863c\" stroke=\"#7a5a28\"/><text x=\"70\" y=\"285\" text-anchor=\"middle\" font-size=\"9\" fill=\"#fff\">畏</text>\n<rect x=\"100\" y=\"260\" width=\"200\" height=\"40\" fill=\"#f6efe1\" stroke=\"#c9b98f\"/><text x=\"200\" y=\"284\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#5a5147\">10 偈（不离此座遍一切处）</text>\n<text x=\"330\" y=\"350\" font-size=\"11.5\" fill=\"#8a7a5e\">余六林菩萨（惭愧·精进·力·行·觉·智）各 10 偈同式；觉林「工画师」＝ lg9；智林「但随其自心」＝ lg10 收束</text>\n<text x=\"70\" y=\"380\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" fill=\"#5a5147\">承佛威力 ×10</text>\n</svg>\n<figcaption><b>图 〇-1　十林十偈矩阵图。</b>十林菩萨十偈矩阵（§2.0–2.11 实测）：功德林 12 偈（总叙·首组）·余九组各 10 偈；「承佛威力」×10 即齐整之节拍。<div class=\"en-line\">Fig. 0-1. The ten-grove matrix: each bodhisattva offers exactly ten verses (twelve for the lead grove), 'by the Buddha's majesty' ×10 as the chapter's rhythmic pulse.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. 先看首组之**金色**：功德林独 12 偈——首组总叙佛光与坐，为余九组之纲。\n2. 再看**同构**：余九组各 10 偈——每组起于「承佛威力」、结于末偈，齐整即节拍。\n3. 末看觉林一格：**工画师喻**居第九组（lg9），全品之义理顶点——下一图专释。\n\n### 〇之二.2 图 〇-2　工画师喻·色心四句图\n\n<figure>\n<svg viewBox=\"0 0 1000 360\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"26\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">觉林菩萨·工画师喻：色心四句遮表</text>\n<text x=\"500\" y=\"46\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#8a7a5e\">大种＝地水火风（法性）；彩色＝五蕴（现象）；画师＝心</text>\n\n<rect x=\"120\" y=\"80\" width=\"340\" height=\"50\" rx=\"6\" fill=\"#e6dbc5\" stroke=\"#b8863c\"/>\n<text x=\"290\" y=\"108\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"#5a3d10\">「大種中無色」</text>\n<text x=\"290\" y=\"124\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8a7a5e\">法性中无现象（遮：体不即相）</text>\n\n<rect x=\"540\" y=\"80\" width=\"340\" height=\"50\" rx=\"6\" fill=\"#e6dbc5\" stroke=\"#b8863c\"/>\n<text x=\"710\" y=\"108\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"#5a3d10\">「色中無大種」</text>\n<text x=\"710\" y=\"124\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8a7a5e\">现象中无法性（遮：相不即体）</text>\n\n<rect x=\"120\" y=\"160\" width=\"340\" height=\"50\" rx=\"6\" fill=\"#d4a03c\" stroke=\"#b8863c\"/>\n<text x=\"290\" y=\"188\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"#5a3d10\">「而不離大種」</text>\n<text x=\"290\" y=\"204\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a3d10\">现象不离法性（表：相依于体）</text>\n\n<rect x=\"540\" y=\"160\" width=\"340\" height=\"50\" rx=\"6\" fill=\"#d4a03c\" stroke=\"#b8863c\"/>\n<text x=\"710\" y=\"188\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"#5a3d10\">「色可得安立」</text>\n<text x=\"710\" y=\"204\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a3d10\">现象可得安立（表：体能立相）</text>\n\n<text x=\"500\" y=\"250\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#7a5a28\">→ 心如工畫師 · 畫種種五陰 · 一切世間中 · 無法而不造</text>\n<text x=\"500\" y=\"276\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5a5147\">→ 若人欲了知 · 三世一切佛 · 應觀法界性 · 一切唯心造</text>\n<text x=\"500\" y=\"310\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#8a7a5e\">四句遮表＝不即不离之中道结构；末二偈＝唯心造之正表（全经被引最频之偈）</text>\n<text x=\"500\" y=\"338\" text-anchor=\"middle\" font-size=\"11\" fill=\"#8a7a5e\">〔本文判断〕此四句结构在 §7 数科 L2 代数层为「互斥+互依」之逻辑关系（§第四部 K&#8342;&#8342;&#8342;&#8342; 之同构雏形）</text>\n</svg>\n<figcaption><b>图 〇-2　工画师喻·色心四句图。</b>觉林菩萨工画师喻之色心四句遮表结构（§2.10·lg9 全引）——大种与色之「不即不离」即心与世间之「不即不离」；末偈「一切唯心造」为四句之正表总结。<div class=\"en-line\">Fig. 0-2. The fourfold negation-affirmation of element and color in the Painter metaphor: element contains no color, color contains no element, yet color cannot depart from element, and color can thus be established — culminating in 'all is made by mind alone.'</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. 先看上两框（浅色·遮）：**体不即相·相不即体**——大种与色互不包含。\n2. 再看下两框（金色·表）：**相依于体·体能立相**——不离而可得。\n3. 末读中心线二偈：**工画师→五蕴→唯心造**——从喻到义，一步到位。\n\n### 〇之二.3 本品在第四会（夜摩天宫·十行位）之坐标\n\n本品在第四会居「赞德显体」位：前品升殿（由致），本品十菩萨赞（显体），次品十行（正宗）。\n\n| 品 | 卷 | 位／科 | 一句提撕 | 与本品之关系 |\n|---|---|---|---|---|\n| 昇夜摩天宮品（品 19） | 卷十九首 | 第四会·由致 | 不离而升·感应道交 | 本品之升殿前提 |\n| 十行品（品 21） | 卷二十起 | 第四会·正宗 | 十波罗蜜行位 」。\n\n**六十本对照**：六十本此品作〈菩薩雲集妙勝殿上說偈品第十〉（§6.1）。\n\n### 1.2 品位与脉络\n\n本品承品 19（昇夜摩天宫）之升殿，以十菩萨（**功德林·慧林·勝林·無畏林·慚愧林·精進林·力林·行林·覺林·智林**——十「林」菩萨）各承佛威力说十偈赞佛。十菩萨名之「林」字，慧苑训为「解开敷十行华」（§5.2″）——林即十行之茂盛相。品 21〈十行品〉即由此十林菩萨之首（功德林）说十行。\n\n### 1.3 篇幅与结构预览\n\n**实测**：品文净 **2,543 CJK**（含品题 9 字），**长行 1 段（序集）＋偈组 10 组**（每组 200 CJK＝10 偈，功德林组 240 CJK＝12 偈），**「承佛威力」×10**。结构为**序＋十赞**：序段（佛神力集众·十菩萨名录）→十菩萨各「承佛威力……而說頌言」→偈组各十偈→尾段（结归）。\n\n## 二、卷第十九次品（夜摩宮中偈讚品第二十·本品全文逐段细读）\n\n### 2.0′ 玄记体总纲（据澄观《华严经疏》`T1735`·L.371·疏文程序切片回源）\n\n**门目（疏文实录·至四釋文前）**：\n\n> 夜摩宮中偈讚品夜摩宮中偈讚品第二十初來意者,助化讚揚故、說行體性故、行所依故。然三天偈讚,來意宗趣大旨是同,但解行願以為異耳。釋名、宗趣亦不異前,約處約行少有別耳。\n\n**释文**（疏文实录）：\n\n四釋文者,文亦有三:一集眾、二放光、三偈讚。初中有十:一明集因,亦即各隨其類為現神通也。二「十方」下主菩薩。三「一一」下眷屬數。四從「十萬」下來處分量。然顯數隨位增,信十住百、迴向是萬,此合當千而云十萬,或譯人之誤,或是十百則傳寫之誤。五「其名」下列菩薩字。同名林者,表十行建立故、行類廣多故、聚集顯發故、深密無間故、扶疎庇映故。此十菩薩,表行之體也,可以意消息之。六「此諸菩薩」下來處剎名同名慧者,十解之慧行所依故。七「此諸菩薩各於」下明所事諸佛。同名眼者,以智導行,了了分明,成有目之足故。斯即十行當位之果佛,於此位顯者皆名眼故,宜以當界之佛與當界菩薩共相屬對思而釋之。八「是諸」下至已設敬。九「隨所」下參而不雜。十「如此」下結通無盡。第二「爾時」下放光。足上謂趺背,行必動故。背依輪指得有用故,表行依信解而成用故。餘同前會。第三「爾時功德林」下明說偈讚。十菩薩說,即為十段。亦以東方為始、上方為終,各有說偈所依,謂承佛力等。今初菩薩,且就能說,積行在躬、功德圓滿,故名功德。若就所歎,歎佛勝德,故云功德林。有十二頌,以是會主總敘此會普遍之事。於中二:初八述讚奇特、後四舉德釋成。前中四:初一偈敘此品放光、次二敘前品感應、次三敘此品眾集、後二明自在普周。後四舉德釋成中二:前二舉因顯用、後二辨果用深廣。於中,一體用自在,上半不去遍至、下半卷舒相盡。謂一身即多則一相不可得,多即是一則多相不可得,是故恒一恒多、恒非一多,由此自在。一塵內身無不周于十方,遍十方身並潛一塵之內,皆悉圓遍非分遍,故難思議也。後一深廣相成,上半牒廣辨深、下半釋深顯廣,謂不住故無處不至、不去故不離本位,此釋深也。塵毛等處無不普入,廣無邊也。第二上明功德、此辨智慧,悟此除冥難遇之慧,故名慧林。偈中歎此,十頌分三:初一明佛難遇;次六別釋難遇,於中亦三:初二益廣難遇、次一因圓難遇、後三果深難遇;三有三偈校量顯勝,於中初一長時大行校量、次一長時供佛校量、後一勝物供佛校量。第三勝林,悟勝義甚深之法,故偈歎深廣無涯之德。十頌分二:初三明佛德廣博、後七顯法體甚深,橫豎互顯。前中,初二喻況、後一法合。喻言孟夏月者,取意譯也。梵本敵對,翻云後熱月。西域如來聖教,一歲立為三際,謂熱、雨、寒。《西域記》云「從正月十六日至五月十五日為熱時。」則後熱月言,兼得此方孟夏後半。餘之二際各有四月,準釋可知。赫日之言,但取陽光時長,難窮其際耳。彼方或為四時,與此名同,但以正月黑半為首耳。不見此文,妄為異解。後七中,令於依他修三無性觀,以餘之二性不離依他故、由於二性成依他故。謂圓成是依他體性,遍計但橫執依他,又迷真似現故,即依三性說三無性。三性尚一,豈有三無?三無但是即有之無,三性但是即無之有,有無不二為一實性,有無形奪性亦非性,故於一依他中具修諸觀。文即分三:初三作生無自性性觀、次二兼修勝義無自性性觀、後二修相無自性性觀。今初,即分為三:初偈正觀無生。初句果空,謂緣生果法非先有體從世性、微塵及未來藏因緣心識中來,若有來處即先已有,如鳥來棲樹,何得言生?次句因空。既無有果,對何說因?又世性等亦是妄計因緣有故。次句雙遣。所從是因、所生是果。又初句不自生、次句不他生、次句不共生。又初句非先有而生、次句非先無而生、次句非半有半無,三義各以末句息妄成觀。次偈以無生釋無滅,略有三義:一無生可滅故、二無待對故、三例生從緣故。後偈觀成利益,經云「無生即是佛」,故論云「若見因緣法,則為能見佛」,依他因緣即無生故。次二偈約依他兼修勝義無自性性觀中,前偈遣所觀,上半辨觀、下半明益,各含二義故致兼言。一者成前,謂非唯能相之生,生即無生;所生法體從緣無性,即無所有。此顯依他無生是圓成性益。云深者,即事而真故。二云無生真性亦無所有,即彼勝義無自性性益。云深者,真性不立故。後偈遣能觀,然有二義:一成前所觀,謂以無性故無有能了,如無有人能了龜毛長短大小,知無所了是究竟了。二是正遣能了,既無所了亦無能了,能所兩亡為究竟解。後二偈明相無自性性觀中,初偈正明、後偈總結。前中,上半顯執。不了國等依他,謂為現見,妄計為生故。晉經云「所言有生者,當知由所生。」下半明觀,若知無性則離遍計故。後偈總結,稱於事理之實以觀世等,故善說也。第四以信樂力聞深不畏,名無畏林。偈歎信向益深德故。十頌分二:初一所信之境,謂法身體即法界、智身證極法界,致令應用之身不動而遍。後九聞信之益,分五:初一聞信離惡;次二辨其難聞;次三明聞信成佛,將過去已成證現未當成;四有一偈明聞必有由,勵物起願;五有二頌顯起行益。第五拒妄崇真、拒迷崇智名為慚愧林。偈讚如來大智勝益。十頌分三:初三法說難思、次六以喻並決、後一結德歸佛。今初,初偈明聞生勝益,令物希聞。自在法者,即佛智也。次偈佛窮種智,故下位難思。後偈顯智從生,此文反顯,然有二意:一者成前,謂欲生智慧當於佛求,佛無不知故;不應求之於凡,凡暗冥故。猶搴芙蓉必於深水,而於木末安可得耶?二者成後。智從熏習自種而生,不從煩惱無智所生。是故下言「二心不同時,屬自愚智故」,故應慎所習也。若爾,何以經言「煩惱泥中有佛法矣」?此說在纏如來藏故。然此大智從藏德生,非從迷起。若爾,煩惱即菩提復云何通?約體性故,從所迷故,如波與濕。然實義者,真妄愚智。若約相成,二門峙立;若約相奪,二相寂然。雙照二門非即非離,若說一者,離之令異,如此章中;若云異者,合之令同,如後章是。善須得意,勿滯於言。若準晉經云非從智慧生,亦非無智生,了達一切法,滅除世間闇。則顯智體絕於愚智,不稱實了則名無智。此偈雙明性相,後喻但顯二相不同。二並決中二:先五明二性相違、後一辨功能不等。今初,唯第二偈三句是喻,餘偈喻合各有半偈。一約色非色者,非色謂心,緣慮質礙,體性不同故。二中有二喻,相無相者,理事相反。生死涅槃,真妄相反。雖同一體,分別義門不相是故。三成之與壞,約相別故。四初心後心,時不同故。五諸識身所用別故,緣會不同,故眼無耳用。又此眼識不合餘根,識身同識尚不相合,愚智性異安得相生?二功能不等者,非唯二性各別,然智能滅愚、愚不滅智,藥能去毒、毒不去藥,亦猶明能滅闇、闇不滅明。三一偈結歸如來逈出世表,故難值遇。第六勤觀理事同無差別,離身心相,故名精進。十頌總相顯佛此德。前即無差之差,此乃差之無差。二章相接,顯非即離亦互相成。十頌分二:初一約法雙標、後九就喻雙釋。今初也。初句標其所知五類之法皆無有差,餘三句對人以顯,次句揀非餘境,下半唯佛究盡。後九釋中,前五釋所知、後四釋能知。前中,初四正釋、後一遣疑。前中皆上半喻,下半法無差,所由在於末句。然其能喻不離諸法,取其所易喻其所難耳。一體色無別喻,此喻為總。喻雖是一,法合有二,該橫豎故。豎約理事交徹。法者事也,非法理也,色即空故。亦可法真法也,非法妄法也。取文雖異,義旨乃同。謂如金之黃色與金體斤兩性無差別,隨取互收。合中,金是所依,喻其真法;色是能依,喻妄非法。以妄無體攬真而起,則真無不隱,唯妄現也;以真體實,妄無不盡,唯真現也。是則無體之妄不異體實之真,故云無有異也。亦同《密嚴》「如金與指環,展轉無差別。」橫者,異法相望。法者,可軌之法也。非法者,不可軌之法也。又法謂有法,非法謂無故。《中論》釋法不生非法,云有不生無故。體性無異者,謂同如故。然前義正順於喻,後義乃順標中。諸法之言,要由初義性相無差,方得顯於後義事事無差。若但用後義,未顯相全同性,那得顯於事事同於一性?第二偈假名不實喻。以真奪俗,是故無差。攬緣成眾生,即虛非眾生。所遣既無,能遣安有?故俱無實。以喻諸法皆無實義,並從緣故。若以正報為眾生,依報非眾生,乃全是所喻,非實之相尚難顯了。三三世互無喻,喻無相故無別。謂若未來有過去者,應名過去,何名未來?故知定無過現之相。文舉一隅,應反餘二。諸法無相如彼互無,此以差別喻無差別。四四相非實喻,喻無性故無差別。生等四相,離所相法無別自性。一切諸法,離所依理無別自性。此以相無,喻於性無。後遣疑者,疑云:若都無別,云何見有性相等殊?故此釋云:亦如涅槃,體離有無、百非斯絕,而強立名字曰餘無餘。諸法亦然,真俗並虛,分別成異。若離分別,則無一切境界之相。第二四偈喻能知者,皆展轉遣疑。初偈疑云:既有分別,則有能知。故釋云:離所數物,無能數數。既所知無性,何有能知?無知之知是真了法。次復疑云:若依向喻,能數喻能知。能知雖無,所知猶有故,復用能數法以喻所知,智慧差別以喻能知。反覆相遣顯無差理,謂一上加一名之為二,乃至百千皆是諸一,由能數智作百千解故。晉譯中第三句云皆悉是本數,今譯明一多相待故無體性,喻彼妄想於無性中計為有無耳。次又疑云:都無能所,何名佛智?故釋云:能所雙亡,佛智斯顯。故所知妄法如世成壞,能知真智湛若虛空。尚不初成,況當有敗?如〈出現品〉。又權智照俗同世成壞,權即是實,如不離空。末偈疑云:佛智既等,應用何殊?釋云:隨心妄取,佛無異相。又謂常無常,如各取空;佛智雙非,如空無別。第七智了三種世間性相,諸邊不動,故名力林。十頌顯佛離相真智,於中分三:初四遍明世間、次五雙遣世及出世、後一觀成利益。今初,略有二觀:初二偈攝末歸本觀,顯眾生世間空;後二緣生無作觀,兼顯器世間空。今初也。初二句推假名眾生不出三世,顯是無常;次二句推三世眾生不出於蘊,顯無有我;次句蘊由業生以明果空,顯非邪因;次句推業唯心,明心外無法;次句體心如幻,不離性空及與中道,如幻無性故,非有非無故。末句以本例末,則上五一如皆展轉緣生故。二緣生無作觀中,初偈無作故緣成、後偈緣成即無作。今初,言不自他作者,通遣諸非。一約外道,非自性等作,亦非梵天等他作,但以虛妄無業報故,廣如三論破。二約小乘,非同類因自作,亦非異熟因他作,以皆相待無自性故。三約因緣相待,如《十地論》及《對法》所明。四約以因望果,《中論》云「自作及他作,共作無因作,如是說諸苦,於果則不然。」此自他言含於二意:一以果為自、以因為他,論云「果法不能自作己體」故。二以因為自、以緣為他,此明不從因緣,無果待對故。離既不成,合亦不成,故論云「若彼此共成,應有共作。若彼此尚無作,何況無因作。」彼此即自他也。下半二意:一不礙緣成,以遣無因;二非但不礙幻有,亦由有空義故能成因果,是則不動真際建立諸法。又非但說於苦四種義不成,一切外萬物四義皆不成,成壞之言顯兼器界。後偈緣成即無作者,向約幻有雖言成壞,幻有即空故不應說,是則不壞假名而說實相。第二五頌雙遣中,初半偈假徵、次半標答、次偈出體,釋成蘊是世間緣成,寂滅即出世間故。《淨名經》云「世間性空即是出世間。」一體說二,故云假名。次二句徵蘊名體。世以蘊為體,蘊以何為體?次二句標答,上句答體;下句答名,應名無生五蘊。既云性不可滅,則顯前非事滅。次一偈釋成,空故不滅亦非事在。不滅則知本自不生,是無生義。後一偈例出世間,顯智正覺世間,亦應緣無性。又證無性之理為自體故。末後一偈明觀益者,佛以實法為其體故,見法則常見佛也。第八照理觀佛而起正修,故名行林。十頌觀佛體相普周德,於中分二:前七約喻顯修、後三見實成益。前中復二:初二地種無性普周喻,喻佛無生遍應德;後五業相無依成事喻,喻佛難思現用德,於中二,三偈喻、二偈合。前中,初一明業果互依。次偈明相依無性,業不離生故業性空,因業有生故生無來處。後偈雙結難思,顯成真觀。若逆推其本,業復有因卒至無住,無住無本故無所見,無見之見方了業空。二頌合中,初偈難思普應,合上業果互依。次二句以互不相是,合互依無性。身若是佛,轉輪王等即是如來;佛若是身,正覺之心應同色相。後二句結示真體唯如唯智,合第三偈難思達本。二有三偈明見實中,初頌見佛即了法,以見佛稱性,不疑同體故。次偈見法即見佛,了法即性淨,知佛不住性相故。後偈明了正修行,照了無相心寂分別,寂照雙流故名正念。則從佛法生,是法王子故。又上三偈,初知離名為法、次知法名為佛、後知無名為僧,窮見三寶之實體也。第九照心本末名為覺林。十頌顯於具分唯識,大分為二:前五約喻顯法、後五法合成觀。前中二:前二約事、後三約心。乍觀此喻,似前喻所作、後喻能作;細尋喻意,前喻却親,故喻真妄依持、後喻心境依持。然依生滅八識但有心境依持,而即如來藏心故有真妄依持,以會緣入實差別相盡唯真如門,即前喻所顯;攝境從心不壞相故是生滅門,即後喻所明。存壞不二、唯一緣起,二門無礙唯是一心,故下合中但明心造;欲分義別,喻顯二門,是名具分唯識。今初,二偈真妄依持即真如門,攝一切法也。初偈,初句總喻一心、次句喻隨緣熏變成依他也、次句不了依他故成遍計、第四句喻依他相盡體即圓成。後偈喻依圓真妄非即離義,上半不即能所異故、大種中無色身所觸故、色中無大種眼所見故。又能造無異畫色差別故、喻妄依真能所異故、性無差別相不同故。下半不離義,謂所造青等離能造地等無別體故、假必依實同聚現故、喻妄必依真性相交徹故。然大必能造色,非色能造大,喻妄必依真起,真不依妄生,故不云也。然不離於色,有大種可得。後三約心者,喻於唯識心生滅門。於中,初一亦明心境不即離義,上半不即,心中無彩畫,不可見故。彩畫中無心,無慮知故,喻能變所變見相別故。下半不離,隨心安布故,喻離心則無境界相故。要由心變於境,非是境能變心,故云唯識,不言唯境;但云然不離於心有彩畫可得,不言然不離於畫而有心可得。次一偈喻能所變之行相,明畫師巧思不住,變態多端。所畫非心誰相知者,法合。彼心者,真妄和合心也。恒言遮斷,不住遮常,如瀑流故。含一切種,故云無量相。甚深細,名難思議。次句頓現萬境。下句喻所變境離心無體。又常不住者,無住為本故。無量難思,總標深廣。下二句釋,示現一切,廣故難思;各不相知,深故難思。三一偈,重喻上來不相知義。謂非唯所畫之法自不相知,喻所變之境無有體性。能畫之心念念生滅,自不相知故,亦不能知於所畫,雙喻心境皆無自性,各不相知故。言不能知自心,而由心故畫。又雖不知畫心,而由心能畫,喻眾生雖迷心現量,而心變於境。又由不能知所畫,但畫於自心,故能成所畫,喻眾生由迷境,唯心方能現妄境。又喻正由無性方成萬境,故云諸法性如是。第二五偈合中分四:初一偈合。初二句,初句合最初句心者,即總相之心也。下三句合第二句諸世間者,即諸彩色,此句為總。下出諸相,即蘊界處,故云無法不造故。晉譯云造種種五蘊,《正法念》云:心如畫師手,畫出五彩,黑青赤黃白及白白,故上文云「布諸彩色」。畫手,譬心六色,如次喻地獄、鬼、畜、修羅、人、天。若言種種則十法界,五蘊等法皆心所造。次二頌合前初偈下半,於中二:初一舉例以合,由成前諸言,謂如世五蘊從心而造,諸佛五蘊亦然。如佛五蘊,餘一切眾生亦然,皆從心造。然心是總相,悟之名佛,成淨緣起;迷作眾生,成染緣起。緣起雖有染淨,心體不殊,佛果契心同真無盡,妄法有極故不言之。若依舊譯,云心佛與眾生,是三無差別。則三皆無盡,無盡即是無別之相。應云心佛與眾生,體性皆無盡。以妄體本真故亦無盡,是以如來不斷性惡,亦猶闡提不斷性善。又上三各有二義:總心二義者,一染、二淨。佛二義者,一應機隨染、二平等違染。眾生二者,一隨流背佛、二機熟感佛。各以初義成順流無差,各以後義為反流無差,則無差之言含盡無盡。又三中二義,各全體相收,此三無差成一緣起。上約橫論。若約一人,心即總相,佛即本覺、眾生即不覺,乃本覺隨緣而成此二,為生滅門;下半此二體性無盡,即真如門,隨緣不失自真性故,正合前文大種無差。若謂心佛眾生三有異者,即是虛妄取異色也。後一偈反勢合,謂妄取異色則不知心行,若知心行普造世間則無虛妄,便了真實。即正合大種無差,兼明觀益。三一偈有二義:一雙合前真妄心境不即離義,上半合前二三偈之上半,即前互無不即之義,心即能變及心體故。身即所變,謂有根身是識相分及性之相故。下半雙合前兩偈下半不離之義,謂雖不相住,而依心現境,依體起用作諸佛事,體用不礙,為未曾有。二又將合前第四偈,謂上半合前恒不住義,及各不相知而能作佛事,合示現一切色。自在未曾有,合無量難思議,為兼此義,不以互無言之而言不住,譯之妙也;晉經但云心亦非是身,但得前文互無之義。末後一偈結勸,即反合前畫師不知心喻。若不知心,常畫妄境;觀唯心造,則了真佛。上半有機、下半示觀。然有二釋。一云:若欲了佛者,應觀法界性。上一切差別皆唯心作,以見法即見佛故。二觀法界性是真如門,觀唯心造即生滅門,是雙結也。又一是真如實觀、一是唯心識觀,大乘觀要不出此二,觀此二門唯是一心,皆各總攝一切法盡,二諦雙融無礙一味,三世諸佛證此為體故。欲知彼者,應當觀此既為妙極,是以暫持能破地獄。第十鑒達諸佛逈超色聲,心言路絕,故云智林。頌顯此德,十頌分二:初一標章、後九解釋。今初。若準晉本,第四句云所思不可思,則四句皆標章。今經則上三句標章、第四句總結,謂標章遮過令不依識,明佛三業非凡境故;第四總結顯德示智入門,謂若了唯一真心,言思斯絕,則合菩提之體故。梵本第四句云於不思何思,即是以一真心而成三業。三業不離一真,形奪相融,不可以一多思也。又非唯佛之三業同一真心,亦與觀者真心非異非一,故難思議。若能離於思議,則終日見聞亦無所見聞矣。後九別釋中,即分三別:初二釋不可取、次四釋不可見、後三釋不可聞。今初也,初半偈奪以正釋、後一偈半縱以生過。然有量等實通三業,為對下二,且就智明。有如理智不可言量,有如量智不可言無。又一智即是一切智故,眾智所用不相雜故。後縱中,初半縱其令取,必無果利;後一偈顯取之失。夫說法者當如法說,法無所得而欲取得,心計有說執石為寶是謂自欺,理無謂有是為自誑,終不契理。故云「己事不成,污他心識」,故不令眾喜。又以量無量取,則墮斷常,自損損他,故皆不可。第二有四偈,歎佛色身深奧,釋不可見章。文分為二:初一法說、後三喻況。今初。非色現色,故稱為妙。物感斯現,是曰無邊。又色即空,故邊即無邊。又淨識所現空色相融,故身分總別乃至一毛皆無邊量。攝德無盡具上三義,豈可以盡言?次三喻中分二:初一摩尼隨映喻,喻佛地實無異色,隨感便現,故言無色而現色。喻全似法,故但合云佛亦如是。後二偈淨空現色喻,喻佛法身體非是色,能現麁妙一切諸色。初偈喻、後偈合。四句對前,但二三前却,此是分喻,故委合之。以空但不可眼見而可心知,佛所現色心行處絕,故為分喻。心眼尚不能見,況肉眼哉,此即見中絕思議也。問:二喻豈不違經?上云有無邊妙色,今云非色無色耶?亦違諸論,佛有妙色為增上緣。古德云:若約初教大乘,義如前說。若實教大乘,佛地無此色聲麁相功德,但有大智大悲大定大願諸功德等。然諸功德等並同證真如,若眾生機感即現色無盡。既無不應機時,故所現色亦無斷絕。此以隨他為自,更無別他自,約此為有,故云無邊妙色。今約自說,不約隨他,故云無色非色也。亦可前喻初教,後喻實教。有云:若爾,彼能現體為有無耶?十蓮華藏塵數之相皆示現耶?八地七勸,言佛色聲皆無有量,寧不違耶?若執佛果唯有如如及如如智獨存者,無漏蘊界窮未來際,遍因陀羅網皆非實事,亦違《涅槃》滅無常色而獲常色,此義具如《智慧莊嚴經》說。然上二解各是一理,並符經論,今當會之。攝末從本唯如如智,自受用色智所現故;攝相從性但有如如,既所現即如,何妨妙色?故有亦無失。然如外無法,何要須現?萬法即如,如即法身,更何所現?故云唯如如,及如如智獨存,於理未失。如色相即有無交徹,若定執有無,恐傷聖旨,故今二喻前後相成。摩尼現色但云無色,無即但是無他,非無自體。淨空現色既云非色,非即非其自體,不獨無他。前喻自受用身、後喻法身,此二不二為佛真身,故下經云「佛以法為身,清淨如虛空,所現眾色形,令入此法中。」第三三偈釋所聞不可聞中,初約應聲緣感,便應離相離性,故聲非如來、應不差機。非聲之聲故云不離,故以聲取是行邪道,若離聲取未免斷無。次頌約體釋,湛然不遷。心離分別,尚非心見,安可耳聞?猶如天鼓無心出故,此即聞中不思議也。後偈釋疑。疑云:為是有法不可聞耶?為是無法無可說耶?上半順理、後句答。次疑云:若爾,何以現聞教法?下半釋云:但自心變,非佛說也。若依權教,此約有影無本。然本影相望通有四句,若依此宗,果海離言故無有說,用隨機現謂如是說。而此本質亦是自心,餘如懸談中說。大方廣佛華嚴經疏卷第二十一大方廣佛華嚴經疏卷第二十二唐清涼山大華嚴寺沙門澄觀撰\n\n> 体例：docs/工程治理/玄记体重排体例_v1.md——疏文照录；下节逐段层保持不动，与此总纲互指。\n\n\n### 2.0 结构总表\n\n| 段 | 说法者 | 起句 | 偈数 |\n|---|---|---|---|\n| 序 | （经文） | 爾時佛神力故 | — |\n| 1 | 功德林菩薩 | 佛放大光明 | 12 |\n| 2 | 慧林菩薩 | 世間大導師 | 10 |\n| 3 | 勝林菩薩 | 譬如孟夏月 | 10 |\n| 4 | 無畏林菩薩 | 如來廣大身 | 10 |\n| 5 | 慚愧林菩薩 | 若人得聞是 | 10 |\n| 6 | 精進林菩薩 | 諸法無差別 | 10 |\n| 7 | 力林菩薩 | 一切眾生界 | 10 |\n| 8 | 行林菩薩 | 譬如十方界 | 10 |\n| 9 | 覺林菩薩 | 譬如工畫師 | 10 |\n| 10 | 智林菩薩 | 所取不可取 | 10 |\n\n**统计**：十组 102 偈（功德林 12＋余九组各 10）；「承佛威力」×10。\n\n### 2.1 序段（全引）\n\n> 夜摩宮中偈讚品第二十\n爾時，佛神力故，十方各有一大菩薩，一一各\n與佛剎微塵數菩薩俱，從十萬佛剎微塵\n數國土外諸世界中而來集會，其名曰：功德\n林菩薩、慧林菩薩、勝林菩薩、無畏林菩薩、慚\n愧林菩薩、精進林菩薩、力林菩薩、行林菩薩、\n覺林菩薩、智林菩薩。此諸菩薩所從來國，\n所謂：親慧世界、幢慧世界、寶慧世界、勝慧\n世界、燈慧世界、金剛慧世界、安樂慧世界、日\n慧世界、淨慧世界、梵慧世界。此諸菩薩各於\n佛所淨修梵行，所謂：常住眼佛、無勝眼佛、\n無住眼佛、不動眼佛、天眼佛、解脫眼佛、審諦\n眼佛、明相眼佛、最上眼佛、紺青眼佛。是諸菩\n薩至佛所已，頂禮佛足，隨所來方，各化作摩\n尼藏師子之座，於其座上結跏趺坐。如此世\n界中，夜摩天上菩薩來集；一切世界，悉亦如\n是，其諸菩薩、世界、如來，所有名號悉等無\n\n別。爾時，世尊從兩足上放百千億妙色光\n明，普照十方一切世界；夜摩宮中，佛及大\n眾靡不皆現。爾時，功德林菩薩承佛威力，普\n觀十方而說頌言：\n\n**疏解**：佛神力集众——十方各一大菩萨与佛刹微尘数菩萨俱从十万佛刹外来集，十「林」菩萨为首。此段与品 14（须弥顶偈赞）之集众结构同构（§3.3），而菩萨名从「X首」变为「X林」——从**信位之首**进入**行位之林**。\n\n**【句释】**（疏训释·体例 v1 第3条·L.430·据澄观《华严经疏》`T1735`）：\n- 「然三天偈讚，來意宗趣大旨是同，但解行願以為異耳」——三天偈赞总纲：来意宗趣大旨同——以解·行·愿为异（忉利表住·夜摩表行·兜率表向）。\n- 「同名林者，表十行建立故、行類廣多故」——十菩萨同名林：表十行建立·行类广多·聚集显发·深密无间·扶疏庇映——行之体。\n- 「同名眼者，以智導行，了了分明，成有目之足故」——所事诸佛同名眼：以智导行了了分明、成有目之足——十行当位之果佛皆名眼。\n\n### 2.2–2.11 十菩萨偈赞（各组全引＋三层疏解）\n\n> **2.2 功德林菩薩（12 偈·承佛威力）**：\n>\n> 「佛放大光明，普照於十方，\n悉見天人尊，通達無障礙。\n佛坐夜摩宮，普遍十方界，\n此事甚奇特，世間所希有。\n須夜摩天王，偈讚十如來，\n如此會所見，一切處咸爾。\n彼諸菩薩眾，皆同我等名，\n十方一切處，演說無上法。\n所從諸世界，名號亦無別，\n各於其佛所，淨修於梵行。\n彼諸如來等，名號悉亦同，\n國土皆豐樂，神力悉自在。\n十方一切處，皆謂佛在此，\n或見在人間，或見住天宮。\n如來普安住，一切諸國土，\n我等今見佛，處此天宮殿。\n昔發菩提願，普及十方界，\n是故佛威力，充遍難思議。\n遠離世所貪，具足無邊德，\n故獲神通力，眾生靡不見。\n遊行十方界，如空無所礙，\n一身無量身，其相不可得。\n佛功德無邊，云何可測知？\n無住亦無去，普入於法界。」\n\n**疏解**：功德林为十林之首（品 21 十行品之说主），其偈总叙佛光普照·佛坐夜摩·佛身遍坐——为全品之**总纲偈**。前二偈立「光」与「坐」，后十偈展开佛之十种遍。\n\n> **2.3 慧林菩薩（10 偈）**：\n>\n> 「世間大導師，離垢無上尊，\n不可思議劫，難可得值遇。\n佛放大光明，世間靡不見，\n為眾廣開演，饒益諸群生。\n如來出世間，為世除癡冥，\n如是世間燈，希有難可見。\n已修施戒忍，精進及禪定，\n般若波羅蜜，以此照世間。\n如來無與等，求比不可得，\n不了法真實，無有能得見。\n佛身及神通，自在難思議，\n無去亦無來，說法度眾生。\n若有得見聞，清淨天人師，\n永出諸惡趣，捨離一切苦。\n無量無數劫，修習菩提行，\n不能知此義，不可得成佛。\n不可思議劫，供養無量佛，\n若能知此義，功德超於彼。\n無量剎珍寶，滿中施於佛，\n不能知此義，終不成菩提。」\n\n**疏解**：「世間大導師，離垢無上尊，不可思議劫，難可得值遇」——佛之**难遇**与**放光普照**对举，难遇而现见，弥显其希有。\n\n> **2.4 勝林菩薩（10 偈）**：\n>\n> 「譬如孟夏月，空淨無雲曀，\n赫日揚光暉，十方靡不充。\n其光無限量，無有能測知，\n有目斯尚然，何況盲冥者。\n諸佛亦如是，功德無邊際，\n不可思議劫，莫能分別知。\n\n諸法無來處，亦無能作者，\n無有所從生，不可得分別。\n一切法無來，是故無有生，\n以生無有故，滅亦不可得。\n一切法無生，亦復無有滅，\n若能如是解，斯人見如來。\n諸法無生故，自性無所有，\n如是分別知，此人達深義。\n以法無性故，無有能了知，\n如是解於法，究竟無所解。\n所說有生者，以現諸國土，\n能知國土性，其心不迷惑。\n世間國土性，觀察悉如實，\n若能於此知，善說一切義。」\n\n**疏解**：孟夏赫日之喻——日光无量无有能测，喻佛光遍照而不可量。日光喻为华严常用之佛光象喻（与品 1 起首之「大光明莲华藏」对照）。\n\n> **2.5 無畏林菩薩（10 偈）**：\n>\n> 「如來廣大身，究竟於法界，\n不離於此座，而遍一切處。\n若聞如是法，恭敬信樂者，\n永離三惡道，一切諸苦難。\n設往諸世界，無量不可數，\n專心欲聽聞，如來自在力。\n如是諸佛法，是無上菩提，\n假使欲暫聞，無有能得者。\n若有於過去，信如是佛法，\n已成兩足尊，而作世間燈。\n若有當得聞，如來自在力，\n聞已能生信，彼亦當成佛。\n若有於現在，能信此佛法，\n\n亦當成正覺，說法無所畏。\n無量無數劫，此法甚難值，\n若有得聞者，當知本願力。\n若有能受持，如是諸佛法，\n持已廣宣說，此人當成佛。\n況復勤精進，堅固心不捨，\n當知如是人，決定成菩提。」\n\n**疏解**：「**如來廣大身，究竟於法界，不離於此座，而遍一切處**」——**不离而遍**之又一显文（与品 19「不离而升」同构），本品即以此义赞佛之体。\n\n> **2.6 慚愧林菩薩（10 偈）**：\n>\n> 「若人得聞是，希有自在法，\n能生歡喜心，疾除疑惑網。\n一切知見人，自說如是言，\n如來無不知，是故難思議。\n無有從無智，而生於智慧，\n世間常暗冥，是故無能生。\n如色及非色，此二不為一，\n智無智亦然，其體各殊異。\n如相與無相，生死及涅槃，\n分別各不同，智無智如是。\n世界始成立，無有敗壞相，\n智無智亦然，二相非一時。\n如菩薩初心，不與後心俱，\n智無智亦然，二心不同時。\n譬如諸識身，各各無和合，\n智無智如是，究竟無和合。\n如阿伽陀藥，能滅一切毒，\n有智亦如是，能滅於無智。\n如來無有上，亦無與等者，\n一切無能比，是故難值遇。」\n\n**疏解**：「若人得聞是希有自在法，能生歡喜心，疾除疑惑網」——闻法之效；「一切知見人，自說如是言」——佛自说而非他授。\n\n> **2.7 精進林菩薩（10 偈）**：\n>\n> 「諸法無差別，無有能知者，\n唯佛與佛知，智慧究竟故。\n如金與金色，其性無差別，\n法非法亦然，體性無有異。\n眾生非眾生，二俱無真實，\n如是諸法性，實義俱非有。\n譬如未來世，無有過去相，\n諸法亦如是，無有一切相。\n譬如生滅相，種種皆非實，\n諸法亦復然，自性無所有。\n涅槃不可取，說時有二種，\n諸法亦復然，分別有殊異。\n如依所數物，而有於能數，\n彼性無所有，如是了知法。\n譬如算數法，增一至無量，\n數法無體性，智慧故差別。\n譬如諸世間，劫燒有終盡，\n虛空無損敗，佛智亦如是。\n如十方眾生，各取虛空相，\n諸佛亦如是，世間妄分別。」\n\n**疏解**：「**諸法無差別，無有能知者，唯佛與佛知**」——诸法之无差别义唯佛能知；「**如金與金色，其性無差別**」——金与金色之喻即**体与色不二**之最简表述，为本品之义理核心偈。\n\n> **2.8 力林菩薩（10 偈）**：\n>\n> 「一切眾生界，皆在三世中，\n三世諸眾生，悉住五蘊中。\n諸蘊業為本，諸業心為本，\n心法猶如幻，世間亦如是。\n世間非自作，亦復非他作，\n\n而其得有成，亦復得有壞。\n世間雖有成，世間雖有壞，\n了達世間者，此二不應說。\n云何為世間？云何非世間？\n世間非世間，但是名差別。\n三世五蘊法，說名為世間，\n彼滅非世間，如是但假名。\n云何說諸蘊？諸蘊有何性？\n蘊性不可滅，是故說無生。\n分別此諸蘊，其性本空寂，\n空故不可滅，此是無生義。\n眾生既如是，諸佛亦復然，\n佛及諸佛法，自性無所有。\n能知此諸法，如實不顛倒，\n一切知見人，常見在其前。」\n\n**疏解**：「一切眾生界皆在三世中……諸蘊業為本，諸業心為本」——众生·三世·五蕴·业·心之层层追问，**心为最后本**：此为觉林偈（工画师）之先声。\n\n> **2.9 行林菩薩（10 偈）**：\n>\n> 「譬如十方界，一切諸地種，\n自性無所有，無處不周遍。\n佛身亦如是，普遍諸世界，\n種種諸色相，無主無來處。\n但以諸業故，說名為眾生，\n亦不離眾生，而有業可得。\n業性本空寂，眾生所依止，\n普作眾色相，亦復無來處。\n如是諸色相，業力難思議，\n了達其根本，於中無所見。\n佛身亦如是，不可得思議，\n種種諸色相，普現十方剎。\n\n身亦非是佛，佛亦非是身，\n但以法為身，通達一切法。\n若能見佛身，清淨如法性，\n此人於佛法，一切無疑惑。\n若見一切法，本性如涅槃，\n是則見如來，究竟無所住。\n若修習正念，明了見正覺，\n無相無分別，是名法王子。」\n\n**疏解**：「譬如十方界一切諸地種，自性無所有，無處不周遍。佛身亦如是」——地种喻佛身遍在而自性空。\n\n> **2.10 覺林菩薩（10 偈·工画师喻·全经名段）**：\n>\n> 「譬如工畫師，分布諸彩色，\n虛妄取異相，大種無差別。\n大種中無色，色中無大種，\n亦不離大種，而有色可得。\n心中無彩畫，彩畫中無心，\n然不離於心，有彩畫可得。\n彼心恒不住，無量難思議，\n示現一切色，各各不相知。\n譬如工畫師，不能知自心，\n而由心故畫，諸法性如是。\n心如工畫師，能畫諸世間，\n五蘊悉從生，無法而不造。\n如心佛亦爾，如佛眾生然，\n應知佛與心，體性皆無盡。\n若人知心行，普造諸世間，\n是人則見佛，了佛真實性。\n心不住於身，身亦不住心，\n而能作佛事，自在未曾有。\n若人欲了知，三世一切佛，\n\n應觀法界性，一切唯心造。」\n\n**疏解**：「**譬如工畫師，分布諸彩色，虛妄取異相，大種無差別。大種中無色，色中無大種，而不離大種，色可得安立**」——工画师喻为全经最著名之譬喻之一：**心如画师，五蕴如彩色，大种如法性**。色与大种之「不即不离」四句（无色/无大种/不离/可立）即**色心关系之完整遮表**。末偈「若人欲了知，三世一切佛，應觀法界性，一切唯心造」为全经被引最频之偈。此组偈之深广非本节所能尽，详见 §4.2。\n\n> **2.11 智林菩薩（10 偈）**：\n>\n> 「所取不可取，所見不可見，\n所聞不可聞，一心不思議。\n有量及無量，二俱不可取，\n若有人欲取，畢竟無所得。\n不應說而說，是為自欺誑，\n己事不成就，不令眾歡喜。\n有欲讚如來，無邊妙色身，\n盡於無數劫，無能盡稱述。\n譬如隨意珠，能現一切色，\n無色而現色，諸佛亦如是。\n又如淨虛空，非色不可見，\n雖現一切色，無能見空者。\n諸佛亦如是，普現無量色，\n非心所行處，一切莫能覩。\n雖聞如來聲，音聲非如來，\n亦不離於聲，能知正等覺。\n菩提無來去，離一切分別，\n云何於是中，自言能得見？\n諸佛無有法，佛於何有說？\n但隨其自心，謂說如是法。」\n\n**疏解**：「所取不可取，所見不可見，所聞不可聞，一心不思議」——四不可（取/见/闻/思议）收束全品之赞：**赞即遮**。末偈「諸佛無有法，佛於何有說？但隨其自心，謂說如是法」——说而无说，随自心现，为全品之结归。\n\n### 2.12 尾段（全引）\n\n> 21十行品之一\n\n**疏解**：类通十方·结归本品。\n\n## 三、旁参与前接\n\n### 3.1 承前（品 19）\n\n承〈昇夜摩天宮品〉之升殿——品 19 是「由致」（佛升殿·天王迎），本品是「赞德显体」（十菩萨偈赞）：**升殿之后继以赞德**，与品 13→品 14（须弥顶→偈赞）之两会两级同构（品 13 十佛偈在本品内·品 19 十菩萨偈另出为品 20）。\n\n### 3.2 启后（品 21–22）\n\n十林菩萨之首功德林即品 21〈十行品〉之说主——本品十林之集即十行之**人事预备**；觉林「心画师」偈为品 21 十行之**义理预备**（心造万法→行从心起）。\n\n### 3.3 与品 14 之同构（两会偈赞对照）\n\n| 事 | 品 14（须弥顶偈赞） | 本品（夜摩偈赞） |\n|---|---|---|\n| 集众 | 佛神力·十方各十大菩萨 | 佛神力·十方各一大菩萨众 |\n| 菩萨名 | X首（佛力/自在/…） | X林（功德/慧/…） |\n| 偈组 | 十菩萨各十颂 | 十菩萨各十偈（功德林 12） |\n| 表法 | 同名慧/华/月 | 同名林（十行华） |\n| 承 | 承佛威力 ×10 | 承佛威力 ×10 |\n\n两会偈赞结构全同而菩萨名系异——**从首至林＝从信位入行位**之命名学。\n\n## 四、义理要点与名相\n\n### 4.1 觉林偈·心画师喻（全经名段）\n\n觉林菩萨十偈为本品之义理顶点。其「心如工画师」一偈被后世引为华严「唯心»义之代表作：\n\n> 「**心如工畫師，畫種種五陰，一切世間中，無法而不造。**」（§2.10·据六十本对读补引）\n\n十偈之结构：画师→彩色→大种→虚妄取→无差别→不即不离→心不觉→色心互无→互存→**唯心造**——完整之「色心关系」遮表论证。\n\n### 4.2 名相\n\n- **林**（*vana*）：十菩萨通名——茂盛义，表十行之将开。\n- **偈赞**（*gāthā-praise*）：本品为纯偈赞体，无长行说法——偈赞即本品之说。\n- **金与金色**：精进林偈之体色不二喻——金（体）金色（相）无差别。\n\n## 五、注疏选要（节级贯通·诸家会读）\n\n### 5.1 澄观（`T1735` 本品段）\n\n> 「**夜摩宮中偈讚品第二十（第二十經）。初來意有六。一前是正位。今辨位中之行。故次來也。二前明诸位別行。今辨诸位通行。三前通道俗。今別顯出家所行。四前明隨相差別。今顯會緣入實。五為顯入住之因。謂自他二種梵行淨故。**」（`T1735`·NFKC 归一·〔L.252 摘〕）\n\n〔注〕此段实出自梵行品来意（疏卷十七），澄观于本品之判散见前后来段——本品之完整四门判俟 L.253b 深化批补引〔如实记〕。\n\n**【要点提炼】**（L.261）\n\n1. **觉林「工画师」喻四句遮表**：「大种中无色·色中无大种·不离大种·色可得安立」——体不即相/相不即体/相依体/体能立相，四句完整遮表。\n2. **「一切唯心造」**：全经被引最频之偈——心造万法，五蕴即心之画。\n3. **智林「但随其自心，谓说如是法」**：说而无说，随自心现——赞即遮（全品以赞收遮）。\n4. **十林菩萨之「林」训**：慧苑「解开敷十行华」（§5.2″）——林即十行之茂盛相。\n\n**【阐释】**（〔本文判断〕）本品纯偈赞体（无长行说法），**赞即说**——十菩萨以偈代论，赞佛功德即显行相。觉林偈之义理地位尤高：品 21 十行之义理前提（心造万法→行从心起）由此奠立。\n\n### 5.2 诸家（程序取窗实引·L.310/L.314）\n\n**李通玄《新華嚴經論》**（289 字·程序取窗）：\n\n> 夜摩宮中化作寶蓮華師子之座。此約行位在一切生死具大悲行。萬行以理智體得無染故。以是義故。以蓮華為座體。在此十住位中。以得一切諸佛智慧光明普照萬法故。安置普光明藏師子之座。此十住中安置其座。十千層級十行中化作百萬層級師子之座。為十住位中初始入位。明須彌之上猶連地居。明心有所得從信創會見法之執。以此義故。師子座須有安置。又方便三昧是安置故。約十住位中理智妙慧功成。即十行位中以妙用而化其座。又約行從空而立。還約位在夜摩空居之天。云座十千層級。又百萬層級。及帝釋天宮夜摩天宮。總明隨位昇進行相。若也正入法智慧流。不出毫塵。遍諸剎海其座。乃至十迴向十地高下嚴飾各各隨位不同。准例知之。\n\n（程序取窗（L.314）·各照底本）\n**道霈《華嚴經疏論纂要》**（240 字·程序取窗）：\n\n> 夜摩宮中化作寶蓮華師子之座。此約行位.在一切生死.具大悲。行萬行。以理智體得無染故。以是義故.以蓮華為座體。在此十住位中.以得一切諸佛智慧光明.普照萬法。故安置普光明藏師子之座。此十住中.安置其座.十千層級。十行中.化作百萬層級師子之座。為十住位中.初始入位。明須彌之上.猶連地居。明心有所得.從信創會見法之報。以此義故。師子座須有安置。又方便三昧.是安置故。十行位中.約十住位中理智妙慧功成。即十行位中.以妙用而化其座。又約行.從空而立。還約位在夜摩空居之天。云座十千層級。又百\n\n（程序取窗（L.314））\n\n- **法藏《探玄记》**（`T1733`·依六十）：本品并入〈盧舍那佛品〉——逐品玄谈无·可据者为品 2 通判。\n- **智俨《搜玄记》**（`T1732`·依六十）：同上。\n- **慧苑《刊定记》**（`X0221`·依八十）：有梵题直证（§1.1 已引）·集众七事·颂科总别（§5.2″·参第十四部 §5.2″ 同式）。\n- **李通玄**（`T1739`/`X0223`）：十菩萨「各以自当位随位进修之法还自以偈赞之，令信终菩萨仿之悟入」（§第十四部 §5.3 同判可参）。\n\n**【会读启发】**（L.260·〔本文判断〕）\n\n1. **「林」之命名学**：十菩萨通名「林」（*vana*）＝茂盛义，表十行之将开——与品 14 之「首」（信位之首）对照，**首→林＝信→行之命名递进**。\n2. **觉林偈之义理层级**：工画师喻四句遮表（§〇之二图 〇-2）＋「一切唯心造」正表——本品之义理顶点不在「赞」而在「画师即心」之**唯心转**。\n3. **纯偈赞体之说**：本品无长行说法，纯偈赞体——**赞即说**：十菩萨以偈代论，赞佛功德即显行相。\n4. **功德林独 12 偈之义**：功德林为品 21 十行品之说主——其首组独多 2 偈（12 vs 10），**多出之偈即十行之总引**。\n\n### 〇之二.9 文化资产参证（名胜·造像·图绘·L.452 落位）\n\n> **体例**：图像著录体系（登记册 `yemo_jizan_imagery.yaml`·唯一权威著录源）；授权 Commons 可核验（CC BY 3.0）；**A/B/C 三分**——本批 1 件（C 类：名胜古迹实况）；凡边界不混同。\n\n<figure style=\"margin:14px 0 20px;text-align:center\">\n<img class=\"doc-img\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cb/Bodhi_Tree_Maha_Bodhi_Temple_Bodh_Gaya_India_-_panoramio.jpg/960px-Bodhi_Tree_Maha_Bodhi_Temple_Bodh_Gaya_India_-_panoramio.jpg\" alt=\"菩提树（Bodh Gaya·panoramio 摄）\" loading=\"lazy\">\n<figcaption style=\"font-size:.78em;color:var(--text2);line-height:1.85;max-width:760px;margin:6px auto 0\">\n图 20-C1　菩提树（Bodh Gaya·panoramio 摄）——菩提树——十林菩萨之「林」题域参证 （CC 署名：Hiroki Ogawa）。<br>**边界**：C：名胜古迹实况·菩提树与「林」菩萨同名异指·题域参证不混同。\n</figcaption>\n</figure>\n\n## 六、文本对读与校勘\n\n### 藏译对读窗（藏 ch25·299b.6）\n\n**藏文首段**（Derge 康要录·前段）：\n\n> ་ལས་ཀྱང་དཔའ་བོ་མྱི་ལྡོག་གོ།།གང་རྣམས་བྱང་ཆུབ་བརྟན་པ་རི་རབ་བཞིན་གནས་ཤིང་།།སངས་རྒྱས་རྒྱལ་སྲས་མཁས་པས་ཆོས་དབྱིང // ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){

function _applyArticleENMode(){

}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}

</script>
</body>
</html>
