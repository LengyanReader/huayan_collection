<script>
var ARTICLE = {"id": "huayan-rufajie-can-52", "file": "articles/huayan-rufajie-can-52.html", "title": "入法界品 · 参52·彌勒（★彌勒楼阁）", "title_sub": "★彌勒楼阁 · 菩薩｜毘盧遮那莊嚴藏大樓閣｜（法门即楼阁·周遍觀察） ｜ 25,580 CJK · 六层：数据卡/主页照录/三译四件套/古注取窗疏论/EN/指针", "icon": "🧭", "version": "v1.0", "meta": "", "doc": "", "doc_md": "# 参52·彌勒菩薩（含毘盧遮那莊嚴藏楼阁） —— 入法界品·五十三参子页\n\n> **体例与来源**：底本四十华严 `T10n0293`（般若译·善财历参）；对读八十 `T10n0279`、六十 `T09n0278`（引文各照底本）。本页由程序汇编（L.491）：§一 照录自主页《华严经细读·第三十九部》§参52 全文（参题解·要点·阐释·对照启发·三译深释表·经文全引——人工核订内容·原样保留，含其中〔本文判断〕〔待核〕标注）；§二 自四件套语料库（L.421/L.456）程序汇编；数据卡自行历图数据（L.407/L.413/L.415）。**阐释性文字之性质以原文标注为准；本页不新增判断。**\n\n> ← [参51·德生·有德](huayan-rufajie-can-51.html) ｜ 📘 [子页总目](huayan-rufajie-can-index.html) ｜ 🗺 [行历图](huayan-rufajie-journey.html) ｜ 📄 [主页 §参52](huayan-rufajie-pin.html) ｜ [参53·文殊 →](huayan-rufajie-can-53.html)\n> **古注取窗（L.493→L.499 四源）**：§三 收澄观《华严经疏》（`T1735`）·澄观《随疏演义钞》（`T1736`·末会多总谈·部分参为类聚引）·李通玄《新华严经论》（`T1739`）·法藏《探玄记》（`T1733`·残存）逐参节引（程序取窗·单调锚定·句界截断·页码留痕）。程序抽取本字准待校，引前须对 CBETA 原书核。\n\n## 〇、本参数据卡（程序汇编·L.491）\n\n| 项 | 值 |\n|---|---|\n| 参号 | 第52参（54 卡号系·L.327/L.407 重排）｜第53参（经文层计数）\n| 善知识·四十 | **彌勒**（`T10n0293`）\n| ·八十 | 彌勒（`T10n0279`）\n| ·六十 | 彌勒（`T09n0278`）\n| 三译名判 | 摄归·同\n| 身份 | 菩薩\n| 处所 | 毘盧遮那莊嚴藏大樓閣\n| 法门自陈（「我唯得/知此」） | （法门即楼阁·周遍觀察）\n| 本参经文 | 25,580 CJK（T0293 span 250,656–280,585）\n| 前参 | 参51·德生·有德（法门：幻住解脫）\n| 后参 | 参53·文殊（法门：（遥摩顶·指归普贤））\n| 特殊标记 | ★ 彌勒楼阁\n\n## 一、主页参节全文（照录·零删改）\n\n> 🧭 **本参子页·深度解读 ↗** [参52·数据卡·主页参节照录·三译四件套·延伸指针](huayan-rufajie-can-52.html)\n\n**参题解**：彌勒菩薩（一生補處·灌頂地中佛長子）与**毘盧遮那莊嚴藏大樓閣**——全品空间叙事的极点。法门：**「入此樓閣，周遍觀察，則能了知一切菩薩學」**（法门即建筑本身·無别门名〔如实〕）。\n\n**【要点提炼】**\n\n1. **弹指开门·入已还闭**：「彌勒菩薩前詣毘盧遮那莊嚴藏樓閣，即以右手彈指出聲，其門即開，命善財入。善財心喜，**入已還閉**」——门从弹指开，入后自还闭：**法界之门为求者开，入者已无门内外**。\n2. **一阁即一切阁**：「見樓閣廣博無量，同於虛空……樓閣之中具有無量百千樓閣，一一樓閣種種莊嚴悉如上說……**互相映徹，無有障礙，不相雜亂**；善財童子於一處中，見一切處」——帝网重重在此落成实景；又见一楼阁「總攝諸閣一切莊嚴」，其中悉见三千大千世界百亿四天下——**全经的一多相即，在此给善财亲眼看完**。\n3. **出定弹指·法性如幻**：彌勒入阁摄神力，再弹指出声：「善男子起！**法性如是，此是菩薩知諸法智因緣聚集顯現之相。如是自性悉不成就，如幻、如夢、如影、如像**」——万阁庄严被一句「因缘聚集显现」收回；与參49幻住九叠遥相扣合。\n\n**【阐释】**（〔本文判断〕）参51是全品**义理与叙事的最高峰**：善财历参五十，一切法门至此被装进一座建筑——楼阁即法界（无量阁互摄＝事事无碍的立体模型）；而彌勒两度弹指是全品的心眼：第一弹指**开门**（无缘者不见此门），第二弹指**出定**（神变再大，一声弹指出之于幻）。两次弹指之间，善财看完了一切菩萨的学处；两次弹指之外，门里门外一如。「入已還閉」尤可深味——门闭不是拒绝后来者，是说明：**此门从来不在墙上，在弹指与求道心相触的那一点**。善财出阁，五十三参的「行」已经走完，剩下的是文殊遥指与普贤身的收摄。\n\n**【对照/启发】**：与〈十迴向品〉卡⑤「一毛孔中现无量刹」、參6解脫長者「身中见佛」对读——毛孔→身中→楼阁，一多相即的三级放大至此成殿。启发：读毕此参合眼一问：我求的门，开在何处？——答在「渴仰欲見」四字里：门为渴仰者开，弹指只是回声。\n\n**本参经文全引**（T0293·25,580 CJK·0 手抄）：\n\n> 樓閣前，五體投地，恭敬禮拜，暫時斂念，思惟觀察，發起甚深廣大信解、廣大願力，變化自身遍一切處，入智慧身，住平等門，普現其身在於一切如來前、一切菩薩前、一切善知識前、一切如來塔廟前、一切如來形像前、一切諸佛一切菩薩住處前、一切法寶堂宇前、一切聲聞辟支佛及其塔廟前、一切聖眾福田前、一切父母尊者前、一切十方眾生身前，遍一切處，皆如上說，尊重禮讚；\n>\n> 如是充滿一切緣中，無盡願力加持變化，盡未來際，遍一切處，無有休息；等虛空無邊量故，等法界無障礙故，等實際遍一切故，等如來無分別故；猶如影隨智想現故，猶如夢從思等起故，猶如像表示一切故，猶如響善緣所發故；無有生更遞興謝故，無有相應心遷動故，無有性隨緣轉變故。\n>\n> 又決定知甚深信解：如是如是一切諸報，皆從業起甚深信解；如是如是一切諸果，皆從因起甚深信解；如是如是一切諸業，皆從習起甚深信解；如是如是一切如來出興於世，皆從信起甚深信解；如是如是一切化現諸供養事，皆悉從於決定解起甚深信解；\n>\n> 如是如是一切如來所變化佛，皆從尊重愛敬心起甚深信解；如是如是一切佛法，從善根起甚深信解；如是如是一切化佛，從方便起甚深信解；如是如是一切佛事，從大願起甚深信解；如是如是一切菩薩所修諸行，從迴向起甚深信解；如是如是一切法界廣大莊嚴，從一切智境界而起甚深信解。\n>\n> 離於斷見，知迴向故；離於常見，知無生故；離無因見，知正因故；離顛倒見，知如實理故；離自在見，知不由他故；離自他見，知從緣起故；離諸邪見，知因果力故；離邊執見，知法界無邊故；離往來見，知如影像故；離有無見，知不生滅故；離一切法見，知空無生故，知不自在故，知願力出生故；\n>\n> 離一切相見，入無相際故，知一切法如種生芽不失壞故，如印印文相續起故；知質如像故，知聲如響故，知境如夢故，知業如幻故，了世心現故，了果因起故，了報業集故；了知一切諸功德法皆從菩薩善巧方便之所流故；了知一切法非法性，平等現前，增長成就真法界故。\n>\n> 善財童子入如是智、如是思惟、如是作意，端心潔念，於樓閣前，舉體投地，慇懃頂禮，不思議善根速疾現前，流注身心，清涼悅澤，然後安徐從地而起，一心瞻仰，目不暫捨，合掌圍遶毘盧遮那普莊嚴藏廣大樓閣，經無量匝，思惟作意，發起深心，曲躬恭敬，作是念言：「此大樓閣，是解甚深空無相願，三解脫者之所住處；\n>\n> 此大樓閣，是於諸法，了達法性無分別者之所住處；此大樓閣，是了法界本際平等無差別者之所住處；此大樓閣，是知一切諸眾生界不可得者之所住處；此大樓閣，是知一切諸法無生、住、滅者之所住處；此大樓閣，是不執著一切世間者之所住處；此大樓閣，是不執著一切窟宅者之所住處；\n>\n> 此大樓閣，是不愛樂一切聚落者之所住處；此大樓閣，是不依著一切境界者之所住處；此大樓閣，是能遠離一切相者之所住處；此大樓閣，是能壞散一切妄想者之所住處；此大樓閣，是知諸法無自性者之所住處；此大樓閣，是斷一切分別業者之所住處；\n>\n> 此大樓閣，是離一切想、心意識者之所住處；此大樓閣，是於一切法不來、不去、不入、不出者之所住處；此大樓閣，是入一切甚深般若波羅蜜者之所住處；此大樓閣，是能方便安住一切普門法界者之所住處；此大樓閣，是能寂靜息滅一切煩惱火者之所住處；\n>\n> 此大樓閣，是以勝慧除斷一切見愛慢者之所住處；此大樓閣，是出生一切諸禪解脫等持等至三昧通明而遊戲者之所住處；此大樓閣，是觀察一切諸大菩薩三昧境界者之所住處；此大樓閣，是安住一切諸如來所，親近依止者之所住處；此大樓閣，是以一劫入一切劫，以一切劫入於一劫而不壞其相者之所住處；\n>\n> 此大樓閣，是以一剎入一切剎，以一切剎入於一剎而不壞其相者之所住處；此大樓閣，是以一法入一切法，以一切法入於一法而不相雜亂者之所住處；此大樓閣，是以一眾生入一切眾生，以一切眾生入一眾生而不壞其相者之所住處；此大樓閣，是以一佛入一切佛，以一切佛入於一佛而不壞其相者之所住處；\n>\n> 此大樓閣，是於一念中，而知一切三世者之所住處；此大樓閣，是於一念中，往詣一切國土者之所住處；此大樓閣，是於一切眾生前，悉現其身者之所住處；此大樓閣，是心常利益一切世間者之所住處；此大樓閣，是得自在力，能遍至一切處者之所住處；\n>\n> 此大樓閣，是雖已出一切世間，為欲教化諸眾生故，而恒於中，普現其身不捨離者之所住處；此大樓閣，是不依著一切剎土，欲為供養一切佛故，而遊一切諸佛剎者之所住處；此大樓閣，是不動本處，能普往詣一切佛剎而莊嚴者之所住處；此大樓閣，是能遍親近一切諸佛而不起佛想者之所住處；\n>\n> 此大樓閣，是能遍依止一切善知識而不起善知識想者之所住處；此大樓閣，是住一切魔宮而不耽著欲境界者之所住處；此大樓閣，是知一切心意識法，而永離一切心想見者之所住處；此大樓閣，是雖於一切眾生中而現其身，然於自他不生二相者之所住處；\n>\n> 此大樓閣，是能普入一切世界，而於法界無差別相者之所住處；此大樓閣，是願住未來一切劫，而於諸劫無長短想者之所住處；此大樓閣，是不離一毛端處，而普現身，隨順十方一切世界者之所住處；此大樓閣，是能演說難遭遇法者之所住處；是能安住難知解法者之所住處，是能安住甚深法者之所住處，是能安住無二法者之所住處，是能安住無相法者之所住處，是能安住無對治法者之所住處，是能安住無所得法者之所住處，是能安住無戲論法者之所住處，是能安住大慈大悲者之所住處，是已越度一切二乘所知境者之所住處，是已超過一切魔境界者之所住處，是已能於一切世法無所染者之所住處，是已能到一切菩薩所到岸者之所住處，是已能住一切如來所住處者之所住處；\n>\n> 是雖已離一切諸相，而亦不入聲聞正位者之所住處；是雖已了諸法無生，而亦不住無生法性者之所住處；是雖已觀貪欲不淨，而不證離貪法，亦不與貪欲俱者之所住處；是雖修於慈，而不證離瞋法，亦不與瞋垢俱者之所住處；是雖觀一切十二緣起，而不證離癡法，亦不與癡惑俱者之所住處；\n>\n> 是雖住四禪，而以大悲願力，不隨禪生者之所住處；是雖住四無量，為化眾生故，而不生於色界者之所住處；是雖修四無色定，以大悲故，而不住無色界者之所住處；是雖勤修止觀，為化眾生故，而不證明脫者之所住處；是雖行於捨，而以大悲不捨一切化眾生事者之所住處；\n>\n> 是雖觀於空，然不起空見者之所住處；是雖行無相，而常教化著相眾生者之所住處；是雖行無願，而不捨菩提一切行願者之所住處；是雖於一切業煩惱中而得自在，為欲教化成熟眾生，而現隨順業煩惱者之所住處；是雖無生死，而為化眾生，示受生死者之所住處；\n>\n> 是雖已離一切諸趣，為化眾生，示入諸趣者之所住處；是雖行於慈，而於諸眾生無所愛戀者之所住處；是雖行於悲，而於諸眾生無所取著者之所住處；是雖行於喜，而觀苦眾生心常哀愍者之所住處；是雖行於捨，而不廢捨利益他事者之所住處；是雖行九次第定，而不厭離欲界受生者之所住處；\n>\n> 是雖知一切法無生無滅，而不於實際作證者之所住處；是雖入三解脫門而不取聲聞解脫者之所住處；是雖觀四聖諦而不住小乘聖果者之所住處，是雖觀甚深緣起而不住究竟寂滅者之所住處，是雖修八聖道而不求永出世間者之所住處，是雖超凡夫地而不墮聲聞辟支佛地者之所住處，是雖觀五取蘊而不永滅諸蘊者之所住處，是雖超出四魔而不分別諸魔境界者之所住處，是雖不著六處而不永滅六處者之所住處，是雖安住真如而不墮實際者之所住處，是雖說一切乘而不捨大乘者之所住處；\n>\n> 此大樓閣，是住如是一切無量諸功德者之所住處。」爾時，善財童子合掌瞻仰，恭敬一心，而說偈言：「此是大悲清淨智，利益世間慈氏尊，灌頂地中佛長子，隨順思惟入佛境。一切名聞諸佛子，住大智境解脫門，遊行法界心無著，此無等者之住處。\n>\n> 施戒忍進禪智慧，方便願力及神通，如是大乘諸度法，悉具足者之住處。智慧廣大如虛空，普知三世一切法，無礙無依無所取，了諸有者之住處。善能解了一切法，無性無生無所依，如鳥飛空得自在，此無所畏之住處。了知三毒真實性，分別因緣虛妄起，亦不厭彼而求出，此寂靜人之住處。\n>\n> 三解脫門八聖道，諸蘊處界及緣起，悉能觀察不趣寂，此善巧人之住處。十方國土及眾生，以無礙智咸觀察，了性皆空不分別，此寂滅人之住處。普行法界悉無礙，而求行性不可得，如風行空無所行，此無依者之住處。普見惡道群生類，受諸楚毒無所歸，放大慈光悉除滅，此哀愍者之住處。\n>\n> 見諸眾生失正道，譬如生盲踐畏途，引其令入解脫城，此大導師之住處。見諸眾生入魔網，生老病死常逼迫，令其解脫得慰安，此勇健人之住處。見諸眾生嬰惑病，而興廣大悲愍心，甘露智藥以除滅，此大醫王之住處。見諸眾生沒有海，沈淪憂迫受眾苦，大悲法船以救之，此善度者之住處。\n>\n> 見諸眾生在惑海，能發菩提妙寶心，悉入其中而拔濟，此善漁人之住處。恒以大願慈悲眼，普觀一切諸眾生，從諸有海而拔出，此妙翅王之住處。譬如日月在虛空，一切世間靡不燭，願智光明亦如是，此照世者之住處。菩薩為化一眾生，普盡未來無量劫，如為一人一切爾，此救世者之住處。\n>\n> 於一剎土化眾生，盡未來劫無休息，如於一剎十方然，此堅固意之住處。十方諸佛所說法，一坐普受咸令盡，盡未來劫志無厭，此智海人之住處。遍遊一切世界海，普入一切道場海，供養一切如來海，此修行者之住處。修行一切妙行海，發起無邊大願海，如是經於眾劫海，此功德者之住處。\n>\n> 一毛端處無量剎，佛眾生劫不可說，如是明見靡不周，此無礙眼之住處。一念普攝無邊劫，國土諸佛及眾生，福智無礙波羅蜜，此具德人之住處。十方佛剎碎為塵，一切大海以毛滴，菩薩發願數如是，此無礙者之住處。成就總持三昧門，大願諸禪及解脫，一一皆住無邊劫，此真佛子之住處。\n>\n> 無量無邊諸佛子，種種說法度眾生，亦說世間眾技藝，此修行者之住處。成就神通方便智，修行如幻妙法門，十方五趣悉現生，此無礙者之住處。菩薩始從初發心，具足修行一切行，化身無量遍法界，此神力者之住處。一念成就菩提道，普作無邊智慧業，世情思慮悉發狂，此難量者之住處。\n>\n> 成就神通無障礙，遊行法界靡不周，其心未嘗有所得，此淨慧者之住處。菩薩修行無礙慧，入諸國土無所著，以無二智普照明，此無我者之住處。了性如空平等智，本來寂靜無所依，常行如是境界中，此離垢人之住處。普見群生受眾苦，發大仁慈智慧心，願常利益諸世間，此悲愍者之住處。\n>\n> 佛子住於此，普現眾生前，猶如日月輪，遍除生死暗。佛子住於此，普順眾生心，變現無量身，充滿十方剎。佛子住於此，遍遊諸世界，一切如來所，無量無數劫。佛子住於此，稱量佛境界，無量無數劫，其心無厭倦。佛子住於此，念念入三昧，一一三昧門，闡明諸佛境。\n>\n> 佛子住於此，悉知一切剎，無量無數劫，眾生佛名號。佛子住於此，一念攝諸劫，遠離諸妄想，隨順於眾生。佛子住於此，修習諸三昧，一一心念中，了知三世法。佛子住於此，結跏身不動，普現一切剎，諸趣利眾生。佛子住於此，飲諸佛法海，深入智慧海，具足功德海。\n>\n> 佛子住於此，悉知諸剎數，世數眾生數，佛不思議數。佛子住於此，一念悉能了，一切三世中，國土之成壞。佛子住於此，普知佛行願，菩薩所修行，眾生根性欲。佛子住於此，見一極微中，無量剎道場，眾生及諸劫。如一極微內，一切微悉然，種種咸具足，處處皆無礙。\n>\n> 佛子住於此，普觀一切法，眾生剎及世，無起無所有。觀察眾生等，法等如來等，剎等諸願等，三世悉平等。佛子住於此，教化諸群生，供養諸如來，思惟諸法性。無量千萬劫，所修願智行，廣大不可量，稱揚莫能盡。彼諸大勇猛，所行無障礙，安住於此中，我合掌敬禮。\n>\n> 諸佛之長子，聖德慈氏尊，我今恭敬禮，願垂顧念我。」大方廣佛華嚴經卷\n>\n> 第三十四大方廣佛華嚴經大方廣佛華嚴經卷\n>\n> 第三十五罽賓國三藏般若奉詔譯入不思議解脫境界普賢行願品爾時，善財童子以如是等一切菩薩無量稱揚讚歎之法，讚毘盧遮那莊嚴藏大樓閣中諸菩薩已，於樓閣前，恭敬頂禮，住立一心，曲躬合掌，渴仰欲見彌勒菩薩親近供養；乃見彌勒菩薩從樓閣外別處而來，無量天、龍、夜叉、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽、人、非人等，釋、梵、護世，及本生處內外親戚無量眷屬、婆羅門眾，及餘無數百千眾生，前後圍遶而共來向大樓閣所。\n>\n> 善財見已，歡喜踊躍，即前作禮，五體投地。時，彌勒菩薩觀察善財，指示大眾，歎其真實無量功德，而說偈言：「汝等觀善財，智慧心清淨，為求菩提行，而來親近我。善來圓滿慈，善來清淨悲，善來寂滅眼，修行無懈倦，善來清淨意，善來廣大心，善來不退根，修行無懈倦，善來不動行，常求善知識，了世心無染，調伏諸群生。\n>\n> 善來行妙道，善來住功德，善來趣佛果，與世為依怙，善來德為體，善來法所滋，善來無邊行，世間難可見，善來離迷惑，處世如蓮華，利衰毀譽等，一切無分別。善來施安樂，調柔堪受化，諂誑瞋慢心，一切悉除滅。善來真佛子，普詣於十方，增長諸功德，調柔無懈倦。\n>\n> 善來三世智，遍知一切法，普生功德藏，修行不疲厭。文殊德雲等，一切諸佛子，展轉令汝來，示汝無礙處。具修菩薩行，普攝諸群生，廣大不思議，今來至我所。為求諸如來，清淨之境界，問諸廣大願，而來至我所。去來現在佛，所成諸行業，汝欲皆修學，而來至我所。\n>\n> 汝於善知識，欲求微妙法，欲受菩薩行，而來至我所。汝念善知識，諸佛所稱歎，令汝成菩提，而來至我所。汝念善知識，生我如父母，養我如乳母，增長菩提分。如醫療眾疾，如天灑甘露，如日示正道，如月轉淨輪，如山不動搖，如海無增減，如船師濟度，而來至我所。\n>\n> 汝觀善知識，猶如大猛將，亦如大商主，又如大導師。能建正法幢，能示佛功德，能滅諸惡道，能開善趣門，能顯諸佛身，能守諸佛藏，能持諸佛法，是故願瞻奉。欲滿諸佛智，欲具端正身，欲生尊貴家，而來至我所。汝等觀此人，親近善知識，隨其所修學，一切皆順行。\n>\n> 以昔福因緣，文殊令發心，隨順無違逆，修行不懈倦。父母與親屬，宮殿及財產，一切皆捨離，謙下求知識。淨治如是意，永離世間身，當生佛國土，受諸勝果報。善財見眾生，生老病死苦，為發大悲意，勤修無上道。善財見眾生，五趣恒流轉，為求金剛智，破彼諸苦輪。\n>\n> 善財見眾生，心田甚荒穢，為除三毒刺，專求利智犁。眾生處癡暗，盲冥失正道，善財為導師，示其安隱處。忍鎧解脫乘，智慧為利劍，能於三有內，破諸煩惱賊。善財法船師，普濟諸含識，令過爾焰海，疾至淨寶洲。善財正覺日，智光大願輪，周行法界空，普照群迷宅。\n>\n> 善財正覺月，白法悉圓滿，慈定清涼光，等照眾生心。善財勝智海，依於直心住，菩提行漸深，出生眾法寶。善財大心龍，昇於法界空，興雲霔甘澤，生成一切果。善財然法燈，信炷慈悲油，念器功德光，滅除三毒暗。覺心羯邏藍，悲胞慈為肉，菩提分肢節，長於如來藏。\n>\n> 增長福德藏，清淨智慧藏，開顯方便藏，出生大願藏。如是大莊嚴，救護諸眾生，一切天人中，難聞難可見。如是智慧樹，根深不可動，眾行漸增長，普蔭諸群生。欲生一切德，欲問一切法，欲斷一切疑，專求善知識。欲破諸惑魔，欲除諸見垢，欲解眾生縛，專求善知識。\n>\n> 當滅諸惡道，當示人天路，令修功德行，疾入涅槃城。當脫諸苦處，當與安樂處，斷除諸繫著，永滅三有趣。當度諸見難，當截諸見網，當枯愛欲水，當示三有道，當為世依救，當作世光明，當成三界師，示其解脫處。亦當令世間，普離諸想著，普覺煩惱睡，普出愛欲泥。\n>\n> 當了種種法，當淨種種剎，一切咸究竟，其心大歡喜。汝行極調柔，汝心甚清淨，所欲修功德，一切當圓滿，不久見諸佛，了達一切法。嚴淨眾剎海，成就大菩提，莊嚴福智海，解脫眾生海，圓滿諸行海，汝當成覺海。當到功德岸，當生諸善品，當與佛子等，如是心決定。\n>\n> 當斷一切惑，當淨一切業，當伏一切魔，滿足如是願。當生妙智道，當開正法道，不久當捨離，惑業諸苦道。一切眾生輪，沈迷諸有輪，汝當轉法輪，令其斷苦輪。汝當持佛種，汝當淨法種，汝能集僧種，三世悉周遍，汝當斷愛網，汝當裂見網，汝當救苦網，當成此願網。\n>\n> 當度眾生界，當淨國土界，當集智慧界，當成此心界，當令眾生喜，當令菩薩喜，當令諸佛喜，當成此歡喜，當見一切趣，當見一切剎，當見一切法，當成此佛見，當放破暗光，當放息熱光，當放滅惡光，滌除三有苦，當開天趣門，當開佛道門，當示解脫門，普使眾生入。\n>\n> 當示於正道，當絕於邪道，如是勤修行，成就菩提道。當修功德海，當度三有海，普使群生海，出於眾苦海。當於眾生海，消竭煩惱海，令修諸行海，疾入大智海。汝當增智海，汝當修行海，諸佛大願海，汝當咸滿足。汝當入剎海，汝當觀眾海，汝當以智力，普飲諸法海。\n>\n> 當覲諸佛雲，當起供養雲，當聽妙法雲，當興此願雲。普遊三有室，普壞眾惑室，普入如來室，當行如是道。普入三昧門，普遊解脫門，普住神通門，周行於法界。普現眾生前，普對諸佛前，譬如日月光，當成如是力。所行無動亂，所行無染著，如鳥行虛空，當成此妙用。\n>\n> 譬如因陀網，剎網如是住，汝當悉往詣，如風無所礙。汝當入法界，遍往諸世界，普見三世佛，心生大歡喜。汝於諸法門，已得及當得，應生大喜躍，無貪亦無厭。汝是功德器，能隨諸佛教，能修菩薩行，得見此奇特。如是諸佛子，億劫難值遇，況見其功德，所修諸妙道。\n>\n> 汝生於人中，大獲諸善利，得見文殊等，無量諸功德。已離諸惡道，已出諸難處，已超眾苦患，善哉勿懈怠。已離凡夫地，已住菩薩地，當滿智慧地，速入如來地。菩薩行如海，佛智同虛空，汝願亦復然，應生大欣慶。諸根不懈倦，志願恒決定，親近善知識，不久悉成滿。\n>\n> 菩薩種種行，皆為調眾生，普行諸法門，慎勿生疑惑。汝具難思福，及以真實信，是故於今日，得見諸佛子。汝見諸佛子，悉獲廣大利，一一諸大願，一切咸信受。汝於三有中，修行成妙器，是故諸佛子，示汝解脫門。非是法器人，與佛子同住，設經無量劫，莫知其境界。\n>\n> 汝見諸佛子，得聞如是法，世間甚難有，應生大喜慶。諸佛護念汝，菩薩攝受汝，能順其教行，善哉住壽命。已生菩薩家，已具菩薩德，已長如來種，善哉應喜慶。諸佛等慈父，菩薩等天倫，菩提分親戚，長養真實意。已具菩薩種，增長法王種，已具法王德，大喜充遍身，已成最勝事，奇特不思議，不久汝皆得，當昇灌頂位。\n>\n> 如下如是種，必獲如是果，我今慶慰汝，汝應大欣悅。無量諸菩薩，無量劫行道，未能成此行，今汝皆獲得。信樂堅進力，善財成此行，若有敬慕心，亦當如是學。一切功德行，皆從願欲生，善財已了知，常樂勤修習。如龍布密雲，必當霔大雨，菩薩起願智，決定修諸行。\n>\n> 若有善知識，示汝普賢行，汝當好承事，慎勿生疑惑。汝於無量劫，為欲妄捨身，今為求菩提，此捨方為善。汝於無量劫，具受生死苦，不曾事諸佛，未聞如是行。汝今得人身，值佛善知識，聽受菩提行，云何不歡喜？雖遇佛興世，亦值善知識，其心不清淨，不聞如是法。\n>\n> 若於善知識，信樂心尊重，離疑不疲厭，乃聞如是法。若有聞此法，而興誓願心，當知如是人，已獲廣大利。汝今入此行，最勝難思議，善來於人中，功德必成滿。如是心清淨，常得近諸佛，亦近諸菩薩，決定成菩提。若入此法門，則具諸功德，永離眾惡趣，不受一切苦。\n>\n> 不久捨此身，往生佛國土，常見十方佛，及以諸菩薩。往因今淨解，及事善友力，增長諸功德，如水生蓮華。樂事善知識，勤供一切佛，專心聽聞法，常行勿懈倦。汝是真法器，當具一切法，當修一切道，當滿一切願。汝以信解心，而來禮敬我，不久當普入，一切諸佛會。\n>\n> 善哉真佛子，恭敬一切佛，不久具諸行，到佛功德岸。汝當往大智，文殊師利所，彼當令汝得，普賢深妙行。」爾時，彌勒菩薩摩訶薩在眾會前，稱讚善財無著境界圓滿莊嚴大功德藏。善財聞彼，隨順教誨，顯示最勝方便慰諭，歡喜踊躍，身毛皆竪，涕淚交流，悲泣哽噎，起立合掌，恭敬瞻仰，遶無量匝。\n>\n> 以文殊師利心念力故，眾華、瓔珞、種種妙寶，不覺忽然自盈其手；善財欣慶，不自勝任，即以奉散彌勒菩薩摩訶薩上。時，彌勒菩薩摩善財頂，為說偈言：「善哉善哉真佛子，普策諸根無懈倦，不久當具諸功德，猶如文殊及與我。」時，善財童子聞是讚已，以偈答曰：「我念善知識，億劫難值遇，今得咸親近，而來詣尊所。\n>\n> 我以文殊故，見諸難見者，彼大功德尊，願速還瞻覲。」爾時，善財童子合掌恭敬，重白彌勒菩薩摩訶薩言：「大聖！我已先發阿耨多羅三藐三菩提心，而我未知菩薩云何學菩薩行？云何修菩薩道？我聞大聖善能誘誨，唯願慈哀，為我宣說。「大聖！\n>\n> 一切如來授尊者記，一生當得阿耨多羅三藐三菩提；若一生當得無上菩提，則已超越一切菩薩所住處，則已出過一切菩薩離生位，則已圓滿一切波羅蜜，則已深入一切諸忍門，則已具足一切菩薩地，則已遊戲一切解脫門，則已成就一切三昧法，則已通達一切菩薩行，則已證得一切陀羅尼辯才，則已於一切菩薩自在中而得自在，則已積集一切菩薩助道法，則已遊戲一切菩薩智慧方便，則已出生一切善巧大智神通，則已成就一切菩薩所應學處，則已清淨一切菩薩所行妙行，則已滿足一切菩薩所發大願，則已領受一切佛所記，則已了知一切諸乘門，則已堪任一切如來所護念，則已能攝一切佛菩提，則已能持一切佛法藏，則已能受一切諸佛祕密教，則已能轉一切菩薩祕密輪，則已能為破煩惱魔軍大勇將，則已能作出生死曠野大導師，則已能作治諸惑重病大醫王，則已能於一切眾生中為最勝，則已能於一切世主中得自在，則已能於一切聖人中最\n>\n> 第一，則已能於一切聲聞、獨覺中最增上，則已能於生死海中為船師，則已能布調伏一切眾生網，則已能觀一切眾生根，則已能攝一切眾生界，則已能守護一切菩薩眾，則已能談議一切菩薩事，則已能往詣一切如來所，則已能住止一切如來會，則已能現身一切眾生前，則已能知一切諸法如幻焰，則已能觀一切諸法如影像，則已能於一切世法無染著，則已能了一切諸法無生性，則已能淨一切菩薩身、口、意，則已能以金剛定破一切魔，則已能知一切白淨法本生處，則已能悟一切相不動性，則已能行波羅蜜不退轉，則已能觀一切法無常、苦、空、無我，則已能起一切佛地諸善根，則已能修三十七品瑜伽行，則已於一切菩薩境界到彼岸，則已普知一切煩惱性寂滅，則已能住金剛三昧不可傾動，則已能了住三世心皆不可得，則已能證不動如山菩提心，則已能於一切世法無所著，則已能超越一切魔境界，則已能住一切佛境界，則已能到一切菩薩無礙境，則已能精勤供養一切佛，則已與一切佛法同體性，已繫一切佛法繒，已受一切佛灌頂，已住一切法王位，已入一切智智境，已生一切諸佛法，已踐一切種智位。\n>\n> 「大聖！菩薩云何學菩薩行？云何修菩薩道，隨所修行，疾能證得一切佛法？云何菩薩悉能解了一切佛法，速能度脫所念眾生，咸令究竟到於彼岸，普能成滿所發大願，普能究竟所起諸行，普能安慰一切天人，不負自身，不斷三寶，不虛一切佛菩薩種，能持一切諸佛法眼？\n>\n> 如是等事，願皆為說！」爾時，彌勒菩薩摩訶薩普觀一切道場眾會，指示善財而作是言：「諸仁者！汝等今者見此童子來於我所問菩薩行，普欲成就諸功德不？諸仁者！今此童子，勇猛精進，志願無雜，深心堅固，恒不退轉；具勝希望，心無厭足，如山不動，如救頭然，愛樂親近諸善知識，處處尋求，承事供養，請問法要，受持無失。\n>\n> 諸仁當知：今此童子，曩於福城，受彼菩薩文殊師利教化示導，令其發心，展轉詢求，經由一百一十城善知識已，然後而來至於我所，曾無暫起一念疲懈。「諸仁者！此善男子甚為難有，趣向大乘，住佛境界，乘大誓願，修同類行，發大勇猛，擐大悲甲，以大慈心救護眾生，起大精進修波羅蜜，作大商主護諸眾生，為大法船度諸有海，普集一切福智法寶，修諸廣大助道之法，增長成就一切功德。\n>\n> 如是之人，難可得聞，難可得見，難得親近，難與同行。何以故？此善男子為欲救護一切眾生，超諸惡趣，離眾險難，破無明闇，出生死野，息諸趣輪，度魔境界，捨住著處，不染世法，出欲泥，斷貪鞅，解見縛，壞想宅，絕迷道，摧慢幢，拔惑箭，撤睡蓋，除障山，裂愛網，解癡結，出有流，離諂幻，淨心垢，斷疑惑，到涅槃。\n>\n> 「諸仁者！此大丈夫，為被四流漂汩者，造大法船；為被見泥沒溺者，立大法橋；為墮愚癡黑闇者，然大智燈；為行一切生死曠野者，示以聖道；為嬰一切惑業重病者，與其法藥；為遭一切生死厄難者，飲以甘露；為入一切貪、瞋、癡火者，沃以定水；\n>\n> 多憂惱者，慰諭令安；繫有獄者，曉誨令出；為見縛者，授以智劍；住界城者，示解脫門；在險難者，導安隱處；懼結賊者，與無畏法；墮惡趣者，授以法手；拘害蘊者，示涅槃城；界蛇所纏者，解以聖道；著於六處空聚落者，以智慧光引之令出；住邪道者，令入正濟；\n>\n> 近惡友者，示其善友；樂凡法者，誨以聖法樂；著生死諸有城者，令其趣入一切智城。「諸仁者！此大丈夫如是勤求種種方便，誓當救護一切眾生，發菩提心相續不斷，於清淨行未曾休息，求大乘道曾無懈倦，受持一切大法雲雨，恒勤積集助道之法，圓滿一切不捨善軛，常樂一切清淨法門，修菩薩行，勇猛精進，念念勤求，無有退轉，出生諸行，成滿大願，見善知識情無厭足，事善知識身不疲懈，聞善知識所有教誨，常思順行，未曾違逆。\n>\n> 「諸仁者！此善男子最極難得，若有眾生，能發阿耨多羅三藐三菩提心，則於世間是為希有；況發心已，復能如是為利眾生，勇猛精勤，集諸佛法，當知是人，倍為希有；又能如是勤求愛樂諸菩薩道，又能如是增長清淨諸菩薩行，又能如是親近承事諸善知識，又能如是如救頭然，如山不動，又能如是隨順一切善知識教，又能如是堅固修行一切佛道，又能如是積集一切菩提分法，又能如是不樂一切名利恭敬，又能如是不捨菩薩純一之心，又能如是不樂家宅、不欣富貴、不貪受用、不著欲樂、不戀父母、親戚、知識，不顧世間一切財物，但樂追求菩薩伴侶，又能如是不顧形命，唯願勤修一切智道，應知展轉倍更難得。\n>\n> 「諸仁者！其餘菩薩經於無量百千萬億那由他劫，乃能滿足菩薩願行，乃能親近諸佛菩提；此善男子，於一生內，則能嚴淨一切佛剎，則能教化一切眾生，則以智慧深入法界，則能成就諸波羅蜜，則能增廣一切行網，則能圓滿一切大願，則能超出一切魔業，則能承事一切善友，令生歡喜，則能清淨諸菩薩行，令其具足，則能修習普賢諸行，令其成就。\n>\n> 」爾時，彌勒菩薩摩訶薩如是稱歎善財童子種種功德，令眾會中無量百千眾生，堅固無上菩提之心，告善財言：「善哉！善哉！善男子！汝為利樂一切世間，汝為救護一切眾生，汝為勤求一切佛法故，發阿耨多羅三藐三菩提心。「善男子！汝獲善利，汝善得人身，汝善住壽命，汝善值如來出興於世，汝善見文殊師利大善知識。\n>\n> 汝身即是真善法器，為諸善根之所潤澤。汝為白法之所資持，信樂廣大，慧解清淨，已得諸佛之所護念，已為善友共所攝受。何以故？謂能發大菩提心故。「善男子！菩提心者，猶如種子，能生一切諸佛法故；菩提心者，猶如良田，能長眾生白淨法故；\n>\n> 菩提心者，猶如大地，能持一切諸世間故；菩提心者，猶如大水，能滌一切煩惱垢故；菩提心者，猶如大風，普行世間無所礙故；菩提心者，猶如大火，能燒一切諸見薪故；菩提心者，猶如淨日，普照一切諸世間故；菩提心者，猶如盛月，普能圓滿白淨法故；\n>\n> 菩提心者，猶如明燈，能放種種法光明故；菩提心者，猶如淨目，普見一切夷險處故；菩提心者，猶如大道，普令得入大智城故；菩提心者，猶如正濟，令其得離諸邪法故；菩提心者，猶如大車，普能運載諸菩薩故；菩提心者，猶如門戶，開示一切菩薩行故；\n>\n> 菩提心者，猶如宮殿，安住修習三昧法故；菩提心者，猶如園苑，於中遊戲受法樂故；菩提心者，猶如舍宅，安隱一切諸眾生故；菩提心者，則為所歸，利益一切諸世間故；菩提心者，則為所依，諸菩薩行所依處故；菩提心者，猶如嚴父，訓導一切諸菩薩故；\n>\n> 菩提心者，猶如慈母，生長菩薩諸善根故；菩提心者，猶如乳母，養育守護諸菩薩故；菩提心者，猶如善友，成益一切諸菩薩故；菩提心者，猶如君主，勝出一切二乘人故；菩提心者，猶如帝王，一切願中得自在故；菩提心者，猶如大海，普生一切諸功德故；\n>\n> 菩提心者，如須彌山，於諸眾生心平等故；菩提心者，如鐵圍山，攝持一切諸世間故；菩提心者，如大雪山，長養一切智慧藥故；菩提心者，猶如香山，出生一切功德香故；菩提心者，如大虛空，諸妙功德廣無邊故；菩提心者，如妙蓮華，不染一切世間法故；\n>\n> 菩提心者，如調慧象，其心善順不獷戾故；菩提心者，如良善馬，遠離一切諸惡性故；菩提心者，如調御師，守護一切大乘法故；菩提心者，猶如良藥，能治一切煩惱病故；菩提心者，猶如阬穽，陷沒一切諸惡法故；菩提心者，猶如金剛，悉能穿徹一切法故；\n>\n> 菩提心者，猶如香篋，能貯一切功德香故；菩提心者，猶如妙華，一切世間所樂見故；菩提心者，如白栴檀，除眾欲熱使清涼故；菩提心者，如黑沈香，能熏法界悉周遍故；菩提心者，如善見藥王，能破一切煩惱病故；菩提心者，如毘笈摩藥，能拔一切諸惑箭故；\n>\n> 菩提心者，猶如心識，能與諸根作依止故；菩提心者，猶如帝釋，一切主中最尊勝故；菩提心者，如毘沙門，能斷一切貧窮苦故；菩提心者，如功德天，一切功德所莊嚴故；菩提心者，如莊嚴具，莊嚴一切諸菩薩故；菩提心者，如劫燒火，能燒一切諸有為故；\n>\n> 菩提心者，如無生根藥，長養一切諸佛法故；菩提心者，猶如龍珠，能銷一切煩惱毒故；菩提心者，如水清珠，能清一切煩惱濁故；菩提心者，如如意珠，周給一切諸貧乏故；菩提心者，如賢德瓶，滿足一切眾生願故；菩提心者，如如意樹，能雨一切莊嚴具故；\n>\n> 菩提心者，如鵝羽衣，不受一切生死垢故；菩提心者，如白[疊*毛]線，從本已來性清淨故；菩提心者，如快利犁，能治一切眾生田故；菩提心者，如那羅延，能摧一切我見敵故；菩提心者，猶如快箭，能破一切諸苦的故；菩提心者，猶如利矛，能穿一切煩惱甲故；\n>\n> 菩提心者，猶如堅甲，能護一切如理心故；菩提心者，猶如利刀，能斬一切煩惱首故；菩提心者，猶如利劍，能斷一切憍慢鎧故；菩提心者，猶如利鐮，能翦隨眠微細惑故；菩提心者，如勇將幢，能伏一切諸魔軍故；菩提心者，猶如利鋸，能截一切無明樹故；\n>\n> 菩提心者，猶如利斧，能伐一切諸苦樹故；菩提心者，猶如器仗，能防一切諸厄難故；菩提心者，猶如善手，防護一切智度身故；菩提心者，猶如好足，安立一切功德身故；菩提心者，猶如金錍，能除一切無明翳故；菩提心者，猶如鉗鑷，能拔一切身見刺故；\n>\n> 菩提心者，猶如臥具，息除生死諸勞苦故；菩提心者，如善知識，能解一切生死縛故；菩提心者，如好珍財，能除一切貧窮事故；菩提心者，猶如導師，善知菩薩出要道故；菩提心者，猶如伏藏，出功德財無匱乏故；菩提心者，猶如涌泉，出智慧水無窮盡故；\n>\n> 菩提心者，猶如明鏡，普現一切法門像故；菩提心者，猶如蓮華，不染一切諸罪垢故；菩提心者，猶如大河，流引一切度攝法故；菩提心者，如大龍王，能雨一切妙法雨故；菩提心者，猶如命根，任持菩薩大悲身故；菩提心者，猶如甘露，能令安住不死界故；\n>\n> 菩提心者，猶如大網，普攝一切諸眾生故；菩提心者，猶如羂索，攝取一切所應化故；菩提心者，猶如鉤餌，出有淵中所居者故；菩提心者，如阿伽陀藥，能除惑病永安隱故；菩提心者，如除毒藥，悉能消歇貪愛毒故；菩提心者，如善持明，能滅一切惡尋伺故；\n>\n> 菩提心者，猶如疾風，能散一切諸障霧故；菩提心者，如大寶洲，出生一切覺分寶故；菩提心者，如好種子，出生一切白淨法故；菩提心者，猶如住宅，諸功德法所依處故；菩提心者，猶如市肆，菩薩商主貿易處故；菩提心者，如鍊金藥，能治一切煩惱垢故；\n>\n> 菩提心者，猶如好蜜，圓滿一切功德味故；菩提心者，猶如正道，令諸菩薩入智城故；菩提心者，猶如好器，能持一切白淨法故；菩提心者，猶如時雨，能滅一切煩惱塵故；菩提心者，猶如住處，一切菩薩所依住故；菩提心者，猶如磁石，吸引一切解脫果故；\n>\n> 菩提心者，如淨瑠璃，自性明潔無諸垢故；菩提心者，如帝青寶，出過世間二乘智故；菩提心者，如更漏鼓，覺諸眾生煩惱睡故；菩提心者，如清淨水，性本澄潔無垢濁故；菩提心者，如閻浮金，映奪一切有為善故；菩提心者，如大山王，超出一切諸世間故；\n>\n> 菩提心者，則為所歸，不拒一切諸來者故；菩提心者，則為義利，能除一切衰惱事故；菩提心者，則為妙寶，能令一切心歡喜故；菩提心者，如大施會，充滿一切眾生心故；菩提心者，則為尊勝，諸眾生心無與等故；菩提心者，猶如伏藏，能攝一切諸佛法故；\n>\n> 菩提心者，如善諷誦，普攝菩薩諸行願故；菩提心者，如能守護，隨順長養一切法故；菩提心者，如能利益，能迴一切不善法故；菩提心者，如因陀羅網，能伏煩惱阿脩羅故；菩提心者，如婆樓那風，能動一切所應化故；菩提心者，如因陀羅火，能燒一切諸惑習故；\n>\n> 菩提心者，如佛支提，一切世間應供養故。「善男子！菩提心者，成就如是無量無邊最勝功德；舉要言之，應知悉與一切佛法諸功德等。何以故？因菩提心出生一切菩薩行輪，三世十方一切如來從菩提心而出生故。是故，善男子！若有能發阿耨多羅三藐三菩提心者，則已出生無量功德，普能攝取一切智道。\n>\n> 」大方廣佛華嚴經卷\n>\n> 第三十五大方廣佛華嚴經大方廣佛華嚴經卷\n>\n> 第三十六罽賓國三藏般若奉詔譯入不思議解脫境界普賢行願品爾時，彌勒菩薩復告善財童子言：「善男子！譬如有人，得無畏藥，離五恐怖。何等為五？所謂：火不能燒，毒不能中，刀不能傷，水不能漂，煙不能熏；菩薩摩訶薩亦復如是，得一切智菩提心藥，離五怖畏。\n>\n> 何等為五？不為一切三毒火燒、五欲毒不中、惑刀不傷、有流不漂、諸覺觀煙不能熏害。「善男子！譬如有人，得解脫藥，終無橫難；菩薩摩訶薩亦復如是，得菩提心解脫智藥，永離一切生死橫難。「善男子！譬如有人，持摩訶應伽藥，隨其方所，一切毒蛇聞此藥氣，即皆遠去；\n>\n> 菩薩摩訶薩亦復如是，持菩提心大應伽藥，一切煩惱諸惡毒蛇，聞其氣者，悉皆散滅。「善男子！譬如有人，持無能勝藥，一切怨敵無能勝者；菩薩摩訶薩亦復如是，持菩提心無能勝藥，悉能降伏一切魔軍。「善男子！譬如有人，持毘笈摩藥，能令毒箭自然墮落；\n>\n> 菩薩摩訶薩亦復如是，持菩提心毘笈摩藥，令貪、瞋、癡諸邪見箭自然墮落。「善男子！譬如有人，持善見藥，能除一切所有諸病；菩薩摩訶薩亦復如是，持菩提心善見藥王，悉除一切諸煩惱病。「善男子！如有藥樹，名珊陀那，有取其皮以塗瘡者，瘡即除愈，平復如故，亦無[病-丙+盤]痕，然其樹皮，隨取隨生，終不可盡；\n>\n> 菩薩摩訶薩從菩提心生大智樹亦復如是，若有得見而生信者，煩惱業瘡悉得銷滅，一切智樹初無所損。「善男子！如有藥樹，名成就根，以其力故，令閻浮提一切樹根、枝葉、華果增長成就；菩薩摩訶薩菩提心樹亦復如是，以勝威力，能令一切聲聞、獨覺、學、無學等，及諸菩薩所有善根增長成就。\n>\n> 「善男子！譬如有藥，名阿藍婆，若用塗身，身之與心咸有堪能；菩薩摩訶薩得菩提心阿藍婆藥亦復如是，令其身心有勝堪能，增長善法。「善男子！譬如有人得念力藥，能令其心念力清淨；菩薩摩訶薩亦復如是，得菩提心念力妙藥，心無障礙，念力清淨。\n>\n> 「善男子！譬如有藥，名大蓮華，其有服者，住壽一劫；菩薩摩訶薩服菩提心大蓮華藥亦復如是，於無數劫壽命，自在修集種種波羅蜜行。「善男子！譬如有人，執翳形藥，一切世間人及非人，悉不能見；菩薩摩訶薩持菩提心翳形妙藥亦復如是，於諸境界種種遊行，一切諸魔不能得見。\n>\n> 「善男子！如海有珠，名普集眾寶，此珠若在，一切眾寶常不散失，假使劫火焚燒世間能令此海減於一滴，無有是處，況至乾竭？菩薩摩訶薩菩提心珠亦復如是，住於菩薩一切智智大願海中，若常憶持不令退失，能壞菩薩一善根者，終無是處；若退其心，捨一切智，一切善法，即皆散滅。\n>\n> 「善男子！如有摩尼，名普集光明，有以此珠，瓔珞其身，映蔽一切寶莊嚴具，所有光明悉皆不現；菩薩摩訶薩菩提心寶亦復如是，莊嚴心性，映蔽一切聲聞、獨覺所有心寶，諸莊嚴具悉無光彩。「善男子！如有珠寶，名曰水清，若以此珠置濁水中，以珠威力水即澄清；\n>\n> 菩薩摩訶薩菩提心珠亦復如是，能清一切煩惱垢濁。「善男子！譬如有人得住水寶，繫其身上，入大海中，自在遊行，不為水害；菩薩摩訶薩亦復如是，得菩提心一切智智住水妙寶，入於一切生死海中，遊戲自在，終不沈溺。「善男子！譬如有人得龍寶珠，持入龍宮，遊止大海，以珠威力，一切龍蛇及諸水族，悉不能害；\n>\n> 菩薩摩訶薩亦復如是，得菩提心一切智智大龍寶珠，入於欲界，癡愛水中，惑業龍蛇不能為害。「善男子！譬如帝釋，著摩尼冠，莊嚴其頂，映蔽一切諸餘天眾；菩薩摩訶薩亦復如是，著菩提心一切智智大願寶冠繫其心頂，超過一切三界眾生。「善男子！\n>\n> 譬如有人，得如意珠，除滅一切貧窮之苦；菩薩摩訶薩亦復如是，得菩提心一切智智如意寶珠，出生菩薩善法資具，遠離一切邪命怖畏。「善男子！譬如有人，得日精珠，持向日光而生於火；菩薩摩訶薩亦復如是，得菩提心一切智性日精寶珠，持向智光而生智火。\n>\n> 「善男子！譬如有人，得月愛珠，持向月光而生於水；菩薩摩訶薩亦復如是，得菩提心月精寶珠，持此心珠，鑒迴向光而生一切善根願水。「善男子！譬如龍王，首戴如意摩尼寶冠，遠離一切怨敵怖畏；菩薩摩訶薩亦復如是，著菩提心大悲寶冠，遠離一切惡道諸難。\n>\n> 「善男子！如有寶珠，名一切世間莊嚴藏，若有得者，令其所欲悉得充滿，而此寶珠用無窮盡體不損減；菩薩摩訶薩菩提心寶亦復如是，若有得者，令其所願悉得圓滿，而菩提心用不窮盡體無損減。「善男子！如轉輪王，有摩尼寶，置於宮中，放大光明，破一切闇；\n>\n> 菩薩摩訶薩亦復如是，以菩提心一切智智大摩尼寶，住於欲界，放大智光，悉破諸趣無明黑闇。「善男子！譬如帝青大摩尼寶，若有為此光明所觸，即同其色；菩薩摩訶薩發菩提心一切智寶亦復如是，觀察諸法迴向善根趣一切智，靡不即同一切智智菩提心色。\n>\n> 「善男子！如瑠璃寶，於百千歲處不淨中，不為臭穢之所染著，最極無垢性本淨故；菩薩摩訶薩發菩提心一切智寶亦復如是，於百千劫住欲界中，不為欲界過患所染，最極無垢，如法界性本清淨故。「善男子！譬如有寶，名淨光明，悉能映蔽一切寶色；\n>\n> 菩薩摩訶薩發菩提心一切智寶亦復如是，悉能映蔽一切凡夫，有學、無學二乘功德。「善男子！譬如有寶，名為火焰，悉能除滅一切闇冥；菩薩摩訶薩一切智寶亦復如是，觀行相應，能滅一切無明黑闇。「善男子！譬如海中，有無價寶，商人採得，船載入城；\n>\n> 其諸摩尼百千萬種，光色、價直無與等者；菩薩摩訶薩菩提心寶亦復如是，住於生死大海之中，乘大願船，深心相續，入解脫城，一切聲聞及辟支佛，所有功德無能及者。「善男子！如有寶珠，名自在王，處閻浮洲，去日月輪四萬由旬，日月宮中所有莊嚴，其珠影現悉皆具足；\n>\n> 菩薩摩訶薩發菩提心一切智智清淨功德自在王寶亦復如是，住生死中，照法界空，佛智日月一切功德清淨境界影像莊嚴，悉於中現。「善男子！如有寶珠，名自在王日月光明所照之處，一切財寶、衣服等物，所有價直悉不能及。菩薩摩訶薩發菩提心自在王寶亦復如是，一切智光所照之處，三世所有天人、二乘種種善根漏無漏法一切功德皆不能及。\n>\n> 「善男子！譬如海中有摩尼寶，名曰海藏，普現海中諸莊嚴事；菩薩摩訶薩菩提心寶亦復如是，普能顯現一切智海諸莊嚴事。「善男子！譬如天上閻浮檀金，唯除心王大摩尼寶，餘無及者；菩薩摩訶薩發菩提心閻浮檀金亦復如是，除一切智心王大寶，餘無及者。\n>\n> 「善男子！譬如有人，善調龍法，於諸龍中而得自在；菩薩摩訶薩亦復如是，發菩提心得一切智善調龍法，於諸一切煩惱龍中而得自在。「善男子！譬如勇士，被執鎧仗，一切怨敵無能降伏；菩薩摩訶薩亦復如是，被執菩提大心鎧仗，一切業惑諸惡怨敵無能摧伏無能屈者。\n>\n> 「善男子！譬如天上白栴檀香，若燒一銖，其香普熏小千世界，三千世界滿中珍寶所有價直皆不能及；菩薩摩訶薩菩提心香亦復如是，一念功德普熏法界，聲聞、獨覺一切功德皆所不及。「善男子！如白栴檀，若以塗身，悉能除滅一切熱惱，令其身心普得清涼；\n>\n> 菩薩摩訶薩菩提心香亦復如是，發一切智，普熏身心，能除一切虛妄、分別、貪、瞋、癡等諸惑熱惱，令其具足智慧清涼。「善男子！如須彌山，眾生近者，即同其色；菩薩摩訶薩菩提心山亦復如是，若有近者，悉得同其一切智色。「善男子！譬如波利質多羅樹、拘鞞陀羅樹，其皮香氣，閻浮提中所有諸華若婆師迦、若瞻博迦、若蘇摩那及欝金等，如是諸華所有香氣皆不能及；\n>\n> 菩薩摩訶薩菩提心樹亦復如是，所發大願功德之香，一切二乘無漏戒定、智慧解脫、解脫知見，諸功德香悉不能及。「善男子！譬如波利質多羅樹、拘鞞陀羅樹，雖未開華，應知即是無量諸華出生之處；菩薩摩訶薩菩提心樹亦復如是，雖未開發一切智華，應知即是無數人天有漏無漏眾菩提華所生之處。\n>\n> 「善男子！譬如波利質多羅華，一日熏衣所出香氣，瞻博迦華、婆利師迦華、蘇摩那華，雖千歲熏亦不能及；菩薩摩訶薩菩提心華亦復如是，一生所熏諸功德香，普徹十方一切佛所，一切二乘無漏功德百千劫熏所不能及。「善男子！如海島中生椰子樹，根、莖、枝葉及以華果，一切眾生恒取受用，無時暫歇；\n>\n> 菩薩摩訶薩菩提心樹亦復如是，始從發起悲願之心，乃至成佛，正法住世，常時利益一切世間無有間息。「善男子！如有藥汁，名訶樀迦，人或得之，以其一兩變千兩銅，悉成真金，非千兩銅能變此藥；菩薩摩訶薩亦復如是，以菩提心迴向智藥，普變一切業惑等法，悉使成於一切智相，非業惑等能變其心。\n>\n> 「善男子！如微小火投乾草[卄/積]，隨所焚燒，其焰轉熾；菩薩摩訶薩菩提心火亦復如是，隨其所緣善惡法聚，能令智焰，展轉增盛。「善男子！譬如一燈然百千燈，其本一燈無減無盡；菩薩摩訶薩菩提心燈亦復如是，普然三世諸佛智燈，而其心燈無減無盡。\n>\n> 「善男子！譬如一燈入於闇室，百千年闇悉能破盡，發起光明普照一切；菩薩摩訶薩菩提心燈亦復如是，入眾生心無明闇室，能滅無量百千萬億不可說劫積集一切諸業煩惱，種種障礙，發生一切大智光明。「善男子！譬如燈炷，隨其大小而發光明，若益膏油，明終不絕；\n>\n> 菩薩摩訶薩菩提心燈亦復如是，大願為炷，發智慧光，照明法界，益大悲油，教化眾生，莊嚴國土，施作佛事，現大威德，無有休息。「善男子！譬如他化自在天王，冠閻浮檀真金天冠，欲界天子諸莊嚴具，所有光明，無能映奪，一切威力皆不能及；\n>\n> 菩薩摩訶薩亦復如是，冠菩提心一切智寶大願天冠，凡夫、二乘所有功德皆不能及。「善男子！如師子王，哮吼之時，師子兒聞皆增勇健，餘獸聞之脂血銷耗即皆竄伏；佛師子王菩提哮吼，一切智聲應知亦爾，諸菩薩聞養育法身增長功德，其餘一切邪執眾生，聞皆退散如冰銷釋。\n>\n> 「善男子！譬如有人以師子筋而為樂絃，其音既奏，餘絃悉絕；菩薩摩訶薩亦復如是，以如來師子波羅蜜身菩提心筋為法樂絃，其音既奏，一切五欲及以二乘諸功德絃悉皆斷滅。「善男子！譬如有人以牛羊等種種諸乳，假使積集盈於大海，以師子乳一滴投中，直過無礙，能令眾乳一時變壞；\n>\n> 菩薩摩訶薩亦復如是，以如來師子菩提心乳，著無始際業煩惱中，直過無礙，悉令壞滅，終不住於二乘解脫。「善男子！譬如雪山迦陵頻伽鳥，在卵[穀-禾+卵]中有大勢力，一切諸鳥所不能及；菩薩摩訶薩亦復如是，於生死[穀-禾+卵]發菩提心，所有大悲功德勢力，聲聞、獨覺無能及者。\n>\n> 「善男子！如金翅鳥王子，初始生時，目則明利，飛則勁捷，威勢力能超過一切其餘眾鳥，雖久成長，無能及者；菩薩摩訶薩亦復如是，發菩提心，為諸如來金翅王子，智慧清淨，大悲勇猛，具自在力神通威勢，一切二乘雖百千劫久修道行所不能及。\n>\n> 「善男子！如有壯夫，手執利矛，刺堅密甲，直過無礙；菩薩摩訶薩亦復如是，勇猛精進，執菩提心一切智智銛利快矛，刺諸邪見隨眠密甲，悉能穿徹無有障礙。「善男子！譬如摩訶那伽大力勇士，若奮威怒，於其額上必生瘡疱，瘡若未合，閻浮提中一切人眾無能制伏；\n>\n> 菩薩摩訶薩亦復如是，若起大悲，必定發於菩提之心；一切智瘡心未捨來，一切世間諸魔眷屬、惑業惡人不能為害。「善男子！譬如射師有諸弟子，雖未慣習師之技藝，然其智慧、方便、善巧，餘一切人所不能及；菩薩摩訶薩初始發心亦復如是，雖未慣習一切智行，菩提事業，然其所有願、智、解、欲，一切世間凡夫、二乘悉不能及。\n>\n> 「善男子！如人學射，先安其足，後習其法及諸劍術，一切武藝斯為根本；菩薩摩訶薩亦復如是，欲學如來一切智道，先當安住菩提之心，然後修行一切佛法。「善男子！譬如幻師，將作幻事，先當起意，憶持幻法，然後一切悉得成就；菩薩摩訶薩亦復如是，將起一切諸佛菩薩神通幻事，先當發起大菩提心，然後一切悉得成就。\n>\n> 「善男子！譬如幻術，無色現色，一切變化皆能顯示；菩薩摩訶薩菩提心相、一切智幻亦復如是，雖無有色，不可覩見，然能普於十方法界，示現種種功德莊嚴。「善男子！譬如貓貍，纔見於鼠，鼠即入穴不敢復出；菩薩摩訶薩發菩提心亦復如是，暫以慧眼觀諸惑業，皆即竄滅不復出生。\n>\n> 「善男子！譬如有人，著閻浮金莊嚴之具，映蔽一切眾寶光明，皆如聚墨；菩薩摩訶薩亦復如是，著菩提心一切智智金莊嚴具，映蔽一切凡夫二乘功德莊嚴悉無光色。「善男子！如好磁石，少分之力，即能吸壞一切堅牢諸鐵鉤鎖；菩薩摩訶薩亦復如是，若起一念菩提之心，悉能壞滅一切邪見、貪欲繫縛、無明鉤鎖。\n>\n> 「善男子！如有磁石，隨所在處，鐵若見之，即皆散滅，無留住者；菩薩摩訶薩亦復如是，發菩提心以智觀察一切，世間諸業煩惱、二乘解脫，若暫見之，即皆散滅無有住者。「善男子！譬如漁人，善入大海，一切水族無能為害，假使入於摩竭魚口，亦不為彼之所吞噬；\n>\n> 菩薩摩訶薩亦復如是，發菩提心入生死海，諸業煩惱，一切水族，不能為害，假使入於聲聞、獨覺實際解脫摩竭口中，亦不為其之所留難。「善男子！譬如有人，飲甘露漿，一切諸毒不能為害，菩薩摩訶薩亦復如是，飲菩提心一切智智甘露法漿，不墮聲聞、辟支佛地，以具廣大悲願力故。\n>\n> 「善男子！譬如有人，得安繕那藥，以塗其目，雖能自在遊行人間，一切世人所不能見，菩薩摩訶薩亦復如是，得菩提心安繕那藥，能以願智方便，隨順入魔境界，自在遊行，一切眾魔所不能見。「善男子！譬如有人，依附於王，不畏餘人；菩薩摩訶薩亦復如是，依菩提心住一切智大勢力王，不畏世間一切障、蓋、惡趣之難。\n>\n> 「善男子！譬如有人，住於水中，不畏火焚；菩薩摩訶薩亦復如是，住菩提心善根水中，不畏一切聲聞、獨覺解脫智火。「善男子！譬如有人，依倚猛將，即不怖畏一切怨敵；菩薩摩訶薩亦復如是，依菩提心勇猛智將，不畏一切惡行怨敵。「善男子！\n>\n> 如釋天王，執金剛杵，摧伏一切阿脩羅眾；菩薩摩訶薩亦復如是，持菩提心金剛智杵，摧伏一切諸魔外道阿脩羅眾。「善男子！譬如有人得最勝藥，服之延齡，長得充健，不羸、不瘦、不老、不病；菩薩摩訶薩亦復如是，服菩提心最勝智藥，住無數劫生死之中修菩薩行，心無疲厭亦無染著。\n>\n> 「善男子！譬如有人，調和藥汁，必當先取好清淨水，於一切處平等受用；菩薩摩訶薩亦復如是，欲修菩薩一切行願，先當發起菩提之心，能令一切平等受潤。「善男子！譬如有人，欲護其身，先護命根；菩薩摩訶薩亦復如是，護持一切諸佛正法，應先守護菩提之心。\n>\n> 「善男子！譬如有人，命根若斷，所務皆息，不能利益父母、宗親；菩薩摩訶薩亦復如是，捨菩提心一切智命，所有功德皆不成就，不能利益一切眾生。「善男子！譬如大海一切毒藥所不能壞；菩薩摩訶薩亦復如是，發菩提心一切智海，諸業煩惱、二乘之心、一切眾毒所不能壞。\n>\n> 「善男子！譬如日輪，星宿光明不能映蔽；菩薩摩訶薩亦復如是，菩提心日大智慧輪，一切二乘無漏功德星宿智光所不能蔽。「善男子！譬如王子初始生時，即為一切耆舊大臣之所尊重，以種族真正增上自在故；菩薩摩訶薩亦復如是，於佛法中初發菩提一切智心，生如來家為法王子，即為一切久修梵行聲聞、緣覺所共尊重，以菩提心大悲種姓增上自在故。\n>\n> 「善男子！譬如王子年雖幼稚，一切大臣皆悉敬禮，然此王子於彼大臣心雖敬重，不應禮拜，以種姓殊勝故；菩薩摩訶薩亦復如是，雖初發心修菩薩行，二乘耆舊久修梵行，見此菩薩皆應敬禮，以得法殊勝故。「善男子！譬如王子，雖於一切臣佐之中未得自在，輔相大臣無能與等，以其生處極尊勝故；\n>\n> 菩薩摩訶薩亦復如是，雖於一切業煩惱中未得自在，然其已發大菩提心，諸阿羅漢及辟支佛無能與等，以具如來聖種姓故。「善男子！譬如清淨摩尼寶珠，眼有瞖故見為不淨；菩薩摩訶薩亦復如是，大菩提心本性清淨，一切眾生無智瞖眼，以不信故，謂為不淨。\n>\n> 「善男子！譬如有藥，為呪所持，若有眾生見聞、同住，一切諸病皆得銷滅；菩薩摩訶薩菩提心藥亦復如是，一切善根、智慧、方便皆為願智共所攝持，若有眾生見、聞、同住、隨順、憶念，諸煩惱病悉得除滅。「善男子！譬如有人，常服甘露，其身畢竟不變不壞；\n>\n> 菩薩摩訶薩亦復如是，若常憶持菩提心露，令願智身畢竟不壞。「善男子！譬如有人，被鵝羽衣，一切泥水不能染著；菩薩摩訶薩亦復如是，淨菩提心白鵝羽衣，一切生死、諸業煩惱不能染著。「善男子！譬如桴筏，以繩貫穿連綴竹木不令分散，於河流中遊行自在；\n>\n> 菩薩摩訶薩亦復如是，以菩提心大願智繩攝持諸行，不令分散，法駛流中遊行自在，隨順趣入一切智海。「善男子！譬如木人，若無機關，身即離散，雖具支分，不能運動；菩薩摩訶薩亦復如是，捨菩提心，行即分散，不能成就一切佛法。「善男子！\n>\n> 如轉輪王，有沈香寶，名曰象藏，若燒此香，王四種兵悉騰虛空；菩薩摩訶薩菩提心香亦復如是，若發此心，即令菩薩一切善根永出三界，行如來智普遍無盡虛空法界。「善男子！譬如金剛，唯從金剛及金處生，非餘寶處之所能生；菩薩摩訶薩菩提心金剛亦復如是，唯從大悲救護眾生金剛處生，及能觀察一切智境金處而生，非餘眾生善根處生。\n>\n> 「善男子！譬如有樹，名曰無根，所依住處竟不可得，而其一切枝葉華果悉皆繁茂；菩薩摩訶薩菩提心樹亦復如是，一切智性無有所依，而能生長福德智慧神通大願，枝葉華果饒益世間，普覆一切。「善男子！如金剛寶，非諸劣惡及[斯/瓦]破器所能容持，唯除金銀全具寶器；\n>\n> 菩薩摩訶薩發菩提心金剛智寶亦復如是，非餘下劣薄福眾生慳、嫉、破戒、瞋恨、嬾惰、妄念、無智諸惡器中所能容持，亦非退失殊勝志願、散亂、惡覺眾生器中所能容持，唯除菩薩深心寶器。「善男子！譬如金剛，能鑽眾寶。菩薩摩訶薩菩提心金剛亦復如是，悉能穿徹一切法寶。\n>\n> 「善男子！譬如金剛，能壞一切堅固寶山；菩薩摩訶薩菩提心金剛亦復如是，悉能摧壞諸邪見山。「善男子！譬如金剛，雖破不全，猶勝眾寶金莊嚴具；菩薩摩訶薩亦復如是，發菩提心一切智寶，雖復志劣少有虧損，猶勝一切二乘功德。「善男子！譬如金剛，雖有損缺，猶能除滅一切貧苦；\n>\n> 菩薩摩訶薩亦復如是，發菩提心一切智寶，雖諸戒行多有損缺，終能捨離一切生死。「善男子！譬如金剛，乃至少分，悉能破壞一切諸物；菩薩摩訶薩亦復如是，發菩提心，乃至一念，即破一切無知諸惑。「善男子！譬如金剛，非諸凡下之所能得；菩薩摩訶薩菩提心金剛一切智寶亦復如是，非諸劣意凡夫二乘之所能得。\n>\n> 「善男子！譬如金剛，不識寶人，不知其能，不得受用；菩薩摩訶薩菩提心金剛亦復如是，鈍根、無智、下劣凡夫不了其能，不得其用。「善男子！譬如金剛，無能銷滅；菩薩摩訶薩菩提心金剛亦復如是，一切諸法無能銷滅。「善男子！如金剛杵，諸大力士皆不能持，唯除有大那羅延力；\n>\n> 菩薩摩訶薩菩提心杵亦復如是，一切二乘雖有大力，皆不能持，唯除菩薩廣大因緣堅固善力。「善男子！譬如金剛，一切諸物無能壞者，而能普壞一切諸物，無有障礙，然其體性亦不損減；菩薩摩訶薩菩提之心亦復如是，普於三世無數劫中，教化眾生，修行苦行，一切世間聲聞、獨覺所不能及咸能作之，然一切智大心金剛畢竟堅固，無有損減，不生疲厭，亦無障礙。\n>\n> 「善男子！譬如金剛，非餘地分之所能持，唯除堅厚金剛之際；菩薩摩訶薩菩提之心亦復如是，聲聞、獨覺所有行願皆不能持，唯除趣向薩婆若道，諸大菩薩堅固智力。「善男子！如金剛器，無有瑕隙，用盛於水，永不滲漏而令散失；菩薩摩訶薩大菩提心金剛寶器亦復如是，體性無漏，堅固迴向，盛善根水，永不散失。\n>\n> 「善男子！如金剛輪，能持大地，不令散壞，亦不陷沒；菩薩摩訶薩菩提之心亦復如是，能持菩薩一切行願，不令墜沒入於三界。「善男子！譬如金剛，久處水中，不爛不壞；菩薩摩訶薩菩提之心亦復如是，於一切劫久處生死業、煩惱中，不爛不壞。\n>\n> 「善男子！譬如金剛，一切大火不能燒然，不能令熱；菩薩摩訶薩菩提之心亦復如是，一切生死諸煩惱火，不能燒然，不能令熱。「善男子！譬如此界，一切諸佛將成正覺、降伏四魔、證一切智、坐道場時，唯三千界金剛地際金剛座上之所能持，非是餘座所能成就；\n>\n> 菩薩摩訶薩菩提心座亦復如是，能持菩薩一切行願諸波羅蜜、圓滿諸忍、深入諸地、具足善根、種種迴向、蒙佛授記、修集增長諸菩薩道、親近供養一切如來、承順受持大法雲雨、速疾增長堅固大悲、及能成辨一切願智、乃至究竟阿耨多羅三藐三菩提，唯金剛智之所能持，非餘善根所能成就。\n>\n> 「善男子！如轉輪王，遊四天下七寶之中，輪寶先導；菩薩摩訶薩亦復如是，為法輪王利益一切，菩提心寶最為先導。「善男子！譬如世間滅除怨敵諸器仗中，弓箭最勝；菩薩摩訶薩亦復如是，於諸一切助道具中，菩提之心最為\n>\n> 第一，悉能滅除一切煩惱、生、死、怨故。「善男子！譬如一切水生華中，優鉢羅華而為最勝，陸生華中，瞻博迦華而為最勝。菩薩摩訶薩菩提之心亦復如是，一切智體優鉢羅華，大慈悲心瞻博迦華最為\n>\n> 第一，能滅眾生業煩惱故。「善男子！如諸乘中，船為\n>\n> 第一，以行速疾，令身安樂，能達大海到於彼岸；菩薩摩訶薩亦復如是，於彼一切二乘之中，大菩提心而為\n>\n> 第一，以能速疾運度眾生，令其安樂達彼岸故。「善男子！譬如世間一切水中，雨水\n>\n> 第一；菩薩摩訶薩亦復如是，於諸一切三昧水中，菩提之心而為\n>\n> 第一，能生一切禪定解脫甘露味故。「善男子！譬如鹽中，先陀婆鹽而為\n>\n> 第一，能除諸病及能明眼；菩薩摩訶薩亦復如是，於其八萬四千法中，菩提之心而為最勝，以能除滅一切眾生惑業、重病生智明故。「善男子！譬如乳中，牛乳\n>\n> 第一，能除諸病，令人增壽；菩薩摩訶薩菩提之心亦復如是，於諸正法甘露味中，而為最勝，能除眾生諸煩惱病，及令菩薩慧命增故。「善男子！此菩提心成就如是無量無邊，乃至不可說不可說具足圓滿殊勝功德，若有眾生發阿耨多羅三藐三菩提心，則獲如是具足圓滿勝功德法。\n>\n> 善男子！汝獲善利，具善名稱，汝今能發阿耨多羅三藐三菩提心求菩薩行，已得如是難行難集大功德故。」大方廣佛華嚴經卷\n>\n> 第三十六大方廣佛華嚴經大方廣佛華嚴經卷\n>\n> 第三十七罽賓國三藏般若奉詔譯入不思議解脫境界普賢行願品爾時，彌勒菩薩告善財童子言：「善男子！如汝所問，菩薩云何學菩薩行？修菩薩道？善男子！汝可入此毘盧遮那莊嚴藏大樓閣中，周遍觀察，則能了知一切菩薩學，菩薩行學已，能行圓滿成就無量功德。\n>\n> 」爾時，善財童子恭敬右遶彌勒菩薩摩訶薩已，而白之言：「唯願大聖開樓閣門，令我得入。」時，彌勒菩薩前詣毘盧遮那莊嚴藏樓閣，即以右手，彈指出聲，其門即開，命善財入。善財心喜，入已還閉，見其樓閣廣博無量，同於虛空；阿僧祇寶以為其地，阿僧祇宮殿、阿僧祇門闥、阿僧祇窓牖、阿僧祇階陛、阿僧祇欄楯、阿僧祇道路，皆七寶成；\n>\n> 阿僧祇幡、阿僧祇幢、阿僧祇蓋、周迴間列；阿僧祇眾寶瓔珞、阿僧祇白真珠瓔珞、阿僧祇赤真珠瓔珞、阿僧祇師子珠瓔珞，處處垂下；阿僧祇半月、阿僧祇滿月、阿僧祇繒帶，以為嚴飾；阿僧祇師子幢網、阿僧祇摩尼網、阿僧祇妙金網、阿僧祇金線網，間錯莊嚴，羅覆其上；\n>\n> 阿僧祇寶鐸、阿僧祇寶鈴，風動流音，其聲可愛；散阿僧祇天諸雜華，懸阿僧祇天寶鬘帶，嚴阿僧祇眾寶香爐，雨阿僧祇細妙金屑，懸阿僧祇寶鏡，然阿僧祇寶燈，布阿僧祇寶衣，列阿僧祇寶帳，持阿僧祇寶竿，設阿僧祇寶座，阿僧祇寶繒以敷座上；\n>\n> 阿僧祇寶閻浮檀金童女像、阿僧祇雜寶諸形像、阿僧祇妙寶菩薩像，處處充遍，威德莊嚴；阿僧祇眾鳥出和雅音，令人愛樂，阿僧祇寶優鉢羅華、阿僧祇寶波頭摩華、阿僧祇寶拘物頭華、阿僧祇寶芬陀利華，以為莊嚴；阿僧祇寶樹次第行列；阿僧祇寶芭蕉樹，微妙莊嚴；\n>\n> 阿僧祇寶經行路，金繩界道；阿僧祇寶池香水盈滿；阿僧祇寶橋飛梁雲構；阿僧祇寶地妙砌交映；阿僧祇摩尼寶，放大光明；阿僧祇眾妙音聲，讚大功德，有如是等無量阿僧祇諸莊嚴具，以為莊嚴。善財又見樓閣之中，具有無量百千樓閣，一一樓閣種種莊嚴，悉如上說，廣博嚴麗，皆同虛空，顯現分明，猶如形影，互相映徹，無有障礙，不相雜亂。\n>\n> 善財童子於一處中，見一切處；一切諸處亦如是見。如是一切，盡無有餘，一一物中，見皆如是。爾時，善財童子見毘盧遮那莊嚴藏樓閣之中，如是種種不可思議自在境界，生大愛敬，踊躍無量，身心柔軟，歡喜潤澤；離一切想，除一切障，滅一切惑，所見不忘，所聞能憶，所思不亂，入於無礙解脫法門；\n>\n> 以無礙意，普運其心一切供養；以無礙眼，普見一切微細境界；以無礙身，遍於一切恭敬作禮；以彌勒菩薩威神力故，自見其身，遍在一切諸樓閣中，具見種種不可思議自在境界。所謂：或見彌勒菩薩初發無上菩提心時，如是名字、如是種族、如是善友之所開悟，令其種植如是善根、住如是壽在、如是劫值、如是佛處；\n>\n> 於如是莊嚴剎土，修如是行，發如是願。彼諸如來，如是眾會，如是壽量，經爾許時，親近供養，悉皆明見。或見彌勒最初證得慈心三昧，從是已來，號為慈氏；或見彌勒修習一切難行妙行，成滿一切諸波羅蜜；或見得忍，或見住地，或見莊嚴種種佛剎，或見受持一切佛教，為大法師，得無生忍；\n>\n> 或見在於某時、某處、某如來所，受於無上菩提之記；或時見作轉輪聖王，普令眾生住十善道；或為護世，利樂眾生；或為釋天，訶責五欲；或為夜摩天王，為彼諸天讚不放逸；或為兜率天王，稱歎菩薩補處功德；或為化樂天王，為現菩薩變化莊嚴；\n>\n> 或為他化自在天王，為說諸佛自在之法；或作魔王，說一切法皆悉無常；或為梵王，說諸禪定無量喜樂；或為阿脩羅王，為其眾會說斷一切憍慢醉傲，入大智海，了法如幻；或復見處閻魔羅界，放大光明，救地獄苦；或見在於餓鬼之處，施諸飲食，濟彼飢渴；\n>\n> 或見在於畜生之道種種方便，調伏眾生；或復見為護世天王眾會說法；或復見為忉利天王眾會說法；或復見為夜摩天王眾會說法；或復見為兜率天王眾會說法；或復見為化樂天王眾會說法；或復見為他化自在天王眾會說法；或復見為一切魔王眾會說法；\n>\n> 或復見為大梵天王眾會說法；或復見為諸大龍王眾會說法；或復見為夜叉、羅剎王眾會說法；或復見為乾闥婆、緊那羅王眾會說法；或復見為阿脩羅、陀那婆王眾會說法；或復見為迦樓羅、摩睺羅伽王眾會說法；或復見為其餘一切人、非人等眾會說法；\n>\n> 或復見為一切聲聞眾會說法；或復見為一切獨覺眾會說法；或復見為初發心菩薩而演說法；或復見為修行迴向，乃至得忍住不退轉諸菩薩眾，而演說法；或復見為一生所繫，已受灌頂諸菩薩眾，而演說法；或見讚說菩薩初地，乃至十地所有一切最勝功德；\n>\n> 或見讚說滿足一切諸波羅蜜；或見讚說入諸忍門；或見讚說諸大三昧門；或見讚說甚深解脫門；或見讚說諸禪三昧神通境界；或見讚說諸菩薩行，方便善巧；或見讚說種種出生諸大誓願；或見與諸同行菩薩；讚說世間資生工巧，於一切處談議種種最勝方便，調伏成熟一切眾生；\n>\n> 或見彌勒與諸一生補處菩薩，讚說一切佛灌頂門；或見彌勒修行精進，於百千年身心無倦；或見彌勒經行、讀誦、書寫經卷，未嘗休息；或見彌勒種種方便，為眾說法；或見彌勒，入諸禪定，四無量心；或入遍處，及諸解脫；或入三昧，以方便力，現諸神變；\n>\n> 或見一切諸菩薩眾，皆入種種變化三昧，各於其身一一毛孔，出於一切變化身雲；或見出現天眾身雲；或見出現龍眾身雲；或見出現夜叉、羅剎、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽、釋梵、護世、轉輪聖王身雲；或見出現小王、王子、大臣、官屬、長者、居士身雲；\n>\n> 或見出現聲聞、獨覺、菩薩身雲；或見出現一切如來威德身雲；或見出現一切眾生變化身雲；或見出現一切妙音，讚諸菩薩種種法門。所謂：或見讚說發菩提心功德門；或見讚說施波羅蜜淨戒、安忍、精進、定慧、方便、願力、智波羅蜜功德門；或見讚說諸攝、諸禪、諸無量心，及諸三昧、三摩鉢底、諸通、諸明、總持、辯才、諸諦、諸智、止觀、解脫、諸緣、諸依功德門；\n>\n> 或見讚說念處、正勤、神足、根力、七菩提分、八聖道分、諸聲聞乘、諸獨覺乘、諸菩薩乘、諸地、諸忍、諸行、諸願，如是一切諸功德門；或復於中，見諸如來種種集會，大眾圍遶。又，亦見彼一切如來生處、種姓、身形、壽命、剎劫、名號、道場、眾會、說法利益、教住久近，種種不同，悉皆明見。\n>\n> 爾時，善財童子又復於彼毘盧遮那莊嚴藏內諸樓閣中，見一樓閣，高廣殊麗，總攝諸閣一切莊嚴勝妙，於前最上無比，於中悉見三千大千世界，百億四天下、百億閻浮提、百億兜率陀天，一一皆有彌勒菩薩蓮華藏中降神誕生，釋梵天王，捧持頂戴，遊行七步，觀察十方大師子吼，現為童子，居處宮殿，遊戲園苑，為一切智，踰城出家，現諸苦行，示受乳糜，往詣道場，降伏諸魔，成等正覺。\n>\n> 觀菩提樹梵王，勸請轉正法輪，昇天宮殿，而演說法，劫數壽量，眾會莊嚴，所淨佛剎，所修行願，所現威德，所起方便，教化成熟一切眾生，分布舍利住持遺教，皆悉不同。爾時，善財自見其身在彼一切諸如來所，承事供養；亦見於彼一切眾會大道場中，所有佛事憶持不忘，加持力故，通達無礙，精進勤求，安住智地。\n>\n> 復聞一切諸樓閣內，寶網鈴鐸，及諸樂器，皆悉演暢不可思議微妙法音，說種種法。所謂：或說菩薩發菩提心，或說修行波羅蜜行，或說諸願，或說諸地，或說神通心自在行，或說恭敬供養如來，或說莊嚴諸佛剎土，或說諸佛說法差別，如上所說一切佛法，悉聞其音，敷暢辨了。\n>\n> 又聞某處、某世界中有某菩薩，聞某法門，某善知識之所勸導發菩提心，令修妙行。於某劫、某剎、某如來所、某眾會中，聞某如來如是功德，發如是心，起如是願種，於如是廣大善根，經若干劫，修菩薩行，於爾許時，當得成佛，如是名號，如是壽量，如是國土，一切功德具足莊嚴，滿如是願，能以如是最勝方便，教化調伏如是眾生、如是聲聞、菩薩眾會。\n>\n> 佛涅槃後，正法住世，經爾許劫，利益如是無量眾生。或聞某處、某世界中，有某菩薩廣修布施波羅蜜行，難捨能捨，如是淨戒、忍辱、精進、禪定、智慧，修習如是諸波羅蜜；或聞某處、某世界中，有某菩薩為求法故，棄捨王位，及諸珍寶、妻子、眷屬、頭目、手足、一切身分，皆無所吝；\n>\n> 或聞某處、某世界中，有某菩薩守護如來所說正法，為大法師，廣行法施，高建法幢，吹大法螺，擊大法鼓，雨大法雨，造佛塔廟，作佛形像，種種莊嚴，一一殊麗，施諸眾生一切樂具；或聞某處、某世界中，有某如來於某劫中，成正等覺，如是國土、如是眾會、如是壽量，說如是法、滿如是願、教化如是無量眾生，現前覺悟無上菩提。\n>\n> 善財童子聞如是等不可思議微妙法音，身心歡喜、柔軟悅澤，即得無量諸總持門；即得無量諸辯才門、諸禪、諸忍、諸大行願、諸波羅蜜、諸通、諸明，及諸解脫、諸三昧門。又見一切諸寶鏡中，出生無量種種形像，所謂：或見諸佛眾會道場；或見菩薩眾會道場；\n>\n> 或見聲聞眾會道場；或見獨覺眾會道場；或見清淨世界；或見不淨世界；或見淨不淨世界；或見不淨淨世界；或見有佛世界；或見無佛世界；或見小世界；或見中世界；或見大世界；或見微細世界；或見廣大世界；或見因陀羅網世界；或見覆世界；或見仰世界；\n>\n> 或見側世界；或見平坦世界；或見地獄、畜生、餓鬼所住世界；或見天人充滿世界；於如是等諸世界中，見有無數大菩薩眾，或行、或坐，作諸事業；或見修禪；或習智慧；或起大悲憐愍眾生；或造諸論，利益世間；或教弟子；或自受持；或書、或誦、或問、或答，三時懺悔，迴向發願。\n>\n> 又見一切諸寶柱中，放摩尼王大光明網，或青、或黃、或赤、或白、或玻瓈色、或水精色、或帝青色、或虹霓色、或閻浮檀妙真金色、或作一切諸光明色。又復見彼閻浮檀金諸童女像及眾寶像，或執華雲；或執衣雲；或執幢幡；或執鬘蓋；或持種種塗香、末香；\n>\n> 或持上妙摩尼寶網；或垂金鎖；或挂瓔珞；或舉其臂，捧莊嚴具；或低其首，垂摩尼冠，曲躬瞻仰，目不暫捨，合掌而住。又見於彼真珠瓔珞，常出香水，具八功德，流注無窮。瑠璃瓔珞，百千光明，同時照耀，幢幡網蓋如是等物，一切皆以摩尼王藏，眾寶莊嚴，令人樂見。\n>\n> 又復見彼種種華池，優鉢羅華、波頭摩華、拘物頭華、芬陀利華，各各生於無量諸華，或大一手、或長一肘；或復縱廣量如車輪，一一華中，皆悉示現種種色像，以為嚴飾。所謂：男色像、女色像、童男色像、童女色像、釋梵、護世、天、龍、夜叉、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽、聲聞、獨覺，及諸菩薩，如是一切眾妙色像，皆悉合掌，曲躬禮敬。\n>\n> 亦見如來，結跏趺坐，三十二相莊嚴其身。又復見彼淨瑠璃地，一一步間，現不思議種種色像。所謂：世界色像、菩薩色像、如來色像，及諸樓閣莊嚴色像。又於寶樹枝葉華果一一事中，悉見種種半身色像。所謂：佛半身色像、菩薩半身色像，天、龍、夜叉、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽、釋梵、護世、轉輪聖王、小王、王子、大臣、官長、長者、居士、童男、童女，及以四眾半身色像。\n>\n> 其諸色像，或執華鬘；或執瓔珞；或執一切諸莊嚴具；或有曲躬合掌禮敬，一心瞻仰，目不暫捨；或有讚歎；或入三昧，其身悉以相好莊嚴，普放種種諸色光明。所謂：金色光明、銀色光明、珊瑚色光明、兜沙羅金色光明、帝青色光明、毘盧遮那摩尼王寶色光明、一切眾寶色光明、薝蔔迦華光明，從於自身三十二相，出如是等一切光明。\n>\n> 又見於彼一切樓閣半月像中，出阿僧祇日月星宿種種光明，普照十方。又見一切諸妙樓閣，種種宮殿，眾寶垣牆周迴四壁，種種寶色，一一步內，一切眾寶，以為莊嚴，一一寶中，皆現彌勒曩劫修行菩薩道時，或施頭目、或施手足、脣舌、牙齒、耳鼻、血肉、皮膚、骨髓，乃至爪髮，如是一切，悉皆能捨；\n>\n> 妻妾、男女、奴婢、僕使、妓侍、采女、一切眷屬、城邑、聚落、宮殿、園林；或閻浮提，或四天下，種種富樂、尊貴、自在、大小王位；或諸資具，隨時飲食，上妙床敷憩息之處；或妙寶器；或駟馬車，隨其所須盡皆施與。處牢獄中，種種困厄，令得出離，身被繫縛，臨刑戮者，使其解脫。\n>\n> 諸有疾病所嬰纏者，為其救療，惠以醫藥，令得除差；入邪徑者，示其正道；或為船師，令度大海，使諸眾生，不失津濟；或為馬王，救諸眾生，令離一切羅剎惡難；或為種種大智仙人，善說諸論，利益眾生；或為輪王，勸修十善；或為醫王，善療眾病；\n>\n> 或孝順父母，恭敬供養；或親近善友，隨順聽聞；或作聲聞、或作獨覺、或作菩薩、或作如來，教化調伏一切眾生；或示種種最勝生處、成熟生處所有眾生；或為法師，奉行如來所有言教，種種威儀，受持讀誦，微細觀察，如理思惟，立佛支提，作佛形像，一一珍飾，種種莊嚴，若自供養，若勸於他，塗香、散華、燈油、鬘蓋，種種敷設，恭敬禮拜，如是等事，相續不絕；\n>\n> 或見坐於師子之座，廣演說法，勸諸眾生，安住十善，一心歸向佛、法、僧寶，受持五戒，及八齋戒，出家聽法，受持讀誦，正念作意，如理修行，乃至見於彌勒菩薩坐師子座，講宣法要，開示一切諸佛菩提。又見彌勒，經百千億那由他阿僧祇劫，修行諸度一切色像。\n>\n> 又見彌勒曾所承事諸善知識，悉以一切功德莊嚴，亦見自身在彼一一善知識所，親近供養，受行其教，乃至住於灌頂之地。時，諸知識皆以軟語告善財言：「善來童子！汝今觀此菩薩所有不思議事，莫生疲厭。」爾時，善財童子得不忘失正念力故；得見十方清淨眼故；\n>\n> 得善觀察無礙智故；得諸菩薩自在智故；得諸菩薩已入智地，廣大解故；於諸樓閣一一物中，悉見如是，及餘無量不可思議自在境界諸莊嚴事。譬如有人於睡夢中，見種種物，所謂：一切城邑、聚落、宮殿、園苑、山林、河池、衣服、飲食，乃至一切資生之具；\n>\n> 或見一切可愛歌讚、鼓樂、集會種種遊戲；或見自身父母、兄弟、內外親屬；或見大海、須彌山王，乃至一切諸天宮殿、閻浮提等四天下事；或見其身形量廣大百千由旬，房舍、衣服種種功德，一切莊嚴，悉皆相稱。謂：於晝日，經無量時，不眠不寢，受諸安樂，悉皆具足一切自在，從睡覺已，乃知是夢，遠離一切安樂等想，亦無時節長短之相，而能明記所見之事，一切隨順，曾無忘失。\n>\n> 善財童子亦復如是，以彌勒菩薩威神之力所加持故；知三界法皆如夢故；滅諸眾生狹劣想故；得無障礙廣大解故；住諸菩薩勝境界故；入不思議方便智故；能見如是諸大菩薩一切莊嚴自在境界，隨順解知微細觀察。譬如有人將欲命終，見隨其業所受報相：行惡業者，見於地獄、畜生、餓鬼所有一切眾苦境界；\n>\n> 或見獄卒，手持兵仗，或瞋、或罵，囚執將去；亦聞地獄一切眾生，所有號叫悲歎之聲，或見灰河、或見鑊湯、或見刀山、或見劍樹、或見猛火焰熾洞然、或見揚波，沸水騰注，種種逼迫，受諸苦惱。行善業者，即見一切諸天宮殿、無量天、眾天諸采女種種衣服具足莊嚴，宮殿、園林、華池、河水，及諸寶山寶劫波樹，隨意受用，盡皆妙好，身雖未死，而由業力見如是事。\n>\n> 善財童子亦復如是，以菩薩業不思議力，得見一切莊嚴境界。譬如有人為鬼，所持見種種事、色相、眷屬，隨其所問，悉皆能答。善財童子亦復如是。菩薩智慧之所持故，見彼一切諸莊嚴事，若有問者，靡不能答。譬如有人為龍所持，自謂是龍，入於龍宮，見龍眷屬，於少時間自謂已經日月年載。\n>\n> 善財童子亦復如是，以住菩薩智慧想故；彌勒菩薩自在威力所加持故；於少時間謂經無量百千萬億那由他劫。譬如梵宮，名一切眾生勝莊嚴藏，於中悉見三千大千世界所有諸物差別影像，不相雜亂。善財童子亦復如是，於樓觀中，普見一切莊嚴境界種種差別，互相涉入；\n>\n> 各各差別，不相雜亂。譬如比丘入遍處定，若行、若住、若坐、若臥，隨所入定境界現前。善財童子亦復如是，入於樓觀，一切莊嚴所見境界甚深隨順，悉皆明了。譬如有人於虛空中，見乾闥婆城，具足莊嚴，悉分別知，無有障礙。善財童子亦復如是，見彼一切莊嚴境界甚深隨順，明了無礙。\n>\n> 譬如夜叉宮殿，與人宮殿同在一處，而不相雜，亦無障礙，各隨其業所見不同。譬如大海，於中印現三千世界所有色像。譬如幻師，善明幻法，以幻力故，現諸幻事種種作業，一切能成。善財童子亦復如是，以彌勒菩薩威神力故，及不思議幻智力故，得諸菩薩自在力故，見樓閣中一切莊嚴自在境界。\n>\n> 大方廣佛華嚴經卷\n>\n> 第三十七大方廣佛華嚴經大方廣佛華嚴經卷\n>\n> 第三十八罽賓國三藏般若奉詔譯入不思議解脫境界普賢行願品爾時，彌勒菩薩摩訶薩入樓閣中，攝其神力，彈指出聲，告善財言：「善男子起！法性如是，此是菩薩知諸法智因緣聚集顯現之相。如是自性悉不成就，如幻、如夢、如影、如像。」爾時，善財聞彈指聲，從三昧起，彌勒告言：「善男子！\n>\n> 汝見菩薩自在解脫威神力不？汝見菩薩一切助道等流力不？汝見菩薩願智所現聚集力不？汝見菩薩種種莊嚴妙宮殿不？汝見菩薩種種行力所聚集不？汝見菩薩種種功德莊嚴剎不？汝見菩薩十地之中種種力不？汝見菩薩諸波羅蜜難思果不？汝見菩薩種種難思三昧力不？\n>\n> 汝見如來種種最勝大願力不？汝聞菩薩種種出生解脫門不？汝隨順解菩薩解脫不思議不？汝隨順受菩薩三昧能喜樂不？」善財白言：「唯然已見，是善知識加持力故、憶念力故、威德力故。聖者！此解脫門其名何等？」彌勒告言：「此解脫門，名入三世一切境界不忘念智莊嚴藏；\n>\n> 善男子！一生菩薩得如是等不可說不可說解脫門。」善財白言：「聖者！此莊嚴事何處去耶？」彌勒告言：「於來處去。」曰：「從何處來？」曰：「從諸菩薩智慧威力中來，依諸菩薩智慧威力而住；無有少分去來之處；無集、無增、無成、無立，不依於地，不依於空，遠離一切。\n>\n> 善男子！譬如龍王，種種雲雨不從身出，不從心出，無有積集建立增長；但以龍王心念力故，霈然洪霔，周遍天下；此是龍王難思境界。善男子！彼莊嚴事亦復如是；不住於內，亦不住外；但由菩薩威德自在，汝善根力，而非不見。善男子！譬如幻師作諸幻事，無所從來，亦無所去，無行、無入、無隱、無顯，而以幻力，分明顯現，彼莊嚴事，亦復如是；\n>\n> 無所從來，亦無所去，無集無成，然以慣習不可思議幻智力故，及由過去大願力故，如是顯現。」善財童子白言：「大聖！從何處來？」彌勒告言：「善男子！一切菩薩無來無去，如是而來；無行無住，如是而來；無處、無定、不沒、不生、不住、不遷、不動、不起、無戀、無著、無業、無報、無起、無滅、不斷、不常，如是而來。\n>\n> 「\n>\n> 復次，善男子！菩薩從大悲處來，愍念調伏諸眾生故；從大慈處來，救護逼迫苦眾生故；從淨戒處來，隨其所樂自在生故；從大願處來，往昔願力所加持故；從神通處來，於一切處隨樂現故；從無動搖處來，不捨如來不動體故；從無取捨處來，不役身心使往來故；\n>\n> 從智慧方便處來，隨順一切眾生轉故；從示現變化處來，猶如影像而化現故。「\n>\n> 復次，善男子！汝向所問何處來者，善男子！我從生處摩羅提國房舍聚落，而來於此；彼有長者，名瞿波洛迦，為化其人令入佛法，又為生處一切人眾隨其根器而為說法；亦為父母、親戚、眷屬、婆羅門等，演說大乘，令其趣入故，住於彼而從彼來。\n>\n> 」善財言：「聖者！何者是菩薩生處？」彌勒答言：「善男子！菩薩有十種生處；何等為十？所謂：發菩提心是菩薩生處，生菩薩家故；深心是菩薩生處，生善知識家故；諸地是菩薩生處，生波羅蜜家故；大願是菩薩生處，生妙行家故；大悲是菩薩生處，生四攝家故；\n>\n> 如理觀察是菩薩生處，生般若波羅蜜家故；大乘是菩薩生處，生方便善巧家故；成熟眾生是菩薩生處，生成等正覺家故；智慧方便是菩薩生處，生無生法忍家故；修行諸法是菩薩生處，生三世一切如來家故；善男子！是為菩薩十種受生處。「\n>\n> 復次，善男子！菩薩摩訶薩以般若波羅蜜為母，方便善巧為父，檀那波羅蜜為乳母，尸羅波羅蜜為養母，忍辱波羅蜜為莊嚴具，精進波羅蜜為養育者，禪那波羅蜜為澣濯人，善知識為教授師，一切菩提分為伴侶，一切善法為親屬，一切菩薩為兄弟，菩提心為家，如理修行為家法，諸地善法為家處，得諸忍法為家族，大願現前為家教，以清淨智滿足諸行為順家法，勸發勤修不斷大乘為紹家業，法水灌頂一生所繫菩薩為王太子，成就廣大真實菩提為淨家族。\n>\n> 善男子！菩薩如是超凡夫地，入菩薩位；生如來家，住佛種性；能修諸行，不斷三寶；善能守護菩薩種族，淨菩薩種；生處尊勝，於諸世間離生過惡；一切天人及諸魔、梵、沙門、婆羅門中種族具足，而得成就最勝佛種；得大願藏，普能出生諸菩薩行。\n>\n> 「善男子！菩薩摩訶薩成就如是尊勝家已；智了諸法如影像故，於世生處無所惡賤；知一切法如變化故，於諸有趣無所染著；覺悟諸法無有我故，調伏眾生心無疲厭；以大慈悲為體性故，不趣寂滅攝受眾生；了達生死猶如夢故，經一切劫而無熱惱；了知五蘊皆如幻故，現處生死而無疲倦；\n>\n> 知諸界處即法界故，於諸境界無有瘡疣；知一切想如陽焰故，入於諸趣不生倒惑；達一切法皆如幻故，入魔境界自在無染；成就法身淨妙體故，一切煩惱不能欺誑；成就一切遍趣行故，於諸生處而得自在。「善男子！我身普生一切法界；等一切眾生差別色相，等一切眾生殊異言音，等一切眾生種種名號，等一切眾生種種樂欲，等一切眾生種種威儀隨順世間教化調伏，等能顯示一切眾生清淨受生，等隨順入一切眾生甚深勝解，等一切菩薩大願變化，於如是等無量品類而現其身，種種相貌、種種威德充滿法界。\n>\n> 「善男子！我為成熟與我往昔同修諸行，今時退失菩提心者，示現生此閻浮提中；為欲調伏父母、親屬及婆羅門，令其離於種族憍慢，得生如來種性中故，生摩羅提國房舍聚落婆羅門家。善男子！我於南方及住於此毘盧遮那莊嚴藏大樓閣中，隨諸眾生心之所樂，種種方便，教化調伏。\n>\n> 「善男子！我為隨順諸眾生故，為欲成熟兜率天中同行天故，為欲示現菩薩福智莊嚴變化超過一切諸欲界故，令捨渴愛諸欲樂故，令照諸行皆無常故，令知諸天盛必衰故，為欲示現降生瑞相與一生菩薩而共宣說大智法門故，為欲攝受一切生處諸眾生故，為欲教化釋迦如來所遣來者令如蓮華悉開悟故，而於此沒生兜率天。\n>\n> 「善男子！我願滿足得菩提時，汝及文殊俱來見我。善男子！汝當往\n\n## 二、三译四件套对读（语料库·程序汇编）\n\n（本参为摄归参，四件套语料库（参2-51 历参口径）未覆盖；三译对读见主页 §6.4-6.7 与 §五之B。）\n\n**经文骨架（L.500·T0293 span 程序切分·句界均分六段·非科判）**：\n\n- **段1**（103 句 · 约 2902 CJK）：自顯殊勝德行，八、於他人不起輕慢，九者、護持淨戒圓滿，十者、堪任一切親近……\n- **段2**（103 句 · 约 5673 CJK）：「復次，善男子！……\n- **段3**（103 句 · 约 2286 CJK）：汝念善知識，\n生我如父母，\n養我如乳母，\n增長菩提分。……\n- **段4**（103 句 · 约 5837 CJK）：我聞大聖善能誘誨，唯願慈哀，為我宣說。……\n- **段5**（103 句 · 约 3299 CJK）：如瑠璃寶，於百千歲處不淨中，不為臭穢之所染著，最極無垢性本淨故；菩薩摩訶……\n- **段6**（102 句 · 约 4767 CJK）：譬如王子初始生時，即為一切耆舊大臣之所尊重，以種族真正增上自在故；菩薩摩……\n\n## 三、古注取窗（疏·钞·论·探玄记·程序取窗照录）\n\n**澄观《华严经疏》`T1735`（八十·寄位释）**（锚「彌勒菩薩」·PDF/册页 1365 · 386 字·程序取窗·句界截断·引前须对原书核）：\n\n> 彌勒菩薩下示人。先正示。後為欲下\n顯住因。彌勒梵音具云迷帝隷。此云慈。是其姓也。然有三緣。一由\n本願。過去值大慈如來因立大願。願得斯號故。二由此得慈心三昧\n故。三由母懷時有慈心故。如滿慈子名阿逸多。此云無勝。以生具相\n好勝德無過故。今以姓而呼但云慈氏。慈依智住故曰處中。悲智雙遊\n皆為利物。故云為欲等。三汝詣彼下教問中二。先正教。興十問者。\n\n表無盡故。後何以下釋廣問所由。先徵後釋。徵意云。何以要須廣問\n釋有二意。一所求德廣能具說故。後善男子汝不應下。能求大心。法\n應爾故。前中二。初通顯彌勒德圓位滿。後善男子彼善知識下別顯是\n其真善友故。設若德滿非已有緣亦難求故。二明能求大心法應爾故\n者。即廣誡勸。於中二。先誡勸求法。後誡勸事友。前中二。先標不\n應。誡其去劣。後何以下。釋所應作令其廣修。文中先徵後釋。釋中\n亦二。先別明應修。後善男子舉要下。結略顯廣。前中有九十八門。\n分為十段。一上求菩提行。二應化下下救眾生行。三應斷下自斷惑障\n行。四應令無量眾生下。勸物出離行五。應消滅下淨自根欲行。除三\n不善根。則成三善根等故。\n\n**澄观《随疏演义钞》`T1736`（八十·钞于末会多总谈，部分参为类聚引）**（锚「彌勒菩薩」·PDF/册页 2357 · 380 字·程序取窗·句界截断·引前须对原书核）：\n\n> 彌勒菩薩威神故合於幻師。二及不思議幻智力故。以合大海海印之\n義即智海故。三能以幻智知諸法故即合夜叉與人互不相見。以如幻\n故。四得諸菩薩自在力故。合於乾城依空無礙現自在故。以在幻後皆\n帶幻字。以有兩重之意。故有十喻差別不同。若不為此釋則謂經文繁\n不要也。疏前來得旨等者。前則以定為門。此則以用為門。動寂無二\n真入法界。疏從法智緣生者。疏中以初法智為緣釋。如是自性已下。\n經文明自性如幻是所現相。以後悉不成就。結成自性如幻夢等。初之\n一對是約依他即三論意。緣生故無性無性故從緣。從由不守自性下。\n一對約真實性辨即法性宗。真如不變隨緣之義。上釋悉不成就明性相\n雙寂。今云亦是性自具者。恒沙性德本來具足。非今新成云不成就疏\n莊嚴藏有二義者。前義約理融事。已是事事無礙。後更明心境互融。\n從故此門下仍上主門釋眷屬也。疏若先定有來處下。上約順明。此下\n\n反釋先有先無門會歸中道。從既離下結釋經文。疏此三即法報化下結\n成上義都有四重。然前之三重。三段疏中一一具足。如初云一約體是\n第一義。\n\n**李通玄《新华严经论》`T1739`（八十）**（锚「彌勒菩薩」·PDF/册页 965 · 384 字·程序取窗·句界截断·引前须对原书核）：\n\n> 彌勒菩薩從外而來分。\n第六爾時善財童子合掌恭敬已下。至此卷末。明善財申已發大菩提心\n慈氏為讚菩提心善根功力不思議分。\n第七爾時善財童子恭敬右遶彌勒菩薩摩訶薩已下。至此卷末。明善財\n入慈氏樓閣觀果知因三世所行境界同異總別一多無礙自在同時圓滿\n分。\n第八善男子汝應詣文殊師利已下。有五行半經。明慈氏還令善財見文\n殊師利明至果同因表因中之果本來無二分。\n第九爾時善財童子依彌勒菩薩教已下至頌。此一段明善財以於慈氏所\n得一生之佛果。普印一百一十城之法門。方於初信心中金剛藏智菩提\n場毘盧遮那如來師子座前一切寶蓮花藏座上。起等虛空界廣大十種心\n\n等。以明經歷一百一十城至慈氏一生佛果究竟不離初信心。毘盧遮那\n如來金剛藏智菩提妙理中城。便於金剛藏智菩提妙理之中起法界佛果\n恒常普賢圓周法界妙行。以此已下善財於普賢身中行菩薩行。普賢摩\n善財童子頂。方明法界中恒常佛果恒常普賢行相及相應方始乃得。一\n切諸佛已成舊果普賢舊行。至慈氏菩薩。明此無三世中一生。是見道\n修行。\n\n**法藏《探玄记》`T1733`（六十·残存）**（锚「彌勒」·PDF/册页 1078 · 385 字·程序取窗·二遍扫（类聚引）·句界截断·引前须对原书核）：\n\n> 彌勒亦云。汝今得見諸善知識來我所。皆由文殊師利之\n所攝受\n(勘之)\n是故有形文殊作開覺之初緣。無相妙德結終之妙趣。於中\n有三。初一明始起於先際。二從功德雲下明善修於中際。後文殊明終\n歸於後際。此亦是一周之行相耳。就中際中。初四十人明位內行緣則\n寄四十心位。後十明位後行緣即位外所修等也。\n六分五相者。⻑科此文總為五相。一寄位修行相有四十一人。二從摩\n耶夫人下有九會十一人明會緣入實相。三彌勒一人明攝德成因相。四\n後文殊一人明智照無二相。五普賢一位明顯因廣大相。又此五相亦是\n菩薩五種行相。一高行。二大行。三勝行。四深行。五廣行。\n七圓攝始終者。謂此諸會差別位中一一各攝一切諸門。是故一位即有\n五十五及百一十并剎塵等。如一一切亦爾。重重准之。但為寄法顯異\n布之前後。思之可見問若一即具一切。善財何須廣歷諸位。答此之所\n歷。並是一中之一切故不出一也。問若是一中之一切者得一即得。彼\n何須更歷耶。答得一即是歷多。是故同時無有障礙。思之可見。\n八法界人類有二。先辨類別。後顯義相。前中雖總通論有五十七人。\n\n## 四、评注与延伸指针（只指不代·不生成无据内容）\n\n- **古注诸家**：本参取窗见 §三；更完整释文见主页 §6.2 李通玄《新华严经论》窗、§五之B 计数诸说辨析；澄观《华严经疏》总纲见主页 §2.0′。\n- **今人讲记**：海云继梦《华藏妙海》对读见主页 §6.2（〔OCR 待校〕）；九九华严讲记线见〈海云法师·九九华严讲记校勘工作台〉。\n- **平行线**：藏译 Toh 44 对应章见主页「藏译对读窗」；〈五十三参行历〉交互图可按身份/篇幅回看全程。\n- **本参标记**：★彌勒楼阁（行历图八处特殊标记之一）。\n\n> <span class=\"en-line\">**EN corresponding · Visit 52 — 彌勒 (bodhisattva).** A bodhisattva at 毘盧遮那莊嚴藏大樓閣; self-declared gateway: \"The gateway is the Tower itself — the adamantine treasury of adornments, surveying all\" 〔编者试译〕. Stage III — Maitreya's Tower (the Adamantine treasury of adornments). Three-translation parallels: 40-fascicle `T10n0293` (base), 80 `T10n0279`, 60 `T09n0278` — see §二; classical commentary windows: Chengguan's *Huayan jing shu* `T1735` and Li Tongxuan's *Xin Huayan jing lun* `T1739` — see §三.</span>\n\n## 五、台账\n\n- L.493（2026-11-17）：古注取窗入 §三（疏/论 54/54 全覆盖·探玄记入法界品疏残存仅 13/54·未及者如实留空）；程序取窗·NFKC 归一·单调锚定·字准待校。\n- L.499（2026-11-17）：第四源《随疏演义钞》`T1736` 入 §三（40/54·钞于末会多总谈，部分窗为类聚引·已于源标签注明）。\n- L.507（2026-11-18）：二遍扫恢复——钞 52/54→**54/54**·探玄记 13→**46/54**（pass2 类聚引已标）；仍 miss 8 处为探玄记未及之参（5/15/16/22/26/33/35/49·残存上限）。\n- L.491（2026-11-16）：子页建立——程序汇编（主页 §参52 照录＋行历数据卡＋四件套语料）；内容源批次 L.289–L.304（参批1-16）·L.316（参33 补卡）·L.407/L.413/L.415（行历·三译师名）·L.421/L.456（四件套语料库）。\n- 主页各参节后续修订后重跑 build 即自 // ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);
  }
}
function _applyArticleENMode(){
  var full=document.getElementById('article-full');
  var btn=document.getElementById('article-en-toggle');
  var hide=(sessionStorage.getItem('article_en_hide')||'')==='1';
  if(full) full.classList.toggle('en-hidden', hide);
  if(btn) btn.textContent=hide?'🌐 英文批注：展开':'🌐 英文批注：显示';
}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}
