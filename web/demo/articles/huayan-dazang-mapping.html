175 | …瞻仰，一心戀慕，辭退而去。 | …月足，遶無數匝，戀仰辭去。 |\n| 四十→八十（链） | `0809a17` | `0419c06` | 651 | …瞻仰，一心戀慕，辭退而去。 | …門足，遶無數匝，戀仰而去。 |\n\n另有一处不入表：八十 `0422b13` 的链落点距六十最近标记 3,948 字——六十本这一段没有对应标记，是分段详略不同，不是收束语问题。\n\n**六、收束语族（窄义）**：把「辭退」放宽到同义收束语（辭退／辭去／而退／遶（繞、匝）…而去），三本计 53／51／54。但**数目不等于参数**：\n\n| 本 | 辭退 | 辭去 | 而退 | 匝…而去 | 合计 | 其中非善財 | 非善財处 `lb` |\n|---|---:|---:|---:|---:|---:|---:|---|\n| 八十 | 48 | 3 | 1 | 1 | 53 | 3 | `0330c19`、`0330c26`、`0411a13` |\n| 六十 | 45 | 4 | 1 | 1 | 51 | 3 | `0686c27`、`0745b10`、`0759b01` |\n| 四十 | 52 | 0 | 0 | 2 | 54 | 4 | `0675c09`、`0675c17`、`0697a23`、`0793c08` |\n\n八十的 53 里，文殊、舍利弗二处的会众散退，以及本生故事中太子「辭退還宮」，都不是善財参访——**53 不可用作「五十三参」的证成**。这是本节最该记住的一条：数目对上了，也不能当证据。\n\n**七、同名锚**：参末套语直书师名（禮X足，去尾衔、去虚指），两侧同名且次序单调者配对。正名对可锚一参；通名对（王、夜）只说明次序相合，不作人名认定。\n\n| 对 | 正名对 | 通名对 | 正名 |\n|---|---:|---:|---|\n| 八十↔六十 | 2 | 0 | 賢勝、堅固 |\n| 八十↔四十 | 5 | 3 | 海雲、彌伽、普眼、大天、賢勝（通名：王、王、夜） |\n\n同名锚之外还有序位证据：海雲参（同名锚 `0336b11`↔`0682b18`）之后的下一参，八十本指示句作「善住」、六十本参末套语作「善住比丘」、四十本作「妙住」。是否同实，梵本可旁证：Gaṇḍavyūha（GRETIL 电子文本，Vaidya 1960 底本）海雲（Sāgaramegha）之后一参作 **Supratiṣṭhita** 比丘——「见其于虚空中经行」，情节与八十本〈善住比丘〉章相合；supra- 兼有善／妙二义，**「善住」与「妙住」为同一梵名之两译**〔本文判断，梵本一手旁证〕。\n\n**八、师名谱系（五十参逐参比对）**：以参末套语直书的师名逐参比对，判「全同／义近／基同增衔／异」（`huayan_80_60_pairwise.json`）：\n\n| 对 | 逐参 | 全同 | 义近 | 基同增衔 | 异 |\n|---|---:|---:|---:|---:|---:|\n| 八十↔六十 | 50 | 24 | 2 | 3 | 21 |\n\n八十↔四十 的全同为 15/50，其余分散在义近、增衔、异名各类，不逐类罗列。异名不等于异参——如善住／妙住为同一梵名之两译（上表）；故师名只作谱系刻度，不作「参访增减」的证据。\n\n**判断**：①三本的辭退刻度接近（48／45／52；参末 45／42／48），同一段旅程被切成大体相同数目的参——分段是文本自带的刻度，不是编者后加。②但「字面锚」是弱仪器：八十→六十 48 处仅 2 处可锚，不足以判「六十本措辞独立重译」；链式对齐 44／48 落在 60 字内（中位 10 字），说明两本的分段几乎逐参对应，可指认的漂移多在收束语用词（六十「戀仰辭去」「辭詣彼城」）。③四十本在参界大量沿用八十本文字（字面锚 8 处、链式 46／48），但收束语也各有着笔（八十作「戀仰而去」处，四十作「辭退而去」）——同源分叙，不是逐字互抄。④收束语族 53／51／54 不能反推参数：八十的 53 中 3 处非善財参访（文殊、舍利弗、本生太子）。⑤师名：八十↔六十 50 参中全同 24、义近 2、基同增衔 3、异 21——师名可作谱系刻度，异名不等于异参。\n\n**限度**：链式对齐给的是位置，不是语义——插值落点只说明「这一段大致对应到那一段」，不证明字句相袭；「无链」只说明链未覆盖，不证明该参为对方所无；收束语族是窄义计数（四种收束语），不等于「参」的数目。\n<!--GEN:end:endgame-->\n\n**边界**：\n\n- 无锚与复见都不证明「该参为对方所无」——只说明原样窗不可得或不止一处。四十本 52 个标记里 44 个在八十本无字面锚，这不是「44 个独有参访」。\n- 「王」参两处：八十 `0356a16`／`0358a06` 正向锚到四十 `0719b11`／`0722a13`，反向却都落到 `0358a06`——两王的参界套语太近，逐参归属只在块级可靠（王对在同名锚里已按通名计，不作人名认定）。\n- 参末／会众散按「标记前 200 字内有无善財」机械划分，译文详略会让同一叙述点分到两边；会众散 10 处逐 `lb` 见 JSON。\n- 参名异文（善住／妙住）已得梵本旁证：Supratiṣṭhita 一名两译（见 §17.17 表后）；其余诸参的译名异文仍待逐参人工判读，见 §17.18。\n\n**状态**：T9 仍记 `partial`——末会已量到**位置对应层**（辭退计数、字面锚、链式对齐、收束语族、同名锚与师名谱系），逐参的语义评断（异文、增删、改写）未做。这与 §17.16「库内普查完毕、实例为零」同一性质：方法推进一格，覆盖未完。\n\n### 17.18 影响面：从「华严怎么来」到「华严到哪里去」\n\n前十六节问的是「华严怎么来」——底本、异译、别生、论典。本文的三重目的还有后半：它**长成了什么、影响了谁**。影响面的证据结构与来源面同构：先有见证，再谈关系。四条通道＋一条跨线，骨架如下（细节逐通道充实，本节只立骨架与在库资产清单）：\n\n<!--GEN:start:influence-->\n| 通道 | 载体 | 在库资产 | 级 | 缺口 |\n|---|---|---|---|---|\n| 宗派传承 | 中国五祖→高丽→日本→华严莲社的祖脉谱系 | 《华严宗脉》专篇（shanhe）＋谱系数据在库 | A（本仓专篇） | 会通到本文的五层坐标待做 |\n| 注疏传统 | 智俨→法藏→澄观→净源→德清的释经史（华严塑造中国佛教） | T1732/1733/1735/1736/1739＋X223/234/240 在库；T6/T7 三对已量 | A/B | 后出二线的逐品对读进行中 |\n| 西藏接受 | 行願讚释 Toh 4011–4015、十地释 Toh 3993/3998/3999 | §6.3/§6.6 题录（eTengyur＋dkar chag 双源） | B（题录级） | 全文未入库，未对读 |\n| 图像文物 | 婆罗浮屠善财浮雕、五台山图、造像、缂丝曼荼罗 | 文化资产线并行推进中（本仓另线，已入库多件 A 级见证） | 跨线 | R 面与本文的 L3/L4 接口待立 |\n| 儒道论衡 | 护教／判教中华严对儒道的指认（宗密《原人论》一类） | 样本入库：《大學》章句（KR1h0015）＋《道教義樞》位業義（KR5e0031）＋瑜伽经（GRETIL） | B（样本） | 对读未做 |\n<!--GEN:end:influence-->\n\n**判读**：五条通道中，宗派传承与注疏传统已在库（A/B 级）——华严**塑造中国佛教**的证据链事实上已经在本文手里（§4.5 图9 的 7,705 次引用网络、§17.14–17.15 的体例史）；西藏接受是批 C 新开的一格（题录级）；图像文物由文化资产线并行推进（跨线引用，不重复建设）；儒道论衡仍是 C。影响面的推进顺序与来源面一致：**见证先行，逐格充实**。\n\n**状态**：影响面记 `骨架`——通道清单与在库资产已立，各通道的独立证据表未做。\n\n### 17.19 未竟\n\n- **T9 末会只到刻度层**（§17.17）：辭退计数、唯一字面锚、同名锚已量；善住／妙住一类的名异已得梵本旁证（Supratiṣṭhita 一名两译），其余诸参的逐参名对应表仍待人工判读，其余 36 品未做。\n- **D5 只取一部道经**（《度人經》）：未取《道教義樞》《無上秘要》，故「道教内核」仍不能代表全教。\n- **P1 两半已齐**（§17.13）：道教阶次得一手《道教義樞·位業義》（三阶七号、五心四位、十轉九宫、三清二十七品）；位業義全疏的逐句对读未做。\n- **T6 只做字面长句**：唐疏、唐钞与宋注（疏注合体）三对的复用已量，但「化用」未判；宋注的复用近十倍于唐疏，属注经格式而非袭用证据。\n- **T4 拼合式实例仍为零**：大正藏 32 部筛查、13 部分块检验，无一部通过；卍续藏《合論》已加测，是**经论合编**实例（逐段嵌入，非两段拼合）；「两经各取半部」的真拼合本（如《合部金光明經》）未取。改写幅度大的拼合也会漏检。\n- **T7 只做节略的显式声明**：唐疏、唐钞、宋注三对已量——宋注是嵌经体（链沿经推进的是嵌经正文），不是转述样本；「以己语重述」须语义比对，未做；节略用语只是下界——法藏〈四谛品〉通篇未标略而实略。\n- **S 面三项全空**（译场、王室祭祀、法难护法）：须取译场记录、诏令、护法文本。\n- **R 面四项未做**（图像、文学、音乐、灵验）：须取造像题记、诗文集、曲谱、灵验记。\n- 《卍续藏》华严部三种（合論／疏注／綱要，§17.8）已全部对读：合論＝T4 经论合编实例（§17.16 之六）、疏注＝T6／T7 第三对（§17.14–§17.15）、綱要＝T4 第二合编实例（§17.16 之六）；《丹珠尔》未取——印度论师注疏线仍全空。\n- 巴利、梵文写本、道藏、四库、永乐均只有题录或样本；域可列，关系不可断。\n- 下一步优先级：T7「以己语重述」的语义比对；T9 末会逐参异文的人工判读（师名谱系已出，语义评断未做）；《丹珠尔》题录；最后才攻 S、R 两面的制度与接受文本。\n\n---\n\n## 十八、附录\n\n### 18.1 记号与术语\n\n- **别生经**：从《华严》中单独流通的某品或某部分的汉译。\n- **眷属经**：与华严有关但未必是某品别译的经。\n- **簇**：同一内容在各本中的一组对应。\n- **真平行**：同一教说，在不同文本中有对应段落。\n- **共享清单**：只有清单条目相同（如七觉分名目）。\n- **套语**：定型句。\n- **证据级别**：A（两个以上独立来源，或一手题录与原文可核）、B（单一来源、二手转述，或据已核事实推算）、C（线索，待核）。\n- **〔待核〕**＝C；**〔存疑〕**＝来源互相矛盾。\n\n### 18.2 来源（访问日期 2026-11-09）\n\n| 来源 | 用途 | URL／路径 |\n|---|---|---|\n| CBETA TEI `T10n0279` | 八十华严底本 | `data/references/cbeta/T10n0279.xml`；https://cbetaonline.dila.edu.tw/zh/T10n0279 |\n| CBETA TEI `T09n0278` | 六十华严底本 | `data/references/cbeta/T09n0278.xml` |\n| CBETA GitHub `xml-p5` | T280–T309 一手 XML | https://github.com/cbeta-org/xml-p5 |\n| 84000 `Toh 44-31` | 藏译十地章号、章数 | https://read.84000.co/translation/toh44-31.html |\n| 84000 `Toh 44-45` | 入法界品译本增长史、参访数、存世梵本（访问 2026-11-13） | https://84000.co/translation/toh44-45 |\n| 中文维基《華嚴經》 | 七处九会、60/80 对照、别行本 | https://zh.wikipedia.org/wiki/華嚴經 |\n| 英文维基 *Buddhāvataṃsaka Sūtra* | 四部梵本、译本史 | https://en.wikipedia.org/wiki/Buddhāvataṃsaka_Sūtra |\n| 英文维基 *Ten Stages Sutra* | 十地、T1522、84000 链接 | https://en.wikipedia.org/wiki/Ten_Stages_Sutra |\n| 本地德格目录 | 45 章、115 包、四函 | `data/alignment/tibetan-derge-toc.json` |\n| 本地华严目录 | 32 部题录（16 部有译者） | `data/catalog/complete_catalog.yaml` |\n\n> **来源分级**：CBETA XML 与 84000 为 A；维基为 B（二手，但结构清晰、可点开回源）；本地目录为 A/B（其 296–309 缺译者，本文以 CBETA byline 补足）。\n\n### 18.3 完备度声明\n\n本文覆盖：\n\n- **版本**：4 本＋梵本四部；章数演化；七处九会；藏译对齐；四十华严 18 批 104 窗。\n- **部类**：T278–T309 全 32 部；题名、译者、卷数、品数、CJK、互见。\n- **品级**：39 行 60↔80 对照；12 簇；17 部别生经；12 部眷属经。\n- **十地**：5 译；体量；两簇一离群；2 部论；藏注；十地名五译对照。\n- **梵藏**：4 部梵本；甘珠尔／丹珠尔；藏文独有二章；藏译 45 章可查表。\n- **解释**：阿含／般若（B）；注疏引文（B）；注疏名称提及（本文实测代理）；教判；影响；部类矩阵。\n- **关系* // ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);

function _applyArticleENMode(){
  var full=document.getElementById('article-full');
  var btn=document.getElementById('article-en-toggle');

}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};

      return Object.assign({}, e, {s:byId.get(e.source), t:byId.get(e.target)});
    });
    var adj = new Map(nodes.map(function (n) { return [n.id, []]; }));
    edges.forEach(function (e) { adj.get(e.source).push(e); adj.get(e.target).push(e); });

    host.innerHTML =
      '<style>' + CSS + '</style>'
      + '<div class="dg-bar">'
      + '<div class="dg-g" id="dg-modes"><span style="color:#6b6b6b">视图</span>'
      + '<button data-mode="layered" class="on">分层</button><button data-mode="force">力导向</button><button data-mode="citation">引用</button></div>'
      + '<div class="dg-g" id="dg-layers">'
      + '<label class="dg-chk"><input type="checkbox" value="version" checked>版本</label>'
      + '<label class="dg-chk"><input type="checkbox" value="pin" checked>品</label>'
      + '<label class="dg-chk"><input type="checkbox" value="tib" checked>藏章</label>'
      + '<label class="dg-chk"><input type="checkbox" value="text" checked>异译</label>'
      + '<label class="dg-chk"><input type="checkbox" value="cluster" checked>簇</label>'
      + '<label class="dg-chk"><input type="checkbox" value="citation">注疏</label></div>'
      + '<div class="dg-g" id="dg-etypes">'
      + '<label class="dg-chk"><input type="checkbox" value="structural" checked>结构</label>'
      + '<label class="dg-chk"><input type="checkbox" value="parallel" checked>平行</label>'
      + '<label class="dg-chk"><input type="checkbox" value="translation" checked>异译</label>'
      + '<label class="dg-chk"><input type="checkbox" value="related" checked>关联</label>'
      + '<label class="dg-chk"><input type="checkbox" value="citation">引用</label></div>'
      + '<div class="dg-g"><input type="search" id="dg-q" placeholder="搜索品／T号／藏章…">'
      + '<button id="dg-labels" class="on">标签</button><button id="dg-fit">适配</button><button id="dg-reset">重置</button><button id="dg-full">展开</button></div>'
      + '</div>'
      + '<div class="dg-body"><div class="dg-stage"><canvas></canvas><div class="dg-tip"></div><div class="dg-legend"></div><div class="dg-stats"></div></div>'
      + '<aside class="dg-side"><h4>节点详情</h4><div class="dg-meta" id="dg-detail">点击节点查看：类型、编号、相邻边与证据级别。</div><div id="dg-neighbors"></div></aside></div>';

    var cv = host.querySelector('canvas'), ctx = cv.getContext('2d');
    var stage = host.querySelector('.dg-stage'), tip = host.querySelector('.dg-tip');
    var detail = host.querySelector('#dg-detail'), neighbors = host.querySelector('#dg-neighbors');
    var statsEl = host.querySelector('.dg-stats'), qEl = host.querySelector('#dg-q');
    var view = {k:1, x:0, y:0}, W = 900, H = 560, dpr = Math.min(window.devicePixelRatio || 1, 2);
    var mode = 'layered', showLabels = true, simAlpha = 1;
    var layers = new Set(['version','pin','tib','text','cluster']);
    var egroups = new Set(['structural','parallel','translation','related']);
    var hover = null, selected = null, dragNode = null, dragStart = null, dragMoved = false;

    function visibleNode(n) {
      if (mode === 'citation') return ['commentary','work','canon_class','commentary_hub'].indexOf(n.type) >= 0;
      if (['commentary','work','canon_class','commentary_hub'].indexOf(n.type) >= 0) return layers.has('citation');
      return layers.has(n.type);
    }
    function visibleEdge(e) { return visibleNode(e.s) && visibleNode(e.t) && egroups.has(EDGE_GROUP[e.type]); }

    function initPositions() {
      if (mode === 'layered') {
        var pins = nodes.filter(function (n) { return n.type === 'pin'; }).sort(function (a,b) { return +a.id.split(':')[1] - +b.id.split(':')[1]; });
        var tibs = nodes.filter(function (n) { return n.type === 'tib'; }).sort(function (a,b) { return +a.id.split(':')[1] - +b.id.split(':')[1]; });
        var texts = nodes.filter(function (n) { return n.type === 'text'; }).sort(function (a,b) { return a.id.localeCompare(b.id); });
        nodes.filter(function (n) { return n.type === 'version'; }).forEach(function (n,i) { n.x = 90; n.y = 110 + i*105; });
        nodes.filter(function (n) { return n.type === 'cluster'; }).forEach(function (n,i) { n.x = 260; n.y = 120 + i*62; });
        pins.forEach(function (n,i) { n.x = 380; n.y = 60 + i*22.5; });
        tibs.forEach(function (n,i) { n.x = 650; n.y = 60 + i*19.5; });
        texts.forEach(function (n,i) { n.x = 900; n.y = 60 + i*30; });
      } else if (mode === 'citation') {
        nodes.filter(function (n) { return n.type === 'commentary'; }).forEach(function (n,i) { n.x = 150; n.y = 180 + i*95; });
        nodes.filter(function (n) { return n.type === 'work'; }).forEach(function (n,i) { n.x = 840; n.y = 120 + i*92; });
        nodes.filter(function (n) { return n.type === 'canon_class'; }).forEach(function (n,i) { n.x = 180 + i*125; n.y = 740; });
        var hub = nodes.find(function (n) { return n.type === 'commentary_hub'; });
        if (hub) { hub.x = 510; hub.y = 420; }
      } else {
        var vis = nodes.filter(visibleNode);
        vis.forEach(function (n,i) {
          var a = 2*Math.PI*i/Math.max(vis.length,1);
          n.x = 500 + 330*Math.cos(a); n.y = 460 + 310*Math.sin(a); n.vx = 0; n.vy = 0;
        });
      }
    }

    function simulate(steps) {
      var vis = nodes.filter(visibleNode), es = edges.filter(visibleEdge), k = 130;
      for (var s=0; s<steps; s++) {
        simAlpha = Math.max(0.02, simAlpha*0.985);
        for (var i=0; i<vis.length; i++) {
          var a = vis[i];
          for (var j=i+1; j<vis.length; j++) {
            var b = vis[j], dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy+1;
            if (d2 > 90000) continue;
            var f = (1.9*k*k/d2)*simAlpha, d=Math.sqrt(d2);
            a.vx += dx/d*f; a.vy += dy/d*f; b.vx -= dx/d*f; b.vy -= dy/d*f;
          }
        }
        es.forEach(function (e) {
          var dx=e.s.x-e.t.x, dy=e.s.y-e.t.y, d=Math.hypot(dx,dy)+.01, f=d*d/k*0.055*simAlpha;
          e.s.vx -= dx/d*f; e.s.vy -= dy/d*f; e.t.vx += dx/d*f; e.t.vy += dy/d*f;
        });
        if (mode === 'force') {
          var cs = nodes.filter(function (n) { return n.type === 'cluster'; });
          cs.forEach(function (n,i) {
            var a = 2*Math.PI*i/Math.max(cs.length,1), tx = 500+180*Math.cos(a), ty = 460+180*Math.sin(a);
            n.vx += (tx-n.x)*.012; n.vy += (ty-n.y)*.012;
          });
        }
        vis.forEach(function (n) {
          n.vx += (500-n.x)*0.0016; n.vy += (460-n.y)*0.0016;
          n.x += n.vx*0.55; n.y += n.vy*0.55; n.vx *= 0.82; n.vy *= 0.82;
          n.x = Math.min(980, Math.max(20, n.x)); n.y = Math.min(900, Math.max(30, n.y));
        });
      }
      for (var r=0; r<40; r++) {
        var moved = false;
        for (var i2=0; i2<vis.length; i2++) {
          for (var j2=i2+1; j2<vis.length; j2++) {
            var a2=vis[i2], b2=vis[j2], dx2=a2.x-b2.x, dy2=a2.y-b2.y, d3=Math.hypot(dx2,dy2);
            var md = (a2.r+b2.r)+8;
            if (d3 < md) { moved = true; if (d3 < .01) { dx2=1; dy2=0; d3=1; } var p=(md-d3)/2; a2.x+=dx2/d3*p; a2.y+=dy2/d3*p; b2.x-=dx2/d3*p; b2.y-=dy2/d3*p; }
          }
        }
        if (!moved) break;
      }
      draw();
    }

    function draw() {
      W = Math.max(320, stage.clientWidth); H = Math.max(320, stage.clientHeight);
      if (cv.width !== Math.floor(W*dpr) || cv.height !== Math.floor(H*dpr)) { cv.width = Math.floor(W*dpr); cv.height = Math.floor(H*dpr); }
      ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
      ctx.fillStyle = '#fbf8f1'; ctx.fillRect(0,0,W,H);
      ctx.save(); ctx.translate(view.x, view.y); ctx.scale(view.k, view.k);
      var visE = edges.filter(visibleEdge), visN = nodes.filter(visibleNode);
      var focus = hover || selected;
      var nbr = focus ? new Set([focus.id].concat(adj.get(focus.id).map(function (e) { return e.source === focus.id ? e.target : e.source; }))) : null;
      visE.forEach(function (e) {
        if (!e.s || !e.t) return;
        var dim = nbr && !(nbr.has(e.source) && nbr.has(e.target));
        ctx.globalAlpha = dim ? 0.10 : 0.72;
        ctx.strokeStyle = EDGE_COLOR[e.type] || '#999';
        ctx.lineWidth = (e.type === 'cites' ? Math.max(.7, Math.min(4.5, e.weight/170)) : e.type === 'cites_class' ? Math.max(.7, (e.weight||0)*18) : 0.9) / Math.max(view.k, .7);
        ctx.setLineDash(EDGE_DASH[e.type] || []);
        var mx = (e.s.x+e.t.x)/2;
        ctx.beginPath(); ctx.moveTo(e.s.x,e.s.y); ctx.bezierCurveTo(mx,e.s.y,mx,e.t.y,e.t.x,e.t.y); ctx.stroke();
      });
      ctx.setLineDash([]); ctx.globalAlpha = 1;
      visN.forEach(function (n) {
        var isFocus = focus && (n.id === focus.id || (nbr && nbr.has(n.id)));
        var dim = focus && !isFocus;
        ctx.globalAlpha = dim ? 0.22 : 1;
        ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,2*Math.PI); ctx.fillStyle = n.color; ctx.fill();
        if (isFocus) { ctx.strokeStyle = '#b03a2e'; ctx.lineWidth = 2/Math.max(view.k,.6); ctx.stroke(); }
        if (['version','cluster','commentary','work','canon_class'].indexOf(n.type) >= 0) {
          ctx.globalAlpha = dim ? 0.2 : 0.95; ctx.fillStyle = '#2b2b2b';
          ctx.font = (n.type === 'cluster' ? '8.5px' : '9.5px') + " 'Noto Serif SC','Songti SC',serif";
          ctx.textAlign = 'center';
          ctx.fillText(n.label.length > 22 ? n.label.slice(0,22) + '…' : n.label, n.x, n.y - n.r - 4);
        }
        if (showLabels && (view.k > 1.15 || n.type === 'pin' || n.type === 'tib' || n.type === 'text')) {
          ctx.globalAlpha = dim ? 0.18 : 0.8; ctx.fillStyle = n.type === 'text' ? '#2f5d7c' : '#6b6b6b';
          ctx.font = "7px 'Noto Serif SC','Songti SC',serif"; ctx.textAlign = 'left';
          var lab = n.type === 'pin' ? n.id.split(':')[1] : n.type === 'tib' ? n.id.split(':')[1] : n.label.split(' ')[0];
          ctx.fillText(lab, n.x + n.r + 2, n.y + 2);
        }
        ctx.globalAlpha = 1;
      });
      ctx.restore();
      statsEl.textContent = '可见 ' + visN.length + ' 节点 · ' + visE.length + ' 边　缩放 ' + view.k.toFixed(2) + '×';
    }

    function pick(ev) {
      var r = cv.getBoundingClientRect();
      var x = (ev.clientX - r.left - view.x)/view.k, y = (ev.clientY - r.top - view.y)/view.k;
      var best = null, bd = 1e9;
      nodes.forEach(function (n) {
        if (!visibleNode(n)) return;
        var d = Math.hypot(n.x-x, n.y-y);
        if (d < n.r + 10 && d < bd) { best = n; bd = d; }
      });
      return best;
    }

    function showTip(ev, n) {
      if (!n) { tip.style.display = 'none'; return; }
      var r = stage.getBoundingClientRect();
      tip.innerHTML = '<b>' + esc(n.label) + '</b><br>' + (TYPE_NAME[n.type] || n.type) + ' · 度 ' + adj.get(n.id).length + (n.grade ? ' · ' + n.grade : '') + (n.sub ? '<br>' + esc(n.sub) : '');
      tip.style.display = 'block';
      tip.style.left = Math.min(stage.clientWidth - 340, ev.clientX - r.left + 12) + 'px';
      tip.style.top = Math.min(stage.clientHeight - 30, ev.clientY - r.top + 12) + 'px';
    }

    function select(n) {
      selected = n;
      if (!n) { detail.textContent = '点击节点查看：类型、编号、相邻边与证据级别。'; neighbors.innerHTML = ''; return; }
      detail.innerHTML = '<b>' + esc(n.label) + '</b><br>' + (TYPE_NAME[n.type] || n.type) + ' · ' + n.id + (n.sub ? '<br>' + esc(n.sub) : '');
      var es = adj.get(n.id).slice().sort(function (a,b) { return a.type.localeCompare(b.type); });
      neighbors.innerHTML = '<div class="dg-meta" style="margin-top:6px">相邻边（' + es.length + '）</div>';
      es.forEach(function (e) {
        var other = e.source === n.id ? e.t : e.s;
        var btn = document.createElement('button');
        btn.className = 'dg-edge';
        btn.innerHTML = '<span style="color:' + EDGE_COLOR[e.type] + '">■</span> ' + EDGE_NAME[e.type] + ' → ' + esc(other.label) + ' <span style="color:#999">' + (e.grade || '') + '</span>';
        btn.onclick = function () { select(other); centerOn(other); };
        neighbors.appendChild(btn);
      });
    }
    function centerOn(n) { view.k = Math.max(view.k, 1.5); view.x = W/2 - n.x*view.k; view.y = H/2 - n.y*view.k; draw(); }

    function fit() {
      var vis = nodes.filter(visibleNode);
      if (!vis.length) return;
      var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
      vis.forEach(function (n) { x0=Math.min(x0,n.x); y0=Math.min(y0,n.y); x1=Math.max(x1,n.x); y1=Math.max(y1,n.y); });
      var pad = 40;
      var k = Math.min((W-2*pad)/Math.max(x1-x0,1), (H-2*pad)/Math.max(y1-y0,1));
      view.k = Math.max(0.18, Math.min(2.8, k));
      view.x = W/2 - (x0+x1)/2*view.k; view.y = H/2 - (y0+y1)/2*view.k;
      draw();
    }

    function setMode(m) {
      mode = m;
      host.querySelectorAll('#dg-modes button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-mode') === m); });
      if (m === 'citation') {
        layers.add('citation'); egroups.add('citation');
        host.querySelector('#dg-layers input[value="citation"]').checked = true;
        host.querySelector('#dg-etypes input[value="citation"]').checked = true;
      }
      initPositions();
      if (m === 'force') { simAlpha = 1; simulate(220); }
      selected = null; select(null); fit();
    }

    function syncFilters() {
      layers = new Set(Array.from(host.querySelectorAll('#dg-layers input:checked')).map(function (x) { return x.value; }));
      egroups = new Set(Array.from(host.querySelectorAll('#dg-etypes input:checked')).map(function (x) { return x.value; }));
      if (mode === 'citation') { layers = new Set(['commentary','work','canon_class','commentary_hub']); egroups = new Set(['citation']); }
      draw();
    }

    host.querySelectorAll('#dg-modes button').forEach(function (b) { b.onclick = function () { setMode(b.getAttribute('data-mode')); }; });
    host.querySelectorAll('#dg-layers input,#dg-etypes input').forEach(function (x) { x.onchange = syncFilters; });
    host.querySelector('#dg-labels').onclick = function (e) { showLabels = !showLabels; e.currentTarget.classList.toggle('on', showLabels); draw(); };
    host.querySelector('#dg-fit').onclick = fit;
    host.querySelector('#dg-reset').onclick = function () {
      view = {k:1,x:0,y:0}; layers = new Set(['version','pin','tib','text','cluster']); egroups = new Set(['structural','parallel','translation','related']);
      host.querySelectorAll('#dg-layers input').forEach(function (x) { x.checked = layers.has(x.value); });
      host.querySelectorAll('#dg-etypes input').forEach(function (x) { x.checked = egroups.has(x.value); });
      qEl.value = ''; selected = null; select(null); setMode('layered');
    };
    host.querySelector('#dg-full').onclick = function (e) { host.classList.toggle('dg-full'); e.currentTarget.classList.toggle('on', host.classList.contains('dg-full')); setTimeout(function () { draw(); fit(); }, 30); };
    qEl.addEventListener('input', function () {
      var q = qEl.value.trim().toLowerCase();
      if (!q) { selected = null; select(null); draw(); return; }
      var hit = nodes.find(function (n) { return visibleNode(n) && (n.label.toLowerCase().indexOf(q) >= 0 || n.id.toLowerCase().indexOf(q) >= 0); });
      if (hit) { select(hit); centerOn(hit); }
    });

    cv.addEventListener('mousemove', function (ev) {
      if (dragNode) {
        dragMoved = true;
        var r = cv.getBoundingClientRect();
        dragNode.x = (ev.clientX-r.left-view.x)/view.k; dragNode.y = (ev.clientY-r.top-view.y)/view.k; draw(); return;
      }
      if (dragStart && dragStart.moved) {
        var dx = ev.clientX-dragStart.x, dy = ev.clientY-dragStart.y;
        view.x += dx; view.y += dy; dragStart.x = ev.clientX; dragStart.y = ev.clientY; draw(); return;
      }
      var n = pick(ev);
      if (n !== hover) { hover = n; showTip(ev,n); draw(); } else showTip(ev,n);
    });
    cv.addEventListener('mousedown', function (ev) {
      var n = pick(ev);
      if (n && mode === 'force') { dragNode = n; dragMoved = false; cv.classList.add('dragging'); }
      else dragStart = {x:ev.clientX, y:ev.clientY, moved:false};
    });
    window.addEventListener('mousemove', function (ev) { if (dragStart && (Math.abs(ev.clientX-dragStart.x) > 2 || Math.abs(ev.clientY-dragStart.y) > 2)) dragStart.moved = true; });
    cv.addEventListener('mouseup', function (ev) {
      if (dragNode) { var n = dragNode; dragNode = null; cv.classList.remove('dragging'); if (!dragMoved) select(n); return; }
      if (dragStart && !dragStart.moved) select(pick(ev));
      dragStart = null;
    });
    cv.addEventListener('mouseleave', function () { hover = null; showTip(null); draw(); });
    cv.addEventListener('wheel', function (ev) {
      ev.preventDefault();
      var r = cv.getBoundingClientRect(), mx = ev.clientX-r.left, my = ev.clientY-r.top;
      var wx = (mx-view.x)/view.k, wy = (my-view.y)/view.k;
      var k2 = Math.max(0.18, Math.min(4, view.k*(ev.deltaY < 0 ? 1.12 : 0.89)));
      view.x = mx-wx*k2; view.y = my-wy*k2; view.k = k2; draw();
    }, {passive:false});

    host.querySelector('.dg-legend').innerHTML =
      Object.keys(TYPE_NAME).filter(function (k) { return k !== 'commentary_hub'; }).map(function (k) {
        return '<i style="background:' + TYPE_COLOR[k] + '"></i>' + TYPE_NAME[k];
      }).join(' ')
      + '<br><span style="color:#8b5e34">━ contains</span> <span style="color:#2f5d7c">┅ contains_60</span> <span style="color:#bab2a3">━ parallel</span> <span style="color:#b5651d">━ translation</span> <span style="color:#b03a2e">┅ related</span> <span style="color:#4f6f52">━ cites</span>';

    initPositions();
    setMode('layered');
    draw(); fit();

    // Do not redraw synchronously inside ResizeObserver: resizing the canvas
    // re-triggers the observer and Chrome reports
    // "ResizeObserver loop completed with undelivered notifications".
    var roFrame = null, lastSize = '';
    function resizeDraw() {
      if (roFrame) return;
      roFrame = requestAnimationFrame(function () {
        roFrame = null;
        var size = stage.clientWidth + 'x' + stage.clientHeight;
        if (size === lastSize) return;
        lastSize = size;
        draw();
      });
    }
    if (window.ResizeObserver) {
      lastSize = stage.clientWidth + 'x' + stage.clientHeight;
      new ResizeObserver(resizeDraw).observe(stage);
    } else {
      window.addEventListener('resize', resizeDraw);
    }
  }

  function boot() {
    mount();
    var root = document.getElementById('article-root');
    if (root && window.MutationObserver) {
      var pending = null;
      new MutationObserver(function () {
        var host = document.getElementById('dazang-graph-inline');
        if (!host || host.querySelector('canvas')) return;
        host.setAttribute('data-mounted', '0');
        if (pending) clearTimeout(pending);
        pending = setTimeout(mount, 30);
      }).observe(root, {childList:true, subtree:true});
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
