      var cls = p.getAttribute ? (p.getAttribute('class')||'') : '';

  function linkify(){

})();

<script>
var ARTICLE = {"id": "huayan-dazang-mapping", "file": "articles/huayan-dazang-mapping.html", "title": "华严经与大藏经对应研究", "title_sub": "v1.1 · 一经四貌 · 五层坐标 · 32 部题录复算 · 十二簇 · 六十↔八十勘正 · 四十华严 62 窗 · 十地名五译 · 藏45章表 · 十三幅信息图 · 内嵌交互图", "icon": "🗺️", "version": "", "meta": "", "doc": "docs/经学文献/华严经与大藏经对应研究.md", "doc_md": "# 华严经与大藏经对应研究\n\n## 一经四貌 · 五层坐标 · 三十二部 · 十二簇\n\n> **英文对应** · *Mapping the Buddhāvataṃsaka onto the Chinese and Tibetan canons: four versions, five correspondence layers, thirty-two texts, twelve clusters.*\n>\n> **日期**：2026-11-11　**版本**：v1.3（新增 §十七 全球典藏对照框架＋15 行登记册；v1.2：藏 45 章尾题回验、四十华严 16 批 92 窗、品数口径与 T293 校注修正）　**底本**：CBETA `T10n0279`（八十华严）为主坐标，`T09n0278`（六十）、`T10n0293`（四十）、德格 `Toh 44` 为平行坐标。\n>\n> **定位**：本文回答一个具体问题——**《华严经》的哪一部分，对应大藏经里的哪一部分，凭什么说它对应，对应到什么程度**。它不是《华严经》的通论，也不是某一品的细读；它是一张**可回源、可检索、可复核的经群地图**。库内《华严经学·三十九品深度研究》讲一经之结构与义理，本文讲一经之**坐标与边界**，两文互补而不相代。\n>\n> **方法声明**：凡本文数值，除明确标「种子」者外，均由 `scripts/verify_dazang_mapping.py` 从 CBETA XML、84000、中文维基结构表与本地目录重新抽取；数据落于 `data/research/dazang_mapping_verification.json`。凡不能复验者，一律标 `B`／`C` 或〔待核〕，不以「看起来合理」充作证据。\n\n---\n\n## 〇、凡例\n\n### 0.1 「对应」的五层\n\n「对应」不是一个单一关系。把不同层次混为一谈，是华严目录学最常见的失误：以「同本异译」的眼光看「别生经」，会把一品的单行本误认为另一部经；以「引用」的眼光看「义理影响」，会把共享清单误认为文本依赖。本文把「对应」分为五层，逐层给出可检索的坐标与可判定的证据类型。\n\n| 层 | 含义 | 典型对象 | 证据类型 | 本文处理 |\n|---|---|---|---|---|\n| 一　同经异本 | 同一部经的不同译本、藏译、梵本 | T278、T279、T293；Toh 44；Daśabhūmika 等 | 题录、原文、84000 | 逐本核对品／章／卷 |\n| 二　别生经 | 单独流通的某品或某部分的汉译，含眷属经 | T280–T309 | 题录、Taishō 校注 | 逐部核对题名、译者、卷数、互见 |\n| 三　论释与注疏 | 解释《华严》的论与疏 | T1521、T1522；T1731–T1742；X221 | 题录、引文 | 登记，引文统计标 B |\n| 四　义理层 | 判教、阶位、年代、先例与影响、共享清单 | 五教判；T1485；《梵网经》与《大日经》 | 文献、计算、判断 | 明标「本文判断」 |\n| 五　版本与检索层 | 其他藏经版本与数据库 | 九种汉文藏、德格版、CBETA、SAT、84000 | 目录对照 | 给出入口，不冒充已核 |\n\n> **一句话**：第一、二层是「文本的同一」，第三层是「文本的解释」，第四层是「意义的关联」，第五层是「载体与检索」。本文的主干是第一、二层；第三、四层只做有边界的登记与判断；第五层只给入口。\n\n### 0.2 坐标与记号\n\n- `T` = 大正藏，`T10n0279` 即第 10 册第 279 号；`X` = 卍续藏；`Toh` = 德格目录号，`Toh 44-31` 表示 Phal chen 的第 31 章（84000 写法）。\n- `C80`、`C60`、`CT` = 八十华严、六十华严、藏译 Phal chen 的品序或章序。\n- 「品」用于汉译本，「章」用于藏译本；藏文 `bam po` 译作「包」，是藏文长经的卷册单位，不等同于汉文「卷」。\n- 「别生经」：从大本中单独流通的某品或某部分的汉译。「眷属经」：与华严有关但未必是某品别译的经。「簇」：同一内容在各本中的一组对应。\n- 「真平行」：同一教说在不同文本中有对应段落。「共享清单」：只有清单条目相同（如七觉分名目）。「套语」：定型句。三者不得混称。\n\n### 0.3 证据分级与复验标记\n\n| 级 | 判据 | 本文记号 |\n|---|---|---|\n| A | 两个以上独立来源，或一手题录与原文可核 | 正文直书；表注「A」 |\n| B | 单一来源、二手转述，或据已核事实推算 | 标 `B`；关键处加「种子」 |\n| C | 线索，待核 | 〔待核〕 |\n\n此外加一套**复验标记**，专用于本文：\n\n- `✓`：本次由脚本从一手文本或结构化目录复算，结果与所引一致。\n- `△`：本次复算，但数值随口径变化（如 CJK 计数），文中已声明口径。\n- `×`：本次复算与所引**不一致**，以复算为准，并在§十三列入勘误。\n- `○`：本次未能复验（材料不在仓、接口不可用、或需梵藏阅读能力）。\n\n### 0.4 计数口径：为什么同一个 T279 会有三个字数\n\n本文所有 CJK 字数，统一为「**CBETA TEI 正文汉字码位计数**」：去除 `<note>` 校勘注与全部标签，保留品题、偈颂与正文；`cjk_body` 只计 `cb:div type=\"pin\"` 之内的正文，`cjk` 另含头信息与目次。按此口径：\n\n| 对象 | 本文实测 `cjk_body` | 种子报告 | L.312 矩阵 | 差异原因 |\n|---|---:|---:|---:|---|\n| T279 全文 | 613,191 | 588,727 | 597,477 | 种子疑用「袖珍本／去校勘＋去重复」口径；矩阵为逐品实测但缺数品 |\n| T278 全文 | 507,687 | — | 497,623 | 同上；矩阵六十侧有 7 品记「—」 |\n| T279 品39 入法界 | 190,609（含品题） | 174,902 | 170,107 | 是否含偈颂、品题、校勘符号 |\n\n> **本文判断**：三个总数都不是「错」，而是三种口径。学术写作若不声明口径，数字就不可复核。本文选择「正文汉字码位」这一最接近「读经字数」的口径，并在每一张表下注明。凡与既有系列数字并用时，标△，不强行统一。\n\n### 0.5 复验边界：哪些能核，哪些不能\n\n这是本文最重要的一节。**知道边界，比多写十条结论更有价值。**\n\n| 材料 | 在仓？ | 本文能做的 | 级别 |\n|---|---|---|---|\n| CBETA `T278`、`T279`、`T280`、`T293` 等 XML | 是（本次又补 T281–T309） | 逐字、逐品、逐卷复算 | A |\n| 84000 `Toh 44-31` 阅读页 | 可访问 | 章号、章数、品题 | A |\n| 德格 Toh 44 目录 | 本地 JSON | 45 章、115 包、四函 | A（结构） |\n| 种子「知识图谱 v2.1」231 节点／402 边 | **否** | 只能复述，不能复算 | B |\n| 种子 step1/2/3 的 CSV（974 匹配、7,705 引文） | **否** | 只能复述，不能复算 | B |\n| 阿含、般若原典（T1、T99、T223 等） | **否** | 无法做汉文平行检测 | ○ |\n| 梵本、巴利本、藏文全文 | 部分（藏文 TOC；梵巴无） | 只能据 84000／二手登记 | B/C |\n| 注疏全文 | 是（OCR/EPUB 本，书名号被剥离） | 不能复算书名号引文 | ○／B |\n\n> **诚实结论**：本文能把「版本—品级—别生经—藏章」这一层做到 A；能把「十地五译亲缘」「阿含般若共享清单」「注疏引文分布」做到 **B（种子报告，配套数据未入仓）**；不能把这三项冒充为本次复算。读者若需要 A 级，须先取得种子配套文件，或重跑原始语料。\n\n### 0.6 与库内文章的关系\n\n- 《华严经学·三十九品深度研究》：讲「一经之内」的七处九会、五周因果、逐品要义。本文讲「一经之外」的诸本、诸部、诸藏、诸注。\n- 《华严文献地图_五域近年》：讲「研究文献」的入口。本文讲「原典文本」的坐标。\n- 《藏译华严·三语对读》：讲 Toh 44 的逐章工程。本文只取其对读所建立的章号与结构事实，不重复其三语文本。\n\n> 三文合读，才是「经—研—译」的完整闭环。本文不重复前两文的品义与书目，只在他们停下的地方接手：**品之后，还有什么？**\n\n---\n\n## 〇之二、内容地图\n\n### 〇之二.0 十句话\n\n1. 《华严经》是**经群**：汉文三个大本（T278、T279、T293），藏文 45 章（Toh 44），梵文全经无存，仅存四部单品。`A`\n2. 章数演化可以算清：晋译 34 品 → 唐译 39 品（+5）→ 藏译 45 章（+6）。`A`\n3. 华严部 T278–T309 共 **32 部**：3 大本、17 别生经、12 眷属经；32 部的题名、译者、卷数已逐部由 CBETA XML 复算。`A`\n4. 品与别生经的对应为 **12 簇**；其中 10 簇有汉文别译，佛不思议一簇只见藏文单行本，其余各品只存于大本与藏译。`A`\n5. **「六十阙十品」是错误的**：六十华严只缺「十定品」一品；其「十明品」与八十「十通品」名异实同。`A（本次勘正）`\n6. 十地是对应最密的一簇：梵本全存、三部汉别译、两部汉译论、两种藏译、三部藏文注释。`A`\n7. 十地五译呈「两簇一离群」：T286 与 T278 一簇，T279 与 T287 一簇，T285 离群；相似度为种子 `B`，结构判断为 `A/B`。\n8. 华严与阿含、般若在汉文里的重合，几乎全是共享教义清单与套语；十地品第三、四、六、九地借用了这些清单。`B（种子，未复验）`\n9. 华严宗人自己的「大藏」以论为主：四部注疏共 7,705 次书名号引用，瑜伽部最大，阿含只占 0.6%。`B（种子，未复验）`\n10. 对整部大藏的外推深度不一：华严部、释经论部、经疏部、诸宗部、史传部、目录部已核到文本或题录；其余部类多在教判、阶位、引文与影响层面。`A/B`\n\n> **v1.3 追加**：再往外推（道教、儒家、南传、藏传、梵文、类书）不靠「找相似的書」，而靠判据——见 §十七「三种关系／五层载体／15 行登记册／判定卡」；本仓 `A` 级见证仅三处。\n\n### 〇之二.1 五层与三十二部：先看两张图\n\n<!--GEN:start:fig_layers-->\n<svg viewBox=\"0 0 760 320\" width=\"100%\" role=\"img\" aria-labelledby=\"t\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:760px;margin:1.2rem auto;display:block\"><title>图1　对应的五层</title><desc>由同经异本到版本检索的五层嵌套结构</desc><rect width=\"760\" height=\"320\" fill=\"#fbf8f1\" rx=\"8\"/><rect x=\"40\" y=\"36\" width=\"680\" height=\"74\" rx=\"4\" fill=\"#fff\" stroke=\"#8b5e34\" stroke-width=\"1.2\" opacity=\"1\"/><text x=\"60\" y=\"62\" font-size=\"15\" fill=\"#8b5e34\" text-anchor=\"start\" font-weight=\"bold\" font-family=\"'Noto Serif SC','Songti SC',serif\">一 同经异本</text><text x=\"60\" y=\"86\" font-size=\"12\" fill=\"#666666\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">T278 / T279 / T293 / Toh 44 / 梵本残存</text><rect x=\"54\" y=\"82\" width=\"652\" height=\"74\" rx=\"4\" fill=\"#fff\" stroke=\"#8b5e34\" stroke-width=\"1.2\" opacity=\"1\"/><text x=\"74\" y=\"108\" font-size=\"15\" fill=\"#8b5e34\" text-anchor=\"start\" font-weight=\"bold\" font-family=\"'Noto Serif SC','Songti SC',serif\">二 别生经</tex \"4\" fill=\"#4f6f52\" stroke=\"#4f6f52\" stroke-width=\"1\" opacity=\"0.85\"/><rect x=\"660\" y=\"230\" width=\"32\" height=\"28\" rx=\"4\" fill=\"#4f6f52\" stroke=\"#4f6f52\" stroke-width=\"1\" opacity=\"0.85\"/><text x=\"60\" y=\"306\" font-size=\"11\" fill=\"#666666\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">■ 大本（278/279/293）　■ 别生经（280–292、294–297）　■ 眷属经（298–309）</text></svg>\n<!--GEN:end:fig_catalog-->\n\n> **读图**：图1是「对应」的五层，越向内越需要判断，也越容易把「共享」误作「依赖」。图2是华严部 32 部的构成；三个大本之外，17 部别生经是「品」的单行本，12 部眷属经则未必是某品别译，边界最需小心。\n\n### 〇之二.2 五种读法\n\n| 读法 | 入口 | 适合谁 | 本文对应 |\n|---|---|---|---|\n| 查一品 | §四 十二簇表 | 想读某一品的人 | 品 → 别生经 → 藏章 |\n| 查一部 | §三 32 部全表 | 想查某部 T 号的人 | T 号 → 题名 → 对应簇 |\n| 查一译 | §二 版本群 | 想比较诸本的人 | 四本 → 章数 → 卷次 |\n| 查一藏 | §六 梵藏层 | 想查 Toh 号的人 | 甘珠尔／丹珠尔 |\n| 查一注 | §八 注疏 | 想追古人引用的人 | 注疏 → 被引 → 部类 |\n\n### 〇之二.3 数与位之谱\n\n本文的数字不是装饰，它们各自对应一个可复核的结构：\n\n- **34 / 39 / 45**：三本的品／章数。它们不是「越多越好」，而是三次编纂的层累。\n- **32**：华严部的部数。它由 CBETA 的 `docNumber` 与题录锁定。\n- **12**：品级对应的簇数。它由「有汉文别译」「有藏文单行」「只在大本」三种状态分出。\n- **28**：大正藏部类区间的数量（含 supplements）。它决定「向整部大藏外推」的边界。\n- **7,705**：种子报告的注疏书名号引用数。它是 `B`，不是本文的 `A`。\n\n---\n\n## 一、问题、范围与方法\n\n### 1.1 问题\n\n**主问题**：《华严经》的哪些内容，对应大藏经里的哪些内容，以便进一步查看和阅读？\n\n这个问题看似目录学，实则三层：\n\n1. **文本层**：哪一品在另一藏、另一译、另一编号里是「同一段文本」？\n2. **解释层**：哪一部论、哪一部疏解释了它？解释的密度如何分布？\n3. **意义层**：哪一部经、哪一套判教、哪一个阶位体系与它「相关」？相关的证据是什么？\n\n三层若不分开，就会得到两种坏答案：一种是把「相关」写成「相同」，一种是把「相同」写成「影响」。本文的写法是：**先锁文本，再记解释，最后才谈意义，并且每一层都标明证据级别。**\n\n### 1.2 资料层级\n\n| 层级 | 资料 | 用途 | 本文用法 |\n|---|---|---|---|\n| 一手 | CBETA TEI 全文与头信息；CBETA 题录；84000 译文、导言与章目 | 题名、译者、卷数、品起讫、平行校注、藏章 | 逐部解析，A |\n| 学术 | Nattier（原始华严）；Hamar（解经传统）；Nakanishi（地婆诃罗）；Lee & Hwang（原始华严与藏文平行）；陈俊吉（60/80 品卷对照）；吕建福（眷属经）；印顺（年代学，转引） | 关系判定与年代学 | 登记，B |\n| 二手 | Rulu 译者序；维基镜像；通俗刊物；辞典摘要 | 旁证与线索 | 与一手冲突时以一手为准 |\n| 种子 | 《华严经》与大藏经对应研究总报告及其配套 CSV／图谱 | 问题框架、部类矩阵、注疏统计 | 标 `B`／`种子`，不冒充复算 |\n\n### 1.3 六步法\n\n本文的实际工作顺序，与种子报告§2.2一致，但每一步都加了「复验」：\n\n1. **题录核对**：逐部读取 T278–T309 的题名、译者、卷数、`docNumber` 平行校注。\n2. **品级对齐**：用 CBETA 的 `cb:div type=\"pin\"` 与 `milestone unit=\"juan\"` 确定品起讫卷；用中文维基结构表做第二来源。\n3. **汉文平行检测（第一步）**：种子做过，本文**未复跑**（缺阿含／般若原典），只登记其结论。\n4. **十地对勘（第二步）**：种子做过，本文复核五译的卷数与体量，相似度仍标 `B`。\n5. **注疏引文索引（第三步）**：种子做过，本文复核四部注疏的体量与「书名号被剥离」这一技术事实，统计仍标 `B`。\n6. **文献综述**：Nattier 的原始华严假说、84000 对藏译、十地与入法界研究、DharmaNexus 的方法与局限。\n\n### 1.4 局限\n\n1. **汉文中心**：第一、二步只比汉文，对独立译本的平行会系统性漏检。\n2. **书名号偏差**：注疏引文依赖 CBETA 加的书名号，各部标点工作量不均，引用数是下限。\n3. **单一二手来源**：Rulu 的译者序只作旁证；与一手冲突处以一手为准。\n4. **阈值是经验取值**：精确匹配的长度下限与相似度阈值未做敏感性分析。\n5. **「要义」与内容归类是判断**：各品一句话概括、清单归类，属 `B` 或 `C`。\n6. **种子配套不在仓**：231／402／7,705 三项无法复算；本文已在§0.5声明。\n\n---\n\n## 二、版本群：一经四貌\n\n### 2.1 四本与梵本\n\n<!--GEN:start:versions-->\n| 本 | 编号 | 译者 | 年代 | 规模 | 实测 CJK | 结构 |\n|---|---|---|---|---|---|---|\n| 晋译 | T278 | 佛陀跋陀罗 | 约 418–420 | 60 卷 · 34 品 | 507,687 | 七处八会 |\n| 唐译 | T279 | 实叉难陀 | 695–699 | 80 卷 · 39 品 | 613,191 | 七处九会 |\n| 唐译 | T293 | 般若 | 796–798 | 40 卷 · 入法界品 | 265,368 | 单品全本 |\n| 藏译 | Toh 44 | Jinamitra 等 | 约 800–836〔存疑〕 | 45 章 · 115 包 | — | 四函 |\n| 梵本 | — | — | — | 全经佚；存四部单品 | — | — |\n<!--GEN:end:versions-->\n\n> **表注**：T278、T279 的品／卷／CJK 由 CBETA TEI 复算（`✓`）；T293 由 T293 XML 复算（`✓`）；Toh 44 的章／包由本地德格目录（`✓`），译年取 84000 而标〔存疑〕；梵本存佚据 84000 与英文维基（`B`）。T279 的「译者」栏取 CBETA byline 中「譯」字一行，不取卷首武则天「製」序。\n\n四本不是四个「版本」，而是四次**不同性质的编纂**：\n\n- **T278（晋译）**：最早的全本，34 品，60 卷；「七处八会」中的「八会」即据此本。它把八十华严的品 2–6 合为一品「卢舍那佛品」，这是理解后面一切品数差异的钥匙。\n- **T279（唐译）**：80 卷、39 品、七处九会；它把「卢舍那佛品」拆为品 2–6，又增「十定品」，故比晋译多 5 品。它是本文的主坐标。\n- **T293（四十华严）**：不是「第三个全本」，而是《入法界品》的单品全译，40 卷；卷 40 为《普贤行愿》。它比 T279 品 39 更完整，是「入法界」一簇的独立坐标。\n- **Toh 44（藏译）**：45 章、115 包、四函；比 T279 多 6 章：华藏世界拆为藏 5–9（+4），另有藏 11、藏 32 两章为汉本所无（+2）。\n- **梵本**：全经无存；仅存 Daśabhūmika、Gaṇḍavyūha、Bhadracaryāpraṇidhāna、Anantabuddhakṣetraguṇodbhāvana 四部单品，以及中亚残片。\n\n### 2.2 章数演化：+5 与 +6 的算术\n\n<!--GEN:start:fig_evolution-->\n<svg viewBox=\"0 0 760 320\" width=\"100%\" role=\"img\" aria-labelledby=\"t\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:760px;margin:1.2rem auto;display:block\"><title>图3　章数演化</title><d 45 章 · 115 包</text><line x1=\"60\" y1=\"270\" x2=\"700\" y2=\"270\" stroke=\"#2b2b2b\" stroke-width=\"1\"/><text x=\"320\" y=\"44\" font-size=\"11\" fill=\"#2f5d7c\" text-anchor=\"middle\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">+4 品（卢舍那佛品分为 2–6）＋1 品（十定）＝ +5</text><text x=\"540\" y=\"76\" font-size=\"11\" fill=\"#4f6f52\" text-anchor=\"middle\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">+4 章（华藏世界分为 5–9）＋2 章（藏11、藏32）＝ +6</text></svg>\n<!--GEN:end:fig_evolution-->\n\n**从 34 到 39（+5）**：\n\n- **+4**：八十华严把六十华严的「卢舍那佛品第二」拆为品 2–6（如来现相、普贤三昧、世界成就、华藏世界、毗卢遮那）。\n- **+1**：八十华严新增「十定品第二十七」，六十华严无此独立品（其「十明品」对应的是八十「十通品」，见§2.3）。\n\n**从 39 到 45（+6）**：\n\n- **+4**：藏译把「华藏世界品第五」拆为藏 5–9，五章。\n- **+2**：藏 11「如来华严品」、藏 32「普贤宣说品」，汉本皆无独立品。\n\n> **算术校验**：34 = 39 − 4 − 1；45 = 39 + 4 + 2。两个等式同时成立，说明「品数差异」不是笼统的「译本详略」，而是**可定位的拆分与增补**。这是本文能做到 A 级的原因：每一个 +1 都有具体品名与卷次。\n\n### 2.3 六十↔八十：一张被误传的表\n\n<!--GEN:start:mapping-->\n| # | 八十华严 | 六十华严 | 会 | 汉别译／异译 |\n|---|---|---|---|---|\n| 1 | 世主妙嚴品 | 世間淨眼品 | (初會) 菩提場 （寂滅道場） |  |\n| 2 | 如來現相品 | 盧舍那佛品 | (初會) 菩提場 （寂滅道場） |  |\n| 3 | 普賢三昧品 | 盧舍那佛品 | (初會) 菩提場 （寂滅道場） |  |\n| 4 | 世界成就品 | 盧舍那佛品 | (初會) 菩提場 （寂滅道場） |  |\n| 5 | 華藏世界品 | 盧舍那佛品 | (初會) 菩提場 （寂滅道場） |  |\n| 6 | 毗盧遮那品 | 盧舍那佛品 | (初會) 菩提場 （寂滅道場） |  |\n| 7 | 如來名號品 | 如來名號品 | (二會) 普光明殿 | 兜沙經 ，後漢 支讖 譯 菩薩本業經，吳 支謙 譯 |\n| 8 | 四聖諦品 | 四諦品 | (二會) 普光明殿 |  |\n| 9 | 光明覺品 | 如來光明覺品 | (二會) 普光明殿 | 兜沙經，後漢支讖譯 菩薩本業經，吳支謙譯 |\n| 10 | 菩薩問明品 | 菩薩明難品 | (二會) 普光明殿 |  |\n| 11 | 淨行品 | 淨行品 | (二會) 普光明殿 | 菩薩本業經，吳支謙譯 諸菩薩求佛本業經，失譯 |\n| 12 | 賢首品 | 賢首菩薩品 | (二會) 普光明殿 |  |\n| 13 | 昇須彌山頂品 | 佛昇須彌頂品 | (三會) 忉利天宮 | 菩薩本業經，吳支謙譯 |\n| 14 | 須彌山頂上偈讚品 | 菩薩雲集妙勝殿上說偈品 | (三會) 忉利天宮 |  |\n| 15 | 十住品 | 菩薩十住品 | (三會) 忉利天宮 | 菩薩本業經，吳支謙譯 菩薩十住行道品，失譯 菩薩十住經，晉竺法護譯 |\n| 16 | 梵行品 | 梵行品 | (三會) 忉利天宮 |  |\n| 17 | 初發心功德品 | 初發心菩薩功德品 | (三會) 忉利天宮 |  |\n| 18 | 明法品 | 明法品 | (三會) 忉利天宮 |  |\n| 19 | 昇夜摩天宮品 | 佛昇夜摩天宮自在品 | (四會) 夜摩天宮 |  |\n| 20 | 夜摩宮中偈讚品 | 夜摩天宮菩薩說偈品 | (四會) 夜摩天宮 |  |\n| 21 | 十行品 | 功德華聚菩薩十行品 | (四會) 夜摩天宮 |  |\n| 22 | 十無盡藏品 | 菩薩十無 _80_60_matrix.json` 的 27–36 行、既有 P39 文章 §6.6、矩阵页的红标，均应据此修订；本文只记录勘正，不擅自改动既有已发布内容（修订需另一批授权）。\n\n### 2.4 七处九会：空间结构与卷次\n\n<!--GEN:start:fig_assemblies-->\n<svg viewBox=\"0 0 900 200\" width=\"100%\" role=\"img\" aria-labelledby=\"t\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:900px;margin:1.2rem auto;display:block\"><title>图5　七处九会带状图</title><desc>九会按卷次比例展开，标注品次与卷次</desc><rect width=\"900\" height=\"200\" fill=\"#fbf8f1\" rx=\"8\"/><rect x=\"40\" y=\"70\" width=\"109.75\" height=\"58\" rx=\"4\" fill=\"#8b5e34\" stroke=\"none\" stroke-width=\"1\" opacity=\"0.9\"/><text x=\"46\" y=\"90\" font-size=\"11\" fill=\"#fff\" text-anchor=\"start\" font-weight=\"bold\" font-family=\"'Noto Serif SC','Songti SC',serif\">初会</text><text x=\"46\" y=\"106\" font-size=\"10\" fill=\"#fff\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">1–6</text><text x=\"46\" y=\"120\" font-size=\"10\" fill=\"#fff\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">1–11</text><rect x=\"152.75\" y=\"70\" width=\"38.0\" height=\"58\" rx=\"4\" fill=\"#2f5d7c\" stroke=\"none\" stroke-width=\"1\" opacity=\"0.9\"/><text x=\"158.75\" y=\"90\" font-size=\"11\" fill=\"#fff\" text-anchor=\"start\" font-weight=\"bold\" font-family=\"'Noto Serif SC','Songti SC',serif\">二会</text><text x=\"158.75\" y=\"106\" font-size=\"10\" fill=\"#fff\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">7–12</text><text x=\"158.75\" y=\"120\" font-size=\"10\" fill=\"#fff\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">12–15</text><rect x=\"193.75\" y=\"70\" width=\"27.75\" height=\"58\" rx=\"4\" fill=\"#4f6f52\" stroke=\"none\" stroke-width=\"1\" opacity=\"0.9\"/><text x=\"199.75\" y=\"90\" font-size=\"11\" fill=\"#fff\" text-anchor=\"start\" font-weight=\"bold\" font-family=\"'Noto Serif SC','Songti SC',serif\">三会</text><text x=\"199.75\"  font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">60–80</text><text x=\"40\" y=\"46\" font-size=\"14\" fill=\"#2b2b2b\" text-anchor=\"start\" font-weight=\"bold\" font-family=\"'Noto Serif SC','Songti SC',serif\">七处九会 × 品 × 卷（八十华严）</text><text x=\"40\" y=\"158\" font-size=\"10\" fill=\"#666666\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">初会菩提场 1–6 品（卷1–11）→ 二会普光明殿 7–12（12–15）→ 三会忉利 13–18（16–18）→ 四会夜摩 19–22（19–21）</text><text x=\"40\" y=\"176\" font-size=\"10\" fill=\"#666666\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">→ 五会兜率 23–25（22–33）→ 六会他化 26（34–39）→ 七会重会 27–37（40–52）→ 八会 38（53–59）→ 九会逝多林 39（60–80）</text></svg>\n<!--GEN:end:fig_assemblies-->\n\n| 会 | 处所 | 八十品 | 卷 |\n|---|---|---|---|\n| 初会 | 菩提场 | 1–6 | 1–11 |\n| 二会 | 普光明殿 | 7–12 | 12–15 |\n| 三会 | 忉利天 | 13–18 | 16–18 |\n| 四会 | 夜摩天 | 19–22 | 19–21 |\n| 五会 | 兜率天 | 23–25 | 22–33 |\n| 六会 | 他化自在天 | 26 | 34–39 |\n| 七会 | 重会普光明殿 | 27–37 | 40–52 |\n| 八会 | 三会普光明殿 | 38 | 53–59 |\n| 九会 | 逝多林 | 39 | 60–80 |\n\n> **表注**：卷次由 `T10n0279` 的 `milestone unit=\"juan\"` 与品头位置实测（`✓`）。处所中六会（他化自在天）、九会（逝多林）有 84000 佐证；其余按通行说（`B/C`）。法藏《华严经旨归》(`T1871`) 说「七处八会」，是据六十本；本文主八十本，故说「七处九会」，两说并存而不相碍。\n\n### 2.5 藏译四十五章：对齐的算术\n\n藏译 `Toh 44` 的 45 章与八十 39 品的对齐，可以写成一条**可校验的映射**：\n\n- 藏 1–4 = 品 1–4（1:1）\n- 藏 5–9 = 品 5（华藏世界，五章合一品，+4）\n- 藏 10 = 品 6\n- 藏 11 = 藏文独有（如来华严品）\n- 藏 12–31 = 品 7–26（差 5）\n- 藏 32 = 藏文独有（普贤宣说品）\n- 藏 33–45 = 品 27–39（差 6）\n\n**校验**：45 = 39 + 4（华藏） + 2（独有）。同时，藏 12 = 品 7（差 5），藏 31 = 品 26（差 5）；藏 33 = 品 27（差 6），藏 45 = 品 39（差 6）。差数在藏 32 处跳变，正对应「独有章」。\n\n> **级别**：结构对齐为 `A`（本地 TOC + 84000 章数）；逐章**内容**对应为 `B`〔待核〕。84000 `Toh 44-31` 明言「The Ten Bhūmis is chapter 31 in the 45-chapter Tibetan version」，与本地 TOC 的「藏 31 = 品 26 十地」互证（`✓`）。\n\n### 2.6 品、卷、章：三种「长度」不可互译\n\n- 汉文「卷」是物理装帧单位，不等于「品」；一品可跨多卷（如 T279 品 25 十回向跨卷 23–33，品 39 入法界跨卷 60–80）。\n- 藏文「章」是内容单位，「包」（bam po）是装帧单位；45 章 = 115 包，平均每章 2.6 包，但分布不均。\n- 梵本「品」是内容单位，但存世单品多不分品（如 Gaṇḍavyūha 的 56 节是现代编号）。\n\n> **本文判断**：凡引用「篇幅」比较，必须声明是卷、品、章、包还是 CJK 字数；四者不可直接换算。这是华严版本学最容易被忽略的技术细节。\n\n---\n\n### 2.7 四十华严：入法界的独立全本\n\nT293 不是「第三个全本」，而是《入法界品》的**单品全译**：40 卷、1 品，卷 40 为《普贤行愿》。它比 T279 品 39（卷 60–80）更完整的地方，是**有独立序分**（「如是我聞：一時，佛在室羅筏城逝多林給孤獨園大莊嚴重閣」）；T279 品 39 作为全经末品，没有新序。\n\n| 本 | 卷 | 品 | 序分 | 末尾 |\n|---|---|---|---|---|\n| T279 品39 | 60–80（21 卷） | 入法界 | 无新序（全经末品） | 末会 |\n| T293 | 1–40 | 入法界 | 有完整序分 | 卷 40 普贤行愿 |\n\n本仓在 L.375–L.397 已做 **16 批、92 个对照窗**的逐段对读（截至 2026-11-11），全部回源通过。批次与主发现如下：\n\n<!--GEN:start:forty-->\n| 批 | 日期 | 窗 | 主要发现（节录） |\n|---|---|---:|---|\n| L.375 80/40 逐段对读试点 | 2026-11-07 | 9 | 八十/四十品39开篇同段两译·骨架平行·数差五百/五千·國城之异·四十多勝智十系 |\n| L.376 80/40 批二 | 2026-11-07 | 6 | 名表尾同名收束·普贤行愿成就/所生·四十多我人壽者四相语·声闻众近全同 |\n| L.377 80/40 批三 | 2026-11-09 | 7 | 近全同段之最：师子频申三昧式句句平行·逝多林广博近全同·请法问域同而广狭异 |\n| L.385 80/40 批四 | 2026-11-09 | 5 | 到会九件模板全同·世界/佛号各自异名·云名两套·冠网次序互倒 |\n| L.385b 80/40 批五 | 2026-11-10 | 8 | 说颂段逐颂重译实证：说主同名异构·颂数同·近全同颂·逐字全同句(正覺非有量)·同源决定性实证 |\n| L.385c 80/40 批六 | 2026-11-10 | —（说主对照表） | 十位说主1:1全对应·次第全同·四十带十方方位衔·名目三类(词素全同/同义异词/增衍改缀) |\n| L.385d 80/40 批七 | 2026-11-10 | 7 | 普贤重宣十颂逐颂平行·眉间白毫放光段近全同·三昧名广大方/方一字差·四十明书三昧全名 |\n| L.385e 80/40 批八 | 2026-11-10 | 8 | 文殊十六颂句句平行实证·首句全同·两句逐字全同·后效段近全同·韵文散文双重坐实同源 |\n| L.386 80/40 批九 | 2026-11-10 | 7 | 文殊南行善财入缘前奏·六千/六十比丘数差十倍·十比丘名半同半异·十观察近全同·十无疲厌排比 |\n| L.387 80/40 批十 | 2026-11-10 | 5 | 善财出场段平行·位次异(八十列童子首名/四十独率五百眷属)·七伏藏近全同(真珠/赤珠一目异)·五百宝器平行 |\n| L.388 80/40 批十一 | 2026-11-10 | 7 | 文殊指授段平行·四十独有熙怡微笑·善财长颂四喻城郭倒序·示我解脱门叠句变体(四十增真乘)·忍甲智剑近全同 |\n| L.389 80/40 批十二 | 2026-11-10 | 6 | 第一参之始平行·德雲/吉祥雲逐字实证·善知识四句教诫四十更备·七日求觅四十明书竟不能见·十一云何问趣/起一字异 |\n| L.392 80/40 批十三 | 2026-11-11 | —（门名／门对） | 二十一念佛门全系列平行·全同5门·基同增衔9门·总名仅四十有 |\n| L.394 80/40 批十四 | 2026-11-11 | 6 | 海雲普眼法门段近平行·大海墨喻四级递降全同·十陀罗尼系列平行·四十增海藏衔 |\n| L.395 80/40 批十五 | 2026-11-11 | 7 | 十海问近全同(家/海/地/流/轮/境界/门/城八组)·问数差一(四十多首问)·海雲勘验句逐字全同·十门观察领字两系 |\n| L.397 80/40 批十六（压轴） | 2026-11-11 | 4 | 十大愿王章+Bhadracarí 仅四十有·八十全经恒顺众生零见·同源而终局分岔 |\n\n> 共 **92 个对照窗**；完整发现见 `data/research/huayan_80_40_duikandu_b*.json`。批六、批十三等项目不以「窗口」记录（L.385c 80/40 批六（说主对照表）、L.392 80/40 批十三（门名／门对）），故窗数计「—」，不计入 92 之数。\n<!--GEN:end:forty-->\n\n**五条结构判断**：\n\n1. **骨架平行**：会处、上首、幢、威力（威德光）、藏、眼、冠、髻名表，两译逐件对应；到会九件（方位→世界→佛号→菩萨→眷属→兴云→顶礼→化座→趺坐）模板全同。\n2. **数差是系统性的**：开篇「五百／五千」、文殊南行「六千／六十」都是十倍差；另有「國／城」、名表首段「勝智十系」、十方方位衔（四十有、八十无）等。\n3. **韵文也逐颂对应**：说颂段说主 1:1、颂数相同、颂旨逐颂对应；出现「正覺非有量，亦復非無量」这类逐字全同句，以及「汝應觀此逝多林」全同首句——两译所据为同一梵本颂体〔本文判断〕。\n4. **善财位次异**：八十把善财列在童子众首名；四十让善财**独率五百眷属来集**，副从善禁等十童子。单行本强化主角〔本文判断〕。\n5. **细节近全同**：七伏藏六宝目同（真珠／赤珠一目异）、五百宝器互盛式平行、声闻众「悉覺真諦…深信趣入」句句平行。\n\n> **本文判断**：T293 不是「后出节本」，而是一个**有独立序分、保留部分更古读法**的单品全本；但它也不是「处处胜于八十」——两译各有增衍与改缀，不能做单向优劣判断。四十与八十的品 39，是**同一品的两套完整重译**，不是「全本 vs 节本」。\n\n---\n\n## 三、华严部 T278–T309：三十二部全貌\n\n### 3.1 三分类\n\n（华严部 32 部的构成，见§0.2 图2。）\n\n32 部的三分类，是「角色」而非「价值」：\n\n- **大本（3）**：T278、T279、T293。T293 虽只含一品，但它是「全本单品」，不是「别生」。\n- **别生经（17）**：T280–T292、T294–T297。从大本中单独流通的某品或某部分。\n- **眷属经（12）**：T298–T309。与华严有关，但未必是某品别译；其中 T298 对应藏 32，T300/T301 与 T302–T304 各为异译组，T307/T308 为十地陀罗尼系，T309 与十住的关系〔待核〕。\n\n> **边界原则**：不以经名望文生义。T309 虽名「十住」，法藏明判「非十住品亦非十地品」；T299 名「总持宝光明」，与十住／贤首的关系是「影响」而非「别译」。凡不能由题录或校注证明的，一律写入「待核」。\n\n### 3.2 三十二部全表\n\n<!--GEN:start:catalog-->\n| T | 题名（CBETA） | 译者 | 卷 | 品 | 实测 CJK | 角色 | 对应簇 | 校注互见（T279 品） |\n|---|---|---|---|---|---|---|---|---|\n| T280 | 佛說兜沙經 | 支娄迦谶 | 1 | — | 2,417 | 别生 | 名号·光明觉 | 7 如來名號品、9 光明覺品 |\n| T281 | 佛說菩薩本業經 | 支谦 | 1 | 2 | 4,912 | 别生 | 净行／十住 | 11 淨行品、15 十住品 |\n| T282 | 諸菩薩求佛本業經 | 聂道真 | 1 | — | 5,113 | 别生 | 净行 | 11 淨行品 |\n| T283 | 菩薩十住行道品 | 竺法护 | 1 | — | 3,672 | 别生 | 十住 | 15 十住品 |\n| T284 | 佛說菩薩十住經 | 祇多蜜 | 1 | — | 2,146 | 别生 | 十住 | 15 十住品 |\n| T285 | 漸備一切智德經 | 竺法护 | 5 | 10 | 52,804 | 别生 | 十地 | 26 十地品 |\n| T286 | 十住經 | 鸠摩罗什 | 4 | 10 | 47,188 | 别生 | 十地 | 26 十地品 |\n| T287 | 佛說十地經 | 尸罗达摩 | 9 | 10 | 54,249 | 别生 | 十地 | 26 十地品 |\n| T288 | 等目菩薩所問三昧經 | 竺法护 | 3 | 13 | 24,920 | 别生 | 十定 | 27 十定品 |\n| T289 | 顯無邊佛土功德經 | 玄奘 | 1 | — | 760 | 别生 | 寿量 | 31 壽量品 |\n| T290 | 佛說較量一切佛剎功德經 | 法贤 | 1 | — | 786 | 别生 | 寿量 | 31 壽量品 |\n| T291 | 佛說如來興顯經 | 竺法护 | 4 | — | 32,900 | 别生 | 如来出现 | 37 如來出現 T293 卷 40。\n8. **如来出现**：T291《佛说如来兴显经》。\n9. **离世间**：T292《度世品经》。\n10. **入法界**：T293（全本）、T294《佛说罗摩伽经》、T295《大方广佛华严经入法界品》。\n\n> **级别**：以上对应由 `docNumber` 与 Taishō 校注锁定（`A`）；「簇」的命名与归并是本文判断。\n\n### 3.4 眷属经的边界：哪些是「别译」，哪些只是「相关」\n\n12 部眷属经，按可证程度分三档：\n\n| 档 | 经 | 证据 | 级 |\n|---|---|---|---|\n| 可证为异译组 | T300/T301；T302/T303/T304；T307/T308 | 题名、卷数、内容互见；T300/T301 互享 86 个 12 字，与品 33 仅 0／4 | A/B |\n| 可证为藏文单品之对应 | T298 ↔ 藏 32「普贤宣说品」 | 84000 章题 *The Teaching of Samantabhadra*（藏 32） | A/B |\n| 仅有题名或义理关联 | T299、T305、T306、T309 | 题名、经首、法藏判语；T309 与品 15 零重叠，非十住别译 | C／〔待核〕 |\n\n> **本文判断**：眷属经的价值，不在「凑数」，而在它们保留了**大本之外的异译形态**。T300/T301 与 T302–T304 是两组不同主题的独立 witness：前者近「佛不思议」（Toh 187），后者近「如来出现」；T307/T308 是十地陀罗尼系的独立 witness。把它们简单归入「某品别译」，反而抹掉了它们的独立性。\n\n### 3.5 校注互见的读法\n\nTaishō 的 `docNumber` 是本文最被低估的证据源。它把「此经与彼经的某品」的对应，写在了**经首的方括号**里。例如：\n\n- `T10n0280`：`No. 280 [Nos. 278(3, 5), 279(7, 9)]`\n- `T10n0281`：`No. 281 [Nos. 278(7, 11), 279(11, 15), 282]`\n- `T10n0285`：`No. 285 [Nos. 278(22), 279(26)]`\n\n这三种写法，分别对应「一品多分」「多品合一」「同品异译」。读法：\n\n1. 括号内的第一个数字是「平行的大本」，圆括号内是「品号」。\n2. 同一 T 号出现多次，表示「同品多分」（如 T281 横跨 278 品 7、11）。\n3. 括号内出现另一个别生经号（如 T281 的 `282`），表示「别生经之间的互见」，不是大本品号。\n\n> **本文判断**：`docNumber` 是 CBETA 从 Taishō 原编继承的「平行校注」，其可靠性高于后世经录的转述；但它只覆盖「编者认为有平行」的经，不覆盖全部关系。故它是**下限**，不是全集。\n\n---\n\n## 四、品级对应：十二簇\n\n### 4.1 总表\n\n<!--GEN:start:clusters-->\n| 簇 | 八十品 | 藏章 | 汉别译／异译 | 级 |\n|---|---|---|---|---|\n| 名号·光明觉 | 7、9 | 12、14 | T280；T281 序品 | A |\n| 净行 | 11 | 16 | T282；T281 愿行品 | A |\n| 十住 | 15 | 20 | T283、T284；T281 第三章 | A |\n| 十地 | 26 | 31 | T285、T286、T287 | A |\n| 十定 | 27 | 33 | T288 | A |\n| 寿量 | 31 | 37 | T289、T290 | A |\n| 佛不思议 | 33 | 39 | 汉无；Toh 187 | A（藏）／C（汉） |\n| 普贤行愿 | 36、40 卷末 | 42、45 末 | T293 卷40、T296、T297 | A |\n| 如来出现 | 37 | 43 | T291 | A |\n| 离世间 | 38 | 44 | T292 | A |\n| 入法界 | 39 | 45 | T293、T294、T295 | A |\n| 其余 27 品 | 1–6、8、10、12–14、16–25、28–30、32、34、35 | 见 §2.3 | 无单独汉译 | A |\n<!--GEN:end:clusters-->\n\n### 4.2 三线对齐图\n\n<!--GEN:start:fig_clusters-->\n<svg viewBox=\"0 0 900 426\" width=\"1 \" fill=\"#2b2b2b\" text-anchor=\"start\" font-weight=\"bold\" font-family=\"'Noto Serif SC','Songti SC',serif\">其余 27 品</text><rect x=\"150\" y=\"386\" width=\"210\" height=\"16\" rx=\"4\" fill=\"#fff\" stroke=\"#d8d0c0\" stroke-width=\"1\" opacity=\"1\"/><text x=\"156\" y=\"398\" font-size=\"9\" fill=\"#2f5d7c\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">1–6、8、10、12–14、16–25、28–30、32、34、35</text><rect x=\"390\" y=\"386\" width=\"150\" height=\"16\" rx=\"4\" fill=\"#fff\" stroke=\"#d8d0c0\" stroke-width=\"1\" opacity=\"1\"/><text x=\"396\" y=\"398\" font-size=\"9\" fill=\"#4f6f52\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">见 §2.3</text><rect x=\"570\" y=\"386\" width=\"250\" height=\"16\" rx=\"4\" fill=\"#fff\" stroke=\"#d8d0c0\" stroke-width=\"1\" opacity=\"1\"/><text x=\"576\" y=\"398\" font-size=\"9\" fill=\"#8b5e34\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">无单独汉译</text><text x=\"830\" y=\"398\" font-size=\"9\" fill=\"#666666\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">A</text></svg>\n<!--GEN:end:fig_clusters-->\n\n### 4.3 逐簇\n\n**（1）名号·光明觉**：T280 是最早的汉译单品（后汉支娄迦谶），T281 序品亦属此簇。藏 12、14 对应品 7、9。此簇的特点是「佛名号」与「光明」两个主题在单品中合流；T280 的 `docNumber` 同时挂 278(3,5) 与 279(7,9)，说明它在六十、八十两个系统里都被视为「名号＋光明觉」的合译。\n\n**（2）净行**：T282 与 T281 愿行品。藏 16 是「Gocarapariśuddha」（行境清净），丹珠尔 `Toh 3965` 有纲要。澄观以《菩萨璎珞本业经》(`T1485`) 解三贤位，即以此簇为入口。此簇的「净行」不是「持戒」的泛称，而是「菩萨行境」的清净；藏文 Titre 保留了这一层。\n\n**（3）十住**：T283、T284、T281 第三章。T281 的 `docNumber` 把「第三章」挂到 278(11)、279(15)，而 T283/T284 又各自挂 278(11)、279(15)，形成「一经三译」的互见网。藏 20 对应品 15；Toh 145、847 的段落见于藏 20，是「十住」簇的藏文独立 witness。**但 T281 第三章的品题作「十地品」，内容却起于忉利天（十住处），与品 15、品 26 的 12 字共享均为 0**（§12.6）；这是「题名—内容—校注」三重错位的一例，不可据品题把它改归「十地」。\n\n**（4）十地**：见§五。此簇是全书对应最密者：梵本全存、三部汉别译、两部汉译论、两种藏译、三部藏文注释。\n\n**（5）十定**：T288 是唯一汉文别译；六十无此品，藏 33 对应八十品 27。此簇的「阙」是**真的阙**：六十只有「十明」（＝十通），没有「十定」。这正是旧说「阙十品」的起点，也是本文勘正的焦点。\n\n**（6）寿量**：T289、T290 两译；梵本 `Anantabuddhakṣetraguṇodbhāvana` 存；藏 `Toh 104`、`268` 为同类单品。此簇的特点是「极短」（T289 仅 760 字），却因「佛寿量」而成为华严宇宙论的关键。\n\n**（7）佛不思议**：汉文无独立别译（§12.6 已判：T300／T301 与品 33 的 12 字共享仅 0／4，二者彼此共享 86，属同一异译组，**非此品别译**）；藏 `Toh 187` 为近似异译（义理同题，非字面同文）。此簇是「藏有汉无」的典型，说明「大本之外」的对应不能只以汉文为准。\n\n**（8）普贤行愿**：T293 卷 40、T296（44 颂）、T297（62 颂）；梵 `Bhadracaryāpraṇidhāna` 存；藏 `Toh 1095` 单行。此簇的「一簇多形」最复杂：长行、偈颂、单行、卷末，四种形态并存。\n\n**（9）如来出现**：T291《如来兴显经》；藏 43 对应品 37。注疏明引《涅槃》《维摩》《法华》《摄论》，而《宝性论》仅 1 次（种子 `B`）。此簇是「性起」义理的文本锚点，但「性起」与「如来藏」的义理对读，不能直接推为「引文对应」。\n\n**（10）离世间**：T292《度世品经》；藏 44 对应品 38。澄观《疏》明引 T292 于此品 14 次，其中 13 次在离世间品（种子 `B`）。这是别生经被注疏明引的少数例外之一。\n\n**（11）入法界**：T293（全本）、T294、T295；梵 `Gaṇḍavyūha` 存；藏 45 对应品 39。此簇的「五十三参」计数（50／52／53／110）是独立问题，本文不强行统一，列入§十四。\n\n**（12）其余 27 品**：无单独汉译，只存于大本与藏译。它们不是「不重要」，而是「没有被单行化」；其注疏解释仍逐品存在。\n\n### 4.4 无别生经的品，是否等于「无对应」？\n\n不等于。**「无汉文别译」只说明它没有被单独流通，不说明它没有藏译、梵本或注疏。** 例如：\n\n- 品 1–6 无别生经，但品 5 华藏世界在藏译中拆为五章，梵本虽无全本，却有《华严经》残片。\n- 品 33 佛不思议无汉别译，但藏 `Toh 187` 是独立单品。\n- 品 34、35 无别生经，但《如来十身相海》《随好光明功德》在注疏中逐品解释。\n\n> **本文判断**：品级对应的「有／无」，必须分「汉别译」「藏单行」「梵本」「注疏」四栏；只看「汉别译」一栏，会把「藏有汉无」误判为「无对应」。\n\n### 4.5 关系网络：从「表」到「图」\n\n表能列对应，图能看结构。本节三图由同一份图 JSON（**148 节点、289 条边**）生成，分别回答三个问题：\n\n> **交互图（内嵌）**：下方可直接操作——分层／力导向／引用三模式，图层与边型过滤，搜索、缩放、拖拽、节点详情；点「展开」可全屏。静态三图保留在下方，供印刷与离线阅读。\n\n<div id=\"dazang-graph-inline\"></div>\n\n1. **版本—品—章—异译**：哪些版本包住哪些品／章？哪些异译指向哪些品？\n2. **簇—品—异译**：十二簇如何「吸住」39 品？哪些品有卫星，哪些没有？\n3. **注疏—经论—部类**：四部注疏把华严接到了哪些经论与部类？\n\n| 边型 | 方向 | 含义 | 线型 | 级 |\n|---|---|---|---|---|\n| `contains` | 版本 → 品／章 | 大本含此品／章 | 实线 | A |\n| `contains_60` | T278 → 品 | 六十系统的品位（**不是同编号**） | 虚线 | A |\n| `parallel` | 品 ↔ 藏章 | 内容平行 | 细灰线 | A |\n| `translation` | 品 → 异译 | 别生／异译 | 橙线 | A（有校注）／B |\n| `related` | 品／藏 → 异译 | 义理或待核关联 | 红虚线 | B／C |\n| `belongs` | 品／异译 → 簇 | 归簇 | 细线 | 本文判断 |\n| `unique` | 藏章 → 藏文独有 | 汉本无 | 红圈 | A |\n| `survives` | 梵本 → 品 | 梵本单品存 | 红虚线 | A／B |\n| `cites`／`cites_class` | 注疏 → 经论／部类 | 引用 | 宽度＝量 | B |\n| `sums_to` | 注疏 → 合计 | 四部注疏的引文总量（95／1,580／1,667／4,363） | 仅数据表 | B |\n| `contains_part` | 大本 → 品 | 多品本中的局部所含（T293 卷 40 挂品 36） | 点线 | A（校注） |\n\n> **边型共 12 类**（上表 11 行，其中 `cites`／`cites_class` 为两类）。`sums_to` 与 `contains_part` 只在数据层出现：前者是注疏引文的汇总边，后者是「全本中只含某品一部分」的挂接边（T293 卷 40）。\n\n<!--GEN:start:graph_spine-->\n<svg viewBox=\"0 0 1120 1010\" width=\"100%\" role=\"img\" aria-labelledby=\"t\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:1120px;margin:1.2rem auto;display:block\"><title>图7 经群分层拓扑</title><desc>版本、品、藏章、异译的分层对应网络</desc><rect width=\"1120\" height=\"1010\" fill=\"#fbf8f1\" rx=\"8\"/><text x=\"30.0\" y=\"30.0\" font-size=\"15\" fill=\"#2b2b2b\" text-anchor=\"start\" font-weight=\"bold\" font-family=\"'Noto Serif SC','Songti SC',serif\">图7　经群分层拓扑：版本 → 39 品 → 45 藏章 → 30 部异译</text><text x=\"30.0\" y=\"48.0\" font-size=\"10\" fill=\"#6b6b6b\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">实线＝containment／parallel／translation；虚线＝存疑或特例。色带＝十二簇；红圈＝藏文独有二章；红叉＝六十无十定。</text><rect x=\"332.0\" y=\"56.0\" width=\"18.0\" height=\"131.0\" rx=\"2\" fill=\"#8c6a4a\" stroke=\"none\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"358.0\" y=\"124.5\" font-size=\"8\" fill=\"#8c6a4a\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\" transform=\"rotate(-90 358 124.5)\">初会六品（6）</text><rect x=\"332.0\" y=\"194.0\" width=\"18.0\" height=\"62.0\" rx=\"2\" fill=\"#b06a4a\" stroke=\"none\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"358.0\" y=\"228.0\" font-size=\"8\" fill=\"#b06a4a\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\" transform=\"rotate(-90 358 228.0)\">名号·光明觉</text><rect x=\"332.0\" y=\"286.0\" width=\"18.0\" height=\"16.0\" rx=\"2\" fill=\"#4f6f52\" stroke=\"none\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"358.0\" y=\"297.0\" font-size=\"8\" fill=\"#4f6f52\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\" transform=\ o Serif SC','Songti SC',serif\">0.43</text><text x=\"30\" y=\"300\" font-size=\"10\" fill=\"#666666\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">数字为种子报告的平均对齐相似度（B，未在本仓复算）；圆面积按 CBETA 实测 CJK 字数。</text></svg>\n<!--GEN:end:fig_dashabhumika-->\n\n十地的五个汉译，不是「五个平行版本」，而是「两簇一离群」：\n\n- **第一簇**：T286（鸠摩罗什，4 卷）与 T278（佛陀跋陀罗，六十品 22）。种子报告的平均对齐相似度 0.69，强对齐占 93%，字符级加权 0.73。T286 比 T278 早约十年，二者共享译语，但并非逐字相同。\n- **第二簇**：T279（实叉难陀，八十品 26）与 T287（尸罗达摩，9 卷）。相似度 0.43；越到后面几地越近。\n- **离群**：T285（竺法护，5 卷）。与其余各本的相似度 0.11–0.12，字面对齐不可靠；它的价值在「独立 witness」，不在「近似」。\n\n> **级别**：相似度为种子 `B`（本文未复算）；「两簇一离群」的结构判断为 `A/B`——即使换切段或相似度度量，簇结构仍稳（种子§4.2）。T285 的对齐已声明不可靠，不可用它反推「竺法护本更古」或「更近梵本」。\n\n### 5.3 体量与独有段\n\n以 T286 为 100%：T278 为 92%，T279 为 94%，T287 为 117%，T285 为 108%；T279 的十地品约为 T287 的 80%。T286 有 15% 的段落在 T278 里没有字面对应，都很零碎，最长的连续段约 150 字，多是序分扩写、四摄法清单等。\n\n> **本文实测**（`✓`）：T285 52,804 字、T286 47,188 字、T287 54,249 字、T278 品 22 42,390 字、T279 品 26 43,413 字。与种子的「百分比」相容，但绝对数因口径不同而略有差异（见§0.4）。\n\n### 5.4 论释的引用\n\n- `T1522`《十地经论》（世亲，菩提流支等译，12 卷）：种子报告称其经文引用措辞最近 T286（覆盖 22.4%），其次 T278（19.4%）、T279（13.4%）；T287 与 T285 几乎不重合。\n- `T1521`《十住毗婆沙论》（龙树，鸠摩罗什译，17 卷）：对 T286 几乎没有字面引用（约 1%），多为转述。\n\n> **本文判断**：T1522 的引文靠近「罗什—佛陀跋陀罗」一簇，与时间先后相容；但「相容」不等于「影响方向」。论主引用的是「当时流通的文本」，不是「后世校订的定本」；不能由措辞相近推出「T286 是 T1522 的底本」。\n\n### 5.5 十地为什么是枢纽\n\n十地一簇之所以最密，不是因为它「最重要」，而是因为它**同时满足了四个条件**：\n\n1. **梵本全存**：Daśabhūmika 有完整的梵本与多个校订本，可作三语对读的锚点。\n2. **汉译最多**：五个汉译，跨越三百年，保留了不同时代的译语。\n3. **论释最早**：T1522、T1521 两部论，是「经—论」对应的最早证据。\n4. **注疏最重**：十地品在《探玄记》占 29.5%，在《清凉疏》占 25.9%（种子 `B`）。\n\n> **本文判断**：十地是「对应研究」的实验室：如果一种方法不能在十地上成立，它大概也不能在华严的其他品上成立。反之，十地的结论也不能直接外推到「入法界」；后者的形态（叙事、善知识、长行）与十地（阶位、清单、偈颂）不同。\n\n---\n\n### 5.6 十地十地名：五译对照\n\n十地是对应最密的一簇，但五译的**地名**并不统一。T285 用「十住／道地」语汇，卷首自列「初菩薩住名曰悅豫……第十菩薩住名曰法雨」；T286 用「明地／焰地」；T278 用「明地／焰地」；T279 用「發光／焰慧」；T287 用「極喜／發光／焰慧」。\n\n<!--GEN:start:bhumi-->\n| 地 | 梵 | T285 竺法护 | T286 罗什 | T278 六十 | T279 八十 | T287 尸罗达摩 |\n|---|---|---|---|---|---|---|\n| 初地 欢喜 | Pramuditā | 悅豫（初發意悅豫住） | 歡喜地 | 歡喜地 | 歡喜地 | 極喜地 |\n| 二地 离垢 | Vimalā | 離垢 | 離垢地 | 離垢地 | 離垢地 | 離垢地 |\n| 三地 发光 | Prabhākarī | 興光 | 明地 | 明地 | 發光地 | 發光地 |\n| 四地 焰慧 | Arciṣmatī | 暉曜 | 焰地 | 焰地 | 焰慧地 | 焰慧地 |\n| 五地 难胜 | Sudurjayā | 難勝 | 難勝地 | 難勝地 | 難勝地 | 難勝地 |\n| 六地 现前 | Abhimukhī | 目見 | 現前地 | 現前地 | 現前地 | 現前地 |\n| 七地 远行 | Dūraṃgamā | 玄妙 | 遠行地 | 遠行地 | 遠行地 | 遠行地 |\n| 八地 不动 | Acalā | 不動 | 不動地 | 不動地 | 不動地 | 不動地 |\n| 九地 善慧 | Sādhumati | 善哉意 | 善慧地 | 善慧地 | 善慧地 | 善慧地 |\n| 十地 法云 | Dharmameghā | 法雨 | 法雲地 | 法雲地 | 法雲地 | 法雲地 |\n\n> T285 的十地名单见其卷首「初菩薩住名曰悅豫…第十菩薩住名曰法雨」；它用「十住／道地」语汇，不用标准「十地」名。\n<!--GEN:end:bhumi-->\n\n> **名异不等于内容异**：T285 的「暉曜」对应「焰慧」，「目見」对应「現前」，「玄妙」对应「遠行」，「善哉意」对应「善慧」，「法雨」对应「法雲」。这是**译语层差异**，不是内容差异；但若要证明「同一地」，仍需梵本或逐段对读，不能只凭名称对应。T285 用「十住」而非「十地」，也提醒我们：早期汉译的「地」与「住」语汇尚未固定。\n\n### 5.7 入法界：五十三参的计数\n\n「五十三参」有 50／52／53／110 诸说。差异不在「善财走了几步」，而在**计数边界**：文殊指授、弥勒、文殊遥指、普贤摄归是否入参；善财本人是否计入；「善知识」与「参访点」是否同一。\n\n本仓 `rufajie_53_dataset.json` 采用 **53 卡**口径（L.327 重排）：53 次参访、**49 位具名**、52 个文本跨度、合计 **237,214 CJK**，角色分布 23 类；交互行历见 `huayan-rufajie-journey.html`。\n\n> **本文判断**：本文不在正文中强行统一 50／52／53／110；采用「53 卡」作为本仓检索口径，并在图与页上标出计数边界。凡引用「五十三参」，应同时说明「以卡计、以善知识计、还是以参访点计」，否则数字不可比。\n\n---\n\n## 六、梵藏层：全经已佚，单品犹存\n\n### 6.1 梵本四部\n\n<!--GEN:start:fig_sanskrit-->\n<svg viewBox=\"0 0 780 270\" width=\"100%\" role=\"img\" aria-labelledby=\"t\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:780px;margin:1.2rem auto;display:block\"><title>图11　梵本存佚</title><desc>全经梵本已佚，仅四部单品存世</desc><rect width=\"780\" height=\"270\" fill=\"#fbf8f1\" rx=\"8\"/><text x=\"40\" y=\"30\" font-size=\"14\" fill=\"#2b2b2b\" text-anchor=\"start\" font-weight=\"bold\" font-family=\"'Noto Serif SC','Songti SC',serif\">梵本存佚：全经佚，四部单品存</text><rect x=\"60\" y=\"70\" width=\"150\" height=\"90\" rx=\"4\" fill=\"#fff\" stroke=\"#4f6f52\" stroke-width=\"1.4\" opacity=\"1\"/><text x=\"135\" y=\"100\" font-size=\"11\" fill=\"#4f6f52\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"'Noto Serif SC','Songti SC',serif\">Daśabhūmika</text><text x=\"135\" y=\"120\" font-size=\"11\" fill=\"#2b2b2b\" text-anchor=\"middle\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">十地</text><text x=\"135\" y=\"148\" font-size=\"12\" fill=\"#4f6f52\" text-anchor=\"middle\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">存</text><rect x=\"235\" y=\"70\" width=\"150\" height=\"90\" rx=\"4\" fill=\"#fff\" stroke=\"#4f6f52\" stroke-width=\"1.4\" opacity=\"1\"/><text x=\"310\" y=\"100\" font-size=\"11\" fill=\"#4f6f52\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"'Noto Serif SC','Songti SC',serif\">Gaṇḍavyūha</text><text x=\"310\" y=\"120\" font-size=\"11\" fill=\"#2b2b2b\" text-anchor=\"middle\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">入法界</text><text x=\"310\" y=\"148\" font-size=\"12\" fill=\"#4f6f52\" text-anchor=\"middle\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">存</text><rect x=\"410\" y=\"70\" width=\"150\" height=\"90\" rx=\"4\" fill=\"#fff\" stroke=\"#4f6f52\" stroke-width=\"1.4\" opacity=\"1\"/><text x=\"485\" y=\"100\" font-size=\"11\" fill=\"#4f6f52\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"'Noto Serif SC','Songti SC',serif\">Bhadracaryā</text><text x=\"485\" y=\"120\" font-size=\"11\" fill=\"#2b2b2b\" text-anchor=\"middle\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">行愿</text><text x=\"485\" y=\"148\" font-size=\"12\" fill=\"#4f6f52\" text-anchor=\"middle\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">存</text><rect x=\"585\" y=\"70\" width=\"150\" height=\"90\" rx=\"4\" fill=\"#fff\" stroke=\"#4f6f52\" stroke-width=\"1.4\" opacity=\"1\"/><text x=\"660\" y=\"100\" font-size=\"11\" fill=\"#4f6f52\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"'Noto Serif SC','Songti SC',serif\">Anantabuddha...</text><text x=\"660\" y=\"120\" font-size=\"11\" fill=\"#2b2b2b\" text-anchor=\"middle\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">寿量</text><text x=\"660\" y=\"148\" font-size=\"12\" fill=\"#4f6f52\" text-anchor=\"middle\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">存</text><rect x=\"60\" y=\"190\" width=\"660\" height=\"46\" rx=\"4\" fill=\"#f3e6d8\" stroke=\"#b03a2e\" stroke-width=\"1\" opacity=\"1\"/><text x=\"390\" y=\"218\" font-size=\"12\" fill=\"#b03a2e\" text-anchor=\"middle\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">其余全经：梵本无存 · 仅存汉藏译本与中亚残片</text></svg>\n<!--GEN:end:fig_sanskrit-->\n\n| 梵本 | 对应汉品 | 存世形态 | 校订本 | 级 |\n|---|---|---|---|---|\n| Daśabhūmika | 品 26 十地 | 完整 | Rahder（1926 散文）、Rahder & Susa（1931 偈颂）、Kondo、Vaidya、Vajracharya | A |\n| Gaṇḍavyūha | 品 39 入法界 | 完整 | 最早完整写本 Hodgson 2(A)，1166 年，289 叶，尼泊尔 | A/B |\n| Bhadracaryāpraṇidhāna | 品 36 末／T293 卷 40 | 完整 | 多种 | A |\n| Anantabuddhakṣetraguṇodbhāvana | 品 31 寿量 | 新发现 | 待核 | B |\n\n> **表注**：四部的「存」是**单品存**，不是「全经存」。全经梵本无存，仅存中亚残片；这一点决定了华严三语对读只能以「单品」为锚，不能以「全经」为锚。Gaṇḍavyūha 的「1166 年、289 叶」是种子报告所引，本文未核写本，标 `B`。\n\n### 6.2 甘珠尔：Toh 44 与独立单品\n\n藏文甘珠尔中的《华严》主体是 `Toh 44`（Phal chen），四函（德格 035–038），45 章、115 包。除此之外，还有若干**独立入藏**的眷属经：\n\n| Toh | 对应 | 形态 | 级 |\n|---|---|---|---|\n| 104、268 | 寿量 | 单品 | B |\n| 145、847 | Ratnolkādhāraṇī（段落见于藏 17、20） | 单品 | B |\n| 185、187 | 佛不思议法的近似异译 | 单品 | B |\n| 201 | 信力入印法门 | 单品 | B |\n| 1095 | Bhadracarī 单行 | 单品 | A/B |\n\n> **本文判断**：`Toh 44` 是「经群」，不是「一部经」；独立单品是它的「卫星」。把 Toh 44 当作单一文本，会漏掉这些卫星；把卫星当作「异译」，又会高估它们与大本的同一性。正确的读法是：**大本是主坐标，单品是平行 witness，二者不互相取代。**\n\n### 6.3 丹珠尔：注释与论释\n\n| Toh | 内容 | 与汉藏的关系 | 级 |\n|---|---|---|---|\n| 3861 | 《入中论》 | 月称引十地 | B |\n| 3965 | Gocarapariśuddha 纲要 | 净行品（藏 16）的印度论书引用 | B |\n| 3993 | 世亲《十地经论》 | 与 T1522 对应 | A/B |\n| 3998 | Sūryasiddha《十地经论疏》 | 十地注释 | B |\n| 3999 | 《十地经》序分释 | 十地注释 | B |\n\n> **级别**：3993 与 T1522 的对应，可由题名与作者（世亲）互证（`A/B`）；3998、3999 的具体内容，本文未读藏文，标 `B`〔待核〕。\n\n### 6.4 藏文独有二章\n\n藏 11「如来华严品」（`Toh 44-11`）与藏 32「普贤宣说品」（`Toh 44-32`），是汉文大本所无的两章。\n\n**藏 11**：位于藏 10（＝汉品 6 毗卢遮那）之后、藏 12（＝汉品 7 如来名号）之前，正当第一会与第二会之交。据 84000，汉译诸本皆无此品；其品「无说法、唯放光」，述毗卢遮那如来掌中世界海〔待核〕。本文判断：以法义归第一会末，因第一会为「举果劝乐生信分」，此品正是「无说唯光」的果德展示；但「会归属」是义理判断，不是文本证据。\n\n**藏 32**：位于藏 31（＝汉品 26 十地）之后、藏 33（＝汉品 27 十定）之前。汉文大本无此品，但有单行异译 `T10n0298`《大方广普贤所说经》〔待核〕。本文判断：以法义归第六会末（十地之后、十定之前）；若以「普贤行分」为第七会总纲，也可读为第七会之首。**两说并存，本文不强断。**\n\n> **方法提示**：藏文独有章的「会归属」，是典型的 `C` 级判断：它有文本位置（A）、有 84000 的章目（A）、有义理结构（B），但「应归哪一会」没有原文依据。凡此类判断，必须写明「本文判断」，不能写成「事实」。\n\n### 6.5 藏译年代：三种说法并存\n\n- 约 800–836（84000）\n- 815–836（另一说）\n- 九世纪末（英文维基，转引）\n\n> **本文处理**：取 84000 的「约 800–836」，标〔存疑〕。三种说法的差异不在「几十年」，而在「以哪一位赞普的纪年为锚」；在没有藏文题记原件的情况下，不应强行统一。此条列入§十四未决问题。\n\n### 6.6 梵藏层的缺口\n\n本文能做的：章号、章数、包数、函号、四部梵本的存佚、Toh 编号的题录。\n本文不能做的：梵藏全文的逐段对读、藏文注释的义理判断、梵本写本的直接核验。\n\n> **诚实结论**：梵藏层在本文中是「结构层 A、内容层 B/C」。任何「梵藏汉三语逐段对应」的结论，都必须以具体的对读表为证据；本文没有这样的表，故不写。\n\n---\n\n### 6.7 藏译 45 章一览（可查表）\n\n下表把 45 章、德格函／起始叶、汉品对应、当前对齐状态并置。对应律：藏 1–4 = 品 1–4；藏 5–9 = 品 5；藏 10 = 品 6；藏 11／32 = 汉无；藏 12–31 = 品 7–26；藏 33–45 = 品 27–39。\n\n此律已由德格四卷**逐章尾题回验**（`✓`）：藏 31 尾题作 `ས་བཅུའི་ལེའུ་སྟེ་སུམ་ཅུ་གཅིག་པའོ`（十地章·第三十一），藏 32 作 `ཀུན་ཏུ་བཟང་པོས་བསྟན་པའི་ལེའུ`（普贤所说章），藏 10 作 `རྣམ་པར་སྣང་མཛད་ཀྱི་ལེའུ`（毗卢遮那章），藏 33 作 `ཏིང་ངེ་འཛིན་བཅུའི་ལེའུ`（十定章）。故「章号↔品号」为 `A`；「状态」列标的是**逐章内容**是否已对读，仍为〔待核〕——两者不是一回事。\n\n<!--GEN:start:tib45-->\n| 藏章 | 函 | 起始叶 | 汉品 | 状态 |\n|---:|---|---|---|---|\n| 1 | 035 | 1b.1 | 品1 世主妙嚴品 | 待核 |\n| 2 | 035 | 65a.2 | 品2 如來現相品 | 待核 |\n| 3 | 035 | 83b.6 | 品3 普賢三昧品 | 待核 |\n| 4 | 035 | 88b.4 | 品4 世界成就品 | 待核 |\n| 5 | 035 | 102a.5 | 品5 華藏世界品 | 待核 |\n| 6 | 035 | 103b.7 | 品5 華藏世界品 | 待核 |\n| 7 | 035 | 104b.6 | 品5 華藏世界品 | 待核 |\n| 8 | 035 | 105b.5 | 品5 華藏世界品 | 待核 |\n| 9 | 035 | 112a.4 | 品5 華藏世界品 | 待核 |\n| 10 | 035 | 145b.4 | 品6 毗盧遮那品 | 待核 |\n| 11 | 035 | 156b.4 | 汉无 | 待核 |\n| 12 | 035 | 175b.3 | 品7 如來名號品 | 待核 |\n| 13 | 035 | 184b.1 | 品8 四聖諦品 | 待核 |\n| 14 | 035 | 191a.7 | 品9 光明覺品 | 待核 |\n| 15 | 035 | 203b.2 | 品10 菩薩問明品 | 待核 |\n| 16 | 035 | 210b.2 | 品11 淨行品 | 待核 |\n| 17 | 035 | 219b.6 | 品12 賢首品 | 待核 |\n| 18 | 035 | 238a.6 | 品13 昇須彌山頂品 | 待核 |\n| 19 | 035 | 240a.1 | 品14 須彌山頂上偈讚品 | 待核 |\n| 20 | 035 | 245a.1 | 品15 十住品 | 待核 |\n| 21 | 035 | 258a.7 | 品16 梵行品 | 待核 |\n| 22 | 035 | 261a.3 | 品17 初發心功德品 | 待核 |\n| 23 | 035 | 285a.4 | 品18 明法品 | 待核 |\n| 24 | 035 | 297b.3 | 品19 昇夜摩天宮品 | 待核 |\n| 25 | 035 | 299b.6 | 品20 夜摩宮中偈讚品 | 待核 |\n| 26 | 035 | 305a.5 | 品21 十行品 | 待核 |\n| 27 | 035 | 333b.2 | 品22 十無盡藏品 | 待核 |\n| 28 | 035 | 347b.4 | 品23 昇兜率天宮品 | 待核 |\n| 29 | 035 | 368b.7 | 品24 兜率宮中偈讚品 | 待核 |\n| 30 | 035 | 375b.7 | 品25 十迴向品 | 待核 |\n| 31 | 036 | 166a.5 | 品26 十地品 | 待核 |\n| 32 | 036 | 283a.7 | 汉无 | 待核 |\n| 33 | 036 | 289b.7 | 品27 十定品 | 待核 |\n| 34 | 036 | 356b.3 | 品28 十通品 | 待核 |\n| 35 | 036 | 368a.2 | 品29 十忍品 | 待核 |\n| 36 | 036 | 384b.2 | 品30 阿僧祇品 | 待核 |\n| 37 | 036 | 393b.6 | 品31 壽量品 | 待核 |\n| 38 | 036 | 394b.5 | 品32 諸菩薩住處品 | 待核 |\n| 39 | 037 | 1b.1 | 品33 佛不思議法品 | 待核 |\n| 40 | 037 | 41b.3 | 品34 如來十身相海品 | 待核 |\n| 41 | 037 | 56a.6 | 品35 隨好光明功德品 | 待核 |\n| 42 | 037 | 63a.4 | 品36 普賢行品 | 待核 |\n| 43 | 037 | 75a.4 | 品37 如來出現品 | 待核 |\n| 44 | 037 | 141b.6 | 品38 離世間品 | 待核 |\n| 45 | 037 | 274b.7 | 品39 入法界品 | 待核 |\n<!--GEN:end:tib45-->\n\n> 状态「待核」来自本地 TOC 的 `alignment_status`；内容级对应仍需逐章对读。藏 5–9 为一品拆五章，故 45 = 39 + 4（华藏）+ 2（独有）。\n\n---\n\n## 七、阿含与般若：重合的性质\n\n### 7.1 方法与结果（种子 `B`，本文未复验）\n\n种子报告的第一步，把 T279、T278 与阿含五部、般若五部比对：先找连续相同的字串（12 字以上），再用窗口相似度找用词相近的段落，最后人工判断属于清单、套语还是真平行。\n\n其结果（`B`，本文未复跑）：\n\n- 以 T279 为源的精确匹配 **974 条**，其中 **859 条（88%）** 在 T278 里也有对应。\n- 最长的精确匹配只有 **37 字**（诸天序列）。\n- T279 全文 588,727 字里，去掉重复定型句后，被阿含覆盖 **238 字（0.04%）**，被般若覆盖 **701 字（0.12%）**。\n- 窗口相似度达到阈值的只有 **44 个**。\n\n> **为什么本文不标 A**：仓库没有 T1、T99、T223 等阿含／般若原典；无法复跑，也无法核验「974 条」的切分与阈值。按本文§0.3，不能复验者只能标 `B`。这不是否定种子，而是**把可复验性写进结论**。\n\n### 7.2 三种「像平行」的东西\n\n| 类型 | 定义 | 例 | 判定 |\n|---|---|---|---|\n| 真平行 | 同一教说，在不同文本中有对应段落 | 待梵巴藏确认；汉文层暂未发现 | 需三语证据 |\n| 共享清单 | 只有清单条目相同（名目、次序） | 六波罗蜜、三十七道品、四禅、八部众 | 本文判为「共享」 |\n| 套语 | 定型句、叙事套语 | 「一时佛在……」、「诸天序列」 | 本文判为「套语」 |\n\n**重合的性质**：几乎全是共享的教义清单和定型套语，主要是六波罗蜜、菩萨摩诃萨定型句、四沙门果、三十七道品、诸天序列、八部众、四禅、叙事套语。`T223` 的匹配最多，很大一部分来自罗什系译语的共用。\n\n> **关键区分**：共享清单说明「同一佛教语汇库」，不说明「文本依赖」。两个文本都用「四禅」的名目，不等于一个抄了另一个；要证明依赖，需要**次序、措辞、上下文**三者同时相近，且排除共同来源。\n\n### 7.3 十地中的清单借用（种子 `B`）\n\n| 地 | 借用的清单 | 对应文本 |\n|---|---|---|\n| 第三地 | 四禅；他心智 | T1、T99；T223 |\n| 第四地 | 四念处、四正勤、七觉分、八正道 | T99；T223 |\n| 第六地 | 十二缘起 | T26 |\n| 第九地 | 四无碍智 | T223 |\n\n其他：十无尽藏品（五蕴集灭道、十四无记、诸天序列）与 T99、T223 相应；净行品（蕴界处缘起善巧、六度、七觉分）与 T99、T223 相应；初发心功德品（四沙门果）与 T125、T1、T99、T223 相应。\n\n> **本文判断**：十地的「修行内容」借用阿含—般若共同的清单，并按地的次第安排。这一条是「计算结果＋内容判断」，不是独立证据；仅汉文，要靠梵巴文确认哪些是真平行。种子的 18 个种子位置，正是 P1 的起点。\n\n### 7.4 为什么「共享清单」重要，却不等于「华严抄自阿含」\n\n- **共享清单是佛教的「共同语汇」**：四禅、八正道、三十七道品，不是某一部经的专利。\n- **华严的独创在「组合」**：十地把这些清单按「地」重组，形成「地—度—清单」的三层结构；这是华严的编纂工作，不是阿含的原文。\n- **若要证明「借用」**：需要比较「清单的次序、插入位置、上下文衔接」，并排除「共同来源」。本文没有做这一步，故只登记「共享」，不写「借用」。\n\n> **本文判断**：把「共享清单」写成「华严借用阿含」，是华严研究里最常见的过度解释。本文的写法是：**先写「共享」，再写「可能的借用」，最后写「需要什么证据才能证明借用」。**\n\n---\n\n## 八、注疏中的大藏\n\n### 8.1 四部注疏\n\n<!--GEN:start:fig_citations-->\n<svg viewBox=\"0 0 700 260\" width=\"100%\" role=\"img\" aria-labelledby=\"t\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:700px;margin:1.2rem auto;display:block\"><title>图12　注疏引文量级</title><desc>四部注疏书名号引用量与被引最多的五部</desc><rect width=\"700\" height=\"260\" fill=\"#fbf8f1\" rx=\"8\"/><text x=\"40\" y=\"28\" font-size=\"14\" fill=\"#2b2b2b\" text-anchor=\"start\" font-weight=\"bold\" font-family=\"'Noto Serif SC','Songti SC',serif\">四部注疏的书名号引用（种子报告·B）</text><text x=\"40\" y=\"64\" font-size=\"11\" fill=\"#2b2b2b\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">智俨·搜玄记</text><rect x=\"180\" y=\"50\" width=\"9.145083658033464\" height=\"16\" rx=\"4\" fill=\"#2f5d7c\" stroke=\"none\" stroke-width=\"1\" opacity=\"0.85\"/><text x=\"195.14508365803346\" y=\"64\" font-size=\"10\" fill=\"#666666\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">95</text><text x=\"40\" y=\"98\" font-size=\"11\" fill=\"#2b2b2b\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">法藏·探玄记</text><rect x=\"180\" y=\"84\" width=\"152.09718083887233\" height=\"16\" rx=\"4\" fill=\"#2f5d7c\" stroke=\"none\" stroke-width=\"1\" opacity=\"0.85\"/><text x=\"338.0971808388723\" y=\"98\" font-size=\"10\" fill=\"#666666\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">1,580</text><text x=\"40\" y=\"132\" font-size=\"11\" fill=\"#2b2b2b\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">澄观·疏</text><rect x=\"180\" y=\"118\" width=\"160.4721521888609\" height=\"16\" rx=\"4\" fill=\"#2f5d7c\" stroke=\"none\" stroke-width=\"1\" opacity=\"0.85\"/><text x=\"346.4721521888609\" y=\"132\" font-size=\"10\" fill=\"#666666\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">1,667</text><text x=\"40\" y=\"166\" font-size=\"11\" fill=\"#2b2b2b\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">澄观·钞</text><rect x=\"180\" y=\"152\" width=\"420.0\" height=\"16\" rx=\"4\" fill=\"#2f5d7c\" stroke=\"none\" stroke-width=\"1\" opacity=\"0.85\"/><text x=\"606.0\" y=\"166\" font-size=\"10\" fill=\"#666666\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">4,363</text><text x=\"40\" y=\"220\" font-size=\"10\" fill=\"#666666\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">被引最多（次）：瑜伽 669 · 涅槃 585 · 大智度 538 · 成唯识 507 · 摄论 371</text><text x=\"40\" y=\"240\" font-size=\"10\" fill=\"#b03a2e\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">合计 7,705 次，已映射 87%。配套 CSV 未入仓，本图仅为种子数据复述，不冒充复算。</text></svg>\n<!--GEN:end:fig_citations-->\n\n| 注疏 | 作者 | 卷 | 书名号引用（种子 `B`） | 已映射 |\n|---|---|---:|---:|---:|\n| T1732《搜玄记》 | 智俨 | 5 | 95 | — |\n| T1733《探玄记》 | 法藏 | 20 | 1,580 | — |\n| T1735《华严经疏》 | 澄观 | 60 | 1,667 | — |\n| T1736《随疏演义钞》 | 澄观 | 90 | 4,363 | — |\n| 合计 | — | — | **7,705** | **6,701（87%）** |\n\n> **技术事实（本次实测 `✓`）**：仓库中的四部注疏文本是 OCR／EPUB 提取本，**书名号已被剥离**（每部文本中 `《》` 仅 1 次）。因此本文**无法**复算 7,705 这一数字；它不是「引文数」，而是「种子在其文本版本上抽出的书名号数」。这一点必须在引用时声明，否则读者会误以为本文复算过。\n\n### 8.2 引用谱：以论为主\n\n被引最多（种子 `B`）：《瑜伽师地论》669、《大般涅槃经》585、《大智度论》538、《成唯识论》507、《摄大乘论》371。\n\n部类的演变（种子 `B`）：\n\n| 部类 | 智俨 | 法藏 | 澄观《疏》 | 澄观《钞》 |\n|---|---:|---:|---:|---:|\n| 瑜伽部 | 24–31% | 24–31% | 24–31% | 24–31% |\n| 释经论部 | 33% | 17% | 11% | 8% |\n| 经集部 | 2% | 10–11% | 10–11% | 10–11% |\n| 涅槃部 | 4% | 8–9% | 8–9% | 8–9% |\n| 般若部 | 2% | 6% | 6% | 6% |\n| 毗昙部 | 2% | 5–6% | 5–6% | 5–6% |\n\n> **读法**：瑜伽部始终最大，说明华严宗人的「大藏」以**论**为主，不是以「经」为主；释经论部从智俨到澄观持续下降，说明注疏的重心从「论释」转向「经疏」；经集部、涅槃部、般若部上升，说明澄观的引用面更宽。阿含明引只有 **49 次（0.6%）**，与第一步的「共享清单」结论一致。\n\n### 8.3 七个具体发现\n\n1. **《十地经论》被引**：智俨 22 次、法藏 90 次、澄观《疏》15 次、《钞》22 次；法藏解十地品时引它 58 次，澄观解十地品的前五位著作里不含它。`B`\n2. **十地品是注疏的重心**：在《探玄记》占 29.5%，在《清凉疏》占 25.9%。`B`\n3. **澄观以《菩萨璎珞本业经》(T1485) 解三贤位**：十住品 4 次、十行品 13 次、十回向品 12 次；法藏全书只引 17 次。`B`\n4. **别生经很少被明引**：只有《度世品经》(T292) 是例外，澄观《疏》引 14 次，其中 13 次在离世间品；《兜沙经》(T280) 法藏 5 次、澄观《疏》1 次。`B`\n5. **性起品的引文对应**：澄观《疏》如来出现品前列是涅槃 15、维摩 6、法华 6、摄论 6；《宝性论》只有 1 次。`B`（此条修正了上一版「性起＝宝性论」的隐含对应）\n6. **入法界的密教接口**：《疏》入法界品 4 次引《毗卢遮那经》(T848)，《钞》3 次；《演义钞》引外典 192 次，引慧苑《刊定记》84 次、法藏《探玄记》9 次。`B`\n7. **未映射的 1,004 条引用**：别名表未覆盖，或没有书名号；它是「引文索引」的下限，不是全集。`B`\n\n### 8.4 注疏层的边界\n\n注疏引文能回答「古人怎么把华严接到大藏」，但不能回答「华严原本怎么对应大藏」。前者是**解释史**，后者是**文本史**。本文把二者分开：§二–§六是文本史，§八–§十是解释史。\n\n> **本文判断**：注疏引文的最大价值，不是「统计数字」，而是「引文的**选择性**」。澄观引《璎珞》而不引《十地经论》，引《涅槃》而不引《宝性论》，这些「不引」比「引」更能说明华严宗的义学立场。\n\n---\n\n### 8.5 注疏「名称提及」实测（代理指标）\n\n仓库中的四部注疏是 OCR／EPUB 提取本，书名号被剥离，故 §8.1 的 7,705 条无法复算。为了给种子数字一个**独立代理**，本文直接统计四部文本中关键名称的字符串提及次数（含简称，如「瑜伽」「涅槃」）。\n\n<!--GEN:start:mentions-->\n| 名称 | 匹配串 | T1732 | T1733 | T1735 | T1736 | 合计 |\n|---|---|---:|---:|---:|---:|---:|\n| 瑜伽論 | 瑜伽論/瑜伽師地 | 0 | 9 | 6 | 27 | 42 |\n| 涅槃經 | 涅槃經 | 3 | 35 | 10 | 62 | 110 |\n| 智度論 | 智度論 | 0 | 4 | 9 | 20 | 33 |\n| 成唯識論 | 成唯識論/唯識論 | 0 | 44 | 6 | 75 | 125 |\n| 攝大乘論 | 攝大乘論/攝論 | 21 | 125 | 83 | 143 | 372 |\n| 瓔珞經 | 瓔珞 | 6 | 13 | 32 | 41 | 92 |\n| 寶性論 | 寶性論 | 0 | 10 | 7 | 6 | 23 |\n\n> 这是**名称提及**的字符串匹配，不是书名号引文计数；用于观察四部注疏的相对关注面，不能替代 §8.1 的种子 7,705 条。\n<!--GEN:end:mentions-->\n\n> **读法**：这是「名称提及」，不是「书名号引文」。它只能看**相对关注面**（例如澄观《演义钞》对涅槃、瑜伽的提及最多），不能替代 7,705 条，也不能单独证明「引用」。但它至少把「种子的 B」与「本文可复算的字符串」分开，读者能看见差距在哪里。\n\n---\n\n## 九、教判与阶位\n\n### 9.1 五教判\n\n| 教 | 所对 | 经证 | 级 |\n|---|---|---|---|\n| 小乘教 | 阿含 | T1、T99 等 | B |\n| 始教 | 般若、解深密 | T220–261；T676 | B |\n| 终教 | 楞伽、胜鬘 | T670、T671；T353 | B |\n| 顿教 | 维摩 | T475 | B |\n| 圆教 | 华严 | T279 | B |\n\n> **级别**：五教判的「所对」是宗义系统的判摄，不是文本对应。它由杜顺、法藏一系成立，种子据 Rulu 转述；本文未与杜顺、法藏原典逐条核对，故标 `B`。读者若把它当作「华严与诸经的文本对应」，就会犯「以判教代目录」的错误。\n\n### 9.2 同教一乘与别教一乘\n\n智俨把《法华》的「三车归一乘」与 T1485 的「一乘」判为**同教一乘**，把《华严》判为**别教一乘**。这不是「华严比法华高」的价值判断，而是「教相」的结构判断：同教是「随他意」的一乘，别教是「随自意」的一乘。\n\n> **本文判断**：判教层的「对应」，是**规范性**的，不是**描述性**的。它告诉我们「华严宗人如何安置诸经」，不告诉我们「诸经文本如何相同」。两者不可混。\n\n### 9.3 五十二位与 T1485\n\n中国佛教据《菩萨璎珞本业经》(T1485)、《仁王护国经》、《梵网经》，立「五十二位」。在华严经中，十住、十行、十回向、十地是**各品分说**，没有把它们组合成一系列位阶；是**注疏**把它们串起来。\n\n- 澄观以 T1485 解三贤位：十住品 4 次、十行品 13 次、十回向品 12 次（种子 `B`）。\n- 法藏全书只引 T1485 17 次（种子 `B`）。\n\n> **本文判断**：T1485 是「阶位体系」的对应，不是「华严经文」的对应。它属于第四层（义理层），不是第二层（别生经）。把 T1485 列入「华严部别生经」，是分类错误。\n\n### 9.4 判教对位图（文字版）\n\n```\n阿含 ── 小乘教\n般若 / 解深密 ── 始教\n楞伽 / 胜鬘 ── 终教\n维摩 ── 顿教\n华严 ── 圆教（别教一乘）\n法华 / 璎珞 ── 同教一乘\n```\n\n> **读法**：这张图是「宗义地图」，不是「文本地图」。它的箭头是「判摄」，不是「引用」。若要与§四的十二簇并读，应把「判教」当作**解释框架**，把「十二簇」当作**文本坐标**；两者交叉，才是「华严宗人眼中的大藏」。\n\n---\n\n## 十、先例与影响\n\n### 10.1 毗卢遮那：梵网 → 华严 → 大日\n\n- 《梵网经》(T1484) 把毗卢遮那立为「十亿释迦之源」，是华严「释迦为毗卢遮那化现」说的**先例**。`A`\n- 《华严》的毗卢遮那，后来成为《大日经》(T848、Toh 494) 与真言宗的中心佛。`A/B`\n- 《梵网经》从未译成藏文；这一点使「梵网—华严—大日」的链条在汉传成立，在藏传缺环。`A`\n\n> **本文判断**：这是「先例与影响」的典型：梵网是「先例」，华严是「转折」，大日是「后继」。三者不是「同本异译」，而是「同一佛格在不同经典系统中的展开」。把三者列入「同经异本」，是层级错误。\n\n### 10.2 十地 → 十度 → 诸经论\n\n十地品首次出现**十波罗蜜**，把般若系的六度、七地十三住，扩成「十度十地」。十地又影响：\n\n- 《解深密经》\n- 《宝云经》\n- 《大乘密严经》\n- 《三昧王经》\n- 《法集经》\n- 龙树《宝行王正论》\n- 月称《入中论》\n\n> **级别**：以上影响链为种子 `A`（据文献与引文）；本文未逐条核对，标 `A/B`。其中「十地首次出现十度」是文本事实（`A`，可核 T279 品 26）；「影响诸经」是义理与文献判断（`B`）。\n\n### 10.3 大数名表：Gaṇḍavyūha 与阿僧祇品\n\nGaṇḍavyūha 梵本第 10、15 章与阿僧祇品（藏 36）共用同一份**大数名表**。`A`\n\n> **意义**：这是「共享清单」在「数目名」层面的例子。它说明华严的「大数」不是某一品的独创，而是经群共享的「数学语汇」。但「共用名表」不等于「同一文本」；它只能证明「同一语汇库」，不能证明「同一作者」。\n\n### 10.4 影响链的四种类型\n\n| 类型 | 例 | 证据 | 级 |\n|---|---|---|---|\n| 先例 | 梵网 → 华严（毗卢遮那） | 佛格、术语 | A/B |\n| 扩展 | 般若六度 → 华严十度 | 文本结构 | A |\n| 引用 | 入中论 → 十地 | 引文 | B |\n| 共享 | 大数名表 | 名表 | A |\n\n> **本文判断**：四种类型不可混为「影响」。先例是「之前有」，扩展是「之后变」，引用是「文中引」，共享是「共用」。只有「引用」能直接证明「读过」；其余三种都需要额外的历史证据。\n\n---\n\n## 十一、向整部大藏外推\n\n### 11.1 二十八部类矩阵\n\n<!--GEN:start:fig_matrix-->\n<svg viewBox=\"0 0 900 598\" width=\"100%\" role=\"img\" aria-labelledby=\"t\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:900px;margin:1.2rem auto;display:block\"><title>图13　部类关系深度</title><desc>二十八部类与华严的关系深度</desc><rect width=\"900\" height=\"598\" fill=\"#fbf8f1\" rx=\"8\"/><text x=\"30\" y=\"26\" font-size=\"14\" fill=\"#2b2b2b\" text-anchor=\"start\" font-weight=\"bold\" font-family=\"'Noto Serif SC','Songti SC',serif\">二十八部类 × 关系深度</text><text x=\"30\" y=\"54\" font-size=\"9\" fill=\"#666666\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">1–151</text><text x=\"110\" y=\"54\" font-size=\"9\" fill=\"#2b2b2b\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">Āgama Dīrgha Madhyama Saṃyukta Eko</text><rect x=\"330\" y=\"42\" width=\"120\" height=\"13\" rx=\"4\" fill=\"#a87900\" stroke=\"none\" stroke-width=\"1\" opacity=\"0.85\"/><text x=\"640\" y=\"54\" font-size=\"9\" fill=\"#a87900\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">义理</text><text x=\"30\" y=\"73\" font-size=\"9\" fill=\"#666666\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">152–219</text><text x=\"110\" y=\"73\" font-size=\"9\" fill=\"#2b2b2b\" text-anchor=\"start\" font-weight=\"normal\" font-family=\"'Noto Serif SC','Songti SC',serif\">Jātaka</text><rect x=\"330\" y=\"61\" width=\"60\" height=\"13\" rx=\"4\" fill=\"#b08a6a\" stroke=\"none\" stroke-width=\"1\" opacity=\"0.85\"/><text x=\"640\" y=\ 、事汇部。\n\n> **表注**：`section_ranges` 的 28 个区间由英文维基 `Template:Chinese Buddhist Canon` 解析（`✓`），含 supplements（2185–2700、2701–2731、2732–2864、2865–2920）。「深度」一栏是种子§3.8的判断（`B`），本文只把它结构化，不冒充复算。\n\n### 11.4 矩阵的读法\n\n1. **覆盖不等于重要**：一个部类「未做」，不代表它与华严无关；只代表本文没有检测。\n2. **「核实」不等于「文本比对」**：题录可核，只说明「这部经存在、题名对」，不说明「内容对应」。\n3. **「引文」不等于「影响」**：注疏引了某经，说明「注疏家读过」，不说明「该经影响了华严」。\n4. **「义理」不等于「文本」**：判教把某经判为「始教」，是宗义安排，不是文本对应。\n\n> **本文判断**：部类矩阵的价值，不在于「填满」，而在于**把「不知道」标出来**。一张诚实的「未做」表，比一张把「线索」写成「已核」的表，更有用。\n\n> **再往外推**：部类矩阵止于汉传大藏。若推到道教、儒家、南传、梵文与类书，须先立判据——见 §十七（三种关系、五层载体、15 行登记册、判定卡）。\n\n---\n\n## 十二、证据质量与复验结果\n\n### 12.1 复验台账\n\n<!--GEN:start:claims-->\n| id | 主张 | 值 | 判定 |\n|---|---|---|---|\n| V01 | T279 八十华严 39 品 / 80 卷 | {'pins': 39, 'juan': 80} | verified |\n| V02 | T278 六十华严 34 品 / 60 卷 | {'pins': 34, 'juan': 60} | verified |\n| V03 | 六十阙十品（种子/矩阵） | 十明品=十通品；仅十定品无对应 | corrected |\n| V04 | Toh 44 为 45 章，十地为第 31 章 | {'chapters': 45, 'ten_bhumi_chapter': 31} | verified |\n| V05 | 华严部 T278–T309 共 32 部 | {'count': 32, 'fetched': 30} | verified |\n| V06 | T280–T309 题录（题名/卷数/译者） | {'cbmeta_ok': 30, 'catalog_match': 16, 'catalog_missing': 14, 'catalog_mismatch': 0} | verified |\n| V07 | 七处九会（八十） | ['(七會)  普光明殿', '(三會) 忉利天宮', '(九會)  逝多林 重閣講堂', '(二會) 普光明殿', '(五會) 兜率天宮', '(八會)  普光明殿', '(六會) 他化自在天宮', | verified |\n| V08 | 部类 T 号区间（26 部） | {'ranges_found': 28} | verified |\n| V09 | 梵本仅存四部 | Daśabhūmika; Gaṇḍavyūha; Bhadracaryāpraṇidhāna; Anantabuddhakṣetraguṇodbhāvana | B |\n| V10 | 种子配套图数据（231 节点/402 边/7705 引文） | not in repository | unverifiable |\n| V11 | T300/T301 与八十品33 的字面对应 | {'T300': 0, 'T301': 4, 'T300_T301': 86} | corrected |\n| V12 | T298 对应藏 32 普贤宣说品 | Chapter 32: The Teaching of Samantabhadra | B |\n| V13 | T281 品3 题名『十地品』与内容/校注的错位 | {'pins': ['2 願行品', '3 十地品'], 'vs_pin15': 0, 'vs_pin26': 0} | corrected |\n| V14 | T309 非十住品别译 | {'vs_pin15': 0} | verified |\n<!--GEN:end:claims-->\n\n> **读法**：`verified` = 本次由一手文本或结构化目录复算；`corrected` = 本次复算推翻旧说；`B` = 二手来源、种子数据或据已核事实推算；`unverifiable` = 材料不在仓或方法不可用。台账不是「结论清单」，而是「证据状态清单」。\n\n### 12.2 十项关键结论的稳健性\n\n| 结论 | 依据 | 级 | 什么情况下会被推翻 |\n|---|---|---|---|\n| 华严部 32 部的题名、译者、卷数 | CBETA XML 逐部解析 | A | CBETA 修订题录（可能性低） |\n| 六十↔八十的品序对应 | CBETA 品标记＋中文维基结构表 | A | CBETA 品标记有误（低） |\n| 别生经与品的对应 | Taishō `docNumber` 校注 | A | 校注自身有误（低至中） |\n| 藏译章号的对齐 | 本地 TOC＋84000 章数 | B | 其他藏文版本章序不同，或 84000 更新（中） |\n| 十地五译的亲缘 | 种子的字面对齐 | A/B | 换切段或相似度度量会改数值，但「两簇一离群」结构稳（中至低） |\n| T1522 引文最近 T286 | 种子的字面覆盖统计 | B | 论中经文与论释分开统计后可能变化（中） |\n| 华严与阿含、般若在汉文层主要是清单级重合 | 种子第一步 | B | 梵巴层面可能发现更多真平行（高） |\n| 注疏引文的分布与演变 | 种子第三步 | B | 无书名号引文加入、别名误差（中） |\n| 性起品引文在涅槃与摄论、不在《宝性论》 | 种子第三步 | B | 补入无书名号引文后可能变化（中） |\n| 五教判对位 | Rulu 转述 | B | 与杜顺、法藏原典核对后（中） |\n| 梵网为先例、大日为后继 | 84000 导言 | A/B | 低 |\n\n### 12.3 已知偏差\n\n1. **汉文中心**：第一、二步只比汉文，对独立译本的平行会系统性漏检。\n2. **书名号偏差**：第三步依赖 CBETA 加的书名号，各部注疏的标点工作量不均，引用数是下限。\n3. **单一二手来源**：Rulu 的译者序只作旁证；与一手冲突处以一手为准。\n4. **阈值与切段是经验取值**：对数值的细节要谨慎，对结构性结论更可信。\n5. **年代与生卒年**：杜顺、智俨、法藏、澄观、宗密的生卒年用通行说，属 `C`。\n6. **「要义」与内容归类**：各品一句话概括、第一步的清单归类，属 `B` 或 `C`。\n\n### 12.4 本次复验的四类结果\n\n**`✓` 复算一致（A）**：\n\n- T279：39 品／80 卷；T278：34 品／60 卷。\n- Toh 44：45 章；84000：十地为第 31 章。\n- Toh 44 逐章尾题回验：藏 31 = `ས་བཅུའི་ལེའུ`（十地）、藏 10 = `རྣམ་པར་སྣང་མཛད`（毗卢遮那）、藏 11／32 汉无；章号↔品号由尾题锁定，不由算术推出。\n- T280–T309：30/30 题录解析成功。\n- 六十↔八十：39/39、34/34，无解析冲突。\n- 部类区间：28 个（含 supplements）。\n\n**`△` 复算但口径变化**：\n\n- T279 全文 CJK：613,191（本文）／597,477（矩阵）／588,727（种子）。\n- T279 品 39：190,609（本文）／170,107（矩阵）／174,902（种子）。\n- 原因见§0.4；本文不强行统一。\n\n**`×` 复算推翻旧说**：\n\n- 「六十阙十品」→「六十阙一品（十定）；十明＝十通」。\n- 「T279 译者＝武则天」→「武则天是序的作者；译者是实叉难陀」。\n- 「部类 26」→「28 个区间（含 supplements）；26 是主部类数」。\n- 「T300/T301＝品 33 别译」→「二者互为异译（86 个 12 字共享），与品 33 仅 0／4」。\n- 「T281 品 3＝十地」→「内容起忉利天（十住处），品题却作『十地品』；校注挂 279(15)」。\n\n**`○` 未能复验**：\n\n- 231 节点／402 边（种子图谱）。\n- 974 条阿含／般若匹配、7,705 次注疏引用（种子 CSV）。\n- 梵本写本、藏文全文、巴利平行。\n- 注疏书名号引文（仓库文本已剥离书名号）。\n\n### 12.5 与种子「知识图谱 v2.1」的关系\n\n种子报告称其图谱有 **231 个节点、402 条边**，节点 A 级 82%、边 A 级 54%。本文**没有**复算这张图，因为配套文件不在仓。本文做的是另一件事：**把图谱的「文本层」重新钉在一手 XML 上**，得到 32 部、39 行、28 区间、14 条台账。\n\n> **本文判断**：图谱的价值在「关系」，本文的价值在「坐标」。二者不 应对 |\n|---|---|---|\n| DharmaNexus 不可用或覆盖不足 | P1 受阻 | 改用 84000 汉藏对照＋梵本校订本人工对读；缩小范围 |\n| 梵巴藏阅读能力不足 | 判定质量下降 | 请专家协助；把范围限定在汉藏层 |\n| 汉译独立译出导致漏检 | 平行被低估 | 以梵本或藏本为枢纽，而不是汉汉直比 |\n| 别名映射误差 | 引文统计失真 | 抽检；补未映射项；保留候选而不强指具体译本 |\n| 把共享清单误作文本依赖 | 结论过度 | 每条平行必须标明类型：真平行、共享清单、套语 |\n| 数据库更新或变更 | 编号、章序变化 | 记录检索日期与版本；定期复查 |\n| 工作量超出预期 | 周期延长 | 按优先级裁剪：先十地、入法界，再其余 |\n\n### 15.5 如果资源有限，只做三件事\n\n1. **P0**（关闭低成本的未决项）。\n2. **P1**（梵巴藏平行确认），它决定第一步的结论能不能站住。\n3. **P2 中的十地与入法界两簇**，它们覆盖了对应最密、篇幅最大的部分。\n\n---\n\n## 十六、数据层与复现\n\n### 16.1 本批新增\n\n| 文件 | 内容 | 生成方式 |\n|---|---|---|\n| `scripts/verify_dazang_mapping.py` | 核验管线：CBETA XML、维基、84000、目录 | 手写 |\n| `data/research/dazang_mapping_verification.json` | 14 条台账、30 部题录、39 行对照、28 区间 | 脚本生成 |\n| `scripts/build_dazang_graph.py` | 关系图构建与三视图渲染（148 节点／289 边） | 手写 |\n| `scripts/build_dazang_enrichment.py` | 四十华严／十地名／藏45章／注疏提及 数据 | 手写 |\n| `data/research/dazang_enrichment.json` | 16 批 92 窗、10 地、45 章、7 组名称提及 | 脚本生成 |\n| `data/research/huayan_dazang_graph.json` | 类型化多重图：9 类节点、12 类边 | 脚本生成 |\n| `data/research/canon_registry.json` | §17.3 跨典藏登记册：15 行载体记录＋A/B/C 判级与红线 | 手写 |\n| `web/demo/src/dazang_graph_inline.js` | 挂载到文章内的交互渲染器（Canvas；分层／力导向／引用；无外部依赖） | 手写 |\n| `scripts/build_dazang_article.py` | 表格与 13 幅 SVG 的注入器 | 手写 |\n| `data/references/cbeta/T10n0281–0309.xml` | 29 部新增一手文本（T280 原已有） | 脚本抓取并落盘 |\n| `docs/草稿/大藏经对应研究_核验报告.md` | 人类可读核验报告 | 脚本生成 |\n\n### 16.2 复现命令\n\n```bash\npython scripts/verify_dazang_mapping.py          # 生成核验 JSON + 报告\npython scripts/build_dazang_enrichment.py        # 生成 40/十地/45章/注疏 数据\npython scripts/build_dazang_graph.py             # 生成关系图 JSON（148/289）\npython scripts/build_dazang_article.py           # 注入表格与 13 幅 SVG\n```\n\n- 若网络不可用，脚本会使用 `data/references/cbeta/` 的本地 XML；维基／84000 部分会失败，需 `--refresh` 重试。\n- 所有抓取页均记录 URL 与访问日期（2026-11-09）；`--refresh` 会更新缓存。\n\n### 16.3 数据层与文章的关系\n\n文章中的 **11 张表**与 **13 幅图**，除三处显式标注「种子」的图（图 10 的相似度、图 12 的引文量、图 13 的深度）外，全部由 JSON 注入。改 JSON，重跑注入器，文章的数字会同步变化；这是「文章—数据」不脱节的唯一办法。\n\n> **本文判断**：一篇文章若不能由数据重跑，它的数字迟早会与数据脱节。本文把「可重跑」写进结构，而不是写进承诺。\n\n---\n\n## 十七、全球典藏对照：载体、谱系、类型、论衡\n\n§十一 把方法外推到「整部大藏」。但大藏只是汉传佛教的一个载体。若再往外推——道教的三洞四辅、儒家的十三经与四库、南传的巴利三藏、藏传的甘珠尔与丹珠尔、梵文写本，乃至东亚与东南亚的各地藏经——最先要回答的不是「还有多少相似的书」，而是**凭什么说两部书有关系**。\n\n本章不增加对应结论，只做三件事：立判据、建登记册、留反例。\n\n### 17.1 三种关系，三个等级\n\n| 关系 | 问法 | 需要的证据 | 越界的说法 |\n|---|---|---|---|\n| **谱系**（genealogy） | 谁译谁、谁引谁、谁抄谁 | 同文段落、译者题记、注疏引用、目录著录 | 无同文段落而称「同源」 |\n| **类型**（typology） | 结构是否同构、语汇是否共享、体裁是否同类 | 概念对位表（逐项对照） | 由同构推「借用」 |\n| **论衡**（polemic） | 当时人如何互相指认 | 论衡文本本身 | 把「敌方叙述」当作「文本事实」 |\n\n等级随之定：`A` 有一手文本且逐字回源；`B` 有一手文本但只部分回源，或仅有可靠二手题录且已注明；`C` 无任何见证，只能做载体层与类型层，凡涉关系的句子一律标〔未取一手文本〕。\n\n> 一句话：**相似不是证据，见证才是证据。**\n\n### 17.2 五个可做层（L1–L5）\n\n> 此处的 L1–L5 是**证据类型**的分层，与图 1 的「对应五层」（同经异本→版本检索）不是同一套：图 1 问「对应什么」，这里问「凭什么能说」。\n\n| 层 | 回答什么 | 需要什么 | 本仓现状 |\n|---|---|---|---|\n| L1 载体 | 属哪一藏、如何编号、存佚 | 目录学 | 可做（17.3 即此层） |\n| L2 谱系 | 译本、引用、注疏、仪轨借用 | 具体 witness | 仅华严部、`Toh 44`、`T52` 二书 |\n| L3 类型 | 共享语汇、同构阶位、同体裁 | 逐项对位表 | 可做，但须标「可比」 |\n| L4 论衡 | 护教／判教中的互相指认 | 论衡文本 | `T52` 二书 |\n| L5 基础设施 | 数字化目录与全文库 | — | CBETA 本地可用；其余未接 |\n\n**哪层需要 witness**：只有 L2 与 L4 必须。L1、L3、L5 可以无 witness 完成——所以「做了几层」不等于「证据多强」。一篇讲「世界修行典籍」的文章若只有 L1 与 L3，它的正确写法是**登记册**，不是谱系图。\n\n### 17.3 典藏登记册\n\n<!--GEN:start:canon_registry-->\n| 域 | 典藏 | 形制 | 编排 | 本仓见证 | 可做层 | 级 |\n|---|---|---|---|---|---|---|\n| 汉传佛教 | 大正新脩大藏經（CBETA 電子佛典） | 鉛印 100 冊；CBETA 為其數位化 | T 編號（如 T10n0279），經號＋卷次＋頁欄行 | 59 部 XML（華嚴部 T278–T309 為主，另 T52n2102／T52n2103 等） | L1／L2／L3／L4／L5 | A |\n| 汉传佛教 | 新纂卍續藏 | 鉛印 90 冊；CBETA 部分收錄 | X 編號 | 無 | L1 | C |\n| 汉传佛教 | 高麗大藏經（再雕本） | 木刻 81,258 版 | 函／卷，另有一套千字文帙號 | 無 | L1 | C |\n| 汉传佛教 | 房山石經 | 石刻，遼金兩代續刻 | 洞／經幢，無統一經號 | 無 | L1 | C |\n| 藏传佛教 | 德格版甘珠爾 | 木刻，函（volume）／葉（folio） | Toh 編號（此藏以 Tohoku 目錄通行） | Toh 44《華嚴》全 45 章（data/references/tibetan/derge_kangyur/avatamsaka/） | L1／L2／L5 | A |\n| 藏传佛教 | 德格版丹珠爾 | 木刻，函／葉 | Toh 編號 | 無 | L1 | C |\n| 藏传佛教 | 北京版／那塘版甘珠爾 | 木刻 | 各版編號互異，須先做版本對照表 | 無 | L1 | C |\n| 南传佛教 | 巴利三藏及覺音注疏 | 貝葉／緬甸、泰、斯里蘭卡寫本；PTS 校訂本；第六結集版 | 律／經／論三分，經分五部（長、中、相應、增支、小部） | 無 | L1／L3 | C |\n| 南传佛教 | 漢譯四阿含（T1／T2） | 大正藏第 1–2 冊 | T 編號，經號連續 | 無（本倉僅收華嚴部） | L1／L3 | C |\n| 道教 | 正統道藏＋萬曆續道藏 | 明刻本；涵芬樓影印；三家本 | 三洞四輔十二類，千字文帙號 | 無 | L1／L3／L4 | C |\n| 道教 | 敦煌道經寫本 | 唐寫本殘卷 | 散藏於英、法、俄、中諸家，編號各異 | 無 | L1 | C |\n| 儒家 | 十三經注疏 | 刻本／排印本 | 經＋注＋疏三層 | 無 | L1／L3／L4 | C |\n| 儒家 | 四庫全書 | 清寫本 3,000 餘種；影印本 | 經／史／子／集四部 | 無 | L1 | C |\n| 类书 | 永樂大典 | 明寫本，存世僅殘卷 | 洪武正韻韻目編排 | 無 | L1 | C |\n| 梵文·印度 | 《華嚴》梵本單品寫本（尼泊爾、中亞） | 貝葉／紙寫本 | 無統一編號，依藏地與目錄著錄 | 無（僅二手題錄：十地、入法界、普賢行願、壽量四種） | L1／L3 | B |\n\n其中多层登记项只表示「该层在方法上可做」，不表示已做。逐条备注见 `data/research/canon_registry.json`。\n<!--GEN:end:canon_registry-->\n\n登记册共 15 行。三件事须先说清：\n\n1. **`A` 级只有三处**：汉传华严部（59 部 XML）、德格 `Toh 44`（45 章全文）、`T52n2102`／`T52n2103`（论衡二书）。除此之外的任何「对应」，在本仓都还只是框架。\n2. **最大的两个空白是《丹珠尔》与《卍续藏》**：前者藏印度论师对《华严》的注释，后者藏华严宗自己的注疏。二者都不是「多收几部书」，而是「换一批提问者」。\n3. **梵文一行的 `B` 只指题录**：四部单品（十地、入法界、普贤行愿、寿量）的存佚可核，写本未见；逐字对读仍是 `C`。\n\n### 17.4 已实测的三组\n\n**（1）汉传华严部。** T278–T309 共 32 部，题录 30/30 由 CBETA XML 复算（§三）；三大本品数为 34／39／1（单品全本）。\n\n**（2）藏传 `Toh 44`。** 45 章；v1.2 已按德格逐章尾题把「章号↔汉品」全部归位（§6.7），45/45 通过。\n\n**（3）论衡二书。** `T52n2102`《弘明集》14 卷、实测 183,355 字；`T52n2103`《广弘明集》30 卷、488,673 字。关键词出现次数：\n\n| 词 | 弘明集 | 广弘明集 |\n|---|---:|---:|\n| 華嚴 | 0 | 2 |\n| 道經 | 12 | 34 |\n| 老子 | 56 | 167 |\n| 化胡 | 1 | 28 |\n| 二教 | 12 | 43 |\n| 笑道 | 0 | 20 |\n| 三洞 | 1 | 10 |\n\n计数口径：全文 CJK 字符（U+3400–9FFF，含题名与校注文字）；关键词为字符串出现次数，含子串包含（如「老子」亦计入「老子化胡」），故只作量级参考，不作论证。\n\n读法：两书的火力集中在老子、化胡、二教、笑道、三洞——这是**佛教徒如何叙述道教**的一手材料（L4），不是佛道文本同源的证据。\n\n### 17.5 反例：共享语汇不等于依赖\n\n- **「華嚴」在《广弘明集》两见，皆非引用**：一为「襄州峴山華嚴寺盧舍那瑞像」，是寺名；一为梁武帝注《般若》序中「迺出華嚴之品」，是经名连称。只做关键词匹配，会得出「广弘明集引用华严」的假结论。\n- **阶位同构**：十地、十住与道教阶次、瑜伽行地可以逐项对位，这是 L3；对位成功不构成 L2。\n- **存世率不是引用率**：《永乐大典》存世仅残卷，未见引用不可推「未曾引用」。\n\n反例写进正文而不入脚注，是因为它们决定方法能不能外推——推得越远，越容易把「像」当成「是」。\n\n### 17.6 判定卡\n\n四条，按序问：\n\n1. 我有 witness 吗？无 → `C`，句中标〔未取一手文本〕。\n2. 我说的是谱系还是类型？说不清 → 只能写类型。\n3. 第三方（目录、题录、校注）支持到哪一步？支持不到 → 退一级。\n4. 结论句越层了吗？（拿 L1 的证据写 L2 的结论，即越层。）\n\n门禁把其中可机器判的三条落成断言（`scripts/verify_dazang_article.py`）：登记册行数与 JSON 一致、无一手文本的行不得标 `A`、无任何见证的行不得标 `B`、§十七 必含红线句。\n\n### 17.7 未竟\n\n- 《丹珠尔》《卍续藏》未取，印度与汉地注疏两条线仍空。\n- 巴利三藏、梵文写本、道藏、四库、永乐均无一手文本；域可列，关系不可断。\n- 下一步优先级：先补《丹珠尔》中华严相关论典的题录（L1→L2 的跳板），再谈巴利与道藏的逐项对位。\n\n---\n\n## 十八、附录\n\n### 18.1 记号与术语\n\n- **别生经**：从《华严》中单独流通的某品或某部分的汉译。\n- **眷属经**：与华严有关但未必是某品别译的经。\n- **簇**：同一内容在各本中的一组对应。\n- **真平行**：同一教说，在不同文本中有对应段落。\n- **共享清单**：只有清单条目相同（如七觉分名目）。\n- **套语**：定型句。\n- **证据级别**：A（两个以上独立来源，或一手题录与原文可核）、B（单一来源、二手转述，或据已核事实推算）、C（线索，待核）。\n- **〔待核〕**＝C；**〔存疑〕**＝来源互相矛盾。\n\n### 18.2 来源（访问日期 2026-11-09）\n\n| 来源 | 用途 | URL／路径 |\n|---|---|---|\n| CBETA TEI `T10n0279` | 八十华严底本 | `data/references/cbeta/T10n0279.xml`；https://cbetaonline.dila.edu.tw/zh/T10n0279 |\n| CBETA TEI `T09n0278` | 六十华严底本 | `data/references/cbeta/T09n0278.xml` |\n| CBETA GitHub `xml-p5` | T280–T309 一手 XML | https://github.com/cbeta-org/xml-p5 |\n| 84000 `Toh 44-31` | 藏译十地章号、章数 | https://read.84000.co/translation/toh44-31.html |\n| 中文维基《華嚴經》 | 七处九会、60/80 对照、别行本 | https://zh.wikipedia.org/wiki/華嚴經 |\n| 英文维基 *Buddhāvataṃsaka Sūtra* | 四部梵本、译本史 | https://en.wikipedia.org/wiki/Buddhāvataṃsaka_Sūtra |\n| 英文维基 *Ten Stages Sutra* | 十地、T1522、84000 链接 | https://en.wikipedia.org/wiki/Ten_Stages_Sutra |\n| 本地德格目录 | 45 章、115 包、四函 | `data/alignment/tibetan-derge-toc.json` |\n| 本地华严目录 | 32 部题录（16 部有译者） | `data/catalog/complete_catalog.yaml` |\n\n> **来源分级**：CBETA XML 与 84000 为 A；维基为 B（二手，但结构清晰、可点开回源）；本地目录为 A/B（其 296–309 缺译者，本文以 CBETA byline 补足）。\n\n### 18.3 完备度声明\n\n本文覆盖：\n\n- **版本**：4 本＋梵本四部；章数演化；七处九会；藏译对齐；四十华严 16 批 92 窗。\n- **部类**：T278–T309 全 32 部；题名、译者、卷数、品数、CJK、互见。\n- **品级**：39 行 60↔80 对照；12 簇；17 部别生经；12 部眷属经。\n- **十地**：5 译；体量；两簇一离群；2 部论；藏注；十地名五译对照。\n- **梵藏**：4 部梵本；甘珠尔／丹珠尔；藏文独有二章；藏译 45 章可查表。\n- **解释**：阿含／般若（B）；注疏引文（B）；注疏名称提及（本文实测代理）；教判；影响；部类矩阵。\n- **关系**：148 节点／289 边；三层静态视图（分层拓扑、簇网络、引用网络）；0 悬空边。\n- **交互**：内嵌 Canvas 图；分层／力导向／引用三模式；图层与边型过滤、搜索、缩放拖拽、节点详情。\n- **证据**：14 条台账；20 条勘误；18 项未决；P0–P5 规划。\n- **外推**：§十七 三种关系（谱系／类型／论衡）、五层载体模型、15 行跨典藏登记册、判定卡；`A` 级见证 3 处，其余标 `B`／`C`。\n\n本文**不**覆盖：\n\n- 梵藏汉三语的逐段对读（无对读表）。\n- 阿含／般若的复跑（无原典）。\n- 注疏引文的复算（书名号被剥离）。\n- 巴利藏、图像与实物、朝鲜／日本撰述的系统梳理。\n\n> **一句话**：本文是一张「可回源 // 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
