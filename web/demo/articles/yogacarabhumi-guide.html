<script>
var ARTICLE = {"id": "yogacarabhumi-guide", "file": "articles/yogacarabhumi-guide.html", "title": "瑜伽师地论导读与重点阐释", "title_sub": "百卷五分 · 十七地 · 三乘因果的读法（中英对照）", "icon": "🧭", "version": "", "meta": "", "doc": "docs/宗派研究/瑜伽师地论导读与重点阐释.md", "doc_md": "# 瑜伽师地论导读与重点阐释\n\n## ——百卷五分、十七地、三乘因果的读法\n\n> **编者按（体例与信源）**：本文以本仓 `docs/草稿/瑜伽师地论导读研读.md`（约 6 万字／11.8 万字节的文献学草稿）为起点，重写为一部论的完整导读：草稿的版本考据与研读书目予以保留并回源订正，另补草稿未及者——**十七地中段之实测**、**重点章之逐字经证**、**义理脉络之阐释**。**结构实测**：五分卷界、十七地名目与卷次，悉由 CBETA 底本 `T30n1579`（《大正藏》第 30 册 No. 1579，玄奘译，一百卷）逐卷解析而得，非转述；原卷内夹注的科判标记（如「1章」「2節」）为底本所有，引用时照录。**引文回源**：经论引文逐字核对 CBETA 电子佛典（cbeta-org/xml-p5，访问日期 2026-11-19），繁体照原字形；转述标〔大意〕，未及逐字核对者标〔待核〕，本文自判标〔本文判断〕。**中英文对照**：中文为主文，各节附「英译对读」块（意群对齐，非逐字直译），可点页顶 🌐 切换。**受众·语域**：有佛学基础的读者与研究者；学术随笔体；静态站屏读。\n\n## 引言｜为什么读这部论\n\n《瑜伽师地论》一百卷，是汉传佛教篇幅最大的论书，也是唯识学真正的根本论典。它不像《成唯识论》那样以严密的因明论证见长，也不像《大乘起信论》那样以一心二门的纲要示人。它的体例是**百科式的**：从眼识如何生起，到菩萨如何发心，到声闻如何入定，到佛陀如何说法，到《杂阿含经》如何结集——三乘的境、行、果被安立为「十七地」，逐地展开。\n\n读这部论，最大的困难不在文义艰深，而在**规模**。百卷之中，名相层出、法数稠密，若从第一卷起逐字硬读，极易在《意地》的胎相、〈有寻有伺地〉的诸天、〈闻所成地〉的五明处之间迷失主线。所以真正需要的不是毅力，而是**地图**：先知道全书怎么分、十七地各管什么、哪几卷是义理枢纽、哪些是可以后置的广说。本文即是这样一张地图，外加几处重点的细读。\n\n有三件事值得在开卷前记住。**其一，此论是「论」不是「经」**：它把散在《阿含》中的修行经验与大乘经的唯识义理，组织成可教、可学、可修的次第。**其二，此论有「层」**：〈本地分〉（卷 1–50）与〈摄抉择分〉（卷 51–80）不是同一时期的同一手笔，前者近于早期瑜伽师的实修传承，后者是对前者的系统抉择与理论提升——阿赖耶识从「散见」到「八证」，就是最清楚的例子。**其三，此论有「根」**：它的后半部（〈摄事分〉卷 85–100）回到《杂阿含经》的摩呾理迦，提醒读者：瑜伽行派再宏阔，其根仍在早期佛教的止观与圣教。\n\n先给一句总判：**这是一部可以「按图施工」的论——先读结构，再读枢纽，最后回向广说；先立止观，再入唯识，最后归于二空。** 下面的十二节，即按此序展开。\n\n> **英译对读 · 引言**\n>\n> The *Yogācārabhūmi* — \"The Stages of the Yoga Practitioners\" — is the longest treatise in the Chinese Buddhist canon (one hundred fascicles) and the root text of East Asian Yogācāra. It is neither a polemical masterpiece like the *Cheng Weishi Lun* nor a compact summary like the *Awakening of Faith*; it is encyclopedic. From how eye-consciousness arises, to how a bodhisattva arouses the mind, to how a śrāvaka enters absorption, to how the Buddha teaches, to how the *Saṃyukta Āgama* was compiled — the three vehicles' ground, path and fruit are arranged as **seventeen stages** and unfolded one by one.\n>\n> The difficulty is not obscurity but **scale**. A hundred fascicles of dense lists and technical terms will swallow a linear reader. What is needed is a **map**: how the book divides, what each stage governs, which fascicles are doctrinal hinges, and which are extended exposition that can wait. Three things to hold from the start. First, this is a **treatise**, not a scripture: it organizes the meditative experience preserved in the Āgamas and the Yogācāra doctrine of the Mahāyāna sūtras into a teachable, practicable sequence. Second, the text has **layers**: the Basic Section (fasc. 1–50) and the Viniścaya Section (fasc. 51–80) are not one hand at one time; the former preserves early yogic practice, the latter systematically re-decides and theorizes it. Third, the text has **roots**: its closing Section on Matters (fasc. 85–100) returns to the *mātṛkā* of the *Saṃyukta Āgama* — however vast Yogācāra became, it grew from early Buddhist contemplation and scripture.\n>\n> One summary judgment: **read by structure, then by hinge, then by exposition; establish calm abiding, then enter consciousness-only, then return to the two emptinesses.** The twelve sections below follow that order.\n\n## 一、题解与体例：「瑜伽师地」何义\n\n论题四字，字字有据。**「瑜伽」**（yoga）汉译「相应」，指止观与实相相应、心境契合的修持；**「瑜伽师」**即修瑜伽行的人；**「地」**（bhūmi）不是「土地」，而是「所依」与「能生住持」——依此法义起修，能生、能持三乘圣道，故名为「地」。十七地即瑜伽师所历的十七重境次。\n\n这一读法有印度古注为据。《瑜伽师地论释》（T30n1580，最胜子等造，玄奘译）释云：\n\n> 「瑜伽師，平等智等行在一切無戲論界、無住涅槃瑜伽中故，是彼所攝，故名為地。或十七地，攝屬一切瑜伽師故，如國王地。是故說名瑜伽師地。問答決擇諸法性相，故名為論。」\n\n同论又解释了一个体例上的疑问：全书五分，为何独称「瑜伽师地」？答案是「就初立名」：\n\n> 「此論既有如是五分，何故但名瑜伽師地？就初立名，故無有失。又一切法無不皆是瑜伽師地，以瑜伽師用一切法為依緣故。此中存略，且說十七。又十七地，具攝一切文義略盡。後之四分，皆為解釋十七地中諸要文義。」\n\n「就初立名」四字，是读全书的钥匙：**后四分不是另起炉灶，而是对前分十七地的抉择、解释、名相整理与事义结集**。所以读法上应当「以初分为体，以后四分为用」——先立十七地的骨架，再用后四分去充实它。这也解释了为什么《摄抉择分》要花八卷抉择〈菩萨地〉：它不是在讲新东西，而是在把〈本地分〉里「深隐」的义理显了化。\n\n> **英译对读 · 第一节**\n>\n> Each of the four characters is grounded. *Yoga* is rendered \"correspondence\" — the practitioner's contemplation corresponding to reality; a *yogācāra* is one who cultivates it; *bhūmi* is not \"land\" but \"support\" and \"that which generates and sustains\" — relied upon, this teaching generates and maintains the three vehicles' noble path. The seventeen stages are the seventeen levels a yogācāra traverses. The Indian commentary (*Yogācārabhūmi-śāstra*, T30n1580) defines it: \"The yogācāra, because his conduct of equality-wisdom and so forth abides in the yoga of the utterly non-conceptual and of non-abiding nirvāṇa, is included by it, hence 'stage'; or the seventeen stages belong to all yogācāras, like a king's land. Therefore it is named *Yogācārabhūmi*. Question and answer deciding the nature and marks of dharmas — hence 'treatise'.\" The same commentary answers why, of five sections, only the first gives the title: \"**naming by the first**\" (就初立名) — the later four sections only explain the essentials of the seventeen stages. That is the key to reading: **the first section is the body, the last four are its use.**\n\n## 二、作者、文本分层与三语版本\n\n**汉译题「弥勒菩萨说」，藏译与梵本校刊多署无著**——这个差异不是笔误，而是本论成书史的直接投影。汉传史传的叙述是：无著菩萨上升兜率，请弥勒降临，由弥勒诵出《十七地经》（即〈本地分〉的骨干），无著在弥勒开许下记录，并依其义撰成〈摄抉择分〉等后分。藏文《丹珠尔》的题署与近代校刊的梵本标题，则多直接归之于无著（Ācārya Asaṅga）。两种传统并不必然冲突：它们共同指向一个**「先有根本诵传、后经论师辑录编纂」的多阶段成书过程**。〔大意〕\n\n现代学界把这一过程说得更细。Lambert Schmithausen 以阿赖耶识等概念在不同篇章的演进差异为线索，系统提出本论存在**文本分层**（textual stratification）：〈本地分〉较早，〈摄抉择分〉较晚且大量援引《解深密经》以建构唯识学理。Florin Deleanu 以〈声闻地〉的梵藏汉三语对勘修正并细化了这一图谱；Ulrich Timme Kragh 与 Martin Delhey 又从写本群组与跨地域流传史推进；宇井伯寿《瑜伽论研究》与横山纮一关于弥勒著作的考辨，则奠定了日本学界的基础。〔大意〕\n\nSchmithausen 的分层以两个标尺定相对年代：是否论及阿赖耶识、是否预设《解深密经》。其三层说可概括为：**第一层**——本地分中的声闻地、菩萨地与摄事分，不提阿赖耶识；**第二层**——本地分其余部分，零星提及阿赖耶识而不涉《解深密经》；**第三层**——摄决择分，详论阿赖耶识并以《解深密经》为前提。〔大意〕对此亦有异议：Yamabe 主张阿赖耶识更直接源于禅修经验——尤其身心相关的「粗重」（dauṣṭhulya）与「轻安」（praśrabdhi）问题——并就 Schmithausen 2014 年专著再作商榷。起点之争的另一端是 Delhey 的观察：早期瑜伽行者清楚自己的创新，并采取多种策略为之辩护，其一是设法赋予本论准经典的地位。〔大意〕还有一个容易被忽略的纵深：Kritzer 指出「瑜伽师地」原是比无著更早的文类名——僧伽罗刹（Saṃgharakṣa）已有同名论，汉译《修行道地经》即其所出；Kragh 的英译书名即取 *The Foundation for Yoga Practitioners*，把 bhūmi 读作瑜伽行者须掌握的「知识与修学领域」。〔大意〕\n\n这一层学术史对读经不是可有可无的装饰。它至少校正两种误读。**其一，不要把「分层」读成「拼凑」**：八证与三自性不是外贴上去的补丁，而是对〈本地分〉实修传统中「深隐」义理的系统显了化——用本论自己的话说，是「抉择」。**其二，不要把「弥勒说」读成「神话」或「伪托」**：它标记的是传承的源头与权威，而非现代意义上的著作权。教义地位与文献史结论，应当分开陈述。〔本文判断〕\n\n版本方面，本论横跨梵、藏、汉三系。梵文写本于 1938 年由 Rahūla Sāṅkṛtyāyana 在西藏摄得缩微胶卷；此后 Rahder（〈菩萨地〉）、荻原云来、Bhattacharya、Dutt、Shukla（〈声闻地〉）、Delhey（〈三摩呬多地〉〈非三摩呬多地〉）等相继校刊，但**全帙校本是迄今未有的**，通读仍须依赖汉译百卷与藏译互勘〔大意〕。存佚的大势是：〈本地分〉大部尚存梵本——前五地有 Bhattacharya 1957 校本；三摩呬多地有 Delhey 2009 校本；声闻地唯存一部 Sāṅkṛtyāyana 自萨迦寺摄回的孤本（Shukla 1973 校）；菩萨地以剑桥本 Add.1702（八–九世纪）与 Dutt 1966 本为要；**其余各分梵本几乎不存**——阿赖耶识论所在的摄决择分部分，只有汉、藏译。〔大意〕藏译收于《丹珠尔》唯识部（sems tsam），由 Prajñāvarman、Jinamitra、Surendrabodhi 与智军（Ye shes sde）等约九世纪译出〔大意〕。德格版的分帙与汉译卷次对应如下：4035＝卷 1–20（五识身至修所成）；4036＝卷 21–34（声闻、独觉）；4037＝卷 35–50（菩萨、有余依、无余依）；4038＝卷 51–80（摄决择）；4039＝卷 85–98（摄事·契经事）；4040＝卷 99–100（调伏、本母）；4041＝卷 83–84（摄异门）；4042＝卷 81–82（摄释）。**注意两点**：藏译五分次第为本地、决择、摄事、异门、摄释，与汉译不同；藏译〈摄事分〉分为「八事」。〔大意〕汉译前史则是一串节译本：北凉昙无谶《菩萨地持经》（T30n1581）、刘宋求那跋摩《菩萨善戒经》（T30n1582）译〈菩萨地〉，梁真谛《决定藏论》（T30n1584）译〈摄抉择分〉中〈五识身相应地〉〈意地〉要义。至唐玄奘奉诏全译一百卷（T30n1579），五分全貌始备；卷 61 论王法政教的部分，玄奘又别出单行本《王法正理论》（T30n1615）。〔大意〕\n\n译期有两说：Lusthaus 年表作 646 年 7 月至 648 年 6 月，先后在弘福寺与大慈恩寺；另有记为 647 年 5 月始、648 年 5 月毕者。传说玄奘西行的关键动机之一，正是相信取回完整的《瑜伽论》能化解中土的义理争端——真谛此前仅有节译。〔大意〕另有一部常被忽略的提要书：无著《显扬圣教论》（T30n1602，二十卷十一品），无著把因明、十六异论与阿赖耶识证成等内容又编入其中，可作本论的结构对照本。〔大意〕\n\n一个值得注意的文献现象：早期汉地曾把《菩萨地持经》《菩萨善戒经》等**论典节译本当作「经」来受持**〔大意〕。这提示我们：〈菩萨地〉在成为「论」的一部分之前，曾以独立经典的身份流通——它的分量与独立性，远在其他诸地之上。\n\n> **英译对读 · 第二节**\n>\n> The Chinese title reads \"spoken by Maitreya\"; Tibetan and Sanskrit editions mostly attribute the work to Asaṅga. The discrepancy is not an error but a trace of the text's formation: the tradition tells of Maitreya reciting the *Seventeen Stages*, with Asaṅga recording and then composing the later sections; Tibetan and Sanskrit attributions point directly to Asaṅga. Both point to a **multi-stage formation** — an early recitational core, later edited and expanded by a treatise master.\n>\n> Modern scholarship sharpens this. Schmithausen, tracing the doctrinal evolution of *ālayavijñāna* across sections, established the **stratification** thesis: the Basic Section is earlier; the Viniścaya Section is later and draws heavily on the *Saṃdhinirmocana*. Deleanu refined the map through trilingual comparison of the *Śrāvakabhūmi*; Kragh and Delhey advanced manuscript-group and transmission-history studies; Ui Hakuju and Yokoyama Kōitsu laid the Japanese foundations. This scholarship corrects two misreadings. First, **stratification is not patchwork**: the eight proofs and the three natures are not external additions but the systematic \"deciding\" (viniścaya) of what lay implicit in the Basic Section's practice tradition. Second, **\"spoken by Maitreya\" is neither myth nor forgery**: it marks the source and authority of a lineage, not modern authorship. Doctrinal standing and philological conclusion must be stated separately.\n>\n> Textually the work spans three languages. The Sanskrit manuscript was photographed in Tibet in 1938 by Sāṅkṛtyāyana; editions followed piecemeal (Rahder, Wogihara, Bhattacharya, Dutt, Shukla, Delhey), but **no complete critical edition exists** — full reading still depends on the Chinese hundred fascicles collated with Tibetan. The Tibetan is in the *bsTan 'gyur* (sems tsam), Derge Toh 4035–4042, with an Indian commentary at Toh 4043. Before Xuanzang's complete translation (T30n1579), Chinese readers had partial translations of the Bodhisattva Stage (Dharmakṣema's *Pusa dichi jing*, T30n1581; Guṇavarman's *Pusa shanjie jing*, T30n1582) and of the Viniścaya's first two stages (Paramārtha's *Jueding zang lun*, T30n1584). A telling detail: early Chinese communities **venerated these treatises as \"sūtras\"** — the Bodhisattva Stage circulated with scriptural authority before it became a chapter of a treatise.\n\n## 三、五分百卷：结构实测\n\n以下卷界，悉由 CBETA 底本 `T30n1579` 逐卷解析而得（非依转述）：\n\n| 分 | 卷次 | 卷数 | 内容与功能 |\n|---|---|---|---|\n| 一、本地分 | =\"0.3\"/>\n<text x=\"696.52\" y=\"142\" font-size=\"9\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.5\">80</text>\n<line x1=\"854.1\" y1=\"122.0\" x2=\"854.1\" y2=\"128.0\" stroke=\"currentColor\" stroke-width=\"1\" opacity=\"0.3\"/>\n<text x=\"854.12\" y=\"142\" font-size=\"9\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.5\">100</text>\n<text x=\"866\" y=\"142\" font-size=\"9\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.45\">卷</text>\n</svg>\n<figcaption style=\"font-size:0.74em;color:var(--text2,#777);margin-top:7px;line-height:1.65\">图 1｜五分卷界：本地分 1–50（体）、摄抉择分 51–80（抉择）、摄释 81–82、摄异门 83–84、摄事 85–100（解经与圣教归位）。卷界由 T30n1579 逐卷解析。</figcaption>\n</figure>\n\n五分的梵名（学界拟构）：本地分 *Maulyo bhūmayaḥ*；摄决择分 *Viniścayasaṃgrahaṇī*；摄释分 *Vyākhyāsaṃgrahaṇī*；摄异门分 *Paryāyasaṃgrahaṇī*；摄事分 *Vastusaṃgrahaṇī*〔大意〕——「摄」（saṃgrahaṇī，结集）三字，正是后三分功能的自道。\n\n前二分是「所说」——境与理的直陈；后三分是「能说」——解经的方法与圣教的归类。这一分工不是后人的归纳，而是本论自身的结构：〈摄释分〉开篇即「云何攝釋？總嗢拕南曰：節、廣、開七門，體、釋、文、義、法、起、義、難、次、師、說眾、聽、讚佛略廣、學勝利」——先立释经的纲目；〈摄事分〉末卷则「云何名為摩怛理迦事？謂若素怛纜摩怛理迦，若毘奈耶摩怛理迦」——把经、律、论三藏各自的本母归位。\n\n有一处体例值得单独指出：〈摄抉择分〉开篇不是从〈五识身相应地〉的正文讲起，而是先设一问——「問：前說種子依，謂阿賴耶識。而未說有、有之因緣、廣分別義。何故不說？何緣知有？廣分別義云何應知？」这一问把整部后分的写作动机说尽了：**前分「说了」，但没「论证」；后分要补的正是论证**。<figure style=\"margin:16px 0 20px\">\n<svg viewBox=\"0 0 900 338\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:920px;display:block\" role=\"img\" aria-label=\"摄抉择分卷段分布图\"><defs><marker id=\"arw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#b8863c\"/></marker></defs>\n<text x=\"12\" y=\"26\" font-size=\"13.5\" fill=\"currentColor\" font-weight=\"600\">摄抉择分 51–80 · 卷段分布</text>\n<text x=\"12\" y=\"44\" font-size=\"9.6\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.55\">条长＝卷段长度；细条数字标于条右</text>\n<line x1=\"268.5\" y1=\"54.0\" x2=\"268.5\" y2=\"292.0\" stroke=\"currentColor\" stroke-width=\"1\" opacity acity=\"0.25\"/>\n<line x1=\"268.0\" y1=\"296.0\" x2=\"268.0\" y2=\"301.0\" stroke=\"currentColor\" stroke-width=\"1\" opacity=\"0.3\"/>\n<text x=\"268.0\" y=\"315\" font-size=\"9\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.5\">51</text>\n<line x1=\"444.4\" y1=\"296.0\" x2=\"444.4\" y2=\"301.0\" stroke=\"currentColor\" stroke-width=\"1\" opacity=\"0.3\"/>\n<text x=\"444.4\" y=\"315\" font-size=\"9\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.5\">60</text>\n<line x1=\"640.4\" y1=\"296.0\" x2=\"640.4\" y2=\"301.0\" stroke=\"currentColor\" stroke-width=\"1\" opacity=\"0.3\"/>\n<text x=\"640.4000000000001\" y=\"315\" font-size=\"9\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.5\">70</text>\n<line x1=\"836.4\" y1=\"296.0\" x2=\"836.4\" y2=\"301.0\" stroke=\"currentColor\" stroke-width=\"1\" opacity=\"0.3\"/>\n<text x=\"836.4000000000001\" y=\"315\" font-size=\"9\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.5\">80</text>\n<text x=\"860\" y=\"315\" font-size=\"9\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.45\">卷</text>\n</svg>\n<figcaption style=\"font-size:0.74em;color:var(--text2,#777);margin-top:7px;line-height:1.65\">图 3｜摄抉择分分段（据底本「攝決擇分中…」科判逐卷核）：58–61 三地、62–63 定学三地、64 闻、65–66 思、67 修＋声闻、68–71 声闻、72–80 菩萨、80 有余／无余依。</figcaption>\n</figure>\n\n八证即由此而出（详见 §五）。\n\n> **英译对读 · 第三节**\n>\n> The fascicle boundaries below are parsed directly from the CBETA text, not taken on report: Basic Section, fasc. 1–50; Viniścaya (Deciding) Section, 51–80; Section on Explanation, 81–82; Section on Synonyms, 83–84; Section on Matters, 85–100 (85–98 the *mātṛkā* of the *Saṃyukta Āgama*; 99 monastic matters; 100 the matrix of the treatises). The first two sections state the ground and the doctrine; the last three supply the method of interpretation and the classification of scripture. This division is the text's own: the Explanation Section opens by listing its hermeneutic heads (body, explanation, text, meaning, dharma, arising, meaning, difficulty, sequence, teacher, audience, hearing, praise, learning), and the closing fascicle defines the *mātṛkā* for sūtra, vinaya and abhidharma alike.\n>\n> One structural detail deserves notice: the Viniścaya does not begin with exposition but with a question — \"It was said that the seed-support is the ālayavijñāna, but its existence, its cause, and its full analysis were not explained. Why not? How do we know it exists? How should its analysis be known?\" That question states the motive of the entire latter half: **the first section stated; the second must prove.** The eight proofs follow from it.\n\n## 四、本地分十七地：逐地导读\n\n十七地的名目，底本自有其总说与偈颂：\n\n> 「云何瑜伽師地？謂十七地。何等十七？嗢拕南曰：五識相應、意、有尋伺等三、三摩地俱、非、有心、無心地、聞、思、修所立、如是具三乘、有依、及無依，是名十七地。」\n\n偈中「有尋伺等三」摄第 3–5 地，「三摩地俱、非、有心、無心地」摄第 6–9 地，「聞、思、修所立」摄第 10–12 地，「如是具三乘」摄第 13–15 地，「有依、及無依」摄第 16–17 地——**一首偈就是全论的目录**。长行随即逐一列名，终于「如是略說十七，名為瑜伽師地」。合偈与长行，十七地的名目与卷次实测如下（卷次据底本逐卷解析；「地」的起讫以该地标题首次出现之卷为准）：\n\n| 序 | 地 | 卷 | 主旨 | 境/行/果 |\n|---|---|---|---|---|\n| 1 | 五识身相应地 | 1 | 眼耳鼻舌身五识的自性、所依、所缘、助伴、作业 | 境 |\n| 2 | 意地 | 1–3 | 心意识；阿赖耶识；胎相、器世间、有情世间 | 境 |\n| 3–5 | 有寻有伺地·无寻唯伺地·无寻无伺地 | 4–10 | 依寻伺有无判三界诸地；缘起、诸天、有情类 | 境 |\n| 6 | 三摩呬多地 | 11–13 | 静虑、解脱、等持、等至诸相；爱味与清净之别 | 境 |\n| 7 | 非三摩呬多地 | 13 | 不入定之相（十二相） | 境 |\n| 8 | 有心地 | 13 | 心有所依而转之相 | 境 |\n| 9 | 无心地 | 13 | 无心之位（无想定、灭尽定等） | 境 |\n| 10 | 闻所成地 | 13–15 | 五明处；闻、受、读诵、忆念 | 行 |\n| 11 | 思所成地 | 16–19 | 自性清净、思择所知、思择诸法 | 行 |\n| 12 | 修所成地 | 20 | 修处所、修因缘、修瑜伽、修果（四处七支） | 行 |\n| 13 | 声闻地 | 21–34 | 四瑜伽处：种姓、趣入、出离、安立、修相 | 行 |\n| 14 | 独觉地 | 34 | 种姓、道、习、住、行五相 | 行 |\n| 15 | 菩萨地 | 35–50 | 十法四持；十三住；真实义；戒品 | 行 |\n| 16 | 有余依地 | 50 | 地施設、寂靜施設、依施設三相 | 果 |\n| 17 | 无余依地 | 50 | 地施設、寂滅施設、寂滅異門三相 | 果 |\n\n<figure style=\"margin:16px 0 20px\">\n<svg viewBox=\"0 0 900 391\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:920px;display:block\" role=\"img\" aria-label=\"本地分十七地卷次阶梯图\"><defs><marker id=\"arw\" viewBox=\"0 0 10 1 "1\"/>\n<text x=\"329.7142857142857\" y=\"190\" font-size=\"8.4\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.6\">13–15</text>\n<text x=\"98\" y=\"209.5\" font-size=\"10.4\" text-anchor=\"end\" fill=\"currentColor\" font-weight=\"400\">思所成地</text>\n<rect x=\"337.0\" y=\"200.0\" width=\"48.8\" height=\"12.0\" rx=\"3\" fill=\"rgba(184,134,60,0.20)\" stroke=\"#b8863c\" stroke-width=\"1\"/>\n<text x=\"390.7755102040816\" y=\"209\" font-size=\"8.4\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.6\">16–19</text>\n<text x=\"98\" y=\"228.5\" font-size=\"10.4\" text-anchor=\"end\" fill=\"currentColor\" font-weight=\"400\">修所成地</text>\n<rect x=\"398.0\" y=\"219.0\" width=\"3.0\" height=\"12.0\" rx=\"3\" fill=\"rgba(184,134,60,0.20)\" stroke=\"#b8863c\" stroke-width=\"1\"/>\n<text x=\"406.0408163265306\" y=\"228\" font-size=\"8.4\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.6\">20</text>\n<text x=\"98\" y=\"247.5\" font-size=\"10.4\" text-anchor=\"end\" fill=\"currentColor\" font-weight=\"400\">声闻地</text>\n<rect x=\"413.3\" y=\"238.0\" width=\"201.4\" height=\"12.0\" rx=\"3\" fill=\"rgba(184,134,60,0.20)\" stroke=\"#b8863c\" stroke-width=\"1\"/>\n<text x=\"419.3061224489796\" y=\"247\" font-size=\"8.6\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.85\">21–34</text>\n<text x=\"98\" y=\"266.5\" font-size=\"10.4\" text-anchor=\"end\" fill=\"currentColor\" font-weight=\"400\">独觉地</text>\n<rect x=\"611.8\" y=\"257.0\" width=\"3.0\" height=\"12.0\" rx=\"3\" fill=\"rgba(184,134,60,0.20)\" stroke=\"#b8863c\" stroke-width=\"1\"/>\n<text x=\"619.7551020408164\" y=\"266\" font-size=\"8.4\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.6\">34</text>\n<text x=\"98\" y=\"285.5\" font-size=\"10.4\" text-anchor=\"end\" fill=\"currentColor\" font-weight=\"400\">菩萨地</text>\n<rect x=\"627.0\" y=\"276.0\" width=\"232.0\" height=\"12.0\" rx=\"3\" fill=\"rgba(184,134,60,0.20)\" stroke=\"#b8863c\" stroke-width=\"1\"/>\n<text x=\"633.0204081632653\" y=\"285\" font-size=\"8.6\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.85\">35–50</text>\n<text x=\"98\" y=\"304.5\" font-size=\"10.4\" text-anchor=\"end\" fill=\"currentColor\" font-weight=\"400\">有余依地</text>\n<rect x=\"856.0\" y=\"295.0\" width=\"3.0\" height=\"12.0\" rx=\"3\" fill=\"rgba(164,85,63,0.18)\" stroke=\"#a4553f\" stroke-width=\"1\"/>\n<text x=\"864.0\" y=\"304\" font-size=\"8.4\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.6\">50</text>\n<text x=\"98\" y=\"323.5\" font-size=\"10.4\" text-anchor=\"end\" fill=\"currentColor\" font-weight=\"400\">无余依地</text>\n<rect x=\"856.0\" y=\"314.0\" width=\"3.0\" height=\"12.0\" rx=\"3\" fill=\"rgba(164,85,63,0.18)\" stroke=\"#a4553f\" stroke-width=\"1\"/>\n<text x=\"864.0\" y=\"323\" font-size=\"8.4\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.6\">50</text>\n<line x1=\"260.2\" y1=\"42.0\" x2=\"260.2\" y2=\"326.0\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 4\" opacity=\"0.25\"/>\n<text x=\"257.65306122448976\" y=\"343\" font-size=\"8.6\" text-anchor=\"end\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.55\">卷 11</text>\n<line x1=\"412.8\" y1=\"42.0\" x2=\"412.8\" y2=\"326.0\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 4\" opacity=\"0.25\"/>\n<text x=\"410.3061224489796\" y=\"343\" font-size=\"8.6\" text-anchor=\"end\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.55\">卷 21</text>\n<line x1=\"626.5\" y1=\"42.0\" x2=\"626.5\" y2=\"326.0\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 4\" opacity=\"0.25\"/>\n<text x=\"624.0204081632653\" y=\"343\" font-size=\"8.6\" text-anchor=\"end\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.55\">卷 35</text>\n<text x=\"108\" y=\"343\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.55\">卷 1</text>\n<text x=\"859\" y=\"343\" font-size=\"8.6\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.55\">卷 50</text>\n</svg>\n<figcaption style=\"font-size:0.74em;color:var(--text2,#777);margin-top:7px;line-height:1.65\">图 2｜十七地起讫：前九地为「境」，闻思修为「行」，三乘与二涅槃为「果」。重叠处（卷 13、34、50）为两地同卷分界，非笔误。</figcaption>\n</figure>\n\n这张表校正了草稿的一处空白。草稿说第 8–12 地的「细分名目与逐卷起讫」未能确证、不作补缀；实测则确定：**第 8、9 两地合为一处标题（「有心無心二地第八第九」），同在卷 13；第 10 闻所成地起于卷 13、止于卷 15；第 11 思所成地起于卷 16、止于卷 19；第 12 修所成地独占卷 20。** 十七地的完整骨架，至此闭合。\n\n十七地的编排不是随意的清单，而是一条**从经验到解脱的连续阶梯**。前九地是「境」：从最粗的五识经验（地 1），到统摄心意识的全景（地 2），到按禅定层次划分的三界（地 3–5），再到定中与定外、有心与无心的辨析（地 6–9）——这一路的用意，是先让行者把「心」的全体相状看清。中三地是「行」的资粮：闻（地 10）、思（地 11）、修（地 12），恰好是佛教通行的三慧次第，而本论把「修所成地」压缩在卷 20 一卷之内，仿佛一个枢纽，把前面所有的「解」转成「行」。后五地是三乘的实践与果证：声闻（地 13）、独觉（地 14）、菩萨（地 15），终于有余依、无余依二涅槃（地 16–17）。\n\n值得注意的是篇幅的极度不均：〈菩萨地〉十六卷，〈声闻地〉十四卷，而〈独觉地〉不足一卷、〈修所成地〉仅一卷。这不是轻重失衡，而是**教学重心**的显现：本论虽统摄三乘，其详于声闻止观与菩萨行果，正说明它面向的是「以声闻乘为共道、以菩萨乘为究竟」的修行者。〔本文判断〕\n\n### 4.1 逐地读点\n\n各地再各取一二「读点」，供通读时留意（细目均〔大意〕，卷次可由底本科判复核）：\n\n- **五识身相应地**：识不得生须三缘具足（根不坏、境现前、作意正起）；「率尔心—寻求心—决定心」把五识与意识连成认知链，染净到决定心之后才安立——这是全论的「感知流程图」。\n- **意地**：助伴列五十三心所；作业列意识胜用（分别所缘、审虑所缘、醉、狂、梦、觉、闷、醒、发起身业语业、离欲、离欲退、断善根、续善根、死、生，凡十五名——底本科判标「十四门」，盖「发起身业、语业」合算一门；正文以「若死，若生等」作结，末二项或亦随文开合。计门口径不同，阅者自可依列名读）；种子有十二异名；色聚说极微由觉慧分析假立。阿赖耶识的「生命延续论」最集中于此，且已出现「转依」一词（般涅槃时转舍染法种子所依）。\n- **有寻有伺等三地**：以寻伺划界（欲界与初静虑有寻有伺，中间静虑无寻唯伺，二禅以上无寻无伺）；不如理作意下破**十六异论**（因中有果、计我、计常、宿作因、断见、空见等），每论先以教、理二门说其来由再两难破斥——空见论一节已用三自性相反诘；杂染等起分烦恼、业、生三杂染，生杂染即十二缘起，有七十七智、四十四智之说。「界」一门是本论的世界观总纲：三界之外更立「非堕摄」的道、灭、无漏界；处则欲界三十六处、色界十八处、无色界四处；有情量、有情寿、有情受用（五趣苦乐、饮食、婬欲）、生、自体依次安立；因缘果立十因、四缘、五果——**器世间、有情世间与因果框架，全在这七卷里**。〔大意〕\n- **三摩呬多地**：以「轻安」划定「定」——欲界心一境性不算定；初静虑断五法、圆满五法；灭尽定一处问「诸心心法皆灭，为何说识不离身」，答以不坏的诸色根中有执持转识种子的阿赖耶识——学界所谓阿赖耶识的「初始段落」即在此处；另有四种所缘作意与声闻地遍满所缘同名。\n- **非三摩呬多地**：十二种「非定」，从自性不定到退——可当作自检清单读。\n- **有心地／无心地**：以地施设、心乱不乱、生不生等门划界；无想定、无想生、灭尽定归无心。\n- **闻所成地**：五明处——内明（佛教法数，一法至十法）、医方明、因明（论体性七项，含论堕负）、声明、工业明；内明与因明篇幅最大。\n- **思所成地**：三相——自性清净、思择所知、思择诸法；「自性清净」开九相：独处空闲审谛思惟、远离不思议处、善知黑说大说、「凡所思惟，唯依於義，不依於文」、于法少分唯生信解而于少分以慧观察、坚固思惟、安住思惟、相续思惟、究竟无退屈（T30n1579）。思择素呾缆义与伽他义两门，详说留给摄事分——「如何读经」的线由此接出。\n- **修所成地**：四处七支——「何等為七？一、生圓滿；二、聞正法圓滿；三、涅槃為上首；四、能熟解脫慧之成熟；五、修習對治；六、世間一切種清淨；七、出世間一切種清淨。」生圆满又分依内五（众同分、处所、依止、无业障、无信解障）、依外五——从「生在中国、四众同行」这样的外在条件讲起，可知「修」的前提在本论里是**被制度性地安立的**，不是一句「发心即可」。〔大意〕\n- **声闻地**：四瑜伽处——初处种性（不般涅槃四缘、劣缘十二项）、趣入，第二处品类建立（二十八种补特伽罗、四种所缘），第三处安立瑜伽（五处安立、九种心住），第四处世间道与出世间道（七作意、四静虑四无色）；释惠敏指出此地有三重「资粮论」结构，引用时须分清口径。\n- **独觉地**：种姓、道、习、住、行五相，篇幅极短。\n- **菩萨地**：见 §八。\n- **有余依／无余依地**：各三相，见 §九。\n\n### 4.2 划界不一的几处\n\n各家分卷略有出入，读时以 CBETA 底本为准：出离地的范围，有作卷 22–25（初瑜伽处三地之一）者，韩清净一系科判则延至卷 34（把后三个瑜伽处都算作出离地的展开）；独觉地有卷 34 与卷 35 两说；摄异门分有卷 83–84 与 82–84 两说；各语种版本的地序、分册亦不同，一般认为汉译较近原序。〔大意〕\n\n> **英译对读 · 第四节**\n>\n> The seventeen stages, with fascicle ranges measured from the base text: (1) the stage of the five consciousnesses with their objects, fasc. 1; (2) the mind stage, 1–3, covering mind, mentation and consciousness, the ālayavijñāna, gestation, and the material and sentient worlds; (3–5) the stages with applied and sustaining attention, with the latter only, and with neither, 4–10, mapping the three realms by the presence of discursive attention; (6) the stage of meditative absorption, 11–13; (7) the stage of non-absorption, 13; (8) the stage with mind, 13; (9) the stage without mind, 13; (10) the stage accomplished by hearing, 13–15, covering the five fields of knowledge; (11) by reflection, 16–19; (12) by cultivation, 20, in four aspects and seven branches; (13) the śrāvaka stage, 21–34, in four yogic grounds; (14) the pratyekabuddha stage, 34, in five aspects; (15) the bodhisattva stage, 35–50, in ten dharmas and four yogic grounds, thirteen abidings, the true meaning, and the precepts; (16) the stage with remainder, 50; (17) the stage without remainder, 50.\n>\n> This table closes a gap the earlier draft honestly left open: stages 8–12 are now fixed — stages 8 and 9 share one heading in fascicle 13; hearing spans 13–15; reflection 16–19; cultivation occupies fascicle 20 alone. The sequence is a **continuous ladder from experience to liberation**: the first nine stages survey the ground — from the coarsest sensory experience to the full field of mind, to the three realms graded by absorption, to the analyses of concentration and its absence; the middle three are the path's provisions — hearing, reflection, cultivation, the classic threefold wisdom, with cultivation compressed into a single fascicle as the hinge turning understanding into practice; the last five are the three vehicles and their fruits. The extreme unevenness of length — sixteen fascicles for the bodhisattva stage, fourteen for the śrāvaka, less than one for the pratyekabuddha — is not imbalance but **pedagogical weight**: the treatise is written for practitioners who take the śrāvaka path as common ground and the bodhisattva path as the goal.\n\n## 五、重点阐释一·识论：从五识到阿赖耶\n\n〈本地分〉前两卷是全书最密的地方，也是唯识学的地基。它不先讲「万法唯识」的结论，而是从最具体的经验入手：眼识如何生起？意是什么？阿赖耶识在哪里？\n\n### 5.1 五识身相应地：五个问题\n\n卷一开篇，本论以五相界定五识：\n\n> 「云何五識身相應地？謂五識身自性，彼所依，彼所緣，彼助伴，彼作業，如是總名五識身相應地。何等名為五識身耶？所謂眼識、耳識、鼻識、舌識、身識。」\n\n自性、所依、所缘、助伴、作业——这五相是一套分析任何心识的通用格套，后面〈意地〉也用同一套（「此亦五相應知」）。以眼识为例：**自性**是「依眼了别色」；**所依**有三种——俱有依（眼根）、等无间依（意）、种子依（阿赖耶识）；**所缘**是色（显色、形色、表色）；**助伴**是与眼识相应的心所（作意、触、受、想、思等）；**作业**是了别自境。这一格套的用意很清楚：**任何一个识都不是孤立的实体，而是一组条件的功能**。〔本文判断〕\n\n本卷另有两点常被忽略：其一，「识不得生」——根不坏、境现前、作意正起，三缘具足识才生起，这是本论的「生识条件论」；其二，率尔心、寻求心、决定心的「三心」说——五识与意识串起一条认知链，染净分别要到决定心之后才安立。〔大意〕\n\n种子依一句尤其关键：「種子依，謂即此一切種子執受所依異熟所攝阿賴耶識。」——阿赖耶识在这里不是作为一个玄学本体出现，而是作为**前五识生起的三种依之一**（种子依）被引入。它是「一切种子执受所依、异熟所摄」的识。同卷又释：「一切種子識，謂無始時來樂著戲論熏習為因所生一切種子異熟識。」——无始戏论熏习为因，所生的一切种子，都摄在这个异熟识里。**注意这个次序：先说功能（能持种、能执受），后说名称。**这是本论区别于后来论书的地方：它从修行者观察得到的条件关系出发，而不是从定义出发。〔本文判断〕\n\n### 5.2 意地：心、意、识三名\n\n〈意地〉问「云何意地」，答以同一五相。其「自性」一段，是汉传唯识学最常引的定义之一：\n\n> 「云何意自性？謂心、意、識。心，謂一切種子所隨、依止性所隨、依附依止性、體能執受、異熟所攝阿賴耶識。意，謂恒行意，及六識身無間滅意。識，謂現前了別所緣境界。」\n\n三名各有所指：**心**是集起义，指持种、执受的阿赖耶识；**意**是思量义，指恒行的末那与六识的无间灭意；**识**是了别义，指当前了别境界的六识。后来《成唯识论》把「意」进一步限定为恒审思量的第七末那，把「心」专指第八——这一分化的种子，就在这里。〔本文判断〕\n\n〈意地〉随后展开的内容，常让初读者错愕：胎相（三十八七日）、器世间、有情世间、三界诸天。这些看似与「识」无关，其实正是「意地」的题中之义：**心识所依、所缘、所作业的全体境界**，都属于「意地」的范围。读到这里应当提醒自己：本论的「地」不是「心的分类」，而是「以心为轴的整个经验世界」。\n\n### 5.3 阿赖耶识：从散见到八证\n\n阿赖耶识在〈本地分〉中出现得并不多，且多在具体语境中带出（如种子依、执受、异熟）。这正是学界判定〈本地分〉较早的依据之一。〔大意〕到了〈摄抉择分〉卷 51，论主才把这个问题正面提出：\n\n> 「問：前說種子依，謂阿賴耶識。而未說有、有之因緣、廣分別義。何故不說？何緣知有？廣分別義云何應知？答：由此建立是佛世尊最深密記，是故不說。如世尊言：阿陀那識甚深細，一切種子如瀑流。我於凡、愚不開演，恐彼分別執為我。」\n\n三个问题——为何不说、如何知有、如何广分别——构成后分的总纲。第一问的答案极重要：**不说，是因为它是「佛世尊最深密记」，怕凡愚执为我**。这不是知识封锁，而是对「执取」的预防：一个用来解释相续的识，若被当作「我」，就正好落回它要破的东西。〔本文判断〕\n\n第二问的答案，就是著名的**八证**：\n\n> 「復次，嗢拕南曰：執受、初、明了、種子、業、身受、無心定、命終，無，皆不應理。由八種相，證阿賴耶識決定是有。謂若離阿賴耶識，依止執受不應道理，最初生起不應道理，有明了性不應道理，有種子性不應道理，業用差別不應道理，身受差別不應道理，處無心定不應道理，命終時識不應道理。」\n\n<figure style=\"margin:16px 0 20px\">\n<svg viewBox=\"0 0 900 320\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:920px;display:block\" role=\"img\" aria-label=\"八证反证结构图\"><defs><marker id=\"arw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#b8863c\"/></marker></defs>\n<text x=\"14\" y=\"26\" font-size=\"13.5\" fill=\"currentColor\" font-weight=\"600\">八证：同一归谬形式</text>\n<text x=\"14\" y=\"44\" font-size=\"9.6\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.55\">「由八種相，證阿賴耶識決定是有」——每条都以「若离此识，则某事不应道理」收束。</text>\n<rect x=\"14.0\" y=\"84.0\" width=\"156.0\" height=\"176.0\" rx=\"8\" fill=\"rgba(164,85,63,0.18)\" stroke=\"#a4553f\" stroke-width=\"1\"/>\n<text x=\"92\" y=\"128\" font-size=\"10.6\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.85\">若離</text>\n<text x=\"92\" y=\"152\" font-size=\"12.6\" text-anchor=\"middle\" fill=\"#a4553f\" font-weight=\"600\">阿賴耶識</text>\n<text x=\"92\" y=\"178\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.8\">則此八事</text>\n<text x=\"92\" y=\"198\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.8\">不應道理</text>\n<text x=\"92\" y=\"226\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.45\">（反证，非直证）</text>\n<rect x=\"196.0\" y=\"66.0\" width=\"690.0\" height=\"216.0\" rx=\"8\" fill=\"rgba(184,134,60,0.05)\" stroke=\"#b8863c\" stroke-width=\"1\" stroke-dasharray=\"5 4\"/>\n<text x=\"206\" y=\"82\" font-size=\"9.2\" text-anchor=\"#b8863c\" fill=\"currentColor\" font-weight=\"600\" opacity=\"0.85\">八種現象</text>\n<text x=\"262\" y=\"82\" font-size=\"8.8\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.45\">若无此识，则皆不可解</text>\n<rect x=\"208.0\" y=\"92.0\" width=\"322.0\" height=\"38.0\" rx=\"5\" fill=\"rgba(255,255,255,0.5)\" stroke=\"rgba(184,134,60,0.55)\" stroke-width=\"1\"/>\n<text x=\"220\" y=\"109\" font-size=\"10.5\" fill=\"currentColor\" font-weight=\"600\">依止執受</text>\n<text x=\"220\" y=\"123\" font-size=\"8.8\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.55\">根身谁持</text>\n<text x=\"518\" y=\"115\" font-size=\"12\" text-anchor=\"end\" fill=\"#a4553f\" font-weight=\"700\">✕</text>\n<rect x=\"546.0\" y=\"92.0\" width=\"322.0\" height=\"38.0\" rx=\"5\" fill=\"rgba(255,255,255,0.5)\" stroke=\"rgba(184,134,60,0.55)\" stroke-width=\"1\"/>\n<text x=\"558\" y=\"109\" font-size=\"10.5\" fill=\"currentColor\" font-weight=\"600\">最初生起</text>\n<text x=\"558\" y=\"123\" font-size=\"8.8\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.55\">识如何得起</text>\n<text x=\"856\" y=\"115\" font-size=\"12\" text-anchor=\"end\" fill=\"#a4553f\" font-weight=\"700\">✕</text>\n<rect x=\"208.0\" y=\"140.0\" width=\"322.0\" height=\"38.0\" rx=\"5\" fill=\"rgba(255,255,255,0.5)\" stroke=\"rgba(184,134,60,0.55)\" stroke-width=\"1\"/>\n<text x=\"220\" y=\"157\" font-size=\"10.5\" fill=\"currentColor\" font-weight=\"600\">有明了性</text>\n<text x=\"220\" y=\"171\" font-size=\"8.8\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.55\">意识何故有时不明</text>\n<text x=\"518\" y=\"163\" font-size=\"12\" text-anchor=\"end\" fill=\"#a4553f\" font-weight=\"700\">✕</text>\n<rect x=\"546.0\" y=\"140.0\" width=\"322.0\" height=\"38.0\" rx=\"5\" fill=\"rgba(255,255,255,0.5)\" stroke=\"rgba(184,134,60,0.55)\" stroke-width=\"1\"/>\n<text x=\"558\" y=\"157\" font-size=\"10.5\" fill=\"currentColor\" font-weight=\"600\">有種子性</text>\n<text x=\"558\" y=\"171\" font-size=\"8.8\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.55\">善恶如何相续</text>\n<text x=\"856\" y=\"163\" font-size=\"12\" text-anchor=\"end\" fill=\"#a4553f\" font-weight=\"700\">✕</text>\n<rect x=\"208.0\" y=\"188.0\" width=\"322.0\" height=\"38.0\" rx=\"5\" fill=\"rgba(255,255,255,0.5)\" stroke=\"rgba(184,134,60,0.55)\" stroke-width=\"1\"/>\n<text x=\"220\" y=\"205\" font-size=\"10.5\" fill=\"currentColor\" font-weight=\"600\">業用差別</text>\n<text x=\"220\" y=\"219\" font-size=\"8.8\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.55\">一识如何多业</text>\n<text x=\"518\" y=\"211\" font-size=\"12\" text-anchor=\"end\" fill=\"#a4553f\" font-weight=\"700\">✕</text>\n<rect x=\"546.0\" y=\"188.0\" width=\"322.0\" height=\"38.0\" rx=\"5\" fill=\"rgba(255,255,255,0.5)\" stroke=\"rgba(184,134,60,0.55)\" stroke-width=\"1\"/>\n<text x=\"558\" y=\"205\" font-size=\"10.5\" fill=\"currentColor\" font-weight=\"600\">身受差別</text>\n<text x=\"558\" y=\"219\" font-size=\"8.8\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.55\">何故有苦乐舍</text>\n<text x=\"856\" y=\"211\" font-size=\"12\" text-anchor=\"end\" fill=\"#a4553f\" font-weight=\"700\">✕</text>\n<rect x=\"208.0\" y=\"236.0\" width=\"322.0\" height=\"38.0\" rx=\"5\" fill=\"rgba(255,255,255,0.5)\" stroke=\"rgba(184,134,60,0.55)\" stroke-width=\"1\"/>\n<text x=\"220\" y=\"253\" font-size=\"10.5\" fill=\"currentColor\" font-weight=\"600\">處無心定</text>\n<text x=\"220\" y=\"267\" font-size=\"8.8\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.55\">灭尽定时识何在</text>\n<text x=\"518\" y=\"259\" font-size=\"12\" text-anchor=\"end\" fill=\"#a4553f\" font-weight=\"700\">✕</text>\n<rect x=\"546.0\" y=\"236.0\" width=\"322.0\" height=\"38.0\" rx=\"5\" fill=\"rgba(255,255,255,0.5)\" stroke=\"rgba(184,134,60,0.55)\" stroke-width=\"1\"/>\n<text x=\"558\" y=\"253\" font-size=\"10.5\" fill=\"currentColor\" font-weight=\"600\">命終時識</text>\n<text x=\"558\" y=\"267\" font-size=\"8.8\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.55\">命终识如何离身</text>\n<text x=\"856\" y=\"259\" font-size=\"12\" text-anchor=\"end\" fill=\"#a4553f\" font-weight=\"700\">✕</text>\n<path d=\"M176,172 H193\" fill=\"none\" stroke=\"#b8863c\" stroke-width=\"1.4\" marker-end=\"url(#arw)\"/>\n</svg>\n<figcaption style=\"font-size:0.74em;color:var(--text2,#777);margin-top:7px;line-height:1.65\">图 6｜八证的结构：嗢拕南八目（執受、初、明了、種子、業、身受、無心定、命終）。八条共用同一形式，故图中以「八事集合」一框承之，不复逐条连线。</figcaption>\n</figure>\n\n八条论证，都是「若离阿赖耶识，则 X 不成立」的形式：**依止执受**（根身谁持）、**最初生起**（识如何得起）、**明了性**（意识何故有时不明）、**种子性**（善恶如何相续）、**业用差别**（一识如何多业）、**身受差别**（何故有苦乐舍）、**处无心定**（入灭尽定时识何在）、**命终时识**（命终识如何离身）。这是一套**归谬式的存在论证**：先让对方承认这些现象，再指出没有阿赖耶识则无法解释。它与后来《成唯识论》的论证相比，尚显素朴，但方向已定：**阿赖耶识不是被「看见」的，而是被「推出来」的**。〔本文判断〕\n\n八证之后，本论逐一展开每一证的「五因」「二识俱转」等细理，篇幅占了卷 51 的大半。初读可只掌握八条的纲目与「归谬」形式，细理留待第二遍。\n\n补一条学术史注脚：阿赖耶识观念的「起点」，学界别有一说——Schmithausen 把它定在三摩呬多地灭尽定一处的问答（入灭尽定时识不离身，由执持种子的阿赖耶识不灭），即所谓「初始段落」（Initial Passage）；Yamabe 则主张它更源于禅修中身心粗重与轻安的问题，未必是论辩需要的产物。两说都比「卷 51 才有」更深一层：**阿赖耶识是从「定中谁持身」的实修问题里长出来的，不是先有理论再找证据**。〔大意＋本文判断〕\n\n另外，Waldron 把卷 51–52 这部分称为「Ālaya Treatise」（阿赖耶识论），并指出它既非此概念最早的提及、也非最长的论述，而是印度瑜伽行文献中**最系统地以阿毗达磨方式处理阿赖耶识者**——证成、流转、还灭三段俱全。〔大意〕\n\n### 5.4 本论的「识论」特质\n\n有一点必须点明：本论并不以「万法唯识」为开篇命题，也不以破斥外境为能事。它做的是更基础的工作——**把识的层次、条件、相续说清楚**：五识如何依三缘生起，意识如何与五识俱转，阿赖耶识如何持种执受，末那如何恒行。等到《成唯识论》以「识有四分」「唯识无境」建立体系时，它所用的材料，大半来自这里。〔本文判断〕\n\n这也解释了本论为何读来「不像唯识」：它不是论战之作，而是**修行者的内观报告**，只是这份报告精细到足以支撑一个学派。\n\n最后给一张**摄决择分的地图**（30 卷按底本科判分十二段，各记一句「抉择了什么」）〔大意〕：51–52 五识身/意地——八证与阿赖耶识论；53–57 续前二地——心差别生、得获成就、十种摄、六种现观、处六义；58–61 有寻有伺等三地——杂抉择与三杂染（另出《王法正理论》）；62–63 三摩呬多地——以「所知事同分影像」界说三摩地；64 闻所成地——十种摄；65–66 思所成地——六种现观详说；67 修所成地——修相抉择；67–71 声闻地——以声闻种性开篇，答「无种性」三诘难；72–80 菩萨地——五事先立，三自性继后，功德品决择引《解深密经》诸品问答（含卷 77 慈氏问止观）。读法建议：不必逐卷通读，先读 51–52（八证）与 77（止观）两段，再按需取段。\n\n> **英译对读 · 第五节**\n>\n> The first two fascicles are the densest in the book and the foundation of Yogācāra. The treatise does not begin with \"all is consciousness-only\" but with concrete experience: how does eye-consciousness arise? What is mentation? Where is the ālayavijñāna?\n>\n> The five consciousnesses are defined by five aspects — self-nature, support, object, companions, activity — a general grid later applied to the mind stage as well (\"this too is known by five aspects\"). For eye-consciousness: self-nature is \"depending on the eye, distinguishing forms\"; support is threefold (the eye faculty, the immediately preceding mind, the seed-support); object is form; companions are the associated mental factors; activity is distinguishing its own object. The point is unmistakable: **no consciousness is an isolated substance; each is a function of a set of conditions.** The seed-support is defined as \"that ālayavijñāna which is the support of all seeds, appropriated, and included in maturation\" — the ālayavijñāna enters here not as a metaphysical entity but as **one of three supports** of sensory consciousness. Note the order: function first, name second.\n>\n> The mind stage opens with the classic definition: \"What is the self-nature of mentation? Mind, mentation, consciousness. Mind is the ālayavijñāna accompanied by all seeds, the nature of support, the appropriated, included in maturation. Mentation is the constantly operating mentation and the immediately ceased mentation of the six consciousnesses. Consciousness is the present distinguishing of objects.\" Mind as store, mentation as thinking, consciousness as distinguishing — the later crystallization into eighth, seventh and sixth begins here. What follows in the mind stage — gestation, the material world, the realms — is not a digression: the \"stage of mind\" is the whole world of experience organized around mind.\n>\n> In the Basic Section the ālayavijñāna appears sparingly, mostly in concrete contexts (seed-support, appropriation, maturation). The Viniścaya raises it head-on in fascicle 51 with three questions — why it was not explained, how we know it exists, how it should be analyzed — and answers the first with the Buddha's \"deepest secret\": \"The ādāna-consciousness is deep and subtle, all seeds like a torrent; I do not reveal it to the foolish, lest they discriminate and grasp it as self.\" Not withholding, but prophylaxis: **a consciousness posited to explain continuity must not be grasped as a self.** The second answer is the **eight proofs**: \"By eight aspects it is established that the ālayavijñāna definitely exists: apart from it, appropriation of support, initial arising, clarity, seed-nature, difference of karmic function, difference of feeling, the attainment of mindless absorption, and consciousness at death — all are impossible.\" Each is a reductio: grant the phenomenon, deny the ālayavijñāna, and explanation collapses. Compared with the *Cheng Weishi Lun*, the arguments are plain, but the direction is set: **the ālayavijñāna is not seen; it is inferred.**\n>\n> One trait must be named: this treatise does not open with \"consciousness-only\" as a thesis, nor does it make refuting external objects its business. It does the more basic work — clarifying the layers, conditions and continuity of consciousness. When the *Cheng Weishi Lun* later builds its system, most of its materials come from here. This is why the *Yogācārabhūmi* does not read \"like Yogācāra\": it is not a polemic but **an inner observation report**, precise enough to support a school.\n\n## 六、重点阐释二·法相：五法、三自性、转依\n\n### 6.1 五法：相、名、分别、真如、正智\n\n卷 72 给出五法的定义，是理解唯识「法相」的入口：\n\n> 「何等為相？謂若略說，所有言談安足處事。何等為名？謂即於相所有增語。何等為分別？謂三界行中所有心心所。何等為真如？謂法無我所顯，聖智所行，非一切言談安足處事。何等為正智？謂略有二種。一、唯出世間正智，二、世間出世間正智。」\n\n五法不是五个并列的范畴，而是一条**认识论的链条**：**相**是言谈所安立的事；**名**是加在相上的语言；**分别**是执取相名的三界心心所；**真如**是圣智所行、非言谈所及的真实；**正智**是能证真如的智（分唯出世、世出世二种）。前三是「妄」的环节，后二是「真」的环节；修行的转折，就发生在「分别」止息、正智现前之处。〔本文判断〕\n\n### 6.2 三自性：三种「自性」的不同身份\n\n卷 73 的三自性定义，文字极简而层次分明：\n\n> 「云何遍計所執自性？謂隨言說、依假名言建立自性。云何依他起自性？謂從眾緣所生自性。云何圓成實自性？謂諸法真如，聖智所行、聖智境界、聖智所緣，乃至能令證得清淨，能令解脫一切相縛及麁重縛，亦令引發一切功德。」\n\n三句定义，恰好对应三种「有」的方式：**遍计所执**是「随言说、依假名建立」——只有言说的存在；**依他起**是「从众缘所生」——缘起的存在；**圆成实**是「诸法真如，圣智所行」——圣智的存在。同卷又以三问答定三者的所缘：遍计「緣於相名相屬」；依他「緣遍計所執自性執」；圆成「緣遍計所執自性於依他起自性中畢竟不實」。这三句是唯识观法的核心：**在依他起上，看破遍计的不实，即是圆成。**〔本文判断〕\n\n还要注意本论对「三无性」的并列：「復有三無性性。謂相無性性、生無性性、勝義無性性。」三自性与三无性不是两套理论，而是同一实相的有、无两面。\n\n<figure style=\"margin:16px 0 20px\">\n<svg viewBox=\"0 0 900 300\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:920px;display:block\" role=\"img\" aria-label=\"五法三自性三无性关系图\"><defs><marker id=\"arw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#b8863c\"/></marker></defs>\n<text x=\"14\" y=\"26\" font-size=\"13.5\" fill=\"currentColor\" font-weight=\"600\">五法 · 三自性 · 三无性</text>\n<text x=\"14\" y=\"44\" font-size=\"9.6\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.55\">上：五法自是一条「妄→真」的认知链；中下：三自性与三无性一一相即。</text>\n<rect x=\"92.0\" y=\"66.0\" width=\"132.0\" height=\"28.0\" rx=\"5\" fill=\"rgba(0,0,0,0.045)\" stroke=\"rgba(0,0,0,0.28)\" stroke-width=\"1\"/>\n<text x=\"158.0\" y=\"85\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"500\">相</text>\n<line x1=\"228.0\" y1=\"80.0\" x2=\"258.0\" y2=\"80.0\" stroke=\"#b8863c\" stroke-width=\"1\" opacity=\"0.5\"/>\n<rect x=\"264.0\" y=\"66.0\" width=\"132.0\" height=\"28.0\" rx=\"5\" fill=\"rgba(0,0,0,0.045)\" stroke=\"rgba(0,0,0,0.28)\" stroke-width=\"1\"/>\n<text x=\"330.0\" y=\"85\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"500\">名</text>\n<line x1=\"400.0\" y1=\"80.0\" x2=\"430.0\" y2=\"80.0\" stroke=\"#b8863c\" stroke-width=\"1\" opacity=\"0.5\"/>\n<rect x=\"436.0\" y=\"66.0\" width=\"132.0\" height=\"28.0\" rx=\"5\" fill=\"rgba(0,0,0,0.045)\" stroke=\"rgba(0,0,0,0.28)\" stroke-width=\"1\"/>\n<text x=\"502.0\" y=\"85\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"500\">分别</text>\n<line x1=\"572.0\" y1=\"80.0\" x2=\"602.0\" y2=\"80.0\" stroke=\"#b8863c\" stroke-width=\"1\" opacity=\"0.5\"/>\n<rect x=\"608.0\" y=\"66.0\" width=\"132.0\" height=\"28.0\" rx=\"5\" fill=\"rgba(0,0,0,0.045)\" stroke=\"rgba(0,0,0,0.28)\" stroke-width=\"1\"/>\n<text x=\"674.0\" y=\"85\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"500\">真如</text>\n<line x1=\"744.0\" y1=\"80.0\" x2=\"774.0\" y2=\"80.0\" stroke=\"#b8863c\" stroke-width=\"1\" opacity=\"0.5\"/>\n<rect x=\"780.0\" y=\"66.0\" width=\"132.0\" height=\"28.0\" rx=\"5\" fill=\"rgba(0,0,0,0.045)\" stroke=\"rgba(0,0,0,0.28)\" stroke-width=\"1\"/>\n<text x=\"846.0\" y=\"85\" font-size=\"11\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"500\">正智</text>\n<rect x=\"92.0\" y=\"100.0\" width=\"476.0\" height=\"16.0\" rx=\"4\" fill=\"rgba(164,85,63,0.10)\"/>\n<text x=\"330.0\" y=\"112\" font-size=\"9\" text-anchor=\"middle\" fill=\"#a4553f\" font-weight=\"400\" opacity=\"0.85\">前三是「妄」的环节</text>\n<rect x=\"608.0\" y=\"100.0\" width=\"304.0\" height=\"16.0\" rx=\"4\" fill=\"rgba(111,143,106,0.12)\"/>\n<text x=\"760.0\" y=\"112\" font-size=\"9\" text-anchor=\"middle\" fill=\"#6f8f6a\" font-weight=\"400\" opacity=\"0.9\">后二是「真」的环节</text>\n<text x=\"14\" y=\"85\" font-size=\"10\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.5\">五法</text>\n<text x=\"14\" y=\"112\" font-size=\"8.2\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.4\">〔本文判断〕</text>\n<text x=\"14\" y=\"171\" font-size=\"10\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.5\">三自性</text>\n<rect x=\"92.0\" y=\"152.0\" width=\"236.0\" height=\"30.0\" rx=\"5\" fill=\"rgba(184,134,60,0.20)\" stroke=\"#b8863c\" stroke-width=\"1\"/>\n<text x=\"210.0\" y=\"172\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"600\">遍計所執自性</text>\n<rect x=\"362.0\" y=\"152.0\" width=\"236.0\" height=\"30.0\" rx=\"5\" fill=\"rgba(94,139,158,0.20)\" stroke=\"#5e8b9e\" stroke-width=\"1\"/>\n<text x=\"480.0\" y=\"172\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"600\">依他起自性</text>\n<rect x=\"632.0\" y=\"152.0\" width=\"236.0\" height=\"30.0\" rx=\"5\" fill=\"rgba(111,143,106,0.20)\" stroke=\"#6f8f6a\" stroke-width=\"1\"/>\n<text x=\"750.0\" y=\"172\" font-size=\"10.8\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"600\">圓成實自性</text>\n<text x=\"14\" y=\"255\" font-size=\"10\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.5\">三无性</text>\n<rect x=\"92.0\" y=\"236.0\" width=\"236.0\" height=\"28.0\" rx=\"5\" fill=\"rgba(184,134,60,0.20)\" stroke=\"#b8863c\" stroke-width=\"1\"/>\n<text x=\"210.0\" y=\"255\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\">相無性性</text>\n<line x1=\"210.0\" y1=\"182.0\" x2=\"210.0\" y2=\"234.0\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\" opacity=\"0.35\"/>\n<rect x=\"362.0\" y=\"236.0\" width=\"236.0\" height=\"28.0\" rx=\"5\" fill=\"rgba(94,139,158,0.20)\" stroke=\"#5e8b9e\" stroke-width=\"1\"/>\n<text x=\"480.0\" y=\"255\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\">生無性性</text>\n<line x1=\"480.0\" y1=\"182.0\" x2=\"480.0\" y2=\"234.0\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\" opacity=\"0.35\"/>\n<rect x=\"632.0\" y=\"236.0\" width=\"236.0\" height=\"28.0\" rx=\"5\" fill=\"rgba(111,143,106,0.20)\" stroke=\"#6f8f6a\" stroke-width=\"1\"/>\n<text x=\"750.0\" y=\"255\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\">勝義無性性</text>\n<line x1=\"750.0\" y1=\"182.0\" x2=\"750.0\" y2=\"234.0\" stroke=\"currentColor\" stroke-width=\"1\" stroke-dasharray=\"3 3\" opacity=\"0.35\"/>\n</svg>\n<figcaption style=\"font-size:0.74em;color:var(--text2,#777);margin-top:7px;line-height:1.65\">图 7｜三自性与三无性一一相即（遍计—相无性、依他—生无性、圆成—胜义无性），五法则另是一条「相→名→分别→真如→正智」的链条，不与三者逐项对应。</figcaption>\n</figure>\n\n顺序上有一个内部证据值得留意：摄决择分抉择菩萨地时，**先立五事（相、名、分别、真如、正智）**，从有无、实假、世俗胜义等角度逐一问答完毕之后，才说「若欲了知真實義者，於三自性復應修觀」，再引入三自性、五种遍计所执、三无自性与三自性的譬喻（虚空、害怨、无尽宝藏）。这一「五事在先、三自性在后」的顺序，是文本内部可见的层累痕迹。〔大意＋本文判断〕\n\n### 6.3 唯事与离言：〈真实义品〉的入口\n\n〈菩萨地·真实义品〉（卷 36）是汉传唯识最重视的篇章之一，太虚、演培皆有专讲。它开篇即分二种真实义：\n\n> 「云何真實義？謂略有二種。一者、依如所有性，諸法真實性，二者、依盡所有性，諸法一切性。如是諸法真實性、一切性，應知總名真實義。」\n\n如所有性是真如（理），尽所有性是一切法（事）；二者不是两个世界，而是同一实相的两面观。同品又把真实义开为四种：\n\n> 「此真實義品類差別，復有四種。一者、世間極成真實，二者、道理極成真實，三者、煩惱障淨智所行真實，四者、所知障淨智所行真實。」\n\n世间极成（世俗共许）、道理极成（比量证成）、烦恼障净智所行（二乘所证）、所知障净智所行（菩萨佛所证）——四级真实，对应四种能证之智；愈往后，愈离言说。〔本文判断〕同品又说「所知障净智所行真实」：「謂於所知能礙智故，名所知障。從所知障得解脫智所行境界，當知是名所知障淨智所行真實……謂諸菩薩諸佛世尊入法無我，入已善淨，於一切法離言自性、假……」——真实义的最终所指，是**一切法离言自性**。这与五法中的「真如＝非言谈安足处」完全同构。\n\n### 6.4 转依与涅槃：转变的是什么\n\n卷 73 论涅槃，给出了本论对「转依」最凝练的表述：\n\n> 「轉依無為涅槃以為其相。云何為涅槃？謂法界清淨煩惱眾苦永寂靜義，非滅無義。」\n\n「非灭无义」四字是关键：涅槃不是「什么都没有」，而是「法界清淨、煩惱眾苦永寂靜義」。同卷以三喻说明：水离浑浊得澄清性，非离浊时无澄清性；金离刚强得调柔性，非彼无时无调柔性；虚空离云雾得清净性，非彼无时清净性亦无所有。**转依所转的，是遮蔽，不是本体**。接着更以一个梦喻收束：「譬如有人，於眠夢中，自見其身為大暴流之所漂溺。為欲越渡如是暴流，發大精進；即由發起大精進故，欻然便覺。既得覺已，於彼暴流都無所見。」——觉醒不是把暴流搬走，而是发现它本来无实。\n\n这一组譬喻与《圆觉经》的梦喻、金矿喻遥相呼应，但进路不同：经部以「无明无体」直下承当，论部以「转依」层层建立。二者可以对读，不宜混同。〔本文判断〕\n\n> **英译对读 · 第六节**\n>\n> Fascicle 72 defines the five dharmas: **mark** (whatever speech can rest on), **name** (the label added to marks), **discrimination** (the mind and mental factors operating in the three realms), **suchness** (what is revealed by the absence of self in dharmas, the domain of noble wisdom, where speech cannot rest), and **perfect wisdom** (of two kinds, supramundane and both). The five are not a list but an **epistemic chain**: marks, names and discrimination are the moments of delusion; suchness and wisdom are the moments of truth; practice turns at the point where discrimination ceases and wisdom arises.\n>\n> Fascicle 73 defines the three natures with extreme economy: the **imagined** is \"established by speech, by provisional names\"; the **dependent** is \"arisen from conditions\"; the **perfected** is \"the suchness of all dharmas, the domain, object and range of noble wisdom, which purifies defilement and liberates from the bonds of marks and the bonds of coarseness.\" Three modes of existence — verbal, conditioned, and known by wisdom. The same fascicle fixes their objects: the imagined rests on marks and names; the dependent rests on grasping the imagined; the perfected rests on seeing that the imagined is utterly unreal within the dependent. This is the core of Yogācāra contemplation: **on the dependent, seeing through the imagined, is the perfected.**\n>\n> The Bodhisattva Stage's chapter on the True Meaning (fasc. 36) divides true meaning into the real nature of dharmas as-they-are and as-they-exhaustively-are — suchness and phenomena, two faces of one reality — and names the ultimate as \"the selflessness of all dharmas beyond speech.\" Fascicle 73's account of nirvāṇa then gives the treatise's most compact statement of transformation of the basis: \"Transformation of the basis has unconditioned nirvāṇa as its mark. What is nirvāṇa? The meaning that the dharma-realm is purified and the afflictions and all suffering are forever stilled — not the meaning of annihilation.\" Not annihilation: water cleared of mud, gold freed of stiffness, space freed of clouds — **what is transformed is the covering, not the substance.** The dream simile closes it: a man drowning in a torrent in his dream struggles and wakes — and finds no torrent at all. Awakening does not remove the torrent; it discovers it was never real.\n\n## 七、重点阐释三·止观：声闻地的实操\n\n### 7.1 四种所缘\n\n读〈声闻地〉先要补一笔**前行**。四瑜伽处的第一处讲种性地、趣入地与出离地：种性即种子、界、性，法尔附于六处；「不般涅槃」有四缘（生无暇、放逸过、邪解行、有障过）；趣入地讲八类趣入与已趣入者的八相；出离地先立世间道（观下地粗、观上地静，历四禅八定）与出世道（四谛现观）两条离欲路，再列二道资粮——自圆满、他圆满、善法欲、正出家、戒律仪、根律仪、食知量、悎寤瑜伽、正知而住、乐远离、净诸盖、依三摩地等十三四项（各科统计口径不一）。也就是说，**九住心之前，本论先安排了一整套「资格与资粮」的检查**：不是人人当下即可修定，须先有种性、先离障碍、先备资粮。这一设计使〈声闻地〉成为一部有入场规矩的修行手册，而不是随手翻开的技术书。〔大意＋本文判断〕\n\n卷 26 是〈声闻地〉止观的核心。它先把所缘分为四类：\n\n> 「云何所緣？謂有四種所緣境事。何等為四？一者、遍滿所緣境事，二者、淨行所緣境事，三者、善巧所緣境事，四者、淨惑所緣境事。」\n\n其中「遍满所缘」又开四种：\n\n> 「云何遍滿所緣境事？謂復四種。一、有分別影像，二、無分別影像，三、事邊際性，四、所作成辦。」\n\n其中「事边际性」一段尤须细读：\n\n> 「云何事邊際性？謂若所緣盡所有性、如所有性。云何名為盡所有性？謂色蘊外更無餘色，受想行識蘊外更無有餘受想行識；一切有為事，皆五法所攝；一切諸法，界處所攝；一切所知事，四聖諦攝。如是名為盡所有性。云何名為如所有性？謂若所緣是真實性、是真如性，由四道理，具道理性。謂觀待道理、作用道理、證成道理、法爾道理。」\n\n**尽所有性**是法的全体（五法、界处、四谛三层收尽），**如所有性**是法的实性（以四道理证成）。而「所作成办」一段更把这套观法直通转依：\n\n> 「云何所作成辦？謂修觀行者，於奢摩他、毘鉢舍那，若修、若習、若多修習為因緣故，諸緣影像所有作意皆得圓滿。此圓滿故，便得轉依，一切麁重悉皆息滅。得轉依故，超過影像，即於所知事，有無分別現量智見生。」\n\n**止观圆满→转依→超影像→无分别现量智见**——这十六个字，是〈声闻地〉对「修所成」的最终定义，也是全论修行论的枢轴：修行的终点不是「想得更好」，而是「现量现前」。〔本文判断〕\n\n**有分别影像**是依闻思、教授教诫，于所知事的「同分影像」上作观察简择（如不净、慈愍、缘起、界差别、阿那波那念、蕴界处善巧、四谛等）；**无分别影像**是止；**事边际性**是尽所有性与如所有性；**所作成办**是修习所成的果。这四者构成完整的止观结构：**以有分别影像起观，以无分别影像成止，以事边际性证理，以所作成办得果。**〔本文判断〕\n\n### 7.2 九住心、六力、四种作意\n\n卷 30 的九住心，是汉藏两地实修传统共同奉为准则的次第：\n\n> 「云何名為九種心住？謂有苾芻，令心內住、等住、安住、近住、調順、寂靜、最極寂靜、專注一趣，及以等持；如是名為九種心住。」\n\n九住各有界定，如「內住」是「從外一切所緣境界攝錄其心，繫在於內，令不散亂」；「等住」是于所缘「以相續方便、澄淨方便，挫令微細，遍攝令住」；「安住」是失念外散时「復還攝錄安置內境」。**这不是九个阶位的高下，而是同一件事的九种成熟度**：从最初把心拉回来，到最终不须用力而自然安住。〔本文判断〕\n\n与九住相配的，是**六力**与**四种作意**：\n\n> 「當知此中，由六種力，方能成辦九種心住。一、聽聞力，二、思惟力，三、憶念力，四、正知力，五、精進力，六、串習力。」\n\n> 「一、力勵運轉作意，二、有間缺運轉作意，三、無間缺運轉作意，四、無功用運轉作意。於內住、等住中，有力勵運轉作意；於安住、近住、調順、寂靜、最極寂靜中，有有間缺運轉作意；於專注一趣中，有無間缺運轉作意；於等持中，有無功用運轉作意。」\n\n<figure style=\"margin:16px 0 20px\">\n<svg viewBox=\"0 0 900 236\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:920px;display:block\" role=\"img\" aria-label=\"九住心与六力四作意对应矩阵\"><defs><marker id=\"arw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#b8863c\"/></marker></defs>\n<text x=\"12\" y=\"22\" font-size=\"13.5\" fill=\"currentColor\" font-weight=\"600\">九住心 × 六力 × 四作意</text>\n<text x=\"12\" y=\"38\" font-size=\"9.6\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.55\">底本卷 30：「由六種力，方能成辦九種心住」</text>\n<text x=\"105.0\" y=\"74\" font-size=\"10.4\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\">内住</text>\n<rect x=\"64.0\" y=\"92.0\" width=\"82.0\" height=\"26.0\" rx=\"4\" fill=\"rgba(164,85,63,0.18)\" stroke=\"#a4553f\" stroke-width=\"1\"/>\n<text x=\"105.0\" y=\"109\" font-size=\"9\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.9\">力励</text>\n<rect x olor\" font-weight=\"400\" opacity=\"0.95\">串习</text>\n<text x=\"780.0\" y=\"166\" font-size=\"8.2\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.45\">8–9</text>\n<text x=\"12\" y=\"190\" font-size=\"9.6\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.7\">四作意：力励（1–2）→ 有间缺（3–7）→ 无间缺（8）→ 无功用（9）</text>\n<text x=\"12\" y=\"206\" font-size=\"9.6\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.7\">六力：闻思（1–2）｜忆念（3–4）｜正知（5–6）｜精进（7）｜串习（8–9）</text>\n<text x=\"12\" y=\"221\" font-size=\"8.6\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.45\">注：第 8 住之配属，底本「精進力…最極寂靜專注一趣，由串習力…等持成滿」一句连读，诸家科判微异〔待核〕。</text>\n</svg>\n<figcaption style=\"font-size:0.74em;color:var(--text2,#777);margin-top:7px;line-height:1.65\">图 5｜禅修进度表：每一住对应的「劲力」（四作意）与「凭什么进步」（六力）。九住非九个阶位，而是同一心一境性的九种成熟度。</figcaption>\n</figure>\n\n六力是「凭什么进步」，四作意是「用多大的劲」。二者与九住交叉，汇成精确的禅修进度表。宗喀巴《菩提道次第广论》讲奢摩他时，虽以《辨中边论》的「八断行断五过失」为骨架，却特别依〈声闻地〉的九住心、六力、四作意作为检验标准〔大意〕——这正是本论对后世实修影响最深的一处。\n\n九住之后，本论又立**四种毗钵舍那**：「謂有苾芻，依止內心奢摩他故，於諸法中能正思擇、最極思擇、周遍尋思、周遍伺察。」——止成之后，观才有力；这与「先止后观」的通途完全一致。\n\n### 7.3 三摩呬多地：定中的诸相与「爱味」之险\n\n卷 11 起是三摩呬多地，总标五门：\n\n> 「云何三摩呬多地？嗢拕南曰：總標、與安立、作意、相差別、攝諸經宗要、最後眾雜義。」\n\n这一地广明静虑、解脱、等持、等至的种种相，其中最值得初读者留意的是「爱味相应静虑」：\n\n> 「云何愛味相應靜慮等定？謂有鈍根，或貪行故，或煩惱多故。彼唯得聞初靜慮等所有功德，廣說如前愛上靜慮。於上出離不了知故，便生愛味，戀著堅住。其所愛味，當言已出；其能愛味，當言正入。」\n\n**定中的陷阱，不是散乱，而是爱味**：得少为足，恋著定乐，便不再上求。本论把「爱味」与「清净」并列辨析，正是要把「定」与「解脱」分开——定是共外道的，解脱才是不共的。〔本文判断〕\n\n> **英译对读 · 第七节**\n>\n> Fascicle 26 is the heart of the śrāvaka stage's contemplation. It divides objects into four: the all-pervading, the purificatory, the skillful, and the affliction-purifying. The all-pervading opens into four — images with discrimination, images without discrimination, the limit of things, and accomplishment of the task. The first is observation on the \"counterpart image\" of a known object (impurity, loving-kindness, dependent arising, breath, the aggregates, the truths); the second is calm abiding; the third is the limit of the conditioned and the unconditioned; the fourth is the fruit of cultivation. Together they form a complete structure: **observation through discriminated images, calm through undiscriminated ones, realization through the limit of things, fruit through accomplishment.**\n>\n> Fascicle 30's nine abidings are the shared standard of Chinese and Tibetan practice: \"What are the nine abidings of mind? A monk causes the mind to abide inwardly, to abide evenly, to abide, to abide near, to be tamed, to be pacified, to be utterly pacified, to be focused on one point, and to attain equipoise.\" Each is defined — initial inward abiding is \"gathering the mind from all external objects and tying it within, so it does not scatter\"; even abiding is refining it \"by continuity and clarity\"; abiding is restoring it when lost. **They are not nine ranks but nine degrees of ripeness of one act**: from pulling the mind back to resting without effort. With them the treatise pairs **six powers** (hearing, reflection, mindfulness, clear comprehension, effort, habituation) and **four attentions** (forced, interrupted, uninterrupted, effortless), cross-mapping exactly onto the nine — a precise progress chart of practice. Tsongkhapa's *Lam rim chen mo* uses the eight antidotes and five faults as its frame for calm abiding, but adopts this nine-abiding scheme as its check standard — the treatise's deepest influence on later practice.\n>\n> Fascicle 11 opens the stage of absorption with five heads: general mark, establishment, attention, marks, scriptural essentials, and miscellaneous. Its most instructive warning is \"absorption accompanied by relish\": \"What is absorption accompanied by relish? One of dull faculties, greedy or affliction-heavy, hears only of the first absorption's qualities; not understanding the escape beyond, he generates relish, clings and dwells in it.\" **The trap in absorption is not distraction but relish** — taking the lesser as enough and going no further. Placing relish beside purity is how the treatise separates absorption (shared with non-Buddhists) from liberation (not shared).\n\n## 八、重点阐释四·菩萨地：十法、四持、十三住\n\n〈菩萨地〉十六卷，是全论篇幅最大、结构最严的部分。它一开篇便以「十法」总摄大乘：\n\n> 「云何菩薩地？嗢拕南曰：初持、次相、分、增上意樂、住、生、攝受、地、行、建立最為後。有十法具攝大乘菩薩道及果。何等為十？一者、持，二者、相，三者、分，四者、增上意樂，五者、住，六者、生，七者、攝受，八者、地，九者、行，十者、建立。」\n\n十法之中，「持」是总纲。全地由此分为**四持瑜伽处**（底本科判明标）：\n\n| 四持 | 卷 | 主要内容 |\n|---|---|---|\n| 初持瑜伽处 | 35–46 | 种姓、发心、自他利、真实义、威力、成熟、力种姓、忍、精进、慧、摄事、供养、菩提分、功德等品 |\n| 第二持随法瑜伽处 | 47–48 | 相品、分品、增上意乐品、住品 |\n| 第三持究竟瑜伽处 | 48–50 | 生品、摄受品、地品、行品、建立品 |\n| 第四持次第瑜伽处 | 50 | 发正等菩提心品（总叙次第） |\n\n<figure style=\"margin:16px 0 20px\">\n<svg viewBox=\"0 0 900 240\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:920px;display:block\" role=\"img\" aria-label=\"菩萨地四持卷界图\"><defs><marker id=\"arw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#b8863c\"/></marker></defs>\n<text x=\"12\" y=\"26\" font-size=\"13.5\" fill=\"currentColor\" font-weight=\"600\">菩萨地 35–50 · 二十八品入四持</text>\n<text x=\"12\" y=\"44\" font-size=\"9.6\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.55\">条长＝卷数；条后数字为该持品数（据底本科判）</text>\n<text x=\"316\" y=\"78\" font-size=\"10.2\" text-anchor=\"end\" fill=\"currentColor\" font-weight=\"400\">初持瑜伽处 · 持品等</text>\n<rect x=\"330.0\" y=\"64.0\" width=\"357.0\" height=\"22.0\" rx=\"3\" fill=\"rgba(184,134,60,0.20)\" stroke=\"#b8863c\" stroke-width=\"1\"/>\n<text x=\"337.0\" y=\"79\" font-size=\"8.8\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.9\">卷 35–46</text>\n<text x=\"696.0\" y=\"79\" font-size=\"9.6\" fill=\"#b8863c\" font-weight=\"600\">18 品</text>\n<text x=\"316\" y=\"112\" font-size=\"10.2\" text-anchor=\"end\" fill=\"currentColor\" font-weight=\"400\">第二持随法瑜伽处 · 相／分／增上意乐／住</text>\n<rect x=\"687.0\" y=\"98.0\" width=\"59.5\" height=\"22.0\" rx=\"3\" fill=\"rgba(94,139,158,0.20)\" stroke=\"#5e8b9e\" stroke-width=\"1\"/>\n<text x=\"694.0\" y=\"113\" font-size=\"8.8\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.9\">卷 47–48</text>\n<text x=\"755.5\" y=\"113\" font-size=\"9.6\" fill=\"#b8863c\" font-weight=\"600\">4 品</text>\n<text x=\"316\" y=\"146\" font-size=\"10.2\" text-anchor=\"end\" fill=\"currentColor\" font-weight=\"400\">第三持究竟瑜伽处 · 生／摄受／地／行／建立</text>\n<rect x=\"716.8\" y=\"132.0\" width=\"89.2\" height=\"22.0\" rx=\"3\" fill=\"rgba(111,143,106,0.20)\" stroke=\"#6f8f6a\" stroke-width=\"1\"/>\n<text x=\"723.75\" y=\"147\" font-size=\"8.8\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.9\">卷 48–50</text>\n<text x=\"815.0\" y=\"147\" font-size=\"9.6\" fill=\"#b8863c\" font-weight=\"600\">5 品</text>\n<text x=\"316\" y=\"180\" font-size=\"10.2\" text-anchor=\"end\" fill=\"currentColor\" font-weight=\"400\">第四持次第瑜伽处 · 发正等菩提心</text>\n<rect x=\"776.2\" y=\"166.0\" width=\"29.8\" height=\"22.0\" rx=\"3\" fill=\"rgba(164,85,63,0.18)\" stroke=\"#a4553f\" stroke-width=\"1\"/>\n<text x=\"783.25\" y=\"181\" font-size=\"8.8\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.9\">卷 50</text>\n<text x=\"815.0\" y=\"181\" font-size=\"9.6\" fill=\"#b8863c\" font-weight=\"600\">1 品</text>\n<line x1=\"330.0\" y1=\"198.0\" x2=\"806.0\" y2=\"198.0\" stroke=\"currentColor\" stroke-width=\"1\" opacity=\"0.25\"/>\n<line x1=\"330.0\" y1=\"198.0\" x2=\"330.0\" y2=\"203.0\" stroke=\"currentColor\" stroke-width=\"1\" opacity=\"0.3\"/>\n<text x=\"330.0\" y=\"217\" font-size=\"9\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.5\">35</text>\n<line x1=\"478.8\" y1=\"198.0\" x2=\"478.8\" y2=\"203.0\" stroke=\"currentColor\" stroke-width=\"1\" opacity=\"0.3\"/>\n<text x=\"478.75\" y=\"217\" font-size=\"9\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.5\">40</text>\n<line x1=\"627.5\" y1=\"198.0\" x2=\"627.5\" y2=\"203.0\" stroke=\"currentColor\" stroke-width=\"1\" opacity=\"0.3\"/>\n<text x=\"627.5\" y=\"217\" font-size=\"9\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.5\">45</text>\n<line x1=\"776.2\" y1=\"198.0\" x2=\"776.2\" y2=\"203.0\" stroke=\"currentColor\" stroke-width=\"1\" opacity=\"0.3\"/>\n<text x=\"776.25\" y=\"217\" font-size=\"9\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.5\">50</text>\n<text x=\"810\" y=\"217\" font-size=\"9\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.45\">卷</text>\n</svg>\n<figcaption style=\"font-size:0.74em;color:var(--text2,#777);margin-top:7px;line-height:1.65\">图 4｜菩萨地二十八品归四持：初持十八品（35–46）、第二持四品（47–48）、第三持五品（48–50）、第四持一品（50）。48 与 50 两卷跨持，故条带重叠。</figcaption>\n</figure>\n\n二十八品的逐品卷次（底本科判＋学界通行〔大意〕）：初持十八品——种性品（卷 35）、发心品（35）、自他利品（35–36）、真实义品（36）、威力品（37）、成熟品（约 37–38）、菩提品（38）、力种性品（38）、施品（39）、戒品（40–42）、忍品（42）、精进品（42）、静虑品（约 42–43）、慧品（43）、摄事品（43）、供养亲近无量品（44）、菩提分品（44–46）、功德品（46）；次持四品——菩萨相品（47）、分品（47）、增上意乐品（47）、住品（47–48）；究竟持五品——生品（48）、摄受品（48）、地品（49）、行品（49）、建立品（49–50）；第四持一品——发正等菩提心品（50）。施、戒、忍、精进、静虑、慧六项各按九相展开（自性、一切、难行、一切门、善士、一切种、遂求、此世他世乐、清净），篇幅占全地四分之一以上。\n\n「持」的定义在卷 35：由自乘种性、最初发心、一切菩提分法三部分构成，即**种性持（堪任性）、发心持（行加行）、加行持（所圆满大菩提）**。种性又分本性住种性（无始来法尔所得）与习所成种性（串习善根所得）；菩萨种性胜于二乘有四——根胜、行胜、善巧胜（二乘只于内明求善巧，菩萨遍学五明）、果胜。发心分自性、行相、所缘、功德、最胜五项；论中所说属世俗发心，非证法性的胜义发心。〔大意〕\n\n**十三住**是〈住品〉的核心。卷 47 以偈列名：\n\n> 「云何菩薩十二住等？嗢拕南曰：種性、勝解行、極喜、增上戒、增上心、三慧、無相有功用、無相無功用、及以無礙解、最上菩薩住，最極如來住。」\n\n十二菩萨住加如来第十三住，合为十三。值得注意的是「三慧」处开出三种增上慧住（觉分相应、诸谛相应、缘起流转止息相应），所以十二菩萨住加如来第十三住，共十三个位次名——这种「偈摄其纲、长行开其目」的写法，是本论的标准体例，读时须以长行为准。与十地的对应：前两住属地前（胜解行住），极欢喜住至最上菩萨住十住依次对应十地；论中屡称十地「广说如《十地经》」——有学者据此认为十三住原以声闻行位为基础，后来才摄入十地〔大意〕。可以说，<figure style=\"margin:16px 0 20px\">\n<svg viewBox=\"0 0 900 371\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:920px;display:block\" role=\"img\" aria-label=\"十三住与十地对应图\"><defs><marker id=\"arw\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#b8863c\"/></marker></defs>\n<text x=\"12\" y=\"26\" font-size=\"13.5\" fill=\"currentColor\" font-weight=\"600\">十三住 × 十地</text>\n<text x=\"150\" y=\"26\" font-size=\"9.6\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.5\">十二菩萨住＋如来住</text>\n<text x=\"126\" y=\"44\" font-size=\"8.8\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.45\">住名</text>\n<text x=\"628\" y=\"44\" font-size=\"8.8\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.45\">地</text>\n<text x=\"742\" y=\"44\" font-size=\"8.8\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.45\">分位</text>\n<rect x=\"126.0\" y=\"52.0\" width=\"472.0\" height=\"16.0\" rx=\"3\" fill=\"rgba(94,139,158,0.20)\" stroke=\"#5e8b9e\" stroke-width=\"1\"/>\n<text x=\"136\" y=\"64\" font-size=\"10.2\" fill=\"currentColor\" font-weight=\"500\">種性住</text>\n<rect x=\"620.0\" y=\"53.0\" width=\"56.0\" height=\"14.0\" rx=\"3\" fill=\"rgba(0,0,0,0.05)\"/>\n<text x=\"648\" y=\"63.4\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.8\">地前</text>\n<rect x=\"126.0\" y=\"73.0\" width=\"472.0\" height=\"16.0\" rx=\"3\" fill=\"rgba(94,139,158,0.20)\" stroke=\"#5e8b9e\" stroke-width=\"1\"/>\n<text x=\"136\" y=\"85\" font-size=\"10.2\" fill=\"currentColor\" font-weight=\"500\">勝解行住</text>\n<rect x=\"620.0\" y=\"74.0\" width=\"56.0\" height=\"14.0\" rx=\"3\" fill=\"rgba(0,0,0,0.05)\"/>\n<text x=\"648\" y=\"84.4\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.8\">地前</text>\n<rect x=\"126.0\" y=\"94.0\" width=\"472.0\" height=\"16.0\" rx=\"3\" fill=\"rgba(184,134,60,0.20)\" stroke=\"#b8863c\" stroke-width=\"1\"/>\n<text x=\"136\" y=\"106\" font-size=\"10.2\" fill=\"currentColor\" font-weight=\"500\">極歡喜住</text>\n<rect x=\"620.0\" y=\"95.0\" width=\"56.0\" height=\"14.0\" rx=\"3\" fill=\"rgba(0,0,0,0.05)\"/>\n<text x=\"648\" y=\"105.4\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"400\" opacity=\"0.8\">初地</text>\n<rect x=\"126.0\" y=\"115.0\" width=\"472.0\" height=\"16.0\" rx=\"3\" fill=\"rgba(184,
