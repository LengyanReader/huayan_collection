  function skip(node){
    var p = node.parentElement;
    while(p && p !== document.body){
      var tag = p.tagName;
      if(tag==='A'||tag==='CODE'||tag==='PRE'||tag==='BLOCKQUOTE') return true;
      var cls = p.getAttribute ? (p.getAttribute('class')||'') : '';
      if(/\b(q|quote|cite-card|lic)\b/.test(cls)) return true;
      p = p.parentElement;
    }
    return false;
  }
  function linkify(){
    var root = document.getElementById('article-root');
    if(!root) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var edits = [];
    var tn;
    while((tn = walker.nextNode())){
      if(skip(tn)) continue;
      var text = tn.textContent;

        var nm = NAMES[i], pos = text.indexOf(nm);
        if(pos < 0) continue;
        edits.push({node:tn, name:nm, pid:MAP[nm], pos:pos});

    }
    if(edits.length) console.log('[lin-deeplink] linked %d mentions' % edits.length);

  else window.addEventListener('load', function(){ setTimeout(linkify,100); });
})();
</script>

<script>
var ARTICLE = {"id": "huayan-shixing-pin", "file": "articles/huayan-shixing-pin.html", "title": "九九华严第二十一品 十行品之拼读", "title_sub": "第四会正宗·卷二十～二十一·品文11806·长行44段+重颂2828·功德林入善思惟三昧说十行（欢喜/饶益/无违逆/无屈挠/离痴乱/善现/无著/难得/善法/真实=十波罗蜜行位化）·藏26功德林开篇实测·L.253核心成文", "icon": "🌳", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第四会_夜摩天宫_差别因果周/华严经细读_第二十一部_十行品.md", "doc_md": "# 华严经细读·第二十一部《十行品》之拼读\n\n> **EN · Close Reading of the Avataṃsaka Sūtra, Part Twenty-One: The Chapter of the Ten Practices**\n\n> **底本**：唐·实叉难陀译《大方广佛华严经》（八十华严）`T10n0279`。**范围：卷第二十～二十一（本品全文，品号第二十一）**。本品属**第四会「夜摩天宫会」·正宗**，承品 19 升殿·品 20 偈赞之「由致·赞德」，以功德林菩萨说十行为「正陈所修」。\n\n---\n\n## 〇、凡例（简要）\n\n一、**校勘底本**：八十华严 `T10n0279` 为底本。\n二、**引文可回源**：经文引块由提取器程序注入（0 手抄）。\n三、**疏解三层**：疏解/名相/会读。\n四、**存疑必标**〔待核〕〔本文判断〕。\n五、**异文各照底本**。\n\n<!-- ATLAS:BEGIN P21 -->\n### 〇之零、导读指南（阅读路径与方法）\n\n**定位：** 考证型细读（philological close reading），以「可复核性」为第一优先。本品为第四会「正宗」——功德林入善思惟三昧，十方万佛同名加持，起定说十波罗蜜之行位化（欢喜→真实），一味以「行」为法，故读法以**十行十度**为纲。\n**本品一句：** **十波罗蜜之行位化**——欢喜（檀）→饶益（戒）→无违逆（忍）→无屈挠（进）→离痴乱（禅）→善现（慧）→无著（方便）→难得（愿）→善法（力）→真实（智）；品 20 觉林「心画师」为本品之义理前提。\n**路径：** 〇之二（二图四表）→ 一（品题与脉络）→ 二（全文逐段）→ 四（义理与名相）→ 五（诸家会读）→ 七（数据层）→ 附录按需查阅。\n**方法：** 先经文后诠释；〔实测〕／〔本文判断〕／〔存疑待核〕三分；负面证据同样入账；结构覆盖 100%，个体择要。\n**读前三问：** ① 十行何以一一对应十波罗蜜？② 欢喜居首之义何在？③ 李通玄「都会断惑次第」独门何所表？\n\n## 〇之二、本品内容地图（未入其门，先观其海）\n\n> **本节体例。** 图与表之数据，一律取自本文已回源核定之 §二逐段表与 §7.1／§7.5 实测数；**凡属推断者标〔本文判断〕，不入图**。图各看一事，勿求一图而尽本品。\n\n### 〇之二.0 提要\n\n本品占**卷第二十～二十一**，剥校勘 **CJK 11,806 字**。结构：**入定加持**（功德林入善思惟三昧·万佛同名加持）→**总标十行**→**十行各说**（各段含行相与利益）→**重颂**（2,828 CJK·一心敬礼十力尊起）。十行＝十波罗蜜之行位化：檀·戒·忍·进·禅·慧·方便·愿·力·智。\n\n| 图 | 画什么 | 一句话 |\n|---|---|---|\n| **图 〇-1　十行·十波罗蜜对照图** | 十行与十度之配位 | 欢喜=檀→饶益=戒→…→真实=智 |\n\n**〔读法之序〕**　先读 §2.0 十行总表以得其位（十度配位），次入 §2.3–2.12 逐行细读，末观重颂之偈体总持。**位既明，行始可拟。**\n\n> **EN corresponding · Map of the Chapter.** The ortho dox chapter of the fourth assembly: Dharma-Grove Bodhisattva enters samādhi, is empowered by ten thousand Buddhas of the same name, and expounds the ten practices — each mapped to one of the ten pāramitās. A 2,828-character recapitulation verse closes the chapter.\n\n### 〇之二.1 图 〇-1　十行·十波罗蜜对照图\n\n<figure>\n<svg viewBox=\"0 0 1000 420\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"26\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">十行品·十波罗蜜行位化对照</text>\n<text x=\"500\" y=\"46\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#8a7a5e\">左＝十行名（本品）；右＝十波罗蜜（义配）</text>\n<text x=\"60\" y=\"90\" font-size=\"12\" fill=\"#5a5147\">一 歡喜行</text><rect x=\"280\" y=\"76\" width=\"180\" height=\"20\" fill=\"#d4a03c\" stroke=\"#b8863c\"/><text x=\"470\" y=\"90\" font-size=\"11\" fill=\"#5a5147\">檀波罗蜜（布施）</text>\n<text x=\"60\" y=\"124\" font-size=\"12\" fill=\"#5a5147\">二 饒益行</text><rect x=\"280\" y=\"110\" width=\"180\" height=\"20\" fill=\"#c9a25a\" stroke=\"#b8863c\"/><text x=\"470\" y=\"124\" font-size=\"11\" fill=\"#5a5147\">戒波罗蜜（持戒）</text>\n<text x=\"60\" y=\"158\" font-size=\"12\" fill=\"#5a5147\">三 無違逆行</text><rect x=\"280\" y=\"144\" width=\"180\" height=\"20\" fill=\"#b8863c\" stroke=\"#7a5a28\"/><text x=\"470\" y=\"158\" font-size=\"11\" fill=\"#5a5147\">忍波罗蜜（忍辱）</text>\n<text x=\"60\" y=\"192\" font-size=\"12\" fill=\"#5a5147\">四 無屈撓行</text><rect x=\"280\" y=\"178\" width=\"180\" height=\"20\" fill=\"#b8863c\" stroke=\"#7a5a28\"/><text x=\"470\" y=\"192\" font-size=\"11\" fill=\"#5a5147\">进波罗蜜（精进）</text>\n<text x=\"60\" y=\"226\" font-size=\"12\" fill=\"#5a5147\">五 離癡亂行</text><rect x=\"280\" y=\"212\" width=\"180\" height=\"20\" fill=\"#a8815a\" stroke=\"#7a5a28\"/><text x=\"470\" y=\"226\" font-size=\"11\" fill=\"#5a5147\">禅波罗蜜（禅定）</text>\n<text x=\"60\" y=\"260\" font-size=\"12\" fill=\"#5a5147\">六 善現行</text><rect x=\"280\" y=\"246\" width=\"180\" height=\"20\" fill=\"#8a7a5e\" stroke=\"#7a5a28\"/><text x=\"470\" y=\"260\" font-size=\"11\" fill=\"#5a5147\">慧波罗蜜（般若）</text>\n<text x=\"60\" y=\"294\" font-size=\"12\" fill=\"#5a5147\">七 無著行</text><rect x=\"280\" y=\"280\" width=\"180\" height=\"20\" fill=\"#8a7a5e\" stroke=\"#7a5a28\"/><text x=\"470\" y=\"294\" font-size=\"11\" fill=\"#5a5147\">方便波罗蜜</text>\n<text x=\"60\" y=\"328\" font-size=\"12\" fill=\"#5a5147\">八 難得行</text><rect x=\"280\" y=\"314\" width=\"180\" height=\"20\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"470\" y=\"328\" font-size=\"11\" fill=\"#5a5147\">愿波罗蜜</text>\n<text x=\"60\" y=\"362\" font-size=\"12\" fill=\"#5a5147\">九 善法行</text><rect x=\"280\" y=\"348\" width=\"180\" height=\"20\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"470\" y=\"362\" font-size=\"11\" fill=\"#5a5147\">力波罗蜜</text>\n<text x=\"60\" y=\"396\" font-size=\"12\" fill=\"#5a5147\">十 真實行</text><rect x=\"280\" y=\"382\" width=\"180\" height=\"20\" fill=\"#d4a03c\" stroke=\"#b8863c\"/><text x=\"470\" y=\"396\" font-size=\"11\" fill=\"#5a5147\">智波罗蜜</text>\n<text x=\"700\" y=\"200\" font-size=\"11.5\" fill=\"#8a7a5e\">前六＝六波罗蜜扩充；</text>\n<text x=\"700\" y=\"220\" font-size=\"11.5\" fill=\"#8a7a5e\">后四（方便·愿·力·智）＝华严增列；</text>\n<text x=\"700\" y=\"240\" font-size=\"11.5\" fill=\"#8a7a5e\">十行即十度之行相化。</text>\n</svg>\n<figcaption><b>图 〇-1　十行·十波罗蜜对照图。</b>十行与十波罗蜜之一一配位（§2.2 总标）；前六承传统六度，后四为华严增列。<div class=\"en-line\">Fig. 0-1. The ten practices mapped one-to-one to the ten pāramitās: the first six extend the traditional six, the last four are the Huayan addition (skillful means, vows, powers, knowledge).</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. 先看配位：**十行＝十度**，非十种孤立行为而系波罗蜜之行相化。\n2. 再看**色阶**：前六深色（传统）·后四浅色（华严增列）——色彩即义理层。\n3. 末问：为何「欢喜」居首而非「布施」？——欢喜是布施之**相**（心态），非行为本身。\n\n### 〇之二.2 本品在第四会（夜摩天宫·十行位）之坐标\n\n本品在第四会居「正宗」位：承品 20 偈赞（赞德显体），正陈十行；次品十无尽藏说十藏（胜进）。\n\n| 品 | 卷 | 位／科 | 一句提撕 | 与本品之关系 |\n|---|---|---|---|---|\n| 夜摩宫中偈赞品（品 20） | 卷十九次品 | 第四会·赞德显体 | 十林菩萨偈赞 102 偈 | 本品之人事预备（功德林=说主） |\n| 十无尽藏品（品 22） | 卷二十一～二十二 | 第四会·胜进 | 十藏（信/戒/惭/愧/…） | 十行之体化 |\n| 十住品（品 15） | 卷十六 | 第三会·正说 | 法慧说十住 | 位→行之递进（§3.2） |\n| 藏译 Toh 44 ch 26 | 德格 035 卷 fol 305a | 功德林（ཡོན་ཏན་དང་ལྡན་པ）说十行 | 与本品功德林说十行直接相应 | 对应判读〔本文判断〕·逐字对勘未作〔待核〕 |\n\n### 〇之二.3 本品形式特征（与邻品对看）\n\n本品之形式特征皆与邻品对看而得。\n\n| 特征 | 本品表现〔实测〕 | 邻品之对照 | 读法上的后果 |\n|---|---|---|---|\n| 篇幅 | 11,806 CJK／44 `<p>`＋重颂 2,828 | 品 20 的 2,543 | 第四会正宗之体量 |\n| 十行体例 | 各段「佛子！何等为菩萨摩诃萨X行」起·行相＋利益 | 品 20 十组各「承佛威力」起 | 散文说行·偈体赞佛 |\n| 配位 | 十行＝十波罗蜜 | 品 15 十住＝十支 | 位（住）与行（行）之法义递进 |\n| 重颂 | 2,828 CJK·一心敬礼十力尊起 | 品 17 重颂 121 颂 | 偈体总持（行相之偈化） |\n\n### 〇之二.4 五种读法（导览）\n\n| 读法 | 路径 | 适合谁 | 得什么 |\n|---|---|---|---|\n| 配位读法 | 图 〇-1 → §2.2 总标 | 结构读者 | 十行×十度之一一配位 |\n| 义理读法 | §4.1–4.3 | 义理读者 | 欢喜居首·心画师先声·无生行 |\n| 对勘读法 | §6.3＋〇之二.5 | 版本学读者 | 藏 26 功德林开篇相应 |\n| 会读读法 | §5 各家＋5.4 启发 | 会读者 | 李通玄断惑地图独门 |\n| 数据读法 | §7 L1 实测 | 数据读者 | 11,806 CJK/44 段/重颂 2,828 |\n\n### 〇之二.5 数与位之谱：本品之数，四等分录\n\n华严之数非计数之数。本品所涉之数，来源不一，性质亦不一；**先分其等，后论其义**，则不为数目所惑。\n\n| 等第 | 数 | 出处 | 性质 |\n|---|---|---|---|\n| **T0 经文明文** | 十行名目（欢喜→真实） | §2.2（`T10n0279` 总标实点） | 十度配位 |\n| **T0 经文明文** | 重颂 2,828 CJK | §2.13（`<lg>`×1） | 偈体总持 |\n| **T0 本文实测** | 11,806 字／44 `<p>`／1 `<lg>` | §7.1（剥校勘） | 篇幅与信度 |\n| **T1 注疏** | 「十行者。行谓行甫。……十身十土皆此所成」 | `T1735` 疏卷二十三（§5.1） | 十行之位判 |\n| **T0·藏本实测** | 藏 26 开篇功德林（ཡོན་ཏན་དང་ལྡན་པ）佛神力说十行 | L.201 TOC（fol 305a） | 开篇相应·逐字对勘未作 |\n\n> **〔读法〕** 本品之数以「**配位**」为性：十行即十度、一度一行——数即义、义即数；**行相虽广，不出十度**。\n\n<!-- ATLAS:END P21 -->\n\n## 一、概述与品题解义\n\n### 1.1 品题释义\n\n**品名**：**十行品第二十一**。「十行」＝菩萨摩诃萨之十种行门，每位以一波罗蜜为骨，行相广说如经。**功德林菩萨**为说主——品 20 十菩萨之首，「林」即十行之茂盛相（§第二十部 §1.2）。\n\n### 1.2 品位与脉络\n\n本品为第四会「正宗」（澄观四品三分·§第十九部 §1.2），承品 19 升殿·品 20 偈赞之「由致·赞德」，正陈十行之行相。**十住（品 15）→十行（品 21）**：住是位中之安，行是位中之**走**——从安住到遍行，第三会与第四会之法义递进。\n\n### 1.3 篇幅与结构预览\n\n**实测**：品文净 **11,806 CJK**，**长行 44 段**＋**重颂组 1**（2,828 CJK）。结构为**入定加持（序）→总标十行→十行各说（各含行相与利益）→重颂**。十行一一对应十波罗蜜：\n\n| 行 | 名 | 义 |\n|---|---|---|\n| 1 | 歡喜行 | 大施主·凡所有物悉能惠施·心平等無悔吝（檀波罗蜜） |\n| 2 | 饒益行 | 护持净戒·心无所著·不求威势种族（戒波罗蜜） |\n| 3 | 無違逆行 | 常修忍法·谦下恭敬·不自害不他害（忍波罗蜜） |\n| 4 | 無屈撓行 | 精进不懈·求一切智·恒不舍离（进波罗蜜） |\n| 5 | 離癡亂行 | 心无痴乱·住禅定·正念不动（禅波罗蜜） |\n| 6 | 善現行 | 身业语业意业清净·住无所得（慧波罗蜜） |\n| 7 | 無著行 | 善能示现·处处受生·不着受生（方便波罗蜜） |\n| 8 | 難得行 | 成就难得·种诸善根·圆满愿行（愿波罗蜜） |\n| 9 | 善法行 | 具足善法·坚固不退·诸行成就（力波罗蜜） |\n| 10 | 真實行 | 如实了知·真实智慧·诸法实相（智波罗蜜） |\n\n## 二、卷第二十～二十一（十行品第二十一·本品全文逐段细读）\n\n### 2.0′ 玄记体总纲（据澄观《华严经疏》`T1735`·L.370·疏文程序切片回源）\n\n**门目（疏文实录·至四釋文前）**：\n\n> 十行品1十行品第二十一從第十九經半盡第二十一經來意有二:一前序、此正故;二前辨所依佛智,此辨能依之行故。二釋名者,隨緣順理,造修名行。數越塵沙,寄圓辨十。《仁王》名為十止,就三學中定心增故。《梵網》名為長養,長道根故。若具梵本,應云功德華聚。菩薩說十行品則兼能說人,今文略耳。宗趣,可知。\n\n**释文**（疏文实录）：\n\n四釋文者,此品不同前二,有行德者以行為主,故略無之。又行德已純熟,進趣中收,故唯一品義當行中之解。品有七分:一三昧分、二加分、三起分、四本分、五說分、六現證分、七重頌分。今初三昧分。功德林入者,為眾首故,表說十行眾德建立故。承佛神力,是入定因。入菩薩善思惟者,顯定別名。揀因異果,故名菩薩;巧順事理揀擇無礙,無心成事,名善思惟。二「入是」已下明加分,有三:初總辨作加因緣、二辨加所為、三正顯加相。初中四:一總標加因、二「十方」下加緣顯現、三「告功德林」下讚有加因、四「善男子」下雙顯加定因緣。於中二:初別顯所因、二「令汝入」下結因所屬。今初,亦有四因:一伴佛同加,準十住會即是神力加也;二主佛宿願。三主佛現威;四大眾機感。略無助化善根,或是諸字中攝故。餘義具於前會。二「為增長」下辨加所為,有十一句:前十別明、後「所謂」下一句總結,乃至起分皆同前會,但住行之殊。第三「善男子」下正辨加相中三:初語業加,命其說故。二「是時諸佛」下意業加,與智慧故。有別顯、徵釋。別顯中,初總、餘別。別中,一捷辯;二無斷辯;三無師智,前後二會並無此智,即是本覺之智,了因自得、悟不由師,假佛緣顯故得云與。及無癡智,並是迅辯。四應辯;五無謬錯辯;六豐義味辯;七一切世間最上妙辯;八總策前七;九此七無勝。三「爾時」下身業加,增威力故。第三「時功德林」下起分,可知。第四「告諸」下本分,文二:初行體、後行相。前中,若約所依,即前善思三昧為體;若約所觀,即二諦雙融;若約能觀,悲智無礙。今從教相,即下四行為體。若約十行別體,即以十波羅蜜為體,義見初會。今就教相中,若直就經文,文分為二:初標顯、二「何以」下徵釋。初中,先標行體難思,行即深心所修行海也。「與法界」下顯難思之相,深等法界、廣齊虛空,故心言罔及也。又超下位,名不思議。又即理之事行,同事法界之無量,等虛空之無邊;即事之理行,同理法界之寂寥、等虛空之絕相。此二俱非言之表詮、心之顯詮,故難思議。況二交徹,能令一行攝一切行、一位攝一切位,純雜無礙故。第十行云入因陀羅網法界,成就如來無礙解脫,人中雄猛大師子吼,乃至到一切法實相源底故。又若唯遮者,則凡聖絕分故,非但遮常心言,亦應融常心言,是則於中思議不可盡也。遮融無二,則思與非思體俱寂滅,方曰真不思議。從徵釋中,何以因人之行便叵思耶?釋云:同佛果故,佛窮事行之邊、極理行之際,斷一切障、證一切理,因圓果滿融無障礙;菩薩同彼,寧可思議?若取論勢,菩薩行為總句,餘皆是別,不可思議即真實行也。彼約地前不見,此約凡愚叵思。亦名真實行布,位中無真如觀,故無觀相行。二與法界等,即是勝行,亦是佛本故。三與虛空等,即因行也。是無常因,亦未得地智,缺常果因也。四學三世佛而修行者,是不怯弱行。未能順理真實救護,故無大行。餘同前會。第二「佛子何等」下辨行相,文分為三:初總徵其名;二「佛子」下標數顯勝,故云三世諸佛同說;三「何等」下徵數列名,先徵、次列、後結。列中,然與《本業》名雖小異,而義意大同。一施悅自他故名歡喜。約三施說,在因皆悅,故下經云「為令眾生生歡喜」故。若就果說,財獲富饒無畏,身心安泰。法施當獲法喜,皆歡喜義。此約隨相。《本業》云「始入法空,不為外道邪論所倒。入正位故,名歡喜行。」此約離相。二三聚淨戒亦益自他,故名饒益。或以後攝前,《本業》云「得常化一切眾生法,皆利眾生故。」此唯據利他。三忍順物理,名無違逆。彼云得實法忍,無我我所,名無瞋恨;此約以後攝初。晉云無恚恨,亦是以初攝後。而實二忍順物、法忍順理,以後遵前,皆順事理。四勤無怠退,名無屈撓,亦通三勤。彼云常住功德現化眾生故名無盡,謂若有怠退斯則有盡。而《攝論》三精進中,三名無弱、無退、無喜足,則是以後攝初。五以慧資定,離沈掉故,名無癡亂。彼云命終之時,無明之鬼不亂不濁,住正念故,名離癡亂;此但從一義,故下經云「於死此生彼心無癡亂」。六慧能顯發三諦之理,般若現前故名善現。彼云生生常在佛國中生;此但據得報,謂即空照有而能現生。七不滯事理故名無著。彼云於我無我乃至一切法空故;此即涉有不迷於空,謂於我而無有我也。若於我無我皆不著者,則雙不滯也,以有不捨不受方便智故。八大願可尊故,又成大行願乃能得故,故名難得。彼云三世佛法中常敬順故,名尊重行。彼約修心,此約難勝。九善巧說法名善法行。彼經云「說法授人、動成物則故,同於九地法師位故。」十言行不虛故名真實,又稱二諦故。故彼經云「二諦非如、非相非非相,故名真實。」然上約十度釋名,度各有三,並見初會。第五「佛子何等為」下說分。十行則為十段,一一各三,謂一徵名、二釋相、三結名。今初,歡喜行即是檀度,初徵名中已如前釋。第二「佛子此菩薩」下釋相,分二:先略辨體相、後「修此行時」下廣顯名相。今初,《瑜伽.菩薩地》菩薩六度各有九門:一者自性,謂出行體;二者一切,謂能具行;三者難行,謂就中別顯;四者一切門,謂行差別;五者善士,謂作饒益;六者一切種,謂偏攝聖教;七者遂求,謂隨所須;八者與二世樂,謂於現在作大饒益,令得未來廣大安樂;九者清淨,謂勝離相成波羅蜜。今文分三,以攝於九:一總標施主、二「其心」下離所不應、三「但為」下彰其意樂。今初含攝前四及與六七,謂一者施主惠施,顯施自性。惠有二義,一惠即是施、二謂巧惠籌量可不。凡所有物悉能施者,攝餘五門,謂一若內若外、二若難若易、三財法無畏、四一切種門、五隨求與故。二離所不應,即清淨施。文有五句,以攝十義。心平等者,略有四義:一無執取,離妄見故;二不積聚施,觀漸與頓皆平等故;三不高舉,但行謙下,不與他競,離憍慢故;四無向背,不朋黨故。言無有悔悋者,此有三義:一不退弱,施已無悔故;二不下劣,勝物無悋故;三不留滯,速與無悋故。言不望果報者,不求異熟果故。不求名稱者,無所依故。不貪利養者,不望報恩故。三彰其意樂中有十二句,攝上二門,謂前十一句明善士施,此有五相:一但為救護者,不損惱故;二攝受者,自手授與故;三饒益者,應其時故。上三下益。次有八句,明其上攀,不出二意:一淨信故、二恭敬故。八中,一創起習學、二憶持不忘、三愛樂不捨、四淨治其障、五更修增廣、六住持不斷、七令不隱沒、八演以示人。後令諸眾生離苦得樂,結歸慈悲,即二世樂。上但為之言,流下諸句。又上救護是無畏施,攝受是財,饒益是法。第二廣顯名相中,廣前一切施也。亦具諸施,恐繁不配。文中二:先現行財施、後願行法施。財中復二:一隨相、二離相。前中亦二:一明施行、二迴向行。前中亦二:初願受勝生行施、二示異類身行施。前中,依無著論有六意樂:一方便、二歡喜、三恩德、四廣大、五善好、六清淨,下並具之。於中文四:一願具施緣,即方便意樂先作意故,亦即廣前為大施主;二「假使」下難求能求;三「爾時菩薩」下明難捨能捨,舉難況易,即便施者無留滯也;四「如是」下明一切無違,有三意樂:初即廣大意樂,能廣行故;二「但更」下即歡喜意樂也;三「作如是念」下恩德意樂也。「我今應」下是隨順心。第二「又作」下明示異類身而行布施。迴現施善未來受身,以悲深故,亦廣大心也。第二「以此」下迴向行。初自期大果,亦廣大意樂也;後願施田,亦得二果,是善好意樂。第二「菩薩如是」下明離相施,即清淨意樂也。隨相離相,行必同時、言不並彰,故分前後。應將離相別別貫前,如《大般若》,不欲繁文,故併居一處。前後體勢,類此可知。文分為三:初人空觀;次法空觀;後二觀之益,即成彼岸智。今初也。如是利益眾生者,牒前事行。欲顯正利益時,即無我想等故。所無之法略有十句。我謂主宰,諸蘊假者也。故《智論》三十五云「於五蘊中我我所心起」故。《瑜伽》大同此說。此句為總,但是一我,隨事立下別名。然由迷緣生實性,計有即蘊異蘊之我。既了性空,迷想斯寂,故云無也。若別別觀無之所以,如〈十定品〉第二定辨。二眾生者,《智論》云「五蘊和合中生」故。《瑜伽》名為有情,謂諸賢聖如實了知,唯有此法更無餘故。三有想者,《智論》、《瑜伽》俱名生者,謂計有我人能起眾事,如父生子故。有即所起諸趣生也。四命者,謂命根成就故。《瑜伽》云「壽命和合故活存現。」五種種者,《智論》名為眾數,謂陰、界、入等諸因緣是眾數法故。新譯名異生,能受異趣生故。六補特伽羅者,此云數取趣。《瑜伽》云「計有我人,數數往取諸趣無厭」故。此名依一聲中呼一人,若依多聲中呼多人,即云補特伽羅。七人者,有靈於土木之稱。《智論》云「行人法故。」《大般若》名士夫,《瑜伽》釋云「能作一切士夫用故。」八摩納婆,此云儒童。謂計有我人,為少年有學之者。此名依一聲中但呼一人,若呼多人多聲中呼。應云摩納婆嚩迦也。九作者者,作諸業故。《智論》云「手足能有所作故」。十受者者,《智論》云「計後世受罪福果報故」。《大般若》第三四、《大品》第二及《金剛般若》中說數有增減,名或小異,大意不殊。〈迴向〉、〈十定〉,準斯會釋。二「但觀」下明法空觀。菩薩既了法空,安有我耶?故上云人空,非如二乘人空法有,故此直云但觀法界空等。法界眾生界總舉,所觀法體不出此二。菩薩了之究竟無差,橫則無邊,等虛空故;竪則無際,離始終故。空法者,此二皆空也。空亦總句。何以知空?但有名字,無實所有故。無何所有?一外無自共之相狀;二內無有為無為之體性;三無所住之處,所謂不在內外中間有中住故;四無二法之相依,有去不留空故;五無造作之功用故無所有,無所有故空,空故眾生界即法界也。第三「作是」下觀益。九句皆云不見者,窮於法性,到彼岸故。初三即是三輪。福田者,施所生也。業約成因而招當果,剋獲為果,酬因曰報。習因習續於前,習果剋獲為後。習因習果通名為因,能牽後報,此報酬因,此則果通現得。又報謂有漏、果謂無漏,同是當果,漏無漏殊。小施小果,大施大果。第二願行法施,文分為二:初觀悲境,為起願由;二「我當盡學」下起願利益。不壞法性是堅固因,安隱快樂是堅固果。第二饒益行。釋相之中,先略、後廣,皆顯三聚含於九戒。今初,略中文三:初明持相、次彰離過、後顯持意。今初,初句為總,總該三聚即戒自性,「於色聲」下別釋淨義。意地無著,是真律義。亦為生說,即饒益有情戒也。二「不求」下彰其離過。亦是於果無依,顯清淨義。三「但堅持」下顯持戒意。初句為總,盡壽堅持。「作如是」下以誓自要成上堅相,謂一切利養、恭敬他論,本隨煩惱不能伏故。一切惡止,得佛正法,是真善行。纏謂八纏,即無慚、無愧、掉舉、惡作、惛、睡、慳、嫉。初二障戒,正障律儀;次二障止;次二障觀;後二障捨,即障善法饒益。於相修中,纏繞身心所以偏說。或說十纏,謂加忿、覆,於被舉時為重障故。此即隨惑。縛謂四縛,即貪欲、瞋恚、戒取、我見。貪利不遂熱惱生瞋,梵行命難則生毀謗,謗則戒取,我則濁亂。不毀不持,方為平等。第二「佛子菩薩如是」下廣顯三聚。即分為三:初攝律儀、二攝眾生、三攝善法。今初,即堅持不犯,為第一難持。文中亦二:先顯難持之境,謂多而且麗,加以惑心,日日長時,故為難也。後「爾時菩薩」下起觀對治,即能持於難持也。言乃至者,《大品》云「貪著五欲,障礙生天,況復菩提勝事皆障」,故云乃至。第二「唯除」下攝眾生戒。於中四:初明忘犯濟物,如祇陀末利唯酒唯戒,唯除教化即行於非道,不捨智心即通達佛道。二「佛子」下輕身益物,為第二難持,乃至捨命亦無缺故。三「菩薩自得」下彰持分齊,是第三難持,謂恒住正念無誤失故。即以難況易、以誤況故本性慣習故。分齊者,初發心住,了見心性成正覺故,解法無生常見佛故。觸境皆佛,豈容佛所生欲想耶?四「爾時菩薩」下明深起大悲是善士相。在文分三:初悲物著欲、二生勸持心、三徵釋所以。今初,七句,初二為總,無時不起,是長夜中想念。下別,一想念未得、二趣向可得、三貪著已得、四決謂為淨、五耽染無厭、六迷醉沈溺、七隨境流轉、八欲罷不能。二「我今」下生勸持心,初勸他持戒、次「住淨戒」下兼讚戒功德。三徵釋者,大悲益他,菩薩家業故。第三「作是學已」下明攝善法戒。文分為二:初明自分現攝、後辨勝進當攝。今初。善法雖多,不出悲智,故文中略舉。於中分三:初雙標悲智、二「然知」已下雙釋二相、三「如是解者」已下雙明二果。今初也,先智、後悲。智中,先明離過,謂離惡行無明;後「以智」下明其成德,「為眾生」下即是攝悲。二雙釋二相中,悲智雙運。文分為二:先以智導悲,自成正觀;二「一切諸法」下通明入法,顯彼倒因。今初,文有四對:前三二互相望、後一當體以辨。前三對中,前二不離、後一不即,即顯生之與倒非即離也。眾生即能起顛倒之人,乃染分依他;顛倒即所起之妄,是遍計所執。初對明不離者,謂依似執實故離生無倒,依執似起離倒無生。第二對明不相在,重釋前義。言不離者,明因果相待緣成,非先有體。二物相在,因中無果,故倒內無生。若必有者,則應遍計是依他起。果中無因,故生內無倒。若要令有者,則應無有不倒眾生。第三對明不即,不壞因果能所遍計之二相故。由前三對,則知生倒非一非異、非即非離。第四對當體以辨。倒心託境方生,故非內法。若是內者,無境應有。境由情計,故非外法。若是外者,智者於境不應不染。既非內外,寧在中間?則知心境當體自虛,將何對也?以明即離,眾生亦爾,即蘊求無,故非內法;離蘊亦無,故非外法。既非內外,亦絕中間,本性自空,何能起倒?將何對他?明非即離。既如是知,則自無倒。為物說此,倒惑自除。二「一切」下通明入法顯彼倒因。謂由不達緣成不堅,妄生遍計,故云誑惑愚夫。實則愚夫自誑,若獼猴執月。三「如是」已下雙明二果。即前悲智所成之果也,亦九戒中二世樂戒也。先總、後別。總中,由解諸法不實幻化,即是覺了諸行。了行相虛,名達生死。知行體寂,是了涅槃。了之究竟,即得菩提。「自得度」下別有九對:一度苦、二脫集,以了生死故。三調之以道、四寂之以滅,以了涅槃故。次四即證四諦之德,如次配上。謂由斷苦故,得安樂等。九即證佛菩提之樂。第二「佛子」已下勝進當攝,於中有二十句。前十具勝德,一順佛、二離世、三行勝法、四住等理、五等慈、六明智、七離過、八忘緣、九捨執、十不斷煩惱而入涅槃,後十住深智。末句為總,即是佛智。餘別顯深廣之義:一上無過、二言不及、三離依著、四無變動、五超數量、六無邊畔、七無終盡、八絕色相,由上故深。第三無違逆行,即是忍度。於釋相中,文分二別:初略辨行相、後對境正修。今初,分三:一修忍行、二離忍過、三修忍意。今初。常修忍法,即標行所屬。謙下等言,彰忍之相。文有十句:初總顯自性。謙尊而光卑而不可踰,若海之下百川歸焉,恭敬崇彼,安敢不忍。「不自害」下九句別明,通有三釋:一約三毒、二就三業、三據三忍。初云前三治瞋行忍,瞋必害故。一無如前境而自刑害;二力及害他;三以死相敵,無論先後及與一時,但取兩害。次三治貪成忍,故梁《攝論》云「取是貪愛別名:一自貪名利;二使彼令取,或隨喜彼取;三兼行上二。」後三治癡修忍,癡故執著,一著己德能,云何毀我?二彼人若是,云何辱我?三俱染可知。此九皆過菩薩正觀,以不不之。能治之觀,下文自辨。二約三業者,害必加身、著必由意,自他讚舉名為取也。苟心讚他尚為諂媚,況自稱舉,故並安忍之。三約三忍者,害即怨害。取即不能安受饑寒等苦,妄受取故。著則不見諦理。由見諦理,三忍皆成。故《思益》云「諸法念念滅,其性常不住。於中無罵辱,亦無有恭敬。若節節解身,其心常不動」等。又上三即約違順中庸之境,故成三毒。餘可準思。二「亦不」下離忍過也。名引中人、利誘下士,菩薩上士,故不貪求。三「但作」下修忍之意也。所以修者,先自忍己,後為生說,令修忍行離惡斷惑,是內安忍。惑亡智現,則住法忍。既去煩惱鑛穢,則身心柔和堪任法器,如彼鍊金。上來皆是清淨忍也。第二「佛子」下對境修忍廣顯行相。文中分二:先明修忍行、後明修忍意。前中有三:初耐冤害、次安受苦、三諦察法。今初,分二:先彰難忍之境、後明能忍之行,此亦難行忍也。今初,分三:初明口加毀辱故。梁《攝論》以耐冤害,亦名他毀辱忍,略顯十種:一觸忌諱故、二惡軌則故、三令憂慼故、四無風雅故、五極庸賤故、六詮邪惡故、七不入人心故、八詮猥雜故、九極鄙惡故、十極麁獷故。「以是言」下總結所作,多人多口各多惡言。二「又此」下身加逼害。上二事廣。三「如是經」下總辨長時,是謂難忍之境也。二「菩薩遭此」下明能忍行,先結前生後,謂遭前極苦。二「作是念」下正顯忍相,以失自要。文有十句:初一假設不忍,失念易志,故云動亂。餘九明失,一則不調瞋恚、二則不護根門、三迷忍法門、四不修忍行、五隨風外轉、六動亂內生、七不惜善根、八未忘彼此。上八自損,由此不能利他;今能忍故,以不不之,便成八行,自他俱利、自他俱調。若說此勝利,成善士行。二「菩薩爾時」下安受苦忍。雖仍前文,義當安受,故引往所受苦以況今苦,而欲安受。所以引者,無始顯昔苦時長,諸苦明其事廣,雖事廣時長而空無二利。今時促苦少,能成忍度,自利利他,安不忍哉?故練磨頌云「汝已惡道經多劫,無益受苦尚能超。今行少善得菩提,大利不應生退屈。」由斯重自勸勉誡勵,令淨而無亂、喜不憂慼。調其瞋蔽、攝護根門,是自住忍法令物同忍。第三「復更」已下諦察法忍。亦仍前起,故云復更。斯則一忍之中便具三忍,表非全異,故一境具明。文分三別:一自成法忍。文有五句。初句總標,「無我」已下釋成空義,以苦空無常無我四行釋之。倒為其次。又約大乘,故苦樂等雙遣:一人我法我兩亡;二常與無常非實,相待有故;三空有俱寂,故云無二;四苦樂皆遣,云無所有。二「諸法空」下令他成忍。眾生迷空,故應為說,皆清淨忍也。三「是故」下結行應修。然《莊嚴論》中由三思五想則能忍受:一思他毀辱我,是我自業;二思彼我俱是行苦;三思聲聞自利尚不以苦加人。此三文在安受忍中,思昔諸苦自他調攝故。言五想者,一本親想,眾生無始無非親屬故;二修法想,打罵不可得故;三修無常想、四修苦想、五修攝取想,即此文攝,對前可思。第二「為慈念」下明修忍意。文有十句,義兼通別。通則三忍皆為此十,在義可知。別則為初五故修耐冤害。慈念為總,次但欲饒益於他,不懼他不饒益。本欲安人,豈當加報?愍彼淪倒,寧懷恨心?以忍調行,攝諸恚怒。次一安受苦忍,隨逐眾生無疲苦故。次二句為覺自他修諦察法。後二通於前三。上一為言下流至此,斯即九中二世樂也。第四無屈撓行,撓者曲也弱也,即牢強精進也。釋相中二:先總顯其相、後隨難別釋。前中文三:初正顯精進、二「性無」下明離過失、三「但為」下辨進所為。此之三段,初即總舉;次是釋精,謂無雜故;三是釋進,趣所為故。今初正顯中,初句標行所屬。「所謂」已下顯勝列名。精進多名,望業用故。初第一者,亦是首義,此義有三:一大故第一,謂為大菩提故;二勝故第一,光明功德故;三殊勝故第一,謂超出故。第二大亦三義:一最勝故大,勝中極故,如世大王;二最妙故大,事理融通故,如世大德;三上故大,行體高上,如世尊長。第三勝者亦有三義:一無上故勝,不可加故;二無等故勝,不可匹故;三普遍故勝,體周法界,無可勝故。二離過中,即難行精進,性無間雜最為難故。先離自惱之過,謂本隨煩惱任運不起,故曰性無,圓融教中地前得爾。後「終不為」下明離惱他。三辨精進所為中有二十句,具含三種精進,但為是被甲四弘願故,而行即是方便加行所為之法,是所攝善。文分為四:初三斷惑、次七度生、次四知法、後六求佛,即四弘也。今初,初斷現行、次斷種子、後斷餘習。二度眾生中,為成十力智故。煩惱是漏,意令其盡。境界即遍趣行。心行義兼於業,生死義兼宿住處非處力,總故不明。三有四句知法中,初總、餘別。別中,一事法界,若自入法則以淨信為根本,若約利他則以慈悲為根本等。二即理法界,云平等性。三事理無礙法界,三世之事即平等理性也。事隨理融,義含事事無礙。四有六句求佛中,初二即智,初句教智光明、後句證智。次二知境,先真、後俗。後二皆權智,前句知機識藥、後句四辯宣陳。分別演說,即是樂說;說於法義,句即是辭。上之四弘,初二知苦斷集、後二修道證滅,即無作四諦之境也。第二「佛子菩薩」下隨難別釋。於中二:先明被甲精進、後明利樂精進。今初,全同《瑜伽》之文,但論以被甲為初,約先心自誓故。《本業》三進之中,初名大誓;今居攝善之後,就假設遇緣耳。文有兩番問答。初番可知。後「設復有」下第二番中,更難於前。得大善利者,我本發心願代物苦,但慮不容相代。今聞苦身,能遂順本悲心,不慮時長,但增喜慶,長劫不懈,況盡壽耶。一念不悔,即忘身無間。自慶得利,即平等通達。有深功德,為難行也。第二「菩薩以此」下利樂精進。即用前加行攝善以利眾生,令彼涅槃真安樂也。第五離癡亂行。釋相中二:先總顯無癡亂、後別明無癡亂。今初。句雖有六,義乃有十,初總、餘別。總云成就正念者,然通三義,皆名正念:一就奢摩他品名為正念,正念即定,以彼定心離妄念之亂,故名為正。此從業用立名,亦隣近立稱故。八正道中正念定攝,《起信論》云「心若馳散,即當攝來令住正念。」二就毘鉢舍那品亦名正念,謂不偏鑒達,明了於緣。故下經云「正念諸法未曾忘失」。三雙運道名為正念,次下經云「以正念故善解世間」等,謂於緣明了,是無癡義;不異所緣,名無亂義。即雙運也。又下經云「禪定持心常一緣,智慧了境同三昧。」雖有毘鉢舍那及雙運道,皆就心一境辨,名禪自性。別中,初句復是無亂之總,謂不隨境轉故無散亂,三障不能壞名為堅固,四緣不能牽故云不動,五超劣顯勝故云最上,六異世無染故云清淨。上五釋無亂也。下四義釋無癡,謂七稱法界故云廣,八趣一切智故云大,九引發難量故云無量,十不捨大悲名無迷惑。上九別句攝為三禪,前六現法樂住、次二引生功德、後一饒益有情。第二「以是」下別顯無癡亂。如次釋前十義,即為十段。亦初一為總,釋前正念。於中分二:初結前生後、後「善解」已下顯正念之能。文曲分二:先雙標、後雙釋。今初也。正念有觀,故能善解。正念有止,所以能持。世言無益,但須善解。出世有益,偏語憶持。出世不解,應不持義。世言不持,應無記憶。故文雖影略,義必兩兼。解事解理,故名善解。二「所謂」下雙釋,分二:先通就諸境明無癡亂、後「此菩薩」下別約所持明無癡亂。今初也。據無癡亂,文但有九,開初為二,句亦有十,謂法義別故。初句即法無礙,合蘊成二,謂色與心。非色謂心,即餘四蘊。二「能持建立」下義無礙也。義有二種,自性亦二,一事、二理。事即質礙為色性等,理即無性為色等性,皆無名\n\n（……释文余段照录从略·全文 23205 字·见 `T1735` 原文）\n\n> 体例：docs/工程治理/玄记体重排体例_v1.md——疏文照录；下节逐段层保持不动，与此总纲互指。\n\n\n### 2.0 结构总表\n\n- 序分：功德林入善思惟三昧→万佛加持→起定说十行\n- 总标十行（十名 listing）\n- 十行各说（各段含「佛子！何等为菩萨摩诃萨X行？」→行相广说→利益总结）\n- 重颂（一心敬礼十力尊…2,828 CJK）\n\n### 2.1 序分·入定加持（全引·节录）\n\n> 「爾時，功德林菩薩承佛神力，入菩薩善思惟三昧。入是三昧已，十方各過萬佛剎微塵數世界外，有萬佛剎微塵數諸佛，皆號：功德林，而現其前，告功德林菩薩言：『善哉！佛子！乃能入此善思惟三昧。』」\n\n**疏解**：功德林入**善思惟三昧**——「善思惟」即十行之思辨准备；万佛同名功德林现前加持——同名加持与品 17 万佛同名法慧同式（他方证成之仪轨复用）。佛告「十种智」令起定说法。\n\n### 2.2 总标十行\n\n> 佛告功德林：「佛子！菩薩摩訶薩有十種行。何者為十？一者歡喜行，二者饒益行，三者無違逆行，四者無屈撓行，五者離癡亂行，六者善現行，七者無著行，八者難得行，九者善法行，十者真實行。」\n\n**疏解**：十名总标——欢喜（檀）·饶益（戒）·无违逆（忍）·无屈挠（进）·离痴乱（禅）·善现（慧）·无著（方便）·难得（愿）·善法（力）·真实（智）——十波罗蜜之行位化。\n\n### 2.3–2.12 十行各说（逐段全引·节录首句与利益结句）\n\n**（一）欢喜行**（檀）：「佛子！此菩萨为大施主，凡所有物悉能惠施；其心平等，无有悔吝，不望果报，不求名称，不贪利养……」——布施之行，以欢喜为相。\n\n**（二）饶益行**（戒）：「此菩萨护持净戒，于色声香味触，心无所著……」——持戒之行，以饶益为相。\n\n**（三）无违逆行**（忍）：「此菩萨常修忍法，谦下恭敬；不自害，不他害，不两害……」——忍辱之行，以无违逆为相。\n\n**（四）无屈挠行**（进）：精进不懈，求一切智，恒不舍离……——精进之行，以无屈挠为相。\n\n**（五）离痴乱行**（禅）：心无痴乱，住禅定……——禅定之行，以离痴乱为相。\n\n**（六）善现行**（慧）：「此菩萨身业清净、语业清净、意业清净，住无所得……」——智慧之行，以善现为相。\n\n**（七）无著行**（方便）：善能示现，处处受生，不着受生……——方便之行，以无著为相。\n\n**（八）难得行**（愿）：成就难得，种诸善根，圆满愿行……——愿之行，以难得为相。\n\n**（九）善法行**（力）：具足善法，坚固不退，诸行成就……——力之行，以善法为相。\n\n**（十）真实行**（智）：如实了知，真实智慧，诸法实相……——智之行，以真实为相。\n\n〔注〕十行各段之完整经文（各行约 800～1,200 CJK）由 §2.3–2.12 程序注入于终稿；本节仅列骨架以便总览〔L.253 核心成文体例〕。\n\n### 2.13 重颂（2,828 CJK·全引）\n\n> 「一心敬禮十力尊，離垢清淨無礙見，\n境界深遠無倫匹，住如虛空道中者。\n過去人中諸最勝，功德無量無所著，\n勇猛第一無等倫，彼離塵者行斯道。\n現在十方諸國土，善能開演第一義，\n離諸過惡最清淨，彼無依者行斯道。\n未來所有人師子，周遍遊行於法界，\n已發諸佛大悲心，彼饒益者行斯道。\n\n三世所有無比尊，自然除滅愚癡暗，\n於一切法皆平等，彼大力人行此道。\n普見無量無邊界，一切諸有及諸趣，\n見已其心不分別，彼無動者行斯道。\n法界所有皆明了，於第一義最清淨，\n永破瞋慢及愚癡，彼功德者行斯道。\n於諸眾生善分別，悉入法界真實性，\n自然覺悟不由他，彼等空者行斯道。\n盡空所有諸國土，悉往說法廣開諭，\n所說清淨無能壞，彼勝牟尼行此道。\n具足堅固不退轉，成就尊重最勝法，\n願力無盡到彼岸，彼善修者所行道。\n無量無邊一切地，廣大甚深妙境界，\n悉能知見靡有遺，彼論師子所行道。\n一切句義皆明了，所有異論悉摧伏，\n於法決定無所疑，彼大牟尼行此道。\n遠離世間諸過患，普與眾生安隱樂，\n能為無等大導師，彼勝德者行斯道。\n恒以無畏施眾生，普令一切皆欣慶，\n其心清淨離染濁，彼無等者行斯道。\n意業清淨極調善，離諸戲論無口過，\n威光圓滿眾所欽，彼最勝者行斯道。\n入真實義到彼岸，住功德處心永寂，\n諸佛護念恒不忘，彼滅有者行斯道。\n遠離於我無惱害，恒以大音宣正法，\n十方國土靡不周，彼絕譬者行斯道。\n檀波羅蜜已成滿，百福相好所莊嚴，\n眾生見者皆欣悅，彼最勝慧行斯道。\n智地甚深難可入，能以妙慧善安住，\n\n其心究竟不動搖，彼堅固行行斯道。\n法界所有悉能入，隨所入處咸究竟，\n神通自在靡不該，彼法光明行此道。\n諸無等等大牟尼，勤修三昧無二相，\n心常在定樂寂靜，彼普見者行斯道。\n微細廣大諸國土，更相涉入各差別，\n如其境界悉了知，彼智山王行此道。\n意常明潔離諸垢，於三界中無所著，\n護持眾戒到彼岸，此淨心者行斯道。\n智慧無邊不可說，普遍法界虛空界，\n善能修學住其中，彼金剛慧行斯道。\n三世一切佛境界，智慧善入悉周遍，\n未甞暫起疲厭心，彼最勝者行斯道。\n善能分別十力法，了知一切至處道，\n身業無礙得自在，彼功德身行此道。\n十方無量無邊界，所有一切諸眾生，\n我皆救護而不捨，彼無畏者行斯道。\n於諸佛法勤修習，心常精進不懈倦，\n淨治一切諸世間，彼大龍王行此道。\n了知眾生根不同，欲解無量各差別，\n種種諸界皆明達，此普入者行斯道。\n十方世界無量剎，悉往受生無有數，\n未曾一念生疲厭，彼歡喜者行斯道。\n普放無量光明網，照耀一切諸世間，\n其光所照入法性，此善慧者行斯道。\n震動十方諸國土，無量億數那由他，\n不令眾生有驚怖，此利世者所行道。\n善解一切語言法，問難酬對悉究竟，\n聰哲辯慧靡不知，此無畏者所行道。\n\n善解覆仰諸國土，分別思惟得究竟，\n悉使住於無盡地，此勝慧者所行道。\n功德無量那由他，為求佛道皆修習，\n於其一切到彼岸，此無盡行所行道。\n超出世間大論師，辯才第一師子吼，\n普使群生到彼岸，此淨心者所行道。\n諸佛灌頂第一法，已得此法灌其頂，\n心恒安住正法門，彼廣大心行此道。\n一切眾生無量別，了達其心悉周遍，\n決定護持佛法藏，彼如須彌行此道。\n能於一一語言中，普為示現無量音，\n令彼眾生隨類解，此無礙見行斯道。\n一切文字語言法，智皆善入不分別，\n住於真實境界中，此見性者所行道。\n安住甚深大法海，善能印定一切法，\n了法無相真實門，此見實者所行道。\n一一佛土皆往詣，盡於無量無邊劫，\n觀察思惟靡暫停，此匪懈者所行道。\n無量無數諸如來，種種名號各不同，\n於一毛端悉明見，此淨福者所行道。\n一毛端處見諸佛，其數無量不可說，\n一切法界悉亦然，彼諸佛子行斯道。\n無量無邊無數劫，於一念中悉明見，\n知其修促無定相，此解脫行所行道。\n能令見者無空過，皆於佛法種因緣，\n而於所作心無著，彼諸最勝所行道。\n那由他劫常遇佛，終不一念生疲厭，\n其心歡喜轉更增，此不空見所行道。\n盡於無量無邊劫，觀察一切眾生界，\n\n未曾見有一眾生，此堅固士所行道。\n修習無邊福智藏，普作清涼功德池，\n利益一切諸群生，彼第一人行此道。\n法界所有諸品類，普遍虛空無數量，\n了彼皆依言說住，此師子吼所行道。\n能於一一三昧中，普入無數諸三昧，\n悉至法門幽奧處，此論月者行斯道。\n忍力勤修到彼岸，能忍最勝寂滅法，\n其心平等不動搖，此無邊智所行道。\n於一世界一坐處，其身不動恒寂然，\n而於一切普現身，彼無邊身行此道。\n無量無邊諸國土，悉令共入一塵中，\n普得包容無障礙，彼無邊思行此道。\n了達是處及非處，於諸力處普能入，\n成就如來最上力，彼第一力所行道。\n過去未來現在世，無量無邊諸業報，\n恒以智慧悉了知，此達解者所行道。\n了達世間時非時，如應調伏諸眾生，\n悉順其宜而不失，此善了者所行道。\n善守身語及意業，恒令依法而修行，\n離諸取著降眾魔，此智心者所行道。\n於諸法中得善巧，能入真如平等處，\n辯才宣說無有窮，此佛行者所行道。\n陀羅尼門已圓滿，善能安住無礙藏，\n於諸法界悉通達，此深入者所行道。\n三世所有一切佛，悉與等心同智慧，\n一性一相無有殊，此無礙種所行道。\n已決一切愚癡膜，深入廣大智慧海，\n普施眾生清淨眼，此有目者所行道。\n\n已具一切諸導師，平等神通無二行，\n獲於如來自在力，此善修者所行道。\n遍遊一切諸世間，普雨無邊妙法雨，\n悉令於義得決了，此法雲者所行道。\n能於佛智及解脫，深生淨信永不退，\n以信而生智慧根，此善學者所行道。\n能於一念悉了知，一切眾生無有餘，\n了彼眾生心自性，達無性者所行道。\n法界一切諸國土，悉能化往無有數，\n其身最妙絕等倫，此無比行所行道。\n佛剎無邊無有數，無量諸佛在其中，\n菩薩於彼悉現前，親近供養生尊重。\n菩薩能以獨一身，入於三昧而寂定，\n令見其身無有數，一一皆從三昧起。\n菩薩所住最深妙，所行所作超戲論，\n其心清淨常悅樂，能令眾生悉歡喜。\n諸根方便各差別，能以智慧悉明見，\n而了諸根無所依，調難調者所行道。\n能以方便巧分別，於一切法得自在，\n十方世界各不同，悉在其中作佛事。\n諸根微妙行亦然，能為眾生廣說法，\n誰其聞者不欣慶，此等虛空所行道。\n智眼清淨無與等，於一切法悉明見，\n如是智慧巧分別，此無等者所行道。\n所有無盡廣大福，一切修行使究竟，\n令諸眾生悉清淨，此無比者所行道。\n普勸修成助道法，悉令得住方便地，\n度脫眾生無有數，未曾暫起眾生想。\n一切機緣悉觀察，先護彼意令無諍，\n\n普示眾生安隱處，此方便者所行道。\n成就最上第一智，具足無量無邊智，\n於諸四眾無所畏，此方便智所行道。\n一切世界及諸法，悉能遍入得自在，\n亦入一切眾會中，度脫群生無有數。\n十方一切國土中，擊大法鼓悟群生，\n為法施主最無上，此不滅者所行道。\n一身結跏而正坐，充滿十方無量剎，\n而令其身不迫隘，此法身者所行道。\n能於一義一文中，演說無量無邊法，\n而其邊際不可得，此無邊智所行道。\n於佛解脫善修學，得佛智慧無障礙，\n成就無畏為世雄，此方便者所行道。\n了知十方世界海，亦知一切佛剎海，\n智海法海悉了知，眾生見者咸欣慶。\n或現入胎及初生，或現道場成正覺，\n如是皆令世間見，此無邊者所行道。\n無量億數國土中，示現其身入涅槃，\n實不捨願歸寂滅，此雄論者所行道。\n堅固微密一妙身，與佛平等無差別，\n隨諸眾生各異見，一實身者所行道。\n法界平等無差別，具足無量無邊義，\n樂觀一相心不移，三世智者所行道。\n於諸眾生及佛法，建立加持悉究竟，\n所有持力同於佛，最上持者行斯道。\n神足無礙猶如佛，天眼無礙最清淨，\n耳根無礙善聽聞，此無礙意所行道。\n所有神通皆具足，隨其智慧悉成就，\n善知一切靡所儔，此賢智者所行道。\n\n其心正定不搖動，其智廣大無邊際，\n所有境界皆明達，一切見者所行道。\n已到一切功德岸，能隨次第度眾生，\n其心畢竟無厭足，此常勤者所行道。\n三世所有諸佛法，於此一切咸知見，\n從於如來種性生，彼諸佛子行斯道。\n隨順言辭已成就，乖違談論善摧伏，\n常能趣向佛菩提，無邊慧者所行道。\n一光照觸無涯限，十方國土悉充遍，\n普使世間得大明，此破闇者所行道。\n隨其應見應供養，為現如來清淨身，\n教化眾生百千億，莊嚴佛剎亦如是。\n為令眾生出世間，一切妙行皆修習，\n此行廣大無邊際，云何而有能知者？\n假使分身不可說，而與法界虛空等，\n悉共稱揚彼功德，百千萬劫無能盡。\n菩薩功德無有邊，一切修行皆具足，\n假使無量無邊佛，於無量劫說不盡。\n何況世間天及人，一切聲聞及緣覺，\n能於無量無邊劫，讚歎稱揚得究竟。」\n\n**疏解**：重颂以「一心敬礼十力尊」起，逐行重述十行之相，末以校量功德收——重颂体与本系列诸品重颂同构（品 1 之 123 偈·品 17 之 121 颂），为长行义之**偈体总持**。\n\n## 三、旁参与前接\n\n### 3.1 承前（品 19–20）\n\n品 19 升殿（由致）→品 20 十菩萨偈赞（赞德）→**本品功德林说十行（正宗）**——十林菩萨之首由「赞」转为「说」，即由偈体转长行体，由赞他转自陈行法。\n\n### 3.2 启后（品 22）\n\n本品说十行之行相，品 22〈十无尽藏品〉说十行之**所依**（藏）——行与藏之关系：行是藏之显，藏是行之体。次品之「十无尽」即本品十行之**无尽化**。\n\n## 四、义理要点\n\n- **十行＝十波罗蜜之行位化**：十波罗蜜在六波罗蜜（般若经系统）之上加方便·愿·力·智四波罗蜜，成十波罗蜜（华严系统标准）；十行即此十度之行相化。\n- **欢喜居首**：十行之第一是「欢喜」——**布施以欢喜为相**，即菩萨行之入口是喜悦而非牺牲。\n- **心画师之先声**：品 20 觉林「心画师」喻（一切唯心造）为本品十行之义理前提——行从心起，十行即心之十种造作相。\n\n## 五、注疏选要\n\n### 5.1 澄观（`T1735`·疏卷二十三）\n\n> 「十行者。行谓行甫。……此十位前虽有信等。仍属习种性。今此正明行性。……然行相虽多。不出此十。十身十土皆此所成。」（NFKC 归一·〔L.253 摘〕）\n\n**【要点提炼】**（L.259 会读深化）\n\n1. **「行谓行甫」**：行不是已完成之动作而是**正在进行之过程**（甫＝始、方）——十行品的「行」始终在动态中，非静态之名目。\n2. **「习种性→行性」之判**：十住之前属习种性（种子位），本品正明**行种性**——位次升进之教判依据。\n3. **「行相虽多，不出此十」**：十行是菩萨行之**总纲**，非十种孤立行为，而系一切行之分类框架。\n4. **「十身十土皆此所成」**：十行之果即十身（如来十身）与十土（佛国土）——**行与果不二**。\n\n**【阐释】**（〔本文判断〕）\n\n- 「行甫」之「甫」字极为关键：它说明十行不是已完成之圣果，而是**正在践行之过程**——读十行品当持「进行时」而非「完成时」之心态。\n- 「习种性→行性」之判与唯识学之「种姓」说相通：习种性是宿世熏习之种子位，行种性是**现世发起真修行**之位——十住品（品 15）已习，本品（品 21）正行。\n- **启发**：「行相虽多，不出此十」＝**MECE 之古典表述**（Mutually Exclusive, Collectively Exhaustive）——十种行门彼此不重迭而 collectively 涵盖一切菩萨行。\n\n### 5.2 诸家（程序取窗实引·L.310/L.314）\n\n**李通玄《新華嚴經論》**（289 字·程序取窗）：\n\n> 十行品。四十無盡藏品。如此會中。昇夜摩天宮品夜摩天宮偈讚品兩品。是諸天迎佛讚歎佛功德。及歎處之勝。十行品十無盡藏品兩品經。明智身具普賢行悲智具足理智行門所成依正二報福智無盡。此位從如來兩足上放光。及昇夜摩天上說者。為明從須彌山頂至相盡處證佛智身至夜摩天上依法空本智起普賢萬行門故。以處表法令易解故。如彼諸天離地際故。天依空而住。為明十行依本智法空而行。第六明理事相入者。從第五會昇兜率天宮。於如來膝上放光。說十迴向。有三品經。一昇兜率天宮品。二兜率天宮偈讚品。三十迴向品。前之二品經。是諸天迎讚如來敬嘆佛德。及嘆處之勝。後之一品。是正說十迴向之法門。迴向者。令諸事法皆入理故。以\n\n（程序取窗（L.314）·各照底本）\n**道霈《華嚴經疏論纂要》**（237 字·程序取窗）：\n\n> 十行品。十無盡藏品。○第五會兜率天宮。金剛幢菩薩為會主。說十迴向法門。自二十二卷至三十三卷。共三品經。三品者。升兜率天宮品。兜率天宮偈讚品。十迴向品。○第六會他化自在天宮。金剛藏菩薩為會主。說十地法門。自三十四卷至三十九卷。共一品經。一品者。即十地品。○第七重會普光明殿。如來為會主。說阿僧祇數量法門。及如來隨好光明功德及普賢等諸菩薩。說十大三昧等等妙法門。自四十卷。至五十二卷。共十一品經。十一品者。普賢菩薩說十定品。十通品。十忍品。佛說阿僧祇品。心王菩薩說如來壽量品。諸\n\n（程序取窗（L.314））\n\n- **法藏《探玄记》**（依六十·品 21 合入〈卢舍那佛品〉）——法藏于本品无逐品玄谈，可据者为品 2 通判中「三昧分法体」之义（参第三部 §5.2′）。\n\n**【要点提炼】**（L.259·法藏）\n\n1. **十行名目承十度**：法藏于十行之名目体系承袭十波罗蜜传统（与澄观同判），惟依六十本而品次并入〈卢舍那佛品〉。\n2. **「位前方便」之信位观**：法藏「信是住之方便无正位」（第十部 §5.2）→本品十行即**正位之始**——十行位是「正位」之首（习种性入行种性）。\n\n\n- **智俨《搜玄记》**（依六十·同上）。\n- **慧苑《刊定记》**（依八十·有专段）——慧苑本品有逐品玄谈·四门同前。\n\n**【要点提炼】**（L.259·慧苑）\n\n1. **释名**：慧苑训「行」为「**进修**」——十行即十种进修之位（上引 X0221 品 21·§1.1 引）。\n2. **来意**：「前品偈赞·显佛功德。今明菩萨修行应机故来」（X0221 品 21·§5.2″）。\n\n\n- **李通玄**（五门·含「都会断惑次第」独门·参第十五部 §5.3 同式）。\n\n**【要点提炼】**（L.259·李通玄）\n\n1. **十行之「城郭攻破」图**：李氏于第十五部（十住品）立「断惑地图」（§5.3·善财颂立世法之城），本品十行即**攻城之行**——每一行破一类惑。\n2. **「初一念十住」之顿趣**：通玄之顿趣倾向（§5.3〔本文判断〕）在十行品续显：十行虽渐修而**一念中具十行**。\n\n\n\n**【会读启发】**（L.259·〔本文判断〕）\n\n1. **十行是「动词」**：十住品言「住」（状态），十行品言「行」（动作）——前者是**存在态**，后者是**实践态**；位次学之两翼缺一不可。\n2. **科判之承袭链**：澄观之行性判承法藏之习/行种性说；慧苑「进修」训承法藏；李通玄断惑图承自家顿趣——**四家各承而各偏**。\n3. **品级讲记正行与玄谈双层**（§5.3″/§5.3″′·L.223）：25 集逐集对位表使本品讲记密度全系列最高——正行层与玄谈层各司其职。\n4. **现代联结**：「行谓行甫」之动态义＋十度配位之框架义＝**能力模型的实践端**——十住是「知道」，十行是「做到」。\n\n## 六、文本对读\n\n### 6.3 藏译（Toh 44 ch 26–27）\n\n**藏 26 开篇实测**〔L.253〕：德格 035 卷 fol 305a——第 26 章开篇「**དེ་ནས་དེའི་ཚེ་བྱང་ཆུབ་སེམས་དཔའ་ཡོན་ཏན་དང་ལྡན་པ། སངས་རྒྱས་ཀྱི་མཐུས…**」（尔时功德具足〔功德林〕菩萨以佛神力……）——与本品功德林入定说十行**直接相应**〔对应判读〔本文判断〕〕。\n\n**藏译逐段细读（L.349c·藏汉逐段对读批三·data/alignment/tibetan_zhuhuju_b3.json）**\n\n**藏文首段（德格 035 卷·章26·305a.5·程序取窗·去页码标记）**\n\n> .2]གཏེར་ཆེན་པོ་རབ་ཏུ་ཐོབ་པར་འགྱུར་བ་དང་།སེམས་ཅན་རྣམས་ལ་སྣོད་ཇི་བཞིན་དུ་སྦྱིན་པ་བྱེད་པར་འགྱུར་བ་དང་།ཕ་རོལ་ཏུ་ཕྱིན་པའི་ཕྱོགས་ཡོངས་སུ་མྱི་གཏོང་བར་འགྱུར་བ་དང་།ཇི་ལྟར་དམ་བཅས་པའི་སེམས་ཅན་རྣམས་སྒྲོལ་བར་འགྱུར་བ་དང་།སངས་རྒྱས་དང་ཆོས་དང་དགེ་འདུན་གྱི་གདུང་མི་ཆད་པར་འགྱུར་བ་དང་།དགེ་བའི་རྩ་བ་དམིགས་པ་ཐམས་ཅད་དུ་སྦྱོར་བ་དོན་མེད་པར་མི་འགྱུར་བ་དང་།ཀྱེ་རྒྱལ་བའི་སྲས་བྱང་ཆུབ་སེམས་དཔའ་རྣམས་ཀྱིས་དེ་ལ་བརྩོན་པར་བྱས་པས་ཆོས་ཀ\n\n**试译**〔本文试译·术语据本系列勘定名表；义有未安处标〔待核〕·L.354a〕：\n\n> 〔前章结式：集会显示偈颂之章·第二十五〕〔bam po 25〕尔时，功德林菩萨（ཡོན་ཏན་དང་ལྡན་པ）蒙佛神力，入名「 // ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();

  if(block){

function _applyArticleENMode(){

}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}

</script>
</body>
