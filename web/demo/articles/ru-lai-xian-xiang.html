<script>
var ARTICLE = {"id": "ru-lai-xian-xiang", "file": "articles/ru-lai-xian-xiang.html", "title": "九九华严第二品 如来现相品之拼读", "title_sub": "华严经第二品·按品精读·念请四十问·现相放光·十方云奔·十士说颂 · 中英对照 · 未完备已标明", "icon": "📖", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读_第二部_如来现相品.md", "doc_md": "# 九九华严第二品 如来现相品之拼读\n\n> 底本：唐·实叉难陀译《大方广佛华严经》（八十华严） T10n0279。范围：**卷第六（本品全一卷）**；卷第七另为《普贤三昧品第三》，仅作旁参（见 §三）。\n> 立稿：2026-10-07（范围更正：2026-10-07，本品由原拟「卷六～七」订正为「卷六」）。\n> 原则：沿用第一品《世主妙严品》之校勘纪律、三层疏解（疏解／名相／会读）、存疑必标、推断必标「〔本文判断〕」、讲者之说疑误只标不改、三译主从分明、不擅改经文、可回源可复核\n\n## 〇、凡例（简要）\n\n一、**校勘底本**：以 T10n0279 为底本。六十华严（T09n0278）、四十华严（T10n0293）不作底本，但须品读并作对读；凡异译异说并列而不强断。\n二、**品读主从**：以八十华严为叙事主轴，六十/四十为辅读与对读。主从仅指骨架取自何本，非谓其余可略。\n三、**疏解三层**：其下「疏解」为依经文直解；「名相」为梵汉对勘、术语训释与异说并列；「会读」引本项目海云继梦法师讲记及相关资料，属一家之言，不冒充古注。\n四、**引文从严**：引古注（澄观《大方广佛华严经随疏演义钞》T1736、《华严经疏》T1735、法藏《华严经探玄记》T1733、李通玄《新华严经论》T1739、《华严经合论》X0223）必注明经号与定位；未核到原文者不引，标〔待核〕。\n五、**存疑与未竟**：一律如实标明〔待核〕〔存疑〕〔未竟〕，不掩其缺。\n六、**中英对照**：名相依全站固定术语表；无通行对译者标〔no standard English equivalent〕，不强造译名。\n七、**数字口径**：采用 scripts/miaoyan_metrics.py 式口径（剥离校勘记、按卷切分）先实测后定字数・句数，先统计「解脱门」「偈颂」后结论。\n八、**残缺标识·信度随行**：凡经文有**残缺／短品／疑阙／增补**诸现象者，**如实标识**（〔缺文〕〔残〕〔短品〕〔疑阙〕〔补〕〔等〕，见 §1.5）＋**文献/法义说明**，并给出**信度评级**（T0–T3）；标识说「现象」、信度说「依据」，二者不同层，无从确证者只标〔疑阙〕不升断言。\n九、**异本举而比之**：凡**藏译（Toh 44）、梵本、六十／四十**等**对应章节与本品有别**者，**不论用字、分品、文段有无、内容增减，悉举而比对**，注版本与信度；有异必注出处，未据原著者标〔待核〕，**严禁以「藏译云」冒充未见之原文**（详 §1.6、§6.4）。此为**长久沿用之惯例**。\n十、**题名后缀**：本系列每篇标题（YAML `title`）一律以「**之拼读**」为后缀（九九华严第 N 品 OP之拼读），与第一部一致。\n\n## 一、概述与品题解义\n\n### 1.1 品题释义\n〔待续〕\n\n### 1.2 品位与脉络（承上启下）\n\n**在八十华严三十九品中之位**：第一品《世主妙严品》（卷一～五）为序分；**第二品《如来现相品》（卷六，一卷）为正说之始**（第三品《普贤三昧品》另占卷七）。清凉澄观判本品属第一会·菩提场会「举果劝乐生信分」；华严宗判位外诸家（如海云）则别立「序品独立」——**判位诸说并列，本细读不作独断**（详见 §5.1 澄观、§5.4 海云）。\n\n**承上启下**：\n- **承上**：《世主妙严品》「彰显佛境界之存在与殊胜」，为序；众海已集，主角未出。\n- **本品**：如来现相（放光）→ 光召有缘·众海云奔 → 现瑞表说（眉间光、佛前现华、白毫出众）→ 称扬佛德；以「**光相表示**」为宗（澄观语），令上智玄悟为趣。\n- **启下**：本品为「**果**」，第三品《普贤三昧品》为「**行**」——先果后行，由如来现相之果，转入普贤三昧之行（澄观、海云皆同此判读方向）。\n\n**结构诸说**（供对读，勿强合）：\n- 澄观 **六分**：众海同请／光召有缘／所召云奔／现瑞表说／称扬佛德／结通无穷（§5.1）。\n- 法藏《探玄记》科判十门（面光集众分……正陈法海分，详见 §5.2）。\n- 海云「三循环」说：第二品（果）→三十七品为一循环，三十八《离世间品》为第二、三十九《入法界品》为第三（§5.4，属一家之判）。\n\n### 1.3 篇幅与结构预览（**本品＝卷第六**）\n\n> **〔范围更正·据实记〕** 本稿初拟范围为「卷六～卷七」，经回核 `T10n0279` **经头品题**及《八十华严品卷对照表》，确认：**《如来现相品第二》仅佔卷第六**；**卷第七首即《普贤三昧品第三》**（同卷另有《世界成就品第四》）。故**本品范围订正为卷第六一卷**；卷第七非本品，另立 **§三 旁参** 收录（因海云「现相为果、三昧为行」之说二者相属，故附录之，然**严标其非本品**）。\n\n- **本品范围**：卷第六（`T10n0279` 卷六，起「諸菩薩及一切世間主作是思惟」）。**实测 8,119 字／208 句**（CJK 剥校勘口径，详见 §7.1）。\n- **品题对证**：卷六经首题「大方廣佛華嚴經卷第六……**如來現相品第二**」；卷七经首题「……**普賢三昧品第三**」。品卷对照表亦作：2 如来现相品＝6；3 普贤三昧品＝7。\n- **结构骨架**（依澄观六分，参 §5.1）：①众海同请（念请）→②光召有缘→③所召云奔→④现瑞表说（眉间光·佛前现华·白毫出众）→⑤称扬佛德→⑥结通无穷。\n- **旁参**：卷第七《普贤三昧品第三》（另见 §三，仅作相邻品参照，不入本品正文校勘）。\n\n### 1.4 核心要义（十身・现相・光明・功德海）\n\n本品为一会正说之始，其要义四（详 §2、§4）：\n1. **现相**——如来不由言说，而**以光相表示**（澄观宗趣语）；「二光二瑞」＝面门光（召众）／眉间光（示说法主）／佛前现华／白毫出众（§2.2）。\n2. **法身／色形**——本品不立「十身」名目，正宗在**法身为体、色形为用**：「佛身充滿於法界，普現一切眾生前」「法身同虛空……色形如影像」（§2.3）。\n3. **光明**——**以光为教体**，光与音声不二（「一一毛孔中，光網遍十方……如来光明中，常出深妙音」）；光网重重即「一即一切」之教相化（§4.3）。\n4. **功德海**——以「海」为量，承众海所问之「二十海」而答（§2.1、§2.4）。\n\n### 1.5 经文文本之残缺、增补与信度标识（本文惯例·本批立）\n\n> **缘起**：华严一经（乃至一切古译经）因**翻译、传抄、结集、版本**诸缘故，文本并非处处完整——有**品极短**者、有**文句段落似不完整**者、有**疑为后出增补**者（如本经「十定品」六十华严全无）。此等现象**当如实标识、系以注释与文献/法义说明，并给出信度评级**，不可默然而过，亦不可因「残缺」之名而横生揣测。\n\n**标识符号集**（凡文中出现即附一句说明）：\n\n| 标识 | 含义 | 例句 |\n|------|------|------|\n| 〔缺文〕 | 此处经文有**脱文/阙漏**（据校勘或版本比勘可证） | 某处文义中断，诸本皆阙 |\n| 〔残〕 | **残卷/残句**（该处只存片段） | 支那内学院残卷 |\n| 〔短品〕 | 本品篇幅**显著短于常例**（相对而言） | 本品 8,119 字（相对世主妙严品 31,953 字） |\n| 〔疑阙〕 | **疑有阙文而未确**（存而不论） | — |\n| 〔补〕/〔后人补〕 | **疑为后出增补**之文/品 | 十定品（六十华严阙） |\n| 〔等〕 | 经文**固有之省略代表例**（非残缺，如「……如是等」） | 十光名「……如是等佛剎微塵數」 |\n\n**信度评级**（沿用本项目三级来源评级，见 `verification-framework.md`）：\n\n| 级 | 判据 | 例 |\n|----|------|----|\n| T0／一手 | 原典本身（CBETA 底本／一手抄本） | `T10n0279` 卷六文字 |\n| T1／原典 | 同系统译本/注疏（异译、古注原本） | 六十华严、法藏《探玄记》 |\n| T2／学术 | 同行评议论著、学术论文 | 北大《试论华严经的构成与流布》 |\n| T3／二手 | 百科、官网、口说转述 | 维基、法师讲记听录 |\n\n**说明**：标识表「文本现象」，信度表「判断依据」——**二者不同层**。凡标〔缺文〕〔补〕者，须注明**据何而断**（某本对勘／校记／学术论著），并给信度；**无从确证者只作〔疑阙〕／〔待核〕**，不升级为断言（与「考证优先」「严禁假信息」互证）。\n\n**于本品之应用**（据实）：\n- 本品并非「残缺品」，然**属〔短品〕**（8,119 字，短于世主妙严品）；此系**南宋以来**本品内容较少之事实，非脱文（V1 T0）。\n- 本品**十光名、十方诸海**等处「……如是等」为**经文固有之〔等〕例**（省略代表），**非残缺**（T0，据底本文脉）。\n- 本品在**六十华严无独立品名**（入〈卢舍那佛品〉）、**四十华严全无**——属**版本分合之差异**〔并存〕，非「缺」（V2/V3 T0/T1）。\n\n### 1.6 版本差异之惯例（藏译・异本：若有异，悉举而比之·本批立）\n\n> **惯例**：凡**藏译（Toh 44）、梵本残片、六十／四十华严**等**对应章节与本品有别**者——**不论其为用字、分品、文段有无、内容增减**——**悉举而比对之**，并注版本与信度。**无别者亦不妨标「与汉本大体同」**。此为**长久沿用之惯例**，非本品一次之特殊处理。\n\n**三译／多本对照之判读原则**（承「多译本并存·考据成一」）：\n1. **不可强求合一**——异本差异或为**传承不同**（于阗本 vs 梵本）、或为**译风不同**、或为**结集层次不同**，并列存之，注〔并存〕。\n2. **有异必注出处**——凡言「藏译作 X」，须注明**据何**（藏文原典／学术论著／目录），无把握者标〔待核〕，**严禁以「藏译云」冒充未见之原文**。\n3. **差异分层**——**分品差异**（如藏译 45 品 vs 汉 39 品）／**内容差异**（某段藏有汉无）／**用字差异**（译名异写）三层分列，不混。\n4. **信度随源**——藏文原典为 T0/T1，学术转述为 T2，他说为 T3。\n\n**本品之藏译情况**（据现有一手/二手材料，详 §6.4）：藏译《华严经》（Toh 44，45 品）**多出二品**为汉文三译所无／别见——第 11 品《如来华严品》（汉译全缺）、第 32 品《普贤宣说品》（汉有别译《大方广普贤所说经》T0847）；**然二品皆不紧邻本品**，详辨见 §6.4。\n\n### 1.7 核心要义小结\n本品以一「**现**」字为骨：**如来现相 → 众海现集 → 光现说 → 白毫现众**；通篇不说一字正法，而以**光相**示之，正是华严「**理事无碍、重重无尽**」之开篇宣言。\n\n## 二、卷第六（如来现相品第二·本品全文）\n\n### 2.1 序分／缘起（众海同请·「念请」四十问）\n\n**经文（起本品）**：「爾時，諸菩薩及一切世間主，作是思惟：『云何是諸佛地？……』」——众海**以心念为请**（念请，非言请），发问二组、各二十：\n\n- **甲组·二十（问佛之体用）**：「云何是諸佛**地／境界／加持／所行／力／無所畏／三昧／神通／自在／無能攝取／眼／耳／鼻／舌／身／意／身光／光明／聲／智**？」\n- **乙组·二十（问诸「海」）**：「**世界海／眾生海／法界安立海／佛海／佛波羅蜜海／佛解脫海／佛變化海／佛演說海／佛名號海／佛壽量海**」＋「一切菩薩**誓願海／發趣海／助道海／乘海／行海／出離海／神通海／波羅蜜海／地海／智海**」。\n\n**〔本批据经点定〕「四十问」＝甲 20 ＋ 乙 20 ＝ 四十**。此即海云所拈「四十个问题」之经文来历（§5.4.3），**由经文实点得出，非取口说**（承 §7.2 待办之解）。\n\n**请辞**：「唯願世尊，哀愍我等，開示演說！」「願佛世尊，亦為我等，如是而說！」\n\n**自然出音说颂（承念请）**：诸菩萨威神力故，**于一切供养具云中自然出音**而说颂——「无量劫中修行满，菩提树下成正觉，为度众生普现身，如云充遍尽未来／众生有疑皆使断，广大信解悉令发，无边际苦普使除，诸佛安乐咸令证……」颂中**重申所问**（诸佛地／如来境／加持／所行／三昧／无畏／神通／眼耳鼻舌身意／刹海众生海法界安立海佛海／解脱方便海法门海）。\n\n**三层疏解**：\n- *疏解*：本品不由佛「说」起，而由**众「念」请**起——正显华严「**请法为转法轮之因**」（海云「有请法就有转法轮」）。\n- *名相*：「**念请**」＝以身语意中之意业为请；「**無能攝取**」〔待核〕（疑指佛之「无能制/无能摄」自在）。\n- *会读*：海云以此四十问为「**疑情**」，劝置案头（§5.4.3）。\n\n### 2.2 如来现相（光召·云奔·现瑞·表说）\n\n本品之「现相」非一，**依经文可辨为「二光二瑞」**，恰与澄观「现相五义」对映（§5.1、§4.3）：\n\n| 现相 | 经文（卷六） | 澄观「现相五义」 |\n|------|------|------|\n| ①面门光 | 041「即於**面門眾齒之間**，放佛剎微塵數光明」 | 一现面门光相，召十方众 |\n| ②眉间光 | 124「放**眉間光**，此光名：一切菩薩智光明，普照耀十方藏」 | 二现眉间光相，示说法主 |\n| ③振刹网 | 126「又普震動諸世界網，一一塵中現無數佛」 | 三振动刹网以警群机 |\n| ④佛前现华 | 129「佛前有大蓮華，忽然出現，其華具有十種莊嚴」 | 四佛前现华表说依果 |\n| ⑤白毫出众 | 132「於如來白毫相中，有菩薩摩訶薩，名：一切法勝音……俱時而出」 | 五白毫出众表教从佛流 |\n\n**①光召有缘（041–043）**：世尊「知诸菩萨心之所念」，于**面门众齿间**放佛剎微尘数光明——**列十光名**：众宝华遍照、出种种音庄严法界、垂布微妙云、十方佛坐道场现神变、一切宝焰云盖、充满法界无碍、遍庄严一切佛剎、逈建立清净金刚宝幢、普庄严菩萨众会道场、妙音称扬一切佛名号……；一一复有佛剎微尘数光明为眷属；普照十方各一亿佛剎微尘数世界海；彼世界海菩萨众**于光明中，各得见此华藏庄严世界海**。\n\n**②光中说颂召众（044–053）**：以佛神力，其光于彼菩萨众会前说颂（十颂），劝「汝等应往同瞻礼／汝可速诣如来所／汝可往观闻所说」。\n\n**③所召云奔（054–134）**：十方世界海一切众会蒙光开觉，**各来诣毗卢遮那如来所，亲近供养**——十方各现世界海／国土／佛号／上首菩萨／供养云／坐座（详见 §2.5）。会中复**身毛孔现光明**、**念念中现诸法门开悟众生**（109–113）。\n\n**④现瑞·表说（124–224）**：眉间光→佛前大莲华→白毫出众之**胜音菩萨**；胜音**领说一颂**，次第更有**十大士各说一颂**（**合十一组·各十偈**，逐组回源见 **§2.6**）。\n\n**三层疏解**：\n- *疏解*：全品骨为「**请→光→集→瑞→说**」，如来**不说一字**，而**以光相表示**（澄观宗趣语）——此即本宗教相之极致。\n- *名相*：面门光 `mukha`（§5.2）；眉间光名「一切菩萨智光明，普照耀十方藏」。\n- *会读*：海云「如来现相」＝**大光明体**，非有形之相（§5.4.2′）。\n\n### 2.3 现相与法身（「十身说」辨正）\n\n**〔辨正〕本品未见「十身」名目**（`T10n0279`「十身」3 见、「如来十身」2 见皆不在卷六，见 §4.1）。本品义理正宗在**法身／色形（色身）之对举**，为后世「十身」教义之**经证前身之一**，然不可径以「十身」填本品。\n\n**关键偈（回源卷六）**：\n- 胜音菩萨（135）：「**佛身充滿於法界，普現一切眾生前，隨緣赴感靡不周，而恒處此菩提座。**」（本品最脍炙人口之句）\n- 观察一切胜法莲华光慧王（146–149）：「諸佛同法身，無依無差別，隨諸眾生意，令見佛色形。」「佛身及光明，色相不思議，眾生信樂者，隨應悉令見。」\n- 法喜慧光明（159–161）：「佛身無有生，而能示出生，法性如虛空，諸佛於中住。」「無體無住處，亦無生可得，無相亦無形，所現皆如影。」\n- 精进力无碍慧（240–241）：「法身同虛空，無礙無差別，色形如影像，種種眾相現。」「佛身不可取，無生無起作，應物普現前，平等如虛空。」\n\n**义理**：**法身为体，色形为用**；「现相」即**体不碍用、应物现形**——身如影像，无相而现相。此与 §4.2「光相表示」、§5.1 澄观「能现／所现」一贯。\n\n**名相**：法身 `dharmakāya`；色身／色形 `rūpakāya`／`rūpa`。\n\n### 2.4 光明与功德海\n\n- **二光**：面门光（召众）＋眉间光（示说法主）——见 §2.2 表。眉间光「其状犹如宝色灯云，遍照十方一切佛剎……随诸众生性欲不同，普雨三世一切诸佛妙法轮云」。\n- **光中说颂（044–053）**：光自出声召众——「毛孔之中出化云，光明普照于十方，应受化者咸开觉」「如来一音无有量，能演契经深大海」——**光明与音声不二**。\n- **毛孔光网（150）**：「一一毛孔中，光网遍十方，演佛妙音声，调彼难调者。」「如来光明中，常出深妙音，赞佛功德海。」\n- **功德海**：偈中「无量劫中修行海，供养十方诸佛海，化度一切众生海」（044）「赞佛功德海，及菩萨所行」（151）——以「海」为量，即本品「诸海」之问之答（呼应 §2.1 乙组二十海）。\n\n**名相**：`raśmi`（光）／`prabhā`（光辉）；「光网」拟 `raśmi-jāla`〔待核〕。\n\n### 2.5 菩萨众及住处（十方世界海）\n\n**所召云奔之十方**（回源卷六，逐方世界海／国土／佛号／上首菩萨，据经文摘录）：\n\n| 方 | 世界海 | 国土 | 佛号 | 上首菩萨 |\n|----|--------|------|------|----------|\n| 东 | 清净光莲华庄严 | 摩尼璎珞金刚藏 | 法水觉虚空无边王 | 观察胜法莲华幢 |\n| 南 | 一切宝月光明庄严藏 | 无边光圆满庄严 | 普智光明德须弥王 | 普照法海慧 |\n| 西 | 可爱乐宝光明 | 出生上妙资身具 | 香焰功德宝庄严 | 月光香焰普庄严 |\n| 北 | 毗琉璃莲华光圆满藏 | 优钵罗华庄严 | 普智幢音王 | 师子奋迅光明 |\n| 东北 | 阎浮檀金玻璃色幢 | 众宝庄严 | 一切法无畏灯 | 最胜光明灯无尽功德藏 |\n| 东南 | 金庄严琉璃光普照 | 清净香光明 | 普喜深信王 | 慧灯普明 |\n| 西南 | 日光遍照 | 师子日光明 | 普智光明音 | 普华光焰髻 |\n| 西北 | 宝光照耀 | 众香庄严 | 无量功德海光明 | 无尽光摩尼王 |\n| 下 | 莲华香妙德藏 | 宝师子光明照耀 | 法界光明 | 法界光焰慧 |\n| 上 | 摩尼宝照耀庄严 | 无相妙光明 | 无碍功德光明王 | 无碍力精进慧 |\n\n**规模**：如是十亿佛剎微尘数世界海中，有**十亿佛剎微尘数菩萨**，一一各有世界海微尘数菩萨众前后围绕而来集会；一一各现世界海微尘数供养云；坐定已，身毛孔中一一各现十世界海微尘数光明（105–109）。\n\n**本会说法之菩萨（承佛威神/威力，次第说颂·逐组起句与偈数见 §2.6）**：\n- **一切法胜音**（白毫出众）：颂「佛身充满于法界……」\n- 次第：观察一切胜法莲华光慧王／法喜慧光明／香焰光普明慧／师子奋迅慧光明／法海慧功德藏／慧灯普明／华焰髻普明智／威德慧无尽光／法界普明慧／精进力无碍慧（**十大士**，各一颂）。\n- 〔**注**〕上述诸菩萨名与 §2.5 表中「上首菩萨」**部分同名而异**（如「慧灯普明」既为东南上首、又为会说颂主），系经文「同名」之例，**非笔误**，据实并记。\n**会读**：华严会众「**位次不滥、重重相应**」——十方各带其世界海之佛、土、众而来，正是「一即一切」之众会观。\n\n### 2.6 偈颂支分总表（逐颂标定·据经切分）\n\n**方法**：取 `T10n0279` **卷第六**纯文本（剥标签），以「…而說頌言／而說頌曰／說此頌言」为切分点，逐组以「。」数**计偈**（每偈四句，句末「。」）；**先实测后结论**，数目皆自经文点出，非估。\n\n**（一）前导三颂**（眉间光之前）\n\n| 序 | 出处 | 起句 | 偈数 |\n|----|------|------|------|\n| 前①| 自然出音（承「念请」） | 無量劫中修行滿，菩提樹下成正覺…… | **2** |\n| 前② | 面门光·光中说颂（众会前） | 無量劫中修行海，供養十方諸佛海…… | **10** |\n| 前③ | 光中同时发声（云奔后） | 諸光明中出妙音，普遍十方一切國…… | **10** |\n\n**眉间光后·胜音领颂＋十大士各一颂**（皆「承佛威神／威力，观察十方而说颂」）：\n\n| 序 | 说法者 | 起句 | 偈数 |\n|----|------|------|------|\n| 1 | 一切法胜音（白毫出众） | 佛身充滿於法界，普現一切眾生前…… | 10 |\n| 2 | 观察一切胜法莲华光慧王 | 如來甚深智，普入於法界…… | 10 |\n| 3 | 法喜慧光明 | 佛身常顯現，法界悉充滿…… | 10 |\n| 4 | 香焰光普明慧 | 此會諸菩薩，入佛難思地…… | 10 |\n| 5 | 师子奋迅慧光明 | 毘盧遮那佛，能轉正法輪…… | 10 |\n| 6 | 法海慧功德藏 | 此會諸佛子，善修眾智慧…… | 10 |\n| 7 | 慧灯普明 | 一切諸如來，遠離於眾相…… | 10 |\n| 8 | 华焰髻普明智 | 一切國土中，普演微妙音…… | 10 |\n| 9 | 威德慧无尽光 | 一一佛剎中，處處坐道場…… | 10 |\n| 10 | 法界普明慧 | 如來微妙身，色相不思議…… | 10 |\n| 11 | 精进力无碍慧 | 佛演一妙音，周聞十方剎…… | 10 |\n\n**统计**：前导三颂 ＝ **22 偈**（2＋10＋10）；眉间光后 **11 组 × 10 偈 ＝ 110 偈**。卷六偈颂合计 **132 偈**（132 偈 ÷ 4 ＝ 528 句偈行；与 §7.2 之「208 句」为**两种口径**，句含散文，不可互校）。\n\n**〔编制说明·一处旧说订正〕**：旧稿称「**十大士颂（135–224）**」「**十菩萨**承佛威神说颂」，其数系**以胜音之后之十位计**；然依经文实点，**眉间光后说颂之主共十一位**——**胜音领一颂，次第更有十大士各一颂**，合十一组。故本文改述为「**胜音＋十大士（十一组）**」，以免「十」字含混（承 §7.2「先统计后结论」之例）。其起句、偈数皆**逐组回源 `T10n0279` 卷六**点出，非估数。\n\n## 三、旁参：卷第七（**非本品**）\n\n> **〔旁参非本品〕** 卷第七首为《普贤三昧品第三》，**不属《如来现相品》**。因海云以「如来现相为果，普贤三昧为行」二者相属（详见 §5.4），故节录为**相邻品参照**，不入本品逐段校勘。欲详究第三品者，宜另立专篇。\n\n### 3.1 普贤三昧品（第三品）节录·参照\n\n**经文起（卷七，`T10n0279`）**：「爾時，普賢菩薩摩訶薩於如來前，坐蓮華藏師子之座，承佛神力，入于三昧。此三昧名：**一切諸佛毘盧遮那如來藏身**，普入一切佛平等性，能於法界示眾影像……」\n\n**与本品之关系**：本品（第二）为「**果**」（如来现相）之展示，第三品为「**行**」（普贤入三昧）之起手——海云判「如来现相是果，普贤三昧是行；先果后行」（§5.4.1）。故第三品虽非本品，读本品者宜知此**果行相续**之势。\n\n〔**非本品**〕本节仅存**相邻品参照**，不作逐段校勘；欲究第三品者宜另立专篇（登记于 §7.4／附录六）。\n\n### 3.2 演说法要\n〔旁参·未及〕第三品「普贤三昧→诸佛称赞→普贤说颂」之次第，与本品「现相→众颂」结构相类，可对照读；本席未及细勘，如实标〔未及〕。\n\n### 3.3 结归与流通\n〔待续〕\n\n### 3.4 小结\n〔待续〕\n\n## 四、义理要点与名相\n\n### 4.1 十身思想\n\n**界定（先辨名·免混）**：华严「**如来十身**」（菩提身／愿身／化身／力持身／相好庄严身／威势身／意生身／福德身／法身／智身）为祖师大德于**后出诸品**（〈如来十身相海品〉〈如来出现品〉等）及疏钞中结撰之**教义**；本席核 `T10n0279`，「**十身**」三见、「**如来十身**」二见**皆不在本品（卷六）**，故第二品**未直说「十身」名目**，不可以后起之目径填本品。\n\n**本品所实有·法身与色身对举**（回源 `T10n0279` 卷六，承佛威神说颂）：\n\n> 「如来甚深智，普入于法界，能随三世转，与世为明导。**诸佛同法身，无依无差别，随诸众生**意**，令见佛色形**。具足一切智，遍知一切法，一切国土中，一切无不现。**佛身及光明，色相不思议**，众生信乐者，随应悉令见。于一佛身上，化为无量佛……」\n\n- 此颂以**法身**（无依、无差别、同虚空）与**色形／色相**（随众生意见、如影像）对举，正是如来「现相」之义理根柢；与 §4.2「现相」、§5.1 澄观「能现／所现」相贯通。\n- 〔本文判断〕本品之「法身—色形」对举，为后来「十身」教义之**经证前身之一**；然**由经入义（十身名目）之结撰属祖疏**，本细读分记「经有」与「疏立」两层，不混。详见 §5.1／5.2。\n\n**梵语**：法身 `dharmakāya`；色身／色形 `rūpakāya`／`rūpa`。〔通行译语，非本品专出。〕\n\n### 4.2 如来现相（pratibhāsa/abhivyakti）\n\n**教义核心**：全品以「光相表示」为宗（澄观语），即「如来是能现之人，相是所现之法」。澄观判曰「如来现相各有五义，以成其十」——如来五义（理显／行／理智合说／离相／融摄）＋现相五义（面门光相、眉间光相、振动刹网、佛前现华、白毫出众），故合为「十义」。详见 §5.1 澄观节级选要。\n\n**名相**：`pratibhāsa`（梵，「显现／光照」义，华严语境中指佛以光明示现）／`abhivyakti`（「开显／显现」）。〔梵文对应暂标〔待核〕，待梵本原典校定。〕\n\n### 4.3 光明思想（光网）\n\n**本品光明叙事之三节**（据 `T10n0279` 卷六，回源）：\n1. **眉间光（说法主光）**：世尊「放眉间光，此光名：**一切菩萨智光明，普照耀十方藏**。其状犹如宝色灯云，遍照十方一切佛刹……又普震动诸世界网，一一尘中现无数佛」。\n2. **光召有缘**：其光「普照十方各一亿佛刹微尘数世界海」，彼世界海诸菩萨众「于光明中，各得见此华藏庄严世界海」；「光明普照于十方，应受化者咸开觉」。\n3. **毛孔光网**：颂云「**一一毛孔中，光网遍十方**，演佛妙音声，调彼难调者。**如来光明中，常出深妙音**，赞佛功德海」——光明与音声不二，即「光中说法」之象。\n\n**义理**：光非徒瑞相，而是「**光相表示**」（澄观宗趣语）之载体——**以光为教体**，令十方有缘同见同入；故光网重重，即华严「一即一切、重重无尽」之教相化。与 §5.1 澄观「现相五义」（面门光／眉间光／振刹网／佛前现华／白毫出众）互证。\n\n**名相**：`raśmi`（梵，光／光明）／`prabhā`（光辉）；「光网」可拟 `raśmi-jāla`〔待核，待梵本〕。\n\n### 4.4 名相训释（择代表不逐一枚举）\n\n| 名相 | 释义 | 梵语〔待核〕 |\n|------|------|------|\n| 念请 | 以身、语、意中**意业**为请（本品众海「作是思惟」即念请） | —（汉译名相） |\n| 面门 | 面；法藏释兼「面·口·门」三义（§5.2，`mukha`） | `mukha` |\n| 眉间光 | 佛眉间所放之光，此处为「说法主光」 | `bhru-madhya`〔待核〕 |\n| 白毫 | 佛眉间白毫相；「白毫出众」表教从佛流 | `ūrṇā`／`ūrṇā-kośa`〔待核〕 |\n| 供养具云 | 众海所现之供养云（重重遍虚空而不散灭） | `pūjā-megha`〔待核〕 |\n| 无能摄取 | 「云何是诸佛无能摄取」（甲组末问）——〔待核〕，疑指佛「无能制/无能摄」之自在 | — |\n| 法身／色形 | 法身为体，色形（色身）为用 | `dharmakāya`／`rūpakāya`·`rūpa` |\n\n**说明**：本品为「**光相表示**」之品，名相多属**法数**（诸佛十法／诸海二十）而非专名；上表择要，梵语凡无把握者一律〔待核〕，**不硬造**。\n\n## 五、注疏选要（节级贯通）\n\n### 5.1 澄观（T1735／T1736）\n\n**来源**：澄观《大方广佛华严经疏》卷第九·如来现相品第二（CBETA `T1735`；本机所藏为 CBETA 电子书 PDF 抽取本，OCR 原文用康熙部首异体字，此处已归一为标准字形，仍待与原典二次校对）。\n\n**释名（如来现相各有五义，以成其十）**：\n\n> 「如來是能現之人，相是所現之法，現通能所能所合說，體用雙陳以立其稱。然如來現相各有五義，以成其十。」\n>\n> **如來五義**：「一就理顯，謂法性名如，出障名來；二唯就行，瑜伽云『言無虛妄故名如來』；三理智合說，轉法輪論云『第一義諦名如，正覺名來』；四離相說，般若云『如來者，無所從來亦無所去，故名如來』；五融攝說，謂一如無二如……如是來者是真如來。」\n>\n> **現相五義**：「一現面門光相，召十方眾；二現眉間光相，示說法主；三振動剎網以警群機；四佛前現華表說依果；五白毫出眾表教從佛流。」\n\n**宗趣**：\n\n> 「二品宗者，以光相表示為宗，令上智玄悟為趣。」\n\n**判品科段（六分）**：\n\n> 「今此一品大分為六：一眾海同請，二光召有緣，三所召雲奔，四現瑞表說，五稱揚佛德，六結通無窮。」\n\n〔要点〕澄观以「光相表示為宗」总摄全品，与下文 §4.2／§6.1 之「現相」「光明」两线相扣；其六分科判为第二品结构分析之纲，§3 段落划分即以此为准绳逐段对应。〔T1736《隨疏演義鈔》对应条之节级摘录待补。〕\n\n### 5.2 法藏（T1733）\n**《華嚴經探玄記》**（`T1733`，如來現相品段）節級選要：\n\n- **科判十門**：「就此文中長分有十：一面光集眾分、二毫光示法分、三法主入定分、四諸佛加持分、五大眾同請分、六定中略說分、七起定成益分、八毛光讚德分、九許說令喜分、十正陳法海分。」\n- **釋「面門」**：「面門者諸德有三釋：一云是口；一云是面之正容非別口也；光統師云鼻下口上中間是也。……今釋依梵語稱面及口并門悉名目佉，是故翻此目佉為面門也。……口者為表教道遐被也，面者正對向機也，門者開法攝生也。」（「目佉」＝梵 `mukha` 之音譯，面・口・門三義）\n- **放光四意**：「此中放光有四意：一現相表實，二驚起信心，三照觸救苦，四為集眾遠召。」\n- **光所出十門**：「三別顯所出有十門……別明初六佛海，次二器海，次一眾生海，後一法界方便海。」\n\n〔註：三譯科判差異為第二品結構分析之要點（法藏十門／澄觀六分），列入 §7 逐段比對。〕\n\n### 5.3 李通玄（T1739／X0223）\n**《新華嚴經論》（合論，`X0223`）** 如來現相品段節級選要：\n\n- **眉間光判释**：「此眉間光，從初會中如來現相品中，如來於眉間放果德光明，入足下輪中，明以果成因，便令普賢菩薩示佛果德，令其信樂。」\n- **光名与體**：「初會中如來眉間放佛果光明，名『一切菩薩智光明普照耀十方藏』……其狀猶如寶色燈雲。」\n- **判教意义**：李通玄以「眉間光」表中道果終之義，与《十地品》所述眉间放光前后「終而復始」相呼应，判此品为「舉果勸修」之初會。\n\n〔经证：以上光名与體，已在 CBETA `T10n0279`（八十華嚴）原文核对，作「放眉間光，此光名：一切菩薩智光明，普照耀十方藏。其狀猶如寶色燈雲」（详见 §6.1 ①）。〕\n\n### 5.4 会读（海云讲记）\n\n> **〔回源更正·如实记〕** 本席初判「无第二品海云讲记」系**检索范围失误**——只搜了「八十华严之02品…」目录，未及 `浩瀚华严海/八十华严导读-西安草堂寺201005/`（草堂寺 2010 年《八十华严导读》全 25 讲）。该导读**逐品通讲**，于第二品《如来现相品》有直说（见 02／04／05／07 讲），故此处**据实补入**。与 §6.1 六十华严之误判同源（**未见 ≠ 无**），并记自省。\n\n**来源**：海云继梦和上《八十华严导读》（西安草堂寺 201005），本机 `docs/huayanhai/华严云海/浩瀚华严海/八十华严导读-西安草堂寺201005/听录/`（口说**听录**，属二手转写，措辞或有出入，凡与经不合者以经为正）。以下引海云语皆逐字取自听录原文。\n\n#### 5.4.1 本品在全经结构中之位（三大循环·先果后行）\n- 海云自陈其结构与清凉等传统判位**不同**：「传统历史的说法：清凉国师把它翻成啊，它是属于第一会……但这一会啊……《世主妙严品》这一品呐……它是个序幕」。其说：「《世主妙严品》他不在这个范围里头……是属于整个《华严经》的序分，序幕嘛」。\n- 第二品起入正题：「那么第二品呐，就开始了，这些主角统统上场了……那《现相品》就『如来出现』了，那现场主角出来了嘛，主席出来了」。\n- **先果后行**：「这『如来现相』是果，『普贤三昧』是行……这『普贤三昧』直接讲的就是『三昧』……三昧翻成中文就叫『正定』」；「先果后因呐」。其后三十六《普贤行品》为因行、三十七《如来出现品》为果相，「前面第二品先果后行，这里先行后果……这刚好一个循环」。\n- **全经三循环**：「第二品开始到三十七品一个循环，三十八品是第二循环——《离世间品》，三十九品是第三个循环——《入法界品》，《华严经》一共有三个循环」。（**此系海云一家之判**，与经文科判传统对读时须分记，勿径视为经证。）\n\n#### 5.4.2 品名之辨：现相／十身相海／如来出现\n- **大小相之别**：「《如来十身相海品》呐，叫做『大相品』，这个叫『小相品』，两个都现相了」；「《如来出现品》是那个果实在树上成熟了，这个《如来现相品》呐，是果实已经搬到桌子上来了」。\n- **现相之相无定形**：「如来现相并没有说佛长成什么样子，没有啊。他是个大光明体啊」；「整个经文那都没有讲到他现什么相」。此可与 §5.1 澄观「现相五义」并读（澄观以**面门光／眉间光／振刹网／佛前现华／白毫出众**五者立「相」之名，正鉴于此品「无相之相」）。\n\n#### 5.4.2′ 大光明体·觉知而非形相（导读04）\n> 「如来现相以后真正的是那种觉知的状态产生了……如来『知诸众生心之所念』。那这样子，那这时候啊，佛还是一个抽象的，这个叫什么？大光明体……他本身就是一个大光明体……当这些生命因素都兑现的时候，那大光明体就出现了，他不是一个有形的东西，他是一个本体，一个本质。」\n\n- 海云以四十问之「第一个十问」即显「觉悟的本质」：「这四十问当中的第一个十问哪，就讲这个本质，觉悟的本质」。\n\n#### 5.4.3 「念请」——四十问之性质\n- 本品大众「念请」（非言请、问请）：「这个请法是一种生命因素的相应……它是念请，不是言请，不是问请，它是生命因素的一种的激荡」；「请，只是一种叩，我们叫叩应……这个相互激荡，互相表达，这个就是问答。所以呢叫做念请。有请法就有转法轮」。\n- 四十问之地位（海云极力拈提，视为学华严之「疑情」）：「这『四十个问题』是所有想要学华严的人，这『四十个问题』要放在案头，当做『疑情』……佛讲的就是这『四十个问题』，在答这『四十个问题』」。\n  〔**注**〕此「四十问」即本品「唯愿世尊……开示」诸问（卷六），其**支分与计数**当据经文另立一表，见 §7 待补。\n\n#### 5.4.4 经文偈·回源与校异（导读05）\n海云于 05 讲引本品大众赞佛偈，本席回核 `T10n0279` **实有其偈**（卷六）：\n\n- **听录作**：「无量劫中修行满，菩提树下成正觉，为度众生普现身，如云充遍尽未来，众生有疑皆使断，广大信解皆令发，无边际苦普使除，诸佛安乐咸令正。」\n- **经本作**：「无量劫中修行满，菩提树下成正觉，为度众生普现身，如云充遍尽未来，众生有疑皆使断，广大信解**皆令发**〔按：经本作「皆令发」抑或「皆令发」从底本〕，无边际苦普使除，诸佛安乐**咸令正**。」\n\n〔**校异要点·据实标明**〕末二句听录作「广大信解**皆令发**，诸佛安乐**咸令正**」，一本（本席所核底本）作「广大信解**皆令发**……咸令正」；**听录与底本字面有小异，且听录系口说转写，末句「咸令正」与常见经文用字不全合**——凡此一律**以经本为正**，听录异字不径改经，亦不据听录回改底本。此为「引文逐字回源」之纪律所在。\n\n#### 5.4.5 余讲（导读04）\n> 「如来现相，你看到什么呢？没有……如来现相以后真正的是那种觉知的状态产生了」；\n> 又 04 讲以《世主妙严品》「**彰显佛境界的存在跟殊胜**」、本品「**如来现相就是佛现相**」两句作结（07 讲），可作两品判分之一简洁梗概。\n\n**界限**：以上皆海云**口说听录**之**解读**，非经证、非法师著述，措辞出入与年代细节（如「四十问」之归属）须以 CBETA 经本为准；采录之意义在存其**判读视角**（先果后行·序品独立·大光明体·念请），不以其说替代注疏。\n\n## 六、文本对读与校勘\n\n### 6.1 样板段落：全套并列（八十／六十／四十）\n\n**对读方法（本批订补）**：三译对读**一律以原典逐字为准**——八十用 `T10n0279`（CBETA）底本，六十用 `T09n0278`、四十用 `T10n0293`。坊间《四十六十八十华严对比合集》可作导读，**惟其对齐偶有错置**（据主编所见），**不得径据以入正文**；凡本细读之对读，皆**回校两原典逐字摘录**，异文并列、各存其文，**不以一家改另一家**（与 §1.6 版本差异惯例一致）。\n\n**六十分合总说**：六十华严（`T09n0278`）**无独立「如来现相品」**——其内容归入〈卢舍那佛品第二〉（分「之一／之二／之三」等子卷）。以本批回源所见，八十第一会前数品（世主妙严·如来现相·普贤三昧……）之内容，**六十多并入〈卢舍那佛品〉之内**，故对读须知**二译分品不同、内容同源**：六十之「世尊放眉间白毫相光」段、光明中出声颂、白毫出众勝音段，皆与本品逐段对应（见下 ①－③）。\n\n**样例段落（初步定位，起訖仍待精校）**\n\n- **① 如來現相・光明普照段（卷六）**\n\n  **八十華嚴要句擷錄**（底本 T10n0279，逐字取自 XML 純文字，待標校勘作最終定本）：\n\n  > **〔眉間光段・本品核心〕**「爾時，世尊欲令一切菩薩大眾得於如來無邊境界神通力故，放眉間光，此光名：一切菩薩智光明，普照耀十方藏。其狀猶如寶色燈雲，遍照十方一切佛剎，其中國土及以眾生悉令顯現。又普震動諸世界網，一一塵中現無數佛。」\n\n  > 「其光悉具眾妙寶色，普照十方各一億佛剎微塵數世界海。彼世界海諸菩薩眾，於光明中，各得見此華藏莊嚴世界海。」\n  > 「光明普照於十方，應受化者咸開覺，令趣菩提淨無礙。」\n  > 「佛昔往來諸趣中，教化成熟諸群生，神通自在無邊量，一念皆令得解脫。」\n\n  **六十華嚴對讀（T09n0278，節級並列·已回源）**\n\n  六十華嚴於此段**無獨立「如來現相品」**——其內容歸於〈盧舍那佛品第二〉，故名相、光名、次第皆異，正見二譯編次之別。並列如下：\n\n  > **八十（如來現相品）**：「爾時，世尊欲令一切菩薩大眾**得於如來無邊境界神通力故**，放眉間光，此光名：**一切菩薩智光明，普照耀十方藏**。**其狀猶如寶色燈雲**，遍照十方一切佛剎，其中國土及以眾生悉令顯現。又普震動諸世界網，一一塵中現無數佛。……作是事已，右遶於佛，**從足下入**。爾時，佛前有大蓮華，忽然出現。……此華生已，一念之間，於如來白毫相中，有菩薩摩訶薩，名：**一切法勝音**，與世界海微塵數諸菩薩眾，俱時而出……」\n\n  > **六十（盧舍那佛品）**：「爾時世尊。欲令一切菩薩大眾。**知佛無量無邊境界自在法門故**。放眉間**白毫相一切寶色燈明雲光**。名**一切菩薩慧光觀察照十方藏**。此光遍照一切佛剎。於一念中。皆悉普照一切法界。……**還從足下相輪中入**。……此華生已。如來眉間有一大菩薩出。名曰**一切諸法勝音**。與世界海塵數菩薩眾俱……」\n\n  **異文要點**（節級對勘，不強求逐字對齊）：\n  1. **立意**：八十作「得於如來無邊境界**神通力**故」；六十作「知佛無量無邊境界**自在法門**故」。\n  2. **光名**：八十「一切菩薩**智光明，普照耀**十方藏」；六十「一切菩薩**慧光觀察照**十方藏」。\n  3. **光相**：八十「其狀猶如**寶色燈雲**」；六十「放眉間白毫相**一切寶色燈明雲光**」。\n  4. **眉間出眾菩薩名**：八十「一切法勝音」；六十「一切諸法勝音」。\n  5. **偈首**（勝音颂首偈，详下 ③）：八十「佛身充滿於法界，普現一切眾生前，**隨緣赴感靡不周**，而恒處此菩提座」；六十「佛身充滿諸法界 普現一切眾生前 **應受化器悉充滿** 佛故處此菩提樹」。\n  6. **放光名义**：八十仅作「放**眉間**光」，**光名另出**（「此光名：一切菩薩智光明，普照耀十方藏」）；六十则作「放**眉間白毫相**一切寶色燈明雲光，名一切菩薩**慧光觀察照**十方藏」——**六十将「白毫相」并入光体**。\n  7. **光入处**：八十「作是事已，右遶於佛，**從足下入**」；六十「顯現普賢菩薩，示大眾已，**還從足下相輪中入**」。\n  8. **白毫出众**：八十「於如來**白毫相**中，有菩薩摩訶薩，名：**一切法勝音**」；六十「如來**眉間**有一大菩薩出，名曰**一切諸法勝音**」——一出「白毫相」、一出「眉間」，菩萨名「法勝音／諸法勝音」微异。\n\n  〔**四十華嚴（T10n0293）不涉本品**：四十華嚴惟〈入法界品〉一會，與第二品無對應，如實記闕，不強湊。〕\n\n  **對讀方向（暫定）**：梵藏對讀先從 `pratibhāsa`／`ābhā`、`raśmi`（光）、`mukha`（面門，法藏釋為面・口・門三義）相關 10～15 條起步（暫標〔待核〕）；古注節級選要：澄觀《華嚴經疏》`T1735`／《隨疏演義鈔》`T1736`、法藏《華嚴經探玄記》`T1733`、李通玄《新華嚴經論》`X0223`，必注頁碼定位，未核不引。〔**本段已定**：眉間光段經文＋**八十／六十節級並列（五則異文）**＋澄觀「現相五義・面門光相」＋法藏「毫光示法分・面門釋・放光四意」＋李通玄「眉間光中道果終」皆已回源，見 §5.1／5.2／5.3。梵藏對照待梵本／藏譯。〕\n\n- **①′ 光中出声颂（十方菩萨）对读·补**（逐字回源）\n\n  八十（`T10n0279`·卷六，「爾時，諸菩薩光明中同時發聲，說此頌言」）：\n\n  > 諸光明中出妙音，普遍十方一切國，演說佛子諸功德，能入菩提之妙道。／劫海修行無厭倦，令苦眾生得解脫，心無下劣及勞疲，佛子善入斯方便。／盡諸劫海修方便，無量無邊無有餘，一切法門無不入，而恒說彼性寂滅。／三世諸佛所有願，一切修治悉令盡，即以利益諸眾生，而為自行清淨業。／一切諸佛眾會中，普遍十方無不往，皆以甚深智慧海，入彼如來寂滅法。／一一光明無有邊，悉入難思諸國土，清淨智眼普能見，是諸菩薩所行境。／菩薩能住一毛端，遍動十方諸國土，不令眾生有怖想，是其清淨方便地。／一一塵中無量身，復現種種莊嚴剎，一念沒生普令見，獲無礙意莊嚴者。／三世所有一切劫，一剎那中悉能現，知身如幻無體相，證明法性無礙者。／普賢勝行皆能入，一切眾生悉樂見，佛子能住此法門，諸光明中大音吼。\n\n  六十（`T09n0278`〈卢舍那佛品〉，「尔时诸菩萨光明中，以偈颂言」）：\n\n  > 一切光明出妙音 说诸菩萨具足行 佛子功德悉成满 普遍一切十方界／无量劫海修行道 欲令众生离苦故 不自计己生死苦 佛子善入大方便／无量无边无有余 穷尽一切大海劫 遍行一切诸法门 善说微妙寂静法／一切三世佛所愿 皆得清净具足满 佛子饶益诸众生 能自具行清净道／皆能往诣诸佛所 清净法身照十方 佛子智海无边底 普观诸法寂灭相／一光明中有无量 无上大慈难思议 清净慧眼照诸法 此是佛子妙境界／一毛悉受诸佛刹 又能震动诸国土 能令众生无怖想 是名清净方便地／一一尘中无量身 复现无量庄严刹 于一念中皆悉见 是无障碍净法门／三世所有一切劫 于一念中能悉现 犹如幻化无所有 是名诸佛无碍法／普贤诸行皆具足 能令众生悉清净 诸佛子具自在法 一一毛孔师子吼\n\n  **异文要点（此颂）**：二译**结构平行**（皆十偈；皆以「光明出音」起、以「光／毛孔大音吼」结；皆含「一毛／毛孔」「一一尘中无量身」「三世所有一切劫」诸偈）。用字与句序略异——八十「諸光明中出妙音」／六十「一切光明出妙音」；八十「能入菩提之妙道」／六十「普遍一切十方界」；八十「而恒說彼性寂滅」／六十「善說微妙寂靜法」；末偈八十「諸光明中大音吼」／六十「一一毛孔師子吼」。**足证六十虽不立「现相」品名，其内容与八十逐偈同源。**\n\n  **〔次序注〕** 此颂在二译**皆置于「世尊放眉间光」之前**（八十：「諸菩薩光明中同時發聲」→「爾時世尊……放眉間光」；六十：「尔时诸菩萨光明中，以偈颂言」→「尔时世尊……放眉间白毫相……」），对读时勿倒置。\n\n- **②′ 勝音颂（白毫出众）对读·补**（逐字回源）\n\n  八十（`T10n0279`·卷六，勝音菩萨「承佛威神，觀察十方而說頌曰」）：\n\n  > 佛身充滿於法界，普現一切眾生前，隨緣赴感靡不周，而恒處此菩提座。／如來一一毛孔中，一切剎塵諸佛坐，菩薩眾會共圍遶，演說普賢之勝行。／如來安處菩提座，一毛示現多剎海，一一毛現悉亦然，如是普周於法界。／一一剎中悉安立，一切剎土皆周遍，十方菩薩如雲集，莫不咸來詣道場。……\n\n  六十（`T09n0278`〈卢舍那佛品〉，一切諸法勝音菩萨「以偈颂曰」）：\n\n  > 佛身充滿諸法界 普現一切眾生前 應受化器悉充滿 佛故處此菩提樹／一切佛剎微塵等 爾所佛坐一毛孔 皆有無量菩薩眾 各為具說普賢行／無量剎海處一毛 悉坐菩提蓮華座 遍滿一切諸法界 一切毛孔自在現\n\n  **异文要点（此颂）**：**首偈差异最大**——八十「隨緣赴感靡不周，而恒處此菩提座」／六十「應受化器悉充滿，佛故處此菩提樹」（一作「隨緣赴感」、一作「應受化器」）；**第二、三偈大体对应**（诸佛坐「一一毛孔」、无量菩萨「演說／具說普賢行」、「無量剎海處一毛」皆见）。菩萨名微异（八十「一切法勝音」／六十「一切諸法勝音」，见异文要点 8）。\n\n- **② 十身說段（建議範圍：卷六）**\n\n  **初步擬定**〔起訖仍待精校〕：華嚴十身思想。以下為八十華嚴（T10n0279·卷六）擷錄之相關偈句，以作法身・應身・化身對讀之雛形。\n\n> 「諸佛同法身，無依無差別，隨諸眾生意，令見佛色形。」\n> 「法身同虛空，無礙無差別，色形如影像，種種眾相現。」\n\n  **對讀方向（暫定）**：八十／六十／四十三譯對比，列差異要點；古注節級選要：法藏《華嚴經探玄記》`T1733`、澄觀《華嚴經疏》`T1735`／《隨疏演義鈔》`T1736`、李通玄《華嚴經論》`T1739`／《華嚴經合論》`X0223`，必注頁碼定位。\n\n- **③ 品末結歸段（建議範圍：卷七）**\n\n  **初步擬定**〔起訖仍待精校〕\n\n  **處理原則（沿用第一品）**：先統計「解脫門」「偈頌」結構，不預設門偈必對應；如無門位則如實記錄，不強行補足。並核對敘事收束與流通段落，列出三譯差異要點。\n\n〔以上逐句並列需以原文逐段精校後確定；經文一律不改、不補、不臆。〕\n\n### 6.2 梵藏对读（起步：10～15 条）\n\n> **〔材料边界·如实记〕** 本机**无梵本**（如 Dutt／Honda 校本 Gaṇḍavyūha·Daśabhūmika 等）**亦无藏译本**（Toh 44《华严经》／Phal chen）之电子原文，故下表**梵藏栏一律标〔待核〕，不臆填**——待外部原典到手后逐条回填（登记遗留）。所标「通行梵语」仅属学界常见拟音，**非据本经梵本**。\n\n| 汉 | 通行梵语〔待核〕 | 藏〔待核〕 | 备注 |\n|----|------------------|-----------|------|\n| 如来现相 | `tathāgata-pratibhāsa`〔拟，待核〕 | — | 品名核心 |\n| 光明 | `raśmi`／`prabhā` | — | 通行 |\n| 面门 | `mukha` | — | 法藏三义（§5.2） |\n| 眉间（光） | `bhru-madhya`〔拟〕 | — | — |\n| 白毫 | `ūrṇā`／`ūrṇā-kośa` | — | — |\n| 法身 | `dharmakāya` | — | — |\n| 色身／色形 | `rūpakāya`／`rūpa` | — | — |\n| 莲花藏 | `padma-garbha` | — | 华藏世界海 |\n| 师子座 | `siṃhāsana` | — | — |\n| 供养（云） | `pūjā`／`pūjā-megha`〔拟〕 | — | — |\n| 三昧／正定 | `samādhi` | — | 第三品 |\n| 世界海 | `loka-dhātu-sāgara` | — | 二十海之首 |\n| 解脱（门） | `vimokṣa`／`vimokṣa-mukha` | — | 本品「解脱门」=0 |\n\n〔**待办**〕①梵本：Dutt《Gaṇḍavyūha》校订仅含入法界品，本品梵文须查**中央亚细亚出土残片**或**Khadaliq 梵文华严残片**（L.116 前批已及叶码 382·5–6 世纪）；②藏译：须 `Toh 44`（ʼPhags pa sangs rgyas phal po che）相应品对勘。③Sanskrit 通行拟音须以**梵本原典**坐实，不得以今拟充经证。\n\n### 6.3 校勘要点\n\n- **底本**：`T10n0279` 卷六（本席所据为 CBETA XML，已剥 `<note>`／`<app>` 校勘栏目）。\n- **六十华严对勘**：本品在六十华严（T09n0278）**无独立品名**，内容入〈卢舍那佛品第二〉，异文五则及对读详见 §6.1 样板①。\n- **四十华严**：惟〈入法界品〉，与本品无涉，永久记阙。\n- **CBETA 校勘记**：本品卷六内含 `T10n0279` 之校勘栏目（已剥离）；凡底本与校记用字有异者，本细读**从底本**，不擅改（同「不擅改经文」凡例）。\n- **待核**：六十逐段全量对照、梵藏原典对勘、T1736（演义钞）／T1739（新华严经论）对应条——皆待补（§7.4／附录四）。\n\n### 6.4 藏译（Toh 44）对应品与「汉译所缺之品」辨正\n\n> **缘起·一问之答**：有问「藏译中**紧接《如来现相品》的下一品**，是否即汉译《华严》所缺之一品？」——**经考，答曰：非也**。藏译所多之二品**皆不紧邻本品**；详细如下，以正是非、免生误植。\n\n**一、藏译《华严经》概况**（T2，据北大《试论〈华严经〉的构成与流布——以梵藏文献为中心》）：\n- 品数 **45 品**、**39,030 颂**，德格等《甘珠尔》作 130 或 115 卷、四函。\n- 译者：**胜友（Jinamitra）、智军（Ye shes sde）**，遍照（Vairocana-rakṣita）校；**原本来自西域于阗**〔并存〕。\n- 与汉本「**品目分类不一致而基本内容一致**」，多出两品（下）。\n\n**二、藏译多出之二品**（T2）：\n\n| 藏译位次 | 品名 | 汉译 | 位置 |\n|---------|------|------|------|\n| **第 11 品** | 如来华严品（*Tathāgatāvataṃsaka-parivarta*，藏 De bzhin gshegs pa phal po che'i le'u） | **汉译全缺** | **毗卢遮那品（汉第 6）之后、如来名号品（汉第 7）之前** |\n| **第 32 品** | 普贤宣说品（藏 Kun tu bzang pos bstan pa'i le'u） | 汉有别译《大方广普贤所说经》**T0847**（非入八十华严） | 十地品之后、十定品之前 |\n\n**三、辨正**：由「藏译第 12 品＝如来名号品（汉第 7）」（《兜沙经》同本，北大文注 71 明言）可定——藏译**第 1–10 品**对应汉文第一会**第 1–6 品**（世主妙严～毗卢遮那，藏译将其分得更细），**第 11 品《如来华严品》插于第一会末**。故：\n- **紧接本品（汉第 2）之藏译次品**，属**汉第 2～6 品所摄**（现相/三昧/世界成就/华藏/毗卢遮那之细分），**并非汉译所缺之品**。\n- 汉译所缺之**《如来华严品》**虽**不紧邻本品**，然与本会同属**第一会末**，主题（**成道、现相、掌中世界海、放光**）亦与本品**相通**，故**并记于此，以备参读**（下次详勘另立）。\n\n**四、藏译《如来华严品》内容梗概**（T2/T3，据日野泰道〈西藏译华严经の第十一品〉等，**本机无藏文原文，系学术转述，非引原典**）：\n- 该品「**无说法，唯放光**」，其所说由**承佛力之菩萨**代宣——与本品「如来不言、以光相表示」之格**同一机杼**。\n- 述「**智慧广大海毗卢遮那如来**」**掌中世界海**：如来掌中有十世界海微尘数之世界海，上有各十世界海微尘数之**法界、虚空界、火界、水界、地界**次第安住；有**十世界海微尘数之大莲华**生，其上安立此世界海——即华严「**如来与世界融即**」之佛身/世界观之要喻。\n- 又述「**如来手掌心中善住世界海**」及东方世界海之佛等；与本品「现相·放光·世界海」诸问**遥相呼应**。\n- **信度**：藏文原典（T1）本机未见，上述系**学术论著转述（T2）**；品文细节**标〔待核〕**，不据以入本品正文之校勘。\n\n〔**待办**〕①取得 `Toh 44`（德格版）第 11 品藏文原文（及 84000 若有之英译）以坐实上述；②比对第 11 品与本品／《毗卢遮那品》之文本层次关系；③`Toh 44` 对勘本品内容（用字/分品）——**保留**（列 §附录四·遗留）。\n\n## 七、本品结构分析（数据层）\n\n### 7.1 字数・句数・段落实测（先实测）\n\n> **〔范围更正〕** 本品＝**卷第六一卷**（据 `T10n0279` 经头品题与《八十华严品卷对照表》，详见 §1.3）。原稿计入「卷七」者实为《普贤三昧品第三》，非本品。\n\n**本品（卷第六）实测**：**8,119 字／208 句**（CJK 剥校勘口径）；若含标点则 9,397 字。**「解脫門」0 见**（与第一品 442 见判若两途，详见 §7.2）。\n\n〔**口径留痕**〕旧稿记「卷六～卷七：18,472 字／406 句（卷六 9,397／卷七 9,075）」系**误并卷七**所致，且为**含标点**口径；今订正为**本品卷六 8,119 字（CJK）**。数字须与单位绑定，勿混（同 L.107 纪律）。\n\n### 7.2 解脱门・偈颂・科句统计（先统计后结论）\n\n**关键结构差异（与第一品对照）**：\n- **「解脫門」＝ 0 见**（本品卷六）。此与《世主妙严品》「解脫門」442 见**判若两途**：本品**不以「得某解脱门」句式为骨架**，改以「念请→放光→现瑞→赞佛」结构展开。故**第一品「组组有门、门偈相当」之框架，不可套用于本品**（同 L.106 卷五「门≠偈」教训）。\n- **导语式**：「承佛威神」8 见、「承佛威力」2 见（各启一菩萨说颂）。\n- **说颂式**：「而說頌言」「即說頌言」「而說頌曰」等，待逐处标定支分。\n- **「爾時」**：44 见（承转标记）。\n\n〔**待办**〕①偈颂支分与导语/说颂配对须逐颂标定（不预设「导语数＝说颂数」）；②〔**已解**〕「念请」支数已据经点定＝**甲 20（云何是诸佛X）＋乙 20（…海）＝四十**（详见 §2.1），海云「四十问」由此坐实。\n\n### 7.3 会众分析（与卷一对比：列举笔法变化）\n\n**本品会众之写法，与《世主妙严品》显著不同**（回源对照）：\n\n| 方面 | 卷一《世主妙严品》 | 本品（卷六） |\n|------|------|------|\n| 会众展开 | **「分组·各得解脱门」**（442 见），组组有门、门偈相当 | **「念请→放光→十方云奔→赞佛」**，「解脱门」0 见 |\n| 主叙为谁 | 各类神众（同生／异生，十九类神等） | **十方世界海之菩萨众**（各带其佛土而来） |\n| 结构骨架 | 名号＋解脱门＋颂（纵向分组） | 方位（十方）＋世界海／国土／佛／上首菩萨（横向铺陈） |\n| 说法方式 | 各众说颂 | **光中自然出音**说颂（前②③，各 10 偈）＋**胜音＋十大士（十一组）**承佛威神说颂（各 10 偈；逐组见 §2.6） |\n| 数量词法 | 「如是等而為上首」 | 「十亿佛剎微尘数」「世界海微尘数」（**重重无尽**之数） |\n\n**结论（与卷一之笔法变化）**：卷一「**以名显行**」（众各有解脱门），本品「**以相显体**」（如来以光相表示，众以方位周遍）——**由「行门陈列」转入「果德遍照」**，正合「第一品为序、第二品为正说之始」之判。\n\n### 7.4 BI／EDA／叙事动画（Narrative 8～10 镜样板）\n〔**未及·登记**〕本品数据层之 BI／EDA 与叙事动画**未做**（第一品已有 narrative／storyboard 两门禁之样板，可移植）。**建议**：依本品「一光召众→十方云奔→白毫出众→十士说颂」结构，试拟 8～10 镜（①念请四十问②面门放光③光中出颂召众④十方云奔⑤供养云遍空⑥眉间光⑦佛前莲华⑧白毫出众⑨胜音说颂⑩法身如影）。**待办**，登记遗留。\n\n## 八、附录\n\n- 附录一：解脱门计数与比勘\n- 附录二：会众名号分类总表（卷第六·本品）\n- 附录三：版本校勘（三译对照要点＋代表段落全并列）\n- 附录四：存疑与未竟事项\n- 附录五：三译代表段落对读（全套样板）\n- 附录六：讲稿与资料入口（海云讲记对应卷次）\n- 附录七：结构可视化（光明网络／十身结构意向图）\n- 附录八：历代祖师与学界解说汇览\n- 附录九：名相·术语「出处＋信度」总表\n- 附录十：图像·文物（如来现相／十身／光明相关）\n- 附录十一：文本分析层（BI）＋必要时 EDA 要点\n\n### 附录四·存疑与未竟（汇总·交接待补）\n\n1. **梵藏原典缺**：本机无梵本、无藏译（Toh 44），§6.2 梵藏栏全〔待核〕——须取 Dutt／Khadaliq 残片／藏译原典。\n2. **六十逐段全量对读**未成（§6.1 仅样板①五则异文）；四十永久记阙。\n3. **T1736（演义钞）／T1739（新华严经论）对应条**未摘（§5 仅 T1735／T1733／X0223）。\n4. **偈颂支分**未逐颂标定（§7.2 待办①）。\n5. **§7.4 BI／EDA／叙事动画**未做。\n6. **专书门禁未立**：本品尚无 `verify_ru_lai.py`（仿   // 该三者施折叠；仅正文 #article-full 与页首会众流程 #article-flow 仍按 h2–h5 分级折叠。
  // 各节工具栏一概不生成（noBar），改由页首「一套」页面级控件统管全页折叠/展开。

// ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);

function _applyArticleENMode(){
  var full=document.getElementById('article-full');
  var btn=document.getElementById('article-en-toggle');
  var hide=(sessionStorage.getItem('article_en_hide')||'')==='1';

  if(btn) btn.textContent=hide?'🌐 英文批注：展开':'🌐 英文批注：显示';
}/* ============================================================================
 * renderArticleBI —— 世主妙严品文本分析层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(BI)。
 *     故本层各节标题皆标 [BI]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 文本分析层</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Textual Analysis Layer</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}

</script>
</body>
</html>
