<script>
var ARTICLE = {"id": "huayan-mingfa-pin", "file": "articles/huayan-mingfa-pin.html", "title": "九九华严第十八品 明法品之拼读", "title_sub": "华严经第十八品·第三会收束品·卷第十八整卷·品界CJK5529（长行4921＋双颂588·32单元）·精进慧问·法慧答前十问即为十段·十法矩阵（十不放逸→十種清淨→十令佛喜×2→十速入地→十行清淨→十增勝→十清淨願→十無盡藏→十波羅蜜→紹三寶種→十莊嚴）·十波罗蜜段CJK695为全品最长·善见药喻结十庄严·澄观疏窗8647（四门·科三分·疏末记第三會竟）·法藏7985·智俨1427（本品有文·异于P17缺口）·慧苑14064（诸家最长）·通玄5335·合论11255·六十〈明法品第十四〉在卷九〔未入库·待核〕·法藏智俨两疏品题直证·六要素齐备·数据层实测", "icon": "📖", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第三会_忉利天宫_差别因果周/华严经细读_第十八部_明法品.md", "doc_md": "# 华严经细读·第十八部：明法品（卷第十八·品十八·第三会收束）\n\n> **EN · Close Reading of the Avatamsaka Sutra, Part Eighteen: The Chapter on Understanding the Teaching**\n\n> **底本**：唐·实叉难陀译《大方广佛华严经》（八十华严）T10n0279。**范围：卷第十八·本品全文（品号第十八）**。本品属**第三会「忉利天宫会」·差别因果周之终曲**，为**第三会收束品**——紧接第十七品《初发心功德品》广叹胜德之后，由精进慧菩萨问、法慧菩萨答，历列**十法矩阵**（十不放逸·十種清淨·十令佛喜·十速入地·十行清淨·十增勝·十清淨願·十無盡藏·十波羅蜜·十莊嚴），明趣后胜进之行而**结第三会**。澄观来意判：「前明當位所成之德，今辨趣後勝進之行」；疏末明记「**第三會竟**」。\n> **立稿**：2026-10-26（L.198 充实批）。承第一会（品 1-6）、第二会（品 7-12）、第三会前五品（品 13-17）之体例与校勘纪律。\n\n---\n\n## 〇、凡例（简要）\n\n一、**校勘底本**：以 T10n0279（八十华严）为底本。六十华严（T09n0278·本品相当者为〈明法品第十四〉·法藏《探玄记》智俨《搜玄记》皆依六十品题科之·存于**卷第十**「`p.0458c14`–`p.0462c24`·CJK 5,485」·旧文作「卷第九」系误，L.206 回源订正·全本 `T09n0278.xml` 已在仓，故六十原文**本批未及全录**〔未竟〕）、四十华严（T10n0293·无明法品·彼但入法界品别行）不作底本；**本品正文一律以八十为准，绝不据他译补写**。\n\n二、**品读主从**：以八十华严为叙事主轴；六十对读因本批未录卷十原文，如实标注〔未竟〕，不臆造对齐（承第二会 P8 铁律）。\n\n三、**引文回源**：本品引经文照 CBETA T10n0279 繁体原字形、逐字回源；不得以记忆或他品经文冒充。异文各照底本、不统一。注疏窗口注入档之 `<<<PAGE N>>>` 分页符（含断行分裂者·29 处）已全数剔除（L.199·正文 CJK 计数不变机检）；康熙部首变体已归一正字。\n\n四、**标识符**：〔待核〕存疑·〔本文判断〕推断·〔未竟〕未完成。\n\n---\n\n<!-- ATLAS:BEGIN P18 -->\n### 〇之零、导读指南（阅读路径与方法）\n\n**定位：** 考证型细读（philological close reading），以「可复核性」为第一优先。本品为第三会**收束之品**，以「十问十答」为骨：问有十句，答即十段，段段以十法应之。读法当**以问为纲、以组为目**——问定其纲，组尽其目。\n**本品一句：** **於佛教中云何修習**——一问十句，答以十段十法；第三会之终，即十行之始。\n**路径：** 〇之二（二图四表）→ 一（品题与脉络）→ 二（全文逐段）→ 四（义理与名相）→ 五（诸家会读）→ 七（数据层）→ 附录按需查阅。\n**方法：** 先经文后诠释；〔实测〕／〔本文判断〕／〔存疑待核〕三分；负面证据同样入账；结构覆盖 100%，个体择要。\n**读前三问：** ① 十问何以恰为十句，其自利利他之配当如何？② 「十法矩阵」与前十住之「双十」有何不同？③ 本品为第三会收束，何以不结会而启下？\n\n## 〇之二、本品内容地图（未入其门，先观其海）\n\n> **本节体例。** 图与表之数据，一律取自本文已回源核定之 §二逐段表与 §7.1／§7.5 实测数；**凡属推断者标〔本文判断〕，不入图**。图各看一事，勿求一图而尽本品。\n\n### 〇之二.0 提要\n\n本品为第三会**收束品**：品界 **CJK 5,529**——长行 **4,921** ＋ 重颂 **588**（两段 lg：问端 **308**・答末 **280**・七言）。**三十二单元**＝1 head＋28 p＋2 lg＋1 byline。结构依澄观三分：**请说分**（精进慧两番问＋问端颂）→**正说分**（赞问许说＋答前十问十段＋十度＋绍三宝＋十庄严＋行成德用＋自在力）→**结说分**（如来欢喜・大众奉行）。\n\n| 图 | 画什么 | 一句话 |\n|---|---|---|\n| **图 〇-1　十问十答·十法矩阵配组图** | 问如何成答 | 一问十句 → 十段十法；澄观「答前十問，即為十段」 |\n| **图 〇-2　两品反衬：校量之海与十法之阵** | 数语如何反转 | 第十七品阿僧祇 21・无量 46；本品阿僧祇 1・十種 15 |\n\n**〔读法之序〕**　先观图 〇-1 得十问十答之配，次观图 〇-2 得本品与第十七品之「数语反衬」，次读〇之二.3 之坐标，然后入 §二逐段。**问既定，则十五组皆有着落。**\n\n> **EN corresponding · Map of the Chapter.** The closing chapter of the third assembly: 5,529 characters, ten questions asked in a single sentence and answered in ten sections of ten items each, then ten perfections, the continuation of the three jewels, ten adornments, and a double block of verse (308 + 280 characters). Its signature is a matrix, not a measure: where the previous chapter said \\\"unmeasurable\\\" twenty-one times, this one says it once. Fig. 0-1 pairs the ten questions with their answers; Fig. 0-2 sets the two chapters' vocabularies against each other.\n\n### 〇之二.1 图 〇-1　十问十答·十法矩阵配组图\n\n<figure>\n<svg viewBox=\"0 0 1000 580\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"24\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">十问十答：一问十句，答即十段</text>\n<text x=\"500\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a7a5e\">左列为经文原句（§2.1·照 `T10n0279` 卷十八逐字）；右列为答段单元（§7.5.2）</text>\n\n<g font-size=\"11\" fill=\"#8a7a5e\">\n<text x=\"30\" y=\"72\">问（一問十句·80-003）</text><text x=\"470\" y=\"72\">答（十段·80-009–019）</text>\n</g>\n<line x1=\"30\" y1=\"78\" x2=\"970\" y2=\"78\" stroke=\"#c9b98f\"/>\n\n<g font-size=\"11.5\" fill=\"#5a5147\">\n<text x=\"30\" y=\"102\">① 令諸如來皆生歡喜</text><text x=\"470\" y=\"102\">十不放逸（80-009）· 十令佛喜（80-011/012）</text>\n<text x=\"30\" y=\"130\">② 入諸菩薩所住之處</text><text x=\"470\" y=\"130\">十種清淨（80-010）</text>\n<text x=\"30\" y=\"158\">③ 一切大行皆得清淨</text><text x=\"470\" y=\"158\">十速入諸地（80-013）· 住地十觀察（80-014）</text>\n<text x=\"30\" y=\"186\">④ 所有大願悉使滿足</text><text x=\"470\" y=\"186\">十行清淨（80-015）· 十增勝法（80-016）</text>\n<text x=\"30\" y=\"214\">⑤ 獲諸菩薩廣大之藏</text><text x=\"470\" y=\"214\">十清淨願（80-017）· 十法滿願（80-018）</text>\n<text x=\"30\" y=\"242\">⑥ 隨所應化常為說法</text><text x=\"470\" y=\"242\">十無盡藏（80-019）· 隨宜說法（80-020）</text>\n<text x=\"30\" y=\"270\">⑦ 而恒不捨波羅蜜行</text><text x=\"470\" y=\"270\">十波羅蜜（80-021–022·CJK 695 最长段）</text>\n<text x=\"30\" y=\"298\">⑧ 所念眾生咸令得度</text><text x=\"470\" y=\"298\">紹三寶種（80-023）· 教發心／開法藏／善持教法</text>\n<text x=\"30\" y=\"326\">⑨ 紹三寶種使不斷絕</text><text x=\"470\" y=\"326\">十莊嚴（80-024）· 身語心佛剎光明眾會神通…</text>\n<text x=\"30\" y=\"354\">⑩ 善根方便皆悉不虛</text><text x=\"470\" y=\"354\">莊嚴不空（80-024 末）· 行成德用・自在力</text>\n</g>\n\n<line x1=\"30\" y1=\"372\" x2=\"970\" y2=\"372\" stroke=\"#d3c7ae\"/>\n<text x=\"30\" y=\"396\" font-size=\"11.5\" fill=\"#7a5a28\">〔本文判断〕十问之配当：<tspan font-weight=\"bold\">前五「自利兼他」（顺佛喜・顺法入位・顺行・顺愿・顺德成藏），后四「利他兼自」（说法・度生・弘三宝），末一「总结二利不虚」</tspan>——此澄观「十句為三」之科。</text>\n<text x=\"30\" y=\"420\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 「云何修習」一语总贯十句（澄观：「其修習言亦總亦別」）——<tspan font-weight=\"bold\">故十问非十事，是一事之十面</tspan>。</text>\n\n<rect x=\"30\" y=\"440\" width=\"940\" height=\"60\" rx=\"4\" fill=\"#f7ecd2\" stroke=\"#b8863c\"/>\n<text x=\"46\" y=\"462\" font-size=\"11.5\" font-weight=\"bold\" fill=\"#7a5a28\">数科口径之辨：澄观「答前十問，即為十段」，初段五十句（前二十答修習・後三十答令佛歡喜）；</text>\n<text x=\"46\" y=\"482\" font-size=\"11.5\" fill=\"#7a5a28\">而本文 §7.5.2 按平文器单元细列十五组。<tspan font-weight=\"bold\">段以义分，组以单元分，二口径并存</tspan>〔本文判断·段界细则待核〕。</text>\n\n<text x=\"30\" y=\"524\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 十度一段（80-021）CJK 695，为全品最长段——<tspan font-weight=\"bold\">「不捨波羅蜜行」一句，答文最详</tspan>。</text>\n<text x=\"30\" y=\"548\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 双颂两段（问端 308・答末 280），一在问后、一在答末——<tspan font-weight=\"bold\">首尾各一颂，中为长行</tspan>，与第十七品之「一颂到底」判然。</text>\n<text x=\"30\" y=\"572\" font-size=\"11.5\" fill=\"#7a5a28\">※ 慧苑《刊定记》释本品来意：「前明十住自分行之勝德，今辨十住趣後方便故來也」——<tspan>本品之终即十行之始</tspan>，故第三会不结而结。〔L.206 回源订正：原引误属澄观，且窜入「（十行）」〕</text>\n</svg>\n<figcaption><b>图 〇-1　十问十答·十法矩阵配组图。</b>十问一氣而下，答即十段。<b>十问非十事，是一事之十面</b>——「云何修习」一语总贯十句（澄观：「其修習言亦總亦別」）。前五自利兼他，后四利他兼自，末一总结二利不虚。<b>数科有二口径</b>：澄观以义分十段，本文以单元细列十五组——<b>段以义分，组以单元分，并存不裁</b>〔本文判断〕。<div class=\"en-line\">Fig. 0-1. Ten questions in one breath, ten sections in answer. They are not ten matters but ten faces of one: how to practise within the Buddha's teaching — the phrase governs all ten. Five are self-benefit with other-benefit, four the reverse, one closes both. Two reckonings coexist: Chengguan counts ten sections by meaning, this article fifteen groups by textual unit.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. **先读问，且只读问。** 十句问文是全品之纲；**答之十五组，不过逐句敷演**。问不明则答乱。\n2. **「云何修習」是一句而非十句。** 澄观明言「亦總亦別」——**总则贯十，别则十各一义**；此读本品之钥。\n3. **段与组之两口径，须分书。** 若强以十五组配十段，则生穿凿；**两存则各得其用**。\n\n### 〇之二.2 图 〇-2　两品反衬：校量之海与十法之阵\n\n<figure>\n<svg viewBox=\"0 0 1000 540\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"24\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">一会之两极端：八千字的校量，与五千字的条目</text>\n<text x=\"500\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a7a5e\">左：第十七品（CJK 8,207）；右：第十八品（CJK 5,529）——同会相邻，而语汇几乎不相犯</text>\n\n<rect x=\"30\" y=\"66\" width=\"440\" height=\"300\" rx=\"5\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/>\n<text x=\"46\" y=\"90\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#7a5a28\">第十七品 · 初发心功德</text>\n<text x=\"46\" y=\"110\" font-size=\"10.5\" fill=\"#8a7a5e\">校量之海：以喻推极，终归「不可说」</text>\n<g font-size=\"11\" fill=\"#5a5147\">\n<text x=\"46\" y=\"136\">阿僧祇</text><rect x=\"180\" y=\"124\" width=\"210\" height=\"15\" fill=\"#d9c9a4\" stroke=\"#c9b98f\"/><text x=\"398\" y=\"136\" fill=\"#7a5a28\">21</text>\n<text x=\"46\" y=\"164\">無量</text><rect x=\"180\" y=\"152\" width=\"280\" height=\"15\" fill=\"#d9c9a4\" stroke=\"#c9b98f\"/><text x=\"468\" y=\"164\" fill=\"#7a5a28\">46</text>\n<text x=\"46\" y=\"192\">不可說不可說</text><rect x=\"180\" y=\"180\" width=\"40\" height=\"15\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"228\" y=\"192\">4</text>\n<text x=\"46\" y=\"220\">那由他</text><rect x=\"180\" y=\"208\" width=\"80\" height=\"15\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"268\" y=\"220\">8</text>\n<text x=\"46\" y=\"248\">初發心</text><rect x=\"180\" y=\"236\" width=\"110\" height=\"15\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"298\" y=\"248\">11</text>\n</g>\n<text x=\"46\" y=\"282\" font-size=\"11\" fill=\"#8a7a5e\">重颂 121 颂（3,388 字·41.3%）</text>\n<text x=\"46\" y=\"304\" font-size=\"11\" fill=\"#8a7a5e\">篇幅 8,207　·　单元 27　·　最长品</text>\n<text x=\"46\" y=\"330\" font-size=\"11\" fill=\"#b8863c\">→ 以「捨」尽，以「不可说」收</text>\n<text x=\"46\" y=\"352\" font-size=\"10.5\" fill=\"#8a7a5e\">数在此品，是校量之器</text>\n\n<rect x=\"530\" y=\"66\" width=\"440\" height=\"300\" rx=\"5\" fill=\"#f3ecdf\" stroke=\"#c9b98f\"/>\n<text x=\"546\" y=\"90\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#7a5a28\">第十八品 · 明法</text>\n<text x=\"546\" y=\"110\" font-size=\"10.5\" fill=\"#8a7a5e\">十法之阵：以组尽其目，终归「奉行」</text>\n<g font-size=\"11\" fill=\"#5a5147\">\n<text x=\"546\" y=\"136\">十種</text><rect x=\"680\" y=\"124\" width=\"105\" height=\"15\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"793\" y=\"136\">15</text>\n<text x=\"546\" y=\"164\">波羅蜜</text><rect x=\"680\" y=\"152\" width=\"161\" height=\"15\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"849\" y=\"164\">23</text>\n<text x=\"546\" y=\"192\">莊嚴</text><rect x=\"680\" y=\"180\" width=\"182\" height=\"15\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"870\" y=\"192\">26</text>\n<text x=\"546\" y=\"220\">無盡藏</text><rect x=\"680\" y=\"208\" width=\"84\" height=\"15\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"772\" y=\"220\">12</text>\n<text x=\"546\" y=\"248\">阿僧祇</text><rect x=\"680\" y=\"236\" width=\"7\" height=\"15\" fill=\"#b8863c\"/><text x=\"695\" y=\"248\" font-weight=\"bold\" fill=\"#7a5a28\">1</text>\n</g>\n<text x=\"546\" y=\"282\" font-size=\"11\" fill=\"#8a7a5e\">双颂 588（308＋280·10.6%）</text>\n<text x=\"546\" y=\"304\" font-size=\"11\" fill=\"#8a7a5e\">篇幅 5,529　·　单元 32　·　收束品</text>\n<text x=\"546\" y=\"330\" font-size=\"11\" fill=\"#b8863c\">→ 以「组」尽，以「奉行」收</text>\n<text x=\"546\" y=\"352\" font-size=\"10.5\" fill=\"#8a7a5e\">数在此品，是条目之目</text>\n\n<line x1=\"30\" y1=\"386\" x2=\"970\" y2=\"386\" stroke=\"#c9b98f\"/>\n<text x=\"30\" y=\"412\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#7a5a28\">反衬之最：阿僧祇 21 ↔ 1</text>\n<text x=\"30\" y=\"436\" font-size=\"11.5\" fill=\"#5a5147\">同会相邻两品，一以「无数」为常用语，一几乎不用——<tspan font-weight=\"bold\">非作者忽变其辞，乃法门忽换其轴</tspan>：</text>\n<text x=\"30\" y=\"458\" font-size=\"11.5\" fill=\"#5a5147\">十七品之轴是「量」（故数愈多愈见其不足）；十八品之轴是「目」（故数愈整愈见其全）。〔本文判断〕</text>\n\n<text x=\"30\" y=\"490\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 十八品之十法组，自十不放逸至十无尽藏，凡十一组，加随宜说法・十波罗蜜・绍三宝・十庄严四段，共十五组。</text>\n<text x=\"30\" y=\"512\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 十七品之十一喻，前喻必捨后喻；十八品之十五组，组组并立而不相捨——<tspan font-weight=\"bold\">一纵一横，正相对</tspan>。</text>\n</svg>\n<figcaption><b>图 〇-2　两品反衬：校量之海与十法之阵。</b>同会相邻两品，语汇几乎不相犯：<b>第十七品「阿僧祇」21 见、「无量」46 见；第十八品「阿僧祇」仅 1 见</b>。非作者忽变其辞，乃法门忽换其轴——<b>十七品之轴是「量」，数愈多愈见其不足；十八品之轴是「目」，数愈整愈见其全</b>〔本文判断〕。十七喻必捨前，十五组并立而不相捨：一纵一横，正相对。<div class=\"en-line\">Fig. 0-2. Two adjacent chapters in one assembly, almost no vocabulary in common: asaṃkhya twenty-one times against once. The author has not changed his diction; the dharma-gate has changed its axis — one measures, the other enumerates. The eleven similes each discard the last; the fifteen groups stand side by side and discard nothing. One runs vertically, one horizontally.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. **两品须合读，方见一会之全。** 只读十七品，则谓佛法唯在不可说；只读十八品，则谓佛法尽是条目。**合之则知：说不可说，正为立条目；立条目，正为显不可说**。\n2. **「阿僧祇 21↔1」是一处极小的文本证据，而所证极大。** 词频之变，常是法门转换最灵敏的指针。〔本文判断〕\n3. **双颂首尾各一，是收束之体。** 问后有颂（308），答末有颂（280）——**以颂包长行，与十七品之「一颂到底」异**。\n\n### 〇之二.3 本品在第三会（忉利天宫·说十住）之坐标\n\n本品为第三会**第六品、亦收束之品**。慧苑《刊定记》判「**前明十住自分行之勝德，今辨十住趣後方便故來也**」——故本品虽结第三会，实启第四会之十行；**会终而不结，是华严「位位相即」之常法**。\n\n| 品 | 卷 | 位／科 | 一句提撕 | 与本品之关系 |\n|---|---|---|---|---|\n| 16 梵行 | 卷17 | 第三会·正说·行 | 十法推徵，923 字 | 行净 |\n| 17 初发心功德 | 卷17–18 | 第三会·胜进·德 | 十一喻，8,207 字 | 德显 |\n| **18 明法（本品）** | 卷18 | 第三会·**收束·法** | 十法矩阵，双颂 | 第三会竟 |\n| 19 昇夜摩天宮 | 卷19 | 第四会·十行·发起 | 不起而升（重演第十三品） | 四会即启 |\n| 20 夜摩天宮偈贊 | 卷19 | 第四会·十行·方便发起 | 十菩萨各十颂（重演第十四品） | 一会之式，会会皆然 |\n\n### 〇之二.4 本品形式特征（与邻品对看）\n\n本品之特色在**「以条目尽法」**：十问十答，十五组十法，凡一百五十余条，**几无一句校量之辞**。与第十七品之八千字校量恰成一会之两极——**在三十九品中，以如此密的条目矩阵收一会的，唯此一品**〔本文判断·据本文所核诸品〕。\n\n| 特征 | 本品表现〔实测〕 | 邻品之对照 | 读法上的后果 |\n|---|---|---|---|\n| 以组为体 | 十五组十法（自十不放逸至十庄严） | 第十七品十一喻（校量） | 一以目尽，一以量极 |\n| 数语反转 | 阿僧祇 1（对十七品 21） | 第十七品无量 46 | 同会之内，语汇几乎不相犯 |\n| 双颂包长行 | 问端 308＋答末 280＝588（10.6%） | 第十七品 121 颂（41.3%） | 一以颂点缀，一以颂重述 |\n| 最长段 | 十波罗蜜 80-021（CJK 695） | 第十七品以喻为段，无单段之最 | 条目之品，详于一类 |\n| 收而不结 | 末段「如來歡喜，大眾奉行」17 字 | 第十六品以「不由他悟」收 | 一以事收，一以理收 |\n| 单元最多 | 32 单元（第三会最多） | 第十六品 5 单元（最少） | 同会之中，单元相去六倍 |\n\n### 〇之二.5 五种读法（导览）\n\n| 读法 | 路径 | 适合谁 | 得什么 |\n|---|---|---|---|\n| **问读** | 只读 80-003 十问之句 | 初读本篇者 | 得全品之纲 |\n| **组读** | 只读十五组之名与首尾句（§7.5.2） | 欲见矩阵者 | 得十法之目 |\n| **一度读** | 只读十波罗蜜一段（80-021·695 字） | 欲见详处者 | 见「不捨波罗蜜」之实 |\n| **衬读** | 本品 ＋ 第十七品词频对看（图 〇-2） | 好文本肌理者 | 见一会之两轴 |\n| **承读** | 本品 §2.9 → 第十九品 §2.1 | 欲见会际者 | 见「收而不结」之法 |\n\n### 〇之二.6 数与位之谱：本品之数，四等分录\n\n华严之数非计数之数。本品所涉之数，来源不一，性质亦不一；**先分其等，后论其义**，则不为数目所惑。\n\n| 等第 | 数 | 出处 | 性质 |\n|---|---|---|---|\n| **T0 经文明文** | 「彼諸菩薩於佛教中云何修習……善根方便皆悉不虛」 | `T10n0279` 卷十八·80-003 | 十问之原文 |\n| **T0 经文明文** | 「如來歡喜，大眾奉行」 | 同上·80-030 | 结说分（17 字） |\n| **T0 本文实测** | **5,529 字／长行 4,921＋双颂 588** | §7.1 `_e18_stats.py` | 计数（本文自测） |\n| **T0 本文实测** | 32 单元・十波罗蜜段 695（最长） | §7.1／§7.5 | 计数（本文自测） |\n| **T1 澄观《疏》** | 「答前十問。即為十段。今初段中有五十句」 | `T1735` 本品段 | 十段之科 |\n| **T1 慧苑《刊定记》** | 「前明十住自分行之勝德，今辨十住趣後方便故來也」 | `X0221` 本品段〔L.206 回源订正：原误属澄观且窜入「（十行）」〕 | 收束与开启之判 |\n| **T2 六十** | 〈明法品第十四〉 | `T09n0278` | 品次对照 |\n\n> **〔读法〕** 本品之数与第十七品恰相反：**十七品之数愈大愈显其不足，十八品之数愈整愈显其全**。故读十七品当问「何以犹不及」，读十八品当问「何以恰为十」。**同一「十」字，一为校量之起点，一为条目之定数**，不可混看。\n\n<!-- ATLAS:END P18 -->\n\n## 一、概述与品题解义\n\n### 1.1 品题释义\n\n**品名**：**明法品**（八十华严**第十八品**，唐·实叉难陀译；六十华严作**第十四品**）。本品在**卷第十八**一整卷内，为第三会之末品、十住位段之结归。\n\n**「明法」**——澄观《疏》（T1735）：「準梵本具翻，應云**法光明品**。統有四義。一法慧智慧，於能所詮進趣行法，分明照了故……三明是智用法是理行及果……四所修行法體離無明」；慧苑《刊定记》（X0221）按梵本：「**達摩阿嚕迦娜忙鉢里勿多**。達摩法也。阿嚕迦光明。娜忙名也。鉢里勿多品也」，又「依《攝大乘》略敘五說。一依無著總相釋云。法光明者謂大法光故」；法藏《探玄记》（T1733·六十品题）：「初釋名者有四義。一後位行法垂明前位，此明即法也」；智俨《搜玄记》（T1732）：「言明法者有二。一約教……二約行。由行增勝後位相現故」；李通玄《论》（T1739）则以两义释之：「第一令前五品之法其心更明。第二令後所行之法轉勝明白。故云明法品」。\n\n### 1.2 品位与脉络（第三会收束·启第四会）\n\n**澄观来意**（T1735）：「前明當位所成之德。今辨趣後勝進之行。故次來也。又前明發心之勝德。今辨所具之行相」——第十七品叹发心之**德**，本品明趣后之**行**；德行既备，第三会（十住段）遂以收束。\n\n**三会科判之定谳**：本品为第三会收束品，三家同证——澄观疏末「**第三會竟**」（T1735）·法藏記「此上**第三會竟**」（T1733）·李通玄合論判「第四會夜摩天說十行法門，此之一會昇夜摩天是序分，從偈讚品已下是正說分」（X0223）。自品 13《升须弥山顶》开第三会，历品 14 偈赞·品 15 十住·品 16 梵行·品 17 发心功德，至本品**明法**而会终；次品《昇夜摩天宮品第十九》即入第四会（十行星）。\n\n**承上启下**：\n- **承上**：第十七品广叹初发心功德无边，本品精进慧即引其语而问——「菩薩摩訶薩初發求一切智心，成就如是無量功德」（80-003），正承彼品；\n- **本品**：法慧（十住会主·第十五品本说者）答以十法条目，层层开示不放逸—清净—佛喜—入地—行净—愿—无尽藏—十波罗蜜—绍三宝种—庄严之行纲，令前五品之法「其心更明」；\n- **启下**：趣后胜进既明，第四会夜摩天宫说**十行**，本品类其前导（智俨：「用前行德更修，與後地為方便故也」·T1732）。\n\n### 1.3 篇幅与结构预览（实测）\n\n品界 T10n0279 CJK-only @118152–123681·**CJK 5,529**：长行 4,921＋重颂 588（两段 lg：问端 308·答末 280·七言）。平文器 32 单元＝1 head＋28 p＋2 lg＋1 byline。详见 §七数据层。\n\n### 1.4 核心要义\n\n一、**问主与答主之机**——问者**精进慧**（澄观：「勝進趣後非勤不能故精進慧問」），答者**法慧**（十住会主，还就本会主结会）；一问一答，将第三会所说位·行·德总收为「趣后之行纲」。\n\n二、**十法矩阵**——一品之内连列十组十数条目：十不放逸·十種清淨·十令諸佛歡喜（两番）·十速入諸地·十行清淨·十增勝法·十清淨願·十願圓滿法·**十無盡藏**·**十波羅蜜**·紹三寶種·十莊嚴——以「十」数应十住位，为第三会之数科总纲〔本文判断〕。\n\n三、**十波罗蜜最完整之文**——80-021 一段（CJK 695·本品最长段）历明檀·尸·忍·精进·禅·般若·方便·愿·力·智十度，每一度以「是則能淨X波羅蜜」结，为《华严》十度义最齐整之经文。\n\n四、**绍三宝种不断**——「教諸眾生發菩提心，是故能令佛種不斷；常為眾生開闡法藏，是故能令法種不斷；善持教法，無所乖違，是故能令僧種不斷」（80-023），三番递释，结归「三寶種永不斷絕」。\n\n五、**十种庄严·善见之喻**——「譬如有藥，名為善見，眾生見者，眾毒悉除；菩薩如是成就此法，眾生若見，諸煩惱毒皆得除滅」（80-024），以喻结「念念具足十種莊嚴……於念念中，身、語、意業皆無空過」义。\n\n### 1.5 经文文本现象与信度标识\n\n- 「法  慧菩薩言」五字独立为 p（80-002·与 80-001 文内语重叠·平文器重计·与第十七品 80-002 同一现象）；\n- **两处重颂**：80-006（问端颂 308·澄观「初一讚說者，餘十頌上文」）与 80-029（结尾颂 280·澄观「重頌分。十頌分二」）——本品长行中前后各嵌一颂，为第三会诸品所仅见〔本文判断〕；\n- 「精進慧」名号本品三见（80-001/80-005/80-007），与第十七品问主天帝释不同机——问主转回当会菩萨，显此「趣后行」为法门内自治之纲目〔本文判断〕。\n\n### 1.7 核心要义小结\n\n本品一句话：**精进慧问佛教中云何修习·法慧以十法矩阵层层开示·广列十无尽藏十波罗蜜·绍三宝种·足十庄严·双颂结之——第三会于此竟，十行星由此启**〔本文判断〕。\n\n---\n\n## 二、卷第十八（明法品第十八·本品全文）\n\n### 2.0 结构总表（据经切分·澄观释文三分）\n\n| 段号 | 澄观科判 | 单元 | 内容 | CJK（实测） |\n|---|---|---|---|---|\n| 甲·请说分 | 一請說分（长行＋祇夜） | 80-001–80-006 | 精进慧两番问（行体十句·德用十二事）＋问端颂 | 约 860 |\n| 乙·正说分（长行） | 二正說分·長行 | 80-007–80-027 | 讚問許說＋答前十問十段＋十度＋绍三宝＋十庄严＋行成德用＋自在力 | 约 4,100 |\n| 丙·正说分（重颂） | 重頌分（十頌·初六頌行體·後四頌德用） | 80-028–80-029 | 「心住菩提集眾福」起·六行颂结 | 280＋19 |\n| 丁·结说分 | 三結說分（第三會竟） | 80-030 | 如來歡喜，大眾奉行 | 17 |\n| 戊·品题·卷题 | — | 80-000·80-031 | 品题＋于闐译场 byline | 20 |\n\n### 2.1 请说分·精进慧正问（80-003）\n\n> 「佛子！菩薩摩訶薩初發求一切智心，成就如是無量功德，具大莊嚴，昇一切智乘，入菩薩正位，捨諸世間法，得佛出世法，去、來、現在諸佛攝受，決定至於無上菩提究竟之處。彼諸菩薩於佛教中云何修習，令諸如來皆生歡喜……」\n\n**疏解**：此领前文——澄观科「初領前自分勝德。後請說勝進之行」；「昇一切智乘……決定至於無上菩提究竟之處」十七句全承第十七品发心功德而来。问端「於佛教中云何修習」起下十段答。\n\n### 2.2 请说分·问端颂（80-006·第一处重颂）\n\n> 「若有菩薩初發心，成就福德智慧乘，入離生位超世間，普獲正等菩提法。」\n\n**疏解**：澄观科偈文「初一讚說者。餘十頌上文。於中亦二。初一頌領前。餘頌請後。於中亦二。前四頌所修行體。後五頌行所成德」——问端十一颂，初一颂领前品胜德，余十颂颂本品所问。末颂「云何修習佛功德，猶如蓮華不著水？」结问。\n\n### 2.3 正说分·法慧讚問許說（80-008）\n\n> 「善哉！佛子！汝今為欲多所饒益、多所安樂、多所惠利，哀愍世間諸天及人，問於如是菩薩所修清淨之行。佛子！汝住實法，發大精進，增長不退，已得解脫；能作是問，同於如來。」\n\n**疏解**：澄观科「前中三。初讚所問利益。二佛子下讚能問具德。三諦聽下誡聽許說」三节。「我今承佛威神之力，為汝於中說其少分」——与第十七品「承佛威神」同一言式，显此说法亦托佛力〔本文判断〕。\n\n### 2.4 正说分·十法矩阵（80-009–80-019）\n\n**十不放逸**（80-009）：「菩薩摩訶薩住十種法，名：不放逸。何者為十？一者，護持眾戒；二者，遠離愚癡，淨菩提心……十者，恒善觀察自相續力。」\n\n**十種清淨**（80-010）：「住不放逸，得十種清淨」——如說而行·念智成就·住於深定不沈不舉·樂求佛法·如理觀察·入深禪定得佛神通·其心平等·於眾生上中下類心無障礙猶如大地·見一發菩提心者尊重承事猶如和尚·於授戒和尚阿闍梨常生尊重。\n\n**十令諸佛歡喜**（80-011·80-012 两番）：一番「一者，精進不退……十者，依無作門，修諸淨行」；二番以「安住」十字统之——「安住不放逸；安住無生忍；安住大慈；安住大悲……安住智慧，觀一切法皆無所住，猶如虛空」。\n\n**十速入諸地**（80-013·80-014）：十法「令諸菩薩速入諸地」；又「諸菩薩初住地時，應善觀察」十「隨」——「知一切法，皆是自心，而無所著」。\n\n**十行清淨·十增勝**（80-015·80-016）：「有十種法，令諸菩薩所行清淨」；「既得行清淨已，復獲十種增勝法」——他方諸佛皆悉護念居首。\n\n**十清淨願·十願圓滿**（80-017·80-018）：十愿——成熟眾生·具行眾善淨諸世界·承事如來·護持正法不惜軀命……「具普賢行，淨治一切種智之門」；十法满愿——「心無疲厭……常勤守護無上法門」。\n\n**十無盡藏**（80-019）：「滿足如是願時，即得十種無盡藏」——「普見諸佛無盡藏、總持不忘無盡藏、決了諸法無盡藏、大悲救護無盡藏、種種三昧無盡藏、滿眾生心廣大福德無盡藏、演一切法甚深智慧無盡藏、報得神通無盡藏、住無量劫無盡藏、入無邊世界無盡藏。」\n\n**疏解**：澄观科正答「前中答前十問。即為十段。今初段中有五十句。前二十句答前修習。後三十句答令佛歡喜」——十段与十问相应，此本品纲骨。十无尽藏段，澄观判「第五佛子已下答護菩薩藏問。文亦有四。初是結前生後。謂以前行願蘊積成藏故。唯十句更無成熟等異。文有五對」。\n\n### 2.5 正说分·随宜说法与十波罗蜜（80-020–80-022）\n\n> 「所謂：知其所作，知其因緣，知其心行，知其欲樂。貪欲多者，為說不淨；瞋恚多者，為說大慈；愚癡多者，教勤觀察；三毒等者，為說成就勝智法門。」\n\n80-021（CJK 695·本品最长段）历列**十波罗蜜**：「內外悉捨而無所著，是則能淨檀波羅蜜……具持眾戒而無所著，永離我慢，是則能淨尸波羅蜜……知一切法真實，知一切如來力，普覺悟法界門，是則能淨智波羅蜜。」\n\n**疏解**：澄观科第七答「答恒不捨離諸波羅蜜問……十度即為十段。皆先辨相。後是則下結名」。其中禅度文有十一句，澄观訶五欲之喻极详——「色如熱金丸執之則燒。聲如毒塗鼓聞之必死……此五欲者，得之無厭如火益薪」；又会通定慧名相：「言三昧者，此云等持……三摩鉢底此云等至……此二功德名為等引」。\n\n### 2.6 正说分·绍三宝种与十庄严（80-023–80-024）\n\n> 「菩薩摩訶薩教諸眾生發菩提心，是故能令佛種不斷；常為眾生開闡法藏，是故能令法種不斷；善持教法，無所乖違，是故能令僧種不斷。」\n\n80-024 结**十种庄严**（身·语·心·佛剎·光明·眾會·神通·正教·涅槃地·巧說），并以**善见药**为喻：「譬如有藥，名為：善見，眾生見者，眾毒悉除；菩薩如是成就此法，眾生若見，諸煩惱毒皆得除滅，善法增長。」\n\n**疏解**：澄观科第九答「紹三寶種」文有四番为成十句，且释六和敬：「身和同集，口和無諍，意和無違，見和同解，戒和同奉，利和同均」；又判发菩提心三心：「發菩提心總有三心。謂即大悲大願大智」。第十答「善根方便皆悉不空」——先略后广，明自业利他二不空，「玉之內病曰瑕……外病曰玷」以《诗》意喻三业无失。\n\n### 2.7 正说分·行成德用与自在力（80-025–80-027）\n\n80-025 答「行所成因德」十二事——「以智慧明，滅諸癡闇；以慈悲力，摧伏魔軍；以大智慧及福德力，制諸外道；以金剛定，滅除一切心垢煩惱」，十五种「以……力」历对前问；80-026 答「結因成果德」——「於無邊世界中為大法師，護持正法」，十种自在（于法·于智·般若·辩才·陀罗尼·大悲·大慈等）；80-027 结「成就無量智慧輪故……成就無邊際菩提心故」十一句，显「悉能映蔽如是大眾」。\n\n**疏解**：澄观科「第二佛子菩薩摩訶薩住此下。答行所成德問。前文有二。今亦二段。第一答以行成因德。二答以因成果德。今初具答十二問。各有二句」，并校出经文小欠：「準上文中此有七事，今波羅蜜下欠總持句」。\n\n### 2.8 结颂分·第二处重颂（80-029·十颂）\n\n> 「心住菩提集眾福，常不放逸植堅慧，正念其意恒不忘，十方諸佛皆歡喜。」\n\n末颂：\n\n> 「進止安徐如象王，勇猛無畏猶師子，不動如山智如海，亦如大雨除眾熱。」\n\n**疏解**：澄观科「第二重頌分。十頌分二。初六偈頌前十種所成行體。後四偈頌行所成德」——初六颂行体（不放逸·佛喜·入地·大行大愿·菩萨藏·说法·度生·三宝·善根不空），后四颂德用（破闇·灭烦恼·降魔·成正觉·法师演法·甘露霑洒·六行喻结）。\n\n### 2.9 结说分·法会竟（80-030）\n\n> 時，法慧菩薩說此頌已，如來歡喜，大眾奉行。\n\n**疏解**：澄观科「第三時法慧下明結說分。謂契理合機故佛喜眾奉也。**第三會竟**」——一句收尽第三会九品（须弥顶·偈赞·十住·梵行·发心·明法）。大方广佛华严经疏于此后记「卷第二十」，为第三会疏之终卷。\n\n以下按 CBETA T10n0279 平文器 32 单元（1 head + 28 p + 2 lg + 1 byline）逐段照录八十华严〈明法品第十八〉全文。各段标号与 §2.0 结构总表对应。\n\n**80-000**（`head`·CJK 6）：\n\n> 明法品第十八\n\n**80-001**（`p`·CJK 13）：\n\n> 爾時，精進慧菩薩白法慧菩薩言：\n\n**80-002**（`p`·CJK 5）：\n\n> 法  慧菩薩言：\n\n**80-003**（`p`·CJK 192）：\n\n> 「佛子！菩薩  摩訶薩初發求一切智心，成就如是無量功  德，具大莊嚴，昇一切智乘，入菩薩正位，捨諸  世間法，得佛出世法，去、來、現在諸佛攝受，決  定至於無上菩提究竟之處。彼諸菩薩於佛  教中云何修習，令諸如來皆生歡喜，入諸菩  薩所住之處，一切大行皆得清淨，所有大  願悉使滿足，獲諸菩薩廣大之藏，隨所應   化常為說法，而恒不捨波羅蜜行，所念眾  生咸令得度，紹三寶種使不斷絕，善根方  便皆悉不虛？佛子！彼諸菩薩以何方便，能  令此法當得圓滿？願垂哀愍，為我宣說；此諸  大會，靡不樂聞！\n\n**80-004**（`p`·CJK 353）：\n\n> 「復次，如諸菩薩摩訶薩常勤  修習，滅除一切無明黑暗，降伏魔怨，制諸外  道，永滌一切煩惱心垢；悉能成就一切善根，  永出一切惡趣諸難，淨治一切大智境界；成  就一切菩薩諸地、諸波羅蜜、總持三昧、六通、  三明、四無所畏清淨功德，莊嚴一切諸佛國  土，及諸相好身、語、心行成就滿足，善知一切  諸佛如來力、無所畏、不共佛法、一切智智所  行境界；為欲成熟一切眾生，隨其心樂而取  佛土，隨根、隨時如應說法；種種無量廣大佛  事，及餘無量諸功德法、諸行、諸道及諸境  界，皆悉圓滿，疾與如來功德平等；於諸如  來、應、正等覺百千阿僧祇劫修菩薩行時所  集法藏，悉能守護，開示演說，諸魔外道無  能沮壞，攝持正法無有窮盡；於一切世界演  說法時，天王、龍王、夜叉王、乾闥婆王、阿脩羅王、  迦樓羅王、緊那羅王、摩睺羅伽王、人王、梵  王、如來法王，皆悉守護；一切世間，恭敬供養；  同灌其頂，常為諸佛之所護念，一切菩薩亦  皆愛敬；得善根力，增長白法，開演如來甚深  法藏，攝持正法以自莊嚴。一切菩薩所行次  第，願皆演說！」\n\n**80-005**（`p`·CJK 16）：\n\n> 爾時，精進慧菩薩欲重宣其義  而說頌言：\n\n**80-006**（`lg`·CJK 308）：\n\n>\n\n> 「大名稱者善能演，菩薩所成功德法，\n> 深入無邊廣大行，具足清淨無師智。\n> 若有菩薩初發心，成就福德智慧乘，\n> 入離生位超世間，普獲正等菩提法。\n> 彼復云何佛教中，堅固勤修轉增勝，\n> 令諸如來悉歡喜，佛所住地速當入？\n> 所行清淨願皆滿，及得廣大智慧藏，\n> 常能說法度眾生，而心無依無所著。\n> 菩薩一切波羅蜜，悉善修行無缺減，\n> 所念眾生咸救度，常持佛種使不絕。\n> 所作堅固不唐捐，一切功成得出離，\n> 如諸勝者所修行，彼清淨道願宣說！\n> 永破一切無明暗，降伏眾魔及外道，\n> 所有垢穢悉滌除，得近如來大智慧。\n> 永離惡趣諸險難，淨治大智殊勝境，\n> 獲妙道力隣上尊，一切功德皆成就。\n> 證得如來最勝智，住於無量諸國土，\n> 隨眾生心而說法，及作廣大諸佛事。\n> 云何而得諸妙道，開演如來正法藏，\n> 常能受持諸佛法，無能超勝無與等？\n> 云何無畏如師子，所行清淨如滿月？\n> 云何修習佛功德，猶如蓮華不著水？」\n>\n\n**80-007**（`p`·CJK 13）：\n\n> 爾時，法慧菩薩告精進慧菩薩言：\n\n**80-008**（`p`·CJK 90）：\n\n> 「善哉！佛子！  汝今為欲多所饒益、多所安樂、多所惠利，  哀愍世間諸天及人，問於如是菩薩所修清  淨之行。佛子！汝住實法，發大精進，增長不  退，已得解脫；能作是問，同於如來。諦聽！諦  聽！善思念之！我今承佛威神之力，為汝於  中說其少分。\n\n**80-009**（`p`·CJK 166）：\n\n> 「佛子！菩薩摩訶薩已發一切  智心，應離癡暗，精勤守護，無令放逸。佛子！  菩薩摩訶薩住十種法，名：不放逸。何者為十？   一者，護持眾戒；二者，遠離愚癡，淨菩提心；三  者，心樂質直，離諸諂誑；四者，勤修善根，無有  退轉；五者，恒善思惟，自所發心；六者，不樂親  近在家、出家一切凡夫；七者，修諸善業而不  願求世間果報；八者，永離二乘，行菩薩道；九  者，樂修眾善，令不斷絕；十者，恒善觀察自相  續力。佛子！若諸菩薩行此十法，是則名為住  不放逸。\n\n**80-010**（`p`·CJK 246）：\n\n> 「佛子！菩薩摩訶薩住不放逸，得十種  清淨。何者為十？一者，如說而行；二者，念智  成就；三者，住於深定，不沈不舉；四者，樂求佛  法，無有懈息；五者，隨所聞法，如理觀察，具足  出生巧妙智慧；六者，入深禪定，得佛神通；  七者，其心平等，無有高下；八者，於諸眾生上、  中、下類，心無障礙，猶如大地等作利益；九者，  若見眾生乃至一發菩提之心，尊重承事  猶如和尚；十者，於授戒和尚及阿闍梨、一  切菩薩、諸善知識、法師之所，常生尊重，承事  供養。佛子！是名菩薩住不放逸十種清淨。  佛子！菩薩摩訶薩住不放逸，發大精進；起於  正念，生勝欲樂，所行不息；於一切法，心無依  處；於甚深法，能勤修習；入無諍門，增廣大  心；佛法無邊，能順了知，令諸如來皆悉歡  喜。\n\n**80-011**（`p`·CJK 129）：\n\n> 「佛子！菩薩摩訶薩復有十法，能令一切諸  佛歡喜。何等為十？一者，精進不退；二者，不惜  身命；三者，於諸利養無有希求；四者，知一  切法皆如虛空；五者，善能觀察，普入法界；  六者，知諸法印，心無倚著；七者，常發大願；八  者，成就清淨忍智光明；九者，觀自善法，心無  增減；十者，依無作門，修諸淨行。佛子！是為菩   薩住十種法，能令一切如來歡喜。\n\n**80-012**（`p`·CJK 98）：\n\n> 「佛子！復有  十法，能令一切諸佛歡喜。何者為十？所謂：安  住不放逸；安住無生忍；安住大慈；安住大悲；  安住滿足諸波羅蜜；安住諸行；安住大願；  安住巧方便；安住勇猛力；安住智慧，觀一切  法皆無所住，猶如虛空。佛子！若諸菩薩住  此十法，能令一切諸佛歡喜。\n\n**80-013**（`p`·CJK 141）：\n\n> 「佛子！有十種法，  令諸菩薩速入諸地。何等為十？一者，善巧圓  滿福、智二行；二者，能大莊嚴波羅蜜道；三者，  智慧明達，不隨他語；四者，承事善友，恒不捨  離；五者，常行精進，無有懈怠；六者，善能安  住如來神力；七者，修諸善根，不生疲倦；八者，  深心利智，以大乘法而自莊嚴；九者，於地  地法門，心無所住；十者，與三世佛善根方便  同一體性。佛子！此十種法，令諸菩薩速入諸  地。\n\n**80-014**（`p`·CJK 172）：\n\n> 「復次，佛子！諸菩薩初住地時，應善觀察；  隨其所有一切法門，隨其所有甚深智慧，隨  所修因，隨所得果，隨其境界，隨其力用，  隨其示現，隨其分別，隨其所得，悉善觀察。知  一切法，皆是自心，而無所著；如是知已，入菩  薩地，能善安住。佛子！彼諸菩薩作是思惟：  『我等宜應速入諸地。何以故？我等若於地地  中住，成就如是廣大功德；具功德已，漸入佛  地；住佛地已，能作無邊廣大佛事。是故宜應  常勤修習，無有休息，無有疲厭，以大功德  而自莊嚴入菩薩地。』\n\n**80-015**（`p`·CJK 137）：\n\n> 「佛子！有十種法，令諸菩  薩所行清淨。何等為十？一者，悉捨資財，滿眾  生意；二者，持戒清淨，無所毀犯；三者，柔和  忍辱，無有窮盡；四者，勤修諸行，永不退轉；五   者，以正念力，心無迷亂；六者，分別了知無  量諸法；七者，修一切行而無所著；八者，其  心不動，猶如山王；九者，廣度眾生，猶如橋梁；  十者，知一切眾生與諸如來同一體性。佛  子！是為十法，令諸菩薩所行清淨。\n\n**80-016**（`p`·CJK 130）：\n\n> 「菩薩既得  行清淨已，復獲十種增勝法。何等為十？一  者，他方諸佛，皆悉護念；二者，善根增勝，超  諸等列；三者，善能領受佛加持力；四者，常得  善人，為所依怙；五者，安住精進，恒不放逸；  六者，知一切法平等無異；七者，心恒安住  無上大悲；八者，如實觀法，出生妙慧；九者，  能善修行巧妙方便；十者，能知如來方便之  力。佛子！是為菩薩十種增勝法。\n\n**80-017**（`p`·CJK 129）：\n\n> 「佛子！菩薩  有十種清淨願。何等為十？一願，成熟眾生，無  有疲倦；二願，具行眾善，淨諸世界；三願，承事  如來，常生尊重；四願，護持正法，不惜軀命；五  願，以智觀察，入諸佛土；六願，與諸菩薩同一  體性；七願，入如來門，了一切法；八願，見者  生信，無不獲益；九願，神力住世，盡未來劫；  十願，具普賢行，淨治一切種智之門。佛子！  是為菩薩十種清淨願。\n\n**80-018**（`p`·CJK 112）：\n\n> 「佛子！菩薩住十種  法，令諸大願皆得圓滿。何等為十？一者，心  無疲厭；二者，具大莊嚴；三者，念諸菩薩殊  勝願力；四者，聞諸佛土，悉願往生；五者，深  心長久，盡未來劫；六者，願悉成就一切眾  生；七者，住一切劫，不以為勞；八者，受一切  苦，不生厭離；九者，於一切樂，心無貪著；十者，  常勤守護無上法門。\n\n**80-019**（`p`·CJK 112）：\n\n> 「佛子！菩薩滿足如是  願時，即得十種無盡藏。何等為十？所謂：普   見諸佛無盡藏、總持不忘無盡藏、決了諸法  無盡藏、大悲救護無盡藏、種種三昧無盡藏、  滿眾生心廣大福德無盡藏、演一切法甚  深智慧無盡藏、報得神通無盡藏、住無量劫  無盡藏、入無邊世界無盡藏。佛子！是為菩  薩十無盡藏。\n\n**80-020**（`p`·CJK 284）：\n\n> 「菩薩得是十種藏已，福德具足，  智慧清淨；於諸眾生，隨其所應而為說法。佛  子！菩薩云何於諸眾生，隨其所應而為說  法？所謂：知其所作，知其因緣，知其心行，知  其欲樂。貪欲多者，為說不淨；瞋恚多者，為說  大慈；愚癡多者，教勤觀察；三毒等者，為說成  就勝智法門；樂生死者，為說三苦；若著處所，  說處空寂；心懈怠者，說大精進；懷我慢者，說  法平等；多諂誑者，為說菩薩，其心質直；樂  寂靜者，廣為說法，令其成就。菩薩如是隨其  所應而為說法。為說法時，文相連屬，義無舛  謬；觀法先後，以智分別；是非審定，不違法  印；次第建立無邊行門，令諸眾生斷一切  疑；善知諸根，入如來教；證真實際，知法平  等；斷諸法愛，除一切執；常念諸佛，心無暫  捨；了知音聲，體性平等；於諸言說，心無所  著；巧說譬諭，無相違反，悉令得悟一切諸  佛隨應普現平等智身。\n\n**80-021**（`p`·CJK 695）：\n\n> 「菩薩如是為諸眾生  而演說法，則自修習，增長義利，不捨諸度，  具足莊嚴波羅蜜道。是時，菩薩為令眾生  心滿足故，內外悉捨而無所著，是則能淨  檀波羅蜜。具持眾戒而無所著，永離我慢，  是則能淨尸波羅蜜。悉能忍受一切諸惡，於  諸眾生，其心平等，無有動搖，譬如大地   能持一切，是則能淨忍波羅蜜。普發眾業，  常修靡懈，諸有所作恒不退轉，勇猛勢力無  能制伏，於諸功德不取不捨，而能滿足一切  智門，是則能淨精進波羅蜜。於五欲境無所  貪著，諸次第定悉能成就，常正思惟，不住不  出，而能銷滅一切煩惱，出生無量諸三昧  門，成就無邊大神通力；逆順次第，入諸三  昧，於一三昧門入無邊三昧門，悉知一切三  昧境界，與一切三昧三摩鉢底智印不相違  背，能速入於一切智地，是則能淨禪波羅蜜。  於諸佛所聞法受持，近善知識承事不倦；常  樂聞法，心無厭足；隨所聽受，如理思惟；入真  三昧，離諸僻見；善觀諸法，得實相印，了知如  來無功用道；乘普門慧，入於一切智智之門，  永得休息，是則能淨般若波羅蜜。示現一切  世間作業，教化眾生而不厭倦，隨其心樂  而為現身；一切所行皆無染著，或現凡夫、或  現聖人所行之行，或現生死，或現涅槃；善能  觀察一切所作，示現一切諸莊嚴事而不貪  著，遍入諸趣度脫眾生，是則能淨方便波羅  蜜。盡成就一切眾生，盡莊嚴一切世界，盡  供養一切諸佛，盡通達無障礙法，盡修行遍  法界行，身恒住盡未來劫，智盡知一切心念，  盡覺悟流轉還滅，盡示現一切國土，盡證得  如來智慧，是則能淨願波羅蜜。具深心力，  無有雜染故；具深信力，無能摧伏故；具大  悲力，不生疲厭故；具大慈力，所行平等故；具  總持力，能以方便持一切義故；具辯才力，令  一切眾生歡喜滿足故；具波羅蜜力，莊嚴大   乘故；具大願力，永不斷絕故；具神通力，出  生無量故；具加持力，令信解領受故，是則  能淨力波羅蜜。知貪欲行者，知瞋恚行者，  知愚癡行者，知等分行者，知修學地行者，  一念中知無邊眾生行，知無邊眾生心，知一  切法真實，知一切如來力，普覺悟法界門，  是則能淨智波羅蜜。\n\n**80-022**（`p`·CJK 208）：\n\n> 「佛子！菩薩如是清淨諸  波羅蜜時、圓滿諸波羅蜜時、不捨諸波羅蜜  時，住大莊嚴菩薩乘中。隨其所念，一切眾生  皆為說法，令增淨業而得度脫。墮惡道者，  教使發心；在難中者，令勤精進；多貪眾生，  示無貪法；多瞋眾生，令行平等；著見眾生，  為說緣起；欲界眾生，教離欲恚惡不善法；  色界眾生，為其宣說毘鉢舍那；無色界眾  生，為其宣說微妙智慧；二乘之人，教寂靜  行；樂大乘者，為說十力廣大莊嚴。如其往  昔初發心時，見無量眾生墮諸惡道，大師  子吼作如是言：『我當以種種法門，隨其所應  而度脫之！』菩薩具足如是智慧，廣能度脫一  切眾生。\n\n**80-023**（`p`·CJK 295）：\n\n> 「佛子！菩薩具足如是智慧，令三寶  種永不斷絕。所以者何？菩薩摩訶薩教諸  眾生發菩提心，是故能令佛種不斷；常為眾  生開闡法藏，是故能令法種不斷；善持教  法，無所乖違，是故能令僧種不斷。復次，悉能  稱讚一切大願，是故能令佛種不斷；分別演  說因緣之門，是故能令法種不斷；常勤修習  六和敬法，是故能令僧種不斷。復次，於眾生  田中下佛種子，是故能令佛種不斷；護持  正法，不惜身命，是故能令法種不斷；統理   大眾，無有疲倦，是故能令僧種不斷。復次，於  去、來、今佛，所說之法、所制之戒，皆悉奉持，  心不捨離，是故能令佛、法、僧種永不斷絕。  菩薩如是紹隆三寶，一切所行無有過失，隨  有所作，皆以迴向一切智門，是故三業皆  無瑕玷。無瑕玷故，所作眾善，所行諸行，教化  眾生，隨應說法，乃至一念，無有錯謬，皆  與方便智慧相應，悉以向於一切智智，無空  過者。\n\n**80-024**（`p`·CJK 310）：\n\n> 「菩薩如是修習善法，念念具足十種  莊嚴。何者為十？所謂：身莊嚴，隨諸眾生所  應調伏而為示現故；語莊嚴，斷一切疑，皆令  歡喜故；心莊嚴，於一念中入諸三昧故；佛剎  莊嚴，一切清淨，離諸煩惱故；光明莊嚴，放無  邊光普照眾生故；眾會莊嚴，普攝眾會，皆令  歡喜故；神通莊嚴，隨眾生心，自在示現故；正  教莊嚴，能攝一切聰慧人故；涅槃地莊嚴，於  一處成道，周遍十方悉無餘故；巧說莊嚴，隨  處、隨時、隨其根器為說法故。菩薩成就如是  莊嚴，於念念中，身、語、意業皆無空過，悉以迴  向一切智門。若有眾生見此菩薩，當知亦  復無空過者，以必當成阿耨多羅三藐三菩  提故。若聞名，若供養，若同住，若憶念，若隨  出家，若聞說法，若隨喜善根，若遙生欽敬，乃  至稱揚、讚歎名字，皆當得阿耨多羅三藐三  菩提。佛子！譬如有藥，名為：善見，眾生見者，  眾毒悉除；菩薩如是成就此法，眾生若見，諸  煩惱毒皆得除滅，善法增長。\n\n**80-025**（`p`·CJK 212）：\n\n> 「佛子！菩薩摩訶  薩住此法中，勤加修習，以智慧明，滅諸癡  闇；以慈悲力，摧伏魔軍；以大智慧及福德   力，制諸外道；以金剛定，滅除一切心垢煩  惱；以精進力，集諸善根；以淨佛土諸善根  力，遠離一切惡道諸難；以無所著力，淨智  境界；以方便智慧力，出生一切菩薩諸地、  諸波羅蜜，及諸三昧、六通、三明、四無所畏，悉  令清淨；以一切善法力，成滿一切諸佛淨土、  無邊相好，身、語及心具足莊嚴；以智自在觀  察力，知一切如來力、無所畏、不共佛法，悉皆  平等；以廣大智慧力，了知一切智智境界；  以往昔誓願力，隨所應化，現佛國土，轉大  法輪，度脫無量無邊眾生。\n\n**80-026**（`p`·CJK 369）：\n\n> 「佛子！菩薩摩訶薩  勤修此法，次第成就諸菩薩行，乃至得與諸  佛平等，於無邊世界中為大法師，護持正  法；一切諸佛之所護念，守護受持廣大法藏；  獲無礙辯，深入法門；於無邊世界大眾之  中，隨類不同，普現其身，色相具足，最勝無  比，以無礙辯巧說深法；其音圓滿善巧分布  故，能令聞者入於無盡智慧之門；知諸眾生  心行煩惱而為說法，所出言音具足清淨  故，一音演暢，能令一切皆生歡喜；其身端正  有大威力故，處於眾會，無能過者；善知眾心  故，能普現身；善巧說法故，音聲無礙；得心自  在故，巧說大法，無能沮壞；得無所畏故，心無  怯弱；於法自在故，無能過者；於智自在故，無  能勝者；般若波羅蜜自在故，所說法相，不相  違背；辯才自在故，隨樂說法，相續不斷；陀羅  尼自在故，決定開示諸法實相；辯才自在故，  隨所演說，能開種種譬諭之門；大悲自在  故，勤誨眾生，心無懈息；大慈自在故，放光明   網悅可眾心。菩薩如是處於高廣師子之座，  演說大法。唯除如來及勝願智諸大菩薩，  其餘眾生無能勝者、無見頂者、無映奪者；  欲以難問令其退屈，無有是處。\n\n**80-027**（`p`·CJK 243）：\n\n> 「佛子！菩薩摩  訶薩得如是自在力已，假使有不可說世界  量廣大道場，滿中眾生，一一眾生威德色  相皆如三千大千世界主。菩薩於此，纔現  其身，悉能映蔽如是大眾，以大慈悲安其怯  弱，以深智慧察其欲樂，以無畏辯為其說  法，能令一切皆生歡喜。何以故？佛子！菩薩  摩訶薩成就無量智慧輪故，成就無量巧分  別故，成就廣大正念力故，成就無盡善巧慧  故，成就決了諸法實相陀羅尼故，成就無邊  際菩提心故，成就無錯謬妙辯才故，成  就得一切佛加持深信解故，成就普入三世  諸佛眾會道場智慧力故，成就知三世諸佛  同一體性清淨心故，成就三世一切如來智、  一切菩薩大願智能作大法師開闡諸佛正  法藏及護持故。」\n\n**80-028**（`p`·CJK 19）：\n\n> 爾時，法慧菩薩欲重宣其  義，承佛神力而說頌言：\n\n**80-029**（`lg`·CJK 280）：\n\n>\n\n> 「心住菩提集眾福，常不放逸植堅慧，\n> 正念其意恒不忘，十方諸佛皆歡喜。\n> 念欲堅固自勤勵，於世無依無退怯，\n> 以無諍行入深法，十方諸佛皆歡喜。\n> 佛歡喜已堅精進，修行福智助道法，\n> 入於諸地淨眾行，滿足如來所說願。\n> 如是而修獲妙法，既得法已施群生，\n> 隨其心樂及根性，悉順其宜為開演。\n> 菩薩為他演說法，不捨自己諸度行，\n> 波羅蜜道既已成，常於有海濟群生。\n> 晝夜勤修無懈倦，令三寶種不斷絕，\n> 所行一切白淨法，悉以迴向如來地。\n> 菩薩所修眾善行，普為成就諸群生，\n> 令其破闇滅煩惱，降伏魔軍成正覺。\n> 如是修行得佛智，深入如來正法藏，\n> 為大法師演妙法，譬如甘露悉霑灑。\n> 慈悲哀愍遍一切，眾生心行靡不知，\n> 如其所樂為開闡，無量無邊諸佛法。\n> 進止安徐如象王，勇猛無畏猶師子，\n> 不動如山智如海，亦如大雨除眾熱。」\n>\n\n**80-030**（`p`·CJK 17）：\n\n> 時，法慧菩薩說此頌已，如來歡喜，大眾奉行。\n\n**80-031**（`byline`·CJK 12）：\n\n> 于闐國三藏實叉難陀奉 制譯\n\n---\n\n## 三、旁参与前接\n\n### 3.1 前接·第十七品《初发心功德品》\n\n本品紧承第十七品。问端首句「菩薩摩訶薩初發求一切智心，成就如是無量功德」即引彼品所叹之德为张本——澄观来意判「前明當位所成之德。今辨趣後勝進之行。故次來也。又前明發心之勝德。今辨所具之行相」（T1735）。彼品显德，此品立行；德行相须，第三会十住段乃圆。\n\n### 3.2 后接·第十九品《昇夜摩天宮品》（第四会首品）\n\n本品结会既毕，次品即升夜摩天宫、开第四会十行星。合论判第四会科由：「第四會夜摩天說十行法門。此之一會昇夜摩天是序分，從偈讚品已下是正說分，動地興供是流通分」（X0223）。本品十法矩阵中「速入諸地」「十波羅蜜」诸段，正为十行位次之先导〔本文判断〕。\n\n### 3.3 旁参\n\n- 《十住品》（第十五品）——答主法慧即彼品本说者，十住会至此自结其纲；\n- 《初发心功德品》（第十七品）「初發心時便成正覺」——本品问端「初發求一切智心」承之；\n- 《华严经疏》卷二十——本品疏尽处即第三会疏尽处；\n- 十度——六十《十住品》后无明法之十度全文，八十本品十波罗蜜段为汉译三本中十度最齐整之文〔本文判断·四十华严无此品〕。\n\n---\n\n## 四、义理要点与名相\n\n### 4.1 「法光明」释名四家\n\n释名一家一环：**澄观**立四义（能詮所詮·境智·離無明·通有財持業），断「明有法故，法之明故」；**法藏**四义（後位行法垂明前位·教法義·智境·當體妙軌），并反勘「不爾是闇，即亦非法」；**慧苑**按梵本五翻（達摩阿嚕迦娜忙鉢里勿多）·引《摄大乘论》无著总相释「法光明者謂大法光故」；**智俨**約教·約行二门；**通玄·合论**则就「明前明后」两义（令前五品之法其心更明·令后所行之法转胜明白）。五家所释同趋一旨：**此品之「明」，是住行转胜后位之照了**，非徒标章名〔本文判断〕。\n\n### 4.2 十法矩阵·十问十答\n\n澄观科正答「答前十問，即為十段」。矩阵与单元对应：不放逸（80-009）·清净（80-010）·佛喜两番（80-011/012）·速入地（80-013/014）·行净（80-015）·增胜（80-016）·净愿（80-017/018）·无尽藏（80-019）·随宜说法（80-020）·十度（80-021/022）·度生·绍三宝（80-023）·庄严不空（80-024）——问端则行体十句（五自利兼他·四利他兼自·一总结二利）加德用十二事（灭无明·降魔·制外·断垢·成善根·出恶趣·净智境·成地等七德·庄严三业·知佛功德·知一切智境·成熟众生）。**数科口径**：一品十二组十数清单，为第三会六品中密度最高〔实测见 §七〕。\n\n### 4.3 十波罗蜜·訶五欲与定慧名相\n\n十度段（80-021）为全品最长（CJK 695）。澄观释禅度十一句，其訶五欲喻最著：「色如熱金丸，執之則燒。聲如毒塗鼓，聞之必死。香如弊龍氣，嗅之則病。味如沸熱蜜，舐之則爛傷。觸如臥師子，近之則嚙」；又会通三昧·三摩钵底·等引之名：「言三昧者，此云等持，唯扃有心而通散心。三摩鉢底此云等至，通於有心及與無心」。般若度中判闻思修三慧次第；并引《起信论》合六度为五门之义：「若全雙運故，《起信論》合於六度以為五門」。\n\n### 4.4 绍三宝种·六和敬·发心三心\n\n第九答绍三宝种「文有四番為成十句」，三番递深（教发心·讚大愿·下佛种子），澄观判通别配位：「別者初在十信。次居三賢，後約登地」；释六和敬「三業為三及戒見利」；发心三心「謂即大悲大願大智」，与第十七品慧苑引《起信论》三发心（信成就·解行·证）可对读〔异说并存·不裁〕。\n\n### 4.5 名相表\n\n| 名相 | 训释 | 出处 |\n|---|---|---|\n| 明法（法光明·dharma-āruṇa?） | 梵本具翻应云法光明品；达摩＝法，阿嚕迦＝光明 | T1735·X0221 |\n| 不放逸（apramāda） | 勤智守心不犯塵境；精进三根之一 | T1735·80-009 |\n| 十無盡藏 | 普見諸佛藏乃至入無邊世界藏 | 80-019 |\n| 十波羅蜜 | 檀·尸·忍·進·禪·般若·方便·願·力·智 | 80-021 |\n| 三摩鉢底 | 等至·通有心无心 | T1735 |\n| 六和敬 | 身和同集·口和無諍·意和無違·見和同解·戒和同奉·利和同均 | T1735 |\n| 善見藥 | 「眾生見者，眾毒悉除」·喻菩萨成就此法 | 80-024 |\n| 涅槃地莊嚴 | 「標云涅槃釋云成道，文影略耳」·随处成道即金刚地 | T1735·80-024 |\n| 和尚 | 亲教师·见一发心者尊重犹和尚 | 80-010·T1735 |\n| 第三會竟 | 澄观·法藏同记；合论科第四会由 | T1735·T1733·X0223 |\n\n### 4.6 小结\n\n本品以「**行纲**」结会：问端领德、答门立行、十度成度、绍种尽未来、庄严结不空——**前十品之德，至此皆转为趣后之行**；第三会之十住段，由位次（十住）→通行（梵行）→胜德（发心）→**行纲（明法）**四段而圆〔本文判断〕。\n\n---\n\n## 五、注疏选要（诸家会读）\n\n### 5.1 澄观《大方广佛华严经疏》（T1735）——「明法品第十八」段\n\n澄观本品疏窗 nsh @249476–258123·长 **8,647**（入第十八卷经·疏末记卷第二十·第三会竟），科承**四门**：来意·释名·宗趣·释文。释文正判**三分**（请说·正说·结说），正说分内「答前十問，即為十段」，重颂分「十頌分二」。\n\n澄观疏窗口 T1735·NFKD 坐标 @249476-258123·raw len=8647·科判四门（来意·释名·宗趣·释文），释文正判**三分**（请说·正说·结说），正说分「答前十問。即為十段」，重颂分「十頌分二」。疏末记「第三會竟·大方廣佛華嚴經疏卷第二十」。\n\n以下按疏文自然段 60 字标尺分段照录，保留 CBETA 繁体原字形：\n\n> 明法品第十八\n(入第十八卷經)\n初來意者。前明當位所成之德。今辨趣後勝進之行。故次來也。又前\n明發心之勝德。今辨所具之行\n> 相。故次來也。二釋名者。準梵本具翻\n應云法光明品。統有四義。一法慧智慧。於能所詮進趣行法。分明照\n了故。即明所知法。二明\n> 是能詮。以能顯行故。法是所詮可軌則故。\n此則詮旨合目。明有法故法之明故。通二釋也。三明是智用法是理行\n及果。境智合說俱是\n> 所詮。法之明明之法依主名也。四所修行法體離\n無明。亦唯所詮有明之法。法即是明。通有財持業也。三宗趣者。明\n法不同略有四種\n> 。謂教理行果。尋教悟理觀理起行行成得果。皆初宗\n後趣。又此四皆宗。為成後位及成勝德為趣。第四釋文文有三分。一\n請說分。二\n> 正說分。三結說分。今初分二。先長行後祇夜。前中亦\n二。初敘問答之人。勝進趣後非勤不能故精進慧問。二佛子下正申所\n問。亦分\n> 為二。初領前自分勝德。後請說勝進之行。前中先總。後具\n大莊嚴下。別別有七句。一領德即領前莊\n> 嚴一切諸佛不共之法。二領\n乘即上已住究竟一乘道。三領位位不退故。即上已住如來平等性。三\n世諸佛家中生。此下晉云離生道者。\n> 即是領道。圓教初住離生因故。\n今四五二句成此一句。以捨世間得出世法。入住正位。即上於諸世間\n不分別等。六去來現在諸佛攝受\n> 。領得勝緣。即上佛護佛讚等也。七\n決定至於菩提。領其當果。即上云當得三世諸佛無上菩提。德雖無量\n不出於此。故略舉耳。此約\n> 當住位釋。若約攝於上位理無不通。而於\n求勝進義非愜當。二彼諸菩薩下。請後勝進中亦二。先問所成行體。\n後問行成德用。以破癡\n> 等為德用故。前中先正問後結請。前中十句為\n三。初五自利兼他。一問云何修習順佛令喜。其修習言亦總亦別。總\n遍諸句。別謂策勤\n> 。即下答中明不放逸。二問順法入位。三順行四順\n願。五順德積德成藏故。次四利他兼自。束為二對。初常說法而不捨\n自行。後下念\n> 四生上弘三寶。末後一句。總結二利不虛。二佛子下結\n請可知。第二復次下問行成德用。文亦分二。初正問後結請。前中分\n二。初問\n> 行所成因德。二問結因成果德。今初有十二事。初十一字貫\n下諸句。一能滅無明。未審修何行法。而能滅耶。諸句皆爾。意在徵\n因。\n> 無明有體黑闇為用。非明無之處即名無明。故別有惑體。由無明\n故事理皆昧。名為黑闇。二問降魔。三問制外。四問究竟斷道。心垢\n\n>\n即是所知。亦名習氣。五善根以何而成。六三惡八難云何可出。七智\n境何由淨治。八地等七種淨德云\n> 何成就。九依正三業功德。云何莊嚴\n滿足。十以何觀力知佛功德。十一一切智境復云何知。十二何法能成\n就眾生。乃至作大佛事。第\n> 二及餘下結因成果。於中二。先正結等。\n謂結所不說及等如來。第二於諸如來下。顯等佛之用。護持正法便等\n佛故。故偏明之。文有\n> 十句。初總餘別。總謂開示演說教理行果。皆\n有護義。諸魔下別。一異敵不侵。二攝持修行。三十王外助。四舉世\n同欽。五諸佛灌頂\n> 。準梵本云。一切如來共所守護同灌其頂。故應迴\n文。六菩薩愛敬。七得眾善根。八能演深法。九攝德自嚴。若得此九\n方名護法二。\n> 一切下結請可知。第二爾時下偈文分二。初一讚說者。\n餘十頌上文。於中亦二。初一頌領前。餘頌請後。於中亦二。前四頌\n所修行體\n> 。後五頌行所成德。於中亦二。前三頌行所成因德。後二頌\n結因成果德。大文第二正說分中分二。先長行後偈頌。前中亦二。先\n讚問\n> 許說。後正答所問。前中三。初讚所問利益。二佛子下讚能問具\n德。三諦聽下誡聽許說。第二正答中二。先答所成行體。後答行成德\n\n> 用。前中答前十問。即為十段今初段中有五十句。前二十句答前修\n習。後三十句答令佛歡喜。前修習言亦總亦別。今不放逸亦通總別。\n>\n總則遍下十段。皆由不放逸成。別則屬於修習。在文分二。先牒前標\n後。勤智守心不犯塵境。名不\n> 放逸。是修習相。不守根門則名放逸。\n涅槃云。不放逸根深固難拔。因不放逸。一切善根皆得增長。故首明\n之。即精進三根。於所斷\n> 修防非為性。對治放逸。成滿一切世出世間\n善事為業。二別辨中有二十句。前十始修。後十終成。今初有四。一\n總標。二徵數。三別\n> 列。四總結。他皆倣此。列中一對治破戒放逸。\n三聚非一故名為眾。即三德三身之因。故首明也。寧捨身命不犯小\n罪。故名護持。二\n> 離癡智顯故菩提心淨。三四可知。五恐負自心故思\n本發。六遠離惡緣。七修善無住。八離小行大。寧起疥癩野干之心。\n不起二乘之心\n> 。難反復故。九積善無替。十亦愛亦策。不令過分使不\n相續。若不續者當令相續。故須觀察。二終成十中。一行清淨由不放\n逸。得無\n> 違教失故名清淨。二念智清淨。念則明記智則決斷。念有智\n故念即無念。智有念故常得現前。此二相資故名成就。三等持清淨不\n沈不\n> 掉。故名為等。然此沈掉乃含多意。如始學者。不昏沈不惡作。\n亦名為等。未是深定今稱性寂然。故能不掉。智照不昧。所以不沈。\n\n> 如此深定非深非淺。四勤聞清淨。五思修清淨。六等引清淨。七妙慧\n清淨稱理平等故。八攝受清淨。等利益故。如大地者。勝鬘云。譬\n> 如\n大地負四重檐。一者大海。二者諸山。三者草木。四者眾生。菩薩大\n地。荷負四種重任者。謂離善知識無聞非法眾生。以人天善根\n> 而成熟\n之。及三乘人隨機遍攝。名等作利益。九同行清淨。謂如彌伽讚敬善\n財。十承事清淨離雜心\n> 故。次答令佛喜。有三十句。初十結前生後。\n次十正成行相。後十純熟究竟。今初。此即牒前十種清淨。如次配\n屬。前八可知。九攝\n> 二句。以菩提心佛法無邊誓願知故。既敬此心及\n事於師。故能順了。上九結前第十生後。故令佛喜。次十正成行相\n者。前明即前修習\n> 故令佛喜。今更別明。於中一勤而不退。成上精\n進。二內不惜身正念方成。三外絕異求故唯有勝進。四加行觀空方能\n不息。五正證入\n> 理故無所依。六窮得法印方順深法。法印多種。或五\n或四或三或一。但廣略之異耳。言五印者。即五非常觀。謂無常苦空\n無我寂靜。\n> 言四印者。合空入於無我。空即我所故。或名優陀那。菩\n薩藏經第二中。名法鄔陀南。鄔陀南者此名標相。涅槃寂靜是無為法\n標。相\n> 印即決定義。如說有為決定無常等。善戒第七地持第八。瑜伽\n四十六。廣有分別。言三印者。四中合苦入於無常。或除涅槃寂靜。\n有\n> 為印故。今以諸印印於一切。亦無能印故云不著。則入唯一實相印\n矣。後四依理起行。七願護小心故增廣大。八智護凡見方順佛法。九\n>\n自無法愛十無作而修故。入無諍門矣。後十純熟究竟中。行修成熟故\n云安住。初二入理行。一加行離逸。二正證捨相。次二救生行。\n> 次二\n隨緣行。十度別修諸行總攝。後四願智行。即十度後四也。亦可。前\n十如次成此十種。但生熟\n> 之異耳思之。第二答入菩薩所住處問。文分\n為三。初有十法起入地行。次住地觀修。後明地要勝。今初列中初三\n自分行。一具資糧。\n> 二成加行。一度具十名大莊嚴。三智契實相故不\n隨他。後七起勝進行。謂四外近良緣。五內須自策。六能安果用。七\n不厭修因。八雙\n> 遊定慧深心契寂。利智貫達。以斯二法嚴於法身。故\n法華云。佛自住大乘。如其所得法定慧力莊嚴。以此度眾生也。九不\n住法門。住\n> 有二失。一不契地智。二不能進趣。不住反此。十善窮地\n體。謂依一佛智。方便多門更無異體。二復次下住地觀修。有十一\n句。初一\n> 是總。一切法門是成地之法。次九為別。二諸地證智。三修\n加行因。四攝報等果。五所知分齊及所化境。六進德修業斷障力用。\n七示\n> 百身等。八分別諸願。十善等法。九所證法界。皆言隨其者諸地\n非一故。十悉善下辨成觀相。皆自心者。智與心相應故。因由心學果\n\n> 是心成。境由心現力用。是心分位。神通是心現起。分別是心決擇。\n所得是心造詣。並心外無得何所著耶。十一如是下結觀成益。三佛\n> 子\n下顯地要勝。標徵釋結文並可知。第三答大行清淨問。有二十句。初\n十是因後十是果。今初行成出障故云清淨。雖數名小異大同十\n> 行。亦\n通十度。十行所行即是十度。欲勝進彼故此前修。又下文。由為物說\n法自增諸度故。復廣明。所望處別互有影略。前七可知。\n> 八於惡眾生\n修菩薩行。心不傾動。是難得中義。本願誓化故。九善法行中。與眾\n生為清涼法池。大\n> 悲堅固普攝眾生為舍為歸是廣度眾生。如橋梁義。\n有力能故。十真實行中文云。此菩薩入三世諸佛體性。與三世諸佛善\n根同等。智決\n> 體同故。第二菩薩既得下。由行淨因得勝法果一他力\n勝。二自善勝。三深定勝。四同行勝。五助道勝。六真智勝。七意樂\n勝。八觀慧\n> 勝。九修行勝。十增進勝。第四答大願問。有二十句。初\n十起勝淨願。後十勵志令滿。今初全同初地十願。一成熟眾生願。二\n淨佛國\n> 土願。三供養。四護法。五承事。六同善根。七攝法上首。法\n通至佛名如來門。八三業不空。九具修諸行。十現成正覺。但彼文\n廣。\n> 依彼次者。五七一二六八三九四十。為今之次。二佛子菩薩下。\n令願成滿者。由斯十句。能滿前十及餘多願。於中五深心則可久。六\n\n> 悉成則可大。可久則菩薩之德。可大則菩薩之業。餘並可知。第五佛\n子已下。答護菩薩藏問文亦有四。初是結前生後。謂以前行願蘊積\n> 成\n藏故。唯十句更無成熟等異。文有五對。並顯可知。第六菩薩得是\n下。答隨所應化常為說法問。文分為三。初結前生後。謂蘊積福\n> 智用\n以攝生。二佛子下徵以標起。三所謂下正解其義。於中分二。前知器\n授法。二具德成益。初中先知器有四一識習氣所作。如金師\n> 之子。應\n教數息等。二知種性因緣。聞法發心為因。隨因成性。遇師聞法為緣\n隨緣成種。三知心行\n> 之病。謂多貪等。四知希望差別二貪欲下授法文\n有十句。初二可知。三癡有二種。一迷於事理教觀法相。二惡邪推求\n不信業因。令其\n> 觀察十二因緣。能離邪執自性等計。上三唯對治。四\n等分者。等謂相似三觀不可並施。若等重者教觀勝義。謂婬欲即道\n等。若等輕者\n> 。可以生善為人化之。釋此四分具如雜集十三。五求人\n天樂為樂生死說三苦者。乃至非想行苦所隨故。次四可知。十樂事寂\n者令成理\n> 寂。若沈空寂令成事用。菩薩已下總結隨宜。二為說法時下\n明具德成益。有十句十對。一文連義正。二法智無差。即依法不依\n人。依\n> 智不依識。三審定無違即依了義經。不依不了義經。四立法義\n故能遍斷疑。五了物根故入於佛教。六寂契真際照法性源。七斷真法\n愛\n> 除人法執。八念佛了音。九亡言巧說。雖無說無示善順宗因。十令\n悟隨宜終歸平等。即說之益。第七菩薩如是下。答恒不捨離諸波羅蜜\n>\n問。於中二。先結前生後。則正說法時便具十度。設自修此亦為利\n他。一向大悲了平等故。通至佛果故皆名道。二是時下。正示不捨\n> 度\n相。十度即為十段。皆先辨相。後是則下結名。前四辨相中先辨施等\n相。後無著等辨波羅蜜相。檀戒可知。三忍中諸惡通於內外。\n> 其心下\n契理平等成波羅蜜。四進中普發眾業。是無餘修。亦利樂勤常修靡\n懈。是長時修。恒不退轉是無間修。上即加行勤也。勇猛莫\n> 制是勇捍\n修。亦被甲勤。於諸已下是顯度相。五禪定中文有十一句。一訶五\n欲。所以訶者。夫禪定\n> 虛凝湛猶渟海。高攀聖境尚曰妄情。馳想五塵\n豈當為道。云何訶之。色如熱金丸執之則燒。聲如毒塗鼓聞之必死。\n香如弊龍氣。嗅之\n> 則病。味如沸熱蜜。舐之則爛傷。觸如臥師子近之\n則嚙。此五欲者。得之無厭如火益薪。亡國敗家世世為害。過於怨\n賊。故不應著。\n> 況菩薩體此即如。復何所著。二入次第定。謂四禪四\n空及滅受想。為九次第定。下。十地離世間品具明。即一切門禪。三\n安住理定寂\n> 愛味住。智契不出名正思惟。以見心性故。亦善士相。上\n二定體即定自性。餘六定用。四消滅煩惱通愛見慢等。故云一切即清\n淨相。\n> 五出生諸定。如起信云。得此真如三昧。能生無量諸三昧門。\n上文云。一三昧生塵等定是也。即難行相。六引發神通。謂精義入神\n以\n> 致用也。亦遂求相。七逆順自在亦難行相。從滅定出入非非想乃至\n初禪。是名為逆。從初禪出入第二禪乃至滅定。是名為順。此中逆順\n>\n應各有超間。謂超一超二乃至全超。文無者略。此亦名為師子遊步三\n昧。八一多自在攝一切定。應有四句。謂在一入一。在一入一切\n> 。在\n一切入一。在一切入一切。得其源故。九悉知定境。定境有三。一諸\n定所緣。二諸定分齊。三諸定境用。皆能知之。十者總結體\n> 用無違。\n言三昧者。此云等持。唯扃有心而通散心。三摩鉢底此云等至。通於\n有心及與無心。唯諸\n> 位定體。此二功德名為等引。上二句定體通於此\n三。六句定用即是所引。言智印者即一實相故。智論釋百八三昧中。\n第二名寶印三昧\n> 。謂與實相般若相應故。上二是定此一是智。合即雙\n運。今菩薩隨在一定。即與一切三昧。此三無違。十一速入智地。亦\n即定果。以\n> 菩薩之定。事窮無邊理極無際。故能速至一切智地。亦難\n行相。亦二世樂相。又上二三四。即現法樂住禪。次五引生功德禪。\n五亦饒\n> 益有情禪。後二通三。又通十種清淨。一由世間淨離諸愛味\n故。即第三句。二出世間淨亦此句攝。三加行淨即是初句。四得根本\n淨即\n> 第二句。五根本勝進淨即第五句。六入住出自在清淨。七捨靜慮\n已復還證入自在清淨。上二即第七句。八神通變現自在清淨。即第六\n\n> 句。九離一切見趣清淨。十一切煩惱所知障清淨。此二共是第四句\n攝。餘如瑜伽四十三九大禪說。十行之中當顯其相。六般若中句亦有\n>\n十。前之三句。聞法近友即聞所成慧。初句正明。二近友不倦。是聞\n慧緣。三樂聞無厭是聞慧因。暫聞則己慧不生故。四即思慧學而\n> 後思\n故。云隨所聽也。內正作意故云如理。五亦思擇慧。又於無煩惱中善\n決擇故。捨煩惱故。六善觀下皆是修慧。此句悟入於如。七\n> 宿習思量\n故了無功用道。八周備悟入。一中一切等名為普門。九入二智門。十\n總結已圓故云休息。後三連環。此中亦有九門之相。恐\n> 繁不配。其中\n雖定慧互有。互相嚴故而為門不同。若全雙運故。起信論合於六度。\n以為五門。後之\n> 方便義亦準此。涉有不迷於空則名方便。不厭有而觀\n空。便稱般若。豈令般若不能知有耶。方便若不觀空何名方便。非唯\n此三萬行皆\n> 爾。況般若能行萬行。何法而不用之。寂照盡於理極。不\n得一行無此君耳。所以開則萬行淼然。泯則一不為一。得意則無所不\n通耳。\n> 七方便中亦有十種。一巧智現世為方便。二悲非愛見故化而無\n厭。即悲智相導為方便。三依體起用。四非捨非受故一切無染。五凡\n聖\n> 雙行由雙非故。六行無住道。七觀察進趣。八現相不著。九遍入諸\n趣即無生現生。十度脫眾生是無化現化。初九拔濟餘皆迴向。依瓔珞\n>\n因果品。後之四度亦各有三。方便三者。一進趣方便。即第七句。二\n巧會有無除第四句。皆此所攝。三不捨不受即第四句。八願中亦\n> 有十\n願。前五後三盡字為初。六身恒住盡劫海。七智盡心海。八窮盡有\n支。九盡現國土。十窮佛果智。此求菩提前九利樂。若依三願\n> 。二三\n四五為自行願。六七為神通。初及八九為外化。十通二利。皆云盡者\n窮彼源故。九力中十句各二。謂標名釋義。一契理。深心\n> 是思擇力。\n染則無力。翻此故有也。餘可準知。皆修習力。瓔珞有三。皆名通\n力。一報通力。二修通力。三變化通力。觀彼似當九十\n> 二句耳。十智\n度中。識病知根順理授法。名為智度。亦有十句。初四知病輕重。次\n三知根欲樂。一\n> 位二行三心。後三知法樂。一知理法。二知果法。三\n普覺法界。前七成就有情。後三現法樂住。瓔珞三智。一無相智即知\n法真實。三\n> 變化智即如來力。餘皆第二一切種智。餘義如初會說。第\n八佛子下。答前所念眾生咸令得度問。於中分三。初結前起後。二正\n明化度\n> 。三結如本誓。前中初結前。清淨約離障。圓滿具事理。不捨\n謂常相應。住大莊嚴者。總結十度為嚴。是大乘體。後隨其所念下生\n後\n> 。由且前故。二墮惡道下正明化度。文有十句約為四類。初二令離\n惡果。三塗除無間皆容發心。如慈童女。二令勤修則脫八難。值佛聞\n>\n法。次三令離惡因。貪有二種。上偏語色貪教修不淨。今通語貪財名\n等故。但云示無貪法。無貪法者。謂不淨觀空少欲知足。二瞋亦\n> 二\n種。上偏語能為違害。故令修慈。今通瞋情非情故觀同體。不應自\n瞋。三癡亦二種已如上明。此約邪癡令觀緣起。次三令離流轉三\n> 界循\n環。皆可厭故。初欲恚害等義見三地。二色界雖定慧似均。然是定\n地。恐其滯寂故為說觀。又無生正觀令得無漏。三無色定多故\n> 為說妙\n慧。又示諦觀方得永出。後二示以三乘隨機為說。又引權歸實令知本\n寂。三如其往昔下結如本誓。故能真度。師子吼者決定度\n> 故。第九佛\n子下。答前紹三寶種使不斷絕問。文分為二。初仍前總標。二所以下\n徵釋所以。由化眾生入三寶海故。能紹前令不斷也。\n> 文有四番為成十\n句。前九別明後一總結。就初三番釋通總別。然皆後後轉深前前。通\n者通在諸位。\n> 別者初在十信。次居三賢後約登地。三番佛種差別云\n何。初教發心令具因性。未發唯有本住性故。次讚大願令成因行。令\n所發心不退\n> 轉故。言大願者。謂求菩提願利樂有情願。又防惡願如戒\n經說。有進善願如常所明。三下佛種子令成佛智。謂證真如成無漏\n故。上約\n> 別顯。通者發菩提心總有三心。謂即大悲大願大智。初番為\n總已含大悲。次番是願。後番是智。謂示妙理令暫見心性。成金剛\n種。三\n> 番法種差別相者。初開法藏令教不斷。次說因緣令義不斷。後\n具四種護。令教理行證皆悉不斷。復次初雖領教未發真解。次具解行\n未\n> 能證故。三番僧種有何差別。初受法無乖始墮僧數。次修六和敬僧\n行已成。後統理大眾令僧清淨。復次初雖奉教解行未具。未是真和。\n>\n次雖具解行未離眾怖。不能控御。言六和者。三業為三及戒見利。謂\n身和同集口和無諍。意和無違。見和同解。戒和同奉。利和同均\n> 。又\n約菩薩。三業同慈六皆同體。真實和也。一切恭敬令僧久住。後總句\n者。弘法奉戒三學兼修。則不斷三寶化化不絕。第十菩薩如\n> 是下。答\n前善根方便皆悉不空問。先略後廣。略中分三。初結前生後。謂由能\n紹三寶故所行無失。二隨有下由不空故。三業無瑕。謂\n> 所作迴向是不\n空業。三無瑕玷故下。由無瑕故不空。所作反覆相成。玉之內病曰\n瑕。瑕謂體破。外\n> 病曰玷玷謂色污。以顯三業內外無失故。白珪之玷\n尚可磨也。三業之玷不可為也。初句牒前。次所作下示無瑕相。後皆\n與下顯不空相\n> 。方便有慧方便不空。慧有方便慧亦不空。此辨所行不\n空。迴向智智辨趣果不空。第二菩薩如是下廣明有二。初明自業不\n空。後辨利\n> 他不空。初中雖明不空。義兼無失。以一切清淨離煩惱\n故。又此無失即自業不空。順止寂故。文有標徵釋結。釋中皆先標後\n釋。初四\n> 依正莊嚴。次六攝化莊嚴。言涅槃地者。以涅槃嚴地也。謂\n隨有成道入涅槃處。當知其地即是金剛。今於一切處成。則無非金剛\n也。\n> 標云涅槃釋云成道。文影略耳。四菩薩成就下結文可知。二若有\n眾生下利他不空。於中有法喻合。文則可知。佛與菩薩俱益不空。今\n\n> 不見者不宜見故。見不益者無行力故。亦遠益故。上來並答所成之行\n問竟。第二佛子菩薩摩訶薩住此下。答行所成德問。前文有二。今\n> 亦\n二段。第一答以行成因德。二答以因成果德。今初具答十二問。各有\n二句。上句答下句。上云修何滅癈。今答以智他皆倣此。二用\n> 慈降\n魔。夫欲害人反招自害。苟欲安人則物我俱安。故柔勝剛弱勝強。以\n慈安一切惡魔。無以施害。慈善根力其功叵量。三福則怖之\n> 以威。智\n則屈之以辯。次四後四文並可知。八以方便智慧出生是答。一切菩薩\n已下即是所問。準上文中此有七事。今波羅蜜下欠總持\n> 句。然方便有\n二。若加行方便出生地度。若善巧方便。亦生諸度及餘五法。智亦有\n二。若根本智即\n> 成內證。若後得智即成業用。是故此二出生此七。言\n清淨者治彼障故。二佛子下答以因成果問。於中亦二。先結因成果。\n謂但勤修上\n> 來諸行。則能次第從因得果。二於無邊世界下。正答所成\n之德。謂護持正法。但當勤修上來以行成因之德。自當成後護持法等\n諸德。\n> 故乘前結因成德明之。答上十句文分九段。第一答初總句。如\n來法藏守護開演。二佛所護念故。即答眾魔外道無能沮壞。以佛護\n故。\n> 三守護受持下。答攝持正法無有窮盡。四於無邊下。答於一切世\n界中。演說法時十王敬護。謂身勝音巧令聞者入智故。五知諸眾生\n下\n> 。答舉世同欽稱機令喜故。六其身端正下。答菩薩愛敬端正有德\n故。其佛灌頂。在前第二佛護之中。七善知眾心下。答得善根力增長\n\n> 白法。於中先總明三業。後得心下別顯十種自在。皆是善根。其十自\n在之能。並是增長白法。八菩薩如是下。答開演如來甚深法藏。九\n> 佛\n子菩薩得如是下。答攝持正法以自莊嚴。於中初明自嚴。次徵後釋。\n以攝正法故。有十句德。亦即是前所成之德。可思準之。第二\n> 重頌\n分。十頌分二。初六偈頌前十種所成行體。後四偈頌行所成德。前中\n初二偈頌佛喜。於中初半頌不放逸。餘頌佛喜。二有一頌。\n> 頌入地及\n大行大願。三一頌。頌菩薩藏。及所應化而為說法。四一頌頌不捨自\n行諸度及所念眾生。\n> 皆令得度。五半頌頌不斷三寶。六半頌頌善根方\n便皆悉不空。二菩薩所修下頌行所成德。初一頌初行所成因德。後有\n三偈。頌以因成\n> 果德。於中初二頌。通頌前之八段。後一頌。別頌第\n九答攝持正法以自莊嚴。以喻而顯。一身儀安諦頌前現身。次辨德威\n猛。頌前以\n> 無畏辯。三心定不動頌安其怯弱。四智深如海。頌以深智\n慧。五法雨滅障。頌前而為說法。第三時法慧下明結說分。謂契理合\n機故佛\n> 喜眾奉也。第三會竟。\n大方廣佛華嚴經疏卷第二十\n大方廣佛華嚴經疏卷第二十一\n唐清涼山大華嚴\n> 寺沙門澄觀撰\n\n### 5.2 法藏《探玄记》（T1733·六十品题〈明法品第十四〉）段\n\n法藏疏窗 @170651–178636·长 **7,985**。四门同前·释名四义·结「此上第三會竟」（探玄记卷五尽处入卷六）。\n\n法藏窗口 T1733（六十品题〈明法品第十四〉）·NFKD @170651-178636·len=7985·四门同前·释名四义·记末结「此上第三會竟」（探玄记卷五尽处）：\n\n> 明法品第十四\n四門同前。\n初釋名者有四義。一後位行法垂明前位。此明即法也。二明是教法是\n>\n義。三明是智法是境。此二法之明明之法。四智行離染當相名明。即\n明可軌是以稱法。又諸行煥照稱性為明。當體妙軌故亦云法\n> 。故云明\n法。不爾是闇即亦非法。\n二來意者。前明當位體德。今辨勝用趣。後義次第故是故來也。又前\n明自分。今顯勝進。故\n> 次來也。\n三宗趣者。明法不同有四種。一理法謂真如性。二行法謂六度等行。\n三教法謂十二分教。四果法謂菩提涅槃。今此正明\n> 行法兼明餘三故以\n為宗。又此四中依理起行依行成果。教說前三故唯四耳。\n四釋文者。此文分三。初請分。二說分。三證信分。\n> 初中二。初長行\n後偈頌。前中二。初領前自分。後問後勝進。前中若非懃策照理之機\n無以堪受勝進轉增之法。又若非具此洞真淨\n> 行法無以能說。故進慧問\n法慧說也。頌中有八句。一總七別。別中一大誓自嚴二行乘果乘。三\n入於因位。離猶無也。謂至無生位\n> 道餘處釋為初地位也。此在地前相\n攝故也。四背。五向。六同佛住。七定成果。二正問後勝進中二。先\n正問行法之體。後問依行\n> 所成之德。前中總有十一句。初六自利行。\n次四利他行。後一通結俱利究竟。前中彼菩薩者牒前發心具德之人。\n初句問修習何行令功德轉勝。問前品中云甚深諸三昧無量陀羅尼諸佛\n自在力無量妙功德莊嚴初發心。又云即是佛\n> 等。何所少故更修習耶。\n答此圓教普賢行中大位有二門。各攝法界。前約自分。此辨勝進。前\n中亦具後後中亦具前。然前恒非後\n> 。後恒非前。謂具前之後非前。具\n後之前非後。故位分前後。攝義恒周故也。二問修習何行令如來歡\n喜。是故云何修習之言貫通\n> 下諸句准之。三問位地。四依位起行。五\n大願助成。六積德成藏。利他中初應物機化。二不廢自行。三赴欲度\n生。前生此熟為異\n> 。四化令趣菩提故。使三寶不絕成興隆耳。下一結\n俱利中。善根境結自利。方便結化行。二俱究竟故云不虛。善哉下乃\n至欲聞。\n> 此文有二意。望上則為結請勸說。望下即是希聞後問。二問\n所成德中。如諸菩薩所修功德者總舉所依之德。滅除已下明依德所成\n\n> 是所問法也。於中准下答總有十八句分二。初十七句明德備。後得善\n根力下明勝用。前中二。先十六句內德圓。後天王下外尊敬。\n> 前中\n二。先九句明自利德。後具足佛剎下七句問利他德。前中二。先有七\n句問因德。後莊嚴下二句問果德。前中二。先六句明行\n> 修具足。後菩\n薩一切下眾德圓備。前中有二。初四句是斷障行。謂先離無明住地是\n離惡因也。二伏魔。三制外道是離起惡緣。四\n> 離塵垢是離惡習也。二\n修善行有三。初修成福德。二超離惡果。謂離三惡八難也。三修具淨\n慧\n> 。此慧下文將為答也。故唯有六句。總是除二障成二嚴。行修具足\n故也。下德圓中有七。一攝十地。二具十度。三多三昧。四妙總\n> 持。\n五六通。六三明。七清淨法總結也。下果德中二。先依正三業果。後\n力無畏等攝眾德差別果。下利他中四。初一句應機現剎\n> 具足。二隨成\n就眾生下以正行攝生。於中初隨成行緣。二及諸菩薩下正結行法有\n五。一勝德。二所軌。三依法造修。四行能至果\n> 。五廣攝所緣及分\n齊。皆悉滿足。是總結也。三速成等者明行有辨果功能故云速成也。\n四成護法行有四。初句總明護法行。云何\n> 護耶。下三句別顯。一廣說\n教開示義。二不為異道所侵。三自具文義總持常說。頓說而無窮盡。\n上來內德圓。下明外敬護中有二\n> 。初總舉世間十王及佛法王守護。二\n別顯中三。先一切世間等顯前十王護。二常為下顯法王護。三一切菩\n薩下明同位護。行體德\n> 圓備竟下明勝用。謂依諸德有此勝用。於中四\n句。初增自無流法故云白法。即自成證行也。二能開等者以證法教\n人。三自具教行\n> 。四次第等教人教行。二偈頌中。四句成頌有十一\n頌。初一總請。下別頌。別中二。初一頌頌前文。二云何下正頌問後\n行法。於\n> 中初頌前十一種行法。二人雄下頌前依行所成德。於中初二\n句頌上善哉願說文。次一頌半頌上行修離障。次二句頌眾德備。次一\n\n> 句略頌果德法。次隨其下三句頌上利他中行緣。次一切下一頌頌上護\n法行。後一頌上十王敬護。\n> 於中四。初智德無畏猶師子。二福德圓備\n如滿月。三斷德離染若蓮華。四淨果現前如最勝。此四亦是頌上善根\n力增白淨法等勝用\n> 文也。\n第二答中二。初直說。後重頌。前中二。先歎問許說。後以法正答。\n前中二。先歎問。後佛子下許說分齊。前中先歎所問\n> 益。後歎能問者\n德。前中先辯益。謂饒益增善因。安樂授樂果慧利令得出世法利。後\n哀愍下結意歎能問中。先歎自分德有五。一\n> 稱實慧。二不動而進故云\n大力。三無間修故云一心等。四位成就故云不退。五當位滿故超出世\n也。又初句明有解。後四明有行。\n> 又此等亦是釋進慧名可知。\n下歎勝進德。謂於問自在等如來也。\n下正答中二。先答前十一問行法之體。後答彼依行所成之德。前\n> 中依\n問次第答之。答初句功德轉勝有二十句。初十始修。後十終成。又初\n是自分。後是勝進。前中已得發心之藏。牒前擬後也。\n> 應離癡等是總\n舉也。又涅槃經云。不放逸根深固難拔。因不放逸根固一切諸善根皆\n得增長。不放逸有二。一約事如論釋\n(云云\n> )\n。二約理如法集經\n(云云)\n。下\n別中三。初標數。二列名。三結數。列中此中對治十種放逸。一破戒\n逸。二迷菩提逸。三失悲心逸。四嬾墮逸。五樂諠雜逸。六樂世間\n逸。七樂劣善逸。八樂二乘逸。九染功德逸。十\n> 生絕分逸。如次十句\n對治應知。初者既得發心已要須持菩薩三聚淨戒。然持三種。一不作\n三業惡。二不為名利。三不起戒見。此\n> 是標中守護也。二者不於菩提\n起有無等見而發心。此是標中離癡也。三依言攝物故離諂曲。四所作\n善根必使終成故云不退。此是\n> 標中精懃也。餘皆不離此等三也。五者\n造業求生是凡夫行。菩薩離之常樂寂靜有二種。一約身有二。一所住\n靜。謂離家室喧擾等\n> 處。二能住靜。謂持淨戒離三業非。此以福捨罪\n離在家凡夫。二約心亦二。一所住謂真空妙境。二能住謂定慧之心。\n此以慧捨惑\n> 離出家凡夫。六厭背世樂。七專修出業。八雖求出捨二乘\n無悲救世之心。九雖修菩薩大悲功德而不見能所修故無污也。十知己\n身\n> 有四義。一知身從緣而有離我我所。二知己道行力若劣終不強對煩\n惱境界。三知力若強即須精苦作進修行。四定知已身有菩提種當\n> 得佛\n故。二勝進中。淨法者謂練治前行使純熟離染故云淨也。十中一正念\n淨。二捨離下離過淨。三安住下正行淨。四常樂下求法\n> 淨。五隨所下\n除疑淨。六具足下智慧淨。七心常下三昧淨。八聞好下解空淨。亦是\n嚮忍淨。九等視下勝想淨。十恭敬下報恩淨。\n> 亦是敬養淨。\n第二答令如來歡喜有二十句。亦初十自分。後十勝進。前中初結前。\n不捨下生後\n> 。於中初句牒下初五句。二心無倚牒下第六。修甚深法牒\n下七八二句。於無諍等下牒下第九第十。是故總標下十行。稱可聖心\n故\n> 令如來歡喜。下別十中。初三修有行。初一勤勇行。次二於有中離\n過行。謂內身不惜外財不求。次三修空慧行。一加行修空。二正\n> 證照\n實。三後得分別而猶無倚。七常求菩提故名大願。八勝相現前故云光\n明。九隨有離過故云善知損益\n(云云)\n。十以無著\n> 心造履諸法故云清淨\n也。下明勝進十法。修已成就故云安住。十中一對過不染。二證實捨\n相。三四慈悲攝物。五六行滿離染。餘\n> 四願智具。一大願具。二巧慧\n雙行。三思擇勝力。四達性無礙。故云無依止也。\n第三答菩薩所住功德亦二十句。初十自分中。一\n> 起行心。二正行行。\n三智順理故超言。此上修始也。四近善友。五若不精勤雖近無益。六\n若不取意會法雖勤無益。又善取佛意者\n> 有三種。一約教。以二諦三性\n三量四理四悉檀四意四密六相六釋八聲五力等會取經意而受持之。二\n約義。謂言近意遠。雖說法相\n> 諸門意在真理超言之處。三約行。謂意\n在滅惑成德。非但口言故也。七若不依行會意亦何益。此上修次也。\n八成大誓二嚴。九因\n> 位成滿。十圓同果位。此上修終。勝進中二。先\n明觀解。後摩訶薩作是念下明依解起行。前中初\n> 結前生後。謂善成諸\n地名巧方便。又於地不著亦名巧便。成地之要。故云先應修習也。十\n中初八是所成地法。初一總。二是諸地\n> 證智。三施戒等行。四所依淨\n土。五所緣及分齊。六勝通及十自在等。七示現異身。八後智說法。\n此並諸地非一故皆云隨其也。\n> 下明能成方便。謂雖分別而無著是方便\n也。由心造者釋無著所以。謂知心外無法故無所著。心造有三重。一\n轉識分別作。二本識\n> 隨薰作。三真心依持作。皆心作故不有。心作故\n不無。是故無著也。菩薩若能下結能成地。下明起行於中三。先標。\n二釋。三結\n> 。並可知。\n第四答清淨行有二十句。初十自分中。謂十度純熟出障故。淨謂初施\n即無不捨。二戒即無毀犯等。皆明清淨相也。前\n> 六可知。七巧成諸行\n故是方便也。八大願堅誓尊重如山。此同下尊重行。九由思擇力修習\n力說法除熱。如世涼池。十智度攝生令\n> 同佛法。後勝進中。以後過前\n故云轉勝。十中。初三宿成行。次三依緣行。後四悲智行。前中。一\n內有實德外感佛念。二由依護\n> 念更增勝善。三能同佛八相現麁隱細名\n密方便。又了達如來玄密之義。如王髻中珠等。又善解權密之教等故\n名安住也。次依緣中\n> 。一近善友謂身親近心依附。二依善友起正行。\n三生正解。謂攬別成總故非總。分總成別故非別\n> 。全奪俱盡雙融無\n礙。是故緣起俱非總別。後悲智行中。先一大悲。後三大智。於中。\n一實智。後二巧智。一成因巧。二向果巧\n> 第五答大願滿有二十句。初\n自分中所求皆得名願滿。一忍惱攝生。二嚴土為物。三於佛興供。四\n於法守護。通論護法有四重。一\n> 護理法。謂照理不雜無明等。二護行\n法。謂行不雜名利懈怠等。三護教法。謂如法說授廣宣流布等。四護\n果用法。謂存護形像等\n> 。五令物身生淨土。六令物智入法門。七令他\n願滿。八無足修行。謂行盡未來際。令如須臾不生厭倦。又願劫隨心\n轉。九願因究\n> 竟。十願果圓淨。後勝進十中。一大誓嚴心不慮不成故\n無憂也。二仰念勝侶轉起彼願。三悉願往生者頓起諸行。四究竟等常\n起所\n> 行。上自利。五化令願滿。六常化不倦。七處苦益生。八捨樂利\n物。九授以果法。十得果平等。上利他。\n第六答得菩薩藏。初結\n> 前生後。總有十句。謂以蘊德成藏深廣無盡故\n無勝進。一見佛。二持法。即是持藏。三說法即辯藏。四悲普。五妙\n定。六勝用。\n> 七入證。八依證起通。謂以天眼見地伏藏及海中眾寶。\n并知眾寶出處價直等事。九佛加增德。十智達器界。\n第七答隨其所應而化\n> 度之。先結前生後。謂稱機授法名隨應化。於中\n三。初知根機。二教離過。三教修善。初中亦三\n> 。初知眾生病患所\n宜。二知宿習因緣。三知現在心念。二教離過中三。先一句總次九句\n別。第八由觀自他平等不起慢於他也。第\n> 九心諂曲者多為名利喧心不\n直。菩薩知其非有故心靜也。三如是下結。三教修善中。初一句總下\n十三句別顯。於中初八自分法化\n> 。後五勝進法化。前中初二於法能\n說。一觀理等而不違事別。二折事壞而不礙理存。良以理事雖復相奪\n俱盡而不礙雙存故也。又\n> 釋。分別是說。謂於平等法上雖更以異門種\n種別說而皆不失本宗故云先後無違。此是本末無礙。二說緣起法無性\n名破壞。而亦不\n> 礙緣起法界無所散滅。此是成壞無礙。已下於人能\n益。三化令生信。信除疑故歡喜也。四化令生解。解實理名入。下教\n令起行。\n> 五福行趣果。下教慧行。六破相行。七入實行。八無著行法\n皆依心。二邊俱離故云無染。下明勝進化。九教以此無二平等之念念\n\n> 敬諸佛。此近佛身。十教自學軟音而無所著。十一於他異音而無差\n別。此二學佛語業。十二學佛法教。十三具足下修佛智慧。此二\n> 學佛\n意業。下結可知。\n第八答不捨諸波羅蜜。先結前生後。此有二義。一雖常化物。而內心\n恒寂故云不捨自行。二為他行此。\n> 是故不捨自行。即是利他故云也。\n以十度中後四是第六中開出故但標六。又以後四嚴前六故云一\n> 切諸度\n具。莊嚴六於十中第二內。不倚戒以自高。又不執戒為有故令淨也。\n三中初安受苦忍。聞惡無憂等耐怨害忍。聞好無喜法\n> 思惟忍。未曾等\n雙結違。四中初勤修佛因。究竟下勤修佛果。五禪中一入定體。捨欲\n等是初禪。次第入是後三禪。此是事定入而\n> 不著故云無染。下明滅惑\n出定。是理定。下明定用起通。二超次。謂於八九次第入。及超越\n入。此是上事用。三入一知多。四漸\n> 具智德。此二是理定用。六智度\n中。初求聞慧。次所聞等下明思慧。次入真等明修慧。上是加行智。\n次妙善等辨正證智。次具足\n> 等明後得智趣佛慧。七方便中有六種方\n便。皆以悲智相導巧無住著故。云方便。一悲示威儀。智離愛見。二\n悲現身。智無染。三\n> 悲外示童。智內具黠。四悲現縛脫。智巧不取。\n五悲智現嚴。六悲能入趣。智了所行。八願中有十。一一皆願盡彼原\n際。各云究\n> 竟。初化眾生願。二淨佛土願。三供養佛願。四攝智慧\n願。五修法界行。六大志願。謂以志力修上行時盡來劫住謂若須臾。\n七修\n> 促願。謂願以長劫為促。上句但轉能見之心。此迴所住之劫。是\n故上句有住字此無也。八成壞願。謂願解達世界成壞。一緣集成不\n> 作\n壞。二劫初成劫未壞。皆願了達。九現淨土願。十成正覺願。九力度\n中有十義皆有堪能。不可屈伏故名力也。一一各初標名後\n> 釋義。初中\n釋。內離煩惱等是離過也。具淨等是成德也。此二成自行故名自專\n正。二釋中。謂\n> 以勝力正理他時無能壞者故也。此二總舉利他。三拔\n苦心滿。四與樂心齊悉能覆護一切。是力義也。此二利他心。五持力\n內蘊法\n> 義。六辨力外宜應機。此二利他德。七大行具嚴力。八弘願不\n斷力。九因力多出。十果力普覆。十智度中。謂識病了根稱理授法故\n>\n云智。亦有十句。於中初四知病輕重。次三知根欲。謂一知病者學\n位。二知其心中串習所行。即根行也。三知欲樂悕望。次三知\n> 法藥。\n初知境法。二知智法。三知境智無礙無邊法門。故云法界。\n第九答所請眾生皆能度脫中三。先結前生後。二教化一切下十\n> 句正顯\n度脫。於中初一化出惡道。謂初句修善因後出苦果。二化出眾難。謂\n精進修出因。超難出八難果。次三教治三毒。但貪欲\n> 有二種。一貪色\n教不淨觀。二貪財教離欲觀。嗔亦二種。一嗔有情教慈心觀。二嗔無\n情教平等觀。以不稱意無情物與稱意物無二\n> 故云平等。愚癡亦二種。\n一頑無知教界分別觀。二邪見愚癡教因緣觀。以諸法從因緣生非自在\n等作故也。又以不信因果故教因緣\n> 觀也。次三教化令出三界。初教離\n欲恚等。捨欲界至初禪等。二教增上觀。捨色界增上至無色處。三教\n細微智。以照察細想令斷\n> 盡。證空超出三界。次二句化令入三乘中\n三。乘初教寂靜行有三義。一以彼二乘修離生死喧雜行\n> 故。二令修證\n入人空寂靜行故。三無餘涅槃名寂靜。修彼名行。二教以十力等。是\n超過凡小嚴顯大乘。三下釋所請度義。謂如初\n> 發心舉其本願。指本曰\n如。見生墮惡舉願所為。大師子吼舉其願辭。誓言決定名師子吼。知\n病法濟正顯願相。此中文意顯從初發\n> 心見眾生苦故以決定言請取一切\n眾生誓悉度之。具足下結意可知。\n第十答興隆三寶中三。初標。次釋。後結。釋中初九別後一總\n> 。別中\n九句為三重。有釋云。初約教道。次約證道。後約不住道。今更釋。\n謂初中後分三也。且約佛寶。初教發菩提心。次已發\n> 菩提願者讚彼大\n願令不退轉。三令依願起行使佛因圓故云下佛種等。因圓果發名生正\n覺牙。是故始終相繼令佛寶不斷。二約法寶\n> 者。初示深教法。次釋理\n法。三護持等明行法。又釋。初總示深法。次以法深難解故須解釋令\n解法流行。三法既行已即加守護不\n> 顧身命。是故令斯法寶廣行不絕。\n又釋。初契經。次是對法。後是毘尼。故須嚴護。三約僧寶者。初受\n持威儀教法。是僧行方便\n> 。次行六和敬。僧行成就成行不乖曰和。行\n和相導曰敬。謂三業慈為三。同戒同施亦云同捨。同見亦云同慧。故\n有六也。後善御\n> 大眾。心無惱。是僧德已成統攝綰御。是故能令僧寶\n常存。下總結可知。此中有三寶章。如別說\n> 。\n第十一答所為境界不虛。於中初結前。從菩薩如是安住下生後。於中\n三。初總。次別。後結。總中三。初語業不空。二彼菩薩\n> 下身業不\n虛。謂所作不謬是也。三如是一切下意業。智慧迴向不虛。二別中\n三。初法。次喻。後合法中。初標。次列。後結。列\n> 中初五明自依正\n嚴。後五明法攝生嚴。前中初三三業即正報嚴。次二依報嚴。於中初\n明土離染。謂受用此土長道滅惑故也。後明\n> 土具淨德。謂常有光明故\n也。後五。一攝勝眾。二示神力令生信。三授聖教令生解。四化現成\n佛。謂涅槃者此非是圓寂之義。梵\n> 云泥畔此名化也。是此所用故應云\n化地嚴。謂是現化處故也。五量機授法。餘結可知。喻合亦可知。上\n來答初問竟。\n第二答行\n> 所成德中有二十句。初滅愚癡是牒前問。具智慧故是答也。\n下諸句皆先舉問後顯答。二慈悲答降魔問。三慧功德力答制外道問。\n\n> 四入金剛定除心習垢答離塵垢問。上來離過行也。五於先佛所等答具\n足成一切德問。六淨慧滿足答能離惡道等問。上六總是行修具\n> 足。七\n次第方便智慧力答諸地等六種名眾德圓備。一地。二度。三定。四\n通。五明。六無畏。上來因圓。八白淨法力答佛依正三\n> 業之問。九智\n慧分別速解諸法等答得佛十力等問。前句明依正相好果。此句明功德\n差別果。此\n> 二總明果滿也。上來總是自利門竟。十願力神力智力答隨\n其佛剎問。十一隨應受化等答隨成就眾生等問。十二菩薩如是修行等\n答\n> 修行成佛問。十三於無量剎等答護持法藏問。十四成就四辯等答分\n別廣說問。十五於大眾中無所畏等是牒問。具足增上般若是答魔\n> 不能\n壞問。十六次第分別等答攝持正法無窮盡問。十七具足大悲下答於一\n切世界悉能演說問。十八十王敬護略無答文。又此是行\n> 果故無答。又\n除佛無過等亦是通答耳。問十地滿後受職菩薩方云唯除如來餘無能\n過。何故此中位是地前十住之處即有此言。答此\n> 是圓教普賢位相陀羅\n尼法。是故一位成滿之處即攝一切諸位皆盡。如下海幢比丘頂上佛說\n法處十住滿後即補處成佛更不言入十行\n> 等者同此說。此據初位為言。\n如下小相品中從地獄出即到十地無生忍後位至離垢三昧前等者。彼據\n終位而說。中間二答位準可知\n> 矣。十九一切世間恭敬等亦無答。同行\n果故。亦可同在後門內通。二十佛子下答得善根力增長白法等問。於\n中初總舉後釋成。前\n> 中初身業勝利。次以慈心下意業勝。後具足辯才\n下語業勝。下釋中有十一句。初六成自分因德。一成證智淨。二如證\n而巧說。三\n> 於教能念持。四如念能巧說。五於已得法能記持。六於未\n得法能推求。後五成勝進果德。一得佛外力用。二得佛內實智。三得\n<\n佛巧說智。四正說深法。五成佛勝智。謂具理量及菩薩願智等也。\n第二偈頌中有二十偈。初十三頌\n> 前初段十一種行法。後有七偈頌後十\n八種行所成德。前中初四偈頌初二段。謂初一偈半頌所修轉勝。謂名\n初發心住為初地也。已\n> 得發心功德之藏故云長養也。次句頌滅放逸。\n次句頌離癡闇。次二句頌菩提心不忘等。下二句頌如來歡喜。次一偈\n重頌修勝。初\n> 三句頌不退轉。下一句頌離在家出家凡夫。餘略不頌。\n後一偈重頌佛喜可知。次有二偈。頌次三段。謂初五句超頌第四清淨\n之行\n> 。次具足諸地一句却頌第三所住。\n功德下半頌第五大願成滿。次半頌第六得菩薩藏。次一偈半頌第七隨\n其所應而化度之。次一偈\n> 頌第八不捨諸波羅蜜。次一頌第九隨所請眾\n生皆悉度脫。次一頌第十興隆三寶。次二頌菩薩所為不虛。自下七偈\n頌行所成德。於\n> 中初一偈半頌十八句中初九句因圓果滿文也。次二偈\n半頌護持正法及廣說等。次三偈頌第十八三業利益文。謂頌上於大眾\n中安諦\n> 威猛堅固甚深說法除惑故也。下明所說契理故如來隨喜所說合\n機故大眾奉行。此上第三會竟。\n華嚴經探玄記卷第五\n華嚴經探玄記卷第六\n(盡此第四會)\n魏國西寺沙門法藏述\n佛\n\n### 5.3 智俨《搜玄记》（T1732）——本品**有文**〔现存残卷覆盖〕\n\n智俨疏窗 @39308–40735·长 **1,427**。异于第十七品〔缺口〕——本品搜玄记现存有科：辨名二门（約教·約行）·来意「用前行德更修，與後地為方便故也」·释文随文辨三番行成。\n\n智俨窗口 T1732·NFKD @39308-40735·len=1427·**本品现存残卷覆盖**（异于第十七品〔缺口〕）·辨名二门（約教·約行）·来意「用前行德更修，與後地為方便故也」：\n\n> 明法品第十四\n四門同上。\n一辨名。言明法者有二。一約教。阿含法照理現故名明。法即義也。\n二約行。由行增勝後位相現故。\n> 即用前位法義解行等為明。用後位教\n義等為法也。\n二來意。所以興者。用前行德更修。與後地為方便故也。\n三即行教法義等為\n> 此品宗。\n四辨文者。所以精進問者。若不精進行不能受此勝進法也。所以法慧\n菩薩答者稱法之慧能申此教故。文有三。初問。次\n> 答。三末後少長行\n略結流通也。問文有二。初問。次重頌。初文有三。初先牒前住位中\n行德為生後次第。次彼菩薩云何修習下正\n> 問勝進中先際行德。初牒文\n有六句可知。次問勝進先際文有十一句分四。初六自利。次隨其下三\n\n> 利他行。次興隆下一住持建立。次一成事不虛。第三勝進中後際利他\n分法有二。初總次別。別文有三。初明成熟德。此文有二。初\n> 自利成\n熟行德。二具足佛剎下利他成熟眾生行法。初自利分有四句。一離\n障。二成體。三成德。四成用也。二利他中有三。謂體\n> 德用。體有十\n二事。准此可解耳。第二天王下明眷屬行法有四可知。三得善根力下\n辨自他德滿成就不虛義有四句也。第二重誦文\n> 有二。初生起。次偈\n頌。偈有二十二偈。初四頌前牒前初發心菩薩前住位中所進德文。次\n云何下七頌第二彼菩薩下正問勝進中先\n> 際正行。次人雄下十一頌善哉\n下後際果德利他文。就第二云何下先際自分中。初有三偈頌上自利六\n句。次二頌利他行中三句。次\n> 一頌建立文。次一頌果行成就不虛。第\n二答中有二。先長行。後偈頌。初文有三。初歎所問今時多益。有三\n可知。二勅聽許說。\n> 三佛子此菩薩下正答。答文有二。初答勝進中先\n際自分正行。二菩薩摩訶薩若得成就下答上勝進中後際果行。初文有\n一百七十句\n> 。亦可百八十句耳有四。初一百一十答上十一句中初六句\n自利行。次四十答利他行三句。次十答住持建立。次十答成事不虛。\n答\n> 自利文中。初一百答前五行。後十答第六行。答前五文中。一一皆\n二十句答之。二十內前十自行相應法。次十勝進修行法。云具足\n> 淨慧\n等者。牒前自利行生起後利他。令勢相連也。諸十文各有四。初生\n起。次問。三答。四結。\n> 亦有不定者。可准思之。利他前問有三。此\n答中有四十。亦可五十句。此初二十答三中初句。次不捨諸波羅蜜十\n句答前第二句。\n> 次佛子下十答前第三句。前二十句亦可三十句也。初\n五知器所宜。次十應諸病授藥。次十五應器與法。言能如是行者則興\n隆三寶\n> 者有十答第十句內住持建立。此中有二。初總次別。此別文中\n分四。前三別。第四總。前三文初依教道。次依證道。後依不住道。\n>\n六和敬者。身口意業及見戒施同也。菩薩如是不斷三寶下有十句。答\n上自分行第十一句行成事不虛有三。初十辨行成事不虛。次\n> 第答前五\n句。二有十以德自嚴。即答前不虛句。三有十以自嚴故能攝化不虛。\n亦同答一句。於中法喻合三文。次若得成就下第二\n> 答後際果德行中有\n三。初菩薩摩訶薩下答前滅除癡闇果熟德行法。此文有二。初辨自成\n熟行。二次第方便下明利生行耳。二於大\n> 眾中下辨眷屬行。三成就如\n是勝妙法下辨行成不虛。唯除如來者以下過上也。第三行不虛文有\n三。初立。次責。三答。答中有十\n> 一句。前六因。後果行。第二重頌\n有二。初長行生起。二正頌偈。勝進中有二十偈有二。初十三頌先際\n緣起。次七頌上答中勝分\n> 果德自分行法。前中初六半頌自利行。次三\n半頌利他。次一頌住持建立。下二頌成事不虛。後七中初一半自利果\n及利他果。次三半頌眷屬行。下二頌行成不虛也。\n第四會佛昇\n\n### 5.4 慧苑《续华严略疏刊定记》（X0221）段\n\n慧苑疏窗 @195786–209850·长 **14,064**（本品诸家中最长·含「品第十八之餘」段）。按梵本五翻·引《摄大乘》五说·四门科判。\n\n慧苑窗口 X0221·NFKD @195786-209850·len=14064（本品诸家最长·含「品第十八之餘」段）·按梵本五翻（達摩阿嚕迦娜忙鉢里勿多）·引《摄大乘》五说：\n\n> 明法品第十八\n將釋此品。四門同前。\n初中二。先得名。後釋名。前中按梵本云。達摩阿嚕迦娜忙鉢里勿\n多。達摩法也。阿嚕迦\n> 光明。娜忙名也。鉢里勿多品也。名品相逼。\n隨方語如經前第一記卷初說也。然總云法光。依攝大乘。略敘五說。\n一依無著。總\n> 相釋云。法光明者謂大法光故。二世親釋云。於名句文\n身。能緣之心。分明記故。名法光明。此約明記教文。三無性釋云。\n顯照\n> 行故名法光明。如善誦習文字光明。此據智用。明照行法。四梁\n攝論云。以能照智名光明。此論雖亦世親同本。或西域自有廣略別\n> 行\n故。此異爾。前約心緣教分明記憶。後約能照教智。五有釋云。後得\n所知所現相分名法光明。此釋菩薩後得智能照能現二教法\n> 故。名法光\n明。謂照佛說本質教故。自識顯現影像故。今此品各望前諸說。雖各\n無違。契理符文。無性梁論二釋稍現。所以者何\n> 。以此勝進趣十行\n故。行要賴智明照教故。故問中云。彼諸菩薩。於佛教中云何修習。\n令諸如\n> 來皆生歡喜。\n後釋名者。若依無性。則法是行法。明是能顯照心。謂於教明解。則\n今所脩行三輪淨稱法性。此即光明之行法。依\n> 主釋也。若依梁論。約\n智用。通於教行。亦皆依主也。\n二來意者。前明十住自分行之勝德。今辨十住趣後方便。故來也。\n三宗\n> 趣者。以修習勝進趣後方便為宗。務成後位為趣。\n第四釋文中三。初請說分。二爾時法慧下正說分。三時法慧下結說\n分。\n初中\n> 二。先長行。後偈頌。前中二。初牒前自分行。復彼諸下問後勝\n進行。前中二。初經家據能所問人。後菩薩下正牒前品所說。前中\n> 進\n慧問者。表問勝進行教。法慧答者。表說行法慧光明故。牒中七句。\n初一總舉前初發心成無量德。後六別辨。一大誓嚴心。二\n> 乘無碍法界\n智乘。三得位不退。四無生解成多背生滅蘊熏無生蘊種。五生佛種\n己\n分同佛體此即攝受。六既體分同佛則定當圓滿\n> 。\n二問勝進中二。先問所疑。後一切菩薩下請說。前中二。先問所成行\n體。後復次下問行所成\n> 德。前中二。初十句別問。後佛子下結請。前\n中。初云彼諸菩薩者。牒前初發心菩薩也。云何脩習者。問令諸佛憙\n能求前德之所\n> 因。據後答意。由住不放逸等故令佛憙。即後由此成前\n品中所說功德。餘准應知。問其云何脩習。豈非別是一句。下答中不\n放逸\n> 是耶。\n答不然。若不放逸獨是修習。下諸十十句應皆非修習。何故文云復有\n十法令佛歡憙。有十種法。令諸菩薩速入地等。皆此\n> 說邪。二由巧成\n福慧速入十地。三由十度令所行淨。四由成就眾生無厭願滿。五由願\n滿得普見佛等廣無盡藏。六由得無盡藏福具\n> 悉淨能隨應說法。七由說\n法利生時自增義利故。不捨諸度具嚴淨十度行。八由不捨諸度。住大\n願乘。隨所念眾生。令增淨業。出\n> 使解脫。准梵本中。隨彼諸菩薩者\n皆為說法令解脫。九由菩薩說種種法度眾生智故。令三寶不斷。十由\n紹三寶故。所行無生與方\n> 便慧相應。皆迴向菩提。無空過者。並如下\n答中具顯。後結請中二。先結。後請。謂先結前所問何方便得。後請\n隨問垂哀宣說。\n>\n二問行所成德中三。初問行成因德。二及餘無量下結因成果德。三於\n諸如來下守護正法德。初\n> 中准下答中。麤相分為十二句。云如諸菩薩\n等十一字。貫通諸句。言滅除等者。此有兩釋。一云問斷迷理迷事二\n種愚故。一云問\n> 斷見脩惑障故。二問降魔故。三問制異道故。四問究\n竟道所斷微細垢障故。五問策勵諸行所依故。六問脩淨土離諸難處\n故。七問\n> 大智境云何淨故。八問成就菩薩七法。九問菩薩莊嚴六事。\n十問知佛三種功德。十一問佛所行境。十二問三隨佛事隨樂現土隨根\n\n> 說法隨時說法。並具如下說。二結因果成論中有二。先結因。後疾與\n下成果。前中心結前所說成滿。不可更一一說故。總結云。諸\n> 行諸道\n諸境界皆滿諸行是助是菩提心是正道境界是所變。後成果者。由因滿\n故。疾與果齊也。三守護正法中二。先明守護行。後\n> 於一切下明守護\n益。前中三。一開演守護。二摧敵守護。三令久守護。並顯可知。二\n守護利益中七。一王守護。二世間敬善。三\n> 諸佛護念與灌頂。勘梵本\n云。一切如來共所護念。同灌其頂。四菩薩愛敬。五長無漏善。六能\n演深法。七持法自嚴。並顯可知。\n> 後請說中云所行次第請依問說故。\n二偈頌中十一頌分四。初一歡說者復。次一頌前所說。次三半頌前十\n一句所脩之行。後五半頌\n> 前行所成德。於中。初三半頌前十二句因德\n究竟。後二頌前守護利益。於中。前五句頌三守護。後三句頌利益中\n菩薩愛敬得善根長自法。餘略不頌。\n第二大段正說分中二。先長行及偈頌。前中二。先歎問許說。後佛子\n菩薩\n> 下正答所問。前中二。先歎問。後諦聽下許說。前中二。先讚問\n所為。後佛子下讚問者德。前中二。先讚。後問於下結問。前中云\n> 善\n哉者。所為廣大善中極故。饒益者利益也。令脩善因故。安樂者令得\n樂果故。慧利者雙顯利安故。廣釋利安。五種差別。如前\n> 淨行品記中\n引佛地論第七卷說。多所者廣故大故。哀愍等者悲憐人天。戀少妄\n樂。失真常樂。長流轉故。後結問可知。二讚問者\n> 德中五句。一住無\n所住故。云住實法。二由住此實得無功用勤故。云發大精進。三由得\n無功勤故。不可退轉。四由不退故解脫麤\n> 重所緣等縛。五由離縛無障\n無智明淨故。問同佛也。\n二許說中三。初明誡邪勤發聞思。二慧。次我今下顯對尊卑\n己\n離我慢\n\n> 故。推功於佛。\n第二正答所問中二。初答前所成行體。後佛子菩薩摩訶薩下。答後行\n所成德。前中二。先牒前起後。後佛子下正\n> 答。前中二。初云菩薩\n已\n發一切智心者。牒前問中菩薩初發一切智心也。後應離下起後。謂菩\n>\n薩既\n已\n發心自分事訖。更求後位。須起加行。加行雖有眾行。唯不放\n逸為本體。即精進無貪嗔癡故。云應癡暗等。守護之言\n> 。通無貪嗔\n也。\n二正益中依問次第答即為十段。唯頌脩習屬不放逸。\n就初段答脩習不放逸令佛歡憙行方便中。有五十句分二。\n> 前二十明令\n佛歡喜。後三十句明正令佛歡憙行。就前二十句中二。初十句正明不\n放逸行。後十句明由不放逸得清淨德。前中四。\n> 一總標。二徵數。三\n別列。四總結。初中。云各不放逸者。一釋如前。一云遠離躭著五\n欲。名不放逸。二徵數可知。三別列十句\n> 中。一三聚淨戒廣故云眾\n戒。然不放逸行持戒為本。故先舉也。二不同凡夫行故離愚。不同二\n乘行故淨菩提心。三好行真實。四\n> 進脩無怠。五設心欲退。即自策\n言。我自發心。無人勸抑。如何得退。六有兩釋。一云在家凡夫者。\n不求出離道。多造不善行。\n> 出家凡夫者。雖求出離。與有漏相應。一\n云無問在家出家。但造順流轉行。皆名凡夫。不可親近隨放逸。七所\n脩行唯迴向菩提。\n> 八脩大離小行。九修善相續。十常自觀量力而行。\n不令過分。四總結可知。\n後明由住不放逸得\n> 十清淨德中四。一牒前知後。二徵可知。三列中。\n一言行相應。二憶識宿念故。三住深等持。四求法無倦。為成聞慧。\n五隨同觀\n> 察為成思慧。六依定為成修慧及通。七捨勝劣等見。八利物\n無漏。九敬菩提心。如下文說。彌伽聞善財\n已\n發菩提心。遽即下座\n> 。\n五體投地。敬禮善財。散華供養等。十恭事師友。四結可知。\n第二後三十句明正令佛歡喜行中。分三。初十句結前生後。即初\n> 成行\n相。次十句中成行相。後十句終成行相。初中二。初句中云佛子至不\n放逸者。結前方便行成也。後發大下生後。並是正令佛\n> 歡喜行也。於\n中。一先由精進等。成不放逸。令後由不放逸更加勇悍故。云大精\n進。二由斂攝諸根得正念。三由心不亂勝樂現前\n> 。四由勝樂脩行不能\n已\n。五由稱理脩離著。六不以深而不動習。七證不二方便。八慈悲轉\n增。九順了無盡門法。十由前所行稱\n> 順佛心。故令喜也。\n次中成行相十句內四。一標數辨相。謂前門初成。次顯中成故。云復\n有十法。令佛歡憙。即是行成就相。二\n> 徵數可知。三別列中。一謂前\n雖發勤。若不至中或容有退。令既至此。故不退。二於求法護法。拔\n苦眾生。不惜身命。三不求財\n> 利稱名讚美亦為供養故。四會事歸理。\n謂知五蘊無性故。五普證事事無[得-彳]法界。一即一切。一切即一\n故。六有兩釋。一約四相。謂知一切法無常苦無我寂靜。莊嚴論第十\n一中。名曰法印也。優陀那菩薩藏經。名四法\n> 鄔陀南。鄔陀那此名為\n印。亦標相。如說無常是有為法標相。苦是有漏法標相。無我是一切\n法標相。涅槃寂靜是無為法標相。亦\n> 可印是決定義。謂凡諸有為決定\n無常。凡諸有漏決定有苦。凡所執我決定無我。無為理性決定寂靜。\n若廣分別。如優陀那第二善\n> 戒第七地持第八瑜伽第四十六。今此為顯\n明為等法知無常等故。得離四倒。於常等相。心無倚著。一云此中不\n但離凡夫倒。亦離\n> 二滅無常樂倒法。蘊處界等本不曾生。更有何滅。\n若見有滅則見有生。故無常等觀亦是顛倒。以此無生印。印一切法。\n決定知無\n> 性故。能觀心無所倚著。七大菩提願饒益有情願。如迴向品\n中所有諸願及初地中十大願等。八忍謂勝解。勝解與智。照達真俗。\n\n> 不二而二。二而不二。名清淨光明。九觀自善法及佛眾生。不見多少\n有異。法性善根平等有故。十無所行而行故。四結可知。\n後\n> 十句終成行相中四。一總標。由從中至終行相淳熟究竟故。云復有\n也。二徵數可知。三別列中。一勤及三善根。二照法實性。三無\n> 緣與\n樂。四無緣秡苦。五觀事行以合理。六依法性而行事。七八九十是願\n方便力智等四波羅蜜也。此上十句皆云安住者。顯行相\n> 至此淳熟不退\n故。\n第二答入菩薩所住處問者。以此觀能速得入地。於中三十句分三。初\n十句\n> 明起入地行。二後次下十句明住地觀脩。後佛子下十句明地要\n勝。初中四。標徵釋結。初二可知。三釋中十句分二。前三句自分\n\n> 行。一具資糧。二成加行。三自悟不由師。後七勝進行。一近善友為\n起行緣。二須自策。三行稱佛心。為佛攝受故。云住神力。四\n> 無解緣\n倦。五有兩釋。一云深心鑒真徹事利智照事達理。以此鑒照為自莊\n嚴。一云重脩以深厚大悲磨瑩以明利智。斯即大乘自莊\n> 嚴也。六由於\n諸地法門心不住著故。速入地也。七無性觀門。是諸佛善根方便。此\n方便體與三世佛同。四總結可知。二次十句明\n> 善安住地脩觀法。文中\n二。先十句直辨能所觀相。後悉善下逐難重顯。前中二。先一句總明\n能觀。後九句別列所觀。前中二。先\n> 明脩觀時分。謂創得入地住時。\n不可後時方順安住法故。後正標觀心。謂善觀察應是觀向。後別列九\n句中。皆云隨其者。以此一\n> 一句。通顯十地。一一地中中法門相望各\n別故。智慧各別故。乃至所得各別故。一法門者。謂隨地相得果等\n法。於佛菩薩所。聞\n>\n已\n觀察故。二甚深智慧者。謂地地中根本智故。\n三所脩因者。此有二種。一通行。謂十度四攝等。隨地有勝劣故。然\n言隨也。二別行。謂若當地淨治地行故。四所得果者。謂調柔攝報等\n地地別故。五境界者。所化眾生多\n> 少異故。六力用者。謂處非處等十\n種智力故。七示現者。謂所作及力既各不同。對彼變現故亦別也。八\n分別者。從前地轉入後故\n> 。九所得者。此通二種。一於佛菩薩所。得\n聞法故。二於地地中證說得如故。此段文。同初地中菩薩住地行故。\n彼云菩薩住於初\n> 地。應從諸佛菩薩善知識所。推求請問。此地行相及\n果。無厭足為成就。此地亦應推求請問。第二地行相及果乃至第十地\n相及得\n> 果。善知諸地障對治成壞相果。得脩地法。清淨轉行。處非處\n殊勝相不退轉淨。謂治一切菩薩地。乃至轉入如來地。由此故地行不\n>\n斷。乃至入第十地不斷。如商主預須知前路安危事云云。\n第二逐難重顯中二。先釋前善觀察。後如是知下明觀察利益。前中謂\n\n> 觀諸地法門等九句。諸法皆不離自真心所現。既不見有別體性故。云\n無著名善觀也。後益中三句。初句應安第二。第二應置第一。\n> 所以然\n者。此觀\n已\n是八地初住心故。於中。初二句牒前。後一句顯益。謂由\n智唯心理。則能於地善安住也。\n三後十句明地\n> 要勝中四。一標。謂思速入地。二何以下徵。意云。地\n有何要念遠入邪。三釋中三句。一以入地至住。則能成前隨諸地觀察\n<<\n所有功德。二以具功德故能入佛地。三至佛地故能廣作佛事。謂十身\n三業滿法界。遍十方。盡未來。\n> 重重無盡如因陀羅。世界時處中利樂\n無斷。四是故下結前思惟宜應速入五句。一常勤脩。二不息。三無\n疲。四以所脩德自嚴。五\n> 結入地。\n第三若大行清淨問中。有二十句。初十句行成出障故云清淨。後十句\n由行淨因。得勝法果。前中。一標起可知。二何下\n> 徵數。三者下別列\n十句。即是十度。一施滿足意自他俱悅。二護戒堅淨。三忍力無限。\n四勤脩無退。五伏沈不迷。伏棹不亂故。\n> 知得正念。心一境性也。六\n無分別慧。善了諸法。七善巧脩行無偏住著。八大願堅固不可動搖。\n九運生之力無有疲厭。十佛及眾\n> 生智了同體。此中初句五七各同十\n行。餘并全別不可指。復次有文。具顯十度句。佛子下總結可知。\n後十句中四。一牒前起後可\n> 知。二何下徵數。三一者下別列。一多佛\n護念他方顯多。又他方尚護自不待言。二同類中為上首。三堪受佛\n加。四所在皆逢善友\n> 為怙。如倚賴父母。五常脩行勤及三善根。六了\n有為法實性。七住無緣拔苦。八能起思慧。九能起脩慧。十知佛化物\n權實善巧。\n> 四佛子下總結。\n第四大願滿足問中二十句。初十句起勝淨願。後十勵志念溺。又前十\n起願。後\n> 十滿願。前中四同前。初二可知。三列中。一願度生無倦。\n二願具脩淨土行。三願重心事佛。四願護法不惜身命。五願隨智所觀\n\n> 淨土即能身詣其中。六願與諸菩薩。同行法性善根。互望無礙。不即\n不離。七願入定無相無願之門。以此了諸法。八願得不空三業\n> 。九無\n障[得-彳]願。徹窮未來際。利樂眾生無盡期故。又是十種如金剛大乘\n誓願中第八願也。又是十種願無[得-彳]用中\n> 第八於一切行菩薩行而大\n願不斷也。十願具生了普因。謂普賢行生因也。淨治等了因也。或行\n普賢行即是淨治。一切種智門門是\n> 方便義也。四總結可知。\n後十令願滿中文三。謂標徵列。列中初五自行。後五利他。前中。一\n行心無厭令願成滿。二大誓自嚴。\n> 三念勝\n己\n者願力所作。四普願眾生\n生淨剎。問菩薩何故自不願淨土。願他生邪。答菩薩行法。法應如\n是。所以者何。若不願\n> 他生淨土。則利他行不成。若不自願生穢土。\n則大悲行不立。五樂脩行海長時無間。後五中。一願普成熟。二為成\n熟一一眾生。\n> 各經一劫不覺疲倦。三於彼一切劫。具受三惡等苦。無\n暫厭悔。四亦不暫起貪樂之心。五勤護法護教理行果等。\n第五答護菩薩藏\n> 問中四。一結前生後。二何下徵。三所謂下別列。四\n佛子下結。初中謂由前行願蘊積成藏故。唯\n> 十句更無成滿也。二徵可\n知。三列中。一見佛。二持法。三解釋教理。四悲普。五多定。六來\n欲乞皆與。七辨無[得-彳]解。\n> 八護得五通變現緣境等業用皆無盡故。\n九住一切時。梵本中名無邊佛威神守護無盡藏。十入一切處。四結可\n知。\n第六答隨所應\n> 化常為說法中三。一菩薩得是下結前生後。謂蘊福智攝\n眾生故。二佛子菩薩下徵起。三所謂下別列。於中有三十句。分二。\n前十\n> 五句教離過。後為說法時下十五句教起行。前中二。初十四句別\n說。後菩薩下一句結隨應說。前中二。初四句明知根器。一知所作\n> 者\n宜作何事。二宿因待何緣發。三知心行念處。四知希望所好。後十句\n正明教離過。一貪雖通色等一切。今此且據麤顯色。欲對\n> 治故說不\n淨。廣說五種。如下十藏品中說。二嗔能加害。慈能與樂。正對治\n故。三癡等者。癡是邪癡。觀察是思擇。謂為彼不信\n> 由惑起業由業感\n果者。說十二因緣。令觀察故。四為說等者。謂前三句約三毒重者。\n且為說對治煩惱。未堪為說成勝智法。今此\n> 等分三毒輕故。方可為說\n無性觀等。釋多貪等分名。具如雜集第十三說。五知三界無樂則不復\n受樂生死。以人天中樂皆變異受行\n> 所隨故。六處所者有二種。一身所\n依處。即鄉邑舍宅。乃至樂著阿蘭若處。二識所依處。即所依\n> 身。於\n此二處而樂著者。皆由不了空寂之理故。此為說令不樂著。七為說怠\n惰損勤行益。八為自高陵彼者。說一切眾生蘊處界平\n> 等無異。九易\n知。十為樂事寂者說理寂法。\n後教起行十五句中亦二。先五句明說法儀軌。一文有位次。二義無差\n錯。三於前後\n> 理皆以智照。四於無性印或法殟柁南。皆審稱順。五行\n位徵著次第為說。後十句正教起行中。一令於所說行門生信。三簡知\n根性\n> 令入佛教。三令證理。四令斷法愛。由貪相應故。五令除二執。\n六令識真佛不離自心。即是常念。七令知說法聲實性。八令悟名句\n> 文\n如彩畫空九。令知法喻相應。十令悟佛果智大用。\n第七答恒不捨波羅蜜行問中二。先牒前利他行時即成自利行。後是時\n下明\n> 自利行時即成利他行。而此兩文。說雖前後。行則同時。故云菩\n薩為眾生說法。則自脩習增長義利。不捨諸度等。義利者。如前釋\n> 。\n不捨諸度者。二利行同體不相捨離。但所望異故。波羅蜜道者。度行\n通至佛果故。二行同體所望異者。即前所明。隨其所應為\n> 說法時。令\n彼益故成利他行。此即法施成自利檀行。又法施離慳。成自利戒行。\n又法施忘怨。及諦察勝解。成自利忍行。又說法\n> 無倦。成自利勤行。\n又說法之心專一法性。成自利禪行。又說法時念念思惟。思慧增長。\n成自\n> 利慧行。又說法時不住空有。隨機所宜皆善巧故。成自利方便\n行。又此說法稱十盡願。成自利願行。又此說法心是無雜染力。乃至\n>\n第十加持力等。成自利力行。又此說法智。能知所化者心行煩惱。乃\n至知佛智覺法界門。成自利智行也。後明自利行時即成利他\n> 行中。具\n顯十度。即為十段。一一段中二。先明行相。後結度名。就行相中。\n皆先約事。後約理。然事與理。說離前後。行則同\n> 時。\n就初施行相。先約事中。謂身命財法隨求即與。則無方來乞悉能滿\n意。後而無下約理。謂達三事空故無所著。後結度名。云\n> 是則能淨等\n者。謂若但事行而不會理。或但觀理而不行事。則不能淨波羅蜜故。\n下諸結名。並准此知。雖自利由說法利生即利他\n> 也。\n二戒行相。先約事云。具持眾戒者。三聚清淨無缺犯故。後而無下約\n理中。謂三輪淨故無所著。無著故我慢息。謂菩薩不以\n> 自具持戒見他\n不具陵彼自高故。持戒雖是自利。由菩薩戒要必法施方名具持眾戒\n故。此即為利他。結名准知。\n三忍行相中。先\n> 法。後喻。法中。先約事者。謂為怨惡憎嫉打罵割截\n等處。與觀善無別。等為說法。後於諸下約\n> 理者。諦察怨親平等性\n故。高為說法。初無有二。後喻中普截善惡無分別故。忍雖自利因。\n次說法則為利他。後結名可知。\n四\n> 勤行相。先約事中三。一利樂勤。謂遍策諸行。亦普勸發諸行亦普\n勸發諸有情故。二諸有下如行勤。三勇猛下被甲勤也。後於諸下\n> 約理\n者。謂於三勤所生善根。離有無相。離有故不取。離無故不捨。由此\n佛因行滿足。因行是果之門。門是方便。結名准知。\n\n> 五禪行相中十句。先科。後釋。前中四門。一三禪。二事理。三因\n果。四禪支。及初三禪者謂十句中一二三六七九是現住法樂禪。\n> 由得\n真三昧樂。不復貪著世間輕安虗妄樂也。餘亦並是正在定故。五十兩\n句。正是引生功德禪。兼饒益有情禪。現通威佛皆非為\n>\n己\n故。餘唯引\n生由定能令生多定故。令知定境故。了知不違無生印故。二事理者。\n謂十句中三九兩句約理。餘皆約事。三因\n> 果者。前九皆因。第十是\n果。四禪支者。十句中初一句及第三句內下半是對治支。第二句及第\n三句內上半是所依支。正思惟即是\n> 心一境性。不住不出。即是無生行\n相。唯遮詮故。後七句是利益支。依小乘及大乘權教八定支分名體。\n與此不同。滅受想定名同\n> 體異。或名名皆同。而對治所治依。利益並\n別。謂對治一切惑障。非唯靜慮無色等障惑。此唯約\n> 脩位所斷所知障\n說。由得滅定者。非見道故。地中不斷煩惱障故。前八亦據此人說\n故。若依融攝。位地不定。此中所依即無生定\n> 。薩遮第五亦同此說。\n對治利益如文可知。\n後釋文者。一由觀五境無無自性故。不復貪著。二依九定作無生觀。\n從初禪為首。\n> 乃至非想及滅盡定。按次入出故。云次第定。簡異逆\n順。超越為名。九定具如薩遮中說。靜慮無色四相分別。如雜集第\n九。廣顯\n> 九定。如別行章。三正思惟及不住不出等。如前可知。四從\n無生定出生多定。起信云。得此真如三昧。能生無量諸三昧門。五從\n\n> 前多定。各起多通。六出入九定逆順自在。顯淳熟。謂從初禪入二\n禪。乃至從非想入滅定。如是名順。從滅定入非想。乃至從二禪\n> 入初\n禪。如是名逆。七由無生定。入餘一等持時。即入多等持。以無生定\n是一切定根本故。八由無生定故。觀一定境時。即知一\n> 切定境。九在\n無生觀時。能緣觀智。與餘一切若事若理等持等至觀智不相違。以彼\n一切不離此故。智即是印故名智印。印定諸法\n> 本不生故。無性攝論第\n七云。靜慮定名等持。無色定名等至。又心一境相名等持。正受現前\n名等至。十由此定即是佛體故。依此\n> 所作皆稱法界。是故能令速證佛\n位。結名可知。\n六般若行相中八句。先科。後釋。前中三。一\n> 因果。謂前七脩因。後\n一成果。二理事。謂五六兩句約理。餘皆約事。三三慧謂初三成聞\n慧。次一成思慧。後四脩慧。問寧知此\n> 八句初四次二後二。非是加行\n正體後得如次邪。\n答此若具三。不應更說第十智度故。無性釋論第七云。若說十度。第\n六唯是根\n> 本智攝。若立六度。通攝三智。後釋文者。且依三慧。謂聞\n中初句內有二義。一正成聞慧。二句思為因。謂聞\n已\n記持故。前句\n> 聞\n慧勝緣。於中二。謂近及事。後句聞慧勝因。亦二。謂樂及無厭足。\n無欲樂不能聽故。暫聞則\n已\n。慧不生故。思慧中先簡\n> 非。後顯正。謂\n簡獨覺。及不隨所聞。妄思惟故。後顯正者。謂如理故。後四脩慧\n中。初兩句正是慧體。上句離妄。下句稱實。\n> 後兩句慧用。上句知佛\n行。下句入果。結名可知。\n七方便行相中十句。皆顯悲智善巧無所住著。名為方便。文中。先\n科。後釋\n> 。科有二相。一分二方便。謂四七八三句明迴向方便。餘七\n句明拔濟方便。若依本業纓絡下卷。因果亦有三方便。一進趣向果。\n\n>\n二巧會有無。三一切法不捨不受。屬當可知。二分理事別。謂四八九\n句約理。餘約事。後釋文中\n> 。一巧匠化世。如賢首品云。若見世界始\n成立。眾生未有資身具足時。菩薩為工匠。為之示現種種業。乃至廣\n說。二導利忘疲。\n> 三稱機現形。四行淨三輪。五現漏無漏行。六不住\n涅槃。七不住生死。八觀諸所作皆無作作故。云善觀。九為物現嚴。\n非自愛著\n> 。十入趣受生。結名可知。\n八願行相中十句。分二。謂三四五十等四句明求菩提願。餘之六句明\n求利他願。且依一相理實皆通。\n> 又一一皆至無餘。故云盡也。依本業\n經。願有三種。一自行。二神通。三外化願。文可知。文中。一利生\n盡願。二嚴剎盡願。三\n> 供佛盡願。四了法界盡願。五脩法界行盡願。\n六盡來際住願。七知他心盡願。八悟有支起滅盡願。九現淨土盡願。\n十證佛智盡願\n> 。此十中。前九脩因無餘。後一成果無餘。結名可知。\n九力行相中十句分三。初句思擇力。後九脩習力。依本業經。通力有\n三。\n> 謂報通力。脩通力。變化通力。文中。初二句報通力。第九句脩\n通力。第十句變化通力。或第九第十句俱通脩力變化力。加持亦通\n> 通\n報力所攝。餘句或是三力因緣。或三力所起。准知。十中。一觀心淨\n明徹見法性曰深。離有無見云無雜染。二信心徹理曰深。\n> 深故邪師教\n不能伏。三不見有拔苦而拔。故無疲厭。四不見有與樂而與故。所行\n平等。五義持\n> 無忘。六巧說稱機。故令歡喜。七三輪離相三空圓滿。\n唯顯了教故嚴大乘。八無障[得-彳]願。徹窮來際利樂無斷。九神力具\n\n> 故出多變現。十聞教不信不解不受者。神力加持令信解領受。結名可\n知。\n十智行相中十句分四。初七知眾生心行。此成就有情智\n> 也。次一句知\n諸法實性。此受用法樂智也。次一句知佛能隨化力。此成就有情智。\n後一句菩薩自悟法界智。此受用法樂智。依本\n> 業經。智三種。一無明\n智。二一切種智。三變化智。十句中。初四句是無明智。三毒中無明\n為本。智知三毒。智從本為名故。餘\n> 皆一切種智。或第五句是變化智\n若廣分別十波羅蜜。如別行章。\n第八答所念眾生滅令得度問中三。一結前起後。二墮惡下正明化\n> 度。\n三如其下總結。初中二。前三句結前。後住大下起後。前中三句。各\n通牒前十度。初云清淨者。謂脩前十度時。皆淨三輪。\n> 離有無相故。\n並結名中云。是則能淨等也。二圓滿者。謂脩前十度時。皆二利圓滿\n故。包融圓滿故。十度圓滿故。因終圓故。三\n> 不捨者。謂脩前十度行\n時。如救頭然。曾無暫捨故。後起後者。謂今隨昔日創發大心。請一\n切\n> 眾生誓常度脫。故云經大莊嚴乃至云而得度脫等。言住者。正住在\n脩行也。大莊嚴者。大誓願也。菩薩乘者。悲願相應運生也。隨\n> 所\n者。順昔願心所欲度生。皆為說法令解脫也。念授隣近同在別境。理\n實是欲希望度彼。亦可隨昔願心所請度者。明記不忘故云\n> 念也。梵本\n中云。於菩薩乘。住大莊嚴。隨所請眾生。成為開示。使集諸善根皆\n令出離。\n二正明化度中十句分四。初二說離苦\n> 難法。謂為將墮苦趣常生難者。\n語令知。使懺悔。若不爾者。純苦趣中。無暇聞法發心故。若隨值菩\n薩。聞法能勤。非難中故。\n> 或現墮苦發心。在難能勤。所以者何。除\n無間獄。餘容有故聞法。後答難中有故。次三說離增上三毒法。謂於\n劣境起增上煩惱故\n> 云多也。初云示無貪法者。謂說不淨觀故。說無生\n觀故。二令行平等者。謂說違順境性無二故。三為說緣起者。謂說十\n二有支相\n> 緣故起。即顯流轉。非自然勝性等起相緣故不起。即顯還滅\n不待緣滅。性自滅故。由此令離斷常等見著。次三說三界出離法。初\n\n> 教離欲者。謂欲界愛恚。及因愛恚所起十惡。教以尋伺對治故。得離\n欲界。或說所治無恚或說有五。謂一貪尋恚尋害。二憂。三苦\n> 。四犯\n戒。五散亂。二為說毗鉢舍那者。此有二種。一者靜慮。雖定慧均。\n然是定地。恐其滯\n> 寂。但為說觀令離色界。二者由彼未聞無生觀慧。\n依有漏定。麤治過患。狹麤利益故。此為說無生觀慧。令知惑源。得\n究竟益。\n> 永離色界。三為說妙慧者。此亦二種。一者以彼無色定多慧\n少。恐其滯寂。說慧令均。使離無色。二者妙慧。是無生慧。謂彼所\n\n> 持取相細根。令出離故。後二隨乘根性。方便為說初教。二乘寂靜行\n者。此有二種。一者隨彼小根。說遠離行故。二者因彼樂乘方\n> 便。為\n說一切諸法本來寂靜不生不滅。後為樂大說十力廣嚴者。此亦二種。\n一為權大乘根樂三身佛十力境界者。乘方便為說十身\n> 佛十種大力那羅\n延等廣大佛事。引令入實。二為樂實大乘根。直為說佛十種大力廣大\n莊嚴。令得增進。\n三總結中二。初結本誓\n> 願。後菩薩具足下。結問中度脫。此中准梵\n本。一切眾生下脫一句。云是名住大莊嚴。餘並同也。\n第九答前紹三寶種使不斷絕問\n> 。謂菩薩有知根知法巧化之慧。令所化\n者成聞熏種。生正覺牙。成佛說法。度諸眾生。成菩薩聲聞僧。由此\n能令三寶不斷。就此\n> 文中三。先牒前起後。二何下徵。三菩薩下釋。\n初中牒前菩薩有知根識法巧化之慧亦即是後徵釋之處。二徵意云。菩\n薩但能說法\n> 度生。何以能令三寶種不斷邪。三釋中。明四重三寶種不\n斷相。於中。前三別辨。後一總顯。就\n> 前別中。初三寶內佛寶。云教\n諸眾生等者。謂菩提心是佛體故。此有二義。一者菩薩自\n己\n發心得佛\n體故。續前不斷。復更教\n> 他發心。令得佛體。胤後不斷。後後皆爾。\n為不斷也。二者諸佛無師無[得-彳]智。具在眾生心中。眾生不覺。菩\n薩教發大心\n> 。則佛智顯現。後後皆爾。為不斷也。法寶。云常為等\n者。謂菩薩。自於佛菩薩。聞正教理。今復為開闡教理。如是展轉。\n後後\n> 相續。為不斷也。僧寶。云善持等者。謂菩薩自持教。無違事\n理。教他亦爾無乖違。是和合也。次三寶內。佛寶。云悉能等者。二\n>\n種。一謂無障[得-彳]願。徹窮來際。利樂不斷。不同二乘趣無餘依究\n竟永滅。讚發此願故。二謂求菩提饒益有情願。謂菩薩\n> 行海皆應以願\n迴向眾生成大菩提。讚發此願。則種性成故。法寶云分別等者。謂此\n菩薩自聞因緣無生方便。而得證悟。今復為他\n> 說其無生證悟方便故。\n僧寶云常勤等者。謂於菩薩眾中。三業互敬。戒見施同。由此成佛。\n當還有僧故。後三寶內。佛寶。云於\n> 眾生等者。謂佛昔聞教等流無流\n熏種成佛。佛令菩薩於佛熏種亦爾。今便為他。無倒宣說。令人眾生\n心田成佛可之種故。法寶云\n> 護持等者。初句通護三法不斷。謂證理為\n護理法。持教為護教法。脩行為護行法。若兼下句。則唯教行以護教\n行。容有身命之難\n> 故。由佛證理。得成教化化菩薩。菩薩證理成佛教\n化眾生。亦令證教行展轉不斷亦爾。僧寶云統\n> 理等者。謂菩薩自依一\n味之法。後以此法。攝仰大眾。令皆隨順。為和合不斷。上來別辨竟\n後總顯中。持三世佛戒者。謂由戒得\n> 佛。由佛有法僧故。菩薩前後亦\n如是。故不斷也。\n第十答善根方便皆悉不虗問中四。一明由紹三寶種故三業無暇。二無\n暇故下\n> 明由無暇得不空三業。三菩薩如是下明三業不空自利相。四若\n有眾生下明不空利他相。初中二。先結前。紹三寶種。後一切下生\n\n> 後。生後中二。先標所行無失。後隨有下釋無失所由。可知。二明得\n不空三業中二。初牒前。後所作下起後。起後中三。初明所行\n> 無謬。\n二皆與下釋無謬所因。三末一句結成不空。三明三業不空自利相中\n四。初牒前標後。二何下徵。可知。三所謂下依標釋十\n> 中。初四依正\n嚴謂三業及土。於中。前二後一利他故現。現身說法嚴土攝生故。第\n三一向自心定故。次四句明攝化嚴。一放光警\n> 覺。二攝眾集會。三現\n通令信。四授法令解。後二現佛說法嚴。四菩薩成就下結不空自利\n相。四明不空利他相中。有法喻合三。\n> 法中見聞等。略舉十事。餘並\n可知。上來答所成之行問竟。\n第二大段答行所成德問中三。初明心行成因德。二佛子下明結因成果\n>\n德。三於無邊世界下明護持正法德。\n初中十二句一一內有二。皆先釋後牒。准法應合。先牒後\n> 釋。文雖左\n右。於義無違。如云摧魔以慈。或曰以慈摧魔。就初句中。勤加脩習\n四字。冠下諸句。謂牒問云勤加脩習何法。以滅\n> 癡闇。乃至勤加脩習\n何法。隨所應等。釋云。勤加脩習。以智慧明。滅諸癡闇。乃至云以\n往昔誓願力。隨所應化。現淨土。轉法\n> 輪。度眾生。所謂初發大心\n時。即發此大悲無障[得-彳]願。此即便顯初後二句竟。二云摧魔以慈\n者。自心先能調他故。三制\n> 外以福慧者。智以理制。福以威制故。四\n滅心垢惑以金剛定者。無間道時。煩惱所知二障種永斷無餘。五集善\n以進者。精進遍策\n> 眾善行故。六以淨土善離惡道諸難者。淨土業成自\n無三惡八難故。七以無著慧淨智境者。心離執著。智障淨故。八以方\n便智出生\n> 菩薩諸地等者。方便智有二種。一種一加行位智。為十地方\n便。能生十地故。二善巧方便智。此通資粮及十信智。於真俗二諦。\n\n> 巧鎔融故。依此智慧。出生七法。及令清淨。准前問中。此脫總持令\n清淨者。治謂其障使純淨故。九以一切善法成滿諸佛淨土等者\n> 。謂佛\n依正報因遍脩眾善。維摩佛國品云。六度四攝四無量道品十善等。皆\n是淨土故。方便品云。佛身者即法身也。乃至云從斷\n> 一切不善法集一\n切善法生。此句內有六法莊嚴。謂淨土相好三業。十以智自在觀知佛\n十力四無\n> 畏十八不共平等者。此有二種。一謂觀一切佛力等知無差\n別。二觀知同一法性。然此二義。融無障礙。十一以廣大智知一切智\n之\n> 境界者。謂菩薩以照理事無[得-彳]智知佛後得智也。十二如前釋。\n二明答結因成果德問中。無別行相。但依前十二句行相。勤\n> 加脩習。\n即能次第成就無量功德法。乃至疾與佛功德等故。牒前云菩薩勤修此\n法次第成就等也。按前問中有三句。今此答中有兩\n> 句。由來問中初二\n句為一句故也。\n三若護持正法問中二。先別說。後成就三世一切如來智下。總結成法\n師說法護持。前中三。\n> 初正答前問。次何下徵。後佛子釋。初中答前\n十問。即為十段。一答前於諸如來應正等覺百千阿僧祇劫修菩薩行所\n集法藏守護問\n> 中三。一守護處。謂無邊世界□二能守護者。謂為大法\n師。三所守護法。謂諸佛正法。二答前開示演說時諸魔外道不能阻壞\n問。\n> 謂得一切佛護念故。三答前攝持正法無窮盡問。於中。出所因。\n一內持廣大法藏。二外說無[得-彳]。四答前於一切世界演說法\n> 時十王\n守護問。於中二。先明得三種三業。後得心下明十自在。由法王守護\n故。得三三業。十種自在由得此故。九王守護三三業\n> 。有第一善巧三\n業。身業巧隨類現。語業三種。一義無碍辨巧說深理。二法無碍辨。\n巧布教相\n> 。三由前二二巧令聞者獲益。第二攝根三業。意業知機。語\n業二句。一圓淨。二令喜。第三無勝三業。身業威力。意業知機。語\n\n> 業無碍。後十自在中。一一皆有標名釋義。相顯可知。由法王守護\n故。得此三三勝三業及十自在。即由得此。諸王守護。或由得此\n> 。感\n十王守護。令無退失。轉增最高也。五入前一切世間恭敬供養問。謂\n菩薩。更演說大法。得人天敬養故。六答前諸佛護念同\n> 灌頂問。謂得\n諸佛護諸佛灌頂。由得灌頂。得無見頂相。由佛護念。得身業威德無\n能映蔽。語業威德無能屈辨。七答前一切菩薩\n> 亦皆愛敬問。由菩薩得\n前十種自在。處大眾中。威德蔽眾。以大慈悲。安怯弱故。一切菩薩\n敬愛也。八答前得善根力增長白法問\n> 。□以深智慧察其欲樂也。九答\n前開闡諸佛甚深法藏問。謂以無畏辨。為其說法故。十答前能令一切\n聞法生喜問。謂攝持正法。\n> 以自莊嚴。釋曰。菩薩利他為自利故。是\n莊嚴也。上來總顯差問竟。次徵意云。此菩薩位居十住。何以乃得如\n是三業十自在邪。\n> 釋意云。以成就十種德故。一智圓德。二擇法德。\n三不忘德。四無住慧德。五總持德。六大心德。七無失辨德。八勝解\n德。九遍\n> 法界會中恒輔翼德。十了自與佛同體德。\n第二總結成中二。先結能成因。後作大下結所成德。前\n> 中二。初明成\n果智圓。後一切菩薩下成因智□因是果因也。後結所成德中三。一法\n師是能護持。二正法是所護持。三總結前二也\n> 。第二重頌分中。十頌\n分二。初六頌半。頌前十種所成之行。後令其下三頌半。頌前行所成\n德。前中初半頌。頌初不放逸。二有\n> 一頌半。頌佛歡喜。三有一頌。\n頌入諸地及大行大願。四有一頌。頌菩薩藏及隨所化說法。五有一\n頌。頌不捨自行諸度及所念眾\n> 生令得度。六半頌。頌紹三寶種。七有\n一頌。頌善根方便皆不虗。二頌行所成德中。初一頌。頌初兩段。謂\n行成因德。及因成果\n> 德。次有一頌半。頌護轉正法。後有一頌。喻說\n法者說法三業無畏辨等。謂一身儀庠序。二樹說雄猛。三智了深度。\n□為□動。\n> 問答物滅惑。\n第三結說分中。所說契理。令佛歡喜。所說合機。大眾奉行。亦可契\n理合機佛憙眾奉□□。□先長行。後偈頌。兩\n> 段不同。說分了。上來初\n請。次說。三結。□□不同。釋文了。上來初辨名。次來意。次宗\n趣。後釋文四門□□法亦了。上來初\n> 明昇須彌頂品乃至明法品了。六\n品□□□□。明第三會竟。\n續華嚴略疏刊定記第五\n卍按。六\n> 七兩卷隱沒。而無傳者。應有第四會夜摩天。說十行位四\n品。\n\n### 5.5 李通玄《新华严经论》（T1739）段\n\n通玄疏窗 @202602–207937·长 **5,335**。三门分别·「第一令前五品之法其心更明。第二令後所行之法轉勝明白」立义。\n\n通玄窗口 T1739·NFKD @202602-207937·len=5335·三门分别（释品名目·释品来意·随文释义）·「第一令前五品之法其心更明。第二令後所行之法轉勝明白」立义：\n\n> 明法品第十八\n將釋此品。約作三門分別。一釋品名目。二釋品來意。三隨文釋義。\n一釋品名目者。此品為明前之昇須彌頂品偈讚\n> 品十住品梵行品初發心\n功德品五品法門已。發菩提之心得廣大功德。此精進慧所問之法有二\n義。第一令前五品之法其心更明。第\n> 二令後所行之法轉勝明白。故云\n明法品。為明昇進前後法故。是精進慧菩薩啟請法慧菩薩言。所有大\n願悉使滿足。獲諸菩薩廣大\n> 之藏。此明前所得法使令更明後之昇進使\n令明白。是修十行之向。長養本位十住之法。\n二釋品來意及名目如前。\n三隨文釋義。\n> 分之為二。一長科經意。二隨文解義。第一長科經意\n者。約科為三段。第一初爾時已下。長行有三十三行半經。通偈頌有\n五十五\n> 行。明精進慧菩薩請法分。第二爾時法慧菩薩已下。有六行\n經。明法慧菩薩許說分。第三佛子菩\n> 薩摩訶薩已下。直至品末通偈\n頌。總明正說法分。從初第一請法分中。義分為二。一科此一段經之\n文意。二隨文解義。第一科此\n> 一段經文意者。約科為三段。第一爾時\n已下。至復次有十二行經。明精進慧菩薩初起請法門分。第二如諸菩\n薩已下。至菩薩所行\n> 次第願皆演說有二十一行經。明精進慧菩薩并舉\n當位應所修行之行及獲益。重勸說守護法分。第三爾時已下。可有一\n行經。明精\n> 進慧以偈說重請分。第二隨文解釋者。從初爾時者。爾猶\n此。云說此法時也。精進慧菩薩者。約位加行成名。此通十箇慧之通\n稱\n> 。為今欲成此位之昇進。必籍精進之功。慧者照燭義。精進者無思\n義。以無思之慧照燭有作之功。有作本自無功。萬法本來自淨。\n> 萬法\n自淨。名之為精。無功智應知根利生。名之為進。此約成位進修之稱\n也。菩薩者。如常說也。白法慧菩薩者。白者明也。明\n> 著名言申其明\n也。云昇一切智乘者。明入此位也。以此位菩薩乘一切智乘生如來家\n入佛種智為佛之子恒蒙諸佛之所攝受故。明智\n> 相應其與益故。故云攝\n受。云獲諸菩薩廣大之藏者。如十迴向中智藏悲藏等十藏是也。以何\n方便已下。正說中十十法門是。云六\n> 通者身通。天耳通。天眼通。宿\n命通。他心通。漏盡通。身通者。於一剎那際身隨智用。周遍十方對\n現色身。隨根普應。天耳通\n> 者耳根常聞十方一切諸聲。天眼通者。眼\n根常視十方一切麁細等色。宿命通者。智隨三世一切眾\n> 生死此生彼。\n所作業行因果悉能知之他心通者。一念能知三世一切眾生心念所欲。\n漏盡通者。隨智遍知一切諸法而無情欲順癡愛\n> 心。此經又有十種通。\n如十通品說。三明者。一宿命。二天眼。三漏盡。是名三明。四無畏\n者。一一切智無畏。二漏盡無畏。三\n> 說障道無畏。四說盡苦道無畏。\n相好者。此經十身相海也。力無所畏者。十力也。一是處非處力。二\n業力。三定力。四根力。五\n> 欲力。六性力。七一切至處道力。八宿命\n力。九天眼力。十漏盡力。是為十。三世業果名為處。了達非有名非\n處。論主頌曰。\n\n> 善知眾生業因果\n心定不動如山王\n眾生根品上中下\n欲樂種種各差別\n種種世間諸性分\n一切道法各不同\n宿命遍知三世業\n天眼\n> 十方無礙了\n隨諸分別滿十方\n心無雜染常無垢\n如是十種德自在\n是名如來無畏力\n十八不共者。一佛身無過失。二口無過失。三\n> 念無過失。四想無過\n失。五心無不定常在三昧。六無不知已捨。七欲無減。八精進無減。\n九念\n> 無減。十慧無減。十一解脫無減。十二解脫知見無減。十三身業\n隨智慧行。十四口業隨智慧行。十五意業隨智慧行。十六智慧知過\n> 去\n無礙事。十七智慧知未來無礙事。十八智慧知現在無礙事。所言無過\n失者。妙善相應。所言無減者。所作善法常無忘失。云一\n> 切智智者。\n云種種無盡智。此明差別智無盡故。如守護分中有二義。一明初發心\n菩薩守護一切諸佛法藏而能為人演說。二得天王\n> 夜叉王如來法王等守\n護。以偈重請分中有二十二行頌。初二行頌歎能說法主。已下二十行\n頌。兩行一頌。初兩行歎初發心菩薩智\n> 慧福德超世獲益。次兩行頌。\n勸說昇進之行。次兩行頌。明大智度眾生無著。次兩行頌。明眾行無\n缺利生令佛種不絕。次兩行頌\n> 。明堅固功成出離法勝法重勸請說。次\n兩行頌。明破闇降魔之道。亦願請說。次兩行頌。明如來所得之法。\n亦勸請說。次兩行頌\n> 。明云何演說如來法。末後兩行頌。明云何令初\n發心無畏如師子無著如蓮華。第二許說分中法慧菩薩所歎能問之人如\n文可知。第\n> 三正說分中復分為二。第一長科經意。第二隨文釋義。一\n長科經意者。從佛子菩薩已發一切智心已下。至品末。長科為二十\n段。\n> 第一從初佛子已下。至住不放逸。有十行經。明十住十種不放逸\n法分。第二佛子已下。至十種清淨。有十行半經。明住不放逸得十\n> 種\n清淨法分。第三佛子已下。至能令一切如來歡喜。有十一行半經。明\n行十種法諸佛歡喜分。\n> 第四佛子已下。至諸佛歡喜。有六行經。明安\n住十法分。第五佛子已下。至令諸菩薩速入諸地。有八行經。明行此\n十法速入諸地\n> 分。第六復次佛子已下。至而自莊嚴入菩薩地。有十行\n經。明入地昇進分。第七佛子有十種法已下。至所行清淨。有八行\n經。明\n> 淨行分。第八菩薩既得行清淨已下。至十增勝法。有八行經。\n明昇進轉增分。第九佛子已下。至是為菩薩十種清淨願。有七行經。\n>\n明大願成行利生分。第十佛子已下。至守護無上法門。有七行經。明\n行十法令大願圓滿分。第十一佛子菩薩滿足如是願已下。至\n> 如應說\n法。有八行經。明十種無盡藏分。第十二所謂知其所作已下。至具足\n莊嚴波羅蜜道。有十六行經。明菩薩知根利益分。第\n> 十三是時已下。\n至令三寶種永不斷絕。有五十二行半經。明行十波羅蜜利益眾生諸對\n治分。第十四所以者何已下。至念念具十種\n> 莊嚴。可有十八行經。明\n令三寶種不斷絕分。第十五何者為十已下。至度脫無量無邊眾生。有\n三十行經。明以十種莊嚴令見者發\n> 心無空過分。第十六佛子已下。至\n如是自在力已下。有二十三行經。明菩薩初發心得與佛平等法堪為大\n法師分。第十七假使有不\n> 可說世界廣大道場已下。至及護持法故。有\n十三行半經。明處眾無畏說法自在身無映蔽分。第十八爾時已下。可\n一行經。明法慧以頌歎法分。第十九如此以頌歎法中有二十行頌。兩\n行一頌。如文其義自具。隨文稱歎即得第二\n> 十最下一行經。明諸聞法\n歡喜大眾奉行分。\n第二隨文解釋者。從正說分中佛子菩薩已下二十段文中。但隨經文義\n隱言幽方可解\n> 之。經文自顯處。如文自具不煩更釋。如文中住於深定\n不沈不舉者。不沈離聲聞滅盡定。亦離上二界息慮禪。如色界初禪。\n滅下\n> 欲界愁憂不生。得一分輕安寂靜。無欲界愛有寂靜愛。水災便\n至。楞伽經云。津潤妄想能生內外水界。以愛為津潤故。水災至。如\n>\n色界第二禪。能滅欲界憂苦不生。得一分輕安寂靜。為有覺有觀能緣\n靜境猶有。火災便至。如第三禪。無覺無觀有禪悅樂心有喜\n> 動。風災\n便至。如第四禪。身心寂滅離出入息。喜動亦無三災不至。唯妙色身\n如白銀清淨光潔。衣如金色。四禪身長二十里。衣\n> 長四十里。以下三\n禪倍倍減半。如初會中以釋。如是四禪皆是息心令靜。以為勢分。乃\n至空處。識處。無所有處。非想非非想定\n> 。皆是破除昇進令念不生住\n寂定故。如是破色界淨色。令成無色界空識。又破見空之識亦空。名\n識處定。又破識空之見亦無。名\n> 無所有定。又破無所有心。此無想之\n想亦無。名非想非非想定。如是上界修禪。皆是作意存情伏心不起。\n不是任情無為無沈無掉稱真理智寂用自在不作而為之定也。如欲界名\n攀緣五欲名掉。色無色界定名沈。又聲聞緣覺定名\n> 沈。空觀菩薩行六\n波羅蜜。生於淨土名掉舉。如是三乘之定皆有沈掉。為垢淨未亡見道\n不真有欣厭故。二乘之定雖無三界現行之\n> 惑。皆是厭患對治伏滅無為\n無能起惑。我生不起悲智亦亡。住滅定者。頭上擊鼓亦不聞知。化火\n燒父母分段身入變易生死。如是\n> 二乘斷惑不分別法。意勢相似。或有\n聲聞。以十二緣生得道。如是三乘觀行緣覺聲聞。淨土菩薩所得道\n者。皆是出世三乘互用通\n> 為九乘。大體以約勝鬘經。得伏三界煩惱不\n起。得意生身。無分段生死得變易生死。非是應真任智自在無出入體\n任智應眾生利樂\n> 不息。廣如勝鬘之意。以是義故。色界無色界及三乘\n禪。有沈有掉。如大乘中留惑潤生菩薩。道前安立三十心習種性性種\n性道種\n> 性方入聖種性。四攝四無量心三十七助道品觀十波羅蜜名目相\n似。若以攝化境界及見佛數量意生身智生身成佛因果。總皆不同。以\n>\n是義故。如是留惑潤生菩薩所修定亦沈亦掉。為但得三種意生身未得\n如來智生身故。乃至七八九十地得種類俱生無行作意生身菩\n> 薩。但得\n三界煩惱中空觀。折伏現行不起。於意生身中自在故。非是生如來一\n切種智家故。非是於如來一切種智中起慣習故。所\n> 云成佛定滿三祇。\n所見佛境初地菩薩。但云供養百佛及攝化百佛世界。但得百法明門。\n如此華\n> 嚴經者。初發心菩薩初發如來一切種智之心。名為菩提心。如\n初發心住。創生一切諸佛一切種智慧大智慧家。生初發心時便成正\n\n> 覺。為會諸佛一切種智與自智一故。成佛不出剎那之際以智境界非延\n促故。攝化境界遍百佛剎微塵數。又多百佛明智境德用無盡無\n> 限重重\n故。此猶約隨位進修之言計體一即一切無限也。如十地中初地菩薩供\n養多百佛多百千佛雖數不離百數。然多百即無限。與\n> 單百無比。是故\n四念四攝四無量心十波羅蜜。一一法悉皆無限。是故此十住菩薩所修\n定業。不屬世間出世間沈掉之定也。已釋住\n> 於深定不沈不舉竟。如文\n入深禪定。得佛神通者。如上色界無色界天及三乘神通。色無色界神\n通息心想。淨報得神通。二乘神通\n> 依定。前所念淨土菩薩神通得清淨\n意樂。神通如三種意生身。是如此經中入深禪定得佛神通者。以心稱\n理。源無出入。體無靜亂\n> 。體無造作。性任理自真。不生不伏。理真\n智應。性自遍周。三世十方一時普應。對現色身。隨智應而化群品。\n而無來往。亦不\n> 變化。名佛神通。智無所依止。無形色體無來去性。\n性自遍周。非三世攝。而能普應三世之法。名曰神通。是故經云。智\n入三世\n> 而無來往為三世。是眾生情所妄安。非實有故。為智體無形無\n色不造作而應群品。名之為神。圓滿十方無法不知無根不識。名之為\n>\n通。經云。依無作門修諸淨行者。以此無作門修法界虛空界行海。周\n遍清淨故。智無所為名之\n> 為修。知根同事名之為行。行無不利非作非\n生。名為無作門也。常處十方一切三界受生利俗而無染淨。名之為淨\n行故。經云。與\n> 三世佛同一體性者。為法身智慧同也。三世廣大劫一\n念同。三世諸佛普賢共行大智大悲圓滿同。經云。有十種法令諸菩薩\n速入諸\n> 地者。明於初發心住位而遍知諸住諸行諸迴向諸地法門。為一\n即一切故。一切即一故。即因即果故。即如善財童子。見彌勒菩薩\n\n> 已。彌勒還令却見文殊師利。明因果不異亦不離故。此亦如是。從初\n發心住佛果地位一念齊進。而亦不出一念中。修成正覺。佛因\n> 果及菩\n薩行悉圓滿故。如善財。一生龍女不出一剎那際。三生成佛總相似\n故。云一生成佛者。明今生是父母分段身。是信心及見\n> 道修行生。捨\n分段身。入變易生名為一生。亦不出剎那際。無古今性。無分段性。\n無變易性。萬相如幻故。如化故。非滅故。無\n> 三世故。以此初住遍修\n諸住諸地故。貫通諸法總一時一法。多少延促自在無礙。不出一剎那\n際故。法如是故。去情以智觀之可見\n> 。經云。知一切眾生與諸如來同\n一體性者。三乘菩薩知一切眾生同有如來佛性。理性此經知一切眾生\n同有如來一切種智之性。如\n> 經下文有經卷如三千大千世界。內在小眾\n生身中。有人成佛。破此微塵出此經卷。言微塵許大。眾生皆有佛一\n切種智故。菩薩成\n> 佛化之。總得如來一切種智故。達理之智名一切\n智。差別智名一切種智。經云。聞諸佛土悉願往\n> 生者。不出塵中智遍\n現應供養十方一切諸佛而無來去。經云諸次第定者。色界四禪菩薩次\n第能入。於無色界四禪菩薩悉能順入。\n> 或超間入出。如涅槃經闍維分\n說。從初禪入三禪定出。空處入無所有處出。非想處入空處出。如是\n超間。如是次第。如此經方網\n> 三昧。一方入定十方起。十方入定一方\n起等。具如十信位中說。三摩鉢底智印者。明寂用同起印諸萬法無不\n明了。如大海水而現\n> 萬像。淨智普印一切萬法。皆能了知。而無能\n所。亦無作者。經云。善觀諸法得實相印者。以無作無依無想大智印\n印諸萬法。起\n> 唯法起。無有無明三世繫著。名實相印。經云。入真三\n昧者。無三界及三乘染淨沈掉是也。離諸僻見者。有無二見是。內見\n外見\n> 身見邊見戒取見取等總是。乃至六十二見是。六十二見者。於一\n切法上繫有四見。一常。二無常。三亦常亦無常。四非常非無常。\n> 於\n五陰上各有四見。四五二十。三世五陰上合為六十。本二見共為六十\n二見。一切僻見不離此也。普門慧者。遍知眾生諸根及法\n> 智一切智智\n種種差別智也。色界眾生為住定故。教令起觀。無色界眾生為修無相\n觀故。教微妙智。慧為相不當情智慧利故。六和\n> 敬法者。一身。二\n口。三意。四戒。五施。六見。名為六和敬法。於眾生田中下佛種子\n者。示一切眾生菩提理智故。及微少善根\n> 為勝緣故。六通前已釋訖。\n如十通品說。十神通如經具明。已下頌中兩行一頌文自具足。隨文稱\n>\n歎。最下長行一行。明大眾聞法歡喜奉行分。此之一會昇忉利天宮品\n是序分。從偈讚品以下是正說分。動地興供是流通分。\n\n### 5.6 李通玄《华严经合论》（X0223）段\n\n合论疏窗 @339294–350549·长 **11,255**。【論】体·经论交映·文末判第四会科由（序分·正说分·流通分）。\n\n合论窗口 X0223·NFKD @339294-350549·len=11255·【論】体·经论交映·文末判第四会科由（序分·正说分·流通分）：\n\n> 明法品第十八\n【論】將釋此品約作三門分別一釋品名目二釋品來意三隨文釋義第一\n釋品名目者此品為明前之昇須彌頂品偈讚品十\n> 住品梵行品初發心功德\n品五品法門\n已\n發菩提之心得廣大功德此精進慧所問之法有二義一令前\n五品之法其心更明二令後所行之\n> 法轉勝明白故云明法品明昇進前後法\n故是精進慧菩薩啟請法慧菩薩言所有大願悉使滿足獲諸菩薩\n> 廣大之藏\n此明前所得法使令更明後之昇進使令明白是修十行之向長養本位十住\n之法第二釋品來意及名目如前第三隨文釋義分之為\n> 二一長科經意二隨\n文解釋第一長科經意者約科為三段第一初爾時\n已\n下長行有三十三行半\n經通偈頌有五十五行半明精進慧菩薩\n> 請法分第二爾時法慧菩薩\n已\n下有\n六行經明法慧菩薩許說分第三佛子菩薩摩訶薩\n已\n下直至品末通偈頌總\n明正說法分從初第\n> 一請法分中義分為二一科此一段經之文意第二隨文\n解義第一科此一段經文意者約科為三段。\n【經】爾時精進慧菩薩白法慧菩薩言\n> 佛子菩薩摩訶薩初發求一切智心\n成就如是無量功德具大莊嚴昇一切智乘入菩薩正位捨諸世間法得佛出\n世法去來現在諸佛攝受決定\n> 至於無上菩提究竟之處彼諸菩薩於佛教中\n云何修習令諸如來皆生歡喜入諸菩薩所住之處一切大行皆得清淨所有\n大願悉使滿足獲諸\n> 菩薩廣大之藏隨所應化常為說法而恒不捨波羅蜜行\n所念眾生咸令得度紹三寶種使不斷絕善根方便皆悉不虗佛子彼諸菩薩\n以何方便\n> 能令此法當得圓滿願垂哀愍為我宣說此諸大會靡不樂聞。\n【論】第一爾時\n已\n下至靡不樂聞有十二行經明精進慧菩薩初起請法門\n>\n分第二隨文解釋者從初爾時者爾猶此云說此法時也精進慧菩薩者約位\n加行成名此通十箇慧之通\n> 稱為令欲成此位之昇進必藉精進之功慧者照\n燭義精進者無思義以無思之慧照燭有作之功有作本自無者萬法本來自\n淨萬法自淨名之\n> 為精無巧智應知根利生名之為進此約成位進修之稱也\n菩薩者如常說也白法慧菩薩者白者明也明著名言申其所明也云昇一切\n智乘者\n> 明入此位也以此位菩薩乘一切智乘生如來家入佛種智為佛之子\n恒蒙諸佛之所攝受故明智相應堪與益故故云攝受云獲諸菩薩廣大之藏\n>\n者如十迴向中智藏悲藏等十藏是也云以何方便\n已\n下正說中十十法門\n是。\n【經】復次如諸菩薩摩訶薩常勤修習滅除一切無明\n> 黑闇降伏魔怨制諸\n外道永滌一切煩惱心垢悉能成就一切善根永出一切惡趣諸難淨治一切\n大智境界成就一切菩薩諸地諸波羅蜜總持\n> 三昧六通三明四無所畏清淨\n功德莊嚴一切諸佛國土及諸相好身語心行成就滿足善知一切諸佛如來\n力無所畏不共佛法一切智智所行\n> 境界為欲成熟一切眾生隨其心樂而取\n佛土隨根隨時如應說法種種無量廣大佛事及餘無量諸功德法諸行諸道\n及諸境界皆悉圓滿疾與\n> 如來功德平等於諸如來應正等覺百千阿僧祇劫\n修菩薩行時所集法藏悉能守護開示演說諸魔外道無能沮壞攝持正法無\n有窮盡於一切\n> 世界演說法時天王龍王夜叉王乾闥婆王阿脩羅王迦樓羅\n王緊那羅王摩睺羅伽王人王梵王如來法王\n> 皆悉守護一切世間恭敬供養\n同灌其頂常為諸佛之所護念一切菩薩亦皆愛敬得善根力增長白法開演\n如來甚深法藏攝持正法以自莊嚴\n> 一切菩薩所行次第願皆演說。\n【論】第二復次如諸\n已\n下至菩薩所行次第願皆演說有二十一行經明精\n進慧菩薩并舉當位應所修\n> 行之行及獲益重勸說守護法分云六通者身通\n天耳通天眼通宿命通他心通漏盡通身通者於一剎那際身隨智用周徧十\n方對現色身隨根\n> 普應天耳通者耳根常聞十方一切諸聲天眼通者眼根常\n見十方一切麤細等色宿命通者智隨三世一切眾生死此生彼所作業行因\n果悉能\n> 知之他心通者一念能知三世一切眾生心念所欲漏盡通者隨智徧\n知一切諸法而無情欲順癡愛心此經又有十種通如十通品說三明者一宿\n>\n命二天眼三漏盡是名三明四無畏者一一切智無畏二漏盡無畏三說障道\n無畏四說盡苦道無畏相好者此經十身相海也力無所畏者十力\n> 也一是處\n非處力二業力三定力四根力五欲力六性力七一切至處道力八宿命力九\n天眼力十漏盡力是為十三世業果名為處了達非有名\n> 非處善知眾生業因\n果心定不動如山王眾生根品上中下欲樂種種各差別種種世間諸性分一\n切道法各不同宿命徧知三世業天眼十方無\n> 礙了隨諸分別滿十方心無襍\n染常無垢如是十種得自在是名如來無畏力十八不共者一佛身無過失二\n>\n口無過失三念無過失四想無過失五心無不定常在三昧六無不知\n已\n捨七\n者欲無減八者精進無失九念無減十慧無減十一解脫無減\n> 十二解脫知見\n無減十三身業隨智慧行十四口業隨智慧行十五意業隨智慧行十六智慧\n知過去無礙事十七智慧知未來無礙事十八智慧\n> 知現在無礙事所言無過\n失者妙善相應所言無減者所作善法常無忘失云一切智智者云種種智無\n盡智此明差別智無盡故如守護分中有\n> 二義一明初發心菩薩守護一切諸\n佛法藏而能為人演說二得天王夜叉王如來法王等守護。\n【經】爾時精進慧菩薩欲重宣其義而說頌\n> 言。\n【論】第三爾時\n已\n下可一行經明精進慧以偈說重請法分。\n【經】\n大名稱者善能演\n菩薩所成功德法\n深入無邊廣大行\n>\n具足清淨無師智\n若有菩薩初發心\n成就福德智慧乘\n入離生位超世間\n普獲正等菩提法\n彼復云何佛教中\n堅固勤修轉增勝\n<\n令諸如來悉歡喜\n佛所住地速當入\n所行清淨願皆滿\n及得廣大智慧藏\n常能說法度眾生\n而心無依\n> 無所著\n菩薩一切波羅蜜\n悉善修行無缺減\n所念眾生咸救度\n常持佛種使不絕\n所作堅固不唐捐\n一切功成得出離\n如諸勝者所修\n> 行\n彼清淨道願宣說\n永破一切無明闇\n降伏眾魔及外道\n所有垢穢悉滌除\n得近如來大智慧\n永離惡趣諸險難\n淨治大智殊勝境\n\n> 獲妙道力鄰上尊\n一切功德皆成就\n證得如來最勝智\n住於無量諸國土\n隨眾生心而說法\n及作廣大諸佛事\n云何而得諸妙道\n開演\n> 如來正法藏\n常能受持諸佛法\n無能超勝無與等\n云何無畏如師子\n所行清淨如滿月\n云何修習佛功德\n猶如蓮華不著水\n【論】如以偈重請分中有二十二行頌初二行頌歎能說法主\n已\n下二十行\n兩行一頌初兩行歎初發心菩薩智\n> 慧福德超世獲益次兩行頌勸說昇進之\n行次兩行頌明大智度眾生無著次兩行頌明眾行無缺利生令佛種不絕次\n兩行頌明堅固功成出離\n> 法勝重勸請說次兩行頌明破暗降魔之道亦願請\n說次兩行頌明如來所得之法亦勸請說次兩行頌明云何演說如來法末後\n兩行頌明云何\n> 令初發心無畏如師子無著如蓮華。\n【經】爾時法慧菩薩告精進慧菩薩言善哉佛子汝今為欲多所饒益多所\n安樂多所惠利哀愍世間諸\n> 天及人問於如是菩薩所修清淨之行佛子汝住\n實法發大精進增長不退\n已\n得解脫能作是問同於如來諦聽諦聽善思念之\n我今承佛威\n> 神之力為汝於中說其少分。\n【論】第二爾時法慧菩薩\n已\n下有六行經明法慧菩薩許說分於此分中所\n歎能問之人如文可知第三正\n> 說分中復分為二第一長科經意第二隨文釋\n義第一長科經意者從佛子菩薩\n已\n發一切智心\n已\n下至品末長科為二十\n段。\n【經\n> 】佛子菩薩摩訶薩\n已\n發一切智心應離癡闇精勤守護無令放逸佛子\n菩薩摩訶薩住十種法名不放逸何者為十一者護持眾戒二者遠離\n> 愚癡淨\n菩提心三者心樂質直離諸諂誑四者勤修善根無有退轉五者恒善思惟自\n所發心六者不樂親\n> 近在家出家一切凡夫七者修諸善業而不願求世間果\n報八者永離二乘行菩薩道九者樂修眾善令不斷絕十者恒善觀察自相續\n力佛子若\n> 諸菩薩行此十法是則名為住不放逸。\n【論】第一從初佛子\n已\n下至住不放逸有十行經明住十種不放逸法分。\n【經】佛子菩薩摩\n> 訶薩住不放逸得十種清淨何者為十一者如說而行二\n者念智成就三者住於深定不沈不舉四者樂求佛法無有懈息五者隨所聞\n法如理觀\n> 察具足出生巧妙智慧六者入深禪定得佛神通七者其心平等無\n有高下八者於諸眾生上中下類心無障礙猶如大地等作利益九者若見眾\n\n> 生乃至一發菩提之心尊重承事猶如和尚十者於授戒和尚及阿闍棃一切\n菩薩諸善知識法師之所常生尊重承事供養佛子是名菩薩住不放\n> 逸十種\n清淨。\n【論】第二佛子\n已\n下至十種清淨有十行半經明住不放逸得十清淨法分\n第二隨文解釋者從正說分中菩薩摩訶薩\n> 二十段文中但隨經文義隱言幽\n方可解之經文自顯處如文自具不煩更釋如文中深入禪定不沈不舉者不\n沈離聲聞滅盡定亦離上二界息\n> 慮禪如色界初禪滅下欲界愁憂不生得一\n分輕安寂靜無欲界愛有寂靜愛水灾便至楞伽經云津潤妄想\n> 能生內外水\n界以愛為津潤故水大至如色界第二禪能滅欲界憂苦不生得一分輕安寂\n靜為有覺有觀能緣靜境猶在火灾便至如第三禪無\n> 覺無觀有禪悅樂心有\n喜動風灾便至如第四禪身心寂滅離出入息喜動亦無三灾不至唯妙色身\n如白銀清淨光潔衣如金色四禪身長二十\n> 里衣長四十里\n已\n下三禪倍倍減\n半如初會中\n已\n釋如是四禪皆是息心令靜以為勢分乃至空處識處無所有\n處非想非非想定皆是\n> 破除昇進令念不生住寂定故如是破色界靜色令成\n無色界空識又破見空之識亦空名識處定又破識空之見亦無名無所有定\n又破無所有\n> 心此無想無想之想亦無名非想非非想定如是上界修禪皆是\n作意存情伏心不起不是任性無為無沈無掉稱真理智寂用自在不作而為\n之\n> 定也如欲界定攀緣五欲名掉色無色界定名沈又聲聞緣覺定名沈空觀\n菩薩行六波羅蜜生於淨土名掉舉如是三乘之定皆有沈掉為垢淨未\n> 亡見\n道不真有忻厭故二乘之定雖無三界現行之惑皆是厭患對治伏滅無為無\n能起惑我生不起悲智亦亡住滅定者頭上擊鼓亦不聞知化\n> 火燒父母分段\n身者入變易生死如是二乘斷惑不分別法意勢相似或有聲聞以十二緣生\n法得道如是三乘觀行緣覺聲聞淨土菩薩所得道\n> 者皆是出世三乘互用通\n為九乘大體以約勝鬘經得伏三界煩惱不起得意生身無分段生死得變易\n生死非是應真任智自在無出入體任智\n> 應眾生利樂不息廣如勝鬘之意以\n是義故色界無色界及三乘禪有沈有掉如大乘中留惑潤生菩薩道前\n> 安立\n三十心菩薩習種性性種性道種性方入聖種性四攝四無量心三十七助道\n品觀十波羅蜜名目相似若以攝化境界及見佛數量意生身\n> 智生身成佛因\n果總皆不同以是義故如是留惑潤生菩薩所修定亦沈亦掉為但得三種意\n生身未得如來智生身故乃至七八九十地得種類\n> 俱生無行作意生身菩薩\n但得三界煩惱中空觀折伏現行不起於意生中自在故非是生如來一切種\n智家故非是於如來一切種智中起慣習\n> 故所云成佛定滿三祇所見佛境初\n地菩薩但云供養及攝化百佛世界但得百法明門如此華嚴經者初發心菩\n薩初發如來一切種智之心名\n> 為菩提心如初發心住創生一切諸佛一切種\n智大智慧家生初發心時便成正覺為會諸佛一切種智與自智一故成佛不\n出剎那之際以智境\n> 界非延促故攝化境界徧百佛剎微塵又多百佛明智境\n德用無盡無限重重故此猶約隨位進修之言計體一即一切無限也如十地\n中初地菩\n> 薩供養多百佛多百千佛雖數不離百數然多百即無限與單百即\n無比是故四念四攝四無量心十波羅蜜一一法悉皆無限是故此十住菩薩\n\n> 所修定業不屬世間出世間沈掉之定也\n已\n釋住於深定不沈不舉竟如云深\n入禪定得佛神通者如上色界無色界天及三乘神通色無色界\n> 神通息心想\n淨報得神通二乘神通依定前所念淨土菩薩神通得清淨意樂通如三種意\n生身是如此經中入深禪定得佛神通者以心稱理元\n> 無出入體無靜亂體無\n造作性任理自真不生不伏理真智應性自徧周三世十方一時普應對現色\n身隨\n> 以智應而化羣品而無來往亦不變化名佛神通智無依止無形色體無\n來去性性自徧周非三世攝而能普應三世之法名曰神通是故經云智入\n> 三\n世而無來往為三世是眾生情所妄安井實有故為智體無形色不造作而應\n羣品名之為神圓滿十方無法不知無根不識名之為通。\n大\n> 方廣佛新華嚴經合論卷第三十五\n音切\n瞙\n(莫音)\n。\n饒\n(如招切)\n。\n覲\n(渠吝切\n> )\n。\n謁\n(於揭切)\n。\n鑽\n(則官切)\n。\n沮\n(慈呂切)\n。\n躭\n(丁含切)\n。\n晝\n(之又切)\n。\n缺\n(苦穴切)\n。\n著\n(智呂切)\n。\n藉\n(慈易慈夜二切)\n。\n>\n大方廣佛新華嚴經合論卷第三十六\n唐于闐國三藏沙門實叉難陀譯經\n唐太原方山長者李通玄造論\n唐福州開元寺沙門志寧釐經合\n> 論\n明法品第十八之餘\n【經】佛子菩薩摩訶薩住不放逸發大精進起於正念生勝欲樂所行不息\n於一切法心無依處於甚深法能勤修習\n> 入無諍門增廣大心佛法無邊能順\n了知令諸如來皆悉歡喜佛子菩薩摩訶薩復有十法能令一切諸佛歡喜何\n等為十一者精進不退二者不\n> 惜身命三者於諸利養無所希求四者知一切\n法皆如虗空五者善能觀察普入法界六者知諸法印心無倚著七者常發大\n願八者成就清淨忍\n> 智光明九者觀自善法心無增減十者依無作門修諸淨\n行佛子是為菩薩住十種法能令一切如來歡喜。\n>\n【論】第三佛子\n已\n下至能令一切如來歡喜有十一行半經明行十種法諸\n佛歡喜分經云依無作門修諸淨行者以此無作門修法界虗\n> 空界行海徧周\n清淨故智無所為名之為修知根同事名之為行行無不利非作非生名為無\n作門也常處十方一切三界受生利俗而無染淨名\n> 之為淨行故。\n【經】佛子復有十法能令一切諸佛歡喜何者為十所謂安住不放逸安住\n無生忍安住大慈安住大悲安住滿足諸波羅蜜安\n> 住諸行安住大願安住巧\n方便安住勇猛力安住智慧觀一切法皆無所住猶如虗空佛子若諸菩薩住\n此十法能令一切諸佛歡喜。\n【論】\n> 第四佛子\n已\n下至諸佛歡喜有六行經明安住十法分\n已\n上佛歡喜\n分。\n【經】佛子有十種法令諸菩薩速入諸地何等為十一者善\n> 巧圓滿福智二\n行二者能大莊嚴波羅蜜道三者智慧明達不隨他語四者承事善友恒不捨\n離五者常行精進無有懈怠六者善能安住如來神\n> 力七者修諸善根不生疲\
