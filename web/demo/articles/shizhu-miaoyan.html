n> The sleeve edition's editorial note closes the roster with a summary that deserves to be read as a table of contents for the whole chapter: twenty bodhisattvas for the \"world of wisdom and enlightenment,\" 190 divine attendants for the \"world of vessels,\" 402 kings for the \"world of retinue\" — 412 in all. (The 412 figure is verified arithmetically in §1.3. The three-world division is Chongguan's; see §2.13.)\n\n### 2.13 卷第一小结：三世间架构\n\n**疏解**　卷一至此毕。综观全卷，其结构可归纳为三层，且此三层架构贯穿八十华严全经，卷二至卷五只是在此架构中逐众展开：\n\n| 架构 | 卷一所示 | 名称之义 |\n|---|---|---|\n| **智正觉世间** | 20 位上首菩萨 | 修行之主体 |\n| **器世间** | 19 类杂类神众，190 位 | 依以修持之世界 |\n| **眷属世间** | 8 部四王（80）＋欲界天 7 众（71）＋色界天 5 众（51） | 所化之机 |\n\n**此三层架构，出自澄观《大方广佛华严经疏》之判。** 〔本节据本项目既有华严经学条目所引澄观之说，未核《疏》原文，标〔待核〕〕其大意为：世主妙严品之所以名「世主妙严」，非因佛自陈其德，而因**世间诸主各以所证之境显佛之德**；故佛之庄严，实由众会之庄严而显。\n\n**由此可窥华严之一法门，即「他方显自」。** 佛不自言其广，而以十佛世界微尘数菩萨之广、佛世界微尘数神众之广、菩萨海之广来显；故卷一通篇无一语自夸于佛，而句句见其广大。**此即「于不自中」之妙，亦是华严「理事无碍」在文体上的落实。**\n\n**海云继梦法师于此有一读，可与澄观之判参看。** 法师谓世主妙严品之会主为毗卢遮那（报身），而**经中所说者是佛的「境界量」，不是「修行量」**——**不是佛如何修行，而是佛证悟后所见的真实世界。** **故此品是「果法门」的开端，以佛的果德为修行的起点与归趣。** 此说与澄观判为「所信因果·信位」，言异而义通：**皆谓此品不教人如何修，而先令人见其所信者为何。**\n\n> **EN corresponding · 2.13 The Three-World Structure of Chapter One**\n>\n> Chapter One is complete, and its architecture can be stated in three lines. The \"world of wisdom and enlightenment\" (智正覺世間) is the twenty bodhisattvas — the agents of practice. The \"world of vessels\" (器世間) is the nineteen classes of divine attendants, 190 in number — the world in which practice is performed. The \"world of retinue\" (眷屬世間) is the eight legions of four kings (80), the seven desire-realm heavens (71), and the five form-realm heavens (51) — those to be converted.\n>\n> This tripartite division is Chongguan's, and it explains the chapter's title. The Adornment of the World-Lord is adorned not by the Buddha's own account of himself but by the realizations of the beings who surround him: the Buddha's vastness is disclosed by the vastness of the assembly. Nowhere in this chapter does the Buddha magnify himself, and yet not one line is small. This is what the Huayan commentators call \"disclosing the self through the other\" (他方顯自) — and it is 理事無礙 realized in literary form rather than in doctrine alone.\n>\n> Haiyun's reading is compatible though differently phrased. He takes the presiding Buddha of this chapter to be Vairocana, the reward-body, and remarks that what the chapter describes is the Buddha's 境界量, the measure of his state, and not a 修行量, a record of how he trained. The chapter therefore opens the \"gate of the fruits\" (果法門): it offers the fruits of Buddhahood as both the starting point and the goal of practice. Chongguan calls this the \"trust\" (信) stage of the \"object of faith and its causes\" (所信因果); Haiyun calls it the beginning of the fruit-gate. The wording differs, the point agrees: this chapter does not tell you how to practice. It first shows you what you are to trust.\n\n---\n\n## 三、卷第二　世主妙严品第一之二（大自在天王众讫月天子）\n\n> 卷二承接卷一：卷一列众名，卷二至卷五则入各众之「解脱门」与颂言。全品之结构，至此可见其规律——**先名后行，名起于卷一，行布于卷二至卷五。** 本卷起于一段总叙，述会众来源与根机；后历十二组，自色界大自在天王讫欲界月天子。所列十二组皆各得解脱门、各说颂言，颂言各随其众，合观即为一卷独立的颂赞形式。\n\n### 3.1 领起总叙（卷二起首）\n\n> **经文**　爾時如來道場眾海悉已雲集，無邊品類周匝遍滿，形色部從各各差別，隨所來方親近世尊，一心瞻仰。此諸眾會，已離一切煩惱心垢及其餘習，摧重障山見佛無礙。如是皆以毘盧遮那如來往昔之時，於劫海中修菩薩行，以四攝事而曾攝受。一一佛所種善根時，皆已善攝種種方便，教化成熟。令其安立一切智道，種無量善，獲眾大福，悉已入於方便願海，所行之行，具足清淨。於出離道，已能善出。常見於佛，分明照了。以勝解力入於如來功德大海，得於諸佛解脫之門，遊戲神通。\n\n**疏解**　卷一之末，列众之名；卷二之始，说众之来。此段为卷二至卷五的总纲，亦是「众海云集」的正面说明，逐句如下：\n\n**（1）「尔时如来道场众海悉已云集，无边品类周匝遍满。」** ——「道场众海」四字，是华严「众海」一词的第一次正面出现。**「海」字在卷一用于严饰（色相海），于此用于会众**；会众非徒众多，乃如海之深广、如海之相涵，此为华严滨海之量词。\n\n**（2）「形色部从各各差别，随所来方亲近世尊，一心瞻仰。」** ——形有队伍、色有部属，各各差别而不失其位：**差别是所见，亲近是一心**。故「随所来方」四字明其来处，非杂乱而来，各从其所来方整集。「一心瞻仰」明其情状：非徒集而不观，乃一心瞻仰佛德。\n\n**（3）「此诸众会，已离一切烦恼心垢及其余习，摧重障山见佛无碍。」** ——「烦恼心垢」为现行烦恼，「余习」为习气种子。既离现行，又除余习，则其见佛**无碍**——「无碍」二字，始见于此句，而为全经眼目。**「摧重障山」：障之重者如山，而众会能摧之。** 华严写众会，不说「善根深厚」，而说「已离已摧」，即其所谓为「菩提之机」。\n\n**（4）「如是皆以毘卢遮那如来往昔之时，于劫海中修菩萨行，以四摄事而曾摄受。」** ——**此句为全卷最要紧的一句。** 会众之所以能来此厂海者，非以其自得，而由于其曾为毘卢遮那过去世以「四摄事」摄受。「四摄事」者，布施摄、爱语摄、利行摄、同事摄（`catvāri saṃgrahavastūni`）。**华严说众生与佛之关系，不在「亲疏」，而在「曾摄受」**：凡能亲近佛者，皆在往昔已为佛所摄。**「募顺倒」中来此。**\n\n**（5）「一一佛所种善根时，皆已善摄种种方便，教化成熟。」** ——于一一佛前种善根、受马桶，皆非徒然，「教化成熟」四字：**种者是因，熟者是果，而中间皆以「方便」为体。**\n\n**（6）「令其安立一切智道，种无量善，获众大福，悉已入于方便愿海，所行之行，具足清净。」** ——「一切智道」为佛智之道，安立于其上；「方便愿海」为菩萨之方便与愿力如海。**「所行之行具足清净」首句渐次收紧：由离障、摄受、种善、安立、入海，到所行清净——此佛对众生摄化的次第。**\n\n**（7）「于出离道，已能善出。」** ——「出离道」者，出轮回解脱之道。**「已能善出」：能出，是自度；善出，是度他而得法。** 华严不用「已出」，而用「已能善出」——能而未竟，善而无穷。\n\n**（8）「常见于佛，分明照了。」** ——与上文「一心瞻仰」相应而进一层：瞻仰是见其相，照了是悟其理。**「分明」二字，明其无碍之实。**\n\n**（9）「以胜解力入于如来功德大海，得于诸佛解脱之门，游戏神通。」** ——「胜解力」（`adhimukti`，信解、清净信解）为入门之钥；「入如来功德大海」为入佛之体；「得诸佛解脱之门」为得佛之门径；「游戏神通」（`vikrīḍita`）为用佛之作用。**末三字「游戏神通」最奇：神通而曰游戏，即无所住而生其心之义——出而不出，入而不滞。【本文判断】华严以「游戏」状神通，本于《维摩经》「游戏神通」之语，学者谓其义为「自在无碍」而为「随缘妙用」。**\n\n**（10）此处原文以「众海云集」，故旧注有谓二卷以下皆此众海之「归摄」者，即此处「头两句是总标，末数句是结归」。本文按经文顺序细读：总叙之后，历历各众承受，如流注入海，故二卷以下之十二组，实为「道场众海」的展开。**\n\n> **EN corresponding · 3.1 The Assembling of the Ocean-Multitude**\n>\n> \"At that time the ocean-multitude of the Tathāgata's bodhimaṇḍa had already gathered in clouds — categories without bound ranged everywhere; bodied forms and retinues each different; each, in its coming direction, drew near the World-Honored One and with one mind looked up in reverence. These assemblies had already parted from all afflictions, their mind's stains, and their remaining habits; they had overthrown mountains of heavy obstacles and could see the Buddha without obstruction. All this because Vairocana Tathāgata, in past ages, in the ocean of kalpas, cultivating the bodhisattva-path, had taken them under his care by means of the four means of gathering.\"\n>\n> The paragraph is the hinge between the naming of the assembly (Book One) and its unfolding (Books Two to Five). And it states, in four strokes, the Hua-yan doctrine of the assembly's provenance: the ocean-multitude is not numerous merely, it is *sea-like* (the word 海, \"sea,\" first used of the adornments in 2.2, is now used of the assembly); its many types are at once perfectly different and perfectly unified, since they gather \"each from its own quarter\" yet \"with one mind\"; and — decisively — their ability to see the Buddha unobstructed rests not on their own merit but on the fact that Vairocana **once took them under his care** in past kalpas by the four means of gathering (布施愛語利行同事, contribution, loving speech, beneficial conduct, and working together). The relation of beings to the Buddha is here drawn not by nearness or rank but by a prior act of care.\n>\n> Four progressive clauses then trace how that care issued: they planted roots, were taught and ripened, were established upon the path of all-knowledge, entered the sea of vows and expedients, and their conduct became wholly pure. \"Able already to emerge upon the path of emergence\" — note 善出, *well* emerged, as distinct from merely emerged: escape as a perfected art. And the paragraph closes on 遊戲神通, \"playing in superknowledges,\" the free, unattached operation of the Buddhas' powers — a phrase Hua-yan takes from the Vimalakīrti-sūtra and turns into a technical term for manifestation without attachment. (This last point is the editor's judgment, marked accordingly.)\n\n### 3.2 卷二各组次第：一览\n\n**经文自「所谓妙燄海大自在天王……」至卷末「月天子」。今先列其组次，以便逐组细读：**\n\n<details class=\"fold table-fold\"><summary>📋 表·组…（14 行）</summary>\n| 组 | 领众（首名） | 领众所观（尔时……承佛威力/神力·普观……而说颂言） | 偈数 |\n|---|---|---|---|\n| 1 | 妙燄海大自在天王 | 一切自在天众 | 10 偈 |\n| 2 | 可爱乐法光明幢天王 | 一切少广天、无量广天、广果天众 | 10 偈 |\n| 3 | 清净慧名称天王 | 一切少净天、无量净天、遍净天众 | 11 偈 |\n| 4 | 可爱乐光明天王 | 一切少光天、无量光天、极光天众 | 10 偈 |\n| 5 | 尸弃大梵王〔承佛神力〕 | 一切梵身天、梵辅天、梵众天、大梵天众 | 10 偈 |\n| 6 | 自在天王 | 一切自在天众〔承佛威神·遍观〕 | 10 偈 |\n| 7 | 善化天王 | 一切善化天众 | 10 偈 |\n| 8 | 知足天王 | 一切知足天众 | 10 偈 |\n| 9 | 时分天王 | 一切时分天众 | 10 偈 |\n| 10 | 释迦因陀罗天王 | 一切三十三天众 | 11 偈 |\n| 11 | 日天子 | 一切日天子众〔遍观〕 | 11 偈 |\n| 12 | 月天子 | 一切月宫殿中诸天众会〔承佛神力·说颂曰〕 | 10 偈 |\n</details>\n\n注：①表中领起语以**袖珍版**（凡例七之行文底本）「承佛威力·普观……众而说颂言」逐字录出，唯第 5 组尸弃大梵王原文作「承佛**神力**」，故表内特标；今以 **T279（大正藏）** 复核卷二组之领起，得其异文：承佛**威力**九处（第 1、2、3、4、7、8、9、10、11 组）、承佛**威神**一处（第 6 组自在天王）、承佛**神力**二处（第 5 组尸弃、第 12 组月天子）；「普观……而说颂言」作「**遍观**」者二处（第 6 组自在、第 11 组日天子），唯第 12 组月天子末作「**而说颂曰**」（余皆「而说颂言」）——**袖珍版与 T279 措辞互有出入，两说并存**（详 1.5），表内〔…〕即 T279 原文异文之标注。②各众之天界层属——**梵身、梵辅、梵众、大梵＝初禅；少光、无量光、极光（光音）＝二禅；少净、无量净、遍净＝三禅；少广、无量广、广果＝四禅**：卷一「色界天五众」大梵、光音、遍净、广果、大自在自低而高，卷二颂赞则自大自在（色界顶）反向而下，讫欲界月天子——**卷一列名自下而上，卷二歌颂自上而下，次序适相倒转**，且卷二编按明记「以上是色界天5众」「以上是欲界天7众」指画分明。③各组实际含何天王名目，详于附录。\n\n### 3.3 组一细读：妙燄海大自在天王\n\n> **经文**　妙焰海大自在天王，得法界虛空界寂靜方便力解脫門。自在名稱光天王，得普觀一切法悉自在解脫門。清淨功德眼天王，得知一切法不生不滅不來不去無功用行解脫門。……\n\n**疏解**　「妙焰海大自在天王」（本地繁本作「**妙燄海**」，见 1.5 底本用字差异表第 2 条）为卷二首组之首，亦即**卷一「大自在天王」众（色界天五众之末）之首名**——卷一原文「复有无数大自在天王。所谓妙燄海天王.自在名称光天王.清净功德眼天王……」（`T279` 作「復有無數大自在天王。所謂：妙焰海天王、自在名稱光天王、清淨功德眼天王……」），卷二此组即承其继续，由「列名」入「得门」。**「妙焰海」者，妙光焰如海**；大自在天王者，即卷一色界五众末之「大自在天王」，为色界之顶。\n\n**「得法界虚空界寂静方便力解脱门」，一句而含四名相：**\n- **法界**：`dharmadhātu`，诸法之体；此处谓佛智所住之境。\n- **虚空界**：`ākāśadhātu`，世界虚空之色相。华严以「法界」「虚空界」对举——法界为理，虚空界为事，合言「法界虚空界」则理事并摄。\n- **寂静**：禅定之法义。\n- **方便力**：`upāya-bala`，以方便为用之力。\n\n**故此解脱门之全义：于法界虚空界二者互摄不碍处，得其寂静之相，而复以方便力入出无碍。** 此为「大自在」之正释——自在者，能于理事无碍处游戏也。\n\n> **〔澄观《疏》参校〕** 以上四名相之分疏，依凡例二属**本文直解**。澄观《大方广佛华严经疏》于此门别有疏解，其要点为：**「法界」即法身解脱；「法界虚空界」为「用所遍处」，「空即事空，法界之言义兼事理」「重重皆遍」；「言『寂靜』者，體也……言『方便』者，用也……寂用無礙，所以稱力」**。又同卷释「普观一切法悉自在」为**智身解脱**（三义），释「知一切法不生等」为**自共相解脱**，「無功用行」属其**外应群机**之一义。**〔按〕本文四名相之分疏与澄观之说义理方向不殊，然层级有别——本文系依名相训释而得，澄观系就本门法门而释，读者勿混同。** 原文逐字见**附录八·八.1.1（丁）**〔出处：`T35n1735`（据 `KR6e0021` 会本，卷一）〕\n\n**组内余众之名，组内逐一交代其后十颂。今亦选其一：**\n\n> **经文**　清淨功德眼天王，得知一切法不生不滅不來不去無功用行解脫門。\n\n**疏解**　「无功用行」（`anābhoga`）为华严修行之谈——行而不用功，用功而不执著。知一切法不生不灭不来不去，其知非由推测，乃由功用俱息处而自然符契。**「无功用行」四字，依八十华严品文核对，全品仅此一见**[核对确认：繁本 L443；简本、大正藏版同。惟卷三十七 L13161「從第八地乃至第十地無功用行皆悉成就」另出一处，属出世间品，不在本品]。\n\n> **EN corresponding · 3.3 Group One: The Maṇi-flame Ocean King of Freedom**\n>\n> The first group of Book Two is headed by 妙燄海大自在天王, the \"King of Great Freedom with an Ocean of Wonderful Flames\" — the very first name of the \"Great Freedom Kings\" (大自在天王), the last of the five form-realm hosts listed in Book One. Its opening liberation-gate — \"the gate of the power of skillful means and stillness of dharmadhātu-ākāśadhātu\" (法界虛空界寂靜方便力解脫門) — packs four terms into one: dharmadhātu (the principle), ākāśadhātu or the space of forms (the event), stillness (samādhi), and the power of upāya. Freedom (*maheśvara*), on this account, is precisely the ability to move in and out between the unobstructed mutual containment of principle and event. A second member of the group, 清淨功德眼, attains \"the gate of effortless practice, knowing all dharmas as neither born nor destroyed, neither coming nor going\" — *anābhoga* (無功用行, \"practice without striving\"). A word-check confirms that the four characters 無功用行 occur but once in the whole chapter — noted here for the reader to hold in mind.\n>\n> **〔Cross-check against Chengguan's 《疏》〕** The four-term division above is, per 凡例二, this essay's own direct exposition. Chengguan reads the same gate as follows: 法界 is the **liberation of the dharmakāya-body**; 「法界虛空界」 is \"the range of its activity\" — emptiness here is the *emptiness of events* (事空), and 法界 embraces both event and principle, \"penetrating again and again\"; 「寂靜」 is **body** (體) and 「方便」 is **function** (用), their interfusion being what makes it a *bala*. He further takes 「普觀一切法悉自在」 as liberation of the **wisdom-body** (three senses) and 「知一切法不生等」 as liberation in **own-and-shared marks** (自共相解脫), with 無功用行 belonging to its \"外應群機\" — responding to the gather of sentients without effort. The two readings agree in direction but not in register: ours proceeds from glossing the terms, his from glossing this particular gate. See Appendix 8.1.1 (d), quoting `T35n1735` (via the `KR6e0021` recension, fascicle one).\n\n### 3.4 组二细读：可爱乐法光明幢天王（领少广、无量广、广果天众）\n\n> **经文**　復次，可愛樂法光明幢天王，得**普觀一切眾生根，為說法斷疑解脫門**。淨莊嚴海天王，得隨憶念令見佛解脫門。最勝慧光明天王，得法性平等無所依莊嚴身解脫門。自在智慧幢天王，得了知一切世間法一念中安立不思議莊嚴海解脫門。樂寂靜天王，得**於一毛孔現不思議佛剎無障礙解脫門**。普智眼天王，得入普門觀察法界解脫門。樂旋慧天王，得為一切眾生種種出現無邊劫常現前解脫門。善種慧光明天王，得觀一切世間境界入不思議法解脫門。無垢寂靜光天王，得示一切眾生出要法解脫門。廣大清淨光天王，得觀察一切應化眾生令入佛法解脫門。\n\n*编者按（共十王十解脱门）*\n\n**疏解**　「幢」（*dvaja*）者，高显之标帜；「可爱乐法光明幢」，谓以佛法之光明为幢，立为众生所乐见之标。此组领「少广、无量广、广果」三天天众（第四禅）——卷一「色界天五众」立有「广果天」（见 2.12、3.2 注②），此处复于其下开出「少广」「无量广」两层，合为四禅三层而颂之（四禅极顶之大自在天，已为 3.3 组一并入首组）。四禅为凡圣共居之禅，故本组之解脱门不涉欲界之「远离」义，而多就**观**（法界、法性、佛剎之相）上立门。可粗分四类：\n\n- **「观根」以至「断疑」**：领众之门「普观一切众生根，为说法断疑」——观根、说法、断疑三事一脉：观根者，知其机之所堪；说法者，投其器而说之；断疑者，竟其劝发之功。以一句而尽一段施化次第者，诸组头门中此为最明。\n- **「入法」以见体**：最胜慧光明「法性平等无所依庄严身」、普智眼「入普门观察法界」、善种慧光「观一切世间境界入不思议法」——皆以观法身法界为门，正四禅「舍念清净」之相。\n- **「现化」以应机**：净庄严海「随忆念令见佛」、乐旋慧「为一切众生种种出现无边劫常现前」、广大清净光「观察一切应化众生令入佛法」——随忆则现、劫劫现前、应化入法。\n- **「一毛孔现剎」**：乐寂静「于一毛孔现不思议佛剎无障碍」——毛孔纳剎，即卷一「毛端容世界」之喻（见 2.6）；同组颂言「过去所有诸国土，一毛孔中皆示现」「十方所有诸国土，悉在其中而说法」，其致一也。\n\n**颂言（本组十偈，逐偈末句各点一王名）：**\n\n> **经文**　諸佛境界不思議 一切眾生莫能測　普令其心生信解 廣大意樂無窮盡。\n> 若有眾生堪受法 佛威神力開導彼　令其恒覩佛現前 嚴海天王如是見。\n> 一切法性無所依 佛現世間亦如是　普於諸有無依處 此義勝智能觀察。\n> 隨諸眾生心所欲 佛神通力皆能現　各各差別不思議 此智幢王解脫海。\n> 過去所有諸國土 一毛孔中皆示現　此是諸佛大神通 愛樂寂靜能宣說。\n> 一切法門無盡海 同會一法道場中　如是法性佛所說 智眼能明此方便。\n> 十方所有諸國土 悉在其中而說法　佛身無去亦無來 愛樂慧旋之境界。\n> 佛觀世法如光影 入彼甚深幽奧處　說諸法性常寂然 善種思惟能見此。\n> 佛善了知諸境界 隨眾生根雨法雨　為啟難思出要門 此寂靜天能悟入。\n> 世尊恒以大慈悲 利益眾生而出現　等雨法雨充其器 清淨光天能演說。\n\n**疏解（颂言例解）**　首偈「诸佛境界不思议，一切众生莫能测」而「普令其心生信解」——**境不可测而疑可断，其枢在一「信解」**，正与头门「断疑」相承接。五、七两偈并在一「毛孔」上着笔：「过去所有诸国土，一毛孔中皆示现」「十方所有诸国土，悉在其中而说法」——此即乐寂静「一毛孔现不思议佛剎」之门；七偈「佛身无去亦无来」与乐旋慧「常现前」相反而相成：现前无尽而身无去来，故能于十方同处说法。二偈「若有众生堪受法，佛威神力开导彼」——「堪受法」三字即「普观一切众生根」之注脚；九、十两偈「随众生根雨法雨」「等雨法雨充其器」并以「法雨」收局，仍归「根」上施化之本义。\n\n> **EN corresponding · 3.4 Group Two: The King of the Lovable Banner of Dharma-Radiance, Fourth Dhyāna（少广·无量广·广果）**\n>\n> The \"Banner of Dharma-Radiance that beings love to behold\" (可愛樂法光明幢; *dvaja*, a tall standard) leads the little-vast, immeasurably-vast, and vast-fruit (Bṛhatphala) heavens of the fourth dhyāna, beneath the Great-Freedom heaven already read as Group One. Its gates are all contemplative: 法性平等 (the sameness of dharmatā), 普門觀察法界 (the all-gates contemplation of the dharmadhātu), and the head-gate which is a complete little curriculum of conversion in a single phrase — \"contemplating the faculties of all beings, teaching the Dharma for them, and cutting through their doubt\" (普觀一切眾生根為說法斷疑). The most striking is 樂寂靜's \"in a single pore-hole appear inconceivable Buddha-lands without obstruction\" (一毛孔現不思議佛剎無障礙) — the very pore-hole-admits-all-worlds image met at 卷一's 毛端容世界 (2.6), to which two of the ten stanzas answer: \"all the lands of the past appear in a single pore-hole,\" and \"all the lands of the ten directions, within them he teaches the Dharma.\" Each stanza ends on a named king, and the whole closes on \"rain of Dharma\" (法雨) given according to roots — the head-gate, once more.\n\n### 3.5 组三细读：清净慧名称天王（领少净、无量净、遍净天众）\n\n> **经文**　復次清淨慧名稱天王，得了達一切眾生解脫道方便解脫門。最勝見天王，得隨一切諸天眾所樂如光影普示現解脫門。……須彌音天王，得隨諸眾生永流轉生死海解脫門。\n\n*编者按（编按原文：「三禅遍净天十一王十一解脱门」）*\n\n**疏解**　本组领「少净、无量净、遍净」三净天众（第三禅，即遍净天界），已离欲界及二禅以下之染净，故其解脱门皆以「出离」与「随化」为宗。组内共十一王，可分五类：\n\n- **清净慧名称天王**得其「了达一切众生解脱道方便」——知其解脱之道，复能以方便导之。\n- **最胜见天王**得「随一切诸天众所乐如光影普示现」——随众所乐为示现，如光影之不实而能现。\n- **寂静德天王**得「普严净一切佛境界大方便」——以净严佛境为德。\n- **须弥音天王**得「随诸众生永流转生死海」——**「随……流转」而非「度……流转」**：此解脱门之义，在随众生于流转之中而不捨离，正与「以四摄事摄受」相应。\n- **净念眼天王**得「忆念如来调伏众生行」——忆佛之行以为趣向。\n- **可爱乐普照天王**得「普门陀罗尼海所流出」——总持之法自陀罗尼海流出。\n- **世间自在主天王**得「能令众生值佛生信藏」——教化的要点在令众生「值佛生信」。\n- 其余（光燄自在天王、乐思惟法变化天王、变化幢天王、星宿音妙庄严天王）门名见组内原文与附录。\n\n**颂言（本组十一偈，逐偈与上首诸王名目相摄）：**\n\n> **经文**　了知法性無礙者 普現十方無量剎　說佛境界不思議 令眾同歸解脫海。\n> 如來處世無所依 譬如光影現眾國　法性究竟無生起 此勝見王所入門。\n> 無量劫海修方便 普淨十方諸國土　法界如如常不動 寂靜德天之所悟。\n> 眾生愚癡所覆障 盲暗恒居生死中　如來示以清淨道 此須彌音之解脫。\n> 諸佛所行無上道 一切眾生莫能測　示以種種方便門 淨眼諦觀能悉了。\n> 如來恒以總持門 譬如剎海微塵數　示教眾生遍一切 普照天王此能入。\n> 如來出世甚難值 無量劫海時一遇　能令眾生生信解 此自在天之所得。\n> 佛說法性皆無性 甚深廣大不思議　普使眾生生淨信 光焰天王能善了。\n> 三世如來功德滿 化眾生界不思議　於彼思惟生慶悅 如是樂法能開演。\n> 眾生沒在煩惱海 愚癡見濁甚可怖　大師哀愍令永離 此化幢王所觀境。\n> 如來恒放大光明 一一光中無量佛　各各現化眾生事 此妙音天所入門。\n\n**疏解（颂言例解）**　此十一偈为「清净慧名称天王」领众所颂。其文格全品一致：**每颂前二句赞佛，后二句结入一解脱门（以「此X王「之义括之）**——观此颂可知《华严》颂体之法：\n\n- **「普现十方无量刹」** 与「如来处世无所依」：两颂皆以「无碍」与「无所依」为法性之相——佛之普遍，不因有所住而遍。\n- **「众生没在烦恼海」为首数种最警策之一**：颂以「生死海」「烦恼海」为喻，与「清净慧名称」之名相照——此法门之要在「出烦恼海」而又「于海中施化」。\n- **「一一光中无量佛」**：颂末两行点出「放大光明」，与卷一光明之喻相接，且界此明光为「佛身光明」——此一头是全书「光」之枢纽。\n\n**〔存疑〕** 十一颂为一组十一王而颂，除首颂为清净慧名称天王自说外，其余十颂末句各点一位王名（最胜见、寂静德、须弥音、净念眼、可爱乐普照、世间自在主、光燄自在、乐思惟法变化、变化幢、星宿音妙庄严）。今第十一颂「此妙音天所入门」中之「妙音天」，**本文推断即组内未以全名点出之「星宿音妙庄严天王」**（其名中含「音」「妙」二字），系本文推断而非原文明言，〔存疑〕待核。\n\n> **EN corresponding · 3.5 Group Three: The King of Pure Wisdom and Renown over the Third Dhyāna Heavens**\n>\n> This group leads the Pure and Sublime Pure heavens; being beyond the desire realm, its liberation-gates all turn on \"departure.\" The reader will notice immediately the form of the gāthās, which is identical throughout the chapter: two lines of praise to the Buddha, two lines tying the achievement to a named 天's own gate — \"this is what X king entered as a gate\" (此X王所入門). Two examples carry special weight. \"Beings are sunk in the sea of afflictions; dull and blind, they abide in birth-and-death; the Great Teacher in compassion makes them ever depart\" (眾生沒在煩惱海 愚癡見濁甚可怖 大師哀愍令永離 此化幢王所觀境) — the \"sea\" of 生死 here rhymes with the \"sea\" of the opening paragraph, and the very gates that depart from the sea are stated to operate within it: the merit of 隨諸眾生永流轉生死海, \"accompanying beings who ever wander in the sea of birth-and-death,\" is departure that does not abandon. And \"in each light there are immeasurable Buddhas\" (一一光中無量佛) closes the group on light, the master-symbol of the whole chapter.\n\n### 3.6 组四细读：可爱乐光明天王（领少光、无量光、极光天众）\n\n> **经文**　復次，可愛樂光明天王，得**恒受寂靜樂，而能降現消滅世間苦解脫門**。清淨妙光天王，得大悲心相應海一切眾生喜樂藏解脫門。自在音天王，得一念中普現無邊劫一切眾生福德力解脫門。最勝念智天王，得普使成住壞一切世間皆悉如虛空清淨解脫門。可愛樂淨妙音天王，得愛樂信受一切聖人法解脫門。善思惟音天王，得能經劫住演說一切地義及方便解脫門。演莊嚴音天王，得一切菩薩從兜率天宮沒下生時大供養方便解脫門。甚深光音天王，得觀察無盡神通智慧海解脫門。廣大名稱天王，得一切佛功德海滿足出現世間方便力解脫門。最勝淨光天王，得如來往昔誓願力發生深信愛樂藏解脫門。\n\n*编者按（共十王十解脱门）*\n\n**疏解**　「可爱乐光明」——光明可悦乐，与组二「法光明幢」之「幢」相映：一以幢言，一以光明言，皆取「光」之标。此组领「少光、无量光、极光」（光音，*ābhāsvara*）三天天众（第二禅）。**二禅诸天以光为语**，故本组十王之名带「音」者多至五位——自在音、可爱乐净妙音、善思惟音、演庄严音、甚深光音——**名号之「音」正与天名之「光音」相映成趣**，此为读名号时值得玩味的一层。其解脱门可粗分三类：\n\n- **「乐」与「苦」相融**：领众之门「恒受寂静乐，而能降现消灭世间苦」——二字相对而一笔融之：「恒受」其寂，「降现」其悲，寂而能降，乐而无住。清净妙光「大悲心相应海一切众生喜乐藏」，与头门同致。\n- **「劫」与「世」之成坏**：自在音「一念中普现无边劫一切众生福德力」、最胜念智「普使成住坏一切世间皆悉如虚空清净」——一取无边劫，一取成住坏空；最胜念智以「虚空清净」收束「成住坏」，明世间虽成坏而性本空。\n- **「行」之感应在下生际**：演庄严音「一切菩萨从兜率天宫没下生时大供养方便」——「兜率下生」即诸佛最后身成道之前相（先升兜率，由彼没而诞生阎浮）；此以「大供养方便」为门，是就下生一刹那上作无量广大之供养。\n\n**颂言（本组十偈，逐偈末句各点一王名）：**\n\n> **经文**　我念如來昔所行 承事供養無邊佛　如本信心清淨業 以佛威神今悉見。\n> 佛身無相離眾垢 恒住慈悲哀愍地　世間憂患悉使除 此是妙光之解脫。\n> 佛法廣大無涯際 一切剎海於中現　如其成壞各不同 自在音天解脫力。\n> 佛神通力無與等 普現十方廣大剎　悉令嚴淨常現前 勝念解脫之方便。\n> 如諸剎海微塵數 所有如來咸敬奉　聞法離染不唐捐 此妙音天法門用。\n> 佛於無量大劫海 說地方便無倫匹　所說無邊無有窮 善思音天知此義。\n> 如來神變無量門 一念現於一切處　降神成道大方便 此莊嚴音之解脫。\n> 威力所持能演說 及現諸佛神通事　隨其根欲悉令淨 此光音天解脫門。\n> 如來智慧無邊際 世中無等無所著　慈心應物普現前 廣大名天悟斯道。\n> 佛昔修習菩提行 供養十方一切佛　一一佛所發誓心 最勝光聞大歡喜。\n\n**疏解（颂言例解）**　此组之颂与诸组最异者，在**首偈以「我念」起**——余组首偈皆就佛身、佛境直赞（「佛身普遍」「诸佛境界」「了知法性」），独本组首偈作「我念如来昔所行，承事供养无边佛」，领众自陈其所忆念，正与组末最胜净光「如来往昔誓愿力发生深信爱乐藏」之门首尾相照；而「以佛威神今悉见」之「今悉见」承「我念」而来：**今之现见，即昔所修信业之果，中间以「佛威神」为桥**——此为全组之警句。次则三偈「一切剎海于中现，如其成坏各不同」、四偈「普现十方广大剎，悉令严净常现前」并以「剎海于中现」「刹现」应自在音、最胜念智成坏二门；七偈「降神成道大方便」则演庄严音「兜率下生」之门。\n\n> **EN corresponding · 3.6 Group Four: The King of Lovable Radiance, Second Dhyāna（少光·无量光·极光）**\n>\n> Group Four leads the few-light, immeasurable-light, and extreme-light heavens (the second dhyāna), whose top storey is 光音 — literally \"light-sound,\" *ābhāsvara*, a heaven whose beings converse by light. No fewer than five of the ten kings carry 音 in their names (自在音、愛樂淨妙音、善思惟音、演莊嚴音、甚深光音), a mirror of the heaven's name. Its gates bind joy to sorrow: the head-gate \"ever receiving the stillness-freedom, yet able to come down and extinguish the world's suffering\" (恆受寂靜樂而能降現消滅世間苦) — stillness that descends, joy that does not rest; and 最勝念智 dissolves the four phases of the world's cycle (成住壞空) into \"pure as empty space.\" The verses alone among the twelve groups open with the first person — \"I recall the Tathāgata's former practice, served and offered to Buddhas without end… with the Buddha's 威神 now all is seen\" — tying the present seeing (今悉見) to the meritorious faith-gifts of the past, with the Buddha's might as the bridge; and the head's \"now all is seen\" is the closest Book Two comes to a confession of past lives.\n\n### 3.7 组五细读：尸弃大梵王（领梵身、梵辅、梵众、大梵天众）\n\n> **经文**　復次，尸棄梵王，得**普住十方道場中說法而所行清淨無染著解脫門**。慧光梵王，得使一切眾生入禪三昧住解脫門。善思慧光明梵王，得普入一切不思議法解脫門。普雲音梵王，得入諸佛一切音聲海解脫門。觀世言音自在梵王，得能憶念菩薩教化一切眾生方便解脫門。寂靜光明眼梵王，得現一切世間業報相各差別解脫門。普光明梵王，得隨一切眾生品類差別皆現前調伏解脫門。變化音梵王，得住一切法清淨相寂滅行境界解脫門。光耀眼梵王，得於一切有無所著、無邊際、無依止、常勤出現解脫門。悅意海音梵王，得常思惟觀察無盡法解脫門。\n\n*编者按（共十梵王十解脱门）*\n\n**疏解**　「尸弃」梵言 *Śikhin*，义为「有顶髻」；「尸弃大梵王」即初禅大梵天之天主——初禅四天（梵身、梵辅、梵众、大梵）以大梵天为首。**初禅为色界之始、离欲之界**：欲界众生以五欲为事，梵众则以「离欲清净」为习，故本组之门名多着「清净」「寂灭」「无染著」。此组领起之语又不作常例「承佛威力」而作「**承佛神力**」——是为袖珍版全卷唯此一处之特殊，然据 T279 复核，第 12 组月天子亦作「神力」、第 6 组自在天王作「威神」，故「唯一」之说仅袖珍版口径成立（见 3.2 注①）。其解脱门可粗分三类：\n\n- **「说法」而无染**：领众之门「普住十方道场中说法而所行清净无染著」——「住十方道场」「说法」而行清净无染，说法而不染于说相。\n- **「禅定」为初梵之业**：慧光梵「使一切众生入禅三昧住」——梵众以禅为业，此门直令众生「入禅三昧而住」，门契其居（禅院名相：初禅即梵众之界）。\n- **「去来」空而「现」常在**：光耀眼梵「于一切有无所著、无边际、无依止、常勤出现」——四重遮遣（无著、无边际、无依止）而终归于「常勤出现」：遮而无住，现而不息。\n\n**颂言（本组十偈，逐偈末句各点一梵王名）：**\n\n> **经文**　佛身清淨常寂滅 光明照耀遍世間　無相無行無影像 譬如空雲如是見。\n> 佛身如是定境界 一切眾生莫能測　示彼難思方便門 此慧光王之所悟。\n> 佛剎微塵法門海 一言演說盡無餘　如是劫海演不窮 善思慧光之解脫。\n> 諸佛圓音等世間 眾生隨類各得解　而於音聲不分別 普音梵天如是悟。\n> 三世所有諸如來 趣入菩提方便行　一切皆於佛身現 自在音天之解脫。\n> 一切眾生業差別 隨其因感種種殊　世間如是佛皆現 寂靜光天能悟入。\n> 無量法門皆自在 調伏眾生遍十方　亦不於中起分別 此是普光之境界。\n> 佛身如空不可盡 無相無礙遍十方　所有應現皆如化 變化音王悟斯道。\n> 如來身相無有邊 智慧音聲亦如是　處世現形無所著 光耀天王入此門。\n> 法王安處妙法宮 法身光明無不照　法性無比無諸相 此海音王之解脫。\n\n**疏解（颂言例解）**　此组之颂全就「佛身」着力——十偈之中八偈以「佛身」「身相」发端或承转（「佛身清净」「佛身如是定境界」「佛身如空不可尽」「如来身相无有边」）；以梵众之长（禅定）观佛，则佛身处处是「定境界」「清净」「寂灭」，是为**以类相感**。二偈「佛身如是定境界」明点「定」字，与慧光梵「入禅三昧住」之门相照；四偈「诸佛圆音等世间，众生随类各得解」与「而于音声不分别」并陈——随类得解而不分别，正是梵众「以音说法」之相（梵王多名以「音」：普云音、观世言音、变化音、悦意海音，与组四「光音」诸王同致）。警句首推末偈「**法王安处妙法宫，法身光明无不照**」——以「法王」「法宫」「法身」三「法」字收束初禅梵众之颂，光照十方而无相无比。\n\n> **EN corresponding · 3.7 Group Five: Brahmā Śikhin, the Great Brahmā-lord（初禅）**\n>\n> Śikhin (尸棄, \"wearing the top-knot\") is the Great Brahmā king of the first dhyāna, leading the four Brahma heavens (Brahma-body, Brahma-attendant, Brahma-multitude, Great Brahma) — the lowest of the form realms, the first realm that is free of desire. Its gate-names are studded with \"pure,\" \"extinct,\" and \"untrammelled\": the head-gate \"abides in the bodhimandas of the ten directions teaching the Dharma, while its conduct is pure and free of attachment,\" and a companion gate \"causes all beings to enter and abide in the samādhi of dhyāna\" — the meditative work that is the Brahmā heavens' own element. In the 袖珍版 kept here this is the only group whose verses open with 承佛**神力** rather than 承佛威力 (T279's recension also reads 神力 at the moon-deities and 威神 at 自在 — table note ①). All ten stanzas circle the Buddha's body: \"the Buddha's body is pure, ever calm and extinct, its light shining through all the world; formless, traceless, it is seen as one sees an empty cloud\" — the Brahmā multitudes, whose element is dhyāna, behold in the Buddha's person the very marks of dhyāna.\n\n### 3.8 组六细读：自在天王（他化自在天众）\n\n> **经文**　復次，自在天王，得**現前成熟無量眾生自在藏解脫門**。善目主天王，得觀察一切眾生樂令入聖境界樂解脫門。妙寶幢冠天王，得隨諸眾生種種欲解令起行解脫門。勇猛慧天王，得普攝為一切眾生所說義解脫門。妙音句天王，得憶念如來廣大慈增進自所行解脫門。妙光幢天王，得示現大悲門摧滅一切憍慢幢解脫門。寂靜境天王，得調伏一切世間瞋害心解脫門。妙輪莊嚴幢天王，得十方無邊佛隨憶念悉來赴解脫門。華光慧天王，得隨眾生心念普現成正覺解脫門。因陀羅妙光天王，得普入一切世間大威力自在法解脫門。\n\n*编者按（共十王十解脱门）*\n\n**疏解**　「他化自在天」（*paranirmita-vaśavartin*）为欲界六天最上，其天主「自在天王」即本组之首——卷二组讫此，遂由色界入欲界。**然欲望之顶，反以「自在」为名**：他化自在者，受用诸乐不假自化、取于他化而得自在，故名「自在」。本品第六会即于「他化自在天王宫摩尼宝藏殿」开演（见 2.2 会处表与图谱 site_paranirmita），此组领众适为彼会之天主——华严以「自在」贯欲顶与法门：头门「现前成熟无量众生自在藏」，**成熟众生而曰「现前」、号「自在藏」，谓应机成熟、无有后期**。又此组之领起，T279 原文正作「**承佛威神，遍观一切自在天众而说颂言**」——即 1.5 节所举「威神」之实例，袖珍版作「承佛威力，普观」，两说并存（见 3.2 注①）。其解脱门可粗分四类：\n\n- **「自在」为纲**：领众「现前成熟无量众生自在藏」、因陀罗妙光「普入一切世间大威力自在法」——一头一尾皆以「自在」立门，结得本组之纲。\n- **「慈」「悲」之用**：妙音句「忆念如来广大慈增进自所行」、妙光幢「示现大悲门摧灭一切憍慢幢」——慈以增益自行，悲以摧灭憍慢；「憍慢幢」对「大悲门」，幢幢相对，以悲门摧慢幢，正应第六偈「一切众生慢高山，十力摧殄悉无余」。\n- **「瞋」「乐」之调**：寂静境「调伏一切世间瞋害心」、善目主「观察一切众生乐令入圣境界乐」——一除其瞋害，一导世间乐入于圣乐。\n- **「应念」而现**：妙轮庄严幢「十方无边佛随忆念悉来赴」、华光慧「随众生心念普现成正觉」——随念来赴、随念成正觉；欲界众生心念最炽，故以「随念普现」为摄受之门。\n\n**颂言（本组十偈，逐偈末句各点一王名）：**\n\n> **经文**　佛身周遍等法界 普應眾生悉現前　種種教門常化誘 於法自在能開悟。\n> 世間所有種種樂 聖寂滅樂為最勝　住於廣大法性中 妙眼天王觀見此。\n> 如來出現遍十方 普應群心而說法　一切疑念皆除斷 此妙幢冠解脫門。\n> 諸佛遍世演妙音 無量劫中所說法　能以一言咸說盡 勇猛慧大之解脫。\n> 世間所有廣大慈 不及如來一毫分　佛慈如空不可盡 此妙音天之所得。\n> 一切眾生慢高山 十力摧殄悉無餘　此是如來大悲用 妙光幢王所行道。\n> 慧光清淨滿世間 若有見者除癡暗　令其遠離諸惡道 寂靜天王悟斯法。\n> 毛孔光明能演說 等眾生數諸佛名　隨其所樂悉得聞 此妙輪幢之解脫。\n> 如來自在不可量 法界虛空悉充滿　一切眾會皆明覩 此解脫門華慧入。\n> 無量無邊大劫海 普現十方而說法　未曾見佛有去來 此主光天之所悟。\n\n**疏解（颂言例解）**　首偈「佛身周遍等法界，普应众生悉现前，种种教门常化诱，**于法自在能开悟**」——「于法自在」四字双关：自在天王之名与究竟「于法自在」，一名双义，正以欲界顶天之「自在」归诸法之「自在」。二偈「世间所有种种乐，圣寂灭乐为最胜」与善目主「众生乐→圣境界乐」之门相照——**欲界众生在「乐」上流转，故此组「乐」字再三再四出现（世间乐、圣寂灭乐、圣境界乐）**；五、六二偈又是一对——五偈「世间所有广大慈，不及如来一毫分」言「慈」，六偈「一切众生慢高山，十力摧殄悉无余」言「慢」，慈与慢两山对举，而以十力摧慢、以毫分慈显如来大悲，正妙光幢「摧灭憍慢幢」之门。末偈「未曾见佛有去来，此主光天之所悟」——「主光天」一名今组内无其全名。〔存疑〕**本文推断即组内「因陀罗妙光天王」**：因陀罗（*Indra*）义为「主」，妙光、光天义相通贯——然此为本文推断，非原文明言，标〔存疑〕待核（同组例见 3.5 组三「妙音天」之推断）。\n\n> **EN corresponding · 3.8 Group Six: The King of Self-Transformation（他化自在）—— the Summit of the Desire Realm**\n>\n> Paranirmita-vaśavartin (他化自在) — the heaven whose enjoyments are freely enjoyed though made by others — is the topmost of the six desire-heavens; its lord 自在天王 opens Book Two's descent into the desire realm. It is also the heaven of the sixth assembly (他化自在天王宮摩尼寶藏殿; graph node *site_paranirmita*), so the group's leader is the very lord of that assembly. The name 自在 (\"free, self-owned\") is the whole programme: the head-gate \"the store of freedom of ripening numberless beings in the present,\" the tail-gate \"the great-power freedom entering all the world\" — ten gates whose middle acts on desire's own passions: 憍慢, arrogance as a \"banner,\" crushed by the gate of great compassion's \"gate\"; 瞋害, hatred, \"tamed.\" And 妙輪莊嚴幢 and 華光慧 answer beings \"coming at the thought\" and \"appearing as awakening as the mind thinks\" — for it is precisely in the desire realm that mind-thought rages, so conversion works through 隨念. The verses play the name twice over: 於法自在 — freedom within the Dharma — answers the king's own title. The final signature 主光天, taken with the group's last member 因陀羅妙光 (*Indra* = \"lord,\" 妙光 = radiance), is this essay's inference (〔存疑〕), not the text's explicit name.\n\n> **〔本组批编务说明〕** 以下 3.9–3.14 六节（组七至组十二）为本批新增。**所据底本为 T279（八十华严 CBETA）**，颂文、门名、偈数（组七 10、组八 10、组九 10、组十 11、组十一 11、组十二 10 偈）与门数（组七 11、组八 10、组九 10、组十 11、组十一 11、组十二 10 门）皆逐字复核 T279 卷二原文，与 3.2 表一致。**〔待续〕历代注疏尚未逐组录入**——澄观《疏》本品卷二组七至组十二之逐组疏解本项目未取得（见附录八.1.2 待续台账），故本批六节之「疏解」皆为**本文自撰**，凡属推断者已标〔存疑〕，**不得据本文推测澄观之说**。组十第十一门「智日眼天子」之门名作「受生善根𢔌無癡惑」，其中「𢔌」为罕字，字义待考〔待核〕，本文暂依原样存录、不作臆改。\n\n### 3.9 组七细读：善化天王（领善化天众·化乐天）\n\n> **经文**　復次，善化天王，得**開示一切業變化力解脫門**。寂靜音光明天王，得捨離一切攀緣解脫門。變化力光明天王，得普滅一切眾生癡暗心令智慧圓滿解脫門。莊嚴主天王，得示現無邊悅意聲解脫門。念光天王，得了知一切佛無盡福德相解脫門。最上雲音天王，得普知過去一切劫成壞次第解脫門。勝光天王，得開悟一切眾生智解脫門。妙髻天王，得舒光疾滿十方虛空界解脫門。喜慧天王，得一切所作無能壞精進力解脫門。華光髻天王，得知一切眾生業所受報解脫門。普見十方天王，得示現不思議眾生形類差別解脫門。\n\n*编者按（共十一天王十一解脱门）*\n\n**疏解**　组七领「善化天众」，即欲界**化乐天**（Nandimitābhā），**六欲天之第五**（四天王、忉利、须夜摩、兜率、化乐、他化自在之第五），居组六（他化自在）之下、组八（兜率）之上。**「善化」者，以善为化、以化众生为德**；本组之门名，辞气一变前数组之庄严——不取「无量」「寂静」等定境语，而多就**业、智、行**立。其门可粗分四类：\n\n- **「业」上立门**：善化天王「開示一切業變化力」、華光髻「知一切眾生業所受報」——**业有二义：业之变现（业变力）与业之受报（受报），二者一为因、一为果，本组以「知其业」而「开其变」为解脱**。故颂云「业性因缘不可思，佛为世间皆演说」。\n- **「智」上立门**：變化力光明「普滅一切眾生癡暗心令智慧圓滿」、勝光「開悟一切眾生智」——**此二门正应卷二降序之理：自大自在（唯识）而下，渐次转入「开智」「化乐」**。\n- **「行」上立门**：喜慧「一切所作無能壞精進力」——**精进而「无能坏」**，即不随缘迁转之行，为化乐天「化」之基。\n- **「相」与「声」**：念光「了知一切佛無盡福德相」、莊嚴主「示現無邊悅意聲」——**相无尽、声悦意，二者皆就佛之「悦意」而设**。\n\n**颂言（本组十偈，逐偈末句各点一天王名）：**\n\n> **经文**　世間業性不思議 佛為群迷悉開示　巧說因緣真實理 一切眾生差別業。\n> 種種觀佛無所有 十方求覓不可得　法身示現無真實 此法寂音之所見。\n> 佛於劫海修諸行 為滅世間癡暗惑　是故清淨最照明 此是力光心所悟。\n> 世間所有妙音聲 無有能比如來音　佛以一音遍十方 入此解脫莊嚴主。\n> 世間所有眾福力 不與如來一相等　如來福德同虛空 此念光天所觀見。\n> 三世所有無量劫 如其成敗種種相　佛一毛孔皆能現 最上雲音所了知。\n> 十方虛空可知量 佛毛孔量不可得　如是無礙不思議 妙髻天王已能悟。\n> 佛於曩世無量劫 具修廣大波羅蜜　勤行精進無厭怠 喜慧能知此法門。\n> 業性因緣不可思 佛為世間皆演說　法性本淨無諸垢 此是華光之入處。\n> 汝應觀佛一毛孔 一切眾生悉在中　彼亦不來亦不去 此普見王之所了。\n\n**疏解（颂言例解）**　首偈直点全组之纲：「世间业性不思議，佛为群迷悉開示，**巧说因缘真实理**，一切众生差别业」——**「差别业」三字承头、收尾，「因缘真实理」居中**：华严于此处最要紧的不是说「业」之善恶，而是说**「因缘」之真实**——业非自作，亦非他作，乃因缘所成；而此因缘「真实」不虚，故可「巧说」而令群迷得「悉开」。四偈「世间所有妙音声，无有能比如来音，佛以一音遍十方，入此解脱庄严主」以**一音遍十方**承佛音之不可思议，正应组六「于法自在能开悟」之自在音、六偈「世尊开阐法光明」（组十二）；**华严言音，恒以「一音」「无碍」为极则。** 六偈「三世所有无量劫……佛一毛孔皆能现」与组二「一毛孔中皆示现」（乐寂静）同——**毛孔含劫为一、含剎为一，此华严「毛孔」之两大颂例**。十偈「汝应观佛一毛孔，一切众生悉在中，彼亦不来亦不去」以**「汝应观」**作结，为卷二唯一以「观」直接呼受众生的颂结。\n\n> **EN corresponding · 3.9 Group Seven: The King of Wholesome Transformation（化乐天）**\n>\n> Group seven leads the 化樂天 (Nandimitābhā), the fifth of the six desire-heavens. Where the form-realm groups spoke of vastness and stillness, this group speaks in the register of **karma and wisdom**: its head-gate is the power whereby karma is transformed, and its brother-gates know the recompense karma brings and extinguish the folly-dark of the mind. Its ten verses open on the theme that governs Huayan's whole descent — karma is not self-made but arises from causes and conditions, and those causes are real (因緣真實), which is precisely why they can be 「巧說」 to the deluded. The verses also give Book Two its two great 毛孔 stanzas — 「佛一毛孔皆能現」 here, 「一毛孔中皆示現」 in group two — and close with the only line in Book Two that turns directly to the reader: 「汝應觀佛一毛孔」, \"you should look at one pore-hole of the Buddha: all beings are there within it, and neither do they come nor do they go.\"\n\n### 3.10 组八细读：知足天王（领知足天众·兜率天）\n\n> **经文**　復次，知足天王，得**一切佛出興世圓滿教輪解脫門**。喜樂海髻天王，得盡虛空界清淨光明身解脫門。最勝功德幢天王，得消滅世間苦淨願海解脫門。寂靜光天王，得普現身說法解脫門。善目天王，得普淨一切眾生界解脫門。寶峯月天王，得普化世間常現前無盡藏解脫門。勇健力天王，得開示一切佛正覺境界解脫門。金剛妙光天王，得堅固一切眾生菩提心令不可壞解脫門。星宿幢天王，得一切佛出興咸親近觀察調伏眾生方便解脫門。妙莊嚴天王，得一念悉知眾生心隨機應現解脫門。\n\n*编者按（共十天王十解脱门）*\n\n**疏解**　组八领「知足天众」，即欲界**兜率天**（Tuṣita），**六欲天之第四**。**「知足」者，知其分际而止**——兜率天位高而不居，佛不以之为究竟；华严写兜率，唯取其实德「念持诸佛名号」（见 2.1 甲戌条），而本组头门正是一轮**「佛出兴世圆满教轮」**——**教以「轮」为喻者，取其转而不离、圆而无缺**；「知足」之众，所足者非福报，乃**闻教之圆满**。其门可粗分四类：\n\n- **「教」与「身」**：知足「一切佛出興世圓滿教輪」、星宿幢「一切佛出興咸親近觀察調伏眾生方便」——**此二门皆就「佛出兴世」立**：一轮教化普现，一声教遍相亲近。歡喜喜乐海髻「盡虛空界清淨光明身」——**身遍虚空而清净光明**，与组七「一音遍十方」为声身之对。\n- **「苦」与「愿」**：最勝功德幢「消滅世間苦淨願海」——**苦尽而净愿成海**，此即组九首偈「已竭世间忧恼海」之前奏。\n- **「菩提心」为基**：金剛妙光「堅固一切眾生菩提心令不可壞」——**「金刚」「不可坏」二词**，以此组为兜率天内院之严整。\n- **「随机应现」为行**：妙莊嚴「一念悉知眾生心隨機應現」——**一念知心、随机应现**，此即华严「随其心念而现」之义（参组六「随众生心念普现成正觉」）。\n\n**颂言（本组十偈，逐偈末句各点一天王名）：**\n\n> **经文**　如來廣大遍法界 於諸眾生悉平等 普應群情闡妙門 令入難思清淨法。\n> 佛身普現於十方 無著無礙不可取 種種色像世咸見 此喜髻天之所入。\n> 如來往昔修諸行 清淨大願深如海 一切佛法皆令滿 勝德能知此方便。\n> 如來法身不思議 如影分形等法界 處處闡明一切法 寂靜光天解脫門。\n> 眾生業惑所纏覆 憍慢放逸心馳蕩 如來為說寂靜法 善目照知心喜慶。\n> 一切世間真導師 為救為歸而出現 普示眾生安樂處 峯月於此能深入。\n> 諸佛境界不可思議 一切法界皆周遍 入於諸法到彼岸 勇慧見此生歡喜。\n> 若有眾生堪受化 聞佛功德趣菩提 令住福海常清淨 妙光於此能觀察。\n> 十方剎海微塵數 一切佛所皆往集 恭敬供養聽聞法 此莊嚴幢之所見。\n> 眾生心海不思議 無住無動無依處 佛於一念皆明見 妙莊嚴天斯善了。\n\n**疏解（颂言例解）**　首偈「如来广大遍法界，**于诸众生悉平等**，普应群情阐妙门，令入难思清净法」——**「于诸众生悉平等」六字，为组八之眼**；平等者，非等量之平（欲界众生乐有差别），而是**等与大乘之遇**——能以「教轮」普现，故于群品而悉平等；三偈「一切佛法皆令满」即此意。末偈「众生心海不思議，**无住无动无依处**，佛于一念皆明见」——**心海本无住、无动、无依**，而佛于一念中皆明见之，此即「一念悉知众生心」之正解：非佛逐心而见，乃心本无住而自见。二偈「如影分形等法界」以**影**喻分身，与组一「影现」之喻遥相呼应。\n\n> **EN corresponding · 3.10 Group Eight: The King of Contentment（兜率天）**\n>\n> Group eight leads the 兜率天 (Tuṣita), the fourth desire-heaven, whose lord is called 「知足」— content, knowing one's measure. Huayan takes nothing from Tuṣita's eminence but its practice: the Tuṣita deities recite the Buddhas' names (§2.1 甲戌), and this group's head-gate is the complete wheel of a Buddha's teaching (圓滿教輪). Its eye is the sixth line of the opening stanza: 於諸眾生悉平等 — not a levelling of quantities (desire-heaven folk have plenty of quantities) but an equal provision of the Great Vehicle to every kind. Its closing stanza gives Book Two's fullest doctrine of mind: the sea of beings' minds is unmeasurable, 「無住無動無依處」, yet the Buddha sees it all in a single instant — the Buddha does not chase minds, but minds, abiding nowhere, are seen. The second stanza's 「如影分形」 (dividing the form as a shadow) echoes the 「影現」 imagery of Book One.\n\n### 3.11 组九细读：时分天王（领时分天众·须夜摩天）\n\n> **经文**　復次，時分天王，得**發起一切眾生善根令永離憂惱解脫門**。妙光天王，得普入一切境界解脫門。無盡慧功德幢天王，得滅除一切患大悲輪解脫門。善化端嚴天王，得了知三世一切眾生心解脫門。總持大光明天王，得陀羅尼門光明憶持一切法無忘失解脫門。不思議慧天王，得善入一切業自性不思議方便解脫門。輪𪗇天王，得轉法輪成熟眾生方便解脫門。光焰天王，得廣大眼普觀眾生而往調伏解脫門。光照天王，得超出一切業障不隨魔所作解脫門。普觀察大名稱天王，得善誘誨一切諸天眾令受行心清淨解脫門。\n\n*编者按（共十天王十解脱门）*\n\n**疏解**　组九领「时分天众」，`T279` 卷二作「**復有無量須夜摩天王**」，即欲界**须夜摩天**，**六欲天之第三**，位在三十三天之下、兜率之上〔梵名待核：汉译经典及《大智度论》以来「须夜摩」对应 *Nāgapratyakṣa*（此名实含「不喜见」之义，与须夜摩「厌夜」之义不合，历来即有异说），亦有作 *Candraprabha*、*Nanda* 等说，**本篇不取定译**〕。**「时分」者，日夜之分半**——夜摩天居半夜之位；华严写欲界之天，次序与其「夜」位相应。**本组诸门之辞，为卷二欲界诸组中最峻切者**——不取「喜乐」「悦意」，而多言「憂惱」「患」「業障」「魔」。其门可粗分四类：\n\n- **「根」之发起**：时分天王「發起一切眾生善根令永離憂惱」——**先发起善根，而后离忧恼；二语有次第**。此即组八「知足」之进一层：由「教轮」而「发根」。\n- **「境」与「心」之双入**：妙光「普入一切境界」、善化端嚴「了知三世一切眾生心」——**境为所缘，心为能缘，二者皆「普」或「三世」**；此组以「入」为纲。\n- **「總持」與「陀羅尼」**：總持大光明「陀羅尼門光明憶持一切法無忘失」——**陀罗尼（dhāraṇī，总持）**乃密咒之持，此门以「憶持一切法無忘失」为义，**为卷二诸门中少见的「忆持」语**。\n- **「輪」與「調伏」**：輪臍「轉法輪成熟眾生」、光焰「廣大眼普觀眾生而往調伏」——**一为自转（法轮）、一为往调（调伏）**；**「輪臍」者，轮之脐（中心）也**，寓法轮之核心。光焰天王之名「光焰」，与组五尸弃组「光耀眼」一类之「光」相类。\n\n**颂言（本组十偈，逐偈末句各点一天王名）：**\n\n> **经文**　佛於無量久遠劫 已竭世間憂惱海 廣闢離塵清淨道 永耀眾生智慧燈。\n> 如來法身甚廣大 十方邊際不可得 一切方便無限量 妙光明天智能入。\n> 生老病死憂悲苦 逼迫世間無暫歇 大師哀愍誓悉除 無盡慧光能覺了。\n> 佛如幻智無所礙 於三世法悉明達 普入眾生心行中 此善化天之境界。\n> 總持邊際不可得 辯才大海亦無盡 能轉清淨妙法輪 此是大光之解脫。\n> 業性廣大無窮盡 智慧覺了善開示 一切方便不思議 如是慧天之所入。\n> 轉不思議妙法輪 顯示修習菩提道 永滅一切眾生苦 此是輪臍方便地。\n> 如來真身本無二 應物隨形滿世間 眾生各見在其前 此是焰天之境界。\n> 若有眾生一見佛 必使淨除諸業障 離諸魔業永無餘 光照天王所行道。\n> 一切眾會廣如海 佛在其中最威耀 普雨法雨潤眾生 此解脫門名稱入。\n\n**疏解（颂言例解）**　首偈「**已竭世间忧恼海**，广辟离尘清净道，**永耀众生智慧灯**」——**「竭」「辟」「耀」三 verb 递进**：先竭其苦（海已干），再辟其道（尘已离），后耀其智（灯永明）。**此为卷二欲界六组中唯一以「离尘」为道者**——夜摩天处黑夜，正以「离尘」之清净道转之。六偈「转不思議妙法轮，显示修习**菩提道**」——**「显示修习菩提道」七字**，以「修习」为菩提道之实质，异于组八之「教轮」（教而后知）、组十之「忆念」（念而后见）。八偈「如来真身本无二，应物随形满世间，众生各见在其前」——**真身不二而应物随形**，此即华严「一多即多」之义（参 1.5 法身之喻）。\n\n> **EN corresponding · 3.11 Group Nine: The King of the Time-Half（須夜摩天）**\n>\n> Group nine leads the 須夜摩天, the third desire-heaven, whose name marks the half-night. Where group eight spoke of the 「知足」 and the 「滿」 wheel of teaching, this group's diction turns harsh and therapeutic: 憂惱, 患, 業障, 魔 — grief, affliction, karmic obstruction, demons. Its opening stanza moves by three verbs — the sea of grief is drained (竭), the path apart from dust is opened (辟), the lamp of wisdom shines forever (耀) — and 離塵, \"apart from dust,\" is this group's characteristic response to the night-heaven's condition. Its sixth stanza names the substance of the bodhisattva path explicitly: 「顯示修習菩提道」, showing and practising the path of awakening — the practice itself, not merely the hearing of a teaching (group eight) or the recollection of Buddhas (group ten). The eighth stanza is Huayan's classic non-duality formula: the true body is not two, yet fitting to things it fills the world, and each being sees it right before them.\n\n### 3.12 组十细读：释迦因陀罗天王（领一切三十三天众）\n\n> **经文**　復次，釋迦因陀羅天王，得**憶念三世佛出興乃至剎成壞皆明見大歡喜解脫門**。普稱滿音天王，得能令佛色身最清淨廣大世無能比解脫門。慈目寶髻天王，得慈雲普覆解脫門。寶光幢名稱天王，得恒見佛於一切世主前現種種形相威德身解脫門。發生喜樂髻天王，得知一切眾生城邑宮殿從何福業生解脫門。端正念天王，得開示諸佛成熟眾生事解脫門。高勝音天王，得知一切世間成壞劫轉變相解脫門。成就念天王，得憶念當來菩薩調伏眾生行解脫門。淨華光天王，了知一切諸天快樂因解脫門。智日眼天王，得開示一切諸天子受生善根𢔌無癡惑解脫門。自在光明天王，得開悟一切諸天眾令永斷種種疑解脫門。\n\n*编者按（共十一天王十一解脱门）*\n\n**疏解**　组十领「一切三十三天众」，**忉利天**（Trayastriṃśa，帝釋天所居，欲界第二层），为欲界六天中**位置最尊而组序最末于色界之下**——列于组九（须夜摩）与组十一（日天子）之间，几何上居六欲天之中。**领众作「释迦因陀罗天王」者，「释迦」即「释提桓因」之略（Śakra，帝釋天主），「因陀罗」为 Indra 之音译，二名同指一神**——**华严以「释迦因陀罗」称忉利天主，是本组与卷一「三十三天王」（甲辛条）之对应**（详见 2.1 甲辛条〔甲〕）。其门可粗分四类：\n\n- **「忆」与「见」**：释迦因陀罗「憶念三世佛出興乃至剎成壞皆明見大歡喜」、成就念「憶念當來菩薩調伏眾生行」——**一忆过去（已成之佛）、一忆当来（未成之菩萨）**，而所忆皆「明见」「调伏」；**此「忆」与组四（可爱乐光明）「我念如来昔所行」、组十首偈「我念三世一切佛」同为卷二「我念」之例**。\n- **「身」与「相」**：普稱滿音「令佛色身最清淨廣大世無能比」、寶光幢名稱「恒見佛於一切世主前現種種形相威德身」——**一以色身清净广大、一以形相威德现前**。\n- **「慈云」与「福业」**：慈目寶髻「慈雲普覆」、發生喜樂髻「知一切眾生城邑宮殿從何福業生」——**慈云覆之，而知其城邑宫殿之所从生**（福业所感），此二门一上一下。\n- **「成熟」与「转变」**：端正念「開示諸佛成熟眾生事」、高勝音「知一切世間成壞劫轉變相」——**一就佛之「成熟」、一就世之「转变」**；末门自在光明「令永斷種種疑」——**以「断疑」收束本组**，与组二「说法断疑」遥相呼应。\n\n**颂言（本组十一偈，逐偈末句各点一天王名）：**\n\n> **经文**　我念三世一切佛 所有境界悉平等 如其國土壞與成 以佛威神皆得見。\n> 佛身廣大遍十方 妙色無比利群生 光明照耀靡不及 此道普稱能觀見。\n> 如來方便大慈海 往劫修行極清淨 化導眾生無有邊 寶髻天王斯悟了。\n> 我念法王功德海 世中最上無與等 發生廣大歡喜心 此寶光天之解脫。\n> 佛知眾生善業海 種種勝因生大福 皆令顯現無有餘 此喜髻天之所見。\n> 諸佛出現於十方 普遍一切世間中 觀眾生心示調伏 正念天王悟斯道。\n> 如來智身廣大眼 世界微塵無不見 如是普遍於十方 此雲音天之解脫。\n> 一切佛子菩提行 如來悉現毛孔中 如其無量皆具足 此念天王所明見。\n> 世間所有安樂事 一切皆由佛出生 如來功德勝無等 此解脫處華王入。\n> 若念如來少功德 乃至一念心專仰 諸惡道怖悉永除 智眼於此能深悟。\n> 寂滅法中大神通 普應群心靡不周 所有疑惑皆令斷 此光明王之所得。\n\n**疏解（颂言例解）**　首偈「**我念**三世一切佛，所有境界悉平等，如其国土坏与成，**以佛威神皆得见**」——**「我念」二字，为全偈之纲**：忉利天主自陈其所忆念，忆及三世诸佛「境界悉平等」；而「国土坏与成」之相，随时间而变，唯**「以佛威神」**方能「皆得见」——**故此组之颂，紧承组六（自在）「未曾见佛有去来」之「威神」语，亦正为 1.5 所举 T279「威神」诸例之一**。六偈「观众生心示调伏」、十偈「若念如来少功德，乃至**一念心专仰**，诸恶道怖悉永除」——**「一念心专仰」五字，为忉利天主之自白**：帝釋曾于过去世供佛、习禅，于「一念心专仰」即能永除三恶道怖，**此为华严以天众身示皈依之最亲切处**。末第十一偈「寂灭法中大神通，普应群心靡不周，所有疑惑皆令断，**此光明王之所得**」——**以「寂灭法中」之大神通收束本组**（属自在光明天王「开悟一切诸天众令永断种种疑」之门）：**「疑」字既断于忉利天主，亦断于诸天**——本组遂以「断疑」为卷二诸门「断疑」一脉（组二「说法断疑」、组十二「普断一切疑惑」）之预收。\n\n> **EN corresponding · 3.12 Group Ten: The King Śakra-Indra（三十三天）**\n>\n> Group ten leads the 三十三天 (Trayastriṃśa), the second desire-heaven and the highest in the traditional six; its lord is styled 釋迦因陀羅天王 — Śakra and Indra being two names for one god, the counterpart of Book One's 「三十三天王」 (§2.1 甲辛). Its verses are the second (with group four's) to open in the first person: 「我念三世一切佛」, \"I recall all the Buddhas of the three times.\" What Śakra recalls is the Buddhas' \"境界悉平等\" — their lands' \"坏与成\" seen only 「以佛威神」, the very 「威神」 wording of §1.5. The group turns on 忆念 — of past Buddhas and of a future bodhisattva's saving work — and its closing stanza gives the most personal confession in Book Two: even a single thought of sincere refuge in the Buddha (「一念心專仰」) removes all fear of the evil paths. For the king of the Trayastriṃśa, a memory of a past Buddha is itself the way out of the triple hell.\n\n### 3.13 组十一细读：日天子（领一切日天子众·日宫）\n\n> **经文**　復次，日天子，得**淨光普照十方眾生盡未來劫常為利益解脫門**。光焰眼天子，得以一切隨類身開悟眾生令入智慧海解脫門。須彌光歡喜幢天子，得為一切眾生主令勤修無邊淨功德解脫門。淨寶月天子，得修一切苦行深心歡喜解脫門。勇猛不退轉天子，得無礙光普照令一切眾生益其精爽解脫門。妙華纓光明天子，得淨光普照眾生身令生歡喜信解海解脫門。最勝幢光明天子，得光明普照一切世間令成辦種種妙功德解脫門。寶髻普光明天子，得大悲海現無邊境界種種色相寶解脫門。光明眼天子，得淨治一切眾生眼令見法界藏解脫門。持德天子，得發生清淨相續心令不失壞解脫門。普運行光明天子，得普運日宮殿照十方一切眾生令成就所作業解脫門。\n\n*编者按（共十一天子十一解脱门）*\n\n**疏解**　组十一领「一切日天子众」，居**日宫**。**领众作「日天子」而不作「日天王」，与其居日宫、常以光明普照为职相应**（详见 2.1 甲〔乙〕：月显心宝、日增善根）。T279 领起作「承佛威力，**遍观**一切日天子众而说颂言」（遍观）。其门可粗分四类，而**十门中门门有「光」**——为卷二诸组之最：\n\n- **「光普照」而恒久**：日天子「淨光普照十方眾生盡未來劫常為利益」——**「尽未来劫常为利益」八字，为全组纲领**；日之光明无有间断，故此门以「普照」而「常为」并言。\n- **「光明」而「眼」**：光明眼「淨治一切眾生眼令見法界藏」、光焰眼「以一切隨類身開悟眾生令入智慧海」——**以光治眼，令众生「见法界藏」**；此即以「光」为「见」之条件。\n- **「精爽」与「欢喜信解」**：勇猛不退轉「令一切眾生益其精爽」、妙華纓光明「令生歡喜信解海」——**「精爽」（精神爽健）**一语，为日光明之效。\n- **「普运日宫殿」为终**：普運行光明「**普運日宮殿**照十方一切眾生令成就所作業」——**「普运日宫殿」五字，为本组之睛**：日天子不止自身放光，而**运其宫殿之光照十方**；此为组十二月宫之对照（月宫则「能持清净月普现十方」）。\n\n**颂言（本组十一偈，逐偈末句各点一天子名）：**\n\n> **经文**　如來廣大智慧光 普照十方諸國土 一切眾生咸見佛 種種調伏多方便。\n> 如來色相無有邊 隨其所樂悉現身 普為世間開智海 焰眼如是觀於佛。\n> 佛身無等無有比 光明照耀遍十方 超過一切最無上 如是法門歡喜得。\n> 為利世間修苦行 往來諸有無量劫 光明遍淨如虛空 寶月能知此方便。\n> 佛演妙音無障礙 普遍十方諸國土 以法滋味益群生 勇猛能知此方便。\n> 放光明網不可說 普淨一切諸含識 悉使發生深信解 此華纓天所入門。\n> 世間所有諸光明 不及佛一毛孔光 佛光如是不思議 此勝幢光之解脫。\n> 一切諸佛法如是 悉坐菩提樹王下 令非道者住於道 寶髻光明如是見。\n> 眾生盲闇愚癡苦 佛欲令其生淨眼 是故為然智慧燈 善目於此深觀察。\n> 解脫方便自在尊 若有曾見一供養 悉使修行至於果 此是德天方便力。\n> 一法門中無量門 無量千劫如是說 所演法門廣大義 普運光天之所了。\n\n**疏解（颂言例解）**　首偈「**如来广大智慧光**，普照十方诸国土，一切众生咸见佛，种种调伏多方便」——**以「智慧光」而不以「身光」起**：日光所照为物，智光所照为心，故下句即「一切众生咸见佛」。七偈「世间所有诸光明，**不及佛一毛孔光**，佛光如是不思议」——**「一毛孔光」之例又一**（参组二「一毛孔中皆示现」、组七「佛一毛孔皆能现」）；**华严以「毛孔」为光明之极细处，欲显光明之无待于大小。** 末偈「**一法门中无量门**，无量千劫如是說，所演法门广大义，普运光天之所了」——**「一法门中无量门」五字，为卷二唯一以「法门」自相开摄之句**：一法门中含无量门，无量千劫说不尽——此即华严「一即一切、一切即一」之义，为方东美「圆融无碍」之正解（参 3.16）。\n\n> **EN corresponding · 3.13 Group Eleven: The Sun-Deities（日宫）**\n>\n> Group eleven leads the sun-deities, styled 「日天子」 not 「日天王」 — lords of the sun-palace, whose office is radiance (§2.1 甲乙: the moon shows forth the mind-treasure, the sun increases the roots of goodness). All ten gates carry 「光」, the most light-saturated group in Book Two, and the head-gate binds the two: pure light illumining the beings of the ten directions, ever for their benefit, throughout every future age. Its most striking gate is the last: 普運行光明天子 「普運日宮殿」, universally transporting the sun-palace itself so its light reaches all — the sun-deities do not merely radiate, they move their palace. The verses keep the 毛孔 motif alive (「不及佛一毛孔光」) and close on the fascicle's most compressed non-dual formula: 「一法門中無量門」 — within one Dharma-gate, numberless gates; spoken through numberless kalpas without end.\n\n### 3.14 组十二细读：月天子（领月宫殿中诸天众会·月宫殿）\n\n> **经文**　復次，月天子，得**淨光普照法界攝化眾生解脫門**。華王髻光明天子，得觀察一切眾生界令普入無邊法解脫門。眾妙淨光天子，了知一切眾生心海種種攀緣轉解脫門。安樂世間心天子，得與一切眾生不可思議樂令踊躍大歡喜解脫門。樹王眼光明天子，得如田家作業種芽莖等隨時守護令成就解脫門。出現淨光天子，得慈悲救護一切眾生令現見受苦受樂事解脫門。普遊不動光天子，得能持清淨月普現十方解脫門。星宿王自在天子，得開示一切法如幻如虛空無相無自性解脫門。淨覺月天子，得普為一切眾生起大業用解脫門。大威德光明天子，得普斷一切疑惑解脫門。\n\n*编者按（共十天子十解脱门）*\n\n**疏解**　组十二为**卷二最末一组**，领「月宫殿中诸天众会」——**此为卷二组中唯一领起作「普观一切月宫殿中诸天众会」者，以「会」字收，而不作「众」**；且唯此组颂前作「**承佛神力**」（T279），末作「**而说颂曰**」（余皆「而说颂言」）（见 3.2 注①）。**组十二与组十一（日天子）为日月之对，而经文之措辞微别，可细辨其进退**：\n\n- **日门「照十方众生」，月门「照法界」**：日天子「淨光普照**十方眾生**盡未來劫常為利益」，月天子「淨光普照**法界**攝化眾生」——**日门但及众生，月门已及法界**；**此一进退，即卷二降序至末而「由光及界」之别**。\n- **日天子「普运日宫殿」，月天子「能持清净月普现十方」**：普運行光明天子「普運日宮殿照十方一切眾生」，普遊不動光天子「能持清淨月普現十方」——**日月二宫，一「运」一「持」，一为行、一为住**。\n- **「心寶」之呼应**：卷一甲〔甲〕云「月天子……皆勤显发众生心宝」（详见 2.1），本组「眾妙淨光」门「知一切眾生心海種種攀緣轉」、末门「大威德光明」「普斷一切疑惑」——**月之作用在「显发心宝」，故本组诸门多就「心海」「攀缘」立**。\n\n本组门名可粗分四类：\n\n- **「观」而「入」**：華王髻光明「觀察一切眾生界令普入無邊法」、星宿王自在天「開示一切法如幻如虛空無相無自性」——**一以众生界入无边法，一以诸法破自性**；「如幻如虚空无相无自性」六字，为卷二诸门中最彻底的去实化。\n- **「心海」与「攀缘」**：眾妙淨光「知一切眾生心海種種攀緣轉」——**「心海」喻心之浩瀚难测，「攀緣」喻心之逐境取著**；知其攀缘之转，即知众生心之病本。\n- **「乐」与「喜」**：安樂世間心「與一切眾生不可思議樂令踴躍大歡喜」——**与乐而令踊跃**；此为月宫之职（清凉之夜），与组六（自在）诸「乐」字异：组六之「乐」在「圣寂灭乐为最胜」（出欲界之乐），本组之「乐」在「与众生不可思议乐」（入众生之乐）。\n- **「守護」与「救護」**：樹王眼光明「如田家作業種芽莖等隨時守護令成就」、出現淨光「慈悲救護一切眾生令現見受苦受樂事」——**一以农事喻守护、一以救护令「现见」苦乐**；末门大威德光明「普斷一切疑惑」——**本卷最后之门，以「断疑」收束卷二**（其「断疑」与组二「说法断疑」、组十末偈「所有疑惑皆令断」同脉，而位置最末）。\n\n**颂言（本组十偈，逐偈末句各点一天子名）：**\n\n> **经文**　佛放光明遍世間 照耀十方諸國土 演不思議廣大法 永破眾生癡惑暗。\n> 境界無邊無有盡 於無量劫常開導 種種自在化群生 華髻如是觀於佛。\n> 眾生心海念念殊 佛智寬廣悉了知 普為說法令歡喜 此妙光明之解脫。\n> 眾生無有聖安樂 沈迷惡道受諸苦 如來示彼法性門 安樂思惟如是見。\n> 如來希有大慈悲 為利眾生入諸有 說法勸善令成就 此目光天所了知。\n> 世尊開闡法光明 分別世間諸業性 善惡所行無失壞 淨光見此生歡喜。\n> 佛為一切福所依 譬如大地持宮室 巧示離憂安隱道 不動能知此方便。\n> 智火大明周法界 現形無數等眾生 普為一切開真實 星宿王天悟斯道。\n> 佛如虛空無自性 為利眾生現世間 相好莊嚴如影像 淨覺天王如是見。\n> 佛身毛孔普演音 法雲覆世悉無餘 聽聞莫不生歡喜 如是解脫光天悟。\n\n**疏解（颂言例解）**　首偈「**佛放光明遍世间**，照耀十方诸国土，演不思議广大法，**永破众生痴惑暗**」——**卷二以此偈收**：以「光明」始（组一首偈「佛身普遍诸大会」亦以光明为纲），亦以「光明」终，而所破者「暗」；**月虽无光而能破暗，此月天子之所以为月**。八偈「智火大明周法界，现形无数等众生」——**「智火」与组五（尸弃）「光明照耀遍世间」之「明」又不同：日天之光明为「光」，月天则并「火」而周法界**。十偈「佛身毛孔普演音，法云覆世悉无余」——**毛孔演音、法云覆世**，此即卷一 2.3 菩提树「恒出妙音，说种种法无有尽极」之呼应，而由「树」移于「毛孔」，范围愈小而容量愈大。末二句「听闻莫不生欢喜，如是解脱光天悟」——**以「听闻」之欢喜收束全卷**，与组一（妙燄海）「为救世间而出现」之悲心相应：**一以救为起，一以欢喜为终**。\n\n> **EN corresponding · 3.14 Group Twelve: The Moon-Deities（月宮殿）—— the Last Group of Book Two**\n>\n> Group twelve is the last of Book Two, leading the moon-deities, and its lead-in is the only 「承佛神力」 of the fascicle (T279) and the only 「而說頌曰」. Paired with group eleven (the sun), it turns on one degree of difference: the sun-gate illumines 「十方眾生」, the moon-gate illumines 「法界」 and gathers beings in — from light over beings to light over the dharmadhātu. The sun 「普運日宮殿」, the moon 「能持清淨月普現十方」: one palace moved, one moon held. Its verses close Book Two on light and on breaking the dark (「永破眾生癡惑暗」) — the moon itself gives no light, yet it breaks the dark, which is exactly what the moon-deities are for. The last stanza, with the Buddha's body preaching from every pore and a cloud of Dharma covering the world, echoes Book One's bodhi-tree (「恒出妙音」) transposed into the minutest space, and Book Two ends in the joy of those who have heard (「聽聞無不生歡喜」).\n\n### 3.15 卷二各组之颂首一览（择其警句）\n\n**递录各「尔时……而说颂言」之首偈（每组第一偈全句，皆据原文逐字）：**\n\n- 妙燄海大自在天王众：「佛身普遍诸大会 充满法界无穷尽 寂灭无性不可取 为救世间而出现」\n- 可爱乐法光明幢天王众：「诸佛境界不思议 一切众生莫能测 普令其心生信解 广大意乐无穷尽」\n- 清净慧名称天王众：「了知法性无碍者 普现十方无量剎 说佛境界不思议 令众同归解脱海」\n- 可爱乐光明天王众：「我念如来昔所行 承事供养无边佛 如本信心清净业 以佛威神今悉见」\n- 尸弃大梵王众：「佛身清净常寂灭 光明照耀遍世间 无相无行无影像 譬如空云如是见」\n- 自在天王众：「佛身周遍等法界 普应众生悉现前 种种教门常化诱 于法自在能开悟」\n- 善化天王众：「世间业性不思议 佛为群迷悉开示 巧说因缘真实理 一切众生差别业」（繁体底本作「世間業性不思議 佛為群迷悉開示 巧說因緣真實理 一切眾生差別業」）\n- 知足天王众：「如来广大遍法界 于诸众生悉平等 普应群情阐妙门 令入难思清净法」\n- 时分天王众：「佛于无量久远劫 已竭世间忧恼海 广闢离尘清净道 永耀众生智慧灯」\n- 释迦因陀罗天王众：「我念三世一切佛 所有境界悉平等 如其国土坏与成 以佛威神皆得见」\n- 日天子众：「如来广大智慧光 普照十方诸国土 一切众生咸见佛 种种调伏多方便」\n- 月天子众：「佛放光明遍世间 照耀十方诸国土 演不思议广大法 永破众生痴惑暗」\n\n> **EN corresponding · 3.15 Leading Lines by Book Two Gāthās**\n>\n> Every group of Book Two opens its verses with a stanza on the Buddha's body, his universality, or his light — the twelve opening stanzas above are all transcribed verbatim from the text. Two patterns stand out. In the 袖珍版 kept here the 尸弃大梵王 (Brahma) group alone opens with 承佛**神力** rather than 承佛威力 — T279's recension records a second 神力 group (月天子) and one 威神 group (自在天王), for which see table note ① — and its stanza (\"佛身清淨常寂滅 光明照耀遍世間\") declares the Buddha's body as quiescent, formless, without trace — described as one sees a cloud in the sky. And the moon-deities close the volume with \"佛放光明遍世間 照耀十方諸國土\" — the Buddha's radiance poured over all lands, breaking the dark delusion of beings. Book Two thus concludes, as it began, on light.\n\n### 3.16 卷二小结：从「名」到「行」\n\n卷二与卷一在文体上的分野一目了然：卷一止于名号（列名），卷二始于行相（解脱门与颂）。由此可立一条读本品之法：**卷一之名号是「体」，卷二以下各众之名目是「用」；名起用行，用归名起。** 所谓「众海云集」者，卷一为海，卷二以下为流；然「流」之每一众、每门上，皆以「承佛威力」为因（袖珍版唯尸弃大梵王组作「承佛神力」；据 T279 复核另有自在组「承佛威神」、月天子组「承佛神力」，两说并存，见 3.2 注①）——**「承佛威力/神力」诸字，为卷二至卷五每一颂的起手，由此可知：一切众生之所知、所行、所言，皆非自力，而是承佛威神。**\n\n**卷二组既已逐组细读毕（3.3–3.14），尚可归纳三点卷内通例。** 其一，**辞气随天界而递降**：色界五组（组一至组五）门名多取「无量」「寂静」「清净」等定境语，迨及欲界六组则转为「业」「忧恼」「病」「疑惑」等世间语（组七「业变力」、组九「忧恼海」、组十二「痴惑暗」），**而此递降正以「自大自在（唯识）而下」之教理次第为实据**——色界所化是智，欲界所化是心，故辞气亦随所化而变。其二，**颂法之三例**：卷二组之颂，**以「我念」「吾」「汝应观」等第一／第二人称起者三处**（组四、组十之首偈，组七之末偈），**其余皆以「佛身」「如来」「佛」为主语**——**华严之颂，虽云「承佛威力」，而颂中常令天众自陈其见（我念、汝应观），故颂非仅赞佛，亦自证其行**。其三，**卷二以光明始、以光明终**：组一首偈「佛身普遍诸大会」，组十二末偈「永破众生痴惑暗」，卷二组之首尾皆以光为纲（详见 3.15、3.14）。\n\n**【计数实证·本批新增】** 附录一所引经文自述「此卷经文介绍 **124** 王及其所得解脱门、**123** 个偈颂」，本批既已逐组细读毕十二组，遂就 T279 卷二**逐字复核其数，一一吻合**：\n\n- **王数 124**：十二组领众首名之实数——组一 10、组二 10、组三 11、组四 10、组五 10、组六 10、组七 11、组八 10、组九 10、组十 11、组十一 11、组十二 10，**八组各十门、四组各十一门（组三、组七、组十、组十一），合计 80＋44＝124**，与经文自述之数**全合**。\n- **偈数 123**：组三、组十、组十一各 11 偈，其余九组各 10 偈，**90＋33＝123**，亦与经文自述**全合**。\n\n**〔方法存记〕** 此二数之核，赖乎**以「頌N」为界分段**——每组之解脱门正在前组颂末与本组颂首之间，若自组名径直搜「得……解脫門」，则组六末颂之「此妙輪幢之解脫」会被误计为一门（组七遂误得 12 门）；故**分段之法不可不慎**。附录一「本文不作汇总之数」之旧例，**至此可以定案**：卷二之门数与偈数皆已实测，非推测。\n\n> **EN corresponding · 3.16 From Naming to Action**\n>\n> The real divide between Book One and Book Two is formal: Book One names, Book Two acts. Once seen, it yields a rule of reading — the names of Book One are the substance (體), the liberation-gates and verses of Books Two to Five are the functions (用). The \"ocean-multitude\" gathered in Book One streams out in Book Two as rivers; yet every current, every door, every stanza begins with the words 承佛威力 (\"sustained by the Buddha's power\" — in the 袖珍版 the Brahma group alone reads 承佛神力, \"by the Buddha's *spiritual* power\"; T279 also records a 威神 group at 自在 and a second 神力 group at 月天子, see table note ①). All that beings know, do, and speak, Hua-yan here says, is not their own efficacy but efficacy carried by the Tathāgata's might.\n>\n> **EN · 3.16 Three conventions within Book Two (revision).** First, the tone of the wording descends with the heavenly realm: the five form-realm groups (1–5) take their gate-names from states of concentration — 「無量」「寂靜」「清淨」 — whereas the six desire-realm groups turn to worldly terms — 「業」「憂惱」「病」「疑惑」 (group 7 「業變力」, group 9 「憂惱海」, group 12 「癡惑暗」) — and this descent answers to the doctrinal sequence running from Mahāīśvara (sole consciousness) downward: what the form-realm hosts transform is wisdom, what the desire-realm hosts transform is mind, so the wording changes with what is transformed. Second, **on the verse-form, the first- and second-person openings 「我念」「吾」「汝應觀」 occur in exactly three places** (the opening verses of groups 4 and 10, and the closing verse of group 7); all other stanzas take 佛身／如來／佛 as their subject. (*Corrected:* an earlier draft excepted \"Group Eleven and the last verse of Group Twelve\" from this count. That exemption was baseless and has been removed — the count of three now follows the text directly, with no exception clause.) Hua-yan's verses, though each is introduced as 承佛威力, therefore let the heavenly hosts speak in the first person about what they have seen (我念, 汝應觀): a stanza is not merely praise of the Buddha but the self-attestation of its own practice. Third, Book Two begins and ends with light: the first verse of group 1, 「佛身普遍諸大會」, and the last verse of group 12, 「永破眾生癡惑暗」 — the head and tail of Book Two are both keyed to light (see 3.15, 3.14). **Counting verified this batch:** 124 kings and 123 verses in Book Two, checked character-by-character against T279 — ten gates each in eight groups and eleven each in four (groups 3, 7, 10, 11), giving 80 + 44 = 124; eleven verses in groups 3, 10, 11 and ten in the rest, giving 90 + 33 = 123. Both figures agree exactly with the sutra's own statement. **Methodological note:** the count depends on segmenting by the marker 「頌N」, because each group's gates lie between the close of the preceding stanza and the head of its own; searching directly for 「得……解脫門」 from a group name would miscount the closing verse of group 6 (「此妙輪幢之解脫」) and yield twelve gates for group 7.\n\n---\n\n## 四、卷第三　世主妙严品第一之三（八部四王讫主风神）\n\n卷二以欲界天诸王为终，卷三则入「异生众」中之八部与杂类神。卷二、三、四、五卷，实为卷一「众海云集」之展开：**卷一所列为名，二卷以下为行（得解脱门、说颂言）**。\n\n### 4.1 卷三次第：八部居前，神众居后\n\n**卷三共十三组**：乾闼婆、鸠槃荼、龙、夜叉、摩睺罗伽、紧那罗、迦楼罗、阿修罗（八部四王）——卷四之主火、主水、主海、主河、主稼、主药、主林、主山、主地、主城、道场、足行、身众、执金刚（十四类神）与之相续，合观即是卷一「八部四王」与「十九类神」全部众类的续说。而卷三之八部组序，与卷一所列乾闼婆、紧那罗……自首及尾之序相反（详 4.2）。\n\n<details class=\"fold table-fold\"><summary>📋 表·卷三·十三组（13 行；组 3 门与偈各 11，余组各 10）</summary>\n| 组 | 长行组首（`復次，X，得…） | 颂主（`爾時，X，承佛威力…說頌言`） | 所观 | 门数／偈数 |\n|---|---|---|---|---|\n| 1 | 持国乾闼婆王 | 持国乾闼婆王 | 一切乾闼婆众 | 10／10 |\n| 2 | 增长鸠槃荼王 | 增长鸠槃荼王 | 一切鸠槃荼众 | 10／10 |\n| 3 | **毘楼博叉龙王** | 毘楼博叉龙王 | 一切诸龙众 | **11／11** |\n| 4 | **毘沙门夜叉王** | **多闻大夜叉王** ★ | 一切夜叉众会 | 10／10 |\n| 5 | **善慧摩睺罗伽王** | **善慧威光摩睺罗伽王** ★ | 一切摩睺罗伽众 | 10／10 |\n| 6 | 善慧光明天紧那罗王 | 善慧光明天紧那罗王 | 一切紧那罗众 | 10／10 |\n| 7 | 大速疾力迦楼罗王 | 大速疾力迦楼罗王 | 一切迦楼罗众 | 10／10 |\n| 8 | 罗睺阿修罗王 | 罗睺阿修罗王 | 一切阿修罗众 | 10／10 |\n| 9 | 示现宫殿主昼神 | 示现宫殿主昼神 | 一切主昼神众 | 10／10 |\n| 10 | 普德净光主夜神 | 普德净光主夜神 | 一切主夜神众 | 10／10 |\n| 11 | 遍住一切主方神 | 遍住一切主方神 | 一切主方神众 | 10／10 |\n| 12 | 净光普照主空神 | 净光普照主空神 | 一切主空神众 | 10／10 |\n| 13 | 无碍光明主风神 | 无碍光明主风神 | 一切主风神众 | 10／10 |\n</details>\n\n**〔本批新订〕以上表经 `T10n0279` 卷三逐组回源核验（2026-09-30），得三处订正**：\n1. **组 3 门与偈各 11**（旧表作 11 偈／10 门）——`T279` 作「毘樓博叉龍王，得消滅一切諸龍趣熾然苦解脫門」，以下十王（娑竭罗、云音幢、焰口、焰、云幢、德叉迦、无边步、清净色速疾、普行大音、无热恼）**各得一门，共 11 门**；其颂亦 11 偈。**全卷唯此组多一门一偈。**\n2. **组 4、组 5 之「长行组首」与「颂主」不同**——夜叉组长行作「**毘沙門夜叉王**」而颂主作「**多聞大夜叉王**」；摩睺罗伽组长行作「**善慧摩睺羅伽王**」而颂主作「**善慧威光摩睺羅伽王**」。**此非讹误**：长行「復次，X，得…解脫門」以**列名之首**领一组，颂则「爾時，X，承佛威力」另有所指（二名同列于组内：毘沙门夜叉王、多闻大夜叉王皆夜叉王；善慧、善慧威光二摩睺罗伽王亦同列）。旧表径取颂主为组名，失其分别，今补为两栏。**〔存疑待考〕**颂主何以必取组内第二名，待校澄观《疏》卷四。\n3. **卷三组序实为十三组**，其中**组 3 龙王组之颂作「普觀一切諸龍眾已，即說頌言」**（有「已」字），与余组「眾而說頌言」微异；**组 10 主夜神作「遍觀」（非「普觀」）**，旧注已及，今补入表下。\n\n注：颂引之连接语已逐组核验——**组 3 作「普觀一切諸龍眾已，即說頌言」**（有「已」且用「即」），**组 10 作「遍觀一切主夜神眾而說頌言」**（作「遍觀」，非「普觀」），余组皆作「普觀…眾而說頌言」而无「已」。主空神组之偈为**五言**（「如来广大目，清净如虚空」），卷四执金刚神组亦然，为全品仅见之二处五言。\n\n**卷三门数与偈数之总校（本批实测）**：13 组共 **131 门、131 偈**——组 3 各 11，余组各 10。此数与 5.2、附录七所记之卷三 131 偈相合，惟**门数此前未记，今补**〔按：卷二门 124／偈 123（门偈数不等，组 3、7、10、11 各 11 门），卷三则门偈同数〕。\n\n### 4.2 八部次第与「倒序」结构\n\n卷一列八部四王之序为**阿修罗、迦楼罗、紧那罗、摩睺罗伽、夜叉、龙、鸠盤荼、乾闼婆**（袖珍版编按：「8个八部四王众：阿修罗王、迦楼罗王、紧那罗王、摩睺罗伽王、夜叉王、诸大龙王、鳩盤荼王、乾闼婆王」）；而卷三之组序为**乾闼婆、鳩盤荼、龙、夜叉、摩睺罗伽、紧那罗、迦楼罗、阿修罗**——**恰为倒序**。此与前文卷二「色界天五众」自大自在（色界上首）起讫欲界月天子之序相呼应：**全品颂赞诸众，自卷二大自在天王起，以倒序历色界、欲界，讫卷三八部、卷四执金刚神止。** 卷一列名自首而终，卷二至卷四颂赞则自终而首——**两种次序相向而行，而总归一海。**\n\n### 4.3 组一细读：持国乾闼婆王\n\n> **经文**　復次持國乾闥婆王，得自在方便攝一切眾生解脫門。……\n\n**疏解**　「持国」（`dhṛtarāṣṭra`，护持国土义）为四天王之一（东面持国天王），乾闼婆（`gandharva`，香音神）为帝释之乐神，其王持国领之。此组十偈之颂，以「诸佛境界无量门 一切众生莫能入 善逝如空性清净 普为世间开正道」为首——**言佛境界虽难入，而善逝（如空清净）为世开道。** 此与领众「自在方便教化」义相衔：教化者，以自在方便，导群生于「莫能入」之境也。\n\n> **EN corresponding · 4.3 Group One: Dhṛtarāṣṭra, King of the Gandharvas**\n>\n> Dhṛtarāṣṭra (持國, \"upholder of the land\") is the eastern of the four world-protecting kings, and the gandharvas are the celestial musicians led by him. The opening stanza — \"The realms of the Buddhas have measureless doors, impossible for any being to enter; the Well-Gone One, pure like space, opens the right path for the world\" — sets the theme of the group: the Buddha's realm is utterly beyond reach, yet the Tathāgata, void and pure, makes a way for all. This is precisely the meaning of the king's own gate: \"the gate of freedom and skillful means in gathering in all beings\" (自在方便攝一切眾生).\n\n### 4.4 组二细读：增长鸠槃荼王\n\n> **经文**　復次，增長鳩槃荼王，得滅一切怨害力解脫門。爾時，增長鳩槃荼王，承佛威力，普觀一切鳩槃荼眾而說頌言：「成就忍力世導師，為物修行無量劫，永離世間憍慢惑，是故其身最嚴淨……」\n\n〔编者按〕本组以下十王各得一门：龍主、莊嚴幢、饒益行、可怖畏、妙莊嚴、高峯慧、勇健臂、無邊淨華眼、廣大面（**惟组首增长鸠槃荼王为上首，共 10 门**）。\n\n**疏解**　鸠槃荼（`kumbhāṇḍa`，此云「袋腹」／「容器」，主蕴藏饮食），**在本组之颂中被称为「龍主」**（颂曰「此解脫門龍主得」）——故知经中鸠槃荼与龙同类而名异，T279 卷三实以**鸠槃荼（组 2）、龙（组 3）分列两族**，而颂文径以「龙主」称之。此组十门之共同指向为**「滅怨害」与「降伏憍慢」**：「滅一切怨害力」领众，「可怖畏得開示一切眾生安隱無畏道」、「勇健臂得普放光明滅如山重障」皆就**怨雠与怖畏**立解；颂首「成就忍力世導師……永離世間憍慢惑，是故其身最嚴淨」则以**忍力与嚴淨**为标——鸠槃荼之身本狞恶，故经以「最嚴淨」转其相。\n\n> **EN corresponding · 4.4 Group Two: Growing Kumbhāṇḍa King**\n>\n> The kumbhāṇḍas (鳩槃荼, \"the bag-bellied\" — devourers of unguents) are here called \"dragon-lords\" in the verse (「此解脫門龍主得」), though T279 lists them as a class apart from the dragons of group three. All ten gates converge on one work: the destruction of enmity. 「滅一切怨害力」 heads the list; 「可怖畏」 opens for every being \"the tranquil path free of fear\" (開示一切眾生安隱無畏道); 「勇健臂」's light shatters \"heavy obstacles like a mountain\" (滅如山重障). The opening stanza turns the group's ugly nature into its virtue: having practised \"the strength of patience\" for measureless ages and left all worldly pride, the kumbhāṇḍa-king's form is \"most strictly pure\" (是故其身最嚴淨).\n\n### 4.5 组三细读：毘楼博叉龙王\n\n> **经文**　復次，毘樓博叉龍王，得消滅一切諸龍趣熾然苦解脫門；娑竭羅龍王，得一念中轉自龍形示現無量眾生身解脫門。爾時，毘樓博叉龍王，承佛威力，普觀一切諸龍眾已，即說頌言：「汝觀如來法常爾，一切眾生咸利益，能以大慈哀愍力，拔彼畏塗淪墜者……」\n\n〔编者按〕组首**毘楼博叉龙王**得「消滅一切諸龍趣熾然苦解脫門」，以下十王（娑竭羅、雲音幢、焰口、焰、雲幢、德叉迦、無邊步、清淨色速疾、普行大音、無熱惱）各得一门，**全组共 11 门、11 偈，为卷三之仅见（余组各 10）**。\n\n**疏解**　**毘楼博叉**〔梵拼待核，本文不取定译；组 3「毘樓博叉龍王」与组 8「毘摩質多羅阿脩羅王」是否为同名异写，亦待考〕，此组之颂不作「龙形可畏」语，而作**「拔彼畏塗淪墜者」**——**以大慈拔苦**为颂题。组内诸门之义可分三类：**一、救苦**（「消滅一切諸龍趣熾然苦」、「德叉迦得以清淨救護音滅除一切怖畏」、「無熱惱得以大悲普覆雲滅一切世間苦」）；**二、化形**（「娑竭羅得一念中轉自龍形示現無量眾生身」——**一念之间自龙形而现无量众生身**，此即「随类应化」之极致）；**三、宣教**（「雲音幢得於一切諸有趣中以清淨音說佛無邊名號海」、「普行大音得示現一切平等悅意無礙音」）。**「熾然苦」三字为卷三他组所无**，足见经人对龙趣之特加厌离。\n\n> **EN corresponding · 4.5 Group Three: Veṇacitra, Dragon King**\n>\n> This group alone has **eleven gates and eleven stanzas** — the only such count in all of Book Three. Its theme is stated at once: 「拔彼畏塗淪墜者」, to pull beings out of the terrors into which they have fallen, by the Buddha's great compassion. The eleven gates fall into three kinds: **deliverance from suffering** (「消滅一切諸龍趣熾然苦」, 「無熱惱」's cloud of great compassion extinguishing all worldly suffering); **transformation of form** (「娑竭羅」 turns from the dragon-body to show the bodies of endless beings within a single thought); and **proclamation** (「雲音幢」 sounds the endless ocean of the Buddha's names in every realm of existence, 「普行大音」 sounds the unobstructed, pleasing voice of equality).\n\n### 4.6 组四细读：毘沙门夜叉王\n\n> **经文**　復次，毘沙門夜叉王，得以無邊方便救護惡眾生解脫門；自在音夜叉王，得普觀察眾生方便救護解脫門。爾時，多聞大夜叉王，承佛威力，普觀一切夜叉眾會而說頌言：「眾生罪惡深可怖，於百千劫不見佛，漂流生死受眾苦，為救是等佛興世……」\n\n〔编者按〕本组共 10 门。**长行组首作「毘沙門夜叉王」，颂主作「多聞大夜叉王」，二者同列组内，非讹误**（详见 4.1 表下〔本批新订〕第 2 条）。\n\n**疏解**　夜叉（`yakṣa`，此云「能夺」／「捷疾」），**卷三颂中最见其凶险本色**：「眾生罪惡深可怖，於百千劫不見佛，漂流生死受眾苦」——**先极写众生之苦与不见佛之久，方显佛之兴世为不得已**。此与卷二诸天组「欲界诸天之苦」之语同一机杼，而**语更峻切**。领众之门「以無邊方便救護**惡**眾生」，「恶众生」三字为夜叉组之特色——正为**已造恶业、堕于怖畏者**而设；组内「焰眼主得普觀察一切眾生大悲智」、「勇敵大軍得守護一切眾生令住於道無空過者」皆是此义。**毘沙门**（`Vaiśravaṇa`，帝释天之属，此处为夜叉王名〔待核：通常毗沙门为夜叉之主，名义有二说〕）。\n\n> **EN corresponding · 4.6 Group Four: Vaiśravaṇa, Yaksha King**\n>\n> No group in Book Three speaks so starkly of suffering as this one: \"the evil of beings is deep and dreadful; for a hundred thousand kalpas they do not see a Buddha; drifting in saṃsāra they endure all pains — **for the sake of saving these very beings the Buddhas appear in the world**.\" The gate that heads the group is \"unlimited skillful means for protecting **evil-doing** beings\" (救護惡眾生) — the yaksha group's task begins precisely where other groups do not reach: with those who have done wrong and are trapped in dread. Note that the long prose names Vaiśravaṇa as head of the group, but the verse is uttered by **another yaksha king of the same group, \"Much- heard\" (多聞大夜叉王)** — the prose lists by first name, the verse by its own choice.\n\n### 4.7 组五细读：善慧威光摩睺罗伽王\n\n> **经文**　復次，善慧摩睺羅伽王，得以一切神通方便令眾生集功德解脫門；淨威音摩睺羅伽王，得使一切眾生除煩惱得清涼悅樂解脫門。爾時，善慧威光摩睺羅伽王，承佛威力，普觀一切摩睺羅伽眾而說頌言：「汝觀如來性清淨，普現威光利群品，示甘露道使清涼，眾苦永滅無所依……」\n\n〔编者按〕本组共 10 门。**长行组首作「善慧摩睺羅伽王」，颂主作「善慧威光摩睺羅伽王」，二者同列组内**（详见 4.1 表下〔本批新订〕第 2 条）。\n\n**疏解**　摩睺罗伽（`makhora`，此云「大腹」／「牟呼罗伽」，手持鼓节唱颂者）。**此组颂文为卷三最清朗者**：不写众生之恶、不写众苦之深，独写**「如來性清淨……示甘露道使清涼，眾苦永滅無所依」**——**以「清涼」「無所依」为归**。此与其门「令眾生集功德」相应：摩睺罗伽**本以歌舞音乐为事**，故经以「令众生集功德」为门——**以艺文之众，入功德之聚**。组内「淨威音得使一切眾生除煩惱得清涼悅樂」、「須彌臆得於一切所緣決定不動到彼岸滿足」皆清朗一类；「燈幢得開示一切眾生令離黑闇怖畏道」则与「甘露道」呼应。\n\n> **EN corresponding · 4.7 Group Five: Wise-Bannered Makhora King**\n>\n> The clearest of the thirteen stanzas in Book Three. Where the yakṣas speak of the depth of evil, the makhoras speak only of purity: \"Contemplate the Buddha's nature — utterly clear; his light appears for all kinds of beings; he shows the ambrosial path, cooling all burning, and every pain ends, leaving nothing to rely on.\" The gate is \"all manner of spiritual powers, by which beings are gathered into merit\" — apt for a class whose office is **musical performance**: here the arts of song and beat are turned to the collecting of good deeds. \"Lamp-Banner\" opens for all beings \"the way that leaves darkness and dread\" (開示一切眾生令離黑闇怖畏道), which is the same ambrosial coolness named in the verse.\n\n### 4.8 组六细读：善慧光明天紧那罗王\n\n> **经文**　復次，善慧光明天緊那羅王，得普生一切喜樂業解脫門。妙華幢緊那羅王，得能生無上法喜令一切受安樂解脫門。爾時，善慧光明天緊那羅王，承佛威力，普觀一切緊那羅眾而說頌言：「世間所有安樂事，一切皆由見佛興，導師利益諸眾生，普作救護歸依處……」\n\n〔编者按〕本组共 10 门。\n\n### 4.9 组七细读：大速疾力迦楼罗王\n\n> **经文**　復次，大速疾力迦樓羅王，得無著無礙眼普觀察眾生界解脫門。不可壞寶髻迦樓羅王，得普安住法界教化眾生解脫門。爾時，大速疾力迦樓羅王，承佛威力，普觀一切迦樓羅眾而說頌言：「佛眼廣大無邊際，普見十方諸國土，其中眾生不可量，現大神通悉調伏……」\n\n〔编者按〕本组共 10 门。\n\n**疏解**　迦楼罗（`garuḍa`，此云「金翅鸟」，食龙为生）。**此组是卷三与「见」关系最密者**：门名作「**無著無礙眼**普觀察眾生界」，颂首即「**佛眼廣大無邊際，普見十方諸國土**」——**以「眼」为纲**。迦楼罗飞举高远、见界最广，故经以「广见」为其门；组内「普觀海得了知一切眾生身而為現形」、「龍音大目精得普入一切眾生歿生行智」皆就**遍知众生身分与其生死行业**立解。颂中「佛神通力無所礙，遍坐十方覺樹下，演法如雲悉充滿」——**一佛同时坐于十方觉树之下而演法如云**，是「华藏世界海」宇宙观在颂中最直白的一次呈现〔本文判断：此即澄观「染净二土镕融相摄」之义〕。\n\n> **EN corresponding · 4.9 Group Seven: Great Swift-Strength Garuḍa King**\n>\n> The garuḍas are the group in which seeing dominates. The gate is \"**unattached, unobstructed eyes**, universally surveying the realm of beings\" (無著無礙眼普觀察眾生界), and the stanza opens on the same key: \"The Buddha's eye is vast and without bound; it beholds all the lands of the ten directions, and the beings within them, past number, and by great divine powers subdues them all.\" Within the group, 「普觀海」 knows the bodies of all beings and manifests accordingly, 「龍音大目精」 enters the knowledge of all beings' passing and coming. The verse's second stanza — \"the Buddha's powers unconfined, seated everywhere beneath the tree of awakening, raining forth Dharma like a cloud\" — is one of the plainest presentations in the whole text of the Huayan cosmology of endlessly interpenetrating Buddha-lands.\n\n### 4.10 组八细读：罗睺阿修罗王\n\n> **经文**　復次，羅睺阿脩羅王，得現為大會尊勝主解脫門。毘摩質多羅阿脩羅王，得示現無量劫解脫門。爾時，羅睺阿脩羅王，承佛威力，普觀一切阿脩羅眾而說頌言：「十方所有廣大眾，佛在其中最殊特，光明遍照等虛空，普現一切眾生前……」\n\n〔编者按〕本组共 10 门。\n\n**疏解**　阿修罗（`asura`，此云「非天」／「无天」）。**此组之门最堪玩味：「現為大會尊勝主」**——**阿修罗而为「尊胜主」**。此非谓其为尊，而谓其**能现为众会中的尊胜之主**：正因其本为帝释之对敌故，先须现为尊胜主而后能调伏。颂首「十方所有廣大眾，佛在其中最殊特，光明遍照等虛空，普現一切眾生前」——**以「最殊特」三字写佛超胜一切众**；第三偈「百千萬劫諸佛土，一剎那中悉明現，舒光化物靡不周，如是毘摩深讚喜」则称**毘摩质多罗**王（组内第二王）能于刹那间遍现无量佛土。组内「現勝德得普令見佛承事供養修諸善根」——**此门即使众生见佛、承事、供养**，为阿修罗组之枢要。\n\n> **EN corresponding · 4.10 Group Eight: Rāhu, Asura King**\n>\n> The asuras' gate is the most striking of the thirteen: \"**manifesting as the supreme master presiding over the great assembly**\" (現為大會尊勝主). It does not say the asura is the master, but that he is able to appear as one — which is precisely why he, opponent of Indra, is the one who can subdue. The verse sets the Buddha above all: \"Of all the vast assemblies in the ten directions, the Buddha is the most distinguished; his light shines through like space, and he appears before every being.\" The third stanza gives 「毘摩質多羅」, second king of the group, the power to manifest myriads of Buddha-lands within an instant. At the group's centre stands 「現勝德」, whose gate is simply \"to let all beings see the Buddha, attend him, make offerings, and cultivate roots of good.\"\n\n### 4.11 组九细读：示现宫殿主昼神\n\n> **经文**　復次，示現宮殿主晝神，得普入一切世間解脫門。發起慧香主晝神，得普觀察一切眾生皆利益令歡喜滿足解脫門。爾時，示現宮殿主晝神，承佛威力，普觀一切主晝神眾而說頌言：「佛智如空無有盡，光明照耀遍十方，眾生心行悉了知，一切世間無不入……」\n\n〔编者按〕本组共 10 门。\n\n**疏解**　**主昼神**（昼神主〔待核：昼／夜神梵名，本项目未见经中自标〕），主白昼之化现。门作「**普入一切世間**」，颂首「**佛智如空無有盡……眾生心行悉了知，一切世間無不入**」——**以「入」为纲**：不但知众生心行，且**一切世间无不入**。组内诸门于是皆就「遍入」为义：「觀方普現得十方法界差別身」——**十方法界之差别身**；「華香妙光得開發無邊眾生清淨信解心」——**开信解心**；「樂作喜目得普開悟一切苦樂眾生皆令得法樂」——**令苦乐众生皆得法乐**，与卷二组九「普遍涌」之语同一关切。**昼神组之特色：于「差别」中见遍入**（十方有差别，而一佛普入）。\n\n> **EN corresponding · 4.11 Group Nine: Manifesting-Palace Deity of Daylight**\n>\n> The gate is \"universally entering all worlds\" (普入一切世間), and the stanza explains it: \"The Buddha's wisdom is like space, without end; his light illumines the ten directions; the mind and conduct of every being are fully known to him — into every world he enters without exception.\" The ten gates of the group all turn on this entering: 「觀方普現」 shows \"the differentiated bodies of the ten dharma-realms\" (十方法界差別身), 「華香妙光」 opens the pure faith of endless beings, 「樂作喜目」 brings even those in suffering and in pleasure to \"the joy of Dharma.\" The characteristic of this group is thus **universality within difference**: the ten directions are distinct, yet the Buddha enters all.\n\n### 4.12 组十细读：普德净光主夜神\n\n> **经文**　復次，普德淨光主夜神，得寂靜禪定樂大勇健解脫門。喜眼觀世主夜神，得廣大清淨可愛樂功德相解脫門。爾時，普德淨光主夜神，承佛威力，遍觀一切主夜神眾而說頌言：「汝等應觀佛所行，廣大寂靜虛空相，欲海無涯悉治淨，離垢端嚴照十方……」\n\n〔编者按〕本组共 10 门；本组颂引作「遍觀一切主夜神眾而說頌言」（余组作「普觀」）。\n\n**疏解**　**主夜神**（同上〔待核〕）。**此组是卷三唯一以「寂靜禪定」为门者**：「得寂靜禪定樂大勇健解脫門」——**寂靜、禪定、樂、勇健**四义并列。颂首「汝等應觀佛所行，廣大寂靜虛空相，欲海無涯悉治淨，離垢端嚴照十方」——**以「治淨欲海」为佛之行**。组内「護世精氣得普現世間調伏眾生」、「寂靜海音得積集廣大歡喜心」皆就调伏与欢喜；「平等護育得開悟眾生令成熟善根」——**令善根成熟**，与「菩薩种性」之义相通。**昼神主化现而遍入，夜神主寂静而调伏**：一显一隐，卷三诸神之末二类由此收束。\n\n> **EN corresponding · 4.12 Group Ten: All-Virtue Net-Light Deity of Night**\n>\n> The only group in Book Three whose gate begins with stillness: \"**the gate of the joy of tranquil meditation and great vigour**\" (寂靜禪定樂大勇健解脫門) — four terms in one: stillness, meditation, joy, vigour. Its verse urges the hearers to look at the Buddha's conduct: \"vast, tranquil, like space; the ocean of desire is boundless, and he cleanses it utterly; departing from defilement, he is stately and illumines the ten directions.\" 「護世精氣」 manifests in the world to subdue beings; 「寂靜海音」 accumulates a vast heart of joy; 「平等護育」 awakens beings so that their roots of good **ripen** (成熟善根). If the deities of daylight manifest and enter everywhere, the deities of night tranquilize and subdue — radiance and concealment close the list of Book Three's gods.\n\n### 4.13 组十一细读：遍住一切主方神\n\n> **经文**　復次，遍住一切主方神，得普救護力解脫門。普現光明主方神，得成辦化一切眾生神通業解脫門。爾時，遍住一切主方神，承佛威力，普觀一切主方神眾而說頌言：「如來自在出世間，教化一切諸群生，普示法門令悟入，悉使當成無上智……」\n\n〔编者按〕本组共 10 门。\n\n**疏解**　**主方神**（四维方所之主〔待核〕）。门作「**普救護力**」，颂首则大书「**普示法門令悟入，悉使當成無上智**」——**「令悟入」与「使当成无上智」为一贯**。组内「光行莊嚴得破一切闇障生喜樂大光明」——**破闇障生大光明**，与主昼之「開信解心」同而广；「髻目無亂得示現一切眾生業無差別自在力」——**於眾生業而示現無差別之自在力**，此即「于一中下能作多上」之理〔本文判断〕。主方神之义在**方所之遍住而无碍**。\n\n> **EN corresponding · 4.13 Group Eleven: Everywhere-Abiding Deities of the Quarters**\n>\n> The gate is simply \"**universal protective power**\" (普救護力), and the stanza at once supplies the ground for it: \"The Tathāgata, at liberty in the world, teaches all groups of beings; he universally shows them the gates so that they awaken and enter, and brings them all to accomplish unsurpassed wisdom.\" The strangest gate is 「普現光明」's — \"accomplishing the spiritual powers of all beings\" (成辦化一切眾生神通業). 「光行莊嚴」 breaks every obstruction of darkness and produces a great light of joy; 「髻目無亂」 shows, within the varying karma of beings, an **undifferentiated power of self-mastery** — the principle of acting as the many while being at one.\n\n### 4.14 组十二细读：净光普照主空神\n\n> **经文**　復次，淨光普照主空神，得普知諸趣一切眾生心解脫門。普遊深廣主空神，得普入法界解脫門。爾時，淨光普照主空神，承佛威力，普觀一切主空神眾而說頌言：「如來廣大目，清淨如虛空，普見諸眾生，一切悉明了……」\n\n〔编者按〕本组共 10 门；本组之偈通篇五言，与卷四执金刚神组同为全品仅见之二处五言。\n\n**疏解**　**主空神**（主虚空者）。此组颂**通篇五言**，**为全品仅见之二处之一**（另一处见卷四执金刚神组）。**「主空」而颂「如空」，正相发明**：「如來廣大目，清淨如虛空」——**佛之目即虚空之相**；「佛身如虛空，無生無所取，無得無自性」——**无生、无取、无得、无自性**，四否定直指性空。**以五言写空义，句短而义长**。门作「普知諸趣一切眾生心」，与颂「普見諸眾生，一切悉明了」相应；组内「離障安住得能除一切眾生業惑障」、「離垢光明得能令一切眾生心離諸蓋清淨」皆就**离障离垢**言，与「如空」之义一贯。\n\n> **EN corresponding · 4.14 Group Twelve: Net-Light-All-Illuminating Deities of Space**\n>\n> The deities of space answer in **five-syllable verse** — one of only two places in the whole chapter where the metre changes (the other is the vajra-bearers of Book Four). Verse and subject thus reinforce each other: \"The Buddha's eye is great and wide, pure like space; he beholds all beings and understands them entirely… **His body is like space — unborn, grasping nothing, attaining nothing, with no self-nature**.\" Four negations in a row: the emptiness that the deities of space preside over is also the emptiness they sing of. The gate — \"universally knowing the mind of every being in every realm of existence\" (普知諸趣一切眾生心) — is answered within the group by 「離障安住」, who removes the karmic and delusional obstructions of all beings, and 「離垢光明」, who frees their minds from the hindrances and makes them clean.\n\n### 4.15 组十三细读：无碍光明主风神\n\n> **经文**　復次，無礙光明主風神，得普入佛法及一切世間解脫門。普現勇業主風神，得無量國土佛出現咸廣大供養解脫門。爾時，無礙光明主風神，承佛威力，普觀一切主風神眾而說頌言：「一切諸佛法甚深，無礙方便普能入，所有世間常出現，無相無形無影像……」\n\n〔编者按〕本组共 10 门；主风神为卷三众神之末，卷四诸神自此续起。\n\n**疏解**　**主风神**（风神主）。此组之颂以**三否定**冠首：「**無相無形無影像**」——而门作「**普入佛法及一切世間**」，一否定一普入，正相成趣：**佛无形无相而能遍入一切世间**。组内「飄擊雲幢得以香風普滅一切眾生病」——**以香风灭病**，将「风」之义用于医疗；「力能竭水得能破無邊惡魔眾」——**以力竭水而破魔**；「樹杪垂髻得入一切諸法實相辯才海」——**入实相辩才之海**。**卷三至此以「风」收束：风无形象而周遍一切，正所以为「主风神」之义**；继之卷四「主火神讫执金刚神」，卷三、卷四之诸神次第由此接续〔详见 5.1〕。\n\n> **EN corresponding · 4.15 Group Thirteen: Unobstructed-Light Deities of Wind**\n>\n> The wind-deities close Book Three with three negations — \"**formless, shapeless, without image**\" (無相無形無影像) — set against a gate of universal entry: \"universally entering the Dharma of the Buddhas and every world\" (普入佛法及一切世間). Formless yet omnipresent: that is the theme. Within the group, 「飄擊雲幢」 extinguishes the sickness of all beings with fragrant winds; 「力能竭水」 breaks the boundless hosts of demons; 「樹杪垂髻」 enters the ocean of eloquence on the true character of all phenomena. Wind has no shape yet ranges everywhere — the fitting close to Book Three, after which Book Four takes up the fire, water, sea, river, grain, herb, forest, mountain, earth, city, shrine, feet, and body deities.\n\n### 4.16 卷三小结\n\n卷三之颂，主于「佛之巍巍」：或以「佛眼广大无边际」（迦楼罗），或以「成就忍力世导师」（鸠槃荼），或以「众生罪恶深可怖……为救是等佛兴世」（夜叉）。八部因见佛而作赞，其救度之义多在「随类应化」；**欲界天众颂佛之「庄严」与「境界」，八部则颂佛之「救度」与「威神」；同会异口，而总由承佛威力。**\n\n**〔本批补：五类神（主昼／主夜／主方／主空／主风）之颂各具一格，可与八部对观〕**　卷三自组 9 至组 13，五类神（昼、夜、方、空、风）之颂，语势渐次转深：主昼神颂「一切世間無不入」（遍入），主夜神颂「欲海無涯悉治淨」（治欲），主方神颂「悉使當成無上智」（令成），主空神颂「無生無所取，無得無自性」（性空，且改用五言），主风神颂「無相無形無影像」（无相）。**由「遍入」而「无相」，卷三以否定收束，遂启卷四「主火神讫执金刚神」之续。**\n\n## 五、卷第四　世主妙严品第一之四（主火神讫执金刚神）\n\n### 5.1 卷四次第：十四类神\n\n**卷四共十四组**，仍以「承佛威力」各领一类神众，自主火神起讫执金刚神。与卷三七「杂类神」相续，即卷一「复有佛世界微尘数执金刚神」……等十九类神之倒序颂赞。卷四偈数统计如下（依各组「尔时……而说颂言」续偈逐组核实）：\n\n<details class=\"fold table-fold\"><summary>📋 表·组…（16 行）</summary>\n| 组 | 领众 | 所观（普观……众） | 偈数 |\n|---|---|---|---|\n| 1 | 普光燄藏主火神 | 一切主火神众 | 10 偈 |\n| 2 | 普兴云幢主水神 | 一切主水神众 | 10 偈 |\n| 3 | 出现宝光主海神 | 一切主海神众 | 10 偈 |\n| 4 | 普发迅流主河神 | 一切主河神众 | 10 偈 |\n| 5 | 柔软胜味主稼神 | 一切主稼神众 | 10 偈 |\n| 6 | 吉祥主药神 | 一切主药神众 | 10 偈 |\n| 7 | 布华如云主林神 | 一切主林神众 | 10 偈 |\n| 8 | 开华匝地主山神 | 一切主山神众 | 10 偈 |\n| 9 | 普德净华主地神 | 一切主地神众 | 10 偈 |\n| 10 | 宝峰光耀主城神 | 一切主城神众 | 10 偈 |\n| 11 | 净庄严幢道场神 | 一切道场神众 | 11 偈 |\n| 12 | 宝印手足行神 | 一切足行神众 | 10 偈 |\n| 13 | 净喜境界身众神 | 一切身众神众 | 10 偈 |\n| 14 | 妙色那罗延执金刚神 | 一切执金刚神众 | 10 偈 |\n</details>\n\n注：①表列组序即卷四次第，与卷一杂类神「主火神……执金刚神」之次**恰为倒叙**（卷一自执金刚神始，卷四自主火神终，二者相向）。②**执金刚神组之偈为五言**（「汝应观法王 法王法如是 色相无有边 普现于世间」），与卷三主空神组同为全品仅见之五言体。③卷四诸神众，皆对应卷一「复有佛世界微尘数X神」诸段之续说。\n\n### 5.2 组末细读：妙色那罗延执金刚神\n\n> **经文**　復次妙色那羅延執金剛神，得見如來示現無邊色相身解脫門。……\n\n**疏解**　「执金刚神」（`vajradhara`，执金刚杵之神）为佛之护法，卷一「复有佛世界微尘数执金刚神。所谓妙色那罗延执金刚神……」居十九类神之首，**卷四则殿十四组之末——首尾相应，前后映照。**「那罗延」（`nārāyaṇa`，力士）为具大身力之神。「妙色那罗延执金刚神」组之颂用**五言**，其首偈「汝应观法王 法王法如是」，以十面五言摄「法王」义——在满卷七言之中，此一转笔尤为醒眼；执金刚神为护法之神，其颂以庄严法王殿后，正合以身护法之义。\n\n> **EN corresponding · 5.2 The Last Group: The Vajra-Bearers under 妙色那羅延**\n>\n> The vajra-bearers (執金剛神, *vajradhara*), guardians who hold the diamond thunderbolt, stand **first** in the roll of the nineteen \"miscellaneous beings\" in Book One, and open **last** in the fourteen groups of Book Four: end and beginning answer each other. The name 那羅延 (Nārāyaṇa) marks them as mighty men of bodied strength. Their verses alone — in a book of heptasyllables — are written in penta-syllabic meter: \"Look on the Dharma-King; such is the Dharmarāja: his color and form are boundless, manifest everywhere in the world.\" The guardians' chant, closing the long sequence, does service to the Dharmarāja as they do service to the Buddha.\n\n### 5.3 卷四小结\n\n卷四之十四组，仍以上首神名冠于组前，组名与卷一「复有……神」之名一一相应。全品「解脱门」之数，卷二、卷三、卷四、卷五逐组递积，至卷五菩萨众而极；卷四神众诸颂，多在「**严净**」与「**护持**」之间——主火神赞「所有暗障皆令灭」，主水神赞「是故见者无厌足」，主城神赞「光明遍照于十方」，皆庄严国土、光显佛境之辞；至执金刚神以五言赞「法王」，卷四之颂于焉告成。\n\n## 六、卷第五　世主妙严品第一之五（菩萨众·颂赞与震动）\n\n### 6.1 卷五开首：普贤菩萨颂\n\n> **经文**　爾時普賢菩薩摩訶薩，入不思議解脫門方便海，入如來功德海。所謂有解脫門名嚴淨一切佛國土，調伏眾生令究竟出離；有解脫門名普詣一切如來所修具足功德境界；……爾時普賢菩薩摩訶薩，以自功德，復承如來威神之力，普觀一切眾會海已，即說頌言：「佛所莊嚴廣大剎，等於一切微塵數……」。\n\n*编者按（十偈）*\n\n**疏解**　卷五异于二、三、四卷者，首即普贤菩萨独作十偈之颂。前此诸卷，皆「尔时某王承佛威力」；**普贤则「以自功德，复承如来威神之力」**——加「以自功德」四字，为全品颂主中所独有，明普贤菩萨非仅承佛而行，别有自证之功德。其首偈「佛所庄严广大剎 等于一切微尘数 清净佛子悉满中 雨不思议最妙法」，以「剎海微尘」为量，开卷五「世界海」之眼界。\n\n> **EN corresponding · 6.1 The Opening Chant of Samantabhadra**\n>\n> Book Five differs from Books Two to Four at once: it opens with a ten-stanza chant sung by Samantabhadra alone. Every earlier chief of a group \"sustained by the Buddha's power\" (承佛威力) approached in the same formula; Samantabhadra alone adds \"**by his own merit**, and moreover sustained by the Tathāgata's *spiritual* power\" (以自功德、復承如來威神之力) — \"his own merit\" occurs nowhere else among the chant-leaders of the chapter. One Bodhisattva stands here above the rest. His first stanza, \"The vast kalpa-realms adorned by the Buddha equal the number of atoms in a dust-mote; pure Buddha-children fill them all, raining the most wonderful Dharma,\" at once opens the vision of *world-seas* (世界海) that dominates the last pages of the chapter.\n\n### 6.2 十一组菩萨众\n\n卷五**普贤之后列十一组菩萨众**，仍以「承佛威力」各领其众（第一「普观一切菩萨解脱门海」，余「普观一切道场众海」等）：\n\n<details class=\"fold table-fold\"><summary>📋 表·组…（13 行）</summary>\n| 组 | 领众 | 所观 | 偈数 |\n|---|---|---|---|\n| 1 | 净德妙光菩萨 | 一切菩萨解脱门海 | 10 偈 |\n| 2 | 海月光大明菩萨 | 一切菩萨众庄严海 | 10 偈 |\n| 3 | 海慧自在神通王菩萨 | 一切道场众海 | 10 偈 |\n| 4 | 雷音普震菩萨 | 一切道场众海 | 10 偈 |\n| 5 | 众宝光明髻菩萨 | 一切道场众海 | 10 偈 |\n| 6 | 大智日勇猛慧菩萨 | 一切道场众海 | 10 偈 |\n| 7 | 不思议功德宝智印菩萨 | 一切道场众海 | 10 偈 |\n| 8 | 百目莲华髻菩萨 | 一切道场众海 | 10 偈 |\n| 9 | 金燄圆满光菩萨 | 一切道场众海 | 10 偈 |\n| 10 | 法界普音菩萨 | 一切道场众会海 | 11 偈 |\n| 11 | 云音净月菩萨 | 一切道场众会海 | 11 偈 |\n</details>\n\n注：①上表偈数按各组「尔时……即说颂言」之后所续偈文逐组核实（组 1 至组 9 各 10 偈，组 10、11 各 11 偈）。②「普观一切道场众海」语，第二组以下诸组同之；卷一「其名曰」二十菩萨中，净德妙光、海月光大明、众宝光明髻、法界普音、云音净月等名可一一对勘。\n\n### 6.3 卷五末：善勇猛光幢菩萨·六种震动·供养云\n\n卷五经历十一组菩萨颂后缀以善勇猛光幢菩萨之颂（**承佛威神**，说如来自在神通等十颂），然后为：\n\n> **经文**　爾時善勇猛光幢菩薩摩訶薩，承佛威神，觀察十方，即說頌言：……「……皆佛相中明了見」。爾時華藏莊嚴世界海，以佛神力，其地一切六種十八相震動。所謂動、遍動、普遍動；起、遍起、普遍起；踊、遍涌、普遍涌；震、遍震、普遍震；吼、遍吼、普遍吼；擊、遍擊、普遍擊。此諸世主，一一皆現不思議諸供養雲，雨於如來道場眾海。……此諸世主，一一皆現如是供養雲，雨於如來道場眾海，靡不周遍。如此世界中，一一世主，心生歡喜，如是供養。其華藏莊嚴世界海中，一切世界所有世主，悉亦如是；而為供養。其一切世界中，悉有如來坐於道場。……\n\n**疏解**　此段为全品之归宿：**震动**在「华藏庄严世界海」（华藏世界海此品首次点出，为《华严》宇宙观之名相），六种十八相震动示佛成道之感应；**供养云**则以「此诸世主，一一皆现」为主语，对回卷一「众海云集」——卷一云集，卷五既闻法已而兴供养，首尾圆合。**卷五之末「悉有如来坐于道场」，与卷一「尔时世尊处于此座」一开一合，本品于是告成。** 而「各各信解、各各所缘、各各三昧方便门」以下十一个「各各」，总摄一切众海各得其门之义，为「解脱门」海洋之结。\n\n> **EN corresponding · 6.3 The End: Quaking, Offerings, and the Rounding of the Chapter**\n>\n> Eleven bodhisattva-groups sung, 善勇猛光幢 (King of Dauntless Radiance) closes with a further chant (sustained this time by the Buddha's *spiritual* power, 承佛威神) upon the Tathāgata's freedom and superknowledges. Then the whole world-sea of Padma-garbha (華藏莊嚴世界海) quakes with the six kinds of eighteen-fold motions — moving, rising, leaping, trembling, roaring, striking, each triple in scope — the response of the cosmos to the Buddha's enlightenment; and every world-lord, one by one, pours out measureless clouds of offerings. This returns to the \"gathering in clouds\" (云集) with which Book One opened. What gathered in Book One, offers in Book Five; and \"in all those worlds the Tathāgata sits on the Bodhimanda\" answers the opening \"at that time the World-Honored One was seated upon this throne.\" The chapter is thus a ring. The closing litany of eleven 各各 — \"each in his own faith-acceptance, each in his own object, each in his own gate of samādhi and skill\" — gathers the whole ocean of beings into the ocean of liberation-gates.\n\n## 附录一　本品「解脱门」计数与比勘\n\n本品全五卷，开「解脱门」为名相连缀；编按与逐组核计如下：\n\n| 卷 | 组数 | 承佛威力组 | 特殊领起 | 编按之总说 |\n| --- | --- | --- | --- | --- |\n| 卷一 | — | 无（仅列名） | 其名曰：普贤菩萨摩诃萨等 | 「介绍异生众中的色界天5众……51位王众」等入名编按 |\n| 卷二 | 12 | 11 组（袖珍版）/9 威力＋1 威神＋2 神力（T279） | 尸弃大梵王作「承佛神力」；T279 另见自在「承佛威神」、月天子「承佛神力」 | 「此卷经文介绍124王及其所得解脱门、123个偈颂」 |\n| 卷三 | 13 | 13 组 | — | 「8个八部四王众……80位王众」等 |\n| 卷四 | 14 | 14 组 | — | — |\n| 卷五 | 普贤颂+11 组菩萨+善勇猛终颂 | 12 处「承佛威力」+1 处「承佛威神」（善勇猛）+普贤「复承如来威神之力」 | — | — |\n\n比勘要旨：①「承佛威力」为卷二至卷五颂言之通式（此依**袖珍版**之统计）；**今据 T279 复核，卷二「承佛神力」实有二处（尸弃大梵王、月天子）、「承佛威神」一处（自在天王）**，袖珍版则唯尸弃作「承佛神力」——两说并存（详见 3.2 注①、1.5）；卷五善勇猛光幢作「承佛威神」、普贤作「以自功德复承如来威神之力」。②卷二次第自大自在（色界上首）讫月天子，恰与卷一并卷三、卷四之列名序倒行（详见 4.2）。③「解脱门」字数层出，本文不作汇总之数，逐组门名可依正文各表及源文（八十华严 T10n0279）比勘。\n\n## 附录二　会众名号分类总表（卷一）\n\n依经文列名次序，卷一会众可析为「同生众」与「异生众」两大部分：\n\n<details class=\"fold table-fold\"><summary>📋 表·类…（40 行）</summary>\n| 类 | 众名 | 上首（首名） | 明记数译文 | 特点 |\n| --- | --- | --- | --- | --- |\n| 同生众 | 菩萨摩诃萨（其名曰二十） | 普贤菩萨摩诃萨 | 有佛世界微尘数 | 皆与毘卢遮那如来共集善根；「同生」义依海云法师讲记，喻与佛同心毕竟同向 |\n| 异生众·十九类神 | 执金刚神 | 妙色那罗延执金刚神 | 有佛世界微尘数 | 恆发大愿，愿常亲近供养诸佛 |\n|  | 身众神 | 华髻庄严身众神 | 有佛世界微尘数 | 皆于往昔成就大愿供养承事诸佛 |\n|  | 足行神 | 宝印手足行神 | 有佛世界微尘数 | 亲近如来随逐不舍 |\n|  | 道场神 | 净庄严幢道场神 | 有佛世界微尘数 | 于过去值无量佛成就愿力 |\n|  | 主城神 | 宝峰光耀主城神 | 有佛世界微尘数 | 严净如来所居宫殿 |\n|  | 主地神 | 普德净华主地神 | 有佛世界微尘数 | 皆从往昔发深重愿 |\n|  | 主山神 | 宝峰开华主山神 | 复有无量 | 皆于诸法得清净眼 |\n|  | 主林神 | 布华如云主林神 | 复有不可思议数 | 皆有无量可爱光明 |\n|  | 主药神 | 吉祥主药神 | 复有无量 | 性皆离垢，仁慈祐物 |\n|  | 主稼神 | 柔软胜味主稼神 | 复有无量 | 莫不皆得大喜成就 |\n|  | 主河神 | 普发迅流主河神 | 复有无量 | 皆勤作意利益众生 |\n|  | 主海神 | 出现宝光主海神 | 复有无量 | 悉以如来功德大海充满其身 |\n|  | 主水神 | 普兴云幢主水神 | 复有无量 | 常勤救护一切众生而为利益 |\n|  | 主火神 | 普光燄藏主火神 | 复有无数 | 皆能示现种种光明，令诸众生热恼除灭 |\n|  | 主风神 | 无碍光明主风神 | 复有无量 | 皆勤散灭我慢之心 |\n|  | 主空神 | 净光普照主空神 | 复有无量 | 心皆离垢广大明洁 |\n|  | 主方神 | 遍住一切主方神 | 复有无量 | 能以方便普放光明，恆照十方相续不绝 |\n|  | 主夜神 | 普德净光主夜神 | 复有无量 | 皆勤修习以法为乐 |\n|  | 主昼神 | 示现宫殿主昼神 | 复有无量 | 皆于妙法能生信解，恆共精勤严饰宫殿 |\n| 异生众·八部四王 | 阿修罗王 | 罗睺阿修罗王 | 复有无量 | 悉已精勤，摧伏我慢及诸烦恼 |\n|  | 迦楼罗王 | 大速疾力迦楼罗王 | 复有不可思议数 | 悉已成就大方便力，善能救摄一切众生 |\n|  | 紧那罗王 | 善慧光明天紧那罗王 | 复有无量 | 皆勤精进观一切法，心恆快乐自在游戏 |\n|  | 摩睺罗伽王 | 善慧摩睺罗伽王 | 复有无量 | 皆勤修习广大方便，令诸众生永割痴网 |\n|  | 夜叉王 | 毘沙门夜叉王 | 复有无量 | 皆勤守护一切众生 |\n|  | 诸大龙王 | 毘楼博叉龙王 | 复有无量 | 莫不勤力兴云布雨，令诸众生热恼消灭 |\n|  | 鸠槃荼王 | 增长鸠槃荼王 | 复有无量 | 皆勤修学无碍法门，放大光明 |\n|  | 乾闼婆王 | 持国乾闼婆王 | 复有无量 | 皆于大法深生信解，欢喜爱重勤修不倦 |\n| 异生众·欲界天 威力」之异**：卷二尸弃大梵王独作「神力」，余王皆「威力」；卷五善勇猛光幢作「威神」、普贤作「威神之力」。本文仅据字面如实指出异同，不断以天台/华严判教之高下之论——此异于「承佛威神」「承佛威力」在译家笔下是否通假，尚待校刊（T278 六十卷本同段作「承佛威神」与否，待核）。\n\n3. **「无功用行」全品仅一现**（**本批已以繁本复核，此项保留可销**）：第 3.3 节指「无功用行」四字仅于清净功德眼天王解脱门一见。此说原依八〇卷**简本**检索而作，本批以**繁本**（`八十华严-繁-大华严寺袖珍版_1.txt`）及**大正藏版**（`八十华严-大正藏版_1.txt`）复核：三本全文检索「無功用行／无功用行」皆得 2 处命中，**其中落在本品（世主妙严品第一之一～之五）者仅 1 处**，即卷二 L443「清淨功德眼天王．得知一切法不生不滅不來不去**無功用行**解脫門」；另一处见于**卷第三十七 L13161**「從第八地乃至第十地無功用行皆悉成就」，属**出世間品**，不在本品范围。故「本品仅一现」之断言**成立**。惟文中他处凡据简本词频所作之统计（如「全品唯一」类），仍应留意同一方法学限制。\n\n4. **卷五菩萨众名号与「二十菩萨」之对勘未及展开**：卷一「其名曰」列与卷五十一组菩萨众名号之逐一对应（净德妙光、海月光大明、众宝光明髻、法界普音、云音净月等），本文仅举其名，未逐条判其是否同一波罗蜜门；此可作后续延伸。\n\n5. **「五言偈」二处（主空神、执金刚神）之用意**：全品七言为常，独此二组五言；本文如实指出而未敢妄定「以五言行省略收缩」之义，盖两处恰在卷三卷末（主空神）与卷四卷末（执金刚神），疑系译者为分卷收束所变，然无文本内证，姑记待考。\n\n6. **「妙音天」推断**：第 3.5 节将「妙音天」推断为「星宿音妙庄严天王」，此为本文行文之推断，非原文自名（原文该组十一王中无「妙音天」其人）；其说仅供参酌。\n\n7. **海云法师讲记引用皆依袖珍版（M4X3）**：本文「海云法师讲记」引文，悉见于 [八十华严-简-袖珍版_1.txt](../../../docs/huayanhai/义学专题/经论原典/八十华严-简-大华严寺袖珍版_1.txt) 卷端说明与卷中编按（不含卷页码），未另引「过汇编」之外资料；凡超出简本所能证实者，均已如上注明〔待核〕。\n\n8. **未竟事项**：①卷一「其名曰」二十菩萨名号全录及逐名梵文对音（Śāntideva 非跋陀罗辈，须另考）；②卷二至卷四逐解脱门名之全文整理表（本文仅存组首门名及颂）；③八十卷本「世主妙严品」与六十卷本「世间净眼品」品内异文逐字比勘（本文附录五已立「对读骨架」，逐句全比须另册）；④四十卷「入法界品」与本品会众之会通表。——以上四项，皆待后续读经批次补足。\n\n9. **本批校出并已改正之错**（据「进度留痕」如实登记）：**5.1 表卷四组 10、组 11 之偈数原系互换**——旧表作「组 10 宝峰光耀主城神 11 偈、组 11 净庄严幢道场神 10 偈」，经底本逐行实测，主城神偈区为 L1965–L2003（20 半行 ＝ 10 偈）、道场神偈区为 L2009–L2051（22 半行 ＝ **11 偈**），**已据源改正为 10／11**，5.1 表与附录七、七.2 之「按二」三处现已一致。\n\n10. **全品偈数之复核结论（本批完成）**：卷二至卷五各组偈数已逐组回源直读核定——**卷二** 12 组共 **123** 偈（组 3、组 10、组 11 各 11，其余 10；编者按 L987「此卷经文介绍124王…123个偈颂」与 L939「日天子说11个偈颂」、L983「月天子说10个偈颂」**三处互证**）；**卷三** 13 组共 **131** 偈（唯组 3 毘楼博叉龙王 11 偈，偈区 L1091–L1133）；**卷四** 14 组共 **141** 偈（唯组 11 净庄严幢道场神 11 偈；组 14 妙色那罗延执金刚神为五言四句偈，一行即一偈，L2145–L2163 计 10 偈）；**卷五** 普贤 10 偈（L2179 起）、十一组菩萨众中**组 10 法界普音、组 11 云音净月各 11 偈**（偈区分别 L2611–L2653、L2657–L2699）、终颂善勇猛光幢 10 偈（L2703–L2741）。**卷二总数得袖珍版编者按印证，卷三、卷四、卷五之逐组数字则系本批直读核定，先前「系按组累加、未逐偈总校」之保留自此可销。**\n\n## 附录五　八十/六十华严本品对读（八十为主干，六十为辅助）\n\n本文以八十卷本（T0279·实叉难陀译）「世主妙严品」为主干细读；六十卷本（T0278·佛驮跋陀罗译）本品作「**世间净眼品**」，为便于横看两译异同，立对读骨架如下。**六十华严原文悉据** [六十华严_1.txt](../../../docs/huayanhai/义学专题/经论原典/六十华严_1.txt)，八十华严繁体原文据 `八十华严-繁-大华严寺袖珍版_1.txt`，引文逐字照录，不识之字/无法直读之句已回避。\n\n> **EN corresponding · Appendix 5 | Parallel Reading of the 80-fascicle and 60-fascicle recensions.** This study reads the 80-fascicle Chinese recension (T0279, trans. Śikṣānanda; chapter \"The Adornment of the World-Lord,\" 世主妙嚴品) as the main text, with the 60-fascicle recension (T0278, trans. Buddhabhadra; chapter named \"The Pure Eye of the World,\" 世間淨眼品) as a cross-reference. The two chapter titles, their respective fascicle spans (80: fasc. 1–5; 60: most of fasc. 1 and the first part of fasc. 2), the order of the assembled multitudes, the presence or absence of the \"by the Buddha's power…speaks in verse\" introductory formula, and three sample gāthās rendering the same or similar lines in the two versions are compared below. All 60-fascicle quotations are transcribed verbatim from the file listed above; the 80-fascicle quotations use the traditional-character pocket edition.\n\n### 五.1 品名与跨卷对照\n\n| 译 | 译者 | 本品名 | 本品占卷 | 本品卷名所见 | 备注 |\n|---|---|---|---|---|---|\n| 八十卷（唐） | 实叉难陀 | **世主妙严品** | 卷一至卷五 | 第一之一至第一之五 | 每会众有「承佛威力……而说颂言」导语 |\n| 六十卷（晋） | 佛驮跋陀罗 | **世间净眼品** | 卷一全＋卷二前段 | 卷一「第一之一」、卷二「第一之二」 | 无颂前导语，列名后直接颂偈 |\n\n跨卷差异之因：六十卷本于卷二中部即转「卢舍那佛品第二」，其「世间净眼品」止于「尔时佛神力故。莲华藏庄严世界海。六种十八相震动」段（六十卷本 L8-848 实测）；八十卷本将此段及其后菩萨众颂、普贤颂、震动供养云扩展为五卷。\n\n### 五.2 会众次第对读\n\n八十卷本（据卷一首会次第）：普贤菩萨为首十普菩萨 → 佛世界微尘数·杂类诸神众（十九类神） → 八部四王众 → 欲界天七众 → 色界天五众。\n\n六十卷本（据卷一、卷二）：**普贤菩萨为首十普菩萨** → 色界天众（乐业光明天王→净智天王→爱乐天子→尸弃大梵天→自在天王→善化天王→兜率天王→夜摩天王） → 卷二：释提桓因→日光天子→月天子→持国乾闼婆王→毗楼勒鸠盤荼王→毗楼波叉龙王→毗沙门夜叉王→金刚眼照力士 → 菩萨众（海慧超越菩萨等）。\n\n> 简释：八十卷本将「云集世主」依三世间架构（智正觉—器—眷属）分列：先菩萨，次十九神（器世间），再八部四王与天众（眷属世间）；六十卷本则依天界高下直列（自净居乐业光明讫欲界月天子），八部四王与力士殿后，菩萨众列于最前与最末两处。两本对「会众」的排比原则不同——八十重「三世间分类」，六十重「天界次第」。\n\n### 五.3 首十菩萨名号对读（同主异名）\n\n八十卷本：普贤菩萨摩诃萨·普德最胜灯光照菩萨·普光师子幢菩萨·普宝燄妙光菩萨·普音功德海幢菩萨·普智光照如来境菩萨·普宝髻华幢菩萨·普觉悦意声菩萨·普清净无尽福光菩萨·普光明相菩萨。\n\n六十卷本：普贤菩萨·普德智光菩萨·普明师子菩萨·普胜宝光菩萨·普德海幢菩萨·普慧光照菩萨·普宝华幢菩萨·普胜软音菩萨·普净德焰菩萨·普相光明菩萨。\n\n简释：两本均以**普贤**为首；其余「普」字辈菩萨，名号之「行/德/光/幢/华」意象一一对应而译法稍异（如八十「普光师子幢」对六十「普明师子」，八十「普音功德海幢」对六十「普德海幢」），非两套称谓各别之实，乃同一梵名不同汉译。上表取「首十」以对比名号相承；八十卷本实冠「普」字名号者共十一位（第十一为「普智云日幢菩萨摩诃萨」，见正文 2.7 节），六十卷本首名序至此而尽（第十一位起为「大光海月菩萨」等，非「普」字冠首）。\n\n### 五.4 「承佛威力」导语之异（两译颂体）\n\n- 八十卷本：每会众颂前有显式导语，如「爾時自在天王承佛威力。普觀一切自在天眾而說頌言。」（卷二）、「爾時持國乾闥婆王承佛威力。普觀一切乾闥婆眾而說頌言。」（卷三）。\n- 六十卷本：本品**无此类导语**；列某众名号毕，直接接该众颂偈（如「复有自在天王……」「如来法身等法界 普应众生悉对现」）。\n\n此「导语有无」，正是八十卷本把颂偈固定为「承佛威力—普观一切—说颂言」的文体化标识；六十卷本保持古译直诵体。\n\n### 五.5 同偈异译对读（择三处示例）\n\n**例一·自在天王组首颂**（八十卷二 vs 六十卷一）：\n\n| 译 | 首颂 |\n|---|---|\n| 八十 | 佛身周遍等法界 普應眾生悉現前 |\n| 六十 | 如来法身等法界 普应众生悉对现 |\n\n> 同出「佛身/法身＝等法界，普应/现对众生」一颂，重「常遍现前」境。\n\n**例二·善化天王组首颂**（八十卷一 vs 六十卷一）：\n\n| 译 | 首颂 |\n|---|---|\n| 八十 | 世間業性不思議 佛為群迷悉開示 |\n| 六十 | 法身于世难思议 如来普现应众生 |\n\n> 异句而领导同旨：佛以宿因/法身秘现济群迷。二译对「善化天王」一领众，解门不同（八十「开示一切业变化力」，六十「一切法分别化法门」），故其颂各就本门。\n\n**例三·持国乾闼婆王组首颂**（八十卷三 vs 六十卷二）：\n\n| 译 | 首颂 |\n|---|---|\n| 八十 | 諸佛境界無量門 一切眾生莫能入 |\n| 六十 | 如来境界无量门 一切众生莫能思 |\n\n> 同偈「如来/诸佛境界无量门·众生莫能入/莫能思」，仅末字各随上下句押韵而别。此例最能见两译相承而同文稍异。\n\n### 五.6 对读结论（本文所立，可复核）\n\n①两汉译本最重要差异为**品名**（世主妙严/世间净眼）与**占卷**（五卷/约一卷半）；②会众排比原则不同（三世间分类 vs 天界次第）；③八十以「承佛威力……而说颂言」导语分段，六十无颂前导语；④两本及普贤为首、首十菩萨同名异译、同偈异译处可逐颂互证（如上例）。凡引六十卷本之处本文俱已直录其文，读者可径依大正藏 T0278 复勘。\n\n## 附录六　讲稿与资料入口（出处可回查）\n\n<a id=\"app6\"></a>\n\n本文细读时参考的讲法/学术资料入口如下，均注明出处与文件路径，便于回查原文；**一切引文以源文件为据**，超此范围者本文已标明〔待核〕。\n\n> **EN corresponding · Appendix 6 | Sources and lecture transcripts (verifiable).** The transcripts and textual bases consulted for this close reading are listed below with their file paths for cross-checking. All quotations in this article are taken from these files; anything beyond them is marked 待核 (\"to be verified\"). The five lectures of Venerable Haiyun Jimeng (海雲繼夢) on the present chapter are preserved in this project's `docs/huayanhai` repository; the 80- and 60-fascicle Chinese recensions used here are also kept locally, with CBETA Online links supplied for further reference.\n\n### 六.1 海云继梦法师·世主妙严品讲记（本项目 `docs/huayanhai` 目录内，逐字可查）\n\n| 讲记 | 对应 | 出处（路径） | 说明 |
