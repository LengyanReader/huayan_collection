<script>
var ARTICLE = {"id": "shizhu-miaoyan", "file": "articles/shizhu-miaoyan.html", "title": "世主妙严品细读", "title_sub": "华严经首品·逐卷逐组细读 · 会众名号·颂赞·震动作供 · 中英对照", "icon": "🏛", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读_第一部_世主妙严品.md", "doc_md": "# 华严经细读·第一部：世主妙严品\n\n> 逐句疏解 · 名相训释 · 诸众解脱门会读 · 中英对照\n\n> **EN corresponding · Close Reading of the Avataṃsaka Sūtra, Part One: The Chapter of the Adornment of the World-Lord**\n\n> **A Verse-by-Verse Commentary with Terminological Notes, a Collective Reading of the Liberation Gates of the Assemblies, and Parallel Chinese–English Text**\n\n---\n\n## 〇、凡例\n\n本篇是「华严经文本细读」系列的第一部。系列取「一部一品、逐句不捨」的读经方式，以八十华严三十九品为次第，逐品推进；每一部独立成篇，独立成址，篇内依经卷分章。\n\n一、**底本一律用唐·实叉难陀八十华严**（`T10n0279`），不用六十华严、四十华严改写本，俾免以异译乱原典。凡引经文，一律标明卷次与页码定位，可回 CBETA Online 逐字复核。\n\n二、**凡疏解处，区分三层**：其下「疏解」为本文依经文直解，采信而有据者标明出处；「名相」为梵汉对勘与名相训释，凡学界有异说者并列而不强断；「会读」引本项目所藏海云继梦法师《华严经经首》开示及卷二至卷五讲记，与经文逐节呼应，法师之说属现代传承解，属一家之言，不冒充古注。\n\n三、**引文从严**。凡引澄观《大方广佛华严经随疏演义演义钞》、法藏《华严经探玄记》之语，皆注明经号；未能核到原文者不引，标〔待核〕。凡属本文推断者，明标「〔本文判断〕」，不与经文、古注混同。\n\n四、**存疑与未竟，一律如实标明**〔待核〕〔存疑〕〔未竟〕，不掩其缺。本篇凡属编者未及展开处（如四十华严异本对照、梵藏本对勘），于篇末「未竟与存疑」节列明，不作含混了语。\n\n五、**中英对照**。逐节疏解之后附英文对读，英文以达意为务，不逐字硬译；名相依全站固定术语表（`dharmadhātu` 法界、`bodhimaṇḍa` 菩提道场、`vajra` 金刚、`maṇi` 摩尼、`vairocana` 毗卢遮那、`bodhisattva` 菩萨摩诃萨等），无可通行对译者标〔no standard English equivalent〕，不强造译名。\n\n六、**名号不逐一枚举**。卷一至卷五所列菩萨、天神、八部众名号逾千，本篇于各类众中择代表名号训释，其余归类说明其类别义理与象征系统；名号总数与分类计数，逐一验算，附于附录。\n\n七、**文字遵底本**。所据为台湾大华严寺《八十华严》袖珍版（繁、简各一），该版据其版权页自述「以《大正藏》为底本，复以华严学苑刊本（此本据同治年间四明天童寺刊本重梓）、磧砂本及高丽藏本参校」，并统一了部分体字俗字（如瑠璃→琉璃、徧→遍、覩→睹、踈→疏、輝→晖）。本篇引用该版文字，异体字一概从之，不擅改经文。\n\n八、**此第一品「世主妙严品」之名，卷内五分**（第一之一至第一之五），跨越八十华严卷第一至卷第五，共 32,713 字、1,151 句。经文本体之外，袖珍版另附编者括注五处（标「（以上介绍……）」），非经文，本文凡引皆标「〔袖珍版编者按〕」，与经文严格分开。\n\n---\n\n## 一、底本与校勘\n\n### 1.1 版本源流\n\n八十华严全称《大方广佛华严经》，八十卷，三十九品，唐于阗国三藏沙门实叉难陀译。就本篇所用卷第一至卷第五而言，其文本谱系如下：\n\n| 层 | 文献 | 说明 |\n|---|---|---|\n| 译本底本 | `T10n0279` 八十华严（实叉难陀译，唐） | 本篇逐句疏解的依據 |\n| 本项目用书 | 台湾大华严寺《八十华严》袖珍版（繁／简） | 依《大正藏》为底本，參華严学苑刊本、磧砂本、高麗藏本 |\n| 对读本 | 海云继梦《华严经经首》开示（29 集）、世主妙严品卷二至卷五讲记 | 现代传承解，属会读材料 |\n\n### 1.2 底本核验（本文实测）\n\n本篇开写之前，先以 CBETA `T10n0279` 核验袖珍版文字，核验结果如下（核验日 2026-09-28）：\n\n> **卷首比对。** CBETA 作「如是我聞：一時，佛在摩竭提國阿蘭若法菩提場中，始成正覺。其地堅固，金剛所成；上妙寶輪，及眾寶華、清淨摩尼，以為嚴飾；諸色相海，無邊顯現……」袖珍版简本作「如是我闻.一时佛在摩竭提国阿兰若法菩提场中始成正觉。其地坚固金刚所成.上妙宝轮及众宝华清净摩尼以为严饰.诸色相海无边显现……」，**逐句吻合**，惟标点与字形（瑠璃→琉璃、踈→疏、輝→晖、乾闥婆→干闼婆等）依该版体例有异。\n\n> **一处常见讹说之澄清。** 世主妙严品卷首先有一句「一時佛在摩竭提國阿蘭若法菩提場中始成正覺」，世有以为此乃六十华严（`T10n0278`）语式、八十华严当作「摩訶迦羅道場」者。本文实测：CBETA `T10n0279` 全文检索，**「摩訶迦羅」0 见、「世尊妙相具」0 见，而「摩竭提」8 见**。可知八十华严卷首确实作「摩竭提國阿蘭若法菩提場中」，而「摩訶迦羅道場」乃后世谈七处九会时所用之名，非本经原文措辞。〔待核〕此两名与「七处九会第一会」的对应关系，本项目既未获得澄观《疏》原文可核，暂不強断，仅记此异说之存在。\n\n> **品卷数之订正。** 本品跨经卷第一至第五，共五分（第一之一至第一之五），品末有「大方廣佛華嚴經卷第五竟」。本项目 `data/translation/avatamsaka_studies.yaml` 旧记本品「经文：卷一–三（约三卷）」，**有误，应作卷一至卷五**，本批已源头订正。\n\n### 1.3 袖珍版编者按五处（非经文，已析出）\n\n袖珍版于卷一正文间插编者括注五处，标目为「（以上介绍异生众中的……）」，用以标明所列名号之归属与计数。经核 CBETA `T10n0279`，**此五处括注不见于 CBETA**，故属该版编者所加，本文一律标「〔袖珍版编者按〕」。其计数经本文逐一验算如下：\n\n| 括注位置 | 类别 | 组数 | 每组名号 | 小计 |\n| --- | --- | --- | --- | --- |\n| 卷一 | 杂类诸神众 | 19 组 | 10 | 190 |\n| 卷一 | 八部四王众 | 8 组 | 10 | 80 |\n| 卷一 | 欲界天七众 | 7 组 | 10（其中月天子 11） | 71 |\n| 卷一 | 色界天五众 | 5 组 | 10（其中光音天王 11） | 51 |\n| 卷一 | 菩萨摩诃萨上首 | — | 20 | 20 |\n|  |  |  | **合计** | **412** |\n\n验算：190 + 80 + 71 + 51 + 20 = 412，与编者按「总共是 412 位」相符。其中 71、51 两数之奇数，系月天子与光音天王两组各列 11 名（首名即其本称，后列 10 名从属）所致。此分类（智正觉世间／器世间／眷属世间）本于澄观《疏》之判，见下文 3.6。\n\n---\n\n## 二、卷第一　世主妙严品第一之一（经首）\n\n> 本卷为全经第一卷，亦为「第一会」之开场。经文分两大段：前半叙所证之境（道场、佛身），后半列所会之众（菩萨、诸神、诸天）。澄观判此品属「所信因果」之「信」位，谓佛之功德不自陈，藉世间诸众各以所证之境来显，故名「世主妙严」——世主之言，正由众出。〔详见 2.3、3.6〕\n\n### 2.1 序分：如是我闻\n\n> **经文**　如是我闻。一时佛在摩竭提国阿兰若法菩提场中始成正觉。\n\n**疏解**　此十三字，为全经之纲，亦为一切经首之常。三重限定：\n\n其一，**「如是我闻」**——非谓佛自述，乃结集者明所闻为亲闻。设教所重在此四字，欲使后学者知此地所传乃亲传实行，非传闻、非推断。\n\n其二，**「一时」**——非谓片时，谓某一特定之机。华严以此「一时」为摄法之要：下文无量刹海、无量众生会聚一处，皆系于此一时。\n\n其三，**「佛在摩竭提国阿兰若法菩提场中始成正觉」**——**此十三字为化有事相，非法身境界**。盖「佛在」为所依，「始成正觉」为所证，事相宛然，是为化身海中之事相；而华严所称之境界，在果位、在法身、在一念之间悉包法界者。二者非异而层次有别：事相为门，法身为所入。读此品者，若止于认境之庄严而不透事相，则止于化门，未及华严。\n\n海云继梦法师于此有一警语：华严经中所说多为法身境界，然**此一句是化身境界**；化身属有为法，有为法中所现者即「历事练心」之事相，须透过此事相转入法身。若执「心佛众生始终同」而谓不必修，便是**未透过有为法之关**。\n\n**名相**\n\n- **摩竭提国**：Magadha，摩揭陀，中印度，佛陀生地与成道所在。此「菩提场中」即佛陀于伽耶（Gayā，梵名「苦行林」）成道之场；然经中于摩竭提国内另标「阿兰若法菩提场」，二者是否为同一处所，或为佛陀于不同所成道而后定名此场，本篇未获澄观《疏》原文可核，〔待核〕。\n- **阿兰若法**：`āraṇyavacana-dhātu`，远离喧嚣之林野静居。「阿兰若」为 `āraṇya`（森林、旷野）之音译，「法」者，`dhātu`，世界、境界、要素。华严以「阿兰若法」为佛所住之世界类别，与「室罗伐城逝多林给孤独园」（化城喻）之「化法」相别：前者是「法住之境」，后者是「化现之场」。\n- **菩提场**：`bodhimaṇḍa`，正觉道场。梵 `bodhi`（觉）＋`maṇḍa`（圓场、壇）。中国译「道场」。\n\n> **EN corresponding · 2.1 The Opening Formula**\n>\n> \"Thus have I heard. At one time the Buddha was at Bodhimaṇḍa, the Bodhimaṇḍa of the Āraṇyavacana-dhātu in the kingdom of Magadha, where he first attained enlightenment.\"\n>\n> Three qualifiers are compressed into this one line. First, *evam mayā śrutam* — thus have I heard — is the compiler's assurance of direct hearing rather than report or inference. Second, *ekasmin samaye* — at one time — marks not a fleeting moment but a single defining occasion; the innumerable Buddha-lands and beings gathered below all depend on this one \"occasion.\" Third, and decisively for reading the rest of the chapter, the clause describing the Buddha's enlightenment is a description of a **form-body event** (nirmāṇarūpa), not yet of the dharmakāya. \"The Buddha was at…\" gives a location; \"first attained enlightenment\" gives an attainment. Both are 事相, concrete events — and in the Huayan idiom, 事相 is the gate, not the goal. The reality this chapter is actually describing lies beyond them: it is \"in a single instant, all dharmadhātus are encompassed.\"\n>\n> Master Haiyun Jimeng insists on exactly this distinction: although the Avataṃsaka speaks throughout of the dharmakāya, this opening sentence belongs to the nirmāṇarūpa, a \"concrete occasion for training the mind in successive acts\" (歷事練心). One must pass through the event to enter the reality. A reader who stops at marveling at the adornment of the visible scene has entered the form-body's gate and no further.\n\n### 2.2 道场庄严（一）：地\n\n> **经文**　其地坚固金刚所成，上妙宝轮及众宝华清净摩尼以为严饰。诸色相海无边显现，摩尼为幢常放光明，恆出妙音。众宝罗网，妙香华缨周匝垂布。摩尼宝王变现自在，雨无尽宝及众妙华分散于地。宝树行列，枝叶光茂。佛神力故，令此道场一切庄严于中影现。\n\n**疏解**　此段写「地」，一句之内，九事并列，而其结构实有次第：\n\n**第一层：质地。**「其地坚固金刚所成」——`vajra` 金刚，此处非指金刚石之硬，而以金刚喻「不坏」与「可贯穿」二义：不坏，故能承载无量庄严；可贯穿，故下句「雨无尽宝」得以落而不滞。\n\n**第二层：严饰。**「上妙宝轮及众宝华，清净摩尼以为严饰」——宝轮、宝华、摩尼三者，宝轮为轮次之华（地面之华轮），宝华为行列之华，摩尼为光色之华。凡此皆「严饰」，即于其上加以装饬，而非其本体；此正是后文「一念之间悉包法界」之伏笔——所现者乃影，非实体。\n\n**第三层：量。**「诸色相海无边显现」——**「海」字为华严量词**。凡言「无边」「无量」「不思议」者，必曰「海」；此「色相海」者，非指颜色之众多，谓诸色相之数量如海，深广无边。同理下文「功德海」「众福大海」「三昧海门」。\n\n**第四层：竖向与音声。**「摩尼为幢常放光明，恆出妙音」——幢者，竖立之幡。摩尼宝树之幢，恒发光明、恒出妙音。光明属「色」，妙音属「声」；色声二事同时恒常，故下句「众宝罗网，妙香华缨周匝垂布」之香与华，实承此而进：光、音、香、华，四事俱足。\n\n**第五层：网与垂布。**「众宝罗网，妙香华缨周匝垂布」——网者，横遍；垂布者，垂下。华严写庄严惯用此法：以网横结其上，以缨垂布其侧，使「广」与「深」同时成立；上无所盖而不显其空，下无所坠而不见其限。\n\n**第六层：宝王变现。**「摩尼宝王变现自在，雨无尽宝及众妙华分散于地」——**「变现自在」四字为一大关键**。宝王（`maṇiratna`）能变现，且「自在」；故无尽宝与妙华之雨，不必待外力而自散于地。**此处已启全品之枢机：华严之庄严，非被动之堆砌，而是「自在」之变现。**\n\n**第七层：宝树。**「宝树行列，枝叶光茂」——行列者，齐整；光茂者，枝叶发光而繁茂。列于地者，树。\n\n**第八层：结语。**「佛神力故，令此道场一切庄严于中影现」——**「影现」二字是全段的眼目**。经中不说此等庄严「实有」，只说「影现」。故此地非实境，乃佛神力之所投之影；然亦非幻妄，因「佛神力故」。此四字，正是华严「理事无碍」的最初表达：所现为影（事），其体为法界（理）。\n\n海云继梦法师于此处有一读法：他把这「地」读作极乐世界图的最底层（图纸以「地」为起点，故曰「经文是从这个地方讲起」），并以「摩尼」释为「自在」——**摩尼者，自在也**；可译作自在，因其「显现出来在用」方为自在。法师于此反复申说：世人之所以不能如佛者，在「觉」；不觉，则「佛的那个宝就用不出来」，虽名摩尼而实不能自在。此节读经，法眼与事观并用，正可见现代讲经传统如何在名相上作活参。\n\n> **EN corresponding · 2.2 The Adornment of the Ground**\n>\n> \"The ground is solid, made of vajra; above it, the excellent jeweled wheels and jewel-flowers, and pure maṇi are its adornment. The sea of forms and colors appears without limit. Maṇi serves as banners, constantly radiating light and ceaselessly emitting wondrous sounds. Nets of many jewels, and fragrant flower-tassels hang down all around. Jewel-kings of maṇi appear of their own accord; endless jewels and wondrous flowers rain down and scatter on the ground. Jewel-trees stand in rows, their branches and foliage lush with light. By the Buddha's divine power, every ornament of this bodhimaṇḍa appears therein as a reflected image.\"\n>\n> Nine items of adornment accumulate in a single sentence, yet the passage has a strict internal order: the *substance* of the ground (vajra, solid because it cannot be destroyed, and permeable because what is poured upon it does not obstruct); its *adornment* (wheels, flowers, maṇi); its *quantity* — note that \"sea\" (海) is the Huayan measure-word for boundlessness, so that \"sea of forms and colors\" does not mean many colors but an immensity like the ocean; its *vertical reach* and its *voice*; its *horizontal net* and *hanging tassels*, a device by which Huayan achieves breadth and depth at once; and then the decisive clause. \"Appears of their own accord\" (變現自在) and \"appears as a reflected image\" (影現) are the two hinges. The adornment is neither a passive pile of precious things nor a dream: it is the self-manifesting activity of maṇi, and it is *shadow* rather than substance, shadow cast by the Buddha's divine power. Here, at the very first line, Huayan states the germ of 理事無礙 — that which appears is the event, and the ground of it is dharmadhātu.\n>\n> Haiyun's reading is characteristically practical. He takes \"ground\" as the bottom layer of the Western Pure Land mandala image he uses for teaching, and glosses 摩尼 as \"self-sovereign\" (自在), insisting that maṇi is maṇi only when it is actually in use. The treasure of the Buddhas is available to everyone; what blocks its use, he says, is the failure of awakening. A treasure that is not brought into use is called 摩尼 but is not yet called 自在.\n\n### 2.3 道场庄严（二）：菩提树\n\n> **经文**　其菩提树高显殊特，金刚为身，琉璃为干，众杂妙宝以为枝条。宝叶扶疏垂荫如云。宝华杂色分枝布影，复以摩尼而为其果。含晖发燄与华间列。其树周圆咸放光明，于光明中雨摩尼宝，摩尼宝内有诸菩萨，其众如云俱时出现。又以如来威神力故，其菩提树恆出妙音，说种种法无有尽极。\n\n**疏解**　此段写「树」，与前段之「地」相应，然已在写「地」之中见「佛」：\n\n**树身七事。** 高显殊特（体量与姿态）／金刚为身（体坚）／琉璃为干（干透明净）／众杂妙宝为枝条（枝）／宝叶扶疏垂荫如云（叶）／宝华杂色分枝布影（花）／复以摩尼为其果（果）。**身、干、枝、叶、花、果，六事备具，而最要紧的是「果」用摩尼**——树之果乃其究竟所结，故华严以「摩尼」为果：修行所结之果，是「自在」。\n\n**「影」的第二次出现。**「分枝布影」——与前段「于中影现」相应。华严写树，重在其影；影者，光之所投。**故经中反复说光明，而光明是影之因。**\n\n**「发燄」。**「含晖发燄」——「燄」同「焰」，火也。华严不用「光焰」为一物，而分「晖」与「焰」：晖者含而不放，焰者放而不含。含晖者内敛之光，发焰者外扬之光。\n\n**「周圆」。**「其树周圆咸放光明」——「周圆」二字是华严的常用词，谓圆满无缺、无所不周。**凡经中说「周圆」「周遍」「周含」，皆是这个意思：不是范围大，而是无一处在其外。**\n\n**「雨摩尼宝」而「菩萨其中」。** 此为全段最奇之笔：菩提树于光明中雨摩尼宝，而**摩尼宝内则有诸菩萨，其众如云**。华严之「影现」至此遂成人——树所投之影中，菩萨之众同时出现。故经言「摩尼宝王变现自在」者，至此有了实证：所变现者，非宝也，乃宝中之人。\n\n**结语：树能说法。**「其菩提树恆出妙音，说种种法无有尽极」——**树恒出妙音，说种种法，无有尽极**。此句须与下文「复以诸佛威神所持，演说如来广大境界」合看：树之出声，犹是佛之出声，树与佛此处不二。华严写「自然」之法门，常用此法：不说佛作何作用，但写境之本身自然作何用；如道树自鸣、慈竹自动，故用以显法尔（法尔如此）之理。\n\n**名相**\n\n- **琉璃**：`vaidūrya`，青绿色的宝石（另名「吠琉璃」「颇梨」）。梵汉佛典中此物多与 `maṇi`（摩尼，泛指宝珠）、`ratna`（宝）分列，琉璃偏指色相清净光洁者。\n- **含晖发焰**：内光为晖，外光为焰。〔名相训释〕华严常以「晖」「焰」分指佛德之内敛与外显，如后文卷五「摩尼幢上燃焰」之类，可参看澄观《疏》相应处〔待核原句〕。\n- **无有尽极**：尽极即究竟、终限。经中数见「无有尽极」「无有终尽」，皆谓其义无尽，非谓其量无尽。\n\n> **EN corresponding · 2.3 The Bodhi-Tree**\n>\n> \"The bodhi-tree is tall, manifest, and without equal: of vajra for its trunk, of vaidūrya for its stem, of many precious materials for its branches; its jeweled leaves are spreading and shade like a cloud. Jewel-flowers of varied colors cast their shadows from limb to limb, and maṇi serves as its fruit. Holding light within, it sends forth flame, alternating with the flowers. All around, the tree radiates light, and within that light it rains down maṇi-jewels; within those maṇi-jewels there are bodhisattvas, their assembly like a cloud, appearing all at once. And by the Tathāgata's mighty spiritual power, this bodhi-tree ceaselessly emits wondrous sounds and speaks all manner of dharmas without end.\"\n>\n> Six parts of the tree are described — trunk, stem, branches, leaves, flowers, fruit — and the fruit alone is maṇi. What the practice brings to fruition, Huayan says, is self-sovereignty. Then the passage performs its most striking move: the tree rains maṇi-jewels, and *within* those jewels there appear bodhisattvas. What the tree \"freely manifests\" (變現自在) therefore turns out to be not jewels at all but persons. The image projected by light contains the assembly. Finally the tree speaks. The tree's voice and the Buddha's voice are the same voice, which is how Huayan indicates that this mode of operation is not something performed but belongs to the nature of things: 道樹自鳴, the bodhi-tree sounds by itself.\n\n### 2.4 道场庄严（三）：宫殿楼阁\n\n> **经文**　如来所处宫殿楼阁，广博严丽充遍十方。众色摩尼之所集成，种种宝华以为庄校。诸庄严具流光如云，从宫殿间萃影成幢。无边菩萨道场众会咸集其所，以能出现诸佛光明、不思议音摩尼宝王而为其网。如来自在神通之力，所有境界皆从中出。一切众生居处屋宅，皆于此中现其影像。又以诸佛神力所加，一念之间悉包法界。\n\n**疏解**　自「菩提树」转出「宫殿楼阁」，写佛所住之处。经中三处提法界，为本卷第一处「法界」义之伏笔：\n\n**「广博严丽充遍十方」。** 广博者，宽广而深博；严丽者，庄严而华美；充遍十方者，无所不周。**此三语已是不坏净、无障碍之义，然尚未言「遍」。**\n\n**「众色摩尼之所集成」。** 宫殿非木石所造，乃众色摩尼集成。故下文「诸庄严具流光如云，从宫殿间萃影成幢」——宫与宫之间，光影聚集成幢。**注意「萃」字：影自「间」出。** 华严之严饰，皆在缝隙、在交界处显出；非但见其大体，更见其转折。\n\n**「咸集其所」。** 无边菩萨之众会咸集于此。**「咸」字是华严的标志**——凡「咸」则无一例外、无有参差。\n\n**「以能出现诸佛光明、不思议音、摩尼宝王，而为其网」。** 此句须细读。「以能」二字，谓菩萨众会之所以能聚集于此者，以其能出现（出）三种事：一、诸佛光明；二、不思议音；三、摩尼宝王。三者合而为其网。**网者，普遍而含容。** 故华严写「网」必与「出」并：网不是罩住，是让一切通过而出。\n\n**「如来自在神通之力，所有境界皆从中出」。**——**「从中出」三字，与前「皆从中出」相应，而此处直说「所有境界」。** 至此，华严的两大关键语「自在」与「境界」并出矣。华严的「境界」非今日汉语之「境况」，旧注家多训为「心所缘之域」（唯心所造之境），亦可对 `āyatana`「处所·要素」与 `visaya`「所缘」二义〔译名依各家而异，本文并存两说，标〔待核〕〕；故「所有境界皆从中出」者，谓一切法界作用，无不由此神通之力流出。\n\n**「一切众生居处屋宅，皆于此中现其影像」。**——前句是佛境界流出，此句是众生境界映入。**一出一入，而皆不离此一宫殿。** 故经不别设「众生住处」与「佛所住处」，唯言皆于此中现其影像。\n\n**「一念之间悉包法界」。**——**本卷第一次出现「法界」二字。** 且注意用字：前皆言「十方」「一切境界」「一切世界」，至此方言「法界」。经文以「包」为喻：法界大，而能包之者一念。**一念与法界之悬隔，被这句话取消了。** 此即海云法师所说「法身境界」之最初一现：一念之间，悉包法界——非量之宏大，乃时之短促。\n\n> **EN corresponding · 2.4 Palace, Tower, and Spire**\n>\n> \"The palace-towers and lofts in which the Tathāgata abides are broad, stately, and gloriously adorned, extending throughout the ten directions. They are composed of maṇi of many colors; jewel-flowers of every sort serve as their finial ornamentation. Streams of light from the adornments flow like clouds, and their gathered shadows form spires between the palaces. Assemblies of bodhisattvas without end gather at that place, and being able to manifest the Buddhas' light, their wondrous sounds, and jewel-kings of maṇi, these form its net. All the states of being that the Tathāgata's self-sovereign transformative power embraces issue from it. The dwellings of all sentient beings, their houses and rooms, all appear within it as reflected images. And by the spiritual power of the Buddhas, in a single instant it encompasses the entire dharmadhātu.\"\n>\n> The palaces are not made of matter but of maṇi; and their shadows, gathering *between* the buildings, become spires. Huayan is consistently drawn to what happens at joints and intervals, not to masses. The bodhisattvas' assemblies \"form the net,\" and a net in Huayan is not a cage: the three things they manifest — light, sound, and jewel-kings — pass *through* it, and the text says they issue forth (皆從中出). One clause gives the outward flow of the Buddha's realm; the next gives the inward appearance of every being's dwelling. Both occur in the one structure, which is why no separate dwelling for sentient beings is posited.\n>\n> Then, at last, the first appearance of dharmadhātu in the chapter. Everything before this point has been \"the ten directions,\" \"all states,\" \"all worlds.\" Now it is named. The verb is 包 — to enclose. A single instant encloses the dharmadhātu. The enormous disparity between \"a single instant\" and \"the entire dharmadhātu\" is simply abolished in five characters. Here is the first glimpse of the dharmakāya that Haiyun identifies: 境界量, not 修行量.\n\n### 2.5 道场庄严（四）：师子座\n\n> **经文**　其师子座高广妙好，摩尼为臺，莲华为网，清净妙宝以为其轮。众色杂华而作璎珞。堂榭楼阁阶砌户牖，凡诸物像备体庄严。宝树枝果周回间列，摩尼光云互相照耀。十方诸佛化现珠王，一切菩萨髻中妙宝，悉放光明而来莹烛。复以诸佛威神所持，演说如来广大境界，妙音遐畅无处不及。\n\n**疏解**　写完佛所住之「处」，续写佛所坐之「座」。座在经中非同寻常的坐具，而是**法之所在**，故此处句句在写「座」而实句句在写「法」。\n\n**座之四事。** 摩尼为臺（台）／莲华为网（网）／清净妙宝为其轮（轮）／众色杂华作璎珞（璎珞）。**臺、网、轮、璎珞，恰是「行、住、坐、卧」四威仪之庄严化用**——凡一切器物皆转为法之庄严，故经中随手取象，随象立法。\n\n**「凡诸物像备体庄严」。** 堂、榭、楼、阁、阶、砌、户、牖，八种建筑与构件，无一不备。**「备体」二字尤可玩味**：非曰略备，曰备其全体。**华严的「严」从来不是整齐，而是无阙。**\n\n**「互相照耀」。** 宝树枝果周回间列，摩尼光云互相照耀。**「互相」而非「递相」**——光云不是依次传递，而是同时互照。**华严的相互性（reciprocity），在此已见其端倪。**\n\n**「十方诸佛化现珠王，一切菩萨髻中妙宝，悉放光明而来莹烛」。** 此句是全品极重要的一句，**因为它写出了华严宇宙的「同一」**：十方诸佛在此化现珠王，十方菩萨髻中之宝在此放光来烛。**故「此土」与「十方」在同一座中同时发生。** 后文如来现相品「眉间白毫放光，光中现无量世界」，正是此句的放大。\n\n**「妙音遐畅无处不及」。** 座复持妙音而说广大境界。「遐畅」者，声传遥远而通畅；「无处不及」者，无所不至。**故此座兼具三重身份：物象之严（璎珞珠玉）、众圣之会（诸佛菩萨咸来）、教化之行（妙音遐畅）。**\n\n> **EN corresponding · 2.5 The Lion Throne**\n>\n> \"The lion-throne is tall, spacious, and wondrous: maṇi for its platform, lotuses for its net, pure precious substances for its wheels, flowers of many colors for its canopy. Halls, pavilions, towers, lofts, steps, and doorways — every object and form is adorned in its entirety. Jewel-branches and their fruits are ranged about in intervals, and clouds of maṇi-light illumine one another. Buddhas of the ten directions manifest jewel-kings there, and the exquisite jewels in the headdresses of bodhisattvas all radiate light and come to illuminate. Sustained by the Buddhas' spiritual power, it expounds the Tathāgata's vast states, and its wondrous voice resounds far and smoothly, reaching everywhere.\"\n>\n> The throne is written as four ornaments — platform, net, wheels, canopy — which are the four postures turned into sacred ornament. Everything is converted: the seat is not a seat but 法, dharma. Note \"each and every object is adorned in its entirety\" (備體莊嚴) — Huayan's fullness is not symmetry but the absence of any deficiency. Note too that the light-clouds \"illumine one another\" (互相照耀), simultaneously rather than in sequence: the reciprocity that will become 事事無礙 begins here. And note who attends the throne: Buddhas of the ten directions manifest themselves as jewels, and bodhisattvas bring their headdress-jewels to shine. \"Here\" and \"the ten directions\" are happening in the same structure at the same moment. This single sentence is the miniature of what the following chapter will magnify, when light from between the Buddha's brows displays innumerable worlds.\n\n### 2.6 正觉已入：佛的境界\n\n> **经文**　尔时世尊处于此座，于一切法成最正觉。智入三世悉皆平等。其身充满一切世间，其音普顺十方国土。譬如虚空具含众像，于诸境界无所分别。又如虚空普遍一切，于诸国土平等随入。身恒遍坐一切道场，菩萨众中威光赫奕，如日轮出照明世界。三世所行众福大海悉已清净，而恒示生诸佛国土，无边色相圆满光明，遍周法界等无差别。演一切法如布大云，一一毛端悉能容受一切世界而无障碍。各现无量神通之力，教化调伏一切众生。身遍十方而无来往，智入诸相了法空寂。三世诸佛所有神变，于光明中靡不咸睹。一切佛土不可思议劫，所有庄严悉令显现。有十佛世界微尘数菩萨摩诃萨所共围绕。\n\n**疏解**　**此段是世主妙严品的思想核心，全品之眼目所在。** 前五段写境，此段写佛；境是所住，佛是能住；然经文不作「佛语」，而直陈佛之「是」：以十一个「其……」与一连串譬喻，写出佛身佛智之相。澄观谓此属「所信因果」之信位，方东美谓此是「法界缘起」的宇宙论宣言。今逐句疏解如下。\n\n**（1）「于一切法成最正觉」。** 「一切法」为一切事造、一切实相；「最正觉」为无上正等正觉（`anuttara-samyak-sambodhi`）。**此句是因位之实语：佛于此已究竟证入，无余。** 华严说「最正觉」，不落在某一法上，而在「一切法」上；故下文紧接一句「智入三世悉皆平等」——正觉是遍知，不是独知。\n\n**（2）「智入三世悉皆平等」。** 智入过去、现在、未来三世，而三者悉皆平等。**「平等」二字是华严的枢纽**：世尊正觉，非以一时代为胜，而于三世无差别。**经中于此已启「即」法：时间之三世，于智中平等，故非并列而是同一。**\n\n**（3）「其身充满一切世间」。** 前言智之平等，此言身之普遍。「充满」不是占据，是**盈满而无空隙**。\n\n**（4）「其音普顺十方国土」。** 身普遍于一切世间，音普顺于十方国土。**身与音，一隐一显，一遍一方。** 华严写佛，从来不写佛「在」某处，而写其「充满」；故佛与世间无内外之隔。\n\n**（5）「譬如虚空具含众像，于诸境界无所分别。」** ——**第一个譬喻：虚空间喻。** 虚空含众像而不碍众像，众像在而虚空不损。此义即后世所称之「真如实相」：**能含万有而自身无相**。故曰「于诸境界无所分别」——分别者，识之作用；虚空喻体，不以分别为自体。\n\n**（6）「又如虚空普遍一切，于诸国土平等随入。」** ——**第二个譬喻：虚空遍喻。** 前喻取「含」（含众像），此喻取「遍」（普遍一切）。**「平等随入」三字尤可玩味**：佛之身随入一切国土，无有拣择，无有亲疏。**故华严的「普遍」不是「到处一样」，而是「到处处能与彼合」。**\n\n**（7）「身恒遍坐一切道场，菩萨众中威光赫奕，如日轮出照明世界。」** ——「身恒遍坐一切道场」：非但普遍，且**恒常**，遍坐。「如日轮出照明世界」：日轮出而后世界明；佛之威光赫奕，而后菩萨众得照。**此句把佛与菩萨的关系交代清楚：佛为能照，菩萨为所照；而能照之所以为能照，正在其自身无相而能容一切相。**\n\n**（8）「三世所行众福大海悉已清净，而恒示生诸佛国土。」** ——「三世所行」者，三世中佛所行之事；「众福大海」者，福之量如海；「悉已清净」者，已无残余。**「而恒示生」三字极奇**：**已净而复现。** 已究竟清净，而仍「恒示生」于诸佛国土。**这不是说佛有修有证，而是说：果位之上，示现之行无有间断。** 华严的「示生」与「常寂光」并存而不相碍，正由此句点出。\n\n**（9）「无边色相圆满光明，遍周法界等无差别。」** ——「无边色相」之「圆满光明」，遍周法界，而「等无差别」。**「等无差别」是本卷中第一处「无差别」的正面宣告**；而此无差别不是在「一」之中取消差别，是在「遍周法界」之中遍周而无差。**故华严的无差别，是无碍，不是泯灭。**\n\n**（10）「演一切法如布大云，一一毛端悉能容受一切世界而无障碍。」** ——**此为全段最弘阔之句，且是本品思想的关键。** 「演一切法」如「布大云」——**云喻**。云者，聚而成形，散而无质，覆而不塞。「一一毛端悉能容受一切世界而无障碍」——**毛端容世界**：极小者含极大者，而无碍。此即后世所称之「因小含大」「一即一切」的最初表述。**须与 2.4「一念之间悉包法界」合观：一念包法界，毛端容世界，二事同构。**\n\n**（11）「各现无量神通之力，教化调伏一切众生。」** ——「各现」者，各各现前；「教化调伏」者，先教后调，教以开悟，调以伏心。**此句从「境界」落到「作用」，故是全段的转折：前皆言佛之「是」，此始言佛之「为」。**\n\n**（12）「身遍十方而无来往，智入诸相了法空寂。」** ——**此二句为一组「有／空」对举。** 身遍十方而无来往：**遍而不迁，住而不动**。智入诸相而了法空寂：**历相而不住相，证空而不落空**。**「身遍」与「智入」相对，一在事一在理，一有为一无为。** 经不说「身是法界」，而说身遍十方、智了法空，两头并置；此即华严「理事无碍」的又一种表达。\n\n**（13）「三世诸佛所有神变，于光明中靡不咸睹。」** ——「靡不咸睹」：**无不皆见。** 华严写佛的境界量，不从佛自己说，而从「见」上说：**三世诸佛所有神变，众生一照明中皆见。**\n\n**（14）「一切佛土不可思议劫，所有庄严悉令显现。」** ——此句承接上句，「所有庄严悉令显现」，与 2.2「于中影现」呼应。**「悉令显现」：令者，使也——是佛主动使其显现，非自然存在。**\n\n**（15）「有十佛世界微尘数菩萨摩诃萨所共围绕。」** ——经文自「佛之境界」转入「会众之众」。**「十佛世界微尘数」为华严计数之常法：微尘（`paramāṇu`）为极小，佛世界（`buddhakṣetra`）为极大，取二极相乘，以示其量不可为数量所限。**\n\n**名相**\n\n- **最正觉**：无上正等正觉，略称「佛果」。\n- **神变**：`yuṅkarikāra`（亦作 `ṛddhi`），佛或菩萨所现之变化神通。华严于此用「神变」而不用「神通」，盖「神通」偏于能，「神变」兼及其变。\n- **微尘**：极小之量。华严一切计数（十佛世界微尘数、佛世界微尘数）皆出此法。\n\n**会读**\n\n海云继梦法师讲此段，着重两点：\n\n其一，法师以为此段是全经「**法身境界**」的第一处正面展开，而 2.1「如是我闻……始成正觉」为化身事相；由事相入法身，方为读经之正路。法师并申：若执「心佛众生始终同」遂谓「不必修」，则是**未透过有为法之关**——「试将心比佛，与佛始终同」之语，是要人比对，不是要人不修。\n\n其二，法师于此反复用「一念之间悉包法界」讲**时之短促与量之弘大之不相碍**。盖常人以「无量」为难、以「一念」为易，故不敢思「一念含无量」；法师则谓此正是华严教人抬头处。若不敢思，则须先经「前行资粮」「资粮道」之次第，不得躐等。\n\n澄观《疏》于此处之判（据本项目既有条目所引）：「佛成正觉，十方同见，而云世主妙严者，要因世主以显佛德」——**佛之功德不 自说，藉世间诸众以各自所证之境来显。** 此说与本段末尾「有十佛世界微尘数菩萨摩诃萨所共围绕」之文脉正合：经文确实是以「会众将起」为「佛境已足」之收束。\n\n> **EN corresponding · 2.6 The Buddha's State as Realized**\n>\n> \"At that time the World-Lord, seated on that throne, had attained the unsurpassed, complete enlightenment with respect to all dharmas. His knowledge penetrates the three times and finds them perfectly equal. His body fills all the worlds; his voice accords with the lands of the ten directions. Like the great void, which contains all images yet differentiates in no sphere of existence; like the great void again, which pervades all things and enters every land with perfect equality. His body constantly occupies every bodhimaṇḍa, and amid the bodhisattvas his radiance is blazing, like the sun's disc rising to illuminate the world. The three times' deeds, the sea of all blessings, are utterly purified, yet he continually manifests birth in the Buddhas' lands. His endless forms and colors, his perfectly rounded light, pervade the dharmadhātu with no distinction at all. He expounds all dharmas as a great cloud spreads out: in each single hair-pore he fully contains every world without obstruction. Each manifests immeasurable powers; he teaches and tames all beings. His body pervades the ten directions yet never comes or goes; his knowledge enters every mark and understands the emptiness of all dharmas. Every transformation of the Buddhas of the three times is beheld in the light, without exception. All the adornments of all Buddha-lands through unimagurable kalpas, he causes to appear. And he is surrounded by a number of bodhisattvas equal to the motes of dust in ten Buddha-worlds.\"\n>\n> This paragraph is the heart of the chapter. Two similes of the void do the main work: the void *contains* all images without being divided among them, and the void *pervades* all things, entering every land equally. Then comes the claim that governs the rest: \"in each single hair-pore he fully contains every world without obstruction\" (一一毛端悉能容受一切世界而無障礙). Compare its structure with the palace's \"in a single instant it encompasses the entire dharmadhātu\" (一念之間悉包法界). Both abolish an asymmetry of scale — instant against dharmadhātu, hair-pore against world — without reducing either term.\n>\n> Two further clauses deserve care. \"The sea of all blessings is utterly purified, yet he continually manifests birth\" (而恒示生) — Huayan holds perfected purity and continual manifestation together, not as two stages but as one activity. And \"his body pervades the ten directions yet never comes or goes; his knowledge enters every mark and understands emptiness\" (身遍十方而無來往，智入諸相了法空寂) places the having and the empty, the event and its principle, side by side without resolving one into the other: 理事無礙.\n>\n> The paragraph does not close on the Buddha's state. It closes on the assembly — \"surrounded by a number of bodhisattvas equal to the motes of dust in ten Buddha-worlds\" — which is precisely the logic Chongguan extracts when he says that this chapter is called the Adornment of the World-Lord *because the World's Lords are the ones who display the Buddha's virtue*: the Buddha's fullness is not asserted for itself but is disclosed by those gathered around.\n\n### 2.7 会众之一：智正觉世间（上首十普菩萨）\n\n> **经文**　其名曰：普贤菩萨摩诃萨、普德最胜灯光照菩萨摩诃萨、普光师子幢菩萨摩诃萨、普宝燄妙光菩萨摩诃萨、普音功德海幢菩萨摩诃萨、普智光照如来境菩萨摩诃萨、普宝髻华幢菩萨摩诃萨、普觉悦意声菩萨摩诃萨、普清净无尽福光菩萨摩诃萨、普光明相菩萨摩诃萨、海月光大明菩萨摩诃萨、云音海光无垢藏菩萨摩诃萨、功德宝髻智生菩萨摩诃萨、功德自在王大光菩萨摩诃萨、善勇猛莲华髻菩萨摩诃萨、普智云日幢菩萨摩诃萨、大精进金刚脐菩萨摩诃萨、香燄光幢菩萨摩诃萨、大明德深美音菩萨摩诃萨、大福光智生菩萨摩诃萨。如是等而为上首，有十佛世界微尘数。\n\n**疏解**　**卷一之名号由此开始。** 华严立会之法，与他经不同：他经列众，或依位次，或依亲疏；华严列众，**依其所证**。故本经所列名号皆非人名，而是「法名」——每一名称即一重境界的标示。读华严之名号，须如读华严之偈，不得当作名录观。\n\n**上首二十位。** 经文列二十名，而括注称「如是等而为上首」。此二十名中，首位为**普贤菩萨摩诃萨**，余十九位为「普字起首」及别具名号者。今取其名相结构，分类说明：\n\n**（甲）普字冠首者。** 普贤、普德最胜灯光照、普光师子幢、普宝燄妙光、普音功德海幢、普智光照如来境、普宝髻华幢、普觉悦意声、普清净无尽福光、普光明相、普智云日幢——共十一位冠「普」。\n\n「普」者，普遍、通达、一切处无非是也。华严以「普」为菩萨名之通行冠字，非尊称，乃**义理标记**：谓此菩萨之德，无所不通、无所不周。**故十一位「普」字菩萨，实是一切法界之十一位不同面向。**\n\n**（乙）具德而名状者。** 海月光大明（以海喻其广大，以月喻其清凉明净）、云音海光无垢藏（云之音、海之光、无垢之藏，三义相联）、大精进金刚脐（「脐」者，身之中央，谓其精进为中坚）、香燄光幢（香与焰，光与幢，二类相配）——皆以具体的感官与身体譬喻成德。\n\n**（丙）功德相联者。** 功德宝髻智生、功德自在王大光、大明德深美音、大福光智生——皆以「功德／福／智」为体，而以「宝髻／自在王／美音／智生」为用。\n\n**普贤为首之义。** 经文以普贤菩萨为上首第一位。**此非列位之偶然。** 普贤（`Samantabhadra`，本经卷三诸品别有「普賢」之梵译，此处从通行音译）为「恒随佛行、遍及法界」之大菩萨，**其愿海（普贤愿海）恒与智俱**（见 2.8「恆以所得普贤愿海」）。华严以后世之智识，皆以普贤为「华严行愿之总代表」；然**此一品中普贤列于会众之首，其义在「总」不在「尊」**——**他是一切所证之法的总和，故先于一切而列。**\n\n海云继梦法师于此处有一判：世主妙严品之会主，法师以为非释迦牟尼之化身，而为**毗卢遮那**（释迦成道后之报身）。**〔存疑〕** 此说与澄观判「第一会会主为毗卢遮那」相近，惟法师更强调其意在「说的是佛的境界量，不是修行量」。此与本项目既有华严经学条目所记方东美、海云二家之解一致，本文据以对读，但**不作为经文义**。\n\n> **EN corresponding · 2.7 The Assembly: Samāntabhadra and Nineteen Others**\n>\n> \"Their names are these: Samāntabhadra Bodhisattva; Prabhā-darśana... \"\n>\n> Huayan does not name people; it names states. Every title in this assembly is a designation of a mode of realization, not an appellation of an individual, and the names are therefore to be read as one reads the verses of a gāthā. Twenty names are listed as \"the foremost\" (上首), and eleven of them carry the prefix 普 — samant(a)-, \"all-pervading, universal.\" The prefix is not honorific. It is a doctrinal marker: this bodhisattva's virtue is unobstructed and pervasive, without exception. The eleven Samantabhadras are thus eleven distinct aspects of the totality of dharma.\n>\n> The remaining titles are constructed differently — a figure of light and water (海月光大明, \"moonlight of the ocean's light, bright\"), a chain of the sensory and the material (云音海光无垢藏, \"cloud-sound, ocean-light, stainless treasury\"), a bodily image (大精进金刚脐, \"great vīrya, vajra-navel,\" i.e., vīrya as the very center), and a set built on merit and wisdom (功德宝髻智生 and its parallels). The point of listing them is not completeness but coordinate variety: the same dharmadhātu is designated in eleven ways by one set of titles, and in a further nine by another.\n>\n> Samāntabhadra heads the list. In later reception he becomes the general representative of the Huayan vows — but here the reason is not precedence in rank. It is that he is the totality: the passage immediately following says that these bodhisattvas \"constantly hold, by the sea of Samāntabhadra's vows, that all beings' bodies of wisdom are complete\" (恒以所得普賢願海令一切眾生智身具足). He is listed first because he is the sum, and a sum precedes its terms.\n\n### 2.8 会众之一：菩萨所证\n\n> **经文**　此诸菩萨往昔皆与毗卢遮那如来共集善根、修菩萨行，皆从如来善根海生，诸波罗蜜悉已圆满。慧眼明彻，等观三世。于诸三昧，具足清净。辩才如海，广大无尽。具佛功德，尊严可敬。知众生根，如应化伏。入法界藏，智无差别。证佛解脱甚深广大，能随方便入于一地，而以一切愿海所持，恒与智俱，尽未来际。了达诸佛稀有广大秘密之境。善知一切佛平等法，已践如来普光明地。入于无量三昧海门，于一切处皆随现身，世法所行悉同其事。总持广大集众法海，辩才善巧转不退轮。一切如来功德大海咸入其身。一切诸佛所在国土皆随愿往。已曾供养一切诸佛，无边际劫欢喜无倦。一切如来得菩提处，常在其中亲近不舍。恒以所得普贤愿海，令一切众生智身具足，成就如是无量功德。\n\n**疏解**　**此段是全品第一处「菩萨的资格」说明。** 经文不说此诸菩萨「有何功德」，而一再说其「曾」「已」「皆悉」，以过去相续之语，写出其境界之不可及。今分四层。\n\n**（一）共集善根。**「往昔皆与**毗卢遮那**如来共集善根、修菩萨行」——**毗卢遮那**（`Vairocana`），意译「遍一切处光明」或「光明遍照」。**此为华严之佛名，非印度传统的毘卢遮那（遮那系之祖）**。经文谓此诸菩萨于往昔与毗卢遮那「共集善根」，**即谓彼等与毗卢遮那同一期中修习**。华严「七处九会」之第一会，以毗卢遮那为会主，其理在此：此诸菩萨之「善根」之根，即毗卢遮那一处。\n\n**「皆从如来善根海生」。**——**「海」字再见**。前以海言量，今以海言本。**菩薩者，从善根海生，非本无而忽有。** 故「菩萨」之义，梵作 `bodhisattva`，意为「觉有情者」；中土释为「菩提心薩埵」，然经文此处强调的不是「立志」，而是「出生」。\n\n**（二）波罗蜜与三昧。**「诸波罗蜜悉已圆满」——波罗蜜（`pāramitā`），度也，行到彼岸。经文作「圆满」，非「具足」；圆满者，无所缺。**华严说六度，不在多而在圆。**\n「于诸三昧，具足清净」——三昧（`samādhi`），正定。经文说「于诸三昧」——**诸**字最要：**不是一种三昧，而是众多三昧皆具足清净。** 华严之禅，不在专一，在遍一切三昧。\n\n**（三）入法界藏。**「入**法界藏**，智无差别」。——**此为菩萨位中的关键一句**。华严的「法界藏」是菩萨所证之宝藏，即以法界为一藏。**「智无差别」**：既入法界藏，则其智于一切法界无有差别。**此句与 2.6「智入诸相了法空寂」相应：佛是了法空寂，菩萨是智无差别。**\n\n**（四）能随方便入于一地。**「能随方便入于一地」——**此句易被误读，须辨。** 旧注家有读为「随方便入于一地（初地）」者，然华严之「地」为十地之位，「入于一地」若作「初地」解，则与下文「而以一切愿海所持」句不顺。**〔存疑〕此处「一地」或谓「一地之中」，或谓「一地（初地）之深」，本文未得澄观《疏》原文可断其确义，姑存两解。**\n**「而以一切愿海所持，恒与智俱，尽未来际」。** ——**「愿海所持」「恒与智俱」是菩萨的定相**：以一切愿海为所持，以智为伴侣，**尽未来际不失。** 「尽未来际」四字是华严常语，谓其行不以时间断。\n\n**（五）了达诸佛稀有广大秘密之境。**「稀有」「广大」「秘密」三语并列，为佛法的三重性：稀有故非常可思，广大故无量，秘密故非言思所及。\n\n**（六）已践如来普光明地。** ——「普光明地」为十地之一，菩萨位之第七。**「已践」二字最可玩味：践者，履而实至之，非徒悬其名。**\n\n**（七）转不退轮。**「总持广大集众法海，辩才善巧转不退轮」。——**「不退轮」**：轮者，法轮。**转轮而不退，故名「不退轮」。** 华严谓菩萨之辩才，能转法轮而无退转；此即「四不坏」之意。\n\n**（八）随愿往。**「一切诸佛所在国土皆随愿往。已曾供养一切诸佛，无边际劫欢喜无倦。」——**「无边际劫欢喜无倦」：供养无尽而心不倦。** 倦者，疲也。**华严写菩萨之供养，以「不倦」为要点**——非不能久供，乃供之而心常欢。\n\n**（九）亲近不舍。**「一切如来得菩提处，常在其中亲近不舍。」——「亲近不舍」四字，与上文「欢喜无倦」相应，**皆言其久而弥笃。**\n\n**（十）普贤愿海。**「恒以所得普贤愿海，令一切众生智身具足，成就如是无量功德。」——**此句是本段之结，亦是接次段之键。** 普贤之愿，恒以之普遍给予众生，**令众生「智身具足」**。**「智身」者，智慧为身，以智慧为体而成身。** 华严言「身」有二义：一为色身，一为智身；此处的「身」是后者。**故华严之给予，不是给法，是令其智身具足。**\n\n**名相**\n\n- **毗卢遮那**：`Vairocana`。「毗卢」为音译（`vi`＋`rocana`），「遮那」亦音译。意译诸家作「光明遍照」「遍一切处」。**须辨**：与《吽》类经典中「毗卢遮那」之别。此处为华严之佛。\n- **波罗蜜**：`pāramitā`，音译「波罗蜜」「波羅密」，义曰「到彼岸」。六波罗蜜即六度。\n- **三昧**：`samādhi`，音译「三昧」，义曰「正定」「等持」。\n- **秘密**：`guhya`，亦译「秘藏」。华严用「秘密」为佛法之深密处，非今日之「隐秘」义。\n\n> **EN corresponding · 2.8 What These Bodhisattvas Have Realized**\n>\n> \"These bodhisattvas in times past all gathered roots of goodness together with Vairocana Tathāgata and cultivated the bodhisattva-path; all were born from the sea of the Tathāgata's roots of goodness, and all the pāramitās were completely fulfilled. The eye of wisdom shines through, viewing the three times in perfect equality. In all the samādhis they are wholly and purely possessed. Eloquence is like the sea, vast and endless. They possess the Buddha's virtues, august and venerable. Knowing the roots of beings, they tame them as appropriate. Having entered the treasury of the dharmadhātu, their knowledge knows no distinction. They have realized the Buddha's deliverance, profound and vast, and can enter the first bhūmi by expedient means; yet held by the sea of all vows, they are forever with wisdom, unto the end of time.\"\n>\n> The paragraph is written almost entirely in perfect tenses — 往昔, 皆, 已, 悉, 常, 尽未来际 — and this is not incidental. Huayan describes the bodhisattva by what has been fully accomplished rather than by what is being attempted. Three formulations deserve notice. \"Born from the sea of roots of goodness\" (皆從如來善根海生) makes bodhisattva-hood a matter of provenance, not of aspiration. \"In all the samādhis they are wholly and purely possessed\" (於諸三昧具足清淨) — the word is \"all\": Huayan meditation is not concentration on one object but purity in every samādhi. And \"having entered the treasury of the dharmadhātu, their knowledge knows no distinction\" (入法界藏智無差別) states the substance of the bodhisattva stage: having entered dharmadhātu as a treasury, knowledge no longer differentiates. This is the counterpart of the Buddha's \"his knowledge enters every mark and understands emptiness\" (智入諸相了法空寂): the Buddha apprehends emptiness, the bodhisattva's knowledge loses all distinction.\n>\n> The last clause is the hinge back to the assembly. \"Constantly, by the sea of Samāntabhadra's vows which they have attained, they make all beings' bodies of wisdom complete\" (恒以所得普賢願海令一切眾生智身具足) — what is given is not teaching but a body: 智身. To see that \"body\" is wisdom rather than flesh is to hold the key to the rest of the chapter.\n\n### 2.9 会众之二：器世间（杂类诸神众十九组）\n\n> **经文**　复有佛世界微尘数执金刚神：妙色那罗延执金刚神、日轮速疾幢执金刚神、须弥华光执金刚神、清净云音执金刚神、诸根美妙执金刚神、可爱乐光明执金刚神、大树雷音执金刚神、师子王光明执金刚神、密燄胜目执金刚神、莲华光摩尼髻执金刚神。如是等而为上首，有佛世界微尘数。皆于往昔无量劫中恒发大愿，愿常亲近供养诸佛，随愿所行已得圆满，到于彼岸，积集无边清净福业，于诸三昧所行之境悉已明达，获神通力随如来住，入不思议解脱境界。处于众会威光特达，随诸众生所应现身，而示调伏。一切诸佛化形所在，皆随化往。一切如来所住之处，常勤守护。\n\n〔以下十九组，各组名号与功德，具见附录二；其类义与象征今为总说。〕\n\n**疏解**　**此段起，经文转入「异生众」。** 华严列众之序，至此一大变：前所列皆「智正觉世间」（菩萨，为修行之主体），以下所列皆「器世间」「眷属世间」（为所化之机与所依之境）。**然经文于每一组之后，必附一语，说明此众「皆于往昔……」或「其数无量……」。**\n\n**此一处，须细看。** 试举数例：\n\n- 主火神组：「皆能示现种种光明，令诸众生热恼除灭。」\n- 主风神组：「皆勤散灭我慢之心。」\n- 主夜神组：「皆勤修习以法为乐。」\n- 主昼神组：「皆于妙法能生信解，恒共精勤严饰宫殿。」\n- 主山神组：「皆于诸法得清净眼。」\n- 主林神组：「皆有无量可爱光明。」\n- 主药神组：「性皆离垢，仁慈祐物。」\n- 主稼神组：「莫不皆得大喜成就。」\n- 主河神组：「皆勤作意利益众生。」\n- 主海神组：「悉以如来功德大海充满其身。」\n- 主水神组：「常勤救护一切众生而为利益。」\n\n**此即澄观所谓「因世间以显佛德」之实义。** 火神能除热恼，是佛「光明」之用；风神能散我慢，是佛「自在」之用；主海神身充满如来功德大海，是佛「大悲」之用。**故此十九组之众，各以一行「功德语」结束，而此功德语一一对应于佛德之某一门。** 华严写神众而不写神怪，正因为此。\n\n**命名的统一结构。** 十九组之名号，结构完全一致：**〔二字修饰〕＋〔一字中心词〕**。中心词即其职司（执金刚＝手捧金刚杵、身众神＝其身众、足行神＝其足行、道场神＝护道场、主城神＝城主、主地神＝主地、主山神＝主山……）；二字修饰则写其性德与功能。故**读华严神名之法：先取中心词得其职，次取修饰字见其德。**\n\n**代表名号训释（择四则）**\n\n**（甲）执金刚神。**「执」者，持也；「金刚」者，`vajra`，即金刚杵，亦为「不动」义。**此众之持金刚，非执武器，实执「摧伏」与「坚固」二义**；而「金刚」之名，与菩萨之「师子幢」「日轮速疾幢」中之「幢」，同属标示威德之器象。华严神众之名多取器象，非取形貌。\n\n**（乙）主城神。**「宝峰光耀主城神」等十名。**城者，世间聚居之所。** 此众之职在「严净如来所居宫殿」——**即世间之城为佛境之映现。** 华严于「城」用「严净」二字，谓世间之城市为佛土之映影。此义与 2.4「一切众生居处屋宅，皆于此中现其影像」互为表里。\n\n**（丙）主药神。**「栴檀林主药神」「益气明目主药神」等。**药神之名，取其能医。** 经文结其德曰「性皆离垢，仁慈祐物」——**「离垢」与「祐物」二者：药之所能为者，去垢而已。** 华严写药神而不写药师（药师是佛之名，此处是神），**凡有所能者，必现其能**。\n\n**（丁）主火神。**「普光燄藏主火神」「光明破暗主火神」等。**火之性有三：能照（光）、能热（燄）、能净（破暗）。** 经文结其德曰「皆能示现种种光明，令诸众生热恼除灭」——**「热恼」二字最当**：火之用在净，不在焚。**华严取自然中之「用」而弃其「害」，此即其神众论的通例。**\n\n〔袖珍版编者按〕**（以上介绍异生众中的 19 个杂类诸神众：执金刚神、身众神、足行神、道场神、主城神、主地神、主山神、主林神、主药神、主稼神、主河神、主海神、主水神、主火神、主风神、主空神、主方神、主夜神、主昼神，一共 190 位神众，表器世间，即是化处。）**\n\n> **EN corresponding · 2.9 The Assembly: the Nineteen Classes of Divine Attendants**\n>\n> From here the assembly changes character. What follows is not the community of bodhisattvas (the \"world of wisdom and enlightenment,\" the agents of practice) but the divine retinue and the worlds they inhabit — the \"world of vessels\" and the \"world of retinue,\" the ground of practice and those to be converted. The shift matters, and so does the treatment: of each of the nineteen classes the text appends a single line stating what the class does. The fire-deities \"manifest all manner of lights and cause the heat of affliction to be extinguished in all beings\" (皆能示現種種光明令諸眾生熱惱除滅). The wind-deities \"diligently scatter and extinguish the mind of pride\" (皆勤散滅我慢之心). The night-deities \"diligently cultivate taking the dharma as their joy\" (皆勤修習以法為樂). The day-deities \"in the wondrous dharma are able to give birth to faith and understanding\" (皆於妙法能生信解). The sea-deities \"fill their bodies entirely with the sea of the Tathāgata's virtues\" (悉以如來功德大海充滿其身).\n>\n> Read consecutively, these closing clauses are not decoration. Each names a capacity — removing heat, dispersing pride, opening eyes to all dharmas, filling the body with the Tathāgata's virtues — and each capacity corresponds to a door of the Buddha's virtue. This is what it means for the chapter to be called the Adornment of the World-Lord: the World's Lords do not praise the Buddha; they *are* the Buddha's virtues, itemized. Avatamsaka does not write demons here. It writes function.\n>\n> The naming is also perfectly systematic, and reading it is a method: every title is a two-character qualifier attached to a one-character function-word — 执金刚 (those who hold the vajra), 足行神 (those of the feet's movement), 主城神 (lords of the city), 主药神 (lords of medicine), and so on. Take the function-word first to learn the office; take the qualifier second to learn the virtue. Four examples. *Those who hold the vajra*: the vajra is not a weapon but the emblem of subduing and of indestructibility, and it is the same emblem that appears in a bodhisattva's title as 师子幢. *Lords of the city*: their merit is to purify and adorn the palaces where Buddhas dwell — the world's cities as reflections of Buddha-lands, the counterpart of \"the dwellings of all sentient beings appear within it as reflected images.\" *Lords of medicine*: \"their nature is entirely free of filth, and they assist beings with kindness\" (性皆離垢仁慈祐物) — a medicine's work is to remove what soils. *Lords of fire*: fire illuminates, heats, and purifies; the text takes only the third and gives us \"all heat of affliction extinguished.\" Huayan everywhere takes from nature its usefulness and discards its harm.\n\n### 2.10 会众之三：眷属世间（八部四王众）\n\n> **经文**　复有无量阿修罗王：罗睺阿修罗王、毗摩质多罗阿修罗王、巧幻术阿修罗王、大眷属阿修罗王、大力阿修罗王、遍照阿修罗王、坚固行妙庄严阿修罗王、广大因慧阿修罗王、出现胜德阿修罗王、妙好音声阿修罗王。如是等而为上首，其数无量。悉已精勤摧伏我慢及诸烦恼。\n>\n> 复有不可思议数迦楼罗王……悉已成就大方便力，普能救摄一切众生。\n>\n> 复有无量紧那罗王……皆勤精进观一切法，心恒快乐自在游戏。\n>\n> 复有无量摩睺罗伽王……皆勤修习广大方便，令诸众生永割痴网。\n>\n> 复有无量夜叉王……皆勤守护一切众生。\n>\n> 复有无量诸大龙王……莫不勤力兴云布雨，令诸众生热恼消灭。\n>\n> 复有无量鸠槃荼王……皆勤修学无碍法门，放大光明。\n>\n> 复有无量乾闼婆王……皆于大法深生信解，欢喜爱重勤修不倦。\n\n〔袖珍版编者按〕**（以上介绍异生众中的 8 个八部四王众：阿修罗王、迦楼罗王、紧那罗王、摩睺罗伽王、夜叉王、诸大龙王、鸠槃茶王、乾闼婆王，一共 80 位王众，表眷属世间，即所化机。）**\n\n**疏解**　**此八部四王，为佛之眷属，即所依以度生者。华严用此八类，犹《法华》之列八部；而其用有别：《法华》所列八部，以「常随」为义；《华严》所列八部，以「各证一法门」为义。**\n\n**逐组读其「一行功德」，可见华严之用心。**\n\n**（甲）阿修罗王。**「悉已精勤摧伏我慢及诸烦恼」。**此众居四洲之下，为「我慢」之住处，故经云其能摧伏我慢。** 华严写阿修罗不写「欲」而写「慢」——**盖阿修罗之病在慢，不在欲。** 彼能摧己之慢，故显其德。\n\n**（乙）迦楼罗王。**「悉已成就大方便力，普能救摄一切众生」。**迦楼罗（`garuda`）为鸟中之王，振翼大风吹散云雨；华严取其「力大」与「能救」二义。**\n\n**（丙）紧那罗王。**「皆勤精进观一切法，心恒快乐自在游戏」。**紧那罗（`kiṇṇara`）为半人半神，华严取其「天乐」义**，故结其德曰「心恒快乐自在游戏」——**此众的德是「于观法之中恒自游戏」。** **「自在游戏」四字是华严所重的境界语，不作嬉戏解。**\n\n**（丁）摩睺罗伽王。**「皆勤修习广大方便，令诸众生永割痴网」。**摩睺罗伽（`makara`，旧译「摩羯」，蟒类）** 蟒之性，在「缠」。华严取其「能断」之反面义——**缠者，本为缚；此众能「割痴网」，即以其能缚而能解。**\n\n**（戊）夜叉王。**「皆勤守护一切众生」。**夜叉（`yakṣa`）旧译「捷疾鬼」。夜叉之众，护法而多暴。** 华严用之，止取其「守护」一义，而略其余。**首名「毘沙门夜叉王」——毘沙门（`Vaiśravaṇa`）为北方多闻天王**〔按：此系后世密教之配摄，非本经所言，读者勿混〕。\n\n**（己）诸大龙王。**「莫不勤力兴云布雨，令诸众生热恼消灭」。**龙王之职在「兴云布雨」；华严取其「消热」之功。** 此与 2.9 主火神「热恼除灭」同义，然一在火、一在龙，**同归「除热」一义**。**华严之例，可见其义不择类而择用。**\n\n**（庚）鸠槃荼王。**「皆勤修学无碍法门，放大光明」。**鸠槃荼（`kumbhāṇḍa`）旧译「瓮形鬼」「食香鬼」。** 此组名号（增长、龙主、善庄严幢、普饶益行、甚可怖畏、美目端严、高峰慧、勇健臂、无边净华眼、广大天面阿修罗眼）与「甚可怖畏」之名相表里：鸠槃荼本属怖畏之形，而经文结以「修学无碍法门，放大光明」——**怖畏之相，转成光明之用**；「无边净华眼」之名，正与此光明相应。\n\n**（辛）乾闼婆王。**「皆于大法深生信解，欢喜爱重勤修不倦」。**乾闼婆（`gandharva`）旧译「香神」，为歌神。** 华严取其「信解」「勤修」，而略其「歌」之乐。**然 2.4「妙香华缨周匝垂布」、2.5「妙音遐畅无处不及」之香与音，乾闼婆之业正在其中**〔此为其义之旁证，非经文明言〕。\n\n> **EN corresponding · 2.10 The Assembly: the Eight Legions of Four Kings**\n>\n> Eight classes follow, corresponding to the eightfold divine retinue familiar from the Lotus: asuras, garudas, kiṇṇaras, makaras, yakṣas, nāgas, kumbhāṇḍas, gandharvas. Avataṃsaka, however, uses them differently from the Lotus. The Lotus lists the eight legions as those who constantly attend; the Avataṃsaka lists them as those each of whom has realized one specific dharma-door. Again, each class is given a single closing line, and the lines are the point.\n>\n> The asuras \"have diligently destroyed pride and all other defilements\" (悉已精勤摧伏我慢及諸煩惱). Huayan does not say the asuras are lustful; it says they are *proud*, and that they have overcome their own pride — the malady is named so it can be cured. The garudas \"have attained great expedient power and universally rescue and gather in all beings\" (普能救攝一切眾生), taking the eagle's strength as rescue. The kiṇṇaras \"diligently apply themselves to contemplating all dharmas, their minds ever joyful, at play in freedom\" (心恒快樂自在遊戲) — \"playing at will\" (自在遊戲) is a technical term in Huayan, not a reference to frivolity. The makaras, serpent-kind, whose nature is to constrict, \"diligently cultivate great expedients so that all beings forever cut the net of delusion\" (令諸眾生永割癡網): the very capacity to bind is turned into the capacity to unbind. The yakṣas \"diligently guard all beings\" (皆勤守護一切眾生) — Huayan keeps the office and drops the ferocity. The nāgas \"labor to raise clouds and send rain, causing the heat of affliction to cease\" (令諸眾生熱惱消滅) — note that the dragons and the fire-deities of §2.9 discharge the identical function, which shows that Huayan selects by function rather than by category. The kumbhāṇḍas \"diligently study the dharma-door of non-obstruction and emit great light\" (勤修學無礙法門放大光明), and several of their names turn on 無礙. The gandharvas \"in the great dharma deeply awaken faith and understanding, rejoicing in it and practicing untiringly\" (歡喜愛重勤修不倦).\n>\n> Their eighty titles are tabulated in Appendix 2.\n\n### 2.11 会众之三：眷属世间（欲界天七众）\n\n> **经文**　复有无量月天子……皆勤显发众生心宝。\n>\n> 复有无量日天子……皆勤修习利益众生增其善根。\n>\n> 复有无量三十三天王……皆勤发起一切世间广大之业。\n>\n> 复有无量须夜摩天王……皆勤修习广大善根，心常喜足。\n>\n> 复有不可思议数兜率陀天王……皆勤念持一切诸佛所有名号。\n>\n> 复有无量化乐天王……皆勤调伏一切众生，令得解脱。\n>\n> 复有无数他化自在天王……皆勤修习自在方便广大法门。\n\n〔袖珍版编者按〕**（以上介绍异生众中的欲界天 7 众：月天子、日天子、三十三天王、须夜摩天王、兜率陀天王、化乐天王、他化自在天王，一共 71 位王众，表眷属世间，即所化机。）**\n\n**疏解**　**欲界七众之序，与世間之序同。** 月、日为最小；次三十三天（忉利）；次须夜摩；次兜率陀；次化乐（乐变化）；此上为他化自在，即欲界之顶。**故此七众之列，实是一幅「欲界次第图」。**\n\n**而七组之「一行功德」，亦依次递变，可与其次第合观。**\n\n**（甲）月天子：「皆勤显发众生心宝。」** ——**月者，夜间现于空，而以「心宝」为所显。** 月之义在「清凉」；华严取其「显发心宝」——**「心宝」者，众生本具之善心。** 月虽非日，无能照明，而能显月中之影；故此众之德，是「使未显者显」。\n\n**（乙）日天子：「皆勤修习利益众生增其善根。」** ——**日者，昼间现于空，而以「善根」为所增。** 月显心宝，日增善根；一显一增，一隐一明。**华严写天，非写其福报之厚薄，而写其「作用」之大小。**\n\n**（丙）三十三天王：「皆勤发起一切世间广大之业。」** ——三十三天者，帝释所居。**此众之德在「发起广大之业」——不在守而在发。**\n\n**（丁）须夜摩天王：「皆勤修习广大善根，心常喜足。」** ——**「喜足」二字最奇。** 须夜摩天（`Suyāma`，旧译「夜摩」，亦名「善分天」）福报胜前，然其德曰「心常喜足」。**华严写此天，特写其「喜足」；福报愈厚者愈须学此——此「取用不取位」之法，与主稼神取「见者爱乐」之名、主药神取「仁慈祐物」之德，同科。**\n\n**（戊）兜率陀天王：「皆勤念持一切诸佛所有名号。」** ——**兜率陀（`Tuṣita`，译「知足天」「喜足天」）即此。** 其德为「念持诸佛名号」。**华严写兜率陀而不写「内院」「欲界天之中」之特殊地位，唯取其「念佛名」之实修。** 〔按：后世将此天与弥勒联系起来，见《法华经》，非本经此段所言。〕\n\n**（己）化乐天王：「皆勤调伏一切众生令得解脱。」** ——**「调伏……令得解脱」八字，於此众为重。** 化乐天王居欲界之上，其德为「调伏众生」，故其位愈高，愈当自约。\n\n**（庚）他化自在天王：「皆勤修习自在方便广大法门。」** ——**「自在」二字复见。** 他化自在天者，一切自在。此众之德为「修习自在方便广大法门」——**其名已曰自在，其行曰修习自在。** 华严之「自在」从来不是现成之福，而是所修之法。\n\n> **EN corresponding · 2.11 The Assembly: the Seven Heavens of the Desire Realm**\n>\n> The seven groups follow the order of the desire realm: moon, sun, the Trāyastriṃśa gods of the Thirty-Three, the Suyāma gods, Tuṣita, Nirmāṇarati, and Paranirmitavaśavartin. The order is thus a diagram of the realm, and the single closing line of each group tracks that order. The moon-deities \"diligently manifest the beings' treasure of mind\" (勤顯發眾生心寶); the sun-deities \"diligently cultivate the benefit of beings and increase their roots of goodness\" (利益眾生增其善根) — the moon reveals what is hidden, the sun adds to what exists. The Thirty-Three \"diligently initiate all great works in the world\" (發起一切世間廣大之業). The Niyōna \"diligently cultivate broad roots of goodness, their minds ever content\" (心常喜足) — contentedness is assigned precisely to the heaven of greater abundance, and the assignment is the teaching: the more abundant the provision, the more necessary is contentment. The Tuṣita \"diligently recite and hold the names of all the Buddhas\" (勤念持一切諸佛所有名號) — of Tuṣita the text keeps nothing but the practice of holding Buddha-names. The Nirmāṇarati \"diligently tame all beings so that they gain liberation\" (調伏一切眾生令得解脫): the higher the station, the stricter the self-binding. The Paratimitmā \"diligently cultivate the broad dharma-door of self-sovereign expedients\" (修習自在方便廣大法門) — its name already says \"self-sovereign,\" and its practice is precisely the cultivation of self-sovereignty. In Huayan, 自在 is never a ready-made blessing; it is always something being practiced.\n>\n> (The two figures listed here without immediate titles, the moon and sun, are counted as eleven each; see §1.3 for the arithmetic of the 412.)\n\n### 2.12 会众之三：眷属世间（色界天五众）\n\n> **经文**　复有不可数大梵天王……皆具大慈怜愍众生，舒光普照令其快乐。\n>\n> 复有无量光音天王……皆住广大寂静喜乐无碍法门。\n>\n> 复有无量遍净天王……悉已安住广大法门，于诸世间勤作利益。\n>\n> 复有无量广果天王……莫不皆以寂静之法而为宫殿，安住其中。\n>\n> 复有无数大自在天王……皆勤观察无相之法，所行平等。\n\n〔袖珍版编者按〕**（以上介绍异生众中的色界天 5 众：大梵天王、光音天王、遍净天王、广果天王、大自在天王，一共 51 位王众，表眷属世间，即所化机。）**\n\n**疏解**　**色界五众，去欲界七阶而升，其德亦随之而变。可与其「禅定之深浅」并观。**\n\n**（甲）大梵天王：「皆具大慈怜愍众生，舒光普照令其快乐。」** ——**大梵者，四天之上、色界之初。** 其德曰「大慈怜愍」，曰「普照令其快乐」。**此是以「慈」为体、以「光」为用。**\n\n**（乙）光音天王：「皆住广大寂静喜乐无碍法门。」** ——**「寂静喜乐」四字为色界二禅之境（光音天即二禅三天之一）。** 经云「广大寂静喜乐无碍法门」，四义并举：广大、寂静、喜乐、无碍。**华严写色界，已在写禅那；写禅那而仍言「喜乐」，故此非枯寂之定。**\n\n**（丙）遍净天王：「悉已安住广大法门，于诸世间勤作利益。」** ——遍净（`Śubhakṛtsna`，亦译「遍福」，属三禅三天）者，三禅之境。**「安住」与「勤作利益」并：住而能行。**\n\n**（丁）广果天王：「莫不皆以寂静之法而为宫殿，安住其中。」** ——**此句奇在「以寂静之法而为宫殿」。** 以法为宫室，安住其中——**广果天之宫，非宝所成，乃法所成。** 〔待核：此与澄观《疏》「以寂静法为宫殿」之解是否相合，未核原文。〕\n\n**（戊）大自在天王：「皆勤观察无相之法，所行平等。」** ——大自在（`Maheśvara`，即湿婆）本为印度教大神，入佛典后为华严所收。此众之德曰「观察无相之法」。**「所行平等」三字尤当：所行平等，则所观亦平等。** **华严于大自在天王处，特写「平等」，与其名之「自在」相较：一则自在，一则平等。**\n\n**代表名号训释（此众择一）**\n\n**妙燄海大自在天王**——此名见于 2.12 之末，卷二以下复有其「得法界虚空界寂静如来往昔之时解脱门」（详见卷第二）。**「妙燄海」者，光焰如海。** 华严以大自在为极尊，其名犹带光明之相，与所证之「法界虚空界寂静」正相称。〔本条名相之梵拼〔待核〕。〕\n\n〔袖珍版编者按〕**（20 个同生众：十普菩萨、十异名菩萨，表智正觉世间；39 个异生众：19 个杂类诸神众，表器世间；20 类世间主：8 部四王众、欲界天 7 众和色界天 5 众，表眷属世间。总共是 412 位。）**\n\n> **EN corresponding · 2.12 The Assembly: the Five Heavens of the Form Realm**\n>\n> Above the seven heavens of the desire realm stand five of the form realm, and their virtues shift accordingly. The Brahmā deities \"all possess great compassion, pitying sentient beings, spreading light to shine universally and make them happy.\" The Ābhāsvara deities \"all abide in the broad dharma-door of great stillness, joy, and non-obstruction\" (廣大寂靜喜樂無礙法門) — note that the meditation of the form realm is described as \"joyful\": Huayan does not write of blankness. The Vyūha deities \"have all entered the broad dharma-door and diligently work for the benefit of the worlds.\" The广果 deities \"all take the dharma of stillness itself as their palace and abide therein\" (莫不皆以寂靜之法而為宮殿安住其中) — their dwelling is not built of jewels but made of dharma, and the text says so in a single line. And the Maheśvara deities \"diligently observe the dharmas that are without marks, and all their actions are equal\" (勤觀察無相之法所行平等).\n>\n> That last is worth pausing on. Their name is 自在 — self-sovereign — and their practice is 平等 — equality. Huayan juxtaposes the two. Sovereignty without equality is the divine tyrant; equality without sovereignty is the democratic clerk. The chapter places them side by side and lets the juxtaposition carry the judgment.\n>\n> The sleeve edition's editorial note closes the roster with a summary that deserves to be read as a table of contents for the whole chapter: twenty bodhisattvas for the \"world of wisdom and enlightenment,\" 190 divine attendants for the \"world of vessels,\" 402 kings for the \"world of retinue\" — 412 in all. (The 412 figure is verified arithmetically in §1.3. The three-world division is Chongguan's; see §2.13.)\n\n### 2.13 卷第一小结：三世间架构\n\n**疏解**　卷一至此毕。综观全卷，其结构可归纳为三层，且此三层架构贯穿八十华严全经，卷二至卷五只是在此架构中逐众展开：\n\n| 架构 | 卷一所示 | 名称之义 |\n|---|---|---|\n| **智正觉世间** | 20 位上首菩萨 | 修行之主体 |\n| **器世间** | 19 类杂类神众，190 位 | 依以修持之世界 |\n| **眷属世间** | 8 部四王（80）＋欲界天 7 众（71）＋色界天 5 众（51） | 所化之机 |\n\n**此三层架构，出自澄观《大方广佛华严经疏》之判。** 〔本节据本项目既有华严经学条目所引澄观之说，未核《疏》原文，标〔待核〕〕其大意为：世主妙严品之所以名「世主妙严」，非因佛自陈其德，而因**世间诸主各以所证之境显佛之德**；故佛之庄严，实由众会之庄严而显。\n\n**由此可窥华严之一法门，即「他方显自」。** 佛不自言其广，而以十佛世界微尘数菩萨之广、佛世界微尘数神众之广、菩萨海之广来显；故卷一通篇无一语自夸于佛，而句句见其广大。**此即「于不自中」之妙，亦是华严「理事无碍」在文体上的落实。**\n\n**海云继梦法师于此有一读，可与澄观之判参看。** 法师谓世主妙严品之会主为毗卢遮那（报身），而**经中所说者是佛的「境界量」，不是「修行量」**——**不是佛如何修行，而是佛证悟后所见的真实世界。** **故此品是「果法门」的开端，以佛的果德为修行的起点与归趣。** 此说与澄观判为「所信因果·信位」，言异而义通：**皆谓此品不教人如何修，而先令人见其所信者为何。**\n\n> **EN corresponding · 2.13 The Three-World Structure of Chapter One**\n>\n> Chapter One is complete, and its architecture can be stated in three lines. The \"world of wisdom and enlightenment\" (智正覺世間) is the twenty bodhisattvas — the agents of practice. The \"world of vessels\" (器世間) is the nineteen classes of divine attendants, 190 in number — the world in which practice is performed. The \"world of retinue\" (眷屬世間) is the eight legions of four kings (80), the seven desire-realm heavens (71), and the five form-realm heavens (51) — those to be converted.\n>\n> This tripartite division is Chongguan's, and it explains the chapter's title. The Adornment of the World-Lord is adorned not by the Buddha's own account of himself but by the realizations of the beings who surround him: the Buddha's vastness is disclosed by the vastness of the assembly. Nowhere in this chapter does the Buddha magnify himself, and yet not one line is small. This is what the Huayan commentators call \"disclosing the self through the other\" (他方顯自) — and it is 理事無礙 realized in literary form rather than in doctrine alone.\n>\n> Haiyun's reading is compatible though differently phrased. He takes the presiding Buddha of this chapter to be Vairocana, the reward-body, and remarks that what the chapter describes is the Buddha's 境界量, the measure of his state, and not a 修行量, a record of how he trained. The chapter therefore opens the \"gate of the fruits\" (果法門): it offers the fruits of Buddhahood as both the starting point and the goal of practice. Chongguan calls this the \"trust\" (信) stage of the \"object of faith and its causes\" (所信因果); Haiyun calls it the beginning of the fruit-gate. The wording differs, the point agrees: this chapter does not tell you how to practice. It first shows you what you are to trust.\n\n---\n\n## 三、卷第二　世主妙严品第一之二（大自在天王众讫月天子）\n\n> 卷二承接卷一：卷一列众名，卷二至卷五则入各众之「解脱门」与颂言。全品之结构，至此可见其规律——**先名后行，名起于卷一，行布于卷二至卷五。** 本卷起于一段总叙，述会众来源与根机；后历十二组，自色界大自在天王讫欲界月天子。所列十二组皆各得解脱门、各说颂言，颂言各随其众，合观即为一卷独立的颂赞形式。\n\n### 3.1 领起总叙（卷二起首）\n\n> **经文**　尔时如来道场众海悉已云集，无边品类周匝遍满，形色部从各各差别，随所来方亲近世尊，一心瞻仰。此诸众会，已离一切烦恼心垢及其余习，摧重障山见佛无碍。如是皆以毘卢遮那如来往昔之时，于劫海中修菩萨行，以四摄事而曾摄受。一一佛所种善根时，皆已善摄种种方便，教化成熟。令其安立一切智道，种无量善，获众大福，悉已入于方便愿海，所行之行，具足清净。于出离道，已能善出。常见于佛，分明照了。以胜解力入于如来功德大海，得于诸佛解脱之门，游戏神通。\n\n**疏解**　卷一之末，列众之名；卷二之始，说众之来。此段为卷二至卷五的总纲，亦是「众海云集」的正面说明，逐句如下：\n\n**（1）「尔时如来道场众海悉已云集，无边品类周匝遍满。」** ——「道场众海」四字，是华严「众海」一词的第一次正面出现。**「海」字在卷一用于严饰（色相海），于此用于会众**；会众非徒众多，乃如海之深广、如海之相涵，此为华严滨海之量词。\n\n**（2）「形色部从各各差别，随所来方亲近世尊，一心瞻仰。」** ——形有队伍、色有部属，各各差别而不失其位：**差别是所见，亲近是一心**。故「随所来方」四字明其来处，非杂乱而来，各从其所来方整集。「一心瞻仰」明其情状：非徒集而不观，乃一心瞻仰佛德。\n\n**（3）「此诸众会，已离一切烦恼心垢及其余习，摧重障山见佛无碍。」** ——「烦恼心垢」为现行烦恼，「余习」为习气种子。既离现行，又除余习，则其见佛**无碍**——「无碍」二字，始见于此句，而为全经眼目。**「摧重障山」：障之重者如山，而众会能摧之。** 华严写众会，不说「善根深厚」，而说「已离已摧」，即其所谓为「菩提之机」。\n\n**（4）「如是皆以毘卢遮那如来往昔之时，于劫海中修菩萨行，以四摄事而曾摄受。」** ——**此句为全卷最要紧的一句。** 会众之所以能来此厂海者，非以其自得，而由于其曾为毘卢遮那过去世以「四摄事」摄受。「四摄事」者，布施摄、爱语摄、利行摄、同事摄（`catvāri saṃgrahavastūni`）。**华严说众生与佛之关系，不在「亲疏」，而在「曾摄受」**：凡能亲近佛者，皆在往昔已为佛所摄。**「募顺倒」中来此。**\n\n**（5）「一一佛所种善根时，皆已善摄种种方便，教化成熟。」** ——于一一佛前种善根、受马桶，皆非徒然，「教化成熟」四字：**种者是因，熟者是果，而中间皆以「方便」为体。**\n\n**（6）「令其安立一切智道，种无量善，获众大福，悉已入于方便愿海，所行之行，具足清净。」** ——「一切智道」为佛智之道，安立于其上；「方便愿海」为菩萨之方便与愿力如海。**「所行之行具足清净」首句渐次收紧：由离障、摄受、种善、安立、入海，到所行清净——此佛对众生摄化的次第。**\n\n**（7）「于出离道，已能善出。」** ——「出离道」者，出轮回解脱之道。**「已能善出」：能出，是自度；善出，是度他而得法。** 华严不用「已出」，而用「已能善出」——能而未竟，善而无穷。\n\n**（8）「常见于佛，分明照了。」** ——与上文「一心瞻仰」相应而进一层：瞻仰是见其相，照了是悟其理。**「分明」二字，明其无碍之实。**\n\n**（9）「以胜解力入于如来功德大海，得于诸佛解脱之门，游戏神通。」** ——「胜解力」（`adhimukti`，信解、清净信解）为入门之钥；「入如来功德大海」为入佛之体；「得诸佛解脱之门」为得佛之门径；「游戏神通」（`vikrīḍita`）为用佛之作用。**末三字「游戏神通」最奇：神通而曰游戏，即无所住而生其心之义——出而不出，入而不滞。【本文判断】华严以「游戏」状神通，本于《维摩经》「游戏神通」之语，学者谓其义为「自在无碍」而为「随缘妙用」。**\n\n**（10）此处原文以「众海云集」，故旧注有谓二卷以下皆此众海之「归摄」者，即此处「头两句是总标，末数句是结归」。本文按经文顺序细读：总叙之后，历历各众承受，如流注入海，故二卷以下之十二组，实为「道场众海」的展开。**\n\n> **EN corresponding · 3.1 The Assembling of the Ocean-Multitude**\n>\n> \"At that time the ocean-multitude of the Tathāgata's bodhimaṇḍa had already gathered in clouds — categories without bound ranged everywhere; bodied forms and retinues each different; each, in its coming direction, drew near the World-Honored One and with one mind looked up in reverence. These assemblies had already parted from all afflictions, their mind's stains, and their remaining habits; they had overthrown mountains of heavy obstacles and could see the Buddha without obstruction. All this because Vairocana Tathāgata, in past ages, in the ocean of kalpas, cultivating the bodhisattva-path, had taken them under his care by means of the four means of gathering.\"\n>\n> The paragraph is the hinge between the naming of the assembly (Book One) and its unfolding (Books Two to Five). And it states, in four strokes, the Hua-yan doctrine of the assembly's provenance: the ocean-multitude is not numerous merely, it is *sea-like* (the word 海, \"sea,\" first used of the adornments in 2.2, is now used of the assembly); its many types are at once perfectly different and perfectly unified, since they gather \"each from its own quarter\" yet \"with one mind\"; and — decisively — their ability to see the Buddha unobstructed rests not on their own merit but on the fact that Vairocana **once took them under his care** in past kalpas by the four means of gathering (布施愛語利行同事, contribution, loving speech, beneficial conduct, and working together). The relation of beings to the Buddha is here drawn not by nearness or rank but by a prior act of care.\n>\n> Four progressive clauses then trace how that care issued: they planted roots, were taught and ripened, were established upon the path of all-knowledge, entered the sea of vows and expedients, and their conduct became wholly pure. \"Able already to emerge upon the path of emergence\" — note 善出, *well* emerged, as distinct from merely emerged: escape as a perfected art. And the paragraph closes on 遊戲神通, \"playing in superknowledges,\" the free, unattached operation of the Buddhas' powers — a phrase Hua-yan takes from the Vimalakīrti-sūtra and turns into a technical term for manifestation without attachment. (This last point is the editor's judgment, marked accordingly.)\n\n### 3.2 卷二各组次第：一览\n\n**经文自「所谓妙燄海大自在天王……」至卷末「月天子」。今先列其组次，以便逐组细读：**\n\n| 组 | 领众（首名） | 领众所观（尔时……承佛威力/神力·普观……而说颂言） | 偈数 |\n|---|---|---|---|\n| 1 | 妙燄海大自在天王 | 一切自在天众 | 10 偈 |\n| 2 | 可爱乐法光明幢天王 | 一切少广天、无量广天、广果天众 | 10 偈 |\n| 3 | 清净慧名称天王 | 一切少净天、无量净天、遍净天众 | 11 偈 |\n| 4 | 可爱乐光明天王 | 一切少光天、无量光天、极光天众 | 10 偈 |\n| 5 | 尸弃大梵王〔承佛神力〕 | 一切梵身天、梵辅天、梵众天、大梵天众 | 10 偈 |\n| 6 | 自在天王 | 一切自在天众 | 10 偈 |\n| 7 | 善化天王 | 一切善化天众 | 10 偈 |\n| 8 | 知足天王 | 一切知足天众 | 10 偈 |\n| 9 | 时分天王 | 一切时分天众 | 10 偈 |\n| 10 | 释迦因陀罗天王 | 一切三十三天众 | 11 偈 |\n| 11 | 日天子 | 一切日天子众 | 11 偈 |\n| 12 | 月天子 | 一切月宫殿中诸天众会 | 10 偈 |\n\n注：①表中「普观」皆按经文「承佛威力.普观……众而说颂言」原文逐字录出，唯第 5 组尸弃大梵王原文作「承佛**神力**」，为全卷唯一以「神力」字样宣颂之组，故表内特标。②各众之天界层属——**梵身、梵辅、梵众、大梵＝初禅；少光、无量光、极光（光音）＝二禅；少净、无量净、遍净＝三禅；少广、无量广、广果＝四禅**：卷一「色界天五众」大梵、光音、遍净、广果、大自在自低而高，卷二颂赞则自大自在（色界顶）反向而下，讫欲界月天子——**卷一列名自下而上，卷二歌颂自上而下，次序适相倒转**，且卷二编按明记「以上是色界天5众」「以上是欲界天7众」指画分明。③各组实际含何天王名目，详于附录。\n\n### 3.3 组一细读：妙燄海大自在天王\n\n> **经文**　复次妙燄海大自在天王，得法界虚空界寂静方便力解脱门。自在名称光天王，得普观一切法悉自在解脱门。清净功德眼天王，得知一切法不生不灭不来不去无功用行解脱门。……\n\n**疏解**　「妙燄海大自在天王」为卷二首组之首，亦即**卷一「大自在天王」众（色界天五众之末）之首名**——卷一原文「复有无数大自在天王。所谓妙燄海天王.自在名称光天王.清净功德眼天王……」，卷二此组即承其继续，由「列名」入「得门」。**「妙燄海」者，妙光焰如海**；大自在天王者，即卷一色界五众末之「大自在天王」，为色界之顶。\n\n**「得法界虚空界寂静方便力解脱门」，一句而含四名相：**\n- **法界**：`dharmadhātu`，诸法之体；此处谓佛智所住之境。\n- **虚空界**：`ākāśadhātu`，世界虚空之色相。华严以「法界」「虚空界」对举——法界为理，虚空界为事，合言「法界虚空界」则理事并摄。\n- **寂静**：禅定之法义。\n- **方便力**：`upāya-bala`，以方便为用之力。\n\n**故此解脱门之全义：于法界虚空界二者互摄不碍处，得其寂静之相，而复以方便力入出无碍。** 此为「大自在」之正释——自在者，能于理事无碍处游戏也。\n\n**组内余众之名，组内逐一交代其后十颂。今亦选其一：**\n\n> **经文**　清净功德眼天王，得知一切法不生不灭不来不去无功用行解脱门。\n\n**疏解**　「无功用行」（`anābhoga`）为华严修行之谈——行而不用功，用功而不执著。知一切法不生不灭不来不去，其知非由推测，乃由功用俱息处而自然符契。**「无功用行」四字，依八十华严品文核对，全品仅此一见**[核对确认]。\n\n> **EN corresponding · 3.3 Group One: The Maṇi-flame Ocean King of Freedom**\n>\n> The first group of Book Two is headed by 妙燄海大自在天王, the \"King of Great Freedom with an Ocean of Wonderful Flames\" — the very first name of the \"Great Freedom Kings\" (大自在天王), the last of the five form-realm hosts listed in Book One. Its opening liberation-gate — \"the gate of the power of skillful means and stillness of dharmadhātu-ākāśadhātu\" (法界虛空界寂靜方便力解脫門) — packs four terms into one: dharmadhātu (the principle), ākāśadhātu or the space of forms (the event), stillness (samādhi), and the power of upāya. Freedom (*maheśvara*), on this account, is precisely the ability to move in and out between the unobstructed mutual containment of principle and event. A second member of the group, 清淨功德眼, attains \"the gate of effortless practice, knowing all dharmas as neither born nor destroyed, neither coming nor going\" — *anābhoga* (無功用行, \"practice without striving\"). A word-check confirms that the four characters 無功用行 occur but once in the whole chapter — noted here for the reader to hold in mind.\n\n### 3.4 组三细读：清净慧名称天王（领少净、无量净、遍净天众）\n\n> **经文**　复次清净慧名称天王，得了达一切众生解脱道方便解脱门。最胜见天王，得随一切诸天众所乐如光影普示现解脱门。……须弥音天王，得随诸众生永流转生死海解脱门。（编按原文：「三禅遍净天十一王十一解脱门」）\n\n**疏解**　本组领「少净、无量净、遍净」三净天众（第三禅，即遍净天界），已离欲界及二禅以下之染净，故其解脱门皆以「出离」与「随化」为宗。组内共十一王，可分五类：\n\n- **清净慧名称天王**得其「了达一切众生解脱道方便」——知其解脱之道，复能以方便导之。\n- **最胜见天王**得「随一切诸天众所乐如光影普示现」——随众所乐为示现，如光影之不实而能现。\n- **寂静德天王**得「普严净一切佛境界大方便」——以净严佛境为德。\n- **须弥音天王**得「随诸众生永流转生死海」——**「随……流转」而非「度……流转」**：此解脱门之义，在随众生于流转之中而不捨离，正与「以四摄事摄受」相应。\n- **净念眼天王**得「忆念如来调伏众生行」——忆佛之行以为趣向。\n- **可爱乐普照天王**得「普门陀罗尼海所流出」——总持之法自陀罗尼海流出。\n- **世间自在主天王**得「能令众生值佛生信藏」——教化的要点在令众生「值佛生信」。\n- 其余（光燄自在天王、乐思惟法变化天王、变化幢天王、星宿音妙庄严天王）门名见组内原文与附录。\n\n**颂言（本组十一偈，逐偈与上首诸王名目相摄）：**\n\n> **经文**　了知法性无碍者 普现十方无量剎　说佛境界不思议 令众同归解脱海。\n> 如来处世无所依 譬如光影现众国　法性究竟无生起 此胜见王所入门。\n> 无量劫海修方便 普净十方诸国土　法界如如常不动 寂静德天之所悟。\n> 众生愚痴所覆障 盲暗恆居生死中　如来示以清净道 此须弥音之解脱。\n> 诸佛所行无上道 一切众生莫能测　示以种种方便门 净眼谛观能悉了。\n> 如来恆以总持门 譬如剎海微尘数　示教众生遍一切 普照天王此能入。\n> 如来出世甚难值 无量劫海时一遇　能令众生生信解 此自在天之所得。\n> 佛说法性皆无性 甚深广大不思议　普使众生生净信 光燄天王能善了。\n> 三世如来功德满 化众生界不思议　于彼思惟生庆悦 如是乐法能开演。\n> 众生没在烦恼海 愚痴见浊甚可怖　大师哀愍令永离 此化幢王所观境。\n> 如来恆放大光明 一一光中无量佛　各各现化众生事 此妙音天所入门。\n\n**疏解（颂言例解）**　此十一偈为「清净慧名称天王」领众所颂。其文格全品一致：**每颂前二句赞佛，后二句结入一解脱门（以「此X王「之义括之）**——观此颂可知《华严》颂体之法：\n\n- **「普现十方无量刹」** 与「如来处世无所依」：两颂皆以「无碍」与「无所依」为法性之相——佛之普遍，不因有所住而遍。\n- **「众生没在烦恼海」为首数种最警策之一**：颂以「生死海」「烦恼海」为喻，与「清净慧名称」之名相照——此法门之要在「出烦恼海」而又「于海中施化」。\n- **「一一光中无量佛」**：颂末两行点出「放大光明」，与卷一光明之喻相接，且界此明光为「佛身光明」——此一头是全书「光」之枢纽。\n\n**〔存疑〕** 十一颂为一组十一王而颂，除首颂为清净慧名称天王自说外，其余十颂末句各点一位王名（最胜见、寂静德、须弥音、净念眼、可爱乐普照、世间自在主、光燄自在、乐思惟法变化、变化幢、星宿音妙庄严）。今第十一颂「此妙音天所入门」中之「妙音天」，**本文推断即组内未以全名点出之「星宿音妙庄严天王」**（其名中含「音」「妙」二字），系本文推断而非原文明言，〔存疑〕待核。\n\n> **EN corresponding · 3.4 Group Three: The King of Pure Wisdom and Renown over the Third Dhyāna Heavens**\n>\n> This group leads the Pure and Sublime Pure heavens; being beyond the desire realm, its liberation-gates all turn on \"departure.\" The reader will notice immediately the form of the gāthās, which is identical throughout the chapter: two lines of praise to the Buddha, two lines tying the achievement to a named 天's own gate — \"this is what X king entered as a gate\" (此X王所入門). Two examples carry special weight. \"Beings are sunk in the sea of afflictions; dull and blind, they abide in birth-and-death; the Great Teacher in compassion makes them ever depart\" (眾生沒在煩惱海 愚癡見濁甚可怖 大師哀愍令永離 此化幢王所觀境) — the \"sea\" of 生死 here rhymes with the \"sea\" of the opening paragraph, and the very gates that depart from the sea are stated to operate within it: the merit of 隨諸眾生永流轉生死海, \"accompanying beings who ever wander in the sea of birth-and-death,\" is departure that does not abandon. And \"in each light there are immeasurable Buddhas\" (一一光中無量佛) closes the group on light, the master-symbol of the whole chapter.\n\n### 3.5 卷二各组之颂首一览（择其警句）\n\n**递录各「尔时……而说颂言」之首偈（每组第一偈全句，皆据原文逐字）：**\n\n- 妙燄海大自在天王众：「佛身普遍诸大会 充满法界无穷尽 寂灭无性不可取 为救世间而出现」\n- 可爱乐法光明幢天王众：「诸佛境界不思议 一切众生莫能测 普令其心生信解 广大意乐无穷尽」\n- 清净慧名称天王众：「了知法性无碍者 普现十方无量剎 说佛境界不思议 令众同归解脱海」\n- 可爱乐光明天王众：「我念如来昔所行 承事供养无边佛 如本信心清净业 以佛威神今悉见」\n- 尸弃大梵王众：「佛身清净常寂灭 光明照耀遍世间 无相无行无影像 譬如空云如是见」\n- 自在天王众：「佛身周遍等法界 普应众生悉现前 种种教门常化诱 于法自在能开悟」\n- 善化天王众：「世间业性不思议 佛为群迷悉开示 巧说因缘真实理 一切众生差别业」\n- 知足天王众：「如来广大遍法界 于诸众生悉平等 普应群情阐妙门 令入难思清净法」\n- 时分天王众：「佛于无量久远劫 已竭世间忧恼海 广闢离尘清净道 永耀众生智慧灯」\n- 释迦因陀罗天王众：「我念三世一切佛 所有境界悉平等 如其国土坏与成 以佛威神皆得见」\n- 日天子众：「如来广大智慧光 普照十方诸国土 一切众生咸见佛 种种调伏多方便」\n- 月天子众：「佛放光明遍世间 照耀十方诸国土 演不思议广大法 永破众生痴惑暗」\n\n> **EN corresponding · 3.5 Leading Lines by Book Two Gāthās**\n>\n> Every group of Book Two opens its verses with a stanza on the Buddha's body, his universality, or his light — the twelve opening stanzas above are all transcribed verbatim from the text. Two patterns stand out. The 尸弃大梵王 (Brahma) group alone opens with 承佛**神力** rather than 承佛威力, and its stanza (\"佛身清淨常寂滅 光明照耀遍世間\") declares the Buddha's body as quiescent, formless, without trace — described as one sees a cloud in the sky. And the moon-deities close the volume with \"佛放光明遍世間 照耀十方諸國土\" — the Buddha's radiance poured over all lands, breaking the dark delusion of beings. Book Two thus concludes, as it began, on light.\n\n### 3.6 卷二小结：从「名」到「行」\n\n卷二与卷一在文体上的分野一目了然：卷一止于名号（列名），卷二始于行相（解脱门与颂）。由此可立一条读本品之法：**卷一之名号是「体」，卷二以下各众之名目是「用」；名起用行，用归名起。** 所谓「众海云集」者，卷一为海，卷二以下为流；然「流」之每一众、每门上，皆以「承佛威力」为因（唯尸弃大梵王组作「承佛神力」）——**「承佛威力/神力」诸字，为卷二至卷五每一颂的起手，由此可知：一切众生之所知、所行、所言，皆非自力，而是承佛威神。**\n\n> **EN corresponding · 3.6 From Naming to Action**\n>\n> The real divide between Book One and Book Two is formal: Book One names, Book Two acts. Once seen, it yields a rule of reading — the names of Book One are the substance (體), the liberation-gates and verses of Books Two to Five are the functions (用). The \"ocean-multitude\" gathered in Book One streams out in Book Two as rivers; yet every current, every door, every stanza begins with the four words 承佛威力 (\"sustained by the Buddha's power\" — the Brahma group alone has 承佛神力, \"by the Buddha's *spiritual* power\"). All that beings know, do, and speak, Hua-yan here says, is not their own efficacy but efficacy carried by the Tathāgata's might.\n\n---\n\n## 四、卷第三　世主妙严品第一之三（八部四王讫主风神）\n\n卷二以欲界天诸王为终，卷三则入「异生众」中之八部与杂类神。卷二、三、四、五卷，实为卷一「众海云集」之展开：**卷一所列为名，二卷以下为行（得解脱门、说颂言）**。\n\n### 4.1 卷三次第：八部居前，神众居后\n\n**卷三共十三组**：乾闼婆、鸠槃荼、龙、夜叉、摩睺罗伽、紧那罗、迦楼罗、阿修罗（八部四王）——卷四之主火、主水、主海、主河、主稼、主药、主林、主山、主地、主城、道场、足行、身众、执金刚（十四类神）与之相续，合观即是卷一「八部四王」与「十九类神」全部众类的续说。而卷三之八部组序，与卷一所列乾闼婆、紧那罗……自首及尾之序相反（详 4.2）。\n\n| 组 | 领众 | 所观（普观……众） | 偈数 |\n|---|---|---|---|\n| 1 | 持国乾闼婆王 | 一切乾闼婆众 | 10 偈 |\n| 2 | 增长鸠槃荼王 | 一切鸠槃荼众 | 10 偈 |\n| 3 | 毘楼博叉龙王 | 一切诸龙众 | 11 偈 |\n| 4 | 多闻大夜叉王 | 一切夜叉众会 | 10 偈 |\n| 5 | 善慧威光摩睺罗伽王 | 一切摩睺罗伽众 | 10 偈 |\n| 6 | 善慧光明天紧那罗王 | 一切紧那罗众 | 10 偈 |\n| 7 | 大速疾力迦楼罗王 | 一切迦楼罗众 | 10 偈 |\n| 8 | 罗睺阿修罗王 | 一切阿修罗众 | 10 偈 |\n| 9 | 示现宫殿主昼神 | 一切主昼神众 | 10 偈 |\n| 10 | 普德净光主夜神 | 一切主夜神众 | 10 偈 |\n| 11 | 遍住一切主方神 | 一切主方神众 | 10 偈 |\n| 12 | 净光普照主空神 | 一切主空神众 | 10 偈 |\n| 13 | 无碍光明主风神 | 一切主风神众 | 10 偈 |\n\n注：组 1 与组 10 中「而说颂言」原文（组 1 无「已」，组 10 作「遍观」），其余各组有「已」字者已照录；主空神组之偈为**五言**（「如来广大目，清净如虚空」），卷四执金刚神组亦然，为全品仅见之二处五言。\n\n### 4.2 八部次第与「倒序」结构\n\n卷一列八部四王之序为**阿修罗、迦楼罗、紧那罗、摩睺罗伽、夜叉、龙、鸠盤荼、乾闼婆**（袖珍版编按：「8个八部四王众：阿修罗王、迦楼罗王、紧那罗王、摩睺罗伽王、夜叉王、诸大龙王、鳩盤荼王、乾闼婆王」）；而卷三之组序为**乾闼婆、鳩盤荼、龙、夜叉、摩睺罗伽、紧那罗、迦楼罗、阿修罗**——**恰为倒序**。此与前文卷二「色界天五众」自大自在（色界上首）起讫欲界月天子之序相呼应：**全品颂赞诸众，自卷二大自在天王起，以倒序历色界、欲界，讫卷三八部、卷四执金刚神止。** 卷一列名自首而终，卷二至卷四颂赞则自终而首——**两种次序相向而行，而总归一海。**\n\n### 4.3 组一细读：持国乾闼婆王\n\n> **经文**　复次持国乾闼婆王，得自在方便摄一切众生解脱门。……\n\n**疏解**　「持国」（`dhṛtarāṣṭra`，护持国土义）为四天王之一（东面持国天王），乾闼婆（`gandharva`，香音神）为帝释之乐神，其王持国领之。此组十偈之颂，以「诸佛境界无量门 一切众生莫能入 善逝如空性清净 普为世间开正道」为首——**言佛境界虽难入，而善逝（如空清净）为世开道。** 此与领众「自在方便教化」义相衔：教化者，以自在方便，导群生于「莫能入」之境也。\n\n> **EN corresponding · 4.3 Group One: Dhṛtarāṣṭra, King of the Gandharvas**\n>\n> Dhṛtarāṣṭra (持國, \"upholder of the land\") is the eastern of the four world-protecting kings, and the gandharvas are the celestial musicians led by him. The opening stanza — \"The realms of the Buddhas have measureless doors, impossible for any being to enter; the Well-Gone One, pure like space, opens the right path for the world\" — sets the theme of the group: the Buddha's realm is utterly beyond reach, yet the Tathāgata, void and pure, makes a way for all. This is precisely the meaning of the king's own gate: \"the gate of freedom and skillful means in gathering in all beings\" (自在方便攝一切眾生).\n\n### 4.4 卷三小结\n\n卷三之颂，主于「佛之巍巍」：或以「佛眼广大无边际」（迦楼罗），或以「成就忍力世导师」（鸠槃荼），或以「众生罪恶深可怖……为救是等佛兴世」（夜叉）。八部因见佛而作赞，其救度之义多在「随类应化」；**欲界天众颂佛之「庄严」与「境界」，八部则颂佛之「救度」与「威神」；同会异口，而总由承佛威力。**\n\n## 五、卷第四　世主妙严品第一之四（主火神讫执金刚神）\n\n### 5.1 卷四次第：十四类神\n\n**卷四共十四组**，仍以「承佛威力」各领一类神众，自主火神起讫执金刚神。与卷三七「杂类神」相续，即卷一「复有佛世界微尘数执金刚神」……等十九类神之倒序颂赞。卷四偈数统计如下（依各组「尔时……而说颂言」续偈逐组核实）：\n\n| 组 | 领众 | 所观（普观……众） | 偈数 |\n|---|---|---|---|\n| 1 | 普光燄藏主火神 | 一切主火神众 | 10 偈 |\n| 2 | 普兴云幢主水神 | 一切主水神众 | 10 偈 |\n| 3 | 出现宝光主海神 | 一切主海神众 | 10 偈 |\n| 4 | 普发迅流主河神 | 一切主河神众 | 10 偈 |\n| 5 | 柔软胜味主稼神 | 一切主稼神众 | 10 偈 |\n| 6 | 吉祥主药神 | 一切主药神众 | 10 偈 |\n| 7 | 布华如云主林神 | 一切主林神众 | 10 偈 |\n| 8 | 开华匝地主山神 | 一切主山神众 | 10 偈 |\n| 9 | 普德净华主地神 | 一切主地神众 | 10 偈 |\n| 10 | 宝峰光耀主城神 | 一切主城神众 | 11 偈 |\n| 11 | 净庄严幢道场神 | 一切道场神众 | 10 偈 |\n| 12 | 宝印手足行神 | 一切足行神众 | 10 偈 |\n| 13 | 净喜境界身众神 | 一切身众神众 | 10 偈 |\n| 14 | 妙色那罗延执金刚神 | 一切执金刚神众 | 10 偈 |\n\n注：①表列组序即卷四次第，与卷一杂类神「主火神……执金刚神」之次**恰为倒叙**（卷一自执金刚神始，卷四自主火神终，二者相向）。②**执金刚神组之偈为五言**（「汝应观法王 法王法如是 色相无有边 普现于世间」），与卷三主空神组同为全品仅见之五言体。③卷四诸神众，皆对应卷一「复有佛世界微尘数X神」诸段之续说。\n\n### 5.2 组末细读：妙色那罗延执金刚神\n\n> **经文**　复次妙色那罗延执金刚神，得能入无边境界解脱门。……\n\n**疏解**　「执金刚神」（`vajradhara`，执金刚杵之神）为佛之护法，卷一「复有佛世界微尘数执金刚神。所谓妙色那罗延执金刚神……」居十九类神之首，**卷四则殿十四组之末——首尾相应，前后映照。**「那罗延」（`nārāyaṇa`，力士）为具大身力之神。「妙色那罗延执金刚神」组之颂用**五言**，其首偈「汝应观法王 法王法如是」，以十面五言摄「法王」义——在满卷七言之中，此一转笔尤为醒眼；执金刚神为护法之神，其颂以庄严法王殿后，正合以身护法之义。\n\n> **EN corresponding · 5.2 The Last Group: The Vajra-Bearers under 妙色那羅延**\n>\n> The vajra-bearers (執金剛神, *vajradhara*), guardians who hold the diamond thunderbolt, stand **first** in the roll of the nineteen \"miscellaneous beings\" in Book One, and open **last** in the fourteen groups of Book Four: end and beginning answer each other. The name 那羅延 (Nārāyaṇa) marks them as mighty men of bodied strength. Their verses alone — in a book of heptasyllables — are written in penta-syllabic meter: \"Look on the Dharma-King; such is the Dharmarāja: his color and form are boundless, manifest everywhere in the world.\" The guardians' chant, closing the long sequence, does service to the Dharmarāja as they do service to the Buddha.\n\n### 5.3 卷四小结\n\n卷四之十四组，仍以上首神名冠于组前，组名与卷一「复有……神」之名一一相应。全品「解脱门」之数，卷二、卷三、卷四、卷五逐组递积，至卷五菩萨众而极；卷四神众诸颂，多在「**严净**」与「**护持**」之间——主火神赞「所有暗障皆令灭」，主水神赞「是故见者无厌足」，主城神赞「光明遍照于十方」，皆庄严国土、光显佛境之辞；至执金刚神以五言赞「法王」，卷四之颂于焉告成。\n\n## 六、卷第五　世主妙严品第一之五（菩萨众·颂赞与震动）\n\n### 6.1 卷五开首：普贤菩萨颂\n\n> **经文**　尔时普贤菩萨摩诃萨，入不思议解脱门方便海，入如来功德海。所谓有解脱门名严净一切佛国土，调伏众生令究竟出离；有解脱门名普诣一切如来所修具足功德境界；……尔时普贤菩萨摩诃萨，以自功德，复承如来威神之力，普观一切众会海已，即说颂言：「佛所庄严广大剎，等于一切微尘数……」十偈。\n\n**疏解**　卷五异于二、三、四卷者，首即普贤菩萨独作十偈之颂。前此诸卷，皆「尔时某王承佛威力」；**普贤则「以自功德，复承如来威神之力」**——加「以自功德」四字，为全品颂主中所独有，明普贤菩萨非仅承佛而行，别有自证之功德。其首偈「佛所庄严广大剎 等于一切微尘数 清净佛子悉满中 雨不思议最妙法」，以「剎海微尘」为量，开卷五「世界海」之眼界。\n\n> **EN corresponding · 6.1 The Opening Chant of Samantabhadra**\n>\n> Book Five differs from Books Two to Four at once: it opens with a ten-stanza chant sung by Samantabhadra alone. Every earlier chief of a group \"sustained by the Buddha's power\" (承佛威力) approached in the same formula; Samantabhadra alone adds \"**by his own merit**, and moreover sustained by the Tathāgata's *spiritual* power\" (以自功德、復承如來威神之力) — \"his own merit\" occurs nowhere else among the chant-leaders of the chapter. One Bodhisattva stands here above the rest. His first stanza, \"The vast kalpa-realms adorned by the Buddha equal the number of atoms in a dust-mote; pure Buddha-children fill them all, raining the most wonderful Dharma,\" at once opens the vision of *world-seas* (世界海) that dominates the last pages of the chapter.\n\n### 6.2 十一组菩萨众\n\n卷五**普贤之后列十一组菩萨众**，仍以「承佛威力」各领其众（第一「普观一切菩萨解脱门海」，余「普观一切道场众海」等）：\n\n| 组 | 领众 | 所观 | 偈数 |\n|---|---|---|---|\n| 1 | 净德妙光菩萨 | 一切菩萨解脱门海 | 10 偈 |\n| 2 | 海月光大明菩萨 | 一切菩萨众庄严海 | 10 偈 |\n| 3 | 海慧自在神通王菩萨 | 一切道场众海 | 10 偈 |\n| 4 | 雷音普震菩萨 | 一切道场众海 | 10 偈 |\n| 5 | 众宝光明髻菩萨 | 一切道场众海 | 10 偈 |\n| 6 | 大智日勇猛慧菩萨 | 一切道场众海 | 10 偈 |\n| 7 | 不思议功德宝智印菩萨 | 一切道场众海 | 10 偈 |\n| 8 | 百目莲华髻菩萨 | 一切道场众海 | 10 偈 |\n| 9 | 金燄圆满光菩萨 | 一切道场众海 | 10 偈 |\n| 10 | 法界普音菩萨 | 一切道场众会海 | 11 偈 |\n| 11 | 云音净月菩萨 | 一切道场众会海 | 11 偈 |\n\n注：①上表偈数按各组「尔时……即说颂言」之后所续偈文逐组核实（组 1 至组 9 各 10 偈，组 10、11 各 11 偈）。②「普观一切道场众海」语，第二组以下诸组同之；卷一「其名曰」二十菩萨中，净德妙光、海月光大明、众宝光明髻、法界普音、云音净月等名可一一对勘。\n\n### 6.3 卷五末：善勇猛光幢菩萨·六种震动·供养云\n\n卷五经历十一组菩萨颂后缀以善勇猛光幢菩萨之颂（**承佛威神**，说如来自在神通等十颂），然后为：\n\n> **经文**　尔时善勇猛光幢菩萨摩诃萨，承佛威神，观察十方，即说颂言：……「……皆佛相中明了见」（十偈）。尔时华藏庄严世界海，以佛神力，其地一切六种十八相震动。所谓动、遍动、普遍动；起、遍起、普遍起；踊、遍踊、普遍踊；震、遍震、普遍震；吼、遍吼、普遍吼；击、遍击、普遍击。尔时一切诸世主，一一皆现不思议诸供养云，雨于如来道场众海。……此诸世主，一一皆现如是供养云，雨于如来道场众海，靡不周遍。如此世界中，一一世主，心生欢喜，如是供养。其华藏庄严世界海中，一切世界所有世主，悉亦如是；而为供养。其一切世界中，悉有如来坐于道场。……\n\n**疏解**　此段为全品之归宿：**震动**在「华藏庄严世界海」（华藏世界海此品首次点出，为《华严》宇宙观之名相），六种十八相震动示佛成道之感应；**供养云**则以「此诸世主，一一皆现」为主语，对回卷一「众海云集」——卷一云集，卷五既闻法已而兴供养，首尾圆合。**卷五之末「悉有如来坐于道场」，与卷一「尔时世尊处于此座」一开一合，本品于是告成。** 而「各各信解、各各所缘、各各三昧方便门」以下十一个「各各」，总摄一切众海各得其门之义，为「解脱门」海洋之结。\n\n> **EN corresponding · 6.3 The End: Quaking, Offerings, and the Rounding of the Chapter**\n>\n> Eleven bodhisattva-groups sung, 善勇猛光幢 (King of Dauntless Radiance) closes with a further chant (sustained this time by the Buddha's *spiritual* power, 承佛威神) upon the Tathāgata's freedom and superknowledges. Then the whole world-sea of Padma-garbha (華藏莊嚴世界海) quakes with the six kinds of eighteen-fold motions — moving, rising, leaping, trembling, roaring, striking, each triple in scope — the response of the cosmos to the Buddha's enlightenment; and every world-lord, one by one, pours out measureless clouds of offerings. This returns to the \"gathering in clouds\" (云集) with which Book One opened. What gathered in Book One, offers in Book Five; and \"in all those worlds the Tathāgata sits on the Bodhimanda\" answers the opening \"at that time the World-Honored One was seated upon this throne.\" The chapter is thus a ring. The closing litany of eleven 各各 — \"each in his own faith-acceptance, each in his own object, each in his own gate of samādhi and skill\" — gathers the whole ocean of beings into the ocean of liberation-gates.\n\n## 附录一　本品「解脱门」计数与比勘\n\n本品全五卷，开「解脱门」为名相连缀；编按与逐组核计如下：\n\n| 卷 | 组数 | 承佛威力组 | 特殊领起 | 编按之总说 |\n| --- | --- | --- | --- | --- |\n| 卷一 | — | 无（仅列名） | 其名曰：普贤菩萨摩诃萨等 | 「介绍异生众中的色界天5众……51位王众」等入名编按 |\n| 卷二 | 12 | 11 组 | 尸弃大梵王作「承佛神力」 | 「此卷经文介绍124王及其所得解脱门、123个偈颂」 |\n| 卷三 | 13 | 13 组 | — | 「8个八部四王众……80位王众」等 |\n| 卷四 | 14 | 14 组 | — | — |\n| 卷五 | 普贤颂+11 组菩萨+善勇猛终颂 | 12 处「承佛威力」+1 处「承佛威神」（善勇猛）+普贤「复承如来威神之力」 | — | — |\n\n比勘要旨：①「承佛威力」为卷二至卷五颂言之通式；独尸弃大梵王作「承佛神力」、善勇猛光幢作「承佛威神」、普贤作「以自功德复承如来威神之力」。②卷二次第自大自在（色界上首）讫月天子，恰与卷一并卷三、卷四之列名序倒行（详见 4.2）。③「解脱门」字数层出，本文不作汇总之数，逐组门名可依正文各表及源文（八十华严 T10n0279）比勘。\n\n## 附录二　会众名号分类总表（卷一）\n\n依经文列名次序，卷一会众可析为「同生众」与「异生众」两大部分：\n\n| 类 | 众名 | 上首（首名） | 明记数译文 | 特点 |\n| --- | --- | --- | --- | --- |\n| 同生众 | 菩萨摩诃萨（其名曰二十） | 普贤菩萨摩诃萨 | 有佛世界微尘数 | 皆与毘卢遮那如来共集善根；「同生」义依海云法师讲记，喻与佛同心毕竟同向 |\n| 异生众·十九类神 | 执金刚神 | 妙色那罗延执金刚神 | 有佛世界微尘数 | 恆发大愿，愿常亲近供养诸佛 |\n|  | 身众神 | 华髻庄严身众神 | 有佛世界微尘数 | 皆于往昔成就大愿供养承事诸佛 |\n|  | 足行神 | 宝印手足行神 | 有佛世界微尘数 | 亲近如来随逐不舍 |\n|  | 道场神 | 净庄严幢道场神 | 有佛世界微尘数 | 于过去值无量佛成就愿力 |\n|  | 主城神 | 宝峰光耀主城神 | 有佛世界微尘数 | 严净如来所居宫殿 |\n|  | 主地神 | 普德净华主地神 | 有佛世界微尘数 | 皆从往昔发深重愿 |\n|  | 主山神 | 宝峰开华主山神 | 复有无量 | 皆于诸法得清净眼 |\n|  | 主林神 | 布华如云主林神 | 复有不可思议数 | 皆有无量可爱光明 |\n|  | 主药神 | 吉祥主药神 | 复有无量 | 性皆离垢，仁慈祐物 |\n|  | 主稼神 | 柔软胜味主稼神 | 复有无量 | 莫不皆得大喜成就 |\n|  | 主河神 | 普发迅流主河神 | 复有无量 | 皆勤作意利益众生 |\n|  | 主海神 | 出现宝光主海神 | 复有无量 | 悉以如来功德大海充满其身 |\n|  | 主水神 | 普兴云幢主水神 | 复有无量 | 常勤救护一切众生而为利益 |\n|  | 主火神 | 普光燄藏主火神 | 复有无数 | 皆能示现种种光明，令诸众生热恼除灭 |\n|  | 主风神 | 无碍光明主风神 | 复有无量 | 皆勤散灭我慢之心 |\n|  | 主空神 | 净光普照主空神 | 复有无量 | 心皆离垢广大明洁 |\n|  | 主方神 | 遍住一切主方神 | 复有无量 | 能以方便普放光明，恆照十方相续不绝 |\n|  | 主夜神 | 普德净光主夜神 | 复有无量 | 皆勤修习以法为乐 |\n|  | 主昼神 | 示现宫殿主昼神 | 复有无量 | 皆于妙法能生信解，恆共精勤严饰宫殿 |\n| 异生众·八部四王 | 阿修罗王 | 罗睺阿修罗王 | 复有无量 | 悉已精勤，摧伏我慢及诸烦恼 |\n|  | 迦楼罗王 | 大速疾力迦楼罗王 | 复有不可思议数 | 悉已成就大方便力，普能救摄一切众生 |\n|  | 紧那罗王 | 善慧光明天紧那罗王 | 复有无量 | 皆勤精进观一切法，心恆快乐自在游戏 |\n|  | 摩睺罗伽王 | 善慧摩睺罗伽王 | 复有无量 | 皆勤修习广大方便，令诸众生永割痴网 |\n|  | 夜叉王 | 毘沙门夜叉王 | 复有无量 | 皆勤守护一切众生 |\n|  | 诸大龙王 | 毘楼博叉龙王 | 复有无量 | 莫不勤力兴云布雨，令诸众生热恼消灭 |\n|  | 鸠槃荼王 | 增长鸠槃荼王 | 复有无量 | 其心无碍 二十菩萨」之对勘未及展开**：卷一「其名曰」列与卷五十一组菩萨众名号之逐一对应（净德妙光、海月光大明、众宝光明髻、法界普音、云音净月等），本文仅举其名，未逐条判其是否同一波罗蜜门；此可作后续延伸。\n\n5. **「五言偈」二处（主空神、执金刚神）之用意**：全品七言为常，独此二组五言；本文如实指出而未敢妄定「以五言行省略收缩」之义，盖两处恰在卷三卷末（主空神）与卷四卷末（执金刚神），疑系译者为分卷收束所变，然无文本内证，姑记待考。\n\n6. **「妙音天」推断**：第 3.4 节将「妙音天」推断为「星宿音妙庄严天王」，此为本文行文之推断，非原文自名（原文该组十一王中无「妙音天」其人）；其说仅供参酌。\n\n7. **海云法师讲记引用皆依袖珍版（M4X3）**：本文「海云法师讲记」引文，悉见于 `docs/huayanhai/义学专题/经论原典/八十华严-简-大华严寺袖珍版_1.txt` 卷端说明与卷中编按（不含卷页码），未另引「过汇编」之外资料；凡超出简本所能证实者，均已如上注明〔待核〕。\n\n8. **未竟事项**：①卷一「其名曰」二十菩萨名号全录及逐名梵文对音（Śāntideva 非跋陀罗辈，须另考）；②卷二至卷四逐解脱门名之全文整理表（本文仅存组首门名及颂）；③八十卷本与六十卷本「世主妙严品」品内异文逐字比勘；④四十卷「入法界品」与本品会众之会通表。——以上四项，皆待后续读经批次补足。", "data_source": "", "data_pool": "practice", "back": {"tab": "gap", "view": "avatamsaka-studies", "label": "文献页 · 华严经学"}};

  // ── 导览 ──
  if(a.meta){
    h+='<div class="section" style="border-left:4px solid var(--gold)"><h2>📌 导览</h2>';
    h+='<p style="font-size:0.8em;line-height:1.9;white-space:pre-line">'+_mdInline(a.meta)+'</p></div>';
  }

  // ── 自动目录 ──
  if(embed.toc.length){
    h+='<div class="section"><h2>🧭 本文目录</h2>';
    h+='<div style="column-width:250px;column-gap:26px;font-size:0.8em;line-height:1.75">';
    embed.toc.forEach(function(t){
      var pad=(t.lv>2?'padding-left:'+((t.lv-2)*16)+'px;':'');
      h+='<div style="'+pad+'"><a href="#'+t.id+'" style="color:'+(t.lv===2?'var(--gold)':'var(--text2)')+';text-decoration:none">'+t.text+'</a></div>';
    });
    h+='</div></div>';
  }

  // ── 全文 ──
  h+='<div class="section" style="border-left:4px solid var(--gold)" id="article-full">';
  h+='<h2 style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px"><span>📄 '+a.title+' · 全文</span>'
    +'<button id="article-en-toggle" class="f-nav-btn" onclick="toggleArticleEN()" title="在「含英文批注」与「仅中文正文」之间切换显示">🌐 英文批注：显示</button></h2>';
  h+=embed.html;
  h+='</div>';

  // ── 页脚 ──
  h+='<div style="margin-top:18px;padding-top:10px;border-top:1px solid var(--line);font-size:0.74em;color:var(--text2)">';
  h+='<a href="index.html" style="color:var(--blue);text-decoration:none">📚 返回独立文章目录</a>';
  if(a.back && a.back.tab){
    h+=' · <a href="../tabs/'+a.back.tab+'.html" style="color:var(--blue);text-decoration:none">'+a.back.label+'</a>';
  }
  h+='</div>';

  root.innerHTML=h;

  // ── 阅读模式：识别「英文/术语批注」块，支持仅中文正文切换 ──
  _initArticleENMode();

  // ── 支持 #锚点 直达（目录跳转用真实 id 锚点）──
  if(location.hash){
    setTimeout(function(){
      var el=document.getElementById(location.hash.slice(1));
      if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    },80);
  }
}

if(document.readyState!=='loading'){renderArticle();}
else{document.addEventListener('DOMContentLoaded',renderArticle);}

// ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|🔑|术语格义|主题对读注|卷末批注)/.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);
  }
}
function _applyArticleENMode(){
  var full=document.getElementById('article-full');
  var btn=document.getElementById('article-en-toggle');
  var hide=(sessionStorage.getItem('article_en_hide')||'')==='1';
  if(full) full.classList.toggle('en-hidden', hide);
  if(btn) btn.textContent=hide?'🌐 英文批注：展开':'🌐 英文批注：显示';
}
</script>
</body>
</html>
