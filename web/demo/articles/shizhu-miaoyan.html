<script>
var ARTICLE = {"id": "shizhu-miaoyan", "file": "articles/shizhu-miaoyan.html", "title": "世主妙严品细读", "title_sub": "华严经首品·按品精读·卷一组群详解 · 会众名号·颂赞·震动作供 · 中英对照 · 未完备已标明", "icon": "🏛", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读_第一部_世主妙严品.md", "doc_md": "# 华严经细读·第一部：世主妙严品（按品精读·卷一组群详解）\n\n> 逐句疏解 · 名相训释 · 诸众解脱门会读 · 中英对照\n\n> **EN corresponding · Close Reading of the Avataṃsaka Sūtra, Part One: The Chapter of the Adornment of the World-Lord**\n\n> **A Verse-by-Verse Commentary\n\n> **【未完备声明】** 本篇按《华严经》品目次第推进的「华严经细读·系列」第一部。就本品而言，**「逐组细读」目前覆盖 26/50 组（≈52%）**：卷二 12/12（**已全卷完成**）、卷三 13/13（**已全卷完成**）、卷四 1/14、卷五 0/11。其余 24 组暂只列「次第一览表＋颂首一句」，未作门名解释、法门义理与颂文疏解。**文中凡未完备之处一律标明〔未竟〕／〔待核〕／〔存疑〕**。本篇标题原拟「逐卷逐组细读」，现依实况降格为「按品精读·卷一组群详解」。待续推进细读时，将按卷/按组分批补足，不擅自将半成品升格为全备。\n\n with Terminological Notes, a Collective Reading of the Liberation Gates of the Assemblies, and Parallel Chinese–English Text**\n\n---\n\n## 〇、凡例\n\n本篇是「华严经文本细读」系列的第一部。系列取「按品目次第、逐句不捨」的读经方式，以八十华严三十九品为次第，逐品推进；**各品篇幅悬殊，故或一品独读、或数品合读，实际以「卷一组群」为单位**，每一部独立成篇、独立成址，篇内依经卷分章。**全系列三十九品之次第、各品拟精读方式、待续梯队，见〈华严经细读·系列总纲〉（web/demo/articles/huayan-series-outline.html）。**\n\n一、**校勘底本一律用唐·实叉难陀八十华严**（`T10n0279`）。凡引经、凡据以定卷次品次、凡回源校勘，皆以此为准；**六十华严**（`T09n0278`，东晋佛驮跋陀罗译）、**四十华严**（`T10n0293`，唐般若译）**不作底本，不得据以改写八十华严经文**——异译改原典则失其真，此为**校勘之纪律**。惟「不作底本」**不等于「不用」**：本系列**品读主从随品而变**（凡例一之二），**三版汉译都要品读，不得偏废**。凡引经文，一律标明卷次与页码定位，可回 CBETA Online 逐字复核。**字面说明**：本文正文经文引文用简体袖珍版（便于逐句疏解、不引生繁简辨识之扰），对读与附录所引两种汉译经文原文则用繁体袖珍版/繁体六十华严逐字照录（见附录五）——读者知「正文简、对读繁」分工，就八十华严而言皆系同一底本之繁化简，非两藏。\n\n一之二、**【品读主从】本篇属入法界品之前，故以八十华严为叙事主轴，六十华严为辅读与对读**；入法界品以后则改以四十华严（其全经仅此一品）为主轴，八十、六十退为辅读。三版皆须品读：主从之分仅指**叙事骨架取自何本**，非谓其余可略。品读时涉及之**相关别译、单行本、眷属经**，**一并作辅读与对读**（本篇之实例如「世尊结界自在主神」一类名相，可于六十华严卷二「世间净眼品」对读，其叙次与八十卷本不同；梵译、藏译之对读列入长远规划）。\n\n二、**凡疏解处，区分三层**：其下「疏解」为本文依经文直解，采信而有据者标明出处；「名相」为梵汉对勘与名相训释，凡学界有异说者并列而不强断；「会读」引本项目所藏海云继梦法师《华严经经首》开示及卷二至卷五讲记，与经文逐节呼应，法师之说属现代传承解，属一家之言，不冒充古注。\n\n三、**引文从严**。凡引澄观《大方广佛华严经随疏演义演义钞》、法藏《华严经探玄记》之语，皆注明经号；未能核到原文者不引，标〔待核〕。凡属本文推断者，明标「〔本文判断〕」，不与经文、古注混同。\n\n四、**存疑与未竟，一律如实标明**〔待核〕〔存疑〕〔未竟〕，不掩其缺。本篇凡属编者未及展开处（如四十华严异本对照、梵藏本对勘），于篇末「未竟与存疑」节列明，不作含混了语。\n\n五、**中英对照**。逐节疏解之后附英文对读，英文以达意为务，不逐字硬译；名相依全站固定术语表（`dharmadhātu` 法界、`bodhimaṇḍa` 菩提道场、`vajra` 金刚、`maṇi` 摩尼、`vairocana` 毗卢遮那、`bodhisattva` 菩萨摩诃萨等），无可通行对译者标〔no standard English equivalent〕，不强造译名。\n\n六、**名号不逐一枚举**。卷一至卷五所列菩萨、天神、八部众名号逾千，本篇于各类众中择代表名号训释，其余归类说明其类别义理与象征系统；名号总数与分类计数，逐一验算，附于附录。\n\n七、**文字遵底本**。所据为台湾大华严寺《八十华严》袖珍版（繁、简各一），该版据其版权页自述「以《大正藏》为底本，复以华严学苑刊本（此本据同治年间四明天童寺刊本重梓）、磧砂本及高丽藏本参校」，并统一了部分体字俗字（如瑠璃→琉璃、徧→遍、覩→睹、踈→疏、輝→晖）。本篇引用该版文字，异体字一概从之，不擅改经文。\n\n七之二、**讲者之说，疑误只标不改**。凡引海云法师讲记及古今注疏、学者之说，本篇态度为「**存其原貌、标明出处、疑似口误或误说者径标〔存疑待查〕**」——例如讲记中名相、次第、数字偶与经文或底本不合者，只作提示与存疑标注，**不代为改订、不据以立说、不在本文中驳正**。故凡本篇转述讲者语，必附「某师云」字样并注其出处，使读者可自行覆核原讲而辨其是非。\n\n八、**此第一品「世主妙严品」之名，卷内五分**（第一之一至第一之五），跨越八十华严卷第一至卷第五，共 32,713 字、1,151 句。经文本体之外，袖珍版另附编者括注五处（标「（以上介绍……）」），非经文，本文凡引皆标「〔袖珍版编者按〕」，与经文严格分开。\n\n九、**〔本批新增〕名相、会处、术语「出处＋信度」一体标注**。凡本文所用之**道场名、会处名、品名、专有术语、学者／祖师之名号**，凡经有专名者**一律溯至经卷**；凡历代注疏始创之判摄名（如七处九会之会名）**注明首倡者与经号**。信度分五级（详见**附录九**）：\n\n| 级 | 义 | 标注方式 |\n| --- | --- | --- |\n| **A1** | **经文直证**：本经（三译对照）明文作此名 | 〔A1〕出 `T10n0279` 卷次 |\n| **A2** | **古注明证**：历代注疏原文明文作此名 | 〔A2〕首倡者《…》经号·卷次 |\n| **B** | **文献转述**：工具书／近人研究征引，可信但非一手 | 〔B〕书名·页 |\n| **C** | **单一来源或仅见转引**：无从复核，暂存待考 | 〔C〕〔待核〕 |\n| **D** | **疑讹／不见于经与历代注疏** | 〔D〕证否，**本文正文一律不采用**，仅列于附录九「已否之名」 |\n\n**铁律：凡 D 级名，本文正文不出现，只在附录九「已否之名」中列其证否过程**（体例之范例见 1.2「摩訶迦羅道場」、1.4「经首≠经题」二处）。此体例为后续细读所遵，务使读者对每一名相之出处与可信度一目了然，亦便于覆核。\n\n---\n\n## 〇之二、本品内容地图（未入其门，先观其海）\n\n> **本节体例。** 以下之图与表，数据全部取自本文已逐组回源核定的卷二至卷五各组表（组数、组首、颂主、偈数）与卷一编者按（名号计数，本文已验算相符）；**凡属本文推断者，一概标〔本文判断〕，不入图**。图三之图，各图只看一件事，勿求其一图而尽本品。\n\n### 〇之二.0 提要\n\n《世主妙严品》一品，凡五卷、四十二位领众、四十类众、**五百二十七颂**。数目既大，若从卷一逐行读至卷五，读者如入大海——**名相汗漫，音义层出，逐句不捨而莫辨其所以然**。故先立三图，把三件事一次画清：\n\n| 图 | 画什么 | 一句话 |\n|---|---|---|\n| **图 〇-1　众海周匝图** | 众从何来 | 四十类众环佛而坐，自器世间至同生众，凡四层 |\n| **图 〇-2　倒唱镜** | 行向何处 | 异生三十九类**所唱之序，逆于所列之序**，而首尾相衔，成环 |\n| **图 〇-3　解脱门阶道** | 由何而入 | 卷三十三门自「摄一切众生」阶递而上，末门直入「佛法」 |\n\n**〔本文拟·品读提要偈〕**（此文非经文，乃本文为读者自制之导读）\n\n> 一佛坐道场，众海悉云集。\n> 卷一列名姓，二卷以下行。\n> 天众十二王，八部四王名，\n> 杂类十九神，菩萨居其顶。\n> 名即是其界，门即是其行，\n> 颂即是其声，五百二十七。\n> 列名自下上，歌颂自上而——\n> 到头仍是一人，复从头再唱。\n\n**读华严者，先当知其数与位。** 华严写「众」，从不说「多」，只说「**周匝遍满**」；从不说「集」，只说「**云集**」；从不说「有若干」，只说「**有佛世界微尘数**」。故此处之图，亦不以数为限，而以**位**为经、以**名**为纬。**凡位有四：一曰器世间主（十九类神），二曰众生世间主（八部四王），三曰天众（欲界七·色界五），四曰同生众（菩萨二十）。** 澄观《疏》称此为「四十眾」，而本品所唱之颂，适足配此四十类——**卷二唱天之十二，卷三唱八部之八并神之类五，卷四唱神之类十四，卷五唱菩萨**：\n\n**12 + 13 + 14 = 39，加卷五菩萨一轨，凡 40 类，一类不缺，一名不重。** 十九类神拆作卷三之五（主昼·主夜·主方·主空·主风）与卷四之十四，余十四类不多不少——**此即本品结构之精密处，亦卷一编者按「以上是……」五处之所以能分毫不差**。\n\n> **EN corresponding · Map of the Chapter.** Before the reading begins, three maps are given: where the multitudes come from, in what order they chant, and by which gate one enters. The chapter's forty classes of beings divide exactly into 12 + 13 + 14 = 39 sung in Books Two to Four, plus the bodhisattva track of Book Five. All figures are drawn from data already verified line-by-line against `T10n0279`; interpretive judgements are marked as such and kept out of the figures.\n\n### 〇之二.1 图 〇-1　众海周匝图\n\n<figure>\n<svg viewBox=\"0 0 1000 800\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<circle cx=\"500\" cy=\"372\" r=\"344\" fill=\"none\" stroke=\"#d3c7ae\" stroke-width=\"1.2\" stroke-dasharray=\"6 7\"/>\n<text x=\"500\" y=\"22\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#8a7a5e\">外圈虚线：卷一于每一众皆云「复有佛世界微尘数」——下列四十类者，「而为上首」而已</text>\n\n<circle cx=\"500\" cy=\"372\" r=\"318\" fill=\"#f8f3ea\" stroke=\"#c9b98f\" stroke-width=\"1\"/>\n<circle cx=\"500\" cy=\"372\" r=\"252\" fill=\"#f3ecdf\" stroke=\"#c9b98f\" stroke-width=\"1\"/>\n<circle cx=\"500\" cy=\"372\" r=\"186\" fill=\"#ede4d2\" stroke=\"#c9b98f\" stroke-width=\"1\"/>\n<circle cx=\"500\" cy=\"372\" r=\"108\" fill=\"#e6dbc5\" stroke=\"#c9b98f\" stroke-width=\"1\"/>\n\n<text x=\"500\" y=\"70\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#7a5a28\">異生眾 · 十九類神（器世間主）</text>\n<text x=\"500\" y=\"92\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5a5147\">執金剛 · 身眾 · 足行 · 道場 · 主城 · 主地 · 主山 · 主林 · 主藥 ·</text>\n<text x=\"500\" y=\"108\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5a5147\">主稼 · 主河 · 主海 · 主水 · 主火 · 主風 · 主空 · 主方 · 主夜 · 主晝</text>\n\n<text x=\"500\" y=\"144\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#7a5a28\">異生眾 · 八部四王（眾生世間主）</text>\n<text x=\"500\" y=\"166\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5a5147\">阿修羅 · 迦樓羅 · 緊那羅 · 摩睺羅伽 · 夜叉 · 諸大龍 · 鳩槃荼 · 乾闥婆</text>\n\n<text x=\"500\" y=\"210\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#7a5a28\">異生眾 · 天眾十二（欲界七 · 色界五）</text>\n<text x=\"500\" y=\"232\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5a5147\">欲界：月天子 · 日天子 · 三十三天王 · 須夜摩 · 兜率陀 · 化樂 · 他化自在</text>\n<text x=\"500\" y=\"248\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5a5147\">色界：大梵 · 光音 · 遍淨 · 廣果 · 大自在</text>\n\n<text x=\"500\" y=\"288\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\" fill=\"#7a5a28\">同生眾 · 菩薩摩訶薩二十（普賢為首）</text>\n<text x=\"500\" y=\"308\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5a5147\">卷一「其名曰二十」——卷五即取其中十二組而頌之</text>\n\n<circle cx=\"500\" cy=\"372\" r=\"52\" fill=\"#b8863c\" stroke=\"#8a6a34\" stroke-width=\"1.2\"/>\n<text x=\"500\" y=\"364\" text-anchor=\"middle\" font-size=\"15.5\" font-weight=\"bold\" fill=\"#ffffff\">毘盧遮那如來</text>\n<text x=\"500\" y=\"385\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#f6ead6\">摩竭提國</text>\n<text x=\"500\" y=\"401\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#f6ead6\">阿蘭若法菩提場</text>\n\n<text x=\"500\" y=\"470\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#5a5147\">卷二起首一段「眾海悉已雲集，無邊品類周匝遍滿」，即此圖之注腳——</text>\n<text x=\"500\" y=\"490\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#5a5147\">會眾之來，非雜亂而至；各從其所來方整集，而「一心瞻仰」。</text>\n\n<rect x=\"90\" y=\"530\" width=\"820\" height=\"1\" fill=\"#d3c7ae\"/>\n<text x=\"500\" y=\"562\" text-anchor=\"middle\" font-size=\"13.5\" fill=\"#7a5a28\">卷一編按所計（本文逐一驗算相符）</text>\n<text x=\"500\" y=\"588\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#5a5147\">菩薩 20 位 · 十九類神 190 位 · 八部四王 80 位 · 欲界天 71 位 · 色界天 51 位</text>\n<text x=\"500\" y=\"612\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#5a5147\">異生小計 392 位，合菩薩 20 位，總計 412 位上首——此即卷一列名之數</text>\n<text x=\"500\" y=\"646\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#7a6a58\">惟「二十菩薩」與「五類神主」之偈數，卷二·卷四已逐組核定，卷五諸組依 6.2 表累加〔待核〕</text>\n</svg>\n<figcaption><b>图 〇-1　众海周匝图。</b>四层同心理相：中心为毘卢遮那如来于摩竭提国阿兰若法菩提场；向外依次为同生众（菩萨二十）、异生·天众十二、异生·八部四王、异生·十九类神。外圈虚线示意经文「复有佛世界微尘数」——卷一所列四十类，皆「而为上首」者，其下无量。本图名号与计数，取自附录二会众分类总表（40 类）与卷一编者按五处括注（本文验算 20+190+80+71+51＝412，与编者按「总共是 412 位」相符）。<div class=\"en-line\">Fig. 0-1. The ocean-multitude surrounding the Buddha: one centre (Vairocana at the Bodhimaṇḍa in Magadha) and four concentric registers — the bodhisattvas, the heavenly multitudes, the eight Legions and four Kings, and the nineteen classes of deities presiding over the world&#39;s vessels. The dashed outer ring stands for the text&#39;s formula 「復有佛世界微塵數」: the forty classes listed in Book One are only their leaders.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. **四层之序，是「位」不是「高」。** 由内向外，同生众在内、器世间主在外，**并不表示菩萨「高于」城神、山神**——华严的次第是**作用之广**，不是功德之等第。**内为能化，外所化；化所及者愈广，则愈在外。** 〔本文判断〕故读此图，不可读成位阶表，须读成一幅「摄化之图」。\n2. **「主」字十九见，是全品之骨。** 十九类神之名，十有八九皆冠「主」字——主火、主水、主海、主河、主稼、主药、主林、主山、主地、主城、主空、主方、主夜、主昼。**主其所主，而自得其用**：主城神「严净如来所居宫殿」，主海神「悉以如来功德大海充满其身」。**名与所主相应，则名与所证之解脱门相应**（详见 4.1–5.1 各组表）。\n3. **中心那一小点，方是全品所归。** 卷二起首一段说得很直：会众之能来此，非因其自得，**「皆以毘卢遮那如来往昔之时……曾摄受」**。**四十类众，四百一十二名号，皆是被摄者；图之所以成环，正因为有一佛在其中。** 〔本文判断〕\n\n### 〇之二.2 图 〇-2　倒唱镜\n\n<figure>\n<svg viewBox=\"0 0 1180 540\" width=\"100%\" style=\"max-width:1180px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"590\" y=\"22\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#7a5a28\">列名自下而上（卷一，1 → n）　｜　歌頌自上而下（卷二·卷三·卷四，n → 1）</text>\n<text x=\"590\" y=\"42\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#8a7a5e\">每栏之序即歌頌之序；序號即卷一列名之第 N。回頭處即卷一之首。</text>\n\n<text x=\"20\" y=\"86\" font-size=\"14\" font-weight=\"bold\" fill=\"#7a5a28\">天眾</text>\n<text x=\"20\" y=\"106\" font-size=\"11\" fill=\"#8a7a5e\">十二類</text>\n<text x=\"150\" y=\"86\" font-size=\"12.5\" fill=\"#5a5147\">12 妙燄海大自在天王</text>\n<text x=\"150\" y=\"106\" font-size=\"12.5\" fill=\"#5a5147\">11 可愛樂法光明幢（廣果）</text>\n<text x=\"150\" y=\"126\" font-size=\"12.5\" fill=\"#5a5147\">10 清淨慧名稱（遍淨） · 9 可愛樂光明（光音） · 8 尸棄大梵王</text>\n<text x=\"150\" y=\"146\" font-size=\"12.5\" fill=\"#5a5147\">7 自在天王 · 6 善化（須夜摩） · 5 知足（兜率陀） · 4 時分（化樂）</text>\n<text x=\"150\" y=\"166\" font-size=\"12.5\" fill=\"#5a5147\">3 釋迦因陀羅（他化自在） · 2 日天子 · <tspan font-weight=\"bold\" fill=\"#b8863c\">1 月天子</tspan></text>\n<text x=\"700\" y=\"86\" font-size=\"11.5\" fill=\"#8a7a5e\">卷二一句「自大自在起，讫月天子」</text>\n<text x=\"700\" y=\"166\" font-size=\"11.5\" fill=\"#8a7a5e\">↑ 末即卷一首列之「月天子」</text>\n\n<line x1=\"20\" y1=\"192\" x2=\"1160\" y2=\"192\" stroke=\"#e0d6c2\" stroke-width=\"1\"/>\n\n<text x=\"20\" y=\"232\" font-size=\"14\" font-weight=\"bold\" fill=\"#7a5a28\">八部四王</text>\n<text x=\"20\" y=\"252\" font-size=\"11\" fill=\"#8a7a5e\">八類</text>\n<text x=\"150\" y=\"232\" font-size=\"12.5\" fill=\"#5a5147\">8 持國乾闥婆王 · 7 增長鳩槃荼王 · 6 毘樓博叉龍王</text>\n<text x=\"150\" y=\"252\" font-size=\"12.5\" fill=\"#5a5147\">5 多聞大夜叉王 <tspan fill=\"#b8863c\">（頌主，異長行組首）</tspan></text>\n<text x=\"150\" y=\"272\" font-size=\"12.5\" fill=\"#5a5147\">4 善慧威光摩睺羅伽王 <tspan fill=\"#b8863c\">（頌主，異長行組首）</tspan></text>\n<text x=\"150\" y=\"292\" font-size=\"12.5\" fill=\"#5a5147\">3 善慧光明天緊那羅王 · 2 大速疾力迦樓羅王 · <tspan font-weight=\"bold\" fill=\"#b8863c\">1 羅睺阿脩羅王</tspan></text>\n<text x=\"700\" y=\"232\" font-size=\"11.5\" fill=\"#8a7a5e\">卷三序恰反卷一之列（4.2）</text>\n<text x=\"700\" y=\"292\" font-size=\"11.5\" fill=\"#8a7a5e\">↑ 末即卷一首列之「阿修羅王」</text>\n\n<line x1=\"20\" y1=\"318\" x2=\"1160\" y2=\"318\" stroke=\"#e0d6c2\" stroke-width=\"1\"/>\n\n<text x=\"20\" y=\"352\" font-size=\"14\" font-weight=\"bold\" fill=\"#7a5a28\">十九類神</text>\n<text x=\"20\" y=\"372\" font-size=\"11\" fill=\"#8a7a5e\">十九類</text>\n<text x=\"150\" y=\"352\" font-size=\"12.5\" fill=\"#5a5147\">19 示現宮殿主晝神</text>\n<text x=\"150\" y=\"372\" font-size=\"12.5\" fill=\"#5a5147\">18 普德淨光主夜神</text>\n<text x=\"150\" y=\"392\" font-size=\"12.5\" fill=\"#5a5147\">17 遍住一切主方神</text>\n<text x=\"150\" y=\"412\" font-size=\"12.5\" fill=\"#5a5147\">16 淨光普照主空神 <tspan fill=\"#b8863c\">（五言）</tspan></text>\n<text x=\"150\" y=\"432\" font-size=\"12.5\" fill=\"#5a5147\">15 無礙光明主風神</text>\n<rect x=\"118\" y=\"440\" width=\"1040\" height=\"1\" fill=\"#b8863c\" stroke=\"none\"/>\n<text x=\"150\" y=\"458\" font-size=\"12.5\" fill=\"#5a5147\">14 普光燄藏主火神 · 13 普興雲幢主水神 · 12 出現寶光主海神</text>\n<text x=\"150\" y=\"478\" font-size=\"12.5\" fill=\"#5a5147\">11 普發迅流主河神 · 10 柔軟勝味主稼神 · 9 吉祥主藥神 · 8 布華如雲主林神</text>\n<text x=\"150\" y=\"498\" font-size=\"12.5\" fill=\"#5a5147\">7 開華匝地主山神 · 6 普德淨華主地神 · 5 寶峰光耀主城神 · 4 淨莊嚴幢道場神 <tspan fill=\"#b8863c\">（11 偈）</tspan></text>\n<text x=\"150\" y=\"518\" font-size=\"12.5\" fill=\"#5a5147\">3 寶印手足行神 · 2 淨喜境界身眾神 · <tspan font-weight=\"bold\" fill=\"#b8863c\">1 妙色那羅延執金剛神（五言）</tspan></text>\n<text x=\"700\" y=\"352\" font-size=\"11.5\" fill=\"#8a7a5e\">卷三唱 19–15（五類神主）</text>\n<text x=\"700\" y=\"478\" font-size=\"11.5\" fill=\"#8a7a5e\">卷四唱 14–1，線下即折返處</text>\n\n<line x1=\"20\" y1=\"528\" x2=\"1160\" y2=\"528\" stroke=\"#e0d6c2\" stroke-width=\"1\"/>\n</svg>\n<figcaption><b>图 〇-2　倒唱镜。</b>四栏各示一类众之「所列」与「所唱」之序。卷一列名自下而上（天众 1→12、八部四王 1→8、十九类神 1→19），卷二至卷四之歌颂则自上而下（12→1、8→1、19→1），**恰为倒唱**。各栏末端以粗体标出者（<b>1 月天子</b>、<b>1 羅睺阿脩羅王</b>、<b>1 妙色那羅延執金剛神</b>），即卷一首列之第一类——**唱到末尾，正是唱回开头，环自成焉**。<div class=\"en-line\">Fig. 0-2. The reversing mirror. Each register shows a class of beings in the order Book One lists it (ascending) and in the order Books Two to Four chant it (descending) — the chant exactly inverts the list. At the foot of each ladder stands precisely the class named first in Book One: 月天子, 羅睺阿脩羅王, 妙色那羅延執金剛神. The song ends where the list begins; the ring closes of itself.</div></figcaption>\n</figure>\n\n**此图是本节最要紧的一图。** 卷一列名，自执金刚神而历主昼神（神类 1→19）、自阿修罗王而历乾闼婆王（八部 1→8）、自月天子而历大自在天王（天众 1→12）；而卷二、卷三、卷四所唱，**乃一一倒转，从最后一类唱回第一类**。故本品之颂赞，其行如「**下坡**」而非「登阶」：\n\n- **神界十九类**：卷三唱其上端五类（主昼 19 → 主风 15），卷四即接其下端而回收（主火 14 → 执金刚 1）。**两卷合看，是一条不断的下行线**——今日唱主昼，明日便唱到了执金刚；主昼神在卷一是最后一位上首，在全品之颂中却是最先出场。\n- **天众十二类**：卷二一句「自大自在起，讫月天子」，即由色界顶下行至欲界月天子——**由高而低、由静而动**。\n- **八部四王**：卷三之序恰反卷一（4.2）。\n- **唯菩萨一轨不倒**：卷五仍以普贤菩萨起（「以自功德，复承如来威神之力」），十一组菩萨皆承佛威力而颂，终以善勇猛光幢作结。\n\n**〔本文判断〕** 「异生倒唱、同生顺承」非偶然之别。**异生（众生世间、器世间）之颂，是归——由末位唱回本位，如众生还归于其本来；同生之颂，是承——自普贤而次第相续，如菩萨行一一相生。** 且倒唱之极处（卷四末）以五言偈唱「**汝应观法王　法王法如是**」，正落在「法王」二字上；**而卷五开篇第一句，即「佛所庄严广大刹」**——**倒唱唱到法王为止，顺唱自佛所起。** 此说系本文就结构所推，未有注疏明文，不敢断言其为澄观之意。\n\n### 〇之二.3 图 〇-3　解脱门阶道\n\n<figure>\n<svg viewBox=\"0 0 1180 470\" width=\"100%\" style=\"max-width:1180px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"590\" y=\"20\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#7a5a28\">卷三十三門，一門一級；級級相承而不重複</text>\n<text x=\"590\" y=\"39\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a7a5e\">門名悉依 T10n0279 卷三迻錄；左右兩端附卷二組一、卷四組十四之門，以見階之前後</text>\n\n<rect x=\"30\" y=\"52\" width=\"1120\" height=\"176\" fill=\"#f6efe1\"/>\n<text x=\"40\" y=\"74\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#8a6a34\">眾生世間 · 救護（組 1–8）</text>\n<text x=\"120\" y=\"96\" font-size=\"12.5\" fill=\"#5a5147\">自在方便攝一切眾生解脫門 <tspan font-size=\"10.5\" fill=\"#8a7a5e\">（持國乾闥婆王）</tspan></text>\n<text x=\"134\" y=\"120\" font-size=\"12.5\" fill=\"#5a5147\">滅一切怨害力解脫門 <tspan font-size=\"10.5\" fill=\"#8a7a5e\">（增長鳩槃荼王）</tspan></text>\n<text x=\"148\" y=\"144\" font-size=\"12.5\" fill=\"#5a5147\">消滅一切諸龍趣熾然苦解脫門 <tspan font-size=\"10.5\" fill=\"#8a7a5e\">（毘樓博叉龍王）</tspan></text>\n<text x=\"162\" y=\"168\" font-size=\"12.5\" fill=\"#5a5147\">以無邊方便救護惡眾生解脫門 <tspan font-size=\"10.5\" fill=\"#8a7a5e\">（毘沙門夜叉王）</tspan></text>\n<text x=\"176\" y=\"192\" font-size=\"12.5\" fill=\"#5a5147\">以一切神通方便令眾生集功德解脫門 <tspan font-size=\"10.5\" fill=\"#8a7a5e\">（善慧摩睺羅伽王）</tspan></text>\n<text x=\"190\" y=\"216\" font-size=\"12.5\" fill=\"#5a5147\">普生一切喜樂業解脫門 <tspan font-size=\"10.5\" fill=\"#8a7a5e\">（善慧光明天緊那羅王）</tspan></text>\n<text x=\"80\" y=\"90\" font-size=\"0.1\" fill=\"none\">.</text>\n\n<rect x=\"30\" y=\"234\" width=\"1120\" height=\"26\" fill=\"none\" stroke=\"none\"/>\n<text x=\"40\" y=\"252\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#8a6a34\">眾生世間 · 救護（續）</text>\n<text x=\"204\" y=\"240\" font-size=\"12.5\" fill=\"#5a5147\">無著無礙眼普觀察眾生界解脫門 <tspan font-size=\"10.5\" fill=\"#8a7a5e\">（大速疾力迦樓羅王）</tspan></text>\n<text x=\"218\" y=\"256\" font-size=\"12.5\" fill=\"#5a5147\">現為大會尊勝主解脫門 <tspan font-size=\"10.5\" fill=\"#8a7a5e\">（羅睺阿脩羅王）</tspan></text>\n\n<rect x=\"30\" y=\"266\" width=\"1120\" height=\"104\" fill=\"#f0e8d6\"/>\n<text x=\"40\" y=\"288\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#7a5a28\">器世間 · 主神（組 9–12）</text>\n<text x=\"232\" y=\"288\" font-size=\"12.5\" fill=\"#5a5147\">普入一切世間解脫門 <tspan font-size=\"10.5\" fill=\"#8a7a5e\">（示現宮殿主晝神）</tspan></text>\n<text x=\"246\" y=\"312\" font-size=\"12.5\" fill=\"#5a5147\">寂靜禪定樂大勇健解脫門 <tspan font-size=\"10.5\" fill=\"#8a7a5e\">（普德淨光主夜神）</tspan></text>\n<text x=\"260\" y=\"336\" font-size=\"12.5\" fill=\"#5a5147\">普救護力解脫門 <tspan font-size=\"10.5\" fill=\"#8a7a5e\">（遍住一切主方神）</tspan></text>\n<text x=\"274\" y=\"360\" font-size=\"12.5\" fill=\"#5a5147\">普知諸趣一切眾生心解脫門 <tspan font-size=\"10.5\" fill=\"#8a7a5e\">（淨光普照主空神）</tspan></text>\n\n<rect x=\"30\" y=\"376\" width=\"1120\" height=\"52\" fill=\"#e9dcc2\"/>\n<text x=\"40\" y=\"398\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#7a5a28\">世間與佛法（組 13）</text>\n<text x=\"288\" y=\"398\" font-size=\"12.5\" fill=\"#5a5147\">普入佛法及一切世間解脫門 <tspan font-size=\"10.5\" fill=\"#8a7a5e\">（無礙光明主風神）——卷三之末門</tspan></text>\n\n<text x=\"40\" y=\"452\" font-size=\"11.5\" fill=\"#8a7a5e\">階前：卷二組一「法界虛空界寂靜方便力解脫門」（妙燄海大自在天王）　｜　階後：卷四組十四「見如來示現無邊色相身解脫門」（妙色那羅延執金剛神）</text>\n</svg>\n<figcaption><b>图 〇-3　解脱门阶道。</b>卷三十三组之首门，逐级排列。每一级左端缩进递增，如登阶之状；右侧括注领众之名。色带之划分为〔本文判断〕：组 1–8 为八部四王之众生世间，组 9–13 为主神之器世间，组 13 一门独以「佛法」收束。<div class=\"en-line\">Fig. 0-3. The staircase of liberation-gates: the thirteen chief gates of Book Three, one per step, each with the name of its leader. The shading (beings-realm, vessel-realm, and the final gate that reaches the Dharma of the Buddhas) is the editor&#39;s division, so marked.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. **首门与末门，是全品的一对眼目。** 首门「**自在方便摄一切众生解脱门**」——以「众生」起；末门「**普入佛法及一切世间解脱门**」——以「佛法」收。**一十三级门，由众生而渐入其心，终入佛法与世间不二。** 〔本文判断〕\n2. **级级皆「普」「遍」「一切」「无量」。** 门名之构成，几乎全由「普」「灭」「入」「护」「救护」「观察」等**动词**加「一切」「无量」「诸趣」「众生」等**量词**而成——**华严之解脱门，无一是静态的名相，无一不是行做的事**。故澄观《疏》释「解脱门」曰「**能通入彼果用故**」——门者，通也，非居也。\n3. **勿把门名当「境界」读，须当「作用」读。** 「普入一切世间」（主昼神）非谓昼神住于世间，谓其能入；「普知诸趣一切众生心」（主空神）非谓其已知，谓其知之——**故经文皆用「得」。得者，得此行用也。**\n\n### 〇之二.4 四景速写：卷一诸众之末，皆「皆」字起\n\n读此品至卷一，四百一十二名号如走马灯，读者易苦。**然卷一之文，有一大奇：每一众之末，皆以总括词收束——「皆」「悉」「莫不」「咸」「无不」。** 略取数例（皆依卷一原文，未改一字）：\n\n> **神（十九类之末句）：**\n> 「恆發大願，願常親近供養諸佛」——執金剛神。\n> 「皆於往昔成就大願供養承事諸佛」——身眾神。\n> 「親近如來隨逐不捨」——足行神。\n> 「皆從往昔發深重願」——主地神。\n> 「皆於諸法得清淨眼」——主山神。\n> 「心皆離垢廣大明潔」——主空神。\n> 「皆勤散滅我慢之心」——主風神。\n> 「皆能示現種種光明，令諸眾生熱惱除滅」——主火神。\n\n> **天（十二类之末句）：**\n> 「皆勤觀察無相之法所行平等」——大自在天王。\n> 「皆具大慈憐愍眾生，舒光普照令其快樂」——大梵天王。\n> 「皆住廣大寂靜喜樂無礙法門」——光音天王。\n> 「悉已安住廣大法門，於諸世間勤作利益」——遍淨天王。\n> 「莫不皆以寂靜之法，而為宮殿安住其中」——廣果天王。\n> 「皆勤修習自在方便廣大法門」——他化自在天王。\n> 「皆勤顯發眾生心寶」——月天子。\n\n**一处也省不得。** 十九类神中，**十有一类之末句含「皆」字**；天众十二类，**无不以「皆勤」「皆具」「皆住」「悉已」「莫不皆」起句**；八部四王八类，亦无不以「悉已」「皆勤」「莫不勤力」起句。**〔本文判断〕华严写众，用一「皆」字便把无量众生同时收摄——四十类众、四百一十二名号，于经文只是一句「皆」。这一个字，正是本品的文气所在：它不数，它「皆」。**\n\n> **EN corresponding · Four Landscapes in a Glance.** Book One lists four hundred and twelve names, and closes each class with a collective term — 皆 (all), 悉 (entirely), 莫不 (none does not), 咸 (all). Among the nineteen deity-classes eleven such lines contain 皆; among the twelve heavenly classes every one opens with a collective term. Huayan does not count the multitudes: it says \"all.\" That single word is the chapter&#39;s own rhetoric.\n\n### 〇之二.5 五种读法（导览）\n\n| 读法 | 路径 | 适合谁 | 得什么 |\n|---|---|---|---|\n| **顺读** | 卷一 → 卷五（名 → 行 → 颂） | 初读本篇者 | 先得「名」之全貌，再追「门」之踪迹 |\n| **环读** | 卷四 → 卷二（循倒唱之环上行） | 已读一遍、欲见其结构者 | 见识「列名与歌颂互为倒序」之环 |\n| **景读** | 天（卷二）→ 八部与神（卷三·卷四）→ 菩萨（卷五） | 欲专看某一类众者 | 得三世间之全貌（如图 〇-1） |\n| **门读** | 只取每组之首门，不读偈 | 欲先见纲领、后求文采者 | 得一十三级之阶道（如图 〇-3） |\n| **偈读** | 只读各组首偈与末偈（527 颂中取 78） | 已通大意、欲玩其文者 | 见颂体之变：七言为主，五言仅二处 |\n\n**读法之外，尚有二事须先知：**\n\n- **卷一无颂。** 全品五百二十七颂，卷一不出颂——**卷一只是点名。** 故凡读本品，**卷一宜快览、卷二以下宜细读**。\n- **卷五之颂最晚出，却最阔。** 前四卷所颂，皆一众一颂之细；而卷五末之供养云，则云「此诸世主，一一皆现不可思议诸供养云，雨于如来道场众海」，直与卷一「众海云集」相应——**开卷云集，结卷供养；起于名，终于礼。** 〔本文判断〕\n\n---\n\n## 一、底本与校勘\n\n### 1.1 版本源流\n\n八十华严全称《大方广佛华严经》，八十卷，三十九品，唐于阗国三藏沙门实叉难陀译。就本篇所用卷第一至卷第五而言，其文本谱系如下：\n\n| 层 | 文献 | 说明 |\n|---|---|---|\n| 译本底本 | `T10n0279` 八十华严（实叉难陀译，唐） | 本篇逐句疏解的依據；**校勘底本**（本品在入法界品之前，故**八十本为叙事主轴**） |\n| 本项目用书 | 台湾大华严寺《八十华严》袖珍版（繁／简） | 依《大正藏》为底本，參華严学苑刊本、磧砂本、高麗藏本 |\n| 对读本·汉译 | `T09n0278` 六十华严（佛驮跋陀罗译，晋） | **辅读与对读**（本品主轴为八十本；六十本无同名之品，其对应段见附录五） |\n| 对读本·长远 | `T10n0293` 四十华严（般若译，唐） | **全经仅入法界品**，故本品无其对应段；待入法界品开读时作主轴 |\n| 对读本·他语 | 梵译、藏译，及相关别译／单行本／眷属经 | 品读涉及者一并辅读；藏译列入长远规划 |\n| 会读材料 | 海云继梦《华严经经首》开示（29 集）、世主妙严品卷二至卷五讲记 | 现代传承解，属会读材料 |\n\n### 1.2 底本核验（本文实测）\n\n本篇开写之前，先以 CBETA `T10n0279` 核验袖珍版文字，核验结果如下（核验日 2026-09-28）：\n\n> **卷首比对。** CBETA 作「如是我聞：一時，佛在摩竭提國阿蘭若法菩提場中，始成正覺。其地堅固，金剛所成；上妙寶輪，及眾寶華、清淨摩尼，以為嚴飾；諸色相海，無邊顯現……」袖珍版简本作「如是我闻.一时佛在摩竭提国阿兰若法菩提场中始成正觉。其地坚固金刚所成.上妙宝轮及众宝华清净摩尼以为严饰.诸色相海无边显现……」，**逐句吻合**，惟标点与字形（瑠璃→琉璃、踈→疏、輝→晖、乾闥婆→干闼婆等）依该版体例有异。\n\n<details class=\"fold quote-fold\"><summary>📌 考据札记 · 「摩訶迦羅道場」之名证否（历三检）…</summary>\n> **「摩訶迦羅道場」之名，证其不见于经与历代注疏**（本批新考，2026-09-30）。八十华严卷首「一時佛在摩竭提國阿蘭若法菩提場中始成正覺」一句，世有以为八十华严当作「摩訶迦羅道場」者。经三道检验，**此名不可据**：\n>\n> 1. **原典检索（`T10n0279` 及本项目三版）**：CBETA `T10n0279` 全文检索，「摩訶迦羅」**0 见**，「摩竭提」**9 见**。本项目所藏八十华严三版（`T279`／袖珍版繁／袖珍版简）卷二区间逐字检索，「摩訶迦羅／摩诃迦罗／摩竭迦羅／摩竭伽羅」四形**0 见**。全库 1,292 件（96 MB）文本扫描，四形**0 见**——含海云继梦法师讲记 645 篇在内。\n> 2. **两译本用词对照**（三经卷首实勘）：八十华严作「**摩竭提國阿蘭若法菩提場中**」；六十华严（`T09n0278`）作「**摩竭提國寂滅道場**」；四十华严（`T10n0293`）卷一九唯作「**閻浮提摩竭提國菩提場中**」。三译**无一称「摩訶迦羅」**。\n> 3. **历代注疏实检**（本批新获，见 8.7）：澄观《新译华严经七处九会颂释章》（`T45n1738`）作「**第一會在摩竭提國（此云不害國）菩提場樹王之下**」；澄观《华严经疏》（`T45n1735`）作「初會菩提場」；皇龙寺释表员《华严经文义要决问答》（`X37n0237`）作「第一會，佛在蓮華藏莊嚴世界海**摩竭提國菩提場中**」——《华严经三十九品大意》（`X42n0242`）作「初會菩提場」；今人工具书《佛学大辞典》及维基百科「华严经」条亦作「（初会）菩提场（寂灭道场）」。**诸家一律作「菩提场」，无一作「摩訶迦羅道場」。**\n>\n> **〔订正〕`T45n1738` 之作者须分辨。** 该书**正文署「清涼山大華嚴寺沙門澄觀撰述」，卷首《释章序》则署「沙門典壽謹撰」**——部分目录（CBETA 检索页、Zensoul、deerpark）取序作者为作者而题作「典寿」，实属目录之误；维基文库题作者澄观可证。旧记「撰于《疏》前」**不成立**：其序明言「书仅一萬三千餘言，**較之疏鈔不及百之一**」，预设《疏》《钞》已在，故当在《疏》之后。**本文一律作「澄观《颂释章》」。**\n>\n> **判定。** 「摩訶迦羅道場」**不见于三经本文，亦不见于澄观以下历代注疏与会处判摄之文**，本文**不采用**此名，正文一律作「**摩竭提國阿蘭若法菩提場**」（八十华严语）、「**菩提場**」（会处简称）。\n>\n> **讹传来源之推断。** 「摩訶迦羅」（Mahākāla，汉译「大黑天」）为印度—中亚密教护法／本尊之名，本项目藏经中亦有其名（如六十华严「大黑」1 见、四十华严讲记「大黑天」9 见），然其语境**皆属密教神明，与佛成道场所无涉**。本文按语：**此名或系将「摩竭提」（Magadha，此云不害国）与密教「摩訶迦羅」／大黑天一名混同所造**——〔**存疑：属本文推断，无直接文献可据**〕。惟「讹传确有之」之前半（不见于经与历代注疏）已由上列三重检验坐实，与后半之推断应分别看待。\n>\n> **本条订正之影响。** 澄观《七处九会颂释章》原文本批已获，故前记「本项目既未获得澄观《疏》原文可核，暂不强断」之**保留态度予以撤除**，改如上判定。惟「摩竭提國菩提場」与「蓮華藏世界海摩竭提國菩提場中」（表员所说，谓初会亦通华藏）之**圆融读法**，仍依澄观「染淨二土鎔融相攝」四门说，本文 8.7 引之，**此处不作强断**。\n</details>\n\n> **品卷数之订正。** 本品跨经卷第一至第五，共五分（第一之一至第一之五），品末有「大方廣佛華嚴經卷第五竟」。本项目 `data/translation/avatamsaka_studies.yaml` 旧记本品「经文：卷一–三（约三卷）」，**有误，应作卷一至卷五**，本批已源头订正。\n\n### 1.3 袖珍版编者按五处（非经文，已析出）\n\n袖珍版于卷一正文间插编者括注五处，标目为「（以上介绍异生众中的……）」，用以标明所列名号之归属与计数。经核 CBETA `T10n0279`，**此五处括注不见于 CBETA**，故属该版编者所加，本文一律标「〔袖珍版编者按〕」。其计数经本文逐一验算如下：\n\n| 括注位置 | 类别 | 组数 | 每组名号 | 小计 |\n| --- | --- | --- | --- | --- |\n| 卷一 | 杂类诸神众 | 19 组 | 10 | 190 |\n| 卷一 | 八部四王众 | 8 组 | 10 | 80 |\n| 卷一 | 欲界天七众 | 7 组 | 10（其中月天子 11） | 71 |\n| 卷一 | 色界天五众 | 5 组 | 10（其中光音天王 11） | 51 |\n| 卷一 | 菩萨摩诃萨上首 | — | 20 | 20 |\n|  |  |  | **合计** | **412** |\n\n验算：190 + 80 + 71 + 51 + 20 = 412，与编者按「总共是 412 位」相符\n\n### 1.4 经题详解：「大方广佛华严经」七字与大意\n\n<figure style=\"margin:14px 0 20px;text-align:center\">\n<img class=\"doc-img\" src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Vairocana_from_Cave_25%2C_Yulin_Caves.jpg/960px-Vairocana_from_Cave_25%2C_Yulin_Caves.jpg\" alt=\"榆林窟第25窟：毗卢遮那佛（题「清净法身卢那舍佛」）\" loading=\"lazy\">\n<figcaption style=\"font-size:.78em;color:var(--text2);line-height:1.85;max-width:760px;margin:6px auto 0\">\n图 1-1　榆林窟第25窟主室东壁·毗卢遮那佛（榜题「清净法身卢那舍佛」）——可作经题「大方广佛华严经」中「佛」字所显法身（毗卢遮那）之图像参证。约9世纪·吐蕃统治期（中唐）。<br>\n<div class=\"en-line\" style=\"font-size:.95em\">EN — Vairocana labelled “Pure Dharmakāya Rocana Buddha”, Yulin Cave 25 — a visual counterpart for the Dharma-body Lord of this very title. c. 9th c., Tubo period.</div>\n图源：Wikimedia Commons（公有领域）；详目与著录见文末〔▲实证文物〕「榆林窟第25窟（yulin-cave25）」。\n</figcaption>\n</figure>\n\n> **【信度声明·本节标题与下节讲师之别，务请留意】** 本节所论者为**经题**——即全经总名「大方广佛华严经」七字之训释。**海云继梦法师所反复讲说者，名曰「经首」而实非经题**（「经首」二字系法师**自取之名**），所指为八十华严卷第一世主妙严品开篇那一千余字「如是我聞，一時佛在摩竭提國……」（即各会之开篇经文），**非经题七字之逐字拆解**。二者层级不同，本篇严格分开，详见本节末（乙）小节。〔本批核查：卷一讲记《01华严经经首》全篇 314,288 字中**无一处**逐字拆解「大／方／广／佛／华／严／经」七字，其所讲者为经文义理与果地境界。〕\n\n> 本节依澄观《大方广佛华严经随疏演义钞》（`T36n1736`）开卷「总释经题」一门逐字取义，并参以经文本身；所引疏文皆标明卷次出处，可回查 CBETA。\n\n经题全称「**大方广佛华严经**」七字。澄观疏于「题称大方广佛华严经，即无尽修多罗之总名」下，标此为**无尽修多罗之总名**——谓「若从略至广，展演无穷，难思教海不离七字」；品名「世主妙严品第一」则为**众篇义类之别目**。一经一品，总别相对，故经题统摄全经三十九品。\n\n**（一）七字之六对。** 澄观疏列经题七字为六对，谓「此七字，略有六对」：\n\n| 对 | 关系 | 说明 |\n| --- | --- | --- |\n| 一 | **经字是教**，上六字是义 | 教义一对 |\n| 二 | **严字是总**，上五是别 | 总别一对 |\n| 三 | **华为能严**，上四皆所严 | 能所一对 |\n| 四 | **佛是所严所成之人**，上三皆所严之法 | 人法一对 |\n| 五 | **广者是用**，上二皆体 | 体用一对 |\n| 六 | **方者是相**，大者是性 | 性相一对 |\n\n**（二）七字皆大——七大性。** 澄观疏总摄七字为「**七字皆大，七字皆相等**」，而分属七大之性，即**体大、相大、用大、果大、因大、智大、教大**。此七大之对照如下：\n\n| 字 | 所当之性 | 澄观疏所举经证 | 疏文大意 |\n| --- | --- | --- | --- |\n| **大** | **体大** | 《涅槃经》「所言大者，其性广博犹如虚空」；本经「法性遍在一切处，一切众生及国土，三世悉在无有余」 | 二义：**旷兼无际**（包含＋广遍）、「常」（竖论恒常） |\n| **方** | **相大** | 本经「凡夫无觉解，佛令住正法。诸法无所住，悟此见自身」 | 二义：**正**（恒沙性德无偏伪）与**法**（皆可轨持） |\n| **广** | **用大** | 本经「金刚围山数无量，悉能安置一毛端」 | 二义：能**包**（一尘受世界之无边）、能**遍**（刹那弥法界而无尽） |\n| **佛** | **果大** | — | 二义：**能觉**（佛陀＝觉者）、**所觉**（上方广之玄妙境，即真谛） |\n| **华** | **因大** | 本经「若见花开，当愿众生神通等法如花开敷」 | 二义：**感果华**（喻万行因而成佛果，如莲花因果交彻）／**严身华**（喻诸位功德必与位俱） |\n| **严** | **智大** | — | 二义：以**万行饰本体**（如瑩明镜）／以**万行功德成佛果人**（如琢玉成器、铸金成像） |\n| **经** | **教大** | — | 四义而实二：唯**贯**、**摄**二。「贯玄凝之妙义」（总就别、别贯华严玄妙义）、「摄无边之海会」（摄此经众）、「作终古之常规」（常恒之说） |\n\n**（三）本经之殊胜（澄观疏语）。** 澄观疏称此经「**犹杲日丽天，夺众景之曜**」（喻智明映夺，他经失其光）、「**须弥横海，落群峯之高**」（喻高胜难齐）。又引普贤语善财云「**我法海中未有一文一句，非是舍施无量转轮王位而求得者**」，以显此经无一字非菩萨行所成。疏又述龙树入龙宫得此经、诸师「一文一句竭海墨而莫书，一偈一光破地狱之剧苦」等，皆为述经之胜。\n\n> **EN corresponding · §1.4 The Title and Its Seven Characters.** The full title of the scripture, *Da fang gu fo hua yan jing*, comprises seven characters that Huayan explains exhaustively in his commentary. He groups them into six pairings (teaching/meaning; universal/particular; adorner/adorned; person/law; function/substance; form/nature) and then into **seven greatnesses**—the seven characters are each 「great」, corresponding respectively to **substance** (体大, 大), **form** (相大, 方), **function** (用大, 广), **fruition** (果大, 佛), **cause** (因大, 华), **wisdom** (智大, 严), and **teaching** (教大, 经). The title is thus 「the general name of the endless śūtras」 while the chapter name 「Adornment of the World-Lord」 is 「the particular name distinguishing the classes of meaning.」\n\n**（四）品名「世主妙严」之义（澄观疏）。** 澄观疏释品名，分「世主」与「妙严」两层：\n\n- **世主**：「世谓世间，即三世间——众生世间、器世间、智正觉世间；主谓君主。」**佛及诸王、地神水神、林神山神**为器世间主；**天王龙王、夜叉王**等为众生世间主；**如来**为智正觉世间主，亦「总化上二、遍统前三，故云并称世主」。\n- **妙严**：「法门依正俱曰妙严。」此严亦说三种世间法门为能严而唯局于主；**依正所严通三世间**——诸世间主各得法门自严己众（众生世间严），佛成正觉是自法门（智正觉世间严），其地金刚所成、众宝華严饰（器世间严）。「三世间严并胜余教，故标妙严以为品目。」\n\n> **EN corresponding · §1.4 The Chapter Name.** Huayan explains 「world-lord」 as the Buddhas and kings together—deities of the earth, water, forest and mountains as lords of the 「vessel world,」 heavenly and nāga kings as lords of the 「beings world,」 and the Tathāgata as lord of the 「knowledge and correct-awakening world,」 with the Buddha 「totally transforming the first two and comprehensively presiding over all three, hence the joint name.」 「Subtle adornment」 means that **both the ruler and the ruled are adorned**: the various lords each attain Dharma-gates by which they adorn their own retinue, and the Buddha's own realization, land, and jeweled ornaments constitute the adornment of all three worlds, 「surpassing all other teachings, hence the chapter is named Adornment.」\n\n**（五）现代讲者之对照：海云继梦法师讲经题。** 海云法师于**多部**讲记中释此七字经题（非专就本品的「经首」讲记），其说与澄观疏可相互参照。依凡例七之二，以下俱存其原貌、标明出处；其中与澄观疏不尽合处，标〔存疑待查〕而不代为改订。\n\n- **一分为二：境界与能力。** 海云法师将经题分作两半，云：「首先可以将经题分成两个部分来谈，一个是『大方广』、一个是『佛华严』。**『大方广』是境界，『佛华严』是能力**，也就是说要我们用『佛华严』的能力来进入『大方广』的境界。再把这样的过程记录下来，贯穿起来成为一个系统就称之为『经』。」（《净行品讲记·智慧行》）〔出处：`docs/huayanhai/华严云海/浩瀚华严海/八十华严之11品净行品/净行品讲记-智慧行/华严经净行品讲记-智慧行_1.txt`〕\n- **「大方广」＝体相用。** 云：「『大方广』三个字就是**体、相、用**的意思。**体是本体、相是相貌、事相、现象，广则是作用、妙用**的意思。从体即能产生种种相貌，发挥种种妙用。」（同上）另在《四十华严》讲记中亦云：「『大方广』，**大表示本体；方表示相，无所不在，一切相都是；广表示用，无所不用，就是体相用的意思**。那么『大方广』呀，意思就表示无所不在。」（《四十华严第一卷》第 16–28 讲）〔出处：`docs/huayanhai/华严云海/浩瀚华严海/四十华严-北京广化寺2006-2009/听录版/四十华严第一卷（第16-28讲）_1.txt`〕\n- **「佛华严」＝果因律。** 云：「『佛华严』啦，也是三个字，**佛是果，华是因，所以华严讲的是果因律**。果先立，然后因要去行。佛是果嘛，他叫做**万德庄严**。万德庄严怎么来呀？来自于华，华是因，因叫做**万华因福**……那你要统统铺开来，要去做，叫做『**法门无量誓愿学**』。」（《四十华严第一卷》第 16–28 讲）\n- **会归一句。** 云：「那么这个经，《大方广佛华严经》就是把你生命中体验的东西呀，**体相用的这些境界呀，透过果因律的行法来，把它串连在一起**，这个叫做《大方广佛华严经》，简称《华严经》。」（同上）\n- **智顗之“九旬谈妙”为参照。** 法师开讲引天台智顗故事云：「以前有一位智者大师是天台宗的集大成者，他光是讲《妙法莲华经》的『妙』字，就讲了**九十天**，人称『**九旬谈妙**』。现在我们要谈《大方广佛华严经》，光这个『大』字就无量无边了。」（《净行品讲记·智慧行》）〔按：智顗「九旬谈妙」见天台教典通传，法师此说与「妙」字讲九十日之通说合，〔存疑待查〕其具体出处。〕\n- **会通六科。** 法师于《华严经教与行法》复申其义，云：「**大方广佛华严经，这个名字就是真理**……那后面还有一个，**华严海会佛菩萨**，这意思就是听到大方广佛华严经这些人通通都是华严海会佛菩萨。」（《华严经教与行法》第 08 讲）〔出处：`docs/huayanhai/华严云海/华严演六科/华严六科之华严经教与行法/华严经教与行法08_1.txt`〕\n\n> **两说之合观（本文按语）。** 海云法师所云「大方广＝体相用、佛华严＝果（佛）因（华）」，与澄观疏「大方广＝体相用、佛＝果大、华＝因大」之分解**大体吻合**，足见古今解经题者所见相契；其别在于，澄观于「佛华严」兼释「严」为智大、以「经」为教大，而法师以「严」取「严饰、庄严」之义、以「经」为「体相用境界经果因律行法串连而成」之义。二说可相为补充：澄观偏重**名相之德相与大性**，法师偏重**境界与能力之行用**。〔存疑待查〕法师云「智顗讲妙字九十日」一节，其具体出处俟考。\n\n> **EN corresponding · §1.4 The Modern Reading (Venerable Haiyun).** Venerable Haiyun Jimeng (海雲繼夢) explains the title in his lectures by dividing it into two halves: 「大方廣」 is the **realm**, 「佛華嚴」 the **capacity**—one enters the realm of the former by means of the latter. He glosses 「大方廣」 as **substance–form–function** (大＝substance, 方＝form, 遍在一切相, 廣＝function, 無所不用), and 「佛華嚴」 as the **fruit-cause principle** (果因律): 佛 is the **fruit** (萬德莊嚴), 華 the **cause** (萬華因福), to be practised as 「法門無量誓願學」. This broadly accords with Huayan's own analysis of the seven characters into the seven greatnesses. Venerable Haiyun's treatment, however, emphasizes the **realm and its practical capacity**, where Huayan's emphasizes the **adorned virtues and their great properties**; the two readings complement each other.\n\n**（乙）「经首」与「经题」之别——本批新考，务请后学留意（〔重要〕）**\n\n本项目 `docs/huayanhai` 藏海云继梦和上开示 645 篇，其中**世主妙严品卷一有一专讲，名《华严经经首》**（二十九集）。经全库检索与逐段核读，其与本篇 1.4「经题详解」**所指全然不同**，二者极易混淆，故特为析出：\n\n| | **经题** | **经首** |\n| --- | --- | --- |\n| **所指** | 全经总名「大方广佛华严经」七字 | 八十华严卷一（及七处九会各会）开篇之经文 |\n| **经文范围** | 无（属题名，非经文） | 卷一「如是我聞。一時佛在摩竭提國阿蘭若法菩提場中……」，约一千余字 |\n| **性质** | 名相训释（依澄观疏「总释经题」） | 经文义理与果地境界的开示 |\n| **海云法师处理** | 于《净行品讲记》《四十华严》讲记、《华严经教与行法》等**多部**讲记中分论 | **专讲二十九集**，反复申说「『经首』这名字是我给它取的」 |\n\n法师原语（第一集）：\n\n> 「我们今天要跟各位再讲《经首》的部分，**这个『经首』这名字是我给它取的**，是群经之首，是所有经典它排在最前面的地方。那么我们从《八十华严》这个地方所摘录出来的大概有一千多个字，是最重要的一段。《华严经》里头有所谓七处九会，每一会都有它的《经首》。」\n\n法师于该讲记中所标举之旨趣，可与本篇 1.4 互参而**不可相混**，如云：\n\n> 「《经首》是佛境界，**《心要法门》是成佛之道的一个芯片**。」\n\n> 「《华严经》把佛境界标出来就在最高的地方。从这里往下看下来，所以叫作不共别……**华严一定从果地讲下来，他不是从因地讲上去，经首是最明显的。**」\n\n**〔本批核查结论〕** ①「经首」为**法师自取之名**，非经中既有术语，此点经其本人明言；② 卷一讲记全篇**无一处**逐字拆解经题七字，故本篇 1.4 标「依澄观疏」而不标「依海云讲记」；③ 法师于**《西安草堂寺八十华严导读》第 02 讲》**中另就经文结构言七处九会云：「**因为他每一会里头都有一段经首。而这一会的经首就在《世主妙严品》上面，所以他们把这个部分并为一会**」，与澄观《七处九会颂释章》初会判摄可相印证，此则**确属经结构层面之「经首」用法**，与 1.4 之「经题」无涉。\n\n出处：卷一讲记 `docs/huayanhai/华严云海/浩瀚华严海/八十华严之01品世主妙严品/01华严经经首_1.txt`；导读第 02 讲 `docs/huayanhai/华严云海/浩瀚华严海/八十华严导读-西安草堂寺201005/听录/八十华严导读02_1.txt`。\n\n> **EN corresponding · §1.4(b) Scriptural Head (jīngshǒu) vs. Title (jīngtí).** These two must not be confused. The **title** is the seven-character name *Da fang gu fo hua yan jing* itself (§1.4 above). The **「scriptural head」** (jīngshǒu) is the opening passage of the scripture—Venerable Haiyun's twenty-nine-lecture set on it covers the first thousand-odd characters of fascicle one, from 「如是我聞，一時佛在摩竭提國阿蘭若法菩提場中，始成正覺」 onward, describing the Buddha's realization and the adornment of the bodhimaṇḍa. Venerable Haiyun states expressly that 「jīngshǒu」 is **a name he himself coined** (「這個『經首』這名字是我給它取的」), and the term does not occur in the scripture. Note further that in his lecture on the scripture's structure (Xian Trail Temple, 2010) he uses 「jīngshǒu」 in the technical sense of **each of the seven places/nine assemblies having its own opening section**, the first of which falls in this very chapter—a usage that corroborates Huayan's placement of the first assembly but is wholly distinct from the question of the title's seven characters.\n\n### 1.5 三版用字交叉校勘（T279／袖珍版繁／袖珍版简）\n\n> 本节依用户「用字多版本交叉检查」之嘱，以 CBETA 大正藏 `T10n0279`（以下简称「T279」）与本项目所用台湾大华严寺《八十华严》袖珍版繁／简两种，**就本篇所引卷一至卷五范围内的关键词逐词作出现次数比对**。凡三版用字不同者（下表），或属袖珍版编者之**统一改字**，或属**繁简转换**之自然差异，本文均如实标出，供读者覆核。\n\n<details class=\"fold table-fold\"><summary>📋 表·词／词形…（11 行）</summary>\n| 词／词形 | T279 | 袖珍繁 | 袖珍简 | 性质判读 |\n| --- | --- | --- | --- | --- |\n| **瑠璃**／**琉璃** | 瑠璃 72 | 琉璃 78 | 琉璃 78 | **袖珍版统一改「瑠→琉」**（凡例七所述体字俗字之一）；T279 作「瑠璃」，异体字改。 |\n| **覩**／**睹** | 覩 65 | 睹 62 | 睹 62 | **袖珍版统一改「覩→睹」**。 |\n| **踈**／**疏** | 踈 4 | 疏 12 | 疏 12 | **袖珍版统一改「踈→疏」**。 |\n| **輝**／**晖** | 輝 7 | 輝 3 | 晖 2 | **繁本存「輝」、简本作「晖」**——属**繁简转换之自然差异**（简体字库取「晖」），非版本歧异；如「含輝發焰」简本作「含晖发燄」。 |\n| **徧**／**遍** | 徧 2／遍 1261 | 遍 1198 | 遍 1198 | 通行作「遍」，T279 偶存「徧」，袖珍版一并作「遍」。 |\n| **毘盧**／**毗卢** | 毘盧 124 | 毘盧 124 | 毗卢 0 | **本篇以「毘卢遮那」为固定译名**（T279、繁本同作「毘盧」），简本从俗作「毗卢」。 |\n| **尸棄**／**尸弃** | 尸棄 4 | 尸棄 6 | 尸弃 6 | 简繁自然差异（棄→弃）。 |\n| **優曇**／**优昙** | 優曇 6 | 優曇 6 | 优昙 6 | 简繁自然差异。 |\n| **閻浮**／**阎浮** | 閻浮 185 | 閻浮 177 | 阎浮 177 | 简繁自然差异。 |\n</details>\n\n**一处版本用字之异（供覆核）。** 全文校读另见：T279 卷二诸颂前多作「**承佛威神**」（如「爾時，自在天王，承佛威神，遍觀一切自在天眾而說頌言」），而袖珍版作「**承佛威力**」。本篇行文依凡例七从袖珍版作「承佛威力」，然 T279「威神」之说见于经文原貌，二者或为同义互用、抑或版本异文，**〔存疑待查〕**——俟校勘诸本（磧砂本、麗藏本）后定其是非，本篇并存两说而从袖珍版行文。\n\n> **说明。** 本节所列各词之出现次数，系以程式就三版文本在本篇所引卷一至卷五范围内逐词检索统计所得；**次数之差（如瑠璃 72 ↔ 琉璃 78、覩 65 ↔ 睹 62）表明袖珍版除统一改字外，另有少量增删或重出，非本文所能尽考，暂〔存疑待查〕。**\n\n### 1.6 本批校勘记（T279 回源，卷一至卷五 41 处引文）\n\n依编务原则「原文是什么语言 T279` 卷二众名之「涌／踴」等字，已按 `T279` 用字回填（「毘摩質多羅阿脩羅王」「涌、遍涌、普遍涌」），惟其梵名对应〔待核〕。法界品以下各品回源待续。\n\n---\n\n## 二、卷第一　世主妙严品第一之一（经首）\n\n<figure style=\"margin:14px 0 20px;text-align:center\">\n<img class=\"doc-img\" src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8a/%E6%B5%99%E6%B1%9F%E7%9C%81%E6%9D%AD%E5%B7%9E%E5%B8%82%E7%81%B5%E9%9A%90%E5%AF%BA%E7%9F%B3%E7%AA%9F%E5%8D%A2%E8%88%8D%E9%82%A3%E4%BD%9B%E4%BC%9A%E6%B5%AE%E9%9B%95.jpg/960px-%E6%B5%99%E6%B1%9F%E7%9C%81%E6%9D%AD%E5%B7%9E%E5%B8%82%E7%81%B5%E9%9A%90%E5%AF%BA%E7%9F%B3%E7%AA%9F%E5%8D%A2%E8%88%8D%E9%82%A3%E4%BD%9B%E4%BC%9A%E6%B5%AE%E9%9B%95.jpg\" alt=\"杭州飞来峰第5龛：卢舍那佛会浮雕（本尊居中、文殊普贤与会众环侍）\" loading=\"lazy\">\n<figcaption style=\"font-size:.78em;color:var(--text2);line-height:1.85;max-width:760px;margin:6px auto 0\">\n图 2-1　杭州飞来峰第5龛·卢舍那佛会浮雕（北宋乾兴元年 1022，胡承德造）——本品开卷「道场·佛身·会众」三重结构的北宋典范：本尊卢舍那居中说法，文殊骑狮、普贤骑象，四菩萨、四天王及龛外二飞天环侍（共十七身）。<br>\n<div class=\"en-line\" style=\"font-size:.95em\">EN — Vairocana assembly relief, Feilaifeng niche 5, Hangzhou (1022) — the Northern-Song model of the chapter’s opening triad: bodhimanda, Buddha-body, and assembly.</div>\n图源：Wikimedia Commons（CC BY 4.0）；详目与著录（含「说法状／智拳印」两说）见文末〔▲实证文物〕「飞来峰第5龛（feilaifeng-cave5）」。\n</figcaption>\n</figure>\n\n> 本卷为全经第一卷，亦为「第一会」之开场。经文分两大段：前半叙所证之境（道场、佛身），后半列所会之众（菩萨、诸神、诸天）。澄观判此品属「所信因果」之「信」位，谓佛之功德不自陈，藉世间诸众各以所证之境来显，故名「世主妙严」——世主之言，正由众出。〔详见 2.3、3.16〕\n\n### 2.1 序分：如是我闻\n\n> **经文**　如是我聞。一時佛在摩竭提國阿蘭若法菩提場中始成正覺。\n\n**疏解**　此十三字，为全经之纲，亦为一切经首之常。三重限定：\n\n其一，**「如是我闻」**——非谓佛自述，乃结集者明所闻为亲闻。设教所重在此四字，欲使后学者知此地所传乃亲传实行，非传闻、非推断。\n\n其二，**「一时」**——非谓片时，谓某一特定之机。华严以此「一时」为摄法之要：下文无量刹海、无量众生会聚一处，皆系于此一时。\n\n其三，**「佛在摩竭提国阿兰若法菩提场中始成正觉」**——**此十三字为化有事相，非法身境界**。盖「佛在」为所依，「始成正觉」为所证，事相宛然，是为化身海中之事相；而华严所称之境界，在果位、在法身、在一念之间悉包法界者。二者非异而层次有别：事相为门，法身为所入。读此品者，若止于认境之庄严而不透事相，则止于化门，未及华严。\n\n海云继梦法师于此有一警语：华严经中所说多为法身境界，然**此一句是化身境界**；化身属有为法，有为法中所现者即「历事练心」之事相，须透过此事相转入法身。若执「心佛众生始终同」而谓不必修，便是**未透过有为法之关**。\n\n**名相**\n\n- **摩竭提国**：Magadha，摩揭陀，中印度，佛陀生地与成道所在。此「菩提场中」即佛陀于伽耶（Gayā，梵名「苦行林」）成道之场；然经中于摩竭提国内另标「阿兰若法菩提场」，二者是否为同一处所，或为佛陀于不同所成道而后定名此场，本篇未获澄观《疏》原文可核，〔待核〕。\n- **阿兰若法**：`āraṇyavacana-dhātu`，远离喧嚣之林野静居。「阿兰若」为 `āraṇya`（森林、旷野）之音译，「法」者，`dhātu`，世界、境界、要素。华严以「阿兰若法」为佛所住之世界类别，与「室罗伐城逝多林给孤独园」（化城喻）之「化法」相别：前者是「法住之境」，后者是「化现之场」。\n- **菩提场**：`bodhimaṇḍa`，正觉道场。梵 `bodhi`（觉）＋`maṇḍa`（圓场、壇）。中国译「道场」。\n\n> **EN corresponding · 2.1 The Opening Formula**\n>\n> \"Thus have I heard. At one time the Buddha was at Bodhimaṇḍa, the Bodhimaṇḍa of the Āraṇyavacana-dhātu in the kingdom of Magadha, where he first attained enlightenment.\"\n>\n> Three qualifiers are compressed into this one line. First, *evam mayā śrutam* — thus have I heard — is the compiler's assurance of direct hearing rather than report or inference. Second, *ekasmin samaye* — at one time — marks not a fleeting moment but a single defining occasion; the innumerable Buddha-lands and beings gathered below all depend on this one \"occasion.\" Third, and decisively for reading the rest of the chapter, the clause describing the Buddha's enlightenment is a description of a **form-body event** (nirmāṇarūpa), not yet of the dharmakāya. \"The Buddha was at…\" gives a location; \"first attained enlightenment\" gives an attainment. Both are 事相, concrete events — and in the Huayan idiom, 事相 is the gate, not the goal. The reality this chapter is actually describing lies beyond them: it is \"in a single instant, all dharmadhātus are encompassed.\"\n>\n> Master Haiyun Jimeng insists on exactly this distinction: although the Avataṃsaka speaks throughout of the dharmakāya, this opening sentence belongs to the nirmāṇarūpa, a \"concrete occasion for training the mind in successive acts\" (歷事練心). One must pass through the event to enter the reality. A reader who stops at marveling at the adornment of the visible scene has entered the form-body's gate and no further.\n\n### 2.2 道场庄严（一）：地\n\n> **经文**　其地堅固金剛所成，上妙寶輪及眾寶華清淨摩尼以為嚴飾。諸色相海無邊顯現，摩尼為幢常放光明，恒出妙音。眾寶羅網，妙香華纓周匝垂布。摩尼寶王變現自在，雨無盡寶及眾妙華分散於地。寶樹行列，枝葉光茂。佛神力故，令此道場一切莊嚴於中影現。\n\n**疏解**　此段写「地」，一句之内，九事并列，而其结构实有次第：\n\n**第一层：质地。**「其地坚固金刚所成」——`vajra` 金刚，此处非指金刚石之硬，而以金刚喻「不坏」与「可贯穿」二义：不坏，故能承载无量庄严；可贯穿，故下句「雨无尽宝」得以落而不滞。\n\n**第二层：严饰。**「上妙宝轮及众宝华，清净摩尼以为严饰」——宝轮、宝华、摩尼三者，宝轮为轮次之华（地面之华轮），宝华为行列之华，摩尼为光色之华。凡此皆「严饰」，即于其上加以装饬，而非其本体；此正是后文「一念之间悉包法界」之伏笔——所现者乃影，非实体。\n\n**第三层：量。**「诸色相海无边显现」——**「海」字为华严量词**。凡言「无边」「无量」「不思议」者，必曰「海」；此「色相海」者，非指颜色之众多，谓诸色相之数量如海，深广无边。同理下文「功德海」「众福大海」「三昧海门」。\n\n**第四层：竖向与音声。**「摩尼为幢常放光明，恆出妙音」——幢者，竖立之幡。摩尼宝树之幢，恒发光明、恒出妙音。光明属「色」，妙音属「声」；色声二事同时恒常，故下句「众宝罗网，妙香华缨周匝垂布」之香与华，实承此而进：光、音、香、华，四事俱足。\n\n**第五层：网与垂布。**「众宝罗网，妙香华缨周匝垂布」——网者，横遍；垂布者，垂下。华严写庄严惯用此法：以网横结其上，以缨垂布其侧，使「广」与「深」同时成立；上无所盖而不显其空，下无所坠而不见其限。\n\n**第六层：宝王变现。**「摩尼宝王变现自在，雨无尽宝及众妙华分散于地」——**「变现自在」四字为一大关键**。宝王（`maṇiratna`）能变现，且「自在」；故无尽宝与妙华之雨，不必待外力而自散于地。**此处已启全品之枢机：华严之庄严，非被动之堆砌，而是「自在」之变现。**\n\n**第七层：宝树。**「宝树行列，枝叶光茂」——行列者，齐整；光茂者，枝叶发光而繁茂。列于地者，树。\n\n**第八层：结语。**「佛神力故，令此道场一切庄严于中影现」——**「影现」二字是全段的眼目**。经中不说此等庄严「实有」，只说「影现」。故此地非实境，乃佛神力之所投之影；然亦非幻妄，因「佛神力故」。此四字，正是华严「理事无碍」的最初表达：所现为影（事），其体为法界（理）。\n\n海云继梦法师于此处有一读法：他把这「地」读作极乐世界图的最底层（图纸以「地」为起点，故曰「经文是从这个地方讲起」），并以「摩尼」释为「自在」——**摩尼者，自在也**；可译作自在，因其「显现出来在用」方为自在。法师于此反复申说：世人之所以不能如佛者，在「觉」；不觉，则「佛的那个宝就用不出来」，虽名摩尼而实不能自在。此节读经，法眼与事观并用，正可见现代讲经传统如何在名相上作活参。\n\n> **EN corresponding · 2.2 The Adornment of the Ground**\n>\n> \"The ground is solid, made of vajra; above it, the excellent jeweled wheels and jewel-flowers, and pure maṇi are its adornment. The sea of forms and colors appears without limit. Maṇi serves as banners, constantly radiating light and ceaselessly emitting wondrous sounds. Nets of many jewels, and fragrant flower-tassels hang down all around. Jewel-kings of maṇi appear of their own accord; endless jewels and wondrous flowers rain down and scatter on the ground. Jewel-trees stand in rows, their branches and foliage lush with light. By the Buddha's divine power, every ornament of this bodhimaṇḍa appears therein as a reflected image.\"\n>\n> Nine items of adornment accumulate in a single sentence, yet the passage has a strict internal order: the *substance* of the ground (vajra, solid because it cannot be destroyed, and permeable because what is poured upon it does not obstruct); its *adornment* (wheels, flowers, maṇi); its *quantity* — note that \"sea\" (海) is the Huayan measure-word for boundlessness, so that \"sea of forms and colors\" does not mean many colors but an immensity like the ocean; its *vertical reach* and its *voice*; its *horizontal net* and *hanging tassels*, a device by which Huayan achieves breadth and depth at once; and then the decisive clause. \"Appears of their own accord\" (變現自在) and \"appears as a reflected image\" (影現) are the two hinges. The adornment is neither a passive pile of precious things nor a dream: it is the self-manifesting activity of maṇi, and it is *shadow* rather than substance, shadow cast by the Buddha's divine power. Here, at the very first line, Huayan states the germ of 理事無礙 — that which appears is the event, and the ground of it is dharmadhātu.\n>\n> Haiyun's reading is characteristically practical. He takes \"ground\" as the bottom layer of the Western Pure Land mandala image he uses for teaching, and glosses 摩尼 as \"self-sovereign\" (自在), insisting that maṇi is maṇi only when it is actually in use. The treasure of the Buddhas is available to everyone; what blocks its use, he says, is the failure of awakening. A treasure that is not brought into use is called 摩尼 but is not yet called 自在.\n\n### 2.3 道场庄严（二）：菩提树\n\n> **经文**　其菩提樹高顯殊特，金剛為身，琉璃为干，眾雜妙寶以為枝條。寶葉扶踈垂蔭如雲。寶華雜色分枝布影，復以摩尼而為其果。含輝發焰與華間列。其樹周圍咸放光明，於光明中雨摩尼寶，摩尼寶內有諸菩薩，其眾如雲俱時出現。又以如來威神力故，其菩提樹恒出妙音，說種種法無有盡極。\n\n**疏解**　此段写「树」，与前段之「地」相应，然已在写「地」之中见「佛」：\n\n**树身七事。** 高显殊特（体量与姿态）／金刚为身（体坚）／琉璃为干（干透明净）／众杂妙宝为枝条（枝）／宝叶扶疏垂荫如云（叶）／宝华杂色分枝布影（花）／复以摩尼为其果（果）。**身、干、枝、叶、花、果，六事备具，而最要紧的是「果」用摩尼**——树之果乃其究竟所结，故华严以「摩尼」为果：修行所结之果，是「自在」。\n\n**「影」的第二次出现。**「分枝布影」——与前段「于中影现」相应。华严写树，重在其影；影者，光之所投。**故经中反复说光明，而光明是影之因。**\n\n**「发燄」。**「含晖发燄」——「燄」同「焰」，火也。华严不用「光焰」为一物，而分「晖」与「焰」：晖者含而不放，焰者放而不含。含晖者内敛之光，发焰者外扬之光。\n\n**「周圆」。**「其树周围咸放光明」——「周圆」二字是华严的常用词，谓圆满无缺、无所不周。**凡经中说「周圆」「周遍」「周含」，皆是这个意思：不是范围大，而是无一处在其外。**\n\n**「雨摩尼宝」而「菩萨其中」。** 此为全段最奇之笔：菩提树于光明中雨摩尼宝，而**摩尼宝内则有诸菩萨，其众如云**。华严之「影现」至此遂成人——树所投之影中，菩萨之众同时出现。故经言「摩尼宝王变现自在」者，至此有了实证：所变现者，非宝也，乃宝中之人。\n\n**结语：树能说法。**「其菩提树恆出妙音，说种种法无有尽极」——**树恒出妙音，说种种法，无有尽极**。此句须与下文「复以诸佛威神所持，演说如来广大境界」合看：树之出声，犹是佛之出声，树与佛此处不二。华严写「自然」之法门，常用此法：不说佛作何作用，但写境之本身自然作何用；如道树自鸣、慈竹自动，故用以显法尔（法尔如此）之理。\n\n**名相**\n\n- **琉璃**：`vaidūrya`，青绿色的宝石（另名「吠琉璃」「颇梨」）。梵汉佛典中此物多与 `maṇi`（摩尼，泛指宝珠）、`ratna`（宝）分列，琉璃偏指色相清净光洁者。\n- **含晖发焰**：内光为晖，外光为焰。〔名相训释〕华严常以「晖」「焰」分指佛德之内敛与外显，如后文卷五「摩尼幢上燃焰」之类，可参看澄观《疏》相应处〔待核原句〕。\n- **无有尽极**：尽极即究竟、终限。经中数见「无有尽极」「无有终尽」，皆谓其义无尽，非谓其量无尽。\n\n> **EN corresponding · 2.3 The Bodhi-Tree**\n>\n> \"The bodhi-tree is tall, manifest, and without equal: of vajra for its trunk, of vaidūrya for its stem, of many precious materials for its branches; its jeweled leaves are spreading and shade like a cloud. Jewel-flowers of varied colors cast their shadows from limb to limb, and maṇi serves as its fruit. Holding light within, it sends forth flame, alternating with the flowers. All around, the tree radiates light, and within that light it rains down maṇi-jewels; within those maṇi-jewels there are bodhisattvas, their assembly like a cloud, appearing all at once. And by the Tathāgata's mighty spiritual power, this bodhi-tree ceaselessly emits wondrous sounds and speaks all manner of dharmas without end.\"\n>\n> Six parts of the tree are described — trunk, stem, branches, leaves, flowers, fruit — and the fruit alone is maṇi. What the practice brings to fruition, Huayan says, is self-sovereignty. Then the passage performs its most striking move: the tree rains maṇi-jewels, and *within* those jewels there appear bodhisattvas. What the tree \"freely manifests\" (變現自在) therefore turns out to be not jewels at all but persons. The image projected by light contains the assembly. Finally the tree speaks. The tree's voice and the Buddha's voice are the same voice, which is how Huayan indicates that this mode of operation is not something performed but belongs to the nature of things: 道樹自鳴, the bodhi-tree sounds by itself.\n\n### 2.4 道场庄严（三）：宫殿楼阁\n\n> **经文**　如來所處宮殿樓閣，廣博嚴麗充遍十方。眾色摩尼之所集成，種種寶華以為莊校。諸莊嚴具流光如雲，從宮殿間萃影成幢。無邊菩薩道場眾會咸集其所，以能出現諸佛光明、不思議音摩尼寶王而為其網。如來自在神通之力，所有境界皆從中出。一切眾生居處屋宅，皆於此中現其影像。又以諸佛神力所加，一念之間悉包法界。\n\n**疏解**　自「菩提树」转出「宫殿楼阁」，写佛所住之处。经中三处提法界，为本卷第一处「法界」义之伏笔：\n\n**「广博严丽充遍十方」。** 广博者，宽广而深博；严丽者，庄严而华美；充遍十方者，无所不周。**此三语已是不坏净、无障碍之义，然尚未言「遍」。**\n\n**「众色摩尼之所集成」。** 宫殿非木石所造，乃众色摩尼集成。故下文「诸庄严具流光如云，从宫殿间萃影成幢」——宫与宫之间，光影聚集成幢。**注意「萃」字：影自「间」出。** 华严之严饰，皆在缝隙、在交界处显出；非但见其大体，更见其转折。\n\n**「咸集其所」。** 无边菩萨之众会咸集于此。**「咸」字是华严的标志**——凡「咸」则无一例外、无有参差。\n\n**「以能出现诸佛光明、不思议音、摩尼宝王，而为其网」。** 此句须细读。「以能」二字，谓菩萨众会之所以能聚集于此者，以其能出现（出）三种事：一、诸佛光明；二、不思议音；三、摩尼宝王。三者合而为其网。**网者，普遍而含容。** 故华严写「网」必与「出」并：网不是罩住，是让一切通过而出。\n\n**「如来自在神通之力，所有境界皆从中出」。**——**「从中出」三字，与前「皆从中出」相应，而此处直说「所有境界」。** 至此，华严的两大关键语「自在」与「境界」并出矣。华严的「境界」非今日汉语之「境况」，旧注家多训为「心所缘之域」（唯心所造之境），亦可对 `āyatana`「处所·要素」与 `visaya`「所缘」二义〔译名依各家而异，本文并存两说，标〔待核〕〕；故「所有境界皆从中出」者，谓一切法界作用，无不由此神通之力流出。\n\n**「一切众生居处屋宅，皆于此中现其影像」。**——前句是佛境界流出，此句是众生境界映入。**一出一入，而皆不离此一宫殿。** 故经不别设「众生住处」与「佛所住处」，唯言皆于此中现其影像。\n\n**「一念之间悉包法界」。**——**本卷第一次出现「法界」二字。** 且注意用字：前皆言「十方」「一切境界」「一切世界」，至此方言「法界」。经文以「包」为喻：法界大，而能包之者一念。**一念与法界之悬隔，被这句话取消了。** 此即海云法师所说「法身境界」之最初一现：一念之间，悉包法界——非量之宏大，乃时之短促。\n\n> **EN corresponding · 2.4 Palace, Tower, and Spire**\n>\n> \"The palace-towers and lofts in which the Tathāgata abides are broad, stately, and gloriously adorned, extending throughout the ten directions. They are composed of maṇi of many colors; jewel-flowers of every sort serve as their finial ornamentation. Streams of light from the adornments flow like clouds, and their gathered shadows form spires between the palaces. Assemblies of bodhisattvas without end gather at that place, and being able to manifest the Buddhas' light, their wondrous sounds, and jewel-kings of maṇi, these form its net. All the states of being that the Tathāgata's self-sovereign transformative power embraces issue from it. The dwellings of all sentient beings, their houses and rooms, all appear within it as reflected images. And by the spiritual power of the Buddhas, in a single instant it encompasses the entire dharmadhātu.\"\n>\n> The palaces are not made of matter but of maṇi; and their shadows, gathering *between* the buildings, become spires. Huayan is consistently drawn to what happens at joints and intervals, not to masses. The bodhisattvas' assemblies \"form the net,\" and a net in Huayan is not a cage: the three things they manifest — light, sound, and jewel-kings — pass *through* it, and the text says they issue forth (皆從中出). One clause gives the outward flow of the Buddha's realm; the next gives the inward appearance of every being's dwelling. Both occur in the one structure, which is why no separate dwelling for sentient beings is posited.\n>\n> Then, at last, the first appearance of dharmadhātu in the chapter. Everything before this point has been \"the ten directions,\" \"all states,\" \"all worlds.\" Now it is named. The verb is 包 — to enclose. A single instant encloses the dharmadhātu. The enormous disparity between \"a single instant\" and \"the entire dharmadhātu\" is simply abolished in five characters. Here is the first glimpse of the dharmakāya that Haiyun identifies: 境界量, not 修行量.\n\n### 2.5 道场庄严（四）：师子座\n\n> **经文**　其師子座高廣妙好，摩尼為臺，蓮華為網，清淨妙寶以為其輪。眾色雜華而作瓔珞。堂榭樓閣階砌戶牖，凡諸物像備體莊嚴。寶樹枝果周迴間列，摩尼光雲互相照耀。十方諸佛化現珠玉，一切菩薩髻中妙寶，悉放光明而來瑩燭。復以諸佛威神所持，演說如來廣大境界，妙音遐暢無處不及。\n\n**疏解**　写完佛所住之「处」，续写佛所坐之「座」。座在经中非同寻常的坐具，而是**法之所在**，故此处句句在写「座」而实句句在写「法」。\n\n**座之四事。** 摩尼为臺（台）／莲华为网（网）／清净妙宝为其轮（轮）／众色杂华作璎珞（璎珞）。**臺、网、轮、璎珞，恰是「行、住、坐、卧」四威仪之庄严化用**——凡一切器物皆转为法之庄严，故经中随手取象，随象立法。\n\n**「凡诸物像备体庄严」。** 堂、榭、楼、阁、阶、砌、户、牖，八种建筑与构件，无一不备。**「备体」二字尤可玩味**：非曰略备，曰备其全体。**华严的「严」从来不是整齐，而是无阙。**\n\n**「互相照耀」。** 宝树枝果周回间列，摩尼光云互相照耀。**「互相」而非「递相」**——光云不是依次传递，而是同时互照。**华严的相互性（reciprocity），在此已见其端倪。**\n\n**「十方诸佛化现珠玉，一切菩萨髻中妙宝，悉放光明而来莹烛」。** 此句是全品极重要的一句，**因为它写出了华严宇宙的「同一」**：十方诸佛在此化现珠王，十方菩萨髻中之宝在此放光来烛。**故「此土」与「十方」在同一座中同时发生。** 后文如来现相品「眉间白毫放光，光中现无量世界」，正是此句的放大。\n\n**「妙音遐畅无处不及」。** 座复持妙音而说广大境界。「遐畅」者，声传遥远而通畅；「无处不及」者，无所不至。**故此座兼具三重身份：物象之严（璎珞珠玉）、众圣之会（诸佛菩萨咸来）、教化之行（妙音遐畅）。**\n\n> **EN corresponding · 2.5 The Lion Throne**\n>\n> \"The lion-throne is tall, spacious, and wondrous: maṇi for its platform, lotuses for its net, pure precious substances for its wheels, flowers of many colors for its canopy. Halls, pavilions, towers, lofts, steps, and doorways — every object and form is adorned in its entirety. Jewel-branches and their fruits are ranged about in intervals, and clouds of maṇi-light illumine one another. Buddhas of the ten directions manifest jewel-kings there, and the exquisite jewels in the headdresses of bodhisattvas all radiate light and come to illuminate. Sustained by the Buddhas' spiritual power, it expounds the Tathāgata's vast states, and its wondrous voice resounds far and smoothly, reaching everywhere.\"\n>\n> The throne is written as four ornaments — platform, net, wheels, canopy — which are the four postures turned into sacred ornament. Everything is converted: the seat is not a seat but 法, dharma. Note \"each and every object is adorned in its entirety\" (備體莊嚴) — Huayan's fullness is not symmetry but the absence of any deficiency. Note too that the light-clouds \"illumine one another\" (互相照耀), simultaneously rather than in sequence: the reciprocity that will become 事事無礙 begins here. And note who attends the throne: Buddhas of the ten directions manifest themselves as jewels, and bodhisattvas bring their headdress-jewels to shine. \"Here\" and \"the ten directions\" are happening in the same structure at the same moment. This single sentence is the miniature of what the following chapter will magnify, when light from between the Buddha's brows displays innumerable worlds.\n\n### 2.6 正觉已入：佛的境界\n\n> **经文**　爾時世尊處于此座，於一切法成最正覺。智入三世悉皆平等。其身充滿一切世間，其音普順十方國土。譬如虛空具含眾像，於諸境界無所分別。又如虛空普遍一切，於諸國土平等隨入。身恒遍坐一切道場，菩薩眾中威光赫奕，如日輪出照明世界。三世所行眾福大海悉已清淨，而恒示生諸佛國土，無邊色相圓滿光明，遍周法界等無差別。演一切法如布大雲，一一毛端悉能容受一切世界而無障礙。各現無量神通之力，教化調伏一切眾生。身遍十方而無來往，智入諸相了法空寂。三世諸佛所有神變，於光明中靡不咸覩。一切佛土不思議劫，所有莊嚴悉令顯現。有十佛世界微塵數菩薩摩訶薩所共圍遶。\n\n**疏解**　**此段是世主妙严品的思想核心，全品之眼目所在。** 前五段写境，此段写佛；境是所住，佛是能住；然经文不作「佛语」，而直陈佛之「是」：以十一个「其……」与一连串譬喻，写出佛身佛智之相。澄观谓此属「所信因果」之信位，方东美谓此是「法界缘起」的宇宙论宣言。今逐句疏解如下。\n\n**（1）「于一切法成最正觉」。** 「一切法」为一切事造、一切实相；「最正觉」为无上正等正觉（`anuttara-samyak-sambodhi`）。**此句是因位之实语：佛于此已究竟证入，无余。** 华严说「最正觉」，不落在某一法上，而在「一切法」上；故下文紧接一句「智入三世悉皆平等」——正觉是遍知，不是独知。\n\n**（2）「智入三世悉皆平等」。** 智入过去、现在、未来三世，而三者悉皆平等。**「平等」二字是华严的枢纽**：世尊正觉，非以一时代为胜，而于三世无差别。**经中于此已启「即」法：时间之三世，于智中平等，故非并列而是同一。**\n\n**（3）「其身充满一切世间」。** 前言智之平等，此言身之普遍。「充满」不是占据，是**盈满而无空隙**。\n\n**（4）「其音普顺十方国土」。** 身普遍于一切世间，音普顺于十方国土。**身与音，一隐一显，一遍一方。** 华严写佛，从来不写佛「在」某处，而写其「充满」；故佛与世间无内外之隔。\n\n**（5）「譬如虚空具含众像，于诸境界无所分别。」** ——**第一个譬喻：虚空间喻。** 虚空含众像而不碍众像，众像在而虚空不损。此义即后世所称之「真如实相」：**能含万有而自身无相**。故曰「于诸境界无所分别」——分别者，识之作用；虚空喻体，不以分别为自体。\n\n**（6）「又如虚空普遍一切，于诸国土平等随入。」** ——**第二个譬喻：虚空遍喻。** 前喻取「含」（含众像），此喻取「遍」（普遍一切）。**「平等随入」三字尤可玩味**：佛之身随入一切国土，无有拣择，无有亲疏。**故华严的「普遍」不是「到处一样」，而是「到处处能与彼合」。**\n\n**（7）「身恒遍坐一切道场，菩萨众中威光赫奕，如日轮出照明世界。」** ——「身恒遍坐一切道场」：非但普遍，且**恒常**，遍坐。「如日轮出照明世界」：日轮出而后世界明；佛之威光赫奕，而后菩萨众得照。**此句把佛与菩萨的关系交代清楚：佛为能照，菩萨为所照；而能照之所以为能照，正在其自身无相而能容一切相。**\n\n**（8）「三世所行众福大海悉已清净，而恒示生诸佛国土。」** ——「三世所行」者，三世中佛所行之事；「众福大海」者，福之量如海；「悉已清净」者，已无残余。**「而恒示生」三字极奇**：**已净而复现。** 已究竟清净，而仍「恒示生」于诸佛国土。**这不是说佛有修有证，而是说：果位之上，示现之行无有间断。** 华严的「示生」与「常寂光」并存而不相碍，正由此句点出。\n\n**（9）「无边色相圆满光明，遍周法界等无差别。」** ——「无边色相」之「圆满光明」，遍周法界，而「等无差别」。**「等无差别」是本卷中第一处「无差别」的正面宣告**；而此无差别不是在「一」之中取消差别，是在「遍周法界」之中遍周而无差。**故华严的无差别，是无碍，不是泯灭。**\n\n**（10）「演一切法如布大云，一一毛端悉能容受一切世界而无障碍。」** ——**此为全段最弘阔之句，且是本品思想的关键。** 「演一切法」如「布大云」——**云喻**。云者，聚而成形，散而无质，覆而不塞。「一一毛端悉能容受一切世界而无障碍」——**毛端容世界**：极小者含极大者，而无碍。此即后世所称之「因小含大」「一即一切」的最初表述。**须与 2.4「一念之间悉包法界」合观：一念包法界，毛端容世界，二事同构。**\n\n**（11）「各现无量神通之力，教化调伏一切众生。」** ——「各现」者，各各现前；「教化调伏」者，先教后调，教以开悟，调以伏心。**此句从「境界」落到「作用」，故是全段的转折：前皆言佛之「是」，此始言佛之「为」。**\n\n**（12）「身遍十方而无来往，智入诸相了法空寂。」** ——**此二句为一组「有／空」对举。** 身遍十方而无来往：**遍而不迁，住而不动**。智入诸相而了法空寂：**历相而不住相，证空而不落空**。**「身遍」与「智入」相对，一在事一在理，一有为一无为。** 经不说「身是法界」，而说身遍十方、智了法空，两头并置；此即华严「理事无碍」的又一种表达。\n\n**（13）「三世诸佛所有神变，于光明中靡不咸睹。」** ——「靡不咸睹」：**无不皆见。** 华严写佛的境界量，不从佛自己说，而从「见」上说：**三世诸佛所有神变，众生一照明中皆见。**\n\n**（14）「一切佛土不思議劫，所有庄严悉令显现。」** ——此句承接上句，「所有庄严悉令显现」，与 2.2「于中影现」呼应。**「悉令显现」：令者，使也——是佛主动使其显现，非自然存在。**\n\n**（15）「有十佛世界微尘数菩萨摩诃萨所共围绕。」** ——经文自「佛之境界」转入「会众之众」。**「十佛世界微尘数」为华严计数之常法：微尘（`paramāṇu`）为极小，佛世界（`buddhakṣetra`）为极大，取二极相乘，以示其量不可为数量所限。**\n\n**名相**\n\n- **最正觉**：无上正等正觉，略称「佛果」。\n- **神变**：`yuṅkarikāra`（亦作 `ṛddhi`），佛或菩萨所现之变化神通。华严于此用「神变」而不用「神通」，盖「神通」偏于能，「神变」兼及其变。\n- **微尘**：极小之量。华严一切计数（十佛世界微尘数、佛世界微尘数）皆出此法。\n\n**会读**\n\n海云继梦法师讲此段，着重两点：\n\n其一，法师以为此段是全经「**法身境界**」的第一处正面展开，而 2.1「如是我闻……始成正觉」为化身事相；由事相入法身，方为读经之正路。法师并申：若执「心佛众生始终同」遂谓「不必修」，则是**未透过有为法之关**——「试将心比佛，与佛始终同」之语，是要人比对，不是要人不修。\n\n其二，法师于此反复用「一念之间悉包法界」讲**时之短促与量之弘大之不相碍**。盖常人以「无量」为难、以「一念」为易，故不敢思「一念含无量」；法师则谓此正是华严教人抬头处。若不敢思，则须先经「前行资粮」「资粮道」之次第，不得躐等。\n\n澄观《疏》于此处之判（据本项目既有条目所引）：「佛成正觉，十方同见，而云世主妙严者，要因世主以显佛德」——**佛之功德不 自说，藉世间诸众以各自所证之境来显。** 此说与本段末尾「有十佛世界微尘数菩萨摩诃萨所共围绕」之文脉正合：经文确实是以「会众将起」为「佛境已足」之收束。\n\n> **EN corresponding · 2.6 The Buddha's State as Realized**\n>\n> \"At that time the World-Lord, seated on that throne, had attained the unsurpassed, complete enlightenment with respect to all dharmas. His knowledge penetrates the three times and finds them perfectly equal. His body fills all the worlds; his voice accords with the lands of the ten directions. Like the great void, which contains all images yet differentiates in no sphere of existence; like the great void again, which pervades all things and enters every land with perfect equality. His body constantly occupies every bodhimaṇḍa, and amid the bodhisattvas his radiance is blazing, like the sun's disc rising to illuminate the world. The three times' deeds, the sea of all blessings, are utterly purified, yet he continually manifests birth in the Buddhas' lands. His endless forms and colors, his perfectly rounded light, pervade the dharmadhātu with no distinction at all. He expounds all dharmas as a great cloud spreads out: in each single hair-pore he fully contains every world without obstruction. Each manifests immeasurable powers; he teaches and tames all beings. His body pervades the ten directions yet never comes or goes; his knowledge enters every mark and understands the emptiness of all dharmas. Every transformation of the Buddhas of the three times is beheld in the light, without exception. All the adornments of all Buddha-lands through unimagurable kalpas, he causes to appear. And he is surrounded by a number of bodhisattvas equal to the motes of dust in ten Buddha-worlds.\"\n>\n> This paragraph is the heart of the chapter. Two similes of the void do the main work: the void *contains* all images without being divided among them, and the void *pervades* all things, entering every land equally. Then comes the claim that governs the rest: \"in each single hair-pore he fully contains every world without obstruction\" (一一毛端悉能容受一切世界而無障礙). Compare its structure with the palace's \"in a single instant it encompasses the entire dharmadhātu\" (一念之間悉包法界). Both abolish an asymmetry of scale — instant against dharmadhātu, hair-pore against world — without reducing either term.\n>\n> Two further clauses deserve care. \"The sea of all blessings is utterly purified, yet he continually manifests birth\" (而恒示生) — Huayan holds perfected purity and continual manifestation together, not as two stages but as one activity. And \"his body pervades the ten directions yet never comes or goes; his knowledge enters every mark and understands emptiness\" (身遍十方而無來往，智入諸相了法空寂) places the having and the empty, the event and its principle, side by side without resolving one into the other: 理事無礙.\n>\n> The paragraph does not close on the Buddha's state. It closes on the assembly — \"surrounded by a number of bodhisattvas equal to the motes of dust in ten Buddha-worlds\" — which is precisely the logic Chongguan extracts when he says that this chapter is called the Adornment of the World-Lord *because the World's Lords are the ones who display the Buddha's virtue*: the Buddha's fullness is not asserted for itself but is disclosed by those gathered around.\n\n### 2.7 会众之一：智正觉世间（上首十普菩萨）\n\n<figure style=\"margin:14px 0 20px;text-align:center\">\n<img class=\"doc-img\" src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Dazu_2007_807.jpg/960px-Dazu_2007_807.jpg\" alt=\"大足宝顶山：华严三圣（左文殊、中毗卢遮那、右普贤）\" loading=\"lazy\">\n<figcaption style=\"font-size:.78em;color:var(--text2);line-height:1.85;max-width:760px;margin:6px auto 0\">\n图 2-2　大足宝顶山·华严三圣（左文殊、中毗卢遮那、右普贤，各高约 7m）——本品「上首十普菩萨」之图像化：菩萨非人名而「法名」，以所证为体；背壁八十一尊圆龛小佛，即经中「彼须弥山微尘数菩萨围绕」之相。南宋·大佛湾。<br>\n<div class=\"en-line\" style=\"font-size:.95em\">EN — Huayan Triad, Dazu Baodingshan (Southern Song) — visual counterpart of the chapter’s Ten Universal-leading bodhisattvas: names are dharma-names, the assembly is the proof.</div>\n图源：Wikimedia Commons（CC BY-SA 4.0）；详目见文末〔▲实证文物〕「大足宝顶山华严三圣（dazu-baoding）」。\n</figcaption>\n</figure>\n\n> **经文**　其名曰：普賢菩薩摩訶薩、普德最勝燈光照菩薩摩訶薩、普光師子幢菩薩摩訶薩、普寶焰妙光菩薩摩訶薩、普音功德海幢菩薩摩訶薩、普智光照如來境菩薩摩訶薩、普寶髻華幢菩薩摩訶薩、普覺悅意聲菩薩摩訶薩、普清淨無盡福光菩薩摩訶薩、普光明相菩薩摩訶薩、海月光大明菩薩摩訶薩、雲音海光無垢藏菩薩摩訶薩、功德寶髻智生菩薩摩訶薩、功德自在王大光菩薩摩訶薩、善勇猛蓮華髻菩薩摩訶薩、普智雲日幢菩薩摩訶薩、大精進金剛𪗇菩薩摩訶薩、香焰光幢菩薩摩訶薩、大明德深美音菩薩摩訶薩、大福光智生菩薩摩訶薩。如是等而為上首，有十佛世界微塵數。\n\n**疏解**　**卷一之名号由此开始。** 华严立会之法，与他经不同：他经列众，或依位次，或依亲疏；华严列众，**依其所证**。故本经所列名号皆非人名，而是「法名」——每一名称即一重境界的标示。读华严之名号，须如读华严之偈，不得当作名录观。\n\n**上首二十位。** 经文列二十名，而括注称「如是等而为上首」。此二十名中，首位为**普贤菩萨摩诃萨**，余十九位为「普字起首」及别具名号者。今取其名相结构，分类说明：\n\n**（甲）普字冠首者。** 普贤、普德最胜灯光照、普光师子幢、普宝燄妙光、普音功德海幢、普智光照如来境、普宝髻华幢、普觉悦意声、普清净无尽福光、普光明相、普智云日幢——共十一位冠「普」。\n\n「普」者，普遍、通达、一切处无非是也。华严以「普」为菩萨名之通行冠字，非尊称，乃**义理标记**：谓此菩萨之德，无所不通、无所不周。**故十一位「普」字菩萨，实是一切法界之十一位不同面向。**\n\n**（乙）具德而名状者。** 海月光大明（以海喻其广大，以月喻其清凉明净）、云音海光无垢藏（云之音、海之光、无垢之藏，三义相联）、大精进金刚脐（「脐」者，身之中央，谓其精进为中坚）、香燄光幢（香与焰，光与幢，二类相配）——皆以具体的感官与身体譬喻成德。\n\n**（丙）功德相联者。** 功德宝髻智生、功德自在王大光、大明德深美音、大福光智生——皆以「功德／福／智」为体，而以「宝髻／自在王／美音／智生」为用。\n\n**普贤为首之义。** 经文以普贤菩萨为上首第一位。**此非列位之偶然。** 普贤（`Samantabhadra`，本经卷三诸品别有「普賢」之梵译，此处从通行音译）为「恒随佛行、遍及法界」之大菩萨，**其愿海（普贤愿海）恒与智俱**（见 2.8「恆以所得普贤愿海」）。华严以后世之智识，皆以普贤为「华严行愿之总代表」；然**此一品中普贤列于会众之首，其义在「总」不在「尊」**——**他是一切所证之法的总和，故先于一切而列。**\n\n海云继梦法师于此处有一判：世主妙严品之会主，法师以为非释迦牟尼之化身，而为**毗卢遮那**（释迦成道后之报身）。**〔存疑〕** 此说与澄观判「第一会会主为毗卢遮那」相近，惟法师更强调其意在「说的是佛的境界量，不是修行量」。此与本项目既有华严经学条目所记方东美、海云二家之解一致，本文据以对读，但**不作为经文义**。\n\n> **EN corresponding · 2.7 The Assembly: Samāntabhadra and Nineteen Others**\n>\n> \"Their names are these: Samāntabhadra Bodhisattva; Prabhā-darśana... \"\n>\n> Huayan does not name people; it names states. Every title in this assembly is a designation of a mode of realization, not an appellation of an individual, and the names are therefore to be read as one reads the verses of a gāthā. Twenty names are listed as \"the foremost\" (上首), and eleven of them carry the prefix 普 — samant(a)-, \"all-pervading, universal.\" The prefix is not honorific. It is a doctrinal marker: this bodhisattva's virtue is unobstructed and pervasive, without exception. The eleven Samantabhadras are thus eleven distinct aspects of the totality of dharma.\n>\n> The remaining titles are constructed differently — a figure of light and water (海月光大明, \"moonlight of the ocean's light, bright\"), a chain of the sensory and the material (云音海光无垢藏, \"cloud-sound, ocean-light, stainless treasury\"), a bodily image (大精进金刚脐, \"great vīrya, vajra-navel,\" i.e., vīrya as the very center), and a set built on merit and wisdom (功德宝髻智生 and its parallels). The point of listing them is not completeness but coordinate variety: the same dharmadhātu is designated in eleven ways by one set of titles, and in a further nine by another.\n>\n> Samāntabhadra heads the list. In later reception he becomes the general representative of the Huayan vows — but here the reason is not precedence in rank. It is that he is the totality: the passage immediately following says that these bodhisattvas \"constantly hold, by the sea of Samāntabhadra's vows, that all beings' bodies of wisdom are complete\" (恒以所得普賢願海令一切眾生智身具足). He is listed first because he is the sum, and a sum precedes its terms.\n\n### 2.8 会众之一：菩萨所证\n\n> **经文**　此諸菩薩往昔皆與毘盧遮那如來共集善根、修菩薩行，皆從如來善根海生，諸波羅蜜悉已圓滿。慧眼明徹，等觀三世。於諸三昧，具足清淨。辯才如海，廣大無盡。具佛功德，尊嚴可敬。知眾生根，如應化伏。入法界藏，智無差別。證佛解脫甚深廣大，能隨方便入於一地，而以一切願海所持，恒與智俱，盡未來際。了達諸佛希有廣大祕密之境。善知一切佛平等法，已踐如來普光明地。入於無量三昧海門，於一切處皆隨現身，世法所行悉同其事。總持廣大集眾法海，辯才善巧轉不退輪。一切如來功德大海咸入其身。一切諸佛所在國土皆隨願往。已曾供養一切諸佛，無邊際劫歡喜無倦。一切如來得菩提處，常在其中親近不捨。恒以所得普賢願海，令一切眾生智身具足，成就如是無量功德。\n\n**疏解**　**此段是全品第一处「菩萨的资格」说明。** 经文不说此诸菩萨「有何功德」，而一再说其「曾」「已」「皆悉」，以过去相续之语，写出其境界之不可及。今分四层。\n\n**（一）共集善根。**「往昔皆与**毗卢遮那**如来共集善根、修菩萨行」——**毗卢遮那**（`Vairocana`），意译「遍一切处光明」或「光明遍照」。**此为华严之佛名，非印度传统的毘卢遮那（遮那系之祖）**。经文谓此诸菩萨于往昔与毗卢遮那「共集善根」，**即谓彼等与毗卢遮那同一期中修习**。华严「七处九会」之第一会，以毗卢遮那为会主，其理在此：此诸菩萨之「善根」之根，即毗卢遮那一处。\n\n**「皆从如来善根海生」。**——**「海」字再见**。前以海言量，今以海言本。**菩薩者，从善根海生，非本无而忽有。** 故「菩萨」之义，梵作 `bodhisattva`，意为「觉有情者」；中土释为「菩提心薩埵」，然经文此处强调的不是「立志」，而是「出生」。\n\n**（二）波罗蜜与三昧。**「诸波罗蜜悉已圆满」——波罗蜜（`pāramitā`），度也，行到彼岸。经文作「圆满」，非「具足」；圆满者，无所缺。**华严说六度，不在多而在圆。**\n「于诸三昧，具足清净」——三昧（`samādhi`），正定。经文说「于诸三昧」——**诸**字最要：**不是一种三昧，而是众多三昧皆具足清净。** 华严之禅，不在专一，在遍一切三昧。\n\n**（三）入法界藏。**「入**法界藏**，智无差别」。——**此为菩萨位中的关键一句**。华严的「法界藏」是菩萨所证之宝藏，即以法界为一藏。**「智无差别」**：既入法界藏，则其智于一切法界无有差别。**此句与 2.6「智入诸相了法空寂」相应：佛是了法空寂，菩萨是智无差别。**\n\n**（四）能随方便入于一地。**「能随方便入于一地」——**此句易被误读，须辨。** 旧注家有读为「随方便入于一地（初地）」者，然华严之「地」为十地之位，「入于一地」若作「初地」解，则与下文「而以一切愿海所持」句不顺。**〔存疑〕此处「一地」或谓「一地之中」，或谓「一地（初地）之深」，本文未得澄观《疏》原文可断其确义，姑存两解。**\n**「而以一切愿海所持，恒与智俱，尽未来际」。** ——**「愿海所持」「恒与智俱」是菩萨的定相**：以一切愿海为所持，以智为伴侣，**尽未来际不失。** 「尽未来际」四字是华严常语，谓其行不以时间断。\n\n**（五）了达诸佛稀有广大秘密之境。**「稀有」「广大」「秘密」三语并列，为佛法的三重性：稀有故非常可思，广大故无量，秘密故非言思所及。\n\n**（六）已践如来普光明地。** ——「普光明地」为十地之一，菩萨位之第七。**「已践」二字最可玩味：践者，履而实至之，非徒悬其名。**\n\n**（七）转不退轮。**「总持广大集众法海，辩才善巧转不退轮」。——**「不退轮」**：轮者，法轮。**转轮而不退，故名「不退轮」。** 华严谓菩萨之辩才，能转法轮而无退转；此即「四不坏」之意。\n\n**（八）随愿往。**「一切诸佛所在国土皆随愿往。已曾供养一切诸佛，无边际劫欢喜无倦。」——**「无边际劫欢喜无倦」：供养无尽而心不倦。** 倦者，疲也。**华严写菩萨之供养，以「不倦」为要点**——非不能久供，乃供之而心常欢。\n\n**（九）亲近不舍。**「一切如来得菩提处，常在其中亲近不舍。」——「亲近不舍」四字，与上文「欢喜无倦」相应，**皆言其久而弥笃。**\n\n**（十）普贤愿海。**「恒以所得普贤愿海，令一切众生智身具足，成就如是无量功德。」——**此句是本段之结，亦是接次段之键。** 普贤之愿，恒以之普遍给予众生，**令众生「智身具足」**。**「智身」者，智慧为身，以智慧为体而成身。** 华严言「身」有二义：一为色身，一为智身；此处的「身」是后者。**故华严之给予，不是给法，是令其智身具足。**\n\n**名相**\n\n- **毗卢遮那**：`Vairocana`。「毗卢」为音译（`vi`＋`rocana`），「遮那」亦音译。意译诸家作「光明遍照」「遍一切处」。**须辨**：与《吽》类经典中「毗卢遮那」之别。此处为华严之佛。\n- **波罗蜜**：`pāramitā`，音译「波罗蜜」「波羅密」，义曰「到彼岸」。六波罗蜜即六度。\n- **三昧**：`samādhi`，音译「三昧」，义曰「正定」「等持」。\n- **秘密**：`guhya`，亦译「秘藏」。华严用「秘密」为佛法之深密处，非今日之「隐秘」义。\n\n> **EN corresponding · 2.8 What These Bodhisattvas Have Realized**\n>\n> \"These bodhisattvas in times past all gathered roots of goodness together with Vairocana Tathāgata and cultivated the bodhisattva-path; all were born from the sea of the Tathāgata's roots of goodness, and all the pāramitās were completely fulfilled. The eye of wisdom shines through, viewing the three times in perfect equality. In all the samādhis they are wholly and purely possessed. Eloquence is like the sea, vast and endless. They possess the Buddha's virtues, august and venerable. Knowing the roots of beings, they tame them as appropriate. Having entered the treasury of the dharmadhātu, their knowledge knows no distinction. They have realized the Buddha's deliverance, profound and vast, and can enter the first bhūmi by expedient means; yet held by the sea of all vows, they are forever with wisdom, unto the end of time.\"\n>\n> The paragraph is written almost entirely in perfect tenses — 往昔, 皆, 已, 悉, 常, 尽未来际 — and this is not incidental. Huayan describes the bodhisattva by what has been fully accomplished rather than by what is being attempted. Three formulations deserve notice. \"Born from the sea of roots of goodness\" (皆從如來善根海生) makes bodhisattva-hood a matter of provenance, not of aspiration. \"In all the samādhis they are wholly and purely possessed\" (於諸三昧具足清淨) — the word is \"all\": Huayan meditation is not concentration on one object but purity in every samādhi. And \"having entered the treasury of the dharmadhātu, their knowledge knows no distinction\" (入法界藏智無差別) states the substance of the bodhisattva stage: having entered dharmadhātu as a treasury, knowledge no longer differentiates. This is the counterpart of the Buddha's \"his knowledge enters every mark and understands emptiness\" (智入諸相了法空寂): the Buddha apprehends emptiness, the bodhisattva's knowledge loses all distinction.\n>\n> The last clause is the hinge back to the assembly. \"Constantly, by the sea of Samāntabhadra's vows which they have attained, they make all beings' bodies of wisdom complete\" (恒以所得普賢願海令一切眾生智身具足) — what is given is not teaching but a body: 智身. To see that \"body\" is wisdom rather than flesh is to hold the key to the rest of the chapter.\n\n### 2.9 会众之二：器世间（杂类诸神众十九组）\n\n> **经文**　復有佛世界微塵數執金剛神：妙色那羅延執金剛神、日輪速疾幢執金剛神、須彌華光執金剛神、清淨雲音執金剛神、諸根美妙執金剛神、可愛樂光明執金剛神、大樹雷音執金剛神、師子王光明執金剛神、密焰勝目執金剛神、蓮華光摩尼髻執金剛神。如是等而為上首，有佛世界微塵數。皆於往昔無量劫中恒發大願，願常親近供養諸佛，隨願所行已得圓滿，到於彼岸，積集無邊清淨福業，於諸三昧所行之境悉已明達，獲神通力隨如來住，入不思議解脫境界。處於眾會威光特達，隨諸眾生所應現身，而示調伏。一切諸佛化形所在，皆隨化往。一切如來所住之處，常勤守護。\n\n〔以下十九组，各组名号与功德，具见附录二；其类义与象征今为总说。〕\n\n**疏解**　**此段起，经文转入「异生众」。** 华严列众之序，至此一大变：前所列皆「智正觉世间」（菩萨，为修行之主体），以下所列皆「器世间」「眷属世间」（为所化之机与所依之境）。**然经文于每一组之后，必附一语，说明此众「皆于往昔……」或「其数无量……」。**\n\n**此一处，须细看。** 试举数例：\n\n- 主火神组：「皆能示现种种光明，令诸众生热恼除灭。」\n- 主风神组：「皆勤散灭我慢之心。」\n- 主夜神组：「皆勤修习以法为乐。」\n- 主昼神组：「皆于妙法能生信解，恒共精勤严饰宫殿。」\n- 主山神组：「皆于诸法得清净眼。」\n- 主林神组：「皆有无量可爱光明。」\n- 主药神组：「性皆离垢，仁慈祐物。」\n- 主稼神组：「莫不皆得大喜成就。」\n- 主河神组：「皆勤作意利益众生。」\n- 主海神组：「悉以如来功德大海充满其身。」\n- 主水神组：「常勤救护一切众生而为利益。」\n\n**此即澄观所谓「因世间以显佛德」之实义。** 火神能除热恼，是佛「光明」之用；风神能散我慢，是佛「自在」之用；主海神身充满如来功德大海，是佛「大悲」之用。**故此十九组之众，各以一行「功德语」结束，而此功德语一一对应于佛德之某一门。** 华严写神众而不写神怪，正因为此。\n\n**命名的统一结构。** 十九组之名号，结构完全一致：**〔二字修饰〕＋〔一字中心词〕**。中心词即其职司（执金刚＝手捧金刚杵、身众神＝其身众、足行神＝其足行、道场神＝护道场、主城神＝城主、主地神＝主地、主山神＝主山……）；二字修饰则写其性德与功能。故**读华严神名之法：先取中心词得其职，次取修饰字见其德。**\n\n**代表名号训释（择四则）**\n\n**（甲）执金刚神。**「执」者，持也；「金刚」者，`vajra`，即金刚杵，亦为「不动」义。**此众之持金刚，非执武器，实执「摧伏」与「坚固」二义**；而「金刚」之名，与菩萨之「师子幢」「日轮速疾幢」中之「幢」，同属标示威德之器象。华严神众之名多取器象，非取形貌。\n\n**（乙）主城神。**「宝峰光耀主城神」等十名。**城者，世间聚居之所。** 此众之职在「严净如来所居宫殿」——**即世间之城为佛境之映现。** 华严于「城」用「严净」二字，谓世间之城市为佛土之映影。此义与 2.4「一切众生居处屋宅，皆于此中现其影像」互为表里。\n\n**（丙）主药神。**「栴檀林主药神」「益气明目主药神」等。**药神之名，取其能医。** 经文结其德曰「性皆离垢，仁慈祐物」——**「离垢」与「祐物」二者：药之所能为者，去垢而已。** 华严写药神而不写药师（药师是佛之名，此处是神），**凡有所能者，必现其能**。\n\n**（丁）主火神。**「普光燄藏主火神」「光明破暗主火神」等。**火之性有三：能照（光）、能热（燄）、能净（破暗）。** 经文结其德曰「皆能示现种种光明，令诸众生热恼除灭」——**「热恼」二字最当**：火之用在净，不在焚。**华严取自然中之「用」而弃其「害」，此即其神众论的通例。**\n\n〔袖珍版编者按〕**（以上介绍异生众中的 19 个杂类诸神众：执金刚神、身众神、足行神、道场神、主城神、主地神、主山神、主林神、主药神、主稼神、主河神、主海神、主水神、主火神、主风神、主空神、主方神、主夜神、主昼神，一共 190 位神众，表器世间，即是化处。）**\n\n> **EN corresponding · 2.9 The Assembly: the Nineteen Classes of Divine Attendants**\n>\n> From here the assembly changes character. What follows is not the community of bodhisattvas (the \"world of wisdom and enlightenment,\" the agents of practice) but the divine retinue and the worlds they inhabit — the \"world of vessels\" and the \"world of retinue,\" the ground of practice and those to be converted. The shift matters, and so does the treatment: of each of the nineteen classes the text appends a single line stating what the class does. The fire-deities \"manifest all manner of lights and cause the heat of affliction to be extinguished in all beings\" (皆能示現種種光明令諸眾生熱惱除滅). The wind-deities \"diligently scatter and extinguish the mind of pride\" (皆勤散滅我慢之心). The night-deities \"diligently cultivate taking the dharma as their joy\" (皆勤修習以法為樂). The day-deities \"in the wondrous dharma are able to give birth to faith and understanding\" (皆於妙法能生信解). The sea-deities \"fill their bodies entirely with the sea of the Tathāgata's virtues\" (悉以如來功德大海充滿其身).\n>\n> Read consecutively, these closing clauses are not decoration. Each names a capacity — removing heat, dispersing pride, opening eyes to all dharmas, filling the body with the Tathāgata's virtues — and each capacity corresponds to a door of the Buddha's virtue. This is what it means for the chapter to be called the Adornment of the World-Lord: the World's Lords do not praise the Buddha; they *are* the Buddha's virtues, itemized. Avatamsaka does not write demons here. It writes function.\n>\n> The naming is also perfectly systematic, and reading it is a method: every title is a two-character qualifier attached to a one-character function-word — 执金刚 (those who hold the vajra), 足行神 (those of the feet's movement), 主城神 (lords of the city), 主药神 (lords of medicine), and so on. Take the function-word first to learn the office; take the qualifier second to learn the virtue. Four examples. *Those who hold the vajra*: the vajra is not a weapon but the emblem of subduing and of indestructibility, and it is the same emblem that appears in a bodhisattva's title as 师子幢. *Lords of the city*: their merit is to purify and adorn the palaces where Buddhas dwell — the world's cities as reflections of Buddha-lands, the counterpart of \"the dwellings of all sentient beings appear within it as reflected images.\" *Lords of medicine*: \"their nature is entirely free of filth, and they assist beings with kindness\" (性皆離垢仁慈祐物) — a medicine's work is to remove what soils. *Lords of fire*: fire illuminates, heats, and purifies; the text takes only the third and gives us \"all heat of affliction extinguished.\" Huayan everywhere takes from nature its usefulness and discards its harm.\n\n### 2.10 会众之三：眷属世间（八部四王众）\n\n> **经文**　復有無量阿脩羅王：羅睺阿脩羅王、毘摩質多羅阿脩羅王、巧幻術阿脩羅王、大眷屬阿脩羅王、大力阿脩羅王、遍照阿脩羅王、堅固行妙莊嚴阿脩羅王、廣大因慧阿脩羅王、出現勝德阿脩羅王、妙好音聲阿脩羅王。如是等而為上首，其數無量。悉已精勤摧伏我慢及諸煩惱。\n>\n> 復有不可思議數迦樓羅王……悉已成就大方便力，善能救攝一切眾生。\n>\n> 復有無量緊那羅王……皆勤精進觀一切法，心恒快樂自在遊戲。\n>\n> 復有無量摩睺羅伽王……皆勤修習廣大方便，令諸眾生永割癡網。\n>\n> 復有無量夜叉王……皆勤守護一切眾生。\n>\n> 復有無量諸大龍王……莫不勤力興雲布雨，令諸眾生熱惱消滅。\n>\n> 復有無量鳩槃荼王……皆勤修學無礙法門，放大光明。\n>\n> 復有無量乾闥婆王……皆於大法深生信解，歡喜愛重勤修不倦。\n\n〔袖珍版编者按〕**（以上介绍异生众中的 8 个八部四王众：阿修罗王、迦楼罗王、紧那罗王、摩睺罗伽王、夜叉王、诸大龙王、鸠槃茶王、乾闼婆王，一共 80 位王众，表眷属世间，即所化机。）**\n\n**疏解**　**此八部四王，为佛之眷属，即所依以度生者。华严用此八类，犹《法华》之列八部；而其用有别：《法华》所列八部，以「常随」为义；《华严》所列八部，以「各证一法门」为义。**\n\n**逐组读其「一行功德」，可见华严之用心。**\n\n**（甲）阿修罗王。**「悉已精勤摧伏我慢及诸烦恼」。**此众居四洲之下，为「我慢」之住处，故经云其能摧伏我慢。** 华严写阿修罗不写「欲」而写「慢」——**盖阿修罗之病在慢，不在欲。** 彼能摧己之慢，故显其德。\n\n**（乙）迦楼罗王。**「悉已成就大方便力，善能救摄一切众生」。**迦楼罗（`garuda`）为鸟中之王，振翼大风吹散云雨；华严取其「力大」与「能救」二义。**\n\n**（丙）紧那罗王。**「皆勤精进观一切法，心恒快乐自在游戏」。**紧那罗（`kiṇṇara`）为半人半神，华严取其「天乐」义**，故结其德曰「心恒快乐自在游戏」——**此众的德是「于观法之中恒自游戏」。** **「自在游戏」四字是华严所重的境界语，不作嬉戏解。**\n\n**（丁）摩睺罗伽王。**「皆勤修习广大方便，令诸众生永割痴网」。**摩睺罗伽（`makara`，旧译「摩羯」，蟒类）** 蟒之性，在「缠」。华严取其「能断」之反面义——**缠者，本为缚；此众能「割痴网」，即以其能缚而能解。**\n\n**（戊）夜叉王。**「皆勤守护一切众生」。**夜叉（`yakṣa`）旧译「捷疾鬼」。夜叉之众，护法而多暴。** 华严用之，止取其「守护」一义，而略其余。**首名「毘沙门夜叉王」——毘沙门（`Vaiśravaṇa`）为北方多闻天王**〔按：此系后世密教之配摄，非本经所言，读者勿混〕。\n\n**（己）诸大龙王。**「莫不勤力兴云布雨，令诸众生热恼消灭」。**龙王之职在「兴云布雨」；华严取其「消热」之功。** 此与 2.9 主火神「热恼除灭」同义，然一在火、一在龙，**同归「除热」一义**。**华严之例，可见其义不择类而择用。**\n\n**（庚）鸠槃荼王。**「皆勤修学无碍法门，放大光明」。**鸠槃荼（`kumbhāṇḍa`）旧译「瓮形鬼」「食香鬼」。** 此组名号（增长、龙主、善庄严幢、普饶益行、甚可怖畏、美目端严、高峰慧、勇健臂、无边净华眼、广大天面阿修罗眼）与「甚可怖畏」之名相表里：鸠槃荼本属怖畏之形，而经文结以「修学无碍法门，放大光明」——**怖畏之相，转成光明之用**；「无边净华眼」之名，正与此光明相应。\n\n**（辛）乾闼婆王。**「皆于大法深生信解，欢喜爱重勤修不倦」。**乾闼婆（`gandharva`）旧译「香神」，为歌神。** 华严取其「信解」「勤修」，而略其「歌」之乐。**然 2.4「妙香华缨周匝垂布」、2.5「妙音遐畅无处不及」之香与音，乾闼婆之业正在其中**〔此为其义之旁证，非经文明言〕。\n\n> **EN corresponding · 2.10 The Assembly: the Eight Legions of Four Kings**\n>\n> Eight classes follow, corresponding to the eightfold divine retinue familiar from the Lotus: asuras, garudas, kiṇṇaras, makaras, yakṣas, nāgas, kumbhāṇḍas, gandharvas. Avataṃsaka, however, uses them differently from the Lotus. The Lotus lists the eight legions as those who constantly attend; the Avataṃsaka lists them as those each of whom has realized one specific dharma-door. Again, each class is given a single closing line, and the lines are the point.\n>\n> The asuras \"have diligently destroyed pride and all other defilements\" (悉已精勤摧伏我慢及諸煩惱). Huayan does not say the asuras are lustful; it says they are *proud*, and that they have overcome their own pride — the malady is named so it can be cured. The garudas \"have attained great expedient power and universally rescue and gather in all beings\" (普能救攝一切眾生), taking the eagle's strength as rescue. The kiṇṇaras \"diligently apply themselves to contemplating all dharmas, their minds ever joyful, at play in freedom\" (心恒快樂自在遊戲) — \"playing at will\" (自在遊戲) is a technical term in Huayan, not a reference to frivolity. The makaras, serpent-kind, whose nature is to constrict, \"diligently cultivate great expedients so that all beings forever cut the net of delusion\" (令諸眾生永割癡網): the very capacity to bind is turned into the capacity to unbind. The yakṣas \"diligently guard all beings\" (皆勤守護一切眾生) — Huayan keeps the office and drops the ferocity. The nāgas \"labor to raise clouds and send rain, causing the heat of affliction to cease\" (令諸眾生熱惱消滅) — note that the dragons and the fire-deities of §2.9 discharge the identical function, which shows that Huayan selects by function rather than by category. The kumbhāṇḍas \"diligently study the dharma-door of non-obstruction and emit great light\" (勤修學無礙法門放大光明), and several of their names turn on 無礙. The gandharvas \"in the great dharma deeply awaken faith and understanding, rejoicing in it and practicing untiringly\" (歡喜愛重勤修不倦).\n>\n> Their eighty titles are tabulated in Appendix 2.\n\n### 2.11 会众之三：眷属世间（欲界天七众）\n\n> **经文**　復有無量月天子……皆勤顯發眾生心寶。\n>\n> 復有無量日天子……皆勤修習利益眾生增其善根。\n>\n> 復有無量三十三天王……皆勤發起一切世間廣大之業。\n>\n> 復有無量須夜摩天王……皆勤修習廣大善根，心常喜足。\n>\n> 復有不可思議數兜率陀天王……皆勤念持一切諸佛所有名號。\n>\n> 復有無量化樂天王……皆勤調伏一切眾生，令得解脫。\n>\n> 復有無數他化自在天王……皆勤修習自在方便廣大法門。\n\n〔袖珍版编者按〕**（以上介绍异生众中的欲界天 7 众：月天子、日天子、三十三天王、须夜摩天王、兜率陀天王、化乐天王、他化自在天王，一共 71 位王众，表眷属世间，即所化机。）**\n\n**疏解**　**欲界七众之序，与世間之序同。** 月、日为最小；次三十三天（忉利）；次须夜摩；次兜率陀；次化乐（乐变化）；此上为他化自在，即欲界之顶。**故此七众之列，实是一幅「欲界次第图」。**\n\n**而七组之「一行功德」，亦依次递变，可与其次第合观。**\n\n**（甲）月天子：「皆勤显发众生心宝。」** ——**月者，夜间现于空，而以「心宝」为所显。** 月之义在「清凉」；华严取其「显发心宝」——**「心宝」者，众生本具之善心。** 月虽非日，无能照明，而能显月中之影；故此众之德，是「使未显者显」。\n\n**（乙）日天子：「皆勤修习利益众生增其善根。」** ——**日者，昼间现于空，而以「善根」为所增。** 月显心宝，日增善根；一显一增，一隐一明。**华严写天，非写其福报之厚薄，而写其「作用」之大小。**\n\n**（丙）三十三天王：「皆勤发起一切世间广大之业。」** ——三十三天者，帝释所居。**此众之德在「发起广大之业」——不在守而在发。**\n\n**（丁）须夜摩天王：「皆勤修习广大善根，心常喜足。」** ——**「喜足」二字最奇。** 须夜摩天（`Suyāma`，旧译「夜摩」，亦名「善分天」）福报胜前，然其德曰「心常喜足」。**华严写此天，特写其「喜足」；福报愈厚者愈须学此——此「取用不取位」之法，与主稼神取「见者爱乐」之名、主药神取「仁慈祐物」之德，同科。**\n\n**（戊）兜率陀天王：「皆勤念持一切诸佛所有名号。」** ——**兜率陀（`Tuṣita`，译「知足天」「喜足天」）即此。** 其德为「念持诸佛名号」。**华严写兜率陀而不写「内院」「欲界天之中」之特殊地位，唯取其「念佛名」之实修。** 〔按：后世将此天与弥勒联系起来，见《法华经》，非本经此段所言。〕\n\n**（己）化乐天王：「皆勤调伏一切众生令得解脱。」** ——**「调伏……令得解脱」八字，於此众为重。** 化乐天王居欲界之上，其德为「调伏众生」，故其位愈高，愈当自约。\n\n**（庚）他化自在天王：「皆勤修习自在方便广大法门。」** ——**「自在」二字复见。** 他化自在天者，一切自在。此众之德为「修习自在方便广大法门」——**其名已曰自在，其行曰修习自在。** 华严之「自在」从来不是现成之福，而是所修之法。\n\n> **EN corresponding · 2.11 The Assembly: the Seven Heavens of the Desire Realm**\n>\n> The seven groups follow the order of the desire realm: moon, sun, the Trāyastriṃśa gods of the Thirty-Three, the Suyāma gods, Tuṣita, Nirmāṇarati, and Paranirmitavaśavartin. The order is thus a diagram of the realm, and the single closing line of each group tracks that order. The moon-deities \"diligently manifest the beings' treasure of mind\" (勤顯發眾生心寶); the sun-deities \"diligently cultivate the benefit of beings and increase their roots of goodness\" (利益眾生增其善根) — the moon reveals what is hidden, the sun adds to what exists. The Thirty-Three \"diligently initiate all great works in the world\" (發起一切世間廣大之業). The Niyōna \"diligently cultivate broad roots of goodness, their minds ever content\" (心常喜足) — contentedness is assigned precisely to the heaven of greater abundance, and the assignment is the teaching: the more abundant the provision, the more necessary is contentment. The Tuṣita \"diligently recite and hold the names of all the Buddhas\" (勤念持一切諸佛所有名號) — of Tuṣita the text keeps nothing but the practice of holding Buddha-names. The Nirmāṇarati \"diligently tame all beings so that they gain liberation\" (調伏一切眾生令得解脫): the higher the station, the stricter the self-binding. The Paratimitmā \"diligently cultivate the broad dharma-door of self-sovereign expedients\" (修習自在方便廣大法門) — its name already says \"self-sovereign,\" and its practice is precisely the cultivation of self-sovereignty. In Huayan, 自在 is never a ready-made blessing; it is always something being practiced.\n>\n> (The two figures listed here without immediate titles, the moon and sun, are counted as eleven each; see §1.3 for the arithmetic of the 412.)\n\n### 2.12 会众之三：眷属世间（色界天五众）\n\n> **经文**　復有不可數大梵天王……皆具大慈憐愍眾生，舒光普照令其快樂。\n>\n> 復有無量光音天王……皆住廣大寂靜喜樂無礙法門。\n>\n> 復有無量遍淨天王……悉已安住廣大法門，於諸世間勤作利益。\n>\n> 復有無量廣果天王……莫不皆以寂靜之法而為宮殿，安住其中。\n>\n> 復有無數大自在天王……皆勤觀察無相之法，所行平等。\n\n〔袖珍版编者按〕**（以上介绍异生众中的色界天 5 众：大梵天王、光音天王、遍净天王、广果天王、大自在天王，一共 51 位王众，表眷属世间，即所化机。）**\n\n**疏解**　**色界五众，去欲界七阶而升，其德亦随之而变。可与其「禅定之深浅」并观。**\n\n**（甲）大梵天王：「皆具大慈怜愍众生，舒光普照令其快乐。」** ——**大梵者，四天之上、色界之初。** 其德曰「大慈怜愍」，曰「普照令其快乐」。**此是以「慈」为体、以「光」为用。**\n\n**（乙）光音天王：「皆住广大寂静喜乐无碍法门。」** ——**「寂静喜乐」四字为色界二禅之境（光音天即二禅三天之一）。** 经云「广大寂静喜乐无碍法门」，四义并举：广大、寂静、喜乐、无碍。**华严写色界，已在写禅那；写禅那而仍言「喜乐」，故此非枯寂之定。**\n\n**（丙）遍净天王：「悉已安住广大法门，于诸世间勤作利益。」** ——遍净（`Śubhakṛtsna`，亦译「遍福」，属三禅三天）者，三禅之境。**「安住」与「勤作利益」并：住而能行。**\n\n**（丁）广果天王：「莫不皆以寂静之法而为宫殿，安住其中。」** ——**此句奇在「以寂静之法而为宫殿」。** 以法为宫室，安住其中——**广果天之宫，非宝所成，乃法所成。** 〔待核：此与澄观《疏》「以寂静法为宫殿」之解是否相合，未核原文。〕\n\n**（戊）大自在天王：「皆勤观察无相之法，所行平等。」** ——大自在（`Maheśvara`，即湿婆）本为印度教大神，入佛典后为华严所收。此众之德曰「观察无相之法」。**「所行平等」三字尤当：所行平等，则所观亦平等。** **华严于大自在天王处，特写「平等」，与其名之「自在」相较：一则自在，一则平等。**\n\n**代表名号训释（此众择一）**\n\n**妙燄海大自在天王**——此名见于 2.12 之末，卷二以下复有其「得法界虚空界寂静如来往昔之时解脱门」（详见卷第二）。**「妙焰海」者，光焰如海。** 华严以大自在为极尊，其名犹带光明之相，与所证之「法界虚空界寂静」正相称。〔本条名相之梵拼〔待核〕。〕\n\n〔袖珍版编者按〕**（20 个同生众：十普菩萨、十异名菩萨，表智正觉世间；39 个异生众：19 个杂类诸神众，表器世间；20 类世间主：8 部四王众、欲界天 7 众和色界天 5 众，表眷属世间。总共是 412 位。）**\n\n> **EN corresponding · 2.12 The Assembly: the Five Heavens of the Form Realm**\n>\n> Above the seven heavens of the desire realm stand five of the form realm, and their virtues shift accordingly. The Brahmā deities \"all possess great compassion, pitying sentient beings, spreading light to shine universally and make them happy.\" The Ābhāsvara deities \"all abide in the broad dharma-door of great stillness, joy, and non-obstruction\" (廣大寂靜喜樂無礙法門) — note that the meditation of the form realm is described as \"joyful\": Huayan does not write of blankness. The Vyūha deities \"have all entered the broad dharma-door and diligently work for the benefit of the worlds.\" The广果 deities \"all take the dharma of stillness itself as their palace and abide therein\" (莫不皆以寂靜之法而為宮殿安住其中) — their dwelling is not built of jewels but made of dharma, and the text says so in a single line. And the Maheśvara deities \"diligently observe the dharmas that are without marks, and all their actions are equal\" (勤觀察無相之法所行平等).\n>\n> That last is worth pausing on. Their name is 自在 — self-sovereign — and their practice is 平等 — equality. Huayan juxtaposes the two. Sovereignty without equality is the divine tyrant; equality without sovereignty is the democratic clerk. The chapter places them side by side and lets the juxtaposition carry the judgment.\n>\
