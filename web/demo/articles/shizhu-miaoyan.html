 「而為上首」列名，卷一以序分与总列為本 |\n| 卷二 | 第一之二 | **12** | 大自在天王众 → 月天子 | **123** | 尸弃组作「承佛**神力**」（全品一特） |\n| 卷三 | 第一之三 | **13** | 持国乾闼婆 → 无碍光明主风神 | **131** | 主空神组为**五言偈**（全品少见） |\n| 卷四 | 第一之四 | **14** | 普光焰藏主火神 → 妙色那罗延执金刚神 | **141** | 全为**主神类**，首末与卷一神序成环；组 11「净庄严幢道场神」为**11 偈**（余 13 组各 10 偈） |\n| 卷五 | 第一之五 | 1＋11＋1 | 普贤独颂 → 十一组菩萨 → 善勇猛终颂 | 普贤10＋诸组＋善勇猛10 | 普贤作「以**自功德**」（全品唯一）；善勇猛作「承佛**威神**」 |\n| **合计** |  | **卷二~卷四 39 组**  |  |  |  |\n\n> **按。** 偈数一依本文各组表逐组以行对核之实测值（卷二 **123**、卷三 **131**、卷四 **141**）；卷五诸组偈数详见六.2 之表。**卷三、卷四之总数系按组累加，本文未及逐偈总校，暂〔存疑待查〕。** 〔按二：本批复以底本逐行实测卷四十四组——组 1～10 各 10 偈、**组 11「净庄严幢道场神」11 偈**（源 L2009–L2051，22 半行）、组 12～13 各 10 偈、组 14「妙色那罗延执金刚神」10 偈（五言四句偈，源 L2145–L2163），合计 **141**，与 5.1 表及附录七一致。旧 5.1 表组 10、组 11 偈数曾互换（主城神误作 11、道场神误作 10），本批已据源改正。〕\n\n### 七.3 意象构词矩阵（名号之「身份词＋德相词」）\n\n本品位众名号虽千百，其**造词法则**高度规整：皆由「**身份词**」（标示其为何类众主）＋「**德相词**」（标示其德行境界）复合而成。就附录二四十位上首名作意象统计，可见其分布：\n\n<details class=\"fold table-fold\"><summary>📋 表·意象字…（11 行）</summary>\n| 意象字 | 出现（上首名） | 身分义 | 典型名号 |\n| --- | --- | --- | --- |\n| **神** | 19 | 十九类神众之身份 | 执金刚神、身众神、主城／地／山／林／药／稼／河／海／水／火／风／空／方／夜／昼神 |\n| **王** | 18 | 八部四王、天王、龙王之王 | 持国乾闼婆王、毘沙门夜叉王、毘楼博叉龙王、妙燄海大自在天王 |\n| **天** | 13 | 欲界／色界天众 | 月天子、日天子、三十三天王、忉利天王、妙燄海大自在天王 |\n| **光** | 9 | 光明德相（最常见之德相） | 普光明相菩萨、普清净无尽福光、不动光自在天王、净光普照主空神 |\n| **宝** | 4 | 珍宝尊贵 | 宝峰光耀主城神、宝印手足行神、普宝髻华幢菩萨 |\n| **明** | 4 | 明净／智慧 | 普光明相、普明师子（六十）、清净功德眼天王 |\n| **幢** | 3 | 宝幢旗幡（胜幢） | 普音功德海幢、普宝髻华幢、普光师子幢 |\n| **慧**／**德**／**音** | 各 2 | 智慧／福德／法音 | 普智光照如来境、普德最胜灯光照、普音功德海幢 |\n| 海／山／水／火／風／空／地／林／城／日／月／夜／藏／身／足／道場 | 各 1–2 | 世间万象（对应所主） | 出现宝光主海神、普光焰藏主火神、遍住一切主方神、普德净光主夜神 |\n</details>\n\n**读法。** 三点可玩味：\n\n1. **身份词决定「是谁」**：神、王、天三类高频，即卷一「器世间主／众生世间主／天众」之分别（合澄观三世间之说）。\n2. **德相词决定「境界」**：「光」出现 9 次为最常见德相——光明是华严名号之第一德相（智光即佛光）；次为宝、明、幢（胜幢）、慧、德、音。\n3. **所主即名号**：主海神名「出现宝光」（以宝光现于海）、主火神名「普光焰藏」（光焰藏于火）、主夜神名「普德净光」（净光普照于夜）——**名号即其「境界之投射」**，此与卷二以下各组「得某解脱门」之结构相应：**众名与其所证法门，名实相照**。\n\n> **EN corresponding · Appendix 7 Imagery and Structure.** The multitudes follow a strict naming rule: an **identity term** (神 deity, 王 king, 天 heavenly being) marking *who* they are, compounded with a **virtue term** (光 light, 宝 jewel, 明 brightness, 幢 banner, 慧 wisdom, 德 merit) marking *what realm* they embody. Among the forty leading names of Appendix 2, 神 (19) and 王 (18) and 天 (13) dominate as identity terms, while 光 (9) is the most frequent virtue term—light being the paramount virtue in Huayan naming. Further, each name mirrors its own domain (主海神 \"appearing jewel-light,\" 主夜神 \"universal virtue, pure light\"), so that **name and attained Dharma-gate correspond**, in keeping with the phrase 「得某解脱门」 that follows each group. The visualization above arranges the multitudes in the matrix of 同生／異生 and the three-worlds of Huayan's commentary, and tabulates the group counts and verse counts per fascicle as verified line-by-line against the source.\n\n---\n\n## 附录八　历代祖师与学界解说汇览（逐组可回查）\n\n> 本附录依用户「尽可能检索华严宗、他宗祖师大德及历代学界学者之解说，标明出处以便回查」之嘱，将**本项目内已实测存在、可逐一覆核**的解说材料汇为一览，并注明其出处（经号或项目内路径）。凡本项目未取得者，如实列于「待补」，**不以未见之文充数**。依凡例七之二，转述诸家之说皆存其原貌，疑似讹误者标〔存疑待查〕。\n\n### 八.1 澄观（清凉华严）之说（已取得，可回查）\n\n| 篇 | 出处 | 本文已用之内容 | 定位 |\n| --- | --- | --- | --- |\n| 《大方广佛华严经随疏演义钞》开卷「总释经题」 | CBETA `T36n1736` | 经题七字六对、七大性（体相用果因智教）、品名「世主」「妙严」之三世间释义 | 详见本文 **1.4** |\n| **《大方广佛华严经疏》世主妙严品卷一至卷六** | **Kanripo `KR6e0021`《大方广佛华严经疏钞会本》**（据 CBETA `T35n1735` 疏＋`T36n1736` 钞会校） | **本品结构总纲、解脱门名义、四十众编次、通颂、卷四道场神颂主、组一法门逐字疏解** | 见下引文各条 |\n\n- **澄观释「世主」**：「世谓世间，即三世间——一谓众生世间、二器世间、三智正觉世间；主谓君主，即佛及诸王、地神水神、林神山神，即器世间主；天王龙王、夜叉王等，即众生世间主；如来即智正觉世间主，亦总化上二、遍统前三，故云并称世主。」〔出处：`T36n1736`〕\n- **澄观释「妙严」**：「法门依正俱曰妙严……三世间严并胜余教，故标妙严以为品目。」〔出处：`T36n1736`〕\n- **澄观释经体之殊胜**：「犹杲日丽天，夺众景之曜」「须弥横海，落群峯之高」。〔出处：`T36n1736`〕\n\n#### 八.1.1 《疏》本品卷一至卷六原文（据 `KR6e0021` 会本，本批新获）\n\n> **本小节系澄观本人对本品的直接疏解**，非本文自撰。凡引皆标明所出卷次与语境。本批已取得者如下；**未逐组取得者见八.1.2「待续台账」**。\n\n**（甲）本品结构总纲——四十众之数与编次**（卷一）：\n\n> 「第三所謂下別明得法讚佛**四十眾**中各先長行得法，即經家序列；後說偈讚，即當時所陳。然眾集偈讚並在一時，文不累書，故編之作次。而各得一者，顯佛德無盡故；乘別入總，盡眾不能及故。故海慧云『如來境界無有邊，各隨解脫能觀見』，而普賢得十者，顯等佛無盡故。」\n\n> **〔按〕** 此段**直接坐实本文附录七所统计之「40 位上首」**：澄观本人即以「四十眾」称本品得法赞佛之众，并说明「长行得法在前、偈赞在后」系**编纂所致**（众皆同时说偈，为不累书故次第编排），而「各得一者」乃显佛德无尽、「乘别入总」。惟「普贤得十者」之义，澄观另解为显等佛无尽，与「独得十法门」之通常读法不同，**〔存疑待查〕** 详见八.1.2。\n\n**（乙）「解脱门」之名三分与「游戏神通」**（卷一）：\n\n> 「二『得於』下明分得果用，言**解脫門**者，佛果障寂大用無礙故稱解脫；真解脫者即是如來通智遊入故號門也。眾各證契故名為得。此解脫即門，佛得其總，眾海得別。又佛解脫但名解脫，眾所得法稱之為門，以能通入彼果用故。此解脫之門又眾所得法，離障自在名為解脫，智所入處亦名為門，以因解脫入果解脫亦稱為門。……然總別圓融，因果交徹，重重無礙，方為真解脫門。」\n\n> 「次**遊戲神通**，正明入相。遊戲者，出入自在；神通者，難測無壅，故約觀心者，心境無礙稱為解脫，由此入理故號為門。若以門為門，非能通矣；門即如實，何所通耶？正入雙亡為真門矣。」\n\n> **〔按〕** **「解脫」「門」二字之分疏**——「佛解脫但名解脫，眾所得法稱之為門」——可与本文 **3.3** 节「得……解脫门」之句式互证：**门为众所证之法门，解脱为佛果德用**，二者圆融方为真解脱门。\n\n**（丙）本品会众之总分类（卷一）**：\n\n> 「文中**先異生眾，後同生眾**。前中三：初諸天，次八部，後諸神。今初分二：先色天，後欲天。」\n\n> **〔按〕** 此为**异生／同生二分法之原始依据**（经文本身不标此名，本文附录七所采「同生（菩萨）众／异生众」之分，实承澄观此疏）。又「前中三：诸天→八部→诸神」之序，与本文附录七矩阵之纵向次序一致；「先色天后欲天」则与卷一「大自在天王众属色界」相合。\n\n**（丁）组一「妙焰海大自在天王」法门逐字疏解（卷一）**：\n\n> 「初自在天長行十法，第一『法界』等者，即**法身解脫**也。『法界虛空界』即用所遍處。空即事空，法界之言義兼事理，謂非但遍空，亦遍空內色心等事及空有稱真之理；又但言空則一重遍，今云法界則重重皆遍。何者？謂空界容一一塵處及彼事物，一一塵中皆稱真故，各有無邊剎海佛身大用皆悉充滿，故下頌云『無窮盡』也。言『寂靜』者，**體**也……言『方便』者，**用**也……寂用無礙，所以稱力。」\n\n> 「『普觀一切法悉自在』者，**智身解脫**也，此有三義：一以普眼於一切法無不能觀；二觀一切法不壞事而全理；三於一法中見一切而無礙，並名自在。」\n\n> 「『知一切法不生等』者，**自共相解脫**也，亦有二義：一知不生等，**內證真理**；二**無功用行，外應群機**。」\n\n> **〔按〕** **此段最为关键**——凡例二所定「疏解」为本文依经文直解（见本文 **3.3** 节「法界／虚空界／寂静／方便力」四名相之分疏，依凡例二属本文直解层，非引古注），今得澄观原文，可径证其义理方向不误：**「法界」＝法身解脱、「普观一切法悉自在」＝智身解脱、「知一切法不生等」＝自共相解脱**之三分，与**「言『寂靜』者，體也……言『方便』者，用也……寂用無礙，所以稱力」**之判读，**为澄观原旨，非本文推测**。又澄观于「法界虛空界」别申「用所遍處」，并点出「空即事空，法界之言義兼事理」「重重皆遍」之义，为本文 3.3 节「法界为理、虚空界为事，理事并摄」之说提供了更早的义理依据——**但二者层级不同：本文之说系依名相训释而得，澄观之说系就本门法门而释，不可混同**。「無功用行」一语，澄观亦系于**「外應群機」**（即菩萨不住相而应机），**可与本文附录四第 3 条「本品仅此一见」之检索结论互为印证**。\n\n**（戊）卷四道场神颂主与「长行＋偈赞」编次之实证（卷四）**：\n\n> 「爾時**淨莊嚴幢道塲神**承佛威力普觀一切道塲神眾而說頌言：我念如來徃昔時，於無量劫所修行，諸佛出興咸供養，故獲如空大功德……」\n\n> **〔按〕** 此为**卷四组十一道场神之颂主**（净庄严幢道场神）之直接依据，与本文 **5.1** 表所记组 11 之颂主一致；「承佛**威力**」（非「威神」）之说，亦可与本文 **1.5** 三版校勘所记「颂前多作承佛威神、袖珍版作承佛威力」之异同参看（**〔存疑待查〕**，俟校刊）。\n\n**（己）足行神十法（卷四）**：\n\n> 「復次寶印手足行神得普雨眾寶生廣大歡喜解脫門。蓮華光足行神得示現佛身坐一切光色蓮華座令見者歡喜解脫門。」（疏曰）**「十七足行神十法，初二可知。」**\n\n> **〔按〕** 「足行神十法」之数，为澄观所定；本文附录七所列足行神组内诸名，可据此核其十法之序（「初二可知」者，谓前二法已见前文，其余同例从略）。\n\n#### 八.1.2 澄观疏解·待续台账（未取得或未逐组完成者）\n\n —我执在哪儿？」；「六　紧那罗王众——从用心经营自己开始」；「七　迦楼罗王众——安住、精进、勇猛、平等……」；「八　阿修罗王众——心灵的震动」；「九　主昼神众——发挥生命力的光芒」；「十　主夜神众——积极奋发后的清凉归宿」；「十一　主方神众——依循内在性德的指引」；「十二　主空神众——空，才能发挥妙用」；「十三　主风神众——无碍」。\n\n**卷四（[卷四讲记](../../../docs/huayanhai/华严云海/浩瀚华严海/八十华严之01品世主妙严品/04遨游自性海（华严经世主妙严品卷四讲记）_1.txt)）十四组讲题**——「一　主火神众——破除内心的黑暗面」；「二　主水神众——修习慈悲门」；「三　主海神众——交融与转化的训练」；「四　主河神众　当下即永恒——丰沛你的生命能量」；「五　主稼神众——物质作用转为心性作用」；「六　主药神众——心药」；「七　主林神众——像大树一样」；「八　主山神众——勤修、精进、增长善根」；「九　主地神众——只是默默的付出」；「十　主城神众」；「十一　道场神众——是否心心念念在道上？」；「十二　足行神众——很扎实地去实践」；「十三　身众神众——心为根本，身为依」；「十四　执金刚神众——实质感受生命，展现神变力！」。〔按：讲记此卷第十二题作「足行神众」、第十三题作「身众神众」；**经文卷四此二组之序亦为「先宝印手足行神、次净喜境界身众」，与讲记同序**。经文本作「一切足行神众」「一切身众」，讲记题作「身众神众」者，当系「身众」二字之复称，非异说。覆核原讲可知。〕\n\n**卷五（[卷五讲记](../../../docs/huayanhai/华严云海/浩瀚华严海/八十华严之01品世主妙严品/05佛陀的花园（华严经世主妙严品卷五讲记）_1.txt)）四大类讲题**——「一　普贤菩萨——法界体性」；「二　十普菩萨——遍一切处」；「三　十光菩萨——智慧的本体与作用」；「四　海会众菩萨——殊胜境界通通显示」。\n\n> **读法。** 法师讲记以「**名号＋法门**」为纲，逐一落实为「当如何观、如何行」的修行义。其对**位阶**之统一解释尤可注意：云天王等「虽说是三界内的众生，但事实上他们已得到佛的成就」，并以「圆教初住即成正觉」「十信满心报同等觉」释之（卷二讲记）。〔存疑待查〕此说与《起信论》《探玄记》位阶义不尽同源，法师所据未明标，本文如实录之而存疑。读者可依上列讲题径查原讲，覆其全文。\n\n### 八.3 他宗祖师与历代学界之可回查入口（本项目已有，供延伸）\n\n依用户「其他宗派祖师大德及历代学界学者」之嘱，录本项目已具备、可回查的相关著作（**此为入口表，非本文已引其文；引文须回原书核对**）：\n\n<details class=\"fold table-fold\"><summary>📋 表·人物／宗派…（13 行）</summary>\n| 人物／宗派 | 著作 | 出处（项目内路径／经号） | 与本品之关联 |\n| --- | --- | --- | --- |\n| 唐·法藏（贤首，华严三祖） | 《华严经探玄记》 | CBETA `T1733` | 华严教相与判教；对本品「世主妙严」之圆融解（本项目 `法藏贤首国师全方位文献综述.md` 有研究） |\n| 唐·普觉（华严四祖） | 《华严经七处九会颂本释》 | 见项目研究 | 七处九会与本品「第一会」之关系（详见 1.2「摩訶迦羅」辨） |\n| 唐·李通玄 | 《新华严经论》 | 项目 `李通玄长者_综合深度研究.md` | 另一种华严解读路向（事事无碍／帝释化） |\n| 隋·智顗（天台） | 《法华玄义》《摩诃止观》 | 项目 `三十七道品全方位研究.md` | 天台对「妙／大」之判释（法师「九旬谈妙」之参照） |\n| 唐·窥基（法相） | 《成唯识论》 | 项目祖师研究 | 唯识与如来藏关系 |\n| 宋·永嘉玄觉 | 《永嘉证道歌》 | 项目 `永嘉玄觉大师_综合深度研究.md` | 教观一致之义理 |\n| 清·梦参（1915–2017） | **《八十华严讲述》**（方广文化，十二册） | 项目 `梦参老和尚_综合深度研究.md`；开示文稿目录见 [佛弟子文库·梦参老和尚开示文集](http://text.cnbuddha.net/fashi_22_1.htm) | 近人全经讲记，第一会即本品；**书名为「讲述」非「讲记」，本表旧作「《八十华严经讲记》」已订正**（见八.5） |\n| 现代·印顺 | **《初期大乘佛教之起源与发展》**「华严法门」章；《大乘广五蕴论讲记》 | [印顺文教基金会·著作集总目](https://yinshun-edu.org.tw/zh-hant/Master_yinshun/ 一门」证**纯**，以普贤之「不思議解脱」证**杂**，纳入其十无碍门之「纯杂具德门」。\n\n> **② 念佛义**（《华严念佛三昧论》彭际清述·清）\n> 「如世主妙嚴品云：智入三世悉皆平等，其身充滿一切世間，其音普順十方國土，譬如虗空具含眾像，於諸境界無所分別。」　—— `X58n1030` p.0170a09\n> 「如世主妙嚴品，十方諸大菩薩及天龍神鬼所說諸頌，各出自證法門，以如來果地發人信解，令入念佛三昧。」　—— `X58n1030` p.0172b13\n> **要点**：本品**四十众偈颂被读作念佛三昧之资粮**，此为清代念佛专论引经之典型方式。\n\n> **③ 禅·十玄义**（《金师子章云间类解》法藏撰·净源述）\n> 「〈妙嚴品〉云「一切法門無盡海，同會一法道場中。」名同時具足相應門。《大疏》云「如海一渇，具百川味。」」　—— `T45n1880` p.0665a21\n> **要点**：以本品颂句证**十玄第一「同时具足相应门」**，复引澄观《大疏》「如海一滴，具百川味」为辅证（原文「渇」系「滴」之异体）。\n\n> **④ 忏仪义**（《华严经海印道场忏仪》）\n> 「南無大方廣佛華嚴經中世主妙嚴品法門」　—— `X74n1470` p.0294b12\n> **要点**：本品与「毗卢遮那威势身／意生身／福德身／法身／智身」十身、「华藏世界海本尊毗卢遮那佛」并列，为**忏仪归命礼敬之品类目**，可证本品在宋元明仪轨中之独立地位。\n\n> **⑤ 一乘别教义**（《华严一乘教义分齐章义苑疏》）\n> 「海印定中炳然齊現一切偏圓，妙嚴品說菩提場地演一代隨宜之教，是故此云一切三乘本來悉是彼一乘法。」　—— `X58n0995` p.0198b04\n\n> **⑥ 众异义**（《华严一乘教义分齐章复古记》）\n> 「四者眾異，謂此一乘經首，唯列普賢等菩薩，及佛境界中諸神王眾。謂此等者，如妙嚴品所列。」　—— `X58n0998` p.0442b04\n> **要点**：明确以**本品之众会构成**为「一乘经首众异」之证——与本文 1.4「四十众」结构之讨论直接相应。\n\n**八.4.3 引用之四类功能（实检归纳）**\n\n1. **判教圆融**（`T48n2016`、`X58n0995`、`X58n0998`、`X04n0223`、`T36n1739`）——最多，且集中于「众会解脱门＝纯／普贤＝杂」与「经首众异」二义。\n2. **念佛**（`X58n1030`）——以四十众偈颂为念佛三昧资粮。\n3. **禅·十玄**（`T45n1880`、`X08n0236`）——以「一切法门无尽海，同会一法道场中」证同时具足相应门。\n4. **忏仪**（`X74n1470`）——本品独立列为礼敬品类目。\n\n> **〔方法学结论〕** 本品虽在**判教文献**中被引最多，然**现代学术研究反极稀少**（见八.6.2）——「被反复引用」与「被研究」在本品上呈明显背离。此一背离本身即值得留意。\n\n**八.4.4 校勘所得二点（本人核）**\n\n1. **宗镜录「诸众海各各唯一解脱门」系其自撰语，非经文原句。** 经文公式为「**得〔X〕解脱门**」，逐众各具一名，例（本地繁本底本）：「妙燄海大自在天王．得法界虗空界寂靜方便力解脫門。自在名稱光天王．得普觀一切法悉自在解脫門。」故「各各唯一」当理解为**「各当一门、各有别法门」之义理压缩**，非经文有「唯一」二字。〔此点关系 1.3 解脱门之释读，已可定。〕\n2. **底本用字差异**：本地《大华严寺袖珍版》繁本作「**妙燄海**」，通行 `T279` 作「**妙焰海**」；本文字段依 `T279` 通行体作「妙焰海」，引用繁本原文时保留「燄」字。二者为同词异写〔待核其底本所据写本〕。**本篇引文体例之统一（2026 补记）**：凡标 `> **经文**` 之引文块，已依 `T279` 逐块回源校勘，凡例七所列之统一体字（瑠→琉、踈→疏、輝→晖、徧→遍、覩→睹、乾闥婆→干闥婆）经核对**与 `T279` 逐字相符、仅此等体字有别者，一律保留袖珍版写法并视为遵底本，不作改字**；其余一切字词出入，概依 `T279` 订正，校勘结果另见 **1.6 本批校勘记**。\n\n---\n\n### 八.5 著录订正与排除记录（本轮考证所得）\n\n> **本节所记，皆为本次核查中**发现并已订正之**失实或未确著录**。依〔编务总则 3·严禁假信息〕与 6·边界自知，立此存照。\n\n**(一) 已订正（本项目原表之失实）**\n\n| 原著录 | 核查结论 | 处置 |\n| --- | --- | --- |\n| 「印顺《华严经讲记》，印顺佛学著作集（CB a-gates — **〔to be verified〕**. **(b) The term \"liberation-gate.\"** Chengguan distinguishes: \"The Buddha's liberation is merely called *liberation*; the dharma obtained by the assemblies is called a *gate*, because it can lead them into that fruit-function.\" The gate belongs to the assembly; the liberation is the fruit; only their interpenetration yields the \"true liberation-gate.\" \"**Play and divine power** (*yóuxì shéntōng*) indicates the mode of entry: *play* is entry and exit without obstacle, *divine power* is unfathomable and unobstructed. To take the gate itself as the gate would not be to pass through anything; the gate is suchness — so what would it pass into? Only the simultaneous absence of entry and absence of exit is the true gate.\" **(c) Classification.** \"In the text the **non-human** (*yìshēng*) assemblies come first, the bodhisattva assemblies after. Among the former there are three: the celestial hosts, then the eight Legions, then the various deities. Here the first are divided in two: the form-realm heavens and the desire-realm heavens.\" This is the **source basis** for the tóngshēng / yìshēng division used in Appendix 7. **(d) Group One glossed word by word.** Chengguan reads \"dharma-realm\" as the **liberation of the dharmakāya**; \"dharma-realm and empty-realm\" as the range of its activity; *stillness* as the **body** (with two senses: the great activity is not obstructed by any appearance of stillness, and this very activity is identical with stillness) and *skillful means* as the **function** (two senses likewise). \"Know that all dharmas neither arise nor cease, neither come nor go\" is the liberation of own-and-shared-characteristics, having two senses: internally witnessing the truth, and externally responding to sentient beings without effort (*anābhoga*). The passage \"knows all dharmas as neither arising nor ceasing\" is thus tied by Chengguan to \"**without effort, responding to the multifarious faculties of beings**\" — which corroborates the appendix-four finding that this phrase occurs only once in the present chapter. **(e) The verse-sponsor of fascicle four.** Chengguan's text itself reads \"**Then the net-adorning Banner Bodhisattva of the Ground of Adornment, receiving the Buddha's manifest might, surveys in unison all the Bodhisattvas of the ground of adornment and says**\" — the *Jingzhuangzhuang* (Net-Adorning Banner) assembly being thus confirmed as the sponsor of the eleven verses of fascicle four, group eleven. The word there is \"**might**\" (*weili*), not \"divine might\" (*weishen*), which is relevant to the variant noted in §1.5 (**〔to be verified〕**, pending collation). **(f) The ten dharmas of the Footstep assemblies.** Chengguan enumerates them — \"the ten dharmas of the Footstep Bodhisattvas; the first two are evident from what precedes\" — the rest being taken by analogy.\n\n> **〔Register of items still to be obtained or collated — editorial note, not scripture text.〕** (i) The stand-alone Taishō XML of `T35n1735` has not been obtained; the present chapter's commentary has been read through the Kanripo collated edition `KR6e0021` (fascicles 1–6 suffice for this chapter), and the correct Taishō volume is **35, not 36**. (ii) The per-assembly commentaries for the remaining groups (Garuda, Ganda, nāga, yakṣa, gandharva, kinnara, ṣaḍdeva, the fire-, water-, sea-, river-, crop-, medicine-, forest-, mountain-, earth-, city- and site-deities, the Footstep and Body assemblies, the Vajra-bearers, and *Puxian*) are **to be continued**. (iii) The gloss on \"Puxian alone receives ten\" differs from the usual reading and is **〔to be verified〕**. (iv) A reliable *traditional-character* full text of the Sixty-volume Avataṃsaka (T278) has not been obtained; the local file is in simplified characters and is used as such, with the fact stated. (v) A \"term / dharma-gate / verse × various exegetes\" cross-reference table covering the other exegetes (Fazang, Li Tongxuan, Zhiyi, Kuiji, Yongjia, Mengcan, Yinshun, Fang Dongmei, Suzuki) remains **to be compiled**.\n\n> **EN corresponding · Appendix 8 A Survey of Commentaries.** Appendix 8 assembles, with verifiable provenance, the interpretive materials available within this project on the present chapter. **Chengguan of Qingliang** (澄觀) explains the title and the chapter name in his *Huayan shu* commentary (`T35n1735`), dividing the seven characters into the seven greatnesses and the three worlds; his fascicle-by-fascicle commentary on the present chapter (`T35n1735`) has now been obtained for fascicles 1–6 through the Kanripo collated edition `KR6e0021` (see §8.1.1), and is quoted there; the remaining groups remain **to be continued**. **Venerable Haiyun Jimeng** lectures on every group of the chapter in five transcript fascicles held in `docs/huayanhai`, each assembly being given a distinct doctrinal theme (e.g. the fire-gods \"breaking through the darkness of the mind,\" the water-gods \"practicing the gate of compassion,\" the void-gods \"emptiness makes skillful use possible\"). A table of further entrances—for Fazang's *Tanxuan ji* (`T1733`), Li Tongxuan, Zhiyi, Mengcan, Yinshun, Fang Dongmei, and others—is given, each with its repository path or canon number for further checking. Where a commentary has not been consulted, this appendix says so rather than supplying an unverified summary.\n\n> **EN corresponding · §8.4–8.7 Citations of the Present Chapter, Verified against Full CBETA Texts.** These entries were **not** written from memory. The CBETA TEI files were actually downloaded from `cbeta-org/xml-p5` and searched in full text for four strings — 世主妙嚴品 / 世主妙莊嚴品 / 妙嚴品 / 妙莊嚴品 — after removing `<teiHeader>` and `<note>`; each hit was then located by its `<lb n=\"…\">` line marker. **Counting convention (corrected twice; this is now the definitive one):** (i) **per-line deduplication** — 世主妙嚴品 and 世主妙莊嚴品 contain 妙嚴品 and 妙莊嚴品 as substrings, so summing four separate string counts registers every 「世主…」 line twice; a line is therefore counted **once** if it contains any of the four. (ii) **running-head / fascicle-title lines are counted separately** — *Huayan jing helun* and *Huayan gangyao* use 「世主妙嚴品第一之一」 etc. as division headings; these are titles, not citations, and are tallied in their own column. (iii) The first-pass figures (67 / 36 / 30 …) conflated both errors and are discarded; **the earlier statement that the ranking was unchanged is hereby corrected as inaccurate** — *Huayan jing helun* falls from first to third (19 of its 36 lines are division headings), and *Xuantian huihuan ji* takes first place. Only works actually retrieved are listed. **Density ranking** (genuine citations / title lines): *Xuantian huihuan ji* `X08n0236` 26/0; Li Tongxuan's *Xin Huayan jing lun* `T36n1739` 18/0; *Huayan jing helun* `X04n0223` 17/19; *Helun jianyao* `X04n0225` 10/0; *Huayan gangyao* `X08n0240` 2/4; *Haiyin daochang chanyi* `X74n1470` 2/0; *Nianfo sanmei lun* `X58n1030` 2/0; *Zongjing lu* `T48n2016` 2/0; and 1/0 each for `T45n1880`, `X58n0995`, `X58n0998`. **Six passages are quoted verbatim (§8.4.2).** (i) *Zongjing lu* 28, `T48n2016` p.0573b16: \"妙嚴品喻佛身云。譬如虗空。具含眾像。此舉佛身具足諸法也\"; and p.0574a06: \"如妙嚴品。說諸眾海各各唯一解脫門。純也。普賢菩薩得不思議解脫。雜也\" — Yanshou takes the assemblies' \"one gate each\" as **pure** (*chún*) and Puxian's \"inconceivable liberation\" as **mixed** (*zá*), folding both into the \"pure-and-mixed endowed\" gate of his ten unobstructed gates. (ii) *Huayan nianfo sanmei lun* (Peng Jiqing, Qing), `X58n1030` p.0170a09: \"如世主妙嚴品云：智入三世悉皆平等，其身充滿一切世間，其音普順十方國土，譬如虗空具含眾像，於諸境界無所分別\"; and p.0172b13: \"如世主妙嚴品，十方諸大菩薩及天龍神鬼所說諸頌，各出自證法門，以如來果地發人信解，令入念佛三昧\" — the forty assemblies' verses are read as provisions for the samādhi of Buddha-recitation. (iii) *Jinshizhang yunjian luejie*, `T45n1880` p.0665a21: \"〈妙嚴品〉云「一切法門無盡海，同會一法道場中。」名同時具足相應門\" — the verse is adduced for the **first of the ten mysterious gates**, the gate of \"simultaneous completeness and correspondence.\" (iv) `X74n1470` p.0294b12: \"南無大方廣佛華嚴經中世主妙嚴品法門\" — the chapter is listed as an independent object of veneration, side by side with the ten bodies of Vairocana and the Huazang-world-sea Vairocana. (v) `X58n0995` p.0198b04 and (vi) `X58n0998` p.0442b04 supply the one-vehicle case: the latter explicitly adduces the chapter's assembly-list as proof of \"**differences among the assemblies**\" in the first assembly of the one-vehicle sutra — directly relevant to §1.4. **Methodological conclusion (§8.4.3):** the chapter is cited above all in **judging-and-corroboration literature** — yet **modern academic study of it is extremely scarce** (see §8.6.2). Being repeatedly quoted and being studied diverge sharply here, and that divergence is itself worth noting. **Two textual findings (§8.4.4).** First, Yanshou's phrase \"each of the many oceans of assemblies has just one gate of liberation\" is **his own compression, not the sutra's wording**: the sutra's formula is \"**得〔X〕解脫門**\" — the Ocean-of-Subtle-Flames Heavenly King, for instance, \"得法界虗空界寂靜方便力解脫門\" — so \"each one and only\" is to be understood as *each has its own proper gate*, not as a reading in which the sutra says \"唯一.\" Second, the local *traditional-character* recension reads **妙燄海** where `T279` reads **妙焰海**; this article follows the received `T279` form and preserves 燄 when quoting the local recension, the source manuscript of the latter being **〔to be verified〕**.\n\n> **EN corresponding · §8.5 Corrections to Bibliographic Entries.** This section records **false or unconfirmed attributions found and corrected during the present round of verification**, logged for the record under the project's \"no fabricated information\" and \"declare your own limits\" rules. **(i) Corrected.** The entry \"**Yinshun, *Huayan jing jiangji* (Lecture Record on the Avataṃsaka), Yinshun Collected Works (in CBETA)**\" previously carried in this appendix is **erroneous: no such work by Yinshun exists.** The Yinshun Culture and Education Foundation's official works catalogue was checked item by item: the seven lecture records in the *Miaoyun ji* are the *Prajñāpāramitā*, *Ratnakūṭa*, *Śrīmālādevī*, *Bhaiṣajyaguru*, *Mūlamadhyamakakārikā*, *Mahāyānasaṃgraha*, and *Awakening of Faith in the Mahāyāna* — no Avataṃsaka; nor does the five-fascicle *Huayu ji* (its 54 titles enumerated) or the fifteen monographs contain one. The entry has been **removed** and replaced by the chapter \"Huayan famen\" in Yinshun's *The Origins and Development of Early Mahayana Buddhism* — which is what the rest of this project has always cited, so the earlier entry contradicted the project's own data. Also corrected: Mengcan's book is **《八十华嚴講述》 (*Eighty Huayan: Narrated Talks*, Fangkuang Culture, 12 fascicles)**, not \"《八十華嚴經講記》.\" Also corrected: the **§8.4.1 citation-density figures** (67 / 36 / 30 …) together with the claim that the **ranking was unchanged** — the counting had summed four search strings of which two are substrings of the others (so every 「世主…」 line was registered twice), and had also tallied the division headings 「世主妙嚴品第一之一」 in *Huayan jing helun* and *Huayan gangyao* as citations; the table has been recomputed by per-line deduplication with title lines counted separately, which moves *Huayan jing helun* from first to third and *Xuantian huihuan ji* to first. **Page refs also corrected:** re-locating each quotation at its `<lb n=\"…\">` marker showed that two refs cited the wrong page — the *Haiyin daochang chanyi* liturgical title is at **`X74n1470` p.0294b12** (that fascicle has a different line numbered `0148b13`, which the first pass had picked) and the *Yiyuan shu* passage at **`X58n0995` p.0198b04** (the first pass cited `0190c22`, some eight lines earlier, where the sentence does not occur). The cause was taking the page of *an occurrence of the string* for the page of *the quotation*. The other six refs were re-checked by the same method and are **correct** (`0573b16`, `0574a06`, `0170a09`, `0172b13`, `0665a21`, `0442b04`). **(ii) Excluded as unconfirmed (grade D).** Widely repeated in secondary literature but **not corroborated in this round**, and therefore not admitted here as a basis for any argument: Boyd Bike, \"The Avatamsaka Sutra: A Familial Trilogy?\"; Jan Nattier, \"Which Men?…\" (the DOI `10.1515/9780824841164` was checked and resolves to Nattier's *A Few Good Men*, **unrelated**); Deepak Osto, *Ritualizing the Book of the Array* (Osto does have a title study — DOI `10.1007/s10781-008-9056-6`, *The Supreme Array Scripture*, listed at §8.6.2); and Richard H. Jones, *Containing the Uncontainable* (**recorded as unconfirmed only; this entry neither affirms nor denies that the work exists**). **Declared limit:** these D-grade verdicts follow the **channels reachable in this round** and are not equivalent to \"the work certainly does not exist.\" Any reliable record found later may be entered, and this note then withdrawn.\n\n> **EN corresponding · §8.6 Modern Lectures, Scholarship, and Art, Graded by Availability.** Grades: **A** = actually opened and read; **B** = opened to a table of contents or descriptive page; **C** = existence confirmed but the text not obtained (paywalled, login required, print-only, or JavaScript-dependent and unreachable here); **D** = unconfirmed. Only A and B entries carry a URL actually visited in this round. **Lectures (§8.6.1).** Xiandu Fashi's *Huayan jing* lecture series lists \"世主妙嚴品第 01–24 集\" and \"世主妙嚴品第一（**卷一至五**）\" — **the only complete audio-visual course found that explicitly covers fascicles 1–5**; individual episode URLs are JavaScript-generated and were not obtained (B, `huayencollege.org/about/huayan-7-9`). Mengcan's collected talks include \"释品目《世主妙严品第一》\" and \"庄严道场——释《华严经世主妙严品第一之一》节录\" (B, `text.cnbuddha.net/fashi_22_1.htm`). Venerable Haiyun Jimeng's transcripts of this chapter are **already held in full by this project** (§8.2). **Scholarship (§8.6.2).** Three items were actually read in substance: **Thomas Cleary's** *The Flower Ornament Scripture* (Shambhala, 1993; ISBN 978-0-87773-940-1) — Book 1 read through for its assembly–gate–verse structure, Book 5 for its opening layers; **Sa-er-ji's** 〈試論《華嚴經》的構成與流布——以梵藏文獻為中心〉 (in the 2013 Huayan Special School symposium proceedings, Taipei, 2014-03; ISBN 978-986-90427-2-7, from p.37), which treats **the Sanskrit title of fascicle 1, i.e. of the present chapter** (Tibetan titles *me tog gi thum bu'i rna rgyan* etc.) and distinguishes the titling and fasciculation of the Forty- versus Eighty-fascicle versions (T9 no.278 p.435a5–18 / T10 no.279 p.74a27–b13); and **Äyidär Mirkämäli and Yang Fuxue** on the Uyghur fragments of the *Vairocana Chapter* (Osaka, 2007, pp.39–52), where fragment B128 carries the Chinese \"不可思議\" alongside Uyghur script. Three more are grade C and **marked for later**: **Lin Yicheng's** 2017 NTU master's thesis on Chengguan's *shu* and *chao* ([DOI](https://doi.org/10.6342/NTU201701561)) — **the single most relevant modern study of Chengguan's reading of fascicle 1 that has been seen, and not obtained**; **Osto's** title study (DOI 10.1007/s10781-008-9056-6, DOI resolves but the text was not read); and Gimello／Girard／Hamar's *Avataṃsaka Buddhism in East Asia* (Harrassowitz, 2012; ISBN 978-3-447-06678-5), the principal work on Huayan imagery, **confirmed only at the bibliographic level**. **An important negative result: no modern article or thesis devoted specifically to the forty assemblies or the liberation-gates was found.** Cleary's translation is at present the **only directly citable source for the sequence of the forty assemblies** — but its list has **not yet been aligned** with the received numbering, and the Buddha-assembly and Bodhisattva-assembly sections were not captured in the present pass; it must **not** be described as a completed forty-assembly concordance (§8.7, item 3). **Art and archaeology (§8.6.3).** Dunhuang Academy's official entry for **Cave 12** (Late Tang) states that the upper north wall carries, from west to east, a **Huayan transformation, a Bhaisajyaguru transformation, and a Devaśāntika transformation** — the firmest official positive evidence found (A). Two circulating claims require **correction**: Cave 285 (Western Wei) is officially described as Chinese traditional deities and Buddhist protectors — mani-jewels, vajra-wielders, flying apsaras, the thunder god, *a-p'o* beasts, Fuxi and Nüwa — together with the *Five Hundred Robbers* tale and a meditation cave, and is **not a Huayan transformation** (A); Cave 25 at Yulin is officially listed as a Maitreya transformation, a Sukhāvatī transformation, a mandala of the eight great Bodhisattvas, and a Manjusrī／Samantabhadra pair, with **no Huayan transformation in the cave** (A). For Cave 61 (Five Dynasties) the official page says only that eleven large Mahayana transformations occupy the upper walls and names the Vimalakirti one; \"Huayan transformation\" does **not** appear (B), and the claim for its north wall rests on secondary literature alone. **No primary catalogue or inscription record for the \"seven places, nine assemblies\" (qī chù jiǔ huì) was found** (D) — which matters, since §1.2 turns on the first assembly. **Digital texts and tools (§8.6.4).** Facsimile 1 of `T10n0279` was read at `fjwk.org` (A); CBETA Online, SAT, and the Fo Guang dictionary search form were reachable but yielded no static text in this environment (C); 84000, BDRC, and the Digital Dictionary of Buddhism were all unreachable (D); the Kyoto University page for `T10n0279` opens but is **entirely garbled Chinese** and was accordingly **not used for any textual citation** (C). The project's own base remains `KR6e0021` (Kanripo) with the local traditional- and simplified-character recensions; the canon numbers and page references in §8.4.2 were verified line by line against the CBETA TEI and cross-checked against that base text.\n\n> **EN corresponding · §8.7 New items added to the register of what remains to be obtained.** In descending priority: (1) the full text of Lin Yicheng's thesis — the most relevant modern study of Chengguan's reading of fascicle 1, blocked by repository access; (2) the stand-alone Taishō XML of `T35n1735`, for which `KR6e0021` is presently a substitute; (3) alignment of Cleary's assembly sequence with the received numbering of the forty assemblies — until the Buddha-assembly and Bodhisattva-assembly sections are included, the present list may not be called a concordance; (4) collation of the Sanskrit chapter title (*Gaṇḍavyūha* / *Gaṇavyūha*) between Sa-er-ji's and Osto's studies; (5) the full text of Ch'en Chun-chi's study of the \"Tuoluopin jie\" type, from which the original archive numbers of Caves 159／231／237／471／472 could be traced; (6) the individual episode links of Xiandu Fashi's twenty-four lectures — the only complete course at present; (7) Fo Guang dictionary entries for 世主妙嚴品, 普賢, 主夜神 and similar headwords; (8) primary epigraphic or catalogue evidence for the \"seven places, nine assemblies,\" for which this project currently has only other schools' paraphrases; (9) a traditional-character full text of the Sixty-fascicle Avataṃsaka, only a simplified local T278 being available, as already stated in the body.\n\n---\n\n## 附录九　名相·会处·术语「出处＋信度」总表（凡例九之实施）\n\n> **本表之旨。** 凡例九定「出处＋信度」五级之制，本表为其总登记。凡本文所用之道场名、会处名、品名、专有术语、祖师名号，**凡经有专名者溯至经卷，凡历代注疏始创之判摄名注明首倡者与经号**。表中「本文实测」栏之三经计数，系以程式就本项目所藏三经全文（`T10n0279`／`T09n0278`／`T10n0293`）归一化后逐词检索所得，**日期 2026-09-30**，读者可依凡例一自行覆核。\n\n### 九.1 会处七处（初会至九会）\n\n澄观《新译华严经七处九会颂释章》（`T45n1738`——**正文澄观撰述、卷首《释章序》典壽謹撰**，见 1.2〔订正〕；序称「較之疏鈔不及百之一」，故撰于《疏》之后）系统判摄之七处九会，其名之信度如下。**要旨：凡「会名」皆注疏判摄之名，非经中明文；然其所指之「处」则多有经文实证**（凡例九铁律：正文以经文措辞为准，会名另作注疏名标示）。\n\n<details class=\"fold table-fold\"><summary>📋 表·会…（10 行）</summary>\n| 会 | 澄观等所称会名 | 所指「处」之经文实证（本文实测） | 三经计数（80/60/40） | 级 | 出处 |\n| --- | --- | --- | --- | --- | --- |\n| 一 | **菩提场会**（初会） | 「一時佛在**摩竭提國阿蘭若法菩提場中**，始成正覺」 | 阿兰若法菩提场 **4**／0／0 | **A1**（处）<br>**A2**（会名） | 处：`T10n0279` 卷一<br>会名：澄观《颂释章》`T45n1738` |\n| 二 | **普光法堂会** | 「摩竭提國阿蘭若法菩提場中**普光明殿**」；六十卷作「寂灭道场初始得佛**普光法堂**」 | 普光法堂 **1**／2／0<br>普光明殿 **3**／0／0 | **A1**（处）<br>**A2**（会名） | 处：`T10n0279` 卷十六、卷四十<br>会名：`T45n1738` |\n| 三 | **忉利天宫会**（妙胜殿） | 「向于彼**夜摩天宫**…」；经称**帝释宫**、「忉利护世龙神处」；**妙胜** 6 见 | 忉利天 **11**／2／8<br>妙胜 **6**／0／0 | **A1**（处）<br>**A2**（殿名） | 处：`T10n0279` 卷十六<br>殿名：`T45n1738` |\n| 四 | **夜摩天宫会** | 「而向于彼**夜摩天宫宝庄严殿**」 | 宝庄严殿 **1**／2／0 | **A1** | `T10n0279` 卷十九 |\n| 五 | **兜率陀天宫会** | 「而往诣于**兜率陀天一切妙宝所庄严殿**」（品题作「升兜率天宫一切宝殿品」） | 兜率陀 **24**／26／7 | **A1** | `T10n0279` 卷二 |\n| 六 | **他化自在天宫会** | 「**他化自在天王宫摩尼宝藏殿**」 | 他化…摩尼宝藏殿 **1**／—／— | **A1** | `T10n0279` 卷三十四 |\n| 七·八 | **重普光法堂会** | 七会起于「摩竭提國…**普光明殿**，入剎那際諸佛三昧」（十定品首） | 同二会 | **A1** | `T10n0279` 卷四十 |\n| 九 | **逝多林园重阁会**（给孤独园会） | 「**室羅筏國逝多林給孤獨園大莊嚴嚴閣**」 | 逝多林 **25**／0／29 | **A1** | `T10n0279` 卷六十 |\n</details>\n\n> **澄观判摄之关键实证（本批新获）。** 澄观《颂释章》以《十定品》首「爾時，世尊在摩竭提國阿蘭若法菩提場中始成正覺，**於普光明殿入剎那際諸佛三昧**」为证，判「十定」等十一品为**第七会重普光**（晋译缺《十定品》，故只有八会）。此说**经文实证与注疏判摄两相吻合**，其「觉贤三藏不得十定品梵本」之辨（见 8.4 引文）亦由此经文得证。\n\n### 九.2 品名（三译对照）\n\n| 品名 | 八十华严 | 六十华严 | 四十华严 | 级 | 出处 |\n| --- | --- | --- | --- | --- | --- |\n| 本品 | **世主妙严品**第一 | **世间净眼品**第一 | （归入《卢舍那佛品》） | **A1** | `T10n0279`／`T09n0278` |\n| 复见 | 5 | — | — | | |\n\n> 四十卷经无本品独立名，卷一〈世主妙严〉一段归《卢舍那佛品》（澄观《颂释章》语，本项目 8.4 已引）。六十卷作「世间净眼品」，澄观《颂释章》亦记「晉經名〈世間淨眼品〉」。\n\n### 九.3 关键术语\n\n<details class=\"fold table-fold\"><summary>📋 表·术语…（14 行）</summary>\n| 术语 | 本文实测（80／60／40） | 级 | 出处与说明 |\n| --- | --- | --- | --- |\n| **解脱门** | **550**／20／146 | **A1** | 经文常语。本品卷二至卷五诸天众「各得……解脱门」即此。经作「解脫門」 |\n| **普贤菩萨** | 196／202／60 | **A1** | 经文名。初会会主 |\n| **普贤三昧** | 1／0／0 | **A1** | 《普贤三昧品》品名（卷七） |\n| **师子频申三昧** | 3／0／3 | **A1** | 《入法界品》佛所入三昧（澄观疏分「本」「末」二会所据） |\n| **如来藏三昧** | 1／1／1 | **A1** | 八十卷作「如来藏三昧」，六十卷作「如来净藏三昧」——**〔A1，附版本异名〕** |\n| **海印三昧** | 3／3／0 | **A1** | 经文名 |\n| **华藏世界海** | 14／6／3 | **A1** | 《华藏世界品》所标世界海 |\n| **摩竭提国** | 9／6／4 | **A1** | Magadha，此云「不害国」（澄观《颂释章》语，**A2**） |\n| **十玄／理事无碍／事理无碍** | 0／0／0 | **A2** | **注疏判摄名，非经文**。出自澄观《疏》／李通玄诸家，本经**无此四字**；引用时须标「澄观《疏》语」，不可作经文引 |\n| **一多相即**（十玄门名） | 0／0／0 | **A2** | 同上，出澄观《华严经疏》玄谈门 |\n| **七处九会** | 0／0／0 | **A2** | **判摄名，非经文**。首倡澄观《新译华严经七处九会颂释章》`T45n1738`（正文澄观撰述、卷首序典壽謹撰，见 1.2〔订正〕）；本经**无「七处九会」四字** |\n| **经首** | 0／0／0 | **C** | **海云法师自取之名**（非经非注疏术语），见 1.4（乙）。〔待核〕「法师自取」一说仅据其讲记自陈，未见独立旁证，故归 C（单一来源待考）而**非 D 疑讹**——此名不涉讹误，只是后出自取名，不作本文术语用，仅引述其用语。惟其「每一会皆有一段开篇经文」之用法有经结构依据（导读第 02 讲） |\n</details>\n\n> **〔体例说明〕** 「十玄」「七处九会」等**注疏判摄名**虽为本宗核心术语，然经文实无此语。本文凡用，**必标「澄观《疏》语」或「注疏判摄名」**，使读者知其为**后起判教之语**而非经文原词——此即凡例九 A2 级之要义。\n\n### 九.4 已否之名（〔D〕级·本文正文不采用）\n\n| 名 | 证否过程 | 判定 |\n| --- | --- | --- |\n| **摩訶迦羅道場** | ①三经全文检索，「摩訶迦羅」**0 见**（「摩竭提」80卷9、60卷6、40卷4）；②本项目三版＋全库1,292件（96MB）扫描，四形（摩訶迦羅／摩诃迦罗／摩竭迦羅／摩竭伽羅）**0 见**；③澄观《颂释章》`T45n1738`、澄观《疏》`T35n1735`、表员《要决问答》`X37n0237`、《三十九品大意》`X42n0242`、《佛学大辞典》及维基**一律作「菩提场」** | **〔D〕疑讹**。正文一律作「摩竭提國阿蘭若法菩提場」或简称「菩提場」。**讹因**（或系「摩竭提」与密教「摩訶迦羅」/大黑天混同）**〔存疑：属本文推断，无直接文献〕**。详见 1.2 |\n| **「摩訶迦羅道場」为八十华严语** | 同上 | **〔D〕证否** |\n\n> **本表之维护。** 后续细读所遇新名相，**一律先入本表定级，再入正文**；凡经检得「经文无、注疏有」之名，归 A2 并注明首倡者；凡「经文无、注疏亦无」而归 D，正文不用。此即凡例九「源头治理、杜绝硬编码」之注疏版本，亦使 46 组细读之源流可逐条覆核。\n\n> **EN corresponding · Appendix 9: Provenance and Confidence Grades for Names, Sites, and Terms.** This appendix implements §9 of the editorial rules, registering the provenance of every place-name, chapter-name, and technical term used in this study, at five confidence grades. **A1** — explicitly attested in the scripture itself (e.g. 「解脫門」, 550 occurrences in the Eighty-fascicle text; 「摩竭提國」; the seven assembly-sites as actually worded in the text, such as 「他化自在天王宮摩尼寶藏殿」 and 「室羅筏國逝多林給孤獨園大莊嚴嚴閣」). **A2** — explicitly attested in a historical commentary though not in the scripture: this covers the very terminology central to the Huayan school, namely the **「seven places, nine assemblies」** and the **ten mysterious gates** (十玄) — words that appear **nowhere in the scripture** and are Chengguan's classificatory coinages, to be cited as 「Chengguan's commentary says」 rather than as scripture. Chengguan's placement of the seventh assembly is, however, textually grounded: the opening of the *Chapter of the Ten Dharmas* — 「爾時，世尊在摩竭提國阿蘭若法菩提場中始成正覺，於普光明殿入剎那際諸佛三昧」 — supports his claim that this and the following chapters were preached at the Hall of Universal Light. **B**–**C** — derived from reference works or single sources, marked accordingly. **D** — disproved and **not used in the body**: notably 「摩訶迦羅道場」, a name for the site of the Buddha's awakening that occurs **not in any of the three Avataṃsaka translations nor in any known commentary** (this appendix documents the threefold search — scripture, canonical commentaries, and a full scan of 1,292 files in this project — by which it is rejected; the conjectured cause, a confusion with Magadha, is marked as the present author's inference). One further D-entry is 「經首」, a term **coined by Venerable Haiyun Jimeng himself** for the scripture's opening passage, distinct from the title discussed in §1.4.\n", "data_source": "", "data_pool": "practice", "back": {"tab": "gap", "view": "avatamsaka-studies", "label": "文献页 · 华严经学"}};

if(document.readyState!=='loading'){renderArticle();}
else{document.addEventListener('DOMContentLoaded',renderArticle);}

// ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);
  }
}
function _applyArticleENMode(){
  var full=document.getElementById('article-full');
  var btn=document.getElementById('article-en-toggle');
  var hide=(sessionStorage.getItem('article_en_hide')||'')==='1';
  if(full) full.classList.toggle('en-hidden', hide);
  if(btn) btn.textContent=hide?'🌐 英文批注：展开':'🌐 英文批注：显示';
}
</script>
</body>
</html>
