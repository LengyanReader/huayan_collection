<script>var ARTICLE_GRAPH = {"terms": [{"id": "chapter_shiyan", "zh": "世間淨眼品", "aliases": ["世间净眼品"], "category": "chapter", "grade": "A1", "status": "used", "def_zh": "六十华严（晋译）第一品之名，即八十华严「世主妙嚴品」之对应品。", "def_en": "The title of the first chapter in the Sixty-fascicle (Jin) translation, corresponding to the Eighty-fascicle's \"Adornment of the World-Lords.\"", "source": "T09n0278；澄观《颂释章》记「晉經名〈世間淨眼品〉」", "source_url": "", "note": "", "in": [{"from": "chapter_shizhu", "rel": "same_as", "to_type": "term", "to_ref": "chapter_shiyan", "to_label": "世間淨眼品（六十卷）", "note": ""}], "out": []}, {"id": "chapter_shizhu", "zh": "世主妙嚴品", "aliases": ["世主妙严品", "世主妙莊嚴品"], "category": "chapter", "grade": "A1", "status": "used", "def_zh": "八十华严第一品，卷内分五分（第一之一至第一之五），跨越卷一至卷五， 共 32,713 字、1,151 句，为全经之首品。", "def_en": "The first and longest chapter of the Eighty-fascicle Avataṃsaka, divided into five fascicles (卷一–卷五) — the scripture's opening chapter.", "source": "T10n0279（本经品名，5 见）", "source_url": "", "note": "六十卷同位品名作「世間淨眼品」（A1，2 见）；四十卷无本品独立名，归《盧舍那佛品》", "out": [{"rel": "commented_by", "to_type": "external", "to_ref": "T35n1735", "to_label": "澄观《华严经疏》卷一至卷六", "note": ""}, {"rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_01_chiguo", "to_label": "卷三组一·持國乾闥婆王（10 门 10 偈）", "note": ""}, {"rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_02_zengzhang", "to_label": "卷三组二·增長鳩槃荼王（10 门 10 偈）", "note": ""}, {"rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_03_pilouboxia", "to_label": "卷三组三·毘樓博叉龍王（11 门 11 偈）", "note": ""}, {"rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_04_vishamen", "to_label": "卷三组四·毘沙門夜叉王（10 门 10 偈）", "note": ""}, {"rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_05_shanhui", "to_label": "卷三组五·善慧摩睺羅伽王（10 门 10 偈）", "note": ""}, {"rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_06_kinara", "to_label": "卷三组六·善慧光明天緊那羅王（10 门 10 偈）", "note": ""}, {"rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_07_garuda", "to_label": "卷三组七·大速疾力迦樓羅王（10 门 10 偈）", "note": ""}, {"rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_08_rahu", "to_label": "卷三组八·羅睺阿脩羅王（10 门 10 偈）", "note": ""}, {"rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_09_zhoushen", "to_label": "卷三组九·示現宮殿主晝神（10 门 10 偈）", "note": ""}, {"rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_10_yeshen", "to_label": "卷三组十·普德淨光主夜神（10 门 10 偈）", "note": ""}, {"rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_11_fangshen", "to_label": "卷三组十一·遍住一切主方神（10 门 10 偈）", "note": ""}, {"rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_12_kongshen", "to_label": "卷三组十二·淨光普照主空神（10 门 10 偈·五言）", "note": ""}, {"rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_13_fengshen", "to_label": "卷三组十三·無礙光明主風神（10 门 10 偈·卷三末）", "note": ""}, {"rel": "same_as", "to_type": "term", "to_ref": "chapter_shiyan", "to_label": "世間淨眼品（六十卷）", "note": ""}, {"rel": "see_also", "to_type": "term", "to_ref": "coined_jingshou", "to_label": "法师自取名：經首", "note": ""}], "in": []}, {"id": "coined_jingshou", "zh": "經首", "aliases": ["经首", "經首", "《经首》"], "category": "coined", "grade": "C", "status": "coined", "def_zh": "**近人用语，非本经与历代注疏之既有术语**（三经 0／0／0）。海云继梦法师用以指 八十华严卷一开篇之经文（约一千余字「如是我聞，一時佛在摩竭提國……」）及各会之开篇段， 曾自陈「这个『经首』这名字是我给它取的」。因**系后出自取之名、非既有名相**， 本文正文不作术语使用，仅在论及法师讲记时引述其用语；**与「经题」（全经总名 「大方广佛华严经」七字）层级不同，二者不可相混**。", "def_en": "A modern coinage — **not a term of the scripture nor of any canonical commentary** (zero occurrences across the three translations). Venerable Haiyun Jimeng uses it for the opening passage of fascicle one (the first thousand-odd characters) and for the opening section of each assembly, saying the name was his own. Being a later coinage rather than an established term, it is reported here as his usage, not adopted as a technical term, and must not be confused with the scripture's title (the seven characters 大方广佛华严经).", "source": "法师自陈，见 docs/huayanhai/…/80华严之01品世主妙严品/01华严经经首_1.txt（29 集）", "source_url": "", "note": "〔待核〕「法师自取」一说目前仅据其讲记自陈，未见独立旁证；其「每一会皆有一段开篇经文」 之用法则有经结构依据（法师《西安草堂寺八十华严导读》第 02 讲：「因为他每一会里头都有 一段经首。而这一会的经首就在《世主妙严品》上面」），与澄观初会判摄可相印证； 此则属经结构层面之描述，非术语。分级为 C（单一来源）而**非 D 疑讹**：此名不涉讹误， 只是非经非古注之后出自取名。", "in": [{"from": "chapter_shizhu", "rel": "see_also", "to_type": "term", "to_ref": "coined_jingshou", "to_label": "法师自取名：經首", "note": ""}], "out": []}, {"id": "er_xian_ahai", "zh": "摩竭提國", "aliases": ["摩竭提国", "摩竭提", "Magadha"], "category": "site", "grade": "A1", "status": "used", "def_zh": "佛成道之国，古印度中印度一国。澄观《颂释章》释其名「此云不害国」（A2）。 三经计数：摩竭提 9／6／4。", "def_en": "Magadha, the kingdom in central India where the Buddha attained awakening — \"the kingdom called 'harmless' (a-himsa) in translation,\" in Chengguan's gloss.", "source": "T10n0279 等三经；译名「此云不害國」出澄观《新译华严经七处九会颂释章》T45n1738", "source_url": "", "note": "", "in": [{"from": "site_bodhimaṇḍa", "rel": "same_as", "to_type": "term", "to_ref": "er_xian_ahai", "to_label": "摩竭提國", "note": ""}], "out": []}, {"id": "grp_j3_01_chiguo", "zh": "持國乾闥婆王", "aliases": ["持国乾闼婆王", "持國乾闼婆", "持国乾闼婆"], "category": "figure", "grade": "A1", "status": "used", "def_zh": "卷三组一（一切乾闼婆众，10 门 10 偈）之组首，得「自在方便攝一切眾生解脫門」。 长行组首与颂主同为「持國乾闥婆王」，颂引作「普觀一切乾闥婆眾而說頌言」（无「已」字）。", "def_en": "Head of group one of Book Three (the gandharvas: ten gates, ten stanzas), attaining \"the gate of freedom and skillful means in gathering in all beings.\" Prose-head and verse-singer are the same king; the lead-in reads 普觀一切乾闥婆眾而說頌言, without 已.", "source": "T10n0279 卷三「復次，持國乾闥婆王，得自在方便攝一切眾生解脫門」", "source_url": "", "note": "", "out": [{"rel": "next_group", "to_type": "term", "to_ref": "grp_j3_02_zengzhang", "to_label": "卷三组二·增長鳩槃荼王", "note": ""}], "in": [{"from": "chapter_shizhu", "rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_01_chiguo", "to_label": "卷三组一·持國乾闥婆王（10 门 10 偈）", "note": ""}]}, {"id": "grp_j3_02_zengzhang", "zh": "增長鳩槃荼王", "aliases": ["增长鸠槃荼王", "增長鳩槃荼", "鳩槃荼王"], "category": "figure", "grade": "A1", "status": "used", "def_zh": "卷三组二（一切鸠槃荼众，10 门 10 偈）之组首，得「滅一切怨害力解脫門」。**本组颂中 径称其王为「龍主」**（「此解脫門龍主得」），然 T279 卷三实以鸠槃荼（组 2）、龙（组 3） 分列两族。", "def_en": "Head of group two (the kumbhāṇḍas: ten gates, ten stanzas), attaining \"the gate of destroying all hostile force.\" The verse calls this king \"dragon-lord\" (龍主), though T279 lists kumbhāṇḍas (group 2) and dragons (group 3) as two distinct classes.", "source": "T10n0279 卷三「復次，增長鳩槃荼王，得滅一切怨害力解脫門」", "source_url": "", "note": "", "out": [{"rel": "next_group", "to_type": "term", "to_ref": "grp_j3_03_pilouboxia", "to_label": "卷三组三·毘樓博叉龍王", "note": ""}, {"rel": "see_also", "to_type": "term", "to_ref": "grp_j3_03_pilouboxia", "to_label": "颂称「龍主」而经分列鸠槃荼·龙两族", "note": ""}], "in": [{"from": "chapter_shizhu", "rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_02_zengzhang", "to_label": "卷三组二·增長鳩槃荼王（10 门 10 偈）", "note": ""}, {"from": "grp_j3_01_chiguo", "rel": "next_group", "to_type": "term", "to_ref": "grp_j3_02_zengzhang", "to_label": "卷三组二·增長鳩槃荼王", "note": ""}]}, {"id": "grp_j3_03_pilouboxia", "zh": "毘樓博叉龍王", "aliases": ["毘楼博叉龙王", "毘樓博叉", "毘楼博叉", "毘樓博叉龍王"], "category": "figure", "grade": "A1", "status": "used", "def_zh": "卷三组三（一切诸龙众）之组首，得「消滅一切諸龍趣熾然苦解脫門」。**本组门与偈各 11， 为卷三之仅见**（余组各 10）；其颂引作「普觀一切諸龍眾已，即說頌言」，为全卷唯一用 「已…即說頌言」者。", "def_en": "Head of group three (the dragons), attaining \"the gate of extinguishing the blazing suffering of all dragon-fates.\" **This group alone has eleven gates and eleven stanzas** in Book Three (all others have ten); its lead-in alone reads 普觀一切諸龍眾已，即說頌言.", "source": "T10n0279 卷三「復次，毘樓博叉龍王，得消滅一切諸龍趣熾然苦解脫門」", "source_url": "", "note": "〔待核〕此名之梵拼未定译；组内「毘摩質多羅阿脩羅王」（组 8）当与之辨", "out": [{"rel": "next_group", "to_type": "term", "to_ref": "grp_j3_04_vishamen", "to_label": "卷三组四·毘沙門夜叉王", "note": ""}], "in": [{"from": "chapter_shizhu", "rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_03_pilouboxia", "to_label": "卷三组三·毘樓博叉龍王（11 门 11 偈）", "note": ""}, {"from": "grp_j3_02_zengzhang", "rel": "next_group", "to_type": "term", "to_ref": "grp_j3_03_pilouboxia", "to_label": "卷三组三·毘樓博叉龍王", "note": ""}, {"from": "grp_j3_02_zengzhang", "rel": "see_also", "to_type": "term", "to_ref": "grp_j3_03_pilouboxia", "to_label": "颂称「龍主」而经分列鸠槃荼·龙两族", "note": ""}]}, {"id": "grp_j3_04_vishamen", "zh": "毘沙門夜叉王", "aliases": ["毘沙门夜叉王", "毘沙門", "毗沙门夜叉王"], "category": "figure", "grade": "A1", "status": "used", "def_zh": "卷三组四（一切夜叉众会，10 门 10 偈）**长行组首**，得「以無邊方便救護惡眾生解脫門」。 然本组**颂主为「多聞大夜叉王」**，为同组第二王——长行领组以列名之首，颂则另有所指， 二者非讹误。", "def_en": "The **prose-head** of group four (the yakṣas: ten gates, ten stanzas), attaining \"the gate of protecting evil-doing beings with unlimited skillful means.\" Yet the verse is sung by \"Much-Heard Yaksha King\" (多聞大夜叉王), the group's second king — the prose leads by the first name listed, the verse by its own choice.", "source": "T10n0279 卷三「復次，毘沙門夜叉王，得以無邊方便救護惡眾生解脫門」", "source_url": "", "note": "〔待核〕颂主何以必取组内第二名，待校澄观《疏》卷四", "out": [{"rel": "next_group", "to_type": "term", "to_ref": "grp_j3_05_shanhui", "to_label": "卷三组五·善慧摩睺羅伽王", "note": ""}, {"rel": "see_also", "to_type": "term", "to_ref": "grp_j3_05_shanhui", "to_label": "长行组首与颂主不同之两例（颂主取组内第二名）", "note": ""}], "in": [{"from": "chapter_shizhu", "rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_04_vishamen", "to_label": "卷三组四·毘沙門夜叉王（10 门 10 偈）", "note": ""}, {"from": "grp_j3_03_pilouboxia", "rel": "next_group", "to_type": "term", "to_ref": "grp_j3_04_vishamen", "to_label": "卷三组四·毘沙門夜叉王", "note": ""}]}, {"id": "grp_j3_05_shanhui", "zh": "善慧摩睺羅伽王", "aliases": ["善慧摩睺罗伽王", "善慧摩睺羅伽", "摩睺羅伽王"], "category": "figure", "grade": "A1", "status": "used", "def_zh": "卷三组五（一切摩睺罗伽众，10 门 10 偈）**长行组首**，得「以一切神通方便令眾生集功德 解脫門」；本组**颂主为「善慧威光摩睺羅伽王」**（同组第二王），与组四同例。", "def_en": "The **prose-head** of group five (the makhoras: ten gates, ten stanzas), attaining \"the gate of all spiritual powers, by which beings are gathered into merit\"; the verse is sung by \"Wise-Bannered Makhora King\" (善慧威光摩睺羅伽王), the group's second king — the same divergence as in group four.", "source": "T10n0279 卷三「復次，善慧摩睺羅伽王，得以一切神通方便令眾生集功德解脫門」", "source_url": "", "note": "", "out": [{"rel": "next_group", "to_type": "term", "to_ref": "grp_j3_06_kinara", "to_label": "卷三组六·善慧光明天緊那羅王", "note": ""}], "in": [{"from": "chapter_shizhu", "rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_05_shanhui", "to_label": "卷三组五·善慧摩睺羅伽王（10 门 10 偈）", "note": ""}, {"from": "grp_j3_04_vishamen", "rel": "next_group", "to_type": "term", "to_ref": "grp_j3_05_shanhui", "to_label": "卷三组五·善慧摩睺羅伽王", "note": ""}, {"from": "grp_j3_04_vishamen", "rel": "see_also", "to_type": "term", "to_ref": "grp_j3_05_shanhui", "to_label": "长行组首与颂主不同之两例（颂主取组内第二名）", "note": ""}]}, {"id": "grp_j3_06_kinara", "zh": "善慧光明天緊那羅王", "aliases": ["善慧光明天紧那罗王", "善慧光明天緊那羅", "紧那罗王"], "category": "figure", "grade": "A1", "status": "used", "def_zh": "卷三组六（一切紧那罗众，10 门 10 偈）之组首，得「普生一切喜樂業解脫門」。 长行组首与颂主同名，颂引作「普觀一切緊那羅眾而說頌言」。", "def_en": "Head of group six (the kiṇnaras: ten gates, ten stanzas), attaining \"the gate of universally engendering every joy-giving karma.\" Prose-head and verse-singer are the same.", "source": "T10n0279 卷三「復次，善慧光明天緊那羅王，得普生一切喜樂業解脫門」", "source_url": "", "note": "", "out": [{"rel": "next_group", "to_type": "term", "to_ref": "grp_j3_07_garuda", "to_label": "卷三组七·大速疾力迦樓羅王", "note": ""}], "in": [{"from": "chapter_shizhu", "rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_06_kinara", "to_label": "卷三组六·善慧光明天緊那羅王（10 门 10 偈）", "note": ""}, {"from": "grp_j3_05_shanhui", "rel": "next_group", "to_type": "term", "to_ref": "grp_j3_06_kinara", "to_label": "卷三组六·善慧光明天緊那羅王", "note": ""}]}, {"id": "grp_j3_07_garuda", "zh": "大速疾力迦樓羅王", "aliases": ["大速疾力迦楼罗王", "大速疾力迦樓羅", "迦樓羅王"], "category": "figure", "grade": "A1", "status": "used", "def_zh": "卷三组七（一切迦楼罗众，10 门 10 偈）之组首，得「無著無礙眼普觀察眾生界解脫門」； 其颂首「佛眼廣大無邊際，普見十方諸國土」，**为卷三与「见」关系最密之一组**。", "def_en": "Head of group seven (the garuḍas: ten gates, ten stanzas), attaining \"unattached, unobstructed eyes, universally surveying the realm of beings\"; its verse opens \"The Buddha's eye is vast and without bound\" — the group in which seeing dominates.", "source": "T10n0279 卷三「復次，大速疾力迦樓羅王，得無著無礙眼普觀察眾生界解脫門」", "source_url": "", "note": "", "out": [{"rel": "next_group", "to_type": "term", "to_ref": "grp_j3_08_rahu", "to_label": "卷三组八·羅睺阿脩羅王", "note": ""}], "in": [{"from": "chapter_shizhu", "rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_07_garuda", "to_label": "卷三组七·大速疾力迦樓羅王（10 门 10 偈）", "note": ""}, {"from": "grp_j3_06_kinara", "rel": "next_group", "to_type": "term", "to_ref": "grp_j3_07_garuda", "to_label": "卷三组七·大速疾力迦樓羅王", "note": ""}]}, {"id": "grp_j3_08_rahu", "zh": "羅睺阿脩羅王", "aliases": ["罗睺阿修罗王", "羅睺阿脩羅", "罗睺阿修罗"], "category": "figure", "grade": "A1", "status": "used", "def_zh": "卷三组八（一切阿修罗众，10 门 10 偈）之组首，得「現為大會尊勝主解脫門」—— **非谓阿修罗本为尊，而谓其能现为众会之尊胜主**。", "def_en": "Head of group eight (the asuras: ten gates, ten stanzas), attaining \"the gate of manifesting as the supreme master presiding over the great assembly\" — not that the asura is the master, but that he is able to appear as one.", "source": "T10n0279 卷三「復次，羅睺阿脩羅王，得現為大會尊勝主解脫門」", "source_url": "", "note": "", "out": [{"rel": "next_group", "to_type": "term", "to_ref": "grp_j3_09_zhoushen", "to_label": "卷三组九·示現宮殿主晝神（八部讫，转诸神）", "note": ""}], "in": [{"from": "chapter_shizhu", "rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_08_rahu", "to_label": "卷三组八·羅睺阿脩羅王（10 门 10 偈）", "note": ""}, {"from": "grp_j3_07_garuda", "rel": "next_group", "to_type": "term", "to_ref": "grp_j3_08_rahu", "to_label": "卷三组八·羅睺阿脩羅王", "note": ""}]}, {"id": "grp_j3_09_zhoushen", "zh": "示現宮殿主晝神", "aliases": ["示现宫殿主昼神", "示現宮殿主晝神", "主晝神", "主昼神"], "category": "figure", "grade": "A1", "status": "used", "def_zh": "卷三组九（一切主昼神众，10 门 10 偈）之组首，得「普入一切世間解脫門」。 〔待核：昼／夜神之名，经中未标梵名〕", "def_en": "Head of group nine (the deities of daylight: ten gates, ten stanzas), attaining \"the gate of universally entering all worlds.\"", "source": "T10n0279 卷三「復次，示現宮殿主晝神，得普入一切世間解脫門」", "source_url": "", "note": "", "out": [{"rel": "next_group", "to_type": "term", "to_ref": "grp_j3_10_yeshen", "to_label": "卷三组十·普德淨光主夜神", "note": ""}, {"rel": "see_also", "to_type": "term", "to_ref": "grp_j3_10_yeshen", "to_label": "主昼·主夜（昼神遍入，夜神调伏）", "note": ""}], "in": [{"from": "chapter_shizhu", "rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_09_zhoushen", "to_label": "卷三组九·示現宮殿主晝神（10 门 10 偈）", "note": ""}, {"from": "grp_j3_08_rahu", "rel": "next_group", "to_type": "term", "to_ref": "grp_j3_09_zhoushen", "to_label": "卷三组九·示現宮殿主晝神（八部讫，转诸神）", "note": ""}]}, {"id": "grp_j3_10_yeshen", "zh": "普德淨光主夜神", "aliases": ["普德净光主夜神", "普德淨光主夜神", "主夜神"], "category": "figure", "grade": "A1", "status": "used", "def_zh": "卷三组十（一切主夜神众，10 门 10 偈）之组首，得「寂靜禪定樂大勇健解脫門」—— **卷三唯一以「寂靜禪定」为门者**。本组颂引作「遍觀一切主夜神眾而說頌言」， 为全卷唯一用「遍觀」者（余组作「普觀」）。", "def_en": "Head of group ten (the deities of night: ten gates, ten stanzas), attaining \"the gate of the joy of tranquil meditation and great vigour\" — the only gate in Book Three beginning with stillness. Its lead-in alone reads 遍觀一切主夜神眾而說頌言, where all other groups read 普觀.", "source": "T10n0279 卷三「復次，普德淨光主夜神，得寂靜禪定樂大勇健解脫門」", "source_url": "", "note": "", "out": [{"rel": "next_group", "to_type": "term", "to_ref": "grp_j3_11_fangshen", "to_label": "卷三组十一·遍住一切主方神", "note": ""}], "in": [{"from": "chapter_shizhu", "rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_10_yeshen", "to_label": "卷三组十·普德淨光主夜神（10 门 10 偈）", "note": ""}, {"from": "grp_j3_09_zhoushen", "rel": "next_group", "to_type": "term", "to_ref": "grp_j3_10_yeshen", "to_label": "卷三组十·普德淨光主夜神", "note": ""}, {"from": "grp_j3_09_zhoushen", "rel": "see_also", "to_type": "term", "to_ref": "grp_j3_10_yeshen", "to_label": "主昼·主夜（昼神遍入，夜神调伏）", "note": ""}]}, {"id": "grp_j3_11_fangshen", "zh": "遍住一切主方神", "aliases": ["遍住一切主方神", "主方神", "遍住一切主方"], "category": "figure", "grade": "A1", "status": "used", "def_zh": "卷三组十一（一切主方神众，10 门 10 偈）之组首，得「普救護力解脫門」； 其颂以「普示法門令悟入，悉使當成無上智」为纲。〔待核：主方神之梵名〕", "def_en": "Head of group eleven (the deities of the quarters: ten gates, ten stanzas), attaining \"the gate of universal protective power\"; its verse is keyed to \"he universally shows them the gates so that they awaken and enter, and brings them all to accomplish unsurpassed wisdom.\"", "source": "T10n0279 卷三「復次，遍住一切主方神，得普救護力解脫門」", "source_url": "", "note": "", "out": [{"rel": "next_group", "to_type": "term", "to_ref": "grp_j3_12_kongshen", "to_label": "卷三组十二·淨光普照主空神", "note": ""}], "in": [{"from": "chapter_shizhu", "rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_11_fangshen", "to_label": "卷三组十一·遍住一切主方神（10 门 10 偈）", "note": ""}, {"from": "grp_j3_10_yeshen", "rel": "next_group", "to_type": "term", "to_ref": "grp_j3_11_fangshen", "to_label": "卷三组十一·遍住一切主方神", "note": ""}]}, {"id": "grp_j3_12_kongshen", "zh": "淨光普照主空神", "aliases": ["净光普照主空神", "淨光普照主空神", "主空神"], "category": "figure", "grade": "A1", "status": "used", "def_zh": "卷三组十二（一切主空神众，10 门 10 偈）之组首，得「普知諸趣一切眾生心解脫門」。 **本组之偈通篇五言**，与卷四妙色那罗延执金刚神组同为全品仅见之二处五言。", "def_en": "Head of group twelve (the deities of space: ten gates, ten stanzas), attaining \"the gate of universally knowing the mind of every being in every realm of existence.\" **This group's verses are throughout in five-syllable metre** — one of only two such places in the whole chapter (the other is the vajra-bearers of Book Four).", "source": "T10n0279 卷三「復次，淨光普照主空神，得普知諸趣一切眾生心解脫門」", "source_url": "", "note": "", "out": [{"rel": "next_group", "to_type": "term", "to_ref": "grp_j3_13_fengshen", "to_label": "卷三组十三·無礙光明主風神（卷三之末）", "note": ""}, {"rel": "see_also", "to_type": "term", "to_ref": "grp_j3_13_fengshen", "to_label": "五言偈之二（另一处见卷四执金刚神组）", "note": ""}], "in": [{"from": "chapter_shizhu", "rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_12_kongshen", "to_label": "卷三组十二·淨光普照主空神（10 门 10 偈·五言）", "note": ""}, {"from": "grp_j3_11_fangshen", "rel": "next_group", "to_type": "term", "to_ref": "grp_j3_12_kongshen", "to_label": "卷三组十二·淨光普照主空神", "note": ""}]}, {"id": "grp_j3_13_fengshen", "zh": "無礙光明主風神", "aliases": ["无碍光明主风神", "無礙光明主風神", "主風神"], "category": "figure", "grade": "A1", "status": "used", "def_zh": "卷三组十三（一切主风神众，10 门 10 偈）之组首，得「普入佛法及一切世間解脫門」； 其颂以「無相無形無影像」三否定冠首。**主风神为卷三众神之末**，卷四诸神自此续起。", "def_en": "Head of group thirteen (the deities of wind: ten gates, ten stanzas), attaining \"the gate of universally entering the Dharma of the Buddhas and every world\"; its verse opens with three negations — \"formless, shapeless, without image.\" **The wind-deities close Book Three**, after which Book Four takes up the fire, water, and other deities.", "source": "T10n0279 卷三「復次，無礙光明主風神，得普入佛法及一切世間解脫門」", "source_url": "", "note": "", "in": [{"from": "chapter_shizhu", "rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_13_fengshen", "to_label": "卷三组十三·無礙光明主風神（10 门 10 偈·卷三末）", "note": ""}, {"from": "grp_j3_12_kongshen", "rel": "next_group", "to_type": "term", "to_ref": "grp_j3_13_fengshen", "to_label": "卷三组十三·無礙光明主風神（卷三之末）", "note": ""}, {"from": "grp_j3_12_kongshen", "rel": "see_also", "to_type": "term", "to_ref": "grp_j3_13_fengshen", "to_label": "五言偈之二（另一处见卷四执金刚神组）", "note": ""}], "out": []}, {"id": "huazang_shijiehai", "zh": "蓮華藏世界海", "aliases": ["蓮華藏世界海", "华藏世界海"], "category": "doctrine", "grade": "A1", "status": "used", "def_zh": "《华藏世界品》所标之世界海，为华严世界观之总纲；本品卷五即转入此界之普贤菩萨住处。", "def_en": "The Lotus-Store World Ocean — the world-ocean whose description occupies the \"Chapter of the Lotus Store World\" of this very fascicle block.", "source": "T10n0279；计数：14／6／3", "source_url": "", "note": "", "in": [{"from": "samadhi_rulaizang", "rel": "see_also", "to_type": "term", "to_ref": "huazang_shijiehai", "to_label": "蓮華藏世界海", "note": ""}], "out": []}, {"id": "jie_tuomen", "zh": "解脫門", "aliases": ["解脱门", "解脫之門"], "category": "doctrine", "grade": "A1", "status": "used", "def_zh": "众会所入之法门。本品诸天众「各得……解脱门」即此。经中习见，澄观《疏》析之： 「佛之解脱名为解脱，众生所得法门名为门」——门属众所得，解脱属佛之果，二者相资方为真解脱门。", "def_en": "The dharma-gate (mokṣa-dvāra) entered by each assembly — the most frequent technical term in this chapter (550 occurrences). Chengguan distinguishes the gate obtained by the assemblies from the Buddha's own liberation, which is its fruit.", "source": "T10n0279；澄观《疏》T35n1735 卷一（门与解脱之辨）；计数：550／20／146", "source_url": "", "note": "", "out": [{"rel": "defined_by", "to_type": "external", "to_ref": "T35n1735", "to_label": "澄观《华严经疏》（门与解脱之辨）", "note": ""}], "in": []}, {"id": "men_jiniyaocha", "zh": "憶念三世佛出興乃至剎成壞皆明見大歡喜解脫門", "aliases": ["憶念三世佛出興", "忆念三世佛出兴乃至刹成坏皆明见大欢喜解脱门"], "category": "doctrine", "grade": "A1", "status": "used", "def_zh": "组十（释迦因陀罗天王·三十三天）头门。「忆念」而「明见」刹之成坏，与组十颂 「我念三世一切佛……如其国土坏与成，以佛威神皆得见」相应——帝釋天主为过去世 无数佛之因缘所成，故于「念」中见诸佛国土之生灭。此门与组四（可爱乐光明）「我念 如来昔所行」同为卷二仅有的「我念」起首之偈。", "def_en": "Head-gate of group ten (三十三天): recalling the Buddhas of the three times and clearly seeing their lands' forming and perishing. It answers the group's opening \"I recall all Buddhas of the three times… as their lands break and form, all is seen by the Buddha's 威神\" — the lord of the Trayastriṃśa recalling the Buddhas whose karma built his heaven. Together with group four's 「我念」 opening, the two are the only first-person openings in Book Two.", "source": "T10n0279 卷二（八十华严）", "source_url": "", "note": "", "in": [{"from": "tian_sanshiyisi", "rel": "see_also", "to_type": "term", "to_ref": "men_jiniyaocha", "to_label": "释迦因陀罗天王组十头门（忆念·明见）", "note": ""}], "out": []}, {"id": "men_puguan_gen", "zh": "普觀一切眾生根為說法斷疑解脫門", "aliases": ["普观一切众生根为说法断疑解脱门", "为说法断疑"], "category": "doctrine", "grade": "A1", "status": "used", "def_zh": "卷二组二头门（可爱乐法光明幢天王所入）。观根、说法、断疑三事一脉：观根者知其机之所堪， 说法者投其器而说之，断疑者竟其劝发之功；以一句而尽一段施化次第，诸组头门中此为最明。", "def_en": "Head-gate of group two (entered by 可愛樂法光明幢天王): contemplating the faculties, teaching the Dharma for them, and cutting off their doubt — a whole curriculum of conversion in a single phrase.", "source": "T10n0279 卷二（八十华严）", "source_url": "", "note": "", "in": [{"from": "tian_cheng_kle_faguangmingshuang", "rel": "attains", "to_type": "term", "to_ref": "men_puguan_gen", "to_label": "普观一切众生根为说法断疑解脱门（组二头门）", "note": ""}], "out": []}, {"id": "men_riguang_zhao", "zh": "淨光普照十方眾生盡未來劫常為利益解脫門", "aliases": ["淨光普照十方眾生盡未來劫常為利益解脫門", "净光普照十方众生尽未来劫常为利益解脱门"], "category": "doctrine", "grade": "A1", "status": "used", "def_zh": "组十一（日天子·日宫）头门。「尽未来劫常为利益」——不为一世之益，而为恒常 之利；日之光明无有间断，故此门以「普照」而「常为」并言。日天子领众诸门多带 「光明」「精爽」「欢喜信解」，与日体相应。", "def_en": "Head-gate of group eleven (日天子): pure light illumining the beings of the ten directions, endlessly, throughout every future age, ever for their benefit. The sun's unceasing radiance grounds the gate's unceasing benefit.", "source": "T10n0279 卷二（八十华严）", "source_url": "", "note": "", "in": [{"from": "tian_rigong", "rel": "see_also", "to_type": "term", "to_ref": "men_riguang_zhao", "to_label": "日天子组十一头门（净光普照·常为利益）", "note": ""}], "out": []}, {"id": "men_shihua_yebianhua", "zh": "開示一切業變化力解脫門", "aliases": ["開示一切业变化力解脱门", "開示一切業變化力解脫門"], "category": "doctrine", "grade": "A1", "status": "used", "def_zh": "组七（善化天王·化乐天）头门。业变力即众生业惑之变现，开示之即为「佛为群迷悉開示， 巧说因缘真实理」之旨——化乐天之众以「善化」为名，此门即其「化」之根本。", "def_en": "Head-gate of group seven (化樂天): the power whereby karma is transformed. To open it up is exactly what the group's verses say — \"for the deluded, the Buddha opens all things up, speaking the true law of causes and conditions.\"", "source": "T10n0279 卷二（八十华严）", "source_url": "", "note": "", "in": [], "out": []}, {"id": "men_shiqi_faqi_liyou", "zh": "發起一切眾生善根令永離憂惱解脫門", "aliases": ["發起一切眾生善根令永離憂惱解脫門", "发起一切众生善根令永离忧恼解脱门", "廣闢離塵清淨道", "广辟离尘清净道"], "category": "doctrine", "grade": "A1", "status": "used", "def_zh": "组九（时分天王·须夜摩天）头门。「发起善根」在先，「令永离忧恼」在后，二语有次第。 本组颂首继之以「已竭世间忧恼海，广辟离尘清净道，永耀众生智慧灯」——门之「令永离忧恼」 与颂之「已竭忧恼海」正相照应，而「广辟离尘清净道」七字尤见须夜摩天（夜摩）之特质： 以「离尘」之清净道转之夜众之心。", "def_en": "Head-gate of group nine (須夜摩天): raising the roots of goodness in all beings so that they may forever be parted from grief. The group's opening stanza takes this up — \"the sea of worldly grief is drained dry; a clean path apart from dust is opened wide; the lamp of wisdom shines forever\" — the gate's 「令永離憂惱」 answering the stanza's 「已竭憂惱海」. 「廣闢離塵清淨道」 marks the night-heaven's own condition of restless desire, which a path apart from dust is there to turn.", "source": "T10n0279 卷二（八十华严）", "source_url": "", "note": "", "in": [], "out": []}, {"id": "men_yimaokong", "zh": "於一毛孔現不思議佛剎無障礙解脫門", "aliases": ["于一毛孔现不思议佛刹无障碍解脱门", "一毛孔現佛剎", "一毛孔现佛刹"], "category": "doctrine", "grade": "A1", "status": "used", "def_zh": "卷二组二乐寂静天王之解脱门。毛孔纳剎，极小含极大而无障碍，即卷一「毛端容世界」之喻； 同组颂言「过去所有诸国土，一毛孔中皆示现」「十方所有诸国土，悉在其中而说法」，其致一也。", "def_en": "The liberation-gate of 樂寂靜天王 (group two): in a single pore-hole appear inconceivable Buddha-lands without obstruction — the smallest holding the greatest, the 毛端容世界 image first met in fascicle one.", "source": "T10n0279 卷二（八十华严）", "source_url": "", "note": "", "out": [{"rel": "member_door_of", "to_type": "term", "to_ref": "tian_cheng_kle_faguangmingshuang", "to_label": "乐寂静天王之门（组二）", "note": ""}], "in": []}, {"id": "men_yueguang_shehua", "zh": "淨光普照法界攝化眾生解脫門", "aliases": ["淨光普照法界攝化眾生解脫門", "净光普照法界摄化众生解脱门"], "category": "doctrine", "grade": "A1", "status": "used", "def_zh": "组十二（月天子·月宫殿）头门。与组十一日天子头门仅差「照十方众生」与「照法界摄化 众生」——日门但及众生，月门已及法界；此一进退，即日月二众在卷二降序中「由光 及界」之别。月虽不照明，而能「摄化」，故颂言结在「永破众生痴惑暗」之「暗」上。", "def_en": "Head-gate of group twelve (月天子): pure light illumining the dharmadhātu and gathering beings in. It differs from group eleven's sun-gate by one degree — sun reaches beings, moon reaches the dharmadhātu. The moon does not illuminate, yet it 「攝化」; hence its verses end on breaking the dark of beings' delusion.", "source": "T10n0279 卷二（八十华严）", "source_url": "", "note": "", "in": [{"from": "tian_yuegong", "rel": "see_also", "to_type": "term", "to_ref": "men_yueguang_shehua", "to_label": "月天子组十二头门（净光普照法界·摄化）", "note": ""}], "out": []}, {"id": "men_zhizu_jiaolun", "zh": "一切佛出興世圓滿教輪解脫門", "aliases": ["一切佛出兴世圆满教轮解脱门", "圓滿教輪解脫門"], "category": "doctrine", "grade": "A1", "status": "used", "def_zh": "组八（知足天王·兜率天）头门。「教轮」谓佛出兴世转法轮——「一切佛出兴世圆满」， 知足天（兜率）之众以「念持佛名」为德（见 2.1 甲戌条），此门则由「听佛教」而立。", "def_en": "Head-gate of group eight (兜率天): the wheel of teaching, complete, of every Buddha's appearance in the world. The Tuṣita deities' own virtue is reciting the Buddhas' names (§2.1 甲戌); this gate receives that teaching as a turning wheel.", "source": "T10n0279 卷二（八十华严）", "source_url": "", "note": "", "in": [], "out": []}, {"id": "puxian", "zh": "普賢菩薩", "aliases": ["普贤菩萨", "普賢"], "category": "person", "grade": "A1", "status": "used", "def_zh": "初会会主，亦为此品中会众之最著者。经中 196 见。 《普贤三昧品》（卷七）称其三昧，《入法界品》佛所入者称「师子频申三昧」。", "def_en": "Bodhisattva Samantabhadra (普賢) — the principal figure of the first assembly and the most frequently named bodhisattva of the chapter (196 occurrences).", "source": "T10n0279；计数：196／202／60", "source_url": "", "note": "澄观疏就「普贤独得十门」之解，与通常「独得十法门」之读法有异，标〔待核〕", "out": [{"rel": "see_also", "to_type": "term", "to_ref": "samadhi_puxian", "to_label": "普賢三昧", "note": ""}, {"rel": "see_also", "to_type": "term", "to_ref": "samadhi_shi", "to_label": "師子頻申三昧", "note": ""}], "in": []}, {"id": "realm_yema", "zh": "須夜摩天", "aliases": ["須夜摩天", "须夜摩天", "須夜摩天王", "夜摩天"], "category": "realm", "grade": "A1", "status": "used", "def_zh": "六欲天之第三，位在三十三天之下、兜率之上。T279 卷二作「復有無量須夜摩天王」，为组九 「时分天众」之总称；「时分」者，日夜之分半，夜摩天居半夜之位。", "def_en": "The Yama (Nyāgarāja) heaven, third of the six desire-realm heavens, standing below the Trāyastriṃśa and above the Tuṣita. T279 Book Two reads 復有無量須夜摩天王, the collective name of the group-nine assembly.", "source": "T10n0279 卷二〔梵名待核：汉译经典及《大智度论》以来「須夜摩」多对 Nāgapratyakṣa， 然此名含「不喜见」之义，与「厌夜」之义不合，历来即有异说，亦有作 Candraprabha、 Nanda 等说者，本篇不取定译〕", "source_url": "", "note": "", "in": [], "out": []}, {"id": "rejected_mahakala", "zh": "摩訶迦羅道場", "aliases": ["摩訶迦羅道場", "摩诃迦罗道场", "摩訶迦羅", "摩诃迦罗"], "category": "site", "grade": "D", "status": "rejected", "def_zh": "有以为八十华严卷首「菩提场」当作此名者。**经三道检验，此名不可据**： 一、经文检索——CBETA T10n0279 全文「摩訶迦羅」0 见，「摩竭提」9 见；本项目三版 （T279／袖珍版繁／简）卷二区间四形（摩訶迦羅／摩诃迦罗／摩竭迦羅／摩竭伽羅）0 见； 全库 1,292 件（96 MB）扫描 0 见，含海云继梦法师讲记 645 篇在内。 二、两译对照——八十卷作「摩竭提國阿蘭若法菩提場中」，六十卷作「摩竭提國寂滅道場」， 四十卷作「閻浮提摩竭提國菩提場中」，三译无一称「摩訶迦羅」。 三、历代注疏实检——澄观《七处九会颂释章》T45n1738 作「第一會在摩竭提國（此云不害國） 菩提場樹王之下」；澄观《华严经疏》T35n1735 作「初會菩提場」；皇龙寺释表员《华严经文义要决问答》 X37n0237 作「摩竭提國菩提場中」；《华严经三十九品大意》X42n0242 作「初會菩提場」； 《佛学大辞典》及维基百科「华严经」条亦作「（初会）菩提场」。", "def_en": "A name sometimes given for the site of the Buddha's awakening. **Rejected**: it occurs in none of the three Avataṃsaka translations nor in any known commentary — a threefold search of the scriptures, the canonical commentaries, and this project's 1,292 files (96 MB) returns zero occurrences. The texts and the commentaries uniformly read bodhimaṇḍa (\"bodhi-site\"). Not used in the body of this study.", "source": "证否依据见 definition_zh 之三重检验", "source_url": "", "note": "讹因推断：此名或系将「摩竭提」（Magadha，此云不害国）与密教「摩訶迦羅」／大黑天 一名混同所造。〔存疑：属本文推断，无直接文献可据〕惟「不见于经与历代注疏」之前半 已由三重检验坐实，与后半之推断应分别看待。", "in": [{"from": "site_bodhimaṇḍa", "rel": "see_also", "to_type": "term", "to_ref": "rejected_mahakala", "to_label": "已否之名：摩訶迦羅道場", "note": ""}], "out": []}, {"id": "samadhi_haiyin", "zh": "海印三昧", "aliases": ["海印三昧"], "category": "doctrine", "grade": "A1", "status": "used", "def_zh": "华严核心三昧名，一切种智现起如海印印现万法，澄观疏广释之。", "def_en": "The \"seal-of-the-ocean samādhi\" — the Huayan samādhi in which the all-reflexive knowledge displays all dharmas as a seal imprints the ocean.", "source": "T10n0279；计数：3／3／0", "source_url": "", "note": "", "in": [], "out": []}, {"id": "samadhi_puxian", "zh": "普賢三昧", "aliases": ["普贤三昧"], "category": "doctrine", "grade": "A1", "status": "used", "def_zh": "《普贤三昧品》（卷七）之名。", "def_en": "The samādhi of Samantabhadra, named in the title of its chapter (fascicle 7).", "source": "T10n0279 卷七；计数：1／0／0", "source_url": "", "note": "", "in": [{"from": "puxian", "rel": "see_also", "to_type": "term", "to_ref": "samadhi_puxian", "to_label": "普賢三昧", "note": ""}], "out": []}, {"id": "samadhi_rulaizang", "zh": "如來藏三昧", "aliases": ["如来藏三昧", "如來淨藏三昧"], "category": "doctrine", "grade": "A1", "status": "used", "def_zh": "八十卷作「如来藏三昧」，六十卷作「如来净藏三昧」——版本异名。 澄观以此三昧摄受「胜天王出现品」等，属注疏判摄。", "def_en": "The \"tathāgatagarbha samādhi\" (samādhi of the Tathāgata-garbha); the Sixty-fascicle version names it \"Tathāgata's pure garbha.\"", "source": "T10n0279／T09n0278；计数：1／1／1", "source_url": "", "note": "", "out": [{"rel": "see_also", "to_type": "term", "to_ref": "huazang_shijiehai", "to_label": "蓮華藏世界海", "note": ""}], "in": []}, {"id": "samadhi_shi", "zh": "師子頻申三昧", "aliases": ["师子频申三昧", "狮子频申三昧"], "category": "doctrine", "grade": "A1", "status": "used", "def_zh": "《入法界品》中佛所入之三昧；澄观《疏》分「本」「末」二会即以此三昧之摄受为据。", "def_en": "The \"lion's-roar samādhi\" entered by the Buddha in the Chapter of Entering the Dharma Realm; Chengguan's division of that chapter into two assemblies turns on it.", "source": "T10n0279；计数：3／0／3", "source_url": "", "note": "", "in": [{"from": "puxian", "rel": "see_also", "to_type": "term", "to_ref": "samadhi_shi", "to_label": "師子頻申三昧", "note": ""}], "out": []}, {"id": "seven_places_nine_assemblies", "zh": "七處九會", "aliases": ["七处九会", "七處九會頌", "七处九会颂"], "category": "method", "grade": "A2", "status": "used", "def_zh": "将《华严经》全经依「七处」分作「九会」之判摄法。**经文无此四字**， 首倡者为唐澄观《新译华严经七处九会颂释章》（T45n1738）。 初会于菩提场，第六会后第七会重于普光法堂，第九会于逝多林大庄严严阁。", "def_en": "The division of the whole Avataṃsaka into \"nine assemblies\" at \"seven places.\" **These four words do not occur in the scripture**: the classification is Chengguan's, first systematically set out in his *Xin yi Huayan jing qichu jiuhui song shizhang* (T45n1738). It must therefore be cited as \"Chengguan's commentary classifies it as…\" and not as scripture wording.", "source": "澄观撰《新译华严经七处九会颂释章》T45n1738（首倡）。**卷首《释章序》署「沙门典寿谨撰」**， 故部分目录（CBETA 检索页、Zensoul、deerpark）取序作者为作者而题作「典寿」；正文署 「清凉山大华严寺沙门澄观撰述」，维基文库亦题作者澄观。引用宜两者并列。", "source_url": "", "note": "澄观判第七会（重普光）之经文实证：八十华严《十定品》首「爾時，世尊在摩竭提國 阿蘭若法菩提場中始成正覺，於普光明殿入剎那際諸佛三昧」。晋译缺《十定品》， 故晋译本只有八会——T45n1738 自述「覺賢三藏不得十定品梵本……是故唯八會耳」， 「喜學三藏得十定品即分明知十地品是他化天會，十定等十一品是普光重會，故開為九會耳」， 与经文完全吻合。又序中言此书「僅一萬三千餘言，較之疏鈔不及百之一」，明预设《疏》《钞》 已在，故**不可**称其撰于《疏》前（舊說已刪）。", "out": [{"rel": "defined_by", "to_type": "external", "to_ref": "T45n1738", "to_label": "澄观《新译华严经七处九会颂释章》", "note": ""}, {"rel": "located_at", "to_type": "term", "to_ref": "site_bodhimaṇḍa", "to_label": "摩竭提國阿蘭若法菩提場", "note": ""}, {"rel": "located_at", "to_type": "term", "to_ref": "site_jetavana", "to_label": "室羅筏國逝多林給孤獨園大莊嚴嚴閣", "note": ""}, {"rel": "located_at", "to_type": "term", "to_ref": "site_paranirmita", "to_label": "他化自在天王宮摩尼寶藏殿", "note": ""}, {"rel": "located_at", "to_type": "term", "to_ref": "site_puguang", "to_label": "普光法堂／普光明殿", "note": ""}, {"rel": "located_at", "to_type": "term", "to_ref": "site_trayastriṃśa", "to_label": "忉利天宮", "note": ""}, {"rel": "located_at", "to_type": "term", "to_ref": "site_tuṣita", "to_label": "兜率陀天一切妙寶所莊嚴殿", "note": ""}, {"rel": "located_at", "to_type": "term", "to_ref": "site_yema", "to_label": "夜摩天宮寶莊嚴殿", "note": ""}], "in": []}, {"id": "site_bodhimaṇḍa", "zh": "摩竭提國阿蘭若法菩提場", "aliases": ["摩竭提國阿蘭若法菩提場中", "阿蘭若法菩提場", "菩提場", "菩提场"], "category": "site", "grade": "A1", "status": "used", "def_zh": "八十华严卷一开篇「一時佛在摩竭提國阿蘭若法菩提場中，始成正覺」之场所， 即佛于鹿野苑菩提树下降魔成道之地，为七处九会之初会所在。", "def_en": "The site of the Buddha's enlightenment — \"at that time the Buddha was in the bodhimaṇḍa of the Aranya hermitage in Magadha, at the time of his first proper awakening\" — the place of the first of the seven places / nine assemblies.", "source": "T10n0279 卷一（八十华严）；三经计数：阿兰若法菩提场 4／0／0", "source_url": "", "note": "六十卷同处作「摩竭提國寂滅道場」（3 见），四十卷作「閻浮提摩竭提國菩提場中」", "out": [{"rel": "same_as", "to_type": "term", "to_ref": "er_xian_ahai", "to_label": "摩竭提國", "note": ""}, {"rel": "see_also", "to_type": "term", "to_ref": "rejected_mahakala", "to_label": "已否之名：摩訶迦羅道場", "note": ""}], "in": [{"from": "seven_places_nine_assemblies", "rel": "located_at", "to_type": "term", "to_ref": "site_bodhimaṇḍa", "to_label": "摩竭提國阿蘭若法菩提場", "note": ""}]}, {"id": "site_jetavana", "zh": "室羅筏國逝多林給孤獨園大莊嚴嚴閣", "aliases": ["室羅筏国逝多林给孤独园大庄严严阁", "逝多林", "給孤獨園"], "category": "site", "grade": "A1", "status": "used", "def_zh": "第九会之场所。经文作此全称；四十华严开篇亦在此（逝多林 25 见）。 须注意第七、八会「重普光法堂」，非在给孤独园，故给孤独园只当第九会。", "def_en": "Jeta-grove (Jetavana) in Śrāvastī — \"the Great Adorned Pavilion in the Jeta Grove of the solitary-sage's park in Śrāvastī\" — site of the ninth assembly. (The seventh and eighth assemblies are the *repeated* Puguang hall, not this grove.)", "source": "T10n0279 卷六十；计数：逝多林 25／0／29", "source_url": "", "note": "", "in": [{"from": "seven_places_nine_assemblies", "rel": "located_at", "to_type": "term", "to_ref": "site_jetavana", "to_label": "室羅筏國逝多林給孤獨園大莊嚴嚴閣", "note": ""}], "out": []}, {"id": "site_paranirmita", "zh": "他化自在天王宮摩尼寶藏殿", "aliases": ["他化自在天王宫摩尼宝藏殿"], "category": "site", "grade": "A1", "status": "used", "def_zh": "第六会之场所。经文「他化自在天王宫摩尼宝藏殿」。", "def_en": "The heaven of Self-Transformation — the \"Hall of the Jewel-Treasure in the palace of the King of Self-Transformation\" — site of the sixth assembly.", "source": "T10n0279 卷三十四", "source_url": "", "note": "", "in": [{"from": "seven_places_nine_assemblies", "rel": "located_at", "to_type": "term", "to_ref": "site_paranirmita", "to_label": "他化自在天王宮摩尼寶藏殿", "note": ""}, {"from": "tian_cheng_zizai", "rel": "located_at", "to_type": "term", "to_ref": "site_paranirmita", "to_label": "他化自在天王宮摩尼寶藏殿（第六会）", "note": ""}], "out": []}, {"id": "site_puguang", "zh": "普光法堂／普光明殿", "aliases": ["普光法堂", "普光明殿"], "category": "site", "grade": "A1", "status": "used", "def_zh": "第二会之场所。八十华严作「摩竭提國阿蘭若法菩提場中普光明殿」（3 见）， 六十卷作「寂灭道场初始得佛普光法堂」（2 见），同处而名异。", "def_en": "Site of the second assembly: in the Eighty-fascicle scripture the \"Hall of Universal Light\" within the bodhimaṇḍa in Magadha; in the Sixty-fascicle version, the \"Hall of Universal Light at the site of calming and extinction.\"", "source": "T10n0279 卷十六、卷四十；T09n0278；计数：普光法堂 1／2／0，普光明殿 3／0／0", "source_url": "", "note": "", "in": [{"from": "seven_places_nine_assemblies", "rel": "located_at", "to_type": "term", "to_ref": "site_puguang", "to_label": "普光法堂／普光明殿", "note": ""}], "out": []}, {"id": "site_trayastriṃśa", "zh": "忉利天宮", "aliases": ["忉利天宮", "帝釋宮", "忉利护世龙神处"], "category": "site", "grade": "A1", "status": "used", "def_zh": "第三会之场所（帝释天宫）。经称「向于彼夜摩天宫」、称帝释宫、称「忉利护世龙神处」； 「妙胜」见于本品六见。", "def_en": "The Trāyastriṃśa heaven — the palace of Indra (Śakra), site of the third assembly.", "source": "T10n0279 卷十六；计数：忉利天 11／2／8，妙胜 6／0／0", "source_url": "", "note": "澄观《颂释章》于此会称「忉利天宫妙胜殿」，殿名属注疏判摄（A2），经文作「帝釋宮」", "in": [{"from": "seven_places_nine_assemblies", "rel": "located_at", "to_type": "term", "to_ref": "site_trayastriṃśa", "to_label": "忉利天宮", "note": ""}], "out": []}, {"id": "site_tuṣita", "zh": "兜率陀天一切妙寶所莊嚴殿", "aliases": ["兜率陀天一切妙宝所庄严殿", "兜率天宫一切宝殿"], "category": "site", "grade": "A1", "status": "used", "def_zh": "第五会之场所。经文「而往诣于兜率陀天一切妙宝所庄严殿」；品题作「升兜率天宫一切宝殿品」。", "def_en": "The Tuṣita heaven — site of the fifth assembly.", "source": "T10n0279 卷二；计数：兜率陀 24／26／7", "source_url": "", "note": "", "in": [{"from": "seven_places_nine_assemblies", "rel": "located_at", "to_type": "term", "to_ref": "site_tuṣita", "to_label": "兜率陀天一切妙寶所莊嚴殿", "note": ""}], "out": []}, {"id": "site_yema", "zh": "夜摩天宮寶莊嚴殿", "aliases": ["夜摩天宮寶莊嚴殿", "夜摩天宝庄严殿"], "category": "site", "grade": "A1", "status": "used", "def_zh": "第四会之场所。经文「而向于彼夜摩天宫宝庄严殿」。", "def_en": "The Yama heaven — \"the Palace of Precious Adornment in the Yama heaven\" — site of the fourth assembly.", "source": "T10n0279 卷十九；计数：宝庄严殿 1／2／0", "source_url": "", "note": "", "in": [{"from": "seven_places_nine_assemblies", "rel": "located_at", "to_type": "term", "to_ref": "site_yema", "to_label": "夜摩天宮寶莊嚴殿", "note": ""}], "out": []}, {"id": "sky_yanhai", "zh": "妙焰海大自在天王", "aliases": ["妙焰海大自在天王", "妙燄海大自在天王", "妙焰海天王", "妙燄海天王"], "category": "figure", "grade": "A1", "status": "used", "def_zh": "卷二组一领众之首名，得「法界虚空界寂静方便力解脱门」。本地《大华严寺袖珍版》繁本作 「妙燄海」，CBETA T279 作「妙焰海」，二者为同词异写（见正文 1.5 底本用字差异表第 2 条）。", "def_en": "Miao Yan Hai, the Great Freedom King — \"Ocean of Wondrous Flames.\" First-listed leader of the first group of Book Two, attaining the gate of the power of skillful means and stillness of dharmadhātu and ākāśadhātu. The local 袖珍版 recension writes 妙燄海 where T279 writes 妙焰海; the two are orthographic variants of one name.", "source": "T10n0279 卷二「所謂：妙焰海大自在天王，得法界虛空界寂靜方便力解脫門」；卷一列名作 「妙焰海天王」。本批校勘：原文「復次妙燄海大自在天王」系两处之误（T279 无「復次」， 且作「焰」不作「燄」），已订正，见正文 1.6 校勘记第 18 条", "source_url": "", "note": "〔待核〕此名之梵拼本篇未取定译。卷二此组无「復次」一词，卷二首组系承卷一「所謂：」 句续列众名，由「列名」入「得门」，不可与卷一文句混读。", "in": [], "out": []}, {"id": "ten_mysterious_gates", "zh": "十玄", "aliases": ["十玄", "十玄門"], "category": "doctrine", "grade": "A2", "status": "used", "def_zh": "澄观《华严经疏》玄谈门所立之十门（同时具足、普遍周备、理事无碍、事事无碍等）， 为华严宗判教之核心。**经文无「十玄」二字**，属注疏判摄名，引用须标「澄观《疏》语」。", "def_en": "The \"ten mysterious gates,\" Chengguan's tenfold classification in the introductory *xuántán* section of his commentary. **The term does not occur in the scripture**; it is a classificatory coinage and must be cited as Chengguan's.", "source": "澄观《华严经疏》T35n1735 玄谈门（首倡）；本经 0／0／0", "source_url": "", "note": "十玄门名之经文零见，故不可作经文引", "out": [{"rel": "defined_by", "to_type": "external", "to_ref": "T35n1735", "to_label": "澄观《华严经疏》玄谈门（首倡）", "note": ""}], "in": []}, {"id": "tian_cheng_kle_faguangmingshuang", "zh": "可愛樂法光明幢天王", "aliases": ["可爱乐法光明幢天王", "可爱乐法光明幢", "法光明幢"], "category": "person", "grade": "A1", "status": "used", "def_zh": "卷二组二之首众，领少广、无量广、广果三天天众（第四禅）。「幢」（dvaja）者高显之标， 以佛法之光明为幢、为众生所乐见，故名。其头门为「普观一切众生根为说法断疑解脱门」。", "def_en": "Leader of Book Two, group two, over the little-vast, immeasurably-vast, and vast-fruit heavens (fourth dhyāna). \"幢\" (dvaja) is a tall standard: the Banner of Dharma-Radiance that beings love to behold. His head-gate: the liberation-gate of contemplating the faculties of all beings, teaching the Dharma for them, and cutting off their doubt.", "source": "T10n0279 卷二（八十华严）", "source_url": "", "note": "卷一「色界天五众」有广果天；卷二组二于此下开出少广、无量广、广果三层而颂之", "out": [{"rel": "attains", "to_type": "term", "to_ref": "men_puguan_gen", "to_label": "普观一切众生根为说法断疑解脱门（组二头门）", "note": ""}], "in": [{"from": "men_yimaokong", "rel": "member_door_of", "to_type": "term", "to_ref": "tian_cheng_kle_faguangmingshuang", "to_label": "乐寂静天王之门（组二）", "note": ""}]}, {"id": "tian_cheng_kle_guangming", "zh": "可愛樂光明天王", "aliases": ["可爱乐光明天王", "可爱乐光明"], "category": "person", "grade": "A1", "status": "used", "def_zh": "卷二组四之首众，领少光、无量光、极光三天天众（第二禅）。十王之名带「音」者五位 （自在音、可爱乐净妙音、善思惟音、演庄严音、甚深光音），与天名「光音」相映。 其头门为「恒受寂静乐而能降现消灭世间苦解脱门」。", "def_en": "Leader of Book Two, group four, over the few-light, immeasurable-light, and extreme-light heavens (second dhyāna). Five of the ten kings carry 音 in their names, mirroring the heaven's own name 光音 (ābhāsvara). Head-gate: ever receiving the stillness-freedom yet descending to extinguish the world's suffering.", "source": "T10n0279 卷二（八十华严）", "source_url": "", "note": "", "out": [{"rel": "leads", "to_type": "term", "to_ref": "tian_guangyin", "to_label": "光音（极光）天·本组所领", "note": ""}], "in": []}, {"id": "tian_cheng_shijie_dafan", "zh": "尸棄大梵王", "aliases": ["尸弃大梵王", "尸棄梵王", "尸弃梵王", "尸弃"], "category": "person", "grade": "A1", "status": "used", "def_zh": "卷二组五之首众，领梵身、梵辅、梵众、大梵四天天众（初禅），初禅大梵天之天主。 梵言 Śikhin，义为「有顶髻」。其头门为「普住十方道场中说法而所行清净无染著解脱门」； 领起之语袖珍版作「承佛神力」（T279 另二处以威神/神力，见正文 3.2 注①）。", "def_en": "Leader of Book Two, group five, over the four Brahma heavens of the first dhyāna; the Great Brahmā king. Skt. Śikhin, \"wearing the top-knot.\" His verses open with 承佛神力 in the 袖珍版 kept here, the only group so distinguished (see note 3.2 ①).", "source": "T10n0279 卷二（八十华严）", "source_url": "", "note": "", "in": [], "out": []}, {"id": "tian_cheng_zizai", "zh": "自在天王", "aliases": ["自在天王", "他化自在天王"], "category": "person", "grade": "A1", "status": "used", "def_zh": "卷二组六之首众，欲界六天最上「他化自在天」（paranirmita-vaśavartin）之天主， 卷二由色界入欲界之首组。其头门为「现前成熟无量众生自在藏解脱门」； 领起之语 T279 作「承佛威神，遍观」，袖珍版作「承佛威力，普观」（见正文 3.2 注①）。 第六会即于「他化自在天王宫摩尼宝藏殿」开演，领众适为彼会之天主。", "def_en": "Leader of Book Two, group six, the lord of Paranirmita-vaśavartin (他化自在), topmost of the six desire heavens — the group that carries Book Two down into the desire realm, the same lord whose palace hosts the sixth assembly (graph node site_paranirmita).", "source": "T10n0279 卷二（八十华严）", "source_url": "", "note": "", "out": [{"rel": "located_at", "to_type": "term", "to_ref": "site_paranirmita", "to_label": "他化自在天王宮摩尼寶藏殿（第六会）", "note": ""}], "in": []}, {"id": "tian_guangyin", "zh": "光音天（極光天）", "aliases": ["光音天", "极光天", "極光天", "少光天", "无量光天", "無量光天"], "category": "site", "grade": "A1", "status": "used", "def_zh": "二禅三天（少光、无量光、极光）之上首，梵 ābhāsvara，以光为语、不以音声相传，故名光音。 卷二组四所领，五王名带「音」，正与天名相映。卷一「色界天五众」之第二即光音天。", "def_en": "The topmost of the three second-dhyāna heavens (few-light, immeasurable-light, extreme-light); Skt. ābhāsvara, \"the heaven of light-sound,\" whose beings converse by light. It is the second of the five form-realm hosts of fascicle one (\"色界天五众\").", "source": "T10n0279 卷一、卷二（八十华严）", "source_url": "", "note": "", "in": [{"from": "tian_cheng_kle_guangming", "rel": "leads", "to_type": "term", "to_ref": "tian_guangyin", "to_label": "光音（极光）天·本组所领", "note": ""}], "out": []}, {"id": "tian_rigong", "zh": "日宮", "aliases": ["日宮", "日宫", "日天子宮"], "category": "site", "grade": "A1", "status": "used", "def_zh": "日天子所居之宫。组十一领众作「日天子」（不作「日天王」），T279 领起作「承佛威力， 遍观一切日天子众而说颂言」（遍观）。此门诸子名多带「光明」「眼」「宝月」， 以日之光明普照为义。", "def_en": "The sun-deities' palace. The group's lord is styled 日天子 (not 日天王); its gates turn on light: 光明、眼、宝月 recur, for the sun's all-illuminating radiance.", "source": "T10n0279 卷二（八十华严）", "source_url": "", "note": "", "out": [{"rel": "see_also", "to_type": "term", "to_ref": "men_riguang_zhao", "to_label": "日天子组十一头门（净光普照·常为利益）", "note": ""}, {"rel": "see_also", "to_type": "term", "to_ref": "tian_yuegong", "to_label": "日宫·月宫（日月二众，卷二降序之末二组）", "note": ""}], "in": []}, {"id": "tian_sanshiyisi", "zh": "三十三天（忉利天）", "aliases": ["三十三天", "忉利天", "善業天"], "category": "site", "grade": "A1", "status": "used", "def_zh": "欲界第二层天（在他化自在、化乐、兜率、须夜摩之下）。本组领众作「释迦因陀罗天王」 （Śakra＝帝釋，「釋迦」即釋提桓因），故组十颂末句称其众为「一切三十三天众」。 其门名多就「忆念」「见佛」「福业生」立，与帝釋天之主位相应。", "def_en": "The second heaven of the desire realm. Its lord is Śakra (帝釋天, 釋迦／因陀羅), hence Book Two group ten is headed by 釋迦因陀羅天王 and its verses close on the 三十三天.", "source": "T10n0279 卷二（八十华严）", "source_url": "", "note": "", "out": [{"rel": "see_also", "to_type": "term", "to_ref": "men_jiniyaocha", "to_label": "释迦因陀罗天王组十头门（忆念·明见）", "note": ""}], "in": []}, {"id": "tian_yuegong", "zh": "月宮殿", "aliases": ["月宮殿", "月宫殿", "月宮", "月宫"], "category": "site", "grade": "A1", "status": "used", "def_zh": "月天子所居之宫殿。组十二为卷二最末一组，颂前唯作「承佛神力」（T279）、 领起作「普观一切月宫殿中诸天众会而说颂曰」（说颂曰，为卷二唯一）， 与卷二「由色界顶大自在、经欲界六天讫月天」之降序相配。", "def_en": "The moon-deities' palace-halls. Group twelve is the last of Book Two; its lead-in is the only 承佛神力 in the fascicle (per T279) and the only 「而說頌曰」, and it closes the descent from the form-realm's summit down through the six desire-heavens to the moon.", "source": "T10n0279 卷二（八十华严）", "source_url": "", "note": "组十二颂首「佛放光明遍世间，照耀十方诸国土」与卷二组一首偈「佛身普遍诸大会」 皆以「光明／普遍」起——卷二以光明始、以光明终（见 3.15、3.16）", "out": [{"rel": "see_also", "to_type": "term", "to_ref": "men_yueguang_shehua", "to_label": "月天子组十二头门（净光普照法界·摄化）", "note": ""}], "in": [{"from": "tian_rigong", "rel": "see_also", "to_type": "term", "to_ref": "tian_yuegong", "to_label": "日宫·月宫（日月二众，卷二降序之末二组）", "note": ""}]}], "links": [{"from": "chapter_shizhu", "rel": "commented_by", "to_type": "external", "to_ref": "T35n1735", "to_label": "澄观《华严经疏》卷一至卷六", "note": ""}, {"from": "chapter_shizhu", "rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_01_chiguo", "to_label": "卷三组一·持國乾闥婆王（10 门 10 偈）", "note": ""}, {"from": "chapter_shizhu", "rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_02_zengzhang", "to_label": "卷三组二·增長鳩槃荼王（10 门 10 偈）", "note": ""}, {"from": "chapter_shizhu", "rel": "contains_group", "to_type": "term", "to_ref": "grp_j3_03_pilouboxia", "to_label": "卷三组三·毘樓博叉龍王（11 门 11 偈）", "note": ""}, {"from": "chapter_shizhu", "rel": "contains_group", "to_type": "term", "to_ref": "
