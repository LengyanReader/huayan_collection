  function skip(node){
    var p = node.parentElement;
    while(p && p !== document.body){
      var tag = p.tagName;
      if(tag==='A'||tag==='CODE'||tag==='PRE'||tag==='BLOCKQUOTE') return true;
      var cls = p.getAttribute ? (p.getAttribute('class')||'') : '';
      if(/\b(q|quote|cite-card|lic)\b/.test(cls)) return true;
      p = p.parentElement;
    }
    return false;
  }
  function linkify(){
    var root = document.getElementById('article-root');
    if(!root) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var edits = [];
    var tn;
    while((tn = walker.nextNode())){
      if(skip(tn)) continue;
      var text = tn.textContent;
      for(var i=0;i<NAMES.length;i++){
        var nm = NAMES[i], pos = text.indexOf(nm);

    }

})();

var ARTICLE = {"id": "huayan-shidi-pin", "file": "articles/huayan-shidi-pin.html", "title": "九九华严第二十四品 十地品之拼读", "title_sub": "第六会首品·他化自在天宫·卷三十四～四十·品文43413（跨七卷）·金刚藏菩萨说十地（欢喜→法云=十波罗蜜增上）·解脱月三请·L.266骨架成文", "icon": "⛰", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第六会_他化自在天宫_十地位/华严经细读_第二十四部_十地品.md", "doc_md": "# 华严经细读·第二十四部《十地品》之拼读\n\n> **EN · Close Reading of the Avataṃsaka Sūtra, Part Twenty-Four: The Chapter of the Ten Stages**\n\n> **底本**：唐·实叉难陀译《大方广佛华严经》（八十华严）`T10n0279`。**范围：卷第三十四～四十（品号第二十六·本品全文·跨七卷）**。本品属**第六会「他化自在天宫会」·十地位**，金刚藏菩萨入定受加，说十地之行相——**全经教义最高峰之一**。\n\n---\n\n## 〇、凡例（简要）\n\n一、**校勘底本**：八十华严 `T10n0279` 为底本。\n二、**引文可回源**：经文程序注入（0 手抄）。\n三、**疏解三层**：疏解/名相/会读。\n四、**存疑必标**〔待核〕〔本文判断〕。\n五、**体量自陈**：本品 43,413 CJK·跨七卷。核心成文以骨架＋十地名目为纲；各地完整经文由深化批补全〔预登记〕。\n\n## 一、概述与品题解义\n\n### 1.1 品题释义\n\n**品名**：**十地品第二十六**（八十华严第二十六品·跨卷三十四～四十）。说主：**金剛藏菩薩**（承佛神力入智光三昧说）。**「地」**（*bhūmi*）＝菩萨修行之十个阶段，每一地为修行之基台、生长之处。\n\n**会位**：第六会「他化自在天宫会」——**十地位**。前三会序列（住→行→向）至此升入**地**——回向满故入地，地是修行之**实证阶位**。\n\n### 1.2 十地总表\n\n| 地 | 名 | 义 |\n|---|---|---|\n| 1 | 歡喜地 | 初发心住·成就信悲（檀波罗蜜增上） |\n| 2 | 離垢地 | 离犯戒垢·持戒清净（戒波罗蜜增上） |\n| 3 | 發光地 | 成就智慧·发光相应（忍波罗蜜增上） |\n| 4 | 焰慧地 | 菩提分法·烧烦恼薪（进波罗蜜增上） |\n| 5 | 難勝地 | 真俗二智·行互相违（禅波罗蜜增上） |\n| 6 | 現前地 | 般若现前·缘起观察（慧波罗蜜增上） |\n| 7 | 遠行地 | 远行至彼岸·功用究竟（方便波罗蜜增上） |\n| 8 | 不動地 | 不为烦恼动·无相无间（愿波罗蜜增上） |\n| 9 | 善慧地 | 成就妙智·说法无畏（力波罗蜜增上） |\n| 10 | 法雲地 | 法身如云·遍覆一切（智波罗蜜增上） |\n\n### 1.3 篇幅结构\n\n**实测**：品文净 **43,413 CJK**（跨七卷·**264 `<p>`**＋**27 `<lg>`**＋98 页）。结构：**序分（他化天宫集会）→金刚幢入定→解脱月三请→金刚藏说十地（每地含入地心·行相·利益）→重颂多组→流通**。\n\n## 二、卷第三十四～四十（十地品第二十六·本品骨架）\n\n### 2.1 序分·他化天宫集会\n\n> 「爾時，世尊在他化自在天王宮摩尼寶藏殿……」\n\n### 2.2 十地各说（骨架·深化批逐地补全）\n\n**（一）欢喜地**：初入圣地，成就信悲，檀波罗蜜增上——「愿一切众生，离苦得乐」。\n\n**（二）离垢地**：持戒清净，离犯戒垢——戒律圆满，身心无瑕。\n\n**（三）发光地**：成就智慧，发光相应——禅定得法光，闻持陀罗尼。\n\n**（四）焰慧地**：菩提分法，烧烦恼薪——智慧如火，焚烧惑障。\n\n**（五）难胜地**：真俗二智，行互相违——二智相合，难胜诸魔。\n\n**（六）现前地**：般若现前，缘起观察——十二缘起·第一义谛现前。\n\n**（七）远行地**：远行至彼岸，功用究竟——方便波罗蜜圆满，入菩萨道远行。\n\n**（八）不动地**：不为烦恼动，无相无间——无功用行，愿波罗蜜圆满。\n\n**（九）善慧地**：成就妙智，说法无畏——力波罗蜜圆满，四无碍辩。\n\n**（十）法云地**：法身如云，遍覆一切——智波罗蜜圆满，受法王位。\n\n\n\n**〔L.285 批·注入10,545 CJK·0 手抄〕**\n\n**（1）歡喜地**——增上：檀波罗蜜增上｜多作：—（全文）：\n\n> 十地品之一十地品第二十六之一爾時，世尊在他化自在天王宮摩尼寶藏殿，與大菩薩眾俱。其諸菩薩皆於阿耨多羅三藐三菩提不退轉，悉從他方世界來集；住一切菩薩智所住境，入一切如來智所入處；勤行不息，善能示現種種神通諸所作事，教化調伏一切眾生而不失時；為成菩薩一切大願，於一切世、一切劫、一切剎，勤修諸行，無暫懈息；具足菩薩福智助道，普益眾生而恒不匱；到一切菩薩智慧方便究竟彼岸，示入生死及以涅槃而不廢捨；修菩薩行，善入一切菩薩禪定、解脫三昧、三摩鉢底、神通明智，諸所施為皆得自在；獲一切菩薩自在神力，於一念頃無所動作，悉能往詣一切如來道場眾會，為眾上首，請佛說法，護持諸佛正法之輪；以廣大心供養承事一切諸佛，常勤修習一切菩薩所行事業；其身普現一切世間，其音普及十方法界，心智無礙，普見三世；一切菩薩所有功德悉已修行而得圓滿，於不可說劫說不能盡。其名曰：金剛藏菩薩、寶藏菩薩、蓮華藏菩薩、德藏菩薩、蓮華德藏菩薩、日藏菩薩、蘇利耶藏菩薩、無垢月藏菩薩、於一切國土普現莊嚴藏菩薩、毘盧遮那智藏菩薩、妙德藏菩薩、栴檀德藏菩薩、華德藏菩薩、俱蘇摩德藏菩薩、優鉢羅德藏菩薩、天德藏菩薩、福德藏菩薩、無礙清淨智德藏菩薩、功德藏菩薩、那羅延德藏菩薩、無垢藏菩薩、離垢藏菩薩、種種辯才莊嚴藏菩薩、大光明網藏菩薩、淨威德光明王藏菩薩、金莊嚴大功德光明王藏菩薩、一切相莊嚴淨德藏菩薩、金剛焰德相莊嚴藏菩薩、光明焰藏菩薩、星宿王光照藏菩薩、虛空無礙智藏菩薩、妙音無礙藏菩薩、陀羅尼功德持一切眾生願藏菩薩、海莊嚴藏菩薩、須彌德藏菩薩、淨一切功德藏菩薩、如來藏菩薩、佛德藏菩薩、解脫月菩薩……。如是等無數無量、無邊無等、不可數、不可稱、不可思、不可量、不可說諸菩薩摩訶薩眾，金剛藏菩薩而為上首。爾時，金剛藏菩薩承佛神力，入菩薩大智慧光明三昧。入是三昧已，即時十方各過十億佛剎微塵數世界外，各有十億佛剎微塵數諸佛，同名：金剛藏，而現其前，作如是言：「善哉善哉！金剛藏！乃能入是菩薩大智慧光明三昧。善男子！此是十方各十億佛剎微塵數諸佛共加於汝，以毘盧遮那如來、應、正等覺本願力故，威神力故，亦是汝勝智力故，欲令汝為一切菩薩說不思議諸佛法光明故。所謂：令入智地故，攝一切善根故，善揀擇一切佛法故，廣知諸法故，善能說法故，無分別智清淨故，一切世法不染故，出世善根清淨故，得不思議智境界故，得一切智人智境界故；又令得菩薩十地始終故，如實說菩薩十地差別相故，緣念一切佛法故，修習分別無漏法故，善選擇觀察大智光明巧莊嚴故，善入決定智門故，隨所住處次第顯說無所畏故，得無礙辯才光明故，住大辯才地善決定故，憶念菩薩心不忘失故，成熟一切眾生界故，能遍至一切處決定開悟故。善男子！汝當辯說此法門差別善巧法。所謂：承佛神力如來智明所加故，淨自善根故，普淨法界故，普攝眾生故，深入法身、智身故，受一切佛灌頂故，得一切世間最高大身故，超一切世間道故，清淨出世善根故，滿足一切智智故。」爾時，十方諸佛與金剛藏菩薩無能映奪身，與無礙樂說辯，與善分別清淨智，與善憶念不忘力，與善決定明了慧，與至一切處開悟智，與成道自在力，與如來無所畏，與一切智人觀察分別諸法門辯才智，與一切如來上妙身、語、意具足莊嚴。何以故？得此三昧法如是故，本願所起故，善淨深心故，善淨智輪故，善積集助道故，善修治所作故，念其無量法器故，知其清淨信解故，得無錯謬總持故，法界智印善印故。爾時，十方諸佛各伸右手摩金剛藏菩薩頂。摩頂已，金剛藏菩薩從三昧起，普告一切菩薩眾言：「諸佛子！諸菩薩願善決定，無雜不可見，廣大如法界，究竟如虛空，盡未來際遍一切佛剎，救護一切眾生，為一切諸佛所護，入過去、未來、現在諸佛智地。佛子！何等為菩薩摩訶薩智地？佛子！菩薩摩訶薩智地有十種，過去、未來、現在諸佛，已說、當說、今說；我亦如是說。何等為十？一者歡喜地，二者離垢地，三者發光地，四者焰慧地，五者難勝地，六者現前地，七者遠行地，八者不動地，九者善慧地，十者法雲地。佛子！此菩薩十地，三世諸佛已說、當說、今說。佛子！我不見有諸佛國土，其中如來不說此十地者。何以故？此是菩薩摩訶薩向菩提最上道，亦是清淨法光明門，所謂：分別演說菩薩諸地。佛子！此處不可思議，所謂諸菩薩隨證智。」爾時，金剛藏菩薩說此菩薩十地名已，默然而住，不復分別。是時，一切菩薩眾聞菩薩十地名，不聞解釋，咸生渴仰，作如是念：「何因何緣，金剛藏菩薩唯說菩薩十地名而不解釋？」解脫月菩薩知諸大眾心之所念，以頌問金剛藏菩薩曰：「何故淨覺人，念智功德具，說諸上妙地，有力不解釋？一切咸決定，勇猛無怯弱，何故說地名，而不為開演？諸地妙義趣，此眾皆欲聞，其心無怯弱，願為分別說！眾會悉清淨，離懈怠嚴潔，能堅固不動，具功德智慧。相視咸恭敬，一切悉專仰，如蜂念好蜜，如渴思甘露。」爾時，大智無所畏金剛藏菩薩聞說是已，欲令眾會心歡喜故，為諸佛子而說頌言：「菩薩行地事，最上諸佛本，顯示分別說，第一希有難。微細難可見，離念超心地，出生佛境界，聞者悉迷惑。持心如金剛，深信佛勝智，知心地無我，能聞此勝法。如空中彩畫，如空中風相，牟尼智如是，分別甚難見。我念佛智慧，最勝難思議，世間無能受，默然而不說。」爾時，解脫月菩薩聞是說已，白金剛藏菩薩言：「佛子！今此眾會皆悉已集，善淨深心，善潔思念，善修諸行，善集助道，善能親近百千億佛，成就無量功德善根，捨離癡惑，無有垢染，深心信解，於佛法中不隨他教。善哉佛子！當承佛神力而為演說，此諸菩薩於如是等甚深之處皆能證知。」爾時，解脫月菩薩欲重宣其義而說頌曰：「願說最安隱，菩薩無上行，分別於諸地，智淨成正覺。此眾無諸垢，志解悉明潔，承事無量佛，能知此地義。」爾時，金剛藏菩薩言：「佛子！雖此眾集善淨思念，捨離愚癡及以疑惑，於甚深法不隨他教；然有其餘劣解眾生，聞此甚深難思議事，多生疑惑，於長夜中受諸衰惱。我愍此等，是故默然。」爾時，金剛藏菩薩欲重宣其義而說頌曰：「雖此眾淨廣智慧，甚深明利能決擇，其心不動如山王，不可傾覆猶大海。有行未久解未得，隨識而行不隨智，聞此生疑墮惡道，我愍是等故不說。」爾時，解脫月菩薩重白金剛藏菩薩言：「佛子！願承佛神力分別說此不思議法，此人當得如來護念而生信受。何以故？說十地時，一切菩薩法應如是，得佛護念。得護念故，於此智地能生勇猛。何以故？此是菩薩最初所行，成就一切諸佛法故。譬如書字、數說，一切皆以字母為本、字母究竟，無有少分離字母者。佛子！一切佛法皆以十地為本，十地究竟修行成就，得一切智。是故，佛子！願為演說！此人必為如來所護，令其信受。」爾時，解脫月菩薩欲重宣其義而說頌曰：「善哉佛子願演說，趣入菩提諸地行！十方一切自在尊，莫不護念智根本。此安住智亦究竟，一切佛法所從生，譬如書數字母攝，如是佛法依於地。」爾時，諸大菩薩眾一時同聲向金剛藏菩薩而說頌言：「上妙無垢智，無邊分別辯，宣暢深美言，第一義相應。念持清淨行，十力集功德，辯才分別義，說此最勝地。定戒集正心，離我慢邪見，此眾無疑念，唯願聞善說！如渴思冷水，如飢念美食，如病憶良藥，如蜂貪好蜜；我等亦如是，願聞甘露法！善哉廣大智，願說入諸地，成十力無礙，善逝一切行！」爾時，世尊從眉間出清淨光明，名：菩薩力焰明，百千阿僧祇光明以為眷屬，普照十方一切世界靡不周遍，三惡道苦皆得休息；又照一切如來眾會，顯現諸佛不思議力；又照十方一切世界，一切諸佛所加說法菩薩之身；作是事已，於上虛空中成大光明雲網臺而住。時，十方諸佛悉亦如是，從眉間出清淨光明，其光名號、眷屬、作業悉同於此，又亦照此娑婆世界佛及大眾，并金剛藏菩薩身、師子座已，於上虛空中成大光明雲網臺。時，光臺中，以諸佛威神力故而說頌言：「佛無等等如虛空，十力無量勝功德，人間最勝世中上，釋師子法加於彼。佛子當承諸佛力，開此法王最勝藏，諸地廣智勝妙行，以佛威神分別說。若為善逝力所加，當得法寶入其心，諸地無垢次第滿，亦具如來十種力。雖住海水劫火中，堪受此法必得聞，其有生疑不信者，永不得聞如是義。應說諸地勝智道，入住展轉次修習，從行境界法智生，利益一切眾生故。」爾時，金剛藏菩薩觀察十方，欲令大眾增淨信故而說頌曰：「如來大仙道，微妙難可知，非念離諸念，求見不可得。無生亦無滅，性淨恒寂然，離垢聰慧人，彼智所行處。自性本空寂，無二亦無盡，解脫於諸趣，涅槃平等住。非初非中後，非言辭所說，出過於三世，其相如虛空。寂滅佛所行，言說莫能及；地行亦如是，難說難可受。智起佛境界，非念離心道，非蘊界處門，智知意不及。如空中鳥迹，難說難可示；如是十地義，心意不能了。慈悲及願力，出生入地行，次第圓滿心，智行非慮境。是境界難見，可知不可說，佛力故開演，汝等應敬受。如是智入行，億劫說不盡，我今但略說，真實義無餘。一心恭敬待，我承佛力說，勝法微妙音，譬諭字相應。無量佛神力，咸來入我身，此處難宣示，我今說少分。第一地第一地「佛子！若有眾生深種善根，善修諸行，善集助道，善供養諸佛，善集白淨法，為善知識，善攝善清淨深心，立廣大志，生廣大解，慈悲現前，為求佛智故，為得十力故，為得大無畏故，為得佛平等法故，為救一切世間故，為淨大慈悲故，為得十方無餘智故，為淨一切佛剎無障礙故，為一念知一切三世故，為轉大法輪無所畏故。佛子！菩薩起如是心，以大悲為首，智慧增上，善巧方便所攝，最上深心所持，如來力無量，善觀察分別勇猛力、智力，無礙智現前、隨順自然智，能受一切佛法，以智慧教化，廣大如法界，究竟如虛空，盡未來際。佛子！菩薩始發如是心，即得超凡夫地，入菩薩位，生如來家，無能說其種族過失，離世間趣，入出世道，得菩薩法，住菩薩處，入三世平等，於如來種中決定當得無上菩提。菩薩住如是法，名：住菩薩歡喜地，以不動相應故。「佛子！菩薩住歡喜地，成就多歡喜、多淨信、多愛樂、多適悅、多欣慶、多踊躍、多勇猛、多無鬪諍、多無惱害、多無瞋恨。佛子！菩薩住此歡喜地，念諸佛故生歡喜，念諸佛法故生歡喜，念諸菩薩故生歡喜，念諸菩薩行故生歡喜，念清淨諸波羅蜜故生歡喜，念諸菩薩地殊勝故生歡喜，念菩薩不可壞故生歡喜，念如來教化眾生故生歡喜，念能令眾生得利益故生歡喜，念入一切如來智方便故生歡喜；復作是念：『我轉離一切世間境界故生歡喜，親近一切佛故生歡喜，遠離凡夫地故生歡喜，近智慧地故生歡喜，永斷一切惡趣故生歡喜，與一切眾生作依止處故生歡喜，見一切如來故生歡喜，生佛境界中故生歡喜，入一切菩薩平等性中故生歡喜，遠離一切怖畏毛豎等事故生歡喜。』何以故？此菩薩得歡喜地已，所有怖畏悉得遠離，所謂：不活畏、惡名畏、死畏、惡道畏、大眾威德畏，如是怖畏皆得永離。何以故？此菩薩離我想故，尚不愛自身，何況資財，是故無有不活畏；不於他所希求供養，唯專給施一切眾生，是故無有惡名畏；遠離我見，無有我想，是故無有死畏；自知死已，決定不離諸佛菩薩，是故無有惡道畏；我所志樂，一切世間無與等者，何況有勝！是故無有大眾威德畏。菩薩如是遠離驚怖毛豎等事。「佛子！此菩薩以大悲為首，廣大志樂無能沮壞，轉更勤修一切善根而得成就，所謂：信增上故，多淨信故，解清淨故，信決定故，發生悲愍故，成就大慈故，心無疲懈故，慚愧莊嚴故，成就柔和故，敬順尊重諸佛教法故，日夜修集善根無厭足故，親近善知識故，常愛樂法故，求多聞無厭足故，如所聞法正觀察故，心無依著故，不耽著利養、名聞、恭敬故，不求一切資生之物故，生如寶心無厭足故，求一切智地故，求如來力、無畏、不共佛法故，求諸波羅蜜助道法故，離諸諂誑故，如說能行故，常護實語故，不污如來家故，不捨菩薩戒故，生一切智心如山王不動故，不捨一切世間事成就出世間道故，集助菩提分法無厭足故，常求上上殊勝道故。佛子！菩薩成就如是淨治地法，名為：安住菩薩歡喜地。「佛子！菩薩住此歡喜地，能成就如是大誓願、如是大勇猛、如是大作用，所謂：『生廣大清淨決定解，以一切供養之具，恭敬供養一切諸佛，令無有餘；廣大如法界，究竟如虛空，盡未來際一切劫數無有休息。』又發大願：『願受一切佛法輪，願攝一切佛菩提，願護一切諸佛教，願持一切諸佛法；廣大如法界，究竟如虛空，盡未來際一切劫數無有休息。』又發大願：『願一切世界佛興于世，從兜率天宮沒、入胎、住胎、初生、出家、成道說法、示現涅槃，皆悉往詣，親近供養，為眾上首，受行正法，於一切處一時而轉；廣大如法界，究竟如虛空，盡未來際一切劫數無有休息。』又發大願：『願一切菩薩行廣大無量，不壞不雜，攝諸波羅蜜，淨治諸地，總相、別相、同相、異相、成相、壞相，所有菩薩行皆如實說，教化一切，令其受行，心得增長；廣大如法界，究竟如虛空，盡未來際一切劫數無有休息。』又發大願：『願一切眾生界有色、無色、有想、無想、非有想、非無想、卵生、胎生、濕生、化生，三界所繫，入於六趣一切生處，名色所攝，如是等類我皆教化，令入佛法，令永斷一切世間趣，令安住一切智智道；廣大如法界，究竟如虛空，盡未來際一切劫數無有休息。』又發大願：『願一切世界廣大無量，麁細亂住、倒住、正住，若入、若行、若去，如帝網差別，十方無量種種不同，智皆明了，現前知見；廣大如法界，究竟如虛空，盡未來際一切劫數無有休息。』又發大願：『願一切國土入一國土，一國土入一切國土，無量佛土普皆清淨，光明眾具以為莊嚴，離一切煩惱，成就清淨道，無量智慧眾生充滿其中，普入廣大諸佛境界，隨眾生心而為示現，皆令歡喜；廣大如法界，究竟如虛空，盡未來際一切劫數無有休息。』又發大願：『願與一切菩薩同一志行，無有怨嫉，集諸善根，一切菩薩平等一緣，常共集會，不相捨離，隨意能現種種佛身，任其自心能知一切如來境界威力智慧，得不退如意神通，遊行一切世界，現形一切眾會，普入一切生處，成就不思議大乘，修菩薩行；廣大如法界，究竟如虛空，盡未來際一切劫數無有休息。』又發大願：『願乘不退輪行菩薩行，身、語、意業悉不唐捐，若暫見者則必定佛法，暫聞音聲則得實智慧，纔生淨信則永斷煩惱，得如大藥王樹身，得如如意寶身，修行一切菩薩行；廣大如法界，究竟如虛空，盡未來際一切劫數無有休息。』又發大願：『願於一切世界成阿耨多羅三藐三菩提不離一毛端處，於一切毛端處皆悉示現初生、出家、詣道場、成正覺、轉法輪、入涅槃，得佛境界大智慧力，於念念中隨一切眾生心示現成佛令得寂滅，以一三菩提知一切法界即涅槃相，以一音說法令一切眾生心皆歡喜，示入大涅槃而不斷菩薩行，示大智慧地安立一切法，以法智通、神足通、幻通自在變化充滿一切法界；廣大如法界，究竟如虛空，盡未來際一切劫數無有休息。』「佛子！菩薩住歡喜地，發如是大誓願、如是大勇猛、如是大作用，以此十願門為首，滿足百萬阿僧祇大願。佛子！此大願以十盡句而得成就。何等為十？所謂：眾生界盡、世界盡、虛空界盡、法界盡、涅槃界盡、佛出現界盡、如來智界盡、心所緣界盡、佛智所入境界界盡、世間轉法轉智轉界盡。『若眾生界盡，我願乃盡；若世界乃至世間轉法轉智轉界盡，我願乃盡。而眾生界不可盡，乃至世間轉法轉智轉界不可盡故，我此大願善根無有窮盡。』「佛子！菩薩發如是大願已，則得利益心、柔軟心、隨順心、寂靜心、調伏心、寂滅心、謙下心、潤澤心、不動心、不濁心。成淨信者，有信功用：能信如來本行所入，信成就諸波羅蜜，信入諸勝地，信成就力，信具足無所畏，信生長不可壞不共佛法，信不思議佛法，信出生無中邊佛境界，信隨入如來無量境界，信成就果。舉要言之，信一切菩薩行，乃至如來智地說力故。「佛子！此菩薩復作是念：『諸佛正法，如是甚深，如是寂靜，如是寂滅，如是空，如是無相，如是無願，如是無染，如是無量，如是廣大。而諸凡夫心墮邪見，無明覆翳，立憍慢高幢，入渴愛網中，行諂誑稠林不能自出，心與慳嫉相應不捨，恒造諸趣受生因緣，貪、恚、愚癡積集諸業日夜增長，以忿恨風吹心識火熾然不息，凡所作業皆顛倒相應，欲流、有流、無明流、見流，相續起心意識種子，於三界田中復生苦芽。所謂：名色共生不離，此名色增長，生六處聚落，於中相對生觸，觸故生受，因受生愛，愛增長故生取，取增長故生有，有生故有生老死憂悲苦惱。如是眾生生長苦聚，是中皆空，離我、我所，無知、無覺，無作、無受，如草木石壁，亦如影像；然諸眾生不覺不知。』菩薩見諸眾生於如是苦聚不得出離，是故即生大悲智慧。復作是念：『此諸眾生我應救拔，置於究竟安樂之處。』是故即生大慈光明智。「佛子！菩薩摩訶薩隨順如是大悲、大慈，以深重心住初地時，於一切物無所吝惜，求佛大智，修行大捨，凡是所有一切能施。所謂：財穀、倉庫、金銀、摩尼、真珠、瑠璃、珂貝、璧玉、珊瑚等物，珍寶、瓔珞、嚴身之具，象馬、車乘、奴婢、人民、城邑、聚落、園林、臺觀、妻妾、男女、內外眷屬及餘所有珍玩之具，頭目、手足、血肉、骨髓、一切身分皆無所惜，為求諸佛廣大智慧。是名：菩薩住於初地大捨成就。「佛子！菩薩以此慈、悲、大施心，為欲救護一切眾生，轉更推求世、出世間諸利益事無疲厭故，即得成就無疲厭心。得無疲厭心已，於一切經論心無怯弱；無怯弱故，即得成就一切經論智。獲是智已，善能籌量應作、不應作，於上、中、下一切眾生，隨應、隨力、隨其所習，如是而行，是故菩薩得成世智。成世智已，知時知量，以慚愧莊嚴勤修自利、利他之道，是故成就慚愧莊嚴，於此行中勤修出離，不退不轉，成堅固力。得堅固力已，勤供諸佛，於佛教法能如說行。「佛子！菩薩如是成就十種淨諸地法，所謂：信、悲、慈、捨、無有疲厭、知諸經論、善解世法、慚愧、堅固力、供養諸佛依教修行。「佛子！菩薩住此歡喜地已，以大願力得見多佛。所謂：見多百佛、多千佛、多百千佛、多億佛、多百億佛、多千億佛、多百千億佛、多億那由他佛、多百億那由他佛、多千億那由他佛、多百千億那由他佛。悉以大心、深心，恭敬尊重，承事供養，衣服、飲食、臥具、醫藥，一切資生悉以奉施，亦以供養一切眾僧，以此善根皆悉迴向無上菩提。佛子！此菩薩因供養諸佛故，得成就眾生法，以前二攝攝取眾生，謂布施、愛語；後二攝法，但以信解力故，行未善通達。是菩薩，十波羅蜜中，檀波羅蜜增上；餘波羅蜜非不修行，但隨力隨分。是菩薩隨所勤修，供養諸佛，教化眾生，皆以修行清淨地法，所有善根悉以迴向一切智地，轉轉明淨，調柔成就，隨意堪用。佛子！譬如金師善巧鍊金，數數入火，轉轉明淨，調柔成就，隨意堪用。菩薩亦復如是，供養諸佛，教化眾生，皆為修行清淨地法，所有善根悉以迴向一切智地，轉轉明淨，調柔成就，隨意堪用。「佛子！菩薩摩訶薩住於初地，應從諸佛菩薩善知識所推求請問，於此地中相及得果，無有厭足，為欲成就此地法故；亦應從諸佛菩薩善知識所推求請問，第二地中相及得果，無有厭足，為欲成就彼地法故；亦應如是推求請問，第三、第四、第五、第六、第七、第八、第九、第十地中相及得果，無有厭足，為欲成就彼地法故。是菩薩善知諸地障對治，善知地成壞，善知地相果，善知地得修，善知地法清淨，善知地地轉行，善知地地處、非處，善知地地殊勝智，善知地地不退轉，善知淨治一切菩薩地乃至轉入如來地。佛子！菩薩如是善知地相，始於初地起行不斷，如是乃至入第十地無有斷絕；由此諸地智光明故，成於如來智慧光明。佛子！譬如商主善知方便，欲將諸商人往詣大城，未發之時，先問道中功德過失，及住止之處安危可不，然後具道資糧，作所應作。佛子！彼大商主雖未發足，能知道中所有一切安危之事，善以智慧籌量觀察，備其所須令無乏少，將諸商眾乃至安隱到彼大城，身及眾人悉免憂患。佛子！菩薩商主亦復如是，住於初地，善知諸地障對治，乃至善知一切菩薩地清淨，轉入如來地，然後乃具福智資糧，將一切眾生經生死曠野險難之處，安隱得至薩婆若城，身及眾生不經患難。是故，菩薩常應匪懈勤修諸地殊勝淨業，乃至趣入如來智地。「佛子！是名：略說菩薩摩訶薩入菩薩初地門\n\n**（2）離垢地**——增上：—｜多作：閻浮提王（全文）：\n\n> ，廣說則有無量無邊百千阿僧祇差別事。「佛子！菩薩摩訶薩住此初地，多作閻浮提王，豪貴自在，常護正法，能以大施攝取眾生，善除眾生慳貪之垢，常行大施無有窮盡。布施、愛語、利益、同事——如是一切諸所作業，皆不離念佛，不離念法，不離念僧，不離念同行菩薩，不離念菩薩行，不離念諸波羅蜜，不離念諸地，不離念力，不離念無畏，不離念不共佛法，乃至不離念具足一切種、一切智智。復作是念：『我當於一切眾生中為首、為勝、為殊勝、為妙、為微妙、為上、為無上、為導、為將、為帥，乃至為一切智智依止者。』是菩薩若欲捨家於佛法中勤行精進，便能捨家、妻子、五欲，依如來教出家學道。既出家已，勤行精進，於一念頃，得百三昧，得見百佛，知百佛神力，能動百佛世界，能過百佛世界，能照百佛世界，能教化百世界眾生，能住壽百劫，能知前後際各百劫事，能入百法門，能示現百身，於一一身能示百菩薩以為眷屬；若以菩薩殊勝願力自在示現，過於是數，百劫、千劫、百千劫，乃至百千億那由他劫不能數知。」爾時，金剛藏菩薩欲重宣其義而說頌曰：「若人集眾善，具足白淨法，供養天人尊，隨順慈悲道，信解極廣大，志樂亦清淨，為求佛智慧，發此無上心。淨一切智力，及以無所畏，成就諸佛法，救攝群生眾，為得大慈悲，及轉勝法輪，嚴淨佛國土，發此最勝心。一念知三世，而無有分別，種種時不同，以示於世間。略說求諸佛，一切勝功德，發生廣大心，量等虛空界。悲先慧為主，方便共相應，信解清淨心，如來無量力，無礙智現前，自悟不由他，具足同如來，發此最勝心。佛子始發生，如是妙寶心，則超凡夫位，入佛所行處，生在如來家，種族無瑕玷，與佛共平等，決成無上覺。纔生如是心，即得入初地，志樂不可動，譬如大山王，多喜多愛樂，亦復多淨信，極大勇猛心，及以慶躍心，遠離於鬪諍，惱害及瞋恚，慚敬而質直，善守護諸根，救世無等者，所有眾智慧，此處我當得，憶念生歡喜。始得入初地，即超五怖畏，不活死惡名，惡趣眾威德。以不貪著我，及以於我所，是諸佛子等，遠離諸怖畏。常行大慈愍，恒有信恭敬，慚愧功德備，日夜增善法。樂法真實利，不愛受諸欲，思惟所聞法，遠離取著行。不貪於利養，唯樂佛菩提，一心求佛智，專精無異念。修行波羅蜜，遠離諂虛誑，如說而修行，安住實語中。不污諸佛家，不捨菩薩戒，不樂於世事，常利益世間。修善無厭足，轉求增勝道，如是好樂法，功德義相應。恒起大願心，願見於諸佛，護持諸佛法，攝取大仙道。常生如是願，修行最勝行，成熟諸群生，嚴淨佛國土。一切諸佛剎，佛子悉充遍，平等共一心，所作皆不空；一切毛端處，一時成正覺。如是等大願，無量無邊際。虛空與眾生，法界及涅槃，世間佛出興，佛智心境界。『如來智所入，及以三轉盡，彼諸若有盡，我願方始盡；如彼無盡期，我願亦復然。』如是發大願，心柔軟調順。能信佛功德，觀察於眾生，知從因緣起，則興慈念心：『如是苦眾生，我今應救脫。』為是眾生故，而行種種施，王位及珍寶，乃至象馬車，頭目與手足，乃至身血肉，一切皆能捨，心得無憂悔。求種種經書，其心無厭倦，善解其義趣，能隨世所行，慚愧自莊嚴，修行轉堅固，供養無量佛，恭敬而尊重。如是常修習，日夜無懈倦，善根轉明淨，如火鍊真金。菩薩住於此，淨修於十地，所作無障礙，具足不斷絕。譬如大商主，為利諸商眾。問知道險易，安隱至大城。菩薩住初地，應知亦如是，勇猛無障礙，到於第十地。住此初地中，作大功德王，以法化眾生，慈心無損害。統領閻浮地，化行靡不及，皆令住大捨，成就佛智慧。欲求最勝道，捨己國王位，能於佛教中，勇猛勤修習，則得百三昧，及見百諸佛，震動百世界，光照行亦爾，化百土眾生，入於百法門，能知百劫事，示現於百身，及現百菩薩，以為其眷屬；若自在願力，過是數無量。我於地義中，略述其少分，若欲廣分別，億劫不能盡。菩薩最勝道，利益諸群生，如是初地法，我今已說竟。」之二十地品第二十六之二第二地第二地諸菩薩聞此，最勝微妙地，其心盡清淨，一切皆歡喜。皆從於座起，踊住虛空中，普散上妙華，同時共稱讚：「善哉金剛藏！大智無畏者！善說於此地，菩薩所行法。」解脫月菩薩，知眾心清淨，樂聞第二地，所有諸行相，即請金剛藏：「大慧願演說，佛子皆樂聞，所住第二地！」爾時，金剛藏菩薩告解脫月菩薩言：「佛子！菩薩摩訶薩已修初地，欲入第二地，當起十種深心。何等為十？所謂：正直心、柔軟心、堪能心、調伏心、寂靜心、純善心、不雜心、無顧戀心、廣心、大心。菩薩以此十心，得入第二離垢地。「佛子！菩薩住離垢地，性自遠離一切殺生，不畜刀杖，不懷怨恨，有慚有愧，仁恕具足，於一切眾生有命之者，常生利益慈念之心；是菩薩尚不惡心惱諸眾生，何況於他起眾生想，故以重意而行殺害！性不偷盜，菩薩於自資財，常知止足，於他慈恕，不欲侵損；若物屬他，起他物想，終不於此而生盜心，乃至草葉不與不取，何況其餘資生之具！性不邪婬，菩薩於自妻知足，不求他妻，於他妻妾、他所護女、親族媒定及為法所護，尚不生於貪染之心，何況從事！況於非道！性不妄語，菩薩常作實語、真語、時語，乃至夢中亦不忍作覆藏之語，無心欲作，何況故犯！性不兩舌，菩薩於諸眾生無離間心、無惱害心，不將此語為破彼故而向彼說，不將彼語為破此故而向此說，未破者不令破，已破者不增長，不喜離間，不樂離間，不作離間語，不說離間語，若實、若不實。性不惡口，所謂：毒害語、麁獷語、苦他語、令他瞋恨語、現前語、不現前語、鄙惡語、庸賤語、不可樂聞語、聞者不悅語、瞋忿語、如火燒心語、怨結語、熱惱語、不可愛語、不可樂語、能壞自身他身語，如是等語皆悉捨離，常作潤澤語、柔軟語、悅意語、可樂聞語、聞者喜悅語、善入人心語、風雅典則語、多人愛樂語、多人悅樂語、身心踊悅語。性不綺語，菩薩常樂思審語、時語、實語、義語、法語、順道理語、巧調伏語、隨時籌量決定語，是菩薩乃至戲笑尚恒思審，何況故出散亂之言！性不貪欲，菩薩於他財物、他所資用，不生貪心，不願不求。性離瞋恚，菩薩於一切眾生恒起慈心、利益心、哀愍心、歡喜心、和潤心、攝受心，永捨瞋恨、怨害、熱惱，常思順行，仁慈祐益。又離邪見，菩薩住於正道，不行占卜，不取惡戒，心見正直，無誑無諂，於佛、法、僧起決定信。「佛子！菩薩摩訶薩如是護持十善業道，常無間斷，復作是念：『一切眾生墮惡趣者，莫不皆以十不善業；是故我當自修正行，亦勸於他，令修正行。何以故？若自不能修行正行，令他修者，無有是處。』「佛子！此菩薩摩訶薩復作是念：『十不善業道，是地獄、畜生、餓鬼受生因；十善業道，是人、天乃至有頂處受生因。又此上品十善業道，以智慧修習，心狹劣故，怖三界故，闕大悲故，從他聞聲而解了故，成聲聞乘。又此上品十善業道，修治清淨，不從他教，自覺悟故，大悲方便不具足故，悟解甚深因緣法故，成獨覺乘。又此上品十善業道，修治清淨，心廣無量故，具足悲愍故，方便所攝故，發生大願故，不捨眾生故，希求諸佛大智故，淨治菩薩諸地故，淨修一切諸度故，成菩薩廣大行。又此上品十善業道，一切種清淨故，乃至證十力、四無畏故，一切佛法皆得成就。是故我今等行十善，應令一切具足清淨；如是方便，菩薩當學。』「佛子！此菩薩摩訶薩又作是念：『十不善業道，上者地獄因，中者畜生因，下者餓鬼因。於中，殺生之罪能令眾生墮於地獄、畜生、餓鬼；若生人中，得二種果報，一者短命，二者多病。偷盜之罪亦令眾生墮三惡道；若生人中，得二種果報，一者貧窮，二者共財不得自在。邪婬之罪亦令眾生墮三惡道；若生人中，得二種果報，一者妻不貞良，二者不得隨意眷屬。妄語之罪亦令眾生墮三惡道；若生人中，得二種果報，一者多被誹謗，二者為他所誑。兩舌之罪亦令眾生墮三惡道；若生人中，得二種果報，一者眷屬乖離，二者親族弊惡。惡口之罪亦令眾生墮三惡道；若生人中，得二種果報，一者常聞惡聲，二者言多諍訟。綺語之罪亦令眾生墮三惡道；若生人中，得二種果報，一者言無人受，二者語不明了。貪欲之罪亦令眾生墮三惡道；若生人中，得二種果報，一者心不知足，二者多欲無厭。瞋恚之罪亦令眾生墮三惡道；若生人中，得二種果報，一者常被他人求其長短，二者恒被於他之所惱害。邪見之罪亦令眾生墮三惡道；若生人中，得二種果報，一者生邪見家，二者其心諂曲。』佛子！十不善業道能生此等無量無邊眾大苦聚，是故菩薩作如是念：『我當遠離十不善道，以十善道為法園苑，愛樂安住，自住其中，亦勸他人令住其中。』「佛子！此菩薩摩訶薩復於一切眾生生利益心、安樂心、慈心、悲心、憐愍心、攝受心、守護心、自己心、師心、大師心，作是念言：『眾生可愍，墮於邪見、惡慧、惡欲、惡道稠林。我應令彼住於正見，行真實道。』又作是念：『一切眾生分別彼我，互相破壞，鬪諍瞋恨，熾然不息。我當令彼住於無上大慈之中。』又作是念：『一切眾生貪取無厭，唯求財利，邪命自活。我當令彼住於清淨身、語、意業正命法中。』又作是念：『一切眾生常隨三毒，種種煩惱因之熾然，不解志求出要方便。我當令彼除滅一切煩惱大火，安置清涼涅槃之處。』又作是念：『一切眾生為愚癡重闇，妄見厚膜之所覆故，入陰翳稠林，失智慧光明，行曠野險道，起諸惡見。我當令彼得無障礙清淨智眼，知一切法如實相，不隨他教。』又作是念：『一切眾生在於生死險道之中，將墮地獄、畜生、餓鬼，入惡見網中，為愚癡稠林所迷，隨逐邪道，行顛倒行。譬如盲人無有導師，非出要道謂為出要，入魔境界，惡賊所攝，隨順魔心，遠離佛意。我當拔出如是險難，令住無畏一切智城。』又作是念：『一切眾生為大瀑水波浪所沒，入欲流、有流、無明流、見流，生死洄澓，愛河漂轉，湍馳奔激，不暇觀察；為欲覺、恚覺、害覺隨逐不捨，身見羅剎於中執取，將其永入愛欲稠林；於所貪愛深生染著，住我慢原阜，安六處聚落；無善救者，無能度者。我當於彼起大悲心，以諸善根而為救濟，令無災患，離染寂靜，住於一切智慧寶洲。』又作是念：『一切眾生處世牢獄，多諸苦惱，常懷愛憎，自生憂怖，貪欲重械之所繫縛，無明稠林以為覆障，於三界內莫能自出。我當令彼永離三有，住無障礙大涅槃中。』又作是念：『一切眾生執著於我，於諸蘊窟宅不求出離，依六處空聚，起四顛倒行，為四大毒蛇之所侵惱，五蘊怨賊之所殺害，受無量苦。我當令彼住於最勝無所著處，所謂：滅一切障礙無上涅槃。』又作是念：『一切眾生其心狹劣，不行最上一切智道，雖欲出離，但樂聲聞、辟支佛乘。我當令住廣大佛法、廣大智慧。』佛子！菩薩如是護持於戒，善能增長慈悲之心。「佛子！菩薩住此離垢地，以願力故，得見多佛。所謂：見多百佛、多千佛、多百千佛、多億佛、多百億佛、多千億佛、多百千億佛，如是乃至見多百千億那由他佛。於諸佛所，以廣大心、深心，恭敬尊重，承事供養，衣服、飲食、臥具、醫藥，一切資生悉以奉施，亦以供養一切眾僧，以此善根迴向阿耨多羅三藐三菩提。於諸佛所，以尊重心，復更受行十善道法，隨其所受，乃至菩提，終不忘失。是菩薩於無量百千億那由他劫，遠離慳嫉破戒垢故，布施、持戒清淨滿足。譬如真金置礬石中，如法鍊已，離一切垢，轉復明淨。菩薩住此離垢地，亦復如是，於無量百千億那由他劫，遠離慳嫉破戒垢故，布施、持戒清淨滿足。佛子！此菩薩，四攝法中，愛語偏多；十波羅蜜中，持戒偏多；餘非不行，但隨力隨分。「佛子！是名：略說菩薩摩訶薩第二離垢地\n\n\n\n**〔L.286 批·注入8,197 CJK·0 手抄〕**\n\n**（3）發光地**——增上：—｜多作：轉輪聖王（全文）：\n\n> 。菩薩住此地，多作轉輪聖王，為大法主，具足七寶，有自在力，能除一切眾生慳貪破戒垢，以善方便令其安住十善道中；為大施主，周給無盡。布施、愛語、利行、同事——如是一切諸所作業，皆不離念佛，不離念法，不離念僧，乃至不離念具足一切種、一切智智。又作是念：『我當於一切眾生中為首、為勝、為殊勝、為妙、為微妙、為上、為無上，乃至為一切智智依止者。』是菩薩若欲捨家於佛法中勤行精進，便能捨家、妻子、五欲。既出家已，勤行精進，於一念頃，得千三昧，得見千佛，知千佛神力，能動千世界，乃至能示現千身，於一一身能示現千菩薩以為眷屬；若以菩薩殊勝願力自在示現，過於是數，百劫、千劫乃至百千億那由他劫不能數知。」爾時，金剛藏菩薩欲重宣其義而說頌曰：「質直柔軟及堪能，調伏寂靜與純善，速出生死廣大意，以此十心入二地。住此成就戒功德，遠離殺生不惱害，亦離偷盜及邪婬，妄惡乖離無義語。不貪財物常慈愍，正道直心無諂偽，離險捨慢極調柔，依教而行不放逸。地獄畜生受眾苦，餓鬼燒然出猛焰，一切皆由罪所致，我當離彼住實法。人中隨意得受生，乃至頂天禪定樂，獨覺聲聞佛乘道，皆因十善而成就。如是思惟不放逸，自持淨戒教他護，復見群生受眾苦，轉更增益大悲心。凡愚邪智不正解，常懷忿恨多諍訟，貪求境界無足期，我應令彼除三毒。愚癡大暗所纏覆，入大險道邪見網，生死籠檻怨所拘，我應令彼摧魔賊。四流漂蕩心沒溺，三界焚如苦無量，計蘊為宅我在中，為欲度彼勤行道。設求出離心下劣，捨於最上佛智慧，我欲令彼住大乘，發勤精進無厭足。菩薩住此集功德，見無量佛咸供養，億劫修治善更明，如以好藥鍊真金。佛子住此作輪王，普化眾生行十善，所有善法皆修習，為成十力救於世。欲捨王位及財寶，即棄居家依佛教，勇猛精勤一念中，獲千三昧見千佛。所有種種神通力，此地菩薩皆能現，願力所作復過此，無量自在度群生。一切世間利益者，所修菩薩最勝行，如是第二地功德，為諸佛子已開演。」第三地第三地佛子得聞此地行，菩薩境界難思議，靡不恭敬心歡喜，散華空中為供養，讚言：「善哉大山王，慈心愍念諸眾生，善說智者律儀法，第二地中之行相。是諸菩薩微妙行，真實無異無差別，為欲利益諸群生，如是演說最清淨。一切人天供養者，願為演說第三地，與法相應諸智業，如其境界希具闡！大仙所有施戒法，忍辱精進禪智慧，及以方便慈悲道，佛清淨行願皆說！」時，解脫月復請言：「無畏大士金剛藏，願說趣入第三地，柔和心者諸功德！」爾時，金剛藏菩薩告解脫月菩薩言：「佛子！菩薩摩訶薩已淨第二地，欲入第三地，當起十種深心。何等為十？所謂：清淨心、安住心、厭捨心、離貪心、不退心、堅固心、明盛心、勇猛心、廣心、大心。菩薩以是十心，得入第三地。「佛子！菩薩摩訶薩住第三地已，觀一切有為法如實相。所謂：無常、苦、不淨、不安隱，敗壞、不久住，剎那生滅，非從前際生，非向後際去，非於現在住。又觀此法無救、無依，與憂、與悲，苦惱同住，愛憎所繫，愁慼轉多，無有停積，貪、恚、癡火熾然不息，眾患所纏，日夜增長，如幻不實。見如是已，於一切有為倍增厭離，趣佛智慧，見佛智慧不可思議、無等無量、難得無雜、無惱無憂，至無畏城，不復退還，能救無量苦難眾生。菩薩如是見如來智慧無量利益，見一切有為無量過患，則於一切眾生生十種哀愍心。何等為十？所謂：見諸眾生孤獨無依，生哀愍心；見諸眾生貧窮困乏，生哀愍心；見諸眾生三毒火然，生哀愍心；見諸眾生諸有牢獄之所禁閉，生哀愍心；見諸眾生煩惱稠林恒所覆障，生哀愍心；見諸眾生不善觀察，生哀愍心；見諸眾生無善法欲，生哀愍心；見諸眾生失諸佛法，生哀愍心；見諸眾生隨生死流，生哀愍心；見諸眾生失解脫方便，生哀愍心。是為十。菩薩如是見眾生界無量苦惱，發大精進，作是念言：『此等眾生，我應救，我應脫，我應淨，我應度；應著善處，應令安住，應令歡喜，應令知見，應令調伏，應令涅槃。』菩薩如是厭離一切有為，如是愍念一切眾生，知一切智智有勝利益，欲依如來智慧救度眾生，作是思惟：『此諸眾生墮在煩惱大苦之中，以何方便而能拔濟，令住究竟涅槃之樂？』便作是念：『欲度眾生令住涅槃，不離無障礙解脫智；無障礙解脫智，不離一切法如實覺；一切法如實覺，不離無行無生行慧光；無行無生行慧光，不離禪善巧決定觀察智；禪善巧決定觀察智，不離善巧多聞。』菩薩如是觀察了知已，倍於正法勤求修習，日夜唯願聞法、喜法、樂法、依法、隨法、解法、順法、到法、住法、行法。菩薩如是勤求佛法，所有珍財皆無吝惜，不見有物難得可重，但於能說佛法之人生難遭想。是故，菩薩於內外財，為求佛法悉能捨施。無有恭敬而不能行，無有憍慢而不能捨，無有承事而不能作，無有勤苦而不能受。若聞一句未曾聞法，生大歡喜，勝得三千大千世界滿中珍寶；若聞一偈未聞正法，生大歡喜，勝得轉輪聖王位；若得一偈未曾聞法，能淨菩薩行，勝得帝釋梵王位住無量百千劫。若有人言：『我有一句佛所說法，能淨菩薩行。汝今若能入大火阬，受極大苦，當以相與。』菩薩爾時作如是念：『我以一句佛所說法，淨菩薩行故，假使三千大千世界大火滿中，尚欲從於梵天之上投身而下，親自受取，況小火阬而不能入！然我今者為求佛法，應受一切地獄眾苦，何況人中諸小苦惱！』菩薩如是發勤精進求於佛法，如其所聞觀察修行。此菩薩得聞法已，攝心安住，於空閑處作是思惟：『如說修行乃得佛法，非但口言而可清淨。』「佛子！是菩薩住此發光地時，即離欲惡不善法，有覺有觀，離生喜樂，住初禪；滅覺觀，內淨一心，無覺無觀，定生喜樂，住第二禪；離喜住捨，有念正知，身受樂，諸聖所說能捨有念受樂，住第三禪；斷樂，先除苦喜憂滅，不苦不樂，捨念清淨，住第四禪；超一切色想，滅有對想，不念種種想，入無邊虛空，住虛空無邊處；超一切虛空無邊處，入無邊識，住識無邊處；超一切識無邊處，入無少所有，住無所有處；超一切無所有處，住非有想非無想處。但隨順法故，行而無所樂著。「佛子！此菩薩心隨於慈，廣大無量不二，無怨無對，無障無惱，遍至一切處，盡法界、虛空界，遍一切世間；住悲、喜、捨亦復如是。「佛子！此菩薩得無量神通力，能動大地；以一身為多身，多身為一身，或隱或顯；石壁山障，所往無礙，猶如虛空；於虛空中跏趺而去，同於飛鳥；入地如水，履水如地；身出煙焰，如大火聚；復雨於水，猶如大雲；日月在空，有大威力，而能以手捫摸摩觸；其身自在，乃至梵世。此菩薩天耳清淨過於人耳，悉聞人、天若近若遠所有音聲，乃至蚊蚋、虻蠅等聲亦悉能聞。此菩薩以他心智，如實而知他眾生心。所謂：有貪心，如實知有貪心；離貪心，如實知離貪心；有瞋心、離瞋心，有癡心、離癡心，有煩惱心、無煩惱心，小心、廣心，大心、無量心，略心、非略心，散心、非散心，定心、非定心，解脫心、非解脫心，有上心、無上心，雜染心、非雜染心，廣心、非廣心，皆如實知。菩薩如是以他心智知眾生心。此菩薩念知無量宿命差別，所謂：『念知一生，念知二生、三生、四生，乃至十生、二十、三十，乃至百生、無量百生、無量千生、無量百千生，成劫、壞劫、成壞劫、無量成壞劫，我曾在某處，如是名，如是姓，如是種族，如是飲食，如是壽命，如是久住，如是苦樂。我於彼死，生於某處，從某處死，生於此處，如是形狀，如是相貌，如是言音。』如是過去無量差別，皆能憶念。此菩薩天眼清淨過於人眼，見諸眾生生時、死時、好色、惡色，善趣、惡趣，隨業而去。若彼眾生成就身惡行，成就語惡行，成就意惡行，誹謗賢聖；具足邪見及邪見業因緣，身壞命終，必墮惡趣，生地獄中。若彼眾生成就身善行，成就語善行，成就意善行，不謗賢聖，具足正見；正見業因緣，身壞命終，必生善趣諸天之中。菩薩天眼皆如實知。此菩薩於諸禪三昧、三摩鉢底能入能出，然不隨其力受生，但隨能滿菩提分處，以意願力而生其中。「佛子！是菩薩住此發光地，以願力故，得見多佛。所謂：見多百佛，見多千佛，見多百千佛，乃至見多百千億那由他佛。悉以廣大心、深心，恭敬尊重，承事供養，衣服、飲食、臥具、湯藥，一切資生悉以奉施，亦以供養一切眾僧，以此善根迴向阿耨多羅三藐三菩提。於其佛所，恭敬聽法，聞已受持，隨力修行。此菩薩觀一切法，不生不滅，因緣而有；見縛先滅，一切欲縛、色縛、有縛、無明縛皆轉微薄；於無量百千億那由他劫不積集故，邪貪、邪瞋及以邪癡，悉得除斷，所有善根轉更明淨。佛子！譬如真金善巧鍊治，稱兩不減，轉更明淨。菩薩亦復如是，住此發光地，不積集故，邪貪、邪瞋及以邪癡，皆得除斷，所有善根轉更明淨。此菩薩忍辱心、柔和心、諧順心、悅美心、不瞋心、不動心、不濁心、無高下心、不望報心、報恩心、不諂心、不誑心、無譣詖心皆轉清淨。此菩薩於四攝中，利行偏多；十波羅蜜中，忍波羅蜜偏多；餘非不修，但隨力隨分。「佛子！是名菩薩第三發光地\n\n**（4）焰慧地**——增上：—｜多作：三十三天王（全文）：\n\n> 。菩薩住此地，多作三十三天王，能以方便，令諸眾生捨離貪欲。布施、愛語、利行、同事——，如是一切諸所作業，皆不離念佛，不離念法，不離念僧，乃至不離念具足一切種、一切智智。復作是念：『我當於一切眾生中為首、為勝、為殊勝、為妙、為微妙、為上、為無上，乃至為一切智智依止者。』若勤行精進，於一念頃，得百千三昧，得見百千佛，知百千佛神力，能動百千佛世界，乃至示現百千身，一一身百千菩薩以為眷屬；若以菩薩殊勝願力自在示現，過於此數，百劫、千劫乃至百千億那由他劫不能數知。」爾時，金剛藏菩薩欲重宣其義而說頌曰：「清淨安住明盛心，厭離無貪無害心，堅固勇猛廣大心，智者以此入三地。菩薩住此發光地，觀諸行法苦無常，不淨敗壞速歸滅，無堅無住無來往。觀諸有為如重病，憂悲苦惱惑所纏，三毒猛火恒熾然，無始時來不休息。厭離三有不貪著，專求佛智無異念，難測難思無等倫，無量無邊無逼惱。見佛智已愍眾生，孤獨無依無救護，三毒熾然常困乏，住諸有獄恒受苦，煩惱纏覆盲無目，志樂下劣喪法寶，隨順生死怖涅槃，我應救彼勤精進。將求智慧益眾生，思何方便令解脫？不離如來無礙智，彼復無生慧所起。心念此慧從聞得，如是思惟自勤勵，日夜聽習無間然，唯以正法為尊重。國城財貝諸珍寶，妻子眷屬及王位，菩薩為法起敬心，如是一切皆能捨。頭目耳鼻舌牙齒，手足骨髓心血肉，此等皆捨未為難，但以聞法為最難。設有人來語菩薩：『孰能投身大火聚，我當與汝佛法寶！』聞已投之無怯懼。假使火滿三千界，身從梵世而投入，為求法故不為難，況復人間諸小苦！從初發意至得佛，其間所有阿鼻苦，為聞法故皆能受，何況人中諸苦事！聞已如理正思惟，獲得四禪無色定，四等五通次第起，不隨其力而受生。菩薩住此見多佛，供養聽聞心決定，斷諸邪惑轉清淨，如鍊真金體無減。住此多作忉利王，化導無量諸天眾，令捨貪心住善道，一向專求佛功德。佛子住此勤精進，百千三昧皆具足，見百千佛相嚴身，若以願力復過是。一切眾生普利益，彼諸菩薩最上行，如是所有第三地，我依其義已解釋。」之三十地品第二十六之三第四地第四地佛子聞此廣大行，可樂深妙殊勝地，心皆踊悅大歡喜，普散眾華供養佛。演說如是妙法時，大地海水皆震動，一切天女咸歡喜，悉吐妙音同讚歎。自在天王大欣慶，雨摩尼寶供養佛，讚言：「佛為我出興，演說第一功德行。如是智者諸地義，於百千劫甚難得，我今忽然而得聞，菩薩勝行妙法音。願更演說聰慧者，後地決定無餘道，利益一切諸天人，此諸佛子皆樂聞！」勇猛大心解脫月，請金剛藏言：「佛子！從此轉入第四地，所有行相願宣說！」爾時，金剛藏菩薩告解脫月菩薩言：「佛子！菩薩摩訶薩第三地善清淨已，欲入第四焰慧地，當修行十法明門。何等為十？所謂觀察眾生界、觀察法界、觀察世界、觀察虛空界、觀察識界、觀察欲界、觀察色界、觀察無色界、觀察廣心信解界、觀察大心信解界。菩薩以此十法明門，得入第四焰慧地。「佛子！菩薩住此焰慧地，則能以十種智成熟法故，得彼內法，生如來家。何等為十？所謂：深心不退故；於三寶中生淨信，畢竟不壞故；觀諸行生滅故；觀諸法自性無生故；觀世間成壞故；觀因業有生故；觀生死涅槃故；觀眾生國土業故；觀前際後際故；觀無所有盡故。是為十。佛子！菩薩住此第四地，觀內身循身觀，勤勇念知，除世間貪憂；觀外身循身觀，勤勇念知，除世間貪憂；觀內外身循身觀，勤勇念知，除世間貪憂；如是，觀內受、外受、內外受循受觀，觀內心、外心、內外心循心觀，觀內法、外法、內外法循法觀，勤勇念知，除世間貪憂。復次，此菩薩未生諸惡不善法為不生故，欲生勤精進發心正斷；已生諸惡不善法為斷故，欲生勤精進發心正斷；未生諸善法為生故，欲生勤精進發心正行；已生諸善法為住不失故，修令增廣故，欲生勤精進發心正行。復次，此菩薩修行欲定斷行，成就神足，依止厭，依止離，依止滅，迴向於捨；修行精進定、心定、觀定斷行，成就神足，依止厭，依止離，依止滅，迴向於捨。復次，此菩薩修行信根，依止厭，依止離，依止滅，迴向於捨；修行精進根、念根、定根、慧根，依止厭，依止離，依止滅，迴向於捨。復次，此菩薩修行信力，依止厭，依止離，依止滅，迴向於捨；修行精進力、念力、定力、慧力，依止厭，依止離，依止滅，迴向於捨。復次，此菩薩修行念覺分，依止厭，依止離，依止滅，迴向於捨；修行擇法覺分、精進覺分、喜覺分、猗覺分、定覺分、捨覺分，依止厭，依止離，依止滅，迴向於捨。復次，此菩薩修行正見，依止厭，依止離，依止滅，迴向於捨；修行正思惟、正語、正業、正命、正精進、正念、正定，依止厭，依止離，依止滅，迴向於捨。菩薩修行如是功德，為不捨一切眾生故，本願所持故，大悲為首故，大慈成就故，思念一切智智故，成就莊嚴佛土故，成就如來力、無所畏、不共佛法、相好音聲悉具足故，求於上上殊勝道故，隨順所聞甚深佛解脫故，思惟大智善巧方便故。「佛子！菩薩住此焰慧地，所有身見為首，我、人、眾生、壽命、蘊、界、處所起執著，出沒思惟；觀察治故，我所故，財物故，著處故，於如是等一切皆離。此菩薩若見業是如來所訶、煩惱所染，皆悉捨離；若見業是順菩薩道、如來所讚，皆悉修行。「佛子！此菩薩隨所起方便慧，修習於道及助道分，如是而得潤澤心、柔軟心、調順心、利益安樂心、無雜染心、求上上勝法心、求殊勝智慧心、救一切世間心、恭敬尊德無違教命心、隨所聞法皆善修行心。此菩薩知恩、知報恩，心極和善，同住安樂，質直柔軟，無稠林行，無有我慢，善受教誨，得說者意。此菩薩如是忍成就，如是調柔成就，如是寂滅成就，如是忍、調柔、寂滅成就；淨治後地業，作意修行時，得不休息精進、不雜染精進、不退轉精進、廣大精進、無邊精進、熾然精進、無等等精進、無能壞精進、成熟一切眾生精進、善分別道非道精進。是菩薩心界清淨，深心不失，悟解明利，善根增長，離世垢濁，斷諸疑惑，明斷具足，喜樂充滿，佛親護念，無量志樂皆悉成就。「佛子！菩薩住此焰慧地，以願力故，得見多佛。所謂：見多百佛，見多千佛，見多百千佛，乃至見多百千億那由他佛。皆恭敬尊重，承事供養，衣服、臥具、飲食、湯藥，一切資生悉以奉施，亦以供養一切眾僧，以此善根皆悉迴向阿耨多羅三藐三菩提。於彼佛所，恭敬聽法，聞已受持，具足修行。復於彼諸佛法中出家修道，又更修治深心信解，經無量百千億那由他劫，令諸善根轉復明淨。佛子！譬如金師鍊治真金作莊嚴具，餘所有金皆不能及；菩薩摩訶薩亦復如是，住於此地所有善根，下地善根所不能及。如摩尼寶清淨光輪能放光明，非諸餘寶之所能及，風雨等緣悉不能壞；菩薩摩訶薩亦復如是，住於此地，下地菩薩所不能及，眾魔煩惱悉不能壞。此菩薩於四攝中，同事偏多；十波羅蜜中，精進偏多；餘非不修，但隨力隨分。「佛子！是名：略說菩薩摩訶薩第四焰慧地\n\n**（5）難勝地**——增上：—｜多作：須夜摩天王（全文）：\n\n> 。菩薩住此地，多作須夜摩天王，以善方便能除眾生身見等惑，令住正見。布施、愛語、利行、同事——如是一切諸所作業，皆不離念佛，不離念法，不離念僧，乃至不離念具足一切種、一切智智。復作是念：『我當於一切眾生中為首、為勝、為殊勝、為妙、為微妙、為上、為無上，乃至為一切智智依止者。』是菩薩若發勤精進，於一念頃，得入億數三昧，得見億數佛，得知億數佛神力，能動億數世界，乃至能示現億數身，一一身億數菩薩以為眷屬；若以菩薩殊勝願力自在示現，過於此數，百劫、千劫乃至百千億那由他劫不能數知。」爾時，金剛藏菩薩欲重宣其義而說頌言：「菩薩已淨第三地，次觀眾生世法界，空界識界及三界，心解悉了能趣入。始登焰地增勢力，生如來家永不退，於佛法僧信不壞，觀法無常無有起。觀世成壞業有生，生死涅槃剎等業，觀前後際亦觀盡，如是修行生佛家。得是法已增慈愍，轉更勤修四念處，身受心法內外觀，世間貪愛皆除遣。菩薩修治四勤行，惡法除滅善增長，神足根力悉善修，七覺八道亦如是。為度眾生修彼行，本願所護慈悲首，求一切智及佛土，亦念如來十種力，四無所畏不共法，殊特相好深美音；亦求妙道解脫處，及大方便修行彼。身見為首六十二，我及我所無量種，蘊界處等諸取著，此四地中一切離。如來所訶煩惱行，以無義利皆除斷；智者修行清淨業，為度眾生無不作。菩薩勤修不懈怠，即得十心皆具足，專求佛道無厭倦，志期受職度眾生。恭敬尊德修行法，知恩易誨無慍暴，捨慢離諂心調柔，轉更精勤不退轉。菩薩住此焰慧地，其心清淨永不失，悟解決定善增長，疑網垢濁悉皆離。此地菩薩人中勝，供那由他無量佛，聽聞正法亦出家，不可沮壞如真金。菩薩住此具功德，以智方便修行道，不為眾魔心退轉，譬如妙寶無能壞。住此多作焰天王，於法自在眾所尊，普化群生除惡見，專求佛智修善業。菩薩勤加精進力，獲三昧等皆億數；若以願智力所為，過於此數無能知。如是菩薩第四地，所行清淨微妙道，功德義智共相應，我為佛子已宣說。」第五地第五地菩薩聞此勝地行，於法解悟心歡喜，空中雨華讚歎言：「善哉大士金剛藏！」自在天王與天眾，聞法踊躍住虛空，普放種種妙光雲，供養如來喜充遍。天諸采女奏天樂，亦以言辭歌讚佛，悉以菩薩威神故，於彼聲中發是言：「佛願久遠今乃滿，佛道久遠今乃得，釋迦文佛至天宮，利天人者久乃見。大海久遠今始動，佛光久遠今乃放，眾生久遠始安樂，大悲音聲久乃聞。功德彼岸皆已到，憍慢黑闇皆已滅，最極清淨如虛空，不染世法猶蓮華。大牟尼尊現於世，譬如須彌出巨海，供養能盡一切苦，供養必得諸佛智；此應供處供無等，是故歡心供養佛。」如是無量諸天女，發此言辭稱讚已，一切恭敬喜充滿，瞻仰如來默然住。是時大士解脫月，復請無畏金剛藏：「第五地中諸行相，唯願佛子為宣說！」爾時，金剛藏菩薩告解脫月菩薩言：「佛子！菩薩摩訶薩第四地所行道善圓滿已，欲入第五難勝地，當以十種平等清淨心趣入。何等為十？所謂：於過去佛法平等清淨心、未來佛法平等清淨心、現在佛法平等清淨心、戒平等清淨心、心平等清淨心、除見疑悔平等清淨心、道非道智平等清淨心、修行智見平等清淨心、於一切菩提分法上上觀察平等清淨心、教化一切眾生平等清淨心。菩薩摩訶薩以此十種平等清淨心，得入菩薩第五地。「佛子！菩薩摩訶薩住此第五地已，以善修菩提分法故，善淨深心故，復轉求上勝道故，隨順真如故，願力所持故，於一切眾生慈愍不捨故，積集福智助道故，精勤修習不息故，出生善巧方便故，觀察照明上上地故，受如來護念故，念智力所持故，得不退轉心。「佛子！此菩薩摩訶薩如實知此是苦聖諦、此是苦集聖諦、此是苦滅聖諦、此是苦滅道聖諦，善知俗諦，善知第一義諦，善知相諦，善知差別諦，善知成立諦，善知事諦，善知生諦，善知盡無生諦，善知入道智諦，善知一切菩薩地次第成就諦，乃至善知如來智成就諦。此菩薩隨眾生心樂令歡喜故，知俗諦；通達一實相故，知第一義諦；覺法自相、共相故，知相諦；了諸法分位差別故，知差別諦；善分別蘊、界、處故，知成立諦；覺身心苦惱故，知事諦；覺諸趣生相續故，知生諦；一切熱惱畢竟滅故，知盡無生智諦；出生無二故，知入道智諦；正覺一切行相故，善知一切菩薩地次第相續成就，乃至如來智成就諦。以信解智力知，非以究竟智力知。「佛子！此菩薩摩訶薩得如是諸諦智已，如實知一切有為法虛妄、詐偽、誑惑愚夫。菩薩爾時，於諸眾生轉增大悲，生大慈光明。佛子！此菩薩摩訶薩得如是智力，不捨一切眾生，常求佛智，如實觀一切有為行前際、後際。知從前際無明、有愛，故生生死流轉，於諸蘊宅不能動出，增長苦聚；無我、無壽者、無養育者、無更數取後趣身者，離我、我所。如前際，後際亦如是，皆無所有。虛妄、貪著，斷盡出離；若有若無，皆如實知。佛子！此菩薩摩訶薩復作是念：『此諸凡夫愚癡無智，甚為可愍。有無數身已滅、今滅、當滅，如是盡滅，不能於身而生厭想，轉更增長機關苦事，隨生死流不能還返，於諸蘊宅不求出離，不知憂畏四大毒蛇，不能拔出諸慢見箭，不能息滅貪、恚、癡火，不能破壞無明黑暗，不能乾竭愛欲大海，不求十力大聖導師；入魔意稠林，於生死海中，為覺觀波濤之所漂溺。』佛子！此菩薩摩訶薩復作是念：『此諸眾生受如是苦，孤窮困迫，無救無依，無洲無舍，無導無目，無明覆翳，黑暗纏裹。我今為彼一切眾生，修行福智助道之法，獨一發心，不求伴侶；以是功德，令諸眾生畢竟清淨，乃至獲得如來十力、無礙智慧。』佛子！此菩薩摩訶薩以如是智慧觀察所修善根，皆為救護一切眾生，利益一切眾生，安樂一切眾生，哀愍一切眾生，成就一切眾生，解脫一切眾生，攝受一切眾生；令一切眾生離諸苦惱，令一切眾生普得清淨，令一切眾生悉皆調伏，令一切眾生入般涅槃。「佛子！菩薩摩訶薩住此第五難勝地，名為：念者，不忘諸法故；名為：智者，能善決了故；名為：有趣者，知經意趣，次第連合故；名為：慚愧者，自護、護他故；名為：堅固者，不捨戒行故；名為：覺者，能觀是處、非處故；名為：隨智者，不隨於他故；名為：隨慧者，善知義、非義句差別故；名為：神通者，善修禪定故；名為：方便善巧者，能隨世行故；名為：無厭足者，善集福德故；名為：不休息者，常求智慧故；名為：不疲倦者，集大慈悲故；名為：為他勤修者，欲令一切眾生入涅槃故；名為：勤求不懈者，求如來力、無畏、不共法故；名為：發意能行者，成就莊嚴佛土故；名為：勤修種種善業者，能具足相好故；名為：常勤修習者，求莊嚴佛身、語、意故；名為：大尊重恭敬法者，於一切菩薩法師處如教而行故；名為：心無障礙者，以大方便常行世間故；名為：日夜遠離餘心者，常樂教化一切眾生故。「佛子！菩薩摩訶薩如是勤修行時，以布施教化眾生，以愛語、利行、同事教化眾生，示現色身教化眾生，演說諸法教化眾生，開示菩薩行教化眾生，顯示如來大威力教化眾生，示生死過患教化眾生，稱讚如來智慧利益教化眾生，現大神通力教化眾生，以種種方便行教化眾生。佛子！此菩薩摩訶薩能如是勤方便教化眾生，心恒相續，趣佛智慧；所作善根，無有退轉，常勤修學殊勝行法。「佛子！此菩薩摩訶薩為利益眾生故，世間技藝靡不該習。所謂：文字、算數、圖書、印璽；地、水、火、風，種種諸論，咸所通達；又善方藥，療治諸病——顛狂、乾消、鬼魅、蠱毒，悉能除斷；文筆、讚詠、歌舞、妓樂、戲笑、談說，悉善其事；國城、村邑、宮宅、園苑、泉流、陂池、草樹、花藥，凡所布列，咸得其宜；金銀、摩尼、真珠、瑠璃、螺貝、璧玉、珊瑚等藏，悉知其處，出以示人；日月星宿、鳥鳴地震、夜夢吉凶，身相休咎，咸善觀察，一無錯謬；持戒入禪，神通無量，四無色等及餘一切世間之事，但於眾生不為損惱，為利益故咸悉開示，漸令安住無上佛法。「佛子！菩薩住是難勝地，以願力故，得見多佛。所謂：見多百佛，見多千佛，見多百千佛，乃至見多百千億那由他佛。悉恭敬尊重，承事供養，衣服、飲食、臥具、湯藥，一切資生悉以奉施，亦以供養一切眾僧，以此善根迴向阿耨多羅三藐三菩提。於諸佛所，恭敬聽法，聞已受持，隨力修行。復於彼諸佛法中而得出家；既出家已，又更聞法，得陀羅尼，為聞持法師。住此地中，經於百劫，經於千劫，乃至無量百千億那由他劫，所有善根轉更明淨。佛子！譬如真金，以硨磲磨瑩，轉更明淨；此地菩薩所有善根亦復如是，以方便慧思惟觀察，轉更明淨。佛子！菩薩住此難勝地，以方便智成就功德，下地善根所不能及。佛子！如日月星宿、宮殿光明，風力所持，不可沮壞，亦非餘風所能傾動；此地菩薩所有善根亦復如是，以方便智隨逐觀察，不可沮壞，亦非一切聲聞、獨覺世間善根所能傾動。此菩薩，十波羅蜜中，禪波羅蜜偏多；餘非不修，但隨力隨分。「佛子！是名：略說菩薩摩訶薩第五難勝地\n\n\n\n**〔L.287 批·注入11,354 CJK·0 手抄〕**\n\n**（6）現前地**——增上：—｜多作：兜率陀天王（全文）：\n\n> 。菩薩住此地，多作兜率陀天王，於諸眾生所作自在，摧伏一切外道邪見，能令眾生住實諦中。布施、愛語、利行、同事——如是一切諸所作業，皆不離念佛，不離念法，不離念僧，乃至不離念具足一切種、一切智智。復作是念：『我當於眾生中為首、為勝、為殊勝、為妙、為微妙、為上、為無上，乃至為一切智智依止者。』此菩薩若發勤精進，於一念頃，得千億三昧，見千億佛，知千億佛神力，能動千億佛世界，乃至示現千億身，一一身示千億菩薩以為眷屬；若以菩薩殊勝願力自在示現，過於此數，百劫、千劫乃至百千億那由他劫不能數知。」爾時，金剛藏菩薩欲重宣其義而說頌曰：「菩薩四地已清淨，思惟三世佛平等，戒心除疑道非道，如是觀察入五地。念處為弓根利箭，正勤為馬神足車，五力堅鎧破怨敵，勇健不退入五地。慚愧為衣覺分鬘，淨戒為香禪塗香，智慧方便妙莊嚴，入總持林三昧苑。如意為足正念頸，慈悲為眼智慧牙，人中師子無我吼，破煩惱怨入五地。菩薩住此第五地，轉修勝上清淨道，志求佛法不退轉，思念慈悲無厭倦。積集福智勝功德，精勤方便觀上地，佛力所加具念慧，了知四諦皆如實。善知世諦勝義諦，相諦差別成立諦，事諦生盡及道諦，乃至如來無礙諦。如是觀諦雖微妙，未得無礙勝解脫，以此能生大功德，是故超過世智慧。既觀諦已知有為，體性虛偽無堅實，得佛慈愍光明分，為利眾生求佛智。觀諸有為先後際，無明黑闇愛纏縛，流轉遲迴苦聚中，無我無人無壽命。愛取為因受來苦，欲求邊際不可得，迷妄漂流無返期，此等可愍我應度。蘊宅界蛇諸見箭，心火猛熾癡闇重，愛河漂轉不暇觀，苦海淪湑闕明導。如是知已勤精進，所作皆為度眾生，名為有念有慧者，乃至覺解方便者。習行福智無厭足，恭敬多聞不疲倦，國土相好皆莊嚴，如是一切為眾生。為欲教化諸世間，善知書數印等法，亦復善解諸方藥，療治眾病悉令愈。文詞歌舞皆巧妙，宮宅園池悉安隱，寶藏非一咸示人，利益無量眾生故。日月星宿地震動，乃至身相亦觀察，四禪無色及神通，為益世間皆顯示。智者住此難勝地，供那由佛亦聽法，如以妙寶磨真金，所有善根轉明淨。譬如星宿在虛空，風力所持無損動，亦如蓮華不著水，如是大士行於世。住此多作兜率王，能摧異道諸邪見，所修諸善為佛智，願得十力救眾生。彼復修行大精進，即時供養千億佛，得定動剎亦復然，願力所作過於是。如是第五難勝地，人中最上真實道，我以種種方便力，為諸佛子宣說竟。」之四十地品第二十六之四第六地第六地菩薩既聞諸勝行，其心歡喜雨妙華，放淨光明散寶珠，供養如來稱善說。百千天眾皆欣慶，共在空中散眾寶，華鬘瓔珞及幢幡，寶蓋塗香咸供佛。自在天王并眷屬，心生歡喜住空中，散寶成雲持供養，讚言：「佛子快宣說！」無量天女空中住，共以樂音歌讚佛，音中悉作如是言：「佛語能除煩惱病。法性本寂無諸相，猶如虛空不分別，超諸取著絕言道，真實平等常清淨。若能通達諸法性，於有於無心不動。為欲救世勤修行，此佛口生真佛子。不取眾相而行施，本絕諸惡堅持戒，解法無害常堪忍，知法性離具精進，已盡煩惱入諸禪，善達性空分別法，具足智力能博濟，滅除眾惡稱大士。」如是妙音千萬種，讚已默然瞻仰佛。解脫月語金剛藏：「以何行相入後地？」爾時，金剛藏菩薩告解脫月菩薩言：「佛子！菩薩摩訶薩已具足第五地，欲入第六現前地，當觀察十平等法。何等為十？所謂：一切法無相故平等，無體故平等，無生故平等，無成故平等，本來清淨故平等，無戲論故平等，無取捨故平等，寂靜故平等，如幻、如夢、如影、如響、如水中月、如鏡中像、如焰、如化故平等，有、無不二故平等。菩薩如是觀一切法自性清淨，隨順無違，得入第六現前地，得明利隨順忍，未得無生法忍。「佛子！此菩薩摩訶薩如是觀已，復以大悲為首、大悲增上、大悲滿足，觀世間生滅，作是念：『世間受生皆由著我，若離此著，則無生處。』復作是念：『凡夫無智，執著於我，常求有、無，不正思惟，起於妄行，行於邪道；罪行、福行、不動行，積集增長，於諸行中植心種子，有漏有取，復起後有生及老死。所謂：業為田，識為種，無明闇覆，愛水為潤，我慢溉灌，見網增長，生名色芽，名色增長生五根，諸根相對生觸，觸對生受，受後希求生愛，愛增長生取，取增長生有；有生已，於諸趣中起五蘊身，名生；生已衰變為老，終歿為死。於老死時，生諸熱惱；因熱惱故，憂愁悲歎，眾苦皆集。此因緣故，集無有集者，任運而滅亦無滅者。』菩薩如是隨順觀察緣起之相。佛子！此菩薩摩訶薩復作是念：『於第一義諦不了故名：無明，所作業果是行，行依止初心是識，與識共生四取蘊為名色，名色增長為六處，根、境、識三事和合是觸，觸共生有受，於受染著是愛，愛增長是取，取所起有漏業為有，從業起蘊為生，蘊熟為老，蘊壞為死；死時離別，愚迷貪戀，心胸煩悶為愁，涕泗諮嗟為歎，在五根為苦，在意地為憂，憂苦轉多為惱。如是但有苦樹增長，無我、無我所，無作、無受者。』復作是念：『若有作者，則有作事；若無作者，亦無作事，第一義中俱不可得。』佛子！此菩薩摩訶薩復作是念：『三界所有，唯是一心。如來於此分別演說十二有支，皆依一心，如是而立。何以故？隨事貪欲與心共生，心是識，事是行，於行迷惑是無明，與無明及心共生是名色，名色增長是六處，六處三分合為觸，觸共生是受，受無厭足是愛，愛攝不捨是取，彼諸有支生是有，有所起名：生，生熟為老，老壞為死。』「佛子！此中無明有二種業，一令眾生迷於所緣，二與行作生起因。行亦有二種業，一能生未來報，二與識作生起因。識亦有二種業，一令諸有相續，二與名色作生起因。名色亦有二種業，一互相助成，二與六處作生起因。六處亦有二種業，一各取自境界，二與觸作生起因。觸亦有二種業，一能觸所緣，二與受作生起因。受亦有二種業，一能領受愛憎等事，二與愛作生起因。愛亦有二種業，一染著可愛事，二與取作生起因。取亦有二種業，一令諸煩惱相續，二與有作生起因。有亦有二種業，一能令於餘趣中生，二與生作生起因。生亦有二種業，一能起諸蘊，二與老作生起因。老亦有二種業，一令諸根變異，二與死作生起因。死亦有二種業，一能壞諸行，二不覺知故相續不絕。「佛子！此中無明緣行，乃至生緣老死者，由無明乃至生為緣，令行乃至老死不斷，助成故。無明滅則行滅，乃至生滅則老死滅者，由無明乃至生不為緣，令諸行乃至老死斷滅，不助成故。佛子！此中無明、愛、取不斷是煩惱道，行、有不斷是業道，餘分不斷是苦道；前後際分別滅三道斷，如是三道離我、我所，但有生滅，猶如束蘆。復次，無明緣行者，是觀過去；識乃至受，是觀現在；愛乃至有，是觀未來。於是以後，展轉相續。無明滅行滅者，是觀待斷。復次，十二有支名為三苦，此中無明、行乃至六處是行苦，觸、受是苦苦，餘是壞苦；無明滅行滅者，是三苦斷。復次，無明緣行者，無明因緣能生諸行；無明滅行滅者，以無無明，諸行亦無，餘亦如是。又無明緣行者，是生繫縛；無明滅行滅者，是滅繫縛。餘亦如是。又無明緣行者，是隨順無所有觀；無明滅行滅者，是隨順盡滅觀。餘亦如是。「佛子！菩薩摩訶薩如是十種逆順觀諸緣起。所謂：有支相續故，一心所攝故，自業差別故，不相捨離故，三道不斷故，觀過去、現在、未來故，三苦聚集故，因緣生滅故，生滅繫縛故，無所有、盡觀故。「佛子，菩薩摩訶薩以如是十種相觀諸緣起，知無我、無人、無壽命、自性空、無作者、無受者，即得空解脫門現在前。觀諸有支皆自性滅，畢竟解脫，無有少法相生，即時得無相解脫門現在前。如是入空、無相已，無有願求，唯除大悲為首，教化眾生，即時得無願解脫門現在前。菩薩如是修三解脫門，離彼、我想，離作者、受者想，離有、無想。「佛子！此菩薩摩訶薩大悲轉增，精勤修習，為未滿菩提分法令圓滿故，作是念：『一切有為，有和合則轉，無和合則不轉；緣集則轉，緣不集則不轉。我如是知有為法多諸過患，當斷此和合因緣；然為成就眾生故，亦不畢竟滅於諸行。』佛子！菩薩如是觀察有為多諸過患，無有自性，不生不滅，而恒起大悲，不捨眾生，即得般若波羅蜜現前，名：無障礙智光明。成就如是智光明已，雖修習菩提分因緣而不住有為中，雖觀有為法自性寂滅亦不住寂滅中，以菩提分法未圓滿故。「佛子！菩薩住此現前地，得入空三昧、自性空三昧、第一義空三昧、第一空三昧、大空三昧、合空三昧、起空三昧、如實不分別空三昧、不捨離空三昧、離不離空三昧。此菩薩得如是十空三昧門為首，百千空三昧皆悉現前；如是十無相、十無願三昧門為首，百千無相、無願三昧門皆悉現前。「佛子！菩薩住此現前地，復更修習滿足不可壞心、決定心、純善心、甚深心、不退轉心、不休息心、廣大心、無邊心、求智心、方便慧相應心，皆悉圓滿。「佛子！菩薩以此心順佛菩提，不懼異論，入諸智地，離二乘道，趣於佛智，諸煩惱魔無能沮壞，住於菩薩智慧光明，於空、無相、無願法中皆善修習，方便智慧恒共相應，菩提分法常行不捨。佛子！菩薩住此現前地中，得般若波羅蜜行增上，得第三明利順忍，以於諸法如實相隨順無違故。「佛子！菩薩住此現前地已，以願力故，得見多佛。所謂：見多百佛，乃至見多百千億那由他佛。悉以廣大心、深心，供養恭敬，尊重讚歎，衣服、飲食、臥具、湯藥，一切資生悉以奉施，亦以供養一切眾僧，以此善根迴向阿耨多羅三藐三菩提。於諸佛所，恭敬聽法，聞已受持，得如實三昧智慧光明，隨順修行，憶持不捨。又得諸佛甚深法藏，經於百劫，經於千劫，乃至無量百千億那由他劫，所有善根轉更明淨。譬如真金，以毘瑠璃寶數數磨瑩，轉更明淨；此地菩薩所有善根亦復如是，以方便慧，隨逐觀察，轉更明淨，轉復寂滅，無能映蔽。譬如月光，照眾生身，令得清涼，四種風輪所不能壞；此地菩薩所有善根亦復如是，能滅無量百千億那由他眾生煩惱熾火，四種魔道所不能壞。此菩薩，十波羅蜜中，般若波羅蜜偏多；餘非不修，但隨力隨分。「佛子！是名：略說菩薩摩訶薩第六現前地\n\n**（7）遠行地**——增上：—｜多作：善化天王（全文）：\n\n> 。菩薩住此地，多作善化天王，所作自在，一切聲聞所有問難無能退屈，能令眾生除滅我慢、深入緣起。布施、愛語、利行、同事——如是一切諸所作業，皆不離念佛，乃至不離念具足一切種、一切智智。復作是念：『我當於一切眾生中為首、為勝，乃至為一切智智依止者。』此菩薩若勤行精進，於一念頃，得百千億三昧，乃至示現百千億菩薩以為眷屬；若以願力自在示現，過於此數，乃至百千億那由他劫不能數知。」爾時，金剛藏菩薩欲重宣其義而說頌曰：「菩薩圓滿五地已，觀法無相亦無性，無生無成本清淨，無有戲論無取捨，體相寂滅如幻等，有無不二離分別，隨順法性如是觀，此智得成入六地。明利順忍智具足，觀察世間生滅相，以癡闇力世間生，若滅癡闇世無有。觀諸因緣實義空，不壞假名和合用，無作無受無思念，諸行如雲遍興起。不知真諦名無明，所作思業愚癡果，識起共生是名色，如是乃至眾苦聚。了達三界依心有，十二因緣亦復然，生死皆由心所作，心若滅者生死盡。無明所作有二種，緣中不了為行因，如是乃至老終歿，從此苦生無有盡。無明為緣不可斷，彼緣若盡悉皆滅，愚癡愛取煩惱支，行有是業餘皆苦。癡至六處是行苦，觸受增長是苦苦，所餘有支是壞苦，若見無我三苦滅。無明與行為過去，識至於受現在轉，愛取有生未來苦，觀待若斷邊際盡。無明為緣是生縛，於緣得離縛乃盡，從因生果離則斷，觀察於此知性空。隨順無明起諸有，若不隨順諸有斷，此有彼有無亦然，十種思惟心離著。有支相續一心攝，自業不離及三道，三際三苦因緣生，繫縛起滅順無盡。如是普觀緣起行，無作無受無真實，如幻如夢如光影，亦如愚夫逐陽焰。如是觀察入於空，知緣性離得無相，了其虛妄無所願，唯除慈愍為眾生。大士修行解脫門，轉益大悲求佛法，知諸有為和合作，志樂決定勤行道。空三昧門具百千，無相無願亦復然，般若順忍皆增上，解脫智慧得成滿。復以深心多供佛，於佛教中修習道，得佛法藏增善根，如金瑠璃所磨瑩。如月清涼被眾物，四風來觸無能壞；此地菩薩超魔道，亦息群生煩惱熱。此地多作善化王，化導眾生除我慢，所作皆求一切智，悉已超勝聲聞道。此地菩薩勤精進，獲諸三昧百千億，亦見若干無量佛，譬如盛夏空中日。甚深微妙難見知，聲聞獨覺無能了，如是菩薩第六地，我為佛子已宣說。」第七地第七地是時天眾心歡喜，散寶成雲在空住，普發種種妙音聲，告於最勝清淨者：「了達勝義智自在，成就功德百千億，人中蓮華無所著，為利群生演深行。」自在天王在空中，放大光明照佛身，亦散最上妙香雲，普供除憂煩惱者。爾時天眾皆歡喜，悉發美音同讚述：「我等聞斯地功德，則為已獲大善利。」天女是時心慶悅，競奏樂音千萬種，悉以如來神力故，音中共作如是言：「威儀寂靜最無比，能調難調世應供，已超一切諸世間，而行於世闡妙道。雖現種種無量身，知身一一無所有，巧以言辭說諸法，不取文字音聲相。往詣百千諸國土，以諸上供供養佛，智慧自在無所著，不生於我佛國想。雖勤教化諸眾生，而無彼己一切心；雖已修成廣大善，而於善法不生著。以見一切諸世間，貪恚癡火常熾然，於諸想念悉皆離，發起大悲精進力。」一切諸天及天女，種種供養稱讚已，悉共同時默然住，瞻仰人尊願聞法。時解脫月復請言：「此諸大眾心清淨，第七地中諸行相，唯願佛子為宣說！」爾時，金剛藏菩薩告解脫月菩薩言：「佛子！菩薩摩訶薩具足第六地行已，欲入第七遠行地，當修十種方便慧起殊勝道。何等為十？所謂：雖善修空、無相、無願三昧，而慈悲不捨眾生，雖得諸佛平等法，而樂常供養佛；雖入觀空智門，而勤集福德；雖遠離三界，而莊嚴三界；雖畢竟寂滅諸煩惱焰，而能為一切眾生起滅貪、瞋、癡煩惱焰；雖知諸法如幻、如夢、如影、如響、如焰、如化、如水中月、如鏡中像、自性無二，而隨心作業無量差別；雖知一切國土猶如虛空，而能以清淨妙行莊嚴佛土；雖知諸佛法身本性無身，而以相好莊嚴其身；雖知諸佛音聲性空寂滅不可言說，而能隨一切眾生出種種差別清淨音聲；雖隨諸佛了知三世唯是一念，而隨眾生意解分別，以種種相、種種時、種種劫數而修諸行。菩薩以如是十種方便慧起殊勝行，從第六地入第七地；入已，此行常現在前，名為：住第七遠行地。「佛子！菩薩摩訶薩住此第七地已，入無量眾生界，入無量諸佛教化眾生業，入無量世界網，入無量諸佛清淨國土，入無量種種差別法，入無量諸佛現覺智，入無量劫數，入無量諸佛覺了三世智，入無量眾生差別信解，入無量諸佛示現種種名色身，入無量眾生欲樂諸根差別，入無量諸佛語言音聲令眾生歡喜，入無量眾生種種心行，入無量諸佛了知廣大智，入無量聲聞乘信解，入無量諸佛說智道令信解，入無量辟支佛所成就，入無量諸佛說甚深智慧門令趣入，入無量諸菩薩方便行，入無量諸佛所說大乘集成事令菩薩得入。此菩薩作是念：『如是無量如來境界，乃至於百千億那由他劫不能得知，我悉應以無功用無分別心成就圓滿。』「佛子！此菩薩以深智慧如是觀察，常勤修習方便慧起殊勝道，安住不動，無有一念休息廢捨；行、住、坐、臥乃至睡夢，未曾暫與蓋障相應，常不捨於如是想念。此菩薩於念念中，常能具足十波羅蜜。何以故？念念皆以大悲為首，修行佛法，向佛智故。所有善根，為求佛智，施與眾生，是名：檀那波羅蜜；能滅一切諸煩惱熱，是名：尸羅波羅蜜；慈悲為首，不損眾生，是名：羼提波羅蜜；求勝善法，無有厭足，是名：毘梨耶波羅蜜；一切智道常現在前，未甞散亂，是名：禪那波羅蜜；能忍諸法無生無滅，是名：般若波羅蜜；能出生無量智，是名：方便波羅蜜；能求上上勝智，是名：願波羅蜜；一切異論及諸魔眾無能沮壞，是名：力波羅蜜；如實了知一切法，是名：智波羅蜜。佛子！此十波羅蜜，菩薩於念念中皆得具足；如是，四攝、四持、三十七品、三解脫門，略說乃至一切菩提分法，於念念中皆悉圓滿。」爾時，解脫月菩薩問金剛藏菩薩言：「佛子！菩薩但於此第七地中滿足一切菩提分法，為諸地中亦能滿足？」金剛藏菩薩言：「佛子！菩薩於十地中皆能滿足菩提分法，然第七地最為殊勝。何以故？此第七地功用行滿，得入智慧自在行故。佛子！菩薩於初地中，緣一切佛法願求故，滿足菩提分法；第二地離心垢故，第三地願轉增長得法光明故，第四地入道故，第五地順世所作故，第六地入甚深法門故，第七地起一切佛法故，皆亦滿足菩提分法。何以故？菩薩從初地乃至第七地，成就智功用分。以此力故，從第八地乃至第十地，無功用行皆悉成就。佛子！譬如有二世界，一處雜染，一處純淨，是二中間難可得過，唯除菩薩有大方便神通願力。佛子！菩薩諸地亦復如是，有雜染行，有清淨行，是二中間難可得過，唯除菩薩有大願力方便智慧乃能得過。」解脫月菩薩言：「佛子！此七地菩薩，為是染行？為是淨行？」金剛藏菩薩言：「佛子！從初地至七地，所行諸行皆捨離煩惱業，以迴向無上菩提故，分得平等道故，然未名為超煩惱行。佛子！譬如轉輪聖王乘天象寶遊四天下，知有貧窮困苦之人，而不為彼眾患所染，然未名為超過人位；若捨王身，生於梵世，乘天宮殿，見千世界，遊千世界，示現梵天光明威德，爾乃名為超過人位。佛子！菩薩亦復如是，始從初地至於七地，乘波羅蜜乘遊行世間，知諸世間煩惱過患，以乘正道故，不為煩惱過失所染，然未名為超煩惱行；若捨一切有功用行，從第七地入第八地，乘菩薩清淨乘遊行世間，知煩惱過失不為所染，爾乃名為超煩惱行，以得一切盡超過故。佛子！此第七地菩薩盡超過多貪等諸煩惱眾住此地，不名有煩惱者，不名無煩惱者。何以故？一切煩惱不現行故，不名有者；求如來智心未滿故，不名無者。「佛子！菩薩住此第七地，以深淨心，成就身業，成就語業，成就意業。所有一切不善業道——如來所訶，皆已捨離；一切善業——如來所讚，常善修行。世間所有經書、技術，如五地中說，皆自然而行，不假功用。此菩薩於三千大千世界中為大明師，唯除如來及八地已上其餘菩薩，深心妙行無與等者，諸禪三昧、三摩鉢底、神通解脫皆得現前。然是修成，非如八地報得成就。此地菩薩於念念中具足修習方便智力及一切菩提分法，轉勝圓滿。「佛子！菩薩住此地，入菩薩善觀擇三昧、善擇義三昧、最勝慧三昧、分別義藏三昧、如實分別義三昧、善住堅固根三昧、智慧神通門三昧、法界業三昧、如來勝利三昧、種種義藏生死涅槃門三昧，入如是等具足大智神通門百萬三昧，淨治此地。是菩薩得此三昧，善治淨方便慧故，大悲力故，超過二乘地，得觀察智慧地。「佛子！菩薩住此地，善淨無量身業無相行，善淨無量語業無相行，善淨無量意業無相行故，得無生法忍光明。」解脫月菩薩言：「佛子！菩薩從初地來所有無量身、語、意業，豈不超過二乘耶？」金剛藏菩薩言：「佛子！彼悉超過，然但以願求諸佛法故，非是自智觀察之力；今第七地自智力故，一切二乘所不能及。譬如王子，生在王家，王后所生，具足王相，生已即勝一切臣眾，但以王力，非是自力；若身長大，藝業悉成，乃以自力超過一切。菩薩摩訶薩亦復如是，初發心時，以志求大法故，超過一切聲聞、獨覺；今住此地，以自所行智慧力故，出過一切二乘之上。佛子！菩薩住此第七地，得甚深遠離無行、常行身語意業，勤求上道而不捨離，是故菩薩雖行實際而不作證。」解脫月菩薩言：「佛子！菩薩從何地來，能入滅定？」金剛藏菩薩言：「佛子！菩薩從第六地來，能入滅定。今住此地，能念念入，亦念念起，而不作證。故此菩薩名為：成就不可思議身、語、意業，行於實際而不作證。譬如有人乘船入海，以善巧力不遭水難；此地菩薩亦復如是，乘波羅蜜船行實際海，以願力故而不證滅。「佛子！此菩薩得如是三昧智力，以大方便，雖示現生死，而恒住涅槃；雖眷屬圍遶，而常樂遠離；雖以願力三界受生，而不為世法所染；雖常寂滅，以方便力而還熾然，雖然不燒；雖隨順佛智，而示入聲聞、辟支佛地；雖得佛境界藏，而示住魔境界；雖超魔道，而現行魔法；雖示同外道行，而不捨佛法；雖示隨順一切世間，而常行一切出世間法；所有一切莊嚴之事，出過一切天、龍、夜叉、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽、人及非人、帝釋、梵王、四天王等之所有者，而不捨離樂法之心。「佛子！菩薩成就如是智慧，住遠行地，以願力故，得見多佛。所謂：見多百佛，乃至見多百千億那由他佛。於彼佛所，以廣大心、增勝心，供養恭敬，尊重讚歎，衣服、飲食、臥具、醫藥，一切資生悉以奉施，亦以供養一切眾僧，以此善根迴向阿耨多羅三藐三菩提。復於佛所恭敬聽法，聞已受持，獲如實三昧智慧光明，隨順修行。於諸佛所護持正法，常為如來之所讚喜，一切二乘所有問難無能退屈，利益眾生，法忍清淨。如是經無量百千億那由他劫，所有善根轉更增勝。譬如真金，以眾妙寶間錯莊嚴，轉更增勝，倍益光明，餘莊嚴具所不能及；菩薩住此第七地所有善根亦復如是，以方便慧力轉更明淨，非是二乘之所能及。佛子！譬如日光，星月等光無能及者，閻浮提地所有泥潦悉能乾竭；此遠行地菩薩亦復如是，一切二乘無有能及，悉能乾竭一切眾生諸惑泥潦。此菩薩，十波羅蜜中，方便波羅蜜偏多；餘非不行，但隨力隨分。「佛子！是名：略說菩薩摩訶薩第七遠行地\n\n**（8）不動地**——增上：般若波罗蜜增上｜多作：自在天王（全文）：\n\n> 。菩薩住此地，多作自在天王，善為眾生說證智法，令其證入。布施、愛語、利行、同事——如是一切諸所作業，皆不離念佛，乃至不離念具足一切種、一切智智。復作是念：『我當於一切眾生中為首、為勝，乃至為一切智智依止者。』此菩薩若發勤精進，於一念頃，得百千億那由他三昧，乃至示現百千億那由他菩薩以為眷屬；若以菩薩殊勝願力自在示現，過於此數，乃至百千億那由他劫不能數知。」爾時，金剛藏菩薩欲重宣此義而說頌曰：「第一義智三昧道，六地修行心滿足，即時成就方便慧，菩薩以此入七地。雖明三脫起慈悲，雖等如來勤供佛，雖觀於空集福德，菩薩以此昇七地。遠離三界而莊嚴，滅除惑火而起焰，知法無二勤作業，了剎皆空樂嚴土，解身不動具諸相，達聲性離善開演，入於一念事各別，智者以此昇七地。觀察此法得明了，廣為群迷興利益，入眾生界無有邊，佛教化業亦無量。國土諸法與劫數，解欲心行悉能入，說三乘法亦無限，如是教化諸群生。菩薩勤求最勝道，動息不捨方便慧，一一迴向佛菩提，念念成就波羅蜜。發心迴向是布施，滅惑為戒不害忍，求善無厭斯進策，於道不動即修禪，忍受無生名般若，迴向方便希求願，無能摧力善了智，如是一切皆成滿。初地攀緣功德滿，二地離垢三諍息，四地入道五順行，第六無生智光照，七住菩提功德滿，種種大願皆具足，以是能令八地中，一切所作咸清淨。此地難過智乃超，譬如世界二中間，亦如聖王無染著，然未名為總超度。若住第八智地中，爾乃逾於心境界，如梵觀世超人位，如蓮處水無染著。此地雖超諸惑眾，不名有惑非無惑，以無煩惱於中行，而求佛智心未足。世間所有眾技藝，經書詞論普明了，禪定三昧及神通，如是修行悉成就。菩薩修成七住道，超過一切二乘行，初地願故此由智，譬如王子力具足。成就甚深仍進道，心心寂滅不取證；譬如乘船入海中，在水不為水所溺。方便慧行功德具，一切世間無能了，供養多佛心益明，如以妙寶莊嚴金。此地菩薩智最明，如日舒光竭愛水，又作自在天中主，化導群生修正智。若以勇猛精勤力，獲多三昧見多佛，百千億數那由他，願力自在復過是。此是菩薩遠行地，方便智慧清淨道，一切世間天及人，聲聞獨覺無能知。」之五十地品第二十六之五第八地第八地是時天王及天眾，聞此勝行皆歡喜，為欲供養於如來，及以無央大菩薩，雨妙華幡及幢蓋，香鬘瓔珞與寶衣，無量無邊千萬種，悉以摩尼作嚴飾。天女同時奏天樂，普發種種妙音聲，供養於佛并佛子，共作是言而讚歎：「一切見者兩足尊，哀愍眾生現神力，令此種種諸天樂，普發妙音咸得聞。於一毛端百千億，那由他國微塵數，如是無量諸如來，於中安住說妙法。一毛孔內無量剎，各有四洲及大海，須彌鐵圍亦復然，悉見在中無迫隘。一毛端處有六趣，三種惡道及人天，諸龍神眾阿脩羅，各隨自業受果報。於彼一切剎土中，悉有如來演妙音，隨順一切眾生心，為轉最上淨法輪。剎中種種眾生身，身中復有種種剎，人天諸趣各各異，佛悉知已為說法。大剎隨念變為小，小剎隨念亦變大，如是神通無有量，世間共說不能盡。」普發此等妙音聲，稱讚如來功德已，眾會歡喜默然住，一心瞻仰欲聽說。時解脫月復請言：「今此眾會皆寂靜，願說隨次之所入，第八地中諸行相！」爾時，金剛藏菩薩告解脫月菩薩言：「佛子！菩薩摩訶薩於七地中，善修習方便慧，善清淨諸道，善集助道法。大願力所攝，如來力所加，自善力所持，常念如來力、無所畏、不共佛法，善清淨深心思覺，能成就福德智慧，大慈大悲不捨眾生，入無量智道，入一切法，本來無生、無起、無相、無成、無壞、無盡、無轉、無性為性，初、中、後際皆悉平等，無分別如如智之所入處，離一切心、意、識分別想，無所取著猶如虛空，入一切法如虛空性，是名：得無生法忍。「佛子！菩薩成就此忍，即時得入第八不動地，為深行菩薩難可知無差別，離一切相、一切想、一切執著，無量無邊，一切聲聞、辟支佛所不能及，離諸諠諍，寂滅現前。譬如比丘，具足神通，得心自在，次第乃至入滅盡定，一切動心、憶想分別悉皆止息。此菩薩摩訶薩亦復如是，住不動地，即捨一切功用行，得無功用法，身、口、意業念務皆息，住於報行。譬如有人，夢中見身墮在大河，為欲渡故，發大勇猛，施大方便；以大勇猛、施方便故，即便覺寤，既覺寤已，所作皆息。菩薩亦爾，見眾生身在四流中，為救度故，發大勇猛，起大精進；以勇猛、精進故，至不動地；既至此已，一切功用靡不皆息，二行、相行悉不現前。佛子！如生梵世，欲界煩惱皆不現前；住不動地亦復如是，一切心、意、識行皆不現前。此菩薩摩訶薩，菩薩心、佛心、菩提心、涅槃心尚不現起，況復起於世間之心！「佛子！此地菩薩本願力故，諸佛世尊親現其前與如來智，令其得入法流門中，作如是言：『善哉善哉！善男子！此忍第一，順諸佛法。然善男子！我等所有十力、無畏、十八不共諸佛之法，汝今未得，汝應為欲成就此法勤加精進，勿復放捨於此忍門。又善男子！汝雖得是寂滅解脫，然諸凡夫未能證得，種種煩惱皆悉現前，種種覺觀常相侵害，汝當愍念如是眾生。又善男子！汝當憶念本所誓願，普大饒益一切眾生，皆令得入不可思議智慧之門。又善男子！此諸法法性，若佛出世，若不出世，常住不異，諸佛不以得此法故名為如來，一切二乘亦能得此無分別法。又善男子！汝觀我等身相無量，智慧無量，國土無量，方便無量，光明無量，清淨音聲亦無有量；汝今宜應成就此事。又善男子！汝今適得此一法明，所謂：一切法無生、無分別。善男子！如來法明，無量入，無量作，無量轉，乃至百千億那由他劫不可得知；汝應修行，成就此法。又善男子！汝觀十方無量國土、無量眾生、無量法、種種差別，悉應如實通達其事。』「佛子！諸佛世尊與此菩薩如是等無量起智門，令其能起無量無邊差別智業。佛子！若諸佛不與此菩薩起智門者，彼時即入究竟涅槃，棄捨一切利眾生業。以諸佛與如是等無量無邊起智門故，於一念頃所生智業，從初發心乃至七地所修諸行，百分不及一，乃至百千億那由他分亦不及一；如是，阿僧祇分，歌羅分，算數分，譬諭分，優波尼沙陀分，亦不及一。何以故？佛子！是菩薩先以一身起行，今住此地，得無量身、無量音聲、無量智慧、無量受生、無量淨國，教化無量眾生，供養無量諸佛，入無量法門，具無量神通，有無量眾會道場差別，住無量身、語、意業集一切菩薩行，以不動法故。佛子！譬如乘船欲入大海，未至於海，多用功力；若至海已，但隨風去，不假人力以至大海，一日所行比於未至，其未至時設經百歲亦不能及。佛子！菩薩摩訶薩亦復如是，積集廣大善根資糧，乘大乘船到菩薩行海，於一念頃以無功用智入一切智智境界，本有功用行經於無量百千億那由他劫所不能及。「佛子！菩薩住此第八地，以大方便善巧智所起無功用覺慧，觀一切智智所行境。所謂：觀世間成，觀世間壞；由此業集故成，由此業盡故壞。幾時成？幾時壞？幾時成住？幾時壞住？皆如實知。又知地界小相、大相、無量相、差別相，知水、火、風界小相、大相、無量相、差別相，知微塵細相、差別相、無量差別相。隨何世界中所有微塵聚及微塵差別相，皆如實知；隨何世界中所有地、水、火、風界各若干微塵，所有寶物若干微塵，眾生身若干微塵，國土身若干微塵，皆如實知。知眾生大身、小身各若干微塵成，知地獄身、畜生身、餓鬼身、阿脩羅身、天身、人身各若干微塵成，得如是知微塵差別智。又知欲界、色界、無色界成，知欲界、色界、無色界壞，知欲界、色界、無色界小相、大相、無量相、差別相，得如是觀三界差別智。「佛子！此菩薩復起智明，教化眾生。所謂：善知眾生身差別，善分別眾生身，善觀察所生處；隨其所應而為現身，教化成熟。此菩薩於一三千大千世界，隨眾生身信解差別，以智光明普現受生；如是，若二、若三，乃至百千，乃至不可說三千大千世界，隨眾生身信解差別，普於其中示現受生。此菩薩成就如是智慧故，於一佛剎其身不動，乃至不可說佛剎眾會中悉現其身。佛子！此菩薩隨諸眾生身心信解種種差別，於彼佛國眾會之中而現其身。所謂：於沙門眾中示沙門形，婆羅門眾中示婆羅門形，剎利眾中示剎利形；如是，毘舍眾、首陀眾、居士眾、四天王眾、三十三天眾、夜摩天眾、兜率陀天眾、化樂天眾、他化自在天眾、魔眾、梵眾，乃至阿迦尼吒天眾中，各隨其類而為現形。又應以聲聞身得度者，現聲聞形；應以辟支佛身得度者，現辟支佛形；應以菩薩身得度者，現菩薩形；應以如來身得度者，現如來形。佛子！菩薩如是於一切不可說佛國土中，隨諸眾生信樂差別，如是如是而為現身。「佛子！此菩薩遠離一切身想分別，住於平等。此菩薩知眾生身、國土身、業報身、聲聞身、獨覺身、菩薩身、如來身、智身、法身、虛空身。此菩薩知諸眾生心之所樂，能以眾生身作自身，亦作國土身、業報身，乃至虛空身。又知眾生心之所樂，能以國土身作自身，亦作眾生身、業報身，乃至虛空身。又知諸眾生心之所樂，能以業報身作自身，亦作眾生身、國土身，乃至虛空身。又知眾生心之所樂，能以自身作眾生身、國土身，乃至虛空身。隨諸眾生所樂不同，則於此身現如是形。此菩薩知眾生集業身、報身、煩惱身、色身、無色身，又知國土身小相、大相、無量相、染相、淨相、廣相、倒住相、正住相、普入相、方網差別相，知業報身假名差別，知聲聞身、獨覺身、菩薩身假名差別，知如來身有菩提身、願身、化身、力持身、相好莊嚴身、威勢身、意生身、福德身、法身、智身，知智身善思量相、如實決擇相、果行所攝相、世間出世間差別相、三乘差別相、共相、不共相、出離相、非出離相、學相、無學相，知法身平等相、不壞相、隨時隨俗假名差別相、眾生非眾生法差別相、佛法聖僧法差別相，知虛空身無量相、周遍相、無形相、無異相、無邊相、顯現色身相。佛子！菩薩成就如是身智已，得命自在、心自在、財自在、業自在、生自在、願自在、解自在、如意自在、智自在、法自在。得此十自在故，則為不思議智者、無量智者、廣大智者、無能壞智者。「此菩薩如是入已，如是成就已，得畢竟無過失身業、無過失語業、無過失意業。身、語、意業隨智慧行，般若波羅蜜增上，大悲為首，方便善巧，善能分別，善起大願，佛力所護，常勤修習利眾生智，普住無邊差別世界。佛子！舉要言之：菩薩住此不動地，身、語、意業諸有所作，皆能積集一切佛法。佛子！菩薩住此地，得善住深心力，一切煩惱不行故；得善住勝心力，不離於道故；得善住大悲力，不捨利益眾生故；得善住大慈力，救護一切世間故；得善住陀羅尼力，不忘於法故：得善住辯才力，善觀察分別一切法故；得善住神通力，普往無邊世界故：得善住大願力，不捨一切菩薩所作故；得善住波羅蜜力，成就一切佛法故；得如來護念力，一切種、一切智智現前故。此菩薩得如是智力，能現一切諸所作事，於諸事中無有過咎。「佛子！此菩薩智地名為：不動地，無能沮壞故；名為：不轉地，智慧無退故；名為：難得地，一切世間無能測故；名為：童真地，離一切過失故；名為：生地，隨樂自在故；名為：成地，更無所作故；名為：究竟地，智慧決定故；名為：變化地，隨願成就故；名為：力持地，他不能動故；名為：無功用地，先已成就故。佛子！菩薩成就如是智慧，入佛境界，佛功德照，順佛威儀，佛境現前，常為如來之所護念，梵、釋、四王、金剛力士常隨侍衛，恒不捨離諸大三昧，能現無量諸身差別，於一一身有大勢力，報得神通三昧自在，隨有可化眾生之處示成正覺。佛子！菩薩如是入大乘會，獲大神通，放大光明，入無礙法界，知世界差別，示現一切諸大功德，隨意自在，善能通達前際，後際，普伏一切魔邪之道，深入如來所行境界，於無量國土修菩薩行，以能獲得不退轉法，是故說名：住不動地。「佛子！菩薩住此不動地已，以三昧力，常得現見無量諸佛，恒不捨離承事供養。此菩薩於一一劫、一一世界，見無量百佛、無量千佛，乃至無量百千億那由他佛，恭敬尊重，承事供養，一切資生悉以奉施。於諸佛所得於如來甚深法藏，受世界差別等無量法明；若有問難世界差別如是等事，無能屈者。如是經於無量百劫、無量千劫，乃至無量百千億那由他劫，所有善根轉增明淨。譬如真金治作寶冠，置閻浮提主聖王頂上，一切臣民諸莊嚴具無與等者；此地菩薩所有善根亦復如是，一切二乘乃至第七地菩薩所有善根無能及者，以住此地大智光明，普滅眾生煩惱黑闇，善能開闡智慧門故。佛子！譬如千世界主大梵天王，能普運慈心，普放光明，滿千世界；此地菩薩亦復如是，能放光明，照百萬佛剎微塵數世界，令諸眾生滅煩惱火而得清涼。此菩薩，十波羅蜜中，願波羅蜜增上；餘波羅蜜非不修行，但隨力隨分。是名：略說諸菩薩摩訶薩第八不動地\n\n\n\n**〔L.288 批·注入13,274 CJK·0 手抄〕**\n\n**（9）善慧地**——增上：力波罗蜜增上｜多作：大梵天王（全文）：\n\n> ；若廣說者，經無量劫不可窮盡。「佛子！菩薩摩訶薩住此地，多作大梵天王，主千世界，最勝自在，善說諸義，能與聲聞、辟支佛、諸菩薩波羅蜜道；若有問難世界差別，無能退屈。布施、愛語、利行、同事——如是一切諸所作業，皆不離念佛，乃至不離念一切種、一切智智。復作是念：『我當於一切眾生中為首、為勝，乃至為一切智智依止者。』此菩薩若以發起大精進力，於一念頃，得百萬三千大千世界微塵數三昧，乃至示現百萬三千大千世界微塵數菩薩以為眷屬；若以菩薩殊勝願力自在示現，過於是數，乃至百千億那由他劫不能數知。」爾時，金剛藏菩薩欲重宣其義而說頌曰：「七地修治方便慧，善集助道大願力，復得人尊所攝持，為求勝智登八住。功德成就恒慈愍，智慧廣大等虛空，聞法能生決定力，是則寂滅無生忍。知法無生無起相，無成無壞無盡轉，離有平等絕分別，超諸心行如空住。成就是忍超戲論，甚深不動恒寂滅，一切世間無能知，心相取著悉皆離。住於此地不分別，譬如比丘入滅定，如夢渡河覺則無，如生梵天絕下欲。以本願力蒙勸導，歎其忍勝與灌頂，語言：『我等眾佛法，汝今未獲當勤進。汝雖已滅煩惱火，世間惑焰猶熾然，當念本願度眾生，悉使修因趣解脫。法性真常離心念，二乘於此亦能得，不以此故為世尊，但以甚深無礙智。』如是人天所應供，與此智慧令觀察，無邊佛法悉得成，一念超過曩眾行。菩薩住茲妙智地，則獲廣大神通力，一念分身遍十方，如船入海因風濟。心無功用任智力，悉知國土成壞住，諸界種種各殊異，小大無量皆能了。三千世界四大種，六趣眾生身各別，及以眾寶微塵數，以智觀察悉無餘。菩薩能知一切身，為化眾生同彼形，國土無量種種別，悉為現形無不遍。譬如日月住虛空，一切水中皆現影；住於法界無所動，隨心現影亦復然。隨其心樂各不同，一切眾中皆現身，聲聞獨覺與菩薩，及以佛身靡不現。眾生國土業報身，種種聖人智法身，虛空身相皆平等，普為眾生而示作。十種聖智普觀察，復順慈悲作眾業，所有佛法皆成就，持戒不動如須彌。十力成就不動搖，一切魔眾無能轉，諸佛護念天王禮，密跡金剛恒侍衛。此地功德無邊際，千萬億劫說不盡，復以供佛善益明，如王頂上莊嚴具。菩薩住此第八地，多作梵王千界主，演說三乘無有窮，慈光普照除眾惑。一念所獲諸三昧，百萬世界微塵等，諸所作事悉亦然，願力示現復過是。菩薩第八不動地，我為汝等已略說，若欲次第廣分別，經於億劫不能盡。」第九地第九地說此菩薩八地時，如來現大神通力，震動十方諸國土，無量億數難思議。一切知見無上尊，其身普放大光明，照耀彼諸無量土，悉使眾生獲安樂。菩薩無量百千億，俱時踊在虛空住，以過諸天上妙供，供養說中最勝者。大自在王自在天，悉共同心喜無量，各以種種眾供具，供養甚深功德海。復有天女千萬億，身心歡喜悉充遍，各奏樂音無量種，供養人中大導師。是時眾樂同時奏，百千萬億無量別，悉以善逝威神力，演出妙音而讚歎：「寂靜調柔無垢害，隨所入地善修習，心如虛空詣十方，廣說佛道悟群生。天上人間一切處，悉現無等妙莊嚴，以從如來功德生，令其見者樂佛智。不離一剎詣眾土，如月普現照世間，音聲心念悉皆滅，譬猶谷響無不應。若有眾生心下劣，為彼演說聲聞行；若心明利樂辟支，則為彼說中乘道。若有慈悲樂饒益，為說菩薩所行事；若有最勝智慧心，則示如來無上法。譬如幻師作眾事，種種形相皆非實，菩薩智幻亦如是，雖現一切離有無。」如是美音千萬種，歌讚佛已默然住。解脫月言：「今眾淨，願說九地所行道！」爾時，金剛藏菩薩告解脫月菩薩言：「佛子！菩薩摩訶薩以如是無量智思量觀察，欲更求轉勝寂滅解脫，復修習如來智慧，入如來祕密法，觀察不思議大智性，淨諸陀羅尼三昧門，具廣大神通，入差別世界，修力、無畏、不共法，隨諸佛轉法輪，不捨大悲本願力，得入菩薩第九善慧地。「佛子！菩薩摩訶薩住此善慧地，如實知善不善無記法行、有漏無漏法行、世間出世間法行、思議不思議法行、定不定法行、聲聞獨覺法行、菩薩行法行、如來地法行、有為法行、無為法行。此菩薩以如是智慧，如實知眾生心稠林、煩惱稠林、業稠林、根稠林、解稠林、性稠林、樂欲稠林、隨眠稠林、受生稠林、習氣相續稠林、三聚差別稠林。此菩薩如實知眾生心種種相，所謂：雜起相、速轉相、壞不壞相、無形質相、無邊際相、清淨相、垢無垢相、縛不縛相、幻所作相、隨諸趣生相；如是百千萬億乃至無量，皆如實知。又知諸煩惱種種相，所謂：久遠隨行相、無邊引起相、俱生不捨相、眠起一義相、與心相應不相應相、隨趣受生而住相、三界差別相、愛見癡慢如箭深入過患相、三業因緣不絕相；略說乃至八萬四千，皆如實知。又知諸業種種相，所謂：善不善無記相、有表示無表示相、與心同生不離相、因自性剎那壞而次第集果不失相、有報無報相、受黑黑等眾報相、如田無量相、凡聖差別相、現受生受後受相、乘非乘定不定相；略說乃至八萬四千，皆如實知。又知諸根軟中勝相、先際後際差別無差別相、上中下相、煩惱俱生不相離相、乘非乘定不定相、淳熟調柔相、隨根網輕轉壞相、增上無能壞相、退不退差別相、遠隨共生不同相；略說乃至八萬四千，皆如實知。又知諸解軟中上、諸性軟中上、樂欲軟中上；皆略說乃至八萬四千。又知諸隨眠種種相，所謂：與深心共生相、與心共生相、心相應不相應差別相、久遠隨行相、無始不拔相、與一切禪定解脫三昧三摩鉢底神通相違相、三界相續受生繫縛相、令無邊心相續現起相、開諸處門相、堅實難治相、地處成就不成就相、唯以聖道拔出相。又知受生種種相，所謂：隨業受生相、六趣差別相、有色無色差別相、有想無想差別相、業為田愛水潤無明暗覆識為種子生後有芽相、名色俱生不相離相、癡愛希求續有相、欲受欲生無始樂著相、妄謂出三界貪求相。又知習氣種種相，所謂：行不行差別相、隨趣熏習相、隨眾生行熏習相、隨業煩惱熏習相、善不善無記熏習相、隨入後有熏習相、次第熏習相、不斷煩惱遠行不捨熏習相、實非實熏習相、見聞親近聲聞獨覺菩薩如來熏習相。又知眾生正定邪定不定相，所謂：正見正定相、邪見邪定相、二俱不定相、五逆邪定相、五根正定相、二俱不定相、八邪邪定相、正性正定相、更不作二俱離不定相、深著邪法邪定相、習行聖道正定相、二俱捨不定相。佛子！菩薩隨順如是智慧，名：住善慧地；住此地已，了知眾生諸行差別，教化調伏，令得解脫。「佛子！此菩薩善能演說聲聞乘法、獨覺乘法、菩薩乘法、如來地法；一切行處，智隨行故，能隨眾生根性、欲解、所行有異、諸聚差別，亦隨受生、煩惱、眠、縛、諸業習氣而為說法，令生信解，增益智慧，各於其乘而得解脫。「佛子！菩薩住此善慧地，作大法師，具法師行，善能守護如來法藏，以無量善巧智，起四無礙辯，用菩薩言辭而演說法。此菩薩常隨四無礙智轉，無暫捨離。何等為四，所謂：法無礙智、義無礙智、辭無礙智、樂說無礙智。此菩薩以法無礙智，知諸法自相；義無礙智，知諸法別相；辭無礙智，無錯謬說；樂說無礙智，無斷盡說。復次，以法無礙智，知諸法自性；義無礙智，知諸法生滅；辭無礙智，安立一切法不斷說；樂說無礙智，隨所安立，不可壞無邊說。復次，以法無礙智，知現在法差別；義無礙智，知過去、未來法差別；辭無礙智，於去、來、今法無錯謬說；樂說無礙智，於一一世無邊法明了說。復次，以法無礙智，知法差別；義無礙智，知義差別；辭無礙智，隨其言音說；樂說無礙智，隨其心樂說。復次，法無礙智，以法智知差別不異；義無礙智，以比智知差別如實；辭無礙智，以世智差別說；樂說無礙智，以第一義智善巧說。復次，法無礙智，知諸法一相不壞；義無礙智，知蘊、界、處、諦、緣起善巧；辭無礙智，以一切世間易解了美妙音聲、文字說；樂說無礙智，以轉勝無邊法明說。復次，法無礙智，知一乘平等性；義無礙智，知諸乘差別性；辭無礙智，說一切乘無差別；樂說無礙智，說一一乘無邊法。復次，法無礙智，知一切菩薩行、智行、法行智隨證；義無礙智，知十地分位義差別；辭無礙智，說地道無差別相；樂說無礙智，說一一地無邊行相。復次，法無礙智，知一切如來一念成正覺；義無礙智，知種種時、種種處等各差別；辭無礙智，說成正覺差別；樂說無礙智，於一一句法無量劫說不盡。復次，法無礙智，知一切如來語、力、無所畏、不共佛法，大慈大悲，辯才方便，轉法輪，一切智智隨證；義無礙智，知如來隨八萬四千眾生心、行、根、解、差別音聲；辭無礙智，隨一切眾生行，以如來音聲差別說；樂說無礙智，隨眾生信解，以如來智清淨行圓滿說。「佛子！菩薩住第九地，得如是善巧無礙智，得如來妙法藏，作大法師，得義陀羅尼、法陀羅尼、智陀羅尼、光照陀羅尼、善慧陀羅尼、眾財陀羅尼、威德陀羅尼、無礙門陀羅尼、無邊際陀羅尼、種種義陀羅尼，如是等百萬阿僧祇陀羅尼門皆得圓滿，以百萬阿僧祇善巧音聲辯才門而演說法。此菩薩得如是百萬阿僧祇陀羅尼門已，於無量佛所一一佛前，悉以如是百萬阿僧祇陀羅尼門聽聞正法，聞已不忘，以無量差別門為他演說。此菩薩初見於佛，頭頂禮敬，即於佛所得無量法門；此所得法門，非彼聞持諸大聲聞，於百千劫所能領受。此菩薩得如是陀羅尼、如是無礙智，坐於法座而說於法；大千世界滿中眾生，隨其心樂差別為說；唯除諸佛及受職菩薩，其餘眾會威德光明無能與比。此菩薩處於法座，欲以一音，令諸大眾皆得解了，即得解了；或時欲以種種音聲，令諸大眾皆得開悟；或時心欲放大光明，演說法門；或時心欲於其身上一一毛孔，皆演法音；或時心欲乃至三千大千世界所有一切形、無形物，皆悉演出妙法言音；或時心欲發一言音，周遍法界，悉令解了；或時心欲一切言音，皆作法音，恒住不滅；或時心欲一切世界簫、笛、鐘、鼓及以歌詠，一切樂聲皆演法音；或時心欲於一字中，一切法句言音差別，皆悉具足；或時心欲令不可說無量世界地、水、火、風四大聚中所有微塵，一一塵中皆悉演出不可說法門。如是所念，一切隨心，無不得者。「佛子！此菩薩，假使三千大千世界所有眾生咸至其前，一一皆以無量言音而興問難，一一問難各各不同；菩薩於一念頃悉能領受，仍以一音普為解釋，令隨心樂，各得歡喜。如是乃至不可說世界所有眾生，一剎那間，一一皆以無量言音而興問難，一一問難各各不同；菩薩於一念頃悉能領受，亦以一音普為解釋，各隨心樂，令得歡喜。乃至不可說不可說世界滿中眾生，菩薩皆能隨其心樂、隨根、隨解而為說法，承佛神力廣作佛事，普為一切作所依怙。佛子！此菩薩復更精進，成就智明。假使一毛端處有不可說世界微塵數諸佛眾會，一一眾會有不可說世界微塵數眾生，一一眾生有不可說世界微塵數性、欲，彼諸佛隨其性、欲各與法門；如一毛端處，一切法界處悉亦如是。如是所說無量法門，菩薩於一念中悉能領受，無有忘失。「佛子！菩薩住此第九地，晝夜專勤更無餘念，唯入佛境界親近如來，入諸菩薩甚深解脫，常在三昧，恒見諸佛，未曾捨離。一一劫中見無量佛、無量百佛、無量千佛，乃至無量百千億那由他佛，恭敬尊重，承事供養，於諸佛所種種問難，得說法陀羅尼，所有善根轉更明淨。譬如真金，善巧金師用作寶冠，轉輪聖王以嚴其首，四天下內一切小王及諸臣民諸莊嚴具無與等者；此第九地菩薩善根亦復如是，一切聲聞、辟支佛及下地菩薩所有善根無能與等。佛子！譬如二千世界主大梵天王，身出光明，二千界中幽遠之處悉能照耀，除其黑闇；此地菩薩所有善根亦復如是，能出光明照眾生心，煩惱黑闇皆令息滅。此菩薩，十波羅蜜中，力波羅蜜最勝；餘波羅蜜非不修行，但隨力隨分。「佛子！是名：略說菩薩摩訶薩第九善慧地\n\n**（10）法雲地**——增上：智波罗蜜增上｜多作：大梵王（全文）：\n\n> ；若廣說者，於無量劫亦不能盡。佛子！菩薩摩訶薩住此地，多作二千世界主大梵天王，善能統理，自在饒益，能為一切聲聞、緣覺及諸菩薩分別演說波羅蜜行；隨眾生心，所有問難無能屈者。布施、愛語、利行、同事——如是一切諸所作業，皆不離念佛，乃至不離念一切種、一切智智。復作是念：『我當於一切眾生中為首、為勝，乃至為一切智智依止者。』此菩薩若發勤精進，於一念頃，得百萬阿僧祇國土微塵數三昧，乃至示現百萬阿僧祇國土微塵數菩薩以為眷屬；若以菩薩殊勝願力自在示現，過於此數，乃至百千億那由他劫不能數知。」爾時，金剛藏菩薩欲重宣其義而說頌曰：「無量智力善觀察，最上微妙世難知，普入如來祕密處，利益眾生入九地。總持三昧皆自在，獲大神通入眾剎，力智無畏不共法，願力悲心入九地。住於此地持法藏，了善不善及無記，有漏無漏世出世，思不思議悉善知。若法決定不決定，三乘所作悉觀察，有為無為行差別，如是而知入世間。若欲知諸眾生心，則能以智如實知，種種速轉壞非壞，無質無邊等眾相。煩惱無邊恒共伴，眠起一義續諸趣，業性種種各差別，因壞果集皆能了。諸根種種下中上，先後際等無量別，解性樂欲亦復然，八萬四千靡不知。眾生惑見恒隨縛，無始稠林未除翦，與志共俱心並生，常相羈繫不斷絕。但唯妄想非實物，不離於心無處所，禪定境排仍退轉，金剛道滅方畢竟。六趣受生各差別，業田愛潤無明覆，識為種子名色芽，三界無始恒相續。惑業心習生諸趣，若離於此不復生；眾生悉在三聚中，或溺於見或行道。住於此地善觀察，隨其心樂及根解，悉以無礙妙辯才，如其所應差別說。處於法座如師子，亦如牛王寶山王，又如龍王布密雲，霔甘露雨充大海。善知法性及奧義，隨順言辭能辯說，總持百萬阿僧祇，譬如大海受眾雨。總持三昧皆清淨，能於一念見多佛，一一佛所皆聞法，復以妙音而演暢。若欲三千大千界，教化一切諸群生，如雲廣布無不及，隨其根欲悉令喜。毛端佛眾無有數，眾生心樂亦無極，悉應其心與法門，一切法界皆如是。菩薩勤加精進力，復獲功德轉增勝，聞持爾所諸法門，如地能持一切種。十方無量諸眾生，咸來親近會中坐，一念隨心各問難，一音普對悉充足。住於此地為法王，隨機誨誘無厭倦，日夜見佛未曾捨，入深寂滅智解脫。供養諸佛善益明，如王頂上妙寶冠，復使眾生煩惱滅，譬如梵王光普照。住此多作大梵王，以三乘法化眾生，所行善業普饒益，乃至當成一切智。一念所入諸三昧，阿僧祇剎微塵數，見佛說法亦復然，願力所作復過此。此是第九善慧地，大智菩薩所行處，甚深微妙難可見，我為佛子已宣說。」之六十地品第二十六之六第十地第十地淨居天眾那由他，聞此地中諸勝行，空中踊躍心歡喜，悉共虔誠供養佛。不可思議菩薩眾，亦在空中大歡喜，俱然最上悅意香，普熏眾會令清淨。自在天王與天眾，無量億數在虛空，普散天衣供養佛，百千萬種繽紛下。天諸采女無有量，靡不歡欣供養佛，各奏種種妙樂音，悉以此言而讚歎：「佛身安坐一國土，一切世界悉現身，身相端嚴無量億，法界廣大悉充滿。於一毛孔放光明，普滅世間煩惱暗，國土微塵可知數，此光明數不可測。或見如來具眾相，轉於無上正法輪，或見遊行諸佛剎，或見寂然安不動。或現住於兜率宮，或現下生入母胎，或示住胎或出胎，悉令無量國中見。或現出家修世道，或現道場成正覺，或現說法或涅槃，普使十方無不覩。譬如幻師知幻術，在於大眾多所作；如來智慧亦復然，於世間中普現身。佛住甚深真法性，寂滅無相同虛空，而於第一實義中，示現種種所行事。所作利益眾生事，皆依法性而得有，相與無相無差別，入於究竟皆無相。若有欲得如來智，應離一切妄分別，有無通達皆平等，疾作人天大導師。」無量無邊天女眾，種種言音稱讚已，身心寂靜共安樂，瞻仰如來默然住。即時菩薩解脫月，知諸眾會咸寂靜，向金剛藏而請言：「大無畏者真佛子！從第九地入十地，所有功德諸行相，及以神通變化事，願聰慧者為宣說！」爾時，金剛藏菩薩摩訶薩告解脫月菩薩言：「佛子！菩薩摩訶薩從初地乃至第九地，以如是無量智慧觀察覺了已，善思惟修習，善滿足白法，集無邊助道法，增長大福德智慧，廣行大悲，知世界差別，入眾生界稠林，入如來所行處，隨順如來寂滅行，常觀察如來力、無所畏、不共佛法，名為：得一切種、一切智智受職位。「佛子！菩薩摩訶薩以如是智慧入受職地已，即得菩薩離垢三昧、入法界差別三昧、莊嚴道場三昧、一切種華光三昧、海藏三昧、海印三昧、虛空界廣大三昧、觀一切法自性三昧、知一切眾生心行三昧、一切佛皆現前三昧，如是等百萬阿僧祇三昧皆現在前。菩薩於此一切三昧，若入若起，皆得善巧，亦善了知一切三昧所作差別。其最後三昧，名：受一切智勝職位。此三昧現在前時，有大寶蓮華忽然出生。其華廣大，量等百萬三千大千世界，以眾妙寶間錯莊嚴，超過一切世間境界；出世善根之所生起，知諸法如幻性眾行所成，恒放光明普照法界，非諸天處之所能有；毘瑠璃摩尼寶為莖，栴檀王為臺，碼碯為鬚，閻浮檀金為葉，其華常有無量光明，眾寶為藏，寶網彌覆，十三千大千世界微塵數蓮華以為眷屬。爾時，菩薩坐此華座，身相大小正相稱可；無量菩薩以為眷屬，各坐其餘蓮華之上，周匝圍遶，一一各得百萬三昧，向大菩薩一心瞻仰。「佛子！此大菩薩并其眷屬坐華座時，所有光明及以言音普皆充滿十方法界，一切世界咸悉震動，惡趣休息，國土嚴淨，同行菩薩靡不來集，人天音樂同時發聲，所有眾生悉得安樂，以不思議供養之具供一切佛，諸佛眾會悉皆顯現。「佛子！此菩薩坐彼大蓮華座時，於兩足下放百萬阿僧祇光明，普照十方諸大地獄，滅眾生苦；於兩膝輪放百萬阿僧祇光明，普照十方諸畜生趣，滅眾生苦；於𪗇輪中放百萬阿僧祇光明，普照十方閻羅王界，滅眾生苦；從左右脇放百萬阿僧祇光明，普照十方一切人趣，滅眾生苦；從兩手中放百萬阿僧祇光明，普照十方一切諸天及阿脩羅所有宮殿；從兩肩上放百萬阿僧祇光明，普照十方一切聲聞；從其項背放百萬阿僧祇光明，普照十方辟支佛身；從其面門放百萬阿僧祇光明，普照十方初始發心乃至九地諸菩薩身；從兩眉間放百萬阿僧祇光明，普照十方受職菩薩，令魔宮殿悉皆不現；從其頂上放百萬阿僧祇三千大千世界微塵數光明，普照十方一切世界諸佛如來道場眾會，右遶十匝，住虛空中，成光明網，名：熾然光明，發起種種諸供養事供養於佛，餘諸菩薩從初發心乃至九地所有供養而比於此，百分不及一，乃至算數譬諭所不能及。其光明網普於十方一一如來眾會之前，雨眾妙香、華鬘、衣服、幢幡、寶蓋、諸摩尼等莊嚴之具以為供養，皆從出世善根所生，超過一切世間境界。若有眾生見知此者，皆於阿耨多羅三藐三菩提得不退轉。「佛子！此大光明作於如是供養事畢，復遶十方一切世界一一諸佛道場眾會，經十匝已，從諸如來足下而入。爾時，諸佛及諸菩薩，知某世界中，某菩薩摩訶薩能行如是廣大之行到受職位。佛子！是時，十方無量無邊乃至九地諸菩薩眾皆來圍遶，恭敬供養，一心觀察。正觀察時，其諸菩薩即各獲得十千三昧。當爾之時，十方所有受職菩薩，皆於金剛莊嚴臆德相中出大光明，名：能壞魔怨，百萬阿僧祇光明以為眷屬，普照十方，現於無量神通變化；作是事已，而來入此菩薩摩訶薩金剛莊嚴臆德相中；其光入已，令此菩薩所有智慧、勢力增長過百千倍。「爾時，十方一切諸佛從眉間出清淨光明，名：增益一切智神通，無數光明以為眷屬，普照十方一切世界，右遶十匝，示現如來廣大自在，開悟無量百千億那由他諸菩薩眾，周遍震動一切佛剎，滅除一切諸惡道苦，隱蔽一切諸魔宮殿，示一切佛得菩提處道場眾會莊嚴威德；如是普照盡虛空遍法界一切世界已，而來至此菩薩會上周匝右遶，示現種種莊嚴之事；現是事已，從大菩薩頂上而入，其眷屬光明亦各入彼諸菩薩頂。當爾之時，此菩薩得先所未得百萬三昧，名為：已得受職之位，入佛境界，具足十力，墮在佛數。佛子！如轉輪聖王所生太子，母是正后，身相具足。其轉輪王令此太子坐白象寶妙金之座，張大網幔，建大幢幡，然香散花，奏諸音樂，取四大海水置金瓶內，王執此瓶灌太子頂，是時即名：受王職位，墮在灌頂剎利王數，即能具足行十善道，亦得名為：轉輪聖王。菩薩受職亦復如是，諸佛智水灌其頂故，名為：受職；具足如來十種力故，墮在佛數。佛子！是名：菩薩受大智職。菩薩以此大智職故，能行無量百千萬億那由他難行之行，增長無量智慧功德，名為：安住法雲地。「佛子！菩薩摩訶薩住此法雲地，如實知欲界集、色界集、無色界集、世界集、法界集、有為界集、無為界集、眾生界集、識界集、虛空界集、涅槃界集。此菩薩如實知諸見煩惱行集，知世界成壞集，知聲聞行集、辟支佛行集、菩薩行集、如來力無所畏色身法身集、一切種一切智智集、示得菩提轉法輪集、入一切法分別決定智集。舉要言之，以一切智，知一切集。佛子！此菩薩摩訶薩以如是上上覺慧，如實知眾生業化、煩惱化、諸見化、世界化、法界化、聲聞化、辟支佛化、菩薩化、如來化、一切分別無分別化，如是等皆如實知。又如實知佛持、法持、僧持、業持、煩惱持、時持、願持、供養持、行持、劫持、智持，如是等皆如實知。又如實知諸佛如來入微細智，所謂：修行微細智、命終微細智、受生微細智、出家微細智、現神通微細智、成正覺微細智、轉法輪微細智、住壽命微細智、般涅槃微細智、教法住微細智，如是等皆如實知。又入如來祕密處，所謂：身祕密、語祕密、心祕密、時非時思量祕密、授菩薩記祕密、攝眾生祕密、種種乘祕密、一切眾生根行差別祕密、業所作祕密、得菩提行祕密，如是等皆如實知。又知諸佛所有入劫智，所謂：一劫入阿僧祇劫、阿僧祇劫入一劫、有數劫入無數劫、無數劫入有數劫、一念入劫、劫入一念、劫入非劫、非劫入劫、有佛劫入無佛劫、無佛劫入有佛劫、過去未來劫入現在劫、現在劫入過去未來劫、過去劫入未來劫、未來劫入過去劫、長劫入短劫、短劫入長劫，如是等皆如實知。又知如來諸所入智，所謂：入毛道智、入微塵智、入國土身正覺智、入眾生身正覺智、入眾生心正覺智、入眾生行正覺智、入隨順一切處正覺智、入示現遍行智、入示現順行智、入示現逆行智、入示現思議不思議世間了知不了知行智、入示現聲聞智辟支佛智菩薩行如來行智。佛子！一切諸佛所有智慧廣大無量，此地菩薩皆能得入。「佛子！菩薩摩訶薩住此地，即得菩薩不思議解脫、無障礙解脫、淨觀察解脫、普照明解脫、如來藏解脫、隨順無礙輪解脫、通達三世解脫、法界藏解脫、光明輪解脫、無餘境界解脫；此十為首，有無量百千阿僧祇解脫門，皆於此第十地中得。如是乃至無量百千阿僧祇三昧門、無量百千阿僧祇陀羅尼門、無量百千阿僧祇神通門，皆悉成就。「佛子！此菩薩摩訶薩通達如是智慧，隨順無量菩提，成就善巧念力，十方無量諸佛所有無量大法明、大法照、大法雨，於一念頃皆能安、能受、能攝、能持。譬如娑伽羅龍王所霔大雨，唯除大海，餘一切處皆不能安、不能受、不能攝、不能持。如來祕密藏大法明、大法照、大法雨亦復如是，唯除第十地菩薩，餘一切眾生、聲聞、獨覺乃至第九地菩薩，皆不能安、不能受、不能攝、不能持。佛子！譬如大海，能安、能受、能攝、能持一大龍王所霔大雨；若二、若三乃至無量諸龍王雨，於一念間一時霔下，皆能安、能受、能攝、能持。何以故？以是無量廣大器故。住法雲地菩薩亦復如是，能安、能受、能攝、能持一佛法明、法照、法雨；若二、若三乃至無量，於一念頃一時演說，悉亦如是。是故此地名為：法雲。」解脫月菩薩言：「佛子！此地菩薩於一念間，能於幾如來所安受攝持大法明、大法照、大法雨？」金剛藏菩薩言：「佛子！不可以算數能知，我當為汝說其譬諭。佛子！譬如十方各有十不可說百千億那由他佛剎微塵數世界，其世界中一一眾生皆得聞持陀羅尼，為佛侍者，聲聞眾中多聞第一，如金剛蓮華上佛所大勝比丘；然一眾生所受之法，餘不重受。佛子！於汝意云何？此諸眾生所受之法為有量耶？為無量耶？」解脫月菩薩言：「其數甚多，無量無邊。」金剛藏菩薩言：「佛子！我為汝說，令汝得解。佛子！此法雲地菩薩，於一佛所一念之頃，所安、所受、所攝、所持大法明、大法照、大法雨、三世法藏，前爾所世界一切眾生所聞持法，於此百分不及一，乃至譬諭亦不能及。如一佛所，如是十方如前所說，爾所世界微塵數佛復過此數，無量無邊，於彼一一諸如來所所有法明、法照、法雨、三世法藏，皆能安、能受、能攝、能持，是故此地名為：法雲。佛子！此地菩薩以自願力，起大悲雲，震大法雷，通、明、無畏以為電光，福德、智慧而為密雲，現種種身，周旋往返，於一念頃，普遍十方百千億那由他世界微塵數國土，演說大法，摧伏魔怨；復過此數，於無量百千億那由他世界微塵數國土，隨諸眾生心之所樂，霔甘露雨，滅除一切眾惑塵焰。是故此地名為：法雲。佛子！此地菩薩於一世界從兜率天下乃至涅槃，隨所應度眾生心而現佛事；若二、若三，乃至如上微塵數國土，復過於此，乃至無量百千億那由他世界微塵數國土，皆亦如是。是故此地名為：法雲。「佛子！此地菩薩智慧明達，神通自在。隨其心念，能以狹世界作廣世界，廣世界作狹世界；垢世界作淨世界，淨世界作垢世界；亂住、次住、倒住、正住，如是無量一切世界皆能互作。或隨心念，於一塵中置一世界須彌盧等一切山川，塵相如故，世界不減；或復於一微塵之中置二、置三，乃至不可說世界須彌盧等一切山川，而彼微塵體相如本，於中世界悉得明現。或隨心念，於一世界中示現二世界莊嚴，乃至不可說世界莊嚴；或於一世界莊嚴中示現二世界，乃至不可說世界。或隨心念，以不可說世界中眾生置一世界；或隨心念，以一世界中眾生置不可說世界，而於眾生無所嬈害。或隨心念，於一毛孔示現一切佛境界莊嚴之事。或隨心念，於一念中示現不可說世界微塵數身，一一身示現如是微塵數手，一一手各執恒河沙數華匳、香篋、鬘蓋、幢幡，周遍十方，供養於佛；一一身復示現爾許微塵數頭，一一頭復現爾許微塵數舌，於念念中，周遍十方，歎佛功德。或隨心念，於一念間普遍十方，示成正覺乃至涅槃，及以國土莊嚴之事；或現其身普遍三世，而於身中有無量諸佛及佛國土莊嚴之事，世界成壞靡不皆現；或於自身一毛孔中出一切風，而於眾生無所惱害。或隨心念，以無邊世界為一大海，此海水中現大蓮華，光明嚴好，遍覆無量無邊世界，於中示現大菩提樹莊嚴之事，乃至示成一切種智；或於其身現十方世界一切光明，摩尼寶珠、日月星宿、雲電等光靡不皆現；或以口噓氣，能動十方無量世界，而不令眾生有驚怖想；或現十方風災、火災及以水災；或隨眾生心之所樂，示現色身，莊嚴具足；或於自身示現佛身，或於佛身而現自身；或於佛身現己國土，或於己國土而現佛身。佛子！此法雲地菩薩能現如是及餘無量百千億那由他自在神力。」爾時，會中諸菩薩及天、龍、夜叉、乾闥婆、阿脩羅、護世四王、釋提桓因、梵天、淨居、摩醯首羅諸天子等，咸作是念：「若菩薩神通智力能如是者，佛復云何？」爾時，解脫月菩薩知諸眾會心之所念，白金剛藏菩薩言：「佛子！今此大眾聞其菩薩神通智力，墮在疑網。善哉仁者！為斷彼疑，當少示現菩薩神力莊嚴之事。」時，金剛藏菩薩即入一切佛國土體性三昧。入此三昧時，諸菩薩及一切大眾，皆自見身在金剛藏菩薩身內，於中悉見三千大千世界，所有種種莊嚴之事，經於億劫說不能盡。又於其中見菩提樹，其身周圍十萬三千大千世界，高百萬三千大千世界，枝葉所蔭亦復如是。稱樹形量，有師子座，座上有佛，號：一切智通王。一切大眾悉見其佛坐菩提樹下師子座上，種種諸相以為莊嚴，假使億劫說不能盡。金剛藏菩薩示現如是大神力已，還令眾會各在本處。時，諸大眾得未曾有，生奇特想，默然而住，向金剛藏一心瞻仰。爾時，解脫月菩薩白金剛藏菩薩言：「佛子！今此三昧，甚為希有，有大勢力，其名何等？」金剛藏言：「此三昧名：一切佛國土體性。」又問：「此三昧境界云何？」答言：「佛子！若菩薩修此三昧，隨心所念，能於身中現恒河沙世界微塵數佛剎，復過此數，無量無邊。「佛子！菩薩住法雲地，得如是等無量百千諸大三昧，故此菩薩身、身業不可測知，語、語業，意、意業，神通自在，觀察三世三昧境界、智慧境界，遊戲一切諸解脫門；變化所作、神力所作、光明所作，略說乃至舉足、下足，如是一切諸有所作，乃至法王子、住善慧地菩薩皆不能知。佛子！此法雲地菩薩所有境界，略說如是；若廣說者，假使無量百千阿僧祇劫亦不能盡。」解脫月菩薩言：「佛子！若菩薩神通境界如是，佛神通力其復云何？」金剛藏言：「佛子！譬如有人，於四天下取一塊土，而作是言：『為無邊世界大地土多，為此土多？』我觀汝問亦復如是，如來智慧無邊無等，云何而與菩薩比量？復次，佛子！如四天下取少許土，餘者無量；此法雲地神通智慧，於無量劫但說少分，況如來地！佛子！我今為汝引事為證，令汝得知如來境界。佛子！假使十方，一一方各有無邊世界微塵數諸佛國土，一一國土得如是地菩薩充滿，如甘蔗、竹、葦、稻、麻、叢林，彼諸菩薩於百千億那由他劫修菩薩行所生智慧，比一如來智慧境界，百分不及一，乃至優波尼沙陀分亦不能及。「佛子！此菩薩住如是智慧，不異如來身、語、意業，不捨菩薩諸三昧力，於無數劫承事供養一切諸佛，一一劫中以一切種供養之具而為供養。一切諸佛神力所加，智慧光明轉更增勝，於法界中所有問難善為解釋，百千億劫無能屈者。佛子！譬如金師以上妙真金作嚴身具，大摩尼寶鈿廁其間，自在天王身自服戴，其餘天人莊嚴之具所不能及；此地菩薩亦復如是，始從初地乃至九地，一切菩薩所有智行皆不能及。此地菩薩智慧光明，能令眾生乃至入於一切智智，餘智光明無能如是。佛子！譬如摩醯首羅天王光明，能令眾生身心清涼，一切光明所不能及；此地菩薩智慧光明亦復如是，能令眾生皆得清涼，乃至住於一切智智，一切聲聞、辟支佛乃至第九地菩薩智慧光明悉不能及。佛子！此菩薩摩訶薩已能安住如是智慧，諸佛世尊復更為說三世智、法界差別智、遍一切世界智、照一切世界智、慈念一切眾生智，舉要言之，乃至為說得一切智智。此菩薩，十波羅蜜中，智波羅蜜最為增上；餘波羅蜜非不修行。「佛子！是名：略說菩薩摩訶薩第十法雲地\n\n**（11）结分·十山王喻＋菩萨行十相＋摩尼珠喻＋重颂**（全文）：\n\n> ；若廣說者，假使無量阿僧祇劫亦不能盡。佛子！菩薩住此地，多作摩醯首羅天王，於法自在，能授眾生、聲聞、獨覺、一切菩薩波羅蜜行，於法界中所有問難無能屈者。布施、愛語、利行、同事——如是一切諸所作業，皆不離念佛，乃至不離念具足一切種、一切智智。復作是念：『我當於一切眾生為首、為勝，乃至為一切智智依止者。』若勤加精進，於一念頃，得十不可說百千億那由他佛剎微塵數三昧，乃至示現爾所微塵數菩薩以為眷屬；若以菩薩殊勝願力自在示現，過於此數，所謂：若修行、若莊嚴、若信解、若所作、若身、若語、若光明、若諸根、若神變、若音聲、若行處，乃至百千億那由他劫不能數知。「佛子！此菩薩摩訶薩十地行相次第現前，則能趣入一切智智。譬如阿耨達池出四大河，其河流注遍閻浮提，既無盡竭，復更增長，乃至入海，令其充滿。佛子！菩薩亦爾，從菩提心流出善根大願之水，以四攝法充滿眾生，無有窮盡，復更增長，乃至入於一切智海，令其充滿。「佛子！菩薩十地，因佛智故而有差別，如因大地有十山王。何等為十？所謂：雪山王、香山王、鞞陀梨山王、神仙山王、由乾陀山王、馬耳山王、尼民陀羅山王、斫羯羅山王、計都末底山王、須彌盧山王。佛子！如雪山王，一切藥草咸在其中，取不可盡；菩薩所住歡喜地亦復如是，一切世間經書、技藝、文頌、呪術咸在其中，說不可盡。佛子！如香山王，一切諸香咸集其中，取不可盡；菩薩所住離垢地亦復如是，一切菩薩戒行、威儀咸在其中，說不可盡。佛子！如鞞陀梨山王，純寶所成，一切眾寶咸在其中，取不可盡；菩薩所住發光地亦復如是，一切世間禪定神通、解脫三昧、三摩鉢底咸在其中，說不可盡。佛子！如神仙山王，純寶所成，五通神仙咸住其中，無有窮盡；菩薩所住焰慧地亦復如是，一切道中殊勝智慧咸在其中，說不可盡。佛子！如由乾陀羅山王，純寶所成，夜叉大神咸住其中，無有窮盡；菩薩所住難勝地亦復如是，一切自在如意神通咸在其中，說不可盡。佛子！如馬耳山王，純寶所成，一切諸果咸在其中，取不可盡；菩薩所住現前地亦復如是，入緣起理聲聞果證咸在其中，說不可盡。如尼民陀羅山王，純寶所成，大力龍神咸住其中，無有窮盡；菩薩所住遠行地亦復如是，方便智慧獨覺果證咸在其中，說不可盡。如斫羯羅山王，純寶所成，諸自在眾咸住其中，無有窮盡；菩薩所住不動地亦復如是，一切菩薩自在行差別世界咸在其中，說不可盡。如計都山王，純寶所成，大威德阿脩羅王咸住其中，無有窮盡；菩薩所住善慧地亦復如是，一切世間生滅智行咸在其中，說不可盡。如須彌盧山王，純寶所成，大威德諸天咸住其中，無有窮盡；菩薩所住法雲地亦復如是，如來力、無畏、不共法、一切佛事咸在其中，問答宣說不可窮盡。「佛子！此十寶山王，同在大海，差別得名；菩薩十地亦復如是，同在一切智中，差別得名。佛子！譬如大海，以十種相，得大海名，不可移奪。何等為十？一、次第漸深；二、不受死屍；三、餘水入中皆失本名；四、普同一味；五、無量珍寶；六、無能至底；七、廣大無量；八、大身所居；九、潮不過限；十、普受大雨，無有盈溢。菩薩行亦復如是，以十相故，名菩薩行，不可移奪。何等為十？所謂歡喜地，出生大願漸次深故；離垢地，不受一切破戒屍故；發光地，捨離世間假名字故；焰慧地，與佛功德同一味故；難勝地，出生無量方便神通、世間所作眾珍寶故；現前地，觀察緣生甚深理故；遠行地，廣大覺慧善觀察故；不動地，示現廣大莊嚴事故；善慧地，得深解脫行於世間，如實而知不過限故；法雲地，能受一切諸佛如來大法明雨無厭足故。佛子！譬如大摩尼珠有十種性出過眾寶。何等為十？一者從大海出；二者巧匠治理；三者圓滿無缺；四者清淨離垢；五者內外明徹；六者善巧鑽穿；七者貫以寶縷；八者置在瑠璃高幢之上；九者普放一切種種光明；十者能隨王意雨眾寶物，如眾生心充滿其願。佛子！當知菩薩亦復如是，有十種事出過眾聖。何等為十？一者發一切智心；二者持戒頭陀，正行明淨；三者諸禪三昧，圓滿無缺；四者道行清白，離諸垢穢；五者方便神通，內外明徹；六者緣起智慧，善能鑽穿；七者貫以種種方便智縷；八者置於自在高幢之上；九者觀眾生行，放聞持光；十者受佛智職，墮在佛數，能為眾生廣作佛事。「佛子！此集一切種、一切智功德菩薩行法門品，若諸眾生不種善根不可得聞。」解脫月菩薩言：「聞此法門，得幾所福？」金剛藏菩薩言：「如一切智所集福德，聞此法門福德如是。何以故？非不聞此功德法門而能信解、受持、讀誦，何況精進、如說修行！是故當知，要得聞此集一切智功德法門，乃能信解、受持、修習，然後至於一切智地。」爾時，佛神力故，法如是故，十方各有十億佛剎微塵數世界六種十八相動。所謂：動、遍動、等遍動，起、遍起、等遍起，涌、遍涌、等遍涌，震、遍震、等遍震，吼、遍吼、等遍吼，擊、遍擊、等遍擊。雨眾天華、天鬘、天衣，及諸天寶莊嚴之具、幢幡、繒蓋。奏天妓樂，其音和雅，同時發聲，讚一切智地所有功德。如此世界他化自在天王宮演說此法，十方所有一切世界悉亦如是。爾時，復以佛神力故，十方各十億佛剎微塵數世界外，有十億佛剎微塵數菩薩而來此會，作如是言：「善哉善哉！金剛藏！快說此法。我等悉亦同名：金剛藏，所住世界各各差別，悉名：金剛德，佛號：金剛幢。我等住在本世界中，皆承如來威神之力而說此法，眾會悉等，文字句義與此所說無有增減；悉以佛神力而來此會，為汝作證。如我等今者入此世界，如是十方一切世界悉亦如是而往作證。」爾時，金剛藏菩薩觀察十方一切眾會，普周法界，欲讚歎發一切智智心，欲示現菩薩境界，欲淨治菩薩行力，欲說攝取一切種智道，欲除滅一切世間垢，欲施與一切智，欲示現不思議智莊嚴，欲顯示一切菩薩諸功德，欲令如是地義轉更開顯，承佛神力而說頌言：「其心寂滅恒調順，平等無礙如虛空，離諸垢濁住於道，此殊勝行汝應聽。百千億劫修諸善，供養無量無邊佛，聲聞獨覺亦復然，為利眾生發大心。精勤持戒常柔忍，慚愧福智皆具足，志求佛智修廣慧，願得十力發大心。三世諸佛咸供養，一切國土悉嚴淨，了知諸法皆平等，為利眾生發大心。住於初地生是心，永離眾惡常歡喜，願力廣修諸善法，以悲愍故入後位。戒聞具足念眾生，滌除垢穢心明潔，觀察世間三毒火，廣大解者趣三地。三有一切皆無常，如箭入身苦熾然，厭離有為求佛法，廣大智人趣焰地。念慧具足得道智，供養百千無量佛，常觀最勝諸功德，斯人趣入難勝地。智慧方便善觀察，種種示現救眾生，復供十力無上尊，趣入無生現前地。世所難知而能知，不受於我離有無，法性本寂隨緣轉，得此微妙向七地。智慧方便心廣大，難行難伏難了知，雖證寂滅勤修習，能趣如空不動地。佛勸令從寂滅起，廣修種種諸智業，具十自在觀世間，以此而昇善慧地。以微妙智觀眾生，心行業惑等稠林，為欲化其令趣道，演說諸佛勝義藏。次第修行具眾善，乃至九地集福慧，常求諸佛最上法，得佛智水灌其頂。獲得無數諸三昧，亦善了知其作業，最後三昧名受職，住廣大境恒不動。菩薩得此三昧時，大寶蓮華忽然現，身量稱彼於中坐，佛子圍遶同觀察。放大光明百千億，滅除一切眾生苦，復於頂上放光明，普入十方諸佛會，悉住空中作光網，供養佛已從足入；即時諸佛悉了知，今此佛子登職位。十方菩薩來觀察，受職大士舒光照；諸佛眉間亦放光，普照而來從頂入。十方世界咸震動，一切地獄苦消滅；是時諸佛與其職，如轉輪王第一子。若蒙諸佛與灌頂，是則名登法雲地，智慧增長無有邊，開悟一切諸世間。欲界色界無色界，法界世界眾生界，有數無數及虛空，如是一切咸通達。一切化用大威力，諸佛加持微細智，祕密劫數毛道等，皆能如實而觀察。受生捨俗成正道，轉妙法輪入涅槃，乃至寂滅解脫法，及所未說皆能了。菩薩住此法雲地，具足念力持佛法，譬如大海受龍雨，此地受法亦復然。十方無量諸眾生，悉得聞持持佛法，於一佛所所聞法，過於彼數無有量。以昔智願威神力，一念普遍十方土，霔甘露雨滅煩惱，是故佛說名法雲。神通示現遍十方，超出人天世間境，復過是數無量億，世智思惟必迷悶。一舉足量智功德，乃至九地不能知，何況一切諸眾生，及以聲聞辟支佛。此地菩薩供養佛，十方國土悉周遍，亦供現前諸聖眾，具足莊嚴佛功德。住於此地復為說，三世法界無礙智，眾生國土悉亦然，乃至一切佛功德。此地菩薩智光明，能示眾生正法路，自在天光除世暗，此光滅暗亦如是。住此多作三界王，善能演說三乘法，無量三昧一念得，所見諸佛亦如是。此地我今已略說，若欲廣說不可盡。如是諸地佛智中，如十山王嶷然住。初地藝業不可盡，譬如雪山集眾藥；二地戒聞如香山；三如鞞陀發妙華；焰慧道寶無有盡，譬如仙山仁善住；五地神通如由乾；六如馬耳具眾果；七地大慧如尼民；八地自在如輪圍；九如計都集無礙；十如須彌具眾德。初地願首二持戒；三地功德四專一；五地微妙六甚深；七廣大慧八莊嚴；九地思量微妙義，出過一切世間道；十地受持諸佛法，如是行海無盡竭。十行超世發心初，持戒第二禪第三，行淨第四成就五，緣生第六貫穿七，第八置在金剛幢，第九觀察眾稠林，第十灌頂隨王意，如是德寶漸清淨。十方國土碎為塵，可於一念知其數，毫末度空可知量，億劫說此不可盡。」\n\n## 三、旁参与前接\n\n### 3.1 承前（第五会·回向位）\n\n回向位满故入地——十回向之善根回向于众生与菩提，其果即**入地**。\n\n### 3.2 启后（第七会·十定）\n\n十地满→入如来行位——品 25〈十定品〉起说如来行境界。\n\n## 四、义理要点\n\n- **地 = bhūmi**：菩萨修行之十个阶段——每一地有一波罗蜜为增上，有入地心、行相、利益。\n- **金刚藏**：说主之名——金刚表不坏（地之行不可坏），藏表含摄（含十地功德）。\n- **解脱月三请**：解脱月菩萨三次请金刚藏说十地——问法仪轨之重（表十地之义深非轻易可说）。\n\n## 五、注疏选要\n\n### 5.1 澄观（`T1735`·疏卷三十四起）\n\n> 十地品云。非初非中後。非言辭所及。迴向品云。無有智外如為智所入。亦無如外智。能證於如等。九真理非事門。即妄之真異於妄故。如濕非動。十事法非理門。即真之妄異於真故。如動非濕故。慚愧林偈云。如色與非色。此二不為一。又云。如相與無相。生死又涅槃。分別各不同等。上七八二門。明事理非異。九十二門明事理非一。故為無為。非一非異。第四迴向云。於有為界示無為法。而不滅壞有為之相。於無為界示有為法。而不分別無為之性。上之十事。同一緣起故。云無礙。約理望事。則有成有壞有即有離。事望於理。有隱有顯。有一有異。逆順自在。無障無礙。同時頓起。深思令觀明現。以成理事圓融無礙觀也。第四周遍含容。即事事無礙。且依古德。顯十玄門。於中文二。先正辯玄門。二明其所以。今初。一同時具足相應門。二廣陜自在無礙門。三一多相容不同門。四諸法相即自在門。五祕密隱顯俱成門。六微細相容安立門。七因陀羅網境界門。八託事顯法生解門。九十世隔法異\n\n### 5.2–5.3 诸家（存目·深化批补引）\n\n## 六、文本对读\n\n### 6.3 藏译（Toh 44 ch 28–29）\n\n**藏 28–29 开篇实测**〔L.266〕：德格 035 卷 fol 347b（ch 28）· fol 368b（ch 29）——藏文十地品跨多章（与本品跨七卷对应）。\n\n## 七、数据层（L1 实测）\n\n| 指标 | 值 |\n|---|---|\n| CJK（净） | **43,413** |\n| 长行段 | **264** `<p>` |\n| 偈组 | **27** `<lg>` |\n| 页数 | **98** `<pb>`（跨七卷） |\n| 说主 | 金刚藏菩萨 |\n| 请主 | 解脱月菩萨（三请） |\n\n## 八、附录\n\n- **附录四·存疑与未竟**：①十地各段完整经文未逐段全引（深化批）；②六十全本照录未作；③诸家直引待补；④藏译逐字对勘未作。\n\n## 九、台账（成篇自陈）\n\n**本批补订（L.266·2026-10-31·第六会首批）**：①**提取层**：品 24 段程序实测（43,413 CJK·264 p·27 lg·跨七卷）；②**成篇**：§〇–§九 骨架（十地总表＋各地定义骨架＋澄观＋藏 28–29 开篇）；③**体量自陈**：骨架成文——十地各段完整引文（43,413 CJK 全量）＝深化批预登记。**原则自陈**：凡未能确证者标〔待核〕。\n\n> **成篇识**：本品为全经教义最高峰之一——十地之行相是菩萨道之完整蓝图。核心成文以骨架立其方位；深广之文，俟深化批逐地展开。凡所未竟，有台账。\n\n---\n\n> **EN corresponding · Chapter summary.** At 43,413 characters spanning seven volumes, this chapter is one of the doctrinal peaks of the sūtra. Vajra-Garbha Bodhisattva, empowered by the Buddha's might, expounds the ten stages (bhūmi) of the bodhisattva path — from the Joyous Ground to the Dharma Cloud Ground — each stage marked by the perfection of one pāramitā and the attainment of specific realizations.\n", "data_source": "", "data_pool": "practice", "back": {"tab": "gap", "view": "avatamsaka-studies", "label": "文献页 · 华严经学"}, "updated_at": "2026-10-31"};

// ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');

function _applyArticleENMode(){
