<script>
var ARTICLE = {"id": "wuming-prajna", "file": "articles/wuming-prajna.html", "title": "无明与般若", "title_sub": "妄无自体 · 从根本迷惑到如实智慧——佛教诸宗诸经的系统辨析（中英对照）", "icon": "🕯", "version": "", "meta": "", "doc": "docs/宗派研究/无明与般若.md", "doc_md": "# 无明与般若——佛教诸宗诸经的系统辨析\n\n## 从根本迷惑、妄无自体，到如实智慧\n\n> **编者按（体例与信源）**：本文据本仓 `docs/草稿/无明与般若.md`（多轮研问记录，约 39 万字节）整理重写为独立专文：议题、区分、论证与经证悉出草稿，行文重排为单一论证主线，对话性重复已合并。**中英文对照**：中文为主文，每节后附「英译对读」块（意群对齐，非逐字直译），可点页顶 🌐 按钮在「显示／隐藏英文批注」间切换。**引文回源**：经文引文已逐字核对 CBETA 电子佛典（xml-p5，访问日期 2026-11-17/18；本地底本 `T10n0279`、`T02n0099` 照仓内 CBETA XML），繁体照原字形，回源登记见附录 B；转述标〔大意〕，未能回源者标〔待核〕，本文自判标〔本文判断〕。\n\n**续研说明**：§七、§八为整理者就草稿未尽之问（问无明者谁、无明施设、维度模型）新增的评估与经证，超出草稿范围，并整合后续研问材料；新引经证另行回源（附录 B）。**受众·语域**：对佛学义理有初步基础的读者与研究者；学术随笔体；静态站屏读。\n\n## 引言｜这个问题，经论自己一直在问\n\n「如果众生本来是佛，为什么又有一切无明？」——这不是现代读者的刁难，而是经论自己提出过的问题。《圆觉经》金刚藏菩萨问佛：「若諸眾生本來成佛，何故復有一切無明？若諸無明眾生本有，何因緣故，如來復說本來成佛？」（T17n0842）《楞严经》富楼那问：「若復世間一切根、塵、陰、處、界等皆如來藏清淨本然，云何忽生山河大地諸有為相？」又问得更加直接：「敢問如來，一切眾生何因有妄，自蔽妙明，受此淪溺？」（T19n0945）《华严经·如来出现品》里，佛在菩提树下叹：「奇哉！奇哉！此諸眾生云何具有如來智慧，愚癡迷惑，不知不見？」（T10n0279）\n\n三段经文指向同一个断层线：**既然究竟实相本来清净、圆满、觉，而且超越能所主客，为什么会有无明？为什么从未离开真实的众生，会经验到分别、执取、烦恼和苦？为什么觉悟者不被束缚，而同样不离法性的众生却长陷轮回？** 这些问题不是名词辨析，而是如来藏与本觉一系教理真正的理论断层。把它们问出来，不是用现代哲学为难古人，而是重新发现了佛教自己早已意识到、并且以不同方式安放过的困难。\n\n先给总判断。**说得清楚的**有三件事：问题里嵌着哪些前提；无明如何运作、靠什么维持、凭什么终止；「圆满」一词究竟指什么。**没有给出第一因式解释的**只有一处：无明的「起点」。而「起点不可说」是「无始」这一教义的直接后果，不是遮掩。至于「这是不是真如的 bug」——这个问法需要三样零件：设计者、规格、产出关系；缘起的结构里，一件都没有。下文先校准概念（§一），给出无明与般若的基本含义（§二），分系梳理诸宗诸经（§三），再集中处理无明本原（§四）、苦受与束缚（§五）、破幻现真与方便说（§六），评估「以无明问无明」的自指结构与「无明只是施设」之说（§七）、「维度」模型（§八），最后给出结论（§九）。\n\n> **英译对读 · 引言**\n>\n> \"If sentient beings are already Buddhas, why is there ignorance at all?\" — this is not a modern reader's objection but a question the scriptures themselves raise. In the Sutra of Perfect Enlightenment, the Bodhisattva Pure Wisdom asks: \"If all sentient beings were originally Buddhas, why do they have all ignorance? If ignorance has always been there, why does the Tathāgata say they were originally Buddhas?\" (T17n0842). In the Śūraṅgama Sūtra, Pūrṇa asks: \"If all roots, objects, aggregates, bases and elements are intrinsically the pure Tathāgatagarbha, why did the mountains, rivers and the whole phenomenal world suddenly arise?\" — and more bluntly: \"Why do all sentient beings have delusion at all, veiling their own wondrous luminosity and sinking into this condition?\" (T19n0945). In the Avataṃsaka Sūtra, the Buddha exclaims: \"How strange! How can all sentient beings possess the wisdom of the Tathāgata, yet remain deluded, not knowing or seeing it?\" (T10n0279).\n>\n> The judgments of this essay: Buddhism **does** explain three things — which premises are embedded in the question; how ignorance operates, sustains itself, and ceases; and what \"perfection\" actually means. It does **not** offer a first-cause explanation of the \"origin\" of ignorance, and the unavailability of such a beginning is a direct consequence of the doctrine of beginninglessness, not an evasion. As for \"is this a bug in ultimate reality\" — a bug requires a designer, a specification, and a production relation; none of these exists in the structure of dependent arising.\n\n## 一、先校准：「终极性质」是三种不同的角色\n\n提问者常用的词——真如、法性、法界、妙明真心、菩提自性、本觉、佛性、如来藏——佛教内部并无统一定义。这些词混用，不只是措辞偏差：**选哪个词，悄悄决定了「为什么有无明」这一问是否成立**。按各体系实际赋予的内涵，「终极性质」可以拆成三种角色：\n\n| 角色 | 常见用语 | 主要出处 | 「为何有无明」之问 |\n|---|---|---|---|\n| ① 如是：诸法实相本身 | 法性、法界、真如、空性 | 阿含「法住法位」〔大意〕、般若经、中观、唯识（真如＝圆成实性） | 不成立：它不是源头，也无认知，谈不上「含缺陷」 |\n| ② 潜质／所依：成佛的根据 | 佛性、如来藏、自性清净心 | 《如来藏经》《胜鬘经》《大般涅槃经》《宝性论》 | 转为「为何被覆」，答以「客尘」 |\n| ③ 一心：既是「觉」，又是万法所依 | 本觉、一心、妙明真心、《坛经》自性 | 《大乘起信论》《圆觉经》《楞严经》，华严、禅 | **必须回答**，且最尖锐 |\n\n疑情的锋刃出自第③种角色。而③的核心文献《起信论》《圆觉经》《楞严经》，在文献史上另有公案：《起信论》传统题马鸣造，无梵本传世，现代学界多倾向认为成书于中国，作者归真谛、菩提流支或其汉地弟子等说不一；《圆觉》《楞严》的传译与真伪同样长期有争议（传统教界不接受此说）。这**不等于问题不真**——《大般涅槃经》里师子吼菩萨就问过：若一切众生皆有佛性，为何看不见？〔大意〕但它意味着：问题最尖锐的形态，是在把①②③合为一体的过程中才被造出来的；守在①的中观、唯识，并不感受到同样的压力。研究时应当把经典的教义地位与文献史结论分开。\n\n以③系的核心文本《大乘起信论》为坐标。论首立「一心二门」：「依一心法，有二種門。云何為二？一者、心真如門，二者、心生滅門。是二種門，皆各總攝一切法。」（T32n1666）心真如门说本性：「心真如者，即是一法界大總相法門體。所謂心性不生不滅，一切諸法唯依妄念而有差別……是故一切法從本已來，離言說相、離名字相、離心緣相，畢竟平等、無有變異、不可破壞。」心生灭门说流转：「心生滅者，依如來藏故有生滅心，所謂不生不滅與生滅和合，非一非異，名為阿梨耶識。」注意这个「**依**」字——下文将反复用到。论又以三大说体相用：「一者、體大，謂一切法真如平等不增減故。二者、相大，謂如來藏具足無量性功德故。三者、用大，能生一切世間、出世間善因果故。」真如的「用大」，论中定义为**能生善因果**，并没有把无明、痛苦称作真如的用。\n\n> **英译对读 · 第一节**\n>\n> The terms in play — suchness, dharma-nature, dharma-realm, the wondrous luminous mind, the nature of awakening, original enlightenment, Buddha-nature, tathāgatagarbha — have no single fixed definition within Buddhism, and the choice among them quietly determines whether the question \"why is there ignorance?\" even arises. Three roles can be distinguished. **(1) \"Thusness\": reality-as-it-is** (dharma-nature, dharma-realm, emptiness) — for Madhyamaka and Yogācāra this is no source and no knower, so the question does not arise. **(2) Potential / ground**: Buddha-nature and tathāgatagarbha — the question becomes \"why is it veiled?\", answered by \"adventitious defilements.\" **(3) One Mind**: original enlightenment as both \"awake\" and the ground of all dharmas (Awakening of Faith, Perfect Enlightenment, Śūraṅgama; Huayan; Chan) — here the question **must** be answered, and bites hardest.\n>\n> The core texts of role (3) carry a separate philological question: the Awakening of Faith has no Sanskrit witness and modern scholarship generally regards it as a Chinese composition; the Perfect Enlightenment and Śūraṅgama sūtras have long been debated on similar grounds (traditional communities do not accept this). The doctrinal standing of a text and the scholarly verdict on its origin must be kept apart. The Awakening of Faith opens with \"One Mind, two gates\": the gate of suchness and the gate of arising-and-ceasing, \"each encompassing all dharmas\" (T32n1666); the three \"greats\" define the \"function\" of suchness as **giving rise to wholesome causality** — ignorance and suffering are never named as its function. And note the verb in \"the arising-and-ceasing **depends on** (依) the tathāgatagarbha\" — this word will matter repeatedly below.\n\n## 二、无明与般若的基本含义\n\n**无明**（梵 Avidyā，巴 Avijjā）不是知识不足，不是没受教育的愚昧，更不是不懂佛法理论。它是一种根本性的认识错误：**不能如实认识事物的真实状况，并对身心、世界及其关系产生错误认定**——本无常而执为常，本无我而执为我，本缘起而执为独立自存，本不能带来持久安稳而执占有为安稳，本无能所对待而执能知所知为彼此独立的实有。所以无明不只是认知错误，还是一种整体的存在方式：它塑造我们如何认识世界、如何认识自己、如何感受，以及如何与一切事物发生关系。\n\n它与烦恼的关系密切而不等同：\n\n| 概念 | 含义 |\n|---|---|\n| 无明（Avidyā） | 对真实状况的根本不知或错误认识 |\n| 贪（Rāga） | 对所喜的贪恋与占有 |\n| 嗔（Dveṣa） | 对所不喜的排斥与敌意 |\n| 痴（Moha） | 愚昧迷闇，根本不如实知的心理状态 |\n| 我执 | 将身心经验认定为独立恒常的自我 |\n| 法执 | 将现象认定为有独立真实的自性 |\n\n可以这样说：无明是根本的迷惑条件，贪嗔我执等烦恼是它在不同身心活动中的具体表现；大乘又进一步从认知结构、习气、种子、能所分别等层面分析它。《成唯识论》给痴下的定义是：「云何為癡？於諸理、事，迷闇為性；能障無癡，一切雜染所依為業。」（T31n1585）——痴是「迷闇」之性，又是一切杂染的共同所依。\n\n**般若**（梵 Prajñā，巴 Paññā）则不是聪明、博学或逻辑能力强，而是**如实认识诸法实相的智慧**，在大乘中特指对空性、无我、缘起与非二元实相的直接洞察。知道「一切无常」是知识；般若是亲自如实洞察无常而无我，且不再以错误方式执取。佛教相关术语交叉使用：般若（Prajñā）侧重洞察辨别；智（Jñāna）常指更圆满的觉悟之智；明（Vidyā）与无明直接相对；慧有时泛指，有时特指能断惑之慧。汉传又常分般若为三层：文字般若（经教言说）、观照般若（依教起观）、实相般若（观所证之实相）——三者是同一智慧的三面，不是三种东西〔大意〕。没有一张能机械套用到一切语境的对应表。要紧的是一条：**般若不是一个站在能所之外的永恒观察者**——真正的般若包括对能取、所取及其自性执着的洞察。\n\n由此可以给出无明与般若的根本关系（一个会贯穿全文的框架）：**无明：错误认识实相**——不如实知无常、无我、缘起、空性，错误建立自我与外境的独立性，展开为能所分别、执取、贪嗔痴，造业、受苦、生死相续。**般若：如实认识实相**——如实观察身心与一切法，洞察缘起无我，不再执独立自性与能所对立，烦恼止息，智慧与解脱显发。各宗派的差异，全部落在这个框架的具体化上。\n\n> **英译对读 · 第二节**\n>\n> **Ignorance** (Skt. *Avidyā*, Pāli *Avijjā*) is not lack of information, poor schooling, or unfamiliarity with Buddhist theory. It is a fundamental cognitive error: failing to know things as they are, and mis-identifying body-mind, world and their relations — grasping what is impermanent as permanent, what is selfless as a self, what dependently arises as independently existing, what cannot secure lasting well-being as secure, and what involves no subject-object duality as an independent knower facing an independent known. Ignorance is therefore not merely an error but a whole way of being. It is the root condition; greed, hatred, self-grasping and the rest are its specific expressions. The Cheng Weishi Lun defines delusion (*moha*): \"What is delusion? It is dark confusion about principles and things, obstructing non-delusion, serving as the basis of all defilement.\" (T31n1585)\n>\n> **Prajñā** is not cleverness or erudition but the wisdom that knows reality as it is — in Mahāyāna, the direct insight into emptiness, selflessness, dependent origination and nonduality. Knowing \"all is impermanent\" is information; prajñā is seeing it directly and no longer grasping. Crucially, prajñā is **not** an eternal observer standing outside subject and object: it includes insight into the grasper, the grasped, and the grasping itself. The master framework, then: ignorance mis-knows reality and unfolds into duality, grasping, karma and suffering; prajñā knows reality as it is, and grasping ceases. Every school below is a specific way of filling in this frame.\n\n## 三、诸宗诸经的分系梳理\n\n不同宗派并非用不同语言重复同一套理论；它们对无明是什么、如何成立、般若所证是什么，存在真实的思想差异。以下十三节：3.1–3.10 依系统梳理（阿含部派→般若中观→唯识→如来藏→一心三经论→天台→华严→禅→净土→藏传），3.11 为当代华严一家，3.12 横向对照经典，3.13 抽出三种底层模型。按「无明／根本／般若／修法」四栏过一遍主要系统；有部以外的部派细节、日本诸宗、藏传各派内部差异未展开。\n\n### 3.1 阿含与部派：无明是不如实知\n\n早期佛教的无明有明确操作定义：《相应部》12.2 以「不知苦、不知苦集、不知苦灭、不知趣苦灭道」释无明〔大意〕；《杂阿含经》中舍利弗向摩诃拘絺罗解释，于五蕴不知不明即是无明，如实知五蕴集灭即是明（约 256–258 经）〔大意〕。轮回无始而有因缘，《杂阿含》266 经：「於無始生死，無明所蓋，愛結所繫，長夜輪迴，不知苦之本際。」（T02n0099）——《相应部》15 相应「无始相应」反复宣说同一主题〔大意〕。\n\n最值得注意的是《增支部》10.61〔大意〕：无明「前际不可知」，但**有其食（条件）**——反向追溯为：无明←五盖←三种恶行←不守根门←无念正知←不如理作意←无信←不闻正法←不亲近善人；正向则从亲近善人起，经闻法、信、如理作意、念正知、守护根门、善行、四念处，至七觉支，「明与解脱」圆满。这提供了一个极精细的立场：**无明没有可辨认的第一时间起点，但无明依条件增长、也依条件止息**。又《中部》9 经说无明与漏互为条件、成环无端〔大意〕——但研究表明这一双向公式仅见于 MN 9，汉译平行《中阿含》29 经无此说，「环状条件」不宜当作阿含共法。〔本文判断〕\n\n智慧一面：早期佛教的般若即 Paññā，核心是如实知见五蕴、六处、缘起、无常苦无我；分闻所成慧、思所成慧、修所成慧〔大意〕。修行以戒定慧为次第，切入点是转「非理作意」为「如理作意」。部派进一步细化：有部把痴立为独立实有的心所、六根本烦恼之一，阿罗汉仍余「不染污无知」——后来大乘「所知障」的先声；「心性本净、客尘所染」之说见于分别说系与大众部系，是如来藏思想的印度前身——「本净与染并存」的张力早在部派已有，只是当时的答案是「客」（外来、偶然），不是「从本净生出」。〔大意〕\n\n> **英译对读 · 3.1 阿含与部派**\n>\n> Early Buddhism defines ignorance operationally: not knowing suffering, its origin, its cessation and the path (SN 12.2〔大意〕); not truly knowing the five aggregates (SA 256–258〔大意〕). Saṃsāra is beginningless yet conditioned: \"covered by ignorance, bound by craving, beings wander on through the long night, not knowing the far shore of suffering\" (SA 266, T02n0099). AN 10.61 gives the finest statement〔大意〕: no first point of ignorance can be found, yet ignorance *has food* — a backward chain (five hindrances ← misconduct ← unguarded senses ← lost mindfulness ← unwise attention ← no faith ← not hearing the Dhamma ← not associating with good persons) and a forward chain culminating in knowledge and release. The mutual conditioning of ignorance and taints appears only in MN 9; its Chinese parallel lacks the reverse link, so the \"loop\" is not a shared Āgama doctrine.〔本文判断〕 Wisdom (paññā) is knowing-and-seeing, cultivated as hearing-born, reflection-born and cultivation-born. Abhidharma reifies delusion as a real factor, lets the arhat retain \"undefiled ignorance\" (the seed of the later cognitive obstruction), and hosts the \"mind intrinsically pure, defiled by adventitious guests\" view — the Indian ancestor of tathāgatagarbha.\n\n### 3.2 般若经与中观：无明是执自性，般若是照见空\n\n般若经群（《大般若经》《金刚经》《心经》等）把无明的核心定位为**对一切法的实有执着**——不只执一个固定的我，也把外境、因果、认知主体乃至将证之果都实体化。般若则照见其空。《心经》：「觀自在菩薩行深般若波羅蜜多時，照見五蘊皆空，度一切苦厄」「色不異空，空不異色，色即是空，空即是色；受、想、行、識，亦復如是」（T08n0251）。此处的空不是虚无，不否定现象，而是说一切法因缘和合、无独立不变的自性。\n\n最深的一句是「無無明亦無無明盡，乃至無老死亦無老死盡」「無智，亦無得」。这不是说众生没有无明、不需要智慧，而是：在般若所观的究竟层面，连十二因缘、断除无明、智慧、所得也一并破其实有执。**般若不是消灭一个真实的无明实体、再获得一个真实的智慧实体，而是彻底洞察无明本身没有独立自性**——修行者、所修之法、所证之果，同样不可执为实有。《金刚经》同一方向：「無我相、無人相、無眾生相、無壽者相」「應無所住而生其心」（T08n0235）——不是不行动，而是在一切行动中不执固定的我、我所、境界与所得。\n\n龙树《中论》把这套立场哲学化。「三是偈」：「眾因緣生法，我說即是無，亦為是假名，亦是中道義。未曾有一法，不從因緣生，是故一切法，無不是空者。」（T30n1564；按：什译此处作「無」，后世通行引作「空」，引用时宜照底本）**空**：无独立自性；**假**：依因缘与概念安立而成立；**中道**：不落实有，不落断灭。空性本身同样不可实体化——「空亦复空」，否则只是把对外在世界的执着换成一个更高更精致的空性本体。「以有空義故，一切法得成；若無空義者，一切則不成」——正因为无自性，才有因缘变化、苦的止息和修行的可能；反之「若一切不空，則無有生滅」。关于本原，《中论·观本际品》：「大聖之所說，本際不可得，生死無有始，亦復無有終。」——不是不知道，而是**该问法预设了一个可定位的第一点，而缘起不容许这种点**。〔本文判断〕中观又分烦恼障与所知障：粗重烦恼障解脱，微细认知所知障一切种智；断尽二障方是佛的圆满觉悟。\n\n> **英译对读 · 3.2 般若经与中观**\n>\n> Prajñāpāramitā locates ignorance in reifying anything at all — self, world, causality, the knower, even the attainment. The Heart Sūtra negates not only ignorance and its cessation but wisdom and attainment: prajñā does not destroy a real entity called ignorance; it sees that ignorance never had intrinsic nature. The Diamond Sūtra adds the four no-notions and \"arouse the mind without abiding\" — not inaction, but no fixed grasping of self, possession, realm or gain. Nāgārjuna turns this into philosophy: whatever is dependently arisen, the text (in Kumārajīva's wording) declares to be \"wu (empty)\" — later writers conventionally quote it as \"emptiness\"; designation and the middle way complete the verse. Emptiness itself must not be reified — \"emptiness too is empty\" — otherwise one has only swapped the world for a subtler essence; and precisely because nothing has intrinsic nature, change, the ceasing of suffering and practice are all possible (\"if everything were not empty, there would be no arising and ceasing\"). On origins Madhyamaka is categorical: \"the highest limit is unobtainable; saṃsāra has no beginning and no end\" — the question presupposes a locatable first point, and dependent arising admits none. The two obstructions (afflictive and cognitive) mark the distance from arhatship to Buddhahood.\n\n### 3.3 唯识：无明是虚妄能所分别，般若是转识成智\n\n唯识以八识说认知结构：前五识了别外境，第六意识分别判断，第七末那识恒审思量、执着第八识见分为我，第八阿赖耶识摄藏种子、维持业力与经验相续。无明因此不只是表层的错误观念，而是深入结构的习气：《成唯识论》分俱生无明（先天恒起，与末那四惑相应）与分别无明（后天邪教邪思惟引起）〔大意〕。须注意：**阿赖耶识不是永恒灵魂，也不是独立于因缘的宇宙本体，它本身就是因缘相续的识流**。\n\n三性说无明究竟误认了什么：**遍计所执**——把能取所取、主客诸法执为有独立自性；**依他起**——一切认知与现象依因缘条件而成立；**圆成实**——于依他起上，遣除遍计所执，如实证知二取本无。看花时，花的形色、感受、判断都依缘而起（依他起）；凡夫进一步认定「有一个独立的我，在看一朵独立的花」（遍计执）；般若洞察这种能所结构并无其所被想象的独立自性（圆成实）。流转还灭同出一所依，《摄大乘论》引《阿毗达磨经》偈：「無始時來界，一切法等依，由此有諸趣，及涅槃證得。」（T31n1594）真如是无为法、不生诸法，故「为什么有无明」在此转为「染种如何得转」：答案是**闻熏习**——从法界等流的正闻，成为出世心的种子。修行以四寻思、四如实智破能所二取，果为转依，转八识成四智（大圆镜、平等性、妙观察、成所作）；菩提须断二障、成二智〔大意〕。代价与硬事实：无始染种是另一块不容再问的出发点，五种姓之说使「一切众生皆可成佛」失去普遍保证。〔本文判断〕\n\n> **英译对读 · 3.3 唯识**\n>\n> Yogācāra digs into the structure of mis-knowing: eight consciousnesses, with the seventh (manas) constantly appropriating the eighth's observing aspect as a self, and the store-consciousness (ālaya) carrying seeds that sustain habit and karma — a stream of conditions, not a soul. The three natures say what exactly is mis-taken: the imagined nature (a grasper and a grasped constructed as independent), the dependent nature (conditioned experience), the perfected nature (that very experience seen without the imagined duality). One \"beginningless element\" grounds both transmigration and nirvāṇa (the verse in the Mahāyānasaṃgraha, T31n1594); since suchness is unconditioned it produces nothing, so the origin question becomes: how are contaminated seeds transformed? By \"hearing-perfuming\" — right hearing as the seed of the supramundane mind — through the four investigations to the transformation of the basis (āśraya-parāvṛtti), the four wisdoms, and the double severing of both obstructions. The costs are stated openly: beginningless contaminated seeds as a hard fact, and the five-gotra doctrine withdrawing the guarantee that all beings can become Buddha.\n\n### 3.4 如来藏系：无明是客尘，般若连着救度的可能\n\n如来藏经典群（《如来藏经》《胜鬘经》《大般涅槃经》《楞伽经》《宝性论》）正面处理「本来清净为何有染」。《胜鬘经·自性清净章》问得最锋利：「煩惱不觸心，心不觸煩惱，云何不觸法，而能得染心？世尊！然有煩惱，有煩惱染心，自性清淨心而有染者，難可了知。」佛印可并展开：「如是如是！自性清淨心而有染污，難可了知。有二法難可了知，謂自性清淨心難可了知，彼心為煩惱所染亦難可了知。」（T12n0353）——经典**自己**承认：清净心为何被染，是甚深难知的法义。同一章又说：「生死者依如來藏，以如來藏故，說本際不可知」「若無如來藏者，不得厭苦樂求涅槃」——如来藏是生死与涅槃共同的所依，也是厌苦求灭之所以可能。\n\n同一章又给出烦恼的层级，是全部经证里最直接的一条：「煩惱有二種。何等為二？謂：住地煩惱及起煩惱。住地有四種。何等為四？謂：見一處住地、欲愛住地、色愛住地、有愛住地。此四種住地，生一切起煩惱……心不相應無始無明住地……此四住地力，一切上煩惱依種，比無明住地，算數譬喻所不能及……阿羅漢、辟支佛智所不能斷，唯如來菩提智之所能斷。」（T12n0353）\n\n三点值得记住：**其一**，四住地与无明住地构成两级结构，无明住地「心不相应」「无始」，是其余一切上烦恼的依种，其力「算数譬喻所不能及」；**其二**，这里给出了经证版的「维度非单一刻度」——阿罗汉、辟支佛智所不能断，唯如来智能断，二乘解脱与佛智之间确有层次差（与 §8.2 其四互为表里）；**其三**，「无始无明住地」是《胜鬘》的专门术语，与《起信论》「忽然念起」的无明同层而进路不同。〔本文判断〕\n\n《大般涅槃经》把佛性与智慧直接相连：「佛性者名第一義空，第一義空名為智慧。」（T12n0374）——「本有」与「般若」在名相上合一，埋下后来「本觉即般若」的伏线。〔本文判断〕《楞伽经》则两头设防：一方面说「此如來藏識藏，一切聲聞、緣覺心想所見。雖自性淨，客塵所覆故，猶見不淨」；另一方面明说如来藏教说是权：「開引計我諸外道故，說如來藏，令離不實我見妄想」，「當依無我如來之藏」——如来藏绝不是外道的神我。（T16n0670）《宝性论》的论证方向值得特别标出：说如来藏，不是为了解释无明的起源，而是为了解释**还灭为何可能**——若无佛界，众生不会厌苦、不会求涅槃（I.40–41〔大意〕）。研究者因此把如来藏说的意图概括为救度性而非理论性。〔本文判断〕现代「批判佛教」（袴谷宪昭、松本史朗）批评如来藏系以「基体」（dhātu）取代缘起、以「不可思议」封口；辩护者回应「依而无体」已使真如不成实体。这场争论至今未了。〔大意〕\n\n> **英译对读 · 3.4 如来藏系**\n>\n> The tathāgatagarbha corpus faces the fault line head-on. The Śrīmālā Sūtra asks how defilement is possible at all — \"afflictions do not touch the mind, the mind does not touch afflictions\" — and the Buddha confirms that both the intrinsically pure mind and its defilement are \"hard to understand\" (T12n0353). The same sūtra makes tathāgatagarbha the shared ground of saṃsāra and nirvāṇa, and the very reason revulsion from suffering and longing for nirvāṇa are possible. It also grades affliction with precision: four \"dwellings\" (wrong view, sensual craving, craving for form, craving for existence) plus the beginningless ignorance-dwelling which is \"not conjoined with mind,\" the support of all secondary defilements, and — decisive for §8 — \"cannot be cut off by the wisdom of arhats and pratyekabuddhas; only the Tathāgata's enlightenment-wisdom cuts it off\" (T12n0353). The Nirvāṇa Sūtra fuses the terms: \"Buddha-nature is the ultimate truth of emptiness, and the ultimate truth of emptiness is wisdom\" (T12n0374). The Laṅkāvatāra guards both flanks: the tathāgatagarbha-with-the-storehouse is \"naturally pure, yet veiled by adventitious defilements,\" and the teaching itself is expedient — preached to attract those afraid of selflessness, so one must rely on \"the tathāgatagarbha without a self\" (T16n0670). The Ratnagotravibhāga's argument is soteriological, not genealogical: Buddha-nature explains why liberation is possible, not why ignorance arose. Modern \"critical Buddhism\" attacks the dhātu framing; defenders reply that \"depending without substance\" is no substance.〔大意〕\n\n### 3.5 一心系三经论：《起信》《圆觉》《楞严》\n\n这是把①②③合为一体的系统，也是疑情最锋利处的正面文本。\n\n**《大乘起信论》**（真谛译 T32n1666）的核心结构已见 §一。其对无明的定义：「所言不覺義者，謂不如實知真如法一故，不覺心起而有其念，念無自相不離本覺，猶如迷人依方故迷，若離於方則無有迷。眾生亦爾，依覺故迷，若離覺性則無不覺。」——**迷失依真实方向而发生，迷失本身没有独立的实体**；这是与「真如制造无明」最关键的区别。\n\n又说：「如人迷故謂東為西，方實不轉。眾生亦爾，無明迷故謂心為念，心實不動。」不觉如何展开为世界：三细六粗——「一者、無明業相。以依不覺故心動，說名為業；覺則不動。動則有苦，果不離因故。二者、能見相。以依動故能見；不動則無見。三者、境界相。以依能見故境界妄現；離見則無境界。」能所主客不是两个先在的实体，而是在不觉的活动中逐步成立的结构。三细之后更有六粗：「以有境界緣故，復生六種相。云何為六？一者、智相。依於境界，心起分別愛與不愛故。二者相續相。依於智故生其苦樂，覺心起念相應不斷故。三者、執取相。依於相續緣念境界，住持苦樂，心起著故。四者、計名字相。依於妄執，分別假名言相故。五者、起業相。依於名字，尋名取著，造種種業故。六者、業繫苦相。以依業受果不自在故。」（T32n1666）——从「依境生爱恶」到「依业受果不自在」，一条完整的苦之生成链，与十二因缘的「受→爱→取→有」可对读。\n\n论先立本觉的定义：「所言覺義者，謂心體離念。離念相者，等虛空界無所不遍，法界一相即是如來平等法身，依此法身說名本覺。」（T32n1666）觉与不觉的关系：「依本覺故而有不覺，依不覺故說有始覺」；「無明之相不離覺性，非可壞非不可壞。如大海水因風波動，水相風相不相捨離，而水非動性，若風止滅動相則滅，濕性不壞故」——水波喻：波动非水的本性，风止波灭而湿性不坏；「若無明滅相續則滅，智性不壞故」。染净互熏〔大意〕：真如内熏，使妄心厌苦求涅槃；外缘（佛菩萨善知识）为缘——这与《宝性论》同一思路。而对「起点」，论中两处自我标界：一处「依無明熏習所起識者，非凡夫能知，亦非二乘智慧所覺……是故此義唯佛能知。所謂心性常無念故名為不變，以不達一法界故心不相應，忽然念起名為無明」；实叉难陀译本（T32n1667）另有一答：「心初起者但隨俗說，求其初相終不可得。心尚無有，何況有初？是故一切眾生不名為覺，以無始來恒有無明妄念相續未曾離故。」以及：「雖一切眾生等有真如，然無始來無明厚薄無量差別過恒沙數……唯如來智之所能知。」——「忽然」说突发、「无始」说无起点，两词并用，是有意把「从完美到不完美的某个事件」标为不可定位。〔本文判断〕\n\n**《圆觉经》**（T17n0842）对无明的判定更彻底。文殊章：「善男子！一切眾生從無始來種種顛倒，猶如迷人四方易處，妄認四大為自身相，六塵緣影為自心相；譬彼病目見空中花及第二月。善男子！空實無花，病者妄執……此妄有輪轉生死，故名無明。善男子！此無明者非實有體，如夢中人夢時非無，及至於醒了無所得；如眾空花滅於虛空，不可說言有定滅處，何以故？無生處故。一切眾生於無生中，妄見生滅，是故說名輪轉生死。」金刚藏章正面问「本來成佛何故復有一切無明」，佛以金矿喻答：「如銷金鑛，金非銷有；既已成金不重為鑛，經無窮時金性不壞。不應說言本非成就，如來圓覺亦復如是。」修法上「以幻修幻」——「依幻說覺亦名為幻，若說有覺猶未離幻」；奢摩他、三摩钵提、禅那三观及其二十五轮〔大意〕。\n\n《起信论》自身的修法一线：由「信成就发心」起行，行五门——施、戒、忍、进、止观〔大意〕。\n\n**《楞严经》**（T19n0945）卷一立两种根本：「一者、無始生死根本，則汝今者與諸眾生用攀緣心為自性者。二者、無始菩提、涅槃元清淨體，則汝今者識精元明，能生諸緣緣所遺者。」卷四富楼那两问（见 §四）与佛答的「演若达多」喻，是全部汉传文献里与本原问题最直接的对话；修行一路是解结、反闻闻自性的耳根圆通，卷九卷十五十阴魔相当于一张「风险图」〔大意〕。文献说明：《楞严》传译记录与真伪在现代学界长期有争议（研究界意见不一；传统教界不接受），引用其教义时应同时交代这一层。\n\n> **英译对读 · 3.5 一心系三经论**\n>\n> The \"One Mind\" trio merges the three roles of ultimacy into one system. The Awakening of Faith defines non-enlightenment as \"not truly knowing the oneness of true thusness — the mind stirs and thoughts arise; thoughts have no substance of their own and never leave original awakening,\" like being lost about a direction: the error depends on the real direction and owns nothing (\"mistaking east for west, the direction does not turn\"). Its three-stage unfolding shows subject and object are not two prior substances but a structure built inside deluded activity: \"because of not-awakening the mind stirs — that is karma; awakening does not stir; stirring entails suffering.\" Wave and water: ignorance's appearance never leaves awakening's nature, \"the wetness unharmed\"; when ignorance ceases \"the knowing nature is not destroyed.\" Yet the treatise marks its own boundary — such workings \"only a Buddha can know\" — and, in the second translation, denies any findable first arising: \"the initial arising of mind is spoken of only conventionally; seek its first mark and it can never be found\" (T32n1667). The Perfect Enlightenment Sūtra goes further: ignorance \"is not a real entity — like a person in a dream: while dreaming it is not absent; upon waking, nothing is obtained,\" for it \"has no place of arising\"; and gold once refined \"never becomes ore again\" (T17n0842). The Śūraṅgama stages the whole problem as Pūrṇa's question and Yajñadatta — who ran mad searching for his own never-lost head: \"delusion has no true cause… it never truly arose; what is there to extinguish?\" — with \"when the madness rests, that resting itself is bodhi\" (T19n0945).\n\n### 3.6 天台：三惑三观三智，无明即法性\n\n天台把迷惑分为三惑：见思惑（我执贪嗔，障出离）、尘沙惑（于无量法门根机不了，障利他）、无明惑（于中道实相迷昧，障佛智）。以一心三观（空、假、中）破三惑，证三智（一切智、道种智、一切种智）、三谛圆融〔大意〕。最有特色的是「性具」论：《摩诃止观》说「無明即法性，法性即無明」（T46n1911）；《维摩诘经·入不二法门品》电天菩萨语：「明、無明為二。無明實性即是明，明亦不可取，離一切數，於其中平等無二者，是為入不二法門。」（T14n0475）——这不是说烦恼即觉悟、无需修行，而是说无明与法性不是两个独立实体：同一念心，迷时现为烦恼执取，观照下即显法性般若。〔本文判断〕天台更进一步主张佛不断性恶（性具之说）：「从何而来」被改写为「本具」——代价是必须接受「圆满者本具染（性）」这一反直觉命题。知礼《别理随缘二十问》批评「纯净理体随缘造染」一路不通，正落在此处〔大意〕。「六即」（理即→名字即→观行即→相似即→分真即→究竟即）则化解「本具」与「修得」的矛盾：人人理即是佛，不等于究竟即是佛。〔大意〕后世天台家又概括为「一念三千」——但此语非《摩诃止观》原文（本文逐字检索未见），系后出概括，首出待核〔待核〕。\n\n> **英译对读 · 3.6 天台**\n>\n> Tiantai grades delusion into three (view-and-thought, dust-and-sand, fundamental ignorance), met by the three contemplations of one mind (empty, provisional, middle) and the three knowledges. Its signature is \"inherent possession\": the Mohe Zhiguan states \"ignorance is precisely dharma-nature, dharma-nature is precisely ignorance\" (T46n1911), echoing Vimalakīrti's \"the real nature of ignorance is itself luminosity\" (T14n0475). This does not say affliction is awakening and practice unnecessary; it says ignorance and dharma-nature are not two substances — one and the same thought is deluded as grasping and revealed as prajñā under contemplation. The doctrine that a Buddha does not sever inherent evil converts \"where does ignorance come from?\" into a paradoxical \"inherent,\" and the six identities (from principle-Buddha to final-Buddha) reconcile what everyone inherently is with what must be cultivated.\n\n### 3.7 华严：无明与般若都不离法界，迷悟却有差别\n\n华严把缘起性空发展为**法界缘起**：四法界——事法界（现象差别）、理法界（同依法性）、理事无碍、事事无碍（一切现象相即相入、重重无尽）。它不是「一个完美本体制造了不完美世界」的创造论：法界缘起研究的不是 A 先产生 B 的时间序列，而是一切事物如何相互依待、相互资成（姚长寿《缘起和性起》之说〔大意〕）。A 之所以为 A 已离不开 B、C、D，没有任何现象能脱离其他现象独立成立。据此，**法界的圆融不等于众生的经验圆满：整体具有完整的关系结构，不等于其中每个个体都不苦**——这两个命题并不等价。〔本文判断〕华严的般若因此不止于空性观察，而是同时洞察：一切法无自性、依缘起、互为缘起、差别与平等不相互排斥、整体与个别不相隔绝。\n\n论师一脉：法藏以「不变随缘、随缘不变」说真如与诸法（金狮子章〔大意〕），真如不变而在缘起中显现，无明于究竟无实性、于缘起有作用；澄观有「真妄交彻」之说〔大意〕；宗密《原人论》「会通本末」，从「一真灵性」到凡夫身心给出分步叙述，转折点明言在「不觉」一念〔大意〕——这是汉传内部对本原问题最直接的正面叙述。经证一面：《华严经·梵行品》「初發心時即得阿耨多羅三藐三菩提，知一切法即心自性，成就慧身，不由他悟」（T10n0279；通行括语「初发心时便成正觉」，逐字则如所引）——智在初发心位已全。观法一线则有法藏《妄尽还源观》与十玄门、六相之观〔大意〕：以「一即一切」的观门把四法界落到当下事相上。《如来出现品》佛叹众生具如来智慧而愚癡迷惑（引文见 §〇引言），并以日出先照高山为喻〔大意〕。修行上，「《华严经》十地品以般若波罗蜜与其他波罗蜜相资，高阶地中与方便、愿、力、智相配合」〔大意〕；宗密主张「顿悟渐修」，理上顿悟、事上渐修，既化解「本具」与「须修」的张力，也针对洪州禅「任运」之弊〔大意〕。\n\n> **英译对读 · 3.7 华严**\n>\n> Huayan develops emptiness into dharma-realm dependent arising: four realms culminating in the mutual containment of all phenomena. It is not a creation story — the point is not that A produced B but that nothing stands alone: every phenomenon already presupposes all others. Hence the realm's fullness does not entail each being's experience being whole; structural completeness and experiential freedom are different claims.〔本文判断〕 Prajñā here is not only seeing emptiness but seeing the endless interweaving: difference and equality do not cancel; whole and part do not wall each other off. Fazang's golden lion (\"unchanging yet according with conditions\"), Chengguan's \"true and delusion interpenetrate,\" and Zongmi's *Origin of Humanity* — which traces beings stepwise from the \"one true numinous nature\" through the single thought of \"not-awakening\" — are the school's most direct account of the fault line〔大意〕. Scripturally: \"at the very first arousing of the mind he attains unsurpassed awakening, knowing all dharmas as his mind's own nature\" (T10n0279), beside the Buddha's cry over beings who possess tathāgata-wisdom yet do not know or see it.\n\n### 3.8 禅宗：迷悟在一念，般若是自性之用\n\n达摩「理入」：深信凡圣同一真性，但为客尘妄覆，不能了显〔大意〕。《六祖坛经》把这一立场说得最直接：「善知識！菩提般若之智，世人本自有之；只緣心迷，不能自悟，須假大善知識，示導見性。當知愚人智人，佛性本無差別」「凡夫即佛，煩惱即菩提。前念迷即凡夫，後念悟即佛。前念著境即煩惱，後念離境即菩提」「一切般若智，皆從自性而生，不從外入」「一念愚即般若絕，一念智即般若生」「我此法門，從上以來，先立無念為宗，無相為體，無住為本。無相者，於相而離相。無念者，於念而無念」（T48n2008）。\n\n定慧的关系，六祖说得斩截：「我此法門，以定慧為本……定慧一體，不是二。定是慧體，慧是定用。即慧之時定在慧，即定之時慧在定。」（T48n2008）——般若不是定外另加的一件东西，定慧是一体的两面；这也解释了禅门何以不立「先定发慧、先慧发定」的次第。\n\n无念不是没有思想，是不被妄念支配；无相是不执现象的固定相；无住是心不黏着于任何对象——与《金刚经》「应无所住而生其心」一脉相承。六祖还特别反对空心静坐、口头说空而无实行：般若是在念念活动中不取不舍的生命实践。后世看话禅把「疑情」当发动机、直取无明本身，默照禅从「本来圆满」出发安坐观照——恰好抓住同一问题的两端〔大意〕。道元之问是本原问题的镜像：「既圆满何须修？」其答为「修证一等」：修行不在证之前、也不导向证，二者当下不可分〔大意〕。\n\n> **英译对读 · 3.8 禅宗**\n>\n> Chan compresses the theory into practice. Bodhidharma's \"entering by principle\": one true nature shared by ordinary and sage, veiled by adventitious dust〔大意〕. The Platform Sūtra: \"the prajñā of awakening, people originally possess it; only the mind is deluded and cannot awaken by itself\" — \"a prior thought deluded: an ordinary being; a later thought awakened: a Buddha\"; \"all prajñā wisdom arises from self-nature, not from outside\"; \"one deluded thought and prajñā is cut off; one awakened thought and prajñā is born\" (T48n2008). Concentration and wisdom are one body, \"not two: concentration is the substance of wisdom, wisdom the function of concentration\" (T48n2008) — prajñā is not an extra item added beside meditative calm. No-thought (not being commanded by thoughts), no-form (not fixating appearances), no-abiding (the mind not sticking anywhere) — the life of the Diamond Sūtra's non-abiding. Later methods split: huatou Chan turns the doubt itself — the questioning \"why?\" as ignorance in operation — into the engine; silent illumination starts from inherent completeness; Dōgen answers \"if already perfect, why practice?\" with practice-and-awakening as one〔大意〕.\n\n### 3.9 净土：不为无明建立哲学，为深重凡夫给出路\n\n净土宗没有建立一套独特的无明哲学。它的重心是：凡夫无始习气难以此生断尽，故以信（信佛本愿）、愿（愿生净土）、行（持名念佛）为门，依佛愿力往生，在净土继续修行直至成佛；「带业往生」，不要求此生先断尽无明〔大意〕。昙鸾《往生论注》分法性法身与方便法身说阿弥陀佛——法性之身与慈悲之身异而不可分，悲用经由名号与愿力起作用，但不强制〔大意〕。这直接回应了「法界为何不呵护众生」：真正能呵护人的，在事法界里——佛菩萨的悲愿、善知识、教法；而连佛也不能代人觉悟。《法句》「汝当自努力，如来唯导师」（Dhp 276〔大意〕）。\n\n> **英译对读 · 3.9 净土**\n>\n> Pure Land builds no separate philosophy of ignorance. Its judgment is realistic: beginningless habits cannot be exhausted in this life, so the gate is faith (in the Buddha's vow), aspiration (birth in the Pure Land) and practice (recitation) — carried by other-power, \"with karma remaining,\" toward final awakening there. Tanluan's two bodies — the dharma-nature body and the body of expedience, \"different yet inseparable\" — answer \"why doesn't the realm protect us?\" directly: compassionate function works through the name and the vow, but never coerces〔大意〕. And even a Buddha cannot awaken on another's behalf: \"strive yourselves; the Tathāgata only points the way\" (Dhp 276〔大意〕).\n\n### 3.10 藏传：应成的实执分析，大圆满的明觉与无明\n\n格鲁派承应成中观：无明是把人与法执为「从自身一方成立」的实执；般若是以分析性禅修破「所破」，证人无我、法无我。宗喀巴一系特别把无明界定为**颠倒知**（mis-knowing）而非单纯的不知——它与般若同取一境而方向相反，不能并存〔大意〕。空性与缘起互相成立：不因说空而坏世俗因果。宁玛派大圆满有另一套术语：Rigpa（本初明觉）与 Marigpa（不识）——本初觉性从未真正失去，众生只是没有认出、没有安住于它；修行以直指后的认取与任运自解脱为主〔大意〕。注意两条边界：Marigpa 在大圆满语境中不完全等同于一切传统的 Avidyā；Rigpa 也不能被理解成一个独立存在的宇宙观察者——空性与明觉必须结合理解。英文学界概述说，「无明如何自基而起」是大圆满核心议题，答案落在「基本身有自然的认知潜能」，且「基」只是相对施设，究竟上是「无基之基」〔大意·二手概述〕。密续又说五毒转五智：痴→法界体性智、嗔→大圆镜智、慢→平等性智、贪→妙观察智、嫉妒→成所作智〔大意〕——「转」不是烦恼无须处理、也不是烦恼已等于佛智，而是执取结构被彻底净化后，原本被误用受限的心识功能在觉悟中显发为智慧；与唯识转依一脉相通。各派对五毒五智对应细节解释不一。\n\n> **英译对读 · 3.10 藏传**\n>\n> Geluk Madhyamaka defines ignorance as reifying persons and things as established \"from their own side,\" and classifies it as a *mistaken cognition* taking the same object as its antidote — hence the two cannot coexist, and analytic meditation dismantles the object of negation. Emptiness and dependent arising establish each other; denying convention is as wrong as reifying the ultimate〔大意〕. Dzogchen speaks another language: rigpa (primordial luminosity) was never lost, only unrecognized (marigpa); the path is direct introduction and spontaneous release — with the warnings that rigpa is not an independently existing cosmic observer, and the \"ground\" itself is finally \"groundless\"〔大意〕. Vajrayāna adds the five poisons as five wisdoms: when the grasping structure is purified, the very energies misused by affliction function as wisdom — kin to Yogācāra's transformation of the basis.\n\n### 3.11 当代华严禅观：海云继梦的「第一念·第二念」模型\n\n草稿专有一轮研问海云继梦法师的相关讲授，值得单独立节：他是本站普贤乘传承的当代法脉，也是少数把「一念无明怎么来」直接当心性理论核心来讲的当代华严讲师。依公开讲稿转录〔大意〕（《耳根圆通章》第二、三、四集，《华严禅行法·禅观》第五集，佛教导航 fjdh.cn）：\n\n- **心性三结构**：心（心体）、性（心用）、念（心相），人人本具，称「本体念」；\n- **第一念**：本体念起相，无明尚未介入；\n- **第二念**：无明介入，相转为色，开始识尘相荡，进入受想行识的相续；\n- **相续机制**：「相续心为无明本」——心识活动形成模式、模式重复成惯性、惯性不断强化识的运作，无明愈演愈盛；\n- **自知边界**：「我们常讲一念无明起，无明怎么来的？关键在无明怎么来的」「无明怎么介入这是另外一个理论」「为什么介入，你也不知道」——他自己在讲稿里承认：单纯沿十二因缘追问会退回循环，而介入之因不在机制说明之内。\n\n另有《地藏菩萨行法·陆》区分「法身一念起」与「无明起」：法身入法界不等于重新产生无明〔大意〕。评估〔本文判断〕：这套模型的价值在**修行性观察**——把「清净心性如何转入分别」讲成可操作的禅观对象，截断相续即截断无明之食；但机制解释（无明如何持续）不等于起源解释（为何最初介入），两者不可混同，§4.5 的三层区分在此同样适用。\n\n> **英译对读 · 3.11 海云继梦**\n>\n> Master Haiyun Jiumeng, the contemporary Huayan teacher behind this site's Puxian-vehicle materials, works the same fault line in his *Ear-Root Perfect Penetration* lectures. He structures mind as substance, function and appearance (the \"thought of the basis\"), then splits the **first thought** (appearance arising, ignorance not yet involved) from the **second thought** (ignorance intervening; appearance becomes form; consciousness begins), and names the sustaining mechanism: \"the continuity of mind is the root of ignorance\" — habits sedimented in memory keep strengthening consciousness, and the stronger consciousness runs, the thicker ignorance grows. But he states the boundary himself: \"why it intervenes — you do not know,\" and \"how ignorance intervenes is another theory.\" The model explains how ignorance persists and where to cut it in practice; it does not explain why there was ever a first intervention. The cited materials are lecture transcripts (fjdh.cn)〔大意〕, not verified originals — the distinction stays on record.\n\n### 3.12 重要经典中无明与般若的具体侧重\n\n宗派之外，把经典排开看，各部经论的理论重心并不相同（下表整理自草稿第十五部分，〔本文判断〕）：\n\n| 经典 | 对无明的主要解释 | 对般若或智慧的主要解释 |\n|---|---|---|\n| 《阿含经》 | 不如实知四圣谛、五蕴、缘起 | 如实知苦集灭道、无常、无我 |\n| 《大般若经》 | 对诸法产生实有执著 | 证悟诸法空性、无所得 |\n| 《金刚经》 | 执著我相、人相、众生相、法相 | 无住、无相、无所得 |\n| 《心经》 | 无明及十二因缘的究竟空性 | 照见五蕴皆空的般若 |\n| 《中论》 | 执著诸法有自性 | 缘起性空、中道智慧 |\n| 《解深密经》 | 对依他起经验产生遍计所执 | 如实认识三性 |\n| 《楞伽经》 | 无始妄想习气、能所分别 | 离分别、转依、证自觉圣智 |\n| 《胜鬘经》 | 自性清净心与烦恼染污的关系 | 如来藏与法身的究竟智慧 |\n| 《大乘起信论》 | 不觉、妄念及生灭心相续 | 始觉与究竟觉、本觉显发 |\n| 《楞严经》 | 妄为明觉、能所分别、妄无所依 | 妙明真心、根本智慧及圆通 |\n| 《圆觉经》 | 无明非实有体、无生处故 | 圆觉本性及如实观照 |\n| 《华严经》 | 对法界缘起、事理关系不能如实了知 | 法界无碍智、普贤行 |\n| 《六祖坛经》 | 心迷、著境、不识自性 | 自性般若、无念、无相、无住 |\n| 《大般涅槃经》 | 烦恼客尘、佛性未显 | 佛性、常住法身、如来智慧 |\n\n须注意：这些经典并非在严格意义上提出同一套般若理论——《楞严》重在妙明真心、妄动与圆通，《心经》集中于般若空性，《胜鬘》侧重如来藏与自性清净心。不能因为它们都讲究竟智慧，就把它们混成一套。\n\n> **英译对读 · 3.12 经典侧重**\n>\n> The same table read across traditions: the Āgamas locate ignorance in not knowing the four truths and the aggregates; the Prajñāpāramitā corpus in reifying any dharma; the Diamond Sūtra in the four notions; the Heart Sūtra in the emptiness even of ignorance and its cessation; the Madhyamaka in grasping intrinsic nature; the Saṃdhinirmocana in the imagined nature superimposed on the dependent; the Laṅkāvatāra in beginningless habitual construction; the Śrīmālā in the relation between intrinsic purity and defilement; the Awakening of Faith in non-enlightenment and the continuity of arising-and-ceasing; the Śūraṅgama in taking luminosity as an object; the Perfect Enlightenment in ignorance having no substance and no place of arising; the Avataṃsaka in failing to see dharma-realm dependent arising; the Platform Sūtra in deluded mind clinging to objects; the Nirvāṇa Sūtra in adventitious defilement veiling Buddha-nature. They are not one theory in fourteen vocabularies — each weights the pair differently.\n\n### 3.13 三种「无明—般若」关系模型\n\n把上面十系收拢，可以抽出三种底层模型〔本文判断〕：\n\n| 模型 | 谁在用 | 对起点 | 般若是什么 | 修法 | 风险 |\n|---|---|---|---|---|---|\n| 对治（相违） | 阿含、阿毗达磨、中观、唯识 | 无始，不问 | 与无明互斥的另一种认知，取代之 | 渐进、分析性 | 修行成为新的执取；「必成」无形而上担保 |\n| 熏习（和合） | 如来藏至《起信》、地论，华严兼用 | 「忽然」，不可说 | 始觉合于本觉 | 信→解→行→证 | 被读成「真心生万法」，天台与批判佛教由此发难 |\n| 同体（即是） | 天台性具、华严事事无碍一面、禅、密、大圆满、道元 | 问题消解 | 烦恼的本相 | 认取、观心、当下 | 无修无证的道德风险（宗密批洪州正针对此） |\n\n般若概念也随模型迁移：从「断无明的事件」（阿含），到「证空的方式」（中观），到「转依后的智」（唯识），到「心的本性」（起信、楞严、坛经；汉传常用「文字、观照、实相」三般若亦在此线上），再到「烦恼的本相」（天台、密、大圆满）。越往后，般若与无明的关系从「相违」走向「同体」，「为什么」也随之从被回答变成被消解。〔本文判断〕\n\n> **英译对读 · 3.13 三种关系模型**\n>\n> Three underlying models organize all ten systems〔本文判断〕. The **antidote model** (Āgama, Abhidharma, Madhyamaka, Yogācāra): ignorance and wisdom are mutually exclusive cognitions, one replacing the other; the origin is beginningless and not asked; practice is gradual and analytic; the risk is practice becoming a new grasping, with no metaphysical guarantee of success. The **infusion model** (tathāgatagarbha through the Awakening of Faith, used alongside Huayan): awakening and non-awakening share one mind and perfume each other — inner perfuming by suchness, outer conditions from teachers; the origin is \"sudden,\" unsayable; prajñā is initial awakening according with original awakening; the risk is reading it as \"the true mind produces the world.\" The **identity model** (Tiantai's inherent possession, Huayan's mutual containment, Chan, Vajrayāna, Dzogchen, Dōgen): the substance of ignorance is itself luminosity; the question of origin dissolves; practice is recognition, not destruction; the risk is moral slack dressed as no-practice. Along this line the concept of prajñā itself migrates — from the event of severing ignorance, to the mode of seeing emptiness, to the wisdom after transformation, to the nature of mind, to the very face of affliction — and the question \"why?\" migrates with it: from being answered to being dissolved.\n\n## 四、无明本原：为什么本来是觉，却有不觉？\n\n### 4.1 先检查问题里嵌着的五个预设\n\n**其一，把「依」读成了「生」。**《起信论》说「依如來藏故有生滅心」，《胜鬘经》说「生死者依如來藏」——用的都是「依」（所依），不是「能生」。真如是无为法，没有生起有为法的作用；它与无明的关系是体与相（水与波），不是因与果（父与子），没有先后，也没有「产出」这个动作。「真如缘起」多半是后世四种缘起分类（业感、赖耶、真如、法界）里的标签；华严自家的终局讲法是法界缘起（及性起），重重互摄，没有居先的源头。〔大意〕所以「烦恼由真如而生」这一转述，本身就已偏了一步。\n\n**其二，默认了意图与设计。**「何必」「让众生受苦」「bug」都是设计语言。bug 需要设计者、规格、预期输出三样，缘起三者俱无。《如来出现品》以日出先照高山为喻：日光并不作念「我先照高山」，照有先后，只因山地高下不同〔大意〕。佛教也不做神义论——不说「苦是为了更大的善」：**苦没有目的，但有出口**。\n\n**其三，把法性放进了「守护者」的位置。**要求法界法性「决定、呵护」众生，是「全善全能者」模型的影子。真如是「如是」，不是主体；真正能呵护人的在事法界里：佛菩萨的悲愿、善知识、教法——而且连佛也不能代人觉悟。真如的角色不是保护，而是**保证「可转」**：烦恼无自性，所以可断——「以有空義故，一切法得成」（T30n1564）。\n\n**其四，把「圆满」当「纯净」，把「本有」当「原先拥有」。**华严的「圆」是无外、无碍、无余，不是「不出现缺陷」。落到可操作的定义，「完美」宜读作**不可损＋可复原**：《起信论》「若無明滅相續則滅，智性不壞故」（T32n1666），《圆觉经》「既已成金不重為鑛，經無窮時金性不壞」（T17n0842）——不是不起波，而是起波不损水性。「本有」是理上的说法：真如非三世所摄，并非「曾经拥有、后来丢失」；「为何丢失」这个谜，是被时间化的「本有」制造出来的。〔本文判断〕天台「六即」划得最清楚：理即佛（人人是）与究竟即佛（已证）并不矛盾，层面不同。另外，「众生本有真体」若读成「众生拥有一个真体」，又会滑向「真我」模型——波是水的样子，不是水的所有者。\n\n**其五，把「幻」当「无力」，把「幻终不敌真」当力量对决。**幻在世俗层有完整效力：《圆觉经》说无明「如夢中人，夢時非無」——梦里的泪是真泪。「幻终不敌真」不是两股力量的较量，而是「醒」的条件成熟与否：黑暗没有力量，无需被击败，只待光到。世俗层里条件成熟极慢（三大阿僧祇劫、人身难得、佛法难闻），所以「多数众生仍在其中」是理论的预测，不是理论的反例——如同可治愈却极难治的慢病，多数人未愈，并不证明它不可愈。〔本文判断〕\n\n### 4.2 逻辑层：矛盾到底在哪里\n\n把疑情写成论证：（A）真如圆满、不变；（B）无明烦恼依真如而有；（C）圆满者不应含带缺陷；故矛盾。经论的做法是**否认（C）的适用域，并重写（B）**：（C）是有为法领域的因果相称原则，真如不在此域，且「圆」本非排斥缺陷；（B）被改写为：无明「非實有體」（T17n0842），它不是「被产出的东西」。\n\n再把龙树四句套到「无明从真如来」上〔本文判断·套用，经论并未逐条如此写〕：自生，则真如变染，违「不变」；他生，则法界之外另有来源，违「圆融」，且「他」又需来源；共生，二过俱犯；无因，则成偶然——那才是真正意义上的 bug。四句皆不成，结论不是「所以是 bug」，而是**无生**：《圆觉经》「一切眾生於無生中，妄見生滅」（T17n0842）；《楞严经》以演若达多为喻说「妄性如是，因何為在」——头从未丢，追问「为何丢头」本身即属狂走。\n\n「忽然念起」说突发，「无明无始」说无起点，二词并用，是有意把「从完美到不完美的某个事件」标为不可定位。《起信论》同一段里既说「忽然念起」，又说「此義唯佛能知」；《胜鬘经》也说「難可了知」。这是**自觉标界，不是遮掩**。〔本文判断〕更深一层是**视角不对称**：没有任何单一视角，能让「圆满的真如」与「真实的苦」作为同等实在的两项进入同一条因果叙事。觉者位上，本无无明可说（《圆觉经》金矿喻「既已成金不重為鑛」）；迷者位上，无明无始，永远望不到起点。经论拒绝提供「第三位置的全景叙事」，代以二谛不二。要求的「逻辑通顺」，恰是在要求这个第三视角——所以「讲不通」是准确的诊断：它标出的是问题形式的边界。〔本文判断〕\n\n顺带把草稿里一个被作者自己否决的比喻记在案：完备的数学系统与使用它出错的人。它只能说明「根本层面的完备，不逻辑必然要求每一依之成立的活动都不出错」；但它预设了系统与一个站在系统之外的使用者——而众生不离真如，恰是这个比喻不能承载之处。弃用是正确的。〔本文判断〕\n\n### 4.3 经证集中解读\n\n**《楞严经》卷四**：富楼那两问之后，佛陀以演若达多作答。演若达多晨照镜，爱镜中头，嗔己头不见，谓魑魅所致，无故狂走。佛问：此人何因狂走？富楼那答：「是人心狂，更無他故。」佛言：「妙覺明圓、本圓明妙，既稱為妄，云何有因？若有所因，云何名妄？自諸妄想展轉相因，從迷積迷以歷塵劫；雖佛發明，猶不能返。如是迷因，因迷自有。識迷無因，妄無所依；尚無有生，欲何為滅？得菩提者，如寤時人說夢中事；心縱精明，欲何因緣取夢中物？」又说：「忽然狂歇，頭非外得。縱未歇狂，亦何遺失？富樓那！妄性如是，因何為在？」（T19n0945）这段经文有两个层次，不可混同：**妄的终极根本没有真实的独立原因**——若有一个真实的独立原因使觉性真的变化，它就不再只是「妄」；**妄的相续却真实有效**——妄想展转相因，从迷积迷。同卷阿难追问：既非因缘，是否落入外道自然？佛以同喻答：「若得滅除，則不狂性自然而出。因緣、自然，理窮於是」「本頭不失，狂怖妄出，曾無變易，何藉因緣？」——并立「殺、盜、婬三緣斷故，三因不生」「狂性自歇，歇即菩提，勝淨明心本周法界，不從人得」。即：世俗因果层面因缘相续成立；究竟层面没有一个需要第一因来创造的迷失实体；修行止息迷妄，不是重新制造曾失去的觉性。\n\n卷四还有一问一答，直接回答「觉悟者会不会再生无明」，草稿未及而经文自答。富楼那问：「若此妙覺本妙覺明與如來心不增不減，無狀忽生山河大地諸有為相；如來今得妙空明覺，山河大地有為習漏何當復生？」——众生无状忽生山河大地，那么已证妙空明觉的如来，会不会再有山河大地与习漏复生？佛陀以「於一聚落惑南為北」的迷方喻反问：此迷为因迷而有、还是因悟所出？富楼那答：「迷本無根，云何因迷？悟非生迷，云何因悟？」佛印成并推至极处：「富樓那！十方如來，亦復如是。此迷無本，性畢竟空。昔本無迷，似有迷覺，覺迷迷滅，覺不生迷。」——迷无根故迷不生迷；**十方如来亦复如是**：觉悟不再生迷，如翳病若除花于空灭，愚人却于空花灭处待花更生（T19n0945）。这一段把「无明无体」从解释推进到实践担保：觉后不复迷，因为迷从来没有真实生起过。〔本文判断〕至于妄动的结构，经中另有「性覺必明，妄為明覺。覺非所明，因明立所，所既妄立，生汝妄能，無同異中熾然成異」一段——觉性本明，不需要另立一个「所明」；妄加一个所明，能所对待成立，继而同异、世界、尘劳烦恼展开。传统注疏（如憨山《楞严经通议》）解「妄为」为于本觉上妄加分别〔大意〕。注意：这是**解释结构，不是宇宙创生史**——经文恰恰称这种建立为「妄」。〔本文判断〕\n\n**《圆觉经》文殊章**的判定已引于 §三：「此無明者非實有體……無生處故。」它的重点不在解释妄如何形成（《楞严》所长），而在**否定妄有一个真实的生处**：显现可以发生而不具独立自性，感受可以真实发生而不证明所执对象实有，妄可以相续而不存在一个独立的妄之本体。两经合读：「不二的觉性没有真的变成二元；无明也不是一个侵入觉性的独立实体；众生于无生中妄见生灭。」\n\n**《楞伽经》**：大慧问：「世尊！若眾生生死本際不可知者，云何解脫可知？」佛答：「無始虛偽過惡妄想習氣因滅，自心現知外義，妄想身轉解脫不滅。」又说：「不識自心現妄想，故妄想生。若識則滅。」（T16n0670）——生死本际不可知，但妄想习气的止息可知可行。这不是回避，而是把注意力从「第一起点」转到「因缘机制及其止息」。\n\n**《胜鬘经》**：「自性清淨心而有染者，難可了知」——经典直接承认这一层是甚深难知。保持谨慎，不是不理解佛法，而是尊重经典自己对这个难题的定位。\n\n还有两处草稿材料值得补记〔大意·未逐字回源〕。其一是蕅益智旭《大乘起信论裂网疏》设问：众生无始以来从未觉悟，那么**第一个成佛的人由谁指示**？他在真如门上答以无先无后可立；在生灭门上则以旷野迷失者可观日影自辨东西为喻——并引紫柏大师语：「最先一佛，以苦谛为师也。」觉悟不必依赖另一个已经觉悟者的启动，苦的事实本身可以成为第一位老师；但这解释了最初觉悟者如何可能出现，仍不解释最初为何有不觉。其二是两个论证支点的呼应〔本文判断〕：《起信论》「心初起者但隨俗說，求其初相終不可得」自心的一侧说不可立初，《楞严》「尚無有生，欲何為滅」自妄的一侧说本自无生——同一个「无初可立」，一从体、一从相，互为表里。\n\n> **英译对读 · 4.3 经证合读**\n>\n> The scriptures read together: the Śūraṅgama separates the *structure* of delusion (intrinsic luminosity mistaken as an object to be illuminated; the object falsely established, the subject follows; sameness and difference blaze forth) from its *groundlessness* (\"delusion has no cause of its own; recognize that delusion has no cause and delusion has nothing to rest on; it never truly arose — what is there to extinguish?\") and from the *conventional efficacy* of causality (three conditions severed, three causes unborn; \"when the madness rests, that resting itself is bodhi\"). The Perfect Enlightenment denies a real place of arising; the Laṅkāvatāra declares the beginning of saṃsāra unknowable while its cessation is fully practicable; the Śrīmālā names the whole relation \"hard to understand.\" Read jointly: the nondual was never really made dual; ignorance never really entered; what remains is the conditional mechanism and its cessation.\n\n### 4.4 六家把「不可说」安放在哪里\n\n| 立场 | 如何处理「完美→缺陷」 | 付出的代价 |\n|---|---|---|\n| 《起信论》／如来藏 | 一心二门；无明「依」真如而无体；起点「唯佛能知」；以熏习说明可还灭 | 起点留下不可说的残余；易被读成「真心生万法」 |\n| 《楞严经》 | 缺口放在「觉明」自身：觉的明性被当作对象，便立「所」生「能」 | 最接近给出「理由」，但等于承认圆满者里有倾向；天台对「真心为源」一路的批评正落在此处 |\n| 《圆觉经》／中观 | 取消问题：无明无体，「無生處故」，起灭皆是于无生中妄见 | 对要求理论闭合者，是「消解」而非「回答」 |\n| 天台 | 性具：无明即法性，佛不断性恶；「从何来」改写为「本具」 | 须接受「圆满者本具染」的反直觉命题 |\n| 唯识 | 拒绝让真如生法；染种无始，染净皆依他起 | 无始染种成了另一块硬事实；五种姓使「皆可成佛」失去保证 |\n| 大圆满 | 「基」有自然的认知潜能，认与不认两种可能同在；不认即无明 | 近于「无理由的分岔」；教内说无明「无根」〔大意〕 |\n\n没有一家声称拥有神义论式的完整推导；各家只是选择把那块「讲不通」放在哪里——真如、种子、空、性具，或问题本身。现代批评者（印顺一系；日本「批判佛教」）认为如来藏系以「不可思议」封口恰是软肋；辩护者以「依而无体」「不守自性」回应。〔大意〕\n\n> **英译对读 · 4.4 六家安放**\n>\n> The six placements of the unsayable: each system parks the unlocatable origin somewhere else — in \"only a Buddha can know\" (Awakening of Faith, with perfuming explaining the return); in the luminosity itself taking itself as object (Śūraṅgama — the closest to a \"reason,\" at the price of admitting a leaning within the perfect, exactly where Tiantai's critique of \"pure mind as source\" strikes); in dissolving the question (Perfect Enlightenment and Madhyamaka: no place of arising); in inherent possession (Tiantai: the perfect inherently contains the afflictive); in beginningless seeds with a non-producing suchness (Yogācāra — another hard fact, plus the five gotras); and in the ground's natural cognitive potential (Dzogchen — a groundless ground). No school offers a theodicy-grade derivation; each chooses where to put what does not add up — in suchness, seeds, emptiness, inherent nature, or the question itself.\n\n### 4.5 已答与未答：把账算清\n\n把全部讨论收成一张表：\n\n| 问题 | 佛教的回答程度 |\n|---|---|\n| 无明是什么？ | 有系统定义（不如实知、执自性、二取） |\n| 无明如何运作、展开为能所与世界？ | 有结构描述（三细六粗、性觉必明段、遍计执） |\n| 无明如何相续、为何不觉不自动消除？ | 有系统解释（种子熏习、相续心、二障、条件链） |\n| 无明如何止息？ | 有完整道次（四谛、三观、转依、认取） |\n| 为什么众生不离真如却不觉悟？ | 如来藏本觉系有说明（不离≠现行显发），仍有深层疑难 |\n| 无明为什么无始地存在（第一因）？ | **没有统一的第一因解释**；只有三种安放方式：无始（对治）、不可说（熏习）、无生或性具（同体） |\n\n因此，准确的结论不是「佛法完全解释了无明」，也不是「佛法完全不能解释无明」，而是：**佛法对无明如何运作、相续、止息，有相当完整的理论体系；但对无明为何存在一个绝对的第一起点，没有提供普遍接受的形而上学解释**——而且佛教可能认为，这个「第一起点」所要求的因果想象本身就不恰当。「不给理由」并非偷懒，至少有四重依据：缘起不容第一因（论证）；「为什么」要求目的或设计者，缘起结构里没有这类角色（范畴）；箭喻的实践取舍（实践）；用来追问的认知工具本身出自无明——这是禅宗「谁在问」的由来（自指）。前三条不依赖修行体验即可评估。〔大意＋本文判断〕\n\n### 4.6 追问无明，是不是修行的必要条件？\n\n从修行立场看：**不是**。佛法要求掌握的不是「先发现无明的宇宙学起源再开始修行」，而是「如实认识当下无明如何生起、如何持续、如何止息」。《中部》63 箭喻经：中箭者不当先追问射箭者是谁，而当先拔箭〔大意〕——该经本讨论的是佛陀置答的宇宙论问题，不是对无明第一因的判词，其原则却清楚：**不要把一个问题的终极解释，设定为实践解脱的先决条件**。《杂阿含》266 经：「於無始生死，無明所蓋，愛結所繫，長夜輪迴，不知苦之本際。」（T02n0099）——重点在认识相续机制以止息相续，不在找到最初一刻。\n\n但追问并非无益，至少防三误：不把真如误当成制造无明的宇宙本体；不把「本具佛性」误当成众生已经具有佛陀全部现行智慧；不把「不可思议」当成免答金牌。修行者可以认真修行、真实减少烦恼，同时继续理性追问无明本原——两者不冲突。〔本文判断〕\n\n> **英译对读 · 第四节**\n>\n> **Five premises embedded in the question.** (1) \"Depends on\" is read as \"produces\": the texts say arising-and-ceasing *depends on* suchness — a ground–appearance relation like water and wave, not cause–effect; no priority, no act of production. (2) Intent and design are smuggled in: a \"bug\" needs a designer, a specification and an output relation; dependent arising has none. The Buddha's sunrise simile (the sun does not intend to light the high mountain first) blocks both cruelty and dereliction; Buddhism offers no theodicy — suffering has no purpose, but it has an exit. (3) Dharma-nature is cast as a guardian: genuine protection lives in the phenomenal realm — a Buddha's vows, teachers, the teaching — and even a Buddha cannot awaken on another's behalf; what suchness guarantees is not protection but **transformability**. (4) \"Perfect\" is read as \"flawless\" and \"innate\" as \"once owned\": the operative sense of perfection is **indestructible + restorable** — \"if ignorance ceases, the sequence ceases, and the knowing nature is not destroyed\"; refined gold never becomes ore again. \"Why was it lost?\" is a riddle manufactured by temporalizing \"innate.\" (5) \"Illusory\" is read as \"powerless\": in the dream, tears are real; \"illusion never defeats truth\" is not a duel of forces but the ripening of waking.\n>\n> **The logic.** The contradiction requires proposition (C) \"the perfect must contain no defect\" — a principle of the conditioned realm, which suchness does not inhabit; and (B) is rewritten as \"ignorance is not a real entity.\" Applied to \"ignorance from suchness,\" Nāgārjuna's four alternatives (self-caused, other-caused, both, causeless) each fail — the conclusion is not \"therefore a bug\" but **non-arising**: \"beings falsely see arising and ceasing within the unborn.\" \"Suddenly arising\" and \"beginningless\" are used together deliberately: the \"event of falling from perfection\" is marked as unlocatable. And there is a **perspectival asymmetry**: no single vantage lets \"perfect suchness\" and \"real suffering\" enter one causal narrative as equally real terms — the texts refuse a panoramic third position. \"It doesn't add up\" is an accurate diagnosis of the question's form, not of the dharma.\n>\n> **What remains unanswered.** Buddhism explains richly how ignorance operates, continues and ceases; it offers no universally accepted first cause. Its \"silence\" rests on four grounds: dependent arising excludes first causes (argument); \"why?\" demands purpose or design, absent from the structure (category); the arrow parable (practice); and the reflexivity that the questioning instrument is itself ignorance (the Chan \"who is asking?\"). For liberation, this is not a prerequisite: know how ignorance arises, sustains and ceases — the beginningless beginning is not the gate. A rejected analogy deserves its verdict on record: the picture of a complete mathematical system with an error-prone *user* cannot carry the case, because its user stands outside the system, while beings never stand outside suchness.〔本文判断〕\n\n### 4.7 三大真分歧\n\n草稿第十五部分把各宗的分歧收成三条〔本文判断〕。**其一：无明是认知错误，还是心性上的根本不觉？**早期佛教与中观取前者——不必假设一个原本完整运作的宇宙觉知后来突然不觉；唯识把这种错误认知挖到意识结构深处（末那我执、赖耶种子）；如来藏与本觉则正面描述本来清净、具足觉性的心性及其与不觉的关系——于是必须面对「本来清净的心为何呈现无始染污」，而《胜鬘经》直接承认「難可了知」。这是各家不能混同之处。**其二：般若是破除错误认知，还是显发本来具足的智慧？**中观：如实洞察缘起性空，不另立智慧主体；唯识：认识二取虚妄、转识成智；如来藏本觉：还有显发本具觉性之义；禅：当下见性、无住不染的生命实践。解脱效果上可以相通，对「智慧究竟是什么」的理论定位不同。**其三：究竟是否存在一种本初明觉？**中观的严格解释不立独立恒常的本初意识；某些如来藏、本觉解释强调本来清净明觉的心性；大圆满的 Rigpa 又是另一套本初觉性理论。三者不能视为相同——中观的空性不是觉知主体，如来藏的本觉不是普通意识，Rigpa 也不能理解成独立存在的宇宙观察者。所谓非二元智慧，不能简单等同于各宗共同认可的一种「宇宙意识」。\n\n### 4.8 继续参究的四个问题\n\n结合全篇疑情，有四个问题值得带着修行继续参〔大意＋本文判断〕。\n\n**问题一：无明究竟是「不知」，还是「误知」？**若只是没有认识真实，般若就是补足缺失的认识；但若无明本身在运作、主动建立能知主体与所知对象（唯识尤其强调这一层），它就不是空缺，而是一种错误的认知结构——那么般若是否就是彻底看穿这种结构，发现从来没有一个独立的能知者与所知对象？\n\n**问题二：般若是本来具足，还是修行产生？**若本具，为何不自动显现？若修生，又如何认识超越生灭、超越能所的实相？宜区分四层：智慧的本具性质、智慧的现行功能、修行中的智慧增长、究竟佛智的圆满显发。\n\n**问题三：若般若超越能所，是谁在觉悟？**若还有一个主体在观察空性，就仍未离开能所结构；若般若不是主体的认知活动，又如何理解证悟？中观以无自性与二谛解释，唯识以二取消除与转依解释，如来藏以妄念止息、始觉合本觉解释，禅以无念无住表达——彼此参照，不应强行合并。\n\n**问题四：连「无明无体」也不可执。**若把「无明无自性」执为一个究竟命题，无体又成新立——龙树「空亦复空」（§3.2）在此把门：连解药也不可据为实法，否则以执破执、执更坚固。这也封住两个自然滑坡：从「无明无自性」滑到「万法根本不存在」，或从「第一因不可得」滑到「一切追问皆无意义」——两个方向都是对空性的滥用。〔本文判断〕\n\n> **英译对读 · 4.7/4.8 分歧与四问**\n>\n> Three genuine disagreements cut across the schools〔本文判断〕: whether ignorance is a cognitive error or a root-level not-awakening of mind-nature (early Buddhism and Madhyamaka say error; Yogācāra digs the error into the structure of consciousness; tathāgatagarbha affirms a pure, intrinsically awake mind — and must then face why the pure presents as beginninglessly defiled, which the Śrīmālā calls \"hard to understand\"); whether prajñā dismantles error or manifests an endowed wisdom (seeing emptiness without positing a wisdom-substance; transforming the basis; revealing the innate; seeing one's nature in immediate life — compatible in effect, different in theory); and whether there is a primordial luminosity at all (Madhyamaka strictly declines; some tathāgatagarbha readings affirm; Dzogchen's rigpa is neither of the two — nondual wisdom is not a \"cosmic consciousness\" all schools endorse). Four questions keep the inquiry honest: is ignorance *not-knowing* or *mis-knowing* — does it merely lack the truth, or actively build the subject-object structure that prajñā then sees through? Is prajñā innate or cultivated — and how would the innate fail to show, the cultivated reach the unconditioned? Distinguish its nature, its function, its growth, its fullness. And if prajñā transcends subject and object, *who* awakens — a subject still watching emptiness has not left duality; each tradition answers differently, and the answers are to be consulted, not merged. A fourth question guards the whole set: if \"ignorance has no substance\" is itself grasped as a final truth, substancelessness becomes a new substance — emptiness, too, is empty (§3.2); and with it two slips are sealed — from \"ignorance lacks self-nature\" to \"nothing exists,\" and from \"no first cause\" to \"no inquiry is worth anything.\"\n\n## 五、苦、受与束缚：感受为什么是真的\n\n疑情还有一层：假设生老病死只是法界的「规律」，为什么众生一定要**感受到**苦？这里要区分三件事。**第一，客观变化**：身体衰老、生命死亡、事物迁流——现象的发生过程。**第二，受**：有情生命不只是发生变化，还体验疼痛、不适、失落、恐惧——这已经是感受活动，不只是规律——受又分苦受、乐受、舍受（不苦不乐）三受，苦受只是其中一类〔大意〕。**第三，执取**：感受之上再起「为什么偏偏是我」「我不能失去它」的抗拒与自我认同，这重活动加深痛苦并造作新业。十二因缘的「觸→受→愛→取」说的正是这一层递〔大意〕。所以问题可以拆成两问：为什么生命会感受到疼痛不适？——身心和合、根境识接触，依条件生受；为什么疼痛进一步变成深层烦恼与束缚？——无明、爱、取、业等因缘持续作用。这是有结构的解释。但更深的第三问仍在：**为什么会有这样一种必须通过感受来经验世界、又会陷入无明的有情生命？**——十二因缘解释经验如何相续，不解释有情世界为何最初出现；这里佛教仍然诉诸无始缘起，没有第一因答案。〔本文判断〕\n\n《相应部》36.6 箭喻经给「受」与「束缚」划了一条关键界线〔大意〕：普通人受身苦时中两支箭——身体的痛，与忧悲恼苦的第二支；圣弟子身体仍痛，第二支不再。佛教没有承诺修行者身体永不疼痛，而是说：**苦受可以存在，但不再被错误认同、执取、放大为心理束缚**。因此「证得真如，所有苦受都不存在了」并不准确；准确的是：不二的智慧不是让一切经验消失，而是让经验不再被认定为一个独立的我与我所。\n\n还有一个必须显式拒绝的读法：**苦不是宇宙的目的**。不是为了让学生学习所以必须有苦，不是为了让众生成佛所以必须先制造无明，也不是真如需要经历迷悟才能完成自身——这些说法都偷偷引入目的论。从缘起论说，无明与苦是无始的条件相续：没有目的，没有设计者。苦**能够成为**觉悟的契机，不等于苦**原本为了**让人觉悟才存在。这两个意思完全不同。〔本文判断〕\n\n> **英译对读 · 第五节**\n>\n> Three layers must be distinguished: **objective change** (aging, death, flux); **feeling** (sentient beings do not merely change, they feel — this is already more than a \"law\"); and **grasping** (resistance and self-identification piled upon feeling, deepening pain and generating new karma). The twelve links trace this cascade: contact → feeling → craving → grasping. Two questions get structured answers: why life feels pain (conditioned contact of faculties and objects), why pain hardens into bondage (ignorance, craving, grasping, karma). The third question — why there exists sentient life that must feel and can be deluded — is not answered by the twelve links, and here Buddhism again rests on beginningless conditioning. The Arrow Sutta (SN 36.6) draws the decisive line: the untrained are struck by two arrows, bodily pain and the psychic arrow of sorrow; the noble disciple still feels the first but not the second. Awakening does not abolish bodily feeling; it abolishes the mis-taking of feeling as a bound self. And suffering is not a cosmic purpose: not made so that beings may learn, nor so that Buddhas may appear. Suffering can *become* the occasion of awakening — that is wholly different from suffering existing *in order to* awaken anyone.\n\n## 六、破幻现真：方便说之辨\n\n佛法的目的确实包括使众生觉悟、脱离无明、证得真实——但不只是递给众生一句心理安慰：「其实你们很好，只是暂时看不见。」按三种传统的表述各有一条路径：**如来藏**——众生本具佛性，修行不是从外面创造一个佛性，而是去除遮蔽、显发本有觉性；**中观**——修行是如实观察缘起性空，破除自性执着，此处的「证真」不是发现另一个永恒实体，而是彻底洞察一切法的实相；**华严**——以法界缘起的智慧洞察一切事物无尽关联，觉悟不是逃到一个只有纯净真如的地方，恰是认识到现象世界与法性不相分离。共同的要点：**破幻不是毁灭世界，也不是抛弃众生**；不是先有一个幻的世界、修行后逃离幻界进入另一个真实世界，而是不离当下缘起的世界，如实认识其无自性，不再被错误认知和执取束缚。〔本文判断〕\n\n草稿阶段的另一个直觉——绳子被误认为蛇：绳子没变成蛇，人也没离开绳子所在的空间，但恐惧、应激、逃跑都真实发生——可以用来说明「没有离开真实，不等于已经认识真实；认识错误确实造成痛苦」。这个比喻只说明认识错误的结构，不完全等同于无明（佛教还讨论认知主体、对象及其相互依待），使用时须自知其限度。〔本文判断〕\n\n梦喻同理且更深：梦中被追赶，恐惧真实；醒来找不到梦中的追赶者、受害者、事件实体，也找不到一个「从现实世界进入梦境的追赶过程」。梦喻要说明的是：**显现可以发生而不具独立自性；感受可以真实发生而不证明所执对象实有；迷妄可以相续而不需要独立的迷妄本体；觉悟不是创造另一个世界，而是如实认识原来的经验**。但梦喻有它的边界：普通梦境似乎有一个梦者，若机械搬到究竟性上，就变成「一个宇宙性的真心在做众生与世界的梦」——重新引入主体。真正的究竟性超越能所主客，不能被重建为一个宇宙梦者。就这一点说，演若达多的比喻更贴切：头从未丢失，恢复也不是重新得到一个头，而是错误认知的停止。\n\n那「是不是方便说」？**一半是，而且经论自己先说了**。《圆觉经》：「依幻說覺亦名為幻，若說有覺猶未離幻」；《楞伽经》明说如来藏之说是为「開引計我諸外道故」，令离怖畏〔大意〕。「众生本有真体」首先是**疗愈性的陈述**，对治自轻怯弱与断灭见——《涅槃经》贫女宝藏、《法华经》衣珠、《如来出现品》「经卷在微尘中」都是这个功能〔大意〕。但方便不等于虚构：其一是契理契机，所契之理不能随说随变；其二，这类陈述带着可在第一人称上检验的指向——烦恼发作时，「知道烦恼的那个知」本身并不烦恼（《楞严》以见性不动、波斯匿王观河之喻指点〔大意〕）。这是指月，不是三段论；验证靠反观，不靠辩论。至于「修好了自然明白」——大体成立，但要加一个限定：**明白的不是「答案」，而是「问题的消失」**。演若达多狂歇，不是找到了头丢失的原因，而是发现头未曾丢。这一说若不加区分会沦为万能搪塞；区分的标准是：它有没有给出独立的理由说明问题形式为何有误（§4.2 已给），同时把可答的部分答完（§4.5 已给）。禅宗把最后一步转成反观：「此『为什么』一问，由谁而起？」——追问「无明何以起」的，正是无明在运作。这不是搪塞，是自指结构被如实指出。〔本文判断〕\n\n> **英译对读 · 第六节**\n>\n> Liberation is real in all three idioms: Tathāgatagarbha uncovers what was never absent; Madhyamaka dissolves the reification that was never warranted; Huayan sees the world itself as the realm of interpenetration — awakening does not flee to a pure elsewhere, it recognizes that the phenomenal world is never separate from suchness. **Breaking illusion is not destroying the world.** The rope mistaken for a snake shows the structure: nothing changed in the rope, yet fear, flight and suffering were real — never leaving reality is not the same as knowing it. The dream shows more: appearances occur without independent substance, feelings occur without proving their objects real, delusion continues without being a substance — but the metaphor has a limit: an ordinary dream has a dreamer, and importing one would reinstall a cosmic subject; the Yajñadatta simile is safer — the head was never lost, and recovery is not regaining but the ceasing of mis-cognition. Is this all \"skillful means\"? Partly — and the texts say so themselves: \"To speak of awakening by means of illusion is also illusion.\" The tathāgatagarbha teaching is explicitly therapeutic against self-deprecation and nihilism. But skillful does not mean fictitious: the statement has a first-person testable direction (the knowing that knows affliction is not itself afflicted), and \"understanding comes after practice\" must be read precisely: what arrives is not an answer but **the dissolution of the question** — sanctioned only when independent reasons for the question's ill-formedness are given and the answerable parts are answered. Chan's final move — \"who is asking why?\" — names the reflexivity: the instrument of the question is itself the ignorance in operation.\n\n## 七、问无明者谁：「以无明问无明」与「无明只是施设」的评估\n\n本节把三个互相咬合的追问摆上台面。**甲**：追问无明的本原或「为什么出现」，是否本身就是处在无明状态的表现——严重无明处根本无法明白？**乙**：无明是否只是佛陀为「需要被破解之物」方便施设的名言——无体、不具备「可被追问」的属性，只是描述「不觉」状态的标签？**丙**：既因无明而有山河大地、森罗万象，再回头追问无明本源或因何发生，是否属于自我指涉——以无明问无明，从一开始发问就已经表明得不到答案？甲是问者的处境，乙是被问者的地位，丙是问法本身的命运。三者佛典都有可直接回源的回应：先摆经证，再逐步评估。\n\n### 7.1 经证检索：佛教自己如何对待「问不出答案的问题」\n\n第一个事实必须摆正：**「有些问题不可答」不是本文的发明，而是佛教自己的一套成熟制度**。早期经典把十四类形而上学问题列为「无记」（不作定答）〔大意〕；《中部》63 与其汉译平行《中阿含·箭喻经》（经 221，T01n0026）以中毒之箭立原则：先拔箭，不先追问射箭者。但「无记」不是敷衍：龙树《中论·观本际品》给出了论证形态——「大聖之所說，本際不可得，生死無有始，亦復無有終」「若無有始終，中當云何有？是故於此中，先後共亦無」（T30n1564）：不是拒绝回答，而是拆掉问题预设——无始无终，则立于始终之间的「中」亦无；「第一点」在缘起结构中无处安放。\n\n更直接的是《圆觉经·金刚藏章》。金刚藏问出「本來成佛，何故復有一切無明」之后，佛陀的回答下了两刀。第一刀承认**问者状态污染问题本身**：「未出輪迴而辨圓覺，彼圓覺性即同流轉；若免輪迴，無有是處。譬如動目能搖湛水……」（T17n0842）——以轮回心辨圆觉，所辨的圆觉即随之流转，如目动则见静水摇；问题在被提出时已被问者的状态加工。第二刀直接拆掉问题两端：「一切如來妙圓覺心本無菩提及與涅槃，亦無成佛及不成佛，無妄輪迴及非輪迴」——在圆觉心上，「成佛／不成佛」「轮回／非轮回」这一对问题所依赖的分别本就不立。这不是「没有答案」，而是**答案的类型不是发问者要求的那一种**。\n\n自指结构在《楞严》里有逐字的表达。卷五：「知見立知即無明本；知見無見斯即涅槃無漏真淨」（T19n0945）——在知见上再立一个能知，正是无明的根本；知见上不立知，即是涅槃。卷一又以「認賊為子，失汝元常，故受輪轉」点破无明的现行方式：把妄认当作自家主人。以此看「追问无明本原」这一问：发问所用的装备——能所、时间起点、事件感——恰是无明所铸；问「觉明何来」，就是在知见上再立知。演若达多问「我的头为何丢了」：问话本身即是狂走。此与 §4.2 的「视角不对称」、§4.6 的「谁在问」互为表里。\n\n### 7.2 评估甲：「追问无明本原是无明的表现」——成立，但要三步精确化\n\n**第一步，它对什么成立。**当追问以「无明是真实发生过的事件＋存在可定位的起点」为预设时，此问由无明的实体化活动驱动，问式本身即无明的现行（知见立知）。严重无明处，连苦的条件链都看不清，遑论自审无明——经论不否认这一点，《圆觉》甚至把它写成警告。故「处严重无明状态无法明白」在「自审无明之体」这一种问上成立。〔本文判断〕\n\n**第二步，它不能一刀切。**若凡从无明出发的问都自指无效，则四谛亦不可说、教法亦不可能——而佛教恰以「苦的条件与止息」为核心教法。实际的区分是：**机制之问可答，本体之问不立**。无明当下如何生起、靠什么维持、凭什么止息——有完整答案（《增支部》10.61 条件链、十二因缘、转依道次）；无明「最初为何存在」——问式被拆而非被答。自指论证的功能是**筛选问题**，不是取消提问。〔本文判断〕\n\n这里还要分开两个常被混同的概念：**因果循环依存**与**逻辑自我指涉**。无明与漏互为条件（MN 9；§3.1 已注其仅见于此，勿当阿含共法）是**因果反馈网络**——反馈循环不需要第一成员，打破它只需改变其中可改的条件；这不是自相矛盾，也无需「先找到链条的第一环」。而「以无明问无明」是否构成严格逻辑意义的自指悖论？**不构成**——它并不自相矛盾，其病在于预设被缘起分析拆解、且发问行为本身即无明现行。另外，「以无明状态追问无明**是什么**」连自指都谈不上：知道自己有偏见不等于已摆脱偏见，初步的自我觉察正是修行的起点——《中部》9 经恰恰要求修行者认识无明、其生起与其止息，佛教并不认为只有完全觉悟者才有资格讨论无明。〔大意＋本文判断〕\n\n**第三步，自指的出口不在答案，在转向。**注意佛陀答富楼那之问的完整形态：既给判定（「妄性如是，因何為在」——狂走之问无实答），又给转向指令（「汝但不隨分別世間、業果、眾生、三種相續」）；《圆觉》给「知幻即離，不作方便；離幻即覺，亦無漸次」；禅宗给「谁在问」的自照。「知见无见」不是再得一个更高的见，而是立知活动的止息——自指被照见的那一刻，即是它的解消。〔本文判断〕\n\n### 7.3 评估乙：「无明无体，只是施设」——半立，且须防两个滑坡\n\n「无明只是描述不觉状态的名言施设」，分系统看是一条谱系而非一个立场：\n\n| 系统 | 无明的存在地位 | 「只是施设」是否成立 |\n|---|---|---|\n| 有部／阿毗达磨 | 独立实有的心所，六根本烦恼之一 | 不成立 |\n| 唯识 | 依他起有：种子与末那俱起，缘起而有效力 | 部分成立（世俗有，非纯标签） |\n| 中观 | 世俗假名安立，缘起而有作用；胜义无自性 | 成立（假名≠虚构≠无效） |\n| 《起信》《圆觉》 | 无体而幻用：「念無自相」「非實有體」 | 成立且最彻底 |\n| 大圆满 | 无明「无根」 | 成立（术语另立：Rigpa／Marigpa） |\n\n据此，这一说法**胜义层成立、世俗层须立即补全**。三点限定〔本文判断〕。其一，**施设≠虚构**。名言施设可以指谓一个真实有效力的条件结构：无明有稳定的指谓（不如实知）、稳定的食（《增支部》10.61）、稳定的作用（能生诸染）、稳定的止息方式——把这四样都划成「纯属方便设置」，苦的结构与道次随之蒸发，即落断灭；《圆觉》恰在此设防：「以幻修幻亦復如是，諸幻雖盡不入斷滅」。其二，**无明与如来藏的施设性不对称**：如来藏可说是疗愈性施设（为离怖畏而说，《楞伽》明文），无明却站在施设的另一头——它不是为安慰而设，而是苦的结构性描述；它不是被佛陀「设置」出来供破解，而是先于教法已在运作、被教法如实指认。其三，**「不具备可追问的属性」须拆成两问**：问其体（第一因、真实生起）——无此属性，故此问不立；问其用（条件、相续、止息）——属性俱在，故此问必答且必须先答。「无明无体」若推进为「无明无事」，便与「夢時非無」相违：梦里的泪是真的。\n\n这一节还可再收紧一步：**如果无明是独立、恒常、不变的本体，它反而不可断除**——正因为它依缘而有、无自性，条件一变它即瓦解，修行才有落点。这是《中论》「以有空義故，一切法得成」应用於无明自身的结果。〔本文判断〕由此，无明本原问题的核心命题可以改写为：**不是必须先找到迷失的第一刻，才能恢复正确的认知；而是看清迷失本无独立自性，才真正有可能从迷中觉醒。**\n\n### 7.4 综合判定：丙问的命运\n\n三问合观〔本文判断〕：追问无明的本原，**作为「体问」自陷自指**——发问者以无明问无明，问处即病现，所要求的答案类型（第一因叙事）在缘起结构中不存在；**作为「用问」完全可答**——条件、相续、止息皆有可复检的答案。无明无体，故「它从何而来」不立；施设有用，故「它如何运作、如何止息」必答。而自指的照见本身即是出口：知见不立知处，问者与所问同时脱落——这是「同体模型」最深刻处，也是其最须防的滑坡（以「无修无证」饰放逸，宗密之诫）。所以「从一开始发问已经表明得不到答案」应精确为：**从一开始就表明所要求的那个答案类型不存在，而另一类答案（机制与止息，外加一个转向指令）一直可得。**问题的解消不在得到一个答案，而在问者被如实照见。\n\n整合本节与 §八的判定，可对三类原始命题逐项清算〔本文判断〕：\n\n| 命题 | 判定 | 必须补充 |\n|---|---|---|\n| 追问无明本源本身可能是无明的表现 | 部分成立 | 问「是什么／如何运作」可答且是修行对象；执取第一因之问才陷概念迷执 |\n| 无明无体、只是施设 | 胜义层成立 | 应说无自性、假名有；施设≠虚构≠无效（諸幻雖盡不入斷滅） |\n| 无明只是佛提出的方便概念 | 不够准确 | 有教法施设的一面，也有实际的缘起条件与作用（无明有食） |\n| 觉悟者与未觉悟者有维度差别 | 方向正确 | 是认知方式与证悟程度之差，非物理维度，且非单一刻度（二障异类） |\n| 修行可去无明、可证菩提 | 成立 | 须经戒定慧与实证，非知识积累；「自认更高维度」反成新我执 |\n| 因无明而有山河大地，再问无明本源属自我指涉 | 部分成立 | 不构成严格逻辑悖论；第一因预设被缘起分析拆解，机制之问仍可答 |\n| 从一开始发问就必定得不到答案 | 不成立 | 条件、相续、止息可识；不可得的是「第一因型答案」，且转向一直可得 |\n\n> **英译对读 · 第七节**\n>\n> Buddhism itself institutionalized \"unanswerable questions\": the fourteen undeclared (avyākata)〔大意〕, the arrow parable (MN 63; Chinese parallel Zhong Ahan 221, T01n0026), and — not evasion but argument — Nāgārjuna's analysis of the ultimate limit: with no beginning and no end, no middle can be established (T30n1564). The Perfect Enlightenment's Jingangzang chapter answers \"why ignorance if originally Buddha\" with two cuts: first, the questioner's state contaminates the question — \"not yet out of saṃsāra, one inquires into perfect awakening, and that perfect-awakening nature turns with the cycle\" — a stirring eye shakes the still water; second, the terms themselves dissolve — \"the wondrous perfect-awakening mind of all Tathāgatas fundamentally has neither bodhi nor nirvāṇa, neither becoming Buddha nor not becoming Buddha, neither deluded saṃsāra nor non-saṃsāra\" (T17n0842). The Śūraṅgama states the reflexive structure verbatim: \"to establish knowing within knowing is the root of ignorance; knowing without established knowing is nirvāṇa\" (T19n0945) — and \"taking the thief for one's son, losing what is constant in you\" names how ignorance operates.\n>\n> Is asking after the origin of ignorance itself an expression of ignorance? **Yes, for the substance-question**: it presupposes a real event with a locatable first point, and its very instrument — subject and object, time, eventhood — is the mis-knowing it asks about; the severely deluded cannot even see the condition-chain, which is why practice enters through given suffering, not through self-audit of ignorance. **No, as a blanket ban**: mechanism-questions (how it feeds, how it ceases) are answerable and must be answered first; self-reference filters questions, it does not silence all of them. And its exit is not an answer but a redirect: \"do not follow discrimination\" (Śūraṅgama), \"knowing the illusion is leaving it; no expedient means\" (Perfect Enlightenment), \"who is asking?\" (Chan).\n>\n> Is ignorance then a mere designation, posited to be broken? A spectrum, not a stance: a real mental factor (Sarvāstivāda); dependently real (Yogācāra); nominally real yet causally efficacious (Madhyamaka); substanceless yet functionally real (Awakening of Faith, Perfect Enlightenment); \"rootless\" (Dzogchen). Designation ≠ fiction ≠ inefficacy: ignorance has a stable referent, food, function and cessation — dissolve all four as \"mere convenience\" and the structure of suffering and the path evaporates; hence the warning \"the illusions exhausted, one does not enter extinction\" (T17n0842). The construct is asymmetric: tathāgatagarbha may be therapeutic positing (Laṅkāvatāra says so); ignorance is not posited for comfort — it operates prior to any teaching and is honestly named by it. Of its \"questionable properties\": ask about substance — none, so no first-cause question stands; ask about function — all present, so that question is answerable and mandatory. \"No answer from the start\" should therefore read: from the start, the demanded *type* of answer does not exist, while another type — mechanism, cessation, and a redirect — has always been available. What dissolves is the questioner, seen through in the act of asking.\n>\n> Three refinements from continued research〔本文判断〕. First, separate **causal feedback** from **logical self-reference**: the mutual conditioning of ignorance and taints (MN 9 — its limitation noted in §三·一) is a causal loop, and a feedback network needs no first member; asking what ignorance *is*, or how it *feeds*, from within ignorance is no paradox at all — partial awareness is possible (\"knowing one has a bias is not being free of it\"), and MN 9 itself instructs practitioners to know ignorance, its arising and its ceasing: Buddhism never requires full awakening before one may inquire. Nor is \"asking about ignorance by means of ignorance\" a strict logical paradox — it does not contradict itself; it fails only because its first-cause presupposition is dismantled and because the act of asking is ignorance in operation. Second, applied to ignorance itself, \"since emptiness obtains, everything obtains\" becomes a proof of *breakability*: a substantial, eternal ignorance could never be removed — precisely its lack of self-nature makes practice bite; hence the rewritten thesis: one need not find the first moment of being lost in order to be un-lost; seeing that being-lost never had independent nature is what makes waking possible. Third, the Śūraṅgama adds a scene the draft missed: Pūrṇa's second question — could mountains and rivers *recur* once the Buddha has attained the wondrous awakened mind? — is answered with the lost-direction simile and its verdict: \"delusion has no root… such is the case of the Tathāgatas of the ten directions: past confusion was never real, seeming awakening within it; awakening to the confusion extinguishes it, and awakening does not generate confusion\" — awakening does not relapse, because delusion never truly arose.\n\n## 八、「维度」模型评估：迷悟之差、可去之无明与可证之菩提\n\n第三种说法是现代读者常用的地图：觉悟者与非觉悟者之间存在**对真理感受的维度差别**；立「无明」之名，是为了标出阻碍维度提升之物；只要如法修行，无明可去、维度可提升、菩提可证。这一说法值得认真对待——它大体正确且经证充足，但有四处必须限定的滑坡。\n\n### 8.1 经证对应：这张地图几乎处处有落点\n\n「维度差别」的经典对应物成套：三惑、二障、五盖——「惑」「障」「盖」三字本身就是遮蔽与阻隔的意象，且分粗细层次；唯识以二障说「障」、天台以三惑分层，正是「阻隔有层」的经典版。《起信论》把觉悟写成**有阶段的显发**：不觉——相似觉——随分觉——究竟觉，「随分」即「随其分位而显」〔大意〕；天台六即与菩萨十地同此。而「同一个世界、两种经验方式」正是无明与般若的关系：動則有苦，覺則不動（T32n1666）；圣弟子身受同而心不受第二箭〔大意〕。就这些落点说，「维度」是诚实而好用的现代善巧地图。〔本文判断〕\n\n### 8.2 四重限定：滑坡在哪里\n\n**其一，「提升」实为「显发」，不是在本体上加高。**维度隐喻容易把无明想成一堵墙、把修行想成爬墙。但依 §七，无明无体，阻隔不是墙而是误认：「認賊為子，失汝元常」——不是少了一层，是认错了主人。故「提升」的准确形态是破妄显真：《楞严》说得最重——「歇即菩提，勝淨明心本周法界，不從人得」（T19n0945）：那个更高的维度本来就是周遍的，不从外得、不由造加。道元之问（「既圆满何须修」）与其答（修证一等），正是对「爬梯子」隐喻的传统校正。\n\n**其二，「无明可去、菩提可证」的担保，因系统而异。**「只要好好修行就……」的确定语气，暗含「人人皆可成佛」的普遍担保。这一担保在如来藏／佛性系统内有充分依据（真如内熏、佛性本有，《大般涅槃经》一切众生悉有佛性〔大意〕）；中观只承诺**可变**（烦恼无自性故可断），不承诺必成；唯识五种姓之说甚至撤回普遍担保。把一宗的担保当全部佛法的公理，是把地图当疆域。诚实的说法是：无明有终（各宗共许），菩提可证（如来藏系担保、中观许可能变、唯识有条件）——担保的强度是立场的函数，不是修行的自动回报。〔本文判断〕\n\n**其三，「对真理的感受」须精确。**般若不是新增的感受器官，觉悟者也不是在原维度上多了一种「真理感」。经验面的转变是真实的——第二支箭不再、动则有苦变为觉则不动——但那是**执取结构解消后的经验面**，不是感官升级。《楞严》两种根本分得最清：众生以攀缘心为自性，故真味反失；所谓「维度差」，差在认取方向，不在感受器的数量。〔本文判断〕\n\n**其四，「维度」不是单一刻度。**瑜伽行派的二障理论把障碍分成类型不同的两族——烦恼障粗显、所知障微细，断除的位次与所证的智慧各别（Charles Muller 对二障在东亚的再诠释研究〔大意〕）：智慧的提升不是一根标尺上的高度，而是不同类型认知障碍的分别消解。经证一面，《胜鬘经》说得更直白：无明住地「阿羅漢、辟支佛智所不能斷，唯如來菩提智之所能斷」（T12n0353）——二乘与佛的差别是层次之别，不是同一标尺上的高低。故说「障已分除」比说「维度更高」更准确。〔本文判断〕\n\n### 8.3 「好好修行就……」的实践条款\n\n这句话的实践内核成立，但条款要写全：无明有终、道有次第（闻思修、戒定慧、信解行证）；条件稀缺——亲近善人与听闻正法是全链条的第一环（《增支部》10.61 正向链）；「维度可提升」应作**修行地图**用，不作形而上学承诺用。如此，「菩提可证」既是精进的理由，也不至沦为要求宇宙兑现的期票。〔本文判断〕\n\n另有一层修行风险须写在明处：**自认已进入更高维度，本身可能成为新的我执**——以证自居，恰是微细所知障的现行；天台六即的「分真即」之前，一切「相似」皆须自检。〔本文判断〕\n\n> **英译对读 · 第八节**\n>\n> The \"dimensional\" map has classical anchoring everywhere: the very words for delusion — obscuration, hindrance, confusion — image blockage in graded layers (three delusions, two obstructions, five hindrances); the Awakening of Faith stages awakening as graded manifestation (similar, partial, final); the six identities and the ten grounds plot the ascent; and \"one world, two ways of experiencing\" is precisely the ignorance/prajñā relation — stirring entails suffering, awakening does not stir (T32n1666); the noble disciple takes the first arrow, not the second〔大意〕. Four limits keep the map honest. (1) \"Raising\" is really *manifesting*: ignorance is no wall but a mis-taking (\"taking the thief for his son, losing what is constant in you\"); the \"higher dimension\" is already all-pervasive — \"the supremely pure luminous mind pervades the whole dharmadhatu and is not gained from anyone\" (T19n0945) — and Dōgen's practice-awakening-as-one corrects the ladder picture. (2) The guarantee differs by system: tathāgatagarbha guarantees universal Buddhahood (inner perfuming by suchness); Madhyamaka guarantees only *changeability*; Yogācāra's five gotras withdraw the universal promise. \"Ignorance ends\" is shared; \"bodhi is certifiable for all\" is a stance, not an axiom. (3) \"Feeling truth\" needs precision: prajñā adds no sense organ; the transformed experience (no second arrow; motion without suffering) is the experiential face of a dissolved grasping structure — the dimension differs in the direction of recognition, not in the number of senses. Practice clause: the path has stages and the conditions are scarce — good persons and hearing the Dhamma are the first link; \"the dimension can rise\" is a practice map, not a metaphysical promissory note. Two refinements: the \"dimension\" is not a single scale — the two-obstructions theory plots differently *typed* barriers cleared at different depths (Muller's study〔大意〕), so \"barriers differently removed\" is more accurate than \"higher\"; and believing oneself to have \"risen a dimension\" can itself become a new self-grasping — a fine cognitive obstruction in operation.\n\n## 九、结语：无明之所以是无明，在于妄执\n\n把全文收成五个层次：**第一**，无明是根本的错误认识——不是知识不足，而是不如实知生命与诸法的真实状况。**第二**，无明会形成整个认知与生命活动的错误结构——自我认定、外境实执、能所分别、贪爱占有、习气业力与生死相续；各派对结构的解剖不同，都承认其深远。**第三**，般若不是普通知识，而是如实洞察——能解释无常无我而行为仍被执取支配，不算般若；它必须经闻思修，在实际经验中证实。**第四**，般若不是产生一个新的究竟实体，而是解除无明的错误认定——智慧不是获得一个可被占有的绝对实体，而是彻底解除对自性、能所与自我实有的执着。**第五**，究竟般若还要圆满智慧与慈悲——不是得到一个「什么都空」的结论，而是在无我、空性、不执取的基础上，无碍利益众生。\n\n三条最值得带走的判断：**无明不是单纯不知道一些佛法知识，而是没有如实认识实相，并由此形成错误的认知与执取。般若不是获得更多概念，而是直接洞察诸法真实状况，彻底解除错误执著。般若并不创造一个新的真实，而是让众生不再被无明所构成的错误认识和烦恼结构所束缚。**佛法不是让众生从一个不完美的自我变成另一个更完美的自我，而是透过智慧，认识原来执著的自我、世界和种种境界，都没有自己想象的那种独立自性；到了大乘究竟义，连般若、证悟、涅槃也不可再执为可占有的实体。\n\n修正后的图景：真如不是产生众生的「完美源头」，而是众生与一切事相的「如是」；无明无体、无始、有终；修行不是「回到」一个原先的圆满，而是发现圆满从未被损；苦是真的，它没有目的，起点不可说，但近因清楚、出口明确。回头再看那句一直悬着的直觉——「幻终究不敌真」——在对治模型里它的精确版本是支撑的不对称：与实相相应的认知可以无限修习，颠倒认知越被检验越被削弱，所以前者能彻底取代后者（法称《释量论》一系的论证〔大意〕）；在同体模型里，幻本无独立的「敌」，谈不上敌与不敌。「为何多数众生仍苦」则被各家共同改写为「转迷成悟的条件为何稀缺」：亲近善人与闻正法是一切链条的第一环——答案不在本体论，在修学论。〔本文判断〕\n\n**无明之所以是无明，在于妄执；般若之所以是般若，在于如实。**这或许是贯穿各宗派与经典、最值得把握的一条主线。\n\n> **英译对读 · 第九节**\n>\n> Five layers: ignorance is a fundamental mis-knowing; it structures whole patterns of life; prajñā is insight, not information — demonstrable in conduct, not in exposition; prajñā creates no new ultimate entity but dissolves mis-taking; and complete prajñā matures into compassion and skillful means. The corrected picture: suchness is not a perfect producer but the \"thusness\" of beings and things; ignorance is substanceless, beginningless, and terminal; practice does not return to a lost perfection but discovers perfection never damaged; suffering is real, purposeless, with an unlocatable origin and a clear exit. \"Illusion never defeats truth\" means, in the antidote model, that what accords with reality can be cultivated without limit while delusion weakens under scrutiny; in the identity model, illusion never was an independent \"enemy.\" And \"why do most beings still suffer?\" is rewritten by every tradition as: the conditions of transformation are scarce — the answer belongs to the pedagogy of the path, not to ontology. **Ignorance is ignorance because it grasps; prajñā is prajñā because it knows as things are.**\n\n## 附录 A｜研读次第建议\n\n最有价值的比较路径，是先把《阿含经》的无明与慧弄清楚，再入中观般若空性，随后比较唯识的能所二取，最后到如来藏的本觉不觉——各宗究竟在哪些问题上互补、在哪些问题上真分歧，会逐渐看清。不建议同时遍学一切宗派。\n\n另一条入口是按功能分六组读〔大意〕：①《阿含经》与十二因缘——无明在生命、感受、执取与轮回中的实际作用；②《金刚经》与《心经》——般若如何破我执、法执、能所执与对智慧本身的执；③《中论》与《大智度论》——缘起性空、中道与菩萨般若；④《解深密经》与《瑜伽师地论》——八识、三性、二障、转依；⑤《大乘起信论》《胜鬘经》与《楞伽经》——本觉、不觉、如来藏及其甚深疑难；⑥《华严经》《楞严经》《圆觉经》——法界缘起、妙明真心、妄无所依与无生智慧。\n\n| 次序 | 经典或论书 | 主要学习内容 |\n|---|---|---|\n| 1 | 《杂阿含经》256–266 经一带；SN 12／36.6 | 无明与明、五蕴如实知、十二因缘、两支箭 |\n| 2 | 《大般若经》《心经》《金刚经》 | 般若、空性、无所得、无住 |\n| 3 | 龙树《中论》（观本际、观四谛品）《大智度论》 | 缘起性空、中道、本际不可得 |\n| 4 | 《解深密经》《瑜伽师地论》《成唯识论》 | 三性、八识、二障、转依 |\n| 5 | 《胜鬘经》《楞伽经》《大乘起信论》 | 如来藏、自性清净心、本觉不觉、心初起不可得 |\n| 6 | 《法华经》《摩诃止观》 | 天台三惑三观三智、性具 |\n| 7 | 《华严经》（梵行品、如来出现品）《金师子章》 | 法界缘起、四法界、初发心即菩提 |\n| 8 | 《六祖坛经》 | 自性般若、无念无相无住 |\n| 9 | 《宝性论》《入中论》 | 佛性论证与菩萨般若道 |\n| 10 | 《菩提道次第广论》及大圆满相关论典 | 藏传中观、二障、明觉 |\n\n## 附录 B｜引文回源登记\n\n**方法**：从 CBETA 官方 GitHub（cbeta-org/xml-p5）下载 TEI/XML 原文，已按仓库惯例存入 `data/references/cbeta/`（canonical 库，14 部新增，sha256 见该目录 `INGEST_log.md` §L.505；仓内另有 `T02n0099`/`T01n0026`/`T10n0279`）；剥标签剥标点后逐字子串匹配，命中共 **137 条／18 部经论，全绿**（核验器逐条可复算）。核验脚本与输出：`workspace/wuming_prajna_quotes/verify_quotes.py`、`verify_out.txt`。**访问日期：2026-11-17/18。**\n\n| 经论 | CBETA 号 | 本文引用要点 |\n|---|---|---|\n| 大乘起信论（真谛译） | T32n1666 | 一心二门、三大、依如来藏故有生灭心、不觉义、本觉定义（心体离念）、迷方喻、三细、六粗六名、大海水喻、忽然念起、唯佛能知、无明灭智性不坏 |\n| 大乘起信论（实叉难陀译） | T32n1667 | 心初起者但随俗说、众生等有真如而无明厚薄、无始恒有无明 |\n| 圆觉经 | T17n0842 | 金刚藏问、文殊章无明段、无生处故、以幻修幻、依幻说觉、金矿喻、知幻即离离幻即觉、诸幻虽尽不入断灭、未出轮回而辨圆觉、本无菩提及与涅槃 |\n| 大佛顶首楞严经 | T19n0945 | 两种根本、富楼那两问（含「如来今得妙空明觉，山河大地何当复生」）、性觉必明、觉明为咎、演若达多、识迷无因、迷本无根（富楼那语）、悟非生迷、此迷无本性毕竟空、觉迷迷灭觉不生迷、三种颠倒相续从妄见生、待花更生、知见立知即无明本、知见无见斯即涅槃、认贼为子、歇即菩提 |\n| 胜鬘师子吼经 | T12n0353 | 烦恼不触心、自性清净心而有染难可了知、生死者依如来藏、若无如来藏不得厌苦乐求涅槃、四住地名、无明住地（心不相应无始）、阿罗汉辟支佛智所不能断、唯如来菩提智之所能断 |\n| 楞伽阿跋多罗宝经（四卷） | T16n0670 | 生死本际不可知、若识则灭、开引计我外道、当依无我如来之藏、如来藏识藏 |\n| 般若波罗 // ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);
