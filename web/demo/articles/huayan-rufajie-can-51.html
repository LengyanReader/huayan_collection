<script>
var ARTICLE = {"id": "huayan-rufajie-can-51", "file": "articles/huayan-rufajie-can-51.html", "title": "入法界品 · 参51·德生·有德", "title_sub": "童子童女｜妙意華門城｜幻住解脫 ｜ 11,801 CJK · 六层：数据卡/主页照录/三译四件套/古注取窗疏论/EN/指针", "title_en": null, "icon": "🧭", "version": "v1.0", "meta": "", "doc": "", "doc_md": "# 参51·德生童子·有德童女 —— 入法界品·五十三参子页\n\n> **体例与来源**：底本四十华严 `T10n0293`（般若译·善财历参）；对读八十 `T10n0279`、六十 `T09n0278`（引文各照底本）。本页由程序汇编（L.491）：§一 照录自主页《华严经细读·第三十九部》§参51 全文（参题解·要点·阐释·对照启发·三译深释表·经文全引——人工核订内容·原样保留，含其中〔本文判断〕〔待核〕标注）；§二 自四件套语料库（L.421/L.456）程序汇编；数据卡自行历图数据（L.407/L.413/L.415）。**阐释性文字之性质以原文标注为准；本页不新增判断。**\n\n> ← [参50·最寂靜](huayan-rufajie-can-50.html) ｜ 📘 [子页总目](huayan-rufajie-can-index.html) ｜ 🗺 [行历图](huayan-rufajie-journey.html) ｜ 📄 [主页 §参51](huayan-rufajie-pin.html) ｜ [参52·彌勒 →](huayan-rufajie-can-52.html)\n> **古注取窗（L.493→L.527 五源）**：§三 收澄观《华严经疏》（`T1735`）·澄观《随疏演义钞》（`T1736`·末会多总谈·部分参为类聚引）·李通玄《新华严经论》（`T1739`）·法藏《探玄记》（`T1733`·残存）·道霈《華嚴經疏論纂要》（`B0002`·L.527 五源扩）逐参节引（程序取窗·单调锚定·句界截断·页码留痕）。程序抽取本字准待校，引前须对 CBETA 原书核。\n\n## 〇、本参数据卡（程序汇编·L.491）\n\n| 项 | 值 |\n|---|---|\n| 参号 | 第51参（54 卡号系·L.327/L.407 重排）｜第51参（经文层计数）\n| 善知识·四十 | **德生·有德**（`T10n0293`）\n| ·八十 | 德生·有德（`T10n0279`）\n| ·六十 | 德生·有德（`T09n0278`）\n| 三译名判 | 全同\n| 身份 | 童子童女\n| 处所 | 妙意華門城\n| 法门自陈（「我唯得/知此」） | 幻住解脫\n| 本参经文 | 11,801 CJK（T0293 span 236,738–250,656）\n| 前参 | 参50·最寂靜（法门：誠願語解脫）\n| 后参 | 参52·彌勒（法门：（法门即楼阁·周遍觀察））\n\n## 一、主页参节全文（照录·零删改）\n\n> 🧭 **本参子页·深度解读 ↗** [参51·数据卡·主页参节照录·三译四件套·延伸指针](huayan-rufajie-can-51.html)\n\n**参题解**：妙意華門城·德生童子、有德童女——**童子童女双师同参**（一对善知识共同答问，全品仅此）。法门：**幻住解脫**（「我等證得菩薩解脫，名為幻住」实测）。本参末段已入毘盧遮那莊嚴藏大樓閣（参界至善财楼阁五体投地处——楼阁段随批15彌勒章连读）。\n\n**【要点提炼】**\n\n1. **九种幻住**：「見一切**世界**皆幻住，因緣所生故；一切**眾生**皆幻住，業煩惱所起故；一切**世間**皆幻住，無明有愛展轉緣生故；一切**諸法**皆幻住，我見等種種幻緣所生故；一切**三世**皆幻住，顛倒智所生故；**生老病死憂悲苦惱**皆幻住，本無今有虛假不實故；一切**剎土**皆幻住，想心見倒所生故；一切**聲聞辟支佛**皆幻住，智斷分別所成故；一切**菩薩**皆幻住，行願法相續現前故」——幻住九叠，各自给出「幻因」。\n2. **幻住非断灭**：菩萨亦幻住——「能自調伏，成熟眾生，諸行願法，相續現前」：幻中有行愿相续，**正因是幻，行愿才相续无碍**。\n3. **双师同座**：童子主幻观、童女主德行（名德生·有德），一参双证。\n\n**【阐释】**（〔本文判断〕）参50是全品义理的**收束前奏**：参41瞿波的双遣问在此得到体系化回答——「幻住」把空性与缘起合成一张地图：世界到菩萨九层皆是幻，而幻之「住」正是行愿的住处；若法不幻则行愿不可相续，若幻而无住则堕断灭。「德生」之名（德行之生）与「幻住」合读：**德从幻生，愿向幻住**。此参后善财直抵弥勒楼阁——幻住之法，正堪入那扇「一即一切」的门。\n\n**【对照/启发】**：与〈十忍品〉七喻对读——忍观其幻，幻住其住。启发：九种幻住逐一问「我住其中哪几层而不自知？」——认出幻因，是住幻而不迷的开始。\n\n**60/40 深释·参51（六十德生·有德／四十德生·有德）**\n\n| 件 | 六十 | 四十 | 同构 |\n|---|---|---|---|\n| 到会 | 漸次南行，至於彼城，見童子、童女，頂禮其足 | 漸次南行，詣妙意華門城，見德生童子、有德童女，頂禮其足，遶無… | 5/14 |\n| 法门 | — | — | — |\n| 指授 | 汝詣彼問云何菩薩學菩薩行、修菩薩道 | 汝詣彼問菩薩云何學菩薩行，修菩薩道 | 9/14 |\n| 辞退 | — | 禮婆羅門足，遶無數匝，慇懃瞻仰，一心戀慕，辭退 | — |\n\n判：师名〔义译异〕·门名〔全同〕。\n\n**三译对读（L.415·据 §批七/批八 总表）**\n\n| 译 | 师名 | 门名 |\n|---|---|---|\n| 八十 | 德生·有德 | 幻住 |\n| 六十 | 德生·有德 | 幻住 |\n| 四十 | 德生·有德 | 幻住解脫 |\n\n判：师名〔全同〕·门名〔全同〕。 德生·有德双参；门名「幻住」**三译全同**——仅有的三次全同之三。\n\n**本参经文全引**（T0293·11,801 CJK·0 手抄）：\n\n> 見德生童子、有德童女，頂禮其足，遶無數匝，於前合掌。白言：「聖者！我已先發阿耨多羅三藐三菩提心，而未知菩薩云何學菩薩行、云何修菩薩道，我聞聖者，善能誘誨，唯願慈哀為我宣說。」時，童子、童女告善財言：「善男子！我等證得菩薩解脫，名為幻住。\n>\n> 得此解脫，具足圓滿，以斯淨智，遍觀諸法，無非幻住，幻所成就。所謂：見一切世界皆幻住，因緣所生故；見一切眾生皆幻住，業煩惱所起故；見一切世間皆幻住，無明有愛等展轉緣生故；見一切諸法皆幻住，我見等種種幻緣所生故；見一切三世皆幻住，我見等顛倒智所生故；\n>\n> 見一切眾生生、老、病、死、憂、悲、苦、惱皆幻住，本無今有，虛假不實，妄想分別所生故；見一切剎土皆幻住，想心見倒，無明所生故；見一切聲聞辟支佛皆幻住，智斷分別所成故；見一切菩薩皆幻住，能自調伏，成熟眾生，諸行願法，相續現前之所成故；\n>\n> 見一切諸佛及諸菩薩眾會，變化神通威力，諸所施為，皆幻住，種種解行，廣大願智，熏習所成故。善男子！幻境自性不可思議，我等二人，但能知此幻住解脫，如諸菩薩摩訶薩，善入無邊諸幻事網，隨順了知幻所成智，彼功德行，而我云何能知、能說？\n>\n> 」時，德生童子、有德童女，說自解脫已，以不思議諸善根力，令善財身速疾增長，柔軟光澤，告善財言：「善男子！於此南方近海門處，有一國土名為沃田；彼國有園，名大莊嚴，其中有一廣大樓閣，名毘盧遮那莊嚴藏。從菩薩種種善根果報生，從菩薩種種念力、願力、自在力、神通力生，從菩薩種種善巧方便生，從菩薩種種福德智慧生。\n>\n> 善男子！住不思議解脫菩薩，以大悲心，為諸眾生普遍顯現如是境界，廣大集起如是莊嚴。彌勒菩薩摩訶薩安止其中，為欲攝受本所生處，父母親屬及諸人眾，令成熟故；又欲令彼同受生，同修行，同類眾生，於大乘中得堅固故；又欲令彼一切眾生，隨所住地，隨本善根，皆成熟故；\n>\n> 又欲為汝顯示菩薩解脫門故；顯示菩薩遍一切處，隨本願力受生自在故；顯示菩薩以種種身，普現一切眾生之前，開示覺悟，常教化故；顯示菩薩以大悲力，普攝一切世間資財，惠施眾生而不厭故；顯示菩薩具修諸行，知一切行離諸相故；顯示菩薩處處受生，了一切生皆無相故。\n>\n> 汝詣彼問菩薩云何行菩薩行、云何修菩薩道、云何學菩薩戒、云何淨菩薩心、云何發菩薩願、云何集菩薩助道具、云何入菩薩自在地、云何滿菩薩波羅蜜、云何獲菩薩無生忍、云何具菩薩功德法、云何事菩薩善知識？何以故？善男子！彼菩薩摩訶薩，深入一切菩薩行願，隨順一切眾生心性，遍一切處常現其前，教化調伏彼菩薩已，滿一切波羅蜜已，住一切菩薩地已，證一切菩薩忍已，入一切菩薩位已，蒙授與具足記已，遊一切菩薩境已，入菩薩解脫門已，得一切佛神力已，蒙十方一切如來，以一切智甘露法水而灌其頂。\n>\n> 「善男子！彼善知識，能潤澤汝諸善根，能增長汝菩提心，能堅固汝廣大志，能發起汝一切善，能增長汝菩薩根，能示教汝無礙法，能令汝入普賢地，能令汝住菩薩願，能令汝行普賢行，能為汝說一切菩薩無量行願所成功德，令汝顯示普賢菩薩自在法門。\n>\n> 善男子！汝今不應修一善根，照一法門，發一大願，受一記別，住於一忍，生究竟想；不應以限量心，行於最勝諸波羅蜜；不應以限量心，住於菩薩圓滿十地；不應以限量心，嚴淨一切諸佛國土；不應以限量心，承事供養諸善知識。何以故？善男子！\n>\n> 菩薩摩訶薩，應種無量諸善根，應集無量助道具，應修無量菩提因，應學無量巧迴向，應化無量眾生界，應照無量眾生心，應知無量眾生根，應識無量眾生解，應覺悟無量眾生，應調伏無量眾生，應斷無量煩惱，應淨無量業習，應滅無量邪見，應除無量雜染心，應發無量清淨心，應拔無量苦毒箭，應涸無量愛欲海，應破無量無明闇，應摧無量我慢山，應解無量生死縛，應度無量諸有流，應竭無量受生海，\n> 應令無量眾生出五欲淤泥，應使無量眾生，離三界牢獄，應置無量眾生於聖道中，應銷無量貪欲行，應滅無量瞋恚行，\n> 應摧無量愚癡行，應破無量魔羂網，應捨無量魔事業，應淨菩薩無量心樂欲，應長菩薩無量巧方便，應生菩薩無量增上根，應起菩薩無量決定解，應悟菩薩無量平等體，應淨菩薩無量勝功德，應治菩薩無量諸行海，應滿菩薩無量清淨行，應現菩薩無量世間行，應順菩薩無量方便行，應生無量淨信力，應住無量精進力，應淨無量正念力，應滿無量三昧力，應起無量淨慧力，應堅無量勝解力，\n> 應集無量福德力，應增無量智慧力，應發無量菩薩力，應滿無量如來力，應分別無量法門，應深入無量法門，應清淨無量法門，\n> 應生無量法光明，應作無量法照耀，應照無量品類根，應知無量煩惱病，應集無量妙法藥，應療無量眾生疾，應辨無量甘露供，應往無量佛國土，應供無量諸如來，應入無量菩薩會，應受無量如來教，應忍無量眾生惱，應令無量眾生離惡趣，應與無量眾生勝安樂，應以四攝攝無量眾生，應入無量總持門，應生無量大願門，應修無量慈悲力，應求無量諸佛法，應起無量思惟力，應起無量神通事，\n> 應淨無量智光明，應往無量眾生趣，應受無量諸有生，應現無量差別身，應受無量諸苦惱，應順無量凡夫法，應知無量眾生苦，\n> 應說無量諸佛法，應捨無量內外財，應施無量福田境，應護無量諸善根，應近無量善知識，應調無量自種族，應修無量佛法，應說無量佛法，應讚無量持戒，應覺無量破戒，應迴向無量善巧法，應了知無量夢幻法，應令無量眾生住清淨戒，應與無量眾生金剛定，應令無量眾生捨有見，應令無量眾生速離三界，應令無量眾生觀無我，應令無量眾生悟三乘，應入無量差別心，應思菩薩大境界，\n> 應住菩薩大宮殿，應觀菩薩甚深法，應知菩薩難知境，應行菩薩難行行，應嚴菩薩尊重德，應踐菩薩難入位，應知菩薩種種行，\n> 應現菩薩普遍神力，應受菩薩平等法雲，應廣菩薩無邊行網，應滿菩薩無邊諸度，應授菩薩無量記別，應入菩薩無量忍門，應具菩薩無量智通，應入菩薩無量諸因緣，應示菩薩無量難解法，應顯菩薩無量所作業，應斷菩薩無量三毒苦，應盡菩薩無量惑根本，應淨無量菩薩地，應說無量諸法門，應淨無量諸佛剎，應擐無量菩薩甲冑，應承事無量如來，應發不思議菩薩願，應修不思議菩薩行，\n> 應受不思議菩薩教，應知不思議菩薩順煩惱行，應知不思議菩薩離煩惱行，應淨不思議菩薩有為過，應知不思議菩薩稱讚涅槃甚深利益，\n> 應知不思議如來功德。\n>\n> 如是不思議如來讚歎，不思議如來名稱，不思議涅槃名稱，不思議種種世法，不思議除滅世法，不思議妙行，不思議語言，不思議雜煩惱行，不思議滅煩惱行，不思議妙行金剛句，不思議語言金剛句，不思議雜煩惱金剛句，不思議滅煩惱金剛句，不思議妙行祕密句，不思議語言祕密句，不思議雜煩惱祕密句，不思議滅煩惱祕密句，如是一切悉應修學。\n>\n> 善男子！舉要言之，應普修一切菩薩行，了法平等故；應普化一切眾生界，善巧調伏故；應普入一切無邊劫，願力廣大故；應普生一切諸有趣，示現受生故；應普知一切三世智，隨順覺悟故；應普行一切諸佛法，究竟體同故；應普淨一切諸佛剎，平等莊嚴故；\n>\n> 應普滿一切菩薩願，圓滿一體故；應普供一切諸如來，勝願現前故；應普同一切菩薩願，一性平等故；應普事一切善知識，志求種種諸菩薩行，為令彼心生歡喜故。大方廣佛華嚴經卷\n>\n> 第三十二大方廣佛華嚴經大方廣佛華嚴經卷\n>\n> 第三十三罽賓國三藏般若奉詔譯入不思議解脫境界普賢行願品「\n>\n> 復次，善男子！汝因此故求善知識，勿於身心而生疲倦；見善知識，勿生厭足；請問善知識，勿憚勞苦；親近善知識，勿懷退轉；供養善知識，無令間斷；隨順善知識教誨，不應違逆；於善知識所有功德，不應疑惑；聞善知識演說出離門，應生決定；\n>\n> 見善知識隨順煩惱行，勿生嫌怪；於善知識所生深信心，不應變改。何以故？善男子！菩薩因善知識聞一切菩薩行；因善知識，成就一切菩薩功德；因善知識，出生一切菩薩大願；因善知識，引發一切菩薩善根；因善知識，積集一切菩薩助道法；因善知識，開發一切菩薩法光明；\n>\n> 因善知識，成就一切菩薩出離門；因善知識，修學一切菩薩清淨戒；因善知識，安住一切菩薩功德法；因善知識，清淨一切菩薩自性心；因善知識，發明一切菩薩堅固志；因善知識，具足一切菩薩陀羅尼辯才門；因善知識，能生一切菩薩清淨藏；因善知識，出現一切菩薩智光明；\n>\n> 因善知識，獲得一切菩薩增上願；因善知識，得與一切菩薩同一願；因善知識，聽聞一切菩薩殊勝法；因善知識，得到一切菩薩祕密處；因善知識，得至一切菩薩法寶洲；因善知識，得增一切菩薩善根芽；因善知識，增廣一切菩薩智慧海；因善知識，守護一切菩薩深密藏；\n>\n> 因善知識，任持一切菩薩福德聚；因善知識，清淨一切菩薩受生道；因善知識，領受一切菩薩正法雲；因善知識，遊入一切菩薩出世道；因善知識，發起一切菩薩大歡喜；因善知識，獲得一切如來菩提果；因善知識，攝取一切菩薩妙行；因善知識，開敷一切菩薩功德；\n>\n> 因善知識，往一切方聽受妙法；因善知識，演說一切菩薩心；因善知識，成就一切菩薩大慈力；因善知識，出生一切菩薩大悲力；因善知識，攝持一切菩薩自在力；因善知識，出生一切菩薩菩提分；因善知識，能作一切菩薩利益事。「善男子！一切菩薩由善知識任持，不墮惡趣；\n>\n> 由善知識成就，自在受生；由善知識顯示，得宿住智；由善知識開發，知一切劫；由善知識攝受，不退大乘；由善知識觀察，不毀犯菩薩戒；由善知識守護，不隨逐惡知識；由善知識養育，不退失菩薩法；由善知識攝取，超越凡夫地；由善知識教誨，不入二乘地；\n>\n> 由善知識引發，得出離世間；由善知識覆護，能不染世法；由善知識撫育，修一切菩薩行，心不散亂；由善知識發起辨一切助道具，心不退屈；由善知識勢力，不為業惑之所碎壞；由善知識任持，不為諸魔之所恐怖；由善知識被忍辱甲，能受一切惡言毀辱；\n>\n> 由善知識安慰，於世苦樂，心無憂喜；由善知識生長，能滅諸憍慢，常愛樂法；由善知識守護，能令菩薩淨戒圓滿；由善知識威力，能了諸法，心無所得；由善知識安慰，能於三界心無恐怖；由善知識教示，能知善巧，出三界道；由善知識勸修，信甚深法，心無厭足；\n>\n> 由善知識教導，不為名利、憍慢逼迫；由善知識演說，得宿住智，知過去因；由善知識加持，於未來際，而得善巧；由善知識能生，得善巧智，知三世等；由善知識攝受，能轉眾生依正業報；由善知識普守護，能內懷慚愧，具足眾善；由善知識隨順力，能和顏軟語，引導眾生；\n>\n> 由善知識修行力，能離一切斷、常諸見；由善知識隨順守護，能遠離利、衰、毀、譽等法；由善知識顯示不說己能讚他功德；由善知識巧示能勤修習菩提分法；由善知識決擇能演契經甚深理趣；由善知識勸修能愛樂成就頭陀功德；由善知識先導於諸空法而得善巧。\n>\n> 「善男子！由依止承事善知識故，能增長一切菩薩摩訶薩無量無邊菩提分法。何以故？善男子！善知識者，能清淨諸惡法，能退捨諸蓋、纏障，能散滅無明黑暗雲，能解散一切諸見縛，能引出生死大苦城，能捨離決定住著處，能裂壞一切惡魔網，能拔除一切苦毒箭，能出離無明深林，能超過邪見曠野，能越度諸有瀑流，能拔出愛欲淤泥，能不入諸邪惡道，能顯示菩提路，能令安住不放逸，能引至修行處，能清淨一切智性道，能令增長智慧眼，能令長養菩提心，能令發起大悲意，能說一切菩薩行，\n> 能誨示一切波羅蜜，能安置一切菩薩地，能令獲得諸忍門，能出生一切諸善根，能成辨一切助道具，能施與一切大功德，\n> 能令普到一切如來所能顯示一切功德法，能勸修一切勝利益，能策勵一切所修道，能顯示永出生死門，能杜絕一切諸邪徑，能令趣入真實道，能以法光普照耀，能以法雨普潤澤；\n>\n> 能令尊重師長，離諸嬾惰；能令入白淨法，心無厭足。「善男子！善知識者，如軌範師，能以善語而誨示故；善知識者，猶如伴侶，住阿蘭若，不捨離故；善知識者，如勝神通，能現種種諸自在故；善知識者，如金剛劍，能截煩惱及隨眠故；善知識者，如親教師，能為懺除五犯罪故；\n>\n> 善知識者，如勝靜慮，能滅一切隨煩惱故；善知識者，如摩尼鏡，令現前證宿住智故；善知識者，猶如橋梁，能令超度諸有流故；善知識者，能斷疑網，業異熟中，善決斷故；善知識者，能善安處，令速入於不退地故；善知識者，能令深信微細業果，如自見故；\n>\n> 善知識者，善能勸修，毀呰一切不善法故；善知識者，是智慧眼，一切法中不執著故；善知識者，心如明燈，順本覺性而覺了故；善知識者，如說道者，為大丈夫處會說故；善知識者，能捨惡友，不入惡人之住處故；善知識者，捨不律儀，能令增長善律儀故；\n>\n> 善知識者，能教時語，隨眾生根而發言故；善知識者，勸隨順修，令捨衣食，攝眾生故；善知識者，為先導師，令如所說而修行故；善知識者，令其深入，等持、等至皆深入故；善知識者，猶如良醫，能於飲食知節量故；善知識者，如瑜伽師，能令趣入相應行故；\n>\n> 善知識者，能為顯示，令見菩薩勝境界故；善知識者，能為覺悟，令於諸法覺本性故；善知識者，能為安慰，令諸眾生無憂惱故；善知識者，猶如羂索，能攝眾生入佛智故；善知識者，如得王印，於一切法無障礙故；善知識者，為能引發，令諸眾生趣種智故；\n>\n> 善知識者，為法園苑，是諸菩薩愛樂處故；善知識者，如威猛將，摧伏一切諸魔軍故；善知識者，為大明呪，能除一切諸苦厄故；善知識者，猶如大船，超過生死至彼岸故；善知識者，如如意珠，能令所願皆圓滿故；善知識者，能為救護，於諸惡道救眾生故；\n>\n> 善知識者，為先導相，修佛十八不共法故；善知識者，如莊嚴具，莊嚴一切淨法身故；善知識者，如妙瓔珞，莊嚴發心諸佛子故；善知識者，猶如長子，能紹佛種使不斷故；善知識者，如賢德瓶，圓滿諸佛智功德故；善知識者，如淨摩尼，能清一切垢濁心故；\n>\n> 善知識者，如清淨戒，能令三業皆清淨故；善知識者，猶如關鑰，能開一切解脫門故；善知識者，猶如大路，行佛智行所行處故；善知識者，是佛境界，非諸二乘境界地故；善知識者，如正智教，非是三乘所知境故；善知識者，如等流果，從諸種智同類生故；\n>\n> 善知識者，如明淨眼，能示眾生夷險道故；善知識者，如陀羅尼，能持修學諸眾生故；善知識者，為能發起，發起一切智慧明故；善知識者，為能斷滅，斷滅一切無明闇故；善知識者，如最勝藥，能除眾生諸惑病故；善知識者，如無盡藏，充滿眾生種種願故；\n>\n> 善知識者，如善方便、善巧，證得諸佛地故；善知識者，猶如門戶，少欲知足，所行道故；善知識者，如能作業，能令勤修清淨業故；善知識者，如說道者，遠離險難諸因緣故；善知識者，猶如止觀，息滅一切渴愛法故；善知識者，為說慧者，令入甚深無生義故；\n>\n> 善知識者，能為照明，令見因果不失壞故；善知識者，如閑靜地，能靜其心，修習道故；善知識者，為示道者，引詣如來集會所故；善知識者，猶如日月，能為照明甚深法故；善知識者，如軌範師，能為分別微細智故；善知識者，為能覺悟，令悟諸法如夢幻故；\n>\n> 善知識者，為勝儀範，隨順眾生，常護他故；善知識者，能知世智，去來語默，心無亂故；善知識者，厭不善心，性自覺悟，遠愚迷故；善知識者，承奉尊長，無我、無人及嬾惰故；善知識者，銷滅諸惑，觀自他身不可得故；善知識者，具覺悟智，隨順覺知世、出世故；\n>\n> 善知識者，離無益事，能令自他超諸有故；善知識者，為真實智，普知一切生滅體故；善知識者，無得無憂，觀察過去自業體故；善知識者，住頭陀行，以菩薩法常洗滌故；善知識者，得義無礙，覺悟差別真實體故；善知識者，不求讚美，不顯己德，益尊敬故；\n>\n> 善知識者，具妙忍智，於自業果深覺悟故；善知識者，遠離在家，不以利養而親近故；善知識者，住遠離行，捨無義語，近真實故；善知識者，修行正境，常勤修習四念住故；善知識者，善巧問答，於諸問答無不知故；善知識者，能摧異論，善能安立，摧邪見故；\n>\n> 善知識者，不厭貧窮，於彼能生慈愍心故；善知識者，能為法攝，真實法中令深入故；善知識者，能以財攝，令諸眾生修善行故；善知識者，常修知足，厭離守護諸過失故；善知識者，讚歎淨戒，於諸種種甚深戒果，能體解故；善知識者，訶責破戒，謂於種種破戒過失，深覺悟故；\n>\n> 善知識者，能具足戒，謂無諂誑如理受持，正念知故；善知識者，能善觀察，於善、不善一切法中勤請問故；善知識者，能為先導，勸諸眾生，於佛菩提令勤修故；善知識者，住不退轉，捨四顛倒，知倒性故；善知識者，住真實相，普知諸法皆無相故；\n>\n> 善知識者，住真實解，謂知識滅、名色等法皆不生故；善知識者，得無所畏，謂覺諸佛甚深法門體相用故；善知識者，淨戒住處，謂於菩薩戒身、戒相智普知故；善知識者，深入定門，謂離欲泥，住三昧故；善知識者，心無垢濁，謂離蓋、纏，住淨心故；\n>\n> 善知識者，得諸總持，謂如實演說，心無著故；善知識者，知甚深門，謂能普入法本性故；善知識者，信心住處，住諸善法根本處故；善知識者，住寂靜教，謂普除滅諸渴愛故；善知識者，住正直道，謂能普知苦、無我故；善知識者，住菩薩地，謂於十地普了知故；\n>\n> 善知識者，是智慧地，謂於諸法無迷惑故；善知識者，是諸佛地，謂能出生菩薩法故；善知識者，住真實道，一切二乘不能知故；善知識者，得無盡辯，能說如實知見體故；善知識者，善離憂惱，知生死苦本無我故；善知識者，非文字境，知語言道不可得故；\n>\n> 善知識者，住無生法，謂知識性不可得故；善知識者，是能寂靜，謂能除滅諸煩惱故；善知識者，能滅邪見，謂能安住正見中故。「\n>\n> 復次，善男子！善知識者，猶如慈母，出生一切佛種性故；善知識者，猶如嚴父，廣大利益親付囑故；善知識者，猶如乳母，守護不令作惡法故；善知識者，猶如教師，示諸菩薩所應學故；善知識者，猶如善導，能示甚深波羅蜜故；善知識者，猶如良醫，能治種種煩惱病故；\n>\n> 善知識者，猶如雪山，增長一切種智藥故；善知識者，猶如勇將，殄除一切諸恐怖故；善知識者，猶如船師，令度生死大瀑流故；善知識者，猶如商主，令到一切智寶洲故。善男子！汝今若能如是作意，正念思惟，當得親近諸善知識。\n>\n> 復次，善男子！汝承事一切善知識，應發如大地心，平等荷負無疲倦故；汝應於善知識發如金剛心，平等志願不可壞故；汝應於善知識起如鐵圍山心，一切諸苦無能動故；汝應於善知識起給侍心，所有教令皆隨順故；汝應於善知識起弟子心，所有訓誨無違逆故；\n>\n> 汝應於善知識發如僮僕心，不厭一切諸作務故；汝應於善知識起如大火心，焚燒一切諸煩惱故；汝應於善知識生如傭作人心，隨所教命無違逆故；汝應於善知識生除糞人心，捨離一切憍慢心故；汝應於善知識起如大水心，洗除一切煩惱垢故；汝應於善知識發如大風心，摧壞眾生我慢山故；\n>\n> 汝應於善知識發如虛空心，於五欲境無障礙故；汝應於善知識發如巨海心，諸功德寶皆圓滿故；汝應於善知識發如滿月心，令滿清涼白淨法故；汝應於善知識發如師子心，遊行住處，搏噬諸魔惡禽獸故；汝應於善知識發如良馬心，隨人到處，遠離惡性故；\n>\n> 汝應於善知識發如牛王心，利益眾生無厭倦故；汝應於善知識發如沙門心，正命自居，離邪諂故；汝應於善知識發如蓮華心，戒慧清淨，不染欲泥故；汝應於善知識發如商主心，引導令至佛智城故；汝應於善知識發如大車心，運載重擔，忘恩報故；汝應於善知識發如調順象心，恒事伏從，無卒暴故；\n>\n> 汝應於善知識發如山王心，任持一切，無傾動故；汝應於善知識發如良犬心，常於本主，無瞋害故；汝應於善知識發如旃荼羅心，常自輕賤，無人我故；汝應於善知識發如犗牛心，恒思順行，無威怒故；汝應於善知識發近住心，隨順師長，常尊重故；\n>\n> 汝應於善知識發如舟船心，運度往來，無疲倦故；汝應於善知識發如橋梁心，濟度眾生，到彼岸故；汝應於善知識發如孝子心，承事供養，順顏色故；汝應於善知識發如王子心，遵王教令，無違犯故。「\n>\n> 復次，善男子！應於自身生病苦想，於善知識生醫王想，於所說法生良藥想，於所修行生除病想。又，善男子！應於自身生遠行想，於善知識生導師想，於所說法生正道想，於所修行生遠達想。又，善男子！應於自身生求度想，於善知識生船師想，於所說法生舟檝想，於所修行生到岸想。\n>\n> 又，善男子！應於自身生農夫想，於善知識生龍王想，於所說法生時雨想，於所修行生成熟想。又，善男子！應於自身生貧窮想，於善知識生毘沙門想，於所說法生財寶想，於所修行生富饒想。又，善男子！應於自身生弟子想，於善知識生良師想，於所說法生技藝想，於所修行生解了想。\n>\n> 又，善男子！應於自身生恐怖想，於善知識生勇健想，於所說法生兵仗想，於所修行生除怨想。又，善男子！應於自身生商人想，於善知識生導師想，於所說法生珍寶想，於所修行生得寶想。又，善男子！應於自身生兒子想，於善知識生父母想，於所說法生家業想，於所修行生紹繼想。\n>\n> 又，善男子！應於自身生王子想，於善知識生大臣想，於所說法生王教想，於所修行生智慧想、住王城想、冠王冠想、繫王繒想。善男子！汝應發如是心，作如是意，親近承事於善知識。何以故？一切菩薩以如是心近善知識，令其志願永得清淨故。「\n>\n> 復次，善男子！菩薩因善知識常能增長一切善根，譬如雪山生長藥草；因善知識成佛法器，譬如大海吞納眾流；因善知識成功德處，譬如大海出生眾寶；因善知識淨菩提心，譬如猛火能鍊真金；因善知識出諸世間，如須彌山出於大海；因善知識不染世法，譬如蓮華不著塵水；\n>\n> 因善知識不受諸惡，譬如大海不宿死屍；因善知識增長白法，譬如白月漸次圓滿；因善知識照明法界，譬如盛日照四天下；因善知識增長大願，譬如父母養育嬰兒。善男子！我今略說菩薩若能勤求隨順善知識教，即得成就十不可說不可說百千億那由他功德，清淨十不可說不可說百千億那由他深心，增長十不可說不可說百千億那由他菩薩根，具足十不可說不可說百千億那由他威德力，斷除十不可說不可說百千億阿僧祇菩薩障礙，超越十不可說不可說百千億阿僧祇魔境，深入十不可說不可說百千億阿僧祇法門，圓滿十不可說不可說百千億阿僧祇助道，\n> 修習十不可說不可說百千億阿僧祇妙行，發起十不可說不可說百千億阿僧祇大願。\n>\n> 善男子！我復略說一切菩薩行、一切菩薩波羅蜜、一切菩薩所住地、一切菩薩安忍門、一切菩薩三昧門、一切菩薩神通智、一切菩薩總持門、一切菩薩迴向智、一切菩薩四無量、一切菩薩廣大願、一切菩薩普遍成就一切佛法如是皆由善知識力而得圓滿；\n>\n> 以善知識而為根本，從善知識來，依善知識生，依善知識長，依善知識住，善知識為因緣，善知識能發起。」爾時，善財童子白言：「聖者！我今已知一切善法從善知識生。云何能於諸善知識、善法之中速得圓滿、速得清淨、得不退失？」時，德生童子、有德童女告善財言：「有二種戒，具足受持，則得圓滿善知識法。\n>\n> 何等為二？一、菩薩戒；二、別解脫戒；持是二戒，則能圓滿善知識法。如佛所說，自不持戒，令他持戒，自未調伏，令他調伏，無有是處。若諸菩薩具足圓滿頭陀功德，如是二戒悉得清淨，不失善法。」善財童子白言：「聖者！云何名為頭陀功德？\n>\n> 」童子、童女告善財言：「善男子！言頭陀者，謂諸菩薩十二頭陀。何等十二？\n>\n> 第一納衣：善男子！云何納衣？若諸菩薩具十種法，則得圓滿成就納衣。何等為十？\n>\n> 一者、勤修令得堅固，\n>\n> 二者、令心常自謙下，三、於身心無有疲厭，四、於衣服心不染著，五者、常樂堅固遠離，六者、成就堅固功德，七、不自顯殊勝德行，八、於他人不起輕慢，九者、護持淨戒圓滿，十者、堪任一切親近。善男子！此是菩薩住淨信心，具足圓滿。由此心故，聞說如來清淨言教，不惜身命，勤修佛法，不破不毀；\n>\n> 以勤修故，身心不動，令於所得堅固成就；以心堅固，常自謙下；心謙下故，成就無我；得無我已，心無憍慢，得無慢心，謙下力故；人所棄者，悉收取之，澣染成衣，遠離煩惱，心無厭惡，亦無貪著，但取資身，以禦寒暑，修行道業，餘無所顧；於此納衣，不見過失，不念麁弊，但見納衣所有功德，離貪欲者，乃服此衣；\n>\n> 服此衣者，心無煩惱，是諸聖種順菩薩行、諸佛如來之所讚歎；由此因緣不自貢高；不貢高故，不嫌他人；離高嫌故，淨戒圓滿；戒圓滿故，堪任親近，諸佛菩薩之所護念，諸天人王及剎帝利、婆羅門等城邑聚落，一切見聞無不歡喜，恭敬禮拜，咸共讚美，稱揚其德，而作是言：『我等有福，感如是人居此國土。\n>\n> 』同梵行者咸皆歡喜。善男子！是為菩薩具足十法，圓滿成就納衣功德。「\n>\n> 復次，善男子！菩薩有十種法，具足圓滿成就三衣。何等為十？\n>\n> 一者、成就知足，\n>\n> 二者、成就少欲，\n>\n> 三者、離於多求，四者、離諸積聚，五者、遠離喪失，六者、遠離身苦，七者、遠離心憂，八者、遠離於惱，九者、遠離取捨，十者、向漏盡道。善男子！如是菩薩心少欲故，趣得三衣，無所揀別，成就喜足；得喜足已，遠離多求；離多求故，無諸積聚；\n>\n> 離積聚故，不怖喪失；無喪失故，身得無苦；身無苦故，心亦無憂；心無憂故，遠離於惱；惱不生故，遠於取捨；遠取捨故，向漏盡道。善男子！是為菩薩具足十法，圓滿成就三衣功德。「\n>\n> 復次，善男子！菩薩有十種法，具足圓滿而得成就不隨染衣。何等為十？\n>\n> 一者、不隨貪欲所行，\n>\n> 二者、不隨瞋恚所行，\n>\n> 三者、不隨愚癡所行，四者、不隨忿怒所行，五者、不隨很戾所行，六者、不隨嫉妬所行，七者、不隨慳吝所行，八者、不隨憍慢所行，九者、不隨名稱、讚譽、眷屬所行，十者、不隨親近供養財利所行。善男子！由此不隨貪等行故，不為四魔之所屈伏，遇諸毀辱，心不怯弱，設有尊重，亦不貢高，由此名為心不隨順諸染惑行。\n>\n> 善男子！是為菩薩具足十法，圓滿成就不隨染衣妙行功德。「\n>\n> 復次，善男子！菩薩有十種法，具足圓滿則得成就依常乞食。何等為十？\n>\n> 一者、慈心攝取，\n>\n> 二者、次第行乞，\n>\n> 三者、不自生惱，四者、成就知足，五者、普共分食，六者、不嗜美食，七者、飲食知量，八者、疾得善法，九者、願滿善根，十者、離和合相？善男子！云何菩薩慈心攝取，乃至遠離諸和合相？善男子！若時菩薩見諸苦惱逼迫眾生，乏少善根，為欲圓滿彼善根故，隨順眾生，慈心攝取；\n>\n> 菩薩為順平等慈心，次第行乞。於行乞時，若至城邑，齊整威儀，善攝諸根，一心不亂，諦視徐行，無踰七步，正念安住，於善法中，不選高門，不棄微賤，除惡律儀、旃荼羅等，為護譏嫌，悉不應往；若以慈心平等攝取，究竟不捨。菩薩隨順次第乞時，不自生惱，設不得食，亦不生瞋，菩薩如是成就知足，隨與而取，不擇精麁。\n>\n> 菩薩如是次第乞已，持至佛前或塔廟前，以尊重心，恭敬供養，供養畢已，還本所居，分為四分；取\n>\n> 第一分待同梵行，以\n>\n> 第二分施諸貧苦，以\n>\n> 第三分施諸囚繫，以\n>\n> 第四分然自充食；於所食中，亦不貪嗜，但念於身，作除病想，乃至為令身得安住。受飲食時，不令太少，以自虛羸，妨修善業；亦不過多，令身困重，增長睡眠；因此食故，能勤精進，疾得善法。菩薩為欲圓滿一切菩提分法諸善根故，又應遠離取和合相；\n>\n> 離是相已，離於我執，成就無我，乃至自身內外血肉、一切財物，不生悋惜，能與眾生共所受用。善男子！是為菩薩具足十法，圓滿成就依常乞食妙行功德。「\n>\n> 復次，善男子！菩薩有十種法，具足圓滿則得成就常一坐食。何等為十？\n>\n> 一者、如諸菩薩一坐道場；\n>\n> 二者、降伏魔怨，心不移動；\n>\n> 三者、於出世定，成就不動；四者、於出世慧，成就不動；五者、於出世智，成就不動；六者、於諸法空，成就不動；七者、於證真道，成就不動；八者、於真實際，成就不動；九者、於如如性，成就不動；十者、於一切智，成就不動。善男子！此一坐者，謂一法坐菩薩依彼而得不動，故說菩薩成就一坐。\n>\n> 善男子！是為菩薩具足十法，圓滿成就常一坐食妙行功德。大方廣佛華嚴經卷\n>\n> 第三十三大方廣佛華嚴經大方廣佛華嚴經卷\n>\n> 第三十四罽賓國三藏般若奉詔譯入不思議解脫境界普賢行願品「\n>\n> 復次，善男子！菩薩具十種法，則得圓滿成就一食。何等為十？\n>\n> 一者、成就食時，性不貪求；\n>\n> 二者、成就食時，性無染著；\n>\n> 三者、隨得食時，常知止足；四者、恒依時食，不墮非時；五者、若為利養，悉不應食；六者、若得甘美，亦不應食；七者、若見他食，亦不生瞋；八者、見他食時，亦無慳妬；九者、乃至命盡，亦常一食；十者、於所食時，當起藥想。善男子！是為十法，成就一食妙行功德。\n>\n> 「\n>\n> 復次，善男子！菩薩具十種法，則得圓滿阿蘭若法。何等為十？\n>\n> 一者、成就久修梵行，\n>\n> 二者、成就清淨律儀，\n>\n> 三者、成就諸根不亂，四者、成就常樂多聞，五者、成就一切處力，六者、成就遠離我執，七者、成就不計著身，八者、成就常樂遠離，九者、成就正法現前，十者、成就樂於獨處。「善男子！云何菩薩久修梵行，乃至成就樂於獨處？善男子！如是菩薩得出家已，於諸如來所說教中，具足三輪，戒印清淨；\n>\n> 於諸戒中，獲得善巧，不由他教，能自開解。所謂：隨義善巧，而能修行；隨文善巧，受持不忘；於出要道，善巧隨順；於五犯聚，善巧悔除；隨所行住，離諸犯境；於諸惡人，心常怖畏，乃至小罪，亦不覆藏；於諸學處，有罪、無罪，悉能了知，知如是等業之久近，墮三惡趣，復生人天；\n>\n> 如是菩薩善調六根，令無動亂，以是方便住阿蘭若。居無惱害、無過難處，不親一切居人境界；不遠城邑，乞食便易，藥草滋茂，清淨泉流；遠惡禽獸，空閑寂靜；依如是處而為居止。於所習誦，應自精勤；諷誦之時，調其氣息，聲離高下，心不外緣，專想憶持，思惟文義，離諸惛掉，止觀相應。\n>\n> 若見大臣、婆羅門等來至其所，當於來者起愛敬心，先意問訊，命令安坐，觀其根性，為說正法，咸令歡喜，信受修行。若見國王，應善迎奉，方便承意，作如是言：『唯願大王就此敷座。』王既坐已，請其所欲，一切供給。或時彼王心無信樂，應以善言，讚美王德：『我觀大王妙得善利；\n>\n> 今王境內，持戒、多聞、一切沙門及婆羅門良祐福田，悉於中住；以王威力，一切盜賊不來侵擾；由王德化，一切惡獸悉皆遠離。』王聞語已，歡喜踊躍，諸根調伏，其心寂靜，堪任法器，當為宣說種種正法，或為演說厭生死法，或為演說如來功德、廣大自在甚深妙法，如是一切皆令歡喜。\n>\n> 菩薩成就如是多聞、一切處力，堪修正行；菩薩成就自利利他，遠離一切我執煩惱；菩薩成就不計著身，於阿蘭若，心無恐怖；菩薩成就常樂遠離，住阿蘭若，其心寂靜；菩薩成就正法現前，於諸世間，悉皆捨離；菩薩成就樂於獨處，猶如野鹿，無鹿恐怖。\n>\n> 善男子！是為菩薩具足十法，圓滿成就住阿蘭若妙行功德。「\n>\n> 復次，善男子！菩薩具十種法，則得成就樹下而坐。何等為十？\n>\n> 一者、不近村邑聚落，\n>\n> 二者、不依太遠城邑，\n>\n> 三者、不依荊棘之處，四者、不依多毒草處，五者、不依無枝葉樹，六者、不依多猨狖處，七者、不依眾鳥集處，八者、不依惡獸住處，九者、不依近怨賊處，十者、不依造作非法惡律儀處；如是等處悉不應依。能令身心安隱喜樂，可修善行，即應安住。\n>\n> 善男子！是為菩薩具足十法，圓滿成就樹下而坐妙行功德。「\n>\n> 復次，善男子！菩薩具十種法，則得圓滿露地而坐。何等為十？\n>\n> 一者、隨寒熱雨，不擇溫涼，\n>\n> 二者、不依牆壁，\n>\n> 三者、不依樹林，四者、不依草[卄/積]，五者、不依危險，六者、寒不覆障，七者、雨不覆蓋，八者、熱不覆障，九者、風不覆障，十者、若有病苦，得居房舍。菩薩應當作如是念：『若於露坐，正念現前，隨所修行，速除煩惱，隨順佛說頭陀功德，我當勤求而得圓滿。\n>\n> 』設住房舍不生貪著，亦不應言此好彼惡，應作是念：『我居寺舍，利益一切修福眾生。露坐不能為大利益；又露地坐，但能自利，不能利他。』而彼菩薩雖居房舍，晝夜常作露地坐想。善男子！是為菩薩具足十法，圓滿成就露地而坐妙行功德。「\n>\n> 復次，善男子！菩薩具十種法，則能成就住止塚間。何等為十？\n>\n> 一者、厭離世間想，\n>\n> 二者、死相現前想，\n>\n> 三者、初死未壞想，四者、青瘀現前想，五者、胮脹現前想，六者、膿流敗壞想，七者、禽獸食噉想，八者、火焚半然想，九者、肢節分離想，十者、骨鎖現前想。善男子！若諸菩薩住塚間時，於諸眾生恒住慈心及利益心，堅持淨戒，攝護威儀，澡潔其身，不應食肉。\n>\n> 何以故？止住寒林，應防二過：一、離外道所譏毀故，二、離非人得其便故。善男子！若彼菩薩入僧伽藍，先禮佛塔及諸形像，上、中、下座隨應禮拜；如是畢已，應當守護威儀法式，為住塚間諸菩薩等逆生死流、順聖法故。善男子！若彼菩薩入僧伽藍，舊住比丘應以床敷請令就坐。\n>\n> 菩薩審觀，若有妨難，隨事思惟；若無妨難，乃可就坐；應當如是謙下其心。善男子！是為菩薩具足十法，圓滿成就住止塚間妙行功德。「\n>\n> 復次，善男子！菩薩具十種法，則得圓滿成就常坐。何等為十？\n>\n> 一者、不為己身疲勞，\n>\n> 二者、不為其心熱惱，\n>\n> 三者、不為嬾惰睡眠，四者、不為久立不安，五者、為滿菩提法聚，六者、為修心一境性，七者、為求正道現前，八者、為欲坐菩提場，九者、為欲利益眾生，十者、為欲滅除煩惱。善男子！是為菩薩具足十法，成就常坐妙行功德。「\n>\n> 復次，善男子！菩薩具十種法，則得圓滿成就隨坐。何等為十？\n>\n> 一者、隨所遇座，心不貪著，\n>\n> 二者、隨舊敷座，不自施設，\n>\n> 三者、亦不教人敷設床座，四者、於諸敷具，不作因緣，五者、遇草葉等，隨時而坐，六者、多毒蟲處，應當遠離，七者、若欲臥時，右脇著地，八者、心無放逸，念當時起，九者、繫想在明，順法寢息，十者、為欲修行，令身安樂。善男子！是為菩薩具足十法，成就隨坐妙行功德。\n>\n> 善男子！此十二種頭陀功德，菩薩修行具足成就，能令一切善知識法圓滿清淨，能於一切善知識法永無退轉。」爾時，善財童子得聞如是清淨妙行頭陀功德：種種讚歎諸善知識，種種隨順菩薩行門，及能顯示一切佛法；身心柔軟，歡喜踊躍，速疾增長愛敬之心，頂禮童子及童女，足遶無量匝，慇懃瞻仰，一心戀慕，辭退而去。\n>\n> 爾時，善財童子，善知識教潤澤其心，正念思惟諸菩薩行，漸漸前行向海岸國。自憶往世，經多生死不修禮敬，即時發意，深自剋責，勤力而行。復憶往世，久處輪迴身心不淨，即時發意：專自治潔，願達彼岸。復憶往世，隨順世間作諸惡業，即時發意：正念觀察諸菩薩行。\n>\n> 復憶往世，煩惱覆心，起諸妄想，即時發意：恒正思惟諸法實性。復憶往世，所修諸行但為自身，即時發意：令心廣大普及含識。復憶往世，追求欲境常自損耗，即時發意：修行佛法，長養諸根。復憶往世，起邪思念，顛倒相應，即時發意：生正見心，起菩薩願。\n>\n> 復憶往世，日夜劬勞，作諸惡事，即時發意：起大精進，成就佛法。復憶往世，受五趣生，於自他身皆無利益，即時發意：願以其身饒益眾生，成就佛法，發起一切眾生善根，承事一切諸善知識，恒與正願心共相應；如是思惟，生大歡喜。復觀此身，從無始際，常是一切生、老、病、死、恩愛、離別眾苦之本，願盡未來修行一切菩薩之道，教化成熟一切眾生，見諸如來成就佛法，遊行一切諸佛剎土，承事一切善說法師，住持一切如來正教，尋求一切正法伴侶，見一切善知識集一切諸佛法與一切菩薩願智身而作因緣。\n>\n> 作是念時，速疾增長不可思議無量善根，即於一切諸菩薩所發起深信尊重之心生希有想，生大師想；諸根清淨，善法增益，起一切菩薩恭敬供養，作一切菩薩曲躬合掌，生一切菩薩普見世間眼，起一切菩薩普念眾生想；入一切菩薩無量平等門，現一切菩薩無量願化身，出一切菩薩清淨語言，願欲莊嚴一切佛土想；\n>\n> 見過現一切諸佛及諸菩薩威德圓滿，於一切處示現成道神通變化，乃至無有一毛端處佛菩薩身而不周遍；又得清淨一切菩薩智光明眼，見一切菩薩所行境界：其心普入十方剎網，其願普遍虛空法界，隨順一切盡無餘處，普修一切三世平等無分別行，相續不斷，無有休息，普入一切甚深法門；\n>\n> 如是一切，皆以信受善知識教之所致耳。善財童子以如是尊重、如是供養、如是稱讚、如是觀察、如是加持、如是願力、如是想念、如是隨順、如是思惟、如是出生，遍滿無量智慧境界，於毘盧遮那莊嚴藏大\n\n### 参批15（L.303·参52–52·注入 26,241 CJK）\n\n## 二、三译四件套对读（语料库·程序汇编）\n\n> 语料库行口径：到会（到达·顶礼·请法）／法门自陈／指授（转介后参）／辞退。引文各照底本；本表为程序抽取节引（句界截断），全文见各参经文。\n\n### 2.1 八十／四十（`T10n0279` ／ `T10n0293`）\n\n| 件 | 八十 原文（节引·逾 260 字句界截断） |\n|---|---|\n| 到会 | 漸次南行，至妙意華門城，見德生童子、有德童女，頂禮其足，右遶畢已，於前合掌而作是言：「聖者！我已先發阿耨多羅三藐三菩提心，而未知 |\n| 到会 | 至妙意華門城，見德生童子、有德童女，頂禮其足，右遶畢 |\n| 指授（→后参） | 汝詣彼問：菩薩云何學菩薩行、修菩薩道？ |\n\n### 2.2 六十／四十（`T09n0278` ／ `T10n0293`）\n\n| 件 | 六十 原文（节引·逾 260 字句界截断） |\n|---|---|\n| 到会 | 漸次南行，至於彼城，見童子、童女，頂禮其足 |\n| 到会 | 至於彼城，見童子、童女，頂禮其足 |\n| 指授（→后参） | 汝詣彼問云何菩薩學菩薩行、修菩薩道 |\n\n## 三、古注取窗（疏·钞·论·探玄记·程序取窗照录）\n\n**澄观《华严经疏》`T1735`（八十·寄位释）**（锚「德生」·PDF/册页 1363 · 388 字·程序取窗·句界截断·引前须对原书核）：\n\n> 德生有德幻智歸幻門善友。第一依教\n趣求。第二見德生下見敬諮問。第三時童子下示己法門。於中二初標\n名後業用。今初謂能所境智染淨之法。皆從緣起無定性故。如幻而\n住。二得此解脫下明業用中二。初別明後結歎今初有十種幻。皆上句\n標幻。下句以緣生釋成。十中初一為總。緣生世界並通染淨。剎海亦\n名世界故。餘九為別。初五約染分依他。如幻緣生故。一約有情苦\n果。從業惑集生。\n二約十二因緣順觀即世間故。次第相由故云展轉。\n三就五類法中但除無為。故云一切。以無為無有起。非幻緣生故。異\n熟識等。從無始惡習內執為我。四惑相應故云我見等。及外取妄境。\n云種種幻緣故。感心等悉皆如幻。四五二句別明不相應行。四即是\n時。謂依行相續不斷分位。建立為時。所依行空時何所立。妄計有體\n是顛倒智。五即無常生老等。謂依生已壞滅分位。建立無常等皆妄分\n別有。\n次一切國土義通染淨眾生。染土多從三倒所生。以不了唯心妄\n取境界故。上云一切國土但想所持。既有妄想故心見皆倒。言無明所\n現亦通淨剎。謂登地已上無明未盡。所見國土種種不同。既云無明則\n揀非佛土。\n\n**澄观《随疏演义钞》`T1736`（八十·钞于末会多总谈，部分参为类聚引）**（锚「德生」·PDF/册页 2350 · 380 字·程序取窗·句界截断·引前须对原书核）：\n\n> 德生有德三就五類法中等者。疏文\n有三。一釋一切法即有為。一切以無為下。出揀無為所以。同掌珍論\n真性。有為空故。從異熟識等。出餘四類之果。異熟是心。等餘七識\n\n及心所色法并不相應。二從無始下。釋我見等能成之因。然我見有\n二。一與七識相應即執第八以為內我故謂我所與四惑相應。今言我見\n等者等取愛慢。二者與六識相應我執。兼外取妄境以為我所。及起餘\n惑故云種種。\n三故感已下辨因。感果可知。疏四五二句。別明不相應\n者。然不相應有二十四。今二門中略遣其四。等於所餘。四中言即是\n時者。釋經三世三世是二十四中之一時故。從謂依行下。出三世如幻\n之由。行即五蘊剎那生滅。前後相續。已謝為過去。未起為未來。生\n已未謝名為現在。離行之外何有分位而有三世耶。況所依行空能依何\n有。疏五即無常生老等者。即二十四中之三。一無常。二生。三老\n等。\n即等上經言生滅及死。皆無常攝。生老二字。即是二法但略無\n住。又諸聖教多合生滅名為無常。所以然者生名為有。有非恒有不如\n無為。滅名為無。無非恒無不如兔角。由不同彼無為兔角二常之相。\n\n**李通玄《新华严经论》`T1739`（八十）**（锚「德生童子」·PDF/册页 965 · 406 字·程序取窗·句界截断·引前须对原书核）：\n\n> 德生童子有德童女推慈氏菩薩之德令善財童子親近勝進分。\n第二爾時善財童子蒙善知識教潤澤其心已下。至皆以信受善知識教之\n所致耳。有三十行經。明善財童子自念往因過惡不善自慚悔恨起恭敬\n供養親近善知識分。\n第三善財童子以如是尊重如是供養已下。至皆從菩薩善巧方便所流出\n故。有三十二行經。明善財童子於樓閣前五體投地暫時歛念思惟獲益\n無量分。\n\n第四善財童子入如是智端心潔念已下。至善財說頌此一段經。明善財\n\n歎善知識所居樓閣分。已下頌是善財童子重頌前慈氏菩薩所居樓閣住\n處。并歎慈氏菩薩之德。如文具明。\n第五爾時善財童子以如是等一切菩薩無量稱揚讚歎法已下。是善財欲\n見彌勒菩薩從外而來分。\n第六爾時善財童子合掌恭敬已下。至此卷末。明善財申已發大菩提心\n慈氏為讚菩提心善根功力不思議分。\n\n第七爾時善財童子恭敬右遶彌勒菩薩摩訶薩已下。至此卷末。明善財\n入慈氏樓閣觀果知因三世所行境界同異總別一多無礙自在同時圓滿\n分。\n第八善男子汝應詣文殊師利已下。有五行半經。明慈氏還令善財見文\n殊師利明至果同因表因中之果本來無二分。\n\n**法藏《探玄记》`T1733`（六十·残存）**（锚「德生童子」·PDF/册页 1199 · 386 字·程序取窗·二遍扫（类聚引）·句界截断·引前须对原书核）：\n\n> 德生童子及有\n德童女則為五十五人。各有自分勝進故有百一十也。三如是童子下歎\n善財直學大乘德。文中有十句。文可知。四如是之人下歎行勝希有\n德。於中二。先標。二何以下釋成。釋成中三。初總釋。二度無智海\n下別釋。於中化二十一種眾生。三救護下總結釋可知。五諸善男子下\n歎善財菩提心希有德。六諸善男子若有菩薩下歎善財堪為勝軌德。七\n此童子者入威儀下歎善財如海深廣行。\n八顯現一切下明一切處遍修\n行。第二善財汝今得下正為善財歎德令喜。於中四。初歎善財本見文\n\n殊益。於中先總。二所謂下別遠離惡導等入十信益。過童蒙地者入十\n住益。住功德地者入十行十迴向益。具智惠地者十地益。下明入勝進\n佛智益。二若能如是下歎善財見功德雲等已後諸善知識益。於中初總\n辨見勝人益。二隨彼下別顯聞妙法益。三善財汝應發大下歎善財超劫\n速成行。\n於中初總舉得果速。次別顯修因速。謂進行超群也。餘菩薩\n約隨位差別說。一生皆具者約普門該攝說。又此一生亦攝多劫。如上\n仙人執手成多劫行等。又此普賢法雖圓融相攝一位則一切故一生皆\n得。\n\n**道霈《華嚴經疏論纂要》`B0002`（八十·疏论纂·初会多寄位总判·L.527 五源扩）**（锚「德生童子」·页码未录 · 382 字·程序取窗·句界截断·引前须对原书核）：\n\n> 德生童子。有德童女。遇此十一人。名會緣入實相者。謂會前次位差別之緣。同入實相理。寄等覺位。親生妙覺。為佛母故也。第三遇彌勒一人。名攝德成因相。謂攝前會差別緣。歸一實之德。明一生補處。以為正因。第四再見文殊一人。名智照無二相。謂初遇文殊表信智。再遇文殊表證智。既與本智相應。冥合無二。離能所相。離分別相。照體獨立。故不見文殊身相。但摩頂得法也。第五遇普賢一人。\n名顯因廣大相。謂由前智極心冥。辭亡慮絕。故觸物皆道。法法全真。依正渾融。重重無盡。故隨舉一法。即是圓因。一切皆爾。由是善財於普賢一毛孔中所得法門。過前佛剎微塵數倍。一切皆然。大疏序云。寄位南求。因圓不踰於毛孔。既一切無非圓因。無不包徧。故云顯因廣大相也。第五顯因廣大相中。第五重示普因者。謂此第五相中。經有五分。一依教趣求分。二聞覩前相分。三見聞親證分。\n四聞佛勝德分。五重示普因分。前四分在三十八後一半。及第三十九卷中。第五分。即此別行一卷是。)序分在於四十卷中第一卷故。(補注曰。云序分在四十卷中第一卷者。以行願品全文四十卷。此卷最後。\n\n## 四、评注与延伸指针（只指不代·不生成无据内容）\n\n- **古注诸家**：本参取窗见 §三；更完整释文见主页 §6.2 李通玄《新华严经论》窗、§五之B 计数诸说辨析；澄观《华严经疏》总纲见主页 §2.0′。\n- **今人讲记**：海云继梦《华藏妙海》对读见主页 §6.2（〔OCR 待校〕）；九九华严讲记线见〈海云法师·九九华严讲记校勘工作台〉。\n- **平行线**：藏译 Toh 44 对应章见主页「藏译对读窗」；〈五十三参行历〉交互图可按身份/篇幅回看全程。\n\n> <span class=\"en-line\">**EN corresponding · Visit 51 — 德生·有德 (youth & maiden).** A youth & maiden at 妙意華門城; self-declared gateway: \"The liberation of illusion-like abiding\" 〔编者试译〕. Stage II — the Fifty Teachers (the pilgrimage through good counselors). Three-translation parallels: 40-fascicle `T10n0293` (base), 80 `T10n0279`, 60 `T09n0278` — see §二; classical commentary windows: Chengguan's *Huayan jing shu* `T1735` and Li Tongxuan's *Xin Huayan jing lun* `T1739` — see §三.</span>\n\n## 五、台账\n\n- L.493（2026-11-17）：古注取窗入 §三（疏/论 54/54 全覆盖·探玄记入法界品疏残存仅 13/54·未及者如实留空）；程序取窗·NFKC 归一·单调锚定·字准待校。\n- L.499（2026-11-17）：第四源《随疏演义钞》`T1736` 入 §三（40/54·钞于末会多总谈，部分窗为类聚引·已于源标签注明）。\n- L.507（2026-11-18）：二遍扫恢复——钞 52/54→**54/54**·探玄记 13→**46/54**（pass2 类聚引已标）；仍 miss 8 处为探玄记未及之参（5/15/16/22/26/33/35/49·残存上限）。\n- L.491（2026-11-16）：子页建立——程序汇编（主页 §参51 照录＋行历数据卡＋四件套语料）；内容源批次 L.289–L.304（参批1-16）·L.316（参33 补卡）·L.407/L.413/L.415（行历·三译师名）·L.421/L.456（四件套语料库）。\n- 主页各参节后续修订后重跑 build 即自动同步本页 §一（运行时组装·无中间文件）。\n", "data_source": null, "data_pool": null, "back": {"tab": "gap", "view": "avatamsaka-studies", "label": "文献页 · 华严经学"}, "updated_at": "2026-11-16"};

// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){

}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}
