quote></section>\n<section class=\"tri-lang tri-zh\"><p class=\"tri-head\"><span class=\"tri-tag\">汉</span><span class=\"tri-sub\">待译 · 尚未产出</span></p><blockquote class=\"tri-text tri-pending\">〔待译 · 该段尚未产出（作业进行中／属后续会话）〕</blockquote></section>\n<section class=\"tri-lang tri-en\"><p class=\"tri-head\"><span class=\"tri-tag\">EN</span><span class=\"tri-sub\">pending · not yet produced</span></p><blockquote class=\"tri-text tri-pending\">〔pending · not yet produced〕</blockquote></section>\n</div>\n\n<div id=\"tri-seg-9\" class=\"tri-anchor\"></div>\n\n#### 段 9〔035 [2b.1] · T44-1〕\n\n<div class=\"tri-seg\" data-status=\"pending\">\n<section class=\"tri-lang tri-bo\"><p class=\"tri-head\"><span class=\"tri-tag\">藏</span><span class=\"tri-sub\">德格原字形 · 逐字回源</span></p><blockquote class=\"tri-text\" lang=\"bo\">སྤོས་དང་། མེ་ཏོག་དང་། རིན་པོ་ཆེའི་ཕྲེང་བ་དང་། དྲ་བ་མང་པོ་ཐམས་ཅད་རྣམ་པར་བྲེས་པ་རིན་པོ་ཆེའི་ཁ་དོག་ཟད་མྱི་ཤེས་པའི་ཆར་རབ་ཏུ་འབབ་པའི་རྣམ་པར་འཕྲུལ་པ་ཡང་དག་པར་སྟོན་པའི་ནོར་བུའི་རྒྱལ་པོས་ཤིན་ཏུ་བསྒྲུབས་པ། མེ་ཏོག་ སྣ་ཚོགས་ཆུ་བོའི་ཀླུང་ལྟ་བུས་ཡོངས་སུ་བསྟན་པས་བརྒྱན་པ། རིན་པོ་ཆེའི་ཤིང་འོད་ཟེར་གྱི་ཁ་དོག་སྡུག་པོ་དང་ལྡན་པའི་ཡལ་གས་བརྒྱན་པ། རྒྱན་ཐམས་ཅད་དུ་སྣང་བ་ཤིན་དུ་འབར་བའི་བྱིན་གྱི་རླབས་ཀྱིས་རྣམ་པར་སྤྲུལ་པ། ཡང་དག་པར་བསྟན་པའི་སའི་སྙིང་པོ། </blockquote></section>\n<section class=\"tri-lang tri-zh\"><p class=\"tri-head\"><span class=\"tri-tag\">汉</span><span class=\"tri-sub\">待译 · 尚未产出</span></p><blockquote class=\"tri-text tri-pending\">〔待译 · 该段尚未产出（作业进行中／属后续会话）〕</blockquote></section>\n<section class=\"tri-lang tri-en\"><p class=\"tri-head\"><span class=\"tri-tag\">EN</span><span class=\"tri-sub\">pending · not yet produced</span></p><blockquote class=\"tri-text tri-pending\">〔pending · not yet produced〕</blockquote></section>\n</div>\n\n<div id=\"tri-seg-10\" class=\"tri-anchor\"></div>\n\n#### 段 10〔035 [2b.2] · T44-1〕\n\n<div class=\"tri-seg\" data-status=\"pending\">\n<section class=\"tri-lang tri-bo\"><p class=\"tri-head\"><span class=\"tri-tag\">藏</span><span class=\"tri-sub\">德格原字形 · 逐字回源</span></p><blockquote class=\"tri-text\" lang=\"bo\">རིན་ པོ་ཆེའི་འབྲུ་ཐམས་ཅད་འབྱུང་བས་ཕྱོགས་ཀུན་དུ་སྦྱངས་ཤིང་བརྒྱན་པའི་སྙིང་པོ་བྱང་ཆུབ་ལ་བྱང་ཆུབ་ཆེན་པོའི་ཤིང་ནོར་བུ་རིན་པོ་ཆེ་རྡོ་རྗེའི་རྒྱན་སྣ་ཚོགས་ཀྱི་འབྲུས། བསྒྲུབས་པའི་སྡོང་པོ་དང་ལྡན་པ་བཻ་ཌཱུརྱ་དང་། ནོར་བུ་ཐམས་ཅད་ཀྱི་རིགས་འབྱུང་བའི་སྙིང་པོ་དང་ལྡན་པའི་ལྷུན་ཅན་ ཡོངས་སུ་ཡོན་ཏན་མང་པོ་མཐའ་ཡས་པའི་ནོར་བུ་རིན་པོ་ཆེ་མང་པོའི་འབྲུས་ཤིན་ཏུ་བརྒྱན་ཅིང་རབ་ཏུ་འཕེལ་བའི་ཡལ་ག་ཅན་རིན་པོ་ཆེ་ཐམས་ཅད་ཀྱི་ལོ་མ་ཤིན་ཏུ་འོད་གསལ་བས་ཕྱོགས་ཀྱི་སྤྲིན་དུ་གྱུར་པ། </blockquote></section>\n<section class=\"tri-lang tri-zh\"><p class=\"tri-head\"><span class=\"tri-tag\">汉</span><span class=\"tri-sub\">待译 · 尚未产出</span></p><blockquote class=\"tri-text tri-pending\">〔待译 · 该段尚未产出（作业进行中／属后续会话）〕</blockquote></section>\n<section class=\"tri-lang tri-en\"><p class=\"tri-head\"><span class=\"tri-tag\">EN</span><span class=\"tri-sub\">pending · not yet produced</span></p><blockquote class=\"tri-text tri-pending\">〔pending · not yet produced〕</blockquote></section>\n</div>\n\n<div id=\"tri-seg-11\" class=\"tri-anchor\"></div>\n\n#### 段 11〔035 [2b.4] · T44-1〕\n\n<div class=\"tri-seg\" data-status=\"pending\">\n<section class=\"tri-lang tri-bo\"><p class=\"tri-head\"><span class=\"tri-tag\">藏</span><span class=\"tri-sub\">德格原字形 · 逐字回源</span></p><blockquote class=\"tri-text\" lang=\"bo\">ཡལ་ག་ཐམས་ཅད་ཀྱི་རྩེ་མོ་ལས་མེ་ཏོག་དང་། འབྲས་བུའི་དྲ་བ་ཡོན་ཏན་ རྣམ་པ་སྣ་ཚོགས་ཅན་རབ་ཏུ་སྤྱངས་པ། རིན་པོ་ཆེའི་འབྲས་བུའི་སྣ་ཚོགས་ཤིན་ཏུ་འབར་བའི་སྙིང་པོས། ཤིང་གི་རྒྱན་མེ་ཏོག་ཐམས་ཅད་ཤིན་ཏུ་རྒྱས་ཤིང་རྣམ་པར་གསལ་བ། ཕྱོགས་བཅུར་འོད་ཀྱི་དཀྱིལ་འཁོར་རིན་པོ་ཆེ་རྒྱ་ཆེ་ཞིང་མང་བའི་འོད་ཟེར་ལྟ་བུར་རྣམ་པར་སྣང་བ་ ནོར་བུའི་ཡོན་ཏན་ཟད་མི་ཤེས་པའི་ཆར་ཆེན་པོ་རྣམ་པར་སྤྲུལ་པས་ཡོངས་སུ་བསྟན་པ། ནོར་བུའི་སྒོ་ཐམས་ཅད་ནས་བྱང་ཆུབ་སེམས་དཔའི་སྤྲིན་འབྱུང་བ་ཤིན་ཏུ་བསྟན་པ། </blockquote></section>\n<section class=\"tri-lang tri-zh\"><p class=\"tri-head\"><span class=\"tri-tag\">汉</span><span class=\"tri-sub\">待译 · 尚未产出</span></p><blockquote class=\"tri-text tri-pending\">〔待译 · 该段尚未产出（作业进行中／属后续会话）〕</blockquote></section>\n<section class=\"tri-lang tri-en\"><p class=\"tri-head\"><span class=\"tri-tag\">EN</span><span class=\"tri-sub\">pending · not yet produced</span></p><blockquote class=\"tri-text tri-pending\">〔pending · not yet produced〕</blockquote></section>\n</div>\n\n<div id=\"tri-seg-12\" class=\"tri-anchor\"></div>\n\n#### 段 12〔035 [2b.6] · T44-1〕\n\n<div class=\"tri-seg\" data-status=\"pending\">\n<section class=\"tri-lang tri-bo\"><p class=\"tri-head\"><span class=\"tri-tag\">藏</span><span class=\"tri-sub\">德格原字形 · 逐字回源</span></p><blockquote class=\"tri-text\" lang=\"bo\">སངས་རྒྱས་ཀྱི་རྣམ་པར་འཕྲུལ་པ་དང་། བྱིན་གྱི་རླབས་ཀྱིས་ཟད་མི་ཤེས་པའི་དབྱངས་འབྱུང་བའི་ དྲུང་ན། དེ་བཞིན་གཤེགས་པའི་གཞལ་མྱེད་ཁང་ཕྱོགས་ཐམས་ཅད་དུ་མངོན་པར་སྣང་བ། རབ་ཏུ་འཕེལ་བ། རིན་པོ་ཆེའི་རྒྱལ་པོ་སྣ་ཚོགས་ཡོན་ཏན་མཐའ་ཡས་པའི་ཀ་བ་བཀྱེ་བ། ལྷུན་རིན་པོ་ཆེའི་མེ་ཏོག་རྣམ་པ་སྣ་ཚོགས་ཐམས་ཅད་ཀྱི་རྒྱན་གྱིས་བརྒྱན་པ། རྒྱན་མཐའ་ཡས་ པས་ཤིན་ཏུ་ཀླུབས་པའི་འོད་ཟེར་སྣང་བས་སྤྲིན་ལྟར་ཁེབས་པ། ཕོ་བྲང་གི་མཚམས་ཐམས་ཅད་ནས་འོད་ཀྱི་རྒྱལ་མཚན་རབ་ཏུ་བཀྱེ་བ། བྱང་ཆུབ་སེམས་དཔའི་འཁོར་གྱི་དཀྱིལ་འཁོར་རྒྱ་མཚོ་མཐའ་ཡས་པ། </blockquote></section>\n<section class=\"tri-lang tri-zh\"><p class=\"tri-head\"><span class=\"tri-tag\">汉</span><span class=\"tri-sub\">待译 · 尚未产出</span></p><blockquote class=\"tri-text tri-pending\">〔待译 · 该段尚未产出（作业进行中／属后续会话）〕</blockquote></section>\n<section class=\"tri-lang tri-en\"><p class=\"tri-head\"><span class=\"tri-tag\">EN</span><span class=\"tri-sub\">pending · not yet produced</span></p><blockquote class=\"tri-text tri-pending\">〔pending · not yet produced〕</blockquote></section>\n</div>\n\n> 〔待譯·未展示〕另有 **1540 段**已全章切段存數據層（逐字回源復驗·段拼接無內容缺口），按里程碑逐批譯出後在此展示。\n\n> 〔诚实边界〕本章已**全章切段 1552 段**（L.380 句末感知；段拼接 norm 逐字对账无内容缺口）；未译段如实标〔待译〕，页面展示已译段＋下一批待译段。模型译未经人工校订，不作引文使用，不得替代 CBETA 祖本文字。\n\n## 二、汉藏对应\n\n**三本开篇对照**（L.203 示范对勘 · 库存示例层）\n\n<section class=\"tri-quote tri-qbo\">\n<p class=\"tri-head\"><span class=\"tri-tag\">藏</span><span class=\"tri-sub\">德格 Toh 44-1 · 叶码 035:393a（示例层自记）</span></p>\n<blockquote class=\"tri-text\" lang=\"bo\">འདི་སྐད་བདག་གིས་ཐོས་པའི་དུས་གཅིག་ན། །བཅོམ་ལྡན་འདས་ཐོག་མ་མངོན་པར་སངས་རྒྱས་པ། །སངས་རྒྱས་ཀྱི་ཆོས་ཐམས་ཅད་ཤིན་ཏུ་རྣམ་པར་སངས་རྒྱས་པའི་ཐུགས་མངའ་བ། །</blockquote>\n</section>\n<section class=\"tri-quote tri-qzh\">\n<p class=\"tri-head\"><span class=\"tri-tag\">八十</span><span class=\"tri-sub\">CBETA T10n0279《大方廣佛華嚴經》卷1〈世主妙嚴品第1〉，逐字回源</span></p>\n<blockquote class=\"tri-text\" lang=\"zh\">如是我聞：一時，佛在摩竭提國阿蘭若法菩提場中，始成正覺。</blockquote>\n</section>\n<section class=\"tri-quote tri-qzh\">\n<p class=\"tri-head\"><span class=\"tri-tag\">六十</span><span class=\"tri-sub\">CBETA T09n0278《華嚴經》卷1〈世間淨眼品第1〉，逐字回源</span></p>\n<blockquote class=\"tri-text\" lang=\"zh\">如是我聞：一時，佛在摩竭提國寂滅道場始成正覺。</blockquote>\n</section>\n\n**对勘发现**（示例层 collation_findings 原文迻录）\n\n- 【印可分对应·已证实】三本皆以「如是我聞 / 'di skad bdag gis thos pa」(evam mayā śrutam) 信起；结构对应成立。\n- 【处所分·汉藏异】八十、六十随即标处所（摩竭提國＋道場名各異：八十「阿蘭若法菩提場」、六十「寂滅道場」）；藏文起句無處所分，逕入「世尊最初正覺」及菩提功德〔本文判断：开篇科段结构实质差异〕。\n- 「始成正覺」与藏文 thog ma mngon par sangs rgyas pa（最初現正等覺）逐字相应〔本文判断〕。\n- 【品題三譯不同】藏题 sangs rgyas phal po che＝佛華嚴；八十題「世主妙嚴品」；六十題「世間淨眼品」〔待核：品題之異涉傳本學〕。\n- 【订正记录】本仓前版（demo §3.5 与旧 JSON）六十起句误作「佛在摩竭提國菩提樹下，成佛未久」，与底本不符，本次据 T09n0278 逐字回源订正为「佛在摩竭提國寂滅道場始成正覺」；八十前版多一逗（摩竭提國，）一并据底本改正。\n\n> 〔口径〕本示例出自《藏汉英对读 · 初探》页之旧示例层（英文 IITB 词典辅助、汉译 MITRA 旧译程），与本专题 MITRA 9B 译程**非同一引擎批次**；藏文与两汉译祖本引文逐字回源口径不变。\n\n## 三、延伸阅读\n\n**本仓专篇与总纲**\n\n- [九九华严第一品〈世主妙严品〉拼读专篇](shizhu-miaoyan.html) — 第一会·菩提场：本专题藏章1 开篇所对应的汉译本品\n- [华严经引读 · 系列总纲（§五 藏汉对应总表）](huayan-series-outline.html)\n- [华严经学 · 三十九品深度研究](huayan-studies.html) — 藏独有二章之法义归属见 §2.3\n\n**数据源清单**（本页内容全部机械派生自下列库存）\n\n- 三语段数据层：`data/translation\\tibetan_avatamsaka_trilingual_segments.json`\n- 示范对勘示例层：`data/alignment/avatamsaka-openings-demo.json`\n- 品目规划表：`data/alignment/tibetan_chinese_pin_plan_L360.json`\n",

  h+='<div style="background:linear-gradient(120deg,rgba(184,134,60,0.12),rgba(94,139,158,0.08));border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px;">';
  h+='  <div style="font-size:0.76em;color:var(--text2);letter-spacing:0.5px">📄 独立文章页</div>';
  h+='  <h2 data-skip-toc="1" style="color:var(--gold);margin:6px 0 4px">'+(a.icon?a.icon+' ':'')+a.title+'</h2>';
  if(a.title_sub)h+='  <div style="font-size:0.85em;color:var(--text2)">'+a.title_sub+'</div>';
  if(a.version)h+='  <div style="font-size:0.78em;color:var(--text2);margin-top:6px">'+a.version+'</div>';
  if(a.back && a.back.tab){
    h+='  <a href="../tabs/'+a.back.tab+'.html" style="font-size:0.75em;color:var(--blue);margin-top:10px;display:inline-block">← 返回 '+a.back.label+'</a>';
  }
  h+='</div>';

  if(a.meta){
    h+='<div class="section" style="border-left:4px solid var(--gold)" data-chrome="1"><h2>📌 导览</h2>';
    h+='<p style="font-size:0.8em;line-height:1.9;white-space:pre-line">'+(typeof _mdInline==='function'?_mdInline(a.meta):a.meta)+'</p></div>';
  }

  if(embed.toc.length){
    h+='<div class="section" data-chrome="1"><h2>🧭 本文目录</h2>';
    h+='<div style="column-width:250px;column-gap:26px;font-size:0.8em;line-height:1.75">';
    embed.toc.forEach(function(t){
      var pad=(t.lv>2?'padding-left:'+((t.lv-2)*16)+'px;':'');
      h+='<div style="'+pad+'"><a href="#'+t.id+'" style="color:'+(t.lv===2?'var(--gold)':'var(--text2)')+';text-decoration:none">'+t.text+'</a></div>';
    });
    h+='</div></div>';
  }

  h+='<div class="section" style="border-left:4px solid var(--gold)" id="article-full">';
  h+='<h2 data-skip-toc="1" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px"><span>📄 '+a.title+' · 全文</span></h2>';
  h+=embed.html;
  h+='</div>';

  h+='<div style="margin-top:18px;padding-top:10px;border-top:1px solid var(--line);font-size:0.74em;color:var(--text2)">';
  h+='<a href="index.html" style="color:var(--blue);text-decoration:none">📚 返回独立文章目录</a>';
  if(a.back && a.back.tab){
    h+=' · <a href="../tabs/'+a.back.tab+'.html" style="color:var(--blue);text-decoration:none">'+a.back.label+'</a>';
  }
  h+='</div>';

  root.innerHTML=h;

  if(typeof _markTermRefs==='function' && document.getElementById('article-full')){
    _markTermRefs('#article-full');
  }
  if(typeof initDocImages==='function' && document.getElementById('article-full')){
    initDocImages('#article-full');
  }
  if(typeof _initArticleENMode==='function') _initArticleENMode();
  if(typeof _foldDoc==='function'){
    try{ _foldDoc('#article-full', {noBar:true}); }catch(e){}
  }
  if(typeof _installPageBar==='function'){
    try{ _installPageBar({mountSel:'#article-full', rootSel:'#article-root'}); }catch(e){}
  }
  if(location.hash){
    setTimeout(function(){
      var el=document.getElementById(location.hash.slice(1));
      if(el){
        if(typeof _reveal==='function')window._reveal(el);
        el.scrollIntoView({behavior:'smooth',block:'start'});
      }
    },80);
  }
}

if(document.readyState!=='loading'){renderArticle();}
else{document.addEventListener('DOMContentLoaded',renderArticle);}
</script>
<script>
/* ── 三语对读工作台（L.378 · gen v0.4 子页架构） ── */
window.__triLayout = function (mode) {
  var root = document.getElementById('article-full');
  if (!root) return;
  var cols = (mode === 'cols');
  root.classList.toggle('tri-cols', cols);
  try { localStorage.setItem('triLayout', cols ? 'cols' : 'stack'); } catch (e) {}
  var btns = document.querySelectorAll('.tri-btn[data-lay]');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('is-on', btns[i].getAttribute('data-lay') === (cols ? 'cols' : 'stack'));
  }
};
window.__triTab = function (i) {
  var root = document.getElementById('article-full');
  if (!root) return;
  // shell 另渲一个裸 h2 页题（无 secfold）→ pane 只取 h2.secfold
  var hs = root.querySelectorAll('h2.secfold');
  for (var j = 0; j < hs.length; j++) {
    var on = (j === i);
    if (on) { hs[j].classList.remove('is-folded'); hs[j].setAttribute('aria-expanded', 'true'); }
    hs[j].style.display = on ? '' : 'none';
    var b = hs[j].nextElementSibling;
    if (b && b.classList.contains('secfold-body')) b.style.display = on ? '' : 'none';
  }
  var btns = document.querySelectorAll('.tri-tab');
  for (var k = 0; k < btns.length; k++) btns[k].classList.toggle('is-on', k === i);
  try { localStorage.setItem('triTab:tibetan-avatamsaka-trilingual-ch01', String(i)); } catch (e) {}
};
(function () {
  function paneOf(el) {
    var root = document.getElementById('article-full');
    if (!root) return -1;
    var hs = root.querySelectorAll('h2.secfold');
    for (var i = 0; i < hs.length; i++) {
      if (el === hs[i]) return i;
      var b = hs[i].nextElementSibling;
      if (b && b.classList.contains('secfold-body') && b.contains(el)) return i;
    }
    return -1;
  }
  function fromHash() {
    var h = location.hash.slice(1);
    if (!h) return -1;
    var el = document.getElementById(h);
    return el ? paneOf(el) : -1;
  }
  function init() {
    var root = document.getElementById('article-full');
    if (!root || !root.querySelector('.secfold') || !root.querySelector('h2') || !root.querySelector('.tri-tabs')) return false;
    var hs = root.querySelectorAll('.secfold');
    for (var i = 0; i < hs.length; i++) {
      hs[i].classList.remove('is-folded');
      hs[i].setAttribute('aria-expanded', 'true');
    }
    // 窄屏页头换行可高达 200px+，固定 scroll-margin 会把锚点藏进页头 → 按实高同步
    function syncGap() {
      var top = document.getElementById('page-top');
      var gap = (top ? top.offsetHeight : 0) + 12;
      var as = document.querySelectorAll('.tri-anchor');
      for (var i = 0; i < as.length; i++) as[i].style.scrollMarginTop = gap + 'px';
    }
    syncGap();
    window.addEventListener('resize', syncGap);
    var lay = 'stack';
    try { lay = localStorage.getItem('triLayout') || 'stack'; } catch (e) {}
    window.__triLayout(lay);
    var tab = fromHash();
    if (tab < 0) {
      try { tab = parseInt(localStorage.getItem('triTab:tibetan-avatamsaka-trilingual-ch01') || '0', 10) || 0; } catch (e) { tab = 0; }
    }
    if (tab >= root.querySelectorAll('h2.secfold').length) tab = 0;
    window.__triTab(tab);
    root.addEventListener('click', function (e) {
      var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
      if (!a) return;
      var el = document.getElementById(a.getAttribute('href').slice(1));
      if (!el) return;
      e.preventDefault();
      var p = paneOf(el);
      if (p >= 0) window.__triTab(p);
      if (window._reveal) window._reveal(el);
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (history.replaceState) history.replaceState(null, '', a.getAttribute('href'));
    });
    window.addEventListener('hashchange', function () {
      var p = fromHash();
      if (p >= 0) window.__triTab(p);
    });
    return true;
  }
  function poll(n) { if (init()) return; if (n > 0) setTimeout(function () { poll(n - 1); }, 120); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { poll(20); });
  else poll(20);
})();
</script>
