<script>
var ARTICLE = {"id": "lou-yulie", "file": "articles/lou-yulie.html", "title": "不苟为，唯贵当", "title_sub": "楼宇烈先生的学问、戏缘与身后的北大中国哲学", "title_en": "Never Act Carelessly; Act Only as Is Fitting — Lou Yulie: Scholarship, Opera Ties, and the Fate of PKU Chinese Philosophy", "icon": "🕯", "version": "", "meta": "", "doc": "docs/人物与学人/不苟为唯贵当_楼宇烈先生纪念综述.md", "doc_md": "# 不苟为，唯贵当：楼宇烈先生的学问、戏缘与身后的北大中国哲学\n\n> **凡例**：本文为纪念性综述，非考据论文。所据材料，主要是北京大学哲学系（宗教学系）讣告与北京大学融媒体中心通稿、中华书局《楼宇烈文集》首发式及相关报道、《中国教育报》长篇通讯、澎湃新闻与《中国社会科学报》的访谈，以及弟子门人的回忆文字（主要来源清单及链接见附录 D）。凡属转述、孤证或诸家记载互异者，随文标〔待核〕；凡属笔者综合材料所作的判断，标〔本文判断〕。引语只取简短片段，概述他人长段话者标〔大意〕。引语一律转为简体，字句未改。资料限度与存疑条目，统见附录 C。\n\n2026年10月9日凌晨两点十八分，楼宇烈在北京去世。北大哲学系（宗教学系）的讣告写的是九十二岁；按1934年12月10日的生日推算，足岁九十一。两个数字都对，只是算法不同。他这一生也常是这样：同一件事，官方的说法、师友的记忆、他自己的讲法，各有各的版本，彼此并不冲突，却也不完全重合。\n\n他是北京大学哲学系教授、宗教文化研究院名誉院长，在燕园执教六十六年。二十世纪的中国哲学史有几条绕不开的谱系，北大一脉，冯友兰、汤用彤、张岱年、汤一介之后，楼宇烈是承上启下的那一位〔本文判断〕。但他的学问不太像一座“体系”。没有宏大的形而上学建构，没有一以贯之的范畴表，留下的是两部校释、一部资料汇编、若干册讲录，还有满校园的曲声、琴声与墨迹。\n\n这或许正是他的特别处。他把“中国哲学”这件事，做成了几种很具体的样子：在书桌上校一个字，在课堂上讲三个小时，在琴桌前听学生弹一句《流水》，在曲会上替人打拍子。学问不必都写成体系，也可以长在日用的分寸里。\n\n> **EN对应 · Opening**\n>\n> Professor Lou Yulie of the Department of Philosophy (and Religious Studies) at Peking University — also Honorary Director of the University's Institute of Religious Culture — died of illness in Beijing at 2:18 a.m. on 9 October 2026. The departmental obituary gives his age as ninety-two; by the calendar he was ninety-one full years (born 10 December 1934). Both figures are right; only the counting differs. His life was often like that: for the same event, the official account, the memories of teachers and friends, and his own telling each have their version — never contradicting one another, never quite coinciding either.\n>\n> He taught in the Yan Garden for sixty-six years. In twentieth-century Chinese philosophy there are a few lineages one cannot go around; in the Peking University line, after Feng Youlan, Tang Yongtong, Zhang Dainian and Tang Yijie, Lou Yulie was the figure who carried it forward [author's judgment]. Yet his learning does not really look like a \"system\": no grand metaphysical architecture, no single table of categories. What he leaves are two collated editions, one sourcebook, several volumes of talks, and a campus full of the sounds of the qin and of kunqu.\n>\n> That may be precisely what made him distinctive. He made \"Chinese philosophy\" into several very concrete things: collating a single character at his desk, lecturing for three hours in a classroom, listening to a student play a phrase of *Flowing Water* at the qin table, beating time for singers at a qu society gathering. Learning need not all be written as a system; it can also grow in the measure of everyday life.\n\n## 一、九十二载：从杭州到燕园\n\n### 1.1 家世与少年\n\n楼宇烈祖籍浙江嵊县，1934年12月10日生于杭州，出生不久随父母迁居上海。嵊县旧属绍兴府，文风颇盛；到他这一代，家里已是在上海过日子的普通人家。他的中小学教育在上海完成，1955年毕业于浦光中学（其前身为青年会中学）〔待核〕。\n\n童年在上海弄堂里度过，他晚年承认自己“贪玩，小学三年级还留过级”，又拆坏过家里的手表、自制过警铃（其子楼开睿转述，澎湃新闻，2026-10-16）。一个拆手表的孩子，后来成了给古籍“拆”出校释的学者——动手的习惯没变，只是对象换了。1955年北上入学，正赶上宿舍紧张，他一度暂住北大食堂（澎湃新闻，2026-10-16）。住食堂的少年大概不会想到，自己会在这园子里待上七十年。\n\n据他晚年自述，少年时文史与数理都感兴趣，成绩也不偏废。1955年填志愿，他看见北大哲学系的课程里既有中国哲学史、西方哲学史，也有高等数学与自然科学概论，觉得这门学问“两边都管”，便把北大哲学系填了第一志愿〔大意〕。那年全国设哲学系的高校极少，北大是其中最重要的一所；他那一届，也是北大哲学系全面实行五年制本科的第一届〔待核〕。\n\n### 1.2 五年制本科与几位老师\n\n1955年入学，1960年毕业。五年里，他受教于冯友兰、汤用彤、张岱年诸先生，也听过任继愈、朱谦之的课。各家报道所记名单并不一致，冯、汤、张三位较为一致，任、朱之说则见于不同访谈，详见附录 C。这种不一致本身并不奇怪：那一代学人的师承，往往不是一份课表能说清的。\n\n课堂之外的师承，他晚年说得更具体：他曾到研究东方哲学的朱谦之家中听日本哲学与宗教，又到研究荀子思想的梁启雄家中上课。他回忆说：“我觉得跟着老师学习，除了在课堂上听他们讲课之外，更重要的是课下的相互交流。”（北京大学融媒体中心稿，2026-10-15）课表本身也很有意思：北大哲学系既讲马列经典与中西哲学史，也开自然科学课程，每周三晚有自然科学前沿讲座，二年级还要修高等数学。他后来多次说，选哲学正是因为这门学问“兼容文理”〔大意〕。一个文理兼修的课程表，日后长成了一个贯通人文与技艺的学问格局。\n\n<!--IMG:1-1-->\n<figure class=\"doc-fig\" style=\"margin:18px auto;max-width:820px;text-align:center\">\n<img class=\"doc-img\" src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cf/Weiming_Lake%2C_Peking_University%2C_2011042205.jpg/960px-Weiming_Lake%2C_Peking_University%2C_2011042205.jpg\" alt=\"北京大学未名湖湖景\" loading=\"lazy\">\n<figcaption style=\"font-size:.78em;color:var(--text2);line-height:1.85;max-width:760px;margin:6px auto 0\">\n图 1-1　【C·场所参照】北京大学未名湖（2011 年春景）——湖面与岸树春景，即楼先生求学、执教、办曲会七十年之燕园·2011-04-22 摄·北京大学未名湖。**边界**：此为未名湖环境照，**图中无楼宇烈本人**，亦非其曲会或课堂实景；仅作燕园场所参照。<br>\n<div class=\"en-line\" style=\"font-size:.95em\">EN — Weiming Lake, Peking University (spring 2011) — the lake and its spring shoreline — the Yan Garden where Lou studied, taught and held qu gatherings for seventy years Boundary: A scene of the lake itself — Lou Yulie does not appear in the image; environmental reference only.</div>\n图源：Wikimedia Commons（CC0 1.0，作者：Huangdan2060）；详目与著录见文末〔▲图像登记〕「weiming-lake-cc0」。\n</figcaption>\n</figure>\n<!--/IMG:1-1-->\n\n\n\n有一件事后来被他反复提起。朱谦之当年有一个“东方哲学”的构想，想把中国、印度、日本、阿拉伯的思想放在同一个视野里讲。这个构想在当时近乎空想，却在他心里埋了种子。1980年代他重建北大东方哲学教研室，接的正是这条线〔本文判断〕。2019年朱谦之纪念会上，他还以视频致辞回忆随朱先生上课的情形〔待核〕。\n\n本科阶段，他已经对王弼发生兴趣。据其自述，那时便开始搜集王弼著作的各种版本与研究资料，毕业后仍继续访书、钞录，前后将近二十年〔大意〕。一部《王弼集校释》，起点其实在学生时代的一张书单上。\n\n### 1.3 十九年助教\n\n1960年7月毕业留校，到1979年5月，他在助教的位置上待了十九年。这十九年，正是中国高等教育变动最剧烈的十九年。\n\n1961年底，他被借调到高校文科教材编写组，参与任继愈主持的《中国哲学史》（人民出版社，四卷本高校文科教材）的编写（北京大学融媒体中心稿作“编纂”）。这里须辨明两部教材：任继愈主编的四卷本之外，中华书局1980年3月另出《中国哲学史》（上、下），署“北京大学哲学系中国哲学史教研室编写”——北大继续教育学院官方著述目录著录他为该书**统稿者**，《荀子新注》亦著录为“主要统稿者”；旧说他“承担主要执笔与统稿工作”若系于任编四卷本，未见直接出处〔待核〕。两书均被高校广泛采用。其实他与教材的缘分更早：1959年下半年起，本科尚未毕业，他便参与北大哲学系的教材编纂，负责文献搜集，常到旧书店淘书；借调期间又结识石峻等学界前辈（北京大学融媒体中心稿，2026-10-15）。编教材的经历给了他一个很实在的体会：不讲佛教，隋唐以后的中国哲学史就讲不透。禅宗、华严、天台，不只是几个宗教派别，而是那一时期思想史的主干。他后来深入佛学，契机就在这里〔大意〕。\n\n1964年，他完成《王弼集校释》初稿。稿子放进抽屉，一放就是十六年。\n\n这期间他也下过放。京郊的六郎庄、首钢，江西的煤矿，都去过（澎湃新闻，2026-10-16／2026-10-21）。白天劳动，夜里就着煤油灯读书做笔记（同上）。这些话是他晚年接受访谈时说的，听来平淡，放在那个年代却并不轻松：一个三十岁上下的青年助教，不知道自己的学问还有没有用处，只能把能做的事做下去。\n\n1979年2月，他召集完成的《荀子新注》由中华书局出版。因为当时的署名规矩，书上只写“北京大学《荀子》注释组”，没有个人名字。那年他四十五岁，出的第一部书，不算自己的。\n\n### 1.4 收获期\n\n1979年6月，他结束十九年助教生涯，晋升讲师；1980年12月升副教授；1985年9月升教授；1990年起任博士生导师（北大继续教育学院官方著述目录）。\n\n1980年，《王弼集校释》出版。这部书系统整理了王弼的《老子道德经注》《周易注》及相关佚文，校勘、标点、注释俱全，至今仍是王弼研究与魏晋玄学绕不开的文本。书名取自早已佚失的《王弼集》，有存亡继绝之意〔待核〕。此后他又从其中析出《老子道德经注校释》（2008）与《周易注校释》（2012），分别单行。\n\n1980年代初，国内重点大学图书馆里甚至找不齐一部汉文大藏经，佛教原典极度匮乏。他与石峻、方立天、许抗生、乐寿明等学者共同编纂《中国佛教思想资料选编》，1981年至1992年陆续出齐，共四卷十册。前九册按汉魏至民国时序收录中国本土佛教文献，第十册收重要汉译佛典。九〇年代进入佛教研究的人，几乎都用过这套书。它不是什么高头讲章，却是整个学科的地基。\n\n同一时期，他主持编纂《康有为学术著作选》，1984年至1992年出版，是康有为著作的第一部系统整理本，对近现代中国哲学研究推动很大。所收种数，一说七种，一说十种，见附录 C。\n\n在学科建制上，他1979年至1984年任中国哲学史教研室副主任〔待核〕，后来任哲学系副主任（一说1987年至1993年，一说只做了一届）〔待核〕，1985年12月起任东方哲学教研室主任，1986年重建该室〔待核〕（“1985年12月起任主任”见北大继续教育学院官方著述目录；同页并载1989年3月起兼宗教研究所所长、1989年12月起任校学术委员会委员）。此外，他曾任北京大学学术委员会委员、国务院学位委员会学科评议组成员、全国古籍整理出版规划领导小组成员、中国宗教学会副会长及顾问等职〔待核〕；身后亦见中国人民大学佛教与宗教学理论研究所（教育部人文社科重点研究基地）以“我所学术委员会主席”之称悼念他（该所官网，2026-10-20）——他与人大这所佛教研究重镇的这一层关系，此前少见于媒体的生平叙述。\n\n这些职务里，最见分量的是东方哲学教研室。1980年代中期，“西化即现代化”还是主流思路，重建东方哲学教研室近乎逆流而行。他从朱谦之的旧构想出发，把中国、印度、日本、阿拉伯哲学重新纳入课程，团队里有魏常海、姚卫群，后来又有沙宗平、周学农、李四龙等人〔待核〕。一个教研室，撑起了一个学科方向。\n\n### 1.5 晚年\n\n2003年，他六十九岁，正式退休〔待核〕。退休之后反而更忙：受聘为北大国学研究院“中国传统文化博士生研究班”导师，兼任宗教研究所所长、京昆古琴研究所所长，后来是宗教文化研究院名誉院长。\n\n2016年，《中国文化的根本精神》由中华书局出版，获第十二届文津图书奖，并入选全国中小学生阅读指导目录。这是他影响最广的一本书，讲的不是玄学，而是中国人如何“以人为本”地安顿自己。\n\n2019年，他因腹主动脉瘤接受手术，此后行走不便，多靠轮椅。但每周五晚的线上师生讨论会没有停。2025年11月28日，北大哲学系与中华书局为《楼宇烈文集》举行首发式暨执教六十五周年座谈会，他在会上回顾了自己的学思历程（凤凰网佛教，2025-11-28）。八卷九册，二百八十余万字，算是给六十五年教学生涯做了一个结。\n\n他最后一年的日程仍然很满。2026年7月，北大举行东方哲学学科建设研讨会，他以视频致辞，呼吁立足中国文化主体性、深化东方哲学研究；9月教师节，十余名学生登门拜访，身着唐装的他兴致盎然地与大家谈文化自信；9月18日下午的师生视频讨论中，他勉励大家保持文化自信与文化自觉，在场的张素闻回忆，他还郑重地向大家表达了感谢（北京大学融媒体中心稿，2026-10-15）。这次相聚还有一个约定：大家商量着在他12月生日时再聚，把他多年为学生和朋友写下的题跋汇集起来。那时，下一次见面还是一件可以期待的事——三周之后，10月9日凌晨2时18分，他在北京去世，官方讣告称“中国共产党优秀党员，我国著名哲学家、中国哲学史家、宗教学家、佛学家”；家属转述院方告知的死因是多脏器功能衰竭〔待核〕。\n\n身后的哀荣朴素而隆重。灵堂设在李兆基人文学苑1号楼108会议室，10月12日至14日接受吊唁；吊唁者经过院前泛黄的榆树，进入缅怀室，拿起一枝白菊，鞠躬敬献（《中国教育报》2026-10-15）。10月15日上午，遗体告别仪式在八宝山殡仪馆东厅举行，中央宣传部副部长王纲、北京大学党委书记何光彩、国际儒学联合会常务副会长郝平等出席；中央组织部、中央宣传部、教育部、国际儒学联合会、国家图书馆、中国宗教学会、中国佛教协会等单位敬献花圈、挽联或发来唁电，家乡嵊州市委、市政府领导亦到现场（北京大学新闻网，2026-10-15）。灵前的挽联写道：“一代硕师启大雅灵襟，立德立人立道本；千秋遗范传中华文脉，有典有则有温情。”\n\n> **EN对应 · One: Ninety-Two Years — From Hangzhou to the Yan Garden**\n>\n> **Origins and youth.** Lou Yulie's ancestral home was Sheng County, Zhejiang (today Shengzhou, Shaoxing); he was born in Hangzhou on 10 December 1934 and moved with his parents to Shanghai soon after. He grew up in a Shanghai alleyway. He later admitted he was a playful child — held back a year in the third grade, took apart the family watch, built his own burglar alarm (as his son Lou Kairui recalls, *The Paper*, 16 Oct 2026). A boy who takes watches apart later became a scholar who \"takes apart\" the classics in order to collate them; only the object changed. He finished his secondary education at Puguang Middle School (formerly the YMCA Middle School) [to be verified]. In 1955, drawn by a curriculum that \"covered both the humanities and the sciences,\" he chose Peking University's philosophy department as his first preference — then the country's most important such department, and his cohort the first to take the full five-year undergraduate programme. On arrival he lodged for a time in the university dining hall, housing being tight (*The Paper*, 16 Oct 2026).\n>\n> **Five years, and several teachers.** He enrolled in 1955 and graduated in 1960, studying under Feng Youlan, Tang Yongtong and Zhang Dainian, and attending classes of Ren Jiyu and Zhu Qianzhi. The lists differ from account to account (see Appendix C). Beyond the classroom he later recalled going to Zhu Qianzhi's home to hear lectures on Japanese philosophy and religion, and to Liang Qixiong's home for classes on Xunzi: \"Besides hearing teachers lecture in class, what matters even more is the exchange after class.\" The timetable itself was telling — Marxist classics and the history of Chinese and Western philosophy, but also natural science, a Wednesday-evening lecture series on frontiers of science, and higher mathematics in the second year. One of his undergraduate enthusiasms was Wang Bi; he began collecting editions of Wang Bi's works then, and kept at it for nearly twenty years.\n>\n> **Nineteen years as a teaching assistant.** He stayed on as a teaching assistant from July 1960 to May 1979 — through the most turbulent decades of Chinese higher education. From late 1959 he worked on departmental teaching materials, hunting down books in second-hand shops; at the end of 1961 he was seconded to the national writing group for humanities textbooks, joining Ren Jiyu's compilation of *A History of Chinese Philosophy* (People's Press, four volumes) and meeting senior scholars such as Shi Jun. Two textbooks must be distinguished: besides Ren's set, the Zhonghua Book Company issued a separate *History of Chinese Philosophy* (2 vols., March 1980) under \"PKU Department of Philosophy, Section of Chinese Philosophy History\"; the university's official publication list records Lou as its chief coordinator (*tonggao*), and likewise chief coordinator of the *Xunzi*. The older claim that he was principal writer and coordinator of Ren's set has no direct source [to be verified]. Compiling that book taught him a plain lesson: without Buddhism, the history of Chinese philosophy after the Sui and Tang cannot be told properly — the Chan, Huayan and Tiantai traditions were not sectarian side-notes but the main trunk of that era's intellectual history. That was his entry into Buddhist studies. In 1964 he completed the draft of *Collected Works of Wang Bi, Collated and Annotated*; it went into a drawer for sixteen years. He was also sent down to labour — Liulangzhuang near the Summer Palace, Shougang, and the Anyuan coal mines in Jiangxi — reading and taking notes at night by kerosene lamp (*The Paper*, 16 & 21 Oct 2026). In February 1979 the *New Annotations to the Xunzi* appeared under the collective byline \"Peking University Xunzi Annotation Group\": his first book, published at forty-five without his name on it.\n>\n> **The harvest years.** Lecturer in 1979, associate professor in 1980, full professor in 1985, doctoral supervisor from 1990 (PKU official publication list). The *Wang Bi* book finally appeared in 1980 (reprinted 1984), after further revision before submission in 1978; single-volume editions of Laozi and Zhouyi annotations followed in 2008 and 2012. In the early 1980s, when university libraries could barely assemble a complete Chinese Buddhist canon, he and Shi Jun, Fang Litian, Xu Kangsheng, Le Shouming and others compiled the *Selected Source Materials on Chinese Buddhist Thought* (1981–1992, four volumes in ten parts) — the groundwork of a whole discipline. He also directed the *Selected Scholarly Works of Kang Youwei* (1984–1992) — seven titles in all, from the *Analects Commentary* (Jan 1984) to *Kang Nanhai's Autobiographical Chronology* (Sept 1992), per the official publication list; Chen Lai's \"ten titles\" is uncorroborated. Institutionally, the weightiest act was rebuilding the Teaching and Research Section for Oriental Philosophy in 1985–86 — against the then-current assumption that \"modernisation means Westernisation\" — with Wei Changhai, Yao Weiqun, and later Sha Zongping, Zhou Xuenong and Li Silong. He also served on the University Academic Committee, the State Council's degree committee, the national planning group for classical-text publication, and as vice-president (later adviser) of the Chinese Association for Religious Studies; after his death the Institute of Buddhist and Religious Studies at Renmin University mourned him as \"Chair of our Academic Board\" (20 October 2026).\n>\n> **The last years.** He retired formally in 2003 (aged sixty-nine) but grew busier: supervisor of the university's traditional-culture doctoral programme, director of the Institute of Religious Studies and of the Jing-Kun-Qin Institute, later Honorary Director of the Institute of Religious Culture. *The Fundamental Spirit of Chinese Culture* (2016) won the Wenjin Book Award and entered the national reading list for primary and secondary students. Abdominal aortic surgery in 2019 left him using a wheelchair, but the Friday-evening online seminar never stopped. On 28 November 2025 the department and Zhonghua Book Company launched the eight-volume *Collected Writings of Lou Yulie* (over 2.8 million characters) at a symposium marking sixty-five years of his teaching. His final months stayed full: a video address to a symposium on Oriental philosophy in July 2026; a Teachers' Day visit from a dozen-odd students in September, in his tangzhuang, talking about cultural confidence; the video meeting of 18 September in which, as Zhang Suwen recalls, he thanked everyone solemnly. There was even an appointment to keep — to gather, by his December birthday, the calligraphic inscriptions he had written over the years for students and friends. Three weeks later, at 2:18 a.m. on 9 October, he died. The official obituary styled him \"an outstanding member of the Communist Party of China, distinguished philosopher, historian of Chinese philosophy, religious studies scholar and Buddhist studies scholar.\" A mourning hall was set up in the Lee Shau Kee Humanities Building (12–14 October); the farewell ceremony was held on the morning of the 15th at the Dong hall of Babaoshan Funeral House, attended by Wang Gang (Deputy Minister of the Publicity Department), He Guancai (Party Secretary of Peking University), Hao Ping (Executive Vice-President of the International Confucian Association) and others, with condolences from the Organisation and Publicity Departments, the Ministry of Education, the National Library, the Chinese Association for Religious Studies, the Buddhist Association of China and others. The elegiac couplet read: \"A great teacher of the age, opening generous minds of the high tradition — establishing virtue, establishing people, establishing the root of the Way; an eternal model transmitting China's cultural lineage — with canon, with rule, with warmth.\"\n\n## 二、三不堂：人格与生死\n\n### 2.1 一个堂号\n\n他的书房叫“三不堂”。\n\n三不就是：不苟为，不刻意，不执著。完整一点说，“不苟为，唯贵当；不刻意，顺自然；不执著，且随缘”。三句分别取自荀子、庄子与佛家：荀子《不苟》讲君子不苟且，凡事求一个“当”；庄子《刻意》讲不刻意求道，顺自然而行；佛家讲随缘，不恋过去，不盼未来。\n\n这个堂号有意思的地方，在于它不是拼贴。三句话对应他毕生用功的三个领域，也对应他做人的三种分寸：该认真处认真，该放手处放手，该随缘处随缘。他把儒释道讲了一辈子，最后浓缩成书房墙上的九个字。学问做到这个份上，才算真正落到了自己身上。\n\n对年轻人，他把“三不”翻成更白话的九字：“拿得起，看得开，放得下。”儒家教你拿得起，是承担责任、知道自己的分位；道家教你看得开，是知足、不盲目攀比；佛家教你放得下，是不沉湎过往、不奢求未来。他反对一味内卷，也反对消极躺平，话说得很直：“活好自己就是主流。”〔大意〕面对年轻人的精神焦虑，他还开过一剂“三乐汤”：助人为乐、知足常乐、自得其乐（《中国教育报》2026-10-15）。三个词都是旧话，从他嘴里说出来，因为有下文的生活垫底，就不显得是劝世文。\n\n### 2.2 不争\n\n据其子楼开睿回忆，楼宇烈做哲学系副系主任时，每逢职称评审，家里总有人登门倾诉、抱怨，吵得不安宁。做完一届，他便坚决辞去行政职务，把精力放回教学与研究〔待核〕。这话听起来像抱怨，其实是选择：行政的位置能让一个人做很多事，也能让一个人做不成事。他算得很清楚。\n\n对荣誉，他的态度是：落在身上就接受，得不到不主动钻营，事后再不与人争辩〔大意〕。漫长助教生涯的清苦，第一部书不署自己的名字，这些事放在别人身上，难免要提几句。长期共事的李中华与陈来都说，从没听他抱怨过。陈来用王阳明式的“不动心”来形容他〔待核〕。\n\n陈来还讲过一件事。1992年北大成立中国传统文化研究中心，校方原有意请楼先生领衔，后来改由他人主持。他照常参加中心的活动，该做什么做什么，看不出半点芥蒂〔待核〕。这种事最能见人：不是没有得失心，而是得失心不起作用。\n\n### 2.3 生死与日常\n\n他晚年常说，自己最推崇苏东坡。尽人事，听天命，心安而无怨。活到九十二岁，已经很知足〔大意〕。\n\n2019年那场腹主动脉瘤手术，医生把利害说得很清楚。他听完，说了一句大意是“老天爷要我走，那就走了”的话〔待核〕。这话不是豪言，倒像一个读过《淮南子》的人的自然反应。《淮南子》说“明死生之分则寿矣”，把生死看明白了，寿数反而长。\n\n他的养生之道叫“三理养生”，核心是顺其自然。引曾国藩的话：治心病以“广大”为药，治身病有时以“不药”为药〔待核〕。他八十岁前不主动体检，牙齿掉光后也不肯戴假牙〔待核〕。这些习惯未必值得效法，但确实是他的活法：不跟身体较劲，也不跟命较劲。\n\n生活上，他住北京西郊一个老旧小区的一楼，玄关与客厅堆满书。有人问他这么多书怎么看得完，他只说四个字：“敬惜字纸。”（北京日报，2026-04-24）书不是用来读完的，是用来敬的。这话很旧，也很重。\n\n他的朴素是弟子们有目共睹的。孙国柱说：“先生是通透豁达的人，没有太多物欲。”最喜爱的米黄色挎包用了多年，脚上穿的是十几元的布鞋（《中国教育报》2026-10-15）。但朴素之外，他并不守旧，反而很“摩登”：20世纪80年代赴日本访学期间，他几乎倾尽个人经费购置电脑，是北大哲学系最早接触计算机的学者（《中国教育报》2026-10-15）。九旬之后，他仍对新鲜事物保持兴趣，喜欢尝试电子产品（同上）。这两面放在一起才完整：一个敬惜字纸的人，也可以是系里第一个买电脑的人——他从来不把“传统”理解成拒绝新工具，他拒绝的只是把人变成工具的用法。\n\n对现实，他并不回避。谈食品安全，他说根源在文化生态：逐利成了最高准则，又缺少敬畏与道义约束〔大意〕。谈人工智能，他说独一无二的生命体悟是机器取代不了的，主张“人文立本，科技为用”〔大意〕。一个九旬老人谈 AI，谈的不是技术，还是人。\n\n> **EN对应 · Two: The Sanbu Tang — Character and Life-and-Death**\n>\n> **The studio name.** His study was called the Sanbu Tang — the Hall of the \"Three Non-acts\": 不苟为 (not acting carelessly), 不刻意 (not forcing), 不执著 (not clinging). In full: \"Not acting carelessly — act only as is fitting; not forcing — follow nature; not clinging — go with conditions.\" The three clauses draw respectively on Xunzi (the Confucian *Bu Gou*), Zhuangzi (the *Ke Yi*), and Buddhism. What makes the name interesting is that it is not a collage: the three clauses answer to the three fields of his life's work and to three kinds of measure in his conduct — be earnest where earnestness is due, let go where letting go is due, go along where going along is due. He lectured on Confucianism, Daoism and Buddhism his whole life, and distilled them into nine characters on his study wall; learning that has landed on the person himself. To young people he put the \"Three Non-acts\" more plainly: \"able to take it up, able to see through it, able to let it go\" — Confucianism teaches you to take it up (responsibility, knowing your place); Daoism to see through it (contentment, no blind competition); Buddhism to let it go (no brooding on the past, no craving the future). He opposed both involution and passive lying-flat: \"Living your own life well is already the mainstream.\" For the anxieties of the young he also prescribed a \"Three Joys Decoction\": the joy of helping others, the joy of contentment, the joy of self-possession.\n>\n> **Not competing.** His son Lou Kairui recalls that when Lou Yulie was deputy chair of the philosophy department, promotion season brought colleagues to the door to complain, and the house was in an uproar; after one term he resigned the administrative post firmly, to return his energy to teaching and research. Honours: accept what lands on you; never lobby for what does not; never argue afterwards. Li Zhonghua and Chen Lai, who worked with him for decades, say they never heard him complain; Chen Lai likens him to the \"imperturbable mind\" of Wang Yangming. In 1992, when the university's Centre for Traditional Chinese Culture was founded and the authorities first intended him to lead it before turning to someone else, he simply kept taking part as usual [to be verified]. This is the kind of episode that shows a person: not that he had no sense of gain and loss, but that it never got a vote.\n>\n> **Everyday life, and death.** He admired Su Dongpo most: do what is in your power, accept what Heaven ordains, be at peace and without resentment; living to ninety-two, he was content. When the 2019 surgery was explained to him in the starkest terms, he said, in gist, \"If Providence wants me, I'll go\" [to be verified] — not heroism but the natural response of a reader of the *Huainanzi* (\"Understand the division of life and death, and you will be long-lived\"). His regimen of \"three principles of health-cultivation\" was simply to follow nature; he quoted Zeng Guofan: for the ailments of the heart, the medicine is \"breadth\"; for the ailments of the body, sometimes the medicine is \"no medicine.\" He did not seek check-ups before eighty, and refused dentures after losing his teeth — habits not worth copying, perhaps, but genuinely his: no fighting the body, no fighting fate. He lived in a ground-floor flat in an old compound in western Beijing, the entry and living room stacked with books; asked how he could possibly read them all he said only: \"Revere written paper\" — books are not for finishing, they are for revering. He was frugal to the last: the same beige satchel for years, cloth shoes that cost a dozen yuan (Sun Guozhu). Yet frugal did not mean old-fashioned: on a study trip to Japan in the 1980s he spent nearly all his allowance on a personal computer — reportedly the first scholar in the department to use one — and in his nineties he still liked trying new gadgets. The two sides complete each other: a man who reveres written paper can also be the first in the department to buy a computer; what he refused was never new tools, only the way of using them that turns people into tools. He did not dodge reality: on food safety he traced the root to a culture in which profit became the highest rule without awe or moral restraint; on artificial intelligence he held that the singular experience of a living person is what machines cannot replace — \"humanity as the foundation, technology as instrument.\" A man of ninety talking about AI was still talking about people.\n\n## 三、师道：课堂、学生与“楼体悟”\n\n### 3.1 三个小时与一个标点\n\n他终身服膺冯友兰的一句话：做学问要让完全外行的人听得懂，同时让内行的人觉得有新意〔大意〕。这句话听起来是表达技巧，其实是学术标准：讲不清，多半是想不清。\n\n年轻时上课，他早上七点半准时走进教室，一站三个小时，身后黑板写满历代注释。读文献“一个标点都不放过”〔待核〕。他的课不靠段子，靠材料；不靠气势，靠分寸。学生后来回忆，最怕他问“这条注出自哪里”，也最服他能把一条注的来龙去脉讲半小时。\n\n弟子金勋（北京大学外国语学院教授）追忆老师上课：几乎不看讲稿，一支粉笔在手，宛若执起毛笔，在黑板竖排写下繁体字，随讲随圈点批注，身姿舒展，如行云流水；“整堂课一气呵成，大家都享受其中。”（《中国教育报》2026-10-15）课堂之外，每周一下午还有三个小时的答疑课，不只面向在校学生，天南地北的爱好者都可前来问学；他常身着唐装，桌前摆上自带的清茶，由听众的问题开启，博古通今，旁征博引。这答疑课后来从线下转到线上，直到辞世前的9月，他仍守在屏幕前为各地听众解惑。\n\n他对“深入浅出”的解释，也是他的自我要求：“所谓‘浅出’，就是让从未接触过这个领域的人也能基本听懂我所讲授的内容；所谓‘深入’，则是让专门从事该领域研究的人能从中获得新的启发。”（《中国教育报》2026-10-15）李海峰见他年岁渐高仍四处奔走讲学，忍不住问：“您打算讲到什么时候呢？”他答道：“最理想的方式，是在讲台上讲到离开。”（同上）他最后确实没有离开讲台太久——9月还在讲，10月上旬便走了。\n\n### 3.2 提携后学\n\n1978年北大恢复研究生招生，他鼓励比自己小十岁的李中华报考。李中华外语只考了五十九分，他笑着说“可以了”，把人领进了中国哲学史的门〔待核〕。后来李中华成了北大教授，与他共事数十年。这种提携不是客套，是把自己的学术判断押在别人身上。\n\n中国社科院哲学所的张志强、南京大学的洪修平、人民大学的张风雷，都感念他的循循善诱〔待核〕。2025年11月的座谈会上，已是社科院哲学研究所所长的张志强，谈起老师言传身教给予自己一生受用的“为学工夫”；硕士阶段师从他的北大博雅特聘教授王中江说，先生身上充满着学术精神、人文精神，也充满诗意和情怀（北京大学融媒体中心稿，2026-10-15）。六十余载从教，他先后指导百余名海内外硕博研究生、进修教师与访问学者（《中国教育报》2026-10-15）。\n\n他看学生，先看性情与底子，再看题目。沙宗平出身宗教院校，宗教文献功底好，他便建议他发挥所长，再用现代学术方法加以分析，不必硬套哲学系的套路〔待核〕。因材施教四个字，说起来容易，做起来要先肯承认学生与自己不同。待人上还有一条不成文的规矩：同门聚会，一律先生买单——不许AA，也不许学生请客（沙宗平回忆，澎湃新闻，2026-10-21）〔待核〕。这件小事学生们记了几十年，因为它把“师”字落到实处：不是称呼上的老板，是饭桌上真的长辈。\n\n### 3.3 “楼体悟”\n\n七十岁前后，他常穿一件旧唐装，到北大禅学社与学生切磋。学生给他起了个外号，叫“楼体悟”（李四龙，《光明日报》2025-12-15；《中国教育报》2026-10-15亦称“学生们亲切地称呼他为‘楼体悟’”）。他讲过，中国学问不能只靠概念分析，还得有体悟；但体悟不是玄谈，是从读书、做事、待人里慢慢养出来的。这个外号里有亲近，也有几分准确的观察。\n\n他对学生的要求有一条很特别：作业不超过五千字。学生嫌少，他补一句：《老子》才五千言（《中国教育报》2026-10-15；李四龙，《光明日报》2025-12-15）。这不是抖机灵，是他真的觉得，话说清楚比说得多重要。\n\n他也直言，把导师称作“老板”是错误风气〔待核〕。师生不是雇佣关系，学问不是项目外包。这话在今天的大学里，听着有点不合时宜，却正是他一贯的立场。\n\n### 3.4 教育观\n\n他反对让学生背《弟子规》却做不到“父母呼，应勿缓”的形式主义〔待核〕。经典不是拿来表演的，是拿来做的。他常向教育工作者推荐三篇文章：柳宗元《种树郭橐驼传》、王阳明《训蒙教约》、龚自珍《病梅馆记》。三篇讲的都是同一件事：顺其天性，不要戕贼。他主张孩子要重视体育、艺术与劳动，落实儒家“学以成人”的本旨〔大意〕。\n\n他的教诲还走到课堂之外的人生大事里。有学生婚礼前请先生补行迟了多年的成人礼，礼毕，他以毛笔蘸朱砂，在他们手心写下为每个人想好的字；同门的婚礼设计各异，却常有一个相同环节——请楼老师向宾客讲述婚姻的意义以及对新人的期许。从毕业时自发举行的谢师礼，到依照古礼筹备的婚礼，先生的教诲渐渐融入学生的生活（北京大学融媒体中心稿，2026-10-15）。学生徐佳希写信请教人生困惑，他回信说：“来信收到，你的问题很多，不是一下子能解开和解决的，以后慢慢来吧。不过，人最重要的是当下（此时、此刻、此生）……做好了当下的人和事，又何须担忧未来呢？”又叮嘱一生要“存好心、说好话、做好事”（同上）。大道理他讲得浅，要紧的话他说得具体——这就是他的“深入浅出”在日用里的样子。\n\n九旬之后，他仍每周给毕业多年的博士生上半天课，内容多半是养心与修身（北京大学融媒体中心稿，2026-10-15）。博士生早已不需要学分，他还是讲。这说明他心里的“课”，本来就不是为学分设的。\n\n> **EN对应 · Three: The Way of a Teacher — Classroom, Students, and \"Lou Tiwu\"**\n>\n> He held to Feng Youlan's standard all his life: scholarship must be intelligible to a complete outsider while striking the specialist as genuinely new. That sounds like a rule of expression; it is really a rule of scholarship — if you cannot make it clear, you have probably not thought it through. In his early years he entered the classroom at half past seven and stood for three hours, the blackboard behind him filling with successive layers of commentary; in reading he \"let not a single punctuation mark pass.\" His lectures ran on materials, not anecdotes; on measure, not momentum. Jin Xun (Peking University) recalls him lecturing almost without notes, chalk in hand like a brush, writing traditional characters in vertical columns, circling and annotating as he spoke — \"one seamless performance that everyone enjoyed.\" Every Monday afternoon there were three further hours of open consultation — for students and for enthusiasts from anywhere; he sat in his tangzhuang with his own tea, and the session began from the audience's questions. It moved online in later years, and until September before his death he was still at the screen answering questioners across the country. His own gloss on \"profound yet accessible\": \"Accessible means that someone who has never touched the field can basically follow; profound means that the specialist still takes away something new.\" When Li Haifeng (Beijing Normal University) asked him how long he meant to keep lecturing, he answered: \"The ideal way would be to go on teaching until I leave.\" He did not leave the lectern for long — still teaching in September, gone in early October.\n>\n> He encouraged the young. In 1978, when Peking University resumed graduate admissions, he urged Li Zhonghua — ten years his senior in age — to sit the entrance exam; when Li's foreign-language score came in at 59, he laughed \"that'll do\" and led him into the field [to be verified]. Zhang Zhizhiang (Institute of Philosophy, CASS) spoke at the 2025 symposium of the \"craft of learning\" his teacher's example had given him for life; Wang Zhongjiang (Peking University), who studied under him at master's level, said the master was full of scholarly and humanistic spirit, and of poetic feeling. Over sixty years he supervised more than a hundred graduate students, visiting teachers and scholars from home and abroad. He matched instruction to the person: Sha Zongping, trained in a Buddhist academy with strong textual skills, was told to build on that strength and add modern analysis rather than force himself into the philosophy department's mould. And an unwritten rule at gatherings: the teacher always paid — no splitting the bill, no letting students treat (Sha Zongping's recollection). Small thing, remembered for decades, because it puts flesh on the word \"teacher\": not a boss in address, but an elder at the table.\n>\n> Around seventy he would come to the university's Chan Society in a well-worn tangzhuang, and the students nicknamed him \"Lou Tiwu\" — \"Lou Realisation\" (Li Silong; *China Education Daily*). He held that Chinese learning cannot rest on conceptual analysis alone; it needs personal realisation — but realisation is not mystification; it is slowly cultivated in reading, working and treating people. The nickname carries affection and a shrewd observation. His assignment rule was famous: nothing over five thousand characters; if pressed, he would add — \"the *Laozi* is only five thousand.\" And he said plainly that calling one's supervisor \"boss\" is a corrupt custom: teacher and student are not in an employment relation, and learning is not outsourced project work.\n>\n> He opposed the formalism of reciting the *Di Zi Gui* while failing its first line in practice. He often recommended three essays to educators — Liu Zongyuan's *Guo Tuozhang the Tree Planter*, Wang Yangming's *Rules for Educating Children*, Gong Zizhen's *The Sick Plum Garden* — all saying one thing: follow the child's nature, do not deform it; children need physical education, art and labour, which is what \"learning to become a person\" actually means. His teaching also walked into the great occasions of students' lives: before a wedding, a student asked him to perform belatedly the coming-of-age rite; after it he wrote in cinnabar, with a brush, on each palm the character he had chosen for that person; at weddings he would speak to the guests about the meaning of marriage and his hopes for the couple. When Xu Jiaxi wrote to him in perplexity about life, he replied: \"Your questions are many and cannot be untied at once; take your time. What matters most is the present — this moment, this hour, this life… If you do the present well, why worry about the future?\" And he charged his students to \"keep a good heart, speak good words, do good deeds.\" Even past ninety he still gave his long-graduated doctoral students a half-day class each week, mostly on nurturing the heart and cultivating the person. They no longer needed credits; he still taught. The \"class\" in his mind was never a credit-bearing unit.\n\n## 四、戏缘与艺道：从昆曲社到国艺苑\n\n### 4.1 1961年，昆曲研习社\n\n1961年，他加入北京昆曲研习社（谭惟，2026-11-06；李四龙，2025-12-15）。那正是他助教生涯最沉闷的几年：白天编教材、下放劳动，晚上读书。昆曲于他，起初大概只是一种消遣。\n\n北京昆曲研习社1956年由俞平伯创办，是新中国成立后最重要的业余昆曲团体之一。俞平伯是红学家，也是昆曲票友，曲社在他手里办得很有气象。楼宇烈在曲社里学唱、拍曲、听笛，一待就是几十年。他的博士生谭惟追记：楼先生自1987年3月9日第四届社委会起担任曲社主任委员（即社长），直至2004年第七届社委会卸任，其后任名誉社长；1996年还主持编印《谷音曲谱》四册（谭惟〈楼宇烈：教唱昆曲的“快乐老人”〉，《中国教育报》2026-11-06）。另有一说作“1987—2003年连续十五年担任社长”，两说相差一年，详见附录 C。1979年曲社社员在俞平伯家中聚会的一张合影里，张允和、周铨庵在前排，楼宇烈在后排中间，还很年轻（李四龙〈斯文在兹 修身为本〉，《光明日报》2025-12-15）。一个哲学系的青年教师，接了一位红学大家的班，与张允和这样的曲友同座，这在当时是件小事，放在今天看却很有意思：学问与艺事，本来就不是两截。\n\n<!--IMG:4-1-->\n<figure class=\"doc-fig\" style=\"margin:18px auto;max-width:820px;text-align:center\">\n<img class=\"doc-img\" src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/%E5%9C%8B%E6%96%87%E7%B3%BB%E6%95%99%E6%8E%88_%E4%BF%9E%E5%B9%B3%E4%BC%AF%E5%85%88%E7%94%9F_%28cropped%29.jpg/960px-%E5%9C%8B%E6%96%87%E7%B3%BB%E6%95%99%E6%8E%88_%E4%BF%9E%E5%B9%B3%E4%BC%AF%E5%85%88%E7%94%9F_%28cropped%29.jpg\" alt=\"俞平伯 1932 年半身肖像\" loading=\"lazy\">\n<figcaption style=\"font-size:.78em;color:var(--text2);line-height:1.85;max-width:760px;margin:6px auto 0\">\n图 4-1　【B·交游人物本人影像】俞平伯（1932 年燕京大学国文系教授时期肖像）——楼先生 1961 年加入之北京昆曲研习社的创办人，红学家、昆曲名家·1932 年·燕京大学。**边界**：此系**俞平伯本人**影像，**图中无楼宇烈**；楼先生 1979 年曾与曲社社员在俞宅聚会（本文所据合影另有著录），此照摄于 1932 年，非该次聚会。<br>\n<div class=\"en-line\" style=\"font-size:.95em\">EN — Yu Pingbo, professor of Chinese at Yenching University (1932) — founder of the Beijing Kunqu Research Society which Lou joined in 1961 Boundary: A portrait of Yu Pingbo himself; Lou does not appear. Taken in 1932, not at the 1979 gathering.</div>\n图源：Wikimedia Commons（公有领域，作者：〔待核〕摄影者（档案数据编号 Z027-KW-005136））；详目与著录见文末〔▲图像登记〕「yu-pingbo-1932」。\n</figcaption>\n</figure>\n<!--/IMG:4-1-->\n\n<!--IMG:4-2-->\n<figure class=\"doc-fig\" style=\"margin:18px auto;max-width:820px;text-align:center\">\n<img class=\"doc-img\" src=\"https://upload.wikimedia.org/wikipedia/commons/0/09/Zhang_Yunhe_1930.jpg\" alt=\"张允和 1930 年单人照\" loading=\"lazy\">\n<figcaption style=\"font-size:.78em;color:var(--text2);line-height:1.85;max-width:760px;margin:6px auto 0\">\n图 4-2　【B·交游人物本人影像】张允和（1930 年摄于上海南翔）——昆曲名家、周有光夫人，1979 年俞宅曲社合影前排右一即其人·1930 年·上海南翔。**边界**：此系**张允和本人**影像（1930 年），**图中无楼宇烈**；与本文所述 1979 年曲社合影非同一影像。<br>\n<div class=\"en-line\" style=\"font-size:.95em\">EN — Zhang Yunhe (1930, Nanxiang, Shanghai) — kunqu devotee (Mrs Zhou Youguang), seated front row in the 1979 Yu-home gathering photo Boundary: A 1930 portrait of Zhang Yunhe herself; Lou does not appear; not the 1979 group photo.</div>\n图源：Wikimedia Commons（公有领域，作者：〔待核〕摄影者）；详目与著录见文末〔▲图像登记〕「zhang-yunhe-1930」。\n</figcaption>\n</figure>\n<!--/IMG:4-2-->\n\n\n\n\n\n### 4.2 周三下午\n\n1987年至2003年，他任北大昆曲研习社社长〔待核〕。此后数十年，每周三下午，他都在北大校园里组织昆曲雅集，雷打不动（李四龙，2025-12-15）。夫人奚延玲——奚啸伯的次女，本身也是曲友——常伴左右，“一起唱，一起赏，一起为后学们打拍子”（张素闻，澎湃新闻，2024-01-10）。曲会没有主席台，也没有讲稿，一支笛、几个人、一下午。曲目时常更新，唯有一样不变：每堂课结尾固定唱《长生殿·惊变·粉蝶儿》——“天淡云闲，列长空数行新雁……”张素闻回忆，先生每年中秋晚会与国艺苑汇报演出都亲自上台打板唱这一支；曲词写的御园秋景，恰似北大勺园的秋日风光（《中国教育报》2026-10-15）。一个固定收梢的曲牌子，被他唱成了校风的一部分。\n\n2005年春，白先勇制作的青春版《牡丹亭》即将在北大百周年纪念讲堂演出，楼先生应北大京昆社之邀，为学生讲了一讲“昆曲与非物质文化遗产”，谈曲词、表演，也谈这门艺术承载的文化记忆；同年4月，该剧在北大演出，一票难求（北京大学融媒体中心稿，2026-10-15）。白先勇、叶朗诸先生推动昆曲走进燕园，楼先生则用几十年的唱曲、拍曲，让青年在日常学习里就有机会接触昆曲——一场戏的热闹，背后是几十年不热闹的工夫。\n\n<!--IMG:4-3-->\n<figure class=\"doc-fig\" style=\"margin:18px auto;max-width:820px;text-align:center\">\n<img class=\"doc-img\" src=\"https://upload.wikimedia.org/wikipedia/commons/e/ed/%E7%89%A1%E4%B8%B9%E4%BA%AD_%E5%8C%97%E5%A4%A7%E7%99%BE%E5%B9%B4%E8%AE%B2%E5%A0%82_2.jpg\" alt=\"昆曲旦角舞台特写（北大百年讲堂《牡丹亭》演出）\" loading=\"lazy\">\n<figcaption style=\"font-size:.78em;color:var(--text2);line-height:1.85;max-width:760px;margin:6px auto 0\">\n图 4-3　【C·场景参照】昆曲《牡丹亭》演出剧照（2014 年·北京大学百周年纪念讲堂）——旦角侧脸含笑，点翠头面粉色戏衣——即楼先生数十年倡导之昆曲舞台·2014 年·北京大学百周年纪念讲堂。**边界**：此为 **2014 年**北大百年讲堂《牡丹亭》演出照，**非 2005 年白先勇青春版**那次一票难求的演出（本文 §4.2 所述者），**图中无楼宇烈本人**；仅作「北大舞台上的牡丹亭」之场景参照。<br>\n<div class=\"en-line\" style=\"font-size:.95em\">EN — Kunqu *Peony Pavilion* on stage, Peking University Centennial Hall (2014) — a dan-role close-up on stage — the art Lou championed for decades Boundary: A 2014 campus production — not Bai Xianyong's 2005 staging, and Lou does not appear.</div>\n图源：Wikimedia Commons（CC BY 2.5，作者：gcd0318）；详目与著录见文末〔▲图像登记〕「mudanting-pku-2014」。\n</figcaption>\n</figure>\n<!--/IMG:4-3-->\n\n\n\n2026年4月，他九十二岁，双腿已难站立，北京日报记者探访时请他唱曲，他爽快应允，哼唱起《牡丹亭·游园惊梦》：“原来姹紫嫣红开遍，似这般都付与断井颓垣……”字正腔圆，韵味十足（北京日报，2026-04-24）。一个研究魏晋玄学与华严宗的人，晚年最拿得出手的“绝活”，是一段昆曲。这件事本身就像一则注脚：中国传统的“雅”，从来不是书架上的，是能唱出来、能弹出来、能写出来的。\n\n<!--IMG:4-4-->\n<figure class=\"doc-fig\" style=\"margin:18px auto;max-width:820px;text-align:center\">\n<img class=\"doc-img\" src=\"https://upload.wikimedia.org/wikipedia/commons/3/35/Peony_Pavilion_-_dream_scene.jpg\" alt=\"明刻本牡丹亭游园惊梦木刻版画\" loading=\"lazy\">\n<figcaption style=\"font-size:.78em;color:var(--text2);line-height:1.85;max-width:760px;margin:6px auto 0\">\n图 4-4　【C·名相参照】明刻本《牡丹亭》「游园惊梦」木刻版画（1618 年臧懋循改本《还魂记》插图）——园林中入梦场景的线刻版画——「原来姹紫嫣红开遍」的图像化·1618 年（明万历末）·中国。**边界**：此为**明刻本书籍插图**，非演出照、**图中无楼宇烈本人**；其版刻年代远早于今之昆曲舞台，仅作「游园惊梦」意象之名相参照。<br>\n<div class=\"en-line\" style=\"font-size:.95em\">EN — Ming woodcut of the \"dream\" scene, *Peony Pavilion* (1618 abridgement) — a line-cut of the garden dream scene — the imagery of \"flowers bloom in splendour\" Boundary: A book illustration of 1618, not a stage photo; imagery reference only.</div>\n图源：Wikimedia Commons（公有领域，作者：〔待核〕刻工（原书未署））；详目与著录见文末〔▲图像登记〕「mudanting-ming-woodcut」。\n</figcaption>\n</figure>\n<!--/IMG:4-4-->\n\n\n\n### 4.3 国艺苑与古琴\n\n2003年前后，弹古琴的风气还很冷清。他自费在自家附近租了房子，买下古琴，办起“国艺苑”，请自己的学生、韩国僧人如山法师义务教琴。如山法师“以琴参禅”，是北大哲学系的博士，毕业后留在国艺苑义务教弹古琴，前后约二十年（张素闻，2024-01-10）。琴室不大，只摆得下六张桌、六张琴；每周一课，还备茶水茶点，学生一概免费，学成后在北大举行汇演（北京大学融媒体中心稿，2026-10-15）。办法很笨：不收费，不发文凭。二十年下来，教出的人不算多，却都是真弹的——李海峰记得，自己多年后工作繁忙，仍会弹一弹古琴。更要紧的是时间：这套免费的琴课一直办到他去世前一个月（《中国教育报》2026-10-15）。\n\n关于创办年份，中青报记作2003年，澎湃新闻记作2005年，并说他自掏经费〔待核〕。两个说法未必矛盾：租房、买琴、请人，可能前后拖了两年。北大京昆古琴研究所的创办年同样有两说：李四龙记2009年，谭惟则称2003年即推动成立，另记他2001年便出任“北大琴社”顾问〔待核〕。研究所把琴、曲、戏放进一个建制里，每年元旦前举办迎新年汇报演出。一个哲学教授，晚年花力气做这种事，旁人未必理解。他的理由很简单：艺不是消遣，是养心的工夫。\n\n<!--IMG:4-5-->\n<figure class=\"doc-fig\" style=\"margin:18px auto;max-width:820px;text-align:center\">\n<img class=\"doc-img\" src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Songhuizong_cropped_%E8%B5%B5%E4%BD%B6%E5%90%AC%E7%90%B4%E5%9B%BE%E8%BD%B4.jpg/960px-Songhuizong_cropped_%E8%B5%B5%E4%BD%B6%E5%90%AC%E7%90%B4%E5%9B%BE%E8%BD%B4.jpg\" alt=\"听琴图：松下抚琴与听琴人物\" loading=\"lazy\">\n<figcaption style=\"font-size:.78em;color:var(--text2);line-height:1.85;max-width:760px;margin:6px auto 0\">\n图 4-5　【C·名相参照】传宋徽宗赵佶《听琴图》（局部）——松下抚琴、二人听琴的绢本设色画——「琴道」在中国画中的经典图式·12 世纪（北宋）·中国。**边界**：此为**宋画名迹**，非国艺苑琴课实景、**图中无楼宇烈本人**；仅作琴道之名相参照。<br>\n<div class=\"en-line\" style=\"font-size:.95em\">EN — \"Listening to the Qin\", attributed to Emperor Huizong of Song (detail) — a player under pines with two listeners — the canonical image of qin culture Boundary: A Song-dynasty painting, not a scene of the Guoyi Yuan lessons; symbolic reference only.</div>\n图源：Wikimedia Commons（公有领域，作者：传 宋徽宗赵佶）；详目与著录见文末〔▲图像登记〕「tingqintu-song」。\n</figcaption>\n</figure>\n<!--/IMG:4-5-->\n\n<!--IMG:4-6-->\n<figure class=\"doc-fig\" style=\"margin:18px auto;max-width:820px;text-align:center\">\n<img class=\"doc-img\" src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/3/32/ZhongNiShi.jpg/960px-ZhongNiShi.jpg\" alt=\"仲尼式古琴琴面全景\" loading=\"lazy\">\n<figcaption style=\"font-size:.78em;color:var(--text2);line-height:1.85;max-width:760px;margin:6px auto 0\">\n图 4-6　【C·器物参照】仲尼式古琴「灵峰神韵」（器物照）——平置琴面全景，可见十三徽与断纹——国艺苑每期六琴所教之器·〔待核〕制琴年代（照片 2006 年上传）·〔待核〕藏所。**边界**：此为**一张具体古琴的器物照**，非国艺苑之琴、**图中无楼宇烈本人**；仅作器物参照。<br>\n<div class=\"en-line\" style=\"font-size:.95em\">EN — A zhongni-form guqin, \"Lingfeng Shenyun\" — full view of the instrument — the kind taught six at a time at the Guoyi Yuan Boundary: A particular instrument, not one of the Guoyi Yuan qin; object reference only.</div>\n图源：Wikimedia Commons（CC BY-SA 3.0，作者：CharlieHuang）；详目与著录见文末〔▲图像登记〕「guqin-zhongni」。\n</figcaption>\n</figure>\n<!--/IMG:4-6-->\n\n\n\n\n\n### 4.4 京剧一线：奚啸伯的女婿，欧阳中石牵的线\n\n“国艺”里包含京剧。楼先生与京剧界的关系，不是票友与名角的泛泛之交，而是一门实实在在的姻亲——他是京剧奚派创始人奚啸伯（1910—1977）的女婿。夫人奚延玲（1942— ）是奚啸伯的次女〔待核〕。这段婚缘的牵线人，正是奚派第一传人、书法家欧阳中石。\n\n楼宇烈本人说得最清楚。2020年9月下旬，张伯驹研究中心的张恩岭等人到楼家采访，夫人在座，楼先生聊起家常：“是的，我和延玲的婚事就是欧阳中石先生牵的线，奚啸伯先生是著名的京剧大家，一生很不容易。欧阳中石就是奚啸伯的学生，这就是人生机缘啊。我哥哥是张伯驹的女婿，这样我和张伯驹先生就成了亲戚，我很敬重张伯驹先生。”（张恩岭〈一片深情寄“书名”——怀念楼宇烈先生〉，周口日报，2026-10-13）这段话把三层关系一次说清：他的兄长楼宇栋（燕京大学毕业，著有《张伯驹传》）娶了收藏家张伯驹的女儿张传彩；他自己娶了奚啸伯的女儿；而欧阳中石既是张伯驹的学生，又是奚啸伯的弟子——几门亲事与师徒，都绕在京剧与旧京文化的这一张网上。\n\n<!--IMG:4-9-->\n<figure class=\"doc-fig\" style=\"margin:18px auto;max-width:820px;text-align:center\">\n<img class=\"doc-img\" src=\"https://upload.wikimedia.org/wikipedia/commons/f/f8/%E5%BC%B5%E4%BC%AF%E9%A7%92.jpg\" alt=\"张伯驹青年时期半身照\" loading=\"lazy\">\n<figcaption style=\"font-size:.78em;color:var(--text2);line-height:1.85;max-width:760px;margin:6px auto 0\">\n图 4-9　【B·交游人物本人影像】张伯驹（1931—1933 年间旧照，题「张监察伯驹」）——收藏家、民国四公子之一——楼先生长兄楼宇栋之岳父，姻亲网络之枢纽·1931—1933 年（《河南中原煤矿公司汇刊》）·河南焦作（出版地）。**边界**：此系**张伯驹本人**影像，**图中无楼宇烈**；摄于 1930 年代初，与楼张两家联姻年代无涉，仅作其人之证。<br>\n<div class=\"en-line\" style=\"font-size:.95em\">EN — Zhang Boju (c. 1931–1933) — the collector — father-in-law of Lou's elder brother, hub of the kinship web Boundary: A portrait of Zhang Boju himself; Lou does not appear.</div>\n图源：Wikimedia Commons（公有领域，作者：河南中原煤矿公司汇刊编辑室）；详目与著录见文末〔▲图像登记〕「zhang-boju-1931」。\n</figcaption>\n</figure>\n<!--/IMG:4-9-->\n\n\n\n欧阳中石（1928—2020）1950年考入辅仁大学哲学系，一年后转入北京大学哲学系，主修中国逻辑史，1954年毕业，比楼宇烈入校早一年——两人是北大哲学系的前后级，而非同窗〔待核〕。欧阳中石拜奚啸伯为师，是公认的“奚派京剧第一传人”，唱功几可媲美其师。他与王开生谈起旧事时说：“张伯驹有个女儿叫张传彩，其丈夫楼宇栋，毕业于燕京大学，著有《张伯驹传》；楼宇栋的胞弟楼宇烈，又是奚啸伯先生的女婿。”（王开生〈曲折高低声入耳 从容谈笑自生风——忆欧阳中石先生〉，国务院参事室网站转载，2020-11-07）两位老人，一位说“牵线”，一位说“女婿”，两处独立回忆互证，这层关系可以坐实。\n\n<!--IMG:4-7-->\n<figure class=\"doc-fig\" style=\"margin:18px auto;max-width:820px;text-align:center\">\n<img class=\"doc-img\" src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e6/Battle_of_Changban_Peking_Opera_3.jpg/960px-Battle_of_Changban_Peking_Opera_3.jpg\" alt=\"京剧长坂坡演出舞台照\" loading=\"lazy\">\n<figcaption style=\"font-size:.78em;color:var(--text2);line-height:1.85;max-width:760px;margin:6px auto 0\">\n图 4-7　【C·场景参照】京剧《长坂坡》舞台照（2015 年·上海京剧院于天蟾逸夫舞台演出）——京剧舞台上的群戏一瞬——楼先生「国艺」中「京」之一目的当代舞台·2015-05-03·上海天蟾逸夫舞台。**边界**：此为**当代京剧舞台照**，非奚派剧目、非奚啸伯或其传人演出、**图中无楼宇烈本人**；仅作京剧舞台之场景参照。<br>\n<div class=\"en-line\" style=\"font-size:.95em\">EN — Peking opera *Battle of Changban* on stage, Tianchan Theatre, Shanghai (2015) — a moment on the modern jingju stage — the \"opera\" strand of his guoyi Boundary: A contemporary jingju stage photo — not an Xi-school production; scene reference only.</div>\n图源：Wikimedia Commons（CC BY 2.0，作者：陈文（Flickr univers-finder））；详目与著录见文末〔▲图像登记〕「changban-jingju」。\n</figcaption>\n</figure>\n<!--/IMG:4-7-->\n\n<!--IMG:4-8-->\n<figure class=\"doc-fig\" style=\"margin:18px auto;max-width:820px;text-align:center\">\n<img class=\"doc-img\" src=\"https://upload.wikimedia.org/wikipedia/commons/0/0d/Liu_Hongsheng_as_Yang_Jiye.jpg\" alt=\"刘鸿声京剧老生戏装照\" loading=\"lazy\" style=\"max-width:300px\">\n<figcaption style=\"font-size:.78em;color:var(--text2);line-height:1.85;max-width:760px;margin:6px auto 0\">\n图 4-8　【C·类型样本】民国京剧老生名家刘鸿声《李陵碑》饰杨继业戏装照——早期老生扮相史料：髯口、靠旗与身段之旧影——奚啸伯所承老生行当之时代底色·不晚于 1920 年·中国。**边界**：此系**民国老生名家刘鸿声**戏装照，**不是奚啸伯本人**（奚啸伯照片无自由授权，见「未检得」记录）；**图中无楼宇烈**。仅作老生行当之类型样本。<br>\n<div class=\"en-line\" style=\"font-size:.95em\">EN — The laosheng singer Liu Hongsheng as Yang Jiye in *The Stele of Li Ling* (Republican era) — an early laosheng costume photograph — the period background of the role-type Xi Xiaobo inherited Boundary: Liu Hongsheng, NOT Xi Xiaobo (no free image of Xi exists) — a role-type sample only.</div>\n图源：Wikimedia Commons（公有领域，作者：〔待核〕摄影者）；详目与著录见文末〔▲图像登记〕「liu-hongsheng-laosheng」。\n</figcaption>\n</figure>\n<!--/IMG:4-8-->\n\n\n\n\n\n以奚家女婿的身份，楼宇烈多次出现在奚派的场合。2009年4月，欧阳中石收徒张建国的补拜师仪式上，在场的有“奚家的儿媳杨玉娟、女儿奚延玲、女婿楼宇烈”与奚啸伯的诸弟子（路继舜〈知遇欧阳中石〉，2018-07-21）〔待核〕。2011年北京的一场奚派剧目擂台赛上，北京晚报记者“偶遇奚啸伯的女儿奚延玲和她的夫君——北京大学哲学系教授楼宇烈”，并称“这对夫妻的月老冰人正是欧阳中石”（北京晚报，2011-08-03）。2020年欧阳中石逝世，楼宇烈、夫人奚延玲及子孙书写挽联；次年的追思活动中，奚延玲以“师妹”的名义携子楼开睿、媳秦祝华、孙楼子辰共挽〔待核〕。2006年河北教育出版社的《啸声雅韵聚知音》（马健鹰、王律著）第一章“满门书香——奚啸伯的家世亲族”下，更设有“女婿楼宇烈：善唱昆曲的大学者”一节〔待核〕。\n\n至于楼宇烈与奚啸伯本人的直接往来——观剧、题序、书信——笔者未见确证。奚啸伯1977年去世时，楼宇烈尚在助教任上；他谈岳父，留下的也只有一句“一生很不容易”。这些空白是真实的空白，不以想当然补。另有两桩须辨明：其一，他从未见有“自称奚派票友”的自述——“票友”这个称谓放在欧阳中石身上合适，放在他身上则失据；其二，网传“欧阳中石是奚啸伯的女婿、与楼宇烈连襟”之说与一手材料相悖（欧阳中石是弟子，不是女婿），系内容农场拼贴，不可引据。\n\n这层姻亲还有一重意味。奚派声腔以“书卷气”著称，讲究的是文化人的戏；楼宇烈后来讲“以道统艺，由艺臻道”，把戏、琴、书、医都看成养心的工夫。岳父的戏、牵线人欧阳中石的书法、自己的哲学，在一个家里、一个圈子里相遇。他说“这就是人生机缘啊”——这话听来平淡，却是他看待艺事的一贯态度：不把艺抬成道，也不把艺贬成玩；遇上了，就认认真真做下去。\n\n### 4.5 以道统艺\n\n他论艺，有一个十六字心法：“以道统艺，由艺臻道，道艺并进，形神俱备。”（北京大学融媒体中心稿，2026-10-15）意思是，艺不是纯技巧的比拼，也不是舞台上的表演；艺是可见、可听、可触的修养，最后要通到“道”上。他说得更直白：艺学再精，忘了求道，就叫玩物丧志〔大意〕。\n\n这个说法容易被误解为看不起技术。其实不然。他要求的是“形神俱备”：形要精，神要足，缺一不可。只讲形，是匠；只讲神，是玄。他自己唱曲、听琴、写字，都是按这个标准来的。他又写过一副对联，说得更平实：“同是平常本分事；皆为悟道明心门。”（北京大学融媒体中心稿，2026-10-15）——唱曲、弹琴、写字，都是“平常本分事”；妙处只在人肯不肯从这本分里悟道明心。\n\n书法上，他讲“习字调心性，学书铸人格”〔待核〕。2010年起，他每年手书编印一本线装“周历”赠给亲友，把《周易》《史记》的格言与民间谚语放在一起（李四龙，《光明日报》2025-12-15）。周历不卖，只送；字不必工，意思要到。这是他的“日用处”。\n\n中医也是他晚年常讲的题目。他视中医为蕴含“气化宇宙论”与阴阳平衡智慧的“生生之具”，是综合性的生命哲学，不只是方技〔大意〕。这话在中医界听来是知音，在科学主义者听来未免玄虚。他的立场其实一贯：中国的学问，不能用西方的学科分类一刀切开。\n\n> **EN对应 · Four: Opera, Arts, and the Way — From the Kunqu Society to the Guoyi Yuan**\n>\n> **1961: the Kunqu Society.** In 1961, in the dreariest stretch of his teaching-assistant years, he joined the Beijing Kunqu Research Society, founded in 1956 by Yu Pingbo — the most important amateur kunqu body of the new China. He learned to sing, beat time and listen to the dizi there for decades. His doctoral student Tan Wei records that he served as the Society's director from the fourth committee (9 March 1987) until stepping down at the seventh (2004), afterwards honorary director, and that in 1996 he oversaw the printing of the four-volume *Guyin Qupu* (Tan Wei, *China Education Daily*, 6 Nov 2026); another account gives \"fifteen consecutive years, 1987–2003\" (see Appendix C). A 1979 photograph of a Society gathering at Yu Pingbo's home shows Zhang Yunhe and Zhou Quan'an in the front row and a young Lou Yulie in the middle of the back row (Li Silong, *Guangming Daily*, 2025-12-15). A young philosophy instructor succeeding a great Redologist, seated with qu friends like Zhang Yunhe — a small matter then; today it says something: learning and art were never two separate things.\n>\n> **Wednesday afternoons.** For decades he ran a kunqu gathering on campus every Wednesday afternoon, rain or shine. His wife Xi Yanling — second daughter of Xi Xiaobo, herself a qu enthusiast — was usually at his side, \"singing and appreciating with us, beating time for the younger students\" (Zhang Suwen, 2024). The programme changed; one thing never did: every session closed with the same item from *The Palace of Eternal Youth* — \"Sky pale, clouds idle; across the long air fly lines of new geese…\" It became, as it were, part of the campus scenery. In spring 2005, before Bai Xianyong's youth production of *The Peony Pavilion* came to the university's centennial hall, he was invited by the campus Jing-Kun Society to give a talk on \"kunqu and intangible cultural heritage\"; that April the production played to a packed house. In April 2026, aged ninety-two and barely able to stand, he happily obliged a *Beijing Daily* reporter with the garden scene from *The Peony Pavilion*: \"Here flowers bloom in splendour, and all is given over to ruined wells and crumbling walls…\" — every syllable in place. A scholar of Wei-Jin metaphysics and the Huayan tradition whose late-life showpiece was a kunqu aria: the \"elegance\" of the Chinese tradition was never on the shelf; it is what one can sing, play and write.\n>\n> **The Guoyi Yuan (National Arts Garden).** Around 2003, when few played the guqin, he rented rooms near his home at his own expense, bought qin, and opened the Guoyi Yuan, where his student the Korean monk Master Rushan — \"approaching Chan through the qin,\" a Ph.D. of the department — taught for about twenty years without pay (Zhang Suwen). Six tables, six qin, one lesson a week, tea and snacks provided, everything free; graduates gave concerts on campus. It ran until the month before he died (*China Education Daily*). The founding year is given as 2003 or 2005, and the university's Jing-Kun-Qin Institute as 2003 or 2009 (Appendix C). He also held tea gatherings without self, incense rites, spring outings and autumn moon-viewings; at every Mid-Autumn party and Guoyi Yuan recital he took the clappers himself for *Fen'er* (Tan Wei; Zhang Suwen). A philosophy professor spending his late years on such things — his reason was simple: the arts are not pastime but the work of nurturing the heart.\n>\n> **The Peking-opera thread: Xi Xiaobo's son-in-law, and Ouyang Zhongshi as go-between.** His relation to the jingju world was not that of an amateur to a star but of kin: he was the son-in-law of Xi Xiaobo (1910–1977), founder of the Xi school of laosheng roles; his wife Xi Yanling (b. 1942) is Xi Xiaobo's second daughter [to be verified]. And the matchmaker was Ouyang Zhongshi (1928–2020), calligrapher and Xi Xiaobo's foremost heir. Lou Yulie said it himself, to Zhang Enling's group in September 2020, with his wife present: \"Yes, my marriage with Yanling was strung together by Mr Ouyang Zhongshi. Xi Xiaobo was a great master of jingju; his life was not easy. Ouyang Zhongshi was Xi Xiaobo's student — such are the turns of destiny. My elder brother is Zhang Boju's son-in-law, so Zhang Boju and I became relatives too.\" His brother Lou Yudong (Yenching University, author of *A Biography of Zhang Boju*) married the collector Zhang Boju's daughter Zhang Chuancai. Ouyang Zhongshi, who entered Fu Jen University's philosophy department in 1950 and transferred to Peking University's (graduating 1954 — a year before Lou Yulie enrolled), said of the same web: \"Zhang Boju has a daughter named Zhang Chuancai; her husband Lou Yudong…; Lou Yudong's younger brother Lou Yulie is again Mr Xi Xiaobo's son-in-law.\" Two independent recollections, one \"matchmaker,\" one \"son-in-law\": the relation is established. As Xi family son-in-law he appeared at Xi-school occasions — the 2009 ceremony at which Ouyang Zhongshi formally took on Zhang Jianguo (\"the Xi family's daughter-in-law Yang Yujuan, daughter Xi Yanling and son-in-law Lou Yulie\" among the guests); a 2011 Xi-school contest where *Beijing Evening News* \"ran into Xi Xiaobo's daughter Xi Yanling and her husband, Peking University philosophy professor Lou Yulie\"; the 2020 elegies on Ouyang Zhongshi's death written by Lou Yulie, his wife and their descendants. A 2006 book on Xi Xiaobo's family even devotes a section to \"Son-in-law Lou Yulie: the great scholar who excels at kunqu\" [to be verified]. What remains unverified is any direct exchange between Lou Yulie and Xi Xiaobo himself (who died in 1977) — meetings, prefaces, letters; of his father-in-law he left only one sentence: \"his life was not easy.\" Two popular beliefs must be corrected: he never \"styled himself an Xi-school amateur\" (the \"amateur\" tag in the sources belongs to Ouyang Zhongshi), and the internet claim that Ouyang Zhongshi was Xi Xiaobo's son-in-law and Lou Yulie's brother-in-law is false — Ouyang was a disciple, not a son-in-law. The whole web has a certain poetry: a school of singing known for its \"bookish air,\" a calligrapher-son of that school, a philosopher married into it. \"Such are the turns of destiny\" — and his way with the arts was the same: never raise them into the Way, never reduce them to play; when they come to you, do them properly.\n>\n> **Letting the Way govern the arts.** His sixteen-character formula: \"Let the Way govern the arts; through the arts reach the Way; advance Way and arts together; achieve both form and spirit.\" The arts are not pure technique nor mere stage display; they are cultivation made visible, audible and tangible, reaching in the end to the Way. He put it more bluntly: however refined the art, forget the seeking of the Way and it becomes \"playing with things and losing the heart.\" This is not contempt for technique — \"form and spirit both complete\" demands both: form must be fine, spirit full. Only form makes a craftsman; only spirit makes a mystifier. He sang, listened and wrote to exactly this standard. A couplet of his puts it plainly: \"All of it the ordinary business of one's station; all of it a gate to awakening the mind.\" On calligraphy he spoke of \"tuning the heart-nature through practice, forging character through the brush\"; from 2010 he designed, hand-wrote and printed a thread-bound weekly almanac each year for friends, setting *Zhouyi* and *Shiji* maxims beside folk sayings — a thing never sold, only given. Chinese medicine he read as a \"tool of life\" carrying a qi-transforming cosmology and the wisdom of yin-yang balance — a comprehensive humanistic philosophy of life, not mere technique. To the Chinese-medicine community he sounded like a connoisseur; to scientism, perhaps mystical. His position was consistent: Chinese learning cannot be sliced up by Western disciplinary categories.\n\n## 五、著作谱系：从校释到“人文立本”\n\n### 5.1 两部校释与两部资料\n\n《王弼集校释》是楼宇烈的立身之作。王弼注《老》《易》，以“无”为本，倡“得意忘言”，是魏晋玄学的枢纽。可王弼的著作散佚已久，版本歧异，注文简奥，读起来极难。楼宇烈做了三件事：汇校版本，厘定文字，疏解注义。这三件事都不热闹，却是一切开宗立派的前提。\n\n此书1964年成初稿，此后书稿一度未能集中整理，资料积累却没有停止；1978年交稿前，他又依据新材料和研究心得反复修改，1980年出版，1984年重印（北京大学融媒体中心稿，2026-10-15）。后来他又在重印后记中持续修订，2008年的《老子道德经注校释》更明确采用马王堆帛书对校〔待核〕。一部书改了半辈子，这在今天的考核表上几乎无法计算。\n\n<!--IMG:5-1-->\n<figure class=\"doc-fig\" style=\"margin:18px auto;max-width:820px;text-align:center\">\n<img class=\"doc-img\" src=\"https://upload.wikimedia.org/wikipedia/commons/e/ed/Mawangdui_LaoTsu_Ms2.JPG\" alt=\"马王堆帛书老子残片\" loading=\"lazy\">\n<figcaption style=\"font-size:.78em;color:var(--text2);line-height:1.85;max-width:760px;margin:6px auto 0\">\n图 5-1　【C·古籍实物参照】马王堆三号汉墓帛书《老子》残片——帛本墨书残片（湖南省博物馆藏）——《老子道德经注校释》所采对校本之实物·前 2 世纪（西汉）·湖南长沙马王堆·湖南省博物馆藏。**边界**：此为**帛书残片实物照**，非王弼注本、非楼氏校释书影；**图中无楼宇烈本人**。仅作「帛书对校」所依版本之实物参照。<br>\n<div class=\"en-line\" style=\"font-size:.95em\">EN — Silk manuscript of the *Laozi*, Mawangdui tomb 3 — ink on silk — the physical witness of the manuscript against which his 2008 Laozi was collated Boundary: The silk manuscript itself, not Wang Bi's commentary nor Lou''s book; object reference only.</div>\n图源：Wikimedia Commons（公有领域，作者：〔待核〕摄影者（湖南省博物馆藏品照））；详目与著录见文末〔▲图像登记〕「mawangdui-laozi」。\n</figcaption>\n</figure>\n<!--/IMG:5-1-->\n\n玄学线上的单篇论文，另有《郭象哲学思想剖析》《玄学与中国传统哲学》《魏晋玄学及其对中国传统文化的影响》等（同上）——旧说《郭象哲学思想剖析》一篇出处无考，今据北大官方稿可定其为他的著述之一。\n\n《荀子新注》的情形不同。它是集体项目，1979年出版时只署“北京大学《荀子》注释组”。书以清人王先谦《荀子集解》为底本，校勘、标点、疏解，重点阐发荀子“隆礼重法”“群居和一”“化性起伪”的现实意义〔待核〕。2017至2018年间中华书局再版，才具个人署名——书目著录作2018年3月（ISBN 9787101127256），署名“楼宇烈 注”，北大官方稿则作“2017年再次出版”（两说并存见附录 C）；“主撰”字样尚待书影〔待核〕。一本书等了近四十年才等到作者的名字，这是时代的荒诞，也是他的耐心。晚年他犹不放心这部书，组织博士生读书小组把《荀子》三十二篇一篇篇重读、讨论、修改，重新写过各篇“说明”（北京大学融媒体中心稿，2026-10-15）——整理经典的过程，到老都还是与学生共同研读的过程。\n\n<!--IMG:5-2-->\n<figure class=\"doc-fig\" style=\"margin:18px auto;max-width:820px;text-align:center\">\n<img class=\"doc-img\" src=\"https://upload.wikimedia.org/wikipedia/commons/5/56/Portrait_of_Xun_Zi.jpg\" alt=\"荀子传统画像\" loading=\"lazy\">\n<figcaption style=\"font-size:.78em;color:var(--text2);line-height:1.85;max-width:760px;margin:6px auto 0\">\n图 5-2　【C·名相参照】荀子传统工笔画像——戴幞头蓄须的半身像——《荀子新注》其书之传统形象·〔待核〕画作年代（传统样式）·中国。**边界**：此为**后世传统画像**，非写真、画作年代不详；**图中无楼宇烈本人**。仅作荀子之名相参照。<br>\n<div class=\"en-line\" style=\"font-size:.95em\">EN — Traditional portrait of Xunzi — the traditional image of the philosopher annotated in the 1979 *Xunzi* Boundary: A traditional later portrait, not from life; symbolic reference only.</div>\n图源：Wikimedia Commons（公有领域，作者：〔待核〕画者）；详目与著录见文末〔▲图像登记〕「xunzi-portrait」。\n</figcaption>\n</figure>\n<!--/IMG:5-2-->\n\n\n\n《中国佛教思想资料选编》是另一种功劳。它不提出观点，只提供材料；不参加论战，只把散在各处的文献收拢、标点、编年。四卷十册，从汉魏到民国，前九册收中国本土佛教文献，第十册收重要汉译佛典。1981年至1992年出齐，2014年、2023年又有十册附索引版〔待核〕。改革开放后第一代佛教研究者，几乎都从这套书起步。学术的基础设施，往往就是这样不署名的工程。\n\n《康有为学术著作选》同理。1984年至1992年出版，是康有为著作的第一部系统整理本。所收为**七种**：《论语注》（1984.1）、《孟子微、中庸注、礼运注》（1987.9）、《长兴学记、桂学答问、万木草堂口说》（1988.3）、《康子内外篇（外六种）》（1988.8）、《诸天讲》（1990.4）、《春秋董氏学》（1990.7）、《康南海自编年谱（外二种）》（1992.9）（北大继续教育学院官方著述目录逐种著录；中华书局总编辑尹涛、李四龙、北大官方稿三源同指七种）。陈来“十种”之说未获旁证〔待核〕。康有为的思想牵动近现代中国的政治与学术，整理他的著作，等于给近现代中国哲学研究开了一扇门。\n\n### 5.2 佛教：本土化与人间\n\n他的佛教研究，集中在两条线。\n\n一条是佛教的中国化。他反复讲，外来佛教必须经过中国文化人文精神的洗礼，才能落地生根。因此研究中国佛教，要注重“本土化”，他甚至用过“去印度化”的说法〔待核〕。这个说法容易引起误解，他的意思不是否定印度渊源，而是强调：中国佛教之所以是中国佛教，不在于它保留了多少印度成分，而在于它如何把印度的义理转化成中国人能懂、能行的东西。禅宗、华严、天台，都是这种转化的产物。\n\n另一条是近代居士佛教与人间佛教。他重视杨文会以来的居士佛学，重视太虚、赵朴初一系的人间佛教实践。他有一个很朴素的判断：“佛陀是人，不是神。”〔待核〕修行不在别处，就在当下的自我完善。这个判断看似平常，实则把佛教从“他力救赎”拉回了“人的自觉”，与他讲的中国文化“人文立本”是一回事。\n\n他与佛教界的交往也深。1987年与赵朴初、星云大师在北京相会〔待核〕；2001年受聘为《佛光大藏经》编修委员会顾问〔待核〕；2016年10月，八十二岁的他偕家人及博士生一行十九人参访佛光山〔待核〕。这些事说明，他不是只在书斋里研究佛教，也参与了两岸佛教的当代对话。\n\n### 5.3 人文立本\n\n1995年，他在《国学研究》第三卷发表《论中国传统文化的人文精神》〔待核〕。这篇论文是他后期思想的纲领。\n\n他说，中国文化的根本精神，是以人为本的自觉与自律。这种精神“上薄拜神教，下防拜物教”：既不把命运交给外在的神，也不把人生交给物欲。现代人最大的精神痛苦，是做不了自己的主人，不是被物欲牵着走，就是无奈地祈求神灵〔大意〕。人文精神要义的，是发挥个人的主动性，不被内心的物欲与外部的神灵所支配。\n\n他进一步把中国古代的思维方式归为三点：整体关联、动态平衡、自然合理（李四龙语，《中国教育报》2026-10-15）。整体关联，是万物相系而非孤立割裂；动态平衡，是依时空场合调整的中庸分寸；自然合理，是顺应事物本性，而不只是工具理性。这三个词，他用来讲中医、讲艺术、讲管理，也用来讲中国人的日常。\n\n在经典谱系上，他提出“三玄、四书、五经”，并刻意把魏晋的“三玄”（《周易》《老子》《庄子》）放在儒家“四书五经”之前〔待核〕。这不是要贬儒尊道，而是要打破“独尊儒术”的单一视野，让人看见中国传统的思辨维度。李四龙认为，这一排序突出了传统文化的哲学色彩〔待核〕。\n\n治学方法上，他主张“我注六经”与“六经注我”并重，要求学人做到“四通”：中西东、古今现、儒释道、文史哲〔待核〕。他又主张对传统文化作“综合的整体研究”，不把哲学、宗教、艺术、医学切成互不相干的块。这些主张在今天听来并不新鲜，但在1980年代“西化即现代化”的氛围里，是需要勇气的。据中青报追记，20世纪80年代学界那场“海洋文化与大陆文化”的讨论，正是促使他深入思考中西文明差异的契机：他由此认定，真正的现代化并非趋同，而是保持自身文化的独特性（《中国教育报》2026-10-15）。“文化主体性”这个后来挂在嘴边的词，起点是一场具体的时代论争。\n\n晚年谈立身，他又拈出一个“诚敬”：“现在我们社会最大的问题就是诚敬的缺失”——诚是不自欺、讲诚信，敬是敬畏尊敬一切人（澎湃新闻，2026-10-21）。他的座右铭是十六个字：敬天法祖、守礼尽伦、知足惜福、感恩图报〔待核〕。这些话平易，却与“三不堂”互为表里：三不讲的是不做什么，诚敬讲的是凭什么立——一个读书人把两个半句都守住，学问才不飘。\n\n### 5.4 商榷与边界\n\n纪念文章容易只写好处。楼宇烈的校释，确有可商榷处。\n\n高正（1954—2023，中国社科院哲学所研究员，先秦哲学与诸子学专家，著《〈荀子〉版本源流考》）曾发表《楼宇烈校释学所存在的方法问题——以〈王弼集校释〉为例》，从传统文字学、音韵学、古籍校勘学的标准提出批评。该文全文已见（豆瓣2008-04-20转贴，含提要、关键词与六条注释；原刊出处未检得〔待核〕），本文所转述的论点与原文逐条相符：释读《老子》第六十五章王弼注时未能准确掌握“见”为“现”的本字，未顾及“某犹某也”的音近义通通例，臆改注文（将“智，犹治也”改为“智，犹巧也”），误断标点；对《荀子新注》“未运用任何出土文献资料，使用前人的考据、注释成果却不提前人姓名，甚至误将大段的《荀子》原文脱落、遗漏”的批评，亦见原文末段。据该文注释，钟肇鹏、王葆玹早曾致信或撰文指出其中问题（王葆玹文载《中国哲学史研究》1983年第4期）〔待核：旁证文未直检〕。\n\n这些批评是否条条成立，需核对原书与原刊，本文不代为判定〔待核〕。但方向值得注意：楼宇烈的长处不在乾嘉式的微观考据，而在思想史的贯通与文化普及。用考据学的严苛标准要求他，能看出他的边界；反过来，用思想史的视野看那些考据细节，也能理解他为何如此取舍。\n\n他自己并非不知。他在《王弼集校释》重印后记中持续修订，晚年的《老子道德经注校释》采用帛书对校，都是回应〔待核〕。一个学者肯用几十年改一部书，比从不认错的人可信。\n\n### 5.5 文集\n\n2025年11月，中华书局出版《楼宇烈文集》，八卷九册，二百八十余万字（凤凰网佛教，2025-11-28；北京大学融媒体中心稿）。卷目为：卷一《王弼集校释》，卷二《荀子新注》，卷三《儒家与中国传统文化》，卷四《玄学与道家文化》，卷五《中国思想与东方哲学》，卷六《中国佛教与人文精神》（上下），卷七《宗教研究方法讲记》，卷八《中国艺术与传统医学讲演录》。\n\n陈来在首发式上提醒，这是“文集”不是“全集”：近二十年社会影响最大的《中国的品格》《中国的智慧》《中国的人文信仰》《中国文化的根本精神》等约十种未收入；早年古籍整理只收了《王弼集校释》，康有为著作与主编教材也未收。他期待将来出全集时补全〔待核〕。\n\n这个提醒很重要。文集呈现的是“学术的楼宇烈”，而公众认识的楼宇烈，多半是“讲文化的楼宇烈”。两个形象并不矛盾，却也不完全重合。评价他，最好把两本账都翻开看。\n\n> **EN对应 · Five: The Corpus of Writings — From Collation to \"Humanity as the Foundation\"**\n>\n> **Two collations, two sourcebooks.** *Collected Works of Wang Bi, Collated and Annotated* (Zhonghua Book Company, 1980) is the book that established him. Wang Bi — the third-century thinker around whom Wei-Jin \"dark learning\" turns — left works scattered in recalcitrant editions. Lou Yulie did three unglamorous things: gathered the editions, fixed the text, unpacked the commentary. Draft 1964; revised before submission in 1978; printed 1980, reprinted 1984; further revised afterwards; the 2008 *Laozi* edition collated against the Mawangdui silk manuscripts. A book revised for half a lifetime — on today's evaluation forms, it barely computes. Essays of the same line include *An Analysis of Guo Xiang's Philosophy* and others. The *New Annotations to the Xunzi* (1979) was a collective project, published under \"Peking University Xunzi Annotation Group\"; a personal byline came only with the reissue (2017/2018, both dates reported). In his seventies he still convened a doctoral reading group to go through all thirty-two chapters again, rewriting each \"introduction\" — collating classics remained, to the end, a shared act of study. The *Selected Source Materials on Chinese Buddhist Thought* (1981–1992, ten parts) did not argue; it gathered, punctuated and dated the documents, and a generation of Buddhist-studies scholars started from it. The *Selected Scholarly Works of Kang Youwei* (1984–1992) opened the same door for modern Chinese philosophy.\n>\n> **Buddhism: localisation and the human.** Two lines run through his Buddhist work. First, the localisation of Buddhism: an imported religion took root only after being tempered by the humanistic spirit of Chinese culture; to study Chinese Buddhism is to study that transformation — hence his (sometimes misunderstood) call to \"de-Indianise\" the field: not denying Indian sources, but asking what makes Chinese Buddhism *Chinese*. Chan, Huayan and Tiantai are all products of that translation. Second, modern lay Buddhism and \"Buddhism for human life\": from Yang Wenshui onward, and Taixu and Zhao Puchu's practice. His plainest judgement: \"the Buddha is a person, not a god\" — cultivation is self-perfection here and now, pulling Buddhism back from other-power redemption to human self-awareness, which is exactly what \"humanity as the foundation\" means. He moved in Buddhist circles too: meeting Zhao Puchu and Master Hsing Yun in 1987; adviser to the *Fo Guang Buddhist Canon* project from 2001; a 2016 visit to Fo Guang Shan with family and doctoral students.\n>\n> **Humanity as the foundation.** His 1995 essay \"On the Humanistic Spirit of Traditional Chinese Culture\" is the programme of his later thought: Chinese culture's root spirit is the self-awareness and self-discipline that takes the human as fundamental — \"thinning the worship of gods above, guarding against the worship of things below.\" The greatest spiritual suffering of modern people is inability to be one's own master, dragged by desire or left begging gods; humanistic spirit means agency, not being ruled by inner appetite or outer deity. He summarised the Chinese way of thinking in three: holistic interrelation, dynamic balance, natural reasonableness. On the canon he proposed \"Three Mysteries, Four Books, Five Classics,\" deliberately placing the Wei-Jin \"Three Mysteries\" (*Zhouyi*, *Laozi*, *Zhuangzi*) before the Confucian Four Books and Five Classics — not to demote Confucianism but to break the single \"Confucian-only\" vision and reveal the tradition's speculative dimension. Method: \"annotating the classics\" and \"the classics annotating me\" alike; scholars should achieve \"four connections\" — China-West-East, ancient-modern-contemporary, Confucianism-Buddhism-Daoism, literature-history-philosophy. In the 1980s \"ocean culture vs. continental culture\" debate he saw the point that true modernisation is not convergence but keeping one's cultural distinctiveness. Late in life he added \"sincerity and reverence\" (诚敬): sincerity as not deceiving oneself, reverence as respecting all persons; his motto in sixteen characters: revere Heaven and follow the ancestors; keep ritual and fulfil relations; know contentment and cherish blessing; be grateful and seek to requite. The Sanbu tells what not to do; sincerity and reverence say on what one stands.\n>\n> **Critique and bounds.** Memorial writing tempts one-sidedness. The collations do have vulnerabilities: Gao Zheng (1954–2023, research fellow of the CASS Institute of Philosophy, a specialist in pre-Qin thought and textual bibliography) criticised the *Wang Bi* edition from the standards of traditional philology and classical bibliography. The full text of his essay has since been located (a 2008 Douban repost; original venue still untraced [to be verified]): the charges summarised here match it point for point — the Laozi passage (\"seeing\" as the base form of \"appear\"), the emendation of \"zhi, you zhi ye\" into \"zhi, you qiao ye\", mispunctuations, and on the *Xunzi* notes \"no use whatsoever of excavated materials, citation of predecessors without acknowledgement, even the dropping of long stretches of the Xunzi text itself.\" Whether every charge holds must be judged against the books themselves; this essay does not decide. But the direction is worth noting: his strength was not micro-evidential kaogu but the connective vision of intellectual history. He knew it: the postscript revisions, the silk-manuscript collation of 2008 — a scholar willing to spend decades revising a book is more trustworthy than one who never errs.\n>\n> **The collected writings.** The eight-volume *Collected Writings of Lou Yulie* (Zhonghua, November 2025, 2.8 million characters) gathers the *Wang Bi*, the *Xunzi*, *Confucianism and Traditional Chinese Culture*, *Dark Learning and Daoist Culture*, *Chinese Thought and Oriental Philosophy*, *Chinese Buddhism and the Humanistic Spirit* (2 vols.), *Lectures on the Method of Religious Studies*, and *Lectures on Chinese Art and Traditional Medicine*. Chen Lai reminded the launch audience that these are \"collected writings,\" not \"complete works\": the ten-odd most socially influential books of his last twenty years — *The Character of China*, *The Wisdom of China*, *The Fundamental Spirit of Chinese Culture* and others — are not included; of the early classical work only the *Wang Bi* is there; the Kang Youwei project and edited textbooks are absent. The distinction matters: the corpus shows \"the scholar Lou Yulie\"; the public knows \"the cultural explicator Lou Yulie.\" The two are not contradictory, but neither do they coincide; a fair reckoning opens both ledgers.\n\n## 六、身后：北大中国哲学的面向与走势\n\n这一节是观察，不是预言。凡涉判断，标〔本文判断〕；只陈述已公布的现任人事，不揣测任命。先铺一层事实底座，皆以2026年11月24日为止的公开信息为限。\n\n身后第一月的哀荣，前文已记其大者。这里补几件与学脉有关的事：北大哲学系在李兆基人文学苑设灵堂三日之外，另在系网开设“楼宇烈先生纪念专区”，收录讣告、悼念文章、各界唁电、挽联挽诗共206条（11页），唁电来自七塔禅寺、中国国家版本馆、北京中医药大学国学院、汤用彤学术奖评委会等机构——这份名单本身颇能说明他的交游之广：佛教界、文献界、中医界、儒学界，各有各的哀悼〔本文判断〕。中国人民大学佛教与宗教学理论研究所以“我所学术委员会主席”之称发讣告，所长张风雷、宣方副教授赴告别仪式。新华社发通稿并特稿《楼宇烈：布衣守文脉，素心传雅道》。截至本文定稿，身后追思会或纪念座谈会尚未见公开报道〔待核〕；《楼宇烈全集》的编纂计划未检得〔待核〕；以他命名的奖学金则**确有其事**——“楼宇烈民生奖学金”由北京民生中国书法公益基金会设立，“以楼宇烈先生的哲学人生与学术思想为典范”（中国社科院哲学所2020年5月已发布第二届评选通知），系生前所设而非身后纪念。此处更正本文初稿“未检得”之失〔待核：基金会规模与近年续办情况未及细检〕——不过，学生们在他最后一次教师节聚会时商量的那件事（汇集他历年所题题跋），或许就是民间纪念的第一步〔本文判断〕。\n\n学脉的现实分布则很清楚。弟子李四龙任北大哲学系教授、中国宗教与东方哲学教研室主任、《楼宇烈文集》主编、校人文学部副主任；金勋任北大外国语学院教授；李海峰任北京师范大学副教授；孙国柱、肖磊任教于中国政法大学；徐佳希任教于北京社会主义学院；谭惟任教于北京语言大学（《中国文化研究》编辑部主任）；郜建华任教于中央社会主义学院。北大哲学系（宗教学系）现任系主任为程乐松，中国哲学教研室主任为郑开（该系官网，2026-11-24查阅）。教研室阵容老中青三代：教授杨立华、王博、干春松、张广保、郑开及人文讲席教授安乐哲，长聘副教授孟庆楠、王鑫，助理教授白辉洪。佛学与宗教学一侧，李四龙、王颂、周学农、赵悠等在列。另须留痕：系官网“师资力量”页称“中国宗教与东方哲学教研室”，“组织架构”页仍作“佛教与道教教研室”——后者即楼先生曾任主任之室，两名并存，引用时须注明〔待核〕。\n\n### 6.1 一代人的终章\n\n北大中国哲学的一百年，可以分成几代。冯友兰、汤用彤、张岱年、朱谦之、任继愈是一代；汤一介、楼宇烈是下一代；再往下，是恢复高考后成长起来的一代。楼宇烈的去世，意味着“亲炙民国学人、又亲历院系调整与改革开放”的那一代，基本退场〔本文判断〕。\n\n这不只是人事更替。那一代人的学问方式，有很强的“手工”性质：自己访书，自己校字，自己抄卡片，自己带学生读原典。他们的学术判断，往往建立在几十年的阅读之上，不依赖数据库，也不依赖团队。这种方式在今天已经很难复制。\n\n### 6.2 三个结构性变化\n\n第一，从“一人通儒”到“团队专门化”。楼宇烈一个人，能校王弼、注荀子、编佛教资料、讲东方哲学、谈中医与艺术。这种宽度，在今天的学科分工下几乎不可能。未来的北大中哲，更可能是几个团队各守一段：先秦、魏晋、佛教、道教、东方哲学、宗教学理论，各有专家，靠制度协调，而不是靠一个人贯通〔本文判断〕。\n\n第二，从“文献基础工程”到“问题导向发表”。今天的评价体系看重项目、刊物等级、转载与奖项。一部《王弼集校释》式的书，做二十年，出的时候未必能折成相应的“成果”。青年学者要在六年考核期内拿出足够数量的论文，很难再去碰大型校释与资料汇编〔本文判断〕。这不是北大一校的问题，是全国人文学科的共同处境。\n\n第三，从“系所合一”到“多机构并立”。北大哲学系、宗教学系、宗教文化研究院、国学研究院、儒学研究院等机构并立，各有各的定位与资源。楼宇烈这样的学者，过去常常充当机构之间的“黏合剂”：他不一定有权，但有威望，能把人请到一起。机构化之后，协调更多靠章程与项目，不再靠某位长者的面子〔本文判断〕。这是进步，也有代价。\n\n### 6.3 两个隐忧\n\n一是古籍整理与资料编纂的再生产危机。《中国佛教思想资料选编》那样的工作，今天几乎无法立项：它不算专著，不算论文，周期长，署名难，出了也不一定能得奖。可没有这类工作，佛教研究就会悬空。楼宇烈那一代人把地基打好了，后来人若只管在地基上盖房，迟早要出问题〔本文判断〕。\n\n二是“国学热”与学院学术的张力。国学普及带来了资源与关注，也带来了“以通俗代研究”的风险。楼宇烈是把普及与专业结合得最好的少数人之一：他讲《心经》，背后有几十年的佛教文献功夫；他讲“三不”，背后有荀子、庄子与佛典的脉络。这种结合看起来容易，其实极难。若只学他的通俗，不学他的底子，就会把“人文立本”讲成心灵鸡汤〔本文判断〕。\n\n### 6.4 机会与一句判断\n\n机会也不是没有，而且大多已经写在北大的日程上。2026年7月北大举行东方哲学学科建设研讨会，楼宇烈生前以视频致辞呼吁“立足中国文化主体性，深化东方哲学研究”；2025年11月文集首发式当天下午的“东方哲学的传统与展望学术研讨会”，议题即含“中华文明标识性概念和中国哲学新课题”“‘一带一路’与东方哲学新视野”“人文宗教与系统推进宗教中国化”——宗教中国化是显题。系里近年的进人也透露方向：科学技术哲学教研室新进展翼文（人工智能哲学、形式化知识论）、胡万亨（科学技术与社会、人工智能的社会研究）两位助理教授，AI+哲学已落到师资编制上（该系官网，2026-11-24查阅）。2026年11月，系主任程乐松在中国人民大学哲学院建系七十周年研讨会上说“哲学从未脱离时代，反而更具活力”〔待核〕。中华文化主体性的讨论、宗教中国化的研究、人工智能伦理与生命伦理的兴起、医学人文的升温，都需要既有文献功底又能跨界的学者。北大中哲在这些议题上有天然的话语优势，前提是守住文献的底子，不把“跨学科”做成“跨过学科”〔本文判断〕。\n\n一句判断：未来三五年，北大中国哲学不会再出现一个“楼宇烈式”的通儒。他的遗产更可能以三种形式延续：机构、丛书与文集、弟子网络。机构一层如今看得最清楚——北大哲学系下与他相关的研究机构各有其人：宗教文化研究院（张志刚）、佛学教育研究中心（李四龙）、佛教研究中心（王颂）、道家研究中心（郑开）、儒学研究院（干春松）、中国哲学暨文化研究所（孟庆楠）、阳明学研究中心（张学智）、礼学研究中心（吴飞）、哲学与人类未来研究中心（王博）（该系官网，2026-11-24查阅）；再加京昆古琴研究所与国艺苑的曲友琴友，一张“机构—师门—雅集”的网已经织好〔本文判断〕。至于“学派”，恐怕不会有。他的学问本来就不以建立学派为目标，他以“成人”为目标〔本文判断〕。\n\n还有一层。他真正不可替代的，不是某一部书，而是“把学问做进生活”的示范：校一部书，教一门课，唱一支曲，写一张字，都是同一件事的不同面。这种示范最容易失传，因为它不进考核表，也不构成“成果”。若北大中哲只继承他的著作，不继承他的活法，那才是真正的断脉〔本文判断〕。\n\n> **EN对应 · Six: After Him — Peking University's Chinese Philosophy, Faces and Trends**\n>\n> This section observes, it does not prophesy. Judgments are marked [author's judgment]; announced appointments are stated as fact, unannounced ones are not guessed. A factual base first, current to 24 November 2026. Beyond the mourning hall and the farewell, the department opened a memorial section on its website collecting 206 items — obituaries, elegies, telegrams and poems — from institutions as varied as the Qita Chan Temple, the National Archives of Publications and Culture, the Beijing University of Chinese Medicine's School of Chinese Culture, and the Tang Yongtong Academic Award committee: a list that itself maps his range — Buddhist, bibliographic, medical, Confucian communities each in mourning [author's judgment]. Renmin University's Institute of Buddhist and Religious Studies mourned him as \"Chair of our Academic Board.\" Xinhua issued a bulletin and the feature \"Lou Yulie: a commoner guarding the cultural lineage, a plain heart transmitting the elegant Way.\" No public memorial symposium has yet been reported, and no *Complete Works* project has been found [to be verified]; a scholarship in his name does exist — the \"Lou Yulie Minsheng Scholarship\" of the Beijing Minsheng Chinese Calligraphy Foundation (second award notice published by the CASS Institute of Philosophy in May 2020), founded in his lifetime, correcting an earlier draft that said none was found — though the students' plan, made at his last Teachers' Day, to gather his calligraphic inscriptions may prove the first step of a vernacular commemoration [author's judgment].\n>\n> The distribution of the lineage is on the public record. Li Silong is professor and director of the Section for Chinese Religion and Oriental Philosophy, editor of the *Collected Writings*, and deputy director of the university's Division of Humanities; Jin Xun is professor in the School of Foreign Languages; Li Haifeng at Beijing Normal University; Sun Guozhu and Xiao Lei at China University of Political Science and Law; Xu Jiaxi at the Beijing Institute of Socialism; Tan Wei at Beijing Language and Culture University; Gao Jianhua at the Central Institute of Socialism. The department's chair is Cheng Lesong; the Chinese Philosophy Section's director is Zheng Kai. The section's ranks run from Yang Lihua, Wang Bo, Gan Chunsong, Zhang Guangbao and Zheng Kai (with Roger Ames as humanities chair professor) through associate professors Meng Qingnan and Wang Xin to assistant professor Bai Huihong; the Buddhist-religious side includes Li Silong, Wang Song, Zhou Xuenong and Zhao You. One footnote: the website calls the unit \"Section for Chinese Religion and Oriental Philosophy\" on one page and \"Section for Buddhism and Daoism\" on another — the latter being the unit Lou Yulie once headed; both names are in current use.\n>\n> **The end of a generation.** A century of Chinese philosophy at Peking University has its generations: Feng Youlan, Tang Yongtong, Zhang Dainian, Zhu Qianzhi, Ren Jiyu; then Tang Yijie and Lou Yulie; then those formed after the restoration of the entrance examinations. His death closes the generation that both sat with Republican-era scholars and lived through the departmental reorganisations and the reform era [author's judgment]. This is not merely personnel: their scholarship had a strongly \"handmade\" character — hunting books, collating characters, writing cards, reading classics with students — a judgement built on decades of reading, dependent on neither databases nor teams. That mode is now very hard to reproduce.\n>\n> **Three structural shifts.** First, from the \"all-round tongru\" to team specialisation: one man who could collate Wang Bi, annotate Xunzi, compile Buddhist sources, teach Oriental philosophy and talk of medicine and the arts is nearly impossible under today's division of labour; the future is several teams — pre-Qin, Wei-Jin, Buddhism, Daoism, Oriental philosophy, theory of religion — coordinated by institutions rather than by one person's range [author's judgment]. Second, from documentary infrastructure to problem-driven publication: today's metrics reward projects, ranked journals, reprints and prizes; a twenty-year book like the *Wang Bi* cannot be \"converted\" into commensurate output, and a junior scholar inside a six-year assessment window can hardly touch large-scale collation [author's judgment] — a national predicament of the humanities, not one university's. Third, from \"department and section as one\" to multiple parallel institutions — department, religious studies, Institute of Religious Culture, Institute of National Studies, Confucian Institute and more; scholars like Lou Yulie used to be the \"binder\" among institutions, wielding authority and face rather than charters; institutionalisation is progress, and it has its price [author's judgment].\n>\n> **Two anxieties.** One: the reproduction of documentary groundwork. Work like the *Selected Source Materials on Chinese Buddhist Thought* can barely be funded today — not a monograph, not an article, long-cycle, hard to sign, hard to prize — yet without it Buddhist studies hangs in the air; the older generation laid the foundation, and if successors only build floors on it, trouble comes [author's judgment]. Two: the tension between \"national-learning fever\" and academic work. Popularisation brings resources and readers, and the risk of substituting one for the other. Lou Yulie was one of the few who joined both: behind his *Heart Sutra* talks lay decades of Buddhist philology; behind his \"Three Non-acts\" the lineages of Xunzi, Zhuangzi and the Buddhist canon. Learn only his accessibility without his groundwork, and \"humanity as the foundation\" becomes chicken soup for the soul [author's judgment].\n>\n> **Opportunities, and one verdict.** The opportunities are already on the university's calendar: a July 2026 symposium on Oriental philosophy (to which he spoke by video, calling for research grounded in Chinese cultural subjectivity); the November 2025 symposium's themes — new questions for Chinese philosophy, the Belt-and-Road horizon for Oriental philosophy, and \"humanistic religion and the systematic advancement of the Sinicisation of religion\"; and two new assistant professors in philosophy of AI (Zhan Yiwen, Hu Wanheng). Chair Cheng Lesong said in November 2026 that \"philosophy has never left its era; it is only more vital now.\" Subjectivity of Chinese culture, Sinicisation of religion, AI ethics, medical humanities all need scholars with documentary depth who can cross borders; Peking University's Chinese philosophy has a natural voice here — provided it keeps the philological base and does not turn \"interdisciplinary\" into \"crossing over the disciplines\" [author's judgment].\n>\n> One verdict: in the next three to five years Peking University's Chinese philosophy will not produce another Lou Yulie. His legacy is more likely to persist in three forms — institutions (now clearly staffed: Institute of Religious Culture under Zhang Zhigang, the Buddhist education and Buddhist studies centres under Li Silong and Wang Song, the Daoist centre under Zheng Kai, the Confucian Institute under Gan Chunsong, and others), books and series, and a network of disciples — not a \"school\"; his learning never aimed at one; its aim was \"becoming a person\" [author's judgment]. And one thing more: what is truly irreplaceable is not any single book but the demonstration of doing learning *into* life — collating a book, teaching a class, singing an aria, writing a character, all faces of one act. Such demonstration dies easiest, for it enters no evaluation form and constitutes no \"output.\" If Peking University's Chinese philosophy inherits only his books and not his way of living, that will be the real break in the lineage [author's judgment].\n\n## 七、结语：愿做小草\n\n有学生问楼宇烈：您愿做大树还是小草？他说：“我愿意做小草，做小草也挺好。”（肖磊回忆，澎湃新闻，2026-10-16）\n\n大树有用，可作栋梁；小草也有用，年年返青，不争高低。这个回答很像他的“三不”：不苟为，不刻意，不执著。他不做振臂一呼的领袖，也不做孤高自许的隐士。他做的是那种“在”的人：系里有事，他在；学生有问，他在；曲会有笛，他在；书桌有稿，他在。\n\n九十二岁这年，他走了。留下的东西不算少：两部校释，一部资料汇编，八卷文集，一个教研室，一个研究所，一群学生，还有满校园唱过昆曲的下午。灵前的挽联写道：“一代硕师启大雅灵襟，立德立人立道本；千秋遗范传中华文脉，有典有则有温情。”澎湃刊出的挽联则是熟人的口吻：“三不守真，素室穷经，何尝倦也；六艺载道，平易治学，不亦悦乎。”新华社的标题最简白：布衣守文脉，素心传雅道。而学生们的话最像他：“先生一生所言，即一生所行；笔下所写，即心中所信。”（《中国教育报》2026-10-15）他2023年在北大“青春北大”人像摄影展上哼着昆曲说：“年龄是一去不复返的，但你内心可以保持青春。”（《光明日报》2026-10-11）——把每一天过好，就是他的全部生死观。\n\n《荀子·不苟》说：“君子行不贵苟难，说不贵苟察，名不贵苟传，唯其当之为贵。”不苟为，唯贵当。这九个字，他写了一辈子，也活了一辈子。\n\n> **EN对应 · Seven: Epilogue — Glad to Be Grass**\n>\n> A student asked him: would you rather be a great tree or a blade of grass? \"I'd rather be grass,\" he said. \"Being grass is quite fine too.\" Trees are useful — ridge-beams; grass is useful too — turning green again each year, competing with nothing. The answer is his \"Three Non-acts\" in miniature. He was not a leader raising an arm, nor a hermit nursing aloofness; he was simply the person who *is there*: when the department needs him, he is there; when students ask, he is there; when the qu society has a dizi, he is there; when the desk has a manuscript, he is there. In his ninety-second year he went. What he leaves is not small: two collations, a sourcebook, eight volumes, a teaching section, an institute, a body of students, and all those kunqu afternoons across the campus. The elegiac couplet at the bier praised \"a great teacher of the age… establishing virtue, establishing people, establishing the root of the Way\"; the couplet in *The Paper* spoke in an intimate voice: \"Keeping truth through the Three Non-acts, exhausting the classics in a plain room — when was he ever tired? Carrying the Way in the Six Arts, studying with easy grace — is this not a joy?\" Xinhua's headline was plainest: a commoner guarding the cultural lineage, a plain heart transmitting the elegant Way. And the students' words sound most like him: \"What the master said in life is what he did in life; what his brush wrote is what his heart believed.\" At the \"Youthful Peking University\" portrait show in 2023 he hummed a kunqu tune and said: \"Age never comes back — but the heart can stay young.\" Living each day well: that was his whole philosophy of life and death.\n>\n> *Xunzi*, \"Bu Gou\": \"In conduct the gentleman does not prize difficulty for its own sake; in speech he does not prize cleverness; in fame he does not prize mere spread — only what is fitting is prized.\" Not acting carelessly — act only as is fitting. He wrote those nine characters his whole life, and lived them.\n\n## 附录 A　年表\n\n| 年份 | 生平与学术 | 备注 |\n| --- | --- | --- |\n| 1934 | 12月10日生于杭州，祖籍浙江嵊县 | 出生不久迁居上海 |\n| 1955 | 毕业于上海浦光中学，考入北京大学哲学系五年制本科 | 校名沿革〔待核〕 |\n| 1960 | 7月本科毕业，留校任助教 | 助教至1979年5月，共十九年 |\n| 1961 | 年底借调高校文科教材编写组，参与《中国哲学史》教材 | 主持人任继愈〔待核〕 |\n| 1964 | 完成《王弼集校释》初稿 | 1980年始出版 |\n| 1979 | 2月《荀子新注》出版，署“北京大学《荀子》注释组”；6月晋升讲师 | 时年四十五岁 |\n| 1980 | 《王弼集校释》出版；12月晋升副教授 | 中华书局 |\n| 1981—1992 | 与石峻、方立天、许抗生、乐寿明等编《中国佛教思想资料选编》 | 四卷十册 |\n| 1984—1992 | 主持编《康有为学术著作选》 | 七种或十种〔待核〕 |\n| 1985 | 9月晋升教授；12月起任东方哲学教研室主任 | 1986年重建该室〔待核〕 |\n| 1987—2003 | 任北大昆曲研习社社长 | 一说1987-03-09起任北京昆曲研习社主任委员至2004年卸任、后任名誉社长〔待核〕；曾接俞平伯任北京昆曲研习社社长（主委）〔待核〕 |\n| 2005 | 春，应北大京昆社之邀讲“昆曲与非物质文化遗产”；白先勇青春版《牡丹亭》4月在北大演出 | 北京大学融媒体中心稿 |\n| 1990 | 起任博士生导师 | 〔待核〕 |\n| 1992 | 北大成立中国传统文化研究中心，原拟由其领衔，后改由他人主持 | 陈来回忆〔待核〕 |\n| 1995 | 发表《论中国传统文化的人文精神》（《国学研究》第3卷） | 〔待核〕 |\n| 2003 | 退休，年六十九；创办“国艺苑” | 一说2005年〔待核〕 |\n| 2008 | 《老子道德经注校释》出版 | 采用马王堆帛书对校〔待核〕 |\n| 2009 | 创办北大京昆古琴研究所 | 〔待核〕 |\n| 2010 | 起每年手书编印线装“周历”赠友 | 〔待核〕 |\n| 2016 | 《中国文化的根本精神》出版，获第十二届文津图书奖 | 入选全国中小学生阅读指导目录 |\n| 2019 | 因腹主动脉瘤接受手术，此后多靠轮椅 | 〔待核〕 |\n| 2025 | 11月28日《楼宇烈文集》首发式暨执教六十五周年座谈会 | 八卷九册，二百八十余万字〔待核〕 |\n| 2026 | 7月东方哲学学科建设研讨会视频致辞；9月1日最后一次受访；9月18日出席师生视频会；10月9日凌晨逝世；10月12—14日灵堂吊唁；10月15日八宝山东厅告别仪式 | 讣告作九十二岁，足岁九十一 |\n\n## 附录 B　主要著作\n\n| 类别 | 书名 | 版本 | 说明 |\n| --- | --- | --- | --- |\n| 古籍校释 | 《王弼集校释》 | 中华书局，1980；1984重印 | 1964年初稿，系统整理王弼《老子道德经注》《周易注》等 |\n| 古籍校释 | 《荀子新注》 | 中华书局，1979；2018再版署名“楼宇烈主撰” | 以王先谦《荀子集解》为底本 |\n| 古籍校释 | 《老子道德经注校释》 | 中华书局，2008 | 自《王弼集校释》析出，参校帛书〔待核〕 |\n| 古籍校释 | 《周易注校释
