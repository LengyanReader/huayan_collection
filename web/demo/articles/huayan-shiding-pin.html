<script>

  var MAP = {"法显西行": "person_110", "鸠摩罗什": "person_103", "佛驮跋陀罗": "person_006", "杜顺": "person_001", "智俨": "person_002", "法藏": "person_003", "澄观": "person_004", "宗密": "person_005", "实叉难陀": "person_007", "般若": "person_008", "义天": "person_010", "净源": "person_011", "月霞": "person_012", "海云继梦": "person_042", "南亭": "person_015", "成一": "person_016", "贤度": "person_017", "智光": "person_018", "应慈": "person_031", "常惺": "person_013", "支娄迦谶": "person_007b", "审祥": "person_050", "钦因": "person_041", "真禅": "person_044", "慧光": "person_090", "元晓": "person_060", "义湘": "person_061", "慧苑": "person_070", "子璿": "person_091", "均如": "person_062", "续法": "person_080", "良弁": "person_j01", "实忠": "person_j02", "等定": "person_j03", "圣宝": "person_j04", "观贤": "person_j05", "明惠": "person_j06", "凝然": "person_j07", "思元慧三": "person_f01", "成观法师": "person_126", "体化性果": "person_f02", "了中": "person_032", "賢首": "person_003", "康藏法藏": "person_003", "雲華": "person_002", "澄觀": "person_004", "清涼": "person_004", "義天": "person_010", "義湘": "person_061", "元曉": "person_060", "審祥": "person_050", "實叉難陀": "person_007", "佛陀跋陀罗": "person_006", "應慈": "person_031", "續法": "person_080", "淨源": "person_011"};
  var NAMES = Object.keys(MAP).sort(function(a,b){return b.length-a.length;});
  var BASE = '../famai/shanhe.html';
  function skip(node){
    var p = node.parentElement;
    while(p && p !== document.body){
      var tag = p.tagName;
      if(tag==='A'||tag==='CODE'||tag==='PRE'||tag==='BLOCKQUOTE') return true;
      var cls = p.getAttribute ? (p.getAttribute('class')||'') : '';
      if(/\b(q|quote|cite-card|lic)\b/.test(cls)) return true;
      p = p.parentElement;
    }
    return false;
  }
  function linkify(){
    var root = document.getElementById('article-root');
    if(!root) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var edits = [];
    var tn;
    while((tn = walker.nextNode())){
      if(skip(tn)) continue;
      var text = tn.textContent;
      for(var i=0;i<NAMES.length;i++){
        var nm = NAMES[i], pos = text.indexOf(nm);
        if(pos < 0) continue;
        edits.push({node:tn, name:nm, pid:MAP[nm], pos:pos});
        break;
      }
    }
    for(var j=edits.length-1;j>=0;j--){
      var e = edits[j];
      var t = e.node.textContent;
      var idx = t.indexOf(e.name);
      if(idx < 0) continue;
      var before = t.slice(0, idx), after = t.slice(idx + e.name.length);
      var a = document.createElement('a');
      a.href = BASE + '?master=' + e.pid;
      a.className = 'lin-deeplink';
      a.title = '在山河法脉地图中展开 ' + e.name;
      a.textContent = e.name;
      var frag = document.createDocumentFragment();
      if(before) frag.appendChild(document.createTextNode(before));
      frag.appendChild(a);
      if(after) frag.appendChild(document.createTextNode(after));
      e.node.parentNode.replaceChild(frag, e.node);
    }
    if(edits.length) console.log('[lin-deeplink] linked %d mentions' % edits.length);
  }
  if(document.readyState==='complete') setTimeout(linkify,100);
  else window.addEventListener('load', function(){ setTimeout(linkify,100); });
})();
</script>

var ARTICLE = {"id": "huayan-shiding-pin", "file": "articles/huayan-shiding-pin.html", "title": "九九华严第二十五品 十定品之拼读", "title_sub": "", "icon": "🔮", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第七会_普光明殿_等觉/华严经细读_第二十五部_十定品.md", "doc_md": "# 华严经细读·第二十五部《十定品》之拼读\n\n> **EN · The Chapter of the Ten Samādhis**\n\n> **底本**：八十华严 `T10n0279`。**范围：卷第四十～四十四（十定品第二十七·本品全文·跨五卷）**。本品属**第七会「普光明殿会」·等觉位**。\n\n---\n\n## 〇、凡例\n\n一、底本 `T10n0279`。二、引文程序注入（0 手抄·逐字回源）。三、存疑标〔待核〕推断标〔本文判断〕。四、体量自陈：**全文成篇**（L.282 深化：骨架纠错＋十种三昧逐种全引；骨架期手抄名目有误已正）。\n\n## 一、概述与品题解义\n\n**品名**：**十定品第二十七**。说主：**普賢菩薩**（大众念请·世尊劝敬·普贤自说）。**实测**：品文净 **27,028 CJK**，49 `<p>`＋0 `<lg>`（纯长行）。\n\n**【定位】**第七会首品——大众欲知十种三昧，世尊令「更禮敬普賢」；普贤说十种三昧（普光明→無礙輪），为**等觉菩萨之定境、如来果地行境之总纲**。\n\n**【一句】****定非枯坐——普光明至無礙輪，十定即十种遍入法界之行相。**\n\n## 二、本品全文注\n\n### 2.1 序分（程序全引）\n\n> 十定品之一十定品第二十七之一爾時，世尊在摩竭提國阿蘭若法菩提場中始成正覺，於普光明殿入剎那際諸佛三昧，以一切智自神通力現如來身，清淨無礙，無所依止，無有攀緣，住奢摩他最極寂靜，具大威德無所染著，能令見者悉得開悟，隨宜出興不失於時，恒住一相所謂無相。與十佛剎微塵數菩薩摩訶薩俱，靡不皆入灌頂之位，具菩薩行，等于法界無量無邊，獲諸菩薩普見三昧，大悲安隱一切眾生，神通自在，同於如來智慧深入，演真實義，具一切智，降伏眾魔，雖入世間心恒寂靜，住於菩薩無住解脫。其名曰：金剛慧菩薩、無等慧菩薩、義語慧菩薩、最勝慧菩薩、常捨慧菩薩、那伽慧菩薩、成就慧菩薩、調順慧菩薩、大力慧菩薩、難思慧菩薩、無礙慧菩薩、增上慧菩薩、普供慧菩薩、如理慧菩薩、善巧慧菩薩、法自在慧菩薩、法慧菩薩、寂靜慧菩薩、虛空慧菩薩、一相慧菩薩、善慧菩薩、如幻慧菩薩、廣大慧菩薩、勢力慧菩薩、世間慧菩薩、佛地慧菩薩、真實慧菩薩、尊勝慧菩薩、智光慧菩薩、無邊慧菩薩、念莊嚴菩薩、達空際菩薩、性莊嚴菩薩、甚深境菩薩、善解處非處菩薩、大光明菩薩、常光明菩薩、了佛種菩薩、心王菩薩、一行菩薩、常現神通菩薩、智慧芽菩薩、功德處菩薩、法燈菩薩、照世菩薩、持世菩薩、最安隱菩薩、最上菩薩、無上菩薩、無比菩薩、超倫菩薩、無礙行菩薩、光明焰菩薩、月光菩薩、一塵菩薩、堅固行菩薩、霔法雨菩薩、最勝幢菩薩、普莊嚴菩薩、智眼菩薩、法眼菩薩、慧雲菩薩、總持王菩薩、無住願菩薩、智藏菩薩、心王菩薩、內覺慧菩薩、住佛智菩薩、陀羅尼勇健力菩薩、持地力菩薩、妙月菩薩、須彌頂菩薩、寶頂菩薩、普光照菩薩、威德王菩薩、智慧輪菩薩、大威德菩薩、大龍相菩薩、質直行菩薩、不退轉菩薩、持法幢菩薩、無忘失菩薩、攝諸趣菩薩、不思議決定慧菩薩、遊戲無邊智菩薩、無盡妙法藏菩薩、智日菩薩、法日菩薩、智藏菩薩、智澤菩薩、普見菩薩、不空見菩薩、金剛通菩薩、金剛智菩薩、金剛焰菩薩、金剛慧菩薩、普眼菩薩、佛日菩薩、持佛金剛祕密義菩薩、普眼境界智莊嚴菩薩……。如是等菩薩摩訶薩十佛剎微塵數，往昔皆與毘盧遮那如來同修菩薩諸善根行。爾時，普眼菩薩摩訶薩承佛神力從座而起，偏袒右肩，右膝著地，合掌白佛言：「世尊！我於如來、應、正等覺，欲有所問，願垂哀許。」佛言：「普眼！恣汝所問，當為汝說，令汝心喜。」普眼菩薩言：「世尊！普賢菩薩及住普賢所有行願諸菩薩眾，成就幾何三昧解脫，而於菩薩諸大三昧或入、或出、或時安住？以於菩薩不可思議廣大三昧善入出故，能於一切三昧自在神通變化無有休息。」佛言：「善哉！普眼！汝為利益去、來、現在諸菩薩眾而問斯義。普眼！普賢菩薩今現在此，已能成就不可思議自在神通，出過一切諸菩薩上，難可值遇；從於無量菩薩行生，菩薩大願悉已清淨，所行之行皆無退轉，無量波羅蜜門、無礙陀羅尼門、無盡辯才門皆悉已得，清淨無礙，大悲利益一切眾生，以本願力盡未來際而無厭倦。汝應請彼，彼當為汝說其三昧自在解脫。」爾時，會中諸菩薩眾聞普賢名，即時獲得不可思議無量三昧，其心無礙寂然不動，智慧廣大難可測量，境界甚深無能與等；現前悉見無數諸佛，得如來力，同如來性，去、來、現在靡不明照，所有福德不可窮盡，一切神通皆已具足。其諸菩薩於普賢所，心生尊重，渴仰欲見，悉於眾會周遍觀察而竟不覩，亦不見其所坐之座。此由如來威力所持，亦是普賢神通自在使其然耳。爾時，普眼菩薩白佛言：「世尊！普賢菩薩今何所在？」佛言：「普眼！普賢菩薩今現在此道場眾會，親近我住，初無動移。」是時，普眼及諸菩薩復更觀察道場眾會，周遍求覓，白佛言：「世尊！我等今者猶未得見普賢菩薩其身及座。」佛言：「如是，善男子！汝等何故而不得見？善男子！普賢菩薩住處甚深不可說故。普賢菩薩獲無邊智慧門，入師子奮迅定，得無上自在用，入清淨無礙際，生如來十種力，以法界藏為身，一切如來共所護念，於一念頃悉能證入三世諸佛無差別智，是故汝等不能見耳。」爾時，普眼菩薩聞如來說普賢菩薩清淨功德，得十千阿僧祇三昧；以三昧力復遍觀察，渴仰欲見普賢菩薩，亦不能覩。其餘一切諸菩薩眾俱亦不見。時，普眼菩薩從三昧起，白佛言：「世尊！我已入十千阿僧祇三昧，求見普賢而竟不得，不見其身及身業、語及語業、意及意業、座及住處，悉皆不見。」佛言：「如是如是！善男子！當知皆以普賢菩薩住不思議解脫之力。普眼！於汝意云何？頗有人能說幻術文字中種種幻相所住處不？」答言：「不也。」佛言：「普眼！幻中幻相尚不可說，何況普賢菩薩祕密身境界、祕密語境界、祕密意境界，而於其中能入能見！何以故？普賢菩薩境界甚深，不可思議，無有量、已過量。舉要言之，普賢菩薩以金剛慧普入法界，於一切世界無所行、無所住，知一切眾生身皆即非身，無去無來，得無斷盡、無差別自在神通，無依無作，無有動轉，至於法界究竟邊際。善男子！若有得見普賢菩薩，若得承事，若得聞名，若有思惟，若有憶念，若生信解，若勤觀察，若始趣向，若正求覓，若興誓願，相續不絕，皆獲利益，無空過者。」爾時，普眼及一切菩薩眾於普賢菩薩心生渴仰，願得瞻覲，作如是言：「南無一切諸佛！南無普賢菩薩！」如是三稱，頭頂禮敬。爾時，佛告普眼菩薩及諸眾會言：「諸佛子！汝等宜更禮敬普賢，慇懃求請，又應專至觀察十方，想普賢身現在其前。如是思惟，周遍法界，深心信解，厭離一切，誓與普賢同一行願：入於不二真實之法，其身普現一切世間，悉知眾生諸根差別，遍一切處集普賢道。若能發起如是大願，則當得見普賢菩薩。」是時，普眼聞佛此語，與諸菩薩俱時頂禮，求請得見普賢大士。爾時，普賢菩薩即以解脫神通之力，如其所應為現色身，令彼一切諸菩薩眾皆見普賢親近如來，於此一切菩薩眾中坐蓮華座；亦見於餘一切世界一切佛所，從彼次第相續而來；亦見在彼一切佛所，演說一切諸菩薩行，開示一切智智之道，闡明一切菩薩神通，分別一切菩薩威德，示現一切三世諸佛。是時，普眼菩薩及一切菩薩眾見此神變，其心踊躍，生大歡喜，莫不頂禮普賢菩薩，心生尊重，如見十方一切諸佛。是時，以佛大威神力及諸菩薩信解之力、普賢菩薩本願力故，自然而雨十千種雲。所謂：種種華雲、種種鬘雲、種種香雲、種種末香雲、種種蓋雲、種種衣雲、種種嚴具雲、種種珍寶雲、種種燒香雲、種種繒綵雲。不可說世界六種震動；奏天音樂，其聲遠聞不可說世界；放大光明，其光普照不可說世界，令三惡趣悉得除滅，嚴淨不可說世界，令不可說菩薩入普賢行、不可說菩薩成普賢行，不可說菩薩於普賢行願悉得圓滿成阿耨多羅三藐三菩提。爾時，普眼菩薩白佛言：「世尊！普賢菩薩是住大威德者、住無等者、住無過者、住不退者、住平等者、住不壞者、住一切差別法者、住一切無差別法者、住一切眾生善巧心所住者、住一切法自在解脫三昧者。」佛言：「如是如是！普眼！如汝所說，普賢菩薩有阿僧祇清淨功德，所謂：無等莊嚴功德、無量寶功德、不思議海功德、無量相功德、無邊雲功德、無邊際不可稱讚功德、無盡法功德、不可說功德、一切佛功德、稱揚讚歎不可盡功德。」爾時，如來告普賢菩薩言：「普賢！汝應為普眼及此會中諸菩薩眾說十三昧，令得善入，成滿普賢所有行願。諸菩薩摩訶薩說此十大三昧故，令過去菩薩已得出離，現在菩薩今得出離，未來菩薩當得出離。何者為十？一者普光大三昧，二者妙光大三昧，三者次第遍往諸佛國土大三昧，四者清淨深心行大三昧，五者知過去莊嚴藏大三昧，六者智光明藏大三昧，七者了知一切世界佛莊嚴大三昧，八者眾生差別身大三昧，九者法界自在大三昧，十者無礙輪大三昧。此十大三昧，諸大菩薩乃能善入，去、來、現在一切諸佛已說、當說、現說。若諸菩薩愛樂尊重，修習不懈，則得成就。如是之人，則名為佛，則名如來，亦則名為得十力人，亦名導師，亦名大導師，亦名一切智，亦名一切見，亦名住無礙，亦名達諸境，亦名一切法自在。此菩薩普入一切世界，而於世界無所著；普入一切眾生界，而於眾生無所取；普入一切身，而於身無所礙；普入一切法界，而知法界無有邊。親近三世一切佛，明見一切諸佛法，巧說一切文字，了達一切假名，成就一切菩薩清淨道，安住一切菩薩差別行。於一念中，普得一切三世智，普知一切三世法，普說一切諸佛教，普轉一切不退輪，於去、來、現在一一世，普證一切菩提道；於此一一菩提中，普了一切佛所說。此是諸菩薩法相門，是諸菩薩智覺門，是一切種智無勝幢門，是普賢菩薩諸行願門，是猛利神通誓願門，是一切總持辯才門，是三世諸法差別門，是一切諸佛示現門，是以薩婆若安立一切眾生門，是以佛神力嚴淨一切世界門。若菩薩入此三昧，得法界力無有窮盡，得虛空行無有障礙；得法王位無量自在，譬如世間灌頂受職。得無邊智，一切通達；得廣大力，十種圓滿；成無諍心，入寂滅際；大悲無畏，猶如師子；為智慧丈夫，然正法明燈；一切功德歎不可盡，聲聞、獨覺莫能思議；得法界智，住無動際，而能隨俗種種開演；住於無相，善入法相；得自性清淨藏，生如來清淨家；善開種種差別法門，而以智慧了無所有；善知於時，常行法施開悟一切，名為智者；普攝眾生，悉令清淨；以方便智示成佛道，而常修行菩薩之行無有斷盡；入一切智方便境界，示現種種廣大神通。是故，普賢！汝今應當分別廣說一切菩薩十大三昧，今此眾會咸皆願聞。」爾時，普賢菩薩承如來旨，觀普眼等諸菩薩眾而告之言：「\n\n### 2.2 十种三昧（逐种全引）\n\n**十种三昧总表**（实测纠错版——骨架期手抄名目「普光大三昧」等七处有误，今悉依经文正）：\n\n| 序 | 三昧 | 节首句眼 |\n|---|---|---|\n| 1 | 普光明三昧 | 有十種無盡法 |\n| 2 | 妙光明三昧 | 有十種（直说三昧行相） |\n| 3 | 次第遍往諸佛國土神通三昧 | 有十種（直说三昧行相） |\n| 4 | 清淨深心行三昧 | 有十種（直说三昧行相） |\n| 5 | 知過去莊嚴藏三昧 | 有十種（直说三昧行相） |\n| 6 | 智光明藏三昧 | 有十種（直说三昧行相） |\n| 7 | 了知一切世界佛莊嚴三昧 | 有十種（直说三昧行相） |\n| 8 | 一切眾生差別身三昧 | 有十種（直说三昧行相） |\n| 9 | 法界自在三昧 | 有十種（直说三昧行相） |\n| 10 | 無礙輪三昧 | 有十種（直说三昧行相） |\n\n**逐种全文**：\n\n**（1）普光明三昧**——节首句眼：「有十種無盡法」：\n\n> 佛子！云何為菩薩摩訶薩普光明三昧？佛子！此菩薩摩訶薩有十種無盡法。何者為十？所謂：諸佛出現智無盡、眾生變化智無盡、世界如影智無盡、深入法界智無盡、善攝菩薩智無盡、菩薩不退智無盡、善觀一切法義智無盡、善持心力智無盡、住廣大菩提心智無盡、住一切佛法一切智願力智無盡。佛子！是名菩薩摩訶薩十種無盡法。佛子！此菩薩摩訶薩發十種無邊心。何等為十？所謂：發度脫一切眾生無邊心；發承事一切諸佛無邊心；發供養一切諸佛無邊心；發普見一切諸佛無邊心；發受持一切佛法不忘失無邊心；發示現一切佛無量神變無邊心；發為得佛力故，不捨一切菩提行無邊心；發普入一切智微細境界，說一切佛法無邊心；發普入佛不思議廣大境界無邊心；發於佛辯才起深志樂，領受諸佛法無邊心；發示現種種自在身，入一切如來道場眾會無邊心。是為十。佛子！此菩薩摩訶薩有十種入三昧差別智。何者為十？所謂：東方入定西方起，西方入定東方起，南方入定北方起，北方入定南方起，東北方入定西南方起，西南方入定東北方起，西北方入定東南方起，東南方入定西北方起，下方入定上方起，上方入定下方起。是為十。「佛子！此菩薩摩訶薩有十種入大三昧善巧智。何者為十？佛子！菩薩摩訶薩以三千大千世界為一蓮華，現身遍此蓮華之上結跏趺坐，身中復現三千大千世界，其中有百億四天下，一一四天下現百億身，一一身入百億百億三千大千世界，於彼世界一一四天下現百億百億菩薩修行，一一菩薩修行生百億百億決定解，一一決定解令百億百億根性圓滿，一一根性成百億百億菩薩法不退業。然所現身非一非多，入定、出定無所錯亂。佛子！如羅睺阿脩羅王，本身長七百由旬，化形長十六萬八千由旬，於大海中出其半身，與須彌山而正齊等。佛子！彼阿脩羅王雖化其身長十六萬八千由旬，然亦不壞本身之相，諸蘊、界、處悉皆如本，心不錯亂，不於變化身而作他想，於其本身生非己想，本受生身恒受諸樂，化身常現種種自在神通威力。佛子！阿脩羅王有貪、恚、癡，具足憍慢，尚能如是變現其身；何況菩薩摩訶薩能深了達心法如幻，一切世間皆悉如夢，一切諸佛出興於世皆如影像，一切世界猶如變化，言語音聲悉皆如響，見如實法，以如實法而為其身，知一切法本性清淨，了知身心無有實體，其身普住無量境界，以佛智慧廣大光明淨修一切菩提之行！「佛子！菩薩摩訶薩住此三昧，超過世間，遠離世間，無能惑亂，無能映奪。佛子！譬如比丘觀察內身，住不淨觀，審見其身皆是不淨。菩薩摩訶薩亦復如是，住此三昧，觀察法身，見諸世間普入其身，於中明見一切世間及世間法，於諸世間及世間法皆無所著。佛子！是名菩薩摩訶薩第一普光明大三昧善巧智。「\n\n**（2）妙光明三昧**——节首句眼：「有十種（直说三昧行相）」：\n\n> 佛子！云何為菩薩摩訶薩妙光明三昧？佛子！此菩薩摩訶薩能入三千大千世界微塵數三千大千世界，於一一世界現三千大千世界微塵數身，一一身放三千大千世界微塵數光，一一光現三千大千世界微塵數色，一一色照三千大千世界微塵數世界，一一世界中調伏三千大千世界微塵數眾生。是諸世界種種不同，菩薩悉知，所謂：世界雜染、世界清淨、世界所因、世界建立、世界同住、世界光色、世界來往；如是一切，菩薩悉知，菩薩悉入。是諸世界亦悉來入菩薩之身，然諸世界無有雜亂，種種諸法亦不壞滅。佛子！譬如日出遶須彌山、照七寶山，其七寶山及寶山間皆有光影分明顯現，其寶山上所有日影莫不顯現山間影中，其七山間所有日影亦悉顯現山上影中；如是展轉，更相影現，或說日影出七寶山，或說日影出七山間，或說日影入七寶山，或說日影入七山間；但此日影更相照現，無有邊際，體性非有，亦復非無，不住於山，不離於山，不住於水，亦不離水。佛子！菩薩摩訶薩亦復如是，住此妙光廣大三昧，不壞世間安立之相，不滅世間諸法自性；不住世界內，不住世界外；於諸世界無所分別，亦不壞於世界之相；觀一切法一相無相，亦不壞於諸法自性；住真如性，恒不捨離。佛子！譬如幻師善知幻術，住四衢道作諸幻事，於一日中一須臾頃，或現一日，或現一夜，或復現作七日七夜、半月一月、一年百年，隨其所欲皆能示現城邑聚落、泉流河海、日月雲雨、宮殿屋宅，如是一切靡不具足；不以示現經年歲故，壞其根本一日一時；不以本時極短促故，壞其所現日月年歲；幻相明現，本日不滅。菩薩摩訶薩亦復如是，入此妙光廣大三昧，現阿僧祇世界入一世界。其阿僧祇世界一一皆有地、水、火、風、大海、諸山、城邑、聚落、園林、屋宅、天宮、龍宮、夜叉宮、乾闥婆宮、阿脩羅宮、迦樓羅宮、緊那羅宮、摩睺羅伽宮，種種莊嚴皆悉具足。欲界、色界、無色界，小千世界、大千世界，業行果報，死此生彼。一切世間所有時節、須臾、晝夜、半月、一月、一歲、百歲、成劫、壞劫，雜染國土、清淨國土、廣大國土、狹小國土，於中諸佛出興于世，佛剎清淨，菩薩眾會周匝圍遶，神通自在，教化眾生。其諸國土所在方處，無量人眾悉皆充滿，殊形異趣種種眾生無量無邊不可思議，去、來、現在清淨業力出生無量上妙珍寶。如是等事，咸悉示現，入一世界。菩薩於此普皆明見，普入普觀，普思普了，以無盡智皆如實知，不以彼世界多故壞此一世界，不以此世界一故壞彼多世界。何以故？菩薩知一切法皆無我故，是名：入無命法、無作法者；菩薩於一切世間勤修行無諍法故，是名：住無我法者；菩薩如實見一切身皆從緣起故，是名：住無眾生法者；菩薩知一切生滅法皆從因生故，是名：住無補伽羅法者；菩薩知諸法本性平等故，是名：住無意生、無摩納婆法者；菩薩知一切法本性寂靜故，是名：住寂靜法者；菩薩知一切法一相故，是名：住無分別法者；菩薩知法界無有種種差別法故，是名：住不思議法者；菩薩勤修一切方便，善調伏眾生故，是名：住大悲法者。「佛子！菩薩如是能以阿僧祇世界入一世界，知無數眾生種種差別，見無數菩薩各各發趣，觀無數諸佛處處出興；彼諸如來所演說法，其諸菩薩悉能領受，亦見自身於中修行；然不捨此處而見在彼，亦不捨彼處而見在此，彼身、此身無有差別。入法界故，常勤觀察無有休息，不捨智慧無退轉故。如有幻師隨於一處作諸幻術，不以幻地故壞於本地，不以幻日故壞於本日。菩薩摩訶薩亦復如是，於無國土現有國土，於有國土現無國土；於有眾生現無眾生，於無眾生現有眾生；無色現色，色現無色；初不亂後，後不亂初。菩薩了知一切世法悉亦如是，同於幻化。知法幻故，知智幻；知智幻故，知業幻；知智幻、業幻已，起於幻智，觀一切業。如世幻者，不於處外而現其幻，亦不於幻外而有其處。菩薩摩訶薩亦復如是，不於虛空外入世間，亦不於世間外入虛空。何以故？虛空、世間無差別故，住於世間亦住虛空。菩薩摩訶薩於虛空中能見、能修一切世間種種差別妙莊嚴業，於一念頃悉能了知無數世界若成若壞，亦知諸劫相續次第；能於一念現無數劫，亦不令其一念廣大。菩薩摩訶薩得不思議解脫幻智，到於彼岸；住於幻際，入世幻數，思惟諸法悉皆如幻；不違幻世，盡於幻智，了知三世與幻無別，決定通達，心無邊際。如諸如來住如幻智，其心平等；菩薩摩訶薩亦復如是，知諸世間皆悉如幻，於一切處皆無所著、無有我所。如彼幻師作諸幻事，雖不與彼幻事同住，而於幻事亦無迷惑；菩薩摩訶薩亦復如是，知一切法到於彼岸，心不計我能入於法，亦不於法而有錯亂。是為菩薩摩訶薩第二妙光明大三昧善巧智。之二十定品第二十七之二「\n\n**（3）次第遍往諸佛國土神通三昧**——节首句眼：「有十種（直说三昧行相）」：\n\n> 佛子！云何為菩薩摩訶薩次第遍往諸佛國土神通三昧？佛子！此菩薩摩訶薩過於東方無數世界，復過爾所世界微塵數世界，於彼諸世界中入此三昧，或剎那入，或須臾入，或相續入，或日初分時入，或日中分時入，或日後分時入，或夜初分時入，或夜中分時入，或夜後分時入，或一日入，或五日入，或半月入，或一月入，或一年入，或百年入，或千年入，或百千年入，或億年入，或百千億年入，或百千那由他億年入，或一劫入，或百劫入，或百千劫入，或百千那由他億劫入，或無數劫入，或無量劫入，或無邊劫入，或無等劫入，或不可數劫入，或不可稱劫入，或不可思劫入，或不可量劫入，或不可說劫入，或不可說不可說劫入，若久、若近、若法、若時，種種不同。菩薩於彼不生分別，心無染著，不作二、不作不二，不作普、不作別，雖離此分別而以神通方便從三昧起，於一切法不忘不失至於究竟。譬如日天子周行照曜，晝夜不住；日出名晝，日沒名夜，晝亦不生，夜亦不滅。菩薩摩訶薩於無數世界入神通三昧，入三昧已，明見爾所無數世界亦復如是。佛子！是為菩薩摩訶薩第三次第遍往諸佛國土神通大三昧善巧智。「\n\n**（4）清淨深心行三昧**——节首句眼：「有十種（直说三昧行相）」：\n\n> 佛子！云何為菩薩摩訶薩清淨深心行三昧？佛子！此菩薩摩訶薩知諸佛身數等眾生，見無量佛過阿僧祇世界微塵數。於彼一一諸如來所，以一切種種妙香而作供養，以一切種種妙華而作供養，以一切種種蓋大如阿僧祇佛剎而作供養，以超過一切世界一切上妙莊嚴具而作供養，散一切種種寶而作供養，以一切種種莊嚴具莊嚴經行處而作供養，以一切無數上妙摩尼寶藏而作供養，以佛神力所流出過諸天上味飲食而作供養，一切佛剎種種上妙諸供養具，能以神力普皆攝取而作供養。於彼一一諸如來所，恭敬尊重，頭頂禮敬，舉身布地，請問佛法，讚佛平等，稱揚諸佛廣大功德，入於諸佛所入大悲，得佛平等無礙之力；於一念頃，一切佛所勤求妙法，然於諸佛出興於世、入般涅槃，如是之相皆無所得。如散動心，了別所緣，心起不知何所緣起，心滅不知何所緣滅；此菩薩摩訶薩亦復如是，終不分別如來出世及涅槃相。佛子！如日中陽焰，不從雲生，不從池生，不處於陸，不住於水，非有非無，非善非惡，非清非濁，不堪飲漱，不可穢污，非有體非無體，非有味非無味，以因緣故而現水相，為識所了，遠望似水而興水想，近之則無，水想自滅；此菩薩摩訶薩亦復如是，不得如來出興於世及涅槃相。諸佛有相及以無相，皆是想心之所分別。佛子！此三昧名為：清淨深心行。菩薩摩訶薩於此三昧，入已而起，起已不失。譬如有人從睡得寤，憶所夢事，覺時雖無夢中境界，而能憶念、心不忘失。菩薩摩訶薩亦復如是，入於三昧，見佛聞法，從定而起，憶持不忘，而以此法開曉一切道場眾會，莊嚴一切諸佛國土，無量義趣悉得明達，一切法門皆亦清淨，然大智炬，長諸佛種，無畏具足，辯才不竭，開示演說甚深法藏。是為菩薩摩訶薩第四清淨深心行大三昧善巧智。「\n\n**（5）知過去莊嚴藏三昧**——节首句眼：「有十種（直说三昧行相）」：\n\n> 佛子！云何為菩薩摩訶薩知過去莊嚴藏三昧？佛子！此菩薩摩訶薩能知過去諸佛出現，所謂：劫次第中諸剎次第，剎次第中諸劫次第，劫次第中諸佛出現次第，佛出現次第中說法次第，說法次第中諸心樂次第，心樂次第中諸根次第，根次第中調伏次第，調伏次第中諸佛壽命次第，壽命次第中知億那由他年歲數量次第。佛子！此菩薩摩訶薩得如是無邊次第智故，則知過去諸佛，則知過去諸剎，則知過去諸法門，則知過去諸劫，則知過去諸法，則知過去諸心，則知過去諸解，則知過去諸眾生，則知過去諸煩惱，則知過去諸儀式，則知過去諸清淨。佛子！此三昧名：過去清淨藏，於一念中，能入百劫，能入千劫，能入百千劫，能入百千億那由他劫，能入無數劫，能入無量劫，能入無邊劫，能入無等劫，能入不可數劫，能入不可稱劫，能入不可思劫，能入不可量劫，能入不可說劫，能入不可說不可說劫。佛子！彼菩薩摩訶薩入此三昧，不滅現在，不緣過去。佛子！彼菩薩摩訶薩從此三昧起，於如來所受十種不可思議灌頂法，亦得、亦清淨、亦成就、亦入、亦證、亦滿、亦持，平等了知三輪清淨。何等為十？一者辯不違義，二者說法無盡，三者訓辭無失，四者樂說不斷，五者心無恐畏，六者語必誠實，七者眾生所依，八者救脫三界，九者善根最勝，十者調御妙法。佛子！此是十種灌頂法。若菩薩入此三昧，從三昧起，無間則得。如歌羅邏入胎藏時，於一念間識則託生；菩薩摩訶薩亦復如是，從此定起，於如來所，一念則得此十種法。佛子！是名菩薩摩訶薩第五知過去莊嚴藏大三昧善巧智。「\n\n**（6）智光明藏三昧**——节首句眼：「有十種（直说三昧行相）」：\n\n> 佛子！云何為菩薩摩訶薩智光明藏三昧？佛子！彼菩薩摩訶薩住此三昧，能知未來一切世界一切劫中所有諸佛；若已說、若未說，若已授記、若未授記，種種名號各各不同，所謂：無數名、無量名、無邊名、無等名、不可數名、不可稱名、不可思名、不可量名、不可說名；當出現於世，當利益眾生，當作法王，當興佛事，當說福利，當讚善義，當說白分義，當淨治諸惡，當安住功德，當開示第一義諦，當入灌頂位，當成一切智。彼諸如來修圓滿行，發圓滿願，入圓滿智，有圓滿眾，備圓滿莊嚴，集圓滿功德，悟圓滿法，得圓滿果，具圓滿相，成圓滿覺。彼諸如來名姓種族、方便善巧、神通變化、成熟眾生、入般涅槃，如是一切皆悉了知。此菩薩於一念中，能入一劫、百劫、千劫、百千劫、百千億那由他劫，入閻浮提微塵數劫，入四天下微塵數劫，入小千世界微塵數劫，入中千世界微塵數劫，入大千世界微塵數劫，入佛剎微塵數劫，入百千佛剎微塵數劫，入百千億那由他佛剎微塵數劫，入無數佛剎微塵數劫，入無量佛剎微塵數劫，入無邊佛剎微塵數劫，入無等佛剎微塵數劫，入不可數佛剎微塵數劫，入不可稱佛剎微塵數劫，入不可思佛剎微塵數劫，入不可量佛剎微塵數劫，入不可說佛剎微塵數劫，入不可說不可說佛剎微塵數劫。如是未來一切世界所有劫數，能以智慧皆悉了知。以了知故，其心復入十種持門。何者為十？所謂：入佛持故，得不可說佛剎微塵數諸佛護念；入法持故，得十種陀羅尼光明無盡辯才；入行持故，出生圓滿殊勝諸願；入力持故，無能映蔽，無能摧伏；入智持故，所行佛法無有障礙；入大悲持故，轉於不退清淨法輪；入差別善巧句持故，轉一切文字輪，淨一切法門地；入師子受生法持故，開法關鑰，出欲淤泥；入智力持故，修菩薩行常不休息；入善友力持故，令無邊眾生普得清淨；入無住力持故，入不可說不可說廣大劫；入法力持故，以無礙方便智，知一切法自性清淨。「佛子！菩薩摩訶薩住此三昧已，善巧住不可說不可說劫，善巧住不可說不可說剎，善巧知不可說不可說種種眾生，善巧知不可說不可說眾生異相，善巧知不可說不可說同異業報，善巧知不可說不可說精進、諸根習氣、相續差別諸行，善巧知不可說不可說無量染淨種種思惟，善巧知不可說不可說法種種義、無量文字、演說言辭，善巧知不可說不可說種種佛出現、種族、時節、現相、說法、施為佛事、入般涅槃，善巧知不可說不可說無邊智慧門，善巧知不可說不可說一切神通無量變現。佛子！譬如日出，世間所有村營、城邑、宮殿、屋宅、山澤、鳥獸、樹林、華果，如是一切種種諸物，有目之人悉得明見。佛子！日光平等，無有分別，而能令目見種種相；此大三昧亦復如是，體性平等，無有分別，能令菩薩知不可說不可說百千億那由他差別之相。佛子！此菩薩摩訶薩如是了知時，令諸眾生得十種不空。何等為十？一者見不空，令諸眾生生善根故；二者聞不空，令諸眾生得成熟故；三者同住不空，令諸眾生心調伏故；四者發起不空，令諸眾生如言而作，通達一切諸法義故；五者行不空，令無邊世界皆清淨故；六者親近不空，於不可說不可說佛剎諸如來所，斷不可說不可說眾生疑故；七者願不空，隨所念眾生，令作勝供養，成就諸願故；八者善巧法不空，皆令得住無礙解脫清淨智故；九者雨法雨不空，於不可說不可說諸根眾生中，方便開示一切智行令住佛道故；十者出現不空，現無邊相，令一切眾生皆蒙照故。佛子！菩薩摩訶薩住此三昧，得十種不空時，諸天王眾皆來頂禮，諸龍王眾興大香雲，諸夜叉王頂禮其足，阿脩羅王恭敬供養，迦樓羅王前後圍遶，諸梵天王悉來勸請，緊那羅王、摩睺羅伽王咸共稱讚，乾闥婆王常來親近，諸人王眾承事供養。佛子！是為菩薩摩訶薩第六智光明藏大三昧善巧智。「\n\n**（7）了知一切世界佛莊嚴三昧**——节首句眼：「有十種（直说三昧行相）」：\n\n> 佛子！云何為菩薩摩訶薩了知一切世界佛莊嚴三昧？佛子！此三昧何故名了知一切世界佛莊嚴？佛子！菩薩摩訶薩住此三昧，能次第入東方世界，能次第入南方世界，西方、北方、四維、上下，所有世界悉亦如是，能次第入。皆見諸佛出興於世，亦見彼佛一切神力，亦見諸佛所有遊戲，亦見諸佛廣大威德，亦見諸佛最勝自在，亦見諸佛大師子吼，亦見諸佛所修諸行，亦見諸佛種種莊嚴，亦見諸佛神足變化，亦見諸佛眾會雲集、眾會清淨、眾會廣大、眾會一相、眾會多相、眾會處所、眾會居止、眾會成熟、眾會調伏、眾會威德，如是一切悉皆明見。亦見眾會其量大小等閻浮提，亦見眾會等四天下，亦見眾會等小千界，亦見眾會等中千界，亦見眾會量等三千大千世界。亦見眾會充滿百千億那由他佛剎，亦見眾會充滿阿僧祇佛剎，亦見眾會充滿百佛剎微塵數佛剎，亦見眾會充滿千佛剎微塵數佛剎，亦見眾會充滿百千億那由他佛剎微塵數佛剎，亦見眾會充滿無數佛剎微塵數佛剎，亦見眾會充滿無量佛剎微塵數佛剎，亦見眾會充滿無邊佛剎微塵數佛剎，亦見眾會充滿無等佛剎微塵數佛剎，亦見眾會充滿不可數佛剎微塵數佛剎，亦見眾會充滿不可稱佛剎微塵數佛剎，亦見眾會充滿不可思佛剎微塵數佛剎，亦見眾會充滿不可量佛剎微塵數佛剎，亦見眾會充滿不可說佛剎微塵數佛剎，亦見眾會充滿不可說不可說佛剎微塵數佛剎。亦見諸佛於彼眾會道場中，示現種種相、種種時、種種國土、種種變化、種種神通、種種莊嚴、種種自在、種種形量、種種事業。菩薩摩訶薩亦見自身往彼眾會，亦自見身在彼說法，亦自見身受持佛語，亦自見身善知緣起，亦自見身住在虛空，亦自見身住於法身，亦自見身不生染著，亦自見身不住分別，亦自見身無有疲倦，亦自見身普入諸智，亦自見身普知諸義，亦自見身普入諸地，亦自見身普入諸趣，亦自見身普知方便，亦自見身普住佛前，亦自見身普入諸力，亦自見身普入真如，亦自見身普入無諍，亦自見身普入諸法。如是見時，不分別國土，不分別眾生，不分別佛，不分別法，不執著身，不執著身業，不執著心，不執著意。譬如諸法，不分別自性，不分別音聲，而自性不捨、名字不滅；菩薩摩訶薩亦復如是，不捨於行，隨世所作，而於此二無所執著。「佛子！菩薩摩訶薩見佛無量光色、無量形相，圓滿成就，平等清淨；一一現前，分明證了。或見佛身種種光明，或見佛身圓光一尋，或見佛身如盛日色，或見佛身微妙光色，或見佛身作清淨色，或見佛身作黃金色，或見佛身作金剛色，或見佛身作紺青色，或見佛身作無邊色，或見佛身作大青摩尼寶色。或見佛身其量七肘，或見佛身其量八肘，或見佛身其量九肘，或見佛身其量十肘，或見佛身二十肘量，或見佛身三十肘量，如是乃至一百肘量、一千肘量。或見佛身一俱盧舍量，或見佛身半由旬量，或見佛身一由旬量，或見佛身十由旬量，或見佛身百由旬量，或見佛身千由旬量，或見佛身百千由旬量，或見佛身閻浮提量，或見佛身四天下量，或見佛身小千界量，或見佛身中千界量，或見佛身大千界量，或見佛身百大千世界量，或見佛身千大千世界量，或見佛身百千大千世界量，或見佛身百千億那由他大千世界量，或見佛身無數大千世界量，或見佛身無量大千世界量，或見佛身無邊大千世界量，或見佛身無等大千世界量，或見佛身不可數大千世界量，或見佛身不可稱大千世界量，或見佛身不可思大千世界量，或見佛身不可量大千世界量，或見佛身不可說大千世界量，或見佛身不可說不可說大千世界量。佛子！菩薩如是見諸如來無量色相、無量形狀、無量示現、無量光明、無量光明網，其光分量等于法界，於法界中無所不照，普令發起無上智慧；又見佛身，無有染著，無有障礙，上妙清淨。佛子！菩薩如是見於佛身，而如來身不增不減。譬如虛空，於蟲所食芥子孔中亦不減小，於無數世界中亦不增廣；其諸佛身亦復如是，見大之時亦無所增，見小之時亦無所減。佛子！譬如月輪，閻浮提人見其形小而亦不減，月中住者見其形大而亦不增；菩薩摩訶薩亦復如是，住此三昧，隨其心樂，見諸佛身種種化相，言辭演法，受持不忘，而如來身不增不減。佛子！譬如眾生命終之後，將受生時，不離於心，所見清淨；菩薩摩訶薩亦復如是，不離於此甚深三昧，所見清淨。「佛子！菩薩摩訶薩住此三昧，成就十種速疾法。何者為十？所謂：速增諸行圓滿大願，速以法光照耀世間，速以方便轉於法輪度脫眾生，速隨眾生業示現諸佛清淨國土，速以平等智趣入十力，速與一切如來同住，速以大慈力摧破魔軍，速斷眾生疑令生歡喜，速隨勝解示現神變，速以種種妙法言辭淨諸世間。佛子！此菩薩摩訶薩復得十種法印，印一切法。何等為十？一者同去、來、今一切諸佛平等善根，二者同諸如來得無邊際智慧法身，三者同諸如來住不二法，四者同諸如來觀察三世無量境界皆悉平等，五者同諸如來得了達法界無礙境界，六者同諸如來成就十力所行無礙，七者同諸如來永絕二行住無諍法，八者同諸如來教化眾生恒不止息，九者同諸如來於智善巧、義善巧中能善觀察，十者同諸如來與一切佛平等無二。「佛子！若菩薩摩訶薩成就此了知一切世界佛莊嚴大三昧善巧方便門，是無師者，不由他教，自入一切佛法故；是丈夫者，能開悟一切眾生故；是清淨者，知心性本淨故；是第一者，能度脫一切世間故；是安慰者，能開曉一切眾生故；是安住者，未住佛種性者令得住故；是真實知者，入一切智門故；是無異想者，所言無二故；是住法藏者，誓願了知一切佛法故；是能雨法雨者，隨眾生心樂悉令充足故。佛子！譬如帝釋，於頂髻中置摩尼寶，以寶力故，威光轉盛。其釋天王初獲此寶則得十法，出過一切三十三天。何等為十？一者色相，二者形體，三者示現，四者眷屬，五者資具，六者音聲，七者神通，八者自在，九者慧解，十者智用。如是十種，悉過一切三十三天。菩薩摩訶薩亦復如是，初始獲得此三昧時，則得十種廣大智藏。何等為十？一者照耀一切佛剎智，二者知一切眾生受生智，三者普作三世變化智，四者普入一切佛身智，五者通達一切佛法智，六者普攝一切淨法智，七者普令一切眾生入法身智，八者現見一切法普眼清淨智，九者一切自在到於彼岸智，十者安住一切廣大法普盡無餘智。「佛子！菩薩摩訶薩住此三昧，復得十種最清淨威德身。何等為十？一者為照耀不可說不可說世界故，放不可說不可說光明輪；二者為令世界咸清淨故，放不可說不可說無量色相光明輪；三者為調伏眾生故，放不可說不可說光明輪；四者為親近一切諸佛故，化作不可說不可說身；五者為承事供養一切諸佛故，雨不可說不可說種種殊妙香華雲；六者為承事供養一切佛，及調伏一切眾生故，於一一毛孔中化作不可說不可說種種音樂；七者為成熟眾生故，現不可說不可說種種無量自在神變；八者為於十方種種名號一切佛所請問法故，一步超過不可說不可說世界；九者為令一切眾生見聞之者皆不空故，現不可說不可說種種無量清淨色相身，無能見頂；十者為與眾生開示無量祕密法故，發不可說不可說音聲語言。佛子！菩薩摩訶薩得此十種最清淨威德身已，能令眾生得十種圓滿。何等為十？一者能令眾生得見於佛，二者能令眾生深信於佛，三者能令眾生聽聞於法，四者能令眾生知有佛世界，五者能令眾生見佛神變，六者能令眾生念所集業，七者能令眾生定心圓滿，八者能令眾生入佛清淨，九者能令眾生發菩提心，十者能令眾生圓滿佛智。佛子！菩薩摩訶薩令眾生得十種圓滿已，復為眾生作十種佛事。何等為十？所謂：以音聲作佛事，為成熟眾生故；以色形作佛事，為調伏眾生故；以憶念作佛事，為清淨眾生故；以震動世界作佛事，為令眾生離惡趣故；以方便覺悟作佛事，為令眾生不失念故；以夢中現相作佛事，為令眾生恒正念故；以放大光明作佛事，為普攝取諸眾生故；以修菩薩行作佛事，為令眾生住勝願故；以成正等覺作佛事，為令眾生知幻法故；以轉妙法輪作佛事，為眾說法不失時故；以現住壽命作佛事，為調伏一切眾生故；以示般涅槃作佛事，知諸眾生起疲厭故。佛子！是為菩薩摩訶薩第七了知一切世界佛莊嚴大三昧善巧智。之三十定品第二十七之三「\n\n**（8）一切眾生差別身三昧**——节首句眼：「有十種（直说三昧行相）」：\n\n> 佛子！云何為菩薩摩訶薩一切眾生差別身三昧？佛子！菩薩摩訶薩住此三昧，得十種無所著。何者為十？所謂：於一切剎無所著，於一切方無所著，於一切劫無所著，於一切眾無所著，於一切法無所著，於一切菩薩無所著，於一切菩薩願無所著，於一切三昧無所著，於一切佛無所著，於一切地無所著。是為十。「佛子！菩薩摩訶薩於此三昧云何入？云何起？佛子！菩薩摩訶薩於此三昧，內身入，外身起；外身入，內身起；同身入，異身起；異身入，同身起；人身入，夜叉身起；夜叉身入，龍身起；龍身入，阿脩羅身起；阿脩羅身入，天身起；天身入，梵王身起；梵王身入，欲界身起；天中入，地獄起；地獄入，人間起；人間入，餘趣起；千身入，一身起；一身入，千身起；那由他身入，一身起；一身入，那由他身起；閻浮提眾生眾中入，西瞿陀尼眾生眾中起；西瞿陀尼眾生眾中入，北拘盧眾生眾中起；北拘盧眾生眾中入，東毘提訶眾生眾中起；東毘提訶眾生眾中入，三天下眾生眾中起；三天下眾生眾中入，四天下眾生眾中起；四天下眾生眾中入，一切海差別眾生眾中起；一切海差別眾生眾中入，一切海神眾中起；一切海神眾中入，一切海水大中起；一切海水大中入，一切海地大中起；一切海地大中入，一切海火大中起；一切海火大中入，一切海風大中起；一切海風大中入，一切四大種中起；一切四大種中入，無生法中起；無生法中入，妙高山中起；妙高山中入，七寶山中起；七寶山中入，一切地種種稼穡樹林黑山中起；一切地種種稼穡樹林黑山中入，一切妙香華寶莊嚴中起；一切妙香華寶莊嚴中入，一切四天下下方、上方一切眾生受生中起；一切四天下下方、上方一切眾生受生中入，小千世界眾生眾中起；小千世界眾生眾中入，中千世界眾生眾中起；中千世界眾生眾中入，大千世界眾生眾中起；大千世界眾生眾中入，百千億那由他三千大千世界眾生眾中起；百千億那由他三千大千世界眾生眾中入，無數世界眾生眾中起；無數世界眾生眾中入，無量世界眾生眾中起；無量世界眾生眾中入，無邊佛剎眾生眾中起；無邊佛剎眾生眾中入，無等佛剎眾生眾中起；無等佛剎眾生眾中入，不可數世界眾生眾中起；不可數世界眾生眾中入，不可稱世界眾生眾中起；不可稱世界眾生眾中入，不可思世界眾生眾中起；不可思世界眾生眾中入，不可量世界眾生眾中起；不可量世界眾生眾中入，不可說世界眾生眾中起；不可說世界眾生眾中入，不可說不可說世界眾生眾中起；不可說不可說世界眾生眾中入，雜染眾生眾中起；雜染眾生眾中入，清淨眾生眾中起；清淨眾生眾中入，雜染眾生眾中起；眼處入，耳處起；耳處入，眼處起；鼻處入，舌處起；舌處入，鼻處起；身處入，意處起；意處入，身處起；自處入，他處起；他處入，自處起；一微塵中入，無數世界微塵中起；無數世界微塵中入，一微塵中起；聲聞入，獨覺起；獨覺入，聲聞起；自身入，佛身起；佛身入，自身起；一念入，億劫起；億劫入，一念起；同念入，別時起；別時入，同念起；前際入，後際起；後際入，前際起；前際入，中際起；中際入，前際起；三世入，剎那起；剎那入，三世起；真如入，言說起；言說入，真如起。「佛子！譬如有人為鬼所持，其身戰動不能自安，鬼不現身令他身然；菩薩摩訶薩住此三昧亦復如是，自身入定他身起，他身入定自身起。佛子！譬如死屍以呪力故而能起行，隨所作事皆得成就，屍之與呪雖各差別，而能和合成就彼事；菩薩摩訶薩住此三昧亦復如是，同境入定異境起，異境入定同境起。佛子！譬如比丘得心自在，或以一身作多身，或以多身作一身，非一身沒多身生，非多身沒一身生；菩薩摩訶薩住此三昧亦復如是，一身入定多身起，多身入定一身起。佛子！譬如大地其味一種，所生苗稼種種味別，地雖無差別，然味有殊異；菩薩摩訶薩住此三昧亦復如是，無所分別，然有一種入定多種起，多種入定一種起。「佛子！菩薩摩訶薩住此三昧，得十種稱讚法之所稱讚。何者為十？所謂：入真如故，名為如來；覺一切法故，名之為佛；為一切世間所稱讚故，名為法師；知一切法故，名一切智；為一切世間所歸依故，名所依處；了達一切法方便故，名為導師；引一切眾生入薩婆若道故，名大導師；為一切世間燈故，名為光明；心志圓滿，義利成就，所作皆辦，住無礙智，分別了知一切諸法故，名為十力自在；通達一切法輪故，名一切見者。是為十。佛子！菩薩摩訶薩住此三昧，復得十種光明照耀。何者為十？所謂：得一切諸佛光明，與彼平等故；得一切世界光明，普能嚴淨故；得一切眾生光明，悉往調伏故；得無量無畏光明，法界為場演說故；得無差別光明，知一切法無種種性故；得方便光明，於一切法離欲際而證入故；得真實光明，於一切法離欲際心平等故；得遍一切世間神變光明，蒙佛所加恒不息故；得善思惟光明，到一切佛自在岸故；得一切法真如光明，於一毛孔中善說一切故。是為十。佛子！菩薩摩訶薩住此三昧，復得十種無所作。何者為十？所謂：身業無所作，語業無所作，意業無所作，神通無所作，了法無性無所作，知業不壞無所作，無差別智無所作，無生起智無所作，知法無滅無所作，隨順於文不壞於義無所作。是為十。「佛子！菩薩摩訶薩住此三昧，無量境界種種差別。所謂：一入多起，多入一起；同入異起，異入同起；細入麁起，麁入細起；大入小起，小入大起；順入逆起，逆入順起；無身入有身起，有身入無身起；無相入有相起，有相入無相起；起中入，入中起。如是皆是此之三昧自在境界。佛子！譬如幻師，持呪得成，能現種種差別形相；呪與幻別而能作幻，呪唯是聲而能幻作眼識所知種種諸色、耳識所知種種諸聲、鼻識所知種種諸香、舌識所知種種諸味、身識所知種種諸觸、意識所知種種境界。菩薩摩訶薩住此三昧亦復如是，同中入定異中起，異中入定同中起。佛子！譬如三十三天共阿脩羅鬪戰之時，諸天得勝，脩羅退衄；阿脩羅王其身長大七百由旬，四兵圍遶無數千萬，以幻術力將諸軍眾，同時走入藕絲孔中。菩薩摩訶薩亦復如是，已善成就諸幻智地，幻智即是菩薩，菩薩即是幻智，是故能於無差別法中入定、差別法中起，差別法中入定、無差別法中起。佛子！譬如農夫田中下種，種子在下，果生於上。菩薩摩訶薩住此三昧亦復如是，一中入定多中起，多中入定一中起。佛子！譬如男女赤白和合，或有眾生於中受生，爾時名為：歌羅邏位，從此次第，住母胎中，滿足十月；善業力故，一切肢分皆得成就，諸根不缺，心意明了；其歌羅邏與彼六根體狀各別，以業力故，而能令彼次第成就，受同異類種種果報。菩薩摩訶薩亦復如是，從一切智歌羅邏位，信解願力漸次增長；其心廣大，任運自在，無中入定有中起，有中入定無中起。佛子！譬如龍宮依地而立，不依虛空，龍依宮住，亦不在空，而能興雲遍滿空中；有人仰視所見宮殿，當知皆是乾闥婆城，非是龍宮。佛子！龍雖處下而雲布上。菩薩摩訶薩住此三昧亦復如是，於無相入有相起，於有相入無相起。佛子！譬如妙光大梵天王所住之宮，名：一切世間最勝清淨藏；此大宮中，普見三千大千世界諸四天下天宮、龍宮、夜叉宮、乾闥婆宮、阿脩羅宮、迦樓羅宮、緊那羅宮、摩睺羅伽宮；人間住處及三惡道、須彌山等，種種諸山、大海、江河、陂澤、泉源、城邑、聚落、樹林、眾寶，如是一切種種莊嚴，盡大輪圍所有邊際，乃至空中微細遊塵，莫不皆於梵宮顯現，如於明鏡見其面像。菩薩摩訶薩住此一切眾生差別身大三昧，知種種剎，見種種佛，度種種眾，證種種法，成種種行，滿種種解，入種種三昧，起種種神通，得種種智慧，住種種剎那際。佛子！此菩薩摩訶薩到十種神通彼岸。何者為十？所謂：到諸佛盡虛空遍法界神通彼岸，到菩薩究竟無差別自在神通彼岸，到能發起菩薩廣大行願入如來門佛事神通彼岸，到能震動一切世界一切境界悉令清淨神通彼岸，到能自在知一切眾生不思議業果皆如幻化神通彼岸，到能自在知諸三昧麁細入出差別相神通彼岸，到能勇猛入如來境界而於其中發生大願神通彼岸，到能化作佛化轉法輪調伏眾生令生佛種令入佛乘速得成就神通彼岸，到能了知不可說一切祕密文句而轉法輪令百千億那由他不可說不可說法門皆得清淨神通彼岸，到不假晝夜年月劫數一念悉能三世示現神通彼岸。是為十。佛子！是名：菩薩摩訶薩第八一切眾生差別身大三昧善巧智。「\n\n**（9）法界自在三昧**——节首句眼：「有十種（直说三昧行相）」：\n\n> 佛子！云何為菩薩摩訶薩法界自在三昧？佛子！此菩薩摩訶薩於自眼處乃至意處入三昧，名：法界自在。菩薩於自身一一毛孔中入此三昧，自然能知諸世間，知諸世間法，知諸世界，知億那由他世界，知阿僧祇世界，知不可說佛剎微塵數世界；見一切世界中有佛出興，菩薩眾會悉皆充滿，光明清淨，淳善無雜，廣大莊嚴，種種眾寶以為嚴飾。菩薩於彼，或一劫、百劫、千劫、億劫、百千億那由他劫、無數劫、無量劫、無邊劫、無等劫、不可數劫、不可稱劫、不可思劫、不可量劫、不可說劫、不可說不可說劫、不可說不可說佛剎微塵數劫，修菩薩行常不休息；又於如是無量劫中住此三昧，亦入亦起，亦成就世界，亦調伏眾生，亦遍了法界，亦普知三世，亦演說諸法，亦現大神通，種種方便無著無礙；以於法界得自在故，善分別眼，善分別耳，善分別鼻，善分別舌，善分別身，善分別意，如是種種差別不同，悉善分別盡其邊際。菩薩如是善知見已，能生起十千億陀羅尼法光明，成就十千億清淨行，獲得十千億諸根，圓滿十千億神通，能入十千億三昧，成就十千億神力，長養十千億諸力，圓滿十千億深心，運動十千億力持，示現十千億神變，具足十千億菩薩無礙，圓滿十千億菩薩助道，積集十千億菩薩藏，照明十千億菩薩方便，演說十千億諸義，成就十千億諸願，出生十千億迴向，淨治十千億菩薩正位，明了十千億法門，開示十千億演說，修治十千億菩薩清淨。「佛子！此菩薩摩訶薩復有無數功德、無量功德、無邊功德、無等功德、不可數功德、不可稱功德、不可思功德、不可量功德、不可說功德、無盡功德。佛子！此菩薩於如是功德，皆已辦具，皆已積集，皆已莊嚴，皆已清淨，皆已瑩徹，皆已攝受，皆能出生，皆可稱歎，皆得堅固，皆已成就。「佛子！菩薩摩訶薩住此三昧，為東方十千阿僧祇佛剎微塵數名號諸佛之所攝受，一一名號復有十千阿僧祇佛剎微塵數佛，各各差別；如東方，南、西、北方，四維、上、下，亦復如是。彼諸佛悉現其前，為現諸佛清淨剎，為說諸佛無量身，為說諸佛難思眼，為說諸佛無量耳，為說諸佛清淨鼻，為說諸佛清淨舌，為說諸佛無住心，為說如來無上神通，令修如來無上菩提，令得如來清淨音聲，開示如來不退法輪，顯示如來無邊眾會，令入如來無邊祕密，讚歎如來一切善根，令入如來平等之法，宣說如來三世種性，示現如來無量色相，闡揚如來護念之法，演暢如來微妙法音，辯明一切諸佛世界，宣揚一切諸佛三昧，示現諸佛眾會次第，護持諸佛不思議法，說一切法猶如幻化，明諸法性無有動轉，開示一切無上法輪，讚美如來無量功德，令入一切諸三昧雲，令知其心如幻如化、無邊無盡。「佛子！菩薩摩訶薩住此法界自在三昧時，彼十方各十千阿僧祇佛剎微塵數名號如來，一一名中各有十千阿僧祇佛剎微塵數佛同時護念，令此菩薩得無邊身；令此菩薩得無礙心；令此菩薩於一切法得無忘念；令此菩薩於一切法得決定慧；令此菩薩轉更聰敏，於一切法皆能領受；令此菩薩於一切法悉能明了；令此菩薩諸根猛利，於神通法悉得善巧；令此菩薩境界無礙，周行法界恒不休息；令此菩薩得無礙智，畢竟清淨；令此菩薩以神通力，一切世界示現成佛。「佛子！菩薩摩訶薩住此三昧，得十種海。何者為十？所謂：得諸佛海，咸覩見故；得眾生海，悉調伏故；得諸法海，能以智慧悉了知故；得諸剎海，以無性無作神通皆往詣故；得功德海，一切修行悉圓滿故；得神通海，能廣示現令開悟故；得諸根海，種種不同悉善知故；得諸心海，知一切眾生種種差別無量心故；得諸行海，能以願力悉圓滿故；得諸願海，悉使成就，永清淨故。佛子！菩薩摩訶薩得如是十種海已，復得十種殊勝。何等為十？一者於一切眾生中最為第一，二者於一切諸天中最為殊特，三者於一切梵王中最極自在，四者於諸世間無所染著，五者一切世間無能映蔽，六者一切諸魔不能惑亂，七者普入諸趣無所罣礙，八者處處受生知不堅固，九者一切佛法皆得自在，十者一切神通悉能示現。佛子！菩薩摩訶薩得如是十種殊勝已，復得十種力，於眾生界修習諸行。何等為十？一謂勇健力，調伏世間故；二謂精進力，恒不退轉故，三謂無著力，離諸垢染故；四謂寂靜力，於一切法無諍論故；五謂逆順力，於一切法心自在故；六謂法性力，於諸義中得自在故；七謂無礙力，智慧廣大故；八謂無畏力，能說諸法故；九謂辯才力，能持諸法故；十謂開示力，智慧無邊故。佛子！此十種力是廣大力、最勝力、無能摧伏力、無量力、善集力、不動力、堅固力、智慧力、成就力、勝定力、清淨力、極清淨力、法身力、法光明力、法燈力、法門力、無能壞力、極勇猛力、大丈夫力、善丈夫修習力、成正覺力、過去積集善根力、安住無量善根力、住如來力力、心思惟力、增長菩薩歡喜力、出生菩薩淨信力、增長菩薩勇猛力、菩提心所生力、菩薩清淨深心力、菩薩殊勝深心力、菩薩善根熏習力、究竟諸法力、無障礙身力、入方便善巧法門力、清淨妙法力、安住大勢一切世間不能傾動力、一切眾生無能映蔽力。佛子！此菩薩摩訶薩於如是無量功德法，能生，能成就，能圓滿，能照明，能具足，能遍具足，能廣大，能堅固，能增長，能淨治，能遍淨治。此菩薩功德邊際、智慧邊際、修行邊際、法門邊際、自在邊際、苦行邊際、成就邊際、清淨邊際、出離邊際、法自在邊際、無能說者。此菩薩所獲得、所成就、所趣入、所現前、所有境界、所有觀察、所有證入、所有清淨、所有了知、所有建立一切法門，於不可說劫無能說盡。「佛子！菩薩摩訶薩住此三昧，能了知無數、無量、無邊、無等、不可數、不可稱、不可思、不可量、不可說、不可說不可說一切三昧。彼一一三昧，所有境界無量廣大，於境界中若入、若起、若住，所有相狀，所有示現，所有行處，所有等流，所有自性，所有除滅，所有出離，如是一切靡不明見。佛子！譬如無熱惱大龍王宮流出四河，無濁無雜，無有垢穢，光色清淨猶如虛空。其池四面各有一口，一一口中流出一河，於象口中出恒伽河，師子口中出私陀河，於牛口中出信度河，於馬口中出縛芻河。其四大河流出之時，恒伽河口流出銀沙，私陀河口流出金剛沙，信度河口流出金沙，縛芻河口流出瑠璃沙；恒伽河口作白銀色，私陀河口作金剛色，信度河口作黃金色，縛芻河口作瑠璃色，一一河口廣一由旬。其四大河既流出已，各共圍遶大池七匝，隨其方面四向分流，澒涌奔馳入於大海。其河旋遶，一一之間有天寶所成優鉢羅華、波頭摩華、拘物頭華、芬陀利華，奇香發越，妙色清淨；種種華葉，種種臺蘂，悉是眾寶，自然映徹，咸放光明，互相照現。其無熱池周圍廣大五十由旬，眾寶妙沙遍布其底，種種摩尼以為嚴飾，無量妙寶莊嚴其岸，栴檀妙香普散其中，優鉢羅華、波頭摩華、拘物頭華、芬陀利華及餘寶華皆悉遍滿，微風吹動，香氣遠徹，華林寶樹周匝圍遶。日光出時，普皆照明池河內外一切眾物，接影連輝成光明網。如是眾物，若遠、若近，若高、若下，若廣、若狹，若麁、若細，乃至極小一沙一塵，悉是妙寶，光明鑒徹，靡不於中日輪影現，亦復展轉更相現影；如是眾影不增不減、非合非散，皆如本質而得明見。佛子！如無熱大池，於四口中流出四河入於大海；菩薩摩訶薩亦復如是，從四辯才，流出諸行，究竟入於一切智海。如恒伽大河，從銀色象口流出銀沙；菩薩摩訶薩亦復如是，以義辯才，說一切如來所說一切義門，出生一切清淨白法，究竟入於無礙智海。如私陀大河，從金剛色師子口流出金剛沙；菩薩摩訶薩亦復如是，以法辯才，為一切眾生說佛金剛句，引出金剛智，究竟入於無礙智海。如信度大河，從金色牛口流出金沙；菩薩摩訶薩亦復如是，以訓辭辯，說隨順世間緣起方便，開悟眾生，令皆歡喜，調伏成熟，究竟入於緣起方便海。如縛芻大河，於瑠璃色馬口流出瑠璃沙；菩薩摩訶薩亦復如是，以無盡辯，雨百千億那由他不可說法，令其聞者皆得潤洽，究竟入於諸佛法海。如四大河，隨順圍遶無熱池已四方入海，菩薩摩訶薩亦復如是，成就隨順身業、隨順語業、隨順意業，成就智為前導身業、智為前導語業、智為前導意業，四方流注，究竟入於一切智海。佛子！何者名為菩薩四方？佛子！所謂：見一切佛而得開悟，聞一切法受持不忘，圓滿一切波羅蜜行，大悲說法滿足眾生。如四大河圍遶大池，於其中間，優鉢羅華、波頭摩華、拘物頭華、芬陀利華皆悉遍滿；菩薩摩訶薩亦復如是，於菩提心中間，不捨眾生，說法調伏，悉令圓滿無量三昧，見佛國土莊嚴清淨。如無熱大池，寶樹圍遶；菩薩摩訶薩亦復如是，現佛國土莊嚴圍遶，令諸眾生趣向菩提。如無熱大池，其中縱廣五十由旬，清淨無濁；菩薩摩訶薩亦復如是，菩提之心其量無邊，善根充滿，清淨無濁。如無熱大池，以無量寶莊嚴其岸，散栴檀香遍滿其中；菩薩摩訶薩亦復如是，以百千億十種智寶嚴菩提心大願之岸，普散一切眾善妙香。如無熱大池，底布金沙，種種摩尼間錯莊嚴；菩薩摩訶薩亦復如是，微妙智慧周遍觀察，不可思議菩薩解脫種種法寶間錯莊嚴，得一切法無礙光明，住於一切諸佛所住，入於一切甚深方便。如阿那婆達多龍王，永離龍中所有熱惱；菩薩摩訶薩亦復如是，永離一切世間憂惱，雖現受生而無染著。如四大河，潤澤一切閻浮提地，既潤澤已入於大海；菩薩摩訶薩亦復如是，以四智河潤澤天、人、沙門、婆羅門，令其普入阿耨多羅三藐三菩提智慧大海，以十種力而為莊嚴。何者為四？一者願智河，救護調伏一切眾生常不休息；二者波羅蜜智河，修菩提行饒益眾生，去、來、今世相續無盡，究竟入於諸佛智海；三者菩薩三昧智河，無數三昧以為莊嚴，見一切佛，入諸佛海；四者大悲智河，大慈自在普救眾生，方便攝取無有休息，修行祕密功德之門，究竟入於十力大海。如四大河，從無熱池既流出已，究竟無盡，入於大海；菩薩摩訶薩亦復如是，以大願力修菩薩行，自在知見無有窮盡，究竟入於一切智海。如四大河，入於大海，無能為礙令不入者；菩薩摩訶薩亦復如是，常勤修習普賢行願，成就一切智慧光明，住於一切佛菩提法，入如來智無有障礙。如四大河，奔流入海，經於累劫亦無疲厭；菩薩摩訶薩亦復如是，以普賢行願，盡未來劫修菩薩行，入如來海不生疲厭。佛子！如日光出時，無熱池中金沙、銀沙、金剛沙、瑠璃沙及餘一切種種寶物，皆有日影於中顯現；其金沙等一切寶物，亦各展轉而現其影，互相鑒徹，無所妨礙。菩薩摩訶薩亦復如是，住此三昧，於自身一一毛孔中，悉見不可說不可說佛剎微塵數諸佛如來，亦見彼佛所有國土道場眾會一一佛所聽法、受持、信解、供養，各經不可說不可說億那由他劫而不想念時節長短，其諸眾會亦無迫隘。何以故？以微妙心，入無邊法界故，入無等差別業果故，入不思議三昧境界故，入不思議思惟境界故，入一切佛自在境界故，得一切佛所護念故，得一切佛大神變故，得諸如來難得難知十種力故，入普賢菩薩行圓滿境界故，得一切佛無勞倦神通力故。「佛子！菩薩摩訶薩雖能於定一念入出，而亦不廢長時在定，亦無所著；雖於境界無所依住，而亦不捨一切所緣；雖善入剎那際，而為利益一切眾生，現佛神通無有厭足；雖等入法界，而不得其邊；雖無所住、無有處所，而恒趣入一切智道，以變化力普入無量眾生眾中，具足莊嚴一切世界；雖離世間顛倒分別，超過一切分別之地，亦不捨於種種諸相；雖能具足方便善巧，而究竟清淨；雖不分別菩薩諸地，而皆已善入。佛子！譬如虛空，雖能容受一切諸物，而離有無。菩薩摩訶薩亦復如是，雖普入一切世間，而離世間想；雖勤度一切眾生，而離眾生想；雖深知一切法，而離諸法想；雖樂見一切佛，而離諸佛想；雖善入種種三昧，而知一切法自性皆如，無所染著；雖以無邊辯才演無盡法句，而心恒住離文字法；雖樂觀察無言說法，而恒示現清淨音聲；雖住一切離言法際，而恒示現種種色相；雖教化眾生，而知一切法畢竟性空；雖勤修大悲度脫眾生，而知眾生界無盡無散；雖了達法界常住不變，而以三輪調伏眾生恒不休息；雖常安住如來所住，而智慧清淨，心無怖畏，分別演說種種諸法，轉於法輪常不休息。佛子！是為菩薩摩訶薩第九法界自在大三昧善巧智。之四十定品第二十七之四「\n\n**（10）無礙輪三昧**——节首句眼：「有十種（直说三昧行相）」：\n\n> 佛子！云何為菩薩摩訶薩無礙輪三昧？佛子！菩薩摩訶薩入此三昧時，住無礙身業、無礙語業、無礙意業，住無礙佛國土，得無礙成就眾生智，獲無礙調伏眾生智，放無礙光明，現無礙光明網，示無礙廣大變化，轉無礙清淨法輪，得菩薩無礙自在，普入諸佛力，普住諸佛智，作佛所作，淨佛所淨，現佛神通，令佛歡喜，行如來行，住如來道，常得親近無量諸佛，作諸佛事紹諸佛種。「佛子！菩薩摩訶薩住此三昧已，觀一切智，總觀一切智，別觀一切智，隨順一切智，顯示一切智，攀緣一切智，見一切智，總見一切智，別見一切智，於普賢菩薩廣大願、廣大心、廣大行、廣大所趣、廣大所入、廣大光明、廣大出現、廣大護念、廣大變化、廣大道，不斷不退，無休無替，無倦無捨，無散無亂，常增進，恒相續。何以故？此菩薩摩訶薩於諸法中，成就大願，發行大乘，入於佛法大方便海；以勝願力，於諸菩薩所行之行，智慧明照皆得善巧，具足菩薩神通變化，善能護念一切眾生；如去、來、今一切諸佛之所護念，於諸眾生恒起大悲，成就如來不變異法。佛子！譬如有人以摩尼寶置色衣中，其摩尼寶雖同衣色，不捨自性。菩薩摩訶薩亦復如是，成就智慧以為心寶，觀一切智普皆明現，然不捨於菩薩諸行。何以故？菩薩摩訶薩發大誓願，利益一切眾生，度脫一切眾生，承事一切諸佛，嚴淨一切世界，安慰眾生，深入法海；為淨眾生界，現大自在，給施眾生，普照世間，入於無邊幻化法門，不退不轉，無疲無厭。佛子！譬如虛空持眾世界，若成若住，無厭無倦，無羸無朽，無散無壞，無變無異，無有差別，不捨自性。何以故？虛空自性，法應爾故。菩薩摩訶薩亦復如是，立無量大願，度一切眾生，心無厭倦。佛子！譬如涅槃，去、來、現在無量眾生於中滅度，終無厭倦。何以故？一切諸法本性清淨，是謂：涅槃，云何於中而有厭倦？菩薩摩訶薩亦復如是，為欲度脫一切眾生皆令出離而現於世，云何而起疲厭之心？佛子！如薩婆若，能令過去、未來、現在一切菩薩，於諸佛家已、現、當生，乃至令成無上菩提，終不疲厭。何以故？一切智與法界無二故，於一切法無所著故。菩薩摩訶薩亦復如是，其心平等住一切智，云何而有疲厭之心？「佛子！此菩薩摩訶薩有一蓮華，其華廣大盡十方際，以不可說葉、不可說寶、不可說香而為莊嚴；其不可說寶，復各示現種種眾寶，清淨妙好，極善安住。其華常放眾色光明，普照十方一切世界無所障礙；真金為網，彌覆其上；寶鐸徐搖，出微妙音，其音演暢一切智法。此大蓮華具足如來清淨莊嚴，一切善根之所生起，吉祥為表，神力所現，有十千阿僧祇清淨功德，菩薩妙道之所成就，一切智心之所流出，十方佛影於中顯現，世間瞻仰猶如佛塔，眾生見者無不禮敬，從能了幻正法所生，一切世間不可為諭。菩薩摩訶薩於此華上結跏趺坐，其身大小與華相稱。一切諸佛神力所加，令菩薩身一一毛孔各出百萬億那由他不可說佛剎微塵數光明，一一光明現百萬億那由他不可說佛剎微塵數摩尼寶，其寶皆名：普光明藏，種種色相以為莊嚴，無量功德之所成就，眾寶及華以為羅網彌覆其上，散百千億那由他殊勝妙香，無量色相種種莊嚴，復現不思議寶莊嚴蓋以覆其上。一一摩尼寶悉現百萬億那由他不可說佛剎微塵數樓閣；一一樓閣現百萬億那由他不可說佛剎微塵數蓮華藏師子之座；一一師子座現百萬億那由他不可說佛剎微塵數光明；一一光明現百萬億那由他不可說佛剎微塵數色相；一一色相現百萬億那由他不可說佛剎微塵數光明輪；一一光明輪現百萬億那由他不可說佛剎微塵數毘盧遮那摩尼寶華；一一華現百萬億那由他不可說佛剎微塵數臺；一一臺現百萬億那由他不可說佛剎微塵數佛；一一佛現百萬億那由他不可說佛剎微塵數神變；一一神變淨百萬億那由他不可說佛剎微塵數眾生眾；一一眾生眾中現百萬億那由他不可說佛剎微塵數諸佛自在；一一自在雨百萬億那由他不可說佛剎微塵數佛法；一一佛法有百萬億那由他不可說佛剎微塵數修多羅；一一修多羅說百萬億那由他不可說佛剎微塵數法門；一一法門有百萬億那由他不可說佛剎微塵數金剛智所入法輪，差別言辭各別演說；一一法輪成熟百萬億那由他不可說佛剎微塵數眾生界；一一眾生界有百萬億那由他不可說佛剎微塵數眾生，於佛法中而得調伏。「佛子！菩薩摩訶薩住此三昧，示現如是神通境界無量變化，悉知如幻而不染著，安住無邊不可說法。自性清淨、法界實相、如來種性，無礙際中，無去無來，非先非後，甚深無底，現量所得，以智自入，不由他悟。心不迷亂亦無分別，為去、來、今一切諸佛之所稱讚，從諸佛力之所流出，入於一切諸佛境界。體性如實，淨眼現證，慧眼普見，成就佛眼為世明燈，行於智眼所知境界，廣能開示微妙法門。成菩提心，趣勝丈夫，於諸境界無有障礙，入智種性出生諸智，離世生法而現受生，神通變化，方便調伏。如是一切無非善巧，功德解欲悉皆清淨，最極微妙具足圓滿，智慧廣大猶如虛空，善能觀察眾聖境界，信行願力堅固不動，功德無盡世所稱歎。於一切佛所觀之藏，大菩提處一切智海，集眾妙寶，為大智者，猶如蓮華自性清淨，眾生見者皆生歡喜、咸得利益。智光普照，見無量佛，淨一切法，所行寂靜，於諸佛法究竟無礙。恒以方便住佛菩提功德行中而得出生，具菩薩智，為菩薩首，一切諸佛共所護念。得佛威神，成佛法身，念力難思，於境一緣而無所緣，其行廣大無相無礙，等于法界無量無邊。所證菩提猶如虛空，無有邊際，無所縛著，於諸世間普作饒益，一切智海善根所流，悉能通達無量境界。已善成就清淨施法，住菩薩心，淨菩薩種，能隨順生諸佛菩提，於諸佛法皆得善巧，具微妙行，成堅固力。一切諸佛自在威神，眾生難聞，菩薩悉知入不二門住無相法；雖復永捨一切諸相，而能廣說種種諸法，隨諸眾生心樂欲解，悉使調伏，咸令歡喜。法界為身無有分別，智慧境界不可窮盡，志常勇猛，心恒平等。見一切佛功德邊際，了一切劫差別次第，開示一切法，安住一切剎，嚴淨一切諸佛國土，顯現一切正法光明，演去、來、今一切佛法，示諸菩薩所住之處。為世明燈，生諸善根，永離世間，常生佛所，得佛智慧明了第一。一切諸佛皆共攝受，已入未來諸佛之數，從諸善友而得出生，所有志求皆無不果。具大威德，住增上意，隨所聽聞咸能善說，亦為開示聞法善根。住實際輪，於一切法心無障礙；不捨諸行，離諸分別，於一切法心無動念。得智慧明滅諸癡闇，悉能明照一切佛法，不壞諸有而生其中，了知一切諸有境界。從本已來無有動作，身、語、意業皆悉無邊，雖隨世俗演說種種無量文字，而恒不壞離文字法。深入佛海，知一切法但有假名，於諸境界無繫無著；了一切法空無所有，所修諸行從法界生，猶如虛空無相無形。深入法界隨順演說，於一境門生一切智，觀十力地以智修學，智為橋梁至薩婆若，以智慧眼見法無礙，善入諸地知種種義，一一法門悉得明了，所有大願靡不成就。「佛子！菩薩摩訶薩以此開示一切如來無差別性，此是無礙方便之門，此能出生菩薩眾會，此法唯是三昧境界，此能勇進入薩婆若，此能開顯諸三昧門，此能無礙普入諸剎，此能調伏一切眾生，此能住於無眾生際，此能開示一切佛法，此於境界皆無所得。雖一切時演說開示，而恒遠離妄想分別；雖知諸法皆無所作，而能示現一切作業；雖知諸佛無有二相，而能顯示一切諸佛；雖知無色，而演說諸色；雖知無受，而演說諸受；雖知無想，而演說諸想；雖知無行，而演說諸行；雖知無識，而演說諸識，恒以法輪開示一切；雖知法無生，而常轉法輪；雖知法無差別，而說諸差別門；雖知諸法無有生滅，而說一切生滅之相；雖知諸法無麁無細，而說諸法麁細之相；雖知諸法無上、中、下，而能宣說最上之法；雖知諸法不可言說，而能演說清淨言辭；雖知諸法無內無外，而說一切內外諸法；雖知諸法不可了知，而說種種智慧觀察；雖知諸法無有真實，而說出離真實之道；雖知諸法畢竟無盡，而能演說盡諸有漏；雖知諸法無違無諍，然亦不無自他差別；雖知諸法畢竟無師，而常尊敬一切師長；雖知諸法不由他悟，而常尊敬諸善知識；雖知法無轉，而轉法輪；雖知法無起，而示諸因緣；雖知諸法無有前際，而廣說過去；雖知諸法無有後際，而廣說未來；雖知諸法無有中際，而廣說現在；雖知諸法無有作者，而說諸作業；雖知諸法無有因緣，而說諸集因；雖知諸法無有等比，而說平等、不平等道；雖知諸法無有言說，而決定說三世之法；雖知諸法無有所依，而說依善法而得出離；雖知法無身，而廣說法身；雖知三世諸佛無邊，而能演說唯有一佛；雖知法無色，而現種種色；雖知法無見，而廣說諸見；雖知法無相，而說種種相；雖知諸法無有境界，而廣宣說智慧境界；雖知諸法無有差別，而說行果種種差別；雖知諸法無有出離，而說清淨諸出離行；雖知諸法本來常住，而說一切諸流轉法；雖知諸法無有照明，而恒廣說照明之法。「佛子！菩薩摩訶薩入如是大威德三昧智輪，則能證得一切佛法，則能趣入一切佛法，則能成就，則能圓滿，則能積集，則能清淨，則能安住，則能了達，與一切法自性相應，而此菩薩摩訶薩不作是念：『有若干諸菩薩、若干菩薩法、若干菩薩究竟、若干幻究竟、若干化究竟、若干神通成就、若干智成就、若干思惟、若干證入、若干趣向、若干境界。』何以故？菩薩三昧，如是體性，如是無邊，如是殊勝故。此三昧種種境界、種種威力、種種深入，所謂：入不可說智門、入離分別諸莊嚴、入無邊殊勝波羅蜜、入無數禪定、入百千億那由他不可說廣大智、入見無邊佛勝妙藏、入於境界不休息、入清淨信解助道法、入諸根猛利大神通、入於境界心無礙、入見一切佛平等眼、入積集普賢勝志行、入住那羅延妙智身、入說如來智慧海、入起無量種自在神變、入生一切佛無盡智門、入住一切佛現前境界、入淨普賢菩薩自在智、入開示無比普門智、入普知法界一切微細境界、入普現法界一切微細境界、入一切殊勝智光明、入一切自在邊際、入一切辯才法門際、入遍法界智慧身、入成就一切處遍行道、入善住一切差別三昧、入知一切諸佛心。「佛子！此菩薩摩訶薩住普賢行，念念入百億不可說三昧，然不見普賢菩薩三昧及佛境界莊嚴前際。何以故？知一切法究竟無盡故，知一切佛剎無邊故，知一切眾生界不思議故，知前際無始故，知未來無窮故，知現在盡虛空遍法界無邊故，知一切諸佛境界不可思議故，知一切菩薩行無數故，知一切諸佛辯才所說境界不可說無邊故，知一切幻心所緣法無量故。佛子！如如意珠，隨有所求一切皆得，求者無盡，意皆滿足，而珠勢力終不匱止。菩薩摩訶薩亦復如是，入此三昧，知心如幻，出生一切諸法境界，周遍無盡，不匱不息。何以故？菩薩摩訶薩成就普賢無礙行智，觀察無量廣大幻境，猶如影像無增減故。佛子！譬如凡夫，各別生心，已生、現生及以當生，無有邊際，無斷無盡；其心流轉，相續不絕，不可思議。菩薩摩訶薩亦復如是，入此普幻門三昧，無有邊際，不可測量。何以故？了達普賢菩薩普幻門無量法故。佛子！譬如難陀跋難陀、摩那斯龍王及餘大龍降雨之時，滴如車軸，無有邊際；雖如是雨，雲終不盡，此是諸龍無作境界。菩薩摩訶薩亦復如是，住此三昧，入普賢菩薩諸三昧門、智門、法門、見諸佛門、往諸方門、心自在門、加持門、神變門、神通門、幻化門、諸法如幻門、不可說不可說諸菩薩充滿門，親近不可說不可說佛剎微塵數如來正覺門，入不可說不可說廣大幻網門，知不可說不可說差別廣大佛剎門，知不可說不可說有體性、無體性世界門，知不可說不可說眾生想門，知不可說不可說時差別門，知不可說不可說世界成壞門，知不可說不可說覆住、仰住諸佛剎門，於一念中皆如實知。如是入時，無有邊際，無有窮盡，不疲不厭，不斷不息，無退無失；於諸法中不住非處，恒正思惟，不沈不舉；求一切智常無退捨，為一切佛剎照世明燈，轉不可說不可說法輪；以妙辯才諮問如來無窮盡時，示成佛道無有邊際，調伏眾生恒無廢捨，常勤修習普賢行願未曾休息，示現無量不可說不可說色相身無有斷絕。何以故？譬如然火，隨所有緣，於爾所時火起不息。菩薩摩訶薩亦復如是，觀察眾生界、法界、世界，猶如虛空無有邊際，乃至能於一念之頃，往不可說不可說佛剎微塵數佛所。一一佛所入不可說不可說一切智種種差別法；令不可說不可說眾生界出家為道，勤修善根，究竟清淨；令不可說不可說菩薩於普賢行願未決定者而得決定，安住普賢智慧之門；以無量方便，入不可說不可說三世成、住、壞廣大差別劫，於不可說不可說成、住、壞世間差別境界，起於爾所大悲大願，調伏無量一切眾生悉使無餘。何以故？此菩薩摩訶薩為欲度脫一切眾生，修普賢行，生普賢智，滿足普賢所有行願。是故，諸菩薩應於如是種類、如是境界、如是威德、如是廣大、如是無量、如是不思議、如是普照明、如是一切諸佛現前住、如是一切如來所護念、如是成就往昔善根、如是其心無礙不動三昧之中，勤加修習，離諸熱惱，無有疲厭，心不退轉，立深志樂，勇猛無怯，順三昧境界，入難思智地。不依文字，不著世間，不取諸法，不起分別，不染著世事，不分別境界，於諸法智但應安住，不應稱量。所謂：親近一切智，悟解佛菩提，成就法光明，施與一切眾生善根。於魔界中拔出眾生，令其得入佛法境界，令不捨大願，勤觀出道，增廣淨境，成就諸度，於一切佛深生信解。常應觀察一切法性，無時暫捨；應知自身與諸法性普皆平等；應當明解世間所作，示其如法智慧方便；應常精進，無有休息；應觀自身善根鮮少；應勤增長他諸善根；應自修行一切智道；應勤增長菩薩境界；應樂親近諸善知識；應與同行而共止住；應不分別佛；應不捨離念；應常安住平等法界；應知一切心識如幻；應知世間諸行如夢；應知諸佛願力出現猶如影像；應知一切諸廣大業猶如變化；應知言語悉皆如響；應觀諸法一切如幻；應知一切生滅之法皆如音聲；應知所往一切佛剎皆無體性；應為請問如來佛法不生疲倦；應為開悟一切世間，勤加教誨而不捨離；應為調伏一切眾生，知時說法而不休息。佛子！菩薩摩訶薩如是修行普賢之行，如是圓滿菩薩境界，如是通達出離之道，如是受持三世佛法，如是觀察一切智門，如是思惟不變異法，如是明潔增上志樂，如是信解一切如來，如是了知佛廣大力，如是決定無所礙心，如是攝受一切眾生。「佛子！菩薩摩訶薩入普賢菩薩所住如是大智慧三昧時，十方各有不可說不可說國土，一一國土各有不可說不可說佛剎微塵數如來名號，一一名號各有不可說不可說佛剎微塵數諸佛而現其前，與如來念力，令不忘失如來境界；與一切法究竟慧，令入一切智；與知一切法種種義決定慧，令受持一切佛法趣入無礙；與無上佛菩提，令入一切智開悟法界；與菩薩究竟慧，令得一切法光明，無諸黑闇；與菩薩不退智，令知時、非時，善巧方便調伏眾生；與無障礙菩薩辯才，令悟解無邊法演說無盡；與神通變化力，令現不可說不可說差別身無邊色相種種不同開悟眾生；與圓滿言音，令現不可說不可說差別音聲種種言辭開悟眾生；與不唐捐力，令一切眾生若得見形、若得聞法皆悉成就，無空過者。佛子！菩薩摩訶薩如是滿足普賢行故，得如來力，淨出離道，滿一切智，以無礙辯才神通變化，究竟調伏一切眾生；具佛威德，淨普賢行，住普賢道，盡未來際，為欲調伏一切眾生，轉一切佛微妙法輪。何以故？佛子！此菩薩摩訶薩成就如是殊勝大願諸菩薩行，則為一切世間法師，則為一切世間法日，則為一切世間智月；則為一切世間須彌山王，嶷然高出，堅固不動；則為一切世間無涯智海；則為一切世間正法明燈，普照無邊，相續不斷；為一切眾生開示無邊清淨功德，皆令安住功德善根；順一切智，大願平等，修習普賢廣大之行，常能勸發無量眾生，住不可說不可說廣大行三昧，現大自在。「佛子！此菩薩摩訶薩，獲如是智，證如是法，於如是法審住明見；得如是神力，住如是境界，現如是神變，起如是神通；常安住大悲，常利益眾生，開示眾生安隱正道，建立福智大光明幢；證不思議解脫，住一切智解脫，到諸佛解脫彼岸，學不思議解脫方便門已得成就，入法界差別門無有錯亂，於普賢不可說不可說三昧遊戲自在，住師子奮迅智心意無礙。其心恒住十大法藏。何者為十？所謂：住憶念一切諸佛，住憶念一切佛法，住調伏一切眾生大悲，住示現不思議清淨國土智，住深入諸佛境界決定解，住去、來、現在一切佛平等相菩提，住無礙無著際，住一切法無相性，住去、來、現在一切佛平等善根，住去、來、現在一切如來法界無差別身、語、意業先導智，住觀察三世一切諸佛受生、出家、詣道場、成正覺、轉法輪、般涅槃悉入剎那際。佛子！此十大法藏廣大無量，不可數、不可稱、不可思、不可說、無窮盡、難忍受，一切世智無能稱述。「佛子！此菩薩摩訶薩已到普賢諸行彼岸，證清淨法，志力廣大，開示眾生無量善根，增長菩薩一切勢力，於念念頃滿足菩薩一切功德，成就菩薩一切諸行，得一切佛陀羅尼法，受持一切諸佛所說；雖常安住真如實際，而隨一切世俗言說，示現調伏一切眾生。何以故？菩薩摩訶薩住此三昧，法如是故。佛子！菩薩摩訶薩以此三昧，得一切佛廣大智，得巧說一切廣大法自在辯才，得一切世中最為殊勝清淨無畏法，得入一切三昧智，得一切菩薩善巧方便，得一切法光明門，到安慰一切世間法彼岸，知一切眾生時、非時，照十方世界一切處，令一切眾生得勝智，作一切世間無上師，安住一切諸功德，開示一切眾生清淨三昧，令入最上智。何以故？菩薩摩訶薩如是修行，則利益眾生，則增長大悲，則親近善知識，則見一切佛，則了一切法，則詣一切剎，則入一切方，則入一切世，則悟一切法平等性，則知一切佛平等性，則住一切智平等性。於此法中，作如是業，不作餘業；住未足心，住不散亂心，住專一心，住勤修心，住決定心，住不變異心；如是思惟，如是作業，如是究竟。「佛子！菩薩摩訶薩無異語、異作，有如語、如作。何以故？譬如金剛，以不可壞而得其名，終無有時離於不壞；菩薩摩訶薩亦復如是，以諸行法而得其名，終無有時離諸行法。譬如真金，以有妙色而得其名，終無有時離於妙色；菩薩摩訶薩亦復如是，以諸善業而得其名，終無有時離諸善業。譬如日天子，以光明輪而得其名，終無有時離光明輪；菩薩摩訶薩亦復如是，以智慧光而得其名，終無有時離智慧光。譬如須彌山王，以四寶峯處於大海，逈然高出而得其名，終無有時捨離四峯；菩薩摩訶薩亦復如是，以諸善根處在於世，逈然高出而得其名，終無有時捨離善根。譬如大地，以持一切而得其名，終無有時捨離能持；菩薩摩訶薩亦復如是，以度一切而得其名，終無有時捨離大悲。譬如大海，以含眾水而得其名，終無有時捨離於水；菩薩摩訶薩亦復如是，以諸大願而得其名，終不暫捨度眾生願。譬如軍將，以能慣習戰鬪之法而得其名，終無有時捨離此能；菩薩摩訶薩亦復如是，以能慣習如是三昧而得其名，乃至成就一切智智，終無有時捨離此行。如轉輪王，馭四天下，常勤守護一切眾生，令無橫死，恒受快樂；菩薩摩訶薩亦復如是，入如是等諸大三昧，常勤化度一切眾生，乃至令其究竟清淨。譬如種子，植之於地，乃至能令莖葉增長；菩薩摩訶薩亦復如是，修普賢行，乃至能令一切眾生善法增長。譬如大雲，於夏暑月降霔大雨，乃至增長一切種子；菩薩摩訶薩亦復如是，入如是等諸大三昧，修菩薩行，雨大法雨，乃至能令一切眾生究竟清淨、究竟涅槃、究竟安隱、究竟彼岸、究竟歡喜、究竟斷疑，為諸眾生究竟福田，令其施業皆得清淨，令其皆住不退轉道，令其同得一切智智，令其皆得出離三界，令其皆得究竟之智，令其皆得諸佛如來究竟之法，置諸眾生一切智處。何以故？菩薩摩訶薩成就此法，智慧明了，入法界門，能淨菩薩不可思議無量諸行。所謂：能淨諸智，求一切智故；能淨眾生，使調伏故；能淨剎土，常迴向故；能淨諸法，普了知故；能淨無畏，無怯弱故；能淨無礙辯，巧演說故；能淨陀羅尼，於一切法得自在故；能淨親近行，常見一切佛興世故。佛子！菩薩摩訶薩住此三昧，得如是等百千億那由他不可說不可說清淨功德，於如是等三昧境界得自在故，一切諸佛所加被故，自善根力之所流故，入智慧地大威力故，諸善知識引導力故，摧伏一切諸魔力故，同分善根淳淨力故，廣大誓願欲樂力故，所種善根成就力故，超諸世間無盡之福、無對力故。「佛子！菩薩摩訶薩住此三昧，得十種法，同去、來、今一切諸佛。何者為十？所謂：得諸相好，種種莊嚴，同於諸佛；能放清淨大光明網，同於諸佛；神通變化，調伏眾生，同於諸佛；無邊色身，清淨圓音，同於諸佛；隨眾生業現淨佛國，同於諸佛；一切眾生所有語言皆能攝持、不忘不失，同於諸佛；無盡辯才隨眾生心而轉法輪令生智慧，同於諸佛；大師子吼無所怯畏，以無量法開悟群生，同於諸佛；於一念頃，以大神通普入三世，同於諸佛；普能顯示一切眾生諸佛莊嚴、諸佛威力、諸佛境界，同於諸佛。」爾時，普眼菩薩白普賢菩薩言：「佛子！此菩薩摩訶薩得如是法，同諸如來，何故不名：佛？何故不名：十力？何故不名：一切智？何故不名：一切法中得菩提者？何故不得名為：普眼？何故不名：一切境中無礙見者？何故不名：覺一切法？何故不名：與三世佛無二住者？何故不名：住實際者？何故修行普賢行願猶未休息？何故不能究竟法界捨菩薩道？」爾時，普賢菩薩告普眼菩薩言：「善哉佛子！如汝所言，若此菩薩摩訶薩同一切佛，以何義故不名為：佛？乃至不能捨菩薩道？佛子！此菩薩摩訶薩已能修習去、來、今世一切菩薩種種行願，入智境界，則名為：佛；於如來所修菩薩行無有休息，說名：菩薩。如來諸力皆悉已入，則名：十力；雖成十力，行普賢行而無休息，說名：菩薩。知一切法而能演說，名：一切智；雖能演說一切諸法，於一一法善巧思惟未嘗止息，說名：菩薩。知一切法無有二相，是則說名：悟一切法；於二、不二一切諸法差別之道善巧觀察，展轉增勝無有休息，說名：菩薩。已能明見普眼境界，說名：普眼；雖能證得普眼境界，念念增長未曾休息，說名：菩薩。於一切法悉能明照，離諸闇障，名：無礙見；常勤憶念無礙見者，說名：菩薩。已得諸佛智慧之眼，是則說名：覺一切法；觀諸如來正覺智眼而不放逸，說名：菩薩。住佛所住，與佛無二，說名：與佛無二住者；為佛攝受，修諸智慧，說名：菩薩。常觀一切世間實際，是則說名：住實際者；雖常觀察諸法實際，而不證入亦不捨離，說名：菩薩。不來不去，無同無異，此等分別悉皆永息，是則說名：休息願者；廣大修習，圓滿不退，則名：未息普賢願者。了知法界無有邊際，一切諸法一相無相，是則說名：究竟法界捨菩薩道；雖知法界無有邊際，而知一切種種異相，起大悲心度諸眾生，盡未來際無有疲厭，是則說名：普賢菩薩。「佛子！譬如伊羅鉢那象王，住金脇山七寶窟中，其窟周圍悉以七寶而為欄楯，寶多羅樹次第行列，真金羅網彌覆其上；象身潔白猶如珂雪，上立金幢，金為瓔珞，寶網覆鼻，寶鈴垂下，七肢成就，六牙具足，端正充滿，見者欣樂，調良善順，心無所逆。若天帝釋將欲遊行，爾時象王即知其意，便於寶窟而沒其形，至忉利天釋主之前，以神通力種種變現，令其身有三十三頭，於一一頭化作七牙，於一一牙化作七池，一一池中有七蓮華，一一華中有七采女，一時俱奏百千天樂。是時，帝釋乘茲寶象，從難勝殿往詣華園，芬陀利華遍滿其中。是時，帝釋至華園已，從象而下，入於一切寶莊嚴殿，無量采女以為侍從，歌詠妓樂受諸快樂。爾時，象王復以神通隱其象形現作天身，與三十三天及諸采女，於芬陀利華園之內歡娛戲樂，所現身相、光明衣服、往來進止、語笑觀瞻，皆如彼天，等無有異，無能分別；此象、此天，象之與天，更互相似。佛子！彼伊羅鉢那象王，於金脇山七寶窟中無所變化，至於三十三天之上，為欲供養釋提桓因，化作種種諸可樂物，受天快樂，與天無異。佛子！菩薩摩訶薩亦復如是，修習普賢菩薩行願及諸三昧以為眾寶莊嚴之具，七菩提分為菩薩身，所放光明以之為網，建大法幢，鳴大法鐘，大悲為窟，堅固大願以為其牙，智慧無畏猶如師子，法繒繫頂，開示祕密，到諸菩薩行願彼岸。為欲安處菩提之座，成一切智，得最正覺，增長普賢廣大行願，不退不息，不斷不捨，大悲精進，盡未來際度脫一切苦惱眾生。不捨普賢道，現成最正覺，現不可說不可說成正覺門，現不可說不可說轉法輪門，現不可說不可說住深心門；於不可說不可說廣大國土，現涅槃變化門；於不可說不可說差別世界，而現受生修普賢行，現不可說不可說如來；於不可說不可說廣大國土菩提樹下成最正覺，不可說不可說菩薩眾親近圍遶。或於一念頃，修普賢行而成正覺，或須臾頃，或於一時，或於一日，或於半月，或於一月，或於一年，或無數年，或於一劫，如是乃至不可說不可說劫，修普賢行而成正覺。復於一切諸佛剎中而為上首，親近於佛，頂禮供養，請問觀察如幻境界，淨修菩薩無量諸行、無量諸智、種種神變、種種威德、種種智慧、種種境界、種種神通、種種自在、種種解脫、種種法明、種種教化調伏之法。「佛子！菩薩摩訶薩本身不滅，以行願力於一切處如是變現。何以故？欲以普賢自在神力調伏一切諸眾生故，令不可說不可說眾生得清淨故，令其永斷生死輪故，嚴淨廣大諸世界故，常見一切諸如來故，深入一切佛法流故，憶念三世諸佛種故，憶念十方一切佛法及法身故，普修一切菩薩諸行使圓滿故，入普賢流自在能證一切智故。佛子！汝應觀此菩薩摩訶薩，不捨普賢行，不斷菩薩道，見一切佛，證一切智，自在受用一切智法。如伊羅鉢那象王不捨象身，往三十三天，為天所乘，受天快樂，作天遊戲，承事天主，與天采女而作歡娛，同於諸天無有差別。佛子！菩薩摩訶薩亦復如是，不捨普賢大乘諸行，不退諸願，得佛自在，具一切智，證佛解脫，無障無礙，成就清淨，於諸國土無所染著，於佛法中無所分別；雖知諸法普皆平等無有二相，而恒明見一切佛土；雖已等同三世諸佛，而修菩薩行相續不斷。佛子！菩薩摩訶薩安住如是普賢行願廣大之法，當知是人心得清淨。佛子！此是菩薩摩訶薩第十無礙輪大三昧殊勝心廣大智。「佛子！此是菩薩摩訶薩所住普賢行十大三昧輪。」\n\n## 三、旁参与前接\n\n**承前**：品26〈十地品〉法云地满——十地之行至此翻为**等觉之定**；入定非退行，是行满之安住（澄观§5.1）。\n\n**启后**：品28〈十通品〉——定生通：十定之安住发为十种智通之起用；定通相即，等觉之行境备。\n\n## 四、义理要点\n\n**【要点提炼】**\n\n1. **念请→劝敬→普贤自说**：无启请人，大众作念；世尊不亲说而令「禮敬普賢，慇懃求請，又應專至觀察十方，想普賢身現在其前」——**观想即请法**（序分程序全引 §2.1）。\n2. **十定名目**：普光明·妙光明·次第遍往諸佛國土神通·清淨深心行·知過去莊嚴藏·智光明藏·了知一切世界佛莊嚴·一切眾生差別身·法界自在·無礙輪——**每定一「遍」**：遍光·遍刹·遍时·遍身·遍智〔本文判断：十定即十种遍入〕。\n3. **节内句眼「有十種X」**：每一三昧内含一组十法（無盡法·無盡藏……）——**定中有法数**，非混沌境。\n4. **纯长行体**：本品无偈颂——定境非偈咏所能传，唯铺陈其行相。\n\n**【阐释】**（〔本文判断〕）本品把「定」从禅观技术升格为**存在方式**：普光明三昧即「以光明为定体」，次第遍往諸佛國土神通三昧即「以游历为定体」——定不再是收敛而是**展开**。等觉位之定与因地禅定之别正在于此：因地定摄心，果地定**即法界本身之秩序**。故经文每说一定，必先「云何」发问而后以十种法铺开——定即法门之网。\n\n**【启发】**读此品可取「想普賢身現在其前」一句为入手：请法即观想，观想即礼敬——读经时的「在场地」由这一句建立。再以「遍」字读十定名目：凡夫之定求一境，普贤之定遍十方——功课不在换境界，在换「遍」之量。\n\n**【对照】**：六十华严无对应品（十定六十本缺·古来谓「阙本」之一）〔本文判断：六十华严自〈離世間品〉前后有阙，待深化批专考〕；四十华严无本品（唯入法界品）〔实测〕。藏译对应章待勘〔待核〕。\n\n## 五、注疏选要\n\n### 5.1 澄观（`T1735`）\n\n> 十定品第二十七(入第四十經)初明來意。先辨會來。會來有二。一約圓融。謂前明普門中所具差別正位。故寄歷人天。今明位後德用不離普門。是則會別入普有此會來。重會普光意在斯矣。等妙二位。全同如來普光明智故。二約次第。前明十地今顯等妙二覺故來。以極果由於始信故重會普光。謂前依本不動智體起差別之位。今位極成果。不離本智之因。後出現因果。因是果中之因。得果不捨因故。果是果中之果。大用無涯故。二品來者。為答第二會中十定問故。第二釋名會名有二。約處名重會普光明殿會。由第二會已曾會此。故重意如前。約法明說普法會。二品名者。定謂心一境性。十是數之圓極。以普賢深定妙用無涯。寄十以顯無盡。故云十定品。即帶數釋。若依梵本。具云如來十三昧品。以等覺三昧上同佛\n\n（《疏》卷释文·本品来意窗——程序化重取。）\n\n### 5.2 诸家（深化批补引·存目）\n\n## 六、文本对读\n\n### 6.3 藏译（Toh 44 对应章）\n\n德格本相应章（藏30 fol 375b 一带·蕡藏三十）待逐字勘定〔待核〕。\n\n## 七、数据层（L1 实测）\n\n| 指标 | 值 |\n|---|---|\n| CJK（净） | **27,028** |\n| `<p>` / `<lg>` | 49 / 0 |\n| 十种三昧 | 普光明→無礙輪（§2.2 表·实测纠错版） |\n| 说主 | 普賢菩薩 |\n| 请法方式 | 心念＋观想（世尊劝敬） |\n\n## 八、附录·存疑与未竟\n\n- ~~骨架期手抄名目「普光大三昧·妙光明大三昧·次第遍往諸方國土大三昧」等~~〔L.282 已正：普光明三昧·妙光明三昧·次第遍往諸佛國土神通三昧等·悉依经文〕。\n- 六十阙本考〔未竟·待深化批〕；藏译逐字对勘未作〔未竟〕。\n\n## 九、台账（成篇自陈）\n\n**本批补订（L.282·2026-10-31·P25 深化批）**：①骨架纠错（名目七处依经文正）；②序分＋**十种三昧逐种全引**（27,028 CJK·0 手抄）；③澄观来意窗程序化实引；④义理四件套立骨。深化批预登记：六十阙本考＋诸家扩展。\n\n> **成篇识**：十定即十遍——定境即法界之网。全文已注入，凡所未竟有台账。\n\n---\n\n> **EN corresponding · Chapter summary.** With no verbal requester, the assembly only thinks to ask; the Buddha bids them venerate Samantabhadra and visualize his presence, whereupon he expounds the ten samādhis — from Universal Light to Unobstructed Wheel — each a mode of pervading the dharmadhātu, each unfolding its own tenfold dharma-set.\n", "data_source": "", "data_pool": "practice", "back": {"tab": "gap", "view": "avatamsaka-studies", "label": "文献页·华严经学"}, "updated_at": "2026-10-31"};

// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}

}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}

</script>
</body>
