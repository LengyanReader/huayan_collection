<script>
var ARTICLE = {"id": "puxian-sanmei", "file": "articles/puxian-sanmei.html", "title": "九九华严第三品 普贤三昧品之拼读", "title_sub": "华严经第三品·按品精读·入定受加·起定作证·光中颂与众赞颂·世界成就品第四旁参·六十对读·注疏四家会读", "icon": "📖", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第一会_菩提场_所信因果周/华严经细读_第三部_普贤三昧品.md", "doc_md": "# 九九华严第三品 普贤三昧品之拼读\n\n> **EN · Close Reading of the Avataṃsaka Sūtra, Part Three: The Samādhi of Universal Good（普賢三昧）**\n>\n> **底本**：唐·实叉难陀译《大方广佛华严经》（八十华严）`T10n0279`。**范围：卷第七前半（本品）**；卷第七后半《世界成就品第四》另作旁参（见 §三）；其专篇已立（`华严经细读_第四部_世界成就品.md`）。\n> **立稿**：2026-10-16。承第一部《世主妙严品》、第二部《如来现相品》之体例与校勘纪律。\n> **本篇进度（覆盖率自陈）**：**全稿成篇**——§〇 凡例、§一 概述与品题解义、§二 全文逐段＋二十偈细读、§三 旁参（世界成就品第四）、§四 义理要点与名相、§五 注疏选要（诸家会读，含 5.2′智俨／5.2″慧苑）、§六 文本对读与校勘、§七 结构分析（数据层）、§八 附录十一类，**皆已成**。凡未能确证者仍标〔待核〕、属推断者标〔本文判断〕；**不以骨架冒充细读**，其余续补之点俱入 §八·附录四台账。\n> **原则**：沿用前二部之校勘纪律、三层疏解（疏解／名相／会读）、存疑必标、推断必标「〔本文判断〕」、讲者之说疑误只标不改、三译主从分明、不擅改经文、可回源可复核。\n> **〔P3·2026-10-24〕本批新增（item5 7→1 续轮）**：① **Ep15 正行段整合**——本品已于 99华严讲记 Ep15（正行第三集）§四「普賢三昧品第三」以 CBETA `T10n0279` anchor 程序切片逐字回源「此三昧名：一切諸佛毘盧遮那如來藏身」起首段（与第八品四圣谛俟 Ep16 不同，本品正行逐字已得），录入 §5.4.6；② **六十全本复验**——以本机 `T09n0278.xml`（sha256 a2bfcee6213f）逐名复验 §6.2 代读段：定名「即入一切如來淨藏三昧正受」、起定、光中颂四言、寶王雲七名等**逐名皆合**，**如实揭露三处本机两源自歧**（§6.2②「是皆盧舍那佛本願力故」全本脱·§6.2⑤「各申右手摩普賢菩薩頂」全本乱简·§6.2⑩叙分「觀察一切諸世界海」全本脱作「界海」·与 P4 同一处互证），见新增 §6.7；③ **英文品题＋§1.4 画龙睛 EN＋附录九中英要目**；④ 数据层复算（`scripts/sjcj_puxian_studies.py`·本品 CJK 净 1,988 口径与 §7.1 全吻合）。\n\n---\n\n## 〇、凡例（简要）\n\n一、**校勘底本**：以 `T10n0279` 为底本。六十华严（`T09n0278`）、四十华严（`T10n0293`）不作底本，但须品读并作对读；凡异译异说并列而不强断。\n二、**品读主从**：以八十华严为叙事主轴，六十／四十为辅读与对读。主从仅指骨架取自何本，非谓其余可略。\n三、**疏解三层**：其下「疏解」为依经文直解；「名相」为训释与梵汉（凡无把握者标〔待核〕）；「会读」为海云继梦和上讲记等一家之判，非经证，凡引皆逐字回源。\n四、**引文可回源**：凡引经皆照 CBETA 底本原字形（繁体·异体），可回源可复核；凡引注疏皆注明经号与段落，无把握者标〔待核〕。**不擅改经文，亦不据听录回改底本。**\n五、**存疑必标**：凡未能确证者标〔待核〕；凡属本席推断者标「〔本文判断〕」；凡讲者之说疑误者只标不改。\n六、**文本现象与信度**：凡经文有缺文、增补、版本分合之别者，如实标识并系以文献/法义说明，给信度评级（见 §1.5）；**无从确证者只标〔疑阙〕／〔待核〕，不升级为断言**。\n七、**版本差异之惯例**：凡藏译、梵本、六十／四十华严与本品的分品、用字、文段有无、内容增减之别，**悉举而比之**，注版本与信度；**严禁以「藏译云」冒充未见之原文**。\n八、**标题后缀**：本系列每篇标题（YAML `title`）一律以「**之拼读**」为后缀（如「九九华严第三品 普贤三昧品之拼读」），与第一、二部一致。\n\n---\n\n<!-- ATLAS:BEGIN P3 -->\n### 〇之零、导读指南（阅读路径与方法）\n\n**定位：** 考证型细读（philological close reading），以「可复核性」为第一优先。本品一味以「三昧」为法，故读法以**定之为仪**为纲：入定、受加、起定、作证，四步一仪；先谱其仪，再数其云，末辨其名。\n**本品一句：** **普贤一入「毘盧遮那藏身」三昧，九门齐起、九云齐得、十王云齐雨**——定是全经之行门枢纽，「先果后行」自本品始。\n**路径：** 〇之二（二图四表）→ 一（品题与脉络）→ 二（全文逐段）→ 四（义理与名相）→ 五（诸家会读）→ 七（数据层）→ 附录按需查阅。\n**方法：** 先经文后诠释；〔实测〕／〔本文判断〕／〔存疑待核〕三分；负面证据同样入账；结构覆盖 100%，个体择要。\n**读前三问：** ① 澄观何以分六分？定⇄起如何成一状态机？② 九三昧门、九种海云、十摩尼王云三集并列，何以门→云非双射？③ 定名「一切諸佛毘盧遮那如來藏身」／六十「一切如來淨藏」／梵「毘盧遮那藏」，三本之异何所表？\n\n## 〇之二、本品内容地图（未入其门，先观其海）\n\n> **本节体例。** 图与表之数据，一律取自本文已回源核定之 §二逐段表与 §7.1／§7.5 实测数；**凡属推断者标〔本文判断〕，不入图**。图各看一事，勿求一图而尽本品。\n\n### 〇之二.0 提要\n\n本品占**卷第七前半**，剥校勘 **CJK 1,995 字（含品题 7·正文净 1,988）／句末 52**（§7.1），为全经最短之品。结构依澄观**六分**（§5.1）：三昧分（承力入定·彰定名）→加持分（口加同赞·意加与十智·身加摩顶）→起定分（从三昧海门起·九门）→作证分（世界海微动·雨十摩尼王云）→毛光赞德分（光中颂十偈）→大众偈请分（众赞十偈·请转法轮）。偈凡 **20＝2 组×10**（§2.6）；「三昧」29 见、「海」54 见（§7.4）。**篇幅最小而枢纽最大**——第一会自此由果转因。\n\n| 图 | 画什么 | 一句话 |\n|---|---|---|\n| **图 〇-1　六分之仪图** | 定之仪式如何一链相承 | 入定→三加→起定→作证→光赞→偈请 |\n| **图 〇-2　三同构集图** | 九门·九云·十王云何相应 | |A|=|B|=9 而「门→云」非双射；王云十而六十作七名 |\n\n**〔读法之序〕**　先观图 〇-1 以得其仪（六分一链），次观图 〇-2 以得其数（9·9·10 三集），次读〇之二.3 之坐标、.6 之数等，然后入 §二逐段。**仪既明，定始可拟。**\n\n> **EN corresponding · Map of the Chapter.** The shortest chapter of the sūtra by this measure (1,995 characters including the title) is its pivotal ritual. Samantabhadra enters the samādhi of the 'garbha of the Vairocana of all Buddhas', receives the ten knowledges and the Buddhas' touch, rises through nine gates of samādhi, and his rising rains nine ocean-clouds upon the assembly while ten jewelled cloud-kings testify over the trembling oceans of worlds. Śeṅguan divides the chapter into six parts; the verses run twenty, two groups of ten. Fig. 0-1 maps the six-part ritual; Fig. 0-2 counts the three matched sets (9, 9, 10) and marks their deliberately non-bijective pairing.\n\n### 〇之二.1 图 〇-1　六分之仪图\n\n<figure>\n<svg viewBox=\"0 0 1000 300\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"26\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">普贤三昧品六分之仪：入定—受加—起定—作证—光赞—偈请</text>\n<text x=\"500\" y=\"46\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#8a7a5e\">六分依澄观《疏》科（§5.1）；框下一行为本品实测要点</text>\n\n<rect x=\"18\" y=\"90\" width=\"146\" height=\"64\" rx=\"6\" fill=\"#f6efe1\" stroke=\"#b8863c\"/>\n<text x=\"91\" y=\"112\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"#7a5a28\">① 三昧分</text>\n<text x=\"91\" y=\"130\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5147\">承力入定·彰定名</text>\n<text x=\"91\" y=\"144\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8a7a5e\">藏身三昧</text>\n\n<rect x=\"180\" y=\"90\" width=\"146\" height=\"64\" rx=\"6\" fill=\"#f6efe1\" stroke=\"#b8863c\"/>\n<text x=\"253\" y=\"112\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"#7a5a28\">② 加持分</text>\n<text x=\"253\" y=\"130\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5147\">口加同赞·意加与十智</text>\n<text x=\"253\" y=\"144\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8a7a5e\">身加摩顶</text>\n\n<rect x=\"342\" y=\"90\" width=\"146\" height=\"64\" rx=\"6\" fill=\"#e6dbc5\" stroke=\"#b8863c\"/>\n<text x=\"415\" y=\"112\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"#7a5a28\">③ 起定分</text>\n<text x=\"415\" y=\"130\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5147\">从三昧海门起</text>\n<text x=\"415\" y=\"144\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8a7a5e\">九门·一出一切出</text>\n\n<rect x=\"504\" y=\"90\" width=\"146\" height=\"64\" rx=\"6\" fill=\"#e6dbc5\" stroke=\"#b8863c\"/>\n<text x=\"577\" y=\"112\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"#7a5a28\">④ 作证分</text>\n<text x=\"577\" y=\"130\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5147\">世界海微动</text>\n<text x=\"577\" y=\"144\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8a7a5e\">雨十摩尼王云</text>\n\n<rect x=\"666\" y=\"90\" width=\"146\" height=\"64\" rx=\"6\" fill=\"#d4a03c\" stroke=\"#b8863c\"/>\n<text x=\"739\" y=\"112\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"#5a3d10\">⑤ 毛光赞德</text>\n<text x=\"739\" y=\"130\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a3d10\">毛孔放光</text>\n<text x=\"739\" y=\"144\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a3d10\">光中颂十偈</text>\n\n<rect x=\"828\" y=\"90\" width=\"146\" height=\"64\" rx=\"6\" fill=\"#d4a03c\" stroke=\"#b8863c\"/>\n<text x=\"901\" y=\"112\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"#5a3d10\">⑥ 大众偈请</text>\n<text x=\"901\" y=\"130\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a3d10\">众赞十偈</text>\n<text x=\"901\" y=\"144\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a3d10\">请转法轮</text>\n\n<line x1=\"164\" y1=\"122\" x2=\"180\" y2=\"122\" stroke=\"#b8863c\" stroke-width=\"2\"/>\n<line x1=\"326\" y1=\"122\" x2=\"342\" y2=\"122\" stroke=\"#b8863c\" stroke-width=\"2\"/>\n<line x1=\"488\" y1=\"122\" x2=\"504\" y2=\"122\" stroke=\"#b8863c\" stroke-width=\"2\"/>\n<line x1=\"650\" y1=\"122\" x2=\"666\" y2=\"122\" stroke=\"#b8863c\" stroke-width=\"2\"/>\n<line x1=\"812\" y1=\"122\" x2=\"828\" y2=\"122\" stroke=\"#b8863c\" stroke-width=\"2\"/>\n\n<text x=\"500\" y=\"196\" text-anchor=\"middle\" font-size=\"12\" fill=\"#5a5147\">定⇄起一机：所入之定（藏身）本含无量三昧，故起时「从一切世界海微尘数三昧海门起」（§2.4·L3）</text>\n<text x=\"500\" y=\"222\" text-anchor=\"middle\" font-size=\"12\" fill=\"#5a5147\">偈凡 20＝毛光赞德 10＋大众偈请 10（§2.6）；「三昧」29 见、「海」54 见（§7.4）</text>\n<text x=\"500\" y=\"248\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#8a7a5e\">第一会自此由果转因——前二品明所信之果，本品启能感之行（先果后行，§4.4）。</text>\n</svg>\n<figcaption><b>图 〇-1　六分之仪图。</b>六分依澄观科（§5.1）；③④两框为「起定—作证」之枢纽：九门齐起、九云齐得、十王云齐雨，皆「世界海微尘数」为量。<div class=\"en-line\">Fig. 0-1. The six-part ritual after Śeṅguan's division (§5.1): entering the samādhi, receiving the three-fold empowerment, rising through nine gates, the trembling oceans and ten cloud-kings as testimony, the praise in light, and the assembly's request in verse.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. 先只看六框一链：**入定—受加—起定—作证**四步成仪，光赞与偈请两步收束——仪式次第一望而知。\n2. 再记框下三数：**九门·十王云·二十偈**——皆本品实测（§2.4／§2.5／§2.6），不取注疏转数。\n3. 末看底行两语：**定⇄起一机**与**先果后行**——本品在第一会中之枢纽地位，尽在此二语。\n\n### 〇之二.2 图 〇-2　三同构集图\n\n<figure>\n<svg viewBox=\"0 0 1000 330\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"26\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">三同构集：九三昧门 · 九种海云 · 十摩尼王云</text>\n<text x=\"500\" y=\"46\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#8a7a5e\">一格＝一名；「如是等」摄余者为经文固有省略，非残缺（§1.5）</text>\n\n<text x=\"30\" y=\"112\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#7a5a28\">九三昧门</text>\n<circle cx=\"270\" cy=\"107\" r=\"9\" fill=\"#d4a03c\" stroke=\"#b8863c\"/><circle cx=\"300\" cy=\"107\" r=\"9\" fill=\"#d4a03c\" stroke=\"#b8863c\"/><circle cx=\"330\" cy=\"107\" r=\"9\" fill=\"#d4a03c\" stroke=\"#b8863c\"/><circle cx=\"360\" cy=\"107\" r=\"9\" fill=\"#d4a03c\" stroke=\"#b8863c\"/><circle cx=\"390\" cy=\"107\" r=\"9\" fill=\"#d4a03c\" stroke=\"#b8863c\"/><circle cx=\"420\" cy=\"107\" r=\"9\" fill=\"#d4a03c\" stroke=\"#b8863c\"/><circle cx=\"450\" cy=\"107\" r=\"9\" fill=\"#d4a03c\" stroke=\"#b8863c\"/><circle cx=\"480\" cy=\"107\" r=\"9\" fill=\"#d4a03c\" stroke=\"#b8863c\"/><circle cx=\"510\" cy=\"107\" r=\"9\" fill=\"#d4a03c\" stroke=\"#b8863c\"/>\n<text x=\"540\" y=\"112\" font-size=\"12\" font-weight=\"bold\" fill=\"#5a5147\">9（具名九·末以「如是等」摄余）</text>\n\n<text x=\"30\" y=\"162\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#7a5a28\">九种海云</text>\n<circle cx=\"270\" cy=\"157\" r=\"9\" fill=\"#b8863c\" stroke=\"#7a5a28\"/><circle cx=\"300\" cy=\"157\" r=\"9\" fill=\"#b8863c\" stroke=\"#7a5a28\"/><circle cx=\"330\" cy=\"157\" r=\"9\" fill=\"#b8863c\" stroke=\"#7a5a28\"/><circle cx=\"360\" cy=\"157\" r=\"9\" fill=\"#b8863c\" stroke=\"#7a5a28\"/><circle cx=\" 11.5\" fill=\"#8a7a5e\">王云之名多与「赞德／光明／宝」相关，与光中颂十偈之旨相衔（§2.5〔本文判断〕）。</text>\n</svg>\n<figcaption><b>图 〇-2　三同构集图。</b>九三昧门、九种海云、十摩尼王云三集并列（§2.4／§2.5 实点）；门→云非双射（§7.4·L2）；六十侧宝王云仅七名，两译各照其本（§6）。<div class=\"en-line\">Fig. 0-2. Three matched sets: nine gates of samādhi, nine ocean-clouds, ten jewelled cloud-kings (counted group by group in §2.4–2.5). The gates and clouds are equal in number but not paired one-to-one (§7.4, L2); the sixty-book rendering names only seven cloud-kings — each translation kept to its own base.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. 先看三行点数：**9·9·10**——前两集等数而次第不齐，第三集独多一；数之「齐」与「不齐」皆经文实况。\n2. 再看虚线两笔：**非双射**之意不在线，而在「不可套门＝云之配」——配对之欲是读华严常犯之病（§2.4 疏解）。\n3. 末记底线一句：**六十侧仅七名**——同名异数，正是两译分寸；两译各照其本，不强拉齐（§6 铁律）。\n\n### 〇之二.3 本品在第一会（菩提场·所信因果周）之坐标\n\n本品在第一会居**果因转关之位**：前二品明所信之果（会众庄严·现相致问），本品以定启因，后品（世界成就）承定而说世界海十事。\n\n| 品 | 卷 | 位／科 | 一句提撕 | 与本品之关系 |\n|---|---|---|---|---|\n| 世主妙严品（品 1） | 卷一–五 | 第一会·果·会众 | 解脱门 442 见 | 本品入定所感之果海 |\n| 如来现相品（品 2） | 卷六 | 第一会·果·现相 | 四十问致请 | 本品之定，应前品之问 |\n| 世界成就品（品 4） | 卷七后半 | 第一会·因·说海 | 世界海十事 | 承本品起定而说（§3.3 请说相续） |\n| 毗卢遮那品（品 6） | 卷十一 | 第一会末·本事 | 大威光历事四佛 | 所信因果周之结 |\n| 藏译 Toh 44 第 3 章 | 德格 035 卷 fol 83b（L.201 TOC） | 开篇「ཀུན་ཏུ་བཟང་པོ」（普贤）于佛前〔L.210 实测〕 | 与本品开篇相应 | 对应判读〔本文判断〕·逐字对勘未作〔待核〕 |\n| 六十〈盧舍那佛品〉 | 卷三 | 晋译·无独立品名 | 定名「一切如來淨藏」 | 次第文句有别（§6） |\n\n### 〇之二.4 本品形式特征（与邻品对看）\n\n本品之形式特征皆与邻品对看而得；数字之出处逐条标注。\n\n| 特征 | 本品表现〔实测〕 | 邻品之对照 | 读法上的后果 |\n|---|---|---|---|\n| 篇幅 | 1,995 CJK（含品题 7）／句末 52（§7.1） | 第一品 31,953／第二品 8,119 | 全经最短之品，宜一气读 |\n| 骨架句式 | 「三昧」29 见·「解脫門」0 见（§7.4） | 第一品「解脫門」442 见 | 以「三昧」代「门」为骨，定学之品 |\n| 仪式体例 | 六分四步（入定—受加—起定—作证） | 第二品念请—现相—说颂 | 本品是仪，第二品是相 |\n| 数集 | 9 门／9 云／10 王云·非双射（§7.4·L2） | 第二品 14 组×10 偈之整 | 本品之数「不齐」处正是读法 |\n| 定名 | 「一切諸佛毘盧遮那如來藏身」（八十） | 六十「一切如來淨藏」·梵「毘盧遮那藏」 | 三本异名各照底本，不统一（§6） |\n\n### 〇之二.5 五种读法（导览）\n\n| 读法 | 路径 | 适合谁 | 得什么 |\n|---|---|---|---|\n| 仪式读法 | 图 〇-1 → §2.1–2.5 逐分 | 禅观行者 | 入定—受加—起定—作证四步成仪 |\n| 数门读法 | 图 〇-2 → §2.4／§2.5 实点 | 结构读者 | 9·9·10 三集与非双射之分寸 |\n| 义理读法 | §1.4／§4.2／§4.4–4.6 | 义理读者 | 如来藏身·先果后行·海印·重重无尽 |\n| 对勘读法 | §6 全节＋〇之二.5 | 版本学读者 | 定名三本·次第文句有别·宝王云七名 |\n| 数据读法 | §7.1–7.4＋`sjcj_puxian_studies.py` | 数据读者 | L1–L4 四视角一命令可复算 |\n\n### 〇之二.6 数与位之谱：本品之数，四等分录\n\n华严之数非计数之数。本品所涉之数，来源不一，性质亦不一；**先分其等，后论其义**，则不为数目所惑。\n\n| 等第 | 数 | 出处 | 性质 |\n|---|---|---|---|\n| **T0 经文明文** | 九三昧门（具名九·末「如是等」） | §2.4（`T10n0279` 卷七实点） | 起定之门 |\n| **T0 经文明文** | 九种海云 | §2.4 | 起定成益 |\n| **T0 经文明文** | 十摩尼王云（尽列） | §2.5 | 作证之瑞 |\n| **T0 经文明文** | 偈 20＝2 组×10 | §2.6（逐颂标定） | 毛光赞德＋大众偈请 |\n| **T0 本文实测** | 1,995 字（含品题 7·净 1,988）／句末 52／独字 306／熵 7.1185 | §7.1（CJK 剥校勘） | 篇幅与信度 |\n| **T1 注疏** | 澄观六分之科 | `T1735`（§5.1） | 结构之判 |\n| **T0·六十本实测** | 定名「一切如來淨藏」／宝王云 7 名／光中颂四言 | §6（`T09n0278` 卷三） | 两译分寸 |\n\n> **〔读法〕** 本品之数两两成趣：**9 与 9 等而不配，10 与 7 异而不齐**——门→云非双射、两译不强拉齐，皆「各照其本」之铁律在数目上之呈现。读数如读文，**先后其位，再论其义**。\n\n<!-- ATLAS:END P3 -->\n\n## 一、概述与品题解义\n\n### 1.1 品题释义\n\n**品名**：**普贤三昧品**（八十华严第三品，唐·实叉难陀译）。梵本题名，据澄观《华严经疏》所悉，作「**普贤三昧威德神变品**」〔T1·据疏转述，非亲见梵本〕；澄观察其「**威德神变皆定之用，摄用从体，但云三昧也**」——即梵题摄「威德神变」之用以归定体，汉译从简作「三昧品」。藏译（Toh 44）之对应品名与分章，第二部尝据 84000 编目考其为全经第 2 品段内〔T2〕，**本品之确位待核**〔待核〕。\n\n**释名**（分「普贤」「三昧」「品」三节，据澄观 `T1735` §5.1、法藏 `T1733` §5.2、李通玄 `X0223` §5.3）：\n\n- **「普贤」——能说之主**。澄观：「**普贤明说法主，以说普法故**」；又「**三昧境界名为普贤，一切如来藏身为普贤故**」——故普贤乃「人法合举」之说法主。李通玄：「**理智无边名之为普，智随根益称之曰贤**」（理智遍周为普、随根利他为贤）。\n- **「三昧」——所入之业用**。澄观：「**三昧是业用，以非证不宣，故此则人法合举**」——非亲证三昧则不能宣说普法，故说主须入定而后说。法藏释「三昧」云：「**三昧此云等持。离沈浮故。定慧均故名等也。心不散故。住一境故名持也。纳法在心名为正受**」。李通玄：「**三之云正，昧之云定，亦云正受……亦云等持**」。\n- **「品」**——科段之目。此品为一品独立之经段（品次第三，卷第七前半）。\n\n**要义一字**：本品以一「**定**」字为骨——承前品（如来现相，果）之「现」，转入「**普贤入定受加→起定成益→作证→光赞**」之「行」。其定名为「**一切诸佛毗卢遮那如来藏身**」（八十本）——即「普贤即三昧，拣余定也」（澄观）。全品骨节为「**入定→受加→起定→作证→光赞→众请**」，正为下品《世界成就品第四》请转法轮之引子（§1.2、§2.7.3）。\n\n**三昧名之异译（并列·不混）**：\n\n| 本 | 三昧名 | 出处 |\n|----|--------|------|\n| 八十华严（唐译） | **一切诸佛毗卢遮那如来藏身**（三昧） | `T10n0279` 卷七 |\n| 六十华严（晋译） | **一切如来净藏**（三昧·正受） | `T09n0278` 卷三（详 §1.6） |\n\n〔辨〕二名皆为「藏身／净藏」系之圆定，译语不同而所指相类；**并列存之，不据一本改另一本**（与凡例七一致）。\n\n### 1.2 品位与脉络（承上启下·先果后行）\n\n**在八十华严三十九品中之位**：第一会（菩提场会）第三品，占**卷第七前半**（同卷后半为第四品《世界成就品》）。\n\n**判位**：清凉澄观判第一会六品属「**举果劝乐生信分**」，更分三：初《世主妙严品》为「**教起因缘分**」，**次二品（第二《如来现相》＋第三《普贤三昧》）为「说法仪式分」**，后三品（世界成就·华藏世界·毗卢遮那）为「**正陈法海分**」（据 `T1736`，§5.1）。故本品为「说法仪式」之第二——前品「光示法主」，本品「法主入定受加」，二品相衔。\n\n**先果后行（诸家同判之方向）**：\n- **承上**：《如来现相品》（果）——众海既集、如来放光示法主；然「**法主未说，先须入定**」。\n- **本品（行）**：普贤承佛神力入「如来藏身」三昧，十方诸佛同加、摩顶，起定成益，光中说颂，众赞请法。\n- **启下**：《世界成就品》（境）——品末众以「国土云何得成立？诸佛云何而出现？及以一切众生海？」请转法轮，正为下品普贤说「世界海十事」之引（§2.7.3）。\n\n澄观（`T1736`）：「**入定。内观事理外鉴根宜。上感佛加下为物轨。故受之以普贤三昧**」。李通玄（`T1739`）：「**佛令普贤长子，入如来藏身三昧，审谛观法，从三昧起，说佛果报众生业力成就世界依正二报国土庄严**」。海云（§5.4）：「**如来现相是果，普贤三昧是行……先果后因**」——**三家方向一致**：前品示果、本品起行、后品说境。\n\n**结构诸说（供对读，勿强合）**：\n- 澄观 **六分**：三昧分／加持分／起定分／作证分／毛光赞德分／大众偈请分（§5.1）。\n- 法藏 **诸会料简·入定分·加持分**（口加／意加／身加）之科（§5.2）。\n- 李通玄 **二门**：一科其经意／二释三昧名（§5.3）。\n\n### 1.3 篇幅与结构预览（**本品＝卷第七前半**）\n\n> **〔范围说明〕** 本稿范围＝**卷第七前半**（`T10n0279` 卷七，起「爾時，普賢菩薩摩訶薩於如來前」，止「……一切諸佛皆隨喜」）。卷七后半首即《世界成就品第四》（起「爾時，普賢菩薩摩訶薩以佛神力，遍觀察一切世界海……」），**非本品**，另作 §三 旁参。\n\n- **本品范围**：卷第七前半（`T10n0279`）。**实测 1,995 字**（CJK 剥校勘口径，含品题「普賢三昧品第三」7 字；**正文净 1,988 字**）；含标点 2,256 字；句末标点（。！？）52 处〔详见 §7.1〕。**〔口径留痕·订正〕** 旧稿作「1,988／2,256」（未分含品题／净），本批据 `T10n0279` 重测订正：**含品题 1,995·正文净 1,988**，与第二部 §3.2「卷七前半 1,995 字」口径一致。\n- **品题对证**：卷七经首题「大方廣佛華嚴經卷第七……**普賢三昧品第三**」；《八十华严品卷对照表》亦作「3 普贤三昧品＝卷 7」。同卷另有「4 世界成就品」。\n- **结构骨架**（依澄观六分，参 §5.1）：①三昧分（承力入定·彰定名·明定体用）→②加持分（口加同赞＋意加与智＋身加摩顶）→③起定分（九三昧门·九种海云）→④作证分（世界海微动·雨十种摩尼王云）→⑤毛光赞德分（光中说颂十偈）→⑥大众偈请分（众赞十偈·请转法轮）。\n- **统计要点**：**「解脫門」0 见**（异于第一品之 442 见）；**偈颂 2 组×10＝20 偈**；导语「承佛神力／威神」者于经文一见（入定句）。\n- **旁参**：卷七后半《世界成就品第四》（见 §三）。\n\n### 1.4 核心要义（三昧·如来藏身·入定受加·重重无尽·光赞请法）\n\n本品要义五（详 §2、§5）：\n1. **三昧与正定**——「普贤三昧」人法合举，非余定（「拣余定也」）；三昧＝等持＝正受，定慧均等、心住一境。\n2. **如来藏身**——定之名。澄观释为「**广大生息**」三义，身即体／依，有修成、本性二种（§5.1）。\n3. **入定—受加—起定—作证**——澄观谓此四者「**余会入定受加起定即说，同为品；今此开者，文多义广劝修学故**」，且「**四同六异**」，本品以「异」独开一品（§5.1）。\n4. **重重无尽**——「一一尘中有世界海微尘数佛刹，一一刹中有世界海微尘数诸佛，一一佛前有世界海微尘数普贤菩萨」；定遍一切处、一切时（法藏「十重」，§5.2）。\n5. **光中赞德与请转法轮**——二十偈：前十偈为「一切如来毛孔光中」赞普贤，后十偈为海众同声赞普贤并请转法轮。\n\n> **EN · the three key points (dragon-eye gloss; sense-for-sense, not literal）**\n> 1. **One samādhi that stores all buddhas** — Samantabhadra sits before the Buddha and enters a concentration named \"the *treasury-body of all Buddhas, Vairocana*\"; every buddha of the ten directions is *hidden within* this one stillness, which is the whole Avataṃsaka ontology in a single attainment.\n> 2. **Attested and conferred by ten quarters** — the buddhas rise and confirm him three ways: *mouth* (shared praise + eleven reasons), *mind* (bestowing ten wisdoms), *body* (a hand on the head); realization here is *conferred by the assembly of buddhas*, not a private achievement.\n> 3. **Out of samādhi, into the world** — rising through nine gateways of concentration and gaining nine \"ocean-clouds,\" the world quakes and ten kinds of jewel-clouds rain down; the pore-light praises and the assembly's request to *turn the wheel* open the very next chapter. Within the samādhi \"each dust holds as many buddhas as there are dust-lands\" — the interpenetration of Indra's Net is *seen*, not argued.\n>\n> *Title gloss:* **普賢三昧** = \"the samādhi of Samantabhadra (\"Universal Good\")\" — the great-conduct bodhisattva's concentration, here named after its object, *all-buddha-treasury-body*; the hinge where the assembly turns from *fruit* (the previous chapter's Buddha-response) to *practice* (先果後行) (`title_en` \"The Samādhi of Universal Good\" per `data/catalog/chapters.yaml`).\n\n### 1.5 经文文本现象与信度标识（沿用前二部惯例）\n\n**标识符号集**（凡文中出现即附说明）：\n\n| 标识 | 含义 | 于本品之例 |\n|------|------|------|\n| 〔缺文〕 | 经文有脱文/阙漏（据校勘或版本比勘可证） | 本品未见 |\n| 〔残〕 | 残卷/残句 | 本品未见 |\n| 〔短品〕 | 篇幅显著短于常例 | 本品 1,988 字，短于第一品 31,953 字 |\n| 〔疑阙〕 | 疑有阙文而未确 | 存而不论 |\n| 〔补〕/〔后人补〕 | 疑为后出增补 | 本品未见断证 |\n| 〔等〕 | 经文固有之省略代表例（非残缺） | 九三昧门、九种海云之「如是等」 |\n\n**信度评级**（沿用本项目三级来源评级）：\n\n| 级 | 判据 | 例 |\n|----|------|----|\n| T0／一手 | 原典本身（CBETA 底本） | `T10n0279` 卷七文字 |\n| T1／原典 | 同系统译本/注疏（异译、古注原本） | 六十华严、法藏《探玄记》 |\n| T2／学术 | 同行评议论著、学术论文 | 84000 藏译编目 |\n| T3／二手 | 百科、官网、口说转述 | 法师讲记听录 |\n\n**于本品之应用（据实）**：\n- 本品**非残缺品**，然**属〔短品〕**（1,988 字，短于世主妙严品之 31,953 字）——系**篇幅事实**，非脱文（据底本全文完具）。\n- 本品**九三昧门、九种海云、十种摩尼王云**诸「如是等」为**经文固有之〔等〕例**（省略代表），**非残缺**。\n- 本品在**六十华严无独立品名**（其段并入〈卢舍那佛品〉）、**四十华严全无**——属**版本分合之差异**〔并存〕，非「缺」（§1.6）。\n\n### 1.6 版本差异之惯例与本品之版本情况\n\n> **惯例**：凡**藏译（Toh 44）、梵本残片、六十／四十华严**之对应段与本品有别者——不论**分品、用字、文段有无、内容增减**——**悉举而比对之**，并注版本与信度。**无别者亦标「与汉本大体同」**。此为长久沿用之惯例。\n\n**本品之版本情况**（据现有一手/二手材料，对读详后 §六）：\n1. **六十华严（`T09n0278`）**：**无独立「普贤三昧品」**——其段并入〈卢舍那佛品第二之二〉（六十本第 2 品·卷第三；据 CBETA **繁体原字形** `T09n0278` 卷三，存 `data/references/cbeta_txt/T09n0278_juan3.txt`）。**此段与八十本品大体平行而文段、次第有异**：六十亦具**入定**（「即入一切如來淨藏三昧正受」）·**十方佛现同赞**·**与十智**·**摩顶**·**菩萨同声偈颂**·**起定**·**六种震动**·**雨十种宝王云**·**如来毛孔放光而说偈颂**诸节；然**次第与文句有别**（六十菩萨偈颂在摩顶之后、起定之前，八十则众赞颂在末；六十「观察十海普告」置于本品段内而非第四品首；六十光中颂为**四言**而非八十之七言；口加所为 11 vs 10、意加 10 vs 11、摩尼王云名目异）〔详 §6〕。\n2. **三昧名异**：八十「**一切诸佛毗卢遮那如来藏身**」／六十「**一切如来净藏**」——**异译异名并列**（§1.1）。\n3. **梵本**：题「**普贤三昧威德神变品**」（据澄观疏转述，T1；非亲见梵本，标〔待核〕）。\n4. **藏译（Toh 44）**：对应品名与分章〔待核〕（参第二部 §6.4 之藏译品目考）。〔L.210 订正〕德格本已入库（L.200·`data/references/tibetan/derge_kangyur/avatamsaka/`）、45 品 TOC 已提取（L.201）；**藏 3 开篇实测**「ཀུན་ཏུ་བཟང་པོ」（普贤）于佛前，与本品开篇相应〔对应判读〔本文判断〕·逐字对勘未作〕。\n\n### 1.7 核心要义小结\n\n本品以一「**定**」字立骨：**普贤入定 → 诸佛受加 → 起定成益 → 作证雨云 → 光中赞德 → 众请转法轮**。前品（如来现相）示「果」，本品起「行」，后品《世界成就》说「境」；三品相衔，正合华严「**先果后行**」之判。其定「一切诸佛毗卢遮那如来藏身」者，即「**普贤即三昧**」——圆定之总，遍一切处、一切时、一切尘刹，而为说普法的近方便。\n\n---\n\n## 二、卷第七前半（普贤三昧品第三·本品全文）\n\n> **〔经文回源〕** 以下经文一律照 `T10n0279` 卷七底本原字形（繁体）；分行标点为底本所具，**不擅改**。段落划分依澄观六分（§5.1），逐段以「疏解／名相／会读」三层疏之。\n\n### 2.1 三昧分（入定分·此界入定→类通十方）\n\n**经文（起本品）**：\n\n> **经文**爾時，普賢菩薩摩訶薩於如來前，坐蓮華藏師子之座，承佛神力，入于三昧。此三昧名：一切諸佛毘盧遮那如來藏身，普入一切佛平等性，能於法界示眾影像；廣大無礙，同於虛空；法界海漩，靡不隨入；出生一切諸三昧法，普能包納十方法界；三世諸佛智光明海皆從此生，十方所有諸安立海悉能示現；含藏一切佛力解脫諸菩薩智，能令一切國土微塵普能容受無邊法界；成就一切佛功德海，顯示如來諸大願海；一切諸佛所有法輪，流通護持，使無斷絕。如此世界中，普賢菩薩於世尊前，入此三昧；如是，盡法界、虛空界，十方三世，微細無礙，廣大光明，佛眼所見、佛力能到、佛身所現一切國土，及此國土所有微塵，一一塵中有世界海微塵數佛剎，一一剎中有世界海微塵數諸佛，一一佛前有世界海微塵數普賢菩薩，皆亦入此一切諸佛毘盧遮那如來藏身三昧。\n\n**疏解**：澄观判此段为「**入定分**」，中分二：**一明此界入定，二类通十方**。此界入定又分三：\n1. **承力入定**（「于如来前，坐莲华藏师子之座，承佛神力，入于三昧」）——澄观析「入定」句有六：一时（说偈竟时）、主（唯普贤）、处（依如来）、所依座（莲华藏师子座）、所依因（承佛神力）、正入三昧。\n2. **彰定名字**（「此三昧名：一切诸佛毗卢遮那如来藏身」）。\n3. **明定体用**（「普入一切佛平等性……使无断绝」）——历数此定之德用：示众影像、同于虚空、出生诸三昧法、包纳十方法界、智光海所生、安立海所示、容受无边法界、成就功德海、显示愿海、护持法轮。\n\n次**类通十方**（第二分）：「如此世界中……皆亦入此……三昧」——「此界如是，十方尘刹亦尔」，重重无尽。\n\n〔本文判断〕「**此则普贤即三昧**」（澄观）之判，正据此段「坐莲华藏师子之座，承佛神力，入于三昧」而言：定是普贤所有，普贤之境即此定体，故以「普贤」立定名而非别立。\n\n**名相**：\n- **莲华藏师子之座**——说主所坐之座。澄观引《大集经》云：「菩萨得莲华陀罗尼故，说法处皆有莲华，表所入三昧自性无染含果法故」〔T1〕。梵 `padmagarbha-siṃhāsana`〔待核〕。\n- **承佛神力**——所依之因。澄观：「所入深广，要承力故」（非自力能入）。\n- **一切诸佛毗卢遮那如来藏身**——定之名。「毗卢遮那」＝法身佛；「如来藏」＝`tathāgatagarbha`；「身」＝体／依。澄观别释「广大生息」三义（§5.1）。\n- **法界海漩**——「海漩」喻法界之深广旋复、无不随入。「海」为本品数法之总喻（下九海云亦然）。\n\n**会读**（海云《八十华严导读》05·§5.4.3）——海云拈此段之「**重重扩大**」云：\n> 「它这里一直放大、一直放大……那么这么大的量，统统入毗卢遮那藏身三昧。它要跟各位谈这个，就是让各位知道，**你的心量有多大**。而这个大不是用讲，**它是证入的**。」\n\n### 2.2 加持分·口加（诸佛同赞）\n\n**经文**：\n\n> **经文**爾時，一一普賢菩薩，皆有十方一切諸佛而現其前。彼諸如來同聲讚言：「善哉！善哉！善男子！汝能入此一切諸佛毘盧遮那如來藏身菩薩三昧。佛子！此是十方一切諸佛共加於汝，以毘盧遮那如來本願力故，亦以汝修一切諸佛行願力故。所謂：能轉一切佛法輪故；開顯一切如來智慧海故；普照十方諸安立海，悉無餘故；令一切眾生淨治雜染，得清淨故；普攝一切諸大國土，無所著故；深入一切諸佛境界，無障礙故；普示一切佛功德故；能入一切諸法實相，增智慧故；觀察一切諸法門故；了知一切眾生根故；能持一切諸佛如來教文海故。\n\n**疏解**：澄观判为「**加持分**」。法藏更析「加持分」为三：**口加（同赞）／意加（与智）／身加（摩顶）**（§5.2）。此段为**口加**——十方诸佛现前同声赞「善哉！善哉」，明所入之定乃「**十方一切诸佛共加**」，其因有二：一**毗卢遮那如来本愿力**，二**普贤修一切诸佛行愿力**（自他二力相合）。次列**十一种「所为」**（「所谓……故」）：转法轮／开显如来智慧海／普照安立海无余／净治众生杂染得清净／普摄国土无所著／深入佛境界无碍／普示佛功德／入诸法实相增智慧／观察法门／了知众生根／持如来教文海。\n\n**名相**：\n- **善哉善哉**——诸佛印可之辞。\n- **共加**——十方诸佛同以神力加被（「加被」即加持，此处显「入定受加」之仪式）。\n- **毗卢遮那如来本愿力／修一切诸佛行愿力**——能入此定之二因：佛之愿力（他）、行者之行愿力（自）。\n\n〔本文判断〕此段十一种所为，实摄普贤行愿之总纲；与本经末〈普贤行愿品〉十大愿王遥相呼应（不具说，待 §四义理批详）。\n\n### 2.3 加持分·意加与身加（与十智·摩顶）\n\n**经文**：\n\n> **经文**爾時，十方一切諸佛即與普賢菩薩摩訶薩能入一切智性力智，與入法界無邊量智，與成就一切佛境界智，與知一切世界海成壞智，與知一切眾生界廣大智，與住諸佛甚深解脫無差別諸三昧智，與入一切菩薩諸根海智，與知一切眾生語言海轉法輪辭辯智，與普入法界一切世界海身智，與得一切佛音聲智。如此世界中，如來前，普賢菩薩蒙諸佛與如是智；如是，一切世界海，及彼世界海一一塵中，所有普賢，悉亦如是。何以故？證彼三昧法如是故。是時，十方諸佛，各舒右手，摩普賢菩薩頂。其手皆以相好莊嚴，妙網光舒，香流焰發。復出諸佛種種妙音，及以自在神通之事；過、現、未來一切菩薩普賢願海，一切如來清淨法輪，及三世佛所有影像，皆於中現。如此世界中，普賢菩薩為十方佛所共摩頂；如是，一切世界海，及彼世界海一一塵中，所有普賢，悉亦如是，為十方佛之所摩頂。\n\n**疏解**：此段为「加持分」之**意加**与**身加**（法藏科，§5.2）。\n- **意加（与十智）**：十方诸佛「与」普贤十种智——①能入一切智性力智／②入法界无边量智／③成就一切佛境界智／④知一切世界海成坏智／⑤知一切众生界广大智／⑥住诸佛甚深解脱无差别诸三昧智／⑦入一切菩萨诸根海智／⑧知一切众生语言海转法轮辞辩智／⑨普入法界一切世界海身智／⑩得一切佛音声智。**十智者，为说普法之资具**；「何以故？证彼三昧法如是故」——明此乃定力法尔如是，非分外之加。\n- **身加（摩顶）**：十方诸佛「各舒右手，摩普贤菩萨顶」；其手相好庄严、妙网光舒、香流焰发，复出妙音、现神通，过未现三世普贤愿海、如来法轮、三世佛影像「皆于中现」。\n- **类通**：此界如是，一切世界海微尘中诸普贤「悉亦如是」——**重重无尽**再现。\n\n**名相**：\n- **摩顶**——如来以手摩行者顶，表印可、摄受、授记之意。梵 `mūrdhni pāṇiṃ…`〔待核〕。\n- **何故入定·受加**（法藏四问，§5.2）：「何故入定者，显非证不说故」；「为受加故」；「除众疑故」；「何故入果定？为说果法故；何故因人入？为被因人故」。\n\n### 2.4 起定分（从三昧起·九三昧门·九种海云）\n\n**经文**：\n\n> **经文**爾時，普賢菩薩即從是三昧而起。從此三昧起時，即從一切世界海微塵數三昧海門起。所謂：從知三世念念無差別善巧智三昧門起，從知三世一切法界所有微塵三昧門起，從現三世一切佛剎三昧門起，從現一切眾生舍宅三昧門起，從知一切眾生心海三昧門起，從知一切眾生各別名字三昧門起，從知十方法界處所各差別三昧門起，從知一切微塵中各有無邊廣大佛身雲三昧門起，從演說一切法理趣海三昧門起。普賢菩薩從如是等三昧門起時，其諸菩薩一一各得世界海微塵數三昧海雲、世界海微塵數陀羅尼海雲、世界海微塵數諸法方便海雲、世界海微塵數辯才門海雲、世界海微塵數修行海雲、世界海微塵數普照法界一切如來功德藏智光明海雲、世界海微塵數一切如來諸力智慧無差別方便海雲、世界海微塵數一切如來一一毛孔中各現眾剎海雲、世界海微塵數一一菩薩示現從兜率天宮沒下生成佛轉正法輪般涅槃等海雲。如此世界中，普賢菩薩從三昧起，諸菩薩眾獲如是益；如是，一切世界海，及彼世界海所有微塵，一一塵中，悉亦如是。\n\n**疏解**：澄观判为「**起定分**」。其要在「**从三昧起**」而「**从一切世界海微尘数三昧海门起**」——**一出一切出**：所入之定（如来藏身）本含摄遍入无量三昧，故起时亦从无量三昧门起。经列**九门**（具名者九，末以「如是等」摄余）：\n1. 知三世念念无差别善巧智三昧门\n2. 知三世一切法界所有微尘三昧门\n3. 现三世一切佛刹三昧门\n4. 现一切众生舍宅三昧门\n5. 知一切众生心海三昧门\n6. 知一切众生各别名字三昧门\n7. 知十方法界处所各差别三昧门\n8. 知一切微尘中各有无边广大佛身云三昧门\n9. 演说一切法理趣海三昧门\n\n普贤从诸门起时，与会菩萨「一一各得」**九种「海云」**：三昧海云／陀罗尼海云／诸法方便海云／辩才门海云／修行海云／普照法界一切如来功德藏智光明海云／一切如来诸力智慧无差别方便海云／一切如来一一毛孔中各现众刹海云／一一菩萨示现从兜率天宫没下生成佛转正法轮般涅槃等海云——**皆以「世界海微尘数」为量**，重重无尽。\n\n**名相**：\n- **三昧门**——入定之门户、差别门径。此法藏立「**所入三昧分齐差别有十重**」以释之（§5.2）。\n- **陀罗尼**——`dhāraṇī`，总持。\n- **海云**——以「海」表深广无量、以「云」表重重涌现。「海云」为华严数法之典型喻。\n- 〔本文判断〕九门与九海云，非一一对配（门九、云九而次第不齐），**不可套「门＝云」之配**；此与第一品「组组有门、门偈相当」之体例迥异（参 §7.4·L2）。\n\n**会读**：海云于 05 讲以「重重扩大」释本品之量（§5.4）——此「入定—起定」之互摄，正其「心量」之证。\n\n### 2.4′ 起定成益之本末（小结）\n\n> **〔本文判断〕** 观本品「入定→受加→起定→作证」之序，与澄观「四同六异」之说相合：**入、住（受加）、加、出**四者诸会皆同；而本品「**数异**（入起俱多）、**类异**（类通十方）、**利益异**（定起多人益）、**光赞异**（如来毛孔光明赞）、**众请异**（从定起已待众请）、**证相异**（益已即便地动雨云）「六异」具足，故**别立一品**（§5.1）。此「六异」为读本品之纲领。\n\n### 2.5 作证分（世界海微动·雨十种摩尼王云）\n\n**经文**：\n\n> **经文**爾時，十方一切世界海以諸佛威神力，及普賢菩薩三昧力故，悉皆微動。一一世界眾寶莊嚴，及出妙音演說諸法。復於一切如來眾會道場海中，普雨十種大摩尼王雲。何等為十？所謂：妙金星幢摩尼王雲、光明照耀摩尼王雲、寶輪垂下摩尼王雲、眾寶藏現菩薩像摩尼王雲、稱揚佛名摩尼王雲、光明熾盛普照一切佛剎道場摩尼王雲、光照十方種種變化摩尼王雲、稱讚一切菩薩功德摩尼王雲、如日光熾盛摩尼王雲、悅意樂音周聞十方摩尼王雲。\n\n**疏解**：澄观判为「**作证分**」——即「证相异」（§2.4′）：以其定之威神，**感得器界与法会瑞应**，为入定成益之证明。二瑞：\n1. **世界微动**：十方一切世界海「以诸佛威神力，及普贤菩萨三昧力故，悉皆微动」，一一世界众宝庄严、出妙音演说诸法。\n2. **雨十种大摩尼王云**：于一切如来众会道场海，普雨十种摩尼王云——妙金星幢／光明照耀／宝轮垂下／众宝藏现菩萨像／称扬佛名／光明炽盛普照一切佛刹道场／光照十方种种变化／称赞一切菩萨功德／如日光炽盛／悦意乐音周闻十方。\n\n**名相**：\n- **摩尼**——`maṇi`，如意宝珠。「摩尼王云」即以宝珠为体之云，重重雨现。\n- **微动**——大地微动（六种震动之略），表法之瑞。\n- 〔本文判断〕十种摩尼王云之名，多与「赞德／光明／宝」相关，**与下文光中颂十偈之旨相衔**：瑞应先现，而后如来毛孔放光说颂（§2.7.1）。\n\n### 2.6 偈颂支分总表（据经切分）\n\n**偈颂支分总表**（逐颂标定·据经切分；偈数以句末标点「。！？」计，四句一偈）：\n\n| 序 | 说颂出处 | 偈数 | 首句 | 末句 |\n|----|----------|------|------|------|\n| 一 | 一切如来诸毛孔光中（**光中颂**） | 10 | 普賢遍住於諸剎 | 佛光雲中讚功德 |\n| 二 | 一切菩萨众同声（**众赞颂**·承佛神力） | 10 | 從諸佛法而出生 | 一切諸佛皆隨喜 |\n|  | **合计** | **20** | | |\n\n**说颂式**：本品说颂凡二处——①「一切如來諸毛孔中咸放光明，於光明中而說頌言」（光中颂，§2.7.1）；②「爾時，一切菩薩眾皆向普賢合掌瞻仰，承佛神力，同聲讚言」（众赞颂，§2.7.2）。**二颂各十偈**，与第二品「光中出颂＋勝音＋十大士」各十偈之体相类。\n\n〔口径留痕〕本品「解脫門」0 见、「而說頌言」1 见、「同聲讚言」1 见——**「组组有门」之框架，卷一之后诸品皆不可套用**（同 L.106 卷五「门≠偈」之教训）。\n\n### 2.7 说颂分·逐颂细读（毛光赞德分＋大众偈请分·二十偈）\n\n#### 2.7.1 光中颂（十偈·一切如来毛孔光中）\n\n**说颂出处**：承 §2.5「普雨如是十種大摩尼王雲已，一切如來諸毛孔中咸放光明」，于此光中说颂。**经文（十偈）**：\n\n> **经文**「普賢遍住於諸剎，坐寶蓮華眾所觀，一切神通靡不現，無量三昧皆能入。\n> 普賢恒以種種身，法界周流悉充滿，三昧神通方便力，圓音廣說皆無礙。\n> 一切剎中諸佛所，種種三昧現神通，一一神通悉周遍，十方國土無遺者。\n> 如一切剎如來所，彼剎塵中悉亦然，所現三昧神通事，毘盧遮那之願力。\n> 普賢身相如虛空，依真而住非國土，隨諸眾生心所欲，示現普身等一切。\n> 普賢安住諸大願，獲此無量神通力，一切佛身所有剎，悉現其形而詣彼。\n> 一切眾海無有邊，分身住彼亦無量，所現國土皆嚴淨，一剎那中見多劫。\n> 普賢安住一切剎，所現神通勝無比，震動十方靡不周，令其觀者悉得見。\n> 一切佛智功德力，種種大法皆成滿，以諸三昧方便門，示己往昔菩提行。\n> 如是自在不思議，十方國土皆示現，為顯普入諸三昧，佛光雲中讚功德。」\n\n**逐偈疏解（十偈）**：\n1. **普贤遍住于诸刹**——总赞普贤遍住一切刹、坐宝莲华、现神通、入无量三昧。「众所观」表其为主众所瞻。\n2. **普贤恒以种种身**——赞其分身遍满法界、圆音广说无碍。\n3. **一切刹中诸佛所**——赞其于诸佛所现三昧神通，一一周遍十方国土。\n4. **如一切刹如来所**——「彼刹尘中悉亦然」——重重无尽；末句点出此皆「**毗卢遮那之愿力**」。\n5. **普贤身相如虚空**——赞其「身相如虚空，依真而住非国土」，随众生心而示现普身。**此为「依真」之要句**。\n6. **普贤安住诸大愿**——赞其以大愿获无量神通，现形诣一切佛刹。\n7. **一切众海无有边**——赞其分身无量、所现国土严净、「一刹那中见多劫」（时之圆融）。\n8. **普贤安住一切刹**——赞其神通胜无比、震动十方。\n9. **一切佛智功德力**——赞其以三昧方便门，示往昔菩提行。\n10. **如是自在不思议**——结赞：以「为显普入诸三昧」故，「佛光云中赞功德」。\n\n〔本文判断〕光中颂十偈，以「**遍住／分身／重重无尽／依真而住**」为骨，总赞普贤入定之德——**「依真而住非国土」（第五偈）为全颂之义眼**，与本品「如来藏身」之定名、「果／色形」之辨相印。\n\n#### 2.7.2 众赞颂（十偈·一切菩萨同声）\n\n**说颂出处**：「爾時，一切菩薩眾皆向普賢合掌瞻仰，承佛神力，同聲讚言」。**经文（十偈）**：\n\n> **经文**「從諸佛法而出生，亦因如來願力起，真如平等虛空藏，汝已嚴淨此法身。\n> 一切佛剎眾會中，普賢遍住於其所，功德智海光明者，等照十方無不見。\n> 普賢廣大功德海，遍往十方親近佛，一切塵中所有剎，悉能詣彼而明現。\n> 佛子我曹常見汝，諸如來所悉親近，住於三昧實境中，一切國土微塵劫。\n> 佛子能以普遍身，悉詣十方諸國土，眾生大海咸濟度，法界微塵無不入。\n> 入於法界一切塵，其身無盡無差別，譬如虛空悉周遍，演說如來廣大法。\n> 一切功德光明者，如雲廣大力殊勝，眾生海中皆往詣，說佛所行無等法。\n> 為度眾生於劫海，普賢勝行皆修習，演一切法如大雲，其音廣大靡不聞。\n> 國土云何得成立？諸佛云何而出現？及以一切眾生海？願隨其義如實說。\n> 此中無量大眾海，悉在尊前恭敬住，為轉清淨妙法輪，一切諸佛皆隨喜。」\n\n**逐偈疏解（十偈）**：\n1. **从诸佛法而出生**——赞普贤从佛法生、依如来愿力起，已严净「真如平等虚空藏」之法身。\n2. **一切刹中诸佛所**——赞普贤遍住佛会、功德智光等照十方。\n3. **普贤广大功德海**——赞其遍往十方亲近诸佛、于一切尘刹明现。\n4. **佛子我曹常见汝**——赞其于如来所常亲近、住三昧实境。\n5. **佛子能以普遍身**——赞其以普遍身诣十方国土、度众生海、入法界微尘。\n6. **入于法界一切尘**——赞其「其身无尽无差别，譬如虚空悉周遍」，演说如来广大法。\n7. **一切功德光明者**——赞其如云广大、往诣众生海、说佛法。\n8. **为度众生于劫海**——赞其修普贤胜行、演法如云、音声广闻。\n9. **国土云何得成立？**——**请转法轮**：以三问请普贤说（国土如何成立／诸佛云何出现／一切众生海）——「愿随其义如实说」。\n10. **此中无量大众海**——结请：大众恭敬住于尊前，「为转清净妙法轮，一切诸佛皆随喜」。\n\n#### 2.7.3 品末结归·请转法轮（启第四品）\n\n**要义**：众赞颂末二偈（第九、十偈），由「赞普贤」转入「**请转法轮**」——以「**国土云何得成立？诸佛云何而出现？及以一切众生海？愿随其义如实说**」为请。此「请法」正为下品《世界成就品第四》之引子：第四品（卷七后半）普贤乃承此请，说「**世界海十事**」（起具因缘、所依住、形状、体性、庄严、清净、佛出兴、劫住、劫转变差别、无差别门），每事皆长行＋颂。\n\n> **〔本文判断〕** 第三品与第四品**义理相衔、请说相续**（请法→说世界海十事），然**分品别行**（本品为卷七前半，第四品为卷七后半）。本细读**仅取第三品**，第四品见 §三 旁参。\n\n---\n\n## 三、旁参：卷第七后半（世界成就品第四·**非本品**）\n\n> **〔旁参非本品〕** 卷第七后半为《世界成就品第四》，**不属本方范围**（本方＝卷七前半《普贤三昧品》）。然二品**义理相衔、请说相续**——本品末大众以「国土云何得成立？诸佛云何而出现？及以一切众生海？」三问**请转法轮**（§2.7.3），第四品普贤即承此请，遍观十海而说「**世界海十事**」。故节录为**相邻品参照，不入本方逐段校勘**；欲详究者宜另立专篇。\n\n### 3.1 品题·来意·宗趣（据澄观 `T1735`）\n\n**《大方广佛华严经疏》**（`T1735`）「世界成就品第四」段节级选要：\n\n- **来意**：「初來意者。前說緣既具。此下正陳所說。總明果相別答法界安立海問。故此品來。」\n- **释名**：「二釋名者。世謂三世。墮去來今故。界謂方分有彼此故……成就者。即能成之緣。謂十緣等。能所合目。若以世界之成就。即依主釋也。**準梵本中。云世界海成就。下文辯海譯人略也**。」——梵题作「**世界海成就**」，汉译略「海」字。\n- **宗趣**：「三宗趣者。標列無邊勝德。廣釋所知世界海為宗。然其意趣乃有多種。一**令諸菩薩發大信解悟入為趣**……」\n- **释文（后三品之判）**：「四釋文者。**三品正陳法海。於中分二。初二品明果。後一品辯因**……初品通辯諸佛及諸眾生所有剎海。後品別明本師之所嚴淨。又此品明成剎之緣。後品別辯果相故。**此品答安立之問**。」\n  〔按〕后三品＝《世界成就》《华藏世界》《毗卢遮那》：前二品明「果」（众生与诸佛之刹海），后一品辩「因」；本品「明成刹之缘」，答前品（如来现相）末之「安立」问。\n\n**李通玄《新华严经论》**（`T1739`／`X0223`）「世界成就品」段：\n\n- **品名目**：「為明世界海依住、形相、苦樂淨穢，皆是眾生自業果報之所莊嚴，不從他有；佛菩薩世界海依大願力、依自體清淨法性力、依諸波羅蜜諸行海等自體清淨力依，為度眾生大慈悲智力，以不思議變化力之所成就，故名世界成就品。」\n- **来意五**：「一**答前世主三十七問**佛海、眾生海、波羅蜜海等，此品示業果報、示法果報……三十七問一時總答，令大眾海悟佛所行入普賢菩薩所行也，故號佛華嚴經。二令諸現在未來始發菩提心者識佛所行及菩薩行海……三令始發心菩薩知眾生業報同異差別由心造故。四令始發心者知眾生界廣大等法界虛空界如影相入重重無盡依住各別……五令始發心菩薩知諸佛菩薩境界海、眾生境界海一異不可得故，隨眾生自業轉變剎海轉變故，隨自業成壞剎海成壞故。以此眾因緣故，此品須來。」\n- **科文**：「三隨文釋義者。**此之一品有十一段經文。從初一段長行、一段偈頌是此品中敘分。後十段長行及十段偈頌，是正說**。」\n\n〔按〕李通玄「三十七问」之说与第二部（§2.1 据经逐项点定之四十问）**二数并存、各注所据**；其「十一段＝叙分 1＋正说 10」之科，**与底本实测相符**（见下表：叙分 1 长行＋1 颂，正说 10 长行＋10 颂）。\n\n### 3.2 「世界海十事」结构与实测\n\n**经文起（第四品·`T10n0279`）**：\n\n> 爾時，普賢菩薩摩訶薩以佛神力，遍觀察一切世界海、一切眾生海、一切諸佛海、一切法界海、一切眾生業海、一切眾生根欲海、一切諸佛法輪海、一切三世海、一切如來願力海、一切如來神變海；如是觀察已，普告一切道場眾海諸菩薩言……\n\n**十事总标（长行）**：\n\n> 「諸佛子！世界海有十種事，過去、現在、未來諸佛，已說、現說、當說。何者為十？所謂：世界海起具因緣，世界海所依住，世界海形狀，世界海體性，世界海莊嚴，世界海清淨，世界海佛出興，世界海劫住，世界海劫轉變差別，世界海無差別門。諸佛子！略說世界海，有此十事；若廣說者，與世界海微塵數等，過去、現在、未來諸佛，已說、現說、當說。」\n\n**「世界海十事」表**（逐事长行首句与颂数，〔本文实测·`T10n0279` 卷七后半〕）：\n\n| # | 事 | 长行首句（节录） | 颂数 |\n|---|----|----------------|------|\n| 1 | 起具因缘 | 「略說以十種因緣故，一切世界海已成、現成、當成」 | 9 |\n| 2 | 所依住 | 「一一世界海有世界海微塵數所依住」 | 22 |\n| 3 | 形状 | 「世界海有種種差別形相……或圓，或方，或非圓方」 | 10 |\n| 4 | 体性 | 「應知世界海有種種體」 | 10 |\n| 5 | 庄严 | 「應知世界海有種種莊嚴」 | 10 |\n| 6 | 清净 | 「應知世界海有世界海微塵數清淨方便海」 | 9 |\n| 7 | 佛出兴 | 「應知一一世界海有世界海微塵數佛出現差別」 | 10 |\n| 8 | 劫住 | 「應知世界海有世界海微塵數劫住」 | 10 |\n| 9 | 劫转变差别 | 「應知世界海有世界海微塵數劫轉變差別」 | 10 |\n| 10 | 无差别门 | 「應知世界海有世界海微塵數無差別」 | 10 |\n\n〔**颂数口径**〕以 `T10n0279` `<l>` 行计，**两行（＝4 句）为一颂**（与李通玄「两行为一颂」之说合）；全品 `<l>` 240 行＝**120 颂**（叙分颂 10＋十事颂 110）。**各事颂数不齐（9–22）**：事二「所依住」独富（22 颂），事一、事六各 9 颂，余皆 10 颂。此为底本实测，**未与六十／藏本对校**，存以待核。\n\n**「十因缘」**（事一·起具因缘之十种因缘，逐字回源 `T10n0279` 卷七后半）：\n\n> 「諸佛子！略說以十種因緣故，一切世界海已成、現成、當成。何者為十？所謂：**如來神力**故，**法應如是**故，**一切眾生行業**故，**一切菩薩成一切智所得**故，**一切眾生及諸菩薩同集善根**故，**一切菩薩嚴淨國土願力**故，**一切菩薩成就不退行願**故，**一切菩薩清淨勝解自在**故，**一切如來善根所流及一切諸佛成道時自在勢力**故，**普賢菩薩自在願力**故。諸佛子！是為略說十種因緣；若廣說者，有世界海微塵數。」\n\n〔按〕十因缘摄**佛力**（如来神力·善根所流）、**法力**（法应如是）、**众生业力**（众生行业）、**菩萨愿行力**（成一切智·同集善根·净国土愿·不退行愿·胜解自在）、**普贤愿力**五类——**正与李通玄「众生自业果报＋佛菩萨大愿力」二源之说相印**（§3.1）。此「缘」亦即下品《华藏世界》与第四品「成刹之缘」之所系。\n\n### 3.2′ 与本品之接续（请说相续）\n\n| 环 | 本品（第三·卷七前半） | 第四品（卷七后半） |\n|----|---------------------|------------------|\n| 请法 | 一切菩萨同声赞毕，以「**国土云何得成立？诸佛云何而出现？及以一切众生海？**」请（§2.7.2 第九偈） | — |\n| 领主 | 普贤入定受加，从定起而光赞 | 普贤「**以佛神力，遍观察十海**」，普告道场众海 |\n| 说法 | （本品未说世界事，止于众请） | 说「**世界海十事**」：十段长行＋十段偈颂 |\n| 义理 | 起「**行**」（入定受加·圆定之总） | 说「**境**」（众生与诸佛之刹海·成刹之缘） |\n\n> **〔本文判断〕** 第三品与第四品**请说相续、分品别行**：第三品止于「众请」，第四品始于「承请而说」。故读本品者，末二偈（请转法轮）**不可截断**——其为第四品之直接引子（承 §2.7.3）。**分合与次第之别**（六十本将「观察十海普告」置于本品段内、起定之前）详见 §6.2 段⑩。\n\n### 3.3 本节限度\n\n本节仅录第四品之**轮廓与十事之名**，以明第三品之「启下」；其十事之逐事长行、一百二十颂之细读，**非本方范围**。\n\n> **〔本系列进展·指引〕** 第四品《**世界成就品**》之专篇已立：`华严经细读_第四部_世界成就品.md`（九九华严第四品 世界成就品之拼读）。本节所录之轮廓（品题·来意·十事·十因缘），**第四部 §1（概述）、§2（逐段逐颂）、§5（诸家注疏）、§6（八十／六十对读）、§7（数据层）** 已尽详之——**读第四品者，请径往第四部**；本节但存其「承上启下」之要，以见第三品之「启下」义。凡所引经一律照 `T10n0279` 卷七后半原字形；颂数皆实测，未与它本对校者标〔待核〕。\n\n---\n\n## 四、义理要点与名相\n\n> **〔体例〕** 本节统理本品之义理专题（4.1–4.6）与名相训释总表（4.7）。义理凡出注疏者注经号；凡属推断者标〔本文判断〕；梵语无把握者标〔待核〕。**疏解／名相之零出**已见于 §2 各段，本节为之总摄。\n\n### 4.1 三昧与正定（等持·正受）\n\n- **释名**：法藏「**三昧此云等持。離沈浮故。定慧均故名等也。心不散故。住一境故名持也。納法在心名為正受**」（`T1733`）；李通玄「**三之云正，昧之云定，亦云正受……亦云等持**」（`X0223`）。二家同：三昧＝等持（定慧均等、心住一境）＝正受（纳法在心）。\n- **「拣余定」**：澄观「**此則普賢即三昧。揀餘定也**」（`T1735`）——本品之定非泛说诸定，而是「**普贤所有**」、以普贤立名之圆定。\n- **果定 vs 因入人**：法藏「**何故入果定？為說果法故。何故因入人。為被因人故**」（`T1733`）——所入为「果定」（为说果法），入者却是「因人」（普贤），是「**果定因入**」，正摄「因人趣果」之义。\n- 〔本文判断〕华严定学之纲：第一会之定皆属「**果定**」（法藏「初及七八為果定」），故普贤所入非小乘「灭尽定」之比，而为圆顿「**如来藏身**」之定。\n\n### 4.2 「如来藏身」（定之名）\n\n- **澄观·「广大生息」三义**：「復有釋言。**廣大生息**。具此三義名如來藏身。**身即體也依也**。此有二種。一者修成。二者本性。」（`T1735`）——「广」「大」「生息」三义成「如来藏身」之名；「身」为体、为依；有「修成」（唯诸佛有）与「本性」（凡圣俱成）二种。\n- **法藏·净四义／藏四义**：「**淨有四義。一自性淨。二治惑淨。三善根淨。四益用淨。藏有四義。一含攝。二蘊積。三出生。四無盡**」（`T1733`）。又「此中淨之藏，淨即藏；如來之淨藏，如來即淨藏；淨藏之三昧，三昧即淨藏」——**四重相即**（依六十本「一切如来净藏」立）。\n- **梵语互证**：法藏释经别处云「**以此明淨，梵本名為毘盧遮那藏**」（`T1733`）——六十本之「**净藏**」，梵本作「**毗卢遮那藏**（Vairocana-garbha）」，此正与八十本定名「**一切诸佛毗卢遮那如来藏身**」相印证（§6.3）。**异译异名，所指则一**（据法藏之梵汉对照）。\n- **与「如来藏」系**：定名「如来藏身」即 `tathāgata-garbha`（如来藏）之「身（体／依）」义——藏为「含摄·蕴积·出生·无尽」，身为「体·依」。入定段「含藏一切佛力解脱诸菩萨智，能令一切国土微尘普能容受无边法界」即此「藏」之用。\n\n### 4.2′ 名相小表·「三昧佛名」之辨（莫混）\n\n本品文有「**毗卢遮那如来**」（八十定名中）与「**卢舍那佛**」（六十口加中）二佛名——**皆 `Vairocana` 之译，然华严宗判其在「十身／三身」中之位有别，且二译用字不同，非二佛也**（参第一部「毗卢遮那·卢舍那」条）。本条**不擅合说**，唯标识以免误会。\n\n### 4.3 「入定—受加—起定—作证」之仪式与法义\n\n- **入定之四问（法藏）**：「何故入定者，顯非證不說故。為受加故。除眾疑故。何故入果定，為說果法故。何故因入人，為被因人故。」（`T1733`）\n- **三加（口／意／身）**：法藏「**先口加及所為，二意加，三身加。又初勸說以益辯，次冥被以增智，後摩頂而覺**」（`T1733`）。**[本文判断]** 以此科审本品 §2.2–§2.3：口加（同赞＋所为十一句）→意加（与十智）→身加（摩顶），**三段次第与法藏所辨证合**。\n- **加讚互成四句**：法藏「一加而非讚（如佛意身二加）；二讚而非加（如诸菩萨偈赞）；三亦加亦讚（如佛口业）；四非加非讚（如余文）」（`T1733`）。\n- **四同六异（别立一品之由）**：澄观「**言四同者，入住加出；言六異者，一數異……二者類異……三利益異……四光讚異……五眾請異……六證相異**」（`T1735`，详 §5.1）。此「四同六异」为读本品之纲领（参 §2.4′）。\n\n### 4.4 果因律「先果后行」\n\n- **三家同判**：李通玄「**佛令普賢長子，入如來藏身三昧，審諦觀法，從三昧起**」（`T1739`）；澄观以本品与《如来现相》同属「说法仪式分」（`T1736`，§5.1）；海云「**如来现相是果，普贤三昧是行……先果后行**」（§5.4.1）。\n- **答问之始**：李通玄判本品答「三十七问」（§5.3）。**[本文判断]** 无论四十或三十七，二家皆以本品为「**普贤以定力作答之始**」——第二品由「光相」示答，本品起「定行」作答，下三品乃「正陈法海」之广答（§3.1 澄观「此品答安立之问」）。\n- **先果后行之义**：先示果（如来现相·依正庄严）令生信解；次起行（普贤三昧·圆定之总）令能契入；后说境（世界成就·华藏世界）与因（毗卢遮那）——**信→行→解证**之次第。\n\n### 4.5 海印三昧与华严行法\n\n- **法藏·海印定**：「**藏界中依海印定。唯為菩薩演說無盡圓滿自在無礙法門具足主伴**」（`T1733`）；又「**海印者從喻為名。如修羅四兵列在空中，於大海內印現其像。菩薩定心猶如大海，應機現異如彼兵像**」，引《大集经》「一切眾生身及餘外色，如是等色海中皆有印像，以是故名大海印」（`T1733`）。\n- **〔本文判断〕** 本品之「如来藏身」三昧，法藏判为「**藏界中依海印定**」之总——即华严「**海印三昧**」之根本定。故澄观「普贤即三昧」与法藏「海印定」二判**相通**：普贤所入之圆定，即海印炳现之定。\n- **海云一家之判**：海云以本品为「**华严海印三昧行法**」之根本（§5.4.5）——**此系一家行法之判，与经文科判分记，勿径视为经证**。\n\n### 4.6 「重重无尽」（定之遍入）\n\n- **经文**：「一一塵中有世界海微塵數佛剎，一一剎中有世界海微塵數諸佛，一一佛前有世界海微塵數普賢菩薩，皆亦入此……三昧」。\n- **法藏十重**：「**因此略明所入三昧分齊差別有十重**：一約一切定無礙……二約一切處無礙……三約一切時無礙……四此上三重融含為一普賢三昧無礙自在……五於上塵等三昧海中隨一即具一切諸定……六如一三昧一切亦爾……七隨一塵內即見普賢圓明三昧……八如一塵內一切塵道皆亦如是……九隨一念中即有普賢入塵等定……十如一念中餘念念中盡前後際一切劫海皆亦如是」（`T1733`）。\n- **〔本文判断〕** 此「十重」即「**一处一切处、一时一切时、一门一切门**」之圆融，为华严「**因陀罗网（帝网）**」境界之定学表达；本品「类通十方」「尘中尘」诸句，皆此十重之文据。\n\n### 4.7 名相训释总表（梵汉·信度）\n\n**A1 经证**（出 `T10n0279` 卷七前半本品文字）：\n\n| 名相 | 释义 | 出处 |\n|------|------|------|\n| 莲华藏师子之座 | 说主所坐之座，表所入三昧自性无染含果法 | 卷七（§2.1） |\n| 承佛神力 | 所依之因（所入深广，要承力故） | 卷七（§2.1） |\n| 一切诸佛毗卢遮那如来藏身 | 定之名；藏＝含摄·蕴积·出生·无尽，身＝体·依 | 卷七（§2.1） |\n| 法界海漩 | 法界深广旋复，靡不随入 | 卷七（§2.1） |\n| 善哉善哉 | 诸佛印可之辞 | 卷七（§2.2） |\n| 共加 | 十方诸佛同以神力加被 | 卷七（§2.2） |\n| 摩顶 | 如来舒右手摩行者顶，表印可、摄受、授记 | 卷七（§2.3） |\n| 三昧门 | 入定之门户、差别门径 | 卷七（§2.4） |\n| 陀罗尼 | `dhāraṇī`，总持 | 卷七（§2.4） |\n| 海云 | 以海表深广、以云表重重涌现 | 卷七（§2.4） |\n| 摩尼王云 | `maṇi`（如意宝珠）为体之云 | 卷七（§2.5） |\n\n**A2 注疏判摄**（祖疏所立，**非经直言**）：\n\n| 名相／判摄 | 立者 | 出处 |\n|-----------|------|------|\n| 普贤即三昧·拣余定 | 澄观 | `T1735` |\n| 定名「广大生息」三义；身＝体·依；修成／本性二种 | 澄观 | `T1735` |\n| 三昧＝等持·正受 | 法藏 | `T1733` |\n| 净四义／藏四义；净藏四重相即 | 法藏 | `T1733` |\n| 所入三昧分齐差别十重 | 法藏 | `T1733` |\n| 加持分＝口加／意加／身加；加讚互成四句 | 法藏 | `T1733` |\n| 四同六异（别立一品之由） | 澄观 | `T1735` |\n| 科判六分（三昧／加持／起定／作证／毛光赞德／大众偈请） | 澄观 | `T1735` |\n| 海印定（藏界中依海印定） | 法藏 | `T1733` |\n\n**T1／T2**（异译·梵藏·学术）：\n\n| 名相／题 | 说明 | 信度 |\n|---------|------|------|\n| 定名异译：六十作「一切如来净藏」 | 梵作「毘盧遮那藏」（法藏之梵汉对照） | T1 |\n| 梵题「普贤三昧威德神变品」 | 据澄观疏转述，非亲见梵本 | T1〔待核〕 |\n| 藏译（Toh 44）对应品名与分章 | 德格本已入库（L.200）·藏 3 开篇「ཀུན་ཏུ་བཟང་པོ」（普贤）于佛前〔L.210 实测〕 | 对应判读〔本文判断〕·逐字对勘未作〔待核〕 |\n\n〔**待核**〕本经梵本缺——`vairocana-garbha` 之完整梵名、`mūrdhni` 摩顶句之梵文原文，诸拟皆〔待核〕，不臆断。\n\n---\n\n## 五、注疏选要（节级贯通）\n\n> **〔本轮增补〕** 原列四家（澄观·法藏·李通玄·海云）之外，本轮增**智俨《搜玄分齊通智方軌》**（`T1732`，见 §5.2′）与**慧苑《續華嚴略疏刊定記》**（`X0221`，见 §5.2″）二家，故统称「诸家」。下表仍以原有三家（澄观·法藏·李通玄）为准，海云讲记别见 §5.4，不入对照表。\n\n> **〔引文回源说明〕** 以下诸家注疏，皆据本机 CBETA 纯文本逐字摘录（繁简依原录），并注经号与大致位置；凡转述者标〔转述〕。**讲者之说凡与经不合者以经为正**（凡例五）。\n\n### 5.1 澄观（`T1735`／`T1736`） (*fourfold analysis applied below as appropriate*)\n\n**《大方广佛华严经疏》**（`T1735`）「普贤三昧品第三」段节级选要：\n\n- **来意**：「初來意者。前眾既集光示法主。今將說法。是故法主入定受加為近方便。故次來也。」——前品（如来现相）「众既集、光示法主」，本品「法主入定受加」以为「**近方便**」（将说法的最近前方便）。\n- **释名**：「二釋名者。普賢明說法主。以說普法故。三昧是業用。以非證不宣。故此則人法合舉。普賢之三昧。亦此三昧是普賢所有。又三昧境界名為普賢。一切如來藏身為普賢故。此則普賢即三昧。揀餘定也。若準梵本普賢三昧威德神變品。威德神變皆定之用。攝用從體。但云三昧也。」\n- **四同六异（别立一品之由）**：「言四同者。入住加出。言六異者。一數異。餘會入起唯一。此會入起俱多故。二者類異。類餘方故。三利益異。定起多人益故。四光讚異。如來毛孔光明讚故。五眾請異。從定起已待眾請故。六證相異。餘會經終方有證相。此品益已即便地動雨雲等故。四五二種十地雖有而不具六。今此具六故別立品。」又：「餘會入定受加起定即說。同為一品。今此開者。文多義廣勸修學故。」\n- **宗趣**（*main theme/doctrinal purport*）：「三宗趣者。入法界定法界佛加為宗。令法界眾成法界德為趣。望於後品。亦說世界海為趣。」——**宗**：入法界定、法界佛加；**趣**：令法界众成法界德；**望后品**（世界成就）则以「说世界海」（*expounding the ocean of worlds*）为趣。\n- **科判（六分）**：「四釋文者。文有六分。一三昧分。二加持分。三起定分。四作證分。五毛光讚德分。六大眾偈請分。」\n- **定名·三昧分三**：「初中有二。一明此界入定。二類通十方。就初分三。一承力入定。二彰定名字。三明定體用。」\n\n**《随疏演义钞》**（`T1736`，「疏」之随文钞释）对应条：\n- **入定之由**：「入定。內觀事理外鑑根宜。上感佛加下為物軌。故受之以普賢三昧」。\n- **会位次**：钞释第一会「六品分三」——「初品明教起因緣分，次二品明說法儀式分，後三品正陳法海分」，**本品与《如来现相品》同属「说法仪式分」**。\n- **别释「如来藏身」**（`T1735` 释定名处）：「毘盧遮那前已廣釋。復有釋言。**廣大生息**。具此三義名如來藏身。**身即體也依也**。此有二種。一者修成。二者本性。」——「广」「大」「生息」三义成「如来藏身」之名；「身」为体、为依；有「修成」（唯诸佛有）与「本性」（凡圣俱成）二种。\n\n〔要点〕澄观之释名（**普贤即三昧·拣余定**）、别立品之由（**四同六异**）、宗趣（**入法界定·法界佛加**）、科判（**六分**），为 §2 逐段划分与 §1 之义理纲；定名「广大生息」三义，则与「如来藏身」之梵语义相扣。\n\n### 5.2 法藏（`T1733`）\n\n**《华严经探玄记》**（`T1733`）对应段（六十〈卢舍那佛品〉内「法主入定分·诸佛加持分」）节级选要：\n\n- **入定分·诸会料简**：「第三法主入定分。於中二。先料簡諸會中有四。一有無者……二出不出者唯第八不出……三因果者初及七八為果定……四能入人者唯第八佛自入。」\n- **入定之由（四问）**：「先此土後結通。初中於佛前坐者顯因果不相離故。何故入定者顯非證不說故。為受加故。除眾疑故。何故入果定。為說果法故。何故因入人。為被因人故。」\n- **释「三昧」**（名相之要）：「淨有四義。一自性淨。二治惑淨。三善根淨。四益用淨。藏有四義。一含攝。二蘊積。三出生。四無盡。**三昧此云等持。離沈浮故。定慧均故名等也。心不散故。住一境故名持也。納法在心名為正受**。」\n- **所入三昧之十重**：「因此略明所入三昧分齊差別有十重。一約一切定無礙。故起分中言普賢菩薩從彼三昧起從世界塵數等三昧起。解云此有二義。一此定含攝多三昧故。二此定遍入多三昧故。是故此定即是塵等三昧海也。二約一切處無礙。如此文云普賢菩薩於此世界三昧正受。盡法界虛空界等一切佛剎亦復如是……三約一切時無礙……」\n- **加持分（口加／意加／身加）**：「第四諸佛加持分中二。先辨諸會有二……二釋文中三。先口加及所為。二意加。三身加。又初勸說以益辯。次冥被以增智。後摩頂而覺。」\n\n〔注〕法藏《探玄记》所释为**六十华严**（其普贤三昧段并入〈卢舍那佛品〉，三昧作「一切如来净藏」）；本品（八十）之「一切诸佛毗卢遮那如来藏身」为异译名。二本释名相类，**异译并列，不强合**（§1.1、§1.6）。\n\n### 5.2′ 智俨《搜玄分齊通智方軌》（`T1732`） (*fourfold analysis applied below*)\n\n**来源**：唐·智俨（华严二祖，法藏之师）《搜玄分齊通智方軌》（`T1732`）；本机藏 PDF 抽取本，原文用康熙部首异体字，此处已归一为正字，仍待二次校对〔待核〕。**旧著录误题「法藏」，本轮已订正**（见 §一 著录订正、部1 八.5）。\n\n**智俨就六十本立论**：六十本**无独立〈普賢三昧品〉**——其内容并入〈盧舍那佛品第二〉（＝八十品2–6）。故 `T1732` 于本品**无逐品玄谈**；其可据者，为品2「四门分别」通判中涉及「三昧分」者：\n\n**（一）通判（本品所自出）**：智俨立三分，本品（八十品3）属「**舉果勸樂生信分**」；其品2分文释云：「二明三昧分法體。即敬承佛力。受加以發起。」（`T1732` 品2）\n\n**（二）「诸会入定」料简（最要）**：\n\n> 「二明三昧分法體。……於內有二。一約諸會料簡。二釋文。料簡分四。……一有無者入定為表法深。唯第二會所對機淺。法不可深故。又是住方便無自位體。故不入定。」（`T1732` 品2·释文）\n\n**会读**：智俨此「**諸會入定料簡**」，为「九会之中何会入定、何会不入」之最早判释。其「唯第二会不入定」者，谓**佛不自入定**（第二会当机浅、住方便无自位体）——与慧苑「唯第二會不入定以表信未成位」（§5.2″）同判而释义微异。**而本品〈普賢三昧〉乃普賢（因人）入定，非佛入定**，二者不相碍〔本文判断〕。此一料简，为读本品「入定受加」之教判背景（参 §4、§5.1）。\n\n### 5.2″ 慧苑《續華嚴略疏刊定記》（`X0221`）\n\n**来源**：唐·慧苑（法藏弟子）《續華嚴略疏刊定記》（`X0221`，卍续藏）；本机藏 PDF 抽取本，原文用康熙部首及 CJK 部首补充区异体字，此处已归一，仍待二次校对〔待核〕。**慧苑就八十本立论**，品次与八十本一致，故本品（品3）于 `X0221` 有**逐品玄谈**，亦立「四门同前」。\n\n**（一）释名**（亲勘梵本）：\n\n> 「初釋名者。德周法界曰普。柔順調善曰賢。……普賢是人。三昧是法。人為能入。法為所入。能所合為其稱。故曰普賢三昧。……今勘梵本。具名普賢三昧威德神變品。普賢三昧謂標名召體。威德神變即定用也。攝用從體故。但云普賢三昧。」（`X0221` 品3·释名）\n\n**按**：慧苑**亲勘梵本**，明言梵题具名「**普賢三昧威德神變品**」，汉译「摄用从体」故略作「普贤三昧」——此说与澄观「準梵本……威德神變皆定之用，攝用從體，但云三昧也」（§5.1）**全同**，可互证（慧苑早于澄观，澄观或承之）〔本文判断〕。\n\n**（二）来意**：「前品明眾集次應說法。法是玄妙非定不宣故。又前品是正說遠方便。今是近方便。故次來也。」\n\n**（三）宗趣**：「入定受加為宗。為說剎海為趣。」\n\n**（四）释文——「九会中定」通料简（最要）**：\n\n> 「四釋文中二。先通料簡九會中定。後正釋文。前中。一有無者。唯第二會不入定以表信未成位。因行之中此最麤故。二出不出者。唯第七第九二會不出。七顯此是唯勝進故。九顯法界一證無退故。三因果者。初及七八九會皆是果定。四中普並有果故。餘之五會並是因定。以彼皆顯因位行故。四能入人者。七九二會佛自入定表果用故。」（`X0221` 品3）\n\n**（五）本品科段（六分）**：\n\n> 「二正釋文者。此一品內分為六分。一三昧。二加。三起。四類剎雨寶。五毛光讚德。六大眾重請。」（`X0221` 品3）\n\n**会读**：慧苑「**一品六分**」为读本品之**等长骨架**（与澄观「六分」、法藏诸门可对读）；其「唯第二会不入定（表信未成位）」与智俨「唯第二会……故不入定」（§5.2′）同判。又慧苑「**七、九二会佛自入定**」「初及七八九会皆果定，余五会因定」之通判，为九会入定之总纲，可与部6 §5.1 澄观说合观〔本文判断〕。\n\n### 5.3 李通玄（`T1739`／`X0223`）\n\n**《新华严经论》**（`T1739`）第一会品目段节级选要：\n- 「三普賢三昧品。明**佛令普賢長子。入如來藏身三昧。審諦觀法。從三昧起。說佛果報眾生業力成就世界依正二報國土莊嚴**。四便說世界成就品。明由眾生業力起。」——明本品为「佛令普贤入定审观、起定说依正二报」。\n- **长科·五品答问**：「自此現相品乃至普賢三昧品、世界成就品、華藏世界品、毗盧遮那品，此五品經總是答前三十七問，明舉果勸修。」\n\n**《新华严经论》（合论，`X0223`）「普贤三昧品第三」段节级选要**：\n\n- **释品名**：「一釋品名者。**理智無邊名之為普。智隨根益稱之曰賢。三之云正。昧之云定。亦云正受**。為正定不亂能受諸法。憶持簡擇故名正受。亦云等持。為正定能發生正慧。等持諸法。是故名之等持也。為普賢為佛紹法界大智之家。諸佛萬行遍周之長子。以答前所問三十七問中云何一切菩薩行海、出離海、神通海、波羅蜜海、世界海等故須入定。善簡眾法。答前所問。令眾迷解故故須入定。」\n- **来意**：「二釋品來意者。明普賢菩薩常在三昧。靜亂總真。然教化眾生故成法則。答所問疑故。為善簡擇諸三昧出入同異相故。為善擇眾生業海果報、佛行業海果報故須入定。從定起已說世界成就品、華藏世界品、毗盧遮那品答前所問。故此品須來。」\n- **科文**：「三隨文釋義者。於此一品經文中。義分為二。一科其經意。二釋三昧名。」\n\n〔辨析·念请问数〕李通玄以本品所答为「**三十七问**」（与第二部 §2.1 据经文逐项点定之「四十问」数不同，**盖计数与归并口径之别**；二数并存、各注所据，**不据李氏回改经文，亦不掩其说**）。李氏「普贤三昧答三十七问」之判，正点出本品为「**答问之始**」（承第二品四十念请，自此品起普贤以定力作答）。\n\n### 5.4 会读（海云讲记）\n\n**来源**：海云继梦和上《八十华严导读》（西安草堂寺 201005）讲记，本机 `docs/huayanhai/华严云海/浩瀚华严海/八十华严导读-西安草堂寺201005/听录/`（口说**听录**，属二手转写，措辞或有出入，凡与经不合者以经为正）；并参「法筵精点」博客（`docs/huayanhai/摘录会集/和上博客/和上新浪博客201101-06_1.txt`）。以下引海云语皆逐字取自听录原文。**另据 99华严讲记 Ep15（正行第三集）§四「普賢三昧品第三」以 CBETA `T10n0279` anchor 程序切片逐字回源**（见 §5.4.6）——本品正行段已得，与第八品四圣谛俟 Ep16 不同。\n\n#### 5.4.1 本品在全经结构中之位（先果后行·三循环）\n\n- **先果后行**：「这『如来现相』是果，『普贤三昧』是行……先果后因呐」（`导读02`）；「第二品是果，第三品是因行嘛……三十六《普贤行品》是因行，三十七《如来出现品》是果相……这刚好一个循环」（同）。\n- **三循环**：「第二品开始到三十七品一个循环，三十八品是第二循环——《离世间品》，三十九品是第三个循环——《入法界品》，《华严经》一共有三个循环」。（**此系海云一家之判**，与经文科判传统对读时分记，勿径视为经证。）\n\n#### 5.4.2 「普贤三昧」之界定（法筵精点·384）\n\n> 「**普贤三昧直接讲的就是三昧，它不是普贤定，也不是普贤行，而是普贤三昧！**」\n> 「三昧翻成中文就叫『正定』。你要入这个正定，是要入『**普贤正定**』。所以，我们一直告诉大家，你要修行就要修到入正定（入三昧）才算！」\n\n**会读 05 讲**：「**那么这个三昧呀，就是正定**。三呐，梵文的三，这个音发的时候都是指正的意思……三菩提就正觉，三藐三菩提就是正等正觉……所以三昧的意思啊，就是正定。那么梵文的音呢就叫三摩地……现在我们翻成汉文呢就叫正定。**那么正定啊，必须入定，然后才有正定**。」\n\n- **三昧名之解**：海云于 07 讲曰「**普贤三昧是什么？其实就是一切诸佛，毗卢遮那如来，长生菩萨三昧，简称为普贤三昧**」〔听录作「长生」，疑为「藏身」之听误，**存录不改**，以经本为正〕。\n\n#### 5.4.3 三昧名「如来藏身」之会读·重重扩大（导读 05）\n\n海云于 05 讲以本品入定段之「重重扩大」为教：「**一切国土，及此国土所有极微尘……那么这些微尘，一一尘中有世界海微尘数佛刹，那每一个微尘里都有世界海微尘数佛刹那么多……一一佛前有世界海微尘数普贤……一直放大、一直放大到这里……这么多的量，统统入毗卢遮那藏身三昧。它要跟各位谈这个啊，就是让各位知道，你的心量有多大。而这个大不是用讲，它是证入的。**」\n\n#### 5.4.4 「先果后行」与三循环（导读 07）\n\n> 「如来现相，我们就发现，是从我们这个世间法界象限，转移到性起法界，就到灵性世界里面去，而这个象限转移的动力，如何转的，就是**普贤三昧转的**。那修行就是修这个普贤三昧。」\n\n#### 5.4.5 海印三昧行法·前行八部（导读 11／19）\n\n海云以本品为「**华严海印三昧行法**」之根本大定：「**这个普贤三昧就是华严海印三昧行法，那第一个就把这个根本大行提出来了**」（导读 05）。又于 19 讲（会读《十定品》）曰：「**这个普贤三昧大定，这些统合起来就叫海印三昧**」；「**没有普贤三昧，就住普贤行……海印三昧是入普贤境界**」。——**此为一家行法之判，须与经文科判分记，勿径视为经证。**\n\n#### 5.4.6 正行段逐字对勘（99华严 Ep15 §四·CBETA `T10n0279` anchor 回源）【P3·2026-10-24】\n\n本品已于 99华严讲记 **Ep15**（正行第三集）§四「普賢三昧品第三」以 CBETA `T10n0279` anchor 程序切片**逐字回源**（**非手抄**·去 note/app/figure、剥标签、压平后由 `cut()` 锚点抽取·assert 命中·access 2026-10-24）。与第八品四圣谛俟 Ep16 不同，**本品正行逐字已得**，据实录入。\n\n- **入定·彰定名（对应 Ep15 §四 4.1·讲者 §A02/§F01）**：底本「**普賢三昧品第三·爾時，普賢菩薩摩訶薩於如來前，坐蓮華藏師子之座，承佛神力，入于三昧。此三昧名：一切諸佛毘盧遮那如來藏身，普入一切佛平等性，能於法界示眾影像……一切諸佛所有法輪，流通護持，使無斷絕**」——讲者 §A02「這個定…一切如來藏身」·§F01「這普賢三昧品的名字叫作一切諸佛毘盧遮那如來藏身普賢菩薩三昧」**合底本『此三昧名：一切諸佛毘盧遮那如來藏身』**〔T0·信度 A〕；承 Ep14 §A03「最大定」线。\n- **本元界→本體界之轉化（承 Ep15 §A·讲者科判·T3）**：讲者判本品「**從本元界到本體界之間的一個轉化**」·「**轉化的這個能的部分就是普賢三昧品**」·「**把一切諸佛都藏身在普賢菩薩的這個大定裡面**」（§A·合 §四 4.1）——属讲者**定位之判读**〔T3·二手口说·本文判断〕，可与 §5.4.1「先果后行」及 §5.4.5「海印三昧行法」相参，**非经证**。\n- **听录「長生」之误·只标不改**：讲者 07 讲口诵定名作「**一切諸佛・毗盧遮那如來・長生菩薩三昧**」（§5.4.2 已存录）——「長生」疑为「**藏身**」之听误，**存录不改、以经本为正**（凡例四·不据听录回改底本）。\n\n#### 5.4.7 界限\n\n以上皆海云**口说听录**之**解读**，非经证、非法师著述，措辞出入须以 CBETA 经本为准。采录之意义在存其**判读视角**（**三昧即正定·先果后行·三循环·海印三昧行法·象限转移**），**不以其说替代注疏**。\n\n### 5.5 诸家判释对照表\n\n| 门 | 澄观 `T1735`／`T1736`（八十） | 法藏 `T1733`（六十） | 李通玄 `T1739`／`X0223`（八十） |\n|----|------------------------------|---------------------|--------------------------------|\n| 所据本 | 八十（实叉难陀） | 六十（佛驮跋陀罗） | 八十 |\n| 品名 | 普贤三昧品（梵「普贤三昧威德神变品」） | 就〈卢舍那佛品〉内「法主入定分」立说 | 普贤三昧品 |\n| 所入定名 | 一切诸佛毗卢遮那如来藏身 | 一切如来净藏（异译） | 如来藏身三昧 |\n| 来意 | 法主入定受加为「近方便」（将说法） | 显非证不说·为受加·除众疑 | 答三十七问之始·善简众法 |\n| 释名 | 普贤即三昧·拣余定（人法合举） | 三昧此云等持·正受 | 理智无边名普·智随根益称贤；三昧＝正定 |\n| 科判 | 六分（三昧／加持／起定／作证／毛光赞德／大众偈请） | 法主入定分·诸佛加持分（分二） | 义分为二（科经意·释三昧名） |\n| 别立品之由 | 四同六异 | 唯第八不出·初及七八为果定 | （未别论） |\n| 所答问数 | （承四十念请） | —（六十无四十问） | 三十七问 |\n| 定之地位 | 第一会「说法仪式分」（`T1736`） | 初及七八为果定 | 答问之始（举果劝修） |\n| 义理总归 | 入法界定·法界佛加（宗） | 所入三昧十重无碍（遍入多定） | 先果后行·答问之始 |\n\n〔本文判断〕三家**互有详略而义理相成**：澄观以「**普贤即三昧**」「**四同六异**」「**六分**」立骨，最便初学；法藏以「**等持·正受**」「**十重无碍**」明定之体用；李通玄以「**答问之始**」「**先果后行**」揭本品在全经之次第。**三家皆以「定」为说法之近方便、以「果定」为所入**，可相印证。**所据本异（法藏六十·余二八十），故定名有「净藏／如来藏身」之别——异译并列而不强合**（§1.1、§1.6、§6.3）。\n\n---\n\n## 六、文本对读与校勘\n\n> **〔引文回源〕** 本节的六十华严引文，一律照 CBETA **繁体原字形**（回源所得 `T09n0278` 卷三，存本机 `data/references/cbeta_txt/T09n0278_juan3.txt`，见 §6.0）；八十华严照 `T10n0279` 卷七。**不据简体本入正文**（参 §1.6 末、附录四）。\n\n### 6.0 底本与回源（先记来源）\n\n| 本 | 藏经号 | 落点 | 本机文件／回源 |\n|----|--------|------|----------------|\n| 八十 | `T10n0279` | 卷七前半 | `data/references/cbeta/T10n0279.xml`（CBETA TEI P5） |\n| 六十 | `T09n0278` | 卷三·盧舍那佛品第二之二 | `data/references/cbeta_txt/T09n0278_juan3.txt`（**本批自 CBETA `xml-p5` 抓取，繁体原字形，2026-10-16**） |\n| 四十 | `T10n0293` | 惟〈入法界品〉一会 | 与本品**无对应，永久记阙** |\n\n〔**回源记事**〕本批前，本机仅有六十华严之**简体转换本**（`docs/huayanhai/义学专题/经论原典/六十华严_1.txt`），不足为对读之据（凡例八）。本批自 CBETA 官方 XML 仓库取得 `T09n0278` 卷三**繁体原字形**（正文 CJK 8,406 字），本品段逐字可回源，**§6.2 诸引文据此**。**【P3·全本复验】本批另以本机六十全本 `data/references/cbeta/T09n0278.xml`（sha256 a2bfcee6213f）逐名复验 §6.2 所据引文，结果见新增 §6.7**（多数逐名皆合、三处全本脱/乱）。\n\n### 6.1 三译定位\n\n| 本 | 对应位置 | 品名 | 说明 |\n|----|---------|------|------|\n| 八十（`T10n0279`） | 卷第七前半 | **普賢三昧品第三** | 本品 |\n| 六十（`T09n0278`） | 卷三·〈盧舍那佛品第二之二〉 | **无独立品名** | 内容并入，分品、次第皆有异（§6.2） |\n| 四十（`T10n0293`） | — | — | 与本品**无对应**，永久记阙 |\n| 藏译（Toh 44） | 藏 3 开篇「ཀུན་ཏུ་བཟང་པོ」（普贤）于佛前〔L.210 实测〕 | 对应判读〔本文判断〕 | 德格本已入库（L.200）·逐字对勘未作〔待核〕 |\n\n### 6.2 代表段逐字对读（八十／六十）\n\n**段① 入定·定名**\n\n> **八十**（`T10n0279`）：「爾時，普賢菩薩摩訶薩於如來前，坐蓮華藏師子之座，**承佛神力，入于三昧。此三昧名：一切諸佛毘盧遮那如來藏身**，普入一切佛平等性，能於法界示眾影像……」\n> **六十**（`T09n0278`）：「爾時，普賢菩薩於如來前，坐蓮華藏師子之座，**即入一切如來淨藏三昧正受**，普照一切法界諸如來身，無所障礙，離垢滿足，猶如虛空。」\n\n〔异〕①八十作「**承佛神力，入于三昧**」＋「**此三昧名：……**」；六十径作「**即入……三昧正受**」，**无「承佛神力」四字**。②定名：八十「一切諸佛毘盧遮那如來藏身」／六十「一切如來淨藏」（§6.3）。③八十于定名后另出「普入一切佛平等性……使無斷絕」定德一长串；六十则作「普照一切法界諸如來身，無所障礙，離垢滿足，猶如虛空」——**句型与内容各别**。\n\n**段①′ 类通十方（入定末）**：\n\n- 八十：「如此世界中，普賢菩薩於世尊前，入此三昧；如是，盡法界、虛空界，十方三世……一一塵中有世界海微塵數佛剎……」——**重重无尽**之长串。\n- 六十：「普賢菩薩於此世界三昧正受，盡法界、虛空界等一切佛剎亦復如是。」——**唯「亦復如是」一句摄之，无尘刹之繁列**。\n\n**段② 口加·同赞**：\n\n> **八十**：「彼諸如來**同聲**讚言：『善哉！善哉！善男子！汝能入此一切諸佛毘盧遮那如來藏身菩薩三昧。佛子！**此是十方一切諸佛共加於汝**，以毘盧遮那如來本願力故，亦以汝修一切諸佛行願力故。』」\n> **六十**：「彼諸如來**各各**讚言：『善哉！善哉！善男子！汝乃能入此三昧正受，**是皆盧舍那佛本願力故**。又汝於諸佛所，清淨行願力故。』」\n\n〔异〕①「同聲」／「各各」。②八十有「**此是十方一切諸佛共加於汝**」句，六十**无**。③佛号：八十「**毘盧遮那**如來」／六十「**盧舍那**佛」（同名异译，§4.2′）。④八十「汝能入此一切諸佛毗卢遮那如来藏身菩萨三昧」／六十「汝乃能入此三昧正受」（六十省略定名重举）。\n\n**段③ 口加·所为（十一句 vs 十句）**：\n\n| # | 八十（11 句） | 六十（10 句） |\n|---|--------------|--------------|\n| 1 | 能轉一切佛法輪 | 轉一切諸佛法輪 |\n| 2 | 開顯一切如來智慧海 | 開一切如來智慧海 |\n| 3 | 普照十方諸安立海，悉無餘 | 盡度一切諸法方便及十方海悉無餘 |\n| 4 | 令一切眾生淨治雜染，得清淨 | 除一切眾生煩惱得清淨 |\n| 5 | 普攝一切諸大國土，無所著 | 能到一切諸佛國土無障礙 |\n| 6 | 深入一切諸佛境界，無障礙 | 入一切諸佛境界無礙 |\n| 7 | 普示一切佛功德 | 一切諸佛普門功德滿足 |\n| 8 | 能入一切諸法實相，增智慧 | 入一切法方便深樂一切智 |\n| 9 | 觀察一切諸法門 | 方便觀察一切世間法 |\n| 10 | 了知一切眾生根 | 知一切眾生諸根海 |\n| 11 | 能持一切諸佛如來教文海 | —（六十无） |\n\n〔异〕**八十 11 句／六十 10 句**：二本次序大体平行（1、2 全同，6、10 近同），唯第 3–9 句及末句用字、分合有别；八十多「能持一切諸佛如來教文海」一句。\n\n**段④ 意加·与智（十智 vs 十一智）**：\n\n| # | 八十（10 智） | 六十（11 智） |\n|---|--------------|--------------|\n| 1 | 能入一切智性力智 | 入一切智力 |\n| 2 | 入法界無邊量智 | 入無量無邊法界智 |\n| 3 | 成就一切佛境界智 | 能詣三世諸佛所智 |\n| 4 | 知一切世界海成壞智 | 一切世界海成壞智 |\n| 5 | 知一切眾生界廣大智 | 入無量眾生界智 |\n| 6 | 住諸佛甚深解脫無差別諸三昧智 | 佛甚深法門智 |\n| 7 | 入一切菩薩諸根海智 | 一切不壞三昧住智 |\n| 8 | 知一切眾生語言海轉法輪辭辯智 | 入一切菩薩諸根海智 |\n| 9 | 普入法界一切世界海身智 | 一切眾生語言海轉法輪辭辯智 |\n| 10 | 得一切佛音聲智 | 一身遍滿一切世界智 |\n| 11 | —（八十无） | 一切諸佛音聲智 |\n\n〔异〕**八十 10 智／六十 11 智**：唯第 1、4、8 三处近同；六十多「能詣三世諸佛所智」等，故数异（10／11）。此「**十／十一**」之数为二本实点之别〔本文实测〕。\n\n**段⑤ 身加·摩顶**：\n\n- 八十：「十方諸佛『各**舒**右手，摩普賢菩薩頂』；其手相好莊嚴、妙網光舒、香流焰發，復出妙音、現神通，遇未現三世普賢願海、如來法輪、三世佛影像『皆於中現』。」\n- 六十：「十方諸佛**各申右手，摩普賢菩薩頂**；爾時，一切菩薩見十方諸佛各申右手，摩普賢菩薩頂已，彼諸菩薩一心恭敬觀察普賢菩薩，即時同聲以偈頌曰：」\n\n〔异〕①「**舒**」／「**申**」。②八十摩顶处**有**「相好庄严·妙网光舒·香流焰发……三世影像皆于中现」一长串，六十**无**（六十简）。③六十紧接「**一切菩萨同声以偈颂曰**」，八十此处**并无颂**（见段⑨）。\n\n**段⑥ 起定**：\n\n- 八十：「即從是三昧而起。從此三昧起時，**即從一切世界海微塵數三昧海門起。所謂：從知三世念念無差別善巧智三昧門起……**（具名九门）」。\n- 六十：「**從彼三昧起，從世界微塵等三昧起，念念中不壞方便智一切三世三昧起**；」——**无九门之目**。\n\n〔异〕八十起定分**具列九三昧门**（末以「如是等」摄余）；六十唯「世界微尘等三昧」「念念中不坏方便智一切三世三昧」两句概括。**八十富、六十简**。\n\n**段⑥′ 起定成益（诸菩萨所得海云，九 vs 三）**：\n\n- 八十：「其諸菩薩一一各得世界海微塵數**三昧海雲、陀羅尼海雲、諸法方便海雲、辯才門海雲、修行海雲、普照法界一切如來功德藏智光明海雲、一切如來諸力智慧無差別方便海雲、一切如來一一毛孔中各現眾剎海雲、一一菩薩示現從兜率天宮沒下生成佛轉正法輪般涅槃等海雲**」（九种）。\n- 六十：「時，彼一切諸菩薩眾，一一皆得世界塵數諸三昧、世界塵數**方便法海、方便辯海、諸行願海**」（三种）。\n\n**段⑦ 作证·雨云（十名 vs 七名）**：\n\n| 序 | 八十·雨十種大**摩尼王雲**（10 名） | 六十·雨十種**寶王雲**（7 名） |\n|----|-----------------------------------|------------------------------|\n| 1 | 妙金星幢摩尼王雲 | 勝金色幢寶王雲 |\n| 2 | 光明照耀摩尼王雲 | 佛光明照寶王雲 |\n| 3 | 寶輪垂下摩尼王雲 | 金蓮華寶王雲 |\n| 4 | 眾寶藏現菩薩像摩尼王雲 | 菩薩辯才光明寶王雲 |\n| 5 | 稱揚佛名摩尼王雲 | 一切妙音眾寶王雲 |\n| 6 | 光明熾盛普照一切佛剎道場摩尼王雲 | 莊嚴佛土道場寶王雲 |\n| 7 | 光照十方種種變化摩尼王雲 | 一切菩薩無量功德光明輪妙音寶王雲 |\n| 8 | 稱讚一切菩薩功德摩尼王雲 | — |\n| 9 | 如日光熾盛摩尼王雲 | — |\n| 10 | 悅意樂音周聞十方摩尼王雲 | — |\n\n〔异〕①动相：八十「**悉皆微動**」／六十「**六種震動**」。②云名：八十「大**摩尼王**雲」（十名具列）／六十「**寶王**雲」（**标十而具名七**——`T09n0278` 底本如此，如实记，与八十之十名无一对全同）。③八十另有「一一世界眾寶莊嚴，及出妙音演說諸法」句，六十作「一切眾生安隱悅樂，一切眾寶種種莊嚴」。\n\n**段⑧ 光中颂·句式（七言 vs 四言）**：\n\n- 八十：「**普賢遍住於諸剎，坐寶蓮華眾所觀**，一切神通靡不現，無量三昧皆能入。……」（**七言**，十偈）。\n- 六十：「**普賢悉在，一切佛剎，坐寶蓮華，師子座上**。如是示現，遍一切界，普入無量，無邊諸行。……」（**四言**）。\n\n〔异〕**句式大异**：八十光中颂**七言**、六十光中颂**四言**——**同源而体裁别**（此为二本偈颂体裁之显著差异，全篇仅此光中颂见之）。\n\n**段⑨ 众赞颂·位置（结构大异）**：\n\n- 八十：众赞颂（「從諸佛法而出生……」十偈）在**品末**（起定·作证·光赞之后），为「**大众偈请分**」，末二偈**请转法轮**。\n- 六十：菩萨「**即時同聲以偈頌曰**」（「於諸佛所修善法……」十偈）在**身加摩顶之后、起定之前**。\n\n〔异〕**同一众赞颂，位置前后大挪**（八十在品末／六十在品中）。**此为本品与六十本结构之最大分别之一。**\n\n**段⑩ 观察十海普告·位置（分品之别）**：\n\n- 八十：「遍觀察一切世界海……普告一切道場眾海諸菩薩言」——在**第四品《世界成就品》品首**（§3.2）。\n- 六十：「承佛神力，觀察一切諸世界海、一切眾生海、法界業海、一切眾生欲樂諸根海、一切三世諸佛海已，普告菩薩大眾海言——」——在**本品段内**（起定之前）。\n\n〔异〕八十以此段**另立《世界成就品》**；六十则**并入本品段内**（分品之别）。故六十本无「世界成就品」之独立起讫。\n\n### 6.3 定名对照（八十／六十／梵）\n\n| 本 | 定名 | 依据 |\n|----|------|------|\n| 八十（唐译） | **一切諸佛毘盧遮那如來藏身**（三昧） | `T10n0279` 卷七 |\n| 六十（晋译） | **一切如來淨藏**（三昧正受） | `T09n0278` 卷三 |\n| 梵（据法藏之汉梵对照） | **毘盧遮那藏**（Vairocana-garbha） | `T1733`「以此明淨，梵本名為毘盧遮那藏」 |\n\n〔辨〕法藏既以六十之「**淨（藏）**」对梵「**毘盧遮那藏**」，则八十之「**毘盧遮那如來藏身**」与六十之「**一切如來淨藏**」**异名而同指**（§4.2）。**并列存之，不据一本改另一本**（凡例七）。\n\n### 6.4 梵藏对应\n\n- **梵题**：澄观「**若準梵本普賢三昧威德神變品。威德神變皆定之用。攝用從體。但云三昧也**」（`T1735`）——梵题作「普贤三昧威德神变品」〔T1·据疏转述，非亲见梵本〕。\n- **藏译（Toh 44）**：对应品名与分章〔待核〕（参第二部 §6.4 之藏译品目考）。〔L.210 订正〕德格本已入库（L.200）；**藏 3 开篇实测**「ཀུན་ཏུ་བཟང་པོ」（普贤）于佛前，与本品开篇相应〔对应判读〔本文判断〕·逐字对勘未作〕。\n- 〔**不臆断**〕本经梵本缺，凡未回源之梵／藏拟题，一律〔待核〕。\n\n### 6.5 异文要点（节级汇要·不强求逐字对齐）\n\n1. **同声／各各**（口加动词·§段②）。\n2. **「共加」句有无**：八十有「此是十方一切諸佛共加於汝」／六十无。\n3. **口加所为**：八十 11 句／六十 10 句。\n4. **意加**：八十 10 智／六十 11 智。\n5. **摩顶段**：八十有手相/光明/影像一串／六十简（「各申右手，摩普賢菩薩頂」）。「舒」／「申」。\n6. **起定**：八十具列九三昧门／六十唯二句概括。\n7. **起定成益**：八十九种海云／六十三种。\n8. **作证**：「微動」／「六種震動」；「大摩尼王雲」十名／「寶王雲」标十具七。\n9. **光中颂**：八十七言／六十四言。\n10. **众赞颂位置**：八十品末／六十品中（摩顶后）。\n11. **观察十海普告位置**：八十第四品品首／六十本品段内（起定前）——**分品之别**。\n\n### 6.6 由对读所得之结构判断\n\n> **〔本文判断〕** 八十与六十之差异，**非「义理」之别，而系「分品、次第、体裁、繁简」之别**：\n> ①**分品**：八十以此段内容分出《普贤三昧品》（本品）与《世界成就品》（第四品）；六十并之为〈卢舍那佛品〉之一段，**无独立品名**。\n> ②**次第**：众赞颂（六十在前·摩顶后／八十在末）；观察十海普告（六十在本品段内／八十在第四品品首）。\n> ③**体裁**：光中颂七言／四言。\n> ④**繁简**：八十繁（九门、九海云、十云、重重无尽长串），六十简（二句、三海、七云）。\n>\n> 故**本品（第三品）之独立，乃八十本（唐译）之科判安排**，非六十本所具。此点与「本品为卷七前半」之范围判（§1.3）互为表里：**读八十本品，宜知六十本原无此独立品段**。\n\n### 6.7 六十全本复验·本机两源自歧（本品三段）【P3·2026-10-24】\n\n> **〔勘误·P1 批 2026-10-24——本节三处「全本脱／乱」原判定作废〕** 下记三串（「是皆盧舍那佛本願力故」・「各申右手摩普賢菩薩頂」・「觀察一切諸世界海」）已由后续第一部批次以**修正后的 CBETA TEI 平文器**逐串复验：旧器跳过 `<anchor>`／`<note>` 行内元素时丢弃其 `tai 4.2）。\n\n| 视角 | 方法 | 本品读数 |\n|------|------|---------|\n| L1 语言统计 | 剥校勘 CJK 字频／独字／熵／Zipf | **1,995 字（含品题 7·正文净 1,988）／306 独字；熵 7.1185 bit；Zipf −1.1429**；高频字：一(95)·切(70)·海(54)·佛(52)·如(45)·諸(45)·界(45)·普(39)·三(39)·世(35)·昧(32)·法(32) |\n| L2 代数·组合 | 集合·共享语素·映射（见下） | 三同构集：**九三昧门／九海云／十摩尼王云**（共享词尾）；**门→云非双射** |\n| L3 拓扑 | 加持图·状态机·非双射关联（7.4.1） | **以普贤为中心之双向星图**；**定⇄起状态机**；门→云为**非双射关联图** |\n| L4 几何 | 含摄·自似（7.4.2） | **如来藏身＝点含全体**；云之重叠；自似（品四几何之雏形） |\n\n〔**本文判断**〕本品高频字以「**一切／海／佛／如／諸界／普／三世／三昧／法**」为核——**「海」54 见、「三昧」29 见（「昧」单字 32 见）**，正合本品「以定（三昧）摄海（重重无尽）」之旨；「一切」95 见冠首，见华严「**一切**」之总相用语。熵 7.1185（低于第二部 7.5454）系篇幅较小之自然结果，**不可径作风格判据**。\n\n**L2 代数·组合（实测·可复算）**——本品之数法，可归**三个「共享词尾」之同构集**：\n\n| 集 | 基数 | 共享语素 | 元素（据 §2.4／§2.5） |\n|----|------|---------|---------------------|\n| A＝三昧门 | **9** | 词尾「**三昧門**」（9/9） | 知三世念念无差别善巧智／知三世一切法界所有微尘／现三世一切佛刹／现一切众生舍宅／知一切众生心海／知一切众生各别名字／知十方法界处所各差别／知一切微尘中各有无边广大佛身云／演说一切法理趣海 |\n| B＝海云 | **9** | 词尾「**海雲**」（9/9） | 三昧／陀罗尼／诸法方便／辩才门／修行／普照法界一切如来功德藏智光明／一切如来诸力智慧无差别方便／一切如来一一毛孔中各现众刹／一一菩萨示现从兜率天宫没下生成佛转正法轮般涅槃等 |\n| C＝摩尼王云 | **10** | 词尾「**摩尼王雲**」（10/10） | 妙金星幢／光明照耀／宝轮垂下／众宝藏现菩萨像／称扬佛名／光明炽盛普照一切佛刹道场／光照十方种种变化／称赞一切菩萨功德／如日光炽盛／悦意乐音周闻十方 |\n\n〔组合观察〕\n1. **集合基数**：|A|＝|B|＝**9**、|C|＝**10**。三者**同以「世界海微尘数」为量**（经云「如此世界中……如是，一切世界海……」），故 9、10 皆**「略举其数、表无尽」之数法**，非实数上限。\n2. **映射**：|A|＝|B| 而 **A→B 非一一双射**（门与云次第不齐，§2.4）——故**不可套「门＝云」之配**。此与第一品「组组有门、门偈相当」之体例迥异（§7.3）。\n3. **「十」之归**：偈颂两层各 **10**、摩尼王云 **10**，而「九」者唯 A、B 二集（九位／九数）——**本品以「十」为圆满之归、「九」为「十」之近数**（九进位十，示「如是等」之无尽）。\n\n〔**本文判断**〕L2 之要，在见本品数法之**「同构集＋非双射」结构**：**三集皆以共享词尾成一类数法**（三昧门／海云／摩尼王云各成一阶），而**门与云之映射不齐**，正表「**入定—起定**」之**非机械对配**（起定非逐门对云，而是「一出一切出」之总起）。此与澄观「数异／利益异」之「六异」判相印（§2.4′）。\n\n#### 7.4.1 L3 拓扑：加持图·状态机·非双射关联（本批新增）\n\n**(一) 图元实测（据经·可复算）**：\n\n| 图元 | 见数 | 结构义 |\n|------|------|--------|\n| 「一切」 | **68** | 遍摄量化（一切诸佛／一切世界海） |\n| 「一一」 | **12** | 全称量化（一一普贤／一一毛孔） |\n| 「諸佛」／「佛」 | **21／52** | 加持之源 |\n| 「現」／「入」／「起」 | **20／16／15** | 动作边（现·入·起） |\n| 「塵」／「微塵」 | **27／19** | 量化之量（微尘数） |\n| 「如是等」 | **1** | 摄余（九门九云之省略代表） |\n\n**(二) 加持图（双向星图）**：\n\n- **顶点**：{诸佛（微尘数）}, 普贤, {菩萨众（微尘数）}, 众生。\n- **边**：\n  - 诸佛 →(口加·意加·身加) 普贤：**多对一**（微尘数佛同加一普贤）→ **星形收敛（fan-in）**；\n  - 普贤 →(起定·现身·说) 众生·菩萨：**一对多** → **星形发散（fan-out）**。\n- **结构**：以**普贤为中心节点（hub）**之**双向星图**；直径 ≤ 2；连通；「一一普贤皆现」→ 中心亦各各遍现。\n- **状态机**：普贤之「**定（入）⇄ 起（出）**」（「從三昧起」）——一节点、二状态、可切换。\n\n**(三) 非双射关联（连上 L2）**：L2 得三同构集（九三昧门／九海云／十摩尼王云）且 **门→云非双射**。拓扑上：门（入定所出）与云（起定所成）之间为**非双射之关联**——**多值、非可逆**，正表「**一出一切出、非逐门对云**」之总起（§2.4）。故其结构应作**关联图（incidence）**而非**同构映射**。\n\n**(四) L3 结论**：本品拓扑＝「**以普贤为中心之双向星图（加持）＋ 定⇄起状态机 ＋ 门—云非双射关联**」。与第四品「尘刹完全二部图」相对：**三品之拓扑以「行」之中心（普贤）为纽**，**四品之拓扑以「境」之全互入为网**——「中心」与「网络」，正「行」与「境」之分。\n\n〔限〕拓扑模型为**形式刻画**〔本文判断〕；「星图／状态机」为**结构类比**之术语，非谓普贤实为一图论节点。\n\n#### 7.4.2 L4 几何：藏身含摄·自似（品四之雏形·本批新增）\n\n本品之几何性**弱于第四品**（本品重在「定」之状态，非「海」之空间）。据经与注疏：\n\n| 几何测元 | 出处 | 几何义 |\n|---------|------|--------|\n| 「一切諸佛毗盧遮那如來藏身」（三昧名） | 本品·§2.1 | **点含全体**（普贤之定含藏一切诸佛） |\n| 「海云」「摩尼王云」 | 本品·§2.4–2.5 | 云之**重叠**（层次堆叠） |\n| 「一一毛孔」「一一身分」出一切 | 本品·§2.3 | **自似**（部分≅全体） |\n\n〔**注疏印证**〕法藏《探玄记》云「**如一尘含十方**」（`T1733`），又释「广容」云「于己身**不坏小相而广容**」（`T1733`）；澄观《演义钞》云「今**一尘如法界之包含，故即是广容**」（`T1736`）。\n\n〔**本文判断**〕：\n- 「**如来藏身**」＝**含摄之几何**——一点（藏）摄全体（诸佛），与第四品「一尘含刹海」同型，然本品**未及空间之铺陈**（无「尘刹相入」之网状）。\n- 故**品三之「藏身」＝品四「世界海」之因位（行）对应**，其几何为「**点含全体**」之雏形；至第四品乃成「**不可欧氏嵌入·自似嵌套**」之全幅（参第四部 §7.4）。\n- 〔限〕本品 L4 为**前形**，形式模型从简；完整几何论证在第四部。\n\n**(结论)** 品三几何＝「**藏身含摄（点含全体）＋ 云之重叠 ＋ 自似**」，为品四「重重无尽」几何之**行门前雏形**。标〔本文判断·类比〕。\n\n---\n\n## 八、附录（十一类）\n\n### 附录一·计数比勘（三昧门／海云／摩尼王云／偈颂）\n\n| 项 | 数 | 备注 |\n|---|----|------|\n| 三昧门 | 9 | 起定分：具名九，末以「如是等」摄余（§2.4） |\n| 海云 | 9 | 起定成益：诸菩萨各得九种海云（§2.4） |\n| 摩尼王云 | 10 | 作证分：普雨十種大摩尼王雲（§2.5） |\n| 偈颂 | 20 | 2 组×10：光中颂十＋众赞颂十（§2.6） |\n| 「解脫門」 | 0 | 与第一品笔法异（§7.3） |\n| 「爾時」 | 6 | 本品见 6 次（实测 §7.1） |\n\n### 附录二·名相表（定名·异译）\n\n| 名相 | 释义 | 出处 | 信度 |\n|------|------|------|------|\n| 莲华藏师子之座 | 说主所坐，表所入三昧自性无染 | §2.1 | T0 |\n| 一切诸佛毗卢遮那如来藏身（八十） | 定名 | §2.1、§4.2 | T0 |\n| 一切如来净藏（六十） | 定名（异译） | §6.3 | T1 |\n| 毗卢遮那藏（梵据法藏） | 梵对照 | §6.3 | T1〔待核〕 |\n| 海云·摩尼王云 | 喻深广重重、如意宝珠之云 | §2.4–§2.5 | T0 |\n\n### 附录三·版本校勘（三译要点）\n\n- 八十 `T10n0279` 卷七（本品）\n- 六 // ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');

  if(block){

function _applyArticleENMode(){
