var ARTICLE = {"id": "piluzhena", "file": "articles/piluzhena.html", "title": "九九华严第六品 毗卢遮那品之拼读", "title_sub": "华严经第六品·按品精读·本事之时处（九层收敛）·大威光太子历事四佛（一切功德山须弥胜云—波罗蜜善眼庄严王—最胜功德海—名称普闻莲华眼幢）·六位身份变迁·十法门与智光明·八十与六十对读（含约二十名对勘）·注疏三家会读（澄观·法藏·李通玄）·数据层L1-L4·未完备已标明", "icon": "📖", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第一会_菩提场_所信因果周/华严经细读_第六部_毗卢遮那品.md", "doc_md": "# 九九华严第六品 毗卢遮那品之拼读\n\n> **底本**：唐·实叉难陀译《大方广佛华严经》（八十华严）`T10n0279`。**范围：卷第十一（本品全文，一品一卷）**；卷第八至卷十《华藏世界品第五》为前接、卷第十二《如来名号品第七》为后接（见 §三）。**凡例**：本系列每篇标题（YAML `title`）一律以「**之拼读**」为后缀，与第一至第五部一致。\n> **立稿**：2026-10-17。承第一部《世主妙严品》、第二部《如來現相品》、第三部《普贤三昧品》、第四部《世界成就品》、第五部《华藏世界品》之体例与校勘纪律。\n> **本篇进度（覆盖率自陈）**：**全稿成篇**——§〇 凡例、§一 概述与品题解义（1.1–1.7）、§二 全文逐段与逐颂细读（2.0 结构表＋2.1–2.10；**长行 23 段逐段全引**、**偈颂 7 群 73 颂按群疏解、群内择要出颂**）、§三 旁参与前接、§四 义理要点与名相（4.1–4.6）、§五 注疏选要·诸家会读（5.1–5.4，含 5.2′智俨／5.2″慧苑）、§六 文本对读与校勘（八十／六十，6.1–6.7；**含「六十卷四约二十名对勘」本批交付**）、§七 结构分析·数据层（7.1–7.6；L1–L4 四视角皆已成）、§八 附录十一类、§九 台账，**皆已成**。凡未能确证者标〔待核〕、属推断者标〔本文判断〕；**不以骨架冒充细读**。梵藏对勘、图像文物等未竟之点俱入 §八·附录四台账、§九台账。\n> **原则**：沿用前五部之校勘纪律、三层疏解（疏解／名相／会读）、存疑必标、推断必标「〔本文判断〕」、讲者之说疑误只标不改、三译主从分明、不擅改经文、可回源可复核。\n\n---\n\n## 〇、凡例（简要）\n\n一、**校勘底本**：以 `T10n0279` 为底本。六十华严（`T09n0278`）、四十华严（`T10n0293`）不作底本，但须品读并作对读；凡异译异说并列而不强断。\n\n二、**品读主从**：以八十华严为叙事主轴，六十为辅读与对读。主从仅指骨架取自何本，非谓其余可略。**本品之六十对读尤为要紧**——六十本无独立〈毗卢遮那品〉，其本事并入〈盧舍那佛品第二〉，且**主人名作「普莊嚴童子」**（非「大威光」），详见 §6.2。\n\n三、**疏解三层**：其下「疏解」为依经文直解；「名相」为训释与梵汉（凡无把握者标〔待核〕）；「会读」为注疏家与讲记等之判，非经证，凡引皆逐字回源。\n\n四、**引文可回源**：凡引经皆照 CBETA 底本原字形（繁体·异体），可回源可复核；凡引注疏皆注明经号与段落，无把握者标〔待核〕。**本篇体例：引文（经文及注疏原文）一律用繁体照底本；疏解行文、科判标目用简体。** **不擅改经文，亦不据听录回改底本。**\n\n五、**存疑必标**：凡未能确证者标〔待核〕；凡属本席推断者标「〔本文判断〕」；凡讲者之说疑误者只标不改。\n\n六、**文本现象与信度**：凡经文有缺文、增补、版本分合之别者，如实标识并系以文献/法义说明，给信度评级（见 §1.5）；**无从确证者只标〔疑阙〕／〔待核〕，不升级为断言**。\n\n七、**版本差异之惯例**：凡藏译、梵本、六十／四十华严与本品的分品、用字、文段有无、内容增减之别，**悉举而比之**，注版本与信度；**严禁以「藏译云」冒充未见之原文**。\n\n八、**计数口径**：字数以剥校勘之 CJK 口径计（含品题；本品尚含卷末卷首题，另注）；句数以句末标点（。！？）计；偈颂以底本 `<l>` 行计，**两行（＝4 句）为一颂**（与李通玄「两行为一颂」之说合）。\n\n九、**本品多字连写之计数法**：CBETA 底本 XML 为排版之便，于 `<lb>` 行末常有换行，故经文文字间有空白与换行（如「一切功德山須彌\\n勝雲」）。凡计「佛號」等多字连语，**须先压除一切空白**，否则少计。此为本品数据层之特别口径，见 §7.1。\n\n---\n\n## 一、概述与品题解义\n\n### 1.1 品题释义\n\n**品名**：**毗卢遮那品**（八十华严第六品，唐·实叉难陀译），独占**卷第十一**一卷。**梵题**「毘盧遮那」，法藏《探玄记》释云：\n\n> **「今更勘梵本具言毘盧遮那。盧舍那者此翻名光明照。毘者此云遍。是謂光明遍照也。」**（`T1733` 卷三·盧舍那佛品第二）〔T1·据法藏勘梵本之转述，非本席亲见梵本〕\n\n澄观则径以「光明遍照」释本品之名：\n\n> **「二釋名者。略云光明遍照。廣如前釋。」**（`T1735` 品六科判）\n\n**一名而立二译**：唐译「毘盧遮那」（vairocana，遍照/光明遍照）与旧译「盧舍那」（locana，光明照）本为一佛之二名。法藏辨之最明，且分「光明」与「遍」各为二种：\n\n> **「此中光明有二種。一智光。二身光。智光亦二義。一照法謂真俗雙鑒。二照機謂普應群品。身光亦二種。一是常光謂圓明無礙。二放光謂以光警悟。此中遍者亦二種。一平漫遍無礙普周故。二重重遍如帝網重現故。此二圓融。各全體遍非是分遍。」**（`T1733`）\n\n此「二光二遍」之说，正为读本品之钥匙——本品之中，「光」凡数见：「**佛今出世間，一切所瞻奉**」（颂①）、「**見佛光明**」（P8）、「**眉間放大光明，其光名：發起一切善根音**」（P7）、「**光明所照咸歡喜**」（颂⑤）——皆「光明」之落实；而「**如於此清淨光明香水海……其勝音世界，有六十八千億須彌山頂，悉亦於彼現身而坐**」（P7），则「平漫遍」与「重重遍」之经证〔本文判断〕。\n\n**品以果名而实说因**：本品之名取自果位之佛（毘盧遮那），而其内容实叙此佛往昔之本因（大威光太子历事四佛）。澄观释此命名之由：\n\n> **「因是果因故標果稱。又不以人取法知是誰因。前品初言。毘盧遮那曠劫修因之所嚴淨。今方顯其事。」**（`T1735`）\n\n故本品之「釋名」，当合「**毘盧遮那＝光明遍照**」与「**标果称以说因**」二义而观。\n\n### 1.2 品位与脉络（承上启下·辩果之因）\n\n**在八十华严三十九品中之位**：第一会（菩提场会）第六品，占**卷第十一**（一卷）。此为三十九品中少数「一品独占一卷」者（与第二品《如來現相品》品六卷、第三品《普贤三昧品》品三品卷七相类）。\n\n**判位**：清凉澄观判第一会之后三品（世界成就·华藏世界·毗卢遮那）属「**正陈法海分**」，且三品再分：\n\n> **「三品正陳法海，於中分二：初二品明果，後一品辯因。」**（`T1735`）\n\n故本品为「**辩因**」之品——前二品（世界成就·华藏世界）明「果」（依报之庄严），本品则辩「**果之因**」。此即澄观所立之**来意**：\n\n> **「初來意者。前明此因之果。今辯前果之因。答前因問故次來也。」**（`T1735` 品六科判）\n\n**宗趣**：澄观云：\n\n> **「三宗趣者。明因廣大為宗。證成前果為趣。」**（`T1735`）\n\n即：**以「因之广大」为宗（本品所明），以「证成前品之果」（华藏依报）为趣（本品所归）**。\n\n**承上启下**：\n- **承第五品（华藏世界品）**：第五品明「华藏庄严世界海」之依报果相，其首段已标「**此華藏莊嚴世界海，是毘盧遮那如來往昔於世界海微塵數劫修菩薩行時……淨修世界海微塵數大願之所嚴淨**」；本品则**实显**此「往昔」之事。\n- **启第七品（如来名号品）**：本品末段大威光「命终生须弥山上寂静宝宫天城，为大天王」，其佛「为说广大方便普门遍照修多罗」——本品以「遍历四佛·闻四经·得无量益」为归；第七品即转入**第二会**，说他方世界如来之名号与四圣谛。\n\n### 1.3 篇幅与结构预览（卷第十一）\n\n**篇幅**（剥校勘 CJK 口径，详 §7.1）：\n\n| 指标 | 数值 |\n|------|------|\n| CJK 字数（含品题 7 字；另含卷末卷首题 22 字） | **4,939** |\n| CJK 净（去品题） | **4,932** |\n| 其中·偈颂 / 长行 | **1,708 / 3,231**（约 35% : 65%） |\n| 句末标点（。！？） | **147** |\n| 长行段（`<p>`） | **23** |\n| 偈组（`<lg>`） | **7** |\n| 偈颂（两行一颂） | **73** |\n| 独字 | **551** |\n\n**篇幅定位**：本品味**中短篇**。对照前五品（剥校勘）：第一部 31,951／第二部 8,119／第三部 1,995／第四部 5,894／第五部 19,098——本品 4,939，与第四部《世界成就品》最近。故**单品独读**（一品一卷）为宜。\n\n**结构**：本品**无「之一／之二／之三」之分**（仅一卷）。依澄观科判，全品分三（详见 §2.0）：\n\n1. **总明本事之时**（P2：二佛剎尘数劫）；\n2. **别显本事之处**（P2–P6：总明刹海 → 别明一刹〈胜音〉 → 的指一方〈香海·华山·山顶林·道场〉）；\n3. **别显时中本事**（P7–P23：总举劫中多佛 → **一一别显·历事四佛**）。\n\n**本事＝历事四佛**（澄观）：\n\n> **「第二正顯本事中歷事四佛。即為四別。第一逢一切功德山須彌勝雲佛。第二波羅蜜善眼莊嚴佛。第三最勝功德海佛。第四名稱普聞蓮華眼幢佛。」**（`T1735`）\n\n**四佛分段之实测**（详 §7.2）：\n\n| 本事段 | 佛号 | CJK | 偈颂 |\n|--------|------|-----|------|\n| 序分（本事之时·处） | —— | 821 | 0 |\n| 第一佛 | 一切功德山須彌勝雲 | 2,426 | 42 |\n| 第二佛 | 波羅蜜善眼莊嚴王 | 1,082 | 20 |\n| 第三佛 | 最勝功德海 | 479 | 11 |\n| 第四佛 | 名稱普聞蓮華眼幢 | 131 | 0 |\n| **合计** | | **4,939** | **73** |\n\n可见本品「**前详后略**」——第一佛占全品之半（2,426／4,939，约 49%），四佛递减（2,426→1,082→479→131）。此与第五品「前详后略、末以长颂总收」之结构相映，然本品末**无总结颂**（见 §1.5）。\n\n### 1.4 核心要义\n\n本品所陈，可一言以蔽之曰「**一位太子、四佛次第、因成于果**」：\n\n1. **一位太子**：**大威光太子**（P8 起）为本品之主人。其为焰光明大城喜见善慧王之子、五百王子之上首（P8）→ 闻法而为**大威光菩萨**（P13）→ 为**大威光童子**（P17）→ 为**大威光王子**（P19）→ 受**转轮王位**（P21）→ 命终生天为**大天王·离垢福德幢**（P23）。一身而历六位，正表**修因之次第**。\n2. **四佛次第**：一切功德山須彌勝雲 → 波羅蜜善眼莊嚴王 → 最勝功德海 → 名稱普聞蓮華眼幢。四佛皆于「**摩尼華枝輪大林**」中成道，以「恒河沙数小劫」为间隔，递相续出。此即**华藏世界海中「佛出差别」之实例**（参第五品所明「世界种」中「佛出多少」一门）。\n3. **因成于果**：大威光于四佛所「**承事供養**」、闻经、得三昧、发菩提心、修普贤行（颂⑦「**以諸願力能圓滿，普賢菩薩一切行**」），终至「**當成佛大功德**」（颂⑥）——此「**当得**」「**当成**」之记，即毘盧遮那之所以成佛。故本品虽名「毘盧遮那」，实为**一篇「成佛之因」的传记**。\n\n**三句总持**：\n- **「今辯前果之因」**（澄观 `T1735`）——本品之骨：以因证果；\n- **「明因廣大為宗，證成前果為趣」**（澄观 `T1735`）——本品之的；\n- **「以諸願力能圓滿，普賢菩薩一切行」**（颂⑦末）——本品之归：因行即普贤行。\n\n### 1.5 经文文本现象与信度标识\n\n本品长行、偈颂皆完整，然有三处文本现象须标：\n\n1. **「经来不尽故无总结」〔信度 A〕**：本品末段（P23）叙大威光「命终生须弥山上寂静宝宫天城，为大天王……时为说广大方便普门遍照修多罗……**獲是益已，從道場出，還歸本處**」而止，**无总结段**。澄观明言其故：\n\n   > **「……經來不盡故無總結。」**（`T1735`）\n\n   李通玄亦云：「**此一品經來文未足。**」（`T1739` 第十五条）——二家同判：**此非义理之缺，乃梵本传来未尽之文献现象**。故如实标注，**不擅补**。\n\n2. **「王子五百」与「二萬五千」之旧本异文〔信度 B〕**：P8 底本作「**王子五百人，大威光為上首**」；澄观见其「别本」（别行本／异本）作「二萬五千」，且判曰：\n\n   > **「王子別本云。二萬五千者。別梵本也。案瓔珞本業經上卷。云十住銅輪寶瓔珞。百福子為眷屬。……銀輪寶瓔珞五百子。金輪一千子。……故知無過二萬子者。……五百銀輪斯為正也。」**（`T1735`）\n\n   即：**八十底本「五百」为澄观所判之正读**（依《瓔珞本业经》银轮王五百子之制）；而「二萬五千」为别梵本之异文。**六十华严正作「二萬五千子」**（`T09n0278` 卷四，见 §6.4）——恰与别梵本合。此为八十／六十／别梵本三系之真实异文，**存异而不改底本**。\n\n3. **异体字照底本**〔信度 A〕：本品底本用字如「**逈極莊嚴**」（逈，同「迥」）、「**恒河沙數**」（恒，旧体）、「**却敵**」（却敵＝城上御敌之台，「却」用古体）、「**踊躍**」等，皆照底本，**不据今体回改**。\n\n又本品偈颂之句读：底本 `<l>` 一行恒含两句（如「**世尊坐道場，清淨大光明**」），**两行（4 句）为一颂**（凡例八）。第七群（LG07）为七言颂，余六群皆五言颂，计数时以 `<l>` 行为准（§7.1）。\n\n### 1.6 版本差异之惯例与本品之版本情况\n\n本品所涉版本差异，大要有四，逐条系以信度：\n\n- **一、分品之别（A）**：**八十本**有独立之〈毘盧遮那品第六〉，占卷第十一一卷；**六十本**（`T09n0278`）**无独立此品**，其本事并入〈**盧舍那佛品第二**〉（六十卷第二末至卷第四，即「盧舍那佛品第二之二／之三」之间），见 §6.1。**四十本**（`T10n0293`）为《入法界品》别译，无本品。\n- **二、主人名之别（A）**：**八十**作「**大威光**（太子／菩萨／童子／王子／转轮圣王）」；**六十**作「**普莊嚴童子**」。此为两本最著之差异（§6.2）。\n- **三、译名之别（A）**：两本之佛名、经名、城名、道场名、莲华名、光名皆有异（如「一切功德山須彌勝雲」／「一切功德本勝須彌山雲」），逐条对照见 §6.2、附录二。\n- **四、详略与偈颂之别（B）**：两本本事之科段大致对应（李通玄之十五条可并读），然**三昧名目**、**偈颂文句**互有详略异同（§6.5、§6.6）。\n\n**藏译、梵本**：本机无藏本、梵本可核，**暂缺（不臆造）**〔待核〕（§8·附录四）。法藏所勘之梵本片段（「具言毘盧遮那」）、澄观所引之别梵本（「二萬五千」），皆据疏转述，非本席亲见〔T1〕。\n\n### 1.7 核心要义小结\n\n本品以「**毘盧遮那＝光明遍照**」为名（法藏二光二遍、澄观略云光明遍照），以「**辩前果之因**」为体（澄观来意），以「**明因广大为宗、证成前果为趣**」为的（澄观宗趣），以一「**大威光太子历事四佛**」之本事为骨，终归「**以諸願力能圓滿，普賢菩薩一切行**」之因行。其法义深处，则**「修因」不离当念**——大威光初「见佛光明」即「**即時證得十種法門**」（P8），初闻经即「**即獲一切功德須彌勝雲佛宿世所集法海光明**」（P13），正显华严「**初发心时便成正觉**」之旨〔本文判断〕，与李通玄「威光闻法获得宿命智力见佛所行往因之事，并自立愿如佛所行」（`T1739`）之说相契。\n\n---\n\n## 二、全文逐段与逐颂细读（毘盧遮那品第六）\n\n> **本篇读法**：本品**长行 23 段逐段全引**（P01–P23），**偈颂 7 群按群疏解、群内择要出颂**（LG01–LG07，共 73 颂）。引文照 `T10n0279` 繁体原字形，疏解用简体。科判标目依澄观《疏》`T1735` 之「三科·四佛」为骨，李通玄《论》`T1739` 之「十五条」为辅。\n\n### 2.0 全品结构总表\n\n**依澄观科判（`T1735`）**：\n\n| 大科 | 细科 | 段落 | 偈颂 | CJK |\n|------|------|------|------|-----|\n| **一·总明本事之时** | 二佛剎尘数劫 | P02（首句） | — | — |\n| **二·别显本事之处** | ① 总明刹海 | P02（「有世界海，名：普門淨光明」） | — | — |\n| | ② 别明一刹（胜音·略无刹种·彰其相·劫名） | P02（「此世界海中，有世界，名：勝音」–P03） | — | — |\n| | ③ 的指一方：「此林东」别明能感居人·「宝华枝轮大林」别显道场严事 | P03–P06 | — | 821 |\n| **三·别显时中本事** | ① 总举劫中多佛 | P07（「最初劫中，有十須彌山微塵數如來」） | — | — |\n| | ② 一一别显·**历事四佛** | P07–P23 | LG01–LG07 | 4,118 |\n\n**「历事四佛」细目**：\n\n| 佛 | 名号 | 段落 | 偈群 | 颂数 | CJK |\n|----|------|------|------|------|-----|\n| 第一 | 一切功德山須彌勝雲 | P07–P16 | LG01–LG04 | 42 | 2,426 |\n| 第二 | 波羅蜜善眼莊嚴王 | P17–P20 | LG05–LG06 | 20 | 1,082 |\n| 第三 | 最勝功德海 | P21–P22 | LG07 | 11 | 479 |\n| 第四 | 名稱普聞蓮華眼幢 | P23 | — | 0 | 131 |\n\n**初佛文六门**（澄观）：总标佛号（「其第一佛，號：一切功德山須彌勝雲」）／先瑞熟机（「一百年前……顯示如來當出於世」）／正显佛兴（「於其道場大蓮華中忽然出現」）／毫光警召（「眉間放大光明，其光名：發起一切善根音」）／当机云集（「一切世間主……悉詣佛所」）／广演法门（P13「說普集一切三世佛自在法修多羅」）。\n\n**当机云集（喜见善慧王）文六门**（澄观）：标名辨统／总辨眷属／威光得益／偈赞如来／父王宣诰／俱行诣佛——即 P08、P09(LG01)、P10–P11(LG02)、P12。\n\n### 2.1 本事之时·本事之处（总明刹海·别明一刹）\n\n**【经文 P01–P02】**\n\n> **「爾時，普賢菩薩復告大眾言：」**（P01）\n\n> **「諸佛子！乃往古世，過世界微塵數劫，復倍是數，有世界海，名：普門淨光明。此世界海中，有世界，名：勝音，依摩尼華網海住，須彌山微塵數世界而為眷屬，其形正圓，其地具有無量莊嚴，三百重眾寶樹輪圍山所共圍遶，一切寶雲而覆其上，清淨無垢，光明照耀，城邑宮殿如須彌山，衣服飲食隨念而至，其劫名曰：種種莊嚴。」**（P02）\n\n**疏解**：\n- **「爾時，普賢菩薩復告大眾言」**——澄观判为「**总明本事之时**」之起点。「復告」之「復」，遥承第五品（华藏世界品末，普贤说偈已竟），显示本品仍以**普贤为说主**。\n- **时间**：**「乃往古世，過世界微塵數劫，復倍是數」**——澄观释：「**今初即二佛剎塵數劫也**」（`T1735`）。即「往古」之远，非「世界海微尘数劫」一词可尽，而「复倍是数」——**二佛刹尘数劫**。\n- **处所·总明刹海**：**「有世界海，名：普門淨光明」**——此为**世界海**（第五品所明「华藏庄严世界海」之外，别举一世界海之名）。\n- **处所·别明一刹**：**「此世界海中，有世界，名：勝音」**——澄观：「**第二此世界海下。別明一剎。略無剎種。剎名勝音者。多佛出世說法音故**」（`T1735`）。**「略无刹种」**——第五品详明「刹种」（世界种）十门，本品则**略过刹种，径说一刹**，此澄观所标之详略。\n- **胜音世界之相**：「依摩尼華網海住」（所依），「須彌山微塵數世界而為眷屬」（眷属），「其形正圓」（形状），「其地具有無量莊嚴，三百重眾寶樹輪圍山所共圍遶」（地严），「一切寶雲而覆其上，清淨無垢，光明照耀」（空严），「城邑宮殿如須彌山」（城严），「衣服飲食隨念而至」（受用）。\n- **劫名**：**「其劫名曰：種種莊嚴」**——澄观：「**後說劫名可知**」（`T1735`）。此劫名与下文「**彼大莊嚴劫中**」（P17）呼应——P17 作「**大莊嚴劫**」，与此处「**種種莊嚴**」异名〔待核·底本自歧，各照底本〕（一说「种」为通名、「大」为美称，盖同一劫之详略异称〔本文判断〕）。\n\n**名相**：\n- **勝音**（*?*）——「多佛出世说法音故」（澄观），取「殊胜法音」义。〔梵对音待核〕\n- **普門淨光明**——「普门」（*samanta-mukha*）与「净光明」合成世界海之名。\n- **摩尼華網海**——依此海而住。摩尼（*maṇi*，宝珠）华网，即宝珠与莲华交织成网之海〔本文判断〕。\n\n### 2.2 胜音世界之香水海·华山·山顶林\n\n**【经文 P03】**\n\n> **「諸佛子！彼勝音世界中，有香水海，名：清淨光明。其海中，有大華須彌山出現，名：華焰普莊嚴幢，十寶欄楯周匝圍遶。於其山上，有一大林，名：摩尼華枝輪；無量華樓閣，無量寶臺觀，周迴布列；無量妙香幢，無量寶山幢，逈極莊嚴；無量寶芬陀利華，處處敷榮；無量香摩尼蓮華網，周匝垂布；樂音和悅，香雲照耀，數各無量，不可紀極；有百萬億那由他城，周匝圍遶：種種眾生，於中止住。」**（P03）\n\n**疏解**：\n- **「彼勝音世界中，有香水海，名：清淨光明」**——澄观判：「**第三諸佛子彼勝音下的指一方。如今娑婆中。別說一四天下也**」（`T1735`）。即：从「一刹」再**的指一方**，如娑婆世界中说一四天下。「此中亦三：初总明感应之处（香海）／二『此林东』下别明能感居人／三『宝华枝轮大林』下别显道场严事」。\n- **「非持种之海，即如今四洲之海耳」**——澄观特别点出：此「香水海」**非**第五品所明「持刹种」之香水海（大香水海），而只是**一四天下中之海**（如娑婆四洲之海）。此辨至关重要——避免以第五品之「香水海」规模误读本品〔本文判断〕。\n- **「其海中，有大華須彌山出現，名：華焰普莊嚴幢，十寶欄楯周匝圍遶」**——香海中出大华山。「华焰普庄严幢」，盖以莲华之焰为体、普严为相之「须弥山」（山幢〕。\n- **「於其山上，有一大林，名：摩尼華枝輪」**——**摩尼華枝輪大林**为本品**本事之总舞台**：四佛皆「於彼摩尼華枝輪大林中而成正覺」（P17、P21、P23）。林之严相：「無量華樓閣，無量寶臺觀，周迴布列；無量妙香幢，無量寶山幢」等。\n- **「逈極莊嚴」**——「逈」同「迥」（远也）。照底本，不改。\n- **「有百萬億那由他城，周匝圍遶：種種眾生，於中止住」**——林中城数。「那由他」（*nayuta*，亿/无量数）。\n\n**名相**：\n- **華焰普莊嚴幢**——「华焰」（莲华之焰）＋「普庄严」（普严）＋「幢」。六十本对应作「**一切功德本勝須彌山雲**」之地（详 §6.2）。〔待核梵〕\n- **摩尼華枝輪**——*maṇi-puṣpa-śākhā-cakra*?〔待核〕。「摩尼华枝」成「轮」，「轮」有圆满、旋转、聚集义〔本文判断〕。\n- **芬陀利**（*puṇḍarīka*，白莲华）、**優鉢羅**（*utpala*，青莲华）、**波頭摩**（*padma*，红莲华）、**拘物頭**（*kumuda*，黄莲华）——四色莲华，见 P04 及 §4.2 名相表。\n\n### 2.3 能感居人（主城焰光明·伴城）\n\n**【经文 P04】**\n\n> **「諸佛子！此林東有一大城，名：焰光明，人王所都，百萬億那由他城周匝圍遶；清淨妙寶所共成立，縱廣各有七千由旬；七寶為廓，樓櫓却敵，悉皆崇麗；七重寶塹，香水盈滿；優鉢羅華、波頭摩華、拘物頭華、芬陀利華，悉是眾寶，處處分布以為嚴飾；寶多羅樹，七重圍遶；宮殿樓閣，悉寶莊嚴；種種妙網，張施其上；塗香散華，芬瑩其中；有百萬億那由他門，悉寶莊嚴；一一門前，各有四十九寶尸羅幢次第行列。」**（P04）\n\n**【经文 P05】**\n\n> **「復有百萬億園林周匝圍遶；其中皆有種種雜香、摩尼樹香，周流普熏；眾鳥和鳴，聽者歡悅。此大城中所有居人，靡不成就業報神足，乘空往來，行同諸天；心有所欲，應念皆至。其城次南，有一天城，名：樹華莊嚴；其次右旋，有大龍城，名曰：究竟；次有夜叉城，名：金剛勝妙幢；次有乾闥婆城，名曰：妙宮；次有阿脩羅城，名曰：寶輪；次有迦樓羅城，名：妙寶莊嚴；次有緊那羅城，名：遊戲快樂；次有摩睺羅城，名：金剛幢；次有梵天王城，名：種種妙莊嚴……。如是等百萬億那由他數。此一一城，各有百萬億那由他樓閣所共圍遶，一一皆有無量莊嚴。」**（P05）\n\n**疏解**：\n- **主城·焰光明**：澄观判「**第二別明能感居人中亦三。初標主伴二城。二釋主城。三釋伴城**」。「**雖有天城以佛出故人城為主**」——虽伴城中有天城，然**佛出人间**，故以「人王所都」之焰光明城为**主城**。\n- **城相**：「縱廣各有七千由旬」——核心度量（详 §7.4）。「七寶為廓，樓櫓却敵」——澄观训：「**城上守禦曰櫓。繞城別築土臺曰却敵**」（`T1735`）。「四九寶尸羅幢」——「尸羅」*śīla*（戒/清凉），此处为宝幢之名〔待核〕。\n- **居人**：「**靡不成就業報神足，乘空往來，行同諸天**」——「业报神足」，依宿业所感之神通足，非修得。「心有所欲，應念皆至」——受用自在。\n- **伴城·九类**：天城（树华庄严）、龙城（究竟）、夜叉城（金刚胜妙幢）、乾闥婆城（妙宫）、阿修羅城（宝轮）、迦樓羅城（妙宝庄严）、緊那羅城（游戏快乐）、摩睺羅城（金刚幢）、梵天王城（种种妙庄严）——**九类众生之居城**，恰应「种种众生，于中止住」（P03）。\n- **「其城次南」至「次有梵天王城」**：澄观判「**三釋伴城。於中先辨城名居類。後此一一下。顯圍繞莊嚴。世界不同安立少異。不可例此也**」——「世界不同安立少异，不可例此」，提示**不可用娑婆之方位套比**。〔本文判断〕此与第五品「十方世界种」之安立异，正显世界安立之别。\n\n**名相**：\n- **業報神足**——依业报所得之神足通（报得通），非加行所成（修得通）。\n- **迦樓羅**（*garuḍa*，金翅鸟）、**緊那羅**（*kiṃnara*，歌神）、**摩睺羅**（*mahoraga*，大蟒神）、**乾闥婆**（*gandharva*，香神）、**阿脩羅**（*asura*）——八部众之六＋天／龙／梵，即本品之「九类城」。\n\n### 2.4 道场庄严（宝华遍照·香摩尼金刚海·华蘂焰轮）\n\n**【经文 P06】**\n\n> **「諸佛子！此寶華枝輪大林之中，有一道場，名：寶華遍照，以眾大寶分布莊嚴，摩尼華輪遍滿開敷，然以香燈，具眾寶色焰雲彌覆，光網普照，諸莊嚴具常出妙寶，一切樂中恒奏雅音，摩尼寶王現菩薩身，種種妙華周遍十方。其道場前，有一大海，名：香摩尼金剛；出大蓮華，名：華蘂焰輪，其華廣大百億由旬，莖、葉、鬚，臺皆是妙寶，十不可說百千億那由他蓮華所共圍遶，常放光明，恒出妙音，周遍十方。」**（P06）\n\n**疏解**：\n- **「此寶華枝輪大林之中，有一道場，名：寶華遍照」**——澄观判「**第三明道場中。先辨場嚴。二其道場前下。明蓮華香海為佛現故**」。道场名**寶華遍照**。\n- **「其道場前，有一大海，名：香摩尼金剛；出大蓮華，名：華蘂焰輪」**——道场前之海与华。此**大莲华**即下文初佛「**於其道場大蓮華中忽然出現**」（P07）之所依。六十本对应作「**寶華莊嚴**」道场、「**華焰具足**」莲华（§6.2）。\n- **「其華廣大百億由旬」**——莲华之量（详 §7.4）；「十不可說百千億那由他蓮華所共圍遶」——「不可说」为数法之一（见 §4.3）。\n\n**结构小结（§2.1–§2.4）**：以上 P01–P06 即澄观「**二·别显本事之处**」之全（含「① 总明刹海／② 别明一刹／③ 的指一方」三级），**无数偈**（本品序分之特色：前六段纯长行）。其「由广至狭」之层层收敛为：\n**世界海（普门净光明）→ 世界（胜音）→ 香水海（清净光明）→ 华山（华焰普庄严幢）→ 山顶林（摩尼华枝轮）→ 主城（焰光明）→ 道场（宝华遍照）→ 大海（香摩尼金刚）→ 大莲华（华蘂焰轮）**。\n此「收敛链」凡九层，正为「**的指**」一义之极致——**从不可说劫、极广刹海，一路指到一城、一场、一华**，即话头落下之处〔本文判断〕。\n\n### 2.5 最初劫多佛·第一佛出现（六门）\n\n**【经文 P07】**\n\n> **「諸佛子！彼勝音世界，最初劫中，有十須彌山微塵數如來出興於世。其第一佛，號：一切功德山須彌勝雲。諸佛子！應知彼佛將出現時，一百年前，此摩尼華枝輪大林中，一切莊嚴周遍清淨。所謂：出不思議寶焰雲，發歎佛功德音，演無數佛音聲；舒光布網，彌覆十方；宮殿樓閣，互相照耀；寶華光明，騰聚成雲；復出妙音，說一切眾生前世所行廣大善根，說三世一切諸佛名號，說諸菩薩所修願行究竟之道，說諸如來轉妙法輪種種言辭。現如是等莊嚴之相，顯示如來當出於世。其世界中，一切諸王見此相故，善根成熟，悉欲見佛，而來道場。爾時，一切功德山須彌勝雲佛，於其道場大蓮華中忽然出現。其身周普等真法界，一切佛剎皆示出生，一切道場悉詣其所；無邊妙色，具足清淨；一切世間，無能映奪；具眾寶相，一一分明，一切宮殿悉現其像；一切眾生咸得目見無邊化佛從其身出，種種色光充滿世界。如於此清淨光明香水海，華焰莊嚴幢須彌頂上，摩尼華枝輪大林中，出現其身，而坐於座；其勝音世界，有六十八千億須彌山頂，悉亦於彼現身而坐。爾時，彼佛即於眉間放大光明，其光名：發起一切善根音，十佛剎微塵數光明而為眷屬，充滿一切十方國土。若有眾生應可調伏，其光照觸，即自開悟，息諸惑熱，裂諸蓋網，摧諸障山，淨諸垢濁，發大信解，生勝善根，永離一切諸難恐怖，滅除一切身心苦惱，起見佛心，趣一切智。時，一切世間主，并其眷屬，無量百千，蒙佛光明所開覺故，悉詣佛所，頭面禮足。」**（P07）\n\n**疏解**：\n- **总举劫中多佛**：**「最初劫中，有十須彌山微塵數如來出興於世」**——澄观：「**先總舉劫中多佛。後其第一下。一一別顯……今初將欲說別。先舉其總。言最初劫者。即種種莊嚴劫也。既云最初。即此後更有大劫。於理無違**」（`T1735`）。此释**「最初」**非「第一劫」，而是「此种种庄严劫中之最初」，「此后更有大劫」，故与「劫海」之无量不相违。\n- **第一佛名**：「**一切功德山須彌勝雲**」——六十本作「**一切功德本勝須彌山雲**」（§6.2）。\n- **先瑞熟机**（澄观第二门）：「**應知彼佛將出現時，一百年前**」——佛出世前一百年，林现种种瑞相：出不思议宝焰云、发叹佛功德音、演无数佛音声、舒光布网、宫殿楼阁互相照耀、宝华光明腾聚成云；复出妙音说四事：**众生前世善根／三世诸佛名号／菩萨所修愿行究竟之道／诸佛转妙法轮种种言辞**。「**现如是等庄严之相，显示如来当出于世**」——此即**「先瑞熟机」**：瑞相之设，为熟众生之机。\n- **正显佛兴**（第三门）：「**於其道場大蓮華中忽然出現**」——佛于道场大莲华中**忽然出现**。\n- **佛身之相**：「其身周普等真法界」「一切佛剎皆示出生，一切道場悉詣其所」「無邊妙色…一切世間無能映奪」「具眾寶相，一一分明」「一切眾生咸得目見無邊化佛從其身出」——此叙**毗卢遮那法界身**之德，正应「**毘盧遮那＝光明遍照**」之释名（§1.1）。\n- **「重重遍」之经证**：「**如於此清淨光明香水海，華焰莊嚴幢須彌頂上，摩尼華枝輪大林中，出現其身，而坐於座；其勝音世界，有六十八千億須彌山頂，悉亦於彼現身而坐**」——**一处现身，六十八千亿须弥山顶同时现身而坐**。此正法藏所云「**重重遍如帝網重現故**」（`T1733`）之经证〔本文判断〕；与第五品「一尘中现一切刹」之「微细相容」相映。\n- **毫光警召**（第四门）：「**眉間放大光明，其光名：發起一切善根音，十佛剎微塵數光明而為眷屬**」——光名**发起一切善根音**。「其光照触，即自开悟，息诸惑热，裂诸盖网，摧诸障山，净诸垢浊，发大信解，生胜善根，永离一切诸难恐怖，灭除一切身心苦恼，起见佛心，趣一切智」——**八句显光用**（开悟→息惑热→裂盖网→摧障山→净垢浊→发信解→生善根→离难灭苦→起见佛心趣一切智）。\n- **当机云集**（第五门）：「**一切世間主，并其眷屬，無量百千，蒙佛光明所開覺故，悉詣佛所，頭面禮足**」——一切世间主蒙光开觉而诣佛。此即下段喜见善慧王等之所由。\n\n**名相**：\n- **發起一切善根音**——光名。「音」者，光中有音（光与音不二），应「光明」之「照机」义（§1.1）。\n- **十須彌山微塵數如來**——「须弥山微尘数」（十须弥山之微尘数），数法之极（§4.3）。\n- **六十八千億須彌山頂**——化身遍坐之处数（§7.4 度量）。\n\n### 2.6 大威光得益（十法门）＋大威光说颂\n\n**【经文 P08】**\n\n> **「諸佛子！彼焰光明大城中，有王，名：喜見善慧，統領百萬億那由他城，夫人、采女三萬七千人，福吉祥為上首；王子五百人，大威光為上首；大威光太子有十千夫人，妙見為上首。爾時，大威光太子見佛光明已，以昔所修善根力故，即時證得十種法門。何謂為十？所謂：證得一切諸佛功德輪三昧，證得一切佛法普門陀羅尼，證得廣大方便藏般若波羅蜜，證得調伏一切眾生大莊嚴大慈，證得普雲音大悲，證得生無邊功德最勝心大喜，證得如實覺悟一切法大捨，證得廣大方便平等藏大神通，證得增長信解力大願，證得普入一切智光明辯才門。」**（P08）\n\n**疏解**：\n- **标名辨统**（当机云集第一门）：「**彼焰光明大城中，有王，名：喜見善慧，統領百萬億那由他城**」——王名**喜见善慧**（六十作「**愛見善慧**」）；统领百万亿那由他城。\n- **总辨眷属**（第二门）：「**夫人、采女三萬七千人，福吉祥為上首；王子五百人，大威光為上首；大威光太子有十千夫人，妙見為上首**」——三层眷属：夫人采女三万七千（福吉祥为首）／王子五百（**大威光为上首**）／大威光太子之夫人十千（妙见为首）。\n  - **校勘**：底本作「**王子五百人**」；澄观所见别本作「二萬五千」，六十本亦作「二萬五千子」，澄观判「**五百銀輪斯為正也**」（详见 §1.5·2、§6.4）。\n  - **六十本之「长幼位次」异**：六十作「**二萬五千子；其第一子名功德勝，次名普莊嚴童子**」——即六十以「功德勝」为第一子、「普莊嚴童子」为**次子**；而八十以「大威光」为五百王子之**上首（第一）**。两本长幼位次之异，为一处真实异译〔本文判断〕（§6.2）。\n- **威光得益**（第三门）：「**大威光太子見佛光明已，以昔所修善根力故，即時證得十種法門**」——**关键**：得益之由有二，一为「**见佛光明**」（外缘），二为「**昔所修善根力**」（内因）。**「即时证得」**——非历劫次第，而是**当念顿证**。\n- **十种法门**（依六度‐三昧组织）：\n\n| # | 法门 | 配属 |\n|---|------|------|\n| 1 | 一切諸佛功德輪三昧 | 三昧 |\n| 2 | 一切佛法普門陀羅尼 | 陀罗尼 |\n| 3 | 廣大方便藏般若波羅蜜 | 般若（第六度） |\n| 4 | 調伏一切眾生大莊嚴大慈 | 慈 |\n| 5 | 普雲音大悲 | 悲 |\n| 6 | 生無邊功德最勝心大喜 | 喜 |\n| 7 | 如實覺悟一切法大捨 | 舍 |\n| 8 | 廣大方便平等藏大神通 | 神通 |\n| 9 | 增長信解力大願 | 愿 |\n| 10 | 普入一切智光明辯才門 | 辩才 |\n\n→ 末为「**普入一切智光明辯才門**」——即下文大威光能说颂之能（颂①「**世尊坐道場，清淨大光明**」正由此「智光明辩才」而说）〔本文判断〕。\n\n**【经文 P09 ＋ 偈群 LG01（10 颂）】**\n\n> **「爾時，大威光太子，獲得如是法光明已，承佛威力，普觀大眾而說頌言：」**（P09）\n\n**LG01 择要出颂**（10 颂，五言）：\n\n> **「『世尊坐道場，清淨大光明，譬如千日出，普照虛空界。**（颂01）\n> **無量億千劫，導師時乃現，佛今出世間，一切所瞻奉。』**（颂02）\n\n> **「『汝觀佛光明，化佛難思議，一切宮殿中，寂然而正受。**（颂03）\n> **汝觀佛神通，毛孔出焰雲，照耀於世間，光明無有盡。』**（颂04）\n\n> **「『我當如世尊，廣淨諸剎海，以佛威神力，修習菩提行。』」**〔此句为 LG03·颂10，此处先标「发愿」纲目，见 §2.8〕\n\n**疏解**：\n- **说颂之由**：「**獲得如是法光明已，承佛威力**」——**承佛威力**（加被）而说，非自力。此为华严「说偈」之通轨。\n- **颂01**：「**世尊坐道場，清淨大光明，譬如千日出，普照虛空界**」——以「千日」喻佛光明。六十本作「**猶如千日出，虛空靡不照，離垢坐道場，光明亦如是**」（§6.5），语序与用词皆异。\n- **颂02**：「**無量億千劫，導師時乃現，佛今出世間，一切所瞻奉**」——「无量亿千劫」显佛难值；「**佛今出世間**」点出今时之幸，为下「俱行见佛」（P12）之动因。\n- **颂03–04**：劝观佛光明／神通（「化佛难思议」「毛孔出焰云」）。\n- LG01 全 10 颂皆**赞佛光明与神通**，末颂（颂10）「**一切咸恭敬，心生大歡喜，共在世尊前，瞻仰於法王**」以「瞻仰」结——为父王宣诰（LG02）之引。\n\n**名相**：\n- **法光明**——由闻法（或见佛光）所得之慧明；与上文「十种法门」末之「智光明辩才门」相成。\n- **功德輪三昧**——「轮」有圆满、摧碾、运转义；「功德轮」谓具足诸佛功德之三昧。〔梵待核〕\n\n### 2.7 父王宣诰（王说颂）·俱行诣佛\n\n**【经文 P10–P12】**\n\n> **「諸佛子！彼大威光太子說此頌時，以佛神力，其聲普遍勝音世界。」**（P10）\n> **「時，喜見善慧王聞此頌已，心大歡喜，觀諸眷屬而說頌言：」**（P11）\n\n**LG02 择要出颂**（11 颂，五言）：\n\n> **「『汝應速召集，一切諸王眾，王子及大臣，城邑宰官等。**（颂01）\n> **普告諸城內，疾應擊大鼓，共集所有人，俱行往見佛。』**（颂02）\n\n**疏解**：\n- **说颂之声遍界**：「**以佛神力，其聲普遍勝音世界**」——太子一颂，声遍一世界。此与 P19「大威光童子說此頌時，以佛神力，其聲無礙，**一切世界皆悉得聞**」相映，逐佛而**声闻之范围亦扩**（一世界 → 一切世界），正显大威光**位次之升**〔本文判断〕。\n- **父王宣诰**（当机云集第五门）：王闻颂欢喜，「观诸眷属而说颂」。LG02 全 11 颂为一篇「**召集令**」：召集诸王众、王子大臣、城邑宰官；「普告诸城内，疾应击大鼓」；「俱行往见佛」。\n- **会读·李通玄**：「威光说颂……父王闻之欢喜说颂。」（`T1739` 第九条）——李通玄以「父王闻颂欢喜说颂」为一科，与澄观「父王宣诰」同。\n\n**【经文 P12】**\n\n> **「爾時，喜見善慧王，與三萬七千夫人、采女俱，福吉祥為上首；五百王子俱，大威光為上首；六萬大臣俱，慧力為上首……。如是等七十七百千億那由他眾，前後圍遶，從焰光明大城出。以王力故，一切大眾乘空而往，諸供養具遍滿虛空。至於佛所，頂禮佛足，却坐一面。復有妙華城善化幢天王，與十億那由他眷屬俱；復有究竟大城淨光龍王，與二十五億眷屬俱；復有金剛勝幢城猛健夜叉王，與七十七億眷屬俱；復有無垢城喜見乾闥婆王，與九十七億眷屬俱；復有妙輪城淨色思惟阿脩羅王，與五十八億眷屬俱；復有妙莊嚴城十力行迦樓羅王，與九十九千眷屬俱；復有遊戲快樂城金剛德緊那羅王，與十八億眷屬俱；復有金剛幢城寶稱幢摩睺羅伽王，與三億百千那由他眷屬俱；復有淨妙莊嚴城最勝梵王，與十八億眷屬俱……。如是等百萬億那由他大城中，所有諸王，并其眷屬，悉共往詣一切功德須彌勝雲如來所，頂禮佛足，却坐一面。」**（P12）\n\n**疏解**：\n- **俱行诣佛**（第六门）：王与三层眷属（夫人采女三万七千·福吉祥为首／五百王子·大威光为首／六万大臣·慧力为首），共「**七十七百千億那由他眾**」，前後围绕，从城出。\n- **「以王力故，一切大眾乘空而往」**——「王力」者，王之福力（或佛力加被）〔待核〕；大众乘空而往。\n- **九类城主俱集**：与 P05 之九类伴城**一一对应**——妙华城善化幢天王（天）、究竟大城净光龙王（龙）、金刚胜幢城猛健夜叉王（夜叉）、无垢城喜见乾闥婆王（乾闥婆）、妙轮城净色思惟阿脩羅王（阿脩羅）、妙庄严城十力行迦樓羅王（迦樓羅）、游戏快乐城金刚德緊那羅王（緊那羅）、金刚幢城宝称幢摩睺羅伽王（摩睺羅伽）、净妙庄严城最胜梵王（梵）；各与眷属俱。→ **此「九类俱集」正响应 P05「种种众生，于中止住」**：佛出世，九类众生皆来。〔本文判断〕\n  - 各城名与 P05 略异（如 P05「次有乾闥婆城，名曰：妙宮」vs P12「无垢城喜见乾闥婆王」），当属**别举（非同一城，或详略异称）**〔待核〕（底本自歧，各照底本）。\n\n### 2.8 广演法门·大威光获益（十智光明）＋颂 ＋传化众生 ＋佛加赞励\n\n**【经文 P13】**\n\n> **「時，彼如來為欲調伏諸眾生故，於眾會道場海中，說普集一切三世佛自在法修多羅，世界微塵數修多羅而為眷屬，隨眾生心，悉令獲益。是時，大威光菩薩聞是法已，即獲一切功德須彌勝雲佛宿世所集法海光明。所謂：得一切法聚平等三昧智光明，一切法悉入最初菩提心中住智光明，十方法界普光明藏清淨眼智光明，觀察一切佛法大願海智光明，入無邊功德海清淨行智光明，趣向不退轉大力速疾藏智光明，法界中無量變化力出離輪智光明，決定入無量功德圓滿海智光明，了知一切佛決定解莊嚴成就海智光明，了知法界無邊佛現一切眾生前神通海智光明，了知一切佛力、無所畏法智光明。」**（P13）\n\n**疏解**：\n- **广演法门**（初佛第六门）：「**為欲調伏諸眾生故，於眾會道場海中，說普集一切三世佛自在法修多羅，世界微塵數修多羅而為眷屬**」——佛说经，名**普集一切三世佛自在法修多罗**，以世界微尘数修多罗为眷属。六十本作「**說經，名現三世一切諸佛集會**」（§6.2）。\n- **大威光获益**：「**聞是法已，即獲一切功德須彌勝雲佛宿世所集法海光明**」——**「即获」**，顿得。「**宿世所集法海光明**」——即**见佛往昔行海**（与 LG03 颂01「**以是見世尊，往昔所行事**」呼应）。\n- **十一种智光明**（注意：底本作「十一」种，非「十」——「所谓」下凡十一句）：\n\n| # | 智光明 |\n|---|--------|\n| 1 | 一切法聚平等三昧智光明 |\n| 2 | 一切法悉入最初菩提心中住智光明 |\n| 3 | 十方法界普光明藏清淨眼智光明 |\n| 4 | 觀察一切佛法大願海智光明 |\n| 5 | 入無邊功德海清淨行智光明 |\n| 6 | 趣向不退轉大力速疾藏智光明 |\n| 7 | 法界中無量變化力出離輪智光明 |\n| 8 | 決定入無量功德圓滿海智光明 |\n| 9 | 了知一切佛決定解莊嚴成就海智光明 |\n| 10 | 了知法界無邊佛現一切眾生前神通海智光明 |\n| 11 | 了知一切佛力、無所畏法智光明 |\n\n→ 前十句皆「…智光明」，末（11）作「**了知一切佛力、無所畏法智光明**」。**底本实为十一句**，与澄观「十法」之说或有详略之别〔待核〕——**存疑标**，各照底本，不擅改。\n- **会读·李通玄**：「威光闻法获得**宿命智力**，见佛所行往因之事，并**自立愿如佛所行**。」（`T1739`）——切中「十智光明」之要：**见佛往因**（第 1–10）与**立愿如佛**（第 11 及颂10）。\n\n**【经文 P14 ＋ 偈群 LG03（10 颂）】**\n\n> **「爾時，大威光菩薩，得如是無量智光明已，承佛威力而說頌言：」**（P14）\n\n**LG03 择要出颂**（10 颂，五言）：\n\n> **「『我聞佛妙法，而得智光明，以是見世尊，往昔所行事。』**（颂01）\n> **「『普賢大願力，一切佛海中，修行無量行，嚴淨諸剎海。』**（颂07）\n> **「『我當如世尊，廣淨諸剎海，以佛威神力，修習菩提行。』」**（颂10）\n\n**疏解**：\n- **颂01**：「**我聞佛妙法，而得智光明，以是見世尊，往昔所行事**」——闻法→得智光→见佛往昔行。此**三句一链**，与 P13「闻法已，即获…宿世所集法海光明」文义互证，即李通玄所云「**闻法获得宿命智力，见佛所行往因之事**」。\n- **颂03–07**：「**往昔諸佛所，一切皆承事，無量劫修行，嚴淨諸剎海**」（颂03）……「**捨施於自身，廣大無涯際，修治最勝行，嚴淨諸剎海**」（颂04）「**耳鼻頭手足，及以諸宮殿，捨之無有量，嚴淨諸剎海**」（颂05）「**能於一一剎，億劫不思議，修習菩提行，嚴淨諸剎海**」（颂06）「**普賢大願力，一切佛海中，修行無量行，嚴淨諸剎海**」（颂07）——**五颂皆以「嚴淨諸剎海」结句**，显**「行—净刹」之因果**。其中「耳鼻头手足……舍之无有量」即**舍身行**（内施）。\n- **颂08**：「**如因日光照，還見於日輪，我以佛智光，見佛所行道**」——**以日光喻佛智光**：借佛智光，方能见佛所行道（合「毗卢遮那＝光明遍照」之旨）。\n- **颂10**：「**我當如世尊，廣淨諸剎海，以佛威神力，修習菩提行**」——**自立愿如佛**。此即李通玄所指「**自立愿如佛所行**」，亦本品「修因」之落实。〔本文判断〕以此为 LG03 之归结。\n\n**【经文 P15】**\n\n> **「諸佛子！時，大威光菩薩，以見一切功德山須彌勝雲佛，承事供養故，於如來所心得悟了，為一切世間，顯示如來往昔行海，顯示往昔菩薩行方便，顯示一切佛功德海，顯示普入一切法界清淨智，顯示一切道場中成佛自在力，顯示佛力無畏、無差別智，顯示普示現如來身，顯示不可思議佛神變，顯示莊嚴無量清淨佛土，顯示普賢菩薩所有行願，令如須彌山微塵數眾生發菩提心，佛剎微塵數眾生成就如來清淨國土。」**（P15）\n\n**疏解**：\n- **传化众生**：「**以見一切功德山須彌勝雲佛，承事供養故，於如來所心得悟了，為一切世間，顯示……**」——大威光自悟已，复为世间**显示十法**：①如来往昔行海／②往昔菩萨行方便／③一切佛功德海／④普入一切法界清净智／⑤一切道场中成佛自在力／⑥佛力无畏无差别智／⑦普示现如来身／⑧不可思议佛神变／⑨庄严无量清净佛土／⑩普贤菩萨所有行愿。\n- **化益之量**：「**令如須彌山微塵數眾生發菩提心，佛剎微塵數眾生成就如來清淨國土**」——「须弥山微尘数众生发菩提心」＋「佛刹微尘数众生成就清净国土」，正显**自利利他之广大**（本品味「明因广大为宗」之实证）。\n\n**【经文 P16 ＋ 偈群 LG04（11 颂）】**\n\n> **「爾時，一切功德山須彌勝雲佛，為大威光菩薩而說頌言；」**（P16）\n\n**LG04 择要出颂**（11 颂，五言）：\n\n> **「『善哉大威光，福藏廣名稱，為利眾生故，發趣菩提道。』**（颂01）\n> **「『一一微塵中，無量劫修行，彼人乃能得，莊嚴諸佛剎。』**（颂05）\n> **「『大光供養我，故獲大威力，令塵數眾生，成熟向菩提。』**（颂10）\n> **「『諸修普賢行，大名稱菩薩，莊嚴佛剎海，法界普周遍。』」**（颂11）\n\n**疏解**：\n- **佛加赞励**：佛为大威光说颂，**赞其发心、授其当得**。\n- **颂01**：「**善哉大威光，福藏廣名稱，為利眾生故，發趣菩提道**」——赞其「为利众生故」发菩提心（与 P15「令…众生发菩提心」呼应）。\n- **颂02–03**：「汝获智光明，法界悉充遍，福慧咸广大，**當得深智海**」（颂02）／「一剎中修行，经于剎尘劫，如汝见于我，**當獲如是智**」（颂03）——**「当得」「当获」**：佛为授记之语。\n- **颂05**：「**一一微塵中，無量劫修行，彼人乃能得，莊嚴諸佛剎**」——即华严「**一尘中无量劫**」之「微细相容」〔本文判断〕。\n- **颂06–07**：「为一一众生，轮回经劫海，其心不疲懈，**當成世導師**」（颂06）／「供养一一佛，悉尽未来际，心无暂疲厌，**當成無上道**」（颂07）——**劝其长劫不疲**，并许「当成世导师」「当成无上道」。\n- **颂08**：「**三世一切佛，當共滿汝願，一切佛會中，汝身安住彼**」——三世佛共满其愿。\n- **颂10**：「**大光供養我，故獲大威力，令塵數眾生，成熟向菩提**」——六十本作「**恭敬供養我，普莊嚴大力，令塵數眾生，成熟向菩提**」（§6.5）——「大光」／「普莊嚴」，即两本主人之名（大威光／普庄严）。\n- **颂11**：「**諸修普賢行，大名稱菩薩，莊嚴佛剎海，法界普周遍**」——以**普贤行**结。→ **本品四佛之偈，凡以「普賢行」为归结者三处**（LG03·颂07、LG04·颂11、LG07·颂04/11），可见全品之归趣在「**普贤行愿**」〔本文判断〕。\n\n### 2.9 第二佛（波罗蜜善眼庄严王）\n\n**【经文 P17】**\n\n> **「諸佛子！汝等應知彼大莊嚴劫中，有恒河沙數小劫，人壽命二小劫。諸佛子！彼一切功德須彌勝雲佛，壽命五十億歲。彼佛滅度後，有佛出世，名：波羅蜜善眼莊嚴王，亦於彼摩尼華枝輪大林中而成正覺。爾時，大威光童子，見彼如來成等正覺、現神通力，即得念佛三昧，名：無邊海藏門；即得陀羅尼，名：大智力法淵；即得大慈，名：普隨眾生調伏度脫；即得大悲，名：遍覆一切境界雲；即得大喜，名：一切佛功德海威力藏；即得大捨，名：法性虛空平等清淨；即得般若波羅蜜，名：自性離垢法界清淨身；即得神通，名：無礙光普隨現；即得辯才，名：善入離垢淵；即得智光，名：一切佛法清淨藏。如是等十千法門，皆得通達。」**（P17）\n\n**疏解**：\n- **劫之相**：「**彼大莊嚴劫中，有恒河沙數小劫，人壽命二小劫**」——「大庄严劫」即前「种种庄严劫」（§2.1 注）；劫中有**恒河沙数小劫**；小劫之中，人寿二小劫（「二小劫」之数，详 §7.4）。\n- **第一佛之寿**：「**彼一切功德須彌勝雲佛，壽命五十億歲**」（六十本同作「**五十億歲**」）。→ 佛寿之数。\n- **第二佛出世**：「**彼佛滅度後，有佛出世，名：波羅蜜善眼莊嚴王，亦於彼摩尼華枝輪大林中而成正覺**」——**同一大林**（摩尼华枝轮大林）成正觉。六十本作「**一切度離癡清淨眼王如來**」（§6.2）。\n- **大威光童子之得益**：「**見彼如來成等正覺、現神通力**」，即得**十种法门**（各具名）：\n\n| # | 类别 | 名 |\n|---|------|-----|\n| 1 | 念佛三昧 | 無邊海藏門 |\n| 2 | 陀羅尼 | 大智力法淵 |\n| 3 | 大慈 | 普隨眾生調伏度脫 |\n| 4 | 大悲 | 遍覆一切境界雲 |\n| 5 | 大喜 | 一切佛功德海威力藏 |\n| 6 | 大捨 | 法性虛空平等清淨 |\n| 7 | 般若波羅蜜 | 自性離垢法界清淨身 |\n| 8 | 神通 | 無礙光普隨現 |\n| 9 | 辯才 | 善入離垢淵 |\n| 10 | 智光 | 一切佛法清淨藏 |\n\n- **「如是等十千法門，皆得通達」**——第十佛所得为「十千法门」。→ 注意：**初佛得「十种法门」，此佛得「十千法门」**，数量之增，显位次之升〔本文判断〕。\n- **会读·李通玄**：「**第二佛为威光说颂……所得之益是八地法门。如经云：得灌顶智慧海，名无功用修极妙见**。」（`T1739` 第十三条，指 P19 之第十益）——李通玄以第二佛段之得益判为**八地法门**（灌顶位），此为注疏家之位判，非经证。\n\n**【经文 P18–P20 ＋ 偈群 LG05、LG06】**\n\n> **「爾時，大威光童子，承佛威力，為諸眷屬而說頌言：」**（P18）\n\n**LG05 择要出颂**（10 颂，七言）：\n\n> **「『不可思議億劫中，導世明師難一遇，此土眾生多善利，而今得見第二佛。』**（颂01）\n> **「『發心迴向趣菩提，慈念一切諸眾生，悉住普賢廣大願，當如法王得自在。』」**（颂10）\n\n> **「諸佛子！大威光童子說此頌時，以佛神力，其聲無礙，一切世界皆悉得聞，無量眾生發菩提心。時，大威光王子，與其父母，并諸眷屬，及無量百千億那由他眾生，前後圍遶，寶蓋如雲遍覆虛空，共詣波羅蜜善眼莊嚴王如來所。其佛為說法界體性清淨莊嚴修多羅，世界海微塵等修多羅而為眷屬。彼諸大眾，聞此經已，得清淨智，名：入一切淨方便；得於地，名：離垢光明；得波羅蜜輪，名：示現一切世間愛樂莊嚴；得增廣行輪，名：普入一切剎土無邊光明清淨見；得趣向行輪，名：離垢福德雲光明幢；得隨入證輪，名：一切法海廣大光明：得轉深發趣行，名：大智莊嚴；得灌頂智慧海，名：無功用修極妙見；得顯了大光明，名：如來功德海相光影遍照；得出生願力清淨智，名：無量願力信解藏。」**（P19）\n\n**疏解**：\n- **说颂之声扩**（对比 §2.7）：「**以佛神力，其聲無礙，一切世界皆悉得聞，無量眾生發菩提心**」——初佛时为「遍勝音世界」，此则为「**一切世界皆悉得闻**」。→ **范围之扩（一世界→一切世界）即位次之升**〔本文判断〕。\n- **LG05·颂01**：「**不可思議億劫中，導世明師難一遇，此土眾生多善利，而今得見第二佛**」——「难一遇」显值佛之难；「得见第二佛」点出历事次第（此为**七言**，与 LG01–04 之五言异，故 §7.1 另计）。\n- **LG05·颂10**：「**發心迴向趣菩提，慈念一切諸眾生，悉住普賢廣大願，當如法王得自在**」——以「**普賢廣大願**」结。\n- **俱行诣佛**：「**大威光王子，與其父母，并諸眷屬……共詣波羅蜜善眼莊嚴王如來所**」——此段大威光身份作「**大威光王子**」（P17 作「童子」，此处「王子」）。\n- **第二佛说法**：「**其佛為說法界體性清淨莊嚴修多羅，世界海微塵等修多羅而為眷屬**」——经名**法界体性清净庄严修多罗**（六十作「**一切法界自性離垢莊嚴**」，§6.2）。\n- **闻经得益·十种**（含地、波罗蜜轮、行轮、证轮等）：\n\n| # | 类 | 名 |\n|---|----|----|\n| 1 | 清净智 | 入一切淨方便 |\n| 2 | 地 | 離垢光明 |\n| 3 | 波羅蜜輪 | 示現一切世間愛樂莊嚴 |\n| 4 | 增廣行輪 | 普入一切剎土無邊光明清淨見 |\n| 5 | 趣向行輪 | 離垢福德雲光明幢 |\n| 6 | 隨入證輪 | 一切法海廣大光明 |\n| 7 | 轉深發趣行 | 大智莊嚴 |\n| 8 | 灌頂智慧海 | 無功用修極妙見 |\n| 9 | 顯了大光明 | 如來功德海相光影遍照 |\n| 10 | 出生願力清淨智 | 無量願力信解藏 |\n\n→ 第八「**灌頂智慧海，名：無功用修極妙見**」，即李通玄判为「**八地法门**」之据（§2.9 注）。\n\n> **「時，彼佛為大威光菩薩而說頌言：」**（P20）\n\n**LG06 择要出颂**（10 颂，七言）：\n\n> **「『善哉功德智慧海，發心趣向大菩提，汝當得佛不思議，普為眾生作依處。』**（颂01）\n> **「『汝已出生諸願海，汝已入於三昧海，當具種種大神通，不可思議諸佛法。』**（颂05）\n> **「『諸佛供養盡無餘，國土莊嚴悉清淨，一切劫中修妙行，汝當成佛大功德。』」**（颂10）\n\n**疏解**：\n- **LG06**：佛为授记之颂。「**善哉功德智慧海**」（颂01，赞）／「**汝當得佛不思議，普為眾生作依處**」（授记）／「**汝當成佛大功德**」（颂10，结论）。→ **「當成佛大功德」**为第二佛之授记语。\n\n### 2.10 第三佛（最胜功德海）\n\n**【经文 P21】**\n\n> **「諸佛子！波羅蜜善眼莊嚴王如來入涅槃已，喜見善慧王尋亦去世，大威光童子受轉輪王位。彼摩尼華枝輪大林中第三如來出現於世，名：最勝功德海。時，大威光轉輪聖王，見彼如來成佛之相，與其眷屬，及四兵眾，城邑、聚落一切人民，并持七寶，俱往佛所，以一切香摩尼莊嚴大樓閣奉上於佛。時，彼如來於其林中，說菩薩普眼光明行修多羅，世界微塵數修多羅而為眷屬。爾時，大威光菩薩，聞此法已，得三昧，名：大福德普光明；得此三昧故，悉能了知一切菩薩、一切眾生，過、現、未來，福、非福海。」**（P21）\n\n**疏解**：\n- **二事之世**：第二佛入涅槃，喜见善慧王亦去世——**父王去世**，大威光童子**受转轮王位**。→ 身份由「王子／童子」升为「**转轮圣王**」。\n- **第三佛出世**：「**彼摩尼華枝輪大林中第三如來出現於世，名：最勝功德海**」——**同一大林**，第三佛。\n- **转轮圣王之供**：「**與其眷屬，及四兵眾，城邑、聚落一切人民，并持七寶，俱往佛所，以一切香摩尼莊嚴大樓閣奉上於佛**」——**转轮王以七宝、大楼阁供佛**，此与前二佛之「王／太子」供佛**规模大异**（前为眷属围遶，此为四兵、城邑聚落一切人民）〔本文判断〕。\n- **第三佛说法**：「**說菩薩普眼光明行修多羅**」（六十本作「**一切法界自性離垢莊嚴**」？此处须核，§6.2 待核）。\n- **得益**：「**得三昧，名：大福德普光明；得此三昧故，悉能了知一切菩薩、一切眾生，過、現、未來，福、非福海**」——**得大三昧，能了知三世众生福与非福之海**（业力果报之总相）。\n  - 注意：第三佛段**未列「前十／十千」之数**，而直出「大三昧」一名。→ **详略之递减**（第一佛详列十法门、第二佛列十法门·十千法门、第三佛单出三昧、第四佛单出三昧）〔本文判断〕。\n\n**【经文 P22 ＋ 偈群 LG07（11 颂）】**\n\n> **「時，彼佛為大威光菩薩而說頌言：」**（P22）\n\n**LG07 择要出颂**（11 颂，七言）：\n\n> **「『善哉福德大威光，汝等今來至我所，愍念一切眾生海，發勝菩提大願心。』**（颂01）\n> **「『福德光者福幢者，福德處者福海者，普賢菩薩所有願，是汝大光能趣入。』**（颂04）\n> **「『汝於十方國土中，悉見無量無邊佛，彼佛往昔諸行海，如是一切汝咸見。』**（颂06）\n> **「『汝於一切剎海中，微塵劫海修諸行，一切如來諸行海，汝皆學已當成佛。』**（颂08）\n> **「『無邊國土一一中，悉入修行經劫海，以諸願力能圓滿，普賢菩薩一切行。』」**（颂11）\n\n**疏解**：\n- **LG07·颂01**：「**善哉福德大威光，汝等今來至我所，愍念一切眾生海，發勝菩提大願心**」——赞其「愍念众生」「发胜菩提大愿心」。\n- **颂04**：「**福德光者福幢者，福德處者福海者，普賢菩薩所有願，是汝大光能趣入**」——以四「福」赞之（福德光／福幢／福德处／福海）；「**普賢菩薩所有願，是汝大光能趣入**」——**「大光」即大威光**。\n- **颂06**：「**汝於十方國土中，悉見無量無邊佛，彼佛往昔諸行海，如是一切汝咸見**」——见十方佛之往昔行海。\n- **颂08**：「**汝於一切剎海中，微塵劫海修諸行，一切如來諸行海，汝皆學已當成佛**」——**「皆學已當成佛」**，第三佛之授记。\n- **颂10–11**：「今此道場眾會海，闻汝愿已生欣乐，皆入普贤广大乘，发心回向趣菩提」（颂10）／「**無邊國土一一中，悉入修行經劫海，以諸願力能圓滿，普賢菩薩一切行**」（颂11）——**以「以諸願力能圓滿，普賢菩薩一切行」全品作结**。此句为本品之**归趣语**（§1.4）。\n\n### 2.11 第四佛（名称普闻莲华眼幢）·命终生天\n\n**【经文 P23】**\n\n> **「諸佛子！彼摩尼華枝輪大林中，復有佛出，號：名稱普聞蓮華眼幢。是時，大威光於此命終，生須彌山上寂靜寶宮天城中，為大天王，名：離垢福德幢，共諸天眾俱詣佛所，雨寶華雲以為供養。時，彼如來為說廣大方便普門遍照修多羅，世界海微塵數修多羅而為眷屬。時，天王眾聞此經已，得三昧，名：普門歡喜藏。以三昧力，能入一切法實相海。獲是益已，從道場出，還歸本處。」」**（P23）\n\n**疏解**：\n- **第四佛出世**：「**彼摩尼華枝輪大林中，復有佛出，號：名稱普聞蓮華眼幢**」——**同一大林**，第四佛。登场之人已非大威光，而径称「復有佛出」——**详略之最简**（131 字，无偈）。\n- **大威光命终**：「**是時，大威光於此命終，生須彌山上寂靜寶宮天城中，為大天王，名：離垢福德幢**」——大威光**命终**，生須彌山上寂静宝宫天城，为**大天王**，名**离垢福德幢**。→ 身份由「转轮圣王」→「**大天王**」。\n- **天王供佛**：「**共諸天眾俱詣佛所，雨寶華雲以為供養**」——以宝华云供。\n- **第四佛说法**：「**為說廣大方便普門遍照修多羅**」——经名**广大方便普门遍照修多罗**（六十作「**一切法界自性離垢莊嚴**」？须核，§6.2）。「世界海微尘数修多罗而为眷属」。\n  - **注**：「**普門遍照**」四字，正与「**毘盧遮那＝光明遍照**」呼应——此经之名即佛名之义〔本文判断〕。\n- **天王得益**：「**得三昧，名：普門歡喜藏。以三昧力，能入一切法實相海**」——得三昧**普门欢喜藏**，能入**一切法实相海**。\n- **品末无总结**：「**獲是益已，從道場出，還歸本處**」——即止于此。→ 澄观「**經來不盡故無總結**」、李通玄「**此一品經來文未足**」（§1.5·1）。**本品无「佛说是经已，大众欢喜信受奉行」之通结**。\n- **会读·李通玄**：「**第四如來於舊道場中出現，大威光去世生須彌山頂為大天王，還來見佛獲益而去。此一品經來文未足。**」（`T1739` 第十五条）——李通玄之第十五条正叙此段，且明判「經來未足」。→ 李通玄之十五条与本品之 23 段**一一可对**（详 §5.3）。\n\n### 2.12 本品小结\n\n**结构之总**：本品以**澄观三科**为骨——「① 本事之时（二佛刹尘数劫）／② 本事之处（刹海→胜音→香海·华山·山顶林·道场，凡九层收敛）／③ 时中本事（历事四佛）」。③ 之中，以**「四佛」为四段**，而**详略递减**（2,426→1,082→479→131），末段最简而**无偈**，且**无总结**——此「递减」与「无结」合，正成一种「**未完成感**」，即澄观、李通玄二家同判之「经来不尽」之文献现象（§1.5）。\n\n**义理之总**：\n1. **一位太子之六变**：太子→菩萨→童子→王子→转轮圣王→大天王（离垢福德幢）。一身而历六位，表**修因之次第**。\n2. **四佛之四益**：十法门（见光得益）→ 十法门·十千法门（闻法得益）→ 大三昧（福非福海）→ 三昧普门欢喜藏（入法实相海）。益相之递增与详略之递减并存——**前期详列而实浅（位列名），后期略出而实深（入实相）**〔本文判断〕。\n3. **声闻范围之扩**：遍胜音世界（LG01）→ 一切世界皆悉得闻（LG05）——**位升则用广**。\n4. **普贤行之归**：LG03·颂07「普賢大願力……嚴淨諸剎海」／LG04·颂11「諸修普賢行……莊嚴佛剎海」／LG07·颂11「以諸願力能圓滿，**普賢菩薩一切行**」——**三群偈皆归普贤行**，与本品所属之「所信因果周」以「普贤」为说主（P01 普贤复告）相一贯。\n\n**一句话**：本品是**毘盧遮那（光明遍照）的「本因传记」**——**以一太子历事四佛、承事供养、闻法发愿之事，证成前品「华藏庄严」之依报果相皆「非无因有」**（澄观「證成前果為趣」），而归结于「**普賢菩薩一切行**」。\n\n---\n\n## 三、旁参与前接\n\n### 3.1 前接·《华藏世界品第五》（卷一〇末）\n\n本品与第五品之关系，为**「果—因」之对**。第五品开篇即标「**因**」以为「**果**」之本：\n\n> **「諸佛子！此華藏莊嚴世界海，是毘盧遮那如來往昔於世界海微塵數劫修菩薩行時，一一劫中親近世界海微塵數佛，一一佛所淨修世界海微塵數大願之所嚴淨。」**（`T10n0279` 卷八·华藏世界品第五之一）\n\n**会读**：第五品此句为**悬记**（先标「往昔修因」），本品则**实显**此「往昔」之事——**大威光太子历事四佛、亲近供养、净修大愿**，正是此句「一一劫中亲近世界海微尘数佛，一一佛所净修世界海微尘数大愿」之具体化。故二品当**因果对读**：第五品是「果」（依报庄严），本品是「因」（正报修因）。\n\n**结构之承**：第五品末为「**百一重颂**」（长颂总收），本品首为「**普賢菩薩復告大眾言**」——**同一说主（普贤）**，同一会（第一会），故二品实为**一贯之文**，以第五品收果、本品起因。\n\n### 3.2 前接·《世界成就品第四》与《普贤三昧品第三》\n\n- **第四品（世界成就品）**：明「世界海」之「起具因缘、所依住、形状、体性、庄严、清净、佛出差别、劫住、劫转变差别、无差别门」等十事。本品之「胜音世界」即「**佛出差别**」一门之**实例**（一劫之中「十须弥山微尘数如来出兴」，四佛递出）。\n- **第三品（普贤三昧品）**：普贤入「**一切诸佛毗卢遮那如来藏身三昧**」，由三昧力而说世界海——本品之「普賢菩薩復告大眾」，正承此「普贤承佛力而说」之轨。\n- **第二品（如來現相品）**：明「如来现相」与「光」之用——本品 P07「眉間放大光明」、P08「大威光太子見佛光明」皆承「光」之主题（§1.1 二光）。\n\n### 3.3 后接·《如来名号品第七》（卷十二）\n\n本品末，大威光为「大天王·离垢福德幢」，闻「广大方便普门遍照修多罗」而获益，「从道场出，还归本处」——**第一会至此而终**。次品转入**第二会**（普光明殿）：\n\n> **「爾時，世尊在摩竭提國阿蘭若法菩提場中，始成正覺，於普光明殿坐蓮華藏師子之座……」**（`T10n0279` 卷十二·如來名號品第七）\n\n**承转**：本品之归趣在「**因**」（修因）；第七品以下则转说「**如来名号**」（果德之别）。故本品为**第一会之殿军**，亦为「果德分」（前二品）与「信解行证分」（第二会以下）之**转折点**。\n\n### 3.4 旁参·跨品主题一览\n\n| 主题 | 本品 | 旁参品 |\n|------|------|--------|\n| 普贤为说主 | P01 复告大众 | 品3 普贤三昧、品4–5 普贤说 |\n| 世界海·刹种 | 胜音世界（略无刹种） | 品4 世界成就、品5 华藏世界 |\n| 佛出差别 | 一劫十须弥山微尘数如来·四佛递出 | 品4「佛出差别」门 |\n| 光明 | 眉间光·见佛光明·佛智光 | 品2 如来现相（光） |\n| 修因证果 | 大威光历事四佛·当成佛 | 品5 末「往昔修因」悬记 |\n| 普贤行愿 | LG03/04/07 三群偈归普贤行 | 品3 普贤行、后品普贤行品（36） |\n| 舍身行 | LG03·颂05「耳鼻頭手足…捨之無有量」 | 后品 十行／十回向（施） |\n\n**旁参·跨经**：本品「大威光太子历事四佛」之事，**六十华严**并入〈盧舍那佛品第二〉，主人作「普莊嚴童子」；**藏译**（`Toh 44-10`？）之对应须另考〔待核〕（§8·附录四）。\n\n---\n\n## 四、义理要点与名相\n\n### 4.1 义理大纲\n\n**一、本品之「体」——辩因证果**。澄观以本品为「**辩前果之因**」（`T1735`）：前二品（世界成就·华藏世界）明依报之「果」，本品明此果之「因」——即毘盧遮那往昔修因之事。故本品之体，非「说一故事」，而是**「以因证果」**——以「大威光历事四佛」证明「华藏庄严」非虚。\n\n**二、本品之「宗趣」——明因广大为宗，证成前果为趣**（`T1735`）。「因广大」者，见「十须弥山微尘数如来」「无量劫」「无尽供养」；「证成前果」者，证成第五品之依报庄严。\n\n**三、本品之「归」——普贤行愿**。三群偈（LG03/04/07）皆以「普贤行／普贤愿」为归结；末颂「**以諸願力能圓滿，普賢菩薩一切行**」为全品之总归。\n\n**四、本品之「密意」——初发心时便成正觉**〔本文判断〕。大威光初「见佛光明」即「**即时证得十种法门**」（P08），初闻经即「**即获**…法海光明」（P13）——皆「即」字，显**顿证**之义。李通玄「威光闻法获得宿命智力，见佛所行往因之事，并自立愿如佛所行」（`T1739`）正点此：**闻法→见因→立愿**，即「因行」之全体。\n\n### 4.2 名相表\n\n| 名相 | 底本形 | 义 | 出处 |\n|------|--------|----|------|\n| 毘盧遮那 | 毘盧遮那 | 光明遍照（vairocana）；略云光明遍照 | 品题·`T1735`/`T1733` |\n| 盧舍那 | 盧舍那 | 光明照（locana），旧译 | `T1733` |\n| 摩尼 | 摩尼 | 宝珠（maṇi） | P03 等 |\n| 那由他 | 那由他 | 亿／无量数（nayuta） | P03、P05 |\n| 由旬 | 由旬 | 长度单位（yojana） | P04、P06 |\n| 芬陀利 | 芬陀利 | 白莲华（puṇḍarīka） | P04 |\n| 優鉢羅 | 優鉢羅 | 青莲华（utpala） | P04 |\n| 波頭摩 | 波頭摩 | 红莲华（padma） | P04 |\n| 拘物頭 | 拘物頭 | 黄莲华（kumuda） | P04 |\n| 尸羅 | 尸羅 | 戒／清凉（śīla）；此处为宝幢名 | P04 |\n| 三昧 | 三昧 | 定（samādhi） | P08、P17、P21、P23 |\n| 陀羅尼 | 陀羅尼 | 总持（dhāraṇī） | P08、P17 |\n| 般若波羅蜜 | 般若波羅蜜 | 慧到彼岸（prajñā-pāramitā） | P08、P17 |\n| 修多羅 | 修多羅 | 经（sūtra） | P13、P19、P21、P23 |\n| 轉輪聖王 | 轉輪聖王 | 转轮王（cakravartin） | P21 |\n| 灌頂 | 灌頂 | 灌顶位（abhiṣeka） | P19 |\n| 迦樓羅／緊那羅／摩睺羅／乾闥婆／阿脩羅 | 同 | 八部众之五 | P05、P12 |\n| 逈極 | 逈極 | 迥极（逈＝迥，远） | P03 |\n| 却敵 | 却敵 | 城上御敌之台 | P04 |\n\n### 4.3 数法层次\n\n本品数法，由「劫」至「由旬」至「佛数」，凡数层：\n\n| 层 | 数 | 出处 |\n|----|----|------|\n| 劫 | 過世界微塵數劫，復倍是數（＝二佛剎尘数劫） | P02 |\n| 劫 | 恒河沙數小劫；人壽命二小劫 | P17 |\n| 劫 | 一百年前（佛出前瑞相期） | P07 |\n| 佛 | 十須彌山微塵數如來出興於世 | P07 |\n| 佛 | 六十八千億須彌山頂（现身坐处） | P07 |\n| 光 | 十佛剎微塵數光明（眷屬） | P07 |\n| 寿 | 佛壽命五十億歲 | P17 |\n| 眷属 | 夫人采女三萬七千；王子五百；大威光夫人十千 | P08 |\n| 众 | 七十七百千億那由他眾 | P12 |\n| 城 | 百萬億那由他城 | P04、P05 |\n| 量 | 城縱廣各七千由旬 | P04 |\n| 量 | 大蓮華廣大百億由旬 | P06 |\n| 法门 | 十種法門（初佛）／十千法門（第二佛） | P08、P17 |\n| 化益 | 如須彌山微塵數眾生發菩提心；佛剎微塵數眾生成就國土 | P15 |\n| 修多羅 | 世界微塵數／世界海微塵數修多羅為眷屬 | P13、P19、P21、P23 |\n\n**大数之递进**：「世界微尘数」→「十须弥山微尘数」→「佛刹微尘数」→「世界海微尘数」——由小而大，末以「世界海微尘数」（最广）收。→ 与本品「因广大」之宗趣合。\n\n### 4.4 「光明遍照」之二义二遍\n\n本品以「毘盧遮那（光明遍照）」为名，而法藏判「光明」二种、「遍」二种（§1.1），正可作全品之**解释框架**：\n\n| 二义 | 经文之证 |\n|------|----------|\n| **智光·照法**（真俗双鉴） | P13「十智光明」、LG03·颂08「**我以佛智光，見佛所行道**」 |\n| **智光·照机**（普应群品） | P07「其光照触，即自开悟…趣一切智」、P08「见佛光明已，即时证得十种法门」 |\n| **身光·常光**（圆明无碍） | P07「其身周普等真法界…无边妙色，具足清净」 |\n| **身光·放光**（以光警悟） | P07「眉间放大光明，其光名：发起一切善根音」 |\n| **平漫遍**（无碍普周） | P07「充满一切十方国土」 |\n| **重重遍**（如帝网重现） | P07「其胜音世界，有六十八千亿须弥山顶，悉亦于彼现身而坐」 |\n\n→ **「二义二遍」在经文中有其实证**（右列经文），故此释名之说**非空谈**〔本文判断〕。\n\n### 4.5 「历事四佛」之阶位\n\n四佛次第，可作**修因阶位**读：\n\n| 佛 | 身份 | 得益 | 阶位（李通玄／本文判断） |\n|----|------|------|--------------------------|\n| 第一·一切功德山須彌勝雲 | 太子 | 十法门（见光） | 初发心（信位） |\n| 第二·波羅蜜善眼莊嚴王 | 童子／王子 | 十法门＋十千法门；「灌顶智慧海」 | 八地（李通玄判，§2.9）〔待核〕 |\n| 第三·最勝功德海 | 转轮圣王 | 大三昧（福非福海） | 九地／十地〔本文判断〕 |\n| 第四·名稱普聞蓮華眼幢 | 大天王·離垢福德幢 | 三昧普門歡喜藏（入法实相海） | 等觉／成佛〔本文判断〕 |\n\n- **李通玄之判**：「第二佛……所得之益是八地法门」（`T1739`）——此为注疏家之位判，**非经证**，故标〔待核〕。\n- **本文之判**：四佛次第**不必然**为「地地之升」，然「得益之深（入实相海）／详略之减／身分之升」三事并行，确有**「渐深」之势**〔本文判断〕。切忌以「四佛＝四地」之机械配属（李通玄亦未明言四地）。\n\n### 4.6 与前五部义理之贯通\n\n| 前五部 | 本品之贯通 |\n|--------|-----------|\n| 一部 世主妙严（果德·十身） | 本品 P07「无边化佛从其身出」即「十身」之因证 |\n| 二部 如来现相（光·现相） | 本品 P07 眉间光、P08 见佛光明 |\n| 三部 普贤三昧（普贤承佛力说） | 本品 P01 普贤复告、诸偈皆「承佛威力」 |\n| 四部 世界成就（世界海十事） | 本品胜音世界（佛出差别之实例） |\n| 五部 华藏世界（依报·果） | 本品为「果之因」（§3.1 因果对读） |\n\n**一贯之旨**：前五部自「果德」而下（世主妙严→如来现相→普贤三昧→世界成就→华藏世界），本品则**溯「果」至「因」**——**第一会之全体，至此由「果」而「因」而圆满**。故第六品非「故事之插入」，而是**第一会之收摄**：以「一太子之事」收「一会之法界」，以「因」证「果」〔本文判断〕。\n\n---\n\n## 五、注疏选要·诸家会读\n\n> **〔本轮增补〕** 原列三家（澄观·法藏·李通玄）之外，本轮增**智俨《搜玄分齊通智方軌》**（`T1732`，见 §5.2′）与**慧苑《續華嚴略疏刊定記》**（`X0221`，见 §5.2″）二家，故统称「诸家」，不复以数限。下表仍以原有三家为准，不改。\n\n> **体例**：引注疏原文一律**繁体照底本**、逐字回源并注明经号与行号；会读按语用简体。三家者：**澄观《华严经疏》**（`T1735`）·**法藏《探玄记》**（`T1733`）·**李通玄《新华严经论》**（`T1739`）。三家中，澄观承法藏而**释八十本**，李通玄则**就六十本立论**——故三家并读，正可**以注疏之异见版本之别**〔本文判断〕。\n\n### 5.1 澄观《华严经疏》`T1735`——品六科判（最详）\n\n澄观之科判，为读本品之**第一手骨架**。其门有四：\n\n**（一）来意**：\n\n> **「初來意者。前明此因之果。今辯前果之因。答前因問故次來也。因是果因故標果稱。又不以人取法知是誰因。前品初言。毘盧遮那曠劫修因之所嚴淨。今方顯其事。」**（`T1735` 品六科判）\n\n**（二）释名**：「**二釋名者。略云光明遍照。廣如前釋。**」——「广如前释」者，指疏前文释「毘盧遮那」处（即 §5.2 法藏所释之同源）。\n\n**（三）宗趣**：「**三宗趣者。明因廣大為宗。證成前果為趣。**」\n\n**（四）释文**：「**四釋文一品分三。初總明本事之時。二有世界下。別顯本事之處。三彼勝音世界。最初劫中下。別顯時中本事。**」→ 即 §2.0 之三科。其中：\n\n- **辨处三**：「**二辨處中亦三。第一總明剎海。第二此世界海下。別明一剎。略無剎種。剎名勝音者。多佛出世說法音故……第三諸佛子彼勝音下的指一方。如今娑婆中。別說一四天下也。於中亦三。初總明感應之處。第二諸佛子此林東下。別明能感居人。第三諸佛子彼大林中下。別顯道場嚴事。**」\n- **香海之辨**（重要）：「**初明香海者。非持種之海。即如今四洲之海耳。**」——澄观明点此香海**非**第五品「持种」之大香水海，而只是一四天下之海（§2.2）。\n- **主伴城**：「**初雖有天城以佛出故人城為主。**」\n- **训「櫓」「却敵」**：「**城上守禦曰櫓。繞城別築土臺曰却敵。**」\n- **四佛**：「**第二正顯本事中歷事四佛。即為四別。第一逢一切功德山須彌勝雲佛。第二波羅蜜善眼莊嚴佛。第三最勝功德海佛。第四名稱普聞蓮華眼幢佛。**」\n- **初佛六门**：「**就初佛中文分為六。第一總標佛號。第二先瑞熟機。第三正顯佛興。第四毫光警召。第五當機雲集。第六廣演法門。**」\n  - **释佛名**：「**一切功德山者。福德崇峻不可仰也。復言須彌者。定慧高妙難傾動也。言勝雲者。慈覆智潤廣無邊也。**」（三名各有释，极精）\n  - **正显佛兴·十相**：「**別顯勝德略有十相。一示身相……二悲相……三成相……四色相……五勝相……六貴相……七應相……八無礙相……九者化相……十吉祥相。**」\n  - **毫光警召五门**：「**一放光處顯中道故。二王光名。發動宿種生起新善故……三眷屬數無盡法故。四照分齊……五若有下明光勝益。文有十句。**」\n  - **当机云集六门**：「**今初即正出本事之緣。文分為六。第一標名辨統。二總辨眷屬。三威光得益。四偈讚如來。五父王宣誥。六俱行詣佛。**」\n  - **释「大威光」**：「**上首云大威光者。有大威德聖道光明故。**」（`T1735`）——即「大威光」名之训。\n  - **十法门之释**：「**此上十法。初三功德法。次四熏修法。後三起化法。多言大者。境界無邊稱性廣大。**」\n  - **偈分三**：「**十偈分三。初二示佛出現既滅闇。難遇不可失時。次五令觀佛德……後三引例勸歸。**」\n  - **父王宣诰**：「**第五父王宣誥文分為二……偈有十一分之為三。初三集眾勸觀。次七勅令辦供……後一偈勸齎供佛。**」──澄观于此引《郑注礼》《广雅》训「巾」「驭」（见训诂，`T1735`）。\n  - **广演法门五门**：「**第六時彼如來下廣演法門文分為五。一佛轉法輪。二威光獲益。三以偈讚述。四傳化眾生。五佛加讚勵。**」\n  - **十一智光明之释**：「**智即是體光明語用。所照境殊故分十一也。**」——**澄观明判为「十一」，与本席底本实测（十一句）合**（§2.8）〔信度 A〕。\n  - **传化众生**：「**第四傳化眾生文分為三。初明自悟。二為一切下。明轉悟他顯示十法。與前自得十一有同有異……三今如須彌山下。利他之益。**」\n  - **佛加赞励**：「**第五如來讚勵中。偈有十一。初三讚發心得法大果當成。次四對劣顯勝進者圓德。次二外加。內智決證無疑。後二舉一例餘。**」\n- **第二佛五门**：「**第二遇第二佛文分為二。先結前生後……二彼佛滅下。正顯佛興。文分為五。一明滅後佛興。二覩相獲益。三讚德勸詣。四眷屬同歸。五聞經悟入。**」──**释第二佛名**：「**此中佛名。謂智導萬行皆到彼岸。見性了了故名善眼。果由因飾是曰莊嚴。**」\n  - **佛寿短而人寿长之辨**（重要）：「**說人壽佛壽者。由佛壽促而人壽長。故得威光一生歷事三佛。**」（`T1735`）——此为**「一生历事三佛」之所以可能**之释：佛寿短而人寿长，故一生得值多佛。\n  - **十益配地位**：「**然此十事略為二釋。一者如次配於十地十度……二者此上十門。隨一一事以立其名。未必全將配於地位。或通配諸位。或復不次。**」——**澄观于「十益配十地」一事，特设「未必全配」之通融门**，与李通玄「八地法门」之判正相对照（§5.4）。\n- **第三佛六门**：「**遇第三佛文分為六。一如來出時……二彼摩尼下。正明現世……三時大威光下。威光往供。四時彼如來下。佛為說經……五爾時下威光得益……六時彼佛下。如來記別。**」──**释三佛名**：「**立斯號者。功德海滿無加過也。**」／**释普眼**：「**眼外無法方真普眼……全色為眼。**」（极精之释）\n- **第四佛四门**：「**遇第四佛文分為四。一佛出入中。二天王就供。三如來說法。四得益還歸。**」──**释四佛名**：「**約相目類青蓮。約德心無所染。相德高顯名稱外彰。摧邪眾歸故曰幢也。**」\n\n**（五）「经来未尽」与「结会古今」——澄观最要之两判**：\n\n> **「此劫之中。十須彌塵數如來。今但云四。又無結會古今現證得益等者。經來未盡故也。若結會者。應云爾時威光菩薩者毘盧遮那是等。所信因果會竟。」**（`T1735` 品六科判末）\n\n此段有二义，皆极要：\n1. **「经来未尽」**：一劫有「十须弥尘数如来」，而经文**但云四**；又**无「结会古今」**（即「尔时某菩萨者，今某佛是」之结）与「现证得益」之结——皆因**梵本传来未尽**（§1.5）。\n2. **「若结会者，应云尔时威光菩萨者毘卢遮那是」**——**澄观补出此句**：若补「结会古今」之文，应作「**爾時威光菩薩者，毘盧遮那是**」！→ **此即明判：大威光太子＝毘盧遮那如来之前身**。〔信度 A·据澄观补文〕\n   → 由此，「经来未尽」之缺，恰是「**所信因果会**」之所以「**无结而结**」——**以「不结」作结**，留「威光即遮那」一句于读者心中〔本文判断〕。此为本品读法之**眼**。\n3. **「所信因果会竟」**——澄观以此句收第一会：**第一会（所信因果周）至此而竟**（§3.3）。\n\n### 5.2 法藏《探玄记》`T1733`——释名（光明遍照·二光二遍）\n\n法藏之《探玄记》就**六十本**立论，其「盧舍那佛品第二」（＝八十品2–6之合）之**释名**，为本品品题之第一手训释：\n\n> **「初釋名中。盧舍那者古來譯或云三業滿。或云淨滿。或云廣博嚴淨。今更勘梵本具言毘盧遮那。盧舍那者此翻名光明照。毘者此云遍。是謂光明遍照也。此中光明有二種。一智光。二身光。智光亦二義。一照法謂真俗雙鑒。二照機謂普應群品。身光亦二種。一是常光謂圓明無礙。二放光謂以光警悟。此中遍者亦二種。一平漫遍無礙普周故。二重重遍如帝網重現故。此二圓融。各全體遍非是分遍。」**（`T1733` 卷三·盧舍那佛品第二）\n\n法藏復释「何故不云世界品乃题佛名」之问：\n\n> **「問如下文中略明五海。廣辨世界。何故不云世界品乃題佛名耶。答古德釋云。以從主為名故以主勝故。舉土主以說之。今釋以佛通三世間故。下文土等即是舍那佛。如十身中國土身等。又以依正無礙故是故標釋。互舉文綺耳。」**（`T1733`）\n\n**会读**：法藏之「**二光二遍**」为读本品之钥匙（§4.4），其「**依正无碍**」之释，又与本品「以因（正报）证果（依报）」之结构暗合——**品题标「佛」（正）而所说不离「世界」（依）**，正「依正无碍」之体现〔本文判断〕.\n\n法藏又立「四门分别」（释名·来意·宗趣·释文），其**宗趣**云：\n\n> **「三宗趣者有二。一約人二約法……此上因果融攝不二唯是一人……此上教義融攝不二為一法也。又上人法復圓融不二為一宗趣。此四義各三為一緣起相即無礙。」**（`T1733`）\n\n→ 与澄观之「明因广大为宗，证成前果为趣」相较：**澄观简截，法藏圆融**（以人法、教义、因果、体用四义「圆融不二」为宗趣）。二家可互参〔本文判断〕。\n\n### 5.2′ 智俨《搜玄分齊通智方軌》（`T1732`）\n\n**来源**：唐·智俨（华严二祖）《搜玄分齊通智方軌》（`T1732`）；本机藏 PDF 抽取本，康熙部首异体字已归一为正字，仍待二次校对〔待核〕。**旧著录误题「法藏」，本轮已订正**（见部1 八.5）。\n\n**智俨就六十本立论**：六十本**无独立〈毗盧遮那品〉**——其本事并入〈盧舍那佛品第二〉（＝八十品2–6），且主人名作「普莊嚴童子」（参 §6.2）。故 `T1732` 于本品**无逐品玄谈**；其可据者，为品2「四门分别」之通判：\n\n**（一）辨名**：\n\n> 「一釋名者。盧舍那此云廣博嚴淨。問此品辨依報。何故從主名者。此土與主為所依。正報強故舉人顯土。」（`T1732` 品2）\n\n**按**：智俨一律作「**盧舍那**」，**无「毗盧遮那」字样**；其释「廣博嚴淨」与法藏、慧苑之「光明遍照」为不同古译。此可解本品（八十作「毗盧遮那品」）名之异译源流〔本文判断〕。\n\n**（二）来意**：「二來意者。何故此品來。既眾集已。次明所顯法故也。」\n\n**（三）宗趣**：\n\n> 「三辨宗趣者有二。一人。二法。……法者四種淨土為此會宗。又亦可法界及世界海為宗也。」（`T1732`）\n\n**（四）分文释（三分判，最关本品「因」之性）**：\n\n> 「二就品分者有三。初至光覺等來舉果勸樂生信分。二明難下明修因契果生解分。三離世間下辨依緣修行成德分。……此品內佛加普賢說淨土依果。第二會內文殊承力說佛三業明其正報。」（`T1732`）\n\n**会读**：智俨「**此品内佛加普贤说净土依果**」者，「此品」指六十品2（含八十品6）——**以其为「依果」之品**；而八十品6实为「因」（大威光历事四佛之本事）。智俨之判与澄观「明因广大为宗，证成前果为趣」（§5.1）**正相对照**：**智俨就当会（品2）全体言其「依果」，澄观就本品（品6）别言其「因」**——二说层次不同而不相违〔本文判断〕。\n\n### 5.2″ 慧苑《續華嚴略疏刊定記》（`X0221`）——释名·来意·宗趣与「王子五百」之勘\n\n**来源**：唐·慧苑《續華嚴略疏刊定記》（`X0221`，卍续藏）；PDF 抽取本，异体字已归一，仍待二次校对〔待核〕。慧苑就八十本立论，本品（品6）于 `X0221` 有逐品玄谈，亦立「四门同前」。\n\n**（一）释名**：\n\n> 「初釋名者。毗此云遍也。盧遮那光明照也。謂身智二光覺機照法。具如妙嚴品初難菩薩德處釋。」（`X0221` 品6·释名）\n\n**按**：慧苑释「毗＝遍」「盧遮那＝光明照」，谓「身智二光覺機照法」——与法藏「毘者此云遍……光明遍照也。此中光明有二種：一智光、二身光」（§5.2）**同源**（法藏亦慧苑之师辈），而慧苑「具如妙嚴品初」已释，故此处从略，见其书之自洽〔本文判断〕。\n\n**（二）来意**（与澄观字句全同）：\n\n> 「二來意者。前此因明之果。今辨前果之因。故次來也。又為答前問因故來也。問此若明因。何故品標果稱。答若不標果。因是誰因。」（`X0221` 品6）\n\n**按**：慧苑「**前此因明之果，今辨前果之因**」与澄观「前明此因之果，今辯前果之因」（§5.1）**字句全同**——可见澄观《疏》于本品来意**直承慧苑《刊定记》**（澄观后出，其疏多采慧苑、法藏之说）〔本文判断〕。又「若不標果，因是誰因」一语，为二家共出之辨。\n\n**（三）宗趣**：「三宗趣者。明佛昔因為宗。證成前果令信為趣。」\n\n**（四）释文（世界中十七门）**：慧苑于本品释文之「明依剎海有世界」段，谓「就世界中，文有十七」，开为「剎名勝音」以下十七门（一剎名·二剎所依·三剎眷屬……十二剎中有香海·十三海中有妙高山……十五林東有城……），与澄观「三科」、李通玄「十五条」可对读，**其门下更细**〔本文判断〕。\n\n**（五）「王子五百」vs「二萬五千」之勘（与 §6.4 对读）**：\n\n> 「言王子五百人。別本云二萬五千人者。按纓絡本業經上卷曰。……第十地菩薩示現為王。當無二萬五千。按喜見統領及末見波羅蜜善眼佛前。猶未至第二地。恐二萬五千誤也。或可約教說異。理亦無失。」（`X0221` 品6）\n\n**会读**：慧苑**引《瓔珞本業經》**（十住铜轮百福子·十行银轮五千福子·十回向金轮千福子·初地万子·二地二萬子）为据，判定「喜見王未至第二地，故**恐『二萬五千』誤**」——与澄观「**五百銀輪斯為正也**」（§6.4）**同判**（皆以「五百」为正），而**慧苑之论证更详**（明引经证、辨地位）。惟慧苑终以「**或可約教說異，理亦無失**」存一说——**比澄观之断更宽**。二家并存，可互参〔本文判断〕。\n\n### 5.3 李通玄《新华严经论》`T1739`——十五条逐段科判\n\n李通玄之《论》就**六十本**逐段科判，凡**十五条**，与本品 23 段**一一可对**（此为读本品之**等长骨架**）：\n\n| 条 | 起 | 内容（`T1739` 原文节引） | 对应段 |\n|----|----|--------------------------|--------|\n| 一 | 爾時 | 「明普賢告眾欲說其法」（复分十：劫数／世界海及世界名／世界之号／所依住处／周围眷属数／形状／地上庄严／宝树及山轮围重数／城邑宫殿／人饮食衣服随念及劫名） | P01–P02 |\n| 二 | 諸佛子 | 「明胜音世界中香水海及举其名」（分八：香水海名／华山出现／山庄严有十／山上大树林／山上五种无量众事庄严／都举庄严难记／山上诸城之数／杂类众共居） | P03 |\n| 三 | 諸佛子 | 「明林东之城」（分十：城名／人王所居／诸城围绕／城体众宝所成／城广狭／城郭庄严崇丽／上下众事庄严／城中居人／人得业报神通／城四绕天龙等七种众诸城所居） | P04–P05 |\n| 四 | 諸佛子 | 「明宝华枝轮林中道场，并陈庄严广大」 | P06 |\n| 五 | 諸佛子 | 「明初劫中佛出现之数，并陈初佛名号，及举华枝大林先现之瑞」 | P07（前半） |\n| 六 | 爾時 | 「明初佛从莲华中忽然出现，并陈佛身遍坐一切法界道场众生皆见等事」 | P07（中） |\n| 七 | 爾時 | 「明初佛出现放光集众，并陈光德大众来集」 | P07（后） |\n| 八 | 諸佛子 | 「明焰光明大城有人王名喜见善惠王与眷属俱集，并陈太子威光以自善根见佛光明得十种法门……最下三句明威光说颂叹佛」 | P08–P10＋LG01 |\n| 九 | 諸佛子 | 「明威光说颂以佛神力其声遍闻，父王闻之欢喜说颂……十一行颂中明其善惠王敕众令集并令办供具」 | P10–P11＋LG02 |\n| 十 | 爾時 | 「明十王兴供，见佛并陈所闻修多罗经，威光获益……最下两句明威光说颂……此十行颂中，明威光闻法获得**宿命智力**见佛所行往因之事，并**自立愿如佛所行**」 | P12–P14＋LG03 |\n| 十一 | 諸佛子 | 「明威光菩萨以见初佛承事供养故，得十种显示如来所行法，令须弥山微尘数众生发菩提心，功德山须弥胜云如来为威光说颂」 | P15–P16＋LG04 |\n| 十二 | 諸佛子 | 「明庄严劫中佛及人寿命长短，初佛去世第二佛出兴，并明威光见第二佛得十种利，并为眷属说颂」 | P17–P18＋LG05 |\n| 十三 | 諸佛子 | 「明威光说颂其声遍闻，威光与眷属同往佛所，得十种利，第二佛为威光说颂……**所得之益是八地法门**。如经云。得灌顶智慧海。名无功用。修极妙见。」 | P19–P20＋LG06 |\n| 十四 | 諸佛子 | 「明第二佛去世，善惠王亦去世，大威光受轮王位，第三如来于旧道场出兴，威光见佛闻法得益，第三如来说颂」 | P21–P22＋LG07 |\n| 十五 | 諸佛子 | 「明第四如来于旧道场中出现，大威光去世生须弥山顶为大天王，还来见佛获益而去。**此一品经来文未足。**」 | P23 |\n\n**李通玄之总判（两条，最要）**：\n\n1. **「四佛皆毘盧遮那一号异名」**：\n\n> **「此中。有四佛出世。總明毘盧遮那一號各隨世間應緣名異非是佛名號異。此經下文佛名號品。一一佛皆具等法界眾生界隨緣名號。世間一切名皆是諸佛名。為如來德遍一切法故。猶如虛空遍含眾法……一切名言入佛名號者悉皆清淨。」**（`T1739`）\n\n→ 李通玄判：本品四佛**非四尊各别之佛**，而是「**毘盧遮那一号各随世间应缘名异**」。此与澄观「结会古今，应云尔时威光菩萨者毘卢遮那是」（§5.1）**异曲同工**——**皆指向「四佛·一遮那」之旨**〔本文判断〕。然二家之致：澄观重在「**威光即遮那**」（能化之因人），李通玄重在「**四佛即遮那异名**」（所化之应身），合观则**「人（威光）·佛（遮那）·因·果」四而一**〔本文判断〕。\n\n2. **「八地法门」之位判**（第十三条）：「**所得之益是八地法门。如经云。得灌顶智慧海。名无功用。修极妙见。**」——判第二佛段之得益为**八地**（灌顶位）。此与澄观「未必全将配于地位」之通融（§5.1）正可对读：\n\n> **二家之异**：**李通玄主「配位」（八地·灌顶），澄观主「通配或不次」**。澄观之《演义钞》（`T1736`）更详「十地十度」之配〔待核〕，而卒以「隨一一事以立其名，未必全配」为归。→ 本席从**澄观之通融**：四佛虽有渐深之势，然**不宜机械配地**（§4.5）〔本文判断〕。\n\n### 5.4 诸家对读小结\n\n| 项 | 澄观 `T1735` | 法藏 `T1733` | 李通玄 `T1739` |\n|----|-------------|-------------|----------------|\n| 所依本 | 八十 | 六十 | 六十 |\n| 品题释 | 略云光明遍照 | 光明遍照·二光二遍 | 四佛即遮那异名·「以种种教行之光遍照一切」 |\n| 宗趣 | 明因广大为宗，证成前果为趣 | 人法教义因果体用圆融不二 | （以「因广大·业报广大」答） |\n| 科判 | 三科·四佛·六门（极详） | 四门（释名·来意·宗趣·释文） | 十五条（逐段） |\n| 位判 | 十益配十地「未必全配」 | —— | 第二佛益＝八地法门 |\n| 「威光即遮那」 | **明判**（结会古今之补文） | ——（依正无碍） | **四佛皆遮那异名** |\n| 关于文本 | 「经来不尽故无总结」 | —— | 「此一品经来文未足」 |\n| 结论 | 第一会「所信因果会竟」 | —— | 一品文未足，义则已圆 |\n\n**一家之见**：三家皆以本品为「**因**」之品，皆判「**经来未尽**」为**文献**而非**义理**之缺——此为本品读法之共识。其异则：**澄观重「结构」（科判最密）、法藏重「义理框架」（二光二遍）、李通玄重「配位与观行」（八地·闻法见因立愿）**。三读并观，则本品之「**因行—果德—观心**」三面俱现〔本文判断〕。\n\n**「大威光即毘盧遮那」之会归**：三家之中，**澄观之补文与李通玄之总判相合**，皆指「**大威光太子者，毘盧遮那是**」。此一句，实为本品「**辩因证果**」之枢纽——**若不是威光即遮那，则本品只是「一太子之事」；正因威光即遮那，本品方成「华藏依报之因」**〔本文判断〕。\n\n---\n\n## 六、八十与六十对读（含「约二十名对勘」）\n\n> **体例**：八十＝实叉难陀译《大方广佛华严经》`T10n0279`（本席底本）；六十＝佛驮跋陀罗译《大方广佛华严经》`T09n0278`（本地语料：卷三、卷四两卷）。六十之引文照 `T09n0278` 繁体原字形；对读按语用简体。\n> **〔待核〕声明**：本机所存六十语料为**卷三·卷四两卷**，其〈盧舍那佛品第二〉之「普莊嚴童子」段**止于第二佛（一切度離癡清淨眼王）**，随后即接〈如來名號品第三〉。而李通玄《新华严经论》（据六十立论）之科判**明有第三佛·第四佛**（§5.3 条十四、十五）。故本机六十语料于该段**有断**，第三·四佛之六十对应文**未能实见**——凡涉此者，一律标〔待核〕，**不以机内所见充当全本之证**。\n\n### 6.1 分品之别：六十之〈盧舍那佛品第二〉＝八十之品二–六\n\n| | 八十 `T10n0279` | 六十 `T09n0278` |\n|---|---|---|\n| 品次 | 如来现相品第二（卷6）／普贤三昧品第三（卷7）／世界成就品第四（卷7）／华藏世界品第五（卷8–10）／**毘卢遮那品第六（卷11）** | 〈盧舍那佛品第二〉（卷三–卷四，**五品合为一品**） |\n| 本品之文 | 独立一品（卷11） | 并入〈盧舍那佛品第二之三〉（卷四），**无独立品题** |\n| 主人名 | 大威光太子 | **普莊嚴童子** |\n| 品后接 | 如来名号品第七（卷12） | 名号品第三（卷五） |\n\n**会读**：六十以「**盧舍那**」（旧译）为题，将八十之「如来现相·普贤三昧·世界成就·华藏世界·毗卢遮那」五品**合为一品**；八十则**析为五品**，且**特立「毗卢遮那品」**为题。→ **八十之「立品」即是一重「释义」**：以此品**专明「毘盧遮那」之因**，遂以佛名题品（法藏「从主为名」「依正无碍」之释，§5.2）〔本文判断〕。\n\n### 6.2 名相对照表（约二十名对勘·本批交付）\n\n> 下表以八十为本，逐名对六十。**「—」表示本机六十语料未见**。\n\n| # | 类 | 八十 `T10n0279` | 六十 `T09n0278` | 备注 |\n|---|----|----------------|----------------|------|\n| 1 | 世界 | 勝音（世界） | **勝妙音**（世界性） | 六十作「世界性」「勝妙音」；八十作「世界」「勝音」 |\n| 2 | 香水海 | 清淨光明 | **清淨光** | 八十多「明」字 |\n| 3 | 华山（须弥山） | 華焰普莊嚴幢 | **大焰華莊嚴幢** | 「焰華／華焰」语序倒、「大／普」异 |\n| 4 | 山顶林 | 摩尼華枝輪（大林） | **寶華枝**（林觀） | 八十「摩尼」↔六十「寶」；八十「輪」↔六十（无） |\n| 5 | 主城 | 焰光明 | **焰光** | 八十多「明」字 |\n| 6 | 天城 | 樹華莊嚴 | 樹華莊嚴 | ✓ 同 |\n| 7 | 龍城 | 究竟 | 究竟 | ✓ 同 |\n| 8 | 夜叉城 | 金剛勝妙幢 | 金剛勝妙莊嚴幢 | 六十多「莊嚴」 |\n| 9 | 乾闥婆城 | 妙宮 | **離垢善** | 名全异 |\n| 10 | 阿脩羅城 | 寶輪 | **寶輪地** | 六十多「地」 |\n| 11 | 迦樓羅城 | 妙寶莊嚴 | **眾寶莊嚴善光** | 名全异 |\n| 12 | 緊那羅城 | 遊戲快樂 | **娛樂莊嚴** | 名异义近 |\n| 13 | 摩睺羅城 | 金剛幢 | **寶金剛幢** | 六十多「寶」 |\n| 14 | 梵天王城 | 種種妙莊嚴 | **—**（本机六十语料无） | **六十缺梵天王城**（伴城作八，八十作九） |\n| 15 | 道場 | 寶華遍照 | **寶華莊嚴** | 「遍照」↔「莊嚴」 |\n| 16 | 大海（道场前） | 香摩尼金剛 | **—**（本机六十语料无其名） | 六十只云「其道場前，有大蓮華」 |\n| 17 | 大蓮華 | 華蘂焰輪 | **華焰具足** | 名全异 |\n| 18 | 人王 | 喜見善慧 | **愛見善慧** | 「喜見」↔「愛見」 |\n| 19 | 主人 | 大威光（太子） | **普莊嚴**（童子） | 名全异；八十为「上首」，六十为「次子」（§6.4） |\n| 20 | 第一佛 | 一切功德山須彌勝雲 | **一切功德本勝須彌山雲** | 八十「功德山·須彌勝雲」↔六十「功德本勝·須彌山雲」 |\n| 21 | 初佛光名 | 發起一切善根音 | **一切功德覺** | 名全异 |\n| 22 | 初佛经名 | 普集一切三世佛自在法修多羅 | **現三世一切諸佛集會**（經） | 名全异 |\n| 23 | 第二佛 | 波羅蜜善眼莊嚴王 | **一切度離癡清淨眼王** | 名全异 |\n| 24 | 第二佛经名 | 法界體性清淨莊嚴修多羅 | **一切法界自性離垢莊嚴** | 八十「體性清淨」↔六十「自性離垢」 |\n| 25 | 三佛·四佛经名 | 菩薩普眼光明行修多羅／廣大方便普門遍照修多羅 | **—**〔待核〕 | 本机六十语料断于第二佛 |\n\n**统计**：可对勘之名凡 **25 项**，其中**完全相同者 3**（#6 #7，#8 近同），**小异（增字/语序）者 6**，**全异者 12**，**本机六十缺者 3**（#14 #16 #25）。→ **两本之名相仅有约四分之一全同**，此为一处**真实的异译程度定量观察**〔本文判断〕。\n\n### 6.3 序段详略对读（P02–P07）\n\n| 项 | 八十 | 六十 | 别 |\n|----|------|------|-----|\n| 劫名 | 「其劫名曰：種種莊嚴」 | 未见劫名 | 八十有劫名，六十（本机语料）无 |\n| 佛出前瑞相 | 一百年前，出宝焰云、叹佛功德音、演说四事、宫殿相照、宝华成云……（长段） | 「時，彼世界**過百歲已**，有佛出世」 | **八十详述瑞相，六十一句带过** |\n| 时间语 | 「一百年**前**」（佛出前百年现瑞） | 「過百歲**已**」（过百岁后有佛出） | 语序义同、详略大异 |\n| 佛现身 | 「於其道場大蓮華中忽然出現。其身周普等真法界……其勝音世界，有**六十八千億須彌山頂**，悉亦於彼現身而坐」 | 「時，佛處彼大蓮華上」 | **八十有「重重遍」之广文，六十甚简** |\n| 光名 | 發起一切善根音，十佛剎微塵數光明 | 一切功德覺，十佛世界塵數光明 | 光名异、眷属数同 |\n| 光益 | 八句（息惑热、裂盖网、摧障山、净垢浊、发信解、生善根、离难灭苦、起见佛心） | 「滅除一切眾生煩惱蓋障，令得淨心，起功德海，永離三惡八難諸趣，發菩提心」 | 八十八句详，六十三四句略 |\n\n**疏解**：六十之文，于「序段」**大幅简化**（劫名、瑞相、现身广文、光益细节多略）。此或为**译者风格之别**（佛驮跋陀罗译尚简），或为**所据梵本之详略**（§6.4 澄观「别梵本」之例）〔本文判断〕。\n\n### 6.4 校勘要点（四则）\n\n**（一）「王子五百」与「二万五千」——澄观之判**：\n\n- 八十作：**「王子五百人，大威光為上首。」**\n- 六十作：**「二萬五千子；其第一子名功德勝，次名普莊嚴童子。」**\n- 澄观判（`T1735` 品六科判）：\n\n> **「王子別本云。二萬五千者。別梵本也。案瓔珞本業經上卷。云十住銅輪寶瓔珞。百福子為眷屬。生一佛土受佛學行。教化二天下。銀輪寶瓔珞五百子。金輪一千子。初地四天王一萬子。二地忉利天王二萬子。三地已上乃至淨居天王。但云眷屬亦如是。故知無過二萬子者。若三界王即當等覺。又以一切菩薩為眷屬。案喜見所統但以城言。又見佛興至第三佛。方云去世。五百銀輪斯為正也。或約教異理亦可通。」**\n\n**疏解**：\n1. 八十之「五百」与别本之「二万五千」，非抄误，而是**两个梵本之别**（澄观：「別梵本也」）。\n2. 澄观据《瓔珞本業經》「**銀輪寶瓔珞五百子**」（十住·银轮王）判：喜见善慧王既是「**人王所都**」之城主、又「见佛兴至第三佛方云去世」，其位当**银轮王**（十住位），故**眷属应五百子**——「**五百銀輪斯為正也**」。\n3. 又：六十之「二万五千」与《瓔珞》「**二地忉利天王二万子**」相近，故**「或約教異理亦可通」**（二地忉利天位）。\n4. **本席从澄观**：以八十「五百」为底本之正；然**「二万五千」亦非伪**，乃「别梵本」之传（§1.5·2）〔本文判断〕。\n\n**（二）长幼位次之异**：八十以**大威光为上首（第一子）**；六十以**功德勝为第一子、普莊嚴童子为次子**。→ 两本于主人之**长幼位次**判然不同（§6.2 #19）。此异**非文字之误**，而是两本对「同一人物」之**名与位**本有差别〔本文判断〕。\n\n**（三）伴城之数**：八十列**九城**（含梵天王城）；六十列**八城**（无梵天王城）。→ 六十缺「梵天王城」（§6.2 #14）。〔待核·或为六十本所据梵本本无〕\n\n**（四）得益之名数**：\n\n| 处 | 八十 | 六十 |\n|----|------|------|\n| 初佛·见光得益 | 十种**法门**（功德轮三昧·普门陀罗尼·般若·慈·悲·喜·舍·神通·愿·辩才） | 十种**三昧**（诸佛具足功德三昧·普门方便三昧·淨方便雲三昧·教化众生三昧·一切音声充满三昧·无量功德诚向三昧·如实觉诸法三昧·广地方便海三昧·胜解脱三昧·一切智光三昧） |\n| 初佛·闻经得益 | **十一**种智光明 | **四**三昧（一切法具足·一切法来入安住菩提心·法界师子光方便·法眼清净） |\n| 第二佛·得益 | **十**法门（无边海藏门·大智力法渊·普随众生调伏度脱·遍覆一切境界云·一切佛功德海威力藏·法性虚空平等清净·自性离垢法界清净身·无碍光普随现·善入离垢渊·一切佛法清净藏） | **四**三昧（念佛三昧·普门海藏三昧·无量智持转法三昧·甚深法乐三昧）＋**二**三昧（一切法普门欢喜藏·入一切法方便海） |\n\n→ **八十之「十法门／十一智光明」在六十作「十三昧／四三昧」**——**组织方式（法门／三昧）与数量皆异**。此为两本**义理组织之别**（八十以「六度·三昧·陀罗尼」为纲，六十纯以「三昧」为纲）〔本文判断〕。\n\n### 6.5 偈颂对读（择要四例）\n\n**例一·LG01 首颂**：\n\n- 八十：**「世尊坐道場，清淨大光明，譬如千日出，普照虛空界。」**\n- 六十：**「猶如千日出，虛空靡不照，離垢坐道場，光明亦如是。」**\n\n→ 同一意象（千日喻光），而**语序相反**：八十先「坐道场」后「如千日」，六十先「如千日」后「坐道场」；「清淨大光明」↔「離垢」。\n\n**例二·LG03 首颂**（闻法见因）：\n\n- 八十：**「我聞佛妙法，而得智光明，以是見世尊，往昔所行事。」**\n- 六十：**「我聞最勝法，清淨慧眼開，能見一切佛，過去功德海。」**\n\n→ 义同而词异：八十「智光明」↔六十「清淨慧眼開」；八十「世尊往昔所行事」↔六十「一切佛過去功德海」。\n\n**例三·LG04 末颂**（佛赞授记）：\n\n- 八十：**「大光供養我，故獲大威力，令塵數眾生，成熟向菩提。」**\n- 六十：**「恭敬供養我，普莊嚴大力，勝須彌山佛，成汝無上道。」**\n\n→ **名字之别在偈中直现**：八十作「**大光**」（＝大威光），六十作「**普莊嚴**」——两本主人之名的差异，于此偈可见。\n\n**例四·LG05 首颂**（七言·第二佛）：\n\n- 八十：**「不可思議億劫中，導世明師難一遇，此土眾生多善利，而今得見第二佛。」**\n- 六十：〔本机六十语料断于第二佛得益处，其第二佛段之偈**未实见**〕〔待核〕\n\n**偈数之对读**（据本机六十语料，**部分〔待核〕**）：八十 LG01 十颂 ↔ 六十约八颂；LG02 十一颂 ↔ 六十约九颂；LG03 十颂 ↔ 六十约九颂；LG04 十一颂 ↔ 六十约八颂——**六十之偈皆略少于八十**（此数系按「四句一颂」粗计，**标〔待核〕**，不据以断论）。\n\n### 6.6 对读小结\n\n| 层面 | 八十 | 六十 | 判 |\n|------|------|------|-----|\n| 分品 | 五品分立，特立「毘卢遮那品」 | 五品合为〈盧舍那佛品第二〉 | 八十之「立品」即释义 |\n| 主人名 | 大威光 | 普莊嚴 | 名异位异 |\n| 眷属数 | 王子五百 | 二万五千子 | 澄观「五百银轮为正」 |\n| 伴随城 | 九城（含梵天王城） | 八城 | 六十缺一 |\n| 序段 | 详（瑞相·现身广文·光益八句） | 略 | 译者/梵本之别 |\n| 得益组织 | 法门·智光明（十/十一） | 三昧（十/四） | 义理组织之别 |\n| 偈颂 | 较多 | 略少 | 〔待核〕 |\n| 文本完整性 | 「经来不尽故无总结」 | 本机语料断于第二佛 | 二家同判「文未足」 |\n\n**会读**：八十·六十之别，**非「正误」之别，而是「译本／梵本」之别**。澄观（疏八十）与李通玄（论六十）**各照其本**，故其科判、位判、名相皆有差（§5.4）。此正为本品研究之**双层材料**：以八十定文，以六十（及六十系注疏）参义〔本文判断〕。\n\n**关于〈毗盧遮那品〉之「独立性」**：六十无独立之「毗卢遮那品」，其文并入〈盧舍那佛品〉；八十则**特立一品**。故「**《毗盧遮那品》**」这一品题，**本质上是八十译之「立品」所成**——六十七十之「毘卢遮那」独立成篇，实自实叉难陀本始。此为读本品者所不可不知之**文献常识**〔本文判断〕。\n\n---\n\n## 七、数据层（L1–L4·可复算）\n\n> **复算命令**：`python scripts/pilu_shena_studies.py`（仅标准库；口径见脚本头注）。\n> **范围**：`T10n0279.xml` 之品题〈毘盧遮那品第六〉起，至〈如來名號品第七〉止（＝卷第十一，一品一卷）。\n> **剥除**：`<note>`（1）／`<app>`（0）／`<cb:juan>`／`<byline>`／`<cb:mulu>`；再剥一切标签，**压缩全部空白**，计 CJK（U+3400–U+9FFF）。\n> **换算**：偈颂以 `<l>` 行计，**两行（＝4 句）为一颂**（与李通玄「两行为一颂」合）。\n\n### 7.1 L1·语言统计\n\n| 指标 | 值 |\n|------|-----|\n| CJK 总（含品题 7） | **4,93   // ── 章节级折叠：h2/h3/h4/h5 分级折叠（默认全部折叠；标题 ▾ 号点击可单独收展）──

  // 该三者施折叠；仅正文 #article-full 与页首会众流程 #article-flow 仍按 h2–h5 分级折叠。
  // 各节工具栏一概不生成（noBar），改由页首「一套」页面级控件统管全页折叠/展开。
  if(typeof _foldDoc==='function'){

    try{ _foldDoc('#article-flow .miaoyan-flow', {label:'会众全景流程', noBar:true}); }catch(e){}

  // ── 页面级统一控件：整页仅此一对「全部折叠／全部展开」，兼管章节折叠与 <details>（表·图）──

// ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);

function _applyArticleENMode(){

}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}

</script>
</body>
</html>
