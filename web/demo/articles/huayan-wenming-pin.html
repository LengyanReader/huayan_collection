<script>
var ARTICLE = {"id": "huayan-wenming-pin", "file": "articles/huayan-wenming-pin.html", "title": "九九华严第十品 菩萨问明品之拼读", "title_sub": "华严经第十品·第二会·差别因果周·卷十三次品·文殊与十首菩萨互为明难·九难九酬＋佛境界十一问＋九差别结归·诸法各各不相知·十信解门开篇·与六十《菩萨明难品第六》对读·注疏诸家会读（澄观·法藏·智俨·慧苑〔本品无记〕·李通玄·海云）·数据层·未完备已标明", "icon": "📖", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第二会_普光明殿_差别因果周/华严经细读_第十部_菩萨问明品.md", "doc_md": "# 华严经引读·第十部：菩萨问明品（卷十三·品十）\n\n> **EN · Close Reading of the Avataṃsaka Sūtra, Part F: Chapter Ten — *Statements of the Questioning Bodhisattvas***（品题英译依 `data/catalog/chapters.yaml` order 10 · title_en 直证〔L.183 取定〕；藏题 *byang chub sems dpa'i dri ba*（菩提萨埵问义·`data/translation/diff_matrix.yaml` order 10））\n>\n> **底本**：唐·实叉难陀译《大方广佛华严经》（八十华严）`T10n0279`。**范围：卷第十三·菩萨问明品第十（本品全文）**。本品属**第二会「普光明殿会」·差别因果周**，承第九品《光明觉》（意业·遍觉）之后，为第二会「能依能信之行」段的**开篇**——光明觉明「所依所信之境」，问明以下三品（问明·净行·贤首）显「能依能信之行」，而问明居其首，明**十信位中「解」**（慧苑、法藏并判，见 §五）。全品为**文殊师利与十首菩萨互设问答**：文殊依次问九首菩萨（觉首·财首·宝首·德首·目首·勤首·法首·智首·贤首）九难，诸菩萨各以偈酬；末由诸菩萨反问文殊「何等是佛境界」十一问，文殊以偈答之，再以佛神力放光遍照十方收束。是《华严》**「一多相即·诸法各各不相知·佛境界无量」**义之集中展示。\n> **立稿**：2026-10-25。承第一会六部及第二会前三部（第七至第九部）之体例与校勘纪律。\n> **本篇进度（覆盖率自陈）**：**全稿成篇**——§〇 凡例、§一 概述与品题解义、§二 全文逐段细读（九难九酬·文殊酬佛境界·结归放光）、§三 旁参与前接、§四 义理要点与名相、§五 注疏选要·诸家会读（5.1 澄观／5.2 法藏／5.2′ 智俨／5.2″ 慧苑〔**本品无记**·存疑直证〕／5.3 李通玄／5.3′ 海云／5.4 小结）、§六 文本对读与校勘（八十／六十·藏译／校勘记）、§七 结构分析·数据层（7.1–7.4）、§八 附录十一类（含中英要目）、§九 台账，**皆已成**。本品六十辅读以 **STEP0 新入库 `T09n0278_juan5.txt`（L.181）** 逐字回源，六十品题直证作**《菩萨明难品第六》**（六十不作「问明」）。凡未能确证者标〔待核〕、属推断者标〔本文判断〕；**不以骨架冒充细读**。\n> **原则**：沿用既定校勘纪律、三层疏解（疏解／名相／会读）、存疑必标、推断必标「〔本文判断〕」、讲者之说疑误只标不改、三译主从分明、不擅改经文、可回源可复核。**引注疏原文一律繁体照底本、逐字回源并注经号与段落；会读按语用简体。**\n\n---\n\n## 〇　凡例\n\n1. **引文体例**：经文、注疏一律**繁体照底本、逐字回源**，括注经号与字符位（如 `T10n0279`@115815）。会读、疏解、按语用简体。\n2. **信度标识**：〔待核〕存疑未确证；〔本文判断〕属笔者推断，非疏家定论；〔讲师玄谈·非正行〕海云讲记玄谈段；⚖ 诸家异说并记不裁断。\n3. **主从分明**：八十为正本，六十（`T09n0278` 卷五《菩萨明难品第六》）为辅读对勘本，四十无本品，藏译仅编目级对应。\n4. **异文不统一**：两译自歧处各照其底本，不据一译改另一译。\n5. **数须实测**：品内一切计数（字数／问答段数／偈首数／名数）皆由 §7.4 复算脚本实测得出，不手录、不臆造。\n\n---\n\n<!-- ATLAS:BEGIN P10 -->\n### 〇之零、导读指南（阅读路径与方法）\n\n**定位：** 考证型细读（philological close reading），以「可复核性」为第一优先。本品为十信之**解**门，读法当**以问为纲**：九首递问、文殊总酬，一问一答各成一义，而诸义同出一宗——「各各不相知」。\n**本品一句：** **心性差别，各各不相知；而一能应多，差别在机**——此十四字，为本品立宗，亦为下二品（行·德）之基。\n**路径：** 〇之二（二图四表）→ 一（品题与脉络）→ 二（全文逐段）→ 四（义理与名相）→ 五（诸家会读）→ 七（数据层）→ 附录按需查阅。\n**方法：** 先经文后诠释；〔实测〕／〔本文判断〕／〔存疑待核〕三分；负面证据同样入账；结构覆盖 100%，个体择要。\n**读前三问：** ① 九首何以各问一义，其次第是随意的还是有骨的？② 「各各不相知」何以能成立「一能应多」？③ 本品何故无三昧、无普贤、无放光，与前后品判然两体？\n\n## 〇之二、本品内容地图（未入其门，先观其海）\n\n> **本节体例。** 图与表之数据，一律取自本文已回源核定之 §二逐段表与 §7.1／§7.5 实测数；**凡属推断者标〔本文判断〕，不入图**。图各看一事，勿求一图而尽本品。\n\n### 〇之二.0 提要\n\n本品**剥校勘 CJK 3,133 字**（含标点 3,839），六十侧 3,088 字。全品为**十一「爾時」段**：九段文殊别问九首菩萨（各以偈答）、一段诸菩萨反问文殊（文殊以偈答）、一段佛神力遍照结归。偈颂「頌」×10（九酬＋文殊一酬），答式一律作「以頌答曰」。**问答体、无三昧名、无普贤**——与光明觉之「叙述—颂」二声部不同，本品是纯粹的「设难—酬解」结构。\n\n| 图 | 画什么 | 一句话 |\n|---|---|---|\n| **图 〇-1　十一「爾時」段骨架图** | 问如何成篇 | 九问九答 → 一反问一总答 → 一结归；十颂而止 |\n| **图 〇-2　九问归一宗图** | 义归何处 | 九义同出「各各不相知」，终归「佛境界」 |\n\n**〔读法之序〕**　先观图 〇-1 得十一「爾時」段之骨架，次观图 〇-2 得九问归一宗之义脉，次读〇之二.3 之坐标，然后入 §二逐段。**先见其骨，再味其偈。**\n\n> **EN corresponding · Map of the Chapter.** Eleven 「爾時」 units: nine bodhisattvas questioned by Mañjuśrī, each answering in verse; then the assembly questions Mañjuśrī, who answers in verse; then a closing line of Buddha-power. Ten verse-answers, no samādhi, no Samantabhadra, no light — a pure structure of challenge and reply. Fig. 0-1 lays out the eleven units; Fig. 0-2 traces the nine questions back to their single thesis: minds differ and none knows another.\n\n### 〇之二.1 图 〇-1　十一「爾時」段骨架图\n\n<figure>\n<svg viewBox=\"0 0 1000 470\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"24\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">十一「爾時」段：九酬 · 一总酬 · 一结归</text>\n<text x=\"500\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a7a5e\">答式一律「以頌答曰」×10（§7.4 实测）；无三昧名、无普贤、无放光</text>\n\n<rect x=\"30\" y=\"70\" width=\"120\" height=\"330\" rx=\"5\" fill=\"#f3ecdf\" stroke=\"#c9b98f\"/>\n<text x=\"90\" y=\"96\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#7a5a28\">文殊師利</text>\n<text x=\"90\" y=\"116\" text-anchor=\"middle\" font-size=\"11\" fill=\"#8a7a5e\">能问之主</text>\n<text x=\"90\" y=\"220\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5147\">九问皆自此出</text>\n<text x=\"90\" y=\"300\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5147\">末为诸菩萨</text>\n<text x=\"90\" y=\"318\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5147\">所反问，而自答</text>\n\n<g font-size=\"11.5\" fill=\"#5a5147\">\n<rect x=\"190\" y=\"74\" width=\"300\" height=\"30\" fill=\"#fff\" stroke=\"#d9cdb8\"/><text x=\"200\" y=\"94\">一 · 覺首 — 心性差別·各各不相知</text>\n<rect x=\"190\" y=\"108\" width=\"300\" height=\"30\" fill=\"#faf7f0\" stroke=\"#d9cdb8\"/><text x=\"200\" y=\"128\">二 · 財首 — 眾生非眾生·隨緣而化</text>\n<rect x=\"190\" y=\"142\" width=\"300\" height=\"30\" fill=\"#fff\" stroke=\"#d9cdb8\"/><text x=\"200\" y=\"162\">三 · 寶首 — 四大無我·業性九喻</text>\n<rect x=\"190\" y=\"176\" width=\"300\" height=\"30\" fill=\"#faf7f0\" stroke=\"#d9cdb8\"/><text x=\"200\" y=\"196\">四 · 德首 — 一法而無量·地火海風</text>\n<rect x=\"190\" y=\"210\" width=\"300\" height=\"30\" fill=\"#fff\" stroke=\"#d9cdb8\"/><text x=\"200\" y=\"230\">五 · 目首 — 福田一等·果報差別</text>\n<rect x=\"190\" y=\"244\" width=\"300\" height=\"30\" fill=\"#faf7f0\" stroke=\"#d9cdb8\"/><text x=\"200\" y=\"264\">六 · 勤首 — 一教何以不即斷結</text>\n<rect x=\"190\" y=\"278\" width=\"300\" height=\"30\" fill=\"#fff\" stroke=\"#d9cdb8\"/><text x=\"200\" y=\"298\">七 · 法首 — 受持正法而不斷煩惱</text>\n<rect x=\"190\" y=\"312\" width=\"300\" height=\"30\" fill=\"#faf7f0\" stroke=\"#d9cdb8\"/><text x=\"200\" y=\"332\">八 · 智首 — 智為上首·六度隨病</text>\n<rect x=\"190\" y=\"346\" width=\"300\" height=\"30\" fill=\"#fff\" stroke=\"#d9cdb8\"/><text x=\"200\" y=\"366\">九 · 賢首 — 一道出離·佛土萬殊</text>\n</g>\n\n<g stroke=\"#c9b98f\">\n<line x1=\"150\" y1=\"89\" x2=\"190\" y2=\"89\"/><line x1=\"150\" y1=\"123\" x2=\"190\" y2=\"123\"/><line x1=\"150\" y1=\"157\" x2=\"190\" y2=\"157\"/><line x1=\"150\" y1=\"191\" x2=\"190\" y2=\"191\"/><line x1=\"150\" y1=\"225\" x2=\"190\" y2=\"225\"/><line x1=\"150\" y1=\"259\" x2=\"190\" y2=\"259\"/><line x1=\"150\" y1=\"293\" x2=\"190\" y2=\"293\"/><line x1=\"150\" y1=\"327\" x2=\"190\" y2=\"327\"/><line x1=\"150\" y1=\"361\" x2=\"190\" y2=\"361\"/>\n</g>\n\n<text x=\"510\" y=\"96\" font-size=\"11.5\" fill=\"#8a7a5e\">每段皆「爾時，文殊師利菩薩問 X 菩薩言」</text>\n<text x=\"510\" y=\"116\" font-size=\"11.5\" fill=\"#8a7a5e\">→「時，X 菩薩以頌答曰」</text>\n<text x=\"510\" y=\"146\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 九首之名皆以「首」结：</text>\n<text x=\"510\" y=\"166\" font-size=\"11.5\" fill=\"#5a5147\">覺·財·寶·德·目·勤·法·智·賢</text>\n<text x=\"510\" y=\"186\" font-size=\"11.5\" fill=\"#8a7a5e\">——名即所答之法，非随便安立。〔本文判断〕</text>\n\n<rect x=\"510\" y=\"214\" width=\"440\" height=\"60\" rx=\"4\" fill=\"#f7ecd2\" stroke=\"#b8863c\"/>\n<text x=\"524\" y=\"236\" font-size=\"12\" font-weight=\"bold\" fill=\"#7a5a28\">段十 · 诸菩萨反问文殊</text>\n<text x=\"524\" y=\"258\" font-size=\"11.5\" fill=\"#5a5147\">「佛境界」十一问 → 文殊以颂总答</text>\n\n<rect x=\"510\" y=\"286\" width=\"440\" height=\"46\" rx=\"4\" fill=\"#ede4d2\" stroke=\"#c9b98f\"/>\n<text x=\"524\" y=\"306\" font-size=\"12\" font-weight=\"bold\" fill=\"#7a5a28\">段十一 · 长行结归</text>\n<text x=\"524\" y=\"324\" font-size=\"11.5\" fill=\"#5a5147\">佛神力遍照 · 十方世界六种震动</text>\n\n<text x=\"510\" y=\"372\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 十颂而止：九酬＋一总酬。「頌」×10 整齐，</text>\n<text x=\"510\" y=\"392\" font-size=\"11.5\" fill=\"#8a7a5e\">初稿记「×7 不齐」系 XML 换行空白假象（§6.1）。</text>\n<text x=\"510\" y=\"418\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 无三昧、无普贤、无放光——本品之「无」，</text>\n<text x=\"510\" y=\"438\" font-size=\"11.5\" fill=\"#8a7a5e\">正是其「有」：一切让位于问答。</text>\n</svg>\n<figcaption><b>图 〇-1　十一「爾時」段骨架图。</b>十一「爾時」段：九段一问一答，第十段反转为「诸菩萨问、文殊答」，第十一段以长行结归。<b>结构之妙在第十段之反转</b>——问者变为被问者，九首之义遂总摄于文殊一答。<b>九首之名皆以「首」结，名即所答之法</b>（觉·财·宝·德·目·勤·法·智·贤）〔本文判断〕。<div class=\"en-line\">Fig. 0-1. Eleven units: nine questions with nine verse-answers, then a reversal in which the assembly questions Mañjuśrī, then a prose close. The reversal is the structural pivot — the questioner becomes the respondent, and the nine answers gather into one. Each questioner's name ends in 首, \"chief\", and names the dharma he answers with.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. **九段是「平面」的，第十段才是「立体」的。** 前九段并列而不相属，第十段一出，九义始有总摄；**故读本品，当先读第十段，再回读前九段**。\n2. **名即法：九首之名不可滑过。** 觉首答「觉」，勤首答「勤」，法首答「法」——**华严之命名，非标识而是表法**。\n3. **「无」亦是结构。** 无三昧、无普贤、无放光，非经之缺，乃体之择：**问明之体，唯在言说**。\n\n### 〇之二.2 图 〇-2　九问归一宗图\n\n<figure>\n<svg viewBox=\"0 0 1000 500\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"24\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">九问归一宗：各各不相知 → 一能应多 → 佛境界</text>\n<text x=\"500\" y=\"46\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a7a5e\">中列为九段所答之义，左为所破之执，右为所显之宗（〔本文判断〕据 §4.1–4.5 归纳）</text>\n\n<rect x=\"330\" y=\"66\" width=\"340\" height=\"56\" rx=\"5\" fill=\"#f7ecd2\" stroke=\"#b8863c\" stroke-width=\"1.4\"/>\n<text x=\"500\" y=\"90\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#7a5a28\">宗：心性差別 · 各各不相知</text>\n<text x=\"500\" y=\"110\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5a5147\">段一 · 覺首（本品立宗）</text>\n\n<g font-size=\"11.5\" fill=\"#5a5147\">\n<rect x=\"40\" y=\"146\" width=\"260\" height=\"40\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/><text x=\"52\" y=\"171\">破「众生实有」→ 段二 財首</text>\n<rect x=\"40\" y=\"196\" width=\"260\" height=\"40\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/><text x=\"52\" y=\"221\">破「四大是我」→ 段三 寶首</text>\n<rect x=\"40\" y=\"246\" width=\"260\" height=\"40\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/><text x=\"52\" y=\"271\">破「一法是一」→ 段四 德首</text>\n<rect x=\"40\" y=\"296\" width=\"260\" height=\"40\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/><text x=\"52\" y=\"321\">破「福田不平等」→ 段五 目首</text>\n</g>\n\n<g font-size=\"11.5\" fill=\"#5a5147\">\n<rect x=\"700\" y=\"146\" width=\"260\" height=\"40\" fill=\"#ede4d2\" stroke=\"#c9b98f\"/><text x=\"712\" y=\"171\">显「随缘而化」</text>\n<rect x=\"700\" y=\"196\" width=\"260\" height=\"40\" fill=\"#ede4d2\" stroke=\"#c9b98f\"/><text x=\"712\" y=\"221\">显「业性如幻」</text>\n<rect x=\"700\" y=\"246\" width=\"260\" height=\"40\" fill=\"#ede4d2\" stroke=\"#c9b98f\"/><text x=\"712\" y=\"271\">显「一法无量」</text>\n<rect x=\"700\" y=\"296\" width=\"260\" height=\"40\" fill=\"#ede4d2\" stroke=\"#c9b98f\"/><text x=\"712\" y=\"321\">显「果报在机」</text>\n</g>\n\n<line x1=\"300\" y1=\"166\" x2=\"700\" y2=\"166\" stroke=\"#e0d6c2\"/><line x1=\"300\" y1=\"216\" x2=\"700\" y2=\"216\" stroke=\"#e0d6c2\"/><line x1=\"300\" y1=\"266\" x2=\"700\" y2=\"266\" stroke=\"#e0d6c2\"/><line x1=\"300\" y1=\"316\" x2=\"700\" y2=\"316\" stroke=\"#e0d6c2\"/>\n\n<g font-size=\"11.5\" fill=\"#5a5147\">\n<rect x=\"40\" y=\"346\" width=\"260\" height=\"40\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/><text x=\"52\" y=\"371\">破「闻教即断」→ 段六 勤首</text>\n<rect x=\"40\" y=\"396\" width=\"260\" height=\"40\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/><text x=\"52\" y=\"421\">破「受持即证」→ 段七 法首</text>\n<rect x=\"40\" y=\"446\" width=\"260\" height=\"40\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/><text x=\"52\" y=\"471\">破「一法独尊」→ 段八 智首</text>\n</g>\n<g font-size=\"11.5\" fill=\"#5a5147\">\n<rect x=\"700\" y=\"346\" width=\"260\" height=\"40\" fill=\"#ede4d2\" stroke=\"#c9b98f\"/><text x=\"712\" y=\"371\">显「功在积渐」</text>\n<rect x=\"700\" y=\"396\" width=\"260\" height=\"40\" fill=\"#ede4d2\" stroke=\"#c9b98f\"/><text x=\"712\" y=\"421\">显「解须起行」</text>\n<rect x=\"700\" y=\"446\" width=\"260\" height=\"40\" fill=\"#ede4d2\" stroke=\"#c9b98f\"/><text x=\"712\" y=\"471\">显「智为上首·随病设药」</text>\n</g>\n<line x1=\"300\" y1=\"366\" x2=\"700\" y2=\"366\" stroke=\"#e0d6c2\"/><line x1=\"300\" y1=\"416\" x2=\"700\" y2=\"416\" stroke=\"#e0d6c2\"/><line x1=\"300\" y1=\"466\" x2=\"700\" y2=\"466\" stroke=\"#e0d6c2\"/>\n\n<rect x=\"330\" y=\"146\" width=\"340\" height=\"300\" fill=\"none\" stroke=\"#b8863c\" stroke-dasharray=\"6 5\"/>\n<text x=\"500\" y=\"180\" text-anchor=\"middle\" font-size=\"12\" fill=\"#b8863c\">段九 · 賢首：一道出離而佛土萬殊</text>\n<text x=\"500\" y=\"210\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#8a7a5e\">——「各各不相知」之极致：</text>\n<text x=\"500\" y=\"230\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#8a7a5e\">道一而土万，佛一而机万</text>\n<text x=\"500\" y=\"262\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#8a7a5e\">八义既立，终以「佛境界」</text>\n<text x=\"500\" y=\"282\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#8a7a5e\">十一问收之（段十）</text>\n<text x=\"500\" y=\"314\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#8a7a5e\">→ 佛神力遍照（段十一）</text>\n<text x=\"500\" y=\"352\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 九义非九个道理，</text>\n<text x=\"500\" y=\"372\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#8a7a5e\">乃一理之九面：</text>\n<text x=\"500\" y=\"392\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#7a5a28\">所破者「同」，所显者「异」；</text>\n<text x=\"500\" y=\"412\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#7a5a28\">异而不碍同，故终归佛境。</text>\n</svg>\n<figcaption><b>图 〇-2　九问归一宗图。</b>左破右显，中为九段所答之义，末以「佛境界」收。<b>九义不是九个道理，而是一理之九面</b>：所破者「同」（众生实有、四大是我、一法是一、福田平等……），所显者「异」（随缘、如幻、无量、在机）。<b>异而不碍同，故终归佛境</b>〔本文判断〕。此图之义，可与 §4.1–4.5 互证。<div class=\"en-line\">Fig. 0-2. Nine answers, one thesis. What is broken on the left is sameness — that beings are solid, that the four elements are self, that one dharma is one, that the field is equal; what is shown on the right is difference — arising by conditions, illusory karmic nature, the one dharma as measureless, fruit according to capacity. Difference without obstructing sameness: hence the close in Buddha-realm.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. **「各各不相知」不是断灭，是「不混」。** 心心有自有之相，故不相知；**不相知故能相即而不相乱**——此为下品「解」之根。\n2. **九问之次第，由境而心而教而智。** 前五问「法」，六七问「教」，八九问「行」与「智」——**次第非随意，乃自外而内、自解而行**。\n3. **终以「佛境界」十一问收者，示「解」之限。** 九义可解，佛境不可解；**故以问终，不以答终**。\n\n### 〇之二.3 本品在第二会（普光明殿·说十信）之坐标\n\n本品为第二会第四品，**十信三品（解·行·德）之首**。前三品明所信之果（三业），本品以下转入能信之行——法藏「信中解行及德，明難辨解，居初故來」。\n\n| 品 | 卷 | 位／科 | 一句提撕 | 与本品之关系 |\n|---|---|---|---|---|\n| 7–9 名号·四谛·光明觉 | 卷12–13 | 所信果·三业 | 身·口·意遍 | 果境已毕 |\n| **10 菩萨问明（本品）** | 卷13 | 十信·**解** | 九首递问，文殊总酬 | 解为行德之本，故居首 |\n| 11 净行 | 卷14 | 十信·**行** | 141 誓，遇事发愿 | 解而后行 |\n| 12 贤首 | 卷14–15 | 十信·**德** | 信为道元功德母 | 行而后德 |\n\n### 〇之二.4 本品形式特征（与邻品对看）\n\n本品之特色在**「纯问答体」**：无三昧、无放光、无普贤、无动地，一切唯是言说。**在全部三十九品中，以如此纯粹的「设难—酬解」构成一整品者，唯此一品**〔本文判断·据本文所核诸品结构〕。\n\n| 特征 | 本品表现〔实测〕 | 邻品之对照 | 读法上的后果 |\n|---|---|---|---|\n| 纯问答体 | 十一「爾時」段，九问九答＋一反问一总答＋一结 | 第九品无问而说，问号 ×0 | 一以言诘，一以境示 |\n| 答式统一 | 「以頌答曰」×10（剥空白口径整齐） | 第十二品问号 ×0，以偈问 | 同是偈，一为答，一为问 |\n| 无三昧·无普贤 | 全品三昧名 ×0，普贤 ×0 | 第十五品法慧入无量方便定 | 定在此品让位于慧 |\n| 立宗分明 | 「各各不相知」一处立宗，九段分疏 | 第十一品以「善用其心」一句总持 | 一以理立，一以行立 |\n| 校勘 | 「頌」×10 整齐；初稿「×7 不齐」系 XML 空白假象 | 第九品界标有目录泄漏见 | 文本现象须先辨器，后断经 |\n\n### 〇之二.5 五种读法（导览）\n\n| 读法 | 路径 | 适合谁 | 得什么 |\n|---|---|---|---|\n| **问读** | 只读九问之问句，不读答 | 初读本篇者 | 见九问之次第与所破 |\n| **答读** | 只读九答之偈，参图 〇-2 | 欲见义者 | 见九义之一宗 |\n| **喻读** | 取段三·段四·段五之喻，比较其喻法 | 好文学者 | 见「一法多喻」之巧 |\n| **校读** | §6.1 六十对读 ＋ §7.4 实测 | 欲核文本者 | 得「頌×10」之实 |\n| **承读** | 本品 §4.1 → 第十一品 §2.2（善用其心） | 欲见解行相即者 | 见「解」如何落地为「行」 |\n\n### 〇之二.6 数与位之谱：本品之数，四等分录\n\n华严之数非计数之数。本品所涉之数，来源不一，性质亦不一；**先分其等，后论其义**，则不为数目所惑。\n\n| 等第 | 数 | 出处 | 性质 |\n|---|---|---|---|\n| **T0 经文明文** | 「以頌答曰」×10 | `T10n0279` 卷十三 | 答式（结构标志） |\n| **T0 经文明文** | 「各各不相知」 | 同上·段一 | 本品立宗之句 |\n| **T0 本文实测** | 3,133 字（含标点 3,839） | §7.4 脚本 | 计数（本文自测） |\n| **T0 本文实测** | 十一「爾時」段・頌 ×10 | §7.4 实测 | 计数（本文自测） |\n| **T1 澄观《疏》** | 「三品明信有解行德。解為二本，此品先来」 | `T1735`@167350 | 三品分判之据 |\n| **T1 法藏《探玄记》** | 「明難辨解，居初故來」 | `T1733`@116220 | 与澄观同判 |\n| **T1 慧苑** | 本品无专段（存疑直证） | `X0221` | 负面证据，如实记 |\n\n> **〔读法〕** 本品之数最简：十一（段）、十（颂）、九（首）。**三段之数皆有对验**：段以「爾時」为界，颂以「以頌答曰」为界，首以名数为界——三界皆可复算，故 §7.4 之脚本能自证。\n\n<!-- ATLAS:END P10 -->\n\n## 一　概述\n\n### 1.1 品题解义\n\n**菩薩問明品第十**（八十·卷十三）；**菩薩明難品第六**（六十·卷五）。\n\n- **八十题「问明」释义（澄观）**：「菩薩是人，問明是法。遮果表因故云菩薩。問即是難，明即是答……**問有二種**：一汎爾相問，梵云**必理車**；二者難問，謂以理徵詰，梵云**鉢羅室囊**，即今品意也。**答亦有二**：一但依問詶報曰答；二若俱為解釋、旁兼異義、美言讚述、令理顯煥曰明，即今品意也。明亦破闇，能除問者之疑闇故。今**文殊九首互為明難，遞作碪椎，研覈教理以悟群生**」（`T1735`@167350·§5.1）。又：「長行明起於問，偈頌明解於問，故曰問明。不云答者，欲以明兼於問故……**十菩薩問出十種法明，故曰問明**。依主釋也」。\n- **六十题「明难」释义（法藏）**：「菩薩是人，明難是法。簡異果法故依主釋。**明難有四義**：一約心境，難謂真俗幽邃，明謂妙智朗照；二約教義，難謂十義甚深，明謂往復顯暢；三約論道，謂難問明答，以通問答故名明難。**何者：但舉法直諮曰問，非理詰責為難，隨問直陳曰答，委釋顯煥為明**」（`T1733`@116220·§5.2）。\n- **智俨**：「明難者有二：一約法，明十義深微故也；二約辭，論難顯義情故也。明者教，難者十義。又明者智，難者論道也」（`T1732`@24718·§5.2′）。\n- **名目异译要点**：八十就「问→明（答之显焕者）」立名，六十就「明（智／教）→难（理／十义）」立名，**取义方向相反（问明／明难）而旨归一致**（澄观、法藏均以「难＝问、明＝答」互通·⚖ §5.4）。〔本文判断〕名异源于两译所据梵本传写之题序，非义理分歧。\n\n### 1.2 品位与脉络（承上启下）\n\n本品在**第二会·普光明殿**（差别因果周·说十信）。第九品《光明觉》明佛**意业遍觉**、总标所信果境；问明以下转入**「能依能信之行」**，为十信法门之**解**门开篇。三条脉络须并观：\n\n- **会内次**：名号（身业·遍应）→四圣谛（口业·说法遍周）→光明觉（意业·遍觉）→**问明（十信之解）**→净行（十信之行）→贤首（十信之德）——问明居中，承果启因。法藏判：「前明所依果法，今辯依果所成因行故也。所成行中，位前方便信行最初。信中解行及德，**明難辨解，居初故來**」（`T1733`@116220）。\n- **三品共成十信**：澄观「生解因中先答十住，住揽信成，将答所成，先辨能成，又正答十信，故下三品来也……**三品明信有解行德。解為二本，此品先来**」（`T1735`@167350）；李通玄「又說光明覺品、菩薩問明品、淨行品、賢首品，**成就十信之門**」（`T1739`@41803）。\n- **十信解→行→德段之纲**（演钞链·承 L.180）：「故受之以光明覺品……故受之以淨行品……故受之以賢首品。**上之三品，明十信法**」——问明为「解」，净行为「行」，贤首为「德」，三品共成十信（`T1736`@~190976·§3）。\n\n### 1.3 篇幅与结构量级（实测）\n\n本品八十侧**净身 CJK 3,133 字**（含标点 3,839·品界 @115815–120214，止于卷十三尾题前，见 §7.4）；六十侧《菩萨明难品》**净身 CJK 3,088 字**（剥空白含标点 3,769·raw 含换行 3,993·`juan5.txt`@7719–卷五尾题前）。全品为**十一「爾時」段**：九段文殊别问九首菩萨、一段诸菩萨反问文殊、一段佛神力遍照结归（实测 §7.4）；偈颂「頌」×10（八十侧·九酬＋文殊一酬），答式一律作「以頌答曰」（剥空白口径×10·整齐，实测 §7.4；初稿记「×7不齐」系 XML 换行空白假象，L.183 照记订正·详见 §6.1）。**问答体、无三昧名、无普贤**——与光明觉之「叙述—颂」二声部不同，本品是纯粹的「设难—酬解」对答结构。\n\n### 1.4 核心要义（画龙点睛·EN）\n\n1. *Each dharma does not know any other* — mind, karma, retribution, cause, condition, wisdom, and object mutually \"do not know\" one another; like river water, flame, wind, and earth, all arise dependently yet without any knowing agent (§2.1, the chapter's signature thesis).\n2. *One nature, manifold responses* — the Buddha awakens to one dharma yet teaches boundless dharmas, like one earth bearing diverse sprouts, one fire burning diversely, one moon reflected everywhere: differentiation is in the respondent, never in the dharma (§2.4, 德首 / §2.5, 目首).\n3. *Faith's understanding gate* — as the opening of the ten-faith (daśa-śi) sequence, the chapter establishes *解* (adhimukti-understanding) before practice (净行) and virtue (贤首); the ten \"head\"-bodhisattvas mark faith as the first entry into the path (§5.2, §5.3).\n\n### 1.5 经文文本现象与信度标识\n\n- **「十首」与「九首」之辨（关键文本现象·直证）**：实测八十侧**文殊别问九位「首」菩萨**（覺·財·寶·德·目·**勤**·法·智·賢首），加**文殊自身**（末段酬诸菩萨「佛境界」问）共成**十首**（daśaśi）。故澄观题「**文殊九首互為明難**」（`T1735`@167350·九首＋文殊＝十），而李通玄题「**十首菩薩**皆從十色世界十智如來所來……是故所來菩薩皆名為首」（`T1739`@41803）。〔本文判断〕「九首」计问答中之问对象（不含文殊），「十首」通文殊而言之，两家数异而所指同。⚖ 六十侧第九段文殊问对象作「**進首**」（八十作「**勤首**」·§6.1），系两译译名之异，非数之差。\n- **「頌／偈」译式差**：八十侧十酬**一律**「以**頌**答曰」（剥空白口径×10·实测），六十侧作「以**偈**答曰」×9＋「以偈答**言**」×1（宝首段·§6.1）；六十侧「頌」字×0（实测 §7.4）——八十存「颂」字统式，六十全用「偈」字。\n- **六度译名层**：智首段，八十以**意译**列「布施·持戒·堪忍·精进·禅定·智慧」＋「慈·悲·喜·捨」，六十以**音译**列「檀·尸·羼提·毘梨耶·禪·般若波羅蜜」（§6.1）——同段两译一义一音，是八十新译与六十旧译通例差之最整齐样本。\n- **「境／法」异**：觉首难，八十「智不知**境**，境不知智」，六十「智不知**法**，法不知智」（§6.1）——本品签名「各各不相知」之末对，两译收语不同。\n- **「各各／二俱」异**：觉首颂，八十「是故彼一切，**各各**不相知」（全品「各各不相知」×6），六十「是故一切法，**二俱**不相知」（「二俱不相知」×5·§6.1）——义同辞异。\n- **慧苑《刊定记》本品无记（重要存疑直证·§5.2″）**：实测 X0221 光明觉释段（@118966 NFKC）之后**直接衔接「淨行品第十一·將釋此品」**（@135027），中间 16,061 字符区间**「問明」×0、「明難」×0**——与 P9 所证「X0221 有《光明觉》记」适成对照，坐实**慧苑刊定记现存本缺问明品专段**（或本就删并、或现存本夺页）。全库「問明品」4 见（@12701／24523／83501／193159）**全系他处征引**，非本品科判。〔待核·现存本无问明专段，夺抑本无，无机校勘，不作断言〕。\n\n### 1.6 版本与对读材料\n\n- 八十 `T10n0279` 卷十三（正）·六十 `T09n0278` 卷五《菩萨明难品第六》（辅·STEP0 新档逐字回源）。\n- 四十 `T10n297` 无本品（属入法界品系统）。\n- 藏译仅编目级对应（`data/translation/diff_matrix.yaml` order 10〔待核本批未取编号·暂记〕）；本机无德格版 Toh 44，逐字对勘〔待核〕。\n- 海云讲记 **Ep11**（菩萨问明品·智首所問十具足·玄谈段），正行逐字段待 Ep16+（未上架·§5.3′）。\n\n### 1.7 核心要义小结\n\n本品以「问明」立宗，**文殊与十首菩萨互设十难十酬**，会归「**诸法各各不相知**」之缘起无自性义：心性是一而见有差别，非心性有异，乃众生业行不同（觉首·德首·目首三难递明）；如來一法而成无量，**差別在机不在法**；智首难明六度四等**随病设药**、非一法可得菩提；贤首难明一乘一道而佛土万殊，结归「**一切诸佛身，唯是一法身，一心一智慧，力无畏亦然**」。末段诸菩萨返问「佛境界」十一，文殊酬以「**非識所能識，亦非心境界，其性本清淨，開示諸群生**」，再以佛神力遍照十方差别悉现收束——与光明觉放光相表里，然光明觉现**境**、问明启**解**，一为所信果相、一为能信之解，脉络秩然。\n\n---\n\n## 二　全文逐段细读\n\n> 引文逐字回源 CBETA `T10n0279`（繁体原字形·卷十三）。长行设难、偈颂酬解分层引；全品十一段，此处依问答次第分段细读。六十对读异文随段括注，汇总见 §六。\n\n### 2.0 段次总览（实测·§7.4 `_p10_body.txt` 坐标）\n\n| 段 | 起「爾時」@（品内偏移） | 声部 | 主题 |\n|---|---|---|---|\n| T1 | 7 | 文殊问觉首·觉首偈答 | 心性是一·种种差别·各各不相知 |\n| T2 | 403 | 文殊问财首·财首偈答 | 众生非众生·如來随十（十一）而化 |\n| T3 | 752 | 文殊问宝首·宝首偈答 | 四大无我·苦乐端正业性九喻 |\n| T4 | 1092 | 文殊问德首·德首偈答 | 一法而说无量·地火海风等九喻 |\n| T5 | 1458 | 文殊问目首·目首偈答 | 福田一等·果报差别·十喻 |\n| T6 | 1817 | 文殊问勤首·勤首偈答 | 一教何以不即断结·九「懈怠者亦然」 |\n| T7 | 2176 | 文殊问法首·法首偈答 | 受持正法而不断烦恼·九「多闻亦如是」 |\n| T8 | 2548 | 文殊问智首·智首偈答 | 智为上首·六度四等随病赞·基堵城廓喻 |\n| T9 | 2908 | 文殊问贤首·贤首偈答 | 一道出离·佛土万殊·一法身一心一智 |\n| T10 | 3276 | 诸菩萨问文殊·文殊偈答 | 佛境界十一问·非识所能识 |\n| T11 | 3667 | 长行结 | 佛神力遍照·九差别悉现十方 |\n\n**〔L.188 本批〕上十一段之长行设难、偈颂酬答已**全量入文**（§2.1–§2.11 逐段全文·32 单元程序化摘取·0 手抄；实测：长行 21 单元 1,107 字·偈颂 10 单元 2,019 字·`<l>` 颂行合计 202）。\n\n### 2.1 段（一）·文殊问觉首·觉首偈答（心性差别·各各不相知）\n\n**设难（长行·全引·〔L.188 本批〕）**：\n\n> 「爾時，文殊師利菩薩問覺首菩薩言：「佛子！心性是一。云何見有種種差別？所謂：往善趣、惡趣；諸根滿、缺；受生同、異；端正、醜陋；苦、樂不同；業不知心，心不知業；受不知報，報不知受；心不知受，受不知心；因不知緣，緣不知因；智不知境，境不知智。」」\n\n（`T10n0279` 卷十三·逐字（`_e10_full.py` 品内 div 结构化·`_e10_dump.txt`）·颂前接「爾時，X首菩薩以頌答曰」公式·3 单元）\n\n**酬解（偈·全引·〔L.188 本批〕）**：\n\n> 「仁今問是義，為曉悟群蒙，我如其性答，惟仁應諦聽。諸法無作用，亦無有體性，是故彼一切，各各不相知。譬如河中水，湍流競奔逝，各各不相知，諸法亦如是。亦如大火聚，猛焰同時發，各各不相知，諸法亦如是。又如長風起，遇物咸鼓扇，各各不相知，諸法亦如是。又如眾地界，展轉因依住，各各不相知，諸法亦如是。眼耳鼻舌身，心意諸情根，以此常流轉，而無能轉者。法性本無生，示現而有生，是中無能現，亦無所現物。眼耳鼻舌身，心意諸情根，一切空無性，妄心分別有。如理而觀察，一切皆無性，法眼不思議，此見非顛倒。若實若不實，若妄若非妄，世間出世間，但有假言說。」\n\n（`T10n0279` 卷十三·逐字（`_e10_full.py` 品内 div 结构化·`_e10_dump.txt`）·本偈 `<l>` 行数实测见 §7.5 L2）\n\n**疏解**：此为本品**立宗之段**。难眼在「心性是一，云何见有种种差别」——心既是一，苦乐、根满缺、端正丑陋之差别何从而生？答不直解差别所自起，而**转破「知」之主体**：业、心、受、报、因、缘、智、境八法**互不相知**（「業不知心，心不知業」五对·实测「不知」结构），故差别非有一「作者／知者」使之然，唯缘起假说。澄观科「長行明起於問，偈頌明解於問」（§5.1）。偈以**河水·火聚·长风·地界**四喻显「各各不相知」，再以「眼耳鼻舌身心意」六情根「常流转而无能转者」点出**无作者之流转**——是本品核心命题「诸法无作用、无体性」之直陈。⚖ 六十此段「智不知**法**，法不知智」（八十作「境」），「**二俱**不相知」（八十「各各」），义同辞异（§6.1）。\n\n### 2.2 段（二）·文殊问财首·财首偈答（众生非众生·随缘而化）\n\n**设难（长行·全引·〔L.188 本批〕）**：\n\n> 「爾時，文殊師利菩薩問財首菩薩言：「佛子！一切眾生非眾生。云何如來隨其時、隨其命、隨其身、隨其行、隨其解、隨其言論、隨其心樂、隨其方便、隨其思惟、隨其觀察，於如是諸眾生中，為現其身，教化調伏？」」\n\n（`T10n0279` 卷十三·逐字（`_e10_full.py` 品内 div 结构化·`_e10_dump.txt`）·颂前接「爾時，X首菩薩以頌答曰」公式·6 单元）\n\n**酬解（偈·全引·〔L.188 本批〕）**：\n\n> 「此是樂寂滅，多聞者境界，我為仁宣說，仁今應聽受。分別觀內身，此中誰是我，若能如是解，彼達我有無。此身假安立，住處無方所，諦了是身者，於中無所著。於身善觀察，一切皆明見，知法皆虛妄，不起心分別。壽命因誰起，復因誰退滅，猶如旋火輪，初後不可知。智者能觀察，一切有無常，諸法空無我，永離一切相。眾報隨業生，如夢不真實，念念常滅壞，如前後亦爾。世間所見法，但以心為主，隨解取眾相，顛倒不如實。世間所言論，一切是分別，未曾有一法，得入於法性。能緣所緣力，種種法出生，速滅不暫停，念念悉如是。」\n\n（`T10n0279` 卷十三·逐字（`_e10_full.py` 品内 div 结构化·`_e10_dump.txt`）·本偈 `<l>` 行数实测见 §7.5 L2）\n\n**疏解**：难在「既众生即非众生（无实众生），如來何故随种种因缘差别而现身调伏」。答会归「**万法唯心**」——「世間所見法，但以心為主，隨解取眾相」，差别在心之取相，非如來有异；「旋火轮」喻初后不可得，显寿命业行之无实。六十此难作「**隨眾生時、隨命……隨眾生見而教化之**」（十一随·八十十随·§6.1）。\n\n### 2.3 段（三）·文殊问宝首·宝首偈答（四大无我·业性九喻）\n\n**设难（长行·全引·〔L.188 本批〕）**：\n\n> 「爾時，文殊師利菩薩問寶首菩薩言：「佛子！一切眾生，等有四大，無我、無我所。云何而有受苦、受樂，端正、醜陋，內好、外好，少受、多受，或受現報，或受後報？然法界中，無美、無惡。」」\n\n（`T10n0279` 卷十三·逐字（`_e10_full.py` 品内 div 结构化·`_e10_dump.txt`）·颂前接「爾時，X首菩薩以頌答曰」公式·9 单元）\n\n**酬解（偈·全引·〔L.188 本批〕）**：\n\n> 「隨其所行業，如是果報生，作者無所有，諸佛之所說。譬如淨明鏡，隨其所對質，現像各不同，業性亦如是。亦如田種子，各各不相知，自然能出生，業性亦如是。又如巧幻師，在彼四衢道，示現眾色相，業性亦如是。如機關木人，能出種種聲，彼無我非我，業性亦如是。亦如眾鳥類，從㲉而得出，音聲各不同，業性亦如是。譬如胎藏中，諸根悉成就，體相無來處，業性亦如是。又如在地獄，種種諸苦事，彼悉無所從，業性亦如是。譬如轉輪王，成就勝七寶，來處不可得，業性亦如是。又如諸世界，大火所燒然，此火無來處，業性亦如是。」\n\n（`T10n0279` 卷十三·逐字（`_e10_full.py` 品内 div 结构化·`_e10_dump.txt`）·本偈 `<l>` 行数实测见 §7.5 L2）\n\n**疏解**：宝首以**镜·田种·幻师·木人·鸟·胎·地狱·轮王·世界火**九喻，层层显「业性无作者、无来处」——苦乐端丑果报之差，如镜像依质而现，无自在作者。「**作者無所有**」是全段眼目，与觉首「无能转者」、财首「以心为主」三难递明同一无主缘起义。六十「內好、外好」（八十「端正、醜陋」）、「如親因緣會，受生無來者」（八十「譬如胎藏中，諸根悉成就」·§6.1）。\n\n### 2.4 段（四）·文殊问德首·德首偈答（一法而无量·地火海风等九喻）\n\n**设难（长行·全引·〔L.188 本批〕）**：\n\n> 「爾時，文殊師利菩薩問德首菩薩言：「佛子！如來所悟，唯是一法。云何乃說無量諸法，現無量剎，化無量眾，演無量音，示無量身，知無量心，現無量神通，普能震動無量世界，示現無量殊勝莊嚴，顯示無邊種種境界？而法性中，此差別相，皆不可得。」」\n\n（`T10n0279` 卷十三·逐字（`_e10_full.py` 品内 div 结构化·`_e10_dump.txt`）·颂前接「爾時，X首菩薩以頌答曰」公式·12 单元）\n\n**酬解（偈·全引·〔L.188 本批〕）**：\n\n> 「佛子所問義，甚深難可了，智者能知此，常樂佛功德。譬如地性一，眾生各別住，地無一異念，諸佛法如是。亦如火性一，能燒一切物，火焰無分別，諸佛法如是。亦如大海一，波濤千萬異，水無種種殊，諸佛法如是。亦如風性一，能吹一切物，風無一異念，諸佛法如是。亦如大雲雷，普雨一切地，雨滴無差別，諸佛法如是。亦如地界一，能生種種芽，非地有殊異，諸佛法如是。如日無雲曀，普照於十方，光明無異性，諸佛法如是。亦如空中月，世間靡不見，非月往其處，諸佛法如是。譬如大梵王，應現滿三千，其身無別異，諸佛法如是。」\n\n（`T10n0279` 卷十三·逐字（`_e10_full.py` 品内 div 结构化·`_e10_dump.txt`）·本偈 `<l>` 行数实测见 §7.5 L2）\n\n**疏解**：难在「一法之悟，何成无量之事」。答以**地·火·海·风·云雷·地界·日·月·梵王**九喻，显「**一能应多而常一**」——地一而众生别住，月一而千江各见，「非月往其处」，差別全在感应之机，佛法本身「无分别」「无异念」。此为「一多相即」之经文表述，澄观后判属「显菩提体性」层（§5.1）。⚖ 六十「亦如**龍雷**震」（八十「大雲雷」），「亦如大海水，注以百川流，其味無別異」（八十「大海一，波濤千萬異，水無種種殊」·§6.1）。\n\n### 2.5 段（五）·文殊问目首·目首偈答（福田一等·果报差别·十喻）\n\n**设难（长行·全引·〔L.188 本批〕）**：\n\n> 「爾時，文殊師利菩薩問目首菩薩言：「佛子！如來福田，等一無異。云何而見眾生布施果報不同？所謂：種種色、種種形、種種家、種種根、種種財、種種主、種種眷屬、種種官位、種種功德、種種智慧；而佛於彼，其心平等，無異思惟。」」\n\n（`T10n0279` 卷十三·逐字（`_e10_full.py` 品内 div 结构化·`_e10_dump.txt`）·颂前接「爾時，X首菩薩以頌答曰」公式·15 单元）\n\n**酬解（偈·全引·〔L.188 本批〕）**：\n\n> 「譬如大地一，隨種各生芽，於彼無怨親，佛福田亦然。又如水一味，因器有差別，佛福田亦然，眾生心故異。亦如巧幻師，能令眾歡喜，佛福田如是，令眾生敬悅。如有才智王，能令大眾喜，佛福田如是，令眾悉安樂。譬如淨明鏡，隨色而現像，佛福田如是，隨心獲眾報。如阿揭陀藥，能療一切毒，佛福田如是，滅諸煩惱患。亦如日出時，照曜於世間，佛福田如是，滅除諸黑暗。亦如淨滿月，普照於大地，佛福田亦然，一切處平等。譬如毘藍風，普震於大地，佛福田如是，動三有眾生。譬如大火起，能燒一切物，佛福田如是，燒一切有為。」\n\n（`T10n0279` 卷十三·逐字（`_e10_full.py` 品内 div 结构化·`_e10_dump.txt`）·本偈 `<l>` 行数实测见 §7.5 L2）\n\n**疏解**：难在「福田既平等无异，何故施者果报千差」。答以**地·水·幻师·王·镜·阿揭陀药·日·月·毘蓝风·火**十喻，点出「**一水因器而殊**」——「水一味，因器有差別，佛福田亦然，眾生心故異」，差在器（众生心），不在水（福田）。目首颂八十每首结「佛福田如是」，六十结「諸佛**聖**福田」（§6.1）；八十「如**阿揭陀**藥」六十作「譬如**大藥王**」（药名异译·§6.1）。\n\n### 2.6 段（六）·文殊问勤首·勤首偈答（一教何以不即断结）\n\n**设难（长行·全引·〔L.188 本批〕）**：\n\n> 「爾時，文殊師利菩薩問勤首菩薩言：「佛子！佛教是一，眾生得見，云何不即悉斷一切諸煩惱縛而得出離？然其色蘊、受蘊、想蘊、行蘊、識蘊，欲界、色界、無色界，無明、貪愛，無有差別，是則佛教。於諸眾生，或有利益？或無利益？」」\n\n（`T10n0279` 卷十三·逐字（`_e10_full.py` 品内 div 结构化·`_e10_dump.txt`）·颂前接「爾時，X首菩薩以頌答曰」公式·18 单元）\n\n**酬解（偈·全引·〔L.188 本批〕）**：\n\n> 「佛子善諦聽，我今如實答，或有速解脫，或有難出離。若欲求除滅，無量諸過惡，當於佛法中，勇猛常精進。譬如微少火，樵濕速令滅，於佛教法中，懈怠者亦然。如鑽燧求火，未出而數息，火勢隨止滅，懈怠者亦然。如人持日珠，不以物承影，火終不可得，懈怠者亦然。譬如赫日照，孩稚閉其目，怪言何不覩，懈怠者亦然。如人無手足，欲以芒草箭，遍射破大地，懈怠者亦然。如以一毛端，而取大海水，欲令盡乾竭，懈怠者亦然。又如劫火起，欲以少水滅，於佛教法中，懈怠者亦然。如有見虛空，端居不搖動，而言普騰躡，懈怠者亦然。」\n\n（`T10n0279` 卷十三·逐字（`_e10_full.py` 品内 div 结构化·`_e10_dump.txt`）·本偈 `<l>` 行数实测见 §7.5 L2）\n\n**疏解**：难在「佛教是一、理无差别，何以众生或有离结或不断」。答归**懈怠**——非法有增损，乃机有勤惰；九喻（湿薪灭火·钻火数息·火珠离影·闭目怪日·无手欲射·一毛竭海·少灭劫火·居空言腾）皆显「因缺缘不具」之义。八十名「**勤首**」、六十名「**進首**」（§6.1）；此难八十「欲界色界无色界·无明贪爱」，六十作「色受想行识·欲界色界无色界·痴爱」（蕴名略异）。\n\n### 2.7 段（七）·文殊问法首·法首偈答（受持正法而不断烦恼）\n\n**设难（长行·全引·〔L.188 本批〕）**：\n\n> 「爾時，文殊師利菩薩問法首菩薩言：「佛子！如佛所說：『若有眾生，受持正法，悉能除斷一切煩惱。』何故復有受持正法而不斷者？隨貪、瞋、癡，隨慢、隨覆、隨忿、隨恨、隨嫉、隨慳、隨誑、隨諂，勢力所轉，無有離心。能受持法，何故復於心行之內起諸煩惱？」」\n\n（`T10n0279` 卷十三·逐字（`_e10_full.py` 品内 div 结构化·`_e10_dump.txt`）·颂前接「爾時，X首菩薩以頌答曰」公式·21 单元）\n\n**酬解（偈·全引·〔L.188 本批〕）**：\n\n> 「佛子善諦聽，所問如實義，非但以多聞，能入如來法。如人水所漂，懼溺而渴死，於法不修行，多聞亦如是。如人設美膳，自餓而不食，於法不修行，多聞亦如是。如人善方藥，自疾不能救，於法不修行，多聞亦如是。如人數他寶，自無半錢分，於法不修行，多聞亦如是。如有生王宮，而受餧與寒，於法不修行，多聞亦如是。如聾奏音樂，悅彼不自聞，於法不修行，多聞亦如是。如盲繢眾像，示彼不自見，於法不修行，多聞亦如是。譬如海船師，而於海中死，於法不修行，多聞亦如是。如在四衢道，廣說眾好事，內自無實德，不行亦如是。」\n\n（`T10n0279` 卷十三·逐字（`_e10_full.py` 品内 div 结构化·`_e10_dump.txt`）·本偈 `<l>` 行数实测见 §7.5 L2）\n\n**疏解**：难在「受持（多闻）何以不断烦恼」。答直破「**多闻即道**」之迷：「非但以多聞，能入如來法」——如漂者渴死、设膳自饿、善医不救己、数宝他财、聋奏乐、盲绘画、船师海中死，皆喻**闻而不行无益**。此段为全品「解须起行」之关键，直接引出下二品（净行·贤首）之行德。六十「非但**積**多聞」「**不能如說行**，多聞亦如是」（八十「於法不修行」·§6.1）。\n\n### 2.8 段（八）·文殊问智首·智首偈答（智为上首·六度四等随病赞）\n\n**设难（长行·全引·〔L.188 本批〕）**：\n\n> 「爾時，文殊師利菩薩問智首菩薩言：「佛子！於佛法中，智為上首。如來何故，或為眾生讚歎布施，或讚持戒，或讚堪忍，或讚精進，或讚禪定，或讚智慧，或復讚歎慈、悲、喜、捨？而終無有唯以一法，而得出離成阿耨多羅三藐三菩提者。」」\n\n（`T10n0279` 卷十三·逐字（`_e10_full.py` 品内 div 结构化·`_e10_dump.txt`）·颂前接「爾時，X首菩薩以頌答曰」公式·24 单元）\n\n**酬解（偈·全引·〔L.188 本批〕）**：\n\n> 「佛子甚希有，能知眾生心，如仁所問義，諦聽我今說。過去未來世，現在諸導師，無有說一法，而得於道者。佛知眾生心，性分各不同，隨其所應度，如是而說法。慳者為讚施，毀禁者讚戒，多瞋為讚忍，好懈讚精進。亂意讚禪定，愚癡讚智慧，不仁讚慈愍，怒害讚大悲。憂慼為讚喜，曲心讚歎捨，如是次第修，漸具諸佛法。如先立基堵，而後造宮室，施戒亦復然，菩薩眾行本。譬如建城廓，為護諸人眾，忍進亦如是，防護諸菩薩。譬如大力王，率土咸戴仰，定慧亦如是，菩薩所依賴。亦如轉輪王，能與一切樂，四等亦如是，與諸菩薩樂。」\n\n（`T10n0279` 卷十三·逐字（`_e10_full.py` 品内 div 结构化·`_e10_dump.txt`）·本偈 `<l>` 行数实测见 §7.5 L2）\n\n**疏解**：难在「既智为上首，何故如來遍赞六度四等、不独以一法（智）得菩提」。答以**随病设药**义：佛应众生根性之病（悭·毁禁·多瞋·好懈·乱意·愚痴·不仁·怒害·忧慼·曲心）而赞对应度，须**六度四等次第圆修**方具佛法，非一法能了。基堵·城廓·力王·轮王四喻，配布施持戒（基）·忍进（城）·定慧（王所恃）·四等（与乐）。**此段八十意译六度、六十音译六度**（§6.1），对读价值最高。海云讲记 Ep11 即就此「智首所问」广作玄谈（§5.3′）。\n\n### 2.9 段（九）·文殊问贤首·贤首偈答（一道出离·佛土万殊·一法身）\n\n**设难（长行·全引·〔L.188 本批〕）**：\n\n> 「爾時，文殊師利菩薩問賢首菩薩言：「佛子！諸佛世尊，唯以一道，而得出離。云何今見一切佛土，所有眾事，種種不同？所謂：世界、眾生界、說法調伏、壽量、光明、神通、眾會、教儀、法住，各有差別。無有不具一切佛法，而成阿耨多羅三藐三菩提者。」」\n\n（`T10n0279` 卷十三·逐字（`_e10_full.py` 品内 div 结构化·`_e10_dump.txt`）·颂前接「爾時，X首菩薩以頌答曰」公式·27 单元）\n\n**酬解（偈·全引·〔L.188 本批〕）**：\n\n> 「文殊法常爾，法王唯一法，一切無礙人，一道出生死。一切諸佛身，唯是一法身，一心一智慧，力無畏亦然。如本趣菩提，所有迴向心，得如是剎土，眾會及說法。一切諸佛剎，莊嚴悉圓滿，隨眾生行異，如是見不同。佛剎與佛身，眾會及言說，如是諸佛法，眾生莫能見。其心已清淨，諸願皆具足，如是明達人，於此乃能覩。隨眾生心樂，及以業果力，如是見差別，此佛威神故。佛剎無分別，無憎無有愛，但隨眾生心，如是見有殊。以是於世界，所見各差別，非一切如來，大仙之過咎。一切諸世界，所應受化者，常見人中雄，諸佛法如是。」\n\n（`T10n0279` 卷十三·逐字（`_e10_full.py` 品内 div 结构化·`_e10_dump.txt`）·本偈 `<l>` 行数实测见 §7.5 L2）\n\n**疏解**：难在「一道出离，何故佛土万殊」。答立「**一法身·一心一智·力无畏亦然**」之绝唱——佛本身无差别，差别全在众生业行所见；「佛剎無分別，無憎無有愛，但隨眾生心」。此偈是《华严》「一多·身土不二」之要文。〔本文判断〕与第九品「佛身充满虚空界」之颂同一法身观，然光明觉从「佛遍照」立言，问明从「机所见异」立言，方向相反而体一。六十「唯以**一乘**得出生死」（八十「唯以一道」）、「法身眾」句序异（§6.1）。\n\n### 2.10 段（十）·诸菩萨问文殊·文殊偈答（佛境界十一问）\n\n**设难（长行·全引·〔L.188 本批〕）**：\n\n> 「爾時，諸菩薩謂文殊師利菩薩言：「佛子！我等所解，各自說已。唯願仁者，以妙辯才，演暢如來所有境界！何等是佛境界？何等是佛境界因？何等是佛境界度？何等是佛境界入？何等是佛境界智？何等是佛境界法？何等是佛境界說？何等是佛境界知？何等是佛境界證？何等是佛境界現？何等是佛境界廣？」」\n\n（`T10n0279` 卷十三·逐字（`_e10_full.py` 品内 div 结构化·`_e10_dump.txt`）·颂前接「爾時，X首菩薩以頌答曰」公式·30 单元）\n\n**酬解（偈·全引·〔L.188 本批〕）**：\n\n> 「如來深境界，其量等虛空，一切眾生入，而實無所入。如來深境界，所有勝妙因，億劫常宣說，亦復不能盡。隨其心智慧，誘進咸令益，如是度眾生，諸佛之境界。世間諸國土，一切皆隨入，智身無有色，非彼所能見。諸佛智自在，三世無所礙，如是慧境界，平等如虛空。法界眾生界，究竟無差別，一切悉了知，此是如來境。一切世間中，所有諸音聲，佛智皆隨了，亦無有分別。非識所能識，亦非心境界，其性本清淨，開示諸群生。非業非煩惱，無物無住處，無照無所行，平等行世間。一切眾生心，普在三世中，如來於一念，一切悉明達。」\n\n（`T10n0279` 卷十三·逐字（`_e10_full.py` 品内 div 结构化·`_e10_dump.txt`）·本偈 `<l>` 行数实测见 §7.5 L2）\n\n**疏解**：前九难为文殊问人，此为**诸菩萨返问文殊**——「佛境界」十一（境界·因·度·入·智·法·说·知·证·现·广）。文殊以偈总酬：佛境界**量等虚空·众生入而无入·法界众生界究竟无差别·非识所能识·其性本清净**，末归「**如來於一念，一切悉明達**」——三世一心、念中悉知，与光明觉「一念普观无量劫」同一现量境界。⚖ 十一问两译序略异（八十「度…入…智…」，六十「所入…所度…隨順知…」·§6.1）。\n\n### 2.11 段（十一）·长行结归·佛神力遍照\n\n**结归（长行·全引·〔L.188 本批〕）**：\n\n> 「爾時，此娑婆世界中，一切眾生所有法差別、業差別、世間差別、身差別、根差別、受生差別、持戒果差別、犯戒果差別、國土果差別，以佛神力，悉皆明現。如是，東方百千億那由他無數無量、無邊無等、不可數、不可稱、不可思、不可量、不可說，盡法界、虛空界、一切世界中，所有眾生法差別，乃至國土果差別，悉以佛神力故，分明顯現；南、西、北方，四維、上、下，亦復如是。」\n\n（`T10n0279` 卷十三·逐字（`_e10_full.py` 品内 div 结构化·`_e10_dump.txt`））\n\n**疏解**：本品以**佛神力遍照九差别**收束，格式全仿光明觉（尽法界虚空界·南西北四维上下亦复如是），显「问明之解」终归「佛力所现」。〔本文判断〕此结段使问明与光明觉首尾呼应——光明觉放光**现境**、问明放光**现差别解**，一境一解，合成十信所信·能信。六十此结作「見此佛剎一切眾生，如所行法，如所行業……如是世界中事，一切悉見」（列「如所行」而非「九差别」·§6.1），两译结段结构迥异。\n\n---\n\n## 三　旁参与前接\n\n- **承第九品《光明觉》**：光明觉明意业遍觉·所信果境，问明启能信之解。澄观「上來三品，已答十句生解所依。此下正答主解因果，故次來也」（`T1735`@167350）；演钞「故受之以光明覺品……（光明觉后）次問明品」（承 L.178·`T1736`）。\n- **下接《净行》《贤首》**：问明（解）→净行（行）→贤首（德），三品共成十信（法藏「通論此三品明十信行法」·`T1733`@116220）。\n- **与第一会所信因果周之表里**：初会六品明「所信果德」（举果劝乐生信分），二会问明以下明「能信解行之初」——智俨判「至光明覺等來，舉果勸樂生信分」（承 L.179·`T1732`）。\n- **文殊—十首菩萨之法界身**：光明觉已立「一切处文殊」（§承第九部），问明则文殊化主、十首为伴，互为难酬，是法界身「触境斯了」之动用（澄观「六根三業盡是文殊」·第九部 §4.5 互见）。\n\n---\n\n## 四　义理要点与名相\n\n### 4.1 各各不相知（本品立宗）\n\n觉首颂「**諸法無作用，亦無有體性，是故彼一切，各各不相知**」为全品纲领。长行「业·心·受·报·因·缘·智·境」八法**互不相知**（实测「X不知Y」对×10），颂以河水·火聚·长风·地界四喻证之。〔本文判断〕「不相知」非断灭，而是**遮一「知者／作者」之实有**——缘起故无自性，无自性故相不知相；此与德首「地无一异念」、目首「水一味因器殊」共成「无主缘起」三面。\n\n### 4.2 一能应多·差别在机\n\n德首九喻（地·火·海·风·云雷·日·月·梵王）、目首十喻（大地·水·幻师·王·镜·药·日·月·风·火）同明**一本万殊**：佛法如月印万川、「非月往其处」，差别全在众生业行之机。要文：贤首偈「**一切諸佛身，唯是一法身，一心一智慧，力無畏亦然**」；「佛剎無分別，無憎無有愛，但隨眾生心，如是見有殊」。\n\n### 4.3 随病设药·六度圆修（智首段）\n\n「**無有說一法而得於道者**」——智虽上首，须六度（布施·持戒·堪忍·精进·禅定·智慧）四等（慈悲喜捨）**对治十病**（悭·毁·瞋·怠·乱·痴·不仁·怒害·忧·曲）次第圆修。基堵·城廓·力王·轮王四喻配之。〔本文判断〕此段是《华严》「一行即一切行、不废阶渐」之十信位表述，与十玄「行布不碍圆融」义通。\n\n### 4.4 多闻非道·解须起行（法首段）\n\n「**非但以多聞，能入如來法**」——九喻（漂者渴死·设膳自饿·善医不救·数他宝·聋奏乐·盲绘画·船师海死……）破「闻而不行」。此难上承「解」（问明）、下启「行」（净行），是本品由解趋行之转枢。\n\n### 4.5 佛境界（文殊自酬段）\n\n「何等是佛境界」十一问，文殊总酬：佛境界「**其量等虛空**·眾生入而無入·**法界眾生界究竟無差別**·**非識所能識，亦非心境界，其性本清淨，開示諸群生**·如來於一念一切悉明達」。〔本文判断〕此与第九品「佛遍虛空亦如是」、第八部四谛「佛境界」句互映，三品共结「果境不可识、唯佛能达」，回向所信因果周。\n\n### 4.6 名相层（梵汉对勘）\n\n- **十首菩萨**：觉首·财首·宝首·德首·目首·勤首（六十进首）·法首·智首·贤首 ＋ 文殊。以「首」（śi）表十信为入道之初（李通玄·§5.3）。\n- **必理車／鉢羅室囊**：澄观出问之梵语两名——「汎尔相问」梵 *praśna*（必理車）、「难问」梵（鉢羅室囊），「即今品意」取难问（§5.1·名相直证·〔待核·还原梵文暂缺对照本〕）。\n- **六度（智首段）**：八十意译「布施·持戒·堪忍·精进·禅定·智慧」，六十音译「檀·尸·羼提·毘梨耶·禪·般若 波羅蜜」。\n- **阿揭陀药／大药王**：目首喻，八十「阿揭陀」（梵 agada 无病药·〔待核〕）、六十「大藥王」，同喻佛福田灭烦恼毒。\n\n### 4.7 数法·结段名相\n\n结归段「百千億那由他無數無量、無邊無等、不可數、不可稱、不可思、不可量、不可說，盡法界、虛空界、一切世界」，与光明觉末段数法全同（第九部 §4.6 互见）；「九差别」（法·业·世间·身·根·受生·持戒果·犯戒果·国土果）为问明所现之境相。\n\n---\n\n## 五　注疏选要·诸家会读\n\n### 5.1 澄观《华严经疏》卷十三（`T1735`@167350–188383·「菩薩問明品第十」·四门全段）\n\n- **一来意（通别两门）**：「釋此一品亦有四門。初來意中有通有別。通謂上來三品。**已答十句生解所依。此下正答主解因果**。故次來也。生解因中先答十住。住攬信成。將答所成。先辨能成。又正答十信故下三品來也。後別者。三品明信有解行德。**解為二本此品先來**。」\n- **二释品（问明名义·梵语两名）**：「菩薩是人問明是法。遮果表因故云菩薩。**問即是難。明即是答**。然問有二種。一汎爾相問。梵云**必理車**。二者難問。謂以理徵詰。梵云**鉢羅室囊**。即今品意也。答亦有二。一但依問詶報曰答。二若俱為解釋旁兼異義。美言讚述令理顯煥曰明。即今品意也。明亦破闇。能除問者之疑闇故。今**文殊九首互為明難。遞作碪椎。研覈教理以悟群生**。故以名也。又長行明起於問。偈頌明解於問故曰問明。不云答者。欲以明兼於問故。……又明即法明。**十菩薩問出十種法明。故曰問明**。依主釋也。」\n- **三宗趣（通别两重）**：「三宗趣者。亦先通後別。……二別明此品。有其二義。一望當品以**十甚深為宗。依成觀解為趣**。二望後二品。則以**甚深觀解為宗。成後行德為趣**。」第四释文（@167350 段内科配九难·逐段引略·本篇 §二疏解从其判）。\n\n**会读**：澄观四门为本品最完整科判。「問即是難、明即是答」定本品体裁；「遞作碪椎」（更互如砧与椎之锻击）状文殊—九首对答之机用；宗趣两重（当品十甚深→观解／望后二品→行德）正是「三品共成十信·解為二本」的架构眼。\n\n**〔L.188 本批·疏科长文全摘〕**（`T1735` 卷十三～十五「菩薩問明品第十」本科段·CJK-only 坐标回映 raw 切片·引文照 raw 原字形·部首码位已归一（L.199）·附录四为全文照录，此其纲格五段）\n\n*甲·来意（通别）*：\n\n> 「釋此一品亦有四門。初來意中有通有別。通謂上來三品。已答十句生解所依。此下正答主解因果。故次來也。生解因中先答十住。住攬信成。將答所成。先辨能成。又正答十信故下三品來也。後別者。三品明信有解行德。解為二本此品先來」\n\n*乙·释品（问二种·答二种·梵语两名·十种法明）*：\n\n> 「二釋品者。菩薩是人問明是法。遮果表因故云菩薩。問即是難。明即是答。然問有二種。一汎爾相問。梵云必理車。二者難問。謂以理徵詰。梵云鉢羅室囊。即今品意也。答亦有二。一但依問詶報曰答。二若俱為解釋旁兼異義。美言讚述令理顯煥曰明。即今品意也。明亦破闇。能除問者之疑闇故。今文殊九首互為明難。遞作碪椎。研覈教理以悟群生。故以名也。又長行明起於問。偈頌明解於問故曰問明。不云答者。欲以明兼於問故。問有二義故得稱明。一問中徵責詰難理盡。使答者亡言。此至明之問也。二以問中進退詰理令現使答者易釋。故以為明。又明即法明。以十菩薩問出十種法明。故曰問明。雖諸義不同。皆菩薩之問明。依主釋也」\n\n*丙·宗趣（通别两重）*：\n\n> 「三宗趣者。亦先通後別通復二義。一通分宗。二通會宗。並如會初。二別明此品。有其二義。一望當品以十甚深為宗。依成觀解為趣。二望後二品。則以甚深觀解為宗。成後行德為趣」\n\n*丁·十段纲目（十甚深名单）*：\n\n> 「前中以十菩薩各主一門顯十甚深。即為十段。一緣起甚深。二教化甚深。三業果甚深。四說法甚深五福田甚深。六正教甚深。七正行甚深。八正助甚深。九一道甚深。十佛境甚深」\n\n*戊·问答体式总纲＋释文起首*：\n\n> 「文中十段。皆先問後答。又先起明問後解問明」\n\n*己·结段（现事结通·信中解竟）*：\n\n> 「十甚深。即問答竟。自下第二現事結通。於中二。先現事後結通。今初。因何而現上來十首。法光開曉眾生身心故。佛力暫現示相而答。令其目驗而欣厭故。所現有十。第一法即所行之法。謂三學等殊。二業謂正行漏無漏等。三集因苦果。四身類不同。五根機差別。六四生非一。七持戒則人天勝劣。八犯戒則三塗重輕。九國土則依處染淨。十說法則近報淨居。聰明利智速具佛法。此經文闕。晉本具之。又此亦可配十甚深。以是示相答故。一法首正教甚深。二寶首業果。三勤首懈怠難出。四財首觀內身等。五德首佛法一味隨根異說等。六覺首往善惡趣。七智首六度順行。通為持戒之果。八目首佛田平等。但犯戒布施得果差別。九賢首隨心世界有差別等。十晉經既有說法。即是說佛境界法也。第二如是下。結通廣遍。於中二。初結東方。後南西下類餘九方。亦現十事。以此處說法則現事通於十方。餘處說法亦應類此。總為一法界大會。思之問明品辨信中解竟」（品界末句·下即「淨行品第十一」科）\n\n### 5.2 法藏《华严经探玄记》卷三（`T1733`@116220–131862·「明難品第六」·五门分别·依六十编次）\n\n- **来意二门**：「初來意有二。先分來者**前明所依果法。今辯依果所成因行**故也。二品來者所成行中。位前方便信行最初。信中解行及德。**明難辨解。居初故來**。」\n- **释名四义**：「明難有四義。一約**心境**。難謂真俗幽邃。明謂妙智朗照。二約**教義**。難謂十義甚深。明謂往復顯暢。三約**論道**。謂難問。明答。以通問答故名明難。何者**但舉法直諮曰問。非理詰責為難。隨問直陳曰答。委釋顯煥為明**。四約**賓主**。約賓則長行中明設於難。約主則偈中明釋於難。故曰明難。」\n- **料简（位次四重开）**：「就此因中或分二。初比位……二證位……或分三。初三品是位前方便……或分四。初從此盡第三會為十解。以信是住之方便無正位故。攝屬十住中……或分五。開信異住故。又光云義分或三。初三品明**始起於先際**。二從昇天下**明善修於中際**。三不思法品等**明終顯於後際**。或分四。初未信者令信。二第三會下已信者令入……三十地品下已入者令純熟。四不思品下已純熟者令解脫。」\n- **宗趣（八门辨十信行法）**：「通論此三品**明十信行法**。於中作八門辨。一釋名。二出體。三發心。四定位。五行相。六除障。七進退。八德用。」\n\n**会读**：法藏依六十故题「明難」，其「四义」（心境／教义／论道／宾主）与澄观「问明」释方向相反旨同；「但举法直谘曰问，非理诘责为难，随问直陈曰答，委释显焕为明」十六字，实即澄观「问有二种／答亦有二」之所本（澄疏多袭探玄·§5.4）。料简四重开（二／三／四／五）显十信位次在華嚴判教中之枢轴地位——「信是住之方便無正位」一语最要。\n\n### 5.2′ 智俨《搜玄记》（`T1732`@24718 起·「明難品第六」·五门·依六十）\n\n「一釋品名及來意。明難者有二。一約法。明十義深微故也。二約辭。論難顯義情故也。明者教。難者十義。又明者智。難者論道也。來意者何故來。眾集已。為說**信法成解**故來也。……二出所治。一**瞋障百法明門**之障。此下生解斷障凡有四義。……三明所得。得**百法明門**。若約行門即得**華嚴三昧**。四辨所成成其信。謂**十信心**：一信心。二念心。三精進心。四慧心。五定心。六不退心。七迴向心。八護心。九戒心。十願心。如經初發心住未土住前。有此十心名字增修是心。一劫二劫三劫乃得入初住位中增修百法明門。**十心之中心心有十故成百法**。常發有行無行大願。得入習種性中修行一切。」\n\n**会读**：智俨古判三特色：①本品与「百法明門」经（《般若》系）互证——十信满心入初住即得百法明门，是「信位通向般若」的古老口径；②出所治标「瞋障」，与地持系烦恼配位通；③十心名目（信·念·精进·慧·定·不退·回向·护·戒·愿）为本系列第十一部《净行品》前之十信名数旧样〔⚖ 与后续仁王/璎珞名目对照另批〕。「一劫二劫三劫乃得入初住」显信位修行之久，与讲记「发心凡夫此第一关」义同〔旁参 §5.3′〕。\n\n### 5.2″ 慧苑《续华严略疏刊定记》（X0221·**本品无专段·存疑直证**）\n\n- **缺记实证**：实测 X0221 光明觉释段起 @118966，其后**直接衔接「淨行品第十一·將釋此品」**（@135027），中间 16,061 字符区间**「問明」×0、「明難」×0**（`_p10_probe4.py`·NFKC 归一化字符位）。\n- **光明觉段末文（含问明结段痕迹?）**：光明觉段末作「自下第二明結通中二。初結東方。後南西下結餘九方。此結亦是前品從第二節已志光所照處。此中略舉十數。其量分齊。如阿祇品說。餘文可知。上來滿段。**總明第一信中解竟**。」——「结通·九方」「略举十数」之科语，与问明末段「南西北方四维上下亦复如是」之境相当〔本文判断·存疑〕：或慧苑**将问明内容删并入光明觉末段**（其判光明觉为「第一信中解」恰覆问明之「解」义），或现存本夺页，非仅此品无事。〔待核·夺抑本无不作断言〕\n- **净行段来意旁证**：净行品来意作「**前品明信中之慧解。今明信中三願行故**。次來也」——「前品」若即光明觉，则其科判中问明不独立成段，与缺记自洽（旁证·不改存疑）。\n- **全库「問明品」四见皆征引**：@12701（三藏摄·「此經問明品等。諸菩薩更相問難。即**論議經**也」）、@24523（「此經問明品中。**顯一心生種種果**。意亦同也」·引觉首难）、@83501（十种佛境界征引·「問明品說。**因度入智法說知證現廣**等是也」·**十一问之序与八十全同**，是慧苑所见经本即八十系之直证）、@193159（同事一境界征引）。\n\n### 5.3 李通玄《新华严经论》（`T1739`@41803·十首名义·十色世界）\n\n「又說光明覺品菩薩問明品淨行品賢首品。**成就十信之門**。兩足輪下光者。為其最下。明入信之首以信為因。信為最下故。此是如來眉間果光放入故。……十方各有十佛剎微塵數**十首菩薩**。皆從**十色世界十智如來**所來。**以十信為入道之初故。是故所來菩薩皆名為首**。十色世界者。為十信菩薩未成實證明。是凡夫雖信果德佛境未離色塵。**以色為國**。十住菩薩理事圓明。**以華為國**。……十行菩薩善達簡擇覺慧圓明。**以慧為國**。十向十地以妙用自在。**以妙為國**。國從當位法門所來。以法為國。」\n\n**会读**：李通玄独得「十首」之名数解（九首＋文殊＝十·§1.5），并以「首＝入道之初」释名义；「十色世界配十信」之五位配国（色·华·慧·妙·法）是《论》之自创图式，与本经品目无直接文本纠缠——异说只录不改（铁律）。另：T1739 全库「問明品」十八见，多系征引（@41803 为本段·@43541 等·不尽录）。\n\n### 5.3′ 海云继梦讲记 Ep11（〔讲师玄谈·非正行〕并存）\n\n本品正行逐段讲记〔未上架·待补·Ep16+ 未上传〕。现存 Ep11 为玄谈第七节《真理之结构与作用》，于本品相关者两点，照录不裁断：\n\n1. **「十具足」与解行因果周**：讲者以智首所问「十具足」为「**解行因果周**・上迴向的開宗明義章」，谓「智首所問的『十具（足）』，又稱解行因果周，就是解跟行同時跟你講」〔⚖「解行因果周」为讲者自制科判名相·待核；按：「智首所問」在《净行品》为问一百十事，本品智首段为「六度赞叹」难，讲者跨品统摄，属玄谈科判·不回源〕。\n2. **第三会开头四品经**：「智首所問於**第三會開頭・就是以四品經**（為首）……涵蓋了**光明覺品・菩薩問明品・淨行品**」〔名相待核·口诵科判·俟 Ep13+ 正行段依 `T10n0279` 品目核〕——与澄观「三品明信有解行德」之会内次第判（§5.1）方向可互参，然讲者系「五处五会」宏观架构语，非文本科判，两置并存。\n\n### 5.4 诸家对读小结\n\n| 家 | 所依编次 | 品目 | 判释枢要 |\n|---|---|---|---|\n| 澄观 `T1735` | 八十卷十三 | 問明（四门） | 十甚深为宗·依成观解为趣；解为二本此品先来 |\n| 法藏 `T1733` | 六十卷五 | 明難（五门） | 明難四义；八门辨十信行法；信是住之方便无正位 |\n| 智俨 `T1732` | 六十卷五 | 明難（五门） | 瞋障百法明門；十心→百法明門→华严三昧 |\n| 慧苑 X0221 | 八十 | **无专段**（或删并入光明觉末） | 光明觉结曰「總明第一信中解竟」·征引四见存 |\n| 李通玄 `T1739` | 自开立论 | 問明（征引段） | 成就十信之門；十首名义；十色世界配十信 |\n| 海云 Ep11 | 现代玄谈 | 問明（带举） | 解行因果周〔讲师玄谈·非正行〕 |\n\n⚖ 名目方向（问明／明难）两译取义相反而疏家互训（澄观「問即是難、明即是答」即合法藏四义为一眼）；位次诸家同判**十信之解**，唯慧苑科为「第一信中解」且并段——本品在「解」之一字，诸家无异词。\n\n---\n\n## 六　文本对读与校勘\n\n### 6.1 八十／六十对读（`T10n0279` 卷十三 ↔ `T09n0278_juan5.txt`·STEP0 新档·L.181）\n\n**〔一〕品题、结段与答式**：八十「**菩薩問明品第十**」／六十「**菩薩明難品第六**」（编次从六十第二会第六）；八十答式一律「以**頌**答曰」×10（剥空白实测·初稿「×7不齐」系换行空白假象·L.183 订正）／六十「以**偈**答曰」×9＋「以偈答**言**」×1（宝首段）；结段八十「九差别」长行／六十「如所行法」长行（〔五〕）。\n\n**〔二〕九难问对象·名同者九、异者一**：覺·財·寶·德·目·法·智·賢首两译全同；唯第八难对象八十作「**勤首**」／六十作「**進首**」（两译偈中「勇猛常精进／勇猛大精進」义同·名异）。\n\n**〔三〕长行难端要句逐字对**（节录骨架差异·余见本系列重核件 `_p10_body.txt`／`_p10_seg60_clean.txt`）：\n\n| 难 | 八十（`T10n0279`） | 六十（`juan5.txt`） | 异文类 |\n|---|---|---|---|\n| 觉首 | 云何見有**種種差別**？所謂：往善趣、惡趣；諸根**滿、缺**；受生**同、異** | 云何能生**種種果報**？或至善趣……或**具諸根**，或**不具者** | 差别／果报·列句繁简 |\n| 觉首 | **智不知境，境不知智** | **智不知法，法不知智** | 末对「境／法」（§1.5） |\n| 财首 | 隨其時、命、身、行、**解**、言論、心樂、方便、思惟、**觀察**（十随） | 隨眾生**時**、**命**、**身**、**行**、**欲樂**、**願**、**意**、**方便**、**思惟**、**籌量**、**眾生見**而教化之（十一随） | 随数 10/11·名目异（解／意、观察／筹量） |\n| 宝首 | **等有四大**、無我、無我所……然**法界**中，無美、無惡 | 四大**悉非我、非我所**……然**諸法性**無善無惡 | 法界／诸法性·句式 |\n| 德首 | 如來**所悟**，唯是一法。云何乃說無量諸法 | 如來**唯覺一法**，云何乃說無量諸法音聲 *〔五〕佛境界十一问·序目对**：八十「境界·**因·度·入·智·法·說·知·證·現·廣**」／六十「境界·**因·所入·所度·隨順知·隨順法·分別知·識·決定知·照·廣**」——**两译序与名目皆异**（八十「度」在「入」前，六十「所入」在「所度」前）；慧苑疏引「**因度入智法說知證現廣**」（X0221@83501）与**八十全同**（§5.2″·慧苑所见即八十系直证）。文殊酬偈要句：八十「其量**等**虛空……一切眾生入，**而實無所入**」／六十「其量**齊**虛空……一切眾生入，**真實無所入**」；八十「**億劫常宣說，亦復不能盡**」／六十「**自餘無量劫，演說不可盡**」；八十「**其性本清淨，開示諸群生**·**無物無住處，無照無所行**」／六十「**自性真清淨，能示諸群生**·**寂滅無所住，無明無所行**」。\n\n**〔六〕结段对**：八十「一切眾生所有**法差別、業差別、世間差別、身差別、根差別、受生差別、持戒果差別、犯戒果差別、國土果差別**，以佛神力，悉皆明現」（九差别）／六十「見此佛剎一切眾生，**如所行法、如所行業、如世間行、隨身所行、隨根所行、隨其行報所生之處、持戒毀禁、說法果報**，如是世界中事，一切悉見」——两译结段名数义对而句式迥异（八十立「差别」名相·六十存「如所行」动貌·L.179「境／行」对读线再证）；广语八十「盡法界、虛空界、一切世界」／六十「不可說虛空、法界等一切世界」。\n\n### 6.1′　六十《菩薩明難品第六》全本对照〔L.188 本批·全量入文〕\n\n品界 `T09n0278_juan5.txt` @7719–11712·CJK 3,088（STEP0 入库档 L.181·以下**逐行照录原档分行**·不转写不断句·止于卷五尾题前·与 §6.1 表〔一〕–〔六〕逐项相应）：\n\n> 菩薩明難品第六\n> 爾時，文殊師利菩薩問覺首菩薩言：「佛子！心性是一，云何能生種種果報？或至善趣，或至惡趣；或具諸根，或不具者；或生善處，或生惡處；端正醜陋，苦樂不同；業不知心，心不知業；受不知報，報不知受；心不知受，受不知心；因不知緣，緣不知因；智不知法，法不知智？」\n> 爾時，覺首菩薩以偈答曰：\n> 「為化眾生故，乃能問斯義，\n> 諸法如實性，我說仁諦聽。\n> 諸法不自在，求實不可得，\n> 是故一切法，二俱不相知。\n> 譬如駛水流，流流無絕已，\n> 二俱不相知，諸法亦如是。\n> 亦如明燈焰，焰焰不暫停，\n> 二俱不相知，諸法亦如是。\n> 亦如長風起，鼓拂生動勢，\n> 二俱不相知，諸法亦如是。\n> 亦如深廣地，展轉相依住，\n> 二俱不相知，諸法亦如是。\n> 眼耳鼻舌身，心意諸情根，\n> 因此轉眾苦，而實無所轉。\n> 法性無所轉，示現故有轉，\n> 於彼無示現，示現無所有。\n> 眼耳鼻舌身，心意諸情根，\n> 其性悉空寂，虛妄無真實。\n> 觀察正思惟，有者無所有，\n> 彼見不顛倒，法眼清淨故。\n> 虛妄非虛妄，若實若不實，\n> 世間出世間，但有假言說。」\n> 爾時，文殊師利菩薩問財首菩薩言：「佛子！一切眾生、非眾生，如來云何隨眾生時、隨命、隨身、隨行、隨欲樂、隨願、隨意、隨方便、隨思惟、隨籌量、隨眾生見而教化之？」\n> 爾時，財首菩薩以偈答曰：\n> 「明智心境界，常樂寂滅行，\n> 我今如實說，仁者善諦聽。\n> 分別觀內身，我身何所有，\n> 若能如是觀，彼達我有無。\n> 觀身一切分，無所依止住，\n> 諦了是身者，於身無所著。\n> 能解身如實，明達一切法，\n> 知法悉虛妄，其心無所染。\n> 身命相隨順，展轉更相因，\n> 猶如旋火輪，前後不可知。\n> 智者能觀察，一切有無常，\n> 諸法空無我，則離一切相。\n> 因緣所起業，無我猶如夢，\n> 果報性寂滅，前後無異相。\n> 一切世間法，唯以心為主，\n> 隨樂取相者，皆悉是顛倒。\n> 世間所有法，一切悉虛妄，\n> 不能解諸法，真實無有二。\n> 一切生滅法，皆悉從緣起，\n> 念念速歸滅，始終無異相。」\n> 爾時，文殊師利問寶首菩薩言：「佛子！一切眾生四大悉非我，非我所，云何眾生或受苦、受樂，或作惡、作善，或內端正、或外端正，或受少報、或受多報，或有現報、或有後報，然諸法性無善無惡？」\n> 爾時，寶首菩薩以偈答言：\n> 「隨所行諸業，受果報亦然，\n> 造者無所有，諸佛如是說。\n> 猶如明淨鏡，隨其面像現，\n> 內外無所有，業性亦如是。\n> 亦如田種子，各各不相知，\n> 自然能作因，業性亦如是。\n> 亦如大幻師，在彼四衢道，\n> 示現種種色，業性亦如是。\n> 如匠造木人，能出種種聲，\n> 彼無我非我，業性亦如是。\n> 亦如眾鳥類，出㲉音不同，\n> 能作種種聲，業性亦如是。\n> 如親因緣會，受生無來者，\n> 諸根各別異，業性亦如是。\n> 如大地獄中，眾生受苦惱，\n> 苦惱無來處，業性亦如是。\n> 亦如轉輪王，成就勝七寶，\n> 彼無所從來，業性亦如是。\n> 亦如諸世界，有成或有敗，\n> 成敗無來去，業性亦如是。」\n> 爾時，文殊師利問德首菩薩言：「佛子！如來唯覺一法，云何乃說無量諸法音聲遍滿無量世界，悉能教化無量眾生，出無量聲，現無量身，了知無量眾生心意，示現無量神足自在，示現無量無邊世界，示現無量殊勝莊嚴，示現無量種種境界，而法性分別實不可得？」\n> 爾時，德首菩薩以偈答曰：\n> 「佛子乃能問，甚深微妙義，\n> 智者若知此，常樂求功德。\n> 猶如地性一，能持種種物，\n> 不分別一異，諸佛法如是。\n> 猶如火性一，能燒世間物，\n> 火性無分別，諸佛法如是。\n> 猶如大海水，注以百川流，\n> 其味無別異，諸佛法如是。\n> 猶如風性一，吹動一切物，\n> 風性無分別，諸佛法如是。\n> 猶如龍雷震，普雨一切地，\n> 雨渧無分別，諸佛法如是。\n> 猶如大地一，能生種種芽，\n> 地性無別異，諸佛法如是。\n> 猶日無雲曀，普能照十方，\n> 光明無異性，諸佛法如是。\n> 猶如空中月，世間靡不見，\n> 非至一切處，諸佛法如是。\n> 猶如大梵王，普應現大千，\n> 其身無別異，諸佛法如是。」\n> 爾時，文殊師利問目首菩薩言：「佛子！如來福田等一無異，云何布施果報不同？有種種色、種種性、種種家、種種根、種種財、種種奇特、種種眷屬、種種自在、種種功德、種種慧，如來平等無有怨親？」\n> 爾時，目首菩薩以偈答曰：\n> 「譬如大地一，能生種種芽，\n> 於彼無怨親，佛福田亦然。\n> 譬如水一味，因器故不同，\n> 諸佛福田一，眾生故有異。\n> 譬如大幻師，能令眾歡喜，\n> 諸佛聖福田，隨願令欣悅。\n> 譬如辯才王，能令眾歡喜，\n> 諸佛聖福田，令眾生悅樂。\n> 譬如明淨鏡，隨對現眾像，\n> 諸佛聖福田，眾生故有異。\n> 譬如大藥王，消滅一切毒，\n> 諸佛聖福田，能滅煩惱患。\n> 譬如日出時，能除一切闇，\n> 諸佛聖福田，普照十方界。\n> 譬如淨滿月，普照四天下，\n> 諸佛聖福田，平等無偏黨。\n> 譬如毘嵐風，震動一切地，\n> 諸佛聖福田，能動三界有。\n> 譬如火劫起，天地靡不燒，\n> 諸佛聖福田，能燒一切有。」\n> 爾時，文殊師利問進首菩薩言：「佛子！眾生為見如來教斷諸煩惱耶？為知色、受、想、行、識、欲界、色界、無色界、癡、愛，斷諸煩惱耶？若知色、受、想、行、識、欲界、色界、無色界、癡、愛，斷諸煩惱者，如來教法何所增損？」\n> 爾時，進首菩薩以偈答曰：\n> 「佛子善諦聽，我說如實義，\n> 或有速出要，或有難解脫，\n> 若欲求除滅，無量諸過惡，\n> 應當一切時，勇猛大精進。\n> 譬如微小火，樵濕則能滅，\n> 於佛教法中，懈怠者亦然。\n> 譬如人鑽火，未出數休息，\n> 火勢隨止滅，懈怠者亦然。\n> 譬如淨火珠，離緣而求火，\n> 畢竟不可得，懈怠者亦然。\n> 譬如明淨日，閉目求見色，\n> 於佛教法中，懈怠者亦然。\n> 譬人無手足，欲射過大地，\n> 永不從彼意，懈怠者亦然。\n> 譬如大海水，一毛渧求盡，\n> 於佛教法中，懈怠者亦然。\n> 譬如火劫起，欲以少水滅，\n> 於佛教法中，懈怠者亦然。\n> 譬人見虛空，便言我身滿，\n> 於佛教法中，懈怠者亦然。」\n> 爾時，文殊師利問法首菩薩言：「佛子！如佛所說，聞受法者能斷煩惱，云何眾生等聞正法而不能斷隨婬、怒、癡、隨慢、隨愛、隨忿、隨慳嫉、隨恨、隨諂曲，是諸垢法，悉不離心，心無所行，能斷結使？」\n> 爾時，法首菩薩以偈答曰：\n> 「佛子善諦聽，所問如實義，\n> 非但積多聞，能入如來法。\n> 譬人水所漂，懼溺而渴死，\n> 不能如說行，多聞亦如是。\n> 譬人大惠施，種種諸肴膳，\n> 不食自餓死，多聞亦如是。\n> 譬如有良醫，具知諸方藥，\n> 自疾不能救，多聞亦如是。\n> 譬如貧窮人，日夜數他寶，\n> 自無半錢分，多聞亦如是。\n> 譬如帝王子，應受無極樂，\n> 業障故貧苦，多聞亦如是。\n> 譬如聾聵人，善奏諸音聲，\n> 悅彼不自聞，多聞亦如是。\n> 譬如盲瞽人，本習故能畫，\n> 示彼不自見，多聞亦如是。\n> 譬如海導師，能度無量眾，\n> 拯彼不自濟，多聞亦如是。\n> 譬人處大眾，善說勝妙事，\n> 內自無實德，多聞亦如是。」\n> 爾時，文殊師利問智首菩薩言：「佛子！於佛法中智慧為首，如來何故或為眾生讚歎檀波羅蜜、尸波羅蜜、羼提波羅蜜、毘梨耶波羅蜜、禪波羅蜜、般若波羅蜜、慈、悲、喜、捨，此一一法皆不能得無上菩提？」\n> 爾時，智首菩薩以偈答曰：\n> 「難知而能知，隨順眾生心，\n> 佛子所問義，諦聽我今說。\n> 過去未來世，現在諸導師，\n> 未曾以一法，得成無上道。\n> 如來知眾生，本性所修習，\n> 善順應度者，為說淨妙法。\n> 慳者讚布施，毀禁讚持戒，\n> 瞋恚讚忍辱，懈怠讚精進，\n> 亂意讚禪定，愚癡讚智慧，\n> 不仁讚慈愍，怒害讚大悲，\n> 憂慼為讚喜，憎愛為讚捨，\n> 如是修習者，漸解一切法。\n> 譬如造宮室，起基令堅固，\n> 施戒亦如是，菩薩眾行本。\n> 譬如牢堅城，防御諸敵難，\n> 忍進亦如是，防護諸菩薩。\n> 譬如大力王，威德定天下，\n> 禪智亦如是，安隱諸菩薩。\n> 譬如轉輪王，具受一切樂，\n> 四等亦如是，安樂諸菩薩。」\n> 爾時，文殊師利問賢首菩薩言：「佛子！一切諸佛唯以一乘得出生死，云何今見一切佛剎事事不同？所謂：世界、眾生、說法、教化、壽命、光明、神力、眾會、佛法、法住，如是等事，皆悉不同，無有不具一切佛法，而能成就無上菩提？」\n> 爾時，賢首菩薩以偈答曰：\n> 「文殊法常爾，法王唯一法，\n> 一切無礙人，一道出生死，\n> 一切諸佛身，唯是一法身，\n> 一心一智慧，力無畏亦然。\n> 隨眾生本行，求無上菩提，\n> 佛剎及眾會，說法悉不同。\n> 一切諸佛剎，平等普嚴淨，\n> 眾生業行異，所見各不同。\n> 諸佛及佛法，眾生莫能見，\n> 佛剎法身眾，說法亦如是。\n> 本行廣清淨，具足一切願，\n> 彼人見真實，明達知見者。\n> 隨順眾生欲，諸業及果報，\n> 各令見真實，佛力自在故。\n> 佛剎無異相，如來無憎愛，\n> 隨彼眾生行，自得如是見。\n> 非是一切佛，安住導師咎，\n> 無量諸世界，示現見不同。\n> 一切諸世界，所應受化者，\n> 常見人中雄，諸佛法如是。」\n> 爾時，諸菩薩謂文殊師利言：「佛子！我等所解，各各已說，仁者辯才深入，次應敷演，何等是佛境界？何等是佛境界因？何等是佛境界所入？何等是佛境界所度？何等是佛境界隨順知？何等是佛境界隨順法？何等是佛境界分別知？何等是識佛境界？何等是決定知佛境界？何等是佛境界照？何等是佛境界廣？」\n> 爾時，文殊師利以偈答曰：\n> 「如來深境界，其量齊虛空，\n> 一切眾生入，真實無所入。\n> 如來境界因，唯佛能分別，\n> 自餘無量劫，演說不可盡。\n> 隨順眾生故，普入諸世間，\n> 智慧常寂然，不同世所見。\n> 度脫諸群生，隨順其心智，\n> 宣暢無窮盡，唯是佛境界。\n> 如來一切智，三世無障礙，\n> 諸佛妙境界，皆悉如虛空。\n> 法界無異相，隨順眾生說，\n> 若欲具分別，唯佛之境界。\n> 一切諸世間，無量眾音聲，\n> 隨時悉了知，其實無分別。\n> 非識所能識，亦非心境界，\n> 自性真清淨，能示諸群生。\n> 非業非煩惱，寂滅無所住，\n> 無明無所行，平等行世間。\n> 一切眾生心，普在三世中，\n> 如來於一念，一切悉明達。」\n> 爾時，此娑婆世界眾生，佛神力故，見此佛剎一切眾生，如所行法，如所行業，如世間行，隨身所行，隨根所行，隨其行報所生之處，持戒毀禁，說法果報，如是世界中事，一切悉見。如是東方百千億世界，不可量、不可數、不可思議、不可稱、無等、無邊、無分齊、不可說虛空、法界等一切世界，乃至說法果報，一切悉見；南、西、北方，四維，上、下，亦復如是。\n\n### 6.2 四十华严（`T10n293`）\n\n不含本品（彼唯入法界品全译）——无对读段，如实标明。\n\n### 6.3 藏译\n\n仅编目级：order 10·题 *byang chub sems dpa'i dri ba*（菩提萨埵问〔义〕·dri ba＝问）·「汉藏基本对应，无显著差异」（`data/translation/diff_matrix.yaml`）。藏题但存「问」（dri ba）不存「明」，与六十「明难」偏重答光、八十「问明」双立之格局可并观〔旁证·本文判断〕；德格版 Toh 44 已入库（035–038），本品对应段逐字对勘未做〔未竟〕。**藏 15 开篇实测**〔L.217〕：德格 035 卷 fol 203b——第 15 章以经题＋**bam po 17** 起，续「**དེ་ནས་བྱང་ཆུབ་སེ…**」（时彼菩萨〔切〕起语），与本品开篇「爾時，文殊師利菩薩問覺首菩薩言」之菩萨问语起式相属〔对应判读〔本文判断〕·逐字对勘未作；TOC 出 `data/alignment/tibetan-derge-toc.json` L.201 提取〕。\n\n### 6.4 校勘记（底本自歧与诸家所见文异）\n\n| # | 项 | 底本／诸家 | 处理 | §7.4） |\n\n### 7.4 复算脚本（可复核）\n\n```python\n# 本品数据层复算（照 T10n0279 卷十三·品十·剥校勘；唯一见锚＋卷尾题止锚裁 junk）\nimport re, io, xml.etree.ElementTree as ET\nSKIP = {'note', 'rdg', 'mulu', 'pb', 'anchor', 'app'}\nout = []\ndef walk(el):\n    tag = el.tag.split('}')[-1]\n    if tag in SKIP: return\n    if tag == 'lb': out.append(' ')\n    if el.text: out.append(el.text)\n    for c in el:\n        walk(c)\n        if c.tail: out.append(c.tail)\nwalk(ET.parse('data/references/cbeta/T10n0279.xml').getroot())\nfull = ''.join(out)\n# 〔界标鉴别·L.182 复验口径〕修正平文器下「菩薩問明品第十」全档唯一见 @115815\nassert full.count('菩薩問明品第十') == 1\nj13 = full.find('卷第十三')\ni = full.find('菩薩問明品第十', j13)              # 真品题（起锚）@115815\nk = full.find('大方廣佛華嚴經卷第十三', i)         # 卷十三尾题（止锚）@120214\nassert 0 < j13 <= i < k, (j13, i, k)\nbody = re.sub(r'\\s', '', full[i:k])\ncjk = ''.join(c for c in body if '\\u4e00' <= c <= '\\u9fff')\nassert len(cjk) == 3133 and len(body) == 3839      # 篇幅\nassert body.count('爾時') == 11\nassert [m.start() for m in re.finditer('爾時', body)] == [7, 403, 752, 1092, 1458, 1817, 2176, 2548, 2908, 3276, 3667]\nassert body.count('佛子') == 14\nassert body.count('頌') == 10\nassert body.count('各各不相知') == 6\nassert len(re.findall(r'([\\u4e00-\\u9fff])不知([\\u4e00-\\u9fff])', body)) == 10\nassert body.count('三昧') == 0 and body.count('普賢') == 0\n# 六十侧（juan5·STEP0 L.181 新档·裁卷五尾题）\np60 = io.open('data/references/cbeta_txt/T09n0278_juan5.txt', encoding='utf-8').read()\nj60 = p60.find('菩薩明難品第六')\nk60 = p60.find('大方廣佛華嚴經', j60 + 10)\nseg60 = p60[j60:k60]\nc60 = ''.join(c for c in seg60 if '\\u4e00' <= c <= '\\u9fff')\nassert len(c60) == 3088 and len(seg60) == 3993     # raw 含换行·口径同 _p10_probe2\nassert seg60.count('以偈答曰') == 9 and seg60.count('頌') == 0\nassert seg60.count('二俱不相知') == 5 and seg60.count('佛子') == 14\nprint('八十问明品数据层 OK · CJK', len(cjk), '· 含标点', len(body))\nprint('六十明难品数据层 OK · CJK', len(c60), '· raw(含换行)', len(seg60))\n```\n\n> 实测（2026-10-25·§7.4 代码逐字执行件 `_p10_cov_run.py` 输出观察：「八十问明品数据层 OK · CJK 3133 · 含标点 >20</text>\n    <rect x=\"608\" y=\"165\" width=\"48\" height=\"50\" fill=\"#7a6a5a\" opacity=\"0.5\"/><text x=\"632\" y=\"232\">T11结</text><text x=\"632\" y=\"160\">长行</text>\n  </g>\n  <text x=\"340\" y=\"38\" text-anchor=\"middle\" font-size=\"10\" fill=\"#7a4a3d\">前九段：文殊问·X首偈答（朱）｜T10：诸菩萨返问·文殊偈答（青）｜T11：佛神力九差别结归（灰）</text>\n  <text x=\"340\" y=\"49\" text-anchor=\"middle\" font-size=\"9\" fill=\"#3d6577\">「以頌答曰」×10 ·「爾時」×11 · 十首名号各×2 · 十一问序目（§6.1〔五〕）· 各段偈颂 CJK 199–220</text>\n  <text x=\"340\" y=\"245\" text-anchor=\"middle\" font-size=\"10\" fill=\"#7a6a5a\">无损失声明：本图全部数值另以 §2.0 总表与 §7.5 L1/L2 表常驻 DOM（`_e10_full.py`／`_e10_stats.py` 可复算）</text>\n</svg>\n\n---\n\n## 八　附录（十一类）\n\n### 附录一：人名表\n| 名 | 训释 | 出处 |\n|---|---|---|\n| 文殊師利 | *Mañjuśrī* 妙德·本品设难主与返酬者 | `T10n0279` |\n| 覺首·財首·寶首·德首·目首·勤首（六十進首）·法首·智首·賢首 | 九首菩萨·文殊所问对象·合文殊成十首 | `T10n0279`／`T09n0278` |\n| 澄观 | 唐·清凉山大华严寺沙门 | `T1735`／`T1736` |\n| 法藏 | 唐·魏国西寺沙门 | `T1733` |\n| 智俨 | 唐·终南山至相寺沙门（华严二祖） | `T1732` |\n| 慧苑 | 唐·大薦福寺沙门（**本品无记**） | X0221 |\n| 李通玄 | 唐·李通玄 | `T1739` |\n\n### 附录二：名相表\n（见 §4.6–§4.7：十首、必理車／鉢羅室囊、六度两译名、阿揭陀／大药王、九差别、百法明門〔智俨〕）\n\n### 附录三：经文要句\n- 立宗颂：「諸法無作用，亦無有體性，是故彼一切，各各不相知。」（§2.1）\n- 镜像颂：「譬如淨明鏡，隨其所對質，現像各不同，業性亦如是。」（§2.3）\n- 一多颂：「譬如地性一，眾生各別住，地無一異念，諸佛法如是。」（§2.4）\n- 福田颂：「又如水一味，因器有差別，佛福田亦然，眾生心故異。」（§2.5）\n- 多闻颂：「非但以多聞，能入如來法。」（§2.8）\n- 法身颂：「一切諸佛身，唯是一法身，一心一智慧，力無畏亦然。」（§2.9）\n- 佛境界颂：「非識所能識，亦非心境界，其性本清淨，開示諸群生。」（§2.10）\n（〔L.188 本批〕十一段**全文已入 §2.1–§2.11**·复核件 `_e10_dump.txt`／`_e10_stats.py`；旧重核件 `_p10_body.txt`／`_p10_seg60_clean.txt` 仍有效·两口径一致；六十全文另见 §6.1′ 全本）\n\n### 附录四：注疏引文汇\n（§5.1–§5.3′ 各家摘引·皆注经号与归一化字符位锚）\n\n**〔L.188 本批·达标基线补全〕澄观《华严经疏》「菩薩問明品第十」本科段全文照录**（`T1735` raw @167350–188365·跨卷十三～十五·CJK-only 坐标回映切片·分页符行剔除·余照原档分行排段不转写不断句·卷题「大方廣佛華嚴經疏卷第十四／十五」两行在科段中原档位置保留·U+2E80 原档康熙部首码位已归一正字（L.199）·本附录在 §二 审计区外不污引文审计）：\n\n**甲·四门总标·来意（通别）**\n\n> 釋此一品亦有四門。初來意中有通有別。通謂上來三品。已答十句生 解所依。此下正答主解因果。故次來也。生解因中先答十住。住攬信\n\n> 成。將答所成。先辨能成。又正答十信故下三品來也。後別者。三品 明信有解行德。解為二本此品先來\n\n**乙·释品（问二种·答二种·梵语两名·十种法明·依主释）**\n\n> 二釋品者。菩薩是人問明是法。 遮果表因故云菩薩。問即是難。明即是答。然問有二種。一汎爾相\n\n> 問。梵云必理車。二者難問。謂以理徵詰。梵云鉢羅室囊。即今品意 也。答亦有二。一但依問詶報曰答。二若俱為解釋旁兼異義。美言讚\n\n> 述令理顯煥曰明。即今品意也。明亦破闇。能除問者之疑闇故。今文 殊九首互為明難。遞作碪椎。研覈教理以悟群生。故以名也。又長行\n\n> 明起於問。偈頌明解於問故曰問明。不云答者。欲以明兼於問故。問 有二義故得稱明。一問中徵責詰難理盡。使答者亡言。此至明之問\n\n> 也。二以問中進退詰理令現使答者易釋。故以為明。又明即法明。以 十菩薩問出十種法明。故曰問明。雖諸義不同。皆菩薩之問明。依主\n\n> 釋也\n\n**丙·宗趣（通两义·别两义·十甚深为宗）**\n\n> 三宗趣者。亦先通後別通復二義。一通分宗。二通會宗。並如 會初。二別明此品。有其二義。一望當品以十甚深為宗。依成觀解為\n\n> 趣。二望後二品。則以甚深觀解為宗。成後行德為趣\n\n**丁·释文总辨（六段会判·三品别明·十段纲目·声部互为明难）**\n\n> 第四釋文。此 下至菩薩住處。明生解之因。配十句問。如前問中依文次第。且分為\n\n> 六。初此下三品明未信令信。二第三會已信令解。三第四會已解令 行。四第五會已行令起願。五第六會已起願令證入。六十定品至住處\n\n> 品。已證入令等佛。今初三品即為三別。此品明正解理觀。次品明隨 緣願行。賢首品明德用該收。就初分二。先問答顯理。後示相結通。\n\n> 前中以十菩薩各主一門顯十甚深。即為十段。一緣起甚深。二教化甚 深。三業果甚深。四說法甚深五福田甚深。六正教甚深。七正行甚\n\n> 深。八正助甚深。九一道甚深。十佛境甚深。此十甚深次第。云何緣 起深理。總該諸法觀解之要。故首明之。眾生迷此故須教化。違化順\n\n> 化有善惡業。欲知此業由說法成。然說法成善唯佛福田。既說順田須 持聖教。教在勤行。行須正道助道。助必有正殊塗同歸。得一道者。\n\n> 當趣佛境故為此次。又此十種亦可配於十信。但不次耳。文殊佛境即 當信心。文殊主信故。佛境即所信。故約發心次第信居其初。約所信\n\n> 終極最居其後。亦明十心不必次故。勤首即進心。財首為念心。明四 念故。覺首定心。能觀心性為上定故。智首則慧心。慧為上首兼己莊\n\n> 嚴故有十度。法首即不退心。如說修行得不退故。寶首即戒心。三聚 無缺如寶珠故。業果甚深戒所招故。德首即護法心。說法甚深是所護\n\n> 故。目首即願心福田等一由願異故。目能將身如願導行故。賢首即迴 向心以歸一道。即迴向真如。一身一智等。即是佛果。文云。如本趣\n\n> 菩提。所有迴向心等。以是圓融十法故。各兼多義。又亦攝十信之十 德。恐繁不敘。且為十甚深解。然有二義。一約行。二約法。言約行\n\n> 者。文殊發問九菩薩答。明妙慧通於眾行。九菩薩問文殊為答。明眾 行成於妙慧。言約法者。初九顯差別義。後一顯差別同歸佛境。此二\n\n> 不二成信中之觀解。文中十段。皆先問後答。又先起明問後解問明\n\n**戊·第一缘起甚深（T1 觉首·心性一章·十事五对·不相知释·答颂长科）**\n\n> 今初。問中二。先彰問答之主。問覺首者。彼得此門故。緣起深義不 覺則流轉故。二佛子心性下。正顯問端。略啟五門。一問所為。二述\n\n> 問意。三定所問。四會相違。五釋本文。初所為者。有二義故。最初 問之。一拂異見。二顯深理。拂見有三。一令諸菩薩知法從緣異外道\n\n> 見。二知從心現捨二乘見。三但心性起不同權教。二顯深理者。令諸 菩薩於此實義發深信解。起行證真始終皆實。故問斯義。起信論云。\n\n> 有法能起摩訶衍信根。是故應說。所言法者。謂眾生心。依一心法。 有真如門及生滅門。彼論依此生淨信故。二述問意者。謂明心性是\n\n> 一。云何見有報類種種。若性隨事異則失真諦。若事隨性一則壞俗 諦。設彼救言報類差別自由業等熏識變現不關心性故無相違者。為遮\n\n> 此救故重難云。業不知心等。謂心業五依各無自性。自性向無何能相 知。而生諸法。既離真性各無自立。明此皆依心性而起。心性既一\n\n> 事。應不多。事法既多性應非一。此是本末相違難。亦是理事相違。 亦一異相違。亦真妄相違。三揀定所問者。準此問意。離如來藏不許\n\n> 八識能所熏等。別有自體能生諸法。唯如來藏是所依生。亦不可言八 識無二類。故名心性一以能生種種非相違故。亦非第八而為性一。熏\n\n> 成種種非相違故。心性之言非第八故。答中既言。法性本無生。示現 而有生。法性即是真如異名。正與報事相違故成難耳。文殊欲顯實教\n\n> 之理。故以心性而為難本。欲令覺首以法性示生決定而答海會同證。 楞伽密嚴皆廣說故。四會相違者。問若爾瑜伽等中。異熟賴耶從業惑\n\n> 種辦體而生。非如來藏隨緣所成。如何會釋。答瑜伽等中。對於凡小 約就權教隨相假說。楞伽密嚴對大菩薩。依於實教盡理而說。既機有\n\n> 大小法有淺深。教有權實故不相違。故密嚴云。佛說如來藏以為阿賴 耶。惡慧不能知藏即賴耶識。此明守權拒實訶為惡慧。又彼經云。如\n\n> 來清淨藏世間阿賴耶。如金與指環展轉無差別。楞伽中真識現識。如 泥團與微塵非異非不異。金莊嚴具亦復如是。皆此義也。又彼經云。\n\n> 如來藏為無始惡習所熏。名為藏識。又入楞伽云。如來藏名阿賴耶 識。而與無明七識共俱。又起信論云。不生不滅與生滅和合。非一非\n\n> 異名阿賴耶識。又如達磨經頌云。無始時來界為諸法等依。攝論等就 初教釋云。界者因義。即種子識。寶性論翻此頌云。此性無始時等。\n\n> 彼論就實教釋云。性者。謂如來藏性。如聖者勝鬘經說。依如來藏故 有生死。依如來藏故有涅槃。以此等文。故知兩宗不同。淺深可見。\n\n> 又唯識等。亦說真如是識實性。但後釋者。定言不變失於隨緣。過歸 後輩耳。五釋文者。文分三別。初心性是一者。立宗案定。二云何\n\n> 下。設相違難。三業不知心下。結成前難。今初。謂心之性故。是如 來藏也。又心即性故。是自性清淨心也。又妄心之性無性之性。空如\n\n> 來藏也。真心之性實性之性。不空如來藏也。皆平等無二故云一也。 第二設難中二。先總顯相違。謂心性既一。云何而有五趣諸根總別報\n\n> 殊。故云種種。不同二所謂下。別示相違。有十事五對。一約總報明 趣有善惡。善謂人天惡謂三塗。下四對皆約別報。於中二。謂於前善\n\n> 惡趣中。各根有滿缺。謂眼等內根。三於滿缺中各生有同異。謂四生 不同勝劣處異。四於上同異生處。各貌有妍媸。五於上妍媸各受有苦\n\n> 樂。上之五對前前皆具後後。後後必帶前前。展轉異同成多差別。故 云種種不同。心性是一其義安在。第三結成前難中。此文意稍難見。\n\n> 略為二解。一依古德作遮救重難。如前第二問意中辨。二直結成前 難。且依此釋文。自有三意。由前難意亦有三故。一直問所以故。今\n\n> 結云。非但本性是一。我細推現事各不相知。既有種種何緣不相知。 既不相知誰教種種。若謂業令種種業不知心。若謂心令種種心不知\n\n> 業。一一觀察未知種種之所由也。二者懷疑故結云既不相知。為是一 性為是種種。三作相違難。結云一性隨於種種即失真諦。種種隨於一\n\n> 性即失俗諦。今見種種又不相知。此二互乖云何並立。已知大意。次 正釋文。亦有十事五對。略為二解。一通二別。通謂總觀前來總別二\n\n> 報。於中初一對。就先業因約能所依以難。然有二意。一約本識。謂 業是能依心是所依。離所無能故云業不知心。離能無所故云心不知\n\n> 業。以各無體用不能相成。既各不相知誰生種種。下並準之。二約第 六識。業是所造心是能造。並皆速滅起時不言我起。滅時不言我滅。\n\n> 何能有體而得相生成種種耶。第二對約得報果時難能所受。謂受是報 因。即名言種為業所引。受所受報。離報無受故云受不知報。離受無\n\n> 報故云報不知受。以並無體故準前應知。三約名言因就能所依難。謂 前能受報因。依心無體故無相知。餘義同前。四約因緣就親疎相假\n\n> 難。謂所引名言種為因。能引業為緣。相待相奪各無自性。如不自生 等準之。五約境智相對相見虛無難。謂境是心變境不知心。心託境生\n\n> 心不知境。以無境外心能取心外境。是故心境虛妄不相知也。第二別 觀者。以初二對結趣善惡。趣善惡者。正由業熏。受總報故。二復以\n\n> 第二及第三對。結受生同異初對以名言種對所生處。次對以名言種對 能依本識。三復以第三及第四對。結苦樂不同及端正醜陋。初對觀現\n\n> 受時。次對觀苦樂因及彼妍媸。皆由緣令異。謂損益因成苦樂果。以 瞋忍因成妍媸果。四復以第四及第五對。結諸根滿缺亦有滿業因緣有\n\n> 損他益他之異。故成內六處滿缺之果。又由內根有滿缺故。於分別位 了境不同。並皆無性各不相知既不相知誰令種種。第二時覺首下。答\n\n> 中二。初一偈讚問許說。上半讚問。謂自究深旨。一向為他仁心弘益 也。次句許說分齊稱性說故。後句勸聽。言同意別故令諦受。後十偈\n\n> 正答。答勢縱橫具答三重問意。且分為二。前五答前釋成之中。以何 因緣而不相知。用此釋成答前難故。首而明之。後五正答前難。令初\n\n> 分二。先一法說。後四喻況。今初意云。特由從緣種種。故不相知 也。即此偈上半出因。下半結歸本宗。後四即為同喻量。云眼等是有\n\n> 法。定不相知故是宗法。因云從緣無體用故。同喻云如河中水。河水 無體用河水不相知。眼等無體用眼等不相知。若以緣起相由門釋者初\n\n> 句因緣相假互皆無力。次句果法含虛故無體性。至下喻中別當釋之。 是故虛妄緣起略有三義。一由互相依各無體用故。不相知。二由依此\n\n> 無知無性。方有緣起。三由此妄法各無所有故。令無性真理恒常顯 現。現文但有初後二意。言諸法者。非唯舉前十事五對。亦該一切有\n\n> 為法也。果從因生果無體性。因由果立因無體性因無體性何有感果之 用。果無體性豈有酬因之能。又互相待故無力也。以他為自故無體\n\n> 也。下半結中是故者。是前體用俱無故。故彼一切法。各各不相知 也。第二喻況。略有二意。一以此四喻通釋諸法不相知言。二別對前\n\n> 文諸不相知。兼通前設難。今初以四大為喻。然各上三句喻況。下句 法合。然此四喻各顯一義。一依水有流注。二依火焰起滅。三依風有\n\n> 動作。四依地有任持。法中四者。一依真妄相續。二依真妄起滅。三 妄用依真起。四妄為真所持。然此法喻一一各有三義。一唯就能依。\n\n> 二依所依。三唯所依。今初喻中。唯就能依者流也。然此流注有十義 不相知。而成流注。一前流不自流。由後流排故。流則前流無自性故\n\n> 不知後。二後流雖排前而不到於前流。故亦不相知。三後流不自流。 由前流引故。流則後流無自性。故不能知前。四前流雖引後而不至後\n\n> 故亦不相知。五能排與所引無二。故不相知。六能引與所排。無二故 不相知。七能排與所排亦無二。故不相知。八能引與所引。亦無二故\n\n> 不相知。九能排與能引不得俱。故不相知。十所排與所引亦不得俱。 故不相知。是則前後互不相至。名無自性。只由如此無知無性。方有\n\n> 流注則不流而流也。肇公云。江河競注而不流。即其義也。然上云前 後者。通於二義。一生滅前後。謂前滅後生互相引排。二此彼前後即\n\n> 前波後波。小乘亦說當處生滅。無容從此轉至餘方。而不知無性緣起 之義耳。二依所依者。謂前流後流各皆依水。悉無自體不能相知。然\n\n> 不壞流相故說水流。三唯所依者。流既總無但唯是水。前水後水無二 性故。無可相知。是則本無有流而說流也。二法中三義者。一流喻能\n\n> 依妄法。二妄依真立。三妄盡唯真。初中妄緣起法似互相藉。各不能 相到。悉無自性故無相知。是則有而非有也。二依所依者。謂此妄法\n\n> 各各自虛。含真方立。何有體用能相知相成。即由此無知無成含真故 有。是則非有而為有也。三唯所依者。謂能依妄法逈無體用。唯有真\n\n> 心挺然顯現。既無彼此何有相知。正由此義。妄法有即非有。以非有 為有。復說真性隱即非隱以非隱為隱。此上三意即三種答。答上三種\n\n> 問思之。何故以水喻真心者。以水有十義同真性故。一水體澄清喻。 自性清淨心。二得泥成濁。喻淨心不染而染。三雖濁不失淨性。喻淨\n\n> 心染而不染。四若澄泥淨現。喻真心惑盡性現。五遇冷成水而有硬 用。喻如來藏與無明合成本識用。六雖成硬用而不失軟性。喻即事恒\n\n> 真。七煖融成軟。喻本識還淨。八隨風波動不改靜性。喻如來藏隨無 明風波浪起滅。而不變自不生滅性。九隨地高下排引流注。而不動自\n\n> 性。喻真心隨緣流注。而性常湛然。十隨器方圓而不失自性。喻真如 性普遍諸有為法。而不失自性。略辨十義少分似真故。多以水為喻。\n\n> 此義見文雖似不具。而大通眾經。第二依火焰起滅喻中。三義同前。 初唯焰者。謂焰起滅有其二義。一前焰謝滅引起後焰。後焰無體而不\n\n> 能知前焰。前焰已滅復無所知。是故各各皆不相知。二前焰若未滅。 亦依前引無體故無能知。後焰未生故無所知。是故彼亦各不相知。妄\n\n> 法亦爾。剎那生滅不能自立。謂已滅未生無物可知。生已則滅無體可 知。是故皆無所有也。斯則流金爍石而不熱也。二依所依者。謂彼火\n\n> 焰。即由於此無體無用不相知。故而有起滅虛妄之相。是則攬非有而 為有也。妄法亦爾。依此無所依之真理方是妄法。是亦非有為有也。\n\n> 三唯所依者。推起滅之焰體用俱無。無焰之理挺然顯現。是則無妄法 之有。有妄法之無。湛然顯現。遂令緣起之相相無不盡。無性之理理\n\n> 無不現。上三義中。亦如次喻答前三問也。下二喻準知。第三依風有 動作喻妄用依真起。三義同前。一唯動者。離所動之物。風之動相了\n\n> 不可得。無可相知。妄法亦爾。離所依真體。不可得故無相知。斯則 旋嵐偃岳而常靜也。二依所依者。謂風不能自動。要依物現動。動無\n\n> 自體可以知物。物不自動隨風無體。不能知風。法中能依妄法要依真 立。無體知真。真隨妄隱無相知妄。三唯所依者。謂風鼓於物動唯物\n\n> 動。風相皆盡。無可相知。妄法作用自本性空。唯所依真挺然顯現。 是故妄法全盡。而不滅真性。全隱而恒露。能所熏等法本自爾。思之\n\n> 可見。第四依地有任持者。喻妄為真所持。三義同前。初地界因依有 二種義。一約自類。二約異類。前中從金剛際上至地面。皆上依下下\n\n> 持上。展轉因依而得安住。然上能依皆離所無體。而能知下。然下能 持皆亦離所無體。可令知上。又上上能依徹至於下。無下可相知。下\n\n> 下能持徹至於上。無上可相知。是故若依若持相無不盡。所現妄法當 知亦爾。必麁依細。謂苦報依於業業依無明。造無明依。所造展轉無\n\n> 體。無物可相知。斯則厚載萬物而不仁也。肇公亦曰。乾坤倒覆無謂 不靜也。二約異類者。如下文地輪依水輪。水輪依風輪。風輪依虛\n\n> 空。虛空無所依。準此妄境依妄心。妄心依本識。本識依如來藏。如 來藏無所依。是故若離如來藏。餘諸妄法。各互相依無體能相知。是\n\n> 則妄法無不皆盡。二依所依者。地界正由各無自性。而得存立。向若 有體則不相依。不相依故不得有法。是故攬此無性以成彼法。法合可\n\n> 知。三唯所依者。謂攬無性成彼法者。是則彼法無不皆盡。而未曾不 滅。唯無性理而獨現前。餘義同前。上通答釋成前難竟。第二別對諸\n\n> 不相知及通前難者。初水流轉喻。前二對不相知。答趣善惡難。以善 惡趣流轉體故。二大火喻。第二三對不相知。答前諸根受生。如火依\n\n> 薪有生滅故。次以長風喻前因緣。答前好醜。遇物鼓扇現諸相故。次 以地界亦喻因緣。答前苦樂。展轉因依以輕重故。又喻前境智答前諸\n\n> 根。隨種所生根等異故。上來總別並答釋成中。以何因緣各不相知 竟。第二五偈答前設難。文分為三。初三偈正答前難。次一偈釋成前\n\n> 義。第三一偈。拂迹入玄。今初先明大意。次正釋文。今初前問有三 重。今此三偈。一一具答上之三間。謂第一直耳。問云。既有種種何\n\n> 緣得不相知。前五偈答竟。既不相知何緣種種。答有四因。一妄分別 故。二諸識熏習故。三由無性不相知故。四真如隨緣故。初偈具二\n\n> 三。餘二各一義。然此四因但是一致。謂由妄分別為緣。令真如不守 自性。隨緣成有諸識。熏習展轉無窮。若達妄源成淨緣起。諸宗各取\n\n> 並不離象。受一非餘斯為偏見。上第二疑云。為是種種為是一性。今 答云。常種種常一性。第三難云一性隨於種種則失真諦。種種隨於一\n\n> 性則壞俗諦。今答云。此二互相成立。豈當相乖。性非事外曾何乖乎 種種。種種性空。曾何乖乎一性。由無方有。一性能成種種。緣生故\n\n> 空。種種能成一性。是以緣起之法總有四義。一緣生故有。即妄心分 別有。及諸識熏習是也。二緣生故空。即上云。諸法無作用亦無有體\n\n> 性。是故彼一切。各各不相知是也。三無性故有。論云以有空義故。 一切法得成。經云。從無住本立一切法。即上隨緣是也。四無性故\n\n> 空。即一切空無性是也。是以無性緣生故空。則非無見斷見之空。為 真空也。無性緣生故有。則非常見有見之有。是幻有也。幻有即是不\n\n> 有有。真空即是不空空。不空空故名不真空。不有有故名非實有。非 空非有是中道義。又開此空有。各有二義。一真空必盡幻有。以若不\n\n> 盡幻有非真空故。二真空必成幻有。以若礙幻有非真空故。二幻有二 義者。一幻有必覆真空。以空隱有現故。二幻有必不礙真空以幻有必\n\n> 自盡令真空徹現故。文殊各以初義致難。覺首各以後義而答。以初二 義空有異故。以後二義空有相成故。然此二不二。謂有非有無二。為\n\n> 一幻有。空非空無二為一真空。又非空與有無二為一幻有。空與非有 無二為一真空。又幻有與真空無二。為一味法界。即中道義。離相離\n\n> 性無障無礙無分別法門。思以準之。復次性有二義。一者有義。二者 空義。復有二義。一者不變。二者隨緣。以有義故。說二空所顯即法\n\n> 性本無生也。以空義故。說依他無性即是圓成。即各不相知。以有義 故說於不變。以空義故說於隨緣。此二不二。隨緣即是不變。不變故\n\n> 能隨緣。若唯不變性何預於法。若但隨緣豈稱真性。故隨其流處有種 種異。而其本味停留雪山。又若性離於法則成斷滅。法離於性則本無\n\n> 今有。又法若即性性常應常。性若即法法滅應滅。故二相成非常非 斷。此二相奪故。說非有非空。為中道義。苟得其會不惑百家異說。\n\n> 願諸學者虛己求宗。次正釋文。且第一偈答三問者。初答何因種種。 此具二意。一以八識熏習而成故。初句五識次句心。是本識集起義\n\n> 故。意通六七。七謂審思量故。六謂意之識故。了別義故。偈文窄故 不立識言。亦諸情攝。此從別義。通則八識皆得心意識名。諸情根\n\n> 者。通於八種。類非一故。五依色根。六依第七。七八互依。又第七 識為染污根。第八又為諸識通依。云諸情根。言以此者。以上八識。\n\n> 為能所熏展轉為因。而常流轉。無別我人故云無能轉者。又識外無法 亦為無者。二明由不相知方成種種。上半出種種。以此者。以前不相\n\n> 知故。舉體性空方成流轉。即此八識各無體性故。無實我法而為其 主。向若有性不可熏變。安得流轉。次遣疑者。以虛妄中有二義故。\n\n> 一虛轉。二無轉故。常種種常一性也。次答難者。虛轉故俗不異真而 俗相立。無轉故真不異俗而真體存。故互不相違也。第二偈亦答三\n\n> 問。初明真如隨緣故成種種者。答所以也。初句印上心性是一是不變 義。次句答上云何見有種種。是隨緣義。唯心變現全攬真性。生非實\n\n> 生故云示現。下二句印上業不知心等者。以是隨緣不失自性義故。是 以諸趣種種了不可得。生即無生無能現者。性不動故。無所現者妄法\n\n> 虛故。次遣疑者。常生常無生。上半即無生之生業果宛然。故勝鬘 云。不染而染難可了知。下半生即無生真性湛然。故勝鬘云。染而不\n\n> 染難可了知。又法性本無生。不空如來藏也。此中無能現。空如來藏 也。答第三難者。此中無能現性非性也。亦無所現物相非相也。又示\n\n> 現而有生。性不違相。亦無所現物。相不違性無二為二。二即無二無 礙圓融豈有乖耶。言法性者。法謂差別依正等法。性謂彼法所依體\n\n> 性。即法之性故名為法性。又性以不變為義。即此可軌亦名為法。此 則性即法故名為法性。此二義並約不變釋也。又即一切法各無性。故\n\n> 名為法性。即隨緣之性法即性也。本有二義。一約不變。本謂源本。 本來不生隨緣故生。二約隨緣有此法來本自不生非待滅無。即示現生\n\n> 時本不生故。故下云無能現也。第三偈答三問者。初答所以者。上三 句種種即一心性。亦印前文殊不相知等。下句出因。由妄分別故有種\n\n> 種。正答前問。此復二意。一上二句依他起也。次句圓成實也。後句 遍計性也。由遍計故能起依他。依他無性即圓成實。故唯識云。依他\n\n> 起自性分別緣所生。圓成實於彼常遠離前性。故此與依他非異非不 異。二者上二句因緣所生法也。次句我說即是空也。後句亦為是假\n\n> 名。此二不二是中道義。又妄心分別有者。情計謂有。然有即不有故 云一切空無性。常有常空。是即萬物之自虛。豈待宰割以求通哉。又\n\n> 前偈從本起末。末不異本。此偈攝末歸本。本不礙末豈相乖耶。第二 一偈釋成前義。然有二義。一者云何得知無性。以法眼觀稱性非倒。\n\n> 成淨緣起。當知此理甚為決定。二者前偈訶其見有種種。是妄分別。 此不應依。此偈印其觀察無性各不相知。斯為法眼固應依止。即依智\n\n> 不依識也。第三一偈拂迹入玄者。謂前法性無生。一切皆空實也。示 現有生。眼等差別非實也。妄心分別有妄也。如理觀察。非妄也。以\n\n> 妄為緣生世間流轉。以如理觀成出世間非倒法眼。皆是名言而無真 實。何者。如言取故。又欲言其實而復示生。欲言不實體性即空。欲\n\n> 言是妄妄不可得。欲言非妄。能令流轉。欲言世間即涅槃相。欲言出 世無世可出。則染淨兩亡。是以物不即名以就實。名不即物而履真。\n\n> 然則實理獨靜於言教之外。豈文言之能辨哉。故但假說。是以什公 云。唯忘言者可與道合。虛懷者可與理通。冥心者可與真一。遺智者\n\n> 可與聖同耳。又後三偈。亦如次明三無性觀。又此五偈合前四喻。初 以流轉合水漂流。次頌合火。火本無生隨緣生故。次頌合風風即空\n\n> 無。因見物動妄謂有故。次頌合地。法眼見理無分別故。後一總顯令 亡言故。又前五偈是印成答。次四出所以答。後一奪令亡言。文殊一\n\n> 問以含多意。覺首縱答體勢無方。逆順研窮以顯深致。幸諸學者不咎 文繁\n\n**己·第二教化甚深（T2 财首·十一…十随·观身分段）**\n\n> 第二教化甚深。先問中二。初標告。告財首者。彼得此法財益 生門故。二正問中二。初立宗。眾生即非眾生。彼此同許。亦可躡前\n\n> 覺首八識皆空。二云何下設難。謂眾生既空佛云何化。若佛不見生空 則無大智。便成謗佛。若見空而化豈不違空。空有相違進退何據。於\n\n> 中先明十隨。辨所化差別。後明三輪顯能化不同。今初一隨根生熟 時。如是時中堪如是化。又此句為總。謂隨何壽命時等。下九為別。\n\n> 各有二義謂隨其壽命脩短而化。又以無命者法而教化之身二義者。謂 隨其所受何等類身而受化故。又宜以觀身空寂等而得度者。以彼化故\n\n> 餘準此知。故下答中多說後意。行謂三業善惡。解謂識解差別。言論 者。國俗教誨。此六多約未發心前。後四多約發趣已去。心樂者。有\n\n> 所欣求。方便者。隨所進趣。思惟者。依法求義。觀察者。如說修 學。二於如是下能化差別。先牒十隨。後現三業。教化調伏通於語\n\n> 意。為以十隨化故。眾生非空耶。為以眾生空故。十隨虛設耶。第二 財首答中。準諸深經及此偈文。略有四意。一佛見眾生本來自空非斷\n\n> 空故。不礙隨化。偈云。諸法空無我眾報隨業生故。二佛知眾生不能 自知真空。故悲以隨化。偈云。隨解取眾相顛倒不如實故。三隨化即\n\n> 空。不異眾生空故。二不相乖。偈云。此是樂寂滅多聞者境界故。四 融上諸義。良以攬空為眾生。生與非生唯一味故。不增不減經云。即\n\n> 此法身流轉五道。名曰眾生。法身即眾生。眾生即法身。法身眾生義 一名異。以斯義故。佛見眾生舉體自盡。本是法身不須更化。大智現\n\n> 前見於法身隨緣即眾生。故大悲攝化。今以寂滅非無之眾生。恒不異 真而成立故。是不動真際無化而化。以隨緣非有之法身。恒不異事而\n\n> 顯現。故不壞假名化即無化。所化既空有不二。能化亦悲智不殊。不 礙有而觀空。方能入理。不動真而隨化方能究竟化他。眾生不知此\n\n> 理。故流轉無窮。今令眾生悟如斯法。是則真實隨化。非直十隨不違 空理。亦由此十方契真空故。淨名云。當為眾生說如斯法。是即真實\n\n> 慈也。十頌分二。初一舉法勸聽。上半以人顯法。已含答意。上句體 深下句用廣。即聞之寂則聞無所聞。故無眾生。大經亦云。若知如來\n\n> 常不說法。是名具足多聞。即寂多聞則善解藥病。不礙隨化。下二句 許說勸聽。後九頌別答前問。文勢多舍略為二釋。一者一一別答。謂\n\n> 初三答隨身。次一隨命。三一頌答隨觀察。四一頌答隨行及方便。五 一頌答隨心樂及解。六一頌答隨言論。七一頌答隨思惟時通此九。二\n\n> 謂依前五隨答後四隨。亦時通於九。今依此消文。文分為六。初三頌 教。依隨何身時。隨其心樂修其方便。思惟觀察。此四遍於五段。二\n\n> 有一頌依命時。三二頌依行時。四一頌依解時。五一頌依言論時。六 一頌教離二取。通結上文。今初三頌。若著我時作界分別觀。分別觀\n\n> 身皆無我故。若愛染身時作念處觀。觀於內身及心法故。總相而言即 二空觀。初一我空。次一法空。後一類通一切。今初。上半即尋思\n\n> 觀。觀於內身四大五蘊若即若離。尋求主者。不可得故下半觀益。如 實知於假我則有。計實我無。次偈觀身實相法無我觀。上半諦了身\n\n> 空。謂攬緣假立來無所從故。本無住處緣盡謝滅。去無所至無停積 處。虛假似立實無所住。下半觀益。後偈類通以身觀身。既明見自身\n\n> 二我皆空。則知萬法皆是虛妄。此觀亦寂故不起心。若作念處釋者。 內身揀於外器及他身故。念處有二。一通二別。通則身等皆無我等。\n\n> 別則觀法無我。今是通也。復有二種。一小二大。此中是大。觀身性 相同虛空故。空無二我。誰是我言已兼二我。次偈觀受不在內外中間\n\n> 故無方所。後偈觀心及法。不得善法及不善法故。云知法虛妄心如幻 故。不起分別。又別則身受不同。通則受等皆身。是故三偈皆致身\n\n> 言。前問意云。眾生既空。云何如來隨其身化。今釋意云。以彼不知 身本空寂。教如是觀故。說如來隨眾生身而教化也。下皆準之。二一\n\n> 頌令於壽命思惟觀察。命謂命根。能令色心連持。故名為命。壽謂壽 限即命根體。實謂由業種力。引一期報眾同分體。住時分限假立壽\n\n> 命。從業緣起起即無起。業盡便滅滅無所滅。本無主者。況剎那生滅 實無自性。喻以火輪。謂旋火速轉不見始終。生滅遄流寧知本際。又\n\n> 薪火不續識鈍謂輪。命實遷流妄謂相續。又輪資火有命假心明。待他 而成固無自體。三二偈令依行時。思惟觀察。成四種觀。一無常觀。\n\n> 二空觀。三無我觀。四無相觀。於中初偈略標其四。一切有者三有 也。亦一切有為。然無常等經論異說。今且依辨中邊論。以三性釋\n\n> 之。初無常三者。約遍計名無性無常。以性常無故。約依他起名生滅 無常。有起盡故。約圓成實名垢淨無常。位轉變故。空亦有三。一無\n\n> 性空。性非有故。二異性空。與妄所執自性異故。三自性空。二空所 顯為自性故。無我亦三。一無相無我。我相無故。二異相無我。與妄\n\n> 所執我相異故。三自相無我。無我所顯為自相故。無相亦三。一相都 無故。二相無實故。三無妄相故。然皆融攝則此宗意。而偈正意多約\n\n> 前二性辨。後一偈略顯二觀。上半明空觀。報從業生。如夢從思起不 實故空。下半明無常觀。由上不實故念念無常。前即過去已滅事顯例\n\n> 後現未當滅不殊。四一偈依解令入唯識。量觀境即心變。故心為主。 然此唯識略有二分。一相二見。今隨其見分之解。取其相分之相。心\n\n> 外取故為顛倒也。五一偈依言論時令尋伺名等入如實觀。謂了名等唯 意言分別。無別名等。意即意識分別。言即名言。名言既唯意之分\n\n> 別。名下之義亦無別體。故所言論以兼名義。既隨分別則妄計意流。 尚未了唯心安入法性。若能如是自覺通達。是入唯識之方便也。即復\n\n> 此心無相可得。妄想不生便入法性。上約心乖。體非不即。又不入 者。妄想體虛無可入故。六一偈通結。亦近結次前二偈。能緣所緣即\n\n> 見相也。又觀一切法。唯是意言未能除遣。此境亦為能所也。以此為 方便得入唯心。種種法出生者。此相見二分。由無始數習有種種法相\n\n> 似生謂能緣心生。則種種境生所緣境起則種種心起。起法必滅。安得 暫停。若了相無相生無有生名了種種。則了唯心。若了無性心境兩\n\n> 亡。則住無分別自覺智境。不動法界名入法性。故末後偈結上諸觀。 令亡觀相也。佛如是化應如是知。幻人化幻皆無化化也\n\n**庚·第三业果甚深（T3 宝首·九喻业性·无作受者）**\n\n> 第三業果甚 深。問中亦二。初標能所問人。以事中顯理是可貴。故問寶首也。二\n\n> 一切下。正顯問端中三。初舉法按定。謂諸眾生身但四大。假名四大 無主身亦無我。安有我所。彼此同許以為按定。二云何下。正設疑\n\n> 難。能造能受是謂為我。所造所受即是我所。以無我故無能造受。誰 令苦樂。無我所故無所造受。何以現見而有苦等十事五對。一苦樂者\n\n> 約麁相說。三塗為苦人天為樂。二就苦中各有妍媸。三於其樂中有內 身外境。四通於苦樂受中。若時若事皆有多少。此上皆約生報。前生\n\n> 作故。五現作現受名現報。隔一生去受名為後報。三然法界下結難。 謂二無我理即真法界。真法界中。定無善惡。未知苦樂從何而生。此\n\n> 問所以也。為無我故無我所耶。為有所受亦有我耶。此致疑也。以聖 言量及正理量違於現量。如何可通結成難也。第二答意云。達體業亡\n\n> 迷真業起。報因業起何須我耶。業報攬緣虛無自體。故無我所。由法 無我非斷滅故。業果不亡斯乃正理。聖教所明不違現事。法若定有不\n\n> 可造受。便違正理。在文分二。初一法說餘九喻況。今初。上半約俗 諦緣生。即業報相屬。答前現見。次句勝義。即空印其按定。此二不\n\n> 二故不相違。無所有言該上業果。則亦無我所。後句是聖教量。智論 第二云。有業亦有果。無作業果者。此第一甚深是諸佛所說。下九喻\n\n> 顯。通相而明。喻於業果從緣無性不壞事相。別彰喻意喻各不同。初 三頌喻業報無性不壞虛相。次一偈喻無造受者。三一偈喻性一相殊。\n\n> 後四喻體無來處。初中初偈雙喻業果皆真心現。雖無實體而相不同。 次偈喻能生因緣相虛。後偈喻所生業果無實。今初。若法相宗唯以本\n\n> 識為鏡。今依法性宗亦以如來藏性而為明鏡。然有二義。一隨境界質 現業緣影故。合云業性亦如是。二隨業緣質現果影像故。前偈云。隨\n\n> 其所行業如是果報生。二文影略。共顯業果似有無體。合云業者。謂 善惡等三性者。通性及相。謂此業體以無性之法。而為其性。不失業\n\n> 果之相。而為其性。由無性故。能成業果。由不壞相方顯真空。故中 論云。雖空亦不斷。雖有而不常。業果亦不失。是名佛所說。不失業\n\n> 果。方顯中道。又如鏡現穢像。非直不污鏡。淨亦乃由此。顯鏡踰淨 如來藏。現生死業果亦然。非直不損真性平等。亦乃由此知如來藏自\n\n> 性恒淨也。此有四位。一能現位。復有二義。一由真淨故現染。二由 真淨故不為污。二所現位亦有二義。一由相虛故不能污。二由相虛故\n\n> 虛相現。三相對位亦有二義。一由分明現染方顯性淨。二由性本恒淨 令染妄現。四真淨虛染鎔融一味無礙圓融。思之。此約染淨門。以但\n\n> 有所現即為染故。更約喻中。以一異門釋。謂一鏡是定一門。二所現 染淨妍媸。等殊是定異門。染淨雖虛不能相攝。故是異也。鏡現染處\n\n> 不異現淨。故是一也。三像不異鏡。是非異義。鏡外無像故。鏡不異 像。是非一義。正現像時去像亦失鏡故。上二即非一非異門。四像雖\n\n> 即鏡而不壞像。鏡雖即像而不礙鏡。是亦一亦異門也。二田種生芽。 喻能生者田喻業緣也。種子喻於識種因也。此二相待。無性故不相\n\n> 知。由不相知方能生。於後有苦芽。故云自然能出生也。亦本識為田 名言為種。三幻師現幻喻。喻所生者。若幻色喻報。則幻師喻業。若\n\n> 幻色喻業。則幻師喻業因。以業亦緣生同報無體。而幻相不亡故。中 論內。以化復現化喻業果俱空。若幻唯喻報業則不空。四衢以喻四識\n\n> 住。造業處故。二機關出聲。喻無造受者。機關緣造體虛無人。喻業 從緣故。無造者。從機出聲尤更非實。喻報因業起安有受人。夫無我\n\n> 者。因對我無。既無有我何有非我。著無我者亦是倒故。三出[穀-禾 +卵]音別。喻性一相殊者。如鳥在[穀-禾+卵]含聲未吐喻業同一性。\n\n> 出[穀-禾+卵]聲別。猶感報無差。然鷄子之中終無鳳響。業雖無性善 惡冥熏。四有四偈。喻體無來處。皆從緣來即無來故。然亦不同。初\n\n> 一喻因含於果故無來處。次偈果酬於因故無所從。此二喻內異熟業果 也。次偈轉輪王七寶。喻外增上業果也。後偈喻無漏業果無漏智火。\n\n> 焚蕩有漏智因漏發故。亦無來業果寂然。方依幻住\n\n**辛·第四说法甚深（T4 德首·应现九喻·一能应多）**\n\n> 第四說法甚深。 亦可名應現甚深。問及答中通三業故。以說法化勝故。從此立名。先\n\n> 問中初總標告問。德首者顯佛德故。二正顯問端中三。初舉法按定。 謂佛證一味法界彼此共許。二云何下正設疑難。謂證悟既一說現乃\n\n> 多。為一耶多耶。偏取互妨。並立相違。就法即體用相違。約佛是證 教相違。下辨十種相違。前九是別後一總結。三而法性下釋成前難。\n\n> 謂非唯佛悟於一。我觀法界亦不有多。能證所證既並不殊。以何因緣 而現多種。將無如來乖法界耶。答有二意。一云。所證雖一隨機現\n\n> 多。多在物情佛常無念。二者所悟一法即無礙法界。即事之理全在多 中。所現乃即理之事。全居一內。以即多之一是所悟。即一之多是所\n\n> 說。既無障礙何有相違。豈唯不違。亦由得一方能廣現。由多現故方 令悟一。偈中分二。初一歎問利益。上半歎深。但言一理深而非甚。\n\n> 今即多是一故曰甚深。即一之多尤更難了。不可但以一多知故。下半 知益。知此甚深方知愛樂。後九喻答。皆三句喻況。下句法合。喻中\n\n> 皆上二句即體之用。三二兩句即用之寂。又初二句以一成多。次句不 礙常一故不相違。然此九喻別答九種無量。總顯境界無量。初地一持\n\n> 多喻答現無量。剎依住勝劣地無異故。二火一燒多。答化無量眾。物 從火化不擇薪故。三海一波異。答說無量法。義海波濤無窮盡故。四\n\n> 風一吹異。答震無量界。隨物輕重動有異故。五雲雷普雨。答無量 音。圓音普震法雨無差故。六地一芽異。答無量莊嚴。芽莖華實為藻\n\n> 飾故。七廓日普照。答知無量心。無私普照窮皂白故。八淨月遍見。 答無量神通。不往而至隨器現故。九梵王普應。答現無量身。不分而\n\n> 遍彌法界故。 大方廣佛華嚴經疏卷第十四\n\n> 大方廣佛華嚴經疏卷第十五 唐清涼山大華嚴寺沙門澄觀撰\n\n**壬·第五福田甚深（T5 目首·十喻·镜喻二义）**\n\n> 第五福田甚深。問中初標告。以福田是照導引生。又施為諸度之前 導。故問目首也。二顯問端分三。初舉法按定。佛為生福之田。名為\n\n> 福田。田德無二名為等一。此理共許。二云何下正顯疑難。謂田既是 一植福應齊。施報有差由何而起。前等此異即緣果相違。別顯十事。\n\n> 文並可知。三釋成前難云。田雖齊等心有高下。容可有殊。既心無異 思報云何異。答有數意。一約眾生由器有大小。心有輕重故得報有\n\n> 差。非如來咎。二約佛遍稱差別之機。方稱平等。即一之多差不乖 等。即多之一等不礙差。由心平等無私方能隨現多果。終令解脫一味\n\n> 曾何異哉。十頌舉十喻喻上諸義。初一總喻印成。後九別顯所以。前 中初句印等是緣等。彼此共許。次句印異乃因異。答別之由。次句無\n\n> 異思惟誠如所見。下句總合。後九別中皆上半喻。下半合。一水喻。 器有大小方圓任器故。二幻喻體外方便貴且悅心。三王喻體內方便終\n\n> 得實樂。上二喻佛巧稱物機。四鏡喻。約眾生。謂隨妍媸而影殊。心 高下而報別。與前鏡喻因緣不同。餘義無異。後五皆約佛明。五藥喻\n\n> 即多之一。具百味故。普去一切煩惱毒故。六日喻即一之多無幽不 燭。大小之闇並除。七月光普照喻佛平等拂上諸迹。雖隨機現要且無\n\n> 私。八大風普震喻遍動群機。九大火普燒喻終歸寂滅。又此五喻。喻 滅惑智二障。至平等智地普動諸有。皆證無為。前四即善巧隨機。此\n\n> 五則終令造極。豈不等耶\n\n**癸·第六正教甚深（T6 勤首·懈怠九喻·渐顿义）**\n\n> 第六正教甚深。問中初標問人。以破懈怠 故問勤首。二正顯問端中四。初佛教是一者。舉法按定。一有二義。\n\n> 一謂斷煩惱集證出離滅。此義不殊彼此共許。二謂多人同見所見不 異。二眾生下正設疑難難亦有二。一對初義。見教之後何以久而不\n\n> 脫。故云。云何不即斷惑出離。二對後義。多人同見何以有脫不脫。 故言。云何不悉斷惑而出。三然其下釋成前難。正釋後義。多人苦集\n\n> 皆不殊故。五蘊是正三界通依此苦果也。癡愛發潤為集因也。兼顯初 義。前後苦集亦不殊故。四是則下結成相違。出者有益不出無益。佛\n\n> 教是一其義安在。答意云。修有勤惰障有深淺。機有生熟。緣有具 闕。智有明昧功有厚薄。故成有遲速。答初難也。修與不修故見同益\n\n> 異。答後難也。上之別義不出勤惰二門故。十頌分二。初一開章許 說。謂上半許稱實而說。下半開二章門。餘九別釋。初一釋速解脫。\n\n> 後八釋難出離。今初。上半牒疑。下半為釋。勤則通策萬行。離身心 相故能速出。然有五相。一有勢力。由被甲精進故。謂於佛法中發大\n\n> 誓願。二勇捍。謂於廣大法中無怯劣精進故。三堅猛。由寒熱蚊虻等 所不能動精進故。四常不捨善軛。由於無下劣無喜足精進故。五精進\n\n> 由加行精進故。由斯五相發勤精進。速證通慧滅障解脫。下八以喻釋 難出章。總相翻前皆名懈怠。一火微樵濕喻。喻善根生及三障重。暫\n\n> 一聞教纔少修行。而業惑內侵令所聞速失。所行速廢故。成懈怠難出 離也。二鑽火數息喻。喻修有懈退。然此下喻。多通三慧以辨懈怠。\n\n> 此喻約聞。即聽習數息。明解不生。約思即決擇數息。真智不生。約 修即定慧數息。聖道不生。聖道如火能燒惑薪煖頂已前皆名未熱。已\n\n> 熱而息火尚不生。未熱數息雖經年劫終無得理。故遺教對此。明小水 長流則能穿石。禪宗六祖共傳斯喻。願諸學者銘心書紳。若直就修行\n\n> 以釋。當以智慧鑽注於一境。以方便繩善巧迴轉。心智無住四儀無 間。則聖道可生。瞥爾起心暫時亡照。皆名息也。三闕緣求火喻。物\n\n> 者艾等也。教詮聖道。等彼火珠要持向智日。以行承之。則聖道火 生。空持文字不能決擇。心行乖越道何由生。四閉目求見喻。智微識\n\n> 劣喻彼孩稚。約聞慧者。雖對明師不肯諮決。約思修者。雖對教日心 眼不開。責聖道之不生。何其惑矣。五闕緣心廣喻。喻愚人無淨信手\n\n> 以持定弓。復無戒足以拒惑地。以劣聞慧箭。欲遍射破業惑厚地。空 欲難遂。六毛滴大海喻。謂以少聞思欲測法海。妄生希欲懈怠尤深。\n\n> 七少水滅火喻。劫火遍熾喻觸境惑增。少分三慧安能都滅。八不動遍 空喻。喻雖知性空智未遊履。而言遍證。亦增上慢人也\n\n**子·第七正行甚深（T7 法首·多闻九喻·空观无常观）**\n\n> 第七正行。 甚深。問法首者。以行法故。二顯問端中三。初出聖教。受謂心領義\n\n> 理。持謂憶而不忘。二何故下申其所疑。佛言能斷。今有不斷。即教 行相違。先標相違。隨貪已下出所不斷。勢力已下結成不斷。謂有持\n\n> 法非唯不滅舊惑。亦乃隨解。新增十一種惑。勢力所轉。前四根本後 七隨惑。皆言隨者。雜集第七說諸煩惱皆隨煩惱。有隨煩惱而非煩\n\n> 惱。由此即顯根本煩惱。亦得名隨。隨他生故。通釋貪等如九地中。 今約依法新起者說。即貪求名利瞋所不解。迷其自行恃法自高。覆藏\n\n> 己短論難生忿。結恨擬酬。疾彼勝己慳自所知。不解言解廢法逐情。 三能受持下結成難也。佛言受法能斷煩惱。今受還起其故何耶。答意\n\n> 云。法是法藥要在服行。服與不服有斷不斷。非醫咎也。故十行品 云。如說能行如行能說。智論云。能行說為正。不行何所說。若說不\n\n> 能行不名為智者。故如說行方得佛法。不以口言而可清淨。十頌分 二。初一勸讚略說。初句勸聽。遠離貢高輕慢怯弱三種雜染。方名善\n\n> 聽。求悟解故。專一趣心聆音屬耳。掃滌其心。攝一切心方名諦聽。 次句讚問顯行稱理。故名如實。下半略說。言非但者。要兼修行。獨\n\n> 用多聞不能證入。故下諸偈皆云。於法不修行。多聞亦如是。此名不 行之失。非毀多聞。若無多聞行無依故。是以不行為失。如調達善\n\n> 星。行之為得。如阿難身子故。自利利他之行並須明達。誓窮法海為 種智因。但應善義勿著言說。婆沙四十二云。多聞能知法。多聞能離\n\n> 罪。多聞捨無義。多聞得涅槃。淨名云。多聞增智慧以為自覺音。下 經推度生之方便。乃至不離善巧多聞。上單顯聞。涅槃四事為近因\n\n> 緣。即雙美聞行故。智論云。多聞廣智美言語。巧說諸法轉人心。行 法心正無所依。如大雲雷霔洪雨。如是教理無量無邊。恐繁且止。九\n\n> 頌喻。明皆上半喻況。下半法合。初懼溺渴死喻。喻貪隨文義失。謂 義門波濤漂蕩其心。慮溺溺他無暇修行。自絕慧命故名渴死。二設食\n\n> 自餓喻。喻隨說廢思失說法施人。多求名利。不思法味損減法身。三 醫不自救喻。喻善知對治而不自治。四貧數他寶喻。喻說佛菩薩功\n\n> 德。不能求諸身心故無分也。五王子饑寒喻。謂王子違王法教。於內 起過故受饑寒。學人亦爾。生在法王教法宮中。行邊佛教起惡惑業。\n\n> 故無慚愧忍辱之衣。寧餐法喜禪悅之味。故饑寒也。六聾樂悅彼喻。 喻不解自說失。謂夫真說。聞者必忘說聞。逐語而說為自不聞。七盲\n\n> 畫示彼喻。喻不見自義失。八船師溺海喻。謂將導眾人游佛法海。倚 自所解不慎身行。為法所淪。九巧言無德喻。謂亦說修行或談己德。\n\n> 內無實德但有虛言。獨此一偈三句是喻。合文但云不行亦如是。彌顯 不毀多聞。又此九偈亦可別對隨貪等義如理應思\n\n**丑·第八正助甚深（T8 智首·智上首·六度四等随病赞·基堵城廓）**\n\n> 第八助道甚深。問 智首者。以顯智為正道之體統其助故。二正顯問端中三。初舉法按\n\n> 定。謂斷惑證理導行得果。唯是大智彼此同許。二如來下正設疑難。 謂既智為上首。應唯讚智那亦讚餘。此是正助相違難。三而終下結成\n\n> 前義。前難云。智為上首已應不合讚餘。況非以一法成佛。固當不合 偏讚。為要假多。為唯用智。為隨一行皆得佛耶。若隨一得成亦違智\n\n> 為上首。進退皆妨。下答意中印其初後。釋其中間。謂智為上首誠如 所言。智如明王為眾之御。故大品云。般若如目五度如盲故。印後義\n\n> 云。終無唯以一法。實如來歎三世諸佛皆具說故。以餘萬行資於智 故。釋其中間。別讚乃有多意。謂隨心令喜故。隨時生善故。所治蔽\n\n> 殊故。八門不同故。眾生不能盡受故。下當屬文。又智論云。般若必 具一切行。是故讚一即是讚餘。讚餘即是讚智。十頌分二。初一歎問\n\n> 許說。餘九正答所難。略分為二。先二頌開二章門。後七雙釋二章。 今初。初偈標眾行成果章。謂正助相假必萬行齊修故。諸佛同說。言\n\n> 無有說一者必具說也。後偈標隨機別讚章。文具禪經四隨。謂初句即 隨樂也。將護彼意稱悅其心。故性不同者。即隨宜也。附先世習令易\n\n> 受行。習以成性故分不同者。即隨治也。觀病輕重設藥多少。謂貪分 多者教不淨等。隨其所應度者。即隨義也。道機時熟聞即悟故。下別\n\n> 釋中二。初三釋隨器別讚章。後四釋眾行成果章。前中二。初兩偈半 別釋隨治。後兩句結前生後。今初。然六度成其行四等曠其心。四等\n\n> 多約利他。六度多明自利。六度如初會四等如下說。然並通四隨略舉 一治耳。涅槃云。慳者之前不得讚布施者。即隨樂意也。二結前生後\n\n> 中。上句結前下句生後。後四偈釋眾行成果中。各上半喻下半合。然 有二意。一仍前漸具之義便得釋成智為上首。二正明所用不同。故須\n\n> 兼具。然攝論第九明立六度。通有三意。一為除惑故。二為生起佛法 故。三為成熟眾生故。前段具初意。此段通具三。謂二二合者對治別\n\n> 故。先基後室等即漸具故。皆為利他即成熟故。文中初偈二度。為治 不發行因故。合云行本。謂著財不發施。著家不發戒故。基堵有二\n\n> 義。一基即是堵。即施為進善之首。戒為防惡之初。並稱基也。二堵 為環牆。即檀為萬行首基也。戒防未起非堵也。宮室者解脫也。次偈\n\n> 二度。已發修行心。為治退弱心因故。謂不能忍生死苦事。長時修助 善品有疲怠故。今忍城防外惱之敵。進郭長內行之眾。通說則此二皆\n\n> 能防外養內。次偈二度治壞失心因故。謂散亂壞靜慮邪智壞正解故。 今明菩薩定靜惑亂慧鑑萬法。動寂自在故。菩薩依之以發通慧。賴之\n\n> 以證理果。其由有力之王。澄清四海明鑑萬機。故率土戴恩天下仰 則。後一偈四等為因。自他安樂招果無盡故\n\n**寅·第九一道甚深（T9 贤首·一道出生死·一法身心智）**\n\n> 第九一道甚深。亦名一 乘。問中標問賢首者。至道柔順故。又賢猶直善。佛佛皆同一直道\n\n> 故。二顯問端中三。初標宗按定。謂佛佛所乘同觀心性。萬行齊修自 始至終。更無異徑故云一道。此理共許。二云何下正設疑難。先總後\n\n> 別。前中謂因道既一果應不別。云何現見佛剎等殊。為果異故因非一 耶。為因一故無異果耶。若雙存者即因果相違。下別辨十事。一界有\n\n> 染淨等殊。二居人善惡等異。三諸乘等別廣略等殊。四或三學調伏。 或強軟折伏。五壽有修短。六光明或色相不同。或常放具闕。或照有\n\n> 遠近。七隨染淨土居人異故。現通亦殊。八眾會異者。此有三種。一 多少。二會數。三凡聖大小。九教儀者。如此土以音聲為教。香積以\n\n> 眾香教化等。十法住者有久近故。各有差別者通上十位。然若。約一 佛。十事各不同者。德首已明。今問諸佛十事互望不同耳。第三無有\n\n> 下結成前難。謂若諸佛於因行法有具不具。可有剎等不同。今皆同 具。剎等那別。同具即是一道。第二答中意云。非唯因同果德亦同。\n\n> 而見異者。隨機感耳。非佛自位而有差別。何者。諸佛因果具同異 故。謂同滿行海是同因也。將此同因隨所調伏種種迴向應機之果是異\n\n> 因也。由此異因感差別果。由上同因。同感真應身土等果。是則約佛 即同能隨異。約機同處而見異。以生就佛雖異而常同。以佛就生雖同\n\n> 而見異。以佛望佛。能異之必同。其猶錦窠常同常異。瑜伽三十八。 諸佛平等唯除四法。一壽量。二名號。三族姓。四身相。意明隨機故\n\n> 除此四事。餘皆等也。就果同中。自性身土一向體同。自受用者平等 無二。相似名同。餘二身土亦相似名同。而隨機見異故。成唯識云。\n\n> 自性身土。一切如來同所證故。體無差別。自受用身及所依土。雖一 切佛各變不同。而皆無邊不相障礙。餘二身土。隨諸如來所化有情。\n\n> 有共不共。所化共者同處同時。諸佛各變為身為土。形狀相似不相障 礙。展轉相雜為增上緣。令所化生自識變現。謂於一土有一佛身。為\n\n> 現神通說法饒益。於不共者唯一佛變。諸有情類屬佛異故。偈中義理 多含故。文勢非一。且分為二。初二偈印其立宗。明真身無二。餘偈\n\n> 答其疑難辨應有異同。今初。初句總印。先標文殊者。警其聽受。法 常爾者。明因果無異法爾常規。餘顯一相略明四一。初句法一。以法\n\n> 常故。諸佛亦常。次句人一。次句因一。後偈果一。略舉其五。一者 身一。此有二義。謂若約所證。法界為身則體同為一。若兼能證無罣\n\n> 礙智為身。即相似名一。下既別明心智。則正當初意。然體同義異。 二心一。八識心王俱不可知故。三智慧一。四智三智二智一智。皆無\n\n> 別故。四十力一。五無畏一。此五亦略攝諸德。二答疑難中分二。初 二偈總明隨機見異。於中前偈約佛。後偈約機。前中即隨本異因。為\n\n> 物迴向各得差別。故云如是。如是即差別之義也。異舉十中三事耳。 即隨所化眾生而取佛土。後偈約機者。約佛則剎等皆圓。約機隨行見\n\n> 別。如直心為行則見不諂之國。故眾生之類。是菩薩佛土。餘六偈展 轉釋疑分四。初一偈有疑云。若皆圓滿何以不見。答意云。眾生不見\n\n> 豈得云無。然有三義。一約他受用。則地前凡小眾生不見。二約自受 用。則等覺眾生亦皆不見。若約即應同真。權教菩薩不見。次偈有疑\n\n> 云。若皆不見何以知。有釋云。有見者故亦有三義。初則淨意樂地已 去。由願自在力故。見他受用。二淨無塵習。普賢願滿方見自受用。\n\n> 三圓解之人則名心淨。即應見真。意在初後義兼中間。三有一偈疑 云。若應由物見何名佛土。釋云。佛威神故。則知生佛共成。既攬同\n\n> 成異亦稱體成益。四有三偈。釋疑云。上云眾生不見淨剎。又云佛神 力令異。為剎體處別佛有分別耶。故釋云。剎實同處佛亦無心。物自\n\n> 見異耳。於中初半顯實。云剎無分別。佛無憎愛。分別即差別義。故 晉經云。佛剎無異相。如來無憎愛。若順今經。亦可此二通佛及剎。\n\n> 次半偈明異自在物。次半偈明正見剎異。次半偈彰非佛咎。次三句釋 佛無憎愛。有感便現非佛有愛。無感不見非佛有憎。末後一句總結。\n\n> 一切諸佛法皆如是。隨機隱顯真體常存。亦通結一段\n\n**卯·第十佛境界甚深（T10 返问·十一问端·答偈非识能识）**\n\n> 第十佛境界甚 深。十信觀圓便造佛境。於中亦先問後答。問中分二。初標能所問\n\n> 人。大眾同問者。攝別歸總故。總別無礙六相圓融。問文殊者。佛境 甚深。除般若妙德無能達故。始信終智皆託佛境。故無按定結難者。\n\n> 表尊敬故。若人若法難致詰故。二佛子我等下。正申請問。又分為 二。初結前標後。加讚妙辯者。敬上首故。二何等下別顯問端。句有\n\n> 十一。初總餘別。初境界有二。一分齊境界。謂從十地因。後果位之 法是佛所有。二所緣境界。謂佛所知之境。並非餘測。總為佛境。二\n\n> 謂問佛境以何為因。三請佛境度生儀式。四應機普入世間。五能知之 智。六所知之法。七圓音起說。八明知體相。九內證平等。十顯現何\n\n> 法。十一量之大小。並非因位作用所及。亦非下位能知。故云佛境。 若約能知能度等。即是分齊。約所知等名曰所緣。能所雙融異即非異\n\n> 言思道斷。是佛境也。答中十頌次第而答唯廣一。義獨在於初。與總 合辨。欲顯分量遍於總故。即深而廣故。初句總標體深。次句分量廣\n\n> 大故。佛地論引經釋云。諸佛境界唯除虛空。無能為喻。次句釋上 廣。後句釋上深。然有三義。一約一切眾生即如來藏。更何所入。翻\n\n> 迷之悟。故云證入。二約理非即非異。故云入無所入三約心境。心冥 真境故說為入。若有所入境智未亡。豈得稱入。實無所入方名真入。\n\n> 即廣之深本起言念。即深之廣安測其涯。二答因問。謂此因無限略示 三義。一殊勝。以行超絕無等等故。二微妙。以證理深玄盡法源故。\n\n> 三廣大。以多劫說少亦不盡故。三答度問。謂隨其心器意樂不同。隨 其智力解悟差別。誘引進修令各獲益。以遍法界委悉無謬。差別難知\n\n> 故云佛境。四答入問。謂世間即是眾生世間。國土即器世間。一切者 遍法界故。入有二義。一以智身潛入蜜益眾生故。二以色身現入顯益\n\n> 眾生。智身難知文中偏顯。五答智問。上半權智。橫無不知故云自 在。豎達三際故無所礙。下半實智故。云慧境平等如空無若干也。虛\n\n> 空之言。亦兼喻上無罣礙也。權實無礙方為佛境。六答法問。法界是 理生界是事。攬理成事理徹事表。故云無別。是故事則不待壞而恒\n\n> 真。理則不待隱而恒俗。非直廣大無限。亦乃甚深無際究盡了知。故 稱佛境。又法界是所證。生界是所化。了知是能證能化。究尋其本亦\n\n> 無差別。是難知之佛境也。七答說問。一切言音隨性隨相。皆悉了知 未曾起念。故無分別。以一切差別言音即是如來法輪聲攝故。以斯答\n\n> 說。音聲實相即法輪故。八知即心體了別即非真知。故非識所識。瞥 起亦非真知。故非心境界。心體離念即非有念可無。故云性本清淨。\n\n> 眾生等有或翳不知。故佛開示皆令悟入。即體之用。故問之以知。即 用之體。故答以性淨。知之一字眾妙之門。若能虛己而會便契佛境。\n\n> 九答證問。即證大涅槃三德圓也。非業繫故解脫也。非煩惱者轉煩惱 即菩提是般若也。無物者虛相盡故。法身顯也。無住處者。成上法身\n\n> 無所在也。無照者。成上般若能證相寂也。無所行者。成上解脫無業 行之用也。由無用故用彌法界。由無照故無所不知。由無在故無所不\n\n> 在。故結句云。平等行世間也。是謂三德祕藏佛之境也。十答現問。 上半所現。初句橫盡十方。次句竪窮三際。下半能現。並於如來圓鏡\n\n> 智中。無念頓現。故出現品云。菩提普現諸心行。即斯義也。上來辨 十甚深。即問答竟\n\n**辰·现事结通（T11 长行结·九差别·配十甚深·信中解竟）**\n\n> 自下第二現事結通。於中二。先現事後結通。今 初。因何而現上來十首。法光開曉眾生身心故。佛力暫現示相而答。\n\n> 令其目驗而欣厭故。所現有十。第一法即所行之法。謂三學等殊。二 業謂正行漏無漏等。三集因苦果。四身類不同。五根機差別。六四生\n\n> 非一。七持戒則人天勝劣。八犯戒則三塗重輕。九國土則依處染淨。 十說法則近報淨居。聰明利智速具佛法。此經文闕。晉本具之。又此\n\n> 亦可配十甚深。以是示相答故。一法首正教甚深。二寶首業果。三勤 首懈怠難出。四財首觀內身等。五德首佛法一味隨根異說等。六覺首\n\n> 往善惡趣。七智首六度順行。通為持戒之果。八目首佛田平等。但犯 戒布施得果差別。九賢首隨心世界有差別等。十晉經既有說法。即是\n\n> 說佛境界法也。第二如是下。結通廣遍。於中二。初結東方。後南西 下類餘九方。亦現十事。以此處說法則現事通於十方。餘處說法亦應\n\n> 類此。總為一法界大會。思之問明品辨信中解竟\n\n### 附录五：对读简表\n（见 §6.1 表〔一〕–〔六〕、§6.3）\n\n### 附录六：存疑清单\n| # | 项目 | 状态 |\n|---|------|------|\n| 1 | 慧苑刊定记缺问明专段——删并（入光明觉末段）抑现存本夺页 | 〔待核·不作断言·§5.2″；「总明第一信中解竟」与净行来意「前品明信中之慧解」两条旁证已录〕 |\n| 2 | 「必理車／鉢羅室囊」之梵文还原（*praśna*／?） | 〔待核·仅澄观转记为据·无对照本〕 |\n| 3 | 财首难十随／十一随、法首难烦恼名目之梵本细目 | 〔待核·本机无梵本·§6.4#4#5〕 |\n| 4 | 海云讲记本品正行段逐字讲记 | 〔正行讲记未上架·待补（Ep16+ 未上传·2026-10-25）；Ep11 玄谈段已入 §5.3′〕 |\n| 5 | 藏译德格版逐字对勘 | 〔待核·本机无 Toh 44·仅编目级·藏题 dri ba 但存「问」〕 |\n| 6 | 智俨十心名目（信·念·…·愿）与《净行》《仁王》十信名目之谱系 | 〔待核·另批·§5.2′〕 |\n| 7 | 答式「×7不齐」初稿说 | 〔已闭·L.183 复算订正：剥空白×10 齐整·换行空白假象·§6.4#3〕 |\n| 8 | 「進首／勤首」两译名目孰从梵本原声 | 〔待核·旧新译通例·§6.4#2〕 |\n\n### 附录七：引用书目\n- `T10n0279` 唐·实叉难陀译《大方广佛华严经》（八十华严）·卷十三\n- `T09n0278` 晋·佛驮跋陀罗译《大方广佛华严经》（六十华严）·卷五（平文 `data/references/cbeta_txt/T09n0278_juan5.txt`·L.181 生成）\n- `T1735` 澄观《大方广佛华严经疏》卷十三 · `T1736` 澄观《随疏演义钞》\n- `T1733` 法藏《华严经探玄记》卷三 · `T1732` 智俨《华严经内章门等杂问章句》（搜玄记）\n- X0221 慧苑《續華嚴略疏刊定記》 · `T1739` 李通玄《新华严经论》\n- `data/catalog/chapters.yaml`（order 10·title_en \"Statements of the Questioning Bodhisattvas\"）· `data/translation/diff_matrix.yaml`（order 10·藏题）\n- 海云继梦讲记 Ep11（`docs/经学文献/海云讲记_九九华严/episodes/ep11.md`）\n- **〔L.188 本批·近现代研究线索（仅书目登录·皆〔线索·未对勘〕·访问 2026-10-25）〕**\n  - 宣化《大方广佛华严经浅释·菩萨问明品第九（卷十三）》（在线·drbachinese.org）——现代讲记层；其九难科句与本品 §2 段落界画可并观（讲记语只标不代立论·分层铁律 decisions #9）。\n  - 法藏《探玄记》现代点校本（中华古籍整理系列）——§5.2 五门与「明难四义」之校勘旁证〔本机 txt 已据 CBETA·点校本对校待后批〕。\n  - 十首菩萨名义研究：方广锠华严经编译史论及 *The Ten \"Head\" Bodhisattvas* 名目诸说〔线索·具体篇页待核〕——配合 §1.5 daśa-śi 拟构之文献史定位。\n  - CBETA 线上 dila 版 `T10n0279`（cbetaonline.dila.edu.tw）——本机 XML 之外另一通道·apparatus 逐字校勘〔待后续专批〕。\n  - 《大乘 function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
