var ARTICLE = {"id": "huazang-shijie", "file": "articles/huazang-shijie.html", "title": "九九华严第五品 华藏世界品之拼读", "title_sub": "华严经第五品·按品精读·华藏因果自体（风轮—香海—莲华—剎海）·藏海安布庄严（轮山·宝地·香海·香河·华林）·世界种十门·中央二十重·十方十海·重颂百一·八十与六十对读·注疏四家会读·数据层L1-L4·未完备已标明", "icon": "📖", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第一会_菩提场_所信因果周/华严经细读_第五部_华藏世界品.md", "doc_md": "# 九九华严第五品 华藏世界品之拼读\n\n> **EN · Close Reading of the Avataṃsaka Sūtra, Part Five: The Flower Treasury World（華藏世界）**\n>\n> **底本**：唐·实叉难陀译《大方广佛华严经》（八十华严）`T10n0279`。**范围：卷第八、卷第九、卷第十（本品全文）**；卷第七后半《世界成就品第四》为前接、卷第十一《毗卢遮那品第六》为后接（见 §三）。**凡例**：本系列每篇标题（YAML `title`）一律以「**之拼读**」为后缀，与第一至第四部一致。\n> **立稿**：2026-10-16；**成篇**：2026-10-17。承第一部《世主妙严品》、第二部《如來現相品》、第三部《普贤三昧品》、第四部《世界成就品》之体例与校勘纪律。\n> **本篇进度（覆盖率自陈）**：**全稿成篇**——§〇 凡例、§一 概述与品题解义（1.1–1.7）、§二 全文逐段与逐颂细读（2.0 结构表＋2.1–2.8 之一华藏因果自体与安布庄严＋2.9 之一中央世界种二十重＋2.10 之二十方香水海＋2.11 之三外围香水海＋2.12 之三总结＋2.13 之三重颂百一颂＋2.14 小结；长行 47 段·偈颂 181 条，偈颂全出，长行之一逐段全引、之十海以总表全列）、§三 旁参与前接（第四品／第六品）、§四 义理要点与名相（4.1–4.6）、§五 注疏选要·诸家会读（5.1–5.5，含 5.2′智俨／5.2″慧苑）、§六 文本对读与校勘（八十／六十，6.1–6.8）、§七 结构分析·数据层（7.1–7.6；L1–L4 四视角皆已成）、§八 附录十一类、§九 台账，**皆已成**。凡未能确证者标〔待核〕、属推断者标〔本文判断〕；**不以骨架冒充细读**。梵藏对勘、图像文物等未竟之点俱入 §八·附录四台账、§九台账。\n> **原则**：沿用前四部之校勘纪律、三层疏解（疏解／名相／会读）、存疑必标、推断必标「〔本文判断〕」、讲者之说疑误只标不改、三译主从分明、不擅改经文、可回源可复核。\n> **〔P5·2026-10-24〕本批新增（item5 7→1 续轮）**：① **Ep15 正行段整合**——本品已于 99华严讲记 Ep15（正行第三集）§D–§E 逐段讲授，§四 4.3 以 CBETA `T10n0279` anchor 程序切片逐字回源「華藏世界品第五之一·風輪平等住」一段，录入 §5.4′.5（与第八品四圣谛俟 Ep16 不同，本品正行逐字已得）；② **六十全本复验**——以本机 `T09n0278.xml`（sha256 a2bfcee6213f）复核 §6.9「约二十名」，**闭合 §6.7〔待核〕**（八十全本无「從佛眉間白毫相出」句，六十增句属实），并**如实揭露本机两六十源之自歧**（全本 XML 此段凡三处脱文，txt 本独有全名，见 §6.9〔P5·全本复验〕）；③ **英文品题＋§1.4 画龙睛 EN＋附录九中英要目**；④ 数据层复算（`scripts/huazang_shijie_studies.py`·CJK 19,098／颂 181／长行 47／偈组 9 全吻合）。\n\n---\n\n## 〇、凡例（简要）\n\n一、**校勘底本**：以 `T10n0279` 为底本。六十华严（`T09n0278`）、四十华严（`T10n0293`）不作底本，但须品读并作对读；凡异译异说并列而不强断。\n\n二、**品读主从**：以八十华严为叙事主轴，六十为辅读与对读。主从仅指骨架取自何本，非谓其余可略。\n\n三、**疏解三层**：其下「疏解」为依经文直解；「名相」为训释与梵汉（凡无把握者标〔待核〕）；「会读」为注疏家与讲记等之判，非经证，凡引皆逐字回源。\n\n四、**引文可回源**：凡引经皆照 CBETA 底本原字形（繁体·异体），可回源可复核；凡引注疏皆注明经号与段落，无把握者标〔待核〕。**本篇体例：引文（经文及注疏原文）一律用繁体照底本；疏解行文、科判标目用简体。** **不擅改经文，亦不据听录回改底本。**\n\n五、**存疑必标**：凡未能确证者标〔待核〕；凡属本席推断者标「〔本文判断〕」；凡讲者之说疑误者只标不改。\n\n六、**文本现象与信度**：凡经文有缺文、增补、版本分合之别者，如实标识并系以文献/法义说明，给信度评级（见 §1.5）；**无从确证者只标〔疑阙〕／〔待核〕，不升级为断言**。\n\n七、**版本差异之惯例**：凡藏译、梵本、六十／四十华严与本品的分品、用字、文段有无、内容增减之别，**悉举而比之**，注版本与信度；**严禁以「藏译云」冒充未见之原文**。\n\n八、**计数口径**：字数以剥校勘之 CJK 口径计（含品题）；句数以句末标点（。！？）计；偈颂以底本 `<l>` 行计，**两行（＝4 句）为一颂**（与李通玄「两行为一颂」之说合）。凡另一口径另注。\n\n九、**本品多字连写之计数法**：CBETA 底本 XML 为排版之便，于 `<lb>` 行末常有换行，故经文文字间有空白与换行（如「佛號：淨眼離垢\\n燈」）。凡计「佛號」「此上過」等多字连语，**须先压除一切空白**，否则少计。此为本品数据层之特别口径，见 §7.1。\n\n---\n\n## 一、概述与品题解义\n\n### 1.1 品题释义\n\n**品名**：**华藏世界品**（八十华严第五品，唐·实叉难陀译），占**卷第八至卷第十**三卷。**梵题**，据澄观《大方广佛华严经疏》所悉，作「**華藏莊嚴嚴具世界海之遍清淨功德海光明品**」——澄观云：「**準梵本，具云華藏莊嚴嚴具世界海之遍清淨功德海光明品。譯者嫌繁，乃成太略。處中應云蓮華藏莊嚴世界海品。謂蓮華含子之處，目之曰藏。今剎種及剎，為大蓮華之所含藏，故云華藏。其中一一境界，皆有剎海塵數清淨功德，故曰莊嚴。世界深廣故名為海。**」（`T1735`）〔T1·据疏转述，非亲见梵本〕。藏译（Toh 44）对应品名**待核**〔待核〕（参第二部 §6.4 之藏译品目考）。\n\n**释名**（分「华藏」「世界海」「品」三节，据澄观 `T1735` §5.1、李通玄 `T1739` §5.3、法藏 `T1733` §5.2）：\n\n- **「华藏」——能含之体**。莲华含子之处，目之曰藏。今**剎种**及**剎**，为大莲华（名「種種光明蘂香幢」）之所含藏，故云「华藏」。又依李通玄，华藏者「**為說此佛境報得之土，蓮華所持，含藏一切淨穢境界，皆在其中，故名華藏**」（`T1739`）。\n- **「庄严」——所含之德**。华藏中一一境界，皆有剎海尘数清净功德，故曰庄严。\n- **「世界海」——量之无尽**。世界深广，目之为海；積剎成種、積種成海。又李通玄**三重递进**之释：「**三千大千世界數至恒沙，為一世界海；海世界數至恒沙，為一世界性；性至恒沙，為一世界種**」（`T1739`，用六十本「世界性」旧名，参 §1.6）。\n- **「品」**——科段之目。此品为一品独立之经段（品次第五，卷第八至卷十）。\n\n**要义一字**：本品以一「**藏**」字（或曰「**网**」字）为骨——承第四品（世界成就，明成剎之缘）之「说境」，转入「**别明本师所严依果**」之「**示果**」；全品骨节为「**华藏因果自体（风轮→香海→莲华→剎海）→ 藏海安布庄严（轮山／宝地／香海／香河／华林／总结）→ 所持剎网差别（世界种十门→中央世界种二十重→十方十海→十海所管之海→总结世界网→重颂百一）**」，正为后品《毗卢遮那品第六》「别辩果之因」之所据（§1.2、§3）。\n\n### 1.2 品位与脉络（承上启下·依报总陈）\n\n**在八十华严三十九品中之位**：第一会（菩提场会）第五品，占**卷第八、卷第九、卷第十**（三卷，为三十九品中除《入法界品》外篇幅之最巨者）。\n\n**判位**：清凉澄观判后三品为「**正陈法海分**」，更分：「**三品正陳法海，於中分二：初二品明果，後一品辯因**」——前二品（世界成就·华藏世界）明「果」，后一品（毗卢遮那）辩「因」。又：「**於中初品通辯諸佛及諸眾生所有剎海，後品別明本師之所嚴淨。又此品明成剎之緣，後品別辯果相故**」（`T1735`）。故本品与第四品之别，正「**总／别**」之别：第四品通明诸佛众生之剎海（能成之緣），本品别明本师卢舍那之所严净（所成之果）。\n\n**承上启下**：\n- **承第四品**：第四品说「世界海十事」（起具因缘、所依住、形相、剎体、庄严、清净方便、佛出差别、劫住、劫转变、无差别），为「通相」；本品即就此十事之「所依住·形相·体性」等，落实于一「华藏世界海」之具体拓扑（十事中之「起具因缘」「清净」「佛出」「劫住」「转变」者，第四品有而本品无；「方所」「分齐」「行列」「趣入」「力持」者，第四品无而本品有——参澄观 §5.1）。\n- **启第六品**：本品首段言「**此華藏莊嚴世界海，是毘盧遮那如來往昔於世界海微塵數劫修菩薩行時……淨修世界海微塵數大願之所嚴淨**」（P1）；第六品即别显卢舍那「最初劫中」历事四佛之本因（`T1735`）。\n\n### 1.3 篇幅与结构预览（卷八至卷十）\n\n**篇幅**（剥校勘 CJK 口径，详 §7.1）：\n\n| 指标 | 全品 | 之一（卷八） | 之二（卷九） | 之三（卷十） |\n|------|------|------|------|------|\n| CJK 字数（含三段品题 27 字） | **19,098** | 6,550 | 6,885 | 5,663 |\n| 句末标点 | **626** | 166 | 214 | 246 |\n| 长行段（`<p>`） | **47** | 23 | 11 | 13 |\n| 偈组（`<lg>`） | **9** | 8 | 0 | 1 |\n| 偈颂（两行一颂） | **181** | 80 | 0 | 101 |\n\n**三段分品**：本品内分**「華藏世界品第五之一／之二／之三」**三题，正对应卷八／卷九／卷十。**之一**为「华藏因果自体 ＋ 藏海安布庄严 ＋ 世界种总说 ＋ 中央世界种」；**之二**为「十方十香水海世界种（各二十重）」；**之三**为「十海所管之外围香水海 ＋ 总结世界网 ＋ 重颂百一」。\n\n**三段偈颂之别**：之一「长行—重颂」相间（8 组，每组 10 颂＝20 行，共 80 颂）；之二纯长行（无颂）；之三末缀一巨偈组（202 行 ＝ **101 颂**），为全品之总结颂。此「**前详后略、末以长颂总收**」之结构，正合澄观「长行偈颂有十例五对，不可一例」（`T1735`）。\n\n### 1.4 核心要义\n\n本品所陈「华藏世界海」之结构，可一言以蔽之曰「**三重含藏、十方环列、世界成网**」：\n\n1. **三重含藏（竖）**：**香水海** ⊃（出大蓮華）⊃ **世界种** ⊃（含二十重）⊃ **世界**。即「積剎成種、積種成海」。中央一香水海（名「**無邊妙華光**」）出大蓮華（名「**一切香摩尼王莊嚴**」），华上持一世界种（名「**普照十方熾然寶光明**」），种中含二十重世界，娑婆为其第十三重。\n2. **十方环列（横）**：中央之外，有十香水海「**十海如環。繞於中海**」（澄观 `T1735`）：东「**離垢焰藏**」、南「**無盡光明輪**」及右旋八海（金剛寶焰光·帝青寶莊嚴·金剛輪莊嚴底·蓮華因陀羅網·積集寶香藏·寶莊嚴·金剛寶聚·天城寶堞），各出莲华、各持世界种、各含二十重。十海又各管「不可說佛剎微塵數」外围香水海（现文各说约十），是为「十海所管之海」。\n3. **世界成网（总）**：如是十不可說佛剎微塵數香水海、十不可說世界種中，一一世界「**遞相接連，成世界網**」，「**各各莊嚴際無有間斷**」，「**猶如網孔**」（澄观语）——此即华严「**因陀罗网**」之宇宙图景。\n\n**三句总持**：\n- **「各各莊嚴際無有間斷」**（总结段经文）——净而非断；\n- **「其第十三主剎即此娑婆」**（澄观 `T1735`）——故曰「**华藏即吾人所居之全体**」；\n- **「遞相接連，成世界網」**（总结段经文）——重重尘含法界，故末颂曰「**能於一切微塵中，普現其身淨眾剎**」（颂⑦）。\n\n> **EN · the three key points (dragon-eye gloss; sense-for-sense, not literal）**\n> 1. **A treasury folded three times** — a perfume-ocean bears a great lotus; the lotus bears a *world-tree* (a \"seed,\" 世界種); the seed holds twenty tiers of worlds. \"Stack the lands into a seed, stack the seeds into an ocean.\"\n> 2. **Ten directions, an Indra's Net** — around the central ocean ten more oceans ring it like a wreath, each again bearing a twenty-tiered world-tree; and each of these nets links into the next, \"seam after seam unbroken,\" forming the world-net (因陀罗网).\n> 3. **The thirteenth tier is ours** — our Sahā world is the thirteenth (lowest-purity) tier of the *central* world-tree; the Flower Treasury is not elsewhere — *it is the whole of the world we already dwell in*.\n>\n> *Title gloss:* **華藏** = \"the Flower (lotus) Treasury\" — the lotus *hiding* the seed; **Vairocana's** reward-body land, expounded here as *依报* (the environment-outcome) (§1.1, `title_en` \"The Flower Bank World\" per `data/catalog/chapters.yaml`).\n\n### 1.5 经文文本现象与信度标识\n\n本品长行、偈颂皆完整，然有三处文本现象须标：\n\n1. **「十不可說」脱「十」字**〔信度 B〕：之一「世界种总说」处，澄观云：「**準下剎種及梵本中，皆有十不可說。今闕十字。或是譯人之漏，或是傳寫之失。下標種處亦然。**」（`T1735`）——今底本作「此不可說佛剎微塵數香水海中，有不可說佛剎微塵數世界種」，而无「十」字。**系文献现象，非义理之缺**，故如实标注而不擅补。\n2. **「世界種」改译**〔信度 A〕：六十本作「**世界性**」，八十本改作「**世界種**」。澄观云：「**舊經云性，多取此義。恐濫體性故，改為種。**」（`T1735`）——此为一处重要之译名更定（§6.2）。\n3. **「形如虛空」（第十五重）与「萬相」（第十五佛形）之旧解争议**〔信度 B〕：澄观引「靜法」（法藏门人）之说，谓「形如虚空」句梵本有倒，应作「其形周圓，以空居天宮莊嚴之具而覆其上」；又「形如卍字」之「卍」本为「德者之相（吉祥海云）」，古来误译为字（`T1735`）。**此二处存异说，不改底本**。\n\n又本品偈颂之句读有一处须注意：底本第七八句偶有**多句连书**之现象（如「一切佛剎亦悉入」之类），为 CBETA 排版，非句中脱字，计数时以 `<l>` 行为准（§7.1）。\n\n### 1.6 版本差异之惯例与本品之版本情况\n\n本品所涉版本差异，大要有四，逐条系以信度：\n\n- **一、分品之别（A）**：**八十本**有独立之〈華藏世界品第五〉，占三卷；**六十本**无独立此品，其内容并入〈盧舍那佛品第二〉（六十本卷三后半至卷四前半，见 §6）。**四十本**（`T10n0293`）为《入法界品》别译，无本品。\n- **二、译名之别（A）**：六十作「**世界性**」（如「一一世界性」「世界性安立」），八十改「**世界種**」（§1.5·2）。\n- **三、详略之别（A）**：六十本将「十方×二十重」之巨大枚举**大幅压缩**，仅列约二十名（「彼眾香水海中有一香水海，名樂光明……」）即止（`T09n0278` 卷四）；八十本则逐海逐重枚举（中央 20 重＋十方十海各 20 重，及外围约百海）。此为两本最著之差异（§6.4）。\n- **四、内容分合之别（B）**：六十本〈盧舍那佛品第二〉融摄八十本之第五品（华藏）与第六品（毗卢遮那）为一品；其世界海段之末，已入八十本第六品之「普莊嚴童子」本事（`T09n0278` 卷四）。六十本之世界海段，对应八十本品五之全部。\n\n**藏译、梵本**：本机无藏本、梵本可核，**暂缺（不臆造）**〔待核〕（§8·附录四）。澄观所引梵本片段（如莲华含子之释、「三曼多周圓…伽伽那虚空…」之迴文），皆据疏转述，非亲见〔T1〕。\n\n### 1.7 核心要义小结\n\n本品以「**华藏**」为吾人依报之全体，以「**世界种**」为单元，以「**二十重**」为竖向层次，以「**十方十海**」为横向环列，以「**世界网**」为总相，终归「**華藏世界所有塵，一一塵中見法界**」之因陀罗网无尽。其法义深处，则澄观「**約眾生，如來藏識即是香海，亦法性海；依無住本，是謂風輪，亦妄想風**」（`T1735`）与李通玄「**風輪是大願波羅蜜所成報；香海是大慈悲業之所報得；蓮華藏體是法身隨行無依住智體之所報得**」（`T1739`）二说，为「**依正不二·心土融摄**」之枢。\n\n---\n\n## 二、全文逐段与逐颂细读（華藏世界品第五）\n\n> **体例**：本品三段共长行 47 段（`<p>`）、偈颂 181 条（两行一颂）。下依品文次第，段段疏解、组组会读；**异体字照底本**：之一长行七段（华藏因果自体＋安布庄严）与总结段**逐段全引**，之二／之三之十海（枚举体，各二十重）**以总表全列其数据**并全引其首末代表段；**偈颂之一八组（80 颂）与之三巨颂（101 颂）皆全出**（之三按澄观十段分并逐段疏解）。凡句读依 CBETA。「疏解／名相／会读」三层如前三部。\n\n### 2.0 全品结构总表\n\n| 分段 | 品内段 | 卷 | 长行／颂 | 内容 |\n|---|--------|----|---------|------|\n| **之一** | 華藏因果自體 | 卷八 | P1＋颂①（10） | 华藏庄严世界海·十风轮·香水海·大莲华「種種光明蘂香幢」 |\n| | 藏海安布庄严 | 卷八 | P4＋颂②（10） | 大轮围山（金刚山周匝围绕） |\n| | 台面宝地 | 卷八 | P7＋颂③（10） | 金刚宝地、宝轮罗网、如天帝網 |\n| | 地面香海 | 卷八 | P10＋颂④（10） | 不可說佛剎微塵數香水海 |\n| | 海間香河 | 卷八 | P13＋颂⑤（10） | 一一香海有四天下微塵數香水河 |\n| | 河间华林 | 卷八 | P16＋颂⑥（10） | 白莲华·宝树出五业用 |\n| | 总结庄严 | 卷八 | P19＋颂⑦（10） | 诸佛世尊世界海庄严不可思议 |\n| | 世界种总说 | 卷八 | P22–P26＋颂⑧（10） | 告众·双标二章·剎種十門（依住／形状／体性） |\n| | 中央世界种 | 卷八 | P29–P31 | 中央香水海「無邊妙華光」·世界种「普照十方熾然寶光明」二十重·收摄 |\n| **之二** | 十方十海 | 卷九 | P33–P43 | 东「離垢焰藏」南「無盡光明輪」右旋八海，各出华持种，各二十重 |\n| **之三** | 十海所管之海 | 卷十 | P45–P55 | 十海各管之外围香水海（约百海）·其最近輪圍山海之一 |\n| | 总结 | 卷十 | P56 | 十不可說香水海·十不可說世界種·世界网 |\n| | 重颂 | 卷十 | P57–P58＋颂⑨（101） | 重宣其义（初颂华藏自体·余百颂所持剎网） |\n\n**颂之分布**：之一 8 组×10 颂＝80 颂；之三 1 组×101 颂。`<l>` 行数 362＝181 颂×2。\n\n### 2.1 之一·华藏因果自体（风轮→香海→莲华→剎海）＋颂①\n\n**经文（卷八首，品题后，长行第一段）**：\n\n> 爾時，普賢菩薩復告大眾言：「諸佛子！此華藏莊嚴世界海，是毘盧遮那如來往昔於世界海微塵數劫修菩薩行時，一一劫中親近世界海微塵數佛，一一佛所淨修世界海微塵數大願之所嚴淨。諸佛子！此華藏莊嚴世界海，有須彌山微塵數風輪所持。其最下風輪，名：平等住，能持其上一切寶焰熾然莊嚴。次上風輪，名：出生種種寶莊嚴，能持其上淨光照耀摩尼王幢。次上風輪，名：寶威德，能持其上一切寶鈴。次上風輪，名：平等焰，能持其上日光明相摩尼王輪。次上風輪，名：種種普莊嚴，能持其上光明輪華。次上風輪，名：普清淨，能持其上一切華焰師子座。次上風輪，名：聲遍十方，能持其上一切珠王幢。次上風輪，名：一切寶光明，能持其上一切摩尼王樹華。次上風輪，名：速疾普持，能持其上一切香摩尼須彌雲。次上風輪，名：種種宮殿遊行，能持其上一切寶色香臺雲。諸佛子！彼須彌山微塵數風輪，最在上者，名：殊勝威光藏，能持普光摩尼莊嚴香水海；此香水海有大蓮華，名：種種光明蘂香幢。華藏莊嚴世界海，住在其中，四方均平，清淨堅固；金剛輪山，周匝圍遶；地海眾樹，各有區別。」\n\n**疏解**：此一品之总叙分三。**一、举果属人显因深广**：指此剎海为毘盧遮那（卢舍那）「往昔修菩萨行时」所严净，而因之深广有三胜相（澄观）：**长时修**（世界海微塵數劫，不唯三祇）、**多胜缘**（一一劫中亲近世界海微尘数佛，不唯一佛）、**净多愿**（一一佛所净修世界海微尘数大愿，不唯净一）；由三重故云「深广」。**二、明能持之因——风轮**：有「須彌山微塵數風輪」持此剎海，最下者「平等住」，最上者「殊勝威光藏」。风轮者，**持境之力**：李通玄判「**風輪，是大願波羅蜜所成報**」（`T1739`）；澄观判「**今初風輪之因，即大願等**」（`T1735`）。**三、明所持之果——香海、莲华、剎海**：最上风轮持「普光摩尼莊嚴香水海」，海中出大蓮華「**種種光明蘂香幢**」，华藏庄严世界海即住其中，四方均平、清净坚固，为金刚轮山所绕。此即「**海出莲华、华持剎海**」二事（澄观十事之第三、第四）。\n\n**名相**：\n- **「剎海」**：剎，梵 *kṣetra*（国土）；海，以深广无尽立名。剎海＝国土之无尽聚。\n- **「風輪」**：梵 *vāta-maṇḍala*，承托大地之气层。此十大风轮之名（平等住·出生種種寶莊嚴·寶威德·平等焰·種種普莊嚴·普清淨·聲遍十方·一切寶光明·速疾普持·種種宮殿遊行）＋最上「殊勝威光藏」，皆随所持之严具而立。六十本作「**平等·種種寶莊嚴·功德勢·寶焰·普莊嚴·離垢清淨平等·方行·一切年·普持勢·莊嚴光明**」＋最上「**勝藏**」（`T09n0278` 卷三），与八十本名目略异（§6.3）。\n- **「香水海」**：以海为体、以香为用。澄观：「**以摩尼發光，普照一切嚴海底岸，及寶色香水，故立此名。又藏識名海……佛性名水，遠熏名香**」（`T1735`）。\n- **「種種光明蘂香幢」**：大莲华之名。蘂（蕊），花心；幢，高显。澄观：「**所出蓮華，蘂放異光，又發勝香，高出降伏，故立此名。又所發萬行，一一覺性，故曰光明；皆能普熏，即香義也**」（`T1735`）。六十本作「**香幢光明莊嚴**」（`T09n0278` 卷三）。\n\n**会读**：澄观判此段为「**别显安布庄严**」之第一段（能持风轮／所持香海／海出莲华／华持剎海）。又总判本品「**一品分三：初明華藏因果自體……三段如次，釋華藏莊嚴世界之名**」（`T1735`）。李通玄以「风轮—大愿、香海—大悲、莲华—法身随行无依住智」配之（详见 §5.3）。**依正不二**之枢，即在一一严具皆是一一愿行之果报——非有一「客观之宇宙」离于心行而独存。\n\n**颂①（10 颂，长行第一段后）**：\n\n> 是時，普賢菩薩欲重宣其義，承佛神力，觀察十方而說頌言：\n> 「世尊往昔於諸有，微塵佛所修淨業，\n> 故獲種種寶光明，華藏莊嚴世界海。\n> 廣大悲雲遍一切，捨身無量等剎塵，\n> 以昔劫海修行力，今此世界無諸垢。\n> 放大光明遍住空，風力所持無動搖，\n> 佛藏摩尼普嚴飾，如來願力令清淨。\n> 普散摩尼妙藏華，以昔願力空中住，\n> 種種堅固莊嚴海，光雲垂布滿十方。\n> 諸摩尼中菩薩雲，普詣十方光熾然，\n> 光焰成輪妙華飾，法界周流靡不遍。\n> 一切寶中放淨光，其光普照眾生海，\n> 十方國土皆周遍，咸令出苦向菩提。\n> 寶中佛數等眾生，從其毛孔出化形，\n> 梵主帝釋輪王等，一切眾生及諸佛。\n> 化現光明等法界，光中演說諸佛名，\n> 種種方便示調伏，普應群心無不盡。\n> 華藏世界所有塵，一一塵中見法界，\n> 寶光現佛如雲集，此是如來剎自在。\n> 廣大願雲周法界，於一切劫化群生，\n> 普賢智地行悉成，所有莊嚴從此出。」\n\n**疏解**：此十颂重宣长行「举果属人显因深广」之义，而尤重「**依正相成**」。前四颂追叙「世尊往昔微塵佛所修淨業」为华藏之因，「**以昔劫海修行力，今此世界無諸垢**」；中五颂显「宝中现佛、光中说法、化形调伏」之果用；末颂「**華藏世界所有塵，一一塵中見法界，寶光現佛如雲集**」为全品名句，直揭「**尘中现法界**」之因陀罗网；终归「**廣大願雲周法界……所有莊嚴從此出**」——明华藏一切庄严，皆从普贤愿行而出。\n\n**名相**：「**諸有**」＝三有（欲·色·无色）之生死处。「**剎塵**」＝剎碎为尘，喻极多。「**法界**」（*dharma-dhātu*）＝诸法之全体／实性。「**剎自在**」＝如来于剎之自在神力。\n\n**会读**：此十颂为「**依正相成·尘中见法**」之总纲。澄观「**約眾生，如來藏識即是香海……染淨果法，重疊無礙，故所感剎相狀如之**」（`T1735`）正与此颂合——华藏之严，非离众生心识而别有。**此颂亦为本品与整个华严「依正不二」之枢纽**。\n\n**〔本文判断〕**：此颂（十）为之一全段之「体」，下之六组颂（②–⑦）皆「用」（轮山／大地／香海／香河／河间地／总严），末组颂（⑧，剎種十門）为「相」，中央世界种（长行第八段）为「具体之例证」。故本品之一，实「**体—用—相—例**」四重结构。（**校勘按**：本颂非「心如工画师」之唯心偈——彼在卷十九〈夜摩天宫菩萨说偈品〉，与本颂无涉，勿混。）\n\n### 2.2 之一·大轮围山＋颂②\n\n**经文（长行第二段）**：\n\n> 爾時，普賢菩薩復告大眾言：「諸佛子！此華藏莊嚴世界海大輪圍山，住日珠王蓮華之上，栴檀摩尼以為其身，威德寶王以為其峯，妙香摩尼而作其輪，焰藏金剛所共成立，一切香水流注其間；眾寶為林，妙華開敷，香草布地，明珠間飾，種種香華處處盈滿；摩尼為網，周匝垂覆……。如是等，有世界海微塵數眾妙莊嚴。」\n\n**疏解**：此为**安布庄严**之第一（澄观十事之第五「繞臺輪山」）。大轮围山（斫迦罗，*cakravāla*）「住日珠王蓮華之上」，「栴檀摩尼以為其身，威德寶王以為其峯，妙香摩尼而作其輪，焰藏金剛所共成立」，周匝围绕华藏世界海，如城之护。**义**：轮山者，「**清淨戒德，內攝外防之所成也**」（澄观 `T1735`）——内摄诸根、外防诸恶，故以众宝金刚为体。六十本作「此世界海邊有金剛山周匝圍遶」（`T09n0278` 卷三）。\n\n**名相**：「**斫迦羅**」（*cakravāla*）＝轮围（山）；「**金剛**」＝金刚石（*vajra*），坚不可摧，喻戒德。「**日珠王蓮華**」＝轮山所住之华。「**世界海微塵數眾妙莊嚴**」＝庄严之量。\n\n**会读**：澄观「**輪山則清淨戒德，內攝外防之所成也**」。**戒为定慧之基**，故山居最外——此与三学之「戒」位合。此处底本作「周匝垂覆……如是等，有世界海微塵數眾妙莊嚴」，文以省略号收，显「广说不尽」。\n\n**颂②（10 颂，长行第二段后）**：\n\n> 爾時，普賢菩薩欲重宣其義，承佛神力，觀察十方而說頌言：\n> 「世界大海無有邊，寶輪清淨種種色，\n> 所有莊嚴盡奇妙，此由如來神力起。\n> 摩尼寶輪妙香輪，及以真珠燈焰輪，\n> 種種妙寶為嚴飾，清淨輪圍所安住。\n> 堅固摩尼以為藏，閻浮檀金作嚴飾，\n> 舒光發焰遍十方，內外映徹皆清淨。\n> 金剛摩尼所集成，復雨摩尼諸妙寶，\n> 其寶精奇非一種，放淨光明普嚴麗。\n> 香水分流無量色，散諸華寶及栴檀，\n> 眾蓮競發如衣布，珍草羅生悉芬馥。\n> 無量寶樹普莊嚴，開華發蘂色熾然，\n> 種種名衣在其內，光雲四照常圓滿。\n> 無量無邊大菩薩，執蓋焚香充法界，\n> 悉發一切妙音聲，普轉如來正法輪。\n> 諸摩尼樹寶末成，一一寶末現光明，\n> 毘盧遮那清淨身，悉入其中普令見。\n> 諸莊嚴中現佛身，無邊色相無央數，\n> 悉往十方無不遍，所化眾生亦無限。\n> 一切莊嚴出妙音，演說如來本願輪，\n> 十方所有淨剎海，佛自在力咸令遍。」\n\n**疏解**：重宣轮山之体相与妙用。前七颂显「宝轮香轮·摩尼为藏·金刚所成·香水众莲·宝树名衣」之山体庄严及菩萨云集；后三颂显「宝末现佛身·庄严出妙音」之妙用，归「**十方所有淨剎海，佛自在力咸令遍**」——亦显依正无碍。澄观判：「**應頌有十……前六明山體相莊嚴，後四辯山妙用自在，亦顯依正無礙**」（`T1735`）。\n\n### 2.3 之一·大轮围山内大地＋颂③\n\n**经文（长行第三段）**：\n\n> 爾時，普賢菩薩復告大眾言：「諸佛子！此世界海大輪圍山內所有大地，一切皆以金剛所成，堅固莊嚴，不可沮壞；清淨平坦，無有高下；摩尼為輪，眾寶為藏；一切眾生，種種形狀；諸摩尼寶，以為間錯；散眾寶末，布以蓮華；香藏摩尼，分置其間；諸莊嚴具，充遍如雲，三世一切諸佛國土所有莊嚴而為校飾；摩尼妙寶以為其網，普現如來所有境界，如天帝網於中布列。諸佛子！此世界海地，有如是等世界海微塵數莊嚴。」\n\n**疏解**：此为**安布庄严**之第二（澄观十事之第六「台面宝地」）。大轮围山内大地「一切皆以金剛所成」，坚固不坏；「清淨平坦，無有高下」，体性平等；「摩尼為輪，眾寶為藏」「諸摩尼寶以為間錯」，相用庄严；末「**摩尼妙寶以為其網，普現如來所有境界，如天帝網於中布列**」——此句为全品「**因陀罗网**」之第一伏笔（字面「如天帝網」）。**义**：宝地者，「**體心性定之所成也**」（澄观 `T1735`）——心性之定，故地平净；一切庄严，皆定中之慧用。\n\n**名相**：「**如天帝網**」（*indra-jāla*）＝帝释天宫之珠网，一一珠中各现一切珠影，喻「一即一切、一切即一」之重重无尽。「**校飾**」＝庄校严饰。\n\n**会读**：澄观判「**臺面寶地，即體心性定之所成也**」，又「**以一切佛身、眾生身、寶身而莊嚴者，顯三世間（器／正覺／眾生）之嚴悉入一地**」（`T1735`）。此为「**三世間互严**」之要。\n\n**颂③（10 颂，长行第三段后）**：\n\n> 爾時，普賢菩薩欲重宣其義，承佛神力，觀察十方而說頌言：\n> 「其地平坦極清淨，安住堅固無能壞，\n> 摩尼處處以為嚴，眾寶於中相間錯。\n> 金剛為地甚可悅，寶輪寶網具莊嚴，\n> 蓮華布上皆圓滿，妙衣彌覆悉周遍。\n> 菩薩天冠寶瓔珞，悉布其地為嚴好，\n> 栴檀摩尼普散中，咸舒離垢妙光明。\n> 寶華發焰出妙光，光焰如雲照一切，\n> 散此妙華及眾寶，普覆於地為嚴飾。\n> 密雲興布滿十方，廣大光明無有盡，\n> 普至十方一切土，演說如來甘露法。\n> 一切佛願摩尼內，普現無邊廣大劫，\n> 最勝智者昔所行，於此寶中無不見。\n> 其地所有摩尼寶，一切佛剎咸來入，\n> 彼諸佛剎一一塵，一切國土亦入中。\n> 妙寶莊嚴華藏界，菩薩遊行遍十方，\n> 演說大士諸弘願，此是道場自在力。\n> 摩尼妙寶莊嚴地，放淨光明備眾飾，\n> 充滿法界等虛空，佛力自然如是現。\n> 諸有修治普賢願，入佛境界大智人，\n> 能知於此剎海中，如是一切諸神變。」\n\n**疏解**：重宣大地庄严。澄观判此颂（「後三偈颂體性」等分判见 `T1735`）；其中「**其地所有摩尼寶，一切佛剎咸來入，彼諸佛剎一一塵，一切國土亦入中**」为「**相入**」之教证，「**摩尼妙寶莊嚴地……充滿法界等虛空**」为「**广狭无碍**」。\n\n### 2.4 之一·地面香海＋颂④\n\n**经文（长行第四段）**：\n\n> 爾時，普賢菩薩復告大眾言：「諸佛子！此世界海大地中，有不可說佛剎微塵數香水海，一切妙寶莊嚴其底，妙香摩尼莊嚴其岸，毘盧遮那摩尼寶王以為其網；香水映徹，具眾寶色，充滿其中；種種寶華，旋布其上；栴檀細末，澄垽其下；演佛言音，放寶光明；無邊菩薩，持種種蓋，現神通力。一切世界所有莊嚴，悉於中現。十寶階陛，行列分布；十寶欄楯，周匝圍遶；四天下微塵數一切寶莊嚴芬陀利華，敷榮水中；不可說百千億那由他數十寶尸羅幢，恒河沙數一切寶衣鈴網幢，恒河沙數無邊色相寶華樓閣，百千億那由他數十寶蓮華城，四天下微塵數眾寶樹林——寶焰摩尼以為其網，恒河沙數栴檀香、諸佛言音光焰摩尼、不可說百千億那由他數眾寶垣牆，悉共圍遶，周遍嚴飾。」\n\n**疏解**：此为**安布庄严**之第三（澄观十事之第七「地有香海」）。地上有「不可說佛剎微塵數香水海」，一一皆妙宝为底、妙香摩尼为岸、毘卢遮那摩尼宝王为网，香水映彻具众宝色，宝华旋布其上、栴檀细末澄垽其下，演佛言音放宝光明，无边菩萨现神通力；复有十宝阶陛、栏楯，芬陀利华敷荣水中，十宝尸罗幢、宝衣铃网幢、宝华楼阁、宝莲华城、众宝树林、栴檀香、光焰摩尼、众宝垣墙，悉共围绕周遍严饰。**义**：香海者，澄观「**上之大海既是藏識，今明心華之內，攝諸種子，一一種子不離藏識海故，有多香海**」（`T1735`）——心性中本具无量德用（种子），故有众香海；又「**以法門合之，可以意得**」。\n\n**名相**：「**不可說佛剎微塵數**」＝以「佛剎碎為微塵」之数喻极多（「不可說」为《华严》数法诸单位之一）。「**芬陀利**」（*puṇḍarīka*）＝白莲华。「**垽**」＝沉淀之渣滓。「**尸羅幢**」＝戒幢（*śīla*，戒）。\n\n**会读**：澄观「**準下剎種及梵本中，皆有十不可說。今闕十字**」（`T1735`）——即今底本「不可說」前脱「十」字（§1.5·1）。\n\n**颂④（10 颂，长行第四段后）**：\n\n> 爾時，普賢菩薩欲重宣其義，承佛神力，觀察十方而說頌言：\n> 「此世界中大地上，有香水海摩尼嚴，\n> 清淨妙寶布其底，安住金剛不可壞。\n> 香藏摩尼積成岸，日焰珠輪布若雲，\n> 蓮華妙寶為瓔珞，處處莊嚴淨無垢。\n> 香水澄渟具眾色，寶華旋布放光明，\n> 普震音聲聞遠近，以佛威神演妙法。\n> 階陛莊嚴具眾寶，復以摩尼為間飾，\n> 周迴欄楯悉寶成，蓮華珠網如雲布。\n> 摩尼寶樹列成行，華蘂敷榮光赫奕，\n> 種種樂音恒競奏，佛神通力令如是。\n> 種種妙寶芬陀利，敷布莊嚴香水海，\n> 香焰光明無暫停，廣大圓滿皆充遍。\n> 明珠寶幢恒熾盛，妙衣垂布為嚴飾，\n> 摩尼鈴網演法音，令其聞者趣佛智。\n> 妙寶蓮華作城廓，眾彩摩尼所嚴瑩，\n> 真珠雲影布四隅，如是莊嚴香水海。\n> 垣牆繚繞皆周匝，樓閣相望布其上，\n> 無量光明恒熾然，種種莊嚴清淨海。\n> 毘盧遮那於往昔，種種剎海皆嚴淨，\n> 如是廣大無有邊，悉是如來自在力。」\n\n**疏解**：重宣香海之体状（底／岸／网／水／华／垽／声／光／菩萨现通／结广无尽）与异庄严（十宝阶陛等）。澄观判「**文有二十句，前十明海體狀……後十（寶下）十句攝異莊嚴**」（`T1735`）。\n\n### 2.5 之一·海間香河＋颂⑤\n\n**经文（长行第五段）**：\n\n> 爾時，普賢菩薩復告大眾言：「諸佛子！一一香水海，各有四天下微塵數香水河，右旋圍遶，一切皆以金剛為岸，淨光摩尼以為嚴飾，常現諸佛寶色光雲，及諸眾生所有言音；其河所有漩澓之處，一切諸佛所修因行種種形相皆從中出；摩尼為網，眾寶鈴鐸，諸世界海所有莊嚴悉於中現；摩尼寶雲以覆其上，其雲普現華藏世界毘盧遮那十方化佛，及一切佛神通之事；復出妙音，稱揚三世佛菩薩名；其香水中，常出一切寶焰光雲，相續不絕。若廣說者，一一河各有世界海微塵數莊嚴。」\n\n**疏解**：此为**安布庄严**之第四（澄观十事之第八「海間香河」）。一一香海各有「四天下微塵數香水河」，右旋围绕，金刚为岸，净光摩尼严饰，常现诸佛宝色光云及众生言音；河中漩澓之处出「諸佛所修因行」之形相，摩尼为网、众宝铃铎现世界海庄严，宝云覆上而现毘卢遮那十方化佛，复出妙音称扬三世佛菩萨名，香水常出宝焰光云相续不绝。**义**：香河者，澄观「**海間香河，即隨一一心，同時相應功德流注也**」（`T1735`）——心与心所「同时相应」，如河之流注，与海（藏识）相依。**右旋**者，环行无返，喻智行之顺法性。\n\n**名相**：「**右旋**」（梵 *pradakṣiṇa*）＝顺时针右绕，为敬顺之相。「**四天下微塵數**」＝一四天下（须弥四洲之范围）碎为微尘之数。「**漩澓**」＝回流旋涡。\n\n**会读**：六十本作「**一一香水海，有四天下微塵數香水河圍遶……彼諸香水河從佛眉間白毫相出，摩尼寶王汎上隨流**」（`T09n0278` 卷三）——多「從佛眉間白毫相出」一句，为六十本之义增〔待核：八十本此段是否别有对应，须核全句〕。\n\n**颂⑤（10 颂，长行第五段后）**：\n\n> 爾時，普賢菩薩欲重宣其義，承佛神力，觀察十方而說頌言：\n> 「清淨香流滿大河，金剛妙寶為其岸，\n> 寶末為輪布其地，種種嚴飾皆珍好。\n> 寶階行列妙莊嚴，欄楯周迴悉殊麗，\n> 真珠為藏眾華飾，種種纓鬘共垂下。\n> 香水寶光清淨色，恒吐摩尼競疾流，\n> 眾華隨浪皆搖動，悉奏樂音宣妙法。\n> 細末栴檀作泥垽，一切妙寶同洄澓，\n> 香藏氛氳布在中，發焰流芬普周遍。\n> 河中出生諸妙寶，悉放光明色熾然，\n> 其光布影成臺座，華蓋珠瓔皆具足。\n> 摩尼王中現佛身，光明普照十方剎，\n> 以此為輪嚴飾地，香水映徹常盈滿。\n> 摩尼為網金為鐸，遍覆香河演佛音，\n> 克宣一切菩提道，及以普賢之妙行。\n> 寶岸摩尼極清淨，恒出如來本願音，\n> 一切諸佛曩所行，其音普演皆令見。\n> 其河所有漩流處，菩薩如雲常踊出，\n> 悉往廣大剎土中，乃至法界咸充滿。\n> 清淨珠王布若雲，一切香河悉彌覆，\n> 其珠等佛眉間相，炳然顯現諸佛影。」\n\n**疏解**：重宣香河（岸体金刚／摩尼严岸／光云言音／漩澓出影／网铎垂覆／现佛依正／浪出妙音／水出光云），澄观判「**十頌……更有影略，可以意得**」（`T1735`）。\n\n### 2.6 之一·香河两间之地＋颂⑥\n\n**经文（长行第六段）**：\n\n> 爾時，普賢菩薩復告大眾言：「諸佛子！此諸香水河兩間之地，悉以妙寶種種莊嚴，一一各有四天下微塵數；眾寶莊嚴芬陀利華周匝遍滿，各有四天下微塵數；眾寶樹林次第行列，一一樹中恒出一切諸莊嚴雲，摩尼寶王照耀其間，種種華香處處盈滿；其樹復出微妙音聲，說諸如來一切劫中所修大願；復散種種摩尼寶王，充遍其地，所謂：蓮華輪摩尼寶王、香焰光雲摩尼寶王、種種嚴飾摩尼寶王、現不可思議莊嚴色摩尼寶王、日光明衣藏摩尼寶王、周遍十方普垂布光網雲摩尼寶王、現一切諸佛神變摩尼寶王、現一切眾生業報海摩尼寶王……如是等，有世界海微塵數。其香水河，兩間之地，一一悉具如是莊嚴。」\n\n**疏解**：此为**安布庄严**之第五（澄观十事之第九「河間樹等」）。香河两间之地，「悉以妙寶種種莊嚴」：众宝庄严芬陀利华周匝遍满（各四天下微尘数），众宝树林次第行列，一一树中恒出一切庄严云，摩尼宝王照耀其间，华香盈满；其树复出微妙音声说如来大愿；复散种种摩尼宝王充遍其地（莲华轮、香焰光云、种种严饰、现不可思议庄严色、日光明衣藏、周遍十方普垂布光网云、现一切诸佛神变、现一切众生业报海等八种，广说则世界海微尘数）。**义**：地树者，显「**一樹之中，已有多剎海之嚴**」（澄观 `T1735`），即「一中無量」之具体化。\n\n**名相**：「**芬陀利**」（*puṇḍarīka*）＝白莲华，正敷荣者（《疏》：「芬陀利者，即白蓮華，亦是正敷榮時」）。「**摩尼寶王**」＝如意宝珠之王，出严具、演法音。\n\n**会读**：澄观「**然此一段文勢少異，不列十事以顯無盡，而但舉二（華、樹）展轉明多**」（`T1735`）——此段不列十事而举二事，为「**由一显多**」之法。\n\n**颂⑥（10 颂，长行第六段后）**：\n\n> 爾時，普賢菩薩欲重宣其義，承佛神力，觀察十方而說頌言：\n> 「其地平坦極清淨，真金摩尼共嚴飾，\n> 諸樹行列蔭其中，聳幹垂條華若雲。\n> 枝條妙寶所莊嚴，華焰成輪光四照，\n> 摩尼為果如雲布，普使十方常現覩。\n> 摩尼布地皆充滿，眾華寶末共莊嚴，\n> 復以摩尼作宮殿，悉現眾生諸影像。\n> 諸佛影像摩尼王，普散其地靡不周，\n> 如是赫奕遍十方，一一塵中咸見佛。\n> 妙寶莊嚴善分布，真珠燈網相間錯，\n> 處處悉有摩尼輪，一一皆現佛神通。\n> 眾寶莊嚴放大光，光中普現諸化佛，\n> 一一周行靡不遍，悉以十力廣開演。\n> 摩尼妙寶芬陀利，一切水中咸遍滿，\n> 其華種種各不同，悉現光明無盡歇。\n> 三世所有諸莊嚴，摩尼果中皆顯現，\n> 體性無生不可取，此是如來自在力。\n> 此地一切莊嚴中，悉現如來廣大身，\n> 彼亦不來亦不去，佛昔願力皆令見。\n> 此地一一微塵中，一切佛子修行道，\n> 各見所記當來剎，隨其意樂悉清淨。」\n\n**疏解**：重宣宝树／芬陀利／结严所因。结严所因之三颂，澄观判「**有多意趣**」：初颂器世间、次颂智正觉、后颂众生世间——「**欲明一一事中皆現三世間嚴**」（`T1735`）。\n\n### 2.7 之一·總顯多嚴＋颂⑦\n\n**经文（P19）**：\n\n> 爾時，普賢菩薩復告大眾言：「諸佛子！諸佛世尊世界海，莊嚴不可思議。何以故？諸佛子！此華藏莊嚴世界海一切境界，一一皆以世界海微塵數清淨功德之所莊嚴。」\n\n**疏解**：此为**安布庄严**之第六（澄观十事之第十「總結多嚴」）。上来诸段虽广说庄严，犹未能尽，故今总显：一一之境，皆具「世界海微塵數清淨功德」之庄严，「**若說不說，皆具**」（澄观 `T1735`）。**义**：此句为本品「**无尽**」之关门——不说亦具，可见庄严不在言说，而在当体。\n\n**名相**：「**世界海微塵數清淨功德**」＝以「世界海碎為微塵」之数喻一切庄严之因德。\n\n**会读**：澄观「**上來諸段，雖說莊嚴，猶未能盡……是以文云一切境界**」；「**若語果嚴，略有五相**」：一令多周给一切、二令常永无乏绝、三令妙悦可众心、四称性无生无相、五自在镕融无碍（`T1735`）。\n\n**颂⑦（10 颂，P20 引＋P21）**：\n\n> 爾時，普賢菩薩欲重宣其義，承佛神力，觀察十方而說頌言：\n> 「此剎海中一切處，悉以眾寶為嚴飾，\n> 發焰騰空布若雲，光明洞徹常彌覆。\n> 摩尼吐雲無有盡，十方佛影於中現，\n> 神通變化靡暫停，一切菩薩咸來集。\n> 一切摩尼演佛音，其音美妙不思議，\n> 毘盧遮那昔所行，於此寶內恒聞見。\n> 清淨光明遍照尊，莊嚴具中皆現影，\n> 變化分身眾圍遶，一切剎海咸周遍。\n> 所有化佛皆如幻，求其來處不可得，\n> 以佛境界威神力，一切剎中如是現。\n> 如來自在神通事，悉遍十方諸國土，\n> 以此剎海淨莊嚴，一切皆於寶中見。\n> 十方所有諸變化，一切皆如鏡中像，\n> 但由如來昔所行，神通願力而出生。\n> 若有能修普賢行，入於菩薩勝智海，\n> 能於一切微塵中，普現其身淨眾剎。\n> 不可思議億大劫，親近一切諸如來，\n> 如其一切之所行，一剎那中悉能現。\n> 諸佛國土如虛空，無等無生無有相，\n> 為利眾生普嚴淨，本願力故住其中。」\n\n**疏解**：此十颂重宣「總顯多嚴」，而归「**如镜中像·如幻·威神力**」。前四颂显「宝中现佛、宝演佛音」；中三颂显「化佛如幻、求处不得」；后三颂显「普贤行·尘中现身·本愿力」。**义**：末颂「**諸佛國土如虛空，無等無生無有相，為利眾生普嚴淨，本願力故住其中**」——明「**严即无严**」：土体如虚空，无生无相，然以本愿力故，为利众生而普严净。此与下 §2.13 重颂「**華藏世界海，法界等無別**」首尾相应。\n\n**名相**：「**摩尼**」（*maṇi*）＝如意宝珠。「**如鏡中像**」＝喻现而无实、非无影像。**会读**：澄观判此颂「**十偈分二：前六果嚴用勝，後四對因辯果**」（`T1735`）。\n\n> **〔之一前半小结〕** 自 P1 至 P21，为之一之前半，即「**华藏因果自体**」（4 事）＋「**藏海安布庄严**」（6 事），共十事，配 7 长行段＋7 偈组（80 颂中之 70 颂）。长行明「依报之器」，偈颂明「器中有心（佛·菩萨·众生三世間互严）」。下一节为之一之后半——「**所持剎网差别**」。\n\n### 2.8 之一·世界种总说（剎種十門）＋颂⑧\n\n**经文（P22–P26）**：\n\n> 爾時，普賢菩薩復告大眾言：「諸佛子！此中有何等世界住？我今當說。諸佛子！此不可說佛剎微塵數香水海中，有不可說佛剎微塵數世界種安住；一一世界種，復有不可說佛剎微塵數世界。諸佛子！彼諸世界種，於世界海中，各各依住，各各形狀，各各體性，各各方所，各各趣入，各各莊嚴，各各分齊，各各行列，各各無差別，各各力加持。\n> 「諸佛子！此世界種，或有依大蓮華海住，或有依無邊色寶華海住，或有依一切真珠藏寶瓔珞海住，或有依香水海住，或有依一切華海住，或有依摩尼寶網海住，或有依漩流光海住，或有依菩薩寶莊嚴冠海住，或有依種種眾生身海住，或有依一切佛音聲摩尼王海住……。如是等，若廣說者，有世界海微塵數。\n> 「諸佛子！彼一切世界種，或有作須彌山形，或作江河形，或作迴轉形，或作漩流形，或作輪輞形，或作壇墠形，或作樹林形，或作樓閣形，或作山幢形，或作普方形，或作胎藏形，或作蓮華形，或作佉勒迦形，或作眾生身形，或作雲形，或作諸佛相好形，或作圓滿光明形，或作種種珠網形，或作一切門闥形，或作諸莊嚴具形……。如是等，若廣說者，有世界海微塵數。\n> 「諸佛子！彼一切世界種，或有以十方摩尼雲為體，或有以眾色焰為體，或有以諸光明為體，或有以寶香焰為體，或有以一切寶莊嚴多羅華為體，或有以菩薩影像為體，或有以諸佛光明為體，或有以佛色相為體，或有以一寶光為體，或有以眾寶光為體，或有以一切眾生福德海音聲為體，或有以一切眾生諸業海音聲為體，或有以一切佛境界清淨音聲為體，或有以一切菩薩大願海音聲為體，或有以一切佛方便音聲為體，或有以一切剎莊嚴具成壞音聲為體，或有以無邊佛音聲為體，或有以一切佛變化音聲為體，或有以一切眾生善音聲為體，或有以一切佛功德海清淨音聲為體……。如是等，若廣說者，有世界海微塵數。」\n\n**疏解**：此为「**所持剎网差别**」之总标，文分三（澄观）：**一、告众许说**（P22，普贤告众）；**二、双标二章**（P23，标「**剎种**」与「**剎**」二章，二者关系为「剎種依剎海、諸剎依剎種」）；**三、广释二章**（P24–P31，先通明剎种不同，后别明剎種香海）。P23 标出剎种之**十门**：**依住·形状·体性·方所·趣入·庄严·分齐·行列·无差别·力加持**——此十门与《世界成就品》之十事**互有同异**（澄观：「**所列十事，與成就品都望全異。彼通一切海，此明一海中種故**」，又「**起具因緣、清淨、佛出、劫住、轉變，彼有此無；方所、分齊、行列、趣入、力持等五，彼無此有；依住、形體、莊嚴、無別，彼此名同**」`T1735`）。P24–P26 实展其三：**P24 依住**（十海）；**P25 形状**（二十形：须弥山／江河／回转／漩流／轮辋／坛墠／树林／楼阁／山幢／普方／胎藏／莲华／佉勒迦／众生身／云／诸佛相好／圆满光明／种种珠网／一切门闼／诸庄严具）；**P26 体性**（二十体：前十**色相**——摩尼云／众色焰／诸光明／宝香焰／多罗华／菩萨影像／诸佛光明／佛色相／一宝光／众宝光；后十**声**——众生福德海音声／众生诸业海音声／佛境界清净音声／菩萨大愿海音声／佛方便音声／剎庄严具成坏音声／无边佛音声／佛变化音声／众生善音声／佛功德海清净音声）。余七门（方所·趣入·庄严·分齐·行列·无差别·力加持）以偈颂与下中央世界种之实例显之。\n\n**名相**：\n- **「世界種」**＝剎种，世界之「种类」。澄观：「**謂積多世界共在一處，攝諸流類，故名為種。如是種類復有眾多，深廣無邊，故名為海**」，「**舊經云性，多取此義，恐濫體性，故改為種**」（`T1735`）。即六十本作「世界性」，八十改「种」。\n- **「佉勒迦」**〔待核〕＝梵 *khalika*？澄观：「**佉勒迦者，梵音，此云竹篅也**」（即竹编之囤，筒状物）。\n- **「壇墠」**＝筑土为坛、除地为墠，即方形之祭坛状。**「迴轉形」**＝「**襵褻往來之形也**」（澄观）。\n\n**会读**：此段为「**十门释剎种**」之总纲。澄观更以此十门配《佛地经》之「**十八圆满**」（显色·形色·分量·方所·因果·主·辅翼·眷属·任持·事业·摄益·无畏·住处·路·乘·门·依持），谓「**此具因緣，即因圓滿；依住，即是依持；形狀，即當形色；體攝二種……**」（`T1735`）——即以一土之庄严，具佛土之全德。\n\n**颂⑧（10 颂，P27 引＋P28）**：\n\n> 爾時，普賢菩薩欲重宣其義，承佛神力，觀察十方而說頌言：\n> 「剎種堅固妙莊嚴，廣大清淨光明藏，\n> 依止蓮華寶海住，或有住於香海等。\n> 須彌城樹壇墠形，一切剎種遍十方，\n> 種種莊嚴形相別，各各布列而安住。\n> 或有體是淨光明，或是華藏及寶雲，\n> 或有剎種焰所成，安住摩尼不壞藏。\n> 燈雲焰彩光明等，種種無邊清淨色，\n> 或有言音以為體，是佛所演不思議。\n> 或是願力所出音，神變音聲為體性，\n> 一切眾生大福業，佛功德音亦如是。\n> 剎種一一差別門，不可思議無有盡，\n> 如是十方皆遍滿，廣大莊嚴現神力。\n> 十方所有廣大剎，悉來入此世界種，\n> 雖見十方普入中，而實無來無所入。\n> 以一剎種入一切，一切入一亦無餘，\n> 體相如本無差別，無等無量悉周遍。\n> 一切國土微塵中，普見如來在其所，\n> 願海言音若雷震，一切眾生悉調伏。\n> 佛身周遍一切剎，無數菩薩亦充滿，\n> 如來自在無等倫，普化一切諸含識。」\n\n**疏解**：重宣剎種十門。前六颂显「依住·形状·体性」；第七颂「**剎種一一差別門……如是十方皆遍滿**」总收；第八、九颂为全品之「**相入**」之要——「**十方所有廣大剎，悉來入此世界種，雖見十方普入中，而實無來無所入**」；「**以一剎種入一切，一切入一亦無餘，體相如本無差別**」。第十颂归「佛身周遍·普化含识」。\n\n**会读**：澄观判此颂「**應頌有十，分為六段：初一頌依住，次一形狀及布列安住，次三體性，次三頌於五事（所入門·方所·莊嚴·分齊·趣入），次一頌無差，後一頌力持**」（`T1735`）。「**初偈，以多入一；後偈，一多互入。皆入而無入……約體本空，故無來無入；約相不壞，故如本無差**」（`T1735`）——此为本品「**事事无碍**」之教证。\n\n### 2.9 之一·中央世界种（二十重）＋收摄\n\n**经文（P29–P30 引＋中央二十重）**：\n\n> 爾時，普賢菩薩復告大眾言：「諸佛子！此不可說佛剎微塵數香水海，在華藏莊嚴世界海中，如天帝網分布而住。諸佛子！此最中央香水海，名：無邊妙華光，以現一切菩薩形摩尼王幢為底；出大蓮華，名：一切香摩尼王莊嚴；有世界種而住其上，名：普照十方熾然寶光明，以一切莊嚴具為體，有不可說佛剎微塵數世界於中布列。」\n\n**疏解**：此为「别明剎種香海」之第二（澄观：文分三——**初辩中间一海，次辩右旋十海，后明十海所管之海**）。**中央一海**（P30 前半）文分二：**先明香海出华以持剎种**，**后明所持世界**。中央香水海名「**無邊妙華光**」，底为「現一切菩薩形摩尼王幢」；出大蓮華名「**一切香摩尼王莊嚴**」；华上持世界种名「**普照十方熾然寶光明**」，以「一切莊嚴具」为体，其中布列不可說佛剎微塵數世界。又「此不可說佛剎微塵數香水海，在華藏莊嚴世界海中，**如天帝網分布而住**」——此句为「**帝網**」之第二伏笔（第一在宝地「如天帝網」）。\n\n**名相**：「**無邊妙華光**」＝香海名，以多华发光故（澄观：「**以多華發光故，亦由菩薩行華而為因故**」）。「**一切香摩尼王莊嚴**」＝莲华名。「**普照十方熾然寶光明**」＝世界种名，「**正是所含種子，一一皆有大智光明遍照法界義故**」（澄观 `T1735`）。\n\n**中央世界种二十重（P30 后半，全列）**：\n\n| 重 | 世界名 | 际（所据之界限） | 依住 | 形状 | 上覆 | 周匝围绕 | 佛号 |\n|---|--------|------|------|------|------|------|------|\n| 1 | 最勝光遍照 | 一切金剛莊嚴光耀輪 | 眾寶摩尼華 | 摩尼寶形 | 一切寶華莊嚴雲 | 佛剎微塵數 | 淨眼離垢燈 |\n| 2 | 種種香蓮華妙莊嚴 | 一切莊嚴具 | 寶蓮華網 | 師子之座 | 一切寶色珠帳雲 | 二佛剎微塵數 | 師子光勝照 |\n| 3 | 一切寶莊嚴普照光 | 香風輪 | 種種寶華瓔珞 | 八隅 | 妙光摩尼日輪雲 | 三佛剎微塵數 | 淨光智勝幢 |\n| 4 | 種種光明華莊嚴 | 一切寶王 | 眾色金剛尸羅幢海 | 摩尼蓮華 | 金剛摩尼寶光雲 | 四佛剎微塵數 | 金剛光明無量精進力善出現 |\n| 5 | 普放妙華光 | 一切寶鈴莊嚴網 | 一切樹林莊嚴寶輪網海 | 普方多有隅角 | 梵音摩尼王雲 | 五佛剎微塵數 | 香光喜力海 |\n| 6 | 淨妙光明 | 寶王莊嚴幢 | 金剛宮殿海 | 四方 | 摩尼輪髻帳雲 | 六佛剎微塵數 | 普光自在幢 |\n| 7 | 眾華焰莊嚴 | 種種華莊嚴 | 一切寶色焰海 | 樓閣之形 | 一切寶色衣真珠欄楯雲 | 七佛剎微塵數 | 歡喜海功德名稱自在光 |\n| 8 | 出生威力地 | 出一切聲摩尼王莊嚴 | 種種寶色蓮華座虛空海 | 因陀羅網 | 無邊色華網雲 | 八佛剎微塵數 | 廣大名稱智海幢 |\n| 9 | 出妙音聲 | 心王摩尼莊嚴輪 | 恒出一切妙音聲莊嚴雲摩尼王海 | 梵天身形 | 無量寶莊嚴師子座雲 | 九佛剎微塵數 | 清淨月光明相無能摧伏 |\n| 10 | 金剛幢 | 無邊莊嚴真珠藏寶瓔珞 | 一切莊嚴寶師子座摩尼海 | 周圓 | 十須彌山微塵數一切香摩尼華須彌雲 | 十佛剎微塵數 | 一切法海最勝王 |\n| 11 | 恒出現帝青寶光明 | 極堅牢不可壞金剛莊嚴 | 種種殊異華海 | 半月之形 | 諸天寶帳雲 | 十一佛剎微塵數 | 無量功德法 |\n| 12 | 光明照耀 | 普光莊嚴 | 華旋香水海 | 華旋 | 種種衣雲 | 十二佛剎微塵數 | 超釋梵 |\n| **13** | **娑婆** | 金剛莊嚴 | 種種色風輪所持蓮華網 | 如虛空 | 普圓滿天宮殿莊嚴虛空雲 | 十三佛剎微塵數 | **其佛即是毘盧遮那如來世尊** |\n| 14 | 寂靜離塵光 | 一切寶莊嚴 | 種種寶衣海 | 執金剛形 | 無邊色金剛雲 | 十四佛剎微塵數 | 遍法界勝音 |\n| 15 | 眾妙光明燈 | 一切莊嚴帳 | 淨華網海 | 卐字之形 | 摩尼樹香水海雲 | 十五佛剎微塵數 | 不可摧伏力普照幢 |\n| 16 | 清淨光遍照 | 無盡寶雲摩尼王 | 種種香焰蓮華海 | 龜甲之形 | 圓光摩尼輪栴檀雲 | 十六佛剎微塵數 | 清淨日功德眼 |\n| 17 | 寶莊嚴藏 | 一切眾生形摩尼王 | 光明藏摩尼王海 | 八隅 | 一切輪圍山寶莊嚴華樹網 | 十七佛剎微塵數 | 無礙智光明遍照十方 |\n| 18 | 離塵 | 一切殊妙相莊嚴 | 眾妙華師子座海 | 珠瓔 | 一切寶香摩尼王圓光雲 | 十八佛剎微塵數 | 無量方便最勝幢 |\n| 19 | 清淨光普照 | 出無盡寶雲摩尼王 | 無量色香焰須彌山海 | 寶華旋布 | 無邊色光明摩尼王帝青雲 | 十九佛剎微塵數 | 普照法界虛空光 |\n| 20 | 妙寶焰 | 普光明日月寶 | 一切諸天形摩尼王海 | 寶莊嚴具 | 一切寶衣幢雲及摩尼燈藏網 | 二十佛剎微塵數 | 福德相光明 |\n\n**疏解**：二十重，每一重「**有七事**」（澄观）：**举名·辩际·依住·形状·上覆·眷属（周匝围绕）·本界佛号**；第二重以下或有八事（加「去此远近」）、九事（加「纯一清净」）。**竖向**：最下第一重「最胜光遍照」，最上第二十重「妙宝焰」，娑婆居**第十三重**。**横向**：第 n 重有「n 佛剎微塵數世界周匝围绕」——即外围绕数随重数**线性递增**（1,2,3,…,20），成一「**同心递增之球壳**」模型。**中轴**：第十九重「清净光普照」以「**一切莊嚴具**」为体，第二十重「妙宝焰」为最上——然澄观谓「**其第十三主剎，即此娑婆**」，故吾人所居正在**世界种之正中**（13/20 近中）。**佛号特例**：第十三重娑婆**独作「其佛即是毗盧遮那如來世尊」**，而**不用「佛号：某某」**之格式——此为本品最著之一处文本特例（澄观亦注：「**二十層即分二十段……其第十三主剎即此娑婆**」；且澄观已觉「**但列十九佛剎塵數為二十重**」，即因娑婆一重以「其佛即是」代「佛号：」，故「佛号：」惟得十九见——参 §7.1）。\n\n**名相**：「**娑婆**」（*sahā*）＝堪忍，即吾人所居。澄观引靜法疑「形如虚空」句有梵本倒装（§1.5·3）；「**卐字之形**」（第十五重「眾妙光明燈」）之「卐」为「德者之相（吉祥海云）」（§1.5·3）。「**純一清淨**」＝此重惟净无染（第 4、7、10、13、15、18、20 重有之，共 7 见）。\n\n**收摄（P31）**：\n\n> 「諸佛子！此遍照十方熾然寶光明世界種，有如是等不可說佛剎微塵數廣大世界，各各所依住，各各形狀，各各體性，各各方面，各各趣入，各各莊嚴，各各分齊，各各行列，各各無差別，各各力加持，周匝圍遶。所謂：十佛剎微塵數迴轉形世界、十佛剎微塵數江河形世界、十佛剎微塵數漩流形世界、十佛剎微塵數輪輞形世界、十佛剎微塵數壇墠形世界、十佛剎微塵數樹林形世界、十佛剎微塵數樓觀形世界、十佛剎微塵數尸羅幢形世界、十佛剎微塵數普方形世界、十佛剎微塵數胎藏形世界、十佛剎微塵數蓮華形世界、十佛剎微塵數佉勒迦形世界、十佛剎微塵數種種眾生形世界、十佛剎微塵數佛相形世界、十佛剎微塵數圓光形世界、十佛剎微塵數雲形世界、十佛剎微塵數網形世界、十佛剎微塵數門闥形世界……。如是等，有不可說佛剎微塵數。此一一世界，各有十佛剎微塵數廣大世界周匝圍遶。此諸世界，一一復有如上所說微塵數世界而為眷屬。如是所說一切世界，皆在此無邊妙華光香水海及圍遶此海香水河中。」\n\n**疏解**：此总结中央世界种之「**眷属**」——除直上二十重主刹外，复有**旁列**之无量世界（十佛剎微塵數之十八种形状世界），一一又有十佛剎微塵數世界围绕，层层为眷属。澄观：「**上來雖復但標剎種及剎二章……二十層即分二十段**」；「**其能繞剎，但有二百一十佛剎塵數**」（1+2+…+20＝210，`T1735`）——正合「第 n 重 n 佛剎微尘数」之递增。末句「**皆在此無邊妙華光香水海及圍遶此海香水河中**」——总收世界种之所在。\n\n**会读**：澄观判中央世界种为「**正是所含種子**」；李通玄判「**此一品答前三十七問中佛世界海……舉如來五位中行業因果報得**」（`T1739`）。**〔本文判断〕** 此「中央—二十重—递增绕数—旁列眷属」之结构，为一具「**层级×环层**」之双重拓扑：竖为二十重（有限 20），横为绕数递增（1→20）并旁列无量（无限）——「**有限之重×无限之绕**」恰喻华严「**即有限而无限**」。\n\n> **校勘按**：底本 P30（立种）世界种名作「**普照**十方炽然宝光明」，而至 P31（收摄）则作「此**遍照**十方炽然宝光明世界种」——**同一种名，前后「普照／遍照」不一**，当为译出后传写之歧（参 §6.8）。\n\n### 2.10 之二·十方十香水海世界种（各二十重）\n\n**经文（P33 引＋P34–P43）**：之二纯长行，无偈颂。文分：**P33 告众**；**P34 东方「離垢焰藏海」**（此海为所绕之从东为首，其二十重**全列七事**）；**P35 南方「無盡光明輪海」**（第一重列七事，余十九重惟列「名＋佛号」）；**P36–P43 右旋八海**（金刚宝焰光·帝青宝庄严·金刚轮庄严底·莲华因陀罗网·积集宝香藏·宝庄严·金刚宝聚·天城宝堞），皆同南方之**省略式**（第一重详、余重略）。\n\n**东方第一海·離垢焰藏（P34，全列）**（举其首重与末重）：\n\n> 「諸佛子！此無邊妙華光香水海東，次有香水海，名：離垢焰藏；出大蓮華，名：一切香摩尼王妙莊嚴；有世界種而住其上，名：遍照剎旋，以菩薩行吼音為體。此中最下方，有世界，名：宮殿莊嚴幢；其形四方，依一切寶莊嚴海住，蓮華光網雲彌覆其上，佛剎微塵數世界圍遶，純一清淨，佛號：眉間光遍照。……（中略十八重）……此上過佛剎微塵數世界，有世界，名：高勝燈；狀如佛掌，依寶衣服香幢海住，日輪普照寶王樓閣雲彌覆其上，二十佛剎微塵數世界圍遶，純一清淨，佛號：普照虛空燈。」\n\n**十海总表**：\n\n| # | 方位 | 香水海 | 世界種 | 种体 | 首重世界 | 末重（20）世界 |\n|---|------|--------|--------|------|----------|---------------|\n| 1 | 東（中央之东，首） | 離垢焰藏 | 遍照剎旋 | 菩薩行吼音 | 宮殿莊嚴幢 | 高勝燈 |\n| 2 | 南 | 無盡光明輪 | 佛幢莊嚴 | 一切佛功德海音聲 | 愛見華 | 無盡光莊嚴幢 |\n| 3 | 右旋 | 金剛寶焰光 | 佛光莊嚴藏 | 稱說一切如來名音聲 | 寶焰蓮華 | 寶莊嚴藏 |\n| 4 | 右旋 | 帝青寶莊嚴 | 光照十方 | 無邊佛音聲 | 十方無盡色藏輪 | 蓮華遍照 |\n| 5 | 右旋 | 金剛輪莊嚴底 | 妙寶間錯因陀羅網 | 普賢智所生音聲 | 蓮華網 | 普雲藏 |\n| 6 | 右旋 | 蓮華因陀羅網 | 普現十方影 | 一切佛智光音聲 | 眾生海寶光明 | 無邊寶普照 |\n| 7 | 右旋 | 積集寶香藏 | 一切威德莊嚴 | 一切佛法輪音聲 | 種種出生 | 帝網莊嚴 |\n| 8 | 右旋 | 寶莊嚴 | 普無垢 | 一切微塵中佛剎神變聲 | 淨妙平坦 | 十方普堅固莊嚴照耀 |\n| 9 | 右旋 | 金剛寶聚 | 法界行 | 一切菩薩地方便法音聲 | 淨光照耀 | 毫相莊嚴 |\n| 10 | 右旋 | 天城寶堞 | 燈焰光明 | 普示一切平等法輪音 | 寶月光焰輪 | 可愛樂梵音 |\n\n**疏解**：十海「**即繞處中之海，有其十也**」（澄观），「**十海如環，繞於中海**」（澄观 `T1735`）——即中央之外，环列十海（东一、南一、右旋八），各出莲华、各持世界种、各含二十重。**方位之序**：东为首，南次之，余八皆「右旋」（顺时针），正合「**十疊繞於一盤**」之环状（澄观：「**如以十疊繞於一盤，方所可見**」）。**详略之别**：第一海（东方）二十重全列七事；第二以下，第一重详列、余十九重惟「名＋佛号」（澄观：「**初海二十重中各七事……中間唯三，謂相去數量·剎名·佛號**」）。**「此上過」之递进**：每一重之间皆「**此上過佛剎微塵數世界**」——即相邻两重之间隔「一佛剎微塵數世界」。\n\n**名相**：「**右旋**」（*pradakṣiṇa*）＝顺时针右绕。「**遍照剎旋**」「**佛幢莊嚴**」「**燈焰光明**」等＝各海之世界种名。\n\n**会读**：澄观判「**第二明右旋十海，即繞處中之海，有其十也。各有種剎，十海即為十段**」；又「**此中文無標結大數，准例可知**」（`T1735`）。**〔本文判断〕** 之二之「十海环列」，使中央世界种（1）扩为十方（10）之「**中心—环**」结构；合上之中央二十重，则本品之宇宙为「**十方十海 × 每海二十重 ＝ 10×20 ＝ 200 主刹**」（澄观：「**十海即有十不可說一海一種，是以數同**」）。\n\n### 2.11 之三·十海所管之海（外围香水海）\n\n**经文（P45 引＋P46–P55）**：之三分二·后一半——**十海所管之海 ＋ 总结 ＋ 重颂**。P45 告众；P46–P55 十段，每段述一「能管之海」之外围香水海（现文各列**九**，首段**八**），末各出「**其最近輪圍山香水海**」一（展开为**省略式二十重**：最下／與金剛幢世界齊／与娑婆世界齐／最上方四节）。**唯第五段（金刚轮庄严底所管）阙「最近輪圍山」一节**——澄观云：「**第五金剛輪莊嚴底香海所管，但列九海而結文，及最近輪圍山海……諸梵本中皆同此闕**」（`T1735`）。\n\n**十段总表**：\n\n| # | 能管之海（之二之十海） | 方位 | 所管外圍海数 | 最近輪圍山香水海 | 其世界种 | 种体 |\n|---|------|------|------|------|------|------|\n| 1 | 離垢焰藏 | 東 | 8 | 玻瓈地 | 常放光明 | 世界海清淨劫音聲 |\n| 2 | 無盡光明輪 | 外 | 9 | 妙樹華 | 出生諸方廣大剎 | 一切佛摧伏魔音 |\n| 3 | 金剛焰光明 | 外 | 9 | 無邊輪莊嚴底 | 無量方差別 | 一切國土種種言說音 |\n| 4 | 帝青寶莊嚴 | 外 | 9 | 樹莊嚴幢 | 安住帝網 | 一切菩薩智地音聲 |\n| 5 | 金剛輪莊嚴底 | 外 | 9（**阙最近輪圍山**） | 〔阙〕 | 〔阙〕 | 〔阙〕 |\n| 6 | 蓮華因陀羅網 | 外 | 9 | 密焰雲幢 | 一切光莊嚴 | 一切如來道場眾會音 |\n| 7 | 積集寶香藏 | 外 | 9 | 閻浮檀寶藏輪 | 普音幢 | 入一切智門音聲 |\n| 8 | 寶莊嚴 | 外 | 9 | 出帝青寶 | 周遍無差別 | 一切菩薩震吼聲 |\n| 9 | 金剛寶聚 | 外 | 9 | 不可壞海 | 妙輪間錯蓮華場 | 一切佛力所出音 |\n| 10 | 天城寶堞 | 外 | 9 | 積集瓔珞衣 | 化現妙衣 | 三世一切佛音聲 |\n\n（按：第一段「離垢焰藏东」首列八，余九段各九，共 **89** 外围香水海；此与本段「次有香水海」之现文计数合，详 §7.2。）\n\n**经文（P46 第一段，摘全）**：\n\n> 「諸佛子！彼離垢焰藏香水海東，次有香水海，名：變化微妙身；此海中，有世界種，名：善布差別方。次有香水海，名：金剛眼幢；世界種，名：莊嚴法界橋。……次有香水海，名：一切莊嚴具境界；世界種，名：寶焰燈……。如是等不可說佛剎微塵數香水海，其最近輪圍山香水海，名：玻瓈地；世界種，名：常放光明，以世界海清淨劫音聲為體。此中最下方，有世界，名：可愛樂淨光幢，佛剎微塵數世界圍遶，純一清淨，佛號；最勝三昧精進慧。此上過十佛剎微塵數世界，與金剛幢世界齊等，有世界，名：香莊嚴幢……此上過三佛剎微塵數世界，與娑婆世界齊等，有世界，名：放光明藏；佛號：遍法界無障礙慧明。此上過七佛剎微塵數世界，至此世界種最上方，有世界，名：最勝身香，二十佛剎微塵數世界圍遶，純一清淨，佛號：覺分華。」\n\n**经文（P55 第十段，摘全）**——末段惟此段之「最近輪圍山」一节全列四节，且首节作「有香水海，名：因陀羅華藏，世界名：發生歡喜」：\n\n> 「諸佛子！彼天城寶堞香水海外，次有香水海，名：焰輪赫奕光；世界種，名：不可說種種莊嚴。……其最近輪圍山香水海，名：積集瓔珞衣；世界種，名：化現妙衣，以三世一切佛音聲為體。此中最下方，有香水海，名：因陀羅華藏，世界名：發生歡喜，佛剎微塵數世界圍遶，純一清淨，佛號：堅悟智。此上過十佛剎微塵數世界，與金剛幢世界齊等，有世界，名：寶網莊嚴，十佛剎微塵數世界圍遶，純一清淨，佛號：無量歡喜光。此上過三佛剎微塵數世界，與娑婆世界齊等，有世界，名：寶蓮華師子座，十三佛剎微塵數世界圍遶，佛號：最清淨不空聞。此上過七佛剎微塵數世界，至此世界種最上方，有世界，名：寶色龍光明，二十佛剎微塵數世界圍遶，純一清淨，佛號：遍法界普照明。」\n\n**疏解**：此为「**十海所管之海**」（澄观第三段）。十海各管「不可說佛剎微塵數」外围香水海（现文各说九），于所管中各有**三节**（澄观）：**初、从能管海边，邻次列九**（第一段九中阙一）；**二、如是等下，总结一海所管之大数**；**三、其最近下，广说最近轮围一海**。最近輪圍山海之二十重，为**超间略说**——「**初舉下層，二超至第十等（與金剛幢世界齊），三更超至第十三（與娑婆齊），四更至第二十重（最上方）**」（澄观 `T1735`）。**「與金剛幢世界齊等」**＝与中央香海世界种之第十重「金刚幢」齐；**「與娑婆世界齊等」**＝与中央第十三重娑婆齐——即**以中央世界种之重数为坐标系**，标定外圍海所在之「高度」。**「世界名：發生歡喜」**（P55 首节）为全品**唯一**作「世界名：」而非「有世界，名：」之处〔信度 B·文本现象〕。\n\n**名相**：「**最近輪圍山**」＝所管海中距大轮围山最近者。「**與金剛幢世界齊等**」「**與娑婆世界齊等**」＝以中央世界种之第十、十三重为高度基准。「**十佛剎微塵數世界**」「**三佛剎微塵數世界**」「**七佛剎微塵數世界**」＝四节间之「相去數量」——下→10→13→20，正合「**超间至第十、第十三、第二十**」（澄观）。\n\n**会读**：澄观判「**第三大段，從第十經去，明十海所管之海。一海各管不可說佛剎塵數，現文但各說十，即為百海**」（`T1735`）——澄观谓「百海」（十段×十），与现文 89（首段 8、九段 9、第五段阙最近）微异，**当以现文为准**〔本文判断·并存〕。**〔本文判断〕** 之三之「外圍海」，使本品之宇宙由「十海环列」再扩为「**十海 × 各管无量外圍海**」——层级为「**中央种 ⊃ 十海 ⊃ 各海所管海 ⊃ 各海世界种 ⊃ 各二十重世界**」，成「**四重含藏·层层环列**」之全息结构。\n\n### 2.12 之三·总结（世界网）\n\n**经文（P56）**：\n\n> 「諸佛子！如是十不可說佛剎微塵數香水海中，有十不可說佛剎微塵數世界種，皆依現一切菩薩形摩尼王幢莊嚴蓮華住，各各莊嚴際無有間斷，各各放寶色光明，各各光明雲而覆其上，各各莊嚴具，各各劫差別，各各佛出現，各各演法海，各各眾生遍充滿，各各十方普趣入，各各一切佛神力所加持。此一一世界種中，一切世界依種種莊嚴住，遞相接連，成世界網；於華藏莊嚴世界海，種種差別，周遍建立。」\n\n**疏解**：此总收全品。文分五（澄观）：**一、总结都数**——「十不可說香水海」中各「十不可說世界種」，「一海各管一不可說十海即有十不可說，一海一種，是以數同」（澄观）；**二、结海种所依**——皆依「現一切菩薩形摩尼王幢莊嚴蓮華」住（澄观：「**即是前能持剎海本大蓮華，彼名種種光明蘂香幢，今此乃云現菩薩形等者，是此一華隨義異名**」）；**三、结种异门**——「各各莊嚴際無有間斷……各各一切佛神力所加持」（十「各各」，与剎種十門相应）；**四、结种中之剎**——「**遞相接連，成世界網**」，一世界如网孔递相接连，「如以網持橫豎交絡，皆悉相當，如天珠網」（澄观）；**五、结归华藏**——「於華藏莊嚴世界海，種種差別，周遍建立」。\n\n**名相**：「**世界網**」＝世界如网孔相连、横竖交络相当之相。「**如天珠網**」＝帝释天宫珠网（因陀罗网）之重重影现。「**現一切菩薩形摩尼王幢莊嚴蓮華**」＝大莲华之异名（随义立名）。\n\n**会读**：澄观「**上來雙釋二章長行竟**」（`T1735`）。此段为全品长行之**关门**——由「一香水海→一种→二十重」之**穷举**，升进为「十不可說×十不可說」之**总持**，终归「**成世界网**」。**〔本文判断〕** 此即澄观所谓「**上來諸段雖說莊嚴猶未能盡**」之义：一一之境皆具剎海尘数功德，不说亦具，故以「世界网」一语总收其「**无尽**」。\n\n### 2.13 之三·重颂（一百一颂）\n\n**经文（P57 引＋P58，全出）**：末缀一巨偈组，202 行 ＝ **101 颂**。澄观判：「**第二重頌總有一百一偈，分二：初一明華藏自體，餘一百偈頌所持剎網**」（`T1735`）。\n\n**（一）初 1 颂·明华藏自体（L1–L2）**：\n\n> 「華藏世界海，法界等無別，\n> 莊嚴極清淨，安住於虛空。」\n\n**疏解**：初颂标华藏自体。澄观：「**初句標名，次句不壞分量即同真性，次句具德莊嚴，末句無礙安住**」（`T1735`）。「法界等无别」者，华藏与世界海、法界，一体无别；「安住于虚空」者，不碍真性而住。\n\n**（二）9 颂·颂能持剎种（L3–L20）**：\n\n> 「此世界海中，剎種難思議，一一皆自在，各各無雜亂。\n> 華藏世界海，剎種善安布，殊形異莊嚴，種種相不同。\n> 諸佛變化音，種種為其體，隨其業力見，剎種妙嚴飾。\n> 須彌山城網，水旋輪圓形，廣大蓮華開，彼彼互圍遶。\n> 山幢樓閣形，旋轉金剛形，如是不思議，廣大諸剎種。\n> 大海真珠焰，光網不思議，如是諸剎種，悉在蓮華住。\n> 一一諸剎種，光網不可說，光中現眾剎，普遍十方海。\n> 一切諸剎種，所有莊嚴具，國土悉入中，普見無有盡。\n> 剎種不思議，世界無邊際，種種妙嚴好，皆由大仙力。」\n\n**疏解**：重宣剎種十門（参 P28 颂⑧）。澄观判此 9 颂：「**初**一**頌參而不雜，次**一**安布行列，次**一**剎種體嚴，次**二**辨形，次**一**依住，次**二**方所趣入，後**一**佛力加持**」（`T1735`）。\n\n**（三）91 颂·颂所持诸剎（L21–L202）**——澄观判分十段：\n\n**段一·28 颂·明剎异由因缘（L21–L76；以喻显 + 以法说）**：\n\n> 「一切剎種中，世界不思議，或成或有壞，或有已壞滅。\n> 譬如林中葉，有生亦有落，如是剎種中，世界有成壞。\n> 譬如依樹林，種種果差別，如是依剎種，種種眾生住。\n> 譬如種子別，生果各殊異，業力差別故，眾生剎不同。\n> 譬如心王寶，隨心見眾色，眾生心淨故，得見清淨剎。\n> 譬如大龍王，興雲遍虛空，如是佛願力，出生諸國土。\n> 如幻師呪術，能現種種事，眾生業力故，國土不思議。\n> 譬如眾繢像，畫師之所作，如是一切剎，心畫師所成。\n> 眾生身各異，隨心分別起，如是剎種種，莫不皆由業。\n> 譬如見導師，種種色差別，隨眾生心行，見諸剎亦然。\n> 一切諸剎際，周布蓮華網，種種相不同，莊嚴悉清淨。\n> 彼諸蓮華網，剎網所安住，種種莊嚴事，種種眾生居。\n> 或有剎土中，險惡不平坦，由眾生煩惱，於彼如是見。\n> 雜染及清淨，無量諸剎種，隨眾生心起，菩薩力所持。\n> 或有剎土中，雜染及清淨，斯由業力起，菩薩之所化。\n> 有剎放光明，離垢寶所成，種種妙嚴飾，諸佛令清淨。\n> 一一剎種中，劫燒不思議，所現雖敗惡，其處常堅固。\n> 由眾生業力，出生多剎土，依止於風輪，及以水輪住。\n> 世界法如是，種種見不同，而實無有生，亦復無滅壞。\n> 一一心念中，出生無量剎，以佛威神力，悉見淨無垢。\n> 有剎泥土成，其體甚堅鞕，黑闇無光照，惡業者所居。\n> 有剎金剛成，雜染大憂怖，苦多而樂少，薄福之所處。\n> 或有用鐵成，或以赤銅作，石山險可畏，罪惡者充滿。\n> 剎中有地獄，眾生苦無救，常在黑闇中，焰海所燒然。\n> 或復有畜生，種種醜陋形，由其自惡業，常受諸苦惱。\n> 或見閻羅界，飢渴所煎逼，登上大火山，受諸極重苦。\n> 或有諸剎土，七寶所合成，種種諸宮殿，斯由淨業得。\n> 汝應觀世間，其中人與天，淨業果成就，隨時受快樂。」\n\n**疏解**：此 28 颂为「**剎异由因缘**」。前 9 颂半**喻显**（林中叶·果实·种子·心王宝·龙王·幻师·画师·导師），后 18 颂**法说**（染净·成坏·苦乐）。澄观判：「**前九偈半喻顯，後十八偈法說**」；「**明由染因剎有成壞……由淨因……後三通結染淨因**」（`T1735`）。核心句：「**譬如眾繢像，畫師之所作，如是一切剎，心畫師所成**」——即「**心画师**」；「**世界法如是，種種見不同，而實無有生，亦復無滅壞**」——即「**成坏即无生**」。\n\n**段二·2 颂·显剎微细（L77–L80）**：\n\n> 「一一毛孔中，億剎不思議，種種相莊嚴，未曾有迫隘。\n> 眾生各各業，世界無量種，於中取著生，受苦樂不同。」\n\n**疏解**：澄观：「**初一偈舉果，後一偈對因以辯**」（`T1735`）。「**一一毛孔中，億剎不思議……未曾有迫隘**」为「**小容大而不迫**」之教证——即华严「**因陀罗网**」之微细相。\n\n**段三·10 颂·明世界体性（L81–L100）**：\n\n> 「有剎眾寶成，常放無邊光，金剛妙蓮華，莊嚴淨無垢。\n> 有剎光為體，依止光輪住，金色栴檀香，焰雲普照明。\n> 有剎月輪成，香衣悉周布，於一蓮華內，菩薩皆充滿。\n> 有剎眾寶成，色相無諸垢，譬如天帝網，光明恒照耀。\n> 有剎香為體，或是金剛華，摩尼光影形，觀察甚清淨。\n> 或有難思剎，華旋所成就，化佛皆充滿，菩薩普光明。\n> 或有清淨剎，悉是眾華樹，妙枝布道場，蔭以摩尼雲。\n> 有剎淨光照，金剛華所成，有是佛化音，無邊列成網。\n> 有剎如菩薩，摩尼妙寶冠，或有如座形，從化光明出。\n> 或是栴檀末，或是眉間光，或佛光中音，而成斯妙剎。」\n\n**疏解**：澄观：「**第三十頌明世界體性**」（`T1735`）。重宣剎种二十体（色相十·声十，参 P26）。\n\n**段四·5 颂·明世界各各庄严具（L101–L110）**：\n\n> 「有見清淨剎，以一光莊嚴，或見多莊嚴，種種皆奇妙。\n> 或用十國土，妙物作嚴飾，或以千土中，一切為莊校；\n> 或以億剎物，莊嚴於一土，種種相不同，皆如影像現。\n> 不可說土物，莊嚴於一剎，各各放光明，如來願力起。\n> 或有諸國土，願力所淨治，一切莊嚴中，普見眾剎海。」\n\n**疏解**：澄观：「**第四五頌明莊嚴**」（`T1735`）。「以千土物嚴一土」「以亿剎物嚴一土」——即「**多严一·一严多**」之庄严具总相。\n\n**段五·5 颂·明庄严际无间断（L111–L120）**：\n\n> 「諸修普賢願，所得清淨土，三世剎莊嚴，一切於中現。\n> 佛子汝應觀，剎種威神力，未來諸國土，如夢悉令見。\n> 十方諸世界，過去國土海，咸於一剎中，現像猶如化。\n> 三世一切佛，及以其國土，於一剎種中，一切悉觀見。\n> 一切佛神力，塵中現眾土，種種悉明見，如影無真實。」\n\n**疏解**：澄观：「**第五有五頌，明莊嚴際中攝三世嚴故，無間斷，結歸佛故，一塵普見**」（`T1735`）。「**三世一切佛，及以其國土，於一剎種中，一切悉觀見**」——即「**一剎摄三世**」之庄严际无间断。\n\n**段六·10 颂·明世界形状（L121–L140）**：\n\n> 「或有眾多剎，其形如大海，或如須彌山，世界不思議。\n> 有剎善安住，其形如帝網，或如樹林形，諸佛滿其中。\n> 或作寶輪形，或有蓮華狀，八隅備眾飾，種種悉清淨。\n> 或有如座形，或復有三隅，或如佉勒迦，城廓梵王身。\n> 或如天主髻，或有如半月，或如摩尼山，或如日輪形。\n> 或有世界形，譬如香海旋，或作光明輪，佛昔所嚴淨。\n> 或有輪輞形，或有壇墠形，或如佛毫相，肉髻廣長眼。\n> 或有如佛手，或如金剛杵，或如焰山形，菩薩悉周遍。\n> 或如師子形，或如海蚌形，無量諸色相，體性各差別。\n> 於一剎種中，剎形無有盡，皆由佛願力，護念得安住。」\n\n**疏解**：澄观：「**第六或有眾多剎下，十偈明剎形差別**」（`T1735`）。重宣剎种二十形状（参 P25）。\n\n**段七·2 颂·明各各劫差别（L141–L144）**：\n\n> 「有剎住一劫，或住於十劫，乃至過百千，國土微塵數。\n> 或於一劫中，見剎有成壞，或無量無數，乃至不思議。」\n\n**疏解**：澄观：「**第七二偈明剎住時分**」（`T1735`）。\n\n**段八·8 颂·明各各佛出现（L145–L160）**：\n\n> 「或有剎有佛，或有剎無佛，或有唯一佛，或有無量佛。\n> 國土若無佛，他方世界中，有佛變化來，為現諸能事。\n> 沒天與降神，處胎及出生，降魔成正覺，轉無上法輪。\n> 隨眾生心樂，示現種種相，為轉妙法輪，悉應其根欲。\n> 一一佛剎中，一佛出興世，經於億千歲，演說無上法。\n> 眾生非法器，不能見諸佛，若有心樂者，一切處皆見。\n> 一一剎土中，各有佛興世，一切剎中佛，億數不思議。\n> 此中一一佛，現無量神變，悉遍於法界，調伏眾生海。」\n\n**疏解**：澄观：「**第八有八偈明佛出多少**」（`T1735`）。「**或有剎無佛……有佛變化來**」——即「**无佛之剎，他方佛化现**」；「**眾生非法器，不能見諸佛，若有心樂者，一切處皆見**」——即「**见佛与否，在机不在佛**」。\n\n**段九·10 颂·光明有无（L161–L180）**：\n\n> 「有剎無光明，黑闇多恐懼，苦觸如刀劍，見者自酸毒。\n> 或有諸天光，或有宮殿光，或日月光明，剎網難思議。\n> 有剎自光明，或樹放淨光，未曾有苦惱，眾生福力故。\n> 或有山光明，或有摩尼光，或以燈光照，悉眾生業力。\n> 或有佛光明，菩薩滿其中，有是蓮華光，焰色甚嚴好。\n> 有剎華光照，有以香水照，塗香燒香照，皆由淨願力。\n> 有以雲光照，摩尼蚌光照，佛神力光照，能宣悅意聲。\n> 或以寶光照，或金剛焰照，淨音能遠震，所至無眾苦。\n> 或有摩尼光，或是嚴具光，或道場光明，照耀眾會中。\n> 佛放大光明，化佛滿其中，其光普照觸，法界悉周遍。」\n\n**疏解**：澄观：「**第九十偈光明有無，初一（頌）無，後九（頌）有**」（`T1735`）。诸光之因，或众生业力·福力，或净愿力，或佛神力——即「**光随因异**」。\n\n**段十·11 颂·音声善恶（L181–L202）**：\n\n> 「有剎甚可畏，嘷叫大苦聲，其聲極酸楚，聞者生厭怖。\n> 地獄畜生道，及以閻羅處，是濁惡世界，恒出憂苦聲。\n> 或有國土中，常出可樂音，悅意順其教，斯由淨業得。\n> 或有國土中，恒聞帝釋音，或聞梵天音，一切世主音。\n> 或有諸剎土，雲中出妙聲，寶海摩尼樹，及樂音遍滿。\n> 諸佛圓光內，化聲無有盡，及菩薩妙音，周聞十方剎。\n> 不可思議國，普轉法輪聲，願海所出聲，修行妙音聲。\n> 三世一切佛，出生諸世界，名號皆具足，音聲無有盡。\n> 或有剎中聞，一切佛力音，地度及無量，如是法皆演。\n> 普賢誓願力，億剎演妙音，其音若雷震，住劫亦無盡。\n> 佛於清淨國，示現自在音，十方法界中，一切無不聞。」\n\n**疏解**：澄观：「**第十有十一頌，剎中音聲善惡。初二（頌）惡道唯惡，次三（頌）人天通善惡，後六（頌）佛菩薩善而非惡，正顯各各演說‘法海’也**」（`T1735`）。末颂「**佛於清淨國，示現自在音，十方法界中，一切無不聞**」——总收全品，归「**法界普闻**」。\n\n**会读**：此 101 颂为全品之「**总偈**」——首标华藏自体，次颂能持剎种（9 颂），末颂所持诸剎（91 颂，十段）。**〔本文判断〕** 其十段（因缘·微细·体性·庄严具·庄严际·形状·劫·佛出·光明·音声），正与 P23「剎種十門」及《世界成就品》「十事」为**同一义群之异列**——即以偈颂重演「一土之全德」。\n\n### 2.14 本品小结\n\n**骨节总览**：\n\n```\n华藏庄严世界海（卢舍那本愿所严）\n └ 十风轮（最下平等住 … 最上殊勝威光藏）\n    └ 普光摩尼莊嚴香水海\n       └ 大莲华「種種光明蘂香幢」\n          └ 华藏庄严世界海（四方均平·金刚围山周匝·地海众树）\n             ├ 大轮围山（金刚山，清净戒德）\n             ├ 台面宝地（金刚为地，如天帝網）\n             ├ 地面香海（不可說佛剎微塵數香水海）\n             ├ 海間香河（一一香海有四天下微塵數香水河）\n             ├ 河间华林（莲华·宝树出五业用）\n             └ 總結多嚴（一一境界皆世界海微塵數清淨功德）\n             ▼ 所持剎网差别\n                ├ 中央香水海「無邊妙華光」→ 世界种「普照十方熾然寶光明」→ 二十重（娑婆第13）\n                │     └ 旁列无量眷属（十八形状世界，各十佛剎微塵數围绕）\n                ├ 十方十海（东1+南1+右旋8）各出华持种，各二十重\n                └ 十海所管之外圍海（凡89）各出华持种，各具省略式二十重\n                   ▼ 总结：十不可說香水海×十不可說世界種 → 「遞相接連，成世界網」\n                   ▼ 重颂101：初颂华藏自体 · 余百颂所持剎网\n```\n\n**三句总持**（重申 §1.4）：\n1. **竖**——「**香水海 ⊃ 莲华 ⊃ 世界种 ⊃ 二十重世界**」，四重含藏；\n2. **横**——「**中央 × 十方十海 × 各海所管海**」，层层环列；\n3. **总**——「**遞相接連，成世界網**」，一一如网孔，即因陀罗网。\n\n**义理三纲**：\n- **依正不二**：华藏之严，皆卢舍那本愿所成；而「**約眾生，如來藏識即是香海**」（澄观）——依报之严即众生心识之严。\n- **心造世间**：重颂段一「**譬如眾繢像，畫師之所作，如是一切剎，心畫師所成**」，颂⑧「**體相如本無差別**」——全品之枢归「**心**」。\n- **即事而真**：末颂「**華藏世界海，法界等無別**」——严即无严，事即真性。\n\n**本品数据一览**（详 §7）：CJK **19,098** 字（净 19,071）·独字 **657**·熵 H**7.2864**·Zipf 斜率 **−1.6057**（R −0.9618）·句末 **626**·长行 **47** 段·偈组 **9**·偈颂 **181**。名相计：香水海 **99**（＝「次有香水海」之标数：十方环 10＋外围 89；中央作「最中央香水海」，别计）·「世界種」**126** 见·「佛號」**249** 见·「此上過」**218** 见·「佛剎微塵數」**321** 见·「周匝圍遶」**24** 见。\n\n---\n\n## 三、旁参与前接\n\n### 3.1 前接·《世界成就品第四》\n\n本品承第四品「能成之緣」而显「所成之果」，二者为「**总／别**」之关系（§1.2）。对读三处：\n\n- **十事之同异**：第四品之十事（起具因缘·所依住·形相·剎体·庄严·清净方便·佛出差别·劫住·劫转变·无差别）为「**通一切海**」；本品之十门（依住·形状·体性·方所·趣入·庄严·分齐·行列·无差别·力加持）为「**明一海中种**」。澄观谓：「**所列十事。與成就品都望全異。彼通一切海。此明一海中種故。若別別相望。互有互無。起具因緣。清淨佛出劫住轉變。彼有此無。方所分齊行列趣入力持等五。彼無此有。依住形體莊嚴無別。彼此名同。**」（`T1735`）。\n- **数法之相续**：第四品「積剎成種、積種成海」之「数法」，本品具体化为「香水海×世界种×世界」之三重嵌套。\n- **偈颂之互见**：第四品末偈与本品种种颂之「如幻如化」意趣一贯（参第四部 §2）。\n\n### 3.2 后接·《毗卢遮那品第六》\n\n本品首段言「**此華藏莊嚴世界海，是毘盧遮那如來往昔於世界海微塵數劫修菩薩行時，一一劫中親近世界海微塵數佛，一一佛所淨修世界海微塵數大願之所嚴淨**」（P1）；第六品即「**别显本事之时·之处·时中本事**」，历说卢舍那「**最初劫中**」逢一切功德山须弥胜云佛、波罗蜜善眼庄严佛、最胜功德海佛、名称普闻莲华眼幢佛四佛之本因（澄观 `T1735`）。故本品示「**果**」，第六品示「**因**」，为「**因—果**」一对。\n\n### 3.3 前接·《普贤三昧品第三》与《如來現相品第二》\n\n- **《普贤三昧品》**：本品与第四品皆「**普贤承力遍观而说**」，其说之主体、入定之因，承第三品（参第三部）。\n- **《如來現相品》**：本品所答「世界海」问，即第二品末「**三十七問**」之「世界海問」（李通玄：「**此品答前三十七問中佛世界海、眾生海、波羅蜜海等**」`T1739`；参第二部）。\n- **《世主妙严品》**：本品之「**重重严具**」之世界观，与第一部（世主妙严）之「**主伴重重**」相呼应。\n\n### 3.4 旁参·跨品主题一览\n\n| 主题 | 本品 | 旁参 |\n|------|------|------|\n| 因陀罗网 | 「如天帝網」「如天珠网」「成世界网」 | 第四部 §2（世界成就）·第三部 §2 |\n| 心造世间 | 重颂段一「譬如眾繢像，畫師之所作，如是一切剎，心畫師所成」 | 第二部·夜摩天宫偈「心如工画师」 |\n| 尘中现刹 | 「一一毛孔中，億剎不思議」 | 第四部 §7.4（L4 几何） |\n| 娑婆与华藏 | 「其第十三主剎即此娑婆」 | 入法界品·第十地 |\n\n---\n\n## 四、义理要点与名相\n\n### 4.1 义理大纲\n\n| 序 | 要点 | 经证 | 注疏 |\n|---|------|------|------|\n| 1 | 华藏=依报之全体 | P1 | 澄观释名 |\n| 2 | 因深广（长时·多缘·多愿） | P1「世界海微塵數劫」 | 澄观三胜相 |\n| 3 | 风轮=大愿 | P1 十风轮 | 李通玄「風輪是大願波羅蜜」 |\n| 4 | 香海=藏识/大悲 | P10 | 澄观·李通玄 |\n| 5 | 莲华=法身随行智 | P1 種種光明蘂香幢 | 李通玄「蓮華藏體是法身隨行無依住智」 |\n| 6 | 心造世间 | 重颂段一「心畫師所成」 | 澄观 |\n| 7 | 如天帝網（重重） | P7·P30 | 澄观 |\n| 8 | 世界种=种子含藏 | P23 | 澄观「正是所含種子」 |\n| 9 | 二十重·娑婆居13 | P30 | 澄观「其第十三主剎即此娑婆」 |\n| 10 | 相入无碍 | 颂⑧「十方所有廣大剎，悉來入此世界種」 | 澄观「一多互入」 |\n| 11 | 尘中现刹 | 重颂段二 | 澄观「小容大而不迫」 |\n| 12 | 世界网（无尽） | P56 | 澄观「如以網持橫豎交絡」 |\n| 13 | 严即无严 | 颂⑦·重颂初颂 | 澄观五相 |\n\n### 4.2 名相表\n\n| 名相 | 梵/训 | 出处 | 说 |\n|------|-------|------|-----|\n| 華藏 | — | 品题 | 莲华含子之处；剎种及剎为大莲华所含藏 |\n| 世界海 | *loka-dhātu-sāgara* | 全品 | 積剎成種、積種成海 |\n| 世界種（性） | — | P23 | 积多世界摄诸流类；六十作「世界性」 |\n| 香水海 | — | P1·P10 | 藏识/大悲海；摩尼发光严海底岸 |\n| 風輪 | *vāta-maṇḍala* | P1 | 持境之力=大愿 |\n| 斫迦羅（輪圍山） | *cakravāla* | P4 | 清净戒德，内摄外防 |\n| 大蓮華·種種光明蘂香幢 | — | P1 | 华藏之所依 |\n| 娑婆 | *sahā* | P30 | 堪忍；第十三重主剎 |\n| 毘盧遮那（盧舍那） | *vairocana* | P1·P30 | 光明遍照；华藏之本师 |\n| 摩尼 | *maṇi* | P1 等多处 | 如意宝珠 |\n| 芬陀利 | *puṇḍarīka* | P16 | 白莲华 |\n| 佉勒迦 | *khalika*？〔待核〕 | P25 | 竹篺（竹编筒状物） |\n| 卐（萬）字 | — | P30 第15重 | 德者之相（吉祥海云）〔§1.5〕 |\n| 帝網/因陀羅網 | *indra-jāla* | P7·P30 | 重重影现 |\n| 不可說佛剎微塵數 | — | 全品 | 极多之数 |\n\n### 4.3 数法层次\n\n《华严》数法之递进（李通玄）：**三千大千世界 × 恒沙 = 世界海；世界海 × 恒沙 = 世界性；世界性 × 恒沙 = 世界種**（`T1739`）。\n本品所用之数：**佛剎微塵數**（一剎碎为微尘）→ **十佛剎微塵數** → **不可說佛剎微塵數** → **不可說不可說**（本品未见最高）。跨数法之枢纽，在「**不可說佛剎微塵數香水海**」一语。\n\n### 4.4 「色」与「声」双重体性\n\n剎种二十体分二：**前十为色相**（摩尼云·众色焰·诸光明·宝香焰·多罗华·菩萨影像·诸佛光明·佛色相·一宝光·众宝光），**后十属音声**（众生福德海音声·众生诸业海音声·佛境界清净音声·菩萨大愿海音声·佛方便音声·剎庄严具成坏音声·无边佛音声·佛变化音声·众生善音声·佛功德海清净音声）。**〔本文判断〕** 此「色·声」二体，为一「**依正二报之信息载体**」：色为空间之显，声为时间之传（音声不可常在而不动，故属时）。\n\n### 4.5 「一即一切」之三证\n\n本品「一即一切」有三层证：\n1. **相入**（颂⑧）：「**十方所有廣大剎，悉來入此世界種……以一剎種入一切，一切入一亦無餘**」——同时具足。\n2. **微细**（重颂段二）：「**一一毛孔中，億剎不思議……未曾有迫隘**」——小容大而不失其相。\n3. **广狭**（重颂初颂·P31）：「**於一剎種中，剎形無有盡**」——一尘中现无量剎。\n\n### 4.6 与前四部义理之贯通\n\n- **第一部**（世主妙严）：「主伴重重」→ 本品「世界重重」。\n- **第二部**（如來現相）：「如來現相」答「三十七問」→ 本品答「世界海問」。\n- **第三部**（普贤三昧）：「普賢入定起說」→ 本品「普賢承力而說」。\n- **第四部**（世界成就）：「成剎之緣（十事）」→ 本品「所成之果（十門）」。\n\n---\n\n## 五、注疏选要（诸家会读）\n\n> **〔本轮增补〕** 原列三家（澄观·法藏·李通玄）之外，本轮增**智俨《搜玄分齊通智方軌》**（`T1732`，见 §5.2′）与**慧苑《續華嚴略疏刊定記》**（`X0221`，见 §5.2″）二家，故统称「诸家」，不复以数限。下表仍以原有三家为准，不改。**〔四家补位〕** 本轮复据本机听录**逐字回源**，于 §5.4′ 补列**海云继梦和上讲记会读**——法藏·澄观·李通玄·海云**四家之位至此齐备**（讲记属「一家之判，非經證」，见 §5.4′ 界限）。\n\n> **〔体例〕** 取古今三家——**唐·法藏《探玄记》**（`T1733`，六十本）、**唐·李通玄《新华严经论》／《合论》**（`T1739`／`X0223`）、**唐·澄观《华严经疏》**（`T1735`）——逐字回源，各摘其判本品之要；**凡异说并存而不强断**。三家所据本不同（法藏据六十、李通玄与澄观据八十），故此对读兼见**译本与判释之两重差异**。\n\n### 5.1 澄观《大方广佛华严经疏》（`T1735`）——「華藏世界品第五」段\n\n**四門判**（*fourfold analysis*: 來意 *purpose/occasion*、釋名 *explanation of title*、宗趣 *main theme/doctrinal purport*、釋文 *exegesis*）：\n- **來意**：「**前品通明諸佛剎海。今此別明本師所嚴依果。答世界海問。故次來也。**」\n- **釋名**：「**準梵本。具云華藏莊嚴嚴具世界海之遍清淨功德海光明品。譯者嫌繁。乃成太略。處中應云蓮華藏莊嚴世界海品。謂蓮華含子之處。目之曰藏。今剎種及剎。為大蓮華之所含藏。故云華藏。其中一一境界。皆有剎海塵數清淨功德。故曰莊嚴。世界深廣故名為海。**」（*Lotus Treasury / Garbhadhātu* 相关语境）\n- **宗趣**：「**別顯本師依報。具三世間。融攝無盡為宗。令諸菩薩發生信解。成就行願為趣。**」（*main theme: the interpenetrating infinity of the Lotus Treasury World*）\n- **釋文**：**一品分三**——「**初明華藏因果自體。二明藏海安布莊嚴。三明所持剎網差別。三段如次。釋華藏莊嚴世界之名。**」\n\n**十事**：「**一所依風輪。二風持香海。三海出蓮華。四華持剎海。五繞臺輪山。六臺面寶地。七地有香海。八海間香河。九河間樹等。十總結多嚴。**」（初段唯四，河在次段，故云「**今文之中唯闕一河**」。）\n\n**判文次第**：\n- **初段·华藏因果自体**：「**先長行後偈頌。長行亦二。初舉果屬人顯因深廣。二彰果體相辯其寬容。**」因深广三胜相：长时修·多胜缘·净多愿。\n- **二段·藏海安布庄严**：「**文分為六。第一四周輪山。二寶地。三香海。四香河。五樹林。六總結。各別有偈。**」义配：轮山=清净戒德（内摄外防）；宝地=体心性定；香海=心华之内摄诸种子；香河=随一一心同时相应功德流注；华林=一树出五业用；总结=一一之境皆具剎海尘数功德。\n- **三段·所持剎网差别**：「**文分三別。第一告眾許說。二雙標二章。三廣釋二章。**」广释二章：「**初通明剎種不同。釋剎種章。二別明剎種香海。**」别明剎種香海又三：「**初辯中間一海。次辯右旋十海。後明十海所管之海。**」\n\n**关键判释**：\n- **世界种十门**：依住·形状·体性·方所·趣入·庄严·分齐·行列·无差别·力加持；与成就品十事「**都望全異**」，「**若別別相望。互有互無**」——起具因缘·清净·佛出·劫住·转变彼有此无，方所·分齐·行列·趣入·力持此有彼无，依住·形体·庄严·无别彼此名同，「**前後互出都有十五。皆顯十者俱表無盡。**」\n- **中央二十重**：「**準標及結。皆有不可說剎塵。其別辯中。但列十九佛剎塵數。為二十重。其能繞剎。但有二百一十佛剎塵數。**」；「**其第十三主剎即此娑婆。**」\n- **十海**：「**第二明右旋十海。即繞處中之海。有其十也。各有種剎。**」；「**十海如環。繞於中海故不正南也。如以十疊繞於一盤。方所可見。**」\n- **十海所管之海**：「**明十海所管之海。一海各管不可說佛剎塵數。現文但各說十。即為百海。**」又「**於所管中各有三節。初從能管海邊。隣次列九。唯第一段。九中闕一。二如是等下。總結一海所管之大數。三其最近下廣說最近輪圍一海。**」；「**第五金剛輪莊嚴底香海所管。但列九海而結文。及最近輪圍之海九行許經。諸梵本中皆同此闕。**」\n- **总结**：「**十海即有十不可說。一海一種。是以數同。**」；「**言成世界網者。一一世界猶如網孔遞相接連。如以網持橫竪交絡。皆悉相當。如天珠網。**」\n- **重颂**：「**總有一百一偈。分二。初一明華藏自體。**」「**餘一百偈頌所持剎網。於中二。初九頌能持剎種。餘頌所持諸剎。**」\n\n**藏识释**（本品之枢）：「**約眾生。如來藏識即是香海。亦法性海。依無住本。是謂風輪。亦妄想風。於此海中。有因果相恒沙性德。即是正因之華。世出世間未來果法。皆悉含攝。故名為藏。**」；「**染淨果法。重疊無礙。故所感剎相狀如之。**」「**是以出現品中。多將世界以喻佛德。細尋文意。乃由佛德世界如之。**」\n\n**帝網释**：「**此帝網重現無盡。成上普現如來境界。及上一一境界皆無盡也**」；「**謂一寶既收一切。則彼剎諸塵復攝一切。即重重也。**」\n\n**余释**：「**輪山則清淨戒德。內攝外防之所成也。**」；「**臺面寶地即體心性定之所成也。**」；「**所持香海。以摩尼發光。普照一切嚴海底岸。及寶色香水故立此名。又藏識名海。具德深廣故。流注名水剎那性故。又佛性名水。遠熏名香聞未證故。**」；「**所出蓮華蘂放異光。又發勝香高出降伏故。立此名。又所發萬行。一一覺性故曰光明。皆能普熏即香義也。**」；「**第三地面香海者。上之大海既是藏識。今明心華之內攝諸種子。一一種子不離藏識海故。有多香海。**」；「**準下剎種及梵本中。皆有十不可說。今闕十字。或是譯人之漏。或是傳寫之失。**」；「**文有二十句。前十明海體狀。一底二岸。三網四水。五華六垽。七聲八光。九人衛現通。十結廣無盡。後十寶下。十句攝異莊嚴。**」；「**芬陀利者即白蓮華。亦是正敷榮時。**」；「**第四海間香河。即隨一一心。同時相應功德流注也。**」；「**然此一段文勢少異。不列十事以顯無盡。而但舉二展轉明多。謂初一白蓮後一寶樹。於此一樹出五業用。一出莊嚴雲。二寶王照耀。三華香盈滿。四出音演法。五雨寶遍地。**」；「**然此三偈有多意趣。一者初一偈則器世間。次一智正覺。後一眾生。欲明一一事中皆現三世間嚴。**」；「**上來諸段。雖說莊嚴猶未能盡。故今總顯一一之境。若說不說。皆具剎海塵數功德莊嚴。**」；「**若語果嚴略有五相。一者令多周給一切。二者令常永無乏絕。三者令妙悅可眾心。四者稱性無生無相。五者自在鎔融無礙。**」；「**舊經云性多取此義。恐濫體性故。改為種。**」\n\n### 5.2 法藏《华严经探玄记》（`T1733`）——〈盧舍那佛品〉世界海段（六十本）\n\n法藏所据为六十本，本品并入〈盧舍那佛品第二〉，故其判不题「华藏世界品」而就「盧舍那佛品」立说（`T1733`）。\n\n**释名**：「**盧舍那者古來譯或云三業滿。或云淨滿。或云廣博嚴淨。今更勘梵本具言毘盧遮那。盧舍那者此翻名光明照。毘者此云遍。是謂光明遍照也。**」又「**此中光明有二種。一智光。二身光……此中遍者亦二種。一平漫遍無礙普周故。二重重遍如帝網重現故。此二圓融。各全體遍非是分遍。**」\n\n**宗趣**：「**三宗趣者有二。一約人二約法。法中亦二。一約義理。二約教事……教事中本分內五海十智為體。十世界及華藏界為相。益機為用。**」\n\n**判释之要**：法藏以「**十身**」释卢舍那：「**此舍那佛非局報身。以通器等三種世間具十身故。**」；又「**又以依正無礙故是故標釋。互舉文綺耳……以佛勝故。獨標為軌故以為名。**」——即以「**卢舍那**」一名摄「**依正不二·三世間具**」。\n\n### 5.2′ 智俨《搜玄分齊通智方軌》（`T1732`）\n\n**来源**：唐·智俨（华严二祖）《搜玄分齊通智方軌》（`T1732`）；本机藏 PDF 抽取本，康熙部首异体字已归一为正字，仍待二次校对〔待核〕。**旧著录误题「法藏」，本轮已订正**（见部1 八.5）。\n\n**智俨就六十本立论**：六十本**无独立〈華藏世界品〉**——其内容并入〈盧舍那佛品第二〉（＝八十品2–6）。故 `T1732` 于本品**无逐品玄谈**；其可据者，为品2「四门分别」之通判：\n\n**（一）辨名**：\n\n> 「一釋名者。盧舍那此云廣博嚴淨。……正報強故舉人顯土。」（`T1732` 品2）\n\n**（二）来意**：「二來意者。何故此品來。既眾集已。次明所顯法故也。」\n\n**（三）宗趣（最关本品）**：\n\n> 「三辨宗趣者有二。一人。二法。……法者四種淨土為此會宗。又亦可法界及世界海為宗也。」（`T1732`）\n\n**按**：智俨以「**法界及世界海为宗**」——「世界海」即华藏世界之总称，此正本品之主题。此说为「世界海为宗」之最早标举；其「四種淨土」复与法藏「四土」、澄观「染淨二土鎔融」相为表里〔本文判断〕。\n\n**（四）分文释（三分判）**：\n\n> 「二就品分者有三。初至光覺等來舉果勸樂生信分。二明難下明修因契果生解分。三離世間下辨依緣修行成德分。」（`T1732`）\n\n**会读**：智俨三分判中，本品（八十品5）属「**舉果勸樂生信分**」（就八十本言，第一会六品皆此分）。其「法界及世界海为宗」，为读本品「华藏依报」之最早教判背景〔本文判断〕。\n\n### 5.2″ 慧苑《續華嚴略疏刊定記》（`X0221`）\n\n**来源**：唐·慧苑《續華嚴略疏刊定記》（`X0221`，卍续藏）；PDF 抽取本，异体字已归一，仍待二次校对〔待核〕。慧苑就八十本立论，本品（品5）于 `X0221` 有逐品玄谈。\n\n**（一）释名（含「梵本五品」之判）**：\n\n> 「初釋名者。梵本於此品中□□五品初一是本品。後四是子品。今此本品。梵本具名拘蘇摩多羅驃訶阿楞伽嚕迦駄超三牟達羅鉢[口*履]輪(入呼)陀懼囊三牟達羅阿縛婆(上呼)婆。此云華藏莊嚴嚴具世界海之遍清淨功德海光明〔下略〕。」（`X0221` 品5·释名）\n>\n> 〔按：引文中「(入呼)」「(上呼)」为底本夹注小字，此照录；「□□」为底本缺字，保持原样；末以「〔下略〕」省其释文。〕\n\n**按**：慧苑**亲勘梵本**，判本品「**梵本中凡五品，初一是本品，后四是子品**」——此说为读本品结构之重要依据：华藏世界品在梵本中**非一品**，而含一根本品与四子品。可与本节 §6 之「八十－六十」对读相为表里〔本文判断〕。\n\n**（二）本品末结**：慧苑于品5释文末结「上來華藏世界品竟」（`X0221`）。\n\n**会读**：慧苑「**梵本五品（一本品＋四子品）**」之判，与慧苑于品4判「譯家存略太甚」互见——**慧苑于本会二品（世界成就·华藏世界）皆据梵本立说，屡纠汉译之略**，为唐代注疏家中最重梵本者之一〔本文判断〕。可与澄观「準梵本云世界海成就」、法藏「勘梵本」诸说合观。\n\n### 5.3 李通玄《新华严经论》／《合论》（`T1739`／`X0223`）——「華藏世界品第五」段\n\n**十门分别**：「**一釋品來意。二釋品名目。三釋華藏世界海因何報得。四釋華藏世界海形狀安立。五配華藏世界海安立屬因。六釋華藏世界海純雜無礙。七釋華藏世界海圓攝三世業境。八釋佛國本空何為華藏世界海出生所緣。九明華藏世界海因何得隱現自在。十隨文釋義。**」（`T1739`）\n\n**来意**：「**此品答前三十七問中佛世界海眾生海波羅蜜海等。此品舉如來五位中行業因果報得。答前三十七問故此品須來。**」\n\n**因何报得**：「**以從初信心至於八地已來。恒以大志願力。持令其不退菩提……當知風輪是大願波羅蜜所成報故。……蓮華藏體是法身隨行無依住智體之所報得。……其地金剛平等自性法身之所報得。……眾華莊嚴。萬行利生。開敷眾善之所報得故。寶樹莊嚴者。建行利生覆蔭含識之所報得。……如香水海大慈悲。業之所報得。香水河是進修之行所報得。**」\n\n**世界种定义**：「**三千大千世界數至恒沙為一世界海。海世界數至恒沙為一世界性。性至恒沙為一世界種。**」（用六十本「世界性」旧名。）\n\n**配属因**：以「**十種風輪**」配「**願波羅蜜中十波羅蜜**」（如最下「**平等住**」＝願波羅蜜中檀波羅蜜報得）。\n\n### 5.4 李通玄《合论》（`X0223`）——「華藏世界品第五之一／之二／之三」\n\n《合论》与《新华严经论》为同源异流（一为论，一为随文之合论），其判大同。要者：合论判初会「**始成正覺總有六品經**」——「**一世主妙嚴品。二如來現相品。三普賢三昧品。四世界成就品。五華藏世界品。六毗盧遮那品**」，其中「**五明華藏世界海佛自智果報得莊嚴**」（`X0223`）；又总判初会六品「**是以佛果勸修門**」（`X0223`）。\n\n### 5.4′ 会读（海云讲记）\n\n**来源**：（一）海云继梦和上《八十华严导读》（西安草堂寺 201005）讲记，本机 `docs/huayanhai/华严云海/浩瀚华严海/八十华严导读-西安草堂寺201005/听录/`（口说**听录**，属二手转写，措辞或有出入，凡与经不合者以经为正）。本品于该导读有专讲（导读06 通讲、07 讲作结），以下 5.4′.1–5.4′.4 引海云语皆逐字取自听录原文。（二）**99华严讲座 Ep15（2026年8月·台北國際會議中心）**——本品于该讲有**正行逐段讲授**（§D–§E），且 §四 4.3 已以 CBETA `T10n0279` **anchor 程序切片逐字回源**「華藏世界品第五之一」起首風輪一段（访问 2026-10-24）；本系列分层原则（⚖ `.harness/decisions.md # 9`）以讲记为主体，故正行段逐字对勘录入 §5.4′.5。**与第八品四圣谛品不同**：四圣谛品正行段俟 Ep16（尚未上传），本品华藏世界则**已在 Ep15 讲授**，正行逐字可据实录入。\n\n#### 5.4′.1 品首经文之引与校异（导读06）\n\n海云于 06 讲引本品首段经文（并记其小本页次「四百四十三页，第一行」）：\n\n- **听录作**：「此华藏世界庄严海，是毗卢遮那如来往昔于以世界海微尘数劫修菩萨行时一一劫中亲近世界海微尘数佛，一一佛所净修世界海微尘数，大愿之所严净。」（导读06）\n- **经本作**（`T10n0279` 0039a16–a20）：「諸佛子！此華藏**莊嚴世界海**，是毘盧遮那如來往昔**於**世界海微塵數劫修菩薩行時，一一劫中**親近**世界海微塵數佛，一一佛所淨修世界海微塵數大願之所嚴淨。」\n\n〔**校异要点·据实标明**〕① 听录「此华藏**世界庄严**海」vs 底本「此華藏**莊嚴世界**海」——**词序互倒**；② 听录「往昔**于以**世界海」vs 底本「往昔**於**世界海」——**衍「以」字**；③ 海云于同讲复以口释作「每一一劫中，**清净**世界海微尘数佛」，与经引「**親近**」异——**速读口误**。凡此三处，一律**以经本为正**，听录异字不径改经，亦不据听录回改底本（与第二部 §5.4.4 同例）。其口释所明二义——「世界海微尘数劫＝整个世界海磨成极微尘、每一微尘为一劫」「这是世界海微尘数佛，不是佛刹微尘数，弄清楚啊」——则与经文「世界海微塵數」相合〔本文判断〕。\n\n#### 5.4′.2 第十三重＝娑婆·法报化之辨（导读07）\n\n> 「尤其呀，在这个世界种里头的第十三层。第十三层，那是我们娑婆世界，本师啊，是毗卢遮那佛，那我们更容易呀把它弄错，以为呀，只有第十三重，是毗卢遮那佛的教化区，那你就错了。因为这里头它涉及到的问题呀，是法身佛、报身佛与化身佛的问题。」（导读07）\n\n- **对读**：澄观于本品 §5.1 已判「**其第十三主刹即此娑婆**」（`T1735`）——**海云「第十三重＝娑婆」之说与古疏全同**，非无据之臆说〔本文判断〕；其「不止十三重为教化区」之诫，则以法报化三身开遮，与本品帝网重重、无尽圆融之义相发〔本文判断〕。\n\n#### 5.4′.3 品卷与结论偈之核（导读07）\n\n- **卷次（可坐实）**：海云云「华藏世界品一共有三卷经文」（导读07）——回核 `T10n0279`：《華藏世界品第五》**正占卷第八、第九、第十**（品五之一起 0039a15 卷八，之二起 0044a08，之三起 0048c23，至 0053c13 卷十末终）〔信度 A·三卷全同〕。\n- **结论偈（逐字回源）**：海云引品末二偈作：「普贤誓愿力，亿刹演妙音，其音若雷震，住劫亦无尽。佛于清净国，示现自在音，十方法界中。一切无不闻。」——本席回核底本（0053c10–c13）作「**普賢誓願力，億剎演妙音，其音若雷震，住劫亦無盡。佛於清淨國，示現自在音，十方法界中，一切無不聞。**」——**逐字全同（仅繁简与标点之别）**〔信度 A〕。海云就之以身语意之「语业」释本品以音声作结（「最后他用音来跟我们做结论」），属一家行法之读〔本文判断〕。\n- 〔数字口说存录〕海云同讲又云「这个总共四卷经文，从世界成就品，一直到华藏世界品，这个三卷经文，三卷半的经文」——「四卷／三卷／三卷半」**口说前后不一**：实测品四居卷七后半、品五占卷八十十，合计约**三卷半**（若自品三全卷起算则近四卷）——**算起不同所致，非相抵牾**；照录不改〔本文判断〕。\n\n#### 5.4′.4 果相→因行之转（导读07）\n\n> 「那么到这里啊 我们要跟各位讲，华藏世界品啊是毗卢遮那佛的果相，（果相啊）。那果相，那就有因啦。有果就有因啦。因是什么？那因就讲人，这个华藏世界海的主人。他因地是怎么修的？重点在这个地方。那这一品啊就是讲毗卢遮那品。关键在这里。」（导读07）\n\n- **对读**：品六澄观来意「**前明此因之果。今辯前果之因**」（部6 §5.1）——海云「**果相→因地→主人**」之转与澄观「因之果→果之因」恰相扣合，可为读五、六两品衔接之一助〔本文判断〕。\n\n#### 5.4′.5 正行段逐字对勘（99华严 Ep15·CBETA anchor 回源·本批新增）\n\n本品于 99华严讲记 **Ep15**（台北國際會議中心·本系列第三个正行段集）§D–§E 逐段讲授，§四 4.3 并以 CBETA `T10n0279` 由 `cut(起anchor,迄anchor)` **程序切片逐字回源**（剥标签·压平·assert 命中·访问 2026-10-24）——**逐字即底本原字形，杜绝转写漂移**：\n\n- **華藏世界品第五之一·起首風輪**（Ep15 §四 4.3·对应讲者 §D04/§H07）：「**爾時，普賢菩薩復告大眾言：『諸佛子！此華藏莊嚴世界海，是毘盧遮那如來往昔於世界海微塵數劫修菩薩行時，一一劫中親近世界海微塵數佛，一一佛所淨修世界海微塵數大願之所嚴淨。諸佛子！此華藏莊嚴世界海，有須彌山微塵數風輪所持。其最下風輪，名：平等住，能持其上一切寶焰熾然莊嚴。』**」——讲者 §D04/§H07 口诵「此華藏莊嚴世界海・有須彌山微塵數風輪所持・其最下風輪・名：平等住・能持其上一切寶燄熾然莊嚴」**与底本逐字合**（T0·高信度）。**惟焰/燄异体**：底本作「**焰**」、讲记/幻灯片作「**燄**」——**各照底本·不统一·存记**（凡例四「不据听录回改底本」）。此段兼为 §5.4′.1 品首经文之**第二重 CBETA 逐字回源**（与导读06 听录互证，皆归同一底本）。\n\n**讲者义解（T3·一家之判〔本文判断〕，非经证）**：「**從法身佛來講風輪就是大願**」（§E 义理纲）——风轮＝大愿＝普贤行愿，与李通玄「**風輪是大願波羅蜜所成報**」（§5.3）相合；海云就十大愿逐条发挥（调息风轮）。⚖ 涉自然科学/时事劲爆判语（地球形如柚子滚动 23.5°·卐字八相图＝华严八吉祥·含金量分档）一律标〔本文判断〕·**只标不代立论**。\n\n**【存录不录入】**：Ep15 §D 讲者口诵「世界海十種依住」（香水海／一切華海／摩尼寶網海／漩流光海／菩薩寶莊嚴冠海／種種眾生身海／一切佛音聲摩尼王海……）一段，**该集自标〔CBETA 對勘·俟華藏世界品卷次逐字核〕**（§四未实引此组）；且此「十依住」实属**前接《世界成就品第四》**（品四之文，非本品正文）——本批**不据未回源之口说径录入经证**，只存其目，俟后续逐字核（不臆造）。\n\n**三家对读收束**：Ep15 讲判「风轮＝大愿＝普贤行愿」与澄观「藏识＝香海·无住本＝风轮」（§1.7）、李通玄「风轮＝大愿波罗蜜·香海＝大慈悲·莲华＝法身无依住智」（§5.3）**相发**——三家同指本品「**依正不二·心土融摄**·以愿行庄严依报」之旨〔本文判断〕。\n\n**界限**：以上皆海云**口说听录**之**解读**，非经证、非法师著述，措辞出入须以 CBETA 经本为准；采录之意义在存其**判读视角**（第十三重娑婆·法报化·音声作结·果因相转），**不以其说替代注疏**。海云于本品「两卷／三卷」之数字口说已如上存录不改；本品逐段细读仍以 §2 与 §5.1–5.4 为准。\n\n### 5.5 诸家对读小结\n\n| 议题 | 澄观（`T1735`） | 法藏（`T1733`） | 李通玄（`T1739`/`X0223`） |\n|------|------|------|------|\n| 品名 | 华藏=莲华含藏剎种及剎 | （六十）盧舍那佛品 | 华藏=含藏净秽境界 |\n| 结构 | 三判：自体/安布/剎网 | 义理/教事 | 十门 |\n| 风轮 | 大愿等 | — | 大愿波罗蜜所成报 |\n| 香海 | 藏识/法性海 | — | 大慈悲业所报 |\n| 莲华 | 蘂放异光·万行觉性 | — | 法身随行无依住智 |\n| 主脑 | 依正不二·重重帝網 | 平漫遍＋重重遍 | 业力·愿力·法性力 |\n| 本 | 八十 | 六十 | 八十 |\n\n**〔本文判断〕** 三家之异，要在「**本体论取向**」：澄观重「**心识（藏识）为依报之本**」，法藏重「**光明遍照（二种遍）之圆融**」，李通玄重「**行业因果之配属（十度配十风轮）**」。三者可互补：心识为体，光遍为相，行业为因。\n\n---\n\n## 六、文本对读与校勘（八十／六十）\n\n> **〔体例〕** 本品以八十（`T10n0279`）为底本，六十（`T09n0278`）为对读。六十本无独立〈华藏世界品〉，其内容并入〈盧舍那佛品第二〉（卷三后半至卷四前半）。本节逐项比勘分品、译名、详略、内容分合之异，**异说并存而不强断**。\n\n### 6.1 分品之别\n\n| | 八十本（`T10n0279`） | 六十本（`T09n0278`） |\n|---|---|---|\n| 品题 | 〈華藏世界品第五〉 | 无（并入〈盧舍那佛品第二〉） |\n| 卷次 | 卷八·九·十（三卷） | 卷三后半～卷四前半（约二卷） |\n| 品次 | 第五 | 第二（盧舍那佛品） |\n\n六十本〈盧舍那佛品第二〉融摄八十本之第五品（华藏）与第六品（毗卢遮那）为一品；其世界海段之末，已入八十本第六品之「普莊嚴童子」本事（`T09n0278` 卷四）。\n\n### 6.2 译名之别：世界种／世界性\n\n**六十作「世界性」，八十改「世界種」**（`T1735`）。例：六十本卷四「**中有世界性，名善住**」；八十本对应作「有世界種」。澄观：「**舊經云。性多取此義。恐濫體性故。改為種。**」——此为八十本对六十本之重要译名更定，较「性」更免与「体性」相滥。\n\n### 6.3 风轮与莲华之名目之别\n\n| 项 | 八十本（`T10n0279` 卷八） | 六十本（`T09n0278` 卷三） |\n|---|------|------|\n| 十风轮 | 平等住·出生种种宝庄严·宝威德·平等焰·种种普庄严·普清净·声遍十方·种种宝光明·宝光明·普现庄严 | 平等·种种宝庄严·功德势·宝焰·普庄严·离垢清净平等·方行·一切年·普持势·庄严光明 |\n| 最上风轮 | 殊勝威光藏 | 胜藏 |\n| 大莲华 | 種種光明蘂香幢 | 香幢光明莊嚴 |\n| 大莲华（六十又作） | — | 香幢光明莊嚴（「大蓮華，名香幢光明莊嚴，持此蓮華藏莊嚴世界海」） |\n\n名目多寡与用字各异，然**结构与义趣一致**（十风轮＋最上持香海＋香海出莲华）。\n\n### 6.4 详略之别：十方二十重之巨幅压缩\n\n此为两本**最著之差异**：\n\n- **八十本**：逐海逐重枚举——中央 20 重＋十方十海各 20 重（共 200 主刹），及外围约 89 海，皆列世界名·形·依·佛号（详 §2.9–§2.11）。全品 19,098 字。\n- **六十本**：大幅压缩，仅约二十字草——「**彼眾香水海中有一香水海，名樂光明，有一切香摩尼寶王莊嚴蓮華；上有世界，名清淨寶網光明，佛號離垢淨眼廣入。彼世界上，過佛剎塵數世界，有佛國名雜香蓮華勝妙莊嚴，依寶網住，形如師子座，佛號師子座光明勝照。……**」（`T09n0278` 卷四，共约 12 佛国，以「過佛剎塵數世界」递进），后接「**有香水海，名淨光焰起，中有世界性，名善住。次上復有香水海……如是次上復有世界塵數香水海及世界性，如一方，十方亦如是**」——以「**一方／十方**」一语总收八十本之十方十海。\n\n**〔本文判断〕** 六十本之「约二十名＋以一方例十方」为一「**略举纲要**」式译法；八十本为一「**备举无量**」式译法。此差异反映两译本对「**数法无尽**」之处理策略不同——六十以「**举一例余**」表无尽，八十以「**穷举枚举**」表无尽。\n\n### 6.5 内容分合之别：六十〈盧舍那佛品〉之结构\n\n六十本〈盧舍那佛品第二〉之世界海段，对应八十本品五之全部，其段落为（`T09n0278` 卷三后半～卷四）：\n\n| 六十本段 | 对应八十本 |\n|------|------|\n| 卷三·劫住所段（307） | 之一·前接 |\n| 卷三·风轮香海莲华（308）＋颂 | P1＋颂① |\n| 卷三·金刚围山（350）＋颂 | P4＋颂② |\n| 卷三·大地（372）＋颂 | P7＋颂③ |\n| 卷三·香水海（394）＋颂 | P10＋颂④ |\n| 卷三·香水河（416）＋颂 | P13＋颂⑤ |\n| 卷四·两间地＋世界种总说（10–37）＋颂 | P16–P28 |\n| 卷四·香水海→世界性（约20名，38） | P30–P55（压缩） |\n| 卷四·世界种颂（39–179，约70颂） | P58（101颂之大部分） |\n| 卷四·普莊嚴童子本事（180–） | 八十本第六品〈毗卢遮那品〉 |\n\n### 6.6 六十本缺「十方二十重」之对读\n\n六十本**无**八十本之「十方×二十重」逐层列举（仅约 12–20 名节录），此为两本之**结构级差异**。然六十本卷四之「**世界种颂**」（39–179，约 70 颂）与八十本之「**重颂百一颂**」（P58）内容相合——如：\n\n| 八十本（P58 L1–L2） | 六十本（卷四 L40–L41） |\n|---|---|\n| 華藏世界海，法界等無別，莊嚴極清淨，安住於虛空 | 法界不可壞，蓮華世界海，離垢廣莊嚴，安住於虛空 |\n| 此世界海中，剎種難思議，一一皆自在，各各無雜亂 | 此世界海中，剎性難思議，善住不雜亂，各各悉自在 |\n\n二者**同源而异译**（「剎種」六十作「剎性」，正 §6.2 之例）。\n\n### 6.7 六十本之「佛眉間白毫相出」增句\n\n六十本卷三香水河段：「**一一香水海，有四天下微塵數香水河圍遶，種種寶華彌覆其上；彼諸香水河從佛眉間白毫相出，摩尼寶王汎上隨流。**」（`T09n0278` 卷三）——「**從佛眉間白毫相出**」一句，为八十本对应段（P13）所无。**〔已核·八十全本直证 2026-10-24〕**：以本机八十全本 `T10n0279.xml` 逐字检索，「**從佛眉間白毫相出**」凡 **0 见**（「眉間白毫」虽 80 本亦 5 见，然皆在诸品放光段，**非香水河「從…白毫相出」句**；「白毫相出」亦 80 本 0 见）——→ **八十本此段实无此对应增句，六十「香河從佛白毫出」之增句属实**（非旧标之语料未尽）。此为一处**义增/详略之别**。\n\n### 6.8 校勘小结\n\n| 维度 | 六十（`T09n0278`） | 八十（`T10n0279`） | 结论 |\n|------|------|------|------|\n| 分品 | 并入盧舍那佛品 | 独立华藏世界品 | **分合之别** |\n| 译名 | 世界性 | 世界種 | **更定** |\n| 详略 | 约20名＋举一例余 | 穷举200+主刹 | **策略之别** |\n| 义增 | 香河從佛白毫出 | 无（待核） | **增句** |\n| 偈颂 | 约70颂 | 101颂 | **广略之别** |\n\n**八十本底本（`T10n0279`）内部用字自歧**（同一述语前后不一，非六十／八十之别，乃译出后传写之歧）：\n\n| 处 | 前一作 | 后一作 | 说明 |\n|------|------|------|------|\n| 世界种名（P30／P31） | 立种作「**普照**十方熾然寶光明」 | 收摄作「此**遍照**十方熾然寶光明世界種」 | 同一种名「普照／遍照」不一（参 §2.9 校勘按、§5.1 澄观释名） |\n| 十门总标（P29／P31） | 「彼諸世界種，於世界海中，各各**方所**，各各趣入」 | 「各各所依住……各各**方面**，各各趣入」 | 底本 `0041c28` 作「方所」、`0043c12` 作「方面」，两处各照底本，**不统一** |\n| 标点 | P46「佛號**；**最勝三昧精進慧」 | — | 底本误以分号施于「佛號：」后（当作冒号），此系底本排印之讹，**不改经文，只标**〔讲者/底本之误·只标〕 |\n| 世界名异写 | P55（鲁香幢海）作「發生歡喜」 | 全品余处「發生歡喜」类名少见 | 「發生歡喜」为全品唯一之异写，照底本 |\n\n**〔待核〕**：六十本卷四之约20名节录，与八十本**中央世界种二十重**之逐一对勘，**已办（见 §6.9）**；八十本香水河段是否别有「從佛白毫出」之对应句〔待核〕；「普照／遍照」二形孰为梵本正译，须待梵本／藏本〔待核〕（§8·附录四无梵藏本可核）。\n\n### 6.9 六十本卷四「约二十名」之逐一对勘（本批交付）\n\n> **〔缘起〕** 附录四#8 原列「六十卷四约 20 名与八十十海首名之对应」为〔待核〕。本批据六十本卷四（`T09n0278`）之原文，**逐名对勘**如次。\n> **〔正误〕** 勘之结果：六十本之约二十名，**非**对八十本「十方十海之首名」（原图），而是对八十本「**之一·中央世界种二十重**」（P30–P55 之最前段）。下文正之。\n\n**（一）两本之段首（香海·莲华·世界种）对勘**：\n\n| 位 | 八十本（`T10n0279` 卷八·之一） | 六十本（`T09n0278` 卷四） | 判 |\n|----|------|------|-----|\n| 香水海 | 無邊妙華光 | **樂光明** | **异** |\n| 大莲华 | 一切香摩尼王莊嚴 | **一切香摩尼寶王莊嚴** | **近同** |\n| 世界种／世界 | 世界種：普照十方熾然寶光明 | 世界：清淨寶網光明 | 异（位次相错） |\n| 最下一重佛号 | 淨眼離垢燈 | 離垢淨眼廣入 | **近同** |\n\n**（二）二十重逐名对勘**（六十本以「過佛剎塵數世界，有佛國名…佛號…」递进，凡 **12 佛国**；其后为 **7 组「香水海→世界性」**）：\n\n| 六十 # | 六十 国名 | 六十 佛号 | 八十 重 | 八十 世界名 | 八十 佛号 | 吻合度 |\n|--------|-----------|-----------|---------|-------------|-----------|--------|\n| 1 | 清淨寶網光明 | 離垢淨眼廣入 | 1 | 最勝光遍照 | 淨眼離垢燈 | **佛号近同** |\n| 2 | 雜香蓮華勝妙莊嚴（形如師子座） | 師子座光明勝照 | 2 | 種種香蓮華妙莊嚴（狀如師子之座） | 師子光勝照 | **★近同**（国名·形·佛号俱近） |\n| 3 | 寶莊嚴普光明（形如日輪雲） | 廣大光明智勝 | 3 | 一切寶莊嚴普照光（形八隅） | 淨光智勝幢 | 国名近／佛号半 |\n| 4 | 雜光蓮華 | 金剛光明普精進善起 | 4 | 種種光明華莊嚴 | 金剛光明無量精進力善出現 | **佛号近同** |\n| 5 | 無畏嚴淨 | 平等莊嚴妙音幢王 | 5 | 普放妙華光 | 香光喜力海 | 异 |\n| 6 | 華開淨焰 | 愛海功德稱王 | **7** | 眾華焰莊嚴 | 歡喜海功德名稱自在光 | **近**（跨配：六十#6↔八十#7） |\n| 7 | 總持 | 淨智慧海 | 8 | 出生威力地 | 廣大名稱智海幢 | 弱 |\n| 8 | 解脫聲 | 善相幢 | 9 | 出妙音聲 | 清淨月光明相無能摧伏 | 弱（「聲」字偶合） |\n| 9 | 勝起 | 蓮華藏光 | 10 | 金剛幢 | 一切法海最勝王 | 异 |\n| 10 | 善住金剛不可破壞 | 那羅延不可破壞 | （11 之際作「極堅牢不可壞金剛」） | — | — | 弱／异 |\n| 11 | 華林赤蓮華 | 雜寶華鬘智王 | — | — | — | 异 |\n| 12 | 淨光勝電如來藏 | 能起一切所願功德 | — | — | — | 异 |\n| 13 | 香水海 淨光焰起 → 世界性 善住 | — | — | — | — | **结构异** |\n| 14 | 香水海 金剛眼光明 → 世界性 法界等起 | — | — | — | — | 结构异 |\n| 15 | 香水海 蓮華平正 → 世界性 出十方化身 | — | — | — | — | 结构异 |\n| 16 | 香水海 寶地莊嚴光明 → 世界性 寶枝莊嚴 | — | — | — | — | 结构异 |\n| 17 | 香水海 化香焰 → 世界性 清淨化 | — | — | — | — | 结构异 |\n| 18 | 香水海 寶幢 → 世界性 佛護念 | — | — | — | — | 结构异 |\n| 19 | 世界性 眾色普光 | — | — | — | — | 结构异 |\n\n**（三）结论（三条）**：\n\n1. **对应之位在「中央世界种二十重」，非「十方十海首名」**（附录四#8 原图当正）。两本之**段首**（莲华名「一切香摩尼(王/寶王)莊嚴」）与**第一·二·四重佛号**吻合至近乎同文，可断为**同一梵本之两译**。\n2. **然不能逐一名对应**：吻合度随重次递降（#2 ★， #4 强， #3·#6 中， #5·#7–#12 弱／异）；且六十 #6 **跨配**八十 #7（次序已乱）。→ **六十之名录为「择要节录＋另取异名」，非八十二十重之机械缩写**。\n3. **末七组「香水海→世界性」对（#13–19）在八十之中央二十重中无对应结构**；此七对当对应八十本**之三「十海所管之海（外围香水海）」**或**之二十方之种**，方位未定〔待核〕。\n\n> **〔本文判断〕** 六十本以「**十二国＋七海性**」之约二十名，代八十本之「**中央二十重＋十方十海＋外围八十九海**」；以「**如一方，十方亦如是**」一语总收。此正 §6.4「举一例余 vs 穷举枚举」之**同一策略**：**六十以「约二十名」表「不可说佛刹微尘数世界」**。故此二十名之价值，在**其名（异译之名）**，不在**其数**。\n\n**（四）六十本此段原文（逐字回源·节引）**：\n\n> 「**佛子！彼眾香水海中有一香水海，名樂光明，有一切香摩尼寶王莊嚴蓮華；上有世界，名清淨寶網光明，佛號離垢淨眼廣入。彼世界上，過佛剎塵數世界，有佛國名雜香蓮華勝妙莊嚴，依寶網住，形如師子座，佛號師子座光明勝照。彼世界上，過佛剎塵數世界，有佛國名寶莊嚴普光明，依諸華住，形如日輪雲，佛號廣大光明智勝。……彼世界上，有香水海，名淨光焰起，中有世界性，名善住。次上復有香水海，名金剛眼光明，中有世界性，名法界等起。……如是次上復有世界塵數香水海及世界性，如一方，十方亦如是盧舍那佛常轉法輪處。**」（`T09n0278` 卷四·〈盧舍那佛品第二之三〉）\n\n> **对读八十本同段（`T10n0279` 卷八·之一）**：\n> 「**此最中央香水海，名：無邊妙華光……出大蓮華，名：一切香摩尼王莊嚴；有世界種而住其上，名：普照十方熾然寶光明……其最下方有世界，名：最勝光遍照……佛號：淨眼離垢燈。此上過佛剎微塵數世界，有世界，名：種種香蓮華妙莊嚴……其狀猶如師子之座……佛號：師子光勝照。……**」（`T10n0279` 卷八）\n\n**（五）回填**：附录四#8 之〔待核〕**已办**（本节）；其原图「与八十十海首名」据本节**订正**为「与八十中央世界种二十重」。\n\n**（六）〔P5·2026-10-24 六十全本复验·本机两源自歧】——如实揭露·不擅统一**：\n\n上列「约二十名」旧据 `data/references/cbeta_txt/T09n0278_juan4.txt`（卷四 txt）立录。本批另以本机**六十全本 `data/references/cbeta/T09n0278.xml`（sha256 a2bfcee6213f）**逐名复验，得：**凡 14 名与 txt 逐字合**（如「清淨寶網光明·離垢淨眼廣入·師子座光明勝照·寶莊嚴普光明·無畏嚴淨·華開淨焰·善住金剛不可破壞·淨光勝電如來藏·樂光明·金剛眼光明·寶地莊嚴光明·化香焰·寶幢·眾色普光」等）；**5 名全本 XML 有脱文而 txt 独有全名**：\n\n| 六十 # | txt 本（§6.9 所本） | 全本 XML（sha256 a2bfcee6213f） | 判 |\n|---|---|---|---|\n| #2 佛国名 | 雜香蓮華勝妙莊嚴 | 脱作「有佛國名**嚴**」（国名截断） | **二源自歧** |\n| #11 佛国名 | 華林赤蓮華 | 脱作「有佛國名**華林**」（赤蓮華以脱） | **二源自歧** |\n| #11 佛号 | 雜寶華鬘智王 | **整缺**（接「界上」） | **二源自歧** |\n| #15 香水海 | 蓮華平正 | **整对缺**（两「次上復有香水海」间脱文） | **二源自歧** |\n| #15 世界性 | 出十方化身 | 同上整对缺 | **二源自歧** |\n\n另 §6.3 十风轮名之「**一切年**」于全本 cjk 检索 **0 见**（txt 有），属同类脱文，一并存记。\n\n> **【处理·各照其源不统一】**：本机两份六十源（txt 与全本 XML）**同标 `T09n0278` 而文字有详略之异**——此**非八十/六十之别，乃同一六十本之两本地源自歧**。① **§6.9 依 txt 之全名成立**（txt 为此段之**较完整 Witness**），全本 XML 之脱文**不推翻之**；② **不据 txt 补 XML 之脱、亦不据 XML 删 txt 之名**（不擅改经文·铁律）；③ 两源并存、**各注所据·存记待核**〔待核·二源自歧〕。**此全本 XML 于世界海段之脱文现象本身，即六十「传写不尽」之直接实证**——与本品 §1.5「十不可說脱十字」、《毗卢遮那品》澄 | **递归嵌套** |\n\n**欧氏不可嵌入判定**〔本文判断·形式〕：与第四部同理——欧氏空间体积单调（A⊂B 且保形 ⇒ vol(A)≤vol(B)），然本品云「毛孔（小）容亿剎（大）而未曾迫隘（保形）」，二者相违。∴ 华藏境界**不可等距嵌入任何有限维欧氏空间**，须**非欧／超度量**之空间（参第四部 §7.4）。\n\n**自似嵌套**〔本文判断·类比〕：本品之「**海 ⊃ 种 ⊃ 世界**」三层，与「**世界网**」之「一世界＝一網孔，遞相接連」，构成**逐层自似**：每一世界种具十门（依住…力加持），每一世界亦具十门——**局部与整体同构**，即分形／自似之相。\n\n**因陀罗网三证**：本品「帝網」义凡三处——P7「如天帝網」（宝地）、P30「如天帝網分布而住」（香海）、P56「如天珠网」「成世界网」（总结）；字面计数：「如天帝網」**3**·「因陀羅網」**9**·「帝網」**10**。此为华严「因陀罗网」之密集教证群。\n\n**尘刹相入之字面计数**：「一一」**28**·「一一塵中」**2**·「一一微塵」**1**·「一一毛孔」**1**·「一毛孔」**1**·「塵中」**7**·「如影」**2**·「如幻」**2**·「如夢」**1**·「如鏡」**2**·「遞相接連」**1**·「成世界網」**1**。\n\n### 7.5 复算说明\n\n```\npython scripts/huazang_shijie_studies.py\n```\n\n输出 JSON：L1（cjk／unique／H／zipf／sent／p·lg·l·verses／top15）、seg（三段分计）、motifs（名相词频）、L2（名相枚举计量）、L3（方位与关系）、L4（自似与如幻）。**本表结构化读数（L1／seg／motifs／L2 之海域枚举／L3／L4）皆此一命令所出**；另有少数名相字符串计数（「名：」481、「有世界」258、「有世界，名：」247，及其分段小计）系**同口径直计**（剥标签＋压空白后 `str.count`），非该 JSON 之键，特此别白，以免误引。凡初稿与今稿之异（如「佛號」236／249、环海 98／99），皆因**是否压除空白**及**regex 是否漏计异形**，今已定正（§〇·九）。\n\n### 7.6 经文回源附录\n\n凡 §二所引经文，皆出自 `data/references/cbeta/T10n0279.xml`，品题「華藏世界品第五之一」至「毘盧遮那品第六」之间（字符偏移约 233504–309851）。**品五之卷界**：卷八 open 233059／close 259665；卷九 open 259856／close 284066；卷十 open 284258／close 308553；卷十一 open 308745。凡校勘（`<note>`／`<app>`）皆未采入正文。**偈颂以 `<l>` 行计，两行一颂**。\n\n---\n\n## 八、附录（十一类）\n\n### 附录一·计数比勘（十事／长行／颂／香海）\n\n| 项 | 数 | 备注 |\n|----|----|------|\n| 十事（澄观判） | 10 | 风轮·香海·莲华·剎海·轮山·宝地·香海·香河·华林·总结（§1.1、§2.0） |\n| 剎種十門 | 10 | 依住·形状·体性·方所·趣入·庄严·分齐·行列·无差别·力加持（§2.8） |\n| 长行 `<p>` 段 | **47** | 之一 23＋之二 11＋之三 13（§7.1） |\n| 偈组 `<lg>` | **9** | 之一 8＋之三 1（§2.0） |\n| 偈行 `<l>` | **362** | ＝181 颂×2（凡例八） |\n| 颂 | **181** | 之一 80＋之三 101（§2.0） |\n| 香水海（本名） | **99** | ＝「次有香水海」标数（环 10＋外围 89）；中央别计（§7.2） |\n| 世界种（本名现文） | 126 见 | 名相计数，非实种数（§7.2） |\n| 「佛號」 | **249** | 之一 19／之二 194／之三 36（§7.2） |\n| 「其佛即是」（娑婆） | 1 | 中央第 13 重（§2.9） |\n| 「名：」 | **481** | 立名之总标记（§7.2） |\n| 「此上過」 | **218** | 重间递进标记（§7.2） |\n| 「周匝圍遶」 | 24 | 眷属围绕（§7.2） |\n| 中央二十重总绕数 | 210 | 1+2+…+20（澄观「二百一十佛剎塵數」§2.9） |\n\n### 附录二·名相表（定名·异译）\n\n| function _initArticleENMode(){

    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);

    full.querySelectorAll('blockquote').forEach(function(bq){

      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });

  _applyArticleENMode();
}
