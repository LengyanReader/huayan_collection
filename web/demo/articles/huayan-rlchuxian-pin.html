  var MAP = {"法显西行": "person_110", "鸠摩罗什": "person_103", "佛驮跋陀罗": "person_006", "杜顺": "person_001", "智俨": "person_002", "法藏": "person_003", "澄观": "person_004", "宗密": "person_005", "实叉难陀": "person_007", "般若": "person_008", "义天": "person_010", "净源": "person_011", "月霞": "person_012", "海云继梦": "person_042", "南亭": "person_015", "成一": "person_016", "贤度": "person_017", "智光": "person_018", "应慈": "person_031", "常惺": "person_013", "支娄迦谶": "person_007b", "审祥": "person_050", "钦因": "person_041", "真禅": "person_044", "慧光": "person_090", "元晓": "person_060", "义湘": "person_061", "慧苑": "person_070", "子璿": "person_091", "均如": "person_062", "续法": "person_080", "良弁": "person_j01", "实忠": "person_j02", "等定": "person_j03", "圣宝": "person_j04", "观贤": "person_j05", "明惠": "person_j06", "凝然": "person_j07", "思元慧三": "person_f01", "成观法师": "person_126", "体化性果": "person_f02", "了中": "person_032", "賢首": "person_003", "康藏法藏": "person_003", "雲華": "person_002", "澄觀": "person_004", "清涼": "person_004", "義天": "person_010", "義湘": "person_061", "元曉": "person_060", "審祥": "person_050", "實叉難陀": "person_007", "佛陀跋陀罗": "person_006", "應慈": "person_031", "續法": "person_080", "淨源": "person_011"};
  var NAMES = Object.keys(MAP).sort(function(a,b){return b.length-a.length;});
  var BASE = '../famai/shanhe.html';
  function skip(node){
    var p = node.parentElement;
    while(p && p !== document.body){
      var tag = p.tagName;
      if(tag==='A'||tag==='CODE'||tag==='PRE'||tag==='BLOCKQUOTE') return true;
      var cls = p.getAttribute ? (p.getAttribute('class')||'') : '';
      if(/\b(q|quote|cite-card|lic)\b/.test(cls)) return true;
      p = p.parentElement;
    }
    return false;
  }
  function linkify(){
    var root = document.getElementById('article-root');
    if(!root) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var edits = [];
    var tn;
    while((tn = walker.nextNode())){
      if(skip(tn)) continue;
      var text = tn.textContent;
      for(var i=0;i<NAMES.length;i++){
        var nm = NAMES[i], pos = text.indexOf(nm);
        if(pos < 0) continue;
        edits.push({node:tn, name:nm, pid:MAP[nm], pos:pos});
        break;
      }
    }
    for(var j=edits.length-1;j>=0;j--){
      var e = edits[j];
      var t = e.node.textContent;
      var idx = t.indexOf(e.name);
      if(idx < 0) continue;
      var before = t.slice(0, idx), after = t.slice(idx + e.name.length);
      var a = document.createElement('a');
      a.href = BASE + '?master=' + e.pid;
      a.className = 'lin-deeplink';
      a.title = '在山河法脉地图中展开 ' + e.name;
      a.textContent = e.name;
      var frag = document.createDocumentFragment();
      if(before) frag.appendChild(document.createTextNode(before));
      frag.appendChild(a);
      if(after) frag.appendChild(document.createTextNode(after));
      e.node.parentNode.replaceChild(frag, e.node);
    }
    if(edits.length) console.log('[lin-deeplink] linked %d mentions' % edits.length);
  }
  if(document.readyState==='complete') setTimeout(linkify,100);
  else window.addEventListener('load', function(){ setTimeout(linkify,100); });
})();
</script>

var ARTICLE = {"id": "huayan-rlchuxian-pin", "file": "articles/huayan-rlchuxian-pin.html", "title": "九九华严第三十五品 如来出现品之拼读", "title_sub": "", "icon": "☀️", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第七会_普光明殿_等觉/华严经细读_第三十五部_如来出现品.md", "doc_md": "# 华严经细读·第三十五部《如来出现品》之拼读\n\n> **EN · The Chapter on the Manifestation of the Tathāgata**\n\n> **底本**：八十华严 `T10n0279`。**范围：卷第五十～五十二（如來出現品第三十七·本品全文·跨三卷）**。本品属**第七会「普光明殿会」·等觉果分（平等因果之果）**。\n\n---\n\n## 〇、凡例\n\n一、底本 `T10n0279`。二、引文程序注入（0 手抄·逐字回源）。三、存疑标〔待核〕推断标〔本文判断〕。四、体量自陈：**全文成篇**（九段主题流全引）。\n\n## 一、概述与品题解义\n\n**品名**：**如來出現品第三十七**。说主：**普賢菩薩**（承性起妙德菩萨之问，入定受加而说）。**实测**：品文净 **23,160 CJK**，139 `<p>`＋13 `<lg>`，跨 51 页（卷50–52）。\n\n**【定位】**第七会压轴之品、**平等因果之果**——白毫光名「如來出現」而入**性起妙德**菩萨顶，普贤说如来出现之业用：身十相·音声十相·心十相（三十喻）＋世界成喻组＋音声十无量＋性起境界＋文字无尽＋结劝七喻。澄观：「前品明稱果之因。此品辨如因之果。體雖平等不壞二相」（§5.1）。\n\n**【一句】****如来出现非以一缘一事——身口意三十喻展开性起之海；一微尘中经卷具在，破尘即出。**\n\n## 二、本品全文注（九段全引）\n\n**（1）序分·白毫光入性起顶（請法因起）**——世尊眉間白毫放光名「如來出現」，光入**如來性起妙德菩薩**頂；大众欢喜念请，性起妙德菩萨问普贤——「性起」之名自此光始。\n\n> 如來出現品之一如來出現品第三十七之一爾時，世尊從眉間白毫相中放大光明，名：如來出現，無量百千億那由他阿僧祇光明以為眷屬。其光普照十方盡虛空法界一切世界，右遶十匝，顯現如來無量自在，覺悟無數諸菩薩眾，震動一切十方世界，除滅一切諸惡道苦，映蔽一切諸魔宮殿，顯示一切諸佛如來坐菩提座成等正覺及以一切道場眾會；作是事已，而來右遶菩薩眾會，入如來性起妙德菩薩頂。時，此道場一切大眾身心踊躍，生大歡喜，作如是念：「甚奇希有！今者如來放大光明，必當演說甚深大法。」爾時，如來性起妙德菩薩於蓮華座上，偏袒右肩，右跽合掌，一心向佛而說頌言：「正覺功德大智出，普達境界到彼岸，等於三世諸如來，是故我今恭敬禮。已昇無相境界岸，而現妙相莊嚴身，放於離垢千光明，破魔軍眾咸令盡。十方所有諸世界，悉能震動無有餘，未曾恐怖一眾生，善逝威神力如是。虛空法界性平等，已能如是而安住，一切含生無數量，咸令滅惡除眾垢。苦行勤勞無數劫，成就最上菩提道，於諸境界智無礙，與一切佛同其性。導師放此大光明，震動十方諸世界，已現無量神通力，而復還來入我身。決定法中能善學，無量菩薩皆來集，令我發起問法心，是故我今請法王。今此眾會皆清淨，善能度脫諸世間，智慧無邊無染著，如是賢勝咸來集。利益世間尊導師，智慧精進皆無量，今以光明照大眾，令我問於無上法。誰於大仙深境界，而能真實具開演？誰是如來法長子？世間尊導願顯示！」爾時，如來即於口中放大光明，名：無礙無畏，百千億阿僧祇光明以為眷屬。普照十方盡虛空等法界一切世界，右遶十匝，顯現如來種種自在，開悟無量諸菩薩眾，震動一切十方世界，除滅一切諸惡道苦，映蔽一切諸魔宮殿，顯示一切諸佛如來坐菩提座成等正覺及以一切道場眾會；作是事已，而來右遶菩薩眾會，入普賢菩薩摩訶薩口。其光入已，普賢菩薩身及師子座，過於本時及諸菩薩身座百倍，唯除如來師子之座。爾時，如來性起妙德菩薩問普賢菩薩摩訶薩言：「佛子！佛所示現廣大神變，令諸菩薩皆生歡喜，不可思議，世莫能知，是何瑞相？」普賢菩薩摩訶薩言：「佛子！我於往昔見諸如來、應、正等覺示現如是廣大神變，即說如來出現法門。如我惟忖，今現此相，當說其法。」說是語時，一切大地悉皆震動，出生無量問法光明。時，性起妙德菩薩問普賢菩薩言：「佛子！菩薩摩訶薩應云何知諸佛如來、應、正等覺出現之法？願為我說！佛子！此諸無量百千億那由他菩薩眾會，皆久修淨業，念慧成就，到於究竟大莊嚴岸，具一切佛威儀之行，正念諸佛未曾忘失，大悲觀察一切眾生，決定了知諸大菩薩神通境界，已得諸佛神力所加，能受一切如來妙法；具如是等無量功德，皆已來集。佛子！汝已曾於無量百千億那由他佛所承事供養，成就菩薩最上妙行，於三昧門皆得自在，入一切佛祕密之處，知諸佛法，斷眾疑惑，為諸如來神力所加，知眾生根，隨其所樂為說真實解脫之法，隨順佛智演說佛法到於彼岸，有如是等無量功德。善哉佛子！願說如來、應、正等覺出現之法，身相、言音、心意境界，所行之行，成道轉法，乃至示現入般涅槃，見聞親近所生善根；如是等事，願皆為說！」時，如來性起妙德菩薩欲重明此義，向普賢菩薩而說頌曰：「善哉無礙大智慧，善覺無邊平等境，願說無量佛所行，佛子聞已皆欣慶！菩薩云何隨順入，諸佛如來出興世？云何身語心境界？及所行處願皆說！云何諸佛成正覺？云何如來轉法輪？云何善逝般涅槃？大眾聞已心歡喜。若有見佛大法王，親近增長諸善根，願說彼諸功德藏，眾生見已何所獲？若有得聞如來名，若現在世若涅槃，於彼福藏生深信，有何等利願宣說！此諸菩薩皆合掌，瞻仰如來仁及我，大功德海之境界，淨眾生者願為說！願以因緣及譬諭，演說妙法相應義，眾生聞已發大心，疑盡智淨如虛空。如遍一切國土中，諸佛所現莊嚴身，願以妙音及因諭，示佛菩提亦如彼。十方千萬諸佛土，億那由他無量劫，如今所集菩薩眾，於彼一切悉難見。此諸菩薩咸恭敬，於微妙義生渴仰，願以淨心具開演，如來出現廣大法！」爾時，普賢菩薩摩訶薩告如來性起妙德等諸菩薩大眾言：「佛子！此處不可思議，所謂如來、應、正等覺以無量法而得出現。何以故？非以一緣，非以一事，如來出現而得成就；以十無量百千阿僧祇事而得成就。何等為十？所謂：過去無量攝受一切眾生菩提心所成故，過去無量清淨殊勝志樂所成故，過去無量救護一切眾生大慈大悲所成故，過去無量相續行願所成故，過去無量修諸福智心無厭足所成故，過去無量供養諸佛教化眾生所成故，過去無量智慧方便清淨道所成故，過去無量清淨功德藏所成故，過去無量莊嚴道智所成故，過去無量通達法義所成故。佛子！如是無量阿僧祇法門圓滿，成於如來。佛子！\n\n**（2）如来出现总标·十无量百千阿僧祇事（世界成喻组）**——「非以一緣，非以一事，如來出現而得成就；以十無量百千阿僧祇事而得成就」——以世界之成（风轮·水轮·大云降雨）喻如来出现之缘起：一多相即，缘成无性。\n\n> 譬如三千大千世界，非以一緣，非以一事，而得成就，以無量緣、無量事，方乃得成。所謂：興布大雲，降霔大雨，四種風輪相續為依。其四者何？一名：能持，能持大水故；二名：能消，能消大水故；三名：建立，建立一切諸處所故；四名：莊嚴，莊嚴分布咸善巧故。如是皆由眾生共業及諸菩薩善根所起，令於其中一切眾生各隨所宜而得受用。佛子！如是等無量因緣乃成三千大千世界，法性如是，無有生者，無有作者，無有知者，無有成者，然彼世界而得成就。如來出現亦復如是，非以一緣，非以一事，而得成就；以無量因緣，無量事相，乃得成就。所謂：曾於過去佛所聽聞受持大法雲雨，因此能起如來四種大智風輪。何等為四？一者念持不忘陀羅尼大智風輪，能持一切如來大法雲雨故；二者出生止觀大智風輪，能消竭一切煩惱故；三者善巧迴向大智風輪，能成就一切善根故；四者出生離垢差別莊嚴大智風輪，令過去所化一切眾生善根清淨，成就如來無漏善根力故。如來如是成等正覺，法性如是，無生無作而得成就。佛子！是為如來、應、正等覺出現第一相，菩薩摩訶薩應如是知。「復次，佛子！譬如三千大千世界將欲成時，大雲降雨，名曰：洪霔，一切方處所不能受、所不能持，唯除大千界將欲成時。佛子！如來、應、正等覺亦復如是，興大法雲，雨大法雨，名：成就如來出現，一切二乘心志狹劣所不能受、所不能持，唯除諸大菩薩心相續力。佛子！是為如來、應、正等覺出現第二相，菩薩摩訶薩應如是知。「復次，佛子！譬如眾生以業力故，大雲降雨，來無所從，去無所至。如來、應、正等覺亦復如是，以諸菩薩善根力故，興大法雲，雨大法雨，亦無所從來，無所至去。佛子！是為如來、應、正等覺出現第三相，菩薩摩訶薩應如是知。「復次，佛子！譬如大雲降霔大雨，大千世界一切眾生，無能知數，若欲算計，徒令發狂；唯大千世界主——摩醯首羅，以過去所修善根力故，乃至一滴無不明了。佛子！如來、應、正等覺亦復如是，興大法雲，雨大法雨，一切眾生、聲聞、獨覺所不能知，若欲思量，心必狂亂；唯除一切世間主——菩薩摩訶薩，以過去所修覺慧力故，乃至一文一句，入眾生心，無不明了。佛子！是為如來、應、正等覺出現第四相，菩薩摩訶薩應如是知。「復次，佛子！譬如大雲降雨之時，有大雲雨，名為：能滅，能滅火災；有大雲雨，名為：能起，能起大水；有大雲雨，名為：能止，能止大水；有大雲雨，名為：能成，能成一切摩尼諸寶；有大雲雨，名為：分別，分別三千大千世界。佛子！如來出現亦復如是，興大法雲，雨大法雨，有大法雨，名為：能滅，能滅一切眾生煩惱；有大法雨，名為：能起，能起一切眾生善根；有大法雨，名為：能止，能止一切眾生見惑；有大法雨，名為：能成，能成一切智慧法寶；有大法雨，名為：分別，分別一切眾生心樂。佛子！是為如來、應、正等覺出現第五相，菩薩摩訶薩應如是知。「復次，佛子！譬如大雲雨一味水，隨其所雨，無量差別。如來出現亦復如是，雨於大悲一味法水，隨宜說法，無量差別。佛子！是為如來、應、正等覺出現第六相，菩薩摩訶薩應如是知。「復次，佛子！譬如三千大千世界初始成時，先成色界諸天宮殿，次成欲界諸天宮殿，次成於人及餘眾生諸所住處。佛子！如來出現亦復如是，先起菩薩諸行智慧，次起緣覺諸行智慧，次起聲聞善根諸行智慧，次起其餘眾生有為善根諸行智慧。佛子！譬如大雲雨一味水，隨諸眾生善根異故，所起宮殿種種不同。如來大悲一味法雨，隨眾生器而有差別。佛子！是為如來、應、正等覺出現第七相，菩薩摩訶薩應如是知。「復次，佛子！譬如世界初欲成時，有大水生，遍滿三千大千世界；生大蓮華，名：如來出現功德寶莊嚴，遍覆水上，光照十方一切世界。時，摩醯首羅、淨居天等見是華已，即決定知於此劫中有爾所佛出興于世。佛子！爾時，其中有風輪起，名：善淨光明，能成色界諸天宮殿。有風輪起，名：淨光莊嚴，能成欲界諸天宮殿。有風輪起，名：堅密無能壞，能成大小諸輪圍山及金剛山。有風輪起，名：勝高，能成須彌山王。有風輪起，名：不動，能成十大山王。何等為十？所謂：佉陀羅山、仙人山、伏魔山、大伏魔山、持雙山、尼民陀羅山、目真隣陀山、摩訶目真隣陀山、香山、雪山。有風輪起，名為：安住，能成大地。有風輪起，名為：莊嚴，能成地天宮殿、龍宮殿、乾闥婆宮殿。有風輪起，名：無盡藏，能成三千大千世界一切大海。有風輪起，名：普光明藏，能成三千大千世界諸摩尼寶。有風輪起，名：堅固根，能成一切諸如意樹。佛子！大雲所雨一味之水，無有分別；以眾生善根不同故，風輪不同；風輪差別故，世界差別。佛子！如來出現亦復如是，具足一切善根功德，放於無上大智光明，名：不斷如來種不思議智，普照十方一切世界，與諸菩薩一切如來灌頂之記：當成正覺出興於世。佛子！如來出現復有無上大智光明，名：清淨離垢，能成如來無漏無盡智。復有無上大智光明，名：普照，能成如來普入法界不思議智。復有無上大智光明，名：持佛種性，能成如來不傾動力。復有無上大智光明，名：逈出無能壞，能成如來無畏無壞智。復有無上大智光明，名：一切神通，能成如來諸不共法、一切智智。復有無上大智光明，名：出生變化，能成如來令見聞親近所生善根不失壞智。復有無上大智光明，名：普隨順，能成如來無盡福德智慧之身，為一切眾生而作饒益。復有無上大智光明，名：不可究竟，能成如來甚深妙智，隨所開悟，令三寶種永不斷絕。復有無上大智光明，名：種種莊嚴，能成如來相好嚴身，令一切眾生皆生歡喜。復有無上大智光明，名：不可壞，能成如來法界、虛空界等殊勝壽命無有窮盡。佛子！如來大悲一味之水無有分別，以諸眾生欲樂不同、根性各別，而起種種大智風輪，令諸菩薩成就如來出現之法。佛子！一切如來同一體性，大智輪中出生種種智慧光明。佛子！汝等應知，如來於一解脫味出生無量不可思議種種功德，眾生念言：『此是如來神力所造。』佛子！此非如來神力所造。佛子！乃至一菩薩，不於佛所曾種善根，能得如來少分智慧，無有是處。但以諸佛威德力故，令諸眾生具佛功德，而佛如來無有分別，無成無壞，無有作者，亦無作法。佛子！是為如來、應、正等覺出現第八相，菩薩摩訶薩應如是知。「復次，佛子！如依虛空起四風輪，能持水輪。何等為四？一名：安住，二名：常住，三名：究竟，四名：堅固。此四風輪能持水輪，水輪能持大地令不散壞。是故說：地輪依水輪，水輪依風輪，風輪依虛空，虛空無所依。雖無所依，能令三千大千世界而得安住。佛子！如來出現亦復如是，依無礙慧光明起佛四種大智風輪，能持一切眾生善根。何等為四？所謂：普攝眾生皆令歡喜大智風輪，建立正法令諸眾生皆生愛樂大智風輪，守護一切眾生善根大智風輪，具一切方便通達無漏界大智風輪。是為四。佛子！諸佛世尊，大慈救護一切眾生，大悲度脫一切眾生，大慈大悲普遍饒益。然大慈大悲依大方便善巧，大方便善巧依如來出現，如來出現依無礙慧光明，無礙慧光明無有所依。佛子！是為如來、應、正等覺出現第九相，菩薩摩訶薩應如是知。「復次，佛子！譬如三千大千世界既成就已，饒益無量種種眾生。所謂：水族眾生得水饒益，陸地眾生得地饒益，宮殿眾生得宮殿饒益，虛空眾生得虛空饒益。如來出現亦復如是，種種饒益無量眾生。所謂：見佛生歡喜者，得歡喜益；住淨戒者，得淨戒益；住諸禪定及無量者，得聖出世大神通益；住法門光明者，得因果不壞益；住無所有光明者，得一切法不壞益。是故說言：『如來出現，饒益一切無量眾生。』佛子！是為如來、應、正等覺出現第十相，菩薩摩訶薩應如是知。「佛子！菩薩摩訶薩知如來出現，則知無量，知成就無量行故；則知廣大，知周遍十方故；則知無來去，知離生住滅故；則知無行、無所行，知離心、意、識故；則知無身，知如虛空故；則知平等，知一切眾生皆無我故；則知無盡，知遍一切剎無有盡故；則知無退，知盡後際無斷絕故；則知無壞，知如來智無有對故；則知無二，知平等觀察為、無為故；則知一切眾生皆得饒益，本願迴向自在滿足故。」爾時，普賢菩薩摩訶薩欲重明此義而說頌言：「十力大雄最無上，\n\n**（3）世界喻偈颂**——长偈重颂世界成喻（譬如虛空無等等……譬如樹林依地有）——偈体自问自答，把长行喻网再织一遍。\n\n> 譬如虛空無等等，境界廣大不可量，功德第一超世間。十力功德無邊量，心意思量所不及，人中師子一法門，眾生億劫莫能知。十方國土碎為塵，或有算計知其數；如來一毛功德量，千萬億劫無能說。如人持尺量虛空，復有隨行計其數，虛空邊際不可得，如來境界亦如是。或有能於剎那頃，悉知三世眾生心，設經眾生數等劫，不能知佛一念性。譬如法界遍一切，不可見取為一切；十力境界亦復然，遍於一切非一切。真如離妄恒寂靜，無生無滅普周遍；諸佛境界亦復然，體性平等不增減。譬如實際而非際，普在三世亦非普；導師境界亦如是，遍於三世皆無礙。法性無作無變易，猶如虛空本清淨；諸佛性淨亦如是，本性非性離有無。法性不在於言論，無說離說恒寂滅；十力境界性亦然，一切文辭莫能辯。了知諸法性寂滅，如鳥飛空無有迹，以本願力現色身，令見如來大神變。若有欲知佛境界，當淨其意如虛空，遠離妄想及諸取，令心所向皆無礙。是故佛子應善聽，我以少譬明佛境，十力功德不可量，為悟眾生今略說。導師所現於身業，語業心業諸境界，轉妙法輪般涅槃，一切善根我今說。譬如世界初安立，非一因緣而可成，無量方便諸因緣，成此三千大千界。如來出現亦如是，無量功德乃得成，剎塵心念尚可知，十力生因莫能測。譬如劫初雲澍雨，而起四種大風輪，眾生善根菩薩力，成此三千各安住。十力法雲亦如是，起智風輪清淨意，昔所迴向諸眾生，普導令成無上果。如有大雨名洪澍，無有處所能容受，唯除世界將成時，清淨虛空大風力。如來出現亦如是，普雨法雨充法界，一切劣意無能持，唯除清淨廣大心。譬如空中澍大雨，無所從來無所去，作者受者悉亦無，自然如是普充洽。十力法雨亦如是，無去無來無造作，本行為因菩薩力，一切大心咸聽受。譬如空雲澍大雨，一切無能數其滴，唯除三千自在王，具功德力悉明了。善逝法雨亦如是，一切眾生莫能測，唯除於世自在人，明見如觀掌中寶。譬如空雲澍大雨，能滅能起亦能斷，一切珍寶悉能成，三千所有皆分別。十力法雨亦如是，滅惑起善斷諸見，一切智寶皆使成，眾生心樂悉分別。譬如空中雨一味，隨其所雨各不同，豈彼雨性有分別，然隨物異法如是。如來法雨非一異，平等寂靜離分別，然隨所化種種殊，自然如是無邊相。譬如世界初成時，先成色界天宮殿，次及欲天次人處，乾闥婆宮最後成。如來出現亦如是，先起無邊菩薩行，次化樂寂諸緣覺，次聲聞眾後眾生。諸天初見蓮華瑞，知佛當出生歡喜；水緣風力起世間，宮殿山川悉成立。如來宿善大光明，巧別菩薩與其記；所有智輪體皆淨，各能開示諸佛法。譬如樹林依地有，地依於水得不壞，水輪依風風依空，而其虛空無所依。一切佛法依慈悲，慈悲復依方便立，方便依智智依慧，無礙慧身無所依。譬如世界既成立，一切眾生獲其利，地水所住及空居，二足四足皆蒙益。法王出現亦如是，一切眾生獲其利，若有見聞及親近，悉使滅除諸惑惱。如來出現法無邊，世間迷惑莫能知，為欲開悟諸含識，無譬諭中說其譬。「佛子！諸菩薩摩訶薩應云何見如來、應、正等覺身？「佛子！諸菩薩摩訶薩應於無量處見如來身。何以故？諸菩薩摩訶薩不應於一法、一事、一身、一國土、一眾生見於如來，應遍一切處見於如來。佛子！\n\n**（4）如来身业十相**——「是為如來身第十N相」十叠（虛空寬廣非色·日出閻浮提·先照菩薩大山·日月隨時·生盲不見日·月輪四奇特·大梵天王·醫王·海中摩尼寶·如意摩尼寶王）——身业以十喻显。\n\n> 譬如虛空遍至一切色、非色處，非至、非不至。何以故？虛空無身故。如來身亦如是，遍一切處，遍一切眾生，遍一切法，遍一切國土，非至、非不至。何以故？如來身無身故，為眾生故示現其身。佛子！是為如來身第一相，諸菩薩摩訶薩應如是見。「復次，佛子！譬如虛空寬廣非色，而能顯現一切諸色，而彼虛空無有分別亦無戲論。如來身亦復如是，以智光明普照明故，令一切眾生世、出世間諸善根業皆得成就，而如來身無有分別亦無戲論。何以故？從本已來，一切執著、一切戲論皆永斷故。佛子！是為如來身第二相，諸菩薩摩訶薩應如是見。「復次，佛子！譬如日出於閻浮提，無量眾生皆得饒益。所謂：破闇作明，變濕令燥，生長草木，成熟穀稼，廓徹虛空，開敷蓮華，行者見道，居者辦業。何以故？日輪普放無量光故。佛子！如來智日亦復如是，以無量事普益眾生。所謂：滅惡生善，破愚為智，大慈救護，大悲度脫；令其增長根、力、覺分；令生深信，捨離濁心；令得見聞，不壞因果；令得天眼，見歿生處；令心無礙，不壞善根；令智修明，開敷覺華；令其發心，成就本行。何以故？如來廣大智慧日身，放無量光普照耀故。佛子！是為如來身第三相，諸菩薩摩訶薩應如是見。「復次，佛子！譬如日出於閻浮提，先照一切須彌山等諸大山王，次照黑山，次照高原，然後普照一切大地。日不作念：『我先照此，後照於彼。』但以山地有高下故，照有先後。如來、應、正等覺亦復如是，成就無邊法界智輪，常放無礙智慧光明，先照菩薩摩訶薩等諸大山王，次照緣覺，次照聲聞，次照決定善根眾生，隨其心器示廣大智，然後普照一切眾生，乃至邪定亦皆普及，為作未來利益因緣令成熟故。而彼如來大智日光不作是念：『我當先照菩薩大行，乃至後照邪定眾生。』但放光明平等普照，無礙無障，無所分別。佛子！譬如日月隨時出現，大山、幽谷普照無私。如來智慧亦復如是，普照一切無有分別，隨諸眾生根欲不同，智慧光明種種有異。佛子！是為如來身第四相，諸菩薩摩訶薩應如是見。「復次，佛子！譬如日出，生盲眾生無眼根故，未曾得見。雖未曾見，然為日光之所饒益。何以故？因此得知晝夜時節，受用種種衣服、飲食，令身調適離眾患故。如來智日亦復如是，無信、無解、毀戒、毀見、邪命自活生盲之類無信眼故，不見諸佛智慧日輪。雖不見佛智慧日輪，亦為智日之所饒益。何以故？以佛威力，令彼眾生所有身苦及諸煩惱、未來苦因皆消滅故。佛子！如來有光明，名：積集一切功德；有光明，名：普照一切；有光明，名：清淨自在照；有光明，名：出大妙音；有光明，名：普解一切語言法令他歡喜；有光明，名：示現永斷一切疑自在境界；有光明，名：無住智自在普照；有光明，名：永斷一切戲論自在智；有光明，名：隨所應出妙音聲；有光明，名：出清淨自在音莊嚴國土成熟眾生。佛子！如來一一毛孔放如是等千種光明，五百光明普照下方，五百光明普照上方。種種剎中種種佛所諸菩薩眾，其菩薩等見此光明，一時皆得如來境界，十頭、十眼、十耳、十鼻、十舌、十身、十手、十足、十地、十智，皆悉清淨。彼諸菩薩先所成就諸處諸地，見彼光明轉更清淨，一切善根皆悉成熟，趣一切智；住二乘者，滅一切垢；其餘一分生盲眾生，身既快樂，心亦清淨，柔軟調伏，堪修念智；地獄、餓鬼、畜生諸趣所有眾生，皆得快樂，解脫眾苦，命終皆生天上、人間。佛子！彼諸眾生不覺不知，以何因緣、以何神力而來生此？彼生盲者作如是念：『我是梵天！我是梵化！』是時，如來住普自在三昧，出六十種妙音而告之言：『汝等非是梵天，亦非梵化，亦非帝釋護世所作，皆是如來威神之力。』彼諸眾生聞是語已，以佛神力皆知宿命，生大歡喜；心歡喜故，自然而出優曇華雲、香雲、音樂雲、衣雲、蓋雲、幢雲、幡雲、末香雲、寶雲、師子幢半月樓閣雲、歌詠讚歎雲、種種莊嚴雲，皆以尊重心供養如來。何以故？此諸眾生得淨眼故，如來與彼授阿耨多羅三藐三菩提記。佛子！如來智日如是利益生盲眾生，令得善根，具足成熟。佛子！是為如來身第五相，諸菩薩摩訶薩應如是見。「復次，佛子！譬如月輪有四奇特未曾有法。何等為四？一者，映蔽一切星宿光明；二者，隨逐於時示現虧盈；三者，於閻浮提澄淨水中影無不現；四者，一切見者皆對目前，而此月輪無有分別、無有戲論。佛子！如來身月亦復如是，有四奇特未曾有法。何等為四？所謂：映蔽一切聲聞、獨覺、學、無學眾；隨其所宜，示現壽命修短不同，而如來身無有增減；一切世界淨心眾生菩提器中，影無不現；一切眾生有瞻對者皆謂如來唯現我前，隨其心樂而為說法，隨其地位令得解脫，隨所應化令見佛身，而如來身無有分別、無有戲論，所作利益皆得究竟。佛子！是為如來身第六相，諸菩薩摩訶薩應如是見。「復次，佛子！譬如三千大千世界大梵天王，以少方便於大千世界普現其身，一切眾生皆見梵王現在己前，而此梵王亦不分身、無種種身。佛子！諸佛如來亦復如是，無有分別，無有戲論，亦不分身，無種種身，而隨一切眾生心樂示現其身，亦不作念現若干身。佛子！是為如來身第七相，諸菩薩摩訶薩應如是見。「復次，佛子！譬如醫王善知眾藥及諸呪論，閻浮提中諸所有藥用無不盡，復以宿世諸善根力、大明呪力，為方便故，眾生見者病無不愈。彼大醫王知命將終，作是念言：『我命終後，一切眾生無所依怙，我今宜應為現方便。』是時，醫王合藥塗身，明呪力持，令其終後身不分散、不萎不枯，威儀視聽與本無別，凡所𤻲治悉得除差。佛子！如來、應、正等覺無上醫王亦復如是，於無量百千億那由他劫，鍊治法藥已得成就，修學一切方便善巧大明呪力皆到彼岸，善能除滅一切眾生諸煩惱病及住壽命；經無量劫，其身清淨無有思慮、無有動用，一切佛事未嘗休息，眾生見者諸煩惱病悉得消滅。佛子！是為如來身第八相，諸菩薩摩訶薩應如是見。「復次，佛子！譬如大海有大摩尼寶，名：集一切光明毘盧遮那藏；若有眾生觸其光者，悉同其色；若有見者，眼得清淨。隨彼光明所照之處，雨摩尼寶，名為：安樂，令諸眾生離苦調適。佛子！諸如來身亦復如是，為大寶聚一切功德大智慧藏；若有眾生觸佛身寶智慧光者，同佛身色；若有見者，法眼清淨。隨彼光明所照之處，令諸眾生離貧窮苦，乃至具足佛菩提樂。佛子！如來法身無所分別亦無戲論，而能普為一切眾生作大佛事。佛子！是為如來身第九相，諸菩薩摩訶薩應如是見。「復次，佛子！譬如大海有大如意摩尼寶王，名：一切世間莊嚴藏，具足成就百萬功德，隨所住處，令諸眾生災患消除、所願滿足；然此如意摩尼寶王非少福眾生所能得見。如來身如意寶王亦復如是，名為：能令一切眾生皆悉歡喜，若有見身、聞名、讚德，悉令永離生死苦患；假使一切世界一切眾生，一時專心欲見如來，悉令得見，所願皆滿。佛子！佛身非是少福眾生所能得見，唯除如來自在神力所應調伏；若有眾生因見佛身便種善根乃至成熟，為成熟故，乃令得見如來身耳。佛子！是為如來身第十相，諸菩薩摩訶薩應如是見。以其心無量遍十方故，所行無礙如虛空故，普入法界故，住真實際故，無生無滅故，等住三世故，永離一切分別故，住盡後際誓願故，嚴淨一切世界故，莊嚴一一佛身故。」爾時，普賢菩薩摩訶薩欲重明此義而說頌言：「譬如虛空遍十方，若色非色有非有，三世眾生身國土，如是普在無邊際。諸佛真身亦如是，一切法界無不遍，不可得見不可取，為化眾生而現形。譬如虛空不可取，普使眾生造眾業，不念：『我今何所作，云何我作為誰作？』諸佛身業亦如是，普使群生修善法，如來未曾有分別：『我今於彼種種作。』譬如日出閻浮提，光明破闇悉無餘，山樹池蓮地眾物，種種品類皆蒙益。諸佛日出亦如是，生長人天眾善行，永除癡闇得智明，恒受尊榮一切樂。譬如日光出現時，先照山王次餘山，後照高原及大地，而日未始有分別。善逝光明亦如是，先照菩薩次緣覺，後照聲聞及眾生，而佛本來無動念。譬如生盲不見日，日光亦為作饒益，令知時節受飲食，永離眾患身安隱。無信眾生不見佛，而佛亦為興義利，聞名及以觸光明，因此乃至得菩提。譬如淨月在虛空，能蔽眾星示盈缺，一切水中皆現影，諸有觀瞻悉對前。如來淨月亦復然，能蔽餘乘示修短，普現天人淨心水，一切皆謂對其前。譬如梵王住自宮，普現三千諸梵處，一切人天咸得見，實不分身向於彼。諸佛現身亦如是，一切十方無不遍，其身無數不可稱，亦不分身不分別。如有醫王善方術，若有見者病皆愈，命雖已盡藥塗身，令其作務悉如初。最勝醫王亦如是，具足方便一切智，以昔妙行現佛身，眾生見者煩惱滅。譬如海中有寶王，普出無量諸光明，眾生觸者同其色，若有見者眼清淨。最勝寶王亦如是，觸其光者悉同色，若有得見五眼開，破諸塵闇住佛地。譬如如意摩尼寶，隨有所求皆滿足，少福眾生不能見，非是寶王有分別。善逝寶王亦如是，悉滿所求諸欲樂，無信眾生不見佛，非是善逝心棄捨。于闐國三藏實叉難陀奉制譯之二如來出現品第三十七之二「佛子！菩薩摩訶薩應云何知如來、應、正等覺音聲？「佛子！菩薩摩訶薩應知如來音聲遍至，普遍無量諸音聲故；應知如來音聲隨其心樂皆令歡喜，說法明了故；應知如來音聲隨其信解皆令歡喜，心得清涼故；應知如來音聲化不失時，所應聞者無不聞故；應知如來音聲無生滅，如呼響故；應知如來音聲無主，修習一切業所起故；應知如來音聲甚深，難可度量故；應知如來音聲無邪曲，法界所生故；應知如來音聲無斷絕，普入法界故；應知如來音聲無變易，至於究竟故。佛子！菩薩摩訶薩應知如來音聲，非量、非無量，非主、非無主，非示、非無示。何以故？佛子！\n\n**（5）如来音声十相**——「是為如來音聲第N相」十叠（世界將壞·呼響·諸天法鼓·自在采女·大梵梵音·眾水一味·阿那婆達多龍王·摩那斯龍王·海中大龍王·娑竭羅龍王）——语业以十龙十水喻。\n\n> 譬如世界將欲壞時，無主無作，法爾而出四種音聲。其四者何？一曰：『汝等當知初禪安樂，離諸欲惡，超過欲界。』眾生聞已，自然而得成就初禪，捨欲界身，生於梵天。二曰：『汝等當知二禪安樂，無覺無觀，超於梵天。』眾生聞已，自然而得成就二禪，捨梵天身，生光音天。三曰：『汝等當知三禪安樂，無有過失，超光音天。』眾生聞已，自然而得成就三禪，捨光音身，生遍淨天。四曰：『汝等當知四禪寂靜，超遍淨天。』眾生聞已，自然而得成就四禪，捨遍淨身，生廣果天。是為四。佛子！此諸音聲無主無作，但從眾生諸善業力之所出生。佛子！如來音聲亦復如是，無主無作，無有分別，非入非出，但從如來功德法力，出於四種廣大音聲。其四者何？一曰：『汝等當知一切諸行皆悉是苦，所謂：地獄苦、畜生苦、餓鬼苦、無福德苦、著我我所苦、作諸惡行苦。欲生人、天當種善根；生人、天中，離諸難處。』眾生聞已，捨離顛倒，修諸善行，離諸難處，生人、天中。二曰：『汝等當知一切諸行眾苦熾然，如熱鐵丸。諸行無常，是磨滅法；涅槃寂靜，無為安樂，遠離熾然，消諸熱惱。』眾生聞已，勤修善法，於聲聞乘得隨順音聲忍。三曰：『汝等當知聲聞乘者，隨他語解，智慧狹劣；更有上乘，名：獨覺乘，悟不由師，汝等應學。』樂勝道者聞此音已，捨聲聞道，修獨覺乘。四曰：『汝等當知過二乘位更有勝道，名為：大乘。菩薩所行，順六波羅蜜，不斷菩薩行，不捨菩提心，處無量生死而不疲厭，過於二乘，名為：大乘、第一乘、勝乘、最勝乘、上乘、無上乘、利益一切眾生乘。』若有眾生信解廣大，諸根猛利，宿種善根，為諸如來神力所加，有勝樂欲，希求佛果；聞此音已，發菩提心。佛子！如來音聲不從身出、不從心出，而能利益無量眾生。佛子！是為如來音聲第一相，諸菩薩摩訶薩應如是知。「復次，佛子！譬如呼響，因於山谷及音聲起，無有形狀，不可覩見，亦無分別，而能隨逐一切語言。如來音聲亦復如是，無有形狀，不可覩見，非有方所，非無方所；但隨眾生欲解緣出，其性究竟，無言無示，不可宣說。佛子！是為如來音聲第二相，諸菩薩摩訶薩應如是知。「復次，佛子！譬如諸天有大法鼓，名為：覺悟。若諸天子行放逸時，於虛空中出聲告言：『汝等當知一切欲樂皆悉無常，虛妄顛倒，須臾變壞，但誑愚夫令其戀著。汝莫放逸，若放逸者，墮諸惡趣，後悔無及。』放逸諸天聞此音已，生大憂怖，捨自宮中所有欲樂，詣天王所求法行道。佛子！彼天鼓音，無主無作，無起無滅，而能利益無量眾生。當知如來亦復如是，為欲覺悟放逸眾生，出於無量妙法音聲，所謂：無著聲、不放逸聲、無常聲、苦聲、無我聲、不淨聲、寂滅聲、涅槃聲、無有量自然智聲、不可壞菩薩行聲、至一切處如來無功用智地聲，以此音聲遍法界中而開悟之。無數眾生聞是音已，皆生歡喜，勤修善法，各於自乘而求出離，所謂：或修聲聞乘、或修獨覺乘、或習菩薩無上大乘。而如來音，不住方所，無有言說。佛子！是為如來音聲第三相，諸菩薩摩訶薩應如是知。「復次，佛子！譬如自在天王有天采女，名曰：善口，於其口中出一音聲，其聲則與百千種樂而共相應，一一樂中復有百千差別音聲。佛子！彼善口女從口一聲，出於如是無量音聲。當知如來亦復如是，於一音中出無量聲，隨諸眾生心樂差別，皆悉遍至，悉令得解。佛子！是為如來音聲第四相，諸菩薩摩訶薩應如是知。「復次，佛子！譬如大梵天王住於梵宮出梵音聲，一切梵眾靡不皆聞，而彼音聲不出眾外。諸梵天眾咸生是念：『大梵天王獨與我語。』如來妙音亦復如是，道場眾會靡不皆聞，而其音聲不出眾外。何以故？根未熟者不應聞故。其聞音者皆作是念：『如來世尊獨為我說。』佛子！如來音聲無出無住，而能成就一切事業。是為如來音聲第五相，諸菩薩摩訶薩應如是知。「復次，佛子！譬如眾水皆同一味，隨器異故水有差別，水無念慮亦無分別。如來言音亦復如是，唯是一味，謂解脫味，隨諸眾生心器異故無量差別，而無念慮亦無分別。佛子！是為如來音聲第六相，諸菩薩摩訶薩應如是知。「復次，佛子！譬如阿那婆達多龍王興大密雲，遍閻浮提普霔甘雨，百穀苗稼皆得生長，江河泉池一切盈滿；此大雨水不從龍王身心中出，而能種種饒益眾生。佛子！如來、應、正等覺亦復如是，興大悲雲遍十方界，普雨無上甘露法雨，令一切眾生皆生歡喜，增長善法，滿足諸乘。佛子！如來音聲不從外來、不從內出，而能饒益一切眾生。是為如來音聲第七相，諸菩薩摩訶薩應如是知。「復次，佛子！譬如摩那斯龍王將欲降雨，未便即降，先起大雲彌覆虛空凝停七日，待諸眾生作務究竟。何以故？彼大龍王有慈悲心，不欲惱亂諸眾生故。過七日已，降微細雨普潤大地。佛子！如來、應、正等覺亦復如是，將降法雨，未便即降，先興法雲成熟眾生，為欲令其心無驚怖；待其熟已，然後普降甘露法雨，演說甚深微妙善法，漸次令其滿足如來一切智智無上法味。佛子！是為如來音聲第八相，諸菩薩摩訶薩應如是知。「復次，佛子！譬如海中有大龍王，名：大莊嚴，於大海中降雨之時，或降十種莊嚴雨，或百、或千、或百千種莊嚴雨。佛子！水無分別，但以龍王不思議力令其莊嚴，乃至百千無量差別。如來、應、正等覺亦復如是，為諸眾生說法之時，或以十種差別音說，或百、或千、或以百千，或以八萬四千音聲說八萬四千行，乃至或以無量百千億那由他音聲各別說法，令其聞者皆生歡喜；如來音聲無所分別，但以諸佛於甚深法界圓滿清淨，能隨眾生根之所宜，出種種言音皆令歡喜。佛子！是為如來音聲第九相，諸菩薩摩訶薩應如是知。「復次，佛子！譬如娑竭羅龍王，欲現龍王大自在力，饒益眾生咸令歡喜，從四天下乃至他化自在天處，興大雲網周匝彌覆。其雲色相無量差別，或閻浮檀金光明色，或毘瑠璃光明色，或白銀光明色，或玻瓈光明色，或牟薩羅光明色，或碼碯光明色，或勝藏光明色，或赤真珠光明色，或無量香光明色，或無垢衣光明色，或清淨水光明色，或種種莊嚴具光明色，如是雲網周匝彌布。既彌布已，出種種色電光。所謂：閻浮檀金色雲出瑠璃色電光，瑠璃色雲出金色電光，銀色雲出玻瓈色電光，玻瓈色雲出銀色電光，牟薩羅色雲出碼碯色電光，碼碯色雲出牟薩羅色電光，勝藏寶色雲出赤真珠色電光，赤真珠色雲出勝藏寶色電光，無量香色雲出無垢衣色電光，無垢衣色雲出無量香色電光，清淨水色雲出種種莊嚴具色電光，種種莊嚴具色雲出清淨水色電光；乃至種種色雲出一色電光，一色雲出種種色電光。復於彼雲中出種種雷聲，隨眾生心皆令歡喜。所謂：或如天女歌詠音，或如諸天妓樂音，或如龍女歌詠音，或如乾闥婆女歌詠音，或如緊那羅女歌詠音，或如大地震動聲，或如海水波潮聲，或如獸王哮吼聲，或如好鳥鳴囀聲，及餘無量種種音聲。既震雷已，復起涼風，令諸眾生心生悅樂，然後乃降種種諸雨，利益安樂無量眾生。從他化天至於地上，於一切處所雨不同。所謂：於大海中雨清冷水，名：無斷絕；於他化自在天雨簫笛等種種樂音，名為：美妙；於化樂天雨大摩尼寶，名：放大光明；於兜率天雨大莊嚴具，名為：垂髻；於夜摩天雨大妙華，名：種種莊嚴具；於三十三天雨眾妙香，名為：悅意；於四天王天雨天寶衣，名為：覆蓋；於龍王宮雨赤真珠，名：涌出光明；於阿脩羅宮雨諸兵仗，名：降伏怨敵；於北欝單越雨種種華，名曰：開敷；餘三天下悉亦如是，然各隨其處，所雨不同。雖彼龍王其心平等無有彼此，但以眾生善根異故，雨有差別。佛子！如來、應、正等覺無上法王亦復如是，欲以正法教化眾生，先布身雲彌覆法界，隨其樂欲為現不同。所謂：或為眾生現生身雲，或為眾生現化身雲，或為眾生現力持身雲，或為眾生現色身雲，或為眾生現相好身雲，或為眾生現福德身雲，或為眾生現智慧身雲，或為眾生現諸力不可壞身雲，或為眾生現無畏身雲，或為眾生現法界身雲。佛子！如來以如是等無量身雲，普覆十方一切世界，隨諸眾生所樂，各別示現種種光明電光。所謂：或為眾生現光明電光，名：無所不至；或為眾生現光明電光，名：無邊光明；或為眾生現光明電光，名：入佛祕密法；或為眾生現光明電光，名：影現光明；或為眾生現光明電光，名：光明照耀；或為眾生現光明電光，名：入無盡陀羅尼門；或為眾生現光明電光，名：正念不亂；或為眾生現光明電光，名：究竟不壞；或為眾生現光明電光，名：順入諸趣；或為眾生現光明電光，名：滿一切願皆令歡喜。佛子！如來、應、正等覺現如是等無量光明電光已，復隨眾生心之所樂，出生無量三昧雷聲。所謂：善覺智三昧雷聲、明盛離垢海三昧雷聲、一切法自在三昧雷聲、金剛輪三昧雷聲、須彌山幢三昧雷聲、海印三昧雷聲、日燈三昧雷聲、無盡藏三昧雷聲、不壞解脫力三昧雷聲。佛子！如來身雲中出如是等無量差別三昧雷聲已，將降法雨，先現瑞相開悟眾生。所謂：從無障礙大慈悲心，現於如來大智風輪，名：能令一切眾生生不思議歡喜適悅。此相現已，一切菩薩及諸眾生，身之與心皆得清涼。然後從如來大法身雲、大慈悲雲、大不思議雲，雨不思議廣大法雨，令一切眾生身心清淨。所謂：為坐菩提場菩薩雨大法雨，名：法界無差別；為最後身菩薩雨大法雨，名：菩薩遊戲如來祕密教；為一生所繫菩薩雨大法雨，名：清淨普光明；為灌頂菩薩雨大法雨，名：如來莊嚴具所莊嚴；為得忍菩薩雨大法雨，名：功德寶智慧華開敷不斷菩薩大悲行；為住向行菩薩雨大法雨，名：入現前變化甚深門而行菩薩行無休息無疲厭；為初發心菩薩雨大法雨，名：出生如來大慈悲行救護眾生；為求獨覺乘眾生雨大法雨，名：深知緣起法遠離二邊得不壞解脫果；為求聲聞乘眾生雨大法雨，名：以大智慧劍斷一切煩惱怨；為積集善根決定、不決定眾生雨大法雨，名：能令成就種種法門生大歡喜。佛子！諸佛如來隨眾生心，雨如是等廣大法雨，充滿一切無邊世界。佛子！如來、應、正等覺其心平等，於法無吝，但以眾生根欲不同，所雨法雨示有差別。是為如來音聲第十相，諸菩薩摩訶薩應如是知。「復次，佛子！應知如來音聲有十種無量。何等為十？所謂：如虛空界無量，至一切處故；如法界無量，無所不遍故；如眾生界無量，令一切心喜故；如諸業無量，說其果報故；如煩惱無量，悉令除滅故；如眾生言音無量，隨解令聞故；如眾生欲解無量，普觀救度故；如三世無量，無有邊際故；如智慧無量，分別一切故；如佛境界無量，入佛法界故。佛子！如來、應、正等覺音聲成就如是等阿僧祇無量，諸菩薩摩訶薩應如是知。」爾時，普賢菩薩摩訶薩欲重明此義而說頌言：「三千世界將壞時，眾生福力聲告言，四禪寂靜無諸苦，令其聞已悉離欲。十力世尊亦如是，出妙音聲遍法界，為說諸行苦無常，令其永度生死海。譬如深山大谷中，隨有音聲皆響應，雖能隨逐他言語，而響畢竟無分別。十力言音亦復然，隨其根熟為示現，令其調伏生歡喜，不念我今能演說。如天有鼓名能覺，常於空中震法音，誡彼放逸諸天子，令其聞已得離著。十力法鼓亦如是，出於種種妙音聲，覺悟一切諸群生，令其悉證菩提果。自在天王有寶女，口中善奏諸音樂，一聲能出百千音，一一音中復百千。善逝音聲亦如是，一聲而出一切音，隨其性欲有差別，各令聞已斷煩惱。譬如梵王吐一音，能令梵眾皆歡喜，音唯及梵不出外，一一皆言己獨聞。十力梵王亦復然，演一言音充法界，唯霑眾會不遠出，以無信故未能受。譬如眾水同一性，八功德味無差別，因地在器各不同，是故令其種種異。一切智音亦如是，法性一味無分別，隨諸眾生行不同，故使聽聞種種異。譬如無熱大龍王，降雨普洽閻浮地，能令草樹皆生長，而不從身及心出。諸佛妙音亦如是，普雨法界悉充洽，能令生善滅諸惡，不從內外而得有。譬如摩那斯龍王，興雲七日未先雨，待諸眾生作務竟，然後始降成利益。十力演義亦如是，先化眾生使成熟，然後為說甚深法，令其聞者不驚怖。大莊嚴龍於海中，霔於十種莊嚴雨，或百或千百千種，水雖一味莊嚴別。究竟辯才亦如是，說十二十諸法門，或百或千至無量，不生心念有殊別。最勝龍王娑竭羅，興雲普覆四天下，於一切處雨各別，而彼龍心無二念。諸佛法王亦如是，大悲身雲遍十方，為諸修行雨各異，而於一切無分別。「佛子！諸菩薩摩訶薩應云何知如來、應、正等覺心？佛子！如來心、意、識俱不可得，但應以智無量故，知如來心。「\n\n**（6）音声十种无量**——「應知如來音聲有十種無量」＋深山大谷·梵王吐一音·眾水同一性·無熱龍王·摩那斯龍王五喻＋偈。\n\n> 譬如虛空為一切物所依，而虛空無所依。如來智慧亦復如是，為一切世間、出世間智所依，而如來智無所依。佛子！是為如來心第一相，諸菩薩摩訶薩應如是知。「復次，佛子！譬如法界常出一切聲聞、獨覺、菩薩解脫，而法界無增減。如來智慧亦復如是，恒出一切世間、出世間種種智慧，而如來智無增減。佛子！是為如來心第二相，諸菩薩摩訶薩應如是知。「復次，佛子！譬如大海，其水潛流四天下地及八十億諸小洲中，有穿鑿者無不得水，而彼大海不作分別：『我出於水。』佛智海水亦復如是，流入一切眾生心中，若諸眾生觀察境界、修習法門，則得智慧清淨明了，而如來智平等無二、無有分別，但隨眾生心行異故，所得智慧各各不同。佛子！是為如來心第三相，諸菩薩摩訶薩應如是知。「復次，佛子！譬如大海有四寶珠，具無量德，能生海內一切珍寶；若大海中無此寶珠，乃至一寶亦不可得。何等為四？一名：積集寶，二名：無盡藏，三名：遠離熾然，四名：具足莊嚴。佛子！此四寶珠，一切凡夫諸龍神等悉不得見。何以故？娑竭龍王以此寶珠端嚴方正置於宮中深密處故。佛子！如來、應、正等覺大智慧海亦復如是，於中有四大智寶珠，具足無量福智功德，由此能生一切眾生聲聞、獨覺、學、無學位，及諸菩薩智慧之寶。何等為四？所謂：無染著巧方便大智慧寶、善分別有為無為法大智慧寶、分別說無量法而不壞法性大智慧寶、知時非時未曾誤失大智慧寶。若諸如來大智海中無此四寶，有一眾生得入大乘，終無是處。此四智寶，薄福眾生所不能見。何以故？置於如來深密藏故。此四智寶，平均正直，端潔妙好，普能利益諸菩薩眾，令其悉得智慧光明。佛子！是為如來心第四相，諸菩薩摩訶薩應如是知。「復次，佛子！譬如大海，有四熾然光明大寶布在其底，性極猛熱，常能飲縮百川所注無量大水，是故大海無有增減。何等為四？一名：日藏，二名：離潤，三名：火焰光，四名：盡無餘。佛子！若大海中無此四寶，從四天下乃至有頂，其中所有悉被漂沒。佛子！此日藏大寶光明照觸，海水悉變為乳；離潤大寶光明照觸，其乳悉變為酪；火焰光大寶光明照觸，其酪悉變為酥；盡無餘大寶光明照觸，其酥變成醍醐；如火熾然，悉盡無餘。佛子！如來、應、正等覺大智慧海亦復如是，有四種大智慧寶，具足無量威德光明；此智寶光觸諸菩薩，乃至令得如來大智。何等為四？所謂：滅一切散善波浪大智慧寶、除一切法愛大智慧寶、慧光普照大智慧寶、與如來平等無邊無功用大智慧寶。佛子！諸菩薩修習一切助道法時，起無量散善波浪，一切世間天、人、阿脩羅所不能壞；如來以滅一切散善波浪大智慧寶光明觸彼菩薩，令捨一切散善波浪，持心一境，住於三昧；又以除一切法愛大智慧寶光明觸彼菩薩，令捨離三昧味著，起廣大神通；又以慧光普照大智慧寶光明觸彼菩薩，令捨所起廣大神通，住大明功用行；又以與如來平等無邊無功用大智慧寶光明觸彼菩薩，令捨所起大明功用行，乃至得如來平等地，息一切功用，令無有餘。佛子！若無如來此四智寶大光照觸，乃至有一菩薩得如來地，無有是處。佛子！是為如來心第五相，諸菩薩摩訶薩應如是知。「復次，佛子！如從水際，上至非想非非想天，其中所有大千國土，欲、色、無色眾生之處，莫不皆依虛空而起、虛空而住。何以故？虛空普遍故；雖彼虛空，普容三界而無分別。佛子！如來智慧亦復如是，若聲聞智，若獨覺智，若菩薩智，若有為行智，若無為行智，一切皆依如來智起、如來智住。何以故？如來智慧遍一切故；雖復普容無量智慧而無分別。佛子！是為如來心第六相，諸菩薩摩訶薩應如是知。「復次，佛子！如雪山頂有藥王樹，名：無盡根。彼藥樹根從十六萬八千由旬下盡金剛地水輪際生。彼藥王樹若生根時，令閻浮提一切樹根生；若生莖時，令閻浮提一切樹莖生；枝、葉、華、果悉皆如是。此藥王樹，根能生莖，莖能生根，根無有盡，名：無盡根。佛子！彼藥王樹於一切處皆令生長，唯於二處不能為作生長利益，所謂：地獄深坑及水輪中；然亦於彼初無厭捨。佛子！如來智慧大藥王樹亦復如是，以過去所發成就一切智慧善法、普覆一切諸眾生界、除滅一切諸惡道苦廣大悲願而為其根，於一切如來真實智慧種性中生堅固不動善巧方便以為其莖，遍法界智、諸波羅蜜以為其枝，禪定、解脫、諸大三昧以為其葉，總持、辯才、菩提分法以為其華，究竟無變諸佛解脫以為其果。佛子！如來智慧大藥王樹，何故得名為：無盡根？以究竟無休息故，不斷菩薩行故；菩薩行即如來性，如來性即菩薩行，是故得名為：無盡根。佛子！如來智慧大藥王樹，其根生時，令一切菩薩生不捨眾生大慈悲根；其莖生時，令一切菩薩增長堅固精進深心莖；其枝生時，令一切菩薩增長一切諸波羅蜜枝；其葉生時，令一切菩薩生長淨戒頭陀功德少欲知足葉；其華生時，令一切菩薩具諸善根相好莊嚴華；其果生時，令一切菩薩得無生忍乃至一切佛灌頂忍果。佛子！如來智慧大藥王樹唯於二處不能為作生長利益，所謂：二乘墮於無為廣大深阬及壞善根非器眾生溺大邪見貪愛之水；然亦於彼曾無厭捨。佛子！如來智慧無有增減，以根善安住，生無休息故。佛子！是為如來心第七相，諸菩薩摩訶薩應如是知。「復次，佛子！譬如三千大千世界劫火起時，焚燒一切草木叢林，乃至鐵圍、大鐵圍山皆悉熾然無有遺餘。「佛子！假使有人手執乾草投彼火中，於意云何，得不燒不？」答言：「不也。」「佛子！彼所投草容可不燒；如來智慧分別三世一切眾生、一切國土、一切劫數、一切諸法，無不知者；若言不知，無有是處。何以故？智慧平等悉明達故。佛子！是為如來心第八相，諸菩薩摩訶薩應如是知。「復次，佛子！譬如風災壞世界時，有大風起，名曰：散壞，能壞三千大千世界，鐵圍山等皆成碎末。復有大風，名為：能障，周匝三千大千世界障散壞風，不令得至餘方世界。佛子！若令無此能障大風，十方世界無不壞盡。如來、應、正等覺亦復如是，有大智風，名為：能滅，能滅一切諸大菩薩煩惱習氣；有大智風，名為：巧持，巧持其根未熟菩薩不令能滅大智風輪斷其一切煩惱習氣。佛子！若無如來巧持智風，無量菩薩皆墮聲聞、辟支佛地；由此智故，令諸菩薩超二乘地，安住如來究竟之位。佛子！是為如來心第九相，諸菩薩摩訶薩應如是知。「復次，佛子！如來智慧無處不至。何以故？無一眾生而不具有如來智慧，但以妄想顛倒執著而不證得；若離妄想，一切智、自然智、無礙智則得現前。佛子！譬如有大經卷，量等三千大千世界，書寫三千大千世界中事，一切皆盡。所謂：書寫大鐵圍山中事，量等大鐵圍山；書寫大地中事，量等大地；書寫中千世界中事，量等中千世界；書寫小千世界中事，量等小千世界；如是，若四天下，若大海，若須彌山，若地天宮殿，若欲界空居天宮殿，若色界宮殿，若無色界宮殿，一一書寫，其量悉等。此大經卷雖復量等大千世界，而全住在一微塵中；如一微塵，一切微塵皆亦如是。時，有一人智慧明達，具足成就清淨天眼，見此經卷在微塵內，於諸眾生無少利益，即作是念：『我當以精進力，破彼微塵，出此經卷，令得饒益一切眾生。』作是念已，即起方便，破彼微塵，出此大經，令諸眾生普得饒益。如於一塵，一切微塵應知悉然。佛子！如來智慧亦復如是，無量無礙，普能利益一切眾生，具足在於眾生身中；但諸凡愚妄想執著，不知不覺，不得利益。爾時，如來以無障礙清淨智眼，普觀法界一切眾生而作是言：『奇哉！奇哉！此諸眾生云何具有如來智慧，愚癡迷惑，不知不見？我當教以聖道，令其永離妄想執著，自於身中得見如來廣大智慧與佛無異。』即教彼眾生修習聖道，令離妄想；離妄想已，證得如來無量智慧，利益安樂一切眾生。佛子！是為如來心第十相，諸菩薩摩訶薩應如是知。「佛子！菩薩摩訶薩應以如是等無量無礙不可思議廣大相，知如來、應、正等覺心。」爾時，普賢菩薩摩訶薩欲重明此義而說頌言：「欲知諸佛心，當觀佛智慧，佛智無依處，如空無所依。眾生種種樂，及諸方便智，皆依佛智慧，佛智無依止。聲聞與獨覺，及諸佛解脫，皆依於法界，法界無增減。佛智亦如是，出生一切智，無增亦無減，無生亦無盡。如水潛流地，求之無不得，無念亦無盡，功力遍十方。佛智亦如是，普在眾生心，若有勤修行，疾得智光明。如龍有四珠，出生一切寶，置之深密處，凡人莫能見。佛四智亦然，出生一切智，餘人莫能見，唯除大菩薩。如海有四寶，能飲一切水，令海不流溢，亦復無增減。如來智亦爾，息浪除法愛，廣大無有邊，能生佛菩薩。下方至有頂，欲色無色界，一切依虛空，虛空不分別。聲聞與獨覺，菩薩眾智慧，皆依於佛智，佛智無分別。雪山有藥王，名為無盡根，能生一切樹，根莖葉華實。佛智亦如是，如來種中生，既得菩提已，復生菩薩行。如人把乾草，置之於劫燒，金剛猶洞然，此無不燒理。三世劫與剎，及其中眾生，彼草容不燒，此佛無不知。有風名散壞，能壞於大千；若無別風止，壞及無量界。大智風亦爾，滅諸菩薩惑；別有善巧風，令住如來地。如有大經卷，量等三千界，在於一塵內，一切塵悉然。有一聰慧人，淨眼悉明見，破塵出經卷，普饒益眾生。佛智亦如是，遍在眾生心，妄想之所纏，不覺亦不知。諸佛大慈悲，令其除妄想，如是乃出現，饒益諸菩薩。于闐國三藏實叉難陀奉制譯之三如來出現品第三十七之三「佛子！菩薩摩訶薩應云何知如來、應、正等覺境界？佛子！菩薩摩訶薩以無障無礙智慧，知一切世間境界是如來境界，知一切三世境界、一切剎境界、一切法境界、一切眾生境界、真如無差別境界、法界無障礙境界、實際無邊際境界、虛空無分量境界、無境界境界是如來境界。佛子！如一切世間境界無量，如來境界亦無量；如一切三世境界無量，如來境界亦無量；乃至，如無境界境界無量，如來境界亦無量；如無境界境界一切處無有，如來境界亦如是一切處無有。佛子！菩薩摩訶薩應知心境界是如來境界。如心境界無量無邊、無縛無脫，如來境界亦無量無邊、無縛無脫。何以故？以如是如是思惟分別，如是如是無量顯現故。佛子！如大龍王隨心降雨，其雨不從內出、不從外出。如來境界亦復如是，隨於如是思惟分別，則有如是無量顯現，於十方中悉無來處。佛子！如大海水，皆從龍王心力所起。諸佛如來一切智海亦復如是，皆從如來往昔大願之所生起。「佛子！一切智海無量無邊，不可思議，不可言說；然我今者略說譬諭，汝應諦聽。佛子！此閻浮提有二千五百河流入大海，西拘耶尼有五千河流入大海，東弗婆提有七千五百河流入大海，北欝單越有一萬河流入大海。「佛子！此四天下，如是二萬五千河相續不絕流入大海。於意云何，此水多不？」答言：「甚多。」「佛子！復有十光明龍王，雨大海中水倍過前；百光明龍王，雨大海中水復倍前；大莊嚴龍王、摩那斯龍王、雷震龍王、難陀跋難陀龍王、無量光明龍王、連霔不斷龍王、大勝龍王、大奮迅龍王，如是等八十億諸大龍王，各雨大海，皆悉展轉倍過於前；娑竭羅龍王太子，名：閻浮幢，雨大海中水復倍前。佛子！十光明龍王宮殿中水流入大海，復倍過前；百光明龍王宮殿中水流入大海，復倍過前；大莊嚴龍王、摩那斯龍王、雷震龍王、難陀跋難陀龍王、無量光明龍王、連霔不斷龍王、大勝龍王、大奮迅龍王，如是等八十億諸大龍王，宮殿各別，其中有水流入大海，皆悉展轉倍過於前；娑竭羅龍王太子閻浮幢宮殿中水流入大海，復倍過前。佛子！娑竭羅龍王連雨大海，水復倍前；其娑竭羅龍王宮殿中水涌出入海，復倍於前；其所出水紺瑠璃色，涌出有時，是故大海潮不失時。佛子！如是大海，其水無量，眾寶無量，眾生無量，所依大地亦復無量。「佛子！於汝意云何，彼大海為無量不？」答言：「實為無量，不可為諭。」「佛子！此大海無量於如來智海無量，百分不及一，千分不及一，乃至優波尼沙陀分不及其一；但隨眾生心為作譬諭，而佛境界非譬所及。佛子！菩薩摩訶薩應知如來智海無量，從初發心修一切菩薩行不斷故；應知寶聚無量，一切菩提分法、三寶種不斷故；應知所住眾生無量，一切學、無學、聲聞、獨覺所受用故；應知住地無量，從初歡喜地乃至究竟無障礙地諸菩薩所居故。佛子！菩薩摩訶薩為入無量智慧利益一切眾生故，於如來、應、正等覺境界應如是知。」爾時，普賢菩薩摩訶薩欲重明此義而說頌言：「如心境界無有量，諸佛境界亦復然；如心境界從意生，佛境如是應觀察。如龍不離於本處，以心威力霔大雨，雨水雖無來去處，隨龍心故悉充洽。十力牟尼亦如是，無所從來無所去，若有淨心則現身，量等法界入毛孔。如海珍奇無有量，眾生大地亦復然，水性一味等無別，於中生者各蒙利。如來智海亦如是，一切所有皆無量，有學無學住地人，悉在其中得饒益。「佛子！菩薩摩訶薩應云何知如來、應、正等覺行？佛子！菩薩摩訶薩應知無礙行是如來行，應知真如行是如來行。佛子！如真如，前際不生，後際不動，現在不起；如來行亦如是，不生、不動、不起。佛子！如法界，非量、非無量，無形故；如來行亦如是，非量、非無量，無形故。佛子！\n\n**（7）如来心业十相·大经卷喻**——「是為如來心第N相」十叠——末喻即全经著名之**大經卷喻**：「譬如有大經卷，量等三千大千世界……而全住在一微塵中」；一人以精进力破尘出卷，饶益众生——众生身中佛智，破迷乃出。\n\n> 譬如鳥飛虛空，經於百年，已經過處、未經過處皆不可量。何以故？虛空界無邊際故。如來行亦如是，假使有人經百千億那由他劫分別演說，已說、未說皆不可量。何以故？如來行無邊際故。佛子！如來、應、正等覺住無礙行，無有住處，而能普為一切眾生示現所行，令其見已，出過一切諸障礙道。佛子！譬如金翅鳥王，飛行虛空，迴翔不去，以清淨眼觀察海內諸龍宮殿，奮勇猛力，以左右翅鼓揚海水悉令兩闢，知龍男女命將盡者而搏取之。如來、應、正等覺金翅鳥王亦復如是，住無礙行，以淨佛眼觀察法界諸宮殿中一切眾生，若曾種善根已成熟者，如來奮勇猛十力，以止觀兩翅鼓揚生死大愛水海，使其兩闢而撮取之，置佛法中，令斷一切妄想戲論，安住如來無分別無礙行。佛子！譬如日月，獨無等侶，周行虛空，利益眾生，不作是念：『我從何來，而至何所。』諸佛如來亦復如是，性本寂滅，無有分別，示現遊行一切法界，為欲饒益諸眾生故，作諸佛事無有休息，不生如是戲論分別：『我從彼來，而向彼去。』佛子！菩薩摩訶薩應以如是等無量方便、無量性相，知見如來、應、正等覺所行之行。」爾時，普賢菩薩欲重明此義而說頌言：「譬如真如不生滅，無有方所無能見；大饒益者行如是，出過三世不可量。法界非界非非界，非是有量非無量；大功德者行亦然，非量無量無身故。如鳥飛行億千歲，前後虛空等無別；眾劫演說如來行，已說未說不可量。金翅在空觀大海，闢水搏取龍男女；十力能拔善根人，令出有海除眾惑。譬如日月遊虛空，照臨一切不分別；世尊周行於法界，教化眾生無動念。「佛子！諸菩薩摩訶薩應云何知如來、應、正等覺成正覺？佛子！菩薩摩訶薩應知如來成正覺，於一切義無所觀察，於法平等無所疑惑，無二無相，無行無止，無量無際，遠離二邊，住於中道，出過一切文字言說，知一切眾生心念所行、根性欲樂、煩惱染習；舉要言之，於一念中悉知三世一切諸法。佛子！譬如大海普能印現四天下中一切眾生色身形像，是故共說以為大海；諸佛菩提亦復如是，普現一切眾生心念、根性樂欲而無所現，是故說名諸佛菩提。佛子！諸佛菩提，一切文字所不能宣，一切音聲所不能及，一切言語所不能說，但隨所應方便開示。佛子！如來、應、正等覺成正覺時，得一切眾生量等身，得一切法量等身，得一切剎量等身，得一切三世量等身，得一切佛量等身，得一切語言量等身，得真如量等身，得法界量等身，得虛空界量等身，得無礙界量等身，得一切願量等身，得一切行量等身，得寂滅涅槃界量等身。佛子！如所得身，言語及心亦復如是，得如是等無量無數清淨三輪。佛子！如來成正覺時，於其身中普見一切眾生成正覺，乃至普見一切眾生入涅槃，皆同一性，所謂：無性。無何等性？所謂：無相性、無盡性、無生性、無滅性、無我性、無非我性、無眾生性、無非眾生性、無菩提性、無法界性、無虛空性，亦復無有成正覺性。知一切法皆無性故，得一切智，大悲相續，救度眾生。佛子！譬如虛空，一切世界若成若壞，常無增減。何以故？虛空無生故。諸佛菩提亦復如是，若成正覺、不成正覺，亦無增減。何以故？菩提無相、無非相，無一、無種種故。佛子！假使有人能化作恒河沙等心，一一心復化作恒河沙等佛，皆無色、無形、無相，如是盡恒河沙等劫無有休息。佛子！於汝意云何？彼人化心，化作如來，凡有幾何？」如來性起妙德菩薩言：「如我解於仁所說義，化與不化等無有別，云何問言凡有幾何？」普賢菩薩言：「善哉善哉！佛子！如汝所說，設一切眾生，於一念中悉成正覺，與不成正覺等無有異。何以故？菩提無相故；若無有相，則無增無減。佛子！菩薩摩訶薩應如是知成等正覺同於菩提一相無相。如來成正覺時，以一相方便入善覺智三昧；入已，於一成正覺廣大身，現一切眾生數等身住於身中。如一成正覺廣大身，一切成正覺廣大身悉亦如是。佛子！如來有如是等無量成正覺門，是故應知如來所現身無有量；以無量故，說如來身為無量界、等眾生界。佛子！菩薩摩訶薩應知如來身一毛孔中，有一切眾生數等諸佛身。何以故？如來成正覺身究竟無生滅故。如一毛孔遍法界，一切毛孔悉亦如是，當知無有少許處空無佛身。何以故？如來成正覺，無處不至故；隨其所能，隨其勢力，於道場菩提樹下師子座上，以種種身成等正覺。佛子！菩薩摩訶薩應知自心念念常有佛成正覺。何以故？諸佛如來不離此心成正覺故。如自心，一切眾生心亦復如是，悉有如來成等正覺，廣大周遍，無處不有，不離不斷，無有休息，入不思議方便法門。佛子！菩薩摩訶薩應如是知如來成正覺。」爾時，普賢菩薩摩訶薩欲重明此義而說頌言：「正覺了知一切法，無二離二悉平等，自性清淨如虛空，我與非我不分別。如海印現眾生身，以此說其為大海；菩提普印諸心行，是故說名為正覺。譬如世界有成敗，而於虛空不增減；一切諸佛出世間，菩提一相恒無相。如人化心化作佛，化與不化性無異；一切眾生成菩提，成與不成無增減。佛有三昧名善覺，菩提樹下入此定，放眾生等無量光，開悟群品如蓮敷。如三世劫剎眾生，所有心念及根欲，如是數等身皆現，是故正覺名無量。「佛子！菩薩摩訶薩應云何知如來、應、正等覺轉法輪？佛子！菩薩摩訶薩應如是知如來以心自在力無起無轉而轉法輪，知一切法恒無起故；以三種轉斷所應斷而轉法輪，知一切法離邊見故；離欲際、非際而轉法輪，入一切法虛空際故；無有言說而轉法輪，知一切法不可說故；究竟寂滅而轉法輪，知一切法涅槃性故；以一切文字、一切言語而轉法輪，如來音聲無處不至故；知聲如響而轉法輪，了於諸法真實性故；於一音中出一切音而轉法輪，畢竟無主故；無遺無盡而轉法輪，內外無著故。佛子！譬如一切文字語言，盡未來劫說不可盡；佛轉法輪亦復如是，一切文字安立顯示，無有休息，無有窮盡。佛子！如來法輪悉入一切語言文字而無所住。譬如書字，普入一切事、一切語、一切算數、一切世間出世間處而無所住；如來音聲亦復如是，普入一切處、一切眾生、一切法、一切業、一切報中而無所住。一切眾生種種語言，皆悉不離如來法輪。何以故？言音實相即法輪故。佛子！菩薩摩訶薩於如來轉法輪應如是知「復次，佛子！菩薩摩訶薩欲知如來所轉法輪，應知如來法輪所出生處。何等為如來法輪所出生處？佛子！如來隨一切眾生心行欲樂無量差別，出若干音聲而轉法輪。佛子！如來、應、正等覺有三昧，名：究竟無礙無畏，入此三昧已，於成正覺一一身、一一口，各出一切眾生數等言音，一一音中眾音具足，各各差別而轉法輪，令一切眾生皆生歡喜。能如是知轉法輪者，當知此人則為隨順一切佛法；不如是知，則非隨順。佛子！諸菩薩摩訶薩應如是知佛轉法輪，普入無量眾生界故。」爾時，普賢菩薩摩訶薩欲重明此義而說頌言：「如來法輪無所轉，三世無起亦無得，\n\n**（8）性起境界·文字无尽**——鸟飞虚空·金翅鸟王·日月无侣·真如不生灭·大海印现——性起境界之自在；末以**文字无尽喻**（一切文字语言尽未来劫……書字普入一切事）收摄教海。\n\n> 譬如文字無盡時，十力法輪亦如是。如字普入而無至，正覺法輪亦復然，入諸言音無所入，能令眾生悉歡喜。佛有三昧名究竟，入此定已乃說法，一切眾生無有邊，普出其音令悟解。一一音中復更演，無量言音各差別，於世自在無分別，隨其欲樂普使聞。文字不從內外出，亦不失壞無積聚，而為眾生轉法輪，如是自在甚奇特。「佛子！菩薩摩訶薩應云何知如來、應、正等覺般涅槃？佛子！菩薩摩訶薩欲知如來大涅槃者，當須了知根本自性。如真如涅槃，如來涅槃亦如是；如實際涅槃，如來涅槃亦如是；如法界涅槃，如來涅槃亦如是；如虛空涅槃，如來涅槃亦如是；如法性涅槃，如來涅槃亦如是；如離欲際涅槃，如來涅槃亦如是；如無相際涅槃，如來涅槃亦如是；如我性際涅槃，如來涅槃亦如是；如一切法性際涅槃，如來涅槃亦如是；如真如際涅槃，如來涅槃亦如是。何以故？涅槃無生無出故；若法無生無出，則無有滅。佛子！如來不為菩薩說諸如來究竟涅槃，亦不為彼示現其事。何以故？為欲令見一切如來常住其前，於一念中見過去、未來一切諸佛色相圓滿皆如現在，亦不起二、不二想。何以故？菩薩摩訶薩永離一切諸想著故。佛子！諸佛如來為令眾生生欣樂故，出現於世；欲令眾生生戀慕故，示現涅槃；而實如來無有出世，亦無涅槃。何以故？如來常住清淨法界，隨眾生心示現涅槃。佛子！譬如日出，普照世間，於一切淨水器中影無不現，普遍眾處而無來往，或一器破便不現影。佛子！於汝意云何，彼影不現為日咎不？」答言：「不也。但由器壞，非日有咎。」「佛子！如來智日亦復如是，普現法界無前無後，一切眾生淨心器中佛無不現，心器常淨常見佛身，若心濁器破則不得見。佛子！若有眾生應以涅槃而得度者，如來則為示現涅槃，而實如來無生、無歿、無有滅度。佛子！譬如火大，於一切世間能為火事，或時一處其火息滅。於意云何，豈一切世間火皆滅耶？」答言：「不也。」「佛子！如來、應、正等覺亦復如是，於一切世界施作佛事，或於一世界能事已畢示入涅槃，豈一切世界諸佛如來悉皆滅度？佛子！菩薩摩訶薩應如是知如來、應、正等覺大般涅槃。「復次，佛子！譬如幻師善明幻術，以幻術力，於三千大千世界一切國土、城邑、聚落示現幻身，以幻力持經劫而住；然於餘處，幻事已訖，隱身不現。佛子！於汝意云何，彼大幻師豈於一處隱身不現，便一切處皆隱滅耶？」答言：「不也。」「佛子！如來、應、正等覺亦復如是，善知無量智慧方便種種幻術，於一切法界普現其身，持令常住盡未來際；或於一處，隨眾生心，所作事訖，示現涅槃。豈以一處示入涅槃，便謂一切悉皆滅度？佛子！菩薩摩訶薩應如是知如來、應、正等覺大般涅槃。「復次，佛子！如來、應、正等覺示涅槃時，入不動三昧；入此三昧已，於一一身各放無量百千億那由他大光明，一一光明各出阿僧祇蓮華，一一蓮華各有不可說妙寶華蘂，一一華蘂有師子座，一一座上皆有如來結跏趺坐，其佛身數正與一切眾生數等，皆具上妙功德莊嚴，從本願力之所生起。若有眾生善根熟者，見佛身已，則皆受化。然彼佛身，盡未來際究竟安住，隨宜化度一切眾生未曾失時。佛子！如來身者，無有方處，非實非虛，但以諸佛本誓願力，眾生堪度則便出現。菩薩摩訶薩應如是知如來、應、正等覺大般涅槃。佛子！如來住於無量無礙究竟法界、虛空界，真如法性無生無滅及以實際，為諸眾生隨時示現；本願持故，無有休息，不捨一切眾生、一切剎、一切法。」爾時，普賢菩薩摩訶薩欲重明此義而說頌言：「如日舒光照法界，器壞水漏影隨滅；最勝智日亦如是，眾生無信見涅槃。如火世間作火事，於一城邑或時息；人中最勝遍法界，化事訖處示終盡。幻師現身一切剎，能事畢處則便謝；如來化訖亦復然，於餘國土常見佛。佛有三昧名不動，化眾生訖入此定，一念身放無量光，光出蓮華華有佛。佛身無數等法界，有福眾生所能見，如是無數一一身，壽命莊嚴皆具足。如無生性佛出興，如無滅性佛涅槃，言辭譬諭悉皆斷，一切義成無與等。「佛子！菩薩摩訶薩應云何知於如來、應、正等覺見聞親近所種善根？佛子！菩薩摩訶薩應知於如來所見聞親近所種善根皆悉不虛，出生無盡覺慧故，離於一切障難故，決定至於究竟故，無有虛誑故，一切願滿故，不盡有為行故，隨順無為智故，生諸佛智故，盡未來際故，成一切種勝行故，到無功用智地故。佛子！譬如丈夫，食少金剛，終竟不消，要穿其身，出在於外。何以故？金剛不與肉身雜穢而同止故。於如來所種少善根亦復如是，要穿一切有為諸行煩惱身過，到於無為究竟智處。何以故？此少善根不與有為諸行煩惱而共住故。佛子！假使乾草積同須彌，投火於中如芥子許，必皆燒盡。何以故？火能燒故。於如來所種少善根亦復如是，必能燒盡一切煩惱，究竟得於無餘涅槃。何以故？此少善根性究竟故。佛子！譬如雪山有藥王樹，名曰：善見。若有見者，眼得清淨；若有聞者，耳得清淨；若有嗅者，鼻得清淨；若有嘗者，舌得清淨；若有觸者，身得清淨；若有眾生取彼地土，亦能為作除病利益。佛子！如來、應、正等覺無上藥王亦復如是，能作一切饒益眾生。若有得見如來色身，眼得清淨；若有得聞如來名號，耳得清淨；若有得嗅如來戒香，鼻得清淨；若有得嘗如來法味，舌得清淨，具廣長舌，解語言法；若有得觸如來光者，身得清淨，究竟獲得無上法身；若於如來生憶念者，則得念佛三昧清淨；若有眾生供養如來所經土地及塔廟者，亦具善根，滅除一切諸煩惱患，得賢聖樂。佛子！我今告汝，設有眾生見聞於佛，業障纏覆不生信樂，亦種善根無空過者，乃至究竟入於涅槃。佛子！菩薩摩訶薩應如是知於如來所見聞親近所種善根，悉離一切諸不善法，具足善法。「佛子！如來以一切譬諭說種種事，無有譬諭能說此法。何以故？心智路絕，不思議故。諸佛菩薩但隨眾生心，令其歡喜，為說譬諭，非是究竟。佛子！此法門名為：如來祕密之處，名：一切世間所不能知，名：入如來印，名：開大智門，名：示現如來種性，名：成就一切菩薩，名：一切世間所不能壞，名：一向隨順如來境界，名：能淨一切諸眾生界，名：演說如來根本實性不思議究竟法。佛子！此法門，如來不為餘眾生說，唯為趣向大乘菩薩說，唯為乘不思議乘菩薩說；此法門不入一切餘眾生手，唯除諸菩薩摩訶薩。佛子！\n\n**（9）结劝·七喻收束**——文字無盡時·日出普照·火大·幻師·丈夫食金剛·雪山藥王樹·轉輪聖王七寶——七喻收束全品；终以「此為超世第一財……汝等當持莫放逸」结劝受持。\n\n> 譬如轉輪聖王所有七寶，因此寶故顯示輪王，此寶不入餘眾生手，唯除第一夫人所生太子，具足成就聖王相者。若轉輪王無此太子具眾德者，王命終後，此諸寶等於七日中悉皆散滅。佛子！此經珍寶亦復如是，不入一切餘眾生手，唯除如來法王真子，生如來家，種如來相諸善根者。佛子！若無此等佛之真子，如是法門不久散滅。何以故？一切二乘不聞此經，何況受持、讀誦、書寫、分別解說！唯諸菩薩乃能如是。是故，菩薩摩訶薩聞此法門應大歡喜，以尊重心恭敬頂受。何以故？菩薩摩訶薩信樂此經，疾得阿耨多羅三藐三菩提故。佛子！設有菩薩於無量百千億那由他劫行六波羅蜜，修習種種菩提分法。若未聞此如來不思議大威德法門，或時聞已不信、不解、不順、不入，不得名為真實菩薩，以不能生如來家故。若得聞此如來無量不可思議無障無礙智慧法門，聞已信解，隨順悟入，當知此人生如來家，隨順一切如來境界，具足一切諸菩薩法，安住一切種智境界，遠離一切諸世間法，出生一切如來所行，通達一切菩薩法性，於佛自在心無疑惑，住無師法，深入如來無礙境界。佛子！菩薩摩訶薩聞此法已，則能以平等智知無量法，則能以正直心離諸分別，則能以勝欲樂現見諸佛，則能以作意力入平等虛空界，則能以自在念行無邊法界，則能以智慧力具一切功德，則能以自然智離一切世間垢，則能以菩提心入一切十方網，則能以大觀察知三世諸佛同一體性，則能以善根迴向智普入如是法，不入而入；不於一法而有攀緣，恒以一法觀一切法。佛子！菩薩摩訶薩成就如是功德，少作功力，得無師自然智。」爾時，普賢菩薩欲重明此義而說頌言：「見聞供養諸如來，所得功德不可量，於有為中終不盡，要滅煩惱離眾苦。譬人吞服少金剛，終竟不消要當出；供養十力諸功德，滅惑必至金剛智。如乾草積等須彌，投芥子火悉燒盡；供養諸佛少功德，必斷煩惱至涅槃。雪山有藥名善見，見聞嗅觸消眾疾；若有見聞於十力，得勝功德到佛智。」爾時，佛神力故，法如是故，十方各有十不可說百千億那由他世界六種震動，所謂：東涌西沒，西涌東沒，南涌北沒，北涌南沒，邊涌中沒，中涌邊沒。十八相動，所謂：動、遍動、等遍動，起、遍起、等遍起，涌、遍涌、等遍涌，震、遍震、等遍震，吼、遍吼、等遍吼，擊、遍擊、等遍擊。雨出過諸天一切華雲、一切蓋雲、幢雲、幡雲、香雲、鬘雲、塗香雲、莊嚴具雲、大光明摩尼寶雲、諸菩薩讚歎雲、不可說菩薩各差別身雲，雨成正覺雲、嚴淨不思議世界雲，雨如來言語音聲雲，充滿無邊法界。如此四天下，如來神力如是示現，令諸菩薩皆大歡喜；周遍十方一切世界，悉亦如是。是時，十方各過八十不可說百千億那由他佛剎微塵數世界外，各有八十不可說百千億那由他佛剎微塵數如來，同名：普賢，皆現其前而作是言：「善哉！佛子！乃能承佛威力，隨順法性，演說如來出現不思議法。佛子！我等十方八十不可說百千億那由他佛剎微塵數同名諸佛皆說此法；如我所說，十方世界一切諸佛亦如是說。佛子！今此會中，十萬佛剎微塵數菩薩摩訶薩，得一切菩薩神通三昧；我等皆與授記，一生當得阿耨多羅三藐三菩提。佛剎微塵數眾生，發阿耨多羅三藐三菩提心；我等亦與授記，於當來世經不可說佛剎微塵數劫，皆得成佛，同號：佛殊勝境界。我等為令未來諸菩薩聞此法故，皆共護持。如此四天下所度眾生，十方百千億那由他無數無量，乃至不可說不可說法界虛空等一切世界中所度眾生，皆亦如是。」爾時，十方諸佛威神力故，毘盧遮那本願力故，法如是故，善根力故，如來起智不越念故，如來應緣不失時故，隨時覺悟諸菩薩故，往昔所作無失壞故，令得普賢廣大行故，顯現一切智自在故，十方各過十不可說百千億那由他佛剎微塵數世界外，各有十不可說百千億那由他佛剎微塵數菩薩來詣於此，充滿十方一切法界，示現菩薩廣大莊嚴，放大光明網，震動一切十方世界，壞散一切諸魔宮殿，消滅一切諸惡道苦，顯現一切如來威德，歌詠讚歎如來無量差別功德法，普雨一切種種雨，示現無量差別身，領受無量諸佛法，以佛神力各作是言：「善哉！佛子！乃能說此如來不可壞法。佛子！我等一切皆名：普賢，各從普光明世界普幢自在如來所而來於此，彼一切處亦說是法，如是文句，如是義理，如是宣說，如是決定，皆同於此，不增不減。我等皆以佛神力故，得如來法故，來詣此處為汝作證。如我來此，十方等虛空遍法界一切世界諸四天下亦復如是。」爾時，普賢菩薩承佛神力，觀察一切菩薩大眾，欲重明如來出現廣大威德，如來正法不可沮壞，無量善根皆悉不空，諸佛出世必具一切最勝之法，善能觀察諸眾生心，隨應說法未曾失時，生諸菩薩無量法光，一切諸佛自在莊嚴，一切如來一身無異，從本大行之所生起，而說頌言：「一切如來諸所作，世間譬諭無能及，為令眾生得悟解，非諭為諭而顯示。如是微密甚深法，百千萬劫難可聞；精進智慧調伏者，乃得聞此祕奧義。若聞此法生欣慶，彼曾供養無量佛，為佛加持所攝受，人天讚歎常供養。此為超世第一財，此能救度諸群品，此能出生清淨道，汝等當持莫放逸。」于闐國三藏實叉難陀奉制譯\n\n## 三、旁参与前接\n\n**承前**：品34〈普賢行品〉明称果之因（普贤圆因）——本品即「如因之果」：因圆则性起，果用自然流出，故全品处处以「自然」「如是」立言，非造作相。\n\n**启后**：品36〈離世間品〉——性起果德既彰，普贤即转说**离世间之行**（二千行门）：果为行体，行为果用；第七会果分至本品而极，第八会转入普贤行海。\n\n## 四、义理要点\n\n**【要点提炼】**\n\n1. **出现＝性起**：品题「出現」与光名、菩萨名（性起妙德）三重互文——如来之出现非诞生义而是**法尔现起**义；「非以一緣，非以一事……以十無量百千阿僧祇事而得成就」（§2.2 程序全引）总标全品。\n2. **三十喻三分业用**：身十相（§2.4·「是為如來身第」实测 10 叠）·音声十相（§2.5·实测 10 叠）·心十相（§2.7·实测 10 叠）——身口意三业各以十喻显，喻体取象：身取天象（日月虚空）、音声取水声（龙王降雨·众水一味）、心取宝藏（海珠·大经卷）。\n3. **大经卷喻**（§2.7）：「譬如有大經卷，量等三千大千世界……而全住在一微塵中；如一微塵，一切微塵皆亦如是」——众生身中具足佛智经卷，**一尘一卷，卷卷等大千**；「有一人智慧明達……即作是念：我當以精進力，破彼微塵，出此經卷」——佛之出世即破尘出卷之人。\n4. **文字无尽喻**（§2.8）：「譬如一切文字語言，盡未來劫……書字普入一切事、一切眾生」——教法文字与法界同其无尽，收束全经「以言遣言」之教体。\n5. **结劝七喻**（§2.9）：幻师喻显业用不实而宛然、药王树喻显见不见功、金刚食喻显闻法永不失——终以「汝等當持莫放逸」劝持。\n\n**【阐释】**（〔本文判断〕）本品是全经**义理总汇**之品：前此诸品之宗旨在此聚齐——世界成就喻重演〈世界成就品〉，音声一味喻重演〈如来音声〉义，大经卷喻总摄「心佛众生三无差别」。其修辞以**喻为骨**：三十喻＋世界组＋七喻，凡四十余喻，喻喻下按「是為如來X第N相」——**以喻证体，以数证喻**。性起二字尤须把住：如来出现非「发生」而是「本然而现」——正因此，本品处处言「如」：如虛空、如日月、如大海——**一切「如」字皆性起之注脚**。\n\n**【启发】**读此品宜先自问：我于何处见如来出现？经答：见世界之成即见（世界成喻组）；闻众声一味即闻（音声喻）；知一尘有卷即知（心喻）。大经卷喻可作日课：「我當以精進力，破彼微塵」——破尘之功不在他处，即当下迷执之破；破一分尘，出一分卷。文字无尽喻则教人善自持教：**文字入一切事，则读经即在日用**。\n\n**【对照】**：六十华严〈性起品〉即本品对应（新旧译品题对照：「性起」六十／「出現」八十〔本文判断：此为两译体系之标志性异题，待深化批专节〕）；四十华严无对应品〔实测 T0293 唯入法界〕。澄观《华严经疏》于此品用墨最重之一（§5.1）。\n\n## 五、注疏选要\n\n### 5.1 澄观（`T1735`）\n\n> 如來出現品第三十七（已下入第五十經）初來意者。前品明稱果之因。此品辨如因之果。體雖平等不壞二相。先因後果義次第故。……二釋名者。如來是有法之人。即三身十身之通稱。出現是依人之法。果用化用之總名。……若依法身如來者。即諸法如義如理。常現名為出現。\n\n（《疏》卷释文·「前品称果之因，此品如因之果」——平等因果一双之判；「如理常現名為出現」即品题解。）\n\n### 5.2 诸家（深化批补引·存目）\n\n## 六、文本对读\n\n### 6.1 六十华严（`T0278`〈性起品〉）\n\n新旧译对应关系：「性起」与「出現」同一梵语原义之两译〔本文判断〕——逐段对勘待深化批〔未竟〕。\n\n### 6.3 藏译（Toh 44 对应章）\n\n德格本相应章待逐字勘定〔待核〕。\n\n## 七、数据层（L1 实测）\n\n| 指标 | 值 |\n|---|---|\n| CJK（净） | **23,160** |\n| `<p>` / `<lg>` | 139 / 13 |\n| 页跨度 | 51 `<pb>`（卷50–52） |\n| 身业十相 | **10 叠** |\n| 音声十相 | **10 叠**（另音声十种无量一组） |\n| 心业十相 | **10 叠**（末叠＝大经卷喻） |\n| 全品喻数 | 40 余喻（世界组＋三十相＋十无量五喻＋结劝七喻） |\n| 说主 | 普賢菩薩（承性起妙德菩萨问） |\n\n## 八、附录·存疑与未竟\n\n- 九段切分为主题归纳（段界按喻组标记），段间无经文遗漏（首尾相接覆盖全品）〔已核〕。\n- 六十〈性起品〉逐段对勘未作〔未竟·待深化批〕；藏译逐字对勘未作〔未竟〕。\n- 三十喻喻体总表（喻体→所喻义→部位）待深化批制表〔未竟〕。\n\n## 九、台账（成篇自陈）\n\n**本批补订（L.272·2026-10-31·第七会批六·压轴）**：①提取层：品37段程序实测（23,160 CJK·139 p＋13 lg·跨三卷）；②成篇：§〇–§九**全文注入**——九段主题流全引（序分白毫＋世界成喻＋身/音声/心三十相＋性起境界＋结劝·0 手抄）；③澄观来意窗实引；④大经卷喻原文校核。深化批预登记：60/40 对勘＋三十喻总表＋诸家扩展。\n\n> **成篇识**：白毫一光，性起全彰；三业三十喻，一尘一大千。第七会果分至此圆满。全文已注入，凡所未竟有台账。\n\n---\n\n> **EN corresponding · Chapter summary.** A white-hair curl beams the light \"Manifestation of the Tathāgata\" into the crown of the Bodhisattva Nature-Arising Marvel-Virtue; Samantabhadra then unfolds the Buddha's manifestation through forty-odd parables — world-formation clouds, ten marks of body, ten of voice, ten of mind (crowning in the Great Scroll parable: a scroll the size of a trichiliocosm wholly contained in one dust-mote, awaiting the resolute hand that breaks the mote and releases the text for all beings) — sealing all with the charge: hold it, and do not grow careless.\n", "data_source": "", "data_pool": "practice", "back": {"tab": "gap", "view": "avatamsaka-studies", "label": "文献页·华严经学"}, "updated_at": "2026-10-31"};

// ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);

function _applyArticleENMode(){
  var full=document.getElementById('article-full');
  var btn=document.getElementById('article-en-toggle');

}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}

</script>
</body>
</html>
