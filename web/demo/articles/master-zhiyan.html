<script>
var ARTICLE = {"id": "master-zhiyan", "file": "articles/master-zhiyan.html", "title": "智俨", "title_sub": "华严祖师 · 华严二祖 · 至相尊者", "icon": "🧑", "version": "", "meta": "", "doc": "docs/祖师人物/华严宗二祖智俨_综合深度研究.md", "doc_md": "# 华严宗二祖智俨：承上启下的枢纽——生平、著作、思想与文化史地位综合深度研究\n\n> 研究说明：本文延续《圭峰宗密综合深度研究》《华严宗初祖杜顺综合深度研究》二文的方法论与结构，依据可回溯、可核验的资料展开，包括《华严经传记》《续高僧传》等原典（CBETA 可查原文）、中、日、韩、英多语种学术论著，对史料分歧或学界争议之处以\"存疑\"标出。本文以\"承上启下\"为全文枢纽性论题——即以尽可能严谨的文献考据，逐一厘清智俨\"向上继承\"了什么（杜顺、地论摄论学统及更早渊源）、\"向下传承\"了什么（法藏、义湘及门人），尤其对智俨与法藏之间的师承细节，力求做到有据可循、层层坐实，而非泛泛而论。\n\n---\n\n## 一、全球多语言背景下的学术研究成果\n\n### 1.1 中文学界\n\n中文学界对智俨的专题研究，以华严专宗学院系统内的学者用力最勤。李治华（华梵大学佛教学系专任助理教授）的〈智俨生平及其著作考察〉〈智俨思想来源论考〉二文，是当代中文学界对智俨生平史料最细密的个案考据，其对法藏所撰《智俨传》中\"神僧抚顶\"一段记载的史源辨析，以及对吉美罗（Robert Gimello）批判性解读的转介，构成本文第三章重要的文献基础。李治华在其博士论文《智俨思想研究——以初期华严宗哲学的创立过程为主轴》中更直接提出，\"华严宗教义的基本规模是由智俨所创建的\"，将智俨生平划分为九期（灵梦诞生、杜顺携归、精解《摄论》、广学经论、地论听研、启悟立宗、中年潜沉、晚年大振、往生华藏），又归纳为\"多师广学期—立宗潜沉期—大振宗风期\"三大段。\n\n中国社会科学院学者魏道儒的研究尤具分量，且直接触及本文最关切的\"智俨与法藏关系\"这一核心议题。魏道儒在其〈从《华严十玄门》解析佛学中国化〉一文中，透过精细的文本比对，指出智俨本人的\"十玄门\"理论存在一个从《华严经搜玄记》（27岁所撰，其中仅称\"十门玄\"，\"名称不固定，带有初创时期的浓重痕迹\"，且\"仅仅列举了十玄门的名目，没有展开论述\"）到独立成篇的《华严一乘十玄门》（\"是对智俨本人定型思想的概括\"）的内部发展过程；他并特别指出，现存《华严一乘十玄门》一书，标题之下同时载有\"大唐终南太一山至相寺释智俨撰\"与\"承杜顺和尚说\"二行文字，据此判定\"智俨是在吸收杜顺某些思想的基础上提出自己最具创新性质的学说\"。魏道儒另在《中国华严宗通史》中提出一项颇具分量、也颇具争议的论断：智俨\"在吸收慧光以来华严学发展成果基础上，融会当时各派学说，基本完成了华严宗学说体系的整体框架\"，而法藏\"是从注解晋译《华严》到注解唐译《华严》的过渡人物\"——这一评价将智俨置于高于法藏的理论地位，与教内外通行的\"法藏集大成\"叙事形成了鲜明张力，也构成了近年学界一场值得关注的具体争论（详见1.4节）。\n\n卓小雯〈论智俨之判教思想〉细致梳理了《搜玄记》《五十要问答》《孔目章》三部著作中判教思想的两次转变（详见第五章5.1节）。释法音〈智俨的缘起思想——以《搜玄记》对「现前地」的诠释为中心〉以六十华严〈十地品〉第六现前地的注文为核心，重建了智俨融合赖耶缘起与如来藏缘起的结构。觉深法师〈华严经学研究初期人物考〉与〈华严二祖智俨法师〉提供了教内立场的系统综述。\n\n### 1.2 日文学界\n\n日文学界对智俨的研究，木村清孝（1940— ，东京大学名誉教授）是当之无愧的核心人物，其学术生涯本身即是一部\"以智俨为起点\"的个人思想史。据其自述及北京大学人文社会科学研究院讲座纪要，木村清孝在东京大学硕士阶段即选择智俨思想研究作为起步课题，原因有三：\"一、学界缺少对智俨的系统研究；二、对华严宗思想起点感到好奇；三、资料虽少却可准确把握智俨思想。\"1975年，他以论文《初期华严思想之研究》获东京大学文学博士学位——这是国际学界公认研究早期华严（含杜顺、智俨）最重要的日文专著之一，与英语学界吉美罗的博士论文（详见1.3节）大致同期而各自独立完成，构成了二十世纪七十年代国际早期华严研究\"东西并进\"的一段学术史佳话。\n\n木村清孝的研究方法论极具启发性：他\"遵循的是思想史方法，即将人物思想放在思想史、社会史等大背景下来考察其起承转合与逻辑演变\"，并发现\"智俨思想的延展性很强，包括了多重层次且具有较强的立体性——正如其与印度、中国、韩国思想之间的联系那样\"。据此，他其后撰写的一系列论文\"从华严出发，上溯到印度，下延至日韩，在思想关联中展开华严学研究\"——这一研究纲领本身，正是\"承上启下\"这一论题最精确的学术表述。\n\n日本学界另有一重要层次——近代批判佛教学的\"祖统论争\"。境野黄洋考证认为华严学统最初由智正、智现、贤首三代相传，杜顺初祖说是后人建构；铃木宗忠在《原始華厳哲学の研究》（1934）中依据凤潭、觉洲的说法进一步主张华严应起源自智俨；宇井伯寿持相对温和的\"智正—智俨—贤首\"三代说；常盘大定则坚持传统杜顺初祖说，并提出著名的\"学与行之分\"调和框架（华严\"学\"一线来自智正，\"行\"一线来自杜顺）。无论各派立场如何，**智俨作为义学传授链上不可绕开的枢纽**，是论争各方共同承认的事实。\n\n石井公成对智俨有一组专题论文：〈智儼の性起説〉（《フィロソフィア》67号，1979）、〈智俨の如来藏思想〉（《印度學佛教學研究》28卷2号，1980）、〈《一乘十玄門》の諸問題〉（《仏教学》12号，1981，处理十玄门的作者归属与文本问题），其代表作《華厳思想の研究》（春秋社，1996）第二章设\"智俨的华严教学\"专章。吉津宜英《華厳一乗思想の研究》（大東出版社，1991）于页31–38处理《一乘十玄门》的真伪与归属问题，其著名论断——**就智俨本人的思想形成而言，慧光才是重要人物**——已成为重新理解智俨师承结构的通行视角。\n\n### 1.3 英语学界\n\n英语学界对智俨的奠基性研究，即前文《华严宗初祖杜顺综合深度研究》第一章1.3节已介绍的吉美罗（Robert M. Gimello）1976年哥伦比亚大学博士论文《智俨（602—668）与华严佛教的奠基》（*Chih-Yen and the Foundations of Hua-yen Buddhism*）——这是英语世界第一部、也是迄今仍最具分量的智俨专题研究，与木村清孝的日文专著几乎同时完成，构成了国际早期华严研究史上一段饶富意味的\"平行发现\"。\n\n吉美罗对智俨史料的处理，始终贯穿着一种审慎的史料批判意识。除对\"杜顺认领智俨\"一段\"神僧抚顶\"记载的\"幻见式相遇\"（visionary encounter）解读外，他对法藏《智俨传》中另一则关键记载——即智俨二十七岁前后因\"异僧\"点化而悟入\"六相\"义理的故事——同样持保留态度，倾向于将其理解为法藏运用中国圣传文学惯例、对智俨思想史上某次具体的阅读—领悟经验所作的神圣化重述。吉美罗并对智俨二十七岁至五十八岁之间长达三十年的生平记载空白，提出了一项具启发性的推测：智俨在此期间可能经历了一段\"模仿杜顺，漫游于沉思暝想\"之中——**这一推测若能成立，则意味着智俨的成熟思想，很可能正是在这一段近乎隐修的漫长岁月中逐步酝酿而成，而非仅仅是青年时期\"读慧光疏而有悟\"这一单一事件的直接产物**。\n\nThomas Cleary（柯睿思）1983年的英译选集《Entry into the Inconceivable》（夏威夷大学出版社）收录了《华严一乘十玄门》的英译，使智俨的核心文本进入英语读者的阅读范围。斯坦福哲学百科全书（SEP）\"Huayan Buddhism\"条目关于智俨十玄门的论述即以Gimello论文为基本参考，并做了一个精细观察：智俨十玄门所揭示的诸面向，与杜顺《法界观门》第三观\"周遍含容\"中的十项命题\"并不完全对应\"（do not quite correspond），但后来的华严祖师把智俨的十玄理解为对杜顺诸命题的展开——这实际上以英文重述了\"杜顺—智俨\"关系中\"追溯性诠释\"的性质。\n\n### 1.4 学术争议与存疑问题小结\n\n综合上述多语种研究，本文认为以下几项争议最值得读者留意：\n\n1. **智俨与法藏孰为华严宗理论体系的真正奠定者？**魏道儒明确主张智俨\"基本完成了华严宗学说体系的整体框架\"，法藏仅是\"过渡人物\"；但另有学者（刊于青岛大学学报（社会科学版）2023年第1期\"东方论坛\"栏目，具体作者姓名笔者未能确认）明确表示\"对此笔者不能苟同\"，主张智俨本人也仍属于\"法顺（杜顺）到法藏的过渡人物\"，理由是\"华严构架早在法顺便已提出\"，智俨的贡献主要在于\"从判五教而归一乘实践教义，展开了'法界缘起'的涵义\"。这场发生在当代中文学界内部、观点针锋相对的具体争论，本文将在第四章4.8节做进一步的呈现与讨论，不预设立场，仅如实转述双方论据。\n2. 智俨二十七岁至五十八岁间近三十年的生平记载几近空白，吉美罗\"沉潜时期\"的推测虽具启发性，但终究是推测而非确证，本文将在第三章3.5节专门处理这一\"存疑\"环节。\n3. 智俨\"十玄门\"理论本身的名目、次第，据灵隐寺\"常识\"专栏及相关工具书记载，\"曾先后发生过变化\"，从其自身早期《搜玄记》的雏形，到独立成篇的《华严一乘十玄门》（即所谓\"古十玄\"），再到法藏《探玄记》最终修订的\"新十玄\"，构成一个至少三阶段的、有明确文本证据支撑的演变序列——这一点虽有扎实文献依据，但其中每一阶段修订的具体思想动机，学界的解释仍有一定推测成分，本文将审慎呈现。\n\n---\n\n## 二、佛门内部、跨宗派与跨宗教视角\n\n### 2.1 华严宗内部的定位：\"华严尊者\"与\"至相大师\"\n\n智俨在华严宗内部传统中被尊为\"二祖\"，其两个最通行的尊号——\"华严尊者\"与\"至相大师\"（或\"云华尊者\"）——本身即分别对应着他一生中最重要的两处驻锡地（至相寺、云华寺）与他毕生专注的经典（《华严经》），不同于杜顺\"帝心尊者\"这类偏重神异感应色彩的封号，也不同于法藏\"贤首国师\"这类源自帝王敕封的荣誉头衔——**智俨的尊号完全生长自其自身的学问事业与弘法道场，这一细节本身即从命名法的角度，印证了他在华严宗内部叙事中\"学问僧\"（而非\"神异僧\"或\"国师\"）的独特定位。**\n\n### 2.2 与地论、摄论学派的深度交融：不止于时代背景，而是直接师承\n\n如本文姊妹篇《华严宗初祖杜顺综合深度研究》第三章所详述，地论宗（南北二道）、摄论宗与杜顺本人的关系，现有史料只能证明是一种\"共享区域宗教文化生态\"意义上的间接关联；但**智俨与这两大学派的关系，则远为直接、具体、且有明确的师承文献可考**——他先后师从静琳（565—640）、智正（559—639，地论学统兼融摄论学风的继承者）、法常（567—645，同属地论、摄论学统）三位学者，向智正\"从事六相义，释《华严经》、授《摄大乘论》\"，即智俨不仅从智正处学习华严经义与\"六相\"理论，还直接向其学习了摄论宗的根本论典《摄大乘论》本身。**这意味着，智俨绝非杜顺那种\"游离于既有义学传统之外\"的孤立修行者，而是一位深深浸润于隋唐之际关中地论、摄论学统核心圈层、并直接承接了其理论资源的正统义学传人。**\n\n### 2.3 与新译唯识（玄奘译场）的时代交集\n\n智俨圆寂于总章元年（668），此前二十余年，恰是玄奘（602—664，与智俨同龄！二人生年完全相同）自天竺求法归来（645年抵长安）、开设译场、系统翻译传播\"新译\"瑜伽行唯识学说最为鼎盛的时期。智俨本人的著述中未见与玄奘译场发生直接互动或论辩的确切记载，但他晚年最重要的入室弟子法藏，却有过一段颇具深意的经历——法藏曾参与玄奘译经事业，其后因见识相异而退出译场，方才转投智俨门下（详见第四章4.4节）。这一发生在智俨生命最后十年间、且与其未来传法者切身相关的历史事件，清晰地勾勒出智俨晚年讲学、收徒所处的具体思想史氛围：一方面是玄奘、窥基所代表的、强调\"五种性\"（含\"一分无性\"）的\"新译\"唯识学说声势正盛；另一方面则是智俨所代表的、上承地论南道\"阿赖耶识即如来藏自性清净心\"这一更具普遍成佛可能性色彩的\"旧学\"传统——法藏本人日后离开译场转投智俨，某种意义上正是这一时代性思想张力在具体个人抉择层面的一次缩影。\n\n### 2.4 与天台判教传统的关系\n\n智俨\"别教一乘\"\"同教一乘\"这一核心判教装置，置于中国佛教判教史的长河中考察，其渊源可追溯至更早的\"南三北七\"诸家判教，其中北魏地论宗领袖慧光（光统律师）\"承佛陀扇多之说，把一代教法大别为顿、渐、圆三教，并以华严为圆\"，是\"北七家\"中率先\"开出圆教\"的关键人物。天台智顗大师稍后在《法华玄义》中\"纵横难破南三北七十家之说\"，其\"化法四教\"（藏、通、别、圆）\"基于北地诸师之说而发展\"，可以说是\"集南三北七之大成\"者。**智俨的判教思考，正处于这一脉络的延长线上——他既承接了地论宗\"华严为圆教\"的既有判摄传统，又与几乎同时代、声势更为浩大的天台判教体系构成一种若隐若现的对照与竞争关系；法藏日后正式确立的\"五教十宗\"体系，据学者考订，其基本框架\"依天台之判教，为自宗判教之基本，重加增补修造而成\"——这意味着，华严判教体系从智俨的雏形到法藏的定型，始终与天台判教传统保持着密切的参照、吸收乃至竞争关系，绝非闭门造车、独立发展的产物。**\n\n### 2.5 普贤信仰与文殊信仰的宗派分野\n\n魏道儒的研究揭示了一个颇为细腻、却极具宗派史意义的观察点：\"从杜顺到法藏\"，华严一系存在一种清晰可辨的\"重普贤、轻文殊\"倾向——智俨在《华严一乘十玄门》中的相关论述，\"为重普贤的僧众提供了理论依据\"，这与地论师系统、以及以五台山地区为中心的信仰群体\"尊崇文殊\"的取向形成了明显对照。**这一信仰取向上的分野，与杜顺本人\"劝人依经修普贤行愿\"的记载完全吻合，说明这并非杜顺个人偶然的修行偏好，而是经智俨之手被理论化、正当化，进而成为杜顺—智俨—法藏这一支系区别于同期其他华严信仰群体的一项具有鲜明识别度的宗派特征。**\n\n### 2.6 现代跨文化视角：木村清孝的\"东亚佛教\"研究框架\n\n如1.2节所述，木村清孝对智俨的研究，最终发展为一个贯通印度、中国、朝鲜半岛、日本的东亚佛教整体研究框架。**这一现代学术视野，恰与智俨本人身后门下弟子的实际地理分布形成了跨越一千三百余年的奇妙呼应——智俨门下最重要的两位入室弟子，一位（法藏）留在中国本土发展为华严宗的\"实际创立人\"，另一位（义湘）则返回新罗，开创\"海东华严宗\"（详见第四章4.6节）——智俨本人虽终生未离开关中一隅，其思想的实际传播半径，却在他身后不久便自然地跨越了国界，形成了一个横跨东亚的传承网络。**\n\n### 2.7 与儒道二家关系：一个相对沉寂的领域\n\n与杜顺（因\"破除淫祀\"的公开行动而与民间信仰、儒家伦理教化产生实际交涉）和宗密（因撰《原人论》正面回应韩愈排佛论而与儒、道二家展开系统性义理交锋）不同，**智俨现存文献与生平记载中，并未见到任何与儒家或道家思想直接交涉、辩难的具体材料。**智俨一生的活动范围主要局限于终南山至相寺、长安云华寺一类相对封闭的义学讲席环境，其现存著作全部是纯粹的佛教经论注疏；就时代背景而言，中晚唐韩愈、李翱等人声势浩大的排佛论述，其兴起时间明显晚于智俨所处的初唐前期（智俨卒于668年，韩愈生于768年，二人相距整整一个世纪）。**\"与儒道二家鲜有交涉\"这一点本身，也是智俨作为一位专注于佛教内部教理体系建构的\"学问僧\"之历史形象的又一佐证。**\n\n---\n\n## 三、智俨向上继承：杜顺、地论摄论学统与更早渊源\n\n本章系统梳理智俨\"向上\"承接的各条思想脉络。与杜顺本人师承几乎不可考的情形形成鲜明对照，智俨的求学历程有着远为丰富、具体、且相互交织的多重师承线索，这正是他最终能够完成杜顺所未竟的教理体系化工作的根本原因所在。\n\n### 3.1 杜顺：认领、委托训诲与\"承杜顺和尚说\"的文本印记\n\n智俨与杜顺的初遇——隋大业九年（613），十二岁的智俨被杜顺\"抚顶认领\"、其后转交高足达法师\"晓夜诵持\"训诲——其具体过程及吉美罗对此记载\"幻见式相遇\"的批判性解读，本文姊妹篇《杜顺综合深度研究》第三章3.6节已有详尽考订。本节聚焦一项此前未及深入展开、但对理解\"智俨向上继承杜顺\"这一命题极具实证价值的文献学证据：**魏道儒指出，现存《华严一乘十玄门》一书标题之下，同时载有\"大唐终南太一山至相寺释智俨撰\"与\"承杜顺和尚说\"二行文字。**这两行署名文字，实际上构成了智俨与杜顺之间思想传承关系最直接、最不容置疑的第一手文献证据——它不是后世传记作者的转述或追认，而是智俨本人在其最具个人创新性质的理论著作扉页上，主动、明确地标注的师承来源。**魏道儒据此判断：\"智俨是在吸收杜顺某些思想的基础上提出自己最具创新性质的学说……《华严一乘十玄门》……是对杜顺一系华严教理提纲挈领的总结。\"**\n\n同时代人道宣（596–667）的《续高僧传》卷二十五《法顺传》末尾附带的一段话，是与《华严经传记》相互独立的第二重同时代证据：\n\n> \"弟子智俨，名贯至相。幼年奉敬，雅遵余度。而神用清越，振绩京皋。《华严》、《摄论》，寻常讲说。恒至龛所，化导乡川，故斯尘不绝矣。\"\n\n这段文字至少确认了四件事：(1) 智俨确实是杜顺弟子；(2) 他常年在至相寺一带活动并有京师声誉；(3) 他平素讲说的经典正是《华严经》与《摄大乘论》；(4) 杜顺圆寂后智俨常至其塔龛处\"化导乡川\"。【考】传记对杜顺与智俨之间是否有直接的义学传授只字未载，仅见\"晓夜诵持\"式的诵习训诲——这一点对评估\"杜顺初祖说\"的义学内涵至关重要。传统谱系中的\"杜顺—智俨\"环节，在\"信仰与实践传承\"的意义上是真实的，在\"义学传授\"的意义上则缺乏证据支持；常盘大定\"学与行之分\"框架至今仍是最有解释力的调和方案。\n\n杜顺留给智俨的，除却具体的理论种子（三重观法的十门结构经由智俨手中被明确命名、扩展为\"十玄\"，详见第四章4.1、4.2节）外，还有一种更难以文本化、却同样清晰可辨的精神气质传承——即2.5节所论\"重普贤、轻文殊\"的信仰取向。\n\n### 3.2 至相寺的学问脉络：智正、静琳、法常与地论摄论学统\n\n智俨真正意义上系统性的义学训练，主要透过三位与杜顺并行、却分属地论、摄论学统的老师完成：\n\n**智正（559—639）**：据地方史料记载，其本人的师承线索是——北周武帝灭佛期间，静蔼禅师隐居终南山，其后普安禅师投奔而来，\"引三十余僧相携修行\"；隋代佛教恢复后，静渊禅师借势筑至相寺；智正其后至此，\"拜静渊僧为师\"，遂长期驻锡至相寺。智俨\"闻智正在至相寺讲《华严经》，便前往听讲一年多\"，然\"心有疑难，有待解决\"——这段记载明确显示，智俨对智正的初期学习并非全盘接受，而是在听讲过程中始终保持着自己的疑问与思考，这正是促使他其后\"遍览群籍，寻求《华严》章疏\"、最终发现慧光文本（详见3.3节）的直接动因。其后智俨仍\"求学于智正法师，从事六相义，释《华严经》、授《摄大乘论》\"。**值得特别指出：地方史料明确表示，杜顺本人是否曾在至相寺驻锡，\"难考\"，但智俨确曾长期住此并随智正修行——这提示我们，\"至相寺\"作为智俨最重要的求学、乃至日后弘法道场，其地理与制度渊源，主要系于智正一系的地论学统，而非直接承自杜顺。**\n\n**静琳（565—640）**：智俨\"从学静琳，获得《华严经》，于是决意学《华严》\"——即智俨正式确立\"以华严为终身志业\"这一决定性抉择的直接契机，是从静琳处获得《华严经》文本本身，而非直接来自杜顺。\n\n**法常（567—645）**：智俨\"亲近法常法师，听讲说《摄大乘论》\"——法常是智俨接触摄论学说的又一位老师，与智正共同构成智俨摄论学修养的两大来源。据台湾学者研究，智正、静琳、法常三人\"都是地论学统、摄论学统的人物。从智俨现存作品看，他的思想深受这两学统的真心说法影响\"。\n\n**综合观之，智俨在正式确立自身独立的华严思想体系之前，已经透过智正、静琳、法常三位老师，系统性地接受了地论、摄论两大学统的义学训练——这一训练的广度与深度，远超杜顺本人所能提供的范围，构成了智俨得以完成教理体系化工作的直接知识基础。**智俨正是在这个地论南道学术共同体中被培养出来的——南道一系自慧光以下皆《华严》《十地论》并重，静渊、智正、法琳常住至相寺形成学术共同体。\n\n### 3.3 决定性的阅读：慧光《华严经疏》与\"别教一乘无尽缘起\"的悟入\n\n如3.2节所述，智俨在智正处听讲《华严经》一年多后仍\"心有疑难\"，遂\"以《华严经》为中心，遍览群籍，寻求《华严》章疏\"，在此过程中，他发现了北魏名僧慧光（468–537，地论宗南道开山，《十地经论》译主勒那摩提的传法者）的《华严经疏》，\"读后，对其中别教一乘无尽缘起义感到兴趣，并有所悟解\"。**这是智俨思想史上第一次、也是最关键的一次决定性突破——他自己教理体系中最核心的术语\"别教一乘\"，其最初的理论触媒，明确可考地系于阅读慧光文本这一具体事件，而非任何禅观体验或神异感应。**\n\n据《华严经传记·慧光传》并载慧光\"有疏四卷，立顿渐圆三教，以判群典。以华严为圆教，自其始也\"——智俨后来的判教骨架于此已具雏形。吉津宜英因此断言：就智俨的思想形成而言，慧光才是真正的重要人物——华严\"别教一乘\"的判教框架与\"无尽缘起\"的核心观念，都是隔着智正直接从慧光那里继承来的。\"别教一乘说\"连同\"无尽缘起说\"\"六相义\"，实际上已是慧光本人思想体系中业已成型的组成部分（据《华严经传记》慧光传及相关学术考订），经法上、道凭等弟子传承而下——**智俨读慧光疏而\"有所悟解\"的，很可能并非凭空契会一个全新概念，而是透过阅读慧光原著，真切领会、进而在自己身上重新激活了一套已有百年渊源、却因地论南道传承相对隐晦而未能广泛弘传的既有理论体系。**\n\n### 3.4 \"异僧点化\"与净影慧远\"六相\"说：一则祛魅式重读的案例\n\n围绕智俨\"六相\"义理的最终证悟，教内另流传一则\"异僧点化\"的神异故事——大意为智俨于\"六相\"义理反复思索而不得其解，一日忽有一位来历不明的僧人向其指点迷津，智俨依此顿悟。**魏道儒对此提出了一项极具方法论示范意义的批判性解读：\"从净影慧远（523—592）有'六相'体义之说，推测这个'异僧'指点迷津的神话，大约反映出智俨受到了慧远的影响\"**——即魏道儒倾向于认为，这则\"异僧\"故事，实际上是对智俨透过阅读净影慧远相关著述而获得思想启发这一更为平实的历史过程，所作的一次神圣化、故事化的重新讲述。\n\n结合3.3节所述，\"六相义\"这一理论构件的完整传承链条，实际上还可以进一步上溯：慧光本人的思想体系中已包含\"六相义\"的基本构想，经其门下弟子传承而及于其再传弟子净影慧远、并由慧远在《大乘义章》中作了更为系统的阐发，智俨很可能正是透过阅读慧远这一更晚近、更贴近其自身时代的文本而受到直接启发——\"慧光→净影慧远→智俨\"这样一条历经三代、跨越约一个世纪的具体文本传承线索，远比单纯\"异僧点化\"的神异叙事更能说明智俨\"六相\"思想的真实来源。\n\n### 3.5 三十年的沉潜：629年至659年间的空白与推测\n\n智俨二十七岁（约629年）撰成《华严经搜玄记》，系统阐释六相义，这是他现存最早的重要著作；然而，据现有史料记载，他直到显庆四年（659年，年五十八岁）方才在云华寺\"讲说《华严经》，宗风大振\"。**这意味着，在智俨二十七岁至五十八岁之间，长达约三十年的时间跨度里，现存史料几乎未曾留下任何具体记载——这是智俨生平中一段极为漫长、却近乎空白的\"沉默期\"。**\n\n吉美罗对此提出了一项颇具启发性的推测：智俨在此期间，可能\"模仿杜顺，漫游于沉思暝想\"之中，过着一种近乎隐修的生活。**若这一推测能够成立（本文对此持审慎的存疑态度），则它将为理解智俨思想的成熟过程提供一个颇具说服力的解释框架：**智俨二十七岁时的《搜玄记》虽已系统阐释六相义，但据魏道儒的文本比对，该书对\"十玄门\"仅仅是\"列举名目，没有展开论述\"，\"带有初创时期的浓重痕迹\"；而三十年后，当他晚年正式招收法藏、义湘等入室弟子时，展现在世人面前的，已经是一套经过长期沉潜、反复咀嚼、最终定型为独立成篇的《华严一乘十玄门》这一成熟形态的理论体系。换言之，智俨思想的\"定型\"，很可能并非发生于青年时期\"读慧光疏而有悟\"的戏剧性\"顿悟\"时刻，而是经历了此后长达三十年、史料几近空白、却极可能是持续研习、反复锤炼的漫长\"渐修\"过程——**这一\"顿悟\"起点与\"渐修\"历程并存的生命轨迹，若吉美罗的推测大致可信，本身即构成了对华严—禅传统日后反复申说的\"顿悟渐修\"命题一个极富说服力的早期生命史印证，尽管这一印证目前仍主要建立在合理推测而非确凿史料之上，本文特此郑重存疑说明。**\n\n---\n\n## 四、智俨著作全录与文本问题\n\n### 4.1 著作总表\n\n《华严经传记》称智俨\"所撰义疏，解诸经论，凡二十余部\"，但\"皆简略章句，剖曜新奇\"——大部头不多而见解锐利。今可确考者如下：\n\n| 著作 | 卷数 | 现状 | 大正藏 |\n|------|------|------|--------|\n| 《大方广佛华严经搜玄分齐通智方轨》（简称《搜玄记》） | 五卷（或作十卷） | 存 | T35n1732 |\n| 《华严一乘十玄门》（又称《华严十玄章》） | 一卷 | 存（题\"大唐終南太一山至相寺釋智儼撰，承杜順和尚說\"） | T45n1868 |\n| 《华严五十要问答》（又称《华严问答》） | 二卷（实五十三问） | 存 | T45n1869 |\n| 《华严经内章门等杂孔目章》（简称《孔目章》） | 四卷 | 存（62岁以后所作） | T45n1870 |\n| 《佛说金刚般若波罗蜜经略疏》 | 二卷（或记一卷） | 存 | 见大正藏金刚经疏类 |\n| 《无性摄论疏》 | 四卷 | 佚 | — |\n\n此外，日僧圆超《华严宗章疏并因明录》标列智俨《华严疏》十三卷，注明\"不知何时所著，无从考证\"。【考】《搜玄记》的五卷本与十卷本关系，历代经录著录不一：佛光辞典作十卷，李治华考订以五卷为正（十卷或系开合之异），引用时应注明卷次歧异。\n\n### 4.2 《搜玄记》：现存最早的六十华严疏与\"五门\"结构\n\n《搜玄分齐通智方轨》是**现存最早的一部论释六十华严的完整著作**（智俨二十七岁所作），也是了解智俨乃至整个早期华严学的第一文本。全书分五门：（一）叹圣临机德量由致；（二）明藏摄分齐；（三）辨教下所诠宗趣及能诠教体；（四）释经题目；（五）分文解释。前四门为概论，提出了此后华严宗的基本教义框架——包括判教（承慧光渐顿圆三教并摄论系小大三乘说）、以\"因果理实\"为《华严经》宗趣等；第五门逐品解释，各品一般依\"辨名—来意—宗趋—随文解释\"四门展开。法藏后来的《华严经探玄记》\"多本于此书\"——事实上，《探玄记》正是以《搜玄记》为蓝本的扩充重写。\n\n新罗崔致远《唐大荐福寺故寺主翻经大德法藏和尚传》对此书与《探玄记》的关系有一段著名评论：\n\n> \"初，至相俨和尚……成《华严经》中《搜玄义钞》五卷。其文也玉寡，其理也金相，追琢为难，镕裁有待。藏以亲窥室奥，独擅国工……乃效同耻者之述，撰《探玄记》二十通。……举要言之：《搜玄》者索隐之离辞，《探玄》者钩深之异语。隐能心索十玄之妙旨霞张，深可力钩十义之圆科月满。遂使句羞者前哲，受赐者后生。俨藏连称，提孩具审，古所谓死且不朽。\"\n\n\"文寡理金\"四字精准概括了智俨著作的风格——文字极简省而义理密度极高，也因此\"追琢为难\"，必须等待法藏这样的\"国工\"加以镕裁铺展。\n\n### 4.3 《华严一乘十玄门》：题记、内容与真伪公案\n\n《华严一乘十玄门》一卷，卷首题**\"大唐终南太一山至相寺释智俨撰，承杜顺和尚说\"**。全书以\"明一乘缘起、自体法界义者\"开篇，依海印三昧所现开立十门（古十玄名目详见第五章5.2节），并以教义、理事、解行、因果、人法、分齐境位、法智师弟、主伴依正、逆顺体用、随生根欲性等十义配十门而成百门，以显十玄缘起、重重无尽之义。清末杨文会自海外寻回此卷重刻，跋云：\"华严大教，阐扬十玄门者，此为鼻祖。贤首仍之，载于教义章内……及作《探玄记》，改易二名……后人以为清凉十玄与贤首有异者，盖未见《探玄记》也……复刻此卷，欲令人知其本源耳。\"\n\n【考】本书的作者问题存在真实的学术争议：(1) 传统立场依题记认为杜顺口说、智俨笔录；(2) 石井公成〈《一乘十玄門》の諸問題〉（1981）与吉津宜英《華厳一乗思想の研究》（1991，页31–38）从文本内部证据出发质疑题记的可信度；(3) 《一乘十玄门》不见于唐代经录著录，圆仁、惠运目录所载书名的归属亦有讨论空间。综合而言，比较稳妥的表述是：此书反映的是至相寺一系（杜顺—智俨传承圈）的十玄教学，其最终写定者为智俨，而\"承杜顺和尚说\"更多表达宗派的传承认同而非严格的口授实录。\n\n### 4.4 《五十要问答》与《孔目章》：晚年两大部\n\n**《五十要问答》**二卷，实含五十三问答，\"取其成数五十为名\"。全书不依经文次第，先明果德（首问\"十佛名义\"），次明心识、修行法则。其方法论特征是每一个问题都同时以小乘、三乘、一乘三重分位给出答案——处处凸显\"华严是主，余经是眷属\"的不共立场。此书在日本有江户刻本，序言称智俨\"受称性之说于帝心大师\"，可见日本江户佛教界已将智俨纳入杜顺（帝心）传承谱系。\n\n**《孔目章》**全称《华严经内章门等杂孔目章》，四卷，佛光辞典系年为智俨六十二岁以后所作（即663年之后，晚年绝笔性质）。全书将六十华严分为一四四章门，解释经中难解之处。重要章节包括卷一的教分齐义、一乘三乘义章、唯识章，卷二的发菩提心章、真如章，卷三的十地章、缘起章，卷四的往生义、性起章等。佛光辞典评价其\"融合三乘与一乘及同别二教之教判，而成为华严宗极重要之思想\"。\n\n### 4.5 莲华藏世界图：一部特殊的\"视觉作品\"\n\n《华严经传记》在叙述智俨晚年时插入了一句极为特殊的记载：\n\n> \"然其精练庶事，藻思多能，**造莲华藏世界图一铺**，盖□河之左，古今未闻者也。\"\n\n智俨亲手主持绘制过一幅莲华藏世界海图，且传记作者特别强调其为\"古今未闻\"的创举。这是华严宇宙观从经文走向视觉呈现的最早实例之一，比法藏为武则天讲解\"金师子\"、澄观疏释华藏世界海都要早半个世纪以上；对本项目 Tab5\"世主妙严·华藏世界海曼荼罗\"的数字化工作而言，这条史料正是历史锚点。\n\n### 4.6 存佚著作与\"二十余部\"之谜\n\n《金刚般若波罗蜜经略疏》二卷是智俨现存唯一的般若类著作，显示其学问并不局限于华严一隅。《无性摄论疏》四卷已佚——它与青年时代\"依常法师听《摄大乘论》\"的经历相印证，说明智俨的华严新说建立在摄论学训练之上。至于传记所说\"凡二十余部\"，今日可考者仅六部，其余或为短章零疏，或早已随会昌法难湮灭。\n\n---\n\n## 五、智俨的承上启下：理论建构与向下传承\n\n本章是全文的核心枢纽，集中处理智俨如何将第三章所述\"向上继承\"而来的多元思想资源，锻造为一套具有高度原创性的理论体系，并进一步考据他\"向下传承\"给法藏、义湘等弟子的具体内容与确切过程。\n\n### 5.1 从\"三观\"到\"十玄\"：智俨对杜顺遗产的理论化改造\n\n杜顺（依传统归属）所撰《华严法界观门》第三重\"周遍含容观\"，本已具备十门结构（理如事门、事如理门……普融无碍门）。智俨\"根据杜顺的三法界观，提出十玄门\"，**其理论改造工作的实质，是将杜顺原本作为\"观法次第\"（即指导具体禅观修习的操作性步骤）而设计的十门结构，转化、提升为一套具有独立教理论证地位、用以系统解释\"法界缘起\"之所以可能的哲学范畴体系。**这一转化的意义不可低估：观法次第本质上是\"如何修\"的实践指南，而教理范畴体系则是\"为何如此\"的理论说明——智俨完成的，正是将杜顺\"教你如何观\"的文本，改造、扩展为\"论证为何万法本来如此圆融无碍\"的哲学著作。\n\n### 5.2 \"十门玄\"到\"华严一乘十玄门\"：智俨自身思想的内部发展史\n\n魏道儒的文本比对研究揭示，智俨本人的\"十玄\"理论，其实并非一次成型，而是经历了至少两个可考的发展阶段：**其一是二十七岁所撰《华严经搜玄记》，其中在\"约所诠义明其分齐\"一节列举十项内容，称为\"十门玄\"，\"名称不固定，带有初创时期的浓重痕迹\"，且\"仅仅列举了十玄门的名目，没有展开论述\"；其二是独立成篇的《华严一乘十玄门》，\"是在继承、补充和发挥《搜玄记》所述内容的基础上形成的\"，\"是对智俨本人定型思想的概括\"。**\n\n智俨《华严一乘十玄门》所立十门（\"古十玄\"）名目为：\n\n1. 同时具足相应门\n2. 因陀罗网境界门\n3. 秘密隐显俱成门\n4. 微细相容安立门\n5. 十世隔法异成门\n6. 诸藏纯杂具德门\n7. 一多相容不同门\n8. 诸法相即自在门\n9. **唯心回转善成门**\n10. 托事显法生解门\n\n每门各配十义（教义、理事、解行、因果、人法、分齐境位、法智师弟、主伴依正、逆顺体用、随生根欲性），十门十义互具而成百门，故称\"十会百门\"。\n\n第九门\"唯心回转善成门\"尤可注意，其原文为：\"所言唯心迴轉者，前諸義教門等，竝是如來藏性清淨真心之所建立；若善若惡，隨心所轉，故云迴轉善成；心外無別境故言唯心，若順轉即名涅槃。\"——智俨明确以**如来藏性清净真心**作为十玄缘起的最终依据。\n\n### 5.3 别教一乘与同教一乘：继承慧光而加以系统化的理论创造\n\n\"别教一乘\"\"同教一乘\"这一对概念，是另一个能够生动展示智俨\"承上启下\"工作方式的典型案例——**但需特别订正：如3.3节所述，\"别教一乘说\"本身，据《华严经传记》慧光传及相关学术考订，已是慧光本人思想体系的组成部分。**智俨真正可以确认的、更具个人独创色彩的贡献，主要在于**将\"别教一乘\"与\"同教一乘\"这二者明确并置、对举，构造为一组结构性的理论装置，并将其正式安置于自己\"判五教而归一乘\"的判教体系之中。**\n\n\"别教一乘\"主张，《华严经》所代表的\"一乘\"教法，是完全独立于声闻、缘觉、菩萨\"三乘\"之外的、最高圆满的独特体系；\"同教一乘\"则强调一乘教法与三乘教法之间的融通性，主张三乘与一乘本质上\"皆归一乘\"。**这一\"既别又同\"的双重结构，无论其中\"别教一乘\"一词的最初渊源应更多归功于慧光、抑或智俨，就其在智俨手中被正式结构化、体系化、并成为日后整个华严判教体系基础装置这一点而言，仍然清楚地展示了智俨作为\"承上启下\"者的典型工作方式：并非总是从零创造全新概念，而更多是将前人已有、却相对零散或未获广泛弘传的思想资源，重新组织、赋予新的理论位置与系统性关联。**\n\n### 5.4 \"古十玄\"与\"新十玄\"：一场清晰可考的三阶段文本修订史\n\n智俨\"十玄门\"理论向法藏手中的传承与造，是\"智俨到法藏\"这一传承链条中文献证据最为扎实、修订轨迹最为清晰可考的一个具体案例。据杭州灵隐寺\"常识\"专栏及《十玄缘起》相关工具书辞条考订：\n\n**第一阶段——智俨定本（\"古十玄\"）：**智俨《华严一乘十玄门》所立十门（名目见5.2节）。\n\n**第二阶段——法藏前期著作（仍遵\"古十玄\"）：**据灵隐寺\"常识\"专栏明确记载：\"法藏前期在《华严一乘教义分齐章》（简称《五教章》）、《华严经文义纲目》所立，叫作古十玄\"——**即法藏在其从学智俨之后、直至撰写《五教章》这一漫长的早、中期著述生涯里，对十玄门的名目次第，基本上\"仍都依承智俨所说……大致和智俨所立相同，只是次第稍异\"，并未作实质性的理论修订。这一事实极具意义：它说明法藏对智俨遗产的最初、且持续了相当长时间的态度，是忠实的传承与保存，而非急于另立新说。**\n\n**第三阶段——法藏晚年定本（\"新十玄\"）：**唯有到了法藏一生最后的巨著《华严经探玄记》中，\"不但变动了十玄的次第，并且改订了几个名称\"，正式形成\"新十玄\"：同时具足相应门、广狭自在无碍门、一多相容不同门、诸法相即自在门、隐密显了俱成门、微细相容安立门、因陀罗网法界门、托事显法生解门、十世隔法异成门、主伴圆明具德门。**具体的修订内容是：\"新十玄是把古十玄的诸藏纯杂（具德门）、唯心回转（善成门）二门改订作广狭自在（无碍门）、主伴圆明（具德门）二门\"**——其余八门则大体保留（仅次第略有调整）。\n\n**\"唯心回转善成门\"被替换为\"主伴圆明具德门\"这一具体变化，尤其耐人寻味——**前者强调\"心\"作为缘起枢纽的主导地位，带有较强的\"归摄于一心\"色彩；后者则强调诸法之间\"主\"\"伴\"角色可以随观察角度不同而相互转换、圆融俱现，更加凸显法藏成熟期\"事事无碍\"理论中诸法平等交涉、无有定主的特质。这一观察目前仅是本文基于文本比较所作的合理引申，学界对此具体差异的哲学意涵尚缺乏专门论述，特此存疑说明。\n\n### 5.5 向下传承之一：法藏——从\"见神光\"到\"付嘱道成薄尘\"，一场跨越十年的师徒因缘\n\n**（一）法藏早年的求法历程与玄奘译场的插曲。**法藏（643—712），生于长安，俗姓康，祖先为康居（中亚地区）人。十六岁时，曾在法门寺佛陀舍利塔前燃指供佛，发愿契悟佛乘；十七岁（659年，恰与智俨\"显庆四年讲说《华严经》、宗风大振\"同年！）入太白山（终南山）求法，勤读方等经典，后因母病返家侍奉。**法藏此后一度被选拔进入玄奘主持的国家译经事业核心团队，直接参与新译佛典的翻译工作；然而最终因与译场主流见解不合而主动退出。**这段经历的思想史意义在于：它意味着法藏在正式成为智俨弟子之前，已经亲身经历了一段与玄奘、窥基所代表的\"新译\"唯识学说的直接接触与最终疏离。\n\n**（二）\"见神光\"而访智俨：又一则神异叙事母题的重现。**法藏退出译场后，据记载：\"二祖智俨在云华寺讲述《华严经》，法藏在夜晚恰好看见神光照耀庭宇，遂惊叹定有特殊的人正在弘扬佛法。第二天，便去云华寺一探究竟。于是，便向智俨请益，往返答问之间，为智俨所赞赏，从此列为门徒。\"这一\"见神光而访道\"的叙事母题，与\"神僧抚顶\"\"异僧点化\"等记载共享着同一种中国佛教圣传文学的书写惯例。依循吉美罗、魏道儒一贯采用的\"祛魅式重读\"方法，我们同样可以将这一记载理解为：法藏经由某种途径得知智俨其人其学，进而主动登门求教，\"往返答问\"的实质内容，很可能正是法藏凭借其此前参与玄奘译场所锻炼出的义学功底，与智俨展开了一场高质量的教理问答。**\"从此列为门徒，前后数年，深深体会智俨的妙旨\"这一结果本身，则是各方史料一致确认的事实。**\n\n**（三）跟随年限的精确推算：约659年至668年，前后九年。**法藏十七岁（659年）入太白山求法，其后经历译场插曲、\"见神光\"访道诸事，最迟应在660年代初正式投入智俨门下；智俨卒于总章元年（668年）——**据此推算，法藏正式追随智俨修学的时间，满打满算不超过九年（约659/660—668），法藏本人此时年龄约十七岁至二十五、二十六岁之间。**这提示我们，\"智俨传法藏\"这一表述，若理解为智俨在短短数年间将其毕生思想和盘托出、法藏原样继承，恐怕并不完全准确；更为审慎的理解应是：智俨在其生命最后阶段，向法藏传授了一套已经相对成熟的理论框架与研究方法，而法藏此后四十余年的独立弘法生涯，才是这套框架真正被大规模扩展、体系化的主要时期。\n\n**（四）临终付嘱：一个尚未剃度的\"弟子\"。**总章元年（668），智俨圆寂前，\"预知时至，对门人言说：吾此幻躯纵缘无性，今当暂往净方，后游莲华藏世界，汝等随我，亦同此志\"——这段融合净土往生愿望与华严\"莲华藏世界\"宇宙论想象的临终遗训，本身即是华严—净土合流传统的又一例证。**更值得注意的是具体的传法安排：智俨并未直接、正式地将法藏收为剃度弟子或亲自为其授戒，而是将这一任务郑重委托给了自己另外两位更为年长、地位更高的入室弟子道成与薄尘，嘱咐他们日后授予法藏菩萨戒，并令其讲授《华严经》与《梵网经》。**据《华严经传记》载智俨临终语：\n\n> \"俨乃累道成、薄尘二大德曰：『此贤者注意于华严，盖无师自悟，绍隆遗法其惟是人！幸假余光，俾沾制度。』\"\n\n这一安排清楚显示，法藏在智俨生前，很可能始终只是一位尚未正式剃度、仅以在家或准出家身份追随修学的年轻学子。\n\n**（五）迟到两年的剃度：670年，太原寺，武则天度僧。**智俨身后两年，高宗咸亨元年（670年），武则天为其母杨氏追福，\"树福田，度僧\"，将智俨生前讲学的云华寺旧址改建为太原寺；\"道成、薄尘等京城耆德连状荐举\"，正式推荐法藏参加这次官方度僧，法藏由此才正式出家，且此时\"只受了沙弥戒\"（尚未受具足戒），随即\"奉诏在太原寺讲授《华严经》\"。**华严宗后世公认的\"三祖\"法藏，直到智俨圆寂两年之后，才在其师兄道成、薄尘的联名举荐下，透过一次带有官方色彩的度僧机缘，正式取得僧籍身份——\"华严三祖\"地位的最终确立，除了智俨的理论传授之外，还仰赖于道成、薄尘二位师兄的具体奔走举荐，以及武则天一次带有政治、宗教双重考量的度僧诏令，多重历史因缘共同促成，而非单纯的\"师徒心传\"所能概括。**\n\n### 5.6 向下传承之二：义湘与海东华严\n\n智俨门下另一位同样重要、却常因地理阻隔而在中文语境的华严宗叙事中相对边缘化的入室弟子，是新罗僧人义湘（625—702，一作義相）。义湘于唐高宗龙朔元年或二年（661或662年）入唐求法，\"礼终南山至相寺智俨为师专攻华严\"——这一时间点与法藏\"见神光而访智俨\"的大致时期高度重合，意味着法藏与义湘二人，很可能是智俨晚年讲席上同时受教的两位同门法侣。义湘随侍智俨数年，返国后于文武王十六年（676年）在太白山创建浮石寺，弘扬华严教理，被尊称为\"浮石尊者\"，是为朝鲜半岛\"海东华严宗\"的开创者。\n\n**尤具史料价值的是，义湘归国之后，与留在中国、日后成为\"三祖\"的同门法藏之间，仍保持着确凿可考的书信往来。**法藏曾致信义湘，赞扬其弘教之行，并随信赠《华严经探玄记》《一乘教分记》《起信论义记》《十二门论疏》等——中国华严的成熟成果由此反哺海东。**智俨身后，其思想遗产透过法藏（中国本土一脉）与义湘（新罗一脉）两条渠道分头发展、各自成就，但这两条渠道之间并未完全断绝联系，而是透过至少一封现存可考的书信，保持着某种跨越国界的同门情谊与学术呼应。**\n\n义湘门下悟真、智通、表训、真定、真藏、道融、良圆、相源、能仁、义寂号称\"十哲\"。**智俨门下同时走出中国华严的实际创立者与海东华严的开山，这是东亚佛教史上罕见的师门景观。**\n\n### 5.7 其他门人：怀齐、慧晓、薄尘、道成\n\n智俨门下弟子，据《华严五祖》条目记载，\"闻名者\"共六人：法藏、怀齐、义湘、慧晓、薄尘、道成——除法藏、义湘外，其余四人生平事迹现存史料记载均较简略。其中**薄尘、道成二人的地位尤其值得重新评估**：如5.5节所述，正是这二位——而非法藏本人——才是智俨临终亲自付嘱的直接托付对象，且日后法藏本人的正式僧籍身份，也是经由此二人\"连状荐举\"方才取得。**这提示我们，在智俨生前及圆寂之初的僧团内部权力与传法秩序中，薄尘、道成二人的实际地位，很可能一度高于日后声名远播、被追认为\"三祖\"的法藏。**\n\n### 5.8 智俨思想的\"过渡性\"评价之争：魏道儒 vs 青岛学报论文作者\n\n综合前述考据，现在可以回到第一章1.4节已提出、却尚未展开讨论的一项当代学术争议——**智俨究竟应被定位为\"基本完成了华严宗学说体系整体框架\"的关键奠基者（魏道儒观点），还是应被定位为\"华严构架早在法顺便已提出\"、智俨本人\"属于法顺到法藏的过渡人物\"（青岛大学学报论文作者观点）？**\n\n**本文认为，这场争论的实质，并非双方在具体史实层面存在根本分歧——双方真正的分歧在于评价尺度与用词选择：魏道儒选择以\"整体框架\"这一较高规格的评价词汇来定位智俨的历史地位，意在纠正传统叙事中智俨常被\"法藏光环\"所掩盖的现象；而青岛学报论文作者则更强调\"过渡人物\"这一相对性、关系性的定位方式。**本文倾向于认为，这两种评价框架其实并不构成非此即彼的截然对立，而是**分别从\"智俨自身理论创造的原创性与体系性\"和\"智俨在整个华严宗从萌芽到成熟这一漫长历史进程中所处的相对位置\"这两个不同、但同样有效的观察维度出发，共同揭示了智俨\"承上启下\"这一定位的丰富内涵——他既是一位具备高度理论建构能力的思想家，同时其毕生学术工作，就其历史效果而言，又确实主要发挥了将杜顺观法雏形与地论摄论理论资源熔铸一炉、进而传递给法藏这一\"过渡性\"的枢纽功能。二者本非矛盾，合而观之，方能构成对智俨历史地位最为完整、平衡的理解。**\n\n---\n\n## 六、核心教理体系：判教、性起与唯心思想\n\n### 6.1 判教：三教判到五教判的\"两变\"\n\n智俨著作中论及判教者有《搜玄记》《五十要问答》《孔目章》三部。卓小雯的研究将其判教演变概括为\"两变\"：\n\n**第一变：三教判→五教判雏形。**《搜玄记》直接继承慧光\"顿、渐、圆\"三教判（并依摄论系立小乘、三乘、一乘三种教法），而《五十要问答》中五教名相首次出现——第十问列出：1. 小乘教；2. 三乘始教；3. 终教；4. 直进菩萨（当为顿教）；5. 一乘教。第二十一问\"一乘分齐义\"则将一乘分为**共教**与**不共教**（即后来的同教／别教）。\n\n**第二变：粗略五教→精密五教。**《孔目章》（约62岁后作）中的五教已具完整架构与名义，且圆教又分**别教门**与**同教门**。卓小雯统计此章实际开出约十种教门，评价其\"已是相当精详成熟的判教理论\"。值得注意的是，智俨以《维摩经》一部经内部的不同段落配判四教——这种精细的分位意识直接启发了法藏。\n\n【考】关于法藏五教判是否师承天台四教加顿教的问题，卓小雯举出三点反驳，其中最有力的证据是：**\"始、终\"二教之名在法藏之前唯有智俨使用过**，且见于法藏《五教章》《探玄记》——智俨承袭链由此坐实。\n\n### 6.2 六相义\n\n六相（总相、别相、同相、异相、成相、坏相）出自《十地经论》对初地的解释，经慧光拈出而成为地论宗的教义工具。智俨的贡献在于将六相转化为解说《华严经》缘起结构的普遍原理。《搜玄记》的解释极为简括：\n\n> \"所谓一总，总成因果也。二别，义别成总故。三同，自同成总故。四异，诸义自异显同故。五成，因果理事成故。六坏，诸义各住自法不移本性故。\"\n\n李治华指出，智俨还从\"一多相即\"\"互为因果\"\"因门六义\"\"总别六相\"等多个角度论证圆融之理，其中\"因门六义\"后来被法藏完整吸收进《五教章》，成为华严宗说明\"缘起何以可能\"的标准理论。\n\n### 6.3 法界缘起：染净二分与净分四门\n\n智俨称《华严经》所讲的缘起为\"法界缘起\"，并将其结构化为染净二分的系统。《搜玄记》释〈十地品〉现前地\"三界虚妄，但是心作；十二缘分，是皆依心\"时总标：\n\n> \"法界缘起乃有众多，今以要门，略摄为二：一约凡夫染法以辨缘起，二约菩提净分以明缘起。\"\n\n释法音的研究指出其中的关键创见：智俨虽师承地论南道，但他**把如来藏当作法界的一个侧面，以法界缘起来含摄如来藏；慧远则把法界理解成如来藏的一部分，以如来藏含摄法界缘起**——二者外形相似，发创根据完全相反。智俨试图以此跳出如来藏缘起的框架，达到真正的法界缘起。这可以视为华严宗从地论宗母体中独立出来的哲学标志。\n\n### 6.4 性起说：智俨的界定及其历史地位\n\n\"性起\"一词源自六十华严〈如来性起品〉，是华严宗区别于天台\"性具\"说的标志性观念。智俨对此有奠基性的处理：在《搜玄记》中，他把净分缘起的前两门（本有、本有修生）径直对应于〈性起品〉的义理——换言之，**在他的体系中，性起乃是缘起的一部分**，而非外于缘起的另一原理。\n\n《孔目章》设专章解说性起义，给出了华严史上第一个明确的性起定义：\n\n> \"性起者，明一乘法界缘起之际，本来究竟，离于修造。何以故？以离相故。起在大解、大行、离分别菩提心中，名为『起』也。由是起性故，说为起；起即不起，不起者是性起，广如经文。\"\n\n通史性论文总结得非常清楚：性起观念在始创者智俨的著作里得到开展，他界定了\"性起\"的涵义、说明了性起跟缘起的关系以及性起跟缘修的分别，**奠定了华严宗性起思想的基础**；弟子法藏则进一步从众生因地与如来果地两个层面陈述性起，完成体系化。日本学界围绕智俨性起说的专题研究最为密集（玉城康四郎1953、镰田茂雄1965、石井公成1979、鍵主良敬1987等），Gimello论文亦有专节讨论。\n\n### 6.5 唯心思想三期：回应玄奘新译的\"正反合\"\n\n李治华提出的智俨唯心思想三期说，为理解其晚年著作提供了有效框架：\n\n| 著作 | 阶段 | 特征 |\n|------|------|------|\n| 《搜玄记》（628） | 真妄和合期 | 以《起信论》真心与妄识和合架构诠释〈十地品〉\"三界虚妄但是心作\" |\n| 《五十要问答》 | 真妄对比期 | 回应玄奘新译唯识学与三阶教如来藏说，呈现真妄对比分立的局面 |\n| 《孔目章》（663后） | 真妄综合期 | \"明难品初·立唯识章\"综合新旧唯识学\"建立唯识\"的系统学说 |\n\n尤其值得注意《五十要问答》与《孔目章》中的〈立唯识章〉是智俨最长的论述单元：文中引用或评议《胜鬘经》《楞伽经》《十地经论》《摄大乘论》《起信论》（真常经论系）与《瑜伽论》《杂集论》《显扬论》《成唯识论》（玄奘新译系），而**以真常经论收摄新唯识学论典**。智俨活动后期恰逢玄奘新译唯识席卷长安，一位至相寺的老僧以其旧学功底对新学作出系统回应——华严宗的\"唯心\"性格，正是在与唯识宗的对话竞争中锻造出来的。\n\n---\n\n## 七、观行实践与视觉文化\n\n### 7.1 诵持、行道与感应验证\n\n《华严经传记》呈现的智俨修行形象有三个反复出现的母题：\n\n- **晓夜诵持**：十二岁入杜顺门下即被要求\"晓夜诵持，曾无再问\"——以诵经为日课的训练贯穿其少年时代。\n- **七宵行道**：二十七岁写成《搜玄记》后，\"七宵行道，祈请是非，爰梦神童，深蒙印可\"——义理的成立还需经过连续七夜的行道忏悔与梦中印证。这种\"以行验解\"的模式，显示智俨的宗派意识里，教理建构与仪轨实践是一体的。\n- **临终正念**：\"吾此幻躯从缘无性\"，以缘起无我观照自身生死。\n\n### 7.2 净土倾向\n\n传记载其临终语：\"吾此幻躯，从缘无性，今当暂往净方，后游莲华藏世界。汝等随我，亦同此志。\"卒时\"时有业净方者（修净土行业的人），其夜闻空中音乐从西方而来，须臾还返，以为大福德人往生之验\"。这段记载把弥陀净土（\"暂往净方\"）与莲华藏世界海（华严自家的终极境界）衔接为两阶旅程：净土是中转站，华藏才是目的地。它与法藏在《华严经传记》同卷所记诸华严行者往生感应共同构成初唐华严—净土交涉的第一手材料。\n\n### 7.3 莲华藏世界图：华严宇宙观的视觉化开端\n\n4.5节已述智俨\"造莲华藏世界图一铺\"之事。华严经对\"华藏世界海\"的描写本身即是高度图像性的文本，但在智俨之前，未见有人将其绘制成图的记载。智俨以\"精练庶事、藻思多能\"之才亲手主持此事，传记作者特笔标出\"古今未闻\"——这幅图的形制虽已不传，但其存在意味着：至迟在7世纪中叶，华严宗团已经有了将自家的宇宙观转化为可视化媒材的意识与实践。后世敦煌华严经变、高丽浮石寺祖师堂壁画乃至本项目 Tab5 的数字曼荼罗，都可以视为这条视觉传统的遥远后裔。\n\n### 7.4 与三阶教的隐秘对话\n\n《五十要问答》最末一问\"普敬认恶义\"值得单独提出。\"普敬认恶\"本是三阶教开祖信行的核心学说，三阶教在隋唐之际曾被朝廷数度禁断，属于敏感话题。智俨在此问中以判教方式消化了这一概念，将其纳入自家五教分位而不失华严立场。这显示至相寺一系的学问视野远比\"华严专攻\"的标签宽广。\n\n---\n\n## 八、智俨年谱、人物关系与历史文化事件\n\n### 8.1 智俨年谱简表\n\n| 年代（唐历/隋历） | 公元 | 智俨年龄（虚岁） | 事件 |\n|---|---|---|---|\n| 隋文帝仁寿二年 | 602 | 1 | 生于天水（今甘肃），俗姓赵，父赵景，任申州（今河南信阳）录事参军 |\n| 隋炀帝大业九年 | 613 | 12 | 杜顺\"抚顶认领\"，转交高足达法师训诲，\"晓夜诵持\"《华严经》 |\n| （约） | 615 | 14 | 从游方梵僧习梵文，预剃度为沙弥 |\n| 唐高祖—太宗年间 | 约621 | 20 | 受具足戒，遍参诸经律论：《四分律》《八犍度论》《成实论》《十地经论》《地持经》《涅槃经》 |\n| （贞观年间） | — | — | 从静琳获《华严经》，决意专学华严；从智正听讲《华严经》一年余；读慧光《华严经疏》，悟\"别教一乘无尽缘起\"；从法常听受《摄大乘论》 |\n| （约贞观初年） | 约629 | 27/28 | 撰《华严经搜玄记》，系统阐释\"六相\"义，初立\"十门玄\"雏形 |\n| （约629—658年间） | — | — | 生平记载近乎空白的\"三十年沉潜期\"（吉美罗推测） |\n| 唐高宗显庆四年 | 659 | 58 | 于云华寺讲说《华严经》，\"宗风大振\"；法藏（时年17）\"见神光\"来访，列为门徒 |\n| 唐高宗龙朔元年/二年 | 661/662 | 60/61 | 新罗僧义湘入唐，礼智俨为师，专攻华严 |\n| 唐高宗总章元年 | 668 | 67 | 预知时至，遗训门人；圆寂于清净寺（一作清禅寺）；临终付嘱道成、薄尘日后为法藏授菩萨戒 |\n| （身后） | 669/671 | — | 义湘返新罗（两说并存），后创浮石寺，为海东华严初祖 |\n| 唐高宗咸亨元年 | 670 | — | 武则天为母追福度僧，云华寺改建太原寺，道成、薄尘联名举荐，法藏始正式剃度（仅受沙弥戒） |\n\n**备注：** 智俨出生年份\"隋文帝仁寿二年\"（602）与玄奘生年完全相同；智俨圆寂时\"世寿六十七\"，按668—602=66计算，应属虚岁记年法（含出生当年）。\n\n### 8.2 核心人物关系网络\n\n**授业之师：**杜顺（精神感召与初步引路）、达法师（受杜顺委托，负责日常训诲）、智正（地论学统，六相义、摄论学传授）、静琳（授予《华严经》文本）、法常（摄论学传授）——**智俨是本文所涉三位祖师中，唯一同时拥有多位、且分属不同学术脉络之授业之师明确可考者。**\n\n**门下弟子：**法藏、义湘、怀齐、慧晓、薄尘、道成——薄尘、道成二人虽不及法藏、义湘知名，但在智俨临终传法安排中实际承担了关键的中介角色。\n\n**同时代但无直接交集之人物：**玄奘（602—664，与智俨同龄）——二人现存史料未见直接往来记载，但透过法藏这一共同关联人物，二者的思想世界在初唐长安的佛教知识场域中，实际上存在着相当程度的间接交集与潜在张力。\n\n### 8.3 贞观—永徽—显庆—总章：智俨所处的初唐制度转型期\n\n智俨的生命历程（602—668），几乎完整地覆盖了唐代立国初期最为关键的一段制度奠基与国力上升期。**尤其值得注意的是，智俨晚年最重要的讲学、收徒活动（659年前后）及其身后法藏的正式剃度（670年），均已进入唐高宗后期\"皇后专权\"格局逐渐形成的阶段：武则天自显庆五年（660年）起因高宗风疾而\"处理百司奏事\"，\"咸亨元年（670）为母杨氏追福度僧\"这一直接促成法藏取得僧籍身份的关键事件，正是武则天当时已具备相当政治能量、且高度重视佛教作为其权力正当化资源之一这一大背景下的具体产物。**智俨本人虽未直接卷入这一政治格局的变迁，但他身后华严宗最终得以在法藏手中迅速崛起，这一制度性机缘，实际上早在智俨圆寂后仅两年的670年度僧事件中，便已埋下了最初的伏笔。\n\n---\n\n## 九、智俨之后华严宗的传承与发展\n\n### 9.1 法藏：从\"过渡\"到\"集大成\"——智俨遗产的充分展开\n\n法藏（643—712）在智俨圆寂后四十四年的独立弘法生涯中，将智俨传授的理论框架大规模扩展、体系化：正式确立\"五教十宗\"判教体系，著《华严经探玄记》（完成\"新十玄\"的最终修订），因深得武则天礼遇而有\"金师子章\"譬喻华严要旨的著名典故，又针对窥基\"五重唯识观\"提出\"十重唯识观\"——**这一具体的理论回应，可以视为法藏早年参与玄奘译场又\"以见识相异\"退出这一经历，在其晚年独立著述中留下的一处具体理论印记。**法藏晚年恰逢实叉难陀主持重译八十卷《新华严经》（695—699年译出），法藏因此需将早年基于六十卷\"晋译\"《华严经》所撰旧疏重新调整、适配新译本，魏道儒据此将法藏定位为\"从注解晋译《华严》到注解唐译《华严》的过渡人物\"。\n\n### 9.2 澄观与宗密：教禅一致的进一步发展\n\n四祖澄观（738—839）、五祖宗密（780—841）二人的生平思想，本文姊妹篇《宗密综合深度研究》已有极为详尽的处理。**澄观虽以法藏理论体系的注疏、弘扬为己任，但其博采众长的治学路径（兼修律、禅、三论、天台诸家），与智俨早年\"遍参诸师、兼采地论摄论\"的求学模式，实有异代同调之处——华严一系历代祖师\"不固守一师之言、广泛参学\"的开放性格，似乎构成了一条贯穿智俨、澄观乃至宗密的隐性精神传统。**\n\n### 9.3 域外传承与著作的散佚回归\n\n如第四章5.6节所述，智俨身后，其思想遗产透过法藏（中国本土）与义湘（新罗）两条渠道分头发展。**颇具历史意味的是，净源与来华求法的高丽王子义天（1055—1101）之间的师徒关系，客观上使得智俨身后分头发展数百年的这两条渠道，在十一世纪的杭州慧因寺重新产生了交汇：义天不仅从净源学习华严教观，还将中土久已散佚的智俨本人著作——《搜玄记》《孔目章》——连同法藏、澄观的相关著述一并奉赠慧因寺，使得智俨原典得以在跨越四百余年、辗转经由朝鲜半岛保存的文献生命之后，重新回传中土。**\n\n智俨著作的流传史本身就是一部中外文化交流史：(1) 唐中期以前在国内流传；(2) 会昌法难（845）后大部散佚；(3) 宋元丰八年（1085）义天回传中土；(4) 清末杨文会通过南条文雄在日本搜购佛典佚书，将《一乘十玄门》《五十要问答》等重新刻入金陵刻经处——今日大正藏所收智俨四部主要著作（T35n1732、T45n1868、1869、1870），正是这条\"中国→朝鲜半岛／日本→中国\"环流的结果。\n\n### 9.4 历代评价辑要\n\n| 时代 | 评价者 | 评语 |\n|------|--------|------|\n| 唐 | 法藏《华严经传记》 | \"精练庶事，藻思多能\"\"凡二十余部，皆简略章句，剖曜新奇\" |\n| 唐 | 崔致远《法藏和尚传》 | \"其文也玉寡，其理也金相\"\"俨藏连称……死且不朽\" |\n| 清 | 杨文会 | 十玄门\"此为鼻祖……欲令人知其本源耳\" |\n| 近代 | 黄忏华 | \"华严一宗到智俨就已教相和观行粗备\" |\n| 现代 | Gimello（1976） | 以\"华严佛教的奠基\"为智俨定位 |\n| 当代 | 李治华 | \"华严宗教义的基本规模是由智俨所创建\" |\n\n---\n\n## 十、结语：\"承上启下\"的枢纽意义\n\n回望智俨其人其学，其最深刻的历史意义，或许正在于他生动示范了\"承上启下\"这一角色本身所蕴含的双重张力与双重成就：**他以扎实的文献证据（\"承杜顺和尚说\"的署名、慧光文本的悟入）表明自己是杜顺、地论摄论学统的忠实继承者，又以同样扎实的文献证据（独立成篇的《华严一乘十玄门》对杜顺三观的理论化改造、\"别教一乘/同教一乘\"在慧光既有资源基础上的系统化并置、以及经由三阶段修订史可考的\"古十玄\"体系）表明自己是一位善于在继承中实现创造性建构的思想家；他以九年左右相对短暂、且相当程度上仍属\"准出家\"性质的师徒缘分，将自己毕生酝酿的理论成果传授给法藏，却又透过临终托付道成、薄尘这一具体而微的制度性安排，确保了这套理论体系能够顺利完成向下一代的过渡与最终的成熟绽放。**智俨或许终其一生都未曾料想，自己在关中一隅、历经数十年默默耕耘所锤炼出的这套理论工具，会在其身后不到半个世纪之内，透过法藏之手成长为足以令一代女皇武则天亲自垂询的显赫宗派，并透过义湘之手，在遥远的朝鲜半岛开枝散叶，绵延至今——这正是\"承上启下\"这一看似谦抑、却实则蕴含着巨大历史能量的枢纽性角色，所能达成的最为深远的成就。\n\n---\n\n## 参考文献与资料来源说明（分级 · 🔗 可回查）\n\n> 以下按语言、性质分类列出本文写作过程中检索、参考之主要资料来源，并依体例标注**信度分级**与**可回查链接**。\n> **分级**：**[A]** 一手/权威（原典校勘·权威出版社·同行评审学报·CBETA） · **[B]** 专著/学位论文/可靠期刊论文 · **[C]** 线索/待核（作者或出处未核实·网络百科·仅列站点性质者） · **[题/传]** 托名存疑之传统归属。🔗 指向 CBETA/机构原页；**经号存疑或无从核证者一律标〔待核〕、不臆造链接**。\n> **CBETA 约定**：大正藏链接为 `cbetaonline.dila.edu.tw/zh/T{册}n{部号}`，其经号须**已见于本文原典著录或本项目已核验 YAML（`dushun_wujiao_zhiguan.yaml` 等）**，否则不手抄新号。\n> **本文主要透过网络公开检索与 CBETA 在线数据库完成**，未能逐一查证每一部专著、论文的具体版本、页码，部分条目多仅列作者、题名、出版机构，供读者按图索骥、自行查证原始出处，不宜视为可替代原始学术文献的最终定论。\n\n### 一、原典与传统文献 **[A]**\n- 智俨：《华严经搜玄记》· **[A]** · 🔗 [CBETA T35n1732](https://cbetaonline.dila.edu.tw/zh/T35n1732)；《华严一乘十玄门》· **[A]** · 🔗 [CBETA T45n1868](https://cbetaonline.dila.edu.tw/zh/T45n1868)；《华严五十要问答》· **[A]** · 🔗 [CBETA T45n1869](https://cbetaonline.dila.edu.tw/zh/T45n1869)；《华严经内章门等杂孔目章》· **[A]** · 🔗 [CBETA T45n1870](https://cbetaonline.dila.edu.tw/zh/T45n1870)\n- 智俨：《金刚般若波罗蜜经略疏》（全称《佛说金刚般若波罗蜜经略疏》）· **[A]** · 🔗 [CBETA T33n1704](https://cbetaonline.dila.edu.tw/zh/T33n1704)\n- 法藏：《华严经传记》（含〈智俨传〉）· **[A]** · 🔗 [CBETA T51n2073](https://cbetaonline.dila.edu.tw/zh/T51n2073)；《华严一乘教义分齐章》· 🔗 [CBETA T45n1866](https://cbetaonline.dila.edu.tw/zh/T45n1866)；《华严经探玄记》· 🔗 [CBETA T35n1733](https://cbetaonline.dila.edu.tw/zh/T35n1733)；《华严金师子章》· 🔗 [CBETA T45n1880](https://cbetaonline.dila.edu.tw/zh/T45n1880)\n- 道宣：《续高僧传》卷二十五〈法顺传〉· **[A]** · 🔗 [CBETA T50n2060](https://cbetaonline.dila.edu.tw/zh/T50n2060)\n- 崔致远：《唐大荐福寺故寺主翻经大德法藏和尚传》· **[A]** · 🔗 [CBETA T50n2054](https://cbetaonline.dila.edu.tw/zh/T50n2054)\n- 义湘：《华严一乘法界图》· **[A·海东]** · 🔗 [CBETA T45n1887A](https://cbetaonline.dila.edu.tw/zh/T45n1887A)；《入法界品钞记》· **[A·海东]** · 🔗〔待核〕\n- 一然：《三国遗事》卷四〈义湘传教〉· **[A·海东]** · 🔗〔非大正/续藏·朝鲜史典·按名检维基文库〕\n- 续法：《法界宗五祖略记》· **[A]** · 🔗 [CBETA X77n1530](https://cbetaonline.dila.edu.tw/X77n1530)〔生卒异说史料〕\n\n### 二、中文现代学术论著\n- 魏道儒：《中国华严宗通史》（江苏古籍出版社，2008）；另〈从《华严十玄门》解析佛学中国化〉 · **[A]**\n- 黄忏华：《中国佛教》（商务印书馆）· **[A]**\n- 《   // 该三者施折叠；仅正文 #article-full 与页首会众流程 #article-flow 仍按 h2–h5 分级折叠。
  // 各节工具栏一概不生成（noBar），改由页首「一套」页面级控件统管全页折叠/展开。

// ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);

function _applyArticleENMode(){
  var full=document.getElementById('article-full');
  var btn=document.getElementById('article-en-toggle');

  if(btn) btn.textContent=hide?'🌐 英文批注：展开':'🌐 英文批注：显示';
}/* ============================================================================
 * renderArticleBI —— 世主妙严品文本分析层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(BI)。
 *     故本层各节标题皆标 [BI]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 文本分析层</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Textual Analysis Layer</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}

</script>
