035 203b.2（逐字回源复验）</span></p>\n<blockquote class=\"tri-text\" lang=\"bo\">སངས་རྒྱས་རྨད་ག་ཅད་ཅེས་བྱ་བ་ཤིན་ཏུ་རྒྱས་པ་ཆེན་པོའི་མདོ། །བམ་པོ་བཅུ་བདུན་པ། དེ་ནས་བྱང་ཆུབ་སེམས་དཔའ་འཇམ་དཔལ་ གྱིས།</blockquote>\n</section>\n<section class=\"tri-quote tri-qzh\">\n<p class=\"tri-head\"><span class=\"tri-tag\">八十</span><span class=\"tri-sub\">对勘批 alignment\\tibetan_zhuhuju_b2.json · 品10 开篇（T10n0279 逐字回源）</span></p>\n<blockquote class=\"tri-text\" lang=\"zh\">菩薩問明品菩薩問明品第十爾時，文殊師利菩薩問覺首菩薩言：「佛子！心性是一。云何見有種種差別？所謂：往善趣、惡趣；諸根滿、缺；受生同、異；端正、醜陋；苦、樂不同；業不知心，心不知業；受不知報，報不知受；心不知受，受不知心；因不知緣，緣不知因；智不知境，境不知智。」時，覺首菩薩以頌答曰：「仁今問是義，為曉悟群蒙，我如其性答，惟仁應諦聽。諸法無作用，亦無有體性，是故彼一切，各各不相知。譬如河中水，湍流競奔逝，各各不相知，諸法亦如是。亦如大火聚，猛焰同時發，各各不相知，諸法亦如是。又如長風起，遇物咸鼓扇，各各不相知，諸法亦如是。又如眾地界，展轉因依住，各各不相知，諸法亦如是。眼耳鼻舌身，心意諸情根，以</blockquote>\n</section>\n\n**名相对应表**（对勘批 correspondence 原文迻录）\n\n| 目 | 八十（T10n0279） | 六十（T09n0278） | 藏（德格 Toh 44） |\n|---|---|---|---|\n| 问主 | 「文殊師利菩薩問覺首菩薩言」 | 「文殊師利菩薩問覺首菩薩言」 | 藏 འཇམ་དཔལ（文殊）问 སངས་རྒྱས་དཔལ（佛德） |\n| 问式 | 「心性是一。云何見有種種差別」 | 「心性是一，云何能生種種果報」 | 藏 རང་བཞིན་གཅིག་པའི་སེམས་ལ…ཐ་དད་པ（心性一而种种差别） |\n| 问目 | 「往善趣、惡趣」 | 「或至善趣，或至惡趣」 | 藏 བདེ་འགྲོ…ངན་སོང་དུ་འགྲོ་བ（善趣·恶趣行） |\n| 章题 | 〈菩薩問明品第十〉 | 〈菩薩明難品第六〉 | 藏（前章结尾式）菩萨问现光章第十五 |\n\n> 藏问心性是一而种种差别（རང་བཞིན་གཅིག་པ…ཐ་དད་པ）与八十「云何見有種種差別」同问向，六十「云何能生種種果報」则转业果方向——**藏本问式近八十**〔本文判断〕；藏答主名 སངས་རྒྱས་དཔལ（佛德）与两汉译「覺首」不同——同会众而名表异（与品7 菩萨名异文同型）；藏章题（前章结尾式）菩萨问现光章——问＋光双立，可并观八十「問明」、六十「明難」之题眼差异。\n\n<details class=\"tri-appx\">\n<summary>🧭 开篇种子〔订正〕登记（L.361 · 证据留痕）</summary>\n\n**判定**：b2 bo_open 种子串与 ch14 同型错切（b2 生成器共用旧偏移口径之系统性缺陷·疑贯全表，各章开工前逐章预检）；本专题 seg1/seg2 为藏15 真开篇——不改正对勘批 b2，仅登记本订正\n\n**观察**：b2 ch15 之 bo_open（起 ་རེ་ན་ཡང་འཕགས་པའི་བདེན་པ·前导杂余 tsheg 同 ch14 粗切特征）在本文件 {T44-15}…{T44-16} 区间 norm() 后 find=-1——不在藏15 章界内；本专题 seg1（སངས་རྒྱས་རྨད་ག་ཅད་ཅེས་བྱ་བ…）自 {T44-15} 标记后逐字回源切出（folio 203b.2）\n\n**证据**（≥2 条独立佐证）：\n\n- b2 ch15 自记 fol=203b.2 ＝ 本专题 seg1 切片实测 folio=203b.2（同页）\n- 本 seg2＝byang chub sems dpa' sangs rgyas dpal la 'di skad ces smras so（「菩薩問覺首言」句式·問明品標幟問答），與 b2 zh80_open「菩薩問明品第十爾時，文殊師利菩薩問覺首菩薩言」義合\n- bo_open 串在藏15 章界 norm() 后 find=-1（与 ch14 记录同一失配模式）\n- 本六段经 extract_trilingual_segments.py 逐字 norm() 复验（verified=true·seg1 char_off=0 即章首）\n\n**后续**：同 ch14——b2 全表 bo_open 回改属对勘批 SSOT 变更须人工授权；M2 各章开工前逐章跑 G2.2 预检\n\n**机器检查**：`workspace/tibetan-avatamsaka-translation/tools/check_trilingual_gates.py::p_opening_matches_alignment（不一致章须命中本档 records 方 PASS）`\n\n</details>\n\n> 〔口径〕对勘批 `bo_open` 字段经 L.361 订正登记判为旧偏移错切，本页**不展示**该字段；藏文开篇一律以本专题逐字复验 seg1 为准。订正不改对勘批 SSOT（各照底本·铁律）。\n\n## 三、延伸阅读\n\n**本仓专篇与总纲**\n\n- [九九华严第十品〈菩萨问明品〉拼读专篇](huayan-wenming-pin.html) — 第二会·普光明殿：藏章15 对应汉品10（差5）\n- [华严经引读 · 系列总纲（§五 藏汉对应总表）](huayan-series-outline.html)\n- [华严经学 · 三十九品深度研究](huayan-studies.html) — 藏独有二章之法义归属见 §2.3\n- [九九华严第七品〈如来名号品〉拼读专篇](rulai-minghao.html) — 名号异文同型参看\n\n**开篇试译**（L.354a 术语表 · 〔本文试译〕）\n\n> 〔bam po 17〕尔时，文殊师利菩萨告佛德菩萨（སངས་རྒྱས་དཔལ）言：「佛子！同一自性之心，而有如是种种差别之相——往善趣者、往恶趣者、诸根具足者、诸根不具足者、受生同类者……」\n\n**数据源清单**（本页内容全部机械派生自下列库存）\n\n- 三语段数据层：`data/translation\\tibetan_avatamsaka_trilingual_segments_ch15.json`\n- 对勘批：`data/alignment\\tibetan_zhuhuju_b2.json`\n- 开篇订正登记：`data/alignment/tibetan_trilingual_opening_reconcile.json`\n- 试译术语表：`data/alignment/tibetan_shiyi_L354a.json`\n- 品目规划表：`data/alignment/tibetan_chinese_pin_plan_L360.json`\n",

};
(function () {
  function paneOf(el) {
    var root = document.getElementById('article-full');
    if (!root) return -1;
    var hs = root.querySelectorAll('h2.secfold');
    for (var i = 0; i < hs.length; i++) {
      if (el === hs[i]) return i;
      var b = hs[i].nextElementSibling;
      if (b && b.classList.contains('secfold-body') && b.contains(el)) return i;
    }
    return -1;
  }
  function fromHash() {
    var h = location.hash.slice(1);
    if (!h) return -1;
    var el = document.getElementById(h);
    return el ? paneOf(el) : -1;
  }
  function init() {
    var root = document.getElementById('article-full');
    if (!root || !root.querySelector('.secfold') || !root.querySelector('h2') || !root.querySelector('.tri-tabs')) return false;
    var hs = root.querySelectorAll('.secfold');
    for (var i = 0; i < hs.length; i++) {
      hs[i].classList.remove('is-folded');
      hs[i].setAttribute('aria-expanded', 'true');
    }
    // 窄屏页头换行可高达 200px+，固定 scroll-margin 会把锚点藏进页头 → 按实高同步
    function syncGap() {
      var top = document.getElementById('page-top');
      var gap = (top ? top.offsetHeight : 0) + 12;
      var as = document.querySelectorAll('.tri-anchor');
      for (var i = 0; i < as.length; i++) as[i].style.scrollMarginTop = gap + 'px';
    }
    syncGap();
    window.addEventListener('resize', syncGap);
    var lay = 'stack';
    try { lay = localStorage.getItem('triLayout') || 'stack'; } catch (e) {}
    window.__triLayout(lay);
    var tab = fromHash();
    if (tab < 0) {
      try { tab = parseInt(localStorage.getItem('triTab:tibetan-avatamsaka-trilingual-ch15') || '0', 10) || 0; } catch (e) { tab = 0; }
    }
    if (tab >= root.querySelectorAll('h2.secfold').length) tab = 0;
    window.__triTab(tab);
    root.addEventListener('click', function (e) {
      var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
      if (!a) return;
      var el = document.getElementById(a.getAttribute('href').slice(1));
      if (!el) return;
      e.preventDefault();
      var p = paneOf(el);
      if (p >= 0) window.__triTab(p);
      if (window._reveal) window._reveal(el);
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (history.replaceState) history.replaceState(null, '', a.getAttribute('href'));
    });
    window.addEventListener('hashchange', function () {
      var p = fromHash();
      if (p >= 0) window.__triTab(p);
    });
    return true;
  }
  function poll(n) { if (init()) return; if (n > 0) setTimeout(function () { poll(n - 1); }, 120); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { poll(20); });
  else poll(20);
})();
</script>
