  var NAMES = Object.keys(MAP).sort(function(a,b){return b.length-a.length;});
  var BASE = '../famai/shanhe.html';
  function skip(node){
    var p = node.parentElement;
    while(p && p !== document.body){
      var tag = p.tagName;
      if(tag==='A'||tag==='CODE'||tag==='PRE'||tag==='BLOCKQUOTE') return true;
      var cls = p.getAttribute ? (p.getAttribute('class')||'') : '';
      if(/\b(q|quote|cite-card|lic)\b/.test(cls)) return true;
      p = p.parentElement;
    }
    return false;
  }
  function linkify(){
    var root = document.getElementById('article-root');
    if(!root) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var edits = [];
    var tn;
    while((tn = walker.nextNode())){
      if(skip(tn)) continue;
      var text = tn.textContent;
      for(var i=0;i<NAMES.length;i++){
        var nm = NAMES[i], pos = text.indexOf(nm);
        if(pos < 0) continue;
        edits.push({node:tn, name:nm, pid:MAP[nm], pos:pos});
        break;
      }
    }
    for(var j=edits.length-1;j>=0;j--){
      var e = edits[j];
      var t = e.node.textContent;
      var idx = t.indexOf(e.name);
      if(idx < 0) continue;
      var before = t.slice(0, idx), after = t.slice(idx + e.name.length);
      var a = document.createElement('a');
      a.href = BASE + '?master=' + e.pid;
      a.className = 'lin-deeplink';
      a.title = '在山河法脉地图中展开 ' + e.name;
      a.textContent = e.name;
      var frag = document.createDocumentFragment();
      if(before) frag.appendChild(document.createTextNode(before));
      frag.appendChild(a);
      if(after) frag.appendChild(document.createTextNode(after));
      e.node.parentNode.replaceChild(frag, e.node);
    }
    if(edits.length) console.log('[lin-deeplink] linked %d mentions' % edits.length);
  }
  if(document.readyState==='complete') setTimeout(linkify,100);
  else window.addEventListener('load', function(){ setTimeout(linkify,100); });
})();
</script>

<script>
var ARTICLE = {"id": "huayan-jingxing-pin", "file": "articles/huayan-jingxing-pin.html", "title": "九九华严第十一品 净行品之拼读", "title_sub": "华严经第十一品·第二会·差别因果周·八十卷十四首品·智首菩萨二十云何问·文殊答一百四十一当愿众生（善用其心）·⻑分為十十段·誓数多源对验（依八十141·澄观慧苑／依六十140·法藏智俨）·注疏五家会读（澄观·法藏·智俨·慧苑·李通玄＋海云）·与六十《淨行品第七》对读·数据层·未完备已标明", "icon": "📖", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第二会_普光明殿_差别因果周/华严经细读_第十一部_净行品.md", "doc_md": "# 华严经细读·第十一部：净行品（卷十四·品十一）\n\n> **EN · Close Reading of the Avataṃsaka Sūtra, Part G: Chapter Eleven — *Pure Practices*（净行品）**（品题英译依 `data/catalog/chapters.yaml` order 11 · title_en 直证〔L.184 取定〕；藏译对应**存二源分歧**——`chapters.yaml` order 11 记 in_tibetan=1，而 `diff_matrix.yaml` 另一「净行品」条记 in_tibetan=0／藏文无直接对应，见 §6.4·〔待核·编目二源未裁〕）\n>\n> **底本**：唐·实叉难陀译《大方广佛华严经》（八十华严）`T10n0279`。**范围：卷第十四·净行品第十一（本品全文）**。本品属**第二会「普光明殿会」·差别因果周**，承第十品《菩萨问明》（十信之「解」）之后，为第二会「能依能信之行」段的**中行**——问明明「解」，净行明「行」，贤首明「德」，三品共成十信（澄观、李通玄并判，见 §五）。全品为**智首菩萨设问、文殊师利菩萨以「一百四十一誓」酬答**之一大问答：智首以「二十云何」总问菩萨因行果德（澄观判「总十一段·段各十句·成一百一十种德」），文殊不直答其数，而翻转为**日用万行中的「当愿众生」巧愿**——从「菩萨在家」至「睡眠始寤」，历出家、入道、行住坐卧、游涉乞食、见境接触，**遇的每一件事都回向众生、转成法义**，末以「若诸菩萨善用其心，则获一切胜妙功德」结叹。此是《华严》**「以愿导行·即事而真·日用即道」**实践论之总纲，亦汉传「**善用其心**」一语最古之出处。\n> **立稿**：2026-10-25。承第一会六部及第二会前四部（第七至第十部）之体例与校勘纪律。\n> **本篇进度（覆盖率自陈）**：**全稿成篇**——§〇 凡例、§一 概述与品题解义、§二 全文逐段细读（智首二十问·文殊一百四十一誓十段·结叹）、§三 旁参与前接、§四 义理要点与名相、§五 注疏选要·诸家会读（5.1 澄观／5.2 法藏／5.2′ 智俨／5.2″ 慧苑／5.3 李通玄／5.3′ 海云讲记／5.4 小结）、§六 文本对读与校勘（八十／六十·誓数差一之定位·校勘记）、§七 结构分析·数据层（7.1–7.4）、§八 附录、§九 台账，**皆已成**。本品六十辅读以 **STEP0 新入库 `T09n0278_juan6.txt`（L.181）** 逐字回源。凡未能确证者标〔待核〕、属推断者标〔本文判断〕；**不以骨架冒充细读**。\n> **原则**：沿用既定校勘纪律、三层疏解（疏解／名相／会读）、存疑必标、推断必标「〔本文判断〕」、讲者之说疑误只标不改、三译主从分明、不擅改经文、可回源可复核。**引注疏原文一律繁体照底本、逐字回源并注经号与段落；会读按语用简体。**\n\n---\n\n## 〇　凡例\n\n1. **引文体例**：经文、注疏一律**繁体照底本、逐字回源**，括注经号与字符位（如 `T10n0279`@120266）。会读、疏解、按语用简体。\n2. **信度标识**：〔待核〕存疑未确证；〔本文判断〕属笔者推断，非疏家定论；〔讲师玄谈·非正行〕海云讲记玄谈段；⚖ 诸家异说并记不裁断。\n3. **主从分明**：八十为正本，六十（`T09n0278` 卷六《净行品第七》）为辅读对勘本，四十无本品，藏译编目记载不一（见 §6.4）。\n4. **异文不统一**：两译自歧处各照其底本，不据一译改另一译。\n5. **数须实测**：品内一切计数（字数／问句数／誓数／段数／句读）**皆由 §7.4 复算脚本实测得出，不手录、不臆造**。本品誓数旧说「一百四十一」，须以底本实计对验（见 §六·§七）。\n\n---\n\n<!-- ATLAS:BEGIN P11 -->\n### 〇之零、导读指南（阅读路径与方法）\n\n**定位：** 考证型细读（philological close reading），以「可复核性」为第一优先。本品为十信之**行**门，读法当**随事而读**：一百四十一誓，遇一事发一愿，自晨起盥漱至夜寐始寤，一日之历即全部修行。\n**本品一句：** **善用其心**四字，是全品之总持；一百四十一誓，只是此四字在日用中的一百四十一次落地。\n**路径：** 〇之二（二图四表）→ 一（品题与脉络）→ 二（全文逐段）→ 四（义理与名相）→ 五（诸家会读）→ 七（数据层）→ 附录按需查阅。\n**方法：** 先经文后诠释；〔实测〕／〔本文判断〕／〔存疑待核〕三分；负面证据同样入账；结构覆盖 100%，个体择要。\n**读前三问：** ① 一百四十一誓何以分为十段，十段之次第依何而立？② 八十作 141、六十作 140，此一誓之差当如何处置？③ 全品无偈颂、纯长行问答，与问明品之偈答判然——何以故？\n\n## 〇之二、本品内容地图（未入其门，先观其海）\n\n> **本节体例。** 图与表之数据，一律取自本文已回源核定之 §二逐段表与 §7.1／§7.5 实测数；**凡属推断者标〔本文判断〕，不入图**。图各看一事，勿求一图而尽本品。\n\n### 〇之二.0 提要\n\n本品八十侧**净身 CJK 2,968 字**（含标点 raw 3,719），六十侧《净行品第七》2,895 字。**全品为纯长行问答**：智首菩萨「二十云何」总问，文殊「一百四十一誓」别答，末以「如是用心，所不能动」结叹。实测**颂 ×0、偈 ×0**——与问明之「以颂答曰」偈颂酬答体判然不同。誓式一律作「……，當願眾生：……，……。」（八十侧「當願眾生」后全用冒号「：」·141 见；六十侧全用逗号「，」·140 见），**两译标点体式 0 交叉**。\n\n| 图 | 画什么 | 一句话 |\n|---|---|---|\n| **图 〇-1　一百四十一誓十段量图** | 愿有多少 | 11·15·7·6·7·55·22·5·10·3＝141，段段与澄观疏家数全合 |\n| **图 〇-2　两译一誓之差·体式对勘图** | 异译何别 | 八十 141／冒号；六十 140／逗号；0 交叉 |\n\n**〔读法之序〕**　先观图 〇-1 得十段之量与次第，次观图 〇-2 辨两译一誓之差，次读〇之二.3 之坐标，然后入 §二逐段。**数既定，然后味其愿。**\n\n> **EN corresponding · Map of the Chapter.** A chapter of pure prose: Zhi Shou asks twenty questions, Mañjuśrī answers with 141 vows, each triggered by an everyday act — waking, washing, walking, eating, sleeping. Not one verse in the whole chapter. The eighty-fascicle text has 141 vows, the sixty-fascicle text 140, and the punctuation of the vow-formula never crosses over between the two. Fig. 0-1 weighs the ten sections; Fig. 0-2 sets the one-vow difference side by side.\n\n### 〇之二.1 图 〇-1　一百四十一誓十段量图\n\n<figure>\n<svg viewBox=\"0 0 1000 520\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"24\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">一百四十一誓：十段之量（1 誓＝8px）</text>\n<text x=\"500\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a7a5e\">实测数与澄观疏家数逐段全合（§7.4）；段名依澄观「長分為十」之科</text>\n\n<g font-size=\"11.5\" fill=\"#5a5147\">\n<text x=\"24\" y=\"86\">一 · 在家</text><rect x=\"150\" y=\"70\" width=\"88\" height=\"22\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"248\" y=\"86\" fill=\"#7a5a28\">11</text>\n<text x=\"24\" y=\"122\">二 · 出家受戒</text><rect x=\"150\" y=\"106\" width=\"120\" height=\"22\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"280\" y=\"122\" fill=\"#7a5a28\">15</text>\n<text x=\"24\" y=\"158\">三 · 坐禅观</text><rect x=\"150\" y=\"142\" width=\"56\" height=\"22\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"216\" y=\"158\" fill=\"#7a5a28\">7</text>\n<text x=\"24\" y=\"194\">四 · 披挂三衣</text><rect x=\"150\" y=\"178\" width=\"48\" height=\"22\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"208\" y=\"194\" fill=\"#7a5a28\">6</text>\n<text x=\"24\" y=\"230\">五 · 澡漱盥洗</text><rect x=\"150\" y=\"214\" width=\"56\" height=\"22\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"216\" y=\"230\" fill=\"#7a5a28\">7</text>\n<text x=\"24\" y=\"266\">六 · 乞食道行</text><rect x=\"150\" y=\"250\" width=\"440\" height=\"22\" fill=\"#f7ecd2\" stroke=\"#b8863c\" stroke-width=\"1.4\"/><text x=\"600\" y=\"266\" font-weight=\"bold\" fill=\"#7a5a28\">55</text>\n<text x=\"24\" y=\"302\">七 · 到城乞食</text><rect x=\"150\" y=\"286\" width=\"176\" height=\"22\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"336\" y=\"302\" fill=\"#7a5a28\">22</text>\n<text x=\"24\" y=\"338\">八 · 还归洗浴</text><rect x=\"150\" y=\"322\" width=\"40\" height=\"22\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"200\" y=\"338\" fill=\"#7a5a28\">5</text>\n<text x=\"24\" y=\"374\">九 · 讽诵旋礼</text><rect x=\"150\" y=\"358\" width=\"80\" height=\"22\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"240\" y=\"374\" fill=\"#7a5a28\">10</text>\n<text x=\"24\" y=\"410\">十 · 寤寐安息</text><rect x=\"150\" y=\"394\" width=\"24\" height=\"22\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"184\" y=\"410\" fill=\"#7a5a28\">3</text>\n</g>\n\n<line x1=\"150\" y1=\"430\" x2=\"950\" y2=\"430\" stroke=\"#d3c7ae\"/>\n<text x=\"24\" y=\"456\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#b8863c\">合计 141</text>\n<text x=\"120\" y=\"456\" font-size=\"12\" fill=\"#5a5147\">「當願眾生」×141（八十侧·实计）　·　问段「云何」×20（另答端起首 ×1，全品 ×21）</text>\n<text x=\"24\" y=\"482\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 段六独得 55 誓，占全品四成——「乞食道行」历时最久、触境最多，故愿亦最多。愿数随事，非随义。</text>\n<text x=\"24\" y=\"504\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 十段之次第即一日之次第：晨起→出家→坐禅→披衣→盥洗→入城→乞食→还归→诵礼→寝息。<tspan fill=\"#7a5a28\">经之结构，即生活之结构</tspan>。</text>\n</svg>\n<figcaption><b>图 〇-1　一百四十一誓十段量图。</b>十条之量，一望而知：<b>段六「乞食道行」55 誓，独居其四成</b>；而首尾二段（在家 11、寤寐 3）皆短。愿数之多寡，随历时之久暂、触境之疏密，<b>非按义理分配</b>。十段之次第，即一日之次第——<b>经的结构就是生活的结构</b>〔本文判断〕。<div class=\"en-line\">Fig. 0-1. Ten sections by weight. The sixth — begging and walking the road — holds fifty-five of the 141 vows, four tenths of the chapter; the first and last are short. The vows are distributed by how long an activity lasts and how many things it meets, not by doctrinal importance. The order of the ten sections is the order of a single day.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. **愿数随事，不随义。** 若以为 55 誓必关最胜之义，则误；**乞食道行历时最久、所见最多，故愿最多**——此华严「即事而真」之最朴素的证明。\n2. **一日即一生。** 十段自晨起至寝息，**循环一次即一日，循环一生即一生**；故读此品，不当作「举例」读，当作「日程」读。\n3. **誓式一律，而所对之境无一重复。** 141 次「當願眾生」，141 个不同情境——**同式而不同境，正是「善用其心」之法**。\n\n### 〇之二.2 图 〇-2　两译一誓之差·体式对勘图\n\n<figure>\n<svg viewBox=\"0 0 1000 440\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"24\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">一誓之差与一体之异：八十 141／六十 140</text>\n<text x=\"500\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a7a5e\">两译「當願眾生」计数与标点体式，实测 0 交叉（§6.1）</text>\n\n<rect x=\"60\" y=\"72\" width=\"400\" height=\"180\" rx=\"5\" fill=\"#f8f3ea\" stroke=\"#c9b98f\"/>\n<text x=\"80\" y=\"96\" font-size=\"13\" font-weight=\"bold\" fill=\"#7a5a28\">八十华严 · `T10n0279` 卷十四</text>\n<text x=\"80\" y=\"118\" font-size=\"11.5\" fill=\"#8a7a5e\">实叉难陀译 · 本品为「淨行品第十一」</text>\n<text x=\"80\" y=\"152\" font-size=\"12\" fill=\"#5a5147\">「當願眾生」</text>\n<text x=\"212\" y=\"152\" font-size=\"13\" font-weight=\"bold\" fill=\"#b8863c\">141</text>\n<rect x=\"80\" y=\"164\" width=\"352\" height=\"14\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><rect x=\"80\" y=\"164\" width=\"352\" height=\"14\" fill=\"#d9c9a4\"/>\n<text x=\"80\" y=\"204\" font-size=\"12\" fill=\"#5a5147\">式：<tspan font-family=\"monospace\">「……，當願眾生：……，……。」</tspan></text>\n<text x=\"80\" y=\"226\" font-size=\"11.5\" fill=\"#8a7a5e\">冒号「：」141 见　·　逗号「，」0 见</text>\n\n<rect x=\"540\" y=\"72\" width=\"400\" height=\"180\" rx=\"5\" fill=\"#f3ecdf\" stroke=\"#c9b98f\"/>\n<text x=\"560\" y=\"96\" font-size=\"13\" font-weight=\"bold\" fill=\"#7a5a28\">六十华严 · `T09n0278` 卷六</text>\n<text x=\"560\" y=\"118\" font-size=\"11.5\" fill=\"#8a7a5e\">佛驮跋陀罗译 · 本品为「淨行品第七」</text>\n<text x=\"560\" y=\"152\" font-size=\"12\" fill=\"#5a5147\">「當願眾生」</text>\n<text x=\"692\" y=\"152\" font-size=\"13\" font-weight=\"bold\" fill=\"#b8863c\">140</text>\n<rect x=\"560\" y=\"164\" width=\"350\" height=\"14\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/>\n<rect x=\"910\" y=\"164\" width=\"10\" height=\"14\" fill=\"none\" stroke=\"#b8863c\" stroke-dasharray=\"2 2\"/>\n<text x=\"560\" y=\"204\" font-size=\"12\" fill=\"#5a5147\">式：<tspan font-family=\"monospace\">「……，當願眾生，……，……。」</tspan></text>\n<text x=\"560\" y=\"226\" font-size=\"11.5\" fill=\"#8a7a5e\">逗号「，」140 见　·　冒号「：」0 见</text>\n\n<line x1=\"60\" y1=\"276\" x2=\"960\" y2=\"276\" stroke=\"#e0d6c2\"/>\n<text x=\"60\" y=\"302\" font-size=\"12\" fill=\"#7a5a28\">一誓之差：六十少一誓（虚线处）。<tspan font-weight=\"bold\">两译各照底本，不互补、不裁改、不统一。</tspan></text>\n<text x=\"60\" y=\"328\" font-size=\"11.5\" fill=\"#8a7a5e\">旧说「一百四十一」出于疏家料简语（`T1736`@30159）与讲记，本篇不取旧说为准，而以底本逐誓实计——八十坐实 141，六十得 140。</text>\n<text x=\"60\" y=\"354\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 标点体式 0 交叉，是两译「译者之笔」最清晰的指纹：<tspan fill=\"#7a5a28\">同为一事，一用冒号领起，一用逗号连读</tspan>。</text>\n<text x=\"60\" y=\"380\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 全品颂 ×0、偈 ×0（实测）；与问明「以頌答曰」×10、贤首偈颂为主，恰成第二会文体之三极。</text>\n<text x=\"60\" y=\"406\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 数之差须记，义之同须辨：<tspan fill=\"#7a5a28\">一誓之失，不碍十段之同；十段之同，不掩一誓之失</tspan>。〔本文判断〕</text>\n</svg>\n<figcaption><b>图 〇-2　两译一誓之差·体式对勘图。</b>两译并列，一誓之差以虚线标出。<b>八十 141（冒号）、六十 140（逗号），体式 0 交叉</b>——这不是谁对谁错，而是两支译笔各自的指纹。<b>故本篇不取旧说「一百四十一」为准，而以底本逐誓实计</b>：八十坐实 141，六十得 140。<b>异文各照底本，不互补、不裁改、不统一</b>——此为全篇铁律。<div class=\"en-line\">Fig. 0-2. Two translations side by side, the single missing vow marked in dotted line. Eighty: 141 vows, colon after 「當願眾生」. Sixty: 140 vows, comma throughout. The punctuation never crosses over — a fingerprint of two translator-hands, not an error to be corrected. The rule: each witness stands as it stands; no filling in, no harmonising.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. **「少一誓」是文本事实，不是义理缺陷。** 记录它、标明它、不修补它——**负面的文本证据与正面的同样重要**。\n2. **标点亦是证据。** 冒号／逗号 0 交叉，说明两支译笔对「誓」的句法理解不同：一为「领起」，一为「连读」。**此非小节，乃译本之体质**。\n3. **与贤首品对看，见第二会文体之三极。** 净行纯长行（颂 0）、问明偈答（颂 10）、贤首偈颂为主（颂 1 而偈 3）——**同一会中，三品三体**。\n\n### 〇之二.3 本品在第二会（普光明殿·说十信）之坐标\n\n本品为第二会第五品，**十信三品（解·行·德）之「行」**。李通玄判「又說光明覺品、菩薩問明品、淨行品、賢首品，成就十信之門」；澄观判净行「收前行願，成信德用」——**解而后行，行而后德**。\n\n| 品 | 卷 | 位／科 | 一句提撕 | 与本品之关系 |\n|---|---|---|---|---|\n| 9 光明觉 | 卷13 | 所信果·意业 | 十段遍照 | 果境之毕 |\n| 10 问明 | 卷13 | 十信·**解** | 九首递问 | 解为行本 |\n| **11 净行（本品）** | 卷14 | 十信·**行** | 141 誓，遇事发愿 | 解而后行 |\n| 12 贤首 | 卷14–15 | 十信·**德** | 信为道元功德母 | 行而后德，十信满心 |\n\n### 〇之二.4 本品形式特征（与邻品对看）\n\n本品之特色在**「纯长行而无偈」**：全部三十九品中，以一百四十一条同式誓愿构成一品、且不出一偈者，唯此一品〔本文判断·据本文所核诸品文体〕。其「行」不在玄谈，而在**漱口、着衣、见山、见河、入城、乞食、洗足、睡眠**。\n\n| 特征 | 本品表现〔实测〕 | 邻品之对照 | 读法上的后果 |\n|---|---|---|---|\n| 纯长行 | 颂 ×0、偈 ×0（实测） | 问明「以頌答曰」×10；贤首偈颂为主 | 第二会文体之三极 |\n| 同式复沓 | 「當願眾生」×141，式无二致 | 第七品「或名」×211（名号复沓） | 一以愿复沓，一以名复沓 |\n| 数有异文 | 八十 141／六十 140；冒号／逗号 0 交叉 | 第八品名号 440 两译大体同 | 异文处置之范例 |\n| 即事为道 | 所对之境：家·戒·禅·衣·漱·道·食·归·塔·寝 | 问明所对之境：心·法·业·福田 | 一在境上修，一在理上解 |\n| 日用收束 | 以「睡眠始寤，當願眾生：一切智覺，周顧十方」终 | 贤首以「信为道元」总摄 | 一以一日终，一以一信始 |\n\n### 〇之二.5 五种读法（导览）\n\n| 读法 | 路径 | 适合谁 | 得什么 |\n|---|---|---|---|\n| **段读** | 只读十段之首誓与末誓 | 初读本篇者 | 得一日之次第 |\n| **愿读** | 逐愿读，遇己身所历之事即止 | 欲起行者 | 愿愿可落于今日 |\n| **式读** | 只读 141 个「當願眾生」之后半句 | 好文法者 | 见「转事成愿」之句法 |\n| **校读** | §6.1 六十对读＋图 〇-2 | 欲核异文者 | 得 141／140 之实与体式之别 |\n| **承读** | 本品 §2.4 → 第十二品 §2.2 | 欲见行德相成者 | 见「行」如何成「德」 |\n\n### 〇之二.6 数与位之谱：本品之数，四等分录\n\n华严之数非计数之数。本品所涉之数，来源不一，性质亦不一；**先分其等，后论其义**，则不为数目所惑。\n\n| 等第 | 数 | 出处 | 性质 |\n|---|---|---|---|\n| **T0 经文明文** | 「當願眾生」×141（八十） | `T10n0279` 卷十四 | 誓数（本文实计，坐实旧说） |\n| **T0 经文明文** | 「云何」×20（问段） | 同上·问端 | 问事数 |\n| **T0 本文实测** | 2,968 字（CJK 净身） | §7.4 脚本 | 计数（本文自测） |\n| **T0 本文实测** | 十段 11·15·7·6·7·55·22·5·10·3 | §7.4 实测 | 计数（本文自测） |\n| **T1 澄观《疏》** | 「淨行品百四十一願」「長分為十」 | `T1735`@193301；`T1736`@30159 | 注疏之数，与实测全合 |\n| **T1 法藏《探玄记》** | 「始終隨事發願無空過」 | `T1733`@134720 | 释「即事」之旨 |\n| **T2 讲记** | 承「一百四十一」之说 | 海云继梦讲记 | 转述，与底本实计合 |\n\n> **〔读法〕** 本品之数有一特殊：**旧说（141）与实测（141）相合，而六十本（140）不合**。故本篇之立场为——**不因旧说而信，不因旧说而疑；以底本实计为准，两译各记其数**。此为「数须对验」之最典型一例。\n\n<!-- ATLAS:END P11 -->\n\n## 一　概述\n\n### 1.1 品题解义\n\n**淨行品第十一**（八十·卷十四）；**淨行品第七**（六十·卷六）。\n\n- **「净行」释义（澄观）**：「**梵云具折囉。此云所行。波利此云皆也遍也。戍輪律提云清淨也。謂三業隨事緣歷名為所行巧願防非離過成德。名為清淨。又悲智雙運名為所行。行越凡小故稱清淨。以二乘無漏。不能兼利非真淨故。得斯意者。舉足下足盡文殊心。見聞覺知皆普賢行**」（`T1735`@188478·§5.1）。是知「净行」＝三业随事而发、以巧愿防非成德之清净所行，**「所行即淨」持业释**。\n- **法藏释名（依梵本）**：「**依梵本名圓淨行品。無性攝論中名清淨所行經。謂三業無過云清淨。心起願稱行。行順普法名圓。此持業釋。又淨是理。行是智。理智無礙為圓。依主釋也。又願是能淨。行是所淨。令行光潔。稱性名圓。以是普賢願行故也。又願無垢名淨。即願是行故云淨行**」（`T1733`@131882·§5.2）。——八十题「净行」，法藏所据旧梵本作「**圆净行**」，增一「圆」字显「行顺普法」之义。〔本文判断〕「圆净行」与「净行」义同而广狭有措辞之差，非二品。\n- **慧苑梵名（直证）**：「**梵本云。具折羅波唎戍提。(戍音作輸律反)言具折囉者。所行也。波唎者皆也。遍也。戍提者清淨也。謂由善用心令三業六根於所行三性境皆隨所應成信願行故。云所行皆清淨也**」（`X0221`@135060·§5.2″）。与澄观释名同源而缀音读，是慧苑刊定记**有净行品专段**之直证（对照问明品之无记·L.183）。\n- **来意（承前问明）**：澄观「**夫欲階妙位必資勝行。有解無行虛費多聞。故前品明解此品辨行。又前明入理觀行。今辨隨事所行**」（`T1735`@188398）；慧苑「**前品明信中之慧解。今明信中三願行故。次來也**」（`X0221`@135185）；智俨「**二來意。所以來。依解起行故也。亦可前行次願故也。三以諸願為宗**」（`T1732`@28960）。三家同判：**问明辨「解」、净行辨「行」**，解行相须。\n\n### 1.2 品位与脉络（承上启下）\n\n本品在**第二会·普光明殿**（差别因果周·说十信）。第十品《菩萨问明》明十信之「解」，净行继明十信之「行」，为贤首「德」之先导。三条脉络须并观：\n\n- **会内次**：名号（身业·遍应）→四圣谛（口业·说法）→光明觉（意业·遍觉）→问明（十信之**解**）→**净行（十信之**行**）**→贤首（十信之德）——净行居中，由解起行。\n- **三品共成十信**：李通玄「又說光明覺品菩薩問明品**淨行品**賢首品。**成就十信之門**」（`T1739`@41813）；又判净行「**明信菩薩淨行從大願力生**」（`T1739`@73833）。\n- **行解相即之纲**（承 L.183 演钞链）：问明「明解」→净行「辨行」→贤首「显德」，三品共成十信法门，净行为「行」之集中展示。\n\n### 1.3 篇幅与结构量级（实测）\n\n本品八十侧**净身 CJK 2,968 字**（剥空白含标点 raw **3,719**·品界 @120266–124463，止锚「賢首品第十二」首见，见 §7.4）；六十侧《净行品第七》**净身 CJK 2,895 字**（剥空白含标点 3,630·raw 含换行 3,821·`juan6.txt`@391–4212）。**问端「爾時」×2**（问起 idx0／答起 idx652·实测），全品为**纯长行问答**——**「頌」×0、「偈」×0**（实测），与问明之「以頌答曰」偈颂酬答体**判然不同**：净行不立偈颂，而以智首**「二十云何」总问**、文殊**「一百四十一誓」长行别答**构成。誓式一律作「**……，當願眾生：……，……。**」（八十侧「當願眾生」后**全用冒号「：」·实测 141 见·无逗号「，」例），六十侧则**全用逗号「，」**（实测 140 见·无冒号例）——两译标点体式 0 交叉（§6.1）。\n\n> **数须对验之声明**：旧说净行誓数「一百四十一」（澄观疏家料简语「淨行品百四十一願」·`T1736`@30159；海云讲记同承），本品**不取旧说为准**，而以底本逐誓实计：八十侧**當願眾生×141**（旧说坐实·直证），六十侧**當願眾生×140**（**少一誓**·重要两译对勘项·详见 §六）。问事数：实测问段「云何」×20（另答段起首「佛子！云何用心……」×1，全品「云何」×21），与讲记「智首菩萨二十问」合（§5.3′）。\n\n### 1.4 核心要义（画龙点睛·EN）\n\n1. *Use the mind skillfully in every situation* — \"If bodhisattvas skillfully employ their mind, they will attain all supreme merits\" (善用其心則獲一切勝妙功德); this single phrase is the earliest canonical source of the Chinese Huayan motto \"善用其心,\" recast here from a doctrinal answer into a daily practice (§2.2, the chapter's signature line).\n2. *Turn every ordinary act into a vow for others* — from \"being at home,\" \"filial to parents,\" \"putting on the robe,\" \"washing the feet,\" to \"seeing a high road or a thorn tree,\" each of the 141 vows redirects a mundane moment into a wish for all beings' liberation: defilement is not abandoned but *turned* into dharma (§2.3, the ten-block vow cycle).\n3. *Understanding (解) must be completed by practice (行)* — Chengguan frames this chapter as the answer to the preceding 问明: \"understanding without practice wastes learning\" (有解無行虛費多聞); faith's \"understanding\" (问明) is here given its \"practice\" (净行) before its \"virtue\" (贤首) (§5.1).\n\n### 1.5 经文文本现象与信度标识\n\n- **「善用其心」总标—别答—结叹三段式（直证）**：文殊答端先**总标**「佛子！若諸菩薩**善用其心**，則獲一切勝妙功德」（@答段起·§2.2），继以一百四十一誓**别显**行相，末**结叹**「佛子！若諸菩薩**如是用心**，則獲一切勝妙功德……所不能動」（@品末·§2.4）。慧苑三段科：「**上來有三。一總徵成德之用心。二別顯用心之行相。三總結用心之勝能。總明第二能成因行竟**」（`X0221`@144865·§5.2″）；澄观同判「**第二佛子云何下。指事顯因於中三。初總徵次別顯。後總結成益**」（`T1735`@192117·§5.1）。〔本文判断〕「善用其心—如是用心」首尾呼应，是全品结构之脊，非疏家附会。\n- **无偈颂·纯长行**：实测「頌」「偈」皆×0——与同会问明（偈答体）、贤首（偈颂为主）相反，净行通体长行发愿，是「行门」质地的文体表征。\n- **问数「二十」与誓数「一百四十一」不同源**：智首问以「二十云何」为纲（澄观判「总十一段·段各十句·成一百一十种德」·§5.1），文殊答以「一百四十一」事愿为别——**问是「德数」（因行果德之归类），答是「行数」（日用巧愿之历事），二者本不相属**，故不可因誓数多于问数而疑经文。〔本文判断〕讲记「智首二十问」（§5.3′）指问段，非答段。\n- **止锚「賢首品第十二」全档二见（P12 锚规则须防·直证）**：实测八十全档「賢首品第十二」见**2 次**，idx **[124463, 129634]**——首见 @124463 为净行品**真止锚**（本品界之尾），第二见 @129634 系**卷十五首重题**（列品目处）。〔本文判断〕P12 贤首品起锚须取首见 @124463，若误用第二见将漏卷十四末段（承 L.183「品题唯一见锚口径」之诫·本品题「淨行品第十一」则全档唯一见·可作起锚断言）。\n\n---\n\n## 二　全文逐段细读\n\n### 2.1 问端·智首菩萨「二十云何」（@120266–）\n\n品题「**淨行品第十一**」后，即入问端（实测问段「云何」×20）：\n\n> 爾時，智首菩薩問文殊師利菩薩言：「佛子！菩薩云何得無過失身、語、意業？云何得不害身、語、意業？云何得不可毀身、語、意業？云何得不可壞身、語、意業？云何得不退轉身、語、意業？云何得不可動身、語、意業？云何得殊勝身、語、意業？云何得清淨身、語、意業？云何得無染身、語、意業？云何得智為先導身、語、意業？云何得生處具足、種族具足、家具足、色具足、相具足、念具足、慧具足、行具足、無畏具足、覺悟具足？云何得勝慧、第一慧、最上慧、最勝慧、無量慧、無數慧、不思議慧、無與等慧、不可量慧、不可說慧？云何得因力、欲力、方便力、緣力、所緣力、根力、觀察力、奢摩他力、毘鉢舍那力、思惟力？云何得蘊善巧、界善巧、處善巧、緣起善巧、欲界善巧、色界善巧、無色界善巧、過去善巧、未來善巧、現在善巧？云何善修習念覺分、擇法覺分、精進覺分、喜覺分、猗覺分、定覺分、捨覺分、空、無相、無願？云何得圓滿檀波羅蜜、尸波羅蜜、羼提波羅蜜、毘梨耶波羅蜜、禪那波羅蜜、般若波羅蜜，及以圓滿慈、悲、喜、捨？云何得處非處智力、過未現在業報智力、根勝劣智力、種種界智力、種種解智力、一切至處道智力、禪解脫三昧染淨智力、宿住念智力、無障礙天眼智力、斷諸習智力？云何常得天王、龍王、夜叉王、乾闥婆王、阿脩羅王、迦樓羅王、緊那羅王、摩睺羅伽王、人王、梵王之所守護，恭敬供養？云何得與一切眾生為依、為救、為歸、為趣、為炬、為明、為照、為導、為勝導、為普導？云何於一切眾生中，為第一、為大、為勝、為最勝、為妙、為極妙、為上、為無上、為無等、為無等等？」\n（`T10n0279` 卷十四·逐字（`_e11_full.py` 品内 div 结构化·`_e11_dump.txt`／`_e11_vows.txt`）·`80-01|p|@87079|CJK509` 全引〔L.189 本批·原缩略引文全量化〕·二十「云何」实测见 §7.4）\n（按：两译引文**引号皆照底本作「」**——实测八十·六十两侧品内「各 4·」各 2·**『』各 0**（`_p11_cite5.py`）·不另加异式引号。）\n\n- **疏解**：二十「云何」句，澄观判为「**二陳所問中。有二十云何。總十一段。段各十句。成一百一十種德**」（`T1735`@189279·§5.1）——前九句各问「身、語、意業」之一种功德（无过失／不害／不可毁／不可坏／不退转／不可动／殊胜／清净／无染／智为先导），后十一句分问生处具足、慧、力、善巧、觉分、度、力（十力）、天王守护、为众生依导、于众生中第一等。文殊不逐条数答，而**翻转为一百四十一事愿**，以「行」摄「德」。\n- **名相**：**身語意業**（三业）——菩萨修行之总纲；**智為先導**（三业以智为上首·澄观「後一總出其因。若以智慧為先導。身語意業常無失故」·`T1735`@189828·另「不隨於癡故智為先導。所作稱真」同段）；**蘊界處善巧**（蕴、界、处三科之善巧）；**念覺分～捨覺分**（七菩提分）；**檀～般若波羅蜜**（六度）。\n- **六十对读**：六十侧问段作「**爾時，智首菩薩問文殊師利言：「佛子！云何菩薩不染身、口、意業，不害身、口、意業，不癡身、口、意業……云何菩薩生處成就，姓成就，家成就……？」**」——实测「云何」×11（八十作 20 云何句·§6.1）。两译问段**条目次第略异**（八十「無過失」首、六十「不染」首；八十分「身、語、意」，六十合「身、口、意」），系两译科段与译词之别，非所问之旨之异。\n\n### 2.2 答端·总标「善用其心」（@答段起 idx652）\n\n> 爾時，文殊師利菩薩告智首菩薩言：「善哉！佛子！汝今為欲多所饒益、多所安隱，哀愍世間，利樂天人，問如是義。佛子！**若諸菩薩善用其心，則獲一切勝妙功德**；於諸佛法，心無所礙，住去、來、今諸佛之道；隨眾生住，恒不捨離；如諸法相，悉能通達；斷一切惡，具足眾善；**當如普賢，色像第一，一切行願皆得具足**；於一切法，無不自在，而為眾生第二導師。佛子！云何用心能獲一切勝妙功德？佛子！」\n\n- **疏解**：文殊先**叹问**（善哉·为多饶益故问），再**总标答宗**——「**善用其心，则获一切胜妙功德**」是全品眼目。此句将智首「如何得……功德」之问，转化为「**用心**」之实践命题：**功德不从外得，从善用其心得**。随即「当如普贤，一切行愿皆得具足」，点明此「用行之心」即普贤愿海之行。末「云何用心能获一切胜妙功德？佛子！」一转，铺出一百四十一誓以为「用心」之别显。\n- **名相**：**善用其心**（本典核心命题·汉传「善用其心」之出处）；**第二導師**（佛为第一、菩萨为第二·导众生者）；**普賢**（行愿之主·澄观「見聞覺知皆普賢行」）。\n- **六十对读**：六十侧答端作「**爾時，文殊師利答智首菩薩曰：「善哉！善哉！佛子！多所饒益……佛子！菩薩成就身、口、意業，能得一切勝妙功德……色像第一，悉如普賢大菩薩等……而為眾生第二尊導。佛子！何等身、口、意業能得一切勝妙功德？」**」——关键异文：八十「**若諸菩薩善用其心，則獲一切勝妙功德**」，六十「**菩薩成就身、口、意業，能得一切勝妙功德**」（§6.1）。〔本文判断〕**八十「善用其心」对六十「成就身口意业」，是两译最著一义差**：八十凸显「用心」主体，六凸显「三业」成就；讲记「賢首改『圓滿身語意業』為『善用其心則獲勝妙功德』」之说（§5.3′）即着眼于斯；然实测**两译底本均无「圓滿身」三字**（80=0·60=0）·六十答端作「**成就身、口、意業**」——讲者所据乃口诵，**只标不改**〔讲者口诵·与底本不合〕。\n\n### 2.3 别答·一百四十一誓十段（@答段·实测 §7.4）\n\n文殊一百四十一「當願眾生」誓，澄观依历事次第判为「**長分為十**」（`T1735`@193301·§5.1）；实测八十侧誓数**逐段与疏家全合**（11/15/7/6/7/55/22/5/10/3，合计 141·§7.4）。十段如下：\n\n| 段 | 起讫（情形词） | 实测誓数 | 澄观疏家数 | 义类 |\n|---|---|---|---|---|\n| 一 | 菩薩在家 → 若在厄難 | **11** | 11（在家有十一願） | 在家·翻染成净 |\n| 二 | 捨居家時 → 受具足戒 | **15** | 15（出家受戒時） | 出家·三归·受戒 |\n| 三 | 若入堂宇 → 捨跏趺坐 | **7** | 7（就坐禪觀時） | 坐禅·定慧 |\n| 四 | 下足住時 → 著僧伽梨 | **6** | 6（將行披挂時） | 披挂·三衣 |\n| 五 | 手執楊枝 → 以水洗面 | **7** | 7（澡漱盥洗時） | 澡漱·洁净 |\n| 六 | 手執錫杖 → 見無憂林 | **55** | 55（乞食道行時） | 道路12·事境19·人物24 |\n| 七 | 若見城廓 → 飯食已訖 | **22** | 22（到城乞食時） | 乞食·得食·说法 |\n| 八 | 從舍出時 → 若得見佛 | **5** | 5（還歸洗浴時） | 还归·见佛观塔 |\n| 九 | 諦觀佛時 … 遶塔三匝 … 讚佛相好 | **10** | 10（習誦旋禮時） | 讽诵·旋礼·赞叹 |\n| 十 | 若洗足時 → 睡眠始寤 | **3** | 3（寤寐安息時） | 洗足·寝息·始寤 |\n\n**〔段八／段九起讫词·本批照记订正〕**（〔本文判断·据 `_e11_vows.txt` 逐愿实测·誓数 5/10 不变·**原表照记不删不改**）：实测段八「還歸洗浴」五愿起讫作「**從舍出時 → 暑退涼初**」（表中讫词「若得見佛」实为**段九第二誓**〔idx129〕）；段九「習誦旋禮」十愿**起愿为「諷誦經時」**〔idx128〕——表中「諦觀佛時」系段九第三誓〔idx130〕·非起愿词。澄观「第九諷誦下。習誦旋禮時有十願」（附录四·`T1735`@195569 行）正谓以「諷誦經時」为该段之首。§7.4 复算脚本段九以「諦觀佛時」`str.find` 定位——**该词首现恰落段九愿内**（前愿无「諦觀佛時」），故段数 [5,10] 仍与疏合·输出无碍。\n\n> **代表性誓文（照底本逐字·繁体）**：\n> 「**菩薩在家，當願眾生：知家性空，免其逼迫。孝事父母，當願眾生：善事於佛，護養一切。妻子集會，當願眾生：怨親平等，永離貪著。**」\n\n- 【段一·在家】澄观：「以家是貪愛擊縛所故。若了性空。則雖處居家家不能迫」（`T1735`@193475）。首誓即立「转家为空」之纲。\n> 「**捨居家時，當願眾生：出家無礙，心得解脫。**」\n> 「**自歸於佛，當願眾生：紹隆佛種，發無上意。自歸於法，當願眾生：深入經藏，智慧如海。自歸於僧，當願眾生：統理大眾，一切無礙。**」\n\n- 【段二·出家】三归依誓，汉传「自归于佛／法／僧」三句最古出处之一（中段略愿分两引文块照录·不以内省略号跨连）。\n> 「**若見高山，當願眾生：善根超出，無能至頂。見棘刺樹，當願眾生：疾得翦除，三毒之刺。**」\n> 「**若見大河，當願眾生：得預法流，入佛智海。**」\n\n- 【段六·事境】历「见境」之愿，触目皆道。\n> 「**見佛塔時，當願眾生：尊重如塔，受天人供。**」\n> 「**右遶於塔，當願眾生：所行無逆，成一切智。遶塔三匝，當願眾生：勤求佛道，心無懈歇。**」\n\n- 【段九·旋礼】澄观：「右者順義故」（`T1735`·§5.1）。\n> 「**以時寢息，當願眾生：身得安隱，心無動亂。睡眠始寤，當願眾生：一切智覺，周顧十方。**」\n\n- 【段十·寤寐】以「一切智觉」收束全品日用，一日始终既尔、余时类然（澄观语）。\n\n- **疏解**：一百四十一誓之组织逻辑，是「**随自他身所有事业，一一皆转成对众生之愿**」——**遇一事发一愿**，从最世俗（在家、孝亲、妻子集会）到最圣（见佛、绕塔、智觉），无空过者。法藏判：「**如是始終隨事發願無空過也**」（`T1733`@134720·§5.2）；又「**問何故瓔珞明入理願此經多明對事願耶。答此經順一乘。在事益大**」（`T1733`@134773·§5.2）。〔本文判断〕净行品之「行」不是抽象六度，而是**将六度、三归、十力等所问之德，化进日常起居的每一念**——此即「善用其心」的具体化。\n- **名相**：**當願眾生**（每誓之式·「愿一切众生……」）；**紹隆佛種**（令佛种不绝）；**頭陀行**（段四「捨諸飾好，具頭陀行」·少欲知足）。\n\n### 2.3′　一百四十一愿全文·逐愿照录〔L.189 本批〕\n\n澄观判此段经文「**長分為十**」（`T1735`@193301·§5.1）。一百四十一愿**全体为单一 `<lg>` 单元**（`80-04|lg|@87736|CJK2,255`·188 个 `<l>` 十字颂行·跨行连读），本批以「。」为愿界程序化切分（`_e11_full.py` 探针·切得 **141／141 愿**·各愿皆含「當願眾生：」·`_e11_vows.txt`），依十段逐愿照录如下——编号为全品序码〔001–141〕·**引文照底本冒号式·不转写不断句·「𦓷」（愿 074·非 BMP）等原字形保留**：\n\n- **照记订正**：段八讫词与段九起愿词之表证误记已注明于 §2.3 表下（誓数 5/10 不变）。\n\n**段一**（愿 001–011·11 愿）｜起讫「菩薩在家 → 若在厄難」｜澄观：在家有十一願·以家是貪愛擊縛所故\n\n> 001｜菩薩在家，當願眾生：知家性空，免其逼迫。\n> 002｜孝事父母，當願眾生：善事於佛，護養一切。\n> 003｜妻子集會，當願眾生：怨親平等，永離貪著。\n> 004｜若得五欲，當願眾生：拔除欲箭，究竟安隱。\n> 005｜妓樂聚會，當願眾生：以法自娛，了妓非實。\n> 006｜若在宮室，當願眾生：入於聖地，永除穢欲。\n> 007｜著瓔珞時，當願眾生：捨諸偽飾，到真實處。\n> 008｜上昇樓閣，當願眾生：昇正法樓，徹見一切。\n> 009｜若有所施，當願眾生：一切能捨，心無愛著。\n> 010｜眾會聚集，當願眾生：捨眾聚法，成一切智。\n> 011｜若在厄難，當願眾生：隨意自在，所行無礙。\n\n**段二**（愿 012–026·15 愿）｜起讫「捨居家時 → 受具足戒」｜澄观：第二捨居家下。出家受戒時有十五願\n\n> 012｜捨居家時，當願眾生：出家無礙，心得解脫。\n> 013｜入僧伽藍，當願眾生：演說種種，無乖諍法。\n> 014｜詣大小師，當願眾生：巧事師長，習行善法。\n> 015｜求請出家，當願眾生：得不退法，心無障礙。\n> 016｜脫去俗服，當願眾生：勤修善根，捨諸罪軛。\n> 017｜鬀除鬚髮，當願眾生：永離煩惱，究竟寂滅。\n> 018｜著袈裟衣，當願眾生：心無所染，具大仙道。\n> 019｜正出家時，當願眾生：同佛出家，救護一切。\n> 020｜自歸於佛，當願眾生：紹隆佛種，發無上意。\n> 021｜自歸於法，當願眾生：深入經藏，智慧如海。\n> 022｜自歸於僧，當願眾生：統理大眾，一切無礙。\n> 023｜受學戒時，當願眾生：善學於戒，不作眾惡。\n> 024｜受闍梨教，當願眾生：具足威儀，所行真實。\n> 025｜受和尚教，當願眾生：入無生智，到無依處。\n> 026｜受具足戒，當願眾生：具諸方便，得最勝法。\n\n**段三**（愿 027–033·7 愿）｜起讫「若入堂宇 → 捨跏趺坐」｜澄观：第三若入堂下七願。明就坐禪觀時願\n\n> 027｜若入堂宇，當願眾生：昇無上堂，安住不動。\n> 028｜若敷床座，當願眾生：開敷善法，見真實相。\n> 029｜正身端坐，當願眾生：坐菩提座，心無所著。\n> 030｜結跏趺坐，當願眾生：善根堅固，得不動地。\n> 031｜修行於定，當願眾生：以定伏心，究竟無餘。\n> 032｜若修於觀，當願眾生：見如實理，永無乖諍。\n> 033｜捨跏趺坐，當願眾生：觀諸行法，悉歸散滅。\n\n**段四**（愿 034–039·6 愿）｜起讫「下足住時 → 著僧伽梨」｜澄观：第四下足住時下。明將行披挂時六願\n\n> 034｜下足住時，當願眾生：心得解脫，安住不動。\n> 035｜若舉於足，當願眾生：出生死海，具眾善法。\n> 036｜著下帬時，當願眾生：服諸善根，具足慚愧。\n> 037｜整衣束帶，當願眾生：檢束善根，不令散失。\n> 038｜若著上衣，當願眾生：獲勝善根，至法彼岸。\n> 039｜著僧伽梨，當願眾生：入第一位，得不動法。\n\n**段五**（愿 040–046·7 愿）｜起讫「手執楊枝 → 以水洗面」｜澄观：第五手執楊枝下。澡漱盥洗時有七願\n\n> 040｜手執楊枝，當願眾生：皆得妙法，究竟清淨。\n> 041｜嚼楊枝時，當願眾生：其心調淨，噬諸煩惱。\n> 042｜大小便時，當願眾生：棄貪瞋癡，蠲除罪法。\n> 043｜事訖就水，當願眾生：出世法中，速疾而往。\n> 044｜洗滌形穢，當願眾生：清淨調柔，畢竟無垢。\n> 045｜以水盥掌，當願眾生：得清淨手，受持佛法。\n> 046｜以水洗面，當願眾生：得淨法門，永無垢染。\n\n**段六**（愿 047–101·55 愿）｜起讫「手執錫杖 → 見無憂林」｜澄观：總五十五願·更分為三（道路十二·事境十九·人物二十四）\n\n> 047｜手執錫杖，當願眾生：設大施會，示如實道。\n> 048｜執持應器，當願眾生：成就法器，受天人供。\n> 049｜發趾向道，當願眾生：趣佛所行，入無依處。\n> 050｜若在於道，當願眾生：能行佛道，向無餘法。\n> 051｜涉路而去，當願眾生：履淨法界，心無障礙。\n> 052｜見昇高路，當願眾生：永出三界，心無怯弱。\n> 053｜見趣下路，當願眾生：其心謙下，長佛善根。\n> 054｜見斜曲路，當願眾生：捨不正道，永除惡見。\n> 055｜若見直路，當願眾生：其心正直，無諂無誑。\n> 056｜見路多塵，當願眾生：遠離塵坌，獲清淨法。\n> 057｜見路無塵，當願眾生：常行大悲，其心潤澤。\n> 058｜若見險道，當願眾生：住正法界，離諸罪難。\n> 059｜若見眾會，當願眾生：說甚深法，一切和合。\n> 060｜若見大柱，當願眾生：離我諍心，無有忿恨。\n> 061｜若見叢林，當願眾生：諸天及人，所應敬禮。\n> 062｜若見高山，當願眾生：善根超出，無能至頂。\n> 063｜見棘刺樹，當願眾生：疾得翦除，三毒之刺。\n> 064｜見樹葉茂，當願眾生：以定解脫，而為蔭映。\n> 065｜若見華開，當願眾生：神通等法，如華開敷。\n> 066｜若見樹華，當願眾生：眾相如華，具三十二。\n> 067｜若見果實，當願眾生：獲最勝法，證菩提道。\n> 068｜若見大河，當願眾生：得預法流，入佛智海。\n> 069｜若見陂澤，當願眾生：疾悟諸佛，一味之法。\n> 070｜若見池沼，當願眾生：語業滿足，巧能演說。\n> 071｜若見汲井，當願眾生：具足辯才，演一切法。\n> 072｜若見涌泉，當願眾生：方便增長，善根無盡。\n> 073｜若見橋道，當願眾生：廣度一切，猶如橋梁。\n> 074｜若見流水，當願眾生：得善意欲，洗除惑垢。\n> 075｜見修園圃，當願眾生：五欲圃中，𦓷除愛草。\n> 076｜見無憂林，當願眾生：永離貪愛，不生憂怖。\n> 077｜若見園苑，當願眾生：勤修諸行，趣佛菩提。\n> 078｜見嚴飾人，當願眾生：三十二相，以為嚴好。\n> 079｜見無嚴飾，當願眾生：捨諸飾好，具頭陀行。\n> 080｜見樂著人，當願眾生：以法自娛，歡愛不捨。\n> 081｜見無樂著，當願眾生：有為事中，心無所樂。\n> 082｜見歡樂人，當願眾生：常得安樂，樂供養佛。\n> 083｜見苦惱人，當願眾生：獲根本智，滅除眾苦。\n> 084｜見無病人，當願眾生：入真實慧，永無病惱。\n> 085｜見疾病人，當願眾生：知身空寂，離乖諍法。\n> 086｜見端正人，當願眾生：於佛菩薩，常生淨信。\n> 087｜見醜陋人，當願眾生：於不善事，不生樂著。\n> 088｜見報恩人，當願眾生：於佛菩薩，能知恩德。\n> 089｜見背恩人，當願眾生：於有惡人，不加其報。\n> 090｜若見沙門，當願眾生：調柔寂靜，畢竟第一。\n> 091｜見婆羅門，當願眾生：永持梵行，離一切惡。\n> 092｜見苦行人，當願眾生：依於苦行，至究竟處。\n> 093｜見操行人，當願眾生：堅持志行，不捨佛道。\n> 094｜見著甲冑，當願眾生：常服善鎧，趣無師法。\n> 095｜見無鎧仗，當願眾生：永離一切，不善之業。\n> 096｜見論議人，當願眾生：於諸異論，悉能摧伏。\n> 097｜見正命人，當願眾生：得清淨命，不矯威儀。\n> 098｜若見於王，當願眾生：得為法王，恒轉正法。\n> 099｜若見王子，當願眾生：從法化生，而為佛子。\n> 100｜若見長者，當願眾生：善能明斷，不行惡法。\n> 101｜若見大臣，當願眾生：恒守正念，習行眾善。\n\n**段七**（愿 102–123·22 愿）｜起讫「若見城廓 → 飯食已訖」｜澄观：第七若見城郭下。二十二願。到城乞食時願\n\n> 102｜若見城廓，當願眾生：得堅固身，心無所屈。\n> 103｜若見王都，當願眾生：功德共聚，心恒喜樂。\n> 104｜見處林藪，當願眾生：應為天人，之所歎仰。\n> 105｜入里乞食，當願眾生：入深法界，心無障礙。\n> 106｜到人門戶，當願眾生：入於一切，佛法之門。\n> 107｜入其家已，當願眾生：得入佛乘，三世平等。\n> 108｜見不捨人，當願眾生：常不捨離，勝功德法。\n> 109｜見能捨人，當願眾生：永得捨離，三惡道苦。\n> 110｜若見空鉢，當願眾生：其心清淨，空無煩惱。\n> 111｜若見滿鉢，當願眾生：具足成滿，一切善法。\n> 112｜若得恭敬，當願眾生：恭敬修行，一切佛法。\n> 113｜不得恭敬，當願眾生：不行一切，不善之法。\n> 114｜見慚恥人，當願眾生：具慚恥行，藏護諸根。\n> 115｜見無慚恥，當願眾生：捨離無慚，住大慈道。\n> 116｜若得美食，當願眾生：滿足其願，心無羨欲。\n> 117｜得不美食，當願眾生：莫不獲得，諸三昧味。\n> 118｜得柔軟食，當願眾生：大悲所熏，心意柔軟。\n> 119｜得麁澁食，當願眾生：心無染著，絕世貪愛。\n> 120｜若飯食時，當願眾生：禪悅為食，法喜充滿。\n> 121｜若受味時，當願眾生：得佛上味，甘露滿足。\n> 122｜飯食已訖，當願眾生：所作皆辦，具諸佛法。\n> 123｜若說法時，當願眾生：得無盡辯，廣宣法要。\n\n**段八**（愿 124–128·5 愿）｜起讫「從舍出時 → 暑退涼初」｜澄观：第八從舍出下。還歸洗浴時節炎涼。五願可知\n\n> 124｜從舍出時，當願眾生：深入佛智，永出三界。\n> 125｜若入水時，當願眾生：入一切智，知三世等。\n> 126｜洗浴身體，當願眾生：身心無垢，內外光潔。\n> 127｜盛暑炎毒，當願眾生：捨離眾惱，一切皆盡。\n> 128｜暑退涼初，當願眾生：證無上法，究竟清涼。\n\n**段九**（愿 129–138·10 愿）｜起讫「諷誦經時 → 讚佛相好」｜澄观：第九諷誦下。習誦旋禮時有十願。右者順義故\n\n> 129｜諷誦經時，當願眾生：順佛所說，總持不忘。\n> 130｜若得見佛，當願眾生：得無礙眼，見一切佛。\n> 131｜諦觀佛時，當願眾生：皆如普賢，端正嚴好。\n> 132｜見佛塔時，當願眾生：尊重如塔，受天人供。\n> 133｜敬心觀塔，當願眾生：諸天及人，所共瞻仰。\n> 134｜頂禮於塔，當願眾生：一切天人，無能見頂。\n> 135｜右遶於塔，當願眾生：所行無逆，成一切智。\n> 136｜遶塔三匝，當願眾生：勤求佛道，心無懈歇。\n> 137｜讚佛功德，當願眾生：眾德悉具，稱歎無盡。\n> 138｜讚佛相好，當願眾生：成就佛身，證無相法。\n\n**段十**（愿 139–141·3 愿）｜起讫「若洗足時 → 睡眠始寤」｜澄观：第十若洗足下。寤寐安息時三願\n\n> 139｜若洗足時，當願眾生：具神足力，所行無礙。\n> 140｜以時寢息，當願眾生：身得安隱，心無動亂。\n> 141｜睡眠始寤，當願眾生：一切智覺，周顧十方。\n### 2.4 结叹·「如是用心·所不能动」（@品末）\n\n> 「**佛子！若諸菩薩如是用心，則獲一切勝妙功德；一切世間諸天、魔、梵、沙門、婆羅門、乾闥婆、阿脩羅等，及以一切聲聞、緣覺，所不能動。**」\n\n- **疏解**：与 §2.2 总标「善用其心则获一切胜妙功德」首尾呼应，**「如是用心」**回指一百四十一誓。结文举「天魔梵·沙门婆罗门·声闻缘觉」所不能动——澄观释：「**心游大智故。人天不能動。心冠大悲故。二乘不能動**」（`T1735`@195712·§5.1·按：底本此句上有「外不能動」四字且原处换行，「動／心」归属〔待核·断句存疑〕，故但引换行后完整四句），显此日用巧愿之境，超越人天、亦非二乘所及。六十侧结段作「**佛子！是為菩薩身、口、意業能得一切勝妙功德，諸天、魔、梵、沙門、婆羅門、人及非人、聲聞、緣覺所不能動。**」——两译结义同，文句略异（§6.1）。\n\n---\n\n## 三　旁参与前接\n\n- **前接《菩萨问明》（第十品）**：问明明十信之「解」（文殊与十首菩萨互设问答·显「诸法各各不相知」），净行明十信之「行」（智首问、文殊以众愿答·显「善用其心」）。澄观判：「**故前品明解此品辨行**」（`T1735`@188398·§5.1）——解不徒解，必落为行；此二品之锁钥。\n- **后接《贤首品》（第十二品）**：净行明「行」，贤首明「德」（信之功德相）。演钞链「**十一既有正解。復須正行歷境造修。悲智雙運無障不寂。故受之以淨行品。……故受之以賢首品。上之三品。明十信法**」（`T1736`@192016·§5.2′·承 L.183）——问明（解）→净行（行）→贤首（德），三品成十信。〔本文判断〕净行为「解」与「德」之间之「行」，是全会「由信起解、由解起行、由行显德」链条之中段。\n- **跨典征引旁证**：\n  - 「**舉足下足盡文殊心。見聞覺知皆普賢行**」（`T1735`@188478·§5.1 释名段末句·与 §1.1 同一段）——澄观以此句统摄本品。\n  - 海云讲记 ep12「**淨行品一百四十一大願**」（实测该语 ep12 见 **8 处**，讲者自注「**皆講者口頭義理陳述或口誦·正式 CBETA 逐字回源俟 Ep13+ 正行段**」）（〔讲师玄谈·非正行〕）——讲者口径 141，与八十实测合；详 §5.3′。**〔L.184 照记订正〕** 初稿此处另引「當願眾生與我一道加前三願」一句，经 ep07／ep08／ep10／ep12 全库实测 **0 见**、无从回源，已删除（不以记忆冒充底本）。\n\n---\n\n## 四　义理要点与名相\n\n1. **善用其心·则获胜妙功德**——本品的**宗眼**。全品不待他求，只就「用心」立义：于一切事缘，转凡夫逐境之念为「当愿众生」之智愿，即日用成道。〔本文判断〕此语后世（尤其「净行品」单独流通之《华严经净行品》念诵本）奉为日常修持总纲，其权威正建于八十「善用其心」一句（对照六十「成就身口意业」·§6.1 义差）。\n2. **有解无行·虚费多闻**——澄观来意判语「**有解無行虛費多聞**」（`T1735`@188398·§5.1）：解（问明）若无行（净行）落实，则多闻成空。净行品之「行」是**对治「解而不行」之病**，与问明构成「解行相须」。\n3. **巧愿防心·即事而真**——法藏四愿判：本品唯论「**行愿**」（与行俱起·但对事发愿·以此是行「以防心不散故」·`T1733`）。一百四十一誓的义理机制，是**以愿导心、心不散于境**，遇违顺境皆转为法（澄观「**遇違順境心不馳散止行也。智不沈沒觀行也**」·`T1735`@188684·§5.1）。\n4. **事·理·智·悲·无碍·止观六重行**——澄观解「问文但辨一百余愿，何名为行」之难，答以辨行「**答文中辨行略有數重**」：「**謂就所歷事中。始自出家終於臥覺。皆事行也。知家性空理行也。觸境不迷善達事理智行也。以願導智不滯自利大悲行也。上二不二悲智無礙行也。遇違順境心不馳散止行也。智不沈沒觀行也**」（`T1735`@188684·§5.1）。——一百四十一愿之所以名「净行」，正在其**一事中含事／理／智／悲／无碍／止观六义**。〔本文判断〕此六重是理解本品「行」义之最完备科判，非谓经文自列六行。\n5. **名相辑要**：**身語意業**（三业·问纲）·**善用其心**（宗眼）·**當願眾生**（誓式）·**紹隆佛種／深入經藏／統理大眾**（三归依愿）·**檀～般若波羅蜜**（六度）·**念覺分～捨覺分**（七觉支）·**蘊界處善巧**（三科）·**頭陀行**（段四）·**第二導師**（菩萨·§2.2）。\n\n---\n\n## 五　注疏选要·诸家会读\n\n> 本品祖典**五家齐备**（异于问明之慧苑缺记·L.183）：澄观、法藏、智俨、慧苑、李通玄皆有净行专段。会读之眼在**誓数**——一百四十一（八十侧）/一百四十（六十侧）两口径，诸家各据其所见本。**数须对验**：本节所记诸家数，与两译底本实测（§7.4）互证。\n\n### 5.1 澄观《华严经疏》卷十五（`T1735`@188383–195841·「**淨行品第十一**（入第十四經）」·五门分别）\n\n- **五门**：「**釋此一品五門分別**」（@188412）——初来意·次释名·三宗趣·四解妨·第五释文。\n- **来意**（§1.1）：「**夫欲階妙位必資勝行。有解無行虛費多聞。故前品明解此品辨行**」（@188398）。\n- **释名**：「**梵云具折囉。此云所行。波利此云皆也遍也。戍輪律提云清淨也……舉足下足盡文殊心。見聞覺知皆普賢行……所行即淨。持業釋也**」（@188478）。\n- **宗趣**：「**以隨事巧願防心不散。增長菩薩悲智大行為宗。成就普賢實德為趣**」（净行段·@188478 释名后·`長` U+2ED1 原字形）。\n- **二十云何·十一段德**：「**二陳所問中。有二十云何。總十一段。段各十句。成一百一十種德**」（@189279）——十一段德名：「**第一段明三業離過成德。二得堪傳法器。三成就眾慧。四具道因緣。五於法善巧。六修涅槃因。七滿菩薩行。八得十力智。九十王敬護。十能為饒益。十一超勝尊貴**」（@189279 续）。\n- **智為先導**：「**後一總出其因。若以智慧為先導。身語意業常無失故……不隨於癡故智為先導。所作稱真**」（@189828·§2.1）。\n- **善用其心·心覺神明**：「**先標其因。謂善用其心。心覺神明之奧心。正則萬德攸歸……一百一十門。德何足難就。可謂一言蔽諸。勝謂獨尊。妙謂離相**」（@191548）。\n- **三段科**：「**第二佛子云何下。指事顯因於中三。初總徵次別顯。後總結成益**」（@192108·§1.5·与慧苑三段科同判·X0221@144865）。\n- **一百四十一·表法**：「**總有一百四十一願。菩薩大願深廣如海……一百者。十信圓融一一具十也。四十一者。即四十一位也**」（@192147）——**澄观据八十数·并给表法义**（一百＝十信圆融·四十一＝四位）。\n- **長分為十·十段家数**：「**五正釋經文。長分為十。初有十一願。明在家時願。二有十五願。出家受戒時願……十有三願。明寤寐安息時願**」（@193301）——逐段 11/15/7/6/7/55/22/5/10/3（§2.3 表·**实测逐段全合**§7.4）。\n- **六段三分**：「**乞食道行時。總有五十五願。更分為三。初十二願游涉道路。次見眾會下十九願。所覩事境。後見嚴飾下二十四願。所遇人物**」（@194398·实测 12/19/24=55 合·§7.4）。\n- **家誓疏解**：「**在家有十一願。初一總舉在家。以家是貪愛擊縛所故。若了性空。則雖處居家家不能迫**」（@193475·§2.3）。\n- **右者順義**：「**習誦旋禮時有十願。右者順義故。普耀經第二亦云。菩薩降神趣右脇者。所行無逆故**」（@195591·§2.3 段九）。\n- **结叹·心游大智**：「**若能如上為善用心……心游大智故。人天不能動。心冠大悲故。二乘不能動**」（@195712·§2.4·按：底本此上有「外不能動」且原处换行，断句〔待核〕）。\n- **六重行（四解妨）**：問「**文中但辨一百餘願。何有行耶**」，答「**答文中辨行略有數重。謂就所歷事中。始自出家終於臥覺。皆事行也。知家性空理行也。觸境不迷善達事理智行也。以願導智不滯自利大悲行也。上二不二悲智無礙行也。遇違順境心不馳散止行也。智不沈沒觀行也**」（@188684·§4.4）——另三谛观「**當願眾生皆假觀也。知身空寂心無染著空觀也。見如實理中觀也**」同段。\n\n**〔L.189 本批·疏科长文全摘〕**（`T1735` 卷十五～十六「淨行品第十一」本科段·raw @%d–%d·CJK-only 坐标回映 raw 切片·引文照 raw 原字形·部首码位已归一（L.199）·附录四为全文照录·此其纲格六段）\n\n*甲·五门总标·来意*：\n\n> 「釋此一品五門分別。初來意者。夫欲階妙位必資勝行。有解無行虛費多聞。故前品明解此品辨行。又前明入理觀行。今辨隨事所行。又前行此願並義次第。故次來也」\n\n*乙·释名·宗趣（具折囉波利戍輪律提·随事巧愿）*：\n\n> 「次釋名者。梵云具折囉。此云所行。波利此云皆也遍也。戍輪律提云清淨也。謂三業隨事緣歷名為所行巧願防非離過成德。名為清淨。又悲智雙運名為所行。行越凡小故稱清淨。以二乘無漏。不能兼利非真淨故。得斯意者。舉足下足盡文殊心。見聞覺知皆普賢行。文殊心故。心無濁亂。是曰清淨。普賢行故。是佛往修諸佛菩薩同所行也。所行即淨。持業釋也。三宗趣者。以隨事巧願防心不散。增長菩薩悲智大行為宗。成就普賢實德為趣」\n\n*丙·解妨六重行＋三谛观*：\n\n> 「四解妨者。問文中但辨一百餘願。何有行耶。答文中辨行略有數重。謂就所歷事中。始自出家終於臥覺。皆事行也。知家性空理行也。觸境不迷善達事理智行也。以願導智不滯自利大悲行也。上二不二悲智無礙行也。遇違順境心不馳散止行也。智不沈沒觀行也。即止觀雙運行也。又對於事境善了邪正。當願眾生。皆假觀也。知身空寂心無染著空觀也。見如實理中觀也。或先空後中。或先假後空。或一或二或一念頓具。斯為妙達三諦觀之行也。又所造成行皆施眾生。不起二乘之心。安忍強軟兩境唯增善品。心不異緣妙達性空。善巧迴轉。皆願利物同趣菩提。二乘天魔所不能動。善知藥病決斷無差。即十度齊修之行也。又皆願利生皆成佛德。見惡必令其斷見善必令其具。即四弘誓願之行也。故智首總標諸德。以求其因。文殊令善用心頓獲眾果。但言惟願豈不感哉」\n\n*丁·答科总纲（一百四十一·表法·四事三义六句）*：\n\n> 「第二佛子云何下。指事顯因於中三。初總徵次別顯。後總結成益。二別顯中五門分別。一總明大意文中。總有一百四十一願。菩薩大願深廣如海。應如迴向非止爾也。此蓋示於體式餘皆倣此。又非無表。一百者。十信圓融一一具十也。四十一者。即四十一位也。明此諸位所有惑障。由此能淨所有勝行。由此能行故。二通顯文旨。然此諸願句雖有四事但有三義開為六。言三事者。謂初句願所依事。次句願所為境。後二句是願境成益。開為六者。初事有二。一者內。謂菩薩自身根識等。經云菩薩等故。二者外。謂他身或依正資具等。經云在家等故。次事亦二種。一能發願者。二所願眾生。經云當願眾生故。後事亦二。一者自益由此諸願成前諸德故二者益他。由此發願願眾生故。此後二句。或前句是因後句是果。如云所行無逆成一切智等。或二俱是因。如云巧事師長習行善法等。或二俱佛果。如云永離煩惱究竟寂滅等。或俱通因果。如云以法自娛了妓非實等。或三四二句共成一句。如云演說種種無乖諍法等。亦可後。二句中初句所入法。如云知家性空等。後句所成益免逼迫等以不必具故合為一」\n\n*戊·長分為十名单（十段家数全出・「長」U+2ED1 不参 NFKD・锚取后续正字形・首字手写补「長」）*\n\n> 「長分為十。初有十一願。明在家時願。二有十五願。出家受戒時願。三有七願。就坐禪觀時願。四有六願。明將行披挂時願。五有七願。澡漱盥洗時願。六有五十五願。明乞食道行時願。七有二十二願。明到城乞食時願。八有五願。明還歸洗浴時願。九有十願。明習誦旋禮時願。十有三願。明寤寐安息時願今初」\n\n*己·结叹科（因所成益·二不希彼故）*：\n\n> 「第三若諸菩薩下。結歎因所成益。若能如上為善用心。若此用心則內德齊圓。外不能動心游大智故。人天不能動。心冠大悲故。二乘不能動不動有二。一修行時。此等不能惑亂故二不希彼故」（科段正文尽此·下即「大方廣佛華嚴經疏卷第十五」尾题·附录四末块内照录）\n\n### 5.2 法藏《华严经探玄记》卷四（`T1733`@131862–·「**淨行品第七**」·**依六十编次**·四门）\n\n- **释名（依梵本）**：「**依梵本名圓淨行品……又願無垢名淨。即願是行故云淨行**」（@131882·§1.1）。\n- **宗（愿海·四种愿）**：「**三宗者以願海為宗。但願有四種。一誓願謂行前要期等。二行願此有二種。一與行俱起。二但對事發願。則此是行以防心不散故。三行後願……四自體無礙願……此中唯論行願。餘者義通可知**」（@132043–132139·§4.3）——本品**唯论「行愿」**。\n- **答端·一百四十愿·六义**：「**答中有一百四十願通答前諸問。何以爾者以一一願中皆有六義故……一轉捨事。二轉成法。三轉他令離過。四轉他令入法。五轉顯自過。六轉成自行**」（@133812）——**法藏数作 140·与八十 141 差一**（口径见 §5.4）。\n- **十势（转义）**：「**略辨十勢。一轉事入理勢……七轉偽歸真勢。如見仙人等。以仙非真脫故……十轉虛同實勢**」（@134365·按：「仙人」八十实测 0 见·六十 1 见·法藏所见即六十文·§6.1〔六〕直证）。\n- **長分為十（法藏十段）**：「**就此文中長分為十。初明菩薩在家時願。二從以信捨家下……三從受持淨戒下……四從若敷床座下……九從若入水時下。明食訖禮誦時願。十從昏夜下。明晝夜寢覺時願**」（@134489）——段界与澄观小异（澄观段九=習誦旋禮、段八=還歸洗浴；法藏段九=若入水時食訖禮誦）。\n- **随事发愿·无空过**：「**如是始終隨事發願無空過也**」（@134720·§2.3）。\n- **瓔珞問答·对事愿**：「**問何故瓔珞明入理願此經多明對事願耶。答此經順一乘。在事益大**」（@134773·§2.3）。\n\n### 5.2′ 智俨《华严经内章门等杂问章句》（搜玄记·`T1732`@28960·**依六十编次**·五门）\n\n- **来意与宗**：「**二來意。所以來。依解起行故也。亦可前行次願故也。三以諸願為宗**」（@28960·§1.1）。\n- **问端十一事**：「**問中義類相從有十一事。總分有二。前七云何問自分因相。二得是處智下明問勝分果相**」（@29044）——与澄观「十一段」同源而异拟。\n- **偈一百四十大·五段科**：「**偈有一百四十大。分為二。初十一明在家菩薩法不捨世間行。餘文明出家行……初十五明出家受戒法。二若入房舍下二十辨住處進以威儀行法。三手執錫杖下五十七明道路行法。四入里乞食下二十明入城邑聚落乞食行法。五若入水時下十七明出離修道行法**」（@29679）——**11+15+20+57+20+17＝140**（与六十实测 140 合·§7.4·智俨据六十文之直证）。\n\n### 5.2″ 慧苑《续华严略疏刊定记》（X0221·@135060–·**有净行专段**·异于问明之无记·L.183）\n\n- **梵名（直证专段存在）**：「**梵本云。具折羅波唎戍提。(戍音作輸律反)言具折囉者。所行也……云所行皆清淨也**」（@135060·§1.1）。\n- **来意**：「**前品明信中之慧解。今明信中三願行故。次來也**」（@135185·§1.1）。\n- **一百四十一·長科十段**：「**就此一百四十一願。長科為十段。一從初至在厄難。明在家時願。二捨居家下。明出家受戒時願。三若入堂宇下。明坐起裴束時願。四手執揚枝下。明揩洗身口等時願……六若見眾會下。明在路見何物時願。七見嚴餝人下。明路見人物時願。八若見城郭……**」（@140739）——**慧苑数作 141·与澄观同（据八十）**；然自列段名与澄观异（其四段并入「手執揚枝·揩洗身口」·无独立披挂段·「揚枝/城郭/嚴餝人」异文见 §6.4）。\n- **三段科**：「**上來有三。一總徵成德之用心。二別顯用心之行相。三總結用心之勝能。總明第二能成因行竟**」（@144865·§1.5·与澄观 @192108 同判）。\n\n**【要点提炼】**（L.243 会读深化）\n\n1. **梵名直证**：「具折罗波唎戍提」（*具折罗*=所行·波唎戍提=遍清净）——「所行皆清净」即「净行」之梵语义（@135060）。\n2. **来意承问明**：「前品明信中之慧解。今明信中三愿行」——**解→愿行**之次（@135185）。\n3. **自列段名异于澄观**：数 141 同而段界异（四段并入揩洗·无独立披挂段）——**同数异段**证科判是导读者之地图（§6.4 异文互见）。\n4. **三段科与澄观同**：总征/别显/总结（@144865）——两家于大骨架上无争。\n\n**【阐释】**（〔本文判断〕）慧苑梵名「所行遍清净」给本品题一个**音训级定义**：净行之「净」不在行为之道德评价，而在**遍净**（pariśuddhi）之周遍义——141 誓之所以遍日常，正因「遍清净」是总纲。\n\n### 5.3 李通玄《新华严经论》（`T1739`·净行段 @175869–·**数作一百四十·品次从八十**）\n\n- **三品共成十信**：「**又說光明覺品菩薩問明品淨行品賢首品。成就十信之門**」（@41813·§1.2）。\n- **从大愿力生**：「**明信菩薩淨行從大願力生**」（@73833·§1.2）。\n- **一百四十大愿门**：「**皆勤修習此一百四十大願門。便於生死海中見聞覺知一切諸行。悉皆清淨入普賢行故。故名淨行……以此一百四十大願門。頓淨其一切塵勞行門。便成普賢法界行故。故名淨行**」（@176059/@176125·净行段两见）——李通玄**数作 140**（同六十口径）而**品第作第十一**（同八十·@175869 段起）·**数与第不同源·孤例〔待核〕**。\n\n### 5.3′ 海云继梦讲记（〔讲师玄谈·非正行〕·ep07／ep08／ep10／ep12）\n\n- ep07：**智首菩萨二十问**（第十问「身语意业智为先导」）；**翻译距离**诫（八十 vs 七十／四十译词之异）；「賢首改『圓滿身語意業』為『善用其心則獲勝妙功德』」——按：实测两译底本均无「圓滿身」（80=0·60=0）·讲者所据乃口诵·**只标不改**〔讲者口诵·与底本不合〕（§2.2·ep07）。\n- ep08：**一百四十一大愿**＋中数之说；ep10：**一百四十一条＝华严数学**；ep12：**淨行品一百四十一大願**（实测该语 ep12 见 **8 处**）——讲者口径 141·与八十实测合（§三·〔L.184 照记订正〕）。\n- ep03：「**淨行品我講了三十幾次**」〔待听核·讲者自述课时数·非经证〕。\n\n### 5.3″ 海云《净行品》品级讲记会读（正行·逐字照录·L.225 新立）\n\n**系列清点（2026-10-28）**：`docs/huayanhai/华严云海/浩瀚华严海/八十华严之11品净行品/净行品讲记-智慧行/` 存《华严经净行品讲记：智慧行》全篇（**171,330 CJK**·UTF-8·「前行--学佛的基本观念」起）；本件即海云净行品专讲（品级正行），与 §5.3′ 之九九华严玄谈段（ep07/08/10/12）**两层并存**——本节为品级层，玄谈段维持原判。\n\n**代表引文**（逐字照录·程序化抽取 0 手抄）：\n\n1. **总说／别说之判**：「总说是谈修行的唯一法门，即「善用其心」。至于如何善用其心，文殊菩萨以一百四十一个例子，分别说明若能善用其心，所能获得的各种殊胜功德。经文的内容十分简练，所以有许多重点光凭文字是无法体会的，必须透过法师的讲解才能理解，所谓「佛法无人说，再聪明的人也无法体会」，原因就在这里。」——讲者以「总说＝善用其心·别说＝一百四十一例」立骨架，与本文 §2.2/§2.3「总标—别显—结叹」三段式（慧苑 `X0221` 科）同构，两系互证。\n2. **用心与信心**：「那么该如何用心呢？现在是从佛的立场往下讲，所以首先要具足信心。信心又包括三个条件，第一、是相信自己及一切众生皆有佛性，皆能成佛。第二、信此境界的一草一木、一沙一尘皆是普贤境界。第三、信我们的起心动念、思想行为皆为普贤大行。更进而能信这个讲经的道场就是普光明殿，来此听经的每一个人都是佛、菩萨，信我们所做的一切都是普贤行。」——讲者以「具足信心」承「善用其心」，并开「信自己及一切众生皆有佛性」三条件；〔本文判断〕此与第二会「能信／所信」之纲（贤首品 §5.3′ 讲者十信语）一脉，即十信行门之体现。\n\n> **引用纪律**：同 §5.3″′（十住品体例）——逐字摘录·讲者对机语只标不代立论·品级讲记属主体层（decisions #9）。**《剖裂玄义疏》记阙**：外库《華嚴經》〈淨行品〉剖裂玄義疏（130 页·`huayan_daodu_index.yaml` id `polie-xuanyi`）有文字层但乱码级质量，本机 tesseract/pytesseract 不可用（2026-10-28 实测）——OCR 入库后另批补引，本批不引不臆述。\n\n> **EN corresponding · The Collected Lectures on Pure Practices.** The archive holds Haiyun's full lecture on this chapter (171,330 characters); his \"general statement / specific exposition\" reading of the one-hundred-and-forty-one vows matches the three-part structure this study adopts from the commentators, and his \"apply the mind well through faith\" bridges to the faith-doctrine of the second assembly. The Wai-kuo *Polie xuanyi* commentary awaits OCR and is not cited here.\n\n### 5.4 诸家对读小结\n\n| 家 | 所依编次 | 品目 | 誓数 | 科段 | 判释枢要 |\n|---|---|---|---|---|---|\n| 澄观 `T1735` | 八十卷十四 | 淨行品第十一 | **141** | 長分為十（11/15/7/6/7/55/22/5/10/3） | 有解無行虛費多聞·随事巧愿防心不散·六重行·一百四十一表法 |\n| 法藏 `T1733` | 六十卷六 | 淨行品第七 | **140** | 長分為十（段界异澄观） | 圆净行·愿海为宗·四种愿唯论行愿·十势·六义 |\n| 智俨 `T1732` | 六十 | （明难·净行次） | **140** | 五段（11+15+20+57+20+17） | 依解起行·以诸愿为宗·问十一事 |\n| 慧苑 X0221 | 八十 | 淨行（专段有记） | **141** | 長科十段（自列段名·并披挂入澡洗） | 三愿行·三段科·引经异文（揚枝/城郭/嚴餝人） |\n| 李通玄 `T1739` | 自开立论 | 淨行品第十一 | **140** | 四门（净行段） | 三品成十信·从大愿力生·一百四十大愿门·数与第不同源〔待核〕 |\n| 海云 Ep07/08/10/12 | 现代玄谈 | 净行（带举） | 141 | — | 智首二十问·善用其心〔讲师玄谈·非正行〕 |\n\n⚖ **口径判定（本系列核心·直证）**：**依八十者数 141（澄观·慧苑·实测 141），依六十者数 140（法藏·智俨·实测 140）**——两口径之别，恰由底本誓数之差（花喻区·§6.1〔六〕）决定，非疏家计算之误。李通玄数 140 而品第从八十（第十一），系孤例〔待核〕。讲记 141 与八十实测合。\n\n**【会读启发】**（L.243·〔本文判断〕）\n\n1. **「同数异段」之方法论**：慧苑与澄观同数 141 而段界异——誓数之争（141/140）是**底本之争**（花喻区），段界之争是**归并之争**；两层分开，诸家表始可读。\n2. **誓数差即异文之礼物**：花喻区「若见华开＋若见树华」二誓 vs 六十一誓之差（+1），是全品唯一硬异文——它把「诸家异说」还原为**文本事实**。\n3. **训诂定纲**：慧苑梵训「遍清净」使 141 誓的日常性（从在家到厄难十段）获得总纲——日常之遍即清净之遍。\n4. **现代联结**：141 誓＝一个「情境触发式」的行为指令库（每誓＝触发情境＋愿文）；十段＝触发情境之分类学——与今日习惯养成之「情境-反应」设计同构。\n\n---\n\n## 六　文本对读与校勘\n\n### 6.1 八十／六十对读（`T10n0279` 卷十四 ↔ `T09n0278_juan6.txt`·STEP0 新档·L.181）\n\n**〔一〕品题·卷次**：八十「**淨行品第十一**」（入第十四經·品界 @120266–124463）／六十「**淨行品第七**」（卷六·品界 juan6@391–4212·止锚「賢首菩薩品第八」）——同会（第二会）·序号 十一 vs 七。\n\n**〔二〕誓数**：八十「**當願眾生**」×**141**（全冒号式）／六十×**140**（全逗号式）——**差一**（§6.1〔六〕花喻区·实测 §7.4）。\n\n**〔三〕标点体式（0 交叉·直证）**：八十誓式「**……，當願眾生：……，……。**」（冒号 141·逗号 0）／六十「**……，當願眾生，……，……。**」（逗号 140·冒号 0）——两译「當願眾生」后标点**判然两途、无一例交叉**。\n\n**〔四〕总标·宗眼（flagship 义差）**：\n\n| 处 | 八十（`T10n0279`） | 六十（`juan6.txt`） | 异文类 |\n|---|---|---|---|\n| 总标句 | 若諸菩薩**善用其心**，則獲一切勝妙功德 | 菩薩**成就身、口、意業**，能得一切勝妙功德 | **用心／三业**（§1.4·§2.2·两译最著一义差） |\n| 结叹句 | 若諸菩薩**如是用心**……**及以一切聲聞、緣覺**，所不能動 | 是為菩薩**身、口、意業**能得……**人及非人、聲聞、緣覺**所不能動 | 首尾呼应异（用心回指／三业回指） |\n| 普贤句 | **當如普賢**，色像第一 | 色像第一，**悉如普賢大菩薩等** | 语序·「大菩薩等」 |\n| 第二导师 | 而為眾生**第二導師** | 而為眾生**第二尊導** | 导师／尊导 |\n\n**〔五〕为依段喻数**：八十「云何得與一切眾生**為依、為救、為歸、為趣、為炬、為明、為照、為導、為勝導、為普導**？」（**十喻**）／六十「云何菩薩**為眾生舍，為救，為歸，為趣，為炬，為明，為燈，為導，為無上導**？」（**九喻**）——八十多「勝導／普導」二、六十作「無上導」一；「為依」↔「為舍」、「為照」↔「為燈」（实测 §7.4·`_p11_cite6`）。\n\n**〔六〕花喻区差一誓（141/140 之别所在·直证）**：八十于花喻作「**若見華開**」＋「**若見樹華**」二誓／六十仅作「**見樹好華**」一誓——**净差 +1**，为 141↔140 口径之差之实体依据（`_p11_cov_run.py` §7.4·**法藏所见六十文之直证**：法藏十势之七「如見仙人等」·八十「仙人」实测 0 见·六十 1 见·§5.2）。**互增互缺（净差 0）**：六十独有「若見仙人」「若見妙色」·八十独有「見操行人」「見處林藪」（两译各有所增·相抵消）。\n\n### 6.1′　六十《淨行品第七》全本对照〔L.189 本批·全量入文〕\n\n品界 `T09n0278_juan6.txt` @%d–%d·CJK 2,895·**192 行**（STEP0 入库档 L.181·以下**逐行照录原档分行**·不转写不断句·止于「賢首菩薩品第八」题前·与 §6.1 表〔一〕–〔六〕逐项相应·誓式全逗号体「當願眾生，」×140 实测 §7.4）：\n\n> 淨行品第七\n> 爾時，智首菩薩問文殊師利言：「佛子！云何菩薩不染身、口、意業，不害身、口、意業，不癡身、口、意業，不退轉身、口、意業，不動身、口、意業，應讚歎身、口、意業，清淨身、口、意業，離煩惱身、口、意業，隨智慧身、口、意業？云何菩薩生處成就，姓成就，家成就，色相成就，念成就，智慧成就，趣成就，無畏成就，覺悟成就？云何菩薩第一智慧，最上智慧，勝智慧，最勝智慧，不可量智慧，不可數智慧，不可思議智慧，不可稱智慧，不可說智慧？云何菩薩因力具足，意力具足，方便力具足，緣力具足，境界力具足，根力具足，止觀力具足，定力具足？云何菩薩善知陰界入，善知緣起法，善知欲、色、無色界，善知過去、未來、現在？云何菩薩修七覺意，修空、無相、無作？云何菩薩滿足檀波羅蜜、尸波羅蜜、羼提波羅蜜、毘梨耶波羅蜜、禪波羅蜜、般若波羅蜜、慈、悲、喜、捨？云何菩薩得是處、非處智力，過去、未來、現在業報智力，種種諸根智力，種種性智力，種種欲智力，一切至處道智力，禪定解脫三昧垢淨智力，宿命無礙智力，天眼無礙智力，斷一切煩惱習氣智力？云何菩薩常為諸天王守護，恭敬供養；龍王、鬼神王、乾闥婆王、阿脩羅王、迦樓羅王、緊那羅王、摩睺羅伽王、人王、梵天王等守護，恭敬供養？云何菩薩為眾生舍，為救，為歸，為趣，為炬，為明，為燈，為導，為無上導？云何菩薩於一切眾生為第一，為大；為勝；為上；為無上；為無等；為無等等？」\n> 爾時，文殊師利答智首菩薩曰：「善哉！善哉！佛子！多所饒益，多所安隱，哀愍世間，惠利一切，安樂天人，問如是義。佛子！菩薩成就身、口、意業，能得一切勝妙功德；於佛正法，心無罣礙；去、來、今佛所轉法輪，能隨順轉；不捨眾生，明達實相；斷一切惡，具足眾善；色像第一，悉如普賢大菩薩等；成就如來一切種智；於一切法悉得自在，而為眾生第二尊導。佛子！何等身、口、意業能得一切勝妙功德？\n> 「菩薩在家，當願眾生，捨離家難，\n> 入空法中。孝事父母，當願眾生，\n> 一切護養，永得大安。妻子集會，\n> 當願眾生，令出愛獄，無戀慕心。\n> 若得五欲，當願眾生，捨離貪惑，\n> 功德具足。若在妓樂，當願眾生，\n> 悉得法樂，見法如幻。若在房室，\n> 當願眾生，入賢聖地，永離欲穢。\n> 著寶瓔珞，當願眾生，捨離重擔，\n> 度有無岸。若上樓閣，當願眾生，\n> 昇佛法堂，得微妙法。布施所珍，\n> 當願眾生，悉捨一切，心無貪著。\n> 若在聚會，當願眾生，究竟解脫，\n> 到如來處。若在危難，當願眾生，\n> 隨意自在，無所罣礙。以信捨家，\n> 當願眾生，棄捨世業，心無所著。\n> 若入僧坊，當願眾生，一切和合，\n> 心無限礙。詣大小師，當願眾生，\n> 開方便門，深入法要。求出家法，\n> 當願眾生，得不退轉，心無障礙。\n> 脫去俗服，當願眾生，解道修德，\n> 無復懈怠。除鬀鬚髮，當願眾生，\n> 斷除煩惱，究竟寂滅。受著袈裟，\n> 當願眾生，捨離三毒，心得歡喜。\n> 受出家法，當願眾生，如佛出家，\n> 開導一切。自歸於佛，當願眾生，\n> 體解大道，發無上意。自歸於法，\n> 當願眾生，深入經藏，智慧如海。\n> 自歸於僧，當願眾生，統理大眾，\n> 一切無礙。受持淨戒，當願眾生，\n> 具足修習，學一切戒。受行道禁，\n> 當願眾生，具足道戒，修如實業。\n> 始請和尚，當願眾生，得無生智，\n> 到於彼岸。受具足戒，當願眾生，\n> 得勝妙法，成就方便。若入房舍，\n> 當願眾生，昇無上堂，得不退法。\n> 若敷床座，當願眾生，敷善法座，\n> 見真實相。正身端坐，當願眾生，\n> 坐佛道樹，心無所倚。結跏趺坐，\n> 當願眾生，善根堅固，得不動地。\n> 三昧正受，當願眾生，向三昧門，\n> 得究竟定。觀察諸法，當願眾生，\n> 見法真實，無所罣礙。捨跏趺坐，\n> 當願眾生，知諸行性，悉歸散滅。\n> 下床安足，當願眾生，履踐聖迹，\n> 不動解脫。始舉足時，當願眾生，\n> 越度生死，善法滿足。被著衣裳，\n> 當願眾生，服諸善根，每知慚愧。\n> 整服結帶，當願眾生，自檢修道，\n> 不壞善法。次著上衣，當願眾生，\n> 得上善根，究竟勝法。著僧伽梨，\n> 當願眾生，大慈覆護，得不動法。\n> 手執楊枝，當願眾生，心得正法，\n> 自然清淨。晨嚼楊枝，當願眾生，\n> 得調伏牙，噬諸煩惱。左右便利，\n> 當願眾生，蠲除污穢，無婬怒癡。\n> 已而就水，當願眾生，向無上道，\n> 得出世法。以水滌穢，當願眾生，\n> 具足淨忍，畢竟無垢。以水盥掌，\n> 當願眾生，得上妙手，受持佛法。\n> 澡漱口齒，當願眾生，向淨法門，\n> 究竟解脫。手執錫杖，當願眾生，\n> 設淨施會，見道如實。擎持應器，\n> 當願眾生，成就法器，受天人供。\n> 發趾向道，當願眾生，趣佛菩提，\n> 究竟解脫。若已在道，當願眾生，\n> 成就佛道，無餘所行。涉路而行，\n> 當願眾生，履淨法界，心無障礙。\n> 見趣高路，當願眾生，昇無上道，\n> 超出三界。見趣下路，當願眾生，\n> 謙下柔軟，入佛深法。若見險路，\n> 當願眾生，棄捐惡道，滅除邪見。\n> 若見直路，當願眾生，得中正意，\n> 身口無曲。見道揚塵，當願眾生，\n> 永離塵穢，畢竟清淨。見道無塵，\n> 當願眾生，大悲所熏，心意柔潤。\n> 見深阬㵎，當願眾生，向正法界，\n> 滅除諸難。見聽訟堂，當願眾生，\n> 說甚深法，一切和合。若見大樹，\n> 當願眾生，離我諍心，無有忿恨。\n> 若見叢林，當願眾生，一切敬禮，\n> 天人師仰。若見高山，當願眾生，\n> 得無上善，莫能見頂。若見刺棘，\n> 當願眾生，拔三毒刺，無賊害心。\n> 見樹茂葉，當願眾生，以道自蔭，\n> 入禪三昧。見樹好華，當願眾生，\n> 開淨如華，相好滿具。見樹豐果，\n> 當願眾生，起道樹行，成無上果。\n> 見諸流水，當願眾生，得正法流，\n> 入佛智海。若見陂水，當願眾生，\n> 悉得諸佛，不壞正法。若見浴池，\n> 當願眾生，入佛海智，問答無窮。\n> 見人汲井，當願眾生，得如來辯，\n> 不可窮盡。若見泉水，當願眾生，\n> 善根無盡，境界無上。見山㵎水，\n> 當願眾生，洗濯塵垢，意解清淨。\n> 若見橋梁，當願眾生，興造法橋，\n> 度人不休。見修園圃，當願眾生，\n> 𦓷除穢惡，不生欲根。見無憂林，\n> 當願眾生，心得歡喜，永除憂惱。\n> 見好園池，當願眾生，勤修眾善，\n> 具足菩提。見嚴飾人，當願眾生，\n> 三十二相，而自莊嚴。見素服人，\n> 當願眾生，究竟得到，頭陀彼岸。\n> 見志樂人，當願眾生，清淨法樂，\n> 以道自娛。見愁憂人，當願眾生，\n> 於有為法，心生厭離。見歡樂人，\n> 當願眾生，得無上樂，憺怕無患。\n> 見苦惱人，當願眾生，滅除眾苦，\n> 得佛智慧。見強健人，當願眾生，\n> 得金剛身，無有衰耄。見疾病人，\n> 當願眾生，知身空寂，解脫眾苦。\n> 見端正人，當願眾生，歡喜恭敬，\n> 諸佛菩薩。見醜陋人，當願眾生，\n> 遠離鄙惡，以善自嚴。見報恩人，\n> 當願眾生，常念諸佛，菩薩恩德。\n> 見背恩人，當願眾生，常見賢聖，\n> 不作眾惡。若見沙門，當願眾生，\n> 寂靜調伏，究竟無餘。見婆羅門，\n> 當願眾生，得真清淨，離一切惡。\n> 若見仙人，當願眾生，向正真道，\n> 究竟解脫。見苦行人，當願眾生，\n> 堅固精勤，不退佛道。見著甲冑，\n> 當願眾生，誓服法鎧，得無師法。\n> 見無鎧仗，當願眾生，遠離眾惡，\n> 親近善法。見論議人，當願眾生，\n> 得無上辯，摧伏外道。見正命人，\n> 當願眾生，得清淨命，威儀不異。\n> 若見帝王，當願眾生，逮得法王，\n> 轉無礙輪。見帝王子，當願眾生，\n> 履佛子行，化生法中。若見長者，\n> 當願眾生，永離愛欲，深解佛法。\n> 若見大臣，當願眾生，常得正念，\n> 修行眾善。若見城郭，當願眾生，\n> 得金剛身，心不可沮。若見王都，\n> 當願眾生，明達遠照，功德自在。\n> 若見妙色，當願眾生，得上妙色，\n> 天人讚歎。入里乞食，當願眾生，\n> 入深法界，心無障礙。到人門戶，\n> 當願眾生，入總持門，見諸佛法。\n> 入人堂室，當願眾生，入一佛乘，\n> 明達三世。遇難持戒，當願眾生，\n> 不捨眾善，永度彼岸。見捨戒人，\n> 當願眾生，超出眾難，度三惡道。\n> 若見空鉢，當願眾生，其心清淨，\n> 空無煩惱。若見滿鉢，當願眾生，\n> 具足成滿，一切善法。若得食時，\n> 當願眾生，為法供養，志在佛道。\n> 若不得食，當願眾生，遠離一切，\n> 諸不善行。見慚愧人，當願眾生，\n> 慚愧正行，調伏諸根。見無慚愧，\n> 當願眾生，離無慚愧，普行大慈。\n> 得香美食，當願眾生，知節少欲，\n> 情無所著。得不美食，當願眾生，\n> 具足成滿，無願三昧。得柔軟食，\n> 當願眾生，大悲所熏，心意柔軟。\n> 得麁歰食，當願眾生，永得遠離，\n> 世間愛味。若嚥食時，當願眾生，\n> 禪悅為食，法喜充滿。所食雜味，\n> 當願眾生，得佛上味，化成甘露。\n> 飯食已訖，當願眾生，德行充盈，\n> 成十種力。若說法時，當願眾生，\n> 得無盡辯，深達佛法。退坐出堂，\n> 當願眾生，深入佛智，永出三界。\n> 若入水時，當願眾生，深入佛道，\n> 等達三世。澡浴身體，當願眾生，\n> 身心無垢，光明無量。盛暑炎熾，\n> 當願眾生，離煩惱熱，得清涼定。\n> 隆寒氷結，當願眾生，究竟解脫，\n> 無上清涼。諷誦經典，當願眾生，\n> 得總持門，攝一切法。若見如來，\n> 當願眾生，悉得佛眼，見諸最勝。\n> 諦觀如來，當願眾生，悉覩十方，\n> 端正如佛。見佛塔廟，當願眾生，\n> 尊重如塔，受天人敬。敬心觀塔，\n> 當願眾生，尊重如佛，天人宗仰。\n> 頂禮佛塔，當願眾生，得道如佛，\n> 無能見頂。右遶塔廟，當願眾生，\n> 履行正路，究暢道意。遶塔三匝，\n> 當願眾生，得一向意，勤求佛道。\n> 讚詠如來，當願眾生，度功德岸，\n> 歎無窮盡。讚佛相好，當願眾生，\n> 光明神德，如佛法身。若洗足時，\n> 當願眾生，得四神足，究竟解脫。\n> 昏夜寢息，當願眾生，休息諸行，\n> 心淨無穢。晨朝覺悟，當願眾生，\n> 一切智覺，不捨十方。\n> 「佛子！是為菩薩身、口、意業能得一切勝妙功德，諸天、魔、梵、沙門、婆羅門、人及非人、聲聞、緣覺所不能動。」\n> 大方廣佛華嚴經\n\n### 6.2 四十华严（`T10n293`）\n\n不含本品（彼唯《入法界品》全译·普贤行愿·单品经非略本·讲记 ep07）——无对读段，如实标明。净行品之单独流通（念诵本）另为一事·§八·存疑清单。\n\n### 6.3 藏译\n\n仅编目级：`data/catalog/chapters.yaml` 净行 order 11·**in_tibetan: 1**·title_en \"Pure Practices\"；`data/translation/diff_matrix.yaml`「**汉藏基本对应，无显著差异**」（diff_type E）。德格版 Toh 已入库（035–038），本品对应段逐字对勘未做〔未竟〕。**藏 16 开篇实测**〔L.218〕：德格 035 卷 fol 210b——第 16 章开篇「**དེ་ནས་བྱང་ཆུབ་སེམས་དཔའ་ཡེ་ཤེས་དཔལ་གྱིས་བྱང་ཆུབ་སེམས་དཔའ་འཇམ་དཔལ་ལ་འདི་སྐད་ཅེས་སྨྲས་སོ…**」（尔时智严菩萨告文殊师利菩萨言）——**开篇即点名问主与答主**：`ye shes dpal`（智首）问 `'jam dpal`（文殊），与本品「爾時，智首菩薩問文殊師利菩薩言」**人物、问答方向逐一相应**，为全战役藏汉开篇互证之最直接者〔对应判读〔本文判断〕·逐字对勘未作；TOC 出 `data/alignment/tibetan-derge-toc.json` L.201 提取〕。\n\n### 6.4 校勘记（底本自歧与诸家所见文异）\n\n| # | 项 | 底本／诸家 | 处理 |\n|---|---|---|---|\n| 1 | 总标「善用其心」（八十）vs「成就身口意业」（六十） | 两译义差·讲记「賢首改圓滿身語意業」系口诵（两译均无「圓滿身」·实测 0/0） | 各照底本·讲者只标不改·§2.2/§5.3′ |\n| 2 | 誓式标点：八十全冒号（141）vs 六十全逗号（140） | 体式 0 交叉（实测 §7.4） | 引文照底本各自体式·不强改 |\n| 3 | 誓数 141（八十）vs 140（六十） | 花喻区「若見華開＋若見樹華」vs「見樹好華」·净差 1 | 各照底本·口径归属由疏家所依本定·§5.4 |\n| 4 | 「仙人」八十 0 见／六十 1 见；法藏十势引「如見仙人等」 | 直证法藏据六十文·140 计数者口径归 60 | 版本学旁证登录·§5.2 |\n| 5 | 9 卷十四·品十一·剥校勘；起锚唯一见＋止锚取首见裁重题）\nimport re, io, xml.etree.ElementTree as ET\nSKIP = {'note', 'rdg', 'mulu', 'pb', 'anchor', 'app'}\nout = []\ndef walk(el):\n    tag = el.tag.split('}')[-1]\n    if tag in SKIP: return\n    if tag == 'lb': out.append(' ')\n    if el.text: out.append(el.text)\n    for c in el:\n        walk(c)\n        if c.tail: out.append(c.tail)\nwalk(ET.parse('data/references/cbeta/T10n0279.xml').getroot())\nfull = ''.join(out)\ncjk = lambda s: ''.join(c for c in s if '\\u4e00' <= c <= '\\u9fff')\n# 〔锈标断言〕起锚全档唯一见；止锚全档二见·取首见 @124463\nassert full.count('淨行品第十一') == 1\nassert full.count('賢首品第十二') == 2\ni = full.find('淨行品第十一'); k = full.find('賢首品第十二', i)\nassert k == 124463, k\nbody = re.sub(r'\\s', '', full[i:k])\nassert len(cjk(body)) == 2968 and len(body) == 3719\nassert body.count('當願眾生：') == 141 and body.count('當願眾生，') == 0\nassert body.count('云何') == 21 and body.count('頌') == 0 and body.count('偈') == 0\n# 十段实计（依澄观段首锈·逐段与疏家全合）\nseg = ['菩薩在家','捨居家時','若入堂宇','下足住時','手執楊枝','手執錫杖',\n       '若見城廓','從舍出時','諦觀佛時','若洗足時']\nidx = [body.find(s) for s in seg]; cnt = []\nfor a in range(10):\n    b = idx[a+1] if a+1 < 10 else len(body)\n    cnt.append(body.count('當願眾生', idx[a], b))\nassert cnt == [11,15,7,6,7,55,22,5,10,3] and sum(cnt) == 141\nsub = [body.count('當願眾生', body.find('手執錫杖'), body.find('若見眾會')),\n       body.count('當願眾生', body.find('若見眾會'), body.find('見嚴飾人')),\n       body.count('當願眾生', body.find('見嚴飾人'), body.find('若見城廓'))]\nassert sub == [12,19,24]\n# 六十侧（juan6·STEP0 L.181 新档）\np60 = io.open('data/references/cbeta_txt/T09n0278_juan6.txt', encoding='utf-8').read()\nj = p60.find('淨行品第七'); k60 = p60.find('賢首菩薩品第八', j)\nseg60 = p60[j:k60]; t60 = re.sub(r'\\s', '', seg60)\nassert len(cjk(seg60)) == 2895 and len(t60) == 3630 and len(seg60) == 3821\nassert t60.count('當願眾生，') == 140 and t60.count('當願眾生：') == 0\nassert seg60[seg60.find('云何'):].count('云何') >= 11\nq60 = t60[:t60.find('爾時，文殊')]\nassert q60.count('云何') == 11 and q60.count('？') == 11\nassert body.count('仙人') == 0 and t60.count('若見仙人') == 1\nprint('八十净行品数据层 OK · CJK', len(cjk(body)), '· 剥空白raw', len(body), '· 誓141')\nprint('ALL P11 CHECKS PASSED')\n```\n\n> 实测（2026-10-25·§7.4 代码逐字执行件 `_p11_cov_run.py` 输出观察 `_p11_cov_out.txt`·8 行：「八十净行品数据层 OK · CJK 2968 · 剥空白raw 3719 · 誓141 · 问段云何20 · 冒号式141/逗号0」「八十句读：。144 ？21 ：143 ，303 、119 ；7」「八十十段实计分群 11/15/7/6/7/55/22/5/10/3 合计141 · 与澄观疏家数逐段全合」「八十第六段三分实计 道路12·事境19·人物24 合计55 · 与疏合」「六十净行品数据层 OK · CJK 2895 · raw(含换行) 3821 · 剥空白 3630 · 誓140 · 问段云何11 · 逗号式140/冒号0」「两译差一：八十花喻区「若見華開」+「若見樹華」二誓 ↔ 六十「見樹好華」一誓（净差+1）」「互增互缺（净差0）：六十独有「若見仙人」「若見妙色」·八十独有「見操行人」「見處林藪」「ALL P11 CHECKS PASSED」·关键词另经 `_p11_kw.py` 实测·全部断言通过）。\n\n### 7.5 愿式结构·数据科学四视角〔L.189 本批新增〕\n\n> 数据基底＝`_e11_full.py` 结构化 dump（80 侧 6 单元：head×1·p×3·lg×1·p×1·品内 div 限域）＋`_e11_vows.txt`（141 愿·「。」切分·141/141 标准式）＋`_e11_stats.py` 频计（品界 CJK-only @87073–90041·2,968·§7.4 同锚）。**凡比附义理者一律〔本文判断〕。**\n\n**L1·公式频（`_e11_stats.py` 实测）**：八十侧品界「當願眾生」×141·「云何」×21（问段 20＋答起 1）·「爾時」×2·「佛子」×7·「眾生」×145·「普賢」×2·「善用其心」×1·「如是用心」×1·「願」×144；六十侧「當願眾生」×140·「云何」×11·「爾時」×2·「佛子」×6·「身、口、意」×12。\n\n**L2·愿长直方（结构匀整度）**：愿长（CJK）**16 字×140 愿·15 字×1 愿**（愿 074「見修園圃，當願眾生：五欲圃中，𦓷除愛草」——「𦓷」U+264B7 非 BMP·CBETA 原字形照录不替换）——**141 愿仅一字之参差**，为全经罕见的等长愿链〔本文判断〕；标准式「X，當願眾生：Y，Z」regex 全合 **141/141**（首句 2–14 字·愿境二句各 4–10 字）。\n\n**L3·首句三分（所依事形态）**：首句以「**若**」起 44／含「**見**」61／以「**時**」收 17——触境发愿（見）近半·泛指假设（若）三成·时刻定位（時）一成余：全品**以境为纲不以时为纲**，与澄观「隨事巧願」之科恰应〔本文判断·形式描写之似〕。\n\n**L4·段六三分与两译量化对**：`_p11_cov_run.py` 实测段六 55＝**道路 12·事境 19·人物 24**（与疏合·§5.1/§7.3）；两译体式量化：\n\n| 指标 | 八十 | 六十 | 口径 |\n|---|---|---|---|\n| 當願眾生 | 141 | 140 | 差一在花喻区 §6.1〔六〕 |\n| 云何 | 21（问 20＋答起 1） | 11 | 问纲密度差近倍 |\n| 三业词形 | 身、語、意 | 身、口、意 | 六十「身、口、意」×12 实测 |\n| 誓式标点 | 冒号 141／逗号 0 | 逗号 140／冒号 0 | 体式 0 交叉·§6.1〔三〕 |\n| CJK | 2,968 | 2,895 | 两译篇幅相若（差 73） |\n**图 7-1·十段愿分布（横向条形·L.189 本批·数据源 `_e11_vows.txt`／`_e11_stats.py` 实测）**\n\n<svg viewBox=\"0 0 680 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"净行品十段愿分布图\">\n  <text x=\"340\" y=\"18\" text-anchor=\"middle\" font-size=\" 依自他身历事而问·澄观「對緣巧願非智不熟故。智首問也」 | `T10n0279`／`T1733` |\n| 文殊師利 | *Mañjuśrī* 妙德·答主·「般若觀空」（澄观）·说一百四十一誓 | `T10n0279`／`T1735` |\n| 澄观 | 唐·清凉山大华严寺沙门 | `T1735`／`T1736` |\n| 法藏 | 唐·魏国西寺沙门 | `T1733` |\n| 智俨 | 唐·终南山至相寺沙门（华严二祖） | `T1732` |\n| 慧苑 | 唐·大薦福寺沙门（本品**有专段**） | X0221 |\n| 李通玄 | 唐·李通玄 | `T1739` |\n\n### 附录二：名相表\n（见 §4.5：善用其心·當願眾生·紹隆佛種／深入經藏／統理大眾·三归依愿·六度·七觉支·三科·頭陀行·第二導師）\n\n### 附录三：经文要句\n- 宗眼：「若諸菩薩**善用其心**，則獲一切勝妙功德。」（§2.2）\n- 首誓（在家）：「**菩薩在家，當願眾生：知家性空，免其逼迫。**」（§2.3 段一）\n- 三归依：「**自歸於佛，當願眾生：紹隆佛種，發無上意。自歸於法……自歸於僧……**」（§2.3 段二）\n- 历境：「**若見高山，當願眾生：善根超出，無能至頂。**」（§2.3 段六）\n- 结叹：「**佛子！若諸菩薩如是用心，則獲一切勝妙功德……所不能動。**」（§2.4）\n（〔L.189 本批〕**一百四十一愿全文已入 §2.3′ 逐愿照录**·问端二十云何全文已入 §2.1·复核件 `_e11_dump.txt`／`_e11_vows.txt`／`_e11_stats.py`；旧重核件 `_p11_cov_run.py`／`_p11_cite*.py` 仍有效·两口径一致；六十全文另见 §6.1′ 全本）\n\n### 附录四：注疏引文汇\n（§5.1–§5.3′ 各家摘引·皆注经号与归一化字符位锚）\n\n**〔L.189 本批·达标基线补全〕澄观《华严经疏》「淨行品第十一」本科段全文照录**（`T1735` raw @188383–195839·跨卷十五～十六·CJK-only 坐标回映切片·分页符行剔除·余照原档分行排段不转写不断句·卷题「大方廣佛華嚴經疏卷第十五／十六」两行及撰人在原档位置保留·康熙部首码位已归一正字（L.199）·「今初」系块内逐字照原档不删·本附录在 §二 审计区外不污引文审计）：\n\n**甲·品题科首·五门总标·来意（有解無行虛費多聞）**\n\n> 淨行品第十一 (入第十四經)\n\n> 釋此一品五門分別。初來意者。夫欲階妙位必資勝行。有解無行虛費 多聞。故前品明解此品辨行。又前明入理觀行。今辨隨事所行。又前\n\n**乙·释名（具折囉·波利·戍輪律提·举足下足尽文殊心）**\n\n> 行此願並義次第。故次來也。次釋名者。梵云具折囉。此云所行。波 利此云皆也遍也。戍輪律提云清淨也。謂三業隨事緣歷名為所行巧願\n\n> 防非離過成德。名為清淨。又悲智雙運名為所行。行越凡小故稱清 淨。以二乘無漏。不能兼利非真淨故。得斯意者。舉足下足盡文殊\n\n> 心。見聞覺知皆普賢行。文殊心故。心無濁亂。是曰清淨。普賢行\n\n**丙·宗趣（随事巧愿防心不散·悲智大行·成就普贤实德）**\n\n> 故。是佛往修諸佛菩薩同所行也。所行即淨。持業釋也。三宗趣者。 以隨事巧願防心不散。增長菩薩悲智大行為宗。成就普賢實德為趣。\n\n**丁·解妨·六重行与三谛观（事理智悲无碍止观）**\n\n> 四解妨者。問文中但辨一百餘願。何有行耶。答文中辨行略有數重。 謂就所歷事中。始自出家終於臥覺。皆事行也。知家性空理行也。觸\n\n> 境不迷善達事理智行也。以願導智不滯自利大悲行也。上二不二悲智 無礙行也。遇違順境心不馳散止行也。智不沈沒觀行也。即止觀雙運\n\n> 行也。又對於事境善了邪正。當願眾生。皆假觀也。知身空寂心無染 著空觀也。見如實理中觀也。或先空後中。或先假後空。或一或二或\n\n> 一念頓具。斯為妙達三諦觀之行也。又所造成行皆施眾生。不起二乘 之心。安忍強軟兩境唯增善品。心不異緣妙達性空。善巧迴轉。皆願\n\n> 利物同趣菩提。二乘天魔所不能動。善知藥病決斷無差。即十度齊修 之行也。又皆願利生皆成佛德。見惡必令其斷見善必令其具。即四弘\n\n> 誓願之行也。故智首總標諸德。以求其因。文殊令善用心頓獲眾果。\n\n**戊·解妨·续（妙行统唯无念之难·念无念无碍）**\n\n> 但言惟願豈不感哉。復有問言。夫妙行者。統唯無念。今見善見惡願 離願成。疲役身心豈當為道。答若斯見者。離念求於無念。尚未得於\n\n> 真無念也。況念無念之無礙耶。又無念但是行之一也。豈成一念頓圓\n\n**己·释文·智首问科尽＋文殊答科起首（標問答人·二十云何十一段德·答二分）**\n\n> 如上所明也。行學之者願善留心。第五釋文中二。先智首問舉德徵 因。後文殊答標德顯因。今初。亦先標問答之人。後陳所疑之問。今\n\n> 初。此二菩薩為問答者。歷事巧願必智為導。故事近旨遠。唯妙德 故。文殊則般若觀空。智首則漚和涉事。涉事不迷於理。故雖願而無\n\n> 取。觀空不遺於事。故雖寂而不證。是為權實雙游假茲問答。二陳所 問中。有二十云何。總十一段。段各十句。成一百一十種德。第一段\n\n> 明三業離過成德。二得堪傳法器。三成就眾慧。四具道因緣。五於法 善巧。六修涅槃因。七滿菩薩行。八得十力智。九十王敬護。十能為\n\n> 饒益。十一超勝尊貴。此十一中。若就相顯。二四與六此三唯因。八 及十一此二唯果。餘通因果。或攝為四對因果。初二十句問福因福\n\n> 果。先因後果。次二十句問慧因慧果。先果後因。三二十句問巧解因 觀行果。四有五段。問眾行因成德果。初一為因餘四為果。或分為\n\n> 二。初十云何。問淨行體。是問因義。後十云何。問行所成。是問果 義。以善修七覺等。亦是淨行之能。故皆言云何得者。為修何行而得\n\n> 之耶。初十望後故說為因。望歷緣巧願成淨行體。即是於果未是圓果 而是分果故。上總云舉果徵因。今分為二。初之一段總問其果。後十\n\n> 別明。今初。十句得此十種三業。成下十果。由無過三業故超勝尊 貴。由不恚害故常為饒益。由無餘惑不可譏毀。故十王敬護。由惡緣\n\n> 不可壞得佛十力。由修行不退轉。滿菩薩行。由遠離諸相如如不動。 成涅槃因。由德行殊勝故於法善巧。由體清淨如虛空。故成具道緣。\n\n> 由涉境無染故德堪傳法器。由智先導故成就眾慧。又由後十能成就此 十。以十三業永無失等唯佛不共。分分無失。一通於因。又此十句初\n\n> 一總顯無過。次八別顯無過。後一總出其因。若以智慧為先導。身語 意業常無失故。又於中八。前二離過後六成德。又後九中。不隨於瞋\n\n> 故不害。不隨於慢故不可毀。不隨惡見故不壞敗。不隨於疑故不退 動。恒修勝行不隨於貪。故清淨無染。不隨於癡故智為先導。所作稱\n\n> 真。如是等業云何而得。後十段別明中。初一異熟果。次四士用果。 次二離繫果。次一增上果。後二等流果。今初。即修道之器。以菩薩\n\n> 起修行時要具此十。方成二利之行。瑜伽具釋。一常生中國有佛法 處。二種族尊貴非下賤等。三生信向三寶修善之家。非外道等家。四\n\n> 形色端嚴非醜陋等。五具丈夫相諸根不缺。六正念不忘。亦宿念現 前。七慧悟高明善解世法。八柔和調善離過修行。九志力堅強故無怯\n\n> 弱。十性自開覺不染世法。又無畏者。依智度論。菩薩有四種無畏。 一總持無畏。於法記持不懼忘失。二知根無畏。知根受法不懼差失。\n\n> 三決疑無畏。隨問能答不懼不堪。四答難無畏。有難皆通不懼疑滯。 今並皆得故云具足。又此十事。若約法者。生在佛家是生處具足等。\n\n> 思之。又具足者。唯佛一人云云。第二十慧下四段。明士用果中。一 慧為揀擇。二力謂修習。三善巧謂智。四道品助修悉以三業而得成\n\n> 就。今初。言慧者。即道之體。十中一勝世間故。二過二乘故。三揀 權教故。四佛果超因故。上四揀劣餘六當體。一無分量。二無若干。\n\n> 三超言念。四無等匹。五難比校。六唯證相應。欲言其有無相無形。 欲言其無聖以之靈。欲言俱者慧無二體。欲言雙非非無詮顯。故不可\n\n> 說。第三力者。即具道因緣。皆言力者。此十各有資道之能故。一因 力者。即是種性。謂已有習種無倒聞熏與性種合。故名為因。梁攝論\n\n> 云。多聞熏習與阿賴耶識中解性和合。一切聖人以此為因。無性攝論 云。此聞熏習。雖是有漏而是出世心種子性。二欲力者。有勝欲樂希\n\n> 大菩提。及起行故。三方便者。謂造修力。依六方便成悲智故。一慈 悲顧戀。二了知諸行。三欣佛妙智。四不捨生死。五輪迴不染。六熾\n\n> 然精進。攝論廣說。四緣力。謂善友勸發。五所緣力。即所觀察悲智 之境。六根謂信等。七觀察者。謂於自他事理藥病善揀擇故。八奢摩\n\n> 他。此云止也。九毘鉢舍那。此云觀也。瑜伽起信等論。深密涅槃等 經。廣辨其相。具如別章。今略顯其相。以為十門。一心行稱理攝散\n\n> 名止。二止不滯寂不礙觀事。三由理事交徹而必俱。遂使止觀無礙而 雙運。四理事形奪而俱盡故。止觀兩亡而絕寄。五絕理事無礙之境。\n\n> 與泯止觀。無礙之心二而不二。故不礙心境而一味。不二而二故。不 壞一味而心境。六由即理之事收一切法故。即止之觀亦見一切。七由\n\n> 此事即是彼事。故令止觀見此心即是彼心。八由前中。六則一多相入 而非一。七則一多相是而非異。此二不二同一法界。止觀無二之智頓\n\n> 見即八二門同一法界。而無散動。九由事則重重無盡止觀。亦普眼齊 照。十即此普門之智為主故。頓照普門法界時。必攝一切為伴無盡無\n\n> 盡。是此華嚴所求止觀。十思惟者。籌量應作不應作故。第四於法善 巧。皆約流轉以明前四流轉之體。三界流轉之處。三世流轉之時。三\n\n> 科之義略如前釋。廣如別章。緣起六地廣明。三界三世如前後釋。皆 言善巧者。一善知彼法空無所有。二善知不壞假名分別法。相加能攝\n\n> 無盡彌善巧也。第五修涅槃因。七覺三空十地品廣說。第六滿菩薩 行。此下二種明離繫果。初六度四等修。即士用。滿即離繫。治諸蔽\n\n> 故及第七具足十力。並見上文。第八十王敬護是增上果。第九云何得 與一切眾生為依下二段明等流果。由本願力為依救等。由本行力為第\n\n> 一等。今初能為饒益。依等十句。如迴向初。第十為第一下。超勝尊 貴。十地論釋。今就佛果略釋其相。謂如來功德海滿更無所少。故稱\n\n> 第一。此亦總句。大者體包法界故。勝者自利圓滿故。最勝者利他究 竟故。妙者煩惱障盡故。極妙者所知障盡故。上者。望下無及故。無\n\n> 上者望上更無故。無等者望下無儔故。無等等者。望儔皆是無等者 故。所以廣舉諸德者。欲顯行之勝故。上來問竟。第二文殊答中。文\n\n> 分為二。第一歎問成益。饒益者利益也。安隱者安樂也。利樂者即上 二也。佛地論第七有五重釋。利樂之義已見光明覺品。第二佛子下。\n\n> 正酬其問。於中二。先標因成德酬其舉德。後指事顯因酬其徵因。今 初。先標其因。謂善用其心。心覺神明之奧心。正則萬德攸歸。言善\n\n> 用者。即後歷緣巧願觸境入玄如上所辨。則獲下顯所成德。初總後別 總謂一切勝妙功德。皆因用心一百一十門。德何足難就。可謂一言蔽\n\n> 諸。勝謂獨尊。妙謂離相又德無不備云勝。障無不盡名妙。此之總 句。亦即酬上十種三業之總句也。餘九別顯。句雖有九義亦有十。如\n\n> 次酬上十段之德。一於諸佛法心無所礙者。即初第一堪傳法器德。念 慧覺悟皆具足故。二住去來今諸佛之道。即上成就眾慧。三世諸佛唯\n\n> 以佛慧為所乘故。三隨眾生住恒不捨離。即上具道因緣。成就種性欲 樂方便。常以眾生為所緣故。四如諸法相。悉能通達。即十善巧義無\n\n> 惑也。五斷一切惡。即七覺三空揀擇棄惡。無越此故。六具足眾善。 即六度四等。七當如普賢色像第一。由此故得十王敬護。八一切行\n\n> 願。皆得具足。即是前文成就十力。得佛果位方具足故。故晉經無此 一句。而有成就如來一切種智。斯為十種智力定無惑也。唯此一段望\n\n> 前不次以內具種智外具色相。此二同在果圓前後無在。或譯者不迴。 九於一切法無不自在故。能與物為依為救為炬為明。十而為眾生第二\n\n> 導師。即是上文於眾超勝。上求第一唯佛一人。今纔發心則道亞至 尊。故云第二。然舊經中。亦云而為眾生第一尊導。故知第二譯者意\n\n**庚·释文·文殊答科（叹问·标因成德·十段德酬答·第二导师·指事顯因三科）**\n\n> 也。第二佛子云何下。指事顯因於中三。初總徵次別顯。後總結成 益。二別顯中五門分別。一總明大意文中。總有一百四十一願。菩薩\n\n> 大願深廣如海。應如迴向非止爾也。此蓋示於體式餘皆倣此。又非無 表。一百者。十信圓融一一具十也。四十一者。即四十一位也。明此\n\n> 諸位所有惑障。由此能淨所有勝行。由此能行故。二通顯文旨。然此 諸願句雖有四事但有三義開為六。言三事者。謂初句願所依事。次句\n\n> 願所為境。後二句是願境成益。開為六者。初事有二。一者內。謂菩 薩自身根識等。經云菩薩等故。二者外。謂他身或依正資具等。經云\n\n> 在家等故。次事亦二種。一能發願者。二所願眾生。經云當願眾生 故。後事亦二。一者自益由此諸願成前諸德故二者益他。由此發願願\n\n> 眾生故。此後二句。或前句是因後句是果。如云所行無逆成一切智 等。或二俱是因。如云巧事師長習行善法等。或二俱佛果。如云永離\n\n> 煩惱究竟寂滅等。或俱通因果。如云以法自娛了妓非實等。或三四二 句共成一句。如云演說種種無乖諍法等。亦可後。二句中初句所入\n\n> 法。如云知家性空等。後句所成益免逼迫等以不必具故合為一。三別 開義類。然上三事中願所依事。雖有多類。不出善惡依正內外。隨義\n\n> 準之。二願所為境。其一一願盡該法界。一切有情不同權小談有藏無 故。又願即是行。成迴向故。一一皆成所行清淨善業行故。如云知家\n\n> 性空。則菩薩之心必詣空矣。三願所為境。成利益中。由願於他成種 種德。自獲如前所說功德。然有二義。一通二別。通則隨一一願成上\n\n> 諸德。斯為正意。二別顯者。如願於他得堅固身心無所屈。則自必成 十種三業離過成德之德也。二願於他具足成滿一切善法。則自成就堪\n\n> 傳法器。三願於他深入經藏智慧如海。則自成眾慧。四願於他具諸方 便得最勝法。則自成就具道因緣。五願於他語業滿足巧能演說。則自\n\n> 成就十善巧德。六願於他得善意欲洗除惑垢則自成七覺三空。七願於 他所作皆辦具諸佛法。則自成滿菩薩行德。八願於他捨眾聚法成一切\n\n> 智。則自成就如來十種智力。九願於他皆如普賢端正嚴好。則自成就 十王敬護。十願於他統理大眾一切無礙。則自成饒益為依救德。十一\n\n> 願他得第一位入不動法。則自成就超勝第一德。以斯十一配上答中總 別十一段。文並可知。通別交絡應成四句。謂一切願成一德。一切願\n\n**辛·别显·十例（会事同理·处染翻染·以近同远）**\n\n> 成一切德等。以因願一多相即故。成德亦一多鎔融。四對辨成例。謂 若以初後二事相對辨例。略有十例一會事同理例。如菩薩在家事也。\n\n> 性空理也。二處染翻染例。如若得五欲染也。拔除欲箭翻染也。三相 似類同例。如若有所施令一切能捨等。四世同出世例如上升樓閣願升\n\n> 正法樓等。五以因同果例。如正出家時願同佛出家等。六捨偽歸真 例。如著瓔珞願到真實處等。七以人同法例。如見病人願離乖諍等。\n\n> 八以境成行例。如見涌泉願善根無盡等。九以妄歸真例。如見婆羅門 願離惡等。十以近同遠例。如受和尚教願到無依處等。五正釋經文。\n\n**壬·長分為十名单·段一家誓疏解（贪爱击缚·事父母即是事佛）**\n\n> 長分為十。初有十一願。明在家時願。二有十五願。出家受戒時願。 三有七願。就坐禪觀時願。四有六願。明將行披挂時願。五有七願。\n\n> 澡漱盥洗時願。六有五十五願。明乞食道行時願。七有二十二願。明 到城乞食時願。八有五願。明還歸洗浴時願。九有十願。明習誦旋禮\n\n> 時願。十有三願。明寤寐安息時願。今初。在家有十一願。初一總舉 在家。以家是貪愛擊縛所故。若了性空。則雖處居家家不能迫。次一\n\n> 在家行孝願。以是至德行本故。首而明之。大集經云。世若無佛善事 父母。事父母者即是事佛。父母於我為先覺故。今翻令事佛者。生長\n\n> 法身故。護養一切者。一切眾生皆我子故護之。一切男女皆我父母故 養之。生生無不從之受身故。平等敬之法身佛故。次四受家室等願。\n\n> 然五欲射心猶如箭中。王侯有宮餘皆名室。次五在家所作事業等願。 在頸曰瓔。在身曰珞。珞以持衣。瓔以繫冠。一切悉捨亦捨心也。了\n\n**癸·段二出家受戒疏解（三归·落[髟/柔]·和尚闍梨·受具足戒）**\n\n> 聚無性成佛智也。第二捨居家下。出家受戒時有十五願。初一正捨俗 家。次三出家方便。僧伽藍者。此云眾園。眾有六和法則事理一味。\n\n> 故無諍也。大師謂佛。眾所宗故。小謂和尚。親所教故。若約末世三 師為大。七證為小。靡不有初鮮克有終。故希不退。次四正落[髟/柔]\n\n> 出家。袈裟者不正色衣也。亦云染色。表心染於法要。無所染方曰染 也。然二乘之染亦非真染。必心染大乘故。云具大仙道為於正法除其\n\n> 結使。方為究竟寂滅。落[髟/柔]披衣之後為正出家。餘七受學戒時。 初三自歸。佛在之日則五受之一。佛滅之後受五八戒。必依三歸。歸\n\n> 要三者。翻彼外道邪師邪教及邪眾故。猶如良醫良藥及看病人。煩惱 病愈故。為與眾生為緣念故。三寶之義至下當釋。受學戒者即十戒\n\n> 也。亦通五戒。優婆塞戒經云。欲受菩薩戒先應遍受五戒十戒二百五 十戒。若尼則受六事及五百戒。受謂受戒。學即隨戒。願中即止作二\n\n> 持。闍梨者此云正行。軌範教授故云具足威儀。和尚此云親教。亦云 力生。道力自彼生故。故翻云入無生智。依之得戒故翻無依。具足戒\n\n> 言義含二種。一則大比丘戒。二則菩薩戒。亦制意地方為具足。第三\n\n**子·段三–段六疏解（坐禅·披挂·澡漱·锡杖三分·道路险道）**\n\n> 若入堂下七願。明就坐禪觀時願。初四為修方便。次二正修止觀。後 一修行事訖。第四下足住時下。明將行披挂時六願。下衣蓋醜故願得\n\n> 慚愧。上衣即衫襖之輩。前已辨袈 裟\n\n> 故。此直云僧伽梨。僧伽梨者義 云和合。新者二種。故者四種。要以重成故云和合。即是三衣中第一\n\n> 衣故。第五手執楊枝下。澡漱盥洗時有七願。楊枝五利是曰妙法。去 穢為淨。西域皆朝中嚼楊枝。淨穢不相雜。此為常規。凡欲習謂別須\n\n> 用之。盥者澡也。第六手執錫杖下。乞食道行時。總有五十五願。更\n\n**丑·段六续·事境人物疏解（柱·陂泽·池沼·汲井·根本智·报恩·五邪命）**\n\n> 分為三。初十二願游涉道路。次見眾會下十九願。所覩事境。後見嚴 飾下二十四願。所遇人物。今初。錫者輕也明也。執此杖者輕煩惱\n\n> 故。明佛法故。更有多義具如經辨。今略明二用。一執為行道之儀。 二振以乞食故。發相似之願。無依之道是真道也。向無餘法真涅槃\n\n> 也。真淨法界心所履也險道有二。一多賊鬼毒獸。二陜徑阻絕。初惑 業罪苦。凡夫之險道也。後自調滯寂二乘之險道也。皆為難處。不斷\n\n> 生死而入涅槃正法界也。二覩事境願。初覩眾會。謂眾聚多談無義 故。願說深法眾心易乖故令和合。二大柱者。舊經云大樹。梵云薩擔\n\n> 婆。 (去聲輕呼)\n\n> 此云樹也。薩擔婆 (入聲重呼)\n\n> 此云柱也。由茲二物呼聲相 濫。古今譯殊。柱有荷重之能。一舍由之而立翻。此願離我能之諍。\n\n> 忿恨何由而生。三德猶叢林森聳可敬。十一陂澤者。畜水曰陂。不集 諸流故願一味。十二說文曰。穿地通水曰池。沼即池也。取其盈滿引\n\n> 法流故。亦可巧思穿鑿能有說故。十三汲者取也。辯才演法猶綆汲 水。無憂林者處之忘憂故。三見嚴飾下二十四願。所遇人物。六云獲\n\n> 根本智滅眾苦者。若得見道無分別根本智。則斷惡道業無明故。三塗 苦滅。則三苦八苦亦皆隨滅。死及取蘊。直至金剛後根本智。則能永\n\n> 斷七願入真實慧永無病惱者。此有二種。一約入真見道之慧斷身病之 苦惱及煩惱病。謂一切惡趣諸煩惱品。所有麁重是分別起。亦為身病\n\n> 遠因。至歡喜地真見道中。一剎那斷。頓證三界四諦真如。身病及惑 永不復有。二約金剛心慧頓斷一切諸煩惱病及習氣隨眠。證極圓滿真\n\n> 實勝義。諸惑永亡。依上解者。真實慧者即根本智。但約所滅惑苦不 同耳。八四大乖違成病。知空則永無所乖。於佛菩薩能知恩德者。諸\n\n> 佛菩薩。始自發心普緣眾生。難行苦行不顧自身。垂形六道隨逐眾 生。見其造惡如割支體。迄成正覺隱其勝德。以貧所樂法誘攝拯救。\n\n> 見其憍恣示迹涅槃。留餘福教以濟危苦。故自頂至足從生至死。皆佛 之蔭。斯之恩德何可報耶。得人小恩常懷大報。不知恩者。多遭橫\n\n> 死。故經云。假使頂戴經塵劫。身為床座遍三千。若不傳法利眾生。 畢竟無能申報者。故唯自利利人如說修行。為報佛恩耳。沙門此云止\n\n> 息。畢竟止息唯大涅槃。世之甲冑隨於師旋。進忍甲冑趣於無師。能 離五邪方為正命。謂一詐現奇特。二自說功德。三占相吉凶。四高聲\n\n> 現威令他敬畏五為他說法行此五事若為利養皆邪命也。第三句通願離 五。第四句但離初一。明斷方稱長者。守王正法始曰大臣。第七若見\n\n**寅·段七–段十疏解（城郭二十二·从舍出五·讽诵十·右者顺义·洗足三）**\n\n> 城郭下。二十二願。到城乞食時願。初三總處王都。則賢達輻輳。林 藪則眾德攸歸。次三入家未入則諸家差別。入已唯一無多。如入佛乘\n\n> 無二三也。次八乞食得不。得願次七得食正食後一食訖說法。亦為報 施主之恩故。其中云藏護諸根者。瑜伽名善守根門。淨名云。所見色\n\n> 與盲等。乃至云知諸法如幻相是也。第八從舍出下。還歸洗浴時節炎 涼。五願可知。第九諷誦下。習誦旋禮時有十願。右者順義故。普耀\n\n> 經第二亦云。菩薩降神趣右脇者。所行無逆故。佛功德者。謂如來十 力等。第十若洗足下。寤寐安息時三願。一切智覺者。非唯三世齊\n\n**卯·结叹科（因所成益·心游大智·二不希彼故）＋卷十五／十六尾题原位**\n\n> 明。抑亦十方洞曉。一日始終既爾。餘時類然。第三若諸菩薩下。結 歎因所成益。若能如上為善用心。若此用心則內德齊圓。外不能動心\n\n> 游大智故。人天不能動。心冠大悲故。二乘不能動不動有二。一修行 時。此等不能惑亂故。二不希彼故。\n\n> 大方廣佛華嚴經疏卷第十五 大方廣佛華嚴經疏卷第十六\n\n> 唐清涼山大華嚴寺沙門澄觀撰\n\n### 附录五：对读简表\n（见 §6.1 表〔一〕–〔六〕、§6.3、§6.4 校勘九项）\n\n### 附录六：存疑清单\n| # | 项目 | 状态 |\n|---|------|------|\n| 1 | 编目二源分歧：`diff_matrix.yaml` 净行 `order_zh_60: 11`（应作 **7**·六十卷六「淨行品第七」直证） | 〔待核·不静默改·§6.4#8·归入编目修订另批〕 |\n| 2 | 李通玄数 140 而品第从八十（第十一）·数与第不同源 | 〔待核·孤例·§5.3〕 |\n| 3 | 「外不能動⏎心游大智故」换行断句·「動／心」归属 | 〔待核·断句存疑·§2.4/§6.4#9〕 |\n| 4 | 讲记 ep03「淨行品講三十幾次」·讲者自述课时数 | 〔待听核·非经证·§5.3′〕 |\n| 5 | 藏译德格版逐字对勘 | 〔待核·本机无 Toh·仅编目级·in_tibetan=1〕 |\n| 6 | 净行品单独流通之念诵本（现行《华严经净行品》）与八十本文之源流关系 | 〔待核·另批·§6.2〕 |\n| 7 | ep12「當願眾生與我一道加前三願」初稿误引 | 〔已删·L.184 照记订正：全库实测 0 见·无从回源·§三〕 |\n\n### 附录七：引用书目\n- `T // ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);
