.6] · T44-18〕\n\n<div class=\"tri-seg\" data-status=\"pending\">\n<section class=\"tri-lang tri-bo\"><p class=\"tri-head\"><span class=\"tri-tag\">藏</span><span class=\"tri-sub\">德格原字形 · 逐字回源</span></p><blockquote class=\"tri-text\" lang=\"bo\">ཇི་ལྟར་གླིང་བཞི་པ་འདིའི་རི་རབ་ཀྱི་རྩེ་མོར་ལྷའི་དབང་པོའི་ཁང་པ་རྣམ་པར་རྒྱལ་བར་ལྷའི་དབང་ པོ་བརྒྱ་བྱིན་གྱིས་དེ་བཞིན་གཤེགས་པའི་གདན་བཤམས་པ་དེ་བཞིན་དུ། འཇིག་རྟེན་གྱི་ཁམས་ཐམས་ཅད་ཀྱི་རི་རབ་ཀྱི་རྩེ་མོ་དག་ཏུ་འང་ལྷའི་དབང་པོ་བརྒྱ་བྱིན་དག་གིས་དེ་བཞིན་གཤེགས་པའི་གདན་དག་ཚུལ་དེ་འདྲ་བ་དང་རྒྱན་དེ་འདྲ་བར་བཤམས་པར་གྱུར་ཏོ། །</blockquote></section>\n<section class=\"tri-lang tri-zh\"><p class=\"tri-head\"><span class=\"tri-tag\">汉</span><span class=\"tri-sub\">待译 · 尚未产出</span></p><blockquote class=\"tri-text tri-pending\">〔待译 · 该段尚未产出（作业进行中／属后续会话）〕</blockquote></section>\n<section class=\"tri-lang tri-en\"><p class=\"tri-head\"><span class=\"tri-tag\">EN</span><span class=\"tri-sub\">pending · not yet produced</span></p><blockquote class=\"tri-text tri-pending\">〔pending · not yet produced〕</blockquote></section>\n</div>\n\n<div id=\"tri-seg-8\" class=\"tri-anchor\"></div>\n\n#### 段 8〔035 [238b.7] · T44-18〕\n\n<div class=\"tri-seg\" data-status=\"pending\">\n<section class=\"tri-lang tri-bo\"><p class=\"tri-head\"><span class=\"tri-tag\">藏</span><span class=\"tri-sub\">德格原字形 · 逐字回源</span></p><blockquote class=\"tri-text\" lang=\"bo\">དེ་ནས་ལྷའི་དབང་པོ་ བརྒྱ་བྱིན་གྱིས་བཅོམ་ལྡན་འདས་ཀྱི་གདན་སེང་གེའི་ཁྲི་བཅས་ནས། ཞེ་ས་དང་རིམ་གྲོ་ཆེན་པོས་བཅོམ་ལྡན་འདས་གང་ན་བ་དེར་ཐལ་མོ་སྦྱར་ཏེ། ཕྱག་འཚལ་ནས་བཅོམ་ལྡན་འདས་ལ་འདི་སྐད་ཅེས་གསོལ་ཏོ། །</blockquote></section>\n<section class=\"tri-lang tri-zh\"><p class=\"tri-head\"><span class=\"tri-tag\">汉</span><span class=\"tri-sub\">待译 · 尚未产出</span></p><blockquote class=\"tri-text tri-pending\">〔待译 · 该段尚未产出（作业进行中／属后续会话）〕</blockquote></section>\n<section class=\"tri-lang tri-en\"><p class=\"tri-head\"><span class=\"tri-tag\">EN</span><span class=\"tri-sub\">pending · not yet produced</span></p><blockquote class=\"tri-text tri-pending\">〔pending · not yet produced〕</blockquote></section>\n</div>\n\n> 〔待譯·未展示〕另有 **25 段**已全章切段存數據層（逐字回源復驗·段拼接無內容缺口），按里程碑逐批譯出後在此展示。\n\n> 〔诚实边界〕本章已**全章切段 33 段**（L.380 句末感知；段拼接 norm 逐字对账无内容缺口）；未译段如实标〔待译〕，页面展示已译段＋下一批待译段。模型译未经人工校订，不作引文使用，不得替代 CBETA 祖本文字。\n\n## 二、汉藏对应\n\n**开篇对照**（本专题 seg1 × 对勘批开篇）\n\n<section class=\"tri-quote tri-qbo\">\n<p class=\"tri-head\"><span class=\"tri-tag\">藏</span><span class=\"tri-sub\">本专题 seg1 · 德格 035 238a.6（逐字回源复验）</span></p>\n<blockquote class=\"tri-text\" lang=\"bo\">སངས་རྒྱས་རྨད་ག་ཅད་ཅེས་བྱ་བ་ཤིན་ཏུ་རྒྱས་པ་ཆེན་པོའི་མདོ། བམ་པོ་བཅུ་དགུ་པ། དེ་ནས་སངས་རྒྱས་ཀྱི་མཐུས་ཤར་ཕྱོགས་ཀྱི་འཇིག་རྟེན་གྱི་ཁམས་ཐམས་ཅད་དང་། དེ་བཞིན་དུ་ལྷོ་ཕྱོགས་དང་། ནུབ་ཕྱོགས་དང་། བྱང་ཕྱོགས་དང་། བྱང་ཤར་གྱི་ཕྱོགས་མཚམས་དང་། །</blockquote>\n</section>\n> 〔口径〕本批对勘条目无 `zh80_open` 字段 → 只列对应表与识读，不臆造开篇引文。\n\n**名相对应表**（对勘批 correspondence 原文迻录）\n\n| 目 | 八十（T10n0279） | 六十（T09n0278） | 藏（德格 Toh 44） |\n|---|---|---|---|\n| 开篇式 | 「爾時，如來威神力故」 | 〈佛昇須彌頂品第九〉题显「佛」 | 藏 སངས་རྒྱས་ཀྱི་མཐུས（以佛神力） |\n| 章位 | 汉品十三 | 〈佛昇須彌頂品第九〉 | 藏章十八（bam po 19 起） |\n\n> 开篇式藏作佛神力（སངས་རྒྱས་ཀྱི་མཐུས）、八十作「爾時，如來威神力故」、六十题显「佛」——主名佛／如来三本小异；八十「不離一切菩提樹下，而上昇須彌，向帝釋殿」为不离而升三叠之首（品13→19→23）；藏章十八对汉品十三，章界不平行序列之续录。\n\n<details class=\"tri-appx\">\n<summary>🧭 开篇种子〔订正〕登记（L.361 · 证据留痕）</summary>\n\n**判定**：题名前缀按规范译名（《大方廣佛華嚴經》第十九包）保留，正文按模型译；G2.2 对藏18 以正文起比对；不改正 b3，仅登记本订正。\n\n**观察**：本专题 seg1 为「题名块＋正文首句」复合段（སངས་རྒྱས་རྨད་ག་ཅད་…མདོ། བམ་པོ་བཅུ་དགུ་པ། དེ་ནས་…·folio 238a.6），b3 bo_open 从正文起；起点不同。\n\n**证据**（≥2 条独立佐证）：\n\n- 本专题 seg1 逐字回源：སངས་རྒྱས་རྨད་ག་ཅད་ཅེས་བྱ་བ་ཤིན་ཏུ་རྒྱས་པ་ཆེན་པོའི་མདོ། བམ་པོ་བཅུ་དགུ་པ།（folio 238a.6）\n- 本专题 seg1 正文首句：དེ་ནས་…（题名后接正文），与 b3 bo_open 正文起相衔\n\n**后续**：\n\n**机器检查**：``\n\n</details>\n\n> 〔口径〕对勘批 `bo_open` 字段经 L.361 订正登记判为旧偏移错切，本页**不展示**该字段；藏文开篇一律以本专题逐字复验 seg1 为准。订正不改对勘批 SSOT（各照底本·铁律）。\n\n## 三、延伸阅读\n\n**本仓专篇与总纲**\n\n- [华严经引读 · 系列总纲（§五 藏汉对应总表）](huayan-series-outline.html)\n- [华严经学 · 三十九品深度研究](huayan-studies.html) — 藏独有二章之法义归属见 §2.3\n\n**开篇试译**（L.354a 术语表 · 〔本文试译〕）\n\n> 〔《佛不思议法性广博广大经》·bam po 19〕尔时，以佛神力，东方一切世界，如是南方、西方、北方、东北隅、   var embed=(typeof _mdDocEmbed==='function')?_mdDocEmbed(a.doc_md||''):{html:'',toc:[]};
  var h='';

  h+='<div style="font-size:0.74em;color:var(--text2);margin-bottom:12px;">';
  h+='<a href="../index.html" style="color:var(--blue);text-decoration:none">主页</a> › ';
  h+='<a href="index.html" style="color:var(--blue);text-decoration:none">独立文章目录</a>';
  if(a.back && a.back.tab){
    h+=' › <a href="../tabs/'+a.back.tab+'.html" style="color:var(--blue);text-decoration:none">'+a.back.label+'</a>';
  }
  h+='</div>';

  h+='<div style="background:linear-gradient(120deg,rgba(184,134,60,0.12),rgba(94,139,158,0.08));border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px;">';
  h+='  <div style="font-size:0.76em;color:var(--text2);letter-spacing:0.5px">📄 独立文章页</div>';
  h+='  <h2 data-skip-toc="1" style="color:var(--gold);margin:6px 0 4px">'+(a.icon?a.icon+' ':'')+a.title+'</h2>';
  if(a.title_sub)h+='  <div style="font-size:0.85em;color:var(--text2)">'+a.title_sub+'</div>';
  if(a.version)h+='  <div style="font-size:0.78em;color:var(--text2);margin-top:6px">'+a.version+'</div>';
  if(a.back && a.back.tab){
    h+='  <a href="../tabs/'+a.back.tab+'.html" style="font-size:0.75em;color:var(--blue);margin-top:10px;display:inline-block">← 返回 '+a.back.label+'</a>';
  }
  h+='</div>';

  if(a.meta){
    h+='<div class="section" style="border-left:4px solid var(--gold)" data-chrome="1"><h2>📌 导览</h2>';
    h+='<p style="font-size:0.8em;line-height:1.9;white-space:pre-line">'+(typeof _mdInline==='function'?_mdInline(a.meta):a.meta)+'</p></div>';
  }

  if(embed.toc.length){
    h+='<div class="section" data-chrome="1"><h2>🧭 本文目录</h2>';
    h+='<div style="column-width:250px;column-gap:26px;font-size:0.8em;line-height:1.75">';
    embed.toc.forEach(function(t){
      var pad=(t.lv>2?'padding-left:'+((t.lv-2)*16)+'px;':'');
      h+='<div style="'+pad+'"><a href="#'+t.id+'" style="color:'+(t.lv===2?'var(--gold)':'var(--text2)')+';text-decoration:none">'+t.text+'</a></div>';
    });
    h+='</div></div>';
  }

  h+='<div class="section" style="border-left:4px solid var(--gold)" id="article-full">';
  h+='<h2 data-skip-toc="1" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px"><span>📄 '+a.title+' · 全文</span></h2>';
  h+=embed.html;
  h+='</div>';

  h+='<div style="margin-top:18px;padding-top:10px;border-top:1px solid var(--line);font-size:0.74em;color:var(--text2)">';
  h+='<a href="index.html" style="color:var(--blue);text-decoration:none">📚 返回独立文章目录</a>';
  if(a.back && a.back.tab){
    h+=' · <a href="../tabs/'+a.back.tab+'.html" style="color:var(--blue);text-decoration:none">'+a.back.label+'</a>';
  }
  h+='</div>';

  root.innerHTML=h;

  if(typeof _markTermRefs==='function' && document.getElementById('article-full')){
    _markTermRefs('#article-full');
  }
  if(typeof initDocImages==='function' && document.getElementById('article-full')){
    initDocImages('#article-full');
  }
  if(typeof _initArticleENMode==='function') _initArticleENMode();
  if(typeof _foldDoc==='function'){
    try{ _foldDoc('#article-full', {noBar:true}); }catch(e){}
  }
  if(typeof _installPageBar==='function'){
    try{ _installPageBar({mountSel:'#article-full', rootSel:'#article-root'}); }catch(e){}
  }
  if(location.hash){
    setTimeout(function(){
      var el=document.getElementById(location.hash.slice(1));
      if(el){
        if(typeof _reveal==='function')window._reveal(el);
        el.scrollIntoView({behavior:'smooth',block:'start'});
      }
    },80);
  }
}

if(document.readyState!=='loading'){renderArticle();}
else{document.addEventListener('DOMContentLoaded',renderArticle);}
</script>
<script>
/* ── 三语对读工作台（L.378 · gen v0.4 子页架构） ── */
window.__triLayout = function (mode) {
  var root = document.getElementById('article-full');
  if (!root) return;
  var cols = (mode === 'cols');
  root.classList.toggle('tri-cols', cols);
  try { localStorage.setItem('triLayout', cols ? 'cols' : 'stack'); } catch (e) {}
  var btns = document.querySelectorAll('.tri-btn[data-lay]');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('is-on', btns[i].getAttribute('data-lay') === (cols ? 'cols' : 'stack'));
  }
};
window.__triTab = function (i) {
  var root = document.getElementById('article-full');
  if (!root) return;
  // shell 另渲一个裸 h2 页题（无 secfold）→ pane 只取 h2.secfold
  var hs = root.querySelectorAll('h2.secfold');
  for (var j = 0; j < hs.length; j++) {
    var on = (j === i);
    if (on) { hs[j].classList.remove('is-folded'); hs[j].setAttribute('aria-expanded', 'true'); }
    hs[j].style.display = on ? '' : 'none';
    var b = hs[j].nextElementSibling;
    if (b && b.classList.contains('secfold-body')) b.style.display = on ? '' : 'none';
  }
  var btns = document.querySelectorAll('.tri-tab');
  for (var k = 0; k < btns.length; k++) btns[k].classList.toggle('is-on', k === i);
  try { localStorage.setItem('triTab:tibetan-avatamsaka-trilingual-ch18', String(i)); } catch (e) {}
};
(function () {
  function paneOf(el) {
    var root = document.getElementById('article-full');
    if (!root) return -1;
    var hs = root.querySelectorAll('h2.secfold');
    for (var i = 0; i < hs.length; i++) {
      if (el === hs[i]) return i;
      var b = hs[i].nextElementSibling;
      if (b && b.classList.contains('secfold-body') && b.contains(el)) return i;
    }
    return -1;
  }
  function fromHash() {
    var h = location.hash.slice(1);
    if (!h) return -1;
    var el = document.getElementById(h);
    return el ? paneOf(el) : -1;
  }
  function init() {
    var root = document.getElementById('article-full');
    if (!root || !root.querySelector('.secfold') || !root.querySelector('h2') || !root.querySelector('.tri-tabs')) return false;
    var hs = root.querySelectorAll('.secfold');
    for (var i = 0; i < hs.length; i++) {
      hs[i].classList.remove('is-folded');
      hs[i].setAttribute('aria-expanded', 'true');
    }
    // 窄屏页头换行可高达 200px+，固定 scroll-margin 会把锚点藏进页头 → 按实高同步
    function syncGap() {
      var top = document.getElementById('page-top');
      var gap = (top ? top.offsetHeight : 0) + 12;
      var as = document.querySelectorAll('.tri-anchor');
      for (var i = 0; i < as.length; i++) as[i].style.scrollMarginTop = gap + 'px';
    }
    syncGap();
    window.addEventListener('resize', syncGap);
    var lay = 'stack';
    try { lay = localStorage.getItem('triLayout') || 'stack'; } catch (e) {}
    window.__triLayout(lay);
    var tab = fromHash();
    if (tab < 0) {
      try { tab = parseInt(localStorage.getItem('triTab:tibetan-avatamsaka-trilingual-ch18') || '0', 10) || 0; } catch (e) { tab = 0; }
    }
    if (tab >= root.querySelectorAll('h2.secfold').length) tab = 0;
    window.__triTab(tab);
    root.addEventListener('click', function (e) {
      var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
      if (!a) return;
      var el = document.getElementById(a.getAttribute('href').slice(1));
      if (!el) return;
      e.preventDefault();
      var p = paneOf(el);
      if (p >= 0) window.__triTab(p);
      if (window._reveal) window._reveal(el);
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (history.replaceState) history.replaceState(null, '', a.getAttribute('href'));
    });
    window.addEventListener('hashchange', function () {
      var p = fromHash();
      if (p >= 0) window.__triTab(p);
    });
    return true;
  }
  function poll(n) { if (init()) return; if (n > 0) setTimeout(function () { poll(n - 1); }, 120); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { poll(20); });
  else poll(20);
})();
</script>
