var ARTICLE = {"id": "huayan-guangmingjue-pin", "file": "articles/huayan-guangmingjue-pin.html", "title": "九九华严第九品 光明觉品之拼读", "title_sub": "华严经第九品·第二会·差别因果周·卷十三首品·足轮放光十段遍照倍增·一切处文殊十偈叹佛果德·三业意业遍觉·金轮放光·与六十《如来光明觉品第五》对读·注疏诸家会读（澄观·法藏·智俨·慧苑·李通玄·海云）·数据层·未完备已标明", "icon": "📖", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第二会_普光明殿_差别因果周/华严经细读_第九部_光明觉品.md", "doc_md": "# 华严经引读·第九部：光明觉品（卷十三·品九）\n\n> **EN · Close Reading of the Avataṃsaka Sūtra, Part Nine: The Chapter of Light and Awakening**\n\n> **底本**：唐·实叉难陀译《大方广佛华严经》（八十华严）`T10n0279`。**范围：卷第十三首品（本品全文，品号第九）**。本品属**第二会「普光明殿会」·差别因果周**，承第七品《如来名号品》（身业·遍应）、第八品《四圣谛品》（口业·说法遍周）而明**意业·遍觉**——如来足轮放光，十段遍照倍增，一切处文殊以偈颂叹佛果德，为十信法门之张本。\n> **立稿**：2026-10-25。承第一会六部及第二会前二部之体例与校勘纪律。\n> **本篇进度（覆盖率自陈）**：**全稿成篇**——§〇 凡例、§一 概述与品题解义、§二 全文逐段细读（序分·放光分齐·十段遍照·十偈次第）、§三 旁参与前接、§四 义理要点与名相、§五 注疏选要·诸家会读（5.1 澄观／5.2 法藏／5.2′ 智俨／5.2″ 慧苑／5.3 李通玄／5.3′ 海云／5.4 小结）、§六 文本对读与校勘（八十／六十·四十／藏译／校勘记）、§七 结构分析·数据层（7.1–7.4）、§八 附录十一类（含中英要目）、§九 台账，**皆已成**。本品六十辅读以 **STEP0 新入库 `T09n0278_juan5.txt`（L.181）** 逐字回源，六十品题直证作**《如来光明觉品第五》**；慧苑《刊定记》本品有记（X0221 卷第四·直证「光明覺品第九」段存在，解第八部台账「慧苑本品之记恐不传」之悬案）。凡未能确证者标〔待核〕、属推断者标〔本文判断〕；**不以骨架冒充细读**。\n> **原则**：沿用既定校勘纪律、三层疏解（疏解／名相／会读）、存疑必标、推断必标「〔本文判断〕」、讲者之说疑误只标不改、三译主从分明、不擅改经文、可回源可复核。**引注疏原文一律繁体照底本、逐字回源并注经号与段落；会读按语用简体。**\n\n### 〇之二、图表导览\n\n#### 图 〇-1　第二会三业次第图（身·口·意 → 光明觉居意业）\n\n<div style=\"background:rgba(94,139,158,0.04);border:1px solid var(--line, #d9cdb8);border-radius:8px;padding:16px;margin:12px 0;overflow-x:auto;\">\n<div style=\"display:flex;flex-direction:column;gap:10px;max-width:340px;\">\n<div style=\"background:linear-gradient(90deg,#e6f3ff,#f7fbff);border:1px solid #8fb3d9;border-radius:6px;padding:8px 12px;text-align:center;font-size:0.85em;\">第七品《如来名号品》<br/>身业·遍应（名号依身而立）</div>\n<div style=\"text-align:center;color:#666;\">↓</div>\n<div style=\"background:linear-gradient(90deg,#ffe6e6,#fff7f7);border:1px solid #d98f8f;border-radius:6px;padding:8px 12px;text-align:center;font-size:0.85em;\">第八品《四圣谛品》<br/>口业·说法遍周（四谛异名随乐）</div>\n<div style=\"text-align:center;color:#666;\">↓</div>\n<div style=\"background:linear-gradient(90deg,#e6ffe6,#f7fff7);border:1px solid #8fd98f;border-radius:6px;padding:8px 12px;text-align:center;font-size:0.85em;\">第九品《光明觉品》<br/>意业·遍觉（足轮放光·智光觉悟）</div>\n<div style=\"text-align:center;color:#666;\">↓</div>\n<div style=\"background:linear-gradient(90deg,#fff2e6,#fffaf7);border:1px solid #d9b38c;border-radius:6px;padding:8px 12px;text-align:center;font-size:0.85em;\">第十品《菩萨问明品》～第十二品《贤首品》<br/>十信之行（能依能信）</div>\n</div>\n</div>\n\n**说明**：法藏、澄观、智俨、慧苑四家同判第二会初三品为如来三业之展转——名号品明身业，四谛品明口业，光明觉品明意业；三品总答前会「所依果问」。《探玄记》卷三：「此品明身業遍應……四諦品明佛口業普周。光明覺品明佛意業遍覺。三輪攝伏。」（`T1733`@98210·详见 §5.2）。\n\n#### 图 〇-2　十段遍照倍增图（一放光同时顿照）\n\n<div style=\"background:rgba(94,139,158,0.04);border:1px solid var(--line, #d9cdb8);border-radius:8px;padding:16px;margin:12px 0;overflow-x:auto;\">\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;max-width:640px;\">\n<div style=\"background:#fff;border:1px solid #8fb3d9;border-radius:4px;padding:6px 10px;font-size:0.8em;\">第一重<br/><b>此</b>三千大千世界<br/>（百億四天下等）</div>\n<div style=\"background:#fff;border:1px solid #8fb3d9;border-radius:4px;padding:6px 10px;font-size:0.8em;\">第二重<br/>十佛國土</div>\n<div style=\"background:#fff;border:1px solid #8fb3d9;border-radius:4px;padding:6px 10px;font-size:0.8em;\">第三重<br/>百世界</div>\n<div style=\"background:#fff;border:1px solid #8fb3d9;border-radius:4px;padding:6px 10px;font-size:0.8em;\">第四重<br/>千世界</div>\n<div style=\"background:#fff;border:1px solid #8fb3d9;border-radius:4px;padding:6px 10px;font-size:0.8em;\">第五重<br/>十千（六十作「萬」）</div>\n<div style=\"background:#fff;border:1px solid #8fb3d9;border-radius:4px;padding:6px 10px;font-size:0.8em;\">第六重<br/>百千（六十作「十萬」）</div>\n<div style=\"background:#fff;border:1px solid #8fb3d9;border-radius:4px;padding:6px 10px;font-size:0.8em;\">第七重<br/>百萬世界</div>\n<div style=\"background:#fff;border:1px solid #8fb3d9;border-radius:4px;padding:6px 10px;font-size:0.8em;\">第八重<br/>一億世界</div>\n<div style=\"background:#fff;border:1px solid #8fb3d9;border-radius:4px;padding:6px 10px;font-size:0.8em;\">第九重<br/>十億世界</div>\n<div style=\"background:#fff;border:1px solid #d98f8f;border-radius:4px;padding:6px 10px;font-size:0.8em;\">第十重<br/>百億乃至那由他億…<br/><b>盡法界虛空界</b></div>\n</div>\n<div style=\"margin-top:8px;font-size:0.75em;color:#666;\">十段各自附長行＋一偈（10 颂）；每重例出「百億閻浮提乃至百億色究竟天、八相、六道天众」悉皆明現，並例「一切處文殊師利」各於佛所同時說偈。⚖ 就实义「應有等法界無盡之節」（`T1735`），文略而意遍。</div>\n</div>\n\n**说明**：光明节节而照、金色文殊节节而至，非多度放光、非次第巡照——「唯一放光，同時頓照盡空世界。但為言不並彰，說有前後，隨機心現」（澄观·§5.1）；慧苑同判「此非二十六度放光，亦非一放而次第巡照」（X0221·§5.2″）。如月普照、百川各见。\n\n#### 图 〇-3　十偈义趣配段图（依澄观科：初五菩提·次一威德·后四法性）\n\n<div style=\"background:rgba(94,139,158,0.04);border:1px solid var(--line, #d9cdb8);border-radius:8px;padding:16px;margin:12px 0;overflow-x:auto;\">\n<div style=\"display:flex;flex-direction:column;gap:8px;max-width:560px;\">\n<div style=\"background:linear-gradient(90deg,#e6f3ff,#f7fbff);border:1px solid #8fb3d9;border-radius:6px;padding:6px 12px;font-size:0.82em;\">第一偈（反顯）：見佛離著取捨未亡，非證道眼——<b>菩提超情</b>總標</div>\n<div style=\"background:linear-gradient(90deg,#e6f3ff,#f7fbff);border:1px solid #8fb3d9;border-radius:6px;padding:6px 12px;font-size:0.82em;\">第二～六偈：體相無所有·依正不動·佛法平等·生佛平等·五蘊無數·超越二見——<b>答成菩提</b>（初五）</div>\n<div style=\"background:linear-gradient(90deg,#fff2e6,#fffaf7);border:1px solid #d9b38c;border-radius:6px;padding:6px 12px;font-size:0.82em;\">第七～八偈（第二重段）：悲智雙滿·降魔擊鼓——<b>答佛威德</b></div>\n<div style=\"background:linear-gradient(90deg,#e6ffe6,#f7fff7);border:1px solid #8fd98f;border-radius:6px;padding:6px 12px;font-size:0.82em;\">第九～十偈（各段後四）：迴向心無生·眾生無生壞·一中解無量——<b>答佛法性</b>（後四）</div>\n</div>\n<div style=\"margin-top:8px;font-size:0.75em;color:#666;\">澄观兩判並記：古德對前二品已答二問，此品⻑行正答三問（放光答威德·見成正覺答菩提·文殊說偈答法性）；「今更一解」謂⻑行但現相答，<b>偈中具答三問</b>——初五答菩提、次一答威德、後四答法性（`T1735`·§5.1）。智俨則以十偈分三：取相不應真法／八偈離取應實／一偈歎解者勝能（`T1732`·§5.2′）。</div>\n</div>\n\n**说明**：十段十偈各有科判，本篇§二以经文自然段（长行＋偈颂）为纲，诸家科段异判并存旁注、不強令合一。\n\n---\n\n## 〇、凡例（简要）\n\n1. **经文引录**：一律照 CBETA `T10n0279` 繁体原字形逐字回源（含标点从底本）；六十辅读照 `T09n0278_juan5.txt`（STEP0 生成·L.181·CBETA 繁體原字形）。异文**各照底本、不统一**。\n2. **段落标号**：本品无分品之旧科，本文以「（一）至（十二）」自然段标示（§二总表），并附十段遍照编号 T1–T10 以便与注疏对读。\n3. **标识**：〔待核〕存疑；〔本文判断〕推断；〔讲师玄谈·非正行〕讲记科判类随口之说；⚖ 诸家异判并记。\n4. **计数口径**：「剥校勘」= CJK 字符净数（去空白、去校勘 apparatus），与 §7.4 复算脚本同一命令产出。\n5. **辅读引用**：讲记引文注明集数与可点路径；注疏引文注明经号与归一化字符位锚。\n\n---\n\n## 一、概述与品题解义\n\n### 1.1 品题释义\n\n**光明觉品第九**（八十·`T10n0279` 卷十三品题）。\n\n- **澄观**：「光明體也。覺者。用也。此二各二。謂光有身智二光。覺有覺知覺悟。」又合说：「身智無二。唯一無礙光故」；从开释则「光明之覺」通依主、有财，从合说则「光明即觉」可持业（`T1735`·§5.1）。并引《涅槃经》琉璃光菩萨处：「光明者。名為智慧。」\n- **法藏**（依六十品题立释）：「如來之光明光明之開覺。謂依體起用依用成益。皆依主釋」（`T1733`@105627·其目录以六十为第 5 品，故题首冠「如來」二字）。\n- **智俨**：「如來即化主。光者智體。明者用。覺者開曉於緣」（`T1732`@21782）。\n- **慧苑**（独得梵本题名之传）：「梵本中名**如來光明網能覺悟品**。謂佛足下輪網相中放光。還名光網。照十方佛會。覺悟菩薩。令發意來此故。」释名则料简依主、有财两释：「如來是能放光主。光明網是所放光體。能覺悟是光業用……若總言如來光明網覺悟之品。唯依主也」（X0221@114068·§5.2″）。\n- **六十华严**品题直证：**《如来光明觉品第五》**（`T09n0278_juan5.txt`@L21-22·卷五第二会第三品）。\n- **藏译**编目题 `'od zer dang ye shes`（光明与智·`data/translation/diff_matrix.yaml` order 9）；本机无德格版梵本，〔待核〕。\n\n「光」为所照之境显而能照之智寓，「觉」为所觉之理而能觉之悟——题只六字（含品号），实摄全品「佛放身光、文殊演智光」之二光纲骨。〔本文判断〕本品题名之「觉」不取「成佛之自觉」而取「警觉群蒙」——与足轮放光「表信」相呼应：十信位之觉，正是闻光而觉。\n\n### 1.2 品位与脉络（承上启下）\n\n本品在**第二会·普光明殿**（差别因果周·说十信）。前二品别明佛身业（名号）、口业（四谛），此品总明**意业遍觉**：三业既彰，所信果德之相已足，故澄观判「上來三品。答初十句所依果問竟」（`T1735`卷十三末·§5.1）；慧苑同判「上來三品明答初十果問竟」（X0221·§5.2″）。自问明品以下，转入「能依能信之行」（慧苑：「初光明覺品來。明所依所信之境。後問明等三品。顯能依能信之行」·X0221@48636）。\n\n三条脉络须并观：\n\n1. **三业次第**（诸家共判）：名号（身）→四谛（口）→光明觉（意）。「前但身語，意業將顯」（演钞·§5.3′ 旁引）。\n2. **答问次第**（澄观两判·§5.1）：⻑行放光／見成正覺／文殊說偈对答威德·菩提·法性三问。\n3. **放光升降次第**（李通玄别判·§5.3）：眉间果光放入足轮→还从足轮放出**成信位**→次第十住足指端放光→次第十行复转上位——光的「位置」即「位次」，此李氏以光位表阶位之独见（只录其说）。\n\n### 1.3 篇幅与结构预览\n\n- 全品剥校勘 **4,358 字**（含品题·§7.4 实测）；含标点 5,198；句末标点 **151**（皆「。」）；独字 **492**。\n- 结构：**序分**（放光照境一·总标二千六十一名目之染淨八相天众）→**集会分**（佛神力召十大菩萨）→**十段遍照**（T1–T10，每段长行＋一偈）→**结分**（第十重穷尽法界、更无结经语，直接过渡问明品）。\n- 本品无当机请问者——**全品是「现相—颂述」结构**：佛以身光现事境，文殊以智光赞述，与问明品之「十首递问—文殊答」恰成对照。〔本文判断〕此「不问而现、现而即颂」正是本品在十信开端的位置所需：信门先须现量境，后才有问难。\n\n### 1.4 核心要义（EN 附）\n\n1. **一光顿照，法界为量**——十段倍增非渐照，「唯一放光同時頓照盡空世界」；数至那由他亿而后「盡法界、虛空界、所有世界」，光之分齐即信之分齐。\n2. **身智二光，事理双照**——佛光现事令眾目覩，文殊智光赞理令眾悟入；「身智二照合為一光。令二覺齊圓」（演钞）。\n3. **从足轮放光：信为行本**——「足下放者。表信四義」（澄观）／「表三義」（慧苑异判·⚖）：自下而上、卑微、行本、该果海。\n4. **一切处文殊**——不动智之妙用，「觸境斯了。六根三業盡是文殊」；一人而十方俱集，非分身、无思普现。\n5. **偈颂摄菩提义**——初五答菩提、次一答威德、后四答法性（⻑行但现相答）；一多相即、生佛平等，为十信「解」之骨架。\n\n> **EN · Core points**：(1) One emission, simultaneous all-pervasion — the ten tiers multiply not as successive beams but as one light whose boundary is the dharma-realm itself. (2) Two lights, one illumination — the Buddha's body-light displays events; Manjuśrī's wisdom-light expounds principle; \"body-and-wisdom fused into one light.\" (3) Light from the wheel of the feet — faith as the ground of practice. (4) \"Manjuśrī of all places\" — the function of immutable wisdom, present where each Buddha sits. (5) The verses answer the three petitions on bodhi, majesty, and dharma-nature.\n\n**画龙点睛**：全品眼目在「**悉以佛神力故**」六字——光中所见一會、集来文殊遍至，皆不出一佛神力；而十偈眼目在首偈反显之「**彼非證道眼**」——不坏取见所见之佛非佛，须是离见方名见佛。龙是十段遍照，睛只此两处。〔本文判断〕\n\n### 1.5 经文文本现象与信度标识\n\n- **「金色世界」重出现象（底本自歧·直证）**：八十卷十三品初列十世界，第六「金色世界」与第一同名（实测「金色世界」全品 11 见：十段各一＋初列两见·@345/@376），「妙色世界」仅 1 见——CBETA 底本自身即如此，**照底本不改**，列入 §6.4 校勘记；慧苑所见文则作「金色乃至**平等色**等」（X0221），与今本_list_末「平等色世界」相合，足证「平等色」名旧犹未夺。〔待核〕六十作「金色、樂色、華色……如實色」，初列不重（@334 仅一见）。\n- **品题界标之鉴别（L.182 夜间复验订正）**：修正平文器（SKIP note/rdg/mulu/pb/anchor/app·保 anchor tail）下，「光明覺品第九」「菩薩問明品第十」「淨行品第十一」三品题串**全档各唯一见**（@109946／@115815／@120266），问明品题 @115815 即**真品题**（光明觉品止锚＝问明品起锚同位）——本行初稿误记「全文档 2 见·首见系卷十三尾题连读假串·尾锚须取第二见」，承 P10 探测 `_p10_probe.py` 复算坐实其误，**照记订正**（本文判断：旧说系沿袭旧导出件多余见之误归因）。旧导出件 `_p9_seg80.txt` 之多缀伪串（首见 @216／@95973「光明覺品第九」两见、尾缀「菩薩問明品」）系**旧平文器目录/征引泄漏**；X0221 侧实证其一：其目录（@216）恰作「光明覺品第九·淨行品第十一·賢首品第十二」**缺问明**（依八十系次·目录泄漏之典型），@114068 系疏家征引品题；余一串出处〔待核·不作据〕。复算脚本 §7.4 锚定「卷第十三 jhead 后第一见」口径（唯一见下与全文档首见等价）。旧导出件头「10」／尾「菩薩問明品」诸伪缀，业已于本篇写作时剔除重核（登记 §八·附录六 #2）。\n- **无「三昧」「普贤」「佛子」呼告**：本品 爾時×20、文殊師利×20、頌×10，而**三昧×0、普賢×0、佛子×0、偈×0**（八十侧·实测）——与问明品（佛子呼告成串）净行品（智首问—文殊答—佛子！菩萨善观）之对语结构截然不同；本品全是「叙述—颂」二声部。\n- **数法名相层**：「十千／百千／百萬／一億／十億／那由他億」阶梯＋「無數無量無邊無等不可數不可稱不可思不可量不可說」结广——澄观、慧苑各以《俱舍》《顺正理论》《长阿含》《显扬》《金光明》与「黄帝算法」上中下三等释之（§4.5、§5.1、§5.2″）。\n- **「清涼」仅 1 见**（实测：即第五偈「住於清涼慧」·@清涼 2384 旧导出坐标）——非疏家署名（澄观号清凉）混入，无涉。\n\n### 1.6 版本差异之惯例与本品之版本情况\n\n- 校勘底本**八十**（`T10n0279` 卷十三）；六十辅读**已用 STEP0 新档** `T09n0278_juan5.txt`（本地 XML 生成·双实现全等校验 L.181），**不复用旧「脱文」误判**（L.176 勘误·见第一部 §1.8）。\n- 四十华严（`T10n0293`）为入法界品全译，**不含本品**——无四十对读段，如实标明。\n- 藏译仅编目级对应（diff_matrix：汉藏基本对应·diff_type E；题 `'od zer dang ye shes`），德格版本机未入库，逐字对勘〔待核〕。\n- 兜沙经 `T10n0280`（六十品之少分异译）**无光明觉品对应**——本品属「会通本后出之广文」性质〔本文判断·依 Nattier 分层说〕，登记备核。\n- 疏家所见文本位差异：澄观判「是前名號品放」（足轮光即前品所放·§5.1），慧苑判「今言新集。只是前品新來說法所由事須還牒彼故」（X0221·§5.2″）——两释同指**经文重牒之由**而非文本讹误，可互足。\n\n### 1.7 核心要义小结\n\n本品是第二会「所信果德」三业收束之眼：前二品以名号、谛辞竖**能说法者**，本品还以**光照现量**竖**所说境界**——三千大千世界百亿四天下、八相成道、六欲色界诸天，一光顿彻；偈中复以「非证道眼」反破、「一中解无量」正成，把「信」安在「现量—智照」双柱上。十段倍增与「尽法界虚空界」的数法结构，是本品留给后世华严「数法观」「世界海观」最直接的文本资源（澄观「一會不動遍法界」·智俨「光覺一時而能別見遠近」皆从此出）。\n\n---\n\n## 二、卷第十三（光明觉品第九·本品全文逐段细读）\n\n### 2.0 结构总表（据经切分）\n\n| 段 | 内容 | 起讫（原文标记） | 性质 |\n|---|---|---|---|\n| （一） | 世尊足轮放光·总标照境（此三千大千世界） | 「爾時,世尊從兩足輪下放百億光明,照此三千大千世界」 | 序分·能照 |\n| （二） | 别显所照二十目（百億四天下→百億色究竟天） | 「百億閻浮提、……百億色究竟天;其中所有,悉皆明現」 | 序分·所照 |\n| （三） | 本会现相＋佛神力集十大菩萨·十世界十佛 | 「如此處,見佛世尊坐蓮華藏師子之座……觀察智佛」 | 序分·集会 |\n| （四） | 第一偈（十颂·超情离见） | 「爾時,一切處文殊師利菩薩……當成無所畏。」 | 正宗分 |\n| （五）–（十三） | T2–T10 九段：长行遍照倍增＋各一偈·**〔L.187 本批〕全量入文（§2.3–2.11 逐段全文·§2.12 小结）** | 「爾時,光明過此世界,遍照東方十佛國土……」至「佛遍虛空亦如是。」 | 正宗分 |\n\n> 十段编号（T1＝段一之照此界；T2–T10 对应「光明過X遍照Y」九段），与 §1.4、图〇-2、§7.3 同一坐标。每段皆「长行现境＋偈颂赞述」二拍，偈前公式全一品一律：「**爾時,一切處文殊師利菩薩,各於佛所,同時發聲,說此頌言**」（×10·实测）。\n\n### 2.1 段（一）（二）（三）·序分：放光·照境·集会（全引）\n\n> 「爾時,世尊從兩足輪下放百億光明,照此三千大千世界百億閻浮提、百億弗婆提、百億瞿耶尼、百億欝單越、百億大海、百億輪圍山、百億菩薩受生、百億菩薩出家、百億如來成正覺、百億如來轉法輪、百億如來入涅槃、百億須彌山王、百億四天王眾天、百億三十三天、百億夜摩天、百億兜率天、百億化樂天、百億他化自在天、百億梵眾天、百億光音天、百億遍淨天、百億廣果天、百億色究竟天;其中所有,悉皆明現。」（`T10n0279` 卷十三·逐字）\n\n**疏解**：所照二十一目，澄观科为「人中（四州·大海·轮围）—八相（受生·出家·成道·转法轮·涅槃）—诸天（须弥·六欲·四禅天）」三块（§5.1）。八相中「受生含三」（住胎·生·出家等摄），「佛成道後始放光明，却現初生及後涅槃者，約微細門融三世故」——光中所见非回忆，是**一念顿现三世**。\n\n> 「如此處,見佛世尊坐蓮華藏師子之座,十佛剎微塵數菩薩所共圍遶;其百億閻浮提中,百億如來亦如是坐。悉以佛神力故,十方各有一大菩薩,一一各與十佛剎微塵數諸菩薩俱,來詣佛所。其名曰:文殊師利菩薩、覺首菩薩、財首菩薩、寶首菩薩、功德首菩薩、目首菩薩、精進首菩薩、法首菩薩、智首菩薩、賢首菩薩。是諸菩薩所從來國,所謂:金色世界、妙色世界、蓮華色世界、薝蔔華色世界、優鉢羅華色世界、金色世界、寶色世界、金剛色世界、玻瓈色世界、平等色世界。此諸菩薩各於佛所淨修梵行,所謂:不動智佛、無礙智佛、解脫智佛、威儀智佛、明相智佛、究竟智佛、最勝智佛、自在智佛、梵智佛、觀察智佛。」（逐字·第六「金色世界」重复系底本自歧，见 §1.5、§6.4）\n\n**疏解**：十大菩萨即后问明品发问之十首；十世界、十佛皆以「色／智」立名——澄观：「剎號佛名皆同名號品中。但增百億為異耳」（§5.1：名号品广说名目，此处但举其例）。李通玄独重此段：「用照金色世界不動智佛。以成信位」（T1739·§5.3）。⚖ 智俨释名次序有别判：「所以文殊在前賢首在後為表智先福後故」（T1732）。\n\n### 2.2 段（四）·第一偈（十颂·菩提超情）\n\n> 「爾時,一切處文殊師利菩薩,各於佛所,同時發聲,說此頌言:「若有見正覺,解脫離諸漏,不著一切世,彼非證道眼。若有知如來,體相無所有,修習得明了,此人疾作佛。能見此世界,其心不搖動,於佛身亦然,當成勝智者。若於佛及法,其心了平等,二念不現前,當踐難思位。若見佛及身,平等而安住,無住無所入,當成難遇者。色受無有數,想行識亦然,若能如是知,當作大牟尼。世及出世見,一切皆超越,而能善知法,當成大光耀。若於一切智,發生迴向心,見心無所生,當獲大名稱。眾生無有生,亦復無有壞,若得如是智,當成無上道。一中解無量,無量中解一,了彼互生起,當成無所畏。」」（逐字）\n\n**疏解**：澄观科「初一反顯餘九順釋」（§5.1）：第一句反破——若只见佛「内离诸漏外不著世」，则取舍未亡，「此見違理。故非道眼」；后九偈各一义：体相无所有（菩提性本空）·依正不动·佛法平等·生佛平等·五蕴同无为一、超越世出世见·**迴向心无生**·众生无生坏·一多互解。第十颂「一中解無量」即十玄「一多相容不同门」之经文根据（澄观指「即十玄門中一多相容不同門也」·§5.1）。⚖ 慧苑别判十偈总意「顯一切相即平等無差」，且于第七偈广引《大品》迴向义、末颂郑重提醒：「此會差別歸平等性。是理事無[得-彳]（礙）。**非事事無[得-彳]。應審其文。勿謬解也**」（X0221·§5.2″）——此是慧苑家法之判，与澄观事事无碍之圆义显张力，只标不判。\n\n### 2.3 段（五）·T2 光照十佛国土·第二偈（菩提因果）\n\n**长行（全引·〔L.187 本批〕）**：\n\n> 「爾時，光明過此世界，遍照東方十佛國土；南、西、北方，四維、上、下，亦復如是。彼一一世界中，皆有百億閻浮提，乃至百億色究竟天；其中所有，悉皆明現。如此處，見佛世尊坐蓮華藏師子之座，十佛剎微塵數菩薩所共圍遶；彼一一世界中，各有百億閻浮提、百億如來，亦如是坐。悉以佛神力故，十方各有一大菩薩，一一各與十佛剎微塵數諸菩薩俱，來詣佛所。其大菩薩，謂：文殊師利等；所從來國，謂：金色世界等；本所事佛，謂：不動智如來等。爾時，一切處文殊師利菩薩，各於佛所，同時發聲，說此頌言：」\n\n（`T10n0279` 卷十三·逐字（`_e9_full.py` 平文器·§7.4 锚口径）·偈前公式此段附长行末·T6–T9 别段·体式观察见 §2.7）\n\n**偈（全引）**：\n\n> 「眾生無智慧,愛刺所傷毒,為彼求菩提,諸佛法如是。普見於諸法,二邊皆捨離,道成永不退,轉此無等輪。不可思議劫,精進修諸行,為度諸眾生,此是大仙力。導師降眾魔,勇健無能勝,光中演妙義,慈悲故如是。以彼智慧心,破諸煩惱障,一念見一切,此是佛神力。擊于正法鼓,覺寤十方剎,咸令向菩提,自在力能爾。不壞無邊境,而遊諸億剎,於有無所著,彼自在如佛。諸佛如虛空,究竟常清淨,憶念生歡喜,彼諸願具足。一一地獄中,經於無量劫,為度眾生故,而能忍是苦。不惜於身命,常護諸佛法,無我心調柔,能得如來道。」（逐字）\n\n**疏解**：澄观科此段「十偈通顯菩提因果。分三。初偈菩提之因。次五菩提果用。後四令物思齊」（§5.1）：初偈「無明造業愛能潤業……如泥中刺」；次五悲智双满·美往因·降魔·智断·法鼓；后四**令物思齊**——游刹无著·念佛生喜·亡苦济物·护法轻身，「斯即佛因。能如是行得諸佛道」。\n\n### 2.4 段（六）·T3 光照百界·第三偈（八相菩提）\n\n**长行（全引·〔L.187 本批〕）**：\n\n> 「爾時，光明過十世界，遍照東方百世界；南、西、北方，四維、上、下，亦復如是。彼諸世界中，皆有百億閻浮提，乃至百億色究竟天；其中所有，悉皆明現。彼一一閻浮提中，悉見如來坐蓮華藏師子之座，十佛剎微塵數菩薩所共圍遶。悉以佛神力故，十方各有一大菩薩，一一各與十佛剎微塵數諸菩薩俱，來詣佛所。其大菩薩，謂：文殊師利等：所從來國，謂：金色世界等；本所事佛，謂：不動智如來等。爾時，一切處文殊師利菩薩，各於佛所，同時發聲，說此頌言：」（`T10n0279` 卷十三·逐字（`_e9_full.py` 平文器·§7.4 锚口径））\n\n**偈（全引）**：\n\n> 「佛了法如幻,通達無障礙,心淨離眾著,調伏諸群生。或有見初生,妙色如金山,住是最後身,永作人中月。或見經行時,具無量功德,念慧皆善巧,丈夫師子步。或見紺青目,觀察於十方,有時現戲笑,為順眾生欲。或見師子吼,殊勝無比身,示現最後生,所說無非實。或有見出家,解脫一切縛,修治諸佛行,常樂觀寂滅。或見坐道場,覺知一切法,到功德彼岸;癡暗煩惱盡。或見勝丈夫,具足大悲心,轉於妙法輪,度無量眾生。或見師子吼,威光最殊特,超一切世間,神通力無等。或見心寂靜,如世燈永滅,種種現神通,十力能如是。」（逐字）\n\n**疏解**：澄观：「初一標德充滿。後九別廣調生」——后九「或見」历八相（生·住·行·学·吼·出家·道场·转轮·神通·灭度），并科「或見」十字为**十义感应**（多机异处各感见……一人于同异俱时处见一切人所见·§5.1 全录）；「然佛不分身無思普現也」。此段是华严「八相成道即一大顿现」之祖文本。\n\n### 2.5 段（七）·T4 光照千界·第四偈（体性甚深）\n\n**长行（全引·〔L.187 本批〕）**：\n\n> 「爾時，光明過百世界，遍照東方千世界；南、西、北方，四維、上、下，亦復如是。彼一一世界中，皆有百億閻浮提，乃至百億色究竟天；其中所有，悉皆明現。彼一一閻浮提中，悉見如來坐蓮華藏師子之座，十佛剎微塵數菩薩所共圍遶。悉以佛神力故，十方各有一大菩薩，一一各與十佛剎微塵數諸菩薩俱，來詣佛所。其大菩薩，謂：文殊師利等；所從來國，謂：金色世界等；本所事佛，謂：不動智如來等。爾時，一切處文殊師利菩薩，各於佛所，同時發聲，說此頌言：」（`T10n0279` 卷十三·逐字（`_e9_full.py` 平文器·§7.4 锚口径））\n\n**偈（全引）**：\n\n> 「佛於甚深法,通達無與等,眾生不能了,次第為開示。我性未曾有,我所亦空寂,云何諸如來,而得有其身。解脫明行者,無數無等倫,世間諸因量,求過不可得。佛非世間蘊,界處生死法,數法不能成,故號人師子。其性本空寂,內外俱解脫,離一切妄念,無等法如是。體性常不動,無我無來去,而能寤世間,無邊悉調伏。常樂觀寂滅,一相無有二,其心不增減,現無量神力。不作諸眾生,業報因緣行,而能了無礙,善逝法如是。種種諸眾生,流轉於十方,如來不分別,度脫無邊類。諸佛真金色,非有遍諸有,隨眾生心樂,為說寂滅法。」（逐字）\n\n**疏解**：澄观判此偈属「第四·显菩提体性」（十段依答文三之外判·§5.1）；慧苑细科十偈：「初一歎佛悲智德……三歎佛解脫等德……准梵本中。亦通勝解」并广引《瑜伽》《涅槃》释「明行」，又释「世間諸因量」曰：「因明比量。但依世俗分別名言……今此顯佛一切德。超世名言……因是量主。故曰因量。因明之稱亦從此立也」（X0221·§5.2″）——因明名义于品内得映带，是注疏之一得。\n\n### 2.6 段（八）·T5 光照十千界·第五偈（十种业·悲愿行）\n\n**长行（全引·〔L.187 本批〕）**：\n\n> 「爾時，光明過千世界，遍照東方十千世界；南、西、北方，四維、上、下，亦復如是。彼一一世界中，皆有百億閻浮提，乃至百億色究竟天：其中所有，悉皆明現。彼一一閻浮提中，悉見如來坐蓮華藏師子之座，十佛剎微塵數菩薩所共圍遶。悉以佛神力故，十方各有一大菩薩，一一各與十佛剎微塵數諸菩薩俱，來詣佛所。其大菩薩，謂：文殊師利等；所從來國，謂：金色世界等；本所事佛，謂：不動智如來等。爾時，一切處文殊師利菩薩，各於佛所，同時發聲，說此頌言：」（`T10n0279` 卷十三·逐字（`_e9_full.py` 平文器·§7.4 锚口径））\n\n**偈（全引）**：\n\n> 「發起大悲心,救護諸眾生,永出人天眾,如是業應作。意常信樂佛,其心不退轉,親近諸如來,如是業應作。志樂佛功德,其心永不退,住於清涼慧,如是業應作。一切威儀中,常念佛功德,晝夜無暫斷,如是業應作。觀無邊三世,學彼佛功德,常無厭倦心,如是業應作。觀身如實相,一切皆寂滅,離我無我著,如是業應作。等觀眾生心,不起諸分別,入於真實境,如是業應作。悉舉無邊界,普飲一切海,此神通智力,如是業應作。思惟諸國土,色與非色相,一切悉能知,如是業應作。十方國土塵,一塵為一佛,悉能知其數,如是業應作。」（逐字·结句「如是業應作」×10）\n\n**疏解**：澄观判此段为「體（顯）菩提之因」（§5.1 十段依答文三：初五菩提——五偈段恰居第五·其义相摄〔本文判断〕）；慧苑科「頌中十偈。教諸菩薩。盡十種行」：大悲行·信佛行·乐佛德行·学念佛行·观三世佛行·如实相观行·观众生平等行·佛神通行·知国土行·知数多行（X0221）。六十此段结句作「**是彼淨妙業**」×10（`juan5.txt`·§6.1），八十「如是業應作」——两译公式性差异之最整齐样本。\n\n### 2.7 段（九）·T6 光照百千界·第六偈（离相见佛·威德智身）〔L.187 本批·全量入文〕\n\n**长行（全引）**：\n\n> 「爾時，光明過十千世界，遍照東方百千世界；南、西、北方，四維、上、下，亦復如是。彼一一世界中，皆有百億閻浮提，乃至百億色究竟天；其中所有，悉皆明現。彼一一閻浮提中，悉見如來坐蓮華藏師子之座，十佛剎微塵數菩薩所共圍遶。悉以佛神力故，十方各有一大菩薩，一一各與十佛剎微塵數諸菩薩俱，來詣佛所。其大菩薩，謂：文殊師利等；所從來國，謂：金色世界等；本所事佛，謂：不動智如來等。」\n\n（`T10n0279` 卷十三·逐字（`_e9_full.py` 平文器·§7.4 锚口径）·本段起偈公式单立为下节）\n\n> 「爾時，一切處文殊師利菩薩，各於佛所，同時發聲，說此頌言：」\n\n**偈（全引·十颂二十行）**：\n\n> 「若以威德色種族，而見人中調御師，是為病眼顛倒見，彼不能知最勝法。如來色形諸相等，一切世間莫能測，億那由劫共思量，色相威德轉無邊。如來非以相為體，但是無相寂滅法，身相威儀悉具足，世間隨樂皆得見。佛法微妙難可量，一切言說莫能及，非是和合非不合，體性寂滅無諸相。佛身無生超戲論，非是蘊聚差別法，得自在力決定見，所行無畏離言道。身心悉平等，內外皆解脫，永劫住正念，無著無所繫。意淨光明者，所行無染著，智眼靡不周，廣大利眾生。一身為無量，無量復為一，了知諸世間，現形遍一切。此身無所從，亦無所積聚，眾生分別故，見佛種種身。心分別世間，是心無所有，如來知此法，如是見佛身。」\n\n**疏解**：澄观科此段「第六重照百千界。即第⼆答佛威德問。威德約⾝故。前五法⾝後五智⾝」（`T1735`·§5.1 全摘）——答前四十问之**佛威德问**，威德约身故；前五偈明法身、后五偈明智身。初一拣迷：以威德·色·种族取见调御师，「雖是薄伽⽽⾒從外來。取相乖於最勝故。為倒⾒猶眼有病故。⾒外空華執內為外。謂空為有」——即经「是為病眼顛倒見」之疏义。后四示悟显最胜法：色相无边（深故一一相称真无边·广故具十莲华藏尘数之相）·无相之相「⾊無定⾊。若⾦剛之合朱紫形無定形。猶光影之任修短相無定相。似明鏡之對妍媸」·所证超情「欲⾔其有體相寂滅。欲⾔其無⾊相無邊。故⽌⾔顯妙唯智⽅契故」·能证超绝「妄惑不⽣故非蘊聚。起⼼則⽣便成戲論。決定⾒者。不隨境相名⾃在⼒。有無不能累其神」。后五智身次第：解脱智（身心正念无著）→寂照智利生→变化智一身多身「其猶並安千器數步⽽千⽉不同。⼀道澄江萬⾥⽽⼀⽉孤映」→无生智随物而感（「無積無從」·原文 U16）→复拂前迹「即前分別之器。亦無所有。妄⾒之⾝。豈當可得。此法是佛所知」。⚖ 慧苑别科「即应而寂／即寂而应」二段存 §5.2″ 旧记。\n〔本批·体式观察〕T6–T9 长行段终于「不動智如來等」，「爾時一切處文殊師利菩薩……說此頌言」自为一单元；T2–T5 则连缀同段——底本分节之异，照记不统一（`_e9_full.py` 单元序列实测：p14·lg10·颂起单立段×4）。\n\n### 2.8 段（十）·T7 光照百万界·第七偈（内外包摄·入一多）〔L.187 本批·全量入文〕\n\n**长行（全引）**：\n\n> 「爾時，光明過百千世界，遍照東方百萬世界；南、西、北方，四維、上、下，亦復如是。彼一一世界中，皆有百億閻浮提，乃至百億色究竟天；其中所有，悉皆明現。彼一一閻浮提中，悉見如來坐蓮華藏師子之座，十佛剎微塵數菩薩所共圍遶。悉以佛神力故，十方各有一大菩薩，一一各與十佛剎微塵數諸菩薩俱，來詣佛所。其大菩薩，謂：文殊師利等；所從來國，謂：金色世界等；本所事佛，謂：不動智如來等。」\n\n> 「爾時，一切處文殊師利菩薩，各於佛所，同時發聲，說此頌言：」\n\n**偈（全引·十颂二十行）**：\n\n> 「如來最自在，超世無所依，具一切功德，度脫於諸有。無染無所著，無想無依止，體性不可量，見者咸稱歎。光明遍清淨，塵累悉蠲滌，不動離二邊，此是如來智。若有見如來，身心離分別，則於一切法，永出諸疑滯。一切世間中，處處轉法輪，無性無所轉，導師方便說。於法無疑惑，永絕諸戲論，不生分別心，是念佛菩提。了知差別法，不著於言說，無有一與多，是名隨佛教。多中無一性，一亦無有多，如是二俱捨，普入佛功德。眾生及國土，一切皆寂滅，無依無分別，能入佛菩提。眾生及國土，一異不可得，如是善觀察，名知佛法義。」\n\n**疏解**：澄观定后四段（T7–T10）总纲：「第七重光照⼗⽅百萬世界。此下四段答法性問。佛以功德為法性故。即分為四。初⼀總顯內外包攝德。⼆⽅便幹能德。三⼤悲救攝德。四因果圓遍德」——法性以功德为义（「佛以功德為法性故」·原文直引），四段分科（总显内外包摄德·方便幹能德·大悲救摄德·因果圆遍德）就此立定。本偈「前五叹佛法难思，后五示入方便」（疏语原文·§5.1 全摘）：初三直就佛明（所缘·所依·一切种心三清净），次一对机（「⾝⼼離分別者。含於⼆意。⼀約佛。以三業隨智慧⾏等故。⼆約機。即知上功德。⽽能⾝⼼無分別者」约佛则三业随智慧行，约机则无疑滞益），后一约法（「雖法界遍轉。無性寂滅故無所轉。假以⾔宣」）；澄观又判「⼜此⼀偈即四無所畏。光明即正覺。清淨即出苦。滌累漏盡及與障道無畏。不動即無畏之義。外難不能傾故。不墮勝負⼆邊故」。后五示入之枢在第七颂「多中無一性，一亦無有多」（经文 U16·逐字）：疏「⼀因於多有多中應有⼀。多因於⼀有。⼀中應有多。今多中無⼀⼀無從矣。⼀中無多多無從矣。故⼆俱捨也。⽽性相融通入⼀即是入多」——华严「一多相即」之**经文胚胎**在此一颂〔本文判断：家义缘起之教，于科判有以启之，非谓此颂即摄十玄〕。⚖ 慧苑数级直证（X0221·程序化摘取）：「梵本中云照⼗百千。此是萬後億。前中間之數。謂百千為萬。百萬為億。此死但是⼗百千。未⾄百百千」（§5.2″）——百万界数级之译本讨论，慧苑疏存此得。\n\n### 2.9 段（十一）·T8 光照一亿界·第八偈（十种方便力·权实双行）〔L.187 本批·全量入文〕\n\n**长行（全引）**：\n\n> 「爾時，光明過百萬世界，遍照東方一億世界；南、西、北方，四維、上、下，亦復如是。彼一一世界中，皆有百億閻浮提，乃至百億色究竟天；其中所有，悉皆明現。彼一一閻浮提中，各見如來坐蓮華藏師子之座，十佛剎微塵數菩薩所共圍遶。悉以佛神力故，十方各有一大菩薩，一一各與十佛剎微塵數諸菩薩俱，來詣佛所。其大菩薩，謂：文殊師利等；所從來國，謂：金色世界等；本所事佛，謂：不動智如來等。」\n\n> 「爾時，一切處文殊師利菩薩，各於佛所，同時發聲，說此頌言：」\n\n**偈（全引·十颂二十行）**：\n\n> 「智慧無等法無邊，超諸有海到彼岸，壽量光明悉無比，此功德者方便力。所有佛法皆明了，常觀三世無厭倦，雖緣境界不分別，此難思者方便力。樂觀眾生無生想，普見諸趣無趣想，恒住禪寂不繫心，此無礙慧方便力。善巧通達一切法，正念勤修涅槃道，樂於解脫離不平，此寂滅人方便力。有能勸向佛菩提，趣如法界一切智，善化眾生入於諦，此住佛心方便力。佛所說法皆隨入，廣大智慧無所礙，一切處行悉已臻，此自在修方便力。恒住涅槃如虛空，隨心化現靡不周，此依無相而為相，到難到者方便力。晝夜日月及年劫，世界始終成壞相，如是憶念悉了知，此時數智方便力。一切眾生有生滅，色與非色想非想，所有名字悉了知，此住難思方便力。過去現在未來世，所有言說皆能了，而知三世悉平等，此無比解方便力。」\n\n**疏解**：澄观科「第八重光照⼀億界。前云百萬。今⼗倍於前。即千萬為⼀億也。⼗偈歎佛權實雙⾏⽅便幹能。然⽅便之⾔略有三意。⼀以因中⼗種加⾏⽅便之⼒。修成佛果⾃在之德。⼆但是差別之⽤皆名⽅便。其無礙慧無若⼲故。三即實之權起⽤⾃在。故名⽅便」——先标「方便」三义：因中十种加行成果自在·差别之用皆名方便·即实之权起用自在。文体「皆三句辨相。⼀句結名」：十颂各以「此……方便力」结（实测×10·§7.2），十种方便为礼起用（六义）·寂照（横照竖穷）·事理无碍·修无修（「不⾒⽣死為雜染。涅槃為清淨。此⼆無差為」）·回向（实际·菩提·众生三回向）·证知（「即知即證為自在修也」）·寂用（「寂⽤無礙。為無住涅槃」）·时数·难思（无边之境）·无比。〔本文判断〕本偈「方便力」×10 与 T5「如是業應作」×10、T9「是其行」×10 合成**三组各十之结句公式柱**（§7.5 实测）——公式之整饬两译同构（六十「是彼淨妙業」×10 当 T5·§6.1）。\n\n### 2.10 段（十二）·T9 光照十亿界·第九偈（大悲救摄·十种是其行）〔L.187 本批·全量入文〕\n\n**长行（全引）**：\n\n> 「爾時，光明過一億世界，遍照東方十億世界；南、西、北方，四維、上、下，亦復如是。彼一一世界中，皆有百億閻浮提，乃至百億色究竟天；其中所有，悉皆明現。彼一一閻浮提中，悉見如來坐蓮華藏師子之座，十佛剎微塵數菩薩所共圍遶。悉以佛神力故，十方各有一大菩薩，一一各與十佛剎微塵數諸菩薩俱，來詣佛所。其大菩薩，謂：文殊師利等；所從來國，謂：金色世界等；本所事佛，謂：不動智如來等。」\n\n> 「爾時，一切處文殊師利菩薩，各於佛所，同時發聲，說此頌言：」\n\n**偈（全引·十颂二十行）**：\n\n> 「廣大苦行皆修習，日夜精勤無厭怠，已度難度師子吼，普化眾生是其行。眾生流轉愛欲海，無明網覆大憂迫，至仁勇猛悉斷除，誓亦當然是其行。世間放逸著五欲，不實分別受眾苦，奉行佛教常攝心，誓度於斯是其行。眾生著我入生死，求其邊際不可得，普事如來獲妙法，為彼宣說是其行。眾生無怙病所纏，常淪惡趣起三毒，大火猛焰恒燒熱，淨心度彼是其行。眾生迷惑失正道，常行邪徑入闇宅，為彼大然正法燈，永作照明是其行。眾生漂溺諸有海，憂難無涯不可處，為彼興造大法船，皆令得度是其行。眾生無知不見本，迷惑癡狂險難中，佛哀愍彼建法橋，正念令昇是其行。見諸眾生在險道，老病死苦常逼迫，修諸方便無限量，誓當悉度是其行。聞法信解無疑惑，了性空寂不驚怖，隨形六道遍十方，普教群迷是其行。」\n\n**疏解**：澄观科「第九重光照⼗億界。歎佛⼤悲救⽣德。⼗偈多以第四句為結。於中分三。初偈總標⾏海已圓⽽能普化」：初偈总标行海已圆而能普化。疏释「師子吼」立六种决定说：「師⼦吼者。名決定說。定說⼀切眾⽣皆有佛性。度⼀闡提。定說無我度諸外道。定說欲苦不淨。以度波旬。定說如來常樂我淨。度諸聲聞。定說⼤悲以度緣覺。定說如來無礙⼤智。以度菩薩」——六类定说对治六道之机，是「普化眾生」之疏解正证。次八别显化类：痴爱（欲海五难「⼀⽔深。⼆波迅。三迷闇。四蟲執。五憂迫失⼒」）·著欲·著我（说二无我）·恶趣（「但淨其心因亡果喪」）·邪见（然大正法灯）·著有（兴大法船）·无明（建法桥·正念即昇）·险道（老病死苦）。后一总结悲智周遍（「前半結有教證之智。能導無緣之悲。次句結有同體之悲。能遍⼗⽅六道。後句結於所救」）。六十此偈结句作「是則佛境界」×8＋末句「是則天人師」（实测·§6.1 表〔四〕）——偈内结词不匀乃六十译风，八十则全偈整齐「是其行」×10。\n\n### 2.11 段（十三）·T10 光照百億那由他界·穷法界·第十偈（因果圆遍·破相见佛）〔L.187 本批·全量入文〕\n\n**长行（全引·数法顶点）**：\n\n> 「爾時，光明過十億世界，遍照東方百億世界、千億世界、百千億世界、那由他億世界、百那由他億世界、千那由他億世界、百千那由他億世界，如是無數無量、無邊無等、不可數、不可稱、不可思、不可量、不可說，盡法界、虛空界、所有世界；南、西、北方，四維、上、下，亦復如是。彼一一世界中，皆有百億閻浮提，乃至百億色究竟天；其中所有，悉皆明現。彼一一閻浮提中，悉見如來坐蓮華藏師子之座，十佛剎微塵數菩薩所共圍遶。悉以佛神力故，十方各有一大菩薩，一一各與十佛剎微塵數諸菩薩俱，來詣佛所。其大菩薩，謂：文殊師利等；所從來國，謂：金色世界等；本所事佛，謂：不動智如來等。爾時，一切處文殊師利菩薩，各於佛所，同時發聲，說此頌言：」\n\n**偈（全引·十颂二十行）**：\n\n> 「一念普觀無量劫，無去無來亦無住，如是了知三世事，超諸方便成十力。十方無比善名稱，永離諸難常歡喜，普詣一切國土中，廣為宣揚如是法。為利眾生供養佛，如其意獲相似果，於一切法悉順知，遍十方中現神力。從初供佛意柔忍，入深禪定觀法性，普勸眾生發道心，以此速成無上果。十方求法情無異，為修功德令滿足，有無二相悉滅除，此人於佛為真見。普往十方諸國土，廣說妙法興義利，住於實際不動搖，此人功德同於佛。如來所轉妙法輪，一切皆是菩提分，若能聞已悟法性，如是之人常見佛。不見十力空如幻，雖見非見如盲覩，分別取相不見佛，畢竟離著乃能見。眾生隨業種種別，十方內外難盡見，佛身無礙遍十方，不可盡見亦如是。譬如空中無量剎，無來無去遍十方，生成滅壞無所依，佛遍虛空亦如是。」\n\n**疏解**：澄观：「第⼗重光照⼗⽅。總結無盡。⻑⾏分⼆。先明世界數量。略有⼗七漸窮法界。後明彼諸世界所有皆現。⼗頌明因果圓遍德。於中分⼆。前四⽰佛因果遍說」——长行数法**十七级渐穷法界**（百億→千億→百千億→那由他億→百那由他億→千那由他億→百千那由他億→無數·無量·無邊·無等→不可數·不可稱·不可思·不可量·不可說→盡法界虛空界所有世界·实测 §7.5），等比链至第九段十億而极，第十段跃入**遮拨之表**（「不可」系列）与**际之穷**（法界·虚空界），数法于焉自我终止〔本文判断：形式描述·非义理证〕。偈十颂分二：前四示佛因果遍说（因圆果满·三达十力／大用外彰／遍因法供养「晉經云。正⼼供養。明是」／深因速证六度），后六劝物顺行（求法·说法·听法「無有⼀文⼀法非菩提因。豈⽌」／破相三偈）。末颂刹空之喻，澄观科四义对四义：「如剎遍空有其四義。⼀多剎滿空。⼆體無來去。三不妨成壞。四無別所依。佛⾝遍空亦具四義。⼀頓遍多剎。⼆恒不去來。三應有出沒。四體⽤無依。是故佛⾝亦」。品末疏家结科：「上來三品。答初十句所依果問竟」（`T1735` 卷十三末·§5.1 全摘）——名号·四谛·光明觉三品对第一会如来现相四十问中「所依果」问，于焉收束（§三·承演钞链）。\n\n### 2.12 小结〔L.187 本批·全量口径〕\n\n本品全量入文既毕：**长行十四单元 2,072 字·偈十首各二十行 2,286 字·品界 CJK 4,358**（`_e9_full.py`／`_e9_stats.py` 实测·§7.4–7.5）。十段二拍，三组结句公式柱各×10；数法九段严格等比、第十段十七级穷际。澄观「一放顿照」之判与「如月普照百川各见」之喻（§5.1 全摘）互成——**光为能照·觉为能悟·事理双照而唯一无碍法界**，来意第三义「即說十信之體性故」，十信现量张本至斯全文具在。\n\n---\n\n## 三、旁参与前接\n\n### 3.1 前接（第二会内部）\n\n- **接《如来名号品》**：名号品列佛名号二百一十一（第七部 §2），本品集会段之十世界十佛「剎號佛名皆同名號品中。但增百億為異耳」（澄观·§5.1）——本品是名号品「遍」义的**现量化**：名号遍是言说，光照遍是现示。\n- **接《四圣谛品》**：四谛品明口业说实之权遍，本品明意业之「即权之实遍」（澄观来意第四义·§5.1）。演钞科判链：「九身語既彰。意業將顯。意玄叵測仍帶身明。故足輪放光照事警物……故受之以光明覺品」（`T1736`@184385 段·§5.3′ 旁引）。\n- **光位承转**：第一会·如来现相品眉间白毫放光（第二部），本品**足轮**放光——李通玄判「前如來現相品中如來眉間放光已入兩足輪中」（T1739·§5.3）；后第三会升须弥顶、偈赞品足指端放光，成「眉间→足轮→足指→足趾」之光位阶梯〔李氏系·只录其判〕。\n\n### 3.2 旁参（别时别经）\n\n- **《菩萨问明品》（次品）**：十首更互问答由此品集结之文殊—十首格局开出；问明品初「文殊師利菩薩問覺首菩薩言：『佛子！心性是一，云何能生種種果報？』」（六十·`juan5.txt`@L307-310 直证·六十题《菩萨明难品第六》）——光照现境（本品）→ 心性问起（次品），境→观之转。\n- **《华藏世界品》（第一会）**：彼品普贤说世界海因起，此品光照「一會遍一切處」——澄观判本品「九示前神通相故。上云現通。如何現耶。一會不動遍法界故」（§5.1），即遥应华藏品现通段。\n- **《阿僧祇品》（第七会）**：数法之展开。澄观释本品「百億」时预指「餘如光明覺品說」（`T1735`@581638·彼处释「一百洛叉為一俱胝」还引本品「過一億」为证）——本品与阿僧祇品互为数法之锚。\n- **兜沙经 `T10n0280`**：无对应品（§1.6）；《十住经》《渐备》等异译系统与本品无涉。\n- **藏译编目**：order 9 `'od zer dang ye shes`（光明与智），汉藏基本对应（diff_matrix·diff_type E）——题名近「光明觉」之义取，可旁证「觉＝智」之古读〔仅编目级·待核〕。\n\n### 3.3 判教位置\n\n澄观科第二会为「修因契果生解分」之初（十信）；本品与次三品（问明·净行·贤首）合成十信全段——「十上之三品。復為所信正報之果」（演钞）。海云讲记判「如來名號品（佛）・四聖諦品（法）・光明覺品（僧）」三宝配，系讲师自用科判〔讲师玄谈·非正行〕（§5.3′）。\n\n---\n\n## 四、义理要点与名相\n\n### 4.1 光·觉·网：题眼三义（依诸家）\n\n「光明」摄**身智二光**（佛身光现事·文殊智光赞理）；「觉」摄**觉知·觉悟**二层（菩萨觉知见事无碍·眾觉悟法之性相）；慧苑独以梵本「**光明網**」立释——足下轮「网相」放光还名光网，光网即千辐轮相之德用（§5.2″）。三义合观：题即全品科骨。\n\n### 4.2 十段遍照·一放顿照（数法与现量）\n\n十段自「此三千大千」倍增至「百千那由他亿」而结「尽法界虚空界」；澄观断言：**「非多度放光。亦非一度放光。次第照於多節。唯一放光。同時頓照盡空世界」**——说有前后只为「言不并彰、随机心现」，喻如「月普照百川各见」（§5.1）。又实义上「應有等法界無盡之節。節節有偈。中上本經必應廣說」——今文四千余字是略本，此判为华严「文略义广」之通例又一证〔依疏〕。\n\n### 4.3 身智二光·事理双照\n\n佛光现事令**目覩**，文殊智光赞理令**悟入**——「身智二照合為一光。令二覺齊圓」（演钞）；「知無事非理故……此三圓融唯無礙之法界」（澄观·§5.1）。此为本品在「信」位安「解」的枢纽：信不离智照，智照不离现事。\n\n### 4.4 足轮放光·表信（⚖ 四义／三义两判并存）\n\n- **澄观四义**：一「自下而上信最初故」；二「最卑微故」；三「為行本故」（引《智度论》卷九：「身得住處皆由於足」）；四「顯信該果海已滿足故」。并释「輪義亦然。圓無缺故」（§5.1）。\n- **慧苑三义**：一涉达所因·信为至初；二信望后住最劣·足下至卑；三为本所依·「將詣菩提。信為根本」，引「信為道元功德母」及《智度》第九同文（X0221·§5.2″）。\n- ⚖ 智俨别出「示十信是行足圓備故也」（T1732）；李通玄「最下。明入信之首以信為因」（T1739）。四判同归「信」而开合各异，〔本文判断〕四义较三义多出「信该果海」一层，正是澄观后出转精处。\n\n### 4.5 一切处文殊（三义）\n\n澄观「略申三義」：一約當節——初节百亿佛前有百亿文殊，「各各皆說當節之偈」；二約来处——「一文殊從一處東來。即從一切處東來……以是法界即體之用身故」；三約表法——「文殊乃是不動智之妙用。觸境斯了。**六根三業盡是文殊。實相體周萬像森羅無非般若**。何有一處非文殊哉」（§5.1）。此段是华严文殊观之最凝练表述；慧苑答「定不相違」难曰「法界之身常來遍不相障……即佛以法界身。放法界光。令眾以法界眼覩文殊法界身」（X0221）。\n\n### 4.6 偈义纲领：超情·离见·一多\n\n- **反显**：「若有見正覺,解脫離諸漏,不著一切世,彼非證道眼」——离著之见仍是取舍，「证道眼者。无分别故」（澄观）。\n- **离见之益**：见世界心不摇动·依正等·生佛等·五蕴无数·超越世出世见——九顺偈层层洗境。\n- **迴向义**：「若於一切智,發生迴向心,見心無所生,當獲大名稱」——慧苑广引《大品》「迴向心不在菩提心中」解之（⚖ 八十偈文「獲大名稱」，六十作「彼人大名稱」·§6.1 表〔三〕）。\n- **一多相即**：「一中解無量,無量中解一,了彼互生起,當成無所畏」——澄观指为十玄「一多相容不同门」之经证，并出「多有力能攝一，一无力入於多」之相由义（§5.1）；⚖ 慧苑限此「是理事無礙。非事事無礙。應審其文。勿謬解也」（X0221）——同一颂文两判层级不同，是澄／苑义理分歧之显微镜标本（§5.4）。\n- **三世一念**：末偈「一念普觀無量劫,無去無來亦無住」——时间摄归于光中之现量。\n\n### 4.7 名相表\n\n| 名相 | 训释 | 出处 |\n|---|---|---|\n| 三千大千世界 | 一小千＝日月须弥四大洲欲天梵世各一千；千倍为中千、复千倍为大千，「皆同一成壞」；「以三度積故曰三千。略去小中舉其末後」 | 俱舍论·澄观引（`T1735`） |\n| 四大洲 | 閻浮提（新云贍部·因赡部树名洲）·弗婆提（胜身）·瞿耶尼（牛货）·欝單越（胜生·定寿千岁） | 澄观释·§5.1（六十作拘伽尼·§6.1） |\n| 百億 | 此方黄帝算法三等（上中下），今约中数「从千已上百百變之則有百億」；唐三藏译百億俱胝；俱胝旧传十万／百万／千万三种 | 澄观引《俱舍》「洛叉＝亿」、测公《深密记》（`T1735`） |\n| 那由他 | 八十：「那由他億世界」；六十：「億那由他世界」——译序倒置·数量级异读〔待核〕 | 两译长行（§6.1 表〔四〕） |\n| 光明網 | 梵本品题所含（如來光明網能覺悟品）；轮网相放光 | X0221 |\n| 一切處文殊師利 | 不动智之妙用·法界即体之用身 | `T10n0279`／`T1735` |\n| 十首（觉首…贤首） | 十大菩萨，当机集会众首，次品问主 | `T10n0279` |\n| 蓮華藏師子之座 | 华藏世界依持之座·与第一会华藏庄严呼应 | `T10n0279` |\n| 不動智佛 | 金色世界本所事佛；十佛皆「智」名——表十信依智立 | `T10n0279`／`T1739` |\n\n---\n\n## 五、注疏选要（诸家会读）\n\n### 5.1 澄观《华严经疏》卷十三（`T1735`@151418–161145·「光明覺品第九(入第十三經)」·五门全段）\n\n**（甲）来意十义**：「解此一品略以五門。初來意中自有其十。」\n\n> 「一為答前所依果問故。然古德對前二品已答二問。此品正答三問。謂⻑行放光答佛威德。見成正覺答成菩提。文殊說偈正答佛法性問。今更一解。謂⻑行但現相答。已如前說。偈中具答三問謂初五答菩提。次一答威德。後四答法性。」\n\n其二「為廣名號品總標多端故……正廣種種觀察是意業故」；其三「即說十信之體性故」；其四「顯實遍故……前但佛名遍此顯身遍。四諦即實之權遍。此品顯即權之實遍故」；其五「現驗故……今光示遍相故」；其六「顯總遍故……一一皆悉同時同處同眾同說同遍故」；其七「顯圓遍故……今顯無差別。一切即圓融遍一切故」；其八「與下經為其則故」；其九「示前神通相故……一會不動遍法界故」；其十「為顯理事俱無障礙。令捨執從法故」。\n\n**（乙）释名**：「光明體也。覺者。用也。此二各二。謂光有身智二光。覺有覺知覺悟。又光有能照所照。覺有能覺所覺。如來放身光照事法界。令菩薩覺知見事無礙。文殊演智光雙照事理。令眾覺悟法之性相。」合说：「身智無二。唯一無礙光故。涅槃經瑠璃光菩薩處云。光明者。名為智慧……又此二光不異覺境。此三圓融唯無礙之法界。」\n\n**（丙）宗趣**：「以身智二光無礙覺悟為宗。令物生信為趣。」\n\n**（丁）解疑妨**：「問此足輪光何時放耶……答是前名號品放。但前二品明文殊此會說法不俟光照。今辨百億剎中。乃至遍法界說故。須光以顯示其所來。」又「光照百億百億何不照此。釋云。此為主故。」\n\n**（戊）释文要科**：足下放光表信四义（§4.4）；「光照大數約其現文。且有二十六節。前九別名。後十七同辨。即為十段」；一放顿照·如月普百川（§4.2）；「十段之中文各有二。皆⻑行。佛以身光照現事境。令眾目覩。偈頌文殊智光讚述事理。令眾悟入」；三千大千据《俱舍》·引《长阿含》十八《杂阿含》十六《顺正理》三十一《显扬》第一《金光明》诸说并会；四大洲新译释（§4.7）；百億数法（§4.7）；一切处文殊三义（§4.5）；「或見」十义（§2.4）；逐偈科判（§2.2–2.7）；至第十重科「具四義。一頓遍多剎。二恒不去來。三應有出沒。四體用無依。是故佛身亦不可以遍空而取耳」；结：「**上來三品。答初十句所依果問竟**」。\n\n\n**〔L.187 本批·疏科长文全摘〕**（`T1735` 卷十三「光明覺品第九」本科段·NFKD 1:1 重锚·引文照 raw 原字形含「⻑」U+2ED1）\n\n*甲·来意十义（五门之首）*：\n\n> 「解此⼀品略以五⾨。初來意中⾃有其⼗。⼀為答前所依果問故。然古德對前⼆品已答⼆問。此品正答三問。謂⻑⾏放光答佛威德。⾒成正覺答成菩提。文殊說偈正答佛法性問。今更⼀解。謂⻑⾏但現相答。已如前說。偈中具答三問謂初五答菩提。次⼀答威德。後四答法性。⼆為廣名號品總標多端故。正廣種種觀察是意業故。三者即說⼗信之體性故。如下三會將說正位。皆有偈讚此其類也。四顯實遍故。但所說有⼆。⼀佛⼆法。佛有⼆。⼀⾝⼆名。法亦有⼆。⼀權⼆實。前但佛名遍此顯⾝遍。四諦即實之權遍。此品顯即權之實遍故。五現驗故。上⼆云遍眾未⽬覩。今光⽰遍相故。六顯總遍故。前但名諦別遍。今此⼀會即遍法界。⼀⼀皆悉同時同處同眾同說同遍故。七顯圓遍故。謂前顯差別。⼀切⽅能遍⼀切。今顯無差別。⼀切即圓融遍⼀切故。八與下經為其則故。謂下結經通云。遍⼀切者。皆如此辨以如來⼀乘圓教。於須彌⼭等⼀類世界。施化分⿑皆若此故。九⽰前神通相故。上云現通。如何現耶。⼀會不動遍法界故。⼗為顯理事俱無障礙。令捨執從法故。此意雖通在文遍顯。有上諸義故此品來也」\n\n*乙·释名（开合·涅槃经引）·宗趣*：\n\n> 「第⼆釋者名。⼀開⼆合。初開者。光明體也。覺者。⽤也。此⼆各⼆。謂光有⾝智⼆光。覺有覺知覺悟。⼜光有能照所照。覺有能覺所覺。如來放⾝光照事法界。令菩薩覺知⾒事無礙。文殊演智光雙照事理。令眾覺悟法之性相。⼆合者。良以事理俱融唯⼀無礙境。故得⼀事即遍無邊。⽽不壞本相。⾝智無⼆。唯⼀無礙光故。涅槃經瑠璃光菩薩處云。光明者。名為智慧。知悟不殊。唯⼀平等覺悟之⼼。知無事非理故。⼜此⼆光不異覺境。此三圓融唯無礙之法界。雖平等絕相不壞光明之覺。品中辨此故以為名。若從開釋。光明之覺光明有覺之⽤。通依主有財。若從合說。光明即覺可持業也。第三宗趣者。以⾝智⼆光無礙覺悟為宗。令物⽣信為趣。⼜釋名並是品宗來意盡為意趣」\n\n*丙·解疑妨（放光时处·此为主·金色在何处）·足轮放光四义·二十六节与一放顿照·十段依答文三*：\n\n> 「第四解疑妨。問此⾜輪光何時放耶。若說名諦意如何。佛剎菩薩眾數並同名號。如前已放前何不說。答是前名號品放。但前⼆品明文殊此會說法不俟光照。今辨百億剎中。乃⾄遍法界說故。須光以顯⽰其所來。菩薩即前菩薩。故並全同。次有妨云。光照百億百億何不照此釋云。此為主故。若彼為主則說彼照。⼜疑云。下光既窮法界。⾦⾊更在何許。當剎當剎有本會處。皆去⼗剎主伴遍故」\n\n*丁·一切处文殊三义*：\n\n> 「⾔⼀切處文殊者。略申三義。⼀約當節。如初節中。百億佛前有百億文殊。為⼀切也。各各皆說當節之偈。故文皆云各於佛所。⼆⼀文殊從⼀處東來。即從⼀切處東來。⾄⼀法會。即⾄⼀切法會故。雖東來⽽即⼀切處。以是法界即體之⽤⾝故。三約表法。文殊乃是不動智之妙⽤。觸境斯了。六根三業盡是文殊。實相體周萬像森羅無非般若。何有⼀處非文殊哉」\n\n*戊·一多十义（T7 颂疏广明）*：\n\n> 「復總收之以為⼗義。⼀孤標獨立。⼆雙現同時。三兩相俱亡四⾃在無礙。五去來不動六無⼒相持。七彼此無知。八⼒⽤交徹。九⾃性非有。⼗究竟離⾔」\n\n*己·师子吼六种决定说（T9 颂疏）*：\n\n> 「師⼦吼者。名決定說。定說⼀切眾⽣皆有佛性。度⼀闡提。定說無我度諸外道。定說欲苦不淨。以度波旬。定說如來常樂我淨。度諸聲聞。定說⼤悲以度緣覺。定說如來無礙⼤智。以度菩薩」\n\n*庚·结经句*：\n\n> 「上來三品。答初⼗句所依果問竟」（`T1735` 卷第十三末·卷第十四题前）\n\n### 5.2 法藏《探玄记》卷三（`T1733`@105627–111671·「如來光明覺品第五四門同上」·探玄记依六十编次）\n\n- **释名**：「謂如來之光明光明之開覺。謂依體起用依用成益。皆依主釋可知。」\n- **来意七义**：「一前明身語今明意業故來也。二為別答前功德勢力等問故。三前二品別明人法遍。此為雙顯二遍故。四為前但論佛名普遍。此顯佛身實德亦遍。前說四諦權教普遍此辨十偈實教亦遍……五即說十信之體性故……（六）為廣名號品總標……（七）……」；三业判语：「此品明身業遍應。謂名號依身而立故。四諦品明佛口業普周。光明覺品明佛意業遍覺。三輪攝伏。俱是正報。然身業最麁。故先辨耳」（@98210 段）；又「此品明國土海義。前品既辨世界海。即明體隨緣顯其果相。今即約緣反顯明其果體」。\n- **宗趣**：「三明宗趣者亦三。先明分宗通至第六會來同是一番問答故」；会中之义：「此會是修因之始而與果同會。而果在會初。十地等是成因之終。亦與果同會而果在會後。此等為顯依果海以起圓因。因滿還融歸圓果。此乃文中宏致始終之幖幟者也」（@97900–98500 段·第二会配「果在会初」之判为法藏纲目）。\n- **释文**：十段依答文三、偈颂分段科判（与澄观门径多合·澄观疏此品实承探玄记格局〔本文判断·依两文比对〕）；末段「上來通答前初十問竟」。\n\n### 5.2′ 智俨《搜玄记》（`T1732`@21782–23696·「光明覺品第五四門同前」·依六十）\n\n四门：名·来意·宗·释文。「一辨名者。如來即化主。光者智體。明者用。覺者開曉於緣耳」；「二來意。何故來者。將欲說故。集有緣眾并顯法分齊也」；「三宗為集同法眾亦顯法增微」；「四分文釋者。此上三品並通下第六會已來。增微有異文局義通」。独得之点：\n\n- 文有十段、「此中放光分齊有**二十五重**。初九別列。餘者總結」⚖（与澄观「二十六節」异算·§6.4）；\n- 诸会放光升降对照：「第一會放光有十意如文……光覺品初相輪光顯信位所依法分齊。次佛神力集眾顯當位中所成德」；\n- 「文殊在前賢首在後為表智先福後故」；「光覺在於一時。而能別見遠近。又諸方運集只是一人而令眾異見。未必有多」；\n- 十偈科：「大分有三。初一辨取相不應真法。二有八偈辨離取應實法。次一歎解者有勝能也」；\n- **十偈配十地**（古十地配之滥觞样本）：「總明知善惡等慈化物益。相同二地戒行」「相同三地」「相同四地無攝義」「相同五地中相續不異義」「相同六地無染淨義」⚖——与澄观「说十信体性」判明显异位，只并记不牵合。\n\n### 5.2″ 慧苑《續華嚴略疏刊定記》卷第四（X0221@114068 起·「光明覺品第九」·**本品有记之直证**）\n\n> 「將釋此品。四門同前。初釋名中二。先顯得名。後辨釋名。先得名者。梵本中名如來光明網能覺悟品。謂佛足下輪網相中放光。還名光網。照十方佛會。覺悟菩薩。令發意來此故。」\n\n- **来由二义**：「一由答前**八問**故來」（威德·开示意遍·刹庄严·佛性·佛刹清净·刹体性·刹成就·佛大菩提——逐光中事相配问）；「二顯前二品名諦別遍。即是此品融遍故來也」。⚖ 八问对澄观「答三问／十义」，问数异判。\n- **宗趣**：「以佛光照一切剎中菩薩為宗。覺悟彼諸菩薩令來此為趣。宗趣門中但說宗趣。不煩強說餘法。」——与澄观「令物生信为趣」异（此就「集众」立趣〔本文判断〕）。\n- **释文**：二十六节十段·「此非二十六度放光。亦非一放而次第巡照。但一放光同時頓照盡空世界」；足下放光**三义**（§4.4）；界量广引（真谛部异执记·长阿含·杂阿含·俱舍·顺正理·显扬·金光明——较澄观更繁，并断「若約至教定量。則此經為定」因「今此經文中。但至色頂」）；数法四等（下·中·上·上上上上）广释洛叉／俱胝／阿僧企耶；十偈逐段科（§2.2–2.7 多所采）；末判「是理事無礙。非事事無礙。應審其文。勿謬解也」（§4.6）。**是记解经细密处多过澄观所承，而处处露「依梵本」「准梵本」之料简——校勘层最活动的一家（§6.4）。**\n\n### 5.3 李通玄《新华严经论》（`T1739`@39987 等·二十处征引·异判只录不改）\n\n- 「於兩足輪下放光明……兩足輪下光者。為其最下。明入信之首以信為因。信為最下故。此是如來眉間果光放入故。前如來現相品中如來眉間放光已入兩足輪中。為欲明舉佛。果〔德為因〕」；\n- 「如來於眉間。放果德光明。入足下輪中。明以果成因……便說信門即於光明覺品中。還從兩足下輪中放出初眉間放入果德光明。用照金色世界不動智佛。以成信位。以次欲說十住品時。昇須彌山頂。於偈讚品中於如來兩足指端放光」（@48228）；\n- 「如經十信位中光明覺品云。十方一切處文殊師利。於十方一切處。說十方一切處法門。歎佛十種果德。以成信位」（@41479）；\n- 第六重证法别：「如經中從第二會光明覺品。於如來兩足輪下放光明遍照百千那由他三千大千世界。乃至如是無量無數……盡虛空遍法界所有世界」（@50358·⚖ 征引文顺与今本小异·其「百千那由他三千大千世界」为撮引）。\n〔按〕李氏「眉间—足轮—足指—足趾」光位表位次之说，诸家无同引者，属《论》家自用科纲，**只标不改**；其「歎佛十種果德以成信位」与澄观「说十信体性」可互证。\n\n### 5.3′ 海云继梦讲记（Ep10·〔讲师玄谈·非正行〕并存）\n\n- Ep10《光明觉品》段（光明覺×27）讲师自设科：「如來名號品（佛）・四聖諦品（法）・光明覺品（僧）・菩薩問明品（法界能所）」——三宝配系讲者活用，非诸家旧科〔讲师玄谈·非正行〕；又「從光明覺品開始我們又把它畫為行法的範圍裡面」——以本品为「行法」起点之分段判，与古科「所信果—能信行」之界（在问明以下）不同〔讲师玄谈·非正行〕。\n- Ep11「第三會開頭四品經（光明覺・問明・淨行・智首所問）」——会次名相通说恐系口误（四品实属第二会），并原存校订注 ⚖ 玄谈段口诵科判〔待核〕，**只标不改**。\n- 本品**正行段逐字讲记**：Ep15 后正行转禅修系、Ep16+ 未上传，〔正行讲记未上架·待补〕。\n\n### 5.4 诸家对读小结\n\n| 家 | 释名 | 来意 | 宗趣 | 放光表义 | 光照节数 |\n|---|---|---|---|---|---|\n| 澄观 | 体用开合·持业依主 | 十义·答三问 | 二光无碍觉悟·生信 | 四义 | 二十六节 |\n| 法藏 | 依主（如来光明·光明开觉） | 七义·三业轮摄 | 三重·通第六会 | （未别立） | （文同） |\n| 智俨 | 智体·明用·开晓 | 将欲说·集有缘 | 集同法众·显增微 | 行足圆备 | 二十五重 |\n| 慧苑 | 梵本「光明網能覺悟」 | 二义·答八问 | 光照菩萨·觉悟令来 | 三义 | 二十六节 |\n| 李通玄 | （不论） | 果光入足·以果成因 | 成信位 | 眉间→足轮 | （撮引） |\n\n⚖ 三处硬差异不牵合：①「答三问（澄）／答八问（苑）／别答功德势力问（藏）」；②「二十六节（澄苑）／二十五重（俨）」；③「十信体性（澄）／十地分位（俨）」。④ 圆义层级：澄观处处以理事・事事无碍收，慧苑于「一中解无量」独判**非**事事无碍——华严今古学之分于本品一偈见其微。〔本文判断〕\n\n---\n\n## 六、文本对读与校勘\n\n### 6.1 八十／六十对读（`T10n0279` 卷十三 ↔ `T09n0278_juan5.txt`·STEP0 新档·L.181）\n\n**〔一〕品题与结经**：八十「光明覺品第九」／六十「**如來光明覺品第五**」（冠「如來」·编次从六十二十会第五）；六十段末以「大方廣佛華嚴經」卷尾题收（无八十品末「10」类卷首残痕），次品六十题《**菩薩明難品第六**》（八十作《菩薩問明品第十》——前批「問明×0」之谜已解·L.181）。\n\n**〔二〕十段阶梯对勘**（两译十段序全同·数名异译）：\n\n| 段 | 八十 | 六十 | 备注 |\n|---|---|---|---|\n| T1 | 照此三千大千世界 | 遍照三千大千世界 | 「照此／遍照」·起句异（下表〔三〕） |\n| T2 | 遍照東方十佛國土 | 遍照東方十佛國土 | 同 |\n| T3–T4 | 百世界／千世界 | 百世界／千世界 | 同 |\n| T5 | 十千世界 | **萬**世界 | 八十存「十千」古算·六十用「萬」 |\n| T6 | 百千世界 | **十萬**世界 | 同上 |\n| T7 | 百萬世界 | 百萬世界 | 同 |\n| T8 | 一億世界 | 一億世界 | 同 |\n| T9 | 十億世界 | 十億世界 | 同 |\n| T10 | 百億…那由他億世界…盡法界、虛空界、所有世界 | 百億…億那由他世界…不可量…虛空、法界等一切世界 | 「那由他億／億那由他」译序倒·结广语小异 |\n\n**〔三〕首段要句逐字对**：\n\n| 八十（`T10n0279`） | 六十（`juan5.txt`） | 异文类 |\n|---|---|---|\n| 從兩足**輪下**放百億光明 | 從兩足**相輪**放百億光明 | 所依处（轮下／相轮 進首菩薩、法首菩薩、智首菩薩、賢首菩薩。是諸菩薩所從來國，金色世界、樂色、華色、薝蔔華色、青蓮華色、金色、寶色、金剛色、玻瓈色、如實色世界。各於本國佛所，所謂：不動智佛、智慧火佛、淨智佛、具威儀智佛、明星智佛、究竟智佛、無上智佛、自在智佛、梵天智佛、伏怨智佛所，淨修梵行。\n> 爾時，文殊師利以偈頌曰：\n> 「若有知正覺，解脫離諸漏，\n> 不著一切世，彼非淨道眼。\n> 若有知如來，觀察無所有，\n> 知法散滅相，彼人疾作佛。\n> 能見此世界，一切處無著，\n> 如來身亦然，是人疾成佛。\n> 若於佛法中，其心隨平等，\n> 入不二法門，彼人難思議。\n> 若見我及佛，安住平等相，\n> 彼住無所住，遠離一切有。\n> 色受無有數，想行識亦然，\n> 能如是知者，彼是大牟尼。\n> 見者無所有，所見法亦無，\n> 明了一切法，彼能照世間。\n> 一念見諸佛，出現于世間，\n> 而實無所起，彼人大名稱。\n> 無我無眾生，亦無有敗壞，\n> 若轉如是相，彼則無上人。\n> 一中解無量，無量中解一，\n> 展轉生非實，智者無所畏。」\n> 如此處文殊師利說偈，一切處亦復如是。\n> 爾時，光明過此世界，遍照東方十佛國土，南、西、北方，四維，上、下，亦復如是。彼一一世界中百億閻浮提，乃至百億色究竟天世界所有，一切悉現。如此見佛坐蓮華藏師子座上，有十佛世界塵數菩薩眷屬圍遶，彼一一世界中百億閻浮提亦復如是；佛神力故，皆見十方各有一大菩薩，各與十世界塵數菩薩眷屬俱，來詣佛所，所謂文殊師利乃至賢首等。是諸菩薩所從來國，金色世界乃至如實色世界，各於本國不動智佛乃至伏怨智佛所，淨修梵行。\n> 爾時，一切處文殊師利以偈頌曰：\n> 「見眾生苦逼，癡覆愛欲刺，\n> 常求無上道，諸佛法如是。\n> 離斷常二邊，見法實不轉，\n> 昔所未曾轉，轉此無上輪。\n> 不可思議劫，被弘誓德鎧，\n> 為度生死故，大聖法如是。\n> 導師降眾魔，勇健莫能勝，\n> 愛語離眾怖，無上慈悲法。\n> 內得甚深智，能害諸煩惱，\n> 一念見一切，彼自在示現。\n> 能擊正法鼓，聲震十方國，\n> 令得無上道，自覺法如是。\n> 不壞無量境，能遊無數剎，\n> 不取一切有，彼自在如佛。\n> 無比歡喜念，諸佛常清淨，\n> 虛空等如來，彼是具足願。\n> 一一眾生故，阿鼻地獄中，\n> 無量劫燒煮，心淨如最勝。\n> 不惜身壽命，常護諸佛法，\n> 具足行忍辱，彼得如來法。」\n> 爾時，光明過十世界，遍照東方百世界，乃至上方亦復如是。彼一一世界中百億閻浮提，乃至百億色究竟天世界所有，一切悉現。如此見佛坐蓮華藏師子座上，有十佛世界塵數菩薩眷屬圍遶，彼一一世界中百億閻浮提亦復如是；佛神力故，皆見十方各有一大菩薩，各與十世界塵數菩薩眷屬俱，來詣佛所，所謂文殊師利乃至賢首等。是諸菩薩所從來國，金色世界乃至如實色世界，各於本國不動智佛乃至伏怨智佛所，淨修梵行。\n> 爾時，一切處文殊師利以偈頌曰：\n> 「如來覺諸法，如幻如虛空，\n> 心淨無障礙，調伏群生類。\n> 或見初生時，妙色如金山，\n> 住是最後身，照明如滿月。\n> 或見經行時，攝無量功德，\n> 念慧善具足，明行人師子。\n> 或見明淨眼，觀察照十方，\n> 或時見戲笑，眾生樂欲故，\n> 或見師子吼，清淨無比身，\n> 示現末後生，所說無非實。\n> 或見出家時，解脫一切縛，\n> 修習諸佛行，常樂觀寂滅。\n> 或見坐道場，善覺一切法，\n> 度諸功德岸，癡闇煩惱滅。\n> 或見天人尊，具足大悲心，\n> 或見轉法輪，度脫諸群生，\n> 或見無畏吼，儀容甚微妙，\n> 調伏一切世，神力無障礙。\n> 或見寂靜心，世間燈永滅，\n> 或見十力尊，顯現自在法。」\n> 爾時，光明過百世界，遍照東方千世界，乃至上方亦復如是。彼一一世界中百億閻浮提，乃至百億色究竟天世界所有，一切悉現。如此見佛坐蓮華藏師子座上，有十佛世界塵數菩薩眷屬圍遶，彼一一世界中百億閻浮提，亦復如是；佛神力故，皆見十方各有一大菩薩，各與十世界塵數菩薩眷屬俱，來詣佛所，所謂文殊師利乃至賢首等。是諸菩薩所從來國，金色世界乃至如實色世界，各於本國不動智佛乃至伏怨智佛所，淨修梵行。\n> 爾時，一切處文殊師利以偈頌曰：\n> 「善逝法甚深，無相亦無有，\n> 眾生顛倒故，次第現一切。\n> 無有我我所，彼境界空寂，\n> 善逝身清淨，自覺離諸塵。\n> 等覺明解脫，無量不可數，\n> 無邊世界中，因緣和合起。\n> 無諸陰界入，永離生死苦，\n> 不在世間數，故號人師子。\n> 內外俱解脫，本來常自空，\n> 一切離虛妄，諸佛法如是。\n> 離愛諸煩惱，長流永不轉，\n> 正覺解諸法，度無量眾生。\n> 一念不二相，樂觀寂滅法，\n> 其心無所著，佛自在無量。\n> 善知因緣法，業報及眾生，\n> 最勝無礙智，甚深難思議。\n> 普見十方界，嚴淨諸佛剎，\n> 如來離虛妄，度脫無量眾。\n> 佛智如鍊金，一切有非有，\n> 隨其所應化，為說清淨法。」\n> 爾時，光明過千世界，遍照東方萬世界，乃至上方亦復如是。彼一一世界中百億閻浮提，乃至百億色究竟天世界所有，一切悉現。如此見佛坐蓮華藏師子座上，有十佛世界塵數菩薩眷屬圍遶，彼一一世界中百億閻浮提亦復如是；佛神力故，皆見十方各有一大菩薩，各與十世界塵數菩薩眷屬俱，來詣佛所，所謂文殊師利乃至賢首等。是諸菩薩所從來國，金色世界乃至如實色世界，各於本國不動智佛乃至伏怨智佛所，淨修梵行。\n> 爾時，一切處文殊師利以偈頌曰：\n> 「離諸人天樂，常行大慈心，\n> 救護諸群生，是彼淨妙業。\n> 一向信如來，其心不退轉，\n> 不捨念諸佛，是彼淨妙業。\n> 永離生死海，不退佛法流，\n> 善住清涼慧，是彼淨妙業。\n> 身四威儀中，觀佛深功德，\n> 晝夜常不斷，是彼淨妙業。\n> 知三世無量，不生懈怠心，\n> 常求佛功德，是彼淨妙業。\n> 觀身如實相，一切皆寂滅，\n> 離我非我著，是彼淨妙業。\n> 觀察眾生心，遠離虛妄想，\n> 成就實境界，是彼淨妙業。\n> 能稱無量土，悉飲一切海，\n> 成就神通智，是彼淨妙業。\n> 計數諸佛國，色相非色相，\n> 一切盡無餘，是彼淨妙業。\n> 無量佛土塵，一塵為一佛，\n> 悉能知其數，是彼淨妙業。」\n> 爾時，光明過萬世界，遍照東方十萬世界，乃至上方亦復如是。彼一一世界中百億閻浮提，乃至百億色究竟天世界所有，一切悉現。如此見佛坐蓮華藏師子座上，有十佛世界塵數菩薩眷屬圍遶，彼一一世界中百億閻浮提亦復如是；佛神力故，皆見十方各有一大菩薩，各與十世界塵數菩薩眷屬俱，來詣佛所，所謂文殊師利乃至賢首等。是諸菩薩所從來國，金色世界乃至如實色世界，各於本國不動智佛乃至伏怨智佛所，淨修梵行。\n> 爾時，一切處文殊師利以偈頌曰：\n> 「若以色性大神力，而欲望見調御士，\n> 是則瞖目顛倒見，彼為不識最勝法。\n> 如來身色形相處，一切世間莫能覩，\n> 億那由劫欲思量，妙色威神不可極。\n> 非以相好為如來，無相離相寂滅法，\n> 一切具足妙境界，隨其所應悉能現。\n> 諸佛正法不可量，無能分別說其相，\n> 諸佛正法無合散，其性本來常寂滅。\n> 不以陰數為如來，遠離取相真實觀，\n> 得自在力決定見，言語道斷行處滅。\n> 等觀身心無異相，一切內外悉解脫，\n> 無量億劫不二念，善逝深遠無所著。\n> 普放妙光明，遍照世境界，\n> 淨眼一切智，自在深廣義。\n> 一能為無量，無量能為一，\n> 知諸眾生性，隨順一切處。\n> 身無所從來，去亦無所至，\n> 虛妄非真實，現有種種身。\n> 一切諸世間，皆從妄想生，\n> 是諸妄想法，其性未曾有。\n> 如是真實相，唯佛能究竟，\n> 若能如是知，是則見導師。」\n> 爾時，光明過十萬世界，遍照東方百萬世界，乃至上方亦復如是。彼一一世界中百億閻浮提，乃至百億色究竟天世界所有，一切悉現。如此見佛坐蓮華藏師子座上，有十佛世界塵數菩薩眷屬圍遶，彼一一世界中百億閻浮提亦復如是；佛神力故，皆見十方各有一大菩薩，各與十世界塵數菩薩眷屬俱，來詣佛所，所謂文殊師利乃至賢首等。是諸菩薩所從來國，金色世界乃至如實色世界，各於本國不動智佛乃至伏怨智佛所，淨修梵行。\n> 爾時，一切處文殊師利以偈頌曰：\n> 「最勝自覺超世間，無依殊特莫能勝，\n> 大仙化度一切有，具足淨妙諸功德。\n> 其心無染無處所，常住無想亦無依，\n> 永處吉祥無能毀，威德尊重大導師。\n> 從本淨明滅眾冥，永離諸染無塵穢，\n> 寂然不動離邊想，是名善入如來智。\n> 欲入善逝深法海，遠離身心虛妄想，\n> 解了諸法真實性，永不隨順疑惑心。\n> 一切世界如來境，悉能為轉正法輪，\n> 於法自性無所轉，無上導師方便說。\n> 曉了諸法無疑惑，有無妄想永已離，\n> 不生差別種種念，正意思惟佛菩提。\n> 諦了分別諸法時，無有自性假名說，\n> 隨順諸佛真實教，法非一相亦不多。\n> 眾多法中無一相，於一法中亦無多，\n> 若能如是了諸法，是知諸佛無量德。\n> 觀察諸法及眾生，國土世間悉寂滅，\n> 心無所依不妄想，是名正念佛菩提。\n> 眾生諸法及國土，分別了知無差別，\n> 善能觀察如自性，是則了知佛法義。」\n> 爾時，光明過百萬世界，遍照東方一億世界，乃至上方亦復如是。彼一一世界中百億閻浮提，乃至百億色究竟天世界所有，一切悉現。如此見佛坐蓮華藏師子座上，有十佛世界塵數菩薩眷屬圍遶，彼一一世界中百億閻浮提亦復如是；佛神力故，皆見十方各有一大菩薩，各與十世界塵數菩薩 n(body) == 5198          # 篇幅\nassert body.count('爾時') == 20 and body.count('頌') == 10\nassert body.count('南、西、北方') == 9 and body.count('金色世界') == 11\nassert len(re.findall('百億[\\u4e00-\\u9fff]+', body[body.find('百億閻浮提'):body.find('其中所有')])) == 23  # 照境目（纯汉字目名·全角标点自然截断）\nprint('光明觉品数据层 OK · CJK', len(cjk), '· 含标点', len(body))\n```\n\n> 实测（2026-10-25·§7.4 代码逐字执行件 `_p9_cov_run.py` 输出观察：照境目 23（首「百億閻浮提」尾「百億色究竟天」）·「光明觉品数据层 OK · CJK 4358 · 含标点 5198」·全部断言通过）。\n> 实测（2026-10-25·`_p9_cov.py`／`_p9_tiers.py` 同一口径产出）：品界 @109946–115815，**4,358 字**；断言全过。**〔L.182 夜间复验订正〕**本行初稿记旧导出件首见 @95973「系卷十二尾题连读假串」——承 `_p10_probe.py` 复算，修正平文器下三品题全档各唯一见，旧导出多余见实系**旧平文器目录/征引泄漏**（X0221 目录@216 恰缺问明可证其一；@95973 出处〔待核〕），尾题连读之说照记作废。旧导出件头尾多缀／缺缀，本篇写作时已按上列锚定口径剔除重核（登记附录六 #2）。六十侧以 `T09n0278_juan5.txt` 真品题「如來光明覺品第五」→「菩薩明難品第六」切段（4,870 CJK）。\n\n### 7.5 数法倍增链·数据科学四视角〔L.187 本批新增〕\n\n> 数据基底＝`_e9_full.py` 结构化 dump（25 单元：head×1·p×14·lg×10·lg 内 `<l>` 各 20 行）与 `_e9_stats.py` 频计（品界 CJK-only @79548–83906·4,358）；四视角口径承第一会诸部附录「数据科学」成例。**凡比附义理者一律〔本文判断〕，明示「结构之似非义理之证」。**\n\n**L1·组合（倍增链实测）**\n\n| 段 | 长行公式 | 遍照 Y | log10 级 |\n|---|---|---|---|\n| T1 | 照此三千大千世界 | 百億举（此界） | 疏家数法三释·绝对值不可定（见 L4） |\n| T2 | 光明過此世界 | 十佛國土 | 1 |\n| T3 | 光明過十世界 | 百世界 | 2 |\n| T4 | 光明過百世界 | 千世界 | 3 |\n| T5 | 光明過千世界 | 十千世界 | 4 |\n| T6 | 光明過十千世界 | 百千世界 | 5 |\n| T7 | 光明過百千世界 | 百萬世界 | 6 |\n| T8 | 光明過百萬世界 | 一億世界 | 8（越「萬」直入「億」） |\n| T9 | 光明過一億世界 | 十億世界 | 9 |\n| T10 | 光明過十億世界 | 百億→那由他億系→**盡法界虛空界** | 十七级→超穷（遮拨表） |\n\n九段严格 ×10 等比（`_e9_stats.py` 倍增链 8 环全中）；T8 处「百萬→一億」跳一位（百萬之十倍=千萬=一億·澄观「前云百萬。今十倍於前。即千萬為一億也」恰自注此跳·§5.1）。T10 长行十七数穷法界（§2.11）。\n\n**L2·公式频（复沓核验）**：頌起公式「一切處文殊師利菩薩各於佛所同時發聲說此頌言」×10·「爾時」×20·「悉以佛神力故」×10·「亦復如是」×9·「十佛剎微塵數」×20·「來詣佛所」×10·「不動智如來等」×9·「其大菩薩」×9·金色世界×11（重出 2 计·§1.5）；结句公式柱：「如是業應作」×10（T5）·「方便力」×10（T8）·「是其行」×10（T9）。偈体结构：**每首十颂·每颂两行·十首合 200 行**（`<l>` 实计），长行 2,072／偈颂 2,286 字——**经与颂约 47:53**〔本文判断：整饬复沓密度为第二会六品之冠·对照贤首「又放光明名」叠咏〕。\n\n**L3·拓扑（放射结构）**：一放（足轮）→十段→每段十方（「南西南北方四維上下」×9＋東方别举）→十方各一大菩萨×10→一一各与十佛剎微尘数俱——**1→10→N×尘数**之三层放射星图；受者端「一切處文殊」回卷为 10 颂起（能照所照唯一佛·疏「能照所照唯是一佛」）。〔本文判断·形式描写之似，非义理证〕\n\n**L4·几何／极限**：等比数列（×10）至 T10 跃入遮拨语列（不可數・不可稱・不可思・不可量・不可說）→「盡法界虛空界」—**数法之自我终止**，与澄观「非多度放光。亦非一度放光……唯一放光同時頓照」（§5.1 丙）之「一时顿具」映射相应；疏自断绝对数不可定：黄帝算法上中下三等／俱胝三释（十萬・百萬・千萬）／洛叉之异（§5.1 丙·「百億」量级依中数说）——**故 L1 之 log10 列只取段序相对级，不取绝对数量**（前提自立·防误读）。\n**图 7-1·十段遍照倍增链（log10 级·L.187 本批·数据源 §7.5 L1 表实测）**\n\n<svg viewBox=\"0 0 660 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"光明觉品十段遍照倍增链柱状图（log10 级）\">\n  <text x=\"330\" y=\"18\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5b4636\">十段遍照倍增链 · log10 级（段序为轴·绝对数依疏家中数说〔不可定〕）</text>\n  <line x1=\"50\" y1=\"250\" x2=\"640\" y2=\"250\" stroke=\"#8a7a6a\" stroke-width=\"1\"/>\n  <line x1=\"50\" y1=\"30\" x2=\"50\" y2=\"250\" stroke=\"#8a7a6a\" stroke-width=\"1\"/>\n  <text x=\"14\" y=\"255\" font-size=\"10\" fill=\"#5b4636\">0</text>\n  <text x=\"10\" y=\"95\" font-size=\"10\" fill=\"#5b4636\">log10</text>\n  <rect x=\"58\" y=\"50\" width=\"42\" height=\"200\" fill=\"#c46b5d\" opacity=\"0.25\" stroke=\"#c46b5d\" stroke-dasharray=\"4 3\"/><text x=\"79\" y=\"45\" font-size=\"10\" text-anchor=\"middle\" fill=\"#7a4a3d\">此界·百億举</text>\n  <rect x=\"116\" y=\"230\" width=\"42\" height=\"20\" fill=\"#c46b5d\" opacity=\"0.85\"/><text x=\"137\" y=\"226\" font-size=\"10\" text-anchor=\"middle\" fill=\"#7a4a3d\">十</text>\n  <rect x=\"174\" y=\"210\" width=\"42\" height=\"40\" fill=\"#c46b5d\" opacity=\"0.85\"/><text x=\"195\" y=\"206\" font-size=\"10\" text-anchor=\"middle\" fill=\"#7a4a3d\">百</text>\n  <rect x=\"232\" y=\"190\" width=\"42\" height=\"60\" fill=\"#c46b5d\" opacity=\"0.85\"/><text x=\"253\" y=\"186\" font-size=\"10\" text-anchor=\"middle\" fill=\"#7a4a3d\">千</text>\n  <rect x=\"290\" y=\"170\" width=\"42\" height=\"80\" fill=\"#c46b5d\" opacity=\"0.85\"/><text x=\"311\" y=\"166\" font-size=\"10\" text-anchor=\"middle\" fill=\"#7a4a3d\">十千</text>\n  <rect x=\"348\" y=\"150\" width=\"42\" height=\"100\" fill=\"#c46b5d\" opacity=\"0.85\"/><text x=\"369\" y=\"146\" font-size=\"10\" text-anchor=\ añjuśrī* 妙德·不动智之妙用 | `T10n0279`／`T1735` |\n| 覺首…賢首（十首菩萨） | 十大菩萨·次品问主 | `T10n0279` |\n| 不動智佛 等十佛 | 十世界本所事佛（金色—觀察） | `T10n0279`（六十名异·§6.1） |\n| 澄观 | 唐·清凉山大华严寺沙门 | `T1735`／`T1736` |\n| 法藏 | 唐·魏国西寺沙门 | `T1733` |\n| 智俨 | 唐·终南山至相寺沙门（华严二祖） | `T1732` |\n| 慧苑 | 唐·大薦福寺沙门 | X0221 |\n| 李通玄 | 唐·李通玄 | `T1739` |\n\n### 附录二：名相表\n（见 §4.7）\n\n### 附录三：经文要句\n- 放光总标：「爾時,世尊從兩足輪下放百億光明,照此三千大千世界」（§2.1）\n- 反显句眼：「若有見正覺,解脫離諸漏,不著一切世,彼非證道眼」（§2.2）\n- 一多颂：「一中解無量,無量中解一,了彼互生起,當成無所畏」（§2.2）\n- 信行之偈：「意常信樂佛,其心不退轉,親近諸如來,如是業應作」（§2.6）\n- 结广数：「如是無數無量、無邊無等、不可數、不可稱、不可思、不可量、不可說,盡法界、虛空界、所有世界」（§2.11）\n- 末颂：「譬如空中無量剎,無來無去遍十方,生成滅壞無所依,佛遍虛空亦如是。」（§2.11）\n（〔L.187 本批〕十段十偈**全文已入 §2.3–2.12**·复核件 `_e9_dump.txt`／`_e9_stats.py`；旧重核件 `_p9_body80.txt` 仍有效·两口径一致）\n\n### 附录四：注疏引文汇\n（§5.1–§5.3′ 各家摘引·皆注经号与归一化字符位锚）\n\n**〔L.187 本批·达标基线补全〕澄观《华严经疏》卷十三「光明覺品第九」本科段全文照录**（`T1735` raw @157264–167292·CJK-only 坐标回映切片·分页符 `<<<PAGE>>>` 行剔除·余照原档分行排段不转写不断句·U+2E80 康熙部首原字形保留·本附录在 §二 审计区外不污引文审计）：\n\n**甲·五门・来意十义**\n\n> 光明覺品第九 解此⼀品略以五⾨。初來意中⾃有其⼗。⼀為答前所依果問故。然古 德對前⼆品已答⼆問。此品正答三問。謂⻑⾏放光答佛威德。⾒成正\n\n> 覺答成菩提。文殊說偈正答佛法性問。今更⼀解。謂⻑⾏但現相答。 已如前說。偈中具答三問謂初五答菩提。次⼀答威德。後四答法性。\n\n> ⼆為廣名號品總標多端故。正廣種種觀察是意業故。三者即說⼗信之 體性故。如下三會將說正位。皆有偈讚此其類也。四顯實遍故。但所\n\n> 說有⼆。⼀佛⼆法。佛有⼆。⼀⾝⼆名。法亦有⼆。⼀權⼆實。前但 佛名遍此顯⾝遍。四諦即實之權遍。此品顯即權之實遍故。五現驗\n\n> 故。上⼆云遍眾未⽬覩。今光⽰遍相故。六顯總遍故。前但名諦別 遍。今此⼀會即遍法界。⼀⼀皆悉同時同處同眾同說同遍故。七顯圓\n\n> 遍故。謂前顯差別。⼀切⽅能遍⼀切。今顯無差別。⼀切即圓融遍⼀ 切故。八與下經為其則故。謂下結經通云。遍⼀切者。皆如此辨以如\n\n> 來⼀乘圓教。於須彌⼭等⼀類世界。施化分⿑皆若此故。九⽰前神通 相故。上云現通。如何現耶。⼀會不動遍法界故。⼗為顯理事俱無障\n\n> 礙。令捨執從法故。此意雖通在文遍顯。有上諸義故此品來也\n\n**乙·释名（开合・涅槃经引）・宗趣**\n\n> 第⼆ 釋者名。⼀開⼆合。初開者。光明體也。覺者。⽤也。此⼆各⼆。謂\n\n> 光有⾝智⼆光。覺有覺知覺悟。⼜光有能照所照。覺有能覺所覺。如 來放⾝光照事法界。令菩薩覺知⾒事無礙。文殊演智光雙照事理。令\n\n> 眾覺悟法之性相。⼆合者。良以事理俱融唯⼀無礙境。故得⼀事即遍 無邊。⽽不壞本相。⾝智無⼆。唯⼀無礙光故。涅槃經瑠璃光菩薩處\n\n> 云。光明者。名為智慧。知悟不殊。唯⼀平等覺悟之⼼。知無事非理 故。⼜此⼆光不異覺境。此三圓融唯無礙之法界。雖平等絕相不壞光\n\n> 明之覺。品中辨此故以為名。若從開釋。光明之覺光明有覺之⽤。通 依主有財。若從合說。光明即覺可持業也。第三宗趣者。以⾝智⼆光\n\n> 無礙覺悟為宗。令物⽣信為趣。⼜釋名並是品宗來意盡為意趣\n\n**丙·解疑妨・足轮放光四义・数法三释・二十六节一放顿照・十段依答文三・长行疏（至「說此頌言」）**\n\n> 第四 解疑妨。問此⾜輪光何時放耶。若說名諦意如何。佛剎菩薩眾數並同\n\n> 名號。如前已放前何不說。答是前名號品放。但前⼆品明文殊此會說 法不俟光照。今辨百億剎中。乃⾄遍法界說故。須光以顯⽰其所來。\n\n> 菩薩即前菩薩。故並全同。次有妨云。光照百億百億何不照此釋云。 此為主故。若彼為主則說彼照。⼜疑云。下光既窮法界。⾦⾊更在何\n\n> 許。當剎當剎有本會處。皆去⼗剎主伴遍故。第五釋文。⼤分為⼆。 初如來放光。⼆照此下。光⾄分⿑今初。⾜下放者。表信四義。⼀⾃\n\n> 下⽽上信最初故。⼆最卑微故。三為⾏本故。智度論第九云。⾜下放 光者。⾝得住處皆由於⾜。四顯信該果海已滿⾜故。輪義亦然。圓無\n\n> 缺故。⾔百億光者。以遍法界所照之剎皆百億故。第⼆光⾄分⿑者。 此中光照⼤數約其現文。且有⼆⼗六節。前九別名。後⼗七同辨。即\n\n> 為⼗段。若據實義應有等法界無盡之節。節節有偈。中上本經必應廣 說。然非多度放光。亦非⼀度放光。次第照於多節。唯⼀放光。同時\n\n> 頓照盡空世界。但為⾔不並彰說有前後。隨機⼼現節節各⾒。則如來 光明節節⽽照。⾦⾊文殊節節⽽⾄。乃⾄法界各⾒亦爾。在佛文殊節\n\n> 節皆遍。如⽉普照百川各⾒。若法界機頓⾒。前來諸類所⾒信會既 爾。住⾏等會同遍亦然。⼗段之中文各有⼆。皆⻑⾏。佛以⾝光照現\n\n> 事境。令眾⽬覩。偈頌文殊智光讚述事理。令眾悟入。⼗段依答文 三。初五答菩提即分為五。初⼀總顯菩提超情。⼆通顯菩提因果。三\n\n> 顯八相菩提。四顯菩提體性。五體菩提之因。今初⻑⾏中⼆。先照本 界染淨。⼆如此處下。現⾃法會普遍之相。前中三。初總標分⿑。⼆\n\n> 百億閻浮下。別顯所照。三其中下。類結明顯。今初⾔三千⼤千者。 俱舍論云。四⼤洲⽇⽉蘇迷盧欲天梵世各⼀千。名⼀⼩千界。此⼩千\n\n> 千倍說名⼀中千。此千倍⼤千。皆同⼀成壞。梵世謂即初禪。故云同 ⼀成壞。以三度積故⽈三千。略去⼩中舉其末後。故云⼤千。⻑阿含\n\n> ⼗八。雜阿含⼗六。正理三⼗⼀。及瑜伽智論雜集顯揚。亦不殊此。 有云然顯揚第⼀明三千世界三災所壞。故知初禪⼩千。⼆禪中千。三\n\n> 禪⼤千。若⾦光明直⾄非想。皆云百億意在遍諸天。故此經文中。但 ⾄⾊頂約無⾊無處故。今依⼆經。⼆別顯所照中。初現⼈中。⼆現八\n\n> 相。三現諸天。初中閻浮提者。新云贍部。俱舍云。阿耨達池岸有樹 名贍部。因以名洲。提者。此云洲也。東弗婆提者。此云勝⾝。⾝勝\n\n> 餘洲故。⻄衢耶尼。此云⽜貨。以⽜貨易故。北欝單越。此云勝⽣。 以定壽千歲衣食⾃然故。⼤海者。即外鹹海也。百億輪圍者。⼀四天\n\n> 下⼀⼩鐵圍故。中者有千。⼤者唯⼀。皆云百億者。此⽅黃帝算法數 有三等。謂上中下。下等數法⼗⼗變之。中等百百變之。上等倍倍變\n\n> 之。今此三千。若以⼩數計有萬億。今約中數。從千已上百百變之。 則有百億。故唐三藏譯為百億俱胝。測公深密記第六云。俱胝相傳釋\n\n> 有三種。⼀者⼗萬。⼆者百萬。三者千萬。由此三千以俱胝數。或⾄ 百數。或⾄千數。或⾄百千。唐三藏譯是千萬也。故⾄百數。⼜依俱\n\n> 舍譯洛叉為億。此譯俱胝為億故。下光照⼀億⼗億等。梵本皆云俱 胝。總由俱胝之數不同故也。⼆現八相中文有五相受⽣含三。佛成道\n\n> 後始放光明。却現初⽣及後涅槃者。約微細⾨融三世故。亦非能照是 報所照是化。以放光⾝在摩竭故。此經報化融故。⼤菩薩等化處⾒\n\n> 報。下位之機報處⾒化。⼆不並故。能照所照唯是⼀佛。顯佛⾃在超 思議故。三百億須彌下。現諸天中舉須彌者。⼆天所依故。⼆現⾃法\n\n> 會中⼆。先現本會。此是⼀會遍⼀切處。非是多處各別有會。乃⾄法 界亦如是遍。此圓融法非思之境。⼆悉以佛神⼒下。現新集眾。⾔佛\n\n> 神⼒者。亦即是前各隨其類現神通也。文有四段謂總顯列名。剎號佛 名皆同名號品中。但增百億為異⽿。偈文分⼆。先彰說⼈後顯偈辭。\n\n> 今初\n\n**丁·一切处文殊三义・第一偈颂疏（菩提超情・十偈各义・一多相容门）**\n\n> ⾔⼀切處文殊者。略申三義。⼀約當節。如初節中。百億佛前 有百億文殊。為⼀切也。各各皆說當節之偈。故文皆云各於佛所。⼆\n\n> ⼀文殊從⼀處東來。即從⼀切處東來。⾄⼀法會。即⾄⼀切法會故。 雖東來⽽即⼀切處。以是法界即體之⽤⾝故。三約表法。文殊乃是不\n\n> 動智之妙⽤。觸境斯了。六根三業盡是文殊。實相體周萬像森羅無非 般若。何有⼀處非文殊哉。下九節中皆有⼆段。倣此可知。⼆正顯偈\n\n> 辭。然釋此偈有通有別。通者此明菩提超情。別謂顯前光中所⾒之 事。於中⼜⼆。⼀約境。謂融前所照顯理法故。⼆約觀。謂令⼤眾泯\n\n> 絕諸⾒。於所照事不⽣執取。然觀資理成理由觀顯故。通⽽釋之。即 明菩提超情。⼤分為⼆。初⼀反顯餘九順釋。今初。反顯違理之失。\n\n> 謂菩提體德超絕⼀切。佛地論明佛非漏非無漏。亦應於世非著非無 著。今乃⾒佛。內離諸漏外不著世。則有漏可離有世不著。取捨未亡\n\n> 此⾒違理。故非道眼。證道眼者。無分別故。餘偈順顯⾒理之益。皆 上三句觀相。下句觀益。於中九偈各是⼀義。且分為四。初六觀佛。\n\n> 次⼀趣求。次⼀觀⽣。後⼀了法。初中初偈正顯佛菩提性本來⾃空。 稱此⽽知則無上失。體謂真性。相謂德相。並性無所有竟何所離。本\n\n> 無有著誰為無著。如是知者。名為正解。修習明了斯為正⾏。下句觀 益。⾔疾作佛者約文殊⾨情盡理現。即名作佛。約普賢⾨信終圓收。\n\n> 約⾏布說則不⾒此理。成佛未期他皆倣此。次⼀偈依正等。觀佛菩提 性依正無⼆故。亦顯光所照處以明離⾒。謂上半於前所⾒世界。令離\n\n> 妄動。知真法界不應動故。次句例前八相。佛⾝亦同。平等不動⽽了 故。成勝智。次偈佛法等觀了同體故。⼆念豈⽣⼀亦不存。得難思\n\n> 果。次偈⽣佛等觀⾔⾝即眾⽣。以梵本中云佛及我故。我即⾏⼈之⾝ 稱理普周。云平等住。平等則無能所故⽈無住。我即法性。更不證入\n\n> 法性無性。復何所入。如是知者曠世難逢故。般若文殊分云。若知我 性即知無法。若知無法即無境界。若無境界即無所依。若無所依即無\n\n> 所住也。⼜本會即住無所住。新集則入無所入。問若皆平等。云何分 別有三寶耶。智論答云。平等即是三寶。謂平等即法寶。法寶即是佛\n\n> 以未得法不名佛故。得平等法。分別有須菩提等。次偈會通平等。謂 上來主伴依正不離五蘊。五蘊性空即是平等。有相差別總名為數。即\n\n> 同無為故非數法。離數超世成寂靜果。次偈拂上出世。謂真出世者。 超越入出不礙照知。故成光耀⼜上第三偈佛即是法。第四偈法即是\n\n> 眾。第五偈明是三寶皆無為相。此偈與虛空等。⼆有⼀偈。趣求者。 以上雖離⾒⽽知。猶恐帶寂故。上半勸求。次句⼜觀性離。謂了迴向\n\n> ⼼本⾃不⽣。是離相迴向也。離相求佛得名稱果。三次⼀偈。所⾒眾 ⽣亦皆稱真。故無⽣壞知無眾⽣。是無上道故。下經云。無上摩訶薩\n\n> 遠離眾⽣想。末後⼀偈知法。即成前法會周遍所由。上半標⾨。即⼗ ⽞⾨中。⼀多相容不同⾨也。次⼀句釋所由。即⼗種所由中緣起相由\n\n> ⾨也。並如義分⿑中。謂⼀與多互相⽣起。且⼀依多起。則⼀是所起 ⽽無⼒也。多是能起故有⼒也。以多有⼒能攝⼀。以⼀無⼒。入於\n\n> 多。是故此⼀恒在多中。多依⼀起準上知之。是則此多恒在⼀中也。 以俱有⼒及俱無⼒。各不並故。無彼不相在也。以⼀有⼒⼀無⼒不相\n\n> 違故。有此恒相在也。緣起法界理數常爾。稱斯⽽⾒何所畏哉。由此 緣起成前平等。由前平等成此緣起。文理昭然不許事事無礙。恐未著\n\n> 深思。第⼆重光照⼗⽅各⼗佛⼟者。是娑婆隣次之⼗剎也⼗偈通顯菩 提因果。分三。初偈菩提之因。次五菩提果⽤。後四令物思⿑。今初\n\n> 上半所為。謂無明造業愛能潤業。故⽣死無窮。如泥中刺不覺其傷。 如瘡中刺為其所毒。下半能為。即從癡有愛。菩薩悲⽣非⼤菩提莫之\n\n> 能拔。無此悲智非佛法故。次五菩提果⽤中。初偈悲智雙滿。智⾒諸 法悲以轉授。普⾒通於性相故。離⼆邊謂真故無有俗故無無。真故無\n\n> 有則雖無⽽有。俗故無無則雖有⽽無。雖有⽽無則不累於有。雖無⽽ 有則不滯於無。不滯於無則斷滅⾒息。不存於有則常著氷消。俱不俱\n\n> 等何由⽽有。諸邊都寂故云皆離。次⼀美往因⾏。次⼀慈⼒降魔。次 ⼀智斷致⽤。後⼀法⿎警機文相並顯。後四令物思⿑者。斯即佛因。\n\n> 能如是⾏得諸佛道。四偈顯四種⾏。⼀游剎無著。謂不壞其相故能普 游。了剎性空故於有無著。⼆念佛⽣喜。上半所念法⾝顯故。如空永\n\n> 常。解脫累亡如空清淨。下半能念憶持明記。故喜⽣願⾜。三亡苦濟 物。四護法輕⾝文並可知。第三重光照百界。偈中顯佛八相菩提。⼗\n\n> 偈分⼆。初偈標德充滿。後九別廣調⽣。今初。謂了俗即真故。如幻 本虛真不礙俗。故達諸法相性相無礙。是真通達。無⼆礙著則轉依⼼\n\n> 淨。⼤悲同體故。調伏眾⽣則三德備矣。故能攝化。後九中即悲願⾃ 在調伏普周。雖數越塵沙略。論其九。皆⾔或⾒者。然有多義。⼀或\n\n> 多機異處各感⾒。⼆或同處。各⾒。三或異時別⾒。四或同時異⾒。 五或同時異處⾒。六或同處異時⾒。七或異時異處⾒。八或同時同處\n\n> ⾒。九或⼀⼈於同異交互時處。⾒多⼈所⾒。⼗或⼀⼈於同異俱時 處。⾒⼀切⼈所⾒。以是普眼機故。然佛不分⾝無思普現也。⼀初⽣\n\n> 時⾝如夜⽉皎鏡可觀智猶滿⽉清涼照物。故云永作。⼆⾏七步時顯其 具德。三顧眄時觀⽅現笑。四師⼦吼時說我獨尊。五出家時解縛修寂\n\n> 六坐道場時障盡德圓。七轉法輪時因悲度物。八顯神道時調彼難調。 九⽰入涅槃不妨神⽤。⼜下⼆句亦總結前九。皆是神通並有深意。如\n\n> 第八會。第四重光照千界。頌中顯菩提體性。⼗頌分三。初偈雙具悲 智為菩提體。次四三德內圓。後五即體悲⽤。今初上半智深下。半悲\n\n> 濟。次四偈中⼀歎菩提永絕。⼆我德。謂⼆我之⾒必因於⾝。今觀於 ⾝若我即陰。我即⽣滅。若我異陰以何相知。故但妄情曾未暫有。既\n\n> 無有我誰是我所。我我所空⾝從何有。無⾝之⾝顯法⾝德。⼆顯解脫 般若德。涅槃⼆⼗五云。貪瞋癡⼼永斷滅故⼼善解脫。於⼀切法知無\n\n> 障礙。故慧善解脫。涅槃略有⼀百八句。以顯深廣。⾔明⾏者。即般 若德。若作明⾏⾜釋即禪慧德。瑜伽三⼗八云。明謂三明。⾏諸⽌觀\n\n> ⼆品。涅槃⼗六⼜云。明者三明。⼀菩薩明。⼆佛明。三無明明。菩 薩明者。即是般若波羅蜜。佛明者。即是佛眼。無明明者。即畢竟\n\n> 空。然皆般若因果理智異⽿。⾜有⼆義⼀脚⾜義約因。⼆圓⾜義約 果。此文略無。無數下。顯其離過非有為故。無數超下位故。無等豈\n\n> 是因明能求其過。因明立量依世俗分別定有定無。故⽈世間。今體絕 有無。故彼莫能過也。如說佛聲非定有故。不同外道立常。從法性⽣\n\n> 離造作故。不同菩薩所立無常。三科皆爾。豈將佛德判屬無常。諸因 量者。謂諸因諸量。及⾃他共等三種比量。比量雖有三⽀。五分因是\n\n> 量主故⽈因量。三⼀偈歎佛超絕三科德。蘊者聚義。謂是有為⽣死果 相。界者種族義。謂是愛著⽣死因相。處者⽣⾨義。謂諸識內外緣\n\n> 相。然不離⾊⼼。俱舍論云。愚根樂三故說蘊處界三。蘊等有⼆。⼀ 者有漏是世數法佛非此成。⼆是無漏則佛非無因。滅無常⾊等獲常⾊\n\n> 等故。如來妙⾊常安隱故。四歎佛超離根境德。境智雙寂契彼性空。 根塵兩亡內外解脫。亦常照內外脫於無知。空尚不存妄從何起。⼜上\n\n> 四偈初⼀法⾝故常⼆無過故樂。三數不能成。故⾃在稱我。四解脫故 淨。後五即體悲⽤中。初偈不動普應德。上半不動下半普應。⼆我永\n\n> 亡稱性不動。智周法界何有去來。次偈動寂無⼆德。三句入寂⼀句起 ⽤。⼀相是表所謂無相。無⼆是遮體不可分。⼜無⼆者。非對有說無\n\n> 也。觀無始終故⼼不增減。三輪之化云無量神⼒。次偈。無染了機。 次偈度⼼平等。後偈無⽣現⽣智契非有。悲⼼遍⽣隨機引之。令歸常\n\n> 寂。第五重光照⼗千界。頌中明等菩提因⾏文有⼗⾏。皆三句辨相。 ⼀句勸修。雖皆作業⽽展轉深細略分為五初⼀⼤悲下。救業不求⾃\n\n> 利。故云永出⼈天。次四修智上攀業。⼀信⼆樂三念四學。⼜初⼀⻑ 時修常信不轉故。次⼀殷重修志樂不退故。清涼慧者。無惑熱故。次\n\n> 偈無間修不暫斷故。後偈無餘修常遍學故。三有⼀偈。內照業觀。⾝ 實相者。如淨名觀佛前際不來等。⼜如法華不顛倒等。中論法品云。\n\n> 諸法實相者。⼼⾏⾔語斷無⽣亦無滅。寂滅如涅槃即上半也。⼜云。 諸佛或說我或說於無我。諸法實相中無我無非我。即下半也。⼜離我\n\n> 者。超凡夫。離無我者。超⼆乘故能悲濟。然我無我通有四句。⼀唯 有我。⼆唯無我。三者雙辨。即⽣死無我涅槃有我。四雙非上⼆互形\n\n> 奪故。四⼀偈等觀業。⼤悲同體所以等觀。⾒真息妄不起分別。妄盡 契如名入真實。五後三偈⼤⽤業。初偈神⾜通。後⼆法智通。於中初\n\n> ⼀知⼟。法性⼟為非⾊。餘皆為⾊。此⼆融即皆悉委知。後⼀知佛。 ⼜⼗展轉者。初悲欲救⽣當云何救。信樂近佛。樂其何法。樂佛功\n\n> 德。佛以功德成其⾝故。空樂何益。當念念修學。學他不如⾃觀。⾃ 觀不及物我⿑致。入真滯寂當起⼤⽤。⽤何所為當擬。窮⼗⽅界入諸\n\n> 佛海\n\n**戊·T6 威德问答颂疏（前五法身后五智身）**\n\n> 第六重照百千界。即第⼆答佛威德問。威德約⾝故。前五法⾝ 後五智⾝。前中分⼆。初⼀揀迷。謂以威德則⾃在熾盛。⾊相則端嚴\n\n> 吉祥。種族則名稱尊貴。雖是薄伽⽽⾒從外來。取相乖於最勝故。為 倒⾒猶眼有病故。⾒外空華執內為外。謂空為有。後四⽰悟顯最勝\n\n> 法。初偈明如來⾊相無邊故。起情莫測。無邊有⼆。⼀深故隨⼀⼀相 稱真無邊。⼆廣故。謂具⼗蓮華藏塵數之相。次偈釋上⼆義。前半釋\n\n> 深相。即無相故。後半釋廣無相之相故。廣復有⼆。⼀無限因成。⼆ 應機普現。謂⾊無定⾊。若⾦剛之合朱紫形無定形。猶光影之任修短\n\n> 相無定相。似明鏡之對妍媸故隨樂皆⾒。三⼀偈明所證超情。以成前 義。前半正顯。謂欲⾔其有體相寂滅。欲⾔其無⾊相無邊。故⽌⾔顯\n\n> 妙唯智⽅契故。⼼慮叵量理圓⾔偏故。⾔說莫及。後半重釋。謂應緣 非不合。住體非和合。⼜緣起修成非不合。契真相盡非和合。⼜緣即\n\n> 非緣故非和合。非緣即緣故非不合。合相離故無諸相非合亦離體寂滅 也。四有⼀偈明能證超絕。結歸佛⾝。上來體性寂滅遣有。⾝相具⾜\n\n> 遣無。非合不合遣俱有無。⽽復謂佛是非有非無。還成戲論。中論 云。戲論破慧眼是皆不⾒佛。故次遣之。謂妄惑不⽣故非蘊聚。起⼼\n\n> 則⽣便成戲論。決定⾒者。不隨境相名⾃在⼒。有無不能累其神。故 無畏也。非⾔⾏處為絕⾔道。後五智⾝中。初知解脫智。謂外⾝非業\n\n> 繫。內⼼無取著。為皆解脫。常契等理故云正念。⼜內脫⼆障外⽤無 羇。此明⾃住。下四⼤⽤⾃在展轉相釋。初⼀以寂照智利⽣。意淨寂\n\n> 也。光明照也。淨故無著。明故智周。故能⼤作佛事。次⼀云何利 ⽣。謂變化智⾃在。上半⼀多無礙。下半隨器普現。次偈明⼀多所\n\n> 從。以無⽣智隨物⽽感。謂⼀⾝多⾝但由眾⽣分別⼼起故。無積無從 其猶並安千器數步⽽千⽉不同。⼀道澄江萬⾥⽽⼀⽉孤映。情隔則法\n\n> ⾝成異。⼼通⽽⽞旨必均。云云⾃他於佛何預。後偈復拂前迹。謂即 前分別之器。亦無所有。妄⾒之⾝。豈當可得。此法是佛所知當依此\n\n> 理⾒佛。此後⼆句兼通結上\n\n**己·T7 法性问答頌疏（内外包摄・一多四义十义）**\n\n> 第七重光照⼗⽅百萬世界。此下四段答 法性問。佛以功德為法性故。即分為四。初⼀總顯內外包攝德。⼆⽅\n\n> 便幹能德。三⼤悲救攝德。四因果圓遍德。今初。偈中分⼆。前五歎 佛法難思。後五⽰入⽅便。今初分三。初三直就佛明。次⼀對機以\n\n> 辨。後⼀約法以明。今初。初⼀句所緣。及⼀切種智清淨。於所緣所 知中。無礙智⾃在轉故。次句所依清淨。煩惱習氣永無餘故。三⼀切\n\n> 種⼼清淨。⼀切善根皆積集故。四具⼤悲故。五無憂喜之離染安住捨 故。故無所著。六惡想都絕不依⽌名聞利養故。七八⼆句。體雖叵量\n\n> 具相好故稱歎。九智光遍覺離倒名淨。⾝光可知⼗永害習氣故。⼗⼀ 住正念故。離邊常明記故不動。亦是成上智光所觀故。結云佛智。⼜\n\n> 此⼀偈即四無所畏。光明即正覺。清淨即出苦。滌累漏盡及與障道無 畏。不動即無畏之義。外難不能傾故。不墮勝負⼆邊故。是無畏智。\n\n> ⼆⼀偈對機以辨中。⾝⼼離分別者。含於⼆意。⼀約佛。以三業隨智 慧⾏等故。⼆約機。即知上功德。⽽能⾝⼼無分別者。則得無疑無滯\n\n> 益。三有⼀偈約法以顯。雖法界遍轉。無性寂滅故無所轉。假以⾔宣 云⽅便說。其能轉智即⼗⼒智。後五⽰入⽅便者。上來說佛不離功德\n\n> 菩提。上所說法。不離教義次第令入。初偈令念菩提。初句善決性 相。次⼆句契理絕想。以⽣分別想即戲論故。具斯⼆義為念菩提故。\n\n> ⼤般若云。覺法⾃性離諸分別同菩提故。⼜⼼絕動搖⾔亡戲論。⼜瑜 伽九⼗五有六種戲論故名為諸。次偈隨教。上⼆句了法亡⾔。次句得\n\n> 旨⽅名隨順。次偈入佛功德。上⼆句雙存⼀多相別故。次句雙泯相形 奪故。⼀因於多有多中應有⼀。多因於⼀有。⼀中應有多。今多中無\n\n> ⼀⼀無從矣。⼀中無多多無從矣。故⼆俱捨也。⽽性相融通入⼀即是 入多。名普入也。然⼀多相依互為本末。通有四義。⼀相成義。則⼀\n\n> 多俱立。以互相持有⼒俱存也。即初⼆句⼆相害義。形奪兩亡以相依 故各無性也。即⼆俱捨是。三互存義。以此持彼不壞彼⽽在此。彼持\n\n> 此亦爾。故上文云。⼀中解無量等是。四互泯義。以此持彼彼相盡⽽ 唯此。以彼持此此相盡⽽唯彼故。下文云。知⼀即多多復即⼀是也。\n\n> 諸文各據⼀義。故不相違矣。復總收之以為⼗義。⼀孤標獨立。⼆雙 現同時。三兩相俱亡四⾃在無礙。五去來不動六無⼒相持。七彼此無\n\n> 知。八⼒⽤交徹。九⾃性非有。⼗究竟離⾔。次偈入佛菩提依正皆 寂。故無所依智契於斯。故無分別。後偈知法義上。明⽣⼟皆寂不可\n\n> ⾔異。依正兩殊不可云⼀\n\n**庚·T8 十种方便力頌疏**\n\n> 第八重光照⼀億界。前云百萬。今⼗倍於 前。即千萬為⼀億也。⼗偈歎佛權實雙⾏⽅便幹能。然⽅便之⾔略有\n\n> 三意。⼀以因中⼗種加⾏⽅便之⼒。修成佛果⾃在之德。⼆但是差別 之⽤皆名⽅便。其無礙慧無若⼲故。三即實之權起⽤⾃在。故名⽅\n\n> 便。今文具三。皆三句辨相。⼀句結名。初偈即禮起⽤為⽅便。然有 六義。⼀智超下位。⼆證法無邊。三解脫有海。四具上三義到涅槃\n\n> 岸。五壽兼真應。六⾝光無涯皆佛功德。⼆歎寂照⽅便。初句橫照。 次句竪窮。次句即寂照⽽無思。故難思也。三歎佛事理無礙⽅便。初\n\n> ⼆句有無無礙。次⼀句定散無礙。四歎佛修無修⽅便。初句善窮性 相。次句無念勤修樂於解脫。釋修涅槃。離不平者。釋前正念。以不\n\n> ⾒⽣死為雜染。涅槃為清淨。此⼆無差為真寂滅。五歎迴向⽅便。初 ⼆句趣如法界。是迴向實際。餘皆迴向菩提。次句迴向眾⽣。住如化\n\n> 物故為⽅便。六證知⽅便。初句隨順證入。次句知⽽無障。次句知遍 趣⾏即利⽣法。即知即證為⾃在修也。七寂⽤⽅便。初句寂。次句\n\n> ⽤。次句寂⽤無礙。為無住涅槃。凡⼩難到。八時數⽅便可知。九難 思⽅便。初句了⽣滅。剎那⼀期皆悉了知。次⼗⼀字了相即眾⽣體。\n\n> 不出三界九地。下⼆界是⾊。無⾊界非⾊。⼆界八地皆名為想。無想 天為非想。有頂非想非非想。悉了知者。能了兼了其性即是無⽣。此\n\n> 是無邊之境故難思也。上⼆偈但了差別即是⽅便。⼗無比⽅便。初⼆ 句知相。上句竪窮下句橫攝。次句知性此⼆不⼆故。無比即為⽅便\n\n> 也\n\n**辛·T9 大悲救摄頌疏（師子吼六决定说・欲海五难）**\n\n> 第九重光照⼗億界。歎佛⼤悲救⽣德。⼗偈多以第四句為結。於 中分三。初偈總標⾏海已圓⽽能普化。次八別顯化類不同。後⼀總結\n\n> 悲智周遍。初中初句無餘修。廣謂遍受⼤謂極苦。次句⻑時無間。次 句功⾏已圓。極惡難度已能度故。云何能度。謂師⼦吼。師⼦吼者。\n\n> 名決定說。定說⼀切眾⽣皆有佛性。度⼀闡提。定說無我度諸外道。 定說欲苦不淨。以度波旬。定說如來常樂我淨。度諸聲聞。定說⼤悲\n\n> 以度緣覺。定說如來無礙⼤智。以度菩薩。故云普化眾⽣次八別中云 何普化。初化癡愛眾⽣。前半所救。如⼈墮海五事難出。⼀⽔深。⼆\n\n> 波迅。三迷闇。四蟲執。五憂迫失⼒。眾⽣欲海流轉亦爾。此中愛有 ⼆義。⼀已得無厭深廣如海。⼆於未得處無⾜如流。癡亦⼆義。⼀迷\n\n> 不⾒過。⼆妄⾒有德。結網⾃纏。五由前癡愛招⼤憂苦。次句舉古佛 已⾏。亡⾝為物故⽈⾄⼈。後句立誓當作。⼆度著欲眾⽣。上半所\n\n> 救。放逸者。著欲緣也。著五欲欲事也。不實分別欲因也。受眾苦欲 果也。未得已失皆受⼤苦。正得亦苦橫⽣樂想。況當受三塗故云眾\n\n> 苦。次句受教⾃修。後句立誓轉化。三救著我眾⽣。前半所救著我為 因受⽣死果。未證無我浩無邊際。次句救⽅。說⼆無我唯佛有之。四\n\n> 救惡趣眾⽣。三句所救。謂無善可恃。顯唯惡業及惑病因招三惡趣。 展轉復起三毒之過。因果俱燒末句救⽅。但淨其⼼因亡果喪。五救邪\n\n> ⾒眾⽣。前半所救。上句明因迷四真諦。惑現境故。次句起⾒。邪⾒ 翳理即為闇宅。後半能救之⽅。六救著有眾⽣。前半所救。三有深廣\n\n> 總喻於海。漂⾄⼈天還溺惡趣。未遇如來多成難處。希求不已故名為 憂。未有對治故無涯畔。具上諸失故不可處。後半能救可知。七救無\n\n> 明眾⽣。前半所救。由本住無明故。不⾒無住之本。迷理惑事狂⾛於 ⽣死之中。後半能救。佛既授法正念即升也。八救險道眾⽣。前半所\n\n> 救。⼈天報危臨墮惡趣。名為險道。能救可知。後⼀偈總結者。前半 結有教證之智。能導無緣之悲。次句結有同體之悲。能遍⼗⽅六道。\n\n> 後句結於所救不越群迷\n\n**壬·T10 因果圆遍頌疏（十七数・刹空四义・结经句）**\n\n> 第⼗重光照⼗⽅。總結無盡。⻑⾏分⼆。先 明世界數量。略有⼗七漸窮法界。後明彼諸世界所有皆現。⼗頌明因\n\n> 果圓遍德。於中分⼆。前四⽰佛因果遍說。後六勸物順⾏。今初。初 ⼀偈因圓果滿。彰有說因。初三句三達因圓。後句⼗⼒果滿。次⼀偈\n\n> ⼤⽤外彰。正明說法周遍可知。後⼆對因辨果。初⼀偈遍因初可為 因。三句皆果法供養佛故於法順知。普為眾⽣故。能遍⽤。斯即等流\n\n> 名相似果。晉經云。正⼼供養。明是法供養也。後⼀偈深因故能速 證。初⼆句六度⾃利。謂供佛是檀意。柔兼戒。從初⾄末是進策也。\n\n> 次句利他兼⽅便等。⼆⾏既圓則佛果朝夕。故云速成。後六偈觀物順 ⾏。佛昔如是⾏今得說法果令物⾏之亦得斯果初⼀偈求法⾏。⼆說法\n\n> ⾏。三聽法⾏。四有三偈破相⾏今初。初句離過。勝他名利名為異 情。次⼆句顯德。⼀句滿福。⼀句圓智。⼜無異者。於⼀切法都無所\n\n> 求。若此之求則⾒真法⾝也。⼆說法⾏。前半說法益物。義利者。令 眾⽣得離惡攝善故。此世他世益故。世出世益故。福德智慧益故。上\n\n> 四對皆先義後利。後半若無說無⽰同佛說也。三聽法⾏兼顯法輪之 體。初句教法。次句即教成⾏。無有⼀文⼀法非菩提因。豈⽌三⼗七\n\n> 品。次句悟理揀去隨文。後句理無廢興。故常⾒佛果也。後三破相 ⾏。初⼀正明後⼆轉釋今初。初三句。反顯⾦容煥⽬⽽非形。安可以\n\n> 相取。後句正顯法性超乎視聽。唯可虛⼰⽽求。後⼆轉釋云何不⾒。 前偈以妄喻真。眾⽣妄惑尚不可窮。諸佛契真如何⾒盡。後偈復轉\n\n> 釋。云雖遍⼗⽅不可定取。如剎遍空有其四義。⼀多剎滿空。⼆體無 來去。三不妨成壞。四無別所依。佛⾝遍空亦具四義。⼀頓遍多剎。\n\n> ⼆恒不去來。三應有出沒。四體⽤無依。是故佛⾝亦不可以遍空⽽取 ⽿\n\n### 附录五：对读简表\n（见 §6.1 表〔一〕–〔五〕、§6.3）\n\n### 附录六：存疑清单\n| # | 项目 | 状态 |\n|---|------|------|\n| 1 | 八十十世界列名第六「金色世界」重出之由（传写涉第一同名／梵本别传） | 〔待核·底本自歧不改·§1.5/§6.4#1〕 |\n| 2 | 品界锚串鉴别（初稿「征引/连读假串」说） | 〔已闭 2026-10-25·L.182 复验订正：修正平 （六十） | The Chapter on the Tathāgata's Light and Awakening | — | 六十品题直证·冠「如来」 |\n| 光明網（慧苑梵本题名） | net of light | *rośnī-jāla*〔拟·待核〕 | X0221「如來光明網能覺悟品」 |\n| 身智二光 | the two lights — body and wisdom | — | 澄观·§5.1 |\n| 一放光同时顿照 | one emission, simultaneous all-pervasion | — | §4.2 |\n| 一切處文殊師利 | Mañjuśrī of all places | — | §4.5 |\n| 三千大千世界 | the three-thousand-fold great chiliocosm | — | 俱舍口径·§4.7 |\n| 百億／俱胝／洛叉 | billion-scale *koṭi* counts〔强译从略〕 | koṭi / lakṣa | §6.4#4〔待核〕 |\n| 那由他 | nayuta | nayuta | 八十「那由他億」／六十「億那由他」 |\n| 信为行本 | faith as the root of practice | — | 足轮放光·§4.4 |\n\n**本品要义三（EN·对应 §1.4）**\n\n1. *One light, ten tiers, the dharma-realm as measure* — the radiation from the wheel of the Buddha's feet multiplies through ten tiers to \"the farthest reaches of the dharma-realm and space-realm,\" yet it is a single, simultaneous emission: like the moon reflected in a thousand rivers.\n2. *Two lights fuse into one awakening* — the Buddha's body-light displays the scenes (assemblies, eight phases, heavens); Mañjuśrī's wisdom-light expounds their meaning; seeing without discursive grasping is the true \"eye of the path.\"\n3. *Light from the lowest place: faith* — emission from the foot-wheel marks faith as first, humble, and the ground of all practice, and as containing the fruit-ocean already; the verses answer the three petitions on bodhi, majesty and dharma-nature.\n\n**结构计数（EN）**：10 tiers × (long-form + 1 ten-verse stanza) = 10 stanzas; 23 enumerated \"hundred-billion\" objects in the first tier (§7.3; sixty adds further clauses〔§6.1〕); 4,358 CJK characters (§7.4)。\n**三业（EN）**：名号品＝body-karma · 四圣谛品＝speech-karma · **光明觉品＝mind-karma（all-pervasive awakening）**。\n\n### 附录十：图表\n- 图 〇-1 第二会三业次第图——见 §〇之二\n- 图 〇-2 十段遍照倍增图——见 §〇之二（文字卡）·**图 7-1 数据版 SVG——见 §7.5 后**〔L.187 本批〕\n- 图 〇-3 十偈义趣配段图——见 §〇之二\n- 附：**十偈义趣配段总表**（L.187 本批·数据常驻）\n\n| 偈 | 段·界 | 十颂主题（澄观科·§5.1/§2 疏解） | 结句公式 |\n|---|---|---|---|\n| 一 | T1 此界 | 菩提超情（一反显·九顺释） | 「當成…」×6·无定柱 |\n| 二 | T2 十佛土 | 菩提因果（因一·果用五·思齐四） | // ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══

// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
