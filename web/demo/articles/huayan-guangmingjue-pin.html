var ARTICLE = {"id": "huayan-guangmingjue-pin", "file": "articles/huayan-guangmingjue-pin.html", "title": "九九华严第九品 光明觉品之拼读", "title_sub": "华严经第九品·第二会·差别因果周·卷十三首品·足轮放光十段遍照倍增·一切处文殊十偈叹佛果德·三业意业遍觉·金轮放光·与六十《如来光明觉品第五》对读·注疏诸家会读（澄观·法藏·智俨·慧苑·李通玄·海云）·数据层·未完备已标明", "icon": "📖", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第二会_普光明殿_差别因果周/华严经细读_第九部_光明觉品.md", "doc_md": "# 华严经引读·第九部：光明觉品（卷十三·品九）\n\n> **EN · Close Reading of the Avataṃsaka Sūtra, Part Nine: The Chapter of Light and Awakening**\n\n> **底本**：唐·实叉难陀译《大方广佛华严经》（八十华严）`T10n0279`。**范围：卷第十三首品（本品全文，品号第九）**。本品属**第二会「普光明殿会」·差别因果周**，承第七品《如来名号品》（身业·遍应）、第八品《四圣谛品》（口业·说法遍周）而明**意业·遍觉**——如来足轮放光，十段遍照倍增，一切处文殊以偈颂叹佛果德，为十信法门之张本。\n> **立稿**：2026-10-25。承第一会六部及第二会前二部之体例与校勘纪律。\n> **本篇进度（覆盖率自陈）**：**全稿成篇**——§〇 凡例、§一 概述与品题解义、§二 全文逐段细读（序分·放光分齐·十段遍照·十偈次第）、§三 旁参与前接、§四 义理要点与名相、§五 注疏选要·诸家会读（5.1 澄观／5.2 法藏／5.2′ 智俨／5.2″ 慧苑／5.3 李通玄／5.3′ 海云／5.4 小结）、§六 文本对读与校勘（八十／六十·四十／藏译／校勘记）、§七 结构分析·数据层（7.1–7.4）、§八 附录十一类（含中英要目）、§九 台账，**皆已成**。本品六十辅读以 **STEP0 新入库 `T09n0278_juan5.txt`（L.181）** 逐字回源，六十品题直证作**《如来光明觉品第五》**；慧苑《刊定记》本品有记（X0221 卷第四·直证「光明覺品第九」段存在，解第八部台账「慧苑本品之记恐不传」之悬案）。凡未能确证者标〔待核〕、属推断者标〔本文判断〕；**不以骨架冒充细读**。\n> **原则**：沿用既定校勘纪律、三层疏解（疏解／名相／会读）、存疑必标、推断必标「〔本文判断〕」、讲者之说疑误只标不改、三译主从分明、不擅改经文、可回源可复核。**引注疏原文一律繁体照底本、逐字回源并注经号与段落；会读按语用简体。**\n\n### 〇之二、图表导览\n\n#### 图 〇-1　第二会三业次第图（身·口·意 → 光明觉居意业）\n\n<div style=\"background:rgba(94,139,158,0.04);border:1px solid var(--line, #d9cdb8);border-radius:8px;padding:16px;margin:12px 0;overflow-x:auto;\">\n<div style=\"display:flex;flex-direction:column;gap:10px;max-width:340px;\">\n<div style=\"background:linear-gradient(90deg,#e6f3ff,#f7fbff);border:1px solid #8fb3d9;border-radius:6px;padding:8px 12px;text-align:center;font-size:0.85em;\">第七品《如来名号品》<br/>身业·遍应（名号依身而立）</div>\n<div style=\"text-align:center;color:#666;\">↓</div>\n<div style=\"background:linear-gradient(90deg,#ffe6e6,#fff7f7);border:1px solid #d98f8f;border-radius:6px;padding:8px 12px;text-align:center;font-size:0.85em;\">第八品《四圣谛品》<br/>口业·说法遍周（四谛异名随乐）</div>\n<div style=\"text-align:center;color:#666;\">↓</div>\n<div style=\"background:linear-gradient(90deg,#e6ffe6,#f7fff7);border:1px solid #8fd98f;border-radius:6px;padding:8px 12px;text-align:center;font-size:0.85em;\">第九品《光明觉品》<br/>意业·遍觉（足轮放光·智光觉悟）</div>\n<div style=\"text-align:center;color:#666;\">↓</div>\n<div style=\"background:linear-gradient(90deg,#fff2e6,#fffaf7);border:1px solid #d9b38c;border-radius:6px;padding:8px 12px;text-align:center;font-size:0.85em;\">第十品《菩萨问明品》～第十二品《贤首品》<br/>十信之行（能依能信）</div>\n</div>\n</div>\n\n**说明**：法藏、澄观、智俨、慧苑四家同判第二会初三品为如来三业之展转——名号品明身业，四谛品明口业，光明觉品明意业；三品总答前会「所依果问」。《探玄记》卷三：「此品明身業遍應……四諦品明佛口業普周。光明覺品明佛意業遍覺。三輪攝伏。」（`T1733`@98210·详见 §5.2）。\n\n#### 图 〇-2　十段遍照倍增图（一放光同时顿照）\n\n<div style=\"background:rgba(94,139,158,0.04);border:1px solid var(--line, #d9cdb8);border-radius:8px;padding:16px;margin:12px 0;overflow-x:auto;\">\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;max-width:640px;\">\n<div style=\"background:#fff;border:1px solid #8fb3d9;border-radius:4px;padding:6px 10px;font-size:0.8em;\">第一重<br/><b>此</b>三千大千世界<br/>（百億四天下等）</div>\n<div style=\"background:#fff;border:1px solid #8fb3d9;border-radius:4px;padding:6px 10px;font-size:0.8em;\">第二重<br/>十佛國土</div>\n<div style=\"background:#fff;border:1px solid #8fb3d9;border-radius:4px;padding:6px 10px;font-size:0.8em;\">第三重<br/>百世界</div>\n<div style=\"background:#fff;border:1px solid #8fb3d9;border-radius:4px;padding:6px 10px;font-size:0.8em;\">第四重<br/>千世界</div>\n<div style=\"background:#fff;border:1px solid #8fb3d9;border-radius:4px;padding:6px 10px;font-size:0.8em;\">第五重<br/>十千（六十作「萬」）</div>\n<div style=\"background:#fff;border:1px solid #8fb3d9;border-radius:4px;padding:6px 10px;font-size:0.8em;\">第六重<br/>百千（六十作「十萬」）</div>\n<div style=\"background:#fff;border:1px solid #8fb3d9;border-radius:4px;padding:6px 10px;font-size:0.8em;\">第七重<br/>百萬世界</div>\n<div style=\"background:#fff;border:1px solid #8fb3d9;border-radius:4px;padding:6px 10px;font-size:0.8em;\">第八重<br/>一億世界</div>\n<div style=\"background:#fff;border:1px solid #8fb3d9;border-radius:4px;padding:6px 10px;font-size:0.8em;\">第九重<br/>十億世界</div>\n<div style=\"background:#fff;border:1px solid #d98f8f;border-radius:4px;padding:6px 10px;font-size:0.8em;\">第十重<br/>百億乃至那由他億…<br/><b>盡法界虛空界</b></div>\n</div>\n<div style=\"margin-top:8px;font-size:0.75em;color:#666;\">十段各自附長行＋一偈（10 颂）；每重例出「百億閻浮提乃至百億色究竟天、八相、六道天众」悉皆明現，並例「一切處文殊師利」各於佛所同時說偈。⚖ 就实义「應有等法界無盡之節」（`T1735`），文略而意遍。</div>\n</div>\n\n**说明**：光明节节而照、金色文殊节节而至，非多度放光、非次第巡照——「唯一放光，同時頓照盡空世界。但為言不並彰，說有前後，隨機心現」（澄观·§5.1）；慧苑同判「此非二十六度放光，亦非一放而次第巡照」（X0221·§5.2″）。如月普照、百川各见。\n\n#### 图 〇-3　十偈义趣配段图（依澄观科：初五菩提·次一威德·后四法性）\n\n<div style=\"background:rgba(94,139,158,0.04);border:1px solid var(--line, #d9cdb8);border-radius:8px;padding:16px;margin:12px 0;overflow-x:auto;\">\n<div style=\"display:flex;flex-direction:column;gap:8px;max-width:560px;\">\n<div style=\"background:linear-gradient(90deg,#e6f3ff,#f7fbff);border:1px solid #8fb3d9;border-radius:6px;padding:6px 12px;font-size:0.82em;\">第一偈（反顯）：見佛離著取捨未亡，非證道眼——<b>菩提超情</b>總標</div>\n<div style=\"background:linear-gradient(90deg,#e6f3ff,#f7fbff);border:1px solid #8fb3d9;border-radius:6px;padding:6px 12px;font-size:0.82em;\">第二～六偈：體相無所有·依正不動·佛法平等·生佛平等·五蘊無數·超越二見——<b>答成菩提</b>（初五）</div>\n<div style=\"background:linear-gradient(90deg,#fff2e6,#fffaf7);border:1px solid #d9b38c;border-radius:6px;padding:6px 12px;font-size:0.82em;\">第七～八偈（第二重段）：悲智雙滿·降魔擊鼓——<b>答佛威德</b></div>\n<div style=\"background:linear-gradient(90deg,#e6ffe6,#f7fff7);border:1px solid #8fd98f;border-radius:6px;padding:6px 12px;font-size:0.82em;\">第九～十偈（各段後四）：迴向心無生·眾生無生壞·一中解無量——<b>答佛法性</b>（後四）</div>\n</div>\n<div style=\"margin-top:8px;font-size:0.75em;color:#666;\">澄观兩判並記：古德對前二品已答二問，此品⻑行正答三問（放光答威德·見成正覺答菩提·文殊說偈答法性）；「今更一解」謂⻑行但現相答，<b>偈中具答三問</b>——初五答菩提、次一答威德、後四答法性（`T1735`·§5.1）。智俨則以十偈分三：取相不應真法／八偈離取應實／一偈歎解者勝能（`T1732`·§5.2′）。</div>\n</div>\n\n**说明**：十段十偈各有科判，本篇§二以经文自然段（长行＋偈颂）为纲，诸家科段异判并存旁注、不強令合一。\n\n---\n\n## 〇、凡例（简要）\n\n1. **经文引录**：一律照 CBETA `T10n0279` 繁体原字形逐字回源（含标点从底本）；六十辅读照 `T09n0278_juan5.txt`（STEP0 生成·L.181·CBETA 繁體原字形）。异文**各照底本、不统一**。\n2. **段落标号**：本品无分品之旧科，本文以「（一）至（十二）」自然段标示（§二总表），并附十段遍照编号 T1–T10 以便与注疏对读。\n3. **标识**：〔待核〕存疑；〔本文判断〕推断；〔讲师玄谈·非正行〕讲记科判类随口之说；⚖ 诸家异判并记。\n4. **计数口径**：「剥校勘」= CJK 字符净数（去空白、去校勘 apparatus），与 §7.4 复算脚本同一命令产出。\n5. **辅读引用**：讲记引文注明集数与可点路径；注疏引文注明经号与归一化字符位锚。\n\n---\n\n## 一、概述与品题解义\n\n### 1.1 品题释义\n\n**光明觉品第九**（八十·`T10n0279` 卷十三品题）。\n\n- **澄观**：「光明體也。覺者。用也。此二各二。謂光有身智二光。覺有覺知覺悟。」又合说：「身智無二。唯一無礙光故」；从开释则「光明之覺」通依主、有财，从合说则「光明即觉」可持业（`T1735`·§5.1）。并引《涅槃经》琉璃光菩萨处：「光明者。名為智慧。」\n- **法藏**（依六十品题立释）：「如來之光明光明之開覺。謂依體起用依用成益。皆依主釋」（`T1733`@105627·其目录以六十为第 5 品，故题首冠「如來」二字）。\n- **智俨**：「如來即化主。光者智體。明者用。覺者開曉於緣」（`T1732`@21782）。\n- **慧苑**（独得梵本题名之传）：「梵本中名**如來光明網能覺悟品**。謂佛足下輪網相中放光。還名光網。照十方佛會。覺悟菩薩。令發意來此故。」释名则料简依主、有财两释：「如來是能放光主。光明網是所放光體。能覺悟是光業用……若總言如來光明網覺悟之品。唯依主也」（X0221@114068·§5.2″）。\n- **六十华严**品题直证：**《如来光明觉品第五》**（`T09n0278_juan5.txt`@L21-22·卷五第二会第三品）。\n- **藏译**编目题 `'od zer dang ye shes`（光明与智·`data/translation/diff_matrix.yaml` order 9）；本机无德格版梵本，〔待核〕。\n\n「光」为所照之境显而能照之智寓，「觉」为所觉之理而能觉之悟——题只六字（含品号），实摄全品「佛放身光、文殊演智光」之二光纲骨。〔本文判断〕本品题名之「觉」不取「成佛之自觉」而取「警觉群蒙」——与足轮放光「表信」相呼应：十信位之觉，正是闻光而觉。\n\n### 1.2 品位与脉络（承上启下）\n\n本品在**第二会·普光明殿**（差别因果周·说十信）。前二品别明佛身业（名号）、口业（四谛），此品总明**意业遍觉**：三业既彰，所信果德之相已足，故澄观判「上來三品。答初十句所依果問竟」（`T1735`卷十三末·§5.1）；慧苑同判「上來三品明答初十果問竟」（X0221·§5.2″）。自问明品以下，转入「能依能信之行」（慧苑：「初光明覺品來。明所依所信之境。後問明等三品。顯能依能信之行」·X0221@48636）。\n\n三条脉络须并观：\n\n1. **三业次第**（诸家共判）：名号（身）→四谛（口）→光明觉（意）。「前但身語，意業將顯」（演钞·§5.3′ 旁引）。\n2. **答问次第**（澄观两判·§5.1）：⻑行放光／見成正覺／文殊說偈对答威德·菩提·法性三问。\n3. **放光升降次第**（李通玄别判·§5.3）：眉间果光放入足轮→还从足轮放出**成信位**→次第十住足指端放光→次第十行复转上位——光的「位置」即「位次」，此李氏以光位表阶位之独见（只录其说）。\n\n### 1.3 篇幅与结构预览\n\n- 全品剥校勘 **4,358 字**（含品题·§7.4 实测）；含标点 5,198；句末标点 **151**（皆「。」）；独字 **492**。\n- 结构：**序分**（放光照境一·总标二千六十一名目之染淨八相天众）→**集会分**（佛神力召十大菩萨）→**十段遍照**（T1–T10，每段长行＋一偈）→**结分**（第十重穷尽法界、更无结经语，直接过渡问明品）。\n- 本品无当机请问者——**全品是「现相—颂述」结构**：佛以身光现事境，文殊以智光赞述，与问明品之「十首递问—文殊答」恰成对照。〔本文判断〕此「不问而现、现而即颂」正是本品在十信开端的位置所需：信门先须现量境，后才有问难。\n\n### 1.4 核心要义（EN 附）\n\n1. **一光顿照，法界为量**——十段倍增非渐照，「唯一放光同時頓照盡空世界」；数至那由他亿而后「盡法界、虛空界、所有世界」，光之分齐即信之分齐。\n2. **身智二光，事理双照**——佛光现事令眾目覩，文殊智光赞理令眾悟入；「身智二照合為一光。令二覺齊圓」（演钞）。\n3. **从足轮放光：信为行本**——「足下放者。表信四義」（澄观）／「表三義」（慧苑异判·⚖）：自下而上、卑微、行本、该果海。\n4. **一切处文殊**——不动智之妙用，「觸境斯了。六根三業盡是文殊」；一人而十方俱集，非分身、无思普现。\n5. **偈颂摄菩提义**——初五答菩提、次一答威德、后四答法性（⻑行但现相答）；一多相即、生佛平等，为十信「解」之骨架。\n\n> **EN · Core points**：(1) One emission, simultaneous all-pervasion — the ten tiers multiply not as successive beams but as one light whose boundary is the dharma-realm itself. (2) Two lights, one illumination — the Buddha's body-light displays events; Manjuśrī's wisdom-light expounds principle; \"body-and-wisdom fused into one light.\" (3) Light from the wheel of the feet — faith as the ground of practice. (4) \"Manjuśrī of all places\" — the function of immutable wisdom, present where each Buddha sits. (5) The verses answer the three petitions on bodhi, majesty, and dharma-nature.\n\n**画龙点睛**：全品眼目在「**悉以佛神力故**」六字——光中所见一會、集来文殊遍至，皆不出一佛神力；而十偈眼目在首偈反显之「**彼非證道眼**」——不坏取见所见之佛非佛，须是离见方名见佛。龙是十段遍照，睛只此两处。〔本文判断〕\n\n### 1.5 经文文本现象与信度标识\n\n- **「金色世界」重出现象（底本自歧·直证）**：八十卷十三品初列十世界，第六「金色世界」与第一同名（实测「金色世界」全品 11 见：十段各一＋初列两见·@345/@376），「妙色世界」仅 1 见——CBETA 底本自身即如此，**照底本不改**，列入 §6.4 校勘记；慧苑所见文则作「金色乃至**平等色**等」（X0221），与今本_list_末「平等色世界」相合，足证「平等色」名旧犹未夺。〔待核〕六十作「金色、樂色、華色……如實色」，初列不重（@334 仅一见）。\n- **品题界标之鉴别（L.182 夜间复验订正）**：修正平文器（SKIP note/rdg/mulu/pb/anchor/app·保 anchor tail）下，「光明覺品第九」「菩薩問明品第十」「淨行品第十一」三品题串**全档各唯一见**（@109946／@115815／@120266），问明品题 @115815 即**真品题**（光明觉品止锚＝问明品起锚同位）——本行初稿误记「全文档 2 见·首见系卷十三尾题连读假串·尾锚须取第二见」，承 P10 探测 `_p10_probe.py` 复算坐实其误，**照记订正**（本文判断：旧说系沿袭旧导出件多余见之误归因）。旧导出件 `_p9_seg80.txt` 之多缀伪串（首见 @216／@95973「光明覺品第九」两见、尾缀「菩薩問明品」）系**旧平文器目录/征引泄漏**；X0221 侧实证其一：其目录（@216）恰作「光明覺品第九·淨行品第十一·賢首品第十二」**缺问明**（依八十系次·目录泄漏之典型），@114068 系疏家征引品题；余一串出处〔待核·不作据〕。复算脚本 §7.4 锚定「卷第十三 jhead 后第一见」口径（唯一见下与全文档首见等价）。旧导出件头「10」／尾「菩薩問明品」诸伪缀，业已于本篇写作时剔除重核（登记 §八·附录六 #2）。\n- **无「三昧」「普贤」「佛子」呼告**：本品 爾時×20、文殊師利×20、頌×10，而**三昧×0、普賢×0、佛子×0、偈×0**（八十侧·实测）——与问明品（佛子呼告成串）净行品（智首问—文殊答—佛子！菩萨善观）之对语结构截然不同；本品全是「叙述—颂」二声部。\n- **数法名相层**：「十千／百千／百萬／一億／十億／那由他億」阶梯＋「無數無量無邊無等不可數不可稱不可思不可量不可說」结广——澄观、慧苑各以《俱舍》《顺正理论》《长阿含》《显扬》《金光明》与「黄帝算法」上中下三等释之（§4.5、§5.1、§5.2″）。\n- **「清涼」仅 1 见**（实测：即第五偈「住於清涼慧」·@清涼 2384 旧导出坐标）——非疏家署名（澄观号清凉）混入，无涉。\n\n### 1.6 版本差异之惯例与本品之版本情况\n\n- 校勘底本**八十**（`T10n0279` 卷十三）；六十辅读**已用 STEP0 新档** `T09n0278_juan5.txt`（本地 XML 生成·双实现全等校验 L.181），**不复用旧「脱文」误判**（L.176 勘误·见第一部 §1.8）。\n- 四十华严（`T10n0293`）为入法界品全译，**不含本品**——无四十对读段，如实标明。\n- 藏译仅编目级对应（diff_matrix：汉藏基本对应·diff_type E；题 `'od zer dang ye shes`），德格版本机未入库，逐字对勘〔待核〕。\n- 兜沙经 `T10n0280`（六十品之少分异译）**无光明觉品对应**——本品属「会通本后出之广文」性质〔本文判断·依 Nattier 分层说〕，登记备核。\n- 疏家所见文本位差异：澄观判「是前名號品放」（足轮光即前品所放·§5.1），慧苑判「今言新集。只是前品新來說法所由事須還牒彼故」（X0221·§5.2″）——两释同指**经文重牒之由**而非文本讹误，可互足。\n\n### 1.7 核心要义小结\n\n本品是第二会「所信果德」三业收束之眼：前二品以名号、谛辞竖**能说法者**，本品还以**光照现量**竖**所说境界**——三千大千世界百亿四天下、八相成道、六欲色界诸天，一光顿彻；偈中复以「非证道眼」反破、「一中解无量」正成，把「信」安在「现量—智照」双柱上。十段倍增与「尽法界虚空界」的数法结构，是本品留给后世华严「数法观」「世界海观」最直接的文本资源（澄观「一會不動遍法界」·智俨「光覺一時而能別見遠近」皆从此出）。\n\n---\n\n## 二、卷第十三（光明觉品第九·本品全文逐段细读）\n\n### 2.0 结构总表（据经切分）\n\n| 段 | 内容 | 起讫（原文标记） | 性质 |\n|---|---|---|---|\n| （一） | 世尊足轮放光·总标照境（此三千大千世界） | 「爾時,世尊從兩足輪下放百億光明,照此三千大千世界」 | 序分·能照 |\n| （二） | 别显所照二十目（百億四天下→百億色究竟天） | 「百億閻浮提、……百億色究竟天;其中所有,悉皆明現」 | 序分·所照 |\n| （三） | 本会现相＋佛神力集十大菩萨·十世界十佛 | 「如此處,見佛世尊坐蓮華藏師子之座……觀察智佛」 | 序分·集会 |\n| （四） | 第一偈（十颂·超情离见） | 「爾時,一切處文殊師利菩薩……當成無所畏。」 | 正宗分 |\n| （五）–（十二） | T2–T10 九段：光过此界遍照倍增·长行略例＋各一偈 | 「爾時,光明過此世界,遍照東方十佛國土……」至「佛遍虛空亦如是。」 | 正宗分 |\n\n> 十段编号（T1＝段一之照此界；T2–T10 对应「光明過X遍照Y」九段），与 §1.4、图〇-2、§7.3 同一坐标。每段皆「长行现境＋偈颂赞述」二拍，偈前公式全一品一律：「**爾時,一切處文殊師利菩薩,各於佛所,同時發聲,說此頌言**」（×10·实测）。\n\n### 2.1 段（一）（二）（三）·序分：放光·照境·集会（全引）\n\n> 「爾時,世尊從兩足輪下放百億光明,照此三千大千世界百億閻浮提、百億弗婆提、百億瞿耶尼、百億欝單越、百億大海、百億輪圍山、百億菩薩受生、百億菩薩出家、百億如來成正覺、百億如來轉法輪、百億如來入涅槃、百億須彌山王、百億四天王眾天、百億三十三天、百億夜摩天、百億兜率天、百億化樂天、百億他化自在天、百億梵眾天、百億光音天、百億遍淨天、百億廣果天、百億色究竟天;其中所有,悉皆明現。」（`T10n0279` 卷十三·逐字）\n\n**疏解**：所照二十一目，澄观科为「人中（四州·大海·轮围）—八相（受生·出家·成道·转法轮·涅槃）—诸天（须弥·六欲·四禅天）」三块（§5.1）。八相中「受生含三」（住胎·生·出家等摄），「佛成道後始放光明，却現初生及後涅槃者，約微細門融三世故」——光中所见非回忆，是**一念顿现三世**。\n\n> 「如此處,見佛世尊坐蓮華藏師子之座,十佛剎微塵數菩薩所共圍遶;其百億閻浮提中,百億如來亦如是坐。悉以佛神力故,十方各有一大菩薩,一一各與十佛剎微塵數諸菩薩俱,來詣佛所。其名曰:文殊師利菩薩、覺首菩薩、財首菩薩、寶首菩薩、功德首菩薩、目首菩薩、精進首菩薩、法首菩薩、智首菩薩、賢首菩薩。是諸菩薩所從來國,所謂:金色世界、妙色世界、蓮華色世界、薝蔔華色世界、優鉢羅華色世界、金色世界、寶色世界、金剛色世界、玻瓈色世界、平等色世界。此諸菩薩各於佛所淨修梵行,所謂:不動智佛、無礙智佛、解脫智佛、威儀智佛、明相智佛、究竟智佛、最勝智佛、自在智佛、梵智佛、觀察智佛。」（逐字·第六「金色世界」重复系底本自歧，见 §1.5、§6.4）\n\n**疏解**：十大菩萨即后问明品发问之十首；十世界、十佛皆以「色／智」立名——澄观：「剎號佛名皆同名號品中。但增百億為異耳」（§5.1：名号品广说名目，此处但举其例）。李通玄独重此段：「用照金色世界不動智佛。以成信位」（T1739·§5.3）。⚖ 智俨释名次序有别判：「所以文殊在前賢首在後為表智先福後故」（T1732）。\n\n### 2.2 段（四）·第一偈（十颂·菩提超情）\n\n> 「爾時,一切處文殊師利菩薩,各於佛所,同時發聲,說此頌言:「若有見正覺,解脫離諸漏,不著一切世,彼非證道眼。若有知如來,體相無所有,修習得明了,此人疾作佛。能見此世界,其心不搖動,於佛身亦然,當成勝智者。若於佛及法,其心了平等,二念不現前,當踐難思位。若見佛及身,平等而安住,無住無所入,當成難遇者。色受無有數,想行識亦然,若能如是知,當作大牟尼。世及出世見,一切皆超越,而能善知法,當成大光耀。若於一切智,發生迴向心,見心無所生,當獲大名稱。眾生無有生,亦復無有壞,若得如是智,當成無上道。一中解無量,無量中解一,了彼互生起,當成無所畏。」」（逐字）\n\n**疏解**：澄观科「初一反顯餘九順釋」（§5.1）：第一句反破——若只见佛「内离诸漏外不著世」，则取舍未亡，「此見違理。故非道眼」；后九偈各一义：体相无所有（菩提性本空）·依正不动·佛法平等·生佛平等·五蕴同无为一、超越世出世见·**迴向心无生**·众生无生坏·一多互解。第十颂「一中解無量」即十玄「一多相容不同门」之经文根据（澄观指「即十玄門中一多相容不同門也」·§5.1）。⚖ 慧苑别判十偈总意「顯一切相即平等無差」，且于第七偈广引《大品》迴向义、末颂郑重提醒：「此會差別歸平等性。是理事無[得-彳]（礙）。**非事事無[得-彳]。應審其文。勿謬解也**」（X0221·§5.2″）——此是慧苑家法之判，与澄观事事无碍之圆义显张力，只标不判。\n\n### 2.3 段（五）·T2 光照十佛国土·第二偈（菩提因果）\n\n长行略例：「爾時,光明過此世界,遍照東方十佛國土;南、西、北方,四維、上、下,亦復如是」＋集会重牒（其大菩薩謂文殊師利等·所從來國謂金色世界等·本所事佛謂不動智如來等）。偈：\n\n> 「眾生無智慧,愛刺所傷毒,為彼求菩提,諸佛法如是。普見於諸法,二邊皆捨離,道成永不退,轉此無等輪。不可思議劫,精進修諸行,為度諸眾生,此是大仙力。導師降眾魔,勇健無能勝,光中演妙義,慈悲故如是。以彼智慧心,破諸煩惱障,一念見一切,此是佛神力。擊于正法鼓,覺寤十方剎,咸令向菩提,自在力能爾。不壞無邊境,而遊諸億剎,於有無所著,彼自在如佛。諸佛如虛空,究竟常清淨,憶念生歡喜,彼諸願具足。一一地獄中,經於無量劫,為度眾生故,而能忍是苦。不惜於身命,常護諸佛法,無我心調柔,能得如來道。」（逐字）\n\n**疏解**：澄观科此段「十偈通顯菩提因果。分三。初偈菩提之因。次五菩提果用。後四令物思齊」（§5.1）：初偈「無明造業愛能潤業……如泥中刺」；次五悲智双满·美往因·降魔·智断·法鼓；后四**令物思齊**——游刹无著·念佛生喜·亡苦济物·护法轻身，「斯即佛因。能如是行得諸佛道」。\n\n### 2.4 段（六）·T3 光照百界·第三偈（八相菩提）\n\n> 「佛了法如幻,通達無障礙,心淨離眾著,調伏諸群生。或有見初生,妙色如金山,住是最後身,永作人中月。或見經行時,具無量功德,念慧皆善巧,丈夫師子步。或見紺青目,觀察於十方,有時現戲笑,為順眾生欲。或見師子吼,殊勝無比身,示現最後生,所說無非實。或有見出家,解脫一切縛,修治諸佛行,常樂觀寂滅。或見坐道場,覺知一切法,到功德彼岸;癡暗煩惱盡。或見勝丈夫,具足大悲心,轉於妙法輪,度無量眾生。或見師子吼,威光最殊特,超一切世間,神通力無等。或見心寂靜,如世燈永滅,種種現神通,十力能如是。」（逐字）\n\n**疏解**：澄观：「初一標德充滿。後九別廣調生」——后九「或見」历八相（生·住·行·学·吼·出家·道场·转轮·神通·灭度），并科「或見」十字为**十义感应**（多机异处各感见……一人于同异俱时处见一切人所见·§5.1 全录）；「然佛不分身無思普現也」。此段是华严「八相成道即一大顿现」之祖文本。\n\n### 2.5 段（七）·T4 光照千界·第四偈（体性甚深）\n\n> 「佛於甚深法,通達無與等,眾生不能了,次第為開示。我性未曾有,我所亦空寂,云何諸如來,而得有其身。解脫明行者,無數無等倫,世間諸因量,求過不可得。佛非世間蘊,界處生死法,數法不能成,故號人師子。其性本空寂,內外俱解脫,離一切妄念,無等法如是。體性常不動,無我無來去,而能寤世間,無邊悉調伏。常樂觀寂滅,一相無有二,其心不增減,現無量神力。不作諸眾生,業報因緣行,而能了無礙,善逝法如是。種種諸眾生,流轉於十方,如來不分別,度脫無邊類。諸佛真金色,非有遍諸有,隨眾生心樂,為說寂滅法。」（逐字）\n\n**疏解**：澄观判此偈属「第四·显菩提体性」（十段依答文三之外判·§5.1）；慧苑细科十偈：「初一歎佛悲智德……三歎佛解脫等德……准梵本中。亦通勝解」并广引《瑜伽》《涅槃》释「明行」，又释「世間諸因量」曰：「因明比量。但依世俗分別名言……今此顯佛一切德。超世名言……因是量主。故曰因量。因明之稱亦從此立也」（X0221·§5.2″）——因明名义于品内得映带，是注疏之一得。\n\n### 2.6 段（八）·T5 光照十千界·第五偈（十种业·悲愿行）\n\n> 「發起大悲心,救護諸眾生,永出人天眾,如是業應作。意常信樂佛,其心不退轉,親近諸如來,如是業應作。志樂佛功德,其心永不退,住於清涼慧,如是業應作。一切威儀中,常念佛功德,晝夜無暫斷,如是業應作。觀無邊三世,學彼佛功德,常無厭倦心,如是業應作。觀身如實相,一切皆寂滅,離我無我著,如是業應作。等觀眾生心,不起諸分別,入於真實境,如是業應作。悉舉無邊界,普飲一切海,此神通智力,如是業應作。思惟諸國土,色與非色相,一切悉能知,如是業應作。十方國土塵,一塵為一佛,悉能知其數,如是業應作。」（逐字·结句「如是業應作」×10）\n\n**疏解**：澄观判此段为「體（顯）菩提之因」（§5.1 十段依答文三：初五菩提——五偈段恰居第五·其义相摄〔本文判断〕）；慧苑科「頌中十偈。教諸菩薩。盡十種行」：大悲行·信佛行·乐佛德行·学念佛行·观三世佛行·如实相观行·观众生平等行·佛神通行·知国土行·知数多行（X0221）。六十此段结句作「**是彼淨妙業**」×10（`juan5.txt`·§6.1），八十「如是業應作」——两译公式性差异之最整齐样本。\n\n### 2.7 段（九）–（十二）·T6–T10 后五段（摄要引·全文见附录三）\n\n- **T6 百千界·第六偈**（「若以威德色種族,而見人中調御師,是為病眼顛倒見……」·离相见佛·一身为无量）——澄观判「即應而寂／即寂而應」二段科（§5.1 旁及·慧苑详科见 §5.2″）。\n- **T7 百万界·第七偈**（「如來最自在,超世無所依……」·多中无一·一亦无多）——慧苑特为解释此段数名：「梵本中云照十百千。此是萬後億前中間之數……當知。猶在俱胝數」（X0221）。\n- **T8 一亿界·第八偈**（「智慧無等法無邊,超諸有海到彼岸……」·十种「方便力」结叹）——澄观判属「后四答法性」层。\n- **T9 十亿界·第九偈**（「廣大苦行皆修習……聞法信解無疑惑,了性空寂不驚怖,隨形六道遍十方,普教群迷是其行。」·十种「是其行」）——即「九誓度行」段（澄观：「後九明發因誓願度生行」〔此判在慧苑·⚖ X0221 详科〕；六十作「是則佛境界」×9＋「是則天人師」）。\n- **T10 百億那由他界·穷法界·第十偈**：长行为全品数法之顶点：\n\n> 「爾時,光明過十億世界,遍照東方百億世界、千億世界、百千億世界、那由他億世界、百那由他億世界、千那由他億世界、百千那由他億世界,如是無數無量、無邊無等、不可數、不可稱、不可思、不可量、不可說,盡法界、虛空界、所有世界;南、西、北方,四維、上、下,亦復如是。」（逐字）\n\n偈曰「一念普觀無量劫,無去無來亦無住……譬如空中無量剎,無來無去遍十方,生成滅壞無所依,佛遍虛空亦如是。」（十颂·摄「三世一念」与「身遍虚空」二义收束全品）。澄观段末结科：「第九·顯理事無障礙」（来意十义之第十·§5.1）；三品总结语「**上來三品。答初十句所依果問竟**」即在此段之后、卷十三之末（`T1735`@卷末·§5.1）。\n\n---\n\n## 三、旁参与前接\n\n### 3.1 前接（第二会内部）\n\n- **接《如来名号品》**：名号品列佛名号二百一十一（第七部 §2），本品集会段之十世界十佛「剎號佛名皆同名號品中。但增百億為異耳」（澄观·§5.1）——本品是名号品「遍」义的**现量化**：名号遍是言说，光照遍是现示。\n- **接《四圣谛品》**：四谛品明口业说实之权遍，本品明意业之「即权之实遍」（澄观来意第四义·§5.1）。演钞科判链：「九身語既彰。意業將顯。意玄叵測仍帶身明。故足輪放光照事警物……故受之以光明覺品」（`T1736`@184385 段·§5.3′ 旁引）。\n- **光位承转**：第一会·如来现相品眉间白毫放光（第二部），本品**足轮**放光——李通玄判「前如來現相品中如來眉間放光已入兩足輪中」（T1739·§5.3）；后第三会升须弥顶、偈赞品足指端放光，成「眉间→足轮→足指→足趾」之光位阶梯〔李氏系·只录其判〕。\n\n### 3.2 旁参（别时别经）\n\n- **《菩萨问明品》（次品）**：十首更互问答由此品集结之文殊—十首格局开出；问明品初「文殊師利菩薩問覺首菩薩言：『佛子！心性是一，云何能生種種果報？』」（六十·`juan5.txt`@L307-310 直证·六十题《菩萨明难品第六》）——光照现境（本品）→ 心性问起（次品），境→观之转。\n- **《华藏世界品》（第一会）**：彼品普贤说世界海因起，此品光照「一會遍一切處」——澄观判本品「九示前神通相故。上云現通。如何現耶。一會不動遍法界故」（§5.1），即遥应华藏品现通段。\n- **《阿僧祇品》（第七会）**：数法之展开。澄观释本品「百億」时预指「餘如光明覺品說」（`T1735`@581638·彼处释「一百洛叉為一俱胝」还引本品「過一億」为证）——本品与阿僧祇品互为数法之锚。\n- **兜沙经 `T10n0280`**：无对应品（§1.6）；《十住经》《渐备》等异译系统与本品无涉。\n- **藏译编目**：order 9 `'od zer dang ye shes`（光明与智），汉藏基本对应（diff_matrix·diff_type E）——题名近「光明觉」之义取，可旁证「觉＝智」之古读〔仅编目级·待核〕。\n\n### 3.3 判教位置\n\n澄观科第二会为「修因契果生解分」之初（十信）；本品与次三品（问明·净行·贤首）合成十信全段——「十上之三品。復為所信正報之果」（演钞）。海云讲记判「如來名號品（佛）・四聖諦品（法）・光明覺品（僧）」三宝配，系讲师自用科判〔讲师玄谈·非正行〕（§5.3′）。\n\n---\n\n## 四、义理要点与名相\n\n### 4.1 光·觉·网：题眼三义（依诸家）\n\n「光明」摄**身智二光**（佛身光现事·文殊智光赞理）；「觉」摄**觉知·觉悟**二层（菩萨觉知见事无碍·眾觉悟法之性相）；慧苑独以梵本「**光明網**」立释——足下轮「网相」放光还名光网，光网即千辐轮相之德用（§5.2″）。三义合观：题即全品科骨。\n\n### 4.2 十段遍照·一放顿照（数法与现量）\n\n十段自「此三千大千」倍增至「百千那由他亿」而结「尽法界虚空界」；澄观断言：**「非多度放光。亦非一度放光。次第照於多節。唯一放光。同時頓照盡空世界」**——说有前后只为「言不并彰、随机心现」，喻如「月普照百川各见」（§5.1）。又实义上「應有等法界無盡之節。節節有偈。中上本經必應廣說」——今文四千余字是略本，此判为华严「文略义广」之通例又一证〔依疏〕。\n\n### 4.3 身智二光·事理双照\n\n佛光现事令**目覩**，文殊智光赞理令**悟入**——「身智二照合為一光。令二覺齊圓」（演钞）；「知無事非理故……此三圓融唯無礙之法界」（澄观·§5.1）。此为本品在「信」位安「解」的枢纽：信不离智照，智照不离现事。\n\n### 4.4 足轮放光·表信（⚖ 四义／三义两判并存）\n\n- **澄观四义**：一「自下而上信最初故」；二「最卑微故」；三「為行本故」（引《智度论》卷九：「身得住處皆由於足」）；四「顯信該果海已滿足故」。并释「輪義亦然。圓無缺故」（§5.1）。\n- **慧苑三义**：一涉达所因·信为至初；二信望后住最劣·足下至卑；三为本所依·「將詣菩提。信為根本」，引「信為道元功德母」及《智度》第九同文（X0221·§5.2″）。\n- ⚖ 智俨别出「示十信是行足圓備故也」（T1732）；李通玄「最下。明入信之首以信為因」（T1739）。四判同归「信」而开合各异，〔本文判断〕四义较三义多出「信该果海」一层，正是澄观后出转精处。\n\n### 4.5 一切处文殊（三义）\n\n澄观「略申三義」：一約當節——初节百亿佛前有百亿文殊，「各各皆說當節之偈」；二約来处——「一文殊從一處東來。即從一切處東來……以是法界即體之用身故」；三約表法——「文殊乃是不動智之妙用。觸境斯了。**六根三業盡是文殊。實相體周萬像森羅無非般若**。何有一處非文殊哉」（§5.1）。此段是华严文殊观之最凝练表述；慧苑答「定不相違」难曰「法界之身常來遍不相障……即佛以法界身。放法界光。令眾以法界眼覩文殊法界身」（X0221）。\n\n### 4.6 偈义纲领：超情·离见·一多\n\n- **反显**：「若有見正覺,解脫離諸漏,不著一切世,彼非證道眼」——离著之见仍是取舍，「证道眼者。无分别故」（澄观）。\n- **离见之益**：见世界心不摇动·依正等·生佛等·五蕴无数·超越世出世见——九顺偈层层洗境。\n- **迴向义**：「若於一切智,發生迴向心,見心無所生,當獲大名稱」——慧苑广引《大品》「迴向心不在菩提心中」解之（⚖ 八十偈文「獲大名稱」，六十作「彼人大名稱」·§6.1 表〔三〕）。\n- **一多相即**：「一中解無量,無量中解一,了彼互生起,當成無所畏」——澄观指为十玄「一多相容不同门」之经证，并出「多有力能攝一，一无力入於多」之相由义（§5.1）；⚖ 慧苑限此「是理事無礙。非事事無礙。應審其文。勿謬解也」（X0221）——同一颂文两判层级不同，是澄／苑义理分歧之显微镜标本（§5.4）。\n- **三世一念**：末偈「一念普觀無量劫,無去無來亦無住」——时间摄归于光中之现量。\n\n### 4.7 名相表\n\n| 名相 | 训释 | 出处 |\n|---|---|---|\n| 三千大千世界 | 一小千＝日月须弥四大洲欲天梵世各一千；千倍为中千、复千倍为大千，「皆同一成壞」；「以三度積故曰三千。略去小中舉其末後」 | 俱舍论·澄观引（`T1735`） |\n| 四大洲 | 閻浮提（新云贍部·因赡部树名洲）·弗婆提（胜身）·瞿耶尼（牛货）·欝單越（胜生·定寿千岁） | 澄观释·§5.1（六十作拘伽尼·§6.1） |\n| 百億 | 此方黄帝算法三等（上中下），今约中数「从千已上百百變之則有百億」；唐三藏译百億俱胝；俱胝旧传十万／百万／千万三种 | 澄观引《俱舍》「洛叉＝亿」、测公《深密记》（`T1735`） |\n| 那由他 | 八十：「那由他億世界」；六十：「億那由他世界」——译序倒置·数量级异读〔待核〕 | 两译长行（§6.1 表〔四〕） |\n| 光明網 | 梵本品题所含（如來光明網能覺悟品）；轮网相放光 | X0221 |\n| 一切處文殊師利 | 不动智之妙用·法界即体之用身 | `T10n0279`／`T1735` |\n| 十首（觉首…贤首） | 十大菩萨，当机集会众首，次品问主 | `T10n0279` |\n| 蓮華藏師子之座 | 华藏世界依持之座·与第一会华藏庄严呼应 | `T10n0279` |\n| 不動智佛 | 金色世界本所事佛；十佛皆「智」名——表十信依智立 | `T10n0279`／`T1739` |\n\n---\n\n## 五、注疏选要（诸家会读）\n\n### 5.1 澄观《华严经疏》卷十三（`T1735`@151418–161145·「光明覺品第九(入第十三經)」·五门全段）\n\n**（甲）来意十义**：「解此一品略以五門。初來意中自有其十。」\n\n> 「一為答前所依果問故。然古德對前二品已答二問。此品正答三問。謂⻑行放光答佛威德。見成正覺答成菩提。文殊說偈正答佛法性問。今更一解。謂⻑行但現相答。已如前說。偈中具答三問謂初五答菩提。次一答威德。後四答法性。」\n\n其二「為廣名號品總標多端故……正廣種種觀察是意業故」；其三「即說十信之體性故」；其四「顯實遍故……前但佛名遍此顯身遍。四諦即實之權遍。此品顯即權之實遍故」；其五「現驗故……今光示遍相故」；其六「顯總遍故……一一皆悉同時同處同眾同說同遍故」；其七「顯圓遍故……今顯無差別。一切即圓融遍一切故」；其八「與下經為其則故」；其九「示前神通相故……一會不動遍法界故」；其十「為顯理事俱無障礙。令捨執從法故」。\n\n**（乙）释名**：「光明體也。覺者。用也。此二各二。謂光有身智二光。覺有覺知覺悟。又光有能照所照。覺有能覺所覺。如來放身光照事法界。令菩薩覺知見事無礙。文殊演智光雙照事理。令眾覺悟法之性相。」合说：「身智無二。唯一無礙光故。涅槃經瑠璃光菩薩處云。光明者。名為智慧……又此二光不異覺境。此三圓融唯無礙之法界。」\n\n**（丙）宗趣**：「以身智二光無礙覺悟為宗。令物生信為趣。」\n\n**（丁）解疑妨**：「問此足輪光何時放耶……答是前名號品放。但前二品明文殊此會說法不俟光照。今辨百億剎中。乃至遍法界說故。須光以顯示其所來。」又「光照百億百億何不照此。釋云。此為主故。」\n\n**（戊）释文要科**：足下放光表信四义（§4.4）；「光照大數約其現文。且有二十六節。前九別名。後十七同辨。即為十段」；一放顿照·如月普百川（§4.2）；「十段之中文各有二。皆⻑行。佛以身光照現事境。令眾目覩。偈頌文殊智光讚述事理。令眾悟入」；三千大千据《俱舍》·引《长阿含》十八《杂阿含》十六《顺正理》三十一《显扬》第一《金光明》诸说并会；四大洲新译释（§4.7）；百億数法（§4.7）；一切处文殊三义（§4.5）；「或見」十义（§2.4）；逐偈科判（§2.2–2.7）；至第十重科「具四義。一頓遍多剎。二恒不去來。三應有出沒。四體用無依。是故佛身亦不可以遍空而取耳」；结：「**上來三品。答初十句所依果問竟**」。\n\n### 5.2 法藏《探玄记》卷三（`T1733`@105627–111671·「如來光明覺品第五四門同上」·探玄记依六十编次）\n\n- **释名**：「謂如來之光明光明之開覺。謂依體起用依用成益。皆依主釋可知。」\n- **来意七义**：「一前明身語今明意業故來也。二為別答前功德勢力等問故。三前二品別明人法遍。此為雙顯二遍故。四為前但論佛名普遍。此顯佛身實德亦遍。前說四諦權教普遍此辨十偈實教亦遍……五即說十信之體性故……（六）為廣名號品總標……（七）……」；三业判语：「此品明身業遍應。謂名號依身而立故。四諦品明佛口業普周。光明覺品明佛意業遍覺。三輪攝伏。俱是正報。然身業最麁。故先辨耳」（@98210 段）；又「此品明國土海義。前品既辨世界海。即明體隨緣顯其果相。今即約緣反顯明其果體」。\n- **宗趣**：「三明宗趣者亦三。先明分宗通至第六會來同是一番問答故」；会中之义：「此會是修因之始而與果同會。而果在會初。十地等是成因之終。亦與果同會而果在會後。此等為顯依果海以起圓因。因滿還融歸圓果。此乃文中宏致始終之幖幟者也」（@97900–98500 段·第二会配「果在会初」之判为法藏纲目）。\n- **释文**：十段依答文三、偈颂分段科判（与澄观门径多合·澄观疏此品实承探玄记格局〔本文判断·依两文比对〕）；末段「上來通答前初十問竟」。\n\n### 5.2′ 智俨《搜玄记》（`T1732`@21782–23696·「光明覺品第五四門同前」·依六十）\n\n四门：名·来意·宗·释文。「一辨名者。如來即化主。光者智體。明者用。覺者開曉於緣耳」；「二來意。何故來者。將欲說故。集有緣眾并顯法分齊也」；「三宗為集同法眾亦顯法增微」；「四分文釋者。此上三品並通下第六會已來。增微有異文局義通」。独得之点：\n\n- 文有十段、「此中放光分齊有**二十五重**。初九別列。餘者總結」⚖（与澄观「二十六節」异算·§6.4）；\n- 诸会放光升降对照：「第一會放光有十意如文……光覺品初相輪光顯信位所依法分齊。次佛神力集眾顯當位中所成德」；\n- 「文殊在前賢首在後為表智先福後故」；「光覺在於一時。而能別見遠近。又諸方運集只是一人而令眾異見。未必有多」；\n- 十偈科：「大分有三。初一辨取相不應真法。二有八偈辨離取應實法。次一歎解者有勝能也」；\n- **十偈配十地**（古十地配之滥觞样本）：「總明知善惡等慈化物益。相同二地戒行」「相同三地」「相同四地無攝義」「相同五地中相續不異義」「相同六地無染淨義」⚖——与澄观「说十信体性」判明显异位，只并记不牵合。\n\n### 5.2″ 慧苑《續華嚴略疏刊定記》卷第四（X0221@114068 起·「光明覺品第九」·**本品有记之直证**）\n\n> 「將釋此品。四門同前。初釋名中二。先顯得名。後辨釋名。先得名者。梵本中名如來光明網能覺悟品。謂佛足下輪網相中放光。還名光網。照十方佛會。覺悟菩薩。令發意來此故。」\n\n- **来由二义**：「一由答前**八問**故來」（威德·开示意遍·刹庄严·佛性·佛刹清净·刹体性·刹成就·佛大菩提——逐光中事相配问）；「二顯前二品名諦別遍。即是此品融遍故來也」。⚖ 八问对澄观「答三问／十义」，问数异判。\n- **宗趣**：「以佛光照一切剎中菩薩為宗。覺悟彼諸菩薩令來此為趣。宗趣門中但說宗趣。不煩強說餘法。」——与澄观「令物生信为趣」异（此就「集众」立趣〔本文判断〕）。\n- **释文**：二十六节十段·「此非二十六度放光。亦非一放而次第巡照。但一放光同時頓照盡空世界」；足下放光**三义**（§4.4）；界量广引（真谛部异执记·长阿含·杂阿含·俱舍·顺正理·显扬·金光明——较澄观更繁，并断「若約至教定量。則此經為定」因「今此經文中。但至色頂」）；数法四等（下·中·上·上上上上）广释洛叉／俱胝／阿僧企耶；十偈逐段科（§2.2–2.7 多所采）；末判「是理事無礙。非事事無礙。應審其文。勿謬解也」（§4.6）。**是记解经细密处多过澄观所承，而处处露「依梵本」「准梵本」之料简——校勘层最活动的一家（§6.4）。**\n\n### 5.3 李通玄《新华严经论》（`T1739`@39987 等·二十处征引·异判只录不改）\n\n- 「於兩足輪下放光明……兩足輪下光者。為其最下。明入信之首以信為因。信為最下故。此是如來眉間果光放入故。前如來現相品中如來眉間放光已入兩足輪中。為欲明舉佛。果〔德為因〕」；\n- 「如來於眉間。放果德光明。入足下輪中。明以果成因……便說信門即於光明覺品中。還從兩足下輪中放出初眉間放入果德光明。用照金色世界不動智佛。以成信位。以次欲說十住品時。昇須彌山頂。於偈讚品中於如來兩足指端放光」（@48228）；\n- 「如經十信位中光明覺品云。十方一切處文殊師利。於十方一切處。說十方一切處法門。歎佛十種果德。以成信位」（@41479）；\n- 第六重证法别：「如經中從第二會光明覺品。於如來兩足輪下放光明遍照百千那由他三千大千世界。乃至如是無量無數……盡虛空遍法界所有世界」（@50358·⚖ 征引文顺与今本小异·其「百千那由他三千大千世界」为撮引）。\n〔按〕李氏「眉间—足轮—足指—足趾」光位表位次之说，诸家无同引者，属《论》家自用科纲，**只标不改**；其「歎佛十種果德以成信位」与澄观「说十信体性」可互证。\n\n### 5.3′ 海云继梦讲记（Ep10·〔讲师玄谈·非正行〕并存）\n\n- Ep10《光明觉品》段（光明覺×27）讲师自设科：「如來名號品（佛）・四聖諦品（法）・光明覺品（僧）・菩薩問明品（法界能所）」——三宝配系讲者活用，非诸家旧科〔讲师玄谈·非正行〕；又「從光明覺品開始我們又把它畫為行法的範圍裡面」——以本品为「行法」起点之分段判，与古科「所信果—能信行」之界（在问明以下）不同〔讲师玄谈·非正行〕。\n- Ep11「第三會開頭四品經（光明覺・問明・淨行・智首所問）」——会次名相通说恐系口误（四品实属第二会），并原存校订注 ⚖ 玄谈段口诵科判〔待核〕，**只标不改**。\n- 本品**正行段逐字讲记**：Ep15 后正行转禅修系、Ep16+ 未上传，〔正行讲记未上架·待补〕。\n\n### 5.4 诸家对读小结\n\n| 家 | 释名 | 来意 | 宗趣 | 放光表义 | 光照节数 |\n|---|---|---|---|---|---|\n| 澄观 | 体用开合·持业依主 | 十义·答三问 | 二光无碍觉悟·生信 | 四义 | 二十六节 |\n| 法藏 | 依主（如来光明·光明开觉） | 七义·三业轮摄 | 三重·通第六会 | （未别立） | （文同） |\n| 智俨 | 智体·明用·开晓 | 将欲说·集有缘 | 集同法众·显增微 | 行足圆备 | 二十五重 |\n| 慧苑 | 梵本「光明網能覺悟」 | 二义·答八问 | 光照菩萨·觉悟令来 | 三义 | 二十六节 |\n| 李通玄 | （不论） | 果光入足·以果成因 | 成信位 | 眉间→足轮 | （撮引） |\n\n⚖ 三处硬差异不牵合：①「答三问（澄）／答八问（苑）／别答功德势力问（藏）」；②「二十六节（澄苑）／二十五重（俨）」；③「十信体性（澄）／十地分位（俨）」。④ 圆义层级：澄观处处以理事・事事无碍收，慧苑于「一中解无量」独判**非**事事无碍——华严今古学之分于本品一偈见其微。〔本文判断〕\n\n---\n\n## 六、文本对读与校勘\n\n### 6.1 八十／六十对读（`T10n0279` 卷十三 ↔ `T09n0278_juan5.txt`·STEP0 新档·L.181）\n\n**〔一〕品题与结经**：八十「光明覺品第九」／六十「**如來光明覺品第五**」（冠「如來」·编次从六十二十会第五）；六十段末以「大方廣佛華嚴經」卷尾题收（无八十品末「10」类卷首残痕），次品六十题《**菩薩明難品第六**》（八十作《菩薩問明品第十》——前批「問明×0」之谜已解·L.181）。\n\n**〔二〕十段阶梯对勘**（两译十段序全同·数名异译）：\n\n| 段 | 八十 | 六十 | 备注 |\n|---|---|---|---|\n| T1 | 照此三千大千世界 | 遍照三千大千世界 | 「照此／遍照」·起句异（下表〔三〕） |\n| T2 | 遍照東方十佛國土 | 遍照東方十佛國土 | 同 |\n| T3–T4 | 百世界／千世界 | 百世界／千世界 | 同 |\n| T5 | 十千世界 | **萬**世界 | 八十存「十千」古算·六十用「萬」 |\n| T6 | 百千世界 | **十萬**世界 | 同上 |\n| T7 | 百萬世界 | 百萬世界 | 同 |\n| T8 | 一億世界 | 一億世界 | 同 |\n| T9 | 十億世界 | 十億世界 | 同 |\n| T10 | 百億…那由他億世界…盡法界、虛空界、所有世界 | 百億…億那由他世界…不可量…虛空、法界等一切世界 | 「那由他億／億那由他」译序倒·结广语小异 |\n\n**〔三〕首段要句逐字对**：\n\n| 八十（`T10n0279`） | 六十（`juan5.txt`） | 异文类 |\n|---|---|---|\n| 從兩足**輪下**放百億光明 | 從兩足**相輪**放百億光明 | 所依处（轮下／相轮） |\n| **照此**三千大千世界 | **遍照**三千大千世界 | 义势（此界为主·澄观「此為主故」恰释八十本） |\n| 百億**瞿耶尼** | 百億**拘伽尼** | 音译（西洲·俱含牛货义·慧苑正从八十本作「瞿耶尼」释） |\n| 百億**輪圍山** | 百億**金剛圍山 function _initArticleENMode(){

    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);

    full.querySelectorAll('blockquote').forEach(function(bq){

      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });

  _applyArticleENMode();
}

}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}

</script>
