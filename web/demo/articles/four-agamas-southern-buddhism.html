\">\n<line x1=\"285\" y1=\"132\" x2=\"635\" y2=\"132\"/>\n<line x1=\"285\" y1=\"205\" x2=\"635\" y2=\"205\"/>\n<line x1=\"285\" y1=\"278\" x2=\"635\" y2=\"278\"/>\n<line x1=\"285\" y1=\"351\" x2=\"635\" y2=\"351\"/>\n</g>\n<g font-size=\"10.5\" text-anchor=\"middle\" fill=\"currentColor\" opacity=\"0.7\">\n<text x=\"460\" y=\"124\">长篇叙事与论说多有平行</text>\n<text x=\"460\" y=\"197\">四组中最近缘，仍有跨部对应</text>\n<text x=\"460\" y=\"270\">主题相应，现行编次不同</text>\n<text x=\"460\" y=\"343\">数目原则相近，层级不同</text>\n</g>\n<rect x=\"655\" y=\"405\" width=\"220\" height=\"32\" rx=\"4\" fill=\"none\" stroke=\"currentColor\" stroke-dasharray=\"3 4\" opacity=\"0.45\"/>\n<text x=\"765\" y=\"426\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"currentColor\">小部 Khuddaka：不在此四组等式内</text>\n<text x=\"45\" y=\"426\" font-size=\"11\" fill=\"currentColor\" opacity=\"0.65\">比较单位：具体经文的段落与语境，而非部名。</text>\n</svg>\n<figcaption style=\"font-size:0.78em;color:var(--text2,#777);margin-top:8px;line-height:1.7\">图 1｜四组近缘关系。箭头只表示存在可供核对的平行材料，不表示逐部翻译、一一同构或共同成书。巴利经藏另有小部；梵语、犍陀罗语、藏译与其他汉译残卷也不在这四栏之内。依据 CBETA 平行注及 SuttaCentral 部类结构整理，访问日期：2026-11-24。</figcaption>\n<div class=\"en-line\" style=\"font-size:.95em\">EN — Four near-correspondence groups: the Chinese Dīrgha, Madhyama, Saṃyukta, and Ekottara Āgamas with the Pāli Dīgha (DN), Majjhima (MN), Saṃyutta (SN), and Aṅguttara (AN) Nikāyas respectively. Dashed arrows indicate parallel materials available for comparison, not collection-by-collection translation, one-to-one isomorphism, or common compilation. The Khuddaka Nikāya lies outside these four equations; Sanskrit, Gandhari, Tibetan, and other Chinese fragmentary translations also lie outside the four columns. Compiled from CBETA parallel-reference notes and SuttaCentral collection structure; access date: 2026-11-24.</div>\n</figure>\n\n### 2.小部不在四组等式中\n\n巴利经藏除前四尼柯耶外，还有小部 *Khuddaka Nikāya*。其中《法句经》《自说经》《如是语经》《经集》《本生经》等作品，在汉语佛典中并非完全消失，而是以独立经典或不同编译形式保存。《法句经》有汉译，《本生故事》也以《生经》《六度集经》《贤愚经》等形式进入汉传文献。<a href=\"#ref-a2\" style=\"color:var(--blue)\">[A2]</a><a href=\"#ref-b1\" style=\"color:var(--blue)\">[B1]</a>\n\n所以，四阿含与巴利前四尼柯耶的对应，只是经藏比较的一条主线。它不是全部经藏比较，更不是早期佛教文献的全部。把四阿含读完，不等于读完了早期佛教。\n\n### 3.四阿含之外，还有别的阿含与残卷\n\n汉语佛典中还有《别译杂阿含经》等作品，可以补充《杂阿含经》的平行材料。除此之外，梵语《长阿含》残卷、其他部派的《杂阿含》文本、犍陀罗语材料以及藏译残卷，都说明早期佛教的经藏世界比“汉传四阿含”和“巴利四尼柯耶”两栏更宽。<a href=\"#ref-b1\" style=\"color:var(--blue)\">[B1]</a><a href=\"#ref-b3\" style=\"color:var(--blue)\">[B3]</a>\n\n这些材料并不总能直接拼成一条完整传承线。有的只剩断片，有的无法确定部派归属，有的只能证明某一段落曾在不同地区流传。它们的作用，是提醒我们：现存四阿含不是原始文本的透明复制品，巴利本也不是唯一的时间标本。\n\n### 4.比较时应守的四条纪律\n\n第一，先确定版本。汉译用哪一版本，巴利用哪一版，页码或编号怎样，都要先写清楚。\n\n第二，先找段落，再谈部类。标题相似、品名相同，都不能代替逐段核对。\n\n第三，把翻译差异与传承差异分开。一个词义不同，可能是译者选择；一段经文有无，则可能涉及传承、编次或保存状态。二者不可混为一谈。\n\n第四，不把沉默当作证据。某本没有一段文字，只能说明现存本没有这段文字，不能直接证明该传统从未有过，也不能反推另一本必然更原始。〔本文判断〕\n\n这四条纪律比“哪一部更接近佛说”更有操作性。它们让比较可以复查，也让分歧可以保留，而不是用一个标签替所有差异作结。\n\n### 5.把“平行”写成可复查的记录\n\n平行文本研究最容易在结论处失去分寸。经名一旦配上，仿佛整部经的关系也已确定；某一段相近，又容易被扩写成两部经典基本相同。较稳妥的办法，是给每组比较留下六项记录：所用版本、汉译位置、巴利编号、对应层级、已核差异、尚不能判断的事项。\n\n以前文已经出现的几组材料为例，可以这样限定结论：\n\n| 比较对象 | 目前可以记录的关系 | 不能直接推出 |\n|---|---|---|\n| 《长阿含经·善生经》与 DN 31 | CBETA 平行注标明 DN 31，可进入逐段对读 | 六方次序与每项责任完全相同 |\n| 《中阿含经·分别圣谛经》与 MN 141 | CBETA 平行注标明 MN 141，可进入逐段对读 | 仅凭四圣谛主题相同，即判定与 SN 56.11 为同本异译 |\n| 《长阿含经·世记经》与 DN 27 | 可核对部分宇宙论材料 | 两部经整体一一对应 |\n| 《长阿含经·转轮圣王修行经》与 DN 26 | 平行注所列主要对应 | 两经的每一段都有相同功能 |\n| 《杂阿含经·阐陀经》与 SN 22.90 | CBETA 平行注标明 SN 22.90，病中观察五蕴的平行材料 | 两经的每一段都有相同功能 |\n\n表中只把已经确认的部分写入“关系”一栏，把待核部分留在右栏。这样做并不会降低文章的判断力，反而使判断有了边界。比较的深度不取决于结论喊得多响，而取决于差异定位得多准。〔本文判断〕\n\n实际记录时，还应把差异分成四类。词义差异是一个术语在两种语言中如何落实；段落差异是某一段有无或合并；次序差异是相同材料怎样排列；新增材料则是某一本多出的叙事、解释或诗句。四类可以并存，不能用一个“版本不同”全部打发。若暂时不能判断差异源于翻译选择还是传承分岔，就写“未定”，不要急于替古人作决定。\n\n> **EN corresponding · VIII. The Chinese Four Āgamas and the Pāli Four Nikāyas: Comparable, Not Equivalent**\n>\n> **1. Four groups of close correspondence**\n>\n> | Chinese collection | Closely related Pāli collection | Degree of correspondence | Limitations that must not be ignored |\n> |---|---|---|---|\n> | Dīrgha-āgama | Dīrgha Nikāya (DN) | Many parallel narratives and long expositions | The two differ in selection, arrangement, and details; the Dīrgha-āgama is not a Chinese translation of the Dīrgha Nikāya |\n> | Madhyama-āgama | Majjhima Nikāya (MN) | The closest pair among the four groups | Their extents differ—222 and 152 discourses—and the Madhyama also has cross-collection correspondences with the DN and SN |\n> | Saṃyukta-āgama | Saṃyutta Nikāya (SN) | Extensive parallels in short texts and themes | The Chinese translation’s order differs from the SN’s fifty-six Saṃyuttas, and chapter numbers cannot be imposed mechanically |\n> | Ekottara-āgama | Aṅguttara Nikāya (AN) | Clearly similar principles of numerical arrangement | The fifty-two Chinese chapters and the eleven Pāli major divisions occupy different levels, as do their units of aggregation |\n>\n> “Degree of correspondence” is a generalization made here for the convenience of readers, not a quantifiable score of kinship. It indicates only where parallel material is relatively easy to find; it does not judge which collection is older, more complete, or more orthodox.\n>\n> **2. The Khuddaka Nikāya lies outside the four equations**\n>\n> In addition to the first four Nikāyas, the Pāli Sutta Piṭaka contains the *Khuddaka Nikāya*. Works within it—including the *Dhammapada*, *Udāna*, *Itivuttaka*, *Sutta Nipāta*, and *Jātaka*—have not disappeared entirely from Chinese Buddhist literature but have been preserved as independent texts or in different forms of compilation. The *Dhammapada* has a Chinese translation, and Jātaka stories also entered Chinese literature in such works as the *Sheng jing* (《生经》), *Liudu jijing* (《六度集经》), and *Xianyu jing* (《贤愚经》). [A2] [B1]\n>\n> The correspondence between the four Āgamas and the first four Pāli Nikāyas is therefore only a main line in comparing canonical collections. It is not the whole of such comparison, still less the whole of early Buddhist literature. To read the four Āgamas is not to have read all of early Buddhism.\n>\n> **3. Beyond the four Āgamas: other Āgamas and fragments**\n>\n> Chinese Buddhist literature also contains works such as the *Bieyi za ahan jing* (《别译杂阿含经》), which can supplement the parallel material for the Saṃyukta-āgama. Beyond these, Sanskrit fragments of a Dīrgha-āgama, Saṃyukta texts from other schools, Gandhari materials, and Tibetan fragments all show that the world of early Buddhist canonical collections was broader than the two columns “Chinese four Āgamas” and “Pāli four Nikāyas.” [B1] [B3]\n>\n> These materials cannot always be fitted directly into one continuous line of transmission. Some survive only as fragments, some cannot be assigned to a school with certainty, and some establish only that a passage circulated in different regions. Their role is to remind us that the extant four Āgamas are not transparent copies of original texts, nor is the Pāli recension the sole temporal specimen.\n>\n> **4. Four disciplines for comparison**\n>\n> First, establish the edition. Specify which Chinese edition and which Pāli edition are being used, together with page or reference numbers.\n>\n> Second, find passages before discussing collections. Similar titles and identical chapter names cannot replace passage-by-passage collation.\n>\n> Third, distinguish translation differences from lineage differences. A difference in word meaning may result from a translator’s choice; the presence or absence of a passage may concern transmission, arrangement, or preservation. The two cannot be conflated.\n>\n> Fourth, do not treat silence as evidence. That a text lacks a passage shows only that the extant text lacks it. It does not directly prove that the tradition never possessed it, nor does it conversely prove that another text must be more original. 〔This essay’s judgment〕\n>\n> These four disciplines are more practicable than asking “Which collection is closer to the Buddha’s word?” They make comparison reviewable and allow disagreement to remain, rather than using one label to settle every difference.\n>\n> **5. Writing “parallel” as a reviewable record**\n>\n> Research on parallel texts most easily loses proportion at the point of conclusion. Once titles are paired, the relationship between whole collections seems settled; the similarity of one passage is easily inflated into the claim that two texts are basically the same. A more cautious procedure is to leave six records for each comparison: edition used, Chinese location, Pāli reference, level of correspondence, verified differences, and matters that remain undetermined.\n>\n> Taking several groups of material already discussed as examples, conclusions can be limited as follows:\n>\n> | Objects of comparison | Relationship that can presently be recorded | What cannot be inferred directly |\n> |---|---|---|\n> | *Dīrgha-āgama · Shansheng jing* and DN 31 | CBETA’s parallel note identifies DN 31, so passage-by-passage comparison may begin | That the order of the six directions and every responsibility are entirely identical |\n> | *Madhyama-āgama · Fenbie shengdi jing* and MN 141 | CBETA’s parallel note identifies MN 141, so passage-by-passage comparison may begin | That a shared theme of the four noble truths alone proves SN 56.11 to be a different translation of the same textual original |\n> | *Dīrgha-āgama · Shiji jing* and DN 27 | Part of the cosmological material can be compared | That the two texts correspond one to one as wholes |\n> | *Dīrgha-āgama · Zhuanlun shengwang xiuxing jing* and DN 26 | The principal correspondence listed in the parallel notes | That every passage in the two texts has the same function |\n> | *Saṃyukta-āgama · Chantuó jing* and SN 22.90 | CBETA’s parallel note identifies SN 22.90 and parallel material on contemplating the five aggregates during illness | That every passage in the two texts has the same function |\n>\n> The table places only what has been confirmed in the “relationship” column and leaves what requires checking in the right-hand column. This does not weaken the essay’s judgments; it gives them boundaries. The depth of comparison depends not on how loudly a conclusion is announced but on how precisely differences are located. 〔This essay’s judgment〕\n>\n> In an actual record, differences should be divided into four types. A semantic difference concerns how a term is realized in two languages; a passage difference concerns the presence, absence, or merging of a passage; a sequence difference concerns how shared material is arranged; and additional material consists of narrative, explanation, or verses found in one text but not the other. These four types can coexist and cannot all be dismissed as “a difference in version.” If it is not yet possible to determine whether a difference arises from translation choices or lineage divergence, record it as “undetermined” rather than deciding prematurely on behalf of earlier writers.\n\n## 九、阅读路径：从哪一部开始\n\n四阿含不是必须按长、中、杂、增壹顺序读的四册课本。不同的读者可以带着不同问题进入。下表给出几条主题路线，巴利文本用于并读，不用于取代汉译。\n\n| 问题 | 汉传起点 | 巴利并读 | 读时要注意 |\n|---|---|---|---|\n| 四圣谛与灭苦 | 《中阿含经·分别圣谛经》、《杂阿含经·转法轮经》 | SN 56.11–12 | 谛不是四条口号，要连着看执取、修行与结果 |\n| 四念处与身体观察 | 《中阿含经·念处经》 | MN 10 | 念处是完整的修习框架，不只是注意呼吸 |\n| 十二缘起 | 《长阿含经·大缘方便经》、《中阿含经·大因经》、《杂阿含经》因缘诸经 | DN 15、SN 12 | 不同经典对环节的展开与组合不同 |\n| 空与中道 | 《中阿含经·箭喻经》《大空经》 | MN 63、MN 122 | 不要把“空”读成一句否定口号 |\n| 在家伦理 | 《长阿含经·善生经》《中阿含经·善生经》 | DN 31 | 同时看两篇汉译，比较详略与措辞 |\n| 佛陀传记与入灭 | 《长阿含经·游行经》《大本经》 | DN 16、DN 14 | 叙事结构、插话与细节都可能是研究线索 |\n| 数目化教义与精进 | 《增壹阿含经》十念品、四谛品、四意断品 | AN 相应数目类 | 数目相同不等于经文相同 |\n| 短经与概念网络 | 《杂阿含经》按主题连读十至二十经 | SN 相应主题 | 不要只读单篇格言，要看相邻经文的条件 |\n\n### 1.初学者的三本书\n\n如果只选三部，可以先读《中阿含经·分别圣谛经》，建立苦、集、灭、道的基本问题；再读《中阿含经·念处经》，看禅修如何落实；最后读《长阿含经·善生经》，把伦理放回日常关系。\n\n这三部都不是最短的经典，却分别覆盖教义、修行和生活。读完以后，再进入《杂阿含经》的短经网络，会比直接面对一千三百六十二经更有方向。\n\n### 2.愿意做文本比较的读者\n\n做比较时，不妨每次只处理一组：先读汉译，再读巴利平行文本，把差异分成四类，即词义、段落、次序和新增材料。不要一边读一边给某一方打“更原始”的分数。差异本身已经是成果。\n\n例如《善生经》两篇汉译可以与 DN 31 对读。先看六方关系的列举次序，再看每项责任的具体行为，最后看结尾的归趣。这样得到的是可描述的文本差异，而不是一句笼统的“基本相同”。\n\n### 3.把四阿含当工具书\n\n读第二遍时，可以为四阿含建立自己的索引。按四圣谛、缘起、念处、空、业、伦理、禅定、弟子、天众等主题记录经号和段落，再与巴利尼柯耶交叉链接。个人索引不会替代目录，却能帮助读者看见一个概念如何在不同部类中移动。\n\n### 4.一份可复用的阅读记录\n\n选一部经精读，可以分三遍。第一遍只记场景与问题：谁在说，向谁说，起因是什么，最后收到什么效果。第二遍才拆论证，把定义、比喻、条件与结论分别列出。第三遍若有平行文本，再核对相同材料的位置与措辞。三遍分开，可以避免边读边把解释当成原文。\n\n以《善生经》为例，第一遍得到的是善生与佛陀的问答，以及六种关系；第二遍要记下每方双方各列几项责任，哪些行为重复出现；第三遍才与 DN 31 比较次序、项目与措辞。若第一遍就忙着判断两经高下，读者很可能只看见自己想找的差异。\n\n一张经卡不必复杂，至少应有八栏：经名与编号、所用版本、卷次页码、场景、核心问题、关键段落、平行文本、未决问题。最后两栏不能空着，也不可事后自行补全。没有查到平行文本，可以写“本次未检得”；尚不能判断，可以写“未定”。一张诚实的经卡，比十条未经核对的“对应关系”更有长期价值。\n\n如果读的是杂阿含的短经，经卡还应加一栏“相邻经”。前文卷首三经便是例子：第二经解释第一经，第三经从反面补足，单看任何一经都不如连读清楚。若读的是增壹阿含，则加记品题与数目，因为相同的数目会把不同主题放在一起，必须依靠品题与正文重新分辨。〔本文判断〕\n\n> **EN corresponding · IX. Reading Routes: Where to Begin**\n>\n> The four Āgamas are not four textbooks that must be read in the order Dīrgha, Madhyama, Saṃyukta, and Ekottara. Different readers may enter with different questions. The following table offers several thematic routes. Pāli texts are for concurrent reading, not for replacing the Chinese translations.\n>\n> | Question | Chinese starting point | Pāli companion reading | What to note while reading |\n> |---|---|---|---|\n> | The four noble truths and the cessation of suffering | *Madhyama-āgama · Fenbie shengdi jing*; *Saṃyukta-āgama · Zhuan falun jing* | SN 56.11–12 | The truths are not four slogans; clinging, practice, and result must be read together |\n> | The four establishments of mindfulness and observation of the body | *Madhyama-āgama · Nianchu jing* | MN 10 | The establishments of mindfulness are a complete framework of practice, not merely attention to breathing |\n> | Dependent origination | *Dīrgha-āgama · Dayuan fangbian jing*; *Madhyama-āgama · Dayin jing*; texts on dependent origination in the *Saṃyukta-āgama* | DN 15, SN 12 | Different texts develop and combine the links differently |\n> | Emptiness and the middle way | *Madhyama-āgama · Jianyu jing* and *Dakong jing* | MN 63, MN 122 | “Emptiness” must not be read as a single negating slogan |\n> | Lay ethics | *Dīrgha-āgama · Shansheng jing* and *Madhyama-āgama · Shansheng jing* | DN 31 | Read both Chinese texts and compare their detail and wording |\n> | The Buddha’s biography and passing away | *Dīrgha-āgama · Youxing jing* and *Daben jing* | DN 16, DN 14 | Narrative structure, interludes, and details may all be research clues |\n> | Numerical doctrine and diligence | The Ten Recollections, Four Noble Truths, and Four Right Efforts chapters of the *Ekottara-āgama* | The corresponding numerical divisions of the AN | The same number does not mean the same text |\n> | Short texts and conceptual networks | Read ten to twenty *Saṃyukta-āgama* texts consecutively by theme | Texts on corresponding themes in the SN | Do not read only isolated aphorisms; examine the conditions in adjacent texts |\n>\n> **1. Three texts for beginners**\n>\n> If only three texts are to be selected, begin with the *Madhyama-āgama · Fenbie shengdi jing* to establish the basic problem of suffering, its origin, cessation, and path. Then read the *Nianchu jing* to see how meditation is put into practice. Conclude with the *Dīrgha-āgama · Shansheng jing* to return ethics to everyday relationships.\n>\n> These are not the shortest texts, but they cover doctrine, practice, and life respectively. After reading them, entering the network of short texts in the Saṃyukta-āgama will provide more direction than confronting all 1,362 discourses at once.\n>\n> **2. For readers willing to undertake textual comparison**\n>\n> In comparison, it is useful to handle only one pair at a time: first read the Chinese translation, then the Pāli parallel, and divide differences into four types—semantic, passage, sequence, and additional material. Do not award either side a score for being “more original” while reading. The differences themselves are already a result.\n>\n> The two Chinese versions of the *Shansheng jing*, for example, may be read with DN 31. First examine the order in which the six relationships are listed; next examine the concrete actions attached to each responsibility; finally examine the concluding orientation. What emerges is a describable textual difference, not the vague statement “basically the same.”\n>\n> **3. Using the four Āgamas as reference works**\n>\n> On a second reading, readers may build their own index to the four Āgamas. Record discourse numbers and passages under themes such as the four noble truths, dependent origination, the establishments of mindfulness, emptiness, karma, ethics, concentration, disciples, and devas, and cross-link them with the Pāli Nikāyas. A personal index does not replace a catalog, but it can help readers see how a concept moves among different collections.\n>\n> **4. A reusable reading record**\n>\n> For close reading of one text, three passes are possible. In the first, record only setting and question: who is speaking, to whom, for what reason, and with what eventual result. In the second, analyze the argument, listing definitions, similes, conditions, and conclusions separately. In the third, if a parallel text exists, check the location and wording of shared material. Keeping the passes separate helps prevent interpretation from being mistaken for the text itself during reading.\n>\n> Taking the *Shansheng jing* as an example, the first pass yields the exchange between Shansheng and the Buddha and the six relationships; the second records how many responsibilities each side lists under each direction and which actions recur; the third compares order, items, and wording with DN 31. If the reader begins by ranking the two texts, they will probably see only the differences they were looking for.\n>\n> A discourse card need not be complicated, but it should have at least eight columns: title and number, edition used, fascicle and page, setting, central question, key passages, parallel texts, and unresolved questions. The last two columns must not be left blank or later filled in arbitrarily. If no parallel text has been found, one may write “not found in this search”; if a judgment cannot yet be made, one may write “undetermined.” An honest discourse card has greater long-term value than ten unchecked “correspondences.”\n>\n> If the text being read is a short Saṃyukta discourse, add a column for “adjacent texts.” The three texts at the opening are an example: the second explains the first, and the third complements it from the reverse direction; no one of the three is as clear alone as when read continuously. For an Ekottara text, also record the chapter title and number, because identical numbers can bring different themes together and the title and body must be used to distinguish them. 〔This essay’s judgment〕\n\n## 十、未竟边界\n\n本文的范围是概念辨析与四阿含导读，不是四阿含的完整校勘，也不是早期佛教文献史的全部。以下事项需要另外的长时程工作：\n\n- 逐篇建立四阿含与巴利尼柯耶的平行文本表，并标明直接对应、局部对应和仅主题相近；\n- 对《杂阿含经》的编次、《增壹阿含经》的系统差异以及各部派归属作更细的文本史讨论；\n- 纳入梵语、犍陀罗语、藏译和其他汉译残卷，形成多语对勘；\n- 对关键概念作跨译本词频与语义比较，并公开计数口径和文本范围；\n- 将南传注释、论藏与汉传阿含论书分开处理，避免把后世解释直接读回早期经文。\n\n这些未竟事项不会削弱四阿含的价值。它们只是提醒读者，文本地图可以指路，却不能代替走完每一条路。\n\n> **EN corresponding · X. Unfinished Boundaries**\n>\n> The scope of this essay is conceptual clarification and a guide to reading the four Āgamas. It is neither a complete critical edition of the four collections nor the whole of the textual history of early Buddhist literature. The following tasks require separate, long-term work:\n>\n> - Establish parallel-text tables text by text, marking direct correspondences, partial correspondences, and thematic similarity alone;\n> - Undertake more detailed research in textual history on the arrangement of the Saṃyukta-āgama, the systematic differences in the Ekottara-āgama, and their school affiliations;\n> - Incorporate Sanskrit, Gandhari, Tibetan, and other Chinese fragments to produce a multilingual collation;\n> - Conduct cross-translational studies of word frequency and semantics for key concepts, making public the counting method and textual scope;\n> - Treat Theravāda commentaries, the Abhidhamma, and Chinese treatises on the Āgamas separately, so that later interpretations are not read directly back into early scriptures.\n>\n> These unfinished tasks do not diminish the value of the four Āgamas. They merely remind readers that a textual map can point the way but cannot substitute for walking every road.\n\n## 十一、结语：从标签回到文本\n\n四阿含不是四个封闭的盒子，而是四条进入早期佛教文献的门。长阿含展开世界与叙事，中阿含组织概念与修行，杂阿含积累短经与问题，增壹阿含用数目把材料重新排列。它们共同保存了早期佛教传统的多个侧面，也共同经历了翻译、编次和传承的筛选。\n\n“小乘”“南传”“上座部”“巴利”“阿含”各有自己的问题意识。把五者分开，并不是要把它们割裂，而是为了在真正需要比较时，知道比较的是什么。标签可以帮助入门，却不能让不同的文本自动相同。读法回到版本、段落和语境，四阿含的地图才会逐渐变得清楚。每确认一处段落关系，便把一处笼统印象改成可以继续追问的材料。\n\n> **EN corresponding · XI. Conclusion: From Labels Back to Texts**\n>\n> The four Āgamas are not four closed boxes but four doorways into the literature of early Buddhism. The Dīrgha unfolds worlds and narrative; the Madhyama organizes concepts and practice; the Saṃyukta accumulates short texts and questions; and the Ekottara rearranges material through number. Together they preserve multiple aspects of early Buddhist traditions, and together they have undergone the filtering of translation, arrangement, and transmission.\n>\n> “Hīnayāna,” “Southern transmission,” “Theravāda,” “Pāli,” and “Āgama” each have their own questions and concerns. Separating the five does not mean tearing them apart; it enables us to know what is being compared when comparison is genuinely needed. Labels may help a beginner enter, but they cannot make different texts automatically identical. When reading returns to editions, passages, and contexts, the map of the four Āgamas gradually becomes clearer. Each confirmed passage relationship replaces one vague impression with material on which further questions can be asked.\n\n## 参考来源与版本说明\n\n> 信度分级：**[A]** 一手／权威电子版本 · **[B]** 学术专著与研究 · **[C]** 线索／待核。本文未把网络百科、检索摘要或出版预告用作论断依据；纸本来源以书目信息定位，不伪造链接。在线来源访问日期均为 **2026-11-24**。\n\n### A. 原典与权威电子版本\n\n- <a id=\"ref-a1\"></a>**[A1]** CBETA 电子佛典集成：《长阿含经》[T01n0001](https://cbetaonline.dila.edu.tw/zh/T01n0001)、《中阿含经》[T01n0026](https://cbetaonline.dila.edu.tw/zh/T01n0026)、《杂阿含经》[T02n0099](https://cbetaonline.dila.edu.tw/zh/T02n0099)、《增壹阿含经》[T02n0125](https://cbetaonline.dila.edu.tw/zh/T02n0125)。本文所引汉译经名、卷次、页码和经文，均以 CBETA 文本为准；结构计数另按本地 XML 的标记单元复算。\n- <a id=\"ref-a2\"></a>**[A2]** SuttaCentral：[巴利经藏入口](https://suttacentral.net/)。本文用 DN、MN、SN、AN 编号定位平行材料；编号只提供检索入口，具体平行程度仍须逐段核对。\n\n### B. 学术专著与研究\n\n- <a id=\"ref-b1\"></a>**[B1]** von Hinüber, Oskar. *A Handbook of Pāli Literature*. Berlin: de Gruyter, 1996. 用于巴利三藏、尼柯耶结构与文献层的基本区分。\n- <a id=\"ref-b2\"></a>**[B2]** Gethin, Rupert. *The Foundations of Buddhism*. Oxford: Oxford University Press, 1998. 用于早期佛教传统、部派与南传上座部的概览。\n- <a id=\"ref-b3\"></a>**[B3]** Anālayo. *A Comparative Study of the Majjhima-nikāya*. Taipei: Dharma Drum Publishing Corporation, 2011. 用于中阿含与巴利中部平行文本的方法与案例。\n- <a id=\"ref-b4\"></a>**[B4]** Anālayo. “The Historical Value of the Pāli Discourses.” *Indo-Iranian Journal* 55 (2012): 223–253. 用于讨论巴利经文的历史证据价值及其限制。\n- <a id=\"ref-b5\"></a>**[B5]** Wynne, Alexander. \"The Historical Authenticity of Early Buddhist Literature: A Critical Evaluation.\" *Wiener Zeitschrift für die Kunde Südasiens* 49 (2005): 35–70. 用于讨论早期佛教文献形成与文本可靠性问题。\n- <a id=\"ref-b6\"></a>**[B6]** Choong Mun-keat. *The Fundamental Teachings of Early Buddhism: A Comparative Study Based on the Sūtrāṅga Portion of the Pāli Saṃyutta-nikāya and the Chinese Saṃyuktāgama*. Wiesbaden: Harrassowitz Verlag, 2000. 用于杂阿含与巴利相应部的比较。\n- <a id=\"ref-b7\"></a>**[B7]** Bucknell, Roderick S. \"The Buddhist Path to Liberation: An Analysis of the Listing of Stages.\" *Journal of the International Association of Buddhist Studies* 7, no. 2 (1984): 7–40. 用于理解数目化编排与修行次第的关系。\n\n### C. 版本与判断边界\n\n本文的四组对应表、代表经典表和阅读路径属于整理性成果。表中“对应程度”与“阅读价值”不是原典自带标签，而是本文为帮助读者建立路线所作的分析判断。平行文本的存在不自动证明翻译关系，缺失也不自动证明某一传统没有相关教法。若读者需要逐字引用，请回到原典版本核对，不以本文转述代替原文。\n\n> **EN corresponding · References and Version Notes**\n>\n> Confidence levels: **[A]** primary texts / authoritative electronic editions; **[B]** scholarly monographs and research; **[C]** leads / items requiring verification. This essay does not use online encyclopedias, search abstracts, or publication announcements as evidence for its claims; print sources are identified bibliographically without fabricated links. The access date for all online sources is **2026-11-24**.\n>\n> **A. Primary texts and authoritative electronic editions**\n>\n> - **[A1]** CBETA Electronic Buddhist Text Collection: *Dīrgha-āgama* [T01n0001](https://cbetaonline.dila.edu.tw/zh/T01n0001), *Madhyama-āgama* [T01n0026](https://cbetaonline.dila.edu.tw/zh/T01n0026), *Saṃyukta-āgama* [T02n0099](https://cbetaonline.dila.edu.tw/zh/T02n0099), and *Ekottara-āgama* [T02n0125](https://cbetaonline.dila.edu.tw/zh/T02n0125). All Chinese discourse titles, fascicle numbers, pages, and quotations cited in this essay follow the CBETA texts; structural counts are separately recalculated from the markup units in the local XML.\n> - **[A2]** SuttaCentral: [Pāli Sutta Piṭaka portal](https://suttacentral.net/). This essay uses DN, MN, SN, and AN numbers to locate parallel material; the numbers provide retrieval points only, and the actual degree of parallel must still be checked passage by passage.\n>\n> **B. Scholarly monographs and research**\n>\n> - **[B1]** von Hinüber, Oskar. *A Handbook of Pāli Literature*. Berlin: de Gruyter, 1996. Used for basic distinctions among the Pāli Canon, the structure of the Nikāyas, and textual strata.\n> - **[B2]** Gethin, Rupert. *The Foundations of Buddhism*. Oxford: Oxford University Press, 1998. Used for an overview of early Buddhist traditions, schools, and Southern Theravāda.\n> - **[B3]** Anālayo. *A Comparative Study of the Majjhima-nikāya*. Taipei: Dharma Drum Publishing Corporation, 2011. Used for methods and cases in comparing the Madhyama-āgama with the Pāli Majjhima Nikāya.\n> - **[B4]** Anālayo. “The Historical Value of the Pāli Discourses.” *Indo-Iranian Journal* 55 (2012): 223–253. Used to discuss the historical evidential value of the Pāli discourses and its limitations.\n> - **[B5]** Wynne, Alexander. \"The Historical Authenticity of Early Buddhist Literature: A Critical Evaluation.\" *Wiener Zeitschrift für die Kunde Südasiens* 49 (2005): 35–70. Used to discuss the formation of early Buddhist literature and questions of textual reliability.\n> - **[B6]** Choong Mun-keat. *The Fundamental Teachings of Early Buddhism: A Comparative Study Based on the Sūtrāṅga Portion of the Pāli Saṃyutta-nikāya and the Chinese Saṃyuktāgama*. Wiesbaden: Harrassowitz Verlag, 2000. Used for comparison of the Saṃyukta-āgama with the Pāli Saṃyutta Nikāya.\n> - **[B7]** Bucknell, Roderick S. \"The Buddhist Path to Liberation: An Analysis of the Listing of Stages.\" *Journal of the International Association of Buddhist Studies* 7, no. 2 (1984): 7–40. Used to understand numerical arrangement in relation to sequences of practice.\n>\n> **C. Version and judgment boundaries**\n>\n> The table of four correspondences, the table of representative texts, and the reading routes in this essay are organizing results. “Degree of correspondence” and “value for reading” are not labels inherent in the primary texts; they are analytical judgments made here to help readers establish routes. The existence of a parallel text does not automatically prove a translation relationship, and absence does not automatically prove that a tradition lacked the relevant teaching. Readers who need verbatim citations should return to the primary-text editions and check them; this essay’s paraphrases must not substitute for the original wording.\n\n", "data_source": "", "data_pool": "practice", "back": {"tab": "jiaoxing", "label": "教行页 · 宗派与判教"}, "updated_at": "2026-11-26"};

// ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);
  }
}
function _applyArticleENMode(){
  var full=document.getElementById('article-full');
  var btn=document.getElementById('article-en-toggle');
  var hide=(sessionStorage.getItem('article_en_hide')||'')==='1';
  if(full) full.classList.toggle('en-hidden', hide);
  if(btn) btn.textContent=hide?'🌐 英文批注：展开':'🌐 英文批注：显示';
}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});

  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};

  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';

  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){

        s+='<div class="bi-stage"><div class="bi-stage-h">'

          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){

          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });

    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}

</script>
