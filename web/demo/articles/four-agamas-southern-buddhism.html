<script>
var ARTICLE = {"id": "four-agamas-southern-buddhism", "file": "articles/four-agamas-southern-buddhism.html", "title": "何谓“小乘”：南传佛教与四阿含", "title_sub": "从论辩标签到汉译经藏 · 四部结构 · 代表经典 · 汉巴对读", "title_en": "What Is Meant by “Hīnayāna”? Southern Buddhism and the Four Āgamas", "icon": "📄", "version": "", "meta": "", "doc": "docs/宗派研究/四阿含与南传佛教.md", "doc_md": "# 何谓“小乘”：南传佛教与四阿含的文本地图\n\n> **内容提要**：“小乘”常被当作“南传佛教”的旧称。这个用法在通俗介绍中很方便，却把历史称谓、地域传承、部派身份、经典语言和文献编次压成了一个词。本文先分开这几层关系，继而勾勒南传巴利三藏、注释传统与当代实践的轮廓，再以汉译《长阿含经》《中阿含经》《杂阿含经》《增壹阿含经》为中心，梳理各部的内容、结构、代表经典与阅读路径，并说明它们与巴利四部尼柯耶之间哪些地方可以对照，哪些地方不能等同。\n\n> **EN corresponding · Content Summary**\n>\n> Hīnayāna is often treated as an older name for Southern Buddhism. The usage is convenient in general introductions, but it compresses into one term historical labels, regional transmission, sectarian identity, scriptural language, and the arrangement of the canon. This essay first separates these levels, then outlines the Pāli Canon, commentarial tradition, and contemporary practice of Southern Buddhism, and then focuses on the Chinese translations of the Dīrgha-āgama, Madhyama-āgama, Saṃyukta-āgama, and Ekottara-āgama to map their contents, structures, representative texts, and reading routes. It also explains where they may be compared with the four Pāli Nikāyas and where they cannot be treated as equivalent.\n\n“小乘”常被当作“南传佛教”的旧称。这个用法在通俗介绍中很方便，却把几件不同的事压成了一个词：历史上的论战标签、地域上的传播路线、部派上的传承身份、经典使用的语言，以及经藏的编次。\n\n本文所说“南传佛教”，主要指由印度经斯里兰卡向东南亚传播、以巴利三藏和上座部传承为核心的佛教传统；所说“四阿含”，则专指汉译《长阿含经》《中阿含经》《杂阿含经》《增壹阿含经》。两者不在同一个层面上。把“小乘”直接换成“南传”，已经跨过了历史；再把“南传”直接换成“巴利四部”，又跨过了文献。〔本文判断〕\n\n所以，梳理四阿含，先要问的不是“哪一部更接近原始佛教”，而是：我们手上是哪一种语言的哪个本子，它在什么时候、由谁译出，经过怎样的编排，又可以与哪些其他文本核对。本文只做文本地图，不排宗派高下，也不把某一部文献当作全部佛教。\n\n> **EN corresponding · Opening Frame**\n>\n> The term Hīnayāna is often used as though it were an older name for Southern Buddhism. Convenient as this is in popular introductions, it collapses several distinct issues into one word: a polemical label in history, geographical routes of transmission, identities of lineage and school, the languages of the scriptures, and the arrangement of the canonical collections.\n>\n> In this essay, “Southern Buddhism” refers primarily to the Buddhist tradition transmitted from India through Sri Lanka to Southeast Asia, centered on the Pāli Canon and the Theravāda lineage. “The four Āgamas” refers specifically to the Chinese translations of the Dīrgha-āgama (《长阿含经》), Madhyama-āgama (《中阿含经》), Saṃyukta-āgama (《杂阿含经》), and Ekottara-āgama (《增壹阿含经》). The two do not operate on the same level. To replace “Hīnayāna” directly with “Southern Buddhism” is already to cross historical boundaries; to replace “Southern Buddhism” directly with “the four Pāli Nikāyas” is to cross textual ones. 〔This essay’s judgment〕\n>\n> Accordingly, the first question in mapping the four Āgamas is not “Which collection is closest to early Buddhism?” but: Which language and recension do we have? When and by whom was it translated? How was it arranged, and against what other texts may it be checked? This essay offers only a textual map: it does not rank schools, nor does it treat any one collection as the whole of Buddhism.\n\n## 一、先把五个层次分开\n\n### 1.“小乘”：一个会移动的标签\n\n“小乘”对应梵语 *Hīnayāna*。在汉语佛教的论辩史上，它多由大乘论者使用，用来标记那些被认为不究竟、不圆满的教法或修行传统。这个术语因此带着明显的评价色彩。后来一些目录和论书又把它当作分类用语，语气才有所缓和。<a href=\"#ref-b2\" style=\"color:var(--blue)\">[B2]</a>\n\n评价色彩不等于每个出现处都能读成辱称。某些文本是在宗派论战中使用它，某些是在说明教法次第时使用它，某些只是沿袭目录分类。阅读时要看它由谁说、对谁说、回答什么问题。抹掉这些语境，既会误读古人，也会让现代读者把一个论战标签误认成某个教团的正式名称。\n\n今天的学术写作因此常要换词。谈历史部派，可以直接说部派名称；谈巴利文献，可以说尼柯耶；谈不以大乘经典为权威的诸传统，可以用“非大乘佛教”作为描述性概念。只有讨论“小乘”这个词本身时，才有必要继续使用“小乘”。这不是避讳，而是把问题说准。\n\n### 2.“南传”与“上座部”：地域不等于部派\n\n“南传”是地域和传播路线的概括。佛教由印度向外传播，其中一条路线经斯里兰卡，再进入东南亚。今天谈南传佛教，通常主要指这一地区的上座部传统，它们以巴利三藏、戒律传承和本地注释传统为重要依托。\n\n“上座部”则是部派与传承身份。梵语 *Sthavira*、巴利语 *Theravāda* 都涉及“长老”这一名称。历史上的部派分化与今天东南亚的上座部传承不能简单画上等号，更不能把历史上所有非大乘部派都叫作上座部。十八部、二十部等传统说法，已经说明早期佛教内部并非只有两个整齐阵营。<a href=\"#ref-b2\" style=\"color:var(--blue)\">[B2]</a>\n\n地域、部派、语言三者可以相遇，却不能互相替代。一个传统可以处在南方，却不使用巴利；使用巴利的文献，也不自动等于今日上座部的全部实践。讨论文本时，最稳妥的说法是“南传上座部所保存的巴利经藏”，而不是把“南传”二字直接写进文本分类。\n\n### 3.“巴利三藏”与“尼柯耶”：总集不等于四部\n\n巴利三藏分律藏、经藏、论藏。律藏处理僧团生活与戒律，经藏保存佛陀言教的经文，论藏则对心、法、解脱等问题作系统分析。三部类的成书与编纂时间并不一致，不能把它们都当作同一时刻的一次性结集。<a href=\"#ref-b1\" style=\"color:var(--blue)\">[B1]</a>\n\n经藏 *Sutta Piṭaka* 又分五部尼柯耶：长部、中部、相应部、增支部和小部。前四部通常以篇幅或编排方式相互区别，小部则收入《法句经》《自说经》《本事经》《本生经》等多种作品。日常所说的“巴利四部”，只是经藏的前四部，不是巴利三藏的全部。<a href=\"#ref-a2\" style=\"color:var(--blue)\">[A2]</a><a href=\"#ref-b1\" style=\"color:var(--blue)\">[B1]</a>\n\n这也解释了为什么“四阿含等于四尼柯耶”是一个方便却不严密的等式。两者在比较佛学中确实常被配成四组，但汉语四阿含并不等于巴利前四尼柯耶的逐部翻译，更没有把小部全部包进去。\n\n### 4.“阿含”：汉译经藏的另一套目录\n\n“阿含”是汉语佛典对一类经藏的称谓。长、中、杂、增壹四部，分别提示了各自在现存汉译中的体量或组织特点：长部多长篇展开，中部多中等篇幅的论说，杂部多短篇汇编，增壹部则按数目编排。四部并不是四种教义，而是四种进入经藏的门径。\n\n四阿含也不是在印度某一次法会上被编成的一套同源丛书。它们在不同时间、由不同译者译成汉语，所依据的写本和传承也未必相同。把它们合称为“四阿含”，是汉语佛典编次和后世目录共同作用的结果。目录能告诉我们文本如何被保存，却不会自动还原文本最初如何形成。\n\n### 5.五个层次速查\n\n| 名称 | 所属层次 | 可以说明什么 | 不能直接推出什么 |\n|---|---|---|---|\n| 小乘 | 历史论辩标签 | 汉语佛教中相对于大乘的评价性、分类性用语，具体语境有别 | 不等于南传、上座部或巴利经藏 |\n| 南传 | 地域与传播路线 | 经斯里兰卡向东南亚传播的佛教传统 | 不是文本部类，也不保证语言一致 |\n| 上座部 | 部派与传承身份 | *Theravāda* 这一传统及其戒律、经典传承 | 不等于全部非大乘部派 |\n| 巴利三藏 | 语言与文献总集 | 律、经、论三部类构成的经典总集 | 四尼柯耶只是经藏的一部分 |\n| 四阿含 | 汉译经藏部类 | 汉译长、中、杂、增壹四部经 | 不等于巴利四部的逐经翻译 |\n\n这张表最重要的地方，是最后一列。本文后面的所有比较，都从“不能直接推出”开始：不把一个标签变成另一个标签的证明。\n\n### 6.术语辨异：不把译名当成本名\n\n几个常用词还横跨汉语、梵语与巴利语，阅读英文研究时尤其容易混同。\n\n| 本文用词 | 语言层次 | 词义指向 | 常见误用 |\n|---|---|---|---|\n| 小乘 | 汉语译名，对应梵语 *Hīnayāna* | 带有评价历史的论辩与分类用语 | 当作某个教团的正式自称 |\n| 南传 | 汉语地域概念 | 经斯里兰卡向东南亚传播的路线与传统 | 当作经典部类或语言名称 |\n| 上座部 | 部派与传承名称，巴利语 *Theravāda* | 今日南传上座部的传承身份 | 涵盖历史上全部非大乘部派 |\n| 阿含 | 汉语经藏概念，对应 *Āgama* 一类传承 | 汉译经藏的部类与文本集合 | 与某一部巴利尼柯耶逐一画等号 |\n| 尼柯耶 | 巴利语 *Nikāya* 的汉语音译 | 巴利经藏中的部类与编排 | 与汉语“经”的计数单位混同 |\n| 经／*sutta* | 汉语翻译单元与巴利语文本单元 | 一部经或一组宣说，具体边界随本子而定 | 用经数直接比较文献完整度 |\n\n这里最需要克制的是“正名”。指出一个词有历史，并不等于可以替所有古人重新选择称呼；说明一个标签含混，也不等于所有使用它的人都在辱骂对方。本文区分这些词，是为了让今天的论述不继续增加混淆，而不是把历史上的复杂用法一笔抹掉。〔本文判断〕\n\n> **EN corresponding · I. Distinguishing Five Levels**\n>\n> **1. “Hīnayāna”: a label that moves**\n>\n> The Chinese term “小乘” corresponds to Sanskrit *Hīnayāna*. In the history of Buddhist debate in Chinese, it was used mainly by Mahāyāna proponents to mark teachings or practice traditions considered not ultimate or not complete. The term therefore carries an unmistakable evaluative charge. Some later catalogs and treatises used it as a classificatory term, which somewhat moderated its tone. [B2]\n>\n> Evaluative coloring does not mean that every occurrence can be read as an insult. Some texts use it in sectarian polemic, some in explaining the sequence of teachings, and some merely inherit a catalog classification. Reading requires attention to who uses it, to whom, and in response to what question. Erasing these contexts both misreads earlier writers and leads modern readers to mistake a polemical label for a community’s formal name.\n>\n> Academic writing today therefore often changes terms. When discussing historical schools, one may name the schools directly; when discussing Pāli texts, one may speak of Nikāyas; when discussing traditions that do not regard Mahāyāna scriptures as authoritative, “non-Mahāyāna Buddhism” can serve as a descriptive concept. Only when discussing the term “Hīnayāna” itself is it necessary to continue using it. This is not avoidance but precision.\n>\n> **2. “Southern transmission” and “Theravāda”: region is not school**\n>\n> “Southern transmission” is a geographical and historical summary. One route by which Buddhism spread outward from India passed through Sri Lanka and then into Southeast Asia. Today, “Theravāda Buddhism” usually refers primarily to the Theravāda traditions of this region, which rely importantly on the Pāli Canon, the Vinaya lineage, and local commentarial traditions.\n>\n> “Theravāda,” by contrast, is an identity of school and lineage. Both Sanskrit *Sthavira* and Pāli *Theravāda* involve the name “elders.” The historical divisions into schools cannot simply be equated with today’s Theravāda lineages in Southeast Asia, still less can all historically non-Mahāyāna schools be called Theravāda. Traditional accounts of eighteen or twenty schools already show that early Buddhism did not consist of only two neatly bounded camps. [B2]\n>\n> Region, school, and language may meet, but none can replace another. A tradition may be southern without using Pāli; a Pāli text does not automatically amount to the whole of contemporary Theravāda practice. In textual discussion, the soundest formulation is “the Pāli canonical collection preserved by the Southern Theravāda tradition,” rather than writing “southern” directly into a textual classification.\n>\n> **3. “The Pāli Canon” and “the Nikāyas”: a whole is not four collections**\n>\n> The Pāli Canon is divided into the Vinaya Piṭaka, Sutta Piṭaka, and Abhidhamma Piṭaka. The Vinaya deals with communal life and discipline; the Sutta preserves discourses of the Buddha’s teaching; and the Abhidhamma offers systematic analyses of such questions as mind, phenomena, and liberation. These three collections did not take shape or become canonized at the same time, and they cannot all be treated as the product of a single council at one moment. [B1]\n>\n> The Sutta Piṭaka is further divided into five Nikāyas: the Dīrgha Nikāya (Long Discourses), Majjhima Nikāya (Middle Discourses), Saṃyutta Nikāya (Connected Discourses), Aṅguttara Nikāya (Numerical Discourses), and Khuddaka Nikāya. The first four are generally distinguished from one another by length or arrangement, while the Khuddaka contains such varied works as the *Dhammapada*, *Udāna*, *Itivuttaka*, and *Jātaka*. What is called the “four Pāli Nikāyas” in ordinary usage is only the first four collections of the Sutta Piṭaka, not the whole Pāli Canon. [A2] [B1]\n>\n> This also explains why “the four Āgamas equal the four Nikāyas” is convenient but imprecise. In comparative Buddhist studies the two sets are indeed often paired into four groups, but the Chinese four Āgamas are not collection-by-collection translations of the first four Pāli Nikāyas, nor do they include the whole of the Khuddaka.\n>\n> **4. “Āgama”: another catalog of the Chinese canonical collection**\n>\n> “Āgama” is a Chinese Buddhist designation for a class of canonical collections. The four collections—Dīrgha, Madhyama, Saṃyukta, and Ekottara—indicate their respective bulk or organizing features in the extant Chinese translations: the Dīrgha often develops long narratives, the Madhyama contains more medium-length expositions, the Saṃyukta is largely a compilation of short texts, and the Ekottara is arranged by number. The four are not four teachings but four ways into the canonical collection.\n>\n> The four Āgamas were not compiled in India at a single assembly as a cognate series. They were translated into Chinese at different times by different translators, and the manuscripts and traditions on which they drew were not necessarily the same. Grouping them as the “four Āgamas” resulted from the combined effects of arrangement within the Chinese canon and later catalogs. Catalogs can show how texts were preserved, but they do not automatically recover how those texts originally took shape.\n>\n> **5. A quick guide to the five levels**\n>\n> | Term | Level to which it belongs | What it can explain | What cannot be inferred directly |\n> |---|---|---|---|\n> | Hīnayāna | Historical polemical label | Evaluative and classificatory language in Chinese Buddhism relative to Mahāyāna, varying with context | It is not equivalent to Southern transmission, Theravāda, or the Pāli canonical collection |\n> | Southern transmission | Region and route of transmission | The Buddhist tradition transmitted through Sri Lanka to Southeast Asia | It is not a textual collection and does not guarantee linguistic uniformity |\n> | Theravāda | School and lineage identity | The *Theravāda* tradition and its Vinaya and canonical lineages | It is not equivalent to all non-Mahāyāna schools |\n> | Pāli Canon | Linguistic and textual whole | The canonical corpus composed of the Vinaya, Sutta, and Abhidhamma collections | The four Nikāyas are only one part of the Sutta Piṭaka |\n> | Four Āgamas | Collections within the Chinese canonical corpus | The Chinese Dīrgha, Madhyama, Saṃyukta, and Ekottara collections | They are not collection-by-collection or discourse-by-discourse translations of the four Pāli Nikāyas |\n>\n> The most important column in this table is the last. Every comparison below begins from what cannot be inferred directly: one label cannot be made the proof of another.\n>\n> **6. Distinguishing terms: translated names are not original names**\n>\n> Several common terms cross the Chinese, Sanskrit, and Pāli linguistic levels and are especially easy to confuse when reading English-language scholarship.\n>\n> | Term used in this essay | Linguistic level | What the term refers to | Common misuse |\n> |---|---|---|---|\n> | Hīnayāna | Chinese rendering corresponding to Sanskrit *Hīnayāna* | A polemical and classificatory term with an evaluative history | Treating it as a community’s formal self-designation |\n> | Southern transmission | Chinese geographical concept | The route and tradition transmitted through Sri Lanka to Southeast Asia | Treating it as a canonical collection or language name |\n> | Theravāda | School and lineage name; Pāli *Theravāda* | The lineage identity of contemporary Southern Theravāda | Extending it to all historically non-Mahāyāna schools |\n> | Āgama | Chinese canonical concept corresponding to *Āgama*-type traditions | Collections and textual groupings within the Chinese canonical corpus | Equating each one with a particular Pāli Nikāya |\n> | Nikāya | Chinese phonetic rendering of Pāli *Nikāya* | Collections and arrangements within the Pāli Sutta Piṭaka | Confusing it with the Chinese counting unit “discourse” |\n> | Discourse / *sutta* | Chinese unit of translation and Pāli textual unit | A discourse or group of teachings, whose boundaries vary by recension | Using discourse counts to compare the completeness of textual corpora directly |\n>\n> What most requires restraint here is “rectifying names.” Showing that a term has a history does not entitle us to choose anew for all earlier writers; showing that a label is ambiguous does not mean that everyone who used it was insulting an opponent. Distinguishing these terms is meant to prevent present-day discussion from adding further confusion, not to erase the complexity of their historical uses. 〔This essay’s judgment〕\n\n## 二、南传佛教：巴利三藏、注释传统与当代实践\n\n上一节把“南传”从“小乘”这个标签里分出来，只解决了名分。若要判断四阿含与南传文献能对照到什么程度，还须知道南传自己保存了什么、怎样解释、今天怎样实践。这一节只作轮廓，不作南传通史。\n\n### 1.巴利三藏的三分\n\n南传佛教的经典依据是巴利三藏：律藏、经藏、论藏。三分不是三个平行的书柜，而是三种功能不同的文献。\n\n律藏围绕僧团生活展开。核心是波罗提木叉（*Pātimokkha*），即半月诵戒时念诵的戒条；围绕它形成经分别、犍度与附随三部分。经分别逐条解释戒条，犍度规定僧团办事与日常生活的制度，附随则作分类整理。戒律不是外加的约束，而是僧团得以存续的制度条件。读南传而不读律，很容易把“南传”想成一种纯粹的个人禅修传统。\n\n经藏即五部尼柯耶：长部、中部、相应部、增支部、小部。前四部与汉译四阿含常被并置，正是本文下半部分要处理的对照范围；小部则收《法句经》《自说经》《如是语经》《经集》《本生经》等，体裁更杂，成书层次也不一。把“巴利经藏”等同于“四部尼柯耶”，会漏掉小部；把“巴利三藏”等同于“经藏”，又会漏掉律与论。<a href=\"#ref-a2\" style=\"color:var(--blue)\">[A2]</a><a href=\"#ref-b1\" style=\"color:var(--blue)\">[B1]</a>\n\n论藏有七部，传统上列为法聚、分别、界论、人施设、论事、双论、发趣。论藏把经中的概念重新按心、心所、色、涅槃等范畴组织，是南传阿毗达磨的骨干。《论事》相传出于第三次结集时的论辩，属于传统叙事，不宜直接当作现代史学结论〔待核〕。这一点须与汉传阿毗达磨分开：汉传的《俱舍论》《成实论》等属于说一切有部、经部等系统，与南传七论不是同一套文本。<a href=\"#ref-b1\" style=\"color:var(--blue)\">[B1]</a><a href=\"#ref-b2\" style=\"color:var(--blue)\">[B2]</a>\n\n巴利语本身也须说明。它是一种中古印度-雅利安语，与梵语同系而不同支，既不是“佛说的原语”，也不是某一国的土话。巴利三藏长期口传，传统上说公元前一世纪在斯里兰卡写定〔待核〕。从口传到书写，意味着现存文本之前还有一段看不见的传承史，不能把写定的时刻当作教法产生的时刻。\n\n### 2.觉音与注释传统\n\n南传不只有三藏，还有一层很厚的注释与论书。\n\n五世纪，觉音（*Buddhaghosa*）到斯里兰卡大寺派，依据当地僧伽罗语注释，写成巴利语的《清净道论》（*Visuddhimagga*），并为四部尼柯耶、律藏与部分论书作注〔待核〕。《清净道论》以戒、定、慧三学为骨架，讲四十业处、七清净、十六观智，是南传修行体系的纲要性著作。它不是经，却决定了后来南传读者怎样理解经。<a href=\"#ref-b1\" style=\"color:var(--blue)\">[B1]</a><a href=\"#ref-b2\" style=\"color:var(--blue)\">[B2]</a>\n\n注释传统提醒我们一件事：同一部经，在不同传承里可以有不同的“标准读法”。汉传读《念处经》，背后有天台、唯识的观法；南传读《大念处经》，背后有觉音一系的解释。文本相同或相近，解释框架未必相同。比较时若只对经文，不对注释，容易把后世的读法当成经文的原义。\n\n### 3.戒律、禅修与内观\n\n南传僧团以波罗提木叉为共同底线，以雨安居、布萨、受戒等制度维持传承。在家与僧团之间，以布施、闻法与持戒相连。南传社会的寺院，往往同时是学校、社区中心与仪式场所，不能只用“修行”一义概括。中国云南傣族地区的南传佛教，也属于这一传统在地方社会中的形态。\n\n禅修上，南传通常分止（*samatha*）与观（*vipassanā*）。止是修定，观是观照身心。觉音系统把观智分为十六阶，把清净分为七类，形成一套可教学的次第。二十世纪以来，缅甸、泰国、斯里兰卡等地出现多种内观运动，有的强调标记与观察，有的强调感受与平等心，有的保留森林头陀行。它们彼此并不相同，却共同把“内观”推向在家众与国际社会。<a href=\"#ref-b2\" style=\"color:var(--blue)\">[B2]</a>\n\n这里要避免一个误解：南传不等于“只求自了”。南传经典同样讲慈心、布施、报恩与社会伦理，只是其解脱论以声闻道为主，不以菩萨道为必经。汉传的大乘立场与南传的声闻立场，是两条不同的教义选择，不宜用“高下”二字打发。\n\n### 4.南传与汉传：两条保存线\n\n南传保存了巴利三藏与注释传统，汉传保存了四阿含、广律、大乘经论与庞大的注疏。两条线各有缺损，也各有独存。四阿含在汉传中长期被“小乘”标签压低，近代以来才被重新重视；巴利三藏在南传中也经历过散佚与地方化，不是一块未经变动的化石。\n\n二十世纪汉语学界对四阿含的重视，与居士佛学及印顺等人的整理研究有关〔待核〕。南传内观在华人地区的传播，则是更晚的事。两条线真正相遇，是近几十年的事；在此之前，彼此的了解多半依赖转述。\n\n### 5.一句边界\n\n南传佛教不是“原始佛教”的同义词。它有一千多年的注释、论书、戒律实践与地方化历史。四阿含也不是“小乘经”的同义词，其中包含菩萨、弥勒与六度材料。把两者都放回各自的历史层，比较才有意义。\n\n> **EN corresponding · II. Southern Buddhism: The Pāli Canon, Commentarial Tradition, and Contemporary Practice**\n>\n> The previous section separated “Southern Buddhism” from the label “Hīnayāna,” but that only settles the question of names. To judge how far the four Āgamas can be compared with Southern Buddhist literature, one must also know what the Southern tradition itself preserves, how it interprets that inheritance, and how it is practiced today. This section offers an outline only, not a general history of Southern Buddhism.\n>\n> **1. The three divisions of the Pāli Canon**\n>\n> The scriptural basis of Southern Buddhism is the Pāli Canon: Vinaya, Sutta, and Abhidhamma. The three divisions are not three parallel bookcases but three kinds of literature with different functions.\n>\n> The Vinaya concerns the life of the monastic community. Its core is the Pātimokkha, the code recited at the fortnightly observance; around it are formed the Sutta-vibhaṅga, the Khandhaka, and the Parivāra. The Sutta-vibhaṅga explains the rules one by one, the Khandhaka sets out the procedures and daily institutions of the community, and the Parivāra provides a classified summary. Discipline is not an external constraint but the institutional condition under which the community endures. To read Southern Buddhism without the Vinaya is easily to imagine it as a tradition of purely personal meditation.\n>\n> The Sutta Piṭaka consists of five Nikāyas: Dīgha, Majjhima, Saṃyutta, Aṅguttara, and Khuddaka. The first four are commonly placed alongside the four Chinese Āgamas, and that is precisely the comparison undertaken in the latter half of this essay; the Khuddaka contains such works as the *Dhammapada*, *Udāna*, *Itivuttaka*, *Sutta Nipāta*, and *Jātaka*, which are more varied in genre and uneven in textual stratum. To equate the Pāli Sutta Piṭaka with the first four Nikāyas omits the Khuddaka; to equate the Pāli Canon with the Sutta Piṭaka omits both Vinaya and Abhidhamma. [A2] [B1]\n>\n> The Abhidhamma has seven books, traditionally listed as the Dhammasaṅgaṇī, Vibhaṅga, Dhātukathā, Puggalapaññatti, Kathāvatthu, Yamaka, and Paṭṭhāna. It reorganizes the concepts of the discourses under such categories as mind, mental factors, matter, and nirvāṇa, and forms the backbone of Southern Abhidhamma. The Kathāvatthu is traditionally attributed to the debates of the third council; this is traditional narrative and should not be taken directly as a conclusion of modern historiography 〔to be verified〕. A distinction must be drawn here from Chinese Abhidharma: works such as the *Abhidharmakośa* and *Chengshi lun* belong to the Sarvāstivāda, Sautrāntika, and related systems, and are not the same body of texts as the seven Pāli treatises. [B1] [B2]\n>\n> Pāli itself also requires explanation. It is a Middle Indo-Aryan language, related to but distinct from Sanskrit; it is neither “the original language spoken by the Buddha” nor a local vernacular of any single country. The Pāli Canon was transmitted orally for a long period and is traditionally said to have been committed to writing in Sri Lanka in the first century BCE 〔to be verified〕. Oral transmission followed by writing means that a largely invisible history of transmission precedes the extant text; the moment of writing cannot be treated as the moment a teaching arose.\n>\n> **2. Buddhaghosa and the commentarial tradition**\n>\n> Southern Buddhism possesses not only the three baskets but also a substantial layer of commentaries and treatises.\n>\n> In the fifth century, Buddhaghosa came to the Mahāvihāra tradition in Sri Lanka and, drawing on local Sinhala commentaries, composed in Pāli the *Visuddhimagga* and wrote commentaries on the four Nikāyas, the Vinaya, and parts of the Abhidhamma 〔to be verified〕. The *Visuddhimagga* is organized around the three trainings in morality, concentration, and wisdom, and sets out forty meditation subjects, seven purifications, and sixteen insight knowledges. It is not scripture, yet it determined how later Southern readers would understand scripture. [B1] [B2]\n>\n> The commentarial tradition reminds us of one thing: the same discourse may have different “standard readings” in different traditions. A Chinese reader of the *Nianchu jing* stands within Tiantai and Yogācāra contemplative frameworks; a Southern reader of the *Mahāsatipaṭṭhāna Sutta* stands within the Buddhaghosa tradition of interpretation. Texts may be identical or similar while interpretive frameworks are not. Comparison that attends only to scripture and not to commentary easily mistakes a later reading for the original meaning of the text.\n>\n> **3. Discipline, meditation, and insight practice**\n>\n> Southern monastic communities take the Pātimokkha as a common baseline and maintain transmission through such institutions as the rains retreat, the fortnightly observance, and ordination. Laypeople and the monastic community are linked by giving, listening to teachings, and observance. A monastery in Southern Buddhist societies is often at once a school, a community center, and a ritual site; it cannot be summarized under the single rubric of “practice.”\n>\n> In meditation, Southern Buddhism generally distinguishes calm (samatha) from insight (vipassanā). Calm cultivates concentration; insight contemplates body and mind. The Buddhaghosa system divides insight knowledge into sixteen stages and purification into seven classes, forming a teachable sequence. Since the twentieth century, various insight movements have arisen in Myanmar, Thailand, Sri Lanka, and elsewhere: some emphasize noting and observation, some emphasize sensation and equanimity, and some retain forest ascetic practices. They differ from one another, yet together they have carried “insight” to laypeople and to international society. [B2]\n>\n> One misunderstanding should be avoided here: Southern Buddhism is not equivalent to “seeking only one’s own liberation.” Its texts also teach loving-kindness, giving, gratitude, and social ethics; its soteriology is simply centered on the disciple’s path and does not require the bodhisattva path. The Mahāyāna stance of Chinese Buddhism and the śrāvaka stance of Southern Buddhism are two different doctrinal choices, not something to be dismissed with the word “higher” or “lower.”\n>\n> **4. Southern and Chinese Buddhism: two lines of preservation**\n>\n> Southern Buddhism preserves the Pāli Canon and its commentarial tradition; Chinese Buddhism preserves the four Āgamas, extensive Vinaya literature, Mahāyāna scriptures and treatises, and a vast body of exegesis. Each line has losses and each has unique survivals. The four Āgamas were long depreciated in Chinese Buddhism under the label “Hīnayāna” and were taken seriously again only in modern times; the Pāli Canon also experienced loss and localization in the Southern tradition and is not a fossil that never changed.\n>\n> The modern Chinese scholarly attention to the four Āgamas is connected with lay Buddhist scholarship and with the editorial and research work of Yinshun and others 〔to be verified〕. The spread of Southern insight practice in Chinese-speaking regions came later. The two lines truly met only in recent decades; before that, mutual understanding depended largely on secondhand accounts.\n>\n> **5. One boundary**\n>\n> Southern Buddhism is not a synonym for “early Buddhism.” It has more than a millennium of commentary, treatise literature, disciplinary practice, and localization. Nor are the four Āgamas a synonym for “Hīnayāna scriptures”: they contain material on bodhisattvas, Maitreya, and the six perfections. Only when both are restored to their respective historical strata does comparison become meaningful.\n\n## 三、四阿含如何进入汉语佛典\n\n四阿含的译出时间并不一致，译者也不止一位。它们进入汉语世界时，汉传佛教的目录、讲习和宗派解释已经参与塑造了这些经典的阅读方式。今天我们看到的“卷—诵—品—经”结构，既有原典传承的因素，也有汉译与编次的痕迹。<a href=\"#ref-a1\" style=\"color:var(--blue)\">[A1]</a><a href=\"#ref-b1\" style=\"color:var(--blue)\">[B1]</a><a href=\"#ref-b4\" style=\"color:var(--blue)\">[B4]</a><a href=\"#ref-b5\" style=\"color:var(--blue)\">[B5]</a>\n\n| 经典 | 通行汉译本 | 主要译者与时代 | 通行规模 | 编排特点 |\n|---|---|---|---|---|\n| 《长阿含经》 | T01n0001 | 后秦佛陀耶舍共竺佛念译 | 22 卷，四分四誦，30 经 | 分、誦、品、经；长篇叙事与论说并重 |\n| 《中阿含经》 | T01n0026 | 东晋僧伽提婆译／校订 | 60 卷，五誦，十八品，222 经 | 诵、品、经三级；教义论说较系统 |\n| 《杂阿含经》 | T02n0099 | 刘宋求那跋陀罗译 | 50 卷，通称 1362 经；通行本编次错乱，整理本另有重排 | 多主题短经汇编；底本以卷组织，未设“品”级目录 |\n| 《增壹阿含经》 | T02n0125 | 东晋僧伽提婆译／校订 | 51 卷，472 经，52 品 | 从一法至十一法，以数目组织经文 |\n\n长、中、增壹三部的结构数字不是由现代目录推算，而是各经自述：《长阿含经》卷首明言“此《長阿含》四分四誦，合三十經以為一部。”（T01, no. 1, p. 1a12–13）；《中阿含经》卷末记“凡有五誦，都十八品，有二百二十二經……分為六十卷。”（T01, no. 26, p. 809c01–03）；《增壹阿含经》序则记“合上下部，四百七十二經。”（T02, no. 125, p. 549a26）引文保留底本繁体字形。译者题署依 CBETA 底本；《增壹阿含经》诸本另有昙摩难提译等异记，版本著录时应与底本题署分开，不能静默择一。<a href=\"#ref-a1\" style=\"color:var(--blue)\">[A1]</a>\n\n《杂阿含经》的“1362 经”是通行称数。CBETA XML 按 `cb:div type=\"jing\"` 计得 1355 条，卷末两个经条又分别标作“（一三五五）”“（一三六二）”。这提示结构标记、传统经数与编次错乱可能并存，不能把两种计数直接解释为文本多出或缺少七经。本文用通称介绍规模，讨论具体经文时则同时写出卷次与经号，并说明所依整理本。〔待核：通行经数与 XML 经条计数的完整对账〕\n\n表中所列是通行本的规模。引用时应以具体版本为准，因为经数、品目和分卷在不同目录与校勘本中会有差异。尤其要注意，汉语的一部“经”与巴利的一部 *sutta* 不是天然等量的计数单位：一部汉译经可能包含多个宣说，一个巴利编号下也可能是一组短经。用 1362 对某个更大的巴利总数，不能直接说明哪一方“更完整”。\n\n四阿含还有一个容易被忽略的特点：各部并非只保存同一套内容。长阿含里有在家伦理和宇宙论，中阿含里有禅修和空观，杂阿含里有诸天与弟子言说，增壹阿含里也有菩萨、弥勒和六度材料。若先把四阿含整体贴上“小乘”封条，反而会遮住这些文本内部的层次。<a href=\"#ref-a1\" style=\"color:var(--blue)\">[A1]</a>\n\n### 1.先认清目录单位\n\n四阿含都用“卷”，但卷数主要说明文本在流传与抄写中的分册，不等于一部经的思想容量。《长阿含经》只有二十二卷，却包含长篇叙事；《杂阿含经》有五十卷，多数经条反而很短。用卷数判断深浅，首先就认错了单位。\n\n| 单位 | 在四阿含中的用途 | 阅读时应注意 |\n|---|---|---|\n| 卷 | 分册与物理边界，常与抄写、刊刻和页码有关 | 跨卷不必然跨主题，同一卷也不必然只收一类经 |\n| 分 | 《长阿含经》的四个大部 | 分下再设誦与经，不能把“四分”读成四种教义 |\n| 誦 | 可诵读、传授的文本单元，也是较大的组织层级 | 各部誦数与边界不同，不宜拿“五誦”跨部硬比 |\n| 品 | 按人物、主题、数目或经群形成的分组 | 品题能指路，却不能代替核对品内各经 |\n| 经 | 汉译文本中的一个宣说或编纂单元 | 与巴利 *sutta* 的编号和聚合方式不总是一致 |\n\n这张表也解释了，为什么介绍四阿含时不能只报“多少卷、多少经”。卷与经是两种尺度：卷多可能因为单经短，经多也可能因为同一主题被分成许多宣说。结构的用处，是帮助读者找到相邻材料，不是给文本价值排名。〔本文判断〕\n\n### 2.题署能确认什么，不能确认什么\n\n通行本题署把译者与时代放在经首或卷首，是版本著录的重要依据。本文表格因此采用 CBETA 底本题署。但题署不是现代意义上的出版说明，它不会逐一说明每个人在译场中负责哪一部分，也不会自动解决不同目录之间的异记。遇到《增壹阿含经》这样的异署，正确做法是并列出处，而不是把某个名字从其他记载中悄悄删去。\n\n同样，经文末尾关于卷数、诵数与经数的自述，也应区分两层：它是文本内部保存的结构记录，却不是现代校勘学已经完成的逐条对账。《杂阿含经》的经数冲突正好说明这一点。结构数字能提出问题，不能代替问题被解决。\n\n因此，本文每介绍一部，都同时保留三个坐标：通行本、结构层级与代表经号。只写经名，读者难回原典；只写经号，又可能撞上不同整理本的编号差异。把版本与结构一起交代，才是可复查的介绍。〔本文判断〕\n\n> **EN corresponding · III. How the Four Āgamas Entered the Chinese Canon**\n>\n> The four Āgamas were translated at different times and by more than one translator. By the time they entered the Chinese world, Chinese Buddhist catalogs, lectures, and sectarian interpretations had already helped shape how these texts were read. The structure visible today as “fascicle–recitation–chapter–discourse” reflects both factors inherited from the original traditions and traces of Chinese translation and arrangement. [A1] [B1] [B4] [B5]\n>\n> | Collection | Commonly used Chinese translation | Principal translators and period | Conventional extent | Organizing features |\n> |---|---|---|---|---|\n> | Dīrgha-āgama (《长阿含经》) | T01n0001 | Buddhayaśas (佛陀耶舍), together with Zhu Fayan (竺佛念), Later Qin | 22 fascicles; four divisions and four recitations; 30 discourses | Division, recitation, chapter, and discourse; long narratives and expositions receive equal emphasis |\n> | Madhyama-āgama (《中阿含经》) | T01n0026 | Saṅghadeva (僧伽提婆), translated and collated, Eastern Jin | 60 fascicles; five recitations; 18 chapters; 222 discourses | Three levels of recitation, chapter, and discourse; relatively systematic doctrinal exposition |\n> | Saṃyukta-āgama (《杂阿含经》) | T02n0099 | Guṇabhadra (求那跋陀罗), Liu Song | 50 fascicles; conventionally 1,362 discourses; the received text’s order is confused, and reconstructed editions rearrange it | A compilation of short texts on many themes; the base text is organized by fascicle and has no chapter-level catalog |\n> | Ekottara-āgama (《增壹阿含经》) | T02n0125 | Saṅghadeva (僧伽提婆), translated and collated, Eastern Jin | 51 fascicles; 472 discourses; 52 chapters | Discourses organized by number, from one phenomenon through eleven |\n>\n> The structural figures for the Dīrgha, Madhyama, and Ekottara are not calculations made by modern catalogs but statements within the texts themselves. Explanatory renderings of the Chinese CBETA quotations above—not official translations—are: “This Dīrgha-āgama has four divisions and four recitations, amounting to thirty discourses in one collection” (T01, no. 1, p. 1a12–13); “The Madhyama-āgama has five recitations in all, eighteen chapters in total, and two hundred and twenty-two discourses … divided into sixty fascicles” (T01, no. 26, p. 809c01–03); and “Combining the upper and lower parts, there are four hundred and seventy-two discourses” (T02, no. 125, p. 549a26). The Chinese quotations retain the traditional forms of the base text. Translator attributions follow the CBETA base text; other records of the Ekottara-āgama include an attribution to Dharmanandi (昙摩难提). In bibliographical description, such alternative attributions must be distinguished from the base-text attribution rather than silently choosing one. [A1]\n>\n> The figure “1,362 discourses” for the Saṃyukta-āgama is conventional. Counting entries marked `cb:div type=\"jing\"` in the CBETA XML yields 1,355; two discourse entries at the ends of fascicles are separately labeled “(1355)” and “(1362).” This suggests that structural markup, traditional discourse counts, and disorder in the arrangement may coexist. The two counts cannot simply be interpreted as meaning that one text has seven more or fewer discourses than the other. This essay uses the conventional figure when introducing the collection’s extent; when discussing a particular discourse, it gives both the fascicle and discourse number and identifies the reconstructed edition used. 〔To be verified: a complete reconciliation of the conventional discourse count and the count of XML discourse entries〕\n>\n> The table gives the extent of commonly received editions. Citations must follow the specific edition, since discourse counts, chapter titles, and fascicle divisions vary among catalogs and recensions. Particular care is needed because a Chinese “discourse” and a Pāli *sutta* are not naturally commensurate counting units: one Chinese discourse may contain several teachings, while one Pāli number may cover a group of short texts. Comparing 1,362 with some larger Pāli total cannot directly show which side is “more complete.”\n>\n> Another easily overlooked feature of the four Āgamas is that they do not all preserve the same body of material. The Dīrgha contains lay ethics and cosmology; the Madhyama contains meditation and teachings on emptiness; the Saṃyukta contains sayings of devas and disciples; and the Ekottara also contains material on bodhisattvas, Maitreya, and the six perfections. To affix the label “Hīnayāna” to all four indiscriminately would obscure these internal layers. [A1]\n>\n> **1. First identify the units of the catalog**\n>\n> All four Āgamas use fascicles, but a fascicle count primarily indicates how a text was divided into physical parts in transmission and copying; it does not indicate a discourse’s intellectual capacity. The Dīrgha-āgama has only twenty-two fascicles yet contains long narratives, whereas most discourse entries in the fifty-fascicle Saṃyukta-āgama are very short. To judge depth by fascicle count is to mistake the unit from the outset.\n>\n> | Unit | Function in the four Āgamas | What to note when reading |\n> |---|---|---|\n> | Fascicle | A physical part and boundary, often related to copying, printing, and pagination | A change of fascicle need not mark a change of topic, nor need one fascicle contain only one kind of text |\n> | Division | One of the four major parts of the Dīrgha-āgama | Recitations and discourses occur within divisions; “four divisions” must not be read as four teachings |\n> | Recitation | A textual unit capable of being recited and transmitted, and a relatively high-level organizing unit | The number and boundaries of recitations differ by collection, so “five recitations” should not be compared mechanically across collections |\n> | Chapter | A grouping formed around persons, themes, numbers, or clusters of discourses | A chapter title provides direction but cannot replace checking each discourse within it |\n> | Discourse | A teaching or editorial unit within a Chinese translation | Its numbering and aggregation do not always match those of a Pāli *sutta* |\n>\n> This table also explains why an introduction to the four Āgamas cannot merely report “so many fascicles and so many discourses.” Fascicles and discourses are two different measures: a text may have many fascicles because individual discourses are short, or many discourses because one theme has been divided into numerous teachings. Structure helps readers locate adjacent material; it does not rank textual value. 〔This essay’s judgment〕\n>\n> **2. What an attribution can and cannot establish**\n>\n> The attribution of translators and periods at the beginning of a received text or fascicle is important evidence for bibliographical description. The table therefore adopts the attributions in the CBETA base text. But an attribution is not a modern publication note: it does not specify each person’s responsibility in the translation team, nor does it automatically resolve conflicting records in different catalogs. When a text such as the Ekottara-āgama has alternative attributions, the correct procedure is to place the sources side by side, not silently delete a name found in other records.\n>\n> Likewise, statements at the ends of texts about numbers of fascicles, recitations, and discourses belong to two distinct levels. They are structural records preserved inside the text, but they are not a completed discourse-by-discourse reconciliation in modern textual criticism. The conflict in the Saṃyukta-āgama’s discourse count illustrates this precisely. Structural figures can raise a question; they cannot substitute for its resolution.\n>\n> Each collection is therefore introduced with three coordinates: the commonly received edition, the structural levels, and representative discourse numbers. Titles alone make return to the source difficult, while numbers alone may encounter discrepancies among reconstructed editions. An introduction is reviewable only when version and structure are given together. 〔This essay’s judgment〕\n\n## 四、长阿含：世界、王法与佛陀的最后旅程\n\n### 1.结构上的“长”\n\n《长阿含经》的“长”，主要体现为叙事展开充分，场景、对话和前后脉络可以延续数卷。它不只讨论解脱原理，也处理佛陀传记、世界形成、转轮王、在家伦理、僧团戒律和末世叙事。\n\n这种篇幅使长阿含很适合观察佛教如何把教义放进具体生活。一个问题往往先由人物提出，再由佛陀从家产、婚姻、邻里、师友或王权说起，最后才落到修行。读者得到的不是孤立的定义，而是一种可以照着生活的秩序。\n\n### 2.代表经典与巴利平行文本\n\n| 《长阿含经》代表经典 | 主要内容 | 常被对照的巴利经典 |\n|---|---|---|\n| 《游行经》（第 2 经） | 佛陀最后一次游化、入灭及涅槃后的处置 | DN 16《大般涅槃经》 |\n| 《大本经》（第 1 经） | 佛陀本行与过去诸佛的叙事 | DN 14《大本经》 |\n| 《世记经》（第 30 经） | 世界形成、众生流转与劫期 | DN 27《起世因本经》的部分宇宙论材料 |\n| 《善生经》（第 16 经） | 在家人的伦理关系与处世责任 | DN 31《善生经》 |\n| 《转轮圣王修行经》（第 6 经） | 理想王权、七宝与佛法兴衰 | DN 26《转轮圣王狮子吼经》 |\n| 《大缘方便经》（第 13 经） | 十二缘起的展开 | DN 15《大因经》 |\n\n这些平行关系不能写成一一对应的翻译关系。两篇经可以共享主要情节，却在段落次序、人物设置和解释重点上不同；有的汉译经典还与梵语残卷、其他汉译或藏译残卷更接近。比较时要把“同主题”“同情节”“同段落”“同译本关系”分开。尤其《世记经》与 DN 27 只宜按具体段落核对，不能因为都有世界起源与劫期，就把两部经整体视为同一文本的两个译本。<a href=\"#ref-a1\" style=\"color:var(--blue)\">[A1]</a><a href=\"#ref-b3\" style=\"color:var(--blue)\">[B3]</a><a href=\"#ref-b4\" style=\"color:var(--blue)\">[B4]</a>\n\n### 3.可以读出什么\n\n长阿含的宇宙论并不只是奇谈。世界如何形成、业如何延续、王权为何需要佛法、一个共同体如何面对权威与死亡，这些问题在经中彼此相连。读《世记经》，可以把社会秩序的起源与解脱问题放在一起；读《转轮圣王修行经》，则能看到佛教如何评价权力，而不只是描述政治制度。\n\n《游行经》更接近一部关于告别的长篇。它把佛陀最后的行程、疾病、教诲和入灭放在同一条叙事线上。巴利 DN 16 与它有大量平行材料，但两本的编排和细节并不完全相同。读这两部经，最值得比较的不是谁多了一句话，而是不同传承怎样组织“最后旅程”的意义。\n\n《善生经》适合作为长阿含的入门。它从六种人际关系讲起，把伦理落到子女、父母、夫妻、朋友、师长与雇工的责任上。一个人不必先掌握复杂的部派史，也能从这部经看出佛教伦理为什么不是一套悬空的个人修养。\n\n### 4.细读《善生经》：六方不是六种仪式\n\n《善生经》把六种关系说成六个方位：“父母為東方，師長為南方，妻婦為西方，親黨為北方，僮僕為下方，沙門、婆羅門、諸高行者為上方。”（T01, no. 1, p. 71c05–08）这里的“方”不是要人在屋中朝六个方向礼拜，而是用空间次序安置社会关系。东方从父母开始，上方留给沙门、婆罗门与修行者，六方便成为一张关系地图。\n\n地图之后不是六个孤立条目，而是连续列出双方责任。为人子者要供奉父母、有事先白、恭顺不逆；父母也要制止子为恶、指示善处、慈爱子女、为之求善婚配、供给所需（p. 71c09–17）。师徒、夫妻、亲党、主仆、檀越与修行者之间，也各有相对应的一组行为。读经时若只抄下“子女应该如何”，便会漏掉经文同时向父母、师长与雇主提出的要求。\n\n但也不能把这种互惠直接改写成现代平等。经中夫妻与主仆的措辞仍有明确的等级次序，某些责任以“先起”“後坐”“先意承旨”一类动作表示。历史文本值得细读，不等于其中每个安排都适合照单全收。比较可靠的读法，是同时记下三层：它承认关系双方都有责任；这些责任并不总是对称；今天使用这份伦理资源时，仍须说明哪些部分只能作为历史理解，哪些可以进入当代讨论。〔本文判断〕\n\n与 DN 31 对读，也宜从这些具体项目入手。先看六方次序是否相同，再看每方列举几项责任，最后核对同一行为的措辞。这样得到的是可描述的差异，而不是先宣布“两经基本相同”，再为这个结论寻找例子。〔本文判断〕\n\n### 5.阅读建议\n\n初读可从《善生经》进入，再读《大缘方便经》理解缘起，最后读《游行经》看教义如何进入叙事。与巴利本对照时，先读 DN 31、DN 15、DN 16，不必一开始就追求全部三十经的逐篇对应。\n\n> **EN corresponding · IV. Dīrgha-āgama: The World, Kingship, and the Buddha’s Last Journey**\n>\n> **1. Length as a structural feature**\n>\n> The “length” of the Dīrgha-āgama lies mainly in its fully developed narratives: scenes, conversations, and their preceding and following contexts can extend over several fascicles. It deals not only with the principle of liberation but also with the Buddha’s biography, the formation of the world, wheel-turning kings, lay ethics, monastic discipline, and eschatological narratives.\n>\n> This scale makes the Dīrgha especially suitable for observing how Buddhism places doctrine within concrete life. A question is often first raised by a person; the Buddha then begins from property, marriage, neighbors, teachers, friends, or royal authority before finally turning to practice. What the reader receives is not an isolated definition but an order that can be lived.\n>\n> **2. Representative texts and Pāli parallels**\n>\n> | Representative Dīrgha-āgama text | Main content | Pāli text commonly compared with it |\n> |---|---|---|\n> | *Youxing jing* (《游行经》, no. 2) | The Buddha’s last journey, his passing away, and arrangements after parinirvāṇa | DN 16, *Mahāparinibbāna Sutta* (《大般涅槃经》) |\n> | *Daben jing* (《大本经》, no. 1) | The Buddha’s former career and narratives of past Buddhas | DN 14, *Mahāpadāna Sutta* (《大本经》) |\n> | *Shiji jing* (《世记经》, no. 30) | World formation, the movement of beings, and cosmic ages | Part of the cosmological material in DN 27, *Aggañña Sutta* (《起世因本经》) |\n> | *Shansheng jing* (《善生经》, no. 16) | Ethical relationships and social responsibilities of laypeople | DN 31, *Sigālaka Sutta* (《善生经》) |\n> | *Zhuanlun shengwang xiuxing jing* (《转轮圣王修行经》, no. 6) | Ideal kingship, the seven treasures, and the rise and decline of the Dharma | DN 26, *Cakkavatti Sutta* (《转轮圣王狮子吼经》) |\n> | *Dayuan fangbian jing* (《大缘方便经》, no. 13) | An exposition of dependent origination | DN 15, *Mahānidāna Sutta* (《大因经》) |\n>\n> These parallel relationships cannot be described as one-to-one translation relationships. Two texts may share a principal plot while differing in the order of passages, the configuration of characters, and the emphasis of interpretation. Some Chinese texts are also closer to Sanskrit fragments, other Chinese translations, or Tibetan fragments. Comparison must distinguish shared theme, shared plot, shared passages, and a relationship of translation. In particular, the *Shiji jing* and DN 27 should be compared passage by passage; their shared concern with world origins and cosmic ages does not make them two translations of one text as a whole. [A1] [B3] [B4]\n>\n> **3. What can be read from these texts**\n>\n> Dīrgha cosmology is not merely a collection of curiosities. Questions about how the world forms, how karma continues, why kingship requires the Dharma, and how a community confronts authority and death are interconnected in these texts. Reading the *Shiji jing*, one can place the origin of social order alongside the question of liberation; reading the *Zhuanlun shengwang xiuxing jing*, one can see how Buddhism evaluates power rather than merely describing political institutions.\n>\n> The *Youxing jing* is closer to a long work of farewell. It places the Buddha’s final journey, illness, teachings, and passing away on a single narrative line. Pāli DN 16 shares much parallel material with it, but the arrangement and details of the two are not entirely the same. In reading them together, what is most worth comparing is not who has one more sentence, but how the different traditions organize the meaning of the “last journey.”\n>\n> The *Shansheng jing* is a suitable introduction to the Dīrgha. Beginning with six kinds of human relationship, it grounds ethics in the responsibilities of children, parents, spouses, friends, teachers, and workers. Without first mastering the complex history of the schools, a reader can see from this text why Buddhist ethics is not a disembodied program of personal cultivation.\n>\n> **4. Close reading the *Shansheng jing*: six directions, not six rituals**\n>\n> The *Shansheng jing* presents six relationships as six directions. Explanatory rendering of the Chinese CBETA quotation above—not an official translation: “Parents are the east; teachers, the south; wives, the west; kinsfolk, the north; servants, the lower direction; and ascetics, brahmins, and those of high conduct, the upper direction” (T01, no. 1, p. 71c05–08). “Direction” here does not mean that people should worship in six directions inside a house; it uses spatial order to situate social relationships. The east begins with parents, while the upper direction is reserved for ascetics, brahmins, and practitioners. The six directions thus become a map of relationships.\n>\n> After this map comes not six isolated items but a continuous list of reciprocal responsibilities. A child should support and honor parents, consult them in advance about important matters, and be obedient rather than contrary; parents in turn should stop their children from wrongdoing, point them toward what is good, love them, seek a good marriage for them, and provide for their needs (p. 71c09–17). Between teacher and student, husband and wife, kinsfolk, master and servant, lay supporter and practitioner, there is likewise a corresponding set of actions. If a reader copies down only “how children should behave,” the text’s simultaneous demands on parents, teachers, and employers are missed.\n>\n> Yet this reciprocity cannot simply be rewritten as modern equality. The wording concerning husbands and wives and between masters and servants still preserves explicit hierarchies; some responsibilities are expressed through actions such as rising first, sitting afterward, and anticipating and complying with another’s wishes. That a historical text rewards close reading does not mean that every arrangement in it should be accepted wholesale. A more reliable reading records three levels at once: both parties in a relationship have responsibilities; those responsibilities are not always symmetrical; and when using this ethical resource today, one must still explain which parts can be understood only historically and which can enter contemporary discussion. 〔This essay’s judgment〕\n>\n> Comparison with DN 31 should likewise begin with these concrete items. First compare the order of the six directions; next count the responsibilities listed under each; finally check the wording of corresponding actions. What emerges is a describable set of differences, rather than a declaration that “the two texts are basically the same” followed by a search for examples to support that conclusion. 〔This essay’s judgment〕\n>\n> **5. Suggested reading**\n>\n> A first reading may begin with the *Shansheng jing*, move to the *Dayuan fangbian jing* for dependent origination, and conclude with the *Youxing jing* to see how doctrine enters narrative. When comparing with Pāli texts, begin with DN 31, DN 15, and DN 16; there is no need to seek discourse-by-discourse correspondences for all thirty texts from the outset.\n\n## 五、中阿含：把教法展开为可分析的体系\n\n### 1.结构上的“中”\n\n《中阿含经》共六十卷，二百二十二经；卷末自述为五誦、十八品。五誦依次题作初一日誦、第二小土城誦、第三念誦、第四分別誦、第五後誦，品与经依次而下。目录上有一处容易误会：CBETA 底本按 `cb:div type=\"pin\"` 计得二十一个品题，而经文自述十八品；王相應品、梵志品、雙品、大品等品题在目录中各出现两次，是品题随誦重启所致。本文引用时以经文自述的十八品为准，同时保留底本目录的重复，不把二十一个品题直接改写成十八品。它的“中”主要指中等篇幅，也提示了一种较适合连续论说的形式：一篇经围绕一个明确问题，先设定场景，再作辨析，最后给出修行结论。<a href=\"#ref-a1\" style=\"color:var(--blue)\">[A1]</a>\n\n在四阿含中，中阿含最容易让人看见一套可分析的教义体系。四圣谛、缘起、念处、空、业、禅修和弟子成就，不是零散出现，而是被反复从不同角度讨论。读者若想知道早期佛教怎样把经验材料整理成问题，中阿含是很好的起点。<a href=\"#ref-b3\" style=\"color:var(--blue)\">[B3]</a>\n\n### 2.代表经典与跨部对照\n\n| 《中阿含经》代表经典 | 主要内容 | 常被对照的巴利经典 |\n|---|---|---|\n| 《象迹喻经》（第 30 经） | 从身心的具体观察进入诸法分析 | MN 28《象迹喻大经》 |\n| 《念处经》（第 98 经） | 四念处的完整修习 | MN 10《念处经》 |\n| 《分别圣谛经》（第 31 经） | 四圣谛的辨别与修习 | MN 141《谛分别经》 |\n| 《大因经》（第 97 经） | 缘起、识、名色与轮回的关联 | DN 15《大因经》 |\n| 《善生经》（第 135 经） | 在家伦理与六方责任 | DN 31《善生经》 |\n| 《箭喻经》（第 221 经） | 对形而上问题保持距离，先处理苦与灭苦 | MN 63《摩罗迦小经》 |\n| 《大空经》（第 191 经） | 空的修习与不同层次的定 | MN 122《大空经》 |\n\n这张表已经说明，中阿含与巴利经典的对应并不限于中部。同一部汉译经可以对应 DN、MN 或 SN 中的文本；巴利某一部尼柯耶也会收入与其他尼柯耶主题相近的经典。部类边界是真实的，却不是封闭的墙。\n\n### 3.从概念到经验\n\n中阿含的许多经喜欢先拆开一个概念。比如“圣谛”不是四条口号，而是要辨别什么执取会生苦，什么修行能导向苦的止息；“空”也不是一句否定，而是说明在何种禅修和经验条件下，某类烦恼不再现行。这样的写法接近课堂辨析：先问清楚问题，再给出定义，最后让读者看见定义如何改变经验。\n\n《箭喻经》尤其适合现代读者。面对无法由经验解决的问题，经文没有要求先建立一套完整宇宙论，而是把注意力拉回苦的来源与灭苦之道。它反对的不是思考，而是把无法证实的思辨放在修行之前，结果忘记了眼前的问题。<a href=\"#ref-a1\" style=\"color:var(--blue)\">[A1]</a><a href=\"#ref-a2\" style=\"color:var(--blue)\">[A2]</a>\n\n《大空经》则展示了“空”的另一面。空并不只是哲学判断，也可以是一套渐次深入的修习。理解这一点，才能避免把中阿含中的空观读成后来某一家理论的简写。\n\n### 4.细读《箭喻经》：不说不是回避\n\n《箭喻经》的比喻从一个人中箭写起。他受伤极重，亲属为他请来箭医，他却坚持“未可拔箭，我應先知彼人如是姓、如是名、如是生”（T01, no. 26, p. 804c24–29）。接下来又是一连串问题：弓用什么木，弦用什么筋，箭杆、箭羽与箭头出自谁手，射箭者属于哪一族、来自哪个方向。经文用重复的“未可”把拖延写得十分具体。问题并非没有意义，只是在此刻，它们挡在拔箭之前。\n\n这个比喻针对的是修行的次序。面对世界常断、如来死后有无等问题，经中不要求修行者先得到一套完整答案，才承认苦与苦的止息。它给出一个判断标准：“此非義相應，非法相應，非梵行本，不趣智、不趣覺、不趣涅槃”（p. 805b23–25）。反过来，“苦、苦習、苦滅、苦滅道跡，我一向說”则被列为可说的内容（p. 805c02–06）。\n\n因此，不能把《箭喻经》缩成一句“不要思考”。它没有取消提问，而是在追问：一个答案与解脱的实践有什么关系？若把它当作拒绝一切哲学讨论的宣言，反而错过了经中反复使用的“相應”标准。〔本文判断〕与 MN 63 对读时，最值得核对的也是这套论证怎样展开，而不只是双方是否都出现箭、弓和医师。\n\n### 5.与中部的近缘关系\n\n中阿含与巴利中部 *Majjhima Nikāya* 是四组对应中最近缘的一组，许多经典有明显的平行关系。但二者仍不是同一部经书的两个译本。中阿含二百二十二经，巴利中部一百五十二经；双方的编排、选文和组合方式不同，各自也有对方没有的经典。<a href=\"#ref-a1\" style=\"color:var(--blue)\">[A1]</a><a href=\"#ref-a2\" style=\"color:var(--blue)\">[A2]</a><a href=\"#ref-b3\" style=\"color:var(--blue)\">[B3]</a>\n\n比较中阿含与中部，最有效的方法不是按经号寻找同号文本，而是先确定主题，再核对人物、情节、段落和关键概念。经号相近不代表内容相近，经号不同也不妨碍发现平行文本。\n\n### 6.阅读建议\n\n教义入门可依次读《分别圣谛经》《念处经》《大因经》；关心空与中道，再读《箭喻经》《大空经》；关心在家伦理，则回到《善生经》。巴利对照可先选 MN 141、MN 10、DN 15、MN 63、MN 122，最后再读中部全书。\n\n> **EN corresponding · V. Madhyama-āgama: Unfolding the Teaching as an Analyzable System**\n>\n> **1. “Middle” as a structural feature**\n>\n> The Madhyama-āgama has sixty fascicles and 222 discourses; its closing statement describes five recitations and eighteen chapters. The five recitations are titled, in sequence, the First One-Day Recitation, Second Small Earthen-City Recitation, Third Mindfulness Recitation, Fourth Analytical Recitation, and Fifth Later Recitation, followed in sequence by chapters and discourses. “Middle” refers primarily to medium length, but it also suggests a form suited to sustained exposition: one discourse centers on a clearly defined question, establishes a setting, analyzes it, and concludes with a result for practice. [A1]\n>\n> Among the four Āgamas, the Madhyama most readily makes an analyzable doctrinal system visible. The four noble truths, dependent origination, the establishments of mindfulness, emptiness, karma, meditation, and the attainments of disciples do not appear as scattered items but are repeatedly discussed from different angles. For a reader wishing to know how early Buddhism organized experiential materials into questions, the Madhyama is an excellent starting point. [B3]\n>\n> **2. Representative texts and cross-collection comparisons**\n>\n> | Representative Madhyama-āgama text | Main content | Pāli text commonly compared with it |\n> |---|---|---|\n> | *Xiangjiyu jing* (《象迹喻经》, no. 30) | Moving from concrete observation of body and mind to analysis of phenomena | MN 28, *Mahāhatthipadopama Sutta* (《象迹喻大经》) |\n> | *Nianchu jing* (《念处经》, no. 98) | The complete practice of the four establishments of mindfulness | MN 10, *Satipaṭṭhāna Sutta* (《念处经》) |\n> | *Fenbie shengdi jing* (《分别圣谛经》, no. 31) | Discernment and practice of the four noble truths | MN 141, *Saccavibhaṅga Sutta* (《谛分别经》) |\n> | *Dayin jing* (《大因经》, no. 97) | The connection of dependent origination, consciousness, name-and-form, and rebirth | DN 15, *Mahānidāna Sutta* (《大因经》) |\n> | *Shansheng jing* (《善生经》, no. 135) | Lay ethics and responsibilities associated with the six directions | DN 31, *Sigālaka Sutta* (《善生经》) |\n> | *Jianyu jing* (《箭喻经》, no. 221) | Maintaining distance from metaphysical questions and first addressing suffering and its cessation | MN 63, *Cūḷamāluṅkya Sutta* (《摩罗迦小经》) |\n> | *Dakong jing* (《大空经》, no. 191) | The practice of emptiness and different levels of meditative absorption | MN 122, *Mahāsuññata Sutta* (《大空经》) |\n>\n> This table already shows that correspondences between the Madhyama and Pāli texts are not confined to the Majjhima Nikāya. One Chinese text may correspond to material in the DN, MN, or SN, while a Pāli Nikāya may include texts close in theme to those in other Nikāyas. Collection boundaries are real, but they are not sealed walls.\n>\n> **3. From concepts to experience**\n>\n> Many Madhyama texts begin by taking a concept apart. The “noble truths,” for example, are not four slogans: one must discern what clinging gives rise to suffering and what practice leads to its cessation. “Emptiness” is likewise not a single negation; it explains the meditative and experiential conditions under which certain afflictions no longer arise. This mode of writing resembles classroom analysis: first clarify the question, then give a definition, and finally let the reader see how that definition changes experience.\n>\n> The *Jianyu jing* is especially suitable for modern readers. Faced with questions that cannot be resolved through experience, the text does not require a complete cosmology before turning attention to the origin of suffering and the path to its cessation. It opposes not thinking but placing unverifiable speculation before practice and thereby forgetting the immediate problem. [A1] [A2]\n>\n> The *Dakong jing* displays another aspect of “emptiness.” Emptiness is not only a philosophical judgment; it can also be a progressive practice. Understanding this point is necessary if the Madhyama’s teachings on emptiness are not to be read as an abbreviated version of some later school’s theory.\n>\n> **4. Close reading the *Jianyu jing*: not speaking is not avoidance**\n>\n> The *Jianyu jing*’s simile begins with a man struck by an arrow. So severely wounded is he that his relatives call in an arrow specialist, yet he insists, “The arrow cannot yet be removed; I must first know that person’s clan, name, and birth” (explanatory rendering of the Chinese CBETA quotation above, not an official translation; T01, no. 26, p. 804c24–29). A further series of questions follows: what wood the bow is made from, what sinew the string is made from, who made the shaft, feathers, and arrowhead, and to which clan the archer belongs and from which direction he came. By repeating “not yet,” the text makes delay concrete. The questions are not meaningless; at this moment, however, they stand before removal of the arrow.\n>\n> The simile concerns the order of practice. Faced with such questions as whether the world is eternal or annihilated and whether a Tathāgata exists after death, the text does not require practitioners to obtain a complete set of answers before acknowledging suffering and its cessation. It offers a criterion. Explanatory rendering of the Chinese CBETA quotation above—not an official translation: “This is not relevant to the goal, not connected with the Dharma, and not the basis of the holy life; it leads neither to knowledge nor to awakening nor to nirvāṇa” (p. 805b23–25). Conversely, “Suffering, its origin, the cessation of suffering, and the path leading to its cessation—these I have always taught” is listed among what can be spoken (explanatory rendering of the Chinese CBETA quotation above, not an official translation; p. 805c02–06).\n>\n> The *Jianyu jing* therefore cannot be reduced to “Do not think.” It does not abolish questions but asks: What relationship does an answer have to the practice of liberation? To treat the text as a declaration rejecting all philosophical discussion would miss the standard of “connection” or “accordance” repeatedly used within it. 〔This essay’s judgment〕 When comparing it with MN 63, what most needs checking is likewise how this argument develops, not merely whether both sides contain an arrow, a bow, and a physician.\n>\n> **5. The close relationship with the Majjhima Nikāya**\n>\n> The Madhyama-āgama and the Pāli *Majjhima Nikāya* are the pair with the closest textual affinity among the four proposed correspondences, and many texts have clear parallels. Yet they are still not two translations of the same collection. The Madhyama has 222 discourses and the Majjhima has 152; the two differ in arrangement, selection, and modes of grouping, and each contains texts absent from the other. [A1] [A2] [B3]\n>\n> The most effective comparison is not to look for texts with the same number, but first to identify a theme and then check persons, plot, passages, and key concepts. Similar numbers do not imply similar content, and different numbers do not prevent the discovery of parallel texts.\n>\n> **6. Suggested reading**\n>\n> For a doctrinal introduction, read the *Fenbie shengdi jing*, *Nianchu jing*, and *Dayin jing* in sequence. For emptiness and the middle way, continue with the *Jianyu jing* and *Dakong jing*; for lay ethics, return to the *Shansheng jing*. Pāli comparisons may begin with MN 141, MN 10, DN 15, MN 63, and MN 122, leaving a reading of the whole Majjhima until later.\n\n## 六、杂阿含：早期佛教的问题清单\n\n### 1.“杂”不是“乱”\n\n《杂阿含经》的“杂”，提示的是一种汇编方式，不必读成毫无章法。通行本五十卷，通称一千三百六十二经；CBETA 底本以卷组织，未设“品”级目录。它以五阴、六入处、因缘、道品、八众和弟子言说等线索，把大量短篇组织在一起。只是现存汉译本次序错乱，今日读者所说的“五阴诵”“六入处诵”等主题分部，多依赖近代重排；引用具体短经时，不能只写整理后的经号，还要注明所依本子的卷次。<a href=\"#ref-a1\" style=\"color:var(--blue)\">[A1]</a><a href=\"#ref-b6\" style=\"color:var(--blue)\">[B6]</a>\n\n这些短经往往只处理一个小问题：色是无常，受是无常，眼识如何生起，缘起为何不是灵魂，禅修为何需要正见，某位弟子在病中怎样观察身心。单篇读，信息像格言；连着读，便能看到概念之间的连接。\n\n### 2.结构线索\n\n若依近代重排本的“诵—品”层次，五阴诵把身体、感受、想、行、识放在无常、苦、无我的观察下；六入处诵处理眼、耳、鼻、舌、身、意及其对象；因缘部分展开十二缘起；道品诵则把四圣谛、三十七道品等放回修行过程。CBETA 底本没有品级目录，引用时仍须以卷次定位。\n\n这种结构不是现代读者熟悉的“先总论，再分章”。同一问题会从不同人物、不同场合反复出现。第一次读，可以按主题选读；读第二遍时，再沿相邻短经追踪论证。\n\n### 3.代表经典与相应部关系\n\n| 《杂阿含经》中的线索 | 主要问题 | 巴利相应部中的近缘材料 |\n|---|---|---|\n| 五阴诵中的无常、无我诸经 | 五蕴的观察与执取 | SN 22《蕴相应》 |\n| 六入处诵诸经 | 六根、六境与识的产生 | SN 35《六入处相应》 |\n| 因缘诸经 | 十二缘起的各个环节 | SN 12《因缘相应》 |\n| 《转法轮经》（通称第 379 经） | 初转法轮与四圣谛 | SN 56.11–12《转法轮经》 |\n| 《差摩经》（通称第 103 经） | 病中观察五蕴，不以经验为“我” | SN 22.89《差摩经》 |\n| 《阐陀经》（通称第 262 经） | 病者面对死亡与解脱时，如何不执五蕴 | SN 22.90《阐陀经》 |\n\n这里的经名多为近现代检索所用的识别名，不全是底本原题；经号也须注明口径。CBETA 本《阐陀经》的目录标记作 260，经头作 262；《转法轮经》的目录标记作 377，经头作 379。表中采用通称经号，并在引用时另记卷页与所据整理本。CBETA 的平行注分别标出 SN 22.90 与 SN 56.11–12，但这项标记只表示可以进入对照，不能代替逐段核同。<a href=\"#ref-a1\" style=\"color:var(--blue)\">[A1]</a>\n\n杂阿含与巴利相应部 *Saṃyutta Nikāya* 有大量平行材料，但现行汉译本次序与巴利五十六相应的编排并不相同。同一个巴利相应，可能分散在汉译不同卷或整理本不同品中；同一个整理本品，也可能对应多个巴利主题。比较时不能只对品名或经号。<a href=\"#ref-a1\" style=\"color:var(--blue)\">[A1]</a><a href=\"#ref-a2\" style=\"color:var(--blue)\">[A2]</a><a href=\"#ref-b6\" style=\"color:var(--blue)\">[B6]</a>\n\n“此有故彼有，此起故彼起”这句话很适合概括杂阿含的阅读经验（T02, no. 99, p. 84c15）。单篇短经是“此”，篇与篇之间的呼应才显出“彼”。缘起不是一条可以脱离具体经验背诵的公式，而是对经验如何相依生起的反复说明。\n\n### 4.细读：短经怎样构成论证\n\n《杂阿含经》卷首第一经已经是一条完整的推理链：“當觀色無常。如是觀者，則為正觀。正觀者，則生厭離；厭離者，喜貪盡；喜貪盡者，說心解脫。”（T02, no. 99, p. 1a07–09）经文随即把同一观察施于受、想、行、识，末尾又说，如观无常，观苦、空、非我也应如此（p. 1a12–15）。短短一段，已经包含观察对象、正见、厌离、断贪与心解脱几个环节。\n\n第二经没有换一个主题，而是把“觀無常”改为“於色當正思惟，觀色無常如實知”，并说明这样便能断色欲贪（p. 1a17–23）。第三经又从反面设问：若不知、不明、不断、不离欲，便不能断苦；若知、明、断、离欲，则能断苦（p. 1a29–b04）。三经连读，读者看到的不是同一句话机械重复，而是同一命题从正说、解释到反证地展开。\n\n这就是短经的一种阅读方法。先把每经的主词、动词与条件词抄下来，再看相邻诸经改变了哪一项。若只把无常、无我当作标签，便看不出标签之间本来有推论；若把每一篇都当作完全独立的定义，又会把经文反复限定的条件读丢。〔本文判断〕遇到病中弟子的故事，如《阐陀经》，也宜先看他人的教说与弟子的疑虑怎样往返，再判断结尾的领悟，而不是只摘取一句“色無常”。\n\n### 5.阅读建议\n\n不要从第一千三百六十二经按顺序硬读。先选一个主题，例如五阴、六入处或缘起，连续读十至二十篇短经，再对照巴利相应部中的同主题文本。若只读一篇，容易把条件性的论述误读成普遍定义；放在相邻短经中，许多限定条件才会出现。\n\n> **EN corresponding · VI. Saṃyukta-āgama: A Problem List for Early Buddhism**\n>\n> **1. “Miscellaneous” does not mean “disordered”**\n>\n> The “miscellaneous” character of the Saṃyukta-āgama indicates a manner of compilation and need not be read as a complete absence of order. The received text has fifty fascicles and is conventionally said to contain 1,362 discourses; the CBETA base text is organized by fascicle and has no chapter-level catalog. It brings large numbers of short texts together through such threads as the five aggregates, six sense bases, dependent origination, path factors, the eight assemblies, and sayings of disciples. The order of the extant Chinese translation is confused, however, and the thematic divisions now called the “Five-Aggregate Recitation” and “Six-Sense-Base Recitation” depend largely on modern rearrangement. When citing a particular short text, one must give not only the number in the reconstructed edition but also the fascicle of the edition used. [A1] [B6]\n>\n> These short texts often address only one small question: that form is impermanent, that feeling is impermanent, how eye-consciousness arises, why dependent origination is not a soul, why meditation requires right view, or how a particular disciple observed body and mind during illness. Read singly, their information resembles aphorisms; read continuously, connections between concepts become visible.\n>\n> **2. Structural threads**\n>\n> According to the recitation-and-chapter structure of modern reconstructed editions, the Five-Aggregate Recitation places body, feeling, perception, formations, and consciousness under contemplation as impermanent, suffering, and non-self. The Six-Sense-Base Recitation deals with the eye, ear, nose, tongue, body, and mind and their objects; the section on dependent origination develops the twelve links; and the Path-Factor Recitation returns the four noble truths, the thirty-seven aids to awakening, and related material to the process of practice. The CBETA base text has no chapter-level catalog, so citation must still locate a passage by fascicle.\n>\n> This structure is not the familiar modern form of “general discussion first, chapters afterward.” The same question recurs through different persons and on different occasions. On a first reading, one may select by theme; on a second, one may follow the argument through adjacent short texts.\n>\n> **3. Representative texts and their relation to the Saṃyutta Nikāya**\n>\n> | Thread within the Saṃyukta-āgama | Main question | Closely related material in the Pāli Saṃyutta Nikāya |\n> |---|---|---|\n> | Texts on impermanence and non-self in the Five-Aggregate Recitation | Contemplation of and clinging to the five aggregates | SN 22, *Khandha-saṃyutta* (《蕴相应》) |\n> | Texts in the Six-Sense-Base Recitation | The six faculties, six objects, and arising of consciousness | SN 35, *Saḷāyatana-saṃyutta* (《六入处相应》) |\n> | Texts on dependent origination | The individual links of the twelvefold dependent origination | SN 12, *Nidāna-saṃyutta* (《因缘相应》) |\n> | *Zhuan falun jing* (《转法轮经》, conventionally no. 379) | The first turning of the wheel of Dharma and the four noble truths | SN 56.11–12, *Dhammacakkappavattana Sutta* (《转法轮经》) |\n> | *Chamo jing* (《差摩经》, conventionally no. 103) | Contemplating the five aggregates during illness without taking experience as a self | SN 22.89 |\n> | *Chantuó jing* (《阐陀经》, conventionally no. 262) | How a sick person facing death and liberation does not cling to the five aggregates | SN 22.90 |\n>\n> Most of these text names are modern identification labels for research and retrieval, not all original titles in the base text; the numbering conventions must also be specified. In the CBETA text, the catalog number for the *Chantuó jing* is 260, while the number at the discourse head reads 262; for the *Zhuan falun jing*, the catalog number is 377, while the number at the discourse head reads 379. The table uses the conventional numbers and records the fascicle, page, and reconstructed edition separately when citing. CBETA’s parallel-reference notes identify SN 22.90 and SN 56.11–12 respectively, but these markers indicate only that comparison may begin; they do not replace passage-by-passage collation. [A1]\n>\n> The Saṃyukta-āgama and the Pāli *Saṃyutta Nikāya* share a large body of parallel material, but the order of the received Chinese translation differs from the arrangement of the Pāli collection’s fifty-six Saṃyuttas. One Pāli Saṃyutta may be dispersed across different Chinese fascicles or chapters in reconstructed editions; one reconstructed chapter may correspond to several Pāli themes. Comparison cannot rely on chapter titles or discourse numbers alone. [A1] [A2] [B6]\n>\n> “When this exists, that exists; from the arising of this, that arises” aptly summarizes the reading experience of the Saṃyukta (explanatory rendering of the Chinese CBETA phrase above, not an official translation; T02, no. 99, p. 84c15). Individual short texts are the “this”; only the resonance between one text and another reveals the “that.” Dependent origination is not a formula that can be memorized in isolation from concrete experience, but a repeated account of how experience arises in dependence.\n>\n> **4. Close reading: how short texts construct an argument**\n>\n> The first text at the opening of the Saṃyukta-āgama already contains a complete inferential chain. Explanatory rendering of the Chinese CBETA quotation above—not an official translation: “Form should be contemplated as impermanent. One who contemplates it thus practices right contemplation. From right contemplation arises disenchantment; with disenchantment, delight and greed are exhausted; with delight and greed exhausted, it is called liberation of mind” (T02, no. 99, p. 1a07–09). The text immediately applies the same contemplation to feeling, perception, formations, and consciousness, and concludes that, just as impermanence is contemplated, so should suffering, emptiness, and non-self be contemplated (p. 1a12–15). In this brief passage, the object of contemplation, right view, disenchantment, the cessation of greed, and liberation of mind are already present.\n>\n> The second text does not change the theme. It changes “contemplate impermanence” to “rightly reflect on form and know its impermanence as it really is” (explanatory rendering of the Chinese CBETA quotation above, not an official translation), and explains that this can cut off sensual greed for form (p. 1a17–23). The third text asks from the reverse direction: if one does not know, comprehend, abandon, or become free from desire, one cannot put an end to suffering; if one knows, comprehends, abandons, and becomes free from desire, one can put an end to suffering (p. 1a29–b04). Read together, the three texts do not mechanically repeat one sentence but develop the same proposition through direct statement, explanation, and counterproof.\n>\n> This is one way of reading short texts. First copy down each text’s subject, verbs, and conditional terms; then examine which element changes in adjacent texts. If impermanence and non-self are treated merely as labels, the inference connecting them disappears. If every text is treated as a wholly independent definition, the qualifications repeatedly imposed by the texts are lost. 〔This essay’s judgment〕 In stories of sick disciples, such as the *Chantuó jing*, one should likewise follow the exchange between another’s teaching and the disciple’s doubts before judging the concluding realization, rather than extracting only the phrase “form is impermanent.”\n>\n> **5. Suggested reading**\n>\n> Do not attempt to read all 1,362 discourses mechanically in numerical order. First select a theme, such as the five aggregates, the six sense bases, or dependent origination; read ten to twenty short texts consecutively; and then compare texts on the same theme in the Pāli Saṃyutta Nikāya. A single text can easily make a conditional statement look like a universal definition. Many of its qualifications appear only when it is placed among adjacent short texts.\n\n## 七、增壹阿含：数目背后的次第\n\n### 1.数目是一种目录，也是一种教法\n\n《增壹阿含经》通行本五十一卷，四百七十二经，五十二品。各部按一法、二法，直至十一法组织，给读者一条清晰的检索路线。数目在这里不只是计数，它也提示修行项目可以被逐项展开。<a href=\"#ref-a1\" style=\"color:var(--blue)\">[A1]</a><a href=\"#ref-b7\" style=\"color:var(--blue)\">[B7]</a>\n\n同一数目之下可以容纳很不同的内容。十念品列念佛、念法、念僧等十种念，三宝品围绕佛、法、僧展开；十法之中，又可容纳十善、十念与禅修条件等不同项目。数目相同，不等于意义相同。读增壹阿含，要同时看数目、品题和经文语境。\n\n### 2.代表品与内容\n\n| 代表品或主题 | 主要内容 | 阅读价值 |\n|---|---|---|\n| 十念品第二 | 念佛、念法、念僧等十种念 | 观察念处与三宝信仰如何相接 |\n| 安般品第十七之一 | 安那般那念，即入出息念 | 把呼吸观察放回戒、定、慧的整体 |\n| 四谛品第二十五 | 苦、集、灭、道 | 看数目化目录如何承载核心教义 |\n| 四意断品第二十六之一 | 已生恶令断、未生恶令不生等四种努力 | 理解禅修中的主动取舍 |\n| 三宝品第二十一 | 佛、法、僧的归依与意义 | 理解信仰在修行生活中的位置 |\n| 马血天子问八政品第四十三 | 第一经以“賢聖八品道”说明世界边际，第二经说八关斋法 | 看八正道与在家斋戒怎样相接 |\n\n品题与序号依 CBETA 目录，表中仅将题字转为简体。其目录标记在第四十六品后跳至第四十八品，随后数品的品题序号比目录标记少一；本文保留这一错位，不把“五十二品”的通行称数当成每一处目录标记都已对齐。表中“安般品”“四意断品”等均跨卷，不能把品题当作单卷经题。<a href=\"#ref-a1\" style=\"color:var(--blue)\">[A1]</a>\n\n增壹阿含还保存了与菩萨、弥勒、六度等有关的材料。卷首序品已出现“菩薩發意趣大乘”“人尊說六度無極”的句子（T02, no. 125, p. 550a12–13），卷十九又记弥勒请问“具足六波羅蜜”的修行（p. 645b01–08）。仅凭“小乘”二字概括这部经的全部内容，会把这些层面一并抹掉。它们是否属于某一后期层、如何形成，需要另外的文本史研究；但在现存文本中，它们确实存在。<a href=\"#ref-a1\" style=\"color:var(--blue)\">[A1]</a>\n\n### 3.细读《四意断品》：数目把用功变成四项\n\n《四意断品》卷十八第一经先以山河、石壁、百草与五谷都依地生长为喻，说明诸善道品“住不放逸之地”才能长大（T02, no. 125, p. 635b12–15）。随后列出四类用功：“未生弊惡法，求方便令不生”；“已生弊惡法，求方便令不生，心不遠離，恒欲令滅”；“未生善法，求方便令生”；“已生善法，求方便令增多”（p. 635b16–21）。第二项虽然紧接“恒欲令滅”，前半句却作“令不生”，与同品后文的“求方便令滅”不同。本文保留底本这一自歧，不替它统一。\n\n四项不是四个可以随意交换的口号。前两项处理恶法，后两项处理善法；每项又以“未生”或“已生”为条件。把条件词删去，只背断恶修善，原文的检查作用便消失了。数目在这里的作用，是让修行者反复检查自己处在哪一种情形，以及下一步应当做什么。\n\n同品随后以转轮王、星宿、花朵等作喻，说明不放逸在诸善功德中的首要地位。第二经仍重复“已生弊惡法，求方便令不生，心不遠離，恒欲令滅”，第三、第四经则作“已生弊惡法，求方便令滅”（pp. 635c01–04, 635c11–13, 635c24–636a01）。读这类经，重复并非全然无用：比喻可以改变，项目却保持稳定；但稳定不等于每个字都已统一，恰是这处差异，提醒读者回到各经分别核对。〔本文判断〕与增支部对读时，也应先核对项目与条件，再看比喻是否相同。\n\n### 4.与增支部的近缘与错位\n\n巴利增支部 *Aṅguttara Nikāya* 同样按数目组织，分十一尼波多，每一类下收入大量短经。增壹阿含与它在编纂原则上明显近缘，却不能按“四部对四部”的简单方式逐品配对。<a href=\"#ref-a1\" style=\"color:var(--blue)\">[A1]</a><a href=\"#ref-a2\" style=\"color:var(--blue)\">[A2]</a><a href=\"#ref-b7\" style=\"color:var(--blue)\">[B7]</a>\n\n两边都有从一法到十一法的框架，但汉译五十二品与巴利十一大类的层级不同；一部汉译经可能容纳多个宣说，一个巴利短经编号也可能只对应汉译经中的一段。因此，增壹阿含四百七十二经与增支部的短经总数不能直接作数量比较。\n\n更复杂的是，增壹阿含的一些材料可以在增支部找到平行文本，另一些则与巴利其他尼柯耶或其他汉译经典更接近。数目相同只是检索线索，不是平行关系的证明。\n\n### 5.阅读建议\n\n把增壹阿含当作主题索引来用，比从头顺读更有效。关心禅修，可选十念品、安般品；关心伦理与信仰，可选三宝品、五戒相关部分；关心修行精进，可选四意断品。与巴利增支部对照时，先确定数目与主题，再核对段落，不要期待品目一一相对。\n\n> **EN corresponding · VII. Ekottara-āgama: The Sequence Behind the Numbers**\n>\n> **1. Number as catalog and as teaching**\n>\n> The received Ekottara-āgama has fifty-one fascicles, 472 discourses, and fifty-two chapters. Its parts are organized by one phenomenon, two phenomena, and so on through eleven, giving readers a clear route of retrieval. Number here is not merely counting; it also suggests that items of practice can be developed one by one. [A1] [B7]\n>\n> The same number can contain very different material. The Ten Recollections chapter lists ten recollections, including recollection of the Buddha, the Dharma, and the Sangha; the Three Jewels chapter centers on the Buddha, Dharma, and Sangha. Under ten phenomena, one finds such different items as the ten wholesome actions, the ten recollections, and conditions of meditation. The same number does not mean the same meaning. In reading the Ekottara, one must consider number, chapter title, and textual context together.\n>\n> **2. Representative chapters and their contents**\n>\n> | Representative chapter or theme | Main content | Value for reading |\n> |---|---|---|\n> | Ten Recollections, chapter 2 | Ten recollections, including the Buddha, the Dharma, and the Sangha | Observing how the establishments of mindfulness connect with faith in the Three Jewels |\n> | Ānāpāna, chapter 17, part 1 | *Ānāpāna-smṛti*, mindfulness of breathing in and out | Returning observation of the breath to the whole of morality, concentration, and wisdom |\n> | Four Noble Truths, chapter 25 | Suffering, origin, cessation, and path | Seeing how a numerical catalog carries the core teaching |\n> | Four Right Efforts, chapter 26, part 1 | The four endeavors: to abandon arisen unwholesome states, prevent unarisen unwholesome states, and to arouse and maintain wholesome states | Understanding active discrimination in meditation |\n> | Three Jewels, chapter 21 | Taking refuge in and the meaning of the Buddha, Dharma, and Sangha | Understanding the place of faith in a life of practice |\n> | The Chapter of the Horse-Blood Deva’s Questions on the Eight Practices, chapter 43 | The first text uses the “eight practices of the noble sages” to explain the world’s limits; the second teaches the eight precepts | Seeing how the noble eightfold path connects with lay observance days |\n>\n> Chapter titles and sequence numbers follow the CBETA catalog, with only the characters simplified in the table. After chapter 46, the catalog marker jumps to chapter 48; in several following chapters, the number in the chapter title is one less than the catalog marker. This essay preserves the discrepancy rather than treating the conventional total of “fifty-two chapters” as proof that every catalog marker is aligned. Chapters such as Ānāpāna and Four Right Efforts span fascicles, so a chapter title must not be treated as the title of a single fascicle’s text. [A1]\n>\n> The Ekottara also preserves material related to bodhisattvas, Maitreya, and the six perfections. Explanatory renderings of the Chinese CBETA phrases above—not official translations—are “Bodhisattvas give rise to the intention to go toward the Mahāyāna” and “the Honored One teaches the six perfections without limit” (T02, no. 125, p. 550a12–13). Fascicle 19 also records Maitreya asking about practice “endowed with the six pāramitās” (explanatory rendering of the Chinese CBETA phrase above, not an official translation; p. 645b01–08). To summarize the entire collection by the two words “Hīnayāna” would erase these dimensions. Whether they belong to a particular later stratum and how they took shape require separate research in textual history; within the extant text, however, they are certainly present. [A1]\n>\n> **3. Close reading the Four Right Efforts: number turns effort into four items**\n>\n> The first text of the Four Right Efforts chapter in fascicle 18 begins with a simile: mountains, rivers, stone walls, grasses, and grains all grow by relying on the earth. It thereby explains that the wholesome path factors can grow only when they “dwell on the ground of diligence” (explanatory rendering of the Chinese CBETA phrase above, not an official translation; T02, no. 125, p. 635b12–15). It then lists four kinds of effort. Explanatory renderings of the Chinese CBETA quotations above—not official translations—are: “Unwholesome states not yet arisen: seek a means to prevent their arising”; “Unwholesome states already arisen: seek a means to bring them to cessation, do not turn the mind away, and constantly wish to bring them to cessation”; “Wholesome states not yet arisen: seek a means to bring them into being”; and “Wholesome states already arisen: seek a means to increase them” (p. 635b16–21). In the second item, although “constantly wish to bring them to cessation” immediately follows, the first half says “prevent their arising,” unlike the later “seek a means to bring them to cessation” in the same chapter. This essay preserves this internal discrepancy in the base text rather than standardizing it.\n>\n> The four items are not four slogans that can be exchanged at will. The first two deal with unwholesome states and the last two with wholesome states; each is conditioned by whether the state is “not yet arisen” or “already arisen.” If the conditional terms are deleted and one merely memorizes “abandon evil and cultivate good,” the text’s function as a checklist disappears. Number here enables practitioners to examine repeatedly which situation they are in and what they should do next.\n>\n> Later in the same chapter, similes of a wheel-turning king, stars, and flowers explain the primacy of diligence among wholesome qualities. The second text repeats “Unwholesome states already arisen: seek a means to prevent their arising, do not turn the mind away, and constantly wish to bring them to cessation,” while the third and fourth texts instead say “Unwholesome states already arisen: seek a means to bring them to cessation” (explanatory renderings of the Chinese CBETA quotations above, not official translations; pp. 635c01–04, 635c11–13, 635c24–636a01). In such texts, repetition is not entirely useless: the simile may change while the item remains stable. But stability does not mean that every word has been standardized; precisely this discrepancy reminds readers to check each text separately. 〔This essay’s judgment〕 Comparison with the Aṅguttara Nikāya should likewise begin with the items and conditions before considering whether the similes are the same.\n>\n> **4. Affinity and misalignment with the Aṅguttara Nikāya**\n>\n> The Pāli *Aṅguttara Nikāya* is also organized by number. It is divided into eleven Nipātas, each containing a large number of short texts. The Ekottara and the Aṅguttara are clearly close in their principle of compilation, but their chapters cannot be paired one by one through a simple scheme of “four collections against four collections.” [A1] [A2] [B7]\n>\n> Both have a framework running from one phenomenon through eleven, but the Chinese fifty-two chapters and the Pāli eleven major divisions operate at different levels. One Chinese discourse may contain several teachings, while one Pāli short-text number may correspond to only a passage within a Chinese discourse. The total of 472 discourses in the Ekottara therefore cannot be compared directly with the total number of short texts in the Aṅguttara.\n>\n> More complex still, some Ekottara material has parallels in the Aṅguttara, while other material is closer to other Pāli Nikāyas or other Chinese translations. An identical number is a retrieval clue, not proof of a parallel relationship.\n>\n> **5. Suggested reading**\n>\n> It is more effective to use the Ekottara as a thematic index than to read it from beginning to end. For meditation, select the Ten Recollections and Ānāpāna chapters; for ethics and faith, the Three Jewels chapter and sections related to the five precepts; for diligence in practice, the Four Right Efforts chapter. When comparing with the Pāli Aṅguttara, first determine the number and theme, then check passages; do not expect chapters to correspond one by one.\n\n## 八、汉传四阿含与巴利四尼柯耶：能对照，不能画等号\n\n### 1.四组近缘关系\n\n| 汉传经典 | 巴利近缘经典 | 对应程度 | 不能忽略的限制 |\n|---|---|---|---|\n| 长阿含 | 长部 DN | 叙事与长篇论说多有平行 | 双方选文、编排和细节不同，长阿含不是长部的汉译 |\n| 中阿含 | 中部 MN | 四组中最近缘的一组 | 222 经与 152 经的规模不同，且中阿含还与 DN、SN 有跨部对应 |\n| 杂阿含 | 相应部 SN | 大量短经与主题平行 | 汉译本次序与 SN 的五十六相应不同，不能按品号硬套 |\n| 增壹阿含 | 增支部 AN | 数目编排原则明显相近 | 五十二品与十一大类层级不同，单篇聚合方式也不同 |\n\n“对应程度”是本文为阅读方便所作的概括，不是可量化的亲缘评分。它只说明哪些地方比较容易找到平行材料，不判断哪一部更古老、更完整或更正统。\n\n<figure style=\"margin:20px 0 24px\">\n<svg viewBox=\"0 0 920 458\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;display:block\" role=\"img\" aria-label=\"汉译四阿含与巴利前四尼柯耶的四组近缘关系；虚线表示平行材料而非逐部翻译，巴利小部位于四组等式之外\">\n<defs><marker id=\"agama-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\" opacity=\"0.55\"/></marker></defs>\n<text x=\"28\" y=\"30\" font-size=\"15\" fill=\"currentColor\" font-weight=\"600\">四组近缘关系，不是四个翻译单位</text>\n<text x=\"28\" y=\"53\" font-size=\"11\" fill=\"currentColor\" opacity=\"0.6\">虚线：可核对的平行材料　方框：各部类，不表示翻译对应</text>\n<text x=\"155\" y=\"86\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"600\">汉译四阿含</text>\n<text x=\"765\" y=\"86\" font-size=\"12\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"600\">巴利前四尼柯耶</text>\n<g fill=\"rgba(184,134,60,0.14)\" stroke=\"#b8863c\">\n<rect x=\"45\" y=\"105\" width=\"220\" height=\"54\" rx=\"5\"/>\n<rect x=\"45\" y=\"178\" width=\"220\" height=\"54\" rx=\"5\"/>\n<rect x=\"45\" y=\"251\" width=\"220\" height=\"54\" rx=\"5\"/>\n<rect x=\"45\" y=\"324\" width=\"220\" height=\"54\" rx=\"5\"/>\n</g>\n<g fill=\"rgba(94,139,158,0.14)\" stroke=\"#5e8b9e\">\n<rect x=\"655\" y=\"105\" width=\"220\" height=\"54\" rx=\"5\"/>\n<rect x=\"655\" y=\"178\" width=\"220\" height=\"54\" rx=\"5\"/>\n<rect x=\"655\" y=\"251\" width=\"220\" height=\"54\" rx=\"5\"/>\n<rect x=\"655\" y=\"324\" width=\"220\" height=\"54\" rx=\"5\"/>\n</g>\n<g font-size=\"14\" text-anchor=\"middle\" fill=\"currentColor\" font-weight=\"600\">\n<text x=\"155\" y=\"138\">长阿含 · 30 经</text><text x=\"765\" y=\"138\">长部 · DN</text>\n<text x=\"155\" y=\"211\">中阿含 · 222 经</text><text x=\"765\" y=\"211\">中部 · MN</text>\n<text x=\"155\" y=\"284\">杂阿含 · 短经汇编</text><text x=\"765\" y=\"284\">相应部 · SN</text>\n<text x=\"155\" y=\"357\">增壹阿含 · 数目编排</text><text x=\"765\" y=\"357\">增支部 · AN</text>\n</g>\n<g stroke=\"currentColor\" stroke-width=\"1.3\" stroke-dasharray=\"5 5\" opacity=\"0.5\" fill=\"none\" marker-end=\"url(#agama-arrow)
