font-size:0.85em;\">第一会·菩提场（品1-6）<br/>所信因果周</div>\n<div style=\"text-align:center;color:#666;\">↓</div>\n<div style=\"background:linear-gradient(90deg,#f0f0f0,#fafafa);border:1px solid #ccc;border-radius:6px;padding:8px 12px;text-align:center;font-size:0.85em;\">第二会·普光明殿（品7-12）<br/>差别因果周·十信位</div>\n<div style=\"text-align:center;color:#666;\">↓</div>\n<div style=\"background:linear-gradient(90deg,#e6ffe6,#f7fff7);border:1px solid #8fd98f;border-radius:6px;padding:8px 12px;text-align:center;font-size:0.85em;\">第三会·忉利天宫（品13-18）<br/>差别因果周·<b>十住位</b>·本品为首</div>\n<div style=\"text-align:center;color:#666;\">↓</div>\n<div style=\"background:linear-gradient(90deg,#fff2e6,#fffaf7);border:1px solid #d9b38c;border-radius:6px;padding:8px 12px;text-align:center;font-size:0.85em;\">第四会·夜摩天宫（品19-22）<br/>十行位</div>\n</div>\n</div>\n\n**说明**：澄观《疏》判第三会为「十住会」（`T1735` 释名「約處名忉利天會。約人名法慧菩薩會。約法名十住會」），WISE 位次由第一会「所信」→第二会「十信」→第三会「十住」展转升进。本品即第三会开场之「昇处」段，未正说十住（十住位次在第十五品），先明**佛昇须弥、赴帝释请、处妙胜殿**之法会因缘。\n\n#### 图 〇-2　「不起而升」体用相即图（月喻·澄观疏）\n\n<div style=\"background:rgba(94,139,158,0.04);border:1px solid var(--line, #d9cdb8);border-radius:8px;padding:16px;margin:12px 0;overflow-x:auto;\">\n<div style=\"display:flex;gap:20px;flex-wrap:wrap;align-items:stretch;\">\n<div style=\"flex:1;min-width:200px;border:1px solid #8fb3d9;border-radius:6px;padding:10px 12px;background:linear-gradient(180deg,#e6f3ff,#f7fbff);\">\n<div style=\"font-weight:600;text-align:center;margin-bottom:6px;font-size:0.85em;\">体·不離菩提樹下</div>\n<div style=\"font-size:0.78em;text-align:center;\">80-02「世尊不離一切菩提樹下」<br/>佛身遍法界·本來在彼</div>\n</div>\n<div style=\"display:flex;align-items:center;color:#666;\">⇄</div>\n<div style=\"flex:1;min-width:200px;border:1px solid #8fd98f;border-radius:6px;padding:10px 12px;background:linear-gradient(180deg,#e6ffe6,#f7fff7);\">\n<div style=\"font-weight:600;text-align:center;margin-bottom:6px;font-size:0.85em;\">用·而上昇須彌向帝釋殿</div>\n<div style=\"font-size:0.78em;text-align:center;\">機感前後·有住有升<br/>緣感見升天上</div>\n</div>\n</div>\n<div style=\"margin-top:10px;font-size:0.76em;color:#666;\">澄观月喻：「譬猶朗月流影遍應。且澄江一月三舟共觀。一舟停住。二舟南北。南者見月千里隨南。北者見月千里隨北。停舟之者見月不移。是為此月不離中流而往南北」（`T1735` 卷第十六·释「不離齊升」段）——**非移觉树之佛而升天宫，故云不離覺樹而升釋殿**。〔本文判断〕此即后华严「不起而升」十义（十玄雏形）之本地直证。</div>\n</div>\n\n---\n\n## 〇、凡例（简要）\n\n一、**校勘底本**：以 `T10n0279`（八十华严）为底本。六十华严（`T09n0278`·本品相当者为〈佛昇須彌頂品第九〉）、四十华严（`T10n0293`）不作底本，但须品读并作对读；凡异译异说并列而不强断。\n\n二、**品读主从**：以八十华严为叙事主轴，六十为辅读与对读。主从仅指骨架取自何本，非谓其余可略。\n\n三、**疏解三层**：其下「疏解」为依经文直解；「名相」为训释与梵汉（凡无把握者标〔待核〕）；「会读」为注疏家与讲记等之判，非经证，凡引皆逐字回源。\n\n四、**引文可回源**：凡引经皆照 CBETA 底本原字形（繁体·异体），可回源可复核；凡引注疏皆注明经号与段落，无把握者标〔待核〕。**不擅改经文，亦不据听录回改底本。**\n\n五、**存疑必标**：凡未能确证者标〔待核〕；凡属本席推断者标「〔本文判断〕」；凡讲者之说疑误者只标不改。\n\n六、**文本现象与信度**：本品「善来」请佛句**经文并无重出**——平文器 dump 另列之 80-04 系将庄严段（80-03）外层 `<p>` 内嵌套节点**重复识别**而成的假象单元（前向游标重计·非另有独立段），实测品界 body80 中「善來」仅×3（一处三称），如实标识（见 §1.3、§1.5、§2.4、§6.4）；八十「十千」庄严对六十「萬種／萬寶／一萬」，为两译数量词之自然差异，不强齐（见 §六）。\n\n七、**版本差异之惯例**：凡藏译、梵本、六十／四十华严与本品的分品、用字、文段有无、内容增减之别，**悉举而比之**，注版本与信度；**严禁以「藏译云」冒充未见之原文**。\n\n八、**计数口径**：字数以剥校勘之 CJK 口径计（含品题）；句数以句末标点（。！？）计；偈颂以颂行计。本品品界实测 CJK 654（含品题），详见 §七。\n\n---\n\n## 一、概述与品题解义\n\n### 1.1 品题释义\n\n**品名**：**升须弥山顶品**（八十华严**第十三品**，唐·实叉难陀译）。全篇在《大方广佛华严经》**卷第十六**，紧接第十二品《贤首品》之后、第十四品《须弥顶上偈赞品》之前，为**第三会「忉利天宫会」之首品**。\n\n**「昇須彌山頂」**——须弥，正云**苏迷卢**（*Sumeru*），此云**妙高**（澄观《疏》：「須彌正云蘇迷盧。此云妙高」）。品题「昇」（底本作「昇」，`T10n0279` 平文器原字形），谓佛以自在力**不離菩提樹下而上昇須彌、向帝釋殿**。法藏《探玄记》释：「**佛是化主動靜無礙不去而進故云昇**」——「昇」非移动位移之昇，乃**不去而进、不起而升**之自在义（详见 §4.1、§5.2）。\n\n**「妙」十义**（澄观《疏》·`T1735`）：妙高之所以「妙」，具十义——**体妙**（四宝所成）、**相妙**（八方四级）、**色妙**（四正色·北金东银南吠琉璃西颇胝迦）、**德妙**（八方猛风不能令动）、**眷属妙**（七金山七香海围绕）、**依持妙**（唯天依住·得通者居）、**作业妙**（不離本处而镇四洲·映蔽日月成昼夜）、**生果妙**（波利质多能益天众）、**为首妙**（四洲地最在先成）、**坚固妙**（轮围中最在后坏）。高八万四千由旬，入水亦尔。**「十住之行亦復如是」**——以山体十妙况表十住位德（此为澄观圆教释，详见 §四）。\n\n### 1.2 品位与脉络（承上启下）\n\n**在华严经三十九品中之位**：第三会（忉利天宫）首品，八十华严**第十三品**，占**卷第十六**。\n\n**判位**——**法藏五分**（`T1733`）：第一会「舉果勸樂生信分」，第二至六会「修因契果生解分」——**本品（第三会首品）属「修因契果生解分」·十住位之开端**。\n\n**澄观**（`T1735`）判第三会五门：「約處名忉利天會。約人名法慧菩薩會。約法名十住會」；来意「**前信是住之方便**……**正位故次來也**」——由十信（第二会）入十住（第三会），信为住之前方便。\n\n**智俨**（`T1732`）：「此会有六品分三。初⼆品明⽅便發起。次⼆品明正位相。次⼆品明後成滿⾜⾏相」——第三会六品（P13–P18）分**方便发起／正位相／满足行相**三段，本品居「方便发起」之首。\n\n**李通玄**（`T1739`）：「此⼗住位中有六品經……如是六品共成⼗住法⾨」；判本品「義分為三。⼀釋品來意。⼆以處表法。三隨文釋義」——以妙峯山表法，明「從⼗信入⼗住入位之昇進」。\n\n**承上启下**：\n- **承上**：第十二品《贤首品》明十信之**德**（「信为道元功德母」），第二会六品收官；\n- **本品**：第三会开场，明**佛昇须弥、处妙胜殿、帝释请佛、偈赞十佛**之法会昇进之因缘——**从信入住、位渐昇进**之「昇处」段；十住位次正说尚在后（第十五品）；\n- **启下**：第十四品《须弥顶上偈赞品》为本品之**重颂**（附品），第十五品《十住品》方正说十住位次。\n\n**「昇」所表位次**（澄观·法藏同判）：法藏设问「何不⾄四天王天」，答三意——一以彼是杂鬼神天显法非胜故超过；二寄法明「⼗信是外凡退位、⼗住是內凡不退」欲表进退悬殊故越四天王处；三「若未⾄⼭頂容有進退。到⼭頂上即安住不退」——**以登山顶表十住位「安住不退」**，超四王天处以显位次升进〔本文判断：以处表法之判，属诸家释〕。\n\n### 1.3 篇幅与结构预览\n\n本品为**短品**。`_e13_full.py` 平文器实测：品界（昇須彌山頂品第十三→須彌頂上偈讚品第十四）**CJK 654**（含品题·与 `_p9_11_audit.py` 之 body80 口径同）。品题＋**六个正文单元**（80-01·02·03·05·06·07）。〔按·单元口径〕`_e13_dump.txt` 另列「80-04」（24 字·帝释请佛句），其 CJK **与 80-03 末句全同**、且 80-04 之定位落**在 80-03 区间之内**——系平文器 `root.iter()` 既遍历庄严段外层 `<p>`（80-03·含请佛句）、又重复识别其内层嵌套节点（80-04·即该请佛句）而成之**重计单元**，非经文另有独立段；剔此假象单元后（654＝9品题＋51＋21＋158＋60＋280＋75）恰与品界 CJK 吻合（**善來在品界仅×3·即一处请佛·无重出**）·入文（§2.13）只取六单元。偈颂为 80-06 **十佛颂**（十佛各一颂·每颂四句·通五十句），长行为 80-01·02·03·05·07。\n\n**八段结构**（依本品经文自然单元·并与澄观「今初一品⻑分十段」科相应）：\n\n| 段 | 单元 | 事 | 澄观十段科（`T1735`） |\n|---|---|---|---|\n| 一 | 80-01 | 十方齐现·各谓对佛 | 一本會齊現 |\n| 二 | 80-02 | 不離菩提树上昇须弥 | 二不離齊升 |\n| 三 | 80-03 | 帝释遥见佛来·庄严殿座 | 三各見佛來·四各嚴殿座 |\n| 四 | 80-03末 | 善来请佛 | 五皆來請佛 |\n| 五 | 80-05 | 世尊受请入殿·乐音止息 | 六俱時入殿·七樂音並止 |\n| 六 | 80-05 | 忆念过去善根·说颂 | 八各念昔因 |\n| 七 | 80-06 | 十佛偈赞 | 九同讚如來 |\n| 八 | 80-07 | 殿忽广博·结通十方 | 十殿皆廣博嚴淨 |\n\n澄观总判第三会六品「**分為二分。初二品方便發起。後四品當會正說**」；本品「唯是由致」（纯为发起序），偈赞一品「義有兩兼」（兼方便与所依）。\n\n### 1.4 核心要义\n\n本品虽短，义摄三枢：\n\n**一、不起而升·体用相即**。佛「不離一切菩提樹下，而上昇須彌」——昇非位移，乃**即体之用、即用之体**相即无碍。澄观立「月喻」释之，古德十义（一约处相入门…十约成法界大会门）为**十玄门之雏形**。此为全品最深之点（详见 §4.1）。\n\n**二、以处表法·位渐升进**。须弥山顶·忉利天宫·妙胜殿，皆表十住位德。山体「妙有十义」况十住行德；越四王天至山顶，表十信（退位）入十住（不退）之悬殊。\n\n**三、偈赞十佛·本迹交映**。帝释忆念过去佛所种善根，以偈赞**十佛**（迦葉·拘那牟尼·迦羅鳩馱·毘舍浮·尸棄·毘婆尸·弗沙·提舍·波頭摩·然燈），每颂结「**彼佛曾來入此殿，是故此處最吉祥**」——以过去七佛及三佛曾入此殿，显此处之胜、此法之常恒；「殿忽然廣博寬容」示如意相、廓大慈悲、觉智现前。\n\n> **EN gist**：*This opening chapter of the Third Assembly stages the Buddha's ascent—not as locomotion but as non-moving arrival (\"not leaving the bodhi tree, yet ascending Sumeru\")—to Śakra's palace, where the vastness of the hall and the ten-Buddha verse establish the doctrinal frame for the coming Ten Abodes (daśa-vihāra).*\n\n### 1.5 经文文本现象与信度标识\n\n**〔单元重计・非经文重出〕善来请佛句**：庄严段（80-03）长行末帝释「曲躬合掌……而作是言：『善來世尊！善來善逝！善來如來、應、正等覺！唯願哀愍，處此宮殿！』」——**善来请佛句在品界内仅出现一次**（实测 品界 body80 中「善來」×3・即一三称・无叠句）。`_e13_dump.txt` 之所以另列 80-04（与 80-03 末句同文），系平文器将庄严段外层 `<p>` 内之嵌套节点**重复识别**为一独立单元（前向游标假象·非经文另有重出）。信度：经文无重出之事实・不立「重出」校勘；入文（§2.13）只取庄严段 80-03 一处（§1.3·§6.4）。\n\n**〔数量词异译〕十千 vs 万**：八十庄严段（80-03）屡用「**十千**」（十千層級·十千金網·十千種帳·十千種蓋·十千繒綺·十千珠瓔·十千衣服·十千天子·十千梵王·十千光明）；六十相当段（60-002）作「**萬種／萬寶／一萬**」（萬種雜寶·萬種寶帳·萬寶網·萬種眾妙寶蓋·萬種瓔珞·萬種寶衣·一萬天子·一萬梵天·一萬光明）。「十千」即「萬」，数值同而译词异，系两译之自然现象，**不强齐、不互改**（§六·§7.3）。澄观疏据八十释：「**皆云十千者。萬行因感故**」（`T1735`）——以十千表万行之因感。\n\n**〔体例〕品题原字形**：底本 `T10n0279` 品题作「**昇**須彌山頂品第十三」（「昇」），澄观《疏》（`T1735`）疏文作「**升**須彌山頂品第十三」（「升」）——升／昇为异体，各照底本，不统一。祖典 txt 另含康熙部首（⼗⼭⾸⻑⻄），平文与锚定以 NFKD 归一处理、回原字形（§七·§八）。\n\n### 1.6 版本差异之惯例与本品之版本情况\n\n- **八十（`T10n0279`·唐·实叉难陀）**：品 13〈昇須彌山頂品第十三〉，第三会（忉利天宫·十住）首品。\n- **六十（`T09n0278`·晋·佛驮跋陀罗）**：相当品为〈**佛昇須彌頂品第九**〉（`T09n0278` juan7），品数分配与品名有异（六十三十四品）。本品与六十**有相当段**，可逐行对读（见 §6.1′），十佛名号多异译。\n- **四十（`T10n0293`·唐·般若）**：全经仅「入法界品」一品，**无相当之升须弥品**，本品不取为对读（§6.2）。\n- **藏译（`Toh 44`·Dege 45 品）**：本机**未入库逐字对勘**〔未竟〕，只标分品相当之传闻，不冒充原文（§6.3）。\n\n### 1.7 核心要义小结\n\n本品以「**不起而升**」之法界义开第三会十住之门，以须弥妙高十义表十住行德，以十佛偈赞显此处此法之常恒。文虽短（CJK 654），义贯体用、处法、本迹三层；正说十住位次在第十五品，本品为之**发起序分**。诸家科判（澄观十段·智俨三分·法藏八序·慧苑五序·李通玄长科）皆归一趣：**由信入住、依佛智而显差别**。\n\n---\n\n\n## 二、卷第十六（升须弥山顶品第十三·本品全文）\n\n### 2.0 结构总表（据经切分）\n\n本品八个 `<p>`/`<lg>` 单元（80-00 品题 head ＋ 80-01–80-07），依 `_e13_full.py` 平文器实测。澄观《疏》「今初一品⻑分十段」（`T1735`），下表**左依本品经文单元、右系澄观十段科**（一段之经或跨二科、一科之别未必各成一 `<p>`，科判与经单元非严格 1:1，如实对应）：\n\n| 经单元 | 事类 | 起句（照底本） | 澄观十段科 |\n|---|---|---|---|\n| 80-01 | 齐现 | 爾時，如來威神力故…… | 一本會齊現 |\n| 80-02 | 齐升 | 爾時，世尊不離一切菩提樹下…… | 二不離齊升 |\n| 80-03 | 见佛·严殿 | 時，天帝釋在妙勝殿前遙見佛來…… | 三各見佛來·四各嚴殿座 |\n| （80-03 末） | 请佛 | 「善來世尊！……」 | 五皆來請佛 |\n| 80-05 | 入殿·止音·念昔 | 爾時，世尊即受其請，入妙勝殿…… | 六俱時入殿·七樂音並止·八各念昔因 |\n| 80-06 | 偈赞（十佛颂） | 「迦葉如來具大悲……」 | 九同讚如來 |\n| 80-07 | 广博·结通 | 如此世界中，忉利天王…… | 十殿皆廣博嚴淨 |\n\n〔按〕澄观总科：「此會六品分為二分。初二品方便發起。後四品當會正說。前中初之一品。唯是由致」——本品（初品）纯为**发起序分**；偈赞次品「義有兩兼」（一是方便·谓前品化主赴机后品助化赞佛；二是所依·谓三天说法各有偈赞）。\n\n### 2.1 序分·一本会齐现（80-01）\n\n> 爾時，如來威神力故，十方一切世界，一一四天下閻浮提中，悉見如來坐於樹下，各有菩薩承佛神力而演說法，靡不自謂恒對於佛。\n\n**疏解**：「爾時」承前第二会。佛**威神力故**，十方一切世界、一一四天下之每一阎浮提中，皆**见如来坐于树下**、各有菩萨承佛神力演说法，且各「自谓恒对于佛」——一一处各各不见其杂，各各谓佛唯对自己说法。此即**一多相容、主伴圆融**之法界现量：一佛身遍坐一切处，而各处各谓「佛恒对我」。\n\n**名相**：「四天下」＝一须弥四洲（东弗于逮·南阎浮提·西瞿耶尼·北郁单越）之一洲（南阎浮提）；「閻浮提」*Jambudvīpa*。〔待核〕梵名训释从诸家通说，本地直据疏文「一一四天下閻浮提」，不另立梵本。\n\n**会读**：澄观释「言爾時者。即前二會時。主伴齊遍演前二會之法也。今此明遍。即十重說處中第一重也。何須舉此。欲明前會不散成後會故。後必帶前。合成法界無礙會故」（`T1735`）——举「十方齐现」者，为明**前会不散、成后会**；一一诸会无休息、后后诸会皆同时（第九会十重说处·第一重）。法藏亦判此段为「體融遍周法界」之「⼀三世間融。⼆依正⼆融……四於諸菩薩有三業融」（`T1733` 十住会段），以主伴圆明显一乘法「⼀說⼀切說」。\n\n### 2.2 不離齐升·不起而升（80-02）\n\n> 爾時，世尊不離一切菩提樹下，而上昇須彌，向帝釋殿。\n\n**疏解**：此全品**眼目**。「不離……而昇……」——**不離**者，佛身遍法界，本来在彼菩提树下（体）；**昇**者，机缘前后，赴感现于忉利（用）。离即不离，昇即无昇，体用相即之自在义（详见 §4.1、§5.1 疏科长摘「不離齊升」段）。\n\n**名相**：「菩提樹」＝世尊成觉处（摩伽陀国尼连河畔）；「須彌」＝苏迷卢·妙高山；「帝釋殿」＝忉利天宫·善见城·妙胜殿（详见 §4.2）。\n\n**会读**：澄观「問動靜相違去住懸隔。既云不離何得言升」——广列古多释（本释迦身不起道树别起应化·不起是报升天是化·不起是法身升天是化用·不往而至不來相而來）并皆非了，**今显正义**：「然佛得菩提。智無不周體無不在。無依無住無去無來。然以自在即體之應。應隨體遍。緣感前後有住有升」，立**月喻**（澄江一月三舟共观·见月随去·停者见月不移·此月不离中流而往南北），引古德十义（处相入门…成法界大会门）决之。李通玄别判「不離菩提樹」五义（`T1739`）。〔本文判断〕此「不起而升」之十义结构，为澄观十玄门（尤其「同时相应遍」「隐密显了遍」）在升品科段之早期直证。\n\n### 2.3 各见佛来·各严殿座（80-03·庄严段）\n\n> 時，天帝釋在妙勝殿前遙見佛來，即以神力莊嚴此殿，置普光明藏師子之座，其座悉以妙寶所成：十千層級逈極莊嚴，十千金網彌覆其上，十千種帳、十千種蓋周迴間列，十千繒綺以為垂帶，十千珠瓔周遍交絡，十千衣服敷布座上，十千天子、十千梵王前後圍遶，十千光明而為照耀。\n\n**疏解**：帝释**遥见佛来**——「隣而未即故云遙見」（澄观），约佛则用从体起，约机则境从心现。即以神力**庄严此殿**，敷置**普光明藏师子之座**，座以妙宝成，**十千**层级·金网·种帐·种盖·缯绮·珠瓔·衣服·天子·梵王·光明，十段庄严周匝间列。\n\n**名相**：「普光明藏」——澄观释「此是解位智。照法空含眾德故。從信始入故有置言」；「師子之座」表十住之法门（「置師子座。表十住之法門故」）。「⼗千」＝一万，八十数量词（对六十作「萬」·§1.5·§六）。\n\n**会读**：澄观逐句释庄严：「⽂有⼗句。初總餘別。總云普光明藏者……別中初句約體。餘並顯嚴。皆云⼗千者。萬⾏因感故。⾔層級者萬⾏熏成故。⾦網防護。慈悲帳蓋以育以覆。四攝繒綺以為周垂。圓融⾏願交絡萬善。柔忍慚愧以覆法空第⼀義天。清淨梵⾏繞斯法體。⼀⼀智照故⽇光明。於⽣死中。遣⻑夜闇舉斯果德。令物⾏因」（`T1735`）——以殿座十严，一一配万行因感·十住行德。智俨判为「住處序·請佛序·集眾序·放光序·讚歎序」五序之前段（`T1732`）。\n\n### 2.4 皆来请佛·善来（80-03 末句）\n\n> 爾時，帝釋奉為如來敷置座已，曲躬合掌，恭敬向佛而作是言：「善來世尊！善來善逝！善來如來、應、正等覺！唯願哀愍，處此宮殿！」\n\n**疏解**：帝释为佛敷座已，曲躬合掌，请佛居殿。**请佛三称「善来」**——世尊·善逝·如来应正等觉（三德号），愿哀愍处此宫殿。〔按〕此即庄严段（80-03）之末句，**善来请佛在品界仅一处**（无重出·dump 之 80-04 系平文器嵌套节点重计假象·§1.3·§1.5·§6.4）。\n\n**名相**：「善來」*sādhu*·**suāgata**——澄观释「言善來者應機來故。不來相而來故。帶法界會來故。三稱善者喜之至故。舉三號者略歎德故。願哀處者。希仗勝田生大福故」（`T1735`）。〔待核〕梵字 *suāgata*（善来·善逝）为如来十号之一，此处三「善来」叠用系请辞语气，非十号次第。\n\n**会读**：此即澄观十段科「**五皆來請佛**」——于中「三業崇敬以為請儀」（身曲躬·口称善来·意恭敬）。法藏判此段「⼆爾時帝釋下嚴根欲」（严根·欲之殿为法器）·「三爾時世尊下明根緣契合」（`T1733`）。\n\n### 2.5 俱时入殿·乐音并止（80-05 上半）\n\n> 爾時，世尊即受其請，入妙勝殿；十方一切諸世界中，悉亦如是。爾時，帝釋以佛神力，諸宮殿中所有樂音自然止息，即自憶念過去佛所種諸善根而說頌言：\n\n**疏解**：世尊**受请入殿**，「十方一切诸世界中悉亦如是」——一入一切入，结通十方。帝释以佛神力，宫殿所有乐音**自然止息**，即自**忆念过去佛所种诸善根**而说颂。止音表摄散归静·得定益；忆念表寂然无思·发宿住智。\n\n**名相**：「樂音自然止息」——澄观「第七爾時下樂音止息。謂攝散歸靜得定益故」；「⾃憶念過去佛所種諸善根」——「第八即⾃下。各念昔因獲智益也。散緣既⽌勝德現前。寂然無思發宿住智。種善根者。即下⼗佛曾⼊此殿。聞法供養故。亦表⾒⾃⼼性。同昔佛故」（`T1735`）。\n\n**会读**：澄观科「六俱時入殿」（謂根緣契合成益不虛·十方如是·通上六段入殿事訖故一结通）→「七樂音並止」→「八各念昔因」，三科并在 80-05 一 `<p>` 之内（经单元与科判之不齐，如实记）。\n\n### 2.6 忆念昔因·十佛曾入（80-05 末·说颂引）\n\n**疏解**：「即自憶念過去佛所種諸善根而說頌言」——颂前标「说颂」，其所忆念者即下十佛曾入此殿之因缘。此段为 2.5（乐音止息）与 2.7（十佛颂）之**过桥**，不另起 `<p>`，故并入 80-05。\n\n**会读**：澄观「⾃憶念」释作发宿住智（第八段·获智益），并以「種善根者即下⼗佛曾⼊此殿」为第九段「同讚如來」张本。〔本文判断〕长行「忆念—说颂」与十佛颂之「彼佛曾来入此殿」互为能所：所忆＝能赞。\n\n### 2.7 同赞如来·十佛偈颂（80-06）\n\n> 「迦葉如來具大悲，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。……然燈如來大光明，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。」\n\n（**十佛颂全文逐颂照录见 §2.13·程序取自 `_e13_dump.txt`**；此处标举首·末二颂以示体例。）\n\n**疏解**：十佛各一颂·每颂四句·**通五十句**。句式一律：初句标佛名别德（「迦葉如來具大悲」……「然燈如來大光明」），次句「諸吉祥中最無上」通叹，三句「彼佛曾來入此殿」叙本迹，末句「是故此處最吉祥」结处。以十佛**曾入此殿**，显此殿之胜、此说之常恒。\n\n**名相·十佛**（依 80-06 序·澄观梵汉训·`T1735`）：\n\n| 序 | 佛名（八十） | 别德（八十句） | 澄观训名（`T1735`） | 六十对应名（60-004…） |\n|---|---|---|---|---|\n| 一 | 迦葉 | 具大悲 | 飲光（身光蔽余光·悲光饮蔽邪光） | 迦葉·具大慈 |\n| 二 | 拘那牟尼 | 見無礙 | 金仙／金寂（寂故无碍·金故明见） | 拘那牟尼·慧無礙 |\n| 三 | 迦羅鳩馱 | 如金山 | 所應斷（已断如金·已净如山） | **拘樓**·佛身如金山 |\n| 四 | 毘舍浮 | 無三垢 | 遍一切／遍胜（无三垢故自在超胜） | **隨葉**如來·離三垢 |\n| 五 | 尸棄 | 離分別 | 持髻／有髻（无分别智处心顶·髻中明珠） | 尸棄如來·常寂然 |\n| 六 | 毘婆尸 | 如滿月 | 四翻（净观·胜观·胜见·遍见·如月圆智满） | 毘婆尸佛·如滿月 |\n| 七 | 弗沙 | 明達第一義 | 增盛（明达胜义是增盛） | 弗沙·明達第一義 |\n| 八 | 提舍 | 辯無礙 | 度說（说法度人·辩才无碍即能说） | 提舍如來·辯無礙 |\n| 九 | 波頭摩 | 淨無垢 | 赤蓮華（身心如莲华净无尘垢） | 波頭摩佛·淨無垢 |\n| 十 | 然燈 | 大光明 | 舉身帶光（如然灯·身智光明普周称大） | **錠光**如來·明普照 |\n\n〔按·名号异译〕三·四·十位**名号两译迥异**（拘樓↔迦羅鳩馱·隨葉↔毘舍浮·錠光↔然燈），别德句亦有「具大**悲**↔具大**慈**」「見無礙↔**慧**無礙」「離分別↔常寂然」「大光明↔明普照」之异——各照底本·**不强定一名之对应、不臆造对齐**（§六·§7.3）。\n\n**会读**：澄观「第九迦葉下。同讚如來。然三世諸佛。皆於此處說十住法。獨讚十者。表說十住及無盡故。所以讚者義乃有四。⼀⼗佛曾處則殿勝可居。⼆互舉⼀德例讚本師。三敘昔善根慶遇堪受。四昔佛同說表法常恒」（`T1735`）。又疑难：「⼗中後七乃過去劫佛。如何賢劫曾⼊殿耶。古釋有⼆。⼀約時劫相即⼊故。⼆約其處有麁細故。麁隨劫壞。細者常存。如法華天人⾒燒我⼟不毀」（`T1735`·`T1733` 同辨）。\n\n### 2.8 殿皆广博·结通无尽（80-07）\n\n> 如此世界中，忉利天王以如來神力故，偈讚十佛所有功德；十方世界諸釋天王，悉亦如是讚佛功德。爾時，世尊入妙勝殿，結跏趺坐。此殿忽然廣博寬容，如其天眾諸所住處；十方世界，悉亦如是。\n\n**疏解**：结通——此界忉利天王偈赞十佛，**十方世界诸释天王悉亦如是**。世尊入殿结跏趺坐，**此殿忽然广博宽容**，如其天众诸所住处；十方世界悉亦如是。一殿不容转身，忽然广博容受一切——**事事无碍·广狭自在**之法界现量。\n\n**名相**：「廣博寬容」——澄观「第十爾時世尊下。殿皆廣博嚴淨。即示如意相⼴殿。同處以遣局情。亦表廓⼤慈悲等眾⽣界。又如來⼊殿。即覺智現前。忽然⼴博則⾝⼼無際。⼗⽅已下結無盡」（`T1735`）。\n\n**会读**：智俨判为「結類⼗⽅成法界會」段·「六化成中有三。初處坐。⼆辨⽤相。三等⾔通餘⽅也」（`T1732`）。〔本文判断〕本品首（80-01 十方齐现）尾（80-07 结通无尽·殿广博）以「十方……悉亦如是」回环呼应，构成一多相即之闭合结构（详见 §7.5 L3 拓扑）。\n\n### 2.13 品全文逐段入文〔L.193 本批·全量入文〕\n\n以下依 `_e13_full.py` 平文器单元序列（品界 `T10n0279` 卷十六·逐字（`_e13_full.py` 平文器·§7.4 品界 slice 口径）·@100269–100923·CJK654 含品题／正文净 645·真六正文单元 80-01·02·03·05·06·07），**逐字照录全文·0 手抄**；`_e13_dump.txt` 另列之幻影 80-04（平文器嵌套节点重计·系 80-03 请佛句尾重复）·经注入器 assert 确认其在 body80 内非独立段·不取（§1.3·§6.4）。段块题依澄观长科十段（§5.1）。\n\n**（品题）80-00**\n\n> 昇須彌山頂品第十三\n\n**（一·一本會齊現）80-01〔CJK51〕**\n\n> 爾時，如來威神力故，十方一切世界，一一四天下閻浮提中，悉見如來坐於樹下，各有菩薩承佛神力而演說法，靡不自謂恒對於佛。\n\n**（二·不離齊升）80-02〔CJK21〕**\n\n> 爾時，世尊不離一切菩提樹下，而上昇須彌，向帝釋殿。\n\n**（三·各見佛來·四·各嚴殿座·五·皆來請佛）80-03〔CJK158〕**\n\n> 時，天帝釋在妙勝殿前遙見佛來，即以神力莊嚴此殿，置普光明藏師子之座，其座悉以妙寶所成：十千層級逈極莊嚴，十千金網彌覆其上，十千種帳、十千種蓋周迴間列，十千繒綺以為垂帶，十千珠瓔周遍交絡，十千衣服敷布座上，十千天子、十千梵王前後圍遶，十千光明而為照耀。爾時，帝釋奉為如來敷置座已，曲躬合掌，恭敬向佛而作是言：「善來世尊！善來善逝！善來如來、應、正等覺！唯願哀愍，處此宮殿！」\n\n**（六·俱時入殿·七·樂音並止·八·各念昔因）80-05〔CJK60〕**\n\n> 爾時，世尊即受其請，入妙勝殿；十方一切諸世界中，悉亦如是。爾時，帝釋以佛神力，諸宮殿中所有樂音自然止息，即自憶念過去佛所種諸善根而說頌言：\n\n**（九·同讚如來·十佛偈頌）80-06〔CJK280〕**\n\n> 「迦葉如來具大悲，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。拘那牟尼見無礙，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。迦羅鳩馱如金山，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。毘舍浮佛無三垢，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。尸棄如來離分別，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。毘婆尸佛如滿月，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。弗沙明達第一義，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。提舍如來辯無礙，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。波頭摩佛淨無垢，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。然燈如來大光明，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。」\n\n**（十·殿皆廣博·結通無盡）80-07〔CJK75〕**\n\n> 如此世界中，忉利天王以如來神力故，偈讚十佛所有功德；十方世界諸釋天王，悉亦如是讚佛功德。爾時，世尊入妙勝殿，結跏趺坐。此殿忽然廣博寬容，如其天眾諸所住處；十方世界，悉亦如是。\n\n〔按〕80-06 十佛偈颂五十句全引（十佛各一颂·每颂四句·通结「是故此處最吉祥」×10）；本品唯长行（80-01·02·03·05·07）＋此十佛颂（80-06），**重颂归第十四品《须弥顶上偈赞品》**（附品·P14·§3.2）。入文各单元之 CJK 已 assert 为 body80 连续子串（回源即此品界 slice·`_p9_11_audit.py` 复跑覆盖 §二）。\n\n---\n\n### 2.9 小结\n\n本品八段·一序分（齐现·齐升）→三发起（见佛·严殿·请佛）→三入殿事（入殿·止音·念昔）→一赞（十佛颂）→一结（广博·结通）。文短而科密（澄观十段），义归**不起而升·以处表法·本迹交映**三枢。正说十住位次在第十五品，本品唯为**发起序分**。\n\n---\n\n## 三、旁参与前接\n\n### 3.1 前接（第十二品《贤首品》·第二会收官）\n\n第二会《贤首品》（P12·`articles/huayan-xianshou-pin.html`）明十信之**德**·纯偈颂叹德（「信为道元功德母」）；本品为第三会首品，**从信入住**——澄观来意判「前信是住之方便……正位故次來也」（`T1735`）。二会界：贤首品第十二→升须弥山顶品第十三（`T10n0279` 卷十五末→卷十六）。〔本文判断〕由第二会之「三业遍周」转第三会之「位渐升进」，叙事重心从「佛德遍满」转「行者位次」，本品以法会昇处承此转。\n\n### 3.2 后接与同会续品\n\n- **次品**《须弥顶上偈赞品第十四》（P14·须弥山顶·L.194 批次）——本品 80-06 十佛长行颂之**重颂**（附品·偈赞体），「欲顯三賢皆依佛智有差別故」。\n- **同会六品**（P13–P18）：升须弥山顶（发起）→须弥顶上偈赞（重颂）→十住（正位）→梵行→初发心功德（满足行）→明法（会末）。依用户既定决策**六品各自独立成篇**；智俨三分（方便发起／正位相／满足行相）、澄观二分（初二方便·后四正说）科判并见 §5。\n\n### 3.3 旁参\n\n- **第十五品《十住品》**：本品所表「十住位」之正说处（发心住·治地住…法住），十住位次天然十数矩阵，为 L.195 批次主项。\n- **第一会《世主妙严品》·忉利天主**：须弥山顶·三十三天·帝释（憍尸迦·释提桓因·因陀罗·能主）会众之前现（`T1735`「釋⼜四名」·李通玄`T1739`同）。善财童子于妙峯山顶见德云比丘（`T1739`·澄观引），表十住初心·与本处以山表法互映。\n\n---\n\n\n## 四、义理要点与名相\n\n### 4.1 不起而升·体用相即之法界义\n\n本品首义在 80-02「**不離一切菩提樹下，而上昇須彌**」一句。此句设一表面上相违之语法：「不離」（不动·体）与「昇」（升进·用）并置。三家会读皆就此辨：\n\n- **澄观**（`T1735`）：立「**正义**」——「然佛得菩提。智無不周體無不在。無依無住無去無來。然以自在即體之應。應隨體遍。緣感前後有住有升」，以**月喻**（澄江一月·三舟共观·月不离中流而随舟南北）显**体遍而应别**；并引**古德十义**（处相入门·相入处遍·一切即一·一即一切·约佛身·约佛自在不思议解脱·缘起相由门·法性融通门·表示显法门·成法界大会门），判此十义中「前五玄门·次四所以·后一总意」，**十义相参而立**，为十玄雏形。〔本文判断〕澄观于此明「四对」（此处彼处·此身彼身·若去若住·若一若多）相即无碍，是其「六相十玄」体系在升品之具体落点。\n- **法藏**（`T1733`）：「**不起此而坐行相即**」八义（处即入门·佛身遍法界·时九世十世·法界门·缘起坐行相即…），明「**佛是化主動靜無礙不去而進故云昇**」；破古人三释（重化身·法身坐道树·不往而至）皆「乖文意」，以「即体之应应随体遍」结。\n- **李通玄**（`T1739`）：「不離菩提樹」五义，以处表法，归于「創生如來智慧之家為真佛子·不可以有為生滅尋思觀察及多聞心想攀攬所得」。\n\n**义理判语**：「不起而升」非神通变异之两全，而是**华严性起·体用无二**之表述——佛菩提身即遍法界（故无所不至·无需「起」），而缘感有前后（故就机现「升」）。此即 80-01「靡不自謂恒對於佛」与 80-07「此殿忽然廣博寬容」两端之中间律：**一多相即·广狭无碍**〔本文判断〕。\n\n### 4.2 依处立名·须弥妙高与忉利天宫\n\n- **须弥**（苏迷卢·妙高）：山名，四宝所成（东金·西银·南颇梨·北马瑙·澄观作「北金东银南吠琉璃西颇胝迦」·方位异说各照其本〔待核〕），高八万四千由旬，入水亦尔，独出九山故称高。**妙有十义**（体·相·色·德·眷属·依持·作业·生果·为首·坚固·澄观 `T1735`），一一况十住行德。\n- **忉利天**（Trāyastriṃśa·三十三天）：居须弥山顶，中央帝释宫（善见城），四面各八埵，三十二天辅弼，并释为三十三。李通玄：「天帝釋在其上居寶宮殿……三⼗三天。總以帝釋為主」。**妙胜殿**（普光明藏师子座所在）即帝释宫内之殿。\n- **以处表法**：何故在天、何故越四王天至山顶？——法藏三意（显法非胜·表进退悬殊·到顶安住不退）·澄观「表位漸增不處人間。顯位清淨故居天也」。〔本文判断〕处所之择，全为「十住位」不退之表法，非地理。\n\n### 4.3 十佛名号·本迹交映\n\n80-06 十佛颂列过去十佛，一一「曾来入此殿」。其名义（澄观梵汉训·详见 §2.7 表）与「后七乃过去劫佛如何贤劫曾入殿」之难（时劫相即·处有粗细·法华我土不毁喻）为科段枢要。十佛序贯「**具大悲…大光明**」德号，结以「**是故此處最吉祥**」——**以迹（曾入）显本（此处说十住法之常恒）**。〔本文判断〕十佛数取「十」，与十住位之「十」相应（澄观「表說十住及無盡故」），非关史实次第。\n\n### 4.4 名相表\n\n| 名相 | 梵／巴 | 训释 | 出处 |\n|---|---|---|---|\n| 须弥·苏迷卢 | *Sumeru* | 妙高·四宝所成 | 澄观 `T1735` |\n| 忉利天 | *Trāyastriṃśa* | 三十三天·居山顶 | 李通玄 `T1739` |\n| 帝释·憍尸迦·因陀罗 | *Śakra / Kaśyapa / Indira* | 天帝释·能主（四名） | 澄观 `T1735` |\n| 善见城·妙胜殿 | — | 帝释宫城·正殿 | 慧苑 `X0221` |\n| 普光明藏师子座 | — | 解位智·照法空含众德 | 澄观 `T1735` |\n| 由旬 | *yojana* | 里数（高八万四千由旬） | 法藏 `T1733` |\n| 阎浮提 | *Jambudvīpa* | 南洲·四天下之一 | 80-01 |\n| 十住（daśa-vihāra） | — | 不退位·第三会所明 | 澄观来意 |\n\n### 4.5 小结\n\n本品义理三层：**体用**（不起而升·月喻十义）、**处法**（须弥妙高十义·越天表不退）、**本迹**（十佛曾入·此殿最吉祥）。三皆归一——**十住位以佛智为本、依信而入住**；本品为其序分发起。\n\n---\n\n## 五、注疏选要（诸家会读）\n\n> 本节凡引疏皆照祖典底本原字形（繁体·康熙部首依 NFKD 归一锚定·raw 切片回原字形）逐字回源，注经号与段落。**§5.1 澄观疏科长文全摘（五门·十段）由 `_e13_inject.py` 程序取自 `T1735` 卷第十六本科段，见下。**\n\n### 5.1 澄观《大方广佛华严经疏》（`T1735`）——「升须弥山顶品第十三」段（卷第十六）\n\n澄观判本品依**五门分别**：**来意·释名·宗趣·释文**（疏科四门·判会五门之目）。以下各门撮其要，**科长文全摘附于本节末**。\n\n**〔来意〕**：先辨会来——「前信此解。義次第故。又答十住問」；「**前信是住之方便**……**正位故次來也**」；品来——「前品說信究竟。此品趣後說住。故次來也」。\n\n**〔释名〕**：会名三门——「約處名忉利天會。約人名法慧菩薩會。約法名十住會」；品名「須彌正云蘇迷盧。此云妙高。如來以自在力不起覺樹。應機現彼故云升也」。**妙有十义**（体·相·色·德·眷属·依持·作业·生果·为首·坚固），高八万四千由旬，「十住之行亦復如是」以山况住；观心释「三昧須彌寂然不動……本覺如來。升法須彌之頂」。\n\n**〔宗趣〕**：约会「以十住行德為宗。攝位德果為趣」；约品「以嚴處請佛赴感為宗。根緣契合說法為趣」。\n\n**〔释文·总科〕**：「**此會六品分為二分。初二品方便發起。後四品當會正說**。前中初之一品。唯是由致。偈讚一品義有兩兼……**今初一品⻑分十段**：一本會齊現·二不離齊升·三各見佛來·四各嚴殿座·五皆來請佛·六俱時入殿·七樂音並止·八各念昔因·九同讚如來·十殿皆廣博嚴淨也。」\n\n**〔释文·别释枢要〕**：「不离齐升」段破古多释·立月喻·引古德十义（详见 §4.1）；庄严段「皆云十千者萬行因感故」；请佛段「言善來者應機來故」；同赞段「十佛曾處則殿勝可居·互舉一德例讚本師·敘昔善根慶遇堪受·昔佛同說表法常恒」·难「后七过去佛如何贤劫曾入」以「时劫相即·处有粗细」释；广博段「示如意相·廓大慈悲·觉智现前」。**判教**：「何故三賢獨有斯旨……此三人天隔越故須連帶」（带前起后之九会判）。\n\n\n**〔L.193 本批·疏科长文全摘〕**（`T1735` 卷第十六「升須彌山頂品第十三」本科段·NFKD 1:1 重锚·引文照 raw 原字形·跨行连读剥空白·分页符剔除·窗 CJK 3301·raw @210566–214593·康熙部首原字形保留）\n\n*甲·五门分别·来意（前信是住之方便·答十住问·品来赴后说住）*：\n\n> 「初來意者。先辨會來。前信此解。義次第故。⼜答⼗住問總有⼆段。前信是住之⽅便。此明正位故次來也。⼆品來。前品說信究竟。此品趣後說住。故次來也。⼆釋名」\n\n*乙·释名（忉利天会／法慧菩萨会／十住会·苏迷卢妙高·妙有十义·高八万四千由旬·观心三昧须弥）*：\n\n> 「⼆釋名。亦先辨會名。約處名忉利天會。約⼈名法慧菩薩會。約法名⼗住會。皆依主釋。⼆品名。須彌正云蘇迷盧。此云妙⾼。如來以⾃在⼒不起覺樹。應機現彼故云升也。表位漸增不處⼈間。顯位清淨故居天也。若天表淨何獨妙⾼。妙有⼗義。如於法故。⼀者體妙謂四寶所成。⼆者相妙。謂八⽅四級。三者⾊妙謂四正⾊。北⾦東銀南吠瑠璃⻄頗胝迦。⼀切草⽊⿃獸等物。隨所⾄處則同其⾊。⾃常不變。四者德妙。謂八⽅猛風不能令動。五眷屬妙。謂七⾦⼭七重圍繞。及七香海海印旋流。六依持妙。唯天依住。得通者居。七作業妙。不離本處⽽鎮四洲。映蔽⽇⽉⽽成晝夜。八⽣果妙。謂波利質多能益天眾。九為⾸妙。於四洲地最在先成。⼗堅固妙。於輪圍中最在後壞。⾼者⾼八萬四千由旬。入⽔亦爾。下據⾦剛上隣空界。頂上縱廣量亦如之。獨出九⼭故稱⾼也。⼗住之⾏亦復如是。聞思修解⽽為妙體。四德八聖以為妙相。四辯為⾊令物解同。雖同眾⾳⾃智不變。八法不動⽽為妙德。七⽀奉戒⾦⼭圍繞。七識流轉⽽為海印。第⼀義天依持⽽住。可以神會非情能升。不離本處遍應⼗⽅。映蔽佛⼝及菩薩⽉。⽽成涅槃⽣死晝夜。⽣教⾏果⽽為妙樹。世界初成菩薩先出。為眾⽣現種種資具。世界將壞菩薩後沒。為說上定令免三災。⾼者具成八萬四千諸度法⾨。⾃在障外為眾⽣故。入⽣死海。亦具八萬四千諸度法⾨。據⾦剛性隣勝義空。⼜智入佛慧必窮其底。德超⽅便逈出群峯。為顯⼗住功德妙⾼。是故須升妙⾼⼭頂。四王處半旁⽽非正。表住不退異信輕⽑。故越彼天居妙⾼頂。善財童⼦於妙峯⼭頂⾒德雲者。亦表斯位彌顯有由。然上所釋皆圓教意。故下發⼼品云。應知此⼈即與三世諸佛同等。與三世佛功德平等。得如來⼀⾝無量⾝。纔發⼼時。即為⼗⽅⼀切諸佛共所稱歎。不可同於⽅便教說。若約觀⼼妙⾼者。謂三昧須彌寂然不動。無思無⼼不收不攝。任性⽽定稱本⼼地。入佛智海湛然不遷。是妙法樂觸境⾃在。合本性淨。是四德寶⽽⾃莊嚴。斯則本覺如來。升法須彌之頂。三宗趣者」\n\n*丙·宗趣（十住行德为宗·摄位德果为趣·严处请佛赴感为宗·根缘契合说法为趣）*：\n\n> 「三宗趣者。先約會以⼗住⾏德為宗。攝位德果為趣。⼆品以嚴處請佛赴感為宗。根緣契合說法為趣。四釋文者」\n\n*丁·释文·总科＋长科十段名目（此会六品分为二分·初二方便发起后四正说·今初一品⻑分十段）*：\n\n> 「四釋文者。此會六品分為⼆分。初⼆品⽅便發起。後四品當會正說。前中初之⼀品。唯是由致。偈讚⼀品義有兩兼。⼀是⽅便。謂前品化主赴機。後品助化讚佛。主伴圓備⽅演法故。⼆是所依。謂三天說法各有偈讚。欲顯三賢皆依佛智有差別故。離如來智無⾃體故。獨為⽅便甚抑讚詞。⾏向⼆會同此科判。今初⼀品⻑分⼗段。⼀本會⿑現。⼆不離⿑升。三各⾒佛來。四各嚴殿座。五皆來請佛。六俱時入殿。七樂⾳並⽌。八各念昔因。九同讚如來。⼗殿皆廣博嚴淨也。⾔爾時者」\n\n*戊·段一 本會齊現（言爾時即前二会时·十重说处第一重·带前起后·印文同时前后遍）*：\n\n> 「⾔爾時者。即前⼆會時。主伴⿑遍演前⼆會之法也。今此明遍。即⼗重說處中第⼀重也。何須舉此。欲明前會不散成後會故。後必帶前。合成法界無礙會故。⼀⼀諸會無休息故。後後諸會皆同時故。若散前會即無後故。所以唯約覺樹會者。此為本故。得佛處故。理實第⼆亦同此遍。若同時遍。何有九會前後。若有前後何名同時。應云即⽤之體同時頓遍。即體之⽤不壞前後。猶如印文。第⼆爾時下」\n\n*己·段二 不離齊升（不起而升辨·破古多释·月喻「澄江一月三舟共觀」·法慧偈·毘盧十身·古德十义＝十玄雏形）*：\n\n> 「第⼆爾時下。明不離覺樹各升釋天。問動靜相違去住懸隔。既云不離何得⾔升。古有多釋。⼀云。本釋迦⾝不起道樹。別起應化以升天上。⼀云。不起是報升天是化。⼀云。不起是法⾝升天是化⽤。並非文意。以此文中俱是毘盧遮那⼗⾝雲故。⼀云。以去即非去故名不起。非去即去是以升天。如不來相⽽來等。若爾但是升相離故。非是樹下別有不起之⾝。故不可也。有云。此佛神通同體業⽤。即住是去去即是住。住是體遍去是⽤應。應是體應。雖升後⽽不離前。體是應體。雖不離前⽽升後。若爾何殊第三師。不起是法。⼜以住釋於不起。⽽⾔住是體遍。何得獨住菩提樹耶。升天何得非體遍耶。菩提樹下寧非⽤耶。今顯正義。然佛得菩提。智無不周體無不在。無依無住無去無來。然以⾃在即體之應。應隨體遍。緣感前後有住有升。閻浮有感⾒在道樹。天宮有感⾒升天上。非移覺樹之佛。⽽升天宮故云不離覺樹。⽽升釋殿。法慧偈云。佛⼦汝應觀如來⾃在⼒。⼀切閻浮提皆⾔佛在中。此不離也。我等今⾒佛住於須彌頂。此⽽升也。文理有據。更以喻顯。譬猶朗⽉流影遍應。且澄江⼀⽉三⾈共觀。⼀⾈停住。⼆⾈南北。南者⾒⽉千⾥隨南。北者⾒⽉千⾥隨北。停⾈之者⾒⽉不移。是為此⽉不離中流⽽往南北。設百千共觀八⽅各去。則百千⽉各隨其去。諸有識者曉斯旨焉。古德釋此。略有⼗義。⼀約處相入⾨。以⼀處中有⼀切處故。是故此天宮等。本在樹下。故不須起。然是⽤彼故說升也。⼆亦約相入⾨。以⼀處入⼀切處故。樹遍天中亦不須起。欲⽤天宮表法升進。故云升也。三由⼀切即⼀故。天在樹下。四由⼀即⼀切樹在天上。不起等準前。五約佛⾝。謂此樹下⾝。即滿法界遍⼀切處。則本來在彼不待起也。機熟令⾒故云升也。是故如來以法界⾝常在此。即是在彼。六約佛⾃在不思議解脫。謂坐即是⾏住等。在此即在彼。皆非下位測量故也。七約緣起相由⾨。八約法性融通⾨。九約表⽰顯法⾨。⼗約成法界⼤會⾨。然此⼗解前五⽞⾨。次四所以。後⼀總意。欲成⼗義相參⽽立。雖似雜亂不違經宗。並可⽤也。然此中相望有四對。法相即無礙。⼀此處彼處。⼆此⾝彼⾝。三若去若住。四若⼀若多。約處此處彼處相即無礙。應如⼗中前四。約⾝相即無礙。應如五六及前正顯。⼜⼗中後四通於⾝處。約處唯有此彼。約⾝更加去住。謂此⾝即是彼⾝。去⾝即是住⾝。若⾝若處俱通⼀多。上來諸法同在⼀時。無前後也。⼀多相望應成四句。⼀不離⼀切樹下升⼀天宮。即如今文。⼆不離⼀樹升⼀切天。三不離⼀切樹⽽升⼀切天。經云⼗⽅世界悉如是故。四不離⼀樹下⽽升⼀天。經中欲顯⼀多相即。故舉初句。升釋天既爾升餘天亦然。如後⼆會升天既爾。往餘處亦然。復應樹樹相望⽽成⼆句。謂不離⼀樹下常在⼀切樹。不離⼀切樹⽽常在⼀樹。復應以不起餘處。類不起樹下。展轉相望皆悉周遍。不壞前後⾃在難思。⼜既⼀處有⼀切處亦有微細義。所⽤不同有隱顯義。若加前時後時有⼗世義。唯⾒說住。及於餘法有純雜義。後後帶於前前有帝網義。此天望餘成主伴義。⼗⽞具矣。問帶前起後事理應⿑。何故三賢獨有斯旨。答顯異義故。謂初⼆會相隣接故。不假帶前。此三⼈天隔越。故須連帶。⼜此三會同詮賢位。六已入證不假帶前。第七即位中普賢居然不假。第八頓彰五位體⽤已融。第九唯明證入體⽤⼀味故。並皆不假。第三時天帝下」\n\n*庚·段三 各見佛來（约佛用从体起·约机境从心现·隣而未即故云遙見）*：\n\n> 「第三時天帝下。明各⾒佛來。約佛則⽤從體起。約機境從⼼現。隣⽽未即故云遙⾒。第四即以下」\n\n*辛·段四 各嚴殿座（严根欲之殿为法器·置师子座表十住法门·文有十句·皆云十千者萬行因感）*：\n\n> 「第四即以下。各嚴殿座。表嚴根欲之殿為法器故。置師⼦座。表⼗住之法⾨故。文有⼗句。初總餘別。總云普光明藏者。此是解位智。照法空含眾德故。從信始入故有置⾔。別中初句約體。餘並顯嚴。皆云⼗千者。萬⾏因感故。⾔層級者萬⾏熏成故。⾦網防護。慈悲帳蓋以育以覆。四攝繒綺以為周垂。圓融⾏願交絡萬善。柔忍慚愧以覆法空第⼀義天。清淨梵⾏繞斯法體。⼀⼀智照故⽇光明。於⽣死中。遣⻑夜闇舉斯果德。令物⾏因。下⾏向中。約位漸增表法無異。第五爾時帝釋下」\n\n*壬·段五 皆來請佛（三业崇敬为请仪·言善來者應機來故·不來相而來·三稱善者喜之至）*：\n\n> 「第五爾時帝釋下。請佛居殿。於中三業崇敬以為請儀。⾔善來者應機來故。不來相⽽來故。帶法界會來故。三稱善者喜之⾄故。舉三號者略歎德故。願哀處者。希仗勝⽥⽣⼤福故。第六爾時下」\n\n*癸一·段六 俱時入殿（根缘契合成益不虚·十方如是）*：\n\n> 「第六爾時下俱時入殿。謂根緣契合成益不虛。⼗⽅如是。通上六段入殿事訖。故⼀結通。下四段文殿中之事。第七爾時下」\n\n*癸二·段七 樂音並止（摄散归静得定益）*：\n\n> 「第七爾時下樂⾳⽌息。謂攝散歸靜得定益故。第八即⾃下」\n\n*癸三·段八 各念昔因（获智益·种善根即下十佛曾入此殿·表见自心性同昔佛）*：\n\n> 「第八即⾃下。各念昔因獲智益也。散緣既⽌勝德現前。寂然無思發宿住智。種善根者。即下⼗佛曾入此殿。聞法供養故。亦表⾒⾃⼼性。同昔佛故。第九迦葉下」\n\n*癸四·段九 同讚如來（三世佛皆於此處說十住法·独赞十表说十住及无尽·十佛名号梵汉训释·难后七过去佛以时劫相即处有粗细释）*：\n\n> 「第九迦葉下。同讚如來。然三世諸佛。皆於此處說⼗住法。獨讚⼗者。表說⼗住及無盡故。所以讚者義乃有四。⼀⼗佛曾處則殿勝可居。⼆互舉⼀德例讚本師。三敘昔善根慶遇堪受。四昔佛同說表法常恒。文中先明此界後辨結通。今初⼗頌。各上半標名讚德。上句別下句通。下半以⼈結處。唯初⼀句諸佛不同。然佛別名多因德立。讚者取德以釋上名。初迦葉者此云飲光。若從姓立⽰⽣彼族。若就佛德。⼀者⾝光蔽餘光故。⼆者悲光飲蔽邪光故。拘那牟尼舊⽈⾦仙。亦云⾦寂。寂故無礙。⾦故明⾒。迦羅鳩馱者。具云迦羅鳩村馱。此云所應斷。已斷如⾦已淨。如⼭不動。亦可⾒無礙者。是此佛德。如⾦⼭者是前佛德。毘舍浮者。亦云毘濕婆部。毘濕婆者。此云遍⼀切也。部者⾃在也。亦云遍勝無三垢。故無不⾃在⽽超勝也。三垢者。現種及習。⼫棄亦云式棄那。此云持髻。亦云有髻。無分別智最為尊上。處⼼頂也。⼜髻中明珠即無分別也。毘婆⼫者此翻有四。謂淨觀。勝觀。勝⾒。遍⾒。如⽉圓。智滿是遍⾒也。魄盡惑亡是淨觀也。既圓且淨。是勝觀勝⾒也。弗沙亦云勃沙。此云增盛。明達勝義是增盛也。提舍亦云底沙。⻄域訓字底邏那。此云度也。沙是皤沙。此云說也。謂說法度⼈。或但云說。辯才無礙者即能說也。波頭摩者。此云⾚蓮華。⾝⼼如蓮華淨無塵垢。然燈者。智論云。此佛從初現⽣。乃⾄成佛。舉⾝帶光如然燈故。⾝智光明普周稱⼤。然⼗中後七乃過去劫佛。如何賢劫曾入殿耶。古釋有⼆。⼀約時劫相即入故。⼆約其處有麁細故。麁隨劫壞。細者常存。如法華天⼈⾒燒我⼟不毀。⼜梵王⾒淨⾝⼦⾒穢。今此天帝是⼤菩薩同梵王⾒。亦佛加故。⼆如此下結通⼗⽅。第⼗爾時世尊下」\n\n*癸五·段十 殿皆廣博（示如意相广殿·同处以遣局情·廓大慈悲等众生界·如来入殿觉智现前·结无尽）*：\n\n> 「第⼗爾時世尊下。殿皆廣博。即⽰如意相廣殿。同處以遣局情。亦表廓⼤慈悲等眾⽣界。⼜如來入殿。即覺智現前。忽然廣博則⾝⼼無際。⼗⽅已下結無盡。唯結後四前已結故」\n\n### 5.2 法藏《大方广佛华严经探玄记》（`T1733`）——「十住会·升须弥山顶」段（卷十四）\n\n法藏判第三会名「**十住會。約處名忉利天會**」；释品题「**佛是化主動靜無礙不去而進故云昇**」·须弥四宝·高八万四千由旬·帝释三十三天·「**約處表法明十住成位不退勝故居山頂也**」。**来意**「答前十住問故·前已明信今顯依信起解·前信但是位前方便。方便既滿。正位顯彰」。**宗趣**「約人謂化主及助化各有體相用·約法謂十住教義以平等法界為體·十住行位為相」。 **释文**「就此會中有六品分⼆　初⼆明⽅便發起即序分　餘四品是當會正宗」·初品为**如来应感序**（明果德备）·次品**集众光赞序**（明因德圆）。**不起而升八义**（处即入门·佛身遍法界·时九世十世·法界门·缘起坐行相即·…）详 `T1733` 十住会段。〔按〕法藏此段与澄观月喻十义同源而异科（法藏八义·澄观十义），并记不裁。\n\n\n**〔L.193 本批·法藏 T1733 直引〕**（`T1733`·十住会·释名来意宗趣释文·不起而升八义段·NFKD 归一锚定·raw @144555 起·CJK-only 坐标回映·分页符剔除·康熙部首原字形保留·照原分行不转写不断句·本直引在 §二 审计区外·锤命中 1 处取首现·回源即此祖典）：\n\n> 約處名忉利天會。准釋可 知。⼆品名者。佛是化主動靜無礙不去⽽進故云昇。昇⾄何處。謂須\n\n> 彌頂須彌此云妙⾼⼭。謂以四寶所成故云妙。謂東⾯黃⾦⻄⽩銀南頗 梨北⾺瑙。餘⼭唯⾦故非妙。獨出九⼭故云⾼。⾼八萬四千由旬。縱\n\n> 廣正等。亦名安明⼭。頂者⼭巔也。謂此⼭頂中央有帝釋宮。四⾯各 有八埵如臺。去釋三由旬中別有宮城。三⼗⼆天輔弼帝釋。并釋有三\n\n> ⼗三也。今趣釋宮故云頂也。約處表法明⼗住成位不退勝故居⼭頂 也。即從⼈⽤及處三義立名。問何不在⼈間說耶。答為顯⾏位漸昇進\n\n> 故。⼜表成位離染故居天也。問何不⾄四天王天。答有三意。⼀以彼 是雜⿁神天顯法非勝故超過也。⼆為寄法以⼗信是外凡退位⼗住是內\n\n> 凡不退。欲表進退懸殊故越四天王處也。三若未⾄⼭頂容有進退。到 ⼭頂上即安住不退。是故越彼⼭腹處天⾄此頂處以表法也。\n\n> ⼆來意亦⼆。初會來者⼀答前⼗住問故。⼆前已明信。今顯依信起解 故次來也。三前信但是位前⽅便。⽅便既滿。正位顯彰故次來也。⼆\n\n> 品來者前品辨信究竟。今將赴後位故來也。 三宗趣亦⼆。初會宗亦⼆。先約⼈謂化主及助化各有體相⽤。約住準\n\n> 之。⼆約法謂⼗住教義義中以平等法界為體。⼗住⾏位為相。應教所 詮為⽤。教中以六決定為體。⼗住不同為相。益機為⽤。相即無礙準\n\n> 上思之。⼆品宗者以嚴處請佛如來赴感為宗。 四釋文者就此會中有六品分⼆　初⼆明⽅便發起即序分　餘四品是當\n\n> 會正宗。 前中⼆初品是如來應感序明果德備。後品明集眾光讚序明因德圓。即\n\n> 顯⼗住位中具因果宗圓備故也。前中三。初辨化緣。⼆爾時帝釋下嚴 根欲。三爾時世尊下明根緣契合。初中⼆。先體融遍周法界。後明⽤\n\n> 融。謂不動⽽進。前中初⼀句明體融所由謂佛⼒也。下明融遍之相。 於中⼗⽅各⼀⼀閻浮等者。是上光明覺品所辨。⼗⽅各乃⾄不可說不\n\n> 可說虛空法界等世界中皆有菩提樹下盧舍那佛。各與海會菩薩眾并與 文殊師利乃⾄賢⾸等悉各說法。以諸會眾各不雜故云⾃謂在也。今並\n\n> 同時集眾各昇本界天上⽽不離本處也。若約⼩乘三乘等中說經施化。 但論在某處等。無此⼀說⼀切說等。今欲明⼀乘法。即主伴圓明故法\n\n> 如此也。於中⼀三世間融。⼆依正⼆融。三於正報中有三寶相融謂說 種種為法寶。菩薩為僧。對如來故。四於諸菩薩有三業融。謂顯現是\n\n> ⾝。說法為語。⾃謂為意。問何須集此者。答欲明具主伴。凡⼀法起 必具⼀切故。問何故皆以菩提樹為本。答以是得法初處故。⼜是覺⾨\n\n> 故。 第⼆⽤融中初⼀句⽤融所由。次不起等正明⽤相。此中不起此⽽昇彼\n\n> 者。古⼈三釋。⼀云本釋迦⾝不起道樹別起應化以昇天上。若依此釋 昇天之⾝是重化⾝。既非深妙。恐乖文意。⼀云不起是法⾝。昇天是\n\n> 化⽤。此恐非理。豈可法⾝坐道樹耶。⼀云此昇天是不往⽽⾄。以往 即不往故。所以不起也。不往即往故。所以昇天也。如不來相⽽來名\n\n> 善來等。若依此釋但是無昇相⽽昇天。非是樹下有不起之⾝故亦難 ⽤。今解此文略有八義。⼀約處即入⾨。謂以⼀處中有⼀切處故。是\n\n> 故此天宮等即本來在彼樹王下中。故云不起也。然先未⽤此天宮處。 今欲於中說法⽤故說為昇也。⼜相即故不起也。⾨別故有昇也。⼆約\n\n> 佛謂此坐樹王下之佛⾝即遍法界⼀切處故。是故佛⾝本來在彼忉利等 處故不待起也。今欲⽤此忉利⾨中之佛故⽈昇也。是故若起即不成昇\n\n> 也。三約時謂由此樹下座上佛⾝即遍前後際等九世⼗世⼀切時故。是 故此佛坐樹下時昇天。去時到天處時。⼀⼀時皆遍法界攝前後際盡。\n\n> 即知坐樹下時永無起時法云不起也。若正去時亦如此。故唯有去無餘 也。皆念念不相⾄。各各收法界。如是緣起⾨無礙恒不雜。四約法界\n\n> ⾨謂此昇去無⾃性故即攝真如法界。以彼樹下坐等亦不異真故。同真 如在去⾨顯顯故。不起⽽昇也。五約緣起⾨謂坐由⾏故坐。坐在於⾏\n\n> 中。⾏由坐故⾏。⾏在於坐中。是故由⾏中坐故昇天即不起也。由坐 中⾏故不起⽽昇天也。⾏坐無礙故即昇常坐。即坐恒昇故也。六約佛\n\n> 不思議德謂即不起此坐即是⾏即是臥即是住。即是到⼀切處。即是作 ⼀切事。並非下地所知。七約所表謂表前位⾏成究竟堅固不壞故云不\n\n> 起前座。⽽有赴機⽤故云昇也。八約成會謂後會必具前故不捨前⽽成 後。若捨則壞緣起。是故不起前⽽昇後也。\n\n> 第⼆嚴根欲中遙⾒佛來者。約佛⽤從體起。約機境從⼼現故也。於中 ⼆。先嚴座表相\n\n### 5.2′ 智俨《华严经搜玄分齐通智方轨》（`T1732`）——第三会六品科（卷三·搜玄记）\n\n智俨判会来意「信故解也……既報體成已。次須起化赴機故來也」；**六品分三**「初⼆品明⽅便發起。次⼆品明正位相。次⼆品明後成滿⾜⾏相」——与澄观二分（初二·后四）略异（智俨三分·初二/次二/后二）。**住处序**立**五序**「⼀住處序。⼆請佛序。三集眾序。四放光序。五讚歎序。若通下住品即八序（入定·加·劝·起定）」·严具文分二·请佛表欲·偈文有三（忆本行·偈赞·结通十方）·化成有三（处坐·辨用相·等通余方）。此为**贤首以前**华严科判之早期形态，于本品结构分析尤资。\n\n\n**〔L.193 本批·智俨 T1732 直引〕**（`T1732`·妙高·六品分三·住处序五序段·NFKD 归一锚定·raw @32620 起·CJK-only 坐标回映·分页符剔除·康熙部首原字形保留·照原分行不转写不断句·本直引在 §二 审计区外·锤命中 1 处取首现·回源即此祖典）：\n\n> 頂者居勝尊上也。 問何故此下四會在天說者。答德⾏位成。除障淨勝故在天說⽿。此答\n\n> 前⼗住位問也。 ⼆來意。何故來者信故解也。此初辨會來意。⼜何故會來。既報體成\n\n> 已。次須起化赴機故來也。因此略料簡教興所表。今諸會但不捨離本 處。即表起⾏成報體堅固不移也。⽽往諸會即表起⽤隨機。此釋約修\n\n> ⾏體。若望⽣解起信⾨即顯⾏位增微⽿。⼜解文中約佛起⽤赴機以解 者即善知識⼒也。若約分位等解者即約⾃修⾏解也。可思准之。⼜此\n\n> 會已下四會並位相增。與前信⾏少別。於三乘⼀乘法義亦須交絡。思 准之。餘會並同此意。品來者前說信法已。次辨赴後說所依處⽿。\n\n> 三宗者。約會分別有⼆。⼀約⼈。⼆約法。⼈有化主及助化。各有體 德⽤。但局此會。⼆約法者。謂⼗解法。後當辨⽿。約品宗者。若依\n\n> 利他時現處及供養。即顯法緣。若約⾃利時此即機感相應。機緣體⽤ 成也。\n\n> 四辨文。此會有六品分三。初⼆品明⽅便發起。次⼆品明正位相。次 ⼆品明後成滿⾜⾏相。初⼆品分⼆。初起⽤隨物。⼆帝釋遙⾒下辨機\n\n> 感相應。前文有⼆。初辨依正⼆融。即顯前體淨。⼆復顯後⽤淨。⾃ 在無礙成事之本也。諸會有文。並同此釋⽿。但進勝異也。問此文何\n\n> 故不在初會後。乃在後會前。答若初會後。即但顯說法利益義明。與 後化⽤體義不顯。故在後會前辨⽿。餘會同此。何故不在第⼀會後。\n\n> 料簡為前會兼餘義意在彼釋。後第六七八會亦顯別有餘義意⽿。體中 ⾝⼝意三也。⼆爾時世尊下彰⽤應物。即⽤淨也。餘相可知。第⼆相\n\n> 應文有五序。⼀住處序以動靜無礙無處不⾄。為此說法德也。⼆請佛 序。三集眾序。四放光序。五讚歎序。若通下住品即八序。謂入定加\n\n> 勸及起定也。⼜約品分文亦好也。初住處序及請序有六。⼀⾒佛來⽤ 從實起。即發⼼緣。⼆即於妙勝殿下明天主嚴供養故請佛。具顯從解\n\n> 成法供養⾏。即成根也。三世尊即受赴感施化。釋⾳寂然表息亂應真 也。五說偈下表從定發慧。六佛昇坐下正明化⽤事成相。嚴具文分\n\n> ⼆。初嚴具即成根也。⼆請即成欲也。初嚴中有三。初總。次嚴坐 具。三結。⼆爾時帝釋下明其請佛。即表欲也。偈文有三。⼀憶本\n\n> ⾏。⼆偈讚。三結通⼗⽅。六化成中有三。初處坐。⼆辨⽤相。三等 通餘⽅也。\n\n> 菩薩雲集品第⼗ 四⾨同上。\n\n> ⼀釋名。菩薩者是⼈。雲者潤益故。⼜齗齶貌也。集者聚集。妙勝等 者別處也。\n\n> ⼆來意者。何故來。辨處已次明集眾。 三集眾歎德順法為宗。\n\n> 四辨文者。此文有三序。⼀集眾。⼆放光。三歎佛。今此下三會集眾 何故不在初品。復何故⼀⼀⽅各有⼗。⼜放光下何以不漸集眾。答前\n\n> 會位相未成。但顯⾏圓故在初品說。今此⾏位具成。同彰⾏位利潤益 故共在此品也。所以⼀⼀⽅具⼗者欲顯解相分明圓融數等⼀⽅即⼀切\n\n> ⽅也。所以此放光下不漸集眾者。欲顯⾏位圓成無有增減之相故也。 於中別有增減。義⽤上准成即得也。上下應可准思之。上第⼀會釋集\n\n> 眾光者亦是准義。初為後則⽿。初集眾序內有⼆。初指⽅辨數。此中 ⼀⼀⽅者。或通上會。或不通上。信⾏⼜不成位相。為此不通。下三\n\n> 會位顯。故通義也。⼆其世下列名⽿名有三。初明⼗⽅佛⼟菩薩。三 種世間即為⼆也。⼆此諸佛神⼒下明集諸菩薩有三。淨⾏雲集依⽅坐\n\n> 可知。三如此世界下結類⼗⽅成法界會。佛同名⽉者依⽉起光故。清 涼故。解法准之。菩薩同名慧者解之始故。⾜指放光者表立解位不退\n\n> 故有⼆可知。三讚歎序文有⼗菩薩。相⽣次第歎。解相明⽩⽿可知。 ⼀法慧偈有⼆。初⻑⾏⽣起。⼆正偈頌下並准之。此文有⼆。初七牒\n\n> 眾明是佛⼒所成。即結前品中六段義。次三明勝⾏者得⾒佛餘莫知 者。即通讚前難思。下諸⼈偈並約理成也。⼆⼀切慧偈有六。初三明\n\n> 謂⾒之徒不⾒真佛。次三顯解無⽣法⾝常現。次⼀明取著者失。次⼀ 明慧解者益。次⼀明解佛因緣成即離癡惑。次⼀推功在本。三勝慧偈\n\n> 有六。初三明妄取者失。次⼀明有解者德。次⼀約法辨觀益。次三推 功在佛。次⼀能淨慧者⾒法⾝。次⼀推功在本。四功德慧偈有五。初\n\n> 四明迷者失。次⼀⽰勝⽅便。次三明得法性益。次⼀歎佛利⽣⽅便。 次⼀推功在本。五精進慧偈有三。初⼀彰失。次⼀辨德。次八廣辨觀\n\n> 式獲益相。八\n\n### 5.2″ 慧苑《续华严经略疏刊定记》（`X0221`）——第三会释名科\n\n慧苑四门同前·**释名**立会名四目「须弥山顶会·三十三天会·妙胜殿会·十住会」；苏迷卢妙高·善见城即妙胜殿·依《俱舍》量化九山；**机感＋德渐增**释越四王天；来意·宗趣·释文六品长科三；判**本会圆遍九重遍**（十重说处）·「同时前后遍」难（法界体用·印中字）·「毗卢严华藏＝严无尽刹海」。〔按〕慧苑《刊定记》为澄观《疏》之所破亦之所承，本会科判与澄观十段大合而名目小异。\n\n\n**〔L.193 本批·慧苑 X0221 直引〕**（`X0221`·释名四目·苏迷卢妙高·本会圆遍九重遍段·NFKD 归一锚定·raw @118973 起·CJK-only 坐标回映·分页符剔除·康熙部首原字形保留·照原分行不转写不断句·本直引在 §二 审计区外·锤命中 7 处取首现·回源即此祖典）：\n\n> 將釋此品。四⾨同前。 初釋名中⼆。先顯得名。後辨釋名。先得名者。梵本中名如來光明網\n\n> 能覺悟品。謂佛⾜下輪網相中放光。還名光網。照⼗⽅佛會。覺悟菩 薩。令發意來此故。\n\n> 釋名者。如來是能放光主。光明網是所放光體。能覺悟是光業⽤。此 斷如來之光明網依主。或有財。簡菩薩等故。是佛所有故。光明網之\n\n> 能覺悟。亦通兩釋。曾⾳聲等覺悟故。光明有此覺業故。若總⾔如來 光明網覺悟之品。唯依主也。\n\n> ⼆來由者。略由⼆義。⼀由答前八問故來。謂⼀佛放光照遍法界。此 答威德如⽇威光。⼀舉能現⼀切事物。⼆光所現剎。答開⽰之意遍歷\n\n> 諸句。三光現剎中有佛菩薩。答剎莊嚴。四文殊說法顯佛功德及真實 理。答佛性。五光所覺悟諸來菩薩。各於本剎淨修梵⾏。答佛剎清\n\n> 淨。六諸來菩薩本剎⾦⾊乃⾄平等⾊等。其中有依體立名者。答剎體 性也。如以⾦為體名⾦⾊⾦剛為體名⾦剛⾊等。七諸來菩薩本剎各各\n\n> 別別成。名體亦異。此答剎成就。八光所照剎中。皆有百億如來成正 覺。此答佛⼤菩提。亦可眾⾒世尊。遍空世界中。皆坐蓮華藏師⼦\n\n> 座。是答佛住。佛知⼤眾⼼念請 已\n\n> 。各隨其類為現神通令眾皆⾒。是 答佛威德。餘如前說。\n\n> ⼆顯前⼆品名諦別遍。即是此品融遍故來也。謂前所明名諦⼀切⽅遍 ⼀切。今此品明佛及眾會。⼀即⼀切前後共顯。是故來也。\n\n> 三宗趣者。以佛光照⼀切剎中菩薩為宗。覺悟彼諸菩薩令來此為趣。 宗趣⾨中但說宗趣。不煩強說餘法。\n\n> 四釋文者。此中光處照所⼤數有⼆⼗六節。於中前九別顯。後⼗七同 辨。則為⼗段。此非⼆⼗六度放光。亦非⼀放。⽽次第巡照。但⼀放\n\n> 光同時頓照盡空世界。然以⾔不並彰。說有前後。⼜為引機入法。令 漸覩⾒故。說有⼆⼗六節也。\n\n> 就初段中⼆。先明佛以⾝光照現事境令眾⽬覩。後爾時⼀切處文殊下 智光讚述令眾悟法。或此智光之⾔。但是分文。非顯經稱。經名如來\n\n> 光故。今正文 殊\n\n> 菩薩⾨故。前中⼆。初顯能照之光。後照此下明所照 之境。前中文云⾜輪下者。謂⾜下輪相中也。⾜下放光表三義故。⼀\n\n> 涉達所因起⾃⾜下。時⾏萬⾏信為⾄初。為表說信故此放光也。⼆信 望後住最為⾄劣。⾜下於⾝獨為⾄卑。表說劣⾨故此放也。三表為本\n\n> 所依之義。謂⾝能步涉依⾜下為本。將詣菩提。信為根本。故此放 也。下文云信為道元功德⺟。智度第九云⾜下放光者。⾝得住處。皆\n\n> 由於⾜。與此得也。⾔百億光明者。顯光數也。以所照世界雖無邊 限。然彼悉與娑婆世界及密訓等。是得類剎皆有百億四天下等為所照\n\n> 境。是故光明亦放百億。 ⼆所照境中⼆。先照現本剎染淨等事。⼆如此處下現⾃法會普遍之\n\n> 相。前中三。初總標。次百億閻浮下別顯。後其中下通結。初中照是 能照光。此三千等是所照境。然此界量諸說不同。若依真諦部異執記\n\n> 云。以⼀四天下為⼀數。從此⼀數⾄⼗。⼗⾄百。百⾄千。是⼩千世 界。三倍⼩千。為三千。謂⼀倍⾄⼗⼩千。⼆倍⾄百千。三倍⾄千\n\n> 千。此為三千世界也。⼜作三倍增。以為⼤千。謂⼀倍⾄三千。⼆倍 ⾄百三千。三倍⾄千三千。此為⼤千世界也。若依⻑阿含第⼗八云。\n\n> 千⽇⽉。千須彌⼭。千四天下六欲天。千梵天。是名⼩千世界。千⼩ 千名中千世界。千中千界名三千⼤千世界。雜阿含第⼗六。亦得此\n\n> 說。若依俱舍⼗⼀。釋有⼆義。初明依處分量。後正明三千⼤千。⾔ 處量者。彼云夜摩等天宮依處量有幾。有餘師說。此上四天依處量同\n\n> 妙⾼⼭頂。有餘師說。上倍倍增。有餘師⾔。初靜慮地宮殿依處等⼀ 四州。第⼆靜慮等⼩千界。第三靜慮等中千界。第四靜慮等⼤千界。\n\n> 有餘師⾔。下三靜慮如次。量等⼩中⼤千。第四靜慮量無邊際。⾔三 千者。彼云⿑何量⼩中⼤千。頌⽈。四⼤州⽇⽉。蘇迷慮欲天。梵世\n\n> 各⼀千。名⼀⼩千界。此⼩千千倍。說名⼀中千。此千倍⼤千。皆同 ⼀成壞。順正理三⼗⼀。⼤同俱舍。然說三千⼤千。唯⾄梵天故。彼\n\n> 云聖教唯說⾄梵世故。依⼤乘中。亦諸異。雜集第六。佛地第六。瑜 伽第⼆。智度皆同。前引⻑阿含等。若依顯揚第⼀。⼤意同前。然說\n\n> 三千世界三灾所壞。故知初禪⼩千。⼆禪中千。三禪⼤千。若依⾦光 明。三千世界遍無⾊界。彼云是諸仁王。⼿擎香爐。供養經時。其香\n\n> 遍布。於⼀念頃。遍⾄三千⼤千世界百億⽇⽉乃⾄百億非想非非想 天。若依此經。唯⾄第四靜慮。故次下云照百億⾊究竟天。問此上諸\n\n> 說。何者為定。 答若約⾄教定量。則此經為定。若依各隨機說。則⼀切皆定。\n\n> ⼆別顯中三。初辨照現⼈中。次百億菩薩下明照現八想。後有百億須 彌下照現欲\n\n### 5.3 李通玄《新华严经论》（`T1739`）——昇须弥山顶品第十三段\n\n李通玄判「此⼗住位中有六品經……如是六品共成⼗住法⾨」·释此品**义分为三**（释品来意·以处表法·随文释义）。以处表法段详叙妙峯山（七重金轮围山·七重大海·出水高八万四千由旬·四宝所成·上有四埵·四八三十二·中心名妙高顶·帝释居宝宫殿）·天帝释四名（天帝释·憍尸迦·释提桓因·因陀罗·能主）·善财童子于妙峯山得「憶念諸佛智慧光明門」·**长科十段**（与澄观十段同趣）·「不離菩提樹」五义。李氏以「创生如来智慧之家为真佛子」归宗·主**表法**一路，与澄观法藏之性起辨相映。\n\n\n**〔L.193 本批·李通玄 T1739 直引〕**（`T1739`·六品共成十住法门·义分三·以处表法·妙峯山段·NFKD 归一锚定·raw @181176 起·CJK-only 坐标回映·分页符剔除·康熙部首原字形保留·照原分行不转写不断句·本直引在 §二 审计区外·锤命中 1 处取首现·回源即此祖典）：\n\n> 此⼗住位中有六品經。⼀昇須彌⼭頂品。⼆頂上偈讚品。三⼗住品。 四梵⾏品。五初發⼼功德品。六明法品。如是六品共成⼗住法⾨。\n\n> 將釋此品。義分為三。⼀釋品來意。⼆以處表法。三隨文釋義。 ⼀釋品來意者。明前於普光明殿⼈間地上成⼗信之⼼已終。此妙峯之\n\n> 頂。明從⼗信入⼗住入位之昇進故。此品須來。 ⼆以處表法者。明此⼭於七重⾦輪圍⼭。七重⼤海之內。出⽔⾼八萬\n\n> 四千由旬。縱廣亦爾。四寶所成。東⾯黃⾦。⻄⾯⽩銀。南⾯頗梨。 北⾯瑪瑙。上有四埵。埵有八部天眾。四八三⼗⼆。中⼼名妙⾼頂。\n\n> 天帝釋在其上居寶宮殿。通為帝釋天。三⼗三天。總以帝釋為主。釋 有四名。⼀名天帝釋。⼆名憍⼫迦。三名釋提桓因。四名因陀羅。⼤\n\n> 意名能主。為能為諸天作主故。此妙峯⼭四寶合成。諸天寶宮殿在上 莊嚴故。為妙峯⼭。此⼭之外七重⾦⼭。及七重⼤海。廣量⾦翅⿃兩\n\n> 翼相去三⼗三千六萬⾥。此經無文未知何教所說。峻疾能⾶⼀⿎翼萬 萬九千⾥。七⽇七夜⽅⾄其頂。其⼭在⼤海之中。形如腰⿎。崒然⾼\n\n> 聳。非以⼿⾜攀攬之所能蹬。為表此⼗住法⾨創⽣如來智慧之家為真 佛⼦。不可以有為⽣滅尋思觀察及多聞⼼想攀攬所得故。以將妙峯⼭\n\n> ⽤況表之。令後⼈倣學。⼭者⾼勝義故。此像⼗住住佛所住法⾝妙智 慧海故。是出世⾼勝義故。妙峯⼭者。不動義。諸天所居妙樂義莊嚴\n\n> 義。像此位菩薩以⽅便三昧寂然不動。無思無⼼不收不攝。任性⽽ 定。稱平等理與法⾝合。忽然妙慧從此定⽣。無始無明總無所得。住\n\n> 佛妙慧都無所依。得法妙樂智慧莊嚴。出過情⾒。諸佛所說解脫微妙 經典無不解了。為⽣在如來智慧家故。三界無明⼀時頓盡。唯有習氣\n\n> 煩惱漸漸以法治之。如下⼗住品云。佛⼦。菩薩住處廣⼤與法界虛空 等。佛⼦。菩薩住三世諸佛家故。⼜如初發⼼功德品云。應知此⼈即\n\n> 與三世諸佛同等。即與三世諸佛如來境界平等。即與三世諸佛如來功 德平等。得如來⼀⾝無量⾝究竟平等真實智慧。纔發⼼時即為⼗⽅⼀\n\n> 切諸佛所共稱歎。乃⾄振動⼀切世界。及⼀切世界中⽰現成佛等。如 文廣明。不可同於三乘⽅便教說地前三賢菩薩得折伏現⾏無明初地⾒\n\n> 道。為此經法教⾨依⼀切諸佛根本不動智⽽發⼼故。以乘如來⼀切智 乘⽽發⼼故。於此⼗住位中能與如來同智慧故。不同三乘但將三空觀\n\n> 且折伏現⾏。於此經中發⼼之者。從佛不動智⽽發菩提⼼。設有餘習 還以無依住智治之。還是本智。不伏不斷為本寂⽤⾃在故。無體可斷\n\n> 故。無可伏故。設修三昧任性淨故。亦無取攝亦不伏捺故。任⾃淨 故。設⾏分別任性智慧隨事⽤為。亦無取捨故。如是任法調治習氣使\n\n> 稱理智。令慣習增明。如佛願⾏⽽隨事世間。成⻑⼤悲不出不沒故。 以⼼境⼀真無出沒故。是故經中以阿脩羅王等表之。處⼤海⽽不出不\n\n> 沒等喻。 問⽈。何故不昇四天王宮。⽽超⾄帝釋。\n\n> 答⽈。為四天在妙峯⼭半傍住。非是可表昇法頂⾄相盡處現智慧莊嚴 住不退故。善財童⼦。於妙峯⼭得憶念諸佛智慧光明⾨。同此位故。\n\n> 准例可知。以超情塵之跡。以⼭表之。非要蹬⼭也。以入如來智慧。 於眾中堪為主導故。非要帝釋也。\n\n> 三隨文釋義中。義分為三。⼀⻑科⼀品。⼆明如來⾝⾏遍周等印。如 下文經云。⼗⽅⼀切諸佛世界中悉亦如是。明⼗⽅⼀切妙峯⼭總⾒如\n\n> 來昇妙峯⼭頂。三隨文釋義。⼀⻑科⼀品者。於此品中⻑科為⼗段。 ⼀從爾時已下三⾏經。明佛神⼒普現⼗⽅。⼆爾時已下⼀⾏半經。明\n\n> 佛不離菩提樹下⽽昇帝釋天宮。三時天帝已下可七⾏經。明帝釋遙⾒ 佛來嚴殿敷座。四曲躬合掌已下兩⾏經。明帝釋請佛入殿。五爾時世\n\n> 尊已下三句經。是如來受請入殿。六⼗⽅⼀切世界已下三句經。是結 ⼗⽅普會同此。七爾時帝釋已下可⼀⾏半經。明佛神⼒樂⾳⾃息。八\n\n> 即⾃憶念已下四句。明帝釋⾃念過去善根說頌歎佛來此。九如此世界 中已下兩⾏半經。都結此處以偈歎佛。⼗⽅同然。⼗爾時已下可兩⾏\n\n> 經。明如來處座⽽坐其殿廣博寬容。并結⼗⽅同此。三隨文釋義者。 云不離菩提樹者。明菩提體無去來遠近處所可離可到故。⼜如來智⾝\n\n> 無表裏體遍周故。⼜法界非⼤⼩毫剎相容故。⼜⼼境無⼆相無中邊⽅ 所故。⼜諸法無⾃性⼀多恒圓滿故。帝釋遙⾒佛來者有⼆義。⼀事。\n\n> ⼆表法。⼀事者。為如來於無去來性⽰去來之相故⾔遙⾒。⼆表法 者。明帝釋⽰同未悟不⾒如來智⾝遍周與⼼⼀體故⾔遙⾒佛來。故⼜\n\n> 信解為遙⾒⾃⼼入位為佛來。帝\n\n### 5.3′ 李通玄《华严经合论》（`X0223`）——升须弥山顶品（合论本）\n\n合论（`X0223` 卷…）于本品兼录**【经】全文**与**【論】十段科**（经偈全文＋论科），为《新华严经论》之会要重编·文与 `T1739` 相表里。〔按〕本地直据 `_e13_sources.txt` 收割窗口（`X0223` @297497·六品共成十住法门·三分·长科十段），不另转写。\n\n\n**〔L.193 本批·李通玄合论 X0223 直引〕**（`X0223`·【論】六品共成·三分·【經】全文＋【論】长科十段·NFKD 归一锚定·raw @297552 起·CJK-only 坐标回映·分页符剔除·康熙部首原字形保留·照原分行不转写不断句·本直引在 §二 审计区外·锤命中 1 处取首现·回源即此祖典）：\n\n> 六品共成⼗住法⾨將釋此品義分為三 ⼀釋品來意⼆以處表法三隨文釋義⼀釋品來意者明前於普光明殿⼈間\n\n> 地上成⼗信之⼼ 已\n\n> 終此妙峯之頂明從⼗信入⼗住入位之昇進故此品須 來⼆以處表法者明此⼭於七重⾦輪圍⼭七重⼤海之內出⽔⾼八萬四千\n\n> 由旬縱廣亦爾四寶所成東⾯黃⾦⻄⽩銀南吠琉璃北瑪瑙上有四埵埵有 八輔天眾四八三⼗⼆中⼼名妙⾼頂天帝釋在其上居寶宮殿通為帝釋天\n\n> 三⼗三天總以帝釋為主帝釋有四名⼀名天帝釋⼆名憍⼫迦三名釋提桓 四名因陀羅⼤意名能主為能為諸天作主故此妙峯⼭四寶合成諸天寶宮\n\n> 殿在上莊嚴故為妙峯⼭此⼭之外七重⾦⼭及七重⼤海廣量⾦翅⿃兩翼 相去三百三⼗六萬⾥迅疾能⾶⼀⿎翼萬萬九千⾥七⽇七夜⽅⾄其頂其\n\n> ⼭在⼤海之中形如腰⿎崪然⾼聳非以⼿⾜攀攬之所能登為表此⼗住法 ⾨創⽣如來智慧之家為真佛⼦不可以有⽣滅尋思觀察及多聞⼼想攀攬\n\n> 所得故以將妙峯⼭⽤況表之令後⼈倣學⼭者⾼勝義故像此⼗住住佛所 住法⾝妙智慧海故是出世⾼勝義故妙峯⼭者不動義諸天所居妙樂義莊\n\n> 嚴義像此位菩薩以⽅便三昧寂然不動無思無⼼不收不攝任性⽽定稱平 等理與法⾝合忽然妙慧從此定⽣無始無明總無所得住佛妙慧都無所依\n\n> 得法妙樂智慧莊嚴出過情⾒諸佛所說解脫微妙經典無不解了為⽣在如 來智慧家故三界無明⼀時頓盡唯有習氣煩惱漸漸以法治之如下⼗住品\n\n> 云佛⼦菩薩住處廣⼤與法界虗空等佛⼦菩薩住三世諸佛家故⼜如初發 ⼼功德品云應知此⼈即與三世諸佛同等即與三世諸佛如來境界平等即\n\n> 與三世諸佛如來功德平等得如來⼀⾝無量⾝究竟平等真實智慧纔發⼼ 時即為⼗⽅⼀切諸佛所共稱歎乃⾄震動⼀切世界及⼀切世界中⽰現成\n\n> 佛等如文廣明不可同於三乘⽅便教說地前三賢菩薩得折伏現⾏無明地 上⾒道為此經法教⾨依⼀切諸佛根本不動智⽽發⼼故以乘如來⼀切智\n\n> 乘⽽發⼼故於此⼗住位中能與如來同智慧故不同三乘但將三空觀且折 伏現⾏於此經中發⼼之者從佛不動智⽽發菩提⼼設有餘習還以無依住\n\n> 智治之還是根本智不伏不斷為本寂⽤⾃在故無體可斷故無可伏故設修 三昧任性淨故亦無收攝亦不伏捺故任⾃淨故設⾏分別任性智慧隨事⽤\n\n> 為亦無取捨故如是任法調治習氣使稱理智令慣習增明如佛願⾏⽽隨事 世間成⻑⼤悲不出不沒故以⼼境⼀真無出沒故是故經中以阿脩羅王等\n\n> 表之處⼤海⽽不出不沒等喻問⽈何故不昇四天王宮⽽超⾄帝釋宮答⽈ 為四天王在妙峯⼭半傍住非是可表昇法頂處⾄相盡現智慧莊嚴住不退\n\n> 故善財童⼦於妙峯⼭得憶念諸佛智慧光明⾨同此位故准例可知以超情 塵之跡以⼭表之非要登⼭也\n\n> 已 入如來智慧於眾中堪為主導故非要為帝\n\n> 釋也第三隨文釋義中義分為三⼀總科⼀品⼆明如來⾝⾏徧周等印如下 經云⼗⽅⼀切諸世界中悉亦如是明⼗⽅⼀切妙峯⼭總⾒如來昇妙峯⼭\n\n> 頂三隨文釋義。 【經】爾時如來威神⼒故⼗⽅⼀切世界⼀⼀四天下閻浮提中悉⾒如來\n\n> 坐於樹下各有菩薩承佛神⼒⽽演說法靡不⾃謂恒對於佛爾時世尊不離 ⼀切菩提樹下⽽上昇須彌向帝釋殿時天帝釋在妙勝殿前遙⾒佛來即以\n\n> 神⼒莊嚴此殿置普光明藏師⼦之座其座悉以妙寶所成⼗千層級迥極莊 嚴⼗千⾦網彌覆其上⼗千種帳⼗千種蓋周迴間列⼗千繒綺以為垂帶⼗\n\n> 千珠纓周徧交絡⼗千衣服敷布座上⼗千天⼦⼗千梵王前後圍遶⼗千光 明⽽為照耀爾時帝釋奉為如來敷置座\n\n> 已 曲躬合掌恭敬向佛⽽作是⾔善\n\n> 來世尊善來善逝善來如來應正等覺唯願哀愍處此宮殿爾時世尊即受其 請入妙勝殿⼗⽅⼀切諸世界中悉亦如是爾時帝釋以佛神⼒諸宮殿中所\n\n> 有樂⾳⾃然⽌息即⾃憶念過去佛所種諸善根⽽說頌⾔。 迦葉如來具⼤悲\n\n> 諸吉祥中最無上 彼佛曾來入此殿\n\n> 是故此處最吉祥 拘那牟尼⾒無礙\n\n> 諸吉祥中最無上 彼佛曾來入此殿\n\n> 是故此處最吉祥 迦羅鳩馱如⾦⼭\n\n> 諸吉祥中最無上 彼佛曾來入此殿\n\n> 是故此處最吉祥 毗舍浮佛無三垢\n\n> 諸吉祥中最無上 彼佛曾來入此殿\n\n> 是故此處最吉祥 ⼫棄如來離分別\n\n> 諸吉祥中最無上 彼佛曾來入此殿\n\n> 是故此處最吉祥\n\n### 5.4 诸家对读小结\n\n| 家 | 科判 | 处所义 | 不起而升 | 会名 |\n|---|---|---|---|---|\n| 澄观 `T1735` | 六品**二分**·本品**十段** | 妙有十义况住·观心三弥 | 月喻·古德**十义**（十玄雏形） | 忉利天／法慧／十住会 |\n| 法藏 `T1733` | 六品**分二**（初二序·余四正宗） | 成位不退故居山顶 | **八义**（不去而进） | 十住／忉利天会 |\n| 智俨 `T1732` | 六品**分三**（方便/正位/满足） | 住处序五序（八序） | 赴机起化 | 会来意·报体成已 |\n| 慧苑 `X0221` | 六品长科三·本会圆遍九重遍 | 越四王·机感德增 | 印中字·同时前后遍 | 山顶／三十三／妙胜殿／十住会 |\n| 李通玄 `T1739` | 六品共成·义分**三**·长科十段 | 妙峯山四宝表法 | 不离菩提树五义 | 十住法门 |\n\n**异同**：五门／四门／三分／二分／十段，名目虽殊，**皆以「从信入住、位渐升进、依佛智显差别」为宗**〔本文判断：诸家科判之会通属本席判，非经证〕。澄观十义最富哲理（十玄雏形），智俨五序最便结构，李通玄表法最显处法之义——三途并蓄，为 §二 科段与 §七 数据层之依据。\n\n---\n\n## 六、文本对读与校勘\n\n### 6.1 与六十华严〈佛昇須彌頂品第九〉对读\n\n六十（`T09n0278`·晋译）相当品为〈佛昇須彌頂品第九〉（juan7·@7436–8200·CJK 637·26 段），与本品（八十 CJK 654·8 单元）**段数多而单元碎**（六十长行分合不同·十佛颂作十三个独立段 60-004–60-023·每二句一段）。要义对读三点：\n\n**（一）结构同**：齐现（60-001↔80-01）→不起此座昇须弥（60-002↔80-02）→帝释严殿·请佛（60-002/003↔80-03/04）→入殿·乐音寂·忆念说偈（60-003↔80-05）→十佛颂（60-004–023↔80-06）→结通·昇师子座·宫殿广博（60-024↔80-07）。**两译骨架全同**，可段段对应。\n\n**（二）名号异译**（十佛·详见 §2.7 表）：六十「拘那牟尼**慧**無礙·**拘樓**佛身如金山·**隨葉**離三垢·尸棄**常寂然**·**錠光**如來明普照」——与八十「見無礙·迦羅鳩馱·毘舍浮·離分別·然燈大光明」名号／别德多异。**各照底本·不强定对应·不臆造对齐**（铁律·第二会 P8 已定）。\n\n**（三）数量词异**：八十庄严「**十千**」×10，六十作「**萬種／萬寶／一萬**」——数值同（一万）译词异；八十「入此殿／此處」六十全作「入此**處**／此**處**」（殿→处·泛化）；六十结颂首「迦葉如來具大**慈**」对八十「具大**悲**」。\n\n〔按·请佛句〕八十请佛**一处三称**（80-03 末·「善來世尊！善來善逝！善來如來、應、正等覺！唯願哀愍，處此宮殿！」；dump 之 80-04 系平文器重计假象·非重出·§1.5·§6.4），六十（60-003）**仅一称**「善來世尊！唯願哀處我此宮殿」且较八十简（无「善来善逝·善来如来应正等觉」之叠·无「哀愍」之「愍」）——两译请辞繁简之别·非缺文·如实记。\n\n### 6.1′　六十《佛昇須彌頂品第九》全本对照〔L.193 本批·全量入文〕\n\n（品界 `T09n0278` juan7「佛昇須彌頂品第九」→「菩薩雲集妙勝殿上說偈品第十」前·26 段·正文取 60-000–60-024·60-025「大方廣佛華嚴經」分卷题残行不取·口径登记·以下逐段照录·`_e13_full.py` 程序取自 `T09n0278`·0 手抄）\n\n（品界 `T09n0278` juan7「佛昇須彌頂品第九」→「菩薩雲集妙勝殿上說偈品第十」前·26 段·正文照录取 60-000–60-024·CJK 630·60-025「大方廣佛華嚴經」分卷题残行不取·口径登记·以下逐段照录本地入库全本·不转写不断句·`_e13_full.py` 程序取自 `T09n0278`·0 手抄·「六十｜」前缀为异译侧照录标记·本区在 §二 审计扫描区外）：\n\n> 六十｜佛昇須彌頂品第九\n\n> 六十｜爾時，如來威神力故，十方一切諸佛世界諸四天下，一一閻浮提，皆有如來坐菩提樹下，無不顯現。彼諸菩薩各承佛神力，說種種法。皆悉自謂：在於佛所。\n\n> 六十｜爾時，世尊威神力故，不起此座，昇須彌頂，向帝釋殿。爾時，帝釋遙見佛來，即於妙勝殿上，敷置眾寶師子之座。以萬種雜寶而莊嚴之；萬種寶帳彌覆其上；以萬寶網而絞絡之；次上萬種眾妙寶蓋、天繒雜寶以為垂帶；萬種瓔珞而莊嚴之；萬種寶衣以敷座上。一萬天子在前立侍；一萬梵天而圍遶之；一萬光明以為照耀。\n\n> 六十｜爾時，帝釋為佛莊嚴師子座已，合掌恭敬白佛言：「善來世尊！唯願哀處我此宮殿。」爾時，世尊即受其請，昇妙勝殿；一切十方亦復如是。爾時，帝釋無量樂音，佛神力故，寂然無聲。即自憶念於過去佛所種諸善根，以偈頌曰：\n\n> 六十｜「迦葉如來具大慈，諸吉祥中最無上，\n\n> 六十｜彼佛曾來入此處，是故此地最吉祥。\n\n> 六十｜拘那牟尼慧無礙，諸吉祥中最無上，\n\n> 六十｜彼佛曾來入此處，是故此地最吉祥。\n\n> 六十｜拘樓佛身如金山，諸吉祥中最無上，\n\n> 六十｜彼佛曾來入此處，是故此地最吉祥。\n\n> 六十｜隨葉如來離三垢，諸吉祥中最無上，\n\n> 六十｜彼佛曾來入此處，是故此地最吉祥。\n\n> 六十｜尸棄如來常寂然，諸吉祥中最無上，\n\n> 六十｜彼佛曾來入此處，是故此地最吉祥。\n\n> 六十｜毘婆尸佛如滿月，諸吉祥中最無上，\n\n> 六十｜彼佛曾來入此處，是故此地最吉祥。\n\n> 六十｜弗沙明達第一義，諸吉祥中最無上，\n\n> 六十｜彼佛曾來入此處，是故此地最吉祥。\n\n> 六十｜提舍如來辯無礙，諸吉祥中最無上，\n\n> 六十｜彼佛曾來入此處，是故此地最吉祥。\n\n> 六十｜波頭摩佛淨無垢，諸吉祥中最無上，\n\n> 六十｜彼佛曾來入此處，是故此地最吉祥。\n\n> 六十｜錠光如來明普照，諸吉祥中最無上，\n\n> 六十｜彼佛曾來入此處，是故此地最吉祥。」\n\n> 六十｜如此間帝釋，佛神力故，以偈讚歎十佛功德；如是十方帝釋，各自憶念過去佛所所種善根，以偈讚歎亦復如是。爾時，世尊昇師子座，結跏趺坐。坐已，宮殿忽然廣博如忉利天處，一切十方，亦復如是。\n\n〔按·两译段次对应〕齐现（60-001↔80-01）·不起此座昇须弥（60-002↔80-02）·帝释严殿·请佛（60-002/003↔80-03）·入殿·乐音寂·忆念说偈（60-003↔80-05）·十佛颂（60-004–023↔80-06）·结通·昇师子座·宫殿广博（60-024↔80-07）·两译骨架全同可段段对应。名号异译、数量词「十千↔萬」之差别详 §6.1（二）（三）·各照底本不强统一·不臆造对齐。\n\n### 6.2 四十华严（`T10n0293`）\n\n四十华严（唐·般若译）全经仅**入法界一品**，无「升须弥山顶」相当品，本品不取为对读。〔待核〕四十本之须弥／忉利段（如有）散在入法界品参善知识科·非本品相当。\n\n### 6.3 藏译对读（Toh 44）\n\n藏译《华严》（`Toh 44`·Dege 45 品·前分相当汉〈ascend〉类品段）**本机未入库逐字对勘**〔未竟〕。只标分品相当之传闻，不作「藏译云」原文冒充。\n\n### 6.4 校勘记\n\n- **〔单元重计・非重出〕**：dump 之 80-04「善來世尊……處此宮殿！」与 80-03 末请佛句同文·系平文器将庄严段外层 `<p>` 内嵌套节点**重复识别**为一单元（前向游标假象）·实测品界 body80 中「善來」仅×3（一处三称）·**经文无重出**·入文只取 80-03（§1.5·§6.1 按）。\n- **〔升／昇〕**：`T10n0279` 品题「**昇**須彌山頂品第十三」，`T1735` 疏文「**升**須彌山頂品第十三」，异体各照其 KIP = {'note', 'rdg', 'mulu', 'pb', 'anchor', 'app'}\nout = []\ndef walk(el):\n    tag = el.tag.split('}')[-1]\n    if tag in SKIP: return\n    if tag == 'lb': out.append(' ')\n    if el.text: out.append(el.text)\n    for c in el:\n        walk(c)\n        if c.tail: out.append(c.tail)\nwalk(ET.parse('data/references/cbeta/T10n0279.xml').getroot())\nONLY = lambda s: ''.join(c for c in s if '\\u4e00' <= c <= '\\u9fff')\nfullC = ONLY(''.join(out))\ni = fullC.find('昇須彌山頂品第十三')\nk = fullC.find('須彌頂上偈讚品第十四', i + 6)\nassert 0 < i < k, (i, k)\nbody = fullC[i:k]                     # 品界 slice（含品题）\nprint('@%d–%d CJK(含品题):' % (i, k), len(body))          # 实测 654\nprint('正文净(去品题9):', len(body) - len('昇須彌山頂品第十三'))  # 645\nfor w in ('爾時', '十方', '十千', '善來', '最無上', '是故此處最吉祥'):\n    print(w + ':', body.count(w))     # 6 / 4 / 10 / 3 / 10 / 10\nBUDDHAS = ['迦葉','拘那牟尼','迦羅鳩馱','毘舍浮','尸棄','毘婆尸','弗沙','提舍','波頭摩','然燈']\nprint('十佛名命中:', sum(1 for b in BUDDHAS if b in body), '/10')\n```\n\n> **〔实测记录·L.193〕** 品界：起 @100269、止 @100923（次品品题前）。上列各值由 `_e13_stats.py` 同一逻辑实跑产出（见 `_e13_stats.txt`），非估算；善來×3 已确证经文无重出（幻影 80-04 系 dump 层节点重计·不入品界 slice）。\n\n### 7.5 十佛名号·众集名数矩阵·数据科学四视角〔L.193 本批 新增〕\n\n> 数据基底＝`_e13_full.py` 结构化 dump（八十品界 CJK-only @100269–100923·654 含品题／正文净 645·真六单元；六十 26 段·正文 630；疏窗 CJK 3,301／raw 4,029）与 `_e13_stats.py` 品界 slice 频计表；四视角口径承第二会成例（P7/P8 §7.5 同构）。**凡比附义理者一律〔本文判断〕。**\n\n**L1·组合（品界单元实测）**：本品＝品题（80-00）＋**六个正文单元**（长行 80-01·02·03·05·07·五段＋偈颂 80-06·十佛颂）；平文器 dump 虽列 8 节点（含品题 head 80-00 与幻影 80-04），品界 slice 剔幻影后真单元恰 = 645 字·六段之和（§1.3·§7.4 assert）。\n\n**L2·公式频（复沓核验·品界 slice 实测）**：「十千」×10（庄严段 80-03·名数矩阵）·「最無上」×10（十佛颂次句·颂颂有之）·「是故此處最吉祥」×10（十佛颂结句）·「善來」×3（请佛一处三称·**非重出**·§6.4）·「爾時」×6·「十方」×4；六十侧「是故此地最吉祥」×10·「萬種」×5「萬寶」×1「一萬」×3（对八十十千）·「善來」×1（一称·较八十简）——**两译公式同构、用词各自一贯**。\n\n**L3·拓扑（一处·十方辐射）**：本会齐现（80-01「十方一切世界一一四天下閻浮提中悉見如來坐於樹下」·核）→不離菩提樹而昇須彌（80-02·体用相即）→帝释一殿严请（80-03·处）→十佛曾入此殿（80-06·时间轴·过去劫佛映现在处）→殿忽然广博·结通十方无尽（80-07）；澄观「十重说处中第一重」「带前起后」（§5.1 戊）·月喻「澄江一月三舟共觀」（§5.1 己）呈其一处遍十方之辐射。〔本文判断·形式描写之似，非义理证〕此结构与澄观长科 nchor=\"middle\" fill=\"#5b4636\">尸棄</text>\n  <rect x=\"330\" y=\"80\" width=\"50\" height=\"90\" fill=\"#b58a5e\" opacity=\"0.82\"/>\n  <text x=\"355\" y=\"128\" font-size=\"9\" text-anchor=\"middle\" fill=\"#fff\">4句</text>\n  <text x=\"355\" y=\"72\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5b4636\">毘婆尸</text>\n  <rect x=\"390\" y=\"80\" width=\"50\" height=\"90\" fill=\"#b58a5e\" opacity=\"0.82\"/>\n  <text x=\"415\" y=\"128\" font-size=\"9\" text-anchor=\"middle\" fill=\"#fff\">4句</text>\n  <text x=\"415\" y=\"72\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5b4636\">弗沙</text>\n  <rect x=\"450\" y=\"80\" width=\"50\" height=\"90\" fill=\"#b58a5e\" opacity=\"0.82\"/>\n  <text x=\"475\" y=\"128\" font-size=\"9\" text-anchor=\"middle\" fill=\"#fff\">4句</text>\n  <text x=\"475\" y=\"72\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5b4636\">提舍</text>\n  <rect x=\"510\" y=\"80\" width=\"50\" height=\"90\" fill=\"#b58a5e\" opacity=\"0.82\"/>\n  <text x=\"535\" y=\"128\" font-size=\"9\" text-anchor=\"middle\" fill=\"#fff\">4句</text>\n  <text x=\"535\" y=\"72\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5b4636\">波頭摩</text>\n  <rect x=\"570\" y=\"80\" width=\"50\" height=\"90\" fill=\"#b58a5e\" opacity=\"0.82\"/>\n  <text x=\"595\" y=\"128\" font-size=\"9\" text-anchor=\"middle\" fill=\"#fff\">4句</text>\n  <text x=\"595\" y=\"72\" font-size=\"9\" text-anchor=\"middle\" fill=\"#5b4636\">然燈</text>\n  <text x=\"320\" y=\"196\" text-anchor=\"middle\" font-size=\"10\" fill=\"#7a6a5a\">十佛名号梵汉训释（迦葉＝飲光·拘那牟尼＝金仙·毘婆尸＝四翻淨勝遍見·然燈＝舉身帶光·详 §5.1 癸四·澄观）</text>\n</svg>\n\n\n---\n\n## 八、附录（十一类）\n\n### 附录一：人名表\n| 名 | 训释 | 出处 |\n|---|---|---|\n| 如来／世尊 | 本品化主·不起菩提树而昇须弥 | `T10n0279` |\n| 天帝釋／憍尸迦 | *Śakro devānām indieṃ*·忉利主·妙胜殿严佛 | `T1735`／`T1733` |\n| 十佛 | 迦葉等过去七佛＋三（详见 §4.3） | `T10n0279` 80-06 |\n| 澄观 | 唐·清凉山大华严寺沙门 | `T1735` |\n| 法藏 | 唐·魏国西寺沙门 | `T1733` |\n| 智俨 | 唐·终南山至相寺沙门（华严二祖） | `T1732` |\n| 慧苑 | 唐·大薦福寺沙门 | `X0221` |\n| 李通玄 | 唐·李通玄 | `T1739`／`X0223` |\n\n### 附录二：名相表\n（见 §4.4·苏迷卢／妙高·忉利天／三十三天·妙胜殿·不起而升·十住位）\n\n### 附录三：经文要句\n（见 §2.1–§2.8·品界 slice 逐字回源）\n\n### 附录四：注疏引文汇\n（见 §5.1–§5.3；〔L.193 本批〕**澄观疏科长文全摘（五门·十段）已入 §5.1**·**本科段全文照录已入附录四′**·复核件 `_e13_dump.txt`／`_e13_stats.txt`）\n\n**附录四′·澄观《华严经疏》本科段全文照录**〔L.193 本批·达标基线补全〕（`T1735` 卷第十六「升須彌山頂品第十三」段·raw @210566–214593·CJK-only 坐标回映切片·分页符行剔除·余照原档分行排段不转写不断句·康熙部首原字形保留（如「⻑」「⼭」「⾸」）·本附录在 §二 审计区外不污引文审计·共 129 档行·窗 CJK 3,301）：\n\n> 升須彌⼭頂品第⼗三 (已下第⼗六經)\n\n> 初來意者。先辨會來。前信此解。義次第故。⼜答⼗住問總有⼆段。 前信是住之⽅便。此明正位故次來也。⼆品來。前品說信究竟。此品\n\n> 趣後說住。故次來也。⼆釋名。亦先辨會名。約處名忉利天會。約⼈ 名法慧菩薩會。約法名⼗住會。皆依主釋。⼆品名。須彌正云蘇迷\n\n> 盧。此云妙⾼。如來以⾃在⼒不起覺樹。應機現彼故云升也。表位漸 增不處⼈間。顯位清淨故居天也。若天表淨何獨妙⾼。妙有⼗義。如\n\n> 於法故。⼀者體妙謂四寶所成。⼆者相妙。謂八⽅四級。三者⾊妙謂 四正⾊。北⾦東銀南吠瑠璃⻄頗胝迦。⼀切草⽊⿃獸等物。隨所⾄處\n\n> 則同其⾊。⾃常不變。四者德妙。謂八⽅猛風不能令動。五眷屬妙。 謂七⾦⼭七重圍繞。及七香海海印旋流。六依持妙。唯天依住。得通\n\n> 者居。七作業妙。不離本處⽽鎮四洲。映蔽⽇⽉⽽成晝夜。八⽣果 妙。謂波利質多能益天眾。九為⾸妙。於四洲地最在先成。⼗堅固\n\n> 妙。於輪圍中最在後壞。⾼者⾼八萬四千由旬。入⽔亦爾。下據⾦剛 上隣空界。頂上縱廣量亦如之。獨出九⼭故稱⾼也。⼗住之⾏亦復如\n\n> 是。聞思修解⽽為妙體。四德八聖以為妙相。四辯為⾊令物解同。雖 同眾⾳⾃智不變。八法不動⽽為妙德。七⽀奉戒⾦⼭圍繞。七識流轉\n\n> ⽽為海印。第⼀義天依持⽽住。可以神會非情能升。不離本處遍應⼗ ⽅。映蔽佛⼝及菩薩⽉。⽽成涅槃⽣死晝夜。⽣教⾏果⽽為妙樹。世\n\n> 界初成菩薩先出。為眾⽣現種種資具。世界將壞菩薩後沒。為說上定 令免三災。⾼者具成八萬四千諸度法⾨。⾃在障外為眾⽣故。入⽣死\n\n> 海。亦具八萬四千諸度法⾨。據⾦剛性隣勝義空。⼜智入佛慧必窮其 底。德超⽅便逈出群峯。為顯⼗住功德妙⾼。是故須升妙⾼⼭頂。四\n\n> 王處半旁⽽非正。表住不退異信輕⽑。故越彼天居妙⾼頂。善財童⼦ 於妙峯⼭頂⾒德雲者。亦表斯位彌顯有由。然上所釋皆圓教意。故下\n\n> 發⼼品云。應知此⼈即與三世諸佛同等。與三世佛功德平等。得如來 ⼀⾝無量⾝。纔發⼼時。即為⼗⽅⼀切諸佛共所稱歎。不可同於⽅便\n\n> 教說。若約觀⼼妙⾼者。謂三昧須彌寂然不動。無思無⼼不收不攝。 任性⽽定稱本⼼地。入佛智海湛然不遷。是妙法樂觸境⾃在。合本性\n\n> 淨。是四德寶⽽⾃莊嚴。斯則本覺如來。升法須彌之頂。三宗趣者。 先約會以⼗住⾏德為宗。攝位德果為趣。⼆品以嚴處請佛赴感為宗。\n\n> 根緣契合說法為趣。四釋文者。此會六品分為⼆分。初⼆品⽅便發 起。後四品當會正說。前中初之⼀品。唯是由致。偈讚⼀品義有兩\n\n> 兼。⼀是⽅便。謂前品化主赴機。後品助化讚佛。主伴圓備⽅演法 故。⼆是所依。謂三天說法各有偈讚。欲顯三賢皆依佛智有差別故。\n\n> 離如來智無⾃體故。獨為⽅便甚抑讚詞。⾏向⼆會同此科判。今初⼀ 品⻑分⼗段。⼀本會⿑現。⼆不離⿑升。三各⾒佛來。四各嚴殿座。\n\n> 五皆來請佛。六俱時入殿。七樂⾳並⽌。八各念昔因。九同讚如來。 ⼗殿皆廣博嚴淨也。⾔爾時者。即前⼆會時。主伴⿑遍演前⼆會之法\n\n> 也。今此明遍。即⼗重說處中第⼀重也。何須舉此。欲明前會不散成 後會故。後必帶前。合成法界無礙會故。⼀⼀諸會無休息故。後後諸\n\n> 會皆同時故。若散前會即無後故。所以唯約覺樹會者。此為本故。得 佛處故。理實第⼆亦同此遍。若同時遍。何有九會前後。若有前後何\n\n> 名同時。應云即⽤之體同時頓遍。即體之⽤不壞前後。猶如印文。第 ⼆爾時下。明不離覺樹各升釋天。問動靜相違去住懸隔。既云不離何\n\n> 得⾔升。古有多釋。⼀云。本釋迦⾝不起道樹。別起應化以升天上。 ⼀云。不起是報升天是化。⼀云。不起是法⾝升天是化⽤。並非文\n\n> 意。以此文中俱是毘盧遮那⼗⾝雲故。⼀云。以去即非去故名不起。 非去即去是以升天。如不來相⽽來等。若爾但是升相離故。非是樹下\n\n> 別有不起之⾝。故不可也。有云。此佛神通同體業⽤。即住是去去即 是住。住是體遍去是⽤應。應是體應。雖升後⽽不離前。體是應體。\n\n> 雖不離前⽽升後。若爾何殊第三師。不起是法。⼜以住釋於不起。⽽ ⾔住是體遍。何得獨住菩提樹耶。升天何得非體遍耶。菩提樹下寧非\n\n> ⽤耶。今顯正義。然佛得菩提。智無不周體無不在。無依無住無去無 來。然以⾃在即體之應。應隨體遍。緣感前後有住有升。閻浮有感⾒\n\n> 在道樹。天宮有感⾒升天上。非移覺樹之佛。⽽升天宮故云不離覺 樹。⽽升釋殿。法慧偈云。佛⼦汝應觀如來⾃在⼒。⼀切閻浮提皆⾔\n\n> 佛在中。此不離也。我等今⾒佛住於須彌頂。此⽽升也。文理有據。 更以喻顯。譬猶朗⽉流影遍應。且澄江⼀⽉三⾈共觀。⼀⾈停住。⼆\n\n> ⾈南北。南者⾒⽉千⾥隨南。北者⾒⽉千⾥隨北。停⾈之者⾒⽉不 移。是為此⽉不離中流⽽往南北。設百千共觀八⽅各去。則百千⽉各\n\n> 隨其去。諸有識者曉斯旨焉。古德釋此。略有⼗義。⼀約處相入⾨。 以⼀處中有⼀切處故。是故此天宮等。本在樹下。故不須起。然是⽤\n\n> 彼故說升也。⼆亦約相入⾨。以⼀處入⼀切處故。樹遍天中亦不須 起。欲⽤天宮表法升進。故云升也。三由⼀切即⼀故。天在樹下。四\n\n> 由⼀即⼀切樹在天上。不起等準前。五約佛⾝。謂此樹下⾝。即滿法 界遍⼀切處。則本來在彼不待起也。機熟令⾒故云升也。是故如來以\n\n> 法界⾝常在此。即是在彼。六約佛⾃在不思議解脫。謂坐即是⾏住 等。在此即在彼。皆非下位測量故也。七約緣起相由⾨。八約法性融\n\n> 通⾨。九約表⽰顯法⾨。⼗約成法界⼤會⾨。然此⼗解前五⽞⾨。次 四所以。後⼀總意。欲成⼗義相參⽽立。雖似雜亂不違經宗。並可⽤\n\n> 也。然此中相望有四對。法相即無礙。⼀此處彼處。⼆此⾝彼⾝。三 若去若住。四若⼀若多。約處此處彼處相即無礙。應如⼗中前四。約\n\n> ⾝相即無礙。應如五六及前正顯。⼜⼗中後四通於⾝處。約處唯有此 彼。約⾝更加去住。謂此⾝即是彼⾝。去⾝即是住⾝。若⾝若處俱通\n\n> ⼀多。上來諸法同在⼀時。無前後也。⼀多相望應成四句。⼀不離⼀ 切樹下升⼀天宮。即如今文。⼆不離⼀樹升⼀切天。三不離⼀切樹⽽\n\n> 升⼀切天。經云⼗⽅世界悉如是故。四不離⼀樹下⽽升⼀天。經中欲 顯⼀多相即。故舉初句。升釋天既爾升餘天亦然。如後⼆會升天既\n\n> 爾。往餘處亦然。復應樹樹相望⽽成⼆句。謂不離⼀樹下常在⼀切 樹。不離⼀切樹⽽常在⼀樹。復應以不起餘處。類不起樹下。展轉相\n\n> 望皆悉周遍。不壞前後⾃在難思。⼜既⼀處有⼀切處亦有微細義。所 ⽤不同有隱顯義。若加前時後時有⼗世義。唯⾒說住。及於餘法有純\n\n> 雜義。後後帶於前前有帝網義。此天望餘成主伴義。⼗⽞具矣。問帶 前起後事理應⿑。何故三賢獨有斯旨。答顯異義故。謂初⼆會相隣接\n\n> 故。不假帶前。此三⼈天隔越。故須連帶。⼜此三會同詮賢位。六已 入證不假帶前。第七即位中普賢居然不假。第八頓彰五位體⽤已融。\n\n> 第九唯明證入體⽤⼀味故。並皆不假。第三時天帝下。明各⾒佛來。 約佛則⽤從體起。約機境從⼼現。隣⽽未即故云遙⾒。第四即以下。\n\n> 各嚴殿座。表嚴根欲之殿為法器故。置師⼦座。表⼗住之法⾨故。文 有⼗句。初總餘別。總云普光明藏者。此是解位智。照法空含眾德\n\n> 故。從信始入故有置⾔。別中初句約體。餘並顯嚴。皆云⼗千者。萬 ⾏因感故。⾔層級者萬⾏熏成故。⾦網防護。慈悲帳蓋以育以覆。四\n\n> 攝繒綺以為周垂。圓融⾏願交絡萬善。柔忍慚愧以覆法空第⼀義天。 清淨梵⾏繞斯法體。⼀⼀智照故⽇光明。於⽣死中。遣⻑夜闇舉斯果\n\n> 德。令物⾏因。下⾏向中。約位漸增表法無異。第五爾時帝釋下。請 佛居殿。於中三業崇敬以為請儀。⾔善來者應機來故。不來相⽽來\n\n> 故。帶法界會來故。三稱善者喜之⾄故。舉三號者略歎德故。願哀處 者。希仗勝⽥⽣⼤福故。第六爾時下俱時入殿。謂根緣契合成益不\n\n> 虛。⼗⽅如是。通上六段入殿事訖。故⼀結通。下四段文殿中之事。 第七爾時下樂⾳⽌息。謂攝散歸靜得定益故。第八即⾃下。各念昔因\n\n> 獲智益也。散緣既⽌勝德現前。寂然無思發宿住智。種善根者。即下 ⼗佛曾入此殿。聞法供養故。亦表⾒⾃⼼性。同昔佛故。第九迦葉\n\n> 下。同讚如來。然三世諸佛。皆於此處說⼗住法。獨讚⼗者。表說⼗ 住及無盡故。所以讚者義乃有四。⼀⼗佛曾處則殿勝可居。⼆互舉⼀\n\n> 德例讚本師。三敘昔善根慶遇堪受。四昔佛同說表法常恒。文中先明 此界後辨結通。今初⼗頌。各上半標名讚德。上句別下句通。下半以\n\n> ⼈結處。唯初⼀句諸佛不同。然佛別名多因德立。讚者取德以釋上 名。初迦葉者此云飲光。若從姓立⽰⽣彼族。若就佛德。⼀者⾝光蔽\n\n> 餘光故。⼆者悲光飲蔽邪光故。拘那牟尼舊⽈⾦仙。亦云⾦寂。寂故 無礙。⾦故明⾒。迦羅鳩馱者。具云迦羅鳩村馱。此云所應斷。已斷\n\n> 如⾦已淨。如⼭不動。亦可⾒無礙者。是此佛德。如⾦⼭者是前佛 德。毘舍浮者。亦云毘濕婆部。毘濕婆者。此云遍⼀切也。部者⾃在\n\n> 也。亦云遍勝無三垢。故無不⾃在⽽超勝也。三垢者。現種及習。⼫ 棄亦云式棄那。此云持髻。亦云有髻。無分別智最為尊上。處⼼頂\n\n> 也。⼜髻中明珠即無分別也。毘婆⼫者此翻有四。謂淨觀。勝觀。勝 ⾒。遍⾒。如⽉圓。智滿是遍⾒也。魄盡惑亡是淨觀也。既圓且淨。\n\n> 是勝觀勝⾒也。弗沙亦云勃沙。此云增盛。明達勝義是增盛也。提舍 亦云底沙。⻄域訓字底邏那。此云度也。沙是皤沙。此云說也。謂說\n\n> 法度⼈。或但云說。辯才無礙者即能說也。波頭摩者。此云⾚蓮華。 ⾝⼼如蓮華淨無塵垢。然燈者。智論云。此佛從初現⽣。乃⾄成佛。\n\n> 舉⾝帶光如然燈故。⾝智光明普周稱⼤。然⼗中後七乃過去劫佛。如 何賢劫曾入殿耶。古釋有⼆。⼀約時劫相即入故。⼆約其處有麁細\n\n> 故。麁隨劫壞。細者常存。如法華天⼈⾒燒我⼟不毀。⼜梵王⾒淨⾝ ⼦⾒穢。今此天帝是⼤菩薩同梵王⾒。亦佛加故。⼆如此下結通⼗\n\n> ⽅。第⼗爾時世尊下。殿皆廣博。即⽰如意相廣殿。同處以遣局情。 亦表廓⼤慈悲等眾⽣界。⼜如來入殿。即覺智現前。忽然廣博則⾝⼼\n\n> 無際。⼗⽅已下結無盡。唯結後四前已結故\n\n### 附录五：对读简表\n（八十↔六十段次对应见 §6.1（一）·名号异译见 §6.1（二）·数量词异见 §6.1（三）·六十全本逐行照录见 §6.1′）\n\n### 附录六：存疑一览\n- 〔待核〕四十《华严》须弥／忉利段之有无与相当（§6.2）。\n- 〔未竟〕藏译 `Toh 44` 前分相当品段本机未入库（§6.3）。\n- 〔待核〕《兜沙经》与本品十佛名号之部类源流（§6.5）。\n- 〔待核〕梵字 *suāgata* 三「善来」叠用非十号次第（§2.4）。\n- 〔待核〕「⻑分十段」之「⻑」＝長·波利**質**多之「⽒」原字形保留（§6.4）。\n\n### 附录七：引用书目\n`T10n0279`（八十华严·实叉难陀译）·`T09n0278`（六十华严·佛驮跋陀罗译）·`T10n0293`（四十华严·般若译）·`T10n0280`（兜沙经）·`T1735`（澄观《华严经疏》）·`T1733`（法藏《探玄记》）·`T1732`（智俨《搜玄记》）·`X0221`（慧苑《刊定记》）·`T1739`／`X0223`（李通玄《新经论》／《合论》）。\n\n### 附录八：术语对照\n不起而升（不动而进·body用「昇」·疏用「升」）·苏迷卢／须弥／妙高·忉利／三十三天·妙胜殿／善见城·十住／发心住…。\n\n### 附录九：中英要目\nAscending to the Summit of Mount Sumeru (Huayan, ch.13) · Tāvatīmsa Palace · Ten Buddhas' Verses · Non-moving Ascent。\n\n### 附录十：图表索引\n图 〇-1 十住位·九会次第定位图·图 〇-2「不起而升」体用相即图·图 7-1 十佛名号·众集名数矩阵（§7.5）。\n\n### 附录十一：其他\n本附录四′（疏本科段全文照录）与 §6.1′（六十全本）均在 §二引文审计扫描区之外，不污 body80 逐字回源审计（程序口径·§九）。\n\n---\n\n## 九、台账（成篇自陈）\n\n**覆盖率自陈**：本品全文（卷十六·会首品）已逐段细读，§〇–§九全备。八十品界 654 CJK、六十全本、澄观疏窗 3,301 CJK（raw 4,029）均逐字回源（`T10n0279`／`T09n0278`／`T1735`）。\n\n**已成**：\n- [x] §〇 凡例（简要）＋图表导览（图 〇-1／〇-2）\n- [x] §一 概述与品题解义（含 §1.3 篇幅结构·§1.5 文本现象信度·§1.6 版本）\n- [x] §二 全文逐段细读（2.1–2.9·八单元依品界·〔L.193〕§2.13 全文逐段入文）\n- [x] §三 旁参与前接（承第二会《贤首品》·接第三会十住）\n- [x] §四 义理要点与名相（不起而升·须弥妙高·十佛名号）\n- [x] §五 注疏选要·诸家会读（5.1 澄观／5.2 法藏／5.2′智俨／5.2″慧苑／5.3＋5.3′李通玄／5.4）\n- [x] §六 文本对读与校勘（6.1 与六十对读·6.1′六十全本·6.4 校勘记）\n- [x] §七 结构分析·数据层（7.1–7.4·品界 slice 实测·〔L.193〕§7.5 四视角＋图 7-1）\n- [x] §八 附录（十一类·附录四′疏本科段全文照录）\n- [x] §九 台账\n\n**未竟**：\n- [ ] 藏译 `Toh 44` 前分相当品段逐字对勘（本机未入库·§6.3）\n- [ ] 四十《华严》须弥／忉利段相当性核验（§6.2）\n- [ ] 《兜沙经》名号部类与本品十佛之源流逐字对勘（§6.5）\n- [ ] 海云讲记于本品之逐字讲记（本机未取·不虚构）\n\n**原则自陈**：引文照 CBETA 底本原字形（繁体·异体）；引注疏注明经号与段落；会读按语用简体；存疑必标〔待核〕；推断必标〔本文判断〕；不擅改经文；异文各照底本不强统一；**不臆造对齐、不 fabrication**。\n\n〔L.193 本批·审计口径自陈〕§二 新增全引（§2.13）、§5.1 疏科长文、§6.1′ 六十全本、附录四′ 皆由 `_e13_full.py`／`_e13_inject.py` 程序化取自底本（0 手抄）；`_p9_11_audit.py` 复跑覆盖 §二–§三（0 真 miss 方收口）；§6.1′ 与附录四′ 在 §二 审计区外不污引文审计；本品「善来重出」旧误说已订正为「平文器节点重计假象·经文无重出」（§1.3·§1.5·§6.4）。\n\n**成篇识**：本篇为《华严经细读》系列第十三部、**第三会（忉利天宫·十住位）会首品**，接第十二部《贤首品》（第二会收官）之后。本品明「如来不起菩提树而昇须弥顶·帝释严殿请佛·十佛曾入此处」之法会发起序（澄观十段科·长科之首），为第三会「差别因果周·十住位」之序分，与第十四部《须弥顶上偈赞品》（重颂）分长行／偈颂之别。本品实测品界 **654 字**（短品），义理枢要在「不起而升」体用相即之法界义与十佛名号之本迹交映。\n\n---\n", "data_source": "", "data_pool": "practice", "back": {"tab": "gap", "view": "avatamsaka-studies", "label": "文献页 · 华严经学"}, "updated_at": "2026-10-27"};

// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}

}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}

</script>
