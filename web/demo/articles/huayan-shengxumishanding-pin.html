var ARTICLE = {"id": "huayan-shengxumishanding-pin", "file": "articles/huayan-shengxumishanding-pin.html", "title": "九九华严第十三品 升须弥山顶品之拼读", "title_sub": "华严经第十三品·第三会首品·差别因果周十住位之始·卷十六单品·佛不离菩提树而上昇须弥·帝释遥见佛来严殿敷普光明藏师子之座·十千庄严·善来三称请佛入殿（品界实测「善來」×3 一处三称·无重出·平文器幻影单元订正）·乐音自息·忆念昔佛·说颂赞十佛（十颂各「诸吉祥中最无上」「是故此處最吉祥」）·殿忽然广博宽容·十方同然·注疏诸家会读（澄观·法藏·智俨·慧苑·李通玄）·与六十《佛昇須彌頂品第九》对读·十佛名号多异（迦羅鳩馱／拘樓·毘舍浮／隨葉·然燈／錠光等）各照底本不统一·数据层实测八十正文 645 字（含品题 654）·未完备已标明", "icon": "📖", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第三会_忉利天宫_差别因果周/华严经细读_第十三部_升须弥山顶品.md", "doc_md": "# 华严经细读·第十三部：升须弥山顶品（卷十六·品十三）\n\n> **EN · Close Reading of the Avataṃsaka Sūtra, Part Thirteen: The Chapter of Ascending the Summit of Mount Sumeru**\n\n> **底本**：唐·实叉难陀译《大方广佛华严经》（八十华严）`T10n0279`。**范围：卷第十六·本品全文（品号第十三）**。本品属**第三会「忉利天宫会」·差别因果周之「十住位」**，为第三会**首品**，接第二会第十二品《贤首品》（十信之德）而明**从信入住、位渐昇进**。\n> **立稿**：2026-10-27（L.193 充实批）。承第一会（品 1–6·卷 1–11）、第二会（品 7–12·卷 12–15）之体例与校勘纪律；开第三会六品（品 13–18·卷 16–18）之端。\n> **本篇进度（覆盖率自陈）**：**全稿成篇**——§〇 凡例、§一 概述与品题解义、§二 全文逐段细读（序分·昇入·庄严·请佛·入殿·止音·忆念·偈赞·广博·结通）、§三 旁参与前接、§四 义理要点与名相、§五 注疏选要·诸家会读（5.1 澄观／5.2 法藏／5.2′ 智俨／5.2″ 慧苑／5.3 李通玄／5.3′ 合论／5.3″ 海云讲记旁参／5.4 小结）、§六 文本对读与校勘（八十／六十《佛昇須彌頂品第九》·四十·藏译）、§七 结构分析·数据层（含 §7.5 数科四视角）、§八 附录十一类（含中英要目·附录四′澄观疏本科段全文照录）、§九 台账，**皆已成**。〔L.193 充实批〕①§2.13 全文逐段入文（80-01–80-07·程序取自 `_e13_dump.txt`·0 手抄）②§5.1 澄观疏科长文全摘（五门·十段·`T1735` 卷第十六·raw 原字形）③§6.1′ 六十全本 25 段照录＋十佛名号对照④§7.5 数据科学四视角＋图 7-1 十佛偈赞 SVG⑤附录四′ 澄观疏本科段全文照录。凡未能确证者标〔待核〕、属推断者标〔本文判断〕；**不以骨架冒充细读**。**本品与六十《佛昇須彌頂品第九》十佛名号多异（金仙／所应断／遍一切等译名之别），各照底本不统一、不臆造对齐**。\n> **原则**：沿用既定校勘纪律、三层疏解（疏解／名相／会读）、存疑必标、推断必标「〔本文判断〕」、三译主从分明、不擅改经文、可回源可复核。**引注疏原文一律繁体照底本、逐字回源并注经号与段落；会读按语用简体。**\n\n## 〇、凡例（简要）\n\n一、**校勘底本**：以 `T10n0279`（八十华严）为底本。六十华严（`T09n0278`·本品相当者为〈佛昇須彌頂品第九〉）、四十华严（`T10n0293`）不作底本，但须品读并作对读；凡异译异说并列而不强断。\n\n二、**品读主从**：以八十华严为叙事主轴，六十为辅读与对读。主从仅指骨架取自何本，非谓其余可略。\n\n三、**疏解三层**：其下「疏解」为依经文直解；「名相」为训释与梵汉（凡无把握者标〔待核〕）；「会读」为注疏家与讲记等之判，非经证，凡引皆逐字回源。\n\n四、**引文可回源**：凡引经皆照 CBETA 底本原字形（繁体·异体），可回源可复核；凡引注疏皆注明经号与段落，无把握者标〔待核〕。**不擅改经文，亦不据听录回改底本。**\n\n五、**存疑必标**：凡未能确证者标〔待核〕；凡属本席推断者标「〔本文判断〕」；凡讲者之说疑误者只标不改。\n\n六、**文本现象与信度**：本品「善来」请佛句**经文并无重出**——平文器 dump 另列之 80-04 系将庄严段（80-03）外层 `<p>` 内嵌套节点**重复识别**而成的假象单元（前向游标重计·非另有独立段），实测品界 body80 中「善來」仅×3（一处三称），如实标识（见 §1.3、§1.5、§2.4、§6.4）；八十「十千」庄严对六十「萬種／萬寶／一萬」，为两译数量词之自然差异，不强齐（见 §六）。\n\n七、**版本差异之惯例**：凡藏译、梵本、六十／四十华严与本品的分品、用字、文段有无、内容增减之别，**悉举而比之**，注版本与信度；**严禁以「藏译云」冒充未见之原文**。\n\n八、**计数口径**：字数以剥校勘之 CJK 口径计（含品题）；句数以句末标点（。！？）计；偈颂以颂行计。本品品界实测 CJK 654（含品题），详见 §七。\n\n---\n\n<!-- ATLAS:BEGIN P13 -->\n### 〇之零、导读指南（阅读路径与方法）\n\n**定位：** 考证型细读（philological close reading），以「可复核性」为第一优先。本品为第三会之**会首**，纯是「由致」——不动一处而遍十方。读法当**以处为纲、以时为纬**：处不变而现处变，时不言而十佛自陈。\n**本品一句：** **不離菩提樹而昇須彌山頂**——八字是全品之骨；处未曾移，而十方各见，此为华严「即体即用」之第一次以「动作」说出。\n**路径：** 〇之二（二图四表）→ 一（品题与脉络）→ 二（全文逐段）→ 四（义理与名相）→ 五（诸家会读）→ 七（数据层）→ 附录按需查阅。\n**方法：** 先经文后诠释；〔实测〕／〔本文判断〕／〔存疑待核〕三分；负面证据同样入账；结构覆盖 100%，个体择要。\n**读前三问：** ① 「不離」与「而昇」何以能并存？② 全品仅 654 字，何以为一会之首？③ 十佛颂何以由近而远逆序铺陈？\n\n## 〇之二、本品内容地图（未入其门，先观其海）\n\n> **本节体例。** 图与表之数据，一律取自本文已回源核定之 §二逐段表与 §7.1／§7.5 实测数；**凡属推断者标〔本文判断〕，不入图**。图各看一事，勿求一图而尽本品。\n\n### 〇之二.0 提要\n\n本品为**全经最短诸品之一**：品界 **CJK 654**（含品题九字·正文净 645），品题＋**六个正文单元**（80-01 齐现 51・02 不離齐升 21・03 严殿 158・05 入殿乐止 60・06 十佛颂 280・07 殿广博 75）。文体为**长行五段＋偈颂一段**，颂即**十佛各一颂、每颂四句**。六十侧〈佛昇須彌頂品第九〉26 段・正文 630。澄观判第三会六品「**分為二分。初二品方便發起，後四品當會正說**」——本品居其首，**唯是由致**（纯为发起）。\n\n| 图 | 画什么 | 一句话 |\n|---|---|---|\n| **图 〇-1　不起而升·一处十方图** | 处如何不动而遍 | 此不动（菩提树下）·彼现起（须弥山顶）·十方各见 |\n| **图 〇-2　十佛颂·逆时序图** | 时如何铺陈 | 迦葉→拘那牟尼→…→然燈：由近而远，十佛各一颂 |\n\n**〔读法之序〕**　先观图 〇-1 得「一处而十方」之空间结构，次观图 〇-2 得十佛逆序之时间轴，次读〇之二.3 之坐标，然后入 §二逐段。**处与时既明，六段之短乃见其不短。**\n\n> **EN corresponding · Map of the Chapter.** The shortest of the assembly-opening chapters: 654 characters, six prose units and one block of ten verses. Its whole content is a single sentence — not leaving the foot of the bodhi tree, the Buddha ascends to the summit of Mount Sumeru — and its whole proof is a chain of ten past Buddhas who each once entered this same hall. Fig. 0-1 draws the spatial paradox; Fig. 0-2 sets the ten Buddhas on a reverse-chronological axis.\n\n### 〇之二.1 图 〇-1　不起而升·一处十方图\n\n<figure>\n<svg viewBox=\"0 0 1000 500\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"24\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">不離菩提樹而昇須彌山頂：一处不动，十方齐见</text>\n<text x=\"500\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a7a5e\">六单元之 CJK 附于段名后（§1.3 实测）；箭头所标为经文语，非本文增字</text>\n\n<rect x=\"60\" y=\"62\" width=\"880\" height=\"48\" rx=\"5\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/>\n<text x=\"500\" y=\"82\" text-anchor=\"middle\" font-size=\"12\" fill=\"#5a5147\">十方一切世界 · 一一四天下 · 閻浮提中，悉見如來坐於樹下</text>\n<text x=\"500\" y=\"100\" text-anchor=\"middle\" font-size=\"11\" fill=\"#8a7a5e\">80-01 本會齊現（51 字）——不是「此界见」，是「十方一切世界皆见」</text>\n\n<rect x=\"90\" y=\"136\" width=\"340\" height=\"86\" rx=\"5\" fill=\"#f3ecdf\" stroke=\"#c9b98f\"/>\n<text x=\"260\" y=\"160\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#7a5a28\">此 · 菩提樹下</text>\n<text x=\"260\" y=\"180\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5a5147\">摩竭提國阿蘭若法菩提場</text>\n<text x=\"260\" y=\"200\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5a5147\">本會說法處（體·不動）</text>\n<text x=\"260\" y=\"216\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8a7a5e\">80-02（21 字）</text>\n\n<line x1=\"440\" y1=\"179\" x2=\"552\" y2=\"179\" stroke=\"#b8863c\" stroke-width=\"1.4\"/>\n<path d=\"M 552 179 L 542 173 L 542 185 Z\" fill=\"#b8863c\"/>\n<text x=\"496\" y=\"168\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#b8863c\">不離</text>\n<text x=\"496\" y=\"198\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"#b8863c\">而昇</text>\n\n<rect x=\"570\" y=\"136\" width=\"340\" height=\"86\" rx=\"5\" fill=\"#f7ecd2\" stroke=\"#b8863c\" stroke-width=\"1.4\"/>\n<text x=\"740\" y=\"160\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#7a5a28\">彼 · 須彌山頂</text>\n<text x=\"740\" y=\"180\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5a5147\">帝釋妙勝殿·忉利天宮</text>\n<text x=\"740\" y=\"200\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5a5147\">第三會說法處（用·現起）</text>\n<text x=\"740\" y=\"216\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8a7a5e\">一处不动，一处现起——两处同时</text>\n\n<text x=\"60\" y=\"252\" font-size=\"11.5\" fill=\"#7a5a28\">〔本文判断〕「不離」与「而昇」不是二事之折衷，而是<tspan font-weight=\"bold\">一事之两面</tspan>：若离而去，则成行；若不昇，则无用。<tspan font-weight=\"bold\">体不动故能遍，用现起故成位。</tspan></text>\n\n<rect x=\"60\" y=\"270\" width=\"880\" height=\"72\" rx=\"5\" fill=\"#ffffff\" stroke=\"#e0d6c2\"/>\n<text x=\"76\" y=\"292\" font-size=\"12\" font-weight=\"bold\" fill=\"#7a5a28\">80-03 各見佛來·各嚴殿座（158 字）</text>\n<g font-size=\"11\" fill=\"#8a7a5e\">\n<text x=\"76\" y=\"314\">「十千」层级 ×10：十千層級 · 十千欄楯 · 十千寶網 · 十千瓔珞 …… （对六十作「萬種／萬寶／一萬」）</text>\n</g>\n<g fill=\"#c9b98f\">\n<rect x=\"76\" y=\"322\" width=\"10\" height=\"10\"/><rect x=\"92\" y=\"322\" width=\"10\" height=\"10\"/><rect x=\"108\" y=\"322\" width=\"10\" height=\"10\"/><rect x=\"124\" y=\"322\" width=\"10\" height=\"10\"/><rect x=\"140\" y=\"322\" width=\"10\" height=\"10\"/><rect x=\"156\" y=\"322\" width=\"10\" height=\"10\"/><rect x=\"172\" y=\"322\" width=\"10\" height=\"10\"/><rect x=\"188\" y=\"322\" width=\"10\" height=\"10\"/><rect x=\"204\" y=\"322\" width=\"10\" height=\"10\"/><rect x=\"220\" y=\"322\" width=\"10\" height=\"10\"/>\n</g>\n<text x=\"244\" y=\"331\" font-size=\"10.5\" fill=\"#8a7a5e\">十</text>\n<text x=\"500\" y=\"331\" font-size=\"10.5\" fill=\"#8a7a5e\">「善來」×3——一处请佛三称，非重出（§6.4 辨幻影单元 80-04）</text>\n\n<text x=\"60\" y=\"368\" font-size=\"12\" font-weight=\"bold\" fill=\"#7a5a28\">余三段（顺次而下）</text>\n<g font-size=\"11.5\" fill=\"#5a5147\">\n<rect x=\"60\" y=\"378\" width=\"200\" height=\"46\" rx=\"4\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/><text x=\"160\" y=\"398\" text-anchor=\"middle\">80-05 入殿·樂音止</text><text x=\"160\" y=\"416\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8a7a5e\">60 字</text>\n<rect x=\"280\" y=\"378\" width=\"200\" height=\"46\" rx=\"4\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/><text x=\"380\" y=\"398\" text-anchor=\"middle\">80-06 十佛偈頌</text><text x=\"380\" y=\"416\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8a7a5e\">280 字（占全品四成三）</text>\n<rect x=\"500\" y=\"378\" width=\"200\" height=\"46\" rx=\"4\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/><text x=\"600\" y=\"398\" text-anchor=\"middle\">80-07 殿廣博·結通</text><text x=\"600\" y=\"416\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8a7a5e\">75 字</text>\n<rect x=\"720\" y=\"378\" width=\"220\" height=\"46\" rx=\"4\" fill=\"none\" stroke=\"#c9b98f\" stroke-dasharray=\"5 4\"/><text x=\"830\" y=\"398\" text-anchor=\"middle\">→ 第十四品·重頌</text><text x=\"830\" y=\"416\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#8a7a5e\">本品之颂，彼品再申</text>\n</g>\n\n<text x=\"60\" y=\"452\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 全品问号 ×0、无当机请问者——「由致」之体，本不待问。与第二会光明觉品之「无问而说」，同一手法而更简。</text>\n<text x=\"60\" y=\"476\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 645 字而成一会之首：<tspan fill=\"#7a5a28\">品之轻重不在字数，在其所开之局</tspan>。此品所开者，十住三十四品之局也。〔本文判断〕</text>\n</svg>\n<figcaption><b>图 〇-1　不起而升·一处十方图。</b>一处不动而十方齐见，两处同时现起，是全品之骨。<b>「不離」与「而昇」不是折衷，是一事两面</b>：体不动故能遍，用现起故成位〔本文判断〕。下三段顺次而下，独 80-06 十佛颂占 280 字、全品四成三——<b>短品之中，最长的一段是偈</b>。<div class=\"en-line\">Fig. 0-1. One place unmoved, ten directions seeing at once. Not leaving the bodhi tree and ascending Mount Sumeru are not a compromise but two faces of one act: the essence unmoved is what allows it to reach everywhere; the function arising is what makes a stage. Six prose units, one verse block — and the verse takes 43% of a 645-character chapter.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. **先读「不離」，再读「而昇」。** 若先读「昇」，「不離」成矛盾；先立「不離」之体，则「昇」只是其用。**次序即义次。**\n2. **「十方一切世界悉见」是第一句，不是修辞。** 本品开篇即不许读者局于一处——**故此后「此殿」云云，皆当读作「一切处」**。\n3. **短品不可略过。** 645 字开十住三十四品之局；**会首之品，其职在「开」，不在「说」**。\n\n### 〇之二.2 图 〇-2　十佛颂·逆时序图\n\n<figure>\n<svg viewBox=\"0 0 1000 470\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"24\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">十佛曾入此殿：由近而远，逆时序铺陈</text>\n<text x=\"500\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a7a5e\">八十 80-06·十佛各一颂四句（CJK 280）；颂名次第悉照 `T10n0279` 卷十六</text>\n\n<line x1=\"70\" y1=\"120\" x2=\"930\" y2=\"120\" stroke=\"#c9b98f\"/>\n<path d=\"M 70 120 L 80 115 L 80 125 Z\" fill=\"#c9b98f\"/>\n<text x=\"70\" y=\"104\" font-size=\"11\" fill=\"#8a7a5e\">近（现在贤劫）</text>\n<text x=\"930\" y=\"104\" text-anchor=\"end\" font-size=\"11\" fill=\"#8a7a5e\">远（过去久远）</text>\n\n<g font-size=\"11.5\" text-anchor=\"middle\">\n<g fill=\"#5a5147\">\n<circle cx=\"100\" cy=\"120\" r=\"5\" fill=\"#b8863c\"/><text x=\"100\" y=\"146\">迦葉</text>\n<circle cx=\"190\" cy=\"120\" r=\"5\" fill=\"#b8863c\"/><text x=\"190\" y=\"146\">拘那牟尼</text>\n<circle cx=\"280\" cy=\"120\" r=\"5\" fill=\"#b8863c\"/><text x=\"280\" y=\"146\">迦羅鳩馱</text>\n<circle cx=\"370\" cy=\"120\" r=\"5\" fill=\"#c9b98f\"/><text x=\"370\" y=\"146\">毘舍浮</text>\n<circle cx=\"460\" cy=\"120\" r=\"5\" fill=\"#c9b98f\"/><text x=\"460\" y=\"146\">尸棄</text>\n<circle cx=\"550\" cy=\"120\" r=\"5\" fill=\"#c9b98f\"/><text x=\"550\" y=\"146\">毘婆尸</text>\n<circle cx=\"640\" cy=\"120\" r=\"5\" fill=\"#c9b98f\"/><text x=\"640\" y=\"146\">弗沙</text>\n<circle cx=\"730\" cy=\"120\" r=\"5\" fill=\"#c9b98f\"/><text x=\"730\" y=\"146\">提舍</text>\n<circle cx=\"820\" cy=\"120\" r=\"5\" fill=\"#c9b98f\"/><text x=\"820\" y=\"146\">波頭摩</text>\n<circle cx=\"910\" cy=\"120\" r=\"5\" fill=\"#c9b98f\"/><text x=\"910\" y=\"146\">然燈</text>\n</g>\n<g font-size=\"10\" fill=\"#8a7a5e\">\n<text x=\"100\" y=\"166\">一颂</text><text x=\"190\" y=\"166\">一颂</text><text x=\"280\" y=\"166\">一颂</text><text x=\"370\" y=\"166\">一颂</text><text x=\"460\" y=\"166\">一颂</text><text x=\"550\" y=\"166\">一颂</text><text x=\"640\" y=\"166\">一颂</text><text x=\"730\" y=\"166\">一颂</text><text x=\"820\" y=\"166\">一颂</text><text x=\"910\" y=\"166\">一颂</text>\n</g>\n</g>\n\n<rect x=\"60\" y=\"186\" width=\"880\" height=\"46\" rx=\"4\" fill=\"#f7ecd2\" stroke=\"#b8863c\"/>\n<text x=\"500\" y=\"206\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#7a5a28\">「是故此處最吉祥」×10——一一颂皆以此句结</text>\n<text x=\"500\" y=\"224\" text-anchor=\"middle\" font-size=\"11\" fill=\"#8a7a5e\">六十字侧作「是故此地最吉祥」×10：两译结句同构，唯「此處／此地」一字之异</text>\n\n<text x=\"60\" y=\"268\" font-size=\"12\" font-weight=\"bold\" fill=\"#7a5a28\">读此轴之三事</text>\n<text x=\"60\" y=\"292\" font-size=\"11.5\" fill=\"#5a5147\">① <tspan font-weight=\"bold\">金色三佛（迦葉·拘那牟尼·迦羅鳩馱）属现在贤劫</tspan>，灰色七佛属过去——<tspan font-weight=\"bold\">颂由近起，逆溯至然燈</tspan>。</text>\n<text x=\"60\" y=\"316\" font-size=\"11.5\" fill=\"#5a5147\">② 逆序非随意：<tspan font-weight=\"bold\">愈近者愈可征，愈远者愈显其久</tspan>；以「曾入此殿」为线，则时间长短皆摄于一处。</text>\n<text x=\"60\" y=\"340\" font-size=\"11.5\" fill=\"#5a5147\">③ 「此處最吉祥」之「此」，在颂中指殿；至 80-07 殿忽广博，<tspan font-weight=\"bold\">「此」遂结通十方</tspan>——空间由点而面，时间由近而远，两者同收于末段。</text>\n\n<line x1=\"60\" y1=\"360\" x2=\"940\" y2=\"360\" stroke=\"#d3c7ae\"/>\n<text x=\"60\" y=\"386\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 十佛之名与次第，依底本照录；「过去七佛」之常序（毘婆尸→尸棄→毘舍浮→拘孫→拘那含→迦葉）在此<tspan font-weight=\"bold\">全部倒转</tspan>，非本文改次。〔本文判断·据常序比对〕</text>\n<text x=\"60\" y=\"410\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 颂句「最無上」×10（次句），与结句「最吉祥」×10 成双复沓——<tspan font-weight=\"bold\">十颂之同构，正是「十住」同构之先声</tspan>。</text>\n<text x=\"60\" y=\"434\" font-size=\"11.5\" fill=\"#7a5a28\">※ 「十千」×10 表庄严，「十」表佛数：<tspan>本品以「十」为数之骨，下一品即以「十菩萨×十颂」承之。</tspan></text>\n<text x=\"60\" y=\"458\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 六十侧「善來」仅 ×1（八十 ×3），「萬」代「十千」——两译简繁之别，各照底本。</text>\n</svg>\n<figcaption><b>图 〇-2　十佛颂·逆时序图。</b>十佛沿一条由近及远的轴排列：<b>金色三佛属现在贤劫，灰色七佛属过去</b>，而十颂皆以「是故此處最吉祥」结。<b>逆序不是随意</b>：以「曾入此殿」为线，愈远者愈显其久，而时间长短皆摄于一处〔本文判断〕。至 80-07 殿忽广博，「此」遂结通十方——空间由点而面，时间由近而远，两者同收于末段。<div class=\"en-line\">Fig. 0-2. Ten Buddhas on an axis running from near to far: three of the present kalpa in gold, seven of the past in grey, each verse closing on the same line. The reversal is not arbitrary — with \"once entered this hall\" as the thread, the further back one goes the longer the span, and all of it is gathered into one place. Then the hall suddenly widens, and \"this\" opens out to the ten directions.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. **十佛不是「举例」，是「证成」。** 一一皆「曾入此殿」，故今日之入非创举，乃**旧事之重演**——此为本品以时间证空间之法。\n2. **结句复沓十次，是全品最重之句。** 「是故此處最吉祥」——**「吉祥」不在远处，即在此处**；此句一立，十住之位始有落处。\n3. **末段「殿皆广博」须与首段「十方齐见」合看。** 首以十方摄一处，末以一处摄十方——**一开一合，全品之呼吸**。\n\n### 〇之二.3 本品在第三会（忉利天宫·说十住）之坐标\n\n本品为第三会**六品之首**。澄观判第三会「**分為二分：初二品方便發起，後四品當會正說**」；本品与次品（偈赞）共为发起，而**本品「唯是由致」，偈赞一品则「義有兩兼」**。\n\n| 品 | 卷 | 位／科 | 一句提撕 | 与本品之关系 |\n|---|---|---|---|---|\n| 12 贤首（前） | 卷14–15 | 第二会·十信·德 | 717 颂行，信为道元 | 信满而入住，故有第三会 |\n| **13 升须弥山顶（本品）** | 卷16 | 第三会·十住·**发起** | 不離而昇，十佛曾入 | — |\n| 14 须弥顶上偈赞 | 卷16 | 第三会·十住·**方便发起** | 十菩萨各十颂 | 本品之颂，彼品再申 |\n| 15 十住 | 卷16 | 第三会·十住·**正说** | 十住阶位，百颂 | 本会之正说自此始 |\n| 16 梵行 | 卷17 | 第三会·十住·**胜进** | 十法推徵，离相梵行 | 位中通行 |\n| 17–18 初发心·明法 | 卷17–18 | 第三会·**满足行相** | 校量功德·十法矩阵 | 一会之终 |\n\n### 〇之二.4 本品形式特征（与邻品对看）\n\n本品之特色在**「极短而极重」**：645 字而成一会之首，全品无问、无答、无因缘铺陈，只有一事（不離而昇）与一证（十佛曾入）。**在三十九品中，以如此短幅开一会者，唯此一品**〔本文判断·据本文所核诸品篇幅〕。\n\n| 特征 | 本品表现〔实测〕 | 邻品之对照 | 读法上的后果 |\n|---|---|---|---|\n| 篇幅 | CJK 654／正文 645（全经最短诸品之一） | 第十四品 2,510；第十七品 8,207 | 同会之中，繁简相去十三倍 |\n| 文体 | 长行五段＋偈一段（十佛颂） | 第十四品纯颂群（10 lg）；第十六品纯长行 | 一会六品，文体三变 |\n| 无问无答 | 问号 ×0；无当机者 | 第十六品有正念天子问；第十八品有精进慧问 | 发起之品，不待问 |\n| 空间结构 | 一处不动·十方齐见·末段结通 | 第十四品以「三列名数」表十方 | 一以动作表，一以名数表 |\n| 时间结构 | 十佛逆序（近→远） | 第十四品无时间轴（唯「承佛威神」） | 本品以过去证现在，独擅其法 |\n| 文本幻影 | 平文器 80-04 为 80-03 嵌套节点重计（24 字） | 第十五品有 5 字短 p | 读数据层须先辨器 |\n\n### 〇之二.5 五种读法（导览）\n\n| 读法 | 路径 | 适合谁 | 得什么 |\n|---|---|---|---|\n| **处读** | 只读 80-01·02·07 三段 | 初读本篇者 | 得「一处十方」之骨 |\n| **佛读** | 只读十佛颂，参图 〇-2 之时间轴 | 欲见「证成」之法者 | 见过去佛如何证现在 |\n| **严读** | 只读 80-03 庄严段之「十千」×10 | 好名数者 | 见「十千」为满数之例 |\n| **校读** | §6.4 幻影单元辨 ＋ §6.1′ 六十全本 | 欲核文本者 | 得 645 之实与 80-04 之伪 |\n| **承读** | 本品 §2.7 → 第十四品 §2.0 | 欲见一会之起者 | 见长行如何转成全颂 |\n\n### 〇之二.6 数与位之谱：本品之数，四等分录\n\n华严之数非计数之数。本品所涉之数，来源不一，性质亦不一；**先分其等，后论其义**，则不为数目所惑。\n\n| 等第 | 数 | 出处 | 性质 |\n|---|---|---|---|\n| **T0 经文明文** | 「不離菩提樹而昇須彌山頂」 | `T10n0279` 卷十六·80-02 | 全品之骨 |\n| **T0 经文明文** | 「是故此處最吉祥」×10 | 同上·80-06 | 十颂结句（复沓） |\n| **T0 本文实测** | **654 字／645 净／6 单元** | §7.1／§7.4 脚本 | 计数（本文自测） |\n| **T0 本文实测** | 十千 ×10・最無上 ×10・善來 ×3 | §7.5 L2 | 计数（本文自测） |\n| **T1 澄观《疏》** | 「分為二分。初二品方便發起。後四品當會正說」 | `T1735` 卷十六 | 一会之科判 |\n| **T1 澄观《疏》** | 「今初一品長分十段」 | 同上 | 十段科（本文八段与之相应） |\n| **T2 六十** | 26 段・正文 630・「善來」×1・「萬」代「十千」 | `T09n0278` 卷七 | 对读（简繁之别） |\n\n> **〔读法〕** 本品之数极简：654（字）・6（单元）・10（佛）・10（十千）。**四数皆可复算，且四数各有其性质**：字数是量，单元是构，十佛是举，十千是满数之例。**最忌以「十千」为数实**——六十作「萬」，可见其为「取满」而非「计实」。\n\n<!-- ATLAS:END P13 -->\n\n## 一、概述与品题解义\n\n### 1.1 品题释义\n\n**品名**：**升须弥山顶品**（八十华严**第十三品**，唐·实叉难陀译）。全篇在《大方广佛华严经》**卷第十六**，紧接第十二品《贤首品》之后、第十四品《须弥顶上偈赞品》之前，为**第三会「忉利天宫会」之首品**。\n\n**「昇須彌山頂」**——须弥，正云**苏迷卢**（*Sumeru*），此云**妙高**（澄观《疏》：「須彌正云蘇迷盧。此云妙高」）。品题「昇」（底本作「昇」，`T10n0279` 平文器原字形），谓佛以自在力**不離菩提樹下而上昇須彌、向帝釋殿**。法藏《探玄记》释：「**佛是化主動靜無礙不去而進故云昇**」——「昇」非移动位移之昇，乃**不去而进、不起而升**之自在义（详见 §4.1、§5.2）。\n\n**「妙」十义**（澄观《疏》·`T1735`）：妙高之所以「妙」，具十义——**体妙**（四宝所成）、**相妙**（八方四级）、**色妙**（四正色·北金东银南吠琉璃西颇胝迦）、**德妙**（八方猛风不能令动）、**眷属妙**（七金山七香海围绕）、**依持妙**（唯天依住·得通者居）、**作业妙**（不離本处而镇四洲·映蔽日月成昼夜）、**生果妙**（波利质多能益天众）、**为首妙**（四洲地最在先成）、**坚固妙**（轮围中最在后坏）。高八万四千由旬，入水亦尔。**「十住之行亦復如是」**——以山体十妙况表十住位德（此为澄观圆教释，详见 §四）。\n\n### 1.2 品位与脉络（承上启下）\n\n**在华严经三十九品中之位**：第三会（忉利天宫）首品，八十华严**第十三品**，占**卷第十六**。\n\n**判位**——**法藏五分**（`T1733`）：第一会「舉果勸樂生信分」，第二至六会「修因契果生解分」——**本品（第三会首品）属「修因契果生解分」·十住位之开端**。\n\n**澄观**（`T1735`）判第三会五门：「約處名忉利天會。約人名法慧菩薩會。約法名十住會」；来意「**前信是住之方便**……**正位故次來也**」——由十信（第二会）入十住（第三会），信为住之前方便。\n\n**智俨**（`T1732`）：「此会有六品分三。初二品明方便發起。次二品明正位相。次二品明後成滿足行相」——第三会六品（P13–P18）分**方便发起／正位相／满足行相**三段，本品居「方便发起」之首。\n\n**李通玄**（`T1739`）：「此十住位中有六品經……如是六品共成十住法門」；判本品「義分為三。一釋品來意。二以處表法。三隨文釋義」——以妙峯山表法，明「從十信入十住入位之昇進」。\n\n**承上启下**：\n- **承上**：第十二品《贤首品》明十信之**德**（「信为道元功德母」），第二会六品收官；\n- **本品**：第三会开场，明**佛昇须弥、处妙胜殿、帝释请佛、偈赞十佛**之法会昇进之因缘——**从信入住、位渐昇进**之「昇处」段；十住位次正说尚在后（第十五品）；\n- **启下**：第十四品《须弥顶上偈赞品》为本品之**重颂**（附品），第十五品《十住品》方正说十住位次。\n\n**「昇」所表位次**（澄观·法藏同判）：法藏设问「何不至四天王天」，答三意——一以彼是杂鬼神天显法非胜故超过；二寄法明「十信是外凡退位、十住是內凡不退」欲表进退悬殊故越四天王处；三「若未至山頂容有進退。到山頂上即安住不退」——**以登山顶表十住位「安住不退」**，超四王天处以显位次升进〔本文判断：以处表法之判，属诸家释〕。\n\n### 1.3 篇幅与结构预览\n\n本品为**短品**。`_e13_full.py` 平文器实测：品界（昇須彌山頂品第十三→須彌頂上偈讚品第十四）**CJK 654**（含品题·与 `_p9_11_audit.py` 之 body80 口径同）。品题＋**六个正文单元**（80-01·02·03·05·06·07）。〔按·单元口径〕`_e13_dump.txt` 另列「80-04」（24 字·帝释请佛句），其 CJK **与 80-03 末句全同**、且 80-04 之定位落**在 80-03 区间之内**——系平文器 `root.iter()` 既遍历庄严段外层 `<p>`（80-03·含请佛句）、又重复识别其内层嵌套节点（80-04·即该请佛句）而成之**重计单元**，非经文另有独立段；剔此假象单元后（654＝9品题＋51＋21＋158＋60＋280＋75）恰与品界 CJK 吻合（**善來在品界仅×3·即一处请佛·无重出**）·入文（§2.13）只取六单元。偈颂为 80-06 **十佛颂**（十佛各一颂·每颂四句·通五十句），长行为 80-01·02·03·05·07。\n\n**八段结构**（依本品经文自然单元·并与澄观「今初一品長分十段」科相应）：\n\n| 段 | 单元 | 事 | 澄观十段科（`T1735`） |\n|---|---|---|---|\n| 一 | 80-01 | 十方齐现·各谓对佛 | 一本會齊現 |\n| 二 | 80-02 | 不離菩提树上昇须弥 | 二不離齊升 |\n| 三 | 80-03 | 帝释遥见佛来·庄严殿座 | 三各見佛來·四各嚴殿座 |\n| 四 | 80-03末 | 善来请佛 | 五皆來請佛 |\n| 五 | 80-05 | 世尊受请入殿·乐音止息 | 六俱時入殿·七樂音並止 |\n| 六 | 80-05 | 忆念过去善根·说颂 | 八各念昔因 |\n| 七 | 80-06 | 十佛偈赞 | 九同讚如來 |\n| 八 | 80-07 | 殿忽广博·结通十方 | 十殿皆廣博嚴淨 |\n\n澄观总判第三会六品「**分為二分。初二品方便發起。後四品當會正說**」；本品「唯是由致」（纯为发起序），偈赞一品「義有兩兼」（兼方便与所依）。\n\n### 1.4 核心要义\n\n本品虽短，义摄三枢：\n\n**一、不起而升·体用相即**。佛「不離一切菩提樹下，而上昇須彌」——昇非位移，乃**即体之用、即用之体**相即无碍。澄观立「月喻」释之，古德十义（一约处相入门…十约成法界大会门）为**十玄门之雏形**。此为全品最深之点（详见 §4.1）。\n\n**二、以处表法·位渐升进**。须弥山顶·忉利天宫·妙胜殿，皆表十住位德。山体「妙有十义」况十住行德；越四王天至山顶，表十信（退位）入十住（不退）之悬殊。\n\n**三、偈赞十佛·本迹交映**。帝释忆念过去佛所种善根，以偈赞**十佛**（迦葉·拘那牟尼·迦羅鳩馱·毘舍浮·尸棄·毘婆尸·弗沙·提舍·波頭摩·然燈），每颂结「**彼佛曾來入此殿，是故此處最吉祥**」——以过去七佛及三佛曾入此殿，显此处之胜、此法之常恒；「殿忽然廣博寬容」示如意相、廓大慈悲、觉智现前。\n\n> **EN gist**：*This opening chapter of the Third Assembly stages the Buddha's ascent—not as locomotion but as non-moving arrival (\"not leaving the bodhi tree, yet ascending Sumeru\")—to Śakra's palace, where the vastness of the hall and the ten-Buddha verse establish the doctrinal frame for the coming Ten Abodes (daśa-vihāra).*\n\n### 1.5 经文文本现象与信度标识\n\n**〔单元重计・非经文重出〕善来请佛句**：庄严段（80-03）长行末帝释「曲躬合掌……而作是言：『善來世尊！善來善逝！善來如來、應、正等覺！唯願哀愍，處此宮殿！』」——**善来请佛句在品界内仅出现一次**（实测 品界 body80 中「善來」×3・即一三称・无叠句）。`_e13_dump.txt` 之所以另列 80-04（与 80-03 末句同文），系平文器将庄严段外层 `<p>` 内之嵌套节点**重复识别**为一独立单元（前向游标假象·非经文另有重出）。信度：经文无重出之事实・不立「重出」校勘；入文（§2.13）只取庄严段 80-03 一处（§1.3·§6.4）。\n\n**〔数量词异译〕十千 vs 万**：八十庄严段（80-03）屡用「**十千**」（十千層級·十千金網·十千種帳·十千種蓋·十千繒綺·十千珠瓔·十千衣服·十千天子·十千梵王·十千光明）；六十相当段（60-002）作「**萬種／萬寶／一萬**」（萬種雜寶·萬種寶帳·萬寶網·萬種眾妙寶蓋·萬種瓔珞·萬種寶衣·一萬天子·一萬梵天·一萬光明）。「十千」即「萬」，数值同而译词异，系两译之自然现象，**不强齐、不互改**（§六·§7.3）。澄观疏据八十释：「**皆云十千者。萬行因感故**」（`T1735`）——以十千表万行之因感。\n\n**〔体例〕品题原字形**：底本 `T10n0279` 品题作「**昇**須彌山頂品第十三」（「昇」），澄观《疏》（`T1735`）疏文作「**升**須彌山頂品第十三」（「升」）——升／昇为异体，各照底本，不统一。祖典 txt 另含康熙部首码位（十山首長西·已归一），平文与锚定以 NFKD 归一处理、回原字形（§七·§八）。\n\n### 1.6 版本差异之惯例与本品之版本情况\n\n- **八十（`T10n0279`·唐·实叉难陀）**：品 13〈昇須彌山頂品第十三〉，第三会（忉利天宫·十住）首品。\n- **六十（`T09n0278`·晋·佛驮跋陀罗）**：相当品为〈**佛昇須彌頂品第九**〉（`T09n0278` juan7），品数分配与品名有异（六十三十四品）。本品与六十**有相当段**，可逐行对读（见 §6.1′），十佛名号多异译。\n- **四十（`T10n0293`·唐·般若）**：全经仅「入法界品」一品，**无相当之升须弥品**，本品不取为对读（§6.2）。\n- **藏译（`Toh 44`·Dege 45 品）**：藏本已入库（035–038）而本品相当品段**逐字对勘未做**〔未竟〕，只标分品相当之传闻，不冒充原文（§6.3）。\n**藏 18 开篇实测**〔L.220〕：德格 035 卷 fol 238a——第 18 章以经题＋**bam po 19** 起，续「**དེ་ནས་སངས་རྒྱས་ཀྱི…**」（尔时以佛〔神力〕起语；次章 19 同式开篇作「སངས་རྒྱས་ཀྱི་མཐུས」＝佛神力，足证此章界起式），与本品开篇「爾時，佛神力故」直接相应〔对应判读〔本文判断〕·逐字对勘未作；TOC 出 `data/alignment/tibetan-derge-toc.json` L.201 提取〕。\n\n\n### 1.7 核心要义小结\n\n本品以「**不起而升**」之法界义开第三会十住之门，以须弥妙高十义表十住行德，以十佛偈赞显此处此法之常恒。文虽短（CJK 654），义贯体用、处法、本迹三层；正说十住位次在第十五品，本品为之**发起序分**。诸家科判（澄观十段·智俨三分·法藏八序·慧苑五序·李通玄长科）皆归一趣：**由信入住、依佛智而显差别**。\n\n---\n\n## 二、卷第十六（升须弥山顶品第十三·本品全文）\n\n### 2.0 结构总表（据经切分）\n\n本品八个 `<p>`/`<lg>` 单元（80-00 品题 head ＋ 80-01–80-07），依 `_e13_full.py` 平文器实测。澄观《疏》「今初一品長分十段」（`T1735`），下表**左依本品经文单元、右系澄观十段科**（一段之经或跨二科、一科之别未必各成一 `<p>`，科判与经单元非严格 1:1，如实对应）：\n\n| 经单元 | 事类 | 起句（照底本） | 澄观十段科 |\n|---|---|---|---|\n| 80-01 | 齐现 | 爾時，如來威神力故…… | 一本會齊現 |\n| 80-02 | 齐升 | 爾時，世尊不離一切菩提樹下…… | 二不離齊升 |\n| 80-03 | 见佛·严殿 | 時，天帝釋在妙勝殿前遙見佛來…… | 三各見佛來·四各嚴殿座 |\n| （80-03 末） | 请佛 | 「善來世尊！……」 | 五皆來請佛 |\n| 80-05 | 入殿·止音·念昔 | 爾時，世尊即受其請，入妙勝殿…… | 六俱時入殿·七樂音並止·八各念昔因 |\n| 80-06 | 偈赞（十佛颂） | 「迦葉如來具大悲……」 | 九同讚如來 |\n| 80-07 | 广博·结通 | 如此世界中，忉利天王…… | 十殿皆廣博嚴淨 |\n\n〔按〕澄观总科：「此會六品分為二分。初二品方便發起。後四品當會正說。前中初之一品。唯是由致」——本品（初品）纯为**发起序分**；偈赞次品「義有兩兼」（一是方便·谓前品化主赴机后品助化赞佛；二是所依·谓三天说法各有偈赞）。\n\n### 2.1 序分·一本会齐现（80-01）\n\n> 爾時，如來威神力故，十方一切世界，一一四天下閻浮提中，悉見如來坐於樹下，各有菩薩承佛神力而演說法，靡不自謂恒對於佛。\n\n**疏解**：「爾時」承前第二会。佛**威神力故**，十方一切世界、一一四天下之每一阎浮提中，皆**见如来坐于树下**、各有菩萨承佛神力演说法，且各「自谓恒对于佛」——一一处各各不见其杂，各各谓佛唯对自己说法。此即**一多相容、主伴圆融**之法界现量：一佛身遍坐一切处，而各处各谓「佛恒对我」。\n\n**名相**：「四天下」＝一须弥四洲（东弗于逮·南阎浮提·西瞿耶尼·北郁单越）之一洲（南阎浮提）；「閻浮提」*Jambudvīpa*。〔待核〕梵名训释从诸家通说，本地直据疏文「一一四天下閻浮提」，不另立梵本。\n\n**会读**：澄观释「言爾時者。即前二會時。主伴齊遍演前二會之法也。今此明遍。即十重說處中第一重也。何須舉此。欲明前會不散成後會故。後必帶前。合成法界無礙會故」（`T1735`）——举「十方齐现」者，为明**前会不散、成后会**；一一诸会无休息、后后诸会皆同时（第九会十重说处·第一重）。法藏亦判此段为「體融遍周法界」之「一三世間融。二依正二融……四於諸菩薩有三業融」（`T1733` 十住会段），以主伴圆明显一乘法「一說一切說」。\n\n### 2.2 不離齐升·不起而升（80-02）\n\n> 爾時，世尊不離一切菩提樹下，而上昇須彌，向帝釋殿。\n\n**疏解**：此全品**眼目**。「不離……而昇……」——**不離**者，佛身遍法界，本来在彼菩提树下（体）；**昇**者，机缘前后，赴感现于忉利（用）。离即不离，昇即无昇，体用相即之自在义（详见 §4.1、§5.1 疏科长摘「不離齊升」段）。\n\n**名相**：「菩提樹」＝世尊成觉处（摩伽陀国尼连河畔）；「須彌」＝苏迷卢·妙高山；「帝釋殿」＝忉利天宫·善见城·妙胜殿（详见 §4.2）。\n\n**会读**：澄观「問動靜相違去住懸隔。既云不離何得言升」——广列古多释（本释迦身不起道树别起应化·不起是报升天是化·不起是法身升天是化用·不往而至不來相而來）并皆非了，**今显正义**：「然佛得菩提。智無不周體無不在。無依無住無去無來。然以自在即體之應。應隨體遍。緣感前後有住有升」，立**月喻**（澄江一月三舟共观·见月随去·停者见月不移·此月不离中流而往南北），引古德十义（处相入门…成法界大会门）决之。李通玄别判「不離菩提樹」五义（`T1739`）。〔本文判断〕此「不起而升」之十义结构，为澄观十玄门（尤其「同时相应遍」「隐密显了遍」）在升品科段之早期直证。\n\n### 2.3 各见佛来·各严殿座（80-03·庄严段）\n\n> 時，天帝釋在妙勝殿前遙見佛來，即以神力莊嚴此殿，置普光明藏師子之座，其座悉以妙寶所成：十千層級逈極莊嚴，十千金網彌覆其上，十千種帳、十千種蓋周迴間列，十千繒綺以為垂帶，十千珠瓔周遍交絡，十千衣服敷布座上，十千天子、十千梵王前後圍遶，十千光明而為照耀。\n\n**疏解**：帝释**遥见佛来**——「隣而未即故云遙見」（澄观），约佛则用从体起，约机则境从心现。即以神力**庄严此殿**，敷置**普光明藏师子之座**，座以妙宝成，**十千**层级·金网·种帐·种盖·缯绮·珠瓔·衣服·天子·梵王·光明，十段庄严周匝间列。\n\n**名相**：「普光明藏」——澄观释「此是解位智。照法空含眾德故。從信始入故有置言」；「師子之座」表十住之法门（「置師子座。表十住之法門故」）。「十千」＝一万，八十数量词（对六十作「萬」·§1.5·§六）。\n\n**会读**：澄观逐句释庄严：「文有十句。初總餘別。總云普光明藏者……別中初句約體。餘並顯嚴。皆云十千者。萬行因感故。言層級者萬行熏成故。金網防護。慈悲帳蓋以育以覆。四攝繒綺以為周垂。圓融行願交絡萬善。柔忍慚愧以覆法空第一義天。清淨梵行繞斯法體。一一智照故日光明。於生死中。遣長夜闇舉斯果德。令物行因」（`T1735`）——以殿座十严，一一配万行因感·十住行德。智俨判为「住處序·請佛序·集眾序·放光序·讚歎序」五序之前段（`T1732`）。\n\n### 2.4 皆来请佛·善来（80-03 末句）\n\n> 爾時，帝釋奉為如來敷置座已，曲躬合掌，恭敬向佛而作是言：「善來世尊！善來善逝！善來如來、應、正等覺！唯願哀愍，處此宮殿！」\n\n**疏解**：帝释为佛敷座已，曲躬合掌，请佛居殿。**请佛三称「善来」**——世尊·善逝·如来应正等觉（三德号），愿哀愍处此宫殿。〔按〕此即庄严段（80-03）之末句，**善来请佛在品界仅一处**（无重出·dump 之 80-04 系平文器嵌套节点重计假象·§1.3·§1.5·§6.4）。\n\n**名相**：「善來」*sādhu*·**svāgata**——澄观释「言善來者應機來故。不來相而來故。帶法界會來故。三稱善者喜之至故。舉三號者略歎德故。願哀處者。希仗勝田生大福故」（`T1735`）。〔待核〕梵字 *svāgata*（善来·善逝）为如来十号之一〔L.206 订正：原误作 *suāgata*，梵语连音 *su-āgata → svāgata*〕，此处三「善来」叠用系请辞语气，非十号次第。\n\n**会读**：此即澄观十段科「**五皆來請佛**」——于中「三業崇敬以為請儀」（身曲躬·口称善来·意恭敬）。法藏判此段「二爾時帝釋下嚴根欲」（严根·欲之殿为法器）·「三爾時世尊下明根緣契合」（`T1733`）。\n\n### 2.5 俱时入殿·乐音并止（80-05 上半）\n\n> 爾時，世尊即受其請，入妙勝殿；十方一切諸世界中，悉亦如是。爾時，帝釋以佛神力，諸宮殿中所有樂音自然止息，即自憶念過去佛所種諸善根而說頌言：\n\n**疏解**：世尊**受请入殿**，「十方一切诸世界中悉亦如是」——一入一切入，结通十方。帝释以佛神力，宫殿所有乐音**自然止息**，即自**忆念过去佛所种诸善根**而说颂。止音表摄散归静·得定益；忆念表寂然无思·发宿住智。\n\n**名相**：「樂音自然止息」——澄观「第七爾時下樂音止息。謂攝散歸靜得定益故」；「自憶念過去佛所種諸善根」——「第八即自下。各念昔因獲智益也。散緣既止勝德現前。寂然無思發宿住智。種善根者。即下十佛曾入此殿。聞法供養故。亦表見自心性。同昔佛故」（`T1735`）。\n\n**会读**：澄观科「六俱時入殿」（謂根緣契合成益不虛·十方如是·通上六段入殿事訖故一结通）→「七樂音並止」→「八各念昔因」，三科并在 80-05 一 `<p>` 之内（经单元与科判之不齐，如实记）。\n\n### 2.6 忆念昔因·十佛曾入（80-05 末·说颂引）\n\n**疏解**：「即自憶念過去佛所種諸善根而說頌言」——颂前标「说颂」，其所忆念者即下十佛曾入此殿之因缘。此段为 2.5（乐音止息）与 2.7（十佛颂）之**过桥**，不另起 `<p>`，故并入 80-05。\n\n**会读**：澄观「自憶念」释作发宿住智（第八段·获智益），并以「種善根者即下十佛曾入此殿」为第九段「同讚如來」张本。〔本文判断〕长行「忆念—说颂」与十佛颂之「彼佛曾来入此殿」互为能所：所忆＝能赞。\n\n### 2.7 同赞如来·十佛偈颂（80-06）\n\n> 「迦葉如來具大悲，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。……然燈如來大光明，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。」\n\n（**十佛颂全文逐颂照录见 §2.13·程序取自 `_e13_dump.txt`**；此处标举首·末二颂以示体例。）\n\n**疏解**：十佛各一颂·每颂四句·**通五十句**。句式一律：初句标佛名别德（「迦葉如來具大悲」……「然燈如來大光明」），次句「諸吉祥中最無上」通叹，三句「彼佛曾來入此殿」叙本迹，末句「是故此處最吉祥」结处。以十佛**曾入此殿**，显此殿之胜、此说之常恒。\n\n**名相·十佛**（依 80-06 序·澄观梵汉训·`T1735`）：\n\n| 序 | 佛名（八十） | 别德（八十句） | 澄观训名（`T1735`） | 六十对应名（60-004…） |\n|---|---|---|---|---|\n| 一 | 迦葉 | 具大悲 | 飲光（身光蔽余光·悲光饮蔽邪光） | 迦葉·具大慈 |\n| 二 | 拘那牟尼 | 見無礙 | 金仙／金寂（寂故无碍·金故明见） | 拘那牟尼·慧無礙 |\n| 三 | 迦羅鳩馱 | 如金山 | 所應斷（已断如金·已净如山） | **拘樓**·佛身如金山 |\n| 四 | 毘舍浮 | 無三垢 | 遍一切／遍胜（无三垢故自在超胜） | **隨葉**如來·離三垢 |\n| 五 | 尸棄 | 離分別 | 持髻／有髻（无分别智处心顶·髻中明珠） | 尸棄如來·常寂然 |\n| 六 | 毘婆尸 | 如滿月 | 四翻（净观·胜观·胜见·遍见·如月圆智满） | 毘婆尸佛·如滿月 |\n| 七 | 弗沙 | 明達第一義 | 增盛（明达胜义是增盛） | 弗沙·明達第一義 |\n| 八 | 提舍 | 辯無礙 | 度說（说法度人·辩才无碍即能说） | 提舍如來·辯無礙 |\n| 九 | 波頭摩 | 淨無垢 | 赤蓮華（身心如莲华净无尘垢） | 波頭摩佛·淨無垢 |\n| 十 | 然燈 | 大光明 | 舉身帶光（如然灯·身智光明普周称大） | **錠光**如來·明普照 |\n\n〔按·名号异译〕三·四·十位**名号两译迥异**（拘樓↔迦羅鳩馱·隨葉↔毘舍浮·錠光↔然燈），别德句亦有「具大**悲**↔具大**慈**」「見無礙↔**慧**無礙」「離分別↔常寂然」「大光明↔明普照」之异——各照底本·**不强定一名之对应、不臆造对齐**（§六·§7.3）。\n\n**会读**：澄观「第九迦葉下。同讚如來。然三世諸佛。皆於此處說十住法。獨讚十者。表說十住及無盡故。所以讚者義乃有四。一十佛曾處則殿勝可居。二互舉一德例讚本師。三敘昔善根慶遇堪受。四昔佛同說表法常恒」（`T1735`）。又疑难：「十中後七乃過去劫佛。如何賢劫曾入殿耶。古釋有二。一約時劫相即入故。二約其處有麁細故。麁隨劫壞。細者常存。如法華天人見燒我土不毀」（`T1735`·`T1733` 同辨）。\n\n### 2.8 殿皆广博·结通无尽（80-07）\n\n> 如此世界中，忉利天王以如來神力故，偈讚十佛所有功德；十方世界諸釋天王，悉亦如是讚佛功德。爾時，世尊入妙勝殿，結跏趺坐。此殿忽然廣博寬容，如其天眾諸所住處；十方世界，悉亦如是。\n\n**疏解**：结通——此界忉利天王偈赞十佛，**十方世界诸释天王悉亦如是**。世尊入殿结跏趺坐，**此殿忽然广博宽容**，如其天众诸所住处；十方世界悉亦如是。一殿不容转身，忽然广博容受一切——**事事无碍·广狭自在**之法界现量。\n\n**名相**：「廣博寬容」——澄观「第十爾時世尊下。殿皆廣博嚴淨。即示如意相广殿。同處以遣局情。亦表廓大慈悲等眾生界。又如來入殿。即覺智現前。忽然广博則身心無際。十方已下結無盡」（`T1735`）。\n\n**会读**：智俨判为「結類十方成法界會」段·「六化成中有三。初處坐。二辨用相。三等言通餘方也」（`T1732`）。〔本文判断〕本品首（80-01 十方齐现）尾（80-07 结通无尽·殿广博）以「十方……悉亦如是」回环呼应，构成一多相即之闭合结构（详见 §7.5 L3 拓扑）。\n\n### 2.13 品全文逐段入文〔L.193 本批·全量入文〕\n\n以下依 `_e13_full.py` 平文器单元序列（品界 `T10n0279` 卷十六·逐字（`_e13_full.py` 平文器·§7.4 品界 slice 口径）·@100269–100923·CJK654 含品题／正文净 645·真六正文单元 80-01·02·03·05·06·07），**逐字照录全文·0 手抄**；`_e13_dump.txt` 另列之幻影 80-04（平文器嵌套节点重计·系 80-03 请佛句尾重复）·经注入器 assert 确认其在 body80 内非独立段·不取（§1.3·§6.4）。段块题依澄观长科十段（§5.1）。\n\n**（品题）80-00**\n\n> 昇須彌山頂品第十三\n\n**（一·一本會齊現）80-01〔CJK51〕**\n\n> 爾時，如來威神力故，十方一切世界，一一四天下閻浮提中，悉見如來坐於樹下，各有菩薩承佛神力而演說法，靡不自謂恒對於佛。\n\n**（二·不離齊升）80-02〔CJK21〕**\n\n> 爾時，世尊不離一切菩提樹下，而上昇須彌，向帝釋殿。\n\n**（三·各見佛來·四·各嚴殿座·五·皆來請佛）80-03〔CJK158〕**\n\n> 時，天帝釋在妙勝殿前遙見佛來，即以神力莊嚴此殿，置普光明藏師子之座，其座悉以妙寶所成：十千層級逈極莊嚴，十千金網彌覆其上，十千種帳、十千種蓋周迴間列，十千繒綺以為垂帶，十千珠瓔周遍交絡，十千衣服敷布座上，十千天子、十千梵王前後圍遶，十千光明而為照耀。爾時，帝釋奉為如來敷置座已，曲躬合掌，恭敬向佛而作是言：「善來世尊！善來善逝！善來如來、應、正等覺！唯願哀愍，處此宮殿！」\n\n**（六·俱時入殿·七·樂音並止·八·各念昔因）80-05〔CJK60〕**\n\n> 爾時，世尊即受其請，入妙勝殿；十方一切諸世界中，悉亦如是。爾時，帝釋以佛神力，諸宮殿中所有樂音自然止息，即自憶念過去佛所種諸善根而說頌言：\n\n**（九·同讚如來·十佛偈頌）80-06〔CJK280〕**\n\n> 「迦葉如來具大悲，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。拘那牟尼見無礙，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。迦羅鳩馱如金山，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。毘舍浮佛無三垢，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。尸棄如來離分別，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。毘婆尸佛如滿月，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。弗沙明達第一義，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。提舍如來辯無礙，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。波頭摩佛淨無垢，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。然燈如來大光明，諸吉祥中最無上，彼佛曾來入此殿，是故此處最吉祥。」\n\n**（十·殿皆廣博·結通無盡）80-07〔CJK75〕**\n\n> 如此世界中，忉利天王以如來神力故，偈讚十佛所有功德；十方世界諸釋天王，悉亦如是讚佛功德。爾時，世尊入妙勝殿，結跏趺坐。此殿忽然廣博寬容，如其天眾諸所住處；十方世界，悉亦如是。\n\n〔按〕80-06 十佛偈颂五十句全引（十佛各一颂·每颂四句·通结「是故此處最吉祥」×10）；本品唯长行（80-01·02·03·05·07）＋此十佛颂（80-06），**重颂归第十四品《须弥顶上偈赞品》**（附品·P14·§3.2）。入文各单元之 CJK 已 assert 为 body80 连续子串（回源即此品界 slice·`_p9_11_audit.py` 复跑覆盖 §二）。\n\n---\n\n### 2.9 小结\n\n本品八段·一序分（齐现·齐升）→三发起（见佛·严殿·请佛）→三入殿事（入殿·止音·念昔）→一赞（十佛颂）→一结（广博·结通）。文短而科密（澄观十段），义归**不起而升·以处表法·本迹交映**三枢。正说十住位次在第十五品，本品唯为**发起序分**。\n\n---\n\n## 三、旁参与前接\n\n### 3.1 前接（第十二品《贤首品》·第二会收官）\n\n第二会《贤首品》（P12·`articles/huayan-xianshou-pin.html`）明十信之**德**·纯偈颂叹德（「信为道元功德母」）；本品为第三会首品，**从信入住**——澄观来意判「前信是住之方便……正位故次來也」（`T1735`）。二会界：贤首品第十二→升须弥山顶品第十三（`T10n0279` 卷十五末→卷十六）。〔本文判断〕由第二会之「三业遍周」转第三会之「位渐升进」，叙事重心从「佛德遍满」转「行者位次」，本品以法会昇处承此转。\n\n### 3.2 后接与同会续品\n\n- **次品**《须弥顶上偈赞品第十四》（P14·须弥山顶·L.194 批次）——本品 80-06 十佛长行颂之**重颂**（附品·偈赞体），「欲顯三賢皆依佛智有差別故」。\n- **同会六品**（P13–P18）：升须弥山顶（发起）→须弥顶上偈赞（重颂）→十住（正位）→梵行→初发心功德（满足行）→明法（会末）。依用户既定决策**六品各自独立成篇**；智俨三分（方便发起／正位相／满足行相）、澄观二分（初二方便·后四正说）科判并见 §5。\n\n### 3.3 旁参\n\n- **第十五品《十住品》**：本品所表「十住位」之正说处（发心住·治地住…法住），十住位次天然十数矩阵，为 L.195 批次主项。\n- **第一会《世主妙严品》·忉利天主**：须弥山顶·三十三天·帝释（憍尸迦·释提桓因·因陀罗·能主）会众之前现（`T1735`「釋又四名」·李通玄`T1739`同）。善财童子于妙峯山顶见德云比丘（`T1739`·澄观引），表十住初心·与本处以山表法互映。\n\n---\n\n## 四、义理要点与名相\n\n### 4.1 不起而升·体用相即之法界义\n\n本品首义在 80-02「**不離一切菩提樹下，而上昇須彌**」一句。此句设一表面上相违之语法：「不離」（不动·体）与「昇」（升进·用）并置。三家会读皆就此辨：\n\n- **澄观**（`T1735`）：立「**正义**」——「然佛得菩提。智無不周體無不在。無依無住無去無來。然以自在即體之應。應隨體遍。緣感前後有住有升」，以**月喻**（澄江一月·三舟共观·月不离中流而随舟南北）显**体遍而应别**；并引**古德十义**（处相入门·相入处遍·一切即一·一即一切·约佛身·约佛自在不思议解脱·缘起相由门·法性融通门·表示显法门·成法界大会门），判此十义中「前五玄门·次四所以·后一总意」，**十义相参而立**，为十玄雏形。〔本文判断〕澄观于此明「四对」（此处彼处·此身彼身·若去若住·若一若多）相即无碍，是其「六相十玄」体系在升品之具体落点。\n- **法藏**（`T1733`）：「**不起此而坐行相即**」八义（处即入门·佛身遍法界·时九世十世·法界门·缘起坐行相即…），明「**佛是化主動靜無礙不去而進故云昇**」；破古人三释（重化身·法身坐道树·不往而至）皆「乖文意」，以「即体之应应随体遍」结。\n- **李通玄**（`T1739`）：「不離菩提樹」五义，以处表法，归于「創生如來智慧之家為真佛子·不可以有為生滅尋思觀察及多聞心想攀攬所得」。\n\n**义理判语**：「不起而升」非神通变异之两全，而是**华严性起·体用无二**之表述——佛菩提身即遍法界（故无所不至·无需「起」），而缘感有前后（故就机现「升」）。此即 80-01「靡不自謂恒對於佛」与 80-07「此殿忽然廣博寬容」两端之中间律：**一多相即·广狭无碍**〔本文判断〕。\n\n### 4.2 依处立名·须弥妙高与忉利天宫\n\n- **须弥**（苏迷卢·妙高）：山名，四宝所成（东金·西银·南颇梨·北马瑙·澄观作「北金东银南吠琉璃西颇胝迦」·方位异说各照其本〔待核〕），高八万四千由旬，入水亦尔，独出九山故称高。**妙有十义**（体·相·色·德·眷属·依持·作业·生果·为首·坚固·澄观 `T1735`），一一况十住行德。\n- **忉利天**（Trāyastriṃśa·三十三天）：居须弥山顶，中央帝释宫（善见城），四面各八埵，三十二天辅弼，并释为三十三。李通玄：「天帝釋在其上居寶宮殿……三十三天。總以帝釋為主」。**妙胜殿**（普光明藏师子座所在）即帝释宫内之殿。\n- **以处表法**：何故在天、何故越四王天至山顶？——法藏三意（显法非胜·表进退悬殊·到顶安住不退）·澄观「表位漸增不處人間。顯位清淨故居天也」。〔本文判断〕处所之择，全为「十住位」不退之表法，非地理。\n\n### 4.3 十佛名号·本迹交映\n\n80-06 十佛颂列过去十佛，一一「曾来入此殿」。其名义（澄观梵汉训·详见 §2.7 表）与「后七乃过去劫佛如何贤劫曾入殿」之难（时劫相即·处有粗细·法华我土不毁喻）为科段枢要。十佛序贯「**具大悲…大光明**」德号，结以「**是故此處最吉祥**」——**以迹（曾入）显本（此处说十住法之常恒）**。〔本文判断〕十佛数取「十」，与十住位之「十」相应（澄观「表說十住及無盡故」），非关史实次第。\n\n### 4.4 名相表\n\n| 名相 | 梵／巴 | 训释 | 出处 |\n|---|---|---|---|\n| 须弥·苏迷卢 | *Sumeru* | 妙高·四宝所成 | 澄观 `T1735` |\n| 忉利天 | *Trāyastriṃśa* | 三十三天·居山顶 | 李通玄 `T1739` |\n| 帝释·憍尸迦·因陀罗 | *Śakra / Kaśyapa / Indira* | 天帝释·能主（四名） | 澄观 `T1735` |\n| 善见城·妙胜殿 | — | 帝释宫城·正殿 | 慧苑 `X0221` |\n| 普光明藏师子座 | — | 解位智·照法空含众德 | 澄观 `T1735` |\n| 由旬 | *yojana* | 里数（高八万四千由旬） | 法藏 `T1733` |\n| 阎浮提 | *Jambudvīpa* | 南洲·四天下之一 | 80-01 |\n| 十住（daśa-vihāra） | — | 不退位·第三会所明 | 澄观来意 |\n\n### 4.5 小结\n\n本品义理三层：**体用**（不起而升·月喻十义）、**处法**（须弥妙高十义·越天表不退）、**本迹**（十佛曾入·此殿最吉祥）。三皆归一——**十住位以佛智为本、依信而入住**；本品为其序分发起。\n\n---\n\n## 五、注疏选要（诸家会读）\n\n> 本节凡引疏皆照祖典底本原字形（繁体·康熙部首依 NFKD 归一锚定·切片文本部首码位归一（L.199））逐字回源，注经号与段落。**§5.1 澄观疏科长文全摘（五门·十段）由 `_e13_inject.py` 程序取自 `T1735` 卷第十六本科段，见下。**\n\n### 5.1 澄观《大方广佛华严经疏》（`T1735`）——「升须弥山顶品第十三」段（卷第十六）\n\n澄观判本品依**五门分别**：**来意·释名·宗趣·释文**（疏科四门·判会五门之目）。以下各门撮其要，**科长文全摘附于本节末**。\n\n**〔来意〕**：先辨会来——「前信此解。義次第故。又答十住問」；「**前信是住之方便**……**正位故次來也**」；品来——「前品說信究竟。此品趣後說住。故次來也」。\n\n**〔释名〕**：会名三门——「約處名忉利天會。約人名法慧菩薩會。約法名十住會」；品名「須彌正云蘇迷盧。此云妙高。如來以自在力不起覺樹。應機現彼故云升也」。**妙有十义**（体·相·色·德·眷属·依持·作业·生果·为首·坚固），高八万四千由旬，「十住之行亦復如是」以山况住；观心释「三昧須彌寂然不動……本覺如來。升法須彌之頂」。\n\n**〔宗趣〕**：约会「以十住行德為宗。攝位德果為趣」；约品「以嚴處請佛赴感為宗。根緣契合說法為趣」。\n\n**〔释文·总科〕**：「**此會六品分為二分。初二品方便發起。後四品當會正說**。前中初之一品。唯是由致。偈讚一品義有兩兼……**今初一品長分十段**：一本會齊現·二不離齊升·三各見佛來·四各嚴殿座·五皆來請佛·六俱時入殿·七樂音並止·八各念昔因·九同讚如來·十殿皆廣博嚴淨也。」\n\n**〔释文·别释枢要〕**：「不离齐升」段破古多释·立月喻·引古德十义（详见 §4.1）；庄严段「皆云十千者萬行因感故」；请佛段「言善來者應機來故」；同赞段「十佛曾處則殿勝可居·互舉一德例讚本師·敘昔善根慶遇堪受·昔佛同說表法常恒」·难「后七过去佛如何贤劫曾入」以「时劫相即·处有粗细」释；广博段「示如意相·廓大慈悲·觉智现前」。**判教**：「何故三賢獨有斯旨……此三人天隔越故須連帶」（带前起后之九会判）。\n\n**〔L.193 本批·疏科长文全摘〕**（`T1735` 卷第十六「升須彌山頂品第十三」本科段·NFKD 1:1 重锚·引文照 raw 原字形·跨行连读剥空白·分页符剔除·窗 CJK 3301·raw @210566–214593·原档康熙部首码位已归一正字（L.199））\n\n*甲·五门分别·来意（前信是住之方便·答十住问·品来赴后说住）*：\n\n> 「初來意者。先辨會來。前信此解。義次第故。又答十住問總有二段。前信是住之方便。此明正位故次來也。二品來。前品說信究竟。此品趣後說住。故次來也。二釋名」\n\n*乙·释名（忉利天会／法慧菩萨会／十住会·苏迷卢妙高·妙有十义·高八万四千由旬·观心三昧须弥）*：\n\n> 「二釋名。亦先辨會名。約處名忉利天會。約人名法慧菩薩會。約法名十住會。皆依主釋。二品名。須彌正云蘇迷盧。此云妙高。如來以自在力不起覺樹。應機現彼故云升也。表位漸增不處人間。顯位清淨故居天也。若天表淨何獨妙高。妙有十義。如於法故。一者體妙謂四寶所成。二者相妙。謂八方四級。三者色妙謂四正色。北金東銀南吠瑠璃西頗胝迦。一切草木鳥獸等物。隨所至處則同其色。自常不變。四者德妙。謂八方猛風不能令動。五眷屬妙。謂七金山七重圍繞。及七香海海印旋流。六依持妙。唯天依住。得通者居。七作業妙。不離本處而鎮四洲。映蔽日月而成晝夜。八生果妙。謂波利質多能益天眾。九為首妙。於四洲地最在先成。十堅固妙。於輪圍中最在後壞。高者高八萬四千由旬。入水亦爾。下據金剛上隣空界。頂上縱廣量亦如之。獨出九山故稱高也。十住之行亦復如是。聞思修解而為妙體。四德八聖以為妙相。四辯為色令物解同。雖同眾音自智不變。八法不動而為妙德。七支奉戒金山圍繞。七識流轉而為海印。第一義天依持而住。可以神會非情能升。不離本處遍應十方。映蔽佛口及菩薩月。而成涅槃生死晝夜。生教行果而為妙樹。世界初成菩薩先出。為眾生現種種資具。世界將壞菩薩後沒。為說上定令免三災。高者具成八萬四千諸度法門。自在障外為眾生故。入生死海。亦具八萬四千諸度法門。據金剛性隣勝義空。又智入佛慧必窮其底。德超方便逈出群峯。為顯十住功德妙高。是故須升妙高山頂。四王處半旁而非正。表住不退異信輕毛。故越彼天居妙高頂。善財童子於妙峯山頂見德雲者。亦表斯位彌顯有由。然上所釋皆圓教意。故下發心品云。應知此人即與三世諸佛同等。與三世佛功德平等。得如來一身無量身。纔發心時。即為十方一切諸佛共所稱歎。不可同於方便教說。若約觀心妙高者。謂三昧須彌寂然不動。無思無心不收不攝。任性而定稱本心地。入佛智海湛然不遷。是妙法樂觸境自在。合本性淨。是四德寶而自莊嚴。斯則本覺如來。升法須彌之頂。三宗趣者」\n\n*丙·宗趣（十住行德为宗·摄位德果为趣·严处请佛赴感为宗·根缘契合说法为趣）*：\n\n> 「三宗趣者。先約會以十住行德為宗。攝位德果為趣。二品以嚴處請佛赴感為宗。根緣契合說法為趣。四釋文者」\n\n*丁·释文·总科＋长科十段名目（此会六品分为二分·初二方便发起后四正说·今初一品長分十段）*：\n\n> 「四釋文者。此會六品分為二分。初二品方便發起。後四品當會正說。前中初之一品。唯是由致。偈讚一品義有兩兼。一是方便。謂前品化主赴機。後品助化讚佛。主伴圓備方演法故。二是所依。謂三天說法各有偈讚。欲顯三賢皆依佛智有差別故。離如來智無自體故。獨為方便甚抑讚詞。行向二會同此科判。今初一品長分十段。一本會齊現。二不離齊升。三各見佛來。四各嚴殿座。五皆來請佛。六俱時入殿。七樂音並止。八各念昔因。九同讚如來。十殿皆廣博嚴淨也。言爾時者」\n\n*戊·段一 本會齊現（言爾時即前二会时·十重说处第一重·带前起后·印文同时前后遍）*：\n\n> 「言爾時者。即前二會時。主伴齊遍演前二會之法也。今此明遍。即十重說處中第一重也。何須舉此。欲明前會不散成後會故。後必帶前。合成法界無礙會故。一一諸會無休息故。後後諸會皆同時故。若散前會即無後故。所以唯約覺樹會者。此為本故。得佛處故。理實第二亦同此遍。若同時遍。何有九會前後。若有前後何名同時。應云即用之體同時頓遍。即體之用不壞前後。猶如印文。第二爾時下」\n\n*己·段二 不離齊升（不起而升辨·破古多释·月喻「澄江一月三舟共觀」·法慧偈·毘盧十身·古德十义＝十玄雏形）*：\n\n> 「第二爾時下。明不離覺樹各升釋天。問動靜相違去住懸隔。既云不離何得言升。古有多釋。一云。本釋迦身不起道樹。別起應化以升天上。一云。不起是報升天是化。一云。不起是法身升天是化用。並非文意。以此文中俱是毘盧遮那十身雲故。一云。以去即非去故名不起。非去即去是以升天。如不來相而來等。若爾但是升相離故。非是樹下別有不起之身。故不可也。有云。此佛神通同體業用。即住是去去即是住。住是體遍去是用應。應是體應。雖升後而不離前。體是應體。雖不離前而升後。若爾何殊第三師。不起是法。又以住釋於不起。而言住是體遍。何得獨住菩提樹耶。升天何得非體遍耶。菩提樹下寧非用耶。今顯正義。然佛得菩提。智無不周體無不在。無依無住無去無來。然以自在即體之應。應隨體遍。緣感前後有住有升。閻浮有感見在道樹。天宮有感見升天上。非移覺樹之佛。而升天宮故云不離覺樹。而升釋殿。法慧偈云。佛子汝應觀如來自在力。一切閻浮提皆言佛在中。此不離也。我等今見佛住於須彌頂。此而升也。文理有據。更以喻顯。譬猶朗月流影遍應。且澄江一月三舟共觀。一舟停住。二舟南北。南者見月千里隨南。北者見月千里隨北。停舟之者見月不移。是為此月不離中流而往南北。設百千共觀八方各去。則百千月各隨其去。諸有識者曉斯旨焉。古德釋此。略有十義。一約處相入門。以一處中有一切處故。是故此天宮等。本在樹下。故不須起。然是用彼故說升也。二亦約相入門。以一處入一切處故。樹遍天中亦不須起。欲用天宮表法升進。故云升也。三由一切即一故。天在樹下。四由一即一切樹在天上。不起等準前。五約佛身。謂此樹下身。即滿法界遍一切處。則本來在彼不待起也。機熟令見故云升也。是故如來以法界身常在此。即是在彼。六約佛自在不思議解脫。謂坐即是行住等。在此即在彼。皆非下位測量故也。七約緣起相由門。八約法性融通門。九約表示顯法門。十約成法界大會門。然此十解前五玄門。次四所以。後一總意。欲成十義相參而立。雖似雜亂不違經宗。並可用也。然此中相望有四對。法相即無礙。一此處彼處。二此身彼身。三若去若住。四若一若多。約處此處彼處相即無礙。應如十中前四。約身相即無礙。應如五六及前正顯。又十中後四通於身處。約處唯有此彼。約身更加去住。謂此身即是彼身。去身即是住身。若身若處俱通一多。上來諸法同在一時。無前後也。一多相望應成四句。一不離一切樹下升一天宮。即如今文。二不離一樹升一切天。三不離一切樹而升一切天。經云十方世界悉如是故。四不離一樹下而升一天。經中欲顯一多相即。故舉初句。升釋天既爾升餘天亦然。如後二會升天既爾。往餘處亦然。復應樹樹相望而成二句。謂不離一樹下常在一切樹。不離一切樹而常在一樹。復應以不起餘處。類不起樹下。展轉相望皆悉周遍。不壞前後自在難思。又既一處有一切處亦有微細義。所用不同有隱顯義。若加前時後時有十世義。唯見說住。及於餘法有純雜義。後後帶於前前有帝網義。此天望餘成主伴義。十玄具矣。問帶前起後事理應齊。何故三賢獨有斯旨。答顯異義故。謂初二會相隣接故。不假帶前。此三人天隔越。故須連帶。又此三會同詮賢位。六已入證不假帶前。第七即位中普賢居然不假。第八頓彰五位體用已融。第九唯明證入體用一味故。並皆不假。第三時天帝下」\n\n*庚·段三 各見佛來（约佛用从体起·约机境从心现·隣而未即故云遙見）*：\n\n> 「第三時天帝下。明各見佛來。約佛則用從體起。約機境從心現。隣而未即故云遙見。第四即以下」\n\n*辛·段四 各嚴殿座（严根欲之殿为法器·置师子座表十住法门·文有十句·皆云十千者萬行因感）*：\n\n> 「第四即以下。各嚴殿座。表嚴根欲之殿為法器故。置師子座。表十住之法門故。文有十句。初總餘別。總云普光明藏者。此是解位智。照法空含眾德故。從信始入故有置言。別中初句約體。餘並顯嚴。皆云十千者。萬行因感故。言層級者萬行熏成故。金網防護。慈悲帳蓋以育以覆。四攝繒綺以為周垂。圓融行願交絡萬善。柔忍慚愧以覆法空第一義天。清淨梵行繞斯法體。一一智照故日光明。於生死中。遣長夜闇舉斯果德。令物行因。下行向中。約位漸增表法無異。第五爾時帝釋下」\n\n*壬·段五 皆來請佛（三业崇敬为请仪·言善來者應機來故·不來相而來·三稱善者喜之至）*：\n\n> 「第五爾時帝釋下。請佛居殿。於中三業崇敬以為請儀。言善來者應機來故。不來相而來故。帶法界會來故。三稱善者喜之至故。舉三號者略歎德故。願哀處者。希仗勝田生大福故。第六爾時下」\n\n*癸一·段六 俱時入殿（根缘契合成益不虚·十方如是）*：\n\n> 「第六爾時下俱時入殿。謂根緣契合成益不虛。十方如是。通上六段入殿事訖。故一結通。下四段文殿中之事。第七爾時下」\n\n*癸二·段七 樂音並止（摄散归静得定益）*：\n\n> 「第七爾時下樂音止息。謂攝散歸靜得定益故。第八即自下」\n\n*癸三·段八 各念昔因（获智益·种善根即下十佛曾入此殿·表见自心性同昔佛）*：\n\n> 「第八即自下。各念昔因獲智益也。散緣既止勝德現前。寂然無思發宿住智。種善根者。即下十佛曾入此殿。聞法供養故。亦表見自心性。同昔佛故。第九迦葉下」\n\n*癸四·段九 同讚如來（三世佛皆於此處說十住法·独赞十表说十住及无尽·十佛名号梵汉训释·难后七过去佛以时劫相即处有粗细释）*：\n\n> 「第九迦葉下。同讚如來。然三世諸佛。皆於此處說十住法。獨讚十者。表說十住及無盡故。所以讚者義乃有四。一十佛曾處則殿勝可居。二互舉一德例讚本師。三敘昔善根慶遇堪受。四昔佛同說表法常恒。文中先明此界後辨結通。今初十頌。各上半標名讚德。上句別下句通。下半以人結處。唯初一句諸佛不同。然佛別名多因德立。讚者取德以釋上名。初迦葉者此云飲光。若從姓立示生彼族。若就佛德。一者身光蔽餘光故。二者悲光飲蔽邪光故。拘那牟尼舊曰金仙。亦云金寂。寂故無礙。金故明見。迦羅鳩馱者。具云迦羅鳩村馱。此云所應斷。已斷如金已淨。如山不動。亦可見無礙者。是此佛德。如金山者是前佛德。毘舍浮者。亦云毘濕婆部。毘濕婆者。此云遍一切也。部者自在也。亦云遍勝無三垢。故無不自在而超勝也。三垢者。現種及習。尸棄亦云式棄那。此云持髻。亦云有髻。無分別智最為尊上。處心頂也。又髻中明珠即無分別也。毘婆尸者此翻有四。謂淨觀。勝觀。勝見。遍見。如月圓。智滿是遍見也。魄盡惑亡是淨觀也。既圓且淨。是勝觀勝見也。弗沙亦云勃沙。此云增盛。明達勝義是增盛也。提舍亦云底沙。西域訓字底邏那。此云度也。沙是皤沙。此云說也。謂說法度人。或但云說。辯才無礙者即能說也。波頭摩者。此云赤蓮華。身心如蓮華淨無塵垢。然燈者。智論云。此佛從初現生。乃至成佛。舉身帶光如然燈故。身智光明普周稱大。然十中後七乃過去劫佛。如何賢劫曾入殿耶。古釋有二。一約時劫相即入故。二約其處有麁細故。麁隨劫壞。細者常存。如法華天人見燒我土不毀。又梵王見淨身子見穢。今此天帝是大菩薩同梵王見。亦佛加故。二如此下結通十方。第十爾時世尊下」\n\n*癸五·段十 殿皆廣博（示如意相广殿·同处以遣局情·廓大慈悲等众生界·如来入殿觉智现前·结无尽）*：\n\n> 「第十爾時世尊下。殿皆廣博。即示如意相廣殿。同處以遣局情。亦表廓大慈悲等眾生界。又如來入殿。即覺智現前。忽然廣博則身心無際。十方已下結無盡。唯結後四前已結故」\n\n### 5.2 法藏《大方广佛华严经探玄记》（`T1733`）——「十住会·升须弥山顶」段（卷十四）\n\n法藏判第三会名「**十住會。約處名忉利天會**」；释品题「**佛是化主動靜無礙不去而進故云昇**」·须弥四宝·高八万四千由旬·帝释三十三天·「**約處表法明十住成位不退勝故居山頂也**」。**来意**「答前十住問故·前已明信今顯依信起解·前信但是位前方便。方便既滿。正位顯彰」。**宗趣**「約人謂化主及助化各有體相用·約法謂十住教義以平等法界為體·十住行位為相」。 **释文**「就此會中有六品分二　初二明方便發起即序分　餘四品是當會正宗」·初品为**如来应感序**（明果德备）·次品**集众光赞序**（明因德圆）。**不起而升八义**（处即入门·佛身遍法界·时九世十世·法界门·缘起坐行相即·…）详 `T1733` 十住会段。〔按〕法藏此段与澄观月喻十义同源而异科（法藏八义·澄观十义），并记不裁。\n\n**〔L.193 本批·法藏 T1733 直引〕**（`T1733`·十住会·释名来意宗趣释文·不起而升八义段·NFKD 归一锚定·raw @144555 起·CJK-only 坐标回映·分页符剔除·原档康熙部首码位已归一正字（L.199）·照原分行不转写不断句·本直引在 §二 审计区外·锤命中 1 处取首现·回源即此祖典）：\n\n> 約處名忉利天會。准釋可 知。二品名者。佛是化主動靜無礙不去而進故云昇。昇至何處。謂須\n\n> 彌頂須彌此云妙高山。謂以四寶所成故云妙。謂東面黃金西白銀南頗 梨北馬瑙。餘山唯金故非妙。獨出九山故云高。高八萬四千由旬。縱\n\n> 廣正等。亦名安明山。頂者山巔也。謂此山頂中央有帝釋宮。四面各 有八埵如臺。去釋三由旬中別有宮城。三十二天輔弼帝釋。并釋有三\n\n> 十三也。今趣釋宮故云頂也。約處表法明十住成位不退勝故居山頂 也。即從人用及處三義立名。問何不在人間說耶。答為顯行位漸昇進\n\n> 故。又表成位離染故居天也。問何不至四天王天。答有三意。一以彼 是雜鬼神天顯法非勝故超過也。二為寄法以十信是外凡退位十住是內\n\n> 凡不退。欲表進退懸殊故越四天王處也。三若未至山頂容有進退。到 山頂上即安住不退。是故越彼山腹處天至此頂處以表法也。\n\n> 二來意亦二。初會來者一答前十住問故。二前已明信。今顯依信起解 故次來也。三前信但是位前方便。方便既滿。正位顯彰故次來也。二\n\n> 品來者前品辨信究竟。今將赴後位故來也。 三宗趣亦二。初會宗亦二。先約人謂化主及助化各有體相用。約住準\n\n> 之。二約法謂十住教義義中以平等法界為體。十住行位為相。應教所 詮為用。教中以六決定為體。十住不同為相。益機為用。相即無礙準\n\n> 上思之。二品宗者以嚴處請佛如來赴感為宗。 四釋文者就此會中有六品分二　初二明方便發起即序分　餘四品是當\n\n> 會正宗。 前中二初品是如來應感序明果德備。後品明集眾光讚序明因德圓。即\n\n> 顯十住位中具因果宗圓備故也。前中三。初辨化緣。二爾時帝釋下嚴 根欲。三爾時世尊下明根緣契合。初中二。先體融遍周法界。後明用\n\n> 融。謂不動而進。前中初一句明體融所由謂佛力也。下明融遍之相。 於中十方各一一閻浮等者。是上光明覺品所辨。十方各乃至不可說不\n\n> 可說虛空法界等世界中皆有菩提樹下盧舍那佛。各與海會菩薩眾并與 文殊師利乃至賢首等悉各說法。以諸會眾各不雜故云自謂在也。今並\n\n> 同時集眾各昇本界天上而不離本處也。若約小乘三乘等中說經施化。 但論在某處等。無此一說一切說等。今欲明一乘法。即主伴圓明故法\n\n> 如此也。於中一三世間融。二依正二融。三於正報中有三寶相融謂說 種種為法寶。菩薩為僧。對如來故。四於諸菩薩有三業融。謂顯現是\n\n> 身。說法為語。自謂為意。問何須集此者。答欲明具主伴。凡一法起 必具一切故。問何故皆以菩提樹為本。答以是得法初處故。又是覺門\n\n> 故。 第二用融中初一句用融所由。次不起等正明用相。此中不起此而昇彼\n\n> 者。古人三釋。一云本釋迦身不起道樹別起應化以昇天上。若依此釋 昇天之身是重化身。既非深妙。恐乖文意。一云不起是法身。昇天是\n\n> 化用。此恐非理。豈可法身坐道樹耶。一云此昇天是不往而至。以往 即不往故。所以不起也。不往即往故。所以昇天也。如不來相而來名\n\n> 善來等。若依此釋但是無昇相而昇天。非是樹下有不起之身故亦難 用。今解此文略有八義。一約處即入門。謂以一處中有一切處故。是\n\n> 故此天宮等即本來在彼樹王下中。故云不起也。然先未用此天宮處。 今欲於中說法用故說為昇也。又相即故不起也。門別故有昇也。二約\n\n> 佛謂此坐樹王下之佛身即遍法界一切處故。是故佛身本來在彼忉利等 處故不待起也。今欲用此忉利門中之佛故曰昇也。是故若起即不成昇\n\n> 也。三約時謂由此樹下座上佛身即遍前後際等九世十世一切時故。是 故此佛坐樹下時昇天。去時到天處時。一一時皆遍法界攝前後際盡。\n\n> 即知坐樹下時永無起時法云不起也。若正去時亦如此。故唯有去無餘 也。皆念念不相至。各各收法界。如是緣起門無礙恒不雜。四約法界\n\n> 門謂此昇去無自性故即攝真如法界。以彼樹下坐等亦不異真故。同真 如在去門顯顯故。不起而昇也。五約緣起門謂坐由行故坐。坐在於行\n\n> 中。行由坐故行。行在於坐中。是故由行中坐故昇天即不起也。由坐 中行故不起而昇天也。行坐無礙故即昇常坐。即坐恒昇故也。六約佛\n\n> 不思議德謂即不起此坐即是行即是臥即是住。即是到一切處。即是作 一切事。並非下地所知。七約所表謂表前位行成究竟堅固不壞故云不\n\n> 起前座。而有赴機用故云昇也。八約成會謂後會必具前故不捨前而成 後。若捨則壞緣起。是故不起前而昇後也。\n\n> 第二嚴根欲中遙見佛來者。約佛用從體起。約機境從心現故也。於中 二。先嚴座表相\n\n### 5.2′ 智俨《华严经搜玄分齐通智方轨》（`T1732`）——第三会六品科（卷三·搜玄记）\n\n智俨判会来意「信故解也……既報體成已。次須起化赴機故來也」；**六品分三**「初二品明方便發起。次二品明正位相。次二品明後成滿足行相」——与澄观二分（初二·后四）略异（智俨三分·初二/次二/后二）。**住处序**立**五序**「一住處序。二請佛序。三集眾序。四放光序。五讚歎序。若通下住品即八序（入定·加·劝·起定）」·严具文分二·请佛表欲·偈文有三（忆本行·偈赞·结通十方）·化成有三（处坐·辨用相·等通余方）。此为**贤首以前**华严科判之早期形态，于本品结构分析尤资。\n\n**〔L.193 本批·智俨 T1732 直引〕**（`T1732`·妙高·六品分三·住处序五序段·NFKD 归一锚定·raw @32620 起·CJK-only 坐标回映·分页符剔除·原档康熙部首码位已归一正字（L.199）·照原分行不转写不断句·本直引在 §二 审计区外·锤命中 1 处取首现·回源即此祖典）：\n\n> 頂者居勝尊上也。 問何故此下四會在天說者。答德行位成。除障淨勝故在天說耳。此答\n\n> 前十住位問也。 二來意。何故來者信故解也。此初辨會來意。又何故會來。既報體成\n\n> 已。次須起化赴機故來也。因此略料簡教興所表。今諸會但不捨離本 處。即表起行成報體堅固不移也。而往諸會即表起用隨機。此釋約修\n\n> 行體。若望生解起信門即顯行位增微耳。又解文中約佛起用赴機以解 者即善知識力也。若約分位等解者即約自修行解也。可思准之。又此\n\n> 會已下四會並位相增。與前信行少別。於三乘一乘法義亦須交絡。思 准之。餘會並同此意。品來者前說信法已。次辨赴後說所依處耳。\n\n> 三宗者。約會分別有二。一約人。二約法。人有化主及助化。各有體 德用。但局此會。二約法者。謂十解法。後當辨耳。約品宗者。若依\n\n> 利他時現處及供養。即顯法緣。若約自利時此即機感相應。機緣體用 成也。\n\n> 四辨文。此會有六品分三。初二品明方便發起。次二品明正位相。次 二品明後成滿足行相。初二品分二。初起用隨物。二帝釋遙見下辨機\n\n> 感相應。前文有二。初辨依正二融。即顯前體淨。二復顯後用淨。自 在無礙成事之本也。諸會有文。並同此釋耳。但進勝異也。問此文何\n\n> 故不在初會後。乃在後會前。答若初會後。即但顯說法利益義明。與 後化用體義不顯。故在後會前辨耳。餘會同此。何故不在第一會後。\n\n> 料簡為前會兼餘義意在彼釋。後第六七八會亦顯別有餘義意耳。體中 身口意三也。二爾時世尊下彰用應物。即用淨也。餘相可知。第二相\n\n> 應文有五序。一住處序以動靜無礙無處不至。為此說法德也。二請佛 序。三集眾序。四放光序。五讚歎序。若通下住品即八序。謂入定加\n\n> 勸及起定也。又約品分文亦好也。初住處序及請序有六。一見佛來用 從實起。即發心緣。二即於妙勝殿下明天主嚴供養故請佛。具顯從解\n\n> 成法供養行。即成根也。三世尊即受赴感施化。釋音寂然表息亂應真 也。五說偈下表從定發慧。六佛昇坐下正明化用事成相。嚴具文分\n\n> 二。初嚴具即成根也。二請即成欲也。初嚴中有三。初總。次嚴坐 具。三結。二爾時帝釋下明其請佛。即表欲也。偈文有三。一憶本\n\n> 行。二偈讚。三結通十方。六化成中有三。初處坐。二辨用相。三等 通餘方也。\n\n> 菩薩雲集品第十 四門同上。\n\n> 一釋名。菩薩者是人。雲者潤益故。又齗齶貌也。集者聚集。妙勝等 者別處也。\n\n> 二來意者。何故來。辨處已次明集眾。 三集眾歎德順法為宗。\n\n> 四辨文者。此文有三序。一集眾。二放光。三歎佛。今此下三會集眾 何故不在初品。復何故一一方各有十。又放光下何以不漸集眾。答前\n\n> 會位相未成。但顯行圓故在初品說。今此行位具成。同彰行位利潤益 故共在此品也。所以一一方具十者欲顯解相分明圓融數等一方即一切\n\n> 方也。所以此放光下不漸集眾者。欲顯行位圓成無有增減之相故也。 於中別有增減。義用上准成即得也。上下應可准思之。上第一會釋集\n\n> 眾光者亦是准義。初為後則耳。初集眾序內有二。初指方辨數。此中 一一方者。或通上會。或不通上。信行又不成位相。為此不通。下三\n\n> 會位顯。故通義也。二其世下列名耳名有三。初明十方佛土菩薩。三 種世間即為二也。二此諸佛神力下明集諸菩薩有三。淨行雲集依方坐\n\n> 可知。三如此世界下結類十方成法界會。佛同名月者依月起光故。清 涼故。解法准之。菩薩同名慧者解之始故。足指放光者表立解位不退\n\n> 故有二可知。三讚歎序文有十菩薩。相生次第歎。解相明白耳可知。 一法慧偈有二。初長行生起。二正偈頌下並准之。此文有二。初七牒\n\n> 眾明是佛力所成。即結前品中六段義。次三明勝行者得見佛餘莫知 者。即通讚前難思。下諸人偈並約理成也。二一切慧偈有六。初三明\n\n> 謂見之徒不見真佛。次三顯解無生法身常現。次一明取著者失。次一 明慧解者益。次一明解佛因緣成即離癡惑。次一推功在本。三勝慧偈\n\n> 有六。初三明妄取者失。次一明有解者德。次一約法辨觀益。次三推 功在佛。次一能淨慧者見法身。次一推功在本。四功德慧偈有五。初\n\n> 四明迷者失。次一示勝方便。次三明得法性益。次一歎佛利生方便。 次一推功在本。五精進慧偈有三。初一彰失。次一辨德。次八廣辨觀\n\n> 式獲益相。八\n\n### 5.2″ 慧苑《续华严经略疏刊定记》（`X0221`）——第三会释名科\n\n慧苑四门同前·**释名**立会名四目「须弥山顶会·三十三天会·妙胜殿会·十住会」；苏迷卢妙高·善见城即妙胜殿·依《俱舍》量化九山；**机感＋德渐增**释越四王天；来意·宗趣·释文六品长科三；判**本会圆遍九重遍**（十重说处）·「同时前后遍」难（法界体用·印中字）·「毗卢严华藏＝严无尽刹海」。〔按〕慧苑《刊定记》为澄观《疏》之所破亦之所承，本会科判与澄观十段大合而名目小异。\n\n**〔L.193 本批·慧苑 X0221 直引〕**（`X0221`·释名四目·苏迷卢妙高·本会圆遍九重遍段·NFKD 归一锚定·raw @118973 起·CJK-only 坐标回映·分页符剔除·原档康熙部首码位已归一正字（L.199）·照原分行不转写不断句·本直引在 §二 审计区外·锤命中 7 处取首现·回源即此祖典）：\n\n> 將釋此品。四門同前。 初釋名中二。先顯得名。後辨釋名。先得名者。梵本中名如來光明網\n\n> 能覺悟品。謂佛足下輪網相中放光。還名光網。照十方佛會。覺悟菩 薩。令發意來此故。\n\n> 釋名者。如來是能放光主。光明網是所放光體。能覺悟是光業用。此 斷如來之光明網依主。或有財。簡菩薩等故。是佛所有故。光明網之\n\n> 能覺悟。亦通兩釋。曾音聲等覺悟故。光明有此覺業故。若總言如來 光明網覺悟之品。唯依主也。\n\n> 二來由者。略由二義。一由答前八問故來。謂一佛放光照遍法界。此 答威德如日威光。一舉能現一切事物。二光所現剎。答開示之意遍歷\n\n> 諸句。三光現剎中有佛菩薩。答剎莊嚴。四文殊說法顯佛功德及真實 理。答佛性。五光所覺悟諸來菩薩。各於本剎淨修梵行。答佛剎清\n\n> 淨。六諸來菩薩本剎金色乃至平等色等。其中有依體立名者。答剎體 性也。如以金為體名金色金剛為體名金剛色等。七諸來菩薩本剎各各\n\n> 別別成。名體亦異。此答剎成就。八光所照剎中。皆有百億如來成正 覺。此答佛大菩提。亦可眾見世尊。遍空世界中。皆坐蓮華藏師子\n\n> 座。是答佛住。佛知大眾心念請 已\n\n> 。各隨其類為現神通令眾皆見。是 答佛威德。餘如前說。\n\n> 二顯前二品名諦別遍。即是此品融遍故來也。謂前所明名諦一切方遍 一切。今此品明佛及眾會。一即一切前後共顯。是故來也。\n\n> 三宗趣者。以佛光照一切剎中菩薩為宗。覺悟彼諸菩薩令來此為趣。 宗趣門中但說宗趣。不煩強說餘法。\n\n> 四釋文者。此中光處照所大數有二十六節。於中前九別顯。後十七同 辨。則為十段。此非二十六度放光。亦非一放。而次第巡照。但一放\n\n> 光同時頓照盡空世界。然以言不並彰。說有前後。又為引機入法。令 漸覩見故。說有二十六節也。\n\n> 就初段中二。先明佛以身光照現事境令眾目覩。後爾時一切處文殊下 智光讚述令眾悟法。或此智光之言。但是分文。非顯經稱。經名如來\n\n> 光故。今正文 殊\n\n> 菩薩門故。前中二。初顯能照之光。後照此下明所照 之境。前中文云足輪下者。謂足下輪相中也。足下放光表三義故。一\n\n> 涉達所因起自足下。時行萬行信為至初。為表說信故此放光也。二信 望後住最為至劣。足下於身獨為至卑。表說劣門故此放也。三表為本\n\n> 所依之義。謂身能步涉依足下為本。將詣菩提。信為根本。故此放 也。下文云信為道元功德母。智度第九云足下放光者。身得住處。皆\n\n> 由於足。與此得也。言百億光明者。顯光數也。以所照世界雖無邊 限。然彼悉與娑婆世界及密訓等。是得類剎皆有百億四天下等為所照\n\n> 境。是故光明亦放百億。 二所照境中二。先照現本剎染淨等事。二如此處下現自法會普遍之\n\n> 相。前中三。初總標。次百億閻浮下別顯。後其中下通結。初中照是 能照光。此三千等是所照境。然此界量諸說不同。若依真諦部異執記\n\n> 云。以一四天下為一數。從此一數至十。十至百。百至千。是小千世 界。三倍小千。為三千。謂一倍至十小千。二倍至百千。三倍至千\n\n> 千。此為三千世界也。又作三倍增。以為大千。謂一倍至三千。二倍 至百三千。三倍至千三千。此為大千世界也。若依長阿含第十八云。\n\n> 千日月。千須彌山。千四天下六欲天。千梵天。是名小千世界。千小 千名中千世界。千中千界名三千大千世界。雜阿含第十六。亦得此\n\n> 說。若依俱舍十一。釋有二義。初明依處分量。後正明三千大千。言 處量者。彼云夜摩等天宮依處量有幾。有餘師說。此上四天依處量同\n\n> 妙高山頂。有餘師說。上倍倍增。有餘師言。初靜慮地宮殿依處等一 四州。第二靜慮等小千界。第三靜慮等中千界。第四靜慮等大千界。\n\n> 有餘師言。下三靜慮如次。量等小中大千。第四靜慮量無邊際。言三 千者。彼云齊何量小中大千。頌曰。四大州日月。蘇迷慮欲天。梵世\n\n> 各一千。名一小千界。此小千千倍。說名一中千。此千倍大千。皆同 一成壞。順正理三十一。大同俱舍。然說三千大千。唯至梵天故。彼\n\n> 云聖教唯說至梵世故。依大乘中。亦諸異。雜集第六。佛地第六。瑜 伽第二。智度皆同。前引長阿含等。若依顯揚第一。大意同前。然說\n\n> 三千世界三灾所壞。故知初禪小千。二禪中千。三禪大千。若依金光 明。三千世界遍無色界。彼云是諸仁王。手擎香爐。供養經時。其香\n\n> 遍布。於一念頃。遍至三千大千世界百億日月乃至百億非想非非想 天。若依此經。唯至第四靜慮。故次下云照百億色究竟天。問此上諸\n\n> 說。何者為定。 答若約至教定量。則此經為定。若依各隨機說。則一切皆定。\n\n> 二別顯中三。初辨照現人中。次百億菩薩下明照現八想。後有百億須 彌下照現欲\n\n### 5.3 李通玄《新华严经论》（`T1739`）——昇须弥山顶品第十三段\n\n李通玄判「此十住位中有六品經……如是六品共成十住法門」·释此品**义分为三**（释品来意·以处表法·随文释义）。以处表法段详叙妙峯山（七重金轮围山·七重大海·出水高八万四千由旬·四宝所成·上有四埵·四八三十二·中心名妙高顶·帝释居宝宫殿）·天帝释四名（天帝释·憍尸迦·释提桓因·因陀罗·能主）·善财童子于妙峯山得「憶念諸佛智慧光明門」·**长科十段**（与澄观十段同趣）·「不離菩提樹」五义。李氏以「创生如来智慧之家为真佛子」归宗·主**表法**一路，与澄观法藏之性起辨相映。\n\n**〔L.193 本批·李通玄 T1739 直引〕**（`T1739`·六品共成十住法门·义分三·以处表法·妙峯山段·NFKD 归一锚定·raw @181176 起·CJK-only 坐标回映·分页符剔除·原档康熙部首码位已归一正字（L.199）·照原分行不转写不断句·本直引在 §二 审计区外·锤命中 1 处取首现·回源即此祖典）：\n\n> 此十住位中有六品經。一昇須彌山頂品。二頂上偈讚品。三十住品。 四梵行品。五初發心功德品。六明法品。如是六品共成十住法門。\n\n> 將釋此品。義分為三。一釋品來意。二以處表法。三隨文釋義。 一釋品來意者。明前於普光明殿人間地上成十信之心已終。此妙峯之\n\n> 頂。明從十信入十住入位之昇進故。此品須來。 二以處表法者。明此山於七重金輪圍山。七重大海之內。出水高八萬\n\n> 四千由旬。縱廣亦爾。四寶所成。東面黃金。西面白銀。南面頗梨。 北面瑪瑙。上有四埵。埵有八部天眾。四八三十二。中心名妙高頂。\n\n> 天帝釋在其上居寶宮殿。通為帝釋天。三十三天。總以帝釋為主。釋 有四名。一名天帝釋。二名憍尸迦。三名釋提桓因。四名因陀羅。大\n\n> 意名能主。為能為諸天作主故。此妙峯山四寶合成。諸天寶宮殿在上 莊嚴故。為妙峯山。此山之外七重金山。及七重大海。廣量金翅鳥兩\n\n> 翼相去三十三千六萬里。此經無文未知何教所說。峻疾能飛一鼓翼萬 萬九千里。七日七夜方至其頂。其山在大海之中。形如腰鼓。崒然高\n\n> 聳。非以手足攀攬之所能蹬。為表此十住法門創生如來智慧之家為真 佛子。不可以有為生滅尋思觀察及多聞心想攀攬所得故。以將妙峯山\n\n> 用況表之。令後人倣學。山者高勝義故。此像十住住佛所住法身妙智 慧海故。是出世高勝義故。妙峯山者。不動義。諸天所居妙樂義莊嚴\n\n> 義。像此位菩薩以方便三昧寂然不動。無思無心不收不攝。任性而 定。稱平等理與法身合。忽然妙慧從此定生。無始無明總無所得。住\n\n> 佛妙慧都無所依。得法妙樂智慧莊嚴。出過情見。諸佛所說解脫微妙 經典無不解了。為生在如來智慧家故。三界無明一時頓盡。唯有習氣\n\n> 煩惱漸漸以法治之。如下十住品云。佛子。菩薩住處廣大與法界虛空 等。佛子。菩薩住三世諸佛家故。又如初發心功德品云。應知此人即\n\n> 與三世諸佛同等。即與三世諸佛如來境界平等。即與三世諸佛如來功 德平等。得如來一身無量身究竟平等真實智慧。纔發心時即為十方一\n\n> 切諸佛所共稱歎。乃至振動一切世界。及一切世界中示現成佛等。如 文廣明。不可同於三乘方便教說地前三賢菩薩得折伏現行無明初地見\n\n> 道。為此經法教門依一切諸佛根本不動智而發心故。以乘如來一切智 乘而發心故。於此十住位中能與如來同智慧故。不同三乘但將三空觀\n\n> 且折伏現行。於此經中發心之者。從佛不動智而發菩提心。設有餘習 還以無依住智治之。還是本智。不伏不斷為本寂用自在故。無體可斷\n\n> 故。無可伏故。設修三昧任性淨故。亦無取攝亦不伏捺故。任自淨 故。設行分別任性智慧隨事用為。亦無取捨故。如是任法調治習氣使\n\n> 稱理智。令慣習增明。如佛願行而隨事世間。成長大悲不出不沒故。 以心境一真無出沒故。是故經中以阿脩羅王等表之。處大海而不出不\n\n> 沒等喻。 問曰。何故不昇四天王宮。而超至帝釋。\n\n> 答曰。為四天在妙峯山半傍住。非是可表昇法頂至相盡處現智慧莊嚴 住不退故。善財童子。於妙峯山得憶念諸佛智慧光明門。同此位故。\n\n> 准例可知。以超情塵之跡。以山表之。非要蹬山也。以入如來智慧。 於眾中堪為主導故。非要帝釋也。\n\n> 三隨文釋義中。義分為三。一長科一品。二明如來身行遍周等印。如 下文經云。十方一切諸佛世界中悉亦如是。明十方一切妙峯山總見如\n\n> 來昇妙峯山頂。三隨文釋義。一長科一品者。於此品中長科為十段。 一從爾時已下三行經。明佛神力普現十方。二爾時已下一行半經。明\n\n> 佛不離菩提樹下而昇帝釋天宮。三時天帝已下可七行經。明帝釋遙見 佛來嚴殿敷座。四曲躬合掌已下兩行經。明帝釋請佛入殿。五爾時世\n\n> 尊已下三句經。是如來受請入殿。六十方一切世界已下三句經。是結 十方普會同此。七爾時帝釋已下可一行半經。明佛神力樂音自息。八\n\n> 即自憶念已下四句。明帝釋自念過去善根說頌歎佛來此。九如此世界 中已下兩行半經。都結此處以偈歎佛。十方同然。十爾時已下可兩行\n\n> 經。明如來處座而坐其殿廣博寬容。并結十方同此。三隨文釋義者。 云不離菩提樹者。明菩提體無去來遠近處所可離可到故。又如來智身\n\n> 無表裏體遍周故。又法界非大小毫剎相容故。又心境無二相無中邊方 所故。又諸法無自性一多恒圓滿故。帝釋遙見佛來者有二義。一事。\n\n> 二表法。一事者。為如來於無去來性示去來之相故言遙見。二表法 者。明帝釋示同未悟不見如來智身遍周與心一體故言遙見佛來。故又\n\n> 信解為遙見自心入位為佛來。帝\n\n### 5.3′ 李通玄《华严经合论》（`X0223`）——升须弥山顶品（合论本）\n\n合论（`X0223` 卷…）于本品兼录**【经】全文**与**【論】十段科**（经偈全文＋论科），为《新华严经论》之会要重编·文与 `T1739` 相表里。〔按〕本地直据 `_e13_sources.txt` 收割窗口（`X0223` @297497·六品共成十住法门·三分·长科十段），不另转写。\n\n**〔L.193 本批·李通玄合论 X0223 直引〕**（`X0223`·【論】六品共成·三分·【經】全文＋【論】长科十段·NFKD 归一锚定·raw @297552 起·CJK-only 坐标回映·分页符剔除·原档康熙部首码位已归一正字（L.199）·照原分行不转写不断句·本直引在 §二 审计区外·锤命中 1 处取首现·回源即此祖典）：\n\n> 六品共成十住法門將釋此品義分為三 一釋品來意二以處表法三隨文釋義一釋品來意者明前於普光明殿人間\n\n> 地上成十信之心 已\n\n> 終此妙峯之頂明從十信入十住入位之昇進故此品須 來二以處表法者明此山於七重金輪圍山七重大海之內出水高八萬四千\n\n> 由旬縱廣亦爾四寶所成東面黃金西白銀南吠琉璃北瑪瑙上有四埵埵有 八輔天眾四八三十二中心名妙高頂天帝釋在其上居寶宮殿通為帝釋天\n\n> 三十三天總以帝釋為主帝釋有四名一名天帝釋二名憍尸迦三名釋提桓 四名因陀羅大意名能主為能為諸天作主故此妙峯山四寶合成諸天寶宮\n\n> 殿在上莊嚴故為妙峯山此山之外七重金山及七重大海廣量金翅鳥兩翼 相去三百三十六萬里迅疾能飛一鼓翼萬萬九千里七日七夜方至其頂其\n\n> 山在大海之中形如腰鼓崪然高聳非以手足攀攬之所能登為表此十住法 門創生如來智慧之家為真佛子不可以有生滅尋思觀察及多聞心想攀攬\n\n> 所得故以將妙峯山用況表之令後人倣學山者高勝義故像此十住住佛所 住法身妙智慧海故是出世高勝義故妙峯山者不動義諸天所居妙樂義莊\n\n> 嚴義像此位菩薩以方便三昧寂然不動無思無心不收不攝任性而定稱平 等理與法身合忽然妙慧從此定生無始無明總無所得住佛妙慧都無所依\n\n> 得法妙樂智慧莊嚴出過情見諸佛所說解脫微妙經典無不解了為生在如 來智慧家故三界無明一時頓盡唯有習氣煩惱漸漸以法治之如下十住品\n\n> 云佛子菩薩住處廣大與法界虗空等佛子菩薩住三世諸佛家故又如初發 心功德品云應知此人即與三世諸佛同等即與三世諸佛如來境界平等即\n\n> 與三世諸佛如來功德平等得如來一身無量身究竟平等真實智慧纔發心 時即為十方一切諸佛所共稱歎乃至震動一切世界及一切世界中示現成\n\n> 佛等如文廣明不可同於三乘方便教說地前三賢菩薩得折伏現行無明地 上見道為此經法教門依一切諸佛根本不動智而發心故以乘如來一切智\n\n> 乘而發心故於此十住位中能與如來同智慧故不同三乘但將三空觀且折 伏現行於此經中發心之者從佛不動智而發菩提心設有餘習還以無依住\n\n> 智治之還是根本智不伏不斷為本寂用自在故無體可斷故無可伏故設修 三昧任性淨故亦無收攝亦不伏捺故任自淨故設行分別任性智慧隨事用\n\n> 為亦無取捨故如是任法調治習氣使稱理智令慣習增明如佛願行而隨事 世間成長大悲不出不沒故以心境一真無出沒故是故經中以阿脩羅王等\n\n> 表之處大海而不出不沒等喻問曰何故不昇四天王宮而超至帝釋宮答曰 為四天王在妙峯山半傍住非是可表昇法頂處至相盡現智慧莊嚴住不退\n\n> 故善財童子於妙峯山得憶念諸佛智慧光明門同此位故准例可知以超情 塵之跡以山表之非要登山也\n\n> 已 入如來智慧於眾中堪為主導故非要為帝\n\n> 釋也第三隨文釋義中義分為三一總科一品二明如來身行徧周等印如下 經云十方一切諸世界中悉亦如是明十方一切妙峯山總見如來昇妙峯山\n\n> 頂三隨文釋義。 【經】爾時如來威神力故十方一切世界一一四天下閻浮提中悉見如來\n\n> 坐於樹下各有菩薩承佛神力而演說法靡不自謂恒對於佛爾時世尊不離 一切菩提樹下而上昇須彌向帝釋殿時天帝釋在妙勝殿前遙見佛來即以\n\n> 神力莊嚴此殿置普光明藏師子之座其座悉以妙寶所成十千層級迥極莊 嚴十千金網彌覆其上十千種帳十千種蓋周迴間列十千繒綺以為垂帶十\n\n> 千珠纓周徧交絡十千衣服敷布座上十千天子十千梵王前後圍遶十千光 明而為照耀爾時帝釋奉為如來敷置座\n\n> 已 曲躬合掌恭敬向佛而作是言善\n\n> 來世尊善來善逝善來如來應正等覺唯願哀愍處此宮殿爾時世尊即受其 請入妙勝殿十方一切諸世界中悉亦如是爾時帝釋以佛神力諸宮殿中所\n\n> 有樂音自然止息即自憶念過去佛所種諸善根而說頌言。 迦葉如來具大悲\n\n> 諸吉祥中最無上 彼佛曾來入此殿\n\n> 是故此處最吉祥 拘那牟尼見無礙\n\n> 諸吉祥中最無上 彼佛曾來入此殿\n\n> 是故此處最吉祥 迦羅鳩馱如金山\n\n> 諸吉祥中最無上 彼佛曾來入此殿\n\n> 是故此處最吉祥 毗舍浮佛無三垢\n\n> 諸吉祥中最無上 彼佛曾來入此殿\n\n> 是故此處最吉祥 尸棄如來離分別\n\n> 諸吉祥中最無上 彼佛曾來入此殿\n\n> 是故此處最吉祥\n\n### 5.3″ 海云继梦讲记旁参（玄谈段·只标不改）\n\n- 讲记 ep10 §A01（七處九會研議·十處判）于术语表记第三處忉利天宮：\"這個地方開始就講行法了\"——讲者以**行**字点第三会之开，于理解本会「十住」法门之整体方向可为旁参〔讲师玄谈·非正行〕〔⚖宏观架构语·非文本科判〕。\n- 讲记 ep11 §A10–A11（玄谈段第三会分）：\"智首所問於第三會開頭・就是以四品經（為首）\"，列\"十住品・梵行品・初發心功德品・（明法品）為首\"、\"這個四品從漸教解門的立場來講起步\"——讲者口诵科判自十住品起数，**未及先此之《升须弥山顶》《须弥顶上偈赞》二序品**，只存其缺〔⚖品名次第係玄谈段口诵科判·待 Ep13+ 依 `T10n0279` 品目核〕。\n- 本品**正行段逐字讲记**：讲记正行段（ep13–15）未及第三会〔正行讲记·未上架·待补〕；讲者之说疑误只标不改、不入经文疏解（编务总则）。\n\n### 5.4 诸家对读小结\n\n| 家 | 科判 | 处所义 | 不起而升 | 会名 |\n|---|---|---|---|---|\n| 澄观 `T1735` | 六品**二分**·本品**十段** | 妙有十义况住·观心三弥 | 月喻·古德**十义**（十玄雏形） | 忉利天／法慧／十住会 |\n| 法藏 `T1733` | 六品**分二**（初二序·余四正宗） | 成位不退故居山顶 | **八义**（不去而进） | 十住／忉利天会 |\n| 智俨 `T1732` | 六品**分三**（方便/正位/满足） | 住处序五序（八序） | 赴机起化 | 会来意·报体成已 |\n| 慧苑 `X0221` | 六品长科三·本会圆遍九重遍 | 越四王·机感德增 | 印中字·同时前后遍 | 山顶／三十三／妙胜殿／十住会 |\n| 李通玄 `T1739` | 六品共成·义分**三**·长科十段 | 妙峯山四宝表法 | 不离菩提树五义 | 十住法门 |\n\n**异同**：五门／四门／三分／二分／十段，名目虽殊，**皆以「从信入住、位渐升进、依佛智显差别」为宗**〔本文判断：诸家科判之会通属本席判，非经证〕。澄观十义最富哲理（十玄雏形），智俨五序最便结构，李通玄表法最显处法之义——三途并蓄，为 §二 科段与 §七 数据层之依据。\n\n---\n\n## 六、文本对读与校勘\n\n### 6.1 与六十华严〈佛昇須彌頂品第九〉对读\n\n六十（`T09n0278`·晋译）相当品为〈佛昇須彌頂品第九〉（juan7·@7436–8200·CJK 637·26 段），与本品（八十 CJK 654·8 单元）**段数多而单元碎**（六十长行分合不同·十佛颂作十三个独立段 60-004–60-023·每二句一段）。要义对读三点：\n\n**（一）结构同**：齐现（60-001↔80-01）→不起此座昇须弥（60-002↔80-02）→帝释严殿·请佛（60-002/003↔80-03/04）→入殿·乐音寂·忆念说偈（60-003↔80-05）→十佛颂（60-004–023↔80-06）→结通·昇师子座·宫殿广博（60-024↔80-07）。**两译骨架全同**，可段段对应。\n\n**（二）名号异译**（十佛·详见 §2.7 表）：六十「拘那牟尼**慧**無礙·**拘樓**佛身如金山·**隨葉**離三垢·尸棄**常寂然**·**錠光**如來明普照」——与八十「見無礙·迦羅鳩馱·毘舍浮·離分別·然燈大光明」名号／别德多异。**各照底本·不强定对应·不臆造对齐**（铁律·第二会 P8 已定）。\n\n**（三）数量词异**：八十庄严「**十千**」×10，六十作「**萬種／萬寶／一萬**」——数值同（一万）译词异；八十「入此殿／此處」六十全作「入此**處**／此**處**」（殿→处·泛化）；六十结颂首「迦葉如來具大**慈**」对八十「具大**悲**」。\n\n〔按·请佛句〕八十请佛**一处三称**（80-03 末·「善來世尊！善來善逝！善來如來、應、正等覺！唯願哀愍，處此宮殿！」；dump 之 80-04 系平文器重计假象·非重出·§1.5·§6.4），六十（60-003）**仅一称**「善來世尊！唯願哀處我此宮殿」且较八十简（无「善来善逝·善来如来应正等觉」之叠·无「哀愍」之「愍」）——两译请辞繁简之别·非缺文·如实记。\n\n### 6.1′　六十《佛昇須彌頂品第九》全本对照〔L.193 本批·全量入文〕\n\n（品界 `T09n0278` juan7「佛昇須彌頂品第九」→「菩薩雲集妙勝殿上說偈品第十」前·26 段·正文取 60-000–60-024·60-025「大方廣佛華嚴經」分卷题残行不取·口径登记·以下逐段照录·`_e13_full.py` 程序取自 `T09n0278`·0 手抄）\n\n（品界 `T09n0278` juan7「佛昇須彌頂品第九」→「菩薩雲集妙勝殿上說偈品第十」前·26 段·正文照录取 60-000–60-024·CJK 630·60-025「大方廣佛華嚴經」分卷题残行不取·口径登记·以下逐段照录本地入库全本·不转写不断句·`_e13_full.py` 程序取自 `T09n0278`·0 手抄·「六十｜」前缀为异译侧照录标记·本区在 §二 审计扫描区外）：\n\n> 六十｜佛昇須彌頂品第九\n\n> 六十｜爾時，如來威神力故，十方一切諸佛世界諸四天下，一一閻浮提，皆有如來坐菩提樹下，無不顯現。彼諸菩薩各承佛神力，說種種法。皆悉自謂：在於佛所。\n\n> 六十｜爾時，世尊威神力故，不起此座，昇須彌頂，向帝釋殿。爾時，帝釋遙見佛來，即於妙勝殿上，敷置眾寶師子之座。以萬種雜寶而莊嚴之；萬種寶帳彌覆其上；以萬寶網而絞絡之；次上萬種眾妙寶蓋、天繒雜寶以為垂帶；萬種瓔珞而莊嚴之；萬種寶衣以敷座上。一萬天子在前立侍；一萬梵天而圍遶之；一萬光明以為照耀。\n\n> 六十｜爾時，帝釋為佛莊嚴師子座已，合掌恭敬白佛言：「善來世尊！唯願哀處我此宮殿。」爾時，世尊即受其請，昇妙勝殿；一切十方亦復如是。爾時，帝釋無量樂音，佛神力故，寂然無聲。即自憶念於過去佛所種諸善根，以偈頌曰：\n\n> 六十｜「迦葉如來具大慈，諸吉祥中最無上，\n\n> 六十｜彼佛曾來入此處，是故此地最吉祥。\n\n> 六十｜拘那牟尼慧無礙，諸吉祥中最無上，\n\n> 六十｜彼佛曾來入此處，是故此地最吉祥。\n\n> 六十｜拘樓佛身如金山，諸吉祥中最無上，\n\n> 六十｜彼佛曾來入此處，是故此地最吉祥。\n\n> 六十｜隨葉如來離三垢，諸吉祥中最無上，\n\n> 六十｜彼佛曾來入此處，是故此地最吉祥。\n\n> 六十｜尸棄如來常寂然，諸吉祥中最無上，\n\n> 六十｜彼佛曾來入此處，是故此地最吉祥。\n\n> 六十｜毘婆尸佛如滿月，諸吉祥中最無上，\n\n> 六十｜彼佛曾來入此處，是故此地最吉祥。\n\n> 六十｜弗沙明達第一義，諸吉祥中最無上，\n\n> 六十｜彼佛曾來入此處，是故此地最吉祥。\n\n> 六十｜提舍如來辯無礙，諸吉祥中最無上，\n\n> 六十｜彼佛曾來入此處，是故此地最吉祥。\n\n> 六十｜波頭摩佛淨無垢，諸吉祥中最無上，\n\n> 六十｜彼佛曾來入此處，是故此地最吉祥。\n\n> 六十｜錠光如來明普照，諸吉祥中最無上，\n\n> 六十｜彼佛曾來入此處，是故此地最吉祥。」\n\n> 六十｜如此間帝釋，佛神力故，以偈讚歎十佛功德；如是十方帝釋，各自憶念過去佛所所種善根，以偈讚歎亦復如是。爾時，世尊昇師子座，結跏趺坐。坐已，宮殿忽然廣博如忉利天處，一切十方，亦復如是。\n\n〔按·两译段次对应〕齐现（60-001↔80-01）·不起此座昇须弥（60-002↔80-02）·帝释严殿·请佛（60-002/003↔80-03）·入殿·乐音寂·忆念说偈（60-003↔80-05）·十佛颂（60-004–023↔80-06）·结通·昇师子座·宫殿广博（60-024↔80-07）·两译骨架全同可段段对应。名号异译、数量词「十千↔萬」之差别详 §6.1（二）（三）·各照底本不强统一·不臆造对齐。\n\n### 6.2 四十华严（`T10n0293`）\n\n四十 上偈讚品第十四` @100923·fullC 直取切片·非单元求和）。旧稿据 dump 单元求和误得 678／善來×6（幻影 80-04 重计），今改品界 slice 口径订正。\n\n### 7.3 名号分布（结构计数）\n\n| 层 | 项 | 计数 | 备注 |\n|---|---|---|---|\n| 十佛颂 | 佛名（八十） | **10** | 迦葉·拘那牟尼·迦羅鳩馱·毘舍浮·尸棄·毘婆尸·弗沙·提舍·波頭摩·然燈 |\n| 十佛颂 | 每颂句数 | 4 | 十佛各一颂·通五十句 |\n| 十佛颂 | 结句「是故此處最吉祥」 | 10 | 一一颂结 |\n| 庄严段 | 「十千」系名数 | 10 | 十千層級／欄楯／寶網…（对六十萬種／萬寶／一萬） |\n\n### 7.4 复算脚本（可复核）\n\n```python\n# L.193 P13 数据层复算（照 T10n0279 卷十六·品十三·品界 slice·与 _p9_11_audit 同口径）\nimport re, xml.etree.ElementTree as ET\nSKIP = {'note', 'rdg', 'mulu', 'pb', 'anchor', 'app'}\nout = []\ndef walk(el):\n    tag = el.tag.split('}')[-1]\n    if tag in SKIP: return\n    if tag == 'lb': out.append(' ')\n    if el.text: out.append(el.text)\n    for c in el:\n        walk(c)\n        if c.tail: out.append(c.tail)\nwalk(ET.parse('data/references/cbeta/T10n0279.xml').getroot())\nONLY = lambda s: ''.join(c for c in s if '\\u4e00' <= c <= '\\u9fff')\nfullC = ONLY(''.join(out))\ni = fullC.find('昇須彌山頂品第十三')\nk = fullC.find('須彌頂上偈讚品第十四', i + 6)\nassert 0 < i < k, (i, k)\nbody = fullC[i:k]                     # 品界 slice（含品题）\nprint('@%d–%d CJK(含品题):' % (i, k), len(body))          # 实测 654\nprint('正文净(去品题9):', len(body) - len('昇須彌山頂品第十三'))  # 645\nfor w in ('爾時', '十方', '十千', '善來', '最無上', '是故此處最吉祥'):\n    print(w + ':', body.count(w))     # 6 / 4 / 10 / 3 / 10 / 10\nBUDDHAS = ['迦葉','拘那牟尼','迦羅鳩馱','毘舍浮','尸棄','毘婆尸','弗沙','提舍','波頭摩','然燈']\nprint('十佛名命中:', sum(1 for b in BUDDHAS if b in body), '/10')\n```\n\n> **〔实测记录·L.193〕** 品界：起 @100269、止 @100923（次品品题前）。上列各值由 `_e13_stats.py` 同一逻辑实跑产出（见 `_e13_stats.txt`），非估算；善來×3 已确证经文无重出（幻影 80-04 系 dump 层节点重计·不入品界 slice）。\n\n### 7.5 十佛名号·众集名数矩阵·数据科学四视角〔L.193 本批 新增〕\n\n> 数据基底＝`_e13_full.py` 结构化 dump（八十品界 CJK-only @100269–100923·654 含品题／正文净 645·真六单元；六十 26 段·正文 630；疏窗 CJK 3,301／raw 4,029）与 `_e13_stats.py` 品界 slice 频计表；四视角口径承第二会成例（P7/P8 §7.5 同构）。**凡比附义理者一律〔本文判断〕。**\n\n**L1·组合（品界单元实测）**：本品＝品题（80-00）＋**六个正文单元**（长行 80-01·02·03·05·07·五段＋偈颂 80-06·十佛颂）；平文器 dump 虽列 8 节点（含品题 head 80-00 与幻影 80-04），品界 slice 剔幻影后真单 佛名号梵汉训释（迦葉＝飲光·拘那牟尼＝金仙·毘婆尸＝四翻淨勝遍見·然燈＝舉身帶光·详 §5.1 癸四·澄观）</text>\n</svg>\n\n---\n\n## 八、附录（十一类）\n\n### 附录一：人名表\n| 名 | 训释 | 出处 |\n|---|---|---|\n| 如来／世尊 | 本品化主·不起菩提树而昇须弥 | `T10n0279` |\n| 天帝釋／憍尸迦 | *Śakro devānām indieṃ*·忉利主·妙胜殿严佛 | `T1735`／`T1733` |\n| 十佛 | 迦葉等过去七佛＋三（详见 §4.3） | `T10n0279` 80-06 |\n| 澄观 | 唐·清凉山大华严寺沙门 | `T1735` |\n| 法藏 | 唐·魏国西寺沙门 | `T1733` |\n| 智俨 | 唐·终南山至相寺沙门（华严二祖） | `T1732` |\n| 慧苑 | 唐·大薦福寺沙门 | `X0221` |\n| 李通玄 | 唐·李通玄 | `T1739`／`X0223` |\n\n### 附录二：名相表\n（见 §4.4·苏迷卢／妙高·忉利天／三十三天·妙胜殿·不起而升·十住位）\n\n### 附录三：经文要句\n（见 §2.1–§2.8·品界 slice 逐字回源）\n\n### 附录四：注疏引文汇\n（见 §5.1–§5.3；〔L.193 本批〕**澄观疏科长文全摘（五门·十段）已入 §5.1**·**本科段全文照录已入附录四′**·复核件 `_e13_dump.txt`／`_e13_stats.txt`）\n\n**附录四′·澄观《华严经疏》本科段全文照录**〔L.193 本批·达标基线补全〕（`T1735` 卷第十六「升須彌山頂品第十三」段·raw @210566–214593·CJK-only 坐标回映切片·分页符行剔除·余照原档分行排段不转写不断句·康熙部首原字形（部首码位）已归一正字（L.199）·本附录在 §二 审计区外不污引文审计·共 129 档行·窗 CJK 3,301）：\n\n> 升須彌山頂品第十三 (已下第十六經)\n\n> 初來意者。先辨會來。前信此解。義次第故。又答十住問總有二段。 前信是住之方便。此明正位故次來也。二品來。前品說信究竟。此品\n\n> 趣後說住。故次來也。二釋名。亦先辨會名。約處名忉利天會。約人 名法慧菩薩會。約法名十住會。皆依主釋。二品名。須彌正云蘇迷\n\n> 盧。此云妙高。如來以自在力不起覺樹。應機現彼故云升也。表位漸 增不處人間。顯位清淨故居天也。若天表淨何獨妙高。妙有十義。如\n\n> 於法故。一者體妙謂四寶所成。二者相妙。謂八方四級。三者色妙謂 四正色。北金東銀南吠瑠璃西頗胝迦。一切草木鳥獸等物。隨所至處\n\n> 則同其色。自常不變。四者德妙。謂八方猛風不能令動。五眷屬妙。 謂七金山七重圍繞。及七香海海印旋流。六依持妙。唯天依住。得通\n\n> 者居。七作業妙。不離本處而鎮四洲。映蔽日月而成晝夜。八生果 妙。謂波利質多能益天眾。九為首妙。於四洲地最在先成。十堅固\n\n> 妙。於輪圍中最在後壞。高者高八萬四千由旬。入水亦爾。下據金剛 上隣空界。頂上縱廣量亦如之。獨出九山故稱高也。十住之行亦復如\n\n> 是。聞思修解而為妙體。四德八聖以為妙相。四辯為色令物解同。雖 同眾音自智不變。八法不動而為妙德。七支奉戒金山圍繞。七識流轉\n\n> 而為海印。第一義天依持而住。可以神會非情能升。不離本處遍應十 方。映蔽佛口及菩薩月。而成涅槃生死晝夜。生教行果而為妙樹。世\n\n> 界初成菩薩先出。為眾生現種種資具。世界將壞菩薩後沒。為說上定 令免三災。高者具成八萬四千諸度法門。自在障外為眾生故。入生死\n\n> 海。亦具八萬四千諸度法門。據金剛性隣勝義空。又智入佛慧必窮其 底。德超方便逈出群峯。為顯十住功德妙高。是故須升妙高山頂。四\n\n> 王處半旁而非正。表住不退異信輕毛。故越彼天居妙高頂。善財童子 於妙峯山頂見德雲者。亦表斯位彌顯有由。然上所釋皆圓教意。故下\n\n> 發心品云。應知此人即與三世諸佛同等。與三世佛功德平等。得如來 一身無量身。纔發心時。即為十方一切諸佛共所稱歎。不可同於方便\n\n> 教說。若約觀心妙高者。謂三昧須彌寂然不動。無思無心不收不攝。 任性而定稱本心地。入佛智海湛然不遷。是妙法樂觸境自在。合本性\n\n> 淨。是四德寶而自莊嚴。斯則本覺如來。升法須彌之頂。三宗趣者。 先約會以十住行德為宗。攝位德果為趣。二品以嚴處請佛赴感為宗。\n\n> 根緣契合說法為趣。四釋文者。此會六品分為二分。初二品方便發 起。後四品當會正說。前中初之一品。唯是由致。偈讚一品義有兩\n\n> 兼。一是方便。謂前品化主赴機。後品助化讚佛。主伴圓備方演法 故。二是所依。謂三天說法各有偈讚。欲顯三賢皆依佛智有差別故。\n\n> 離如來智無自體故。獨為方便甚抑讚詞。行向二會同此科判。今初一 品長分十段。一本會齊現。二不離齊升。三各見佛來。四各嚴殿座。\n\n> 五皆來請佛。六俱時入殿。七樂音並止。八各念昔因。九同讚如來。 十殿皆廣博嚴淨也。言爾時者。即前二會時。主伴齊遍演前二會之法\n\n> 也。今此明遍。即十重說處中第一重也。何須舉此。欲明前會不散成 後會故。後必帶前。合成法界無礙會故。一一諸會無休息故。後後諸\n\n> 會皆同時故。若散前會即無後故。所以唯約覺樹會者。此為本故。得 佛處故。理實第二亦同此遍。若同時遍。何有九會前後。若有前後何\n\n> 名同時。應云即用之體同時頓遍。即體之用不壞前後。猶如印文。第 二爾時下。明不離覺樹各升釋天。問動靜相違去住懸隔。既云不離何\n\n> 得言升。古有多釋。一云。本釋迦身不起道樹。別起應化以升天上。 一云。不起是報升天是化。一云。不起是法身升天是化用。並非文\n\n> 意。以此文中俱是毘盧遮那十身雲故。一云。以去即非去故名不起。 非去即去是以升天。如不來相而來等。若爾但是升相離故。非是樹下\n\n> 別有不起之身。故不可也。有云。此佛神通同體業用。即住是去去即 是住。住是體遍去是用應。應是體應。雖升後而不離前。體是應體。\n\n> 雖不離前而升後。若爾何殊第三師。不起是法。又以住釋於不起。而 言住是體遍。何得獨住菩提樹耶。升天何得非體遍耶。菩提樹下寧非\n\n> 用耶。今顯正義。然佛得菩提。智無不周體無不在。無依無住無去無 來。然以自在即體之應。應隨體遍。緣感前後有住有升。閻浮有感見\n\n> 在道樹。天宮有感見升天上。非移覺樹之佛。而升天宮故云不離覺 樹。而升釋殿。法慧偈云。佛子汝應觀如來自在力。一切閻浮提皆言\n\n> 佛在中。此不離也。我等今見佛住於須彌頂。此而升也。文理有據。 更以喻顯。譬猶朗月流影遍應。且澄江一月三舟共觀。一舟停住。二\n\n> 舟南北。南者見月千里隨南。北者見月千里隨北。停舟之者見月不 移。是為此月不離中流而往南北。設百千共觀八方各去。則百千月各\n\n> 隨其去。諸有識者曉斯旨焉。古德釋此。略有十義。一約處相入門。 以一處中有一切處故。是故此天宮等。本在樹下。故不須起。然是用\n\n> 彼故說升也。二亦約相入門。以一處入一切處故。樹遍天中亦不須 起。欲用天宮表法升進。故云升也。三由一切即一故。天在樹下。四\n\n> 由一即一切樹在天上。不起等準前。五約佛身。謂此樹下身。即滿法 界遍一切處。則本來在彼不待起也。機熟令見故云升也。是故如來以\n\n> 法界身常在此。即是在彼。六約佛自在不思議解脫。謂坐即是行住 等。在此即在彼。皆非下位測量故也。七約緣起相由門。八約法性融\n\n> 通門。九約表示顯法門。十約成法界大會門。然此十解前五玄門。次 四所以。後一總意。欲成十義相參而立。雖似雜亂不違經宗。並可用\n\n> 也。然此中相望有四對。法相即無礙。一此處彼處。二此身彼身。三 若去若住。四若一若多。約處此處彼處相即無礙。應如十中前四。約\n\n> 身相即無礙。應如五六及前正顯。又十中後四通於身處。約處唯有此 彼。約身更加去住。謂此身即是彼身。去身即是住身。若身若處俱通\n\n> 一多。上來諸法同在一時。無前後也。一多相望應成四句。一不離一 切樹下升一天宮。即如今文。二不離一樹升一切天。三不離一切樹而\n\n> 升一切天。經云十方世界悉如是故。四不離一樹下而升一天。經中欲 顯一多相即。故舉初句。升釋天既爾升餘天亦然。如後二會升天既\n\n> 爾。往餘處亦然。復應樹樹相望而成二句。謂不離一樹下常在一切 樹。不離一切樹而常在一樹。復應以不起餘處。類不起樹下。展轉相\n\n> 望皆悉周遍。不壞前後自在難思。又既一處有一切處亦有微細義。所 用不同有隱顯義。若加前時後時有十世義。唯見說住。及於餘法有純\n\n> 雜義。後後帶於前前有帝網義。此天望餘成主伴義。十玄具矣。問帶 前起後事理應齊。何故三賢獨有斯旨。答顯異義故。謂初二會相隣接\n\n> 故。不假帶前。此三人天隔越。故須連帶。又此三會同詮賢位。六已 入證不假帶前。第七即位中普賢居然不假。第八頓彰五位體用已融。\n\n> 第九唯明證入體用一味故。並皆不假。第三時天帝下。明各見佛來。 約佛則用從體起。約機境從心現。隣而未即故云遙見。第四即以下。\n\n> 各嚴殿座。表嚴根欲之殿為法器故。置師子座。表十住之法門故。文 有十句。初總餘別。總云普光明藏者。此是解位智。照法空含眾德\n\n> 故。從信始入故有置言。別中初句約體。餘並顯嚴。皆云十千者。萬 行因感故。言層級者萬行熏成故。金網防護。慈悲帳蓋以育以覆。四\n\n> 攝繒綺以為周垂。圓融行願交絡萬善。柔忍慚愧以覆法空第一義天。 清淨梵行繞斯法體。一一智照故日光明。於生死中。遣長夜闇舉斯果\n\n> 德。令物行因。下行向中。約位漸增表法無異。第五爾時帝釋下。請 佛居殿。於中三業崇敬以為請儀。言善來者應機來故。不來相而來\n\n> 故。帶法界會來故。三稱善者喜之至故。舉三號者略歎德故。願哀處 者。希仗勝田生大福故。第六爾時下俱時入殿。謂根緣契合成益不\n\n> 虛。十方如是。通上六段入殿事訖。故一結通。下四段文殿中之事。 第七爾時下樂音止息。謂攝散歸靜得定益故。第八即自下。各念昔因\n\n> 獲智益也。散緣既止勝德現前。寂然無思發宿住智。種善根者。即下 十佛曾入此殿。聞法供養故。亦表見自心性。同昔佛故。第九迦葉\n\n> 下。同讚如來。然三世諸佛。皆於此處說十住法。獨讚十者。表說十 住及無盡故。所以讚者義乃有四。一十佛曾處則殿勝可居。二互舉一\n\n> 德例讚本師。三敘昔善根慶遇堪受。四昔佛同說表法常恒。文中先明 此界後辨結通。今初十頌。各上半標名讚德。上句別下句通。下半以\n\n> 人結處。唯初一句諸佛不同。然佛別名多因德立。讚者取德以釋上 名。初迦葉者此云飲光。若從姓立示生彼族。若就佛德。一者身光蔽\n\n> 餘光故。二者悲光飲蔽邪光故。拘那牟尼舊曰金仙。亦云金寂。寂故 無礙。金故明見。迦羅鳩馱者。具云迦羅鳩村馱。此云所應斷。已斷\n\n> 如金已淨。如山不動。亦可見無礙者。是此佛德。如金山者是前佛 德。毘舍浮者。亦云毘濕婆部。毘濕婆者。此云遍一切也。部者自在\n\n> 也。亦云遍勝無三垢。故無不自在而超勝也。三垢者。現種及習。尸 棄亦云式棄那。此云持髻。亦云有髻。無分別智最為尊上。處心頂\n\n> 也。又髻中明珠即無分別也。毘婆尸者此翻有四。謂淨觀。勝觀。勝 見。遍見。如月圓。智滿是遍見也。魄盡惑亡是淨觀也。既圓且淨。\n\n> 是勝觀勝見也。弗沙亦云勃沙。此云增盛。明達勝義是增盛也。提舍 亦云底沙。西域訓字底邏那。此云度也。沙是皤沙。此云說也。謂說\n\n> 法度人。或但云說。辯才無礙者即能說也。波頭摩者。此云赤蓮華。 身心如蓮華淨無塵垢。然燈者。智論云。此佛從初現生。乃至成佛。\n\n> 舉身帶光如然燈故。身智光明普周稱大。然十中後七乃過去劫佛。如 何賢劫曾入殿耶。古釋有二。一約時劫相即入故。二約其處有麁細\n\n> 故。麁隨劫壞。細者常存。如法華天人見燒我土不毀。又梵王見淨身 子見穢。今此天帝是大菩薩同梵王見。亦佛加故。二如此下結通十\n\n> 方。第十爾時世尊下。殿皆廣博。即示如意相廣殿。同處以遣局情。 亦表廓大慈悲等眾生界。又如來入殿。即覺智現前。忽然廣博則身心\n\n> 無際。十方已下結無盡。唯結後四前已結故\n\n### 附录五：对读简表\n（八十↔六十段次对应见 §6.1（一）·名号异译见 §6.1（二）·数量词异见 §6.1（三）·六十全本逐行照录见 §6.1′）\n\n### 附录六：存疑一览\n- 〔待核〕四十《华严》须弥／忉利段之有无与相当（§6.2）。\n- 〔未竟〕藏译 `Toh 44` 前分相当品段逐字对勘未做（藏本已入库·§6.3）。\n- 〔待核〕《兜沙经》与本品十佛名号之部类源流（§6.5）。\n- 〔待核〕梵字 *svāgata* 三「善来」叠用非十号次第（§2.4）。\n- 〔待核〕「長分十段」之「長」＝長·波利**質**多之「氏」原字形保留（§6.4）。\n\n### 附录七：引用书目\n`T10n0279`（八十华严·实叉难陀译）·`T09n0278`（六十华严·佛驮跋陀罗译）·`T10n0293`（四十华严·般若译）·`T10n0280`（兜沙经）·`T1735`（澄观《华严经疏》）·`T1733`（法藏《探玄记》）·`T1732`（智俨《搜玄记》）·`X0221`（慧苑《刊定记》）·`T1739`／`X0223`（李通玄《新经论》／《合论》）。\n\n### 附录八：术语对照\n不起而升（不动而进·body用「昇」·疏用「升」）·苏迷卢／须弥／妙高·忉利／三十三天·妙胜殿／善见城·十住／发心住…。\n\n### 附录九：中英要目（EN Key-Point Correspondence）\n\n> 依全站固定术语表（`data/translation/glossary.yaml`·`data/catalog/chapters.yaml`）；英文以达意为务。〔2026-10-26〕\n\n| 中文 | English | 备注 |\n|---|---|---|\n| 升须弥山顶品 | The Chapter of Ascending the Summit of Mount Sumeru | 篇头 EN·chapters.yaml title_en \"Ascending to the Peak of
