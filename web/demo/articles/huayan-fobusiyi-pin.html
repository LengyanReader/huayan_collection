<script>
var ARTICLE = {"id": "huayan-fobusiyi-pin", "file": "articles/huayan-fobusiyi-pin.html", "title": "九九华严第三十一品 佛不思议法品之拼读", "title_sub": "", "icon": "🪷", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第七会_普光明殿_等觉/华严经细读_第三十一部_佛不思议法品.md", "doc_md": "# 华严经细读·第三十一部《佛不思议法品》之拼读\n\n> **EN · The Chapter on the Inconceivable Dharmas of the Buddhas**\n\n> **底本**：八十华严 `T10n0279`。**范围：卷第四十六～四十九（佛不思議法品第三十三·本品全文·跨四卷）**。本品属**第七会「普光明殿会」·等觉果分**。\n\n---\n\n## 〇、凡例\n\n一、底本 `T10n0279`。二、引文程序注入（0 手抄·逐字回源）。三、存疑标〔待核〕推断标〔本文判断〕。四、体量自陈：**全文成篇**（34 节十种法逐节注入）。\n\n## 一、概述与品题解义\n\n**品名**：**佛不思議法品第三十三**。说主：**青蓮華藏菩薩**（世尊加持后，告**蓮華藏菩薩**——双莲华藏对答）。**实测**：品文净 **13,726 CJK**，85 `<p>`＋0 `<lg>`，跨 28 页（四卷）。\n\n**【定位】**第七会果分之始——诸菩萨**心念十问**（国土·本愿·种性·出现·身·音声·智慧·自在·无碍·解脱云何不思议），世尊加持青蓮華藏菩萨作答：以**三十四节十种法**总说佛果功德之不可思议。**因圆果满，故次来也**（澄观§5.1）——前品普贤行明修生之因，本品辨修生之果。\n\n**【一句】****果海不可说而以三十四节强说之——标非尽之，指月之指。**\n\n## 二、本品全文注\n\n### 2.1 心念十问（程序全引）\n\n> 爾時，大會中有諸菩薩作是念：「諸佛國土云何不思議？諸佛本願云何不思議？諸佛種性云何不思議？諸佛出現云何不思議？諸佛身云何不思議？諸佛音聲云何不思議？諸佛智慧云何不思議？諸佛自在云何不思議？諸佛無礙云何不思議？諸佛解脫云何不思議？\n\n### 2.2 世尊加持·青莲华藏承力（程序全引）\n\n> 爾時，世尊知諸菩薩心之所念，則以神力加持，智慧攝受，光明照曜，威勢充滿，令青蓮華藏菩薩住佛無畏，入佛法界，獲佛威德，神通自在，得佛無礙廣大觀察，知一切佛種性次第，住不可說佛法方便。爾時，青蓮華藏菩薩則能通達無礙法界，則能安住離障深行，則能成滿普賢大願，則能知見一切佛法，以大悲心觀察眾生，欲令清淨精勤修習無有厭怠，受行一切諸菩薩法，於一念中出生佛智，解了一切無盡智門，總持、辯才皆悉具足；承佛神力，告蓮華藏菩薩言：\n\n### 2.3 三十四节十种法（逐节全引）\n\n**三十节名目总表**（实测）：\n\n| 节 | 名目 |\n|---|---|\n| 1 | 無量住（列九住·「無量」不拘十数） |\n| 2 | 十種法，普遍無量無邊法界 |\n| 3 | 十種念念出生智 |\n| 4 | 十種不失時 |\n| 5 | 十種無比不思議境界 |\n| 6 | 十種智 |\n| 7 | 十種普入法 |\n| 8 | 十種難信受廣大法 |\n| 9 | 十種大功德，離過清淨 |\n| 10 | 十種究竟清淨 |\n| 11 | 十種佛事（一切世界一切時） |\n| 12 | 十種無盡智海法 |\n| 13 | 十種常法 |\n| 14 | 十種演說無量諸佛法門 |\n| 15 | 十種為眾生作佛事 |\n| 16 | 十種最勝法 |\n| 17 | 十種無障礙住 |\n| 18 | 十種最勝無上莊嚴 |\n| 19 | 十種自在法 |\n| 20 | 十種無量不思議圓滿佛法 |\n| 21 | 十種善巧方便 |\n| 22 | 十種廣大佛事（無量無邊不可思議） |\n| 23 | 廣大佛事·第十（雖般涅槃仍為福田）并結勸 |\n| 24 | 十種無二行自在法 |\n| 25 | 十種住，住一切法 |\n| 26 | 十種知一切法盡無有餘 |\n| 27 | 十種力 |\n| 28 | 十種大那羅延幢勇健法 |\n| 29 | 十種決定法 |\n| 30 | 十種速疾法 |\n| 31 | 十種應常憶念清淨法 |\n| 32 | 十種一切智住 |\n| 33 | 十種無量不可思議佛三昧 |\n| 34 | 十種無礙解脫 |\n\n**逐节全文**：\n\n**（1）無量住（列九住·「無量」不拘十数）**：\n\n> 佛子！諸佛世尊有無量住，所謂：常住大悲、住種種身作諸佛事、住平等意轉淨法輪、住四辯才說無量法、住不思議一切佛法、住清淨音遍無量土、住不可說甚深法界、住現一切最勝神通、住能開示無有障礙究竟之法。「\n\n**（2）十種法，普遍無量無邊法界**：\n\n> 佛子！諸佛世尊有十種法，普遍無量無邊法界。何等為十？所謂：一切諸佛有無邊際身，色相清淨，普入諸趣而無染著；一切諸佛有無邊際無障礙眼，於一切法悉能明見；一切諸佛有無邊際無障礙耳，悉能解了一切音聲；一切諸佛有無邊際鼻，能到諸佛自在彼岸；一切諸佛有廣長舌，出妙音聲周遍法界；一切諸佛有無邊際身，應眾生心，咸令得見；一切諸佛有無邊際意，住於無礙平等法身；一切諸佛有無邊際無礙解脫，示現無盡大神通力；一切諸佛有無邊際清淨世界，隨眾生樂現眾佛土，具足無量種種莊嚴，而於其中不生染著；一切諸佛有無邊際菩薩行願，得圓滿智，遊戲自在，悉能通達一切佛法。佛子！是為如來、應、正等覺普遍法界無邊際十種佛法。「\n\n**（3）十種念念出生智**：\n\n> 佛子！諸佛世尊有十種念念出生智。何等為十？所謂：一切諸佛於一念中，悉能示現無量世界從天來下；一切諸佛於一念中，悉能示現無量世界菩薩受生；一切諸佛於一念中，悉能示現無量世界出家學道；一切諸佛於一念中，悉能示現無量世界菩提樹下成等正覺；一切諸佛於一念中，悉能示現無量世界轉妙法輪；一切諸佛於一念中，悉能示現無量世界教化眾生供養諸佛；一切諸佛於一念中，悉能示現無量世界不可言說種種佛身；一切諸佛於一念中，悉能示現無量世界種種莊嚴、無數莊嚴、如來自在一切智藏；一切諸佛於一念中，悉能示現無量世界無量無數清淨眾生；一切諸佛於一念中，悉能示現無量世界三世諸佛種種根性、種種精進、種種行解，於三世中成等正覺。是為十。「\n\n**（4）十種不失時**：\n\n> 佛子！諸佛世尊有十種不失時。何等為十？所謂：一切諸佛成等正覺不失時；一切諸佛成熟有緣不失時；一切諸佛授菩薩記不失時；一切諸佛隨眾生心示現神力不失時；一切諸佛隨眾生解示現佛身不失時；一切諸佛住於大捨不失時；一切諸佛入諸聚落不失時；一切諸佛攝諸淨信不失時；一切諸佛調惡眾生不失時；一切諸佛現不思議諸佛神通不失時。是為十。「\n\n**（5）十種無比不思議境界**：\n\n> 佛子！諸佛世尊有十種無比不思議境界。何等為十？所謂：一切諸佛一跏趺坐，遍滿十方無量世界；一切諸佛說一義句，悉能開示一切佛法；一切諸佛放一光明，悉能遍照一切世界；一切諸佛於一身中，悉能示現一切諸身；一切諸佛於一處中，悉能示現一切世界；一切諸佛於一智中，悉能決了一切諸法無所罣礙；一切諸佛於一念中，悉能遍往十方世界；一切諸佛於一念中，悉現如來無量威德；一切諸佛於一念中，普緣三世佛及眾生，心無雜亂；一切諸佛於一念中，與去、來、今一切諸佛體同無二。是為十。「\n\n**（6）十種智**：\n\n> 佛子！諸佛世尊能出生十種智。何者為十？所謂：一切諸佛知一切法無所趣向，而能出生迴向願智；一切諸佛知一切法皆無有身，而能出生清淨身智；一切諸佛知一切法本來無二，而能出生能覺悟智；一切諸佛知一切法無我無眾生，而能出生調眾生智；一切諸佛知一切法本來無相，而能出生了諸相智；一切諸佛知一切世界無有成壞，而能出生了成壞智；一切諸佛知一切法無有造作，而能出生知業果智；一切諸佛知一切法無有言說，而能出生了言說智；一切諸佛知一切法無有染淨，而能出生知染淨智；一切諸佛知一切法無有生滅，而能出生了生滅智。是為十。「\n\n**（7）十種普入法**：\n\n> 佛子！諸佛世尊有十種普入法。何等為十？所謂：一切諸佛有淨妙身，普入三世；一切諸佛皆悉具足三種自在，普化眾生；一切諸佛皆悉具足諸陀羅尼，普能受持一切佛法；一切諸佛皆悉具足四種辯才，普轉一切清淨法輪；一切諸佛皆悉具足平等大悲，恒不捨離一切眾生；一切諸佛皆悉具足甚深禪定，恒普觀察一切眾生；一切諸佛皆悉具足利他善根，調伏眾生無有休息；一切諸佛皆悉具足無所礙心，普能安住一切法界；一切諸佛皆悉具足無礙神力，一念普現三世諸佛；一切諸佛皆悉具足無礙智慧，一念普立三世劫數。是為十。「\n\n**（8）十種難信受廣大法**：\n\n> 佛子！諸佛世尊有十種難信受廣大法。何等為十？所謂：一切諸佛悉能摧滅一切諸魔；一切諸佛悉能降伏一切外道；一切諸佛悉能調伏一切眾生咸令歡悅；一切諸佛悉能往詣一切世界化導群品；一切諸佛悉能智證甚深法界；一切諸佛悉皆能以無二之身現種種身充滿世界；一切諸佛悉皆能以清淨音聲起四辯才說法無斷，凡有信受功不唐捐；一切諸佛皆悉能於一毛孔中出現諸佛，與一切世界微塵數等，無有斷絕；一切諸佛皆悉能於一微塵中示現眾剎，與一切世界微塵數等，具足種種上妙莊嚴，恒於其中轉妙法輪教化眾生，而微塵不大、世界不小，常以證智安住法界；一切諸佛皆悉了達清淨法界，以智光明破世癡闇，令於佛法悉得開曉，隨逐如來住十力中。是為十。「\n\n**（9）十種大功德，離過清淨**：\n\n> 佛子！諸佛世尊有十種大功德，離過清淨。何等為十？所謂：一切諸佛具大威德，離過清淨；一切諸佛悉於三世如來家生，種族調善，離過清淨；一切諸佛盡未來際心無所住，離過清淨；一切諸佛於三世法皆無所著，離過清淨；一切諸佛知種種性皆是一性，無所從來，離過清淨；一切諸佛前際、後際福德無盡，等於法界，離過清淨；一切諸佛無邊身相遍十方剎，隨時調伏一切眾生，離過清淨；一切諸佛獲四無畏，離諸恐怖，於眾會中大師子吼，明了分別一切諸法，離過清淨；一切諸佛於不可說不可說劫入般涅槃，眾生聞名獲無量福，如佛現在功德無異，離過清淨；一切諸佛遠在不可說不可說世界中，若有眾生一心正念則皆得見，離過清淨。是為十。「\n\n**（10）十種究竟清淨**：\n\n> 佛子！諸佛世尊有十種究竟清淨。何等為十？所謂：一切諸佛往昔大願究竟清淨；一切諸佛所持梵行究竟清淨；一切諸佛離世眾惑究竟清淨；一切諸佛莊嚴國土究竟清淨；一切諸佛所有眷屬究竟清淨；一切諸佛所有種族究竟清淨；一切諸佛色身相好究竟清淨；一切諸佛法身無染究竟清淨；一切諸佛一切智智無有障礙究竟清淨；一切諸佛解脫自在，所作已辦，到於彼岸，究竟清淨。是為十。「\n\n**（11）十種佛事（一切世界一切時）**：\n\n> 佛子！諸佛世尊於一切世界、一切時，有十種佛事。何等為十？一者，若有眾生專心憶念，則現其前；二者，若有眾生心不調順，則為說法；三者，若有眾生能生淨信，必令獲得無量善根；四者，若有眾生能入法位，悉皆現證，無不了知；五者，教化眾生無有疲厭；六者，遊諸佛剎，往來無礙；七者，大悲不捨一切眾生；八者，現變化身，恒不斷絕；九者，神通自在，未嘗休息；十者，安住法界，能遍觀察。是為十。「\n\n**（12）十種無盡智海法**：\n\n> 佛子！諸佛世尊有十種無盡智海法。何等為十？所謂：一切諸佛無邊法身無盡智海法；一切諸佛無量佛事無盡智海法；一切諸佛佛眼境界無盡智海法；一切諸佛無量無數難思善根無盡智海法；一切諸佛普雨一切甘露妙法無盡智海法；一切諸佛讚佛功德無盡智海法；一切諸佛往昔所修種種願行無盡智海法；一切諸佛盡未來際恒作佛事無盡智海法；一切諸佛了知一切眾生心行無盡智海法；一切諸佛福智莊嚴無能過者無盡智海法。是為十。「\n\n**（13）十種常法**：\n\n> 佛子！諸佛世尊有十種常法。何等為十？所謂：一切諸佛常行一切諸波羅蜜；一切諸佛於一切法常離迷惑；一切諸佛常具大悲；一切諸佛常有十力；一切諸佛常轉法輪；一切諸佛常為眾生示成正覺；一切諸佛常樂調伏一切眾生；一切諸佛心常正念不二之法；一切諸佛化眾生已，常示入於無餘涅槃，諸佛境界無邊際故。是為十。「\n\n**（14）十種演說無量諸佛法門**：\n\n> 佛子！諸佛世尊有十種演說無量諸佛法門。何等為十？所謂：一切諸佛演說無量眾生界門；一切諸佛演說無量眾生行門；一切諸佛演說無量眾生業果門；一切諸佛演說無量化眾生門；一切諸佛演說無量淨眾生門；一切諸佛演說無量菩薩行門；一切諸佛演說無量菩薩願門；一切諸佛演說無量一切世界成壞劫門；一切諸佛演說無量菩薩深心淨佛剎門；一切諸佛演說無量一切世界三世諸佛於彼彼劫次第出現門；一切諸佛演說一切諸佛智門。是為十。「\n\n**（15）十種為眾生作佛事**：\n\n> 佛子！諸佛世尊有十種為眾生作佛事。何等為十？所謂：一切諸佛示現色身為眾生作佛事；一切諸佛出妙音聲為眾生作佛事；一切諸佛有所受為眾生作佛事；一切諸佛無所受為眾生作佛事；一切諸佛以地、水、火、風為眾生作佛事；一切諸佛神力自在示現一切所緣境界為眾生作佛事；一切諸佛種種名號為眾生作佛事；一切諸佛以佛剎境界為眾生作佛事；一切諸佛嚴淨佛剎為眾生作佛事；一切諸佛寂寞無言為眾生作佛事。是為十。「\n\n**（16）十種最勝法**：\n\n> 佛子！諸佛世尊有十種最勝法。何等為十？所謂：一切諸佛大願堅固不可沮壞，所言必作，言無有二；一切諸佛為欲圓滿一切功德，盡未來劫修菩薩行不生懈倦；一切諸佛為欲調伏一眾生故，往不可說不可說世界，如是而為一切眾生而無斷絕；一切諸佛於信、於毀二種眾生，大悲普觀，平等無異；一切諸佛從初發心乃至成佛，終不退失菩提之心；一切諸佛積集無量諸善功德，皆以迴向一切智性，於諸世間終無染著；一切諸佛於諸佛所修學三業，唯行佛行，非二乘行，皆為迴向一切智性，成於無上正等菩提；一切諸佛放大光明，其光平等照一切處，及照一切諸佛之法，令諸菩薩心得清淨，滿一切智；一切諸佛捨離世樂，不貪不染，而普願世間離苦得樂，無諸戲論；一切諸佛愍諸眾生受種種苦，守護佛種，行佛境界，出離生死，逮十力地。是為十。「\n\n**（17）十種無障礙住**：\n\n> 佛子！諸佛世尊有十種無障礙住。何等為十？所謂：一切諸佛皆能往一切世界無障礙住；一切諸佛皆能住一切世界無障礙住；一切諸佛皆能於一切世界行、住、坐、臥無障礙住；一切諸佛皆能於一切世界演說正法無障礙住；一切諸佛皆能於一切世界住兜率天宮無障礙住；一切諸佛皆能入法界一切三世無障礙住；一切諸佛皆能坐法界一切道場無障礙住；一切諸佛皆能念念觀一切眾生心行以三種自在教化調伏無障礙住；一切諸佛皆能以一身住無量不思議佛所及一切處利益眾生無障礙住；一切諸佛皆能開示無量諸佛所說正法無障礙住。是為十。「\n\n**（18）十種最勝無上莊嚴**：\n\n> 佛子！諸佛世尊有十種最勝無上莊嚴。何等為十？一切諸佛皆悉具足諸相隨好，是為諸佛第一最勝無上身莊嚴。一切諸佛皆悉具足六十種音，一一音有五百分，一一分無量百千清淨之音以為嚴好，能於法界一切眾中無諸恐怖，大師子吼演說如來甚深法義，眾生聞者靡不歡喜，隨其根欲悉得調伏，是為諸佛第二最勝無上語莊嚴。一切諸佛皆具十力、諸大三昧、十八不共莊嚴意業，所行境界通達無礙，一切佛法咸得無餘，法界莊嚴而為莊嚴，法界眾生心之所行，去、來、現在各各差別，於一念中悉能明見，是為諸佛第三最勝無上意莊嚴。一切諸佛皆悉能放無數光明，一一光明有不可說光明網以為眷屬，普照一切諸佛國土，滅除一切世間黑闇，示現無量諸佛出興，其身平等悉皆清淨，所作佛事咸不唐捐，能令眾生至不退轉，是為諸佛第四最勝無上光明莊嚴。一切諸佛現微笑時，皆於口中放百千億那由他阿僧祇光明，一一光明各有無量不思議種種色，遍照十方一切世界，於大眾中發誠實語，授無量無數不思議眾生阿耨多羅三藐三菩提記，是為諸佛第五離世癡惑最勝無上現微笑莊嚴。一切諸佛皆有法身清淨無礙，於一切法究竟通達，住於法界無有邊際，雖在世間不與世雜，了世實性，行出世法，言語道斷，超蘊、界、處，是為諸佛第六最勝無上法身莊嚴。一切諸佛皆有無量常妙光明，不可說不可說種種色相以為嚴好為光明藏，出生無量圓滿光明，普照十方無有障礙，是為諸佛第七最勝無上常妙光明莊嚴。一切諸佛皆有無邊妙色、可愛妙色、清淨妙色、隨心所現妙色、映蔽一切三界妙色、到於彼岸無上妙色，是為諸佛第八最勝無上妙色莊嚴。一切諸佛皆於三世佛種中生，積眾善寶，究竟清淨，無諸過失，離世譏謗，一切法中最為殊勝清淨妙行之所莊嚴，具足成就一切智智，種族清淨無能譏毀，是為諸佛第九最勝無上種族莊嚴。一切諸佛以大慈力莊嚴其身，究竟清淨無諸渴愛，身行永息，心善解脫，見者無厭，大悲救護一切世間；第一福田、無上受者，哀愍利益一切眾生，悉令增長無量福德、智慧之聚，是為諸佛第十最勝無上大慈大悲功德莊嚴。是為十。「\n\n**（19）十種自在法**：\n\n> 佛子！諸佛世尊有十種自在法。何等為十？所謂：一切諸佛於一切法悉得自在，明達種種句身、味身，演說諸法辯才無礙，是為諸佛第一自在法。一切諸佛教化眾生未曾失時，隨其願樂為說正法，咸令調伏無有斷絕，是為諸佛第二自在法。一切諸佛能令盡虛空界無量無數種種莊嚴，一切世界六種震動，令彼世界或舉或下、或大或小、或合或散，未曾惱害於一眾生，其中眾生不覺不知、無疑無怪，是為諸佛第三自在法。一切諸佛以神通力悉能嚴淨一切世界，於一念頃普現一切世界莊嚴，此諸莊嚴經無數劫說不能盡，悉皆離染，清淨無比，一切佛剎嚴淨之事，皆令平等入一剎中，是為諸佛第四自在法。一切諸佛見一眾生應受化者，為其住壽，經不可說不可說劫，乃至盡未來際，結跏趺坐，身心無倦，專心憶念，未曾廢忘，方便調伏而不失時；如為一眾生，為一切眾生悉亦如是，是為諸佛第五自在法。一切諸佛悉能遍往一切世界一切如來所行之處，而不暫捨一切法界；十方各別，一一方有無量世界海，一一世界海有無量世界種，佛以神力一念咸到，轉於無礙清淨法輪，是為諸佛第六自在法。一切諸佛為欲調伏一切眾生，念念中成阿耨多羅三藐三菩提，而於一切佛法非已現覺，亦非當覺，亦不住於有學之地，而悉知見，通達無礙，無量智慧，無量自在，教化調伏一切眾生，是為諸佛第七自在法。一切諸佛能以眼處作耳處佛事，能以耳處作鼻處佛事，能以鼻處作舌處佛事，能以舌處作身處佛事，能以身處作意處佛事，能以意處於一切世界中住世、出世間種種境界，一一境界中能作無量廣大佛事，是為諸佛第八自在法。一切諸佛，其身毛孔一一能容一切眾生，一一眾生其身悉與不可說諸佛剎等而無迫隘，一一眾生步步能過無數世界，如是展轉盡無數劫，悉見諸佛出現於世，教化眾生，轉淨法輪，開示過去、未來、現在不可說法；盡虛空界一切眾生諸趣受身，威儀、往來及其所受種種樂具皆悉具足，而於其中無所障礙，是為諸佛第九自在法。一切諸佛於一念頃現一切世界微塵數佛，一一佛皆於一切法界眾妙蓮華廣大莊嚴世界蓮華藏師子座上成等正覺，示現諸佛自在神力；如於眾妙蓮華廣大莊嚴世界，如是於一切法界中不可說不可說種種莊嚴、種種境界、種種形相、種種示現、種種劫數清淨世界；如於一念，如是於無量無邊阿僧祇劫一切念中，一念一切現，一念無量住，而未曾用少方便力，是為諸佛第十自在法。「\n\n**（20）十種無量不思議圓滿佛法**：\n\n> 佛子！諸佛世尊有十種無量不思議圓滿佛法。何等為十？所謂：一切諸佛一一淨相皆具百福；一切諸佛皆悉成就一切佛法；一切諸佛皆悉成就一切善根；一切諸佛皆悉成就一切功德；一切諸佛皆能教化一切眾生；一切諸佛皆悉能為眾生作主；一切諸佛皆悉成就清淨佛剎；一切諸佛皆悉成就一切智智；一切諸佛皆悉成就色身相好，見者獲益，功不唐捐；一切諸佛皆具諸佛平等正法；一切諸佛作佛事已，莫不示現入於涅槃。是為十。「\n\n**（21）十種善巧方便**：\n\n> 佛子！諸佛世尊有十種善巧方便。何等為十？一切諸佛了知諸法皆離戲論，而能開示諸佛善根，是為第一善巧方便。一切諸佛知一切法悉無所見、各不相知、無縛無解、無受無集、無成就，自在究竟到於彼岸，然於諸法真實而知不異不別，而得自在、無我無受、不壞實際，已得至於大自在地，常能觀察一切法界，是為第二善巧方便。一切諸佛永離諸相，心無所住，而能悉知不亂不錯，雖知一切相皆無自性，而如其體性悉能善入，而亦示現無量色身，及以一切清淨佛土種種莊嚴無盡之相，集智慧燈滅眾生惑，是為第三善巧方便。一切諸佛住於法界，不住過去、未來、現在，如如性中無去、來、今三世相故，而能演說去、來、今世無量諸佛出現世間，令其聞者普見一切諸佛境界，是為第四善巧方便。一切諸佛身、語、意業，無所造作，無來無去，亦無有住，離諸數法，到於一切諸法彼岸，而為眾法藏，具無量智，了達種種世、出世法，智慧無礙，示現無量自在神力，調伏一切法界眾生，是為第五善巧方便。一切諸佛知一切法不可見，非一、非異，非量、非無量，非來、非去，皆無自性，亦不違於世間諸法；一切智者，無自性中見一切法，於法自在，廣說諸法，而常安住真如實性，是為第六善巧方便。一切諸佛於一時中知一切時，具淨善根，入於正位而無所著，於其日月、年劫、成壞，如是等時不住不捨，而能示現若晝若夜、初中後時、一日、七日、半月、一月、一年、百年、一劫、多劫、不可思劫、不可說劫，乃至盡於未來際劫，恒為眾生轉妙法輪，不斷不退，無有休息，是為第七善巧方便。一切諸佛恒住法界，成就諸佛無量無畏及不可數辯、不可量辯、無盡辯、無斷辯、無邊辯、不共辯、無窮辯、真實辯、方便開示一切句辯、一切法辯，隨其根性及以欲解，以種種法門說不可說不可說百千億那由他修多羅，初、中、後善，皆悉究竟，是為第八善巧方便。一切諸佛住淨法界，知一切法本無名字，無過去名，無現在名，無未來名；無眾生名，無非眾生名；無國土名，無非國土名；無法名，無非法名；無功德名，無非功德名；無菩薩名，無佛名；無數名，無非數名；無生名，無滅名；無有名，無無名；無一名，無種種名。何以故？諸法體性不可說故。一切諸法無方無處，不可集說，不可散說，不可一說，不可多說，音聲莫逮，言語悉斷，雖隨世俗種種言說，無所攀緣，無所造作，遠離一切虛妄想著，如是究竟到於彼岸。是為第九善巧方便。一切諸佛知一切法本性寂靜，無生故非色，無戲論故非受，無名數故非想，無造作故非行，無執取故非識，無入處故非處，無所得故非界，然亦不壞一切諸法，本性無起如虛空故。一切諸法皆悉空寂，無業果，無修習，無成就，無出生，非數、非不數，非有、非無，非生、非滅，非垢、非淨，非入、非出，非住、非不住，非調伏、非不調伏，非眾生、非無眾生，非壽命、非無壽命，非因緣、非無因緣，而能了知正定、邪定及不定聚一切眾生，為說妙法令到彼岸，成就十力、四無所畏，能師子吼，具一切智，住佛境界，是為第十善巧方便。佛子！是為諸佛成就十種善巧方便。之二「\n\n**（22）十種廣大佛事（無量無邊不可思議）**：\n\n> 佛子！諸佛世尊有十種廣大佛事，無量無邊，不可思議，一切世間諸天及人皆不能知，去、來、現在所有一切聲聞、獨覺亦不能知，唯除如來威神之力。何等為十？所謂：「一切諸佛於盡虛空遍法界一切世界兜率陀天，皆現受生，修菩薩行，作大佛事，無量色相，無量威德，無量光明，無量音聲，無量言辭，無量三昧，無量智慧所行境界，攝取一切人、天、魔、梵、沙門、婆羅門、阿脩羅等，大慈無礙，大悲究竟，平等饒益一切眾生，或令生天，或令生人，或淨其根，或調其心，或時為說差別三乘，或時為說圓滿一乘，普皆濟度，令出生死，是為第一廣大佛事。「佛子！一切諸佛從兜率天降神母胎，以究竟三昧觀受生法如幻、如化、如影、如空、如熱時焰，隨樂而受，無量無礙，入無諍法，起無著智，離欲清淨，成就廣大妙莊嚴藏，受最後身，住大寶莊嚴樓閣而作佛事，或以神力而作佛事，或以正念而作佛事，或現神通而作佛事，或現智日而作佛事，或現諸佛廣大境界而作佛事，或現諸佛無量光明而作佛事，或入無數廣大三昧而作佛事，或現從彼諸三昧起而作佛事。佛子！如來爾時在母胎中，為欲利益一切世間種種示現而作佛事。所謂：或現初生，或現童子，或現在宮，或現出家，或復示現成等正覺，或復示現轉妙法輪，或示現於入般涅槃，如是皆以種種方便，於一切方、一切網、一切族、一切種、一切世界中而作佛事。是為第二廣大佛事。「佛子！一切諸佛一切善業皆已清淨，一切生智皆已明潔，而以生法誘導群迷，令其開悟，具行眾善。為眾生故，示誕王宮，一切諸佛於諸色欲宮殿妓樂皆已捨離，無所貪染，常觀諸有空無體性，一切樂具悉不真實，持佛淨戒究竟圓滿；觀諸內宮妻妾、侍從生大悲愍，觀諸眾生虛妄不實起大慈心，觀諸世間無一可樂而生大喜，於一切法心得自在而起大捨；具佛功德，現生法界，身相圓滿，眷屬清淨，而於一切皆無所著；以隨類音為眾演說，令於世法深生厭離，如其所行示所得果，復以方便隨應教化；未成熟者令其成熟，已成熟者令得解脫，為作佛事令不退轉；復以廣大慈悲之心，恒為眾生說種種法，又為示現三種自在，令其開悟，心得清淨。雖處內宮，眾所咸覩，而於一切諸世界中施作佛事；以大智慧，以大精進，示現種種諸佛神通，無礙無盡。恒住三種巧方便業，所謂：身業究竟清淨、語業常隨智慧而行、意業甚深無有障礙，以是方便利益眾生。是為第三廣大佛事。「佛子！一切諸佛示處種種莊嚴宮殿，觀察厭離，捨而出家，欲使眾生了知世法皆是妄想、無常、敗壞，深起厭離，不生染著，永斷世間貪愛煩惱，修清淨行，利益眾生。當出家時，捨俗威儀，住無諍法，滿足本願無量功德，以大智光滅世癡闇，為諸世間無上福田，常為眾生讚佛功德，令於佛所植諸善本，以智慧眼見真實義；復為眾生讚說出家，清淨無過，永得出離，長為世間智慧高幢。是為第四廣大佛事。「佛子！一切諸佛具一切智，於無量法悉已知見，菩提樹下成最正覺，降伏眾魔，威德特尊。其身充滿一切世界，神力所作無邊無盡，於一切智所行之義皆得自在，修諸功德悉已圓滿。其菩提座具足莊嚴，周遍十方一切世界，佛處其上轉妙法輪，說諸菩薩所有行願，開示無量諸佛境界，令諸菩薩皆得悟入，修行種種清淨妙行。復能示導一切眾生令種善根，生於如來平等地中，住諸菩薩無邊妙行，成就一切功德勝法，一切世界、一切眾生、一切佛剎、一切諸法、一切菩薩、一切教化、一切三世、一切調伏、一切神變、一切眾生心之樂欲，悉善了知而作佛事。是為第五廣大佛事。「佛子！一切諸佛轉不退法輪，令諸菩薩不退轉故；轉無量法輪，令一切世間咸了知故；轉開悟一切法輪，能大無畏師子吼故；轉一切法智藏法輪，開法藏門，除闇障故；轉無礙法輪，等虛空故；轉無著法輪，觀一切法非有無故；轉照世法輪，令一切眾生淨法眼故；轉開示一切智法輪，悉遍一切三世法故；轉一切佛同一法輪，一切佛法不相違故。一切諸佛以如是等無量無數百千億那由他法輪，隨諸眾生心行差別而作佛事不可思議。是為第六廣大佛事。「佛子！一切諸佛入於一切王都城邑，為諸眾生而作佛事，所謂；人王都邑、天王都邑，龍王、夜叉王、乾闥婆王、阿脩羅王、迦樓羅王、緊那羅王、摩睺羅伽王、羅剎王、毘舍闍王，如是等王一切都邑。入城門時，大地震動，光明普照，盲者得眼，聾者得耳，狂者得心，裸者得衣，諸憂苦者悉得安樂；一切樂器不鼓自鳴，諸莊嚴具若著、不著咸出妙音，眾生聞者無不欣樂。一切諸佛色身清淨，相好具足，見者無厭，能為眾生作於佛事。所謂：若顧視，若觀察，若動轉，若屈伸，若行，若住，若坐，若臥，若默，若語，若現神通，若為說法，若有教敕，如是一切皆為眾生而作佛事。一切諸佛普於一切無數世界種種眾生心樂海中，勸令念佛，常勤觀察，種諸善根，修菩薩行；歎佛色相微妙第一，一切眾生難可值遇，若有得見而興信心，則生一切無量善法，集佛功德普皆清淨。如是稱讚佛功德已，分身普往十方世界，令諸眾生，悉得瞻奉，思惟觀察，承事供養，種諸善根，得佛歡喜，增長佛種，悉當成佛。以如是行而作佛事，或為眾生示現色身，或出妙音，或但微笑，令其信樂，頭頂禮敬，曲躬合掌，稱揚讚歎，問訊起居而作佛事。一切諸佛以如是等無量無數不可言說不可思議種種佛事，於一切世界中，隨諸眾生心之所樂，以本願力、大慈悲力、一切智力，方便教化，悉令調伏。是為第七廣大佛事。「佛子！一切諸佛或住阿蘭若處而作佛事；或住寂靜處而作佛事；或住空閑處而作佛事；或住佛住處而作佛事；或住三昧而作佛事；或獨處園林而作佛事；或隱身不現而作佛事；或住甚深智而作佛事；或住諸佛無比境界而作佛事；或住不可見種種身行，隨諸眾生心樂欲解，方便教化無有休息，而作佛事；或以天身求一切智而作佛事；或以龍身、夜叉身、乾闥婆身、阿脩羅身、迦樓羅身、緊那羅身、摩睺羅伽、人、非人等身，求一切智而作佛事；或以聲聞身、獨覺身、菩薩身，求一切智而作佛事；或時說法，或時寂默，而作佛事；或說一佛，或說多佛，而作佛事；或說諸菩薩一切行、一切願，為一行願而作佛事；或說諸菩薩一行、一願，為無量行願而作佛事；或說佛境界即世間境界而作佛事；或說世間境界即佛境界而作佛事；或說佛境界即非境界而作佛事；或住一日，或住一夜，或住半月，或住一月，或住一年，乃至住不可說劫，為諸眾生而作佛事。是為第八廣大佛事。「佛子！一切諸佛是生清淨善根之藏，令諸眾生於佛法中生淨信解，諸根調伏，永離世間；令諸菩薩於菩提道，具智慧明，不由他悟。或現涅槃而作佛事；或現世間皆悉無常而作佛事；或說佛身而作佛事；或說所作皆悉已辦而作佛事；或說功德圓滿無缺而作佛事；或說永斷諸有根本而作佛事；或令眾生，厭離世間，隨順佛心，而作佛事；或說壽命終歸於盡而作佛事；或說世間無一可樂而作佛事；或為宣說盡未來際供養諸佛而作佛事；或說諸佛轉淨法輪，令其得聞生大歡喜，而作佛事；或為宣說諸佛境界，令其發心而修諸行，而作佛事；或為宣說念佛三昧，令其發心常樂見佛，而作佛事；或為宣說諸根清淨，勤求佛道，心無懈退，而作佛事；或詣一切諸佛國土，觀諸境界種種因緣而作佛事；或攝一切諸眾生身皆為佛身，令諸懈怠放逸眾生悉住如來清淨禁戒，而作佛事。是為第九廣大佛事。「佛子！一切諸佛入涅槃時，無量眾生悲號涕泣，生大憂惱，遞相瞻顧而作是言：『如來世尊有大慈悲，哀愍饒益一切世間，與諸眾生為救為歸。如來出現難可值遇，無上福田於今永滅。』即以如是，令諸眾生悲號戀慕，而作佛事。復為化度一切天人、龍神、夜叉、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽、人、非人等故，隨其樂欲，自碎其身以為舍利，無量無數不可思議，令諸眾生起淨信心，恭敬尊重，歡喜供養，修諸功德，具足圓滿。復起於塔，種種嚴飾，於諸天宮、龍宮、夜叉宮，乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽、人、非人等諸宮殿中，以為供養。牙齒、爪髮咸以起塔，令其見者皆悉念佛、念法、念僧，信樂不回，誠敬尊重，在在處處布施供養、修諸功德；以是福故，或生天上，或處人間，種族尊榮，財產備足，所有眷屬悉皆清淨，不入惡趣，常生善道，恒得見佛，具眾白法，於三有中速得出離，各隨所願獲自乘果，於如來所知恩報恩，永與世間作所歸依。\n\n**（23）廣大佛事·第十（雖般涅槃仍為福田）并結勸**：\n\n> 佛子！諸佛世尊雖般涅槃，仍與眾生作不思議清淨福田、無盡功德最上福田，令諸眾生善根具足、福德圓滿。是為第十廣大佛事。「佛子！此諸佛事無量廣大、不可思議，一切世間諸天及人及去來今聲聞、獨覺皆不能知，唯除如來威神所加。「\n\n**（24）十種無二行自在法**：\n\n> 佛子！諸佛世尊有十種無二行自在法。何等為十？所謂：一切諸佛悉能善說，授記言辭，決定無二；一切諸佛悉能隨順眾生心念，令其意滿，決定無二；一切諸佛悉能現覺一切諸法，演說其義，決定無二；一切諸佛悉能具足去、來、今世諸佛智慧，決定無二；一切諸佛悉知三世一切剎那即一剎那，決定無二；一切諸佛悉知三世一切佛剎入一佛剎，決定無二；一切諸佛悉知三世一切佛語即一佛語，決定無二；一切諸佛悉知三世一切諸佛，與其所化一切眾生，體性平等，決定無二；一切諸佛悉知世法及諸佛法性無差別，決定無二；一切諸佛悉知三世一切諸佛所有善根同一善根，決定無二。是為十。「\n\n**（25）十種住，住一切法**：\n\n> 佛子！諸佛世尊有十種住，住一切法。何等為十？所謂：一切諸佛住覺悟一切法界；一切諸佛住大悲語；一切諸佛住本大願；一切諸佛住不捨調伏眾生；一切諸佛住無自性法；一切諸佛住平等利益；一切諸佛住無忘失法；一切諸佛住無障礙心；一切諸佛住恒正定心；一切諸佛住等入一切法，不違實際相。是為十。「\n\n**（26）十種知一切法盡無有餘**：\n\n> 佛子！諸佛世尊有十種知一切法盡無有餘。何等為十？所謂：知過去一切法盡無有餘；知未來一切法盡無有餘；知現在一切法盡無有餘；知一切言語法盡無有餘；知一切世間道盡無有餘；知一切眾生心盡無有餘；知一切菩薩善根上、中、下種種分位盡無有餘；知一切佛圓滿智及諸善根不增不減盡無有餘；知一切法皆從緣起盡無有餘；知一切世界種盡無有餘；知一切法界中如因陀羅網諸差別事盡無有餘。是為十。「\n\n**（27）十種力**：\n\n> 佛子！諸佛世尊有十種力。何等為十？所謂：廣大力、最上力、無量力、大威德力、難獲力、不退力、堅固力、不可壞力、一切世間不思議力、一切眾生無能動力。是為十。「\n\n**（28）十種大那羅延幢勇健法**：\n\n> 佛子！諸佛世尊有十種大那羅延幢勇健法。何者為十？所謂：「一切諸佛，身不可壞，命不可斷，世間毒藥所不能中，一切世界水、火、風災皆於佛身不能為害。一切諸魔、天、龍、夜叉、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽、人、非人、毘舍闍、羅剎等，盡其勢力，雨大金剛如須彌山及鐵圍山，遍於三千大千世界，一時俱下，不能令佛心有驚怖，乃至一毛亦不搖動，行、住、坐、臥初無變易。佛所住處四方遠近，不令其下則不能雨；假使不制而從雨之，終不為損。若有眾生為佛所持及佛所使，尚不可害，況如來身！是為諸佛第一大那羅延幢勇健法。佛子！一切諸佛以一切法界諸世界中須彌山王，及鐵圍山、大鐵圍山、大海、山林、宮殿、屋宅，置一毛孔，盡未來劫，而諸眾生不覺不知，唯除如來神力所被。佛子！爾時，諸佛於一毛孔持於爾所一切世界，盡未來劫，或行、或住、或坐、或臥，不生一念勞倦之心。佛子！譬如虛空普持一切遍法界中所有世界而無勞倦，一切諸佛於一毛孔持諸世界亦復如是。是為諸佛第二大那羅延幢勇健法。「佛子！一切諸佛能於一念起不可說不可說世界微塵數步，一一步過不可說不可說佛剎微塵數國土，如是而行，經一切世界微塵數劫。佛子！假使有一大金剛山，與上所經一切佛剎其量正等。如是量等大金剛山，有不可說不可說佛剎微塵數，諸佛能以如是諸山置一毛孔。佛身毛孔與法界中一切眾生毛孔數等，一一毛孔悉置爾許大金剛山，持爾許山遊行十方，入盡虛空一切世界，從於前際盡未來際，一切諸劫無有休息，佛身無損亦不勞倦，心常在定無有散亂。是為諸佛第三大那羅延幢勇健法。「佛子！一切諸佛一坐食已，結跏趺坐，經前後際不可說劫，入佛所受不思議樂，其身安住，寂然不動，亦不廢捨化眾生事。佛子！假使有人於遍虛空一一世界悉以毛端次第度量，諸佛能於一毛端處結跏趺坐，盡未來劫；如一毛端處，一切毛端處悉亦如是。佛子！假使十方一切世界所有眾生，一一眾生其身大小悉與不可說佛剎微塵數世界量等，輕重亦爾，諸佛能以爾所眾生置一指端，盡於後際所有諸劫；一切指端皆亦如是，盡持爾許一切眾生入遍虛空一一世界，盡於法界悉使無餘，而佛身心曾無勞倦。是為諸佛第四大那羅延幢勇健法。「佛子！一切諸佛能於一身化現不可說不可說佛剎微塵數頭，一一頭化現不可說不可說佛剎微塵數舌，一一舌化出不可說不可說佛剎微塵數差別音聲——法界眾生靡不皆聞，一一音聲演不可說不可說佛剎微塵數修多羅藏，一一修多羅藏演不可說不可說佛剎微塵數法，一一法有不可說不可說佛剎微塵數文字句義；如是演說，盡不可說不可說佛剎微塵數劫；盡是劫已，復更演說，盡不可說不可說佛剎微塵數劫；如是次第，乃至盡於一切世界微塵數，盡一切眾生心念數。未來際劫猶可窮盡，如來化身所轉法輪無有窮盡。所謂：智慧演說法輪、斷諸疑惑法輪、照一切法法輪、開無礙藏法輪、令無量眾生歡喜調伏法輪、開示一切諸菩薩行法輪、高昇圓滿大智慧日法輪、普然照世智慧明燈法輪、辯才無畏種種莊嚴法輪。如一佛身以神通力轉如是等差別法輪，一切世法無能為諭。如是，盡虛空界一一毛端分量之處，有不可說不可說佛剎微塵數世界，一一世界中念念現不可說不可說佛剎微塵數化身，一一化身皆亦如是，所說音聲文字句義，一一充滿一切法界，其中眾生皆得解了，而佛言音無變、無斷、無有窮盡。是為諸佛第五大那羅延幢勇健法。「佛子！一切諸佛皆以德相莊嚴胸臆，猶若金剛不可損壞，菩提樹下結跏趺坐。魔王軍眾其數無邊，種種異形甚可怖畏，眾生見者靡不驚懾，悉發狂亂或時致死。如是魔眾遍滿虛空。如來見之，心無恐怖，容色不變，一毛不豎，不動不亂，無所分別，離諸喜怒，寂然清淨，住佛所住，具慈悲力，諸根調伏，心無所畏，非諸魔眾所能傾動，而能摧伏一切魔軍皆使迴心、稽首歸依，然後復以三輪教化，令其悉發阿耨多羅三藐三菩提意永不退轉。是為諸佛第六大那羅延幢勇健法。「佛子！一切諸佛有無礙音，其音普遍十方世界，眾生聞者自然調伏。彼諸如來所出音聲，須彌盧等一切諸山不能為障，天宮、龍宮、夜叉宮，乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽、人、非人等一切諸宮所不能障，一切世界高大音聲亦不能障。隨所應化，一切眾生靡不皆聞，文字句義悉得解了。是為諸佛第七大那羅延幢勇健法。「佛子！一切諸佛心無障礙，於百千億那由他不可說不可說劫，恒善清淨。去、來、現在一切諸佛同一體性，無濁、無翳，無我、無我所，非內、非外，了境空寂，不生妄想；無所依，無所作，不住諸相，永斷分別；本性清淨，捨離一切攀緣憶念，於一切法常無違諍；住於實際，離欲清淨，入真法界，演說無盡；離量、非量所有妄想，絕為、無為一切言說，於不可說無邊境界悉已通達；無礙無盡智慧方便，成就十力一切功德莊嚴清淨，演說種種無量諸法，皆與實相不相違背；於諸法界三世諸法，悉等無異，究竟自在；入一切法最勝之藏，一切法門正念不惑，安住十方一切佛剎而無動轉；得不斷智，知一切法究竟無餘，盡諸有漏，心善解脫，慧善解脫，住於實際，通達無礙，心常正定；於三世法及以一切眾生心行，一念了達，皆無障礙。是為諸佛第八大那羅延幢勇健法。「佛子！一切諸佛同一法身、境界無量身、功德無邊身、世間無盡身、三界不染身、隨念示現身、非實非虛平等清淨身、無來無去無為不壞身、一相無相法自性身、無處無方遍一切身、神變自在無邊色相身、種種示現普入一切身、妙法方便身、智藏普照身、示法平等身、普遍法界身、無動無分別非有非無常清淨身、非方便非不方便非滅非不滅隨所應化一切眾生種種信解而示現身、從一切功德寶所生身、具一切諸佛法真如身、本性寂靜無障礙身、成就一切無礙法身、遍住一切清淨法界身、分形普遍一切世間身、無攀緣無退轉永解脫具一切智普了達身，是為諸佛第九大那羅延幢勇健法。「佛子！一切諸佛等悟一切諸如來法，等修一切諸菩薩行；若願若智，清淨平等，猶如大海，悉得滿足；行力尊勝，未曾退怯，住諸三昧無量境界，示一切道，勸善誡惡；智力第一演法無畏，隨有所問悉能善答，智慧說法平等清淨，身、語、意行悉皆無雜，住佛所住諸佛種性，以佛智慧而作佛事；住一切智，演無量法，無有根本，無有邊際，神通智慧不可思議，一切世間無能解了；智慧深入，見一切法微妙廣大無量無邊，三世法門咸善通達，一切世界悉能開曉；以出世智，於諸世間作不可說種種佛事，成不退智，入諸佛數；雖已證得不可言說離文字法，而能開示種種言辭；以普賢智集諸善行，成就一念相應妙慧，於一切法悉能覺了，如先所念一切眾生，皆依自乘而施其法；一切諸法、一切世界、一切眾生、一切三世，於法界內，如是境界其量無邊，以無礙智悉能知見。佛子！一切諸佛於一念頃，隨所應化出興於世，住清淨土，成等正覺，現神通力，開悟三世一切眾生心、意及識不失於時。佛子！眾生無邊，世界無邊，法界無邊，三世無邊，諸佛最勝亦無有邊，悉現於中成等正覺，以佛智慧方便開悟無有休息。佛子！一切諸佛以神通力，現最妙身，住無邊處，大悲方便，心無障礙，於一切時常為眾生演說妙法。是為諸佛第十大那羅延幢勇健法。「佛子！此一切諸佛大那羅延幢勇健法無量無邊、不可思議，去、來、現在一切眾生及以二乘不能解了，唯除如來神力所加。「\n\n**（29）十種決定法**：\n\n> 佛子！諸佛世尊有十種決定法。何等為十？所謂：一切諸佛定從兜率壽盡下生；一切諸佛定示受生，處胎十月；一切諸佛定厭世俗，樂求出家；一切諸佛決定坐於菩提樹下成等正覺，悟諸佛法；一切諸佛定於一念悟一切法，一切世界示現神力；一切諸佛定能應時轉妙法輪；一切諸佛定能隨彼所種善根，應時說法而為授記；一切諸佛定能應時為作佛事；一切諸佛定能為諸成就菩薩而授記別；一切諸佛定能一念普答一切眾生所問。是為十。「\n\n**（30）十種速疾法**：\n\n> 佛子！諸佛世尊有十種速疾法。何等為十？所謂：一切諸佛若有見者，速得遠離一切惡趣；一切諸佛若有見者，速得圓滿殊勝功德；一切諸佛若有見者，速能成就廣大善根；一切諸佛若有見者，速得往生淨妙天上；一切諸佛若有見者，速能除斷一切疑惑；一切諸佛若已發菩提心而得見者，速得成就廣大信解永不退轉，能隨所應教化眾生，若未發心即能速發阿耨多羅三藐三菩提心；一切諸佛若未入正位而得見者，速入正位；一切諸佛若有見者，速能清淨世、出世間一切諸根；一切諸佛若有見者，速得除滅一切障礙；一切諸佛若有見者，速能獲得無畏辯才。是為十。「\n\n**（31）十種應常憶念清淨法**：\n\n> 佛子！諸佛世尊有十種應常憶念清淨法。何等為十？所謂：一切諸佛過去因緣，一切菩薩應常憶念；一切諸佛清淨勝行，一切菩薩應常憶念；一切諸佛滿足諸度，一切菩薩應常憶念；一切諸佛成就大願，一切菩薩應常憶念；一切諸佛積集善根，一切菩薩應常憶念；一切諸佛已具梵行，一切菩薩應常憶念；一切諸佛現成正覺，一切菩薩應常憶念；一切諸佛色身無量，一切菩薩應常憶念；一切諸佛神通無量，一切菩薩應常憶念；一切諸佛十力無畏，一切菩薩應常憶念。是為十。「\n\n**（32）十種一切智住**：\n\n> 佛子！諸佛世尊有十種一切智住。何等為十？所謂：一切諸佛於一念中，悉知三世一切眾生心、心所行；一切諸佛於一念中，悉知三世一切眾生所集諸業及業果報；一切諸佛於一念中，悉知一切眾生所宜，以三種輪教化調伏；一切諸佛於一念中，盡知法界一切眾生所有心相，於一切處普現佛興，令其得見，方便攝受；一切諸佛於一念中，普隨法界一切眾生心樂欲解，示現說法，令其調伏；一切諸佛於一念中，悉知法界一切眾生心之所樂，為現神力；一切諸佛於一念中，遍一切處，隨所應化一切眾生示現出興，為說佛身不可取著；一切諸佛於一念中，普至法界一切處一切眾生彼彼諸道；一切諸佛於一念中，隨諸眾生有憶念者，在在處處無不往應；一切諸佛於一念中，悉知一切眾生解欲，為其示現無量色相。是為十。「\n\n**（33）十種無量不可思議佛三昧**：\n\n> 佛子！諸佛世尊有十種無量不可思議佛三昧。何等為十？所謂：一切諸佛恒在正定，於一念中遍一切處，普為眾生廣說妙法；一切諸佛恒在正定，於一念中遍一切處，普為眾生說無我際；一切諸佛恒住正定，於一念中遍一切處，普入三世；一切諸佛恒在正定，於一念中遍一切處，普入十方廣大佛剎；一切諸佛恒在正定，於一念中遍一切處，普現無量種種佛身；一切諸佛恒在正定，於一念中遍一切處，隨諸眾生種種心解現身、語、意；一切諸佛恒在正定，於一念中遍一切處，說一切法離欲真際；一切諸佛恒住正定，於一念中遍一切處，演說一切緣起自性；一切諸佛恒住正定，於一念中遍一切處，示現無量世、出世間廣大莊嚴，令諸眾生常得見佛；一切諸佛恒住正定，於一念中遍一切處，令諸眾生悉得通達一切佛法、無量解脫，究竟到於無上彼岸。是為十。「\n\n**（34）十種無礙解脫**：\n\n> 佛子！諸佛世尊有十種無礙解脫。何等為十？所謂：一切諸佛能於一塵現不可說不可說諸佛出興於世；一切諸佛能於一塵現不可說不可說諸佛轉淨法輪；一切諸佛能於一塵現不可說不可說眾生受化調伏；一切諸佛能於一塵現不可說不可說諸佛國土；一切諸佛能於一塵現不可說不可說菩薩授記；一切諸佛能於一塵現去、來、今一切諸佛；一切諸佛能於一塵現去、來、今諸世界種；一切諸佛能於一塵現去、來、今一切神通；一切諸佛能於一塵現去、來、今一切眾生；一切諸佛能於一塵現去、來、今一切佛事。是為十。\n\n## 三、旁参与前接\n\n**承前**：品32〈諸菩薩住處品〉明菩萨遍一切处（因位之栖）；本品转入**佛果**（果海之体）——澄观判此下五品共答第二会初「如來地等二十句問」（§5.1）：十定·十通·十忍·阿僧祇·壽量·住處·本品……果分渐次展开。\n\n**启后**：品34〈十身相海品〉别明佛身相好（本品「佛身云何不思議」一问之展开）；品35〈隨好光明品〉别明随好——本品总说果海，后二品分说身相。\n\n## 四、义理要点\n\n**【要点提炼】**\n\n1. **念请**：本品无口问——诸菩萨「作是念」十问，世尊「知諸菩薩心之所念」而加持青蓮華藏作答。**问在念中，答亦念通**——因果隔绝之处，唯心念可渡（澄观：「由因果隔絕念法希聞……故念請耳」§5.1）。\n2. **双莲华藏对答**：青蓮華藏告蓮華藏——问答双方同标「蓮華藏」，加持链为「世尊加持→青蓮華藏住佛無畏→承佛神力→告蓮華藏」。**能说所说同名，主伴一体**〔本文判断：莲华藏即华藏世界之名，佛果功德藏于莲华藏世界，故答者与闻者共此名〕。\n3. **三十四节十种法**：「何等為十？……是為十」三十四叠（「何者為十」变体3处）——佛果功德以**34×10 网格**总集：身土·愿种·出现·音声·智慧·自在·无碍·解脱，十问十答之外更广之（实测 30 节名目见§2.3 表）。\n4. **「一念」与「一尘」之眼**：全品高频句眼——「於一念中悉能示現無量世界……」「能於一塵現不可說不可說諸佛國土」——以念·尘之**最小量**摄世界之**最大量**，不思议之公式。\n\n**【阐释】**（〔本文判断〕）本品是全经**果分总说**之品：十地以降，因位之行（住·行·向·地·等觉）至此翻为果海之德。其说理策略不是论证而是**枚举的溢出**——三百项功德逐项立名，名与名之间无逻辑推进而只显「更多、更广、更不可穷」；读至第二十节，读者已不再试图逐项把握，而被「是為十」的复沓节拍带入**量的眩晕**——这正是枚举修辞的目的：以可数逼显不可数。与品28〈阿僧祇品〉的数法链同为「以量逼显」笔法，彼以数之递进，此以德之罗列。\n\n**【启发】**读此品不必逐项记忆 300 项——宜取「一念·一尘」两个句眼为纲：凡见「於一念中悉能示現」与「能於一塵現」处，即是**小大相入**之关节。会读此品，与其问「佛果有什么」，不如问「为什么必须用三十节说」——果海若可一言尽，则十地之行皆戏论；果海若终不可说，则此品成妄语。经文以三十节立于两难之间：**说即无说，节节皆指**。\n\n**【对照】**：六十华严无直接对应品（其果德散在〈盧舍那佛品〉）〔待核〕；四十华严（T0293）唯〈入法界品〉无本品〔实测：T0293 卷首无此品题〕。本品「十种念念出生智」一节与〈如來出現品〉（品37）十喻互为表里〔待深化批〕。\n\n## 五、注疏选要\n\n### 5.1 澄观（`T1735`）\n\n> 佛不思議法品第三十三（已上入第四十六經）初明來意。先通後別。通則此下五品。為答第二會初如來地等二十句問故。古德但有三品答前。謂前明修生之因。今辨修生之果。因圓果滿故次來也。若答前問。何以重請。由因果隔絕念法希聞。因德尚深。果必玄妙。故念請耳。\n\n（《疏》卷释文·本品来意——「先通後別」判此品与后四品（十身相海·随好·普贤行·如来出现）共答第二会初二十句问；「因圆果满故次来」即本品在果分中之枢纽位。）\n\n### 5.2 诸家（深化批补引·存目）\n\n## 六、文本对读\n\n### 6.3 藏译（Toh 44 对应章）\n\n**青蓮華藏对答实测**〔L.269〕：德格本 TOC 藏37（fol 393b）后接藏38（fol 394b）两章连说——与本品跨四卷之长篇果分对应关系待逐字勘定〔待核〕（汉译本品无「心念十问」之独立章首标志，藏译分章界线或异）。\n\n## 七、数据层（L1 实测）\n\n| 指标 | 值 |\n|---|---|\n| CJK（净） | **13 function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}

}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}

</script>
</body>
