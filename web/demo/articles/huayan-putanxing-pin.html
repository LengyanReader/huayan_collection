  var NAMES = Object.keys(MAP).sort(function(a,b){return b.length-a.length;});
  var BASE = '../famai/shanhe.html';
  function skip(node){
    var p = node.parentElement;
    while(p && p !== document.body){
      var tag = p.tagName;
      if(tag==='A'||tag==='CODE'||tag==='PRE'||tag==='BLOCKQUOTE') return true;
      var cls = p.getAttribute ? (p.getAttribute('class')||'') : '';
      if(/\b(q|quote|cite-card|lic)\b/.test(cls)) return true;
      p = p.parentElement;
    }
    return false;
  }
  function linkify(){
    var root = document.getElementById('article-root');
    if(!root) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var edits = [];
    var tn;
    while((tn = walker.nextNode())){
      if(skip(tn)) continue;
      var text = tn.textContent;
      for(var i=0;i<NAMES.length;i++){
        var nm = NAMES[i], pos = text.indexOf(nm);
        if(pos < 0) continue;
        edits.push({node:tn, name:nm, pid:MAP[nm], pos:pos});
        break;
      }
    }
    for(var j=edits.length-1;j>=0;j--){
      var e = edits[j];
      var t = e.node.textContent;
      var idx = t.indexOf(e.name);
      if(idx < 0) continue;
      var before = t.slice(0, idx), after = t.slice(idx + e.name.length);
      var a = document.createElement('a');
      a.href = BASE + '?master=' + e.pid;
      a.className = 'lin-deeplink';
      a.title = '在山河法脉地图中展开 ' + e.name;
      a.textContent = e.name;
      var frag = document.createDocumentFragment();
      if(before) frag.appendChild(document.createTextNode(before));
      frag.appendChild(a);
      if(after) frag.appendChild(document.createTextNode(after));
      e.node.parentNode.replaceChild(frag, e.node);
    }
    if(edits.length) console.log('[lin-deeplink] linked ' + edits.length + ' mentions');
  }
  if(document.readyState==='complete') setTimeout(linkify,100);
  else window.addEventListener('load', function(){ setTimeout(linkify,100); });
})();
</script>

<script>
var ARTICLE = {"id": "huayan-putanxing-pin", "file": "articles/huayan-putanxing-pin.html", "title": "九九华严第三十六品 普贤行品之拼读", "title_sub": "", "icon": "🙏", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第七会_普光明殿_等觉/华严经细读_第三十六部_普贤行品.md", "doc_md": "# 华严经细读·第三十六部《普贤行品》之拼读\n\n> **EN · The Chapter on the Practices of Samantabhadra**\n\n> **底本**：八十华严 `T10n0279`。**范围：卷第四十九～五十（普賢行品第三十六·本品全文）**。本品属**第七会「普光明殿会」·等觉果分（平等因果之因）**。\n\n---\n\n## 〇、凡例\n\n一、底本 `T10n0279`。二、引文程序注入（0 手抄·逐字回源）。三、存疑标〔待核〕推断标〔本文判断〕。四、体量自陈：**全文成篇**（品首百万障＋六段十法链＋偈颂全引）。\n\n<!-- ATLAS:BEGIN P34 -->\n### 〇之零、导读指南（阅读路径与方法）\n\n**定位：** 考证型细读（philological close reading），以「可复核性」为第一优先。本品 4,685 CJK，普贤复告——先立全品之纲「我不見一法為大過失，如諸菩薩於他菩薩起瞋心者」（瞋心成百万障门·86 种实测），继以五阶十法递进链（清淨→廣大智→普入→勝妙心→善巧智）与受持劝，终以 2,420 字长偈自誓——读法以**行有次第，故因果平等**为纲。\n**本品一句：** **我不見一法為大過失，如諸菩薩於他菩薩起瞋心者。**\n**路径：** 〇之二（二图四表）→ 一（品题与脉络）→ 二（全文逐段）→ 四（义理与名相）→ 五（诸家会读）→ 七（数据层）→ 附录按需查阅。\n**方法：** 先经文后诠释；〔实测〕／〔本文判断〕／〔存疑待核〕三分；负面证据同样入账；结构覆盖 100%，个体择要。\n**读前三问：** ①行品何不说行先说止（瞋）？②五阶连锁的语法何义？③偈颂自誓与重颂何别？\n\n## 〇之二、本品内容地图（未入其门，先观其海）\n\n> **本节体例。** 图与表之数据，一律取自本文已回源核定之 §二逐段表与 §7.1／§7.5 实测数；**凡属推断者标〔本文判断〕，不入图**。图各看一事，勿求一图而尽本品。\n\n### 〇之二.0 提要\n\n本品占**卷第四十九～五十**，剥校勘 **CJK 4,685 字**（长行 2,265＋偈 2,420·占 51%）。**长行 25 段＋偈组 1**；结构：**品首（百万障门 86 种）→ 五阶十法递进链 → 受持劝 → 长偈**。\n\n| 图 | 画什么 | 一句话 |\n|---|---|---|\n| **图 〇-1　百万障门图** | 一瞋开百万门 | 不見菩提障→離三世諸佛菩薩種性障 |\n| **图 〇-2　五阶连锁图** | 条件递进的行法语法 | 清淨→智→普入→勝妙心→善巧智 |\n\n**〔读法之序〕**　先观图 〇-1 以得其障（百万障门），次观图 〇-2 以得其阶（五阶连锁），次读 §2 全引与偈，末以 §7 核量。\n\n> **EN corresponding · Map of the Chapter.** Anger toward fellow bodhisattvas is the single greatest fault — one wrath opening a million obstacles (86 catalogued) — then a five-rung ladder from purity to skillful wisdom, sealed by a self-dedicating verse.\n\n### 〇之二.1 图 〇-1　百万障门图\n\n<figure>\n<svg viewBox=\"0 0 1000 220\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"26\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">百万障门（§2.1 实测 86 种）</text>\n<rect x=\"120\" y=\"52\" width=\"760\" height=\"52\" rx=\"8\" fill=\"#f6efe1\" stroke=\"#a04a3a\"/>\n<text x=\"500\" y=\"76\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"#a04a3a\">一念瞋起 → 百万门开</text>\n<text x=\"500\" y=\"94\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8a7a5e\">「我不見一法為大過失，如諸菩薩於他菩薩起瞋心者」</text>\n<text x=\"60\" y=\"140\" font-size=\"10\" fill=\"#5a5147\">不見菩提障</text><text x=\"216\" y=\"140\" font-size=\"10\" fill=\"#5a5147\">不聞正法</text><text x=\"372\" y=\"140\" font-size=\"10\" fill=\"#5a5147\">生不淨世界</text><text x=\"528\" y=\"140\" font-size=\"10\" fill=\"#5a5147\">生諸惡趣</text><text x=\"684\" y=\"140\" font-size=\"10\" fill=\"#5a5147\">生諸難處</text><text x=\"840\" y=\"140\" font-size=\"10\" fill=\"#5a5147\">多諸疾病</text><text x=\"60\" y=\"170\" font-size=\"10\" fill=\"#5a5147\">不見佛障</text><text x=\"216\" y=\"170\" font-size=\"10\" fill=\"#5a5147\">不聞法障</text><text x=\"372\" y=\"170\" font-size=\"10\" fill=\"#5a5147\">謗法障</text><text x=\"528\" y=\"170\" font-size=\"10\" fill=\"#5a5147\">謗善知識障</text><text x=\"684\" y=\"170\" font-size=\"10\" fill=\"#5a5147\">退菩提心障</text><text x=\"840\" y=\"170\" font-size=\"10\" fill=\"#5a5147\">遠離種性障…</text>\n<text x=\"500\" y=\"200\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5a5147\">86 种障名实测（首：不見菩提障；末：遠離三世諸佛菩薩種性障）——「百万」举其大数</text>\n</svg>\n<figcaption><b>图 〇-1　百万障门图。</b>百万障门：86 种障名实测（§2.1）。<div class=\"en-line\">Fig. 0-1. Eighty-six obstacles catalogued from one wrath.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. 读首末两障：障之极处是种性远离。\n2. 自照：一瞋验心。\n3. 对照品25念请：一念可请亦可障。\n\n### 〇之二.2 图 〇-2　五阶连锁图\n\n<figure>\n<svg viewBox=\"0 0 1000 240\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"26\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">五阶十法递进链（§2.2 六段全引）</text>\n<rect x=\"30\" y=\"70\" width=\"170\" height=\"70\" rx=\"10\" fill=\"#f6efe1\" stroke=\"#b8863c\"/>\n<text x=\"115\" y=\"98\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\" fill=\"#7a5a28\">①十種清淨</text>\n<text x=\"115\" y=\"120\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#8a7a5e\">通达甚深法…</text><rect x=\"220\" y=\"70\" width=\"170\" height=\"70\" rx=\"10\" fill=\"#f6efe1\" stroke=\"#b8863c\"/>\n<text x=\"305\" y=\"98\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\" fill=\"#7a5a28\">②十種廣大智</text>\n<text x=\"305\" y=\"120\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#8a7a5e\">知眾生心行…</text><rect x=\"410\" y=\"70\" width=\"170\" height=\"70\" rx=\"10\" fill=\"#f6efe1\" stroke=\"#b8863c\"/>\n<text x=\"495\" y=\"98\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\" fill=\"#7a5a28\">③十種普入</text>\n<text x=\"495\" y=\"120\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#8a7a5e\">世界入一毛道…</text><rect x=\"600\" y=\"70\" width=\"170\" height=\"70\" rx=\"10\" fill=\"#f6efe1\" stroke=\"#b8863c\"/>\n<text x=\"685\" y=\"98\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\" fill=\"#7a5a28\">④十種勝妙心</text>\n<text x=\"685\" y=\"120\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#8a7a5e\">住语言非语言…</text><rect x=\"790\" y=\"70\" width=\"170\" height=\"70\" rx=\"10\" fill=\"#f6efe1\" stroke=\"#b8863c\"/>\n<text x=\"875\" y=\"98\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\" fill=\"#7a5a28\">⑤十種佛法善巧智</text>\n<text x=\"875\" y=\"120\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#8a7a5e\">了達甚深佛…</text><text x=\"200\" y=\"110\" text-anchor=\"middle\" font-size=\"14\" fill=\"#7a5a28\">→</text><text x=\"390\" y=\"110\" text-anchor=\"middle\" font-size=\"14\" fill=\"#7a5a28\">→</text><text x=\"580\" y=\"110\" text-anchor=\"middle\" font-size=\"14\" fill=\"#7a5a28\">→</text><text x=\"770\" y=\"110\" text-anchor=\"middle\" font-size=\"14\" fill=\"#7a5a28\">→</text>\n<text x=\"500\" y=\"176\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5a5147\">连锁语法：「安住此十法已則能具足」「住此十智已則得入」——后阶以前阶为基（非科目清单）</text>\n<rect x=\"250\" y=\"196\" width=\"500\" height=\"34\" rx=\"8\" fill=\"none\" stroke=\"#d4a03c\" stroke-dasharray=\"5,3\"/>\n<text x=\"500\" y=\"218\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5147\">行有次第，故因果平等（澄观：會前差別因成此普賢之圓因）</text>\n</svg>\n<figcaption><b>图 〇-2　五阶连锁图。</b>五阶连锁：清净→智→普入→胜妙心→善巧智（§2.2）。<div class=\"en-line\">Fig. 0-2. A five-rung conditional ladder of tenfold sets.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. 沿链读：后阶以前阶为门。\n2. 自测：清净未成而求普入是躐等。\n3. 末对平等因果：行满即佛。\n\n### 〇之二.3 本品在第七会（普光明殿·等觉位）之坐标\n\n本品与如來出現（品35）共明「出現因果·平等因果」——前品称果之因，此品如因之果；启品35性起果德。\n\n| 品 | 卷 | 位／科 | 一句提撕 | 与本品之关系 |\n|---|---|---|---|---|\n| 隨好光明品（品 33） | 卷四十九 | 第七会·随好 | 果用归因行 | 本品承之自说行 |\n| 如來出現品（品 35） | 卷五十起 | 第七会·性起 | 普贤圆因→性起果 | 平等因果一双 |\n| 藏译 Toh 44 | 对应章〔核订〕 | 开篇待实测 | — | 逐字对勘未竟（L.312 矩阵已立） |\n| 澄观来意窗 | 「亦名平等因果」 | `T1735` §5.1 | 程序化实引 | 會前差別因果 |\n| 六十本 | 对应品待勘〔待核〕 | 晋译 | — | 对读未竟（L.312 矩阵已立） |\n\n### 〇之二.4 本品形式特征（与邻品对看）\n\n本品以瞋障论与五阶链为特征。\n\n| 特征 | 本品表现〔实测〕 | 邻品之对照 | 读法上的后果 |\n|---|---|---|---|\n| 篇幅 | 4,685 CJK／25 `<p>`＋1 `<lg>`（偈 2,420·51%） | 品33 的 2,777 | 偈占过半 |\n| 障门 | 86 种实测 | 「百万」举大数 | 瞋为第一过 |\n| 链结构 | 五阶条件连锁 | 品31 34节并列式 | 递进对并列 |\n| 偈性质 | 自誓（如彼所修行我當次第說） | 他品重颂 | 自誓非复述 |\n\n### 〇之二.5 五种读法（导览）\n\n| 读法 | 路径 | 适合谁 | 得什么 |\n|---|---|---|---|\n| 障门读法 | 图 〇-1 → §2.1 | 实修读者 | 一瞋百万障 |\n| 阶梯读法 | 图 〇-2 → §2.2 | 结构读者 | 条件连锁 |\n| 平等读法 | §4 阐释＋§5.1 | 义理读者 | 行满即佛 |\n| 偈读法 | §2.3 | 文学读者 | 自誓文体 |\n| 数据读法 | §7 | 数据读者 | 86障/51% |\n\n### 〇之二.6 数与位之谱：本品之数，四等分录\n\n华严之数非计数之数。本品所涉之数，来源不一，性质亦不一；**先分其等，后论其义**，则不为数目所惑。\n\n| 等第 | 数 | 出处 | 性质 |\n|---|---|---|---|\n| **T0 经文明文** | 百万障＋五阶链＋长偈 | §2（`T10n0279` 全引） | 结构总量 |\n| **T0 本文实测** | 4,685 CJK／86障 | §7 | 篇幅 |\n| **T1 注疏** | 平等因果窗（程序化） | `T1735` §5.1 | 先通后别 |\n| **勘正层** | 第六段如实标「聞法受持勸」 | L.271 | 非独立十种 |\n| **T0·六十本实测** | 待勘〔待核〕 | `T09n0278` | 对读未竟（L.312 矩阵已立） |\n\n> 【读法】本品之数以「**阶**」为性：一瞋之下、五阶之上——读时先自照瞋，再上阶。\n\n\n<!-- ATLAS:END P34 -->\n\n## 一、概述与品题解义\n\n**品名**：**普賢行品第三十六**。说主：**普賢菩薩**（「復告諸菩薩大眾言」——自续前说）。**实测**：品文净 **4,685 CJK**（长行 2,253＋偈颂 2,420），25 `<p>`＋1 `<lg>`。\n\n**【定位】**平等因果之因品——普贤承前自谦「如向所演……略說如來少分境界」，随即立全品之纲：**「我不見一法為大過失，如諸菩薩於他菩薩起瞋心者」**——瞋心成百万障门；继以**五阶十法递进链**（清淨→廣大智→普入→勝妙心→佛法善巧智）与闻法受持劝，终以长偈重颂菩萨愿行。澄观判此品与〈如來出現品〉共明**出現因果·平等因果**：「會前差別因。成此普賢之圓因」（§5.1）。\n\n**【一句】****一瞋障百万，十法五阶进；行是因，佛是果——平等因果自此会。**\n\n## 二、本品全文注\n\n### 2.0′ 玄记体总纲（据澄观《华严经疏》`T1735`·L.370·疏文程序切片回源）\n\n**门目（疏文实录·至釋文中前）**：\n\n> 普賢行品普賢行品\n>\n> 第三十六已下入\n>\n> 第四十九經初來意者,先通、後別。通謂二品,明出現因果,故次來也。亦名平等因果,謂會前差別因,成此普賢之圓因;會差別果,成性起出現之果。又前約修生,此約修顯故。若爾,何以更無別問?復何以差別果終而無瑞證,平等因竟便有瑞耶?即以此義,顯是會前,若更別問便有隔絕。\n>\n> 欲會前故,不以瑞隔,普法希奇因果各瑞。又前應有瑞,經來未盡,故所以無耳。別謂此品先因後果,義次第故。亦遠答前\n>\n> 第二會初所行問,及〈不思議品〉念請本願問故。前雖已答,下二深妙,故重明之,亦猶〈相海〉、〈隨好〉。而妙中之妙,古德別為一段因果。二釋名者,初通顯二品義名。依性起修、依性起用,差別相盡、因果體均,故云平等因果。又因是果因,量周法界;果是果果,境界如空。\n>\n> 因果俱盡未來利樂含識,故名出現。別則品名普賢,即標人顯法,明此行法非次第法。行者,顯法非人。品明所行,非說人體。德周法界為普,至順調善曰賢,依性造修曰行。然普賢行,諸經多有其名。品中雖廣,今略顯十義以表無盡。一所求普,謂要求證一切如來平等所證故;二所化普,一毛端處有多眾生皆化盡故;三所斷普,無有一惑而不斷故;四所行事行普,無有一行而不行故;五所行理行普,即上事行皆徹理源,性具足故;六無礙行普,上二交徹故;七融通行普,隨一一行融攝無盡故;八所起用普,用無不能,無不周故;九所行處普,上之八門遍帝網剎而修行故;十所行時普,窮三際時念劫圓融,無竟期故。\n>\n> 上之十行參而不雜,涉入重重,故善財入普賢一毛所得法門,過諸善友不可說倍。又上十行通收為二:若位後普賢,則得果不捨因,徹窮來際為普賢行,以人彰法則普賢之行;若位前位中普賢,則以德成人,但修普行即曰普賢,亦則普賢即行,但從行名故。\n>\n> 若獨位後普賢,則普賢之行無施下位,廣釋普賢如初會辨。三宗趣者,亦先通、後別。通以二品明平等因果為宗,會前差別為趣。別以此品明平等圓因為宗,成平等果無二為趣。\n\n**释文**（疏文实录）：\n\n釋文中二:此品辨因、後品明果。前中亦二:先長行直明、後以偈重顯。前中又二:先正說、後瑞證。今初,亦二:先明說因、後「佛子我不見」下正陳今義。前中亦二:先標前少說、後徵釋所由。今初。普賢說者,以人表法故。言如向者,一近指向前〈隨好〉一品,為於障重地獄眾生略說隨好少分用故,廣說難思。二通指前所說之果為少分境,果海絕言故。三遠通差別因果,雖有圓融之義,以五位漸次因果殊分,逐機就病未盡法源故名少分,則顯下平等因果逐法性說,因果圓融,名廣大說。二徵釋中,徵意云:何以前名少說?釋文二意:一者成上,諸佛世尊所以出世者,以眾生有無明等十過,未宜廣說故,先明差別等。二者生後,謂眾生既過滋多、障累無盡,則一治一切治、一現一切現,眾生無盡,因果亦窮未來際。前之所隨,由未盡故。言十過者,一者無明。二作惡行,晉經名諸纏,則亦是惑。此二為總。次六皆無明,三計我我所;四著身見,故六地云世間受身皆由著我;五三倒四倒等不能決斷;六乖僻正理;七遍計分別;八結縛常隨;九隨生死流義通業苦,因流果流故;十遠如來道,行邪徑故,此結成其失。結縛等名,如常所辨。第二正陳普賢行,中二:先明所治廣多、後「是故諸菩薩」下能治深妙。今初。既一惑成百萬障,則一障一切障,義則惑惑皆然。今從重說,文中三:初標、次徵釋、後結成。今初,總標瞋最重。除瞋之外,更遍推求,無有一惡如瞋之重,故晉經云「起一瞋心,一切惡中無過此惡。」《決定毘尼經》云「菩薩寧起百千貪心,不起一瞋,以違害大悲莫過此故。」《菩薩善戒》亦同此說。言於他菩薩者,若於菩薩起瞋,其過尤重,以令菩薩廢大行故。是以《大般若》中,天魔見諸菩薩互相是非,過常大喜。二「何以」下徵釋。釋中二:一總顯、二「何等」下徵列。標雖百萬,略列百門。古人寄位分五:初障十信行、二「不樂佛法」下障十住行、三「不得菩薩諸根」下障十行之行、四「樂誹謗一切」下障十向行、五「不樂與菩薩同住」下障十地行。言口如瘂羊障者,此是耳根障,以生邊地不聞法,是故口無所說。舌根之障,次下自明。昔結云:菩薩萬行不過此五,起一瞋心一切頓障。此釋非不有理,如賊心求法,豈獨障於地耶?是知通障,一切信尚不起,況後位耶。又所障法界如帝網重重,能障同所亦皆無盡,故知百萬猶是略明。三「佛子若菩薩」下結成可知。第二能治深妙,中二:先正顯、後結勸。今初,文有六位,位各十行。初一始修、後五成益,故後五段展轉依初,是為初即攝後,一治一切治也。說有前後,得即一時。今初,分二:先標舉勸修、後「何等」下徵列及結。於中,十法攝為五對,辨五種修。初二約人,明謙敬修,敬上愛下故;次二約法,明真正修,順教知事故;次二約心,行明廣大修,樂大行、堅大心故;次二約智,明增勝修,內入果智、外起勝辨故;後二約悲願,明長時修,眾生無盡悲化不疲,世界無邊願住不著故。第二清淨者,依前正修行,時成離染故。文中二:初躡前起後、後徵數列名,下皆倣此。例中十句,次第從前十句而成。一由不捨眾生故達深法淨,以眾生皆有佛性,即妄而真為深法故;二由敬上故能近;三由不謗故能護;四由知無盡故了如空;五由菩薩行不離法界故深入;六知菩提心等虛空故無邊;七觀察菩薩皆同此觀能入佛力,故名為根;八精修不懈故不著劫數;九由化無厭故,觀三世眾生化未化等;十由願住世界,能修一切佛法。第三廣大智者,垢染既拂,本智自明,稱性相知,故云廣大。亦從前十及次十而成,然有開合,恐煩不配,說者隨宜。第四普入者,事隨理融本來即入,智了法爾無境不通,故身心皆入。亦從前三生,可以意得。非根者,境識及理皆非根也。第五勝妙心者,由前知法本融,則事理無礙、應機成益,名勝妙心。從前四生,亦可意得。第六善巧智者,由上事理無礙,今則權實決斷,名善巧智。有十一句,後二合一,餘皆如次從前十成。一即言亡言為甚深、二無依故廣大、三如依空生色故能說種種、四住無二邊故證平等、五了種智深密故了差別、六無差全同、七若無疑惑則佛法莊嚴、八以平等成一方便、九三世法約差別門為無量方便、十由住佛力得知佛無邊自力不退。從前十既爾,從前四段亦然,如是展轉不離始修,故隨一法具一切矣。第二「佛子菩薩」下結勸。一行能具一切行,故疾得菩提。大文第二「爾時佛」下證成,中二:一現瑞證。於中,先此界、後「如此」下結通。二「爾時至十方」下諸菩薩證,亦先此土、後「如此」下結通。言授記深法者,少用功力疾得菩提故。同名普賢者,皆有此行故。普勝界者,依此普法最為勝故。普幢自在者,此行成果高出無礙故。第二以偈重顯,中二:先敘述、後正頌。今初,亦二:先說儀、後「欲開」下說意。此有十偈中,並具文顯可知。第二正頌中,百二十一頌,分二:前二十四頌顯說分齊、餘皆正辨普賢行相。此是伽陀,與前長行綺互共顯普賢之行。前是略明十法展轉相生,此則廣顯諸門,略無展轉。又前多顯體,此多辨用。前中二:初一誡聽許說、餘正示分齊。於中二:前九頌許說過去菩薩行、後「於一賢劫」下許說三世佛菩薩行。於中二:前三偈舉說時處,前二時、後一處。後十一偈明所說行,於中前四諸佛出世行即普賢行,故名因果圓融;後七菩薩三輪願智行,即普賢行。第二「於一微塵」下正顯普賢行,九十七頌,分二:初六十七明即悲大智行、後「未安者」下三十頌即智大悲行。今初,有十種行:一初五頌明善入帝網行;二十七頌深入時處微細行;三「世界及如來」下三頌,明了佛心祕密行,前一偈半攝前起後、後一偈半正顯難了能了;四十偈,了三世佛攝化行;五「出生」下二偈,六根無礙行;六有三偈,如化無方行;七「諸佛甚深」下十頌,三世間自在行,此中玄妙,宜審思之;八六頌,別明智正覺世間自在行;九「如來法身藏」下五頌,非身示身行,法身藏者,即前藏身普賢菩薩,自體遍言亦同此也;十有六頌非量示量行。第二即智之悲行中亦有十行:一初四偈,無住攝化行。二有四偈,非身現身行。三一頌,分布舍利行。四二頌,知佛大心行。五三頌,法輪深入行。六「無量無邊」下五頌,了知根器行。七三頌,了世業惑行。八五頌,了達根境無礙行。九一頌,知四種說法行。而剎說等者,略有三義:一約通力;二約融通,一說一切說故;三約顯理,是說菩薩觸境皆了知故,則觸類成教如香飯等。十末後二頌,三世攝化行。平等因竟。大方廣佛華嚴經疏卷第四十八大方廣佛華嚴經疏卷第四十九唐清涼山大華嚴寺沙門澄觀撰\n\n> 体例：docs/工程治理/玄记体重排体例_v1.md——疏文照录；下节逐段层保持不动，与此总纲互指。\n\n\n### 2.1 品首·瞋心百万障（程序全引）\n\n> 普賢行品普賢行品\n>\n> 第三十六爾時，普賢菩薩摩訶薩復告諸菩薩大眾言：「佛子！如向所演，此但隨眾生根器所宜，略說如來少分境界。何以故？諸佛世尊，為諸眾生，無智作惡，計我、我所，執著於身，顛倒疑惑，邪見分別，與諸結縛恒共相應，隨生死流遠如來道故，出興于世。\n>\n> 佛子！我不見一法為大過失，如諸菩薩於他菩薩起瞋心者。何以故？佛子！若諸菩薩於餘菩薩起瞋恚心，即成就百萬障門故。何等為百萬障？所謂：不見菩提障；不聞正法障；生不淨世界障；生諸惡趣障；生諸難處障；多諸疾病障；多被謗毀障；生頑鈍諸趣障；\n>\n> 壞失正念障；闕少智慧障；眼障；耳障；鼻障；舌障；身障；意障；惡知識障；惡伴黨障；樂習小乘障；樂近凡庸障；不信樂大威德人障；樂與離正見人同住障；生外道家障；住魔境界障；離佛正教障；不見善友障；善根留難障；增不善法障；得下劣處障；\n>\n> 生邊地障；生惡人家障；生惡神中障；生惡龍、惡夜叉、惡乾闥婆、惡阿脩羅、惡迦樓羅、惡緊那羅、惡摩睺羅伽、惡羅剎中障；不樂佛法障；習童蒙法障；樂著小乘障；不樂大乘障；性多驚怖障；心常憂惱障；愛著生死障；不專佛法障；不喜見聞佛自在神通障；\n>\n> 不得菩薩諸根障；不行菩薩淨行障；退怯菩薩深心障；不生菩薩大願障；不發一切智心障；於菩薩行懈怠障；不能淨治諸業障；不能攝取大福障；智力不能明利障；斷於廣大智慧障；不護持菩薩諸行障；樂誹謗一切智語障；遠離諸佛菩提障；樂住眾魔境界障；\n>\n> 不專修佛境界障；不決定發菩薩弘誓障；不樂與菩薩同住障；不求菩薩善根障；性多見疑障；心常愚闇障；不能行菩薩平等施故，起不捨障；不能持如來戒故，起破戒障；不能入堪忍門故，起愚癡、惱害、瞋恚障；不能行菩薩大精進故，起懈怠垢障；\n>\n> 不能得諸三昧故，起散亂障；不修治般若波羅蜜故，起惡慧障；於處、非處中無善巧障；於度眾生中無方便障；於菩薩智慧中不能觀察障；於菩薩出離法中不能了知障；不成就菩薩十種廣大眼故，眼如生盲障；耳不聞無礙法故，口如啞羊障；不具相好故，鼻根破壞障；\n>\n> 不能辨了眾生語言故，成就舌根障；輕賤眾生故，成就身根障；心多狂亂故，成就意根障；不持三種律儀故，成就身業障；恒起四種過失故，成就語業障；多生貪、瞋、邪見故，成就意業障；賊心求法障；斷絕菩薩境界障；於菩薩勇猛法中心生退怯障；\n>\n> 於菩薩出離道中心生嬾惰障；於菩薩智慧光明門中心生止息障；於菩薩念力中心生劣弱障；於如來教法中不能住持障；於菩薩離生道不能親近障；於菩薩無失壞道不能修習障；隨順二乘正位障；遠離三世諸佛菩薩種性障。「佛子！若菩薩於諸菩薩起一瞋心，則成就如是等百萬障門。\n>\n> 何以故？佛子！我不見有一法為大過惡，如諸菩薩於餘菩薩起瞋心者。是故，諸菩薩摩訶薩欲疾滿足諸菩薩行，應勤修十種法。何等為十？所謂：心不棄捨一切眾生，於諸菩薩生如來想，永不誹謗一切佛法，知諸國土無有窮盡，於菩薩行深生信樂，不捨平等虛空法界菩提之心，觀察菩提入如來力，精勤修習無礙辯才，教化眾生無有疲厭，住一切世界心無所著。\n>\n> 是為十。「\n\n**障门实测**：经文历数**86 种障**（不見菩提障→遠離三世諸佛菩薩種性障），「百万」举其大数——一瞋之心，开百万障门。\n\n**【句释】**（疏训释·体例 v1 第3条·L.428·据澄观《华严经疏》`T1735`）：\n- 「德周法界為普，至順調善曰賢，依性造修曰行」——释名：德周法界为普、至顺调善曰贤、依性造修曰行——标人显法。\n- 「會前差別因，成此普賢之圓因；會差別果，成性起出現之果」——平等因果：会前差别因成普贤圆因、会差别果成性起出现之果——因果体均。\n- 「一所求普，謂要求證一切如來平等所證故」——十普之首：所求普（求证一切如来平等所证）——所化普·所断普继之，以十表无尽。\n\n### 2.2 五阶十法递进链＋受持劝（六段·程序全引）\n\n**（1）十種清淨（安住此十法已）**：\n\n> 佛子！菩薩摩訶薩安住此十法已，則能具足十種清淨。何等為十？所謂：通達甚深法清淨，親近善知識清淨，護持諸佛法清淨，了達虛空界清淨，深入法界清淨，觀察無邊心清淨，與一切菩薩同善根清淨，不著諸劫清淨，觀察三世清淨，修行一切諸佛法清淨。是為十。「\n\n**（2）十種廣大智（住此十法已）**：\n\n> 佛子！菩薩摩訶薩住此十法已，則具足十種廣大智。何等為十？所謂：知一切眾生心行智，知一切眾生業報智，知一切佛法智，知一切佛法深密理趣智，知一切陀羅尼門智，知一切文字辯才智，知一切眾生語言、音聲、辭辯善巧智，於一切世界中普現其身智，於一切眾會中普現影像智，於一切受生處中具一切智智。是為十。「\n\n**（3）十種普入（住此十智已）**：\n\n> 佛子！菩薩摩訶薩住此十智已，則得入十種普入。何等為十？所謂：一切世界入一毛道，一毛道入一切世界；一切眾生身入一身，一身入一切眾生身；不可說劫入一念，一念入不可說劫；一切佛法入一法，一法入一切佛法；不可說處入一處，一處入不可說處；不可說根入一根，一根入不可說根；一切根入非根，非根入一切根；一切想入一想，一想入一切想；一切言音入一言音，一言音入一切言音；一切三世入一世，一世入一切三世。是為十。「\n\n**（4）十種勝妙心（如是觀察已）**：\n\n> 佛子！菩薩摩訶薩如是觀察已，則住十種勝妙心。何等為十？所謂：住一切世界語言、非語言勝妙心，住一切眾生想念無所依止勝妙心，住究竟虛空界勝妙心，住無邊法界勝妙心，住一切深密佛法勝妙心，住甚深無差別法勝妙心，住除滅一切疑惑勝妙心，住一切世平等無差別勝妙心，住三世諸佛平等勝妙心，住一切諸佛力無量勝妙心。是為十。「\n\n**（5）十種佛法善巧智（住此勝妙心已）**：\n\n> 佛子！菩薩摩訶薩住此十種勝妙心已，則得十種佛法善巧智。何等為十？所謂：了達甚深佛法善巧智，出生廣大佛法善巧智，宣說種種佛法善巧智，證入平等佛法善巧智，明了差別佛法善巧智，悟解無差別佛法善巧智，深入莊嚴佛法善巧智，一方便入佛法善巧智，無量方便入佛法善巧智，知無邊佛法無差別善巧智，以自心自力於一切佛法不退轉善巧智。是為十。「\n\n**（6）聞法受持勸（持此法者功德）**：\n\n> 佛子！菩薩摩訶薩聞此法已，咸應發心，恭敬受持。何以故？菩薩摩訶薩持此法者，少作功力，疾得阿耨多羅三藐三菩提，皆得具足一切佛法，悉與三世諸佛法等。」爾時，佛神力故，法如是故，十方各有十不可說百千億那由他佛剎微塵數世界六種震動，雨出過諸天一切華雲、香雲、末香雲、衣蓋、幢幡、摩尼寶等及以一切莊嚴具雲，雨眾妓樂雲，雨諸菩薩雲，雨不可說如來色相雲，雨不可說讚歎如來善哉雲，雨如來音聲充滿一切法界雲，雨不可說莊嚴世界雲，雨不可說增長菩提雲，雨不可說光明照耀雲，雨不可說神力說法雲。\n>\n> 如此世界四天下菩提樹下菩提場菩薩宮殿中，見於如來成等正覺演說此法，十方一切諸世界中悉亦如是。爾時，佛神力故，法如是故，十方各過十不可說佛剎微塵數世界外，有十佛剎微塵數菩薩摩訶薩來詣此土，充滿十方，作如是言：「善哉善哉！佛子！\n>\n> 乃能說此諸佛如來最大誓願授記深法。佛子！我等一切同名普賢，各從普勝世界普幢自在如來所來詣此土，悉以佛神力故，於一切處演說此法；如此眾會，如是所說，一切平等無有增減。我等皆承佛威神力，來此道場為汝作證。如此道場，我等十佛剎微塵數菩薩而來作證，十方一切諸世界中悉亦如是。\n>\n> 」爾時，普賢菩薩摩訶薩以佛神力、自善根力，觀察十方洎于法界，欲開示菩薩行，欲宣說如來菩提界，欲說大願界，欲說一切世界劫數，欲明諸佛隨時出現，欲說如來隨根熟眾生出現令其供養，欲明如來出世功不唐捐，欲明所種善根必獲果報，欲明大威德菩薩為一切眾生現形說法令其開悟，而說頌言：「\n\n### 2.3 偈颂（2,420 字·程序全引）\n\n> 「汝等應歡喜，捨離於諸蓋，一心恭敬聽，菩薩諸願行。往昔諸菩薩，最勝人師子，如彼所修行，我當次第說。亦說諸劫數，世界并諸業，及以無等尊，於彼而出興。如是過去佛，大願出于世，云何為眾生，滅除諸苦惱？一切論師子，所行相續滿，得佛平等法，一切智境界。\n>\n> 見於過去世，一切人師子，放大光明網，普照十方界。思惟發是願：『我當作世燈，具足佛功德，十力一切智。一切諸眾生，貪恚癡熾然；我當悉救脫，令滅惡道苦。』發如是誓願，堅固不退轉，具修菩薩行，獲十無礙力。如是誓願已，修行無退怯，所作皆不虛，說名論師子。\n>\n> 於一賢劫中，千佛出于世，彼所有普眼，我當次第說。如一賢劫中，無量劫亦然，彼未來佛行，我當分別說。如一佛剎種，無量剎亦然，未來十力尊，諸行我今說。諸佛次興世，隨願隨名號，隨彼所得記，隨其所壽命，隨所修正法，專求無礙道；隨所化眾生，正法住於世；\n>\n> 隨所淨佛剎，眾生及法輪，演說時非時，次第淨群生；隨諸眾生業，所行及信解，上中下不同，化彼令修習。入於如是智，修其最勝行，常作普賢業，廣度諸眾生。身業無障礙，語業悉清淨，意行亦如是，三世靡不然。菩薩如是行，究竟普賢道，出生淨智日，普照於法界。\n>\n> 未來世諸劫，國土不可說，一念悉了知，於彼無分別。行者能趣入，如是最勝地，此諸菩薩法，我當說少分。智慧無邊際，通達佛境界，一切皆善入，所行不退轉。具足普賢慧，成滿普賢願，入於無等智，我當說彼行。於一微塵中，悉見諸世界，眾生若聞者，迷亂心發狂。\n>\n> 如於一微塵，一切塵亦然，世界悉入中，如是不思議。一一塵中有，十方三世法，趣剎皆無量，悉能分別知。一一塵中有，無量種佛剎，種種皆無量，於一靡不知。法界中所有，種種諸異相，趣類各差別，悉能分別知。深入微細智，分別諸世界，一切劫成壞，悉能明了說。\n>\n> 知諸劫修短，三世即一念，眾行同不同，悉能分別知。深入諸世界，廣大非廣大，一身無量剎，一剎無量身。十方中所有，異類諸世界，廣大無量相，一切悉能知。一切三世中，無量諸國土，具足甚深智，悉了彼成敗。十方諸世界，有成或有壞，如是不可說，賢德悉深了。\n>\n> 或有諸國土，種種地嚴飾；諸趣亦復然，斯由業清淨。或有諸世界，無量種雜染；斯由眾生感，一切如其行。無量無邊剎，了知即一剎，如是入諸剎，其數不可知。一切諸世界，悉入一剎中，世界不為一，亦復無雜亂。世界有仰覆，或高或復下，皆是眾生想，悉能分別知。\n>\n> 廣博諸世界，無量無有邊，知種種是一，知一是種種。普賢諸佛子，能以普賢智，了知諸剎數，其數無邊際。知諸世界化，剎化眾生化，法化諸佛化，一切皆究竟。一切諸世界，微細廣大剎，種種異莊嚴，皆由業所起。無量諸佛子，善學入法界，神通力自在，普遍於十方。\n>\n> 眾生數等劫，說彼世界名，亦不能令盡，唯除佛開示。世界及如來，種種諸名號，經於無量劫，說之不可盡。何況最勝智，三世諸佛法，從於法界生，充滿如來地！清淨無礙念，無邊無礙慧，分別說法界，得至於彼岸。過去諸世界，廣大及微細，修習所莊嚴，一念悉能知。\n>\n> 其中人師子，修佛種種行，成於等正覺，示現諸自在。如是未來世，次第無量劫，所有人中尊，菩薩悉能知。所有諸行願，所有諸境界，如是勤修行，於中成正覺。亦知彼眾會，壽命化眾生，以此諸法門，為眾轉法輪。菩薩如是知，住普賢行地，智慧悉明了，出生一切佛。\n>\n> 現在世所攝，一切諸佛土，深入此諸剎，通達於法界。彼諸世界中，現在一切佛，於法得自在，言論無所礙。亦知彼眾會，淨土應化力，盡無量億劫，常思惟是事。調御世間尊，所有威神力，無盡智慧藏，一切悉能知。出生無礙眼，無礙耳鼻身，無礙廣長舌，能令眾歡喜。\n>\n> 最勝無礙心，廣大普清淨，智慧遍充滿，悉知三世法。善學一切化，剎化眾生化，世化調伏化，究竟化彼岸。世間種種別，皆由於想住，入佛方便智，於此悉明了。眾會不可說，一一為現身，悉使見如來，度脫無邊眾。諸佛甚深智，如日出世間，一切國土中，普現無休息。\n>\n> 了達諸世間，假名無有實，眾生及世界，如夢如光影。於諸世間法，不生分別見，善離分別者，亦不見分別。無量無數劫，解之即一念，知念亦無念，如是見世間。無量諸國土，一念悉超越，經於無量劫，不動於本處。不可說諸劫，即是須臾頃，莫見修與短，究竟剎那法。\n>\n> 心住於世間，世間住於心，於此不妄起，二非二分別。眾生世界劫，諸佛及佛法，一切如幻化，法界悉平等。普於十方剎，示現無量身，知身從緣起，究竟無所著。依於無二智，出現人師子，不著無二法，知無二非二。了知諸世間，如焰如光影，如響亦如夢，如幻如變化。\n>\n> 如是隨順入，諸佛所行處，成就普賢智，普照深法界。眾生剎染著，一切皆捨離，而興大悲心，普淨諸世間。菩薩常正念，論師子妙法，清淨如虛空，而興大方便。見世常迷倒，發心咸救度，所行皆清淨，普遍諸法界。諸佛及菩薩，佛法世間法，若見其真實，一切無差別。\n>\n> 如來法身藏，普入世間中，雖在於世間，於世無所著。譬如清淨水，影像無來去；法身遍世間，當知亦如是。如是離染著，身世皆清淨，湛然如虛空，一切無有生。知身無有盡，無生亦無滅，非常非無常，示現諸世間。除滅諸邪見，開示於正見，法性無來去，不著我我所。\n>\n> 譬如工幻師，示現種種事，其來無所從，去亦無所至。幻性非有量，亦復非無量，於彼大眾中，示現量無量。以此寂定心，修習諸善根，出生一切佛，非量非無量。有量及無量，皆悉是妄想，了達一切趣，不著量無量。諸佛甚深法，廣大深寂滅，甚深無量智，知甚深諸趣。\n>\n> 菩薩離迷倒，心淨常相續，巧以神通力，度無量眾生。未安者令安，安者示道場，如是遍法界，其心無所著。不住於實際，不入於涅槃，如是遍世間，開悟諸群生。法數眾生數，了知而不著，普雨於法雨，充洽諸世間。普於諸世界，念念成正覺，而修菩薩行，未曾有退轉。\n>\n> 世間種種身，一切悉了知；如是知身法，則得諸佛身。普知諸眾生，諸劫及諸剎，十方無涯際，智海無不入。眾生身無量，一一為現身；佛身無有邊，智者悉觀見。一念之所知，出現諸如來，經於無量劫，稱揚不可盡。諸佛能現身，處處般涅槃，一念中無量，舍利各差別。\n>\n> 如是未來世，有求於佛果，無量菩提心，決定智悉知。如是三世中，所有諸如來，一切悉能知，名住普賢行。如是分別知，無量諸行地，入於智慧處，其輪不退轉。微妙廣大智，深入如來境，入已不退轉，說名普賢慧。一切最勝尊，普入佛境界，修行不退轉，得無上菩提。\n>\n> 無量無邊心，各各差別業，皆由想積集，平等悉了知。染污非染污，學心無學心，不可說諸心，念念中悉知。了知非一二，非染亦非淨，亦復無雜亂，皆從自想起。如是悉明見，一切諸眾生，心想各不同，起種種世間。以如是方便，修諸最勝行，從佛法化生，得名為普賢。\n>\n> 眾生皆妄起，善惡諸趣想，由是或生天，或復墮地獄。菩薩觀世間，妄想業所起，妄想無邊故，世間亦無量。一切諸國土，想網之所現，幻網方便故，一念悉能入。眼耳鼻舌身，意根亦如是，世間想別異，平等皆能入。一一眼境界，無量眼皆入，種種性差別，無量不可說。\n>\n> 所見無差別，亦復無雜亂，各隨於自業，受用其果報。普賢力無量，悉知彼一切，一切眼境界，大智悉能入。如是諸世間，悉能分別知，而修一切行，亦復無退轉。佛說眾生說，及以國土說，三世如是說，種種悉了知。過去中未來，未來中現在，三世互相見，一一皆明了。\n>\n> 如是無量種，開悟諸世間，一切智方便，邊際不可得。」\n\n## 三、旁参与前接\n\n**承前**：品33〈隨好光明品〉结以「清淨金網轉輪王甚深三昧福德善根之所成就」——果用归因行；本品普贤即承之自说**行**：果分到此回身说因，故澄观谓「會前差別因。成此普賢之圓因」（§5.1）。\n\n**启后**：品35〈如來出現品〉——普贤圆因既立，如来性起之果继显：**此二品即「平等因果」一双**（因普贤行·果如来出现），与前面五会之「差別因果」对望。\n\n## 四、义理要点\n\n**【要点提炼】**\n\n1. **瞋为第一过**：「我不見一法為大過失，如諸菩薩於他菩薩起瞋心者」——全经对单一烦恼之最重判词；86 种障门实测（§2.1），一念瞋起，百万门开。\n2. **五阶递进链**：十清淨→十廣大智→十普入→十勝妙心→十佛法善巧智——**后阶以前阶为基**（「安住此十法已則能具足」「住此十智已則得入」），行与智相生的阶梯结构，与单列式十种法不同。\n3. **受持劝**：「菩薩摩訶薩持此法者，少作功……」——法不在多闻而在受持；普贤行以持为行。\n4. **偈颂自誓**：2,420 字长偈（占全品六成）——「往昔諸菩薩……如彼所修行，我當次第說」——普贤以偈**自誓愿行**，重颂非复述而是自身承当。\n\n**【阐释】**（〔本文判断〕）本品之「行」有两个反常识处。其一：行品不说「做什么」，先说「不做什么」——**起瞋是万障之门**：菩萨道之第一行是对同发心者之忍。这把「行」从作业表翻转为心术论。其二：五阶十法链的**递进语法**（住此则得、安住則能）把修行说成**条件连锁**而非科目清单——前阶是后阶之因，环环相扣，行的秩序性由此显形。澄观以「平等因果」总判此品与如来出现品：因非因于果外，果非果于因外——**行至行满处即佛**，此即「平等」二字之分量。\n\n**【启发】**读此品先取「一瞋百万障」四字自照：菩萨道上最险处不在外魔而在对同行者之瞋。再取五阶链读自己的功课次第：清净未成而求普入，是躐等；胜妙心未住而求善巧智，是凿空。偈颂「如彼所修行，我當次第說」——「次第」二字即本品之眼：**行有次第，故因果平等。**\n\n**【对照】**：六十华严对应品待勘〔待核〕；本品与品36〈離世間品〉之别：本品说**普贤自行之纲**，离世间品说**普贤广答二千问**——一纲一目，前后相成〔本文判断〕。\n\n## 五、注疏选要\n\n### 5.1 澄观（`T1735`）\n\n> 普賢行品第三十六（已下入第四十九經）初來意者。先通後別。通謂二品明出現因果。故次來也。亦名平等因果。謂會前差別因。成此普賢之圓因。會差別果。成性起出現之果。又前約修生。此約修顯故。\n\n（《疏》卷释文·本品来意——「平等因果」总判：普贤圆因＋性起果，会前五会差别因果而归平等。）\n\n### 5.2 诸家（程序取窗实引·L.310/L.314）\n\n**李通玄《新華嚴經論》**（289 字·程序取窗）：\n\n> 普賢行品方終。如來出現品中佛果文殊普賢三法法身根本智差別智方始理智大慈悲。如先發願。稱願圓滿。如三乘教中後得智。以普賢行教化眾生。此一乘中教法。說似前後。如是昇進不出一剎那際。三乘因前果。後道滿三祇。一乘見道。在初發心住中加行。行因在十行十迴向十地十一地。如是舡之鐵木安危澁滑悉知之。乃至知根遲速應止即止。三乘及以人天法中乃至五停心觀。根若熟者應行即行。令使昇進一乘法中。以生死性十二有支。便為法事大智用故。已下大意如此。善男子。我將好舡運諸商眾至安隱道乃至引至寶洲與其珍寶咸令充足然後將領還閻浮提者。是事表法中。明從初發心住得佛根本智。自此已去經後諸位中。皆與說其妙法。至於十\n\n（程序取窗（L.314）·各照底本）\n**道霈《華嚴經疏論纂要》**（204 字·程序取窗）：\n\n> 普賢行品疏論纂要第八十六卷如來出現品疏論纂要(之一)第八十七卷如來出現品疏論纂要(之二)第八十八卷如來出現品疏論纂要(之三)第八十九卷如來出現品疏論纂要(之四訖)第九十卷離世間品疏論纂要(之一)第九十一卷離世間品疏論纂要(之二)第九十二卷離世間品疏論纂要(之三)第九十三卷離世間品疏論纂要(之四)第九十四卷離世間品疏論纂要(之五)第九十五卷離世間品疏論纂要(之六)第九十六卷離世間品疏論纂要(之七)第九十七卷\n\n（程序取窗（L.314））\n\n### 〇之二.9 文化资产参证（名胜·造像·图绘·L.440 落位）\n\n> **体例**：图像著录体系（登记册 `puxianxing_imagery.yaml`·唯一权威著录源）；授权 Commons 可核验（CC BY 2.0）；**A/B/C 三分**——本批 1 件（B 类：普贤骑象题域）；凡边界不混同。\n\n<figure style=\"margin:14px 0 20px;text-align:center\">\n<img class=\"doc-img\" src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9d/079_Bodhisattva_Samantabhadra_on_Elephant_%2834343223774%29.jpg/960px-079_Bodhisattva_Samantabhadra_on_Elephant_%2834343223774%29.jpg\" alt=\"婆罗浮屠浮雕·普贤骑象（Samantabhadra on Elephant·079）\" loading=\"lazy\">\n<figcaption style=\"font-size:.78em;color:var(--text2);line-height:1.85;max-width:760px;margin:6px auto 0\">\n图 36-1　婆罗浮屠浮雕·普贤骑象（Samantabhadra on Elephant·079）——婆罗浮屠普贤骑象浮雕——普贤行之造像题域 （CC 署名：Photo Dharma from Sadao, Thailand）。<br>**边界**：B：普贤骑象造像题域·非本经专像；婆罗浮屠浮雕与华严叙事对应为学界通说〔待核〕。\n</figcaption>\n</figure>\n\n## 六、文本对读\n\n### 藏译对读窗（藏 ch42·037·63a.4）\n\n**藏文首段**（Derge 康要录·前段）：\n\n> སྒྲོན་མ་ཞེས་བྱ་བ་མདོག་དག་སྟེ་བཟང་ཞིང་གསལ་བ་བཞིན་ནོ།།ཤིན་ཏུ་རྒྱས་པ་ཆེན་པོའི་མདོ་སངས་རྒྱས་ཕལ་པོ་ཆེ་ཞེས་བྱ་བ་ལས།དཔེ་བྱད་བཟང་པོའི་འོད་ཟེར་བསྟན་པའི་ལེའུ་སྟེ་བཞི་བཅུ་གཅིག་པའོ།།།།{T44-42}སངས་རྒྱས་རྨད་གཅད་ཅེས་བྱ་བ་ཤིན་ཏུ་རྒྱས་པ་ཆེན་པོའི་མདོ།།བམ་པོ་བདུན་པ།དེ་ནས་ཡང་བྱང་ཆུབ་སེམས་དཔའ་ཀུན་ཏུ་…\n\n**汉译对照**（八十·前段）：\n\n>\n\n**三本名相对**（择要）：\n\n| 目 | 八十 | 六十 | 藏 |\n|---|---|---|---|\n| 章题·自题 | 〈普賢行品第三十六〉 | — | 藏 普贤行显示章·第四十二 |\n| 说主 | 「普賢菩薩摩訶薩復告諸菩薩大眾言」 | — | 藏 藏 ཀུན་ཏུ་བཟང་པོས…སྨྲས（普贤复告） |\n\n**释读**：章末自题普贤行章＝汉品题〈普賢行品〉逐字对合；复告式两本同（承前品普贤续说）。\n\n\n### 6.3 藏译（Toh 44 对应章）\n**藏译逐段细读（L.357·藏汉逐段对读批六·data/alignment/tibetan_zhuhuju_b6.json）**\n\n**藏文首段（德格 037·63a.4·章42·程序取窗·去页码标记）**\n\n> སྒྲོན་མ་ཞེས་བྱ་བ་མདོག་དག་སྟེ་བཟང་ཞིང་གསལ་བ་བཞིན་ནོ།།ཤིན་ཏུ་རྒྱས་པ་ཆེན་པོའི་མདོ་སངས་རྒྱས་ཕལ་པོ་ཆེ་ཞེས་བྱ་བ་ལས།དཔེ་བྱད་བཟང་པོའི་འོད་ཟེར་བསྟན་པའི་ལེའུ་སྟེ་བཞི་བཅུ་གཅིག་པའོ།\n>\n> །།།{T44-42}སངས་རྒྱས་རྨད་གཅད་ཅེས་བྱ་བ་ཤིན་ཏུ་རྒྱས་པ་ཆེན་པོའི་མདོ།།བམ་པོ་བདུན་པ།དེ་ནས་ཡང་བྱང་ཆུབ་སེམས་དཔའ་ཀུན་ཏུ་བཟང་པོས།བྱང་ཆུབ་སེམས་དཔའ་དེ་དག་ལ་སྨྲས་པ།\n>\n> ཀྱེ་རྒྱལ་བའི་སྲས་དག་དེ་ནི་སེམས་ཅན་གྱི་སྣོད་ཇི་ལྟ་བ་བཞིན་དུ་ཡང་དག་པར་རྫོགས་པའི་སང\n\n**试译 function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}

}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}

</script>
