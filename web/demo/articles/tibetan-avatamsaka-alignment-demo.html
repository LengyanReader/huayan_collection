function copyPageLink(){
  var url = window.location.href;
  var toast = document.getElementById('share-toast');
  function done(msg, ok){
    if(toast){ toast.textContent = msg; toast.style.display='block'; setTimeout(function(){ toast.style.display='none'; }, 2600); }
    return ok;
  }
  function fallback(u){
    var ta = document.createElement('textarea'); ta.value = u; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done('✅ 本页独立地址已复制：' + u, true); }
    catch(e){ done('📋 请手动复制地址：' + u, false); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){ done('✅ 本页独立地址已复制：' + url, true); },
      function(){ fallback(url); });
  } else {
    fallback(url);
  }
}
</script>

  "doc": "",
  "doc_md": "# 藏汉英对读 · 大方广佛华严经（德格藏文本）初探\n\n> **说明**：本页为藏汉英对读的 Demo，旨在展示对读结构设计思路。翻译采用本地模型 `buddhist-nlp/mitra-qwen35-translate`（9B）初步试译，尚未人工校对，仅供技术验证用。\n\n## 1. 底本概况\n\n| 版本 | 文本 | 状态 | 备注 |\n|---|---|---|---|\n| **藏文（主底本）** | 德格版《大方广佛华严经》（*Tohoku* 44） | `data/references/tibetan/derge_kangyur/avatamsaka/`（035-038，4 卷） | **完整**，包含《入法界品》（Gaṇḍavyūha）。共 115 *bam po*。 |\n| **汉文（对勘）** | 《大方广佛华严经》六十卷（*T09n0278*） | `data/references/cbeta/T09n0278.xml` | 对应藏本主要部分 |\n| **汉文（对勘）** | 《大方广佛华严经》八十卷（*T10n0279*） | `data/references/cbeta/T10n0279.xml` | 最通行的中文译本，本项目主要研读对象 |\n| **汉文（对勘）** | 《大方广佛华严经》四十卷（*T10n0293*） | *待补充* | 入法界品等相关部分 |\n\n## 2. 对读示例（首段试译）\n\n以下选取德格藏本卷一（035）开篇经文，展示拟议的对读呈现格式。\n\n### 2.1 藏文原文（Derge 035）\n\n```tibetan\n།འདི་སྐད་བདག་གིས་ཐོས་པའི་དུས་གཅིག་ན།\nབཅོམ་ལྡན་འདས་ཐོག་མ་མངོན་པར་སངས་རྒྱས་པ།\nསངས་རྒྱས་ཀྱི་ཆོས་ཐམས་ཅད་ཤིན་ཏུ་རྣམ་པར་སངས་རྒྱས་པའི་ཐུགས་མངའ་བ།\n```\n\n### 2.2 藏译→中文（模型试译，MITRA）\n\n> 如是我闻，一时，世尊最初成正等觉，心具一切佛法，已圆满证悟。\n\n### 2.3 藏译→英文（模型试译，MITRA）\n\n> Thus have I heard. At one time, the Blessed One had just attained unsurpassed, complete enlightenment. His mind possessed all the qualities of the Buddha and had fully realized them.\n\n### 2.4 汉译对勘（八十华严 T10n0279）\n\n> 如是我聞：一時，佛在摩竭提國，阿蘭若法菩提場中，始成正覺。\n\n### 2.5 汉译对勘（六十华严 T09n0278）\n\n> 如是我聞：一時，佛在摩竭提國菩提樹下，成佛未久。\n\n## 3. 对读结构设计\n\n拟采用以下多栏对读布局：\n\n| 栏目 | 用途 |\n|---|---|\n| **藏文原文** | 德格底本原字形（保留 *tsheg*、句读，逐字可回溯） |\n| **藏文分词/直译** | 逐词对应，标注助词、名词、动词等 |\n| **中文译文（新译）** | 基于藏文本的新译（模型辅助 + 人工校对） |\n| **英文译文（新译）** | 英文对照翻译 |\n| **八十华严（T10n0279）** | 实叉难陀译，对勘异同 |\n| **六十华严（T09n0278）** | 佛驮跋陀罗等译，对勘异同 |\n| **四十华严（T10n0293）** | 般若译，对勘异同（如有对应） |\n| **校记** | 异文、术语、存疑（〔待核〕）、推断（〔本文判断〕） |\n\n## 4. 技术路线\n\n1. **底本规范化**：从德格藏文 `.txt` 提取经文，保留行号、页码信息\n2. **品目对照**：建立藏汉品目对应表，厘清 *Toh 44* 各 *bam po* 与汉译《华严经》品目的对应关系\n3. **AI 辅助翻译**：使用 `hy_py312` 环境下的 `mitra-qwen35-translate` 进行初译\n"
};
