  "doc_md": "# 藏汉英对读 · 大方广佛华严经（德格藏文本）初探\n\n> **说明**：本页展示藏汉英对读的结构设计与**阶段二·底本处理**成果。藏文 45 品目录由德格版 `Toh 44`（035-038）文本中 `{T44-N}` 品目标记**逐字机械提取**，叶码为底本定位；汉藏逐品对应**需人工比对**，故一律标〔待核〕，不代立论。中文新译为本地模型 `buddhist-nlp/mitra-qwen35-translate`（9B）初步试译，尚未人工校对，仅供技术验证。\n\n> **并集视角（对读定位）**：藏译品 1–39 之汉译对应，以**八十华严**（`T10n0279`）为主本；藏译品 40《入法界品》（善财童子五十三参）则以八十《入法界品第三十九》（`T10n0279` 卷六十–八十）为主本，六十《入法界品第三十四》（`T09n0278` 卷四十四–六十）为参照。凡涉善财参访之段落，一律标注「**第几参 · 善知识名号 · 卷次 · 页行**」，不作无位次之泛引。\n\n> **校正说明**：八十华严（`T10n0279`）本身即收《入法界品》全篇（品第三十九·卷六十起），并非「无《入法界品》」；四十华严（`T10n0293`）另有《入法界品》单译，结构篇幅不同，其全本尚未入仓，相关引文暂标〔未竟·待后续批〕。**前版之误**：本页曾把八十《入法界品》记作「卷39」，系将**品次 39** 误作**卷次**；回源实测品 39 起于卷六十 `p.319a06`，第 1 参段在**卷六十二** `p.334a09`。已订正，详见 §3.7。\n\n## 1. 底本概况\n\n| 版本 | 文本 | 状态 | 备注 |\n|---|---|---|---|\n| **藏文（主底本）** | 德格版《大方广佛华严经》（*Tohoku* 44） | `data/references/tibetan/derge_kangyur/avatamsaka/`（035-038，4 卷） | **完整**，含《入法界品》（Gaṇḍavyūha），共 115 *bam po*。 |\n| **汉文（对勘）** | 六十华严（*T09n0278*·东晋佛驮跋陀罗译） | `data/references/cbeta/T09n0278.xml` | 三十四品·末品实测〈入法界品第三十四〉 |\n| **汉文（对勘）** | 八十华严（*T10n0279*·唐实叉难陀译） | `data/references/cbeta/T10n0279.xml` | 三十九品·本项目校勘底本·末品实测〈入法界品第三十九〉 |\n| **汉文（对勘）** | 四十华严（*T10n0293*·般若译） | *待补充* | 入法界品全译 |\n\n### 1.1 底本字节台账（sha256 · 可校验）\n\n一手语料逐字保真，`sha256` 供跨会话复算核对（承 CBETA `.gitattributes -text` 先例）：\n\n| 底本 | 角色 | 体量 | sha256（前 16 位） |\n|---|---|---|---|\n| 德格 v035 | 藏文主底本 (Toh 44) | 3337.5 KB | `9a09ab79318319ff…` |\n| 德格 v036 | 藏文主底本 (Toh 44) | 3155.2 KB | `a560e81f75ded567…` |\n| 德格 v037 | 藏文主底本 (Toh 44) | 3286.7 KB | `2f829777270a4966…` |\n| 德格 v038 | 藏文主底本 (Toh 44) | 3096.1 KB | `79837efe0001256d…` |\n| T10n0279 | 汉文对勘本 | 4472.3 KB | `9d3de2c63a3eca56…` |\n| T09n0278 | 汉文对勘本 | 4808.0 KB | `a2bfcee6213f9a02…` |\n\n> 复核方式：`python workspace/tibetan-avatamsaka-translation/tools/extract_tibetan_toc.py`（重算并覆写 `data/alignment/tibetan-derge-toc.json`）。\n\n## 2. 藏译 45 品目录（阶段二·机械提取 · 汉藏对勘待核）\n\n结构差（**可回源事实**）：藏译 **45 品** vs 八十汉译 **39 品** vs 六十汉译 **34 品**。〔本文判断〕藏本分品较汉本细，逐品一对一对应不成立，须依经文内容段落比对后重建——此为阶段四目标，**本页 ས་ཀྱི་ཆོས་ཐམས་ཅད་ཤིན་ཏུ་རྣམ་པར་སངས་རྒྱས་པའི་ཐུགས་མངའ་བ།\n```\n\n### 3.2 藏译→中文（模型试译，MITRA）\n\n> 如是我闻，一时，世尊最初成正等觉，心具一切佛法，已圆满证悟。\n\n### 3.3 藏译→英文（模型试译，MITRA）\n\n> Thus have I heard. At one time, the Blessed One had just attained unsurpassed, complete enlightenment. His mind possessed all the qualities of the Buddha and had fully realized them.\n\n### 3.4 汉译对勘（八十华严 T10n0279）\n\n> 如是我聞：一時，佛在摩竭提國阿蘭若法菩提場中，始成正覺。\n\n### 3.5 汉译对勘（六十华严 T09n0278）\n\n> 如是我聞：一時，佛在摩竭提國寂滅道場始成正覺。\n>\n> 〔订正〕本仓前版此处误作「佛在摩竭提國菩提樹下，成佛未久」，与 T09n0278 底本起句不符，本次逐字回源改正（详见 §3.6 对勘记录）。\n\n### 3.6 第1品开篇段 · 示范级人工初对（已回源）\n\n对第1品（T44-1，德格 035:393a）**开篇三句**作藏·八十·六十三本逐字对读。三本起句皆为实证回源（藏：德格原文件；汉：CBETA XML 去注释拼接）：\n\n| 层 | 原文（逐字） |\n|---|---|\n| 藏文（德格） | འདི་སྐད་བདག་གིས་ཐོས་པའི་དུས་གཅིག་ན། །བཅོམ་ལྡན་འདས་ཐོག་མ་མངོན་པར་སངས་རྒྱས་པ། །སངས་རྒྱས་ཀྱི་ཆོས་ཐམས་ཅད་ཤིན་ཏུ་རྣམ་པར་སངས་རྒྱས་པའི་ཐུགས་མངའ་བ། ། |\n| 藏文转写 | 'di skad bdag gis thos pa'i dus gcig na | bcom ldan 'das thog ma mngon par sangs rgyas pa | sangs rgyas kyi chos thams cad shin tu rnam par sangs rgyas pa'i thugs mnga' ba | |\n| 八十 T10n0279 | 如是我聞：一時，佛在摩竭提國阿蘭若法菩提場中，始成正覺。 |\n| 六十 T09n0278 | 如是我聞：一時，佛在摩竭提國寂滅道場始成正覺。 |\n\n**对勘发现**（机器回源 + 人工判读，实质判断标〔本文判断〕/〔待核〕）：\n\n> - 【印可分对应·已证实】三本皆以「如是我聞 / 'di skad bdag gis thos pa」(evam mayā śrutam) 信起；结构对应成立。\n> - 【处所分·汉藏异】八十、六十随即标处所（摩竭提國＋道場名各異：八十「阿蘭若法菩提場」、六十「寂滅道場」）；藏文起句無處所分，逕入「世尊最初正覺」及菩提功德〔本文判断：开篇科段结构实质差异〕。\n> - 「始成正覺」与藏文 thog ma mngon par sangs rgyas pa（最初現正等覺）逐字相应〔本文判断〕。\n> - 【品題三譯不同】藏题 sangs rgyas phal po che＝佛華嚴；八十題「世主妙嚴品」；六十題「世間淨眼品」〔待核：品題之異涉傳本學〕。\n> - 【订正记录】本仓前版（demo §3.5 与旧 JSON）六十起句误作「佛在摩竭提國菩提樹下，成佛未久」，与底本不符，本次据 T09n0278 逐字回源订正为「佛在摩竭提國寂滅道場始成正覺」；八十前版多一逗（摩竭提國，）一并据底本改正。\n\n> 〔口径〕本示范仅覆盖第1品**开篇段**，非全品；该品余文及他品逐段对齐属阶段四，逐品对应仍〔待核〕。MITRA 试译（§3.2/3.3）为机器草稿、未校订，不等同于对勘结论。\n\n### 3.7 第40品《入法界品》· 第1参 德雲比丘（三本逐字对位·已回源）\n\n《入法界品》为**善财童子五十三参**之总汇。三本入品处与第 1 参位置实测如下（皆回源本机底本，非转述）：\n\n| 本 | 品次 | 入品处（起） | 第 1 参段位置 |\n|---|---|---|---|\n| 藏（德格 `Toh 44`） | 品 40（037） | `037` 41b.3（`{T44-40}` 标记） | `037` **[324a.3]–[324a.4]** |\n| 八十（`T10n0279`） | 品 39 之一 | 卷六十 `p.319a06` | **卷六十二** `p.334a09–a13` |\n| 六十（`T09n0278`） | 品 34 之一 | 卷四十四 `p.0676a05` | **卷四十六** `p.0689c10–c13` |\n| 四十（`T10n0293`） | 入法界品（单译） | 〔未竟·待后续批〕（全本未入仓） | 〔未竟·待后续批〕 |\n\n**第 1 参**：善财童子受文殊师利之教，南行至**勝樂國·妙峯山**，参**德雲比丘**（藏 `དགེ་སློང་སྤྲིན་གྱི་དཔལ`，即 *Meghaśrī*〔本文判断〕）。\n\n| 层 | 原文（逐字·已回源） |\n|---|---|\n| 藏文（德格 037·[324a.3]–[324a.4]） | རིགས་ཀྱི་བུ་ལྷོ་ཕྱོགས་ཀྱི་རྒྱུད་འདི་ཉིད་ན། ཡུལ་མི་མོ་གྱ་ནོམ་མཆོག་ཅེས་བྱ་བ་ཡོད་དེ། དེ་ན་མགུལ་ལེགས་པ་ཞེས་བྱ་བའི་རི་ཞིག་ཡོད་པ་དེ་ལ། དགེ་སློང་སྤྲིན་གྱི་དཔལ་ཞེས་བྱ་བ་འདུག་གིས་དེའི་གན་དུ་སོང་ལ། |\n| 八十（`T10n0279` 卷62·p.334a09–a13） | 「善男子！於此南方有一國土，名為：勝樂；其國有山，名曰：妙峯；於彼山中，有一比丘，名曰：德雲。汝可往問：菩薩云何學菩薩行？菩薩云何修菩薩行？乃至菩薩云何於普賢行疾得圓滿？德雲比丘當為汝說。」 |\n| 六十（`T09n0278` 卷46·p.0689c10–c13） | 「善男子！於此南方，有一國土，名曰可樂；其國有山，名曰和合。於彼山中，有一比丘，名功德雲；汝詣彼問云何菩薩學菩薩行、修菩薩道，乃至云何具普賢行。善男子！彼比丘者，善能顯說菩薩所行。」 |\n\n**名相对照**（两汉译名号各别，各照底本，不统一）：\n\n| 项 | 藏（品40） | 八十（品39之一） | 六十（品34） |\n|---|---|---|---|\n| 國名 | `ཡུལ་མི་མོ་གྱ་ནོམ་མཆོག` | 勝樂 | 可樂 |\n| 山名 | `མགུལ་ལེགས་པ` | 妙峯 | 和合 |\n| 善知识 | `དགེ་སློང་སྤྲིན་གྱི་དཔལ`（比丘·雲吉祥） | 德雲（比丘） | 功德雲（比丘） |\n| 求法者 | `ཚོང་དཔོན་གྱི་བུ་ནོར་བཟངས`（商主之子·善財） | 善財童子 | 善財童子 |\n| 三问 | 学菩萨行·精勤·普贤行 | 學菩薩行·修菩薩行·於普賢行疾得圓滿 | 學菩薩行·修菩薩道·具普賢行 |\n\n**闻法反应**：八十「爾時，善財童子聞是語已，歡喜踊躍，頭頂禮足，遶無數匝，慇懃瞻仰，悲泣流淚」（卷62·p.334a14–a15）；六十「時，善財童子從文殊師利，聞法歡喜，頭面禮足，遶無數匝；瞻仰悲戀，泣涕辭退」（卷46·p.0689c14–c16）。藏本作「善財童子頂禮德雲比丘雙足、右繞、合掌而住」〔本文判断：同一叙事单元，仪节语繁简有别〕。\n\n**对勘发现**（机器回源 + 人工判读）：\n\n> - 【印可分对应·已证实】三本此处同属一叙事单元「文殊指示→善財南行→求覓→頂禮問法」，次序一致〔本文判断〕。\n> - 【名号二译】同一善知识，八十作「德雲」、六十作「功德雲」；藏 `སྤྲིན་གྱི་དཔལ`（雲·吉祥）与「德雲」近，与「功德雲」亦容有增字之别〔待核：梵本原名 Meghaśrī 之汉译取捨〕。\n> - 【地名二译】國名 勝樂／可樂、山名 妙峯／和合，两译取意不同；藏文对应词 `ཡུལ་མི་མོ་གྱ་ནོམ་མཆོག`、`མགུལ་ལེགས་པ` 与二者之对位〔待核〕（藏本此处用词与汉译字面不合，未敢遽断）。\n> - 【位次】此段为五十三参之**第 1 参**：八十卷六十二、六十卷四十六、藏 037 `[324a.3]`，三本位次皆在各自《入法界品》之首〔已证实：品题与参次就位〕。\n> - 【四十华严】`T10n0293` 全本未入仓，故其对应段不作引文，标〔未竟·待后续批〕。\n\n> 〔口径〕本节日引三本皆逐字回源（藏：德格原文件含叶码；汉：CBETA XML 去注释拼接）；名相之梵文还原与藏汉对位属推断者已逐条标〔本文判断〕/〔待核〕。五十三参其余五十二参及三本全程对齐，属阶段四续作，未作即不列。\n\n## 4. 对读结构设计\n\n拟采用以下多栏对读布局：\n\n| 栏目 | 用途 |\n|---|---|\n| **藏文原文** | 德格底本原字形（保留 *tsheg*、句读，逐字可回溯） |\n| **藏文分词/直译** | 逐词对应，标注助词、名词、动词等 |\n| **中文译文（新译）** | 基于藏文本的新译（模型辅助 + 人工校对） |\n| **英文译文（新译）** | 英文对照翻译 |\n| **八十华严（T10n0279）** | 实叉难陀译，对勘异同 |\n| **六十华严（T09n0278）** | 佛驮跋陀罗等译，对勘异同 |\n| **四十华严（T10n0293）** | 般若译，对勘异同（如有对应） |\n| **校记** | 异文、术语、存疑（〔待核〕）、推断（〔本文判断〕） |\n\n## 5. 技术路线与阶段进度\n\n1. **底本规范化**：从德格藏文 `.txt` 提取经文，保留行号、页码信息 — *阶段二·进行中*\n2. **品目对照**：建立藏汉品目对应表 — *阶段二·藏译 45 品目录已机械提取（见 §2）；汉藏逐品对应待人工比对〔待核〕*\n3. **AI 辅助翻译**：`hy_py312` 环境下 `mitra-qwen35-translate` 初译 — *阶段三至四·未启动（仅首段 PoC）*\n\n> **当前进度**：阶段一（底本完整性核查·德格完整）✓；阶段二（底本处理·45 品 TOC + sha256 台账）已落地；阶段四首件示范已出两例（§3.6 第1品开篇段、§3.7 品40 第1参 德雲比丘）；阶段三（模型选型评估）、阶段四（逐段对齐翻译）、阶段五（完整对读界面）未启动。〔未竟〕逐品汉藏对齐、名相术语库、偈颂分行对齐——俟后续批推进，不臆造。\n"
