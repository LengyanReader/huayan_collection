<script>
var ARTICLE = {"id": "huayan-sidi-pin", "file": "articles/huayan-sidi-pin.html", "title": "九九华严第八品 四圣谛品之拼读", "title_sub": "华严经第八品·第二会·差别因果周·卷十二末·十方十世界说四圣谛·四谛各十名共四百名·随众生心乐而异名·与六十对读·注疏诸家会读·数据层·未完备已标明", "icon": "📖", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第二会_普光明殿_差别因果周/华严经细读_第八部_四圣谛品.md", "doc_md": "# 华严经引读·第八部：四圣谛品（卷十二·品八）\n\n> **EN · Close Reading of the Avataṃsaka Sūtra, Part Eight: The Chapter of the Four Noble Truths**\n\n> **底本**：唐·实叉难陀译《大方广佛华严经》（八十华严）`T10n0279`。**范围：卷第十二末段（本品全文，品号第八）**。本品属**第二会「普光明殿会」·差别因果周**，接第七品《如来名号品》（身业·能）而明**口业·所**（说法遍周）。\n> **立稿**：2026-10-24。承第一会（品 1–6·卷 1–11）及第七品之体例与校勘纪律。\n> **本篇进度（覆盖率自陈）**：**全稿成篇**——§〇 凡例、§一 概述与品题解义、§二 全文逐段细读（序分·请分·说分·四圣谛名号遍周）、§三 旁参与前接、§四 义理要点与名相、§五 注疏选要·诸家会读（5.1 澄观／5.2 法藏／5.2′ 智俨／5.2″ 慧苑／5.3 李通玄／5.3′ 海云）、§六 文本对读与校勘（八十／六十·含卷五七–十界／四十／藏译／兜沙经 §6.5）、§七 结构分析·数据层、§八 附录十一类（含中英要目）、§九 台账，**皆已成**。〔P8·L.192 充实批 2026-10-26〕①§2.13 全文逐段入文（U01–U13·谛级分块 44 行式·程序预检全中·0 手抄）②§5.1 疏科长文全摘甲–癸十段（raw 原字形·窗 2,468 CJK）③§6.1′ 六十全本 25 段照录＋谛级对照表（440×2 名并置核验）④§7.5 数据科学四视角＋图 7-1 名号矩阵 SVG⑤附录四′ 澄观疏本科段全文照录（11 科段）⑥§2.0 体例 blockquote 转正文·§2.6 校勘按语移出引文行（出审计扫描区）。〔P6·2026-10-24〕新增：兜沙经 `T10n0280` 与六十华严全本 `T09n0278` 本地入库并回源（§6.5／§6.1 七–十界），英文要义与中英要目（§1.4 EN·附录九）已补，图〇-3 stale 占位与孤立 mermaid 残码已清理。凡未能确证者标〔待核〕、属推断者标〔本文判断〕；**不以骨架冒充细读**。梵藏对勘、图像文物等未竟之点俱入 §八·附录四台账、§九台账。\n> **原则**：沿用既定校勘纪律、三层疏解（疏解／名相／会读）、存疑必标、推断必标「〔本文判断〕」、讲者之说疑误只标不改、三译主从分明、不擅改经文、可回源可复核。**引注疏原文一律繁体照底本、逐字回源并注经号与行号；会读按语用简体。**\n\n## 〇、凡例（简要）\n\n一、**校勘底本**：以 `T10n0279` 为底本。六十华严（`T09n0278`）、四十华严（`T10n0293`）不作底本，但须品读并作对读；凡异译异说并列而不强断。\n\n二、**品读主从**：以八十华严为叙事主轴，六十为辅读与对读。主从仅指骨架取自何本，非谓其余可略。\n\n三、**疏解三层**：其下「疏解」为依经文直解；「名相」为训释与梵汉（凡无把握者标〔待核〕）；「会读」为注疏家与讲记等之判，非经证，凡引皆逐字回源。\n\n四、**引文可回源**：凡引经皆照 CBETA 底本原字形（繁体·异体），可回源可复核；凡引注疏皆注明经号与段落，无把握者标〔待核〕。**不擅改经文，亦不据听录回改底本。**\n\n五、**存疑必标**：凡未能确证者标〔待核〕；凡属本席推断者标「〔本文判断〕」；凡讲者之说疑误者只标不改。\n\n六、**文本现象与信度**：凡经文有缺文、增补、版本分合之别者，如实标识并系以文献/法义说明，给信度评级（见 §1.5）；**无从确证者只标〔疑阙〕／〔待核〕，不升级为断言**。\n\n七、**版本差异之惯例**：凡藏译、梵本、六十／四十华严与本品的分品、用字、文段有无、内容增减之别，**悉举而比之**，注版本与信度；**严禁以「藏译云」冒充未见之原文**。\n\n八、**计数口径**：字数以剥校勘之 CJK 口径计（含品题）；句数以句末标点（。！？）计；名号以「或名：」列举条目计。\n\n---\n\n<!-- ATLAS:BEGIN P8 -->\n### 〇之零、导读指南（阅读路径与方法）\n\n**定位：** 考证型细读（philological close reading），以「可复核性」为第一优先。本品一味以「四谛」为法，读法当以**谛为经、名为纬**：苦集灭道四行，行各十名，十方各四十——**名四百四十，谛则四而已**。\n**本品一句：** **苦集灭道，各随方立十名；名异而谛同，故曰「随众生心，悉令调伏」。**\n**路径：** 〇之二（二图四表）→ 一（品题与脉络）→ 二（全文逐段）→ 四（义理与名相）→ 五（诸家会读）→ 七（数据层）→ 附录按需查阅。\n**方法：** 先经文后诠释；〔实测〕／〔本文判断〕／〔存疑待核〕三分；负面证据同样入账；结构覆盖 100%，个体择要。\n**读前三问：** ① 四谛何以各立十名，十名之间是何次第？② 娑婆 40、十方 400、通计 440，而经文又说「四百亿十千」，四数如何并存？③ 四谛品何以次名号品而起？\n\n## 〇之二、本品内容地图（未入其门，先观其海）\n\n> **本节体例。** 图与表之数据，一律取自本文已回源核定之 §二逐段表与 §7.1／§7.5 实测数；**凡属推断者标〔本文判断〕，不入图**。图各看一事，勿求一图而尽本品。\n\n### 〇之二.0 提要\n\n本品占卷第十二末段，**剥校勘 CJK 3,262 字**（含品题），句末标点 116，独字 427；所举名号 **440**（娑婆四谛各十名＝40，十方十界各四十＝400）。其结构为全部三十九品中最简者之一：**序分只「文殊師利菩薩告諸菩薩言」一句，无独立请分**，直承前品续说；说分十一——娑婆（40）→十方十界（400）→类通一切·释差别所由。**结构之简，正是其义之密**：一切铺排皆在名号，不在科段。\n\n| 图 | 画什么 | 一句话 |\n|---|---|---|\n| **图 〇-1　娑婆四谛四十名矩阵** | 名如何成谛 | 苦集灭道四行，行各十名；十名同谛而异其侧显 |\n| **图 〇-2　所举与实有：四数并存图** | 数何以不矛盾 | 40／400／440 是所举，四百亿十千是每界实有 |\n\n**〔读法之序〕**　先观图 〇-1 得四谛十名之实（娑婆四十名，逐字照录），次观图 〇-2 辨「所举」与「实有」之别，次读〇之二.3 之坐标，然后入 §二逐段。**四数既分，名始不混。**\n\n> **EN corresponding · Map of the Chapter.** The shortest-structured chapter in the sūtra: one sentence of introduction, no separate request section, and then names and names. Four truths, ten names each, in this world (40); ten neighbouring worlds, forty each (400); 440 named in all — while the text says each world has four hundred billion ten-thousand names. Fig. 0-1 gives the forty names of Sahā verbatim; Fig. 0-2 separates what is *listed* from what is *said to exist*.\n\n### 〇之二.1 图 〇-1　娑婆四谛四十名矩阵\n\n<figure>\n<svg viewBox=\"0 0 1000 470\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"24\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">娑婆世界四圣谛：四行 × 十名</text>\n<text x=\"500\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a7a5e\">逐字照录 T10n0279 卷十二（§2.2）；十名皆「或名」，同谛而各侧显一义</text>\n\n<g font-size=\"11\" fill=\"#8a7a5e\" text-anchor=\"middle\">\n<text x=\"143\" y=\"74\">一</text><text x=\"228\" y=\"74\">二</text><text x=\"313\" y=\"74\">三</text><text x=\"398\" y=\"74\">四</text><text x=\"483\" y=\"74\">五</text><text x=\"568\" y=\"74\">六</text><text x=\"653\" y=\"74\">七</text><text x=\"738\" y=\"74\">八</text><text x=\"823\" y=\"74\">九</text><text x=\"908\" y=\"74\">十</text>\n</g>\n\n<rect x=\"18\" y=\"84\" width=\"964\" height=\"72\" fill=\"#f8f3ea\" stroke=\"#e0d6c2\"/>\n<text x=\"28\" y=\"108\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#7a5a28\">苦聖諦</text>\n<text x=\"28\" y=\"128\" font-size=\"10.5\" fill=\"#8a7a5e\">10 名</text>\n<g font-size=\"11.5\" fill=\"#5a5147\" text-anchor=\"middle\">\n<text x=\"143\" y=\"122\">罪</text><text x=\"228\" y=\"122\">逼迫</text><text x=\"313\" y=\"122\">變異</text><text x=\"398\" y=\"122\">攀緣</text><text x=\"483\" y=\"122\">聚</text><text x=\"568\" y=\"122\">刺</text><text x=\"653\" y=\"122\">依根</text><text x=\"738\" y=\"122\">虛誑</text><text x=\"823\" y=\"122\">癰瘡處</text><text x=\"908\" y=\"122\">愚夫行</text>\n</g>\n\n<rect x=\"18\" y=\"164\" width=\"964\" height=\"72\" fill=\"#f3ecdf\" stroke=\"#e0d6c2\"/>\n<text x=\"28\" y=\"188\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#7a5a28\">苦集聖諦</text>\n<text x=\"28\" y=\"208\" font-size=\"10.5\" fill=\"#8a7a5e\">10 名</text>\n<g font-size=\"11.5\" fill=\"#5a5147\" text-anchor=\"middle\">\n<text x=\"143\" y=\"202\">繫縛</text><text x=\"228\" y=\"202\">滅壞</text><text x=\"313\" y=\"202\">愛著義</text><text x=\"398\" y=\"202\">妄覺念</text><text x=\"483\" y=\"202\">趣入</text><text x=\"568\" y=\"202\">決定</text><text x=\"653\" y=\"202\">網</text><text x=\"738\" y=\"202\">戲論</text><text x=\"823\" y=\"202\">隨行</text><text x=\"908\" y=\"202\">顛倒根</text>\n</g>\n\n<rect x=\"18\" y=\"244\" width=\"964\" height=\"72\" fill=\"#f8f3ea\" stroke=\"#e0d6c2\"/>\n<text x=\"28\" y=\"268\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#7a5a28\">苦滅聖諦</text>\n<text x=\"28\" y=\"288\" font-size=\"10.5\" fill=\"#8a7a5e\">10 名</text>\n<g font-size=\"11.5\" fill=\"#5a5147\" text-anchor=\"middle\">\n<text x=\"143\" y=\"282\">無諍</text><text x=\"228\" y=\"282\">離塵</text><text x=\"313\" y=\"282\">寂靜</text><text x=\"398\" y=\"282\">無相</text><text x=\"483\" y=\"282\">無沒</text><text x=\"568\" y=\"282\">無自性</text><text x=\"653\" y=\"282\">無障礙</text><text x=\"738\" y=\"282\">滅</text><text x=\"823\" y=\"282\">體真實</text><text x=\"908\" y=\"282\">住自性</text>\n</g>\n\n<rect x=\"18\" y=\"324\" width=\"964\" height=\"72\" fill=\"#f3ecdf\" stroke=\"#e0d6c2\"/>\n<text x=\"28\" y=\"348\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#7a5a28\">苦滅道聖諦</text>\n<text x=\"28\" y=\"368\" font-size=\"10.5\" fill=\"#8a7a5e\">10 名</text>\n<g font-size=\"11.5\" fill=\"#5a5147\" text-anchor=\"middle\">\n<text x=\"143\" y=\"362\">一乘</text><text x=\"228\" y=\"362\">趣寂</text><text x=\"313\" y=\"362\">導引</text><text x=\"398\" y=\"362\">究竟無分別</text><text x=\"483\" y=\"362\">平等</text><text x=\"568\" y=\"362\">捨擔</text><text x=\"653\" y=\"362\">無所趣</text><text x=\"738\" y=\"362\">隨聖意</text><text x=\"823\" y=\"362\">仙人行</text><text x=\"908\" y=\"362\">十藏</text>\n</g>\n\n<text x=\"18\" y=\"428\" font-size=\"12\" fill=\"#7a5a28\">四行各十名＝<tspan font-weight=\"bold\">40 名</tspan>（娑婆一界所举）</text>\n<text x=\"18\" y=\"450\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 十名非「同义反复」：如苦谛十名，自「罪」（业）而「逼迫」（受）而「變異」（无常）而「聚」（蕴）而「愚夫行」（人）——<tspan fill=\"#7a5a28\">五蕴·三受·无常，皆苦之一面</tspan>。〔本文判断〕</text>\n</svg>\n<figcaption><b>图 〇-1　娑婆四谛四十名矩阵。</b>四行十列，四十名逐字照录。<b>十名不是同义语之堆叠，而是同一谛从不同面切入</b>：苦谛十名，自业（罪）而受（逼迫）而行（愚夫行）；灭谛十名，自「無諍」而「無自性」而「住自性」——<b>前九破，后一立</b>。〔本文判断〕读此图，当横看（同一谛之十面），不当竖看（四谛之次第）。<div class=\"en-line\">Fig. 0-1. Four rows, ten columns, the forty names of Sahā given verbatim. The ten names are not synonyms but facets: suffering seen as deed, as feeling, as the way of the fool; cessation seen as nine negations closing on one affirmation, 「住自性」.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. **横看十名，竖看四谛。** 横看则知一谛之十面，竖看则知四谛之次第；**两读不可同时**，同时则乱。\n2. **灭谛之十名，九破一立。** 「無諍·離塵·寂靜·無相·無沒·無自性·無障礙·滅·體真實·住自性」——前九皆遮，末一「住自性」独显。**遮至无可遮处，方说「住」。**\n3. **道谛以「一乘」为首。** 十名之中，「一乘」居首而「十藏」居末——**自一而十，自乘而藏**，正是华严「一即一切」之名相语法。\n\n### 〇之二.2 图 〇-2　所举与实有：四数并存图\n\n<figure>\n<svg viewBox=\"0 0 1000 480\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"24\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">四数并存：所举者样本，实有者法界</text>\n<text x=\"500\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a7a5e\">实线＝经中所举；虚线＝经中所说之实有</text>\n\n<rect x=\"60\" y=\"70\" width=\"880\" height=\"310\" rx=\"6\" fill=\"none\" stroke=\"#c9b98f\" stroke-dasharray=\"7 6\"/>\n<text x=\"76\" y=\"94\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#b8863c\">尽法界·虚空界·诸世界</text>\n<text x=\"76\" y=\"113\" font-size=\"11\" fill=\"#8a7a5e\">一一世界，四谛各有「四百億十千名」——实有</text>\n\n<rect x=\"110\" y=\"132\" width=\"780\" height=\"228\" rx=\"5\" fill=\"#f8f3ea\" stroke=\"#c9b98f\"/>\n<text x=\"126\" y=\"156\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#7a5a28\">十方十世界</text>\n<text x=\"126\" y=\"175\" font-size=\"11\" fill=\"#8a7a5e\">密訓·最勝·離垢·豐溢·攝取·饒益·鮮少·歡喜·關𨷲·振音　各 4×10＝40 名 → 合 400 名（所举）</text>\n\n<rect x=\"170\" y=\"196\" width=\"300\" height=\"120\" rx=\"5\" fill=\"#f3ecdf\" stroke=\"#c9b98f\"/>\n<text x=\"186\" y=\"220\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#7a5a28\">娑婆世界</text>\n<text x=\"186\" y=\"240\" font-size=\"11\" fill=\"#5a5147\">苦·集·滅·道 各十名</text>\n<text x=\"186\" y=\"260\" font-size=\"11\" fill=\"#5a5147\">＝ 40 名（所举）</text>\n<text x=\"186\" y=\"286\" font-size=\"11\" fill=\"#8a7a5e\">此即图 〇-1 之四十名</text>\n\n<g font-size=\"12\" fill=\"#7a5a28\">\n<text x=\"500\" y=\"222\" font-weight=\"bold\">40</text><text x=\"500\" y=\"240\" font-size=\"11\" fill=\"#8a7a5e\">娑婆所举</text>\n<text x=\"600\" y=\"222\" font-weight=\"bold\">400</text><text x=\"600\" y=\"240\" font-size=\"11\" fill=\"#8a7a5e\">十方所举</text>\n<text x=\"700\" y=\"222\" font-weight=\"bold\" fill=\"#b8863c\">440</text><text x=\"700\" y=\"240\" font-size=\"11\" fill=\"#8a7a5e\">通计所举</text>\n</g>\n<text x=\"500\" y=\"286\" font-size=\"11.5\" fill=\"#8a7a5e\">440 是「经中所举之全部」，非「法界之全部」</text>\n\n<text x=\"60\" y=\"420\" font-size=\"12\" fill=\"#7a5a28\">品末结句：「此娑婆世界說四聖諦，有如是等四百億十千名；<tspan font-weight=\"bold\">隨眾生心，悉令調伏</tspan>。」</text>\n<text x=\"60\" y=\"446\" font-size=\"11.5\" fill=\"#8a7a5e\">→ 名之多寡，随众生心；佛不以一名应一切机。故名有量而法无量。</text>\n</svg>\n<figcaption><b>图 〇-2　所举与实有：四数并存图。</b>三层套叠：内为娑婆所举四十，中为十方所举四百，外为尽法界每一世界之「四百亿十千」。<b>四数（40／400／440／四百亿十千）非互相矛盾，而是三种「所举」加一种「实有」</b>。凡读数目，须先问此数是「举」还是「有」；混之则疑经，分之则见法。<div class=\"en-line\">Fig. 0-2. Three nested frames: the forty names listed for Sahā, the four hundred listed for the ten neighbouring worlds, and — outermost, in dotted line — the four hundred billion ten-thousand names that every single world is said to possess. 40 / 400 / 440 are what the text *lists*; the last is what the text says *exists*. Confusing the two breeds phantom contradictions.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. **「所举」与「实有」必须分书。** 本法界观不以数为限：**举四十以摄四百亿十千，是方便；说四百亿十千，是实相**。\n2. **「随众生心，悉令调伏」是立名之由，也是全品之结。** 四谛之名所以千差，只因机有千差；**名从机立，法不随机而异**。\n3. **与第七品对读，可见两品之分工。** 名号品以「一佛多名」显遍，四谛品以「一法多名」显遍——**所遍同，所依异：一依身，一依法**。\n\n### 〇之二.3 本品在第二会（普光明殿·说十信）之坐标\n\n本品为第二会之次品。**前品明身业，本品明口业**——法藏「四諦品明佛口業普周」、澄观《演义钞》「身語既彰，意業將顯」；故本品之位置，正在三业之第二。\n\n| 品 | 卷 | 位／科 | 一句提撕 | 与本品之关系 |\n|---|---|---|---|---|\n| 7 如来名号（前） | 卷12 | 所信果·**身业**·名遍 | 211 名，一佛多名 | 名者召体；本品承其名而言谛 |\n| **8 四圣谛（本品）** | 卷12 | 所信果·**口业**·法遍 | 440 名，一法多名 | — |\n| 9 光明觉（后） | 卷13 | 所信果·**意业**·光遍 | 十段遍照，穷法界 | 三业毕，所信之境全彰 |\n| 10–12 问明·净行·贤首 | 卷13–15 | 十信之**解·行·德** | 由果转因 | 本品为「果」之末二品，下三品入「因」 |\n\n### 〇之二.4 本品形式特征（与邻品对看）\n\n本品之特色在**「结构最简而名相最密」**：序分仅一句，无请分，全品几无叙事，唯列名而已。以此读之，则知华严之「说」，有时不以义说而以名说。\n\n| 特征 | 本品表现〔实测〕 | 邻品之对照 | 读法上的后果 |\n|---|---|---|---|\n| 名相密度（全经最高） | 3,262 字／440 名（约 7.4 字一名） | 第七品 3,226 字／211 名（约 15 字一名） | 两品合看，是第二会「以名说法」之两极 |\n| 结构负荷最轻 | 序分一句、无请分、无偈颂 | 第七品序分三段＋请分四十问 | 品之轻重不在字数，在结构负荷 |\n| 四×十矩阵 | 苦集灭道四行，行各十名，四方同构 | 第九品十段为线性倍增 | 一为矩阵，一为链；矩阵宜横读 |\n| 名与义之张力 | 十名皆同一谛之侧显 | 第七品十名乃一佛之异称 | 同用「或名」，一显法、一显人 |\n| 校勘 | 旧图八方界名系初稿遗留，已订正 | 第七品密训九名、西北十一名 | 图与经不合者，改图不改经 |\n\n### 〇之二.5 五种读法（导览）\n\n| 读法 | 路径 | 适合谁 | 得什么 |\n|---|---|---|---|\n| **谛读** | 只取四谛各首名（罪·繫縛·無諍·一乘） | 初读本篇者 | 四谛之纲顷刻而得 |\n| **名读** | 逐行读十名，比其侧显 | 好名相者 | 见「一名一义」之训释法 |\n| **方读** | 只读十方世界名与「各四十名」 | 欲见遍周者 | 得 400 之量级 |\n| **数读** | 图 〇-2 ＋ §7.3 对看 | 欲辨所举与实有者 | 四数不复相碍 |\n| **承读** | §2.6 → 第九品 §2.1（足轮放光） | 欲见三业之转者 | 见口业如何让位于意业 |\n\n### 〇之二.6 数与位之谱：本品之数，四等分录\n\n华严之数非计数之数。本品所涉之数，来源不一，性质亦不一；**先分其等，后论其义**，则不为数目所惑。\n\n| 等第 | 数 | 出处 | 性质 |\n|---|---|---|---|\n| **T0 经文明文** | 「四百億十千名」 | `T10n0279` 卷十二·娑婆段结句 | 每一世界之实有 |\n| **T0 经文明文** | 「隨眾生心，悉令調伏」 | 同上·品末 | 立名之由（非数目） |\n| **T0 本文实测** | **440 名**（40＋400） | §7.3「或名」计数 | 计数（本文自测） |\n| **T0 本文实测** | 3,262 字・句末 116・独字 427 | §7.1 脚本 | 计数（本文自测） |\n| **T1 澄观《疏》** | 「約一界一諦即有十千。娑婆四諦有四百億十千名」 | `T1735` 本品段 | 注疏所定之数 |\n| **T1 法藏《探玄记》** | 「四諦品明佛口業普周」 | `T1733` | 三业分判之据 |\n| **T2 旧图** | 八方界名（親慧·有師子·妙觀察·喜樂·甚堅牢·妙地·焰慧·持地） | 初稿遗留·与 §2.5 实界名不合 | 负面证据，已订正不采用 |\n\n> **〔读法〕** 四数之辨，是本篇第一道关：**40 与 400 是「列名之数」，440 是「通计列名之数」，四百亿十千是「每界实有之数」**。前三是采样，后一是法界。读佛经数目，最忌以采样当法界、以法界疑采样。\n\n<!-- ATLAS:END P8 -->\n\n## 一、概述与品题解义\n\n### 1.1 品题释义\n\n**品名**：**四圣谛品**（八十华严**第八品**，唐·实叉难陀译）。全篇在《大方广佛华严经》**卷第十二**末段，紧接第七品《如来名号品》之后。为**第二会「普光明殿会」差别因果周**之**续品**（承第七品而来）。\n\n**「四聖諦」**——*catvāri āryasatyāni*：苦 (*duḥkha*)、集 (*samudaya*)、灭 (*nirodha*)、道 (*mārga*)。华严圆教之四圣谛，非小乘分破之四谛次第，而为法界缘起下之圆融四谛。\n\n### 1.2 品位与脉络（承上启下）\n\n**在华严经三十九品中之位**：第二会（普光明殿）次品，八十华严**第八品**，占**卷第十二**末段。\n\n**判位**——**法藏五分**（`T1733`）：「初品是教起因緣分。二舍那品中一周問答名**舉果勸樂生信分**。三從第二會至第六會來一周問答名**修因契果生解分**。」——**本品属「修因契果生解分」之继续**。\n\n**澄观**（`T1735`）：「**前會果廣因略。此會因廣果略**」；又「**今明能生因果信解故。次來也**」。\n\n**李通玄**（`T1739`）：判第一会（品 1–6）为「**舉果勸修**」，第二会六品为「**以果成信**」——「信自心是佛與果佛不異故」。\n\n**承上启下**：\n- **承上**：第七品《如来名号品》明**身业遍应**（名号依身而立），答前请分四十问中之「佛剎」「佛住」等；\n- **本品**：明**口业说法遍周**，答前请分中「佛所說法」之问，以四圣谛之百千万名遍周法界；\n- **启下**：第九品《光明觉品》明**意业遍觉**。\n\n**三业分判**（法藏／澄观／智俨三家同判，参第七部 §4.3）：\n- **名号品 = 身业**（法藏「名號依身而立」）\n- **四圣谛品 = 口业**（法藏「四諦品明佛口業普周」）\n- **光明觉品 = 意业**（法藏「光明覺品明佛意業遍覺」）\n\n澄观《演義鈔》（`T1736` **卷十五**）：「**先明如來三業正報。謂身語意。身是其總故先明之。應物成身隨宜立號。故受之以如來名號品。……九身語既彰。意業將顯。**」——本品正是「身語既彰」之后之口业展开。\n\n### 1.3 篇幅与结构预览\n\n- **本品范围**：卷第十二末段（`T10n0279`）。**实测**（§7.4 脚本，品界锚次品品题）：**3,262 字**（CJK 剥校勘口径，含品题）；句末标点（。！？）**116** 处（其中「。」60）；独字 **427**〔详见 §7.1〕。\n- **结构骨架**（八十本）：\n  - **序分**：文殊师利菩萨告诸菩萨（标主）；\n  - **请分**：无独立请分，本品直接承接前品续说；\n  - **说分**：①娑婆世界四圣谛十名（苦·集·灭·道各十名）→②密训世界四圣谛十名→③最胜世界→④……→⑩振音世界→⑪类通一切·释差别所由。\n- **统计要点**：娑婆世界四圣谛各有 **10 名**（共 40 名）；十方世界各有 **10 名**（共 10×40=400 名）；娑婆与十方各世界皆有 **400 亿十千名**；类通尽法界虚空界。\n\n### 1.4 核心要义\n\n本品要义三（详 §2、§4、§5）：\n\n1. **四圣谛之名号遍周**——苦集灭道在娑婆世界各有十名，随众生心而立；密训、最胜、……振音等十方世界各有其名，类通尽法界虚空界。**此即「名知名性離」之具体展开**——一切世间名皆佛名，名体性自解脱。\n2. **答前请分「佛所说法」**——第七品请分四十问中「佛所說法」之问，本品以四圣谛之百千万名作答；「随众生心，悉令调伏」。\n3. **四圣谛之圆教诠释**——苦集灭道在华严圆教中非小乘分破之次第，而为法界缘起下之圆融四谛：苦即法界、集即法界、灭即法界、道即法界，**一即一切，一切即一**。\n\n> **EN · the three key points (dragon-eye gloss)**：① *the four truths' names pervade every world* — ten names each in Sahā, forty in each of the ten directions, to the ends of the dharma- and space-realms, \"accord with beings' minds, and all are tamed\"; ② they *answer the petition \"what the Buddhas teach\"* (the move from the Name-Chapter's body-karma to this chapter's speech-karma); ③ read through the Perfect Teaching, the four are not the Hīnayāna's analyzed sequence but one truth in four aspects of dharma-realm origination — *one is all, all is one*. 〔P6·2026-10-24〕\n\n### 1.5 经文文本现象与信度标识\n\n**标识符号集**（沿用全系列）：\n\n| 标识 | 含义 | 于本品之例 |\n|------|------|------|\n| 〔缺文〕 | 经文有脱文/阙漏 | 详见 §6 校勘 |\n| 〔疑阙〕 | 疑有阙文而未确 | 六十本「西北」11名等，存而不论 |\n| 〔等〕 | 经文固有之省略代表例（非残缺） | 各名号末「……」（「如是等」前） |\n\n**信度评级**（沿用全系列三级来源评级）：\n\n| 级 | 判据 | 例 |\n|----|------|----|\n| T0／一手 | 原典本身（CBETA 底本） | `T10n0279` 卷十二文字 |\n| T1／原典 | 同系统译本/注疏（异译、古注原本） | 六十华严、澄观疏、法藏探玄记、李通玄论、智俨搜玄记 |\n| T2／学术 | 同行评议论著、学术论文 | 藏译编目 |\n| T3／二手 | 百科、官网、口说转述 | 法师讲记听录 |\n\n### 1.6 版本差异之惯例与本品之版本情况\n\n> **惯例**：凡**藏译（Toh 44）、梵本残片、六十／四十华严**之对应段与本品有别者——不论**分品、用字、文段有无、内容增减**——**悉举而比对之**，并注版本与信度。**无别者亦标「与汉本大体同」**。\n\n**本品之版本情况**（据现有一手/二手材料，对读详 §六）：\n\n1. **六十华严（`T09n0278`）**：**有对应品**——品题作〈**四諦品**〉（六十本第 4 品·**卷第四**；**六十无「聖」字**，本机 `T09n0278_juan4.txt` 品题@L297「大方廣佛華嚴經四諦品第四之一」）。其段与八十本品**结构平行而用字、次第、数目多异**（详 §6.1 逐名对照）。\n2. **四十华严（`T10n0293`）**：**无本品**（四十华严独译〈入法界品〉），不涉及。\n3. **梵本**：题名待核〔待核〕。\n4. **藏译（Toh 44）**：**本品当藏译第 13 品**而**名同**（「四圣谛品」；据二手编目〔T2·待核〕；本机无藏本，**不臆造**）。**品序差＝＋5**（论证链见 §6.3）。\n\n### 1.7 核心要义小结\n\n本品以「**谛**」字立骨：**四圣谛在娑婆各有十名 → 十方世界各有其名 → 类通尽法界虚空界 → 随众生心悉令调伏**。前品（名号品）举「**身业遍应**」，本品举「**口业说法遍周**」——答前请分「佛所说法」之问。其要在「**苦集灭道之圆教诠释**」与「**名知名性離**」之具体展开。为第二会「差别因果周」十信法门之继续。\n\n---\n\n## 二、卷第十二末段（四圣谛品第八·本品全文）\n\n> **〔经文回源〕** 以下经文一律照 `T10n0279` 卷十二底本原字形（繁体）；标点为底本所具，**不擅改**。段落划分依八十本「序分／请分／说分」三科（`T1735`／`T1733`／`T1732`／`T1739` 诸家判同），逐段以「疏解／名相／会读」三层疏之。\n\n### 2.0 结构总表（据经切分）\n\n| 序 | 段（科） | 经段 | 内容 |\n|---|---------|------|------|\n| 序一 | 标主 | 尔时，文殊师利菩萨告诸菩萨言 | 文殊说 |\n| 说一 | 苦圣谛·娑婆十名 | 诸佛子！苦圣谛，此娑婆世界中…… | 苦 10 名 |\n| 说二 | 苦集圣谛·娑婆十名 | 诸佛子！苦集圣谛…… | 集 10 名 |\n| 说三 | 苦灭圣谛·娑婆十名 | 诸佛子！苦灭圣谛…… | 灭 10 名 |\n| 说四 | 苦灭道圣谛·娑婆十名 | 诸佛子！苦灭道圣谛…… | 道 10 名 |\n| 说五 | 总标 | 此娑婆世界说四圣谛……四百億十千名 | 总标娑婆 |\n| 说六 | 密训世界四圣谛 | 诸佛子！此娑婆世界所言苦圣谛者…… | 密训 4×10 名 |\n| 说七 | 最胜世界四圣谛 | 诸佛子！此娑婆世界所言苦圣谛者…… | 最胜 4×10 名 |\n| … | … | … | … |\n| 说十 | 振音世界四圣谛 | 诸佛子！振音世界…… | 振音 4×10 名 |\n| 说十一 | 类通一切·释由 | 如娑婆世界……尽法界、虛空界…… | 类通+释由 |\n\n> **〔口径〕** 苦/集/灭/道在娑婆世界各 **10 名**（共 40 名）；十方世界各 **40 名**（共 10×40=400 名）；娑婆与十方各世界皆有 **400 亿十千名**。\n\n**〔体例·择要三层＋全表〕**〔P5·2026-10-24 明定·L.192 转正文以出引文审计扫描区〕本品说分十段名号重复（10 世界×400 名），逐世界铺三层不现实，亦无益于义理；故定三层口径，**下表即本段之逐档索引**：\n- **甲·全文三层**（经文逐字回源＋疏解/名相/会读三层齐备）：§2.1 序分标主、§2.2 娑婆四十名、§2.6 类通一切·释由——此三段为义理枢轴。\n- **乙·节引＋疏解＋名相/会读从略**：§2.3 密训（有从略节引＋疏解＋名相＋会读）、§2.4 最胜（有节引＋疏解；名相/会读并入下方全表与 §2.5 口径，不再分列）。\n- **丙·全表体例**（不逐段节引，名号全量据 `T10n0279` 卷十二逐字回源入表）：§2.5 十方十世界 400 名全表——表即经文之名号层全文；疏解归 §2.2「随众生心而立名」、会读归 §2.6 与 §五诸家，**不重复铺三层**。\n\n据此，§2.3/§2.4 无逐段会读、§2.5 只有全表，**属显式体例而非遗漏**。\n\n### 2.1 序分：文殊告众\n\n**经文**：\n\n> 爾時，文殊師利菩薩摩訶薩告諸菩薩言：「諸佛子！苦聖諦，此娑婆世界中，或名：罪，或名：逼迫，或名：變異，或名：攀緣，或名：聚，或名：刺，或名：依根，或名：虛誑，或名：癰瘡處，或名：愚夫行。」\n\n**疏解**：**标主**。本品由文殊师利菩萨主说，承第七品文殊叹德·标不可思议之义而展开。文殊为「自心妙择之慧」，故四圣谛之说法由文殊出，正当其位。\n\n**名相**：\n- **文殊师利**（*Mañjuśrī*）——法藏略叙五义（名义·出处·师资·位次·德用）；澄观释「菩薩妙德者。慧達佛境」。本品由文殊主说，因四圣谛之法门属「慧」所摄——苦集灭道之义理，须以慧观照之。\n- **苦圣谛**（*duḥkhasatya*）——*duḥkha*「苦」，本义为「空虚、不称意」（*duḥ*「难」+*kha*「空」）；*satya*「谛」为「真实、如所是」。\n\n**会读**：李通玄（`T1739` **L5740**，名号品段）「**文殊師利。是自心妙擇之慧**」；法藏（`T1733` **L3653**）「**又謂前會明所信之境。今辨能信之行**」——本品由名号品之「名」转入四圣谛之「谛」，由名号之遍周转入说法之遍周。〔旧稿将「前會舉所信之境。今明能信之行」误系于李通玄名下；经逐字核验，此语实出**法藏** T1733 L3653，T1739 无此文，今归位。〕\n\n### 2.2 说分一：娑婆世界四圣谛（4×10 名）\n\n**经文**（照 `T10n0279` 卷十二，逐字回源）：\n\n> 爾時，文殊師利菩薩摩訶薩告諸菩薩言：「諸佛子！苦聖諦，此娑婆世界中，或名：罪，或名：逼迫，或名：變異，或名：攀緣，或名：聚，或名：刺，或名：依根，或名：虛誑，或名：癰瘡處，或名：愚夫行。諸佛子！苦集聖諦，此娑婆世界中，或名：繫縛，或名：滅壞，或名：愛著義，或名：妄覺念，或名：趣入，或名：決定，或名：網，或名：戲論，或名：隨行，或名：顛倒根。諸佛子！苦滅聖諦，此娑婆世界中，或名：無諍，或名：離塵，或名：寂靜，或名：無相，或名：無沒，或名：無自性，或名：無障礙，或名：滅，或名：體真實，或名：住自性。諸佛子！苦滅道聖諦，此娑婆世界中，或名：一乘，或名：趣寂，或名：導引，或名：究竟無分別，或名：平等，或名：捨擔，或名：無所趣，或名：隨聖意，或名：仙人行，或名：十藏。諸佛子！此娑婆世界說四聖諦，有如是等四百億十千名；隨眾生心，悉令調伏。」\n\n**疏解**：**别显「四圣谛在娑婆世界各有十名」**。文殊师利告诸菩萨，娑婆世界中四圣谛各随众生心而立十名，合四十名；类通一切世界则各有四百億十千名。**苦集灭道**之名，非一义而立，乃随机立称。\n\n**名相（娑婆世界四圣谛）**：\n\n| 谛 | 十名 | 简释（〔本文判断〕，非经文明言） |\n|---|------|----------------------------|\n| **苦圣谛** | 罪、逼迫、變異、攀緣、聚、刺、依根、虛誑、癰瘡處、愚夫行 | 「罪」有过之义；「逼迫」苦迫；「變異」无常；「攀緣」执取；「聚」五蕴积聚；「刺」如荆棘；「依根」依根而起；「虛誑」虚妄不实；「癰瘡處」如痈疮；「愚夫行」愚人所行 |\n| **苦集圣谛** | 繫縛、滅壞、愛著義、妄覺念、趣入、決定、網、戲論、隨行、顛倒根 | 「繫縛」结缚；「滅壞」败坏；「愛著義」贪爱；「妄覺念」虚妄觉知；「趣入」趣向；「決定」决定；「網」罗网；「戲論」戏论；「隨行」随顺；「顛倒根」颠倒之根 |\n| **苦灭圣谛** | 無諍、離塵、寂靜、無相、無沒、無自性、無障礙、滅、體真實、住自性 | 「無諍」无诤；「離塵」离尘；「寂靜」寂静；「無相」无相；「無沒」不灭；「無自性」无自性；「無障礙」无障碍；「滅」息灭；「體真實」体真实；「住自性」住自性 |\n| **苦灭道圣谛** | 一乘、趣寂、導引、究竟無分別、平等、捨擔、無所趣、隨聖意、仙人行、十藏 | 「一乘」一乘；「趣寂」趣寂；「導引」引导；「究竟無分別」究竟无分别；「平等」平等；「捨擔」舍担；「無所趣」无所趣；「隨聖意」随圣意；「仙人行」仙人行；「十藏」十藏 |\n\n**会读**：澄观（`T1735` **L5397**，本品段)：「**故。是無量四諦義也。約一界一諦即有十千。娑婆四諦有四百億十千名**」——苦集灭道在娑婆世界各有十名，**随众生心而立**，非固定之名。此即华严「名知名性離」之具体展开。法藏（`T1733` **L3664**）：「**四諦品明佛口業普周**」——本品以四圣谛之名号遍周，答前请分「佛所說法」之问。〔按：此句在本机抽取本之行序属名号品段（四諦品第四@L3931 之前），系跨品之判语，**引为旁证可、作为本品五门正文则不可**，参 §5.2 校订〕李通玄（`T1739` **L6026–L6027**，名号品段之通判）：「**非但論名號遍周。但是如來身口意業總皆遍周**」（参 §5.3 旁引）。\n\n### 2.3 说分二：密训世界四圣谛（4×10 名）\n\n**经文**（节引）：\n\n> 「諸佛子！此娑婆世界所言苦聖諦者，彼密訓世界中，或名：營求根，或名：不出離，……或名：形狀物。諸佛子！所言苦集聖諦者，彼密訓世界中，或名：順生死，或名：染著，……或名：分數。諸佛子！所言苦滅聖諦者，彼密訓世界中，或名：第一義，或名：出離，……或名：決定。諸佛子！所言苦滅道聖諦者，彼密訓世界中，或名：猛將，或名：上行，……或名：觀方。」\n\n**疏解**：**密训世界四圣谛各有十名**。苦圣谛十名（營求根·不出離·繫縛本·作所不應作·普鬪諍·分析悉無力·作所依·極苦·躁動·形狀物）；苦集圣谛十名（順生死·染著·燒然·流轉·敗壞根·續諸有·惡行·愛著·病源·分數）；苦灭圣谛十名（第一義·出離·可讚歎·安隱·善入處·調伏·一分·無罪·離貪·決定）；苦灭道圣谛十名（猛將·上行·超出·有方便·平等眼·離邊·了悟·攝取·最勝眼·觀方）。\n\n**名相**：密训世界（*密訓*）——澄观于**名号品段**（本机 PDF 抽取本 `T1735_澄观_华严经疏.txt` **L5366**，在四圣谛品五门起于 L5378 之前）释「**密訓唯九者。勘晉經開曉意下闕一聞慧……**」（此校止密训世界名数之多寡，名号／四谛二品之密训世界名列表均适用）；另于本品段 L5430–L5436 释「**一密訓即東方界也**」（方位名相，参 §5.1）。〔按：八十本今本密训实十名，澄观所据写本与今本或有出入；此注按行序属名号品段，**品段归属并存待核**〕〔待核〕\n\n**会读**：李通玄「**但举其法。表其作用。如文殊普贤等法身解者**」（本机 `T1739_李通玄_新华严经论.txt` **L5786**，属名号品段之通判）——密训世界之名号，非实地之名，乃举法表作用、随众生心而立。〔旧稿「在方无方。但举其法以况其理」经逐字核验：「在方无方」「以况其理」本机 T1739 查无，已改据 L5786。〕〔待核〕\n\n### 2.4 说分三：最胜世界四圣谛（4×10 名）\n\n**经文**（节引）：\n\n> 「諸佛子！此娑婆世界所言苦聖諦者，彼最勝世界中，或名：恐怖，或名：分段，……或名：有勢力。諸佛子！所言苦集聖諦者，彼最勝世界中，或名：敗壞，或名：癡根，……或名：壞善利。諸佛子！所言苦滅聖諦者，彼最勝世界中，或名：大義，或名：饒益，……或名：無為。諸佛子！所言苦滅道聖諦者，彼最勝世界中，或名：能燒然，或名：最上品，……或名：殊勝義。」\n\n**疏解**：**最胜世界四圣谛各有十名**。苦圣谛十名（恐怖·分段·可厭惡·須承事·變異·招引怨·能欺奪·難共事·妄分別·有勢力）；苦集圣谛十名（敗壞·癡根·大怨·利刃·滅味·仇對·非己物·惡導引·增黑闇·壞善利）；苦灭圣谛十名（大義·饒益·義中義·無量·所應見·離分別·最上調伏·常平等·可同住·無為）；苦灭道圣谛十名（能燒然·最上品·……殊勝義）。\n\n**名相**（〔P5 补·乙档从略之据〕）：最胜（*最勝*）——六十本作「**最勇**」世界（本机 `T09n0278_juan4` L302，参 §6.1 表（二）），同名异译。\n\n**会读**（〔P5 补·乙档从略之据〕）：澄观（`T1735` **L5428–L5429**，本品段）：「**二結云四百億十千者。准望前名號。一四洲有十千。今一四天下一諦。亦有十千。四諦歷於百億。故有四百億箇十千**」——总释娑婆与十方诸界同名数之计算口径（依名号品例推），最胜等九界之名数同此，不重出。〔按：此段在澄观疏中紧接本品五门之后，属四圣谛品位段〕\n\n### 2.5 说分四–十：十方世界四圣谛（4×10 名，共 400 名）\n\n**经文**（照 `T10n0279` 卷十二，逐字回源）：十方世界（密訓·最勝·離垢·豐溢·攝取·饒益·鮮少·歡喜·關𨷲·振音）各有苦·集·灭·道四圣谛，每谛十名，共 400 名。以下据 CBETA 底本逐字列出。\n\n**名相（十方世界四圣谛全表）**——据 `T10n0279` 卷十二逐字回源：\n\n| 世界 | 苦圣谛（十名） | 苦集圣谛（十名） | 苦灭圣谛（十名） | 苦灭道圣谛（十名） |\n|------|--------------|----------------|----------------|------------------|\n| **密訓** | 營求根、不出離、繫縛本、作所不應作、普鬪諍、分析悉無力、作所依、極苦、躁動、形狀物 | 順生死、染著 二底本但云「說四聖諦」（彼一一世界中說四聖諦亦各有四百億十千名隨眾生心悉令調伏），今照底本改回，逐字回源。\n\n**疏解**：**类通一切**（如娑婆，如是十方尽法界虚空界，四圣谛各有四百億十千名）＋**随众生心，悉令调伏**（释差别所由——随众生心而立名，令其调伏）。\n\n**名相**：澄观「**釋差別所由。此有二意。一自既由於差別名言等而得成就。今還倣古以差別熟他。二昔菩薩時隨機調物。今時出世稱本立名**」——一言「称本立名」，一言「倣古熟他」。\n\n**会读**：李通玄（`T1739`）「**如世尊已下舉世尊往因所行。今為眾說**」；又总判本品「**非但論名號遍周。但是如來身口意業總皆遍周**」。本品以四圣谛之名号遍周，答前请分「佛所說法」之问——一切名皆为度生而立，随物立称，令各别知见。\n\n### 2.13 说分一–十一·全文逐段入文〔L.192 本批·全量入文〕\n\n以下依 `_e8_full.py` 平文器单元序列（U01–U13·正文 13 单元·品界 CJK @76286–79548·3,262 含品题/byline，正文净 3,228）（`T10n0279` 卷十二·逐字（`_e8_full.py` 平文器·§7.4 锚口径）），**谛级分块逐段照录全引**；段块题依澄观正释文科（§5.1 戊–癸：先標告·初娑婆諦名·二隣次十界·三類通一切·四主伴無窮）；§2.2–§2.6 之节引与三层疏解存旧不废，本节为**全文档**。\n\n**（序·标主）U01**\n\n> 爾時，文殊師利菩薩摩訶薩告諸菩薩言：\n\n**（甲·娑婆·本处）U02〔@252·CJK252·40 名〕**\n\n> 「諸佛子！苦聖諦，此娑婆世界中，或名：罪，或名：逼迫，或名：變異，或名：攀緣，或名：聚，或名：刺，或名：依根，或名：虛誑，或名：癰瘡處，或名：愚夫行。諸佛子！\n\n> 苦集聖諦，此娑婆世界中，或名：繫縛，或名：滅壞，或名：愛著義，或名：妄覺念，或名：趣入，或名：決定，或名：網，或名：戲論，或名：隨行，或名：顛倒根。諸佛子！\n\n> 苦滅聖諦，此娑婆世界中，或名：無諍，或名：離塵，或名：寂靜，或名：無相，或名：無沒，或名：無自性，或名：無障礙，或名：滅，或名：體真實，或名：住自性。諸佛子！\n\n> 苦滅道聖諦，此娑婆世界中，或名：一乘，或名：趣寂，或名：導引，或名：究竟無分別，或名：平等，或名：捨擔，或名：無所趣，或名：隨聖意，或名：仙人行，或名：十藏。諸佛子！此娑婆世界說四聖諦，有如是等四百億十千名；隨眾生心，悉令調伏。\n\n*〔按〕U02 结句「…有如是等四百億十千名；隨眾生心，悉令調伏」粘连于道谛块尾（裸式无独立结语切点）·照录不另分。*\n\n**（乙·1·密訓）U03〔@279·CJK279〕**\n\n> 「諸佛子！此娑婆世界所言苦聖諦者，彼密訓世界中，或名：營求根，或名：不出離，或名：繫縛本，或名：作所不應作，或名：普鬪諍，或名：分析悉無力，或名：作所依，或名：極苦，或名：躁動，或名：形狀物。諸佛子！\n\n> 所言苦集聖諦者，彼密訓世界中，或名：順生死，或名：染著，或名：燒然，或名：流轉，或名：敗壞根，或名：續諸有，或名：惡行，或名：愛著，或名：病源，或名：分數。諸佛子！\n\n> 所言苦滅聖諦者，彼密訓世界中，或名：第一義，或名：出離，或名：可讚歎，或名：安隱，或名：善入處，或名：調伏，或名：一分，或名：無罪，或名：離貪，或名：決定。諸佛子！\n\n> 所言苦滅道聖諦者，彼密訓世界中，或名：猛將，或名：上行，或名：超出，或名：有方便，或名：平等眼，或名：離邊，或名：了悟，或名：攝取，或名：最勝眼，或名：觀方。諸佛子！密訓世界說四聖諦，有如是等四百億十千名；隨眾生心，悉令調伏。\n\n**（乙·2·最勝）U04〔@283·CJK283〕**\n\n> 「諸佛子！此娑婆世界所言苦聖諦者，彼最勝世界中，或名：恐怖，或名：分段，或名：可厭惡，或名：須承事，或名：變異，或名：招引怨，或名：能欺奪，或名：難共事，或名：妄分別，或名：有勢力。諸佛子！\n\n> 所言苦集聖諦者，彼最勝世界中，或名：敗壞，或名：癡根，或名：大怨，或名：利刃，或名：滅味，或名：仇對，或名：非己物，或名：惡導引，或名：增黑闇，或名：壞善利。諸佛子！\n\n> 所言苦滅聖諦者，彼最勝世界中，或名：大義，或名：饒益，或名：義中義，或名：無量，或名：所應見，或名：離分別，或名：最上調伏，或名：常平等，或名：可同住，或名：無為。諸佛子！\n\n> 所言苦滅道聖諦者，彼最勝世界中，或名：能燒然，或名：最上品，或名：決定，或名：無能破，或名：深方便，或名：出離，或名：不下劣，或名：通達，或名：解脫性，或名：能度脫。諸佛子！最勝世界說四聖諦 → 类通一切·释由）**。其骨在「**谛**」——由娑婆四圣谛各十名，扩至十方世界各四十名，再「类通」尽法界虚空界，末「释由」归于随众生心悉令调伏。正合李通玄「**一切處普賢菩薩。一切處金色世界。一切處文殊師利。一切處不動智佛**」之「遍周」义，与第七品名号品相为表里。\n\n---\n\n## 三、旁参与前接\n\n### 3.1 前接（第七品《如来名号品》）\n\n**前接**：《如来名号品》第七（卷十二）——明如来身业遍应（名号依身而立），答前请分四十问中之「佛剎」「佛住」等。\n\n**承接关系**：第七品「身业·能」→ 第八品「口业·所」。法藏（`T1733` **L3653**）「**又謂前會明所信之境。今辨能信之行**」；本品由名号之遍周转入四圣谛之遍周，由身业之遍应转入口业之说法。\n\n**答前四十问**：第七品请分四十问中「佛所說法」「演說一切諸法」等相关问题，本品以四圣谛之百千万名作答——「隨眾生心，悉令調伏」。\n\n### 3.2 后接与同会续品\n\n**后接（第二会次品）**：《光明觉品》第九（卷十三）——明如来意业遍觉，答前请分中「佛大菩提」等相关问题。\n\n**同会续品**：《菩萨问明品》第十、《净行品》第十一、《贤首品》第十二。\n\n### 3.3 旁参\n\n- **单品别译**：《佛说兜沙经》（`T10n0280`，后汉·支娄迦谶译，约 167 年）——为《华严》最早汉译之单品，「内容对应于八十华严《如来名号品》的一部分」（二手编目，T2·本地直证详 §6.5）。〔本文判断〕此可佐证本品为《华严》最古老流传之单品之一。\n  - **论证链透明化**〔P4·2026-10-24｜**P6·兜沙经回源订正 2026-10-24**〕：①译者与年代——《大正藏》目录题记「後漢月氏三藏支婁迦讖譯」；本机 `T10n0280.xml` **已入库**（2026-10-24·42,277 B·sha256:7232badbeb89），题记得本地直证〔T0〕。②「对应名号品一部分」——据学界对 proto-Avatamsaka 诸别译本之重建（Nattier 2005，参本仓 `docs/工程治理/next-phase-plan.md` L.㊵·origins 段登记）〔T2〕。③**实测修正**：逐字检视本机兜沙经，其正文属「佛在摩竭提國·始成正覺·自然金剛蓮華·十佛剎塵諸菩薩·不可計佛剎處」之 **proto-华严「名号／华藏」系统**，通篇**不作苦·集·滅·道四谛别列名**；故旧稿「兜沙经明四谛名」之说不成立，其「佐证」当**降格**为「佐证名号／华藏类料早出」——本品承第七品《如来名号品》而来，得其**间接**旁证，非本品四谛之直证。〔本文判断·据本机实测·详 §6.5〕\n- **六十本对应**：《四圣谛品》（`T09n0278` 卷四；六十本品题作「四諦品」无「聖」字，品题@本机卷四抽取本 L297），详 §6.1。\n- **藏译独有品**：藏译〈如来华严品〉（藏 11）位当第一会末，与本品无直接关联，但品序差＝＋5（承第七品；论证链见 §6.3）。\n\n---\n\n## 四、义理要点与名相\n\n### 4.1 四圣谛之圆教诠释\n\n华严圆教诠释四圣谛，不同于小乘分破之四谛次第：\n\n- **苦**：在法界缘起下，苦即法界——「苦」非独立实体，而是法界缘起之显现。苦谛之「谛」为「真实、如所是」，非苦之实体，而是苦之真实相。\n- **集**：集即法界——烦恼之生，亦法界缘起之显现。集谛非独立之烦恼实体，而是法界缘起之流转。\n- **灭**：灭即法界——涅槃之寂，亦法界缘起之还灭。灭谛非独立之涅槃实体，而是法界缘起之息灭。\n- **道**：道即法界——修行之门，亦法界缘起之还源。道谛非独立之修行实体，而是法界缘起之还源。\n\n**〔本文判断〕** 四圣谛在华严圆教中，非四者相异之四谛，而为法界缘起之一谛四相——苦集灭道，一即一切，一切即一。此为义理归纳，**本品经文**中未明言（经中明言者仅「隨眾生心，悉令調伏」）；然**诸家注疏确有明文**：澄观 T1735 **L5390–L5401**「了陰入皆如無苦可捨…不取不捨同一實諦」、李通玄 T1739 **L6061–L6063**「此一乘經言四聖諦者。是其實義…達苦性真無厭故」（参 §5.1、§5.3）——故本项非无据之归纳，而是「经无明文、疏有明文」。\n\n### 4.2 三业分判——身·口·意\n\n法藏／澄观／智俨三家同判第二会初三品为如来三业（参第七部 §4.3）：\n\n| 品 | 三业 | 义 |\n|---|------|----|\n| **名号品**（第七品） | **身业** | 名号依身而立，遍应十方 |\n| **四圣谛品**（第八品） | **口业** | 说法遍周，四圣谛之名号遍周法界 |\n| **光明觉品**（第九品） | **意业** | 意业遍觉，光明遍照 |\n\n澄观《演義鈔》（`T1736` **卷十五**，本机 **L7061–L7064**）：「**故先明如來三業正報。謂身語意。身是其總故先明之。應物成身隨宜立號。故受之以如來名號品。……九身語既彰。意業將顯。**」——本品正是「身語既彰」之后之口业展开。\n\n### 4.3 四十问之承转\n\n第七品请分四十问中，与本品相关者：\n\n- 「**佛所說法**」——本品以四圣谛之百千万名作答；\n- 「**演說一切諸法**」——本品以四圣谛之名号遍周法界作答；\n- 「**令諸眾生永離一切煩惱故**」——本品以「隨眾生心，悉令調伏」作答。\n\n**〔本文判断〕** 本品之「四圣谛名号遍周」，正是对第七品请分中「佛所說法」之直接回答——说法遍周，非限于娑婆，而遍周法界虚空界。\n\n### 4.4 名相表\n\n| 名相 | 训释 | 出处 |\n|---|---|---|\n| 四聖諦 | 苦集灭道之四真实 | 八十本经 |\n| 苦 | *duḥkha*，空虚不称意 | 八十本经 |\n| 集 | *samudaya*，积聚、招引 | 八十本经 |\n| 滅 | *nirodha*，息灭、寂灭 | 八十本经 |\n| 道 | *mārga*，道路、修行 | 八十本经 |\n| 文殊師利 | *Mañjuśrī*，妙德、妙吉祥 | `T1735`／`T1733` |\n| 密訓世界 | *密訓*，澄观释「密訓唯九者……」 | `T1735`〔待核〕 |\n\n### 4.5 小结\n\n本品以「**谛**」字立骨：四圣谛在娑婆各有十名，十方世界各有其名，类通尽法界虚空界，随众生心悉令调伏。前品（名号品）举「身业遍应」，本品举「口业说法遍周」——答前请分「佛所说法」之问。其要在「苦集灭道之圆教诠释」与「名知名性離」之具体展开。为第二会「差别因果周」十信法门之继续。\n\n---\n\n## 五、注疏选要（诸家会读）\n\n> **〔体例〕** 引注疏原文一律繁体照底本、逐字回源并注经号与行号；会读按语用简体。凡转述者标〔转述〕，存疑标〔待核〕、推断标〔本文判断〕。\n\n### 5.1 澄观《大方广佛华严经疏》（`T1735`）——「四圣谛品第八」段\n\n**来源**：唐·清凉山大华严寺沙门澄观撰《大方广佛华严经疏》**卷第十三**（经首署「四聖諦品第八」）。本机 `data/references/cbeta_txt/T1735_澄观_华严经疏.txt`。\n\n**判品·「釋此一品，五門分別」**（*five gates*：來意·釋名·宗趣·解妨·正釋文）：\n\n> **〔校订 2026-10-24·P1 逐字回源〕** 旧稿本节所引「將釋此品。五門分別……顯佛名號周遍為宗……文分為四」诸句，经行号级核验（本机 PDF 抽取本 `T1735_澄观_华严经疏.txt` L5092–L5377），**实为澄观〈如來名號品第七〉之五门分别**；四圣谛品五门实起于 L5378 品题后。旧稿系整段串科（将次前品之科误挂本品），今按 L5378–L5445 真段逐字重写，旧句归位标注为「名号品段旁引」。\n\n**（一）来意**（L5379–L5381）：\n> 「**釋此一品。五門分別。初來意者。此品廣前種種語業。即答前佛說法問。亦遠答前會佛演說海之一問故。既知佛可歸。次知法可仰。上名隨物立。今法逐機差故次來也。**」\n\n——本品答第七品四十問中「**佛說法**」問，并遠答第一會「**佛演說海**」之問；「上名隨物立，今法逐機差」正是名號（前品）→四諦（本品）之承转。\n\n**（二）释名**（L5381–L5401）：\n> 「**言四聖諦者。聖者正也。無漏正法得在心故。諦有二義。一者諦實。二者審諦。……凡夫雖有苦集。而不審實不得稱諦。無倒聖智審知境故。故名聖諦。**」（L5381–L5385）\n> 「**四謂苦集滅道。總云四聖諦。帶數釋也。……逼迫名苦。即有漏色心增長名集。……寂靜名滅。謂即涅槃。出離名道。謂止觀等。**」（L5387–L5389）\n> 圆教四谛之判：「**涅槃云。解苦無苦名苦聖諦。……今了陰入皆如無苦可捨。無明塵勞即是菩提。無集可斷。生死即涅槃無滅可證。邊邪皆中正。無道可修。……不取不捨同一實諦。**」（L5390–L5401）——〔按：此即 §4.1「四圣谛之圆教诠释」之**一手依据**，旧稿§4.1 之归纳今得疏文实证，〔本文判断〕升等为「疏有明文」。〕\n\n**（三）宗趣**（L5402–L5403）：\n> 「**三宗趣者。以無邊諦海隨根隨義。立名不同。遍空世界以此為宗。務在益物調生為趣。又上二皆宗發生淨信為趣。**」\n\n**（四）解妨（問答）**（L5404–L5412）：\n> 問：「**既彰佛語業答說法問。佛所說法多門。何以唯陳四諦。**」答：「**以名雖在小義通大小事理具足。謂苦集二諦是世間因果……滅道二諦出世間因果……又為破計引機故。謂演彼聲聞四諦局法。令亡所執。引入一乘無邊諦海故。**」（L5404–L5409）\n> 又問四諦何以都帶「苦」言（「苦集聖諦」等）：「**謂苦滅聖諦等。然謂生苦之集故。云苦集。盡苦之滅名為苦滅。至苦滅之道名苦滅道。不得單言苦道。**」（L5409–L5412）\n\n**（五）正释文**（L5412–L5417；分科与名号品「文分為四」**形同实异**）：\n> 「**五正釋文。一品分二。先標告。二諸佛子下正釋。於中分四。初娑婆諦名。二隣次十界。三類通一切。四主伴無窮。**」（L5412–L5415）\n> 「**然此望前品略於單說四洲。就初二中。一一方內文各有二。一別列諦名。二結數辨意。然其立名或有因從果稱果籍因名。約事約理或總或別。**」（L5415–L5417）\n> 密训名相释（L5430–L5435）：「**一密訓即東方界也。苦名分析悉無力者。推之於緣無實物也。形狀物者。有形皆苦也。……道言上行者。所之在滅。言觀方者。謂觀四諦也。**」又「**二最勝世界者。即是南方前名豐溢。豐溢是正翻最勝。乃義譯耳。**」（L5435–L5436）——〔按：澄观此下以離垢為西方（L5438）、豐溢為北方（L5444），与旧稿 §2.5 十方次第之方位对应说同源，可參。〕\n\n**（旁引·名号品段，非本品）** 旧稿本节之来意／释名／宗趣／释文诸句实出自**名号品段**，归位列此备览：来意「**前既舉果令生信樂。今明能生因果信解故**」「**生解之中信為其首**」「**遠答前名號海問故**」（L5095–L5099）；释名「**約處名普光明殿會**」「**約法則名信行之會**」「**召體曰名表德為號。名別號通**」（L5101–L5105）；宗趣「**以修生修顯因果為宗。令諸菩薩修行契入為趣**」「**三品宗者。顯佛名號周遍為宗。隨機調化利益為趣**」（L5108–L5115）；释文「**文中分四。一娑婆之內自有百億。二娑婆隣近。即百億之外。三類通一切。謂盡十方。四釋差別所由。由隨物故**」「**釋差別所由。此有二意。一自既由於差別名言等。而得成就。今還倣古以差別熟他。二昔菩薩時隨機調物。今時出世稱本立名**」（L5338–L5340、L5373–L5375）——本品 §2.5／§2.6 之科判实为**名号品之释文科**；本品自科应依上（五）「初娑婆諦名·二隣次十界·三類通一切·四主伴無窮」。两品科判形近而指异，两存可也。〔本文判断〕\n\n**〔L.192 本批·疏科长文全摘〕**（`T1735` 卷十三「四聖諦品第八」本科段·NFKD 1:1 重锚·引文照 raw 原字形·跨行连读剥空白·分页符剔除·窗 CJK 2468·raw @154232–157262）\n\n*甲·五门分别·来意*：\n\n> 「釋此一品。五門分別。初來意者。此品廣前種種語業。即答前佛說法問。亦遠答前會佛演說海之一問故。既知佛可歸。次知法可仰。上名隨物立。今法逐機差故次來也。二釋名中」\n\n*乙·释名（諦實·審諦·瑜伽·圆教四谛）*：\n\n> 「二釋名中。言四聖諦者。聖者正也。無漏正法得在心故。諦有二義。一者諦實。二者審諦。言諦實者。此約境辨。謂如所說相不捨離故。真實故。決定故。謂世出世二種因果。必無虛妄不可差失。言審諦者。此就智明。聖智觀彼審不虛故。凡夫雖有苦集。而不審實不得稱諦。無倒聖智審知境故。故名聖諦。故瑜伽九十五云。由二緣故名諦。一法性故。二勝解故。愚夫有初無後聖具二故。偏說聖諦。四謂苦集滅道。總云四聖諦。帶數釋也。性相云何。逼迫名苦。即有漏色心增長名集。即業煩惱。寂靜名滅。謂即涅槃。出離名道。謂止觀等。此約相說通大小乘。智論云。小乘三是有相滅是無相。大乘四諦皆是無相。涅槃云。解苦無苦名苦聖諦。謂達四緣生故。空則超筌悟旨成大。又涅槃云。凡夫有苦而無諦。二乘有苦有苦諦。而無真實。菩薩無苦有諦。而有真實。謂若苦即諦。三塗之苦豈即諦也。二乘雖審知之。而不達法空不見真實。又二乘雖知苦相。不知無量相。故大經云。苦有無量相。非諸聲聞緣覺所知。瑜伽說苦。有一百一十。然此經中。雖彰名異即表義殊。以名必召實故。是無量四諦義也。約一界一諦即有十千。娑婆四諦有四百億十千名義。而文義包博言含性相。又究此四。非唯但空便為真實。今了陰入皆如無苦可捨。無明塵勞即是菩提。無集可斷。生死即涅槃無滅可證。邊邪皆中正。無道可修。無苦無集即無世間。無滅無道即無出世間。不取不捨同一實諦。故斯一品。有作無作有量無量。皆在其中。準下第五地中。復以十重觀察。至下當明。三宗趣者」\n\n*丙·宗趣（無邊諦海·益物調生）*：\n\n> 「三宗趣者。以無邊諦海隨根隨義。立名不同。遍空世界以此為宗。務在益物調生為趣。又上二皆宗發生淨信為趣。四解妨難。問」\n\n*丁·解妨难问（何以唯陈四谛·四谛何皆带苦言）*：\n\n> 「四解妨難。問既彰佛語業答說法問。佛所說法多門。何以唯陳四諦。答以名雖在小義通大小事理具足。謂苦集二諦是世間因果。所知所斷無改易故。滅道二諦出世間因果。所證所修事決定故。知斷證修能運眾生。到彼岸故。世界有異此獨無改。況無量無作何義不收。是故約此以顯差別。又為破計引機故。謂演彼聲聞四諦局法。令亡所執。引入一乘無邊諦海故。約此辨。何以四諦皆帶苦言。謂苦滅聖諦等。然謂生苦之集故。云苦集。盡苦之滅名為苦滅。至苦滅之道名苦滅道。不得單言苦道。以道非生苦不同集故。又非滅苦不同滅故。能證苦滅故云苦滅道。五正釋文」\n\n*戊·正释文·总科（一品分二·于中分四·望前品略於單說四洲）*：\n\n> 「五正釋文。一品分二。先標告。二諸佛子下正釋。於中分四。初娑婆諦名。二隣次十界。三類通一切。四主伴無窮。然此望前品略於單說四洲就初二中」\n\n*己·释文别科（一别列諦名二結數辨意·立名四句）*：\n\n> 「就初二中。一一方內文各有二。一別列諦名。二結數辨意。然其立名或有因從果稱果籍因名。約事約理或總或別。如文當知。初娑婆中列內四諦。即為四別。一苦云罪者」\n\n*庚·娑婆四十名逐释（苦·集·灭·道·結數·顯差別）*：\n\n> 「一苦云罪者摧也。謂摧壞色心故。二逼迫者。不可意境逼迫身心也。此二總顯。三變異者。壞苦也。攀緣者。追求苦也。聚者。五盛陰苦也。刺者。從喻立名。如刺未拔。依根者。由苦能生一切惡也。虛誑者。於下苦中能生樂想也。癰瘡處者。此喻二苦。有癰瘡處性自是苦。此如五陰苦。若加手等。觸苦上加苦是苦苦也。愚夫行者。行苦也。愚人所行故。如以睫毛置掌不覺。若置眼內為苦不安。愚夫不覺行苦如掌內之毛。而復以苦反欲捨苦。皆愚夫行也。二集中初二通顯。謂有業惑者。繫縛三界滅壞善根。次二別顯煩惱。餘多通業惑。三苦滅中。無諍者。煩惱為諍故。體真實者。非唯惑滅而已。實乃法身常住為滅諦之義故。次云住自性也。謂本來滅故。四苦滅道諦云十藏者。謂信聞等如十藏品說。二結云四百億十千者。准望前名號。一四洲有十千。今一四天下一諦。亦有十千。四諦歷於百億。故有四百億箇十千。隨眾生心下。顯差別之意也。第二辨十方諦名」\n\n*辛·辨十方諦名（密訓東方–振音上方十界逐释）*：\n\n> 「第二辨十方諦名。一密訓即東方界也。苦名分析悉無力者。推之於緣無實物也。形狀物者。有形皆苦也。集中病源者。謂有攀緣故。滅云一分者。惑由妄起故。分數塵沙理不可分故稱一分。道言上行者。所之在滅。言觀方者。謂觀四諦也。更有四方如十定品。二最勝世界者。即是南方前名豐溢。豐溢是正翻最勝。乃義譯耳。苦名有勢力者。生老病死猶四山臨。人世雖賢豪力無與競。集名非己物者。己本性淨妄惑何預。滅名義中義者。事善有義滅理尤勝。義中義也。道名燒然。以智慧火燒煩惱故。三西方離垢世界苦名有無數者。三際無涯故。集名增長者。從惑生惑業故。滅名稱會者。以事之滅稱會理滅故。破印者。世之陰苦若蠟印印泥印壞文成。此陰纔滅彼陰續生。今云破印永不生也。道名諸有邊者。照實即生死可盡也。故中論云。真法及說者聽者難得故。是故則生死非有邊無邊。謂三事難得故非有邊。難得者。容有得義。得則生死有邊。受寄全者。業寄於集暫受還亡。業寄於道永不可失。四北方豐溢世界者。豐溢自南方界名。前品此方名為豐樂。梵云微部地(田夷切)豐樂得旨。譯者不審二名相參耳。苦名有海分者。二十五有各一分也。數所成者。數體即集集所成故。集名分數者。無一理以貫之則惑業萬差矣。攫噬者。攫搏也。噬嚙也。集之損害猶惡禽獸也。滅名無所修者。修已極故。道名無量壽者。謂證滅永常。今因標果稱。五東北方攝取世界。苦名地獄性者。未入忍來常有墮性。根本空者。約性以說。同淨名五受陰洞達空故。集中由妄惑故。愛見羅剎橫相執取。妄體本空故。無可取故。中論云虛誑妄取者是中何所取。佛說如是法欲以示空義。滅道俱名離言者。滅性離言。道令言離故。六東南繞益世界苦名如賊者。五盛陰苦劫害我故。集名無力者。於出生死無有力能。善法治之不復相拒故。滅名捨因者。無為無因而體是果菩提之道望此亦因獨寂滅涅槃得稱果果。故曰捨因。道名一切印無不審決故。印義後說。七西南鮮少世界苦名邪行者。體非正道是行性故。集名廣地生大苦樹故。宅主即無明也。滅名絕行處者。心路絕故。道名廣大路者。先聖後賢游之而不厭故。八西北歡喜界中苦諦闕一者。晉譯少出生唐譯少失利。集名無底者。煩惱深故。非習道學浮沈而不已。滅名破依止。身與煩惱互為依止。展轉無窮唯證滅理方能永破。道名廣大性者無不在故。九下方關[門@龠]世界。苦名我所成者。我見有故。集名我心即我見愛。滅名覺分者。所覺處故。道名入義者。能入滅諦第一義故。十上方振音世界苦名匿疵。身為惑病所藏處故。傲慢者。慢以生苦為業。果取因名。染著性者。性令染故。如樂受壞苦誰謂苦耶。駃流者。剎那性故即行苦也。不可樂者。苦苦也。覆藏者。藏苦因故。樂藏壞苦故。不苦不樂藏行苦故。速滅者。流轉苦也。難調者。誰不欲捨莫之能出。不憚疲苦方能調之。集名至後邊者。不斷無窮故。門者入苦趣故。滅名不可取取則不滅也。小之則無內不容一物也。大之則無外法界性也。道名難敵對者。有惑必破不為惑破故。猶明能滅闇。故無闇而不滅。闇不滅明何能相敵。第三諸佛子下」\n\n*壬·类通一切（舉娑婆以類東方·後舉東方以類餘九）*：\n\n> 「第三諸佛子下。類通一切。初舉娑婆以類東方。後舉東方以類餘九。第四如娑婆下」\n\n*癸·主伴无尽（娑婆為主·盡空世界為伴·重重無盡·结「如是皆為調伏眾生」）*：\n\n> 「第四如娑婆下。顯主伴無盡。文中初舉此例彼。謂娑婆為主。有密訓等盡空世界皆為伴。後彼一切下以彼類此。則知密訓等盡空世界為主。攝伴亦爾。則無盡無盡耳。此猶約娑婆同類世界而說。以結數中同百億故。餘樹形等異類世界。彼一一類皆遍空法界。是則重重無盡無盡。非此所說也。如是皆為調伏眾生」\n\n### 5.2 法藏《大方广佛华严经探玄记》（`T1733`）——「四諦品第四」段\n\n**来源**：唐·魏国西寺沙门法藏述《華嚴經探玄記》**卷第四**（「此從第二會初盡此會竟」）。本机 `data/references/cbeta_txt/T1733_法藏_探玄记.txt`。法藏依**六十本**（`T09n0278`）立论，本品当六十本**第四品「四諦品」**（＝八十本第八品）。\n\n> **〔校订 2026-10-24·P1 逐字回源〕** 旧稿本节所引「自下明第二修因契果生解分」「名普光法堂會」「**如來之名號依主釋**」「**此品明身業遍應**」「十佛國土海為宗」诸句，经行号级核验（本机 PDF 抽取本 `T1733_法藏_探玄记.txt` L3635–L3930），**实为法藏〈名號品第三〉之四门分别**（「如來之名號依主釋」「此品明身業遍應」之「此品」皆指名号品·身业）；法藏〈四諦品第四〉正文实在 **L3931–L3953**（品题「四諦品第四」@L3931，次品「如來光明覺品第五」@L3954）。旧稿系将次前品（名号品）之科误挂本品，今按 L3931 真段逐字重写。〔按：名号品段中「**四諦品明佛口業普周。光明覺品明佛意業遍覺**」（L3664）是法藏于名号品「品来」下**横举三品以明三业**，属三业分判之据（§1.2／§4.2 所引即此，不误），然非本品四门正文。〕\n\n**判品·「四門同前」**（釋名·來意·宗趣·釋文，与名号品同四门，L3932「四門同前」）：\n\n**（一）释名**（L3933–L3934）：\n> 「**一釋名者。四是數。諦是義。謂理實故能生無倒解。故俱名諦。即帶數釋。此品非是解四諦義。但明四諦名字不同故名四諦品。**」\n\n——〔按：法藏明言本品「**非是解四諦義。但明四諦名字不同**」，正与本品之旨「**名知名性離**」（§1.4、§4.1）相应——所明者乃四谛之**名字差别遍周**，非四谛义理之分破。此为「名号遍周」之**判教一手依据**。〕\n\n**（二）来意**（五义，L3935–L3937）：\n> 「**二來意中五。一為釋成前品末權道之義。二依前身業次辨語業故也。三前明能說之人名字不同。此明所說之法名字不同故來也。四答前問中佛說法問故。五為釋成前機所印成差別法中權教異相故次來也。**」\n\n——第二义「**依前身業次辨語業**」正是三业相次（名号＝身业 → 四谛＝语业）；第四义「**答前問中佛說法問**」与澄观 L5379「即答前佛說法問」同判。\n\n**（三）宗趣**（L3939–L3940）：\n> 「**三宗趣者。以無邊甚深諦海為宗。及同上土海。四諦義略作五門。一釋名。二辨相。三體性。四業用。五種類。**」\n\n——〔按：旧稿「十佛國土海為宗」（L3686）乃**名号品**品宗；本品宗当为「**無邊甚深諦海為宗**」。〕\n\n**（四）释文**（科三，L3943–L3953）：\n> 「**四釋文中三。初明此土諦名。二辨娑婆外十世界中諦名。三顯十界外盡空世界諦名。**」（L3943–L3944）\n> 调伏义：「**為應機令調伏故立此名。調者調和。伏者制伏。謂調和控御身口意業制伏除滅諸惡行故。**」（L3945–L3946）\n> 何故文殊说：「**何故文殊說者。明妙慧善達實諦義故。**」（L3946）；寄显一乘／破计引机：「**謂此小乘局處之法尚有如此遍空世界差別不同。則知一乘通方之法差別無邊……又為破計引機……便顯一乘無邊法界。令其趣入故。**」（L3947–L3950）\n> 带苦释：「**生苦之集故云苦集。苦盡之滅名苦滅。至苦滅之道故云苦滅道。不得單言苦道。**」（L3951–L3953）——〔按：「**不得單言苦道**」与澄观 L5409–L5412 同，是本品「苦集／苦灭／苦灭道」立名之共判。〕\n\n### 5.2′ 智俨《搜玄分齊通智方軌》（`T1732`）——「四圣谛品」段\n\n**来源**：唐·终南山至相寺沙门**智俨**（华严二祖，法藏之师）《搜玄分齊通智方軌》**卷上**（品题「**四諦品第四**」@L815）。本机 `data/references/cbeta_txt/T1732_智俨_搜玄记.txt`（PDF 抽取本，康熙部首异体字已归一，仍待二次校对〔待核〕）。\n\n**智俨就六十本（`T09n0278`）立论**：六十本第四品「四諦品」＝八十本第八品「四圣谛品」。\n\n> **〔校订 2026-10-24·P1 逐字回源〕** 旧稿本节引「普者德普光者智光」「前辨所依土。次土中化主人名故也」「名號品以化悲德自在相為宗」等句，经行号级核验（T1732 L754–L814），**实为智俨〈名號品第三〉四门**（品名「名即通名。號者別號」@L757、宗体「**名號品**以化悲德自在相為宗」@L764，皆指名号品）；智俨〈四諦品第四〉正文实在 **L815–L827**（次品「光明覺品第五」@L828）。旧稿系将名号品之科误挂本品，今按 L815 真段重写。〔按：名号品段中「**初名號明佛身業。二四諦品是佛口業。三光明覺辨佛意業**」（L768）是三业横举之据（§1.2／§4.2 所引，不误），然非本品四门正文。〕\n\n**「四門同前」**（辨名·来意·辨宗·分文释，L816「四門同前」）：\n- **辨名**（L818）：「**一辨名四者。數。諦者有作無作聖諦實故也。**」——智俨以「**有作／無作**」分辨四谛，与法藏「帶數釋」小异（重「體性」之权实）。\n- **来意**（L819–L820）：「**二來意。何故來者。前歎化主。此歎所說教法。何故獨此會明。答此起化初故。總歎人法深勝故。**」——名号＝叹化主（人），四谛＝叹所说教法（法），人法相次。\n- **辨宗**（L821）：「**三辨宗。此歎教法諦實甚深為宗。**」\n- **分文释**（L822–L827）：「**四分文釋。此文分三。初略列此方三千諦名。二列十方三千四諦。三佛子如此娑婆下廣辨無邊界者。凡四諦有二。有作。無作。此中文通意唯無作。真實不虛。**」又一乘共教：「**一乘有作即空。一乘無作不空。**」（L825）；「**所以文殊說者妙慧善達虛實故。**」（L827）——〔按：智俨依六十本以「**三千**」计界（此方三千／十方三千），与八十本「四百億十千名」口径不同，参 §6.1、§7.3。〕\n\n### 5.2″ 慧苑《續華嚴略疏刊定記》（`X0221`）——「四圣谛品」段\n\n**来源**：唐·大薦福寺沙门**慧苑**《續華嚴略疏刊定記》**卷第四**（品题「**四聖諦品第八**」）。本机 `data/references/cbeta_txt/X0221_慧苑_续华严略疏刊定记.txt`（PDF 抽取本）。\n\n**慧苑就八十本（`T10n0279`）立论**：八十本第八品「四圣谛品」。\n\n**〔按〕** 慧苑本品之记**不传**。本机 `X0221_慧苑_续华严略疏刊定记.txt` **L4623** 有校者按语：「**卍按。如來名號品及四聖諦品之記恐不傳歟。**」——**直证慧苑于名号品与四圣谛品二品之记均无传本**（承第七部之例）。**不以他品冒充**。仅存目与说明，待后续访辑。〔旁参：本机 X0221 L13505「此即聖之諦故。依主釋也。總言四聖諦。帶數釋也。別中逼迫名苦」—‑疑为他卷引抄或澄观／法藏之文，非慧苑本品正记，**存此待核**〕〔待核〕\n\n### 5.3 李通玄《新华严经论》（`T1739`）——「四圣谛品」段\n\n**来源**：唐·李通玄《新华严经论》**卷第五**（品题「**四聖諦品第八**」@L6050）。本机 `data/references/cbeta_txt/T1739_李通玄_新华严经论.txt`。\n\n> **〔校订 2026-10-24·P1 逐字回源〕** 旧稿本节引「非但論名號遍周。但是如來身口意業總皆遍周」（L6026）、「如世尊已下舉世尊往因所行」（L6023）、「以果成信。信自己心之是佛」（L5465）皆出李通玄〈如來名號品〉段（非本品）；又旧稿四句「苦者。逼迫義。集者。招引義。滅者。息滅義。道者。能通義」经逐字核验，**本机 T1739 无此原文**〔待核·疑为他师四谛义或记忆，不据以冒李通玄〕。李通玄〈四聖諦品第八〉正文实在 **L6050–L6106**，今按真段重写。\n\n**李通玄之判·「將釋此品義分為三」**（一释品名目·二释品来意·三随文释义，L6051）：\n- **释品名目**（L6052–L6073）：「**諦者實義也。明如來說四種實義令諸眾生起信解故。**」（L6052）；一乘与三乘之判：「**三乘四諦厭苦集忻滅道。名四諦法輪。此一乘經言四聖諦者。是其實義。何以故。達苦性真無厭故。無有他方別佛剎別淨土故。無有染淨涅槃生死忻厭故。**」（L6061–L6063）——〔按：此即 §4.1「四圣谛之圆教诠释」之**又一一手依据**（与澄观 L5390–L5401 圆教四谛互证）；李通玄以「達苦性真無厭」显一乘四谛异于三乘厌离。〕又「**五地菩薩作十種諦觀。以四聖諦為體。**」（L6069）。\n- **释品来意**（L6081–L6082）：「**為明前名號品是說如來身業隨方名號不同各別。此品說如來隨方語業。隨方說法不離四聖諦故。此品須來。**」——三业相次（名号品说身业→此品说语业），与法藏 L3935「依前身業次辨語業」、澄观 L5379 同判。\n- **随文释义／类通**（L6084–L6085）：「**已下十一段。是通中心并十方。正說四聖諦義各別不同。末後一段。是總都說十方世界無盡名目。皆是四聖諦為體。**」\n- **〔旁引·名号品段，非本品〕** 三业遍周「**又此如來名號品。非但論名號遍周。但是如來身口意業總皆遍周**」（L6026–L6027）、「以果成信」（L5465）实出李通玄名号品段，存此备参（可证其二会总判）。\n\n### 5.3′ 海云继梦讲记（讲记校勘 Ep10）\n\n**来源**：海云继梦和上讲记（T3／二手，属现代传承解，**一家之言，不冒充古注**）。本机本品之直接会读据讲记校勘 **Ep10**（玄談第六節《七處九會・華嚴經之結構》），状态**已校·信息無损**；底稿 [`docs/经学文献/海云讲记_九九华严/episodes/ep10.md`](../../海云讲记_九九华严/episodes/ep10.md)（校订稿）· 视频 [e6_1t2-3TF8](https://www.youtube.com/watch?v=e6_1t2-3TF8) · 音频 S24-04-01。**听录原文为简体，以下照听录逐字引录（不转繁体），凡与经不合者以经为正；讲者之判只标不改。**\n\n**〔会读·三會三寶配〕** 海云于第二会「本体论」以四品配**佛法僧**与**法界能所**：\n> 「本體論它第一個是如來名號品，四聖諦品這就是佛法，一個佛一個法，第三個光明覺品是僧……菩薩問明品，這是法界能所。」（Ep10 · §D 「天人合一・下迴向」段）\n\n> 又「**如來名號品（佛）・四聖諦品（法）・光明覺品是僧**」「從光明覺品開始我們又把它畫為**行法的範圍**」（Ep10 · §D）。\n\n〔**对读**〕海云以**四圣谛品当「法」**（佛—法—僧三宝配），与古注三家以本品为**口业（说法）**〔§1.2／§4.2〕**角度不同而可互参**：古注从「三业」判（名号＝身·四谛＝口·光明觉＝意），海云从「三宝」判（名号＝佛·四谛＝法·光明觉＝僧）——**一以「能说之人」为骨，一以「所说之法」为骨**。〔本文判断·讲者当期科判，只标不代立论〕\n\n**〔指针·正行段逐字待 Ep16〕** 本 Ep10 为**玄談/问答段**，**未直接宣讲本品正行段经文**（本品依本机讲记校勘尚未逐字回源）。海云于四圣谛品**正行段**之逐字讲记，待校勘推进至 **Ep16＋**（本局校勘现量止于 Ep15）后补入。〔待核〕\n\n### 5.4 诸家对读小结\n\n**五家对读表**（皆据 §5.1–5.3 逐字回源之本段行号；旧稿多家「品名训释／本品要义」栏曾误取名号品段，今按本品真段改正）：\n\n| 家 | 所依本 | 品名训释（本品段） | 三业分判（名号品段横举） | 请数/答问 | 本品要义（本品段） |\n|---|--------|---------|---------|----------|---------|\n| **澄观**（`T1735`） | 八十本第八品 L5378起 | 聖者正也；諦實·審諦；四謂苦集滅道（L5381–5389） | 名号=身业·四谛=口业·光明觉=意业 | 答「佛所說法」问（L5379） | 無邊諦海隨根立名·遍空世界為宗（L5402） |\n| **法藏**（`T1733`） | 六十本第四品 L3931起 | 帶數釋；「此品非是解四諦義。但明四諦名字不同」（L3933–3934） | 四諦品明佛口業普周（L3664） | 總分為三：初十問因所依果·次十問果所起因·後十四問因所得果（L3743） | 無邊甚深諦海為宗（L3939） |\n| **智俨**（`T1732`） | 六十本第四品 L815起 | 數；「諦者有作無作聖諦實故」（L818） | 初名號明佛身業·二四諦品是佛口業（L768） | 答第二會中三十二問（L3739） | 諦實甚深為宗（L821） |\n| **李通玄**（`T1739`） | 八十本第八品 L6050起 | 諦者實義；一乘四聖諦「達苦性真無厭」（L6052/6061） | 名號品說身業·此品說語業（L6081） | 二十八問…如是三十二問（L5648） | 隨方語業不離四聖諦·皆是四聖諦為體（L6082/6085） |\n| **海云**（T3） | 讲记（Ep10 玄談段） | 四圣谛品＝「法」（佛—法—僧三宝配） | 名号（佛）·四谛（法）·光明觉（僧）·问明（法界能所） | 〔本品正行段逐字待 Ep16〕 | 四谛当法·光明觉起行法范围 |\n\n**一家之见**：澄观以「聖者審諦」为四圣谛之真实相，以「無邊諦海」为宗；法藏断言本品「**非是解四諦義，但明四諦名字不同**」，以「口业普周／甚深諦海」为核；智俨以「諦實甚深」为宗、判归「無作」真实不虚；李通玄以「一乘四圣谛·達苦性真無厭」别于三乘厌离。\n\n**口业之会归**：本品之「口业说法遍周」，非仅四圣谛之名号遍周，而是如来一切说法遍周——「随众生心，悉令调伏」。此与名号品之「身业遍应」相为表里，共同构成第二会「修因契果生解分」之基。\n\n**请数不强断**：澄观答「佛所說法」一问、法藏「總分為三（三十四）」、智俨「三十二問」（T1732 L3739）、李通玄「三十二問」（T1739 L5648）——各家计数与归并口径之别，**不据一家回改他本，亦不掩诸说**。〔旧稿智俨栏「時眾請文有四十四句」经逐字核验本机 T1732 无此文，已改从 L3739「三十二問」。〕〔待核〕\n\n---\n\n## 六、文本对读与校勘\n\n### 6.1 与六十华严〈四諦品〉对读\n\n六十华严（`T09n0278` 卷四）本品品题作〈**四諦品第四之一**〉（**六十无「聖」字**；本机 `data/references/cbeta_txt/T09n0278_juan4.txt` 品题@L297）。就娑婆世界说四谛各十名（共四十名·L298），次及密訓·最勇·離垢·真實境·訶尼·饒益诸界（L300–L310），**卷四止于饒益世界（第六界），余界续卷五**（卷四末界@L310）。八十（`T10n0279` 卷十二）则具出十方十界各四十名、共四百名，随众生心乐而异名。\n\n**（一）框架与措辞对照**：\n\n| 项 | 六十《四諦品》（T09n0278 卷四 L297–L311） | 八十《四聖諦品》（T10n0279 卷十二） |\n|----|--------------------------------|--------------------------------|\n| 品题 | **四諦品**（无「聖」字） | 四**聖**諦品 |\n| 标主 | 「**爾時，文殊師利告眾菩薩言：佛子！**」（L298） | 「爾時，文殊師利**菩薩摩訶薩**告諸菩薩言：諸佛子！」 |\n| 谛名 | 苦諦／苦集諦／苦滅諦／苦滅道諦（无「聖」） | 苦**聖**諦／苦集**聖**諦／… |\n| 列名引导词 | 娑婆用「**或言**」（四谛品段 40×），他界用「或名」（段内 242×） | 一律「**或名：**」 |\n| 总数语 | 「**四十億百千那由他**」（L299等） | 「**四百億十千名**」 |\n| 世界数 | 卷四仅出 6 界（娑婆＋密訓·最勇·離垢·真實境·訶尼·饒益），余待卷五 | 具出十方十界 |\n\n**（二）世界名号次第对照**（据六十 L300–L310 与八十 §2.5）：\n\n| 序 | 八十（T10n0279） | 六十（T09n0278） | 同/异 |\n|---|----------------|----------------|------|\n| 本处 | 娑婆 | 娑婆 | 同 |\n| 一 | 密訓 | 密訓（L300） | **同** |\n| 二 | 最勝 | **最勇**（L302） | 异（澄观 L5435「最勝即南方前名豐溢·义译」） |\n| 三 | 離垢 | 離垢（L304） | **同** |\n| 四 | 豐溢 | **真實境**（L306） | 异 |\n| 五 | 攝取 | **訶尼**（L308） | 异 |\n| 六 | 饒益 | 饒益（L310） | **同**·卷四尽于此 |\n| 七 | 鮮少 | 鮮少（卷五「於鮮少世界」） | **同**·界名全同 |\n| 八 | 歡喜 | **知足**（卷五「於知足世界」） | 异·界名异（苦谛首名八十「流轉」＝六十「流轉」·义近） |\n| 九 | 關𨷲 | **所求**（卷五「於所求世界」） | 异·界名异（苦谛八十「如坏器／我所成／來去」≈六十「坏瓶／我所／來去」） |\n| 十 | 振音 | **解脫音**（卷五「於解脫音世界」） | 异·界名异（苦谛首名八十「匿疵」＝六十「匿疵」） |\n\n> **〔卷五回源·P2 订正 2026-10-24〕** 六十十界全序（卷四止饒益＋卷五續）：**密訓·最勇·離垢·真實境·訶尼·饒益·鮮少·知足·所求·解脫音**，对应八十「密訓·最勝·離垢·豐溢·攝取·饒益·鮮少·歡喜·關𨷲·振音」。第七界两名全同（鮮少），八·九·十界**界名异而苦谛列名多义近**（如坏器↔坏瓶、匿疵＝匿疵），系异译系统之自然差异，各照底本、不强统一。据本机 `T09n0278.xml`（六十華嚴全本·2026-10-24 入库 sha256:a2bfcee6213f·四諦品段连读）逐字回源，旧〔待卷五〕今闭。\n\n**（三）娑婆四谛逐名对照**（八十 §2.2 回源 × 六十 L298 逐字）——两本各十名、位次大体平行，**义同而名多异**：\n\n| 谛 | 序 | 八十（T10n0279） | 六十（T09n0278 L298） | 同/异 |\n|---|---|----------------|--------------------|------|\n| 苦 | 1 | 罪 | 害 | 异 |\n| 苦 | 2 | 逼迫 | 逼迫 | **同** |\n| 苦 | 3 | 變異 | 變異 | **同** |\n| 苦 | 4 | 攀緣 | 境界 | 异 |\n| 苦 | 5 | 聚 | 聚 | **同** |\n| 苦 | 6 | 刺 | 刺 | **同** |\n| 苦 | 7 | 依根 | 依根 | **同** |\n| 苦 | 8 | 虛誑 | 不實 | 异 |\n| 苦 | 9 | 癰瘡處 | 癰 | 异 |\n| 苦 | 10 | 愚夫行 | 童蒙行 | 异 |\n| 集 | 1 | 繫縛 | 火 | 异 |\n| 集 | 2 | 滅壞 | 能壞 | 近 |\n| 集 | 3 | 愛著義 | 受義 | 异 |\n| 集 | 4 | 妄覺念 | 覺 | 异 |\n| 集 | 5 | 趣入 | 方便 | 异 |\n| 集 | 6 | 決定 | 決定 | **同** |\n| 集 | 7 | 網 | 網 | **同** |\n| 集 | 8 | 戲論 | 念 | 异 |\n| 集 | 9 | 隨行 | 順眾生 | 近 |\n| 集 | 10 | 顛倒根 | 顛倒根 | **同** |\n| 灭 | 1 | 無諍 | 無障礙 | 异 |\n| 灭 | 2 | 離塵 | 離垢淨 | 近 |\n| 灭 | 3 | 寂靜 | 寂靜 | **同** |\n| 灭 | 4 | 無相 | 無相 | **同** |\n| 灭 | 5 | 無沒 | 不死 | 近 |\n| 灭 | 6 | 無自性 | 無所有 | 异 |\n| 灭 | 7 | 無障礙 | 因緣斷 | 异 |\n| 灭 | 8 | 滅 | 滅 | **同** |\n| 灭 | 9 | 體真實 | 真實 | 近 |\n| 灭 | 10 | 住自性 | 自然住 | 近 |\n| 道 | 1 | 一乘 | 一乘 | **同** |\n| 道 | 2 | 趣寂 | 趣寂靜 | 近 |\n| 道 | 3 | 導引 | 引導 | 近 |\n| 道 | 4 | 究竟無分別 | 究竟希望 | 异 |\n| 道 | 5 | 平等 | 常不離 | 异 |\n| 道 | 6 | 捨擔 | 能捨擔 | 近 |\n| 道 | 7 | 無所趣 | 至非趣 | 近 |\n| 道 | 8 | 隨聖意 | 聖人隨行 | 近 |\n| 道 | 9 | 仙人行 | 仙人行 | **同** |\n| 道 | 10 | 十藏 | 十藏 | **同** |\n\n〔统计·本文判断〕四十名中：完全同 **13** 名（逼迫·變異·聚·刺·依根；決定·網·顛倒根；寂靜·無相·滅；一乘·仙人行·十藏），近义 **9** 名，全异 **18** 名。〔口径〕「同」指逐字全同；「近」指义近而用字小异（如「滅壞／能壞」、「隨行／順眾生」）；判同/近属本文据义理之推定，〔本文判断〕非经文明言。\n\n> **要义**：两本同名异译、位次互见（最勝↔最勇、豐溢↔真實境、攝取↔訶尼），**六十无「聖」字、以「或言」起娑婆、总数作「四十億百千那由他」**——属异译系统之自然差异，**各照底本、不强统一**。八十广出十方四百名，六十卷四止于饒益而余界待续。\n\n> 注：四十华严无此品。藏译（Toh 44）品序次有差，详 §6.3。\n\n### 6.1′　六十《四諦品第四》全本对照〔L.192 本批·全量入文〕\n\n品界 `T09n0278` 卷四「大方廣佛華嚴經四諦品第四之一」@9197–11228 ＋ 卷五「四諦品第四之二」@391–1735（止「如來光明覺品第五」前）·CJK 2,749·26 段（含卷四首行品题 60-000 十四字·卷五尾残行 60-025「大方廣佛華嚴經」七字——**正文照录取 60-000–60-024·残行不入·口径登记**）。以下**逐段照录本地入库全本**·不转写不断句（`_e8_full.py` 程序取自 `T09n0278.xml`·0 手抄；「六十｜」前缀为异译侧照录标记·审计器 EDIT_PREFIX 白名单·`_p9_11_audit.py` L.192 登记）：\n\n> 六十｜大方廣佛華嚴經四諦品第四之一\n\n> 六十｜爾時，文殊師利告眾菩薩言：「佛子！所說苦諦者，於此娑婆世界，或言害、或言逼迫、或言變異、或言境界、或言聚、或言刺、或言依根、或言不實、或言癰、或言童蒙行。所說苦集諦者，或言火、或言能壞、或言受義、或言覺、或言方便、或言決定、或言網、或言念、或言順眾生、或言顛倒根。所說苦滅諦者，或言無障礙、或言離垢淨、或言寂靜、或言無相、或言不死、或言無所有、或言因緣斷、或言滅、或言真實、或言自然住。所說苦滅道諦者，或言一乘、或言趣寂靜、或言引導、或言究竟希望、或言常不離、或言能捨擔、或言至非趣、或言聖人隨行、或言仙人行、或言十藏。\n\n> 六十｜「諸佛子！此娑婆世界中，如是等四諦名字有四十億百千那由他，隨諸眾生所應調伏，作如是說。\n\n> 六十｜「諸佛子！如娑婆世界所稱苦諦，於密訓世界，或名求根、或名不可出、或名不縛根、或名作不應作、或名一切不實、或名分別羸、或名處所成就、或名第一害、或名動、或名身事。所名苦集諦者，或名受、或名枝、或名燒、或名堅固、或名壞根、或名相續、或名害行、或名喜忘、或名生元、或名分。所名苦滅諦者，或名正義、或名堅固、或名讚歎、或名安隱、或名善趣、或名調伏、或名一道、或名離煩惱、或名不亂、或名究竟。所名苦滅道諦者，或名猛將、或名不沒、或名超出、或名勤方便、或名普眼、或名離邊、或名覺悟、或名得妙、或名無上目、或名觀方。\n\n> 六十｜「諸佛子！彼密訓世界如是等四諦名字有四十億百千那由他，隨諸眾生所應調伏，作如是說。\n\n> 六十｜「諸佛子！如娑婆世界所名苦諦，於最勇世界，或名恐怖、或名福斷、或名應訶責、或名常給、或名麁歰、或名常怨、或名離勝、或名奪利、或名難共事、或名虛妄、或名勢力。所名苦集諦者，或名因緣、或名癡元、或名怨林、或名刃枝、或名滅味、或名仇對、或名味著、或名導引、或名增闇、或名害利。所名苦滅諦者，或名大義、或名饒益分、或名義中義、或名無量、或名見、或名虛妄斷、或名最勝、或名常、或名住、或名無為。所名苦滅道諦者，或名滅火、或名勝枝、或名定分別、或名不退、或名深方便、或名出、或名最上、或名至非趣、或名解脫、或名能令解脫。\n\n> 六十｜「諸佛子！彼最勇世界如是等四諦名有四十億百千那由他，隨諸眾生所應調伏，作如是說。\n\n> 六十｜「諸佛子！如娑婆世界所說苦諦，於離垢世界，或名悔恨、或名資待、或名分別、或名輪迴、或名前行、或名一味、或名非法、或名現前地、或名最邪、或名邪見、或名不可忍。所名苦集諦者，或名虛器、或名分、或名甘忍、或名生地、或名取、或名棄、或名增、或名擔、或名能生、或名堅縛。所名苦滅諦者，或名等等、或名空、或名無垢、或名勝根、或名勝等、或名無作、或名滅使、或名最上、或名畢竟、或名破印。所名苦滅道諦者，或名真堅固、或名方便分別、或名義根、或名真性、或名離愛、或名勝淨、或名有邊、或名寄全、或名究竟、或名淨虛妄。\n\n> 六十｜「諸佛子！離垢世界如是等四諦名有四十億百千那由他，隨諸眾生所應調伏，作如是說。\n\n> 六十｜「諸佛子！如娑婆世界所說苦諦，於真實境世界，或名愛欲、或名險根、或名海分、或名邪方便、或名分別根、或名流轉、或名生滅、或名障礙、或名倒根、或名有數。所名苦集諦者，或名愛、或名陷溺、或名不可盡、或名分、或名不正趣、或名津梁、或名事、或名障礙、或名器、或名動。所名苦滅諦者，或名相續斷、或名解散、或名無名、或名不作、或名不現、或名無作、或名無色、或名無燒、或名明、或名淨。所名苦滅道諦者，或名寂行、或名正行、或名修證、或名安隱道、或名無量壽、或名修究竟、或名常道、或名難得、或名彼岸、或名無敵。\n\n> 六十｜「諸佛子！真實境世界如是等四諦名有四十億百千那由他，隨諸眾生所應調伏，作如是說。\n\n> 六十｜「諸佛子！如娑婆世界所名苦諦者，於訶尼世界，或名掠取、或名非善友、或名戰怖、或名多言、或名真地獄、或名非法調伏、或名重擔、或名壞根、或名虛妄、或名虛妄根。所名苦集諦者，或名貪、或名作、或名惡、或名生、或名絞縛、或名想、或名有果、或名不愛、或名不應說、或名迴轉。所名苦滅諦者，或名不轉、或名解脫、或名無作、或名離愛、或名堅固、或名真實、或名離癡、或名寂滅、或名賢聖、或名離怨敵。所名苦滅道諦者，或名正語、或名無諍、或名教導、或名迴向心、或名廣妙、或名分別方便、或名有數、或名趣寂靜、或名勝智、或名善解義。\n\n> 六十｜「諸佛子！訶尼世界如是等四諦名有四十億百千那由他，隨諸眾生所應調伏，作如是說。\n\n> 六十｜「諸佛子！如娑婆世界所言苦諦者，於饒益世界，或名重擔、或名危脆、或名賊等、或名生死、或名非歡喜、或名流轉、或名疲勞、或名醜貌、或名能生、或名利刃。所言苦集諦者，或名流散、或名擾亂、或名煩惱、或名羸劣、或名漂淪、或名乖違、或名非解脫、或名所作、或名取、或名虛妄。所言苦滅諦者，或名離獄、或名真實、或名離諸難、或名覆護、或名善因、或名隨至、或名根、或名離枝、或名無為、或名無次第。所言苦滅道諦者，或名達無所有、或名一切因、或名善本、或名明至、或名不轉法、或名有盡、或名大道、或名能調伏、或名安隱、或名非流轉。\n\n> 六十｜四諦品第四之二\n\n> 六十｜「諸佛子！饒益世界如是等四諦名有四十億百千那由他，隨諸眾生所應調伏，作如是說。\n\n> 六十｜「諸佛子！如娑婆世界所言苦諦者，於鮮少世界，或名惡逆心、或名不長慧、或名邪念、或名流轉、或名無慚愧、或名貪根、或名熾然、或名刺棘、或名火山、或名憂惱。所言苦集諦者，或名廣地、或名來起、或名遠智、或名眾惱、或名恐怖、或名放逸、或名大失、或名著處、或名無主、或名相續。所言苦滅諦者，或名具足滿、或名甘露、或名非我所、或名無主、或名虛妄斷、或名安樂住、或名無量、或名斷流、或名非趣、或名不二。所名苦滅道諦者，或名光明、或名堅實、或名知深義、或名正業、或名非生滅、或名非相續、或名淨導、或名正趣、或名淨方便、或名勝見。\n\n> 六十｜「諸佛子！鮮少世界如是等四諦名有四十億百千那由他，隨諸眾生所應調伏，作如是說。\n\n> 六十｜「諸佛子！如娑婆世界所名苦諦者，於知足世界，或名流轉、或名失利、或名染污障、或名重擔、或名惡形、或名內惡、或名非專到、或名害處、或名苦惱。所言苦集諦者，或名能持、或名方便、或名過時、或名非實法、或名無底、或名攝受、或名離戒、或名煩惱法、或名無量見、或名惡聚。所言苦滅諦者，或名壞身、或名不放逸、或名真實、或名等等、或名清淨、或名離生、或名離曲、或名無相、或名具足、或名不生。所言苦滅道諦者，或名境界言斷、或名功德聚、或名順義、或名廣方便、或名虛妄盡、或名住壽道、或名可稱數、或名正念、或名常道、或名解脫。\n\n> 六十｜「諸佛子！知足世界如是等四諦名有四十億百千那由他，隨諸眾生所應調伏，作如是說。\n\n> 六十｜「諸佛子！如娑婆世界所名苦諦者，於所求世界，或名害、或名坏瓶、或名我所、或名身趣、或名流轉、或名衰主、或名苦、或名輕飄、或名無味、或名來去。所名苦集諦者，或名行、或名憤毒、或名惡行、或名受枝、或名不起疾、或名雜毒、或名虛稱、或名離勝、或名熾然、或名驚駭。所名苦滅諦者，或名非聚、或名非處、或名妙藥、或名不可壞、或名不沒、或名不可量、或名大、或名覺枝、或名離染、或名障礙。所名苦滅道諦者，或名勝行、或名離欲、或名諦究竟、或名入深義、或名實究竟、或名淨現、或名持念、或名離障、或名救濟、或名勝枝。\n\n> 六十｜「諸佛子！所求世界如是等四諦名有四十億百千那由他，隨諸眾生所應調伏，作如是說。\n\n> 六十｜「諸佛子！如娑婆世界所名苦諦者，於解脫音世界，或名匿疵、或名眾生、或名依枝、或名壞勝、或名障礙、或名駛流、或名遠、或名藏、或名受、或名苦枝。所名苦集諦者，或名遏調伏、或名心趣、或名能縛、或名常念、或名彼邊、或名離修、或名虛妄、或名門、或名輕飄、或名隱覆。所言苦滅諦者，或名非處、或名無上勝、或名不還、或名滅諍、或名小、或名無害、或名善住、或名無盡、或名廣、或名無價等。所言苦滅道諦者，或名自見令見、或名摧敵、或名分別印、或名入相、或名難得、或名無量義、或名能起明、或名和合道、或名向不動、或名勝義。\n\n> 六十｜「諸佛子！解脫音世界如是等四諦名有四十億百千那由他，隨諸眾生所應調伏，作如是說。\n\n> 六十｜「諸佛子！如此娑婆世界及十方 ity=\"0.82\"/>\n  <text x=\"602\" y=\"134\" font-size=\"9\" text-anchor=\"middle\" fill=\"#fff\">40</text>\n  <text x=\"602\" y=\"64\" font-size=\"10\" text-anchor=\"middle\" fill=\"#5b4636\">振音</text>\n  <text x=\"320\" y=\"222\" text-anchor=\"middle\" font-size=\"10\" fill=\"#7a6a5a\">每界结语「有如是等四百億十千名；隨眾生心，悉令調伏」（各×1·U02–U12 十二处·类通段 U13 再叠二处）</text>\n</svg>\n\n---\n\n## 八、附录（十一类）\n\n### 附录一：人名表\n| 名 | 训释 | 出处 |\n|---|---|---|\n| 文殊师利 | *Mañjuśrī*，妙德、妙吉祥 | `T1735`／`T1733` |\n| 澄观 | 唐·清凉山大华严寺沙门 | `T1735` |\n| 法藏 | 唐·魏国西寺沙门 | `T1733` |\n| 智俨 | 唐·终南山至相寺沙门（华严二祖） | `T1732` |\n| 慧苑 | 唐·大薦福寺沙门 | `X0221` |\n| 李通玄 | 唐·李通玄 | `T1739` |\n\n### 附录二：名相表\n（见 §4.4）\n\n### 附录三：经文要句\n（见 §2.1–§2.7）\n\n### 附录四：注疏引文汇\n（见 §5.1–§5.3；〔L.192 本批〕**疏科长文全摘十段已入 §5.1**·**本科段全文照录已入附录四′**·复核件 `_e8_dump.txt`／`_e8_stats.txt`）\n\n**附录四′·澄观《华严经疏》本科段全文照录**〔L.192 本批·达标基线补全〕（`T1735` 卷十三·raw @154232–157262·CJK-only 坐标回映切片·分页符行剔除·余照原档分行排段不转写不断句·康熙部首原字形（部首码位）已归一正字（L.199）·本附录在 §二 审计区外不污引文审计·共 110 档行·11 科段）：\n\n〔按〕本窗起「四聖諦品第八」品题、止「如是皆為調伏眾生」（WINTAIL），与 P7 附录（止「通自他也」）起点衔接不重叠；「上來三品。答初十句所依果問竟」结经句实测在**次次品《光明覺品第九》疏段**（raw @167279／@167378·本窗外·参 P7 附录四′〔按〕L.192 订正）。**〇·品题·无分注（科起直入五门）**\n\n> 四聖諦品第八 釋此一品。五門分別\n\n**甲·五门·来意**\n\n> 釋此一品。五門分別。初來意者。此品廣前種種語業。即答前佛說法 問。亦遠答前會佛演說海之一問故。既知佛可歸。次知法可仰。上名\n\n> 隨物立。今法逐機差故次來也。二釋名中\n\n**乙·释名（諦實·審諦·瑜伽·涅槃·圆教）**\n\n> 二釋名中。言四聖諦者。聖者正也。 無漏正法得在心故。諦有二義。一者諦實。二者審諦。言諦實者。此\n\n> 約境辨。謂如所說相不捨離故。真實故。決定故。謂世出世二種因 果。必無虛妄不可差失。言審諦者。此就智明。聖智觀彼審不虛故。\n\n> 凡夫雖有苦集。而不審實不得稱諦。無倒聖智審知境故。故名聖諦。 故瑜伽九十五云。由二緣故名諦。一法性故。二勝解故。愚夫有初無\n\n> 後聖具二故。偏說聖諦。四謂苦集滅道。總云四聖諦。帶數釋也。性 相云何。逼迫名苦。即有漏色心增長名集。即業煩惱。寂靜名滅。謂\n\n> 即涅槃。出離名道。謂止觀等。此約相說通大小乘。智論云。小乘三 是有相滅是無相。大乘四諦皆是無相。涅槃云。解苦無苦名苦聖諦。\n\n> 謂達四緣生故。空則超筌悟旨成大。又涅槃云。凡夫有苦而無諦。二 乘有苦有苦諦。而無真實。菩薩無苦有諦。而有真實。謂若苦即諦。\n\n> 三塗之苦豈即諦也。二乘雖審知之。而不達法空不見真實。又二乘雖 知苦相。不知無量相。故大經云。苦有無量相。非諸聲聞緣覺所知。\n\n> 瑜伽說苦。有一百一十。然此經中。雖彰名異即表義殊。以名必召實 故。是無量四諦義也。約一界一諦即有十千。娑婆四諦有四百億十千\n\n> 名義。而文義包博言含性相。又究此四。非唯但空便為真實。今了陰 入皆如無苦可捨。無明塵勞即是菩提。無集可斷。生死即涅槃無滅可\n\n> 證。邊邪皆中正。無道可修。無苦無集即無世間。無滅無道即無出世 間。不取不捨同一實諦。故斯一品。有作無作有量無量。皆在其中。\n\n> 準下第五地中。復以十重觀察。至下當明。三宗趣者\n\n**丙·宗趣**\n\n> 三宗趣者。以無邊諦海隨 根隨義。立名不同。遍空世界以此為宗。務在益物調生為趣。又上二\n\n> 皆宗發生淨信為趣。四解妨難。問\n\n**丁·解妨难问（二问二答）**\n\n> 四解妨難。問既彰佛語業答說法問。佛所說法多 門。何以唯陳四諦。答以名雖在小義通大小事理具足。謂苦集二諦是\n\n> 世間因果。所知所斷無改易故。滅道二諦出世間因果。所證所修事決 定故。知斷證修能運眾生。到彼岸故。世界有異此獨無改。況無量無\n\n> 作何義不收。是故約此以顯差別。又為破計引機故。謂演彼聲聞四諦 局法。令亡所執。引入一乘無邊諦海故。約此辨。何以四諦皆帶苦\n\n> 言。謂苦滅聖諦等。然謂生苦之集故。云苦集。盡苦之滅名為苦滅。 至苦滅之道名苦滅道。不得單言苦道。以道非生苦不同集故。又非滅\n\n> 苦不同滅故。能證苦滅故云苦滅道。五正釋文\n\n**戊·正释文·总科（一品分二·于中分四）**\n\n> 五正釋文。一品分二。先標告。 二諸佛子下正釋。於中分四。初娑婆諦名。二隣次十界。三類通一\n\n> 切。四主伴無窮。然此望前品略於單說四洲就初二中\n\n**己·别科（別列·結數·立名四句）**\n\n> 就初二中。一一方內文各 有二。一別列諦名。二結數辨意。然其立名或有因從果稱果籍因名。\n\n> 約事約理或總或別。如文當知。初娑婆中列內四諦。即為四別。一苦 云罪者\n\n**庚·娑婆四十名逐释·結數**\n\n> 一苦 云罪者摧也。謂摧壞色心故。二逼迫者。不可意境逼迫身心也。此二\n\n> 總顯。三變異者。壞苦也。攀緣者。追求苦也。聚者。五盛陰苦也。 刺者。從喻立名。如刺未拔。依根者。由苦能生一切惡也。虛誑者。\n\n> 於下苦中能生樂想也。癰瘡處者。此喻二苦。有癰瘡處性自是苦。此 如五陰苦。若加手等。觸苦上加苦是苦苦也。愚夫行者。行苦也。愚\n\n> 人所行故。如以睫毛置掌不覺。若置眼內為苦不安。愚夫不覺行苦如 掌內之毛。而復以苦反欲捨苦。皆愚夫行也。二集中初二通顯。謂有\n\n> 業惑者。繫縛三界滅壞善根。次二別顯煩惱。餘多通業惑。三苦滅 中。無諍者。煩惱為諍故。體真實者。非唯惑滅而已。實乃法身常住\n\n> 為滅諦之義故。次云住自性也。謂本來滅故。四苦滅道諦云十藏者。 謂信聞等如十藏品說。二結云四百億十千者。准望前名號。一四洲有\n\n> 十千。今一四天下一諦。亦有十千。四諦歷於百億。故有四百億箇十 千。隨眾生心下。顯差別之意也。第二辨十方諦名\n\n**辛·十方諦名逐释（密訓–振音十界）**\n\n> 第二辨十方諦名。一密訓即東方界 也。苦名分析悉無力者。推之於緣無實物也。形狀物者。有形皆苦\n\n> 也。集中病源者。謂有攀緣故。滅云一分者。惑由妄起故。分數塵沙 理不可分故稱一分。道言上行者。所之在滅。言觀方者。謂觀四諦\n\n> 也。更有四方如十定品。二最勝世界者。即是南方前名豐溢。豐溢是 正翻最勝。乃義譯耳。苦名有勢力者。生老病死猶四山臨。人世雖賢\n\n> 豪力無與競。集名非己物者。己本性淨妄惑何預。滅名義中義者。事 善有義滅理尤勝。義中義也。道名燒然。以智慧火燒煩惱故。三西方\n\n> 離垢世界苦名有無數者。三際無涯故。集名增長者。從惑生惑業故。 滅名稱會者。以事之滅稱會理滅故。破印者。世之陰苦若蠟印印泥印\n\n> 壞文成。此陰纔滅彼陰續生。今云破印永不生也。道名諸有邊者。照 實即生死可盡也。故中論云。真法及說者聽者難得故。是故則生死非\n\n> 有邊無邊。謂三事難得故非有邊。難得者。容有得義。得則生死有 邊。受寄全者。業寄於集暫受還亡。業寄於道永不可失。四北方豐溢\n\n> 世界者。豐溢自南方界名。前品此方名為豐樂。梵云微部地 (田夷切)\n\n> 豐 樂得旨。譯者不審二名相參耳。苦名有海分者。二十五有各一分也。\n\n> 數所成者。數體即集集所成故。集名分數者。無一理以貫之則惑業萬 差矣。攫噬者。攫搏也。噬嚙也。集之損害猶惡禽獸也。滅名無所修\n\n> 者。修已極故。道名無量壽者。謂證滅永常。今因標果稱。五東北方 攝取世界。苦名地獄性者。未入忍來常有墮性。根本空者。約性以\n\n> 說。同淨名五受陰洞達空故。集中由妄惑故。愛見羅剎橫相執取。妄 體本空故。無可取故。中論云虛誑妄取者是中何所取。佛說如是法欲\n\n> 以示空義。滅道俱名離言者。滅性離言。道令言離故。六東南繞益世 界苦名如賊者。五盛陰苦劫害我故。集名無力者。於出生死無有力\n\n> 能。善法治之不復相拒故。滅名捨因者。無為無因而體是果菩提之道 望此亦因獨寂滅涅槃得稱果果。故曰捨因。道名一切印無不審決故。\n\n> 印義後說。七西南鮮少世界苦名邪行者。體非正道是行性故。集名廣 地生大苦樹故。宅主即無明也。滅名絕行處者。心路絕故。道名廣大\n\n> 路者。先聖後賢游之而不厭故。八西北歡喜界中苦諦闕一者。晉譯少 出生唐譯少失利。集名無底者。煩惱深故。非習道學浮沈而不已。滅\n\n> 名破依止。身與煩惱互為依止。展轉無窮唯證滅理方能永破。道名廣 大性者無不在故。九下方關[門@龠]世界。苦名我所成者。我見有\n\n> 故。集名我心即我見愛。滅名覺分者。所覺處故。道名入義者。能入 滅諦第一義故。十上方振音世界苦名匿疵。身為惑病所藏處故。傲慢\n\n> 者。慢以生苦為業。果取因名。染著性者。性令染故。如樂受壞苦誰 謂苦耶。駃流者。剎那性故即行苦也。不可樂者。苦苦也。覆藏者。\n\n> 藏苦因故。樂藏壞苦故。不苦不樂藏行苦故。速滅者。流轉苦也。難 調者。誰不欲捨莫之能出。不憚疲苦方能調之。集名至後邊者。不斷\n\n> 無窮故。門者入苦趣故。滅名不可取取則不滅也。小之則無內不容一 物也。大之則無外法界性也。道名難敵對者。有惑必破不為惑破故。\n\n> 猶明能滅闇。故無闇而不滅。闇不滅明何能相敵。第三諸佛子下\n\n**壬·类通一切**\n\n> 第三諸佛子下。類 通一切。初舉娑婆以類東方。後舉東方以類餘九。第四如娑婆下\n\n**癸·主伴无尽·结**\n\n> 第四如娑婆下。顯 主伴無盡。文中初舉此例彼。謂娑婆為主。有密訓等盡空世界皆為\n\n> 伴。後彼一切下以彼類此。則知密訓等盡空世界為主。攝伴亦爾。則 無盡無盡耳。此猶約娑婆同類世界而說。以結數中同百億故。餘樹形\n\n> 等異類世界。彼一一類皆遍空法界。是則重重無盡無盡。非此所說 也。如是皆為調伏眾生\n\n### 附录五：对读简表\n（见 §6.1–§6.3）\n\n### 附录六：存疑清单\n| # | 项目 | 状态 |\n|---|------|------|\n| 1 | 密训世界名号「缺一」之校勘（澄观） | 〔待核〕 |\n| 2 | 名号数目「四百億十千」vs「四百億」之异 | 〔待核〕 |\n| 3 | 海云讲记于本品之具体讲记 | 〔部分已据 Ep10（三宝配）；正行段逐字待 Ep16·2026-10-24·P3〕 |\n| 4 | 慧苑本品之记是否存 | 〔已订 2026-10-24·X0221 L4623「如來名號品及四聖諦品之記恐不傳歟」直证无传；X0221 L13505 他卷引抄存待核〕 |\n| 5 | 梵本题名 | 〔待核〕 |\n| 6 | 具体字数/句数脚本复算 | 〔已复算 2026-10-24·§7.4 实测〕 |\n| 7 | 「密訓」阙一名之新旧本差异（澄观所据写本 vs 今本） | 〔待核·行序属名号品段 L5366，二品共用之世界名列表校〕 |\n| 8 | §五诸家引文行号锚逐条回源 | 〔已订 2026-10-24·P1；§5.1–5.3 均改按真四谛品段并标行号〕 |\n| 9 | **整段串科**：§5.1 澄观·§5.2 法藏·§5.2′ 智俨旧稿均误将〈名号品〉五/四门挂于本品 | 〔已订 2026-10-24·P1，各加校订注并归位旁引〕 |\n| 10 | 李通玄「苦者逼迫義…道者能通義」四句、「在方无方」本机 T1739 查无 | 〔已标待核/改据 L5786、2026-10-24·P1〕 |\n| 11 | 智俨「時眾請文有四十四句」本机 T1732 查无（实为 L3739「三十二問」） | 〔已改 2026-10-24·P1〕 |\n| 12 | 六十本《四圣谛品》品题原字形（T09n0278_juan4 开篇无此串） | 〔已订 2026-10-24·P2：六十品题实作「四諦品」（无「聖」字）@L297；逐名对照已成 §6.1；**七–十界（鮮少·知足·所求·解脫音）据全本 `T09n0278.xml` 卷五回源·§6.1 表（二）·旧〔待卷五〕今闭**〕 |\n| 13 | 藏译位次（本品当藏 13）与兜沙经对应关系之本地核验 | 〔论证链已透明化 2026-10-24·P4（§6.3·§3.3）；**兜沙经 `T10n0280`＋六十全本 `T09n0278` 已入库并回源（§6.5·§6.1）**；本机无藏译德格版 Toh 44，藏译加法规则与逐字对应仍〔待核〕，不据以入校勘〕 |\n\n### 附录七：引用书目\n- `T10n0279` 唐·实叉难陀译《大方广佛华严经》（八十华严）\n- `T09n0278` 晋·佛驮跋陀罗译《大方广佛华严经》（六十华严）\n- `T10n0293` 唐·般若译《大方广佛华严经》（四十华严）\n- `T1735` 澄观《大方广佛华严经疏》\n- `T1733` 法藏《华严经探玄记》\n- `T1732` 智俨《搜玄分齊通智方軌》\n- `T1739` 李通玄《新华严经论》\n- `X0221` 慧苑《續華嚴略 // ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);

function _applyArticleENMode(){
  var full=document.getElementById('article-full');
  var btn=document.getElementById('article-en-toggle');
