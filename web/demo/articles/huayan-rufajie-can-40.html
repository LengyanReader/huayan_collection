var ARTICLE = {"id": "huayan-rufajie-can-40", "file": "articles/huayan-rufajie-can-40.html", "title": "入法界品 · 参40·妙威德圓滿愛敬", "title_sub": "林神｜嵐毘尼林｜菩薩於無量劫遍一切處示現受生自在神變解脫 ｜ 11,939 CJK · 六层：数据卡/主页照录/三译四件套/古注取窗疏论/EN/指针", "icon": "🧭", "version": "v1.0", "meta": "", "doc": "", "doc_md": "# 参40·妙威德圓滿愛敬園林神（八十作妙德圓滿神）（妙威德圓滿愛敬·八十作妙德圓滿神） —— 入法界品·五十三参子页\n\n> **体例与来源**：底本四十华严 `T10n0293`（般若译·善财历参）；对读八十 `T10n0279`、六十 `T09n0278`（引文各照底本）。本页由程序汇编（L.491）：§一 照录自主页《华严经细读·第三十九部》§参40 全文（参题解·要点·阐释·对照启发·三译深释表·经文全引——人工核订内容·原样保留，含其中〔本文判断〕〔待核〕标注）；§二 自四件套语料库（L.421/L.456）程序汇编；数据卡自行历图数据（L.407/L.413/L.415）。**阐释性文字之性质以原文标注为准；本页不新增判断。**\n\n> ← [参39·守護一切眾生大願精進力光明](huayan-rufajie-can-39.html) ｜ 📘 [子页总目](huayan-rufajie-can-index.html) ｜ 🗺 [行历图](huayan-rufajie-journey.html) ｜ 📄 [主页 §参40](huayan-rufajie-pin.html) ｜ [参41·瞿波 →](huayan-rufajie-can-41.html)\n> **古注取窗（L.493→L.499 四源）**：§三 收澄观《华严经疏》（`T1735`）·澄观《随疏演义钞》（`T1736`·末会多总谈·部分参为类聚引）·李通玄《新华严经论》（`T1739`）·法藏《探玄记》（`T1733`·残存）逐参节引（程序取窗·单调锚定·句界截断·页码留痕）。程序抽取本字准待校，引前须对 CBETA 原书核。\n\n## 〇、本参数据卡（程序汇编·L.491）\n\n| 项 | 值 |\n|---|---|\n| 参号 | 第40参（54 卡号系·L.327/L.407 重排）｜第40参（经文层计数）\n| 善知识·四十 | **妙威德圓滿愛敬**（`T10n0293`）\n| ·八十 | 妙德圓滿（`T10n0279`）\n| ·六十 | 妙德圓滿（`T09n0278`）\n| 三译名判 | 四十增威德愛敬\n| 身份 | 林神\n| 处所 | 嵐毘尼林\n| 法门自陈（「我唯得/知此」） | 菩薩於無量劫遍一切處示現受生自在神變解脫\n| 本参经文 | 11,939 CJK（T0293 span 185,815–199,587）\n| 前参 | 参39·守護一切眾生大願精進力光明（法门：菩薩普化眾生令生善根解脫）\n| 后参 | 参41·瞿波（法门：觀一切菩薩三昧）\n\n## 一、主页参节全文（照录·零删改）\n\n> 🧭 **本参子页·深度解读 ↗** [参40·数据卡·主页参节照录·三译四件套·延伸指针](huayan-rufajie-can-40.html)\n\n**参题解**：迦毘羅城嵐毘尼林·**妙威德圓滿愛敬林神**（八十作妙德圓滿神）。法门：**菩薩於無量劫遍一切處示現受生自在神變解脫**（实测——「受生藏」之义）。\n\n**【要点提炼】**\n\n1. **诞生现场的神**：此园神亲见毘盧遮那（释迦）将诞的十种神变（轻噪天鼓……妙庄严云，「是為菩薩將誕生時第十神變」），并见「摩耶夫人然後右脇而生世尊，如虛空中現淨日輪」——**佛诞的目击者作善知识**。\n2. **受生藏**：法门以「受生」为藏——菩萨于无量劫遍一切处的**示现受生**自在；林神历数「云何菩薩壽命圓滿？色相圓滿？種族圓滿？自在圓滿？」——受生的工艺学。\n3. **发清净心十法**：「行住坐臥心無厭足，是為第一發清淨心」——清净心以「无厌足的日常」为第一义。\n\n**【阐释】**（〔本文判断〕）参39是全品**最温柔的一参**：善知识的资格是「我在场」。佛诞之园的神，一生守着一个诞生现场——而她所证的「受生藏」正是把一切处一切劫的诞生都变成自己的现场：诸佛在哪受生，她就在哪守护。受生不是轮回之苦的被动，是**乘愿的主动**——此参为下参摩耶（为一切佛母）作序。\n\n**【对照/启发】**：与〈菩薩住處品〉二十住处对读——住处之神圣化在此完成（诞生地即圣地）。启发：「在场」是一种法门——你长期在场的那一件事，就是你受生藏的入口。\n\n**60/40 深释·参40（六十妙德圓滿／四十妙威德圓滿愛敬）**\n\n| 件 | 六十 | 四十 | 同构 |\n|---|---|---|---|\n| 到会 | 至佛地藏受生法？此菩薩摩訶薩悉於三世諸如來所，受灌頂法，一切… | — | — |\n| 法门 | — | — | — |\n| 指授 | 汝詣彼問云何菩薩行菩薩行？生如來家？為世間燈？盡未來劫，修菩… | 汝詣彼問菩薩云何修菩薩行？生如來家？為無盡燈，光明照世？盡未… | 9/14 |\n| 辞退 | 禮彼夜天足，遶畢辭退 | 禮敬彼夜神足，遶無數匝，慇懃瞻仰，一心戀慕，辭退 | 1/14 |\n\n判：师名〔义译异〕·门名〔义近〕。\n\n**三译对读（L.415·据 §批七/批八 总表）**\n\n| 译 | 师名 | 门名 |\n|---|---|---|\n| 八十 | 妙德圓滿 | 菩薩於無量劫遍一切處示現受生自在解脫 |\n| 六十 | 妙德圓滿 | 菩薩受生自在法門 |\n| 四十 | 妙威德圓滿愛敬 | 菩薩於無量劫遍一切處示現受生自在神變解脫 |\n\n判：师名〔四十增威德愛敬〕·门名〔基同增衔〕。\n\n**本参经文全引**（T0293·11,939 CJK·0 手抄）：\n\n> 禮敬彼夜神足，遶無數匝，慇懃瞻仰，一心戀慕，辭退而去。大方廣佛華嚴經卷\n>\n> 第二十五大方廣佛華嚴經大方廣佛華嚴經卷\n>\n> 第二十六罽賓國三藏般若奉詔譯入不思議解脫境界普賢行願品爾時，善財童子正念思惟彼大願精進力守護一切眾生光明夜神，以解脫力，現等一切眾生心所見身，現等一切眾生形像身，現等無邊色相海身，現等一切處方俗威儀海身；普門示現如是等身，隨諸眾生心之所應，以種種方便教化成熟，令其開悟，增長善根，隨順修行，證入甚深菩薩解脫。\n>\n> 善財如是以正念力憶持分別彼主夜神所得解脫，所有教法，一一字句、名相、體性，以總持力憶念攝持，以慧解力分明顯示，以行願力發起廣大如是隨順，獲得無量殊勝功德。漸次而行，度恒河北，入憍薩羅國，向迦毘羅城，詣嵐毘尼林。到已，右遶周旋，求覓妙德圓滿愛敬林神；\n>\n> 見在林中大寶樹下，莊嚴圓滿寶樓閣中，坐摩尼藏師子之座，二十億那由他諸林神女前後圍遶，廣為演說一切菩薩受生海經，令其皆得生如來家，疾入菩薩大功德海。善財見已，頂禮雙足，合掌前立，作如是言：「大聖！我已先發阿耨多羅三藐三菩提心，而未知菩薩云何生如來家？\n>\n> 云何行菩薩行？云何能作一切眾生種種照世大光明燈？」時，彼林神告善財言：「善男子！菩薩有十種受生藏，若諸菩薩成就此法，則能速疾生如來家，念念增長菩薩善根，不休不懈，不退不斷，無厭倦，無繫縛，無疑惑，無迷亂，無怯弱，無惱悔，無遺失，一切智體等十方界，隨順佛境入法界門，不退廣大菩提之心，增長一切波羅蜜行，捨離一切世間趣類，疾入一切如來智地，神通智力常現在前，種種佛法皆能順入，究竟獲得真實義境。\n>\n> 何等為十？所謂：願常供事一切諸佛菩薩受生藏，普遍成就菩提心菩薩受生藏，觀諸法門方便修行菩薩受生藏，以深淨心普照三世菩薩受生藏，平等光明普照一切菩薩受生藏，生三世一切諸如來家菩薩受生藏，佛力光明普遍莊嚴菩薩受生藏，微細觀察普遍智門菩薩受生藏，法界變化種種莊嚴菩薩受生藏，速疾履踐諸如來地菩薩受生藏。\n>\n> 「善男子！云何名願常供事一切諸佛菩薩受生藏？善男子！此菩薩初發心時，作如是願：『我當親近承事諸佛及諸菩薩，現見諸佛，恒生歡喜；於諸佛所，以尊重心恭敬供養無有厭足；增長淨信，心無退轉；積集功德，恒不斷絕。為欲清淨一切智性，積集善根令增長故。\n>\n> 』是為菩薩\n>\n> 第一受生藏。「云何名菩薩普遍成就菩提心受生藏？善男子！此菩薩發阿耨多羅三藐三菩提心，所謂：起深厚大悲心，於諸眾生能救護故；起供養諸佛心，令諸如來增歡喜故；起勤求正法心，於諸所有無吝惜故；起所作廣大心，令一切智悉現前故；起圓滿大慈心，為普攝取一切眾生作饒益故；\n>\n> 起不捨眾生心，被求一切智堅誓甲故；起無諂幻心，得如實智，普照一切差別法故；起如說而行心，修習菩薩一切難行諸苦行故；起不誑一切諸佛心，願常守護一切如來大誓願故；起一切智大願心，盡未來際調伏眾生無斷絕故。此十為首，有佛剎極微塵數菩提心大功德聚，若諸菩薩成就此法，則得常生諸如來家；\n>\n> 是為菩薩\n>\n> 第二受生藏。「云何名菩薩觀諸法門方便修行受生藏？善男子！此菩薩於一切法門海，起現前觀察心；於一切智圓滿道，起成就迴向心；於諸威儀清淨業海，起正念觀察心；於一切菩薩種種三昧海，起普遍清淨心；於一切菩薩種種功德海，起修習成滿心；\n>\n> 於一切菩薩道，起莊嚴出生心；於一切智精進功德，起如劫火熾然不休息心；於一切眾生界，起令成就普賢行心；於一切威儀中，起修菩薩種種功德心；於真實中道，起捨離有無，入真實正觀心；是為菩薩\n>\n> 第三受生藏。「云何名菩薩以深淨心普照三世受生藏？善男子！此菩薩成就清淨增上深心，得佛菩提光明遍照，深入菩薩方便法海；其心堅固，猶如金剛，攝取眾生，畢竟不捨；遠離一切諸有趣生，成就如來種種神變，起於菩薩殊勝行願，具足菩薩明利諸根，增長菩薩清淨善心，成就不動大誓願力，得諸如來之所護念，破壞一切諸障礙山，與諸眾生作所依怙；\n>\n> 是為菩薩\n>\n> 第四受生藏。「云何名菩薩平等光明普照受生藏？善男子！此菩薩具修種種方便行海，調伏成熟一切眾生；一切所有悉能棄捨，成就無邊清淨戒體；住佛境界，具足安忍，得一切佛法忍光明；以大精進勇猛志力，趣向出生一切智體；勤修清淨諸三昧門，成就一切神通智力；\n>\n> 以智慧光照明法界，得一切法差別光明；成就清淨無障礙眼，見一切佛諸色相海；悟入一切甚深法性，自在教化成熟眾生，能令世間皆生歡喜，勤修差別如實法門；是為菩薩\n>\n> 第五受生藏。「云何名菩薩生三世一切諸如來家受生藏？善男子！此菩薩生如來家，隨如來住，成滿一切殊勝行門，具足三世如來願海，得一切佛純一善根，與一切佛同一體性，成就出世白淨法行，安住普賢廣大功德，入一切佛甚深三昧，見一切佛自在神力，所化眾生咸令清淨，得佛平等迴向法門，能隨問答，辯才無盡；\n>\n> 是為菩薩\n>\n> 第六受生藏。「云何名菩薩佛力光明普遍莊嚴受生藏？善男子！此菩薩深入一切佛威神力，光明遍照，心不退轉；遊諸佛剎，無有動作；承事供養菩薩眾海，無有疲厭；如實了知諸法如幻，知諸世間悉皆如夢；見一切佛示現色身，所有相好猶如光影；\n>\n> 知一切佛神通所作，自在遊戲猶如變化；知諸有趣隨類受生，如鏡中像；知一切佛所轉法輪，令眾生聞，如空谷響，以方便力開法界門，咸令證入到於彼岸；是為菩薩\n>\n> 第七受生藏。「云何名菩薩微細觀察普遍智門受生藏？善男子！此菩薩住童真位，獲得菩薩種種威儀，一切功德具足圓滿，微細觀察一切智門；於一一門，盡無量劫，開演分別無邊菩薩所行境界；於諸菩薩甚深三昧，心得自在；成就最勝諸波羅蜜，念念普生一切世界諸如來所；\n>\n> 能於一切差別境中，入於平等無差別定；於無差別平等法中，現於自在有差別智；於無量無邊境中，自在入出無有障礙；於無境中，起於種種差別境界；於微小境中，見廣大境；於廣大境中，見微小境；知諸世間皆假施設，通達諸法因緣性相，皆是自心之所現起；\n>\n> 是為菩薩\n>\n> 第八受生藏。「云何名菩薩法界變化種種莊嚴受生藏？善男子！此菩薩於念念中，種種莊嚴無量佛剎，普隨眾生現變化身；得無所畏最勝彼岸，示現種種諸佛威儀，成就種種方便善巧；依止清淨無礙法界，隨眾生心現眾色相，令其見者，無不調伏；普使安住不思議乘，具足開演成菩提行；\n>\n> 行無障礙一切智道，相續出現轉於法輪；住無中邊薩婆若海，隨所應化不失其時；常能平等正念饒益，成就如來智慧之藏；是為菩薩\n>\n> 第九受生藏。「云何名菩薩速疾履踐諸如來地受生藏？善男子！此菩薩悉於三世諸如來所受灌頂法，悉知一切三世諸佛同一體性境界次第。所謂：知一切世界隨心現起相續次第；知一切眾生前後歿生相續次第；知一切眾生種種心念相續次第；知一切菩薩前後際劫，凡所受生相續次第；\n>\n> 知一切菩薩前後際劫，所行之行相續次第；知一切菩薩所有修習，種種智境相續次第；知一切諸佛前後際劫，現成正覺相續次第；知一切法功能，善巧親近供養相續次第；知一切劫盡前後際，若成若壞，種種事相，種種名號相續次第；知隨所應度，現成正覺，功德莊嚴，開悟調伏，示現威力，智慧神通，轉正法輪，令諸眾生親近供養皆不失時相續次第，於無邊眾生界，以巧方便而調伏故；\n>\n> 是為菩薩\n>\n> 第十受生藏。「善男子！如是菩薩十種受生藏，一切菩薩無不從生。若諸菩薩為欲成就廣大菩提，修習增長圓滿此法，則能積集種種功德，於一莊嚴中出一切莊嚴，普遍莊嚴一切佛剎；示現變化種種威儀，普遍調伏諸眾生界，盡未來劫無有休息。諸佛法海種種因緣，種種境界，展轉流通相續不斷，現前覺悟無不周遍；\n>\n> 現不思議佛自在力，普遍充滿虛空法界；於諸眾生心行海中，為攝取故而轉法輪。普於十方一切世界諸如來所，親近不捨，無量法雲普遍現前，以清淨音演諸法海；住一切處，所行無礙，以一切法妙光明網，莊嚴種種菩提道場；隨諸眾生心之樂欲，開演無邊種種法藏，顯示種種諸佛境界，隨應開悟一切世間。\n>\n> 」爾時，嵐毘尼園妙德愛敬林神欲重宣說菩薩廣大受生藏義，以佛神力，觀察十方，為善財童子而說偈言：「最上無垢深淨心，見一切佛無厭足，願盡未來常供養，此明慧者受生藏。三世一切剎海中，所有眾生及諸佛，悉願救度恒瞻敬，此名稱者受生藏。\n>\n> 受法雲雨無厭足，普觀三世無所著，身心清淨如虛空，此無比者受生藏。心恒遊止大悲海，堅固高勝如須彌，通達一切種智門，此自在者受生藏。大慈遍覆於十方，普行無垢波羅蜜，以法光明照群品，此雄猛者受生藏。覺法自性心無礙，生於三世諸佛家，深入法界智無邊，此明慧者受生藏。\n>\n> 法身清淨心無著，普詣十方無量土，一切佛力靡不成，此難思者受生藏。入深智海得自在，住三昧海咸究竟，觀一切智方便門，此實智者受生藏。嚴淨一切諸佛剎，成熟一切諸群生，現佛神力普莊嚴，此大名者受生藏。諸佛法智皆修習，速能普入如來地，了知法界皆無礙，此真佛子受生藏。\n>\n> 「善男子！若諸菩薩具此十種受生藏，則得生如來家，為諸世間作大明燈。善男子！我得此一切菩薩自在受生解脫門，無量劫來，神通遊戲，顯示菩薩無礙境界。」善財白言：「聖者！此解脫門境界云何？」林神答言：「善男子！我先發願：『願一切菩薩現受生時，我身皆得親近供養，願入毘盧遮那如來無量廣大受生海。\n>\n> 』以昔願力而來生此娑婆世界，此四天下閻浮提中迦毘羅城嵐毘尼園。於此林中，專念菩薩何時下生；經一百年，果見世尊從兜率天而來下生。善男子！爾時菩薩將下生時，此大林中先現十種莊嚴瑞相。何等為十？所謂：\n>\n> 一者、此林中地忽自平坦，阬坎、堆阜悉皆不現。\n>\n> 二者、林中所有荊棘、瓦礫，不淨之物，皆悉不現；金剛為地眾寶莊嚴，如歡喜園，柔軟細妙。\n>\n> 三者、園中復有寶多羅樹，其根深植，下至水際，次第行列分布莊嚴。四者、林中復現一切香芽，一切香藏，塗香、末香、幢幡、寶蓋及諸妙寶摩尼形像；種種香樹，蔭映莊嚴，出過人天所有香氣。五者、林中復有諸妙華鬘，寶莊嚴具，處處充滿，微妙分布。\n>\n> 六者、林中一切諸大寶樹自然開發摩尼寶華，於華葉間流出真金柔軟鬘線。七者、林中所有一切池沼皆生妙華，柔軟鮮潔，從地涌出，彌布水上。八者、時此林中娑婆世界所有欲、色諸大天王，及諸天、龍、夜叉、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽、鳩槃茶等一切世主莫不來集，合掌而住。\n>\n> 九者、此三千世界所有欲界諸天采女、龍女、夜叉女、乾闥婆等，及諸世主一切采女，皆生歡喜，各持種種諸供養具，向畢洛叉樹恭敬而立。十者、十方所有一切諸佛，皆從臍輪放大光明，名菩薩受生種種自在燈，普照林中一切諸物，一一光中，悉現諸佛受生、誕生所有神變，及現一切菩薩受生種種功德，又出諸佛種種言音，令諸眾生咸得聞見。\n>\n> 是為林中十種瑞相，現此相已，時諸天王及諸世主即知菩薩當欲下生；我時見此十種瑞相，難思境界，心生歡喜，踊躍無量。「善男子！時，菩薩母摩耶夫人出迦毘羅城，入此林時，復現十種光明瑞相，普照一切，令諸眾生得一切智法性光明，速疾增長歡喜愛敬。\n>\n> 何等為十？所謂：於此林中眾寶樓閣，香芽、香藏悉放光明，普照十方一切世界；又此林中一切池沼所有蓮華，悉放光明，於光明中出微妙音，演說如來真實法句；又令十方一切世界初發心菩薩，悉放光明而來照此嵐毘尼林，無不遍滿；又令十方一切佛剎所有住地諸大菩薩現大神變，放大光明而來照此嵐毘尼林；\n>\n> 又令十方一切佛剎修行成就圓滿一切波羅蜜行諸大菩薩，放大光明而來照此嵐毘尼林；又令十方一切佛剎住大願海諸大菩薩，悉放一切自在無礙願智光明而來照此嵐毘尼林；又令十方一切佛剎住大悲海諸大菩薩，悉放一切願智光明而來照此嵐毘尼林；\n>\n> 又令十方一切佛剎住方便海諸大菩薩，悉放種種調伏眾生善巧光明而來照此嵐毘尼林；又令十方一切佛剎諸大菩薩，悉放真實教智光明而來照此嵐毘尼林；又令十方一切佛剎諸大菩薩，放一切佛自在下生、出家、成道大智光明而來照此嵐毘尼林。此十種光出現之時，普令除滅一切眾生無明黑暗。\n>\n> 「善男子！時，摩耶夫人現此十種光明相已，於畢洛叉樹下將欲誕生，復現十種廣大神變。何等為十？善男子！菩薩將欲誕生之時，色界天王及諸天子，欲界諸天及諸采女，諸龍、夜叉、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽，一切世主并其眷屬，為供養故皆悉雲集。\n>\n> 時，摩耶夫人色相威德莊嚴殊勝，身諸毛孔咸放光明，如燈、如日、如融金聚，普照三千大千世界，無所障礙，其中所有一切光明，咸皆飲蔽，悉不復現，除滅一切眾生煩惱及惡道苦；是為菩薩將誕生時\n>\n> 第一神變。「又，善男子！當爾之時，摩耶夫人於其腹中，悉現三千大千世界一切形像，其中百億四天下閻浮提內種種都邑，各有園林，名號不同；一一皆有摩耶夫人，各於樹下，一切世主并其眷屬圍遶而住，悉現菩薩將欲誕生不可思議神變之相；是為菩薩將誕生時\n>\n> 第二神變。「又，善男子！摩耶夫人於身一切毛孔之中，悉現世尊毘盧遮那過去所修菩薩行時親近供養一切諸佛，及聞諸佛說法音聲，普震十方一切世界。諸所現境，如於明鏡及淨水中能現虛空、日、月、星宿、雲、雷等像，摩耶夫人身諸毛孔所現如來過去所行神通等事，亦復如是；\n>\n> 是為菩薩將誕生時\n>\n> 第三神變。「又，善男子！摩耶夫人身諸毛孔，一一皆現如來往修菩薩行時所住一切世界海，一切世界種，世界體性，世界形狀，及世界中城邑、聚落、山林、河海、泉流、池沼，所度眾生，所經劫數，所有佛現，所入淨剎，所有受身，所有壽命，所事善友，所得法門，所修行願，所獲果證，從初發心乃至獲得不退轉地；\n>\n> 於一切處，在在所生，摩耶夫人皆為其母。如是，如來過去所有一切境界，於毛孔中靡不皆現；是為菩薩將誕生時\n>\n> 第四神變。「又，善男子！摩耶夫人一一毛孔，顯現如來過去所修菩薩行時，凡所受生，種種色相，種種形貌，種種威儀，種種資具、衣服、飲食、苦樂等事，一一明現，無不辨了；是為菩薩將誕生時\n>\n> 第五神變。「又，善男子！摩耶夫人身諸毛孔，一一皆現世尊過去修施行時，捨所難捨；身分、肢節、頭目、耳鼻、脣舌、牙齒、血肉、骨髓、肝膽、腸胃、皮膚、筋脈，及其妻妾、男女眷屬、宮殿、城邑，及諸珍寶：金銀、瑠璃、珂貝、璧玉、瓔珞、環珮、衣服、飲食，如是一切內外諸物；\n>\n> 亦見受者種種方處、形貌、言辭；是為菩薩將誕生時\n>\n> 第六神變。「又，善男子！時此林中，普現過去一切劫中所有諸佛入母胎時種種佛剎，種種園林，種種莊嚴，種種眷屬，及其種種幢幡、傘蓋、華鬘、衣服、塗香、末香、摩尼寶等，種種瓔珞諸莊嚴具，種種妓樂歌詠讚歎，上妙音聲遍滿林中，令諸眾生普得聞見；\n>\n> 是為菩薩將誕生時\n>\n> 第七神變。「又，善男子！摩耶夫人從其身中胎藏之內，出現菩薩應所受用摩尼寶王宮殿樓閣，超過一切天、龍、夜叉、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽及諸人王之所住處；摩尼王網羅覆其上，復以一切人天形像摩尼寶王諸莊嚴具校飾莊嚴，熏以無垢上妙香王，令諸眾生心得清淨。\n>\n> 如是一切遍滿林間，各各差別，不相雜亂；是為菩薩將誕生時\n>\n> 第八神變。「又，善男子！摩耶夫人從其腹中出十不可說不可說百千億那由他佛剎極微塵數菩薩摩訶薩，其諸菩薩身形、容貌、色相、光明、進止、威儀、神通、眷屬，一切皆與毘盧遮那菩薩等無有異，悉共同時讚歎如來；是為菩薩將誕生時\n>\n> 第九神變。「又，善男子！摩耶夫人將欲誕生菩薩之時，忽於其前，從金剛際出大蓮華，名一切寶王莊嚴藏，以無能勝金剛摩尼王寶為莖，以眾生影像海摩尼王寶為藏，一切上妙摩尼王寶而作其鬚，清淨無垢如意寶王以為其臺，有十佛剎極微塵數葉，一切皆以摩尼所成，周匝莊嚴，光輝間發；\n>\n> 摩尼寶王而為其網，周匝垂覆，堅固難壞；金剛寶王而為其蓋，以覆其上；一切天王所共執持；一切龍王起大香雲，降注香雨；一切諸天雨天妙華及諸嚴具；一切夜叉王恭敬圍遶；一切乾闥婆王出美妙音，歌讚菩薩往昔親近供養諸佛所有功德；一切阿脩羅王捨憍慢心，曲躬恭敬，合掌頂禮；\n>\n> 一切迦樓羅王銜寶繒帶，莊嚴虛空；一切緊那羅王發歡喜心，歌詠讚歎菩薩功德；一切摩睺羅伽王皆生歡喜，出大音聲歌詠讚歎，普雨一切寶莊嚴雲；是為菩薩將誕生時\n>\n> 第十神變。「善男子！我見摩耶夫人於此林中將誕菩薩，示現十種神通之相，不可思議種種功德，無量光明，心無厭足。摩耶夫人然後右脇而生世尊，如虛空中現淨日輪，如高山頂出於慶雲，如密雲中而耀電光，如夜闇中然大火炬；爾時菩薩從母脇生，身相光明亦復如是。\n>\n> 善男子！菩薩是時為欲顯示一切諸法如影、如像，如夢、如幻，無去、無來，無生、無滅，示現誕生。「善男子！我當見佛毘盧遮那於此四天下閻浮提內嵐毘尼園示現初生神變之時，亦見如來於三千大千世界百億四天下閻浮提中嵐毘尼園示現初生種種神變；\n>\n> 亦見於三千大千世界極微塵數佛剎，亦見於百佛世界極微塵數佛剎，乃至十方一切世界極微塵數佛剎，示現初生種種神變；亦見在於十方世界極微塵中，所有種種無量佛剎，一一皆現受生、誕生種種神變。如是念念盡未來際，普於十方一切法界所有剎海，一一塵中無量世界，示現初生種種神變，次第相續無有間斷。\n>\n> 雖念念中普遍一切無邊剎海，示現誕生種種神變，而心無著，無有障礙。」爾時，善財童子白妙德圓滿愛敬吉祥嵐毘尼園主林神言：「聖者！菩薩云何住最後身，要生於此大族姓中？」林神告言：「善男子！一切菩薩將成正覺，住最後身，皆生王宮或生大族婆羅門家。\n>\n> 何以故？為能成就種種利益，調伏自他令成熟故。善男子！能利自他有三種法：\n>\n> 一者、異熟因果；\n>\n> 二者、福德因果；\n>\n> 三者、智慧因果。云何異熟？謂有八種：\n>\n> 一者、壽量圓滿；\n>\n> 二者、色相圓滿；\n>\n> 三者、種族圓滿；四者、自在圓滿；五者，信言圓滿；六者、大勢圓滿；七者、丈夫相圓滿；八者、勇力圓滿。「善男子！云何菩薩壽命圓滿？所謂：壽命長遠，久住世間。云何菩薩色相圓滿？所謂：形色端嚴，相好殊勝，人所樂見，心無厭足。云何菩薩種族圓滿？\n>\n> 所謂：生於豪貴剎帝利種婆羅門家。云何菩薩自在圓滿？所謂：得大財位及大眷屬，所作隨心，人所宗奉。云何菩薩信言圓滿？所謂：出言誠諦，人必信受；理諸諍訟，心無高下；凡所決斷，如執權衡；言行無違，無求無諂。云何菩薩大勢圓滿？所謂：名稱高遠，勇猛精進，志性柔和，毀譽不動；\n>\n> 工巧藝業，無能過者；處大眾會，咸所尊重。云何菩薩丈夫相圓滿？所謂：具丈夫相，離諸殘缺。云何菩薩勇力圓滿？所謂：報力殊勝，身常無病，心力勇健，有勝堪能。如是八法，是為菩薩異熟圓滿。「善男子！菩薩云何修此八種異熟之因。所謂：菩薩於諸眾生起大慈愍，無殺害心，是為壽量圓滿之因。\n>\n> 若諸菩薩於佛菩薩形像之前及諸一切黑闇之處，施諸光明及施種種鮮潔衣服，是為色相圓滿之因。若諸菩薩處於種種部類之中，心常謙下，是為種族圓滿之因。若諸菩薩於諸貧匱、困厄眾生，隨心所欲而行給施，是為自在圓滿之因。若諸菩薩常修實語，和合語，柔軟語，不變異語，是為信言圓滿之因。\n>\n> 若諸菩薩為欲攝取未來世身，種種色相殊勝功德，發大誓願，供養三寶及善知識、父母、師長，心恒不捨，承事恭敬，無有斷絕，是為大勢圓滿之因。若諸菩薩心恒愛樂丈夫之身，於女人相常生厭棄，怖畏女色猶如猛火，於丈夫身生福德想，亦勸眾生厭離女身，欣丈夫相，是為丈夫圓滿之因。\n>\n> 若諸菩薩恒以身力供事眾生，如理作役皆往營助；於師長處按摩塗洗，及以種種上妙飲食施諸飢渴，咸令充飽，令其安樂，色力增盛，是為勇力圓滿之因。如是菩薩修習八種異熟之因，感異熟果。「善男子！如是八種異熟之因，復由三緣而得增長，能感圓滿、廣大、饒益、殊勝異熟。\n>\n> 云何為三？\n>\n> 一者、清淨心，\n>\n> 二者、清淨行，\n>\n> 三者、清淨境。若諸菩薩內心清淨，所有善根，悉用迴向阿耨多羅三藐三菩提，及證甚深一味法界，廣大信樂，純一無雜，勤求修習，不顧身命，與善知識同一志行，見同法者深生歡喜，日夜思惟，念念隨順，行、住、坐、臥，心無厭足，是為\n>\n> 第一發清淨心。若諸菩薩即於如是廣大志樂所起善根，長時修習，念念無間，方便善巧，皆使成就，未受行者令得受行，已受行者令其堅固，是為\n>\n> 第二行清淨行。若諸菩薩於彼一切所行境中令心清淨，能正發起令行調柔，如是趣求至究竟果，是為\n>\n> 第三趣清淨境。「善男子！云何菩薩異熟果耶？謂由菩薩壽量具足故，能得長時無間修習，所有善根積集增長，能久住世自利利他，是為壽命圓滿之果。又由菩薩色相端嚴，眾生愛敬故，一切大眾咸來歸仰，凡所發言無不樂聞，既聞法已，皆悉順行，是為色相圓滿之果。\n>\n> 又由菩薩種族真正故，世所宗重，令諸眾生隨順菩薩所有言教，精勤修習，速疾捨離諸不善業，修諸善業，是為種族圓滿之果。又由菩薩自在圓滿具足財位故，能以種種珍寶、僕使給施群生，隨其所須咸令充足；以此攝取，然後調伏而成熟之，是為自在圓滿之果。\n>\n> 又由菩薩成就實語故，能以愛語攝諸眾生，調伏成熟，令其信受，皆得解脫，是為信言圓滿之果。又由菩薩豪貴自在，有大勢力故，能令眾生感德從化，心生慚愧，尊重愛樂，凡所出言，隨順不逆，是為大勢圓滿之果。又由菩薩具足圓滿大丈夫相，諸根成就，無有殘缺，是故堪為勝功德器，精進勤求一切智境；\n>\n> 得無所畏無障礙行，能大饒益一切眾生；所作隨心，皆無障礙；一切世間諸天及人，無能譏毀；是為具足大丈夫相圓滿之果。又由菩薩成就勇力故，普能積集一切善法，安樂成就諸眾生界，勇猛精進，成就智通，是為勇力圓滿之果。如是名為異熟因果。\n>\n> 云何福智？謂：施、戒、忍三波羅蜜名之為福；般若波羅蜜名之為智；精進、禪定亦名為福，亦名為智。謂：因精進修施、戒、忍，慈無量等，則名為福，若因精進起聞、思、修，則名為智。又因精進修蘊善巧，處善巧，界善巧，緣起善巧，處非處善巧，能知四諦善不善法，煩惱勝劣，黑白諸業，微細觀察，皆名為智。\n>\n> 若因禪定修四無量，是名為福；若因禪定修行般若及諸善巧，則名為智。是故，菩薩能大饒益一切眾生，於諸佛剎大眾會中而為師首，普能隨順一切諸佛轉正法輪；能自調伏，亦能調伏一切眾生，令其速入一切智道。菩薩成就如是種種殊勝因果，即能疾得阿耨多羅三藐三菩提。\n>\n> 」大方廣佛華嚴經卷\n>\n> 第二十六大方廣佛華嚴經大方廣佛華嚴經卷\n>\n> 第二十七罽賓國三藏般若奉詔譯入不思議解脫境界普賢行願品爾時，善財童子白林神言：「聖者！得此解脫，其已久如？」林神告言：「善男子！乃往古世，過億佛剎極微塵數劫，復倍是數，時有世界，名普寶，劫名悅樂；八十億那由他佛於中出現，其\n>\n> 第一佛，名自在功德無能勝幢，十號具足。彼世界中有四天下，名種種莊嚴光閻浮提，中有一王都，名清淨莊嚴須彌幢，其中有王，名寶光焰眼；時，彼大王\n>\n> 第一夫人，名大焰自在歡喜光，如此世界閻浮提中摩耶夫人為毘盧遮那如來之母，彼種種莊嚴光世界閻浮提中，大焰自在歡喜光夫人為彼最初自在功德無能勝幢如來之母，亦復如是。「善男子！時，喜光夫人將欲誕生彼菩薩時，與二十億那由他采女前後圍遶，詣圓滿廣大金華園中，示現種種不可思議菩薩受生神通變化。\n>\n> 時，彼園中有一樓閣名清淨妙寶峯，有大樹王，名一切施。時，彼夫人即以右手攀彼樹枝，於其右脇誕彼菩薩，諸天捧持，香水沐浴，一切世主廣陳供養。時，有乳母，名無垢光，侍立其側；於是諸天授與乳母，乳母敬受，以手抱持，生大歡喜，即得菩薩普眼境界三昧。\n>\n> 得此三昧故，普見十方一切世界無量諸佛，復得此一切自在受生解脫法門。善男子！如初受胎識，速疾無礙，得此三昧故，速疾能見十方諸佛，乘本願力受生神變，亦復如是。「善男子！於意云何？彼時乳母無垢光者，豈異人乎？我身是也！時，二十億那由他采女者，今此林中我之眷屬，二十億那由他諸林神女是；\n>\n> 彼時夫人大焰自在歡喜光者，今摩耶夫人是；時，彼大王寶光焰眼者，今淨飯王是。善男子！我從是來，於念念中，常見毘盧遮那菩薩自在受生大神變海。善男子！如見世尊毘盧遮那，念念於此娑婆世界及此世界一一塵中，乘本願力自在受生神變海門；\n>\n> 亦見世尊普於十方一切剎海，所有世界及彼塵中示現受生自在神變，如見現在；亦見如來盡未來際，十方世界及彼世界一一塵中，示現受生自在神變。善男子！如見今佛毘盧遮那普遍受生自在神變；亦見十方一切諸佛各乘本願，遍一切處，盡前後際，所有世界及彼世界所有塵中一切世界，示現受生自在神變；\n>\n> 皆得親近、承事、供養及聞諸佛所轉法輪，皆能受持隨順悟入。」爾時，妙德林神欲重宣此解脫門義，承佛威力，觀察十方，而說偈言：「善哉佛子汝所問，最勝難知諸佛境，深生尊重信樂心，我說此因應諦聽。億剎塵劫復倍是，過彼有劫名悅樂，八十億數那由他，諸佛於中相續現。\n>\n> 最初有佛出興世，號自在德無勝幢，時我在彼金華園，見彼如來誕生相。彼時我身為乳母，名無垢焰而供侍，諸天授我菩薩身，金色光明勝無比。我時受得天人師，捧持諦觀不見頂，左右身量無邊際，諸相圓滿叵思議。見彼離垢清淨身，相好莊嚴甚微妙，猶如妙寶真金像，歡喜自慶發淨心。\n>\n> 思惟彼佛諸功德，增長無量深福海，見佛神通無與等，即發廣大菩提心。專求一切佛功德，增長一切諸大願，嚴淨一切微塵剎，滅除一切險惡道。普於十方一切國，供養諸佛無央數，為求解脫遍修行，願滅一切眾生苦。我聞彼法能受持，獲此難思解脫力，億剎塵數無邊劫，具修菩薩清淨行。\n>\n> 劫中次第所興佛，一一我皆曾供養，受持其法備修行，莊嚴淨此解脫海。億剎塵數剎塵劫，過去所有十力尊，盡持其法亦修行，此解脫輪轉清淨。我於一念皆能了，一切佛剎極微中，所有一切諸如來，各各莊嚴諸剎海。彼諸剎海所有佛，園中示現初誕生，念念所現難思議，廣大自在神通力。\n>\n> 我見億剎諸菩薩，專求最勝佛菩提，將成正覺住天宮，顯現難思諸佛境。或見無邊剎海中，諸佛受生神變事，一切眾會共圍遶，廣說正法令開悟。我於一念能普見，億剎塵數諸菩薩，出家降魔坐道場，示現種種佛境界。或見一切剎塵中，無量仁尊成正覺，各現難思方便力，度脫一切苦眾生。\n>\n> 或見一切極微內，諸佛皆轉妙法輪，悉以無盡微妙音，普雨無邊甘露法。於念念中見一切，億剎塵數諸佛剎，悉有如來現受生，及現涅槃無所著。如是無量佛剎海，如來於彼現初生，我皆普往不分身，一一現前興供養。不思議剎諸界趣，無邊品類諸眾生，悉以方便現其前，雨大法雨令開悟。\n>\n> 佛子我悉能知此，最勝難思解脫門，設於無量億劫中，開示稱揚不能盡。「善男子！我唯知此菩薩於無量劫遍一切處示現受生自在神變解脫法門；如諸菩薩摩訶薩能以一念為一切劫發生之藏，開顯證悟諸法本性，以善方便普現受生，願常供養一切諸佛，精勤究竟佛法現前，諸趣受身如影普現，一切佛所坐蓮華座，隨應化度成熟眾生，普於世間現大神變，圓滿大智通達無礙，於諸三昧皆得自在，示成正覺轉妙法輪，證入甚深無礙法界，了知一切眾生心性，開示一切功德之相，發起廣大心自在力，獲得一切降魔怨智，順入一切如來境界，隨諸眾生普現色身；\n>\n> 如是菩薩智功德行，而我云何能知、能說？善男子！從此西南迦毘羅城，有釋種女，名曰瞿波，汝詣彼問菩薩云何於生死中成熟眾生，行菩薩行。」爾時，善財童子頂禮右遶嵐毘尼神，經無數匝，慇懃瞻仰，戀慕一心，辭退而去。爾時，善財童子從嵐毘尼林向迦毘羅城，思惟觀察彼神所，得諸佛受生自在神變菩薩解脫，思惟修習，增長廣大，隨順悟入，憶持不忘。\n>\n> 漸次行詣菩薩集會普現法界影像光明宮殿。其中有一主宮殿神，名無憂德，與一萬主宮殿神來迎善財；作如是言：「善來丈夫！有大智慧，勇猛無畏，能修菩薩不可思議受生神變自在解脫，心恒不捨廣大誓願，善能觀察諸法境界，心常安住無上法城，入於清淨妙法宮殿，開示無量善巧方便，調伏眾生令其悟入，成就如來功德大海，得佛無盡微妙辯才，無礙智輪隨眾生轉，令其歡喜增長大願，迴向趣求一切智道。\n>\n> 我觀仁者於甚深行心無暫捨，威儀寂靜，無諸垢濁，不久當得如來無上清淨最勝身、語、意業，以諸相好莊嚴其身，十力智光瑩其心地，遊行世間作大光耀；我觀仁者勇猛精進，難可沮壞，不久當得普見三世一切諸佛相好圓滿，普聞諸佛所轉法輪，普能受用一切菩薩禪定解脫諸三昧樂，隨順證入如來境界。\n>\n> 何以故？由汝已能見善知識，親近承事，恭敬供養，隨其教命，念其功德，修行不斷，無憂無惱，不懈不退，無有障礙，一切世間天人魔梵不能為難，不久當成無上菩提，亦令眾生證佛果故。」時，善財童子聞是語已，白言：「聖者！如向所說種種功德，願我一切悉當具得。\n>\n> 聖者！我願永息眾生諸煩惱熱，滅除眾生諸不善業，與諸眾生無上安樂，令諸眾生修清淨行。聖者！一切眾生心常散亂，起於煩惱，造諸惡業，隨業流轉，墮惡趣中，身心長夜受諸楚毒，菩薩見之，心生憂惱。聖者！譬如有人唯有一子，愛念情至，忽見被人割截肢體，其心痛切不能自安；\n>\n> 菩薩摩訶薩亦復如是，見諸眾生集不善業，墮三惡趣，受種種苦，心大憂惱，不能自安；若見眾生起身、語、意三種善行，生於善道，受身心樂，生大歡喜。何以故？菩薩不為利益自身求一切智，亦不為貪種種生死諸安樂故，亦不為貪五欲樂故，亦復不為專求欲界眷屬愛敬莊嚴樂故，亦復不隨想倒、心倒、見倒諸結隨眠愛見力轉，於諸眾生恩愛縛著心無貪戀，亦不味著諸禪定樂，亦無種種障礙厭退，住於生死流轉沈溺；\n>\n> 菩薩但見一切眾生於有海中具受無邊諸苦逼迫，起大悲心，願皆攝取，令其速出生死大海，以悲願力勤行種種難行苦行，普斷一切眾生煩惱，令其出離，永無退轉；是故，精勤求於如來一切智智，承事供養一切諸佛；見諸雜染不淨剎土，為其嚴淨諸佛剎海；\n>\n> 見諸眾生種種名相皆無真實，令其皆得清淨法身；見諸眾生身心雜染，令得清淨莊嚴三業；見諸眾生心行不具，令其皆得清淨具足。「聖者！菩薩如是於諸眾生大悲深厚，能行一切難行苦行，經無邊劫，心不疲厭，一切所行，皆得成就。猶如父母，亦如乳母，如地、如水、如火、如風、如太虛空、如日、如月、亦如大海、如同生天，能生種種圓滿利益。\n>\n> 云何菩薩猶如父母？為其安立菩提心故。云何菩薩猶如乳母？令其成就菩薩道故。「云何菩薩猶如大地？譬如大地有十種事，何等為十？所謂：猶如大地廣大無量，普遍成就一切事物；菩薩摩訶薩亦復如是，成就無量廣大福智功德之聚。又如大地能生世間種種資具，一切眾生依之存活；\n>\n> 菩薩摩訶薩亦復如是，能生出世功德財寶，所謂：布施、持戒、忍辱、精進、禪定、智慧、菩提分等妙法資具，養育眾生功德慧命。又如大地平等饒益，無憂無喜，無分別想；菩薩摩訶薩亦復如是，於怨親所，都無愛憎，不生二想。又如大地能受大雲所注之雨；\n>\n> 菩薩摩訶薩亦復如是，能受如來大法雲雨。又如大地，一切眾生依之而住；菩薩摩訶薩亦復如是，與諸眾生世、出世間種種樂事而為依止。又如大地，一切種子依之而生；菩薩摩訶薩亦復如是，一切眾生善法種子依之生長。又如大地能生眾寶及諸寶器；\n>\n> 菩薩摩訶薩亦復如是，能生眾生種種法器諸功德寶。又如大地能生眾藥滅除諸病，菩薩摩訶薩亦復如是；依大慈悲出生法藥，滅除種種煩惱重病。又如大地，諸惡毒蟲腹行之類，種種觸惱，安住不動；菩薩摩訶薩亦復如是，恒被一切內外諸苦觸惱身心，終無搖動。\n>\n> 又如大地，大雷龍吼種種惡聲，不驚不懼，亦無聞想；菩薩摩訶薩亦復如是，諸魔外道種種惡聲，不驚不恐，無憂無怖，亦無聞想。善男子！是為菩薩具足圓滿十種功德，猶如大地，自在成就。「善男子！云何菩薩猶如於水？譬如水大能令一切藥草、叢林及大樹王生成增長；\n>\n> 菩薩摩訶薩亦復如是，以三昧水出生一切菩提分法種種藥草，增長福德智慧大樹，成就無上菩提之果。云何菩薩猶如於火？譬如火大能燒一切不淨之物，及能焚爇大地所有草木稠林；菩薩摩訶薩亦復如是，能以種種大智慧火，燒諸眾生所有煩惱、隨眠習氣、不淨罪垢。\n>\n> 云何菩薩猶如於風？譬如風大無有色相，亦無住處，無依無著而能成就世界所有水、陸、空行一切宮殿及須彌等大小諸山，而一切人皆不能見；菩薩摩訶薩亦復如是，於一切處無所依著而能成就蘊、界、處等菩薩功德，一切世間聲聞、緣覺所不能見。\n>\n> 云何菩薩猶如虛空？譬如虛空體無障礙，一切諸法依之成就；菩薩摩訶薩亦復如是，本性無礙，一切白法因之成就。云何如月？譬如月輪從初一日至十五日漸次增長乃至圓滿；菩薩摩訶薩亦復如是，從初發心，一切淨法漸漸增長，乃至成佛坐菩提場，一切功德具足圓滿。\n>\n> 云何如日？譬如日輪出現之時，一切黑闇悉皆除滅；菩薩智日亦復如是，顯現之時，一切眾生無明黑闇悉皆除滅。云何如海？譬如大海，性能出生一切眾寶，令諸眾生受用無盡；菩薩摩訶薩亦復如是，從福智海出生一切功德智寶，饒益眾生，終無有盡。\n>\n> 云何如同生天？譬如二天與人同生，隨逐於人，如影隨形不相捨離；菩薩摩訶薩亦復如是，常隨眾生，乃至惡道、嶮難之處，守護隨逐不令墮落。「又，善男子！菩薩摩訶薩於諸眾生為大船師，令其得度生死海故；為歸依處，令離諸魔煩惱怖故；為所恃怙，令除熱惱得清涼故；\n>\n> 為大津濟，引諸眾生入法海故；為海導師，令至諸佛法寶洲故；為淨蓮華，開敷諸佛功德心故；為莊嚴具，福智光明恒莊嚴故；為可愛樂，令成普賢清淨三業悉端嚴故；為堪尊重，令勤捨離諸惡業故；為普賢行，令成微妙圓滿體故；為所樂見，令隨所樂無不現故；\n>\n> 為大光明，普放智慧光明焰故；為大明燈，照種種法咸通達故；為能照耀，令菩提心性明淨故；為大勇將，摧滅一切諸魔業故；為日珠寶，能放智焰光明網故；為月愛珠，放遍法界清涼光故；為大雲雨，能雨一切甘露法故。聖者！菩薩如是修諸行時，令諸眾生皆生愛敬，具足成就真實法樂。\n>\n> 」爾時，無憂德神與其眷屬一萬神俱，於其路側，聞善財童子自說所發菩提心相，得未曾有，踊躍歡喜；即以一切出過諸天上妙華鬘、塗香、末香、寶莊嚴具，散善財上，隨順圍遶，入菩薩宮殿，而說偈言：「汝為諸眾生，發心求正覺，當於無盡劫，為世大明燈。\n>\n> 無量億劫中，難可得見汝，大智日今出，照明於世間。汝見諸眾生，無明闇所覆，能發大悲心，履踐無師道。汝以清淨心，專求佛功德，能事善知識，不顧於身命。汝心於世間，無依無所著，決定恒無垢，清淨如虛空。汝修勝智行，轉妙功德輪，放大智慧光，普照無邊際。\n>\n> 汝不離世間，不著於世間，如風遊虛空，所行無障礙。汝向菩提行，勇進難屈伏，如劫火熾然，一切無能滅。無畏猶師子，堅固如金剛，汝智行亦然，一切無能動。十方法界中，所有諸佛法，汝事善知識，一切皆能入。」爾時，無憂德神以此妙偈稱讚善財功德行已；\n>\n> 樂聞正法，隨逐善財如影隨形，不相捨離。爾時，善財童子入普現法界影像光明宮殿，周遍觀察釋女瞿波；見在堂內，一切菩薩大集會中，坐於普現一切宮殿影像摩尼寶王大蓮華藏師子之座，八萬四千采女眷屬之所圍遶。是諸采女莫不皆從釋種中生，悉於過去修菩薩行，同種菩薩一切善根，布施、愛語、利行、同事攝諸群品；\n>\n> 一切智境常現在前，已集種種佛菩提行，恒住平等無盡大悲，普攝眾生猶如一子，慈心滿足，廣大清淨，普能隨順一切眾生，曾於過去修集種種不可思議善巧方便；皆於阿耨多羅三藐三菩提得不退轉，深入菩薩諸波羅蜜，具修菩薩一切學處，心常遠離妄想執著，厭離生死，愛樂正法，雖行諸有，心常清淨，恒勤觀察一味法界，速疾趣求薩婆若道，離諸蓋網，超眾患難，得淨法身，化現無量，調伏成熟一切世間，成就甚深功德大海，從普賢行之所出生，速疾增長勇健大力，智燈慧日圓滿普照。\n>\n> 爾時，善財童子即前頂\n\n## 二、三译四件套对读（语料库·程序汇编）\n\n> 语料库行口径：到会（到达·顶礼·请法）／法门自陈／指授（转介后参）／辞退。引文各照底本；本表为程序抽取节引（句界截断），全文见各参经文。\n\n### 2.1 八十／四十（`T10n0279` ／ `T10n0293`）\n\n| 件 | 八十 原文（节引·逾 260 字句界截断） |\n|---|---|\n| 指授（→后参） | 汝詣彼問：菩薩云何修菩薩行、生如來家、為世光明，盡未來劫而無厭倦？ |\n| 辞退 | 禮其足，遶無量匝，合掌瞻仰，辭退 |\n\n### 2.2 六十／四十（`T09n0278` ／ `T10n0293`）\n\n| 件 | 六十 原文（节引·逾 260 字句界截断） |\n|---|---|\n| 到会 | 至佛地藏受生法？此菩薩摩訶薩悉於三世諸如來所，受灌頂法，一切世界境界無障礙，菩薩悉知 |\n| 到会 | 詣十方佛所 |\n| 指授（→后参） | 汝詣彼問云何菩薩行菩薩行？生如來家？為世間燈？盡未來劫，修菩薩行，心無疲倦？ |\n| 辞退 | 禮彼夜天足，遶畢辭退 |\n\n## 三、古注取窗（疏·钞·论·探玄记·程序取窗照录）\n\n**澄观《华严经疏》`T1735`（八十·寄位释）**（锚「妙德圓滿」·PDF/册页 1346 · 385 字·程序取窗·句界截断·引前须对原书核）：\n\n> 妙德圓滿者。\n善慧無缺故。然此園在迦毘羅城東二十里。是摩耶生佛之處。又從九\n地當得受職。是故今問生如來家\n(已下入第七十四經)\n。\n唐清涼山大華嚴寺沙門澄觀撰\n第九嵐毘尼林神寄善慧地。初二可知。第三彼神答下授已法界。於中\n四。一顯法義。二立法名。三明業用。四辨根本。初中二。先⻑行後\n偈頌。前中四。一標數歎勝。二徵數列名。三依名釋義。四結歎勝\n益。初中生如來家。即正酬其問。第二何等為十下徵數列名。此十通\n於六位。一當十信。二即十住。三通行向。四是初地。五從二至七。\n以是功用邊故。六七皆八地。然六即自分。七即勝進得勸之後。八即\n九地。九當十地。十即等覺入如來地。然依行布豎配定。然若約圓\n融。初後通用故云成就。此法則生如來家。若定須具十方得生家。何\n以文中。第二第六皆有生家。第十復言於三世佛所已受灌頂。故知須\n豎約證分異。若定豎者。則違具十則生之言。是知須橫約圓融修觀。\n第三善男子云何名下依名釋義。一中即信發心故。賢首品云。常欲利\n樂諸群生。莊嚴國土供養佛故。故文云始集善根。二中初住發心。文\n具三心。生如來家亦初住生家。\n\n**澄观《随疏演义钞》`T1736`（八十·钞于末会多总谈，部分参为类聚引）**（锚「嵐毘尼」·PDF/册页 2325 · 381 字·程序取窗·句界截断·引前须对原书核）：\n\n> 嵐毘尼林神寄善慧地者。謂\n成就微妙四無礙辯。能遍十方善說法故。疏此十通於六位下。疏文有\n五。一約位竪配亦名行布釋。二然依行布下結前生後生後圓融。三若\n約圓融下通諸位釋亦名圓融釋。四若定須具十下結成上竪五若定竪下\n\n結成須橫。實則橫竪無礙是此中意故存二釋文義昭然。疏亦初住生家\n者。恐人誤為初地生家。然其生家略有六位。一初住生菩提心家。二\n四住生聖教家。三初地生真如家。四四地約寄位生出世家。五八地生\n無生法忍家。六如來地究竟生家。今是初住即第一生菩提心家。疏即\n淨心地者。疏隨難釋今更委釋。言得如來菩提光者。明心菩提故入菩\n薩方便海者。證真了俗故捨諸有趣。亦由已斷異生性故。成就自在者\n分身百剎故。修菩薩殊勝行者。淨治地法十行常修故。具菩薩根者。\n由證信故餘皆成根。又大悲為首故悲為根。已斷所知故心明潔十願成\n熟故願不動。同佛證如故得佛護。分別頓盡名壞諸障具上諸德為物依\n處。疏戒忍進等者。等取禪慧各一增故。末後二句上句三業善巧見者\n必欣下句。功用行滿。又以無功得諸行故。\n\n**李通玄《新华严经论》`T1739`（八十）**（锚「妙德圓滿」·PDF/册页 941 · 385 字·程序取窗·句界截断·引前须对原书核）：\n\n> 妙德圓滿者。明善慧地妙慧圓\n滿故。神者以悲智善能說教為神。\n第一正入當位法中。⻑科為十段。一爾時善財童子已下。至增⻑菩薩\n大功德海有六行經。明善財往見善知識分。二善財見已已下至為世大\n明有三行經。明善財見善知識申請所求分。三彼神答言已下至十者入\n\n如來地受生藏有十二行半經。明正受善財十種受生藏分。四善男子云\n何名願常供養一切佛受生藏已下至是為菩薩第十種受生藏十種受生\n藏。自有十段文分。五從佛子若菩薩摩訶薩於此十法修習增⻑已下至\n頌有十二行經。明勸修得益分。次下有二十行頌。重頌前法。歎受生\n法門。六善男子菩薩具此十法生如來家已下至自在受生解脫門有兩行\n半經。明神自申得法久遠分。七善財白言聖者此解脫門境界云何已下\n至頌此一段答前善財所問受生境界。八有二十三行頌。重頌前法。九\n善男子我唯知此菩薩於無量劫遍一切處示現受生自在解脫已下。明推\n德昇進。十隨文釋義者。此之菩薩得無生忍獲無功智。創始現前令使\n昇進。九地學佛說法辯才門。令使滿足天之及人一切眾生意名為受生\n藏。\n\n**法藏《探玄记》`T1733`（六十·残存）**（锚「妙德圓滿」·PDF/册页 1177 · 388 字·程序取窗·二遍扫（类聚引）·句界截断·引前须对原书核）：\n\n> 妙德圓滿\n林天者謂善妙之德內備。發願守護此林故以為名也。天竺本云有留彌\n尼天女。名妙圓光勝愛樂也。三教問中以是生佛處故教問生佛家等。\n\n第二依教趣入中亦三。一敬辭。二念法。三至林推覓。\n第三見坐下明見敬申請中。初見。二敬。三請可知。\n第四答言下授己法界。於中作五門分別。一顯法義。二立法名。三明\n業用。四辨法根五結自分。初中二。⻑行與頌。⻑行中有四。初總標\n歎德。二列十名。三釋十義。四結歎益。初中三。先總歎能行生如來\n家。二於念念下別顯修法成行。三具足下明行成趣果。二列十名者有\n諸德釋將配十地。一一別釋。今就通釋。一供佛願。二覺心支者依菩\n提心出生餘行名支也。三觀寂滅。四淨直心。五智普照。六生佛家。\n七佛光力。八達佛智。九嚴法界。十懃至佛。由行此十行令諸菩薩得\n生佛家故也。三提名別釋中。十種即為十段。一一各三。謂標釋結。\n初可知。二中有十種菩提心。皆有標名釋義。支者差別義有十種故。\n又是因義為餘行本故。三中有九種心。與前十心何別者。前是行本\n心。此是現行心故生佛家也。四中亦以十句釋成直心。謂正直趣法堅\n心不動故生佛家也。\n\n## 四、评注与延伸指针（只指不代·不生成无据内容）\n\n- **古注诸家**：本参取窗见 §三；更完整释文见主页 §6.2 李通玄《新华严经论》窗、§五之B 计数诸说辨析；澄观《华严经疏》总纲见主页 §2.0′。\n- **今人讲记**：海云继梦《华藏妙海》对读见主页 §6.2（〔OCR 待校〕）；九九华严讲记线见〈海云法师·九九华严讲记校勘工作台〉。\n- **平行线**：藏译 Toh 44 对应章见主页「藏译对读窗」；〈五十三参行历〉交互图可按身份/篇幅回看全程。\n\n> <span class=\"en-line\">**EN corresponding · Visit 40 — 妙威德圓滿愛敬 (forest deva).** A forest deva at 嵐毘尼林; self-declared gateway: \"The liberation of the psychic transformation of freely manifesting birth everywhere over immeasurable kalpas\" 〔编者试译〕. Stage II — the Fifty Teachers (the pilgrimage through good counselors). Three-translation parallels: 40-fascicle `T10n0293` (base), 80 `T10n0279`, 60 `T09n0278` — see §二; classical commentary windows: Chengguan's *Huayan jing shu* `T1735` and Li Tongxuan's *Xin Huayan jing lun* `T1739` — see §三.</span>\n\n## 五、台账\n\n- L.493（2026-11-17）：古注取窗入 §三（疏/论 54/54 全覆盖·探玄记入法界品疏残存仅 13/54·未及者如实留空）；程序取窗·NFKC 归一·单调锚定·字准待校。\n- L.499（2026-11-17）：第四源《随疏演义钞》`T1736` 入 §三（40/54·钞于末会多总谈，部分窗为类聚引·已于源标签注明）。\n- L.507（2026-11-18）：二遍扫恢复——钞 52/54→**54/54**·探玄记 13→**46/54**（pass2 类聚引已标）；仍 miss 8 处为探玄记未及之参（5/15/16/22/26/33/35/49·残存上限）。\n- L.491（2026-11-16）：子页建立——程序汇编（主页 §参40 照录＋行历数据卡＋四件套语料）；内容源批次 L.289–L.304（参批1-16）·L.316（参33 补卡）·L.407/L.413/L.415（行历·三译师名）·L.421/L.456（四件套语料库）。\n- 主页各参节后续修订后重跑 build 即自动同步本页 §一（运行时组装·无中间文件）。\n", "data_source": null, "data_pool": null, "back": {"tab": "gap", "view": "avatamsaka-studies", "label": "文献页 · 华严经学"}, "updated_at": "2026-11-16"};

// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}

}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}
