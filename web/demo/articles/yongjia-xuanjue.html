<script>
var ARTICLE = {"id": "yongjia-xuanjue", "file": "articles/yongjia-xuanjue.html", "title": "永嘉玄觉大师", "title_sub": "综合深度研究（全文）", "icon": "🧘", "version": "七章·台禅交涉·作者真伪公案·千年多语译介史", "meta": "**定位**：本系列第一位主要归属禅宗（兼跨天台）的深度人物研究——著力于\n天台止观与曹溪顿悟之间的「双重师承」结构，以及《证道歌》这一「禅林四大文字」\n之一的作品作者真伪公案。\n**方法**：多语学界穷尽（中／日／英／韩）＋信源分级（CBETA 原典逐字对勘，兼取\n学界一二手研究）＋佛门内外双重视角（天台「夺他成己」批判 vs 禅门「一宿觉」传奇）。\n**立场**：作者公案不预设立场、存疑并陈（陈盛港「神会说」／贾晋华「洪州宗起源说」）；\n天台祖位异说（玄朗八祖、《宋高僧传》「传法号五祖」异文）如实胪列；各出版信息经考订订正。\n**看点**：从义《法华经三大部补注》卷十一「夺他成己」原文（并附其对澄观、宗密的批评）·《宋高僧传》\n「至若神秀门庭，遐征问法」·曹溪四句问答用字校勘·《维摩经》/《涅槃经》开悟两说并存·\n天台祖统序列·Red Pine 2019 与 BDK 2021 译本订正·铃木→陆宽昱→红松→蒲慕伦百年英译流变·\n宋行靖/明传灯/高丽己和历代注疏。\n", "doc": "docs/祖师人物/永嘉玄觉大师_综合深度研究.md", "doc_md": "# 永嘉玄觉大师：生平、思想、传承与文化史地位综合深度研究\n\n> 研究说明：本文延续《圭峰宗密》《华严宗初祖杜顺》《华严宗二祖智俨》《李通玄长者》四篇综合深度研究的方法论与结构，依据可回溯、可核验的资料展开，对史料分歧或学界争议之处以\"存疑\"标出。永嘉玄觉是本系列研究第一位主要归属禅宗（兼跨天台宗）、而非华严宗的人物，其代表作《永嘉证道歌》更是整个汉传佛教文献中翻译语种最多、在西方世界传播最广的作品之一。本文按您的要求，力求尽可能穷尽中、日、英、韩等各语学界，以及佛门内部、跨宗派、当代通俗讲习等多个维度的参考资料；惟经检索，法语、越南语等学界的相关专题成果，笔者未能寻得可供直接征引的具体文献，故本文未能涵盖，特此说明这一检索局限，不作勉强凑数的罗列。\n\n---\n\n## 前言\n\n在整个汉传佛教的文献谱系中，很少有作品能像《永嘉证道歌》这样，同时占据\"禅林四大文字\"（与《信心铭》《参同契》《宝镜三昧》并称）之列、又历经十四个世纪持续被译介为多种语言——本文经检索确认者，至少包括英语世界近一个世纪以来至少七、八位译者各自独立完成的译本（详见第一章1.3节），以及在日本、朝鲜半岛禅宗传统中的持续诵习（详见第六章6.3节，惟其具体译介、注疏情况尚待专题研究澄清）——并在二十世纪中叶\"垮掉的一代\"（Beat Generation）与西方\"禅热\"（Zen boom）浪潮中，成为许多西方读者认识汉传禅法的最初读本之一。这篇仅一千八百余字的古体乐府长诗，其作者永嘉玄觉（665—713），本人的生命历程同样极具张力——他自幼精研天台止观，几乎无师自证心地，却在挚友激励下星夜奔赴曹溪，与六祖惠能一番电光石火的问答后，\"一宿\"之间即获印证，随即翩然离去，终身未再返回禅门法席，反而回到故乡温州，继续以其深厚的天台学养弘传教法，直至留下《永嘉集》与《证道歌》这两部分别代表\"渐次止观\"与\"顿悟证道\"两种表达方式、却同样源自同一位作者的传世之作。本文即尝试对永嘉玄觉其人、其学、其在天台与禅宗两大传统之间的独特位置，以及《证道歌》本身聚讼纷纭的作者真伪公案，作一次尽可能全面、审慎、且力求穷尽多语学界成果的深度研究。\n\n---\n\n## 一、全球多语言背景下的学术研究成果\n\n### 1.1 中文学界\n\n中文学界对永嘉玄觉的研究，传统上多依附于禅宗史、天台宗史的通论性著作之中，但近数十年来也出现了若干具有独立分量的专题成果。**其中份量最重、方法论也最为严谨的，当推陈盛港（澳大利亚昆士兰大学亚洲语言文化博士班研究）发表于《中华佛学研究》第五期（2001年3月，台北：中华佛学研究所，页163—203）的长篇论文〈永嘉证道歌原作者溯源并歌文比较〉。**此文透过极为细密的文献学考证——包括对《证道歌》歌文本身所涉及的\"西天二十八祖\"传承说法形成年代、中土禅宗\"六代祖师\"传承说法形成年代、以及\"曹溪\"一词作为惠能代称的最早使用年代等多重时间线索的交叉比对——论证这些说法均形成于玄觉身后二、三十年，从而对\"永嘉玄觉即为《证道歌》原作者\"这一传统归属提出了系统性的质疑，并进一步提出神会和尚是更有可能的原作者人选（详见第四章4.3节的详细展开）。\n\n此外，王雷泉教授（复旦大学哲学学院宗教研究所）所撰〈《禅宗永嘉集》提要〉，原载陈士强、王雷泉主编《中国佛教百科全书》（复旦大学出版社，1997），网络再现于\"爱思想\"学术平台（[aisixiang.com/data/155147.html](https://www.aisixiang.com/data/155147.html)），对《永嘉集》十门结构及其止观义理作了精要而清晰的疏解，是理解该书教理内容的重要现代导读文献；其提要并确认：玄觉俗姓戴、字明道、八岁出家，唐僖宗赐谥\"无相大师\"，清雍正又敕封\"洞明妙智禅师\"，又径以\"天台宗八祖\"称左溪玄朗——与本文第三章3.1节对玄朗祖位序数的考订一致。**在通俗讲习层面，现代著名学者、居士南怀瑾对《证道歌》推崇备至，曾明言\"全部佛法都包括在里面\"，并在其各类讲述佛法的场合反复援引、复述\"一宿觉\"的公案本身，对该文本在现代华人社会的通俗传播贡献甚巨。**当代僧人常空（俗姓孔，1968年生，山东曲阜人，1993年于四川依果忍法师披剃出家，现任河南濮阳佛教协会名誉会长、佛法导师）所撰《月映千江：永嘉大师证道歌讲记》（上海古籍出版社\"佛典新读\"丛书，2018年8月初版、2020年精装改版，凡二十五讲），则代表了当代僧团内部对这一经典持续进行通俗诠释、普及讲授的具体成果，显示《证道歌》至今仍是两岸佛教界案头常备的重要读物。\n\n### 1.2 日文学界\n\n**关于日文学界对永嘉玄觉的专题研究，本文经检索仅能确认《证道歌》日文称为\"証道歌\"（Shōdōka），在日本禅宗（曹洞宗、临济宗）传统中地位崇高、诵习不辍，但笔者未能寻得如中文陈盛港、英文吉娜·贾（Jinhua Jia）那样具有明确署名与出版信息、可供直接征引的日文专题学术论文或专著，此处如实存疑说明，不作勉强的具体篇目罗列，以免向读者提供无法回溯查证的虚假线索。**这一检索局限本身也从侧面说明，尽管永嘉玄觉的文本在日本禅门实践层面影响深远，其作为\"专题研究对象\"在日本学院体制内是否已形成如镰田茂雄之于华严宗那样的系统性权威研究传统，仍有待读者自行透过日文数据库（如CiNii、J-STAGE）作进一步查证。\n\n### 1.3 英语学界\n\n英语学界对《证道歌》的译介史，本身就是一部长达近一个世纪、参与者众多、版本迭代不断的\"接受史\"，其丰富程度在本系列此前研究的所有人物中首屈一指。**最早、也最具历史影响力的英译本出自铃木大拙（D. T. Suzuki）1935年出版的《禅佛教手册》（*Manual of Zen Buddhism*），铃木将原本直译应为\"证悟道之歌\"（Song Attesting/Confirming the Way）的标题译为\"Song of Enlightenment\"（觉悟之歌）——这一译名此后长期成为英语世界最通行的标题，尽管原文标题中的\"覺\"字本身其实并未出现在\"证道\"二字之中，这一译名选择，据部分评论者考证，很可能反映了铃木本人惯于为向英语读者\"传教式\"地弘扬禅法、而在翻译上采取一定自由发挥策略的一贯风格。**陆宽昱（Charles Luk，即陆惠昱，Lu K'uan Yü）1960年在其《禅与禅宗教法》（*Ch'an and Zen Teachings*）中收录的译本及评注，被公认为英语世界第一部针对此文的专门\"注释本\"（first English commentary）。\n\n进入二十一世纪后，相关译介与研究持续推陈出新：**红松（Red Pine，本名比尔·波特 Bill Porter，以译介大量汉传佛教及道家经典闻名于英语世界）2019年经其自办的 Empty Bowl Press 出版了带有详尽注释的专门译本《永嘉证道歌》（*Yung-Chia's Song of Enlightenment*）；佛教传道协会美国（BDK America）\"英译佛典\"（BDK English Tripiṭaka）系列2021年由汉传佛教文献学者蒲慕伦（A. Charles Muller）推出学术译本*Yongjia's Song of Actualizing the Way / Observing the Mind, Awakening from a Dream*（可直译《永嘉证道歌／观心觉梦》），卷中间列收录《永嘉证道歌》（T.2014）与日本法相宗学僧良遍（Ryōhen）《观心觉梦钞》（T.2312）二篇——书题中\"观心觉梦\"即指其后篇——并附玄觉简传及译者导言；蒲慕伦于导言中对铃木、陆宽昱等前人将全文切分为\"五十六个单元\"这一分段方式的出处提出审慎存疑（大意谓：此一分段结构之依据不知何来，任何古典注疏均未标出），并保留二篇各自独立的文本划分。**朴珍英（Jin Y. Park，本系列《李通玄长者综合深度研究》第一章1.3节已介绍其关于李通玄\"时间性\"哲学的论文，足见其研究视野横跨华严与禅两大传统）与何胜文（Peter D. Hershock，夏威夷东西中心资深研究员）等学者，也都留下了各自独立的译本或译文比较讨论——何胜文更在其博客\"Turning the Wheel of Wonder\"中，将自己的译文与铃木大拙、乔治·W·布什（George W. Bush，此处为同名译者，与美国前总统无关）、詹姆斯·W·福勒（James W. Fowler）、朴珍英等至少六个不同版本的开篇译文逐句并列比较，形成了一份颇具学术价值、直观呈现《证道歌》百年英译流变的第一手比较材料。**此外，弗朗西斯·库克（Francis H. Cook）虽以研究华严\"性起\"思想知名（本系列前作已多次提及），其治学领域与《证道歌》所处的初唐禅宗—天台交涉史高度相关，可作为理解其思想背景的重要参照学者。\n\n**从思想史研究角度，英语学界最重要的贡献当推贾晋华（Jinhua Jia，科罗拉多大学博尔德分校博士，现任澳门大学哲学与宗教研究系教授，哈佛神学院、普林斯顿高等研究院访问学人）——她在系统研究洪州宗（马祖道一一系）的权威专著《八至十世纪中国的洪州禅宗》（*The Hongzhou School of Chan Buddhism in Eighth- through Tenth-Century China*，纽约州立大学出版社，2006）及相关论述中提出，《证道歌》很可能实际起源于洪州宗内部，而非直接出自永嘉玄觉本人之手——这一论断与前述陈盛港的\"神会说\"分别代表了当代中英学界对《证道歌》真伪问题两种彼此独立、却同样具有说服力的怀疑路径（详见第四章4.3节的详细比较讨论）。**维基百科\"Song of Enlightenment\"词条对此有精炼概括：\"The true authorship of the work is a matter of debate, with a number of elements in the writing suggesting either the text has been substantially changed over time or Yongjia was an unlikely author.\"（该作品的真实作者身份尚存争议，文本中的若干元素显示，此文要么在流传过程中经历了实质性改动，要么永嘉本非其原作者的可能性本就不高。）**\n\n### 1.4 学术争议与存疑问题小结\n\n综合上述多语种研究，本文认为以下几项争议最值得读者留意，并将在后续章节详细展开：\n1. **生卒年与享寿**：《祖堂集》记载卒于先天二年（713），享年39；《宋高僧传》同样记载卒于713年，却载享年49；南宋志磐《佛祖统纪》则主张卒于先天元年（712）——三部权威典籍在生卒年细节上互不一致，本文将在第五章5.4节专门辨析；\n2. **《证道歌》的真实作者**：中文学界陈盛港提出\"神会说\"，英语学界贾晋华提出\"洪州宗起源说\"，二者均对\"永嘉玄觉本人撰写\"这一传统归属提出了独立、却方向不完全相同的质疑，本文将在第四章4.3节详细比较呈现，不预设立场；\n3. **与神秀北宗的关系**：《宋高僧传》卷八玄觉传有\"至若神秀门庭，遐征问法\"之明文（详见第二章2.3节），玄觉确曾向神秀座下问法，惟原传仅一句带过、参访经过不详，各方对此的具体化演绎须加分辨；\n4. **日文学界的专题研究现状**：如1.2节所述，本文检索未能确认具体的日文专题学术论著，这一检索局限本身亦如实呈现，供读者自行进一步查证。\n\n---\n\n## 二、佛门内部、跨宗派与跨宗教视角\n\n### 2.1 禅门内部的定位：\"一宿觉\"与\"三十四代真觉禅师\"\n\n在禅宗内部的传统叙事中，永嘉玄觉被赋予\"第三十四代真觉禅师\"这一法脉序位（自摩诃迦叶以下，历西天二十八祖至菩提达摩为东土初祖、再传至六祖惠能；玄觉为惠能法嗣，序位合为第三十四），又因\"一宿\"之间即获印证这一极富戏剧性的开悟情节，获得\"一宿觉\"（又称\"宿觉禅师\"）这一在整个禅宗史上都堪称独一无二的专属称号——**据现存材料所见，禅门历代祖师之中，以如此精炼、如此聚焦于\"时间之短暂\"这一单一意象而形成的别号，实属罕见，这本身即从命名法的角度，凸显出\"顿悟\"这一主题在玄觉形象建构中的核心地位。**在文学史与禅林文献并重的评价体系中，《证道歌》与《信心铭》（三祖僧璨）、《参同契》（石头希迁）、《宝镜三昧》（洞山良价）并称\"禅林四大文字\"，历来\"为禅林所重视\"——**这四篇作品跨越三祖、六祖法嗣、石头、曹洞诸家，本身即构成了一条贯穿禅宗不同世代、不同法系，却共享着\"以诗证道\"这一独特表达方式的文学脉络，玄觉的《证道歌》正是这一脉络中最早、也是篇幅最长、义理最系统的一部。**\n\n### 2.2 天台宗内部的强烈批判：\"夺他成己\"说\n\n与本系列此前研究中智俨、法藏等人物在各自宗派内部大体获得正面评价的情形不同，永嘉玄觉在天台宗内部激起了一场颇为罕见、且措辞相当激烈的批判。**据宋代天台学者神智从义（1042—1091，温州平阳人，俗姓叶，字叔端，\"神智\"为其谥号）在所撰《法华经三大部补注》卷十一（《卍续藏》X0586）中的评述，天台宗内部对《永嘉集》提出了直截了当的\"夺他成己\"指控，其原文云：\"但永嘉集全用天台圓頓之法，而不曾言天台者，豈不奪他成己耶？不然，意在何哉？\"（然而《永嘉集》通篇用的是天台圆顿之法，却从不言天台，这岂非\"夺他成己\"？若非如此，其用意又是何在？）——从义于同一段中复赞《永嘉集》\"唯永嘉集多用佛經以為指南，此得達磨之正意也\"（唯《永嘉集》多用佛经以为指南，深得达磨祖师之本意），足见其立场并非一味贬斥，而是\"嘉其指南、责其隐师\"两面并存的复杂态度；从义又以\"自免貧窮數寶之責\"（免于沦为\"数他人珍宝\"之贫者的责难）一语为戒，质疑对天台教理术语缺乏真正师承道地的运用——\"若天台疏，皆有方轨，摄法入心，观与经合\"，意谓天台疏钞皆有严格修学轨则，须将教法摄入自心、使观法与经教相合，而非停留于\"分别名相\"的表面功夫。**这一批判的具体文献依据相当扎实——《永嘉集》\"优毕叉颂第六\"部分，明确以天台\"观心十门\"（法尔门、观体门等）来阐发\"舍\"（优毕叉，upekṣā）这一止观概念，且\"三谛一境，法身之理恒清；三智一心\"这一表述方式，正是天台智顗\"圆顿止观\"体系最具标志性的术语框架——从义的批判，正是针对这类具体的、可以逐字比对的教理借用而发，绝非泛泛而论的宗派门户之见。**这场发生在天台宗内部、跨越近四百年（从玄觉713年身故至从义入寂的1091年，前后约三百八十年）的追溯性批判，是本系列研究迄今为止所发现的、最为具体、最有文本依据支撑的一场跨宗派教理归属争议，值得读者格外关注。顺带一提的是，从义于上述《法华经三大部补注》同卷中还措辞严厉地批评清凉澄观弃《法华》一乘根本、别立所谓华严\"顿顿\"观门，又责圭峰宗密贬斥南岳天台而潜用天台观门——可见\"用台法而不言台\"之讥并非玄觉一人独受，而是天台学者面对华严、禅诸宗相继崛起之际的一贯攻讦，这一脉络对理解本系列《判教互判》专题所论天台—华严判教学竞争，尤具参照价值。\n\n现代学术研究对这一\"由台入禅\"现象也给出了更具历史纵深感的解读：\"永嘉玄觉原系天台学者，他后来脱离天台而转向禅宗，至少可以说明两个问题：其一，它说明禅宗（惠能南宗）的发展在当时确实开始出现转机，它在南方地区的思想影响已经进入天台佛教的势力范围。其二，天台宗除了应对法相唯识宗、华严宗的教义批评，还直接面临着正在崛起之中的禅宗思想的攻击。\"**这一分析进一步指出，正是包括玄觉\"叛离\"在内的这类南方禅宗势力扩张所构成的现实压力，\"迫使天台学者自强不息\"，而\"湛然天台思想的革新适应了时代的需求，成为天台宗发展史上极其重要的阶段\"——**换言之，玄觉个人的教派抉择，在现代学者的历史叙述中，被赋予了超出其个人生命史范畴的更大意义：他被理解为初唐天台—禅宗势力消长过程中一个具有征候意义的具体案例，这场消长最终催生了天台九祖湛然（711—782）对天台教理的重大革新（详见第三章3.1节及第六章相关讨论）。\n\n### 2.3 与神秀北宗的传说性接触\n\n《宋高僧传》卷八玄觉传在述其求道经历时明文记载：\"至若神秀门庭，遐征问法，然终得心于曹溪耳。\"（至于神秀的门庭，他也曾远道前往问法，然而终究是在曹溪得心印。）**这一记载虽仅一句带过、未详述参访经过与所得，却确证：玄觉在赴曹溪之前，确曾北上问法于神秀北宗一系——这意味着其求道历程实际上先后触及北宗（神秀）与南宗（惠能）两大禅系，最终因惠能一系\"顿悟\"法门而获得印证。惟现代通俗性传记（如简书等自媒体平台文章）对\"参神秀而未曾证悟\"等情节的具体化演绎，系对《宋高僧传》这一句话的铺陈发挥，非原文所载，读者宜加分辨，凡无原文依据者本文不轻采。**\n\n### 2.4 道家视角：\"证道\"之名与\"玄\"字命名传统\n\n如第一章1.3节所引西方评论者观察，《证道歌》标题本身\"字面直译即为'一首肯定道的歌'（A Song Affirming the Dao）\"，这一观察精准地捕捉到了标题用语本身所带有的浓厚道家色彩——\"道\"（Dao/Tao）作为道家哲学的核心范畴，被直接移用为这首禅诗标题的核心意象。**更具体的文献学观察来自陈盛港的论文：他注意到玄觉与其同门玄朗的法名均带有\"玄\"字，并推测\"'玄'的命名大概和道家有些渊源，他们的老师天宫慧威是一个道家式的人物。\"**\"玄\"作为《道德经》\"玄之又玄，众妙之门\"这一著名表述的核心字眼，在唐代佛教僧人命名传统中的选用，确实值得从佛道交涉史的角度加以关注——尽管现有材料尚不足以就\"天宫慧威本人是否确实具有道家背景\"这一具体问题提供更详尽的实证支持，本文在此仅如实转述陈盛港的观察与推测，存疑列出，留待后续研究补充。\n\n### 2.5 现代跨宗教与比较哲学视角：从\"垮掉的一代\"到全球禅学\n\n如第一章1.3节详述，《证道歌》在二十世纪中叶经由铃木大拙的译介进入英语世界后，恰逢西方\"垮掉的一代\"（Beat Generation）文化思潮兴起，艾伦·瓦兹（Alan Watts）等西方禅学普及者对东方神秀主义与自发性（spontaneity）主题的援引，间接推动了包括《证道歌》在内的禅宗文本在西方大众文化中的传播。**这一接受史现象具有超出单纯\"佛教文献海外译介\"范畴的文化史意义：《证道歌》所representing的\"顿悟\"美学与\"任性逍遥\"（详见第四章4.2节\"绝学无为闲道人\"一语的具体分析）的生命姿态，恰好与二十世纪中叶西方反主流文化运动对\"自发性\"\"解放\"等价值的追求产生了跨文化的共鸣，使得这篇源自初唐的禅诗，意外地在一千二百余年后的另一个文化语境中，找到了新的、且极具时代特色的读者群体与诠释框架。**这与本系列《李通玄长者综合深度研究》第二章2.6节所论朴文永对李通玄\"时间哲学\"的现代比较哲学诠释，构成了华严—禅两大传统的经典文本，在当代跨文化学术与大众文化语境下持续焕发新生命力的又一组具体例证。\n\n---\n\n## 三、永嘉玄觉的师承：天台内学与禅门印证的双重脉络\n\n与本系列前四篇研究所涉及的杜顺（师承几不可考）、智俨（多师并进）、李通玄（学无常师）均不相同，永嘉玄觉呈现出一种独特的\"双重师承\"结构——**他在天台一系确有明确可考、且地位不低的正式教理训练背景，却在禅法证悟这一维度上近乎\"无师自证\"，最终仅凭曹溪一夕问答即获印证。这一\"教理有师、证悟无师（或言只需一夕之师）\"的独特结构，是理解玄觉终身\"身在天台、心系禅门\"这一双重身份的关键。**\n\n### 3.1 天宫慧威门下：与左溪玄朗的同门情谊\n\n据现代学术考订（详见陈盛港论文），俗姓戴、生于665年永嘉郡的玄觉，与左溪玄朗确为同门——二人同从**天宫慧威**（634—713，俗姓留〔一作刘〕，婺州东阳人，号\"天宫尊者\"，曾从缙云智威习天台教观，一说初居京师（长安）天宫寺、后归东阳隐居，开元元年即713年入寂、享寿八十——与玄觉几乎同年辞世，这一巧合本身颇值得注意）门下学习天台止观，而后更成为其接法的两大徒弟。**慧威门下的这两位高足，此后走上了截然不同的道路：左溪玄朗（673—754，字慧明，婺州乌伤〔今浙江义乌〕人，俗姓傅，为南朝著名居士傅大士〔梁·傅翕〕六世孙；通行\"天台九祖\"祖位序列〔龙树、慧文、慧思、智顗、灌顶、智威、慧威、玄朗、湛然〕中居\"八祖\"，惟《宋高僧传》卷二十六玄朗传末另有\"第其传法号五祖矣\"之语，可见古来祖位计数曾有分歧，王雷泉提要亦径以\"天台宗八祖\"称之）恪守天台一系，深居左溪山三十余年（其号\"左溪\"即由此得，吴越王复谥\"明觉尊者\"），门下培养出天台九祖湛然（711—782）这样的划时代人物，从而稳固地留在了天台正统的祖统谱系序列之中；而永嘉玄觉，则在同一位老师门下完成教理训练后，转而奔赴曹溪，最终以禅门\"一宿觉\"的身份名垂青史，未再列入天台祖统。**这一\"同门二人、殊途异归\"的具体历史个案，与本系列《华严宗二祖智俨综合深度研究》第四章4.6节所述智俨门下法藏（中土）与义湘（新罗）\"同源异流\"的情形，构成了一组结构颇为相似、却发生在不同宗派语境下的历史平行案例——师出同门的两位杰出弟子，因各自不同的生命抉择，分别成就了两条截然不同、却同样影响深远的思想史轨迹。\n\n### 3.2 独悟维摩：无师自证的原初开悟\n\n在系统完成天台止观训练之后，玄觉的生命历程出现了一次决定性的独立转折——关于此次\"独悟\"所依的经典依据，现存文献凡有两说，本文存疑并陈：其一，据《六祖坛经》（法海集宗宝本）《机缘品》所载，\"永嘉玄觉禅师，温州戴氏子，少习经论，精天台止观法门。因看《维摩经》，发明心地\"——\"因看《维摩诘经》发明心地\"一说，与《景德传灯录》卷五、《五灯会元》等禅门文献所载一致，是禅门传统中最通行的说法；其二，天台史书《释门正统》卷六则载玄觉\"因览《涅槃经》洞明妙旨\"。至于《宋高僧传》卷八玄觉传，仅言其本住温州龙兴寺、于岩下自构禅庵独居研学，未指明所读经典。总此而言，\"因经独悟、无师自证\"这一基本事实向为诸家所共认，惟所读经典两说有异，本文不强行调和。**这一\"因经自悟\"的模式，与本系列此前研究中反复出现的\"因经文触发悟境\"母题（如智俨读慧光《华严经疏》而悟\"别教一乘\"，详见《智俨综合深度研究》第三章3.3节；宗密读《圆觉经》而有所体悟，详见《宗密综合深度研究》第三章3.4节）遥相呼应，构成了中国佛教思想史上一种反复出现的\"经典阅读式开悟\"典范；但玄觉的情形又有其特殊性——他此次开悟\"没有老师印证\"（据南怀瑾的转述：\"他悟了道没有老师印证。不过，他自己很有自信，晓得自己悟道了\"），即这次开悟本身完全是独立自证的产物，尚未经过任何外部权威的确认。**《维摩诘经》本身作为一部长于以在家居士维摩诘\"不二法门\"的機锋问答来阐扬般若空义的经典，其思想气质与禅宗后来盛行的机锋问答传统高度契合——玄觉选择这部经典作为其独悟的触媒，某种意义上也预示了他此后在曹溪与惠能之间那场同样以\"机锋问答\"形式展开的印证过程（详见3.3节）。\n\n### 3.3 一宿觉：曹溪印证的完整过程考据\n\n玄觉这次独自证悟，虽然自信笃定，却始终\"苦于无人印证\"。**据南怀瑾的转述，促成这一转折的关键人物正是其天台同门左溪玄朗：\"有一天，碰到了一位道友——左溪朗，两人谈了起来。他的朋友说：'老兄啊！你是见道了，不过，须要找个人印证。'他说：'现在天下哪有大善知识，我找谁去印证？'\"**——这段对话生动呈现了玄觉起初的自负与犹疑，而促成他最终启程的，据《六祖坛经》《景德传灯录》等禅门文献记载，则是另一位与惠能门下有直接渊源的东阳玄策禅师：\"玄觉禅师遂与玄策同至曹溪\"（一说是玄策主动来访，\"发现玄觉出言暗合诸祖\"，遂建议其亲赴曹溪求证，详见前引\"策云：'我言轻，曹溪有六祖大师，四方云集，并是受法者，若去，则与偕行'\"）。\n\n抵达曹溪后，双方的会面极具戏剧性：\"觉遂同策来参，绕师三匝，振锡而立\"——玄觉并未依常规礼数向惠能顶礼，而是绕着惠能所坐之处走了三圈，振响手中锡杖，随即伫立不动。惠能见状发问：\"出家眾应具有三千威仪、八万细行，你是打那儿来的，居然如此傲慢无理？\"玄觉答道：\"生死事大，无常迅速！\"（意谓：生死大事迫在眉睫，无常转瞬即至，何暇顾及俗礼繁文）惠能追问：\"何不体取无生，了无速乎？\"（既已知晓无常迅速，为何不直接体认\"无生\"这一超越生灭的本源，从而了悟根本没有什么\"迅速\"可言？）玄觉应声答道：\"体即无生，了本无速。\"（能体认的当下即是无生，了悟的本身也根本无所谓迅速。）**这一番仅四句往返的机锋问答，节奏之快、义理之精，使惠能当即予以印可，确认了玄觉的悟境，并留其在寺中住宿一晚——次日玄觉即启程返回龙兴寺，\"时人称之为'一宿觉'\"。**\n\n**这一过程颇值得从\"顿悟\"美学的角度加以品味：玄觉此行的核心诉求，并非寻求教理层面的进一步教导（他早已\"独悟\"在先），而仅仅是寻求一位\"大善知识\"对其已然自证之境地的权威确认——整个印证过程压缩在几句问答、一夜住宿之间，其\"快\"与\"简\"本身，恰恰成为了\"顿悟\"这一禅门核心主张最具戏剧张力、也最广为流传的一次现身说法。**\n\n### 3.4 \"劝友人书\"：他与玄朗的书信往来及其角色微妙性\n\n玄觉与左溪玄朗这对天台同门的关系，并未因玄觉转投禅门而彻底中断——《永嘉集》第九篇\"劝友人书\"，收录的正是玄朗其后\"召大师山居\"（邀请玄觉一同入山共修）的书信，以及玄觉本人的回信全文（《大正藏》原文标题分别作\"婺州浦阳县佐溪山朗禅师召大师山居书\"与\"大师答朗禅师书\"）。**玄觉在回信中\"回绝并告之以修行要件\"——即他婉拒了玄朗的邀请，转而在信中系统阐述了自己对于修行根本要件的见解。陈盛港的论文对这一细节给出了颇具启发性的解读：\"从该集中收录一封回答玄朗邀请入山共修之事，由他回绝并告之以修行要件等内容来观察，玄觉宛如扮演着玄朗的顾问或指导者的角色。\"**这一观察极具深意：尽管在天台祖统的正式序列中，玄朗此后成为备受尊崇的\"天台八祖\"（详见3.1节），地位远较未入正统谱系的玄觉更为\"显赫\"，但就这封具体书信所呈现的实际互动姿态而言，玄觉却更像是在扮演一位为同门指点修行方向的\"顾问\"角色——**这一细节生动说明，官方谱系地位的高低，与私人情谊、乃至具体修学问题上的实际话语权重，未必总是完全对应；玄觉虽终身未列入任何一方（无论天台或禅宗）的正式祖统序列，在其亲身经历者眼中，却显然拥有着不容小觑的修证权威。**\n\n---\n\n## 四、永嘉玄觉的思想体系、著述与生命示范\n\n### 4.1 《永嘉集》的十门结构：止观次第与教禅融合\n\n《禅宗永嘉集》（简称《永嘉集》，由庆州刺史魏靖辑录成书）全书分为十篇，依次为：**慕道志仪、戒憍奢意、净修三业、奢摩他颂、毗婆舍那颂、优毕叉颂、三乘渐次、事理不二（一作理事不二）、劝友人书、发愿文**——这十篇之间存在着极为严整的内在逻辑递进关系，据该书原文自述的编排理由，大致可概括为：先立修道之志与事师之仪（第一），继而防范身口意三业的骄奢放逸（第二、三），然后正式进入止观实修——先修\"奢摩他\"（śamatha，止／定，第四），次修\"毗婆舍那\"（vipaśyanā，观／慧，第五），再修\"优毕叉\"（upekṣā，舍，即定慧均等而不偏于一边，第六）——此三颂合为整部书教理与实修分量最重的核心部分。**其后，第七\"三乘渐次\"承认悟有浅深、需次第度化众生；第八\"事理不二\"总摄全书，指出\"三乘悟理，理无不穷，穷理在事，了事即理\"，即事相与理体本自圆融不二；第九\"劝友人书\"即前述与左溪玄朗往来的具体书信实例（详见第三章3.4节）；第十\"发愿文\"则以誓愿普度一切众生作结。**\n\n这一结构安排的思想史意义值得特别强调：**《永嘉集》表面上\"声称以禅宗的名义\"，但据现代学者考订，\"实际上包含着天台止观的内容\"——尤其在\"优毕叉颂第六\"部分，玄觉更直接援用天台特有的\"观心十门\"（法尔门、观体门等）架构来阐发\"舍\"这一概念，行文中反复出现\"三谛一境\"\"三智一心\"这类天台\"圆顿止观\"体系的标志性术语。**这意味着，《永嘉集》实质上是一部以天台止观的具体方法论、逐级修证的操作程序为骨架，最终却指向禅宗\"顿悟\"义理旨归的融合性著作——**这一\"渐次之修法、顿悟之旨归\"的内在结构本身，恰是理解玄觉\"由台入禅、却终身未能（或未曾企图）真正割舍天台学养\"这一双重身份最直接的文本证据，也正是天台学者神智从义据以提出\"夺他成己\"批判（详见第二章2.2节）最坚实的具体文本依据所在。**\n\n### 4.2 《证道歌》的思想内容与文学成就\n\n相较于《永嘉集》按部就班、层层递进的论述体裁，《证道歌》则以极富文学感染力的古体乐府诗形式，将顿悟的心境和盘托出。全诗开篇即以\"君不见，绝学无为闲道人，不除妄想不求真\"起势，直指顿悟者\"不假造作、不落对治\"的根本气象；随即展开\"无明实性即佛性，幻化空身即法身\"这一贯穿全篇的核心命题——**将\"无明\"与\"佛性\"、\"幻化空身\"与\"法身\"直接等同，不设能所对待，是典型的禅门\"烦恼即菩提\"式圆顿表述。**全篇密集征引大量佛教术语与譬喻——如来禅、六度万行、摩尼珠、如来藏、六般神用、五眼五力、二十空、四智、阿鼻地狱、五阴浮云、三毒水泡等等——这些术语被编织进极具音乐性、朗朗上口的七言诗句之中，\"使人在朗朗吟诵间悟得佛法大意\"。**据南怀瑾的评价，\"全部佛法都包括在里面\"；而据现代英语世界的评论（详见第一章1.3节），全诗虽在具体的偈颂划分方式上（56个单元、51/54解、247/267句等不同版本记载）尚存文献学上的细节出入，但其作为\"研究初唐禅宗思想的重要文献\"以及\"整个佛教精髓浓缩于一诗\"的文学与教理双重成就，历来为教界内外所公认。**\n\n### 4.3 《证道歌》作者真伪的学术公案：神会说与洪州说\n\n如第一章1.3、1.4节所述，《证道歌》的作者归属问题，是当代中英学界各自独立、却方向相通的一大学术公案，值得在此专节详细展开比较。\n\n**陈盛港\"神会说\"的核心论证逻辑**：陈盛港透过对歌文本身所涉及的三项具体历史元素——(1)\"西天二十八祖\"传承说法的形成年代；(2)中土禅宗\"六代祖师\"传承说法的形成年代；(3)\"曹溪\"一词被用以代称惠能这一用法的最早出现年代——逐一进行文献学考订，发现三者均在玄觉身故（713年）之后二、三十年方才形成或流行。**其中\"曹溪\"代称惠能的确切用例，陈盛港举出的最早材料包括独孤及所撰《舒州山谷寺觉寂塔隋故镜智禅师碑铭》中的\"能公退而老曹溪\"，以及780年清昼为佛川慧明所撰《唐湖州佛川寺故大师塔铭》中\"第六祖曹溪能公\"（见《全唐文》卷907）、781年《曹溪大师别传》等文献，均已是玄觉身后六七十年方才出现的用例——他据此提出一个尖锐的诘问：\"实在难以想到和惠能同年过世（一说玄觉'晚惠能二个月过世'）、被认为是该歌作者的玄觉，会远在713年以前就用'曹溪路''曹溪是'等词汇在他（的作品）中。\"**基于这一系列时间线索的系统性矛盾，陈盛港进而将玄觉与另一位背景、经历更为吻合的人选——荷泽神会（684—758，本系列《宗密综合深度研究》第三章已有专门讨论，是宗密所属荷泽宗的开创者）——加以比较，认为神会更有可能是《证道歌》真正的原作者。**\n\n**贾晋华\"洪州宗起源说\"**：与陈盛港的具体年代考据路径有所不同，贾晋华在其权威专著《八至十世纪中国的洪州禅宗》的相关论述中，从洪州宗（马祖道一一系，八世纪中后期兴起于江西洪州）自身的教理特征与文献传承脉络出发，提出《证道歌》很可能实际起源于洪州宗内部——**这一论断若能成立，则意味着《证道歌》的真实成书年代，或应进一步推迟至八世纪中后期，比陈盛港所推定的、与神会（活跃于八世纪上半叶）相关联的年代还要更晚。**\n\n**两说的比较与本文立场**：陈盛港的\"神会说\"与贾晋华的\"洪州说\"，虽然在具体的候选作者与年代推定上有所不同，但二者的方法论出发点高度一致——都是从《证道歌》文本内部与玄觉生平年代难以调和的具体矛盾出发，对\"玄觉本人即为原作者\"这一传统归属提出实质性质疑；二者也都承认，无论真实作者是谁，玄觉作为这一文本传统上、且延续至今仍被公众广泛接受的\"署名作者\"，这一身份本身已经透过千余年的历史积淀而获得了独立于\"历史真实作者是谁\"这一文献学问题之外的、稳固的文化史与宗教史地位。**本文对此存疑列出，不强行调和二说、也不贸然否定传统归属，仅如实呈现当代中英学界各自独立却方向相通的怀疑路径，供读者自行判断——正如维基百科相关词条所总结：\"该作品的真实作者身份尚存争议，文本中的若干元素显示，此文要么在流传过程中经历了实质性改动，要么永嘉本非其原作者的可能性本就不高。\"**\n\n### 4.4 \"夺他成己\"再议：从文本证据看天台批判的具体依据\n\n第二章2.2节已引述神智从义对《永嘉集》\"盗用天台圆顿教义\"的批判，第4.1节则已具体呈现了《永嘉集》\"优毕叉颂第六\"部分借用天台\"观心十门\"、\"三谛一境\"\"三智一心\"等标志性术语的确切文本证据。**将这一具体的教理归属争议，与4.3节所述《证道歌》作者真伪的学术公案并置比较，可以发现二者虽性质有别（前者是\"教理内容的归属\"之争，后者是\"文本作者身份\"之争），却共同指向了永嘉玄觉这一人物形象所具有的一项根本性特质——他所代表、所传世的这批文本（无论是确凿可考出自其手的《永嘉集》，还是作者归属尚存争议的《证道歌》），始终处于多重思想资源、多重叙事传统交汇、竞争、乃至相互\"借用\"的复杂地带，而非某种单一、纯粹、可以清晰界定归属的独立创造。**这一特质，某种意义上恰恰是理解整个八世纪初中国佛教\"教下\"（天台、华严等义学传统）与\"宗门\"（禅宗）之间日益激烈的资源争夺与话语竞争这一宏观历史图景时，一个极具体、极生动的微观案例。\n\n### 4.5 生命示范：一宿而证的顿悟典范及其历史意义\n\n如第三章3.3节所详述，玄觉\"绕师三匝、振锡而立\"、以四句机锋问答即获惠能印可、\"一宿\"即返的整个过程，其戏剧性的浓缩程度，在整个禅宗公案传统中都堪称典范。**这一生命示范的深层意义在于：它以一种近乎表演性的、极致压缩的时间尺度，具体演绎了\"顿悟\"这一命题——不是透过累牍连篇的教理论证，而是透过一场发生在具体时空中、时长仅\"一宿\"的真实相遇本身，来\"证明\"顿悟确实可能。**这与本系列此前研究中所见的其他\"生命示范\"案例——如杜顺以\"坐\"疗疾、以身示范无贪（详见《杜顺综合深度研究》第四章4.1节），或智俨可能长达三十年的\"沉潜\"式渐修（详见《智俨综合深度研究》第三章3.5节）——形成了饶富意味的对照：**杜顺、智俨的生命示范，其感召力恰恰来自\"持久\"\"渐进\"\"几十年如一日\"的坚韧质感；而玄觉的生命示范，其感召力则恰恰来自与此完全相反的极致\"迅疾\"——\"生死事大，无常迅速\"这一开场白，本身即是对\"时间紧迫性\"的直接宣告，而其证悟过程之压缩、短暂，恰恰是对这一宣告最有力的身体力行式呼应。**华严一系（杜顺、智俨）与禅门一系（玄觉），分别以\"渐修的持久\"与\"顿悟的迅疾\"这两种几乎截然相反的时间美学，共同诠释了各自传统对于\"生命实证\"这一根本关切的理解——这一对照本身，或许正是本系列多篇研究并置阅读时，最能引发方法论反思的一组具体案例。\n\n---\n\n## 五、永嘉年谱、人物关系与历史文化事件\n\n### 5.1 永嘉玄觉年谱简表\n\n下表综合《祖堂集》《宋高僧传》卷八、《景德传灯录》卷五、《佛祖统纪》等原始文献及现代学者考订整理而成。**如1.4节及5.4节所述，玄觉的生卒年、享寿在不同版本文献间存在明显出入，下表尽量呈现较为通行的版本，异说另加说明。**\n\n| 年代（唐历） | 公元 | 玄觉年龄（虚岁） | 事件 |\n|---|---|---|---|\n| 唐高宗麟德二年 | 665 | 1 | 生于永嘉（今浙江温州），俗姓戴，字明道 |\n| （幼年） | — | — | 八岁出家，博览三藏，精天台止观，据传与左溪玄朗同拜天宫慧威为师 |\n| （青壮年时期） | — | — | 于温州龙兴寺侧自构禅庵，独居研学；因读《维摩诘经》而自证心地，\"无师印证\" |\n| （具体年份不详） | — | — | 东阳玄策来访，认为其\"出言暗合诸祖\"，劝其赴曹溪求证于六祖惠能 |\n| 武周或唐中宗年间（具体年份存疑） | 约700年代初 | — | 与玄策同至曹溪，\"绕师三匝，振锡而立\"，与惠能问答四句，即获印可，寓宿一晚，翌日辞归，时称\"一宿觉\" |\n| （返永嘉后） | — | — | 于温州弘法，著《证道歌》一首、《永嘉集》（一卷十篇，由庆州刺史魏靖辑录） |\n| 唐玄宗先天元年（一说二年） | 712（一说713） | 48（一说49，一说39） | 十月十七日示寂（一说卒年月日略异），敕谥\"无相大师\"（王雷泉提要谓唐僖宗所赐）、塔曰\"净光\"（《宋高僧传》），清雍正又敕封\"洞明妙智禅师\"；葬于西山，精确塔址本文未能确认，存疑 |\n| 北宋 | — | — | 天台学者神智从义于《法华经三大部补注》卷十一（《卍续藏》X0586）中评《永嘉集》\"全用天台圆顿之法而不言天台\"、谓之\"夺他成己\"，然亦赞其\"多用佛经以为指南，此得达磨之正意\" |\n\n**备注：** 表中\"与玄策同至曹溪\"及\"一宿觉\"事件的确切公元年份，各方文献均未给出精确纪年，仅可透过惠能卒年（713年）及玄觉本人卒年反推大致时间范围（约八世纪初），本文存疑，不作过度精确的系年推定。\n\n### 5.2 核心人物关系网络\n\n**授业之师：**天宫慧威（634—713，天台止观传授之师，详见3.1节）。\n\n**同门法侣：**左溪玄朗（673—754，天台同门，日后成为天台八祖，详见3.1、3.4节）。\n\n**印证及引荐之人：**东阳玄策禅师（生卒年不详，与惠能门下有直接渊源，劝玄觉赴曹溪，详见3.3节）、六祖惠能（638—713，曹溪印证之关键人物，与玄觉几乎同年辞世，详见3.3节）。\n\n**书信往来对象：**左溪玄朗（详见3.4节\"劝友人书\"）。\n\n**身后编纂者：**庆州刺史魏靖（辑录《永嘉集》成书之在家护法居士）。\n\n**身后批判者：**宋代天台学者神智从义（详见2.2节）。\n\n**门人及亲属：**《宋高僧传》卷八载其门人有惠操、惠特、等慈、玄寂四师；其兄宣法师亦为僧侣，另有犹子二人俱预缁伍。\n\n### 5.3 武周至先天：初唐禅宗南北分化与天台势力消长的时代背景\n\n玄觉的生命历程（665—712/713），恰好跨越了武则天称帝（690—705）、唐中宗复辟（705—710）、唐睿宗（710—712）直至唐玄宗即位初年（712年起）这一系列政局剧烈动荡的时期。**这一时期也正是禅宗内部\"南北分宗\"格局逐渐成形、且南宗（惠能一系）声势日渐坐大的关键阶段——神秀（约606—706）在世时长期享有\"两京法主，三帝国师\"的崇高地位，代表着北方禅法的官方正统；而惠能则始终僻处岭南曹溪，直至身后经由神会等人的大力弘扬，方才在中原地区获得广泛承认。**玄觉本人若确曾\"亲近神秀\"（详见第二章2.3节，据《宋高僧传》明文\"至若神秀门庭，遐征问法\"，此说已有文献依据），而后终究选择南下曹溪求证于惠能，这一选择本身，恰恰折射出初唐佛教界在南北禅法之间进行个人抉择时所面临的现实张力。**与此同时，如第二章2.2节所引现代学者的分析，玄觉\"由台入禅\"这一具体选择，也被理解为南宗禅法势力开始渗透进入天台传统势力范围（浙东一带，玄觉、玄朗二人的家乡与活动范围均在此地）的一个征候性事件——这一渗透压力，据学者分析，最终构成了促使天台九祖湛然在其后数十年间进行教理革新的重要历史动因之一（详见第二章2.2节）。**就此而言，玄觉个人生命历程中一次看似纯属私人性质的求道抉择，实际上嵌套在一场跨越数十年、深刻影响了天台宗后续发展方向的宗派势力消长过程之中。\n\n### 5.4 死亡年份的三种记载与考辨\n\n如1.4节所述，玄觉的卒年在现存权威典籍中存在三种不尽相同的记载：**《祖堂集》记为先天二年（713）十月十七日示寂，享年三十九；《宋高僧传》卷八同样系年于713年，却记载享年四十九——二者卒年一致，享寿却相差整整十岁，意味着二书对其生年的推算存在十年之差；南宋志磐《佛祖统纪》则主张玄觉卒于先天元年（712），较前二书所记又提早了一年。**这三种记载之间的具体矛盾，笔者检索所及的现有材料尚未见有专门的、如陈盛港论文考订《证道歌》作者问题那般细密的现代学术考辨成果，此处仅如实胪列三说，存疑列出，提请读者自行留意——这也从另一个侧面说明，即便是像卒年这样看似应属\"基本事实\"的信息，在中古佛教人物的传记材料中，也往往存在着不容忽视的文献学不确定性，这与本系列此前研究中反复揭示的类似现象（如杜顺卒年的\"街头细节\"存疑、澄观生卒年\"738/739 vs 837/838/839\"的重大出入等，详见《杜顺综合深度研究》及《宗密综合深度研究》相关章节）一脉相承。**\n\n---\n\n## 六、永嘉之后的传承与接受：从曹溪到全球\n\n### 6.1 唐宋：《证道歌》的注疏传统\n\n《证道歌》成文后不久即在禅林广泛传诵，历代为其作注者代不乏人——**宋代以降，随着禅宗\"文字禅\"风气兴盛（即以颂古、评唱等文字形式阐发公案与祖师言教），《证道歌》作为篇幅适中、义理浓缩、朗朗上口的代表性韵文，自然成为历代禅师乐于注解、征引的重要文本。**惜笔者检索所及，未能就\"历代《证道歌》注本\"这一课题找到如陈盛港论文那般系统、专门的现代学术梳理；但据王雷泉〈《禅宗永嘉集》提要〉所胪列，《永嘉集》历代注本即有宋僧行靖《永嘉集注》二卷、明僧传灯《永嘉禅宗集注》二卷（收入《卍续藏》第一一一册）、高丽僧己和《永嘉集说谊》二卷等，《证道歌》注本自当不亚于此，附此备考，惟具体的历代注本目录及其内容特色，仍留待后续研究补充。\n\n### 6.2 与禅门五家七宗的关系\n\n玄觉本人虽因\"一宿觉\"而获惠能亲自印可，却并未如惠能门下青原行思、南岳怀让等入室多年的弟子那样，进而开枝散叶、形成独立的禅门支派——**据现存资料，玄觉印证之后即返永嘉，此后主要以个人讲学、著述的方式弘化一方，并未像青原、南岳二系那样，透过持续多年的师徒授受，最终发展出日后蔚为大观的\"五家七宗\"（沩仰、临济、曹洞、云门、法眼，及临济分出的黄龙、杨岐二派）。**就此而言，玄觉在禅宗制度性传承谱系中的位置，与本系列《李通玄长者综合深度研究》第六章6.4节所论李通玄\"始终未被纳入官方祖统\"的情形，存在某种结构性的相似——二者都是以文本（《证道歌》《永嘉集》／《新华严经论》）而非制度性法脉传承的方式，在各自所属的宗派传统中持续发挥影响力。**不同的是，玄觉毕竟获得了六祖惠能本人的正式印可，在禅宗\"法脉世系\"意义上仍占有明确的一席之地（\"第三十四代真觉禅师\"，详见第二章2.1节），只是未曾形成独立支派而已，这与李通玄终身\"学无常师\"、完全游离于官方谱系之外的情形，仍有性质上的区别，读者应予明辨。\n\n### 6.3 域外传播：东亚汉字文化圈的持续诵习\n\n《证道歌》与《永嘉集》作为汉传佛教经典文献，自唐宋以降即随汉传佛教的整体传播格局，进入朝鲜半岛、日本等东亚汉字文化圈——**如第一章1.2节所述，笔者未能寻得关于《证道歌》在日本受容史的专题学术论著，但可以确认的是，该文本在日本禅宗（曹洞宗、临济宗）传统中始终占有诵习经典的地位，这一点从其至今仍被收入日本禅宗常用课诵本这一持续实践中即可得到印证，惟其具体的传入年代、历代注疏情况，仍有待日文学界的专题研究加以澄清（详见1.2节的存疑说明）。**就朝鲜半岛而言，《永嘉集》亦早已传入：高丽僧己和撰有《永嘉集说谊》二卷（参见第六章6.1节），足证《永嘉集》在韩国禅门同样深受重视。**\n\n### 6.4 二十世纪的全球化：从铃木大拙到\"垮掉的一代\"\n\n如第一章1.3节及第二章2.5节所详述，《证道歌》在二十世纪经由铃木大拙1935年的英译，正式进入西方学术与大众文化视野，此后陆宽昱（1960）等人的译注工作，进一步巩固了其作为\"英语世界读者认识汉传禅法之经典读本\"的地位。**这一译介历程恰与二十世纪中叶西方\"垮掉的一代\"文化运动及其后续的\"禅热\"（Zen boom）思潮同步展开——艾伦·瓦兹等禅学普及者对东方\"自发性\"\"解脱\"等主题的援引与推广，客观上为包括《证道歌》在内的禅宗文本在西方社会的传播提供了适逢其会的文化土壤。**进入二十一世纪，红松（Red Pine）2019年的详注译本、BDK英译佛典系列2021年的学术译本相继问世，标志着英语学界对这一文本的关注已经从早期\"大众普及性译介\"（铃木、陆宽昱阶段），逐步发展为具备更严格文献学、翻译学考量的\"学术性译注\"（红松、BDK阶段）——这一译介史本身的阶段性演进，恰是《证道歌》全球接受史中一条清晰可辨的发展脉络。\n\n### 6.5 当代：南怀瑾、常空与两岸僧俗的持续讲习\n\n如第一章1.1节所述，现代著名学者、居士南怀瑾对《证道歌》的推崇（\"全部佛法都包括在里面\"）及其在各类讲述场合对\"一宿觉\"公案的反复援引复述，对该文本在现代华人社会的通俗传播贡献甚巨；当代僧人常空所撰《月映千江：永嘉大师证道歌讲记》，则代表了当代两岸佛教界对这一经典持续进行讲授、诠释的具体实践。**这一\"从南怀瑾的现代居士讲述、到常空的当代僧团讲记、再到红松与BDK的英语学术译注\"的多线并进格局，生动说明《证道歌》这篇成文于一千三百年前、其真实作者归属本身尚存学术争议（详见第四章4.3节）的古代韵文，至今仍在教内讲习、大众普及、乃至国际学术翻译等多个彼此独立却又相互交织的场域中，持续保持着旺盛的生命力。**\n\n---\n\n## 七、永嘉玄觉在文化史与生命实证体验中的成就与贡献\n\n### 7.1 教禅一致的早期典范：与宗密遥相呼应\n\n本系列《圭峰宗密综合深度研究》第二章2.1节详细论述了宗密（780—841）\"教禅一致\"思想的核心地位——主张经教与禅法本非二途，\"经是佛语，禅是佛意，诸佛心口必不相违\"。**永嘉玄觉虽早于宗密约一个世纪，其一生行迹与著述本身，却已经具体而微地示范了这一\"教禅一致\"精神——他以天台教理训练为根柢（详见第三章3.1节），却最终以禅门顿悟印证为归宿；其《永嘉集》以天台止观的渐次方法论作为骨架（详见第四章4.1节），《证道歌》则以禅门顿悟的诗性语言作为表达（详见4.2节）——\"渐\"与\"顿\"、\"教\"与\"禅\"，在他一人的著述与生命历程中同时并存，而非相互排斥。**就此而言，玄觉可谓是\"教禅一致\"这一日后经宗密系统阐发、成为中晚唐以降汉传佛教主流精神的思想取向，在初唐阶段最早、也最具体的一位生命化身——尽管他本人未曾像宗密那样，留下系统性的理论著述来正面论证\"教禅本应一致\"这一命题，而是仅仅以自己\"由台入禅、教观双修\"的具体生命轨迹，作出了同样有力的示范。\n\n### 7.2 全球佛教文学经典的奠基之作\n\n如第一章1.3节、第六章6.4节所详述，《证道歌》历经铃木大拙、陆宽昱、红松、BDK等至少七、八位英语世界译者跨越近一个世纪的持续译介，早已超越了单纯\"中国佛教史料\"的范畴，成为整个英语世界读者认识汉传禅法最重要的入门文献之一，并在二十世纪中叶西方\"垮掉的一代\"文化思潮中，意外地找到了一批新的、且极具时代特色的读者群体（详见第二章2.5节）。**这一全球接受史的丰富程度，在本系列此前研究的所有人物中堪称首屈一指——纵使我们对\"永嘉玄觉本人是否确系《证道歌》真实作者\"这一学术公案（详见第四章4.3节）持审慎的存疑态度，这篇作品本身作为一部独立的文学与教理文本，其跨越语言、跨越文化的传播广度与持久生命力，已经足以使其在整个世界佛教文学史上，占据一个极为特殊、且难以被其他汉传佛教文献所替代的位置。**\n\n### 7.3 生命实证维度：从\"无师自悟\"到\"一宿而证\"\n\n如第三章3.2、3.3节所详述，玄觉的生命实证历程呈现出一种独特的\"两阶段\"结构：先是透过独自阅读《维摩诘经》而\"无师自证\"，继而透过与惠能一夕问答而\"一宿而证\"——**这一结构提示我们，\"顿悟\"在玄觉的生命历程中，实际上并非单一的、一次性的事件，而是经历了\"自证—印证\"这样两个性质不同、却同样必要的环节：前者是个体独立的智慧觉醒，后者则是这一觉醒获得传统权威确认、进而能够被纳入更广大的传法谱系与历史记忆之中的必要程序。**这一\"自证在先、印证在后\"的具体生命范式，对理解禅宗\"顿悟\"传统中\"个人体验\"与\"制度性确认\"之间的复杂关系，提供了一个极具典范意义的具体案例——它既充分肯定了个体独立契悟的可能性与正当性（玄觉确实是\"自己开悟\"的），又同时承认，这种个体性的开悟体验，若要真正在历史与传统中\"落地生根\"、被后世承认与铭记，往往仍需借助某种形式的、来自既有权威谱系的确认程序（哪怕这一确认过程本身可以短暂到只有\"一宿\"）。\n\n### 7.4 结语\n\n回望永嘉玄觉其人其学，其最深刻的文化史意义，或许正在于他以一人之身，同时承载了初唐佛教史上两条彼此竞争、却又相互渗透的思想脉络——**天台的渐次止观，与禅门的顿悟见性；教理的系统训练，与证悟的电光石火；同门玄朗留在正统谱系、位列天台八祖的\"显赫\"，与他本人终身未入官方祖统、却因\"一宿觉\"这一戏剧性传奇而声名不朽的\"传奇\"。**《证道歌》真实作者归属的学术悬案（详见第四章4.3节），或许永远不会有确凿无疑的定论；但无论最终执笔者是玄觉本人、荷泽神会，还是洪州宗门下的无名后学，这篇诗歌所承载的顿悟美学与生命姿态，透过与永嘉玄觉这个名字长达十四个世纪的紧密绑定，早已经由中国、朝鲜半岛、日本，一路传播至二十世纪的欧美世界，成为整个人类文明范围内，理解\"顿悟\"这一独特精神体验最重要的文学载体之一——这或许正是这位\"一宿觉\"留给后世最深远、也最难以被任何单一学术考订所穷尽的贡献。\n\n---\n\n## 参考文献与资料来源说明（分级 · 🔗 可回查）\n\n> 以下按语言、性质分类列出本文写作过程中检索、参考之主要资料来源，并依体例标注**信度分级**与**可回查链接**。\n> **分级**：**[A]** 一手/权威（原典校勘·权威出版社·同行评审学报·CBETA） · **[B]** 专著/学位论文/可靠期刊论文 · **[C]** 线索/待核（作者或出处未核实·网络百科·仅列站点性质者） · **[本宗]** 禅门自述讲记（不纳学术分级，一手链接仍可点）。🔗 指向 CBETA/机构原页；**无从核证者一律标〔待核〕、不臆造链接**。\n> **CBETA 约定**：本文原典经号均已核见于上列著录（T48n2014·2013·2008、T50n2061、T51n2076、T49n2035、卍续藏 X0586·X1513），链接为确定性拼接，不含手抄新号。\n> **本文主要透过网络公开检索完成**，未能逐一查证每一部专著、论文的具体版本、页码，供读者按图索骥、自行查证原始出处，不宜视为可替代原始学术文献的最终定论。\n\n### 一、原典与传统文献 **[A]**\n- **[A]** 永嘉玄觉：《永嘉证道歌》一卷（[CBETA：大正藏第四十八册，No. 2014](https://cbetaonline.dila.edu.tw/zh/T48n2014)）\n- **[A]** 永嘉玄觉（述）、魏靖（辑）：《禅宗永嘉集》一卷（[CBETA：大正藏第四十八册，No. 2013](https://cbetaonline.dila.edu.tw/zh/T48n2013)）\n- **[A]** 静、筠二禅师：《祖堂集》（通行排印本；CBETA 无在线公开本，本文引录自排印本，〔待核〕原始影印卷次）\n- **[A]** 赞宁：《宋高僧传》卷八（[CBETA：大正藏第五十册，No. 2061，卷八](https://cbetaonline.dila.edu.tw/zh/T50n2061_008)）\n- **[A]** 道原：《景德传灯录》卷五（[CBETA：大正藏第五十一册，No. 2076，卷五](https://cbetaonline.dila.edu.tw/zh/T51n2076_005)）\n- **[A]** 志磐：《佛祖统纪》卷十（[CBETA：大正藏第四十九册，No. 2035，卷十](https://cbetaonline.dila.edu.tw/zh/T49n2035_010)）\n- **[A]** 法海（集）：《六祖大师法宝坛经》\"一宿觉\"《机缘品》（[CBETA：大正藏第四十八册，No. 2008](https://cbetaonline.dila.edu.tw/zh/T48n2008)）\n- **[A]** 从义：《法华经三大部补注》卷十一（《卍续藏》X0586；[CBETA](https://cbetaonline.dila.edu.tw/zh/X0586_011)；\"夺他成己\"评语之确切出处，并附对澄观、宗密之批评）\n- **[A]** 宗鉴：《释门正统》（《卍续藏》X1513；[CBETA](https://cbetaonline.dila.edu.tw/zh/X75n1513)；载玄觉\"因览《涅槃经》洞明妙旨\"之异说）\n\n### 二、中文现代学术论著\n- **[A]** 陈盛港：〈永嘉证道歌原作者溯源并歌文比较〉，《中华佛学研究》第五期，台北：中华佛学研究所，2001 年 3 月，页 163—203（[中华佛学研究所论文全文](https://www.chibs.edu.tw/ch_html/chbs/05/chbs0507.htm)）\n- **[B]** 王雷泉：〈《禅宗永嘉集》提要〉，原载陈士强、王雷泉主编《中国佛教百科全书》，复旦大学出版社，1997（[爱思想学术平台转载全文](https://www.aisixiang.com/data/155147.html)）\n- **[本宗]** 常空：《月映千江：永嘉大师证道歌讲记》，上海古籍出版社\"佛典新读\"丛书，2018 年 8 月初版（588 页，ISBN 9787532589302）、2020 年精装改版（ISBN 9787532595549；凡二十五讲）\n- **[本宗]** 南怀瑾：相关讲述《证道歌》之著作及公开讲座内容 · 🔗〔版本待核〕\n\n### 三、英文现代学术论著\n- **[A]** Jia, Jinhua. *The Hongzhou School of Chan Buddhism in Eighth- through Tenth-Century China*. Albany: SUNY Press, 2006.（于第 89—95 页等处讨论《证道歌》可能的洪州宗起源）\n- **[A]** *Yongjia's Song of Actualizing the Way / Observing the Mind, Awakening from a Dream*. Trans. A. Charles Muller. BDK English Tripiṭaka Series, Bukkyo Dendo Kyokai America, 2021.（卷中间列《永嘉证道歌》T.2014 与良遍《观心觉梦钞》T.2312；译者导言论及前人\"五十六单元\"分段出处存疑）\n- **[B]** Suzuki, D. T. *Manual of Zen Buddhism*. 1935.（收录《证道歌》最早、影响最广的英译）\n- **[B]** Luk, Charles (Lu K'uan Yü). *Ch'an and Zen Teachings*. 1960.（首部英文注释本）\n- **[B]** Red Pine (Bill Porter). *Yung-Chia's Song of Enlightenment*. [Empty Bowl Press](https://emptybowl.org/), 2019.（63 页；按：此前多处网络书目误作 Copper Canyon Press）\n- **[B]** Park, Jin Y. 相关《证道歌》译文与讨论（另见本系列《李通玄长者综合深度研究》第一章 1.3 节所引其关于李通玄\"时间性\"哲学的论著）\n- **[C]** Hershock, Peter D. \"Turning the Wheel of Wonder\" 博客所刊《证道歌》多译本比较\n\n### 四、网络检索资料 **[C·线索]**\n> 以下**仅列站点性质/入口**，具体条目请自行检索核实；本文不为其内容背书，凡涉论断均已回退至上列一手来源。\n- 中文维基百科；[英文维基百科\"Song of Enlightenment\"条目](https://en.wikipedia.org/wiki/Song_of_Enlightenment) · **[C]**\n- 中台世界、简书等佛教媒体平台所刊永嘉玄觉传记及\"一宿觉\"公案资料（其中早年出处\"显密文库\"所载王雷泉提要，已在正文 1.1 节改依《中国佛教百科全书》及\"爱思想\"定本）· **[C]**\n- 陕西佛教祖庭相关网站所刊天台宗、永嘉玄觉关系考述文章 · **[C]**\n\n### 五、近年可补线索（〔待采〕·本区为地图反哺位）\n> 本系列迄今最国际化案例，英译接受史已较完备；后续可优先补：① **日文学界**永嘉/证道歌专题研究现状（本文自陈之明显缺口）；② Jia 洪州宗起源说之后《证道歌》作者归属之新论；③ Muller BDK 译本以外之多语对读本子。**未证者一律标〔待核〕、不臆造。**\n\n---\n\n*本文与姊妹篇《圭峰宗密综合深度研究》《华严宗初祖杜顺综合深度研究》《华严宗二祖智俨综合深度研究》《李通玄长者综合深度研究》共同构成本系列对唐代佛教关键人物的深度考察。永嘉玄觉是本系列中第一位主要归属禅宗（兼跨天台）而非华严宗的人物，其代表作《证道歌》的全球译介与接受史之丰富，亦是本系列迄今为止最为国际化的一个案例。受限于检索条件，本文对日文学界专题研究现状的呈现尚有明显局限，敬请读者以本文所列原始出处为线索，自行做进一步查证与批判性阅读。***", "data_source": null, "data_pool": null, "back": {"tab": "gap", "view": "topic-yongjia-xuanjue", "label": "华严文献 · 专题研究"}};

  if((typeof ARTICLE_BI!=='undefined')&&ARTICLE_BI&&(typeof renderArticleBI==='function')){
    var _b=(ARTICLE_BI.scorecard&&ARTICLE_BI.scorecard.items)||[];
    h+='<button class="f-nav-btn" onclick="biGo()" title="跳至文本分析层：漏斗、语义域、交叉表、相似度、聚类、PCA、网络与稳健性">📊 文本分析层（'+_b.length+' 项）</button>';

  // 叙事动画：仅当 build.py 内嵌了 MIAOYAN_NARR 时出现
  if((typeof MIAOYAN_NARR!=='undefined')&&MIAOYAN_NARR&&(MIAOYAN_NARR.beats||[]).length){

  }
  // 会众全景流程：仅当 build.py 内嵌了 ARTICLE_ASSEMBLY 且已加载 renderMiaoyanFlow 时出现
  if((typeof renderMiaoyanFlow==='function')&&(typeof ARTICLE_ASSEMBLY!=='undefined')&&ARTICLE_ASSEMBLY&&(ARTICLE_ASSEMBLY.classes||[]).length){
    var _afc=(ARTICLE_ASSEMBLY.classes||[]),_afn=0;_afc.forEach(function(c){_afn+=(c.members||[]).length;});
    h+='<button class="f-nav-btn" onclick="flowGo()" title="跳至会众全景流程图：依经文列次四十类五环之结构流程图">🗺️ 全景流程（'+_afc.length+' 类／'+_afn+' 名）</button>';
  }
  h+='<button id="article-en-toggle" class="f-nav-btn" onclick="toggleArticleEN()" title="在「含英文批注」与「仅中文正文」之间切换显示">🌐 英文批注：显示</button>';
  h+='</span></h2>';
  h+=embed.html;
  h+='</div>';

  // ── 会众名号文本分析层（EDA；仅当 build.py 内嵌 ARTICLE_EDA 时出现，由 common.js renderArticleEDA 填充）──
  if((typeof ARTICLE_EDA!=='undefined')&&ARTICLE_EDA&&ARTICLE_EDA.payload){
    h+='<div class="section" data-chrome="1" id="article-eda" style="border-left:4px solid var(--gold)"></div>';

  // ── 相关艺术品 · 文物 · 壁画 · 考古（默认折叠块，由 common.js renderArticleArtifacts 填充）──
  if((typeof ARTICLE_ARTIFACTS!=='undefined')&&ARTICLE_ARTIFACTS&&(ARTICLE_ARTIFACTS.items||[]).length){
    h+='<div class="section" data-chrome="1" id="article-artifacts" style="border-left:4px solid var(--gold)"></div>';
  }

  // ── 文本分析层（miaoyan_bi.yaml 解释层；置于页脚之前）──
  try{ if(typeof renderArticleBI==='function') h+=renderArticleBI(); }catch(e){}

  // ── 叙事动画（miaoyan_narrative.yaml 叙事节拍；仅当内嵌 MIAOYAN_NARR 时出现）──
  if((typeof MIAOYAN_NARR!=='undefined')&&MIAOYAN_NARR&&(MIAOYAN_NARR.beats||[]).length){
    h+='<div class="section" data-chrome="1" id="article-narrative" style="border-left:4px solid var(--gold)"></div>';
  }

  // ── 页脚 ──
  h+='<div style="margin-top:18px;padding-top:10px;border-top:1px solid var(--line);font-size:0.74em;color:var(--text2)">';
  h+='<a href="index.html" style="color:var(--blue);text-decoration:none">📚 返回独立文章目录</a>';
  if(a.back && a.back.tab){
    h+=' · <a href="../tabs/'+a.back.tab+'.html" style="color:var(--blue);text-decoration:none">'+a.back.label+'</a>';
  }
  h+='</div>';

  root.innerHTML=h;

  // ── 命中文档名相（自动扫描＋显式标记）──
  if(typeof _markTermRefs==='function' && document.getElementById('article-full')){
    _markTermRefs('#article-full');
  }
  // ── 正文配图收为缩略图，点击看原图 ──
  if(typeof initDocImages==='function' && document.getElementById('article-full')){
    initDocImages('#article-full');
  }
  // ── 相关艺术品/文物/壁画/考古（默认折叠）──
  if(typeof renderArticleArtifacts==='function' && document.getElementById('article-artifacts')){
    renderArticleArtifacts('#article-artifacts');
  }
  // ── 会众名号文本分析层（EDA）──
  if(typeof renderArticleEDA==='function' && document.getElementById('article-eda')){
    renderArticleEDA('#article-eda');
  }

  // ── 会众全景流程图（MiaoyanFlow；简明结构流程图）──
  if(typeof renderMiaoyanFlow==='function' && document.getElementById('article-flow')){
    try{ renderMiaoyanFlow('#article-flow'); }catch(e){ console.warn('flow', e); }
  }

  // ── 叙事动画播放器（MiaoyanNarrative）──
  if(typeof renderMiaoyanNarrative==='function' && document.getElementById('article-narrative')){
    try{ renderMiaoyanNarrative('#article-narrative'); }catch(e){ console.warn('narrative', e); }
  }

  // ── 阅读模式：识别「英文/术语批注」块，支持仅中文正文切换 ──

  // ── 章节级折叠：h2/h3/h4/h5 分级折叠（默认全部折叠；标题 ▾ 号点击可单独收展）──

  // 文本分析层须在其内容渲染完毕后再折叠，故置于 renderArticleEDA 之后。
  if(typeof _foldDoc==='function'){
    try{ _foldDoc('#article-full'); }catch(e){}
    try{ _foldDoc('#article-eda', {label:'文本分析层'}); }catch(e){}
    try{ _foldDoc('#article-narrative', {label:'叙事动画'}); }catch(e){}
  }

  // ── 支持 #锚点 直达（目录跳转用真实 id 锚点；先展开折叠祖先节）──
  if(location.hash){

        el.scrollIntoView({behavior:'smooth',block:'start'});

// ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);
  }
}
function _applyArticleENMode(){
  var full=document.getElementById('article-full');
  var btn=document.getElementById('article-en-toggle');
  var hide=(sessionStorage.getItem('article_en_hide')||'')==='1';
  if(full) full.classList.toggle('en-hidden', hide);
  if(btn) btn.textContent=hide?'🌐 英文批注：展开':'🌐 英文批注：显示';
}/* ============================================================================
 * renderArticleBI —— 世主妙严品文本分析层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(BI)。
 *     故本层各节标题皆标 [BI]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 文本分析层</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Textual Analysis Layer</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}

</script>
