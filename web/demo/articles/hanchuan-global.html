能是一次转折。**目前绝大多数寺院，在这道门口是空的。**（判断）\n\n> **EN对应 · 11. Commercialization and the Dilution of Substance**\n>\n> The commercialization of mainland temples has been discussed in the press for years: inflated admission fees, overpriced incense, aggressive souvenir sales, and the accompanying question of whether Buddhist substance is being corroded. The government has introduced price caps and bans on forced donations.\n>\n> Shaolin Temple is an extreme case. It turned Chan martial culture into an international brand, at the cost of labels such as \"CEO monk\" and the continuing controversy over the Australian land purchase described in Chapter Seven. The lesson of the Shaolin model is not that cultural export is wrong. It is that **when a religious brand's value comes to be defined chiefly by its commercial valuation, it loses control of its own narrative.**\n>\n> The other side should be seen as well. The youth \"temple boom\" is real: Ctrip data show temple ticket bookings up 310 percent year on year in February 2023, with nearly half of purchasers born in the 1990s or 2000s (Grade C, [Securities Times](https://stcn.com/article/detail/826023.html); note that the statistical window is \"since the start of the year,\" not a single month). Interviews by the *Global Times* found mixed motives, not faith. Observations at the end of 2025 likewise concluded that Buddhism in China appears more as a lifestyle and a form of mental and physical healing than as a religion. No evidence yet shows the boom converting into identity (CGSS 2021 remains at 4 percent). (Judgment)\n>\n> **Whether the boom is an asset or a liability depends on whether anyone is there to catch it.** If a young person walks into a temple because it photographs well and walks out with only a photograph, that was consumption. If someone hands her a clearly written pamphlet at the door, or tells her there is a Wednesday evening gathering for beginners, it might be a turning point. **At present, at most temples, that door is unattended.** (Judgment)\n\n---\n\n## 十二、统计盲区\n\n这一章很短，因为它要说的只有一句：**我们说不清自己的家底。**\n\n前面已经出现过一次：全球汉传信众没有数字。这里再加上几条同类型的空缺——马来西亚、印尼、泰国、越南等地汉传社群的分口径数据没有；欧洲佛教徒中汉传所占比例没有；海外汉传僧人总数没有。\n\n同一组织的数字口径相差悬殊：佛光山\"200+ / 300+ 座道场 / 40 国 / 100+ 国\"，慈济\"志工 68 国 / 援助 136 国 / 103 国\"。\"覆盖 X 国\"往往把道场、联络处、活动与援助对象混在一起。\n\n这不只是\"数字不好看\"的问题，而是一项**能力缺陷**。原因有三层：\n\n一是**统计对象本身难界定**。\"什么算一座汉传道场\"——共用一个殿堂的联络处算不算？居士林的共修点算不算？以禅修为主的中心算不算？界定不同，数字可以差数倍。\n\n二是**统计主体缺位**。没有一个跨教团、跨地区的机构负责这件事，各教团自报口径，互不通约，也不对外审计。\n\n三是**统计意愿不足**。数字大一点在募款与传播上有好处，这个动机普遍存在，而它必然侵蚀数据的严肃性。\n\n**一项事业如果无法度量自己，就无法为自己排序。**（判断）翻译、教育、人才培养，哪一样都优先于它，但哪一样都缺它不可。\n\n> **EN对应 · 12. The Statistical Blind Spot**\n>\n> This chapter is short because it has only one thing to say: **we cannot accurately state what we hold.**\n>\n> It has appeared once already: there is no global figure for Chinese Buddhist adherents. To that we add more of the same kind—there is no disaggregated data for Chinese Buddhist communities in Malaysia, Indonesia, Thailand, or Vietnam; no proportion for Chinese Buddhism within the European Buddhist population; no total for overseas Chinese Buddhist monastics.\n>\n> Within a single organization, figures vary widely: Foguang Shan at \"200+ / 300+ temples / 40 countries / 100+ countries,\" Tzu Chi at \"volunteers in 68 countries / relief reach 136 / 103.\" \"Present in N countries\" routinely blends temples, liaison offices, events, and relief recipients into one number.\n>\n> This is not merely a matter of unflattering numbers. It is a **capacity deficit**, for three reasons.\n>\n> First, **the object of measurement is hard to define.** What counts as a Chinese Buddhist temple? A liaison office sharing a hall? A lay practice group? A meditation centre with no monastic? Change the definition and the figure can shift severalfold.\n>\n> Second, **there is no measuring body.** No cross-order, cross-regional institution is charged with the task; orders report by their own definitions, the definitions are not commensurable, and nothing is externally audited.\n>\n> Third, **the will to measure is weak.** Larger numbers help with fundraising and publicity. That motive is widespread, and it necessarily corrodes the seriousness of the data.\n>\n> **An enterprise that cannot measure itself cannot prioritize itself.** (Judgment) Translation, education, and the training of personnel all take precedence over this—and none of them can proceed without it.\n\n---\n\n## 十三、宗派间话语的不对称\n\n全球佛教的对外格局中，藏传与南传各占了一个位置，汉传没有。\n\n藏传凭藉五部大论的格鲁派学修体系、显密双修的完整次第，以及达赖喇嘛等领袖的国际知名度，在西方知识界与精英阶层中确立了高端学术形象。南传凭藉巴利三藏的明晰性与内观禅修的推广，占据了西方大众禅修的主流市场。\n\n汉传拥有天台、华严、唯识、禅、净土等完整的宗派教理体系，在西方却常被理解为\"缺乏系统逻辑教理，偏重感性祈福与迷信仪式\"。这个印象的成因，第九章已作分析，此处补充一条更少被提及的：**汉传自己在对外介绍时，很少把义理体系讲清楚。**\n\n一个可以对照的细节：藏传在西方传播时，格西学位、五部大论、辩经制度这些\"制度性的东西\"被反复介绍，构成了可辨识的学术形象。汉传介绍自己时，讲得最多的是\"禅\"与\"人间佛教\"——前者易被简化为冥想，后者易被简化为慈善。**天台的一心三观、华严的四法界、唯识的八识，在中文世界的介绍材料里连篇累牍，在英文世界里却几乎无人讲述。**（判断）\n\n这不是\"别人不识货\"的问题。一个传统若不能用自己的语言之外的语言把义理讲清楚，它在国际学术与宗教对话场合就没有话语权。话语权从来不是分配的，是挣来的。\n\n> **EN对应 · 13. The Asymmetry of Discursive Power among Traditions**\n>\n> Tibetan and Theravāda Buddhism each occupy a position in the global Buddhist landscape. Chinese Buddhism occupies none.\n>\n> Tibetan Buddhism secured a high-end academic image among Western intellectuals and elites through the Gelug study system of the five great treatises, the complete sequence of sutra and tantra, and the international prominence of figures such as the Dalai Lama. Theravāda captured the mainstream Western meditation market through the clarity of the Pali canon and the spread of vipassanā.\n>\n> Chinese Buddhism possesses complete scholastic systems in Tiantai, Huayan, Yogācāra, Chan, and Pure Land, yet abroad is commonly understood as \"lacking systematic doctrinal logic, leaning toward emotional prayer and superstitious ritual.\" Chapter Nine analysed the causes. One further cause is less often mentioned: **Chinese Buddhism rarely explains its doctrinal systems clearly when presenting itself abroad.**\n>\n> A detail for comparison: when Tibetan Buddhism spread in the West, the institutional features—the geshe degree, the five great treatises, the debate curriculum—were repeatedly introduced, forming a recognizable academic image. When Chinese Buddhism introduces itself, what gets told most is \"Chan\" and \"Humanistic Buddhism\"—the first easily reduced to meditation, the second to charity. **Tiantai's one mind and three contemplations, Huayan's four dharma-realms, and Yogācāra's eight consciousnesses fill volumes of Chinese-language introductory material and are almost nowhere narrated in English.** (Judgment)\n>\n> This is not a case of others failing to appreciate the goods. A tradition that cannot explain its doctrine in a language other than its own has no voice in international scholarship or interreligious dialogue. A voice is never allocated. It is earned.\n\n---\n\n# 第三部　变量：新技术与 AI\n\n> 这一部要回答的不是\"AI 是什么\"，而是\"AI 改变了什么\"——具体说，它改变了汉传佛教做哪些事的成本、改变了谁有资格做、改变了做出来给谁看。凡不能落到这三样上的技术描述，本文一概略过。\n\n## 十四、从数字化到知识工程化\n\n佛教与数字技术的关系，大致走过三个阶段。\n\n第一阶段是**数字保存**：把纸质经典、碑刻、寺志、图像、音视频转成数字资源。这一阶段的目标是\"不丢失\"。\n\n第二阶段是**数字检索与传播**：让用户能够在线搜索、阅读、观看、听闻、参与。目标从\"不丢失\"变成\"能取到\"。\n\n第三阶段正在到来，即**计算性佛学（computational Buddhist studies）与智能化佛教知识系统**：机器不仅存储文本，而且可以跨文本、跨版本、跨语言、跨人物、跨时空建立关系，帮助研究者提出过去很难提出的问题。目标从\"能取到\"变成\"能被机器理解和推理\"。\n\n这一转变的实证基础已经比较明确。CBETA 长期采用 TEI/XML 结构化编码，使经典不仅可读，也可被机器处理、引用、分析。东京大学的 SAT 项目把《大正新修大藏经》数字文本与原始页面定位结合，使研究者可以在数字文本与影像之间核验——2012 版起提供原书页面影像，可定位到行（A 级，[SAT](https://21dzk.l.u-tokyo.ac.jp/SAT/)）。法鼓文理学院的 DILA 综合检索系统整合了十多个佛教数字档案，公开检索量超过 **1.6 亿字符**（A 级·【自述】，[DILA iSearch](https://isearch.dila.edu.tw/)）。\n\nBDRC 的 BUDA 平台公开提供超过 **1700 万页**佛教资料（A 级·【自述】〔[bdrc.io](https://www.bdrc.io/)〕；该机构 2023 年另有\"59,000 余册、3000 万幅图像\"的口径，两说并存）。2025 年 3 月 14 日，BDRC 发布藏文 OCR 桌面工具，免费开源，可批量处理图片与整册 PDF。2026 年 2 月 28 日，它公告启动面向 AI 的开放佛教数据集计划，明确要把经过人工转录、OCR、多版本比较与交叉验证的数据建成适用于 AI 训练与研究的开放语料；项目 2025 年 12 月启动，Khyentse 基金会资助，首席研究员为 CTO Élie Roux，规模以\"数百万页\"计。公告后两个月的进度：Gold Standard 语料从 1.9 GB 增至 3.4 GB，2600 万余幅图像完成 OCR，约 3.5 万幅图与转写完成对齐（A 级，[BDRC 公告](https://www.bdrc.io/blog/2026/02/28/)）。\n\n这些数字本身不重要，重要的是它们指向的目标已经变了：**从\"把佛典放到网上\"，变成\"把佛教文明建成可验证、可关联、可计算、可引用、可翻译、可供 AI 可靠使用的知识体系\"。**\n\n对汉传佛教而言，这个转变有一层特殊意义。**知识基础设施是少数几件不依赖\"传教\"就能做的事。** 它不需要对方先接受你的信仰，不需要跨过身份与政治的关口，也不需要说服任何人\"我是好的\"。它只需要把典籍整理好、把术语定清楚、把出处标明白——做完了，全世界的学者、译者、开发者、学习者都会用，用的时候自然会知道这是谁做的。（判断）\n\n而这也意味着，汉传在这件事上落后，不是\"少了一个宣传渠道\"，而是**在别人构建未来佛学知识秩序的时候缺席**。十年之后，如果全球佛学 AI 的语料、术语、知识图谱、评测基准都已定型，而其中汉传的部分是稀薄甚至错误的，那么后来者能做的就只有适配，而不是定义。\n\n> **EN对应 · 14. From Digitization to Knowledge Engineering**\n>\n> The relationship between Buddhism and digital technology has passed through roughly three stages.\n>\n> The first was **digital preservation**: converting paper canons, steles, temple gazetteers, images, and audiovisual material into digital resources. The goal was \"not to lose it.\"\n>\n> The second was **digital retrieval and dissemination**: allowing users to search, read, watch, listen, and participate online. The goal shifted from \"not lost\" to \"retrievable.\"\n>\n> The third is arriving now: **computational Buddhist studies and intelligent knowledge systems**. Machines not only store texts but establish relations across texts, editions, languages, persons, and periods, helping researchers pose questions that were previously very hard to pose. The goal shifts again, from \"retrievable\" to \"machine-understandable and machine-reasonable.\"\n>\n> The empirical basis for this shift is already clear. CBETA has long used TEI/XML structured encoding, so that texts can be read and also processed, cited, and analysed by machine. The University of Tokyo's SAT project joins the digital text of the Taishō canon to page images, letting scholars verify between text and image—page images have been available since the 2012 version, locatable down to the line (Grade A, [SAT](https://21dzk.l.u-tokyo.ac.jp/SAT/)). Dharma Drum Mountain's DILA integrated search system brings together more than ten Buddhist digital archives and exposes over **160 million characters** to public search (Grade A, self-reported, [DILA iSearch](https://isearch.dila.edu.tw/)).\n>\n> BDRC's BUDA platform publicly offers more than **17 million pages** of Buddhist material (Grade A, self-reported, [bdrc.io](https://www.bdrc.io/); the same institution elsewhere gives \"over 59,000 volumes and over 30 million images\"—the two figures stand side by side). On 14 March 2025 BDRC released a desktop Tibetan OCR tool, free and open source, able to batch-process images and whole PDF volumes. On 28 February 2026 it announced a major initiative to build open Buddhist datasets for AI, explicitly aiming to turn human-transcribed, OCR'd, edition-compared, and cross-validated data into open corpora suitable for AI training and research. The project began in December 2025 with funding from the Khyentse Foundation, led by CTO Élie Roux as principal investigator, at a scale measured in millions of pages. Two months of progress: Gold Standard corpora grew from 1.9 GB to 3.4 GB, over 26 million images passed through OCR, and about 35,000 images were aligned with transcriptions (Grade A, [BDRC announcement](https://www.bdrc.io/blog/2026/02/28/)).\n>\n> The figures themselves matter less than what they point to: **the goal has changed from \"putting the canon online\" to \"building Buddhist civilization into a knowledge system that is verifiable, linkable, computable, citable, translatable, and reliably usable by AI.\"**\n>\n> For Chinese Buddhism this shift carries a particular significance. **Knowledge infrastructure is one of the few things that can be done without proselytizing.** It does not require the other party to accept your faith first, or to cross the barriers of identity and politics, or to be persuaded that you are good. It requires only that the texts be properly organized, the terminology clearly fixed, and the sources plainly marked. Do that, and scholars, translators, developers, and learners worldwide will use it—and in using it, they will know who made it. (Judgment)\n>\n> Which also means that falling behind here is not \"missing a publicity channel.\" It is **being absent while others build the future order of Buddhist knowledge.** Ten years from now, if the corpora, terminology, knowledge graphs, and evaluation benchmarks of global Buddhist AI have all set hard, and the Chinese Buddhist portion within them is thin or wrong, then latecomers will be able to adapt to that order—but not define it.\n\n---\n\n## 十五、八层基础设施\n\n一套理想的佛教知识系统，至少要有八层。\n\n| 层级 | 核心内容 | 相关技术 |\n|------|----------|----------|\n| 1. 原始资料层 | 大藏经、敦煌写本、碑刻、语录、灯录、寺志、地方志、报刊 | 扫描、OCR/HTR、图像识别 |\n| 2. 权威文本层 | 不同版本、校勘本、异文、断句、标点 | TEI/XML、版本控制 |\n| 3. 元数据层 | 经名、作者、译者、年代、卷次、出处、版本、版权 | Linked Data、标准元数据 |\n| 4. 术语层 | 梵／巴利／藏／汉／英术语及异译 | 术语库、本体（ontology） |\n| 5. 关系层 | 人物、法脉、寺院、文献、概念、历史事件之间的关系 | 知识图谱 |\n| 6. 语义层 | 段落、主题、概念、引文、相似文、跨语种对应 | 向量嵌入、语义检索 |\n| 7. AI 层 | RAG、LLM、翻译、分类、摘要、问答、智能体 | 大模型、视觉语言模型、Agent |\n| 8. 验证层 | 原典出处、版本、页码、证据链、专家修订记录 | 溯源（provenance）、审计日志 |\n\nCBETA 的 TEI/XML 实践已经证明佛典完全可以成为标准化的数字人文对象；SAT 则进一步强调\"数字文本必须能够回到原始页面核验\"，这是未来佛教 AI 可信性的基本原则。\n\n由此可以推出一个与流行看法相反的结论：**佛教 AI 的核心竞争力，首先不在\"模型有多大\"，而在底层语料是否权威、版本是否清楚、出处是否可追溯、术语是否规范、不同传统是否被正确区分。**（判断）\n\n这个判断有一个直接的推论，值得单独说：**训练一个佛教大模型，对汉传佛教而言几乎肯定不是最优投入。** 通用大模型的能力在快速提升，自建模型的门槛与折旧速度都在恶化；而权威语料、规范术语、清晰版本、可追溯出处这些东西，一旦建成，其价值不随模型换代而贬值，反而随每一次模型升级而放大。**把钱花在语料上，比花在参数上更划算。**（判断）\n\n> **EN对应 · 15. Eight Layers of Infrastructure**\n>\n> An adequate Buddhist knowledge system needs at least eight layers.\n>\n> | Layer | Core content | Relevant technology |\n> |---|---|---|\n> | 1. Source material | Canons, Dunhuang manuscripts, steles, recorded sayings, transmission records, temple gazetteers, local gazetteers, periodicals | Scanning, OCR/HTR, image recognition |\n> | 2. Authoritative text | Editions, critical editions, variant readings, punctuation | TEI/XML, version control |\n> | 3. Metadata | Title, author, translator, date, fascicle, provenance, edition, rights | Linked Data, standard metadata |\n> | 4. Terminology | Sanskrit, Pali, Tibetan, Chinese, English terms and their variants | Terminology databases, ontologies |\n> | 5. Relations | Relations among persons, lineages, temples, texts, concepts, and events | Knowledge graphs |\n> | 6. Semantics | Passages, topics, concepts, quotations, parallel passages, cross-lingual correspondences | Embeddings, semantic search |\n> | 7. AI | RAG, LLMs, translation, classification, summarization, question answering, agents | Large models, vision-language models, agents |\n> | 8. Verification | Canonical provenance, edition, page, chain of evidence, expert revision records | Provenance tracking, audit logs |\n>\n> CBETA's TEI/XML practice has already shown that Buddhist texts can be fully standard digital humanities objects. SAT presses the further point that a digital text must be verifiable against the original page. That is the basic principle of credibility for Buddhist AI.\n>\n> From which follows a conclusion contrary to the prevailing view: **the core competitiveness of Buddhist AI lies first not in how large the model is, but in whether the underlying corpus is authoritative, whether editions are clear, whether provenance is traceable, whether terminology is standardized, and whether the traditions are correctly distinguished.** (Judgment)\n>\n> One corollary deserves separate statement: **training a Buddhist large model is almost certainly not the optimal investment for Chinese Buddhism.** General model capabilities are improving rapidly; the cost of building one's own model and the speed at which it depreciates are both worsening. Authoritative corpora, standardized terminology, clear editions, and traceable provenance, by contrast, do not lose value when models change—they gain value with every upgrade. **Money spent on corpora is better spent than money spent on parameters.** (Judgment)\n\n---\n\n## 十六、AI 辅助佛学研究：放大，而不是替代\n\nAI 在佛学研究上真正有价值的地方，不是替学者思考，是把他从\"做不完\"里解放出来。\n\n### 从关键词检索到语义检索\n\n传统检索依赖\"你得先知道关键词\"。研究者想知道唐宋时期关于\"无念\"的论述，就必须先想到\"无念\"这个词，还得想到它的异写、别译、别称。想不全，就搜不全。\n\n语义检索改变的是这一步。研究者可以直接提出：\n\n> 找出唐宋时期关于\"无念\"概念的论述，并区分禅宗、天台、华严、净土传统。\n\n系统先做语义召回，再按年代、宗派、人物、文本类型过滤，最后返回原文、卷页、版本信息。这比全文搜索更接近真正的学术工作流。DILA 已有面向多个佛教数字档案的综合检索体系；伯克利 Dharmamitra 项目的 MITRASearch 则把语义检索扩展到了跨语种。\n\n### 文本复用：一个过去做不完的问题\n\nAI 特别适合处理一个传统佛学研究很难大规模完成的问题：**\"这句话以前在哪里出现过？\"**\n\n把数千万字佛典转成向量之后，可以做的事包括：跨卷引用识别、同义改写识别、文本复用检测、伪引文识别、引文传播路径分析、不同注疏之间的思想继承关系分析。\n\n这有可能改变思想史研究的形态。过去一个学者可能花数年追踪一个人物、一部经典、一条引文；未来机器先完成大规模候选发现，再由学者进行解释。\n\n**佛学研究因此可能从\"小规模精读\"扩展为\"精读 + 大规模计算发现\"。** 这不是 AI 替代学者，而是把学者从检索工作中解放出来，投到判断工作中去。\n\n### 法脉、人物与寺院的知识图谱\n\n把佛教历史重建成动态网络——人物、师承、寺院、地域、著作、讲学活动、法脉、时代、社会网络——之后，可以研究的问题包括：某一禅宗法脉在不同世纪的传播路径；某部经典由哪些人物引用最多；某寺院与哪些学者、僧侣发生过知识交流；某一思想概念在哪些历史时期快速扩散；中国、日本、韩国、越南之间的思想传播网络。\n\n法鼓文理学院 2026 年 5 月的数典专案春季成果发表会，已把\"圣严法师年谱知识图谱\"\"佛典语义搜索\"\"大型语言模型与佛教数字文献\"列为实际研究议题，并用六步流程（义项合并、摘要改写、义项分类、关系抽取验证、S-P-O 三元组抽取、实体链接）构建佛教知识图谱（A 级，[CBETA 活动报导](https://cbeta.org/post/30491)）。同一场发表会上，有研究者以 Obsidian 与 Claude Code 建立了《俱舍论注杂录》的引文库。\n\n需说明两处：其一，该场发表会的内容包含 614 笔引文库、平行文本索引与六版本对勘，流传材料中\"《阿含》关联可视化\"的表述与该场实际内容有出入；其二，CBETA 官网刊载法鼓山数典的内容，源于两者同源——CBETA 1998 年由中华佛学研究所支持成立，圣严法师指示全力支持；2023 年法人化时法鼓山佛教基金会捐资 1,300 万，是最大捐助者。\n\n### 一个容易被夸大的边界\n\n上述都是真实的能力，但有一个边界必须标明：**知识图谱与语义检索能发现\"关联\"，不能判定\"意义\"。** 机器可以告诉你某条引文在二百部文献中出现过，不能告诉你哪一次引用是承袭、哪一次是反驳、哪一次是误读。宗派教义的判定、思想史的因果、文本的思想分量，仍然只能由受过训练的人来做。\n\n> **EN对应 · 16. AI in Buddhist Studies: Amplification, Not Replacement**\n>\n> Where AI genuinely helps Buddhist studies is not in thinking for the scholar but in releasing him from work that cannot be finished.\n>\n> **From keyword search to semantic search.** Traditional retrieval depends on already knowing the keyword. A researcher wanting to know what was said about \"no-thought\" (無念) in the Tang and Song must first think of the term itself, then of its variant writings, alternate translations, and other names. Fail to think of them all, and the search is incomplete.\n>\n> Semantic search changes that step. The researcher can simply ask:\n>\n> > Find discussions of the concept of \"no-thought\" in the Tang and Song, and distinguish the Chan, Tiantai, Huayan, and Pure Land traditions.\n>\n> The system performs semantic recall first, then filters by period, school, person, and text type, and returns the original text with fascicle, page, and edition information. This comes closer to a real scholarly workflow than full-text search does. DILA already offers integrated search across multiple Buddhist digital archives; MITRASearch, from the Dharmamitra project at Berkeley, extends semantic search across languages.\n>\n> **Textual reuse: a question that could not previously be finished.** AI is especially suited to a problem traditional Buddhist scholarship could never complete at scale: **\"Where has this sentence appeared before?\"**\n>\n> Once tens of millions of characters are converted to vectors, the possible operations include detecting cross-fascicle quotation, identifying paraphrase, detecting textual reuse, spotting false attributions, tracing the paths by which a quotation travelled, and analysing intellectual inheritance among commentaries.\n>\n> This may change the shape of intellectual history. A scholar might once have spent years tracing one figure, one scripture, one quotation. In future the machine completes the large-scale discovery of candidates first, and the scholar interprets.\n>\n> **Buddhist studies may therefore expand from \"small-scale close reading\" to \"close reading plus large-scale computational discovery.\"** This is not AI replacing the scholar. It is releasing the scholar from retrieval and redirecting him to judgment.\n>\n> **Knowledge graphs of lineages, persons, and temples.** Once Buddhist history is rebuilt as a dynamic network—persons, teachers, temples, regions, works, teaching activity, lineages, periods, social networks—the questions that become tractable include: the spread of a Chan lineage across centuries; which figures cite a given scripture most; what intellectual exchanges took place between a temple and particular scholars or monastics; in which periods a concept diffused rapidly; and the networks of intellectual transmission among China, Japan, Korea, and Vietnam.\n>\n> At the Digital Classics project's spring results presentation in May 2026 at Dharma Drum Institute of Liberal Arts, \"a knowledge graph of Master Sheng Yen's chronological biography,\" \"semantic search of Buddhist texts,\" and \"large language models and Buddhist digital literature\" were listed as active research topics, and a six-step process was used to build a Buddhist knowledge graph—merging senses, rewriting summaries, classifying senses, extracting and validating relations, extracting subject-predicate-object triples, and entity linking (Grade A, [CBETA event report](https://cbeta.org/post/30491)). At the same presentation, a researcher used Obsidian and Claude Code to build a citation database for the *Abhidharmakośa-bhāṣya-ṭīkā Tattvārthā*.\n>\n> Two clarifications. First, the presentation concerned 614 citation records, a parallel-text index, and a six-edition collation; the circulating description \"visualization of Āgama relations\" does not match what the session actually covered. Second, the reason CBETA's website carries Dharma Drum's Digital Classics material is common origin: CBETA was founded in 1998 with the support of the Chung-Hwa Institute of Buddhist Studies at Master Sheng Yen's instruction, and at incorporation in 2023 the Dharma Drum Mountain Buddhist Foundation donated NT$13 million as its largest contributor.\n>\n> **One boundary easily overstated.** All of the above are real capabilities, but one limit must be marked: **knowledge graphs and semantic search can discover relations; they cannot determine meaning.** A machine can tell you that a quotation appears in two hundred texts. It cannot tell you which appearance is inheritance, which is refutation, which is misreading. Doctrinal adjudication, causal explanation in intellectual history, and the intellectual weight of a text remain work for trained people.\n\n---\n\n## 十七、LLM 能与不能：一份任务分级\n\n把任务列成一张表，比笼统地说\"AI 很有用\"或\"AI 不可靠\"要有用得多。\n\n| 任务 | AI 适用程度 | 原因 |\n|------|------------|------|\n| 文章摘要 | 高 | 可由人工快速核验 |\n| 关键词提取 | 高 | 结构化任务 |\n| 初步文献综述 | 高 | 适合召回与整理 |\n| 相似文寻找 | 高 | 机器优势明显 |\n| 多版本比对 | 高 | 可大规模自动化 |\n| 跨语种资料发现 | 高 | LLM 的优势领域 |\n| 术语候选解释 | 中高 | 必须回原典 |\n| 机器翻译初稿 | 中高 | 可明显提高效率 |\n| 思想史解释 | 中 | 必须依赖专家判断 |\n| 宗派教义判定 | 中低 | 易把不同传统混淆 |\n| 经典最终翻译 | 低 | 需专业译者 |\n| 戒律判断 | 低 | 涉及传统与具体情境 |\n| 指导高风险修行问题 | 很低 | AI 不应承担最终权威角色 |\n| 断定\"某观点就是佛法真义\" | 很低 | 涉及复杂传统与诠释权 |\n\n这张表的用途很实在：**它把\"要不要用 AI\"这个笼统问题，换成了\"这件事在哪一档\"。** 摘要、检索、找相似文、比对版本——放心用。最终翻译、戒律判断、教义裁定、高风险修行指导——不能用，或者只能在人明确担责的前提下用。\n\n需要补充的是这张表之外的一个事实：LLM 的幻觉问题并不限于佛学领域。*Nature* 上的一项研究提出了用语义熵检测 LLM 幻觉的方法，并指出模型即使在语言流畅度很高时仍会产生无根据的答案（B 级，Farquhar 等，*Nature* 630:625–630, 2024）。而学术引用能力尤其不能盲信：一项跨学科评估发现，ChatGPT 生成的文献引用存在真实度与 DOI 准确性问题，自然科学场景下 DOI 准确率约 32.7%，**人文学科场景下仅 8.5%**，DOI 幻觉率达 89.4%（B 级，Mugaanyi 等，*J Med Internet Res* 26:e52935, 2024）。\n\n人文学科 8.5% 这个数字，佛学正落在它里面。所以佛学 AI 必须有自己的防幻觉机制——不是\"更小心一点\"，是结构性的。\n\n> **EN对应 · 17. What LLMs Can and Cannot Do: A Task Grading**\n>\n> A table serves better than a blanket claim that AI is useful or that AI is unreliable.\n>\n> | Task | Suitability | Reason |\n> |---|---|---|\n> | Summarizing articles | High | Quickly verified by a human |\n> | Keyword extraction | High | Structured task |\n> | Preliminary literature review | High | Suited to recall and organization |\n> | Finding parallel passages | High | Clear machine advantage |\n> | Comparing editions | High | Automatable at scale |\n> | Cross-lingual source discovery | High | An LLM strength |\n> | Candidate explanations of terms | Medium-high | Must be checked against the canon |\n> | Machine translation drafts | Medium-high | Marked efficiency gains |\n> | Explaining intellectual history | Medium | Requires expert judgment |\n> | Doctrinal adjudication among schools | Medium-low | Prone to conflating traditions |\n> | Final translation of scripture | Low | Requires a professional translator |\n> | Vinaya judgments | Low | Depends on tradition and circumstance |\n> | Guiding high-risk practice questions | Very low | AI should not hold final authority |\n> | Declaring \"this is the true meaning of the dharma\" | Very low | Involves complex traditions and interpretive authority |\n>\n> The table's use is practical: **it converts the vague question \"should we use AI?\" into \"which tier does this task fall in?\"** Summarizing, retrieval, finding parallel passages, comparing editions—use it freely. Final translation, vinaya judgment, doctrinal adjudication, guidance on high-risk practice—not usable, or usable only where a human explicitly bears responsibility.\n>\n> One fact outside the table should be added. Hallucination is not specific to Buddhist studies. A study in *Nature* proposed detecting LLM hallucination using semantic entropy, noting that models produce unsubstantiated answers even when their fluency is high (Grade B, Farquhar et al., *Nature* 630:625–630, 2024). Citation behaviour in particular cannot be trusted blindly: a cross-disciplinary evaluation found that ChatGPT's generated citations have problems of authenticity and DOI accuracy, with DOI accuracy around 32.7 percent in the natural sciences and **only 8.5 percent in the humanities**, and a DOI hallucination rate of 89.4 percent (Grade B, Mugaanyi et al., *J Med Internet Res* 26:e52935, 2024).\n>\n> Buddhist studies falls inside that 8.5 percent. Buddhist AI therefore requires its own anti-hallucination mechanism—not \"greater care,\" but something structural.\n\n---\n\n## 十八、「可信佛学 AI」的标准工作流\n\n任何一个专业佛学 AI，都应当采用这样的流程：\n\n```\nAI 生成\n  ↓\n检索增强（RAG）\n  ↓\n原典定位\n  ↓\n卷／页／段落核验\n  ↓\n多版本比较\n  ↓\n第二来源交叉验证\n  ↓\n专家复核\n  ↓\n生成最终答案\n  ↓\n保留证据链与模型版本\n```\n\n关键原则只有一句：\n\n> **AI 可以提出解释，但原典才是证据；AI 可以提出假设，但学者负责判断。**\n\n举一个具体的例子。用户问：\"「应无所住而生其心」在禅宗意味着什么？\"\n\n系统不应直接给出一段现代哲学解释。它至少应同时提供：《金刚经》原文；CBETA 或其他权威版本的出处；相关异文；鸠摩罗什译本；代表性古代注疏；禅宗相关解释；现代学术研究；AI 的综合解释——并且明确区分哪一段是\"经典原文\"、哪一段是\"历史注释\"、哪一段是\"现代学者观点\"、哪一段是\"AI 综合\"。\n\n这个设计的目的很单纯：**把\"AI 把自己的解释冒充经典\"这个风险，从\"依靠模型自觉\"降为\"依靠产品结构\"。** 模型会出错，结构不会撒谎。\n\n84000 对 AI 辅助佛典翻译采取的也是类似思路。其公开立场文件的原文是：「these sacred texts should not be processed using machine translation alone」「The primary actor in the translation of sacred literature must always be the human mind.」同时它也承认工具的价值：「84000 believes that the use of AI as a tool to assist translation has considerable value」。它列举的 AI 用途包括：检查译文是否有遗漏与错误；提供备选译法；在藏文、梵文、汉文原本之间寻找相关段落；识别不同译本之间的不一致；帮助定位人物、地点与术语（A 级，[84000 立场文件](https://84000.co/documents/84000s-position-on-ai-and-the-machine-translation-of-canonical-literature)）。\n\n这一立场的分量在于：它既不是\"AI 万能论\"，也不是\"AI 威胁论\"，而是一份**职责划分说明书**。哪些交给机器，哪些必须由人负责，写得清清楚楚。汉传若有类似的公开立场，将省去大量重复争论。\n\n这些原则与 UNESCO 针对生成式 AI 教育与研究所倡导的\"以人为中心\"、数据保护、人类监督等原则方向一致（A 级，[UNESCO《教育与研究中的生成式 AI 指南》](https://www.unesco.org/en/articles/guidance-generative-ai-education-and-research?hub=253682)，2023 年 9 月 7 日发布）。\n\n> **EN对应 · 18. A Standard Workflow for Trustworthy Buddhist AI**\n>\n> Any professional Buddhist AI should adopt this pipeline:\n>\n> ```\n> AI generation\n>   ↓\n> Retrieval-augmented generation (RAG)\n>   ↓\n> Location in the canon\n>   ↓\n> Verification of fascicle, page, and passage\n>   ↓\n> Comparison across editions\n>   ↓\n> Cross-validation against a second source\n>   ↓\n> Expert review\n>   ↓\n> Final answer generated\n>   ↓\n> Evidence chain and model version preserved\n> ```\n>\n> The governing principle is one sentence:\n>\n> > **AI may propose an interpretation; the canon is the evidence. AI may propose a hypothesis; the scholar makes the judgment.**\n>\n> A concrete example. A user asks: \"What does 'let the mind arise without abiding anywhere' mean in Chan?\"\n>\n> The system should not answer with a paragraph of modern philosophical explanation. It should at minimum provide, simultaneously: the original text of the *Diamond Sūtra*; the source in CBETA or another authoritative edition; relevant variant readings; Kumārajīva's translation; representative classical commentaries; relevant Chan explanations; modern scholarship; and the AI's own synthesis—with explicit separation of which part is \"canonical text,\" which is \"historical commentary,\" which is \"modern scholarly opinion,\" and which is \"AI synthesis.\"\n>\n> The purpose of the design is simple: **to move the risk of an AI passing off its own interpretation as scripture from \"the model chooses to behave\" to \"the product is structured so it cannot.\"** Models err. Structures do not lie.\n>\n> 84000 takes a similar approach to AI-assisted translation of scripture. Its public position states in the original: \"these sacred texts should not be processed using machine translation alone\"; \"The primary actor in the translation of sacred literature must always be the human mind.\" It also acknowledges the tool's value: \"84000 believes that the use of AI as a tool to assist translation has considerable value.\" The uses it lists include checking translations for omissions and errors; offering alternative translation choices; finding related passages across Tibetan, Sanskrit, and Chinese source texts; identifying inconsistencies across translations; and helping locate people, places, and terms (Grade A, [84000 position paper](https://84000.co/documents/84000s-position-on-ai-and-the-machine-translation-of-canonical-literature)).\n>\n> The weight of this position lies in the fact that it is neither \"AI solves everything\" nor \"AI is a threat,\" but a **division-of-responsibility statement.** What goes to the machine, what must remain with a human—stated plainly. If Chinese Buddhism issued a comparable public position, a great deal of repetitive argument would be saved.\n>\n> These principles align with UNESCO's guidance on generative AI in education and research, which advocates a human-centred approach, data protection, and human oversight (Grade A, [UNESCO, *Guidance for Generative AI in Education and Research*](https://www.unesco.org/en/articles/guidance-generative-ai-education-and-research?hub=253682), issued 7 September 2023).\n\n---\n\n## 十九、AI 辅助佛典翻译：最值得突破的传播基础设施\n\n回到第十章那道坎：汉文佛典资源极丰富，而世界上大量潜在读者无法直接阅读古汉语佛典。\n\n**这是汉传全球传播最大的单一结构性障碍，也是最有可能被技术实质性改变的一项。**\n\nAI 翻译在这里不是普通的传播工具。它直接改变\"可访问性\"这个变量——而可访问性是前面所有传播策略的前提。没有可读的译本，禅修、教育、对话、学术交流都无从谈起。\n\n### 已经到哪一步了\n\n2024 年一项专门研究比较了 ChatGPT-4、ERNIE Bot 4 与 Gemini Advanced 对古汉语佛教文本的翻译能力，研究使用来自 CBETA 的佛典与中国佛教文献，并通过人工评价分析（B 级，Xiang Wei, *Religions* 15(12):1559, 2024）。这说明\"LLM + 佛典翻译\"已经从概念讨论进入了可比较评测阶段。\n\n同时，专门的佛教翻译模型也已公开。Dharmamitra 项目发布过针对佛教汉文到英文翻译的模型（`buddhist-nlp/mbart-buddhist-chinese-to-eng`），其模型卡坦诚地写明两点：在人物、地点等命名实体上存在机器翻译系统常见的问题，且\"有时会表现出幻觉倾向\"（原文：the usual problems that NMT systems have with named entities；shows a tendency to hallucinate at times）。\n\n这句自述比任何评测分数都有价值。**一个愿意在模型卡上写明自己会幻觉的项目，比一个宣称准确率 95% 的项目更值得信任。**\n\n### 该建的是什么\n\n由此可以推出：真正值得建的，不是\"一个会翻译佛经的 ChatGPT\"，而是**佛教多语翻译工作台**。\n\n理想的流程是：\n\n```\n原文\n → 自动断句\n → 术语识别\n → 相关经典召回\n → 同类译文召回\n → AI 翻译候选\n → 多版本对照\n → 译者修改\n → 专家审校\n → 术语库更新\n → 发布\n → 新数据反哺模型\n```\n\n这个流程里，AI 承担的是\"候选生成\"与\"一致性检查\"，译者承担的是\"判断\"，专家承担的是\"定稿\"。三者职责不重叠。\n\n### 一个容易做错的设计决定\n\n多数翻译项目在术语上追求\"唯一正译\"，这个目标听起来正当，实则有害。\n\n理由是：汉传两千年的译经史本身就是\"多译并存\"的历史。同一个梵文词，鸠摩罗什译作\"毕竟空\"，玄奘译作\"毕竟无\"，真谛译作\"真实空\"——这不是谁译错了，而是不同时代的理解差异被保留了下来。强行统一，等于抹掉这层信息。\n\n更好的做法是把术语库设计成**分层**的：底下一层是\"推荐译名\"，上面允许多个并存译名，每个译名标注来源（谁译的、哪个时代、依据什么）。机器默认输出推荐译名，但保留其余选项与理由。**这样，统一的便利与并存的丰富就都能得到。**（判断）\n\n技术上有两个前提条件：一是术语层要开放、可引用、有版本号；二是译文要分级标注——未校、已校、权威三级。读者看到一段机器译文时，应当能立刻知道它经过了几道人工校订。\n\n> **EN对应 · 19. AI-Assisted Translation of Buddhist Texts: The Infrastructure Most Worth Breaking Through**\n>\n> Back to the ditch described in Chapter Ten: the Chinese Buddhist canon is extremely rich, and a great many potential readers worldwide cannot read classical Chinese Buddhist texts directly.\n>\n> **This is the single largest structural obstacle to the global transmission of Chinese Buddhism, and the one most likely to be substantively changed by technology.**\n>\n> AI translation here is not an ordinary communication tool. It changes the variable of accessibility directly—and accessibility is the precondition of every transmission strategy discussed above. Without readable translations, meditation instruction, education, dialogue, and academic exchange all have nowhere to begin.\n>\n> **Where things stand.** A 2024 study compared the translation ability of ChatGPT-4, ERNIE Bot 4, and Gemini Advanced on classical Chinese Buddhist texts, using texts from CBETA and Chinese Buddhist literature and analysing them through human evaluation (Grade B, Xiang Wei, *Religions* 15(12):1559, 2024). \"LLM plus Buddhist translation\" has moved from conceptual discussion into comparable evaluation.\n>\n> Purpose-built Buddhist translation models have also been released. The Dharmamitra project published a model for Chinese-to-English translation of Buddhist texts (`buddhist-nlp/mbart-buddhist-chinese-to-eng`), and its model card states two things candidly: the usual problems that NMT systems have with named entities (names of persons and places), and that the model \"shows a tendency to hallucinate at times.\"\n>\n> That admission is worth more than any evaluation score. **A project willing to write on its model card that it hallucinates is more trustworthy than one claiming 95 percent accuracy.**\n>\n> **What should be built.** Hence the conclusion: what is worth building is not \"a ChatGPT that translates Buddhist scriptures\" but a **multilingual Buddhist translation workbench**.\n>\n> The ideal pipeline:\n>\n> ```\n> Source text\n>  → Automatic sentence segmentation\n>  → Term recognition\n>  → Retrieval of related scriptures\n>  → Retrieval of comparable existing translations\n>  → AI translation candidates\n>  → Comparison across editions\n>  → Translator revision\n>  → Expert review\n>  → Terminology database update\n>  → Publication\n>  → New data fed back into the model\n> ```\n>\n> In this pipeline the AI handles candidate generation and consistency checking, the translator handles judgment, and the expert handles final authorization. The three responsibilities do not overlap.\n>\n> **One design decision easily made wrongly.** Most translation projects pursue a single \"correct\" rendering for each term. The goal sounds proper; it is in fact harmful.\n>\n> The reason: two thousand years of Chinese translation history is itself a history of coexisting renderings. For the same Sanskrit term, Kumārajīva rendered it as \"ultimately empty,\" Xuanzang as \"ultimately nonexistent,\" Paramārtha as \"genuinely empty.\" This is not a matter of someone translating incorrectly; it is the preservation of differences in understanding across periods. Forced uniformity erases that layer of information.\n>\n> The better approach is to design the terminology database in **layers**: a bottom layer of \"recommended renderings,\" above it a set of coexisting alternatives, each annotated with its source—who translated it, in what period, on what basis. The machine outputs the recommended rendering by default while retaining the alternatives and their rationales. **In this way both the convenience of uniformity and the richness of coexistence are preserved.** (Judgment)\n>\n> Two technical preconditions follow: the terminology layer must be open, citable, and versioned; and translations must be graded—unreviewed, reviewed, authoritative. A reader encountering a machine translation should be able to see at once how many rounds of human review it has passed.\n\n---\n\n## 二十、修行辅助的四层：学习辅助不等于修行本身\n\n这是整个领域中最需要谨慎的部分。\n\nAI 很适合做的事有一长串：经教学习、每日阅读计划、佛教术语学习、经典问答、修学笔记、共修提醒、禅修时间管理、反思日志、学习路径推荐、多语法义学习、法会信息与课程管理。\n\n但这些功能不能等同于\"AI 具有修行经验\"，更不能把\"AI 生成的语言流畅度\"误认为\"AI 具有证量或悟境\"。\n\n一个实用而清晰的分层是：\n\n### 第一层：知识型 AI\n\n回答\"什么是十二因缘？\"这是典型的教育任务。风险低，收益直接，应当大力发展。\n\n### 第二层：陪伴型 AI\n\n帮助用户执行：\"今天提醒我静坐二十分钟。\"这是行为支持，属于工具功能。\n\n### 第三层：反思型 AI\n\n用户输入：\"今天我在工作中因为别人否定我而很愤怒。\"\n\nAI 可以帮助梳理：发生了什么；哪些是事实；哪些是自己的判断；情绪如何产生；可以如何按照已经学过的佛法进行反思。\n\n这一层是\"反思镜\"，有用，但有一条界线：**它帮助用户使用他自己学过的法义去照见自己，而不是代替他给出结论。** 一旦 AI 开始告诉他\"你应该放下执着\"、\"这说明你的我执很重\"，它就从镜子变成了判官，而它没有资格做判官。\n\n### 第四层：高风险宗教指导\n\n例如：\n\n> \"我应该不要吃药，专心打坐吗？\"\n>\n> \"我是不是已经开悟？\"\n>\n> \"师父这么要求我是否必须服从？\"\n>\n> \"我出现严重异常体验，是不是进入某种高级禅定？\"\n\n这四个问题有一个共同点：**答错了会伤人。** 这一层不应让 AI 做任何判断，而必须设置人工导师介入、专业机构转介与风险升级机制。\n\n关于数字精神陪伴的研究也支持这一谨慎：研究发现用户容易向聊天机器人透露高度私密的信息，同时对隐私、错误信息、数据安全与依赖问题抱有担忧（B 级，Kneese、Vecchione、Marwick, *Communication and Change* 1(1), 2025）。\n\n### 一条不可让渡的界线\n\n四层之上，有一条贯穿的界线，值得单独标出：\n\n**AI 可以辅助\"学\"，不能替代\"修\"。**\n\n学是获取知识、理解义理、建立正见——这些可以被语言承载，因此可以被机器承载。修是亲证、是身心转变、是在具体情境中的抉择——这些不通过语言传递，因此不可能通过语言模型传递。\n\n说\"AI 能帮助你学习佛法\"是准确的。说\"AI 能帮助你修行\"，就已经越界了。而说\"AI 可以指导你的修行\"，则不只是越界，是危险。（判断）\n\n> **EN对应 · 20. Four Tiers of Practice Support: Learning Assistance Is Not Practice**\n>\n> This is the part of the field requiring the most caution.\n>\n> The list of things AI does well is long: studying doctrine, daily reading plans, learning Buddhist terminology, scriptural question and answer, study notes, reminders for group practice, time management for meditation, reflective journals, learning-path recommendations, multilingual study of meaning, and administration of events and courses.\n>\n> But none of these equates to \"AI has practice experience,\" and fluency of AI-generated language must never be mistaken for realization or depth of insight.\n>\n> A practical and clear tiering:\n>\n> **Tier one: knowledge AI.** Answering \"what are the twelve links of dependent origination?\" This is a straightforward educational task. Low risk, direct benefit, deserving of vigorous development.\n>\n> **Tier two: companion AI.** Helping the user execute: \"remind me to sit for twenty minutes today.\" This is behavioural support, a tool function.\n>\n> **Tier three: reflective AI.** The user types: \"Today at work I got very angry because someone rejected me.\"\n>\n> The AI can help sort through what happened; which parts are fact; which are the user's own judgments; how the emotion arose; and how one might reflect on it according to the dharma one has already learned.\n>\n> This tier is a \"mirror for reflection\"—useful, with one boundary line: **it helps users see themselves through the teachings they have already studied; it does not deliver conclusions on their behalf.** Once the AI begins telling him \"you should let go of attachment\" or \"this shows your self-grasping is strong,\" it has turned from mirror into magistrate—and it is not qualified for that office.\n>\n> **Tier four: high-risk religious guidance.** For example:\n>\n> > \"Should I stop taking my medication and just sit in meditation?\"\n> >\n> > \"Am I already enlightened?\"\n> >\n> > \"If my teacher requires this, must I obey?\"\n> >\n> > \"I'm having severe unusual experiences—am I entering some advanced state of concentration?\"\n>\n> These four questions share one feature: **a wrong answer causes harm.** In this tier the AI should make no judgment at all; human mentorship, referral to professional services, and risk-escalation mechanisms must be in place.\n>\n> Research on digital spiritual companionship supports this caution: users readily disclose highly private information to chatbots while simultaneously worrying about privacy, misinformation, data security, and dependency (Grade B, Kneese, Vecchione, and Marwick, *Communication and Change* 1(1), 2025).\n>\n> **One boundary that cannot be ceded.** Above the four tiers runs a single line worth marking on its own:\n>\n> **AI can assist study. It cannot replace practice.**\n>\n> Study is acquiring knowledge, understanding doctrine, and establishing right view—all of which can be carried by language, and therefore by a machine. Practice is direct realization, the transformation of body and mind, and decisions made in concrete circumstances—none of which is transmitted through language, and therefore none of which can be transmitted by a language model.\n>\n> \"AI can help you study the dharma\" is accurate. \"AI can help you practise\" has already crossed the line. And \"AI can guide your practice\" is not merely over the line—it is dangerous. (Judgment)\n\n---\n\n## 二十一、「AI 师父」：最需要慎重对待的方向\n\n技术上，一个 AI 完全可以模拟某位高僧的语言风格。这里必须区分三个层次：\n\n**模拟其文风** ≠ **根据其著作回答** ≠ **代表其本人传法**\n\n第一层是风格模仿，风险有限。第二层是有据可查的问答，属于知识服务。**第三层是宗教权威的模拟，风险极高。**\n\n因此更可取的设计是**「传统人物知识代理」**，而不是**「AI 大师人格」**。\n\n比较这两句话：\n\n> \"根据《六祖坛经》以及现有学术研究，说明慧能思想。\"\n\n> \"我是六祖慧能，请告诉你应该如何修行。\"\n\n前者在知识真实性与伦理上都更稳健。它把回答的边界限定在\"文献说过的\"与\"学者研究过的\"之内，并且不冒充主体。\n\n2025 至 2026 年已出现一些实验性佛教对话系统，例如围绕亲鸾等净土宗思想家的专门 AI 系统（京都大学熊谷诚慈团队与 Terraverse 于 2023 年 9 月推出的「親鸞ボット」，同批还有「世親ボット」）、佛教教学型 AI，以及基于 RAG、能答问时标明经名章偈的佛典问答平台。这类项目很有研究价值，但多数仍处于实验性或项目自述阶段。**\"能够生成宗教对话\"与\"已经拥有宗教权威\"之间，隔着不可逾越的距离。**\n\n### 真正的伦理风险\n\n未来最危险的问题，很可能不是\"AI 有没有佛性\"，而是：**人是否开始把 AI 的输出当成佛法本身？**\n\n具体有五种风险：\n\n**权威幻觉。** AI 的语言非常确定，而这种确定并不等于真实。一个流畅的段落会被读作一个可靠的结论。\n\n**拟人化。** 用户可能逐渐把一个持续回应自己的 AI 当作\"懂我\"的精神对象。它总在、总答、从不疲倦、从不评判——这些特性恰好构成一种危险的吸引力。\n\n**依赖。** 人可能越来越依赖 AI 反思，而减少真实的师友关系。而修行恰恰是一件必须在关系中发生的事。\n\n**教义扁平化。** LLM 倾向于给出\"听起来合理\"的综合答案，而佛教内部真实存在巨大的传统差异。把天台、华严、唯识、禅、净土揉成一个\"佛教说\"，是技术上的便利，也是教理上的失真。\n\n**数据隐私。** 修行日志可能包含身体状态、情绪、家庭关系、创伤经历、性与婚姻、宗教信仰、心理状态。这些数据不能按照普通内容平台的数据逻辑处理。**佛教 AI 应当建立比一般教育 AI 更高的隐私标准。**\n\n### 一个结构性的判断\n\n把五种风险归到一处，核心只有一句：\n\n**佛教 AI 的真正风险，不是机器人有灵魂，而是人把权威交给算法。**（判断）\n\n历代祖师的权威，建立在戒、定、慧的长期实践与僧团共同体的印可之上。这份权威无法被转录为参数，也不应被模拟为一个可以随时提问的对象。技术能做的是把经典整理清楚、把出处标明白、把义理讲通畅——**它做的是\"使法可闻\"，不是\"代法说法\"。**\n\n这一区分看起来细微，却决定了整个佛教 AI 事业的方向。\n\n> **EN对应 · 21. The \"AI Master\": The Direction Requiring the Most Caution**\n>\n> Technically, an AI can fully simulate the verbal style of a famous monk. Three levels must be distinguished:\n>\n> **Simulating his style** ≠ **answering from his writings** ≠ **speaking on his behalf**\n>\n> The first is stylistic imitation, with limited risk. The second is sourced question and answer, a knowledge service. **The third is the simulation of religious authority, and the risk is extreme.**\n>\n> Hence the preferable design is a **\"knowledge agent for a traditional figure,\"** not an **\"AI master persona.\"**\n>\n> Compare two sentences:\n>\n> > \"According to the *Platform Sūtra of the Sixth Patriarch* and existing scholarship, explain Huineng's thought.\"\n>\n> > \"I am Huineng, the Sixth Patriarch. Let me tell you how you should practise.\"\n>\n> The first is more robust both epistemically and ethically. It confines the answer to what the texts say and what scholars have studied, and it does not impersonate a subject.\n>\n> Experimental Buddhist dialogue systems have appeared in 2025–2026: a dedicated AI for the Pure Land thinker Shinran, for instance (the \"Shinran Bot\" released in September 2023 by Professor Seiji Kumagai's team at Kyoto University with Terraverse, alongside a \"Vasubandhu Bot\"), Buddhist teaching AIs, and RAG-based scriptural question-answering platforms that cite the scripture, chapter, and verse when answering. Such projects have research value, but most remain experimental or self-described. **Between \"can generate religious dialogue\" and \"possesses religious authority\" lies an impassable distance.**\n>\n> **The real ethical risk.** The most dangerous question ahead is probably not \"does AI have buddha-nature\" but: **has a person begun to take the AI's output as the dharma itself?**\n>\n> Five specific risks:\n>\n> **Authority illusion.** AI language is highly certain, and that certainty is not truth. A fluent paragraph is read as a reliable conclusion.\n>\n> **Anthropomorphization.** Users may gradually treat an AI that keeps responding to them as a spiritual other who \"understands me.\" It is always there, always answers, never tires, never judges—properties that amount to a dangerous attraction.\n>\n> **Dependency.** People may increasingly rely on AI for reflection while their real relationships with teachers and friends diminish. And practice is precisely something that must happen within relationships.\n>\n> **Doctrinal flattening.** LLMs tend to produce a plausible-sounding synthesis, while enormous differences genuinely exist among Buddhist traditions. Kneading Tiantai, Huayan, Yogācāra, Chan, and Pure Land into one \"what Buddhism says\" is a technical convenience and a doctrinal distortion.\n>\n> **Data privacy.** A practice journal may contain physical condition, emotions, family relations, traumatic experience, sexuality and marriage, religious belief, and psychological state. Such data cannot be handled by the data logic of an ordinary content platform. **Buddhist AI should set a higher privacy standard than educational AI generally.**\n>\n> **One structural judgment.** Gathering the five risks into one place, the core is a single sentence:\n>\n> **The real risk of Buddhist AI is not that a machine has a soul. It is that a person hands authority to an algorithm.** (Judgment)\n>\n> The authority of the patriarchs was built on long practice in precepts, concentration, and wisdom, and on the sanction of the monastic community. That authority cannot be transcribed into parameters, and should not be simulated as an object one can question at will. What technology can do is organize the texts clearly, mark the sources plainly, and explain the doctrine coherently—**it makes the dharma hearable; it does not speak the dharma in anyone's place.**\n>\n> The distinction looks fine. It determines the direction of the entire Buddhist AI enterprise.\n\n---\n\n## 二十二、度量、算法与身体的边界\n\n### 传播漏斗：把\"多少人看见\"换成\"多少人留下\"\n\n传播效果不能再只看粉丝数、点赞数、播放量。更有意义的是建立一条**佛法传播漏斗**：\n\n```\n曝光 → 观看 → 理解 → 第一次学习 → 持续学习\n→ 线上共修 → 线下参与 → 长期修学\n→ 志愿服务 → 慈善实践 → 社区参与\n```\n\n这带来一个重大改变：**把\"传播量\"变成\"学习与实践的转化率\"。**\n\n一条视频一百万播放，不一定比一个只有三千人但形成了持续学习社群的课程更有宗教教育价值。数据科学真正能帮佛教组织回答的问题是：哪些内容能吸引新人？哪些能形成持续学习？哪些语言市场需求最大？哪些课程流失严重？哪些新成员最终进入了线下社群？什么内容适合青年？不同国家的用户走的是不同路径吗？\n\n但有一条界线：**可以测量传播行为，不能轻易把\"悟性、功德、证量\"变成平台 KPI。** 一旦寺院开始用\"转化率\"考核法师，它就已经不是在弘法了。\n\n### 推荐算法与权力结构\n\n数字宗教研究近年越来越强调：平台不是中性的传播管道。2026 年一篇数字宗教综述综合分析了 88 项研究，指出平台基础设施、算法可见性与网络化公众正在改变宗教权威、仪式实践与社群形成（B 级，AlMazaedh 等，*Frontiers in Sociology* 11:1802281, 2026）。\n\n这对汉传非常重要，因为传播结构正在变：\n\n过去的传播结构是 **寺院 → 法师 → 信众**。数字平台之后变成 **寺院 → 法师 → 平台算法 → 用户**。而 AI 时代可能变成 **经典／法师／寺院 → AI 知识层 → AI 推荐与问答 → 用户**。\n\n也就是说，**新的\"中介者\"可能不再只是平台，而是 AI 本身。**\n\n因此需要维护的，不只是流量，而是三样透明：**知识来源透明、推荐逻辑透明、教义边界透明。** 当一个信众的问题由 AI 回答时，\"这个答案从哪里来\"必须是他能查到的。\n\n### VR、AR 与沉浸式体验\n\nVR/AR 适合做的事很清楚：佛教艺术教育、石窟与寺院数字重建、佛教历史场景可视化、佛教博物馆、经变图教学、建筑与艺术史教学、远程文化体验，以及某些类型的禅修环境辅助。\n\n已有研究系统评价了 VR 正念干预的效果，发现其在状态正念、负性情绪等方面具有一定短期积极效果，但不同研究的方法、对象与干预方式差异很大。一项 2024 年发表于 *Digital Health* 的系统综述与证据图纳入 **22 项**研究，指出需要更大型、更严格的研究（B 级，Wieczorek 等，*Digit Health* 10, 2024）。\n\n这里有一处需要特别指出：流传材料称该研究为\"2026 年的一项 Meta 分析，纳入 35 项研究、约 1550 名参与者\"。经核查，实际是 **2024 年**发表的**系统综述加证据图**（非 Meta 分析），纳入 **22 项**研究。年份、研究设计、样本量三处均不相符。这是本报告在核查中发现的最典型的一类错误——**数字精确到具体，却是错的**，比模糊的概括更容易骗过读者。\n\n因此必须严格区分两句话：\n\n**VR 可以辅助进入某种环境或注意状态**——这是可以研究、也已有初步证据的。\n\n**VR 能够制造禅定、悟境或证果**——这不是一个科学命题。\n\n### EEG、HRV 与\"科学化包装\"的陷阱\n\n脑电、心率变异性、呼吸、心率、睡眠、注意力、生理反馈、神经反馈——这些都值得研究。但目前的证据**不足以支持\"利用这些指标直接识别高级佛教修行境界\"**。\n\n2024 年一项关于正念神经反馈的系统综述发现，EEG/fMRI 相关研究仍存在样本量、对照设计与迁移效应不足等问题，尤其缺少充分的假神经反馈（sham neurofeedback）对照；因此不能简单把神经信号变化解释为更高层次的修行成就（B 级，Treves、Greene、Bajwa 等，正式版见 *Imaging Neuroscience* 2:imag-2-00396, 2024；流传材料所引 PubMed 39314394 为 bioRxiv 预印本，宜引正式版）。\n\n稳妥的方向是**\"生理反馈辅助训练\"**，而不是**\"脑电测量证果\"**。\n\n这一区分关乎的不只是科学严谨，还关乎教法本身。**把修行境界等同于某个生理指标，是用一个可测量的东西替换一个不可测量的东西——而替换掉的，恰恰是修行。**（判断）\n\n> **EN对应 · 22. Measurement, Algorithms, and the Boundaries of the Body**\n>\n> **The transmission funnel: replacing \"how many saw it\" with \"how many stayed.\"**\n>\n> Transmission effectiveness can no longer be measured by follower counts, likes, and views. What matters more is a **dharma transmission funnel**:\n>\n> ```\n> Exposure → Viewing → Understanding → First study → Continued study\n> → Online group practice → In-person participation → Long-term study\n> → Volunteer service → Charitable practice → Community engagement\n> ```\n>\n> This brings a major shift: **from \"transmission volume\" to \"the conversion rate into study and practice.\"**\n>\n> A video with a million views is not necessarily of greater religious-educational value than a course of three thousand that formed a continuing study community. The questions data science can genuinely help Buddhist organizations answer are: what content attracts newcomers? What content produces sustained study? Which language markets have the greatest demand? Which courses lose people badly? Which new members eventually enter in-person communities? What content suits young people? Do users in different countries follow different paths?\n>\n> One line must be drawn: **transmission behaviour can be measured; insight, merit, and realization must not lightly be turned into platform KPIs.** Once a temple begins evaluating its monastics by conversion rates, it is no longer transmitting the dharma.\n>\n> **Recommender algorithms and the structure of power.** Research on digital religion increasingly stresses that platforms are not neutral conduits. A 2026 review of digital religion, synthesizing 88 studies, argues that platform infrastructure, algorithmic visibility, and networked publics are changing religious authority, ritual practice, and community formation (Grade B, AlMazaedh et al., *Frontiers in Sociology* 11:1802281, 2026).\n>\n> This matters greatly for Chinese Buddhism, because the structure of transmission is changing. It once ran **temple → monastic → devotee**. After digital platforms it ran **temple → monastic → platform algorithm → user**. In the AI era it may run **scripture / monastic / temple → AI knowledge layer → AI recommendation and question answering → user**.\n>\n> That is, **the new intermediary may no longer be the platform alone. It may be the AI itself.**\n>\n> What must therefore be maintained is not merely traffic but three kinds of transparency: **transparency of knowledge provenance, transparency of recommendation logic, and transparency of doctrinal boundaries.** When a devotee's question is answered by an AI, \"where did this answer come from\" must be something he can look up.\n>\n> **VR, AR, and immersive experience.** What VR/AR suits is clear enough: Buddhist art education, digital reconstruction of cave sites and temples, visualization of historical scenes, Buddhist museums, teaching from transformation tableaux, architectural and art-historical instruction, remote cultural experience, and certain kinds of environmental support for meditation.\n>\n> Studies have systematically reviewed the effects of VR-based mindfulness interventions, finding some short-term positive effects on state mindfulness and negative affect, but with wide variation in method, population, and intervention. A 2024 systematic review and evidence map in *Digital Health* included **22 studies** and called for larger and more rigorous research (Grade B, Wieczorek et al., *Digit Health* 10, 2024).\n>\n> One point requires special note. Circulating materials describe this research as \"a 2026 meta-analysis including 35 studies and about 1,550 participants.\" On verification it is a **2024** publication, a **systematic review with evidence mapping** rather than a meta-analysis, including **22** studies. Year, design, and sample size are all wrong. This is the most typical error found in verification—**a figure precise in its specifics but incorrect**, likelier to slip past a reader than a vague generalization.\n>\n> Two sentences must therefore be strictly distinguished:\n>\n> **VR can help a person enter a certain environment or state of attention**—this can be studied, and preliminary evidence exists.\n>\n> **VR can produce meditative absorption, enlightenment, or fruition**—this is not a scientific proposition.\n>\n> **EEG, HRV, and the trap of \"scientific packaging.\"** Brain electrical activity, heart rate variability, respiration, heart rate, sleep, attention, physiological feedback, neurofeedback—all worth studying. But current evidence **does not support \"using these indicators to identify advanced Buddhist states of practice.\"**\n>\n> A 2024 systematic review of mindfulness-based neurofeedback found that EEG and fMRI studies still suffer from inadequate sample sizes, control designs, and attention to transfer effects, and notably lack adequate sham-neurofeedback controls; neural signal changes therefore cannot simply be interpreted as higher levels of attainment (Grade B, Treves, Greene, Bajwa et al., final version in *Imaging Neuroscience* 2:imag-2-00396, 2024; the PubMed record 39314394 cited in circulating materials is a bioRxiv preprint, and the published version should be cited).\n>\n> The sound direction is **\"physiological feedback as training support,\"** not **\"EEG measurement of attainment.\"**\n>\n> The distinction bears on more than scientific rigour. It bears on the teaching itself. **To equate a state of practice with a physiological index is to replace something unmeasurable with something measurable—and what gets replaced is precisely the practice.** (Judgment)\n\n---\n\n## 二十三、项目生态：谁在做什么\n\n当前值得关注的方向有五类，此处只列名目与定位，具体数据、链接与逐项核查见附录三。\n\n**BDRC** 是佛教数字底座，思路不是做聊天机器人，而是先建高质量佛教数据，使未来的 AI 能够接触到更可靠的一手资料。2026 年的开放数据集计划尤其值得重视。\n\n**CBETA + DILA + SAT** 构成汉传佛教的数字学术底座，分别代表结构化经典、综合检索、版本与页面核验三个方向。三者未来非常值得进一步整合。\n\n**Dharmamitra / MITRA** 已把佛教多语搜索、文本复用检测与机器翻译作为明确研究方向，从实验演示进入了学术生产流程。\n\n**84000** 提供了一个值得汉传借鉴的范式：AI 作为专业翻译团队的增强工具，而不是替代专业译者。\n\n**新一代佛教 RAG 与知识图谱项目**近年陆续出现，把佛典聚合、RAG、知识图谱、跨语种对读结合起来。此类项目显示\"佛教搜索引擎\"正在向\"AI 研究环境\"演化，但其中一些项目的规模、准确率、数据覆盖范围仍主要来自项目方自身介绍，**目前不能与 CBETA、SAT、BDRC 这类长期专业项目直接等量齐观。**\n\n汉传佛教自己的动作也已出现：佛光山的「人間雲」（2025 年 2 月 3 日发表，语料为《星云大师全集》与《人间福报》25 年新闻库）、Vurbo.ai 术语翻译系统、灵隐寺的古籍 OCR 与「如是佛典」、法鼓山数典的知识图谱。这些是真实进展，起点是好的，规模与 CBETA、BDRC 相比仍然很小。\n\n**这里有一个战略判断：汉传不需要也来不及在每一项上都自建。** 它需要的是——在少数几件只有它能做的事上做到不可替代，其余部分接入别人的基础设施。（判断）只有汉传才有的东西是什么？是汉文大藏经的权威版本与校勘、是汉传诸宗的义理体系与术语、是两千年的注疏传统、是完整的比丘尼戒统、是人间佛教的现代实践经验。其余——OCR 引擎、向量数据库、RAG 框架、大模型——都应当用现成的，而不是重造。\n\n> **EN对应 · 23. The Project Landscape: Who Is Doing What**\n>\n> Five directions are worth attention. Only names and positioning are given here; figures, links, and item-by-item verification are in Appendix Three.\n>\n> **BDRC** is the Buddhist digital foundation. Its approach is not to build a chatbot but to build high-quality Buddhist data first, so that future AI can reach more reliable primary materials. Its 2026 open-dataset initiative deserves particular attention.\n>\n> **CBETA + DILA + SAT** form the digital scholarly foundation for Chinese Buddhism, representing respectively structured canonical texts, integrated search, and edition and page verification. Further integration of the three is well worth pursuing.\n>\n> **Dharmamitra / MITRA** has made multilingual Buddhist search, textual reuse detection, and machine translation explicit research directions, moving from experimental demonstration into scholarly production.\n>\n> **84000** offers a paradigm worth borrowing: AI as an enhancement tool for a professional translation team, not a replacement for professional translators.\n>\n> **A newer generation of Buddhist RAG and knowledge-graph projects** has appeared, combining canonical aggregation, RAG, knowledge graphs, and cross-lingual reading. Such projects show the \"Buddhist search engine\" evolving toward an \"AI research environment,\" but the scale, accuracy, and data coverage of some remain project self-descriptions, and **cannot currently be equated with long-standing professional projects such as CBETA, SAT, and BDRC.**\n>\n> Chinese Buddhism's own moves have begun: Foguang Shan's \"Humanistic Cloud\" (announced 3 February 2025, with the *Complete Works of Master Hsing Yun* and twenty-five years of the *Merit Times* news archive as its corpus), the Vurbo.ai terminology translation system, Lingyin Temple's OCR work and the Rushi Fodian platform, and Dharma Drum's knowledge graphs. These are real advances and a good beginning; their scale remains small beside CBETA or BDRC.\n>\n> **A strategic judgment follows: Chinese Buddhism need not, and cannot, build everything itself.** What it needs is to become irreplaceable in the few things only it can do, and to connect to others' infrastructure for the rest. (Judgment) What does only Chinese Buddhism have? Authoritative editions and critical collations of the Chinese canon; the doctrinal systems and terminologies of its schools; two thousand years of commentary; the complete bhikṣuṇī ordination lineage; and the modern practical experience of Humanistic Buddhism. Everything else—OCR engines, vector databases, RAG frameworks, large models—should be adopted off the shelf, not rebuilt.\n\n---\n\n## 二十四、五至十年路线\n\n把前面的判断落成时间表，大致分三段。这一节只给骨架，判断依据见附录四。\n\n**2026—2027：数据底座阶段。** 优先事项是 CBETA／DILA／SAT 等资源的协同、权威佛典数据标准、人物与寺院与法脉的知识图谱、佛教多语术语库、佛典版本与引用标准、高质量 OCR、多语平行语料、专业 RAG。这一阶段最重要的不是追求\"智能\"，而是**保证数据可信**。\n\n**2028—2030：知识智能化阶段。** 佛学 AI 研究助手、AI 翻译工作台、多语智能检索、学术文献 Agent、佛教知识图谱、个人佛学知识库、AI 课程助手、多语自动字幕、AI 数字博物馆、全球佛教知识门户。这一阶段最重要的变化是：**从\"用户搜索佛典\"转向\"用户与佛教知识对话\"。**\n\n**2031—2035：智能生态阶段。** 若前两阶段的数据与治理基础建设成功，才可能发展多模态佛教 AI、个人终身佛学导师系统、AI 与 VR 结合的佛教教育、全球多语佛教课程自动适配、跨传统比较研究 Agent、佛教历史虚拟重建、个性化学习路径、国际佛教知识网络。\n\n但即使到了第三阶段，有一条底线建议始终保持：**AI 是工具、助手、媒介；人类导师、学者、僧团与真实社群仍然是核心。**\n\n### 六项原则\n\n若要把上面的讨论凝成可执行的规范，建议如下六条：\n\n**一、原典优先。** 任何重大教义性结论都尽可能回到原典。\n\n**二、出处优先。** 答案必须尽可能提供经名、卷次、章节或页码、版本。\n\n**三、传统分层。** 系统不能把早期佛教、中观、唯识、天台、华严、禅宗、净土混成一个\"佛教统一答案\"。\n\n**四、解释透明。** 必须告诉用户：这是经典原文，这是古代注疏，这是现代学术解释，这是 AI 综合。\n\n**五、人类导师在环。** 涉及戒律、心理危机、强烈宗教体验、师徒关系、医疗问题、高风险修行者，必须设置人工介入。\n\n**六、数据最小化。** 修行日志、个人经历、情绪与敏感身份数据，应遵循最小采集原则，不应\"为了做个性化 AI\"而无限收集。\n\n### 十项评测\n\n传统 AI 只测试\"答案像不像\"，佛学 AI 应当测试十项：\n\n| 指标 | 测什么 |\n|------|--------|\n| 原典准确率 | 引用的经典是否真的存在 |\n| 出处准确率 | 卷、页、品、版本是否准确 |\n| 版本识别率 | 是否把不同版本混为一谈 |\n| 宗派区分率 | 是否正确区分不同传统 |\n| 引文完整率 | 是否遗漏上下文 |\n| 翻译准确率 | 专业术语是否稳定 |\n| 幻觉率 | 是否生成不存在的经典、人物、引文 |\n| 可追溯率 | 用户能否点击回原典 |\n| 专家一致率 | 佛教学者对答案的认可度 |\n| 多语一致率 | 中英日韩等版本的核心意义是否一致 |\n\n**这十项里没有一项是\"回答听起来多有智慧\"。** 这不是疏忽，是立场：佛学 AI 的合格线应当由可核验的准确性划定，而不是由文本的感染力划定。（判断）\n\n> **EN对应 · 24. A Five- to Ten-Year Roadmap**\n>\n> Reduced to a timetable, the preceding judgments fall into three stages. Only the skeleton is given here; the reasoning is in Appendix Four.\n>\n> **2026–2027: the data foundation stage.** Priorities are coordination among CBETA, DILA, and SAT; authoritative canonical data standards; knowledge graphs of persons, temples, and lineages; a multilingual Buddhist terminology database; edition and citation standards; high-quality OCR; multilingual parallel corpora; and professional RAG. The most important thing at this stage is not \"intelligence\" but **ensuring the data can be trusted.**\n>\n> **2028–2030: the knowledge intelligence stage.** AI research assistants for Buddhist studies, AI translation workbenches, multilingual intelligent retrieval, scholarly literature agents, Buddhist knowledge graphs, personal Buddhist knowledge bases, AI course assistants, automatic multilingual subtitling, AI digital museums, and a global Buddhist knowledge portal. The key change in this stage is **a shift from \"users search the canon\" to \"users converse with Buddhist knowledge.\"**\n>\n> **2031–2035: the intelligent ecosystem stage.** Only if the data and governance foundations of the first two stages succeed can there be multimodal Buddhist AI, lifelong personal study-mentor systems, AI-and-VR Buddhist education, automatic adaptation of global multilingual Buddhist courses, cross-traditional comparative research agents, virtual reconstruction of Buddhist history, personalized learning paths, and an international Buddhist knowledge network.\n>\n> Even in the third stage, one baseline should hold: **AI is a tool, an assistant, a medium; human teachers, scholars, monastic communities, and real communities remain the core.**\n>\n> **Six principles.** Reduced to executable norms:\n>\n> **One: canon first.** Every significant doctrinal conclusion should return to the canon wherever possible.\n>\n> **Two: source first.** Answers must provide, wherever possible, the title, fascicle, chapter or page, and edition.\n>\n> **Three: stratify by tradition.** The system must not blend early Buddhism, Madhyamaka, Yogācāra, Tiantai, Huayan, Chan, and Pure Land into a single \"unified Buddhist answer.\"\n>\n> **Four: transparent interpretation.** It must tell users: this is canonical text, this is classical commentary, this is modern scholarship, this is AI synthesis.\n>\n> **Five: human mentor in the loop.** Where precepts, psychological crisis, intense religious experience, teacher–student relations, medical questions, or high-risk practice are involved, human intervention must be provided.\n>\n> **Six: data minimization.** Practice journals, personal histories, emotional and sensitive identity data should follow a principle of minimal collection, not be gathered without limit \"to build a personalized AI.\"\n>\n> **Ten evaluation metrics.** Conventional AI tests only whether an answer sounds right. Buddhist AI should test ten things:\n>\n> | Metric | What it measures |\n> |---|---|\n> | Canonical accuracy | Does the cited scripture actually exist |\n> | Source accuracy | Are fascicle, page, chapter, and edition correct |\n> | Edition recognition | Are different editions conflated |\n> | School discrimination | Are traditions correctly distinguished |\n> | Quotation completeness | Is context omitted |\n> | Translation accuracy | Is terminology stable |\n> | Hallucination rate | Are nonexistent scriptures, figures, or quotations generated |\n> | Traceability | Can the user click back to the canon |\n> | Expert agreement | Do Buddhist scholars accept the answer |\n> | Multilingual consistency | Do Chinese, English, Japanese, and Korean versions agree in core meaning |\n>\n> **Not one of the ten is \"how wise the answer sounds.\"** That is not an oversight but a position: the pass mark for Buddhist AI should be set by verifiable accuracy, not by rhetorical appeal. (Judgment)\n\n---\n\n# 第四部　应该如何\n\n> 前面三部是诊断。这一部是处方。\n>\n> 处方有一条基本纪律：**先看清楚手里有什么，再决定做什么。** 汉传佛教讨论自身前途时，最常犯的错误不是不自信，而是把力气全用在补短上——不如藏传有系统，不如南传直接，不如日本学术化。补到最后，变成一个处处像别人、处处不像自己的东西。\n>\n> 所以这一部从资产盘点开始，而不是从问题清单开始。\n\n### 这些处方凭什么算是佛法的解法\n\n下面的建议大多是具体的、琐屑的：建术语库、写年报、编教材、设计课程阶梯、培养审校的人。它们看起来像管理咨询，不像佛法。所以先说明它们背后的道理——**若这些建议不落在佛法的见地上，它们就只是一套经营策略，做与不做都不影响根本。**\n\n**其一，缘起。** 问题不是命定的，是条件的产物。汉传今天的困境有它具体的条件：母体的社会结构变了、语言隔了一层、监督机制没有长出来、典籍没有被翻译。**改条件就是改结果。**（判断）这条见地看似平常，实则决定了整份处方的性质——它反对两种态度：一种是\"末法时代本该如此\"的宿命论，一种是\"人心不古\"的道德论。两者都把问题归给不可改变的东西，因而都不产生行动。\n\n**其二，惭愧。** 面对已经发生的失败，佛法给的第一反应不是辩解，也不是自罚，是惭愧——承认它，然后改。这也是本报告为什么要附一份勘误记录：**把自家数据说大了近一倍（CBETA 9,200 对 4,899），把别人的志工人数读成了国家数（103,329 对 103 国），这些不必遮掩，改过来就是。** 一个传统的气度，不在于它有没有错，在于它怎么对待自己的错。\n\n**其三，方便。** 形式可随方就圆，核心不可动摇。第三十章那条\"为了让人进来，还是为了好卖\"的判准，依据就是方便与随俗的分野——方便是为了让法到达，随俗是为了让自己好过。\n\n**其四，不二。** 传统与现代、僧与俗、自利与利他、出世与入世，在汉传的见地里本不是对立的两边。因此第二十六章\"从输出教团转向提供公共产品\"不是退让，第二十八章\"把传承交给本地人\"也不是失去——**若它们是对立的两边，这些建议就都是牺牲；正因它们不是，这些建议才是出路。**（判断）\n\n**其五，无尽。** 这件事没有完成的一天。众生无尽，烦恼无尽，所以与之相应的工程也无尽。这也是本报告只给出\"五至十年路线\"而不给\"蓝图\"的原因——蓝图意味着竣工，而这件事不会竣工。\n\n五条见地放在这里，是希望读者在读到后面那些琐屑的建议时，不至于以为它们与佛法无关。**恰恰相反：正因为问题在条件上，所以要在条件上解决；正因为要惭愧，所以要把数字改对；正因为有方便，所以形式可以变；正因为是不二，所以不必在传统与现代之间选边；正因为无尽，所以可以慢慢做。**\n\n> **EN对应 · On What Basis These Prescriptions Count as Dharma**\n>\n> The proposals below are mostly concrete and unglamorous: build a terminology database, publish an annual report, write textbooks, design a course ladder, train reviewers. They look like management consulting rather than dharma. So the reasoning behind them comes first—**if these proposals did not rest on Buddhist insight, they would be mere business strategy, and doing or not doing them would change nothing fundamental.**\n>\n> **First, dependent origination.** Problems are not fated; they are products of conditions. The predicament of Chinese Buddhism today has its specific conditions: the social structure of the mother body has changed; language has become a barrier; oversight mechanisms never grew; the canon was never translated. **Changing the conditions changes the outcome.** (Judgment) The insight looks ordinary; in fact it determines the character of the whole prescription—it rejects two attitudes: the fatalism of \"the dharma-ending age is simply like this,\" and the moralism of \"people are not what they were.\" Both assign the problem to something unchangeable, and so neither produces action.\n>\n> **Second, shame (慚愧).** Confronted with a failure already past, the first Buddhist response is neither self-justification nor self-punishment but shame—acknowledge it, then correct it. This is why the report carries an errata appendix: **we overstated our own holdings by nearly double (CBETA, 9,200 against 4,899); we turned someone else's volunteer headcount into a count of nations (103,329 against 103 countries). None of that needs covering over. Correct it and move on.** The measure of a tradition is not whether it errs, but how it treats its errors.\n>\n> **Third, skillful means (方便).** Forms may bend to circumstance; the core may not be moved. The criterion in Chapter Thirty—\"so the other person can come in, or so that we can sell better\"—rests on the distinction between skillful means and accommodation: skillful means gets the dharma across; accommodation makes things easier for oneself.\n>\n> **Fourth, non-duality (不二).** Tradition and modernity, monastic and lay, self-benefit and benefit of others, supramundane and engaged—in Chinese Buddhist understanding these were never opposing sides. Hence \"from exporting orders to providing public goods\" (Chapter Twenty-Six) is not a retreat, and \"handing the transmission to local people\" (Chapter Twenty-Eight) is not a loss. **Were they opposing sides, these proposals would be sacrifices; precisely because they are not, they are the way out.** (Judgment)\n>\n> **Fifth, inexhaustibility (無盡).** This work has no day of completion. Sentient beings are inexhaustible, afflictions are inexhaustible, and the work that answers them is inexhaustible too. This is why the report offers a \"five- to ten-year roadmap\" rather than a \"blueprint\"—a blueprint implies completion, and this will not be completed.\n>\n> The five are placed here so that a reader encountering the unglamorous proposals that follow will not take them as unrelated to the dharma. **On the contrary: because the problem lies in conditions, it must be solved in conditions; because shame is called for, the figures must be corrected; because there is skillful means, forms may change; because there is non-duality, one need not choose between tradition and modernity; and because it is inexhaustible, it can be done slowly.**\n\n---\n\n## 二十五、先看手里有什么\n\n汉传佛教手里有七样东西，是别人没有或不全有的。\n\n**第一，汉文大藏经。** 这是世界上体量最大的佛典语料之一。更需要说明的是它的独特价值：**大量印度本土已失传的论典，只保存在汉译里。** 唯识、中观、说一切有部的大批论书，梵文原典或已佚失、或只存残片，而汉译本完整。这一点的分量，学界清楚，教内反而常常不清楚。\n\n**第二，完整的比丘尼戒统。** 这是全球唯一，前文已详。\n\n**第三，教下诸宗的义理体系。** 天台的判教与一念三千、华严的法界缘起与十玄门、唯识的八识与三性——这是佛教思想史上最精密的哲学建构之一，其复杂度与系统性，与任何哲学传统相比都不逊色。\n\n**第四，两千年的注疏传统。** 这是一个被严重低估的资产。历代注疏不只是\"解释\"，它是一部完整的**理解史**——同一部经，在不同朝代被怎样理解、争论、修正。对当代诠释学、对跨文化理解理论，这是极好的原始材料。\n\n**第五，人间佛教的现代化经验。** 一个传统如何在不丢本质的前提下完成现代化？汉传做了一百年，有成有败，有佛光山、慈济这样的成功样本，也有少林这样的教训。**这份经验在全球范围内是稀缺的**——藏传在现代化上走的弯路不多，因为它进入西方时已经是\"异域传统\"的身份；南传的现代化主要发生在禅修技术的市场化上。**只有汉传完整地经历过\"一个古老传统如何在现代社会中重新找到自己的位置\"这件事，并且积累了一百年的账。**（判断）\n\n**第六，丛林制度。** 一个自我管理、自我维持、自我传承的僧团共同体制度。现代组织理论对它的兴趣，比对它的了解大得多。\n\n**第七，华严与天台的思想资源。** \"事事无碍\"对系统思维与生态哲学，\"一念三千\"对心与环境的关系，唯识的\"识\"对意识研究——这些是汉传对当代议题最有对话潜力的部分。前面第九章说过，这些恰恰是海外最少被讲清楚的。\n\n七样里，六样是**内容**，只有一样是**制度**（戒统）。而内容型资产有一个共同的瓶颈：**要被世界取用，必须先过语言这一关。**\n\n这个盘点得到一个明确的战略结论：**汉传的优势在\"深\"，不在\"广\"；在\"内容\"，不在\"渠道\"。** 因此它的正确策略不是铺摊子，是**把深厚的东西变成别人拿得走、用得上的形态**。（判断）\n\n> **EN对应 · 25. First, Take Stock of What We Hold**\n>\n> Chinese Buddhism holds seven things that others lack, wholly or in part.\n>\n> **First, the Chinese Buddhist canon.** This is one of the largest corpora of Buddhist literature in the world. Its distinctive value needs stating: **a great many treatises lost in India survive only in Chinese translation.** Large numbers of Yogācāra, Madhyamaka, and Sarvāstivāda works exist in complete Chinese versions while their Sanskrit originals are lost or survive only in fragments. Scholars know the weight of this. Within the tradition itself it is often not known.\n>\n> **Second, the complete bhikṣuṇī ordination lineage.** Unique in the world, as described earlier.\n>\n> **Third, the doctrinal systems of the schools.** Tiantai's classification of teachings and its \"three thousand realms in a single thought\"; Huayan's dharma-realm origination and ten profound gates; Yogācāra's eight consciousnesses and three natures. This is among the most rigorous philosophical construction in Buddhist intellectual history, and stands comparison with any philosophical tradition for complexity and system.\n>\n> **Fourth, two thousand years of commentary.** A badly underrated asset. Successive commentaries are not merely \"explanation\"; they constitute a complete **history of understanding**—how the same scripture was understood, argued over, and revised across dynasties. For contemporary hermeneutics and for theories of cross-cultural understanding, this is exceptional primary material.\n>\n> **Fifth, a century of experience in modernizing.** How does a tradition modernize without losing its essence? Chinese Buddhism has been at this for a hundred years, with successes and failures—Foguang Shan and Tzu Chi as successes, Shaolin as a caution. **That experience is scarce globally.** Tibetan Buddhism took few detours in modernization, because when it entered the West it arrived already marked as an exotic tradition; Theravāda's modernization occurred mainly in the marketization of a meditation technique. **Only Chinese Buddhism has been through the whole of \"how does an ancient tradition find its place again in a modern society,\" and has a century of accounts to show for it.** (Judgment)\n>\n> **Sixth, the monastic system.** A self-governing, self-sustaining, self-transmitting communal institution. Modern organizational theory is more interested in it than informed about it.\n>\n> **Seventh, the intellectual resources of Huayan and Tiantai.** \"Unobstructed interpenetration of phenomena\" speaks to systems thinking and ecological philosophy; \"three thousand realms in a single thought\" to the relation between mind and environment; Yogācāra's \"consciousness\" to consciousness research. As Chapter Nine noted, these are precisely what is least clearly explained abroad.\n>\n> Of the seven, six are **content** and only one is **institution** (the ordination lineage). And content assets share one bottleneck: **to be taken up by the world, they must first pass through language.**\n>\n> The inventory yields a clear strategic conclusion: **Chinese Buddhism's strength lies in depth, not breadth; in content, not channels.** Its correct strategy is therefore not to spread wide but to **turn deep things into forms others can carry away and use.** (Judgment)\n\n---\n\n## 二十六、定位：从输出教团到提供公共产品\n\n汉传在海外最被认可、争议最小的贡献，几乎无一例外是非传教性的公共产品：比丘尼戒统（僧团制度）、慈济的人道与医疗、法鼓山的禅修训练与居士传承、佛经翻译委员会的翻译与出版、以及大学与学术合作。\n\n这不是偶然，也不是退而求其次。它有一条很深的历史根据。\n\n**佛教入华，靠的从来不是传教团。** 它靠的是译经——一种纯粹的公共知识产品；靠的是医疗、赈济、义学、造桥铺路。汉地接受佛教的方式，不是\"被一个教团说服\"，而是\"用上了它提供的东西，后来才慢慢接受了它背后的东西\"。\n\n**换句话说，汉传自己就是\"公共产品路线\"的产物。** 它今天在海外最有效的方式，恰恰是它当年被接受的方式。（判断）\n\n由此得出一条具体建议：**对外传播的基本单位，应当从\"分院\"改为\"模块\"。**\n\n一座海外分院，是一个需要长期供养、需要僧才、需要当地信众的组织实体，它的成败取决于太多不可控因素。而一个\"模块\"是可复制、可授权、可独立运转的单元。可以考虑的模块包括：\n\n**英语禅七课程。** 标准化、可复制、可供不同道场使用，附带完整的教材、仪轨说明与带领者培训。这不是把中文课程翻译一下，而是重新设计一套为英语使用者从零开始的课程。\n\n**国际传戒合作机制。** 汉传手里唯一的完整比丘尼戒统，可以在多边框架下向有此需要的传统开放——1998 年菩提伽耶戒会已经开了一个头，但它是一次性的，尚未机制化。\n\n**灾害救援与跨宗教伙伴机制。** 慈济的模式已经证明可行：以无宗派偏见的救援行动进入非佛教社会，赢得信任，再让这份信任自然回流到佛教本身。\n\n**术语库与译经平台。** 见第二十七章。\n\n**可认证的学修课程。** 见第二十八章。\n\n**寺院治理模板。** 财务披露、独立申诉、交棒程序的现成范本，供新建道场参考。这一模块看起来最不\"佛教\"，实际上最解决海外传播的实际障碍——**信任。**\n\n把传播单位从\"分院\"改成\"模块\"，还带来一个额外好处：**它绕开了政治与身份的关口。** 一个道场是\"某个地方的佛教据点\"，容易被放进\"文化外交\"的框架里审视；一套救援机制、一个术语库、一门课程，是工具，工具不问来处。\n\n> **EN对应 · 26. Positioning: From Exporting Orders to Providing Public Goods**\n>\n> The contributions for which Chinese Buddhism is most recognized abroad and least contested are almost without exception non-proselytizing public goods: the bhikṣuṇī ordination lineage (an institution of the sangha), Tzu Chi's humanitarian and medical work, Dharma Drum's meditation training and lay transmission, the Buddhist Text Translation Society's translation and publishing, and university and scholarly collaboration.\n>\n> This is neither accident nor second best. It has a deep historical basis.\n>\n> **Buddhism entered China not through missionary orders** but through translation—a pure public knowledge good—and through medicine, famine relief, education, and road and bridge building. China received Buddhism not by being persuaded by a mission but by **using what it provided, and only later accepting what lay behind it.**\n>\n> **In other words, Chinese Buddhism is itself a product of the public goods route.** Its most effective method abroad today is precisely the method by which it was once received. (Judgment)\n>\n> Hence a concrete proposal: **the basic unit of transmission abroad should shift from the branch temple to the module.**\n>\n> An overseas branch temple is an organizational entity requiring long-term support, monastic personnel, and a local congregation; its fate depends on too many uncontrollable factors. A module is copyable, licensable, and able to run independently. Candidate modules:\n>\n> **English-language Chan retreat curricula.** Standardized, replicable, usable by different temples, with complete materials, ritual explanations, and leader training. This is not the translation of an existing Chinese course but the redesign of a course for English speakers starting from zero.\n>\n> **An international ordination cooperation mechanism.** The complete bhikṣuṇī lineage that Chinese Buddhism alone holds could be opened, in a multilateral framework, to traditions that need it. The 1998 Bodh Gaya ordination made a beginning, but it was a one-off and has not been institutionalized.\n>\n> **Disaster relief and interfaith partnership mechanisms.** The Tzu Chi model has proven workable: entering non-Buddhist societies through relief delivered without sectarian preference, earning trust, and letting that trust flow back naturally to Buddhism itself.\n>\n> **A terminology database and translation platform.** See Chapter Twenty-Seven.\n>\n> **Certifiable study programmes.** See Chapter Twenty-Eight.\n>\n> **Temple governance templates.** Ready models for financial disclosure, independent grievance procedures, and succession—for new temples to draw on. This module looks the least \"Buddhist\" and in practice addresses the most practical obstacle to transmission abroad: **trust.**\n>\n> Shifting the unit from branch temple to module brings a further advantage: **it bypasses the gateways of politics and identity.** A temple is \"a Buddhist foothold somewhere,\" readily examined within a framework of cultural diplomacy. A relief mechanism, a terminology database, a course—these are tools. Tools are not asked where they come from.\n\n---\n\n## 二十七、语言与译经：第一优先\n\n如果要为汉传的全球传播排一个优先级，第一位没有悬念。\n\n理由很直接：**没有可读的译本，禅修教学、教育、学术对话、跨宗教交流，全部无从谈起。** 前文第十章、第十九章已经从两个方向论证过这一点——汉文佛典绝大多数没有英译，而 AI 已经把这件事的成本降到了历史最低。\n\n具体该做三件事。\n\n**第一，建立分层的术语标准。**\n\n不是编一本\"标准词典\"，而是建一个**开放的、可引用的、有版本号的术语层**。它至少要有三个特征：\n\n一是允许多译并存。汉传两千年的译经史本身就是多译并存的历史，强行统一会抹掉信息（见第十九章）。\n\n二是每个译名标注来源——谁译的、哪个时代、依据什么。这使读者能够判断，也使后来的修订有据可依。\n\n三是有版本号、可引用。学者写论文时可以注\"据某某术语库 2027 版\"，这句话是学术规范的前提。**没有版本号，就没有人敢引；没有人引，它就不成为标准。**（判断）\n\n**第二，AI 初译 + 专家校订 + 分级标注。**\n\n流程见第十九章。这里要补的是**分级标注制度**：每一份译文都标明它经过了几道人工校订——未校、已校、权威三级。\n\n这个制度看起来只是质量标注，实际上它解决了一个更根本的问题：**它让\"不完美\"变得可用。** 如果没有分级，一份机器译文要么被当作成品（危险），要么被弃置不用（浪费）。有了分级，未校译文可以作为研究线索、作为初稿、作为检索入口，同时读者知道自己在用什么。\n\n**第三，建立覆盖率仪表盘。**\n\n把 BDK 那个\"65%\"变成可审计的指标。具体说，需要一份**按页（或按品）统计的汉文佛典英译覆盖率**——哪部经译了多少、谁在译、什么状态、质量如何。\n\n这件事的技术难度很低，组织难度很高，因为它要求各方公开自己的进度。但它的价值与难度成正比：**没有这把尺子，翻译规划就只能凭感觉排序。** 哪部先译、哪部重译、哪部已有多个译本不必再译，全都答不上来。\n\n### 一件被忽略的配套工作\n\n译经之外，还有一件同样重要却几乎无人做的事：**写教科书。**\n\n藏传在西方的成功，很大程度上靠的是**成体系的英文教材**——从入门到进阶，有课本、有讲义、有术语表、有练习，学校的课程可以直接采用。汉传在英文世界里几乎没有这样的东西。一位美国大学的宗教学教师想开一门汉传佛教的课，找不到合适的教科书；一位对汉传感兴趣的西方读者想系统入门，找不到一本讲得清楚的导论。\n\n**结果是：汉传在西方学界的\"入口\"极窄。** 学者可以研究它，但学生进不来；学生进不来，二十年后就没有学者了。\n\n所以有一个建议，值得排在译经之后、其他所有事情之前：**组织一批真正的学者与法师，写三五本英文的汉传佛教入门教材与课程包**——一本通史、一本教理导论、一本禅修实践手册、一本术语详解。用最好的英文写，配最高质量的中文引文，由大学出版社出版。\n\n**这件事投入不大，杠杆极高。**（判断）\n\n### 一个反直觉的判断\n\n最后要说一件与直觉相反的事。\n\n很多人认为，AI 翻译普及之后，译经人才的需求会下降。本文的判断相反：**需求会上升。**\n\n原因是翻译工作分两段。AI 能胜任的是\"初译\"这一段——把古汉语转成通顺的现代语言。而\"审校\"这一段不但不能被替代，反而变得更关键：当机器每天产出成千上万段初稿时，**唯一稀缺的是能够判断\"这段译文对不对\"的人。**\n\n而判断一段佛典译文对不对，需要的恰恰是最难培养的能力：通古汉语、通梵藏、通教理、通宗派差异、还要通目标语言。**AI 让初译变便宜，等于让审校变得更贵。**（判断）\n\n这对僧伽教育的含义是具体的：如果十年后佛典翻译的瓶颈在审校，那么今天开始的译经人才培养，方向应当是**培养能审校的人**，而不是培养能初译的人。\n\n> **EN对应 · 27. Language and Translation: The First Priority**\n>\n> If priorities for Chinese Buddhism's global transmission must be ranked, the first has no competitor.\n>\n> The reason is direct: **without readable translations, meditation instruction, education, scholarly dialogue, and interreligious exchange all have nowhere to begin.** Chapters Ten and Nineteen have argued this from two directions—the overwhelming majority of the Chinese canon has no English translation, and AI has brought the cost of changing this to a historic low.\n>\n> Three things should be done.\n>\n> **First, build a layered terminology standard.**\n>\n> Not \"a standard dictionary\" but an **open, citable, versioned terminology layer**. It needs at least three features.\n>\n> It must permit coexisting renderings. Two thousand years of Chinese translation history is itself a history of coexisting renderings, and forced uniformity erases information (see Chapter Nineteen).\n>\n> Each rendering must carry its source—who translated it, in what period, on what basis. This lets readers judge, and gives later revision something to stand on.\n>\n> It must be versioned and citable. A scholar should be able to write \"according to Terminology Database X, 2027 edition.\" That sentence is the precondition of scholarly convention. **Without a version number no one dares cite it; uncited, it never becomes a standard.** (Judgment)\n>\n> **Second, AI first draft plus expert revision plus graded labelling.**\n>\n> The pipeline is given in Chapter Nineteen. What must be added here is the **grading system**: every translation should state how many rounds of human review it has passed—unreviewed, reviewed, authoritative.\n>\n> The system looks like quality labelling. In fact it solves a deeper problem: **it makes imperfection usable.** Without grading, a machine translation is either treated as finished product (dangerous) or discarded (wasteful). With grading, an unreviewed translation can serve as a research lead, a first draft, or a search entry point—while the reader knows what he is using.\n>\n> **Third, build a coverage dashboard.**\n>\n> Turn BDK's \"65 percent\" into an auditable metric. Specifically, a **page-by-page or chapter-by-chapter count of English translation coverage for the Chinese canon**—which texts have been translated, how much, by whom, in what state, at what quality.\n>\n> Technically this is easy. Organizationally it is hard, because it requires all parties to disclose their progress. But its value is proportional to its difficulty: **without that ruler, translation planning can only be ordered by feel.** What to translate first, what to retranslate, what already exists in multiple versions and need not be translated again—none of it can be answered.\n>\n> **A companion task that gets overlooked.** Beyond translation, there is a task of equal importance that almost no one does: **writing textbooks.**\n>\n> Tibetan Buddhism's success in the West rests heavily on **systematic English teaching materials**—textbooks, lecture notes, glossaries, and exercises, from introductory to advanced, adoptable directly by university courses. Chinese Buddhism has alm
