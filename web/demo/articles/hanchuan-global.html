ost nothing of the kind in English. A religion professor wanting to offer a course on Chinese Buddhism finds no suitable textbook; an interested Western reader wanting a systematic introduction finds no clear guide.\n>\n> **The result: the entry point into Chinese Buddhism in Western academia is very narrow.** Scholars can study it, but students cannot get in; and if students cannot get in, in twenty years there will be no scholars.\n>\n> Hence a recommendation that deserves to rank immediately after translation and ahead of everything else: **organize a group of genuine scholars and monastics to write three to five English introductory textbooks and course packages for Chinese Buddhism**—a history, an introduction to doctrine, a practice manual, and a glossary. Written in the best English, with the highest-quality Chinese citations, published by a university press.\n>\n> **Small investment, very high leverage.** (Judgment)\n>\n> **One counter-intuitive judgment.** One thing runs against intuition.\n>\n> Many assume that as AI translation spreads, the demand for translation talent will fall. This report judges the opposite: **demand will rise.**\n>\n> Translation has two stages. What AI handles well is the first—turning classical Chinese into fluent modern language. The second stage, review, cannot merely be replaced; it becomes more critical. When a machine produces thousands of draft passages a day, **the only scarce thing is a person able to judge whether a given rendering is correct.**\n>\n> And judging whether a Buddhist translation is correct demands precisely the hardest capacities to train: command of classical Chinese, of Sanskrit and Tibetan, of doctrine, of differences among schools, and of the target language. **AI makes first drafts cheap—which makes review more expensive.** (Judgment)\n>\n> The implication for monastic education is concrete. If in ten years the bottleneck in translation is review, then the training begun today should aim at **producing reviewers, not producers of first drafts.**\n\n---\n\n## 二十八、人才：学修次第与交棒\n\n海外道场最缺什么？前文引的那份教内调研给出的答案是：**弘法人员的外语能力。**\n\n这个答案往下追一层，会追到一个更根本的缺口：**汉传缺一套可以用现代语言说明白、并且可以教、可以学、可以验证的学修次第。**\n\n对照是明显的。藏传有一部五部大论、一个格西学位、一套辩经制度——任何一个对藏传感兴趣的人，都能立刻知道\"学藏传要学什么、学多久、学到什么程度算数\"。南传有巴利三藏、有戒定慧的明确次第、有内观禅修的标准化课程。而一个想问\"学汉传要学什么\"的人，得到的回答往往是\"看你跟哪个师父、进哪个法门\"。\n\n**这个答案在教内是成立的，对教外是无效的。** 因为教外的人要的是入口，而\"看你跟哪个师父\"不是入口，是入口之后的事。\n\n### 汉传其实不缺次第\n\n这里有一个重要的辨正：汉传不是没有次第，是**没有把次第整理成对外的形态**。\n\n汉传手里有的是什么？智顗的《摩诃止观》，把止观修行的次第讲得极细；杜顺的《五教止观》，把五教与观行的对应关系梳理清楚；宗密在《禅源诸诠集都序》里对三种禅（息妄修心宗、泯绝无寄宗、直显心性宗）的判摄；法藏、澄观对法界观的层层展开；净土宗对信愿行与九品往生的次第安立。**这些是相当系统的学修架构，其精细程度不输任何传统。**\n\n问题在于，它们大多以古汉语书写、以传统注疏体例呈现、预设读者已经有相当的佛学基础。要变成\"一位英语使用者可以从零开始跟着走的路\"，需要一次彻底的再表述：把次第抽出来，把次第所依据的教理讲清楚，把每一阶段的目标、方法、验证方式写明白。\n\n这不是降低标准，是**换一种方式说同一件事**。\n\n### 三条人才路径\n\n**本地出生的教师。** 这需要时间，但方向必须明确：培养本地人成为教师，而不只是培养本地人成为信众。法鼓山把法脉传给西方人，是目前走得最远的一步；其余教团在这一步上仍多犹豫。\n\n**居士领导。** 汉传的传统是僧主俗从，但在西方语境下，居士在组织、学术、传播上的作用远大于传统格局所允许的。法鼓山的居士法嗣路径已经开了一个口子。这里的分寸需要谨慎——居士承担组织与教学，与僧团承担传法与戒法，是两条不同的线，不宜混同，但两条线都需要有人走。\n\n**双语僧才。** 这是最缺的，也是投入最大的。一所国际化的佛学院，二十年才能产出稳定的双语僧才队伍。**没有捷径。**（判断）\n\n### 交棒\n\n圣严 2009 年、惟觉 2016 年、星云 2023 年相继圆寂，证严已近九十岁。\n\n这些教团的组织能力都很强，但它们的权威结构都建立在创办学人的个人德行与魅力之上。**这不是缺陷，是正常的历史阶段**——所有的宗教组织都经历过创始人时代。问题只在于，创始人之后会发生什么。\n\n制度上的答案并不复杂：董事会制、多住持制、明确的任期与继承程序、独立的监督机制。难的是两个地方：一是**权力下放的真实性**——制度可以写下来，权柄可以不放；二是**宗教权威与组织权力的区分**——住持的权威来自戒定慧与僧团印可，董事的权威来自章程与选举，这两者在丛林制度里从未分开过，需要重新厘清。\n\n> **EN对应 · 28. Personnel: Study Sequences and Succession**\n>\n> What do overseas temples lack most? The in-house survey cited earlier answers: **foreign-language ability among those who teach the dharma.**\n>\n> Follow that answer down one level and it reaches a more fundamental gap: **Chinese Buddhism lacks a sequence of study and practice that can be explained in modern language, and that can be taught, learned, and verified.**\n>\n> The contrast is stark. Tibetan Buddhism has the five great treatises, the geshe degree, and a debate curriculum—anyone interested can learn at once what one studies, for how long, and to what standard. Theravāda has the Pali canon, an explicit sequence of precepts, concentration, and wisdom, and standardized vipassanā courses. A person asking \"what does one study in Chinese Buddhism\" is typically told, \"it depends which teacher you follow and which practice door you enter.\"\n>\n> **That answer works inside the tradition. It does not work outside it.** An outsider wants an entry point, and \"it depends which teacher you follow\" is not an entry point. It is what comes after one.\n>\n> **Chinese Buddhism is not actually short of sequences.** An important correction: the problem is not that no sequence exists, but that **the sequence has never been organized into a form usable from outside.**\n>\n> What does Chinese Buddhism hold? Zhiyi's *Great Calming and Contemplation* lays out the stages of śamatha-vipassanā practice in extraordinary detail. Dushun's *Five Teachings of Calming and Contemplation* maps the correspondence between the five teachings and contemplative practice. Zongmi's *Preface to the Collected Writings on the Source of Chan* surveys three kinds of Chan—the school that extinguishes delusion and cultivates mind, the school that annihilates nothing and rests nowhere, and the school that directly reveals the mind-nature. Fazang and Chengguan unfold the contemplation of the dharma-realm layer by layer. Pure Land establishes the sequence of faith, vow, and practice with the nine grades of rebirth. **These are highly systematic architectures of study and practice, as finely articulated as any tradition's.**\n>\n> The problem is that they are mostly written in classical Chinese, presented in the form of traditional commentary, and assume a reader who already has considerable Buddhist background. Turning them into \"a path an English speaker can follow from zero\" requires a thorough restatement: extract the sequence, explain the doctrine it rests on, and set out clearly the goal, method, and mode of verification at each stage.\n>\n> This is not a lowering of standards. It is **saying the same thing in another way.**\n>\n> **Three paths for personnel.**\n>\n> **Locally born teachers.** This takes time, but the direction must be clear: train local people to become teachers, not merely to become followers. Dharma Drum Mountain's transmission of the lineage to Westerners is the furthest anyone has gone; other orders remain hesitant at this step.\n>\n> **Lay leadership.** Chinese Buddhist tradition puts monastics first and laity after, but in Western contexts laypeople play a far larger role in organization, scholarship, and communication than the traditional arrangement allows. Dharma Drum's lay-heir path has opened a door. The balance requires care—laypeople taking on organization and teaching, and the sangha taking on transmission and precepts, are two different lines; they should not be conflated, but both need people walking them.\n>\n> **Bilingual monastic talent.** This is the scarcest and the most expensive. An international Buddhist college needs twenty years to produce a stable cohort of bilingual monastics. **There is no shortcut.** (Judgment)\n>\n> **Succession.** Sheng Yen died in 2009, Weijue in 2016, Hsing Yun in 2023, and Cheng Yen is nearly ninety.\n>\n> These orders are organizationally strong, but each rests its authority on the founder's personal virtue and charisma. **This is not a defect; it is a normal historical stage**—every religious organization passes through a founder era. The only question is what follows.\n>\n> The institutional answers are not complicated: a board, multiple abbots, explicit terms and succession procedures, independent oversight. The difficulty lies in two places. One is **whether the delegation of power is genuine**—institutions can be written down while the reins are not released. The other is **distinguishing religious authority from organizational authority**—an abbot's authority comes from precepts, concentration, and wisdom and from the sangha's sanction; a trustee's comes from bylaws and election. In the monastic system the two were never separated and now must be disentangled.\n\n---\n\n## 二十九、治理与寺院经济\n\n### 三条制度补课\n\n第六章已经说明：过去十年两起最大的事件，暴露的都不是道德问题，而是**监督机制未能运转**。补课的方向因此也是制度的。\n\n**第一，财务审计披露。** 这一条听起来最世俗，实际上最要紧。具体的做法不必复杂：统一的年报格式、定期公布、可被外部核对。**不需要做到上市公司的透明度，只需要做到\"外界能看懂、能追问\"。** 一个愿意公布年报的寺院，与一个不愿意的寺院，在海外募款与建立信任上的差别是实质性的。\n\n**第二，独立申诉渠道。** 学诚案始于两名前僧人的举报；举报之所以外流，是因为内部没有可走的路。所谓独立，不必然是外部机构介入——它可以是一个由不同寺院僧众共同组成、独立于被申诉人所在寺院的评议机制。\n\n**第三，交棒机制。** 见第二十八章。\n\n第六章已经指出一个方向：汉传要补的不是\"学西方\"，而是**把丛林制度里本来就有的东西重新长出来**——羯磨、揭露、僧团议事。汉传戒律里的羯磨法，本就是一套决策与处理程序：什么事需要白一羯磨，什么事需要白四羯磨，犯了什么程度的戒当如何处置，都有明文。**这套程序比许多现代组织的议事规则更精密，问题只在它长期未被用于财务与人事这类\"新问题\"上。**（判断）\n\n### 寺院经济：从香火到公共产品\n\n商业化的问题，往往被简化成\"不要贪钱\"的道德劝诫。这个劝诫是对的，但不解决问题，因为寺院要维持，就必须有经济来源。\n\n真正的问题因此变成：**依赖什么样的经济来源，是可持续的、也是不损害宗教性的？**\n\n**香火经济**依赖人流与仪式服务：门票、香火、法会、超度、纪念品。它的特点是现金、即时、与人流强绑定，因此天然趋向商业化——人流是可以营销的，营销需要投入，投入需要回报，回报需要更多人流量。这个循环一旦启动，很难自行停止。少林就是走到了这个循环的端点上。\n\n**公共产品经济**是另一条路：教育（佛学院、课程、教材）、出版（译经、书籍、音像）、文化（展览、艺术、学术活动）、社会服务（慈善、医疗、临终关怀）。这些可以收费，且收费不损害宗教性——因为收费的理由是\"提供了有价值的服务\"，不是\"你拜了就要给钱\"。\n\n这条路的难点在于它**要求人才**。香火经济只需要场地与仪式；公共产品经济需要教师、编辑、译者、管理者。**这就是为什么商业化如此难以摆脱：它是低门槛的默认选项。**（判断）\n\n### 把寺庙热接住\n\n大陆的青年\"寺庙热\"（见第十一章）是这十年来最大的一个入口，而它正在被浪费。\n\n不是没有人在做。据腾讯佛教频道，2014 年以来已有 100 余座寺院举办过主题禅修营，可以作为入口。但相对于三万多有僧团的寺院，一百余座是极小的比例；而这些禅修营大多是一次性活动，活动结束，参与者也就散了。\n\n**可以设计的是一条阶梯，而不是一场活动：**\n\n第一级：**入门**。一次禅修营、一门线上课程、一本写得明白的小册子。目标是让对方理解\"佛教在讲什么\"，而不是要求他接受。\n\n第二级：**持续**。固定的每周共修、可以反复参加的课程、有反馈的学习小组。**这一级是全部阶梯里最关键的一级，也是目前最缺的一级。**（判断）从\"偶尔来\"到\"每周来\"，中间隔着的不是兴趣，是**一个他认识的、会问他\"上周怎么没来\"的人**。\n\n第三级：**深入**。系统的教理学习、禅修进阶、经论研读。\n\n第四级：**承担**。成为志工、成为教学的辅助者、成为社群的组织者。\n\n这条阶梯的每一级都可以做得很好，也可以虚应故事。区别只在于：**有没有人真的在管这件事。** 而这就要求寺院里有一个岗位，专门负责\"来的人下一步去哪里\"。目前多数寺院没有这个岗位。\n\n> **EN对应 · 29. Governance and Temple Economy**\n>\n> **Three institutional remedies.** Chapter Six has shown that the two largest events of the past decade exposed not moral problems but **a failure of oversight to function.** The remedies are therefore institutional.\n>\n> **First, audited financial disclosure.** This sounds the most mundane and matters the most. The method need not be complex: a uniform annual report format, regularly published, externally checkable. **It need not reach the transparency of a listed company—only the point where an outsider can read it and ask questions.** The difference between a temple willing to publish an annual report and one unwilling to is substantive when it comes to fundraising and building trust abroad.\n>\n> **Second, an independent grievance channel.** The Xue Cheng affair began with a report by two former monastics; the report leaked because there was no internal path. Independent need not mean external intervention—it can be a review mechanism composed of monastics from other temples, independent of the temple where the accused resides.\n>\n> **Third, succession mechanisms.** See Chapter Twenty-Eight.\n>\n> Chapter Six identified a direction: what Chinese Buddhism needs to add is not \"what the West does,\" but to **regrow what the monastic system already contained**—karma-vācā, disclosure, communal deliberation. The karma-vācā procedures in the Chinese Vinaya are themselves a decision-making and case-handling process: what requires a single motion, what requires a motion put four times, how a given degree of offense is to be handled—all set down in writing. **These procedures are more refined than the deliberative rules of many modern organizations. The only problem is that they were long not applied to \"new problems\" such as finance and personnel.** (Judgment)\n>\n> **The temple economy: from incense money to public goods.** Commercialization is usually reduced to the moral exhortation \"do not be greedy.\" The exhortation is right but solves nothing, because a temple must be sustained and therefore must have income.\n>\n> The real question is therefore: **which sources of income are sustainable without damaging the religious character?**\n>\n> **The incense economy** depends on foot traffic and ritual services: tickets, incense, dharma assemblies, funerary rites, souvenirs. It is cash-based, immediate, and tightly bound to traffic—and therefore tends naturally toward commercialization. Traffic can be marketed; marketing costs money; money needs returns; returns need more traffic. Once the loop starts it is hard to stop. Shaolin reached the end of it.\n>\n> **The public-goods economy** is the other road: education (colleges, courses, textbooks), publishing (translation, books, recordings), culture (exhibitions, art, academic events), and social service (charity, medicine, hospice care). These can be charged for without harming religious character, because the justification is \"a valuable service was provided,\" not \"you worshipped, so you pay.\"\n>\n> The difficulty of this road is that it **requires talent.** The incense economy needs only premises and ritual. The public-goods economy needs teachers, editors, translators, managers. **This is why commercialization is so hard to escape: it is the low-threshold default.** (Judgment)\n>\n> **Catching the temple boom.** The youth \"temple boom\" on the mainland (see Chapter Eleven) is the largest entry point of the past decade, and it is being wasted.\n>\n> Some are working at it. According to Tencent's Buddhism channel, more than 100 temples have held themed meditation camps since 2014, and they can serve as an entry point. But against more than 33,000 temples with monastic communities, a hundred-odd is a very small proportion; and most such camps are one-off events. The event ends, and the participants disperse.\n>\n> **What can be designed is a ladder, not an event.**\n>\n> Level one: **introduction.** A retreat, an online course, a clearly written pamphlet. The goal is to let the person understand what Buddhism teaches, not to demand that he accept it.\n>\n> Level two: **continuity.** A regular weekly gathering, a course that can be taken repeatedly, a study group with feedback. **This is the most critical level of the whole ladder, and the one most absent.** (Judgment) Between \"comes occasionally\" and \"comes every week\" stands not interest but **a person he knows, who will ask him why he missed last week.**\n>\n> Level three: **depth.** Systematic doctrinal study, advanced meditation, close reading of texts.\n>\n> Level four: **responsibility.** Becoming a volunteer, an assistant teacher, an organizer of the community.\n>\n> Every level of this ladder can be done well or gone through the motions. The difference lies in **whether anyone is actually minding it.** Which requires a position in the temple responsible for \"where does the person who came go next.\" Most temples do not have it.\n\n---\n\n## 三十、本土化的边界\n\n星云大师的\"走出去→国际化→本土化\"是汉传海外传播最清晰的一条路线。它成立，而且有佛光山自身作为证据。\n\n但本土化有一个从未被认真回答的问题：**边界在哪里？**\n\n### 一个实用的检验\n\n先给一个判准，它比任何理论都实用：\n\n**看这个改变是为了\"让对方能进来\"，还是为了\"让自己好卖\"。**\n\n前者是本土化，后者是稀释。设一个英文共修班，是为了让不懂中文的人能开始——这是前者；把禅修课包装成减压课程、把因果轮回讲成心理暗示，是为了好卖——这是后者。\n\n这个判准的好处是它可操作：每一次调整都可以问一遍。\n\n### 可变与不可变\n\n沿这条判准往下分：\n\n**可以变的**——语言（用英语、西班牙语、越南语说法）、组织形式（董事会、基金会、公司化的管理结构）、仪式的表达方式（唱念的语言与曲调、法会的流程编排）、教育方法（课程化、学期制、线上教学）、生活起居（饮食、衣着、作息对当地的适应）。\n\n**不可变的**——戒律的核心（四根本戒无所谓文化差异）、传承的完整性（法脉不能为了好看而拼凑）、义理的基本判断（不能为了迎合而把\"无我\"讲成\"找到真我\"）。\n\n这条线不是绝对的，中间有大量需要判断的地带。但有一类改变，是明确越界的：**当改变的目的是让受众不必改变自己时。** 佛法的传播从来要求某种改变——不是文化上的改变，是见解与行为上的改变。一个不需要任何人改变任何事的\"佛教\"，已经不是佛教了。（判断）\n\n### 关于\"去中国化\"\n\n这是最敏感也最实际的一问：汉传在西方，要不要去掉中国文化的成分？\n\n本文的回答是：**文化形式可以变，法脉不能断；而汉传之所以是汉传，不在于它说中文，在于它持有汉传的传承与判教立场。**\n\n一个说流利英语、采用西方组织方式、课程按学期开设、学员多半是白人、但完整持有汉传传承与义理、并且讲得出天台、华严、唯识所以然来的教团，比一个说中文、穿汉服、上香拜忏一如国内、却讲不出自家宗派义理的教团，**更\"汉传\"。**（判断）\n\n这个判断有现实意义。许多海外道场为了保持\"传统\"，把大量的组织资源投在维持语言与仪式的原样上，结果是：本地人进不来，二代留不住，最后只剩下第一代移民，随着他们老去而自然消亡。**以守护传统为名，行断送传承之实。** 这是本文在海外看到的最普遍的一种自我损耗。（判断）\n\n反过来，也有另一种风险：为了本土化而把义理抽空，最后只剩一个\"静坐俱乐部\"。这一种肉眼可见，反而容易警觉。\n\n**两种风险中，前一种才是更普遍的、也更难察觉的。**\n\n> **EN对应 · 30. The Boundaries of Localization**\n>\n> Master Hsing Yun's \"go out → internationalize → localize\" is the clearest route Chinese Buddhism has set for overseas transmission. It holds, and Foguang Shan itself is the evidence.\n>\n> But localization has one question never seriously answered: **where is the boundary?**\n>\n> **A practical test.** Begin with a criterion more useful than any theory:\n>\n> **Ask whether a given change is made so the other person can come in, or so that we can sell better.**\n>\n> The first is localization; the second is dilution. Starting an English practice group so that people who do not read Chinese can begin—that is the first. Packaging meditation as stress reduction and explaining karma and rebirth as psychological suggestion—that is the second.\n>\n> The advantage of this test is that it is operable: every adjustment can be run through it.\n>\n> **What can change and what cannot.** Along this line:\n>\n> **What can change**—language (English, Spanish, Vietnamese); organizational form (boards, foundations, corporate management structures); modes of ritual expression (the language and melody of chanting, the ordering of a liturgy); educational method (courses, semesters, online teaching); daily life (adaptation of food, clothing, and schedule to local conditions).\n>\n> **What cannot change**—the core of the precepts (the four root precepts are indifferent to culture); the integrity of the lineage (the transmission may not be pieced together for appearance); the basic determinations of doctrine (one may not, to please, render \"non-self\" as \"finding your true self\").\n>\n> The line is not absolute, and a large middle ground requires judgment. But one class of change clearly crosses it: **change made so that the audience need not change at all.** The transmission of the dharma has always required a kind of change—not cultural change, but a change in view and conduct. A \"Buddhism\" that requires no one to change anything is no longer Buddhism. (Judgment)\n>\n> **On \"de-Sinicization.\"** This is the most sensitive and most practical question: in the West, should Chinese Buddhism shed its Chinese cultural elements?\n>\n> This report's answer: **cultural forms may change; the lineage may not be broken. And what makes Chinese Buddhism Chinese is not that it speaks Chinese, but that it holds the Chinese transmission and its doctrinal standpoint.**\n>\n> An order that speaks fluent English, adopts Western organizational forms, runs courses by semester, and has a mostly white membership—but fully holds the Chinese lineage and doctrine and can explain Tiantai, Huayan, and Yogācāra on their own terms—is **more \"Chinese Buddhist\"** than an order that speaks Chinese, wears Chinese robes, and performs liturgies exactly as at home, yet cannot explain the doctrine of its own school. (Judgment)\n>\n> The judgment has practical weight. Many overseas temples, in order to preserve \"tradition,\" invest a large share of organizational resources in keeping language and ritual unchanged. The result: locals cannot enter, the second generation does not stay, and what remains is the first generation of immigrants, fading as they age. **In the name of guarding the tradition, the transmission is ended.** This is the most widespread form of self-erosion this report observed abroad. (Judgment)\n>\n> The opposite risk exists: hollowing out the doctrine in the name of localization until nothing remains but a sitting club. That one is visible and therefore easier to guard against.\n>\n> **Of the two, the first is more common and much harder to notice.**\n\n---\n\n## 三十一、数字基础设施与传播主体\n\n第三部已经说明：佛教 AI 的核心竞争力在语料、版本、出处、术语、传统区分，而不在模型大小。对汉传来说，这意味着一个明确的行动纲领。\n\n**要做三件事：**\n\n**其一，把汉文佛典的权威数据做成开放、可引用、有版本的标准。** 这不是新建，而是整合 CBETA、SAT、DILA 以及灵隐寺等已有的工作，加上统一的元数据规范与版本控制。\n\n**其二，把术语层与平行语料开放出来。** 见第二十七章。\n\n**其三，建立可验证的 AI 与覆盖率仪表盘。** 把\"可信佛学 AI\"的标准工作流（第十八章）作为公开规范发布，让所有做佛教 AI 的团队都可以遵循；把英译覆盖率作为公共指标持续公布。\n\n**这三件事做完，汉传在全球佛学知识秩序里的位置就确定了。** 反过来，如果十年后这三件事仍由别人在做，那么汉传就只能适配别人定下的秩序。（判断）\n\n### 谁来做\n\n这是全文最想强调的一点。\n\n上面这些事，**都不需要一个新教团，需要一个联盟。**\n\n理由很清楚：CBETA 有数据与学术信誉，但没有教团资源；佛光山有国际网络与资金，但不以数字人文为专长；灵隐寺有技术团队与古籍，但范围限于自家项目；学术机构有方法，但不掌握经典与僧团。**任何一家单独做，都会缺一角；合起来，恰好完整。**\n\n组织形态建议采用一个轻量的结构：一个**佛学 AI 与数字人文研究中心**，由一个高校、佛学院、大型佛教组织或跨机构联盟承办。最小可行团队不是单纯的 AI 团队，而是：佛学家、文献学家、数字人文学者、NLP/LLM 工程师、数据工程师、产品与体验人员、多语翻译专家、伦理治理人员。\n\n其中最重要的一条是：**佛学专家必须真正进入 AI 开发流程，而不是在最后验收时被请来签字。** 这条听起来是常识，实际最容易落空，因为它意味着佛教学者要在项目里花时间做工程性的工作——整理语料、标注术语、校验出处——这些工作不算学术成果。\n\n**因此还需要一个配套的机制：让这些工作算成果。** 一个参与语料建设的佛教学者，应当在学术评价体系里得到承认。这一点如果解决不了，所有\"专家进入流程\"的呼吁都会落空。（判断）\n\n治理上采用三委员会结构：**学术委员会**负责经典、版本、历史、术语与研究规范；**技术委员会**负责数据、模型、RAG、评测与安全；**伦理治理委员会**负责隐私、权威模拟、宗教伦理、未成年人、心理风险与数据使用边界。\n\n> **EN对应 · 31. Digital Infrastructure and Who Should Build It**\n>\n> Part Three established that the core competitiveness of Buddhist AI lies in corpora, editions, provenance, terminology, and the distinguishing of traditions—not in model size. For Chinese Buddhism this yields a clear programme.\n>\n> **Three things to do.**\n>\n> **First, make authoritative Chinese canonical data open, citable, and versioned.** This is not new construction but the integration of existing work at CBETA, SAT, DILA, and Lingyin Temple, with unified metadata standards and version control.\n>\n> **Second, open up the terminology layer and parallel corpora.** See Chapter Twenty-Seven.\n>\n> **Third, build verifiable AI and a coverage dashboard.** Publish the standard workflow for trustworthy Buddhist AI (Chapter Eighteen) as an open specification that any Buddhist AI team may follow, and publish English-translation coverage continuously as a public metric.\n>\n> **Once these three are done, Chinese Buddhism's place in the global order of Buddhist knowledge is settled.** Conversely, if in ten years the three are still being done by others, Chinese Buddhism will be adapting to an order someone else defined. (Judgment)\n>\n> **Who should build it.** This is the point the whole report most wants to press.\n>\n> None of the above **requires a new order. It requires an alliance.**\n>\n> The reasoning is plain. CBETA has data and scholarly credibility but no order's resources. Foguang Shan has an international network and funding but no specialization in digital humanities. Lingyin Temple has a technical team and rare books but a scope limited to its own project. Academic institutions have method but hold neither the canon nor the sangha. **Any one of them acting alone is missing a corner; together they are exactly complete.**\n>\n> The organizational form suggested is light: a **centre for Buddhist AI and digital humanities**, hosted by a university, a Buddhist college, a large Buddhist organization, or a cross-institutional consortium. The minimal viable team is not an AI team alone but: Buddhologists, textual scholars, digital humanists, NLP and LLM engineers, data engineers, product and UX staff, multilingual translation specialists, and ethics and governance staff.\n>\n> The most important rule is this: **Buddhist specialists must genuinely enter the AI development process, not be invited to sign off at the end.** This sounds like common sense and is in practice the easiest thing to lose, because it means Buddhist scholars spending project time on engineering work—organizing corpora, annotating terminology, verifying sources—none of which counts as scholarship.\n>\n> **A companion mechanism is therefore required: make that work count.** A Buddhist scholar contributing to corpus building should receive recognition in academic evaluation. Unless this is resolved, every call for \"specialists in the process\" will come to nothing. (Judgment)\n>\n> Governance takes a three-committee structure: an **academic committee** for canon, editions, history, terminology, and research norms; a **technical committee** for data, models, RAG, evaluation, and safety; and an **ethics and governance committee** for privacy, simulation of authority, religious ethics, minors, psychological risk, and the boundaries of data use.\n\n---\n\n## 三十二、国际参与：找那个交换结构\n\n第七章说过，地缘现实绕不开，达赖喇嘛问题与中印竞争不会因为谁不高兴就消失。这一节要说的不是回避，而是**在哪些地方可以不零和**。\n\n### 先把可以交换的东西摆出来\n\n汉传与藏传、南传之间，其实存在一个很清楚的互补结构：\n\n**汉传可以给出去的**——完整的比丘尼戒统（全球唯一）；大乘社会参与的组织经验（慈济、佛光山的百年实践）；人间佛教\"入世而不失出世\"的现代样本；汉文大藏经中那些印度已失传的论典。\n\n**汉传可以学进来的**——藏传的学修次第与学位体系（第二十八章）；南传的禅修技术标准化与大众化方法（第九、十章）；日本佛教的学术化与宗学教育体系（本报告因语种限制未能展开）。\n\n这个结构之所以重要，是因为它把\"竞争\"变成了\"交换\"。**当双方各有对方没有的东西时，合作就不需要以善意为基础。**（判断）\n\n值得注意的是，汉传在其中的位置是\"给得多、要得少\"——比丘尼戒统是三大语系里只有汉传有的，而学修次第则是汉传可以自己建、也可以学。**这个位置其实比想象中有利，前提是汉传自己要意识到手里有什么。**（判断）\n\n### 三条具体建议\n\n**第一，把多边平台用足。** 联合国系统（慈济已有经社理事会咨商地位）、大学、国际佛教组织，这三类平台的政治敏感度低于国与国之间的场合，承载合作的能力更强。\n\n**第二，把世界佛教论坛的议程打开。** 增加非中国籍的共同主办与议程共治；重心放在共识度最高的三块——遗产保护、佛典数字化、人道救援。这三块的共同点是：**没有人会反对，而做成了所有人都受益。**\n\n**第三，扩大\"低争议区\"。** 有些领域天然低争议：古籍数字化、术语标准、译经合作、遗产修复、灾害救援、临终关怀。这些领域不需要先解决政治问题就能推进，而它们积累的信任会外溢到其他领域。\n\n### 一句实话\n\n上述建议若要生效，有一个前提，说起来不太好听：\n\n**汉传需要让别人相信，它做这些事不是为了让别人欠它人情。**\n\n这个前提无法靠声明解决，只能靠时间与一致性——同一件事做十年，不附加条件，不因政治气候而改变，别人才会慢慢相信它是真的在做这件事，而不是在做一个项目。**这是所有的\"软实力\"讨论里最容易被忽略的一点：软实力长在别人身上，不长在自己身上，所以它无法被单方面生产出来。**（判断）\n\n> **EN对应 · 32. International Engagement: Finding the Exchange Structure**\n>\n> Chapter Seven established that geopolitical realities cannot be sidestepped—the Dalai Lama question and Sino-Indian rivalry will not vanish because someone dislikes them. This section is not about avoidance; it is about **where the game need not be zero-sum.**\n>\n> **First, lay out what can be exchanged.** A clear complementary structure exists among Chinese, Tibetan, and Theravāda Buddhism.\n>\n> **What Chinese Buddhism can give**—the complete bhikṣuṇī ordination lineage, unique in the world; a century of organizational experience in Mahāyāna social engagement (Tzu Chi, Foguang Shan); a modern example of Humanistic Buddhism that is engaged without losing the supramundane; and the treatises preserved in the Chinese canon that were lost in India.\n>\n> **What Chinese Buddhism can take in**—Tibetan Buddhism's study sequences and degree system (Chapter Twenty-Eight); Theravāda's techniques for standardizing and popularizing meditation (Chapters Nine and Ten); Japanese Buddhism's academic and sectarian educational systems (not developed here, owing to the language limits noted earlier).\n>\n> The structure matters because it turns competition into exchange. **When each side holds what the other lacks, cooperation does not need goodwill as its foundation.** (Judgment)\n>\n> Notably, Chinese Buddhism's position in this structure is one of giving more and needing less—the bhikṣuṇī lineage exists among the three traditions only in Chinese Buddhism, while the study sequence is something Chinese Buddhism can build for itself or learn from others. **The position is more advantageous than it appears, provided Chinese Buddhism realizes what it holds.** (Judgment)\n>\n> **Three concrete proposals.**\n>\n> **First, use multilateral platforms fully.** The UN system (Tzu Chi already holds consultative status with ECOSOC), universities, and international Buddhist organizations are all less politically sensitive than state-to-state settings and better able to carry cooperation.\n>\n> **Second, open the agenda of the World Buddhist Forum.** Add non-Chinese co-hosts and shared agenda governance, and focus on the three areas of highest consensus—heritage preservation, digitization of Buddhist texts, and humanitarian relief. What the three share is that **no one objects to them, and everyone benefits when they succeed.**\n>\n> **Third, widen the low-controversy zone.** Some fields are inherently low-controversy: digitization of rare books, terminology standards, translation cooperation, heritage restoration, disaster relief, hospice care. These do not require political questions to be settled first, and the trust they accumulate spills over into other fields.\n>\n> **One plain statement.** If the above is to work, one precondition applies, and it is not flattering to say:\n>\n> **Chinese Buddhism needs others to believe it is not doing these things in order to put them in its debt.**\n>\n> That precondition cannot be met by declaration, only by time and consistency—doing the same thing for ten years, without conditions, without shifting with the political weather, until others slowly believe it is genuinely doing the thing rather than running a project. **This is the point most often missed in all discussions of soft power: soft power grows on other people, not on oneself, and therefore cannot be produced unilaterally.** (Judgment)\n\n---\n\n## 三十三、国内基本盘与分众路径\n\n### 大陆：合规前提下的学修建设\n\n大陆的处境有一层海外没有的约束：2025 年 9 月国家宗教事务局印发的《宗教教职人员网络行为规范》（国宗发〔2025〕12 号，共 18 条）明确规定，教职人员应当依法规范使用生成式人工智能产品和服务，**不得利用人工智能技术传教**；在互联网上讲经讲道或从事宗教教育培训，可以且仅限于通过已取得《互联网宗教信息服务许可证》的宗教团体、宗教院校、寺观教堂依法自建的网站、应用程序、论坛等进行（A 级，[国家宗教事务局](https://www.sara.gov.cn/static/content/xxgk/2025-09-16/1417173278783471616.html)）。\n\n这条规定划出了一条清晰的边界：**AI 在教内的角色是辅助学习，不是对外传教的通道。** 这恰与第二十章的判断一致——AI 可以辅助\"学\"，不能替代\"修\"；现在可以再加一句：在大陆，它也不能充当\"传\"。\n\n据此，大陆一侧最值得做的事有三个方向：\n\n一是**遗产保护与学术基础设施**。把 AI 用于古籍整理、校勘、术语库、检索工具——这些是纯粹的知识工作，不涉传教。\n\n二是**寺院内部的教育与管理**。课程建设、僧才培养、档案管理、信众服务，都可以用 AI 提升效率。\n\n三是**学修阶梯的建设**（见第二十九章）。把\"寺庙热\"接住，靠的不是线上弘法，是线下的课程、共修与人的陪伴。\n\n**这三个方向有一个共同点：它们都不依赖新政策，现在就可以做。**（判断）\n\n### 分众路径\n\n| 人群 | 有效入口 | 关键条件 | 主要风险 |\n|------|----------|----------|----------|\n| 华人及东南亚裔二代 | 双语共修、青年社群、社会服务、节庆 | 本地语言人才；平等治理；青年与女性领导 | 去宗教化（华裔过半无宗教） |\n| 佛教国家（南亚／东南亚） | 遗产保护、教育、医疗、佛典数字化、戒统合作 | 多边化、非国家化叙事 | 中印竞争、政治化 |\n| 西方皈依者与\"灵性非宗教\"人群 | 禅七与禅修营、译介、居士传承 | 本地传法人；戒律与财务透明 | Zen 品牌遮蔽、丑闻 |\n| 学界与数字用户 | 开放语料、机器翻译与检索、术语库 | 评测基准、开放许可 | AI 幻觉、教内权威争议 |\n\n这张表有一处需要说明：四类人群的\"关键条件\"各不相同，但**\"本地语言人才\"这一项在四类中都出现**——有的显写，有的隐含。这不是巧合。\n\n### 情景与先行指标\n\n| 情景 | 条件 | 后果 | 先行指标 |\n|------|------|------|----------|\n| ① 文化化收缩（基线） | 现有趋势延续 | 认同持续下降；海外靠移民维持；教团依赖个别领袖 | CGSS／CFPS 认同率；二代参与率 |\n| ② 双轨并行 | 台湾系走 NGO 路线，大陆走文化外交，少协同 | 各自增长但互相牵制，信任成本居高 | 海外新增道场的治理披露率；多边合作项目数 |\n| ③ 基础设施驱动再出发 | 开放语料与可验证 AI 成为共同标准，治理补课到位 | 文本通道成为汉传对世界的主渠道 | 英译覆盖率；开放语料规模；英语法师数量 |\n\n三个情景中，③ 不是必然的，也不是最容易的。它要求的是前文反复提到的那些不显眼的工作：译经、编术语、建语料、写教材、培养审校的人、公布年报、把传承交给本地人。\n\n**这些事没有一件能上头条。**（判断）\n\n---\n\n## 结语\n\n这份报告从一个空缺开始，也以那个空缺收束。\n\n**全球汉传佛教信众究竟有多少，没有数字。** 一个流传了两千年、遍布五大洲、有数万座寺院和数十万僧尼的传统，说不清自己有多少人。\n\n而在这份报告的核查过程中，还浮现出另一个同样值得记住的事实：**汉传手里握着世界上唯一完整的比丘尼戒统，而它自己的对外叙述里几乎不提这件事。** 六份原始稿件中，只有一份用了\"可能是汉传对世界佛教最具制度性的贡献\"这样的措辞。\n\n两件事指向同一个方向。我们的问题，首先不在于能力不足，而在于**对自己的认识不足**——不知道有多少人，不知道自己有什么，不知道自己在别人眼里是什么样子。\n\n这不算坏消息。能力不足要几十年才补得上，认识不足往往只需要认真数一遍。\n\n这份报告的另一半内容，是关于 AI 的。前面用了很长的篇幅说明：佛教 AI 的竞争力不在模型大小，在语料、版本、出处、术语、传统区分；AI 可以辅助\"学\"，不能替代\"修\"；真正的风险不是机器人有灵魂，是人把权威交给算法；最值得突破的基础设施是翻译，而 AI 让初译变便宜、让审校变得更贵。\n\n把这些收成一句：**AI 对汉传佛教的全部意义，是让\"把话说清楚\"这件事第一次变得可负担。**\n\n把话说清楚——把典籍译清楚、把术语定清楚、把出处标清楚、把次第讲清楚、把自己的家底数清楚。这件事不需要开悟，不需要神通，也不需要一个庞大的组织。它需要的是几十年如一日的、不显眼的工作，和一批愿意做这种工作的人。\n\n而它一旦做成，汉传佛教在全球的位置就不同了。不是因为它更响，是因为它**终于能被听懂了**。\n\n在这件事上，我们手里其实有条件。这是这份报告最想说的一句话。\n\n> **EN对应 · Conclusion**\n>\n> This report begins with a gap and ends with it.\n>\n> **How many Chinese Buddhists there are in the world: there is no number.** A tradition that has run for two thousand years, spread across five continents, and holds tens of thousands of temples and hundreds of thousands of monastics cannot say how many people it has.\n>\n> In the course of verification, a second fact of equal weight surfaced: **Chinese Buddhism holds the only complete bhikṣuṇī ordination lineage in the world, and its own accounts of itself abroad almost never mention it.** Of the six original drafts, only one used the phrase \"perhaps the most institutional contribution Chinese Buddhism has made to world Buddhism.\"\n>\n> The two point the same way. Our problem is not first a shortage of capacity. It is **a shortage of self-knowledge**—not knowing how many we are, not knowing what we hold, not knowing how we appear to others.\n>\n> That is not bad news. A shortage of capacity takes decades to remedy; a shortage of self-knowledge often requires only a careful count.\n>\n> The other half of this report concerns AI. It has argued at length that the competitiveness of Buddhist AI lies not in model size but in corpora, editions, provenance, terminology, and the distinguishing of traditions; that AI can assist study but cannot replace practice; that the real risk is not a machine with a soul but a person handing authority to an algorithm; and that the infrastructure most worth breaking through is translation—where AI makes first drafts cheap and makes review more expensive.\n>\n> Compressed into one sentence: **the whole significance of AI for Chinese Buddhism is that it makes \"saying things clearly\" affordable for the first time.**\n>\n> Saying things clearly—translating the texts clearly, fixing the terminology clearly, marking the sources clearly, explaining the sequence clearly, counting our own holdings clearly. This does not require enlightenment or supernatural powers or a large organization. It requires decades of unremarkable work, and a group of people willing to do it.\n>\n> And once it is done, Chinese Buddhism's place in the world will be different. Not because it is louder, but because it **can finally be understood.**\n>\n> On this, the conditions are in our hands. That is the one thing this report most wants to say.\n\n---\n\n# 附录\n\n## 附录一　勘误记录\n\n本附录逐条登记核查中发现的问题与处理方式，以便读者对照原始材料复核。核查方式：对六份原始稿件中每一条可核查的断言，逐条访问其一手来源（官方统计页面、官方文件、机构官网、DOI 解析、arXiv 页面、法院与媒体通报）。全部断言约 110 条。\n\n### 一、删除（无来源或机器残渣，非信息损失）\n\n| 项目 | 原始表述 | 处理依据 |\n|------|----------|----------|\n| 寺庙数量 | 「据 2014 年 CLDS 推算，含佛教神祇的寺庙至少 **19.2 万座**」 | 五轮检索（中文关键词、精确串、CLDS 相关论文、民间信仰场所总量、英文数字 192,000）**全部零命中**；与可查官方口径 3.35 万座相差近六倍。**无任何来源** |\n| 美国皈依者构成 | 「白人皈依者约占美国佛教徒的 **10%**」 | 皮尤公开稿只给出「21% 为白人」与「48% 为皈依者」，**未按族裔交叉列皈依者比例**；检索该表述无出处，疑为两项相乘的推算值被当作原文数据 |\n| 在线弘法规模 | 「中国佛教协会 2022 年数据：每月在线佛学讲座观看量达 **5000 万次**」 | 四组关键词（含精确短语）检索**零命中**；中国佛协公开材料与权威媒体均未见此统计 |\n| 图表残渣 | 两段 mermaid SVG 原始转储、一处 Acrobat 浏览器扩展图标残渣、一处 Google Scholar 复制残渣（全为「Opens in a new window」断句）、18 处 URL 尾缀 `?utm_source=chatgpt.com` | 均为机器生成或复制粘贴残渣，不含相关信息 |\n| 表格结构 | 三处 markdown 表格为行间空行拆散、HTML 标签残缺，已失效 | 结构性修复 |\n\n### 二、事实与数字订正\n\n| 项目 | 原始表述 | 订正后 | 依据 |\n|------|----------|-------  分析），纳入 **22 项**。年份、设计、样本量**三处均错** |\n\n### 四、来源降级或替换\n\n| 原始来源 | 性质 | 处理 |\n|----------|------|------|\n| grokipedia.com | xAI／Grok 生态的 **AI 生成百科**（页面标注 \"Fact-checked by Grok\"），无学术编辑制度 | 删除，不作引用 |\n| gitnux.org | 营利性市场研究／数据聚合站，89 条统计仅给域名级来源、无逐条引注 | 删除，改引原始统计源 |\n| studocu.com | 学生上传笔记／实习报告分享站 | 删除 |\n| scribd.com（NORBU 白皮书转载） | 用户上传文档平台 | 改引原始白皮书（buddhistchannel.tv 发布之 NORBU White Paper PDF）。NORBU 为 2024 年问世的佛教 AI 聊天机器人 |\n| melpine.substack.com | 个人通讯，非同行评审 | 如需引用，须标明为博客 |\n| just-buddha.org | 匿名编译，无具名作者与学术审核 | 删除 |\n| Zenodo 22026384 | 实为 UBC《宗教史数据库》（DRH）条目《Fo Guang Shan Malaysia》（Lee Ooi Tan, 2026-08-20） | 可引，但须标明为**专家撰写的数据库条目**，非期刊论文 |\n| Zenodo 19413268 所载期刊 | *Advancement in Image Processing and Pattern Recognition* 9(3)，多轮检索无索引记录 | 可核性低，如实标注 |\n| 引用注水 | Cambridge《African Studies Review》一篇赞比亚少林寺论文（Li Hangwei, 69(2):366-387, 2026）被反复用于\"支持\"毫不相干的结论 | 限定于其实际主题（少林在赞比亚的传播） |\n\n### 五、核查方法的一条教训\n\n核查中，几篇 arXiv 论文（编号 2603.29221、2606.18222、2603.26760）因编号形式罕见而**被预先怀疑为伪造**，并列为重点核查对象。逐条访问后，**三篇全部真实存在且内容与引用相符**（分别为 SiPaKosa 语料库、Darshana Graph 平行注释语料库、瑜伽姿态识别框架）。\n\n相反，真正的问题出在**三篇真论文被挂到错误论断上**（见第三节），这些在通读时看不出任何异常。\n\n**结论：判断一篇引用真假，只认逐条访问的结果，不认编号的直觉。** 全部 30 条 DOI／URL 经实际访问，**未发现伪造**。\n\n### 六、附：治理事件基本事实（供查考）\n\n正文第六章谈治理，取结构性判断；两案的基本事实如实登记于此，供读者查考。\n\n**学诚事件（2018）**\n- 2018-08-01：原龙泉寺都监释贤启、释贤佳发布 95 页《重大情况汇报》；当晚龙泉寺发布「严正声明」，学诚微博转发，公开否认，称举报系「收集、伪造素材……构陷佛教大德」\n- 2018-08-15：中国佛教协会第九届理事会第三次会议（北京）接受其辞去会长、常务理事、理事职务\n- 2018-08-23：国家宗教事务局《关于对举报学诚和北京龙泉寺有关问题的调查核实情况》发布四点，原文「举报材料中反映学诚发送骚扰信息问题，**经查属实**，涉嫌违反佛教戒律，已责成中国佛教协会……严肃处理」；性侵报案由北京公安机关受理初查\n- 来源：[新华网·通报原文](http://www.news.cn/politics/2018-08/23/c_1123315427.htm)、[新华网·辞职](http://www.news.cn/politics/2018-08/15/c_1123275188.htm)（A 级）\n\n**释永信案（2025–2026）**\n- 2025-07-27：少林寺管理处《情况通报》，称其「涉嫌刑事犯罪，挪用侵占项目资金、寺院资产」「严重违反佛教戒律，长期与多名女性保持不正当关系并育有私生子」，正接受多部门联合调查\n- 2025-07-28：中国佛教协会公告「同意对释永信（俗名：刘应成）的戒牒予以注销」（措辞为**注销**，非「撤销」）\n- 2026-05-29：河南省新乡市中级人民法院一审公开宣判，职务侵占、挪用资金、非国家工作人员受贿、行贿数罪并罚，**执行有期徒刑 24 年、罚金 350 万元**，当庭服判不上诉（5-25 开庭）。认定：侵占 1.31 亿余元（2003–2025）；挪用 1.51 亿余元（2012–2022）；受贿 1163 万余元（2006 年 7 月起）；行贿 567 万余元（1995–2022）\n- 来源：[央广网](https://news.cnr.cn/local/dftj/20250727/t20250727_527285340.shtml)、[新华社](https://www.xinhuanet.com/20260529/1137876b440b45be8faa21bff048ac63/c.html)（C 级，法院通报经权威媒体转述，判决书原文未公开）\n\n**海外先例（1996–2000，西来寺）**\n- 1996-04-29：西来寺为民主党全国委员会举办筹款会，戈尔出席\n- 1998-02：联邦大陪审团起诉 Maria Hsia 时，同时将西寺列为 unindicted co-conspirator\n- 2000-03：Hsia 被判五项联邦重罪（向联邦选举委员会提交虚假报告）；2001-02 判居家监禁 3 个月\n- 来源：[LA Times 1998-02-19](https://www.latimes.com/archives/la-xpm-1998-feb-19-mn-20834-story.html)、[NYT 2000-03-03](https://archive.nytimes.com/www.nytimes.com/library/politics/camp/030300wh-gore-fund.html)、法院文书（A/C 级）\n\n> **EN对应 · Appendix One: Errata**\n>\n> This appendix registers each problem found in verification and how it was handled, so that readers may check against the original materials. Method: every checkable claim across the six drafts was traced to its primary source—official statistical pages, official documents, institutional websites, DOI resolution, arXiv pages, court and media notices. About 110 claims in total.\n>\n> **1. Deletions (no source, or machine residue; not information loss)**\n>\n> | Item | Original wording | Basis for removal |\n> |---|---|---|\n> | Temple count | \"Extrapolating from CLDS 2014, at least **192,000** temples contain Buddhist deities\" | Five search strategies (Chinese keywords, exact strings, CLDS literature, total folk-religion sites, the figure 192,000 in English) returned **zero results**; differs from the verifiable official count of 33,500 by nearly a factor of six. **No source of any kind** |\n> | US convert composition | \"White converts are about **10%** of American Buddhists\" | Pew's public materials give only \"21% are white\" and \"48% are converts,\" and **do not cross-tabulate converts by ethnicity**; the phrasing returns no source and appears to be a product of the two figures treated as an original datum |\n> | Online teaching reach | \"Buddhist Association of China, 2022: monthly online lecture views reach **50 million**\" | Four keyword sets, including exact phrases, returned **zero results**; neither the Association's public materials nor authoritative media carry the statistic |\n> | Chart residue | Two raw mermaid SVG dumps, an Acrobat browser-extension icon remnant, a Google Scholar copy-paste remnant (\"Opens in a new window\"), and 18 URL suffixes reading `?utm_source=chatgpt.com` | Machine-generated or copy-paste residue containing no relevant information |\n> | Table structure | Three markdown tables broken by blank lines between rows, with defective HTML | Structural repair |\n>\n> **2. Factual and numerical corrections**\n>\n> | Item | Original | Corrected | Basis |\n> |---|---|---|---|\n> | CBETA holdings | 9,200+ texts | **4,899 titles, 22,150 fascicles, over 228 million characters** (2026 R2) | CBETA official site (A) |\n> | Master Hsing Yun's age | died aged 95 | **aged 97 by Chinese reckoning** (95 by Western count) | Foguang Shan obituary (A) |\n> | Tzu Chi's country count | volunteers in 103 countries | **68**; \"103\" came from misreading \"103,329 charity volunteers\" | Tzu Chi's own figures by year (A) |\n> | DRBA founding | founded 1969 | predecessor Sino-American Buddhist Association **1959** (incorporated 1968); renamed **1984** | DRBA official chronology (A) |\n> | Western lay heirs | included Jimmy Yu | **does not**; the five are John Crook, Simon Child, Max Kalin, Žarko Andričević, Gilbert Gutierrez. Jimmy Yu was Sheng Yen's ordained disciple (ordained 1991, returned to lay life 2000) and is not a Westerner | Sheng Yen research paper (A) |\n> | University of Toronto centre | Ho Hung-sun Family Centre | **Robert H. N. Ho Family Foundation Centre for Buddhist Studies** (2016). Ho Hung-sun ≠ Robert H. N. Ho | University of Toronto website (A) |\n> | Foguang Shan universities | Taiwan, US, Australia, Philippines (incl. University of San Carlos) | **Five**: University of the West (1990), Fo Guang (1993), Nanhua (1996), Nan Tien (2011), Guang Ming (2014). The University of San Carlos belongs to the SVD in Cebu and is unrelated to Foguang Shan | Foguang Shan universities website (A) |\n> | Xue Cheng sequence | \"resigned **after** the official investigation\" | **Order reversed**: report 1 Aug 2018 → temple denial 2 Aug → **resignation 15 Aug** → official finding **23 Aug** | Xinhua notice (A) |\n> | UN Day of Vesak | \"2026 **Nanjing** conference\" | The 21st, in 2026, was held in **Wuxi, Jiangsu** (25–28 May, 67 countries, about 1,000 participants; China's first time hosting). The Xinhua dateline \"Nanjing\" caused the error. 2024 was in Thailand, 2025 in Vietnam | Xinhua (C) |\n> | Longquan Monastery in Africa | active in **several African countries** | Only one temple in Africa, **Bohua Temple in Botswana** (built 2016); Tanzania was merely \"under discussion.\" Its AI work is genuine (Ven. Xianchao's team, OCR of the Korean canon with 1.68 million lines of training, \"Gujiku\" platform opened 2018) | authoritative media and academic sources (C/B) |\n> | Shaolin's Australian purchase | 2015, **US$3 million** in \"a certain Australian town\" | **23 Feb 2015, A$4.162 million** (≈RMB 20.4m, ≈US$3.2m) paid at **Shoalhaven**, NSW; parcel about 1,248 ha; total project budget A$360–386m | ABC News, Xinhua (C) |\n> | Shaolin visitor numbers | 2.5 million a year | No source found; authoritative accounts give **over 3 million a year** | secondary media and monographs (C) |\n> | Buddhist Association figure | 2017: \"over 100 million\" Buddhists | Actual wording: \"by incomplete count, China's Buddhists number **close to two hundred million**\" (Shi Xuecheng at the 2017 sessions) | Guizhou provincial reprint (C) |\n> | Registered temples | about 34,000 (28,500 Chinese Buddhist) | White Paper: \"about **33,500**, of which **over 28,000** are Chinese Buddhist\" | 2018 White Paper (A) |\n> | UK Buddhist population | about 0.4% | **0.5%** (England and Wales, 2021, about 273,000); 0.4% is the 2011 figure | ONS 2021 census (A) |\n> | Singapore Buddhist population | 31.1% | **Both figures are correct but from different years**: 31.1% is the 2020 census, 30.9% the 2025 GHS. The original mixed the two without saying so | SingStat (A) |\n> | Nan Hua Temple's origin | land donated by the South African **government** | On 8 March 1992 the **Bronkhorstspruit town council** signed over 3 ha, immediately increased to 6 | Nan Hua Temple website (A) |\n> | Nan Hua performance troupe | \"Nan Hua dragon-lion troupe\" | Properly the **Nan Hua Performing Arts Group**, established 2014 at Hsing Yun's instruction | Nan Hua Temple website (A) |\n> | Ven. Huimin's position | president of Dharma Drum Institute of Liberal Arts | **Former** president (July 2014–July 2022), now emeritus professor; CBETA chairman since August 2022 | DILA (A) |\n> | MITRA-zh venue | arXiv, 2023 | **NLP4DH 2023** (ACL Anthology 2023.nlp4dh-1.29), not arXiv | ACL Anthology (B) |\n> | Buddharoid's use | assisting funeral services | The robot is real (Kyoto University IFOHS, Prof. Seiji Kumagai's team, unveiled 24 Feb 2026 at Chion-in, Unitree G1 with BuddhaBot Plus); but ritual assistance is only a **future scenario**, with no funeral application. The Kōdai-ji android Kannon \"Minder\" (Ishiguro, Osaka University, 2019) is a **different project** | Kyoto University website (A) |\n> | Fojin project figures | 31K+ entities / 678K embeddings / 8 languages / 23K lineage links | README's own figures: **110,000+** entities, **670K+** embeddings, **22K+** lineage links, **9** UI languages; dictionary given as both 32 and 39 volumes. It is also a **personal open-source project** (344 stars), not an institutional one | GitHub repository (self-reported) |\n> | Nehrdich's talk | \"the AI **working group** of the Foguang Dictionary translation project\" | No such working group exists; what is verifiable is Nehrdich's 23 April 2024 lecture at Foguang Shan's Dongchan Tower on \"Buddhist Translation and AI Applications,\" and his involvement in the project's training | Foguang Shan Institute of Humanistic Buddhism (A) |\n> | BLIA founding | founded at Hsi Lai Temple in 1991 | What was founded on 3 Feb 1991 was the **Buddha's Light Association of the Republic of China**; the world headquarters came on **16 May 1992** | Hsi Lai Temple website (A) |\n> | City of Ten Thousand Buddhas | \"one of the **earliest** Chan centers in the US\" | Inaccurate; earlier North American foundations include the San Francisco Zen Center (1962), Rochester Zen Center (1966), and Gold Mountain Monastery (1970) | general sources (B/C) |\n> | Shi Yongxin's bribery period | bribery 2003–2025 | Embezzlement ran 2003–2025; **bribery begins July 2006** | Xinhua citing the court (C) |\n> | Bhikṣuṇī ordination size | 22 countries, 146 participants | **Three accounts coexist**: 22 countries / 146 (132 women); over 20 countries / over 150; 32 countries / 150. Presented side by side, not adjudicated | three sources |\n> | \"Āgama relation visualization\" | Dharma Drum Digital Classics result | The session actually covered 614 citation records, a parallel-text index, and a six-edition collation | CBETA event report (A) |\n>\n> **3. Misused literature (real papers attached to claims they do not support)**\n>\n> This category is more insidious than fabricated citation: **all three papers exist; their content does not match the claims they were made to support.**\n>\n> | Cited | Original use | Actual content |\n> |---|---|---|\n> | PMC12670040 | Supporting \"a cognitive framework difference between Chinese Buddhist ritual, terminology, and cosmology and Western individualism/rationalism\" | Actually Li et al., \"Addressing the obstacles in cultivating global advocates for traditional Chinese medicine,\" *Front Public Health* 13:1703208, 2025. The subject is **traditional Chinese medicine**; the full text contains zero instances of Buddhism, ritual, or discontinuity |\n> | PMC13357712 | Supporting \"an IMU plus vision framework can track gait and bodily alignment in **walking meditation**\" | Actually Vallabhaneni & Panneer, \"Hybrid vision–IMU deep learning framework … for personalized **yoga posture** identification,\" *Sci Rep* 16:21705, 2026. Zero instances of gait, walking, or meditation; \"alignment\" refers to yoga postures |\n> | PubMed 39484656 | \"A **2026 meta-analysis** including **35 studies** and about 1,550 participants\" | Actually Wieczorek et al., \"…virtual reality-based mindfulness interventions: A systematic review and evidence mapping,\" *Digit Health* 10, **2024**. A **systematic review with evidence mapping**, not a meta-analysis, including **22** studies. Year, design, and sample size are **all three wrong** |\n>\n> **4. Sources downgraded or replaced**\n>\n> | Source | Nature | Handling |\n> |---|---|---|\n> | grokipedia.com | An **AI-generated encyclopedia** in the xAI/Grok ecosystem (\"Fact-checked by Grok\"), with no scholarly editorial process | Deleted, not cited |\n> | gitnux.org | For-profit market research and data aggregator; its 89 statistics carry only domain-level sourcing, no per-item citation | Deleted; original statistical sources cited instead |\n> | studocu.com | Student-uploaded notes and internship reports | Deleted |\n> | scribd.com (NORBU white paper repost) | User-uploaded document platform | Redirected to the original white paper (NORBU White Paper PDF, published via buddhistchannel.tv). NORBU is a Buddhist AI chatbot that appeared in 2024 |\n> | melpine.substack.com | Personal newsletter, not peer-reviewed | If cited, must be identified as a blog |\n> | just-buddha.org | Anonymous compilation, no named author, no scholarly review | Deleted |\n> | Zenodo 22026384 | In fact a UBC *Database of Religious History* entry, \"Fo Guang Shan Malaysia\" (Lee Ooi Tan, 20 Aug 2026) | Citable, but must be identified as an **expert-authored database entry**, not a journal article |\n> | Journal hosting Zenodo 19413268 | *Advancement in Image Processing and Pattern Recognition* 9(3); no indexing record found across multiple searches | Low verifiability; marked as such |\n> | Citation padding | A Cambridge *African Studies Review* article on Shaolin in Zambia (Li Hangwei, 69(2):366–387, 2026) cited repeatedly to \"support\" unrelated conclusions | Confined to its actual subject (Shaolin's transmission in Zambia) |\n>\n> **5. One lesson about method**\n>\n> During verification, several arXiv papers (identifiers 2603.29221, 2606.18222, 2603.26760) were **suspected in advance of being fabricated** because of their unusual numbering, and were flagged for special scrutiny. Checked one by one, **all three exist and match their citations** (SiPaKosa corpus, Darshana Graph parallel commentary corpus, and a yoga pose detection framework).\n>\n> The actual problems lay instead with **three genuine papers attached to wrong claims** (Section 3), none of which looks unusual on a reading pass.\n>\n> **Conclusion: whether a citation is genuine is decided by visiting it, never by trusting the look of its identifier.** All 30 DOIs and URLs were visited; **no fabrication was found.**\n>\n> **6. Appendix to Appendix One: basic facts of the governance cases (for reference)**\n>\n> Chapter Six takes the structural judgment; the basic facts of the two cases are recorded here for readers' reference.\n>\n> **The Xue Cheng affair (2018)**\n> - 1 Aug 2018: two former Longquan Monastery monastics, Shi Xianqi and Shi Xianjia, release a 95-page report; that evening the monastery issues a \"solemn statement,\" which Xue Cheng reposts, publicly denying the allegations and calling them \"collected and fabricated material… to frame a great Buddhist worthy\"\n> - 15 Aug 2018: the Buddhist Association of China's Ninth Council, third session (Beijing), accepts his resignation as president, executive director, and director\n> - 23 Aug 2018: the State Administration for Religious Affairs issues four findings, stating in the original: \"the harassment messages alleged in the report **are verified as true**, suspected of violating Buddhist precepts, and the Buddhist Association of China has been instructed… to handle the matter seriously\"; a criminal complaint of sexual assault is accepted for preliminary investigation by Beijing police\n> - Sources: [Xinhua, notice](http://www.news.cn/politics/2018-08/23/c_1123315427.htm); [Xinhua, resignation](http://www.news.cn/politics/2018-08/15/c_1123275188.htm) (A)\n>\n> **The Shi Yongxin case (2025–2026)**\n> - 27 July 2025: the Shaolin Temple Administration Office issues a notice stating that he \"is suspected of criminal offences, of misappropriating and embezzling project funds and temple assets,\" and of \"serious violation of Buddhist precepts, maintaining improper relations with multiple women over a long period and fathering children,\" and is under joint investigation by several departments\n> - 28 July 2025: the Buddhist Association of China announces that it \"agrees to **cancel** the ordination certificate of Shi Yongxin (lay name: Liu Yingcheng)\"—the wording is cancel, not revoke\n> - 29 May 2026: the Xinxiang Intermediate People's Court in Henan pronounces first-instance judgment: concurrent sentences for occupational embezzlement, misappropriation of funds, bribery by non-state personnel, and bribery, **24 years' imprisonment and a fine of RMB 3.5 million**; he accepts and does not appeal (hearing 25 May). Findings: embezzlement of over RMB 131 million (2003–2025); misappropriation of over RMB 151 million (2012–2022); bribery of over RMB 11.63 million (from July 2006); giving bribes of over RMB 5.67 million (1995–2022)\n> - Sources: [CNR](https://news.cnr.cn/local/dftj/20250727/t20250727_527285340.shtml); [Xinhua](https://www.xinhuanet.com/20260529/1137876b440b45be8faa21bff048ac63/c.html) (C; the court notice was relayed by authoritative media; the full judgment is not public)\n>\n> **An overseas precedent (1996–2000, Hsi Lai Temple)**\n> - 29 Apr 1996: Hsi Lai Temple hosts a fundraiser for the Democratic National Committee; Gore attends\n> - Feb 1998: when the federal grand jury indicts Maria Hsia, it simultaneously lists the temple as an unindicted co-conspirator\n> - Mar 2000: Hsia is convicted on five federal felony counts (false reports to the FEC); Feb 2001, sentenced to three months' home detention\n> - Sources: [LA Times, 19 Feb 1998](https://www.latimes.com/archives/la-xpm-1998-feb-19-mn-20834-story.html); [NYT, 3 Mar 2000](https://archive.nytimes.com/www.nytimes.com/library/politics/camp/030300wh-gore-fund.html); court documents (A/C)\n\n---\n\n## 附录二　证据分级与置信度总表\n\n| 论域 | 主要数据 | 级别 | 置信度 | 主要弱点 |\n|------|----------|------|--------|----------|\n| 全球佛教人口 | 皮尤 2025-06-09 报告 | A | 高 | 只统计自我认同者；不按传统拆分 |\n| 大陆佛教人口 | CGSS／CFPS／皮尤再分析／佛协口径 | A/C | 中 | 定义差异可达八倍；佛协口径推算方法不明 |\n| 大陆制度存量 | 2018 国新办白皮书 | A | 高 | 数据截至 2017–2018 年，已近十年 |\n| 台湾／新加坡／马来／澳洲／英国 | 各国官方普查与住户调查 | A | 高 | 均不按传统拆分 |\n| 美国佛教徒 | 皮尤 2026-03-11 | A | 高 | 同上；「白人皈依者 10%」一项已删除 |\n| 教团规模（佛光山／慈济／中台／法鼓） | 机构官网自述 | A·自述 | 低—中 | 口径不一，无独立审计，部分数字查无来源 |\n| 教团历史事实（年份、人名、事件） | 官网、年谱、学术论文 | A/B | 高 | 少数存在异说（已并列） |\n| 比丘尼戒会规模 | 三源并存 | B/A | 中 | 22 国 146 人／20 余国 150 余人／32 国 150 人 |\n| 中国宗教政策与事件 | 官方文件、司法通报、权威媒体 | A/C | 高 | 判决书原文未公开 |\n| BDK 完成度 | 丛书前言（2017、2019） | A·自述 | 低 | 两个年份同一数字，原因未明，标〔待核〕 |\n| CBETA／DILA／SAT 数据 | 机构官网 | A·自述 | 中—高 | 1.6 亿字符为平台自述 |\n| BDRC BUDA 规模 | 官网自述 | A·自述 | 中 | 1700 万页与 59000 册／3000 万图像两说并存 |\n| 佛教 AI 项目 | 官网、GitHub、模型卡 | A·自述 | 低—中 | 多数为项目自述；部分数字自相矛盾 |\n| AI 与宗教的学术研究 | 同行评议期刊 | B | 中—高 | 多为概念性、探索性研究，实证有限 |\n| 中印佛教外交分析 | 学术论文与深度报道 | B/C | 中 | 属分析者观点，非事实陈述 |\n| 教内个案调研 | 法师自陈问卷 | C | 低 | 小样本、自陈数据，不可外推 |\n| 青年寺庙热 | 携程数据＋媒体采访 | C | 中 | 企业数据；统计窗口为「今年以来」 |\n\n> **EN对应 · Appendix Two: Source Grading and Confidence**\n>\n> | Domain | Main data | Grade | Confidence | Principal weakness |\n> |---|---|---|---|---|\n> | Global Buddhist population | Pew report, 9 June 2025 | A | High | Counts self-identification only; not disaggregated by tradition |\n> | Mainland Buddhist population | CGSS / CFPS / Pew reanalysis / BAC figures | A/C | Medium | Definitions vary eightfold; the BAC figure's method is undisclosed |\n> | Mainland institutional stock | 2018 White Paper | A | High | Data as of 2017–2018, now nearly a decade old |\n> | Taiwan / Singapore / Malaysia / Australia / UK | National censuses and household surveys | A | High | None disaggregated by tradition |\n> | US Buddhists | Pew, 11 March 2026 | A | High | As above; the \"10% white converts\" item has been deleted |\n> | Order scale (Foguang Shan / Tzu Chi / Chung Tai / Dharma Drum) | Institutional websites | A, self-reported | Low–medium | Definitions vary, no independent audit, some figures unsourced |\n> | Order historical facts (dates, names, events) | Websites, chronologies, scholarly papers | A/B | High | A few disputed readings (presented side by side) |\n> | Bhikṣuṇī ordination scale | Three accounts coexisting | B/A | Medium | 22 countries / 146; over 20 / over 150; 32 / 150 |\n> | Chinese religious policy and events | Official documents, judicial notices, authoritative media | A/C | High | The full judgment is not public |\n> | BDK completion | Series prefaces (2017, 2019) | A, self-reported | Low | Same figure in two different years, cause unknown; marked pending verification |\n> | CBETA / DILA / SAT figures | Institutional websites | A, self-reported | Medium–high | The 160 million characters is a platform's own figure |\n> | BDRC BUDA scale | Website, self-reported | A, self-reported | Medium | 17 million pages and 59,000 volumes / 30 million images coexist |\n> | Buddhist AI projects | Websites, GitHub, model cards | A, self-reported | Low–medium | Mostly self-described; some figures internally contradictory |\n> | Scholarship on AI and religion | Peer-reviewed journals | B | Medium–high | Mostly conceptual and exploratory; limited empirical work |\n> | Analysis of Sino-Indian Buddhist diplomacy | Academic papers and in-depth reporting | B/C | Medium | Analysts' arguments, not statements of fact |\n> | In-house case research | A monastic's own survey | C | Low | Small sample, self-reported, not generalizable |\n> | Youth temple boom | Ctrip data plus media interviews | C | Medium | Corporate data; statistical window is \"since the start of the year\" |\n\n---\n\n## 附录三　项目生态盘点\n\n| 项目 | 主办／性质 | 定位 | 关键数据（含口径说明） |\n|------|-----------|------|----------------------|\n| **CBETA** | 中华电子佛典协会／台湾。1998 年由中华佛学研究所支持成立，2023 年法人化（法鼓山佛教基金会捐资 1,300 万为最大捐助者） | 汉文大藏经数字化主干 | 4,899 部、22,150 卷、逾 2.28 亿字（2026.R2）。TEI/XML 结构化 |\n| **DILA iSearch** | 法鼓文理学院 | 多档案综合检索 | 「超过 1.6 亿字符」「10+ 佛教数字档案」（平台自述） |\n| **SAT** | 东京大学 | 《大正藏》数字文本与页面影像结合 | 2012 版起提供原书页面影像，可定位到行 |\n| **BDRC / BUDA** | 佛教数字资源中心 | 佛教数字底座，先建数据后做 AI | 「超过 1700 万页」（自述）；另有「59,000+ 册、3000 万+ 图像」口径。2025-03-14 发布藏文 OCR 桌面工具（免费开源、可批量）。2026-02-28 公告开放 AI 数据集计划（2025-12 启动，Khyentse 基金会资助，PI 为 CTO Élie Roux；两月进度：Gold Standard 语料 1.9→3.4 GB，2600 万+ 图像完成 OCR，约 3.5 万图与转写对齐） |\n| **Dharmamitra / MITRA** | UC Berkeley BAIR，Keutzer＋Nehrdich，2023-04 创立 | 佛教多语机器翻译、跨语检索、OCR | MITRATranslate／MITRASearch／MITRA-OCR。MITRA-zh 论文见 NLP4DH 2023（ACL Anthology 2023.nlp4dh-1.29，**非 arXiv**）。HF 模型 `buddhist-nlp/mbart-buddhist-chinese-to-eng` 模型卡自述：命名实体存在问题、有时表现幻觉倾向 |\n| **84000** | 84000：Translating the Words of the Buddha | 藏文大藏经英译；AI 立场文件 | 政策原文：「these sacred texts should not be processed using machine translation alone」「The primary actor in the translation of sacred literature must always be the human mind.」 |\n| **佛光山「人間雲」** | 佛光山、《人间福报》携手 Yiai | 人间佛教 AI 问答 | 2025-02-03（大师圆寂两周年）发表；语料为《星云大师全集》＋《人间福报》25 年新闻库 |\n| **Vurbo.ai 佛教专业版** | 国际佛光会世界总会＋佛光山人间佛教研究院＋爱比科技（IPEVO） | 佛教术语即时翻译 | 2025-04-18 于国际佛光会北美洲联谊会（奥斯汀）发布，整合一万条术语。「全球首套」系主办方自述 |\n| **灵隐寺／如是佛典／杭州云林数字佛典研究院** | 杭州灵隐寺 | 古籍 OCR 与数字化生产平台 | 推进《径山藏》《永乐北藏》《思溪藏》；2026-05 研究院揭牌，「如是佛典」发布《径山藏》成果 |\n| **法鼓山数典专案** | 法鼓文理学院 | 佛教知识图谱、语义搜索 | 2026-05-20 春季成果发表会；六步流程建知识图谱；614 笔引文库、平行文本索引、六版本对勘 |\n| **Buddharoid** | 京都大学人と社会の未来 *The Supply Chain of Buddhist Knowledge - Framework v0.3*, published 18 April 2025 |\n\n---\n\n## 附录四　查证不获与检索局限登记\n\n依本项目「边界自知·局限留档」的规范，将**未能获取、未能核实、或受工具与语种所限**的项目逐条登记，并注明受限原因。\n\n### 一、经多轮检索零命中（已从正文删除）\n\n| 项目 | 检索方式 | 推断 |\n|------|----------|------|\n| CLDS 2014「至少 19.2 万座含佛教神祇寺庙」 | 中文关键词、精确串、CLDS 论文、民间信仰场所总量、英文数字 192,000 五轮 | 或为讹传；可查官方口径为 3.35 万座 |\n| 「中国佛协 2022 年称每月在线讲座观看 5000 万次」 | 四组关键词含精确短语 | 无来源 |\n| 「白人皈依者约占美国佛教徒 10%」 | 皮尤公开稿、族裔交叉检索 | 皮尤无此项；疑为推算值 |\n| 「西方禅修中心近 50 处」（法鼓山） | 官网、年报、学术文献 | 官方仅称「广设禅修中心」；2009 年报欧美区仅北美 5 处道场＋1 精舍 |\n| 「佛光山 2014 年美国 24 座寺院」 | 官网与权威来源 | 2004 年文献仅作「美洲三十余所」 |\n| 「佛光山欧洲约 20 座」「瑞士至西班牙 13 处」 | 官网、宗团文献 | 星云自述为十国「十四间道场及十七个佛光协会」 |\n| 「近百场禅期」（法鼓山西方） | 官网 | 官方作「逾百场」／「超过两百次」 |\n\n### 二、文件或站点无法获取\n\n| 项目 | 受限原因 | 状态 |\n|------|----------|------|\n| 《深入推进我国佛教中国化五年工作规划纲要（2023～2027 年）》全文 | 现仅见《法音》2023 年第 11 期纸刊（页 40–47）；官网未发布免费全文，网络流传全文本均非官方站点 | 〔待核〕名称与通过时间已确证（2023-10-26 中国佛教协会十届理事会第二次会议通过） |\n| bodhiai.cn | TLS 证书过期，无法访问 | 〔待核〕仅见二手学术提及 |\n| 《大正藏》按页英译覆盖率 | **不存在此统计** | 本文列为建议研究议程第一项 |\n| 释永信案判决书原文 | 法院官网与公众号未见全文通报 | 现有信息为法院通报经权威媒体转述 |\n| 新加坡／澳洲／马来／英国原始数据表 | 本报告使用官方统计的权威二次转述，未逐一下载原表 | SingStat／ABS／DOSM／ONS 原表可进一步复核 |\n\n### 三、语种与地域局限\n\n| 缺口 | 受限原因 |\n|------|----------|\n| 日文、韩文、越南文、僧伽罗文、泰文一手材料 | 未能系统检索。而日本黄檗宗、韩国曹溪宗、越南竹林禅派均为汉传法脉分支，其当代情形为本报告未能展开的重要题目 |\n| 马来西亚、印尼、泰国、越南等地汉传社群分口径数据 | 各国普查不按传统拆分；社群自身亦无统计 |\n| 欧洲佛教徒中汉传所占比例 | 同上 |\n| 海外汉传僧人总数 | 无任何机构统计 |\n| 法／德／西语学界的汉传研究 | 未检索 |\n| 日文专著如《大正藏》英译规划的内部文件 | 未获取 |\n\n### 四、建议优先进行的三项研究\n\n1. **全球汉传道场登记与分类**（教团、语言、规模、治理）——本报告一切\"覆盖 N 国\"的数字都因缺此而不可用。\n2. **二代与皈依者的纵向调查**，参照皮尤\"宗教转换\"设计——当前所有关于二代流失的判断都基于横截面数据。\n3. **《大正藏》按页英译覆盖率审计**——把 BDK 的\"65%\"变成可审计指标。\n\n> **EN对应 · Appendix Four: Register of Unobtained Evidence and Search Limitations**\n>\n> Following this project's norm of recording one's own boundaries, items **that could not be obtained, verified, or reached** owing to tool and language limits are registered individually with the reason.\n>\n> **1. Zero results after multiple search rounds (deleted from page audit of English translation coverage of the Taishō canon**—turning BDK's \"65 percent\" into an auditable metric.\n\n---\n\n## 附录五　参考文献\n\n### A 级 · 一手来源\n\n**官方统计**\n- Pew Research Center, *Buddhist population change*, 2025-06-09. https://www.pewresearch.org/2025/06/09/buddhist-population-change/\n- Pew Research Center, *Buddhism's Recent Decline in East Asia*, 2026-03-11. https://www.pewresearch.org/religion/2026/03/11/buddhisms-recent-decline-in-east-asia/\n- Pew Research Center, *5 facts about Buddhists in the United States*, 2026-03-11. https://www.pewresearch.org/short-reads/2026/03/11/5-facts-about-buddhists-in-the-united-states/\n- Pew Research Center, *Why is Buddhism shrinking worldwide?*, 2026-03-11. https://www.pewresearch.org/short-reads/2026/03/11/why-is-buddhism-shrinking-worldwide/\n- Pew Research Center, *6 facts about Buddhism in China*, 2023-09-21. https://www.pewresearch.org/short-reads/2023/09/21/6-facts-about-buddhism-in-china/\n- Pew Research Center, *3. Buddhism*, 2023-08-30. https://www.pewresearch.org/religion/2023/08/30/buddhism/\n- Pew Research Center, *4 facts about religion and diversity in Taiwan*, 2024-07-29. https://www.pewresearch.org/short-reads/2024/07/29/4-facts-about-religion-and-diversity-in-taiwan/\n- Singapore Department of Statistics, *General Household Survey 2025*. https://www.singstat.gov.sg/news/general-household-survey-25\n- Australian Bureau of Statistics, Census 2021（经 Buddhist Council of NSW 转述）. https://buddhistcouncil.org/get-involved/buddhism-in-australia/\n- Department of Statistics Malaysia, MyCensus 2020.\n- UK Office for National Statistics, Census 2021, TS030.\n\n**官方文件**\n- 国务院新闻办公室《中国保障宗教信仰自由的政策和实践》白皮书，2018。http://cpc.people.com.cn/n1/2018/0404/c64387-29906950-2.html\n- 国家宗教事务局《宗教教职人员网络行为规范》，国宗发〔2025〕12 号，成文 2025-09-07。https://www.sara.gov.cn/static/content/xxgk/2025-09-16/1417173278783471616.html\n- 国家宗教事务局《关于对举报学诚和北京龙泉寺有关问题的调查核实情况》，2018-08-23。http://www.news.cn/politics/2018-08/23/c_1123315427.htm\n // ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';

  }
  var full=document.getElementById('article-full');

    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();

  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';

    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);

}
function _applyArticleENMode(){
  var full=document.getElementById('article-full');
  var btn=document.getElementById('article-en-toggle');

  if(full) full.classList.toggle('en-hidden', hide);
  if(btn) btn.textContent=hide?'🌐 英文批注：展开':'🌐 英文批注：显示';
