<script>
var ARTICLE = {"id": "hanchuan-global", "file": "articles/hanchuan-global.html", "title": "汉传佛教的全球传播与数字未来", "title_sub": "综合研究报告（全文·中英对照）", "icon": "🌏", "version": "四部三十三章 · 110 条断言逐条回一手来源核验 · 62 处中英对照 · 勘误记录 30 余项", "meta": "**定位**：以汉传佛教自身立场出发的全球传播与数字化战略研究——先诊断（现状与九处问题），\n再剖析技术变量（AI 与知识基础设施），最后落到「应该如何传播和发展」的处方。\n**方法**：六稿合并，110 条可核查断言逐条回到一手来源核验；信源四级——\nA（一手统计／官方文件／司法通报／机构官网）、B（同行评议学术）、C（权威新闻与机构消息稿）、\nD（仅作检索线索，不作论据）；教团自述数据一律标【自述】；事实与判断分离（判断处标「（判断）」）。\n**立场**：站在汉传佛教内部说话，对自身问题力求坦白不避其丑；对新技术既不排斥亦不迷信。\n**看点**：佛光山道场数三种口径的来龙去脉 · 慈济「103 国」实为 103,329 位志工之误读 ·\n汉传独有的比丘尼戒统回传 · CBETA 收录量订正（9,200→4,899 部）· 学诚案次序勘误 ·\n佛典英译覆盖率仪表盘 · AI 的四层修行辅助与「权威让渡」五风险 · 佛教知识工程八层 ·\n公共产品化与「模块」为传播单位 · 本土化的边界判准 · 三大语系的交换结构 ·\n「判断引用真假只认逐条访问，不认编号直觉」。\n", "doc": "docs/汉传佛教/汉传佛教全球传播与数字未来_综合研究报告.md", "doc_md": "# 汉传佛教的全球传播与数字未来\n\n### ——现状诊断、问题剖析与战略路径\n\n> **EN对应 · Document Title**\n>\n> **The Global Transmission of Chinese Buddhism and Its Digital Future**\n>\n> A Diagnosis of the Present, an Analysis of Its Problems, and a Strategic Path\n\n> 研究时点：2026 年 9 月 ｜ 文档性质：综合研究报告（中英对照）\n>\n> **EN对应 · Metadata**\n>\n> Research date: September 2026 ｜ Document type: Comprehensive research report (bilingual)\n\n---\n\n## 研究说明\n\n### 一、这份报告是怎么来的\n\n它由六份稿子合并而成。\n\n这六份稿子彼此独立写成，题目相近、材料大量重叠，却互不知情：一份带证据分级的现状诊断、一份传播路径比较、一份 AI 赋能专题、一份\"全球本土化\"研究、一份执行摘要、一份技术路线长文。把它们摊在一起，问题立刻显形——同一时点、同一件事，在不同的稿子里有着不同的数字。佛光山的海外道场，一处写\"200 至 300 余座\"，一处写\"超过 300 座\"，一处写\"100+ 国家、300+ 寺院\"；美国佛教徒，一处 440 万，一处 400 万；慈济的覆盖国数，一处 68 国，一处 103 国。\n\n于是这份报告的第一项工作不是写作，是核验。**六稿中每一条可核查的断言，都逐条回到一手来源去对。** 核验方法与结果写在附录一里，逐条列明：哪一条被订正、订正成了什么、依据是什么。核验中有几处发现值得在这里先说，因为它们决定了后面许多论述的口气。\n\n一处是 CBETA。流传的稿子里说它收录了九千二百多种文本，这个数字被反复引用。CBETA 官网 2026 年 R2 版的数字是**累计收录典籍 4,899 部、22,150 卷、逾 2.28 亿字**。差了将近一倍，而且是把自家的成绩往大了说。\n\n一处是慈济。稿子里说慈济志工点达 103 国，与另一处的 68 国打架。查下去，103 国这个数字根本不存在——慈济年报里有一个「**103,329 位**慈善志工」，不知在哪个环节被读成了国家数。慈济历年志工分布国数是 51、57、63、66、68。一个六位数的志工人数，就这样长成了一张覆盖一百零三国的世界地图。\n\n还有一处是我自己判断错了。核查中有几篇论文的编号是 arXiv 2603.29221、2606.18222 这样的形式，我凭编号规则先入为主地怀疑是伪造的，专门列为重点核查对象。逐条访问下来，两篇都真实存在，内容与引用相符。反倒是有三篇真论文被挂到了它们并不支持的论断上：一篇研究中医跨文化传播的论文，被用来论证\"汉传佛教与西方理性主义的认知断裂\"，全文找不出 Buddhism、ritual、discontinuity 任何一个词；一篇做瑜伽体式识别的论文，被用来讲\"行禅的步态监测\"，全文没有 gait、walking、meditation。伪造的引用一眼能看穿，**挂错地方的引用则安静得多，也危险得多**。\n\n这一条教训写进了本报告的核验方法：**判断一篇引用真假，只认逐条访问的结果，不认编号的直觉。**\n\n> **EN对应 · 1. How This Report Came to Be**\n>\n> It was assembled from six separate drafts.\n>\n> The six were written independently of one another. They covered similar ground and drew on overlapping materials, but none of them knew about the others: a diagnostic report with source grading, a comparison of transmission paths, a study of AI empowerment, a \"glocalization\" study, an executive summary, and a long technical roadmap. Laid side by side, the problem surfaced at once—the same fact at the same moment carried different numbers in different drafts. Foguang Shan's overseas temples appeared as \"200 to over 300,\" as \"more than 300,\" and as \"over 100 countries and 300+ temples.\" The number of Buddhists in the United States appeared as 4.4 million in one place and 4 million in another. Tzu Chi's reach appeared as 68 countries and as 103.\n>\n> So the first task of this report was not writing. It was verification. **Every checkable claim across the six drafts was traced back to a primary source.** The method and the results are set out item by item in Appendix One: which claim was corrected, what it was corrected to, and on what basis. Several findings are worth stating up front, because they shape the tone of much that follows.\n>\n> The first concerns CBETA. The circulating drafts stated that it holds over 9,200 texts, and the figure was repeated. CBETA's own website (2026 R2) gives the number as **4,899 titles, 22,150 fascicles, and more than 228 million characters**. The circulating figure overstated the count by nearly double—and it inflated a Buddhist institution's own achievement.\n>\n> The second concerns Tzu Chi. The drafts said its volunteers reach 103 countries, which collided with the figure of 68 given elsewhere. Investigation showed that 103 countries does not exist. Tzu Chi's annual report contains the entry \"**103,329** charity volunteers.\" Somewhere in the chain, a six-digit headcount became a count of nations. Tzu Chi's volunteer presence by year reads 51, 57, 63, 66, 68. A number of volunteers had grown into a world map.\n>\n> The third was my own error. Several papers in the drafts carried arXiv identifiers of the form 2603.29221 and 2606.18222. I took the numbering convention as grounds for suspicion and flagged them for special scrutiny. Checked one by one, both turned out to exist, with contents matching the citations. What I did find were three genuine papers attached to claims they do not support: a study of cross-cultural transmission of traditional Chinese medicine, cited as evidence for a \"cognitive rupture between Chinese Buddhism and Western rationalism,\" in a paper that contains not one instance of the words Buddhism, ritual, or discontinuity; and a paper on yoga posture recognition, cited for \"gait monitoring in walking meditation,\" in a paper that contains no gait, no walking, and no meditation. A fabricated citation is obvious at a glance. **A citation attached to the wrong claim is far quieter, and far more dangerous.**\n>\n> That lesson is written into this report's verification method: **whether a citation is genuine is decided by visiting it, never by trusting the look of its identifier.**\n\n### 二、证据分级\n\n沿用本项目既有的分级办法，正文论断标注级别：\n\n| 级别 | 含义 | 本报告中的实例 |\n|---|---|---|\n| **A** | 一手来源：原典、官方统计、官方文件、司法通报、机构官方发布 | 皮尤研究中心原始报告；国家宗教事务局国宗发〔2025〕12 号；国新办 2018 年白皮书；新加坡统计局、澳洲统计局、马来西亚统计局、英国国家统计局普查数据；CBETA 官方数据；教团官网 |\n| **B** | 学术来源：同行评议期刊、学术专著 | *AI and Ethics*、*Contemporary Buddhism*、*Nature*、*Religions*、*African Studies Review* |\n| **C** | 权威新闻与机构消息稿 | 新华社、中新社、*纽约时报*、*洛杉矶时报*、*ABC News* |\n| **D** | 线索：仅用于检索指向，不作论证依据 | 维基百科、各类百科、博客、自媒体 |\n\n另有三个标记需要说明。\n\n**【自述】** 用于教团或机构对自身规模与成效的陈述。这类数字未必虚假，但它未经独立核实，且同一机构的数字常因年份、部门、口径不同而彼此不一致。「海内外二百多所道场」和「百余国家、300 万会员」是两个不同的量，把它们并在一起说，会凭空放大一个数量级。凡遇到这类数字，本报告一律标注来源属于自述，并在可能时说明口径。\n\n**〔待核〕〔存疑〕〔线索〕** 用于证据不足或本身存在多方异说的陈述。本报告不以推测填补这类空缺。有几处空缺是大块的。全球范围内并不存在一份权威的\"汉传佛教海外道场与信众统计\"，本文所用一切\"N 国\"\"N 座\"的数字全部来自机构自述或媒体转述。这不是检索不力，是**这个数字目前不存在**。\n\n> **EN对应 · 2. Source Grading**\n>\n> This report follows the grading system already established in this project. Claims in the main text carry a grade:\n>\n> | Grade | Meaning | Examples in this report |\n> |---|---|---|\n> | **A** | Primary sources: canonical texts, official statistics, official documents, judicial notices, institutional releases | Pew Research Center reports; State Administration for Religious Affairs Document Guozongfa [2025] No. 12; the 2018 White Paper of the State Council Information Office; census data from SingStat, the ABS, DOSM, and the UK ONS; CBETA's own figures; official temple and order websites |\n> | **B** | Academic sources: peer-reviewed journals and scholarly monographs | *AI and Ethics*, *Contemporary Buddhism*, *Nature*, *Religions*, *African Studies Review* |\n> | **C** | Authoritative news and institutional press releases | Xinhua, China News Service, *The New York Times*, *Los Angeles Times*, *ABC News* |\n> | **D** | Leads only: useful for locating material, never as grounds for argument | Wikipedia, general encyclopedias, blogs, self-published media |\n>\n> Three further marks require explanation.\n>\n> **【Self-reported】** marks an order's or institution's own account of its size and effectiveness. Such figures are not necessarily false, but they are not independently verified, and the same institution's numbers often vary across years, departments, and definitions. \"Over two hundred temples worldwide\" and \"over a hundred countries, three million members\" are two different quantities; run together, they inflate the picture by an order of magnitude. Wherever figures of this kind appear, this report marks them as self-reported and, where possible, identifies the definition behind them.\n>\n> **〔Pending verification〕〔Disputed〕〔Lead only〕** mark statements for which the evidence is insufficient or on which sources disagree. This report does not fill such gaps with conjecture. Some of the gaps are large. No authoritative, independently auditable census of overseas Chinese Buddhist temples and adherents exists anywhere in the world; every \"N countries\" or \"N temples\" figure used here comes from an institution's own account or from media repetition. This is not a failure of searching. **The number does not exist.**\n\n### 三、事实与判断分开写\n\n属于推论、评估、预测、主张的内容，一律标「（判断）」。\n\n这一区分在这份报告里格外要紧。汉传佛教的全球传播是一个数据稀薄而立场纷杂的题目：同一位法师的同一场演讲，可以被读作文化自信的展现，也可以被读作软实力工程的一环，两种读法都能找到材料支撑。把读法混进事实陈述，是这个领域最常见的失真方式。所以本报告中一切立场性的表述——包括那些从汉传佛教本位出发的评价——都标为判断，交由读者裁断。\n\n> **EN对应 · 3. Facts and Judgments Kept Apart**\n>\n> Inferences, assessments, forecasts, and assertions are marked \"（判断）\" (judgment).\n>\n> The distinction matters more than usual here. The global transmission of Chinese Buddhism is a subject with thin data and crowded positions. The same talk by the same monk can be read as an expression of cultural confidence or as one component of a soft-power program, and both readings can find textual support. Blending readings into factual statements is the most common way this field distorts itself. Accordingly, every position taken in this report—including those argued from a Chinese Buddhist standpoint—is marked as a judgment and left to the reader.\n\n### 四、文体\n\n这份报告要坦白地谈自己的毛病，所以语气上不做全面中立的姿态。但它同样拒绝另一种腔调：把问题说得动听。\n\n有几条纪律是自觉遵守的：不用「首先、其次、最后」这类编号式的思路；不用「值得注意」「由此可见」这类过渡套话；章节结束落在一个事实上，不用一句概括性的话去收拢；加粗只用在表格里。段落长短刻意不齐——一句可以成段，一段也可以有十几行。\n\n还有一条更基本：**凡能写成人名、年代、地点、数字、原话的地方，不写抽象概括。** 抽象的词看起来稳妥，实际上什么也没说。\n\n> **EN对应 · 4. Style**\n>\n> This report discusses its own failings frankly, so it does not adopt a posture of complete neutrality. But it refuses the opposite register as well: making the problems sound agreeable.\n>\n> A few disciplines are observed deliberately. No numbered thinking of the \"first, second, finally\" kind. No bridging formulas such as \"it is worth noting\" or \"from this we may see.\" Sections end on a fact, not on a sentence that gathers everything up. Bold is used only in tables. Paragraphs are deliberately uneven—a single sentence may stand alone, and a paragraph may run to a dozen lines.\n>\n> One rule is more basic than the rest: **wherever a name, a date, a place, a number, or an original wording can be given, it is given instead of an abstraction.** Abstract words look safe. In practice they say nothing.\n\n### 五、边界\n\n依本项目「边界自知·局限留档」的规范，先把自己的短处交代清楚。\n\n**语种的短处最大。** 本报告主要依据中文与英文材料。日文、韩文、越南文、僧伽罗文、泰文的一手材料未能系统检索，而这几个国家恰恰是汉传佛教在海外的重要现场——日本的黄檗宗、韩国的曹溪宗、越南的竹林禅派，都是汉传法脉的分支，它们今日的情形本报告只能从二手材料中略窥。这是结构性缺口。\n\n**数据几乎没有一样是硬的。** 前面说过，全球没有一份可审计的汉传海外统计。本报告反复使用\"自述\"标注，读者若见满篇自述而觉得不耐烦，那种不耐烦是对的。\n\n**有几样东西查不到。** 《深入推进我国佛教中国化五年工作规划纲要（2023～2027 年）》目前只见《法音》2023 年第 11 期纸刊，官网未发布免费全文；bodhiai.cn 站点的 TLS 证书已过期，无法访问；另有五项数字经过多轮检索零命中，已在附录一中逐条列明。\n\n**立场是有偏的。** 这份报告站在汉传佛教内部说话。它对汉传问题的剖析虽力求坦白，但出发点与关怀所在是明确的，不是一份外部评估。读者掂量它的判断时，请把这一点算进去。\n\n> **EN对应 · 5. Limits**\n>\n> Following this project's norm of recording one's own boundaries, the report's shortcomings come first.\n>\n> **Language is the largest.** This report draws mainly on Chinese- and English-language materials. Primary sources in Japanese, Korean, Vietnamese, Sinhala, and Thai were not systematically searched, and those countries are precisely where Chinese Buddhism is most alive overseas. The Ōbaku school in Japan, the Jogye Order in Korea, and the Trúc Lâm tradition in Vietnam are all branches of the Chinese lineage, yet their present condition can be glimpsed here only through secondary materials. This is a structural gap.\n>\n> **Almost no datum is hard.** As noted above, no auditable census of overseas Chinese Buddhism exists. This report marks self-reported figures as such throughout, and a reader who tires of seeing that mark is right to tire.\n>\n> **Some things could not be found.** The *Five-Year Work Plan for Deepening the Sinicization of Buddhism in China (2023–2027)* is currently available only in the print edition of *Fayin* (Dharma Sound), No. 11, 2023; no free full text has been released online. The site bodhiai.cn has an expired TLS certificate and cannot be accessed. Five further figures returned zero results across multiple search strategies and are listed individually in Appendix One.\n>\n> **The standpoint is partial.** This report speaks from inside Chinese Buddhism. Its critique of Chinese Buddhist problems aims at candor, but its starting point and its concerns are not those of a detached outside assessor. Readers should weigh its judgments accordingly.\n\n---\n\n## 导论\n\n### 三条通道\n\n\"汉传佛教的全球传播\"，这句话在日常生活中几乎是不需要解释的：有一个主体，朝一个方向，以一定的规模在移动。\n\n稍加分辨就会发现，它不是一件事，是至少三件事。\n\n**教团。** 台湾系跨国教团、海外华人道场、人间佛教系统的据点。有僧团，有信众，有晨钟暮鼓和一日三餐。这条通道能真正完成传法，代价是慢。\n\n**文本。** 汉文大藏经、禅宗文献、经论的学术译介。它的体量其实远大于第一条通道，但其中大部分经由日本、韩国、越南和西方学界转手，与汉传教团本体几乎没有往来。一个西方学者可以终身研究《大智度论》而不曾踏入一座汉传寺院。\n\n**符号。** 脱离教团语境的 Zen、禅意、正念。影响最广，门槛最低，离佛法本体最远。\n\n三条通道的强弱次序，与\"传法\"的实质程度恰好相反。越是全世界都接受的，越是脱离教团本体；越是能承担传法之实的，越是走不出去。许多\"汉传影响世界\"的叙述，都是在把三层含义混着说——说\"遍及百余国家\"时，指的可能是某国某城的一家禅意咖啡馆，而非一座寺院。（判断）\n\n> **EN对应 · Three Channels**\n>\n> \"The global transmission of Chinese Buddhism\" reads, in ordinary usage, as though it needed no explanation: one subject, one direction, one scale of movement.\n>\n> A little scrutiny shows that it is not one thing but at least three.\n>\n> **The order.** Transnational Taiwanese Buddhist orders, overseas Chinese temples, and the strongholds of Humanistic Buddhism. There are monastic communities, lay followers, morning bells and evening drums, three meals a day. This channel can actually transmit the dharma. It is slow.\n>\n> **The text.** The Chinese canon, Chan literature, scholarly translation of the treatises. Its volume is in fact far larger than the first channel's, but most of it passes through Japanese, Korean, Vietnamese, and Western scholarship, with almost no contact with the Chinese Buddhist orders themselves. A Western scholar may spend a lifetime on the *Mahāprajñāpāramitā-śāstra* without ever setting foot in a Chinese Buddhist temple.\n>\n> **The sign.** Zen, Zen aesthetics, mindfulness, all detached from any monastic context. Widest reach, lowest threshold, furthest from the dharma itself.\n>\n> The order of strength among these three runs exactly opposite to the substance of transmission. What the world accepts most readily is what has departed furthest from the lineage; what can actually carry the dharma is what cannot get out. Much talk of \"Chinese Buddhism's global influence\" blends the three together—\"present in over a hundred countries\" may mean a Zen-themed café in some city, not a temple. (Judgment)\n\n### 四件事\n\n这份报告的基本判断有四条。放在这里，后面逐一展开。\n\n**第一，母体在收缩，海外的增量主要靠移民而非皈依。** 全球佛教徒从 2010 年的 3.43 亿降到 2020 年的 3.24 亿，是唯一在绝对数上下降的主要宗教。美国十年增长 22%，但增长几乎全部来自亚洲移民，而不是宗教转换。\n\n**第二，瓶颈不在教义吸引力。** 皮尤的调查里有一个数字很说明问题：亚裔美国人中，出于家庭或文化原因\"亲近佛教\"的占 21%，正式认同佛教的只占 11%——亲近者是认同者的将近两倍。好感是有的，路没修好。\n\n**第三，真正卡住的四件事是**治理公信、语言与人才断层、政治耦合带来的跨境信任成本、典籍与概念的可及性赤字。这四件事没有一件涉及\"佛法讲得好不好\"，全都涉及组织可不可信、语言通不通达、身份清不清白、典籍拿不拿得到。\n\n**第四，最有杠杆的方向是公共产品化与基础设施先行。** 汉传在海外最被认可、争议最小的贡献，几乎无一例外是非传教性的公共产品：比丘尼戒统、人道救援、禅修训练、典籍翻译与数字化。AI 是其中最大的变量，也是最大的治理难题。（判断）\n\n> **EN对应 · Four Points**\n>\n> The report rests on four judgments, set out here and developed below.\n>\n> **First, the mother body is contracting, and overseas growth comes from immigration rather than conversion.** The global Buddhist population fell from 343 million in 2010 to 324 million in 2020—the only major religion to decline in absolute numbers. American Buddhism grew 22 percent over the decade, but that growth came almost entirely from Asian immigration, not from religious conversion.\n>\n> **Second, the bottleneck is not the appeal of the teachings.** One Pew figure is telling: among Asian Americans, 21 percent feel \"close to Buddhism\" for family or cultural reasons, while only 11 percent formally identify as Buddhist—nearly twice as many feel close as belong. The goodwill exists. The road is not built.\n>\n> **Third, four concrete things are stuck:** the credibility of governance, the gap in language and personnel, the cross-border trust cost created by political entanglement, and the deficit in access to texts and concepts. Not one of the four concerns whether the dharma is taught well. All four concern whether the organization can be trusted, whether the language reaches, whether the identity is clean, and whether the texts can be obtained.\n>\n> **Fourth, the highest-leverage direction is public goods and infrastructure first.** The contributions for which Chinese Buddhism is most recognized abroad and least contested are almost without exception non-proselytizing public goods: the bhikṣuṇī ordination lineage, humanitarian relief, meditation training, translation, and digitization. AI is the largest variable among them—and the hardest to govern. (Judgment)\n\n### 这份报告怎么走\n\n分四部。\n\n第一部看现状——家底有多少，谁在传，传到哪儿，怎么走到今天。数字难看的照样写。\n\n第二部看病。九处，一节一处。治理公信那一节最长，也最难写。\n\n第三部看手里的新工具：AI 能做什么，不能做什么，哪些事看起来能做其实不能做。\n\n第四部看路。\n\n最后是附录，把核验记录、证据分级、项目清单、评测标准和查不到的东西一并归置。\n\n> **EN对应 · How the Report Proceeds**\n>\n> Four parts.\n>\n> Part One surveys the present: what we hold, who transmits it, where it has reached, and how it got here. Unflattering numbers are included.\n>\n> Part Two examines the illnesses—nine of them, one per section. The section on governance credibility is the longest and the hardest to write.\n>\n> Part Three looks at the new tools at hand: what AI can do, what it cannot do, and what it appears able to do but cannot.\n>\n> Part Four considers the road.\n>\n> Appendices follow, gathering the verification record, the source grading, the project inventory, the evaluation standards, and what could not be found.\n\n---\n\n# 第一部　把家底摊开\n\n## 一、三个数字和一个空缺\n\n### 3.43 亿与 3.24 亿\n\n皮尤研究中心 2025 年 6 月 9 日的报告给出了这组数字：全球佛教徒 2010 年 3.43 亿，2020 年 3.24 亿，减少约 5%（A 级，[Pew, *Buddhist population change*, 2025-06-09](https://www.pewresearch.org/2025/06/09/buddhist-population-change/)）。\n\n下降集中在东亚。中国减少约 2300 万，日本减少约 700 万，五个主要国家合计减少 3200 万，占该地区佛教人口的 22%。原因并不神秘：脱离宗教认同、信众老龄化、生育率低，三样叠在一起。\n\n98% 的佛教徒生活在亚太。北美增至约 500 万（+27%），欧洲约 250 万（+26%），拉美约 33 万（−3%）。皮尤对中国 2020 年的估计是 5300 万，占人口 4%。\n\n这组数据用起来要小心两处。皮尤统计的是**自我认同者**——一个人可以在家里供着观音、逢年过节去寺里上香、遇事念几句佛号，问卷上却勾\"无宗教信仰\"。对汉传佛教这种信仰实践与身份认同长期分离的传统，这个口径尤其不利。另一处是皮尤不区分传统，它数的\"佛教徒\"是汉传藏传南传日韩越的总和。\n\n> **EN对应 · 343 Million and 324 Million**\n>\n> Pew Research Center's report of 9 June 2025 gives these figures: the global Buddhist population stood at 343 million in 2010 and 324 million in 2020, a decline of roughly 5 percent (Grade A, [Pew, *Buddhist population change*, 2025-06-09](https://www.pewresearch.org/2025/06/09/buddhist-population-change/)).\n>\n> The decline is concentrated in East Asia. China lost about 23 million, Japan about 7 million; five major countries together account for a loss of 32 million, or 22 percent of the region's Buddhist population. The reasons are not mysterious: detachment from religious identity, an aging sangha, and low fertility, stacked together.\n>\n> Ninety-eight percent of Buddhists live in the Asia-Pacific. North America rose to about 5 million (+27 percent), Europe to about 2.5 million (+26 percent), and Latin America to about 330,000 (−3 percent). Pew estimates China's Buddhist population in 2020 at 53 million, four percent of the population.\n>\n> Two cautions apply to these figures. Pew counts **self-identification**—a person may keep a Guanyin image at home, visit a temple at the new year, and recite a Buddha's name when trouble comes, yet tick \"no religion\" on the form. For a tradition in which practice and identity have long been separated, this definition works against it. The second caution is that Pew does not disaggregate by tradition: its \"Buddhists\" are the sum of Chinese, Tibetan, Theravāda, Japanese, Korean, and Vietnamese Buddhism combined.\n\n### 4% 到 33%\n\n中国大陆的佛教人口，比例可以从 4% 一直数到 33%。差异不在事实，在定义。\n\n自我认同为佛教徒的，约 4%（2018 年 CGSS，约 4200 万成年人；2021 年仍是 4%）。\"相信佛／菩萨\"的，33%（2018 年 CFPS，约 3.62 亿），其中只信佛而不信其他神明的占 16%。（均为 A 级，皮尤对 CGSS 与 CFPS 原始数据的再分析：[中国六事](https://www.pewresearch.org/short-reads/2023/09/21/6-facts-about-buddhism-in-china/)、[佛教](https://www.pewresearch.org/religion/2023/08/30/buddhism/)）\n\n中国佛教协会的口径又不一样。2017 年两会上，时任会长学诚答问时说「据不完全统计，目前中国的佛教徒人数有**近二亿**」（C 级，[贵州省民宗委转载](https://mzw.guizhou.gov.cn/xwzx/yw/201703/t20170314_10581823.html)）。流传稿子里的说法是\"逾 1 亿\"，比原话低了整一倍。\n\n4% 和 33% 之间隔着八倍。这不是统计误差，是两种存在方式的距离：一端是\"我是一名佛教徒\"这样的身份声明，另一端是\"我相信佛菩萨\"这样的信仰实践。**汉传佛教在大陆的真实形态，大量存在于这两个数字之间的地带。**\n\n一个\"核心薄、外围厚\"的母体，其后果是可以推想的。外围再厚，也难以直接变成译经的译师、跨语的法师、可审计的治理。教团通道靠的从来不是外围的人数，是核心的人才，而核心恰恰是薄的那一头。（判断）\n\n> **EN对应 · From 4 Percent to 33 Percent**\n>\n> The Buddhist population of mainland China can be counted as anything from 4 percent to 33 percent. The difference lies not in fact but in definition.\n>\n> Those who identify as Buddhist: about 4 percent (CGSS 2018, roughly 42 million adults; still 4 percent in 2021). Those who \"believe in Buddhas and bodhisattvas\": 33 percent (CFPS 2018, roughly 362 million), of whom 16 percent believe in Buddhas alone and in no other deities. (Both Grade A, from Pew's reanalysis of the original CGSS and CFPS data: [Six facts about Buddhism in China](https://www.pewresearch.org/short-reads/2023/09/21/6-facts-about-buddhism-in-china/); [Buddhism](https://www.pewresearch.org/religion/2023/08/30/buddhism/).)\n>\n> The Buddhist Association of China uses yet another figure. At the 2017 sessions of the National People's Congress and the CPPCC, the then-president Shi Xuecheng answered a question with \"by incomplete count, China's Buddhists number **close to two hundred million**\" (Grade C, [Guizhou Provincial Commission for Ethnic and Religious Affairs](https://mzw.guizhou.gov.cn/xwzx/yw/201703/t20170314_10581823.html)). The circulating drafts rendered this as \"over 100 million\"—one hundred million short of the original wording.\n>\n> Between 4 percent and 33 percent lies an eightfold gap. This is not statistical error; it is the distance between two ways of existing. At one end stands a declaration of identity—\"I am a Buddhist.\" At the other stands a practice of belief—\"I believe in Buddhas and bodhisattvas.\" **The actual shape of Chinese Buddhism in mainland China lies largely in the territory between these two numbers.**\n>\n> The consequences of a mother body that is thin at the core and thick at the periphery can be inferred. However thick the periphery, it does not convert directly into translators, multilingual monastics, or auditable governance. The order channel has never depended on the size of the periphery but on the talent at the core—and the core is the thin end. (Judgment)\n\n### 3.35 万座与 22.2 万人\n\n2018 年国务院新闻办公室《中国保障宗教信仰自由的政策和实践》白皮书里的两组数字（A 级，[人民网全文](http://cpc.people.com.cn/n1/2018/0404/c64387-29906950-2.html)）：\n\n官方登记、且带僧团的佛教寺院约 3.35 万座，其中汉传约 2.8 万余座。登记佛教教职人员约 22.2 万人，其中汉传约 7.2 万、藏传约 14.8 万、南传约 0.2 万。经国家宗教事务局批准的宗教院校共 91 所，其中佛教 41 所（截至 2017 年 9 月）。\n\n第二组数字里有个结构值得看一眼：汉传的寺院数量是藏传的数十倍，登记教职人员却只有藏传的约一半。这个比例未必直接反映真实的僧才对比——登记口径、藏传的学经制度都会影响统计，不宜简单解读——但它至少提示，汉传手里**硬件远多于软件**。一座寺院三年可以建成，一位法师要二十年。\n\n流传稿子里还有一个数字：「据 2014 年 CLDS 推算，含佛教神祇的寺庙至少 19.2 万座」。这个数字在五轮检索中零命中，与可查的官方口径 3.35 万座相差近六倍，本报告予以删除，理由见附录一。\n\n> **EN对应 · 33,500 Temples and 222,000 Clergy**\n>\n> Two sets of figures from the State Council Information Office's 2018 White Paper, *China's Policies and Practices on Protecting Freedom of Religious Belief* (Grade A, [full text at People's Daily Online](http://cpc.people.com.cn/n1/2018/0404/c64387-29906950-2.html)):\n>\n> Registered Buddhist temples with resident monastic communities number about 33,500, of which roughly 28,000 are Chinese Buddhist. Registered Buddhist clergy number about 222,000—some 72,000 Chinese Buddhist, 148,000 Tibetan Buddhist, and 2,000 Theravāda. Of 91 religious colleges approved by the State Administration for Religious Affairs, 41 are Buddhist (as of September 2017).\n>\n> One structural feature of the second set deserves a look: Chinese Buddhist temples outnumber Tibetan ones several dozen times over, yet registered Chinese Buddhist clergy amount to about half the Tibetan figure. This ratio does not necessarily reflect the real balance of monastic training—registration practice and the Tibetan scholastic system both affect the count, and it should not be read off too quickly—but it points at least to this: Chinese Buddhism holds **far more hardware than software**. A temple can be built in three years. A monk takes twenty.\n>\n> The circulating drafts carried one further figure: \"extrapolating from CLDS 2014, at least 192,000 temples contain Buddhist deities.\" This figure returned zero results across five rounds of searching and differs from the verifiable official count of 33,500 by nearly a factor of six. It is deleted here, for the reasons given in Appendix One.\n\n### 那个空缺\n\n三个数字之后，有一个空缺。\n\n**全球汉传佛教信众究竟有多少，没有数字。**\n\n这件事不是本文检索不力。皮尤不按传统拆分，各国普查也不按传统拆分，各教团的自述口径互不相通且不对外审计。一个流传了两千年、遍布五大洲、有数万座寺院和数十万僧尼的传统，**说不清自己有多少人**。\n\n这个空缺本身就是一个发现。它会在第十二章再出现一次——那时它是作为一项能力缺陷出现的。（判断）\n\n> **EN对应 · The Gap**\n>\n> After three sets of figures comes a gap.\n>\n> **How many Chinese Buddhists there are in the world: there is no number.**\n>\n> This is not a failure of searching. Pew does not disaggregate by tradition; national censuses do not disaggregate by tradition; the orders' self-reported figures are mutually incomparable and not externally audited. A tradition that has run for two thousand years, spread across five continents, and holds tens of thousands of temples and hundreds of thousands of monastics **cannot say how many people it has**.\n>\n> The gap is itself a finding. It will appear once more in Chapter Thirteen, where it figures as a capacity deficit. (Judgment)\n\n---\n\n## 二、谁在传\n\n### 台湾系教团\n\n汉传佛教在海外的教团通道，主体几乎全是台湾系。\n\n**佛光山** 1967 年 5 月 16 日开山，是这条通道上体量最大的一家。关于它的规模，前面已经说过口径的麻烦：官网今述「海内外二百多所道场」（A 级·【自述】，[fgs.org.tw](https://www.fgs.org.tw/career/career_global.aspx)），宗团文献中另有\"300 余所\"之说，而流传最广的\"40 多国\"\"100+ 国家\"实为**国际佛光会**的口径混入——佛光会官方自述「五大洲百余个国家地区、300 万会员」（A 级·【自述】，[blia.org.tw](https://www.blia.org.tw/about-us/)）。道场数与会员覆盖国数是两个量，混着说会凭空放大一个数量级。截至 2026 年，佛光山官方没有\"N 国 N 座\"的精确数字，本报告也不代为合成。\n\n佛光山另有一项常被忽略的事实：它办有五所高等教育机构——美国西来大学（1990）、台湾佛光大学（1993）、南华大学（1996）、澳洲南天大学（2011）、菲律宾光明大学（2014）（A 级，[佛光山教团系统大学](https://website.fgu.edu.tw/zh_tw/about/eduinstitutions)）。汉传佛教第一次成建制地进入了世俗高等教育体系，靠的就是这五所。\n\n海外枢纽西来寺 1978 年筹、1986 年动工、1988 年 7 月 24 日开光、11 月 26 日落成，是海外第一座别院与美洲总部（A 级，[西来寺官网](http://hsilai.org/about-us-origin/)）。流传稿子里\"国际佛光会 1991 年在此成立\"一语需要辨正：1991 年 2 月 3 日在西来寺成立的是**中华佛光协会**，世界总会则要到 1992 年 5 月 16 日。\n\n创办人星云大师 1927 年 8 月 19 日生，2023 年 2 月 5 日圆寂，**享耆寿 97 岁**（周岁 95）（A 级，[佛光山讣闻](https://www.fgs.org.tw/branch/activity_detail?BrID=D50601&LstID=6&ItmID=43&news_no=20230206000004&)）。流传材料中常见的\"享年 95\"与官方口径不符，本报告予以订正。\n\n> **EN对应 · The Taiwanese Orders**\n>\n> The order channel of overseas Chinese Buddhism is made up almost entirely of Taiwanese orders.\n>\n> **Foguang Shan** opened in 1967 (16 May) and is the largest body on this channel. The difficulty of its numbers has been noted: the order's website states \"over two hundred temples worldwide\" (Grade A, self-reported, [fgs.org.tw](https://www.fgs.org.tw/career/career_global.aspx)); order literature elsewhere gives \"over 300\"; and the widely circulated \"40-plus countries\" and \"over 100 countries\" are in fact figures belonging to the **Buddha's Light International Association**, which reports \"over a hundred countries and regions across five continents, three million members\" (Grade A, self-reported, [blia.org.tw](https://www.blia.org.tw/about-us/)). Temple count and member-country reach are different quantities; run together, they inflate the picture by an order of magnitude. As of 2026 Foguang Shan has published no precise \"N countries, N temples\" figure, and this report does not manufacture one.\n>\n> One fact about Foguang Shan is regularly overlooked: it runs five institutions of higher education—the University of the West in the United States (1990), Fo Guang University in Taiwan (1993), Nanhua University (1996), Nan Tien Institute in Australia (2011), and Guang Ming College in the Philippines (2014) (Grade A, [Foguang Shan system universities](https://website.fgu.edu.tw/zh_tw/about/eduinstitutions)). Chinese Buddhism entered the secular higher education system as an institution for the first time through these five.\n>\n> Its overseas hub, Hsi Lai Temple, was planned in 1978, begun in 1986, consecrated on 24 July 1988, and completed on 26 November of that year—the first overseas branch temple and the American headquarters (Grade A, [Hsi Lai Temple](http://hsilai.org/about-us-origin/)). The circulating statement that \"the Buddha's Light International Association was founded here in 1991\" requires correction: what was founded at Hsi Lai on 3 February 1991 was the **Buddha's Light Association of the Republic of China**; the world headquarters came later, on 16 May 1992.\n>\n> The founder, Master Hsing Yun, was born on 19 August 1927 and died on 5 February 2023, **aged 97 by Chinese reckoning** (95 by Western count) (Grade A, [Foguang Shan obituary](https://www.fgs.org.tw/branch/activity_detail?BrID=D50601&LstID=6&ItmID=43&news_no=20230206000004&)). The commonly circulated \"aged 95\" does not match the official account and is corrected here.\n\n**慈济** 1966 年创立。官方 2025 年口径为「志工分布 68 国、逾 600 据点、援助足迹 136 国」（A 级·【自述】，[global.tzuchi.org](https://global.tzuchi.org/words-from-our-ceo)；2025 年报导读已更新至 139 国）。前文说过，\"103 国\"是「103,329 位慈善志工」被误读的产物。慈济 2010 年 7 月 19 日获联合国经社理事会「NGO in Special Consultative Status」，持有主体是「佛教慈济基金会」整体，不是它的美国分会（A 级，[慈济基金会](https://www.tzuchi-org.tw/en/index.php?option=com_content&view=article&id=636&catid=116&Itemid=324&lang=en)）。\n\n**法鼓山**的路径与上述两家都不同。圣严法师 1969 年赴日（立正大学），1971 年获硕士，1975 年以《明末中国佛教之研究》获文学博士、同年赴美；1979 年在纽约创立禅中心（1981 年命名东初禅寺）；1997 年设纽约上州象冈道场（A 级，[圣严法师年谱](https://shengyen.org/bio.php)）。法鼓山本体的创建要到 1989 年。\n\n法鼓山最特别的地方在于它把传承交给了西方人。圣严法师的五位西方在家法子是 John Crook（1993）、Simon Child 与 Max Kalin（2000-12-01）、Žarko Andričević（2001）、Gilbert Gutierrez（2002）（A 级，[圣严法师研究论文](https://www.shengyen.org.tw/userdata/upload/papers/paper-9.pdf)）。汉传佛教的世系表上出现西人名字，这样的例子在历史上并不多。顺带辨正一处：常被列入这份名单的果谷（Jimmy Yu）并非西方在家法子——他是圣严法师的剃度弟子（1991 年出家、2000 年还俗），且不是西方人。\n\n**中台禅寺**创办人惟觉长老 1928–2016（2016 年 4 月 8 日圆寂）。依中台官方《落成十周年回顾》，1992 至 2010 年间海内外精舍达 108 家（A 级·【自述】，[chungtai.org](https://www.chungtai.org/dialogue/2011/2011-08/10thAnniversary/sub04-gb.htm)）。\n\n**法界佛教总会**走的是另一条路：严守戒律，加上译经。它的成立年份需要辨正——前身「中美佛教总会」1959 年创立（1968 年法人化），1984 年才改现名「法界佛教总会」；金山寺 1970 年设于旧金山；万佛圣城 1974 年购地、1976 年成立；佛经翻译委员会（BTTS）1970 年成立，1972 年起出版。流传的\"法界佛教总会 1969 年成立\"与主流记载不符。另有一处也需订正：\"万佛圣城是美国最早的禅宗道场之一\"——北美更早的有旧金山禅中心（1962）、罗切斯特禅中心（1966）、金山寺（1970）。\n\n> **EN对应 · The Taiwanese Orders (continued)**\n>\n> **Tzu Chi** was founded in 1966. Its 2025 figures are \"volunteers in 68 countries, over 600 offices, relief reach in 136 countries\" (Grade A, self-reported, [global.tzuchi.org](https://global.tzuchi.org/words-from-our-ceo); the 2025 annual report preface has updated the reach to 139). As noted, \"103 countries\" was produced by misreading \"103,329 charity volunteers.\" On 19 July 2010 Tzu Chi obtained \"NGO in Special Consultative Status\" with the UN Economic and Social Council; the holder is the Buddhist Tzu Chi Foundation as a whole, not its American chapter (Grade A, [Tzu Chi Foundation](https://www.tzuchi-org.tw/en/index.php?option=com_content&view=article&id=636&catid=116&Itemid=324&lang=en)).\n>\n> **Dharma Drum Mountain** took a different route from either of the above. Master Sheng Yen went to Japan in 1969 (Rissho University), took his master's degree in 1971, received his doctorate in literature in 1975 for a study of late-Ming Chinese Buddhism, and went to the United States the same year; he founded the Chan Center in New York in 1979 (renamed the Chung-Hwa Institute of Buddhist Culture's Eastern Dharma Center in 1981) and established the Upstate New York retreat center in 1997 (Grade A, [Sheng Yen chronology](https://shengyen.org/bio.php)). The Dharma Drum Mountain organization itself dates to 1989.\n>\n> What makes Dharma Drum distinctive is that it handed the transmission to Westerners. Sheng Yen's five Western lay heirs are John Crook (1993), Simon Child and Max Kalin (1 December 2000), Žarko Andričević (2001), and Gilbert Gutierrez (2002) (Grade A, [Sheng Yen research paper](https://www.shengyen.org.tw/userdata/upload/papers/paper-9.pdf)). Names of Westerners on the transmission chart of Chinese Buddhism are not common in history. One correction: Jimmy Yu (果谷), often listed among them, is not a Western lay heir—he was Sheng Yen's ordained disciple (ordained 1991, returned to lay life in 2000) and is not a Westerner.\n>\n> **Chung Tai Shan** was founded by Master Weijue (1928–2016; died 8 April 2016). By the order's own *Tenth Anniversary Review*, its temples and meditation centers in Taiwan and abroad reached 108 between 1992 and 2010 (Grade A, self-reported, [chungtai.org](https://www.chungtai.org/dialogue/2011/2011-08/10thAnniversary/sub04-gb.htm)).\n>\n> **The Dharma Realm Buddhist Association** took yet another route: strict discipline, plus translation. Its founding year requires correction—the predecessor, the Sino-American Buddhist Association, was founded in 1959 (incorporated 1968) and was renamed the Dharma Realm Buddhist Association only in 1984; Gold Mountain Monastery was established in San Francisco in 1970; the City of Ten Thousand Buddhas bought its land in 1974 and was established in 1976; the Buddhist Text Translation Society was founded in 1970 and began publishing in 1972. The circulating \"DRBA founded 1969\" does not match the mainstream record. One further correction: the City of Ten Thousand Buddhas was not \"one of the earliest Chan centers in the United States\"—earlier North American foundations include the San Francisco Zen Center (1962), the Rochester Zen Center (1966), and Gold Mountain Monastery (1970).\n\n### 戒统：一件被自己忽略的事\n\n汉传佛教对世界佛教最实质的一项贡献，是比丘尼戒统的回传。\n\n佛教史上，比丘尼传承 5 世纪自师子国（斯里兰卡）传入中国：429 年首批师子国比丘尼抵建康，433／434 年铁索罗（Devasara）等人在南林寺依二部僧戒为三百余人授具足戒，僧伽跋摩任戒师（B 级，学界通说）。斯里兰卡本土的比丘尼传承约在 11 世纪断绝，一说 1017 年朱罗入侵之后，具体年份学界有异说。\n\n也就是说，**南传与藏传都已失传的比丘尼戒统，完整地保存在汉传手里。**\n\n1998 年 2 月 14 至 23 日，由星云大师与佛光山主办，在印度菩提伽耶举行的国际比丘尼具足戒戒会，做的就是回传这件事。与会规模各说并存：22 国 146 人（其中 132 位女众）（Thubten Chodron 记述，[原文](https://www.thubtenchodron.org/zh-CN/1998/02/restoring-bhikshuni-ordination/)）／20 余国 150 余人（佛光山口径）／32 国 150 人（韩国比丘尼会口径）。三说并列，本报告不作裁断。\n\n更早的一次是 1988 年 11 至 12 月，西来寺举办「万佛三坛大戒」，首次有南传出家众于大乘寺院受戒，藏传弟子亦来求戒，南传比丘尼登坛，是西方首次三坛大戒（A 级，人间社）。\n\n把这两件事放在一起看，汉传佛教在全球佛教中的位置有一个侧面就清楚了：在戒统这件事上，它一直是给出的一方。而这件事在汉传自己的对外叙述里，位置并不显眼。流传的六份稿子里，只有一份用了\"可能是汉传对世界佛教最具制度性的贡献\"这样的措辞，另五份几乎未提。\n\n> **EN对应 · The Ordination Lineage: A Contribution We Ourselves Overlook**\n>\n> The most substantial contribution Chinese Buddhism has made to world Buddhism is the return transmission of the bhikṣuṇī ordination lineage.\n>\n> In Buddhist history the bhikṣuṇī lineage came to China from Sri Lanka in the fifth century: in 429 the first Sinhalese nuns arrived at Jiankang, and in 433/434 Devasara and others conferred full ordination on more than three hundred women at Nanlin Temple according to the dual-sangha procedure, with Saṅghavarman as preceptor (Grade B, scholarly consensus). The bhikṣuṇī lineage in Sri Lanka itself died out around the eleventh century—one account places it after the Chola invasion of 1017; scholarly opinion differs on the exact date.\n>\n> That is to say: **the bhikṣuṇī ordination lineage, lost in both the Theravāda and Tibetan traditions, survives intact in Chinese Buddhism.**\n>\n> The international bhikṣuṇī ordination held at Bodh Gaya from 14 to 23 February 1998, convened by Master Hsing Yun and Foguang Shan, was that lineage being given back. Accounts of its size differ and are set side by side here: 22 countries and 146 participants, of whom 132 were women (Thubten Chodron's account, [original](https://www.thubtenchodron.org/zh-CN/1998/02/restoring-bhikshuni-ordination/)); over 20 countries and more than 150 participants (Foguang Shan's figure); 32 countries and 150 participants (the Korean Bhikṣuṇī Association's figure). This report does not adjudicate among them.\n>\n> The earlier occasion was the \"Ten Thousand Buddhas Triple Platform Ordination\" held at Hsi Lai Temple in November–December 1988—the first time Theravāda monastics received ordination in a Mahāyāna temple, with Tibetan disciples also coming to seek ordination and Theravāda nuns taking the platform. It was the first triple platform ordination in the West (Grade A, Humanistic Buddhism News Agency).\n>\n> Set these two events side by side and one facet of Chinese Buddhism's position in world Buddhism becomes clear: in the matter of ordination lineage, it has consistently been the giving party. Yet in Chinese Buddhism's own accounts of itself abroad, the matter occupies no prominent place. Of the six circulating drafts, only one used the phrase \"perhaps the most institutional contribution Chinese Buddhism has made to world Buddhism.\" The other five barely mention it.\n\n### 官方体系：论坛、博鳌与少林\n\n大陆官方主导的这条线，最近二十年有三个标志性节点。\n\n**世界佛教论坛。** 首届 2006 年 4 月 13 至 16 日，杭州开幕、舟山普陀山闭幕，与会规模有\"34 国 1000 余人\"与\"37 国 1200 余人\"两说；第二届 2009 年 3 月 28 日无锡开幕、4 月 1 日台北闭幕，近 50 国 1700 余位；第六届 2024 年 10 月 15 至 17 日于宁波雪窦山举行，72 国约 800 人，另有\"约 70 国\"说（C 级，[中新网](https://www.chinanews.com/gn/2024/10-14/10301492.shtml)、[中国佛教协会](https://chinabuddhism.com.cn/web/details/76260)）。从首届到第六届，规模收窄而国别增多。\n\n**博鳌宗教分论坛。** 2025 年 3 月 28 日，博鳌亚洲论坛 2025 年年会举办第十届\"宗教和合与文明互鉴\"分论坛，主题是「百千法门 同归方寸——佛教典籍数字化工程的探讨与展望」。中国佛教协会会长演觉在总结发言中说，佛教典籍「是人类共同的文化遗产」（C 级，[中新网](https://www.chinanews.com.cn/gn/2025/03-28/10390689.shtml)）。\n\n**少林寺。** 释永信被称为\"CEO 和尚\"。2015 年 2 月 23 日，他赴澳洲新南威尔士州肖尔黑文市（Shoalhaven），向市长 Joanna Gash 交付支票，结清购地尾款 **A$416.2 万澳元**（约合人民币 2040 万元、约 US$320 万；中文媒体另有 A$412 万与\"逾 300 万澳元\"等异说）。地块 Comberton Grange 约 1248 公顷，项目总预算 A$3.6 亿至 3.86 亿（C 级，[ABC News](https://www.abc.net.au/news/2015-02-23/shaolin-temple-abbot-pays-cheque/6227950)、[新华网](http://www.xinhuanet.com//world/2015-03/03/c_1114503265.htm)）。流传的\"300 万美元\"与实际金额有出入，本报告已订正。\n\n少林\"在 40 多个国家有商业与文化合作\"一语，更准确的说法是释永信本人所述\"40 多个海外文化机构／文化中心\"（2011、2015 年语）；少林寺 2022 年数据另称海外中心 200 多个、遍布 50 多个国家和地区。这两组数字年份不同、口径不同，不宜合用。其后果见第十一章。\n\n> **EN对应 · The Official System: The Forum, Bo'ao, and Shaolin**\n>\n> Three markers stand out over the past two decades on the line led by mainland officialdom.\n>\n> **The World Buddhist Forum.** The first was held 13–16 April 2006, opening in Hangzhou and closing at Mount Putuo in Zhoushan; accounts of attendance give either \"34 countries, over 1,000 participants\" or \"37 countries, over 1,200.\" The second opened in Wuxi on 28 March 2009 and closed in Taipei on 1 April, with nearly 50 countries and over 1,700 participants. The sixth was held at Mount Xuedou in Ningbo, 15–17 October 2024, with 72 countries and about 800 participants (another account says \"about 70 countries\") (Grade C, [China News Service](https://www.chinanews.com/gn/2024/10-14/10301492.shtml); [Buddhist Association of China](https://chinabuddhism.com.cn/web/details/76260)). From the first to the sixth, the scale narrowed while the number of countries grew.\n>\n> **The Bo'ao religious sub-forum.** On 28 March 2025 the Bo'ao Forum for Asia's annual conference held the tenth session of its \"Religions in Harmony and Mutual Learning among Civilizations\" sub-forum, under the theme \"A Hundred Thousand Dharma Gates, All Returning to the Square Inch: Exploring and Looking Ahead to the Digitization of Buddhist Texts.\" The president of the Buddhist Association of China, Yanjue, said in his closing remarks that Buddhist texts are \"a common cultural heritage of humankind\" (Grade C, [China News Service](https://www.chinanews.com.cn/gn/2025/03-28/10390689.shtml)).\n>\n> **Shaolin Temple.** Shi Yongxin has been called the \"CEO monk.\" On 23 February 2015 he travelled to Shoalhaven in New South Wales, Australia, and handed the mayor, Joanna Gash, a cheque settling the balance on a land purchase of **A$4.162 million** (about RMB 20.4 million, roughly US$3.2 million; Chinese-language media also give A$4.12 million and \"over A$3 million\"). The Comberton Grange parcel covers about 1,248 hectares, and the projected total budget ran from A$360 million to A$386 million (Grade C, [ABC News](https://www.abc.net.au/news/2015-02-23/shaolin-temple-abbot-pays-cheque/6227950); [Xinhua](http://www.xinhuanet.com//world/2015-03/03/c_1114503265.htm)). The circulating \"US$3 million\" does not match the actual sum and has been corrected here.\n>\n> The statement that Shaolin has \"commercial and cultural partnerships in over 40 countries\" is more accurately rendered as Shi Yongxin's own \"over 40 overseas cultural institutions and centres\" (his words in 2011 and 2015); Shaolin's 2022 figures separately claim over 200 overseas centres in more than 50 countries and regions. The two sets come from different years and different definitions and should not be run together. The consequences are taken up in Chapter Seven.\n\n### 数字底座：最不该缺席者的缺席\n\n汉传佛教在世界佛典数字化版图上的位置，与它自己的典籍体量很不相称。\n\n**BDK 英译大藏经**由日本佛教传道协会自 1982 年起推进。其 2017 年与 2019 年两版丛书前言**都称第一辑选定的 7185 页已完成约 65%**。同一个数字出现在相隔两年的两篇前言里，是沿用旧文还是进度确实停滞，本报告未能核实，标〔待核〕。\n\n**Dharmamitra** 由加州大学伯克利分校 BAIR 的 Keutzer 与 Nehrdich 于 2023 年 4 月创立，提供巴利、梵、藏与佛教汉语的机器翻译（MITRATranslate）、跨语种语义检索（MITRASearch）与 OCR（MITRA-OCR）。\n\n**CBETA** 是汉文大藏经数字化的主干，长期采用 TEI/XML 结构化编码，使经典不仅能被阅读，也能被机器处理、引用与分析。它 1998 年由中华佛学研究所支持成立，圣严法师指示全力支持；2023 年法人化时，法鼓山佛教基金会捐资 1,300 万，是最大的捐助者（A 级，[CBETA](https://cbeta.org)）。\n\n**灵隐寺**开发了\"基于人工智能的古籍 OCR 引擎\"与古籍数字化生产平台，推进《径山藏》《永乐北藏》《思溪藏》；2026 年 5 月的研讨会上，\"杭州云林数字佛典研究院\"揭牌，同时发布的\"如是佛典\"公布了《径山藏》的数字化成果（A 级，[杭州佛协](https://www.hzfjxh.com)；[灵隐寺](https://www.lingyinsi.org)）。\n\n**佛光山**2025 年 4 月 18 日于国际佛光会北美洲联谊会（奥斯汀）发布「Vurbo.ai 佛教专业版（Buddhist 4.0）」，由国际佛光会世界总会、佛光山人间佛教研究院与爱比科技（IPEVO）合作，整合一万条佛教术语（C 级，[TechOrange](https://techorange.com/2025/04/22/vurbo-ai-blia/)）。\"全球首套佛教专用翻译系统\"系主办方自述，标【自述】。\n\n把这五项并列，《大正藏》的英译由日本机构主导，佛教多语机器翻译由美国大学主导，汉文佛典的结构化由台湾一个基金会数十年撑着，大陆的进展近两年才在灵隐寺这样的单点上冒出来。\n\n> **EN对应 · The Digital Foundation: The Absence of Those Who Should Least Be Absent**\n>\n> Chinese Buddhism's position on the world map of Buddhist textual digitization is out of proportion to the size of its own canon.\n>\n> **The BDK English Tripiṭaka** has been advanced by the Japanese Society for the Promotion of Buddhism since 1982. Both the 2017 and 2019 prefaces to the series **state that about 65 percent of the 7,185 pages selected for the first series is complete**. The same figure appears in prefaces two years apart; whether this is a carried-over text or a genuine plateau, this report could not verify. Marked 〔pending verification〕.\n>\n> **Dharmamitra** was founded in April 2023 at UC Berkeley's BAIR by Kurt Keutzer and Sebastian Nehrdich, and provides machine translation for Pali, Sanskrit, Tibetan, and Buddhist Chinese (MITRATranslate), cross-lingual semantic search (MITRASearch), and OCR (MITRA-OCR).\n>\n> **CBETA** is the backbone of Chinese canonical digitization, long using TEI/XML structured encoding so that texts can not only be read but processed, cited, and analysed by machine. Founded in 1998 with the support of the Chung-Hwa Institute of Buddhist Studies and at Master Sheng Yen's instruction, it received a donation of NT$13 million from the Dharma Drum Mountain Buddhist Foundation at incorporation in 2023—the largest single contribution (Grade A, [CBETA](https://cbeta.org)).\n>\n> **Lingyin Temple** in Hangzhou has developed an \"AI-based OCR engine for ancient books\" and a digitization production platform, working through the *Jingshan Canon*, the *Yongle Northern Canon*, and the *Sixi Canon*. At a workshop in May 2026 the Hangzhou Yunlin Digital Buddhist Canon Research Institute was inaugurated, and a project named Rushi Fodian released its digitization results for the *Jingshan Canon* (Grade A, [Hangzhou Buddhist Association](https://www.hzfjxh.com); [Lingyin Temple](https://www.lingyinsi.org)).\n>\n> **Foguang Shan** released \"Vurbo.ai Buddhist Edition (Buddhist 4.0)\" on 18 April 2025 at the Buddha's Light International Association North America conference in Austin, developed jointly by the BLIA World Headquarters, the Foguang Shan Institute of Humanistic Buddhism, and IPEVO, integrating ten thousand Buddhist terms (Grade C, [TechOrange](https://techorange.com/2025/04/22/vurbo-ai-blia/)). \"The world's first Buddhist-specific translation system\" is the organizers' own claim and is marked 【self-reported】.\n>\n> Set the five side by side. The English translation of the Taishō canon is led by a Japanese body; multilingual Buddhist machine translation is led by an American university; the structuring of the Chinese canon has been carried for decades by a single Taiwanese foundation; and the mainland's progress has emerged only in the past two years, at single points such as Lingyin Temple.\n\n### 宗派的不对称\n\n汉传佛教在海外呈现的面孔，其实只是它众多宗派中的一支。\n\n教团型对外传播几乎由禅宗主导——法鼓山（圣严）、法界佛教总会（宣化）、中台（惟觉），无一不是禅门。净土在华人社群内部极为普遍，海外的能见度却低。华严、天台、唯识主要经由学术与译介传播，而非教团实践。\n\n天台的一心三观、华严的事事无碍、唯识的心识分析，在义理上最具深度与对话潜力，反而最少以\"活的修行传统\"的形态被世界看见。个中缘由不难推想：禅宗本就不重经论、重实证，与西方\"灵性而非宗教\"的口味天然合拍；教下诸宗以义理与次第立身，反而更依赖语言与教学系统，而出海最缺的恰恰是这两样。（判断）\n\n> **EN对应 · The Asymmetry among Schools**\n>\n> The face Chinese Buddhism shows abroad is in fact only one of its many schools.\n>\n> Order-based transmission abroad is dominated almost entirely by Chan—Dharma Drum Mountain (Sheng Yen), the Dharma Realm Buddhist Association (Hsuan Hua), and Chung Tai Shan (Weijue) are all Chan houses. Pure Land is extremely widespread within Chinese communities but has low visibility overseas. Huayan, Tiantai, and Yogācāra travel mainly through scholarship and translation rather than through living communities.\n>\n> Of all the schools, Tiantai's \"one mind, three contemplations,\" Huayan's \"unobstructed interpenetration of phenomena,\" and Yogācāra's analysis of consciousness are doctrinally the deepest and richest in dialogical potential—and they are precisely the ones least often seen abroad as living practice traditions. The reason is not hard to reconstruct: Chan has never emphasised scholastic texts and prizes direct realisation, which fits the Western taste for \"spirituality rather than religion\"; the doctrinal schools rest on doctrine and graduated stages, and therefore depend more heavily on language and teaching systems—exactly the two things scarcest overseas. (Judgment)\n\n---\n\n---\n\n## 三、地图\n\n### 台湾、新加坡、马来西亚\n\n**台湾**：皮尤 2024 年 7 月 29 日的调查显示，台湾成年人中佛教徒、无宗教信仰者、道教徒各约四分之一（A 级，[Pew](https://www.pewresearch.org/short-reads/2024/07/29/4-facts-about-religion-and-diversity-in-taiwan/)）。\n\n**新加坡**：2025 年住户调查（2026 年 6 月 30 日发布）显示佛教徒占 30.9%，无宗教信仰者升至 23.9%——2020 年是 20%，2010 年是 17%。佛教、道教、基督教、伊斯兰教的占比都在下降。年龄的分化很清楚：15 至 24 岁中无宗教信仰者占 26.8%，55 岁以上占 19.4%（A 级，[SingStat](https://www.singstat.gov.sg/news/general-household-survey-25)）。流传材料中\"新加坡佛教徒 31.1%\"用的是 2020 年人口普查的数字，与 2025 年住户调查的 30.9% 是两次不同年份的官方调查，不是矛盾，但不宜混用。\n\n**马来西亚**：2020 年人口普查显示佛教徒占 18.7%，约 610 万，绝大多数为华裔（A 级，DOSM MyCensus 2020）。\n\n> **EN对应 · Taiwan, Singapore, Malaysia**\n>\n> **Taiwan**: Pew's survey of 29 July 2024 found that Buddhists, the religiously unaffiliated, and Daoists each account for about a quarter of Taiwanese adults (Grade A, [Pew](https://www.pewresearch.org/short-reads/2024/07/29/4-facts-about-religion-and-diversity-in-taiwan/)).\n>\n> **Singapore**: The 2025 General Household Survey (released 30 June 2026) puts Buddhists at 30.9 percent, with the religiously unaffiliated rising to 23.9 percent—up from 20 percent in 2020 and 17 percent in 2010. Buddhism, Daoism, Christianity, and Islam all declined. The age split is clear: 26.8 percent of those aged 15–24 report no religion, against 19.4 percent of those over 55 (Grade A, [SingStat](https://www.singstat.gov.sg/news/general-household-survey-25)). The circulating figure of \"31.1 percent Buddhist\" comes from the 2020 census and is not in conflict with the 30.9 percent of the 2025 GHS—they are two official surveys from different years—but the two should not be used interchangeably.\n>\n> **Malaysia**: The 2020 census records Buddhists at 18.7 percent, about 6.1 million, overwhelmingly ethnic Chinese (Grade A, DOSM MyCensus 2020).\n\n### 美国：好感与归属之间的那条路\n\n皮尤 2026 年 3 月 11 日的数据（A 级，[Pew](https://www.pewresearch.org/short-reads/2026/03/11/5-facts-about-buddhists-in-the-united-states/)）：美国佛教徒约 440 万，占总人口 1.3%，十年增长 22%；成年佛教徒中 52% 出生于亚洲（越南、中国、泰国为最常见的三个出生地），64% 为亚裔；48% 是皈依者，但 55% 的\"自幼佛教徒\"已不再自认佛教。华裔美国人 56% 无宗教归属；越南裔有 37% 认同佛教。\n\n还有一组：亚裔中 21% 出于家庭或文化原因\"亲近佛教\"，正式认同者仅 11%。\n\n**亲近者是认同者的将近两倍。** 一个华裔青年可能在春节随家人上香、在家里摆一尊观音、搬家时请人看方位，但你问他是不是佛教徒，他会说不是。这中间差的不是好感，是一条路——从\"我家里有这个\"走到\"我是这个\"，需要教理入门、需要共修的社群、需要有人用他听得懂的话讲第一课。这条路汉传在北美还没有铺完。（判断）\n\n> **EN对应 · The United States: The Road between Goodwill and Belonging**\n>\n> Pew's figures of 11 March 2026 (Grade A, [Pew](https://www.pewresearch.org/short-reads/2026/03/11/5-facts-about-buddhists-in-the-united-states/)): about 4.4 million Buddhists in the United States, 1.3 percent of the population, up 22 percent over the decade; 52 percent of adult Buddhists were born in Asia (Vietnam, China, and Thailand being the three most common birthplaces) and 64 percent are Asian American; 48 percent are converts, yet 55 percent of those raised Buddhist no longer identify as such. Among Chinese Americans, 56 percent claim no religious affiliation; among Vietnamese Americans, 37 percent identify as Buddhist.\n>\n> One more: 21 percent of Asian Americans feel \"close to Buddhism\" for family or cultural reasons, against 11 percent who formally identify.\n>\n> **Nearly twice as many feel close as belong.** A young Chinese American may burn incense with the family at the new year, keep a Guanyin figure at home, and consult a feng shui master when moving house—yet asked whether he is a Buddhist, he will say no. What is missing is not goodwill but a road. Going from \"my family has this\" to \"I am this\" requires an introduction to doctrine, a community to practise with, and someone to teach the first lesson in words he understands. That road is not finished in North America. (Judgment)\n\n### 澳洲\n\n2021 年人口普查：佛教徒约 615,800 人，占 2.4%，四分之三出生于海外，逾 80% 在家说非英语（A 级，[Buddhist Council of NSW 转述 ABS 2021](https://buddhistcouncil.org/get-involved/buddhism-in-australia/)）。\n\n这两个比例是理解澳洲汉传的关键：它是一个移民宗教，而且首先是一个\"不说英语的\"移民宗教。\n\n> **EN对应 · Australia**\n>\n> The 2021 census records about 615,800 Buddhists, 2.4 percent of the population; three-quarters were born overseas and more than 80 percent speak a language other than English at home (Grade A, [Buddhist Council of NSW citing ABS 2021](https://buddhistcouncil.org/get-involved/buddhism-in-australia/)).\n>\n> Those two ratios are the key to understanding Chinese Buddhism in Australia: it is an immigrant religion, and above all a non-English-speaking one.\n\n### 欧洲、拉美与非洲\n\n欧洲：2021 年英格兰与威尔士普查显示佛教徒占 0.5%（约 27.3 万），苏格兰 2022 年为 0.3%，全英约 0.4 至 0.5%（A 级，ONS 2021 普查 TS030）。流传稿里的\"英国佛教徒约 0.4%\"是 2011 年的旧值。\n\n拉美与非洲体量极小，靠几个标志性据点撑着存在感。\n\n**南非南华寺**的缘起需要准确记载：1992 年 3 月 8 日，由布朗贺斯特市（Bronkhorstspruit）**市议会**签约捐地 3 公顷，当场增为 6 公顷，其后有 12、14 公顷诸说（A 级，[南华寺官网](https://www.nanhuatemple.org)）。流传说法多作\"南非政府捐赠\"，与史实不符。寺方的表演团体实名为「天龙队／Nan Hua Performing Arts Group」，2014 年依星云大师慈谕成立，也不是流传材料所称的\"南华龙狮团\"。\n\n**巴西如来寺**的「如来之子教养计划」由觉诚法师 2003 年于圣保罗 Cotia 如来寺发起，后设如来之子基金会与光明教育中心，内容含课后辅导、道德教育、音乐、足球，以及木工、水电、面包等职业技能培训（C 级，中新社、星洲日报报道）。项目本身不大，形态却值得看一眼：它把佛教的慈悲转成了当地社会一眼就能认出的东西——一个贫民窟少年学会一门手艺。\n\n> **EN对应 · Europe, Latin America, Africa**\n>\n> Europe: the 2021 census for England and Wales records Buddhists at 0.5 percent (about 273,000); Scotland's 2022 census gives 0.3 percent, putting the UK as a whole at roughly 0.4 to 0.5 percent (Grade A, ONS 2021 Census TS030). The circulating \"about 0.4 percent in Britain\" is the 2011 figure.\n>\n> Latin America and Africa are very small in scale, their presence carried by a handful of landmark sites.\n>\n> The origin of **Nan Hua Temple** in South Africa needs accurate recording: on 8 March 1992 the **Bronkhorstspruit town council** signed over three hectares, immediately increased to six, with later accounts giving twelve or fourteen (Grade A, [Nan Hua Temple](https://www.nanhuatemple.org)). The circulating version usually says \"donated by the South African government,\" which does not match the record. The temple's performance troupe is properly named the Nan Hua Performing Arts Group, established in 2014 at Master Hsing Yun's instruction—not the \"Nan Hua dragon-lion troupe\" of circulating materials.\n>\n> The **\"Children of Tathāgata\"** education programme at **Templo Zu Lai** in Brazil was begun in 2003 by Ven. Juecheng at the temple in Cotia, São Paulo, and later established as a foundation with a learning centre. Its content includes after-school tutoring, moral education, music, football, and vocational training in carpentry, plumbing, and baking (Grade C, China News Service and Sin Chew Daily reports). The programme is not large, but its form is worth a look: it turned Buddhist compassion into something the surrounding society could recognise on sight—a boy from a favela learning a trade.\n\n### 东南亚与南亚\n\n在缅甸这样南传佛教占绝对优势的国家，汉传大乘僧伽——特别是比丘尼——通过在宗派边缘的位置重新协商自己的合法性。这是汉传与南传在同一片土地上长期共处的少数实例之一。\n\n需要同时说明的是，中日韩越之间的汉传互动，本报告因语种限制未能展开（见「研究说明·五」）。日本的黄檗宗、韩国的曹溪宗、越南的竹林禅派都是汉传法脉的分支，它们与华人汉传之间的关系，是一个重要而未及处理的题目。\n\n> **EN对应 · Southeast and South Asia**\n>\n> In countries where Theravāda holds overwhelming dominance, such as Myanmar, Chinese Mahāyāna monastics—nuns in particular—renegotiate their legitimacy from a position at the margins of the sectarian order. This is one of the few instances of Chinese and Theravāda Buddhism coexisting over the long term on the same soil.\n>\n> It must also be noted that interaction among Chinese-lineage Buddhism in China, Japan, Korea, and Vietnam could not be developed here, for the language limitations given in Section 5 of the Research Note. The Ōbaku school in Japan, the Jogye Order in Korea, and the Trúc Lâm tradition in Vietnam are all branches of the Chinese lineage; their relationship to Chinese Buddhism in Chinese-speaking communities is an important subject this report leaves untouched.\n\n---\n\n## 四、怎么走到今天的\n\n### 四段\n\n汉传佛教的全球传播大致可分四段。前两段的分期参照既有的台湾博士论文研究，后两段为本报告所补。\n\n**移民与血缘纽带**（19 世纪中叶至 20 世纪初）。汉传佛教作为华侨移民的精神寄托，以会馆、祖籍地寺院分支的形式存在，封闭、以丧葬仪式为主，与当地主流社会基本不相往来。\n\n**现代制度化与跨国网络**（20 世纪中叶至 20 世纪末）。随内战离散的僧俗把人世性质的佛教带到台港，再连接南洋与北美。此后进入以台湾教界为首、以人间佛教为旗帜的国际推展期。汉传佛教开始建立现代化、国际化的组织架构——大学、基金会、国际组织、多语出版。\n\n**文化／宗教外交期**（2006 年以来，判断）。以大陆官方主导的世界佛教论坛为标志，汉传佛教作为文化外交资源的角色凸显。\n\n**数字与 AI 期**（2020 年代以来，判断）。从单纯的\"上网\"转向知识基础设施建设，AI 成为结构性变量。这一段还在展开中，本报告第三部讨论。\n\n> **EN对应 · Four Phases**\n>\n> The global transmission of Chinese Buddhism falls roughly into four phases. The first two follow the periodization of an existing Taiwanese doctoral study; the latter two are added here.\n>\n> **Immigration and blood ties** (mid-nineteenth to early twentieth century). Chinese Buddhism served as the spiritual anchor of overseas Chinese immigrants, existing as guild-hall shrines and branch temples of ancestral places—closed, centred on funerary ritual, and largely out of contact with the surrounding society.\n>\n> **Modern institutionalization and transnational networks** (mid- to late twentieth century). Monastics and laypeople scattered by the civil war brought an engaged form of Buddhism to Taiwan and Hong Kong, and from there connected to Southeast Asia and North America. A period followed in which the Taiwanese Buddhist world led and Humanistic Buddhism served as the banner. Chinese Buddhism began building modern, international organizational structures—universities, foundations, international associations, multilingual publishing.\n>\n> **The cultural and religious diplomacy phase** (from 2006; judgment). Marked by the mainland-led World Buddhist Forum, during which Chinese Buddhism's role as a cultural diplomacy resource came to the fore.\n>\n> **The digital and AI phase** (from the 2020s; judgment). A shift from simply \"going online\" toward building knowledge infrastructure, with AI as a structural variable. This phase is still unfolding and is taken up in Part Three.\n\n### 五种范式\n\n把这几十年的实践归类，大致有五种。\n\n人间佛教网络范式，代表是佛光山与慈济，机制是现代道场加文化教育加慈善医疗，经社区服务与文化教育融入当地。典籍译传与律制修持范式，代表是法界佛教总会与佛经翻译委员会，机制是严格戒律加英文大藏经翻译出版，靠学术译经与严谨的僧伽生活建立权威，吸引的是西方本土知识分子与深修型信众。高等教育与学术建制范式，代表是西来大学、南天大学、法界佛教大学，经学位课程与国家教育体系认证进入主流学术界。公共外交与区域多边范式，代表是中国佛教协会与南海佛教深圳圆桌会，经多边会议、联合人道援助、高僧互访塑造宗教外交名片。入世正念与禅修创新范式，代表是梅村与西方禅修中心，经剥离复杂宗教仪式实现跨文化普及。\n\n入世佛教一支需要单说。一行禅师 1982 年于法国创立梅村传承，把汉传禅宗义理与西方心理学、生态主义接在一起，发展出「互即互入」（interbeing）与「五项正念修习」（Five Mindfulness Trainings）的全球形态（A 级，[Plum Village](https://plumvillage.org/de/die-funf-achtsamkeitsubungen)）。\n\n五种范式里，前四种的传播半径都受制于语言与人力；第五种的半径几乎无限。而它离汉传佛教本体最远。这个悖论留到第九章去说。\n\n> **EN对应 · Five Paradigms**\n>\n> Sorted, the practice of recent decades falls into five paradigms.\n>\n> The **Humanistic Buddhist network** paradigm, represented by Foguang Shan and Tzu Chi: modern temples plus cultural education plus charitable medicine, entering local society through community service and cultural programmes. The **textual translation and disciplined practice** paradigm, represented by the Dharma Realm Buddhist Association and its translation society: strict precepts plus English translation of the canon, authority built on scholarly translation and rigorous monastic life, attracting Western intellectuals and serious practitioners. The **higher education and academic institution** paradigm, represented by the University of the West, Nan Tien Institute, and Dharma Realm Buddhist University: degree programmes and national accreditation bringing Buddhism into mainstream academia. The **public diplomacy and regional multilateralism** paradigm, represented by the Buddhist Association of China and the South China Sea Buddhist Roundtable: multilateral conferences, joint humanitarian relief, and exchanges of senior monastics building a religious-diplomacy calling card. And the **engaged mindfulness and contemplative innovation** paradigm, represented by Plum Village and Western meditation centres: cross-cultural reach achieved by stripping away complex religious ritual.\n>\n> The Engaged Buddhism strand deserves separate mention. Thich Nhat Hanh founded the Plum Village tradition in France in 1982, joining Chinese Chan doctrine to Western psychology and ecology and developing the global form of \"interbeing\" and the Five Mindfulness Trainings (Grade A, [Plum Village](https://plumvillage.org/de/die-funf-achtsamkeitsubungen)).\n>\n> Among the five, the first four have a reach limited by language and personnel. The fifth has almost no limit at all—and stands furthest from the body of Chinese Buddhism. That paradox is taken up in Chapter Nine.\n\n---\n\n# 第二部　九处\n\n> 这一部谈病。谈病的目的是治病，所以每一处都尽量指出病在哪个环节，而不是停在\"有问题\"三个字上。具体案情、日期、金额，凡属细节者移入附录一。\n\n## 五、母体收缩：亲近与归属之间\n\n皮尤 2026 年 3 月 11 日《东亚佛教的近况》给了两个数字：日本与韩国\"自幼佛教徒\"中，分别有 40% 与 42% 现已无宗教归属（A 级，[Pew](https://www.pewresearch.org/religion/2026/03/11/buddhisms-recent-decline-in-east-asia/)）。两国的年轻人去寺庙、拜佛的比例，明显低于长辈。\n\n同时，在韩国、日本、台湾，无宗教者中至少三分之一对佛教\"生活方式\"有个人认同。\n\n这两组数字放在一起，勾出一个共同的形状：**亲近感还在，归属在流失。**\n\n汉传面临的主要风险，不是被别的宗教取代，是被世俗生活方式吸收。一个年轻人可以喜欢寺院的安静、认同素食、用\"随缘\"作口头禅、失眠时听诵经音频，却从不认为自己是佛教徒，也从不考虑皈依。他不反对，他只是——没有那个必要。\n\n于是问题落在具体的机制上：教理入门有没有？共修社群有没有？家庭传承断在哪里？这三样，恰好是汉传在海外的三处空缺。寺院的法会可以容纳一千人，但从\"来过一次\"到\"每周来\"的那道门槛，通常没人扶。\n\n> **EN对应 · 5. A Contracting Mother Body: Between Closeness and Belonging**\n>\n> Pew's report of 11 March 2026, *Buddhism's Recent Decline in East Asia*, gives two figures: 40 percent of those raised Buddhist in Japan and 42 percent in South Korea no longer claim any religion (Grade A, [Pew](https://www.pewresearch.org/religion/2026/03/11/buddhisms-recent-decline-in-east-asia/)). Young people in both countries visit temples and worship far less than their elders did.\n>\n> At the same time, at least a third of the religiously unaffiliated in Korea, Japan, and Taiwan express a personal affinity for Buddhism \"as a way of life.\"\n>\n> Set together, the two produce a single shape: **the closeness remains; the belonging drains away.**\n>\n> The chief risk facing Chinese Buddhism is not replacement by another religion. It is absorption by a secular way of life. A young person may like the quiet of a temple, approve of vegetarianism, use \"whatever comes, let it come\" as a verbal tic, listen to sutra chanting when unable to sleep—and never once consider himself a Buddhist, never once think of taking refuge. He is not opposed. He simply has no occasion to.\n>\n> So the problem lands on specific mechanisms: Is there an introduction to doctrine? Is there a community to practise with? Where did the family transmission break? These three are precisely the three gaps overseas. A dharma assembly can hold a thousand people, but the threshold between \"came once\" and \"comes every week\" is usually unattended.\n\n---\n\n## 六、治理公信\n\n这一节谈制度，不谈案情。\n\n近十年，汉传佛教界有两起事件对公信力的冲击最大。一起是 2018 年的学诚事件，一起是 2025 至 2026 年的释永信案。两案的经过、时间、金额与判决，本报告在附录一中如实记录，正文只取一个共同的结构性事实：**在两起事件中，问题的暴露都不是由教内监督机制完成的。**\n\n学诚案的起点是两名前僧人的举报材料；释永信的相关指控早在 2015 年就已由内部人士公开。也就是说，在长达数年的时间里，教内的监督机制未能有效运转，最终是由外部力量（举报外流、官方调查、司法程序）推动了处理。这不是两起孤立的道德事故，而是一个制度信号。（判断）\n\n这类事件对宗教组织的杀伤力，比对外部观察者所预想的更大，原因是它同时击中三重合法性：**戒律（教内承认的）、财务透明（现代公益承认的）、官方背书（政治承认的）。** 平常三重合法性互相支撑，一出事则同时受损，且互相拖累——信众想到的是\"连戒都守不住\"，社会想到的是\"钱去哪了\"，官方想到的是\"我给你背书你却出事\"。\n\n对海外传播而言，成本是具体的。海外道场要进入当地社会，需要的是信任；信任的建立需要二十年，摧毁需要一次头条。而海外华人社群的信息传播网络，恰恰比国内更依赖口耳相传与社群媒体——**坏消息在海外传得更快，不是更慢。**\n\n应当承认，制度补课在教内并非没有讨论。2020 年 12 月的中国佛教协会第十次全国代表会议通过了章程修订，明确\"抵制商业化不良影响\"；2025 年 12 月佛协召开教育活动推进会，强调严肃处理违规犯戒行为（C 级，[中新网](http://www.chinanews.com.cn/gn/2020/12-02/9352528.shtml)）。方向是清楚的，难点在落地方式：财务审计披露、独立申诉渠道、住持任期与交棒机制、董事会或多住持制——这些在现代非营利组织里是常规，在汉传丛林制度里却没有现成的对应物。\n\n这也就意味着，汉传要补的不是\"学西方\"，而是**把丛林制度里本来就有的东西（羯磨、揭露、僧团议事）在现代组织条件下重新长出来**。（判断）\n\n> **EN对应 · 6. Governance Credibility**\n>\n> This section concerns institutions, not cases.\n>\n> Two events in the past decade have done the most damage to Chinese Buddhist credibility: the Xue Cheng affair of 2018, and the Shi Yongxin case of 2025–2026. Their course, dates, amounts, and judgments are recorded faithfully in Appendix One; the main text takes from them only one shared structural fact: **in neither case was the problem brought to light by an internal oversight mechanism.**\n>\n> The Xue Cheng affair began with a report filed by two former monastics; the allegations against Shi Yongxin had been made public by insiders as early as 2015. Over a period of years, the internal oversight mechanism did not function effectively, and the handling was ultimately driven by outside forces—leaked reports, official investigation, judicial process. These are not two isolated moral accidents. They are one institutional signal. (Judgment)\n>\n> Such events wound a religious organization more deeply than outside observers expect, because they strike three legitimacies at once: **precepts** (recognized within the religion), **financial transparency** (recognized by modern philanthropy), and **official endorsement** (recognized politically). Ordinarily the three support one another; in a scandal they are damaged together and drag each other down. The faithful think, \"he could not even keep the precepts.\" Society thinks, \"where did the money go?\" Officialdom thinks, \"I endorsed you and you failed.\"\n>\n> For overseas transmission the cost is concrete. An overseas temple seeking entry into local society needs trust; trust takes twenty years to build and one headline to destroy. And information in overseas Chinese communities travels more through word of mouth and social media than it does at home—**bad news travels faster abroad, not slower.**\n>\n> It should be acknowledged that institutional remedies are under discussion within the Buddhist world. The Buddhist Association of China's Tenth National Congress in December 2020 adopted revised statutes explicitly opposing \"the harmful effects of commercialization\"; in December 2025 the Association convened a meeting on education to stress serious handling of violations (Grade C, [China News Service](http://www.chinanews.com.cn/gn/2020/12-02/9352528.shtml)). The direction is clear. The difficulty is implementation: audited financial disclosure, independent grievance channels, term limits and succession mechanisms for abbots, boards or multi-abbot arrangements. These are routine in modern non-profits and have no ready counterpart in the Chinese monastic system.\n>\n> Which means what Chinese Buddhism needs to add is not \"what the West does.\" It is to **regrow, under modern organizational conditions, what the monastic system already contained—karma-vācā (羯磨), disclosure before the assembly, and communal deliberation.** (Judgment)\n\n---\n\n## 七、政治耦合与跨境信任成本\n\n宗教组织的跨国可信度，很大程度上取决于它看起来有多\"非国家\"。这是台湾系教团在海外的结构性优势，也是大陆体系需要弥补的短板。（判断）\n\n2026 年有学术研究比较了中印两国对佛教外交的运用，认为两国在南亚与东南亚的佛教外交不只是文化交流，还关乎区域秩序与影响力竞争（B 级，Raj 等，*Frontiers in Political Science* 8, 2026）。同一时期还有分析指出，2025 年 5 至 6 月印度向越南出借佛陀圣物，吸引近 1500 万信众；中国则把佛教外交编入\"一带一路\"，并提出\"南海佛教\"作为共享遗产；分析者并称中国因达赖喇嘛问题缺席了 2011 年与 2023 年印度主办的全球佛教活动。这些论述属于分析者观点，本报告如实标注为 B 级学术来源与分析性判断，不作为事实陈述。\n\n台湾系教团虽是民间身份，也难免政治化。美联社曾报道星云大师与政界联系密切、倡导两岸交流，因此被部分人视为统一倡导者，而他本人与各党派均保持关系。\n\n地缘现实绕不开，这是必须承认的。但这里有一个常被忽略的区分：**佛教的跨宗教、跨传统合作，与佛教作为国家外交工具，是两件事，而它们在国际场合经常被混为一谈——这种混淆对双方都不利。**（判断）对大陆体系而言，混淆会持续抬高其海外信任成本；对台湾系教团而言，被误读为工具，会损耗其数十年积累的民间信誉。\n\n> **EN对应 · 7. Political Entanglement and the Cost of Cross-Border Trust**\n>\n> The transnational credibility of a religious organization depends heavily on how non-state it appears to be. This is the structural advantage Taiwanese orders enjoy overseas, and the shortfall the mainland system must make up. (Judgment)\n>\n> A 2026 academic study comparing how India and China use Buddhist diplomacy argues that such diplomacy in South and Southeast Asia is not merely cultural exchange but concerns regional order and competition for influence (Grade B, Raj et al., *Frontiers in Political Science* 8, 2026). Analysis from the same period notes that India lent relics of the Buddha to Vietnam in May–June 2025, drawing nearly 15 million devotees, while China incorporated Buddhist diplomacy into the Belt and Road and proposed \"South China Sea Buddhism\" as shared heritage; the analysis further states that China was absent from globally oriented Buddhist events hosted by India in 2011 and 2023 because of the Dalai Lama question. These are the analysts' arguments, and this report marks them as Grade B academic sources and analytical judgments rather than statements of fact.\n>\n> Taiwanese orders, though civilian in status, are not immune to politicization. The Associated Press has reported that Master Hsing Yun maintained close ties with political figures and advocated cross-strait exchange, leading some to regard him as a pro-unification advocate; he himself kept relations with all parties.\n>\n> The geopolitical reality cannot be avoided, and that must be acknowledged. But one distinction is regularly overlooked: **interreligious and inter-traditional cooperation among Buddhists, and Buddhism as an instrument of state diplomacy, are two different things—and in international settings they are constantly conflated, to the detriment of both.** (Judgment) For the mainland system, the conflation keeps raising the cost of overseas trust. For Taiwanese orders, being misread as an instrument erodes civilian credibility built over decades.\n\n---\n\n## 八、语言、人才与本土化\n\n这是四件事里最实在的一件。\n\n**教内的一手调研**：一位在佛光山澳洲、美国道场服务近二十年的法师，曾问卷调查佛光山美国各分院的出家众，发现：西方人士接受度近五年有所增长；中华文化活动与禅修是吸引本地人入寺的最佳方便；弘法人员最缺外语能力；中西文化差异是本土化的最大困难之一。这是小样本自陈数据，不可外推，但方向与其它材料一致。\n\n**二代问题**：亚裔美国佛教徒中美国出生者仅 20%，低于亚裔整体的 32%。21% 的亚裔佛教徒选择用非英语问卷作答。Chenxing Han 访谈 80 位年轻亚裔美国佛教徒后指出，\"东方和尚\"\"迷信的移民\"等刻板印象使这一群体被边缘化（B 级，*Be the Refuge*）。\n\n**创始人时代的终结**：圣严 2009 年、惟觉 2016 年、星云 2023 年相继圆寂，证严已近九十岁。未来十年的关键问题是：组织能否脱离个人魅力持续运转。（判断）\n\n**中国佛教协会 2017 年两会上**，星云大师说过一段话，被视为汉传本土化最直接的依据：印度僧人来华多从事翻译，寺院建设交给中国僧人；若不融入当地文化、培养本地弟子，便没有今日的中国佛教。佛光山的本土化框架包括尊重包容、经典翻译、宣教人员本土化、伦理理念本土化、内容与方式多样化。\n\n这段话的逻辑是：**汉传自己就是本土化的产物，所以没有理由认为它在别处不能本土化。** 这个论证很有力，但它有一个前提常被忽略——汉传当年之所以能本土化，是因为有鸠摩罗什、真谛、玄奘、义净这样一批人，用几百年的时间译经、注疏、建立教学体系。**翻译、本地弟子、社会支持，三样缺一不可。** 当代海外传播恰恰缺前两样。\n\n海外道场外语人才的短缺，不是\"多招几个会英语的\"能解决的。它要求的是：一个能产生高水平双语僧才的教育体系，而这个体系目前只在零星的地方存在（见第二十八章关于学修次第的讨论）。\n\n> **EN对应 · 8. Language, Personnel, and Localization**\n>\n> This is the most concrete of the four.\n>\n> **First-hand research from within the order**: a monastic who served nearly twenty years in Foguang Shan temples in Australia and the United States surveyed ordained members of Foguang Shan's American branch temples and found that Western acceptance had grown over the previous five years; that Chinese cultural activities and meditation were the most effective means of drawing local people into temples; that the greatest shortfall among those who teach the dharma was foreign-language ability; and that East–West cultural difference was one of the chief obstacles to localization. This is small-sample self-reported data and cannot be generalized, but it points in the same direction as other materials.\n>\n> **The second-generation problem**: only 20 percent of Asian American Buddhists were born in the United States, against 32 percent of Asian Americans as a whole, and 21 percent of Asian American Buddhists chose to answer questionnaires in a language other than English. Chenxing Han, after interviewing eighty young Asian American Buddhists, reports that stereotypes—\"the oriental monk,\" \"the superstitious immigrant\"—push this group to the margins (Grade B, *Be the Refuge*).\n>\n> **The end of the founder era**: Sheng Yen died in 2009, Weijue in 2016, Hsing Yun in 2023, and Cheng Yen is nearly ninety. The key question for the coming decade is whether these organizations can run without the personal charisma of a founder. (Judgment)\n>\n> Master Hsing Yun made an argument at the 2017 sessions that is often cited as the most direct warrant for localization: Indian monks who came to China mostly did translation work, and the building of temples was left to Chinese monks; had they not merged into the local culture and trained local disciples, there would be no Chinese Buddhism today. Foguang Shan's localization framework includes respect and tolerance, canonical translation, localization of teaching personnel, localization of ethical concepts, and diversification of content and method.\n>\n> The logic runs thus: **Chinese Buddhism is itself the product of localization, so there is no reason to think it cannot localize elsewhere.** The argument is strong, but it rests on a premise that is often overlooked. Chinese Buddhism localized because it had Kumārajīva, Paramārtha, Xuanzang, and Yijing—men who spent centuries translating, annotating, and building teaching systems. **Translation, local disciples, and social support: all three were necessary.** Contemporary overseas transmission lacks the first two.\n>\n> The shortage of foreign-language talent in overseas temples is not solved by \"hiring a few more English speakers.\" It requires an educational system capable of producing high-level bilingual monastics—and at present that system exists only in isolated places (see the discussion of study sequences in Chapter Twenty-Nine).\n\n---\n\n## 九、产品错位：Zen 品牌的遮蔽\n\n法界佛教总会的一篇文章曾指出：铃木大拙的著作深刻影响了西方知识界，但也使人们把佛教主要理解为坐禅，少涉教义、仪式、戒律与道德，这种印象在美国至今存在。\n\n本文的判断是：汉传的强项——净土念佛、忏仪法会、丛林与戒律、人间佛教的社会服务——与西方\"佛教现代主义\"（以冥想、心理、伦理为主）的接口存在错位。而实际的入口往往是\"中华文化活动 + 禅修\"（见第八章）。目前没有按传统分层的系统数据，这一判断依据的是学界共识与个案。（判断）\n\n这一错位的深层机制值得说清楚，因为它决定了后面的策略。西方现代佛教的形成，本身就是一次筛选：它从亚洲各传统中挑选了那些与启蒙理性、个人主义、去仪式化相兼容的部分——冥想（可私人实践）、心理（可科学化）、伦理（可世俗化），并搁置了那些不相容的部分——仪式、戒律、僧团、轮回、功德。\n\n**被挑中的那些，恰恰是汉传最不以其立身的；被搁置的那些，恰恰是汉传最完整的。**（判断）藏传因为有一套完整可讲解的学修次第（五部大论）而进入了西方精英学术与高端修行市场；南传因为有一套清晰可操作的禅修技术（内观）而占据了西方大众禅修市场。汉传手里最成熟的是\"完整形态\"——戒定慧一体、解行并重、僧俗共住——而\"完整形态\"在西方恰恰是最难出售的产品。\n\n于是汉传在西方处于一个尴尬位置：论个人冥想，它不如南传直接；论学术体系，它不如藏传成建制；论社会参与，它做得极好（慈济、佛光山），却常被归类为\"慈善组织\"而非\"佛教传统\"。\n\n**错位不是产品不好，是接口不对。** 而接口是可以改的——这正是第二十六章与第三十章要谈的。\n\n> **EN对应 · 9. Product Mismatch: How the Zen Brand Obscures**\n>\n> An article from the Dharma Realm Buddhist Association made this point: D.T. Suzuki's writings deeply influenced the Western intelligentsia, but they also led people to understand Buddhism primarily as seated meditation, with little attention to doctrine, ritual, precepts, or ethics—an impression that persists in America today.\n>\n> This report's judgment is that the strengths of Chinese Buddhism—Pure Land recitation, repentance liturgies, monastic discipline, the social service of Humanistic Buddhism—mismatch the interface of Western \"Buddhist modernism,\" which centres on meditation, psychology, and ethics. The actual point of entry tends to be \"Chinese cultural activity plus meditation\" (see Chapter Eight). No systematic data disaggregated by tradition exists; this judgment rests on scholarly consensus and individual cases. (Judgment)\n>\n> The deeper mechanism of the mismatch deserves stating, because it determines what follows. The formation of Western modern Buddhism was itself a process of selection. It chose from Asian traditions those elements compatible with Enlightenment rationality, individualism, and de-ritualization—meditation (privately practicable), psychology (scientizable), ethics (secularizable)—and set aside those that were not: ritual, precepts, monasticism, rebirth, merit.\n>\n> **What was selected is precisely what Chinese Buddhism least rests on. What was set aside is precisely what Chinese Buddhism holds most completely.** (Judgment) Tibetan Buddhism entered Western elite academia and the high-end practice market because it has a fully articulated study sequence (the five great treatises). Theravāda captured the Western mass meditation market because it has a clear, operable technique (vipassanā). What Chinese Buddhism holds in its most mature form is the \"complete shape\"—precepts, concentration, and wisdom as one; study and practice together; monastics and laity cohabiting—and the complete shape is the hardest product to sell in the West.\n>\n> Hence an awkward position: in personal meditation, Chinese Buddhism is less direct than Theravāda; in scholastic system, less institutional than Tibetan; in social engagement, it excels (Tzu Chi, Foguang Shan) yet is often classified as a charitable organization rather than a Buddhist tradition.\n>\n> **The mismatch is not that the product is poor. It is that the interface is wrong.** And interfaces can be changed—which is what Chapters Twenty-Seven and Thirty take up.\n\n---\n\n## 十、典籍与概念的可及性赤字\n\nBDK 完成度约 65%（见第二章），且不是汉传教团主导。汉传教团自己的补位——佛经翻译委员会与佛光山术语库——都是局部工程。CBETA 4,899 部典籍，绝大多数没有英译；有英译的，多数出自非汉传机构。\n\n这里有一个必须承认的事实：**至今不存在一份权威、公开、可审计的\"汉文佛典英译覆盖率\"统计。** 没有这把尺子，翻译规划就无法排序——先译什么、后译什么、哪些已有多个译本、哪些急需重译，全都只能凭感觉。\n\n可及性赤字还有一层更容易被忽略：**概念的可及性。** 汉传的核心概念——如来藏、真如、无住生心、圆融三谛、事事无碍——深度植根于中国传统的阴阳、玄学与儒家的语境中。把这些译成西方语言，遇到的问题不只是找不到对应的词，而是**找不到对应的思想框架**。目前全球范围内没有一套被广泛公认的汉传术语英译体系，许多翻译借用西方哲学或天主教神学术语，造成义理失真。\n\n这两层赤字合起来，构成了汉传海外传播最深的一道坎：**典籍译不出来，概念说不清楚，于是\"汉传佛教究竟是什么\"这个问题，在海外长期没有令人满意的答案。**（判断）而这个答案的空缺，恰好由第九节所说的\"Zen 品牌\"填上了——一个简化的、可消费的、去教团化的替代答案。\n\n> **EN对应 · 10. The Deficit in Access to Texts and Concepts**\n>\n> BDK stands at about 65 percent completion (see Chapter Two), and it is not led by a Chinese Buddhist order. Chinese Buddhist orders' own efforts—the Buddhist Text Translation Society and Foguang Shan's terminology system—are local projects. Of CBETA's 4,899 titles, the overwhelming majority have no English translation; of those that do, most were produced by non-Chinese Buddhist institutions.\n>\n> One fact must be acknowledged: **there exists no authoritative, public, auditable statistic for the English translation coverage of the Chinese Buddhist canon.** Without that ruler, translation planning cannot be prioritized—what to translate first, what later, which texts already have multiple versions, which urgently need retranslation—all of it can only be guessed at.\n>\n> The access deficit has a second layer that is more easily overlooked: **access to concepts.** The core concepts of Chinese Buddhism—tathāgatagarbha, suchness, non-abiding mind, the threefold truth in perfect fusion, unobstructed interpenetration of phenomena—are deeply rooted in the contexts of Chinese yin-yang cosmology, Dark Learning, and Confucianism. Translating them into Western languages encounters not merely a shortage of corresponding words but **a shortage of corresponding intellectual frameworks.** No widely recognized system for rendering Chinese Buddhist terminology into English exists; many translations borrow from Western philosophy or Catholic theology, distorting the doctrine.\n>\n> Together, the two layers form the deepest ditch in the path of overseas transmission: **the texts cannot be translated, the concepts cannot be explained, and so the question \"what is Chinese Buddhism, actually?\" has long gone without a satisfactory answer abroad.** (Judgment) And the vacancy left by that missing answer has been filled by precisely what Chapter Nine described—the Zen brand: a simplified, consumable, de-institutionalized substitute.\n\n---\n\n## 十一、商业化与精神稀释\n\n大陆寺庙商业化的问题，媒体讨论已久：门票过高、香火价格虚高、纪念品过度销售，以及\"佛教精神是否被腐蚀\"的质疑。政府已出台限价、禁止强制捐赠等措施。\n\n少林寺是一个极端样本：它把禅武文化做成了国际品牌，代价是\"CEO 和尚\"这样的标签，以及第二章所述的澳洲购地案所引发的持续争议。少林模式的教训不在于\"不该做文化输出\"，而在于**当一个宗教品牌的价值主要由其商业估值定义时，它就失去了对自身叙事的控制权。**\n\n同时也要看到另一面。青年\"寺庙热\"是真实的：携程数据显示 2023 年 2 月寺庙订票同比增 310%，订票者近半为 90 后、00 后（C 级，[证券时报](https://stcn.com/article/detail/826023.html)；注：该数字的统计窗口为\"今年以来\"，非单月）。《环球时报》的采访发现动机混杂，并非出于信仰。2025 年底的观察也认为，佛教在中国更多呈现为生活方式与身心疗愈，而非宗教。目前没有证据显示这波热潮已转化为身份认同（CGSS 2021 仍为 4%）。（判断）\n\n**这波热潮是资产还是负债，取决于有没有接得住的人。** 一个年轻人因为拍照好看走进寺院，如果他走出来时只带走一张照片，那是一次消费；如果他在门口被人递上一本讲得明白的小册子，或者被告知每周三晚上有一个给初学者的共修，那可
