  var NAMES = Object.keys(MAP).sort(function(a,b){return b.length-a.length;});
  var BASE = '../famai/shanhe.html';
  function skip(node){
    var p = node.parentElement;
    while(p && p !== document.body){
      var tag = p.tagName;
      if(tag==='A'||tag==='CODE'||tag==='PRE'||tag==='BLOCKQUOTE') return true;
      var cls = p.getAttribute ? (p.getAttribute('class')||'') : '';
      if(/\b(q|quote|cite-card|lic)\b/.test(cls)) return true;
      p = p.parentElement;
    }
    return false;
  }
  function linkify(){
    var root = document.getElementById('article-root');
    if(!root) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var edits = [];
    var tn;
    while((tn = walker.nextNode())){
      if(skip(tn)) continue;
      var text = tn.textContent;
      for(var i=0;i<NAMES.length;i++){
        var nm = NAMES[i], pos = text.indexOf(nm);
        if(pos < 0) continue;
        edits.push({node:tn, name:nm, pid:MAP[nm], pos:pos});
        break;
      }
    }
    for(var j=edits.length-1;j>=0;j--){
      var e = edits[j];
      var t = e.node.textContent;
      var idx = t.indexOf(e.name);
      if(idx < 0) continue;
      var before = t.slice(0, idx), after = t.slice(idx + e.name.length);

      frag.appendChild(a);
      if(after) frag.appendChild(document.createTextNode(after));
      e.node.parentNode.replaceChild(frag, e.node);
    }
    if(edits.length) console.log('[lin-deeplink] linked %d mentions' % edits.length);
  }
  if(document.readyState==='complete') setTimeout(linkify,100);
  else window.addEventListener('load', function(){ setTimeout(linkify,100); });
})();
</script>

及諸眾生種種心量、種種信解、種種智慧、種種言辭、種種名字、種種證得、種種地位、種種根清淨、種種意方便、種種心境界、種種依止，如來功德隨能聽受諸所說法，顯示如來往昔趣求一切智道、往昔所起菩薩大願、往昔所淨諸波羅蜜、往昔所證諸菩薩地、往昔圓滿諸菩薩行、往昔所乘智莊嚴道、往昔所行諸清淨道、往昔出離殊勝法海、往昔所起遊戲神通大莊嚴海、往昔所集無量本事相應行海，及遍顯示如來現前成正覺門神通智海、如來自在轉法輪海、如來神通淨佛剎海、如來調伏一切眾生巧方便海、如來開示一切智城、如來顯示諸眾生道、如來善入一切眾生生死之處、如來普為一切眾生最上福田、如來普為一切眾生說施功德、如來所記一切眾生種種心行、如來普為一切眾生演說教誡、如來能以三昧神通現眾影像，如是等法唯垂大悲普為開演。」爾時，世尊知諸菩薩一切大眾心之所念，大悲為身、大悲為門、大悲為首，以大悲法而為方便，充滿虛空遍周法界，入於師子頻申三昧；入三昧已，一切世間普皆嚴淨。于時，此大莊嚴樓閣忽然之間高廣嚴麗遍周法界；金剛為地眾寶嚴飾，如意寶網無能勝幢列布其中，無數寶華及眾摩尼普散其上，一切寶聚處處盈滿，毘瑠璃寶以為其柱，光明照世；摩尼寶王以用莊嚴，閻浮檀金及諸摩尼周遍嚴飾，一切眾寶門、闥、窓、牖含輝交映，相望間列，階、墀、軒、檻一切皆以妙寶莊嚴，奇形異像如諸世主一切眾生種種相海，摩尼寶網以覆其上，於諸門側悉建幢幡，一一嚴事，各各流光遍周法界；於樓閣外階砌欄楯其數無量不可稱說，靡不咸以摩尼所成，眾雜妙寶周遍校飾。爾時，復以佛神力故，令逝多林忽然廣博，與不可說佛剎極微塵數諸佛世界其量正等，一切妙寶間錯莊嚴；以不可說寶莊嚴其地，無數摩尼寶以為垣牆，寶多羅樹莊嚴行列其間。復有無量香河香水盈滿湍激洄澓；一切寶華隨流右轉演出一切佛法音聲，不思議寶芬陀利華菡萏芬敷；一切妙寶、波頭摩華，鮮榮布濩；不思議數妙寶華樹高顯榮茂列植其岸；不思議數種種雜寶、臺榭、樓觀於其岸上次第行列，摩尼寶網之所彌覆。阿僧祇摩尼寶放大光明，阿僧祇眾雜妙寶莊嚴其地，蘊眾香藏騰出香雲香，氣氛氳普熏法界。復建無量種種寶幢，所謂：無量寶香幢、無量寶衣幢、無量寶幡幢、無量寶繒幢、無量寶華幢、無量寶瓔珞幢、無量寶鬘幢、無量寶鈴幢、無量威德寶網幢、無量摩尼寶王傘蓋幢、無量光明普照摩尼王幢、無量出一切如來名號圓滿音聲摩尼王幢、無量師子遊步摩尼王幢、無量說一切如來本事相應行海摩尼王幢、無量普現法界差別影像摩尼王幢、如是一切諸妙寶幢周遍十方，處處嚴飾。爾時，逝多林上虛空之中有不思議天寶宮殿諸樓閣雲；復有無數香樹雲、不可說須彌山雲、不可說妓樂雲、出美妙音歌讚如來，不可說寶蓮華雲遍覆莊嚴，不可說寶師子座雲、敷以天衣菩薩坐上歎佛功德，不可說天王形像摩尼寶雲、不可說白真珠雲、不可說赤真珠寶樓閣雲遍覆莊嚴、不可說一切堅固金剛珠雲雨莊嚴具，如是一切寶莊嚴雲皆悉盡於虛空法界周遍嚴飾。何以故？如來所種清淨善根不思議故，如來所成白淨法聚不思議故，如來威力祕密加持不思議故，如來神變能以一身普遍一切諸佛世界不思議故，如來能以神力普令十方一切諸佛及佛國土皆入其身不思議故，如來能於一極微塵中普現一切差別世界不思議故，如來能於一一毛端現過去際一切諸佛出興次第不思議故，如來能於一一毛孔放大光明一一光明悉能顯照一切世界不思議故，如來能於一一毛孔出一切佛剎極微塵數變化雲充滿一切諸佛剎土不思議故，如來能於一一毛孔普現十方一切世界成、住、壞劫不思議故；如於此逝多林給孤獨園見佛國土清淨莊嚴，如是十方盡法界、虛空界、一切世界亦如是見。所謂：見如來身遍逝多林，菩薩眾會各各圓滿；見普雨一切莊嚴具雲，莊嚴建立；見普雨一切寶威力光明雲，照曜法界；見普雨一切摩尼寶雲，周遍莊嚴；見普雨一切莊嚴蓋雲，覆一切剎；見普雨一切天身變化雲，皆妙嚴飾；見普雨一切華樹雲，其華開敷猶如海藏；見普雨一切繒綵雲，盤旋宛轉；見普雨一切衣服雲，繽紛而下；見普雨一切華鬘瓔珞雲，相續不絕；見普雨一切燒香雲，其形旋轉如眾生身；見普雨一切妙寶華網雲，周遍莊嚴、相續不斷；見普雨一切末香雲，香氣周流彌布十方；見普雨一切眾寶幢幡雲，天女執持，周旋空界；見普雨一切寶蓋雲，其蓋周圓眾寶所成微妙蓮華莊嚴其上，流出樂音聲聞法界；見普雨一切寶師子座雲，如諸眾生所有形像，雜寶鬘網瓔珞莊嚴。爾時，毘盧遮那如來住此師子頻申三昧，即時東方過不可說佛剎極微塵數世界海，外有世界海名金沙燈雲幢，佛號毘盧遮那吉祥威德王；於彼如來大眾海中有菩薩摩訶薩名毘盧遮那焰願藏光明，與不可說佛剎極微塵數諸菩薩俱，受彼佛教；從彼佛土道場眾海而來，向此娑婆世界毘盧遮那佛所，悉以神力出興種種諸供養雲；所謂：天華雲、天香雲、天寶蓮華雲、天鬘雲、天寶雲、天瓔珞環釧雲、天寶蓋雲、天妙衣雲、天寶幢幡雲、天一切妙寶莊嚴具雲，皆悉充滿虛空法界；既至佛所，頂禮佛足以為供養；修敬畢已，即於東方化作寶莊嚴樓閣，摩尼寶網彌覆其上；於樓閣中化作光照十方摩尼寶王大蓮華藏師子之座，諸菩薩眾各於其上，結跏趺坐，以大如意摩尼寶網羅覆其身。南方過不可說佛剎極微塵數世界海，外有世界海名金剛海藏，佛號普光遍照吉祥藏王；於彼如來大眾海中，有菩薩摩訶薩名難摧伏速疾精進王，與不可說世界海極微塵數諸菩薩俱，從彼佛會向如來所，悉以神力齎持種種微妙寶鬘諸供養具，交絡莊嚴；所謂：持一切妙寶香華鬘、持一切妙寶輪網鬘、持一切寶華瓔珞鬘、持一切金剛寶瓔珞鬘、持一切摩尼寶網鬘、持一切諸寶繒綵鬘、持一切寶形像瓔珞鬘、持一切出現吉祥光摩尼寶瓔珞鬘、持一切毘盧遮那摩尼莊嚴寶網鬘、持一切師子遊步摩尼寶瓔珞網鬘，悉以神力充滿一切諸世界海，既至佛所，頂禮佛足以為供養；修敬畢已，即於南方化作毘盧遮那眾寶莊嚴勝妙樓閣，摩尼寶網彌覆其上；於樓閣中化作普照十方摩尼寶蓮華藏師子之座，諸菩薩眾各於其上結跏趺坐，以天拘蘇摩妙寶華網羅覆其身。西方過不可說佛剎極微塵數世界海，外有世界海名須彌山幢毘盧遮那摩尼寶燈，佛號法界智燈王；於彼如來大眾海中，有菩薩摩訶薩名普遍出生吉祥威德王，與不可說世界海極微塵數諸菩薩俱，從彼佛會向如來所，悉以神力出興種種須彌山雲；所謂：不可說佛剎極微塵數種種色幢須彌山雲；不可說佛剎極微塵數種種色塗香、燒香、末香須彌山雲；不可說佛剎極微塵數種種色金光莊嚴摩尼寶王眾妙資具須彌山雲；不可說佛剎極微塵數種種焰光圓滿莊嚴星宿幢須彌山雲；不可說佛剎極微塵數種種妙色金剛月藏摩尼寶王莊嚴境界須彌山雲；不可說佛剎極微塵數種種光明普照法界，閻浮檀金摩尼王幢須彌山雲；不可說佛剎極微塵數種種法界差別，光明普照一切摩尼王幢須彌山雲；不可說佛剎極微塵數一切如來差別相好摩尼寶王須彌山雲；不可說佛剎極微塵數一切如來本所修行諸菩薩行本事因緣相應行海微妙音聲摩尼王幢須彌山雲；不可說佛剎極微塵數一切如來遍坐道場摩尼寶王須彌山雲；一一充滿虛空法界；既至佛所，頂禮佛足以為供養；修敬畢已，即於西方化作一切香王樓閣，真珠寶網彌覆其上；於樓閣中化作種種因陀羅差別光幢摩尼寶王妙蓮華藏師子之座，諸菩薩眾各於其上結跏趺坐，冠以如意摩尼寶冠，以妙色差別摩尼珠網羅覆其身。北方過不可說佛剎極微塵數世界海，外有世界海名寶衣光焰幢，佛號吉祥大光明遍照一切虛空法界；於彼如來大眾海中，有菩薩摩訶薩名無礙吉祥勝藏王，與不可說世界海極微塵數諸菩薩俱，從彼佛會向如來所，悉以神力出興一切妙寶衣雲，周遍莊嚴盡虛空界；所謂：黃色光明摩尼寶王衣雲、種種香熏摩尼寶王衣雲、淨妙日幢摩尼寶王衣雲、金焰熾盛吉祥光照摩尼寶王衣雲、雜寶流光摩尼寶王衣雲、一切上妙星宿形像摩尼寶王衣雲、白玉光焰因陀羅網摩尼寶王衣雲、毘盧遮那殊勝赫奕吉祥光焰摩尼寶王衣雲、光照諸境能令十方一切法界皆出光明互相涉入毘盧遮那摩尼寶王衣雲、大海莊嚴摩尼寶王衣雲，如是等雲一一充滿虛空法界；既至佛所，頂禮佛足以為供養。修敬畢已，即於北方化作大海出生摩尼寶王樓閣，及毘瑠璃寶勝蓮華藏師子之座，諸菩薩眾各於其上結跏趺坐，以星宿幢妙莊嚴藏摩尼寶王為髻明珠，以師子遊步妙威德王摩尼寶網羅覆其身。東北方過不可說佛剎極微塵數世界海，外有世界海名一切大地王，佛號放寶光網遍照法界無相眼；於彼如來大眾海中，有菩薩摩訶薩名妙變化遍法界願月王；與不可說世界海極微塵數諸菩薩俱，從彼佛會向如來所，悉以神力化作種種妙寶嚴飾諸樓閣雲；所謂：現一切寶幢樓閣雲、現一切香王樓閣雲、現一切燒香樓閣雲、現一切白栴檀香樓閣雲、現一切拘蘇摩花樓閣雲、現一切摩尼寶王樓閣雲、現一切金剛寶王樓閣雲、現一切閻浮檀金樓閣雲、現一切繒綵衣服樓閣雲、現一切眾妙蓮華樓閣雲，如是等雲一一彌覆虛空法界；既至佛所，頂禮佛足以為供養；修敬畢已，即於東北方化作一切法界門妙寶山峯摩尼寶王樓閣，及無比香王摩尼寶蓮華藏師子之座，諸菩薩眾各於其上結跏趺坐，冠以種種雜色摩尼寶王妙莊嚴冠，以拘蘇摩華如意寶網羅覆其身。東南方過不可說佛剎極微塵數世界海，外有世界海名香雲莊嚴幢，佛號龍自在王；於彼如來大眾海中，有菩薩摩訶薩名法慧光明威德王，與不可說世界海極微塵數諸菩薩俱，從彼佛會向如來所，悉以神力出興種種上妙寶色圓滿光明雲；所謂：金色幢圓滿光明雲、無量寶色圓滿光明雲、如來頂髻色圓滿光明雲、如來眉間毫相色圓滿光明雲、種種寶色圓滿光明雲、蓮華藏色圓滿光明雲、寶樹垂枝色圓滿光明雲、摩尼寶王色圓滿光明雲、閻浮檀金色圓滿光明雲、日月星宿色圓滿光明雲，如是等雲一一充滿虛空法界；既至佛所，頂禮佛足以為供養；修敬畢已，即於東南方化作離垢摩尼拘蘇摩華毘盧遮那吉祥摩尼寶王樓閣，及金剛摩尼寶蓮華藏師子之座，諸菩薩眾各於其上結跏趺坐，以眾寶光焰摩尼王網羅覆其身。西南方過不可說佛剎極微塵數世界海，外有世界海名日藏光明摩尼寶王，佛號普智光照法月王；於彼如來大眾海中，有菩薩摩訶薩名摧碎一切魔力智幢王，與不可說世界海極微塵數諸菩薩俱，從彼佛會向如來所，於一切毛孔出等虛空界種種焰雲；所謂：拘蘇摩華寶焰雲、種種音樂寶焰雲、一切色寶焰雲、金剛寶焰雲、種種香熏眾寶衣焰雲、如龍電光寶焰雲、毘盧遮那摩尼寶焰雲、騰輝摩尼寶焰雲、吉祥熾盛光藏摩尼寶焰雲、等三世如來普光教海摩尼寶焰雲，如是等雲一一皆從毛孔中出，遍虛空界；既至佛所，頂禮佛足以為供養；修敬畢已，即於西南方化作一念普現十方法界種種光明摩尼寶王樓閣，及香焰燈光摩尼寶王勝蓮華藏師子之座，諸菩薩眾各於其上結跏趺坐，以離垢藏摩尼寶王妙光明網羅覆其身。西北方過不可說佛剎極微塵數世界海，外有世界海名毘盧遮那願藏，佛號普光遍照須彌山王；於彼如來大眾海中，有菩薩摩訶薩名毘盧遮那願智星宿幢，與不可說世界海極微塵數諸菩薩俱，從彼佛會向如來所，於念念中各於其身一切相好、一切肢分、一切毛孔一一皆出三世一切諸影像雲；所謂：出一切如來影像雲、出一切菩薩影像雲、出一切如來眾會影像雲、出一切如來變化輪影像雲、出一切如來本事海相應身影像雲、出一切聲聞、辟支佛影像雲、出一切如來菩提樹種種光色影像雲、出一切如來神通影像雲、出一切世主身影像雲、出一切清淨佛剎影像雲、念念出生如是等雲一一充滿虛空法界；既至佛所，頂禮佛足以為供養；修敬畢已，即於西北方化作普照十方毘盧遮那摩尼寶王莊嚴藏樓閣，及光明遍照一切世間摩尼寶王大蓮華藏師子之座，諸菩薩眾各於其上結跏趺坐，冠以普焰光明摩尼寶冠，以無能勝光明真珠網羅覆其身。大方廣佛華嚴經卷第一大方廣佛華嚴經大方廣佛華嚴經卷第二罽賓國三藏般若奉詔譯入不思議解脫境界普賢行願品爾時，下方過不可說佛剎極微塵數世界海，外有世界海名一切如來圓滿普焰光，佛號無著智星宿幢王；於彼如來大眾海中，有菩薩摩訶薩名破諸蓋障勇猛智自在王，與不可說世界海極微塵數諸菩薩俱，從彼佛會向如來所，悉以神力，於其身上一一毛孔出演說種種法海妙音聲雲。所謂：出演說一切法義眾生語言陀羅尼海音聲雲、出演說一切三世菩薩修行方便海音聲雲、出演說一切菩薩誓願方便海音聲雲、出演說一切菩薩圓滿清淨波羅蜜海音聲雲、出演說一切菩薩遍一切剎圓滿行海音聲雲、出演說一切菩薩成滿種種神通輪海音聲雲、出演說一切如來往詣道場破魔軍眾銷竭煩惱成等正覺神通輪海音聲雲、出演說一切如來轉妙法輪種種名句修多羅海音聲雲、出演說一切如來隨應教化調伏眾生方便行海音聲雲、出演說一切如來隨時隨善根隨其願力普令獲得一切智智善巧方便海音聲雲，如是等雲一一充滿虛空法界，既至佛所，頂禮佛足以為供養，修敬畢已，即於下方，化作現一切如來宮殿，光明種種色藏寶樓閣，及一切妙形像寶蓮華藏師子之座，諸菩薩眾各於其上結跏趺坐，以普現一切菩提場影像光幢摩尼王冠以嚴其身。上方過不可說佛剎極微塵數世界海，外有世界海名無盡佛種性，佛號普智圓滿差別光明大聲王；於彼如來大眾海中，有菩薩摩訶薩名普遍法界大願際，與不可說世界海極微塵數諸菩薩俱，受彼佛教，發彼道場，而來向此娑婆世界毘盧遮那如來所，悉以神力各於其身一切相好、一切身分、一切肢節、一切毛孔、一切言音、一切名句、一切衣服、一切莊嚴具中，現毘盧遮那等盡過去際一切諸佛、盡未來際一切諸佛、盡現在際一切諸佛、并其眾會，十方剎土清淨雜染，廣狹大小，靡不皆現；亦現彼佛過去所行檀那波羅蜜，隨順積集一切施行，受者、財物、本事、影像相應行海；亦現彼佛過去所行尸羅波羅蜜，隨順積集本事影像相應行海；亦現彼佛過去所行羼提波羅蜜，斷截肢體，心無動亂，隨順積集本事影像相應行海；亦現彼佛過去所行毘梨耶波羅蜜，勇猛不退，隨順積集本事影像相應行海；亦現彼佛過去所求一切如來禪那波羅蜜，隨順積集而得成就本事影像相應行海；亦現彼佛過去所求般若波羅蜜，一切如來所轉法輪，所成就法，發勇猛心一切皆捨本事影像相應行海；亦現彼佛過去所成方便波羅蜜，樂見一切佛，樂行一切菩薩道、樂化一切眾生界本事影像相應行海；亦現彼佛過去所發願波羅蜜，一切菩薩廣大誓願清淨莊嚴本事影像相應行海；亦現彼佛過去所成一切菩薩力波羅蜜，了種種行清淨和合本事影像相應行海；亦現彼佛過去所修一切菩薩智波羅蜜，圓滿清淨種種差別證悟法門本事影像相應行海；如是所現一切如來本事影像相應行海悉皆遍滿廣大法界。既至佛所，頂禮佛足以為供養，修敬畢已，即於上方化作一切金剛寶王種種莊嚴藏樓閣，及帝青金剛寶王蓮華藏師子之座，諸菩薩眾各於其上結跏趺坐，以演說三世如來名號大音聲海；摩尼寶王為髻，明珠莊嚴寶冠，以一切妙寶光焰熾盛摩尼王網羅覆其身。如是十方一切菩薩各以種種神通興種種供養雲來會道場普周法界。此諸菩薩并其眷屬皆從普賢行願所生，以淨智眼普見三世一切諸佛。眾所樂見種種相海，得無礙耳，普聞十方一切如來所轉法輪修多羅海已，得至於一切菩薩最勝自在究竟彼岸，於念念中現大神變能遍親近十方諸佛，一身充滿一切世界，普現諸佛道場眾會，光明遍照一切世界。於一塵中普現十方，盡虛空界、一切世界，於彼世界現種種身，隨諸眾生應受化者調伏成熟，未曾失時；一切毛孔出大音聲，周聞十方，演暢如來妙法輪雲，廣大境界；知諸眾生悉皆如幻，知諸如來悉皆如影，知諸界趣業行受生悉皆如夢，知諸世間所現果報如鏡中像，知諸世間諸有生起如熱時焰，知諸國土依心想住皆如變化；通達如來十種智力威德自在，如大牛王，得無所畏，能師子吼，深入無盡辯才大海，了知眾生諸祕密海，深入文字語言智海，了達法界猶如虛空；得諸菩薩神通智慧威力，勇健摧伏魔軍，智力明徹，了達三世，知一切法無有違諍，而常趣求一切智地，以無斷智入諸世間，以法界智流出教海；得神通力，能令十方一切世界展轉相入；得善根力於諸世界自在受生；得周遍眼普見十方一切世界廣狹、大小；得無礙智於微細境現廣大剎，於廣大境現微細剎，以自在力於一佛所得一切佛功德智慧威神所加，普見十方無有疑惑，於一念頃能以神通普遍十方一切剎海。具足如是無量功德諸大菩薩滿逝多林皆是如來威神之力。于時，上首諸大聲聞：大智舍利弗、神通目揵連、摩訶迦葉、離婆多、須菩提、阿[少/兔]樓馱、難陀、劫賓那、迦旃延、富樓那彌多羅尼子等在逝多林皆悉不見如來神力、如來嚴好、如來境界、如來遊戲、如來神變、如來尊勝、如來妙行、如來威德、如來加持、如來剎海；亦復不見不可思議菩薩境界、菩薩集會、菩薩遍入、菩薩親近，菩薩神通、菩薩遊戲、菩薩眷屬、菩薩方處、菩薩師子座、菩薩宮殿、菩薩威儀、菩薩三昧、菩薩周遍觀察、菩薩師子頻申、菩薩勇猛、菩薩供養、菩薩授記、菩薩成熟、菩薩身業清淨、菩薩智身圓滿、菩薩願身顯示、菩薩色身普遍、菩薩相好具足、菩薩常光圓滿、菩薩放大光網、菩薩起變化雲、菩薩普遍方網、菩薩諸行圓滿，如是種種皆悉不見。何以故？以善根不同故。彼於過去本不修集見一切佛種種神通妙善根故；本不讚說十方剎海普遍莊嚴淨功德故；本不稱歎諸佛世尊種種神通變化事故；本不能於生死之中發阿耨多羅三藐三菩提心故；本不勸發一切眾生令住廣大菩提心故；本不能令如來種性不斷絕故；本不精勤攝受一切諸眾生故；本不勤修一切菩薩波羅蜜故；本於生死不勸眾生求智眼故；本不修習順一切智諸善根故，本不覺了如來出世勝善根故；本不獲得普遍嚴淨一切佛剎神通智故；本不獲得菩薩所知廣大境界清淨眼故；本不欣求超出世間究竟不共大善根故；本不發起一切菩薩廣大誓願出離智故；本不從於一切如來威力加持之所生故；本不能知一切諸法皆如幻故；本不能知菩薩所知思想執持皆如夢故；本不能得菩薩勇猛廣大志樂深歡喜故；如是種種皆是普賢智眼境界不與一切二乘所共。以是因緣，彼諸上首大德聲聞不能聞、不能信、不能知、不能見、不能憶念、不能觀察、不能籌量、不能思惟、不能證入、不能分別。何以故？諸佛菩薩神通境界非諸二乘狹劣境故。是故，雖在逝多林中不見如來廣大神變。復次，彼諸聲聞無如是菩薩所修最勝善根故，無如是見佛神通清淨智眼故，無如是甚深三昧微細觀察故，無如是廣大神力所加持故，無如是不可思議解脫門故，無如是神通自在故，無如是廣大勢力故，無如是廣大威德故，無如是最勝住處故，無如是智眼所行境故；是故，於此不能知、不能見、不能入、不能得、不能遍解、不能出生、不能觀察、不能忍受、不能修行、不能安住、不能開示、亦復不能廣為人說、不能讚歎、不能指示、不能授與、不能攝取、不能勸進、不能教誨令其修習、令其安住、令其證入諸佛境界。何以故？彼諸聲聞無有如是大智慧故，依聲聞乘而出離故，入聲聞道得智慧故，修聲聞行求滿足故，住聲聞果為究竟故，悟解聲聞實諦智故，住於差別真實際故，樂住寂靜為涅槃故，於諸世間捨大悲故，遠離救護諸眾生故，恒住自事趣寂滅故；是故，雖在逝多林中不見如是種種神變。何以故？本於如來一切智性不能志求、不能積集、不能樂欲、不能出生、不能修習、不能清淨、亦於如來三昧神通不能入、不能行、不能知見、不能證得。何以故？如是境界唯諸菩薩廣大智眼乃能見知，非諸聲聞所行境故；以是因緣諸大聲聞雖復住在逝多林中，不見如來種種神變、種種加持、種種佛剎、種種嚴淨，及大菩薩普遍眾會遊戲神通皆悉不見。譬如恒河兩岸多有百千億無量餓鬼，裸露、飢渴、羸瘦、憔悴、皮肉、筋骨、內外焦然、風飄日曝、遍體乾枯、烏鷲犲狼諸惡禽獸競來搏撮；為渴所逼，欲求水飲，雖住河側而不見河，設有見者，見其枯涸，或見流火、或見煻煨。何以故？深厚業障之所覆故。諸大聲聞亦復如是，雖復住在逝多林中，不見如來廣大神變。何以故？不樂種智，無明瞖瞙蔽其眼故；不曾種植一切智地勝善根故。譬如有人，於眾會中假寐昏寢，忽然夢見須彌山頂帝釋所住善見宮城，殊勝寶殿，園苑莊嚴；天子、天女百千萬億柔軟寶地普散天華；種種衣樹，出妙衣服；種種華樹，開敷妙華；諸珍寶樹，出諸珍寶；諸莊嚴樹，出諸嚴具；諸音樂樹，奏天音樂；無量諸天，於中遊戲。其人自見著天衣服，住止周旋，受諸快樂，其眾會中一切人眾雖同一處，不見、不知、不能觀察。何以故？此人夢中所見境界非彼眾會所能見故。一切菩薩及諸世主現前所見廣大莊嚴神通變化亦復如是，以得一切佛加持故，以久積集善根力故，發一切智廣大願故，修習如來勝功德故，善住菩薩莊嚴道故，圓滿一切種智門故，成就普賢諸行願故，趣入菩薩一切智地清淨解故，遊戲菩薩一切三昧神通海故，觀察菩薩一切境界智無礙故；是故，悉見如來世尊不可思議自在遊戲神通境界，能入、能知。一切聲聞諸大弟子，雖有智慧具勝神通皆不能見、皆不能知。何以故？以無菩薩清淨眼故。譬如雪山多諸藥草，猶如種植處處出生，有大良醫成就明智，知諸藥性差別功能，隨病所須，於中採取，其諸捕獵放牧之人遊止其中，不見、不知，況能採取？此亦如是；以諸菩薩普入如來智慧境界出生菩薩種種遊戲，能了如來三昧境界，諸大弟子本不修習一切種智，不能利樂一切眾生，雖復住在逝多林中，不見、不知如來三昧廣大神變。譬如大地，眾寶所依，多諸伏藏，百千萬億珍奇雜寶，處處盈滿，一一莊嚴，無不備足；有一丈夫聰慧明達，善知寶藏所在之處，及知眾寶功能勢力；其人復有大福德力，能隨所欲自在而取，奉養父母、賑給宗親、老病窮乏靡不均贍，諸有所求咸令充足，其餘無福無智慧人雖於寶處行、住、坐、臥，以無智故，不見、不知；此亦如是，諸大菩薩以有清淨普遍智眼，於逝多林能入如來不可思議甚深境界，能見諸佛廣大神變，能了諸佛一切法門，能入無邊佛三昧海，能勤供事一切如來，能以勝法開悟眾生，能以四攝攝受群品，彼諸聲聞雖住林中不能得見如來神力，亦復不見菩薩眾會。譬如有人以繒蔽目，至大寶洲行、住、坐、臥，不能得見寶樹、寶衣、寶香、寶果，眾寶形色，貴賤功能，復有一人開目至彼一切皆見，悉能了知，諸菩薩等亦復如是，至於如來大法寶洲最勝功德莊嚴之處，悉皆明見，諸大弟子雖在林中親近世尊，不見如來自在神變三昧境界，亦不得見普遍莊嚴菩薩眾會。何以故？以諸聲聞與佛智慧不相應故，無明覆障蔽其眼故，無諸菩薩無礙智故，不能次第入法界故，以是因緣不見如來自在三昧差別神變。譬如有藥名無垢光，若復有人用塗其眼，眼得清淨，一切闇色不能為障，其人有時處於夜闇無量百千人眾之內，悉見彼眾形相、威儀、行、住、坐、臥，此人所有威儀、形相、進退、往來，彼諸人眾皆不能覩，此亦如是；彼諸菩薩成就如來清淨智眼，悉能明見一切世間無有障礙，其所顯示三昧神通廣大境界，大菩薩眾所共圍遶，諸大聲聞悉不能見。譬如比丘於眾會中入遍處定，所謂：地遍處定、水遍處定、火遍處定、風遍處定、青遍處定、黃遍處定、赤遍處定、白遍處定、天遍處定、種種眾生身遍處定、一切音聲語言遍處定、一切所緣遍處定、入此定者，見其所緣地水等相，光明周遍，乃至一切所緣定境，其餘大眾悉不能見，唯除有住此三昧者。此亦如是，如來所現不可思議三昧神通廣大境界，一切菩薩能入、能知，一切二乘不知、不見。譬如有人得翳形藥，用以塗眼，身則隱蔽於眾會中，行、住、往、來，無能見者，而能悉覩眾會中事；應知如來亦復如是，成就智眼超出世間，普見世間無有障礙，所現三昧神通境界非諸聲聞之所能知，唯除趣向一切智境諸大菩薩乃能得見。譬如世人初始生時則有二天同時而生，一曰同生、二曰同名。彼天與人恒相隨逐，天常見人，人不見天；如來亦爾，住不思議一切智智廣大三昧神通境界，諸大菩薩眾會莊嚴，彼諸聲聞悉不能見。譬如比丘得心自在入滅盡定，想、受皆滅，六根作業皆悉不行，亦非涅槃，世變遷流不知、不覺。何以故？由此定力所加持故。彼大聲聞亦復如是，雖復住在逝多林中，具足六根而於如來自在神變廣大境界不見、不知、不解、不入，亦復不見菩薩眾會三昧神通。何以故？如來境界微細、甚深，祕密、廣大，難見、難知、難量、難測，超過一切世、出世間不可思議無能壞者，非諸聲聞及辟支佛所知境故。是故，如來自在神力所現境界不可思議眷屬莊嚴，菩薩眾會及逝多林普遍一切無量阿僧祇清淨世界，如是等事一切二乘悉不能見。何以故？以非菩薩廣大器故。爾時，東方毘盧遮那焰願藏光明菩薩摩訶薩承佛威力，觀察十方，而說偈言：「汝等觀佛智，微妙難思議，於此逝多林，神變無能勝。大覺威神力，顯現無數行，迷惑諸世間，不解佛深法。甚深法王法，無量難思議，所現諸神通，舉世無能測。諸佛所現相，稱揚不可盡，雖以相嚴身，所現皆無相。佛種種神變，顯現逝多林，所現皆甚深，言辭莫能及。不思議億剎，具德諸菩薩，眾會廣莊嚴，奉佛故雲集。大願悉皆滿，威儀無所著，難思心境界，舉世莫能知。利智辟支佛，及彼大聲聞，皆悉不能知，菩薩行境界。菩薩智甚深，最勝難超越，建立精進幢，一切無能動。已入無量定，已得大名稱，顯現大神通，遍周於法界。」爾時，南方難摧伏速疾精進王菩薩摩訶薩承佛威力，觀察十方，而說偈言：「汝觀諸佛子，妙智功德藏，能集菩提行，安樂諸世間。三昧妙威神，智慧無邊際，彼心及境界，一切皆甚深。今此逝多林，正遍知住處，菩薩眾雲集，普現大莊嚴。汝觀無所著，菩薩大眾海，各坐蓮華座，安處於道場，無去亦無來，無依無所著，究竟離分別，普現於十方。勇猛大智幢，堅固無能動，能於無相海，現相滿塵方。十方諸億剎，一切諸佛所，普詣不分身，悉離有無相。汝觀釋師子，種種力神通，能令大威德，菩薩皆雲集，法界無分別，諸佛身亦然，世間唯假名，佛子咸通達，諸佛住真實，寂滅平等際，常轉差別輪，無動無分別。」爾時，西方普遍出生吉祥威德王菩薩摩訶薩承佛威力，觀察十方，而說偈言：「汝觀無上士，廣大智圓滿，不擇時非時，演法恒無盡。能摧諸外道，種種差別見，普隨眾生心，為現神通力。正覺非有量，亦復非無量，若量若非量，牟尼悉超越。如日處虛空，光明恒遍照，佛智亦如是，能除三世暗。譬如淨滿月，一切皆樂見，佛德圓滿時，見者咸欣悅。譬如空中日，周行無暫已，諸佛現神通，相續恒無盡。譬如十方空，不礙於諸剎，智燈照世王，無礙心如是。譬如世間地，一切同所依，諸佛於眾生，為依亦如是。譬如迅疾風，行空無所礙，佛智亦如是，不礙於世間。譬如大水輪，世界所依止，三世佛亦然，恒依智輪住。」爾時，北方無礙吉祥勝藏王菩薩摩訶薩承佛威力，觀察十方，而說偈言：「譬如大寶山，普益諸含識，見佛亦如是，能生出世智。譬如大海水，深廣淨無垢，見佛亦如是，能消諸渴愛。譬如須彌山，高出於大海，智山亦如是，安住深法海。譬如深大海，眾寶之所生，覺海亦如是，能生諸智寶。世雄甚深智，無數亦無量，所現諸神通，無能測量者。譬如巧幻師，幻作種種相，佛智亦如是，現化量難思。譬如摩尼珠，所欲皆隨意，佛寶亦如是，能滿諸淨願。譬如光淨寶，遍照於虛空，佛寶亦復然，普照於群有。譬如八面寶，照現於諸方，無礙大智燈，遍照於法界。譬如水清珠，能清諸濁水，見佛亦如是，諸根悉清淨。」爾時，東北方妙變化遍法界願月王菩薩摩訶薩承佛威力，觀察十方，而說偈言：「譬如帝青寶，照物皆同色，眾生見佛時，同佛菩提色。一一剎塵中，諸佛現神變，念念常不斷，所化皆清淨。甚深希有智，不可得思議，菩薩乃能知，群生莫能入。佛身極清淨，具足相莊嚴，普入於法界，成就諸菩薩。不可思議剎，皆現成正覺，降魔坐道場，菩薩眾圍遶。釋迦無上尊，於法恒自在，一切極微剎，神通不可量。菩薩種種行，無礙妙光明，佛力不思議，一切皆能現。佛子應善學，甚深諸佛法，證入諸法中，無著智境界。法王大威力，常轉妙法輪，所現諸神通，能淨十方界。甚深圓滿智，世間真實寶，佛智大龍王，隨心悉能濟。」爾時，東南方法慧光明威德王菩薩摩訶薩承佛威力，觀察十方，而說偈言：「盡十方三世，一切大聲聞，不能知如來，所有微妙法。復盡彼三世，十方諸緣覺，亦不知如來，所有神通事。況復處流轉，盲瞑諸凡夫，結使之所縛，而能測佛境？如來無礙智，過量及非量，離於語言道，一切無能說。佛以相嚴身，凝光如滿月，曩劫因修忍，化現於十方。諦觀諸佛力，三昧及神通，億劫共思量，不能知少分。諦觀諸佛智，自覺妙難思，一一功德門，無能測邊際。若有發大願，愛樂於佛法，於斯難見境，通達不為難。若以清淨心，精勤集福智，具足大功德，聞教能隨入。若人依佛慧，志願亦弘深，是向佛菩提，當成一切智。」爾時，西南方摧碎一切魔力智幢王菩薩摩訶薩承佛威力，觀察十方，而說偈言：「智身無所著，遠離於身相，難思佛境界，眾聖莫能知。不思議淨業，起此微妙身，相好及光明，三世無能礙。遍照於世間，法界恒清淨，開佛菩提門，常生一切智。體淨無諸垢，遠離一切障，猶如世間日，普放智光明。永絕三界流，能除生死怖，成就諸菩薩，令滿菩提願。顯現無量色，此色無依住，所現雖無量，一切難思議。佛於一念中，普現難思事，菩提深境界，無有能測知。佛於一念中，顯現三世佛，所現雖無盡，念性曾無異。智者應善思，念念恒相續，唯智無別業，專向佛菩提。是法難思議，性離於言說，亦非心境界，諸佛從此生。」爾時，西北方毘盧遮那願智星宿幢菩薩摩訶薩承佛威力，觀察十方，而說偈言：「淨念離癡亂，勇猛恒持法，圓滿智能觀，無盡菩提海。若得決定解，則能入佛境，自在智從生，永斷諸疑惑。念念心增進，所行無懈倦，於法常志求，究竟諸佛法。從彼諸善根，能生廣大信，常樂常觀察，無相無依住。億劫常修集，圓滿諸善根，皆為佛菩提，證於無比樂。行於生死中，不著於生死，於法無疑惑，常樂佛境界。於諸有為法，世間虛妄樂，永離貪著心，專求佛功德。凡夫迷佛智，沒溺生死流，菩薩無著心，普救咸令出。菩薩無動行，舉世無能測，普現隨類身，等與群生樂。已淨菩提智，於世起慈悲，如日出世間，光照無邊際。」爾時，下方破諸蓋障勇猛智自在王菩薩摩訶薩承佛威力，觀察十方，而說偈言：「無量億千劫，佛名難得聞，況復於現前，見佛除疑惑。如來無盡智，照世圓滿燈，三世流福河，能令眾清淨。如來妙色身，清淨無過失，億劫常瞻仰，其心無厭足。佛子善觀察，如來妙色身，智淨恒無著，能成自他利。如來深智力，無盡妙辯才，開佛菩提門，所說皆無礙。牟尼遍照尊，導彼難思眾，授勝菩提記，令登解脫門。廣大福德聚，出興於世間，開悟諸群生，令集菩提行。曾供養諸佛，智度恒清淨，能破諸惑網，永除惡道怖。能觀兩足尊，發大菩提願，獲佛自在力，能生大智光。若見人中尊，求佛心決定，當知如是人，必獲如來智。」爾時，上方普遍法界大願際菩薩摩訶薩承佛威力，觀察十方，而說偈言：「牟尼殊特尊，眾德皆圓滿，見者心清淨，迴向大菩提。如來興出世，寂靜大慈悲，普轉妙法輪，利益諸含識。佛於無量劫，勤苦為眾生，云何諸眾生，能報大師恩？寧受三塗苦，備經無量劫，終不捨如來，而求於出離。寧代諸眾生，永受輪迴苦，終不捨如來，而求於少樂。寧惡道多劫，受苦聞佛名，不願生善道，暫時不聞佛。寧地獄多劫，受苦常見佛，不願離三塗，生無佛法處。何故於惡道，而無厭離心？由見於法王，智慧常增長。見佛自在力，能除一切苦，得入諸如來，甚深智境界。若得見佛時，滅除諸惡趣，增長福智芽，必獲菩提果。眾生若見佛，能破種種疑，世出世間樂，所願皆圓滿。」大方廣佛華嚴經卷第二大方廣佛華嚴經大方廣佛華嚴經卷第三罽賓國三藏般若奉詔譯入不思議解脫境界普賢行願品爾時，普賢菩薩摩訶薩普觀一切菩薩眾會，欲為開發如來最上師子頻申大三昧故，以等虛空界方便、等三世方便、等法界方便、等一切世界、等一切業、等一切眾生心、等一切眾生欲、等一切眾生根、等一切眾生成熟時、等一切法光影方便，告諸菩薩言：「佛子！我今為汝以十種法門清淨名句，開示演說師子頻申廣大三昧神通境界。何等為十？所謂：等虛空界如來所現，遍法界一切佛剎極微塵中一切諸佛出興次第，及一切剎成壞次第法門名句；等虛空界一切佛剎，盡未來際一切劫中讚歎如來殊勝功德法門名句；等虛空界一切佛剎如來出世，顯現無量菩提門海法門名句；等虛空界一切佛剎，如來所坐最勝道場，菩薩眾會圓滿境界法門名句；一切毛孔於念念中出等三世一切諸佛變化身雲，充滿法界法門名句；以威神力能令一身普現十方一切剎海，光明遍照諸佛世界法門名句；以威神力能於一切諸境界中普現三世一切諸佛種種神變，如觀掌中明了顯現法門名句；能令三世一切佛剎極微塵中普現三世一切佛剎極微塵數佛，顯現種種神通境界，經於劫海相續不斷法門名句；能令一切毛孔出聲演說三世一切諸佛大願海音，盡未來際加持出生一切菩薩法門名句；能令所處師子之座，量同法界，最勝覺解大菩薩眾莊嚴道場，遍一切處，盡未來際，轉於法輪，無間成熟，相續不絕法門名句。佛子！此十法句以為其首，有不可說佛剎極微塵數清淨名句微妙法門，皆是如來智慧境界，非我及汝所能證知。」爾時，普賢菩薩欲重宣此如來所入師子頻申廣大三昧少分境界，承佛神力，一心瞻仰，觀察如來不可思議菩薩眾海；觀察如來不可思議三昧神通，種種變現；觀察如來不可思議入出一切諸世界海；觀察如來不可思議入一切法幻智境界；觀察如來不可思議普現三世一切諸佛悉皆平等；觀察如來不可思議無量無邊諸語言道，開悟一切諸法門海，而說偈言：「一一毛孔中剎海，等一切剎極微數，佛悉於中坐道場，菩薩眾會共圍遶。一一毛孔所有剎，佛悉於中坐道場，安處最勝蓮華座，普現神通周法界。一毛端處所有佛，一切剎土極微數，悉於菩薩眾會中，皆為宣揚普賢行。如來安坐於一剎，一切剎中無不現，十方無盡菩薩雲，普共同來集其所。功德光明菩薩海，百千億剎極微數，俱從會起讚如來，遍往十方充法界。自在遊於深法界，悉住普賢無等行，現一切剎放光明，普入無邊諸佛會。普於十方一切剎，安住最勝諸佛所，聽聞正法具修行，一一土經無量劫。菩薩常修種種行，皆入普賢願海中，住佛境界德無邊，法海光明無不遍。通達普賢廣大行，出生諸佛無盡法，讚佛功德海無涯，現眾神通充法界。身雲普現如塵數，念念恒周一切剎，甘露法雨潤群生，普遍法界令開悟。」爾時，世尊以最勝甚深廣大意樂，正念思惟，欲令眾會諸菩薩等安住如來師子頻申大三昧故，從眉間白毫相中放大光明，名普照現三世法界門，以不可說佛剎極微塵數光明而為眷屬，普照十方一切剎海。時，逝多林菩薩眾會悉見十方盡法界、虛空界一切世界所有極微；一一極微各有一切佛剎極微塵數諸佛國土種種名字、種種色相、種種莊嚴、種種清淨、種種依住、種種形狀，如是一切諸國土中皆有最勝菩提道場；一一道場皆有莊嚴寶師子座；一一座上皆有菩薩成等正覺，一切菩薩所共圍遶，一切世主恭敬供養。或見處在不可說佛剎大眾會中轉正法輪，其聲無礙，遍周法界；或見處在天王宮中、龍王宮中、夜叉王宮、乾闥婆、阿修羅、迦樓羅、緊那羅、摩睺羅伽、人、非人等諸王宮中，及餘人間村營、城邑、王都、聚落、乃至種種眾生住處，現種種神力，說種種法門；所謂：生種種族姓、受種種色身、住種種威儀、示種種相好、佩種種圓光、放種種光網、處種種眾會、入種種三昧、起種種神變、現種種威力、發種種音聲、出種種言辭、以種種名句演種種教法，如此會中菩薩大眾見於如來甚深三昧廣大神變，如是盡法界、虛空界，東、西、南、北，四維，上、下，遍一切處，種種方轉變中、種種方法門中、種種方想住中、種種方出生中、種種方分齊中、種種方解起中、種種方海中，皆依於眾生心想而住，始從前際至今現在所有一切國土身、一切眾生身、一切毛孔中、一切極微中、及彼一切虛空界中、一一毛端量處皆有一切剎土極微塵數種種剎海、種種業起相續不斷，次第而住，其中所有道場眾會見佛神力悉亦如是，以得見佛神通力故，悉能遍入十方三世一切世界眾生心中，現其影像，隨諸眾生種種樂欲出妙言音，隨其所應演說諸法，普入眾會中，普現眾生前，色相有別，智慧無異，遍一切剎，盡未來際，自在示現，常無休息，教化調伏一切眾生，其有見此神通力者，皆是毘盧遮那如來過去修集願力善根之所攝受：或昔曾以四攝善根之所攝受；或是往昔見、聞、憶念、親近、供養之所成熟；或是往昔令其發起阿耨多羅三藐三菩提心；或昔曾於如來所修菩薩行時經遊之處，勇猛精勤善根所攝；或昔曾於一切佛所，與佛同種相似善根；或是如來於過去時為求無上一切智故，種種方便教化成熟。是故，皆得入於如來不可思議甚深三昧，盡法界、虛空界廣大神變：或有得見入佛法身；或有得見入佛色身；或有得見入佛智身；或有得見入於如來過去所行清淨行海；或有得見入於如來究竟圓滿功德彼岸；或有得見入於菩薩莊嚴行輪；或有得見入於菩薩所證諸地；或有得見入於如來成正覺智；或有得見入佛所住諸三昧門、平等神變；或有得見入於如來十種智力、四無所畏；或有得見入於如來四無礙解辯才大海；入如是等十不可說佛剎極微塵數如來種種大神變海，彼諸菩薩以種種信、種種解、種種道、種種門、種種入、種種教、種種隨順、種種方所、種種根器、種種國土、種種世界、種種智慧、種種法聚、種種神變、種種方便、種種三昧，以如是等入於如來神變大海。云何菩薩種種三昧？所謂：入一切菩薩普遍莊嚴法界三昧、菩薩光照三世無礙境三昧、菩薩法界無斷智光明三昧、菩薩住一切佛境界三昧、菩薩光照無邊虛空際三昧、菩薩入出遊戲如來自在力三昧、菩薩勇猛無畏奮迅莊嚴三昧、菩薩入一切法界方便漩澓藏三昧、菩薩遍法界如月普現以無礙音演一切法三昧、菩薩種種法雲平等莊嚴三昧、菩薩離垢繒繫頂法王幢三昧、菩薩觀一切佛智慧海三昧、菩薩無分別光幢照一切世間差別身三昧、菩薩入如來無分別境界身三昧、菩薩大悲藏隨一切世間轉三昧、菩薩安住一切法無依跡威力三昧、菩薩照一切法最極寂靜圓滿智三昧、菩薩知諸法空巧能化現遍一切世間三昧、菩薩威力平等普出生一切佛剎三昧、菩薩於一切佛剎現成正覺莊嚴相三昧、菩薩觀一切世間色空三昧、菩薩不著一切世間最勝圓滿空三昧、菩薩出生一切如來威力母三昧、菩薩修行入一切佛究竟功德海三昧、菩薩觀察一切境界出生神變盡未來際威力三昧、菩薩入一切如來次第本事海三昧、菩薩能以威力盡未來際護持一切如來種性三昧、菩薩以決定解力令現在十方一切佛剎皆清淨三昧、菩薩一剎那中普照一切佛差別住處三昧、菩薩深入觀察無礙際三昧、菩薩能以威力令一切世界為一佛剎三昧、菩薩出生一切佛變化身三昧、菩薩以金剛智知一切諸根海三昧、菩薩知一切如來同一胎藏身三昧、菩薩知一切法界隨所安立悉住心念際三昧、菩薩於一切法界廣大剎中現成正覺及般涅槃大威力三昧、菩薩令住最上威力處三昧、菩薩照一切佛剎眾生身無分別威力三昧、菩薩入一切佛智慧旋轉藏三昧、菩薩知一切法性相差別三昧、菩薩一剎那中以無分別智普見三世法三昧、菩薩念念中普現法界藏身三昧、菩薩以勇猛智如師子王隨順悟解一切如來種姓三昧、菩薩觀一切法界圓滿智慧眼三昧、菩薩正勇猛趣向十力三昧、菩薩以普遍眼觀察一切圓滿功德三昧、菩薩遍照出生一切眾生色相圓滿三昧、菩薩旋轉不動藏三昧、菩薩演說一法普入一切法三昧、菩薩於一法以一切言辭差別訓釋辯才三昧、菩薩演說一切佛無二法句威力幢三昧、菩薩知三世無礙際三昧、菩薩隨順悟解一切劫無差別三昧、菩薩入微細十力方便三昧、菩薩以金剛智起一切菩薩行三昧、菩薩能於十方隨心速疾普現身雲三昧、菩薩現遍法界成正覺身種種神變三昧、菩薩受一切觸安樂幢三昧、菩薩出一切莊嚴具莊嚴虛空界三昧、菩薩念念中出等一切世間數變化形像雲三昧、菩薩如來無垢月光照虛空三昧、菩薩一切如來加持三昧、菩薩一光照一切法根本差別莊嚴三昧、菩薩廣演一切法義燈三昧、菩薩照十力境圓滿三昧、菩薩三世諸佛星宿幢三昧、菩薩一切佛一密藏三昧、菩薩觀一切相皆究竟三昧、菩薩無盡福德藏三昧、菩薩見盡無邊佛境界三昧、菩薩見一切法如金剛師子吼威力三昧、菩薩現一切如來變化正見平等三昧、菩薩一切佛日念念周行三昧、菩薩一念普照三世法三昧、菩薩普音演說淨光等照一切法自性清淨三昧、菩薩見一切佛差別力三昧、菩薩見一切佛覺一切差別法界如蓮華開敷三昧、菩薩觀察諸法如虛空無住處三昧、菩薩一方普出十方海旋轉藏三昧、菩薩入一切法界門三昧、菩薩一切法海差別藏身三昧、菩薩以寂靜身放差別光照一切眾生身三昧、菩薩一剎那心以大願力出生一切神通三昧、菩薩常於一切處正覺威力普遍三昧、菩薩隨順悟解以一莊嚴入一切法界三昧、菩薩正念一切佛身普照三昧、菩薩悟解最勝神通智遍一切世界三昧、菩薩一念令無量教字本母普遍法界三昧、菩薩以一教法莊嚴一切法界法光明三昧、菩薩一切佛威力光明圓滿輪三昧、菩薩以行願網攝一切眾生界三昧、菩薩見一切世界不斷絕三昧、菩薩蓮華吉祥種種神變普遊步三昧、菩薩知一切眾生身旋轉智三昧、菩薩威力普現一切眾生前三昧、菩薩悟解一切眾生音聲言辭祕密海三昧、菩薩觀一切眾生差別智三昧、菩薩無分別大悲藏三昧、菩薩入一切如來際三昧、菩薩觀察一切如來解脫處師子頻申三昧。彼諸菩薩以如是等不可說佛剎極微塵數菩薩三昧而為方便，入毘盧遮那如來過去所修廣大功德，念念充滿一切法界諸佛三昧大神變海，其諸菩薩住逝多林不離如來道場眾會，各各自見普於十方一切佛剎極微塵數廣大世界，坐於種種寶蓮華藏師子之座，皆已具足廣大智慧，普現種種神通境界，已住寂靜諸菩薩地，自在出生明利智慧，已得隨順普遍智行從佛智慧種性而生，已證現前一切智智得無癡翳清淨智眼，善巧調御一切眾生，住一切佛平等法性，於一切法隨順悟解，已能觀察一切諸法自性清淨，知諸世間究竟寂滅無有所依，普詣十方一切國土而無所著，常勤觀察一切世間而無所住，普往十方一切剎土而無所去，已入一切妙法宮殿而無所來，遍於諸法了達性空知無積聚而恒教化成熟眾生，示諸眾生安樂行處，開示智慧解脫境界，恒以智身住離貪際超越一切生死苦海，普示眾生諸蘊實際，智光圓滿照徹一切定力堅固無能傾動，於諸眾生常起大悲了一切法悉皆如幻，知諸世間悉皆如夢，觀一切佛現差別身悉皆如影，知所說法音聲語言悉皆如響，現見諸法生成住持悉皆如化，善能積集最勝行願，普遍智慧，圓滿清淨，善巧隨順，究竟寂靜，善入總持種智境界，具足無畏諸三昧力，勇猛精進遍修諸行，住法界際，獲明智眼，到一切法無所住處，修習無邊智慧行海，到智波羅蜜究竟彼岸，得般若波羅蜜之所攝持，以神通波羅蜜度諸眾生，依禪波羅蜜得心自在，證一切佛真實境界，以善巧智開示法藏，以明了智訓釋文詞，以辯才力說無盡法，雄猛無畏能師子吼，常樂觀察無差別法，以淨慧眼普觀一切，無生智月等照世間，觀諸眾生，見真實諦，福智堅固如金剛山，一切譬諭說不能及，增長一切智慧根芽，勇猛精進，摧諸魔眾，無量智慧，威光圓滿，身相殊特超諸世間，得一切法無礙智慧，解了諸法，盡無盡際，智慧清淨住普遍際，能遍隨順入真實際，無相觀智常現在前，善巧圓滿諸菩薩行，以無二智觀諸世間，知諸眾生往來所趣，遍諸佛剎得圓滿智，於一切法離諸暗障，普放法光照十方界，為諸世間最勝福田，廣大願輪如月普現，福德超勝如須彌山一切世間無能過者，摧伏一切外道、邪論，於一切剎普現其身，以微妙音演說諸法，普見諸佛心無厭足，已得諸佛自在威力，隨所應化現種種身，乘大智舟汎生死海，周旋普濟所往無礙，智慧圓滿身光映徹，如日輪出普照世間，隨眾生心現眾色像，知諸眾生根性欲樂，入於無諍清淨境界，知一切法自性無生，以自在智能令一切小大境界互相涉入，決了佛地甚深理趣，知諸世間文字、句義，以無盡句說無盡法，於一句中演出一切修多羅海，具足獲得廣大智慧陀羅尼身，隨所受持盡未來劫，初無忘失，一念能憶不可說劫宿住之事，一念能了三世一切諸眾生心，與諸眾生一切諸佛總持法藏，常轉清淨不退法輪，令諸眾生生大智慧，入佛境界，具一切智，常善安住甚深三昧，巧能分別一切法句，而於諸法悉無所著。最勝智慧自在遊戲，於諸境界皆得解脫，觀察一切淨莊嚴身，其身普入十方法界，隨所應化，悉能遍往，知諸剎海所有極微，悉於其中現成正覺，於無色性現一切色，能以一方入一切方，其諸菩薩具足如是無量智慧功德之藏，十方所有一切諸佛悉共稱揚，說其功德不能令盡，靡不咸在逝多林中，悉見於佛光明所照，深入如來功德大海。爾時，彼諸菩薩得不思議正法光明照故，其心歡喜安隱快樂，各於其身及師子座，眾寶樓閣諸莊嚴具遍逝多林，凡所受用一切物中，化出種種大莊嚴雲，充滿十方一切法界。所謂：於念念中普放一切微妙廣大光明網雲，充滿法界，遍能開覺一切眾生，咸令歡喜；於念念中出現一切摩尼鈴雲，充滿法界，出微妙音稱揚讚歎三世諸佛一切功德；於念念中出現一切天音樂雲，充滿法界，出微妙音演說眾生諸業果報；於念念中出現一切諸大菩薩種種行願身色相雲，充滿法界，悉以妙音說諸菩薩所有一切廣大行願；於念念中出現一切如來自在種種神通妙變化雲充滿法界，以隨類音遍眾生界演說諸佛廣大言音；於念念中出現一切種種莊嚴諸相隨好菩薩身雲，充滿法界遍一切剎，說諸如來普於十方一切國土出興次第，相續不斷；於念念中出現一切三世如來菩提場雲，充滿法界，顯現諸佛成等正覺，普遍觀察顯示成佛莊嚴功德；於念念中出現一切諸大龍王相似身雲，充滿法界，一一身雲，遍諸佛剎普雨一切諸上妙香；於念念中出現一切諸世間主相似身雲，充滿法界，一一世主普遍觀察演說普賢菩薩之行；於念念中出現一切妙寶光明淨佛剎雲，充滿法界，顯示十方一切諸佛所轉法輪，是諸菩薩以得如是不可思議光明所照，入於廣大不可思議神通境界，法應如是，出興此等不可說佛剎極微塵數種種神變大莊嚴雲。爾時，文殊師利菩薩摩訶薩承佛威力，欲重開示逝多林中諸神變事，觀察十方，而說偈言：「汝應觀此逝多林，廣博莊嚴量無際，一切身雲皆示現，以佛威神充法界。清淨色相莊嚴身，十方無量諸佛子，咸來影現道場中，眾會普觀無不見。從諸佛子毛孔中，演佛法音若雷震，焰雲種種莊嚴相，普遍十方一切剎。又於寶樹華葉中，出現梵釋莊嚴相，動止威儀恒寂靜，從禪定起而遊步。佛身一一毛孔中，常現難思眾菩薩，相好端嚴甚微妙，悉與普賢菩薩等。逝多林上諸嚴具，充遍虛空發妙音，讚說三世諸菩薩，種種莊嚴功德海。逝多林中諸寶樹，亦出無量妙音聲，演說一切諸群生，種種業報差別海。林中所有諸境界，悉現三世諸如來，十方剎海極微中，皆起神通無不遍。一切剎海極微中，所有十方諸國土，於佛一一諸毛孔，普遍莊嚴皆顯現。寶焰香雲皆現佛，等眾生數遍世間，一一咸起大神通，方便隨宜而化度。如虛空量寶宮城，盡妙莊嚴如日現，寶藏及與菩提樹，靡不普遍於十方。十方三世諸如來，所有道場菩薩眾，劫海修行功德相，一切於此林中現。普賢大行諸菩薩，已於剎海具莊嚴，其數無量等群生，於此林中無不見。」爾時，彼諸菩薩蒙佛三昧光明照故，一一皆得不可說佛剎極微塵數大悲門；以得如是大悲門故，攝受利益安樂眾生，即於其身一一毛孔各出不可說佛剎極微塵數眾色光明，一一光明各各化現不可說佛剎極微塵數菩薩身雲，復出一切世主相似身雲，充滿十方一切法界，普現一切諸眾生前，隨諸眾生身相、言音，種種方便教化調伏，令其成熟，或現不可說佛剎極微塵數諸天宮殿退墮無常門；或現不可說佛剎極微塵數一切眾生隨業受生門；或現不可說佛剎極微塵數夢中境界令心覺悟門；或現不可說佛剎極微塵數一切菩薩圓滿諸行門；或現不可說佛剎極微塵數一切菩薩圓滿大願門；或現不可說佛剎極微塵數震動世界門；或現不可說佛剎極微塵數一切如來悉捨內外檀波羅蜜門；或現不可說佛剎極微塵數一切如來修諸功德正行圓滿尸波羅蜜門；或現不可說佛剎極微塵數一切菩薩斷截肢體、心無動亂羼提波羅蜜門；或現不可說佛剎極微塵數一切菩薩勤修種種智慧神通毘梨耶波羅蜜門；或現不可說佛剎極微塵數修諸靜慮、等持、等至、神通解脫禪波羅蜜門；或現不可說佛剎極微塵數智光照世般若波羅蜜門；或現不可說佛剎極微塵數勤求佛法，為一一名句、一一文義皆捨國城妻子財物無數身命門；或現不可說佛剎極微塵數於諸如來親近、供養、諮求、請問一切法要心無疲厭門；或現不可說佛剎極微塵數隨諸眾生根欲成熟往詣其所開發示導令其悟入智海光明門；或現不可說佛剎極微塵數一切菩薩大福智聚摧伏眾魔制諸外道勝幢威力門；或現不可說佛剎極微塵數知一切工巧技術明智門；或現不可說佛剎極微塵數知一切眾生心行微細差別明智門；或現不可說佛剎極微塵數知一切諸法種類差別殊勝明智門；或現不可說佛剎極微塵數知一切眾生種種心樂差別明智門；或現不可說佛剎極微塵數知一切眾生根行差別，煩惱習氣令其除滅明智門；或現不可說佛剎極微塵數知一切眾生品類差別業報明智門。以如是等不可說佛剎極微塵數諸方便門，往詣一切眾生住處，攝受調伏而成熟之。所謂：或往梵王宮；或往帝釋宮，或時往詣天、龍、夜叉、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽、人、非人等閻摩羅界諸王宮中；或往畜生、餓鬼、地獄之所住處，以平等大悲、平等大願、平等智慧、平等三昧、教化攝取而調伏之；彼諸眾生或有見已而調伏者、或有聞已而調伏者、或有憶念而調伏者、或聞音聲而調伏者、或聞名號而調伏者、或見圓光而調伏者、或見光網而調伏者，隨諸眾生心之所樂，皆詣其所，令其獲益；而此林中一切菩薩為欲成熟諸眾生故，雖以神力：或時現處種種嚴飾諸宮殿中；或時示現住自樓閣寶師子座道場眾會所共圍遶，充滿十方一切剎海，普遍示現皆令得見，然亦不離此逝多林如來之所；又此菩薩為欲成熟諸眾生故，示現無量變化身雲，或現其身眷屬莊嚴，或現其身獨一無侶。所謂：或現沙門身、或現婆羅門身、或現異道出家身、或現苦行身、或現充盛身、或現醫王身、或現商主身、或現婬女身、或現妓樂身、或現毘沙門身、或現世主身、或現奉事諸天身、或現工巧技術身，現如是等諸變化身，往詣一切諸眾生所，隨其所應，起如幻智。於諸世間猶如帝網行菩薩行，以種種形相、種種威儀、種種音聲、種種言論、種種住處演說諸法。所謂：或說一切世間工巧事業、或說一切福德智慧照世明燈、或說一切所證真實威力加持、或說一切業力所持莊嚴世趣、或說一切建立十方清淨乘位、或說一切圓滿智燈照法境界，如是菩薩雖普周遍十方法界，教化調伏，成熟眾生，而亦不離此逝多林如來之所。◎大方廣佛華嚴經卷第三大方廣佛華嚴經大方廣佛華嚴經卷第四罽賓國三藏般若奉詔譯入不思議解脫境界普賢行願品◎爾時，文殊師利童子從善住樓閣出，與無量同行大菩薩眾，及常侍衛諸金剛神、普為世間現大威力身眾神、久發堅誓供養諸佛足行神、念昔大願樂聞正法相續不斷主地神、深淨大悲莊嚴法界普潤眾生主水神、智慧威力光明遍照主火神、摩尼寶冠以嚴其首主風神、光照十方差別儀式主方神、專勤除滅無明黑闇主夜神、一心開現如來智日主晝神、普遍莊嚴虛空法界主空神、能勤方便拔濟眾生出生死海主海神、常勤積集出過心量趣一切智勝幢善根主山神、發大誓願運度眾生稱讚諸佛勇猛無倦主河神、常勤守護一切眾生菩提心城主城神、常勤守護一切眾生諸大龍王、常勤守護一切智城諸夜叉王、常令眾生增長歡喜乾闥婆王、常勤除滅一切餓鬼所有飢渴鳩槃茶王、恒願拔濟一切眾生度生死海迦樓羅王、願諸眾生普得成就超諸世間如來力身阿脩羅王、曲躬恭敬樂見諸佛種種功德摩睺羅伽王、深厭生死常樂瞻仰諸佛相好諸大天王、尊重於佛恭敬供養稱揚讚歎諸大梵王。文殊師利與如是等種種色像威德莊嚴大菩薩眾及諸世主，前後圍遶，從自住處來詣佛所，右遶如來，經無量匝，以諸供具種種供養，供養畢已，頂禮辭退，右遶而出，往於南方。爾時，尊者舍利弗承佛神力，見文殊師利菩薩與如是等諸大菩薩及諸世主，種種神通威德自在眾會莊嚴，從逝多林安詳而出，作是思惟：「我今當與文殊師利俱往南方。」時，舍利弗即與眷屬六十比丘前後圍遶，出自住處，往詣佛所。到已頂禮，一心觀佛，具白世尊，世尊聽許，右遶三匝，作禮辭退，往文殊師利童子所。此諸比丘皆舍利弗之所化度，出家未久，自所同住。所謂：海覺比丘、妙德比丘、福光比丘、大悲比丘、電德比丘、淨行比丘、天德比丘、實慧比丘、梵勝比丘、寂慧比丘，與如是等六十人俱，曾於過去供養諸佛，深種善根；於甚深法悉能悟解，深信趣入最極清淨志行寬博等佛境界，於佛教法能正修行，悉能了知諸法本性，能大饒益成熟眾生，常樂勤求諸佛功德，皆是文殊師利童子之所教化。◎◎爾時，尊者舍利弗將諸比丘隨路而行，觀諸比丘，告海覺言：「汝可觀察文殊師利清淨相好莊嚴之身，諸天及人莫能思議；汝可觀察文殊師利圓光映徹普照十方，能令眾生心生歡喜；汝可觀察文殊師利放光明網，微妙莊嚴，除滅眾生無量苦惱；汝可觀察文殊師利眾會威德，皆是菩薩往昔善根之所攝受；汝可觀察文殊師利所行之路，左右八步清淨平坦，眾寶莊嚴；汝可觀察文殊師利所住之處，周迴十方，常有道場，顯現莊嚴隨逐而轉；汝可觀察文殊師利所行之路，具足無量福德莊嚴，左右兩邊皆有伏藏，種種珍寶自然而出；汝可觀察文殊師利由昔供養諸佛善根，隨其所在有雜寶樹，於其樹間寶藏開敷出莊嚴具；汝可觀察文殊師利隨其所在一切世主興供養雲，雨諸供具周布陳列，以為供養；汝可觀察文殊師利十方諸佛將說法時，悉放眉間白毫光明，來照其身從頂上入。」爾時，尊者舍利弗為諸比丘稱揚讚歎，開示演說文殊師利如是無量種種功德具足莊嚴。時，諸比丘聞是讚已，心意清淨，信解堅固，踊躍歡喜不能自持，形體柔軟，諸根和悅，垢障咸盡，憂苦悉除，常見諸佛，恒聞正法，迴向趣求一切智智，成就菩薩無礙善根，逮得菩薩無量諸力，出生無盡圓滿大悲，發起無邊廣大誓願，深入諸度究竟彼岸，十方佛海皆悉現前，於佛境界深生信樂，即白尊者舍利弗言：「唯願和尚將道我等親近於彼勝妙丈夫。」時，舍利弗即與俱行詣文殊師利童子所，見已頂禮，白言：「仁者！此諸比丘願得奉覲。」爾時，文殊師利童子與無量自在神通菩薩圍遶，并其大眾種種眷屬，如象王迴觀諸比丘。時，諸比丘頭面禮足，恭敬合掌，白如是言：「唯願大聖文殊師利，和尚舍利弗，世尊釋迦牟尼，悉當證知，我等今以得見大士勝妙丈夫，奉覲瞻禮，恭敬信樂所有善根，及以我等過去所集福智善根，以此善根願令我等於仁所有如是色身、如是相好、如是音聲、如是自在、一切功德悉當具得。」爾時，文殊師利菩薩告諸比丘言：「若善男子、善女人成就十種趣大乘法無疲厭心，則能速疾深入如來究竟之地，況菩薩地？何等為十？所謂：見諸如來，以廣大心親近供養，心無疲厭；積集成就一切善根，究竟不退，心無疲厭；勤求一切諸佛正法，心無疲厭；勤行一切菩薩殊勝諸波羅蜜，心無疲厭；普遍修習一切菩薩甚深三昧，心無疲厭；次第趣入三世流轉一切諸法，心無疲厭；莊嚴十方一切剎海悉令清淨，心無疲厭；教化調伏一切眾生皆令成熟，心無疲厭；於一切剎行菩薩行，經一切劫，心無疲厭；為欲成熟一眾生故，修一切剎極微塵數波羅蜜門，成就圓滿如來一力，如是次第為一切眾生成就如來一切智力，心無疲厭。比丘當知，若善男子、善女人成就深信發此十種無疲厭心，則能長養一切善根，捨離一切生死流轉，悉能超出一切世間，不墮聲聞、辟支佛地，成就如來一切種性，滿足菩薩清淨大願，積集一切如來功德，修行一切菩薩諸行，獲得如來力無所畏，摧伏眾魔及諸外道，滅除一切煩惱、習氣，入菩薩地，近如來地。時，諸比丘聞此法已，即時同證廣大三昧，名見一切佛境界無礙眼。得此三昧威神力故，悉見十方一切世界諸佛如來及其所有道場眾會；亦悉見彼一切世界所有眾生種種趣類各各差別；亦悉見彼一切世界同異染淨各各差別；亦悉見彼一切世界所有極微塵相差別；亦悉見彼諸世界中一切眾生所住宮殿種種莊嚴、種種成就及所受用種種資具各各差別；及聞彼佛諸音聲海；演說諸法種種名句、文詞、訓釋、性相、祕密悉能解了；亦能觀察彼世界中一切眾生心行根欲各各差別；亦能憶念彼世界中一切眾生過去、未來各十生事；亦能憶念彼世界中過去、未來各十劫事；亦能憶念彼諸如來十本生事、十成正覺、十轉法輪、十種神通、十種記心、十種教誡、十種說法、十種辯才。又由得此三昧力故，即時獲得十千真實菩提之心，成就十千甚深三昧，具足十千諸波羅蜜，圓滿十千智慧光明，發起十千自在神力，以得如是菩薩三昧種種威神無礙勢力所莊嚴故，令其身心柔軟微妙增長信樂住菩提心堅固不動。」爾時，文殊師利菩薩具足安住真實吉祥微妙功德普賢勝行，勸諸比丘令其安住勝普賢行，住勝行已，入於甚深廣大願海；入願海已，普遍成就甚深大願；以得成就大願海故，得心清淨；心清淨故，得身清淨；身清淨故，得身輕利；身輕利故，則得廣大不退神通。以得如是大神通故，不離文殊師利足下，普於十方一切世界諸如來所，悉現其身，具足成就一切佛法。爾時，文殊師利菩薩勸諸比丘發阿耨多羅三藐三菩提心已，漸次\n\n## 四、五十三参总表（锚点级·逐参批核订）\n\n提取法：到达句「見/詣＋名＋身份」＋请法锚「我已先發阿耨多羅三藐三菩提心」（46锚）配对；表列 T0293 译名、身份、八十对照名。**参界精确切分随逐参批完成**〔预登记〕。\n\n| 参 | 善知识（T0293） | 身份 | 八十对照 |\n|---|---|---|---|\n| 1 | 文殊師利童子 | 會首（本国所示） | — |\n| 2 | 吉祥雲比丘 | 比丘 | 德雲比丘 |\n| 3 | 海雲比丘 | 比丘 | 海雲比丘 |\n| 4 | 妙住比丘 | 比丘 | 善住比丘〔核订〕 |\n| 5 | 彌伽大師 | 大師 | 彌伽大師 |\n| 6 | 解脫長者 | 長者 | 解脫長者 |\n| 7 | 海幢比丘 | 比丘 | 海幢比丘 |\n| 8 | 伊舍那優婆夷 | 優婆夷 | 休捨優婆夷 |\n| 9 | 毘目瞿沙仙人 | 仙人 | 毘目瞿沙仙人 |\n| 10 | 勝熱婆羅門 | 婆羅門 | 勝熱婆羅門 |\n| 11 | 慈行童女 | 童女 | 慈行童女 |\n| 12 | 妙見比丘 | 比丘 | 善見比丘 |\n| 13 | 根自在主童子 | 童子 | 自在主童子 |\n| 14 | 具足優婆夷 | 優婆夷 | 具足優婆夷 |\n| 15 | 明智居士 | 居士 | 明智居士 |\n| 16 | 寶髻長者 | 長者 | 寶髻長者 |\n| 17 | 普眼長者 | 長者 | 普眼長者 |\n| 18 | 無厭足王 | 王 | 無厭足王 |\n| 19 | 大光王 | 王 | 大光王 |\n| 20 | 不動優婆夷 | 優婆夷 | 不動優婆夷 |\n| 21 | 遍行外道 | 外道 | 遍行外道 |\n| 22 | 廣博鬻香長者 | 長者 | 優缽羅華鬻香長者 |\n| 23 | 婆施羅船師 | 船師 | 婆施羅船師 |\n| 24 | 最勝長者 | 長者 | 無上勝長者 |\n| 25 | 師子頻申比丘尼 | 比丘尼 | 師子頻申比丘尼 |\n| 26 | 伐蘇蜜多女 | 女 | 婆須蜜多女 |\n| 27 | 鞞瑟胝羅居士 | 居士 | 鞞瑟胝羅居士 |\n| 28 | 觀自在菩薩 | 菩薩 | 觀自在菩薩 |\n| 29 | 正趣菩薩 | 菩薩 | 正趣菩薩 |\n| 30 | 大天 | 天神 | 大天 |\n| 31 | 安住地神 | 地神 | 安住地神 |\n| 32 | 婆珊那演底夜神〔核订〕 | 夜神 | 婆珊那演底主夜神 |\n| 33 | 普德淨光夜神〔核订〕 | 夜神 | 普德淨光主夜神 |\n| 34 | 普德救護眾生夜神〔核订〕 | 夜神 | 普德救護眾生主夜神 |\n| 35 | 喜目觀察眾生夜神 | 夜神 | 喜目觀察眾生主夜神 |\n| 36 | 普救眾生妙德眼夜神〔核订〕 | 夜神 | 普救眾生妙德眼夜神 |\n| 37 | 具足功德寂靜音海夜神 | 夜神 | 寂靜音海主夜神 |\n| 38 | 守護一切城增長威德主夜神 | 夜神 | 守護一切城主夜神 |\n| 39 | 開敷一切樹華安樂主夜神 | 夜神 | 開敷一切樹花主夜神 |\n| 40 | 大願精進神力救護夜神〔核订〕 | 夜神 | 大願精進神力救護眾生夜神 |\n| 41 | 妙德圓滿夜神〔核订〕 | 夜神 | 妙德圓滿神 |\n| 42 | 釋女瞿波 | 女 | 瞿波女 |\n| 43 | 摩耶夫人 | 佛母 | 摩耶夫人 |\n| 44 | 天主光天女〔核订〕 | 天女 | 天主光天女 |\n| 45 | 遍友童子師〔核订〕 | 師 | 遍友童子師 |\n| 46 | 善知眾藝童子〔核订〕 | 童子 | 善知眾藝童子 |\n| 47 | 賢勝優婆夷 | 優婆夷 | 賢勝優婆夷 |\n| // ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';
  sessionStorage.setItem('article_en_hide', cur?'0':'1');
  localStorage.removeItem('article_en_hide');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);

function _applyArticleENMode(){
  var full=document.getElementById('article-full');
  var btn=document.getElementById('article-en-toggle');
  var hide=(sessionStorage.getItem('article_en_hide')||'')==='1';

}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}

</script>
</body>
</html>
