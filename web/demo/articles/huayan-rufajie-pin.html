  var NAMES = Object.keys(MAP).sort(function(a,b){return b.length-a.length;});
  var BASE = '../famai/shanhe.html';
  function skip(node){
    var p = node.parentElement;
    while(p && p !== document.body){
      var tag = p.tagName;
      if(tag==='A'||tag==='CODE'||tag==='PRE'||tag==='BLOCKQUOTE') return true;
      var cls = p.getAttribute ? (p.getAttribute('class')||'') : '';
      if(/\b(q|quote|cite-card|lic)\b/.test(cls)) return true;
      p = p.parentElement;
    }
    return false;
  }
  function linkify(){
    var root = document.getElementById('article-root');
    if(!root) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var edits = [];
    var tn;
    while((tn = walker.nextNode())){
      if(skip(tn)) continue;
      var text = tn.textContent;
      for(var i=0;i<NAMES.length;i++){
        var nm = NAMES[i], pos = text.indexOf(nm);
        if(pos < 0) continue;
        edits.push({node:tn, name:nm, pid:MAP[nm], pos:pos});
        break;
      }
    }
    for(var j=edits.length-1;j>=0;j--){
      var e = edits[j];
      var t = e.node.textContent;
      var idx = t.indexOf(e.name);
      if(idx < 0) continue;
      var before = t.slice(0, idx), after = t.slice(idx + e.name.length);

      frag.appendChild(a);
      if(after) frag.appendChild(document.createTextNode(after));
      e.node.parentNode.replaceChild(frag, e.node);
    }
    if(edits.length) console.log('[lin-deeplink] linked %d mentions' % edits.length);
  }
  if(document.readyState==='complete') setTimeout(linkify,100);
  else window.addEventListener('load', function(){ setTimeout(linkify,100); });
})();
</script>

及諸眾生種種心量、種種信解、種種智慧、種種言辭、種種名字、種種證得、種種地位、種種根清淨、種種意方便、種種心境界、種種依止，如來功德隨能聽受諸所說法，顯示如來往昔趣求一切智道、往昔所起菩薩大願、往昔所淨諸波羅蜜、往昔所證諸菩薩地、往昔圓滿諸菩薩行、往昔所乘智莊嚴道、往昔所行諸清淨道、往昔出離殊勝法海、往昔所起遊戲神通大莊嚴海、往昔所集無量本事相應行海，及遍顯示如來現前成正覺門神通智海、如來自在轉法輪海、如來神通淨佛剎海、如來調伏一切眾生巧方便海、如來開示一切智城、如來顯示諸眾生道、如來善入一切眾生生死之處、如來普為一切眾生最上福田、如來普為一切眾生說施功德、如來所記一切眾生種種心行、如來普為一切眾生演說教誡、如來能以三昧神通現眾影像，如是等法唯垂大悲普為開演。」爾時，世尊知諸菩薩一切大眾心之所念，大悲為身、大悲為門、大悲為首，以大悲法而為方便，充滿虛空遍周法界，入於師子頻申三昧；入三昧已，一切世間普皆嚴淨。于時，此大莊嚴樓閣忽然之間高廣嚴麗遍周法界；金剛為地眾寶嚴飾，如意寶網無能勝幢列布其中，無數寶華及眾摩尼普散其上，一切寶聚處處盈滿，毘瑠璃寶以為其柱，光明照世；摩尼寶王以用莊嚴，閻浮檀金及諸摩尼周遍嚴飾，一切眾寶門、闥、窓、牖含輝交映，相望間列，階、墀、軒、檻一切皆以妙寶莊嚴，奇形異像如諸世主一切眾生種種相海，摩尼寶網以覆其上，於諸門側悉建幢幡，一一嚴事，各各流光遍周法界；於樓閣外階砌欄楯其數無量不可稱說，靡不咸以摩尼所成，眾雜妙寶周遍校飾。爾時，復以佛神力故，令逝多林忽然廣博，與不可說佛剎極微塵數諸佛世界其量正等，一切妙寶間錯莊嚴；以不可說寶莊嚴其地，無數摩尼寶以為垣牆，寶多羅樹莊嚴行列其間。復有無量香河香水盈滿湍激洄澓；一切寶華隨流右轉演出一切佛法音聲，不思議寶芬陀利華菡萏芬敷；一切妙寶、波頭摩華，鮮榮布濩；不思議數妙寶華樹高顯榮茂列植其岸；不思議數種種雜寶、臺榭、樓觀於其岸上次第行列，摩尼寶網之所彌覆。阿僧祇摩尼寶放大光明，阿僧祇眾雜妙寶莊嚴其地，蘊眾香藏騰出香雲香，氣氛氳普熏法界。復建無量種種寶幢，所謂：無量寶香幢、無量寶衣幢、無量寶幡幢、無量寶繒幢、無量寶華幢、無量寶瓔珞幢、無量寶鬘幢、無量寶鈴幢、無量威德寶網幢、無量摩尼寶王傘蓋幢、無量光明普照摩尼王幢、無量出一切如來名號圓滿音聲摩尼王幢、無量師子遊步摩尼王幢、無量說一切如來本事相應行海摩尼王幢、無量普現法界差別影像摩尼王幢、如是一切諸妙寶幢周遍十方，處處嚴飾。爾時，逝多林上虛空之中有不思議天寶宮殿諸樓閣雲；復有無數香樹雲、不可說須彌山雲、不可說妓樂雲、出美妙音歌讚如來，不可說寶蓮華雲遍覆莊嚴，不可說寶師子座雲、敷以天衣菩薩坐上歎佛功德，不可說天王形像摩尼寶雲、不可說白真珠雲、不可說赤真珠寶樓閣雲遍覆莊嚴、不可說一切堅固金剛珠雲雨莊嚴具，如是一切寶莊嚴雲皆悉盡於虛空法界周遍嚴飾。何以故？如來所種清淨善根不思議故，如來所成白淨法聚不思議故，如來威力祕密加持不思議故，如來神變能以一身普遍一切諸佛世界不思議故，如來能以神力普令十方一切諸佛及佛國土皆入其身不思議故，如來能於一極微塵中普現一切差別世界不思議故，如來能於一一毛端現過去際一切諸佛出興次第不思議故，如來能於一一毛孔放大光明一一光明悉能顯照一切世界不思議故，如來能於一一毛孔出一切佛剎極微塵數變化雲充滿一切諸佛剎土不思議故，如來能於一一毛孔普現十方一切世界成、住、壞劫不思議故；如於此逝多林給孤獨園見佛國土清淨莊嚴，如是十方盡法界、虛空界、一切世界亦如是見。所謂：見如來身遍逝多林，菩薩眾會各各圓滿；見普雨一切莊嚴具雲，莊嚴建立；見普雨一切寶威力光明雲，照曜法界；見普雨一切摩尼寶雲，周遍莊嚴；見普雨一切莊嚴蓋雲，覆一切剎；見普雨一切天身變化雲，皆妙嚴飾；見普雨一切華樹雲，其華開敷猶如海藏；見普雨一切繒綵雲，盤旋宛轉；見普雨一切衣服雲，繽紛而下；見普雨一切華鬘瓔珞雲，相續不絕；見普雨一切燒香雲，其形旋轉如眾生身；見普雨一切妙寶華網雲，周遍莊嚴、相續不斷；見普雨一切末香雲，香氣周流彌布十方；見普雨一切眾寶幢幡雲，天女執持，周旋空界；見普雨一切寶蓋雲，其蓋周圓眾寶所成微妙蓮華莊嚴其上，流出樂音聲聞法界；見普雨一切寶師子座雲，如諸眾生所有形像，雜寶鬘網瓔珞莊嚴。爾時，毘盧遮那如來住此師子頻申三昧，即時東方過不可說佛剎極微塵數世界海，外有世界海名金沙燈雲幢，佛號毘盧遮那吉祥威德王；於彼如來大眾海中有菩薩摩訶薩名毘盧遮那焰願藏光明，與不可說佛剎極微塵數諸菩薩俱，受彼佛教；從彼佛土道場眾海而來，向此娑婆世界毘盧遮那佛所，悉以神力出興種種諸供養雲；所謂：天華雲、天香雲、天寶蓮華雲、天鬘雲、天寶雲、天瓔珞環釧雲、天寶蓋雲、天妙衣雲、天寶幢幡雲、天一切妙寶莊嚴具雲，皆悉充滿虛空法界；既至佛所，頂禮佛足以為供養；修敬畢已，即於東方化作寶莊嚴樓閣，摩尼寶網彌覆其上；於樓閣中化作光照十方摩尼寶王大蓮華藏師子之座，諸菩薩眾各於其上，結跏趺坐，以大如意摩尼寶網羅覆其身。南方過不可說佛剎極微塵數世界海，外有世界海名金剛海藏，佛號普光遍照吉祥藏王；於彼如來大眾海中，有菩薩摩訶薩名難摧伏速疾精進王，與不可說世界海極微塵數諸菩薩俱，從彼佛會向如來所，悉以神力齎持種種微妙寶鬘諸供養具，交絡莊嚴；所謂：持一切妙寶香華鬘、持一切妙寶輪網鬘、持一切寶華瓔珞鬘、持一切金剛寶瓔珞鬘、持一切摩尼寶網鬘、持一切諸寶繒綵鬘、持一切寶形像瓔珞鬘、持一切出現吉祥光摩尼寶瓔珞鬘、持一切毘盧遮那摩尼莊嚴寶網鬘、持一切師子遊步摩尼寶瓔珞網鬘，悉以神力充滿一切諸世界海，既至佛所，頂禮佛足以為供養；修敬畢已，即於南方化作毘盧遮那眾寶莊嚴勝妙樓閣，摩尼寶網彌覆其上；於樓閣中化作普照十方摩尼寶蓮華藏師子之座，諸菩薩眾各於其上結跏趺坐，以天拘蘇摩妙寶華網羅覆其身。西方過不可說佛剎極微塵數世界海，外有世界海名須彌山幢毘盧遮那摩尼寶燈，佛號法界智燈王；於彼如來大眾海中，有菩薩摩訶薩名普遍出生吉祥威德王，與不可說世界海極微塵數諸菩薩俱，從彼佛會向如來所，悉以神力出興種種須彌山雲；所謂：不可說佛剎極微塵數種種色幢須彌山雲；不可說佛剎極微塵數種種色塗香、燒香、末香須彌山雲；不可說佛剎極微塵數種種色金光莊嚴摩尼寶王眾妙資具須彌山雲；不可說佛剎極微塵數種種焰光圓滿莊嚴星宿幢須彌山雲；不可說佛剎極微塵數種種妙色金剛月藏摩尼寶王莊嚴境界須彌山雲；不可說佛剎極微塵數種種光明普照法界，閻浮檀金摩尼王幢須彌山雲；不可說佛剎極微塵數種種法界差別，光明普照一切摩尼王幢須彌山雲；不可說佛剎極微塵數一切如來差別相好摩尼寶王須彌山雲；不可說佛剎極微塵數一切如來本所修行諸菩薩行本事因緣相應行海微妙音聲摩尼王幢須彌山雲；不可說佛剎極微塵數一切如來遍坐道場摩尼寶王須彌山雲；一一充滿虛空法界；既至佛所，頂禮佛足以為供養；修敬畢已，即於西方化作一切香王樓閣，真珠寶網彌覆其上；於樓閣中化作種種因陀羅差別光幢摩尼寶王妙蓮華藏師子之座，諸菩薩眾各於其上結跏趺坐，冠以如意摩尼寶冠，以妙色差別摩尼珠網羅覆其身。北方過不可說佛剎極微塵數世界海，外有世界海名寶衣光焰幢，佛號吉祥大光明遍照一切虛空法界；於彼如來大眾海中，有菩薩摩訶薩名無礙吉祥勝藏王，與不可說世界海極微塵數諸菩薩俱，從彼佛會向如來所，悉以神力出興一切妙寶衣雲，周遍莊嚴盡虛空界；所謂：黃色光明摩尼寶王衣雲、種種香熏摩尼寶王衣雲、淨妙日幢摩尼寶王衣雲、金焰熾盛吉祥光照摩尼寶王衣雲、雜寶流光摩尼寶王衣雲、一切上妙星宿形像摩尼寶王衣雲、白玉光焰因陀羅網摩尼寶王衣雲、毘盧遮那殊勝赫奕吉祥光焰摩尼寶王衣雲、光照諸境能令十方一切法界皆出光明互相涉入毘盧遮那摩尼寶王衣雲、大海莊嚴摩尼寶王衣雲，如是等雲一一充滿虛空法界；既至佛所，頂禮佛足以為供養。修敬畢已，即於北方化作大海出生摩尼寶王樓閣，及毘瑠璃寶勝蓮華藏師子之座，諸菩薩眾各於其上結跏趺坐，以星宿幢妙莊嚴藏摩尼寶王為髻明珠，以師子遊步妙威德王摩尼寶網羅覆其身。東北方過不可說佛剎極微塵數世界海，外有世界海名一切大地王，佛號放寶光網遍照法界無相眼；於彼如來大眾海中，有菩薩摩訶薩名妙變化遍法界願月王；與不可說世界海極微塵數諸菩薩俱，從彼佛會向如來所，悉以神力化作種種妙寶嚴飾諸樓閣雲；所謂：現一切寶幢樓閣雲、現一切香王樓閣雲、現一切燒香樓閣雲、現一切白栴檀香樓閣雲、現一切拘蘇摩花樓閣雲、現一切摩尼寶王樓閣雲、現一切金剛寶王樓閣雲、現一切閻浮檀金樓閣雲、現一切繒綵衣服樓閣雲、現一切眾妙蓮華樓閣雲，如是等雲一一彌覆虛空法界；既至佛所，頂禮佛足以為供養；修敬畢已，即於東北方化作一切法界門妙寶山峯摩尼寶王樓閣，及無比香王摩尼寶蓮華藏師子之座，諸菩薩眾各於其上結跏趺坐，冠以種種雜色摩尼寶王妙莊嚴冠，以拘蘇摩華如意寶網羅覆其身。東南方過不可說佛剎極微塵數世界海，外有世界海名香雲莊嚴幢，佛號龍自在王；於彼如來大眾海中，有菩薩摩訶薩名法慧光明威德王，與不可說世界海極微塵數諸菩薩俱，從彼佛會向如來所，悉以神力出興種種上妙寶色圓滿光明雲；所謂：金色幢圓滿光明雲、無量寶色圓滿光明雲、如來頂髻色圓滿光明雲、如來眉間毫相色圓滿光明雲、種種寶色圓滿光明雲、蓮華藏色圓滿光明雲、寶樹垂枝色圓滿光明雲、摩尼寶王色圓滿光明雲、閻浮檀金色圓滿光明雲、日月星宿色圓滿光明雲，如是等雲一一充滿虛空法界；既至佛所，頂禮佛足以為供養；修敬畢已，即於東南方化作離垢摩尼拘蘇摩華毘盧遮那吉祥摩尼寶王樓閣，及金剛摩尼寶蓮華藏師子之座，諸菩薩眾各於其上結跏趺坐，以眾寶光焰摩尼王網羅覆其身。西南方過不可說佛剎極微塵數世界海，外有世界海名日藏光明摩尼寶王，佛號普智光照法月王；於彼如來大眾海中，有菩薩摩訶薩名摧碎一切魔力智幢王，與不可說世界海極微塵數諸菩薩俱，從彼佛會向如來所，於一切毛孔出等虛空界種種焰雲；所謂：拘蘇摩華寶焰雲、種種音樂寶焰雲、一切色寶焰雲、金剛寶焰雲、種種香熏眾寶衣焰雲、如龍電光寶焰雲、毘盧遮那摩尼寶焰雲、騰輝摩尼寶焰雲、吉祥熾盛光藏摩尼寶焰雲、等三世如來普光教海摩尼寶焰雲，如是等雲一一皆從毛孔中出，遍虛空界；既至佛所，頂禮佛足以為供養；修敬畢已，即於西南方化作一念普現十方法界種種光明摩尼寶王樓閣，及香焰燈光摩尼寶王勝蓮華藏師子之座，諸菩薩眾各於其上結跏趺坐，以離垢藏摩尼寶王妙光明網羅覆其身。西北方過不可說佛剎極微塵數世界海，外有世界海名毘盧遮那願藏，佛號普光遍照須彌山王；於彼如來大眾海中，有菩薩摩訶薩名毘盧遮那願智星宿幢，與不可說世界海極微塵數諸菩薩俱，從彼佛會向如來所，於念念中各於其身一切相好、一切肢分、一切毛孔一一皆出三世一切諸影像雲；所謂：出一切如來影像雲、出一切菩薩影像雲、出一切如來眾會影像雲、出一切如來變化輪影像雲、出一切如來本事海相應身影像雲、出一切聲聞、辟支佛影像雲、出一切如來菩提樹種種光色影像雲、出一切如來神通影像雲、出一切世主身影像雲、出一切清淨佛剎影像雲、念念出生如是等雲一一充滿虛空法界；既至佛所，頂禮佛足以為供養；修敬畢已，即於西北方化作普照十方毘盧遮那摩尼寶王莊嚴藏樓閣，及光明遍照一切世間摩尼寶王大蓮華藏師子之座，諸菩薩眾各於其上結跏趺坐，冠以普焰光明摩尼寶冠，以無能勝光明真珠網羅覆其身。大方廣佛華嚴經卷第一大方廣佛華嚴經大方廣佛華嚴經卷第二罽賓國三藏般若奉詔譯入不思議解脫境界普賢行願品爾時，下方過不可說佛剎極微塵數世界海，外有世界海名一切如來圓滿普焰光，佛號無著智星宿幢王；於彼如來大眾海中，有菩薩摩訶薩名破諸蓋障勇猛智自在王，與不可說世界海極微塵數諸菩薩俱，從彼佛會向如來所，悉以神力，於其身上一一毛孔出演說種種法海妙音聲雲。所謂：出演說一切法義眾生語言陀羅尼海音聲雲、出演說一切三世菩薩修行方便海音聲雲、出演說一切菩薩誓願方便海音聲雲、出演說一切菩薩圓滿清淨波羅蜜海音聲雲、出演說一切菩薩遍一切剎圓滿行海音聲雲、出演說一切菩薩成滿種種神通輪海音聲雲、出演說一切如來往詣道場破魔軍眾銷竭煩惱成等正覺神通輪海音聲雲、出演說一切如來轉妙法輪種種名句修多羅海音聲雲、出演說一切如來隨應教化調伏眾生方便行海音聲雲、出演說一切如來隨時隨善根隨其願力普令獲得一切智智善巧方便海音聲雲，如是等雲一一充滿虛空法界，既至佛所，頂禮佛足以為供養，修敬畢已，即於下方，化作現一切如來宮殿，光明種種色藏寶樓閣，及一切妙形像寶蓮華藏師子之座，諸菩薩眾各於其上結跏趺坐，以普現一切菩提場影像光幢摩尼王冠以嚴其身。上方過不可說佛剎極微塵數世界海，外有世界海名無盡佛種性，佛號普智圓滿差別光明大聲王；於彼如來大眾海中，有菩薩摩訶薩名普遍法界大願際，與不可說世界海極微塵數諸菩薩俱，受彼佛教，發彼道場，而來向此娑婆世界毘盧遮那如來所，悉以神力各於其身一切相好、一切身分、一切肢節、一切毛孔、一切言音、一切名句、一切衣服、一切莊嚴具中，現毘盧遮那等盡過去際一切諸佛、盡未來際一切諸佛、盡現在際一切諸佛、并其眾會，十方剎土清淨雜染，廣狹大小，靡不皆現；亦現彼佛過去所行檀那波羅蜜，隨順積集一切施行，受者、財物、本事、影像相應行海；亦現彼佛過去所行尸羅波羅蜜，隨順積集本事影像相應行海；亦現彼佛過去所行羼提波羅蜜，斷截肢體，心無動亂，隨順積集本事影像相應行海；亦現彼佛過去所行毘梨耶波羅蜜，勇猛不退，隨順積集本事影像相應行海；亦現彼佛過去所求一切如來禪那波羅蜜，隨順積集而得成就本事影像相應行海；亦現彼佛過去所求般若波羅蜜，一切如來所轉法輪，所成就法，發勇猛心一切皆捨本事影像相應行海；亦現彼佛過去所成方便波羅蜜，樂見一切佛，樂行一切菩薩道、樂化一切眾生界本事影像相應行海；亦現彼佛過去所發願波羅蜜，一切菩薩廣大誓願清淨莊嚴本事影像相應行海；亦現彼佛過去所成一切菩薩力波羅蜜，了種種行清淨和合本事影像相應行海；亦現彼佛過去所修一切菩薩智波羅蜜，圓滿清淨種種差別證悟法門本事影像相應行海；如是所現一切如來本事影像相應行海悉皆遍滿廣大法界。既至佛所，頂禮佛足以為供養，修敬畢已，即於上方化作一切金剛寶王種種莊嚴藏樓閣，及帝青金剛寶王蓮華藏師子之座，諸菩薩眾各於其上結跏趺坐，以演說三世如來名號大音聲海；摩尼寶王為髻，明珠莊嚴寶冠，以一切妙寶光焰熾盛摩尼王網羅覆其身。如是十方一切菩薩各以種種神通興種種供養雲來會道場普周法界。此諸菩薩并其眷屬皆從普賢行願所生，以淨智眼普見三世一切諸佛。眾所樂見種種相海，得無礙耳，普聞十方一切如來所轉法輪修多羅海已，得至於一切菩薩最勝自在究竟彼岸，於念念中現大神變能遍親近十方諸佛，一身充滿一切世界，普現諸佛道場眾會，光明遍照一切世界。於一塵中普現十方，盡虛空界、一切世界，於彼世界現種種身，隨諸眾生應受化者調伏成熟，未曾失時；一切毛孔出大音聲，周聞十方，演暢如來妙法輪雲，廣大境界；知諸眾生悉皆如幻，知諸如來悉皆如影，知諸界趣業行受生悉皆如夢，知諸世間所現果報如鏡中像，知諸世間諸有生起如熱時焰，知諸國土依心想住皆如變化；通達如來十種智力威德自在，如大牛王，得無所畏，能師子吼，深入無盡辯才大海，了知眾生諸祕密海，深入文字語言智海，了達法界猶如虛空；得諸菩薩神通智慧威力，勇健摧伏魔軍，智力明徹，了達三世，知一切法無有違諍，而常趣求一切智地，以無斷智入諸世間，以法界智流出教海；得神通力，能令十方一切世界展轉相入；得善根力於諸世界自在受生；得周遍眼普見十方一切世界廣狹、大小；得無礙智於微細境現廣大剎，於廣大境現微細剎，以自在力於一佛所得一切佛功德智慧威神所加，普見十方無有疑惑，於一念頃能以神通普遍十方一切剎海。具足如是無量功德諸大菩薩滿逝多林皆是如來威神之力。于時，上首諸大聲聞：大智舍利弗、神通目揵連、摩訶迦葉、離婆多、須菩提、阿[少/兔]樓馱、難陀、劫賓那、迦旃延、富樓那彌多羅尼子等在逝多林皆悉不見如來神力、如來嚴好、如來境界、如來遊戲、如來神變、如來尊勝、如來妙行、如來威德、如來加持、如來剎海；亦復不見不可思議菩薩境界、菩薩集會、菩薩遍入、菩薩親近，菩薩神通、菩薩遊戲、菩薩眷屬、菩薩方處、菩薩師子座、菩薩宮殿、菩薩威儀、菩薩三昧、菩薩周遍觀察、菩薩師子頻申、菩薩勇猛、菩薩供養、菩薩授記、菩薩成熟、菩薩身業清淨、菩薩智身圓滿、菩薩願身顯示、菩薩色身普遍、菩薩相好具足、菩薩常光圓滿、菩薩放大光網、菩薩起變化雲、菩薩普遍方網、菩薩諸行圓滿，如是種種皆悉不見。何以故？以善根不同故。彼於過去本不修集見一切佛種種神通妙善根故；本不讚說十方剎海普遍莊嚴淨功德故；本不稱歎諸佛世尊種種神通變化事故；本不能於生死之中發阿耨多羅三藐三菩提心故；本不勸發一切眾生令住廣大菩提心故；本不能令如來種性不斷絕故；本不精勤攝受一切諸眾生故；本不勤修一切菩薩波羅蜜故；本於生死不勸眾生求智眼故；本不修習順一切智諸善根故，本不覺了如來出世勝善根故；本不獲得普遍嚴淨一切佛剎神通智故；本不獲得菩薩所知廣大境界清淨眼故；本不欣求超出世間究竟不共大善根故；本不發起一切菩薩廣大誓願出離智故；本不從於一切如來威力加持之所生故；本不能知一切諸法皆如幻故；本不能知菩薩所知思想執持皆如夢故；本不能得菩薩勇猛廣大志樂深歡喜故；如是種種皆是普賢智眼境界不與一切二乘所共。以是因緣，彼諸上首大德聲聞不能聞、不能信、不能知、不能見、不能憶念、不能觀察、不能籌量、不能思惟、不能證入、不能分別。何以故？諸佛菩薩神通境界非諸二乘狹劣境故。是故，雖在逝多林中不見如來廣大神變。復次，彼諸聲聞無如是菩薩所修最勝善根故，無如是見佛神通清淨智眼故，無如是甚深三昧微細觀察故，無如是廣大神力所加持故，無如是不可思議解脫門故，無如是神通自在故，無如是廣大勢力故，無如是廣大威德故，無如是最勝住處故，無如是智眼所行境故；是故，於此不能知、不能見、不能入、不能得、不能遍解、不能出生、不能觀察、不能忍受、不能修行、不能安住、不能開示、亦復不能廣為人說、不能讚歎、不能指示、不能授與、不能攝取、不能勸進、不能教誨令其修習、令其安住、令其證入諸佛境界。何以故？彼諸聲聞無有如是大智慧故，依聲聞乘而出離故，入聲聞道得智慧故，修聲聞行求滿足故，住聲聞果為究竟故，悟解聲聞實諦智故，住於差別真實際故，樂住寂靜為涅槃故，於諸世間捨大悲故，遠離救護諸眾生故，恒住自事趣寂滅故；是故，雖在逝多林中不見如是種種神變。何以故？本於如來一切智性不能志求、不能積集、不能樂欲、不能出生、不能修習、不能清淨、亦於如來三昧神通不能入、不能行、不能知見、不能證得。何以故？如是境界唯諸菩薩廣大智眼乃能見知，非諸聲聞所行境故；以是因緣諸大聲聞雖復住在逝多林中，不見如來種種神變、種種加持、種種佛剎、種種嚴淨，及大菩薩普遍眾會遊戲神通皆悉不見。譬如恒河兩岸多有百千億無量餓鬼，裸露、飢渴、羸瘦、憔悴、皮肉、筋骨、內外焦然、風飄日曝、遍體乾枯、烏鷲犲狼諸惡禽獸競來搏撮；為渴所逼，欲求水飲，雖住河側而不見河，設有見者，見其枯涸，或見流火、或見煻煨。何以故？深厚業障之所覆故。諸大聲聞亦復如是，雖復住在逝多林中，不見如來廣大神變。何以故？不樂種智，無明瞖瞙蔽其眼故；不曾種植一切智地勝善根故。譬如有人，於眾會中假寐昏寢，忽然夢見須彌山頂帝釋所住善見宮城，殊勝寶殿，園苑莊嚴；天子、天女百千萬億柔軟寶地普散天華；種種衣樹，出妙衣服；種種華樹，開敷妙華；諸珍寶樹，出諸珍寶；諸莊嚴樹，出諸嚴具；諸音樂樹，奏天音樂；無量諸天，於中遊戲。其人自見著天衣服，住止周旋，受諸快樂，其眾會中一切人眾雖同一處，不見、不知、不能觀察。何以故？此人夢中所見境界非彼眾會所能見故。一切菩薩及諸世主現前所見廣大莊嚴神通變化亦復如是，以得一切佛加持故，以久積集善根力故，發一切智廣大願故，修習如來勝功德故，善住菩薩莊嚴道故，圓滿一切種智門故，成就普賢諸行願故，趣入菩薩一切智地清淨解故，遊戲菩薩一切三昧神通海故，觀察菩薩一切境界智無礙故；是故，悉見如來世尊不可思議自在遊戲神通境界，能入、能知。一切聲聞諸大弟子，雖有智慧具勝神通皆不能見、皆不能知。何以故？以無菩薩清淨眼故。譬如雪山多諸藥草，猶如種植處處出生，有大良醫成就明智，知諸藥性差別功能，隨病所須，於中採取，其諸捕獵放牧之人遊止其中，不見、不知，況能採取？此亦如是；以諸菩薩普入如來智慧境界出生菩薩種種遊戲，能了如來三昧境界，諸大弟子本不修習一切種智，不能利樂一切眾生，雖復住在逝多林中，不見、不知如來三昧廣大神變。譬如大地，眾寶所依，多諸伏藏，百千萬億珍奇雜寶，處處盈滿，一一莊嚴，無不備足；有一丈夫聰慧明達，善知寶藏所在之處，及知眾寶功能勢力；其人復有大福德力，能隨所欲自在而取，奉養父母、賑給宗親、老病窮乏靡不均贍，諸有所求咸令充足，其餘無福無智慧人雖於寶處行、住、坐、臥，以無智故，不見、不知；此亦如是，諸大菩薩以有清淨普遍智眼，於逝多林能入如來不可思議甚深境界，能見諸佛廣大神變，能了諸佛一切法門，能入無邊佛三昧海，能勤供事一切如來，能以勝法開悟眾生，能以四攝攝受群品，彼諸聲聞雖住林中不能得見如來神力，亦復不見菩薩眾會。譬如有人以繒蔽目，至大寶洲行、住、坐、臥，不能得見寶樹、寶衣、寶香、寶果，眾寶形色，貴賤功能，復有一人開目至彼一切皆見，悉能了知，諸菩薩等亦復如是，至於如來大法寶洲最勝功德莊嚴之處，悉皆明見，諸大弟子雖在林中親近世尊，不見如來自在神變三昧境界，亦不得見普遍莊嚴菩薩眾會。何以故？以諸聲聞與佛智慧不相應故，無明覆障蔽其眼故，無諸菩薩無礙智故，不能次第入法界故，以是因緣不見如來自在三昧差別神變。譬如有藥名無垢光，若復有人用塗其眼，眼得清淨，一切闇色不能為障，其人有時處於夜闇無量百千人眾之內，悉見彼眾形相、威儀、行、住、坐、臥，此人所有威儀、形相、進退、往來，彼諸人眾皆不能覩，此亦如是；彼諸菩薩成就如來清淨智眼，悉能明見一切世間無有障礙，其所顯示三昧神通廣大境界，大菩薩眾所共圍遶，諸大聲聞悉不能見。譬如比丘於眾會中入遍處定，所謂：地遍處定、水遍處定、火遍處定、風遍處定、青遍處定、黃遍處定、赤遍處定、白遍處定、天遍處定、種種眾生身遍處定、一切音聲語言遍處定、一切所緣遍處定、入此定者，見其所緣地水等相，光明周遍，乃至一切所緣定境，其餘大眾悉不能見，唯除有住此三昧者。此亦如是，如來所現不可思議三昧神通廣大境界，一切菩薩能入、能知，一切二乘不知、不見。譬如有人得翳形藥，用以塗眼，身則隱蔽於眾會中，行、住、往、來，無能見者，而能悉覩眾會中事；應知如來亦復如是，成就智眼超出世間，普見世間無有障礙，所現三昧神通境界非諸聲聞之所能知，唯除趣向一切智境諸大菩薩乃能得見。譬如世人初始生時則有二天同時而生，一曰同生、二曰同名。彼天與人恒相隨逐，天常見人，人不見天；如來亦爾，住不思議一切智智廣大三昧神通境界，諸大菩薩眾會莊嚴，彼諸聲聞悉不能見。譬如比丘得心自在入滅盡定，想、受皆滅，六根作業皆悉不行，亦非涅槃，世變遷流不知、不覺。何以故？由此定力所加持故。彼大聲聞亦復如是，雖復住在逝多林中，具足六根而於如來自在神變廣大境界不見、不知、不解、不入，亦復不見菩薩眾會三昧神通。何以故？如來境界微細、甚深，祕密、廣大，難見、難知、難量、難測，超過一切世、出世間不可思議無能壞者，非諸聲聞及辟支佛所知境故。是故，如來自在神力所現境界不可思議眷屬莊嚴，菩薩眾會及逝多林普遍一切無量阿僧祇清淨世界，如是等事一切二乘悉不能見。何以故？以非菩薩廣大器故。爾時，東方毘盧遮那焰願藏光明菩薩摩訶薩承佛威力，觀察十方，而說偈言：「汝等觀佛智，微妙難思議，於此逝多林，神變無能勝。大覺威神力，顯現無數行，迷惑諸世間，不解佛深法。甚深法王法，無量難思議，所現諸神通，舉世無能測。諸佛所現相，稱揚不可盡，雖以相嚴身，所現皆無相。佛種種神變，顯現逝多林，所現皆甚深，言辭莫能及。不思議億剎，具德諸菩薩，眾會廣莊嚴，奉佛故雲集。大願悉皆滿，威儀無所著，難思心境界，舉世莫能知。利智辟支佛，及彼大聲聞，皆悉不能知，菩薩行境界。菩薩智甚深，最勝難超越，建立精進幢，一切無能動。已入無量定，已得大名稱，顯現大神通，遍周於法界。」爾時，南方難摧伏速疾精進王菩薩摩訶薩承佛威力，觀察十方，而說偈言：「汝觀諸佛子，妙智功德藏，能集菩提行，安樂諸世間。三昧妙威神，智慧無邊際，彼心及境界，一切皆甚深。今此逝多林，正遍知住處，菩薩眾雲集，普現大莊嚴。汝觀無所著，菩薩大眾海，各坐蓮華座，安處於道場，無去亦無來，無依無所著，究竟離分別，普現於十方。勇猛大智幢，堅固無能動，能於無相海，現相滿塵方。十方諸億剎，一切諸佛所，普詣不分身，悉離有無相。汝觀釋師子，種種力神通，能令大威德，菩薩皆雲集，法界無分別，諸佛身亦然，世間唯假名，佛子咸通達，諸佛住真實，寂滅平等際，常轉差別輪，無動無分別。」爾時，西方普遍出生吉祥威德王菩薩摩訶薩承佛威力，觀察十方，而說偈言：「汝觀無上士，廣大智圓滿，不擇時非時，演法恒無盡。能摧諸外道，種種差別見，普隨眾生心，為現神通力。正覺非有量，亦復非無量，若量若非量，牟尼悉超越。如日處虛空，光明恒遍照，佛智亦如是，能除三世暗。譬如淨滿月，一切皆樂見，佛德圓滿時，見者咸欣悅。譬如空中日，周行無暫已，諸佛現神通，相續恒無盡。譬如十方空，不礙於諸剎，智燈照世王，無礙心如是。譬如世間地，一切同所依，諸佛於眾生，為依亦如是。譬如迅疾風，行空無所礙，佛智亦如是，不礙於世間。譬如大水輪，世界所依止，三世佛亦然，恒依智輪住。」爾時，北方無礙吉祥勝藏王菩薩摩訶薩承佛威力，觀察十方，而說偈言：「譬如大寶山，普益諸含識，見佛亦如是，能生出世智。譬如大海水，深廣淨無垢，見佛亦如是，能消諸渴愛。譬如須彌山，高出於大海，智山亦如是，安住深法海。譬如深大海，眾寶之所生，覺海亦如是，能生諸智寶。世雄甚深智，無數亦無量，所現諸神通，無能測量者。譬如巧幻師，幻作種種相，佛智亦如是，現化量難思。譬如摩尼珠，所欲皆隨意，佛寶亦如是，能滿諸淨願。譬如光淨寶，遍照於虛空，佛寶亦復然，普照於群有。譬如八面寶，照現於諸方，無礙大智燈，遍照於法界。譬如水清珠，能清諸濁水，見佛亦如是，諸根悉清淨。」爾時，東北方妙變化遍法界願月王菩薩摩訶薩承佛威力，觀察十方，而說偈言：「譬如帝青寶，照物皆同色，眾生見佛時，同佛菩提色。一一剎塵中，諸佛現神變，念念常不斷，所化皆清淨。甚深希有智，不可得思議，菩薩乃能知，群生莫能入。佛身極清淨，具足相莊嚴，普入於法界，成就諸菩薩。不可思議剎，皆現成正覺，降魔坐道場，菩薩眾圍遶。釋迦無上尊，於法恒自在，一切極微剎，神通不可量。菩薩種種行，無礙妙光明，佛力不思議，一切皆能現。佛子應善學，甚深諸佛法，證入諸法中，無著智境界。法王大威力，常轉妙法輪，所現諸神通，能淨十方界。甚深圓滿智，世間真實寶，佛智大龍王，隨心悉能濟。」爾時，東南方法慧光明威德王菩薩摩訶薩承佛威力，觀察十方，而說偈言：「盡十方三世，一切大聲聞，不能知如來，所有微妙法。復盡彼三世，十方諸緣覺，亦不知如來，所有神通事。況復處流轉，盲瞑諸凡夫，結使之所縛，而能測佛境？如來無礙智，過量及非量，離於語言道，一切無能說。佛以相嚴身，凝光如滿月，曩劫因修忍，化現於十方。諦觀諸佛力，三昧及神通，億劫共思量，不能知少分。諦觀諸佛智，自覺妙難思，一一功德門，無能測邊際。若有發大願，愛樂於佛法，於斯難見境，通達不為難。若以清淨心，精勤集福智，具足大功德，聞教能隨入。若人依佛慧，志願亦弘深，是向佛菩提，當成一切智。」爾時，西南方摧碎一切魔力智幢王菩薩摩訶薩承佛威力，觀察十方，而說偈言：「智身無所著，遠離於身相，難思佛境界，眾聖莫能知。不思議淨業，起此微妙身，相好及光明，三世無能礙。遍照於世間，法界恒清淨，開佛菩提門，常生一切智。體淨無諸垢，遠離一切障，猶如世間日，普放智光明。永絕三界流，能除生死怖，成就諸菩薩，令滿菩提願。顯現無量色，此色無依住，所現雖無量，一切難思議。佛於一念中，普現難思事，菩提深境界，無有能測知。佛於一念中，顯現三世佛，所現雖無盡，念性曾無異。智者應善思，念念恒相續，唯智無別業，專向佛菩提。是法難思議，性離於言說，亦非心境界，諸佛從此生。」爾時，西北方毘盧遮那願智星宿幢菩薩摩訶薩承佛威力，觀察十方，而說偈言：「淨念離癡亂，勇猛恒持法，圓滿智能觀，無盡菩提海。若得決定解，則能入佛境，自在智從生，永斷諸疑惑。念念心增進，所行無懈倦，於法常志求，究竟諸佛法。從彼諸善根，能生廣大信，常樂常觀察，無相無依住。億劫常修集，圓滿諸善根，皆為佛菩提，證於無比樂。行於生死中，不著於生死，於法無疑惑，常樂佛境界。於諸有為法，世間虛妄樂，永離貪著心，專求佛功德。凡夫迷佛智，沒溺生死流，菩薩無著心，普救咸令出。菩薩無動行，舉世無能測，普現隨類身，等與群生樂。已淨菩提智，於世起慈悲，如日出世間，光照無邊際。」爾時，下方破諸蓋障勇猛智自在王菩薩摩訶薩承佛威力，觀察十方，而說偈言：「無量億千劫，佛名難得聞，況復於現前，見佛除疑惑。如來無盡智，照世圓滿燈，三世流福河，能令眾清淨。如來妙色身，清淨無過失，億劫常瞻仰，其心無厭足。佛子善觀察，如來妙色身，智淨恒無著，能成自他利。如來深智力，無盡妙辯才，開佛菩提門，所說皆無礙。牟尼遍照尊，導彼難思眾，授勝菩提記，令登解脫門。廣大福德聚，出興於世間，開悟諸群生，令集菩提行。曾供養諸佛，智度恒清淨，能破諸惑網，永除惡道怖。能觀兩足尊，發大菩提願，獲佛自在力，能生大智光。若見人中尊，求佛心決定，當知如是人，必獲如來智。」爾時，上方普遍法界大願際菩薩摩訶薩承佛威力，觀察十方，而說偈言：「牟尼殊特尊，眾德皆圓滿，見者心清淨，迴向大菩提。如來興出世，寂靜大慈悲，普轉妙法輪，利益諸含識。佛於無量劫，勤苦為眾生，云何諸眾生，能報大師恩？寧受三塗苦，備經無量劫，終不捨如來，而求於出離。寧代諸眾生，永受輪迴苦，終不捨如來，而求於少樂。寧惡道多劫，受苦聞佛名，不願生善道，暫時不聞佛。寧地獄多劫，受苦常見佛，不願離三塗，生無佛法處。何故於惡道，而無厭離心？由見於法王，智慧常增長。見佛自在力，能除一切苦，得入諸如來，甚深智境界。若得見佛時，滅除諸惡趣，增長福智芽，必獲菩提果。眾生若見佛，能破種種疑，世出世間樂，所願皆圓滿。」大方廣佛華嚴經卷第二大方廣佛華嚴經大方廣佛華嚴經卷第三罽賓國三藏般若奉詔譯入不思議解脫境界普賢行願品爾時，普賢菩薩摩訶薩普觀一切菩薩眾會，欲為開發如來最上師子頻申大三昧故，以等虛空界方便、等三世方便、等法界方便、等一切世界、等一切業、等一切眾生心、等一切眾生欲、等一切眾生根、等一切眾生成熟時、等一切法光影方便，告諸菩薩言：「佛子！我今為汝以十種法門清淨名句，開示演說師子頻申廣大三昧神通境界。何等為十？所謂：等虛空界如來所現，遍法界一切佛剎極微塵中一切諸佛出興次第，及一切剎成壞次第法門名句；等虛空界一切佛剎，盡未來際一切劫中讚歎如來殊勝功德法門名句；等虛空界一切佛剎如來出世，顯現無量菩提門海法門名句；等虛空界一切佛剎，如來所坐最勝道場，菩薩眾會圓滿境界法門名句；一切毛孔於念念中出等三世一切諸佛變化身雲，充滿法界法門名句；以威神力能令一身普現十方一切剎海，光明遍照諸佛世界法門名句；以威神力能於一切諸境界中普現三世一切諸佛種種神變，如觀掌中明了顯現法門名句；能令三世一切佛剎極微塵中普現三世一切佛剎極微塵數佛，顯現種種神通境界，經於劫海相續不斷法門名句；能令一切毛孔出聲演說三世一切諸佛大願海音，盡未來際加持出生一切菩薩法門名句；能令所處師子之座，量同法界，最勝覺解大菩薩眾莊嚴道場，遍一切處，盡未來際，轉於法輪，無間成熟，相續不絕法門名句。佛子！此十法句以為其首，有不可說佛剎極微塵數清淨名句微妙法門，皆是如來智慧境界，非我及汝所能證知。」爾時，普賢菩薩欲重宣此如來所入師子頻申廣大三昧少分境界，承佛神力，一心瞻仰，觀察如來不可思議菩薩眾海；觀察如來不可思議三昧神通，種種變現；觀察如來不可思議入出一切諸世界海；觀察如來不可思議入一切法幻智境界；觀察如來不可思議普現三世一切諸佛悉皆平等；觀察如來不可思議無量無邊諸語言道，開悟一切諸法門海，而說偈言：「一一毛孔中剎海，等一切剎極微數，佛悉於中坐道場，菩薩眾會共圍遶。一一毛孔所有剎，佛悉於中坐道場，安處最勝蓮華座，普現神通周法界。一毛端處所有佛，一切剎土極微數，悉於菩薩眾會中，皆為宣揚普賢行。如來安坐於一剎，一切剎中無不現，十方無盡菩薩雲，普共同來集其所。功德光明菩薩海，百千億剎極微數，俱從會起讚如來，遍往十方充法界。自在遊於深法界，悉住普賢無等行，現一切剎放光明，普入無邊諸佛會。普於十方一切剎，安住最勝諸佛所，聽聞正法具修行，一一土經無量劫。菩薩常修種種行，皆入普賢願海中，住佛境界德無邊，法海光明無不遍。通達普賢廣大行，出生諸佛無盡法，讚佛功德海無涯，現眾神通充法界。身雲普現如塵數，念念恒周一切剎，甘露法雨潤群生，普遍法界令開悟。」爾時，世尊以最勝甚深廣大意樂，正念思惟，欲令眾會諸菩薩等安住如來師子頻申大三昧故，從眉間白毫相中放大光明，名普照現三世法界門，以不可說佛剎極微塵數光明而為眷屬，普照十方一切剎海。時，逝多林菩薩眾會悉見十方盡法界、虛空界一切世界所有極微；一一極微各有一切佛剎極微塵數諸佛國土種種名字、種種色相、種種莊嚴、種種清淨、種種依住、種種形狀，如是一切諸國土中皆有最勝菩提道場；一一道場皆有莊嚴寶師子座；一一座上皆有菩薩成等正覺，一切菩薩所共圍遶，一切世主恭敬供養。或見處在不可說佛剎大眾會中轉正法輪，其聲無礙，遍周法界；或見處在天王宮中、龍王宮中、夜叉王宮、乾闥婆、阿修羅、迦樓羅、緊那羅、摩睺羅伽、人、非人等諸王宮中，及餘人間村營、城邑、王都、聚落、乃至種種眾生住處，現種種神力，說種種法門；所謂：生種種族姓、受種種色身、住種種威儀、示種種相好、佩種種圓光、放種種光網、處種種眾會、入種種三昧、起種種神變、現種種威力、發種種音聲、出種種言辭、以種種名句演種種教法，如此會中菩薩大眾見於如來甚深三昧廣大神變，如是盡法界、虛空界，東、西、南、北，四維，上、下，遍一切處，種種方轉變中、種種方法門中、種種方想住中、種種方出生中、種種方分齊中、種種方解起中、種種方海中，皆依於眾生心想而住，始從前際至今現在所有一切國土身、一切眾生身、一切毛孔中、一切極微中、及彼一切虛空界中、一一毛端量處皆有一切剎土極微塵數種種剎海、種種業起相續不斷，次第而住，其中所有道場眾會見佛神力悉亦如是，以得見佛神通力故，悉能遍入十方三世一切世界眾生心中，現其影像，隨諸眾生種種樂欲出妙言音，隨其所應演說諸法，普入眾會中，普現眾生前，色相有別，智慧無異，遍一切剎，盡未來際，自在示現，常無休息，教化調伏一切眾生，其有見此神通力者，皆是毘盧遮那如來過去修集願力善根之所攝受：或昔曾以四攝善根之所攝受；或是往昔見、聞、憶念、親近、供養之所成熟；或是往昔令其發起阿耨多羅三藐三菩提心；或昔曾於如來所修菩薩行時經遊之處，勇猛精勤善根所攝；或昔曾於一切佛所，與佛同種相似善根；或是如來於過去時為求無上一切智故，種種方便教化成熟。是故，皆得入於如來不可思議甚深三昧，盡法界、虛空界廣大神變：或有得見入佛法身；或有得見入佛色身；或有得見入佛智身；或有得見入於如來過去所行清淨行海；或有得見入於如來究竟圓滿功德彼岸；或有得見入於菩薩莊嚴行輪；或有得見入於菩薩所證諸地；或有得見入於如來成正覺智；或有得見入佛所住諸三昧門、平等神變；或有得見入於如來十種智力、四無所畏；或有得見入於如來四無礙解辯才大海；入如是等十不可說佛剎極微塵數如來種種大神變海，彼諸菩薩以種種信、種種解、種種道、種種門、種種入、種種教、種種隨順、種種方所、種種根器、種種國土、種種世界、種種智慧、種種法聚、種種神變、種種方便、種種三昧，以如是等入於如來神變大海。云何菩薩種種三昧？所謂：入一切菩薩普遍莊嚴法界三昧、菩薩光照三世無礙境三昧、菩薩法界無斷智光明三昧、菩薩住一切佛境界三昧、菩薩光照無邊虛空際三昧、菩薩入出遊戲如來自在力三昧、菩薩勇猛無畏奮迅莊嚴三昧、菩薩入一切法界方便漩澓藏三昧、菩薩遍法界如月普現以無礙音演一切法三昧、菩薩種種法雲平等莊嚴三昧、菩薩離垢繒繫頂法王幢三昧、菩薩觀一切佛智慧海三昧、菩薩無分別光幢照一切世間差別身三昧、菩薩入如來無分別境界身三昧、菩薩大悲藏隨一切世間轉三昧、菩薩安住一切法無依跡威力三昧、菩薩照一切法最極寂靜圓滿智三昧、菩薩知諸法空巧能化現遍一切世間三昧、菩薩威力平等普出生一切佛剎三昧、菩薩於一切佛剎現成正覺莊嚴相三昧、菩薩觀一切世間色空三昧、菩薩不著一切世間最勝圓滿空三昧、菩薩出生一切如來威力母三昧、菩薩修行入一切佛究竟功德海三昧、菩薩觀察一切境界出生神變盡未來際威力三昧、菩薩入一切如來次第本事海三昧、菩薩能以威力盡未來際護持一切如來種性三昧、菩薩以決定解力令現在十方一切佛剎皆清淨三昧、菩薩一剎那中普照一切佛差別住處三昧、菩薩深入觀察無礙際三昧、菩薩能以威力令一切世界為一佛剎三昧、菩薩出生一切佛變化身三昧、菩薩以金剛智知一切諸根海三昧、菩薩知一切如來同一胎藏身三昧、菩薩知一切法界隨所安立悉住心念際三昧、菩薩於一切法界廣大剎中現成正覺及般涅槃大威力三昧、菩薩令住最上威力處三昧、菩薩照一切佛剎眾生身無分別威力三昧、菩薩入一切佛智慧旋轉藏三昧、菩薩知一切法性相差別三昧、菩薩一剎那中以無分別智普見三世法三昧、菩薩念念中普現法界藏身三昧、菩薩以勇猛智如師子王隨順悟解一切如來種姓三昧、菩薩觀一切法界圓滿智慧眼三昧、菩薩正勇猛趣向十力三昧、菩薩以普遍眼觀察一切圓滿功德三昧、菩薩遍照出生一切眾生色相圓滿三昧、菩薩旋轉不動藏三昧、菩薩演說一法普入一切法三昧、菩薩於一法以一切言辭差別訓釋辯才三昧、菩薩演說一切佛無二法句威力幢三昧、菩薩知三世無礙際三昧、菩薩隨順悟解一切劫無差別三昧、菩薩入微細十力方便三昧、菩薩以金剛智起一切菩薩行三昧、菩薩能於十方隨心速疾普現身雲三昧、菩薩現遍法界成正覺身種種神變三昧、菩薩受一切觸安樂幢三昧、菩薩出一切莊嚴具莊嚴虛空界三昧、菩薩念念中出等一切世間數變化形像雲三昧、菩薩如來無垢月光照虛空三昧、菩薩一切如來加持三昧、菩薩一光照一切法根本差別莊嚴三昧、菩薩廣演一切法義燈三昧、菩薩照十力境圓滿三昧、菩薩三世諸佛星宿幢三昧、菩薩一切佛一密藏三昧、菩薩觀一切相皆究竟三昧、菩薩無盡福德藏三昧、菩薩見盡無邊佛境界三昧、菩薩見一切法如金剛師子吼威力三昧、菩薩現一切如來變化正見平等三昧、菩薩一切佛日念念周行三昧、菩薩一念普照三世法三昧、菩薩普音演說淨光等照一切法自性清淨三昧、菩薩見一切佛差別力三昧、菩薩見一切佛覺一切差別法界如蓮華開敷三昧、菩薩觀察諸法如虛空無住處三昧、菩薩一方普出十方海旋轉藏三昧、菩薩入一切法界門三昧、菩薩一切法海差別藏身三昧、菩薩以寂靜身放差別光照一切眾生身三昧、菩薩一剎那心以大願力出生一切神通三昧、菩薩常於一切處正覺威力普遍三昧、菩薩隨順悟解以一莊嚴入一切法界三昧、菩薩正念一切佛身普照三昧、菩薩悟解最勝神通智遍一切世界三昧、菩薩一念令無量教字本母普遍法界三昧、菩薩以一教法莊嚴一切法界法光明三昧、菩薩一切佛威力光明圓滿輪三昧、菩薩以行願網攝一切眾生界三昧、菩薩見一切世界不斷絕三昧、菩薩蓮華吉祥種種神變普遊步三昧、菩薩知一切眾生身旋轉智三昧、菩薩威力普現一切眾生前三昧、菩薩悟解一切眾生音聲言辭祕密海三昧、菩薩觀一切眾生差別智三昧、菩薩無分別大悲藏三昧、菩薩入一切如來際三昧、菩薩觀察一切如來解脫處師子頻申三昧。彼諸菩薩以如是等不可說佛剎極微塵數菩薩三昧而為方便，入毘盧遮那如來過去所修廣大功德，念念充滿一切法界諸佛三昧大神變海，其諸菩薩住逝多林不離如來道場眾會，各各自見普於十方一切佛剎極微塵數廣大世界，坐於種種寶蓮華藏師子之座，皆已具足廣大智慧，普現種種神通境界，已住寂靜諸菩薩地，自在出生明利智慧，已得隨順普遍智行從佛智慧種性而生，已證現前一切智智得無癡翳清淨智眼，善巧調御一切眾生，住一切佛平等法性，於一切法隨順悟解，已能觀察一切諸法自性清淨，知諸世間究竟寂滅無有所依，普詣十方一切國土而無所著，常勤觀察一切世間而無所住，普往十方一切剎土而無所去，已入一切妙法宮殿而無所來，遍於諸法了達性空知無積聚而恒教化成熟眾生，示諸眾生安樂行處，開示智慧解脫境界，恒以智身住離貪際超越一切生死苦海，普示眾生諸蘊實際，智光圓滿照徹一切定力堅固無能傾動，於諸眾生常起大悲了一切法悉皆如幻，知諸世間悉皆如夢，觀一切佛現差別身悉皆如影，知所說法音聲語言悉皆如響，現見諸法生成住持悉皆如化，善能積集最勝行願，普遍智慧，圓滿清淨，善巧隨順，究竟寂靜，善入總持種智境界，具足無畏諸三昧力，勇猛精進遍修諸行，住法界際，獲明智眼，到一切法無所住處，修習無邊智慧行海，到智波羅蜜究竟彼岸，得般若波羅蜜之所攝持，以神通波羅蜜度諸眾生，依禪波羅蜜得心自在，證一切佛真實境界，以善巧智開示法藏，以明了智訓釋文詞，以辯才力說無盡法，雄猛無畏能師子吼，常樂觀察無差別法，以淨慧眼普觀一切，無生智月等照世間，觀諸眾生，見真實諦，福智堅固如金剛山，一切譬諭說不能及，增長一切智慧根芽，勇猛精進，摧諸魔眾，無量智慧，威光圓滿，身相殊特超諸世間，得一切法無礙智慧，解了諸法，盡無盡際，智慧清淨住普遍際，能遍隨順入真實際，無相觀智常現在前，善巧圓滿諸菩薩行，以無二智觀諸世間，知諸眾生往來所趣，遍諸佛剎得圓滿智，於一切法離諸暗障，普放法光照十方界，為諸世間最勝福田，廣大願輪如月普現，福德超勝如須彌山一切世間無能過者，摧伏一切外道、邪論，於一切剎普現其身，以微妙音演說諸法，普見諸佛心無厭足，已得諸佛自在威力，隨所應化現種種身，乘大智舟汎生死海，周旋普濟所往無礙，智慧圓滿身光映徹，如日輪出普照世間，隨眾生心現眾色像，知諸眾生根性欲樂，入於無諍清淨境界，知一切法自性無生，以自在智能令一切小大境界互相涉入，決了佛地甚深理趣，知諸世間文字、句義，以無盡句說無盡法，於一句中演出一切修多羅海，具足獲得廣大智慧陀羅尼身，隨所受持盡未來劫，初無忘失，一念能憶不可說劫宿住之事，一念能了三世一切諸眾生心，與諸眾生一切諸佛總持法藏，常轉清淨不退法輪，令諸眾生生大智慧，入佛境界，具一切智，常善安住甚深三昧，巧能分別一切法句，而於諸法悉無所著。最勝智慧自在遊戲，於諸境界皆得解脫，觀察一切淨莊嚴身，其身普入十方法界，隨所應化，悉能遍往，知諸剎海所有極微，悉於其中現成正覺，於無色性現一切色，能以一方入一切方，其諸菩薩具足如是無量智慧功德之藏，十方所有一切諸佛悉共稱揚，說其功德不能令盡，靡不咸在逝多林中，悉見於佛光明所照，深入如來功德大海。爾時，彼諸菩薩得不思議正法光明照故，其心歡喜安隱快樂，各於其身及師子座，眾寶樓閣諸莊嚴具遍逝多林，凡所受用一切物中，化出種種大莊嚴雲，充滿十方一切法界。所謂：於念念中普放一切微妙廣大光明網雲，充滿法界，遍能開覺一切眾生，咸令歡喜；於念念中出現一切摩尼鈴雲，充滿法界，出微妙音稱揚讚歎三世諸佛一切功德；於念念中出現一切天音樂雲，充滿法界，出微妙音演說眾生諸業果報；於念念中出現一切諸大菩薩種種行願身色相雲，充滿法界，悉以妙音說諸菩薩所有一切廣大行願；於念念中出現一切如來自在種種神通妙變化雲充滿法界，以隨類音遍眾生界演說諸佛廣大言音；於念念中出現一切種種莊嚴諸相隨好菩薩身雲，充滿法界遍一切剎，說諸如來普於十方一切國土出興次第，相續不斷；於念念中出現一切三世如來菩提場雲，充滿法界，顯現諸佛成等正覺，普遍觀察顯示成佛莊嚴功德；於念念中出現一切諸大龍王相似身雲，充滿法界，一一身雲，遍諸佛剎普雨一切諸上妙香；於念念中出現一切諸世間主相似身雲，充滿法界，一一世主普遍觀察演說普賢菩薩之行；於念念中出現一切妙寶光明淨佛剎雲，充滿法界，顯示十方一切諸佛所轉法輪，是諸菩薩以得如是不可思議光明所照，入於廣大不可思議神通境界，法應如是，出興此等不可說佛剎極微塵數種種神變大莊嚴雲。爾時，文殊師利菩薩摩訶薩承佛威力，欲重開示逝多林中諸神變事，觀察十方，而說偈言：「汝應觀此逝多林，廣博莊嚴量無際，一切身雲皆示現，以佛威神充法界。清淨色相莊嚴身，十方無量諸佛子，咸來影現道場中，眾會普觀無不見。從諸佛子毛孔中，演佛法音若雷震，焰雲種種莊嚴相，普遍十方一切剎。又於寶樹華葉中，出現梵釋莊嚴相，動止威儀恒寂靜，從禪定起而遊步。佛身一一毛孔中，常現難思眾菩薩，相好端嚴甚微妙，悉與普賢菩薩等。逝多林上諸嚴具，充遍虛空發妙音，讚說三世諸菩薩，種種莊嚴功德海。逝多林中諸寶樹，亦出無量妙音聲，演說一切諸群生，種種業報差別海。林中所有諸境界，悉現三世諸如來，十方剎海極微中，皆起神通無不遍。一切剎海極微中，所有十方諸國土，於佛一一諸毛孔，普遍莊嚴皆顯現。寶焰香雲皆現佛，等眾生數遍世間，一一咸起大神通，方便隨宜而化度。如虛空量寶宮城，盡妙莊嚴如日現，寶藏及與菩提樹，靡不普遍於十方。十方三世諸如來，所有道場菩薩眾，劫海修行功德相，一切於此林中現。普賢大行諸菩薩，已於剎海具莊嚴，其數無量等群生，於此林中無不見。」爾時，彼諸菩薩蒙佛三昧光明照故，一一皆得不可說佛剎極微塵數大悲門；以得如是大悲門故，攝受利益安樂眾生，即於其身一一毛孔各出不可說佛剎極微塵數眾色光明，一一光明各各化現不可說佛剎極微塵數菩薩身雲，復出一切世主相似身雲，充滿十方一切法界，普現一切諸眾生前，隨諸眾生身相、言音，種種方便教化調伏，令其成熟，或現不可說佛剎極微塵數諸天宮殿退墮無常門；或現不可說佛剎極微塵數一切眾生隨業受生門；或現不可說佛剎極微塵數夢中境界令心覺悟門；或現不可說佛剎極微塵數一切菩薩圓滿諸行門；或現不可說佛剎極微塵數一切菩薩圓滿大願門；或現不可說佛剎極微塵數震動世界門；或現不可說佛剎極微塵數一切如來悉捨內外檀波羅蜜門；或現不可說佛剎極微塵數一切如來修諸功德正行圓滿尸波羅蜜門；或現不可說佛剎極微塵數一切菩薩斷截肢體、心無動亂羼提波羅蜜門；或現不可說佛剎極微塵數一切菩薩勤修種種智慧神通毘梨耶波羅蜜門；或現不可說佛剎極微塵數修諸靜慮、等持、等至、神通解脫禪波羅蜜門；或現不可說佛剎極微塵數智光照世般若波羅蜜門；或現不可說佛剎極微塵數勤求佛法，為一一名句、一一文義皆捨國城妻子財物無數身命門；或現不可說佛剎極微塵數於諸如來親近、供養、諮求、請問一切法要心無疲厭門；或現不可說佛剎極微塵數隨諸眾生根欲成熟往詣其所開發示導令其悟入智海光明門；或現不可說佛剎極微塵數一切菩薩大福智聚摧伏眾魔制諸外道勝幢威力門；或現不可說佛剎極微塵數知一切工巧技術明智門；或現不可說佛剎極微塵數知一切眾生心行微細差別明智門；或現不可說佛剎極微塵數知一切諸法種類差別殊勝明智門；或現不可說佛剎極微塵數知一切眾生種種心樂差別明智門；或現不可說佛剎極微塵數知一切眾生根行差別，煩惱習氣令其除滅明智門；或現不可說佛剎極微塵數知一切眾生品類差別業報明智門。以如是等不可說佛剎極微塵數諸方便門，往詣一切眾生住處，攝受調伏而成熟之。所謂：或往梵王宮；或往帝釋宮，或時往詣天、龍、夜叉、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽、人、非人等閻摩羅界諸王宮中；或往畜生、餓鬼、地獄之所住處，以平等大悲、平等大願、平等智慧、平等三昧、教化攝取而調伏之；彼諸眾生或有見已而調伏者、或有聞已而調伏者、或有憶念而調伏者、或聞音聲而調伏者、或聞名號而調伏者、或見圓光而調伏者、或見光網而調伏者，隨諸眾生心之所樂，皆詣其所，令其獲益；而此林中一切菩薩為欲成熟諸眾生故，雖以神力：或時現處種種嚴飾諸宮殿中；或時示現住自樓閣寶師子座道場眾會所共圍遶，充滿十方一切剎海，普遍示現皆令得見，然亦不離此逝多林如來之所；又此菩薩為欲成熟諸眾生故，示現無量變化身雲，或現其身眷屬莊嚴，或現其身獨一無侶。所謂：或現沙門身、或現婆羅門身、或現異道出家身、或現苦行身、或現充盛身、或現醫王身、或現商主身、或現婬女身、或現妓樂身、或現毘沙門身、或現世主身、或現奉事諸天身、或現工巧技術身，現如是等諸變化身，往詣一切諸眾生所，隨其所應，起如幻智。於諸世間猶如帝網行菩薩行，以種種形相、種種威儀、種種音聲、種種言論、種種住處演說諸法。所謂：或說一切世間工巧事業、或說一切福德智慧照世明燈、或說一切所證真實威力加持、或說一切業力所持莊嚴世趣、或說一切建立十方清淨乘位、或說一切圓滿智燈照法境界，如是菩薩雖普周遍十方法界，教化調伏，成熟眾生，而亦不離此逝多林如來之所。◎大方廣佛華嚴經卷第三大方廣佛華嚴經大方廣佛華嚴經卷第四罽賓國三藏般若奉詔譯入不思議解脫境界普賢行願品◎爾時，文殊師利童子從善住樓閣出，與無量同行大菩薩眾，及常侍衛諸金剛神、普為世間現大威力身眾神、久發堅誓供養諸佛足行神、念昔大願樂聞正法相續不斷主地神、深淨大悲莊嚴法界普潤眾生主水神、智慧威力光明遍照主火神、摩尼寶冠以嚴其首主風神、光照十方差別儀式主方神、專勤除滅無明黑闇主夜神、一心開現如來智日主晝神、普遍莊嚴虛空法界主空神、能勤方便拔濟眾生出生死海主海神、常勤積集出過心量趣一切智勝幢善根主山神、發大誓願運度眾生稱讚諸佛勇猛無倦主河神、常勤守護一切眾生菩提心城主城神、常勤守護一切眾生諸大龍王、常勤守護一切智城諸夜叉王、常令眾生增長歡喜乾闥婆王、常勤除滅一切餓鬼所有飢渴鳩槃茶王、恒願拔濟一切眾生度生死海迦樓羅王、願諸眾生普得成就超諸世間如來力身阿脩羅王、曲躬恭敬樂見諸佛種種功德摩睺羅伽王、深厭生死常樂瞻仰諸佛相好諸大天王、尊重於佛恭敬供養稱揚讚歎諸大梵王。文殊師利與如是等種種色像威德莊嚴大菩薩眾及諸世主，前後圍遶，從自住處來詣佛所，右遶如來，經無量匝，以諸供具種種供養，供養畢已，頂禮辭退，右遶而出，往於南方。爾時，尊者舍利弗承佛神力，見文殊師利菩薩與如是等諸大菩薩及諸世主，種種神通威德自在眾會莊嚴，從逝多林安詳而出，作是思惟：「我今當與文殊師利俱往南方。」時，舍利弗即與眷屬六十比丘前後圍遶，出自住處，往詣佛所。到已頂禮，一心觀佛，具白世尊，世尊聽許，右遶三匝，作禮辭退，往文殊師利童子所。此諸比丘皆舍利弗之所化度，出家未久，自所同住。所謂：海覺比丘、妙德比丘、福光比丘、大悲比丘、電德比丘、淨行比丘、天德比丘、實慧比丘、梵勝比丘、寂慧比丘，與如是等六十人俱，曾於過去供養諸佛，深種善根；於甚深法悉能悟解，深信趣入最極清淨志行寬博等佛境界，於佛教法能正修行，悉能了知諸法本性，能大饒益成熟眾生，常樂勤求諸佛功德，皆是文殊師利童子之所教化。◎◎爾時，尊者舍利弗將諸比丘隨路而行，觀諸比丘，告海覺言：「汝可觀察文殊師利清淨相好莊嚴之身，諸天及人莫能思議；汝可觀察文殊師利圓光映徹普照十方，能令眾生心生歡喜；汝可觀察文殊師利放光明網，微妙莊嚴，除滅眾生無量苦惱；汝可觀察文殊師利眾會威德，皆是菩薩往昔善根之所攝受；汝可觀察文殊師利所行之路，左右八步清淨平坦，眾寶莊嚴；汝可觀察文殊師利所住之處，周迴十方，常有道場，顯現莊嚴隨逐而轉；汝可觀察文殊師利所行之路，具足無量福德莊嚴，左右兩邊皆有伏藏，種種珍寶自然而出；汝可觀察文殊師利由昔供養諸佛善根，隨其所在有雜寶樹，於其樹間寶藏開敷出莊嚴具；汝可觀察文殊師利隨其所在一切世主興供養雲，雨諸供具周布陳列，以為供養；汝可觀察文殊師利十方諸佛將說法時，悉放眉間白毫光明，來照其身從頂上入。」爾時，尊者舍利弗為諸比丘稱揚讚歎，開示演說文殊師利如是無量種種功德具足莊嚴。時，諸比丘聞是讚已，心意清淨，信解堅固，踊躍歡喜不能自持，形體柔軟，諸根和悅，垢障咸盡，憂苦悉除，常見諸佛，恒聞正法，迴向趣求一切智智，成就菩薩無礙善根，逮得菩薩無量諸力，出生無盡圓滿大悲，發起無邊廣大誓願，深入諸度究竟彼岸，十方佛海皆悉現前，於佛境界深生信樂，即白尊者舍利弗言：「唯願和尚將道我等親近於彼勝妙丈夫。」時，舍利弗即與俱行詣文殊師利童子所，見已頂禮，白言：「仁者！此諸比丘願得奉覲。」爾時，文殊師利童子與無量自在神通菩薩圍遶，并其大眾種種眷屬，如象王迴觀諸比丘。時，諸比丘頭面禮足，恭敬合掌，白如是言：「唯願大聖文殊師利，和尚舍利弗，世尊釋迦牟尼，悉當證知，我等今以得見大士勝妙丈夫，奉覲瞻禮，恭敬信樂所有善根，及以我等過去所集福智善根，以此善根願令我等於仁所有如是色身、如是相好、如是音聲、如是自在、一切功德悉當具得。」爾時，文殊師利菩薩告諸比丘言：「若善男子、善女人成就十種趣大乘法無疲厭心，則能速疾深入如來究竟之地，況菩薩地？何等為十？所謂：見諸如來，以廣大心親近供養，心無疲厭；積集成就一切善根，究竟不退，心無疲厭；勤求一切諸佛正法，心無疲厭；勤行一切菩薩殊勝諸波羅蜜，心無疲厭；普遍修習一切菩薩甚深三昧，心無疲厭；次第趣入三世流轉一切諸法，心無疲厭；莊嚴十方一切剎海悉令清淨，心無疲厭；教化調伏一切眾生皆令成熟，心無疲厭；於一切剎行菩薩行，經一切劫，心無疲厭；為欲成熟一眾生故，修一切剎極微塵數波羅蜜門，成就圓滿如來一力，如是次第為一切眾生成就如來一切智力，心無疲厭。比丘當知，若善男子、善女人成就深信發此十種無疲厭心，則能長養一切善根，捨離一切生死流轉，悉能超出一切世間，不墮聲聞、辟支佛地，成就如來一切種性，滿足菩薩清淨大願，積集一切如來功德，修行一切菩薩諸行，獲得如來力無所畏，摧伏眾魔及諸外道，滅除一切煩惱、習氣，入菩薩地，近如來地。時，諸比丘聞此法已，即時同證廣大三昧，名見一切佛境界無礙眼。得此三昧威神力故，悉見十方一切世界諸佛如來及其所有道場眾會；亦悉見彼一切世界所有眾生種種趣類各各差別；亦悉見彼一切世界同異染淨各各差別；亦悉見彼一切世界所有極微塵相差別；亦悉見彼諸世界中一切眾生所住宮殿種種莊嚴、種種成就及所受用種種資具各各差別；及聞彼佛諸音聲海；演說諸法種種名句、文詞、訓釋、性相、祕密悉能解了；亦能觀察彼世界中一切眾生心行根欲各各差別；亦能憶念彼世界中一切眾生過去、未來各十生事；亦能憶念彼世界中過去、未來各十劫事；亦能憶念彼諸如來十本生事、十成正覺、十轉法輪、十種神通、十種記心、十種教誡、十種說法、十種辯才。又由得此三昧力故，即時獲得十千真實菩提之心，成就十千甚深三昧，具足十千諸波羅蜜，圓滿十千智慧光明，發起十千自在神力，以得如是菩薩三昧種種威神無礙勢力所莊嚴故，令其身心柔軟微妙增長信樂住菩提心堅固不動。」爾時，文殊師利菩薩具足安住真實吉祥微妙功德普賢勝行，勸諸比丘令其安住勝普賢行，住勝行已，入於甚深廣大願海；入願海已，普遍成就甚深大願；以得成就大願海故，得心清淨；心清淨故，得身清淨；身清淨故，得身輕利；身輕利故，則得廣大不退神通。以得如是大神通故，不離文殊師利足下，普於十方一切世界諸如來所，悉現其身，具足成就一切佛法。爾時，文殊師利菩薩勸諸比丘發阿耨多羅三藐三菩提心已，漸次\n\n## 四、五十三参总表（锚点级·逐参批核订）\n\n提取法：到达句「見/詣＋名＋身份」＋请法锚「我已先發阿耨多羅三藐三菩提心」（46锚）配对；表列 T0293 译名、身份、八十对照名。**参界精确切分随逐参批完成**〔预登记〕。\n\n| 参 | 善知识（T0293） | 身份 | 八十对照 |\n|---|---|---|---|\n| 1 | 文殊師利童子 | 會首（本国所示） | — |\n| 2 | 吉祥雲比丘 | 比丘 | 德雲比丘 |\n| 3 | 海雲比丘 | 比丘 | 海雲比丘 |\n| 4 | 妙住比丘 | 比丘 | 善住比丘〔核订〕 |\n| 5 | 彌伽大師 | 大師 | 彌伽大師 |\n| 6 | 解脫長者 | 長者 | 解脫長者 |\n| 7 | 海幢比丘 | 比丘 | 海幢比丘 |\n| 8 | 伊舍那優婆夷 | 優婆夷 | 休捨優婆夷 |\n| 9 | 毘目瞿沙仙人 | 仙人 | 毘目瞿沙仙人 |\n| 10 | 勝熱婆羅門 | 婆羅門 | 勝熱婆羅門 |\n| 11 | 慈行童女 | 童女 | 慈行童女 |\n| 12 | 妙見比丘 | 比丘 | 善見比丘 |\n| 13 | 根自在主童子 | 童子 | 自在主童子 |\n| 14 | 具足優婆夷 | 優婆夷 | 具足優婆夷 |\n| 15 | 明智居士 | 居士 | 明智居士 |\n| 16 | 寶髻長者 | 長者 | 寶髻長者 |\n| 17 | 普眼長者 | 長者 | 普眼長者 |\n| 18 | 無厭足王 | 王 | 無厭足王 |\n| 19 | 大光王 | 王 | 大光王 |\n| 20 | 不動優婆夷 | 優婆夷 | 不動優婆夷 |\n| 21 | 遍行外道 | 外道 | 遍行外道 |\n| 22 | 廣博鬻香長者 | 長者 | 優缽羅華鬻香長者 |\n| 23 | 婆施羅船師 | 船師 | 婆施羅船師 |\n| 24 | 最勝長者 | 長者 | 無上勝長者 |\n| 25 | 師子頻申比丘尼 | 比丘尼 | 師子頻申比丘尼 |\n| 26 | 伐蘇蜜多女 | 女 | 婆須蜜多女 |\n| 27 | 鞞瑟胝羅居士 | 居士 | 鞞瑟胝羅居士 |\n| 28 | 觀自在菩薩 | 菩薩 | 觀自在菩薩 |\n| 29 | 正趣菩薩 | 菩薩 | 正趣菩薩 |\n| 30 | 大天 | 天神 | 大天 |\n| 31 | 安住地神 | 地神 | 安住地神 |\n| 32 | 婆珊那演底夜神〔核订〕 | 夜神 | 婆珊那演底主夜神 |\n| 33 | 普德淨光夜神〔核订〕 | 夜神 | 普德淨光主夜神 |\n| 34 | 普德救護眾生夜神〔核订〕 | 夜神 | 普德救護眾生主夜神 |\n| 35 | 喜目觀察眾生夜神 | 夜神 | 喜目觀察眾生主夜神 |\n| 36 | 普救眾生妙德眼夜神〔核订〕 | 夜神 | 普救眾生妙德眼夜神 |\n| 37 | 具足功德寂靜音海夜神 | 夜神 | 寂靜音海主夜神 |\n| 38 | 守護一切城增長威德主夜神 | 夜神 | 守護一切城主夜神 |\n| 39 | 開敷一切樹華安樂主夜神 | 夜神 | 開敷一切樹花主夜神 |\n| 40 | 大願精進神力救護夜神〔核订〕 | 夜神 | 大願精進神力救護眾生夜神 |\n| 41 | 妙德圓滿夜神〔核订〕 | 夜神 | 妙德圓滿神 |\n| 42 | 釋女瞿波 | 女 | 瞿波女 |\n| 43 | 摩耶夫人 | 佛母 | 摩耶夫人 |\n| 44 | 天主光天女〔核订〕 | 天女 | 天主光天女 |\n| 45 | 遍友童子師〔核订〕 | 師 | 遍友童子師 |\n| 46 | 善知眾藝童子〔核订〕 | 童子 | 善知眾藝童子 |\n| 47 | 賢勝優婆夷 | 優婆夷 | 賢勝優婆夷 |\n| 48 | 堅固解脫長者〔核订〕 | 長者 | 堅固解脫長者 |\n| 49 | 妙月長者 | 長者 | 妙月長者 |\n| 50 | 無勝軍長者〔核订〕 | 長者 | 無勝軍長者 |\n| 51 | 最寂靜婆羅門 | 婆羅門 | 最寂靜婆羅門 |\n| 52 | 德生童子·有德童女 | 童子童女 | 德生童子·有德童女 |\n| 53 | 彌勒菩薩 | 菩薩 | 彌勒菩薩 |\n| 54 | 文殊師利菩薩（遥指·不见面） | 菩薩 | 文殊師利菩薩（摄归·不入参数） |\n| 55 | 普賢菩薩 | 菩薩 | 普賢菩薩（摄归·不入参数） |\n\n\n\n## 参批1（L.289·参1–4·注入 14,095 CJK）\n\n#### 参1·文殊師利童子（本国指授）\n\n**参题解**：福生城东·庄严幢娑罗林大塔庙处——往昔诸佛所止、毘卢遮那行菩萨行舍难舍处；文殊于此说《普照法界圓滿光明》修多罗（百万亿那由他修多罗为眷属）。善财出身：福城五百童子之一（与善禁、善戒、善思惟等五百人俱）。\n\n**【要点提炼】**\n\n1. **发心即入场券**：文殊印言「若有眾生能發阿耨多羅三藐三菩提心，是事為難；能發心已，復欲勤求行菩薩行倍更為難」——发心已是难得，求行更是难中之难。\n2. **求善知识三戒**：「求善知識勿生疲懈，見善知識勿生厭足，於善知識所有教誨當念隨順不應違逆……但應恭敬勿見過失」——此三戒是全品53参的读法总钥匙。\n3. **法会效验**：龙众闻《普照法界光明》即「自厭龍趣……咸捨龍身」——说法之处即转化之场；善财之问非抽象求知，是从这一真实法会中长出来的。\n\n**【阐释】**（〔本文判断〕）参1是全品的**授权仪式**：善财的发心被文殊（般若智之人格化）认领，并翻转为一个可执行的指令——「求善知识」。妙在文殊不亲授行法，只教「如何找老师」：把修行翻成善知识学。大塔庙处是过去诸佛与毘卢遮那舍身之地——善财的出发地本身即是一堂舍身行菩萨行的实物课；于此处起行，行门之重自明。\n\n**【对照/启发】**：八十华严同段译名略同（福生城·大塔庙）〔逐参对勘待批〕。启发：三戒可移植为今日读此品的姿态——读到任何一参，问自己：我生疲懈了吗？见厌足了吗？见过失了吗？三问不过，方算入门。\n\n**本参经文全引**（T0293·3,016 CJK·0 手抄）：\n\n> 南行，經歷人間城邑、聚落、至福生城。於其城東，住莊嚴幢娑羅林中，往昔諸佛曾所止住，教化成熟一切眾生大塔廟處；亦是世尊毘盧遮那於往昔時行菩薩行，能捨無量難捨之處。是故，此林名稱普聞無量佛剎，此處常為天、龍、夜叉、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽、人、非人等，恭敬供養。時，文殊師利與諸眷屬到此林已，即於其處坐師子座，說修多羅名普照法界圓滿光明，百萬億那由他修多羅以為眷屬。說此經時，有無量百千億那由他諸大龍王并其眷屬，聞此法已，自厭龍趣，於佛功德深生愛樂，咸捨龍身生人天中；一萬諸龍，於阿耨多羅三藐三菩提得不退轉；復有無量無數眾生於三乘中各得成熟。時，福城人聞文殊師利住莊嚴幢娑羅林中大塔廟處，皆從城出來詣其所，有優婆塞名曰大慧，與其眷屬五百人俱，所謂：須達多優婆塞、寶德優婆塞、圓光優婆塞、名稱天優婆塞、月吉祥優婆塞、月喜優婆塞、月智優婆塞、大智優婆塞、賢護優婆塞、賢吉祥優婆塞，如是等眾前後圍遶，來詣文殊師利童子所，到已禮足，右遶三匝，却坐一面。復有優婆夷名曰大慧，與其眷屬五百人俱，所謂：妙圓光優婆夷、梵德優婆夷、吉祥優婆夷、妙臂優婆夷、賢光優婆夷、賢吉祥優婆夷、月光優婆夷、星宿光優婆夷、賢德優婆夷、妙眼優婆夷，如是等眾前後圍遶，來詣文殊師利童子所，到已禮足，右遶三匝，却坐一面。復有童子名曰善財，與其眷屬五百人俱，所謂：善禁童子、善戒童子、善威儀童子、善行童子、善思惟童子、善智童子、善慧童子、善眼童子、善臂童子、善光童子，如是等眾前後圍遶，來詣文殊師利童子所，到已禮足，右遶三匝，却坐一面。復有童女，名曰妙賢，與其眷屬五百人俱，所謂：大慧童女、善賢童女、端嚴面童女、堅善慧童女、吉祥賢童女、吉祥智童女、供養德童女、吉祥圓光童女、妙覺童女，如是等眾前後圍遶，來詣文殊師利童子所。到已禮足，右遶三匝，却坐一面。爾時，文殊師利童子知福城人悉已來集，普遍觀察，隨其心樂，即以神力現自在身，威光赫奕，蔽諸大眾；以大慈力令其眾會皆得安隱，清涼快樂；以大悲力起說法心普遍成就；以大智力令其開悟滅除一切煩惱心垢；以無礙辯將說甚深廣大佛法。復於是時觀察善財，以何因緣而立此名；知此童子初入胎時，於其宅內自然而出七寶樓閣，其樓閣下有七伏藏，於其藏上生七寶芽，所謂：金、銀、瑠璃、玻瓈、赤珠、硨磲、碼碯；善財童子處胎十月然後誕生，形體端正，肢分具足，其七伏藏縱廣高下，量各七肘，忽自開現光明照耀，內外家族視之無厭；復於宅中自然而有五百寶器，珍奇雜寶各各盈滿，所謂：金剛器中盛滿諸香，於香器中盛種種衣，美玉器中盛滿飲食，摩尼器中盛滿雜寶，黃金器中盛滿銀粟，白銀器中盛滿金粟，金銀器中盛滿瑠璃，瑠璃器中盛滿金銀，及摩尼寶玻瓈器中盛滿硨磲，硨磲器中盛滿玻瓈，碼碯器中盛滿赤珠，赤珠器中盛滿碼碯，星幢摩尼器中盛滿水精、摩尼水精，摩尼器中盛滿星幢摩尼，如是等五百寶器自然出現；復於宅中遍雨種種珍寶財物及諸資具，一切庫藏悉皆充滿，以此事故，父母、親屬及善相師共呼此兒名曰善財；又知此童子已曾供養過去諸佛，深種善根；信解廣大，常樂親近諸善知識，身、語、意業皆無過失，勇猛精進，淨菩薩道，求一切智，成佛法器，心行清淨，猶如虛空。爾時，文殊師利菩薩如是觀察善財童子殊勝相已，熙怡微笑，安慰開諭，廣為演說一切佛法，所謂：說一切佛積集法、說一切佛相續法、說一切佛次第深入法、說一切佛眾會清淨法、說一切佛法輪化導法、說一切佛色身相好清淨法、說一切佛法身普遍成就法、說一切佛無礙辯才法、說一切佛圓滿莊嚴法、說一切佛平等無二法。爾時，文殊師利童子為善財童子及諸大眾說此法已，復以種種善巧方便，慇懃勸諭令其開覺，增長勢力，生大歡喜，發阿耨多羅三藐三菩提心；又令善財憶念過去所種善根；復為福城一切人眾，隨其根欲，顯現神通，如所應度廣為說法，然後而去。爾時，善財童子從文殊師利童子所，聞說諸佛如是種種勝妙功德大威力已，勤求愛樂阿耨多羅三藐三菩提，隨逐文殊師利，瞻戀不捨，一心歸向，合掌諦觀，而說偈言：「有大智慧威神力，行菩提行利眾生，無量境界誓當求，唯願仁尊哀聽許。愛水深濬為池塹，憍慢高舉為垣牆，諸趣出入為門戶，三有難超作城郭。癡闇無明常所覆，貪恚熾盛火恒燒，魔王自在處其中，愚童凡夫依止住。諂誑忿恨惑亂戲，貪欲所纏如羂索，疑惑所蔽若生盲，恒行險趣諸邪道。常為慳嫉之所縛，入於三塗八難中，五趣輪迴不覺知，恒受生老病死苦。滅惑大悲清淨日，智光普照圓滿輪，能竭生死煩惱海，願降慈光少觀察。圓滿大慈清淨月，福德光明無垢輪，一切眾生咸施安，願賜清涼少觀察。一切法界功德王，白業成就為輪寶，所向導前無所礙，願順我心垂教勅。廣博福智大商主，勇猛不退求菩提，普利一切諸眾生，唯願垂悲拔濟我。身被最勝忍辱甲，手提明利智慧劍，常能自在破魔軍，願雄猛者守護我。安住妙法須彌頂，遶以三昧諸天女，摧滅業惑阿脩羅，真實帝釋願觀我。三有昏闇凡愚宅，煩惱輪迴地趣因，仁尊永滅盡無餘，照世真燈示我道。眾生惡趣行已除，修治善道咸清淨，度諸有海橋梁者，示我真乘解脫門。常樂我淨顛倒想，厚重邪執常迷覆，明利智眼悉能除，開我真乘解脫路。善了真諦無迷惑，於諸法中無所畏，調伏眾生自在人，願示於我菩提道。安住如來正見地，增長諸佛功德樹，雨一切佛妙法華，願速示我菩提道。去來現在一切佛，如日光明出世間，為眾能開甘露門，彼所得道願宣說。能善解除諸業縛，巧轉諸乘妙法輪，智慧決了自在人，示我普焰摩訶衍。大悲為轂行願輪，信鎋深固堅忍軸，淨功德寶真實轅，令我載此菩提乘。一切總持圓滿箱，慈愍普覆莊嚴蓋，妙辯才音鈴震響，令我載此最上乘。清淨戒品為茵蓐，諸妙三昧為采女，法鼓洪音警有情，令我載此摩訶衍。具足四攝無盡藏，莊嚴瓔珞功德寶，自他慚愧為羈鞅，令我載此無上乘。常放大捨圓滿光，恒塗淨戒真實香，永滅煩惱瘡疣者，令我載此最勝乘。三業調伏不退輪，六根寂靜三昧箱，最勝智慧方便軛，令我載此妙法乘。大願迴向善御者，總持諸法堅固力，智慧周旋常遍轉，令我載此速疾乘。交絡普賢諸行網，悲心廣運能徐轉，所行無畏得安詳，令我載此無上乘。任持堅固等金剛，妙智巧成如幻事，一切障礙皆能斷，令我速載普賢乘。大慈無垢等群生，普與世間賢聖樂，淨智如空照法界，願速令我載此乘。能淨一切業惑塵，亦斷世間流轉苦，摧伏諸魔及外道，令我載此妙法乘。智慧境界等虛空，行力莊嚴遍法界，普滿一切群生欲，願速令我載此乘。志樂清淨量難窮，無明愛見皆除滅，利益一切心無盡，願速令我載此乘。願力如風速疾行，定心安住恒無動，普運一切諸含識，願速令我載此乘。堅誓如地永無傾，大悲如水恒饒益，勇健荷擔無疲倦，願速令我載此乘。普照眾生智慧日，四攝光明圓滿輪，總持勝妙清淨光，願示於我咸令見。能於劫海勤修學，一切種智圓滿因，摧滅堅執有為城，與我如是金剛智。仁於諸佛大智海，獲是智海廣無涯，一切佛德靡不充，善哉大聖當宣說。已入法王妙法城，已冠智王大智冠，已繫諸佛離垢繒，最勝智眼願觀察。」爾時，文殊師利菩薩如象王迴觀察善財，作如是言：「善哉！善哉！善男子！汝已能發阿耨多羅三藐三菩提心，復欲親近諸善知識，行菩薩行，問諸菩薩所行之道。善男子！親近供養諸善知識，是集一切智最初因緣。由樂親近善知識故，令一切智疾得成滿。是故，於此勿生疲厭。」善財白言：「聖者！唯願慈悲，廣為我說，我應云何學菩薩行？應云何修菩薩行？應云何起菩薩行？應云何行菩薩行？應云何滿菩薩行？應云何淨菩薩行？應云何轉菩薩行？應云何深入菩薩行？應云何出生菩薩行？應云何觀察菩薩行？應云何增廣菩薩行？應云何成就菩薩行？應云何令普賢行速得圓滿？」爾時，文殊師利菩薩為善財童子，而說偈言：「善哉清淨功德海，佛子能來至我所，發起廣博大悲心，勇猛志求無上覺。為欲度脫諸有情，一切世間流轉苦，已發大願深如海，勤修一切菩薩行。若有菩薩心堅固，久處生死無疲厭，彼當具足普賢行，得佛功德無能壞。福德威光福德星，福德生處福德海，汝能普為諸眾生，誓修普賢清淨行。汝見無邊諸佛土，去來現在一切佛，亦聞所轉妙法輪，念力憶持無忘失。汝於十方一切剎，普見無量諸如來，願海清淨悉皆成，具足菩薩塵沙行。汝入方便大法海，安住如來功德地，導師勝行汝當修，當成一切無師智。汝於一切廣大剎，所有剎土微塵劫，於中修習普賢行，成就最勝菩提道。汝於無邊劫海中，普遍十方一切剎，為欲成滿諸大願，修行普賢諸妙行。此中無量諸眾生，聞汝願已皆歡喜，悉發廣大菩提意，專心願學普賢乘。」爾時，文殊師利菩薩說此偈已，告善財童子言：「善哉！善哉！善男子！若有眾生能發阿耨多羅三藐三菩提心，是事為難；能發心已，復欲勤\n\n#### 参2·吉祥雲比丘\n\n**参题解**：勝樂國妙峯山·吉祥雲比丘（八十作德雲比丘）。法门：**憶念一切諸佛平等境界無礙智慧普見解脫門**（「我唯得此」句实测）。\n\n**【要点提炼】**\n\n1. **七日寻师**：「漸次南行，往勝樂國登妙峯山，周遍求覓，經于七日竟不能見；由為勤求善知識故捐捨身命，無飢渴想」——见善知识本身的门槛，就是第一课。\n2. **一门而摄无量**：吉祥雲自陈唯得此一念佛解脱门，而「如是等無量無數念佛門」——一门即摄念佛门海；末以「而我云何能知、能說」谦收。\n3. **指授格式**：末句「當令汝入廣大助道位……」十「當令汝」——善知识互为介绍人，法门相续如接力。\n\n**【阐释】**（〔本文判断〕）全品以**念佛法门**开参学之端：不是禅观、不是持戒，而是忆念诸佛——把行者之心先调到「佛频」上，后续52参皆在此频段展开。妙峰山七日不见是仪式化的「善知识难见」：善知识不在低处等着被看见，求者必先放下身命之想；第七日于别山经行处相见——见到的不是预期的位置，是超越的位置（别山）。\n\n**【对照/启发】**：与〈十定品〉普光明三昧对读——忆念佛光与遍入光明，首尾同频〔本文判断〕。启发：七日之喻对治「速成心」——善知识相见有时，求心不到，山自是山。\n\n**本参经文全引**（T0293·1,964 CJK·0 手抄）：\n\n> 求行菩薩行倍更為難。善男子！汝今發心求菩薩道，為欲成就一切智智，應當勤求真善知識。善男子！求善知識勿生疲懈，見善知識勿生厭足，於善知識所有教誨，當念隨順不應違逆，於善知識善巧方便，但應恭敬勿見過失。善男子！於此南方有一國土，名為勝樂；其國有山名曰妙峯，彼有比丘名吉祥雲，汝可往問菩薩云何學菩薩行，菩薩云何修菩薩行，乃至菩薩云何於普賢行疾得圓滿。善男子！彼善知識當為汝說具足圓滿普賢行願。」時，善財童子聞是語已，心生歡喜，踊躍無量，於彼比丘深生渴仰，於文殊師利慇懃戀慕，頂禮雙足，遶無數匝，悲泣流淚，辭退而去。爾時，善財童子漸次南行，往勝樂國登妙峯山，於其山上東、西、南、北，四維，上、下，周遍求覓，經于七日竟不能見；由為勤求善知識故捐捨身命，無飢渴想，正念觀察心安無退。過七日已，見彼比丘在別山上徐步經行，即前往詣，頂禮雙足，右遶三匝，合掌而住，白言：「聖者！我已先發阿耨多羅三藐三菩提心，而未知菩薩云何學菩薩行？云何修菩薩行？云何起菩薩行？云何行菩薩行？乃至云何於普賢行疾得圓滿？我聞聖者善能誘誨，唯願慈哀為我宣說，云何菩薩速得成就阿耨多羅三藐三菩提。」時，吉祥雲比丘告善財言：「善哉！善哉！善男子！汝已能發阿耨多羅三藐三菩提心，是事為難，復能請問行菩薩行難中之難；所謂：勤求菩薩道、勤求菩薩境界、勤求菩薩廣博淨行、勤求菩薩出現神變、勤求菩薩示現廣大諸解脫門、勤求菩薩示現世間種種作業、勤求菩薩隨順眾生種種心行、勤求菩薩示現入出生死涅槃、勤求菩薩於為無為心無所著、勤求菩薩除斷眾生種種煩惱微細過失。善男子！我得自在決定解力，信眼清淨，智光照耀，普眼明徹，具清淨行，慧眼遍觀一切境界，善巧方便，離一切障，以清淨身普詣十方一切國土，恭敬供養一切諸佛；以信解力常念十方一切諸佛；以總持力受持十方一切佛法；以智慧眼常見十方一切諸佛；所謂：見於東方一佛、二佛、十佛、百佛、千佛、百千佛、億佛、百億佛、千億佛、百千億佛、那由他億佛、百那由他億佛、千那由他億佛、百千那由他億佛，乃至見無數無量、無邊無等不可數、不可稱、不可思、不可量、不可說、不可說不可說佛，乃至見閻浮提極微塵數佛、四天下極微塵數佛、小千世界極微塵數佛、中千世界極微塵數佛、大千世界極微塵數佛、十佛剎極微塵數佛、百佛剎極微塵數佛、千佛剎極微塵數佛、百千佛剎極微塵數佛、億佛剎極微塵數佛、百億佛剎極微塵數佛、千億佛剎極微塵數佛、百千億佛剎極微塵數佛、那由他億佛剎極微塵數佛，乃至見不可說不可說佛剎極微塵數佛，如見東方一切諸佛，南、西、北方，四維，上、下，所見諸佛亦復如是。隨其所見，一一方中所有諸佛種種色相、種種形貌、種種神通、種種受用、種種遊戲、種種眾會莊嚴道場、種種光明無邊照耀、種種宮殿莊嚴國界、種種壽量示有修、短，隨諸眾生種種心樂，示現種種成正覺門，於大眾中廣現神變，作師子吼，度脫眾生。善男子！我唯得此憶念一切諸佛平等境界無礙智慧普見法門。如諸菩薩摩訶薩無量智慧具足圓滿清淨行門，豈能了知所有邊際。所謂：智光普照差別境界念佛門，常見諸佛種種國土，宮殿莊嚴悉現前故；令安住種種增上意樂念佛門，隨諸眾生心之所樂，皆令見佛得清淨故；令安住究竟佛力念佛門，令入如來十種力中隨順行故；令安住種種如來究竟正法念佛門，見一切佛演說正法咸聽聞故；遍照十方無差別藏念佛門，普見一切諸世界中等無差別諸佛海故；入不可見極微細處念佛門，徹見一切微細境中如來神變自在事故；住種種劫念佛門，於一切劫常見諸佛施作佛事咸親近故；住一切時念佛門，於一切時常得見佛與佛同住不相離故；住一切剎念佛門，一切剎土咸見佛身超過世間無等比故；住一切世念佛門，隨於自心所有樂欲普見三世諸如來故；住一切境念佛門，普見一切諸境界中諸佛相續咸出興故；住一切性寂滅念佛門，於念念中見一切剎一切諸佛示涅槃故；住一切時處念佛門，於一日中見一切佛從其住處而往化故；住一切境廣大念佛門，見一切佛結跏趺坐，一一佛身滿法界故；住一切法微細念佛門，於一毛孔見不可說諸佛出興咸至其所而承事故；住剎那際莊嚴念佛門，於一念中見一切剎皆有諸佛成等正覺現神變故；住一切法念佛門，見一切佛出興於世，以智慧光轉法輪故；住自在心念佛門，隨其自心所有欲樂，一切如來現其影像咸得見故；住一切業念佛門，能隨法界一切眾生所修行業，為現其身令覺悟故；住一切神變念佛門，見一切佛住於廣大香水海中坐蓮華臺普現神變滿十方故；住等虛空界念佛門，觀察如來所現身雲莊嚴法界虛空界故；如是等無量無數念佛門，而我云何能知、能說彼功德行？善男子！南方有國名曰海門，彼有比丘名為海雲，汝往彼問菩薩云何學菩薩行、修菩薩道？海雲比丘能善分別開發廣大善根因緣，當令汝入廣大助道位，當令汝成廣大善根力，當為汝說發菩提心因，當令汝生廣大乘光明，當令汝得廣大波羅蜜，當令汝入廣大諸行海，當令汝轉廣大誓願輪，當令汝淨廣大莊嚴門，當令汝起廣大慈悲力。」時，善財童子禮吉祥雲比丘足，遶無數匝，慇懃瞻仰，戀慕而去。大方廣佛華嚴經卷第四大方廣佛華嚴經大方廣佛華嚴經卷第五罽賓國三藏般若奉詔譯入不思議解脫境界普賢行願品爾時，善財童子聞善知識教，一心正念；隨順思惟所有智慧光明門，隨順通達所有甚深解脫門，隨順憶持所有自在三昧門，隨順敬奉所有清淨教誨門，隨順觀察所見諸佛威德門，隨順欣樂所見諸佛住處門，隨順解了所見諸佛軌則門，隨順思念所見諸佛出現門，隨順趣入所見諸佛法界門，隨順安住所見諸佛境界門。漸次南行，向海門國，\n\n#### 参3·海雲比丘\n\n**参题解**：海門國·海雲比丘。法门：**普眼法門**（「我唯得此普眼法門」句实测；善财辞行亦「專心憶念普眼法門」）。\n\n**【要点提炼】**\n\n1. **反问收证**：「汝已發阿耨多羅三藐三菩提心耶？」「唯！我已先發」——海雲不先说先验信，参学之诚先由一问定案。\n2. **发心十一条要件**：「要得平等無礙境界……要恒利益安樂一切諸眾生故，如是乃能發菩提心」——发心不是立志宣言，是十一条行持的总和。\n3. **发心十心分类**：拔濟苦惱發大悲心、平等福祐……——大悲为第一心，其后心心相续。\n\n**【阐释】**（〔本文判断〕）海雲的意象是**由外海入内海**：观大海而见大莲华，由莲华见如来——「海」从地理变成法义（智慧海·愿海·众生海），「普眼」即遍见此重重海之眼。反问「已發心耶」的结构意义在：参学的前提不是知识而是**承担**——发心必须由自己亲口再认领一遍，法门才开。\n\n**【对照/启发】**：与〈入法界品〉末普贤十愿对读——普眼遍见与愿王导归，首尾同构〔本文判断〕。启发：十条要件可作发心自检表——哪一条「要」字尚未做到，发心即有虚处。\n\n**本参经文全引**（T0293·2,553 CJK·0 手抄）：\n\n> 詣海雲比丘所，頂禮雙足，遶無數匝，於前合掌，白言：「聖者！我已先發阿耨多羅三藐三菩提心，欲入甚深最上智海，而未知菩薩云何能具菩薩行，長養菩提種？云何能捨凡夫家，生於如來家？云何能度生死海，入佛智慧海？云何能離凡愚地，入佛最勝地？云何能斷生死流，入佛淨行流？云何能壞生死輪，成就大願輪？云何能滅魔境界，顯示佛境界？云何能竭愛欲海，增長大悲海？云何能閉三塗八難門，開人天涅槃門？云何能出三有繫縛城，入種智解脫城？云何能棄捨一切珍玩資具，饒益攝受一切眾生？唯願慈哀，為我宣說。」時，海雲比丘告善財言：「善男子！汝已發阿耨多羅三藐三菩提心耶？」善財言：「唯！我已先發阿耨多羅三藐三菩提心。」海雲告言：「善哉！善哉！善男子！發菩提心者不可得聞，何況自能深心發趣？善男子！若諸眾生未曾修種深固善根，則不能發阿耨多羅三藐三菩提心。是故，菩薩要得平等無礙境界，普門善根光明照故；要得真實巧方便藏，正道三昧光明照故；要得積集功德海藏，廣大福聚莊嚴身故；要得增長種種白法，念念出生無休息故；要能供事真善知識，諮問法要無疲厭故；要捨慳吝，無所藏積，於身命財無愛著故；要離憍慢，心無高下，安住不動如大地故；要恒慈愍隨順眾生，平等饒益無違逆故；要處生死，於惡趣中度苦眾生，心不捨故；要恒觀察如來境界，欣求修習至究竟故；要恒利益安樂一切諸眾生故；如是乃能發菩提心。「發菩提心者，所謂：拔濟苦惱諸眾生故，發大悲心；平等福祐諸眾生故，發大慈心；除滅眾生諸苦蘊故，發安樂心；為息眾生不善心故，發饒益心；救護怖畏諸眾生故，發哀愍心；捨離執著障礙法故，發無著心；普遍法界諸佛剎故，發廣大心；等虛空界無不往故，發無邊心；見一切佛妙色身故，發無垢心；觀三世法智無盡故，發清淨心；為欲普入一切智智甚深海故，發大智心；發如是等種種心故，是名菩薩發菩提心。「善男子！我初止住此海門國十有二年，常以十事觀察大海而為境界。所謂：思惟大海寬廣難量，思惟大海深難得底，思惟大海同一鹹味，思惟大海出生眾寶，思惟大海吞納眾流，思惟大海水色差別不可思議，思惟大海種種眾生之所依住，思惟大海容受無量大身眾生，思惟大海能受大雲所雨之雨，思惟大海究竟恒滿無有增減。善男子！我復思念：世間之中頗有深廣過此海不？乃至容受常無增減過此海不？「善男子！我作如是思惟之時，從大海中有大蓮華，眾寶莊嚴，欻然出現，以無能勝帝青頗胝迦金剛摩尼王寶為莖，毘瑠璃摩尼王寶為臺，無垢清淨閻浮檀金為葉，隨時芬馥白栴檀香沈水妙寶而為其藏，黃色映徹碼碯寶王以為其鬚，百萬摩尼寶莊嚴網羅布其上；凡所莊校，周圓無際，光榮四照，彌覆大海。百萬欲天王普雨種種天寶、天華、天鬘、天香、天燒香、天塗香、天末香、天妙衣服、天幢幡蓋如雲而下；百萬龍王起大香雲，雨眾香水；百萬夜叉王獻以種種珍奇寶藏；百萬羅剎王各以慈心，合掌觀察；百萬乾闥婆王以妙樂音，歌詠讚歎；百萬阿脩羅王執持其莖，曲躬而立；百萬迦樓羅王銜諸瓔珞，妙寶繒帶四面垂下；百萬緊那羅王起饒益心，歡喜愛樂；百萬摩睺羅伽王起清淨心，恭敬禮拜；百萬人王起殷重心，合掌瞻仰；百萬轉輪聖王各以七寶，莊嚴供養；百萬梵天王頭頂禮敬；百萬淨居天恭敬合掌；百萬主海神俱時出現，恭敬作禮；百萬主火神各持種種妙寶莊嚴。百萬味光摩尼寶光明普照，百萬淨福摩尼寶布散莊嚴，百萬遍照摩尼寶為清淨藏，百萬離垢藏摩尼寶其光赫奕，百萬吉祥藏摩尼寶放妙光明，百萬妙藏摩尼寶光照無邊，百萬閻浮幢摩尼寶周布行列，百萬不可壞金剛摩尼寶清淨莊嚴。百萬日藏摩尼寶廣大清淨，圓光普照；百萬可愛樂摩尼寶顯現眾色，具足莊嚴；百萬心王摩尼寶放雜色光，雨無盡寶。「此大蓮華所有莊嚴，皆從如來過去積集出世廣大善根所生，令諸菩薩各於此華，信願成滿；普於十方一切世界無不顯現；從如幻觀香王業生，以無生法所莊嚴故；從如夢觀離相法生，以無作法之所印故；從無染著離諍法生，隨境觀察無所著故；恒出妙音演說如來廣大境界，其聲充滿一切諸佛清淨剎土。假使無數百千億劫，以妙辯才稱讚此華，功德無盡。「善男子！我時於此蓮華之上，見有如來結跏趺坐，相好具足，形量高廣，上至有頂。如來所處寶蓮華座不可思議，道場眾會不可思議，圓滿智慧不可思議，圓光照耀不可思議，威儀隨現不可思議，光明熾盛不可思議，諸相隨好不可思議，變現自在不可思議，神通調伏不可思議，清淨妙色不可思議，無見頂相不可思議，舌相長廣不可思議，辯才善巧不可思議，圓音普演不可思議，無量智力不可思議，清淨無畏不可思議，無礙解智不可思議，憶念彼佛往修本行不可思議，菩提自在不可思議，法雷震吼不可思議，普門示現不可思議，種種莊嚴不可思議，隨其左右見各差別不可思議，普遍饒益咸令成熟不可思議。「善男子！時彼如來於蓮華上，則伸右手而摩我頂，為我演說普眼法門；顯發一切菩薩諸行，開演一切如來境界，闡揚一切諸佛妙法，光照一切諸佛剎土，圓滿一切諸佛相好，摧伏一切外道邪論，散滅一切諸魔軍眾；能令一切眾生歡喜，調伏一切眾生煩惱，能照一切眾生心行，善了一切眾生根性，能以威力普轉法輪，隨眾生心悉令開悟。「我從彼佛得聞於此普眼法門，受持讀誦，憶念思惟。假使有人以大海量墨，須彌聚筆，書此無盡廣大海藏普眼法門，一品中一門，一門中一法，一法中一義，一義中一句，乃至少分，尚不可得，何況盡能具足書寫？善男子！我於彼佛千二百歲，受持如是普眼法門，相續不斷。於日日中常以十種陀羅尼門，領受記持十無數品，所謂：以聞持陀羅尼光明，領受無數品；以寂靜門陀羅尼光明，趣入無數品；以無邊旋陀羅尼光明，普入無數品；以隨地觀察普遍照耀陀羅尼光明，分別無數品；以具足威力陀羅尼光明，普攝無數品；以蓮華莊嚴陀羅尼光明，引發無數品；以微妙言音陀羅尼光明，開演無數品；以虛空藏陀羅尼光明，顯示無數品；以光聚山陀羅尼光明，增廣無數品；以海藏普持陀羅尼光明，辨析無數品。「善男子！是時十方一切世界，各有無量諸眾生等，為聽法故而來我所；所謂：天王、龍王、夜叉王、乾闥婆王、阿脩羅王、迦樓羅王、緊那羅王、摩睺羅伽王、人王、梵王，如是諸王并其眷屬，來詣我所，諮問我法。我悉為其次第開演，分別解說，咸令歡喜，心生愛樂，深信趣入，悟解成就，安住於此諸佛菩薩光明妙行普眼法門。「善男子！我唯知此普眼法門，如諸菩薩摩訶薩深入一切菩薩行海，隨其願力皆清淨故；深入一切廣大願海，盡一切劫住世間故；深入一切諸眾生海，隨其心行普饒益故；深入一切眾生心海，出生無礙十力智故；深入一切眾生根海，隨時調伏令成熟故；深入一切同異剎海，為滿本願悉嚴淨故；深入一切無盡佛海，常願承事興供養故；深入一切正覺法海，能以智慧咸悟入故；深入一切佛功德海，於真實道具足修故；深入一切諸言辭海，遍一切剎轉法輪故；而我云何能知、能說彼功德行？「善男子！從此南行六十由旬，楞伽道邊，有一聚落名為海岸，彼有比丘名曰妙住，汝詣彼問菩薩云何令菩薩行速得清淨？」時，善財童子禮海雲足，右遶瞻仰，辭退而去。爾時，善財童子隨順思惟善知識教；專心憶念普眼法門，專念如來神變威力，憶持微妙法句身雲，趣入無邊法門教海，觀察善友威儀法式，游泳甚深法海漩澓，普遍趣入虛空法界，淨治法眼所有翳障，捃拾善友所集法寶。如是作意，漸次南行，至楞伽道海岸聚落，觀察十方，周遍\n\n#### 参4·妙住比丘\n\n**参题解**：楞伽道海岸聚落·妙住比丘（八十作善住比丘）。此参之眼：**比丘于虚空中经行**，十类天龙八部（净居天·梵王·欲界天·龙王·夜叉·罗刹·阿修罗·迦楼罗·紧那罗·摩睺罗伽·主海神）各以供云充满虚空。\n\n**【要点提炼】**\n\n1. **虚空经行**：善财所见第一景即「在虛空中經行來往」——行者已离地，戒行之重可载于空；供养者恰是最可怖的罗刹王「咸起慈心」——所化之广与化之彻底。\n2. **十二云何问**：「云何勤求佛法？積集？滿足？熏習？修行？淨治？……總攝佛功德法？」——善财之问在此已从「学菩萨行」细化为一整套**佛法工序**。\n3. **善财自勉段**：「志願堅固，猶若金剛及那羅延」——每参之间善财的自策文是全品的暗线：参学者的成长可从自勉句读出。\n\n**【阐释】**（〔本文判断〕）参4把「戒」与「化」合演：妙住于空中经行，示现的正是**持戒清净者之离地**——戒不是约束而是翅膀；而供养云以罗刹、阿修罗为主角，示「威猛众生先受化」。十二云何问标志善财问法的成熟：从笼统「云何学行」到分工序追问——参学之问在长。\n\n**【对照/启发】**：与〈十行品〉饶益行对读（利他如虚空无碍）〔本文判断〕。启发：十二问是一张佛法工序表——勤求、积集、满足、熏习、修行、净治……佛法不是一次获得，是十二道工序的持续作业。\n\n**本参经文全引**（T0293·4,937 CJK·0 手抄）：\n\n> 求覓妙住比丘。見彼比丘在虛空中經行來往。不思議數諸淨居天與宮殿俱，於虛空中恭敬合掌，發弘誓願而為供養；不思議數諸梵天王，曲躬合掌出妙音聲，以人間法稱揚讚歎而為供養；無數千萬欲界諸天及諸天王，恭敬圍遶滿虛空中，布天華雲，雨天華雨，作天妓樂，出妙音聲，無數繒綺寶幢幡蓋，種種嚴飾，悉遍虛空而為供養；復有無數諸大龍王，於虛空中興不思議沈水香雲，普遍虛空，震雷激電而為供養；無量不思議數諸夜叉王各以眷屬，周匝圍遶恭敬守護而為供養；無量不思議數諸羅剎王與諸眷屬，其形長大，甚可怖畏，咸起慈心，親近瞻仰而為供養；無量阿脩羅王興不思議摩尼寶雲，放大光明遍滿虛空，雨種種寶莊嚴照耀而為供養；無數迦樓羅王作童子形，諸妙采女之所圍遶，起大慈愍，無殺害心，恭敬合掌而為供養；無數緊那羅王拊擊眾樂，演出種種微妙音聲，復以種種稱法言辭，歌詠讚歎而為供養；無數摩睺羅伽王持不思議上妙微細天諸衣服，親近隨逐，周迴布列而為供養；無量主海神作諸妓樂，嘯和雅音而為供養。善財童子見此比丘於虛空中經行自在，復有如是供養之事充滿虛空；歡喜踊躍，不能自持；五體投地，一心敬禮，良久乃起；合掌白言：「聖者！我已先發阿耨多羅三藐三菩提心，而未知菩薩云何勤求佛法？云何積集佛法？云何滿足佛法？云何熏習佛法？云何修行佛法？云何淨治佛法？云何隨順佛所行法？云何通達佛算數法？云何增長佛普遍法？云何清淨佛究竟法？云何總攝佛功德法？云何能入佛隨順法？我聞聖者善能誘誨；唯願慈悲，為我宣說菩薩云何恒見諸佛，聞法勤修而不捨離？菩薩云何恒同一切菩薩善根而不捨離？菩薩云何恒以智慧證諸佛法而不捨離？菩薩云何恒以大願饒益眾生而不捨離？菩薩云何恒修一切菩薩事業而不捨離？菩薩云何恒住劫海，修行無厭而不捨離？菩薩云何恒住剎海，普遍莊嚴而不捨離？菩薩云何恒依佛力，悉能知見諸佛神變而不捨離？菩薩云何恒於六趣自在受生，住無住道而不捨離？菩薩云何恒受諸佛正法雲雨悉能憶持而不捨離？菩薩云何恒發智光普照三世佛所行處而不捨離？唯願慈哀，為我開演。」爾時，妙住比丘告善財言：「善哉！善哉！善男子！汝已能發阿耨多羅三藐三菩提心，今復志求一切智法及自覺法。善男子！汝能發心深信愛樂，慇懃不捨，請問於我；汝當諦聽，今為汝說。「善男子！我得菩薩普遍速疾勇猛不空供養諸佛成熟眾生解脫門。常於此門，若行若止，修習思惟；或入或出，隨順觀察；即時獲得智慧光明名普照諸法究竟無礙。由得如是智光明故，知諸眾生種種心行無所罣礙，知諸眾生種種歿生無所罣礙，知諸眾生宿住之事無所罣礙，知諸眾生未來劫事無所罣礙，知諸眾生現在世事無所罣礙，知諸眾生種種言音隨俗差別無所罣礙，知諸眾生種種疑網咸為決了無所罣礙，知諸眾生種種根性受法差別無所罣礙，知諸眾生應受化時悉往調伏無所罣礙，知諸時分、剎那、臘縛牟呼栗多、晝夜、年劫、延促、相入無所罣礙，知三世海諸法流轉相續次第無所罣礙，知諸佛剎無量差別，能以其身遍往十方無所罣礙；何以故？以得無住、無作、無行神通力故。「善男子！我以得此神通力故，於虛空中或行、或住、或坐、或臥，乃至現作種種威儀隱顯自在。或以一身分為多身，或以多身合為一身；或以其身來往、入出、穿度石壁而無障礙；或於空中結跏趺坐，自在往來，猶如飛鳥；入地如水，履水如地；遍身上下普出煙焰，光明熾盛如大火聚；或時震動一切大地；或時以手捫摸日月；或現威德超自在天；或現大身過於梵世；或以神力轉變自在；或現燒香雲盤旋如蓋，彌覆十方；或現寶焰雲，光明熾盛，普照一切；或現變化雲，其身隨類，等眾生界；或現光網雲，具足眾色，映徹無礙。或現其身於一念頃，過於東方一世界、十世界、百世界、千世界、百千世界、億世界、百億世界、千億世界、百千億世界、百千億那由他世界，乃至無數世界、無量世界、無邊世界、無等世界，不可思世界、不可量世界、不可稱世界、不可說世界、不可說不可說世界，乃至或過閻浮提極微塵數世界，乃至過不可說不可說佛剎極微塵數世界。如是一切世界海中，所有一切世界出生中，一切世界方處中，一切世界旋轉中，一切世界普遍中，一切世界變化中，一切世界名字中，一切世界法門中，一切世界時劫中，一切世界微細中，一切世界菩提場中，一切世界莊嚴具中，一切世界大眾會中。如是一切種種世界，其中所有一切剎土，皆有如來現成正覺；彼諸如來一一復現一切佛剎極微塵數大眾集會差別之身，我悉於彼一切佛所，普現其身。於一一身，普雨一切諸佛剎海極微塵數諸供養雲，所謂：一切華雲、一切香雲、一切鬘雲、一切蓋雲、一切幢雲、一切幡雲、一切帳雲、一切網雲、一切末香雲、一切塗香雲、一切衣服雲；以一切身各持如是諸供具雲而為供養。一一如來所轉法輪，種種宣說，所謂：廣說、略說、讚說、毀說、明了說、隱密說、有餘說、無餘說、不定說、決定說，我皆悟解，憶念受持。一一國土，諸佛剎海，所有莊嚴，我皆憶持，曾無忘失。如於東方，南、西、北方，四維，上、下，亦復如是。「善男子！如是一切諸世界中所有眾生，若聞我名，若見我身，或覩經行止住之處，或以一心禮拜供養，或時散亂懷疑不信，如是一切皆決定於阿耨多羅三藐三菩提得不退轉。彼諸世界一切眾生我皆明見，隨其大小、勝劣、苦樂，示同其形，隨所應度，教化調伏而成熟之；隨有眾生親近我者，悉令安住如是法門。「善男子！我唯知此普遍速疾，勇猛不空，供養諸佛，成熟眾生無礙解脫門；如諸菩薩摩訶薩具足受持大慈悲戒，波羅蜜戒，住大乘戒，不離菩薩道戒，不著一切法戒，不捨菩提心戒，不墮二乘地戒，常以佛法為所緣戒，心常憶念一切智戒，所發志樂等虛空戒，一切世間無所依戒，不缺漏戒，不濁亂戒，無遺失戒，不雜染戒，不追悔戒，無厭怠戒，清淨戒，離塵戒，無垢戒，如是菩薩戒行功德，無量無邊，而我云何能知、能說？「善男子！從此南方有一國土，名達邏比吒，其國有城，名金剛層；中有大士，名曰彌伽；汝往彼問菩薩云何學菩薩行，云何修菩薩道。」時，善財童子禮妙住足，右遶瞻仰，辭退而去。爾時，善財童子一心隨順善知識教，正念觀彼法光明門；以清淨心深信趣入，念法威力，順佛所行，專心憶持，紹三寶種，歎離欲性；念善知識，普遍觀察，照明三世，憶本大願，隨順修行；以無礙心入眾生界，常勤作意救護世間；於諸有為，心無倚著，觀一切法根本自性，念念流入一切智海，普遍嚴淨一切佛剎；於諸如來道場眾會，心無依住。如是觀察，漸次南行，至達邏比吒國，入金剛層城，周遍求覓彌伽大士。乃見其人於市肆中，處高臺上，坐師子座，十千人眾所共圍遶，廣說輪字莊嚴法門。善財往詣，頂禮其足，遶無數匝，恭敬合掌，白言：「聖者！我已先發阿耨多羅三藐三菩提心，而未知菩薩云何學菩薩行？云何修菩薩道？云何流轉諸趣，常不忘失菩提之心？云何心得堅固，勤求佛法無有厭倦？云何獲得清淨謙下之心無能壞者？云何得大悲心力，恒處生死不憚劬勞？云何得陀羅尼力，自在攝持普門清淨？云何發生廣大智光，離諸翳障？云何得妙辯才，善巧決擇甚深法藏？云何得正念力，憶持諸佛一切法輪？云何得淨趣力，演一切法普淨諸趣？云何得成菩薩普遍智力，於一切法種種分別，悉能決定了真實義？唯願慈哀，為我宣說。」爾時，彌伽告善財言：「善男子！汝已先發阿耨多羅三藐三菩提心耶？」善財白言：「唯然！大士！我已先發阿耨多羅三藐三菩提心。」彌伽遽即下師子座，由為尊重菩提心故，於善財前五體投地，一心禮敬；從地而起，散金銀華無價寶珠及以上妙碎末旃檀，復以雜綵無量寶衣以覆其上。復散無數殊勝光潔悅意香華，眾妙供具而為供養；然後合掌，以柔軟音而稱讚言：「善哉！善哉！善男子！汝乃能發阿耨多羅三藐三菩提心。「善男子！若有能發阿耨多羅三藐三菩提心者，則為勤求一切智智不斷佛種，則為永離一切世間凡夫種性，則為嚴淨一切諸佛所有剎土，則為調伏一切眾生令其成熟，則為覺了一切法性出生死海，則為照解一切業種無所依著，則為勤修一切菩薩所有妙行，則為已發一切大願無有斷絕，則為隨順一切種智離欲行處，則為獲得一切菩薩堅固種性，則為已得一切諸佛威力加持，則能明見一切三世所有差別，則為十方一切如來共所護念，則與法界一切菩薩志樂平等，則得一切賢聖咸共稱讚，則得一切梵王一心禮覲，則得一切天王恭敬供養，則得一切夜叉王常勤守護，則得一切羅剎王隨逐侍衛，則得一切諸大龍王迎接奉事，則得一切緊那羅王歌詠讚歎，則得一切諸世間主同心慶悅，則令一切諸眾生界悉得安隱。所謂：令斷一切惡趣流轉故，令捨一切諸苦難處故，令息一切貧窮根本故，令生一切人天快樂故，令得親近供養一切善知識故，令得聽聞受持諸佛廣大法故，能令修集一切菩薩菩提分法故，能令增長一切功德善法根芽故，能令熏發一切菩薩無漏智種故，能令智光普照一切差別智道故，能令究竟住於菩薩真實智地故。「善男子！如是菩薩難得出世，亦難值遇；諸有所作難識、難知。能為眾生作甚難事；若得見者倍更為難。何以故？菩薩出世與諸眾生為大利益：如父母，長養安慰令成就故；如瓔珞，莊嚴一切諸天人故；如船師，於生死海度眾生故；如屋宅，覆護一切諸世間故；如商主，能導群生至寶所故；如赫日，智慧光明能普照故；如君主，覺法城中得自在故；如熾火，能燒眾生我愛薪故；如大雲，普霔無邊甘露雨故；如時雨，增長信等善根芽故；如船舫，運度眾生達彼岸故；如橋梁，能度眾生越生死故；如津濟，顯示一切出要道故；如風輪，能持眾生不令墮落三惡趣故；如大地，悉能增長一切眾生諸善根故；如大海，具足一切無盡福智功德藏故；如滿月，普放智光破煩惱暗，施清涼故；如猛將，悉能摧伏一切魔軍，令退散故；如須彌，勝智善根超出深廣生死海故。」爾時，彌伽廣為善財稱讚顯示發菩提心大功德力，令諸眾會，皆生歡喜；同聲唱言：「善哉！善哉！善男子！今我眾會，因見勝人，得聞菩薩功德行願，踊躍歡喜，不能自持。」是時，彌伽還昇本座，從其面門放種種光，普照三千大千世界。時，此世界諸大梵王、天、龍、夜叉、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽、人及非人，如是諸王并其眷屬，蒙光照耀，靡不來集。是時，大士觀察眾心，咸生恭敬，離諸諂慢，其心寂靜，志意柔順，隨其樂欲，廣為分別開示，解釋輪字句品莊嚴法門；彼諸眾生聞此法已，信順悟入，皆於阿耨多羅三藐三菩提得不退轉。所應作已，告善財言：「善男子！我已成就妙音陀羅尼光明法門，於一念中能分別知三千大千世界所有欲色諸天語言差別祕密；諸龍、夜叉、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽、人、非人等所有語言差別祕密；亦知彼彼一切眾生所有心想，種種樂欲差別祕密。所謂：了知色界梵王及諸梵眾所有心樂差別祕密；亦知欲界諸大天王、天子、天女所有心樂差別祕密；亦知龍等，人及非人男女眷屬所有心樂差別祕密；亦能知此三千大千世界一切聲聞及辟支佛所有向果，各各修習一切菩薩行願地位，各各修習微細意趣差別祕密；及諸言辭分別解說，辨釋文義，無不明了。亦能了知三世諸佛，為諸眾生演說一切甚深法海，種種言辭意趣祕密。「如於一念知此世界所有眾生及諸賢聖言辭、心想、行願、地位，各各差別微細祕密；亦知東方一十百千萬億那由他無數、無量、無邊、無等、不可數、不可稱、不可思、不可量、不可說、不可說不可說諸世界中，所有眾生及諸賢聖言辭、心想、行願、地位微細祕密；南、西、北方，四維，上、下，各盡不可說不可說諸世界中，所有眾生及諸賢聖言辭、心想、行願、地位各各差別微細祕密；如是一切，悉能了知，無不通達。「善男子！我唯知此妙音陀羅尼光明法門；如諸菩薩摩訶薩普能隨入一切眾生種種想行眷屬海；普能隨入一切眾生種種建立施設海；普能隨入一切眾生種種稱謂名字海；普能隨入一切眾生種種方俗語言海；普能隨入一切諸佛甚深祕密法句海；普能隨入一切諸佛究竟最上法句海；普能隨入一切諸佛於一所緣中，說一切三世所緣法句海；普能隨入一切諸佛於一切語言中，演說一切增上法句海；普能隨入一切諸佛於一切語言中，演說一切上上法句海；普能隨入一切諸佛於一切語言中，演說廣大差別法句海；普能隨入一切諸佛於一切語言中，演說一切差別善巧調伏法句海；普能隨入一切諸佛於一切世界中，演說種種呪術言辭差別祕密海；普能隨入一切世界種種眾生音聲語言際；普能隨入一切諸佛清淨法輪，圓滿莊嚴際；普能隨入一切世間種種字輪，普遍出生顯示諸法際。如是菩薩行智功德，而我云何能知、能說？「善男子！從此南方有一聚落名為住林，彼有長者名住解脫，汝往彼問菩薩云何修集菩薩道？菩薩云何出生菩薩德？菩薩云何成就菩薩行？菩薩云何思惟菩薩法？」時，善財童子蒙善知識深心誨誘，於一切智法，深生尊重；於一切善根，增益信樂；於一切佛法，倍起精勤；於一切善知識教，普加隨順。禮彌伽足，悲泣流淚，遶無量匝，戀慕瞻仰，辭退南行。大方廣佛華嚴經卷第五大方廣佛華嚴經大方廣佛華嚴經卷第六罽賓國三藏般若奉詔譯入不思議解脫境界普賢行願品爾時，善財童子隨順思惟，一心專念彼諸菩薩微妙辯才莊嚴法門，一心專念彼諸菩薩言辭教海，一心專念彼諸菩薩微細方便，一心專念彼諸菩薩清淨解脫，一心專念彼諸菩薩善根光明，一心專念彼諸菩薩清淨善巧，一心專念彼諸菩薩攝眾生智，一心專念彼諸菩薩廣大智力，一心專念彼諸菩薩勇猛不退，一心專念彼諸菩薩殊勝志樂，一心專念彼諸菩薩無量功德，一心專念彼諸菩薩無礙法門。如是思惟，弘誓堅固，勇猛精進而為甲冑，以正信力恒自莊嚴，勤求正法，心無疲厭；志願堅固，猶若金剛及那羅延，無能壞者；恒於一切善知識教，奉順修行常無間斷；於諸境界，心無染著，普門妙行，皆悉現前，普眼智光，照諸法海，圓滿諸地陀羅尼門，現見十方，了法邊際。以無礙智普遍莊嚴，證解清淨無依法性，顯示無對無二法門，超過一切最勝彼岸，入淨智門，永離諸想；能審觀察諸法實際，普知三世差別法門，普往十方差別世界，普見十方差別佛身，普入十方差別時劫，普觀十方差別業性，普轉諸佛差別法輪，普智三昧明照其心，心恒普入平等境界。如來慧光照觸其身，一切智流相續不斷；若身若心勢力自在，常不捨離一切佛法。以深信力，常得諸佛威神所加；以淨慧力，為諸如來光明所照；以誓願力，願身周遍一切剎網，一切法界，普入其身。漸次遊行，經十二年至住林城，周遍詢\n\n\n\n## 参批2（L.290·参5–8·注入 19,987 CJK）\n\n#### 参5·解脫長者\n\n**参题解**：遍無垢住处·解脫長者。法门：**如來甚深無礙莊嚴解脫**（「我唯於此」句实测——入定现十方佛海于自身中）。\n\n**【要点提炼】**\n\n1. **善知识十难**：「難可出現、難得聞名、難得逢值、難得親近、難得承接、難得同住、難得奉事、難令喜悅、難蒙開曉、難得隨逐」——十难递进，把「遇善知识」标价为全品最稀有事件。\n2. **三十「為欲」请法**：「為欲值遇一切佛興故……為欲見一切佛法於自身中出生故」——善财的请法文在此达到第一个规模峰值：一条愿链即一张佛行清单。\n3. **身中见佛**：入此解脱门，十方佛刹于长者身中现——佛不在远处。\n\n**【阐释】**（〔本文判断〕）参5立「善知识学」的**价值论证**：十难清单说遇师之难，三十「為欲」说求师之诚——两清单一收一放，参学的价格与回报同时标定。而「身中见佛」是本品的第一次**空间反转**：此前佛在十方，此参佛在毛孔——向外寻找的佛，在此参被翻为向内所现之佛；后文弥勒楼阁、普贤身皆此反转的放大。\n\n**【对照/启发】**：与〈十回向品〉卡⑤「一毛孔中现无量刹」对读——回向说的，参学这里亲眼见〔本文判断〕。启发：十难清单对治「把善知识当常驻服务」的现代心——每一「難」都是一次预习。\n\n**本参经文全引**（T0293·3,726 CJK·0 手抄）：\n\n> 求解脫長者。既得見已，五體投地，頂禮雙足，起立合掌，白言：「聖者！我今得與善知識會，是我獲得廣大善利。何以故？善知識者難可出現，難得聞名，難得逢值，難得親近，難得承接，難得同住，難得奉事，難令喜悅，難蒙開曉，難得隨逐。我今會遇真善知識，是我獲得最勝善利，如是展轉難中之難。「聖者！我已先發阿耨多羅三藐三菩提心，為欲值遇一切佛興故，為欲普聞一切佛名故，為欲普見一切佛身故，為欲普詣一切佛剎故，為欲普入一切佛會故，為欲普觀一切佛境故，為欲普知一切佛意故，為欲普受一切佛記故，為欲普承一切佛力故，為欲普事一切諸佛故，為欲證悟一切佛法故，為欲隨順一切佛心故，為欲圓滿一切佛願故，為欲獲得一切三昧故，為欲照明一切佛智故，為欲莊嚴一切佛會故，為欲遍修諸佛本行故，為欲現見諸佛神通故，為欲具證諸佛智力故，為欲清淨諸佛無畏故，為欲聽聞一切佛法故，為欲受持諸佛法輪故，為欲辨析一切佛法故，為欲住持諸佛教海故，為欲守護諸佛法城故，為欲觀察佛所覺法故，為欲解悟佛所證法故，為欲深入佛所知法故，為欲見一切佛法於自身中出生故，為欲與一切菩薩同體故，為欲與一切菩薩同類故，為欲等一切菩薩善根故，為欲觀一切菩薩所學故，為欲同一切菩薩淨行故，為欲成一切菩薩所修故，為欲滿一切菩薩波羅蜜故，為欲發一切菩薩清淨願故，為欲入一切菩薩大願海故，為欲具一切菩薩大悲力故，為欲至一切菩薩究竟處故，為欲獲得諸佛菩薩差別威神藏故，為欲獲得一切菩薩智慧光明無盡藏故，為欲獲得一切菩薩廣大功德三昧藏故，為欲獲得一切菩薩無量威力藏故，為欲獲得一切菩薩無量神通藏故，為欲獲得一切菩薩大神變藏無窮盡故，為欲獲得一切菩薩大自在藏常現前故，為欲獲得一切菩薩淨妙色藏而莊嚴故，為欲獲得一切菩薩大慈悲藏，教化眾生皆令究竟達彼岸故。「聖者！我今以如是心，如是意樂，如是希欲，如是勤求，如是思惟，如是渴仰，如是尊重，如是方便，如是勇猛，如是究竟，如是謙下，來至聖者善知識所。我聞聖者善能誘誨諸菩薩眾，能以方便開佛境界，示其道路，指其津濟，與其橋梁，授其船筏。普令一切截愚癡網，除顛倒障，拔疑惑箭，滌煩惱垢，照心稠林，破心迷執，令心潔白，正心諂曲，除心熱惱，使心清涼，迴生死流，趣涅槃道，令心遠離諸見牢獄，令心解脫貪欲繫縛於染愛處，令心動轉隨順趣入一切智性，令其疾到廣大法城，令其堅固無上大悲，令其安住究竟大慈，令其發起諸菩薩行，令其修習諸三昧門，令其悟入聖所證位，令其觀察諸法本性，令其增長普賢願力，於諸眾生其心平等。唯願慈哀，為我宣說菩薩云何學菩薩行、修菩薩道，隨所修習疾得清淨，疾得明了，具足圓滿。」時，解脫長者以過去積集善根力故，如來現在威神力故，文殊師利童子憶念力故，十方一切諸善知識本行願力所加持故，即入菩薩勝三昧門，其三昧名普攝無邊一切佛剎旋陀羅尼。入三昧已，其身清淨，光明映徹，於其身中，顯現十方各十佛剎極微塵數佛及佛剎淨妙莊嚴眾會道場光明等事；亦現彼佛往昔同行諸菩薩眾，往昔所現神通變化，往昔所發廣大誓願，往昔所修助道之法，往昔所淨諸出離道，往昔所有清淨莊嚴，往昔所修諸菩薩行；亦見彼佛成等正覺轉妙法輪，教化眾生；如是一切悉於身中分明顯現無有障礙。亦於身內一切剎中普現其身，無不充遍；身與佛剎互相涉入不相障礙，種種色像而無往來，一一差別次第而住，不相雜亂。所謂：種種佛剎各別莊嚴，種種眾會眷屬圓滿，種種威儀恭敬供養，種種道場各各嚴飾。其中諸佛示現種種遊戲神通，建立種種差別乘道，顯示種種廣大願門，普遍莊嚴種種神力。或一世界示現上生處兜率宮而作佛事；或一世界沒兜率天，下入王宮而作佛事；或現處胎種種神變；或現誕生種種瑞相；或現嬰孩種種遊戲；或示童子現處內宮；或現出家示行苦行；或詣覺樹坐於道場；或現神通破魔軍眾；或現自在成無上道；或現諸王勸請說法；或現受請轉妙法輪；或現天、龍、乾闥婆等恭敬圍遶，常隨守護；或現其身遍入諸趣；或往一切眾生住處；或時示現度眾生已，入般涅槃，為令世間咸增戀慕；或現舍利全身、碎身，分布人天，令興福祐；或遍人天起大塔廟，莊嚴國界，饒益眾生。彼諸如來於種種世界，種種趣生，種種部類，種種眾會，種種根器，種種樂欲，種種業行，種種信解，種種根力，種種修習，種種行願，種種覺悟，種種心想，種種煩惱，隨眠習氣；如是一切眾生海中，以佛威力廣現神通，遍一切處施作佛事。所謂：或處極微塵量道場，或處無邊廣大道場，或處一由旬量道場，或處十由旬量道場，乃至或處與不可說不可說佛剎極微塵數諸世界海，其量正等眾會道場；以種種神通，種種音聲，種種言辭，種種辯才，種種訓釋，於諸如來聖諦海中，以種種無畏大師子吼，為種種眾生演說種種修多羅海，開示種種陀羅尼門，普轉種種如來法輪，普授種種諸菩薩記。彼諸如來所說法門，所出言音，善財童子悉能聽受，憶持不忘，思惟觀察；亦見諸佛及諸菩薩不可思議諸三昧門，自在神變。爾時，解脫長者現是相已，即從三昧安詳而起，告善財童子言：「善男子！我已於此甚深無礙莊嚴解脫門自在入出。「善男子！我住於此解脫門時，即見東方閻浮檀金光明世界，龍自在王如來、應、正等覺道場眾會之所圍遶，毘盧遮那藏菩薩而為上首；又見南方速疾具足諸力世界，遍覆普香王如來、應、正等覺道場眾會之所圍遶，思惟心王菩薩而為上首；又見西方具足一切香圓滿光世界，須彌燈王如來、應、正等覺道場眾會之所圍遶，無礙心菩薩而為上首；又見北方袈裟幢世界，金剛堅固如來、應、正等覺道場眾會之所圍遶，金剛遊步勇猛行菩薩而為上首；又見東北方一切殊勝妙寶世界，無所得境界眼毘盧遮那如來、應、正等覺道場眾會之所圍遶，無所得妙變化菩薩而為上首；又見東南方自在香焰光音世界，香燈王如來、應、正等覺道場眾會之所圍遶，金剛焰慧自在妙因王菩薩而為上首；又見西南方智日焰普光明世界，毘盧遮那普智聲如來、應、正等覺道場眾會之所圍遶，普焰垂髻變現香華光菩薩而為上首；又見西北方普清淨妙香莊嚴藏世界，無量功德海幢圓滿光如來、應、正等覺道場眾會之所圍遶，無礙威力身智幢王菩薩而為上首；又見下方師子騰焰解脫光明世界，無礙法界幢具足智慧焰光如來、應、正等覺道場眾會之所圍遶，法界智焰光明遍照世界幢菩薩而為上首；又見上方光明遍照次第出現無盡佛世界，名稱無邊無礙智慧圓滿光幢王如來、應、正等覺道場眾會之所圍遶，無礙精進力法界智幢王菩薩而為上首。「善男子！我見如是十佛世尊而為上首，如是乃至見於十方各十佛剎極微塵數諸佛如來、應、正等覺道場眾會之所圍遶，一一皆有上首菩薩并諸眷屬，分明顯現；然彼一切世界如來不來至此，我身亦不往詣於彼。「善男子！我若欲見安樂世界無量壽如來，隨意即見；我若欲見白栴檀香世界月智如來、妙香世界寶光明如來、蓮華世界寶蓮華光明如來、妙金光世界寂靜光如來、妙喜世界不動如來、善住世界師子相如來、鏡光明世界月覺如來、吉祥師子寶莊嚴世界毘盧遮那如來。如是十方一切世界所有如來，我若欲見，隨意即見；然彼如來不來至此，我不往彼。「善男子！我若欲見盡過去際一切劫中，所有諸佛及彼佛剎種種莊嚴道場眾會，神通變化，調伏眾生；盡未來際一切劫海，所有如來及諸菩薩莊嚴國土眾會道場，調伏眾生，神通變化；如是一切隨念皆見。彼諸如來及彼諸劫，一切佛剎所有莊嚴，種種差別，不來至今，我心亦不入彼過、未；然其所見，皆如現在。「善男子！我能了知十方三世一切如來及諸菩薩國土莊嚴、神通等事，無所從來亦無所去，無有行處亦無住處，亦知己身無去無來，無行住處。所以者何？知一切佛及與我心皆如夢故，如夢所見，從分別生。見一切佛從自心起，又知自心如器中水，悟解諸法如水中影；又知自心猶如幻術，知一切法如幻所作；又知自心諸佛菩薩悉皆如響，譬如空谷隨聲發響，悟解自心，隨念見佛，我如是知，如是憶念，所見諸佛皆由自心。善男子！當知菩薩修諸佛法，淨諸佛剎，積集妙行，調伏眾生，發大誓願，入一切智，自在遊戲不可思議解脫法門，得佛菩提，現大神通，遍往十方一切法界，以微細智，普入諸劫，如是一切佛菩薩法，皆由自心。「善男子！諸業虛妄，積集名心，末那思量，意識分別，眼等五識，了境不同。愚癡凡夫，不能覺知，怖老病死，求入涅槃；生死涅槃二俱不識，於一切境妄起分別。又由未來諸根五塵境界斷滅，凡愚之人以為涅槃，諸佛菩薩自證悟時，轉阿賴耶得本覺智。善男子！一切凡愚迷佛方便，執有三乘，不了三界由心所起，不知三世一切佛法自心現量，見外五塵執為實有，猶如牛羊不能覺知，生死輪中無由出離。「善男子！佛說諸法無生無滅，亦無三世，何以故？如自心現五塵境界，本無有故；有無諸法本不生故，如兔角等；聖者自悟境界如是。善男子！愚癡凡夫妄起分別，無中執有，有中執無，取阿賴耶種種行相，墮於生滅二種見中，不了自心而起分別。善男子！當知自心即是一切佛菩薩法，由知自心即佛法故，則能淨一切剎，入一切劫。是故，善男子！應以善法扶助自心，應以法雨潤澤自心，應以妙法治淨自心，應以精進堅固自心，應以忍辱卑下自心，應以禪定清淨自心，應以智慧明利自心，應以佛德發起自心，應以平等廣博自心，應以十力、四無所畏明照自心。「善男子！我唯於此如來甚深無礙莊嚴解脫法門，自在入出；如諸菩薩摩訶薩住無礙智，行無礙行，於諸境界無不通達，現前常得見一切佛廣大三昧，住一切佛無涅槃際，成正覺門；普遍了知諸三昧海，所有境界能隨觀察，三世諸法悉皆平等；分身遍往一切剎海，入於諸佛無分別處，一切境界皆悉現前，常能觀察一切諸法，以圓滿智盡能說行一切菩薩功德行願，於其身中悉能顯現一切世界成壞之相，而於自身及彼世界不生二想；如是妙行，而我云何能知、能說？「善男子！從此南行閻浮提畔有一住處，名遍無垢；彼有比丘，名曰海幢。汝詣彼問菩薩云何學菩薩行，修菩薩道。」時，善財童子禮長者足，右遶觀察，思惟瞻仰，稱揚讚歎無量功德；念善知識能為救護，於善知識常生歡喜，依善知識發起行願，由善知識令我開悟，敬善知識心無違逆，事善知識無有諂誑，於善知識心常隨順；於善知識起慈母想，令我遠離一切顛倒，於善知識起慈父想，令我成就菩薩善法；如是思惟深生愛樂，悲泣流淚辭退而去。爾時，善財童子一心正念彼長者教，隨順觀察，如說修行；憶持彼不思議菩薩解脫門，思惟彼不思議智慧光明門，深入彼不思議法界次第門，悟解彼不思議遍入普法門，明見彼不思議如來神變，觀察彼不思議普入佛剎，深信彼不思議佛力莊嚴，照現彼不思議菩薩三昧，了達彼不思議差別世界，修集彼不思議菩薩淨業，發起彼不思議廣大誓願。如是觀察，漸次南行，向閻浮提畔無垢聚落，周遍尋覓\n\n#### 参6·海幢比丘\n\n**参题解**：閻浮提畔無垢聚落·海幢比丘——「結跏趺坐，端身正念，離出入息，住不思議廣大三昧」。法门：**般若波羅蜜清淨光明三昧法門**（实测）。\n\n**【要点提炼】**\n\n1. **毛孔度生**：从眉间白毫与一一毛孔各出无量众类（帝釋·比丘·龙王·阿修罗·迦楼罗……），**一一毛孔出一类、演一法**——定中起用，一座三昧即一场遍法界的教育。\n2. **法雨分类学**：为阿脩羅王雨「金剛智輪大法境界」、为地獄眾生雨「寂靜音聲正念莊嚴」、為畜生雨「隨順如來具智慧藏無惡業道聲」、為閻羅王界雨「不捨眾生出生如來波羅蜜聲」——**每一类众生有专名法雨**，法门按受者设教。\n3. **往昔十度全列**：善财于光网中见海幢往昔所修檀·尸·忍·勤·禪·般若等三世所行——三昧之用，背后是十度的往昔积累。\n\n**【阐释】**（〔本文判断〕）参6是**一行三昧摄一切行业**的展演：比丘只做一件事（端坐离息），而法界的一切教育正在发生。法雨分类学尤可深味——地狱众生的法雨是「寂静音声」（以止息对剧苦），畜生是「无恶业道声」（以断因对苦果），阎罗界是「不舍众生」——**教法不是一套，是按苦的形状定制的**。毛孔出众生类，即〈十地品〉法云地「法雨」义的行法预演。\n\n**【对照/启发】**：与〈十身相海品〉毛孔放光对读——相好放光（果）与毛孔度生（行）互为表里。启发：读法雨专名，问自己被哪一种雨浇到——知道自己属于哪一类众生，就是知道自己该听哪一场法。\n\n**本参经文全引**（T0293·9,088 CJK·0 手抄）：\n\n> 海幢比丘。乃見處在經行林側，結跏趺坐，端身正念，離出入息，無別思覺，住不思議廣大三昧，以三昧力現大神通。於其身上，從頂至足，一切肢分，一切毛孔，悉現無量不思議數同自身相一切身雲，遍一切處現一切身：為普供養一切如來故，為普嚴淨一切佛剎故，為普成熟一切菩薩故，為普調伏一切眾生故，為普濟拔諸苦蘊故，為普除斷三惡趣故，為普開示人天路故，為普銷滅煩惱毒故，為令眾生普入甚深智慧海故，為令眾生究竟安住一切智故。從兩足下出無數佛剎極微塵數長者、居士、婆羅門眾相似身雲，首戴華冠，身垂瓔珞，明珠繫頂，被服莊嚴，無量童男以為眷屬；普往十方一切世界，悉以一切上妙供具普施眾生。所謂：普雨一切上味如法飲食，一切上妙雜色寶華，一切衣服，一切瓔珞，一切鬘帶，一切熏香，一切塗香，一切寶器，一切宮室，一切欲樂資生之具；於一切處救攝一切貧窮眾生，充濟所須，令其滿足；安慰一切苦惱眾生，獲身心樂，令其歡喜；成熟一切善根眾生，心意調柔，令其清淨，究竟無上菩提之道；如是示現充滿十方。從其兩膝出現無數百千萬億諸剎帝利及婆羅門并其眷屬相似身雲，皆悉聰慧，具諸藝業，世出世間無不通達，種種色相，種種形貌，種種衣服，上妙莊嚴，普遍十方一切世界，恒以四攝攝諸眾生。謂：與財寶令其富樂，可意語言令聞歡喜，或以同事勸導誘進；如是一切貧者令足，病者令愈，危者令安，怖者令止，有憂苦者令其快樂。復以方便咸使發心，授以正法，令其開悟，速疾令其離諸不善，集眾善法，從生死泥拔濟令出，住真實義無畏法中，如是示現充滿十方。從其臍輪出等眾生數異道諸仙相似身雲，種種形相，各別莊嚴，或服草衣，或衣樹皮，皆執澡瓶，威儀寂靜。將諸仙眾，足步虛空，往返周旋十方世界，咸出無量歌讚之聲，稱揚諸佛所有功德，或歎菩薩所修梵行，所說妙法，所證清淨，其音和雅，美妙清徹，普聞十方，無有障礙，調伏成熟一切眾生，普攝諸根，不令放逸，令其觀察真實境界；或說諸法皆無自性，使其發起一切智心，令其安住究竟實道；或說世間資生言論；或現方域導俗軌儀；種種善巧，隨宜化度。開一切智出要法門，令諸眾生普得饒益，隨其次第各修其業，如是示現，充滿十方。從其兩脇出不思議無數龍王、龍子、龍女并其眷屬相似身雲，現不思議諸龍神變，遍滿虛空。所謂：雨不思議寶香莊嚴雲，不思議寶華莊嚴雲，不思議寶鬘莊嚴雲，不思議寶蓋莊嚴雲，不思議寶幢莊嚴雲，不思議寶幡莊嚴雲，不思議種種妙寶瓔珞莊嚴雲，不思議大摩尼寶王莊嚴雲，不思議種種寶座莊嚴雲，不思議天寶嚴具莊嚴雲，不思議天寶宮殿莊嚴雲，不思議諸天、采女歌詠讚歎莊嚴雲，不思議天寶珠網莊嚴雲，不思議摩尼鬚葉臺蕊寶蓮華莊嚴雲，不思議一切摩尼寶冠莊嚴雲，不思議無邊光焰天寶莊嚴雲，不思議華鬘幢蓋天身莊嚴雲，不思議恭敬合掌諸天采女雲，不思議含輝吐焰金色蓮華雲，不思議演說一切諸佛功德大音聲雲；如是一切普遍虛空，以為莊嚴，周遍十方一切世界諸佛道場而為供養。普令眾生皆生歡喜，除煩惱熱，得清涼樂，如是示現充滿十方。從其胸臆吉祥相中出無數佛剎極微塵數阿脩羅王并其眷屬相似身雲，皆悉示現不可思議巧幻術力，種種神變充滿虛空。所謂：能令無量百千萬億世界皆悉震動，一切山王互相衝擊，一切海水皆大涌沸，諸天宮殿無不動搖，諸魔光明無不隱蔽，諸魔軍眾無不摧伏；普令眾生捨離憍慢，心無放逸，除慳嫉垢，息諸怨害，咸起慈心，破煩惱山，竭愛欲海，長無鬪諍，永共和善。復以幻力遊戲神通，開悟群生令離貪著，於諸惡法常樂遠離，怖畏生死，欣求解脫；令出世間一切諸趣，令住無上菩提之心，令修菩薩清淨妙行，令趣菩薩波羅蜜道，令入一切諸菩薩地，令照菩薩微妙法門，令觀菩薩方便善巧。如是示現遍周法界。從其背出無量阿僧祇佛剎極微塵數聲聞、獨覺相似身雲，為諸眾生應以二乘而受化者廣說法要，令其調伏。所謂：為執我者說無有我，為執常者說行無常，為貪行者說不淨觀，為瞋行者說慈心觀，為癡行者說緣起觀，為等分者說與智慧相應境界；各別對治，令遍觀察。為於境界生樂著者，說離諸著無所有性，為遍耽滯五欲境界，說離諸欲無染著性，為著寂靜定所繫者，說大願門，令深愛樂。誓普饒益一切眾生，轉於法輪；盡未來際，令諸眾生所願皆滿，如是遍周一切法界。從其兩肩出阿僧祇佛剎極微塵數夜叉、羅剎王種種形貌，種種色相，長短廣狹，種種儀容，威勢雄猛，甚可怖畏，無量眷屬而自圍遶。現種種神力，吼種種大聲，隨其所應，作種種方便，遍滿十方一切世界，守護一切善行眾生及諸賢聖、菩薩眾會說法道場。諸有受持菩薩淨行，欣求如來一切正智，若向正住及正住者，或時現作執金剛神，守護諸佛，承事供養及佛住處；或遍守護一切世間，令其不入一切惡道。有恐怖者令得安隱，有疾病者令得除差，在厄難者令除苦惱，有過惡者令自厭悔，有災橫者令其息滅。積集福智大心眾生，令其能轉諸佛法輪，捨生死輪，住正法輪，摧滅一切異道邪論，如是利益，遍滿十方一切法界。從其腹出無量百千阿僧祇佛剎極微塵數緊那羅王，各與無數百千萬億緊那羅女眷屬圍遶，無量佛剎極微塵數乾闥婆王，各與無數百千萬億乾闥婆女眷屬圍遶。各奏無數阿僧祇百千天樂，歌詠讚歎一切諸法緣生實性，歌詠讚歎一切諸佛難思功德，歌詠讚歎發菩提心普遍威力，歌詠讚歎一切菩薩修圓滿行，歌詠讚歎一切諸佛成正覺門，歌詠讚歎一切諸佛轉法輪門，歌詠讚歎一切諸佛現神變門，歌詠讚歎一切諸佛般涅槃門，歌詠讚歎守護一切諸佛教門，歌詠讚歎令諸眾生皆歡喜門；開示演說嚴淨一切諸佛剎門，開示演說一切諸佛微妙法門，開示演說照一切法無障礙門，開示演說發起一切諸善根門；如是利益充滿十方。從其面門出無量百千阿僧祇佛剎極微塵數轉輪聖王，七寶具足，四兵圍遶，放大捨光，雨無盡寶最勝摩尼，莊嚴世界，普施眾生，咸令充足，令斷十惡，修行十善。所謂：一切屠獵、漁捕、暴惡眾生令起慈悲，不斷生命；貧乏苦惱下劣眾生，令其永捨不與取行，常行惠施，能捨無量百千萬億端正采女，心無吝惜；令諸眾生永斷邪婬，修持梵行；虛誑眾生，令其究竟常真實語，不作虛誑無益談說；令攝他語，不行離間，常樂和合，無有乖諍；令柔軟語，無有麁惡；雜穢語者，令常演說甚深決定明了之義，順佛法語，利益修行，永斷綺飾無義言辭，令諸眾生深入法句；多貪欲者，令其少欲，修習知足最勝端嚴無生正行；多怒害者令除瞋恚，於諸眾生恒起慈心，心無瑕垢，為說大悲，歡喜攝受，令入佛法；墮見網者為說實義，令觀諸法，深入因緣，善明諦理，決擇正邪，令心清淨，拔邪見刺，破疑惑山；令諸眾生悟心實性，具足通達，趣入甚深，一切障礙悉皆除滅；如是所作充滿法界。從其兩目出無量百千阿僧祇佛剎極微塵數廣大日輪，放大光明普照一切諸大地獄，所有苦惱悉令除滅；又照一切世界中間，令除黑闇，覩見光明；又照一切十方世界餓鬼傍生，令其捨離愚癡翳障，得大智慧，拔除眾苦。復於一切垢濁世界放清淨光，白銀世界放黃金光，黃金世界放白銀光；瑠璃世界放玻瓈光，玻瓈世界放瑠璃光；硨磲世界放碼碯光，碼碯世界放硨磲光；赤珠世界放日藏摩尼王光，日藏摩尼王世界放赤珠光；帝青世界放月藏焰網摩尼寶王光，月藏焰網摩尼寶王世界放帝青光；純寶所成世界放雜寶光，雜寶所成世界放純寶光。如是光明普照佛剎道場眾會而作佛事，照諸眾生心之稠林，辦諸眾生無量事業，嚴飾一切世間境界，令諸眾生心得清涼，生大歡喜，安隱快樂；如是所作充滿法界。大方廣佛華嚴經卷第六大方廣佛華嚴經大方廣佛華嚴經卷第七罽賓國三藏般若奉詔譯入不思議解脫境界普賢行願品爾時，海幢比丘從其眉間白毫相中出無量百千阿僧祇佛剎極微塵數帝釋天王，威德光明超過天眾。捨離世間一切欲樂，於諸境界而得自在，摩尼寶珠以繫其頂，身光映蔽諸天宮殿，震動一切須彌山王，覺悟一切放逸天眾；歎福德力、說智慧力、生其樂力、持其志力、增其所有清淨念力、堅其所發菩提心力，讚樂見佛令除世欲，讚樂聞法令厭世間，讚樂觀智令絕世染，止脩羅戰、斷煩惱諍、滅怖死心、發降魔願、興立正法；須彌山王成辨眾生一切事業，念念調伏無量眾生，如是所作周遍法界。從其額上出無量百千阿僧祇佛剎極微塵數諸梵天王。色相端嚴，世間無比，威儀寂靜，言音美妙，請佛轉法，歎佛功德，令諸菩薩心生歡喜，能辦眾生無量事業，如是普遍十方法界。從其頭上出無量百千阿僧祇佛剎極微塵數諸菩薩眾，皆以相好莊嚴其身。其諸菩薩各於其身肢節毛孔一切普放大光明雲，顯現諸佛往昔所行菩薩行海，宣說菩薩種種妙行，所謂：普遍十方一切世界稱揚讚歎一切諸佛往昔所行檀波羅蜜，施者、受者、及所施物并所隨順相應行海；示導一切慳吝眾生永離慳著，成就捨心，常行惠施，攝取眾生令住無上檀波羅蜜，顯示諸佛相好功德令得眾寶莊嚴世界，及示依正所出生因令諸眾生愛樂修習。普遍十方一切世界稱揚讚歎一切諸佛往昔所行尸波羅蜜，并所隨順相應行海；令諸眾生於五欲境深生厭離，於諸佛境專意趣求，除顛倒想，恒正思惟，斷邪分別，永離諸惡，念菩薩戒，攝諸眾生住大慈悲，稱讚解脫，護持如來究竟戒品，普令眾生住於佛戒；說一切有悉皆如夢，了達諸法自性皆空，說諸欲樂無有滋味，令諸眾生遠離欲縛，出煩惱垢。普遍十方一切世界稱揚讚歎一切諸佛往昔所行忍波羅蜜，并所隨順相應行海；令諸眾生得法自在，得心自在，具忍辱力；稱揚讚歎金色身業，離瞋恚垢；起慈悲行、止殺害心、絕畜生道。普遍十方一切世界稱揚讚歎一切諸佛往昔所修勤波羅蜜，并所隨順相應行海；令諸菩薩精進勇猛，為一切智勤求正法，供養承事一切如來，恭敬讚歎心無疲厭；令諸世間不起放逸，攝取眾生令離苦蘊，入佛究竟圓滿智海。普遍十方一切世界稱揚讚歎一切諸佛往昔所修禪波羅蜜，并所隨順相應行海；令其散滅塵勞障翳，永捨憍慢，不起貪瞋，蔭清涼雲，除煩惱熱，竭生死海，摧業結山，調伏眾生，安住妙法，究竟令其心得自在。普遍十方一切世界稱揚讚歎一切諸佛往昔所修般若波羅蜜，并所隨順相應行海；普耀正見智慧電光，令諸眾生照達本性，普震清淨妙法雷音，令諸眾生增長功德，摧滅一切我慢高山，拔出一切諸見毒箭，決除一切疑惑翳膜，令諸眾生得自在智。普遍十方一切世界稱揚讚歎一切諸佛往昔所修方便波羅蜜，并所隨順相應行海，隨順世間種種所作，令諸眾生究竟成熟，雖普調伏一切眾生而於眾生無所染著，雖普照明諸佛眾會而於眾會心無所著，雖離生死而於諸趣自在受生，雖現世間而於涅槃入出自在，雖能了達生死涅槃無二無別而常善巧饒益眾生，安住菩薩圓滿自在，超出世間到於彼岸。普遍十方一切世界稱揚讚歎一切諸佛往昔所成願波羅蜜，并所隨順相應行海，令諸菩薩盡未來際乘四願輪遊正覺路遍周剎海，利樂眾生摧無明山，裂愛欲網，解眾結縛，永滅無餘，示現神通種種變化令諸眾生壽命自在。普遍十方一切世界稱揚讚歎一切諸佛往昔所成力波羅蜜，并所隨順相應行海；演說菩薩大總持力、方便法音妙辯才力、成熟眾生廣大願力、摧伏魔怨智自在力、制諸外道心無畏力，身力堅固猶若金剛能碎一切大鐵圍山，能滅十方一切劫火，能竭海水，能吞猛風，掌擎盡空所有世界而於身力無有損減，令諸眾生淨治三昧普於一切自在受生。普遍十方一切世界稱揚讚歎一切諸佛往昔所修智波羅蜜，并所隨順相應行海，分別演說種種智地，所謂：普生諸佛十力、無畏、一切功德具足智地、普滿諸佛一切相好自在莊嚴具足智地、普發菩薩一切大願具足智地、普遍攝受一切眾生具足智地、普為眾生顯示無我具足智地、普遍觀察一切眾生種種心念具足智地、普遍分別一切眾生根解差別具足智地、普遍隨順一切眾生信樂差別具足智地、普遍了知一切眾生甚深業海無量差別具足智地、普遍趣入一切眾生無量願海心樂差別具足智地。從其頂上肉髻之中出無量阿僧祇佛剎極微塵數如來之身，其身最勝世無能比。諸相隨好清淨莊嚴，威光赫奕如真金山，無量光明普照十方。演妙圓音普周法界，示現無量大神通力，為諸世間普雨法雨隨其所應皆令獲益，所謂：為坐菩提場諸菩薩雨大法雨，名平等現前智；為灌頂位諸菩薩雨大法雨，名普門法界；為法王子位諸菩薩雨大法雨，名入諸菩薩普莊嚴門；為童真位諸菩薩雨大法雨，名住堅固山大法智雲；為不退位諸菩薩雨大法雨，名普遍莊嚴平等海藏；為成就正心位諸菩薩雨大法雨，名以金剛智普照境界；為方便具足位諸菩薩雨大法雨，名普攝眾生自性莊嚴門；為生貴位諸菩薩雨大法雨，名如來圓滿隨順世間；為修行相應位諸菩薩雨大法雨，名演法本際悲愍世間；為治地位諸菩薩雨大法雨，名積集法藏；為初發心諸菩薩雨大法雨，名普攝眾生平等莊嚴；為廣大信解諸菩薩雨大法雨，名如來願藏無盡解脫；為無色界諸天雨大法雨，名普門智無盡藏；為梵世諸天雨大法雨，名無量教聲普門智藏；為他化自在天雨大法雨，名能生法力資具無盡藏；為諸魔眾雨大法雨，名種種心幢勤求一切智；為化樂諸天雨大法雨，名淨念智寶住種種善軛；為兜率諸天雨大法雨，名菩薩生意種種願寶幢；為夜摩諸天雨大法雨，名隨順如來淨念歡喜藏；為忉利諸天雨大法雨，名疾見如來出生莊嚴愛樂藏；為諸龍王眾雨大法雨，名出生菩薩厭離龍趣種種神變歡喜幢；為夜叉王眾雨大法雨，名見佛歡喜普遍法界如來神變藏；為乾闥婆王眾雨大法雨，名一切如來集法音聲雲；為阿脩羅王眾雨大法雨，名金剛智輪大法境界；為迦樓羅王眾雨大法雨，名無邊光明出生一切如來方便；為緊那羅王眾雨大法雨，名一切如來饒益世間殊勝智雲；為摩睺羅伽王眾雨大法雨，名愛樂速疾增長法；為諸人王眾雨大法雨，名得一切眾生勝智慧法；為地獄眾生雨大法雨，名寂靜音聲正念莊嚴；為畜生眾生雨大法雨，名隨順如來具智慧藏無惡業道聲；為閻羅王界眾生雨大法雨，名不捨眾生出生如來波羅蜜聲；為諸厄難處眾生雨大法雨，名寂靜音聲普遍安慰悉令眾生永離憂苦咸得入於賢聖眾會，如是所作充滿十方一切法界。海幢比丘各於其身一切毛孔一一皆出無量阿僧祇佛剎極微塵數大光明網；一一光明具阿僧祇色相；一一色相有阿僧祇莊嚴；一一莊嚴現阿僧祇境界；一一境界辨阿僧祇事業，如是普遍十方法界。爾時，善財復於如是大光網中，悉見海幢往昔所修一切菩薩三世所行檀波羅蜜，悉捨一切內外所有圓滿施行。往昔所修一切菩薩三世所持尸波羅蜜，從初發心盡未來劫誓捨身命，不起一念毀犯之心。往昔所修一切菩薩三世相應忍波羅蜜，或遇損害頭、目、手、足，斷截肢節、惡言毀辱，悉能安受無有動亂；恒思捨離怨害之心，觀自他身無有我相，生大慈悲成一切智，以是因緣獲得菩薩具足相好自在色身；示一切身於一切處、經一切劫、受一切苦，勤求正法利益眾生，不起一念厭退之心；種種神變普遍十方等眾生界，現一切身如影隨形充滿法界。往昔所修一切菩薩三世所行勤波羅蜜，所學三世諸佛菩薩，勇猛精進離相妙行，所現種種神通變化，震動十方一切世界諸大海水；令諸眾生精勤匪懈，厭生死海出離魔界，一切外道無不怖懼，一切魔軍無不摧碎，光照十方一切法界，令諸菩薩修種種行，種種神變，普利眾生。往昔所修一切菩薩三世所求禪波羅蜜，或見受身生諸族姓，或為國王遇善知識發菩提心，厭棄國城，出家學道，立大誓願，種種威儀，堅持禁戒，身心寂靜，修諸禪定。往昔所修一切菩薩三世所成般若波羅蜜，為欲開發一切智故，勤求佛法，生正見心；為欲拔濟諸眾生故，事善知識，親近承事不違言教，尊重恭敬深生信心，禮拜供養情無懈倦；勤求如來一句正法，遍捨一切內外所有，於身、命、財，心無吝惜，乃至勤求一切法句亦復如是，如是念念盡未來際諸所修行，皆為成就一切眾生，究竟圓滿智慧業故。往昔所修一切菩薩三世相應方便波羅蜜，能於一切諸趣類海，普現一切眾生色相相似身雲；以種種威儀善巧攝受，普令眾生獲大饒益。往昔所求一切菩薩所發三世願波羅蜜，所謂：供事一切諸佛願、成熟一切眾生願、嚴淨一切佛剎願，如是所發一切誓願，圓滿修行所成功德，具足一切如來相好，修諸對治一切善法，滅除一切生死過患，盡未來劫利益眾生，誓願無盡。往昔所修一切菩薩三世相應力波羅蜜，所謂：出生大願力、普供諸佛力、普淨佛剎力、普修妙行力、普化眾生力。往昔所修一切菩薩三世所行智波羅蜜，恒以一切微細境界圓滿智力，啟悟法界一切眾生無明睡眠，咸令開覺，究竟出生一切智道。海幢比丘各於其身從足至頂，乃至一切毛孔之中所現境界，善財童子於念念中無不明見。爾時，善財一心觀察海幢比丘，深生渴仰，憶念彼不思議三昧解脫，隨順彼不思議三昧自在，思惟彼不思議利益眾生巧方便海，深入彼不思議無作妙用普莊嚴門，愛樂彼不思議甚深信解清淨境界，觀察彼不思議莊嚴法界清淨智，安住彼不思議受佛究竟加持智，出生彼不思議菩薩自在力，堅固彼不思議菩薩大願力，增廣彼不思議菩薩諸行力。如是住立，思惟觀察，一日一夜，乃至經於七日七夜，半月一月，乃至六月，復經六日，過此已後海幢比丘從三昧起。善財爾時以身布地恭敬作禮，起立合掌歎未曾有，讚言：「聖者！如此三昧希有奇特，此三昧門最為甚深，此三昧門最為廣大，此三昧門境界無量，此三昧門神變難思，此三昧門光明無等，此三昧門莊嚴無數，此三昧門威力難制，此三昧門境界平等不動不亂，此三昧門普照十方一切世界，此三昧門方便無量有勝堪能。所以者何？如此三昧利益無盡，以能除滅一切眾生無量苦蘊故；所謂：能令一切眾生斷貧窮業故，出地獄苦故，免畜生趣故，絕餓鬼因故，閉諸難門故，開人天道故，親近一切安樂法故，出生人天殊勝樂故，令其愛樂定境界故，能令增長有為樂故，能為顯示勤求出離三界法故，能為引發勤求無上菩提心故，能使增長大福智聚出生因故，能令速疾增長廣博大悲心故，能令出生廣大願力故，能令照明菩薩智道故，能使莊嚴波羅蜜道故，能令深入最勝大乘故，能令明了普賢妙行故，能令趣入諸菩薩地智光明故，能令積集成就菩薩諸願行故，能令安住一切智智境界中故，能令清淨一切菩薩變化力故，能令勤求一切加持自在力故。聖者！此三昧門名為何等？」海幢告言：「善男子！此三昧名普眼捨得，亦名般若波羅蜜境界清淨光明，亦名平等清淨普莊嚴門。善男子！我以修習此平等清淨普莊嚴門而為上首，具足圓滿百萬阿僧祇最勝最尊無比三昧。」善財白言：「聖者！此三昧境界究竟唯如是耶？」海幢言：「善男子！此三昧門境界甚深廣大無量，若有修習，身心寂靜。入三昧時：了知十方一切世界無所障礙，往詣十方一切世界無所障礙，入出十方一切世界無所障礙，莊嚴十方一切世界無所障礙，修治十方一切世界無所障礙，嚴淨十方一切世界無所障礙，見一切佛普遍十方無所障礙，觀一切佛廣大威德無所障礙，知一切佛遊戲神通無所障礙，證一切佛甚深智力無所障礙，入一切佛大功德海無所障礙，興一切佛無上法雲無所障礙，受一切佛無量法雨無所障礙，於諸佛法修習妙行無所障礙，知一切佛轉妙法輪平等智性無所障礙，入一切佛道場眾海現神通力無所障礙，隨順十方一切諸佛所起妙行無所障礙，觀察十方一切諸佛演說妙法無所障礙，普入十方一切佛剎咸起神通無所障礙，大悲攝受十方眾生令其出苦無所障礙，常起大慈充滿十方與眾生樂無所障礙，普見十方一切諸佛心無厭足無所障礙，普入十方一切眾生種種解海無所障礙，普知十方一切眾生種種根海無所障礙，普知十方一切眾生種種業海無所障礙。善男子！我唯知此般若波羅蜜清淨光明三昧法門，如諸菩薩摩訶薩所入甚深究竟智海，所淨最勝諸法境界，所達一切諸佛法門，所往十方無量佛剎，所有大智總持光明，所住圓滿自在三昧，所現清淨種種神通，所具無盡辯才大海，所得無畏美妙音聲善巧宣說諸地功德，所能擁護一切眾生；而我何能知其妙行，歎其功德，顯其境界，讚其願力，現其光明，入其度門，達其所證，集其勝業，了其次第，知其普遍，住其三昧，見其心境，說其正道，辨其威勢，得其所有平等智慧？「善男子！從此南行至海潮處，彼有大城名圓滿光，其城有王名妙圓光。於彼城東有一園林名普莊嚴，王有夫人名伊舍那，為優婆夷，止住此林修菩薩行；汝往彼問菩薩云何學菩薩行，修菩薩道。」時，善財童子於海幢比丘所得最勝法，獲堅固身，證三昧境，究竟明徹，住清淨解，悟深法界。其心隨順諸佛教海，於諸法門憶持不忘；安住廣大普莊嚴門，智慧光照充滿十方，心生歡喜踊躍無量，五體投地禮海幢足，遶無量匝，重復頂禮，恭敬瞻仰，思惟觀察，想其容止，持其名號，念其功德，觀其行願，憶其言音，思其三昧，想其所行廣大境界，受其所得總持智慧清淨光明，諮嗟戀慕，辭退南行。爾時，善財童子蒙善知識力，令功德身信解圓滿，依善知識教正念思惟，念善知識語遞相開發，於善知識行深生慚愧，愛樂恭敬，觀善知識心善巧攝受，倍益歡喜。作是念言：「因善知識令我普見一切諸佛；因善知識令我普聞一切佛法；善知識者是我師範，示導於我一切智法，普令見故；善知識者是我眼目，令我普見諸佛境界如虛空故；善知識者是我渠流，引我令入諸佛如來蓮華池故。」如是思念，漸次南行，向海潮處。至彼城東，見普莊嚴園眾寶垣牆周匝圍遶，一切寶樹行列莊嚴。所謂：諸寶葉樹枝葉枎踈，光彩鮮明，敷榮微妙；諸寶華樹，雨眾妙寶；拘蘇摩華，發焰舒光，布散于地；諸寶香樹，吐妙香雲，香氣氛氳，普熏十方諸佛世界；諸寶鬘樹，雨大寶鬘，莊嚴寶林，處處垂下；摩尼王樹，普雨種種大摩尼寶，遍布充滿，隨處莊嚴；一切天寶劫波衣樹，普雨種種妙寶繒綵雜色衣服，隨其所應敷布嚴飾；寶音樂樹出妙樂器，微風吹動發和雅音，其音美妙過諸天樂；諸寶資具莊嚴藏樹，各雨眾寶珍奇玩好；諸莊嚴具處處分布，以為嚴飾。其地清淨無有高下，寬廣平坦，種種莊嚴。園中具有百萬殿堂大摩尼寶之所合成，百萬樓閣閻浮檀金以為校飾，百萬宮殿毘盧遮那摩尼寶王間錯莊嚴，雲構龍盤，延袤遠近，甍棟相承，勢如飛動。百萬浴池七寶合成，一切妙寶以為其岸；細妙金沙，澄布其底；七寶階道、摩尼欄楯，周匝圍遶，四面莊嚴；寶草芬芳，夤緣際畔；栴檀香水盈滿其中，調適溫涼隨眾生意。寶樹林間，寶渠分布，水清寶珠周遍間錯，晝夜常流八功德水；水中多有鳧鴈、鴛鴦、白鶴、孔雀、迦陵、頻伽、拘枳羅等雜色諸鳥，飛集往來，遊戲出沒，整毛理翮，游泳翱翔，出妙好聲清切和雅，猶如天樂令人樂聞。寶多羅樹周匝行列，覆以寶網，垂諸金鈴，微風徐搖，恒出美音；建立無數摩尼寶幢、雜寶繒幡，四面垂飾，光明普照百千由旬。其中復有百萬陂池，香水湛然，清瑩澄澈，隨時堅細，栴檀香泥澄垽其下，一切上妙眾寶蓮華菡萏芬敷，大摩尼華光色照耀。園中復有廣大宮殿，名莊嚴幢海藏，妙寶以為其地，種種形像悉現其中，毘瑠璃寶以為其柱，閻浮檀金寶莊嚴網彌覆其上，重樓挾閣巍巍高大猶妙金山，見者欣樂。種種勝寶以為莊嚴；光藏摩尼恒吐妙光，以為照耀；毘盧遮那藏摩尼寶王殊麗校飾，輝映分明；一切眾寶無價香王咸出妙香，普熏一切。所謂：具足一切最勝妙寶香王，香氣普騰氤氳成霧；普現如意妙寶香王，香氣隨應周聞法界；隨根覺悟妙寶香王，凡所嗅聞，諸根聰利，能於正法精勤匪懈。其宮殿中復有無量寶蓮華座周迴布列。所謂：光照十方妙藏摩尼寶蓮華座、毘盧遮那如意摩尼寶蓮華座、無垢藏摩尼寶蓮華座、雜寶莊嚴摩尼寶蓮華座、普門莊嚴摩尼寶蓮華座、圓光莊嚴摩尼寶蓮華座、安住海藏清淨莊嚴摩尼寶蓮華座、普焰光照摩尼寶蓮華座、金剛藏師子摩尼寶蓮華座、照耀世間摩尼寶蓮華座；如是無量摩尼寶蓮華座，一一皆以不可思議妙寶繒帶四面垂飾，不可思議眾色摩尼以為莊校，於宮殿中光影相照平等莊嚴。空中復有百萬寶帳，所謂：寶衣帳、寶鬘帳、寶華帳、寶香帳、閻浮檀金帳、寶枝垂覆帳、雜寶摩尼帳、妙寶瓔珞帳、光焰金剛帳、諸天妓樂帳、象王神變帳、馬王神變帳、帝釋所坐摩尼寶帳；如是種種寶莊嚴帳嚴飾虛空。復有百萬諸大寶網彌覆其上，所謂：寶鈴網、寶蓋網、寶身網、海藏真珠網、紺瑠璃摩尼寶網、師子摩尼寶網、月愛光明摩尼寶網、一切人天種種形像寶香網、一切雜色寶冠網、一切妙寶瓔珞網；如是等網各於其上垂覆莊嚴。復有百萬大寶光明而為照耀，所謂：焰光摩尼寶光明、日藏摩尼寶光明、月藏摩尼寶光明、香焰摩尼寶光明、吉祥焰藏摩尼寶光明、蓮華焰藏摩尼寶光明、焰幢摩尼寶光明、大焰摩尼寶光明、遍照十方摩尼寶光明、普現香雲莊嚴具摩尼寶光明；如是等類大寶光明而為照耀。常雨百萬莊嚴具雲，隨意受用；百萬隨時芬馥白栴檀香雲，普熏道場；百萬天諸妙樂雲，音聲美妙；百萬天曼陀羅華雲，而以布散；百萬諸天鬘帶雲，處處垂下以為嚴飾；百萬天寶繒綵雲，處處垂布以為衣服；百萬出過諸天寶瓔珞雲，莊嚴林樹及諸樓閣。百萬欲界天子欣樂瞻仰，恭敬作禮；百萬諸天采女往修同行，常來其所，投身而下，親近敬奉；百萬諸大菩薩恒詣道場，常樂聞法。時，伊舍那具大人相，坐真金座，戴海藏真珠網冠，挂出過諸天真金寶釧，垂紺青髮，頂髻莊嚴；吉祥焰藏摩尼寶王以為鬘帶，毘瑠璃摩尼寶以為耳璫，師子口摩尼寶緣飾耳輪，大如意摩尼寶王以為瓔珞，莊嚴其頸，大威德帝青摩尼寶網以覆其首，種種光焰熾盛摩尼寶網羅覆其身；百千億那由他眾生曲躬恭敬，親近供養。東方有無量眾生來詣其所。所謂：大梵天、梵輔天、梵眾天，如是色界一切諸天；欲界他化自在天、化樂天、兜率天、夜摩天、忉利天、諸龍、夜叉、乾闥婆、阿脩羅、迦樓羅、緊那羅、摩睺羅伽及鳩槃茶，閻羅王界、大力鬼神、乃至一切人及非人、諸王眾等，南、西、北方，四維，上、下，亦復如是。其有見此優婆夷者，身病、心病，種種所纏，一切邪見、障礙執著所有惑苦，悉得除滅；速離一切諸煩惱垢，速拔一切諸見毒刺，疾破一切諸障礙山，深入無礙清淨境界；種植一切圓滿善根，長養一切善法根芽，入於一切清淨智門，普獲一切陀羅尼門，普證一切大三昧海，通達一切諸佛教海，一切諸佛廣大願門無不開發，一切菩薩所修妙行皆悉現前，一切如來功德大海皆悉清淨。其心廣大，具足一切自在神通；其身無礙，於一切處靡所不至，普詣十方無所依著，隨順成就一切法門。爾時，善財童子入普莊嚴園，周遍觀察；\n\n#### 参7·伊舍那優婆夷\n\n**参题解**：普莊嚴園·伊舍那優婆夷（八十作休捨優婆夷）。法门：**「我得菩薩一解脫門，無間修習」——经文未举门名**（如实存目）。\n\n**【要点提炼】**\n\n1. **不唐捐**：「若有眾生暫見我身、暫聞我名、或聽我法、憶念於我、與我同住……悉不唐捐」——接触善知识的任何形式都不空过。\n2. **见之条件**：「若有眾生不種善根、不為善友之所攝受、不為諸佛之所護念，雖近於我經於多時，與我同住終不能見」——同住而不得见：见善知识不在物理距离。\n3. **常不离佛**：「東方所有一切如來常來至此處，於眾寶妙師子座為我說法」十方悉然——家宅即道场，妇人之身即佛座所敷。\n\n**【阐释】**（〔本文判断〕）参7把善知识清单开到**在家女性**：园居优婆夷、八万四千亿那由他会众同住共修——道场不必山林。「終不能見」一句最厉：善财也是「近于我」者之一，他得以见，是因为具根；不具根者同园终生不遇——参学的可见性由善根决定，不由机遇决定。门名不举而说「無間修習」：此参的功行无间隙，名相反成余事〔本文判断：四十本于此处的立名从简，正显「行胜于名」〕。\n\n**【对照/启发】**：与〈菩薩住處品〉清涼山文殊一万眷属对读——常住型道场的两种形态。启发：「終不能見」对治打卡式亲近——同住数年不见者，差的是善根，不是运气。\n\n**本参经文全引**（T0293·3,244 CJK·0 手抄）：\n\n> 見伊舍那優婆夷，往詣其所，頂禮其足，遶無數匝，正立合掌，白言：「聖者！我已先發阿耨多羅三藐三菩提心，而未知菩薩云何學菩薩行，云何修菩薩道，我聞聖者善能誘誨諸菩薩眾，願為我說。」時，伊舍那告善財言：「善男子！我得菩薩一解脫門，無間修習；若有眾生暫見我身、暫聞我名、或聽我法、憶念於我、與我同住、親近隨順供給我者，悉不唐捐。善男子！若有眾生不種善根，不為善友之所攝受，不為諸佛之所護念；雖近於我經於多時，與我同住終不能見。善男子！其有眾生得見我者，皆於阿耨多羅三藐三菩提獲不退轉。善男子！東方所有一切如來、應、正等覺常來至此處，於眾寶妙師子座為我說法。南、西、北方，四維，上、下，一切如來悉來至此處，於寶座為我說法。善男子！我常不離見佛聞法，與諸菩薩而共同住，不離菩薩三昧解脫。善男子！我此會眾有八萬四千億那由他，常在於此普莊嚴園與我同住，皆於往昔與我修習一切菩薩同類行門，不相離故，一切咸於阿耨多羅三藐三菩提得不退轉。其餘眾生或久、或近住此園者，一切修我同類行門，亦皆普入不退轉位。」善財白言：「聖者！發阿耨多羅三藐三菩提心為久近耶？」答言：「善男子！我憶曾於然燈佛所親近承事，修行梵行，恭敬供養，聞法受持；次前於離垢佛所出家學道，受持正法；次前於星宿幢佛所聞法修行，歡喜供養；次前於妙勝吉祥佛所，次前於蓮華德藏佛所，次前於毘盧遮那佛所，次前於普眼佛所，次前於梵壽佛所，次前於金剛臍佛所，次前於水天佛所。善男子！我憶過去於無量劫、無量生中，如是次第三十六恒河沙佛所皆悉親近，一心承事、恭敬供養、出家學道，所受正法，所發誓願，所入三昧，所證解脫，如是一切種種行門我皆憶持，心無廢忘，過此已往，佛智所知，非我能測。「善男子！應知菩薩初發心無有量，充滿一切法界故；菩薩大悲門無有量，普入一切眾生界故；菩薩大願門無有量，究竟十方一切法界故；菩薩大慈門無有量，普覆一切眾生界故；菩薩所修行無有量，於一切剎一切劫中恒修習故；菩薩三昧力無有量，令菩薩道不退轉故；菩薩總持力無有量，能持世間隨所應聞教法海故；菩薩智明力無有量，普能悟入三世佛教巧隨順故；菩薩神通力無有量，普現十方一切所有諸剎網故；菩薩辯才力無有量，圓音一演，令諸眾生隨類解故；菩薩清淨身無有量，現身普遍諸佛剎故。」大方廣佛華嚴經卷第七大方廣佛華嚴經大方廣佛華嚴經卷第八罽賓國三藏般若奉詔譯入不思議解脫境界普賢行願品爾時，善財童子白言：「聖者！久如當得阿耨多羅三藐三菩提？」答言：「善男子！菩薩不為教化調伏一眾生故發菩提心，不為教化調伏百眾生故發菩提心，不為教化調伏千眾生故發菩提心，不為教化調伏百千眾生故發菩提心，乃至不為教化調伏不可說不可說轉眾生故發菩提心，不為教化成熟一世界眾生故發菩提心，乃至不為教化成熟不可說不可說轉世界眾生故發菩提心，不為教化成熟一閻浮提極微塵數世界眾生故發菩提心，不為成熟一四天下極微塵數世界眾生故發菩提心，不為成熟小千世界極微塵數世界眾生故發菩提心，不為成熟中千世界極微塵數世界眾生故發菩提心，不為成熟三千大千世界極微塵數世界眾生故發菩提心，乃至不為教化成熟不可說不可說轉三千大千世界極微塵數世界眾生故發菩提心。復次，菩薩不為親近供養一如來故發菩提心，乃至不為親近供養不可說不可說轉佛剎極微塵數諸如來故發菩提心，不為親近供養一世界中盡未來劫次第興世諸如來故發菩提心，乃至不為親近供養不可說不可說轉世界中盡未來劫次第興世諸如來故發菩提心，不為親近供養一佛剎極微塵數世界中盡未來劫次第興世諸如來故發菩提心，乃至不為親近供養不可說不可說轉佛剎極微塵數世界中盡未來劫次第興世諸如來故發菩提心。復次，菩薩不為嚴淨一世界故發菩提心，乃至不為嚴淨不可說不可說轉世界故發菩提心，不為嚴淨一佛剎極微塵數世界故發菩提心，乃至不為嚴淨不可說不可說轉佛剎極微塵數世界故發菩提心。復次，菩薩不為受持一如來教故發菩提心，乃至不為受持不可說不可說轉佛剎極微塵數如來教故發菩提心。復次，菩薩不為修習一如來願故發菩提心，乃至不為修習不可說不可說轉佛剎極微塵數如來願故發菩提心。復次，菩薩不為往一佛剎故發菩提心，乃至不為往不可說不可說轉佛剎極微塵數諸佛剎故發菩提心。復次，菩薩不為莊嚴一如來眾會故發菩提心，乃至不為莊嚴不可說不可說轉佛剎極微塵數如來眾會故發菩提心。復次，菩薩不為受持一佛所轉妙法輪故發菩提心，乃至不為受持不可說不可說轉佛剎極微塵數如來所轉妙法輪故發菩提心。復次，菩薩不為住持一如來遺法故發菩提心，乃至不為住持不可說不可說轉佛剎極微塵數如來遺法故發菩提心，不為住持一世界中盡未來劫次第出現如來遺法故發菩提心，乃至不為住持不可說不可說轉佛剎極微塵數世界中盡未來劫次第出現如來遺法故發菩提心，不為住持一閻浮提極微塵數世界中盡未來劫次第出現如來遺法故發菩提心，不為住持一四天下極微塵數世界中盡未來劫次第出現如來遺法故發菩提心，乃至不為住持不可說不可說轉佛剎極微塵數世界中盡未來劫次第出現如來遺法故發菩提心；如是略說不為滿一佛誓願故，不為往一佛國土故，不為入一佛眾會故，不為持一佛法眼故，不為轉一佛法輪故，不為知一世界中諸劫次第故，不為知一眾生種種心海故，不為知一眾生種種根海故，不為知一眾生種種業海故，不為知一眾生種種行海故，不為知一眾生種種煩惱海故，不為知一眾生種種煩惱習氣海故，乃至不為知不可說不可說轉佛剎極微塵數眾生種種煩惱習氣海故發菩提心。何以故？菩薩為欲教化調伏一切眾生悉無餘故發菩提心；為欲親近供養一切諸佛悉無餘故發菩提心；為欲嚴淨一切諸佛，所有剎土悉無餘故發菩提心；為欲守護一切佛教悉無餘故發菩提心；為欲隨順一切如來所行之道悉無餘故發菩提心；為欲成滿一切如來廣大誓願悉無餘故發菩提心；欲往一切諸佛國土悉無餘故發菩提心；欲入一切諸佛眾會悉無餘故發菩提心；欲知一切諸世界中諸劫次第悉無餘故發菩提心；欲知一切眾生心海悉無餘故發菩提心；欲知一切眾生根海悉無餘故發菩提心；欲知一切眾生業海悉無餘故發菩提心；欲知一切眾生行海悉無餘故發菩提心；欲滅一切眾生諸煩惱海悉無餘故發菩提心；欲拔一切眾生煩惱習氣海悉無餘故發菩提心。「善男子！取要言之：菩薩以如是等百萬阿僧祇方便行故發菩提心。善男子！菩薩行普入一切法皆證得故；普入一切剎悉嚴淨故。是故，善男子！嚴淨一切世界盡我願乃盡，悉知十方一切世界劫次第盡我願乃盡，悉得十方一切諸佛功德海盡我願乃盡，次第修集一切菩薩精進海盡我願乃盡，莊嚴十方一切諸佛眾會海盡我願乃盡，悉見十方一切眾生心樂海盡我願乃盡，悉知十方一切眾生根器海盡我願乃盡，普觀十方一切眾生諸行海盡我願乃盡，普竭十方一切眾生惑業海盡我願乃盡，悉滅十方一切眾生眾苦海盡我願乃盡，悉拔十方一切眾生習氣海盡我願乃盡。善男子！如是乃至百千萬億阿僧祇菩薩行門，皆悉圓滿，悉無餘故我願乃滿。是故，菩薩為欲成滿一切智故，為欲隨順菩薩行故，為欲嚴淨一切剎故，於一切法勇猛勤求無有懈息。善男子！應知菩薩發菩提心所修行願，所有志樂，廣大如法界究竟如虛空；虛空究竟無窮盡故，我願究竟亦無有盡；法界廣大無邊際故，我願廣大亦無邊際；諸眾生界究竟無盡故，我願究竟亦無有盡。」善財童子白言：「聖者！此解脫門名為何等？」伊舍那言：「善男子！此解脫名離憂安隱幢。善男子！我唯知此一解脫門，如諸菩薩摩訶薩樂欲深廣，猶如大海，容受佛法心無厭足；志意堅固如須彌山，所修正行不可傾動；所作不空，如善見藥能除眾生煩惱重病；無礙慧身如明淨日滅諸眾生無明闇障；無盡大悲，猶如大地普作一切眾生所依；福智功德猶如好風，與諸眾生作大義利；普照世間猶如燈燭，能生一切智慧光明；普現其身猶如大雲，能與眾生雨寂滅法；福德光明猶如滿月，能令見者咸得安樂；威德尊勝猶如帝釋，悉能守護一切眾生，而我云何能知、能說彼諸菩薩難思戒、定無邊法海功德行願？善男子！於此南方海潮之處，有一國土名那羅素，中有仙人名大威猛聲；汝詣彼問菩薩云何學菩薩行，修菩薩道。」時，善財童子禮伊舍那優婆夷足，遶無數匝，慇懃瞻仰，悲泣流淚，作是思惟：「善知識者難可出現，如優曇華；善知識者最極難值，善知識者難得親近，善知識者難得承事，善知識者難令歡喜。」復作是念：「得菩提難，得菩薩諸根難，淨菩薩諸根難，值同行善知識難，積集菩薩廣大善根難，寂靜菩薩廣大境界難，如理觀察菩薩行願難，隨順思惟菩薩教法難，依教修行菩薩妙行難，憶念出生菩薩善心難，速疾發起菩薩方便難，善巧增長一切智法光明難。」作是念已，辭退而去。爾時，善財童子隨順思惟菩薩正教，隨順思惟菩薩淨行，起速疾增長一切菩薩福力心，起速疾普見一切諸佛光明心，起速疾獲得一切法藏心，起速疾增長一切大願心，起速疾現見十方諸法心，起速疾明照諸法本性心，起速疾散滅一切障礙心，起速疾觀察法界無闇心，起速疾能壞內垢金剛心，起速疾摧伏魔王軍眾心，起速疾清淨意寶莊嚴心。如是思惟，\n\n#### 参8·毘目瞿沙仙人\n\n**参题解**：那羅素國大林·毘目瞿沙仙人（大威猛仙·十千仙众围遶·鹿皮树皮之衣）。法门：**菩薩無勝幢解脫門**（实测）。\n\n**【要点提炼】**\n\n1. **善知识六喻**：善财自念「善知識者則是趣向一切智**門**／**乘**／**船**／**炬**／**道**……」——以门·乘·船·炬·道连喻，把善知识的功能一次性定义完毕。\n2. **仙人身份入列**：外道仙人是善知识——髻环垂鬓、藉草而坐，与比丘优婆夷同列不悖。\n3. **触手示现**：（仙人执善财手按顶，善财即于自身见无量佛刹）得殊胜智光明已，「於一切處皆隨現身……演說究竟平等、無二、無別、無分別法」。\n\n**【阐释】**（〔本文判断〕）参8立「**善知识无定相**」的边界样本：仙众、异服、威猛之号（大威猛）皆不妨为佛道之桥——善知识资格在道不在相。「六喻」（门乘船炬道）是善财一路自策的浓缩：把遇师经验内化为词汇表，此后每参皆以此词汇读人。法门名「無勝幢」可味：幢以胜立，此幢以「无胜」为胜——不与物竞而威德自成，正合仙居林下之风。\n\n**【对照/启发】**：与〈菩薩住處品〉震旦那罗延窟等「真实地理」对读——善知识亦落于具体国土。启发：六喻可作选师标准——能为我开门吗？能载我行吗？能照我的暗吗？三问过，方是师。\n\n**本参经文全引**（T0293·2,287 CJK·0 手抄）：\n\n> 漸漸遊行至那羅素國，周遍尋求大威猛仙，見一大林其林蓊欝，阿僧祇樹以為莊嚴。所謂：種種葉樹枝條扶踈，密葉葱翠；種種華樹，柯葉布濩，繁華鮮美；種種果樹，相續成熟；種種寶樹，雨摩尼果；大栴檀樹處處行列；諸沈水樹常出好香；閻浮檀樹恒雨甘果；悅意香樹妙香莊嚴；波吒羅樹其華鮮榮，香氣芬馥四面圍遶；尼拘陀樹其身聳擢，枝葉繁布，盤旋如蓋；優鉢羅華、波頭摩華、拘物頭華、芬陀利華處處開敷，以嚴池沼。時，善財童子入此大林，見栴檀樹其身洪直，枝條垂布，華葉繁密，偃蓋成蔭。時，彼仙人在此樹下縈髮為髻，藉以香草；十千仙眾，前後圍遶。其諸仙人，或衣鹿皮，或衣樹皮，或編細草種種衣服，髻環垂鬢，瞻仰而住。善財見已，往詣其所，五體投地，深心頂禮，作如是言：「我今得遇真善知識。」復作是念：「善知識者則是趣向一切智門，令我得入真實道故；善知識者則是趣向一切智乘，令我得至如來地故；善知識者則是趣向一切智船，令我得至智寶洲故；善知識者則是趣向一切智炬，令我得生十力光故；善知識者則是趣向一切智道，令我速入涅槃城故；善知識者則是趣向一切智燈，令我得辨邪正路故；善知識者則是趣向一切智橋，令我得度生死流故；善知識者則是趣向一切智蓋，令我獲得慈悲蔭故；善知識者則是趣向一切智津，令我速達功德岸故；善知識者則是趣向一切智眼，令我得見法性門故；善知識者則是趣向一切智潮，令我應限不失時故。」作是語已，從地而起，遶無量匝，合掌前立，白言：「聖者！我已先發阿耨多羅三藐三菩提心，而未知菩薩云何學菩薩行、云何修菩薩道，我聞聖者善能誘誨，願為我說。」時，彼仙人顧眄仙眾而告之言：「諸仁！當知此童子已發阿耨多羅三藐三菩提心，此童子欲施一切眾生無畏，此童子欲與一切眾生利益，此童子欲惠一切眾生安樂，此童子欲觀一切諸佛智海，此童子欲蔭一切如來法雲，此童子欲遊一切諸佛教海，此童子欲然一切大智明燈，此童子欲起一切大慈悲雲，此童子欲飲一切甘露法水，此童子欲雨一切廣大法雨，此童子欲以智月普照世間，此童子欲滅眾生煩惱毒熱，此童子欲施世間善法清涼，此童子欲長含識一切善根。」時諸仙眾聞是語已，各以種種上妙香華散善財上，布身作禮，遶無量匝，稱揚讚歎，作如是言：「今此童子必能救護一切眾生，必能除滅諸地獄苦，必能永斷諸畜生趣，必能永離閻羅王界，必能關閉諸難處門，必能乾竭諸愛欲海，必能解脫貪欲纏縛，必能永滅眾生苦蘊，必能永破無明黑闇，必以福德大輪圍山周護世間令其安樂，必以智慧大寶須彌顯示世間功德智聚，必以清淨無礙智日開示一切善根法藏，必令眾生開淨智眼明識世間歸於正道。」時，大威猛聲告群仙言：「善男子！若有能發阿耨多羅三藐三菩提心，必能勇猛行菩薩行，必能饒益一切眾生，必與眾生廣大利樂，必能成就一切智道。此善男子已發阿耨多羅三藐三菩提心，當淨一切佛功德地。」說是語已，告善財言：「善男子！我得菩薩無勝幢解脫門。」善財白言：「聖者！此解脫門境界云何？」時彼大仙即伸右手摩善財頂、執善財手；即時善財自見其身，普往十方百千佛剎極微塵數諸世界中，普詣十方百千佛剎極微塵數諸如來所，見彼佛剎及其眾會種種莊嚴，亦見彼佛種種相好光明熾盛，亦聞彼佛隨諸眾生心之所樂而演說法。一文一句皆悉通達，各別領受諸佛法輪，各別記持開發義理，前後次第無有雜亂。亦知彼佛所度眾生，種種樂欲隨其根性，雨諸法雨各得成熟；亦知彼佛於往昔時，以種種解，淨諸願海；亦知彼佛以清淨願，成就諸力；亦見彼佛隨眾生心，所現種種差別色身；亦見彼佛大光明網，種種色相圓滿清淨；亦知彼佛無障礙智，道場眾會清淨莊嚴；又自見身普於一切諸如來所，親近供養受持正法，或於佛所一日一夜，或於佛所七日七夜，或經半月，或經一月、一年、十年、百年、千年，或百千年，或經億年、百億、千億、百千億年，或阿庾多億年，或那由他億年，或經半劫，或經一劫、百劫、千劫，或百千億阿庾多那由他億劫，乃至不可說不可說佛剎極微塵數劫，如是一切咸悉了知無不通達。爾時，善財童子為菩薩無勝幢解脫智光明照故，得毘盧遮那藏三昧光明；為無盡智解脫三昧光明照故，得普攝諸方，現諸方身陀羅尼光明；為金剛輪陀羅尼光明照故，得清淨境界智慧聚三昧光明；為普門際境界莊嚴藏般若波羅蜜光明照故，得佛圓滿虛空藏三昧光明；為一切佛戒、定、慧、法輪三昧光明照故，得三世無盡圓滿智三昧光明。時，彼仙人放善財手，善財童子即自見身還在本處。仙人告言：「善男子！汝憶念耶？」善財言：「唯此是聖者善知識力，令我憶念分明顯現。」仙人告言：「善男子！我唯知此菩薩無勝幢解脫門，如諸菩薩摩訶薩成就一切殊勝三昧，於一切時而得自在；於一念頃出生諸佛無量智慧微妙境界；以佛智慧而為莊嚴，普照世間無有障礙；一念普入三世境界，分形遍往十方剎海，智身普入一切法界，隨眾生心普現其前，放淨光明令其愛樂，觀其根行而為利益，而我云何能知、能說彼功德行、彼殊勝願、彼莊嚴剎、彼智境界、彼三昧所行、彼神通變化、彼解脫遊戲、彼身相差別、彼音聲清淨、彼智慧光明、彼三世境界、彼色身遍往、彼智身普照、彼隨樂普現、彼隨時饒益、彼隨俗軌儀、彼圓音所說、彼清淨妙行、彼光網所照？善男子！於此南方有一聚落，名伊沙那；彼有住處名阿野怛那，有婆羅門名曰勝熱。汝詣彼問菩薩云何學菩薩行，修菩薩道。」時，善財童子歡喜踊躍，生愛敬心，頂禮其足，遶無數匝，慇懃瞻仰，辭退南行。爾時，善財童子為菩薩無勝幢解脫門，光明照其心故，得住諸佛不思議境界種種神通力，證菩薩不思議解脫種種神通智，得菩薩不思議三昧智光明，得一切時恒熏習三昧智光明，得遍了知一切境界皆依想所住三昧智光明，得入一切世間具足殊勝智光明，以得如是智光明故，於一切處皆隨現身，隨一一身以究竟智，皆悉演說究竟平等、無二、無別、無分別法，以明淨智普照境界，凡所聽聞甚深解脫，清淨法藏皆能忍受，信解清淨決定明了，諸法自性無有疑惑，心恒不捨修習一切菩薩妙行，勇猛精進，趣一切智無有退轉；獲得十力差別智光，愛樂深法常無厭足；以正修行住一切智，其心正向，入佛境界，出生菩薩廣大莊嚴，圓滿無邊清淨大願，以無障礙智知無邊世界網，以無懈怠心度無邊眾生海，普遍了達無邊菩薩諸行境界，普見無邊一切世界種種差別，普入無邊廣狹麁妙一切世界，普知無邊一切世界種種想網，普知無邊一切世界諸安立諦，普了無邊一切世界言辭稱讚，普知無邊一切眾生種種信解，普知無邊一切眾生成熟時節，普知無邊一切眾生種種心想，普見無邊一切眾生種種色相，隨其所應方便成熟。念善知識，\n\n\n\n## 参批3（L.291·参9–12·注入 12,751 CJK）\n\n#### 参9·勝熱婆羅門\n\n**参题解**：伊沙那聚落·勝熱婆羅門——赫日四面火聚如山、中有刀山高峻；其教化方式：令求者**登刀山投身火聚**。法门：**菩薩普圓滿無盡輪解脫**（实测）。\n\n**【要点提炼】**\n\n1. **疑魔之问**：善财临刀山自念「此將非魔魔所使耶？將非是魔險惡徒黨詐現菩薩善知識相，與諸菩薩而作怨敵……作壽命難、作梵行難」——**全品唯一一次对善知识起疑**，疑得有理有据（十四难自列）。\n2. **空中证明**：「十千梵天住虛空中作如是言：善男子！莫作是念——今此聖者得金剛焰三昧光明，發大精進勇猛不退，誓入生死度諸眾生」——疑由第三者圣众解，不由自辩。\n3. **投身即行**：疑消而登，菩萨行「悉得清淨」——以身试法的参学。\n\n**【阐释】**（〔本文判断〕）参9是全品的**怀疑样本**：前八参顺流而行，此参横生一疑——而这疑恰是必修课：善知识学的危险面（邪师）被正面演出，其解不在「防止起疑」，而在**证据结构**（圣众空中证明＋已得三昧之行迹）。刀山火聚之苦行表「誓入生死」——火即生死烦恼，投身即入廛垂手；婆罗门的「外道相」与「金剛焰三昧」的内实对照，重演参8「善知识无定相」而更险。\n\n**【对照/启发】**：与〈菩薩住處品〉「善知識三戒」对读——勿见过失在此受火试。启发：起疑不是罪，不起查证而信才是；此参给出核实程序：问圣众、观行迹、验三昧。\n\n**本参经文全引**（T0293·3,442 CJK·0 手抄）：\n\n> 漸次遊行至伊沙那聚落，見勝熱婆羅門，修諸苦行於赫日中，四面火聚猶如大山，中有刀山高峻無極，為欲勤求一切智智，登彼刀山投身入火。時，善財童子既至其所，頂禮其足，合掌而立，白言：「聖者！我已先發阿耨多羅三藐三菩提心，而未知菩薩云何學菩薩行，云何修菩薩道，我聞聖者善能誘誨，願為我說。」婆羅門言：「善男子！汝今若能登此刀山，投身火聚，諸菩薩行悉得清淨。」時，善財童子作如是念：「得人身難，離諸難難，得無難難，離惡法難，得淨法難，遇佛出世難，具足諸根難，得聞正法難，得遇善人難，逢真善知識難，受如理正教難，得正命自活難，得隨法修行難，此將非魔魔所使耶？將非是魔險、惡徒黨詐現菩薩善知識相，與諸菩薩而作怨敵，而欲為我作善根難、作壽命難、作梵行難，障我修行一切智道，牽我令入邪惡趣中，障我所證解脫法門，障我所求無上佛法。」作是念時，十千梵天住虛空中，作如是言：「善男子！莫作是念，莫作是念；今此聖者得金剛焰三昧光明，發大精進勇猛不退，誓入生死度諸眾生，欲竭一切諸貪欲海，欲截一切諸邪見網，欲燒一切諸煩惱薪，欲普運度諸險難磧，欲盡除斷老病死怖，欲盡吹壞無明障山，欲普引導出惑稠林，欲放一切妙法光明普照三世愚癡黑闇。善男子！我諸梵天執著邪見；皆悉自謂是自在者，是能作者，我為一切世間最勝。此婆羅門，五熱炙身；時，其火光明照我宮殿，我即開悟，於自所居及諸禪定心無樂著，皆共來詣婆羅門所；時，婆羅門以神通力即為我等現大苦行，令我滅除一切邪見，為我說法令我斷除一切憍慢，普為一切世間眾生住於大慈行，於大悲起廣大心，發菩提意，住堅固願，欣求解脫，常見諸佛，恒聞妙法；於一切處，心無所著，能轉一切圓滿法輪，其聲無礙普遍一切。」復有十千諸魔天眾住虛空中，以天摩尼寶散婆羅門上，告善財言：「善男子！此婆羅門五熱炙身；時，其火光明映奪我等所有宮殿，及身瓔珞諸莊嚴具，一切光明皆如聚墨，令我於中不生樂著，我與眷屬來詣其所。時，婆羅門為我說法，令我及餘無量天子、諸天女等，於阿耨多羅三藐三菩提得不退轉。」復有十千他化天王於虛空中各散天華，作如是言：「善男子！此婆羅門五熱炙身；時，其火光明映奪於我所有宮殿、瓔珞、嚴具，一切光明皆如聚墨，令我於中不生愛著，即與眷屬來詣其所。時，婆羅門為我說法，令我身心而得自在，於煩惱中而得自在，於受生中而得自在，於壽命中而得自在，於業障中而得自在，於諸三昧而得自在，於莊嚴具而得自在，於菩提心而得自在，乃至能於一切佛法而得自在。」復有十千化樂天王住虛空中作天音樂，以美妙聲恭敬供養，作如是言：「善男子！此婆羅門五熱炙身；時，其火光明照我宮殿、諸莊嚴具，所有光明隱蔽不現，能令我身及諸采女於五欲中不生愛著、不受欲樂、身心柔軟，即與眷屬來詣其所。時，婆羅門為我說法，能令我等心得清淨，心得明潔，心得堪能，心得純善，心極柔軟，心生歡喜，乃至令得具足十力清淨智身，出生無量清淨色身，演出無量清淨言辭，出生無量如來音聲，悟入無量如來之心，具足獲得一切智智。」復有十千兜率天王、天子、天女、無量眷屬於虛空中，起諸香雲，雨眾妙香，恭敬供養，作如是言：「善男子！此婆羅門五熱炙身；時，光照我宮，令我諸天及其眷屬，於自宮殿不生愛著，不貪欲樂，來詣其所。時，婆羅門為我說法，能令我等斷除一切五欲愛著，小欲知足心生歡喜，心得充滿，生諸善根發菩提心，乃至圓滿一切佛法。」復有十千夜摩天王并其眷屬、天子、天女前後圍遶於虛空中，以天曼陀羅華、摩訶曼陀羅華、拘蘇摩華，散婆羅門上，恭敬供養，作如是言：「善男子！此婆羅門五熱炙身；時，光照我宮，能令我等集會之時，於天音樂不生貪著，亦不愛樂己身、眷屬，來詣其所，聞其說法，於諸欲樂，悉生捨離，迴向、趣求一切佛法。」復有十千三十三天帝釋諸王并其眷屬、天子、天女前後圍遶於虛空中，雨天衣服、眾寶瓔珞、天莊嚴具、拘蘇摩華，恭敬供養，作如是言：「善男子！此婆羅門五熱炙身；時，光照我宮，令我天眾於其宮殿，殊勝集會，遊戲園林，天諸音樂，娛樂之處，不生愛樂，即與眷屬來詣其所。時，婆羅門為我等說一切諸法皆悉無常，遷流、變動、敗壞、磨滅，令我斷除憍慢、放逸，令我愛樂無上菩提。善男子！我當見此婆羅門；時，須彌山頂六種震動，我等諸天見是相已，極生恐怖厭離之心，即時發起阿耨多羅三藐三菩提意，咸願趣求一切智智。」◎◎復有十千諸大龍王，所謂：伊羅鉢那龍王、難陀龍王、優婆難陀龍王等，於虛空中布大香雲，普雨無量隨時栴檀微細香雨，無數龍女奏天音樂，雨天妙華及天香水，恭敬供養，作如是言：「善男子！此婆羅門五熱炙身；時，其火光明照我宮殿，令諸龍眾離熱沙怖，金翅鳥怖，除滅瞋恚身得清涼，心無垢濁泰然安隱，復為我等如應說法、聞法、信解、厭惡龍趣、發至誠心悔除一切諸惡業障，乃至發阿耨多羅三藐三菩提心，究竟安住一切智智。」復有十千諸夜叉王於虛空中，各以種種上妙供具，恭敬供養，此婆羅門及以善財，作如是言：「善男子！此婆羅門五熱炙身；時，能令我等及諸眷屬，悉於眾生發慈愍心，一切羅剎、鳩槃茶等，亦生慈心，以慈心故，於諸眾生無所惱害，能施安樂，各與眷屬俱來見我，我及彼等即共來詣婆羅門所。時，婆羅門為我說法，能令我等一切皆得身心安樂，增長威力；又令無量夜叉、羅剎、鳩槃茶等，發於無上菩提之心。」◎大方廣佛華嚴經卷第八大方廣佛華嚴經大方廣佛華嚴經卷第九罽賓國三藏般若奉詔譯入不思議解脫境界普賢行願品◎復有十千乾闥婆王，於虛空中作如是言：「善男子！此婆羅門五熱炙身，時，其火光明照我宮殿及諸眷屬，悉令我等受不思議無量快樂。是故我等來詣其所，此婆羅門為我說法，能令我等於阿耨多羅三藐三菩提，得不退轉。」復有十千阿脩羅王從大海出，住虛空中，舒右膝輪，合掌禮敬，作如是言：「善男子！此婆羅門五熱炙身，時，我阿脩羅所有宮殿、大地、諸山悉皆震動；大海波濤涌浪騰沸，令我眷屬失其威力、捨憍慢心、離諸放逸、息除戰鬪傷害之心。是故來詣婆羅門所，從其聞法，永離諂誑，入深法忍，住於三昧，成就十力，堅固不動。」復有十千迦樓羅王，大力勇持迦樓羅王而為上首，於虛空中，化作廣大童子之形，容貌端嚴，色相具足，於虛空中唱如是言：「善男子！此婆羅門五熱炙身，時，其火光明照我宮殿，一切震動，而令我等皆悉恐怖，不樂住處，生厭離心，來詣其所。時，婆羅門即為我等如應說法，能令我等修習大慈，增長大悲，令其精進不捨善軛，令於五欲拔出眾生，令其發起大菩提心，令入甚深清淨法界，令其獲得明利智慧，方便善巧，調伏眾生。」復有十千緊那羅王，於虛空中唱如是言：「善男子！此婆羅門五熱炙身，時，從火焰中有大風起，吹我宮殿、園林、池沼、寶多羅樹、諸寶鈴網、諸寶繒綵、瓔珞、鬘帶、諸音樂樹、諸妙寶樹，及諸樂器一切資具咸皆震動，自然演出佛聲、法聲、及不退轉菩薩僧聲、發起大願菩薩道聲、住於無上正等覺聲。云：某方、某界、某國、某處，有某菩薩發菩提心，出生大願；某方、某界、某國、某處，有某菩薩修行苦行，於身命財，難捨能捨；某方、某界、某國、某處，有某菩薩，為速圓滿一切智智，積集菩薩功德妙行，乃至究竟無作法門；某方、某界、某國、某處，有某菩薩，往詣道場，坐菩提樹，降魔軍眾，成等正覺。乃至某方、某界、某國、某處，有某如來，轉大法輪；某方、某界、某國、某處，有某如來，作佛事已，而般涅槃。「善男子！假使有人以閻浮提地，及草木一切所有末為微塵，此微塵數可知邊際，我宮殿中寶多羅樹，乃至樂器莊嚴具等，所出音聲演說菩薩名、如來名、法名、僧名，所發大願，所修諸行，及佛菩薩所遊、所住、所說、所化，無有能得知其邊際。「善男子！我等以聞佛聲、法聲、菩薩僧聲、菩薩所住行願聲，故生大歡喜，來詣其所。時，婆羅門即為我等，如應說法，令我及餘無量眾生，於阿耨多羅三藐三菩提，得不退轉。」復有無量欲界天子，現高大身，住虛空中，以諸種種上妙供具，恭敬供養，作如是言：「善男子！此婆羅門五熱炙身時，其火光明下照阿鼻及諸地獄，諸所受苦，悉令休息。我等遇此光明照故，心生淨信，以信心故，罪垢除滅，從彼命終，生於天中，以慚愧故，為知恩故，捨離欲樂，而來其所，恭敬戀仰，無有厭足。時，婆羅門為我說法，能令我等及與無量百千眾生，發阿耨多羅三藐三菩提心。」爾時，善財童子得聞如是種種說法，心大歡喜，踊躍無量，於婆羅門所，發起真實善知識想。頭頂禮足，恭敬合掌，唱如是言：「我於大聖善知識所，生不信心而懷疑惑，唯願聖者容我悔過。」時，婆羅門即為善財而說偈曰：「若有諸菩薩，順善知識教，一切無疑懼，安住心不動。彼當決定得，諸佛自然智，降魔坐道場，廣度無邊眾。」爾時，善財童子聞此偈已，即登刀山，自投火聚，未至中間，即得菩薩善住堅牢清淨三昧；纔觸火焰，復得菩薩寂靜樂神通門三昧。善財白言：「甚奇！聖者！如是刀鋒，及大火焰，我身觸時安隱快樂。」時，婆羅門告善財言：「善男子！我唯得此菩薩普圓滿無盡輪解脫，如諸菩薩摩訶薩大功德焰，悉能燒盡一切眾生諸見煩惱，安住菩薩無退轉心、無窮盡心、無懈怠心、無怯弱心，如那羅延金剛藏心、疾修諸行無慢惰心，大願風輪，普持一切，勇猛堅誓無有退轉。而我云何能知、能說彼功德行？善男子！南方有城名師子頻申，彼城有王名無畏星宿幢王，有童女名為慈行，汝詣彼問菩薩云何學菩薩行，修菩薩道。」時，善財童子頂禮其足，遶無數匝，慇懃瞻仰，辭退而去。爾時，善財童子於善知識所，起不思議最極尊重心；生廣大清淨信解心；常念大乘恒不捨離心；專求佛智常無異念心；觀法境界無有疑惑。一心繫念隨善知識，無障礙智常現在前，決定住於真實智際，善能分別諸法實際，普入三世諸剎那際，隨順解了如虛空際，現見諸法恒無二際，住於法界無分別際，入一切義無障礙際，住一切劫無失壞際，隨順調伏諸業性際，如來最勝不共法際，解了如來無際之際。以最勝智，悉能破壞一切執著、顛倒想網，不取一切同異剎土差別之相，亦復不取一切諸佛眾會道場和合之相；不取佛剎清淨之相，了知眾生皆無有我及眾生相。亦知一切音聲、語言如空谷響，亦知一切差別眾色皆如影像，如是思惟，正念觀察。漸次南行，向師子頻申城，周遍詢\n\n#### 参10·慈行童女\n\n**参题解**：師子頻申城王宮·慈行童女——王女处王宮、五百童女侍从，于毘盧遮那摩尼藏殿（玻瓈地·瑠璃柱·金剛壁·宝网金铃）说法。法门：**般若波羅蜜普莊嚴門**（实测）。\n\n**【要点提炼】**\n\n1. **王宫即讲堂**：无量人众入宫听法，「此王宮門既無限礙」——宫门为法门开；王女说法，身份不设限再添一例。\n2. **宫殿即教具**：宝殿众宝相辉映——所住之殿即所证之门的器化（殿壁镜净，影现诸刹）。\n3. **知根随应**：「知諸眾生業習根器，隨其心行，如應說法；於一切處普隨現身」——说法与现身的双自在。\n\n**【阐释】**（〔本文判断〕）参10把「法门」实体化为**建筑**：智慧以宫殿语汇铺陈（地净如玻璃＝心地，壁金剛＝定，铃音＝说法），听法者行走的每一寸都是教法。童女居王宫而说法无碍——「无限碍」三字双关：宫门无限碍，法义无限碍；在家女众与王权空间皆不妨为法城。此参上承伊舍那（在家女性善知识），下启根自在主（聚沙童子）——身份光谱继续拉开。\n\n**【对照/启发】**：与〈佛不思議法品〉身土庄严对读（殿=身土之微缩）〔本文判断〕。启发：环境即法门的实体教具——自己的房间能否成为「毘盧遮那摩尼藏殿」，看的是住者之心。\n\n**本参经文全引**（T0293·2,337 CJK·0 手抄）：\n\n> 求慈行童女。聞眾人言：「彼是王女，處在王宮，五百童女以為侍從。住毘盧遮那摩尼藏殿，於龍勝栴檀足金線網天衣座上而說妙法。」善財聞已，詣王宮門，一心渴仰求見彼女。于時乃見無量人眾來入宮中，善財問言：「諸人今者欲何所詣？」人咸報言：「我等欲詣慈行童女，聽受妙法。」善財即念：「此王宮門，既無限礙，我亦應入。」遂入王宮，見其寶殿玻瓈為地，瑠璃為柱，金剛為壁，閻浮檀金以為垣牆，眾寶欄楯百千雜寶，光明普照而為窓牖；阿僧祇勝摩尼寶而莊校之，寶藏摩尼鏡圓滿莊嚴；世中最上光藏摩尼寶晝夜光明以為照耀；無數寶網周匝彌覆，窓闥交映，眾寶相輝；百千金鈴懸置其上，微風吹動出微妙音； 以差別智，普入諸法，無障礙慧，猶如虛空。通達一切世間境界，獲無礙地大光明藏，善巧分別一切法義，一切世間無能映奪。常行於世，不染世法，能益於世，非世所壞；為諸眾生究竟依止，善了一切眾生語言，明解眾生種種儀式；知諸眾生業習根器，隨其心行，如應說法；於一切處普隨現身，於一切時恒得自在。而我云何能知、能說彼功德行？善男子！於此南方，有一國土，名為三目。彼有比丘，名曰妙見，汝詣彼問菩薩云何學菩薩行，修菩薩道。」時，善財童子，頂禮其足，遶無數匝，戀慕瞻仰，辭退南行。爾時，善財童子隨順思惟菩薩所住行甚深，思惟菩薩所證法界際甚深，思惟菩薩眾生微細智甚深，思惟菩薩世間想行智甚深，思惟眾生無作性甚深，思惟眾生心流注甚深，思惟諸法緣起際甚深，思惟眾生真實際甚深，思惟眾生如光影甚深，思惟眾生名號差別際甚深，思惟眾生語言際甚深，思惟眾生莊嚴法甚深，思惟眾生祕密際甚深，思惟眾生光明際甚深。漸次前行，至三目國，於彼城邑、市肆、廛里、山川、林藪、仙人住處，周遍尋\n\n#### 参11·妙見比丘\n\n**参题解**：三目國·妙見比丘（八十作善見比丘）——林中经行，三十二相一一具列。法门：**菩薩隨順無盡燈解脫**（实测）。\n\n**【要点提炼】**\n\n1. **相好全幅描写**：头骨如盖、目如青莲、齿白四十、金剛轮相、伊尼鹿腨……——全品唯一一处**三十二相的工笔**；「如來所行之道恒履踐故，不遲不速審諦經行」——相好与经行并观：身是行的遗迹。\n2. **随顺无尽灯**：一灯燃百千灯，灯灯相续而无尽——法门以灯为象：受持如来正法眼，普令众生生智眼。\n3. **愿甲自策**：善财辞行连排「欲被菩薩大誓願甲；欲放菩薩大力光明；欲成菩薩深信解力」——六「欲」自策再起行。\n\n**【阐释】**（〔本文判断〕）参11把「行」写成**身体**：经行不迟不速，是如来所行之道被足底复写——妙见的「見」由眼入身。三十二相在佛教美术中属果德，此品置于**比丘经行**之身，等于说：果相是行相的长成。「无尽灯」与〈維摩經〉无尽灯喻同源（一灯燃千灯，明不及本灯）——法门自陈而无倦，灯喻自谦而无穷。\n\n**【对照/启发】**：与〈十身相海品〉对读——彼处相属佛，此处相属比丘：善知识的身即准佛身。启发：「不遲不速」四字可作日用功夫的节拍器——精进不是赶，是审諦。\n\n**本参经文全引**（T0293·1,656 CJK·0 手抄）：\n\n> 訪妙見比丘。忽然覩見在一林中經行往復，頭骨如蓋，頂有肉髻，殊勝端嚴，其眼脩廣如青蓮葉，鼻脩高直如挺真金，脣色丹潔如頻婆果，齒白齊密具足四十。頰如師子，頤頷充滿，眉高而長，額廣平正，毫相映徹，如白瑠璃，耳相垂埵，如懸珠狀，面如滿月，見者無厭。頸項圓直，約文三道，胸標德相，妙藏莊嚴，臆如師子，肩膊傭圓，腰脇深細，如金剛杵；臂肘傭直，立垂過膝，網縵指相，如白鵝王。手足掌中，金剛輪相，柔軟細滑，如兜羅綿；伊尼鹿腨，七處平滿，手指纖長，足跟平圓。皮膚金色，常光一尋，身毛上靡，一一右旋；其身圓滿，如尼拘陀樹，相好嚴潔，猶如雪山王。諸根澄靜目視不瞬，於諸境界心無動亂；智慧深廣猶如大海，若沈、若舉、是智、非智，動轉戲論，一切咸息。得佛所行平等境界，入於緣起差別法門，成熟眾生心恒不倦。能生深廣圓滿大悲，教化示導心無暫捨。為欲受持一切如來正法眼故，為欲普令一切眾生生智眼故，為於如來所行之道恒履踐故，不遲不速審諦經行。寂靜端嚴，猶如滿月，威儀雍肅，如淨居天。無數天、龍、乾闥婆等釋梵護世，人及非人前後圍遶。主方之神，隨方迴轉，引導其前；足行諸神，持寶蓮華，隨捧其足；無盡光主火神執持寶炬，舒光照耀；閻浮幢主林神恒雨眾妙拘蘇摩華；不動藏主地神隨現寶藏普光明主空神莊嚴虛空；妙吉祥主海神雨摩尼寶；須彌藏主山神合掌作禮；無礙力主風神散眾香華；春和淑氣主夜神曲躬恭敬；常覺圓滿，主晝神持遍照十方摩尼寶幢，住虛空中放大光明。善財童子前詣其所，頭面禮足，合掌白言：「聖者！我已先發阿耨多羅三藐三菩提心，復欲勤求諸菩薩道。我聞聖者，善能誘誨，願為我說菩薩云何學菩薩行，修菩薩道。」妙見答言：「善男子！我年既少出家，又近我此生中，於三十八恒河沙數諸如來所，親近供養淨修梵行；或有佛所一日一夜淨修梵行；或有佛所七日七夜淨修梵行；或有佛所半月、一月；一年、百年、千年、百千年、那由他年，乃至不可說不可說年。或有佛所，經一小劫、或一中劫、或一大劫，乃至不可說不可說阿僧祇劫，親近供養淨修梵行，聽聞妙法，依教奉行，清淨莊嚴諸大誓願，證入諸佛甚深境界，修集菩薩一切妙行，圓滿一切波羅蜜門。亦見彼佛所成正覺、所現神通、所轉法輪、所現涅槃、所有遺教，乃至法盡各各差別，悉能受持無有雜亂。亦知彼佛，以本所發大誓願力，普遍嚴淨諸佛國土；以本所入諸三昧力，圓滿菩薩甚深妙行；以本所修普賢行力，清淨諸佛波羅蜜海。「又，善男子！我常不離此經行處，一念中，一切十方皆悉現前，得淨妙智觀察了知無障礙故；一念中一切世界皆悉現前，得速疾力，一念過不可說不可說世界無障礙故；一念中不可說不可說佛剎，皆悉現前，得普嚴淨成就菩薩願力故；一念中不可說不可說眾生差別行，皆悉現前，得滿足普賢教門海故；一念中不可說不可說佛清淨身，皆悉現前，得普親近成就普賢行願力故；一念中不可說不可說佛剎極微塵數如來，皆悉現前，得柔軟心，供養承事一切如來願力故；一念中不可說不可說如來降注法雨入眾生心，皆悉現前，得了知阿僧祇法門，隨順陀羅尼願力故；一念中不可說不可說菩薩行海，皆悉現前，得淨一切諸菩薩行，猶如帝網殊勝願力故；一念中不可說不可說諸三昧海，皆悉現前，得於一三昧中，自在入出一切三昧願力故；一念中不可說不可說諸根海，皆悉現前，得了知諸根際，於一根中見一切根願力故；一念中不可說不可說時皆悉現前，得於一切時，轉正法輪，眾生界盡，法輪無盡願力故；一念中不可說不可說三世海皆悉現前，得了知一切世界中，三世分位智光明願力故。「善男子！我唯知此菩薩隨順無盡燈解脫門，如諸菩薩摩訶薩，心行堅固，猶如金剛，生如來家種族，真正成就不壞常住命根，常然智燈，無有盡滅。其身堅固，不可沮壞，普能示現如幻色身，形貌端嚴，世無倫匹。隨眾生心，無量差別，如緣起法，轉變無盡，毒刃火災，所不能害。降魔兵眾，摧伏異道，身色妙好，如閻浮金，超過世間最勝無比。放大光網，普照十方，若有見者，必破一切障礙大山，必拔一切不善根本，必種廣大殊勝善根。如是之人，難可得見，難得出現，如優曇華。而我云何能知、能說彼功德行？善男子！於此南方，有一國土，名圓滿多聞，其中有城，名曰妙門，彼有童子，名根自在主。汝詣彼問菩薩云何學菩薩行，修菩薩道。」時，善財童子為欲成滿諸菩薩行；欲修菩薩無盡功德；欲被菩薩大誓願甲；欲放菩薩大力光明；欲成菩薩深信解力；欲起菩薩無量勝行。於菩薩法，心無厭足，樂入一切菩薩功德，願常攝御一切眾生，欲超生死稠林曠野；於善知識，常樂見聞，承事供養，心無厭倦；於無量法，心生尊重，頂禮妙見，遶無數匝，慇懃瞻仰，辭退而去。◎◎爾時，善財童子受妙見比丘教已，憶持不忘，思惟修習，決定明了，於彼法門，隨順悟入。天、龍、夜叉、乾闥婆等眷屬圍遶。漸次前行，向圓滿多聞國入妙門城，周遍推\n\n#### 参12·根自在主童子\n\n**参题解**：圓滿多聞國妙門城·根自在主童子——**在河渚上与诸童子聚沙为戏**（虚空天龙先告善财其所在）。法门：**一切工巧大神通智光明法門**（实测；此童子曾于文殊所修学算数印相）。\n\n**【要点提炼】**\n\n1. **聚沙为戏的善知识**：十千童子围遶、河渚游戏——最不像老师的场景；善财照顶礼不误。\n2. **五明大全**：声论·內明·因明·醫方明·算数契印，药毒蛊毒销解、疗风癎鬼魅、建城邑聚落、驾御战法、调炼仙药幻术、田农商贾、礼仪尊卑、身相吉凶——**工巧明即菩萨行**。\n3. **善知识教九喻**：辞行自策「善知識教猶如春日……如秋滿月……如夏雪山……如芳池日……如日珠輪……如閻浮樹……如大龍王……如妙高山……如天帝釋」——九喻连排，参学心得的抒情高峰。\n\n**【阐释】**（〔本文判断〕）参12把「智」落到**童子游戏**：聚沙是 child's play，而此戏即工巧明之门——五明不是学问的堆叠，是「从文殊处学来的算数印相」长成的利生工具。善知识清单至此添上**孩童**；与前之仙人、王女连观，「善知识无定相」从宣言变成光谱。九喻自策段是善财读书笔记的样本：把受教体验翻成意象库——参学之记，即修行之文。\n\n**【对照/启发】**：与〈根自在主〉所承文殊算数印相对读——**一切法门皆可溯至文殊一问**〔本文判断：本参明文「我昔曾於文殊師利童子所修學」〕。启发：五明清单对治「佛法与世间学问对立」之执——医药、算数、农商、礼乐，皆是度生之器。\n\n**本参经文全引**（T0293·3,684 CJK·0 手抄）：\n\n> 求根自在主童子。時，虛空中天龍神等，告善財言：「善男子！今此童子，在河渚上，與諸童子聚沙為戲。」爾時，善財聞是語已，即詣其所，見彼童子，十千童子前後圍遶，聚沙為戲。見已，親近頂禮其足，遶無數匝，合掌前立，白言：「聖者！我已先發阿耨多羅三藐三菩提心，而未知菩薩云何學菩薩行，修菩薩道；我聞聖者，善能誘誨，唯願慈哀，為我解說。」自在主言：「善男子！我昔曾於文殊師利童子所，修學算、數、印、相等法，即得悟入一切工巧神通智門。善男子！我因此故，知諸世間所有聲論、內明、因明、醫方明等文字，算數、契印、取與種種智論，亦知一切藥毒、蠱毒、和合銷解，亦能療治風癎、痟瘦、鬼魅所著，如是所有一切諸病。亦能建立城邑、聚落，形勝所居市肆、廛里、園林、池沼、義堂、福舍、臺榭、樓觀、宮殿、屋宅、窓牖、門闥種種莊嚴；亦善駕御駟馬車乘，鬪戰之法，安危進止，取捨勝負；亦善調鍊種種仙藥，幻術變化；亦善營理田農商賈，種種諸業；亦善禮儀尊卑次序；亦知眾生身相吉凶，業行善惡；亦知眾生具足一切善、不善根；亦知眾生善趣、惡趣種類差別。亦善了知一切賢聖清淨業道，此人應得聲聞乘道，此人應得辟支佛道，此人應得菩薩乘道，此人應入如來智地，如是乃至真俗二諦，皆悉能知；亦知一切諸寂靜眾，軌儀法式，時非時食，應所不應，以自攝養而延壽命；亦知世俗治生方法，經理資產，出處貴賤；亦知自他過去受身中，有分位入胎、住胎經生差別；亦知未來一切眾生，死此生彼，死彼生此，從彼處歿，還生於彼，從此處歿，還生於此；亦知過現一切諸佛差別法門，種種安布，教授教誡，調伏眾生，能令堅固，隨順修持，越生死流，到涅槃岸，身心清淨，如鍊真金，光明普照，廣大成就。善男子！我復善知十八工巧，種種技術，并六十二眷屬明論，及內明等一切方法，治內煩惱。何等名為內身煩惱？有四因緣：一、謂眼根攝受色境，二、由無始取著習氣，三、由彼識自性本性，四、於色境作意。希望由此四種因緣力故，藏識轉變，識波浪生，譬如瀑流，相續不斷。善男子！如眼識起，一切根識，微塵毛孔俱時出生，亦復如是。譬如明鏡，頓現眾像，諸識亦爾，或時頓現。善男子！譬如猛風，吹大海水，波浪不停，由境界風，飄靜心海，起識波浪，相續不斷，因緣相作，不相捨離，不一不異，如水與波，由業生相，深起繫縛。不能了知，色等自性五識身轉，彼阿賴耶終不自言：我生七識，七識不言從賴耶生，但由自心執取境相，分別而生。如是甚深阿賴耶識行相微細究竟邊際，唯諸如來住地菩薩之所通達，愚法聲聞及辟支佛、凡夫、外道悉不能知。」◎大方廣佛華嚴經卷第九悉見法界一切如來從初發心、修菩薩行、成滿大願、具足功德、成等正覺、轉妙法輪，乃至示現入於涅槃。如是影像靡不皆現，如淨水中普見虛空日月星宿所有眾像，如此皆是慈行童女過去世中善根之力。爾時，善財童子憶念所見諸佛之相，合掌瞻仰慈行童女。大方廣佛華嚴經大方廣佛華嚴經卷第十罽賓國三藏般若奉詔譯◎入不思議解脫境界普賢行願品「善男子！我又善知一切聲論、音聲、語言、內外、因起、名字、訓釋普遍無窮，假使帝釋於梵王所，聽受聲明，盡其天壽，足滿千歲，亦不能知聲論邊際，我一念頃，以此算法，悉能了知，盡其源底。「善男子！彼復教我菩薩算法，所謂：百千為一洛叉；一百洛叉為一俱胝；俱胝俱胝為一阿庾多；阿庾多阿庾多為一那由他；那由他那由他為一頻婆羅；頻婆羅頻婆羅為一矜羯羅；矜羯羅矜羯羅為一阿伽羅；阿伽羅阿伽羅為一微濕伐羅；微濕伐羅微濕伐羅為一鉢囉伐羅；鉢囉伐羅鉢囉伐羅為一鉢囉麼；鉢囉麼鉢囉麼為一婆嚩羅；婆嚩羅婆嚩羅為一阿婆羅；阿婆羅阿婆羅為一多婆羅；多婆羅多婆羅為一獶鉢彌耶；獶鉢彌耶獶鉢彌耶為一阿枲摩；阿枲摩阿枲摩為一普摩；普摩普摩為一禰摩；禰摩禰摩為一阿婆鈐；阿婆鈐阿婆鈐為一微婆伽；微婆伽微婆伽為一微婆奢；微婆奢微婆奢為一沒哩嚩迦；沒哩嚩迦沒哩嚩迦為一那賀羅；那賀羅那賀羅為一毘邏伽；毘邏伽毘邏伽為一彌嚩伽；彌嚩伽彌嚩伽為一毘伽婆；毘伽婆毘伽婆為一僧羯邏摩；僧羯邏摩僧羯邏摩為一毘薩羅；毘薩羅毘薩羅為一毘贍婆；毘贍婆毘贍婆為一慈汦伽；慈汦伽慈汦伽為一毘盛伽；毘盛伽毘盛伽為一毘嚕陀；毘嚕陀毘嚕陀為一微皤訶；微皤訶微皤訶為一微薄帝；微薄帝微薄帝為一毘佉擔；毘佉擔毘佉擔為一都邏那；都邏那都邏那為一阿覩[里*也]；阿覩[里*也]阿覩[里*也]為一嚩邏那；嚩邏那嚩邏那為一微皤蘭；微皤蘭微皤蘭為一三末耶；三末耶三末耶為一微覩羅；微覩羅微覩羅為一奚婆羅；奚婆羅奚婆羅為一陀嚩羅；陀嚩羅陀嚩羅為一微度栗娜；微度栗娜微度栗娜為一奢彌陀；奢彌陀奢彌陀為一儞[口*尸]嚩囉；儞[口*尸]嚩囉儞[口*尸]嚩囉為一微者囉；微者囉微者囉為一微舍囉；微舍囉微舍囉為一微儞薩多；微儞薩多微儞薩多為一阿瓢孽哆；阿瓢孽哆阿瓢孽哆為一微悉步多；微悉步多微悉步多為一泥嚩囉；泥嚩囉泥嚩囉為一波哩殺陀；波哩殺陀波哩殺陀為一微目差；微目差微目差為一鉢哩哆；鉢哩哆鉢哩哆為一喝哩多；喝哩多喝哩多為一阿嚕迦；阿嚕迦阿嚕迦為一印[寧*吉]哩耶；印[寧*吉]哩耶印[寧*吉]哩耶為一系嚕迦；系嚕迦系嚕迦為一奴嚩那；奴嚩那奴嚩那為一何嚕那；何嚕那何嚕那為一婆嚕陀；婆嚕陀婆嚕陀為一謎嚕陀；謎嚕陀謎嚕陀為一乞羼耶；乞羼耶乞羼耶為一阿差目多；阿差目多阿差目多為一翳嚕婆耶；翳嚕婆耶翳嚕婆耶為一微麼嚕耶；微麼嚕耶微麼嚕耶為一曼弩婆耶；曼弩婆耶曼弩婆耶為一微灑馱耶；微灑馱耶微灑馱耶為一三麼陀；三麼陀三麼陀為一鉢囉麼怛囉；鉢囉麼怛囉鉢囉麼怛囉為一阿囉麼怛囉；阿囉麼怛囉阿囉麼怛囉為一勃麼怛囉勃麼；怛囉勃麼怛囉為一阿畔麼怛囉；阿畔麼怛囉阿畔麼怛囉為一伽麼怛囉；伽麼怛囉伽麼怛囉為一那麼怛囉；那麼怛囉那麼怛囉為一奚麼怛囉；奚麼怛囉奚麼怛囉為一鞞麼怛囉；鞞
