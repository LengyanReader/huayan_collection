<script>
var ARTICLE = {"id": "huayan-shihuiuxiang-pin", "file": "articles/huayan-shihuiuxiang-pin.html", "title": "九九华严第二十三品 十回向品之拼读", "title_sub": "第五会首品·兜率天宫·卷二十三～三十三·品文75744（全经最大单一品·跨十一卷）·金刚幢菩萨智光三昧说十回向（救护众生→法界无量）·L.257骨架成文·深化批L.258–L.261预登记", "icon": "🏔", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第五会_兜率天宫_回向位/华严经细读_第二十三部_十回向品.md", "doc_md": "# 华严经细读·第二十三部《十回向品》之拼读\n\n> **EN · Close Reading of the Avataṃsaka Sūtra, Part Twenty-Three: The Chapter of the Ten Dedications**\n\n> **底本**：唐·实叉难陀译《大方广佛华严经》（八十华严）`T10n0279`。**范围：卷第二十三～三十三（品号第二十五·本品全文·跨十一卷）**。本品属**第五会「兜率天宫会」·回向位**，承第四会十行（品 19–22）之「行」，说十回向之「向」——**以行向果·以果向生**。\n\n---\n\n## 〇、凡例（简要）\n\n一、**校勘底本**：八十华严 `T10n0279` 为底本。\n二、**引文可回源**：经文引块程序注入（0 手抄）。\n三、**存疑必标**〔待核〕〔本文判断〕。\n四、**异文各照底本**。\n五、**体量自陈**：本品 75,744 CJK 为**全经最大单一品**（跨十一卷·超第一会六品总和）。核心成文以骨架＋序分＋十回向名目总表为纲；各回向完整经文由深化批逐批补全〔预登记〕。\n\n## 一、概述与品题解义\n\n### 1.1 品题释义\n\n**品名**：**十迴向品第二十五**。说主：**金剛幢菩薩**（异于前会之功德林）。**「迴向」**（*pariṇāmana*）＝以所修之善根**回**转**向**于众生与菩提——不取自证而遍施一切。\n\n### 1.2 品位与脉络\n\n本品为**第五会（兜率天宫）·回向位**。前三会修行序列：**十住（品 15，位）→十行（品 21，行）→十回向（品 23，向）**——住是安立，行是起修，向是**转施**。十回向把十住十行所积之善根，全部回向于：①一切众生（利他）②无上菩提（证果）——二者不二。\n\n### 1.3 篇幅与结构预览\n\n**实测**：品文净 **75744 CJK**（跨十一卷·**341 `<p>`**＋**10 `<lg>`**＋160 页）——**全经最大单一品**。\n\n## 二、卷第二十三～三十三（十迴向品第二十五·本品骨架）\n\n### 2.0 十回向总表\n\n| 回向 | 名 |\n|---|---|\n| 1 | 救護眾生迴向 |\n| 2 | 不壞迴向 |\n| 3 | 等一切諸佛迴向 |\n| 4 | 至一切處迴向 |\n| 5 | 無盡功德藏迴向 |\n| 6 | 入一切平等善根迴向 |\n| 7 | 等隨順一切眾生迴向 |\n| 8 | 真如相迴向 |\n| 9 | 無縛無著解脫迴向 |\n| 10 | 法界無量迴向 |\n\n### 2.1 序分·入定加持（全引·节录首段）\n\n> 十迴向品第二十五之一\n爾時，金剛幢菩薩承佛神力，入菩薩智光三\n昧。入是三昧已，十方各過十萬佛剎微塵數\n世界外，有十萬佛剎微塵數諸佛，皆同一號，\n號：金剛幢，而現其前，咸稱讚言：「善哉！善哉！\n善男子！乃能入此菩薩智光三昧。善男子！\n\n此是十方各十萬佛剎微塵數諸佛神力共\n加於汝，亦是毘盧遮那如來往昔願力、威神\n之力，及由汝智慧清淨故，諸菩薩善根增勝\n故，令汝入是三昧而演說法；為令諸菩薩\n得清淨無畏故，具無礙辯才故，入無礙智地\n故，住一切智大心故，成就無盡善根故，滿足\n無礙白法故，入於普門法界故，現一切佛神\n力故，前際念智不斷故，得一切佛護持諸根\n故，以無量門廣說眾法故，聞悉解了受持\n不忘故，攝諸菩薩一切善根故，成辦出世\n助道故，不斷一切智智故，開發大願故，解\n釋實義故，了知法界故，令諸菩薩皆悉歡喜\n故，修一切佛平等善根故，護持一切如來種\n性故，所謂：演說諸菩薩十迴向。佛子！汝當\n承佛威神之力而演此法，得佛護念故，安住\n佛家故，增益出世功德故，得陀羅尼光明故，\n入無障礙佛法故，大光普照法界故，集無過\n失淨法故，住廣大智境界故，得無障礙法光\n故。」爾時，諸佛即與金剛幢菩薩無量智慧，\n與無留礙辯，與分別句義善方便，與無礙法\n光明，與如來平等身，與無量差別淨音聲，\n與菩薩不思議善觀察三昧，與不可沮壞一\n切善根迴向智，與觀察一切法成就巧方\n便，與一切處說一切法無斷辯。何以故？入此\n三昧善根力故……（序分余文待深化批全引）\n\n**疏解**：金刚幢菩萨入**智光三昧**——十万佛同名加持（与品 21 功德林万佛加持同式），金刚幢起定而说十回向。**金刚幢**＝回向之坚牢不坏相（金刚表不坏·幢表高显）。\n\n### 2.2 十回向总标\n\n> 「佛子！菩薩摩訶薩有十種迴向。何等為十？一者救護一切眾生迴向……十者入法界無量迴向。」\n\n**疏解**：十回向名目总标（三世诸佛已说当说今说）。十回向即十行之**回转向**：每一行皆不取自证而遍施。\n\n### 2.1a 序分全引（金剛幢入定加持·730 CJK）\n\n> 十迴向品第二十五之一\n爾時，金剛幢菩薩承佛神力，入菩薩智光三\n昧。入是三昧已，十方各過十萬佛剎微塵數\n世界外，有十萬佛剎微塵數諸佛，皆同一號，\n號：金剛幢，而現其前，咸稱讚言：「善哉！善哉！\n善男子！乃能入此菩薩智光三昧。善男子！\n\n此是十方各十萬佛剎微塵數諸佛神力共\n加於汝，亦是毘盧遮那如來往昔願力、威神\n之力，及由汝智慧清淨故，諸菩薩善根增勝\n故，令汝入是三昧而演說法；為令諸菩薩\n得清淨無畏故，具無礙辯才故，入無礙智地\n故，住一切智大心故，成就無盡善根故，滿足\n無礙白法故，入於普門法界故，現一切佛神\n力故，前際念智不斷故，得一切佛護持諸根\n故，以無量門廣說眾法故，聞悉解了受持\n不忘故，攝諸菩薩一切善根故，成辦出世\n助道故，不斷一切智智故，開發大願故，解\n釋實義故，了知法界故，令諸菩薩皆悉歡喜\n故，修一切佛平等善根故，護持一切如來種\n性故，所謂：演說諸菩薩十迴向。佛子！汝當\n承佛威神之力而演此法，得佛護念故，安住\n佛家故，增益出世功德故，得陀羅尼光明故，\n入無障礙佛法故，大光普照法界故，集無過\n失淨法故，住廣大智境界故，得無障礙法光\n故。」爾時，諸佛即與金剛幢菩薩無量智慧，\n與無留礙辯，與分別句義善方便，與無礙法\n光明，與如來平等身，與無量差別淨音聲，\n與菩薩不思議善觀察三昧，與不可沮壞一\n切善根迴向智，與觀察一切法成就巧方\n便，與一切處說一切法無斷辯。何以故？入此\n三昧善根力故。爾時，諸佛各以右手摩金\n剛幢菩薩頂。金剛幢菩薩得摩頂已，即從定\n起，告諸菩薩言：「佛子！菩薩摩訶薩有不可思\n議大願充滿法界，普能救護一切眾生，所謂：\n修學去、來、現在一切佛迴向。佛子！菩薩摩訶\n\n薩迴向有幾種？佛子！菩薩摩訶薩迴向有十\n種，三世諸佛咸共演說。何等為十？一者救護\n一切眾生離眾生相迴向，二者不壞迴向，三\n者等一切諸佛迴向，四者至一切處迴向，五\n者無盡功德藏迴向，六者入一切平等善根\n迴向，七者等隨順一切眾生迴向，八者真\n如相迴向，九者無縛無著解脫迴向，十者\n入法界無量迴向。佛子！是為菩薩摩訶薩十\n種迴向，過去、未來、現在諸佛，已說、當說、今\n說。\n「佛子！\n\n### 2.2a 回向①②全引（6367 CJK）\n\n**（一）救护众生回向**（6367 CJK·全文）：\n\n> 云何為菩薩摩訶薩救護一切眾生離\n眾生相迴向？「佛子！此菩薩摩訶薩行檀波\n羅蜜，淨尸波羅蜜，修羼提波羅蜜，起精進\n波羅蜜，入禪波羅蜜，住般若波羅蜜，大慈、\n大悲、大喜、大捨，修如是等無量善根。修善根\n時，作是念言：『願此善根普能饒益一切眾生，\n皆使清淨，至於究竟，永離地獄、餓鬼、畜生、閻\n羅王等無量苦惱。』菩薩摩訶薩種善根時，以\n己善根如是迴向：『我當為一切眾生作舍，令\n免一切諸苦事故；為一切眾生作護，悉令解\n脫諸煩惱故；為一切眾生作歸，皆令得離諸\n怖畏故；為一切眾生作趣，令得至於一切智\n故；為一切眾生作安，令得究竟安隱處故；\n為一切眾生作明，令得智光滅癡暗故；為一\n切眾生作炬，破彼一切無明闇故；為一切眾\n生作燈，令住究竟清淨處故；為一切眾生作\n導師，引其令入真實法故；為一切眾生作\n大導師，與其無礙大智慧故。』佛子！菩薩摩\n訶薩以諸善根如是迴向，平等饒益一切\n\n眾生，究竟皆令得一切智。「佛子！菩薩摩訶\n薩於非親友守護迴向，與其親友等無\n差別。何以故？菩薩摩訶薩入一切法平等\n性故，不於眾生而起一念非親友想。設有眾\n生於菩薩所起怨害心，菩薩亦以慈眼視\n之，終無恚怒。普為眾生作善知識，演說正\n法，令其修習。譬如大海，一切眾毒不能變\n壞。菩薩亦爾，一切愚蒙、無有智慧、不知恩\n德、瞋很頑毒、憍慢自大、其心盲瞽、不識善\n法……如是等類諸惡眾生，種種逼惱，無能動\n亂。譬如日天子出現世間，不以生盲不見故，\n隱而不現；又復不以乾闥婆城、阿脩羅手、閻\n浮提樹、崇巖、邃谷、塵霧、煙雲……如是等物之所\n覆障故，隱而不現；亦復不以時節變改故，隱\n而不現。菩薩摩訶薩亦復如是，有大福德，其\n心深廣，正念觀察，無有退屈；為欲究竟功\n德智慧，於上勝法心生志欲；法光普照，\n見一切義；於諸法門，智慧自在；常為利益一\n切眾生而修善法，曾不誤起捨眾生心；不\n以眾生其性弊惡、邪見、瞋濁、難可調伏，便\n即棄捨，不修迴向；但以菩薩大願甲冑而自\n莊嚴，救護眾生，恒無退轉；不以眾生不知報\n恩，退菩薩行，捨菩提道；不以凡愚共同一\n處，捨離一切如實善根；不以眾生數起過惡，\n難可忍受，而於彼所生疲厭心。何以故？譬如\n日天子，不但為一事故出現世間。菩薩摩訶\n薩亦復如是，不但為一眾生故，修諸善根，迴\n向阿耨多羅三藐三菩提；普為救護一切眾\n生故而修善根，迴向阿耨多羅三藐三菩\n\n提。如是，不但為淨一佛剎故，不但為信一佛\n故，不但為見一佛故，不但為了一法故，起大\n智願，迴向阿耨多羅三藐三菩提；為普淨一\n切佛剎故，普信一切諸佛故，普承事供養\n一切諸佛故，普解一切佛法故，發起大願，\n修諸善根，迴向阿耨多羅三藐三菩提。「佛子！\n菩薩摩訶薩以諸佛法而為所緣，起廣大\n心、不退轉心，無量劫中修集希有難得心寶，\n與一切諸佛悉皆平等。菩薩如是觀諸善\n根，信心清淨，大悲堅固，以甚深心、歡喜心、\n清淨心，最勝心、柔軟心、慈悲心、憐愍心、攝\n護心、利益心、安樂心，普為眾生真實迴向，\n非但口言。佛子！菩薩摩訶薩以諸善根迴向\n之時，作是念言：『以我善根，願一切趣生、一切\n眾生，皆得清淨；功德圓滿，不可沮壞，無有窮\n盡；常得尊重，正念不忘；獲決定慧，具無量\n智；身、口、意業，一切功德，圓滿莊嚴。』又作是\n念：『以此善根，令一切眾生承事供養一切\n諸佛，無空過者；於諸佛所，淨信不壞；聽聞\n正法，斷諸疑惑，憶持不忘，如說修行；於如來\n所，起恭敬心，身業清淨，安住無量廣大善\n根；永離貧窮，七財滿足；於諸佛所，常隨修\n學，成就無量勝妙善根，平等悟解，住一切\n智，以無礙眼等視眾生；眾相嚴身，無有玷\n缺；言音淨妙，功德圓滿，諸根調伏，十力成\n就，善心滿足，無所依住。令一切眾生普得佛\n樂，得無量住，住佛所住。』「佛子！菩薩摩訶薩\n見諸眾生，造作惡業，受諸重苦；以是障故，不\n見佛，不聞法，不識僧。便作是念：『我當於彼諸\n\n惡道中，代諸眾生受種種苦，令其解脫。』菩薩\n如是受苦毒時，轉更精勤，不捨、不避、不驚、不\n怖、不退、不怯，無有疲厭。何以故？如其所願，\n決欲荷負一切眾生，令解脫故。菩薩爾時作\n是念言：『一切眾生在生老病死諸苦難處，隨\n業流轉，邪見無智，喪諸善法，我應救之，令\n得出離。』又諸眾生愛網所纏，癡蓋所覆，染著\n諸有，隨逐不捨，入苦籠檻，作魔業行，福智都\n盡，常懷疑惑，不見安隱處，不知出離道，在於\n生死輪轉不息，諸苦淤泥恒所沒溺。菩薩見\n已，起大悲心、大饒益心，欲令眾生悉得解\n脫，以一切善根迴向，以廣大心迴向，如三\n世菩薩所修迴向，如大迴向經所說迴向，願\n諸眾生普得清淨，究竟成就一切種智。復\n作是念：『我所修行，欲令眾生皆悉得成無上\n智王，不為自身而求解脫，但為救濟一切\n眾生，令其咸得一切智心，度生死流，解脫\n眾苦。』復作是念：『我當普為一切眾生備受眾\n苦，令其得出無量生死眾苦大壑。我當普為\n一切眾生，於一切世界一切惡趣中，盡未\n來劫，受一切苦，然常為眾生勤修善根。何以\n故？我寧獨受如是眾苦，不令眾生墮於地獄。\n我當於彼地獄、畜生、閻羅王等險難之處，\n以身為質，救贖一切惡道眾生，令得解脫。』\n復作是念：『我願保護一切眾生終不棄捨，所\n言誠實，無有虛妄。何以故？我為救度一切眾\n生發菩提心，不為自身求無上道，亦不為求\n五欲境界及三有中種種樂故修菩提行。\n何以故？世間之樂無非是苦。眾魔境界，愚\n\n人所貪，諸佛所訶，一切苦患因之而起；地獄、\n餓鬼及以畜生、閻羅王處，忿恚鬪訟，更相毀\n辱。如是諸惡，皆因貪著五欲所致。耽著五欲，\n遠離諸佛，障礙生天，何況得於阿耨多羅三\n藐三菩提！』菩薩如是觀諸世間貪少欲味受\n無量苦，終不為彼五欲樂故，求無上菩提，修\n菩薩行；但為安樂一切眾生，發心修習，成滿\n大願，斷截眾生諸苦羂索，令得解脫。「佛子！\n菩薩摩訶薩復作是念：『我當以善根如是迴\n向，令一切眾生得究竟樂、利益樂、不受樂、\n寂靜樂、無依樂、無動樂、無量樂、不捨不退\n樂、不滅樂、一切智樂。』復作是念：『我當與一切\n眾生作調御師，作主兵臣，執大智炬，示安隱\n道，令離險難，以善方便𢔌知實義；又於生\n死海，作一切智善巧船師，度諸眾生，使到彼\n岸。』佛子！菩薩摩訶薩以諸善根如是迴向，\n所謂：『隨宜救護一切眾生，令出生死，承事供\n養一切諸佛，得無障礙一切智智，捨離眾\n魔，遠惡知識，親近一切菩薩善友，滅諸過罪，\n成就淨業，具足菩薩廣大行願、無量善根。』「佛\n子！菩薩摩訶薩以諸善根正迴向已，作如\n是念：『不以四天下眾生多故，多日出現；但一\n日出，悉能普照一切眾生。又，諸眾生不以自\n身光明故，知有晝夜，遊行觀察，興造諸業；\n皆由日天子出，成辦斯事，然彼日輪但一\n無二。』菩薩摩訶薩亦復如是，修集善根迴向\n之時，作是念言：『彼諸眾生不能自救，何能救\n他？唯我一人，志獨無侶，修集善根如是迴\n向。所謂：為欲廣度一切眾生故，普照一切眾\n\n生故，示導一切眾生故，開悟一切眾生故，顧\n復一切眾生故，攝受一切眾生故，成就一切\n眾生故，令一切眾生歡喜故，令一切眾生悅\n樂故，令一切眾生斷疑故。』佛子！菩薩摩訶薩\n復作是念：『我應如日，普照一切，不求恩報。眾\n生有惡，悉能容受，終不以此而捨誓願；不以\n一眾生惡故，捨一切眾生。但勤修習善根迴\n向，普令眾生皆得安樂；善根雖少，普攝眾\n生，以歡喜心廣大迴向。若有善根，不欲饒益\n一切眾生，不名迴向；隨一善根，普以眾生而\n為所緣，乃名迴向。安置眾生於無所著法性\n迴向，見眾生自性不動不轉迴向，於迴向無\n所依、無所取迴向，不取善根相迴向，不分別\n業報體性迴向，不著五蘊相迴向，不壞五蘊\n相迴向，不取業迴向，不求報迴向，不染著因\n緣迴向，不分別因緣所起迴向，不著名稱迴\n向，不著處所迴向，不著虛妄法迴向，不著眾\n生相、世界相、心意相迴向，不起心顛倒、想顛\n倒、見顛倒迴向，不著語言道迴向，觀一切法\n真實性迴向，觀一切眾生平等相迴向，以法\n界印印諸善根迴向，觀諸法離貪欲迴向。解\n一切法無，種植善根亦如是；觀諸法無二、無\n生、無滅，迴向亦如是。以如是等善根迴向，修\n行清淨對治之法，所有善根皆悉隨順出世\n間法。不作二相，非即業修習一切智，非離業\n迴向一切智，一切智非即是業，然不離業得\n一切智。以業如光影清淨故，報亦如光影清\n淨；報如光影清淨故，一切智智亦如光影清\n淨。離我、我所一切動亂思惟分別，如是了\n\n知，以諸善根方便迴向。』「菩薩如是迴向之\n時，度脫眾生，常無休息，不住法相；雖知諸\n法無業無報，善能出生一切業報而無違諍，\n如是方便善修迴向。菩薩摩訶薩如是迴向\n時，離一切過，諸佛所讚。佛子！是為菩薩摩訶\n薩第一救護一切眾生離眾生相迴向。」\n爾時，金剛幢菩薩，觀察十方一切眾會暨于\n法界，入深句義，以無量心修習勝行，大悲普\n覆一切眾生，不斷三世諸如來種，入一切佛\n功德法藏，出生一切諸佛法身，善能分別諸\n眾生心，知其所種善根成熟，住於法身而為\n示現清淨色身；承佛神力，即說頌言：\n「不思議劫修行道，精進堅固心無礙，\n為欲饒益群生類，常求諸佛功德法。\n調御世間無等人，修治其意甚明潔，\n發心普救諸含識，彼能善入迴向藏。\n勇猛精進力具足，智慧聰達意清淨，\n普救一切諸群生，其心堪忍不傾動。\n心善安住無與等，意常清淨大歡悅，\n如是為物勤修行，譬如大地普容受。\n不為自身求快樂，但欲救護諸眾生，\n如是發起大悲心，疾得入於無礙地。\n十方一切諸世界，所有眾生皆攝受，\n為救彼故善住心，如是修學諸迴向。\n修行布施大欣悅，護持淨戒無所犯，\n勇猛精進心不動，迴向如來一切智。\n其心廣大無邊際，忍力安住不傾動，\n禪定甚深恒照了，智慧微妙難思議。\n十方一切世界中，具足修治清淨行，\n\n如是功德皆迴向，為欲安樂諸含識。\n大士勤修諸善業，無量無邊不可數，\n如是悉以益眾生，令住難思無上智。\n普為一切眾生故，不思議劫處地獄，\n如是曾無厭退心，勇猛決定常迴向。\n不求色聲香與味，亦不希求諸妙觸，\n但為救度諸群生，常求無上最勝智。\n智慧清淨如虛空，修習無邊大士行，\n如佛所行諸行法，彼人如是常修學。\n大士遊行諸世界，悉能安隱諸群生，\n普使一切皆歡喜，修菩薩行無厭足。\n除滅一切諸心毒，思惟修習最上智，\n不為自己求安樂，但願眾生得離苦。\n此人迴向得究竟，心常清淨離眾毒，\n三世如來所付囑，住於無上大法城。\n未曾染著於諸色，受想行識亦如是，\n其心永出於三有，所有功德盡迴向。\n佛所知見諸眾生，盡皆攝取無有餘，\n誓願皆令得解脫，為彼修行大歡喜。\n其心念念恒安住，智慧廣大無與等，\n離癡正念常寂然，一切諸業皆清淨。\n彼諸菩薩處於世，不著內外一切法，\n如風無礙行於空，大士用心亦復然。\n所有身業皆清淨，一切語言無過失，\n心常歸向於如來，能令諸佛悉歡喜。\n十方無量諸國土，所有佛處皆往詣，\n於中覩見大悲尊，靡不恭敬而瞻奉。\n心常清淨離諸失，普入世間無所畏，\n已住如來無上道，復為三有大法池。\n\n精勤觀察一切法，隨順思惟有非有，\n如是趣於真實理，得入甚深無諍處。\n以此修成堅固道，一切眾生莫能壞，\n善能了達諸法性，普於三世無所著。\n如是迴向到彼岸，普使群生離眾垢，\n永離一切諸所依，得入究竟無依處。\n一切眾生語言道，隨其種類各差別，\n菩薩悉能分別說，而心無著無所礙。\n菩薩如是修迴向，功德方便不可說，\n能令十方世界中，一切諸佛皆稱歎。\n大方廣佛華嚴經卷第二十三\n\n\n\n大方廣佛華嚴經卷第二十四\n\n于闐國三藏實叉難陀奉　制譯\n之二十迴向品第二十五之二\n「佛子！云何為菩薩摩訶薩不壞迴向？「佛子！此\n菩薩摩訶薩於去、來、今諸如來所得不壞\n信，悉能承事一切佛故；於諸菩薩，乃至初發\n一念之心求一切智，得不壞信，誓修一切菩\n薩善根無疲厭故；於一切佛法得不壞信，發\n深志樂故；於一切佛教得不壞信，守護住持\n故；於一切眾生得不壞信，慈眼等觀，善根迴\n向，普利益故；於一切白淨法得不壞信，普集\n無邊諸善根故；於一切菩薩迴向道得不壞\n信，滿足殊勝諸欲解故；於一切菩薩法師\n得不壞信，於諸菩薩起佛想故；於一切佛自\n在神通得不壞信，深信諸佛難思議故；於一\n\n切菩薩善巧方便行得不壞信，攝取種種無\n量無數行境界故。「佛子！菩薩摩訶薩如是安\n住不壞信時，於佛、菩薩、聲聞、獨覺，若諸佛\n教，若諸眾生，如是等種種境界中，種諸善根\n無量無邊，令菩提心轉更增長；慈悲廣大，平\n等觀察，隨順修學諸佛所作，攝取一切清淨\n善根；入真實義，集福德行，行大惠施，修諸\n功德，等觀三世。菩薩摩訶薩以如是等善根\n功德，迴向一切智：『願常見諸佛，親近善友，與\n諸菩薩同共止住；念一切智，心無暫捨；受持\n佛教，勤加守護；教化成熟一切眾生，心常迴\n向出世之道，供養瞻侍一切法師；解了諸\n法，憶持不忘；修行大願，悉使滿足。』菩薩如\n是積集善根，成就善根，增長善根，思惟善\n根，繫念善根，分別善根，愛樂善根，修習善\n根，安住善根。「菩薩摩訶薩如是積集諸善根\n已，以此善根所得依果修菩薩行，於念念中\n見無量佛，如其所應，承事供養。以阿僧祇寶、\n阿僧祇華、阿僧祇鬘、阿僧祇衣、阿僧祇蓋、阿\n僧祇幢、阿僧祇幡、阿僧祇莊嚴具、阿僧祇給\n侍、阿僧祇塗飾地、阿僧祇塗香、阿僧祇末\n香、阿僧祇和香、阿僧祇燒香、阿僧祇深信、阿\n僧祇愛樂、阿僧祇淨心、阿僧祇尊重、阿僧祇\n讚歎、阿僧祇禮敬、阿僧祇寶座，阿僧祇華座、\n阿僧祇香座、阿僧祇鬘座、阿僧祇栴檀座、\n阿僧祇衣座、阿僧祇金剛座、阿僧祇摩尼\n座、阿僧祇寶繒座、阿僧祇寶色座、阿僧祇\n寶經行處、阿僧祇華經行處、阿僧祇香經行\n處、阿僧祇鬘經行處、阿僧祇衣經行處、阿\n\n僧祇寶間錯經行處、阿僧祇一切寶繒綵經\n行處、阿僧祇一切寶多羅樹經行處、阿僧祇\n一切寶欄楯經行處、阿僧祇一切寶鈴網彌\n覆經行處、阿僧祇一切寶宮殿、阿僧祇一切\n華宮殿、阿僧祇一切香宮殿、阿僧祇一切鬘\n宮殿、阿僧祇一切栴檀宮殿、阿僧祇一切堅\n固妙香藏宮殿、阿僧祇一切金剛宮殿、阿僧\n祇一切摩尼宮殿，皆悉殊妙出過諸天；阿\n僧祇諸雜寶樹、阿僧祇種種香樹、阿僧祇諸\n寶衣樹、阿僧祇諸音樂樹、阿僧祇寶莊嚴具\n樹、阿僧祇妙音聲樹、阿僧祇無厭寶樹、阿\n僧祇寶繒綵樹、阿僧祇寶璫樹，阿僧祇一切\n華香、幢幡、鬘蓋所嚴飾樹，如是等樹，扶踈\n蔭映，莊嚴宮殿。其諸宮殿復有阿僧祇軒\n檻莊嚴、阿僧祇窓牖莊嚴、阿僧祇門闥莊嚴，\n阿僧祇樓閣莊嚴、阿僧祇半月莊嚴、阿僧祇\n帳莊嚴，阿僧祇金網彌覆其上，阿僧祇香\n周匝普熏，阿僧祇衣敷布其地。「佛子！菩薩摩\n訶薩以如是等諸供養具，於無量無數不\n可說不可說劫，淨心尊重、恭敬供養一切諸\n佛，恒不退轉，無有休息；一一如來滅度之\n後所有舍利，悉亦如是恭敬供養。為令一切\n眾生生淨信故，一切眾生攝善根故，一切眾\n生離諸苦故，一切眾生廣大解故，一切眾生\n以大莊嚴而莊嚴故，無量莊嚴而莊嚴故，諸\n有所作得究竟故，知諸佛……（回向①②余文待 L.264 全引）\n\n### 2.3a 回向③④⑤全引（4909 CJK）\n\n**（三）等一切佛回向 ＋（四）至一切处回向 ＋（五）无尽功德藏回向**：\n\n> 云何為菩薩摩訶薩等一切佛迴向？「佛\n子！此菩薩摩訶薩隨順修學去、來、現在諸\n佛世尊迴向之道。如是修學迴向道時，見\n一切色乃至觸法若美、若惡，不生愛憎，心得\n自在；無諸過失，廣大清淨；歡喜悅樂，離諸憂\n惱；心意柔軟，諸根清涼。佛子！菩薩摩訶薩\n獲得如是安樂之時，復更發心迴向諸佛，\n作如是念：『願以我今所種善根，令諸佛樂轉\n更增勝，所謂：不可思議佛所住樂、無有等比\n佛三昧樂、不可限量大慈悲樂、一切諸佛解\n脫之樂、無有邊際大神通樂、最極尊重大\n自在樂、廣大究竟無量力樂、離諸知覺寂靜\n之樂、住無礙住恒正定樂、行無二行不變異\n樂。』「佛子！菩薩摩訶薩以諸善根迴向佛已，\n復以此善根迴向菩薩，所謂：『願未滿者令得\n圓滿，心未淨者令得清淨，諸波羅蜜未滿足\n者令得滿足。安住金剛菩提之心，於一切智\n得不退轉，不捨大精進，守護菩提門一切\n善根；能令眾生捨離我慢，發菩提心，所願成\n滿；安住一切菩薩所住，獲得菩薩明利諸根，\n修習善根，證薩婆若。』「佛子！菩薩摩訶薩以諸\n\n善根如是迴向菩薩已，復以迴向一切眾生：\n『願一切眾生所有善根，乃至極少一彈指頃，\n見佛聞法，恭敬聖僧。彼諸善根皆離障礙，念\n佛圓滿，念法方便，念僧尊重，不離見佛，心得\n清淨，獲諸佛法，集無量德，淨諸神通，捨法疑\n念，依教而住。』如為眾生如是迴向，為聲聞、辟\n支佛迴向亦復如是。『又願一切眾生永離地\n獄、餓鬼、畜生、閻羅王等一切惡處，增長無上\n菩提之心，專意勤求一切種智，永不毀謗諸\n佛正法，得佛安樂，身心清淨，證一切智。』「佛\n子！菩薩摩訶薩所有善根，皆以大願，發起、正\n發起，積集、正積集，增長、正增長，悉令廣大具\n足充滿。「佛子！菩薩摩訶薩在家宅中與妻子\n俱，未曾暫捨菩提之心，正念思惟薩婆若境，\n自度度彼，令得究竟；以善方便化己眷屬，\n令入菩薩智，令成熟解脫；雖與同止，心無\n所著，以本大悲處於居家，以慈心故隨順\n妻子，於菩薩清淨道無所障礙。菩薩摩訶\n薩雖在居家作諸事業，未曾暫捨一切智心。\n所謂：若著衣裳、若噉滋味、若服湯藥、澡漱\n塗摩、迴旋顧視、行住坐臥、身語意業、若睡若\n寤。如是一切諸有所作，心常迴向薩婆若道，\n繫念思惟，無時捨離。為欲饒益一切眾生，\n安住菩提無量大願，攝取無數廣大善根；勤\n修諸善，普救一切，永離一切憍慢放逸，決\n定趣於一切智地，終不發意向於餘道；常\n觀一切諸佛菩提，永捨一切諸雜染法，修行\n一切菩薩所學，於一切智道無所障礙；住\n於智地愛樂誦習，以無量智集諸善根，心\n\n不戀樂一切世間，亦不染著所行之行，專心\n受持諸佛教法。菩薩如是處在居家，普攝\n善根，令其增長，迴向諸佛無上菩提。「佛子！\n菩薩爾時，乃至施與畜生之食一摶、一粒，\n咸作是願：『當令此等捨畜生道，利益安樂，究\n竟解脫，永度苦海，永滅苦受，永除苦蘊，永斷\n苦覺、苦聚、苦行、苦因、苦本及諸苦處；願彼眾\n生皆得捨離。』菩薩如是專心繫念一切眾生，\n以彼善根而為上首，為其迴向一切種智。菩\n薩初發菩提之心普攝眾生，修諸善根悉以\n迴向，欲令永離生死曠野，得諸如來無礙快\n樂，出煩惱海，修佛法道；慈心遍滿，悲力廣\n大，普使一切得清淨樂；守護善根，親近佛法；\n出魔境界，入佛境界；斷世間種，植如來種，住\n於三世平等法中。菩薩摩訶薩如是所有已\n集、當集、現集善根，悉以迴向。復作是念：『如過\n去諸佛菩薩所行，恭敬供養一切諸佛，度諸\n眾生令永出離，勤加修習一切善根，悉以迴\n向而無所著。所謂：不依色，不著受，無倒想，\n不作行，不取識，捨離六處；不住世法，樂出世\n間；知一切法皆如虛空，無所從來，不生不\n滅，無有真實，無所染著；遠離一切諸分別見，\n不動不轉，不失不壞；住於實際，無相離相，唯\n是一相；如是深入一切法性，常樂習行普\n門善根，悉見一切諸佛眾會。如彼過去一\n切如來善根迴向，我亦如是而為迴向；解如\n是法，證如是法，依如是法，發心修習，不違法\n相；知所修行，如幻如影，如水中月，如鏡中\n像，因緣和合之所顯現，乃至如來究竟之\n\n地。』「佛子！菩薩摩訶薩復作是念：『如過去諸\n佛修菩薩行時，以諸善根如是迴向；未來、\n現在，悉亦如是。我今亦應如彼諸佛，如是發\n心，以諸善根而為迴向：第一迴向、勝迴向、\n最勝迴向、上迴向、無上迴向、無等迴向、無等\n等迴向、無比迴向、無對迴向、尊迴向、妙迴\n向、平等迴向、正直迴向、大功德迴向、廣大迴\n向、善迴向、清淨迴向、離惡迴向、不隨惡迴\n向。』菩薩如是以諸善根正迴向已，成就清淨\n身、語、意業，住菩薩住，無諸過失；修習善業，離\n身、語惡，心無瑕穢；修一切智，住廣大心，知一\n切法無有所作；住出世法，世法不染；分別了\n知無量諸業，成就迴向善巧方便，永拔一切\n取著根本。「佛子！是為菩薩摩訶薩第三等一\n切佛迴向。菩薩摩訶薩住此迴向，深入一切\n諸如來業，趣向如來勝妙功德；入深清淨智\n慧境界，不離一切諸菩薩業，善能分別巧妙\n方便；入深法界，善知菩薩修行次第；入佛種\n性，以巧方便分別了知無量無邊一切諸法；\n雖復現身於世中生，而於世法心無所著。」爾\n時，金剛幢菩薩承佛神力，普觀十方，即說頌\n言：\n「彼諸菩薩摩訶薩，修過去佛迴向法，\n亦學未來現在世，一切導師之所行。\n於諸境界得安樂，諸佛如來所稱讚，\n廣大光明清淨眼，悉以迴向大聰哲。\n菩薩身根種種樂，眼耳鼻舌亦復然，\n如是無量上妙樂，悉以迴向諸最勝。\n一切世間眾善法，及諸如來所成就，\n\n於彼悉攝無有餘，盡以隨喜益眾生。\n世間隨喜無量種，今此迴向為眾生，\n人中師子所有樂，願使群萌悉圓滿。\n一切國土諸如來，凡所知見種種樂，\n願令眾生皆悉得，而為照世大明燈。\n菩薩所得勝妙樂，悉以迴向諸群生，\n雖為群生故迴向，而於迴向無所著。\n菩薩修行此迴向，興起無量大悲心，\n如佛所修迴向德，願我修行悉成滿。\n如諸最勝所成就，一切智乘微妙樂，\n及我在世之所行，諸菩薩行無量樂，\n示入眾趣安隱樂，恒守諸根寂靜樂，\n悉以迴向諸群生，普使修成無上智。\n非身語意即是業，亦不離此而別有，\n但以方便滅癡冥，如是修成無上智。\n菩薩所修諸行業，積集無量勝功德，\n隨順如來生佛家，寂然不亂正迴向。\n十方一切諸世界，所有眾生咸攝受，\n悉以善根迴向彼，願令具足安隱樂。\n不為自身求利益，欲令一切悉安樂，\n未曾暫起戲論心，但觀諸法空無我。\n十方無量諸最勝，所見一切真佛子，\n悉以善根迴向彼，願使速成無上覺。\n一切世間含識類，等心攝取無有餘，\n以我所行諸善業，令彼眾生速成佛。\n無量無邊諸大願，無上導師所演說，\n願諸佛子皆清淨，隨其心樂悉成滿。\n普觀十方諸世界，悉以功德施於彼，\n願令皆具妙莊嚴，菩薩如是學迴向。\n\n心不稱量諸二法，但恒了達法無二，\n諸法若二若不二，於中畢竟無所著。\n十方一切諸世間，悉是眾生想分別，\n於想非想無所得，如是了達於諸想。\n彼諸菩薩身淨已，則意清淨無瑕穢，\n語業已淨無諸過，當知意淨無所著。\n一心正念過去佛，亦憶未來諸導師，\n及以現在天人尊，悉學於其所說法。\n三世一切諸如來，智慧明達心無礙，\n為欲利益眾生故，迴向菩提集眾業。\n彼第一慧廣大慧，不虛妄慧無倒慧，\n平等實慧清淨慧，最勝慧者如是說。\n「佛子！云何為菩薩摩訶薩至一切處迴向？「佛\n子！此菩薩摩訶薩修習一切諸善根時，作\n是念言：『願此善根功德之力至一切處。譬如\n實際，無處不至，至一切物，至一切世間，至\n一切眾生，至一切國土，至一切法，至一切虛\n空，至一切三世，至一切有為、無為，至一切語\n言、音聲。願此善根亦復如是，遍至一切諸如\n來所，供養三世一切諸佛；過去諸佛所願悉\n滿，未來諸佛具足莊嚴，現在諸佛及其國\n土、道場，眾會遍滿一切虛空法界。願以信解\n大威力故，廣大智慧無障礙故，一切善根悉\n迴向故，以如諸天諸供養具而為供養，充滿\n無量無邊世界。』佛子！菩薩摩訶薩復作是念：\n『諸佛世尊普遍一切虛空法界。種種業所起，\n十方不可說一切世界種世界、不可說佛國\n土佛境界種種世界、無量世界、無分齊世\n界、轉世界、側世界、仰世界、覆世界，如是一切\n\n諸世界中，現住於壽，示現種種神通變化。彼\n有菩薩以勝解力，為諸眾生堪受化者，於彼\n一切諸世界中，現為如來出興於世，以至一\n切處智；普遍開示如來無量自在神力，法身\n遍往無有差別，平等普入一切法界；如來藏\n身不生不滅，善巧方便普現世間，證法實\n性超一切故，得不退轉無礙力故，生於如\n來無障礙見、廣大威德種性中故。』「佛子！菩\n薩摩訶薩以其所種一切善根願，於如是諸\n如來所，以眾妙華，及眾妙香、鬘蓋、幢幡、衣服、\n燈燭，及餘一切諸莊嚴具以為供養；若佛形\n像，若佛塔廟，悉亦如是。以此善根如是迴\n向，所謂：不亂迴向、一心迴向、自意迴向、尊\n敬迴向、不動迴向、無住迴向、無依迴向、無眾\n生心迴向、無躁競心迴向、寂靜心迴向。復\n作是念：『盡法界、虛空界，去、來、現在一切劫中，\n諸佛世尊得一切智、成菩提道，無量名字各\n各差別，於種種時現成正覺，悉皆住壽盡未\n來際，一一各以法界莊嚴而嚴其身，道場\n眾會周遍法界，一切國土隨時出興而作佛\n事。如是一切諸佛如來，我以善根普皆迴向，\n願以無數香蓋、無數香幢、無數香幡、無數香\n帳、無數香網、無數香像、無數香光、無數香\n焰、無數香雲、無數香座、無數香經行地、無數\n香所住處、無數香世界、無數香山、無數香\n海、無數香河、無數香樹、無數香衣服、無數\n香蓮華、無數香宮殿，無量華蓋，廣說乃至無\n量華宮殿；無邊鬘蓋，廣說乃至無邊鬘宮殿；\n無等塗香蓋，廣說乃至無等塗香宮殿；不\n\n可數末香蓋，廣說乃至不可數末香宮殿；不\n可稱衣蓋，廣說乃至不可稱衣宮殿；不可思\n寶蓋，廣說乃至不可思寶宮殿；不可量燈光\n明蓋，廣說乃至不可量燈光明宮殿；不可說\n莊嚴具蓋，廣說乃至不可說莊嚴具宮殿；\n不可說不可說摩尼寶蓋、不可說不可說摩\n尼寶幢，如是摩尼寶幡、摩尼寶帳、摩尼\n寶網、摩尼寶像、摩尼寶光、摩尼寶焰、摩尼寶\n雲、摩尼寶座、摩尼寶經行地、摩尼寶所住處、\n摩尼寶剎、摩尼寶山、摩尼寶海、摩尼寶河、摩\n尼寶樹、摩尼寶衣服、摩尼寶蓮華、摩尼寶宮\n殿，皆不可說不可說。如是一一諸境界中，\n各有無數欄楯、無數宮殿、無數樓閣、無數門\n闥、無數半月、無數却敵、無數窓牖、無數清淨\n寶、無數莊嚴具，以如是等諸供養物，恭敬供\n養如上所說諸佛世尊。願令一切世間皆\n得清淨，一切眾生咸得出離，住十力地，於一\n切法中得無礙法明。令一切眾生具足善根，\n悉得調伏，其心無量，等虛空界，往一切剎而\n無所至，入一切土施諸善法，常得見佛，植諸\n善根，成就大乘，不著諸法，具足眾善，立無量\n行，普入無邊一切法界，成就諸佛神通之力，\n得於如來一切智智。譬如無我，普攝諸法。我\n諸善根亦復如是，普攝一切諸佛如來，咸悉\n供養無有餘故；普攝一切無量諸法，悉能悟\n入無障礙故；普攝一切諸菩薩眾，究竟皆與\n同善根故；普攝一切諸菩薩行，以本願力皆\n圓滿故；普攝一切菩薩法明，了達諸法皆\n無礙故；普攝諸佛大神通力，成就無量諸\n\n善根故；普攝諸佛力、無所畏，發無量心滿一\n切故；普攝菩薩三昧辯才陀羅尼門，善能照\n了無二法故；普攝諸佛善巧方便，示現如\n來大神力故；普攝三世一切諸佛降生成\n道、轉正法輪、調伏眾生、入般涅槃，恭敬供\n養悉周遍故；普攝十方一切世界，嚴淨佛\n剎咸究竟故；普攝一切諸廣大劫，於中出\n現修菩薩行無斷絕故；普攝一切所有趣\n生，悉於其中現受生故；普攝一切諸眾生\n界，具足普賢菩薩行故；普攝一切諸惑習氣，\n悉以方便令清淨故；普攝一切眾生諸根，無\n量差別咸了知故；普攝一切眾生解欲，令離\n雜染得清淨故；普攝一切化眾生行，隨其所\n應為現身故；普攝一切應眾生道，悉入一\n切眾生界故；普攝一切如來智性，護持一\n切諸佛教故。』「佛子！菩薩摩訶薩以諸善根\n如是迴向時，用無所得而為方便，不於業中\n分別報，不於報中分別業；雖無分別而普\n入法界，雖無所作而恒住善根，雖無所起而\n勤修勝法；不信諸法而能深入，不有於法而\n悉知見，若作、不作皆不可得；知諸法性恒不\n自在，雖悉見諸法而無所見，普知一切而無\n所知。菩薩如是了達境界，知一切法因緣為\n本，見於一切諸佛法身，至一切法離染實\n際，解了世間皆如變化，明達眾生唯是一\n法、無有二性，不捨業境善巧方便；於有為\n界示無為法，而不滅壞有為之相；於無為界\n示有為法，而不分別無為之相。菩薩如是\n觀一切法畢竟寂滅，成就一切清淨善根，\n\n而起救護眾生之心，智慧明達一切法海，\n常樂修行離愚癡法，已具成就出世功德，不\n更修學世間之法，得淨智眼離諸癡翳，以善\n方便修迴向道。「佛子！菩薩摩訶薩以諸善\n根如是迴向，稱可一切諸佛之心，嚴淨一切\n諸佛國土，教化成熟一切眾生，具足受持\n一切佛法；作一切眾生最上福田，為一切商\n人智慧導師，作一切世間清淨日輪；一一善\n根充遍法界，悉能救護一切眾生，皆令清淨\n具足功德「佛子！菩薩摩訶薩如是迴向時，能\n護持一切佛種，能成熟一切眾生，能嚴淨一\n切國土，能不壞一切諸業，能了知一切諸法，\n能等觀諸法無二，能遍往十方世界，能了達\n離欲實際，能成就清淨信解，能具足明利諸\n根。「佛子！是為菩薩摩訶薩第四至一切處迴\n向。菩薩摩訶薩住此迴向時，得至一切處身\n業，普能應現一切世界故；得至一切處語業，\n於一切世界中演說法故；得至一切處意業，\n受持一切佛所說法故；得至一切處神足通，\n隨眾生心悉往應故；得至一切處隨證智，普\n能了達一切法故；得至一切處總持辯才，\n隨眾生心令歡喜故；得至一切處入法界，於\n一毛孔中普入一切世界故；得至一切處遍\n入身，於一眾生身普入一切眾生身故；得至\n一切處普見劫，一一劫中常見一切諸如來\n故；得至一切處普見念，一一念中一切諸佛\n悉現前故。佛子！菩薩摩訶薩得至一切處迴\n向，能以善根如是迴向。」爾時，金剛幢菩薩承\n佛威力，普觀十方而說頌言：\n\n「內外一切諸世間，菩薩悉皆無所著，\n不捨饒益眾生業，大士修行如是智。\n十方所有諸國土，一切無依無所住，\n不取活命等眾法，亦不妄起諸分別。\n普攝十方世界中，一切眾生無有餘，\n觀其體性無所有，至一切處善迴向。\n普攝有為無為法，不於其中起妄念，\n如於世間法亦然，照世燈明如是覺。\n菩薩所修諸業行，上中下品各差別，\n悉以善根迴向彼，十方一切諸如來。\n菩薩迴向到彼岸，隨如來學悉成就，\n恒以妙智善思惟，具足人中最勝法。\n清淨善根普迴向，利益群迷恒不捨，\n悉令一切諸眾生，得成無上照世燈。\n未曾分別取眾生，亦不妄想念諸法，\n雖於世間無染著，亦復不捨諸含識。\n菩薩常樂寂滅法，隨順得至涅槃境，\n亦不捨離眾生道，獲如是等微妙智。\n菩薩未曾分別業，亦不取著諸果報，\n一切世間從緣生，不離因緣見諸法。\n深入如是諸境界，不於其中起分別，\n一切眾生調御師，於此明了善迴向。\n大方廣佛華嚴經卷第二十四\n\n\n\n大方廣佛華嚴經卷第二十五\n\n于闐國三……（回向③④⑤余文待 L.264b 全引）\n\n### 2.3–2.12 十回向各说（骨架·深化批逐批补全经文）\n\n**（一）救护众生回向**：以所修善根回向救护一切众生——代众生受苦·以身為質救赎恶道。\n\n**（二）不坏回向**：于佛法僧得不坏信，回向令众生住不坏道。\n\n**（三）等一切诸佛回向**：随顺修学三世诸佛回向之道。\n\n**（四）至一切处回向**：以诸善根令一切处佛刹悉皆庄严。\n\n**（五）无尽功德藏回向**：入无尽功德藏，庄严一切刹。\n\n**（六）入一切平等善根回向**：随顺一切坚固善根，回向平等。\n\n**（七）等心随顺一切众生回向**：等心随顺一切众生，不舍一切。\n\n**（八）如相回向**：以真如相回向，与法性相应。\n\n**（九）无缚无著解脱回向**：无缚无著解脱回向，于一切法得自在。\n\n**（十）法界无量回向**：入法界无量回向，遍法界虚空界。\n\n## 三、旁参与前接\n\n### 3.1 承前（第四会）\n\n第四会十行（品 21）→十藏（品 22）→**本品十回向（品 23）**：行→藏→向三叠——行是起修，藏是含摄，向是**转施**。\n\n### 3.2 启后（第六会·十地）\n\n本品回向位毕→次品〈十地品〉（第六会·他化自在天·证位）——**回向位是十地之门槛**：回向满故入地。\n\n## 四、义理要点\n\n- **回向之三义**：回（转）·向（趋）·施（遍）——不取自证、遍施众生、同归菩提。\n- **金刚幢**：回向之菩萨——金刚表不坏，幢表高显。\n- **全经最大品之意义**：回向位之广说超过十住十行之总和——**转施之广即菩萨心量之广**。\n\n## 五、注疏选要\n\n### 5.1 澄观（`T1735`·疏卷二十六起）\n\n> 十迴向品第二十五初來意者。當會序分已彰。正宗宜顯故。又已總示所依佛智。次別顯能依行位。故次來也。二釋名者。迴者轉也向者趣也。轉自萬行趣向三處。故名迴向。迴向不同有其十種。然十之別名本分當釋。迴向通稱今當重明隨境所向義有眾多。以義通收不出三處。謂眾生菩提及以實際。上二皆隨相。實際即離相。開三為十。一迴自向他故。初迴向云。若有善根。不欲饒益一切眾生。不名迴向。二迴少向多故。下文云。善根雖少普攝眾生。以歡喜心廣大迴向。又云。隨一善根普以眾生而為所緣。乃名迴向。三迴自因行向他因行故。第三迴向云。菩薩以諸善根迴向佛已。復即以此善根。迴向一切菩薩。所謂願未滿者。令得願滿。心未淨者令得清淨。四迴因向果。此復二種。一向自果。下文云。修諸善根迴向阿耨菩提故。深密瑜伽梁攝論等。大同此說。二迴向他果。第三迴向云。願以我今所種善根。令諸佛樂轉更增勝故。五迴劣向勝。謂隨喜凡夫二乘之福。迴向無上菩提故。六迴比向證經文非一。七迴事向理故不壞迴向。云與諸法性相應。迴向入無作法。成所作迴向。第六迴向云。永離依處到於彼岸。故名迴向。永絕所作至於彼岸。故名迴向。八迴差別行向圓融行故。如第九迴向廣說。九迴世向出世故。下文云。\n\n### 5.2–5.3 诸家（存目·深化批补引）\n\n## 2.5 回向⑥–⑩＋尾段（全引·60272 CJK·L.265 注入）\n\n### 回向⑥ 隨順堅固一切善根迴向\n\n隨順堅固一切善\n根迴向？「佛子！此菩薩摩訶薩或為帝王臨御\n大國，威德廣被，名震天下，凡諸怨敵靡不歸\n順，發號施令悉依正法，執持一蓋溥蔭萬\n方，周行率土所向無礙，以離垢繒而繫其\n頂，於法自在，見者咸伏，不刑不罰，感德從\n化；以四攝法攝諸眾生，為轉輪王，一切周\n給。菩薩摩訶薩安住如是自在功德，有大眷\n屬，不可沮壞，離眾過失，見者無厭，福德莊\n\n嚴，相好圓滿，形體肢分均調具足；獲那羅\n延堅固之身，大力成就，無能屈伏；得清淨\n業，離諸業障；具足修行一切布施，或施飲食\n及諸上味，或施車乘，或施衣服，或施華鬘、雜\n香、塗香、床座、房舍及所住處、上妙燈燭、病緣\n湯藥、寶器、寶車、調良象馬，悉皆嚴飾，歡喜布\n施。或有來乞王所處座，若蓋、若傘，幢幡寶物、\n諸莊嚴具，頂上寶冠、髻中明珠，乃至王位，皆\n無所吝。若見眾生在牢獄中，捨諸財寶、妻子、\n眷屬，乃至以身救彼令脫。若見獄囚將欲被\n戮，即捨其身以代彼命。或見來乞連膚頂髮，\n歡喜施與亦無所吝。眼、耳、鼻、舌，及以牙齒、頭\n頂、手足、血肉、骨髓、心腎、肝肺、大腸、小腸、厚皮、\n薄皮、手足諸指、連肉爪甲，以歡喜心盡皆施\n與。或為求請未曾有法，投身而下深大火坑；\n或為護持如來正法，以身忍受一切苦毒；或\n為求法乃至一字，悉能遍捨四海之內一切\n所有。恒以正法化導群生，令修善行、捨離\n諸惡。若見眾生損敗他形，慈心救之，令捨罪\n業。若見如來成最正覺，稱揚讚歎，普使聞\n知。或施於地，造立僧坊、房舍、殿堂，以為住\n處；及施僮僕，供承作役。或以自身施來乞\n者，或施於佛。為求法故，歡喜踊躍；為眾生\n故，承事供養。或捨王位、城邑、聚落、宮殿、園\n林、妻子、眷屬，隨所乞求，悉滿其願。或捨一\n切資生之物，普設無遮大施之會；其中眾生\n種種福田，或從遠來，或從近來，或賢或愚，或\n好或醜，若男若女、人與非人，心行不同，所求\n各異，等皆施與，悉令滿足。佛子！菩薩摩訶\n\n薩如是施時，發善攝心，悉以迴向。所謂：善\n攝色，隨順堅固一切善根；善攝受、想、行、識，隨\n順堅固一切善根；善攝王位，隨順堅固一切\n善根；善攝眷屬，隨順堅固一切善根；善攝資\n具，隨順堅固一切善根；善攝惠施，隨順堅\n固一切善根。「佛子！菩薩摩訶薩隨所施物\n無量無邊，以彼善根如是迴向，所謂：『以上妙\n食施眾生時，其心清淨，於所施物無貪、無\n著、無所顧吝，具足行施；願一切眾生得智\n慧食，心無障礙，了知食性，無所貪著，但樂法\n喜出離之食；智慧充滿，以法堅住，攝取善\n根，法身、智身清淨遊行；哀愍眾生，為作福\n田，現受摶食。』是為菩薩摩訶薩布施食時善\n根迴向。「佛子！菩薩摩訶薩若施飲時，以此\n善根如是迴向，所謂：『願一切眾生飲法味\n水，精勤修習，具菩薩道；斷世渴愛，常求佛\n智；離欲境界，得法喜樂；從清淨法而生其\n身，常以三昧調攝其心；入智慧海，興大法\n雲，霔大法雨。』是為菩薩摩訶薩布施飲時善\n根迴向。「佛子！菩薩摩訶薩布施種種清淨上\n味。所謂：辛、酸、鹹、淡，及以甘、苦。種種諸味潤\n澤具足，能令四大安隱調和，肌體盈滿，氣力\n強壯，其心清淨常得歡喜；嚥咀之時，不欬\n不逆；諸根明利，內藏充實；毒不能侵，病不能\n傷；始終無患，永得安樂。以此善根如是迴\n向，所謂：『願一切眾生得最上味，甘露充滿；\n願一切眾生得法智味，了知一切諸味業用；\n願一切眾生得無量法味，了達法界，安住實\n際大法城中；願一切眾生作大法雲，周遍\n\n法界普雨法雨，教化調伏一切眾生；願一切\n眾生得勝智味，無上法喜充滿身心；願一切\n眾生得無貪著一切上味，不染世間一切諸\n味，常勤修習一切佛法；願一切眾生得一法\n味，了諸佛法悉無差別；願一切眾生得最勝\n味，乘一切智終無退轉；願一切眾生得入諸\n佛無異法味，悉能分別一切諸根；願一切眾\n生法味增益，常得滿足無礙佛法。』是為菩薩\n摩訶薩布施味時善根迴向；為令一切眾生\n勤修福德，皆悉具足無礙智身故。「佛子！菩\n薩摩訶薩施車乘時，以諸善根如是迴向，所\n謂：『願一切眾生皆得具足一切智乘，乘於\n大乘、不可壞乘、最勝乘、最上乘、速疾乘、大\n力乘、福德具足乘、出世間乘、出生無量諸菩\n薩乘。』是為菩薩摩訶薩施車乘時善根迴向。\n「佛子！菩薩摩訶薩布施衣時，以諸善根如是\n迴向，所謂：『願一切眾生得慚愧衣以覆其身，\n捨離邪道露形惡法，顏色潤澤，皮膚細軟，成\n就諸佛第一之樂，得最清淨一切種智。』是為\n菩薩摩訶薩布施衣時善根迴向。「佛子！菩薩\n摩訶薩常以種種名華布施，所謂：微妙香華、\n種種色華、無量奇妙華、善見華、可喜樂華、一\n切時華、天華、人華、世所珍愛華、甚芬馥悅意\n華。以如是等無量妙華，供養一切現在諸佛，\n及佛滅後所有塔廟，或以供養說法之人，\n或以供養比丘僧寶、一切菩薩、諸善知識、\n聲聞、獨覺、父母、宗親，下至自身及餘一切貧\n窮、孤露。布施之時，以諸善根如是迴向，所謂：\n『願一切眾生皆得諸佛三昧之華，悉能開敷\n\n一切諸法；願一切眾生皆得如佛，見者歡喜，\n心無厭足；願一切眾生所見順愜，心無動亂；\n願一切眾生具行廣大清淨之業；願一切眾\n生常念善友，心無變異；願一切眾生如阿\n伽陀藥，能除一切煩惱眾毒；願一切眾生\n成滿大願，皆悉得為無上智王；願一切眾生\n智慧日光破愚癡暗；願一切眾生菩提淨月\n增長滿足；願一切眾生入大寶洲見善知識，\n具足成就一切善根。』是為菩薩摩訶薩布施\n華時善根迴向，為令眾生皆得清淨無礙\n智故。「佛子！菩薩摩訶薩布施鬘時，以諸善\n根如是迴向，所謂：『願一切眾生人所樂見，\n見者欽歎，見者親善，見者愛樂，見者渴仰，見\n者除憂，見者生喜，見者離惡，見者常得親近\n於佛，見者清淨獲一切智。』是為菩薩摩訶薩\n布施鬘時善根迴向。「佛子！菩薩摩訶薩布\n施香時，以諸善根如是迴向：『願一切眾生具\n足戒香，得不缺戒、不雜戒、不污戒、無悔戒、\n離纏戒、無熱戒、無犯戒、無邊戒、出世戒、菩\n薩波羅蜜戒；願一切眾生以是戒故，皆得\n成就諸佛戒身。』是為菩薩摩訶薩布施香時\n善根迴向，為令眾生悉得圓滿無礙戒蘊故。\n「佛子！菩薩摩訶薩施塗香時，以諸善根如是\n迴向，所謂：『願一切眾生施香普熏，悉能惠捨\n一切所有；願一切眾生戒香普熏，得於如\n來究竟淨戒；願一切眾生忍香普熏，離於\n一切險害之心；願一切眾生精進香普熏，\n常服大乘精進甲冑；願一切眾生定香普\n熏，安住諸佛現前三昧；願一切眾生慧香\n\n普熏，一念得成無上智王；願一切眾生法香\n普熏，於無上法得無所畏；願一切眾生德\n香普熏，成就一切大功德智；願一切眾生菩\n提香普熏，得佛十力到於彼岸；願一切眾生\n清淨白法妙香普熏，永滅一切不善之法。』是\n為菩薩摩訶薩施塗香時善根迴向。「佛子！菩\n薩摩訶薩施床座時，以諸善根如是迴向，所\n謂：『願一切眾生得諸天床座，證大智慧；願\n一切眾生得賢聖床座，捨凡夫意，住菩提心；\n願一切眾生得安樂床座，永離一切生死苦\n惱；願一切眾生得究竟床座，得見諸佛自在\n神通；願一切眾生得平等床座，恒普熏修一\n切善法；願一切眾生得最勝床座，具清淨\n業，世無與等；願一切眾生得安隱床座，證真\n實法，具足究竟；願一切眾生得清淨床座，修\n習如來淨智境界；願一切眾生得安住床座，\n得善知識常隨覆護；願一切眾生得師子床\n座，常如如來右脇而臥。』是為菩薩摩訶薩\n施床座時善根迴向，為令眾生修習正念、善\n護諸根故。「佛子！菩薩摩訶薩施房舍時，以諸\n善根如是迴向，所謂：『願一切眾生皆得安住\n清淨佛剎，精勤修習一切功德；安住甚深\n三昧境界，捨離一切住處執著；了諸住處皆\n無所有，離諸世間住一切智；攝取一切諸佛\n所住，住究竟道安樂住處；恒住第一清淨善\n根，終不捨離佛無上住。』是為菩薩摩訶薩施\n房舍時善根迴向；為欲利益一切眾生，隨其\n所應，思惟救護故。「佛子！菩薩摩訶薩施住處\n時，以諸善根如是迴向，所謂：『願一切眾生常\n\n獲善利，其心安樂；願一切眾生依如來住，依\n大智住，依善知識住，依尊勝住，依善行住，依\n大慈住，依大悲住，依六波羅蜜住，依大菩提\n心住，依一切菩薩道住。』是為菩薩摩訶薩施\n住處時善根迴向，為令一切福德清淨故，\n究竟清淨故，智清淨故，道清淨故，法清淨故，\n戒清淨故，志樂清淨故，信解清淨故，願清淨\n故，一切神通功德清淨故。「佛子！菩薩摩訶\n薩施諸燈明，所謂：酥燈、油燈、寶燈、摩尼燈、\n漆燈、火燈、沈水燈、栴檀燈、一切香燈、無量\n色光燈。施如是等無量燈時，為欲利益一切\n眾生，為欲攝受一切眾生，以此善根如是\n迴向，所謂：『願一切眾生得無量光，普照一切\n諸佛正法；願一切眾生得清淨光，照見世間\n極微細色；願一切眾生得離翳光，了眾生界\n空無所有；願一切眾生得無邊光，身出妙光\n普照一切；願一切眾生得普照光，於諸佛法\n心無退轉；願一切眾生得佛淨光，一切剎\n中悉皆顯現；願一切眾生得無礙光，一光遍\n照一切法界；願一切眾生得無斷光，照諸\n佛剎光明不斷；願一切眾生得智幢光，普照\n世間；願一切眾生得無量色光，照一切剎示\n現神力。』菩薩如是施燈明時，為欲利益一切\n眾生，安樂一切眾生故，以此善根隨逐眾\n生，以此善根攝受眾生，以此善根分布眾\n生，以此善根慈愍眾生，以此善根覆育眾\n生，以此善根救護眾生，以此善根充滿眾\n生，以此善根緣念眾生，以此善根等益眾\n生，以此善根觀察眾生。是為菩薩摩訶薩\n\n施燈明時善根迴向，如是迴向無有障礙，普\n令眾生住善根中。「佛子！菩薩摩訶薩施湯藥\n時，以諸善根如是迴向，所謂：『願一切眾生於\n諸蓋纏，究竟得出；願一切眾生永離病身，得\n如來身；願一切眾生作大良藥，滅除一切不\n善之病；願一切眾生成阿伽陀藥，安住菩薩\n不退轉地；願一切眾生成如來藥，能拔一切\n煩惱毒箭；願一切眾生親近賢聖，滅諸煩惱，\n修清淨行；願一切眾生作大藥王，永除眾\n病，不令重發；願一切眾生作不壞藥樹，悉能\n救療一切眾生；願一切眾生得一切智光，出\n眾病箭；願一切眾生善解世間方藥之法，所\n有疾病為其救療。』菩薩摩訶薩施湯藥時，為\n令一切眾生永離眾病故，究竟安隱故，究竟\n清淨故，如佛無病故，拔除一切病箭故，得無\n盡堅固身故，得金剛圍山所不壞身故，得堅\n固滿足力故，得圓滿不可奪佛樂故，得一切\n佛自在堅固身故，以諸善根如是迴向。\n「佛子！菩薩摩訶薩悉能惠施一切器物。所謂：\n黃金器盛滿雜寶，白銀器盛眾妙寶，瑠璃\n器盛種種寶，玻瓈器盛滿無量寶莊嚴具，\n硨磲器盛赤真珠，碼碯器盛滿珊瑚摩尼珠\n寶，白玉器盛眾美食，栴檀器盛天衣服，金\n剛器盛眾妙香。無量無數種種寶器，盛無量\n無數種種眾寶，或施諸佛，信佛福田不思議\n故；或施菩薩，知善知識難值遇故；或施聖\n僧，為令佛法久住世故；或施聲聞及辟支\n佛，於諸聖人生淨信故；或施父母，為尊重\n故；或施師長，為恒誘誨，令依聖教修功德\n\n故；或施下劣、貧窮、孤露，大慈、大悲愛眼等視\n諸眾生故；專意滿足去、來、今世一切菩薩\n檀波羅蜜故；以一切物普施一切，終不厭\n捨諸眾生故。如是施時，於其施物及以受\n者，皆無所著。菩薩摩訶薩以如是等種種寶\n器盛無量寶而布施時，以諸善根如是迴\n向，所謂：『願一切眾生成等虛空無邊藏器，\n念力廣大，悉能受持世、出世間一切經書，\n無有忘失；願一切眾生成清淨器，能悟諸佛\n甚深正法；願一切眾生成無上寶器，悉能\n受持三世佛法；願一切眾生成就如來廣大\n法器，以不壞信攝受三世佛菩提法；願一切\n眾生成就最勝寶莊嚴器，住大威德菩提之\n心；願一切眾生成就功德所依處器，於諸如\n來無量智慧生淨信解；願一切眾生成就趣\n入一切智器，究竟如來無礙解脫；願一切眾\n生得盡未來劫菩薩行器，能令眾生普皆安\n住一切智力；願一切眾生成就三世諸佛種\n性勝功德器，一切諸佛妙音所說悉能受\n持；願一切眾生成就容納盡法界、虛空界、一\n切世界一切如來眾會道場器，為大丈夫讚\n說之首，勸請諸佛轉正法輪。』是為菩薩摩訶\n薩布施器時善根迴向，為欲普令一切眾生\n皆得圓滿普賢菩薩行願器故。\n大方廣佛華嚴經卷第二十五\n\n\n大方廣佛華嚴經卷第二十六\n\n于闐國三藏實叉難陀奉　制譯\n之四十迴向品第二十五之四\n「佛子！菩薩摩訶薩以種種車，眾寶嚴飾，奉施\n諸佛及諸菩薩、師長、善友、聲聞、緣覺，如是無\n量種種福田，乃至貧窮、孤露之者。此諸人眾，\n或從遠來，或從近來，或承菩薩名聞故來，或\n是菩薩因緣故來，或聞菩薩往昔所發施願\n故來，或是菩薩心願請來。菩薩是時，或施寶\n車，或施金車，悉妙莊嚴，鈴網覆上，寶帶垂下；\n或施上妙瑠璃之車，無量珍奇以為嚴飾；或\n復施與白銀之車，覆以金網，駕以駿馬；或復\n施與無量雜寶所莊嚴車，覆以寶網，駕以香\n象；或復施與栴檀之車，妙寶為輪，雜寶為蓋，\n寶師子座敷置嚴好，百千采女列坐其上，\n十萬丈夫牽御而行；或復施與玻瓈寶車，眾\n雜妙寶以為嚴飾，端正女人充滿其中，寶帳\n覆上，幢幡侍側；或復施與碼碯藏車，飾以眾\n寶，熏諸雜香，種種妙華散布莊嚴，百千采\n女持寶瓔珞，駕馭均調，涉險能安；或復施與\n堅固香車，眾寶為輪，莊嚴巨麗，寶帳覆上，寶\n網垂下，種種寶衣敷布其中，清淨好香流芬\n外徹，其香美妙稱悅人心，無量諸天翼從而\n行，載以眾寶隨時給施；或復施與光明寶車，\n種種諸寶妙色映徹，眾妙寶網羅覆其上，雜\n寶瓔珞周匝垂下，散以末香內外芬潔，所愛\n男女悉載其上。「佛子！菩薩摩訶薩以如是等\n\n眾妙寶車奉施佛時，以此善根如是迴向，所\n謂：『願一切眾生悉解供養最上福田，深信施\n佛，得無量報；願一切眾生一心向佛，常遇無\n量清淨福田；願一切眾生於諸如來無所\n吝惜，具足成就大捨之心；願一切眾生於諸\n佛所修行施行，離二乘願，逮得如來無礙解\n脫一切智智；願一切眾生於諸佛所行無盡\n施，入佛無量功德智慧；願一切眾生入佛勝\n智，得成清淨無上智王；願一切眾生得佛遍\n至無礙神通，隨所欲往，靡不自在；願一切眾\n生深入大乘，獲無量智，安住不動；願一切\n眾生皆能出生一切智法，為諸天人最上福\n田；願一切眾生於諸佛所無嫌恨心，勤種善\n根，樂求佛智；願一切眾生任運能往一切佛\n剎，一剎那中普周法界而無懈倦；願一切眾\n生逮得菩薩自在神通，分身遍滿等虛空界\n一切佛所親近供養；願一切眾生得無比身，\n遍往十方而無厭倦；願一切眾生得廣大身，\n飛行迅疾，隨意所往，終無懈退；願一切眾生\n得佛究竟自在威力，一剎那中盡虛空界，悉\n現諸佛神通變化；願一切眾生修安樂行，隨\n順一切諸菩薩道；願一切眾生得速疾行，究\n竟十力智慧神通；願一切眾生普入法界十\n方國土，悉盡邊際等無差別；願一切眾生行\n普賢行無有退轉，到於彼岸成一切智；願一\n切眾生昇於無比智慧之乘，隨順法性見如\n實理。』是為菩薩摩訶薩以眾寶車奉施現在\n一切諸佛及佛滅後所有塔廟善根迴向，為\n令眾生得於如來究竟出離無礙乘故。「佛\n\n子！菩薩摩訶薩以眾寶車施菩薩等善知識\n時，以諸善根如是迴向，所謂：『願一切眾生心\n常憶持善知識教，專勤守護，令不忘失；願一\n切眾生與善知識同一義利，普攝一切與共\n善根；願一切眾生近善知識，尊重供養，悉捨\n所有，順可其心；願一切眾生得善志欲，隨逐\n善友，未甞捨離；願一切眾生常得值遇諸善\n知識，專意承奉，不違其教；願一切眾生樂善\n知識，常不捨離，無間無雜，亦無誤失；願一切\n眾生能以其身施善知識，隨其教命靡有違\n逆；願一切眾生為善知識之所攝受，修習大\n慈，遠離諸惡；願一切眾生隨善知識聽聞諸\n佛所說正法；願一切眾生與善知識同一善\n根清淨業果，與諸菩薩同一行願究竟十\n力；願一切眾生悉能受持善知識法，逮得一\n切三昧境界智慧神通；願一切眾生悉能受\n持一切正法，修習諸行到於彼岸；願一切\n眾生乘於大乘無所障礙，究竟成就一切\n智道；願一切眾生悉得上於一切智乘，至\n安隱處無有退轉；願一切眾生知如實行，\n隨其所聞一切佛法，皆得究竟，永無忘失；\n願一切眾生普為諸佛之所攝受，得無礙\n智，究竟諸法；願一切眾生得無退失自\n在神通，所欲往詣，一念皆到；願一切眾生\n往來自在，廣行化導，令住大乘；願一切眾\n生所行不空，載以智乘到究竟位；願一\n切眾生得無礙乘，以無礙智至一切處。』是為\n菩薩摩訶薩施善知識種種車時善根迴向，\n為令眾生功德具足與佛菩薩等無異故。「佛\n子！菩薩摩訶薩以眾寶車布施僧時，起學一\n\n切施心、智善了心、淨功德心、隨順捨心、僧寶\n難遇心、深信僧寶心、攝持正教心，住勝志樂，\n得未曾有，為大施會，出生無量廣大功德，深\n信佛教不可沮壞；以諸善根如是迴向，所謂：\n『願一切眾生普入佛法，憶持不忘；願一切眾\n生離凡愚法，入賢聖處；願一切眾生速入聖\n位，能以佛法次第開誘；願一切眾生舉世\n宗重，言必信用；願一切眾生善入一切諸\n法平等，了知法界自性無二；願一切眾生從\n於如來智境而生，諸調順人所共圍遶；願一\n切眾生住離染法，滅除一切煩惱塵垢；願一\n切眾生皆得成就無上僧寶，離凡夫地，入賢\n聖眾；願一切眾生勤修善法，得無礙智，具聖\n功德；願一切眾生得智慧心，不著三世，於諸\n眾中自在如王；願一切眾生乘智慧乘，轉正\n法輪；願一切眾生具足神通，一念能往不可\n說不可說世界；願一切眾生乘虛空身，於諸\n世間智慧無礙；願一切眾生普入一切虛空\n法界諸佛眾會，成就第一波羅蜜行；願一切\n眾生得輕舉身殊勝智慧，悉能遍入一切佛\n剎；願一切眾生獲無邊際善巧神足，於一切\n剎普現其身；願一切眾生得於一切無所依\n身，以神通力如影普現；願一切眾生得不思\n議自在神力，隨應可化，即現其前，教化調\n伏；願一切眾生得入法界無礙方便，一念遍\n遊十方國土。』是為菩薩摩訶薩施僧寶車善\n根迴向；為令眾生普乘清淨無上智乘，於一\n切世間轉無礙法智慧輪故。「佛子！菩薩摩訶\n薩以眾寶車布施聲聞、獨覺之時，起如是\n\n心，所謂：福田心、尊敬心、功德海心、能出生功\n德智慧心、從如來功德勢力所生心、百千億\n那由他劫修習心、能於不可說劫修菩薩行\n心、解脫一切魔繫縛心、摧滅一切魔軍眾心、\n慧光照了無上法心；以此施車所有善根如\n是迴向，所謂：『願一切眾生為世所信第一福\n田，具足無上檀波羅蜜；願一切眾生離無\n益語，常樂獨處，心無二念；願一切眾生成最\n第一清淨福田，攝諸眾生令修福業；願一切\n眾生成智慧淵，能與眾生無量無數善根果\n報；願一切眾生住無礙行，滿足清淨第一福\n田；願一切眾生住無諍法，了一切法皆無所\n作、無性為性；願一切眾生常得親近最上福\n田，具足修成無量福德；願一切眾生能現無\n量自在神通，以淨福田攝諸含識；願一切\n眾生具足無盡功德福田，能與眾生如來十\n力第一乘果；願一切眾生為能辦果真實\n福田，成一切智，無盡福聚；願一切眾生得滅\n罪法，悉能受持所未曾聞佛法句義；願一切\n眾生常勤聽受一切佛法，聞悉解悟，無空過\n者；願一切眾生聽聞佛法通達究竟，如其所\n聞，隨順演說；願一切眾生於如來教信解修\n行，捨離一切九十六種外道邪見；願一切眾\n生常見賢聖，增長一切最勝善根；願一切眾\n生心常信樂智行之士，與諸聖哲同止共歡；\n願一切眾生聽聞佛名悉不唐捐，隨其所聞，\n咸得目見；願一切眾生善分別知諸佛正教，\n悉能守護持佛法者；願一切眾生常樂聽聞\n一切佛法，受持讀誦，開示照了；願一切眾生\n\n信解佛教如實功德，悉捨所有，恭敬供養。』是\n為菩薩摩訶薩施聲聞、獨覺種種車時善根迴\n向；為令眾生皆得成就清淨第一智慧神通，\n精進修行無有懈怠，獲一切智、力、無畏故。「佛\n子！菩薩摩訶薩以眾寶車施諸福田乃至貧\n窮、孤獨者時，隨其所求，一切悉捨，心生歡\n喜，無有厭倦，仍向彼人自悔責言：『我應往就\n供養供給，不應勞汝遠來疲頓。』言已拜跪，問\n訊起居，凡有所須，一切施與；或時施彼摩尼\n寶車，以閻浮提第一女寶充滿其上；或復施\n與金莊嚴車，人間女寶充滿其上；或復施與\n妙瑠璃車，內宮妓女充滿其上；或施種種奇\n妙寶車，童女充滿，如天采女；或施無數寶\n莊嚴車，寶女滿中，柔明辯慧；或施所乘妙栴\n檀車，或復施與玻瓈寶車，悉載寶女，充滿其\n上，顏容端正，色相無比，袨服莊嚴，見者欣\n悅；或復施與碼碯寶車，灌頂王子身載其上；\n或時施與堅固香車，所有男女悉載其中；或\n施一切寶莊嚴車，載以難捨親善眷屬。「佛子！\n菩薩摩訶薩以如是等無量寶車，隨其所求，\n恭敬施與，皆令遂願，歡喜滿足；以此善根如\n是迴向，所謂：『願一切眾生乘不退轉無障礙\n輪廣大之乘，詣不可議菩提樹下；願一切\n眾生乘清淨因大法智乘，盡未來劫，修菩薩\n行永不退轉；願一切眾生乘一切法無所有\n乘，永離一切分別執著，而常修習一切智道；\n願一切眾生乘無諂誑正直之乘，往諸佛剎，\n自在無礙；願一切眾生隨順安住一切智乘，\n以諸佛法共相娛樂；願一切眾生皆乘菩薩\n\n清淨行乘，具足菩薩十出離道及三昧樂；願\n一切眾生乘四輪乘，所謂住好國土、依止善\n人、集勝福德、發大誓願，以此成滿一切菩薩\n清淨梵行；願一切眾生得普照十方法光明\n乘，修學一切如來智力；願一切眾生乘佛法\n乘，到一切法究竟彼岸；願一切眾生載眾\n福善難思法乘，普示十方安隱正道；願一切\n眾生乘大施乘，捨慳吝垢；願一切眾生乘淨\n戒乘，持等法界無邊淨戒；願一切眾生乘忍\n辱乘，常於眾生離瞋濁心；願一切眾生乘大\n精進不退轉乘，堅修勝行，趣菩提道；願一切\n眾生乘禪定乘，速至道場，證菩提智；願一切\n眾生乘於智慧巧方便乘，化身充滿一切法\n界、諸佛境界；願一切眾生乘法王乘，成就無\n畏，恒普惠施一切智法；願一切眾生乘無所\n著智慧之乘，悉能遍入一切十方，於真法性\n而無所動；願一切眾生乘於一切諸佛法乘，\n示現受生遍十方剎，而不失壞大乘之道；願\n一切眾生乘一切智最上寶乘，滿足普賢菩\n薩行願而無厭倦。』是為菩薩摩訶薩以眾寶\n車施諸福田乃至貧窮、孤露之人善根迴向；\n為令眾生具無量智，歡喜踊躍，究竟皆得一\n切智乘故。「佛子！菩薩摩訶薩布施象寶，其性\n調順，七支具足，年齒盛壯，六牙清淨，口色紅\n赤猶如蓮華，形體鮮白譬如雪山，金幢為\n飾，寶網羅覆，種種妙寶莊嚴其鼻，見者欣\n玩無有厭足，超步萬里曾不疲倦；或復施\n與調良馬寶，諸相具足猶如天馬，妙寶月輪\n以為光飾，真金鈴網羅覆其上，行步平正，乘\n\n者安隱，隨意所往迅疾如風，遊歷四洲自在\n無礙。菩薩以此象寶、馬寶，或奉養父母及善\n知識，或給施貧乏、苦惱眾生，其心曠然，不生\n悔吝，但倍增欣慶，益加悲愍，修菩薩德，淨菩\n薩心；以此善根如是迴向，所謂：『願一切眾生\n住調順乘，增長一切菩薩功德；願一切眾生\n得善巧乘，能隨出生一切佛法；願一切眾生\n得信解乘，普照如來無礙智力；願一切眾生\n得發趣乘，能普發興一切大願；願一切眾生\n具足平等波羅蜜乘，成滿一切平等善根；願\n一切眾生成就寶乘，生諸佛法無上智寶；願\n一切眾生成就菩薩行莊嚴乘，開敷菩薩\n諸三昧華；願一切眾生得無邊速疾乘，於無\n數劫淨菩薩心，精勤思惟，了達諸法；願一切\n眾生成就最勝調順大乘，以善方便具菩薩\n地；願一切眾生成最高廣堅固大乘，普能運\n載一切眾生，皆得至於一切智位。』是為菩薩\n摩訶薩施象、馬時善根迴向；為令眾生皆得\n乘於無礙智乘，圓滿究竟至佛乘故。\n「佛子！菩薩摩訶薩布施座時，或施所處師子\n之座。其座高廣殊特妙好，瑠璃為足，金鏤所\n成，柔軟衣服以敷其上；建以寶幢，熏諸妙\n香，無量雜寶莊嚴之具以為莊校；金網覆\n上，寶鐸風搖，出妙音聲；奇珍萬計周匝填\n飾，一切臣民所共瞻仰。灌頂大王獨居其\n上，宣布法化，萬邦遵奉。其王復以妙寶嚴\n身。所謂：普光明寶、帝青寶、大帝青寶、勝藏摩\n尼寶，明淨如日，清涼猶月，周匝繁布譬如眾\n星，上妙莊嚴第一無比；海殊妙寶、海堅固幢\n\n寶，奇文異表，種種莊嚴，於大眾中最尊最\n勝。閻浮檀金離垢寶繒以冠其首，享灌頂\n位，王閻浮提，具足無量大威德力；以慈為\n主，伏諸怨敵，教令所行，靡不承順。時，轉輪\n王以如是等百千萬億無量無數寶莊嚴座，\n施於如來第一福田，及諸菩薩、真善知識、賢\n聖僧寶、說法之師、父母、宗親、聲聞、獨覺，及以\n發趣菩薩乘者，或如來塔，乃至一切貧窮、孤\n露；隨其所須，悉皆施與。以此善根如是迴向，\n所謂：『願一切眾生坐菩提座，悉能覺悟諸佛\n正法；願一切眾生處自在座，得法自在，諸金\n剛山所不能壞，能悉摧伏一切魔軍；願一切\n眾生得佛自在師子之座，一切眾生之所瞻\n仰；願一切眾生得不可說不可說種種殊妙\n寶莊嚴座，於法自在，化導眾生；願一切眾生\n得三種世間最殊勝座，廣大善根之所嚴飾；\n願一切眾生得周遍不可說不可說世界座，\n阿僧祇劫歎之無盡；願一切眾生得大深密\n福德之座，其身充滿一切法界；願一切眾生\n得不思議種種寶座，隨其本願所念眾生，廣\n開法施；願一切眾生得善妙座，現不可說諸\n佛神通；願一切眾生得一切寶座、一切香座、\n一切華座、一切衣座、一切鬘座、一切摩尼座、\n一切瑠璃等不思議種種寶座、無量不可說\n世界座、一切世間莊嚴清淨座、一切金剛座，\n示現如來威德自在，成最正覺。』是為菩薩摩\n訶薩施寶座時善根迴向；為令眾生獲離世\n間大菩提座，自然覺悟一切佛法故。「佛子！菩\n薩摩訶薩施諸寶蓋。此蓋殊特，尊貴所用，種\n\n種大寶而為莊嚴，百千億那由他上妙蓋中\n最為第一；眾寶為竿，妙網覆上，寶繩金鈴周\n匝垂下，摩尼瓔珞次第懸布，微風吹動，妙音\n克諧；珠玉寶藏種種充滿，無量奇珍悉以嚴\n飾，栴檀、沈水妙香普熏，閻浮檀金光明清\n淨。如是無量百千億那由他阿僧祇眾妙寶\n物具足莊嚴，以清淨心奉施於佛，及佛滅\n後所有塔廟，或為法故施諸菩薩及善知\n識、名聞法師，或施父母，或施僧寶，或復奉\n施一切佛法，或施種種眾生福田，或施師僧\n及諸尊宿，或施初發菩提之心乃至一切貧\n窮、孤露；隨有求者，悉皆施與。以此善根如是\n迴向，所謂：『願一切眾生勤修善根以覆其身，\n常為諸佛之所庇廕；願一切眾生功德智慧\n以為其蓋，永離世間一切煩惱；願一切眾生覆\n以善法，除滅世間塵垢熱惱；願一切眾生得\n智慧藏，令眾樂見，心無厭足；願一切眾生以\n寂靜白法而自覆蔭，皆得究竟不壞佛法；願\n一切眾生善覆其身，究竟如來清淨法身；願\n一切眾生作周遍蓋，十力智慧遍覆世間；願\n一切眾生得妙智慧，出過三世無所染著；願\n一切眾生得應供蓋，成勝福田，受一切供；願\n一切眾生得最上蓋，獲無上智，自然覺悟。』是\n為菩薩摩訶薩布施蓋時善根迴向；為令一\n切眾生得自在蓋，能持一切諸善法故；為令\n一切眾生能以一蓋，普覆一切虛空法界一\n切剎土，示現諸佛自在神通無退轉故；為令\n一切眾生能以一蓋，莊嚴十方一切世界，供\n養佛故；為令一切眾生以妙幢幡及諸寶蓋，\n\n供養一切諸如來故；為令一切眾生得普莊\n嚴蓋，遍覆一切諸佛國土盡無餘故；為令一\n切眾生得廣大蓋，普蓋眾生，皆令於佛生信\n解故；為令一切眾生以不可說眾妙寶蓋，供\n養一佛，於不可說一一佛所皆如是故；為令\n一切眾生得佛菩提高廣之蓋，普覆一切諸\n如來故；為令一切眾生得一切摩尼寶莊嚴\n蓋、一切寶瓔珞莊嚴蓋、一切堅固香莊嚴蓋、\n種種寶清淨莊嚴蓋、無量寶清淨莊嚴蓋、廣\n大寶清淨莊嚴蓋，寶網彌覆，寶鈴垂下，隨風\n搖動，出微妙音，普覆法界、虛空界、一切世界\n諸佛身故；為令一切眾生得無障無礙智莊\n嚴蓋，普覆一切諸如來故；又欲令一切眾生\n得第一智慧故；又欲令一切眾生得佛功德\n莊嚴故；又欲令一切眾生於佛功德生清淨\n欲願心故；又欲令一切眾生得無量無邊自\n在心寶故；又欲令一切眾生滿足諸法自在\n智故；又欲令一切眾生以諸善根普覆一切\n故；又欲令一切眾生成就最勝智慧蓋故；又\n欲令一切眾生成就十力普遍蓋故；又欲令\n一切眾生能以一蓋彌覆法界諸佛剎故；又\n欲令一切眾生於法自在為法王故；又欲令\n一切眾生得大威德自在心故；又欲令一切\n眾生得廣大智恒無絕故；又欲令一切眾生\n得無量功德普覆一切皆究竟故；又欲令一\n切眾生以諸功德蓋其心故；又欲令一切眾\n生以平等心覆眾生故；又欲令一切眾生得\n大智慧平等蓋故；又欲令一切眾生具大迴\n向巧方便故；又欲令一切眾生獲勝欲樂清\n\n淨心故；又欲令一切眾生得善欲樂清淨意\n故；又欲令一切眾生得大迴向普覆一切諸\n眾生故。「佛子！菩薩摩訶薩或施種種上妙幢\n幡。眾寶為竿，寶繒為幡，種種雜綵以為其\n幢；寶網垂覆，光色遍滿；寶鐸微搖，音節相\n和；奇特妙寶形如半月，閻浮檀金光逾皦\n日，悉置幢上；隨諸世界業果所現，種種妙\n物以為嚴飾。如是無數千萬億那由他諸妙\n幢幡，接影連輝遞相間發，光明嚴潔周遍大\n地，充滿十方虛空法界一切佛剎。菩薩摩訶\n薩淨心信解，以如是等無量幢幡，或施現\n在一切諸佛及佛滅後所有塔廟，或施法\n寶，或施僧寶，或施菩薩、諸善知識，或施聲\n聞及辟支佛，或施大眾，或施別人；諸來求\n者，普皆施與。以此善根如是迴向，所謂：『願\n一切眾生皆能建立一切善根福德幢幡，不\n可毀壞；願一切眾生建一切法自在幢幡，\n尊重愛樂，勤加守護；願一切眾生常以寶繒\n書寫正法，護持諸佛菩薩法藏；願一切眾生\n建高顯幢，然智慧燈普照世間；願一切眾生\n立堅固幢，悉能摧殄一切魔業；願一切眾生\n建智力幢，一切諸魔所不能壞；願一切眾生\n得大智慧那羅延幢，摧滅一切世間慢幢；\n願一切眾生得智慧日大光明幢，以智日光\n普照法界；願一切眾生具足無量寶莊嚴幢，\n充滿十方一切世界供養諸佛；願一切眾生\n得如來幢，摧滅一切九十六種外道邪見。』是\n為菩薩摩訶薩施幢幡時善根迴向，為令一\n切眾生得甚深高廣菩薩行幢及諸菩薩神\n\n通行幢清淨道故。「佛子！菩薩摩訶薩開眾寶\n藏，以百千億那由他諸妙珍寶，給施無數一\n切眾生，隨意與之，心無吝惜；以諸善根如是\n迴向，所謂：『願一切眾生常見佛寶，捨離愚癡，\n修行正念；願一切眾生皆得具足法寶光明，\n護持一切諸佛法藏；願一切眾生能悉攝受\n一切僧寶，周給供養，恒無厭足；願一切眾生\n得一切智無上心寶，淨菩提心，無有退轉；願\n一切眾生得智慧寶，普入諸法，心無疑惑；願\n一切眾生具足菩薩諸功德寶，開示演說無\n量智慧；願一切眾生得於無量妙功德寶，修\n成正覺十力智慧；願一切眾生得妙三昧十\n六智寶，究竟成滿廣大智慧；願一切眾生成\n就第一福田之寶，悟入如來無上智慧；願一\n切眾生得成第一無上寶主，以無盡辯開\n演諸法。』是為菩薩摩訶薩施眾寶時善根迴\n向，為令一切眾生皆得成滿第一智寶、如來\n無礙淨眼寶故。「佛子！菩薩摩訶薩或以種\n種妙莊嚴具而為布施。所謂：一切身莊嚴具，\n令身淨妙，靡不稱可。菩薩摩訶薩等觀一切\n世間眾生，猶如一子，欲令皆得身淨莊嚴，成\n就世間最上安樂、佛智慧樂，安住佛法，利益\n眾生。以如是等百千億那由他種種殊妙寶\n莊嚴具，勤行布施。行布施時，以諸善根如是\n迴向，所謂：『願一切眾生成就無上妙莊嚴具，\n以諸清淨功德智慧莊嚴人天；願一切眾生\n得清淨莊嚴相，以淨福德莊嚴其身；願一切\n眾生得上妙莊嚴相，以百福相莊嚴其身；願\n一切眾生得不雜亂莊嚴相，以一切相莊嚴\n\n其身；願一切眾生得善淨語言莊嚴相，具足\n種種無盡辯才；願一切眾生得一切功德聲\n莊嚴相，其音清淨，聞者喜悅；願一切眾生得\n可愛樂諸佛語言莊嚴相，令諸眾生聞法歡\n喜修清淨行；願一切眾生得心莊嚴相，入深\n禪定，普見諸佛；願一切眾生得總持莊嚴相，\n照明一切諸佛正法；願一切眾生得智慧莊\n嚴相，以佛智慧莊嚴其心。』是為菩薩摩訶薩\n惠施一切莊嚴具時善根迴向；為令眾生具\n足一切無量佛法，功德智慧圓滿莊嚴，永離\n一切憍慢放逸故。「佛子！菩薩摩訶薩以受灌\n頂自在王位摩尼寶冠及髻中珠，普施眾\n生，心無吝惜，常勤修習，為大施主，修學施\n慧，增長捨根，智慧善巧，其心廣大，給施一\n切，以彼善根如是迴向，所謂：『願一切眾生\n得諸佛法之所灌頂，成一切智；願一切眾生\n具足頂髻，得第一智，到於彼岸；願一切眾生\n以妙智寶普攝眾生，皆令究竟功德之頂；願\n一切眾生皆得成就智慧寶頂，堪受世間之\n所禮敬；願一切眾生以智慧冠莊嚴其首，為\n一切法自在之王；願一切眾生智慧明珠繫\n其頂上，一切世間無能見者；願一切眾生皆\n悉堪受世間頂禮，成就慧頂，照明佛法；願一\n切眾生首冠十力莊嚴之冠，智慧寶海清淨\n具足；願一切眾生至大地頂，得一切智，究竟\n十力，破欲界頂諸魔眷屬；願諸眾生得成第\n一無上頂王，獲一切智光明之頂，無能映\n奪。』是為菩薩摩訶薩施寶冠時善根迴向，為\n令眾生得第一智最清淨處智慧摩尼妙寶\n\n冠故。「佛子！菩薩摩訶薩見有眾生處在牢獄\n黑暗之處，杻械、枷鎖檢繫其身，起坐不安，眾\n苦競集，無有親識，無歸無救，裸露、飢羸，酸劇\n難忍。菩薩見已，捨其所有一切財寶、妻子、眷\n屬及以自身，於牢獄中救彼眾生，如大悲\n菩薩、妙眼王菩薩；既救度已，隨其所須，普皆\n給施，除其苦患，令得安隱；然後施以無上法\n寶，令捨放逸，安住善根，於佛教中，心無退\n轉。佛子！菩薩摩訶薩於牢獄中救眾生時，\n以諸善根如是迴向，所謂：『願一切眾生究竟\n解脫貪愛纏縛；願一切眾生斷生死流，昇智\n慧岸；願一切眾生除滅愚癡，生長智慧，解脫\n一切煩惱纏縛；願一切眾生滅三界縛，得一\n切智，究竟出離；願一切眾生永斷一切煩\n惱結縛，到無煩惱、無障礙地智慧彼岸；願一\n切眾生離諸動念、思惟、分別，入於平等不動\n智地；願一切眾生脫諸欲縛，永離世間一切\n貪欲，於三界中無所染著；願一切眾生得勝\n志樂，常蒙諸佛為說法門；願一切眾生得無\n著、無縛解脫，心廣大如法界，究竟如虛空；願\n一切眾生得菩薩神通，一切世界調伏眾生，\n令離世間，住於大乘。』是為菩薩摩訶薩救度\n牢獄苦眾生時善根迴向，為令眾生普入如\n來智慧地故。「佛子！菩薩摩訶薩見有獄囚五\n處被縛，受諸苦毒；防衛驅逼，將之死地，欲斷\n其命，捨閻浮提一切樂具，親戚、朋友悉將永\n訣，置高碪上以刀屠割，或用木槍豎貫其\n體，衣纏油沃以火焚燒，如是等苦，種種逼迫。\n菩薩見已，自捨其身而代受之；如阿逸多菩\n\n薩、殊勝行王菩薩及餘無量諸大菩薩，為眾\n生故，自捨身命，受諸苦毒。菩薩爾時語主者\n言：『我願捨身以代彼命，如此等苦可以與\n我。如治彼人，隨意皆作；設過彼苦阿僧祇\n倍，我亦當受，令其解脫。我若見彼將被殺\n害，不捨身命救贖其苦，則不名為住菩薩\n心。何以故？我為救護一切眾生，發一切智菩\n提心故。』佛子！菩薩摩訶薩自捨身命救眾生\n時，以諸善根如是迴向，所謂：『願一切眾生得\n無斷盡究竟身命，永離一切災橫逼惱；願一\n切眾生依諸佛住，受一切智，具足十力，菩\n提記別；願一切眾生普救含識，令無怖畏，\n永出惡道；願一切眾生得一切命，入於不死\n智慧境界；願一切眾生永離怨敵，無諸厄難，\n常為諸佛、善友所攝；願一切眾生捨離一切\n刀劍兵仗、諸惡苦具，修行種種清淨善業；願\n一切眾生離諸怖畏，菩提樹下摧伏魔軍；願\n一切眾生離大眾怖，於無上法心淨無畏，能\n為最上大師子吼；願一切眾生得無障礙師\n子智慧，於諸世間修行正業；願一切眾生到\n無畏處，常念救護諸苦眾生。』是為菩薩摩訶\n薩自捨身命救彼臨刑諸獄囚時善根迴向；\n為令眾生離生死苦，得於如來上妙樂故。\n大方廣佛華嚴經卷第二十六\n\n\n\n大方廣佛華嚴經卷第二十七\n\n于闐國三藏實叉難陀奉　制譯\n之五十迴向品第二十五之五\n「佛子！菩薩摩訶薩布施乞者連膚頂髻，如寶\n髻王菩薩、勝妙身菩薩，及餘無量諸菩薩等。\n菩薩是時見乞者來，心生歡喜而語之言：『汝\n今若須連膚頂髻，可就我取。我此頂髻，閻浮\n提中最為第一。』作是語時，心無動亂，不念餘\n業，捨離世間，志求寂靜，究竟清淨，精勤質\n直，向一切智；便執利刀割其頭上連膚頂\n髻，右膝著地，合十指掌，一心施與；正念三\n世一切諸佛菩薩所行，發大歡喜，增上志\n樂；於諸法中意善開解，不取於苦，了知苦\n受無相無生，諸受互起，無有常住：『是故我\n應同去、來、今一切菩薩修行大捨，發深信樂，\n求一切智無有退轉，不由他教善知識力。』菩\n薩摩訶薩作是施時，以諸善根如是迴向，所\n謂：『願一切眾生得無見頂，成就菩薩如塔之\n髻；願一切眾生得紺青髮、金剛髮、細軟髮，\n能滅眾生一切煩惱；願一切眾生得潤澤髮、\n密緻髮、不侵鬢額髮；願一切眾生得柔軟髮、\n盡於鬢額而生髮；願一切眾生得如卐字\n髮、螺文右旋髮；願一切眾生得佛相髮，永離\n一切煩惱結習；願一切眾生得光明髮，其光\n普照十方世界；願一切眾生得無亂髮、如如\n來髮，淨妙無雜；願一切眾生得成應供頂塔\n之髮，令其見者如見佛髮；願一切眾生皆得\n\n如來無染著髮，永離一切闇翳塵垢。』是為菩\n薩摩訶薩施連膚髻時善根迴向；為令眾生\n其心寂靜，皆得圓滿諸陀羅尼，究竟如來一\n切種智、十種力故。「佛子！菩薩摩訶薩以眼布\n施諸來乞者，如歡喜行菩薩、月光王菩薩，及\n餘無量諸菩薩等所行惠施。菩薩摩訶薩布\n施眼時，起清淨施眼心，起清淨智眼心，起依\n止法光明心，起現觀無上佛道心，發迴向廣\n大智慧心，發與三世菩薩平等捨施心，發於\n無礙眼起不壞淨信心，於其乞者起歡喜攝\n受心；為究竟一切神通故，為生佛眼故，為增\n廣大菩提心故，為修習大慈悲故，為制伏六\n根故，於如是法而生其心。佛子！菩薩摩訶\n薩布施眼時，於其乞者心生愛樂，為設施\n會，增長法力；捨離世間愛見放逸，除斷欲\n縛，修習菩提；隨彼所求，心安不動，不違其\n意，皆令滿足，而常隨順無二捨行。以此善\n根如是迴向，所謂：『願一切眾生得最勝眼，\n示導一切；願一切眾生得無礙眼，開廣智藏；\n願一切眾生得淨肉眼，光明鑒徹，無能蔽者；\n願一切眾生得淨天眼，悉見眾生生死業果；\n願一切\n\n### （续前·回向⑥后半至回向⑩）\n\n眾生得淨法眼，能隨順入如來境界；\n願一切眾生得智慧眼，捨離一切分別取著；\n願一切眾生具足佛眼，悉能覺悟一切諸法；\n願一切眾生成就普眼，盡諸境界無所障礙；\n願一切眾生成就清淨離癡瞖眼，了眾生\n界空無所有；願一切眾生具足清淨無障礙\n眼，皆得究竟如來十力。』是為菩薩摩訶薩布\n施眼時善根迴向，為令眾生得一切智清淨\n\n眼故。「佛子！菩薩摩訶薩能以耳、鼻施諸乞\n者，如勝行王菩薩、無怨勝菩薩，及餘無量諸\n菩薩等。布施之時，親附乞者，專心修習諸菩\n薩行；具佛種性，生如來家，念諸菩薩所修施\n行，常勤發起諸佛菩提，清淨諸根功德智慧；\n觀察三有，無一堅固；願常得見諸佛菩薩，隨\n順憶念一切佛法；知身虛妄空無所有，無所\n貪惜。菩薩如是施耳、鼻時，心常寂靜，調伏諸\n根；免濟眾生險惡諸難，生長一切智慧功\n德；入大施海，了達法義，具修諸道；依智慧\n行，得法自在，以不堅身易堅固身。佛子！菩\n薩摩訶薩布施耳時，以諸善根如是迴向，所\n謂：『願一切眾生得無礙耳，普聞一切說法之\n音；願一切眾生得無障耳，悉能解了一切音\n聲；願一切眾生得如來耳，一切聰達無所\n壅滯；願一切眾生得清淨耳，不因耳處生\n分別心；願一切眾生得無聾聵耳，令蒙昧\n識畢竟不生；願一切眾生得遍法界耳，悉知\n一切諸佛法音；願一切眾生得無礙耳，開悟\n一切無障礙法；願一切眾生得無壞耳，善知\n諸論，無能壞者；願一切眾生得普聞耳，廣大\n清淨，為諸耳王；願一切眾生具足天耳及以\n佛耳。』是為菩薩摩訶薩布施耳時善根迴向，\n為令眾生皆悉獲得清淨耳故。佛子！菩薩摩\n訶薩布施鼻時，如是迴向，所謂：『願一切眾生\n得隆直鼻，得隨好鼻，得善相鼻，得可愛樂鼻，\n得淨妙鼻，得隨順鼻，得高顯鼻，得伏怨鼻，得\n善見鼻，得如來鼻；願一切眾生得離恚怒面，\n得一切法面，得無障礙面，得善見面，得隨順\n\n面，得清淨面，得離過失面，得如來圓滿面，得\n遍一切處面，得無量美好面。』是為菩薩摩訶\n薩布施鼻時善根迴向，為令眾生究竟得入\n諸佛法故，為令眾生究竟攝受諸佛法故，為\n令眾生究竟了知諸佛法故，為令眾生究竟\n住持諸佛法故，為令眾生究竟常見諸如來\n故，為令眾生皆悉證得佛法門故，為令眾生\n究竟成就無能壞心故，為令眾生皆能照了\n諸佛正法故，為令眾生普悉嚴淨諸佛國土\n故，為令眾生皆得如來大威力身故。是為菩\n薩摩訶薩施耳、鼻時善根迴向。「佛子！菩薩摩\n訶薩安住堅固自在地中，能以牙齒施諸眾\n生，猶如往昔華齒王菩薩、六牙象王菩薩，及\n餘無量諸菩薩等。菩薩摩訶薩施牙齒時，其\n心清淨，希有難得如優曇華。所謂：無盡心施、\n大信心施、步步成就無量捨心施、調伏諸根\n心施、一切悉捨心施、一切智願心施、安樂眾\n生心施、大施、極施、勝施、最勝施、輟身要用無\n所嫌恨心施。菩薩爾時，以諸善根如是迴向，\n所謂：『願一切眾生得銛白牙齒，成最勝塔，受\n天人供；願一切眾生得齊平牙齒，如佛相好，\n無有踈缺；願一切眾生得調伏心，善趣菩薩\n波羅蜜行；願一切眾生口善清淨，牙齒鮮白，\n分明顯現；願一切眾生得可憶念莊嚴牙齒，\n其口清淨，無可惡相；願一切眾生牙齒成就\n具滿四十，常出種種希有妙香；願一切眾生\n意善調伏，牙齒鮮潔如白蓮華，文理迴旋\n卐字成就；願一切眾生口脣鮮淨，牙齒潔\n白，放無量光周遍照耀；願一切眾生牙齒\n\n堅利，食無完粒，無所味著，為上福田；願一切\n眾生於牙齒間常放光明，授諸菩薩第一記\n別。』是為菩薩摩訶薩施牙齒時善根迴向；為\n令眾生具一切智，於諸法中智慧清淨故。「佛\n子！菩薩摩訶薩若有人來從乞舌時，於乞者\n所，以慈悲心軟語、愛語，猶如往昔端正面\n王菩薩、不退轉菩薩，及餘無量諸菩薩等。佛\n子！菩薩摩訶薩於諸趣中而受生時，有無量\n百千億那由他眾生而來乞舌。菩薩爾時，安\n置其人在師子座，以無恚心、無害心、無恨\n心、大威德心、從佛種性所生心、住於菩薩所\n住心、常不濁亂心、住大勢力心、於身無著心、\n於語無著心，兩膝著地，開口出舌，以示乞者；\n慈心軟語而告之言：『我今此身，普皆屬汝。可\n取我舌，隨意所用；令汝所願，皆得滿足。』菩薩\n爾時，以諸善根如是迴向，所謂：『願一切眾生\n得周普舌，悉能宣示諸語言法；願一切眾生\n得覆面舌，所言無二，皆悉真實；願一切眾生\n得普覆一切佛國土舌，示現諸佛自在神通；\n願一切眾生得軟薄舌，恒受美妙清淨上味；\n願一切眾生得辯才舌，能斷一切世間疑網；\n願一切眾生得光明舌，能放無數萬億光明；\n願一切眾生得決定舌，辯說諸法無有窮盡；\n願一切眾生得普調伏舌，善能開示一切祕\n要，所有言說皆令信受；願一切眾生得普通\n達舌，善入一切語言大海；願一切眾生得善\n說一切諸法門舌，於言語智悉到彼岸。』是為\n菩薩摩訶薩布施舌時善根迴向，為令眾生\n皆得圓滿無礙智故。「佛子！菩薩摩訶薩以頭\n\n布施諸來乞者，如最勝智菩薩，及大丈夫迦\n尸國王等諸大菩薩所行布施；為欲成就入\n一切法最勝智首，為欲成就證大菩提救眾\n生首，為欲具足見一切法最第一首，為得\n正見清淨智首，為欲成就無障礙首，為欲證\n得第一地首，為求世間最勝智首，欲成三界\n無能見頂淨智慧首，為得示現普到十方智\n慧王首，為欲滿足一切諸法無能破壞自在\n之首。佛子！菩薩摩訶薩安住是法，精勤修\n習，則為已入諸佛種性，學佛行施；於諸佛所，\n生清淨信，增長善根；令諸乞者，皆得喜足；其\n心清淨，慶悅無量；心淨信解，照明佛法；發\n菩提意，安住捨心；諸根悅豫，功德增長；生\n善樂欲，常好修行廣大施行。菩薩爾時，以諸\n善根如是迴向，所謂：『願一切眾生得如來頭，\n得無見頂；於一切處無能映蔽，於諸佛剎最\n為上首；其髮右旋，光淨潤澤，卐字嚴飾，世\n所希有；具足佛首，成就智首，一切世間最\n第一首，為具足首，為清淨首，為坐道場圓滿\n智首。』是為菩薩摩訶薩布施頭時善根迴向；\n為令眾生得最勝法，成於無上大智慧故。\n「佛子！菩薩摩訶薩以其手、足施諸眾生，如常\n精進菩薩、無憂王菩薩，及餘無量諸菩薩等。\n於諸趣中種種生處布施手、足，以信為手，起\n饒益行；往返周旋，勤修正法，願得寶手以\n手為施；所行不空，具菩薩道，常舒其手擬將\n廣惠；安步遊行，勇猛無怯，以淨信力具精進\n行，除滅惡道，成就菩提。佛子！菩薩摩訶薩\n如是施時，以無量無邊廣大之心，開淨法門，\n\n入諸佛海；成就施手，周給十方；願力任持一\n切智道，住於究竟離垢之心；法身、智身無斷\n無壞，一切魔業不能傾動；依善知識堅固其\n心，同諸菩薩修行施度。佛子！菩薩摩訶薩\n為諸眾生求一切智，施手、足時，以諸善根如\n是迴向，所謂：『願一切眾生具神通力，皆得寶\n手；得寶手已，各相尊敬，生福田想，以種種寶\n更相供養；又以眾寶供養諸佛，興妙寶雲遍\n諸佛土，令諸眾生互起慈心，不相惱害；遊\n諸佛剎，安住無畏，自然具足究竟神通。又令\n皆得寶手、華手、香手、衣手、蓋手、華鬘手、末香\n手、莊嚴具手、無邊手、無量手、普手；得是手已，\n以神通力常勤往詣一切佛土，能以一手\n遍摩一切諸佛世界，以自在手持諸眾生，得\n妙相手放無量光，能以一手普覆眾生，成於\n如來手指網縵赤銅爪相。』菩薩爾時，以大願\n手普覆眾生：『願一切眾生志常樂求無上菩\n提，出生一切功德大海，見來乞者歡喜無厭，\n入佛法海同佛善根。』是為菩薩摩訶薩施手、\n足時善根迴向。「佛子！菩薩摩訶薩壞身出血\n布施眾生，如法業菩薩、善意王菩薩，及餘無\n量諸菩薩等。於諸趣中施身血時，起成就一\n切智心，起欣仰大菩提心，起樂修菩薩行心，\n起不取苦受心，起樂見乞者心，起不嫌來乞\n心，起趣向一切菩薩道心，起守護一切菩薩\n捨心，起增廣菩薩善施心，起不退轉心、不休\n息心、無戀己心；以諸善根如是迴向，所謂：『願\n一切眾生皆得成就法身、智身；願一切眾生\n得無勞倦身，猶如金剛；願一切眾生得不可\n\n壞身，無能傷害；願一切眾生得如變化身，普\n現世間無有盡極；願一切眾生得可愛樂身，\n淨妙堅固；願一切眾生得法界生身，同於如\n來無所依止；願一切眾生得如妙寶光明之\n身，一切世人無能映蔽；願一切眾生得智藏\n身，於不死界而得自在；願一切眾生得寶海\n身，見皆獲益，無空過者；願一切眾生得虛空\n身，世間惱患無能染著。』是為菩薩摩訶薩施\n身血時，以大乘心、清淨心、廣大心、欣悅心、慶幸\n心、歡喜心、增上心、安樂心、無濁心善根迴向。\n「佛子！菩薩摩訶薩見有乞求其身髓肉，歡喜\n軟語，謂乞者言：『我身髓肉，隨意取用。』如饒益\n菩薩、一切施王菩薩，及餘無量諸菩薩等。於\n諸趣中種種生處，以其髓肉施乞者時，歡喜\n廣大，施心增長；同諸菩薩修習善根，離世塵\n垢，得深志樂；以身普施，心無有盡；具足無量\n廣大善根，攝受一切妙功德寶，如菩薩法受\n行無厭；心常愛樂布施功德，一切周給，心無\n有悔；審觀諸法從緣無體，不貪施業及業果\n報；隨所會遇，平等施與。佛子！菩薩摩訶薩\n如是施時，一切諸佛皆悉現前，想之如父得\n護念故；一切眾生皆悉現前，普令安住清淨\n法故；一切世界皆悉現前，嚴淨一切佛國\n土故；一切眾生皆悉現前，以大悲心普救護\n故；一切佛道皆悉現前，樂觀如來十種力\n故；去、來、現在一切菩薩皆悉現前，同共圓滿\n諸善根故；一切無畏皆悉現前，能作最上師\n子吼故；一切三世皆悉現前，得平等智，普觀\n察故；一切世間皆悉現前，發廣大願，盡未來\n\n劫修菩提故；一切菩薩無疲厭行皆悉現\n前，發無數量廣大心故。佛子！菩薩摩訶薩\n施髓肉時，以此善根如是迴向，所謂：『願一切\n眾生得金剛身，不可沮壞；願一切眾生得堅\n密身，恒無缺減；願一切眾生得意生身，猶如\n佛身，莊嚴清淨；願一切眾生得百福相身，三\n十二相而自莊嚴；願一切眾生得八十種好\n妙莊嚴身，具足十力，不可斷壞；願一切眾生\n得如來身，究竟清淨，不可限量；願一切眾生\n得堅固身，一切魔怨所不能壞；願一切眾生\n得一相身，與三世佛同一身相；願一切眾生\n得無礙身，以淨法身遍虛空界；願一切眾生\n得菩提藏身，普能容納一切世間。』是為菩薩\n摩訶薩求一切智施髓肉時善根迴向，為令\n眾生皆得如來究竟清淨無量身故。「佛子！\n菩薩摩訶薩以心布施諸來乞者，如無悔厭\n菩薩、無礙王菩薩，及餘無量諸大菩薩。以其\n自心施乞者時，學自在施心，修一切施心，習\n行檀波羅蜜心，成就檀波羅蜜心，學一切菩\n薩布施心、一切悉捨無盡心、一切悉施慣習\n心、荷負一切菩薩施行心、正念一切諸佛現\n前心、供養一切諸來乞者無斷絕心。菩薩摩\n訶薩如是施時，其心清淨，為度一切諸眾生\n故，為得十力菩提處故，為依大願而修行故，\n為欲安住菩薩道故，為欲成就一切智故，為\n不捨離本誓願故，以諸善根如是迴向，所謂：\n『願一切眾生得金剛藏心，一切金剛圍山等\n所不能壞；願一切眾生得卐相莊嚴金剛界\n心，得無能動搖心，得不可恐怖心，得利益世\n\n間常無盡心，得大勇猛幢智慧藏心，得如那\n羅延堅固幢心，得如眾生海不可盡心，得那\n羅延藏無能壞心，得滅諸魔業、魔軍眾心，得\n無所畏心，得大威德心，得常精進心，得大\n勇猛心，得不驚懼心，得被金剛甲冑心，得諸\n菩薩最上心，得成就佛法菩提光明心，得菩\n提樹下坐安住一切諸佛正法離諸迷惑成一\n切智心，得成就十力心。』是為菩薩摩訶薩布\n施心時善根迴向；為令眾生不染世間，具足\n如來十力心故。「佛子！菩薩摩訶薩若有乞求\n腸、腎、肝、肺，悉皆施與，如善施菩薩、降魔自在\n王菩薩，及餘無量諸大菩薩。行此施時，見乞\n者來，其心歡喜，以愛眼觀；為求菩提，隨其所\n須，悉皆施與，心不中悔。觀察此身無有堅\n固：『我應施彼，取堅固身。』復念此身尋即敗\n壞，見者生厭，狐、狼、餓狗之所噉食；此身無常，\n會當棄捨，為他所食，無所覺知。佛子！菩薩摩\n訶薩作是觀時，知身無常、穢污之極，於法解\n悟生大歡喜，敬心諦視彼來乞者，如善知\n識而來護想，隨所乞求無不惠施，以不堅\n身易堅固身。佛子！菩薩摩訶薩如是施時，\n所有善根悉以迴向：『願一切眾生得智藏身，\n內外清淨；願一切眾生得福藏身，能普任\n持一切智願；願一切眾生得上妙身，內蘊妙\n香，外發光明；願一切眾生得腹不現身，上下\n端直，肢節相稱；願一切眾生得智慧身，以\n佛法味充悅滋長；願一切眾生得無盡身，修\n習安住甚深法性；願一切眾生得陀羅尼清\n淨藏身，以妙辯才顯示諸法；願一切眾生得\n\n清淨身，若身若心內外俱淨；願一切眾生得\n如來智深觀行身，智慧充滿，雨大法雨；願一\n切眾生得內寂身，外為眾生作智幢王，放大\n光明普照一切。』是為菩薩摩訶薩施腸、腎、肝、\n肺善根迴向；為令眾生內外清淨，皆得安住\n無礙智故。「佛子！菩薩摩訶薩布施乞者肢\n節諸骨，如法藏菩薩、光明王菩薩，及餘無量\n諸大菩薩。施其身分肢節骨時，見乞者來，\n生愛樂心、歡喜心、淨信心、安樂心、勇猛心、\n慈心、無礙心、清淨心、隨所乞求皆施與心。菩\n薩摩訶薩施身骨時，以諸善根如是迴向，所\n謂：『願一切眾生得如化身，不復更受骨肉血\n身；願一切眾生得金剛身，不可破壞，無能勝\n者；願一切眾生得一切智圓滿法身，於無縛、\n無著、無繫界生；願一切眾生得智力身，諸根\n圓滿，不斷不壞；願一切眾生得法力身，智力\n自在，到於彼岸；願一切眾生得堅固身，其身\n貞實，常無散壞；願一切眾生得隨應身，教化\n調伏一切眾生；願一切眾生得智熏身，具那\n羅延肢節大力；願一切眾生得堅固相續\n不斷絕身，永離一切疲極勞倦；願一切眾生\n得大力安住身，悉能具足精進大力；願一切\n眾生得遍世間平等法身，住於無量最上智\n處；願一切眾生得福德力身，見者蒙益，遠離\n眾惡；願一切眾生得無依處身，皆得具足無\n依著智；願一切眾生得佛攝受身，常為一切\n諸佛加護；願一切眾生得普饒益諸眾生身，\n悉能遍入一切諸道；願一切眾生得普現身，\n普能照現一切佛法；願一切眾生得具足精\n\n進身，專念勤修大乘智行；願一切眾生得離\n我慢貢高清淨身，智常安住，無所動亂；願一\n切眾生得堅固行身，成就大乘一切智業；願\n一切眾生得佛家身，永離世間一切生死。』是\n為菩薩摩訶薩施身骨時善根迴向，為令眾\n生得一切智永清淨故。「佛子！菩薩摩訶薩\n見有人來，手執利刀，乞其身皮；心生歡喜，諸\n根悅豫，譬如有人惠以重恩，逢迎引納，敷座\n令坐，曲躬恭敬而作是念：『此來乞者甚為難\n遇，斯欲滿我一切智願，故來求索饒益於我。』\n歡喜和顏而語之言：『我今此身一切皆捨，所\n須皮者，隨意取用。』猶如往昔清淨藏菩薩、金\n脇鹿王菩薩，及餘無量諸大菩薩，等無有異。\n菩薩爾時，以諸善根如是迴向，所謂：『願一切\n眾生得微細皮，猶如如來色相清淨，見者無\n厭；願一切眾生得不壞皮，猶如金剛，無能壞\n者；願一切眾生得金色皮，如閻浮檀上妙真\n金，清淨明潔；願一切眾生得無量色皮，隨其\n心樂，現清淨色；願一切眾生得淨妙色皮，具\n足沙門善軟清淨如來色相；願一切眾生得\n第一色皮，自性清淨，色相無比；願一切眾生\n成就如來清淨色皮，以諸相好而自莊嚴；願\n一切眾生得妙色皮，放大光明普照一切；願\n一切眾生得明網皮，如世高幢，放不可說圓\n滿光明；願一切眾生得潤澤色皮，一切色相\n悉皆清淨。』是為菩薩摩訶薩施身皮時善根\n迴向；為令眾生皆得一切嚴淨佛剎，具足如\n來大功德故。「佛子！菩薩摩訶薩以手足指\n施諸乞者，如堅精進菩薩、閻浮提自在王菩\n\n薩，及餘無量諸大菩薩。菩薩爾時，顏貌和\n悅，其心安善，無有顛倒，乘於大乘，不求美\n欲，不尚名聞，但發菩薩廣大之意，遠離慳\n嫉一切諸垢，專向如來無上妙法。佛子！菩\n薩摩訶薩如是施時，攝諸善根，悉以迴向：『願\n一切眾生得纖長指，與佛無異；願一切眾生\n得𦟛圓指，上下相稱；願一切眾生得赤銅甲\n指，其甲隆起，清淨鑒徹；願一切眾生得一切\n智勝丈夫指，悉能攝持一切諸法；願一切眾\n生得隨好指，具足十力；願一切眾生得大\n人指，纖𦟛齊等；願一切眾生得輪相指，指節\n圓滿，文相右旋；願一切眾生得如蓮華卐\n字旋指，十力業報相好莊嚴；願一切眾生得\n光藏指，放大光明照不可說諸佛世界；願一\n切眾生得善安布指，善巧分布網縵具足。』是\n為菩薩摩訶薩布施指時善根迴向，為令眾\n生一切皆得心清淨故。「佛子！菩薩摩訶薩請\n求法時，若有人言：『汝能施我連肉爪甲，當與\n汝法。』菩薩答言：『但與我法。連肉爪甲，隨意取\n用。』如求法自在王菩薩、無盡菩薩，及餘無\n量諸大菩薩，為求法故，欲以正法，開示演\n說，饒益眾生，一切皆令得滿足故，捨連肉爪\n甲與諸乞者。菩薩爾時，以此善根如是迴\n向，所謂：『願一切眾生皆得諸佛赤銅相爪；願\n一切眾生得潤澤爪，隨好莊嚴；願一切眾生\n得光淨爪，鑒徹第一；願一切眾生得一切智\n爪，具大人相；願一切眾生得無比爪，於諸世\n間無所染著；願一切眾生得妙莊嚴爪，光明\n普照一切世間；願一切眾生得不壞爪，清淨\n\n無缺；願一切眾生得入一切佛法方便相爪，\n廣大智慧皆悉清淨；願一切眾生得善生爪，\n菩薩業果無不淨妙；願一切眾生得一切智\n大導師爪，放無量色妙光明藏。』是為菩薩摩\n訶薩為求法故施連肉爪甲時善根迴向，為\n令眾生具足諸佛一切智爪無礙力故。「佛子！\n菩薩摩訶薩求佛法藏，恭敬尊重，生難得想。\n有能說者來語之言：『若能投身七仞火阬，\n當施汝法。』菩薩聞已，歡喜踊躍，作是思惟：『我\n為法故，尚應久住阿鼻獄等一切惡趣受無\n量苦，何況纔入人間火阬即得聞法？奇哉！\n正法甚為易得，不受地獄無量楚毒，但入火\n阬即便得聞。但為我說，我入火阬。』如求善\n法王菩薩、金剛思惟菩薩，為求法故，入火阬\n中。菩薩爾時，以此善根如是迴向，所謂：『願一\n切眾生住佛所住一切智法，永不退轉無上\n菩提；願一切眾生離諸險難，受佛安樂；願一\n切眾生得無畏心，離諸恐怖；願一切眾生常\n樂求法，具足喜樂，眾法莊嚴；願一切眾生離\n諸惡趣，滅除一切三毒熾火；願一切眾生常\n得安樂，具足如來勝妙樂事；願一切眾生得\n菩薩心，永離一切貪、恚、癡火；願一切眾生悉\n得菩薩諸三昧樂，普見諸佛，心大歡喜；願一\n切眾生善說正法，於法究竟，常無忘失；願一\n切眾生具足菩薩神通妙樂，究竟安住一切\n種智。』是為菩薩摩訶薩為求正法投火阬時\n善根迴向；為令眾生離障礙業，皆得具足智\n慧火故。「佛子！菩薩摩訶薩為求正法，分別演\n說，開菩薩道，示菩提路，趣無上智，勤修十\n\n力，廣一切智心，獲無礙智法，令眾生清淨住\n菩薩境界。勤修大智護佛菩提時，以身具受\n無量苦惱，如求善法菩薩、勇猛王菩薩，及餘\n無量諸大菩薩。為求法故，受無量苦，乃至攝\n取誹謗正法、惡業所覆、魔業所持極大惡人；\n彼所應受一切苦惱，以求法故，悉皆為受。以\n此善根如是迴向，所謂：『願一切眾生永離一\n切苦惱逼迫，成就安樂自在神通；願一切眾\n生永離諸苦，得一切樂；願一切眾生永滅苦\n蘊，得照現身，恒受安樂；願一切眾生超出苦\n獄，成就智行；願一切眾生見安隱道，離諸惡\n趣；願一切眾生得法喜樂，永斷眾苦；願一切\n眾生永拔眾苦，互相慈愛，無損害心；願一切\n眾生得諸佛樂，離生死苦；願一切眾生成就\n清淨無比安樂，一切苦惱無能損害；願一切\n眾生得一切勝樂，究竟具足佛無礙樂。』是為\n菩薩摩訶薩為求法故受眾苦時善根迴向；\n為欲救護一切眾生，令離險難，住一切智無\n所障礙解脫處故。「佛子！菩薩摩訶薩處於王\n位求正法時，乃至但為一文、一字、一句、一義\n生難得想，能悉罄捨海內所有若近若遠國\n土、城邑、人民、庫藏、園池、屋宅、樹林、華果，乃至\n一切珍奇妙物、宮殿樓閣、妻子眷屬，及以王\n位，悉能捨之。於不堅中求堅固法，為欲利益\n一切眾生，勤求諸佛無礙解脫究竟清淨一\n切智道，如大勢德菩薩、勝德王菩薩，及餘無\n量諸大菩薩。勤求正法，乃至極少，為於一\n字，五體投地；正念三世一切佛法，愛樂修\n習；永不貪著名聞利養，捨諸世間自在王\n\n位，求佛自在法王之位；於世間樂心無所\n著，以出世法長養其心；永離世間一切戲\n論，住於諸佛無戲論法。菩薩爾時，以諸善根\n如是迴向，所謂：『願一切眾生常樂惠施，一\n切悉捨；願一切眾生能捨所有，心無中悔；願\n一切眾生常求正法，不惜身命、資生之具；願\n一切眾生悉得法利，能斷一切眾生疑惑；願\n一切眾生得善法欲，心常喜樂諸佛正法；願\n一切眾生為求佛法，能捨身命及以王位，大\n心修習無上菩提；願一切眾生尊重正法，常\n深愛樂，不惜身命；願一切眾生護持諸佛甚\n難得法，常勤修習；願一切眾生皆得諸佛菩\n提光明，成菩提行，不由他悟；願一切眾生常\n能觀察一切佛法，拔除疑箭，心得安隱。』是為\n菩薩摩訶薩為求正法捨國城時善根迴向；\n為令眾生知見圓滿，常得住於安隱道故。「佛\n子！菩薩摩訶薩作大國王，於法自在，普行\n教命，令除殺業；閻浮提內城邑聚落一切屠\n殺，皆令禁斷；無足、二足、四足、多足，種種生類，\n普施無畏無欺奪心，廣修一切菩薩諸行，仁\n慈莅物，不行侵惱，發妙寶心，安隱眾生；於諸\n佛所立深志樂，常自安住三種淨戒，亦令眾\n生如是安住。菩薩摩訶薩令諸眾生住於五\n戒，永斷殺業；以此善根如是迴向，所謂：『願一\n切眾生發菩薩心，具足智慧，永保壽命，無有\n終盡；願一切眾生住無量劫，供一切佛，恭敬\n勤修，更增壽命；願一切眾生具足修行，離老\n死法，一切災毒不害其命；願一切眾生具\n足成就無病惱身，壽命自在，能隨意住；願一\n\n切眾生得無盡命，窮未來劫住菩薩行，教化\n調伏一切眾生；願一切眾生為壽命門，十力\n善根於中增長；願一切眾生善根具足，得無\n盡命，成滿大願；願一切眾生悉見諸佛供養\n承事，住無盡壽，修集善根；願一切眾生於如\n來處善學所學，得聖法喜無盡壽命；願一切\n眾生得不老不病，常住命根，勇猛精進，入佛\n智慧。』是為菩薩摩訶薩住三聚淨戒永斷殺\n業善根迴向，為令眾生得佛十力圓滿智故。\n「佛子！菩薩摩訶薩見有眾生心懷殘忍，損諸\n人畜所有男形，令身缺減，受諸楚毒；見是事\n已，起大慈悲而哀救之，令閻浮提一切人民\n皆捨此業。菩薩爾時，語其人言：『汝何所為作\n是惡業？我有庫藏百千萬億，一切樂具悉皆\n充滿，隨汝所須盡當相給。汝之所作，眾罪由\n生，我今勸汝莫作是事。汝所作業不如道\n理，設有所獲，於何可用？損他益己，終無是\n處。如此惡行、諸不善法，一切如來所不稱\n歎。』作是語已，即以所有一切樂具盡皆施\n與。復以善語為說妙法，令其歡悅。所謂：示\n寂靜法，令其信受，滅除不善，修行淨業，互起\n慈心，不相損害。彼人聞已，永捨罪惡。菩薩爾\n時，以此善根如是迴向，所謂：『願一切眾生具\n丈夫形，成就如來馬陰藏相；願一切眾生具\n男子形，發勇猛心修諸梵行；願一切眾生具\n勇猛力，恒為主導，住無礙智，永不退轉；願一\n切眾生皆得具足大丈夫身，永離欲心，無所\n染著；願一切眾生悉得成就善男子法，智慧\n增長，諸佛所歎；願一切眾生普得具於大人\n\n之力，常能修習十力善根；願一切眾生永不\n失壞男子之形，常修福智未曾有法；願一切\n眾生於五欲中無著無縛，心得解脫，厭離三\n有，住菩薩行；願一切眾生成就第一智慧丈\n夫，一切宗信，伏從其化；願一切眾生具足菩\n薩丈夫智慧，不久當成無上大雄。』是為菩薩\n摩訶薩禁絕一切毀敗男形善根迴向；為令\n眾生具丈夫形，皆能守護諸善丈夫，生賢聖\n家，智慧具足，常勤修習丈夫勝行，有丈夫用，\n巧能顯示七丈夫道，具足諸佛善丈夫種、丈\n夫正教、丈夫勇猛、丈夫精進、丈夫智慧、丈夫\n清淨，普令眾生究竟皆得。\n大方廣佛華嚴經卷第二十七\n\n\n\n大方廣佛華嚴經卷第二十八\n\n于闐國三藏實叉難陀奉　制譯\n之六十迴向品第二十五之六\n「佛子！菩薩摩訶薩若見如來出興於世開演\n正法，以大音聲普告一切：『如來出世！如來出\n世！』令諸眾生得聞佛名，捨離一切我慢、戲論；\n復更勸導，令速見佛，令憶念佛，令歸向佛，令\n攀緣佛，令觀察佛，令讚歎佛；復為廣說佛難\n值遇，千萬億劫時乃一出。眾生由此得見於\n佛，生清淨信，踊躍歡喜，尊重供養；復於佛所\n聞諸佛名，轉更值遇無數諸佛，植諸善本，修\n習增長。爾時，無數百千萬億那由他眾生，因\n見佛故，皆得清淨究竟調伏。彼諸眾生於菩\n\n薩所，皆生最上善知識想；因菩薩故，成就佛\n法，以無數劫所種善根，普於世間施作佛\n事。佛子！菩薩摩訶薩開示眾生令見佛時，\n以諸善根如是迴向，所謂：『願一切眾生不待\n勸誘，自往見佛，承事供養，皆令歡喜；願一切\n眾生常樂見佛，心無廢捨；願一切眾生常勤\n修習廣大智慧，受持一切諸佛法藏；願一切\n眾生隨所聞聲皆悟佛法，於無量劫修菩薩\n行；願一切眾生安住正念，恒以智眼見佛出\n興；願一切眾生不念異業，常憶見佛，勤修十\n力；願一切眾生於一切處常見諸佛，了達\n如來遍虛空界；願一切眾生皆得具足佛自\n在身，普於十方成道說法；願一切眾生遇善\n知識，常聞佛法，於諸如來得不壞信；願一切\n眾生悉能稱歎諸佛出興，令其見者普得清\n淨。』是為菩薩摩訶薩歎佛出世善根迴向；為\n令眾生見一切佛供養承事，於無上法究竟\n清淨故。「佛子！菩薩摩訶薩捨於大地，或施諸\n佛，造立精舍；或施菩薩及善知識，隨意所\n用；或施眾僧，以為住處；或施父母，或施別\n人、聲聞、獨覺種種福田，乃至一切貧窮、孤\n露及餘四眾，隨意悉與，令無所乏；或施造\n立如來塔廟。於如是等諸處之中，悉為辦\n具資生什物，令隨意用，無所恐懼。菩薩摩\n訶薩隨何方所布施地時，以諸善根如是迴\n向，所謂：『願一切眾生具足清淨一切智地，悉\n到普賢眾行彼岸；願一切眾生得總持地，正\n念受持一切佛法；願一切眾生得住持力，常\n能守護一切佛教；願一切眾生得如地心，於\n\n諸眾生，意常清淨，無有惡念；願一切眾生持\n諸佛種，成就菩薩諸地次第，無有斷絕；願\n一切眾生普為一切作安隱處，悉令調伏，住\n清淨道；願一切眾生同諸如來利益世間，普\n使勤修安住佛力；願一切眾生普為世間之\n所愛樂，悉令安住無上佛樂；願一切眾生獲\n善方便，住佛諸力、無畏法中；願一切眾生得\n如地智，自在修行一切佛法。』是為菩薩摩訶\n薩施大地時善根迴向，為令眾生皆得究竟\n一切如來清淨地故。「佛子！菩薩摩訶薩布施\n僮僕，供養一切諸佛、菩薩、真善知識，或施僧\n寶，或奉父母尊勝福田；或復給施病苦眾生，\n令無闕乏，以存其命；或復施與貧窮、孤露，及\n餘一切無瞻侍者；或為守護如來塔廟，或為\n書持諸佛正法，以百千億那由他僕使，隨時\n給施。其諸僕使皆聰慧善巧，性自調順，常勤\n精進，無有懈惰，具質直心、安樂心、利益心、仁\n慈心、恭恪心、無怨恨心、無讎敵心，能隨受\n者方俗所宜，於彼彼中作諸利益；又皆從菩\n薩淨業所感，才能、技藝、工巧、算數靡不通達，\n善能供侍悅可其心。菩薩爾時，以諸善根如\n是迴向，所謂：『願一切眾生得調順心，一切佛\n所修習善根；願一切眾生隨順供養一切諸\n佛，於佛所說悉能聽受；願一切眾生得佛攝\n受，常觀如來，更無餘念；願一切眾生不壞佛\n種，勤修一切順佛善根；願一切眾生常勤供\n養一切諸佛，無空過時；願一切眾生攝持一\n切諸佛妙義，言辭清淨，遊行無畏；願一切\n眾生常樂見佛，心無厭足，於諸佛所不惜身\n\n命；願一切眾生得見諸佛，心無染著，離世所\n依；願一切眾生但歸於佛，永離一切邪歸依\n處；願一切眾生隨順佛道，心常樂觀無上佛\n法。』是為菩薩摩訶薩施僕使時善根迴向；為\n令眾生遠離塵垢，淨治佛地，能現如來自在\n身故。「佛子！菩薩摩訶薩以身布施諸來乞者，\n布施之時，生謙下心，生如地心，生忍受眾苦\n無變動心，生給侍眾生不疲厭心，生於諸眾\n生猶如慈母所有眾善悉迴與心，生於諸愚\n險極惡眾生種種侵陵皆寬宥心，安住善根，\n精勤給事。菩薩爾時，悉以善根如是迴向，所\n謂：『願一切眾生隨其所須常無闕乏，修菩薩\n行恒不間斷，不捨一切菩薩義利，善住菩薩\n所行之道，了達菩薩平等法性，得在如來種\n族之數，住真實語，持菩薩行，令諸世間得淨\n佛法，深心信解，證法究竟；令諸眾生出生清\n淨增上善根，住大功德，具一切智。又以此\n善根，令一切眾生常得供養一切諸佛，解一\n切法，受持讀誦不忘、不失、不壞、不散，心善調\n伏，不調令調，以寂靜法而調習之。令彼眾\n生於諸佛所住如是事。又以此善根，令一\n切眾生作第一塔，應受世間種種供養；令一\n切眾生成最上福田，得佛智慧，開悟一切；令\n一切眾生作最上受者，普能饒益一切眾生；\n令一切眾生成最上福利，能使具足一切善\n根；令一切眾生成第一好施處，能使獲得無\n量福報；令一切眾生於三界中皆得出離；令\n一切眾生作第一導師，能為世間示如實道；\n令一切眾生得妙總持，具持一切諸佛正法；\n\n令一切眾生證得無量第一法界，具足虛空\n無礙正道。』是為菩薩摩訶薩施自己身善根\n迴向，為令眾生皆得應供無量智身故。「佛子！\n菩薩摩訶薩聞法喜悅，生淨信心，能以其身\n供養諸佛，欣樂信解無上法寶，於諸佛所生\n父母想；讀誦受持無礙道法，普入無數那由\n他法、大智慧寶、諸善根門；心常憶念無量諸\n佛，入佛境界，深達義理；能以如來微密梵\n音，興佛法雲，雨佛法雨，勇猛自在；能分別說\n一切智人第一之地，具足成就薩婆若乘，以\n無量百千億那由他大法成滿諸根。佛子！菩\n薩摩訶薩於諸佛所聞如是法，歡喜無量，安\n住正法；自斷疑惑，亦令他斷；心恒怡暢，功德\n成滿；善根具足，意恒相續；利益眾生，心常不\n匱；獲最勝智，成金剛藏；親近諸佛，淨諸佛\n剎，常勤供養一切如來。菩薩爾時，以諸善根\n如是迴向，所謂：『願一切眾生皆得圓滿最勝\n之身，一切諸佛之所攝受；願一切眾生常近\n諸佛，依諸佛住，恒得覲仰，未曾遠離；願一切\n眾生皆得清淨不壞之身，具足一切功德智\n慧；願一切眾生常勤供養一切諸佛，行無所\n得究竟梵行；願一切眾生得無我身，離我、\n我所；願一切眾生悉能分身遍十方剎，猶\n如影現而無來往；願一切眾生得自在身，普\n往十方無我無受；願一切眾生從佛身生，處\n在如來無上身家；願一切眾生得法力身，忍\n辱大力無能壞者；願一切眾生得無比身，成\n就如來清淨法身；願一切眾生成就出世功\n德之身，生無所得清淨法界。』是為菩薩摩\n\n訶薩以身供佛善根迴向，為令眾生永住三\n世諸佛家故。「佛子！菩薩摩訶薩以身布施一\n切眾生，為欲普令成就善根，憶念善根，菩薩\n摩訶薩自願其身為大明燈，普能照耀一\n切眾生；為眾樂具，普能攝受一切眾生；為妙\n法藏，普能任持一切眾生；為淨光明，普能\n開曉一切眾生；為世光影，普令眾生常得覩\n見；為善根因緣，普令眾生常得值遇；為真善\n知識，令一切眾生悉蒙教誘；為平坦道，令一\n切眾生皆得履踐；為無有上具足安樂，令一\n切眾生離苦清淨；為明淨日，普作世間平等\n利益。菩薩爾時，以諸善根如是迴向，所謂：『願\n一切眾生常親近佛，入佛智地；願一切眾生\n得隨順智，住無上覺；願一切眾生常處佛會，\n意善調伏；願一切眾生所行有則，具佛威儀；\n願一切眾生悉得涅槃，深解法義；願一切眾\n生具知足行，生如來家；願一切眾生捨無明\n欲，住佛志樂；願一切眾生生勝善根，坐菩提\n樹；願一切眾生殺煩惱賊，離怨害心；願一切\n眾生具足護持一切佛法。』是為菩薩摩訶薩\n以身布施一切眾生善根迴向；為欲利益一\n切眾生，令得無上安隱處故。「佛子！菩薩摩訶\n薩自以其身給侍諸佛，於諸佛所念報重\n恩如父母想，於諸如來起深信樂；以清淨\n心，護佛菩提，住諸佛法；離世間想，生如來\n家；隨順諸佛，離魔境界；了達一切諸佛所\n行，成就一切諸佛法器。菩薩爾時，以此善根\n如是迴向，所謂：『願一切眾生得清淨心，一切\n智寶而自莊嚴；願一切眾生住善調伏，遠離\n\n一切諸不善業；願一切眾生得不可壞堅固\n眷屬，普能攝受諸佛正法；願一切眾生為佛\n弟子，到於菩薩灌頂之地；願一切眾生常為\n諸佛之所攝受，永離一切不善之法；願一切\n眾生隨順諸佛，修行菩薩最勝之法；願一切\n眾生入佛境界，悉皆得授一切智記；願一切\n眾生與諸如來皆悉平等，一切佛法無不自\n在；願一切眾生悉為諸佛之所攝受，常能修\n行無取著業；願一切眾生常為諸佛第一侍\n者，一切佛所修智慧行。』是為菩薩摩訶薩給\n侍諸佛善根迴向；為欲證得諸佛菩提，為欲\n救護一切眾生，為欲出離一切三界，為欲成\n就無損惱心，為得無量廣大菩提，為欲成就\n照佛法智，為欲常蒙諸佛攝受，為得諸佛之\n所護持，為欲信解一切佛法，為欲成就與三\n世佛平等善根，為欲圓滿無悔恨心，證得一\n切諸佛法故。「佛子！菩薩摩訶薩布施國土\n一切諸物，乃至王位悉亦能捨；於諸世事，心\n得自在，無繫、無縛、無所戀著；遠離惡業，饒益\n眾生；不著業果，不樂世法，不復貪染諸有生\n處；雖住世間，非此處生；心不執著蘊、界、處法，\n於內外法心無依住；常不忘失諸菩薩行，未\n曾遠離諸善知識；持諸菩薩廣大行願，常樂\n承事一切善友。菩薩爾時，以此善根如是迴\n向，所謂：『願一切眾生為大法王，於法自在，到\n於彼岸；願一切眾生成佛法王，摧滅一切煩\n惱怨賊；願一切眾生住佛王位，得如來智，開\n演佛法；願一切眾生住佛境界，能轉無上自\n在法輪；願一切眾生生如來家，於法自在，護\n\n持佛種，永使不絕；願一切眾生開示無量法\n王正法，成就無邊諸大菩薩；願一切眾生住\n淨法界，為大法王，現佛出興，相繼不斷；願一\n切眾生於諸世界作智慧王，化導群生無時\n暫捨；願一切眾生普為法界、虛空界等諸世\n界中一切眾生作法施主，使其咸得住於大\n乘；願一切眾生得成具足眾善之王，與三世\n佛善根齊等。』是為菩薩摩訶薩布施王位善\n根迴向；為欲令彼一切眾生，究竟住於安隱\n處故。「佛子！菩薩摩訶薩見有人來乞王京\n都、嚴麗大城及以關防所有輸稅，盡皆施\n與，心無吝惜；專向菩提發大誓願，住於大\n慈，行於大悲，志意歡悅，利益眾生；以廣大\n智解了深法，安住諸佛平等法性；發心為\n求一切智故，於自在法起深樂故，於自在\n智求證得故，淨修一切諸功德故，住於堅\n固廣大智故，廣集一切諸善根故，修行一\n切佛法願故，自然覺悟大智法故，安住菩提\n心無退故，修習一切菩薩行願、一切種智盡\n究竟故，而行布施。以此善根如是迴向，所謂：\n『願一切眾生悉能嚴淨無量剎土，奉施諸佛\n以為住處；願一切眾生常樂居止阿蘭若處，\n寂靜不動；願一切眾生永不依止王都聚落，\n心樂寂靜，永得究竟；願一切眾生永不樂著\n一切世間，於世語言常樂遠離；願一切眾生\n得離貪心，施諸所有，心無中悔；願一切眾生\n得出離心，捨諸家業；願一切眾生得無吝心，\n常行惠施；願一切眾生得不著心，離居家法；\n願一切眾生得離眾苦，除滅一切災橫怖\n\n畏；願一切眾生嚴淨十方一切世界，奉施諸\n佛。』是為菩薩摩訶薩布施王都善根迴向，為\n令眾生悉能嚴淨諸佛剎故。「佛子！菩薩摩訶\n薩所有一切內宮眷屬、妓侍眾女，皆顏貌端\n正、才能具足，談笑歌舞悉皆巧妙，種種衣\n服、種種華香而以嚴身，見者歡喜，情無厭\n足。如是寶女百千萬億那由他數，皆由菩\n薩善業所生，隨意自在，敬順無失；盡以布\n施諸來乞者，而於其中無愛樂心、無顧戀心、\n無耽著心、無繫縛心、無執取心、無貪染心、無\n分別心、無隨逐心、無取相心、無樂欲心。菩薩\n爾時，觀諸善根，為欲令一切眾生咸得出離\n故迴向，得佛法喜故迴向，於不堅固中而得\n堅固故迴向，得金剛智不可壞心故迴向，入\n佛道場故迴向，到於彼岸故迴向，得無上菩\n提心故迴向，能以智慧了達諸法故迴向，出\n生一切善根故迴向，入三世諸佛家故迴向。\n佛子！菩薩摩訶薩住如是法，生如來家；增長\n諸佛清淨勝因，出生最勝一切智道；深入菩\n薩廣大智業，滅除一切世間垢惱，常能供施\n功德福田；為諸眾生宣說妙法，善巧安立，令\n其修習諸清淨行，常勤攝取一切善根。菩薩\n爾時，以諸善根如是迴向，所謂：『願一切眾生\n常得無量三昧眷屬，菩薩勝定相續不斷；願\n一切眾生常樂見佛，悉入諸佛莊嚴三昧；願\n一切眾生成就菩薩不思議定，自在遊戲無\n量神通；願一切眾生入如實定，得不壞心；願\n一切眾生盡獲菩薩甚深三昧，於諸禪定而\n得自在；願一切眾生得解脫心，成就一切三\n\n昧眷屬；願一切眾生種種三昧皆得善巧，悉\n能攝取諸三昧相；願一切眾生得勝智三昧，\n普能學習諸三昧門；願一切眾生得無礙三\n昧，入深禪定終不退失；願一切眾生得無\n著三昧，心恒正受，不取二法。』是為菩薩摩訶\n薩布施一切內宮眷屬時善根迴向；為欲令\n一切眾生皆得不壞清淨眷屬故；為欲令一\n切眾生皆得菩薩眷屬故；為欲令一切眾生\n悉得滿足佛法故；為欲令一切眾生滿足一\n切智力故；為欲令一切眾生證於無上智慧\n故；為欲令一切眾生得於隨順眷屬故；為欲\n令一切眾生得同志行人共居故；為欲令一\n切眾生具足一切福智故；為欲令一切眾生\n成就清淨善根故；為欲令一切眾生得善和\n眷屬故；為欲令一切眾生成就如來清淨法\n身故；為欲令一切眾生成就次第如理辯才，\n善說諸佛無盡法藏故；為欲令一切眾生永\n捨一切世俗善根，同修出世清淨善根故；為\n欲令一切眾生淨業圓滿，成就一切清淨法\n故；為欲令一切眾生一切佛法皆悉現前，以\n法光明普嚴淨故。「佛子！菩薩摩訶薩能以所\n愛妻子布施，猶如往昔須達拏太子、現莊嚴\n王菩薩，及餘無量諸菩薩等。菩薩爾時，乘薩\n婆若心，行一切施，淨修菩薩布施之道。其心\n清淨，無有中悔，罄捨所珍，求一切智；令諸眾\n生淨深志樂，成菩提行，觀菩薩道，念佛菩提，\n住佛種性。菩薩摩訶薩成辦如是布施心\n已，決定志求如來之身；自觀己身，繼屬一\n切，不得自在；又以其身普攝眾生，猶如寶\n\n洲給施一切，未滿足者令其滿足。菩薩如\n是護念眾生，欲令自身作第一塔，普使一\n切皆生歡喜；欲於世間生平等心；欲為眾\n生作清涼池；欲與眾生一切安樂；欲為眾\n生作大施主；智慧自在，了知菩\n\n### （续前·回向⑨⑩＋重頌）\n\n薩所行之\n行，而能如是大誓莊嚴；趣一切智，願成無\n上智慧福田；普念眾生，常隨守護，而能成\n辦自身利益；智慧光明普照於世，常勤憶\n念菩薩施心，恒樂觀察如來境界。佛子！菩薩\n摩訶薩以無縛無著解脫心布施妻子所集\n善根，如是迴向，所謂：『願一切眾生住佛菩提，\n起變化身，周遍法界轉不退輪；願一切眾生\n得無著身，願力周行一切佛剎；願一切眾生\n捨愛憎心，斷貪恚結；願一切眾生為諸佛子，\n隨佛所行；願一切眾生於諸佛所，生自己心，\n不可沮壞；願一切眾生常為佛子，從法化生；\n願一切眾生得究竟處，成就如來自在智慧；\n願一切眾生證佛菩提，永離煩惱；願一切眾\n生能具演說佛菩提道，常樂修行無上法施；\n願一切眾生得正定心，不為一切諸緣所壞；\n願一切眾生坐菩提樹，成最正覺，開示無量\n從法化生諸善男女。』是為菩薩摩訶薩布施\n妻子善根迴向，為令眾生皆悉證得無礙解\n脫無著智故。「佛子！菩薩摩訶薩莊嚴舍宅\n及諸資具，隨有乞求，一切施與，行布施法；於\n家無著，遠離一切居家覺觀，厭惡家業、資生\n之具，不貪不味，心無繫著；知家易壞，心恒厭\n捨，都於其中無所愛樂；但欲出家修菩薩\n行，以諸佛法而自莊嚴；一切悉捨，心無中\n\n悔，常為諸佛之所讚歎；舍宅、財物，隨處所有，\n悉以惠施，心無戀著；見有乞求，心生喜慶。菩\n薩爾時，以此善根如是迴向，所謂：『願一切眾\n生捨離妻子，成就出家第一之樂；願一切眾\n生解脫家縛，入於非家，諸佛法中修行梵\n行；願一切眾生捨離慳垢，樂一切施，心無\n退轉；願一切眾生永離家法，少欲知足，無所\n藏積；願一切眾生出世俗家，住如來家；願一\n切眾生得無礙法，滅除一切障礙之道；願一\n切眾生離家屬愛，雖現居家，心無所著；願一\n切眾生善能化誘，不離家法，說佛智慧；願一\n切眾生身現在家，心常隨順佛智而住；願一\n切眾生在居家地，住於佛地，普令無量無邊\n眾生發歡喜心。』是為菩薩摩訶薩布施舍宅\n時善根迴向，為令眾生成就菩薩種種行願\n神通智故。「佛子！菩薩摩訶薩布施種種園林、\n臺榭、遊戲快樂莊嚴之處，作是念言：『我當為\n一切眾生作好園林，我當為一切眾生示現\n法樂，我當施一切眾生歡喜之意，我當示一\n切眾生無邊喜樂，我當為一切眾生開淨法\n門，我當令一切眾生發歡喜心，我當令一切\n眾生得佛菩提，我當令一切眾生成滿大願，\n我當於一切眾生猶如慈父，我當令一切眾\n生智慧觀察，我當施一切眾生資生之具，我\n當於一切眾生猶如慈母，生長一切善根大\n願。』佛子！菩薩摩訶薩如是修行諸善根時，於\n惡眾生不生疲厭，亦不誤起棄捨之心。設滿\n世間一切眾生悉不知恩，菩薩於彼，初無嫌\n恨，不生一念求反報心，但欲滅其無量苦惱；\n\n於諸世間，心如虛空，無所染著，普觀諸法真\n實之相；發大誓願，滅眾生苦，永不厭捨大乘\n志願；滅一切見，修諸菩薩平等行願。佛子！菩\n薩摩訶薩如是觀察已，攝諸善根，悉以迴向，\n所謂：『願一切眾生念念滋生無量善法，成就\n無上園林之心；願一切眾生得不動法，見一\n切佛皆令歡喜；願一切眾生樂法園苑，得諸\n佛剎園苑妙樂；願一切眾生得淨妙心，常見\n如來神足園林；願一切眾生得佛戲樂，常善\n遊戲智慧境界；願一切眾生得遊戲樂，普詣\n佛剎道場眾會；願一切眾生成就菩薩解脫\n遊戲，盡未來劫，行菩薩行，心無疲倦；願一切\n眾生見一切佛充滿法界，發廣大心，住佛園\n林；願一切眾生悉能遍往一切佛剎，一一剎\n中供養諸佛；願一切眾生得善欲心，清淨莊\n嚴一切佛剎。』是為菩薩摩訶薩布施一切園林、\n臺榭善根迴向；為令眾生見一切佛，遊戲一\n切佛園林故。「佛子！菩薩摩訶薩作百千億那\n由他無量無數廣大施會，一切清淨，諸佛\n印可，終不損惱於一眾生；普令眾生遠離眾\n惡，淨三業道，成就智慧；開置無量百千億那\n由他阿僧祇清淨境界，積集無量百千億那\n由他阿僧祇資生妙物，發甚難得菩提之心，\n行無限施，令諸眾生住清淨道，初、中、後善，生\n淨信解；隨百千億無量眾生心之所樂，悉令\n歡喜，以大慈悲救護一切，承事供養三世諸\n佛；為欲成就一切佛種，修行布施，心無中悔，\n增長信根，成滿勝行，念念增進檀波羅蜜。菩\n薩爾時，以諸善根如是迴向，所謂：『願一切眾\n\n生發大乘心，悉得成就摩訶衍施；願一切眾\n生皆悉能行大會施、盡施、善施、最勝施、無上\n施、最無上施、無等等施、超諸世間施、一切諸\n佛所稱歎施；願一切眾生作第一施主，於諸\n惡趣免濟眾生，皆令得入無礙智道，修平\n等願如實善根，得無差別證自境智；願一切\n眾生安住寂靜諸禪定智，入不死道，究竟一\n切神通智慧，勇猛精進，具足諸地，莊嚴佛法，\n到於彼岸，永不退轉；願一切眾生設大施會，\n終不疲厭，給濟眾生，無有休息，究竟無上一\n切種智；願一切眾生恒勤種植一切善根，到\n於無量功德彼岸；願一切眾生常蒙諸佛之\n所稱歎，普為世間作大施主，功德具足，充滿\n法界，遍照十方，施無上樂；願一切眾生設大\n施會，廣集善根，等攝眾生，到於彼岸；願一切\n眾生成最勝施，普令眾生住第一乘；願一切\n眾生為應時施，永離非時，大施究竟；願一切\n眾生成就善施，到佛丈夫大施彼岸；願一切\n眾生究竟常行大莊嚴施，盡以一切諸佛為\n師，悉皆親近，興大供養；願一切眾生住清\n淨施，集等法界無量福德，到於彼岸；願一切\n眾生於諸世間為大施主，誓度群品，住如來\n地。』是為菩薩摩訶薩設大施會善根迴向，為\n令眾生行無上施、究竟佛施、成就善施、不可\n壞施、供諸佛施、無恚恨施、救眾生施、成一切\n智施、常見諸佛施、善精進施、成就一切菩薩\n功德諸佛智慧廣大施故。「佛子！菩薩摩訶薩\n布施一切資生之物，心無貪惜，不求果報；於\n世富樂無所希望，離妄想心，善思惟法；為欲\n\n利益一切眾生，審觀一切諸法實性；隨諸眾\n生種種不同，所用所求各各差別，成辦無\n量資生之具，所有嚴飾悉皆妙好；行無邊\n施，行一切施，盡內外施；行此施時，增志樂\n力，獲大功德，成就心寶；常能守護一切眾\n生，皆令發生殊勝志願，初未曾有求反報\n心；所有善根等三世佛，悉以圓滿一切種\n智。佛子！菩薩摩訶薩以此布施所有善根\n迴向眾生：『願一切眾生清淨調伏；願一切眾\n生滅除煩惱，嚴淨一切諸佛剎土；願一切眾\n生以清淨心，於一念中周遍法界；願一切眾\n生智慧充滿虛空法界；願一切眾生得一切\n智，普入三世調伏眾生，於一切時常轉清淨\n不退法輪；願一切眾生具一切智，善能示現\n神通方便，饒益眾生；願一切眾生悉能悟入\n諸佛菩提，盡未來劫，於十方界，常說正法，\n曾無休息，令諸眾生普得聞知；願一切眾生\n於無量劫修菩薩行，悉得圓滿；願一切眾生\n於一切世界若染、若淨、若小、若大、若麁、若細、\n若覆、若仰，或一莊嚴，或種種莊嚴所可演說，\n在世界數諸世界中，修菩薩行靡不周遍；願\n一切眾生於念念中常作三世一切佛事，教\n化眾生向一切智。』「佛子！菩薩摩訶薩隨諸眾\n生一切所須，以如是等阿僧祇物而為給\n施；為令佛法相續不斷，大悲普救一切眾\n生；安住大慈，修菩薩行；於佛教誨終無違\n犯，以巧方便修行眾善，不斷一切諸佛種\n性；隨求悉與而無患厭，一切悉捨未曾中\n悔，常勤迴向一切智道。時，十方國土種種形\n\n類、種種趣生、種種福田，皆來集會，至菩薩\n所，種種求索。菩薩見已，普皆攝受；心生歡\n喜，如見善友；大悲哀愍，思滿其願；捨心增\n長，無有休息，亦不疲厭；隨其所求，悉令滿\n足，離貧窮苦。時，諸乞者心大欣慶，轉更稱\n傳，讚揚其德，美聲遐布，悉來歸往。菩薩見\n已，歡喜無量；假使百千億那由他劫受帝釋\n樂，無數劫受夜摩天樂，無量劫受兜率陀\n天樂，無邊劫受善變化天樂，無等劫受他化\n自在天樂，不可數劫受梵王樂，不可稱劫受\n轉輪王王三千樂，不可思劫受遍淨天樂，不\n可說劫受淨居天樂，悉不能及。菩薩摩訶薩\n見乞者來，歡喜愛樂，欣慶踊躍，信心增長，志\n樂清淨，諸根調順，信解成滿，乃至增進諸佛\n菩提。佛子！菩薩摩訶薩以此善根，為欲利益\n一切眾生故迴向，為欲安樂一切眾生故迴\n向，為令一切眾生得大義利故迴向，為令一\n切眾生悉得清淨故迴向，為令一切眾生悉\n求菩提故迴向，為令一切眾生悉得平等故\n迴向，為令一切眾生悉得賢善心故迴向，為\n令一切眾生悉入摩訶衍故迴向，為令一切\n眾生悉得賢善智慧故迴向，為令一切眾生\n悉具普賢菩薩行願滿十力乘現成正覺故\n迴向。\n「佛子！菩薩摩訶薩以諸善根如是迴向時，身、\n口、意業皆悉解脫，無著無繫，無眾生想，無命\n者想，無補伽羅想，無人想，無童子想，無生者\n想，無作者想，無受者想，無有想，無無想，無\n今世、後世想，無死此生彼想，無常想，無無常\n\n想，無三有想，無無三有想，非想非非想。如\n是，非縛迴向，非縛解迴向；非業迴向，非業報\n迴向；非分別迴向，非無分別迴向；非思迴向，\n非思已迴向；非心迴向，非無心迴向。佛子！菩\n薩摩訶薩如是迴向時，不著內，不著外；不著\n能緣，不著所緣；不著因，不著果；不著法，不\n著非法；不著思，不著非思；不著色，不著色\n生，不著色滅；不著受、想、行、識，不著受、想、行、識\n生，不著受、想、行、識滅。佛子！菩薩摩訶薩若能\n於此諸法不著，則不縛色，不縛色生，不縛色\n滅；不縛受、想、行、識，不縛受、想、行、識生，不縛受、\n想、行、識滅。若能於此諸法不縛，則亦於諸法\n不解。何以故？無有少法，若現生、若已生、若\n當生；無法可取，無法可著。一切諸法自相如\n是，無有自性，自性相離，非一、非二，非多、非無\n量，非小、非大，非狹、非廣，非深、非淺，非寂靜、非\n戲論，非處、非非處，非法、非非法，非體、非非體，\n非有、非非有。菩薩如是觀察諸法，則為非法；\n於言語中隨世建立，非法為法；不斷諸業道，\n不捨菩薩行，求一切智終無退轉；了知一切\n業緣如夢，音聲如響，眾生如影，諸法如幻，而\n亦不壞因緣業力；了知諸業其用廣大，解一\n切法皆無所作，行無作道未甞暫廢。「佛子！\n此菩薩摩訶薩住一切智，若處、非處，普皆迴\n向一切智性；於一切處皆悉迴向，無有退轉。\n以何義故說名迴向？永度世間至於彼岸，故\n名迴向；永出諸蘊至於彼岸，故名迴向；度言\n語道至於彼岸，故名迴向；離種種想至於彼\n岸，故名迴向；永斷身見至於彼岸，故名迴\n\n向；永離依處至於彼岸，故名迴向；永絕所\n作至於彼岸，故名迴向；永出諸有至於彼\n岸，故名迴向；永捨諸取至於彼岸，故名迴\n向；永出世法至於彼岸，故名迴向。佛子！菩\n薩摩訶薩如是迴向時，則為隨順佛住，隨順\n法住，隨順智住，隨順菩提住，隨順義住，隨順\n迴向住，隨順境界住，隨順行住，隨順真實住，\n隨順清淨住。佛子！菩薩摩訶薩如是迴向，則\n為了達一切諸法，則為承事一切諸佛；無有\n一佛而不承事，無有一法而不供養；無有一\n法而可滅壞，無有一法而可乖違；無有一物\n而可貪著，無有一法而可厭離；不見內外一\n切諸法，有少滅壞，違因緣道；法力具足，無有\n休息。「佛子！是為菩薩摩訶薩第六隨順堅固\n一切善根迴向。菩薩摩訶薩住此迴向時，常\n為諸佛之所護念，堅固不退，入深法性，修一\n切智；隨順法義，隨順法性，隨順一切堅固善\n根，隨順一切圓滿大願；具足隨順堅固之法，\n一切金剛所不能壞，於諸法中而得自在。」\n爾時，金剛幢菩薩觀察十方、觀察眾會、觀察\n法界已，入於字句甚深之義，修習無量廣大\n之心，以大悲心普覆世間，長去、來、今佛種性\n心，入於一切諸佛功德，成就諸佛自在力身，\n觀諸眾生心之所樂，隨其善根所可成熟，依\n法性身為現色身，承佛神力而說頌言：\n「菩薩現身作國王，於世位中最無等，\n福德威光勝一切，普為群萌興利益。\n其心清淨無染著，於世自在咸遵敬，\n弘宣正法以訓人，普使眾生獲安隱。\n\n現生貴族昇王位，常依正教轉法輪，\n稟性仁慈無毒虐，十方敬仰皆從化。\n智慧分別常明了，色相才能皆具足，\n臨馭率土靡不從，摧伏魔軍悉令盡。\n堅持淨戒無違犯，決志堪忍不動搖，\n永願蠲除忿恚心，常樂修行諸佛法。\n飲食香鬘及衣服，車騎床褥座與燈，\n菩薩悉以給濟人，并及所餘無量種。\n為利益故而行施，令其開發廣大心，\n於尊勝處及所餘，意皆清淨生歡喜。\n菩薩一切皆周給，內外所有悉能捨，\n必使其心永清淨，不令暫爾生狹劣。\n或施於頭或施眼，或施於手或施足，\n皮肉骨髓及餘物，一切皆捨心無吝。\n菩薩身居大王位，種族豪貴人中尊，\n開口出舌施群生，其心歡喜無憂戀。\n以彼施舌諸功德，迴向一切諸眾生，\n普願藉此勝因緣，悉得如來廣長舌。\n或施妻子及王位，或施其身作僮僕，\n其心清淨常歡喜，如是一切無憂悔。\n隨所樂求咸施與，應時給濟無疲厭，\n一切所有皆能散，諸來求者普滿足。\n為聞法故施其身，修諸苦行求菩提，\n復為眾生捨一切，求無上智不退轉。\n以於佛所聞正法，自捨其身充給侍，\n為欲普救諸群生，發生無量歡喜心。\n彼見世尊大導師，能以慈心廣饒益，\n是時踊躍生歡喜，聽受如來深法味。\n菩薩所有諸善根，悉以迴向諸眾生，\n\n普皆救護無有餘，永使解脫常安樂。\n菩薩所有諸眷屬，色相端嚴能辯慧，\n華鬘衣服及塗香，種種莊嚴皆具足。\n此諸眷屬甚希有，菩薩一切皆能施，\n專求正覺度群生，如是之心無暫捨。\n菩薩如是諦思惟，備行種種廣大業，\n悉以迴向諸含識，而不生於取著心。\n菩薩捨彼大王位，及以國土諸城邑，\n宮殿樓閣與園林，僮僕侍衛皆無吝。\n彼於無量百千劫，處處周行而施與，\n因以教導諸群生，悉使超昇無上岸。\n無量品類各差別，十方世界來萃止，\n菩薩見已心欣慶，隨其所乏令滿足。\n如三世佛所迴向，菩薩亦修如是業，\n調御人尊之所行，悉皆隨學到彼岸。\n菩薩觀察一切法，誰為能入此法者？\n云何為入何所入？如是布施心無住。\n菩薩迴向善巧智，菩薩迴向方便法，\n菩薩迴向真實義，於其法中無所著。\n心不分別一切業，亦不染著於業果，\n知菩提性從緣起，入深法界無違逆。\n不於身中而有業，亦不依止於心住，\n智慧了知無業性，以因緣故業不失。\n心不妄取過去法，亦不貪著未來事，\n不於現在有所住，了達三世悉空寂。\n菩薩已到色彼岸，受想行識亦如是，\n超出世間生死流，其心謙下常清淨。\n諦觀五蘊十八界，十二種處及己身，\n於此一一求菩提，體性畢竟不可得。\n\n不取諸法常住相，於斷滅相亦不著，\n法性非有亦非無，業理次第終無盡。\n不於諸法有所住，不見眾生及菩提，\n十方國土三世中，畢竟求之無可得。\n若能如是觀諸法，則如諸佛之所解，\n雖求其性不可得，菩薩所行亦不虛。\n菩薩了法從緣有，不違一切所行道，\n開示解說諸業迹，欲使眾生悉清淨。\n是為智者所行道，一切如來之所說，\n隨順思惟入正義，自然覺悟成菩提。\n諸法無生亦無滅，亦復無來無有去，\n不於此死而生彼，是人解悟諸佛法。\n了達諸法真實性，而於法性無分別，\n知法無性無分別，此人善入諸佛智。\n法性遍在一切處，一切眾生及國土，\n三世悉在無有餘，亦無形相而可得。\n一切諸佛所覺了，悉皆攝取無有餘，\n雖說三世一切法，如是等法悉非有。\n如諸法性遍一切，菩薩迴向亦復然，\n如是迴向諸眾生，常於世間無退轉。\n大方廣佛華嚴經卷第二十八\n\n\n\n大方廣佛華嚴經卷第二十九\n\n于闐國三藏實叉難陀奉　制譯\n之七十迴向品第二十五之七\n「佛子！云何為菩薩摩訶薩等隨順一切眾生\n迴向？「佛子！此菩薩摩訶薩隨所積集一切善\n\n根，所謂：小善根、大善根、廣善根、多善根、無\n量善根、種種善根、微塵數善根、阿僧祇善根、\n無邊際善根、不可思善根、不可量善根、佛境\n界善根、法境界善根、僧境界善根、善知識境\n界善根、一切眾生境界善根、方便善巧境界\n善根、修諸善心境界善根、內境界善根、外境\n界善根、無邊助道法境界善根、勤修一切捨\n善根、立勝志究竟持淨戒善根、一切捨無不\n受堪忍善根、常精進心無退善根、以大方便\n入無量三昧善根、以智慧善觀察善根、知一\n切眾生心行差別善根、集無邊功德善根、勤\n修習菩薩業行善根、普覆育一切世間善根。\n佛子！菩薩摩訶薩於此善根修行安住，趣入\n攝受，積集辦具，悟解心淨；開示發起時，得\n堪忍心，閉惡趣門；善攝諸根，威儀具足，遠離\n顛倒，正行圓滿；堪為一切諸佛法器，能作眾\n生福德良田；為佛所念，長佛善根，住諸佛願，\n行諸佛業，心得自在，等三世佛；趣佛道場，入\n如來力，具佛色相，超諸世間；不樂生天，不貪\n富樂，不著諸行；一切善根悉以迴向，為諸眾\n生功德之藏；住究竟道，普覆一切，於虛妄道\n中拔出眾生，令其安住一切善法，遍諸境界\n無斷無盡；開一切智菩提之門，建立智幢，嚴\n淨大道；普能示現一切世間，令除垢染，心善\n調伏，生如來家，淨佛種性；功德具足，作大福\n田，為世所依；安立眾生咸令清淨，常勤修習\n一切善根。「佛子！菩薩摩訶薩以淨志願菩提\n心力修諸善根時，作是念言：『此諸善根是菩\n提心之所積集，是菩提心之所思惟，是菩提\n\n心之所發起，是菩提心之所志樂，是菩提心\n之所增益；皆為憐愍一切眾生，皆為趣求一\n切種智，皆為成就如來十力。』作是念時，善根\n增進，永不退轉。「佛子！菩薩摩訶薩復作是\n念：『願我以此善根果報，盡未來劫，修菩薩行，\n悉以惠施一切眾生，悉以迴向一切眾生，普\n遍無餘。願令阿僧祇世界珍寶充滿，阿僧祇\n世界衣服充滿，阿僧祇世界妙香充滿，阿僧\n祇世界莊嚴具充滿，阿僧祇世界無量摩尼\n寶充滿，阿僧祇世界妙華充滿，阿僧祇世界\n上味充滿，阿僧祇世界財貨充滿，阿僧祇世\n界床座充滿——蓋以寶帳、敷以妙衣，阿僧祇世\n界種種莊嚴寶冠充滿。假使一人，盡未來\n劫，常來求索，以此等物而惠施之，未曾厭\n倦而有休息。如於一人，於一切眾生悉亦如\n是。』佛子！菩薩摩訶薩如是施時，無虛偽心，\n無希望心，無名譽心，無中悔心，無熱惱心，但\n發專求一切智道心、一切悉捨心、哀愍眾生\n心、教化成熟心、皆令安住一切智智心。佛子！\n菩薩摩訶薩以諸善根如是迴向，盡未來劫，\n常行惠施。「佛子！菩薩摩訶薩復作是念：『我\n為一眾生故，欲令阿僧祇世界寶象充滿，七\n支具足，性極調順，上立金幢，金網彌覆，種種\n妙寶而為莊嚴，以用布施；願令阿僧祇世界\n寶馬充滿，如龍馬王，種種眾寶莊嚴之具而\n嚴飾之，持用布施；願令阿僧祇世界妓女充\n滿，悉能敷奏種種妙音，持用布施；願令阿僧\n祇世界男女充滿，持用布施；願令阿僧祇世\n界己身充滿，發菩提心而用布施；願令阿僧\n\n祇世界己頭充滿，起不放逸心而用布施；願\n令阿僧祇世界己眼充滿，而用布施；願令阿\n僧祇世界己身血肉及以骨髓充滿其中，心\n無顧戀，持用布施；願令阿僧祇世界自在王\n位充滿其中，持用布施；願令阿僧祇世界奴\n僕作使充滿其中，持用布施。』菩薩摩訶薩以\n如是等種種諸物，盡未來劫，安住廣大一切\n施心，施一眾生；如一眾生，盡眾生界一切眾\n生皆如是施。「佛子！菩薩摩訶薩於一世界，\n盡未來劫，修菩薩行，以是等物施一眾生，如\n是給施一切眾生，皆令滿足；如於一世界，於\n盡虛空遍法界一切世界中悉亦如是，大悲\n普覆，終無間息，普加哀愍，隨其所須供給供\n養，不令施行遇緣而息，乃至不於一彈指頃\n生疲倦心。佛子！菩薩摩訶薩如是施時，生於\n此心，所謂：無著心、無縛心、解脫心、大力心、\n甚深心、善攝心、無執心、無壽者心、善調伏\n心、不散亂心、不妄計心、具種種寶性心、不求\n果報心、了達一切法心、住大迴向心、善決諸\n義心、令一切眾生住無上智心、生大法光明\n心、入一切智智心。「佛子！菩薩摩訶薩以所集\n善根，於念念中如是迴向，所謂：『願一切眾生\n財寶豐足，無所乏少；願一切眾生成就無盡\n大功德藏；願一切眾生具足一切安隱快樂；\n願一切眾生增長菩薩摩訶薩業；願一切眾\n生成滿無量第一勝法；願一切眾生得不退\n轉一切智乘；願一切眾生普見十方一切諸\n佛；願一切眾生永離世間諸惑塵垢；願一切\n眾生皆得清淨平等之心；願一切眾生離諸\n\n難處，得一切智。』\n「佛子！菩薩摩訶薩如是迴向時，發歡喜心；為\n令一切眾生得利益安樂故；為令一切眾生\n得平等心故；為令一切眾生住能捨心故；為\n令一切眾生住一切施心故；為令一切眾生\n住歡喜施心故；為令一切眾生住永離貧窮\n施心故；為令一切眾生住一切財寶施心故；\n為令一切眾生住無數財寶施心故；為令一\n切眾生住普施、無量施、一切施心故；為令一\n切眾生住盡未來劫無斷施心故；為令一切\n眾生住一切悉捨無悔無惱施心故；為令一\n切眾生住悉捨一切資生之物施心故；為令\n一切眾生住隨順施心故；為令一切眾生住\n攝取施心故；為令一切眾生住廣大施心故；\n為令一切眾生住捨無量莊嚴具供養施心\n故；為令一切眾生住無著施心故；為令一切\n眾生住平等施心故；為令一切眾生住如金\n剛極大力施心故；為令一切眾生住如日光\n明施心故；為令一切眾生住攝如來智施心\n故；為令一切眾生善根眷屬具足故；為令一\n切眾生善根智慧常現在前故；為令一切眾\n生得不可壞淨心圓滿故；為令一切眾生成\n就最勝清淨善根故；為令一切眾生於煩惱\n睡眠中得覺悟故；為令一切眾生滅除一切\n諸疑惑故；為令一切眾生得平等智慧淨功\n德故；為令一切眾生功德圓滿無能壞者故；\n為令一切眾生具足清淨不動三昧故；為令\n一切眾生住不可壞一切智智故；為令一切\n眾生成滿菩薩無量清淨神通行故；為令一\n\n切眾生修集無著善根故；為令一切眾生念\n去、來、今一切諸佛心清淨故；為令一切眾生\n出生清淨勝善根故；為令一切眾生滅除一\n切魔所作業障道法故；為令一切眾生具足\n無礙清淨平等功德法故；為令一切眾生以\n廣大心常念諸佛無懈廢故；為令一切眾生\n常近諸佛勤供養故；為令一切眾生廣開一\n切諸善根門，普能圓滿白淨法故；為令一切\n眾生無量心、廣大心、最勝心悉清淨故；為\n令一切眾生成就清淨等施心故；為令一切\n眾生奉持諸佛尸波羅蜜等清淨故；為令一\n切眾生得大堪忍波羅蜜故；為令一切眾生\n住精進波羅蜜常無懈故；為令一切眾生住\n無量定，能起種種神通智故；為令一切眾生\n得知一切法無體性般若波羅蜜故；為令一\n切眾生圓滿無邊淨法界故；為令一切眾生\n成滿一切神通清淨善根故；為令一切眾生\n住平等行，積集善法悉圓滿故；為令一切眾\n生善入一切諸佛境界悉周遍故；為令一切\n眾生身、口、意業普清淨故；為令一切眾生善\n業果報普清淨故；為令一切眾生了達諸法\n普清淨故；為令一切眾生了達實義普清淨\n故；為令一切眾生修諸勝行普清淨故；為令\n一切眾生成就一切菩薩大願普清淨故；為\n令一切眾生證得一切功德智慧普清淨故；\n為令一切眾生成就一切同體善根，迴向出\n生一切智乘普圓滿故；為令一切眾生嚴淨\n一切諸佛國土普圓滿故；為令一切眾生見\n一切佛而無所著普圓滿故；為令一切眾生\n\n具諸相好，功德莊嚴普圓滿故；為令一切眾\n生得六十種音聲，發言誠諦，皆可信受，百千\n種法而以莊嚴，如來無礙功德妙音悉圓滿\n故；為令一切眾生成就十力莊嚴無礙平等\n心故；為令一切眾生得一切佛無盡法明，一\n切辯才普圓滿故；為令一切眾生得無上無\n畏人中之雄師子吼故；為令一切眾生得一\n切智，轉不退轉無盡法輪故；為令一切眾生\n了一切法，開示演說普圓滿故；為令一切眾\n生以時修習清淨善法普圓滿故；為令一切\n眾生成就導師無上法寶等清淨故；為令一\n切眾生於一莊嚴、無量莊嚴、大莊嚴、諸佛莊\n嚴普圓滿故；為令一切眾生等入三世所有\n境界悉周遍故；為令一切眾生悉能往詣一\n切佛剎，聽受正法無不遍故；為令一切眾生\n智慧利益為世所宗與佛等故；為令一切眾\n生以一切智知一切法普圓滿故；為令一切\n眾生行不動業，得無礙果普圓滿故；為令一\n切眾生所有諸根咸得神通，能知一切眾生\n根故；為令一切眾生得無差別平等智慧，於\n一相法普清淨故；為令一切眾生與理無違，\n一切善根悉具足故；為令一切眾生於一切\n菩薩自在神通悉明達故；為令一切眾生得\n一切佛無盡功德，若福若智悉平等故；為令\n一切眾生發菩提心，解一切法平等一相無\n遺缺故；為令一切眾生了達正法，為世最上\n福德田故；為令一切眾生成就平等清淨大\n悲，為諸施者大力田故；為令一切眾生堅固\n第一無能沮壞故；為令一切眾生見必蒙益\n\n無能摧伏故；為令一切眾生成滿最勝平等\n心故；為令一切眾生善能了達一切諸法得\n大無畏故；為令一切眾生放一光明普照十\n方一切世界故；為令一切眾生普修一切菩\n薩精進行無懈退故；為令一切眾生以一行\n願普滿一切諸行願故；為令一切眾生以一\n妙音普使聞者皆得解故；為令一切眾生悉\n能具足一切菩薩清淨心故；為令一切眾生\n普得值遇諸善知識咸承事故；為令一切眾\n生修菩薩行，調伏眾生不休息故；為令一切\n眾生以妙辯才具一切音，隨機廣演無斷盡\n故；為令一切眾生能以一心知一切心，以一\n切善根等迴向故；為令一切眾生常樂積集\n一切善根，安立眾生於淨智故；為令一切眾\n生得一切智、福德智慧、清淨身故；為令一切\n眾生善知一切眾生善根，觀察迴向普成就\n故；為令一切眾生得一切智，成等正覺普圓\n滿故；為令一切眾生得具足神通智，於一處\n出興，一切諸處皆出興故；為令一切眾生得\n普莊嚴智，嚴淨一眾會，一切眾會皆嚴淨故；\n為令一切眾生於一佛國土普見一切佛國\n土故；為令一切眾生以一切莊嚴具、不可說\n莊嚴具、無量莊嚴具、無盡莊嚴具，莊嚴一切\n諸佛國土普周遍故；為令一切眾生於一\n切法悉能決了甚深義故；為令一切眾生得\n諸如來最上第一自在神通故；為令一切眾\n生得非一非異一切功德自在神通故；為令\n一切眾生具足一切平等善根，普為諸佛灌\n其頂故；為令一切眾生悉得成滿清淨智身，\n\n於諸有中最尊勝故。「佛子！菩薩摩訶薩如是\n悲愍利益安樂一切眾生，咸令清淨，遠離慳\n嫉，受勝妙生，具大威德，生大信解，永離瞋\n恚及諸翳濁。其心清淨，質直柔軟，無有諂\n曲、迷惑、愚癡，行出離行，堅固不壞平等之\n心永無退轉，白淨法力具足成就，無惱無\n失，善巧迴向；常修正行調伏眾生，滅除一\n切諸不善業，修行苦行一切善根；又勸眾生\n令其修習，普為含識具受眾苦，以大智眼\n觀諸善根，知其悉以智慧為性，方便迴向一\n切眾生。為令一切眾生悉得安住一切清淨\n功德處故；為令一切眾生悉能攝受一切善\n根，知諸功德性及義故；為令一切眾生普淨\n一切諸善根故；為令一切眾生於福田境界\n中種諸善法心無悔故；為令一切眾生普能\n攝受一切眾生，一一皆令趣一切智故；為令\n一切眾生普攝一切所有善根，一一皆與平\n等迴向而相應故。又以諸善根如是迴向，所\n謂：『願一切眾生究竟安隱，願一切眾生究竟\n清淨，願一切眾生究竟安樂，願一切眾生究\n竟解脫，願一切眾生究竟平等，願一切眾生\n究竟了達，願一切眾生究竟安住諸白淨\n法，願一切眾生得無礙眼，願一切眾生善調\n其心，願一切眾生具足十力調伏眾生。』「佛\n子！菩薩摩訶薩如是迴向時，不著業，不著\n報，不著身，不著物，不著剎，不著方，不著眾\n生，不著無眾生，不著一切法，不著無一切法。\n佛子！菩薩摩訶薩如是迴向時，以此善根普\n施世間：『願一切眾生成滿佛智，得清淨心，智\n\n慧明了，內心寂靜，外緣不動，增長成就三世\n佛種。』「佛子！菩薩摩訶薩修行如是迴向之時，\n超出一切，無能過者，一切世間所有言辭\n悉共稱讚亦不可盡；普修一切菩薩諸行，悉\n能往詣一切佛土，普見諸佛無所障礙；又能\n普見一切世界菩薩所行，以善方便，為諸眾\n生分別諸法甚深句義，得陀羅尼演說妙\n法，盡未來劫無有斷絕；為眾生故，念念於\n不可說不可說世界，猶如影像，普現其身，供\n養諸佛；念念嚴淨不可說不可說諸佛國土，\n悉令周遍，修行嚴淨佛剎智慧而無厭足；\n念念令不可說不可說百千億那由他眾生，\n清淨成就，平等滿足；於彼一切諸國土中，勤\n修一切諸波羅蜜，攝取眾生，成就淨業；得無\n礙耳，於不可說不可說諸佛世界，一一如來\n所轉法輪，聽聞受持，精勤修習，不生一念捨\n離之心；住無所得、無依止、無作、無著菩薩神\n通，於一剎那一彈指頃，分身普詣不可說諸\n佛世界，與諸菩薩等同一見。「佛子！菩薩摩訶\n薩如是修習菩薩行時，尚能成滿無量不可\n說不可說清淨功德，憶念稱讚所不能盡，況\n復得成無上菩提，一切佛剎平等清淨，一切\n眾生平等清淨，一切身平等清淨，一切根平\n等清淨，一切業果平等清淨，一切眾會道場\n平等清淨，一切圓滿行平等清淨，一切法方\n便智平等清淨，一切如來諸願迴向平等清\n淨，一切諸佛神通境界平等清淨。「佛子！菩\n薩摩訶薩如是迴向時，得一切功德清淨歡\n喜法門，無量功德圓滿莊嚴。如是迴向時，眾\n\n生不違一切剎，剎不違一切眾生；剎眾生不\n違業，業不違剎眾生；思不違心，心不違思；思、\n心不違境界，境界不違思、心；業不違報，報不\n違業；業不違業道，業道不違業；法性不違相，\n法相不違性；法生不違性，法性不違生；剎平\n等不違眾生平等，眾生平等不違剎平等；一\n切眾生平等不違一切法平等，一切法平等\n不違一切眾生平等；離欲際平等不違一切\n眾生安住平等，一切眾生安住平等不違離\n欲際平等；過去不違未來，未來不違過去；過\n去、未來不違現在，現在不違過去、未來；世平\n等不違佛平等，佛平等不違世平等；菩薩行\n不違一切智，一切智不違菩薩行。「佛子！菩薩\n摩訶薩如是迴向時，得業平等，得報平等，得\n身平等，得方便平等，得願平等，得一切眾生\n平等，得一切剎平等，得一切行平等，得一切\n智平等，得三世諸佛平等；得承事一切諸佛，\n得供養一切菩薩，得種一切善根，得滿一切\n大願，得教化一切眾生，得了知一切業，得承\n事供養一切善知識，得入一切清淨眾會道\n場，得通達一切正教，得成滿一切白法。「佛子！\n是為菩薩摩訶薩第七等隨順一切眾生迴向。\n菩薩摩訶薩成就此迴向，則能摧滅一切魔\n怨，拔諸欲刺，得出離樂，住無二性，具大威\n德，救護眾生，為功德王；神足無礙，往一切\n剎，入寂滅處；具一切身，成菩薩行，於諸行\n願心得自在，分別了知一切諸法，悉能遍生\n一切佛剎；得無礙耳，聞一切剎所有音聲；得\n淨慧眼，見一切佛未甞暫捨；於一切境界，成\n\n就善根，心無高下；於一切法，得無所得。菩薩\n摩訶薩以一切善根，等隨順一切眾生，如是\n迴向。」爾時，金剛幢菩薩承佛神力，普觀十方\n而說頌言：\n「菩薩所作諸功德，微妙廣大甚深遠，\n乃至一念而修行，悉能迴向無邊際。\n菩薩所有資生具，種種豐盈無限億，\n香象寶馬以駕車，衣服珍財悉殊妙。\n或以頭目并手足，或持身肉及骨髓，\n悉遍十方無量剎，普施一切令充遍。\n無量劫中所修習，一切功德盡迴向，\n為欲救度諸群生，其心畢竟不退轉。\n菩薩為度眾生故，常修最勝迴向業，\n普令三界得安樂，悉使當成無上果。\n菩薩普興平等願，隨其所集清淨業，\n悉以迴施諸群生，如是大誓終無捨。\n菩薩願力無限礙，一切世間咸攝受，\n如是迴向諸群生，未曾暫起分別心。\n普願眾生智明了，布施持戒悉清淨，\n精進修行不懈廢，如是大誓無休息。\n菩薩迴向到彼岸，普開清淨妙法門，\n智慧同於兩足尊，分別實義得究竟。\n菩薩言辭已通達，種種智慧亦如是，\n說法如理無障礙，而於其中心不著。\n常於諸法不作二，亦復不作於不二，\n於二不二並皆離，知其悉是語言道。\n知諸世間悉平等，莫非心語一切業，\n眾生幻化無有實，所有果報從茲起。\n一切世間之所有，種種果報各不同，\n\n莫不皆由業力成，若滅於業彼皆盡。\n菩薩觀察諸世間，身口意業悉平等，\n亦令眾生住平等，猶如無等大聖尊。\n菩薩善業悉迴向，普令眾生色清淨，\n福德方便皆具足，同於無上調御士。\n菩薩利益諸群生，功德大海盡迴向，\n願使威光特超世，得成雄猛大力身。\n凡所修習諸功德，願使世間普清淨，\n諸佛清淨無倫匹，眾生清淨亦如是。\n菩薩於義得善巧，能知諸佛最勝法，\n以眾善業等迴向，願令庶品同如來。\n菩薩了知諸法空，一切世間無所有，\n無有造作及作者，眾生業報亦不失。\n諸法寂滅非寂滅，遠離此二分別心，\n知諸分別是世見，入於正位分別盡。\n如是真實諸佛子，從於如來法化生，\n彼能如是善迴向，世間疑惑悉除滅。\n大方廣佛華嚴經卷第二十九\n\n\n\n大方廣佛華嚴經卷第三十\n\n于闐國三藏實叉難陀奉　制譯\n之八十迴向品第二十五之八\n「佛子！何者是菩薩摩訶薩真如相迴向？「佛子！\n此菩薩摩訶薩正念明了，其心堅住，遠離迷\n惑；專意修行，深心不動；成不壞業，趣一切\n智，終不退轉；志求大乘，勇猛無畏；植諸德\n本，普安世間；生勝善根，修白淨法；大悲增\n\n長，心寶成就；常念諸佛，護持正法；於菩薩\n道信樂堅固，成就無量淨妙善根，勤修一切\n功德智慧；為調御師，生眾善法，以智方便而\n為迴向。菩薩爾時，慧眼普觀，所有善根無量\n無邊。其諸善根修集之時，若求緣、若辦具、\n若治淨、若趣入、若專勵、若起行、若明達、若精\n審、若開示，如是一切有種種門、種種境、種\n種相、種種事、種種分、種種行、種種名字、種\n種分別、種種出生、種種修習，其中所有一切\n善根，悉是趣向十力乘心之所建立，皆悉迴\n向一切種智，唯一無二。以諸善根如是迴\n向，所謂：『願得圓滿無礙身業，修菩薩行；願得\n清淨無礙口業，修菩薩行；願得成就無礙意\n業，安住大乘；願得圓滿無障礙心，淨修一切\n諸菩薩行；願起無量廣大施心，周給無邊一\n切眾生；願於諸法心得自在，演大法明，無能\n障蔽；願得明達一切智處，發菩提心，普照世\n間；願常正念三世諸佛，諦想如來常現在前；\n願住圓滿增上志樂，遠離一切諸魔怨敵；願\n得安住佛十力智，普攝眾生無有休息；願得\n三昧遊諸世界，而於世間無所染著；願住諸\n世界無有疲厭，教化眾生恒不休息；願起無\n量思慧方便，成就菩薩不思議道；願得諸方\n不迷惑智，悉能分別一切世間；願得自在神\n通智力，於一念中悉能嚴淨一切國土；願得\n普入諸法自性，見一切世間悉皆清淨；願得\n生起無差別智，於一剎中入一切剎；願以一\n切剎莊嚴之事顯示一切，教化無量無邊眾\n生；願於一佛剎中示無邊法界，一切佛剎悉\n\n亦如是；願得自在大神通智，普能往詣一切\n佛土。』「佛子！菩薩摩訶薩以諸善根，願得莊嚴\n一切佛國，願得周遍一切世界，願得成就智\n慧觀察。如為己身如是迴向，如是而為一切\n眾生，所謂：『願一切眾生永離一切地獄、畜生、\n閻羅王趣；願一切眾生除滅一切障礙之業；\n願一切眾生得周普心平等智慧；願一切眾\n生於怨於親等心攝受，皆令安樂，智慧清\n淨；願一切眾生智慧圓滿，淨光普照；願一切\n眾生思慧成滿，了真實義；願一切眾生以淨\n志樂，趣求菩提，獲無量智；願一切眾生普能\n顯示安隱住處。』佛子！菩薩摩訶薩恒以善心\n如是迴向，為令一切眾生遇清涼雲，霔法雨\n故；為令一切眾生常值福田，勝境界故；為\n令一切眾生皆能善入菩提心藏，自護持故；\n為令一切眾生離諸蓋、纏，善安住故；為令一\n切眾生皆獲無礙神通智故；為令一切眾生\n得自在身，普示現故；為令一切眾生成就最\n勝一切種智，普興利益無空過故；為令一切\n眾生普攝群品，令清淨故；為令一切眾生皆\n能究竟一切智故；為令一切眾生心不動搖，\n無障礙故。「佛子！菩薩摩訶薩見可愛樂國土、\n園林、草木、華果、名香、上服、珍寶、財物、諸莊嚴\n具，或見可樂村邑、聚落，或見帝王威德自在，\n或見住處離諸諠雜。見是事已，以方便智精\n勤修習，出生無量勝妙功德，為諸眾生勤求\n善法，心無放逸，廣集眾善；猶如大海，以無盡\n善普覆一切，為眾善法所依之處，以諸善根\n方便迴向而無分別；開示無量種種善根，智\n\n常觀察一切眾生，心恒憶念善根境界，以等\n真如平等善根迴向眾生，無有休息。菩薩爾\n時，以諸善根如是迴向，所謂：『願一切眾生得\n諸如來可愛樂見，見法真性平等平等，無所\n取著，圓滿清淨；願一切眾生見諸如來甚可\n愛樂，圓滿供養；願一切眾生往生一切無諸\n煩惱、甚可愛樂清淨佛剎；願一切眾生得見\n諸佛可愛樂法；願一切眾生常樂護持一切\n菩薩可愛樂行；願一切眾生得善知識可愛\n樂眼，見無所礙；願一切眾生常見一切可愛\n樂物，無有違逆；願一切眾生證得一切可愛\n樂法而勤護持；願一切眾生於一切佛可樂\n法中得淨光明；願一切眾生修諸菩薩一切\n能捨可愛樂心；願一切眾生得無所畏能說\n一切可愛樂法；願一切眾生得諸菩薩極可\n愛樂甚深三昧；願一切眾生得諸菩薩甚可\n愛樂陀羅尼門；願一切眾生得諸菩薩甚可\n愛樂善觀察智；願一切眾生能現菩薩甚可\n愛樂自在神通；願一切眾生能於諸佛大眾\n會中說可愛樂甚深妙法；願一切眾生能以\n方便開示演說甚可愛樂差別之句；願一切\n眾生常能發起甚可愛樂平等大悲；願一切\n眾生念念發起甚可愛樂大菩提心，常令諸\n根歡喜悅豫；願一切眾生能入一切甚可愛\n樂諸如來家；願一切眾生得可愛樂能調伏\n行，調伏眾生無有休息；願一切眾生得諸菩\n薩甚可愛樂無盡辯才演說諸法；願一切眾\n生於不可說不可說劫，住於一切可樂世界，\n教化眾生，心無厭倦；願一切眾生以無量方\n\n便，普能悟入甚可愛樂諸佛法門；願一切眾\n生得可愛樂無礙方便，知一切法無有根本；\n願一切眾生得可愛樂離貪欲際，知一切法\n畢竟無二，斷一切障；願一切眾生得可愛樂\n離貪欲際，知一切法平等真實；願一切眾生\n具足成滿一切菩薩甚可愛樂無戲論法；願\n一切眾生得金剛藏精進之心，成可愛樂一\n切智道；願一切眾生具可愛樂無礙善根，摧\n伏一切煩惱怨敵；願一切眾生得可愛樂一\n切智門，普於世間現成正覺。』「佛子！菩薩摩訶\n薩修習如是諸善根時，得智慧明，為善知識\n之所攝受，如來慧日明照其心，永滅癡冥；勤\n修正法，入諸智業，善學智地，流布善根，充滿\n法界，以智迴向；盡諸菩薩善根源底，以智深\n入大方便海，成就無量廣大善根。\n「佛子！菩薩摩訶薩以此善根如是迴向，所謂：\n『不著世間，不取眾生；其心清淨，無所依止；正\n念諸法，離分別見；不捨一切佛自在慧，不違\n三世一切諸佛正迴向門；隨順一切平等正\n法，不壞如來真實之相，等觀三世無眾生相；\n善順佛道，善說於法，深了其義，入最勝地，悟\n真實法，智慧圓滿，信樂堅固；雖善修正業而\n知業性空，了一切法皆如幻化，知一切法無\n有自性；觀一切義及種種行，隨世言說而無\n所著；除滅一切執著因緣，知如實理，觀諸法\n性皆悉寂滅，了一切法同一實相，知諸法相\n不相違背；與諸菩薩而共同止，修行其道，善\n攝眾生，入去、來、今一切菩薩迴向之門；於諸\n佛法心無驚怖，以無量心令諸眾生普得清\n\n淨；於十方世界不起執取我、我所心，於諸世\n間無所分別；於一切境界不生染著，勤修一\n切出世間法；於諸世間無取無依，於深妙道\n正見牢固，離諸妄見，了真實法。譬如真如，遍\n一切處，無有邊際；善根迴向亦復如是，遍一\n切處，無有邊際。譬如真如，真實為性；善根迴\n向亦復如是，了一切法真實為性。譬如真如，\n恒守本性，無有改變；善根迴向亦復如是，守\n其本性，始終不改。譬如真如，以一切法無性\n為性；善根迴向亦復如是，了一切法無性為\n性。譬如真如，無相為相；善根迴向亦復如是，\n了一切法無相為相。譬如真如，若有得者，終\n無退轉；善根迴向亦復如是，若有得者，於諸\n佛法，永不退轉。譬如真如，一切諸佛之所行\n處；善根迴向亦復如是，一切如來所行之處。\n譬如真如，離境界相而為境界；善根迴向亦\n復如是，離境界相而為三世一切諸佛圓滿\n境界。譬如真如，能有安立；善根迴向亦復如\n是，悉能安立一切眾生。譬如真如，性常隨順；\n善根迴向亦復如是，盡未來劫，隨順不斷。譬\n如真如，無能測量；善根迴向亦復如是，等虛\n空界，盡眾生心，無能測量。譬如真如，充滿一\n切；善根迴向亦復如是，一剎那中普周法界。\n譬如真如，常住無盡；善根迴向亦復如是，究\n竟無盡。譬如真如，無有比對；善根迴向亦復\n如是，普能圓滿一切佛法，無有比對。譬如真\n如，體性堅固；善根迴向亦復如是，體性堅固，\n非諸惑惱之所能沮。譬如真如，不可破壞；善\n根迴向亦復如是，一切眾生不能損壞。譬如\n\n真如，照明為體；善根迴向亦復如是，以普照\n明而為其性。譬如真如，無所不在；善根迴向\n亦復如是，於一切處悉無不在。譬如真如，遍\n一切時；善根迴向亦復如是，遍一切時。譬如\n真如，性常清淨；善根迴向亦復如是，住於世\n間而體清淨。譬如真如，於法無礙；善根迴向\n亦復如是，周行一切而無所礙。譬如真如，為\n眾法眼；善根迴向亦復如是，能為一切眾生\n作眼。譬如真如，性無勞倦；善根迴向亦復如\n是，修行一切菩薩諸行恒無勞倦。譬如真如，\n體性甚深；善根迴向亦復如是，其性甚深。譬\n如真如，無有一物；善根迴向亦復如是，了知\n其性無有一物。譬如真如，性非出現；善根迴\n向亦復如是，其體微妙，難可得見。譬如真如，\n離眾垢翳；善根迴向亦復如是，慧眼清淨，離\n諸癡翳。譬如真如，性無與等；善根迴向亦復\n如是，成就一切諸菩薩行最上無等。譬如真\n如，體性寂靜；善根迴向亦復如是，善能隨順\n寂靜之法。譬如真如，無有根本；善根迴向亦\n復如是，能入一切無根本法。譬如真如，體性\n無邊；善根迴向亦復如是，淨諸眾生，其數無\n邊。譬如真如，體性無著；善根迴向亦復如是，\n畢竟遠離一切諸著。譬如真如，無有障礙；善\n根迴向亦復如是，除滅一切世間障礙。譬如\n真如，非世所行；善根迴向亦復如是，非諸世\n間之所能行。譬如真如，體性無住；善根迴向\n亦復如是，一切生死皆非所住。譬如真如，性\n無所作；善根迴向亦復如是，一切所作悉皆\n捨離。譬如真如，體性安住；善根迴向亦復如\n\n是，安住真實。譬如真如，與一切法而共相應；\n善根迴向亦復如是，與諸菩薩聽聞修習而\n共相應。譬如真如，一切法中，性常平等；善根\n迴向亦復如是，於諸世間修平等行。譬如真\n如，不離諸法；善根迴向亦復如是，盡未來際\n不捨世間。譬如真如，一切法中，畢竟無盡；善\n根迴向亦復如是，於諸眾生迴向無盡。譬如\n真如，與一切法無有相違；善根迴向亦復如\n是，不違三世一切佛法。譬如真如，普攝諸法；\n善根迴向亦復如是，盡攝一切眾生善根。譬\n如真如，與一切法同其體性；善根迴向亦復\n如是，與三世佛同一體性。譬如真如，與一切\n法不相捨離；善根迴向亦復如是，攝持一切\n世、出世法。譬如真如，無能映蔽；善根迴向亦\n復如是，一切世間無能映蔽。譬如真如，不可\n動搖；善根迴向亦復如是，一切魔業無能動\n搖。譬如真如，性無垢濁；善根迴向亦復如是，\n修菩薩行無有垢濁。譬如真如，無有變易；善\n根迴向亦復如是，愍念眾生，心無變易。譬如\n真如，不可窮盡；善根迴向亦復如是，非諸世\n法所能窮盡。譬如真如，性常覺悟；善根迴向\n亦復如是，普能覺悟一切諸法。譬如真如，不\n可失壞；善根迴向亦復如是，於諸眾生起勝\n志願，永不失壞。譬如真如，能大照明；善根迴\n向亦復如是，以大智光照諸世間。譬如真如，\n不可言說；善根迴向亦復如是，一切言語所\n不可說。譬如真如，持諸世間；善根迴向亦復\n如是，能持一切菩薩諸行。譬如真如，隨世言\n說；善根迴向亦復如是，隨順一切智慧言說。\n\n譬如真如，遍一切法；善根迴向亦復如是，遍\n於十方一切佛剎，現大神通，成等正覺。譬如\n真如，無有分別；善根迴向亦復如是，於諸世\n間，無所分別。譬如真如，遍一切身；善根迴向\n亦復如是，遍十方剎無量身中。譬如真如，體\n性無生；善根迴向亦復如是，方便示生而無\n所生。譬如真如，無所不在；善根迴向亦復如\n是，十方三世諸佛土中，普現神通而無不\n在。譬如真如，遍在於夜；善根迴向亦復如是，\n於一切夜，放大光明，施作佛事。譬如真如，遍\n在於晝；善根迴向亦復如是，悉令一切在晝\n眾生，見佛神變，演不退輪，離垢清淨，無空過\n者。譬如真如，遍在半月及以一月；善根迴向\n亦復如是，於諸世間次第時節，得善方便，於\n一念中知一切時。譬如真如，遍在年歲；善根\n迴向亦復如是，住無量劫明了成熟，一切諸\n根皆令圓滿。譬如真如，遍成壞劫；善根迴向\n亦復如是，住一切劫清淨無染，教化眾生咸\n令清淨。譬如真如，盡未來際；善根迴向亦復\n如是，盡未來際，修諸菩薩清淨妙行，成滿大\n願無有退轉。譬如真如，遍住三世；善根迴向\n亦復如是，令諸眾生於一剎那見三世佛，未\n曾一念而有捨離。譬如真如，遍一切處；善根\n迴向亦復如是，超出三界，周行一切，悉得\n自在。譬如真如，住有無法；善根迴向亦復如\n是，了達一切有無之法畢竟清淨。譬如真如，\n體性清淨；善根迴向亦復如是，能以方便集\n助道法，淨治一切諸菩薩行。譬如真如，體性\n明潔；善根迴向亦復如是，令諸菩薩悉得三\n\n昧明潔之心。譬如真如，體性無垢；善根迴向\n亦復如是，遠離諸垢，滿足一切諸清淨意。譬\n如真如，無我、我所；善根迴向亦復如是，以無\n我、我所清淨之心，充滿十方諸佛國土。譬如\n真如，體性平等；善根迴向亦復如是，獲得平\n等一切智智，照了諸法，離諸癡翳。譬如真如，\n超諸數量；善根迴向亦復如是，與超數量一\n切智乘大力法藏而同止住，興遍十方一切\n世界廣大法雲。譬如真如，平等安住；善根迴\n向亦復如是，發生一切諸菩薩行，平等住於\n一切智道。譬如真如，遍住一切諸眾生界；善\n根迴向亦復如是，滿足無礙一切種智，於眾\n生界悉現在前。譬如真如，無有分別，普住\n一切音聲智中；善根迴向亦復如是，具足一\n切諸言音智，能普示現種種言音，開示眾生。\n譬如真如，永離世間；善根迴向亦復如是，普\n使眾生永出世間。譬如真如，體性廣大；善根\n迴向亦復如是，悉能受持去、來、今世廣大佛\n法，恒不忘失，勤修一切菩薩諸行。譬如真如，\n無有間息；善根迴向亦復如是，為欲安處一\n切眾生於大智地，於一切劫修菩薩行無有\n間息。譬如真如，體性寬廣，遍一切法；善根迴\n向亦復如是，淨念無礙，普攝一切寬廣法門。\n譬如真如，遍攝群品；善根迴向亦復如是，證\n得無量品類之智，修諸菩薩真實妙行。譬如\n真如，無所取著；善根迴向亦復如是，於一切\n法皆無所取，除滅一切世間取著，普令清淨。\n譬如真如，體性不動；善根迴向亦復如是，安\n住普賢圓滿行願，畢竟不動。譬如真如，是佛\n\n境界；善根迴向亦復如是，令諸眾生滿足一\n切大智境界，滅煩惱境悉令清淨。譬如真如，\n無能制伏；善根迴向亦復如是，不為一切眾\n魔事業、外道邪論之所制伏。譬如真如，非是\n可修，非不可修；善根迴向亦復如是，捨離一\n切妄想取著，於修、不修無所分別。譬如真如，\n無有退捨；善根迴向亦復如是，常見諸佛，發\n菩提心，大誓莊嚴，永無退捨。譬如真如，普攝\n一切世間言音；善根迴向亦復如是，能得一\n切差別言音神通智慧，普發一切種種言\n辭。譬如真如，於一切法無所希求；善根迴\n向亦復如是，令諸眾生乘普賢乘而得出離，\n於一切法無所貪求。譬如真如，住一切地；善\n根迴向亦復如是，令一切眾生捨世間地，住\n智慧地，以普賢行而自莊嚴。譬如真如，無有\n斷絕；善根迴向亦復如是，於一切法得無所\n畏，隨其類音，處處演說，無有斷絕。譬如真如，\n捨離諸漏；善根迴向亦復如是，令一切眾生\n成就法智，了達於法，圓滿菩提無漏功德。譬\n如真如，無有少法而能壞亂，令其少分非是\n覺悟；善根迴向亦復如是，普令開悟一切諸\n法，其心無量遍周法界。譬如真如，過去非始，\n未來非末，現在非異；善根迴向亦復如是，為\n一切眾生新新恒起菩提心願，普使清淨，永\n離生死。譬如真如，於三世中無所分別；善根\n迴向亦復如是，現在念念心常覺悟，過去、未\n來皆悉清淨。譬如真如，成就一切諸佛菩薩；\n善根迴向亦復如是，發起一切大願方便，成\n就諸佛廣大智慧。譬如真如，究竟清淨，不與\n\n一切諸煩惱俱；善根迴向亦復如是，能滅一\n切眾生煩惱，圓滿一切清淨智慧。』「佛子！菩薩\n摩訶薩如是迴向時，得一切佛剎平等，普嚴\n淨一切世界故；得一切眾生平等，普為轉無\n礙法輪故；得一切菩薩平等，普出生一切智\n願故；得一切諸佛平等，觀察諸佛體無二故；\n得一切法平等，普知諸法性無易故；得一切\n世間平等，以方便智善解一切語言道故；得\n一切菩薩行平等，隨種善根盡迴向故；得一\n切時平等，勤修佛事，於一切時無斷絕故；得\n一切業果平等，於世、出世所有善根皆無染\n著，咸究竟故；得一切佛自在神通平等，隨順\n世間現佛事故。「佛子！是為菩薩摩訶薩第八\n真如相迴向。菩薩摩訶薩住此迴向，證得無\n量清淨法門，能為如來大師子吼，自在無畏；\n以善方便，教化成就無量菩薩，於一切時未\n曾休息；得佛無量圓滿之身，一身充遍一切\n世界；得佛無量圓滿音聲，一音開悟一切眾\n生；得佛無量圓滿之力，一毛孔中普能容納\n一切國土；得佛無量圓滿神通，置諸眾生於\n一塵中；得佛無量圓滿解脫，於一眾生身示\n現一切諸佛境界，成等正覺；得佛無量圓滿\n三昧，一三昧中普能示現一切三昧；得佛無\n量圓滿辯才，說一句法，窮未來際而不可盡，\n悉除一切眾生疑惑；得佛無量圓滿眾生，具\n佛十力，盡眾生界示成正覺。佛子！是為菩薩\n摩訶薩以一切善根順真如相迴向。」爾時，金\n剛幢菩薩承佛威力，普觀十方而說頌言：\n「菩薩志樂常安住，正念堅固離癡惑，\n\n其心善軟恒清涼，積集無邊功德行。\n菩薩謙順無違逆，所有志願悉清淨，\n已得智慧大光明，善能照了一切業。\n菩薩思惟業廣大，種種差別甚希有，\n決意修行無退轉，以此饒益諸群生。\n諸業差別無量種，菩薩一切勤修習，\n隨順眾生不違意，普令心淨生歡喜。\n已昇調御人尊地，離諸熱惱心無礙，\n於法於義悉善知，為利群生轉勤習。\n菩薩所修眾善行，無量無數種種別，\n於彼一切分別知，為利群生故迴向。\n以妙智慧恒觀察，究竟廣大真實理，\n斷諸有處悉無餘，如彼真如善迴向。\n譬如真如遍一切，如是普攝諸世間，\n菩薩以此心迴向，悉令眾生無所著。\n菩薩願力遍一切，譬如真如無不在，\n若見不見念悉周，悉以功德而迴向。\n夜中隨住晝亦住，半月一月亦隨住，\n若年若劫悉住中，真如如是行亦然。\n所有三世及剎土，一切眾生與諸法，\n悉住其中無所住，以如是行而迴向。\n譬如真如本自性，菩薩如是發大心，\n真如所在無不在，以如是行而迴向。\n譬如真如本自性，其中未曾有一法，\n不得自性是真性，以如是業而迴向。\n如真如相業亦爾，如真如性業亦爾，\n如真如性本真實，業亦如是同真如。\n譬如真如無邊際，業亦如是無有邊，\n而於其中無縛著，是故此業得清淨。\n\n如是聰慧真佛子，志願堅固不動搖，\n以其智力善通達，入於諸佛方便藏。\n覺悟法王真實法，於中無著亦無縛，\n如是自在心無礙，未曾見有一法起。\n如來法身所作業，一切世間如彼相，\n說諸法相皆無相，知如是相是知法。\n菩薩住是不思議，於中思議不可盡，\n入此不可思議處，思與非思皆寂滅。\n如是思惟諸法性，了達一切業差別，\n所有我執皆除滅，住於功德無能動。\n菩薩一切業果報，悉為無盡智所印，\n如是無盡自性盡，是故無盡方便滅。\n菩薩觀心不在外，亦復不得在於內，\n知其心性無所有，我法皆離永寂滅。\n彼諸佛子如是知，一切法性常空寂，\n無有一法能造作，同於諸佛悟無我。\n了知一切諸世間，悉與真如性相等，\n見是不可思議相，是則能知無相法。\n若能住是甚深法，常樂修行菩薩行，\n為欲利益諸群生，大誓莊嚴無退轉。\n是則超過於世間，不起生死妄分別，\n了達其心如幻化，勤修眾行度群生。\n菩薩正念觀世間，一切皆從業緣得，\n為欲救度修諸行，普攝三界無遺者。\n了知眾生種種異，悉是想行所分別，\n於此觀察悉明了，而不壞於諸法性。\n智者了知諸佛法，以如是行而迴向，\n哀愍一切諸眾生，令於實法正思惟。\n大方廣佛華嚴經卷第三十\n\n\n\n大方廣佛華嚴經卷第三十一\n\n于闐國三藏實叉難陀奉　制譯\n之九十迴向品第二十五之九\n「佛子！云何為菩薩摩訶薩無著無縛解脫迴\n向？「佛子！是菩薩摩訶薩於一切善根，心生尊\n重。所謂：於出生死，心生尊重；於攝取一切善\n根，心生尊重；於希求一切善根，心生尊重；於\n悔諸過業，心生尊重；於隨喜善根，心生尊重；\n於禮敬諸佛，心生尊重；於合掌恭敬，心生尊\n重；於頂禮塔廟，心生尊重；於勸佛說法，心生\n尊重。於如是等種種善根，皆生尊重，隨順忍\n可。「佛子！菩薩摩訶薩於彼善根，皆生尊重，\n隨順忍可時，究竟欣樂，堅固信解；自得安住，\n令他安住；勤修無著，自在積集；成勝志樂，住\n如來境；勢力增長，悉得知見。以諸善根如是\n迴向，所謂：『以無著無縛解脫心，成就普賢身\n業。以無著無縛解脫心，清淨普賢語業。以無\n著無縛解脫心，圓滿普賢意業。以無著無縛\n解脫心，發起普賢廣大精進。以無著無縛解\n脫心，具足普賢無礙音聲陀羅尼門，其聲廣\n大，普遍十方。以無著無縛解脫心，具足普賢\n見一切佛陀羅尼門，恒見十方一切諸佛。以\n無著無縛解脫心，成就解了一切音聲陀羅\n尼門，同一切音，說無量法。以無著無縛解脫\n心，成就普賢一切劫住陀羅尼門，普於十方\n修菩薩行。以無著無縛解脫心，成就普賢自\n在力，於一眾生身中，示修一切菩薩行，盡未\n\n來劫常無間斷；如一眾生身，一切眾生身悉\n如是。以無著無縛解脫心，成就普賢自在\n力，普入一切眾道場，普現一切諸佛前，修菩\n薩行。以無著無縛解脫心，成就普賢佛自在\n力，於一門中示現，經不可說不可說劫，無有\n窮盡，令一切眾生皆得悟入。以無著無縛解\n脫心，成就普賢佛自在力，於種種門中示現，\n經不可說不可說劫，無有窮盡，令一切眾生\n皆得悟入，其身普現一切佛前。以無著無縛解\n脫心，成就普賢自在力，念念中令不可說不\n可說眾生住十力智，心無疲倦。以無著無縛\n解脫心，成就普賢自在力，於一切眾生身中，\n現一切佛自在神通，令一切眾生住普賢行。\n以無著無縛解脫心，成就普賢自在力，於一\n一眾生語言中，作一切眾生語言，令一切眾\n生一一皆住一切智地。以無著無縛解脫心，\n成就普賢自在力，於一一眾生身中，普容納\n一切眾生身，令皆自謂成就佛身。以無著無縛\n解脫心，成就普賢自在力，能以一華莊嚴一\n切十方世界。以無著無縛解脫心，成就普賢\n自在力，出大音聲，普遍法界，周聞一切諸佛\n國土，攝受調伏一切眾生。以無著無縛解脫\n心，成就普賢自在力，盡未來際不可說不可\n說劫，於念念中悉能遍入一切世界，以佛神\n力，隨念莊嚴。以無著無縛解脫心，成就普賢\n自在力，盡未來際所住之劫，常能遍入一切\n世界，示現成佛出興於世。以無著無縛解脫\n心，成普賢行，一光普照盡虛空界一切世界。以\n無著無縛解脫心，成普賢行，得無量智慧，具\n\n一切神通，說種種法。以無著無縛解脫心，成\n普賢行，入於如來盡一切劫不可測量神通\n智慧。以無著無縛解脫心，成普賢行，住盡法\n界諸如來所，以佛神力修習一切諸菩薩行；\n身、口、意業，曾無懈倦。以無著無縛解脫心，成\n普賢行，不違於義，不壞於法，言辭清淨，樂\n說無盡；教化調伏一切眾生，令其當得一切諸\n佛無上菩提。以無著無縛解脫心，修普賢行，\n入一法門時，放無量光，照不思議一切法門；如\n一法門，一切法門皆亦如是通達無礙，究竟\n當得一切智地。以無著無縛解脫心，住菩薩\n行，於法自在，到於普賢莊嚴彼岸；於一一境\n界，皆以一切智觀察悟入，而一切智亦不窮\n盡。以無著無縛解脫心，始從此生盡未來際\n住普賢行，常不休息，得一切智，悟不可說不\n可說真實法，於法究竟，無有迷惑。以無著無\n縛解脫心，修普賢業，方便自在，得法光明，於\n諸菩薩所行之行照了無礙。以無著無縛解\n脫心，修普賢行，得一切方便智，知一切方便，\n所謂：無量方便、不思議方便、菩薩方便、一切\n智方便、一切菩薩調伏方便、轉無量法輪方\n便、不可說時方便、說種種法方便、無邊際無\n畏藏方便、說一切法無餘方便。以無著無縛\n解脫心，住普賢行，成就身業，令一切眾生見\n者歡喜，不生誹謗；發菩提心，永不退轉，究竟\n清淨。以無著無縛解脫心，修普賢行，得了一\n切眾生語言清淨智，一切言辭具足莊嚴，普\n應眾生，皆令歡喜。以無著無縛解脫心，住普\n賢行，立殊勝志，具清淨心，得廣大神通、廣大\n\n智慧，普詣一切廣大世間、廣大國土、廣大眾\n生所，說一切如來不可說廣大法、廣大莊嚴\n圓滿藏。以無著無縛解脫心，成滿普賢迴向\n行願，得一切佛清淨身、清淨心、清淨解，攝佛\n功德，住佛境界，智印普照，示現菩薩清淨之\n業，善入一切差別句義，示諸佛菩薩廣大自\n在，為一切眾生現成正覺。以無著無縛解脫\n心，勤修普賢諸根行願，得聰利根、調順根、\n一切法自在根、無盡根、勤修一切善根根、一\n切佛境界平等根、授一切菩薩不退轉記大\n精進根、了知一切佛法金剛界根、一切如來\n智慧光照金剛焰根、分別一切諸根自在根、\n安立無量眾生於一切智根、無邊廣大根、一\n切圓滿根、清淨無礙根。以無著無縛解脫心，\n修普賢行，得一切菩薩神力，所謂：無量廣大\n力神力、無量自在智神力、不動其身普現一\n切佛剎神力、無礙不斷自在神力、普攝一切\n佛剎置於一處神力、一身遍滿一切佛剎神\n力、無礙解脫遊戲神力、無所作一念自在神\n力、住無性無依神力、一毛孔中次第安立不\n可說世界遍遊法界諸佛道場示諸眾生皆令\n得入大智慧門神力。以無著無縛解脫心，入\n普賢門，生菩薩行，以自在智，於一念頃普入\n無量諸佛國土，一身容受無量佛剎，獲能嚴\n淨佛國土智，恒以智慧觀見無邊諸佛國土，\n永不發起二乘之心。以無著無縛解脫心，修\n普賢方便行，入智慧境界，生如來家，住菩薩\n道，具足不可說不可說無量不思議殊勝心，\n行無量願未曾休息，了知三世一切法界。以\n\n無著無縛解脫心，成就普賢清淨法門，於一\n毛端量處悉包容盡虛空遍法界不可說不\n可說一切國土，皆使明見；如一毛端量處，遍\n法界、虛空界一一毛端量處悉亦如是。以無\n著無縛解脫心，成就普賢深心方便，於一念\n心中現一眾生不可說不可說劫念心，如是\n乃至現一切眾生爾許劫念心。以無著無縛\n解脫心，入普賢迴向，行方便地，於一身中\n悉能包納盡法界不可說不可說身，而眾生\n界無所增減；如一身，乃至周遍法界一切身\n悉亦如是。以無著無縛解脫心，成就普賢大\n願方便，捨離一切想倒、心倒、見倒，普入一切\n諸佛境界；常見諸佛虛空界等清淨法身，相\n好莊嚴，神力自在；常以妙音開示演說無礙\n無斷，令其聞者如說受持，於如來身了無所\n得。以無著無縛解脫心，修普賢行，住菩薩地，\n於一念中入一切世界，所謂：入仰世界、覆世\n界、不可說不可說十方網一切處廣大世界，\n以因陀羅網分別方便普分別一切法界，以\n種種世界入一世界，以不可說不可說無量\n世界入一世界，以一切法界所安立無量世\n界入一世界，以一切虛空界所安立無量世\n界入一世界，而亦不壞安立之相，悉令明見。\n以無著無縛解脫心，修習普賢菩薩行願，得\n佛灌頂，於一念中入方便地，成滿安住眾行\n智寶；悉能了知一切諸想，所謂：眾生想、法想、\n剎想、方想、佛想、世想、業想、行想、界想、解想、根\n想、時想、持想、煩惱想、清淨想、成熟想、見佛想、\n轉法輪想、聞法解了想、調伏想、無量想、出離\n\n想、種種地想、無量地想、菩薩了知想、菩薩修\n習想、菩薩三昧想、菩薩三昧起想、菩薩成想、\n菩薩壞想、菩薩沒想、菩薩生想、菩薩解脫想、\n菩薩自在想、菩薩住持想、菩薩境界想、劫成\n壞想、明想、闇想、晝想、夜想、半月一月一時一\n歲變異想、去想、來想、住想、坐想、睡想、覺想——\n如是等想，於一念中悉能了知，而離一切想\n無所分別；斷一切障，無所執著；一切佛智充\n滿其心，一切佛法長其善根，與諸如來等同\n一身，一切諸佛之所攝取，離垢清淨，一切佛\n法皆隨修學到於彼岸。以無著無縛解脫心，\n為一切眾生修普賢行，生大智寶，於一一心\n中知無量心，隨其依止，隨其分別，隨其種\n性，隨其所作，隨其業用，隨其相狀，隨其思\n覺，種種不同靡不明見。以無著無縛解脫心，\n成就普賢大願智寶，於一處中知於無量不\n可說處；如於一處，於一切處悉亦如是。以無\n著無縛解脫心，修習普賢行業智地，於一業\n中能知無量不可說不可說業，其業各以種\n種緣造，明了知見；如於一業，於一切業悉亦\n如是。以無著無縛解脫心，修習普賢知諸法\n智，於一法中知不可說不可說法，於一切法\n中而知一法；如是諸法，各各差別，無有障\n礙，無違無著。以無著無縛解脫心，住菩薩行，\n得具普賢無礙耳根，於一言音中知不可說\n不可說言音無量無邊種種差別而無所著；\n如於一言音，於一切言音悉亦如是。以無著\n無縛解脫心，修普賢智，起普賢行，住普賢\n地，於一一法中演說不可說不可說法；其法\n\n廣大，種種差別教化攝受，不可思議方便相\n應；於無量時，於一切時，隨諸眾生所有欲\n解，隨根隨時，以佛音聲而為說法；以一妙\n音，令不可說道場眾會無量眾生皆悉歡喜，\n一如來所無量菩薩充滿法界；立殊勝志，\n生廣大見，究竟了知一切諸行，住普賢地，隨\n所說法，於念念中悉能證入，一剎那頃增長\n無量不可說不可說大智慧聚；盡未來劫如\n是演說，於一切剎修習廣大虛空等行，成就\n圓滿。以無著無縛解脫心，修習普賢諸根行\n門，成大行王，於一一根中悉能了知無量諸\n根、無量心樂、不思議境界所生妙行。以無著\n無縛解脫心，住普賢行大迴向心，得色甚微\n細智、身甚微細智、剎甚微細智、劫甚微細智、\n世甚微細智、方甚微細智、時甚微細智、數甚\n微細智、業報甚微細智、清淨甚微細智——如是\n等一切甚微細，於一念中悉能了知，而心不\n恐怖，心不迷惑、不亂、不散、不濁、不劣；其心一\n緣，心善寂定，心善分別，心善安住。以無著無\n縛解脫心，住菩薩智，修普賢行，無有懈倦，能\n知一切眾生趣甚微細、眾生死甚微細、眾生\n生甚微細、眾生住甚微細、眾生處甚微細、眾\n生品類甚微細、眾生境界甚微細、眾生行甚\n微細、眾生取甚微細、眾生攀緣甚微細——如是\n等一切甚微細，於一念中悉能了知。以無著\n無縛解脫心，立深志樂，修普賢行，能知一切\n菩薩從初發心為一切眾生修菩薩行甚微\n細、菩薩住處甚微細、菩薩神通甚微細、菩薩\n遊行無量佛剎甚微細、菩薩法光明甚微細、\n\n菩薩清淨眼甚微細、菩薩成就殊勝心甚微\n細、菩薩往詣一切如來道場眾會甚微細、菩\n薩陀羅尼門智甚微細、菩薩無量無畏地一\n切辯才藏演說甚微細、菩薩無量三昧相甚\n微細、菩薩見一切佛三昧智甚微細、菩薩甚\n深三昧智甚微細、菩薩大莊嚴三昧智甚微\n細、菩薩法界三昧智甚微細、菩薩大自在神\n通三昧智甚微細、菩薩盡未來際廣大行住\n持三昧智甚微細、菩薩出生無量差別三昧\n智甚微細、菩薩出生一切諸佛前勤修供養\n恒不捨離三昧智甚微細、菩薩修行一切甚\n深廣博無障無礙三昧智甚微細、菩薩究竟\n一切智地住持行智地大神通地決定義地離\n翳三昧智甚微細——如是等一切甚微細，悉能\n了知。以無著無縛解脫心，修普賢行，悉知一\n切菩薩安立智甚微細、菩薩地甚微細、菩薩\n無量行甚微細、菩薩出生迴向甚微細、菩薩\n得一切佛藏甚微細、菩薩觀察智甚微細、菩\n薩神通願力甚微細、菩薩演說三昧甚微細、\n菩薩自在方便甚微細、菩薩印甚微細、菩薩\n一生補處甚微細、菩薩生兜率天甚微細、菩\n薩住止天宮甚微細、菩薩嚴淨佛國甚微細、\n菩薩觀察人中甚微細、菩薩放大光明甚微\n細、菩薩種族殊勝甚微細、菩薩道場眾會甚\n微細、菩薩遍一切世界受生甚微細、菩薩於\n一身示現一切身命終甚微細、菩薩入母胎\n甚微細、菩薩住母胎甚微細、菩薩在母胎中\n自在示現一切法界道場眾會甚微細、菩薩\n在母胎中示現一切佛神力甚微細、菩薩示\n\n現誕生事甚微細、菩薩師子遊行七步智甚\n微細、菩薩示處王宮巧方便智甚微細、菩薩\n出家修調伏行甚微細、菩薩菩提樹下坐道\n場甚微細、菩薩破魔軍眾成阿耨多羅三藐\n三菩提甚微細、如來坐菩提座放大光明照\n十方界甚微細、如來示現無量神變甚微細、\n如來師子吼大涅槃甚微細、如來調伏一切\n眾生而無所礙甚微細、如來不思議自在力\n如金剛菩提心甚微細、如來普護念一切世\n間境界甚微細、如來普於一切世界施作佛\n事盡未來劫而無休息甚微細、如來無礙神\n力周遍法界甚微細、如來於盡虛空界一切\n世界普現成佛調伏眾生甚微細、如來於一\n佛身現無量佛身甚微細、如來於去來今三\n世中皆處道場自在智甚微細——如是等一切\n微細悉能了知；成就清淨，普能示現一切世\n間；於念念中增長智慧，圓滿不退；善巧方\n便修菩薩行，無有休息；成就普賢迴向之地，\n具足一切如來功德，永不厭捨菩薩所行，出\n生菩薩現前境界；無量方便皆悉清淨，普欲\n安隱一切眾生；修菩薩行，成就菩薩大威德\n地，得諸菩薩心之樂欲，獲金剛幢迴向之門，\n出生法界諸功德藏，常為諸佛之所護念；入\n諸菩薩深妙法門，演說一切真實之義，於法\n善巧無所違失，起大誓願不捨眾生；於一念\n中盡知一切心、非心地境界之藏，於非心處\n示生於心；遠離語言，安住智慧，同諸菩薩所\n行之行，以自在力示成佛道，盡未來際常無\n休息；一切世間眾生劫數，妄想言說之所建\n\n立，神通願力悉能示現。以無著無縛解脫心，\n修普賢行，得一切眾生界甚微細智，所謂：眾\n生界分別甚微細智、眾生界言說甚微細智、\n眾生界執著甚微細智、眾生界異類甚微細\n智、眾生界同類甚微細智、眾生界無量趣甚\n微細智、眾生界不思議種種分別所作甚微\n細智、眾生界無量雜染甚微細智、眾生界無\n量清淨甚微細智——如是等一切眾生界境界甚\n微細，於一念中能以智慧皆如實知；廣攝眾\n生而為說法，開示種種清淨法門，令修菩薩\n廣大智慧；化身無量，見者歡喜，以智日光照\n菩薩心，令其開悟智慧自在。以無著無縛解\n脫心，為一切眾生於一切世界修普賢行，得\n盡虛空界、法界、一切世界甚微細智，所謂：小\n世界甚微細智、大世界甚微細智、雜染世界\n甚微細智、清淨世界甚微細智、無比世界甚\n微細智、種種世界甚微細智、廣世界甚微細\n智、狹世界甚微細智、無礙莊嚴世界甚微細\n智、遍一切世界佛出現甚微細智、遍一切世\n界說正法甚微細智、遍一切世界普現身甚\n微細智、遍一切世界放大光明甚微細智、盡\n一切世界示現諸佛自在神通甚微細智、盡\n一切世界以一音聲示一切音甚微細智、入\n一切世界一切佛剎道場眾會甚微細智、以\n一切法界佛剎作一佛剎甚微細智、以一佛\n剎作一切法界佛剎甚微細智、知一切世界\n如夢甚微細智、知一切世界如像甚微細智、\n知一切世界如幻甚微細智；如是了知出生\n一切菩薩之道，入普賢行智慧神通，具普賢\n\n觀，修菩薩行，常無休息；得一切佛自在神變，\n具無礙身，住無依智，於諸善法無所取著，心\n之所行悉無所得；於一切處起遠離想，於菩\n薩行起淨修想，於一切智無取著想，以諸三\n昧而自莊嚴，智慧隨順一切法界。以無著無\n縛解脫心，入普賢菩薩行門，得無量法界甚\n微細智、演說一切法界甚微細智、入廣大法\n界甚微細智、分別不思議法界甚微細智、分\n別一切法界甚微細智、一念遍一切法界甚\n微細智、普入一切法界甚微細智、知一切法\n界無所得甚微細智、觀一切法界無所礙甚\n微細智、知一切法界無有生甚微細智、於一\n切法界現神變甚微細智——如是等一切法界甚\n微細，以廣大智皆如實知；於法自在，示普賢\n行，令諸眾生皆悉滿足；不捨於義，不著於法，\n出生平等無礙之智；知無礙本，不住一切法，\n不壞諸法性，如實無染，猶若虛空，隨順世間\n起於言說；開真實義，示寂滅性，於一切境無\n依、無住、無有分別；明見法界，廣大安立，了諸\n世間及一切法平等無二，離一切著。以無著\n無縛解脫心，修普賢行，生諸劫甚微細智，所\n謂：以不可說劫為一念甚微細智、以一念為\n不可說劫甚微細智、以阿僧祇劫入一劫甚\n微細智、以一劫入阿僧祇劫甚微細智、以長\n劫入短劫甚微細智、以短劫入長劫甚微細\n智、入有佛劫無佛劫甚微細智、知一切劫數\n甚微細智、知一切劫非劫甚微細智、一念中\n見三世一切劫甚微細智——如是等一切諸劫甚\n微細，以如來智，於一念中皆如實知；得諸菩\n\n薩圓滿行王心、入普賢行心、離一切分別異\n道戲論心、發大願無懈息心、普見無量世界\n網無量諸佛充滿心、於諸佛善根諸菩薩行\n能聞持心、於安慰一切眾生廣大行聞已不\n忘心、能於一切劫現佛出世心、於一一世界\n盡未來際行不動行無休息心、於一切世界\n中以如來身業充滿菩薩身心。以無著無縛\n解脫心，修普賢行，成不退轉，得一切法甚\n微細智，所謂：甚深法甚微細智、廣大法甚微\n細智、種種法甚微細智、莊嚴法甚微細智、一\n切法無有量甚微細智、一切法入一法甚微\n細智、一法入一切法甚微細智、一切法入非\n法甚微細智、無法中安立一切法而不相違\n甚微細智、入一切佛法方便無有餘甚微細\n智——如是等一切世界一切言說所安立法諸\n微細智，與彼同等，其智無礙，皆如實知；得入\n無邊法界心，於一一法界深心堅住，成無礙\n行；以一切智充滿諸根，入諸佛智，正念方\n便，成就諸佛廣大功德；遍滿法界，普入一切\n諸如來身，現諸菩薩所有身業，隨順一切世\n界言辭，演說於法；得一切佛神力所加智\n慧意業，出生無量善巧方便分別諸法薩婆\n若智。以無著無縛解脫心，修普賢行，出生一\n切甚微細智，所謂：知一切剎甚微細智、知一\n切眾生甚微細智、知一切法果報甚微細智、\n知一切眾生心甚微細智、知一切說法時甚\n微細智、知一切法界甚微細智、知一切盡虛\n空界三世甚微細智、知一切語言道甚微細\n智、知一切世間行甚微細智、知一切出世行\n\n甚微細智，乃至知一切如來道、一切菩薩道、\n一切眾生
