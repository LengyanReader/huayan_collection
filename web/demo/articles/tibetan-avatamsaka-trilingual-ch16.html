>\n\n**判定**：b2 bo_open 種子串與 ch14/15 同型錯切（舊 raw 偏移 off=614598 在 {T44-N} 標記插入後位移·系統性缺陷第三證）；本專題 seg1 為藏16 真開篇——不改對勘批 b2，僅登記本訂正\n\n**观察**：b2 ch16 之 bo_open（400 字·起 ་ཀྱི་ཞིང་བཅུའི་རྡུལ་ཤིན་ཏུ་ཕྲ་བ་སྙེད་དང་…·前導雜餘 tsheg＋佛剎微塵數段，與 ch14/15 同型粗切特徵）在本文件 {T44-16}…{T44-17} 區間 norm()（去葉碼標記）後 find=-1——不在藏16 章界內；本專題 seg1（དེ་ནས་བྱང་ཆུབ་སེམས་དཔའ་ཡེ་ཤེས་དཔལ་གྱིས་བྱང་ཆུབ་སེམས་དཔའ་འཇམ་…）自 {T44-16} 標記後逐字回源切出（char_off=0·folio 210b.2）\n\n**证据**（≥2 条独立佐证）：\n\n- b2 ch16 自記 fol=210b.2 ＝ 本專題 seg1 切片實測 folio=210b.2（同頁）\n- b2 ch16 zh80_open=「淨行品第十一爾時，智首菩薩問文殊師利菩薩言：佛子！菩薩云何得無過失身、語、意業…」＝品11 開篇智首問文殊，與本 seg1 義合（ཡེ་ཤེས་དཔལ〔智首〕告 འཇམ་དཔལ〔文殊〕·ཁ་ན་མ་ཐོ་བ་མེད་པའི་ལུས་ཀྱི་ལས〔無過失身業〕）\n- b2 ch16 correspondence 自藏文引文「ཁ་ན་མ་ཐོ་བ་མེད་པའི་ལུས་ཀྱི་ལས」即本 seg1 句，與 bo_open 字段自相矛盾——判 bo_open 串側錯切\n- 本 seg1 通過 extract_trilingual_segments.py 逐字 norm() 復驗（verified=true·char_off=0 即章首）；bo_open 區間 find=-1 經提取器同口徑 norm 復測\n\n**后续**：同 ch14/15——b2 全表 bo_open 回改屬對勘批 SSOT 變更須人工授權；M2 各章開工前逐章跑 G2.2 預檢\n\n**机器检查**：`workspace/tibetan-avatamsaka-translation/tools/check_trilingual_gates.py::p_opening_matches_alignment（不一致章須命中本檔 records 方 PASS）`\n\n</details>\n\n> 〔口径〕对勘批 `bo_open` 字段经 L.361 订正登记判为旧偏移错切，本页**不展示**该字段；藏文开篇一律以本专题逐字复验 seg1 为准。订正不改对勘批 SSOT（各照底本·铁律）。\n\n## 三、延伸阅读\n\n**本仓专篇与总纲**\n\n- [华严经引读 · 系列总纲（§五 藏汉对应总表）](huayan-series-outline.html)\n- [华严经学 · 三十九品深度研究](huayan-studies.html) — 藏独有二章之法义归属见 §2.3\n\n**开篇试译**（L.354a 术语表 · 〔本文试译〕）\n\n> 尔时，智首菩萨（ཡེ་ཤེས་དཔལ）告文殊师利菩萨言：「佛子！诸菩萨如何具足无过失（ཁ་ན་མ་ཐོ་བ་མེད་པ）之身业？如何具足无过失之语业？如何具足无过失之意业？如何身业不失坏（མ་ཉམས་པ）？如何语业不失坏？如何意业不失坏？如何身业无可讥嫌（མ་སྨད་པ）？如何语业无可讥嫌？……」\n\n**数据源清单**（本页内容全部机械派生自下列库存）\n\n- 三语段数据层：`data/translation\\tibetan_avatamsaka_trilingual_segments_ch16.json`\n- 对勘批：`data/alignment\\tibetan_zhuhuju_b2.json`\n- 开篇订正登记：`data/alignment/tibetan_trilingual_opening_reconcile.json`\n- 试译术语表：`data/alignment/tibetan_shiyi_L354a.json`\n- 品目规划表：`data/alignment/tibetan_chinese_pin_plan_L360.json`\n",

  var btns = document.querySelectorAll('.tri-btn[data-lay]');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('is-on', btns[i].getAttribute('data-lay') === (cols ? 'cols' : 'stack'));
  }
};
window.__triTab = function (i) {
  var root = document.getElementById('article-full');
  if (!root) return;
  // shell 另渲一个裸 h2 页题（无 secfold）→ pane 只取 h2.secfold
  var hs = root.querySelectorAll('h2.secfold');
  for (var j = 0; j < hs.length; j++) {
    var on = (j === i);
    if (on) { hs[j].classList.remove('is-folded'); hs[j].setAttribute('aria-expanded', 'true'); }
    hs[j].style.display = on ? '' : 'none';
    var b = hs[j].nextElementSibling;
    if (b && b.classList.contains('secfold-body')) b.style.display = on ? '' : 'none';
  }
  var btns = document.querySelectorAll('.tri-tab');
  for (var k = 0; k < btns.length; k++) btns[k].classList.toggle('is-on', k === i);
  try { localStorage.setItem('triTab:tibetan-avatamsaka-trilingual-ch16', String(i)); } catch (e) {}
};
(function () {
  function paneOf(el) {
    var root = document.getElementById('article-full');
    if (!root) return -1;
    var hs = root.querySelectorAll('h2.secfold');
    for (var i = 0; i < hs.length; i++) {
      if (el === hs[i]) return i;
      var b = hs[i].nextElementSibling;
      if (b && b.classList.contains('secfold-body') && b.contains(el)) return i;
    }
    return -1;
  }
  function fromHash() {
    var h = location.hash.slice(1);
    if (!h) return -1;
    var el = document.getElementById(h);
    return el ? paneOf(el) : -1;
  }
  function init() {
    var root = document.getElementById('article-full');
    if (!root || !root.querySelector('.secfold') || !root.querySelector('h2') || !root.querySelector('.tri-tabs')) return false;
    var hs = root.querySelectorAll('.secfold');
    for (var i = 0; i < hs.length; i++) {
      hs[i].classList.remove('is-folded');
      hs[i].setAttribute('aria-expanded', 'true');
    }
    // 窄屏页头换行可高达 200px+，固定 scroll-margin 会把锚点藏进页头 → 按实高同步
    function syncGap() {
      var top = document.getElementById('page-top');
      var gap = (top ? top.offsetHeight : 0) + 12;
      var as = document.querySelectorAll('.tri-anchor');
      for (var i = 0; i < as.length; i++) as[i].style.scrollMarginTop = gap + 'px';
    }
    syncGap();
    window.addEventListener('resize', syncGap);
    var lay = 'stack';
    try { lay = localStorage.getItem('triLayout') || 'stack'; } catch (e) {}
    window.__triLayout(lay);
    var tab = fromHash();
    if (tab < 0) {
      try { tab = parseInt(localStorage.getItem('triTab:tibetan-avatamsaka-trilingual-ch16') || '0', 10) || 0; } catch (e) { tab = 0; }
    }
    if (tab >= root.querySelectorAll('h2.secfold').length) tab = 0;
    window.__triTab(tab);
    root.addEventListener('click', function (e) {
      var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
      if (!a) return;
      var el = document.getElementById(a.getAttribute('href').slice(1));
      if (!el) return;
      e.preventDefault();
      var p = paneOf(el);
      if (p >= 0) window.__triTab(p);
      if (window._reveal) window._reveal(el);
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (history.replaceState) history.replaceState(null, '', a.getAttribute('href'));
    });
    window.addEventListener('hashchange', function () {
      var p = fromHash();
      if (p >= 0) window.__triTab(p);
    });
    return true;
  }
  function poll(n) { if (init()) return; if (n > 0) setTimeout(function () { poll(n - 1); }, 120); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { poll(20); });
  else poll(20);
})();
</script>
