<script>
var ARTICLE = {"id": "master-litongxuan", "file": "articles/master-litongxuan.html", "title": "李通玄（枣柏大士）", "title_sub": "华严祖师 · 在家学者", "icon": "🧑", "version": "", "meta": "", "doc": "docs/李通玄长者_综合深度研究.md", "doc_md": "# 李通玄长者：生平、思想、传承与文化史地位综合深度研究\n\n> 研究说明：本文延续《圭峰宗密综合深度研究》《华严宗初祖杜顺综合深度研究》《华严宗二祖智俨综合深度研究》三文的方法论与结构，依据可回溯、可核验的资料展开，对史料分歧或学界争议之处以\"存疑\"标出。李通玄是本系列研究中第一位\"在官方五祖谱系之外\"的人物——他不是僧人而是居士，不属于杜顺—智俨—法藏这一支传统法脉，\"学无常师\"，其生平史料又比前三位祖师更多神话色彩，也更多层累建构的痕迹。本文将特别注意区分早期史源与后出传说，并如实呈现学界对此已有的批判性研究成果。\n\n---\n\n## 前言\n\n在华严宗的历史叙事中，李通玄（635—730）是一个近乎\"异数\"的存在。他不是僧人，而是终身未曾剃度的在家居士；他没有明确的师承，\"天赋异禀，学无常师\"；他不属于杜顺—智俨—法藏—澄观—宗密这一支被后世追认为\"正统\"的祖师谱系，甚至终其一生大概率都未曾与这一法脉的任何一位在世传人有过交集。然而，正是这样一位\"局外人\"，独立撰成四十卷《新华严经论》，以一套完全自出机杼、与法藏\"五教十宗\"迥然不同的判教体系，以及\"以易解华严\"这一贯通儒佛的独特诠释路径，在华严思想史上开辟出与官方法脉平行、却同样深远的另一条河道——这条河道后来经由高丽普照知讷的节要、明代李贽与紫柏真可周边士人的重新发现，持续流淌至今，其影响甚至超出了\"正统\"法脉在民间与域外的传播广度。本文即尝试对这位\"学者乎？神人乎？\"（借用日本学者邢东风的设问）的传奇人物，作一次尽可能全面、审慎、且注重辨析史源层次的深度研究。\n\n---\n\n## 一、全球多语言背景下的学术研究成果\n\n### 1.1 中文学界\n\n中文学界对李通玄的研究，近三十年来出现了明显的升温趋势，且呈现出多学科交叉的特征。较早的系统性论述见于周叔迦（现代中国佛教学术奠基性人物之一）的《周叔迦佛学论著集》，其中已有专门篇幅讨论李通玄思想。进入21世纪后，专题研究显著增多：邱高兴〈以《易》解《华严经》——李通玄对《华严经》的新诠释〉（《周易研究》2000年第1期）是较早从易学专业期刊角度切入的重要论文；朱慧〈李通玄以易解华严思想研究〉（中山大学硕士学位论文，2009）与洪梅珍〈李通玄及其华严学之研究〉（高雄师范大学博士学位论文，2010）是海峡两岸较早的专题学位论文；刘媛媛〈\"以易解华严\"——李通玄的\"周易表法\"思想新探〉（《中华文化论坛》2017年第9期）则在前人基础上提出\"周易表法\"这一更具概括力的术语，系统梳理了李通玄如何借用《周易》卦爻、方位、数字体系来\"表法\"（即以易学符号系统对应、诠释华严教理阶位）。此外，据出版信息可查，另有以《李通玄华严思想研究》为题的专著，系统覆盖其判教思想、\"智体论\"\"缘起观\"\"一真法界\"思想、以顿悟为基础的解脱论、\"表法思想\"与\"配法观心\"思想，以及其思想的历史影响，可见中文学界对李通玄思想的把握已相当全面深入。\n\n尤其值得郑重介绍的，是日本国立爱媛大学法文学部教授邢东风提交2017年\"华严专宗国际学术研讨会\"的论文〈学者乎？神人乎？——从神话传说看历史上的李长者像〉。**这篇论文以极为审慎的文献学方法，逐层辨析了李通玄传记材料中\"早期史源\"与\"后出传说\"之间的层次差异**——他指出，成文于李通玄身后约四十年、由其亲炙弟子照明所撰的〈华严经决疑论序〉，是现存最早、也最可信的传记材料，其中对李通玄的记载虽已带有相当的敬仰、乃至将其比拟于文殊、普贤\"幻有\"之化现，但并未出现后世广为流传的\"猛虎驮经\"\"双鹤化女子送食\"等具体神异情节；而这些更具戏剧性的神异细节，实际上是在李通玄身后一百七十余年、伴随着寿阳方山一座新建寺院（僧人法弘所建）需要为自身正当性寻求依托而逐步建构、附会出来的。**这一研究方法与本文姊妹篇《华严宗初祖杜顺综合深度研究》第二章2.6节所引王璞对杜顺神异叙事的韦伯式社会学分析、以及第三章对吉美罗\"祛魅式重读\"方法的介绍，在方法论精神上高度一致，将在本文第四、五章详细援引。**\n\n### 1.2 日文学界\n\n日本学界对李通玄的专题研究，以稲岡智賢的两篇论文最具奠基性：〈李通玄の伝記について〉（〈论李通玄的传记〉，《印度学佛教学研究》第34卷第1号，1981年，页258—263）与〈李通玄における信について〉（〈论李通玄的\"信\"〉，《印度学佛教学研究》第29卷第1号，1980年，页343—346）——前者系统整理、比对了现存各种李通玄传记材料之间的异同与矛盾（本文第五章关于生卒年、籍贯争议的讨论多参照此文思路展开），后者则专门探讨李通玄思想中\"信\"这一范畴的独特意涵。此外，另有一篇标题可考、但作者信息本文检索未能完全确认的日文论文〈華嚴経と中國思想をつなぐもの——李通玄の華嚴経の解釈をめぐって〉（〈连结华严经与中国思想者——围绕李通玄对华严经的解释〉），从题目即可见其关注焦点正是李通玄\"以中国思想（易学）沟通印度经典（华严经）\"这一核心特质。镰田茂雄在其《華厳の思想》（1988，讲谈社）中，作为已系统覆盖澄观、宗密（详见本系列前两篇文章相关章节）的权威华严思想通史著作，同样应当论及李通玄——惟笔者未能获取该书关于李通玄部分的具体页码与论述细节，此处存疑列出，供读者自行查证。\n\n### 1.3 英语学界\n\n英语学界对李通玄的研究，奠基性著作是**吉美罗（Robert M. Gimello）**的长篇论文〈李通玄与华严的实践面向〉（\"Li T'ung-hsüan and the Practical Dimensions of Hua-yen\"），收入吉美罗与葛雷戈里（Peter N. Gregory）合编的《禅与华严研究》（*Studies in Ch'an and Hua-yen*，夏威夷大学出版社，1983，页321—390）——这是本系列研究已多次援引的同一部里程碑式论文集，其中吉美罗关于智俨的研究、卜睿德（Jeffrey Broughton）关于西藏早期禅宗流派的研究、葛雷戈里关于华严传统中在家佛教实践的教理与社会基础的研究（\"The Teaching of Men and Gods: The Doctrinal and Social Basis of Lay Buddhist Practice in the Hua-yen Tradition\"，同书页253—320，与李通玄的居士身份直接相关），共同构成了二十世纪八十年代英语学界研究中古中国禅、华严交涉史最重要的一批基础文献。**吉美罗此文的一大贡献，是在附录中提供了\"现存最早的李通玄圣传英译\"（A Translation of the Earliest Surviving Hagiography of Li T'ung-hsün）——即约770年由马支所撰〈李长者事迹〉（收《全唐文》卷0816）的完整英译**，这与前述邢东风论文所重点辨析的\"早期史源\"实为同一份关键文献，足见中日美三地学者不约而同地将这份材料视为理解李通玄生平最核心的文献基石。\n\n近年英语学界的后续研究更为丰富：**苏承学（Seunghak Koh，音译，现供职于韩国东国大学佛教学术院）**的加州大学洛杉矶分校博士论文《李通玄（635—730）的思想及其在中国佛教华严传统中的地位》（*Li Tongxuan's (635-730) Thought and His Place in the Huayan Tradition of Chinese Buddhism*，2011）是目前所知最新、也最系统的英语学界专题研究；他另有论文〈李通玄对华严经阐释中对中国象征体系的运用〉（*Li Tongxuan's Utilization of Chinese Symbolism in the Explication of the Avataṃasaka-sūtra*，*Asian Philosophy* 20/2，2010，页141—158），与前述邱高兴、刘媛媛等中文论文的问题意识高度呼应，形成了中英学界在这一具体议题上的隔空对话。朴文永（Jin Y. Park）〈李通玄华严佛教中的时间性与非时间性〉（\"Temporality and Non-temporality in Li Tongxuan's Huayan Buddhism\"，收入《道家与中国佛教哲学指南》，施普林格出版社，2018）则从比较哲学角度，专门探讨李通玄判教体系中（详见第四章4.1节）\"于刹那之际通摄三世及十世圆融\"这一极具特色的时间哲学命题。此外，匈牙利华严学者韩明士（Imre Hamar，本系列此前研究已多次提及其关于澄观\"四法界\"理论及华严\"性起\"思想的论著）2007年的相关论文亦有所论及；柯睿思（Thomas Cleary）《入不可思议之境》（1993年版）第16页对李通玄有所介绍；顾立雅（Francis H. Cook）〈华严佛教中毗卢遮那的意涵〉（1972）虽非专论李通玄，但作为华严\"性起\"思想的经典研究，构成理解李通玄相关论述的重要背景。\n\n### 1.4 韩语学界\n\n据吉美罗、朴文永等英语学界论著的参考文献显示，韩语学界对李通玄亦有专门研究，其中海住스님（Haeju sunim）《화엄의 세계》（《华严的世界》，首尔：民族社，1999）是被英语学界多次征引的韩文重要著作。**韩语学界对李通玄的关注，与本文第六章将详述的高丽普照知讷（1158—1210）直接节录、改写李通玄《新华严经论》而成《华严论节要》这一历史渊源密不可分**——李通玄的思想在朝鲜半岛佛教传统中，透过知讷这一关键中介，获得了甚至比在中国本土更为持续、更为深植的传承生命力，这使得韩语学界对其展开专题研究，具有格外贴切的历史正当性。\n\n### 1.5 学术争议与存疑问题小结\n\n综合上述多语种研究，本文认为以下几项争议最值得读者留意，并将在后续章节详细展开：\n1. **生卒年**：中文学界普遍采信\"635—730，享年96岁\"说，但英语学界转引日本学者稲岡智賢1981年对现存各种传记材料的比对研究显示，另有材料记载其生年为735或746——**这些数字与730年的卒年及\"96岁\"享年之间存在难以调和的内在矛盾，本文倾向于将其理解为不同传记文献在层累传抄过程中产生的讹误或异说，而非可与\"635年\"说并列的同等可信选项，但仍将其存目列出，供读者知悉学界文献比对工作的复杂程度**；\n2. **籍贯与家世**：河北沧州人 vs. 太原（今山西）人，两说并存；\"唐之帝胄\"（据《宋高僧传》）究竟是确凿史实还是身后的地位建构，\"不知何王院之子孙\"这一原始表述本身已暗示了相当程度的不确定性；\n3. **神异传说的层累建构过程**：邢东风论文对\"猛虎驮经\"\"双鹤化女子\"等情节晚出性质的考证（详见1.1节），是本文第五章处理其生平史料时最重要的方法论依据；\n4. **他与官方\"五祖\"谱系的关系**：终身未被纳入任何版本的华严宗祖统排列（无论五祖、七祖抑或日本凝然的十祖说），这一\"局外人\"地位本身的历史成因与思想史意涵，将在第三、六章专门讨论。\n\n---\n\n## 二、佛门内部、跨宗派与跨宗教视角\n\n### 2.1 华严宗内部的定位：\"法藏一系以外，别树一帜\"\n\n现代权威工具书性质的《中国佛教人物》辞条对李通玄在华严宗内部的定位给出了极为精炼的概括：\"他在智俨、法藏一系以外，别树一帜，于华严一宗传统的学说，有不少的变更。\"这一评价并非现代学者的孤立判断，而是有唐代原始文献为据——为《新华严经论》作序的僧人志宁在《华严经合论序》中即已明言：\"其论所明，与诸家疏义稍有差别。\"**更值得注意的是，李通玄本人对这一\"别树一帜\"的自我定位有清醒的自觉：\"通玄自己也说他的分宗立教，和先德所立有少分不同。但大体仍不出法界圆融的义旨。\"**这段自述极具分寸感：他并不否认自己的判教体系（详见第四章4.1节）与\"先德\"（即智俨、法藏所代表的既有传统）存在实质差异，但同时明确表示，这种差异是方法论、体系建构层面的，而非对华严\"法界圆融\"这一根本宗旨的背离。这种\"承认差异、但不脱离根本宗旨\"的自我定位，是理解李通玄与官方法脉关系时必须把握的关键分寸。\n\n### 2.2 三家竞作注疏：与澄观、慧苑同为新译《华严经》的独立诠释者\n\n中国社会科学网所刊学术文章提供了一个极具启发性的历史定位框架：\"八十卷《华严经》译出后，慧苑、澄观、李通玄等人为新译本竞作注疏，根据新译本探索华严理论，内地华严学激起新的热潮。\"**这一\"三家竞作\"的框架值得特别重视：证圣元年（695）实叉难陀奉武则天之诏译出八十卷《新华严经》后，几乎在同一历史时段内，出现了三条彼此独立、却都以这部新译经典为共同文本基础的诠释路径——法藏嫡传弟子慧苑（其诠释因与澄观立场相左，日后遭到澄观严厉批判，并被排除出华严\"五祖\"谱系之外，详见本系列第一篇文章《宗密综合深度研究》第三章相关讨论）代表法藏一系内部的\"歧出\"；澄观的《华严经疏》代表对法藏正统的继承与修正，日后发展为官方认可的\"四祖\"地位；而李通玄的《新华严经论》，则是完全独立于这一师承脉络之外、由一位居士以自学方式独立完成的第三条诠释路径。**三者共享同一部新译经典文本，却分别导向了截然不同的历史命运——澄观一系成为官方正统，慧苑一系被判为异端而边缘化，李通玄一系则长期\"墙内开花墙外香\"，在官方谱系之外独立流传，最终透过高丽知讷、明代李贽等\"局外\"渠道获得了持久的生命力（详见第六章）。这一\"三家竞作、三种命运\"的格局，本身即是理解八世纪初中国华严思想内部多元性与竞争性的一个极佳案例。\n\n### 2.3 以易解华严：儒佛会通的独特路径\n\n李通玄思想中最具标志性、也是学界研究最为集中的特质，是他\"以《易》解《华严经》\"的诠释方法（详见第四章4.2节的具体展开）。佛教导航所刊邱高兴文章对此一路径的思想史意义作了精当的定位：\"《易》与《华严经》分别作为儒佛两家的经典，实际上代表了中国传统文化与由印度传入的佛教之间的差别，而这种差别正是佛教被攻击的一个方面……因此佛教从传入之初便面临适应中国国情的任务，许多佛教思想家从不同的侧面论述了佛教与中国传统的相容与一致性。李通玄尝试以《易》解释《华严经》，沟通儒佛，就是这种工作的一部分。\"**这一定位将李通玄置于一个宏大的思想史脉络之中——即整个中古佛教\"中国化\"进程中，历代思想家为回应儒家\"华夷之防\"\"不孝不敬\"等排佛论述（详见本系列《宗密综合深度研究》第二章2.4节所论宗密《原人论》与韩愈《原人》一文的隐性对话）而作出的种种调适努力。与宗密《原人论》透过层级化判教、将儒道二家收摄为\"末教\"这一较为对抗性、辩驳性的策略不同，李通玄的路径更为内在、更为融合——他不是在论战框架中\"驳斥后收编\"儒家经典，而是直接借用《周易》本身的符号系统（卦爻、方位、数字）作为诠释《华严经》教理阶位的工具，使儒家经典本身成为解经的方法论资源，而非仅仅是需要被安置、被超越的对象。**这是一种远比宗密的策略更为\"内在化\"的儒佛会通方式，值得读者细加体味二者路径之别。\n\n### 2.4 与天台宗、法相宗的判教对话\n\n李通玄独立建构的\"十宗\"\"十教\"判教体系（详见第四章4.1节），本身即是与天台、法相（唯识）等宗既有判教传统展开对话、竞争的产物——其\"十宗\"分类中，径列《解深密经》（法相唯识根本经典之一，\"以不空不有为宗\"）、《楞伽经》（\"以五法、三自性、八识、二无我为宗\"）等唯识系统经典，也列《法华经》（\"以会权就实为宗\"，天台宗根本经典）、《涅槃经》等，最终以《华严经》\"根本佛乘\"压轴——**这一编排方式与法藏\"五教十宗\"体系一样，都是将《华严经》置于诸经之巅的层级化判摄，但具体的分类逻辑、经典配置与理论侧重都自成一格，形成了与法藏系统、乃至与天台\"化法四教\"体系三足鼎立的又一套独立判教方案。**尤其值得注意的是李通玄\"十教\"体系第八时对《华严经》的定位：\"于刹那之际通摄三世及十世圆融无始终前后通该教\"——这一强调\"刹那圆融\"\"无始终\"的时间哲学表述，是李通玄判教体系中最具原创性的部分之一，也是朴文永〈李通玄华严佛教中的时间性与非时间性〉一文的核心讨论对象（详见1.3节）。\n\n### 2.5 与净土信仰、道教及民间信仰的关系\n\n**关于李通玄与净土信仰的直接关系，现有可查证材料相对有限，本文未能找到如杜顺\"劝人念阿弥陀佛\"（详见《杜顺综合深度研究》第二章2.3节）一类的明确记载，此处存疑，不作过度延伸。**至于道教及民间信仰的关系，则主要体现在其身后神异传说的具体形态之中——如第五章将详述的\"白鹤化女子\"传说，据邢东风的考证，这类\"仙鹤化人\"母题本身即带有浓厚的中国本土道教、民间信仰色彩（而非纯粹佛教的神异叙事母题），这从一个侧面反映出李通玄身后形象的建构过程中，本土民间信仰资源的渗透与融入——这与他生前\"以易解华严\"这一主动、自觉的儒佛会通工作形成了有趣的对照：前者是李通玄本人生前的思想自觉，后者则是他身后、由他人（很可能是出于特定寺院的建寺需求）附加上去的、非其本意的形象建构，二者的\"融合\"性质截然不同，读者应予明辨（详见第五章5.4节的详细辨析）。\n\n### 2.6 现代跨学科视角：时间哲学与比较宗教研究\n\n如1.3节所述，朴文永〈李通玄华严佛教中的时间性与非时间性〉一文，代表了当代比较哲学视角对李通玄思想的重新发掘——将其判教体系中\"刹那圆融、无始无终\"的时间哲学命题，置于更广阔的东西方哲学比较视野中加以考察。**这一研究取向提示我们，李通玄这套一千三百年前由一位隐居居士独立建构的判教体系，其中所蕴含的时间哲学洞见，在当代学术语境下依然具有可供严肃哲学讨论的理论价值，而非仅仅是佛教内部的历史文献。**这与本系列此前研究中提及的、宗密\"教禅一致\"思想在当代宗教多元主义讨论中的持续回响（详见《宗密综合深度研究》第二章2.6节），构成了华严思想遗产在现代学术语境下持续焕发新生命力的又一例证。\n\n---\n\n## 三、李通玄的师承：\"学无常师\"与自我建构的正当性\n\n本章处理一个对理解李通玄至关重要、却与本系列前三篇研究截然不同的课题——**杜顺、智俨、法藏都有或明或暗、或详或略的师承线索可考（详见《杜顺综合深度研究》第三章、《智俨综合深度研究》第三章），而李通玄，据现存最权威的工具书性质总结，是\"天赋异禀，学无常师\"（佛学大词典语）——即传统上明确认定他没有固定的授业之师。这一\"无师自通\"的定位，既是理解他何以能够建构出一套完全独立于官方法脉之外的判教体系的关键，也是他终身未能、或者说不需要被纳入官方\"祖统\"谱系的根本原因。**\n\n### 3.1 早年习易与游历：\"住无常所，随所行处而居\"\n\n据佛教导航所刊邱高兴文章及多方史料综合，李通玄\"年轻时一边研究易理，一边游历名山大川，住无常所，随所行处，择地而居\"——**这是一幅与杜顺\"终南山定居修行\"、智俨\"至相寺—云华寺\"相对固定驻锡地的求学模式截然不同的图景：青年李通玄的知识养成路径，是一种无固定师门依托、无固定居所的自主游学，其研习对象也并非佛教经论，而首先是儒家经典《周易》。**这一\"先儒后佛\"的知识养成顺序（\"青年时钻研易理，到四十余岁时，专攻佛典，潜心《华严》\"），对理解他日后\"以易解华严\"这一标志性诠释方法（详见第四章4.2节）具有决定性的先在意义——他并非先建立起佛教教理框架、再回头援引易学作为辅助工具，而是本身就以易学训练为其最初、最根本的思维方式，佛教（尤其是《华严经》）反而是他中年以后方才系统接触、并自觉地用其既有的易学思维框架加以消化、诠释的\"后来者\"。\n\n### 3.2 转向华严的契机：新译华严与五台山\"异僧\"授旨传说\n\n关于李通玄转向专攻《华严经》的具体契机，史料记载略有出入，但均指向两个关键节点。其一，**外部契机**：\"当时正值八十《华严》译成\"——即证圣元年（695）实叉难陀奉武则天之诏译出的新译《华严经》，为李通玄提供了一部此前从未有人以独立方式详加诠释的全新文本基础（详见2.2节\"三家竞作\"的讨论）。其二，**内在契机**：据佛教导航文章转引《居士传》卷十五（收入《卍新纂续藏经》乙编第二十二套）的记载，李通玄\"在他六十多岁时，'尝游五台，入善住院，逢异僧授以《华严》大旨。'\"**这一\"五台山异僧授旨\"的传说，与本系列《智俨综合深度研究》第三章3.4节所述\"异僧点化智俨六相义\"、以及《杜顺综合深度研究》第三章3.6节所述\"神僧抚顶认领智俨\"等记载，共享着完全相同的中国佛教圣传文学叙事母题——一位\"异僧\"（身份不明、来历成谜的僧人）在关键时刻现身，向主人公传授或点化某种核心教理领悟。这一母题在华严宗历代祖师的生平叙事中反复出现，绝非偶然，很可能反映了中国佛教传记书写传统中一种相对固定的修辞程式：用以将某个思想突破的具体来源\"神圣化\"\"去历史化\"，使其超越可考的凡俗师承脉络，直接指向某种超验的、\"天授\"式的合法性。**李通玄的情形尤其耐人寻味：如果说智俨、杜顺至少还有具体姓名可考的世俗授业之师（详见《智俨综合深度研究》第三章3.2节所述智正、静琳、法常），李通玄则完全没有——\"五台异僧\"这一称谓本身的匿名性，恰恰与他\"学无常师\"的整体形象完全吻合：他的教理领悟，在传统叙事中被建构为一种没有具体人间谱系可以依托、几乎是直接\"感应\"而来的产物。\n\n值得一提的是，五台山作为文殊菩萨道场这一地理—信仰坐标本身也颇具深意：**如本系列《智俨综合深度研究》第二章2.5节所论，华严一系存在\"重普贤、轻文殊\"的devotional倾向（尤见杜顺、智俨一支），而李通玄的关键悟入契机却恰恰系于文殊道场五台山——这或许暗示李通玄这一支独立发展的华严诠释传统，在devotional取向上与杜顺—智俨—法藏正统一系存在着微妙的差异，惜现有材料未能就此作更深入的展开论证，本文存疑列出，留待后续研究补充。**\n\n### 3.3 \"学无常师\"与他对官方法脉的疏离：一种主动的选择还是客观的隔绝？\n\n现有史料没有任何证据显示李通玄与澄观（738—839，详见《宗密综合深度研究》第三章3.3节）、乃至更早的法藏（643—712，详见《智俨综合深度研究》第六章6.1节）本人有过直接的书信往来或人际接触——**这一点其实并不令人意外：李通玄开始专攻《华严经》并撰写《新华严经论》约在开元七年（719）前后，此时法藏已辞世七年（法藏卒于712年），而澄观则要到738年方才出生，二人与李通玄在世时间完全不重叠或仅有极短暂的交集（若采信\"开元二十八年即740年卒\"的异说，则与年幼的澄观在世时间略有重叠，但年龄差距悬殊，几无可能产生实质交流，详见1.5节对卒年争议的存疑说明）。**换言之，李通玄与官方法脉的\"疏离\"，在相当程度上首先是一个纯粹的时间与地理问题——他与法藏所代表的长安（法藏晚年活动中心）—洛阳一带的官方义学圈层，在物理空间上本就相隔遥远（李通玄主要活动于太原、寿阳、盂县一带的山林之间），彼此缺乏产生交集的现实条件。\n\n但仅从时空阻隔的角度理解这种\"疏离\"，恐怕又失之片面。**更深层的原因，很可能在于李通玄从根本上就不属于、也未曾寻求进入那个以长安、洛阳皇家寺院与译经道场为中心、以师徒剃度授受为制度基础的\"官方佛教\"建制圈层——他是一位终身未曾剃度的居士，其学问养成路径是个人化的游学与自修，而非任何寺院丛林的正规教育体系。**就此而言，与其说他是被官方法脉\"排斥\"在外，不如说他从一开始就选择了、或者说客观上只能走一条完全在这一建制之外的独立治学道路——这与前述2.1节所引他本人的自陈（\"和先德所立有少分不同，但大体仍不出法界圆融的义旨\"）恰相吻合：他认同华严教理的根本精神，却并不需要、也未曾寻求这一精神认同必须透过某种制度性的师徒授受关系才能获得正当性。\n\n### 3.4 造论的艰苦历程：孟县、方山与\"专心八年\"\n\n开元七年（719）春，李通玄携带新译《华严经》来到太原孟县（一作盂县）西南同颖乡大贤村高山奴（一作仙奴）家中——据载这户人家\"乐施好善，腾出一处安静的房子让他居住\"。**在此后长达数年（各版本传记记载年限略有出入，详见第五章5.4节的详细考辨）的时间里，李通玄\"三年足不出户\"，专注造论，\"每天早晨只食枣十颗、柏叶饼一枚\"，由此得名\"枣柏大士\"。**其后又辗转迁移，据不同版本记载，先后在马家山谷居住五年、韩公庄居住三年，最终（或同时，两种记载存在张力，详见5.4节）移居寿阳方山的土龛（石室），继续撰述，终于完成四十卷《新华严经论》这一巨著。**综合各版本记载中较为一致的核心事实——即李通玄以年逾八旬的高龄，选择彻底摒弃寺院或官方支持，依托普通乡民人家与山野岩穴，以极端简朴的饮食维持生存，用数年乃至十余年的时间独立完成一部四十卷的经典诠释巨著——这一\"生命示范\"本身的意义，已经远远超出了单纯的著述活动，而成为其整个思想体系\"解行合一\"精神的最有力体现，本文将在第四章4.5节对此作专门的深入讨论。\n\n---\n\n## 四、李通玄的思想体系、著述与生命示范\n\n### 4.1 独立的判教系统：十门、十宗、十教\n\n李通玄在《新华严经论》卷首，独立建构了一套完整的判教体系，其架构方式与法藏\"五教十宗\"迥然不同。他首先立\"十门\"以解释《华严经》一经之义旨：一、明依教分宗；二、明依宗教别；三、明教义差别；四、明成佛同别；五、明见佛差别；六、明说教时分；七、明净土权实；八、明摄化境界；九、明因果延促；十、明会教始终。**这十门本身即\"自出机杼\"，尤以其中所立\"十宗\"\"十教\"的具体教判内容，与法藏一系的\"五教十宗\"说\"迥不相同\"，值得逐一列出以见其独立创造之全貌：**\n\n其\"十宗\"为：一、小乘戒经，以\"情有\"为宗；二、《梵网经》菩萨戒经，以\"情有及真俱示\"为宗；三、《般若经》，以\"说空彰实\"为宗；四、《解深密经》，以\"不空不有\"为宗；五、《楞伽经》，以\"五法、三自性、八识、二无我\"为宗；六、《维摩经》，以\"会融染净二见现不思议\"为宗；七、《法华经》，以\"会权就实\"为宗；八、《大集经》，以\"守护正法\"为宗；九、《涅槃经》，以\"明佛性\"为宗；十、《大方广佛华严经》，以\"根本佛乘\"为宗，又以\"因圆果满，法界理事自在缘起无碍\"为宗。\n\n其\"十教\"则依时间顺序展开：第一时说小乘\"纯有\"教；第二时说《般若经》\"破有明空\"教；第三时说《解深密经》\"和会空有明不空不有\"教；第四时说《楞伽经》\"明说假即真\"教；第五时说《维摩经》\"明即俗恒真\"教；第六时说《法华经》\"明引权归实起信\"教；第七时说《涅槃经》\"令诸三乘舍权向实\"教；第八时说《华严经》\"于刹那之际通摄三世及十世圆融无始终前后通该\"教；第九为\"共不共教\"，即闻共同法而领解获益不共之教；第十为\"不共共教\"，即不共之机闻共同法而获益之教。\n\n**将这套体系与法藏\"五教十宗\"稍加比对，即可看出二者虽同样以《华严经》压轴、同样承认其\"圆教\"至高地位，但具体的经典配置、理论逻辑却大异其趣：法藏的\"五教\"（小、始、终、顿、圆）是一套相对抽象的教理深浅层级架构，而李通玄的\"十教\"则更接近于一套具体的\"经典说法编年史\"，将每一部重要大乘经典安置在一个具体的说法\"时\"位之中，最终导向《华严经》\"于刹那之际通摄三世及十世\"这一极具时间哲学意味的表述——即《华严经》所代表的圆满教法，并非诸经中\"最后一时\"所说（如天台\"五时判教\"中《法华》《涅槃》居于最后），而是能够在\"一刹那\"之内圆融地统摄过去、现在、未来\"三世\"以及\"十世\"（三世又各分过去、现在、未来，合为九世，再加\"一念\"总摄前九世为第十世）——这是一种彻底打破线性时间序列的圆融时间观，也正是朴文永〈时间性与非时间性〉一文（详见1.3节）所要专门处理的哲学议题。**\n\n### 4.2 以易解华严：卦爻、方位、数字与《华严》阶位的对应\n\n李通玄思想中最具个人独创色彩、也最为学界反复讨论的特质，是他系统地运用《周易》的符号系统——卦象、爻位、方位、数字——来\"表法\"，即作为诠释《华严经》教理架构、尤其是菩萨修行阶位体系的类比工具与说明框架。**这一方法在他自己的《新华严经论》中反复出现：例如以《周易》\"十二辟卦\"（十二消息卦，对应十二月阴阳消长）来配比《华严经》\"十地\"（菩萨修行的十个阶位）的次第开展逻辑；以易学中特定的方位、数字象征，来说明《华严经》\"十信、十住、十行、十回向、十地\"五十二阶位之间的内在关联与递进关系。**刘媛媛论文所提出的\"周易表法\"这一概括性术语（详见1.1节），精准地捕捉到了这一方法论的本质——李通玄并非仅仅在文字表述上偶尔援引几个易学术语作为修辞点缀，而是将整套易学符号系统作为一种系统性的\"表法\"工具，贯穿于其对《华严经》教理阶位的诠释始终。\n\n**这一诠释策略的思想史意义是双重的：其一，如2.3节所论，它构成了中古佛教\"中国化\"进程中一种极具原创性的儒佛会通方案——不是在辩论中\"驳斥后收编\"儒家资源，而是直接借用《周易》这套中国本土最古老、最具权威性的符号系统本身作为解经工具，使《华严经》玄奥的教理架构，透过一套中国读书人早已烂熟于心的符号语言变得更加可以把握、可以\"对应\"；其二，也正因如此，李通玄的诠释方法招致了后世部分学者\"过度比附\"\"流于象数之学\"的批评疑虑——毕竟《周易》卦爻体系本身自有其独立的宇宙论逻辑，将其与源自印度的佛教修行阶位体系作强行对应，其解释效力与合法性，本身也是一个可以、也应当被审慎讨论的问题，本文在此如实呈现这一方法论特色及其可能引发的学术争议，不作简单的褒贬评判。**\n\n### 4.3 六相圆融的独特诠释：扎根于\"十地品\"的具体阐发\n\n\"六相圆融\"（总、别、同、异、成、坏六相圆满交融）是华严宗最核心的理论命题之一，杜顺《法界观门》的\"周遍含容观\"、智俨的\"十玄门\"（详见《智俨综合深度研究》第四章4.1—4.2节）均以此为重要理论基础。李通玄虽然专门论述\"十玄六相\"的独立著作《十玄六相》已经散佚，但据现存《新华严经论》卷八、二十三、二十四以及《华严经决疑论》卷一下的相关论述，仍可窥见其独特的阐发方式——**与智俨、法藏较为抽象、逻辑化的六相论证方式不同，李通玄将六相圆融牢牢扎根于《华严经·十地品》\"初欢喜地十大愿\"中第四大愿的具体文本语境，并以十地菩萨修行次第本身作为六相理论的具体演绎场域**：他解说初地一地之中已总摄十地及如来果德义，\"六相圆融，如天帝释宝网，自在无碍\"；进而分说\"地与地\"之间的六相关系——十地修行智用逐地殊胜为\"别相\"，然一一地中智用皆不离根本智为\"总相\"，心修行时一切境界自体无作为\"同相\"，一一位次能净除业障、智用增明为\"成相\"，一一地中修行而不见修、不见行、不见成、不见菩提涅槃等相待之事为\"坏相\"；最后总说一切诸法皆具足六相。**这种将高度抽象的哲学范畴（六相）与具体的、有次第可循的修行阶位（十地）紧密结合、彼此互释的阐发方式，正与他\"造论\"这一亲身\"解行合一\"的生命实践相互呼应——理论论证本身也带有强烈的实修指导意味，而非纯粹思辨性的教理建构。**\n\n### 4.4 顿悟解脱论与\"凡夫即佛\"的实践取向\n\n据现代学术专著对李通玄思想体系的结构性归纳（详见1.1节），\"李通玄以顿悟思想为基础的解脱论\"是其体系中独立于判教、易学诠释之外的另一重要维度。**这一\"顿悟\"取向，与华严宗官方法脉后来经由宗密系统阐发的\"顿悟渐修\"说（详见《宗密综合深度研究》第四章及第六章相关讨论）形成了有趣的对照与呼应——二者都强调\"顿悟\"作为解脱论的核心环节，但李通玄的顿悟论，更多是与其\"凡夫成佛\"的实践取向紧密捆绑：即普通修行者（而非仅仅是已臻高位的圣者菩萨）如何能够在当下的、此生此身的修行中，直接契入华严\"法界缘起\"的圆融境界，而不必经历漫长的、按部就班的阶位攀升。**这一取向与李通玄本人的居士身份、以及其判教体系刻意将\"十信\"位提升到与后续阶位同等重要地位的做法（详见4.1节\"十门\"中\"明成佛同别\"一项），彼此呼应，共同指向一种更具平民性、更少制度性门槛的解脱论立场——这或许也是知讷日后特别看重李通玄\"实践修入教学\"（详见第六章6.3节郭磊论文语）、认为这是\"法藏之华严学所无\"的关键所在：法藏一系的教理体系固然宏富精微，但其论述重心更多落在教理架构本身的完整性与逻辑严整性上，而李通玄这套扎根于具体修行阶位、且始终指向\"凡夫当下如何入手修行\"这一实践关切的论述，恰恰填补了这一空缺。\n\n### 4.5 生命示范：造论苦行图景及其神话化过程\n\n如第三章3.4节所述，李通玄以八旬高龄、历经数年乃至十余年，依托乡野民居与山中石室、以枣柏充饥的方式独立完成四十卷巨著，这一\"生命示范\"本身的历史真实性核心（即：他确实以一种极端简朴、近乎苦行的方式完成了这项艰巨的著述工程）应当是较为可信的，因为这一核心事实在李通玄身后仅四十年、由其亲炙弟子照明所撰的最早传记〈华严经决疑论序〉中已有明确记载。**然而，围绕这一核心事实，后世（尤其是一百七十余年后、寿阳方山新建寺院亟需借重李通玄声望以自重的具体历史情境下）逐步累积、附会出了一系列更具戏剧性的神异细节：老虎驮经、猛虎\"伏地听命\"、石室旁本无水源、一夜风雨拔松化潭、\"口出白光\"以代烛照明、乃至两位\"妙龄女子\"（后被解释为白鹤所化）常年为其汲水焚香、供给饭食，直至论著完成后倏然消失。**据前述邢东风论文的考证（详见1.1节），这些情节均不见于最早的照明序文，而是集中出现在晚出的、与特定寺院建寺工程直接相关的唐代碑刻文献之中——**这一考证结果具有重要的方法论示范意义：它提示我们，即便面对同一位历史人物的\"苦行\"叙事，也必须仔细辨析其中哪些细节属于较为可信的早期核心记载，哪些细节则是后出的、往往服务于特定现实利益（如新建寺院的正当性诉求）的层累建构。**这一方法论立场，与本系列《杜顺综合深度研究》第四章、第五章对杜顺神异事迹的处理方式一脉相承——本文既不因这些神异细节晚出、可能属于建构而全盘否定李通玄苦行造论这一核心历史事实，也不因这一核心事实较为可信而对晚出的具体神异细节照单全收，而是力求呈现这种\"核心事实可信、具体细节层累\"的复杂史料结构本身。\n\n值得特别指出的是，这类神异叙事发挥的实际社会功能也不应被简单否定或嘲讽式地看待——正如邢东风论文标题\"学者乎？神人乎？\"所暗示的双重性，**李通玄身后形象在\"渊博的儒佛兼通学者\"与\"近乎神异化身的圣者\"这两极之间摇摆，恰恰反映了中国佛教传记书写传统本身长期存在的一种内在张力：一位思想家的历史贡献，究竟应当透过其可考的具体论著与治学方法来评价（\"学者\"维度），还是透过其感召后世信众的神圣叙事来彰显（\"神人\"维度）？李通玄的情形之所以格外典型，恰恰在于他本人的思想成就（十宗十教判教、以易解华严、六相阐发等，详见4.1—4.3节）与其身后神异叙事之间的反差极为悬殊——很少有哪位思想家能像他这样，一方面留下如此严整、原创、可供严肃学术研究的理论体系，另一方面身后又被赋予如此浓墨重彩的神异传说外衣。**这一\"学者\"与\"神人\"两种形象长期并存、相互缠绕的现象本身，或许正是理解中国佛教思想家身后接受史时最值得反复咀嚼的一个案例。\n\n---\n\n## 五、李通玄年谱、人物关系与历史文化事件\n\n### 5.1 李通玄年谱简表\n\n下表综合马支〈李长者事迹〉、照明〈华严经决疑论序〉、《宋高僧传》卷二十二、《佛祖统纪》卷四十等原始文献及现代学者考订整理而成。**如1.5节及5.4节所述，李通玄生平的诸多细节（尤其是各阶段居留年限）在不同版本文献间存在明显出入，下表尽量呈现较为通行、且与最早史源相对吻合的版本，异说另加说明。**\n\n| 年代（唐历） | 公元 | 李通玄年龄（虚岁） | 事件 |\n|---|---|---|---|\n| 唐太宗贞观九年 | 635 | 1 | 生，籍贯有沧州（今河北沧县）、太原（今山西）两说并存；据《宋高僧传》，或为\"唐之帝胄\"，具体世系不可考 |\n| （青年时期） | — | — | 钻研《周易》，游历名山大川，\"住无常所，随所行处，择地而居\" |\n| 武则天证圣元年 | 695 | 61 | 实叉难陀奉诏译出八十卷《新华严经》 |\n| （六十余岁） | 约695—700年间 | 61—66 | 据《居士传》，游五台山，入善住院，\"逢异僧授以《华严》大旨\"，转而专攻《华严经》 |\n| 唐玄宗开元七年 | 719 | 85 | 携新译《华严经》至太原孟（盂）县同颖乡大贤村高山奴家，开始造论，三年足不出户，日食枣十颗、柏叶饼一枚 |\n| （其后数年，具体年限异说并存） | 约722—727年间 | 88—93 | 据一说，先后移居马家山谷（五年）、韩公庄（三年）；据另一说，直接移居寿阳方山土龛，续撰五年，完成《新华严经论》四十卷 |\n| 唐玄宗开元十八年 | 730 | 96 | 三月二十八日，于方山石室（一说 依此说反推，则十一年的盂县居留期应始于开元七年（719）稍前的708年左右，与照明序文\"起自开元七年\"的明确记载已生龃龉；更严重的是，若在这十一年盂县居留期之后，再加上碑刻传说中\"移居方山土龛续撰五年\"这一情节，则李通玄的著述活动将被迫延伸至开元十八年（730）之后方能完成——但这与照明序文明确记载的\"终在开元十八年三月二十八日卒\"这一确凿死亡日期直接矛盾！**侯讵望据此推断：\"这五年其实是没有的，如果有，就与照明的序文所记述的去世时间相冲突了。所以，在唐碑上，李通玄的年龄就被模糊了。\"**换言之，\"移居方山土龛、续撰五年\"这一情节，很可能是晚出碑刻为了将李通玄的著述活动与寿阳方山这一具体地点建立起更为直接、更为长期的关联（从而服务于当地新建寺院攀附其声望的现实需求），而人为添加、却未能与既有的、更早也更可信的死亡时间记载相互校核所导致的一处明显的史料破绽。**\n\n**这一具体案例极具方法论价值：它示范了如何透过对不同版本传记文献之间具体年代数字的交叉核验，来识别、揭露后出文献中可能存在的、服务于特定现实利益（此处即新建寺院的正当性建构）的人为增饰痕迹，而不必仅仅停留于对\"神异色彩浓厚故不可信\"这一笼统印象式的判断。这也正是本文在处理李通玄生平材料时，始终尝试区分\"照明早期核心记载\"与\"唐碑晚期增饰细节\"两个层次的具体方法论依据。**至于李通玄的确切安葬地点，据侯讵望文章介绍，学者王乃积、郭华荣的研究认为至少存在寿阳方山、盂县两处不同的传统说法，这一争议至今未有定论，本文存疑列出。\n\n---\n\n## 六、李通玄之后的传承与接受：从志宁到当代\n\n### 6.1 晚唐至宋：志宁合论与戒环调和\n\n如5.1节年谱所示，李通玄身后四、五年，僧广超即已开始传抄弘通其著作，\"遍于并汾\"，说明其著述在晚唐山西地区已有一定的地域性流传基础。**真正推动《新华严经论》突破地域局限、走向全国性流传的关键人物，是宣宗大中年间（847—859）福州开元寺僧志宁——他将李通玄的论文直接会入《华严经》经文之下，合并为一百二十卷的巨编，此后又经后人\"思研整理\"，定型为《华严经合论》这一更便于流通的合刊形式，\"就流传得更普遍了\"。**志宁的这一工作具有重要的文献史意义：他实际上是将李通玄原本作为一部\"独立论著\"存在的《新华严经论》，重新改造为一部可以与《华严经》经文对照、逐段参读的\"经论合刊\"，大大降低了普通读者（尤其是不具备深厚义学训练的读者）研习李通玄思想的门槛——这与李通玄本人\"顿悟\"\"凡夫成佛\"的实践取向（详见4.4节）在客观效果上不谋而合，进一步扩大了其平民化的传播基础。\n\n北宋僧人戒环所撰《大方广佛华严经要解》一卷，则代表了官方法脉与李通玄独立传统之间一次颇具象征意义的调和尝试——**该书\"依据李通玄的学说而辅以澄观的学说而作\"，即以李通玄相对简明、重实践的诠释框架为主体骨架，再补充澄观所代表的官方正统法脉的义理阐发，形成一部兼采两条此前长期平行、互不相涉的诠释路径之长的综合性著作。**这一\"以李为主、以澄为辅\"的调和方案，从一个侧面反映出，至迟到北宋时期，李通玄一系的诠释传统，其影响力与权威性已经足以与澄观所代表的官方正统相提并论、甚至在某些场合（如戒环此书）被置于更为主体性的地位。\n\n### 6.2 明代复兴：李贽、方泽与紫柏真可\n\n明代是李通玄思想接受史上的又一个重要高峰期，其突出标志是多部专门整理、提要《华严经合论》的著作相继问世：**李贽（1527—1602，号卓吾，明代著名的\"异端\"思想家，以\"童心说\"及对传统礼教的激烈批判著称）撰有《华严经合论简要》四卷；方泽（携李，即嘉兴一带人氏）撰有《华严经合论纂要》三卷——二书体例、取径虽有不同（据韩国学者郭磊的比较研究，二书\"对于李通玄教学之理解方法有显著之差异\"，详见6.3节），但都是以精简、提要的方式，帮助读者更便捷地把握李通玄这部四十卷（会入经文后更达一百二十卷）巨著的核心要义，说明晚明士人与教界对李通玄思想确有相当程度的研习热情与消化需求。**\n\n**李贽这一极具争议性、素以\"离经叛道\"著称的晚明思想家竟也专门为李通玄的著作撰写提要，这一事实本身颇值得玩味——李贽本人的思想气质（强调\"童心\"之真、反对拘泥礼法权威）与李通玄\"学无常师\"\"独立治学、不依傍官方权威\"的形象之间，或许存在着某种精神气质上的隐性共鸣，尽管现有材料未能就此提供李贽本人明确的自陈依据，本文仅作为一种可能的解释路径存疑提出，不作过度延伸的确证性论断。**与此同时，明末四大高僧之一的紫柏真可（1543—1603，详见其个人生平——五岁前不能言语，遇异僧而愈，十七岁于虎丘依明觉禅师出家，二十岁受具足戒后即\"见《华严经》，在武塘景德寺闭关读书三年\"，其后一生致力于复兴寺院、募刻《嘉兴藏》）的个人文集《紫柏尊者全集》卷九中，亦见有专门论及李通玄相关思想的文字（据学者刘媛媛论文所引），足见李通玄的《华严经合论》确已进入晚明这一佛教复兴思潮核心人物的关注视野。**紫柏真可本人早年\"闭关读书三年\"专攻《华严经》这一经历，与李通玄晚年\"三年足不出户\"造论的生命轨迹形成了一种跨越八百余年的精神呼应——尽管二者所处的具体历史情境、社会角色（一为出家高僧，一为在家居士）截然不同，但这种\"闭关苦读华严\"的修行—治学模式本身，似乎构成了华严传统中一种反复被后人重新演绎的典范性生命姿态。**\n\n### 6.3 域外传承：高丽知讷《华严论节要》\n\n李通玄思想在域外传播史上最重要、也最富思想史深意的个案，是高丽普照知讷（1158—1210）对其著作的系统节录与创造性转化。**据韩国东国大学佛教学术院研究员郭磊的专题论文考订，知讷约在五十岁时（1208年）撰成《华严论节要》三卷，\"擷取李通玄所著《新華嚴經論》之要點，復加知訥自己之見解\"，由其门人冲湛刊行，迄今仍存；两年后（1210年，知讷五十二岁），知讷又撰成《法集别行录节要并入私记》一卷（详见本系列《宗密综合深度研究》第五章5.7节所述知讷对宗密思想的节录与\"顿悟渐修\"说的发展），同样存世。**这两部时间相隔仅两年、且均以\"节要\"为体裁的晚年著作，共同揭示了知讷思想成熟期一个极具启发性的双重取径：**他一方面透过节录宗密的禅教一致思想（详见《宗密综合深度研究》第五章相关讨论），建构起其\"顿悟渐修\"说的理论基础；另一方面，则透过节录李通玄的《新华严经论》，汲取\"法藏之华严学所无\"的实践修入教学。**郭磊论文对此有精辟概括：\"李通玄之實踐修入教學乃法藏之華嚴學所無，而知訥此書深得其要\"——这一评价与本文4.4节关于李通玄\"凡夫成佛\"实践取向的讨论完全吻合，进一步印证了知讷之所以舍弃更为\"正统\"、更为宏富精微的法藏—澄观义学体系，转而特意求诸李通玄这一\"局外\"传统的具体思想史原因：他所需要的，正是一套能够为其\"顿悟渐修\"实践论提供具体操作指引的华严诠释资源，而这恰恰是李通玄的独特贡献所在。\n\n郭磊论文并将知讷此书与前述明代李贽《华严经合论简要》相提并论比较，指出\"兩書對於李通玄教學之理解方法有顯著之差異\"——**这意味着，同一部李通玄原著，在十三世纪的高丽（知讷）与十六世纪末的中国（李贽）两个相隔约四百年、文化语境迥异的接受场域中，分别激发出了两种理解方式明显不同的节录、诠释成果，这本身即是李通玄思想具有丰富诠释可能性、能够持续激发不同时代读者创造性回应的一个有力例证。**\n\n### 6.4 与官方祖统谱系的关系：始终未被纳入\n\n**必须明确指出的一点是：无论是北宋净源厘定的\"华梵七祖\"说（详见《宗密综合深度研究》第三章3.1节），还是日本凝然进一步扩展的\"华严十祖\"说（追加普贤、文殊、马鸣、龙树、世亲，详见同节），乃至清代续法《法界宗五祖略记》所最终定型、为教内外普遍接受的\"五祖\"谱系，李通玄始终未被纳入其中任何一个版本。**当代华严宗内部（包括本系列此前研究已详细考察的台湾当代教团海云继梦法师、成观法师等，详见《宗密综合深度研究》第五章5.8节）所自述的\"贤首宗\"法脉传承世系，同样以杜顺—智俨—法藏—澄观—宗密一线为准，李通玄的名字并不出现在这一制度性的传法谱系之中。**这一\"始终未被纳入\"的现象，与其说是官方法脉对李通玄的刻意排斥（现有材料未见任何一代官方祖师明确批判或否定李通玄学说的记载），不如说是二者原本就分属两种性质不同的\"传承\"机制：官方五祖谱系依托的是一套（至少在观念层面）以师徒授受、剃度传法为基础的制度性谱系建构逻辑（尽管如本系列研究反复揭示，这套谱系本身也是历经数百年层累建构的产物）；而李通玄的思想传承，则完全是一种纯粹依托文本流传、不依赖任何制度性师承认证的\"私淑\"式接受模式——志宁的合论、戒环的调和、李贽与方泽的提要、知讷的节要，无一例外都是后人透过阅读其文本而产生的创造性回应，而非任何形式的入室弟子、剃度传法关系。**就此而言，李通玄的思想影响力，某种意义上比官方五祖谱系更接近于一种纯粹\"观念史\"意义上的传承——不依赖制度性建制的保驾护航，完全凭借其论著本身的理论说服力与实践指导价值，跨越四百年（至知讷）、跨越八百年（至李贽、紫柏真可）的时间纵深，持续吸引着一代又一代读者的主动重新发现。**\n\n### 6.5 当代：学界研究热潮与两岸三地流传\n\n进入现当代，李通玄研究呈现出鲜明的\"学院化\"转向——如第一章1.1节所详述，二十世纪末至二十一世纪初，海峡两岸相继出现多部专题学位论文（朱慧、洪梅珍）与期刊论文（邱高兴、刘媛媛），2017年更有邢东风教授在华严专宗国际学术研讨会上发表专门辨析其神话传说层累建构过程的论文——**这标志着李通玄研究已经从传统的教内文本节录、注疏传统（志宁、戒环、李贽、方泽、知讷模式），转型为现代学院体制下具有严格文献学、历史学方法论自觉的专题学术研究领域。**据中新网所刊侯讵望文章介绍，李通玄的《华严经合论》\"不但在内地佛教界有巨大影响，在香港、台湾地区也影响广泛，而且影响到日本、韩国的佛教界\"——**这一广泛的当代流传格局，某种意义上正是其\"局外人\"身份的一种历史性回报：正因为他从未被限定在某一具体寺院、宗派、或制度性法脉的框架之内，其著作反而得以更为自由地跨越地域、宗派乃至国界的边界，在两岸三地及东亚各地持续流传，成为一份不属于任何单一机构、却为整个东亚华严思想传统所共享的公共文化遗产。**惟需指出，现有材料未见当代台湾华严相关教团（如海云继梦法师大华严寺、成观法师大毘卢寺等，详见本系列《宗密综合深度研究》第五章5.8节）明确将李通玄纳入其自述的\"法脉\"传承体系，这与6.4节所论其\"始终未被纳入官方祖统\"的历史定位相互印证——即便在当代，李通玄的影响力也主要延续着\"文本资源\"而非\"法脉传承\"的历史轨迹，本文对此如实呈现，不作强行连结。\n\n---\n\n## 七、李通玄在文化史与生命实证体验中的成就与贡献\n\n### 7.1 儒佛会通的典范意义\n\n如第二章2.3节所论，李通玄\"以易解华严\"的诠释方法，代表了中古佛教中国化进程中一种与宗密《原人论》式辩驳性策略（详见《宗密综合深度研究》第二章2.4节、第六章6.3节）截然不同、却同样深具历史意义的儒佛会通路径。**若说宗密的方案是\"先破后立\"——透过层级化判教将儒道二家判为\"不了义\"而后收摄，那么李通玄的方案则近乎\"即用即通\"——直接将《周易》这套中国本土最古老的符号系统本身，作为解读印度经典《华严经》教理阶位的方法论工具，使二者在方法论操作的层面上便已融为一体，而不必先经过一番义理层级上的高低判定。**这两种路径分别代表了中国佛教思想家回应\"佛教是否契合中国文化\"这一根本性诘难时所能采取的两种典范性策略——前者诉诸系统性的理论建构与论辩说服，后者诉诸直接的方法论借用与符号系统嫁接——二者的并存本身，即是中古佛教中国化进程之丰富性与多元性的有力见证。\n\n### 7.2 \"居士佛教\"的独立典范\n\n李通玄终身未曾剃度、\"学无常师\"、独立完成一部四十卷巨著而始终游离于官方义学建制之外的生命历程（详见第三章），使他成为中国佛教史上一个极具分量的\"居士佛教\"典范人物。**与同一时期乃至后世多数在寺院丛林体制内接受系统训练、经由明确师徒授受关系而获得学术权威与传法合法性的僧人相比（详见《智俨综合深度研究》第三章对智俨多位授业之师的详细考订），李通玄证明了：一套具有高度原创性、且足以历经千余年持续吸引后世重新发现的成熟佛教诠释体系，完全可以在寺院建制之外、由一位自学成才的在家学者独立建构完成。**这一典范意义，在中国佛教史上并非孤例（如唐代庞蕴居士的禅门公案传统），但李通玄以其著述之宏富、体系之严整（详见第四章4.1—4.3节），无疑是\"居士佛教\"传统中分量最重的代表人物之一，其历史地位理应得到与官方僧团法脉祖师同等严肃的学术关注——这也正是本文写作的基本立场所在。\n\n### 7.3 顿悟实践路径对东亚禅净传统的滋养\n\n第四章4.4节已详述李通玄\"以顿悟思想为基础的解脱论\"及其\"凡夫成佛\"的实践取向，第六章6.3节则详述了高丽知讷正是因为看重这一\"法藏之华严学所无\"的实践品格，方才特意节录其著作以充实自己的\"顿悟渐修\"体系。**这一具体的接受史案例提示我们，李通玄留给后世最持久的贡献之一，或许并非其判教体系或易学诠释方法本身（这些固然极具原创性，但也因其高度个人化的建构方式而相对难以被直接\"移植\"到其他思想脉络之中），而是他所示范的一种更具普遍适用性的精神姿态——即将华严\"法界圆融\"的高妙义理，重新与\"当下凡夫如何入手修行\"这一最朴素、最迫切的实践关切紧密结合起来。**这一精神姿态，透过知讷而滋养了朝鲜半岛禅、教融合的曹溪宗传统（详见《宗密综合深度研究》第五章5.7节），也透过明代李贽、紫柏真可等人对其著作的持续研习（详见第六章6.2节），在中国本土的禅、净合流思潮（详见《宗密综合深度研究》第五章5.4节所论明代\"教禅净合流\"大势）中留下了自己的印记——尽管现有材料未能就李通玄与明代具体禅净合流实践之间的因果关系提供更为确凿的文献实证，本文在此仅指出这一思想史脉络上的可能关联，存疑列出。\n\n### 7.4 生命实证维度的再评估\n\n如第四章4.5节所详述，李通玄以八旬高龄、历经数年艰苦岁月，依托山野民居独立完成巨著这一\"生命示范\"，其核心历史真实性应属可信，但后世（尤其是服务于特定寺院建寺需求的晚出文献）在此基础上层累建构了大量神异细节。**本文认为，剥离掉这些晚出的神异外衣之后，李通玄\"生命实证\"维度真正的核心价值，恰恰在于其朴素而极致的\"解行合一\"——一位年逾八旬的老者，甘愿舍弃任何制度性依托与物质舒适，仅凭对华严教理的深切体认与传播使命感，以近乎苦行的方式完成一项艰巨的思想工程，这本身就是对其自身\"顿悟即行、凡夫成佛\"这一理论主张（详见4.4节）最有力、最不需要任何神异修饰的现身说法。**换言之，即便完全悬置\"猛虎驮经\"\"双鹤送食\"等晚出传说的真实性问题（详见4.5节的详细辨析），李通玄生命历程本身所呈现出的这种理论与实践高度统一的品格，已经足以使他在整个华严思想史\"生命实证\"这一维度上，占据一个不可替代的独特位置——它提醒我们，\"生命实证\"的力量，未必总是需要依靠超自然的神迹叙事来彰显，有时候，一种极致的、朴素的、持之以恒的意志力本身，就足以构成最具说服力的见证。\n\n### 7.5 结语\n\n回望李通玄其人其学，其最深刻的文化史意义，或许正在于他以一生的实践，示范了一种官方谱系逻辑之外的、却同样正当、同样深具生命力的思想史存在方式。**他没有明确的师承（第三章），没有被纳入任何版本的祖统谱系（第六章6.4节），他的判教体系\"和先德所立有少分不同\"（第二章2.1节），他\"以易解华严\"的方法论招致后世或褒或贬的不同评价（第四章4.2节）——然而正是这样一位处处\"不合常规\"的居士学者，凭借其思想本身的深度与实践品格的感召力，跨越四百年抵达高丽知讷（第六章6.3节），跨越八百年抵达明代李贽与紫柏真可周边的士人圈层（第六章6.2节），并在当代持续吸引着两岸三地及东亚各地学者的重新发掘（第六章6.5节）。**这段跨越一千三百年、完全不依赖任何制度性传承机制护航的接受史，或许比官方五祖谱系那更为人熟知、却也历经数百年反复层累建构（详见本系列《宗密综合深度研究》第三章3.1节、《智俨综合深度研究》第三章及第四章4.8节的相关考订）的传承叙事，更能生动地说明：真正深刻的思想，终究能够找到属于自己的传播路径，无论这条路径是否获得过任何形式的官方认证。\n\n---\n\n## 参考文献与资料来源说明\n\n以下按语言、性质分类列出本文写作过程中检索、参考之主要资料来源。**本文主要透过网络公开检索完成，未能逐一查证每一部专著、论文的具体版本、页码，条目多仅列作者、题名、出版机构等基本信息，供读者按图索骥、自行查证原始出处，不宜将本文视为可直接替代原始学术文献的最终定论。**\n\n### 原典与传统文献\n- 李通玄：《新华严经论》四十卷、《略释新华严经修行次第决疑论》四卷、《解迷显智成悲十明论》一卷（一作《十二缘生解迷显智成悲十明论》）\n- 马支：〈李长者事迹〉（约770年，收《全唐文》卷0816；英译见Gimello 1983附录）\n- 照明：〈华严经决疑论序〉（约770年）\n- 志宁（编）：《华严经合论》（会入经文本，宣宗大中年间，847—859）\n- 赞宁：《宋高僧传》卷二十二\n- 志磐：《佛祖统纪》卷四十\n- 念常：《佛祖历代通载》卷十三\n- 戒环：《大方广佛华严经要解》一卷\n- 李贽：《华严经合论简要》四卷\n- 方泽：《华严经合论纂要》三卷\n- 知讷：《华严论节要》三卷（约1207—1208年间刊行）\n\n### 中文现代学术论著\n- 邱高兴：〈以《易》解《华严经》——李通玄对《华严经》的新诠释〉，《周易研究》2000年第1期\n- 朱慧：〈李通玄以易解华严思想研究〉，中山大学硕士学位论文，2009\n- 洪梅珍：〈李通玄及其华严学之研究〉，高雄师范大学博士学位论文，2010\n- 刘媛媛：〈\"以易解华严\"——李通玄的\"周易表法\"思想新探〉，《中华文化论坛》2017年第9期\n- 邢东风：〈学者乎？神人乎？——从神话传说看历史上的李长者像〉，华严专宗国际学术研讨会论文集，2017\n- 侯讵望：〈李通玄墓在盂县〉，中新网\n- 周叔迦：《周叔迦佛学论著集》\n- 郭磊：〈高丽知讷的《华严论节要》研究〉，东国大学佛教学术院，华严专宗国际学术研讨会论文集（与本系列《宗密综合深度研究》共同参考文献）\n\n### 日文现代学术论著\n- 稲岡智賢：〈李通玄の伝記について〉，《印度学佛教学研究》第34卷第1号，1981\n- 稲岡智賢：〈李通玄における信について〉，《印度学佛教学研究》第29卷第1号，1980\n- 镰田茂雄：《華厳の思想》，讲谈社，1988\n\n### 英文现代学术论著\n- Gimello, Robert M. \"Li T'ung-hsüan and the Practical Dimensions of Hua-yen.\" In *Studies in Ch'an and Hua-yen*, ed. Robert M. Gimello and Peter N. Gregory, 321–389. Honolulu: University of Hawai'i Press, 1983.\n- Gregory, Peter N. \"The Teaching of Men and Gods: The Doctrinal and Social Basis of Lay Buddhist Practice in the Hua-yen Tradition.\" In *Studies in Ch'an and Hua-yen*, 253–320.\n- Koh, Seunghak. \"Li Tongxuan's (635-730) Thought and His Place in the Huayan Tradition of Chinese Buddhism.\" PhD dissertation, UCLA, 2011.\n- Koh, Seunghak. \"Li Tongxuan's Utilization of Chinese Symbolism in the Explication of the Avataṃasaka-sūtra.\" *Asian Philosophy* 20/2 (2010): 141–158.\n- Park, Jin Y. \"Temporality and Non-temporality in Li Tongxuan's Huayan Buddhism.\" In *Dao Companion to Chinese Buddhist Philosophy*. Springer, 2018.\n- Cleary, Thomas. *Entry into the Inconceivable*. Honolulu: University of Hawai'i Press, 1993.\n- Cook, Francis H. \"The Meaning of Vairocana in Hua-yen Buddhism.\" 1972.\n\n### 韩文现代学术论著\n- 해주스님（Haeju sunim）：《화엄의 세계》（《华严的世界》），首尔：民族社，1999\n\n### 主要网络检索资料来源（百科、学术机构网站等，仅列站点性质，具体网址请自行检索核实）\n- 中文维基百科：\"李通玄\"\"华严经合论\"\"紫柏真可\"等条目\n- 佛学大词典\"李通玄\"条目\n- 中国佛教人物\"李通玄\"条目\n- 佛教导航（fjdh.cn）所刊邱高兴文章及相关传记资料\n- 中国社会科学网相关文章\n- 中新网侯讵望文章\n- 华严专宗学院（huayencollege.org）历年学术研讨会论文集\n\n---\n\n*本文与姊妹篇《圭峰宗密综合深度研究》《华严宗初祖杜顺综合深度研究》《华严宗二祖智俨综合深度研究》共同构成本系列对华严思想史关键人物的深度考察。与前三位官方谱系祖师相比，李通玄的史料在\"早期核心记载\"与\"后出神异传说\"之间的层次差异尤为显著，本文已尽力区分处理，但受限于检索条件，仍难免有疏漏之处，敬请读者以本文所列原始出处为线索，自行做进一步查证与批判性阅读。*", "back": {"tab": "gap", "view": "master-litongxuan", "label": "华严文献 · 华严祖师"}};

if(document.readyState!=='loading'){renderArticle();}
else{document.addEventListener('DOMContentLoaded',renderArticle);}

// ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|🔑|术语格义|主题对读注|卷末批注)/.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=localStorage.getItem('article_en_hide')==='1';
  localStorage.setItem('article_en_hide', cur?'0':'1');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);
  }
}
function _applyArticleENMode(){
  var full=document.getElementById('article-full');
  var btn=document.getElementById('article-en-toggle');
  var hide=localStorage.getItem('article_en_hide')==='1';
  if(full) full.classList.toggle('en-hidden', hide);
  if(btn) btn.textContent=hide?'🌐 英文批注：展开':'🌐 英文批注：显示';
}
</script>
</body>
</html>
