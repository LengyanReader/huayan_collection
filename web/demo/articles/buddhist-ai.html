<script>
var ARTICLE = {"id": "buddhist-ai", "file": "articles/buddhist-ai.html", "title": "新技术与佛教（未完成的调研·征求意见稿）", "title_sub": "数据科学、人工智能赋能佛学研究、修行与传播（全文·中英对照·征求意见稿）", "icon": "💻", "version": "⚠️ 草稿·征求意见·本研究尚未完成 · 十六章·结语·二附录 · 八幅图表 · 九项技术盘点 · 六项原则与十项评测 · 局限与待核登记 · 未竟与后续方向", "meta": "**定位**：佛教与新技术关系的专题研究——不作笼统的技术颂扬或技术怀疑，而是把相关技术\n逐项拆开，就「通用成熟度／佛教语域适配／主要瓶颈」三事分别评估，并给出可执行的治理框架。\n**方法**：信源以 A（机构官方发布／官方文件）、B（同行评议学术）、C（权威新闻与机构消息稿）\n三级标注；项目自述数据一律标【自述】；查无来源者如实标〔待核〕，不以推测填补；\n事实与判断分离（判断处标「（判断）」）。\n**立场**：对新技术不作笼统之褒贬，而致力于厘清其**前提条件与效能边界**——可为者言其可为，不可为者言其不可为。\n**看点**：汉传／藏传／南传数字化三传统比较（差距根源在组织形态而非技术能力）·\n九项技术成熟度盘点 · 佛教知识工程八层 · LLM 任务分级表 · 「可信佛学 AI」标准工作流 ·\nAI 辅助译经的分层术语标准与覆盖率仪表盘 · 修行辅助四层（学习辅助不等于修行本身）·\n「权威让渡」五风险 · 佛教哲学对 AI 伦理的贡献与其误用 · 六项原则与十项评测 ·\n跨学科（超学科）视角与实践者参与 · 建设主体「不需要新教团，需要联盟」。\n", "doc": "docs/汉传佛教/新技术与佛教_AI与数字人文研究.md", "doc_md": "# 新技术与佛教（未完成的调研·征求意见稿）：数据科学、人工智能在佛学研究、修行与传播中的应用\n\n### ——技术现状、效能边界与治理框架之综合研究（进行中）\n\n---\n\n> ⚠️ **草稿·征求意见（2026-09-19）——本研究尚未完成**\n>\n> 本文为一项**仍在进行中**的调研之中期成果，非已完结之研究。其材料收集、案例考察与实证佐证均未完成，具体而言：**语种方面**，日文、韩文、越南文之一手材料尚未系统检索，而日本 SAT 与 BDK、韩国佛教数字化均属本文应当考察而未及考察之列；**地域方面**，东南亚与欧洲各国汉传社群之分口径数据尚未采集；**实证方面**，各项目之准确率除少数模型卡自述外尚无第三方评测，佛教 AI 之用户研究与效果评估基本空白；**案例方面**，项目生态之盘点仍有未及者。以上各项，将随调研推进而陆续补入，本文亦将随之修订。故其内容、判断与结论均可能变动，**引用请注明版本与日期，勿视为定稿**。\n>\n\n> **EN对应 · Draft for Comment (19 September 2026) — This study is not yet complete**\n>\n> This article is the interim result of an inquiry **still in progress**, not a completed study. Its collection of materials, examination of cases, and empirical corroboration are all unfinished. Specifically: **as to languages**, primary materials in Japanese, Korean, and Vietnamese have not been systematically searched, and Japan's SAT and BDK and Korean Buddhist digitization fall within what this study ought to examine but has not; **as to regions**, disaggregated data on Chinese Buddhist communities in Southeast Asia and Europe have not been gathered; **as to empirical work**, the accuracy of most projects rests on self-description apart from a few model cards, with no third-party evaluation, and user studies and effect evaluations of Buddhist AI are essentially absent; **as to cases**, the survey of the project landscape remains incomplete. All of these will be incorporated as the inquiry advances, and this article will be revised accordingly. Its content, judgments, and conclusions are therefore subject to change. **Please cite with version and date; it is not a final text.**\n>\n\n\n> **EN对应 · New Technology and Buddhism**\n>\n> **Data Science and Artificial Intelligence in Buddhist Scholarship, Practice, and Transmission**\n>\n> A Comprehensive Study of the Present State, the Limits of Capability, and a Framework for Governance\n\n### 图表目录\n\n| 编号 | 名称 | 所在章 |\n|---|---|---|\n| 图 1 | 三大传统数字化组织形态对照 | 第一章 |\n| 图 2 | 佛教知识工程八层架构 | 第三章 |\n| 图 3 | 九项技术：通用成熟度与佛教语域适配 | 第四章 |\n| 图 4 | AI 任务适用度分级 | 第六章 |\n| 图 5 | 「可信佛学 AI」的标准工作流 | 第七章 |\n| 图 6 | 修行辅助的四层 | 第九章 |\n| 图 7 | 五至十年三阶段路线 | 第十四章 |\n| 图 8 | 跨学科的知识构成 | 第十六章 |\n\n各图均为示意性绘制；其数据点凡属本文评估者，均在正文对应处标「（判断）」，依据见附录三。\n\n---\n\n## 导言\n\n佛教与数字技术的关系，在过去半个世纪里经历了三个阶段：数字保存、数字检索与传播、以及正在展开的计算性佛学与智能化知识系统。第三个阶段与前两个阶段的区别在于，机器不再只是存放和检索文本，而开始被要求跨文本、跨版本、跨语言、跨人物、跨时空地建立关系——换言之，它开始被要求\"理解\"。\n\n这一转变的技术条件已经具备，社会条件却远未成熟。佛教典籍的数字化程度在各大传统之间极不均衡；机器翻译在佛典语域上的准确率仍不足以单独交付成果；大语言模型在人文学科中的引用准确率低至8.5%；而\"AI 是否能担任宗教权威\"这一类问题，常常在技术问题尚未澄清时就被当作教义问题提出。\n\n本研究即围绕这些问题展开，分 16 章：\n\n| 章 | 内容 |\n|---|---|\n| 第一章 | 横向比较汉传、藏传、南传三个传统在数字化上的进展与差距，指出差距的根源在组织形态而非技术能力 |\n| 第二章 | 论述佛教数字化从保存到知识工程的整体转向 |\n| 第三章 | 提出一套佛教知识系统的八层架构 |\n| 第四章 | 逐项盘点 OCR、机器翻译、语义检索、知识图谱、RAG、语音、计算机视觉、三维重建等九项技术的成熟度与佛教语域适配 |\n| 第五章至第七章 | 讨论 AI 在佛学研究中的具体位置：它能做什么、不能做什么，以及「可信佛学 AI」应当遵循的标准工作流 |\n| 第八章 | 专论 AI 辅助佛典翻译，本文认为这是最具投入价值的基础设施 |\n| 第九章至第十一章 | 处理修行辅助、「AI 师父」与佛教哲学对 AI 伦理的贡献 |\n| 第十二章 | 讨论传播度量、推荐算法与生理指标三条边界 |\n| 第十三章 | 盘点当前项目生态 |\n| 第十四章 | 给出五至十年的路线、六项原则与十项评测标准 |\n| 第十五章 | 讨论建设主体与组织形式 |\n| 第十六章 | 从跨学科（超学科）角度说明佛教 AI 的知识构成、学科接口与实践者参与 |\n\n与本文互为表里的传播与治理议题——全球传播现状、九处结构性问题、出路的整体设计——另见姊妹篇《汉传佛教的全球传播：现状、问题与出路》（草稿待续）。\n\n> **EN对应 · Introduction**\n>\n> ### List of Figures\n>\n> | No. | Title | Chapter |\n> |---|---|---|\n> | Figure 1 | Organizational forms of digitization in three traditions | One |\n> | Figure 2 | Eight-layer architecture of Buddhist knowledge engineering | Three |\n> | Figure 3 | Nine technologies: general maturity against fit to the Buddhist register | Four |\n> | Figure 4 | Task grading of AI applicability | Six |\n> | Figure 5 | Standard workflow for trustworthy Buddhist AI | Seven |\n> | Figure 6 | Four tiers of practice support | Nine |\n> | Figure 7 | Three-stage roadmap for five to ten years | Fourteen |\n> | Figure 8 | Disciplinary composition | Sixteen |\n>\n> All figures are schematic. Where a data point represents this study's own assessment, the corresponding passage in the text is marked \"(Judgment)\"; the basis is given in Appendix Three.\n>\n> Over the past half-century the relationship between Buddhism and digital technology has passed through three phases: digital preservation, digital retrieval and dissemination, and the computational and intelligent knowledge systems now unfolding. The third differs from the first two in that the machine is no longer merely storing and retrieving texts but is being asked to establish relations across texts, editions, languages, persons, and periods—in other words, it is being asked to \"understand.\"\n>\n> The technical conditions for this shift are in place; the social conditions are far from mature. The digitization of Buddhist canons is highly uneven across traditions; machine translation within the Buddhist register is not yet accurate enough to deliver results unaided; the citation accuracy of large language models in the humanities is as low as 8.5 percent; and questions such as \"can AI hold religious authority\" are frequently raised as doctrinal questions before the technical ones have been clarified.\n>\n> This study addresses these questions in sixteen chapters:\n>\n> | Chapter | Content |\n> |---|---|\n> | One | A cross-traditional comparison of digitization in Chinese, Tibetan, and Theravāda Buddhism, showing that the gap lies in organizational form rather than technical capacity |\n> | Two | The overall turn in Buddhist digitization from preservation to knowledge engineering |\n> | Three | An eight-layer architecture for a Buddhist knowledge system |\n> | Four | A capability inventory of nine technologies—OCR, machine translation, semantic search, knowledge graphs, RAG, speech, computer vision, and 3D reconstruction—assessed for maturity and fit to the Buddhist register |\n> | Five to Seven | Where AI actually stands in Buddhist scholarship: what it can do, what it cannot, and the standard workflow that trustworthy Buddhist AI should follow |\n> | Eight | AI-assisted translation of Buddhist texts, which this study regards as the infrastructure most worth investing in |\n> | Nine to Eleven | Practice support, the \"AI master,\" and what Buddhist philosophy contributes to AI ethics |\n> | Twelve | Three boundaries: transmission metrics, recommender algorithms, and physiological indices |\n> | Thirteen | The current project landscape |\n> | Fourteen | A five- to ten-year roadmap, six principles, and ten evaluation metrics |\n> | Fifteen | Who should build, and in what organizational form |\n> | Sixteen | The disciplinary composition, interfaces, and practitioner participation of Buddhist AI, from a transdisciplinary standpoint |\n>\n> The transmission and governance questions belonging to the companion volume—the present state of global transmission, nine structural problems, and the design of a way forward—appear in the sister volume, *The Global Transmission of Chinese Buddhism: Present State, Problems, and a Way Forward*.\n\n## 凡例\n\n**一、** 本文事实性陈述尽可能落到一手来源：机构官方发布、同行评议的学术研究、官方统计与文件。正文以 **A**（一手）、**B**（学术）、**C**（权威新闻与机构消息稿）三级标注。\n\n**二、** 项目方对自身规模、准确率与成效的陈述，一律标 **【自述】**。此类数字未必虚假，但未经独立核实，且同一项目的数字常因版本与口径不同而互相参差。\n\n**三、** 证据不足、或本身存在多方异说者，标 **〔待核〕〔存疑〕**，并列异说而不裁断。凡查不到的，就说查不到。\n\n**四、** 属推论、评估、主张与预测者，标 **（判断）**，并逐一注明**类型**与**依据**，与事实陈述分开。类型分：推论（由本文所引事实推出）、评估（对所引材料之评判）、论证（依本段逻辑推出）、主张（本文所持之规范建议）、预测（对将来之推估）、立场（本文之价值取向）、总结（通篇之归纳）。依据或指回本文具体章节与所引文献，或如实标明「属推测／无文献可据」——**凡无文献可据者，即直书无文献可据，不以含糊之词掩饰。** 全部判断另见附录三「判断与依据对照表」。\n\n**五、** **D** 级材料（各类百科、博客、自媒体）只作检索线索，不作论据。\n\n> **EN对应 · Note on Sources**\n>\n> **1.** Factual statements rest wherever possible on primary sources: institutional releases, peer-reviewed scholarship, official statistics, and official documents. Grades **A** (primary), **B** (academic), and **C** (authoritative news and institutional releases) appear throughout.\n>\n> **2.** A project's own account of its scale, accuracy, and effectiveness is marked **【self-reported】**. Such figures are not necessarily false, but they are not independently verified, and the same project's numbers often diverge across versions and definitions.\n>\n> **3.** Where evidence is insufficient or sources disagree, the text marks **〔pending verification〕** or **〔disputed〕** and sets the accounts side by side without adjudicating. Where nothing could be found, the text says so.\n>\n> **4.** Inferences, assessments, claims, and forecasts are marked **（判断）** (judgment) and are individually annotated with a **type** and a **basis**, separated from statements of fact. Types are: inference (derived from facts cited in this article), assessment (an appraisal of cited material), argument (derived from the logic of the passage), claim (a normative recommendation), forecast (an estimate about the future), position (a value stance), and synthesis (a generalization across the article). The basis either points back to a specific chapter or cited work, or states plainly that it is conjecture or has no documentary basis. **Where no documentation exists, the text says so directly rather than with hedging language.** All judgments are also listed in Appendix Three, \"Table of Judgments and Their Bases.\"\n>\n> **5.** **Grade D** material (general encyclopedias, blogs, self-published media) serves only to locate sources, never as grounds for argument.\n\n---\n## 一、佛教数字化的现状：三个传统的比较\n\n讨论佛教与新技术，须先明了一个基本事实：**佛教各传统在数字化上的进展极不均衡，而这种不均衡的根源不在技术能力，在组织形态。**\n\n三个传统在机构形态、资金结构、语料规模与西方通道四方面的对比，见图 1。\n\n### 汉传：机构分散与标准不一\n\n汉传佛教的数字资源，由数个互不统属的机构分头建设。\n\n**CBETA**（中华电子佛典协会）是主干。1998年由中华佛学研究所支持成立，圣严法师指示全力支持；2023年法人化时，法鼓山佛教基金会捐资 1,300 万，为最大捐助者。其长期采用 TEI/XML 结构化编码，使经典不仅可读，亦可被机器处理、引用与分析。截至 2026.R2 版，累计收录典籍**4,899部、22,150卷、逾 2.28 亿字**（A 级，[CBETA](https://cbeta.org)）。\n\n**SAT**（大正新脩大藏經テキストデータベース）由东京大学运营，其特色在于把数字文本与原始页面影像结合，2012年版本起提供原书页面影像，可定位到行（A 级，[SAT](https://21dzk.l.u-tokyo.ac.jp/SAT/)）。这意味着研究者可以在数字文本与纸本影像之间反复核验——此点在文献学上的价值极高。\n\n**DILA iSearch**（法鼓文理学院）整合十多个佛教数字档案，公开检索量超过 1.6 亿字符（A 级·【自述】，[DILA iSearch](https://isearch.dila.edu.tw/)）。\n\n近年的新进展包括：法鼓文理学院的数典专案，以六步流程（义项合并、摘要改写、义项分类、关系抽取验证、S-P-O 三元组抽取、实体链接）构建佛教知识图谱（A 级，[CBETA 活动报导](https://cbeta.org/post/30491)）；灵隐寺开发的古籍 OCR 引擎与数字化生产平台，推进《径山藏》《永乐北藏》《思溪藏》，并于2026年5月揭牌「杭州云林数字佛典研究院」（A 级，[杭州佛协](https://www.hzfjxh.com)）。\n\n这一格局的特征是：**机构分散、资源分散、标准不统一、无统一战略。** 每一处都在做实事，然彼此之间缺乏协同，元数据规范各异，且没有任何一方具备统筹全局的资源与权威。\n\n### 藏传：单一主导机构与统一战略\n\n藏传佛教的数字化，呈现一种与汉传截然不同的形态。\n\n**BDRC**（佛教数字资源中心）是其中的核心机构。其 BUDA 平台公开提供超过 1,700 万页佛教资料（A 级·【自述】〔[bdrc.io](https://www.bdrc.io/)〕；该机构2023年另有「5.9 万余册、3,000 万幅图像」的口径）。2025年3月14日，BDRC 发布藏文 OCR 桌面工具，免费开源，可批量处理图片与整册 PDF。2026年2月28日，它公告启动面向 AI 的开放佛教数据集计划：项目2025年12月启动，Khyentse 基金会资助，首席研究员为 CTO Élie Roux，规模以「数百万页」计。公告后两个月的进度为——Gold Standard 语料自一点九 GB 增至三点四 GB，2,600 万余幅图像完成 OCR，约 3.5 万幅图与转写完成对齐（A 级，[BDRC 公告](https://www.bdrc.io/blog/2026/02/28/)）。\n\n**84000** 则专事藏文大藏经之英译，并已发布 AI 使用立场文件（详见第八章）。\n\n**OpenPecha** 为藏文电子文本之开放协作平台，2019年由 BDRC 与 Esukhia 共同发起，其提出的「佛教知识供应链」框架（《The Supply Chain of Buddhist Knowledge - Framework v0.3》，2025年4月18日发布）试图贯通从原始资料到终端应用的整条链条。\n\n这一格局的特征是：**有单一强机构、有稳定资助、有明确战略、且战略从「先建数据」而非「先做产品」入手。**\n\n### 南传与日本\n\n南传方面，**SiPaKosa** 语料库收录僧伽罗语与巴利语佛典 78.6 万句、925 万词，以 Google Document AI 做历史写本 OCR 并辅以网络抓取，评估显示领域专有模型比开源模型性能为开源模型的 3 至 6 倍（B 级，Gurusinghe & Jayatilleke, arXiv:2603.29221, 2026；发表于 CHiPSAL@LREC 2026）。南传另一优势是与西方内观运动的紧密结合，使其禅修传统在英语世界有现成的传播通道。\n\n日本方面，**BDK 英译大藏经**自1982年起推进，其2017与2019两版丛书前言都说第一辑选定的7,185页已完成约65%——同一数字出现于相隔两年的两篇前言，是沿用旧文还是进度停滞，本文未能核实，标〔待核〕。\n\n### 差异之成因\n\n三类传统之差距，可从三方面解释。\n\n其一，组织形态。 藏传有一个 BDRC 承担全局；汉传有 CBETA、SAT、DILA、法鼓、灵隐各做一段，无人统筹。而有无统筹，直接体现在能否形成统一的数据标准、能否对外发布统一的接口、能否与国际 AI 团队有效对接。\n\n其二，资金结构。 BDRC 获 Khyentse 基金会等稳定资助，可规划十年；汉传各机构多为项目制资助，做完一个项目还要再募下一个。\n\n其三，与西方知识体系的关系。 藏传自1959年以后形成大规模的海外流散社群与西方信众群体，其中不乏具备技术与资金能力者，形成了「信众—学academic界—技术团队」的闭环。南传经由内观运动进入西方主流社会。汉传的海外社群以华人移民为主，其技术能力与资金多投入于道场建设与法会活动，较少进入数字人文。\n\n**结论：汉传在数字化上的落后，不是技术能力的落后，是组织形态与资源结构的落后。**（判断·评估／依据：本章三传统比较所举机构、资金、语料三项对照）这一判断的含义是明确的：如果不改变组织形态，单纯增加技术投入，其效果将十分有限。\n\n<svg viewBox=\"0 0 780 320\" style=\"width:100%;max-width:780px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"1\" y=\"1\" width=\"778\" height=\"318\" rx=\"8\" fill=\"#faf7f1\" stroke=\"#e0d7c8\"/><text x=\"130\" y=\"28\" font-size=\"13\" font-weight=\"bold\" fill=\"#b8863c\" text-anchor=\"middle\">汉传佛教 · 分散</text><text x=\"390\" y=\"28\" font-size=\"13\" font-weight=\"bold\" fill=\"#b8863c\" text-anchor=\"middle\">藏传佛教 · 单一强机构</text><text x=\"650\" y=\"28\" font-size=\"13\" font-weight=\"bold\" fill=\"#b8863c\" text-anchor=\"middle\">南传 / 日本 · 较集中</text><circle cx=\"95\" cy=\"110\" r=\"8\" fill=\"#5e8b9e\"/><text x=\"95\" y=\"132\" font-size=\"10.5\" fill=\"#4a3a22\" text-anchor=\"middle\">CBETA</text><circle cx=\"180\" cy=\"95\" r=\"8\" fill=\"#5e8b9e\"/><text x=\"180\" y=\"117\" font-size=\"10.5\" fill=\"#4a3a22\" text-anchor=\"middle\">SAT</text><circle cx=\"80\" cy=\"180\" r=\"8\" fill=\"#5e8b9e\"/><text x=\"80\" y=\"202\" font-size=\"10.5\" fill=\"#4a3a22\" text-anchor=\"middle\">DILA</text><circle cx=\"185\" cy=\"175\" r=\"8\" fill=\"#5e8b9e\"/><text x=\"185\" y=\"197\" font-size=\"10.5\" fill=\"#4a3a22\" text-anchor=\"middle\">法鼓数典</text><circle cx=\"130\" cy=\"240\" r=\"8\" fill=\"#5e8b9e\"/><text x=\"130\" y=\"262\" font-size=\"10.5\" fill=\"#4a3a22\" text-anchor=\"middle\">灵隐寺</text><line x1=\"101\" y1=\"115\" x2=\"174\" y2=\"100\" stroke=\"#c9bda9\" stroke-dasharray=\"3 3\"/><line x1=\"90\" y1=\"116\" x2=\"83\" y2=\"173\" stroke=\"#c9bda9\" stroke-dasharray=\"3 3\"/><line x1=\"135\" y1=\"183\" x2=\"125\" y2=\"233\" stroke=\"#c9bda9\" stroke-dasharray=\"3 3\"/><line x1=\"177\" y1=\"182\" x2=\"137\" y2=\"234\" stroke=\"#c9bda9\" stroke-dasharray=\"3 3\"/><line x1=\"99\" y1=\"116\" x2=\"177\" y2=\"170\" stroke=\"#c9bda9\" stroke-dasharray=\"3 3\"/><text x=\"130\" y=\"300\" font-size=\"10.5\" fill=\"#8a7b66\" text-anchor=\"middle\">无统筹机构 · 标准不一 · 项目制资助</text><circle cx=\"390\" cy=\"150\" r=\"26\" fill=\"#b8863c\"/><text x=\"390\" y=\"155\" font-size=\"12\" font-weight=\"bold\" fill=\"#faf7f1\" text-anchor=\"middle\">BDRC</text><circle cx=\"320\" cy=\"82\" r=\"9\" fill=\"#5e8b9e\"/><text x=\"320\" y=\"66\" font-size=\"10.5\" fill=\"#4a3a22\" text-anchor=\"middle\">84000</text><circle cx=\"462\" cy=\"82\" r=\"9\" fill=\"#5e8b9e\"/><text x=\"462\" y=\"66\" font-size=\"10.5\" fill=\"#4a3a22\" text-anchor=\"middle\">OpenPecha</text><circle cx=\"320\" cy=\"222\" r=\"9\" fill=\"#5e8b9e\"/><text x=\"320\" y=\"246\" font-size=\"10.5\" fill=\"#4a3a22\" text-anchor=\"middle\">藏文 OCR</text><circle cx=\"462\" cy=\"222\" r=\"9\" fill=\"#5e8b9e\"/><text x=\"462\" y=\"246\" font-size=\"10.5\" fill=\"#4a3a22\" text-anchor=\"middle\">开放数据集</text><line x1=\"371\" y1=\"134\" x2=\"330\" y2=\"92\" stroke=\"#b8863c\"/><line x1=\"409\" y1=\"134\" x2=\"452\" y2=\"92\" stroke=\"#b8863c\"/><line x1=\"371\" y1=\"167\" x2=\"330\" y2=\"212\" stroke=\"#b8863c\"/><line x1=\"409\" y1=\"167\" x2=\"452\" y2=\"212\" stroke=\"#b8863c\"/><text x=\"390\" y=\"300\" font-size=\"10.5\" fill=\"#8a7b66\" text-anchor=\"middle\">统一战略 · 稳定资助 · 先建数据后做产品</text><circle cx=\"600\" cy=\"130\" r=\"12\" fill=\"#5e8b9e\"/><text x=\"600\" y=\"112\" font-size=\"10.5\" fill=\"#4a3a22\" text-anchor=\"middle\">SiPaKosa</text><circle cx=\"700\" cy=\"130\" r=\"12\" fill=\"#5e8b9e\"/><text x=\"700\" y=\"112\" font-size=\"10.5\" fill=\"#4a3a22\" text-anchor=\"middle\">SAT</text><circle cx=\"650\" cy=\"215\" r=\"12\" fill=\"#5e8b9e\"/><text x=\"650\" y=\"241\" font-size=\"10.5\" fill=\"#4a3a22\" text-anchor=\"middle\">BDK 英译</text><line x1=\"612\" y1=\"130\" x2=\"688\" y2=\"130\" stroke=\"#b8863c\"/><line x1=\"605\" y1=\"141\" x2=\"645\" y2=\"204\" stroke=\"#b8863c\"/><line x1=\"695\" y1=\"141\" x2=\"656\" y2=\"204\" stroke=\"#b8863c\"/><text x=\"650\" y=\"300\" font-size=\"10.5\" fill=\"#8a7b66\" text-anchor=\"middle\">学术机构与出版机构主导 · 内观运动通道</text><line x1=\"260\" y1=\"16\" x2=\"260\" y2=\"286\" stroke=\"#e0d7c8\"/><line x1=\"520\" y1=\"16\" x2=\"520\" y2=\"286\" stroke=\"#e0d7c8\"/></svg>\n\n> 图 1｜三大传统数字化组织形态对照\n\n> **EN对应 · One: The Present State of Buddhist Digitization — A Comparison of Three Traditions**\n>\n> Before discussing Buddhism and new technology, one basic fact must be established: **the progress of Buddhist traditions in digitization is highly uneven, and the source of that unevenness lies not in technical capacity but in organizational form.**\n>\n> **Chinese Buddhism: dispersed and working in isolation.** Its digital resources are built by several mutually independent bodies. **CBETA** is the backbone: founded in 1998 with the support of the Chung-Hwa Institute of Buddhist Studies at Master Sheng Yen's instruction, incorporated in 2023 with a NT$13 million donation from the Dharma Drum Mountain Buddhist Foundation as its largest contribution, and long using TEI/XML structured encoding so that texts can be read and also processed, cited, and analysed by machine. As of version 2026.R2 it holds **4,899 titles, 22,150 fascicles, and over 228 million characters** (Grade A, [CBETA](https://cbeta.org)). **SAT**, run by the University of Tokyo, joins digital text to page images—available since the 2012 version and locatable to the line (Grade A, [SAT](https://21dzk.l.u-tokyo.ac.jp/SAT/)), so that a scholar may verify repeatedly between digital text and printed image. **DILA iSearch** integrates more than ten Buddhist digital archives and exposes over 160 million characters to public search (Grade A, self-reported, [DILA iSearch](https://isearch.dila.edu.tw/)). Recent work includes Dharma Drum's Digital Classics project, which uses a six-step process to build a Buddhist knowledge graph (Grade A, [CBETA event report](https://cbeta.org/post/30491)), and Lingyin Temple's OCR engine and digitization platform for the *Jingshan*, *Yongle Northern*, and *Sixi* canons, with the Hangzhou Yunlin Digital Buddhist Canon Research Institute inaugurated in May 2026 (Grade A, [Hangzhou Buddhist Association](https://www.hzfjxh.com)).\n>\n> The organizational forms of the three traditions are compared in Figure 1. The pattern: **dispersed institutions, dispersed resources, non-uniform standards, and no unified strategy.** Each party does real work, but there is little coordination among them, metadata standards differ, and none possesses the resources or authority to coordinate the whole.\n>\n> **Tibetan Buddhism: a single strong institution and an explicit strategy.** **BDRC** is the core body, its BUDA platform publicly offering more than 17 million pages (Grade A, self-reported, [bdrc.io](https://www.bdrc.io/); the same institution elsewhere gives \"over 59,000 volumes and over 30 million images\"). On 14 March 2025 it released a free, open-source desktop Tibetan OCR tool capable of batch-processing images and whole PDF volumes. On 28 February 2026 it announced an open Buddhist dataset initiative for AI—begun December 2025, funded by the Khyentse Foundation, led by CTO Élie Roux, at a scale measured in millions of pages; two months in, Gold Standard corpora grew from 1.9 GB to 3.4 GB, over 26 million images passed through OCR, and about 35,000 images were aligned with transcriptions (Grade A, [BDRC announcement](https://www.bdrc.io/blog/2026/02/28/)). **84000** devotes itself to English translation of the Tibetan canon and has published an AI position paper (see Chapter Eight). **OpenPecha**, an open collaborative platform for Tibetan e-texts founded in 2019 by BDRC and Esukhia, has proposed a \"Buddhist knowledge supply chain\" framework (*The Supply Chain of Buddhist Knowledge - Framework v0.3*, published 18 April 2025) intended to span the whole chain from source material to end-user application.\n>\n> The pattern: **a single strong institution, stable funding, an explicit strategy—and a strategy that begins with building data rather than with building a product.**\n>\n> **Theravāda and Japan.** For Theravāda, the **SiPaKosa** corpus holds 786,000 sentences and 9.25 million words of Sinhala and Pali Buddhist texts, using Google Document AI for OCR of historical manuscripts alongside web crawling; evaluation showed domain-specific models outperforming open-source models by three to six times (Grade B, Gurusinghe & Jayatilleke, arXiv:2603.29221, 2026; presented at CHiPSAL@LREC 2026). Its second advantage is a tight link to the Western vipassanā movement, giving its meditation tradition a ready channel into the English-speaking world. For Japan, the **BDK English Tripiṭaka** has advanced since 1982, and both its 2017 and 2019 prefaces state that about 65 percent of the 7,185 pages selected for the first series is complete—the same figure in prefaces two years apart. Whether this is a carried-over text or a genuine plateau, this report could not verify. Marked 〔pending verification〕.\n>\n> **Why the gap.** Three explanations. First, organizational form: Tibetan Buddhism has one BDRC to carry the whole; Chinese Buddhism has CBETA, SAT, DILA, Dharma Drum, and Lingyin each doing a segment, with no one coordinating—and the presence or absence of such coordination is directly reflected in whether a uniform data standard can be formed, whether a uniform interface can be published, and whether effective connection with international AI teams is possible. Second, funding structure: BDRC receives stable support from the Khyentse Foundation and others and can plan a decade ahead; Chinese Buddhist bodies are mostly project-funded and must raise money again when each project ends. **Third, the relationship with Western knowledge systems**: Tibetan Buddhism has, since 1959, formed a large overseas diaspora and a Western following that includes people with technical and financial capacity, producing a closed loop of followers, scholars, and technologists; Theravāda entered Western mainstream society through the vipassanā movement; Chinese Buddhism's overseas communities are mainly Chinese immigrants, whose technical capacity and funds go chiefly into temple construction and ritual activities rather than digital humanities.\n>\n> **Conclusion: Chinese Buddhism's backwardness in digitization is not a backwardness in technical capacity but in organizational form and resource structure.** (Judgment) The implication is clear: without changing the organizational form, simply increasing technical investment will accomplish little.\n\n---\n\n## 二、从数字化到知识工程化\n\n2026年2月28日，佛教数字资源中心（BDRC）公告了一项计划：把经过人工转录、OCR、多版本比较与交叉验证的佛教文献，建成适用于 AI 训练与研究的开放语料。项目2025年12月启动，Khyentse 基金会资助，规模以「数百万页」计。公告后两个月的进度：Gold Standard 语料从一点九 GB 增至三点四 GB，2,600 万余幅图像完成 OCR，约 3.5 万幅图与转写完成对齐（A 级，[BDRC 公告](https://www.bdrc.io/blog/2026/02/28/)）。\n\n这件事的重要性不在数字，在于它标的是一条路线的选择：**先建数据，再做智能**，而不是先做一个会说话的机器人。\n\n佛教与数字技术的关系，此前已经走过两个阶段，第三阶段正在到来。\n\n| 阶段 | 目标 | 技术特征 | 起始 |\n|---|---|---|---|\n| 数字保存 | 不丢失 | 扫描、图像存储、介质转换 | 20 世纪末 |\n| 数字检索与传播 | 能取到 | OCR、全文检索、网络发布 | 2000年代 |\n| 计算性佛学与智能化知识系统 | 能被机器理解与推理 | 结构化编码、向量嵌入、知识图谱、大语言模型 | 2020年代 |\n\n第三阶段与前两阶段的区别在于：机器不仅存储文本，而且可以跨文本、跨版本、跨语言、跨人物、跨时空建立关系，从而帮助研究者提出过去很难提出的问题。\n\n实证基础已经比较明确。CBETA 长期采用 TEI/XML 结构化编码，使经典不仅可读，也可被机器处理、引用、分析。东京大学的 SAT 项目把《大正新修大藏经》数字文本与原始页面定位结合，2012年版本起提供原书页面影像，可定位到行（A 级，[SAT](https://21dzk.l.u-tokyo.ac.jp/SAT/)）。法鼓文理学院的 DILA 综合检索系统整合十多个佛教数字档案，公开检索量超过 1.6 亿字符（A 级·【自述】，[DILA iSearch](https://isearch.dila.edu.tw/)）。BDRC 的 BUDA 平台公开提供超过 1,700 万页佛教资料（A 级·【自述】〔[bdrc.io](https://www.bdrc.io/)〕；该机构2023年另有「5.9 万余册、3,000 万幅图像」的口径）；2025年3月14日发布藏文 OCR 桌面工具，免费开源，可批量处理图片与整册 PDF。\n\n把这些并列，可以看到目标已经变了：从**「把佛典放到网上」**，变成**「把佛教文明建成可验证、可关联、可计算、可引用、可翻译、可供 AI 可靠使用的知识体系。」**\n\n对汉传而言，这个转变有一层特殊意义。**知识基础设施是少数几件不依赖「传教」就能做的事。** 它不需要对方先接受你的信仰，不需要跨过身份与政治的关口，也不需要说服任何人「我是好的」。它只需要把典籍整理好、把术语定清楚、把出处标明白——做完了，全世界的学者、译者、开发者、学习者都会用，用的时候自然会知道这是谁做的。（判断·预测／依据：属推测，无文献可据）\n\n反过来也成立：**在这件事上落后，不是少了一个宣传渠道，是在别人构建未来佛学知识秩序的时候缺席。** 十年之后，如果全球佛学 AI 的语料、术语、知识图谱、评测基准都已定型，而其中汉传的部分是稀薄甚至错误的，那么后来者能做的只有适配，而不是定义。\n\n## 三、八层基础设施\n\n一套理想的佛教知识系统，至少要有八层（见图 2）。\n\n| 层级 | 核心内容 | 相关技术 |\n|------|----------|----------|\n| 1. 原始资料层 | 大藏经、敦煌写本、碑刻、语录、灯录、寺志、地方志、报刊 | 扫描、OCR/HTR、图像识别 |\n| 2. 权威文本层 | 不同版本、校勘本、异文、断句、标点 | TEI/XML、版本控制 |\n| 3. 元数据层 | 经名、作者、译者、年代、卷次、出处、版本、版权 | Linked Data、标准元数据 |\n| 4. 术语层 | 梵／巴利／藏／汉／英术语及异译 | 术语库、本体 |\n| 5. 关系层 | 人物、法脉、寺院、文献、概念、历史事件之间的关系 | 知识图谱 |\n| 6. 语义层 | 段落、主题、概念、引文、相似文、跨语种对应 | 向量嵌入、语义检索 |\n| 7. AI 层 | RAG、LLM、翻译、分类、摘要、问答、智能体 | 大模型、视觉语言模型、Agent |\n| 8. 验证层 | 原典出处、版本、页码、证据链、专家修订记录 | 溯源、审计日志 |\n\n<svg viewBox=\"0 0 700 360\" style=\"width:100%;max-width:700px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"1\" y=\"1\" width=\"698\" height=\"358\" rx=\"8\" fill=\"#faf7f1\" stroke=\"#e0d7c8\"/><rect x=\"58\" y=\"18\" width=\"570\" height=\"34\" rx=\"6\" fill=\"#b8863c\"/><circle cx=\"40\" cy=\"35\" r=\"13\" fill=\"#b8863c\"/><text x=\"40\" y=\"40\" font-size=\"13\" font-weight=\"bold\" fill=\"#faf7f1\" text-anchor=\"middle\">8</text><text x=\"72\" y=\"40\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#4a3a22\">验证层</text><text x=\"616\" y=\"40\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"end\">溯源（provenance）、审计日志</text><rect x=\"58\" y=\"60\" width=\"570\" height=\"34\" rx=\"6\" fill=\"#bd9250\"/><circle cx=\"40\" cy=\"77\" r=\"13\" fill=\"#b8863c\"/><text x=\"40\" y=\"82\" font-size=\"13\" font-weight=\"bold\" fill=\"#faf7f1\" text-anchor=\"middle\">7</text><text x=\"72\" y=\"82\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#4a3a22\">AI 层</text><text x=\"616\" y=\"82\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"end\">RAG、LLM、翻译、分类、摘要、问答、Agent</text><rect x=\"58\" y=\"102\" width=\"570\" height=\"34\" rx=\"6\" fill=\"#c69e63\"/><circle cx=\"40\" cy=\"119\" r=\"13\" fill=\"#b8863c\"/><text x=\"40\" y=\"124\" font-size=\"13\" font-weight=\"bold\" fill=\"#faf7f1\" text-anchor=\"middle\">6</text><text x=\"72\" y=\"124\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#4a3a22\">语义层</text><text x=\"616\" y=\"124\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"end\">向量嵌入、语义检索、跨语种对应</text><rect x=\"58\" y=\"144\" width=\"570\" height=\"34\" rx=\"6\" fill=\"#cfab77\"/><circle cx=\"40\" cy=\"161\" r=\"13\" fill=\"#b8863c\"/><text x=\"40\" y=\"166\" font-size=\"13\" font-weight=\"bold\" fill=\"#faf7f1\" text-anchor=\"middle\">5</text><text x=\"72\" y=\"166\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#4a3a22\">关系层</text><text x=\"616\" y=\"166\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"end\">知识图谱（人物·法脉·寺院·文献·概念）</text><rect x=\"58\" y=\"186\" width=\"570\" height=\"34\" rx=\"6\" fill=\"#d7b78b\"/><circle cx=\"40\" cy=\"203\" r=\"13\" fill=\"#b8863c\"/><text x=\"40\" y=\"208\" font-size=\"13\" font-weight=\"bold\" fill=\"#faf7f1\" text-anchor=\"middle\">4</text><text x=\"72\" y=\"208\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#4a3a22\">术语层</text><text x=\"616\" y=\"208\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"end\">梵／巴利／藏／汉／英术语库、本体</text><rect x=\"58\" y=\"228\" width=\"570\" height=\"34\" rx=\"6\" fill=\"#dfc39f\"/><circle cx=\"40\" cy=\"245\" r=\"13\" fill=\"#b8863c\"/><text x=\"40\" y=\"250\" font-size=\"13\" font-weight=\"bold\" fill=\"#faf7f1\" text-anchor=\"middle\">3</text><text x=\"72\" y=\"250\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#4a3a22\">元数据层</text><text x=\"616\" y=\"250\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"end\">Linked Data、标准元数据</text><rect x=\"58\" y=\"270\" width=\"570\" height=\"34\" rx=\"6\" fill=\"#e7cfb3\"/><circle cx=\"40\" cy=\"287\" r=\"13\" fill=\"#b8863c\"/><text x=\"40\" y=\"292\" font-size=\"13\" font-weight=\"bold\" fill=\"#faf7f1\" text-anchor=\"middle\">2</text><text x=\"72\" y=\"292\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#4a3a22\">权威文本层</text><text x=\"616\" y=\"292\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"end\">TEI/XML、版本控制、异文与校勘</text><rect x=\"58\" y=\"312\" width=\"570\" height=\"34\" rx=\"6\" fill=\"#efe0c9\"/><circle cx=\"40\" cy=\"329\" r=\"13\" fill=\"#b8863c\"/><text x=\"40\" y=\"334\" font-size=\"13\" font-weight=\"bold\" fill=\"#faf7f1\" text-anchor=\"middle\">1</text><text x=\"72\" y=\"334\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#4a3a22\">原始资料层</text><text x=\"616\" y=\"334\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"end\">扫描、OCR/HTR、图像识别</text><text x=\"350\" y=\"352\" font-size=\"10.5\" fill=\"#8a7b66\" text-anchor=\"middle\">上层依赖下层：语料不权威，则 AI 层的输出亦不可信</text></svg>\n\n> 图 2｜佛教知识工程八层架构\n\nCBETA 的 TEI/XML 实践已经证明佛典完全可以成为标准化的数字人文对象；SAT 则进一步强调「数字文本必须能够回到原始页面核验」——这是未来佛教 AI 可信性的基本原则。\n\n由此可以推出一个与流行看法相反的结论：**佛教 AI 的核心竞争力，首先不在「模型有多大」，而在底层语料是否权威、版本是否清楚、出处是否可追溯、术语是否规范、不同传统是否被正确区分。**（判断·评估／依据：第一章 CBETA 与 BDRC 之组织形态差异、第四章九项技术之瓶颈分布）\n\n这个判断有一个直接的推论，值得单独说：**训练一个佛教大模型，对汉传而言几乎肯定不是最优投入。** 通用大模型的能力在快速提升，自建模型的门槛与折旧速度都在恶化；而权威语料、规范术语、清晰版本、可追溯出处这些东西，一旦建成，其价值不随模型换代而贬值，反而随每一次模型升级而放大。**在资源分配上，语料建设之边际收益高于模型参数之扩展。**（判断·推论／依据：同段所举通用模型能力提升与自建模型折旧两项条件）\n\n## 四、技术能力盘点：九项技术之成熟度与佛教语域适配\n\n讨论佛教与 AI，容易陷入两种笼统：或以为技术已无所不能，或以为技术全然不可靠。两种说法都无助于判断。较为切实的做法，是把相关技术逐项拆开，就三件事分别评估——该技术本身成熟到何种程度、它在佛教语域中的适配性如何、以及它的主要瓶颈何在。\n\n| 技术 | 通用成熟度 | 佛教语域适配 | 主要瓶颈 |\n|------|-----------|-------------|----------|\n| OCR／HTR（写本识别） | 印刷体高／写本中 | 中 | 异体字、俗字、竖排夹注、残损 |\n| 机器翻译 | 中高 | 中低 | 术语不统一、命名实体、幻觉 |\n| 语义检索（向量嵌入） | 高 | 中高 | 需高质量平行语料与切分粒度 |\n| 知识图谱 | 中 | 中 | 本体设计、宗派区分、关系抽取准确率 |\n| 检索增强生成（RAG） | 高 | 中高 | 出处准确率、跨版本引用 |\n| 大语言模型（摘要、问答） | 高 | 中 | 幻觉、宗派混淆、教义扁平化 |\n| 语音识别与合成 | 高／中 | 中 | 诵经腔调、方言、古音、专名 |\n| 计算机视觉（图像、壁画） | 中高 | 中低 | 佛教图像语料稀缺、题材标注困难 |\n| 三维重建与沉浸式 | 中 | 中 | 成本高、现场采集受限、实证不足 |\n\n<svg viewBox=\"0 0 760 470\" style=\"width:100%;max-width:760px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"1\" y=\"1\" width=\"758\" height=\"468\" rx=\"8\" fill=\"#faf7f1\" stroke=\"#e0d7c8\"/><line x1=\"100\" y1=\"60\" x2=\"100\" y2=\"400\" stroke=\"#efe6d6\"/><line x1=\"100\" y1=\"400\" x2=\"640\" y2=\"400\" stroke=\"#efe6d6\"/><line x1=\"235\" y1=\"60\" x2=\"235\" y2=\"400\" stroke=\"#efe6d6\"/><line x1=\"100\" y1=\"315\" x2=\"640\" y2=\"315\" stroke=\"#efe6d6\"/><line x1=\"370\" y1=\"60\" x2=\"370\" y2=\"400\" stroke=\"#efe6d6\"/><line x1=\"100\" y1=\"230\" x2=\"640\" y2=\"230\" stroke=\"#efe6d6\"/><line x1=\"505\" y1=\"60\" x2=\"505\" y2=\"400\" stroke=\"#efe6d6\"/><line x1=\"100\" y1=\"145\" x2=\"640\" y2=\"145\" stroke=\"#efe6d6\"/><line x1=\"640\" y1=\"60\" x2=\"640\" y2=\"400\" stroke=\"#efe6d6\"/><line x1=\"100\" y1=\"60\" x2=\"640\" y2=\"60\" stroke=\"#efe6d6\"/><line x1=\"100\" y1=\"400\" x2=\"640\" y2=\"400\" stroke=\"#b8863c\"/><line x1=\"100\" y1=\"400\" x2=\"100\" y2=\"60\" stroke=\"#b8863c\"/><text x=\"370\" y=\"440\" font-size=\"12\" fill=\"#4a3a22\" text-anchor=\"middle\">通用成熟度 →</text><text x=\"30\" y=\"230\" font-size=\"12\" fill=\"#4a3a22\" text-anchor=\"middle\" transform=\"rotate(-90 30 230)\">佛教语域适配 →</text><rect x=\"480\" y=\"70\" width=\"170\" height=\"90\" rx=\"6\" fill=\"#e8f0f3\" opacity=\"0.65\"/><text x=\"492\" y=\"88\" font-size=\"11\" fill=\"#3f6b7d\" text-anchor=\"start\">优先投入区</text><circle cx=\"586\" cy=\"128\" r=\"6\" fill=\"#5e8b9e\"/><text x=\"586\" y=\"146\" font-size=\"10.5\" fill=\"#4a3a22\" text-anchor=\"middle\">语义检索</text><circle cx=\"573\" cy=\"162\" r=\"6\" fill=\"#5e8b9e\"/><text x=\"573\" y=\"180\" font-size=\"10.5\" fill=\"#4a3a22\" text-anchor=\"middle\">RAG</text><circle cx=\"600\" cy=\"239\" r=\"6\" fill=\"#5e8b9e\"/><text x=\"600\" y=\"257\" font-size=\"10.5\" fill=\"#4a3a22\" text-anchor=\"middle\">大语言模型</text><circle cx=\"532\" cy=\"222\" r=\"6\" fill=\"#5e8b9e\"/><text x=\"532\" y=\"240\" font-size=\"10.5\" fill=\"#4a3a22\" text-anchor=\"middle\">语音识别与合成</text><circle cx=\"505\" cy=\"230\" r=\"6\" fill=\"#5e8b9e\"/><text x=\"495\" y=\"234\" font-size=\"10.5\" fill=\"#4a3a22\" text-anchor=\"end\">OCR / HTR</text><circle cx=\"370\" cy=\"196\" r=\"6\" fill=\"#5e8b9e\"/><text x=\"370\" y=\"214\" font-size=\"10.5\" fill=\"#4a3a22\" text-anchor=\"middle\">知识图谱</text><circle cx=\"370\" cy=\"247\" r=\"6\" fill=\"#5e8b9e\"/><text x=\"370\" y=\"265\" font-size=\"10.5\" fill=\"#4a3a22\" text-anchor=\"middle\">三维重建与沉浸式</text><circle cx=\"478\" cy=\"290\" r=\"6\" fill=\"#5e8b9e\"/><text x=\"478\" y=\"308\" font-size=\"10.5\" fill=\"#4a3a22\" text-anchor=\"middle\">计算机视觉</text><circle cx=\"438\" cy=\"298\" r=\"6\" fill=\"#5e8b9e\"/><text x=\"428\" y=\"302\" font-size=\"10.5\" fill=\"#4a3a22\" text-anchor=\"end\">机器翻译</text></svg>\n\n> 图 3｜九项技术：通用成熟度与佛教语域适配\n\n九项技术在「通用成熟度」与「佛教语域适配」两个维度上的分布，见图 3。以下就其中数项作较详之说明。\n\n### OCR 与写本识别\n\n印刷体汉文佛典的 OCR 已相当成熟，主流通用引擎在清晰扫描件上的字符准确率可达极高水平，配合后处理与词典约束，可满足大规模数字化之需。真正困难的是**写本**：敦煌写卷、宋元刻本、日本古写经，普遍存在异体字、俗字、避讳字、竖排夹注、页面残损等问题，通用模型的准确率显著下降。\n\n此处技术路线是领域适配而非通用替换：以人工校录的高质量样本作微调，辅以字形字典与语言模型约束。龙泉寺藏经办公室自2016至2017年间以深度学习处理古籍，用《高丽藏》168 万行作训练数据，并实现了文言自动断句标点，2018年开放「古籍酷」平台（C 级，[南方都市报](https://m.mp.oeeee.com/a/BAAFRD000020201220397973.html)）；BDRC 于2025年发布藏文 OCR 桌面工具，免费开源、支持批量处理；灵隐寺开发古籍 OCR 引擎与数字化生产平台。三个例子都说明：**这一环节的技术门槛已不再高，真正的门槛在于高质量训练数据的积累与人工校对的投入。**\n\n### 机器翻译\n\n机器翻译在通用语域已相当可用，但在古汉语佛典这一语域上，仍不足以单独交付成果。困难有三点：其一，术语。同一梵文词在不同译师笔下有不同汉译（详见第八章），反向亦然，机器难以判断应取何一译名。其二，命名实体。Dharmamitra 项目发布的佛教汉英翻译模型在其模型卡上明确说明，该系统在人物、地点等命名实体上存在机器翻译系统常见的问题。其三，幻觉。同一模型卡写明，该系统「有时会表现出幻觉倾向」。\n\n2024年一项研究比较了 ChatGPT-4、ERNIE Bot 4 与 Gemini Advanced 对古汉语佛教文本之翻译能力，研究使用来自 CBETA 的佛典与中国佛教文献并通过人工评价分析（B 级，Xiang Wei, *Religions* 15(12):1559, 2024）。此类研究之价值，在于把「LLM 加佛典翻译」从概念讨论推进到可比较评测阶段。\n\n### 语义检索\n\n语义检索是本清单中**适配性最好、风险最低**的一项。其原理是把文本切分为段落并转为向量嵌入，检索时按语义相似度而非字面匹配返回结果。对佛学研究而言，其价值在于解决一个长期困扰：**研究者须预先知悉关键词方可检索，而佛典的异写、别译、别称极多，想不全便搜不全。**\n\n技术上的关键不在模型，而在**切分粒度与语料质量**。佛典的段落结构（品、卷、科判）与通用文本差异甚大，切分不当则向量语义失真。此外，跨语种检索（如以英文查询中文佛典）需高质量平行语料支撑，而此类语料恰恰稀缺。\n\n目前 DILA 已有面向多个佛教数字档案之综合检索体系；伯克利 Dharmamitra 项目之 MITRASearch 则把语义检索扩展至跨语种。\n\n### 知识图谱\n\n知识图谱的技术链条较长：实体识别、关系抽取、实体链接、本体设计、图谱存储与查询，每一环都有准确率损失，累积之后的可靠性需要审慎评估。其特殊困难在于**本体设计**——佛教的宗派差异使得同一名相在天台、华严、唯识、禅、净土各有不同所指，如果本体不区分传统，图谱将把不同义项混为一谈。\n\n法鼓文理学院数典专案采用的六步流程（义项合并、摘要改写、义项分类、关系抽取验证、S-P-O 三元组抽取、实体链接），其中「义项分类」与「关系抽取验证」两步正是针对此项困难而设，且流程中保留人工验证环节（A 级，[CBETA 活动报导](https://cbeta.org/post/30491)）。\n\n### 检索增强生成（RAG）\n\nRAG 是目前佛教 AI 应用中最主流的技术路线。其原理是在生成答案前先检索相关原文，将原文作为上下文一并交给模型，从而约束生成内容使之有所依据。\n\nRAG 解决了「无据生成」的一部分问题，却未解决全部问题。原因在于：**检索到的原文是否正确、完整、来自何一版本，仍然需要另行校验。** 如果检索库本身版本混乱，则 RAG 会把混乱带入答案，且因有\"出处\"而显得更为可信——这是一种比裸幻觉更危险的情形。\n\n此即第五章所述标准工作流中，为什么「原典定位」之后还需要「卷／页／段落核验」与「多版本比较」两道工序。\n\n### 语音与图像\n\n语音识别在讲法录音转写上有实际价值，其困难在于诵经腔调、方言口音与大量专名。语音合成可用于有声经典，然古音与唱诵腔调之还原属另一问题，非通用 TTS 所能解决。\n\n计算机视觉在佛教领域主要用于写本图像处理、壁画与经变图的题材识别、造像风格分类等。这一方向的瓶颈不在算法，而在**标注语料稀缺**——佛教图像学之专业标注需兼具图像学与教理知识，人力成本极高。\n\n### 三维重建与沉浸式技术\n\n石窟与寺院之三维扫描重建技术已经成熟，国内外已有相当数量的实践案例。其瓶颈在于采集成本、现场条件限制，以及重建成果之长期维护。至于沉浸式体验对修行之实际作用，现有实证证据仍不充分（见第十一章）。\n\n### 总体评估\n\n综合九项技术之评估，可以得出一项总体判断：**佛教数字化所面临之障碍，主要不在算法，而在数据。**（判断·评估／依据：本章九项技术逐项评估中瓶颈之分布）具体言之，凡有高质量、结构化、标注完善之语料处，技术即可发挥作用；凡无此类语料处，再先进之模型亦无从着手。此判断之后果是明确的：投入的重点应当放在语料建设与标注，而非模型选型。\n\n> **EN对应 · Four: A Capability Inventory — Nine Technologies, Their Maturity, and Their Fit to the Buddhist Register**\n>\n> Discussion of Buddhism and AI falls easily into one of two generalities: that technology can now do anything, or that it is wholly unreliable. Neither helps. A more useful approach is to separate the relevant technologies and assess each on three counts—how mature the technology is in general, how well it fits the Buddhist register, and where its chief bottleneck lies.\n>\n> | Technology | General maturity | Fit to the Buddhist register | Principal bottleneck |\n> |---|---|---|---|\n> | OCR / HTR (manuscript recognition) | High for print / medium for manuscripts | Medium | Variant characters, popular forms, interlinear notes, damage |\n> | Machine translation | Medium-high | Medium-low | Inconsistent terminology, named entities, hallucination |\n> | Semantic search (embeddings) | High | Medium-high | Requires high-quality parallel corpora and good segmentation |\n> | Knowledge graphs | Medium | Medium | Ontology design, school differentiation, extraction accuracy |\n> | Retrieval-augmented generation (RAG) | High | Medium-high | Source accuracy, citation across editions |\n> | Large language models (summarization, Q&A) | High | Medium | Hallucination, conflation of schools, doctrinal flattening |\n> | Speech recognition and synthesis | High / medium | Medium | Chanting styles, dialect, historical pronunciation, proper names |\n> | Computer vision (images, murals) | Medium-high | Medium-low | Scarce Buddhist image corpora; difficult subject annotation |\n> | 3D reconstruction and immersion | Medium | Medium | High cost, limited site access, insufficient empirical evidence |\n>\n> **OCR and manuscript recognition.** OCR of printed Chinese Buddhist texts is now well developed; genuinely difficult are **manuscripts**—Dunhuang scrolls, Song and Yuan printed editions, Japanese old manuscripts—where variant characters, taboo characters, interlinear notes, and damaged pages sharply reduce the accuracy of general models. The technical route here is domain adaptation rather than wholesale replacement: fine-tuning on high-quality hand-transcribed samples, with character dictionaries and language-model constraints. Three examples make the point: Longquan Monastery's scripture office used deep learning on ancient texts between 2016 and 2017, training on 1.68 million lines of the Korean canon and implementing automatic sentence segmentation and punctuation, opening the \"Gujiku\" platform in 2018 (Grade C, [Southern Metropolis Daily](https://m.mp.oeeee.com/a/BAAFRD000020201220397973.html)); BDRC released a Tibetan OCR desktop tool in 2025, free, open-source, and batch-capable; Lingyin Temple developed an OCR engine and digitization platform. All three show that **the technical threshold here is no longer high; the real threshold lies in accumulating high-quality training data and investing in human proofreading.**\n>\n> **Machine translation.** Usable in general registers, but not yet able to deliver results unaided in the register of classical Chinese Buddhist texts. Three difficulties: **terminology** (the same Sanskrit term has different Chinese renderings under different translators, and vice versa—see Chapter Eight—so the machine cannot decide which rendering to choose); **named entities** (the Dharmamitra model's own card states the system has the usual problems NMT systems have with names of persons and places); and **hallucination** (the same card notes the model \"shows a tendency to hallucinate at times\"). A 2024 study compared ChatGPT-4, ERNIE Bot 4, and Gemini Advanced on classical Chinese Buddhist texts, using texts from CBETA and Chinese Buddhist literature with human evaluation (Grade B, Xiang Wei, *Religions* 15(12):1559, 2024)—valuable for moving \"LLM plus Buddhist translation\" from conceptual discussion into comparable evaluation.\n>\n> **Semantic search** is the **best-fitting and lowest-risk item** on this list. Its value lies in solving a long-standing problem: **a researcher must already know the keyword in order to search, and Buddhist texts have so many variant writings, alternate translations, and alternate names that failure to think of them all means an incomplete search.** The technical key is not the model but **segmentation granularity and corpus quality**: the structural divisions of Buddhist texts (chapter, fascicle, outline) differ greatly from general text, and poor segmentation distorts the vectors' meaning. Cross-lingual search in turn requires high-quality parallel corpora, which are precisely scarce. DILA already offers integrated search across several archives; MITRASearch extends semantic search across languages.\n>\n> **Knowledge graphs.** The technical chain is long—entity recognition, relation extraction, entity linking, ontology design, storage and query—and accuracy losses accumulate. Its particular difficulty is **ontology design**: the same term means different things in Tiantai, Huayan, Yogācāra, Chan, and Pure Land, and an ontology that does not distinguish traditions will conflate them. The six-step process used by Dharma Drum's Digital Classics project—merging senses, rewriting summaries, classifying senses, extracting and validating relations, extracting subject-predicate-object triples, and entity linking—includes \"classifying senses\" and \"validating relations\" precisely for this difficulty, and retains human verification within the process (Grade A, [CBETA event report](https://cbeta.org/post/30491)).\n>\n> **Retrieval-augmented generation (RAG)** is the most mainstream technical route in Buddhist AI today: retrieving relevant source text before generating, and passing it as context so that generation is constrained to have a basis. RAG solves part of the problem of unsupported generation but not all of it. **Whether the retrieved text is correct, complete, and from which edition still requires separate verification.** If the retrieval corpus itself is editionally confused, RAG carries that confusion into the answer—and because it now has a \"source,\" it appears more credible. This is more dangerous than bare hallucination. Hence the standard workflow in Chapter Five: after locating the canonical passage, verification of fascicle, page, and passage, and comparison across editions, remain necessary steps.\n>\n> **Speech and images.** Speech recognition has practical value in transcribing dharma talks; the difficulties are chanting styles, dialectal accent, and large numbers of proper names. Speech synthesis can produce audio scriptures, but restoring historical pronunciation and chanting styles is a separate problem that general TTS cannot solve. Computer vision in Buddhist contexts is used mainly for manuscript image processing, subject recognition in murals and transformation tableaux, and stylistic classification of sculpture. The bottleneck here is not the algorithm but **scarce annotated corpora**—professional annotation in Buddhist iconography requires both iconographic and doctrinal knowledge, and the labour cost is very high.\n>\n> **3D reconstruction and immersion.** Three-dimensional scanning and reconstruction of cave sites and temples is mature, with substantial practice in China and abroad. The bottlenecks are acquisition cost, site-access limits, and long-term maintenance of the results. As for the actual effect of immersive experience on practice, existing empirical evidence remains insufficient (see Chapter Eleven).\n>\n> **One overall judgment.** Across the nine technologies: **the obstacles facing Buddhist digitization lie chiefly not in algorithms but in data.** (Judgment) Where high-quality, structured, well-annotated corpora exist, technology can do its work; where they do not, even the most advanced model has nowhere to begin. The implication is clear: investment should go into corpus construction and annotation, not model selection.\n\n---\n\n## 五、AI 辅助佛学研究：增益而非替代\n\nAI 在佛学研究上真正增益之处，不在于替代学者思考，而在于将其从检索工作中解放出来，使其得以专注于判断。其能力可归为三类：\n\n| 能力 | 技术原理 | 对佛学研究的价值 | 主要限制 |\n|---|---|---|---|\n| 语义检索 | 文本切分、向量嵌入、按语义相似度召回 | 解决「须预先知悉关键词方可检索」之困 | 切分粒度与语料质量直接影响效果 |\n| 文本复用检测 | 全文向量化，识别跨卷引用、同义改写、伪引文 | 使「此句此前出现于何处」可大规模计算 | 所发现者为关联，关系性质仍须人工判定 |\n| 知识图谱 | 实体与关系抽取、实体链接、图谱查询 | 使佛教史成为可查询的动态网络 | 本体设计须区分宗派，否则混同义项 |\n\n**语义检索。** 传统检索依赖「研究者须预先知悉关键词」。欲知唐宋时期关于「无念」之论述，须先想到「无念」一词，并想到其异写、别译、别称；思虑不全，则检索不全。语义检索改变了这一步：研究者可直接提出检索意图，由系统先作语义召回，再按年代、宗派、人物、文本类型过滤，最后返回原文、卷次、版本信息。DILA 已有面向多个佛教数字档案的综合检索体系；伯克利 Dharmamitra 项目的 MITRASearch 则将语义检索扩展至跨语种。\n\n**文本复用检测。** 此项适用于一个传统方法难以大规模处理的问题：「此句此前出现于何处？」将数千万字佛典转为向量之后，跨卷引用识别、同义改写识别、文本复用检测、伪引文识别、引文传播路径分析、注疏间思想继承关系分析，均变得可行。其意义在于改变思想史研究的形态：过去追踪一个人物、一部经典或一条引文或须数年，此后机器先完成大规模候选发现，学者再进行解释。佛学研究因此可能从「小规模精读」扩展为「精读与大规模计算发现并行」。\n\n**知识图谱。** 将佛教史重建为动态网络（人物、师承、寺院、地域、著作、讲学活动、法脉、时代、社会网络）之后，下列问题即成为可研究者：\n\n- 某一禅宗法脉在不同世纪的传播路径\n- 某部经典为哪些人物引用最多\n- 某寺院与哪些学者、僧侣发生过知识交流\n- 某一思想概念在哪些时期快速扩散\n- 中国、日本、韩国、越南之间的思想传播网络\n\n法鼓文理学院2026年5月的数典专案春季成果发表会，已把「圣严法师年谱知识图谱」「佛典语义搜索」「大型语言模型与佛教数字文献」列为实际研究议题，并用六步流程（义项合并、摘要改写、义项分类、关系抽取验证、S-P-O 三元组抽取、实体链接）构建佛教知识图谱；同一场发表会上，有研究者以 Obsidian 与 Claude Code 建立了《俱舍论注杂录》的引文库（A 级，[CBETA 活动报导](https://cbeta.org/post/30491)）。需说明两处：该场发表会的内容包含614笔引文库、平行文本索引与六版本对勘，流传材料中「《阿含》关联可视化」的表述与该场实际内容有出入；而 CBETA 官网刊载法鼓山数典的内容，源于两者同源——CBETA 1998年由中华佛学研究所支持成立，圣严法师指示全力支持；2023年法人化时，法鼓山佛教基金会捐资13,000,000，是最大捐助者。\n\n一个容易被夸大的边界。 上述都是真实的能力，但有一条边界必须标明：**知识图谱与语义检索能发现「关联」，不能判定「意义」。** 机器可以告诉你某条引文在200部文献中出现过，不能告诉你哪一次引用是承袭、哪一次是反驳、哪一次是误读。宗派教义的判定、思想史的因果、文本的思想分量，仍然只能由受过训练的人来做。\n\n## 六、LLM 适用性分级：可为与不可为\n\n将任务逐项列明，较之笼统断言「AI 有用」或「AI 不可靠」，于判断更具助益。\n\n| 任务 | AI 适用程度 | 原因 |\n|------|------------|------|\n| 文章摘要 | 高 | 可由人工快速核验 |\n| 关键词提取 | 高 | 结构化任务 |\n| 初步文献综述 | 高 | 适合召回与整理 |\n| 相似文寻找 | 高 | 机器优势明显 |\n| 多版本比对 | 高 | 可大规模自动化 |\n| 跨语种资料发现 | 高 | LLM 的优势领域 |\n| 术语候选解释 | 中高 | 必须回原典 |\n| 机器翻译初稿 | 中高 | 可明显提高效率 |\n| 思想史解释 | 中 | 必须依赖专家判断 |\n| 宗派教义判定 | 中低 | 易把不同传统混淆 |\n| 经典最终翻译 | 低 | 需专业译者 |\n| 戒律判断 | 低 | 涉及传统与具体情境 |\n| 指导高风险修行问题 | 很低 | AI 不应承担最终权威角色 |\n| 断定「某观点就是佛法真义」 | 很低 | 涉及复杂传统与诠释权 |\n\n<svg viewBox=\"0 0 740 310\" style=\"width:100%;max-width:740px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"1\" y=\"1\" width=\"738\" height=\"308\" rx=\"8\" fill=\"#faf7f1\" stroke=\"#e0d7c8\"/><text x=\"16\" y=\"24\" font-size=\"11.5\" fill=\"#8a7b66\">适用程度</text><line x1=\"16\" y1=\"32\" x2=\"724\" y2=\"32\" stroke=\"#e0d7c8\"/><text x=\"16\" y=\"66\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#4a3a22\">高</text><rect x=\"70\" y=\"46\" width=\"660\" height=\"30\" rx=\"5\" fill=\"#7a9a6b\"/><text x=\"84\" y=\"66\" font-size=\"11.5\" fill=\"#faf7f1\">文章摘要 · 关键词提取 · 初步文献综述 · 相似文寻找 · 多版本比对 · 跨语种资料发现</text><text x=\"16\" y=\"108\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#4a3a22\">中高</text><rect x=\"70\" y=\"88\" width=\"510\" height=\"30\" rx=\"5\" fill=\"#9aab74\"/><text x=\"84\" y=\"108\" font-size=\"11.5\" fill=\"#faf7f1\">术语候选解释 · 机器翻译初稿</text><text x=\"16\" y=\"150\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#4a3a22\">中</text><rect x=\"70\" y=\"130\" width=\"390\" height=\"30\" rx=\"5\" fill=\"#c9b06a\"/><text x=\"84\" y=\"150\" font-size=\"11.5\" fill=\"#faf7f1\">思想史解释</text><text x=\"16\" y=\"192\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#4a3a22\">中低</text><rect x=\"70\" y=\"172\" width=\"300\" height=\"30\" rx=\"5\" fill=\"#d0a05e\"/><text x=\"84\" y=\"192\" font-size=\"11.5\" fill=\"#faf7f1\"></text><text x=\"394\" y=\"192\" font-size=\"11.5\" fill=\"#4a3a22\">宗派教义判定</text><text x=\"16\" y=\"234\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#4a3a22\">低</text><rect x=\"70\" y=\"214\" width=\"210\" height=\"30\" rx=\"5\" fill=\"#c98a5e\"/><text x=\"84\" y=\"234\" font-size=\"11.5\" fill=\"#faf7f1\"></text><text x=\"304\" y=\"234\" font-size=\"11.5\" fill=\"#4a3a22\">经典最终翻译 · 戒律判断</text><text x=\"16\" y=\"276\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#4a3a22\">很低</text><rect x=\"70\" y=\"256\" width=\"138\" height=\"30\" rx=\"5\" fill=\"#b86b5e\"/><text x=\"84\" y=\"276\" font-size=\"11.5\" fill=\"#faf7f1\"></text><text x=\"232\" y=\"276\" font-size=\"11.5\" fill=\"#4a3a22\">指导高风险修行问题 · 断定「某观点即佛法真义」</text></svg>\n\n> 图 4｜AI 任务适用度分级\n\n上述分级见图 4。此表之用途颇为具体：**它将「是否应当使用 AI」这一笼统问题，转化为具体任务适用度之分级判断。** 摘要、检索、找相似文、比对版本——放心用。最终翻译、戒律判断、教义裁定、高风险修行指导——不能用，或者只能在人明确担责的前提下用。\n\n需要补充的是这张表之外的一个事实：幻觉并不限于佛学领域。*Nature* 上的一项研究提出用语义熵检测 LLM 幻觉的方法，并指出模型即使在语言流畅度很高时仍会产生无根据的答案（B 级，Farquhar 等，*Nature* 630:625–630, 2024）。而学术引用能力尤其不能盲信：一项跨学科评估发现，ChatGPT 生成的文献引用存在真实度与 DOI 准确性问题，自然科学场景下 DOI 准确率约32.7%，**人文学科场景下仅8.5%**，DOI 幻觉率达89.4%（B 级，Mugaanyi 等，*J Med Internet Res* 26:e52935, 2024）。\n\n人文学科8.5%这个数字，佛学正落在它里面。所以佛学 AI 必须有自己的防幻觉机制——不是「更小心一点」，是结构性的。\n\n## 七、「可信佛学 AI」的标准工作流\n\n任何一个专业佛学 AI，都应当采用这样的流程（见图 5）：\n\n```\nAI 生成 → 检索增强（RAG） → 原典定位 → 卷／页／段落核验\n→ 多版本比较 → 第二来源交叉验证 → 专家复核\n→ 生成最终答案 → 保留证据链与模型版本\n```\n\n<svg viewBox=\"0 0 660 470\" style=\"width:100%;max-width:660px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"1\" y=\"1\" width=\"658\" height=\"468\" rx=\"8\" fill=\"#faf7f1\" stroke=\"#e0d7c8\"/><rect x=\"150\" y=\"16\" width=\"360\" height=\"34\" rx=\"6\" fill=\"#dce8ee\" stroke=\"#d8cfc0\"/><text x=\"330\" y=\"38\" font-size=\"12.5\" fill=\"#4a3a22\" text-anchor=\"middle\">AI 生成</text><line x1=\"330\" y1=\"50\" x2=\"330\" y2=\"66\" stroke=\"#b8863c\" stroke-width=\"1.6\"/><path d=\"M326,62 L330,66 L334,62 Z\" fill=\"#b8863c\"/><rect x=\"150\" y=\"66\" width=\"360\" height=\"34\" rx=\"6\" fill=\"#dce8ee\" stroke=\"#d8cfc0\"/><text x=\"330\" y=\"88\" font-size=\"12.5\" fill=\"#4a3a22\" text-anchor=\"middle\">检索增强（RAG）</text><line x1=\"330\" y1=\"100\" x2=\"330\" y2=\"116\" stroke=\"#b8863c\" stroke-width=\"1.6\"/><path d=\"M326,112 L330,116 L334,112 Z\" fill=\"#b8863c\"/><rect x=\"150\" y=\"116\" width=\"360\" height=\"34\" rx=\"6\" fill=\"#f0dfc4\" stroke=\"#d8cfc0\"/><text x=\"330\" y=\"138\" font-size=\"12.5\" fill=\"#4a3a22\" text-anchor=\"middle\">原典定位</text><line x1=\"330\" y1=\"150\" x2=\"330\" y2=\"166\" stroke=\"#b8863c\" stroke-width=\"1.6\"/><path d=\"M326,162 L330,166 L334,162 Z\" fill=\"#b8863c\"/><rect x=\"150\" y=\"166\" width=\"360\" height=\"34\" rx=\"6\" fill=\"#f0dfc4\" stroke=\"#d8cfc0\"/><text x=\"330\" y=\"188\" font-size=\"12.5\" fill=\"#4a3a22\" text-anchor=\"middle\">卷／页／段落核验</text><line x1=\"330\" y1=\"200\" x2=\"330\" y2=\"216\" stroke=\"#b8863c\" stroke-width=\"1.6\"/><path d=\"M326,212 L330,216 L334,212 Z\" fill=\"#b8863c\"/><rect x=\"150\" y=\"216\" width=\"360\" height=\"34\" rx=\"6\" fill=\"#f0dfc4\" stroke=\"#d8cfc0\"/><text x=\"330\" y=\"238\" font-size=\"12.5\" fill=\"#4a3a22\" text-anchor=\"middle\">多版本比较</text><line x1=\"330\" y1=\"250\" x2=\"330\" y2=\"266\" stroke=\"#b8863c\" stroke-width=\"1.6\"/><path d=\"M326,262 L330,266 L334,262 Z\" fill=\"#b8863c\"/><rect x=\"150\" y=\"266\" width=\"360\" height=\"34\" rx=\"6\" fill=\"#f0dfc4\" stroke=\"#d8cfc0\"/><text x=\"330\" y=\"288\" font-size=\"12.5\" fill=\"#4a3a22\" text-anchor=\"middle\">第二来源交叉验证</text><line x1=\"330\" y1=\"300\" x2=\"330\" y2=\"316\" stroke=\"#b8863c\" stroke-width=\"1.6\"/><path d=\"M326,312 L330,316 L334,312 Z\" fill=\"#b8863c\"/><rect x=\"150\" y=\"316\" width=\"360\" height=\"34\" rx=\"6\" fill=\"#e3d3ea\" stroke=\"#d8cfc0\"/><text x=\"330\" y=\"338\" font-size=\"12.5\" fill=\"#4a3a22\" text-anchor=\"middle\">专家复核</text><line x1=\"330\" y1=\"350\" x2=\"330\" y2=\"366\" stroke=\"#b8863c\" stroke-width=\"1.6\"/><path d=\"M326,362 L330,366 L334,362 Z\" fill=\"#b8863c\"/><rect x=\"150\" y=\"366\" width=\"360\" height=\"34\" rx=\"6\" fill=\"#dce8ee\" stroke=\"#d8cfc0\"/><text x=\"330\" y=\"388\" font-size=\"12.5\" fill=\"#4a3a22\" text-anchor=\"middle\">生成最终答案</text><line x1=\"330\" y1=\"400\" x2=\"330\" y2=\"416\" stroke=\"#b8863c\" stroke-width=\"1.6\"/><path d=\"M326,412 L330,416 L334,412 Z\" fill=\"#b8863c\"/><rect x=\"150\" y=\"416\" width=\"360\" height=\"34\" rx=\"6\" fill=\"#dce8ee\" stroke=\"#d8cfc0\"/><text x=\"330\" y=\"438\" font-size=\"12.5\" fill=\"#4a3a22\" text-anchor=\"middle\">保留证据链与模型版本</text><text x=\"530\" y=\"45\" font-size=\"10.5\" fill=\"#8a7b66\">机器环节</text><text x=\"530\" y=\"145\" font-size=\"10.5\" fill=\"#8a7b66\">核验环节</text><text x=\"530\" y=\"345\" font-size=\"10.5\" fill=\"#8a7b66\">人工环节</text><text x=\"330\" y=\"464\" font-size=\"10.5\" fill=\"#8a7b66\" text-anchor=\"middle\">AI 可以提出解释，但原典才是证据；AI 可以提出假设，但学者负责判断</text></svg>\n\n> 图 5｜「可信佛学 AI」的标准工作流\n\n关键原则只有一句：\n\n> **AI 可以提出解释，但原典才是证据；AI 可以提出假设，但学者负责判断。**\n\n举一个具体的例子。用户问：「应无所住而生其心」在禅宗意味着什么？\n\n系统不应直接给出一段现代哲学解释。它至少应同时提供以下各项：\n\n1. 《金刚经》原文\n2. CBETA 或其他权威版本的出处\n3. 相关异文\n4. 鸠摩罗什译本\n5. 代表性古代注疏\n6. 禅宗相关解释\n7. 现代学术研究\n8. AI 的综合解释\n\n并且明确区分其中哪一部分属于「经典原文」、哪一部分属于「历史注释」、哪一部分属于「现代学者观点」、哪一部分属于「AI 综合」。\n\n这一设计的目的十分明确：**把「AI 把自己的解释冒充经典」这个风险，从「依靠模型自觉」降为「依靠产品结构」。** 模型会出错，结构不会撒谎。\n\n84000 对 AI 辅助佛典翻译采取的也是类似思路。其公开立场文件的原文是：「these sacred texts should not be processed using machine translation alone」；「The primary actor in the translation of sacred literature must always be the human mind.」同时它也承认工具的价值：「84000 believes that the use of AI as a tool to assist translation has considerable value」。它列举的用途包括：\n\n- 检查译文是否有遗漏与错误\n- 提供备选译法\n- 在藏文、梵文、汉文原本之间寻找相关段落\n- 识别不同译本之间的不一致\n- 帮助定位人物、地点与术语\n\n（A 级，[84000 立场文件](https://84000.co/documents/84000s-position-on-ai-and-the-machine-translation-of-canonical-literature)）\n\n把它读成「AI 万能论」或「AI 威胁论」，都不对。它其实是一份**职责划分说明书**：哪些交给机器，哪些必须由人负责，写得清清楚楚。汉传如果有类似的公开立场，将省去大量重复争论。这些原则与 UNESCO 针对生成式 AI 教育与研究所倡导的「以人为中心」、数据保护、人类监督等方向一致（A 级，[UNESCO 指南](https://www.unesco.org/en/articles/guidance-generative-ai-education-and-research?hub=253682)，2023 年 9 月 7 日发布）。\n\n> **EN对应 · Chapters Two, Three, Five, Six, Seven**\n>\n> *This part asks not \"what is AI\" but \"what has AI changed\"—specifically, what it has changed about the cost of doing certain things, about who is qualified to do them, and about whom the results reach. Technical description that does not bear on those three is omitted.*\n>\n> **Fourteen: From Digitization to Knowledge Engineering.** On 28 February 2026 the Buddhist Digital Resource Center announced a plan to turn human-transcribed, OCR'd, edition-compared, and cross-validated Buddhist literature into open corpora suitable for AI training and research. The project began in December 2025 with funding from the Khyentse Foundation, at a scale measured in millions of pages. Two months of progress: Gold Standard corpora grew from 1.9 GB to 3.4 GB, over 26 million images passed through OCR, and about 35,000 images were aligned with transcriptions (Grade A, [BDRC announcement](https://www.bdrc.io/blog/2026/02/28/)).\n>\n> The significance lies not in the figures but in the route it marks: **build the data first, then the intelligence**—rather than building a talking robot first.\n>\n> Buddhism and digital technology have already passed through two stages, and a third is arriving.\n>\n> | Stage | Goal | Technical features | Began |\n> |---|---|---|---|\n> | Digital preservation | Not to lose it | Scanning, image storage, media conversion | Late twentieth century |\n> | Digital retrieval and dissemination | Retrievable | OCR, full-text search, online publication | 2000s |\n> | Computational Buddhist studies and intelligent knowledge systems | Machine-understandable and machine-reasonable | Structured encoding, embeddings, knowledge graphs, large language models | 2020s |\n>\n> The third differs from the first two in that machines not only store texts but establish relations across texts, editions, languages, persons, and periods, thereby helping researchers pose questions that were previously very hard to pose. (See Figure 2.)\n>\n>\n> The empirical basis is clear enough. CBETA has long used TEI/XML structured encoding, so that texts can be read and also processed, cited, and analysed by machine. The University of Tokyo's SAT project joins the digital text of the Taishō canon to page images, available since the 2012 version and locatable to the line (Grade A, [SAT](https://21dzk.l.u-tokyo.ac.jp/SAT/)). Dharma Drum's DILA integrated search brings together more than ten Buddhist digital archives and exposes over 160 million characters to public search (Grade A, self-reported, [DILA iSearch](https://isearch.dila.edu.tw/)). BDRC's BUDA platform publicly offers more than 17 million pages of Buddhist material (Grade A, self-reported, [bdrc.io](https://www.bdrc.io/); the same institution elsewhere gives \"over 59,000 volumes and over 30 million images\"); on 14 March 2025 it released a free, open-source desktop Tibetan OCR tool capable of batch-processing images and whole PDF volumes.\n>\n> Set side by side, these show that the goal has changed: from **\"putting the canon online\"** to **\"building Buddhist civilization into a knowledge system that is verifiable, linkable, computable, citable, translatable, and reliably usable by AI.\"**\n>\n> For Chinese Buddhism this carries a particular significance. **Knowledge infrastructure is one of the few things that can be done without proselytizing.** It does not require the other party to accept your faith first, or to cross the barriers of identity and politics, or to be persuaded that you are good. It requires only that the texts be properly organized, the terminology clearly fixed, and the sources plainly marked. Do that, and scholars, translators, developers, and learners worldwide will use it—and in using it, they will know who made it. (Judgment)\n>\n> The converse holds too: **falling behind here is not missing a publicity channel; it is being absent while others build the future order of Buddhist knowledge.** Ten years from now, if the corpora, terminology, knowledge graphs, and evaluation benchmarks of global Buddhist AI have all set hard, and the Chinese Buddhist portion within them is thin or wrong, then latecomers will be able to adapt to that order—but not define it.\n>\n> **Fifteen: Eight Layers of Infrastructure.** An adequate Buddhist knowledge system needs at least eight layers.\n>\n> | Layer | Core content | Relevant technology |\n> |---|---|---|\n> | 1. Source material | Canons, Dunhuang manuscripts, steles, recorded sayings, transmission records, temple gazetteers, local gazetteers, periodicals | Scanning, OCR/HTR, image recognition |\n> | 2. Authoritative text | Editions, critical editions, variant readings, punctuation | TEI/XML, version control |\n> | 3. Metadata | Title, author, translator, date, fascicle, provenance, edition, rights | Linked Data, standard metadata |\n> | 4. Terminology | Sanskrit, Pali, Tibetan, Chinese, English terms and variants | Terminology databases, ontologies |\n> | 5. Relations | Relations among persons, lineages, temples, texts, concepts, events | Knowledge graphs |\n> | 6. Semantics | Passages, topics, concepts, quotations, parallel passages, cross-lingual correspondences | Embeddings, semantic search |\n> | 7. AI | RAG, LLMs, translation, classification, summarization, Q&A, agents | Large models, vision-language models, agents |\n> | 8. Verification | Canonical provenance, edition, page, chain of evidence, expert revision records | Provenance tracking, audit logs |\n>\n> CBETA's TEI/XML practice has already shown that Buddhist texts can be fully standard digital humanities objects. SAT presses the further point that a digital text must be verifiable against the original page. That is the basic principle of credibility for Buddhist AI.\n>\n> From which follows a conclusion contrary to the prevailing view: **the core competitiveness of Buddhist AI lies first not in how large the model is, but in whether the underlying corpus is authoritative, whether editions are clear, whether provenance is traceable, whether terminology is standardized, and whether the traditions are correctly distinguished.** (Judgment)\n>\n> One corollary deserves separate statement: **training a Buddhist large model is almost certainly not the optimal investment for Chinese Buddhism.** General model capabilities are improving rapidly; the cost of building one's own model and the speed at which it depreciates are both worsening. Authoritative corpora, standardized terminology, clear editions, and traceable provenance, by contrast, do not lose value when models change—they gain value with every upgrade. **In resource allocation, the marginal return on corpus development exceeds that on model parameter expansion.** (Judgment)\n>\n> **Sixteen: AI in Buddhist Studies — Amplification, Not Replacement.** Where AI genuinely helps Buddhist studies is not in thinking for the scholar but in releasing him from retrieval work so that he may attend to judgment. Its capabilities fall into three classes (see Figure 3):\n>\n> | Capability | Technical principle | Value to Buddhist studies | Principal limitation |\n> |---|---|---|---|\n> | Semantic search | Text segmentation, embeddings, recall by semantic similarity | Resolves the constraint that a researcher must already know the keyword in order to search | Segmentation granularity and corpus quality directly affect the result |\n> | Textual reuse detection | Full-text vectorization; identification of cross-fascicle quotation, paraphrase, and false attribution | Makes \"where has this sentence appeared before\" computable at scale | What it discovers is relation; the nature of the relation still requires human judgment |\n> | Knowledge graphs | Entity and relation extraction, entity linking, graph query | Makes Buddhist history a queryable dynamic network | Ontology design must distinguish schools, or senses are conflated |\n>\n> **From keyword search to semantic search.** Traditional retrieval depends on already knowing the keyword. A researcher wanting to know what was said about \"no-thought\" in the Tang and Song must first think of the term itself, then of its variant writings, alternate translations, and other names. Fail to think of them all, and the search is incomplete. Semantic search changes that step: the researcher can ask directly, and the system performs semantic recall first, then filters by period, school, person, and text type, returning the original text with fascicle, page, and edition. DILA already offers integrated search across multiple archives; MITRASearch, from the Dharmamitra project at Berkeley, extends semantic search across languages.\n>\n> **Textual reuse: a question that could not previously be finished.** AI is especially suited to a problem traditional scholarship could never complete at scale: **\"Where has this sentence appeared before?\"** Once tens of millions of characters are converted to vectors, detecting cross-fascicle quotation, identifying paraphrase, detecting textual reuse, spotting false attributions, tracing the paths by which a quotation travelled, and analysing intellectual inheritance among commentaries all become feasible.\n>\n> This may change the shape of intellectual history. A scholar might once have spent years tracing one figure, one scripture, one quotation. In future the machine completes the large-scale discovery of candidates first, and the scholar interprets. Buddhist studies may therefore expand from \"small-scale close reading\" to \"close reading plus large-scale computational discovery.\" This is not AI replacing the scholar. It is releasing the scholar from retrieval and redirecting him to judgment.\n>\n> **Knowledge graphs.** Once Buddhist history is rebuilt as a dynamic network—persons, teachers, temples, regions, works, teaching activity, lineages, periods, social networks—the questions that become tractable include: the spread of a Chan lineage across centuries; which figures cite a given scripture most; what intellectual exchanges took place between a temple and particular scholars or monastics; in which periods a concept diffused rapidly; and the networks of intellectual transmission among China, Japan, Korea, and Vietnam.\n>\n> At the Digital Classics project's spring results presentation in May 2026 at Dharma Drum Institute of Liberal Arts, \"a knowledge graph of Master Sheng Yen's chronological biography,\" \"semantic search of Buddhist texts,\" and \"large language models and Buddhist digital literature\" were listed as active research topics, and a six-step process was used to build a Buddhist knowledge graph (merging senses, rewriting summaries, classifying senses, extracting and validating relations, extracting subject-predicate-object triples, and entity linking); at the same presentation, a researcher used Obsidian and Claude Code to build a citation database for the *Abhidharmakośa-bhāṣya-ṭīkā Tattvārthā* (Grade A, [CBETA event report](https://cbeta.org/post/30491)). Two clarifications: the presentation concerned 614 citation records, a parallel-text index, and a six-edition collation, so the circulating description \"visualization of Āgama relations\" does not match what the session covered; and the reason CBETA's website carries Dharma Drum's Digital Classics material is common origin—CBETA was founded in 1998 with the support of the Chung-Hwa Institute of Buddhist Studies at Master Sheng Yen's instruction, and at incorporation in 2023 the Dharma Drum Mountain Buddhist Foundation donated NT$13 million as its largest contributor.\n>\n> **One boundary easily overstated.** All of the above are real capabilities, but one limit must be marked: **knowledge graphs and semantic search can discover relations; they cannot determine meaning.** A machine can tell you that a quotation appears in two hundred texts. It cannot tell you which appearance is inheritance, which is refutation, which is misreading. Doctrinal adjudication, causal explanation in intellectual history, and the intellectual weight of a text remain work for trained people.\n>\n> **Seventeen: What LLMs Can and Cannot Do — A Task Grading.** Setting the tasks out individually serves judgment better than a blanket assertion that AI is useful or unreliable; see Figure 4.\n>\n> | Task | Suitability | Reason |\n> |---|---|---|\n> | Summarizing articles | High | Quickly verified by a human |\n> | Keyword extraction | High | Structured task |\n> | Preliminary literature review | High | Suited to recall and organization |\n> | Finding parallel passages | High | Clear machine advantage |\n> | Comparing editions | High | Automatable at scale |\n> | Cross-lingual source discovery | High | An LLM strength |\n> | Candidate explanations of terms | Medium-high | Must be checked against the canon |\n> | Machine translation drafts | Medium-high | Marked efficiency gains |\n> | Explaining intellectual history | Medium | Requires expert judgment |\n> | Doctrinal adjudication among schools | Medium-low | Prone to conflating traditions |\n> | Final translation of scripture | Low | Requires a professional translator |\n> | Vinaya judgments | Low | Depends on tradition and circumstance |\n> | Guiding high-risk practice questions | Very low | AI should not hold final authority |\n> | Declaring \"this is the true meaning of the dharma\" | Very low | Involves complex traditions and interpretive authority |\n>\n> The table serves a specific purpose: **it converts the vague question of whether AI should be used into a graded determination of applicability for a particular task** Summarizing, retrieval, finding parallel passages, comparing editions—use it freely. Final translation, vinaya judgment, doctrinal adjudication, guidance on high-risk practice—not usable, or usable only where a human explicitly bears responsibility.\n>\n> One fact outside the table: hallucination is not specific to Buddhist studies. A study in *Nature* proposed detecting LLM hallucination using semantic entropy, noting that models produce unsubstantiated answers even when fluency is high (Grade B, Farquhar et al., *Nature* 630:625–630, 2024). Citation behaviour in particular cannot be trusted blindly: a cross-disciplinary evaluation found that ChatGPT's generated citations have problems of authenticity and DOI accuracy, with DOI accuracy around 32.7 percent in the natural sciences and **only 8.5 percent in the humanities**, and a DOI hallucination rate of 89.4 percent (Grade B, Mugaanyi et al., *J Med Internet Res* 26:e52935, 2024).\n>\n> Buddhist studies falls inside that 8.5 percent. Buddhist AI therefore requires its own anti-hallucination mechanism—not \"greater care,\" but something structural.\n>\n> **Eighteen: A Standard Workflow for Trustworthy Buddhist AI.** Any professional Buddhist AI should adopt this pipeline (see Figure 5):\n>\n> ```\n> AI generation → Retrieval-augmented generation (RAG) → Location in the canon\n> → Verification of fascicle, page, and passage → Comparison across editions\n> → Cross-validation against a second source → Expert review\n> → Final answer generated → Evidence chain and model version preserved\n> ```\n>\n> The governing principle is one sentence:\n>\n> **AI may propose an interpretation; the canon is the evidence. AI may propose a hypothesis; the scholar makes the judgment.**\n>\n> A concrete example. A user asks: \"What does 'let the mind arise without abiding anywhere' mean in Chan?\"\n>\n> The system should not answer with a paragraph of modern philosophical explanation. It should at minimum provide, simultaneously: the original text of the *Diamond Sūtra*; the source in CBETA or another authoritative edition; relevant variant readings; Kumārajīva's translation; representative classical commentaries; relevant Chan explanations; modern scholarship; and the AI's own synthesis—with explicit separation of which part is \"canonical text,\" which is \"historical commentary,\" which is \"modern scholarly opinion,\" and which is \"AI synthesis.\"\n>\n> The purpose of the design is specific: **to move the risk of an AI passing off its own interpretation as scripture from \"the model chooses to behave\" to \"the product is structured so it cannot.\"** Models err. Structures do not lie.\n>\n> 84000 takes a similar approach. Its public position states in the original: \"these sacred texts should not be processed using machine translation alone\"; \"The primary actor in the translation of sacred literature must always be the human mind.\" It also acknowledges the tool's value: \"84000 believes that the use of AI as a tool to assist translation has considerable value.\" The uses it lists include checking translations for omissions and errors; offering alternative translation choices; finding related passages across Tibetan, Sanskrit, and Chinese source texts; identifying inconsistencies across translations; and helping locate people, places, and terms (Grade A, [84000 position paper](https://84000.co/documents/84000s-position-on-ai-and-the-machine-translation-of-canonical-literature)).\n>\n> The weight of this position lies in the fact that it is neither \"AI solves everything\" nor \"AI is a threat,\" but a **division-of-responsibility statement.** What goes to the machine, what must remain with a human—stated plainly. If Chinese Buddhism issued a comparable public position, a great deal of repetitive argument would be saved. These principles align with UNESCO's guidance on generative AI in education and research (Grade A, [UNESCO guidance](https://www.unesco.org/en/articles/guidance-generative-ai-education-and-research?hub=253682), issued 7 September 2023).\n\n---\n\n## 八、AI 辅助佛典翻译：最具突破价值之传播基础设施\n\n回到第十章那道坎：汉文佛典资源极丰富，而世界上大量潜在读者无法直接阅读古汉语佛典。\n\n**这是汉传全球传播最大的单一结构性障碍，也是最有可能被技术实质性改变的一项。** AI 翻译在这里不是普通的传播工具——它直接改变「可访问性」这个变量，而可访问性是前面所有传播策略的前提。没有可读的译本，禅修、教育、对话、学术交流都无从谈起。\n\n2024年一项专门研究比较了 ChatGPT-4、ERNIE Bot 4 与 Gemini Advanced 对古汉语佛教文本的翻译能力，研究使用来自 CBETA 的佛典与中国佛教文献，并通过人工评价分析（B 级，Xiang Wei, *Religions* 15(12):1559, 2024）。这说明「LLM 加佛典翻译」已经从概念讨论进入可比较评测阶段。同时，专门的佛教翻译模型也已公开：Dharmamitra 项目发布过针对佛教汉文到英文翻译的模型（`buddhist-nlp/mbart-buddhist-chinese-to-eng`），其模型卡坦诚地写明两点——在人物、地点等命名实体上存在机器翻译系统常见的问题，且「有时会表现出幻觉倾向」。\n\n这句自述比任何评测分数都有价值。**一个愿意在模型卡上写明自己会幻觉的项目，比一个宣称准确率95%的项目更值得信任。**\n\n由此可以推出：真正值得建的，不是「一个会翻译佛经的 ChatGPT」，而是**佛教多语翻译工作台**。\n\n```\n原文 → 自动断句 → 术语识别 → 相关经典召回 → 同类译文召回\n→ AI 翻译候选 → 多版本对照 → 译者修改 → 专家审校\n→ 术语库更新 → 发布 → 新数据反哺模型\n```\n\n这个流程里，AI 承担「候选生成」与「一致性检查」，译者承担「判断」，专家承担「定稿」。三者职责不重叠。\n\n### 术语层设计之常见误区\n\n多数翻译项目在术语上追求「唯一正译」。这个目标听起来正当，实则有害。\n\n其依据在于：汉传2,000年之译经史本身即为「多译并存」之历史。同一个梵文词，鸠摩罗什译作「毕竟空」，玄奘译作「毕竟无」，真谛译作「真实空」。这里没有谁译错。被保留下来的，是不同时代的理解差异。强行统一，等于抹掉这层信息。\n\n更好的做法是把术语库设计成**分层**的：底下一层是「推荐译名」，上面允许多个并存译名，每个译名标注来源——谁译的、哪个时代、依据什么。机器默认输出推荐译名，但保留其余选项与理由。**这样，统一的便利与并存的丰富就都能得到。**（判断·主张／依据：同段所述汉传译经史多译并存之事实）\n\n技术上需要两个前提：术语层要开放、可引用、有版本号；译文要分级标注——未校、已校、权威三级。读者看到一段机器译文时，应当能立刻知道它经过了几道人工校订。\n\n### 覆盖率审计指标\n\n把 BDK 那个「65%」变成可审计的指标。具体说，需要一份**按页（或按品）统计的汉文佛典英译覆盖率**——哪部经译了多少、谁在译、什么状态、质量如何。\n\n这件事的技术难度很低，组织难度很高，因为它要求各方公开自己的进度。但它的价值与难度成正比：**没有这把尺子，翻译规划就只能凭感觉排序。**\n\n### 长期被忽视的配套环节：教材建设\n\n译经之外，还有一件同样重要却几乎无人做的事：写教科书。\n\n藏传在西方的成效，很大程度上得益于成体系的英文教材——从入门到进阶，有课本、有讲义、有术语表、有练习，学校的课程可以直接采用。汉传在英文世界里几乎没有这样的东西。一位美国大学的宗教学教师想开一门汉传佛教的课，找不到合适的教科书；一位对汉传感兴趣的西方读者想系统入门，找不到一本表述清晰的导论。\n\n结果是：汉传在西方学界的入口极窄。 学者可以研究它，但学生进不来；学生进不来，20 年后就没有学者了。\n\n所以有一个建议，值得排在译经之后、其他所有事情之前：**组织一批真正的学者与法师，写三五本英文的汉传佛教入门教材与课程包**——一本通史、一本教理导论、一本禅修实践手册、一本术语详解。用最好的英文写，配最高质量的中文引文，由大学出版社出版。此项投入规模有限，而杠杆效应显著。（判断·主张／依据：属效益估计，无实测数据）\n\n### 一项反直觉之推论\n\n有一种常见看法认为，AI 翻译普及之后，译经人才之需求将会下降。本文的判断相反：需求会上升。\n\n原因是翻译工作分两段。AI 能胜任的是「初译」这一段——把古汉语转成通顺的现代语言。而「审校」这一段不但不能被替代，反而变得更关键：当机器每天产出成千上万段初稿时，**真正稀缺的是能够判断「这段译文对不对」的人。**\n\n而判断一段佛典译文对不对，需要的恰恰是最难培养的能力：通古汉语、通梵藏、通教理、通宗派差异、还要通目标语言。**AI 让初译变便宜，等于让审校变得更贵。**（判断·推论／依据：Dharmamitra 模型卡自述之命名实体与幻觉问题、Wei 2024 之人工评价结果）\n\n这对僧伽教育的含义是具体的：如果十年后佛典翻译的瓶颈在审校，那么今天开始的译经人才培养，方向应当是**培养能审校的人**，而不是培养能初译的人。\n\n## 九、修行辅助之四级分层：学习辅助与修行实践之界限\n\n这是整个领域中最需要谨慎的部分。\n\nAI 很适合做的事有一长串：经教学习、每日阅读计划、术语学习、经典问答、修学笔记、共修提醒、禅修时间管理、反思日志、学习路径推荐、多语法义学习、法会信息与课程管理。但这些功能不能等同于「AI 具有修行经验」，更不能把「AI 生成的语言流畅度」误认为「AI 具有证量或悟境」。\n\n一个实用而清晰的分层是（见图 6）：\n\n**第一层，知识型 AI**——回答「什么是十二因缘？」典型的教育任务。风险低，收益直接，应当大力发展。\n\n**第二层，陪伴型 AI**——「今天提醒我静坐 20 分钟。」行为支持，工具功能。\n\n**第三层，反思型 AI**——用户输入：「今天我在工作中因为别人否定我而很愤怒。」AI 可以帮助梳理：发生了什么；哪些是事实；哪些是自己的判断；情绪如何产生；可以如何按照已经学过的佛法进行反思。\n\n这一层是「反思镜」，有用，但有一条界线：**它帮助用户使用他自己学过的法义去照见自己，而不是代替他给出结论。** 一旦 AI 开始告诉他「你应该放下执着」「这说明你的我执很重」，它就从镜子变成了判官——而它没有资格做判官。\n\n**第四层，高风险宗教指导**——例如：「我应该不要吃药，专心打坐吗？」「我是不是已经开悟？」「师父这么要求我是否必须服从？」「我出现严重异常体验，是不是进入某种高级禅定？」\n\n上述四个问题具有同一性质：误答将造成实质损害。 这一层不应让 AI 做任何判断，而必须设置人工导师介入、专业机构转介与风险升级机制。关于数字精神陪伴的研究也支持这一谨慎：研究发现用户容易向聊天机器人透露高度私密的信息，同时对隐私、错误信息、数据安全与依赖问题抱有担忧（B 级，Kneese、Vecchione、Marwick, *Communication and Change* 1(1), 2025）。\n\n<svg viewBox=\"0 0 760 320\" style=\"width:100%;max-width:760px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"1\" y=\"1\" width=\"758\" height=\"318\" rx=\"8\" fill=\"#faf7f1\" stroke=\"#e0d7c8\"/><rect x=\"230\" y=\"22\" width=\"300\" height=\"56\" rx=\"7\" fill=\"#c2685a\"/><text x=\"380\" y=\"46\" font-size=\"13\" font-weight=\"bold\" fill=\"#faf7f1\" text-anchor=\"middle\">第 4 层 · 高风险宗教指导</text><text x=\"380\" y=\"65\" font-size=\"10.5\" fill=\"#faf7f1\" text-anchor=\"middle\" opacity=\"0.92\">戒律·心理危机·异常体验·师徒关系·医疗 → 必须人工介入</text><rect x=\"180\" y=\"92\" width=\"400\" height=\"56\" rx=\"7\" fill=\"#d0a05e\"/><text x=\"380\" y=\"116\" font-size=\"13\" font-weight=\"bold\" fill=\"#faf7f1\" text-anchor=\"middle\">第 3 层 · 反思型 AI</text><text x=\"380\" y=\"135\" font-size=\"10.5\" fill=\"#faf7f1\" text-anchor=\"middle\" opacity=\"0.92\">帮助用户用已学过的法义照见自己，不代其下结论</text><rect x=\"130\" y=\"162\" width=\"500\" height=\"56\" rx=\"7\" fill=\"#9aab74\"/><text x=\"380\" y=\"186\" font-size=\"13\" font-weight=\"bold\" fill=\"#faf7f1\" text-anchor=\"middle\">第 2 层 · 陪伴型 AI</text><text x=\"380\" y=\"205\" font-size=\"10.5\" fill=\"#faf7f1\" text-anchor=\"middle\" opacity=\"0.92\">提醒、计时、进度管理 —— 行为支持</text><rect x=\"80\" y=\"232\" width=\"600\" height=\"56\" rx=\"7\" fill=\"#7a9a6b\"/><text x=\"380\" y=\"256\" font-size=\"13\" font-weight=\"bold\" fill=\"#faf7f1\" text-anchor=\"middle\">第 1 层 · 知识型 AI</text><text x=\"380\" y=\"275\" font-size=\"10.5\" fill=\"#faf7f1\" text-anchor=\"middle\" opacity=\"0.92\">经教学习、术语问答、阅读计划 —— 风险低，应大力发展</text><text x=\"380\" y=\"310\" font-size=\"10.5\" fill=\"#8a7b66\" text-anchor=\"middle\">越往上，答错的代价越大：AI 可以辅助「学」，不能替代「修」</text></svg>\n\n> 图 6｜修行辅助的四层\n\n四层之上，有一条贯穿的界线，值得单独标出：\n\n**AI 可以辅助「学」，不能替代「修」。**\n\n学是获取知识、理解义理、建立正见——这些可以被语言承载，因此可以被机器承载。修是亲证、是身心转变、是在具体情境中的抉择——这些不通过语言传递，因此不可能通过语言模型传递。\n\n说「AI 能帮助你学习佛法」是准确的。说「AI 能帮助你修行」，就已经越界。而说「AI 可以指导你的修行」，则不只是越界，是危险。（判断·主张／依据：第二十一章第四层风险分级）\n\n## 十、「AI 师父」：最需审慎处置之方向\n\n技术上，一个 AI 完全可以模拟某位高僧的语言风格。这里必须区分三个层次：\n\n**模拟其文风** ≠ **根据其著作回答** ≠ **代表其本人传法**\n\n第一层是风格模仿，风险有限。第二层是有据可查的问答，属于知识服务。**第三层是宗教权威的模拟，风险极高。**\n\n因此更可取的设计是**「传统人物知识代理」**，而不是**「AI 大师人格」**。比较这两句话：\n\n> 「根据《六祖坛经》以及现有学术研究，说明慧能思想。」\n\n> 「我是六祖慧能，请告诉你应该如何修行。」\n\n前者在知识真实性与伦理上都更稳健。它把回答的边界限定在「文献说过的」与「学者研究过的」之内，并且不冒充主体。\n\n2025至2026年已出现一些实验性佛教对话系统，例如围绕亲鸾等净土宗思想家的专门 AI 系统（京都大学熊谷诚慈团队与 Terraverse 于2023年9月推出的「親鸞ボット」，同批还有「世親ボット」）、佛教教学型 AI，以及基于 RAG、能答问时标明经名章偈的佛典问答平台。这类项目很有研究价值，但多数仍处于实验性或项目自述阶段。**「能够生成宗教对话」与「已经拥有宗教权威」之间，隔着不可逾越的距离。**\n\n### 实质性伦理风险\n\n未来最危险的问题，很可能不在「AI 有没有佛性」这一边。更该问的是：**人是否开始把 AI 的输出当成佛法本身？**\n\n具体有五种风险。\n\n| 风险 | 作用机制 | 后果 |\n|---|---|---|\n| 权威幻觉 | 语言之确定性被等同于判断之可靠性 | 流畅段落被读作可靠结论 |\n| 拟人化 | 持续回应、从不疲倦、从不评判 | 形成危险的准精神依附 |\n| 依赖 | 以 AI 反思替代真实师友关系 | 修行所依的关系基础被削弱 |\n| 教义扁平化 | 模型倾向给出「听似合理」之综合 | 宗派差异被抹平为「佛教说」 |\n| 数据隐私 | 修行日志含身心、家庭、创伤等敏感信息 | 按内容平台逻辑处理即生风险 |\n\n其中「拟人化」一项尤须说明：AI 总在、总答、从不疲倦、从不评判，这些特性恰好构成一种危险的吸引力。「数据隐私」一项亦须强调：修行日志可能包含身体状态、情绪、家庭关系、创伤经历、性与婚姻、宗教信仰与心理状态，此类数据不能按照普通内容平台的数据逻辑处理，**佛教 AI 应当建立高于一般教育 AI 的隐私标准**。\n\n把五种风险归到一处，核心只有一句：\n\n**佛教 AI 的真正风险，与机器人有无灵魂无关。真正的风险是：人把权威交给算法。**（判断·评估／依据：第十章所列权威幻觉、拟人化、依赖、教义扁平化、数据隐私五项风险）\n\n历代祖师的权威，建立在戒、定、慧的长期实践与僧团共同体的印可之上。这份权威无法被转录为参数，也不应被模拟为一个可以随时提问的对象。技术能做的是把经典整理清楚、把出处标明白、把义理讲通畅——**它做的是「使法可闻」，不是「代法说法」。**\n\n这一区分看似细微，却贯穿整个佛教 AI 事业的方向。\n\n> **EN对应 · Chapters Eight to Ten**\n>\n> **Nineteen: AI-Assisted Translation — The Infrastructure Most Worth Breaking Through.** Back to the ditch described in Chapter Ten: the Chinese Buddhist canon is extremely rich, and a great many potential readers worldwide cannot read classical Chinese Buddhist texts directly.\n>\n> **This is the single largest structural obstacle to the global transmission of Chinese Buddhism, and the one most likely to be substantively changed by technology.** AI translation is not an ordinary communication tool here—it changes the variable of accessibility directly, and accessibility is the precondition of every transmission strategy. Without readable translations, meditation instruction, education, dialogue, and academic exchange all have nowhere to begin.\n>\n> A 2024 study compared the translation ability of ChatGPT-4, ERNIE Bot 4, and Gemini Advanced on classical Chinese Buddhist texts, using texts from CBETA and Chinese Buddhist literature and analysing them through human evaluation (Grade B, Xiang Wei, *Religions* 15(12):1559, 2024). Purpose-built Buddhist translation models have also been released: the Dharmamitra project published a model for Chinese-to-English translation of Buddhist texts (`buddhist-nlp/mbart-buddhist-chinese-to-eng`), and its model card states two things
