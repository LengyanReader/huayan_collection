 candidly—the usual problems that NMT systems have with named entities (names of persons and places), and that the model \"shows a tendency to hallucinate at times.\"\n>\n> That admission is worth more than any evaluation score. **A project willing to write on its model card that it hallucinates is more trustworthy than one claiming 95 percent accuracy.**\n>\n> Hence: what is worth building is not \"a ChatGPT that translates Buddhist scriptures\" but a **multilingual Buddhist translation workbench**.\n>\n> ```\n> Source text → Automatic segmentation → Term recognition\n> → Retrieval of related scriptures → Retrieval of comparable translations\n> → AI translation candidates → Comparison across editions → Translator revision\n> → Expert review → Terminology database update → Publication\n> → New data fed back into the model\n> ```\n>\n> In this pipeline the AI handles candidate generation and consistency checking, the translator handles judgment, and the expert handles final authorization. The three responsibilities do not overlap.\n>\n> **One design decision easily made wrongly.** Most translation projects pursue a single \"correct\" rendering for each term. The goal sounds proper; it is in fact harmful.\n>\n> Two thousand years of Chinese translation history is itself a history of coexisting renderings. For the same Sanskrit term, Kumārajīva rendered it as \"ultimately empty,\" Xuanzang as \"ultimately nonexistent,\" Paramārtha as \"genuinely empty.\" This is not a matter of someone translating incorrectly; it is the preservation of differences in understanding across periods. Forced uniformity erases that layer of information.\n>\n> The better approach is to design the terminology database in **layers**: a bottom layer of \"recommended renderings,\" above it a set of coexisting alternatives, each annotated with its source—who translated it, in what period, on what basis. The machine outputs the recommended rendering by default while retaining the alternatives and their rationales. **In this way both the convenience of uniformity and the richness of coexistence are preserved.** (Judgment)\n>\n> Two technical preconditions follow: the terminology layer must be open, citable, and versioned; and translations must be graded—unreviewed, reviewed, authoritative. A reader encountering a machine translation should be able to see at once how many rounds of human review it has passed.\n>\n> **A coverage dashboard.** Turn BDK's \"65 percent\" into an auditable metric—a page-by-page or chapter-by-chapter count of English translation coverage for the Chinese canon: which texts have been translated, how much, by whom, in what state, at what quality. Technically easy, organizationally hard, because it requires all parties to disclose their progress. But its value is proportional to its difficulty: **without that ruler, translation planning can only be ordered by feel.**\n>\n> **A companion task that gets overlooked: writing textbooks.** Tibetan Buddhism's success in the West rests heavily on systematic English teaching materials—textbooks, lecture notes, glossaries, and exercises, from introductory to advanced, adoptable directly by university courses. Chinese Buddhism has almost nothing of the kind in English. A religion professor wanting to offer a course on Chinese Buddhism finds no suitable textbook; an interested Western reader wanting a systematic introduction finds no clear guide.\n>\n> The result: **the entry point into Chinese Buddhism in Western academia is very narrow.** Scholars can study it, but students cannot get in; and if students cannot get in, in twenty years there will be no scholars.\n>\n> Hence a recommendation that deserves to rank immediately after translation and ahead of everything else: **organize a group of genuine scholars and monastics to write three to five English introductory textbooks and course packages for Chinese Buddhism**—a history, an introduction to doctrine, a practice manual, and a glossary. Limited in scale, significant in leverage. (Judgment)\n>\n> **One counter-intuitive judgment.** Many assume that as AI translation spreads, the demand for translation talent will fall. This report judges the opposite: **demand will rise.**\n>\n> Translation has two stages. What AI handles well is the first—turning classical Chinese into fluent modern language. The second stage, review, cannot merely be replaced; it becomes more critical. When a machine produces thousands of draft passages a day, **what is genuinely scarce is a person able to judge whether a given rendering is correct.**\n>\n> And judging whether a Buddhist translation is correct demands precisely the hardest capacities to train: command of classical Chinese, of Sanskrit and Tibetan, of doctrine, of differences among schools, and of the target language. **AI lowers the cost of first drafts, which raises the cost of review.** (Judgment)\n>\n> The implication for monastic education is concrete. If in ten years the bottleneck is review, then the training begun today should aim at **producing reviewers, not producers of first drafts.**\n>\n> **Twenty: Four Tiers of Practice Support — Learning Assistance Is Not Practice.** This is the part of the field requiring the most caution.\n>\n> The list of things AI does well is long: studying doctrine, daily reading plans, terminology, scriptural Q&A, study notes, group-practice reminders, time management for meditation, reflective journals, learning-path recommendations, multilingual study of meaning, and event administration. But none of these equates to \"AI has practice experience,\" and fluency of AI-generated language must never be mistaken for realization or depth of insight. A practical and clear tiering follows (see Figure 6).\n>\n> **Tier one, knowledge AI**—answering \"what are the twelve links of dependent origination?\" A straightforward educational task. Low risk, direct benefit, deserving of vigorous development.\n>\n> **Tier two, companion AI**—\"remind me to sit for twenty minutes today.\" Behavioural support, a tool function.\n>\n> **Tier three, reflective AI**—the user types: \"Today at work I got very angry because someone rejected me.\" The AI can help sort through what happened; which parts are fact; which are the user's own judgments; how the emotion arose; and how one might reflect according to the dharma one has already learned.\n>\n> This tier is a \"mirror for reflection,\" useful, with one boundary line: **it helps users see themselves through the teachings they have already studied; it does not deliver conclusions on their behalf.** Once the AI begins telling him \"you should let go of attachment\" or \"this shows your self-grasping is strong,\" it has turned from mirror into magistrate—and it is not qualified for that office.\n>\n> **Tier four, high-risk religious guidance**—for example: \"Should I stop taking my medication and just sit in meditation?\" \"Am I already enlightened?\" \"If my teacher requires this, must I obey?\" \"I'm having severe unusual experiences—am I entering some advanced state of concentration?\"\n>\n> These share one property: **an erroneous answer causes substantive harm.** In this tier the AI should make no judgment at all; human mentorship, referral to professional services, and risk-escalation mechanisms must be in place. Research on digital spiritual companionship supports this caution: users readily disclose highly private information to chatbots while worrying about privacy, misinformation, data security, and dependency (Grade B, Kneese, Vecchione, and Marwick, *Communication and Change* 1(1), 2025).\n>\n> Above the four tiers runs a single line worth marking on its own:\n>\n> **AI can assist study. It cannot replace practice.**\n>\n> Study is acquiring knowledge, understanding doctrine, establishing right view—all of which can be carried by language, and therefore by a machine. Practice is direct realization, the transformation of body and mind, and decisions made in concrete circumstances—none of which is transmitted through language, and therefore none of which can be transmitted by a language model.\n>\n> \"AI can help you study the dharma\" is accurate. \"AI can help you practise\" has already crossed the line. And \"AI can guide your practice\" is not merely over the line—it is dangerous. (Judgment)\n>\n> **Twenty-One: The \"AI Master\" — The Direction Requiring the Most Caution.** Technically, an AI can fully simulate the verbal style of a famous monk. Three levels must be distinguished: **simulating his style** ≠ **answering from his writings** ≠ **speaking on his behalf**. The first is stylistic imitation, with limited risk. The second is sourced question and answer, a knowledge service. **The third is the simulation of religious authority, and the risk is extreme.**\n>\n> Hence the preferable design is a **\"knowledge agent for a traditional figure,\"** not an **\"AI master persona.\"** Compare two sentences:\n>\n> \"According to the *Platform Sūtra of the Sixth Patriarch* and existing scholarship, explain Huineng's thought.\"\n>\n> \"I am Huineng, the Sixth Patriarch. Let me tell you how you should practise.\"\n>\n> The first is more robust both epistemically and ethically. It confines the answer to what the texts say and what scholars have studied, and it does not impersonate a subject.\n>\n> Experimental Buddhist dialogue systems have appeared in 2025–2026: a dedicated AI for the Pure Land thinker Shinran (the \"Shinran Bot\" released in September 2023 by Professor Seiji Kumagai's team at Kyoto University with Terraverse, alongside a \"Vasubandhu Bot\"), Buddhist teaching AIs, and RAG-based scriptural Q&A platforms that cite the scripture, chapter, and verse. Such projects have research value, but most remain experimental or self-described. **Between \"can generate religious dialogue\" and \"possesses religious authority\" lies an impassable distance.**\n>\n> **The real ethical risk.** The most dangerous question ahead is probably not \"does AI have buddha-nature\" but: **has a person begun to take the AI's output as the dharma itself?**\n>\n> Five specific risks:\n>\n> | Risk | Mechanism | Consequence |\n> |---|---|---|\n> | Authority illusion | Linguistic certainty equated with reliability of judgment | Fluent passages read as reliable conclusions |\n> | Anthropomorphization | Always responding, never tiring, never judging | A dangerous quasi-spiritual attachment |\n> | Dependency | AI reflection substituted for real relationships with teachers and friends | The relational ground of practice is weakened |\n> | Doctrinal flattening | The model tends toward a plausible-sounding synthesis | School differences flattened into \"what Buddhism says\" |\n> | Data privacy | Practice journals contain sensitive bodily, family, and traumatic information | Handling them by content-platform logic creates risk |\n>\n> Two of these require particular emphasis. On **anthropomorphization**: an AI that is always present, always answering, never tiring, and never judging constitutes a dangerous attraction precisely through those properties. On **data privacy**: a practice journal may contain physical condition, emotions, family relations, traumatic experience, sexuality and marriage, religious belief, and psychological state; such data cannot be handled by the data logic of an ordinary content platform, and **Buddhist AI should set a higher privacy standard than educational AI generally**.\n>\n> **The real risk of Buddhist AI is not that a machine has a soul. It is that a person hands authority to an algorithm.** (Judgment · assessment / basis: the five risks listed in Chapter Ten—authority illusion, anthropomorphization, dependency, doctrinal flattening, and data privacy)\n>\n> The authority of the patriarchs was built on long practice in precepts, concentration, and wisdom, and on the sanction of the monastic community. That authority cannot be transcribed into parameters, and should not be simulated as an object one can question at will. What technology can do is organize the texts clearly, mark the sources plainly, and explain the doctrine coherently—**it makes the dharma hearable; it does not speak the dharma in anyone's place.**\n>\n> The distinction looks fine. It runs through the entire direction of the Buddhist AI enterprise.\n\n---\n\n## 十一、佛教哲学对 AI 伦理的贡献\n\n第十章所论，是佛教使用 AI 时面临的伦理风险。风险之外，还有一个反面问题：**佛教哲学能否对 AI 伦理本身有所贡献？** 此问题并非修辞性的客套，而是一个可检验的学术问题。\n\n### 已进入同行评议框架的五项维度\n\n2026年发表于 *AI and Ethics* 的一项系统性范围综述，检视了40 篇 Scopus 收录研究，提出佛教哲学可为负责任 AI 提供补充的五个维度（B 级，Hariyanto 等，*AI and Ethics* 6(5), 2026；[原文](https://doi.org/10.1007/s43681-026-01340-8)）：\n\n| 维度 | 英文原名 | 要点 |\n|---|---|---|\n| 苦感敏感的影响评估 | suffering-sensitive impact assessment | 把「对众生之苦的潜在影响」列为独立指标，而非仅考虑效率、公平或隐私 |\n| 关系性问责 | relational accountability | 问责及于人、机器与环境构成的关系网络，不止于个体行为者 |\n| 慈悲与关怀的完整性 | compassion and care integrity | 确保 AI 不模拟虚假之慈悲，即在无相应能力与责任时产出慈悲的表达 |\n| 诠释的谦逊 | interpretive humility | 承认 AI 诠释之局限，保留人类诠释之空间 |\n| 文化参与 | cultural participation | 让传统社群参与 AI 之设计与治理 |\n\n同一时期另一项研究以星云大师之人间佛教为本，把「三好」（做好事、说好话、存好心）与「四给」（给人信心、给人欢喜、给人希望、给人方便）转化为数字正念指南，提出「人机佛教智能」（Humanistic Buddhist Intelligence）之框架，主张以此作为用户内部之「数字认知防火墙」，应对算法操纵与 AI 生成幻象（B 级，Kang Qihao, *AI and Ethics* 6(5), 2026；[原文](https://doi.org/10.1007/s43681-026-01316-8)）。\n\n### 佛教伦理资源的逐项对照\n\n上举五项维度各有其教理根据，可逐一对照。\n\n| 维度 | 教理对应 | 对照要点 |\n|---|---|---|\n| 苦感敏感的影响评估 | 苦谛、不害（ahiṃsā） | 多数 AI 伦理框架以「公平」「透明」「可解释」为核心，其单位是个体与群体；苦谛所提供者不同——它问「此举令谁受苦、苦如何生、能否止」，是以感受而非以权利为起点的评估轴 |\n| 关系性问责 | 缘起 | 缘起说无一法独立自存，一切依待而生。以此观 AI，「谁该负责」不再能还原为「哪个工程师写错了代码」，而须在模型开发者、训练数据来源者、部署者、使用者与受影响者所构成之网络中定位 |\n| 慈悲与关怀的完整性 | 慈悲、同体大悲 | AI 可以生成慈悲的语句而不具有慈悲。若不区分「慈悲的表达」与「慈悲」，关怀将被表演化；而表演化的关怀在生产上更廉价、在规模上更可复制，因而具有淘汰真实关怀的市场压力 |\n| 诠释的谦逊 | 般若、遮诠传统 | 佛教诠释学长期警惕「以指为月」，龙树《中论》之四句否定即为系统的诠释谦逊。技术上的直接对应是：佛学 AI 应避免「断定某观点即佛法真义」之表述（见第六章任务分级表） |\n| 文化参与 | 僧团羯磨、和合 | 佛教决策传统本就包含集体议事与共同认可之程序（详见另篇《汉传佛教的全球传播》论治理与寺院经济之一章），与现代 AI 治理所提倡的利益相关方参与，在结构上有可比之处 |\n\n### 必须避免之误用\n\n上述对照有意义，但有一项误用必须避免：**把佛教术语贴到既有的 AI 伦理框架上，冒充贡献。**\n\n此类误用有两种形态。其一是**贴标签式**——把「公平」改称「平等性」，把「透明」改称「如实观」，实质内容不变，只是换了词。其二是**比附式**——把「因陀罗网」比作互联网，把「一念3,000」比作全息宇宙，把「空性」比作量子纠缠。此类比附在传播上有效，在学理上有害：它使佛教看起来像是为现代科学提供了神秘背书，而实际上既未增加科学理解，也未增加教理理解。\n\n**判断的标准是清楚的：一项佛教概念如果不能带来既有的 AI 伦理框架所没有的评估维度或决策程序，它就不是贡献；若它能带来，则该贡献应当可以被具体说明，而不必依赖比喻。**\n\n以此标准衡量，上举五项之中，**「苦感敏感的影响评估」与「诠释的谦逊」两项最经得起检验**——前者提供了以「苦」而非以「权利」或「效率」为起点的评估轴，后者提供了一套系统的否定性诠释纪律。（判断·评估／依据：本段所立「能否带来既有框架所无之维度」之检验标准）其余三项虽有价值，然「关系性问责」与「文化参与」在西方伦理学与治理理论中已有相当程度的对应物，「慈悲与关怀的完整性」则尚需更具体的操作化。\n\n### 一项总体判断\n\n**佛教对 AI 伦理的贡献，不在于提供新的规则，而在于提供一种以苦为尺度、以关系为单位的评估视角。**（判断·评估／依据：Hariyanto 等 2026 五项维度之逐项对照）这一视角与主流 AI 伦理的关系不是竞争，而是补充：主流框架长于处理可计量、可归责、可程序化的问题；佛教视角长于处理那些难以计量、难以归属、需要从感受出发的问题。二者各有所长，不宜互相取代。\n\n尚须承认的是：这一领域目前**实证研究严重不足**。上述两项研究都是概念性、综述性工作，还没有大规模的用户研究、效果评估或长期追踪。何种佛教伦理原则在何种 AI 设计决策中产生何种可测差异，目前基本没有数据。此为本文如实登记之局限。\n\n> **EN对应 · Eleven: What Buddhist Philosophy Contributes to AI Ethics**\n>\n> Chapter Ten examined the ethical risks Buddhism faces in using AI. Beyond risk lies a converse question: **can Buddhist philosophy contribute to AI ethics itself?** This is not rhetorical courtesy but a testable scholarly question.\n>\n> **Five dimensions already in the peer-reviewed literature.**\n>\n> | Dimension | Original term | Point |\n> |---|---|---|\n> | Suffering-sensitive impact assessment | suffering-sensitive impact assessment | Treats the potential impact on sentient beings' suffering as an independent metric, not merely efficiency, fairness, or privacy |\n> | Relational accountability | relational accountability | Accountability extends to the network of persons, machines, and environments, not only to individual actors |\n> | Compassion and care integrity | compassion and care integrity | Ensures AI does not simulate false compassion—compassionate expression produced without corresponding capacity and responsibility |\n> | Interpretive humility | interpretive humility | Acknowledges the limits of AI interpretation and preserves space for human interpretation |\n> | Cultural participation | cultural participation | Involves traditional communities in AI design and governance |\n>\n> A second study from the same period takes Master Hsing Yun's Humanistic Buddhism as its basis, converting the \"Three Acts of Goodness\" and \"Four Givings\" into a digital mindfulness guide and proposing a framework of \"Humanistic Buddhist Intelligence\"—a \"digital cognitive firewall\" within the user, for countering algorithmic manipulation and AI-generated illusion (Grade B, Kang Qihao, *AI and Ethics* 6(5), 2026; [original](https://doi.org/10.1007/s43681-026-01316-8)).\n>\n> **The Buddhist ethical resources, item by item.**\n>\n> | Dimension | Doctrinal counterpart | Point of comparison |\n> |---|---|---|\n> | Suffering-sensitive impact assessment | The truth of suffering; ahiṃsā | Most AI ethics frameworks centre on fairness, transparency, and explainability, with the individual or the group as their unit; the truth of suffering supplies a different unit—it asks who suffers from this, how the suffering arises, and whether it can cease. This is an evaluative axis grounded in feeling rather than in rights |\n> | Relational accountability | Dependent origination | No dharma exists independently; all arise in dependence. Seen thus, \"who is responsible\" cannot be reduced to \"which engineer wrote the wrong code,\" but must be located in the network formed by model developers, data sources, deployers, users, and those affected |\n> | Compassion and care integrity | Compassion; universal compassion | AI can generate compassionate statements without possessing compassion. If \"the expression of compassion\" and \"compassion\" are not distinguished, care becomes performance—and performed care is cheaper to produce and more replicable at scale, exerting market pressure that eliminates genuine care |\n> | Interpretive humility | Prajñā; the apophatic tradition | Buddhist hermeneutics has long warned against mistaking the finger for the moon; Nāgārjuna's tetralemma in the *Mūlamadhyamakakārikā* is a systematic hermeneutics of humility. The direct technical corollary: Buddhist AI should avoid declaring that a given view is the true meaning of the dharma (see the task grading in Chapter Six) |\n> | Cultural participation | Karma-vācā; concord | The Buddhist decision-making tradition has always included collective deliberation and mutual sanction (see the companion volume, in the chapter on governance and temple economy), structurally comparable to the stakeholder participation modern AI governance advocates |\n>\n> **One misuse that must be avoided: affixing Buddhist terminology to existing AI ethics frameworks and passing it off as a contribution.** This takes two forms. The **labelling** form renames \"fairness\" as \"equality\" and \"transparency\" as \"seeing things as they are,\" with no change in substance. The **analogical** form likens Indra's net to the internet, \"three thousand realms in a single thought\" to a holographic universe, or emptiness to quantum entanglement. Such analogies are effective in popular writing and harmful in scholarship: they make Buddhism appear to supply a mystical warrant for modern science, while adding neither scientific understanding nor doctrinal understanding.\n>\n> **The test is clear: a Buddhist concept that brings no evaluative dimension or decision procedure absent from existing AI ethics frameworks is not a contribution; if it does bring one, that contribution should be specifiable without relying on metaphor.** By this test, **\"suffering-sensitive impact assessment\" and \"interpretive humility\" are the two that best withstand scrutiny**—the first supplying an evaluative axis grounded in suffering rather than in rights or efficiency, the second a systematic discipline of negative hermeneutics. (Judgment) The remaining three have value, but \"relational accountability\" and \"cultural participation\" have considerable counterparts in Western ethics and governance theory, while \"compassion and care integrity\" still requires more specific operationalization.\n>\n> **One overall judgment: Buddhism's contribution to AI ethics lies not in supplying new rules but in supplying an evaluative perspective grounded in suffering and measured in relations.** (Judgment) Its relation to mainstream AI ethics is not competition but supplement: the mainstream framework excels at what can be measured, attributed, and proceduralized; the Buddhist perspective excels at what resists measurement and attribution and must begin from feeling. Neither should replace the other.\n>\n> It must also be acknowledged that **empirical research in this area is seriously insufficient.** Both studies cited are conceptual and review-based; there are no large-scale user studies, effect evaluations, or longitudinal tracking. Which Buddhist ethical principles produce which measurable differences in which AI design decisions is a question for which there is at present almost no data. This report registers that limitation as it stands.\n\n---\n\n## 十二、度量、算法与身体的边界\n\n### 从曝光量到留存率：传播度量重心之转移\n\n传播效果不能再只看粉丝数、点赞数、播放量。更有意义的是建立一条**佛法传播漏斗**：\n\n```\n曝光 → 观看 → 理解 → 第一次学习 → 持续学习 → 线上共修\n→ 线下参与 → 长期修学 → 志愿服务 → 慈善实践 → 社区参与\n```\n\n这带来一个重大改变：**把「传播量」变成「学习与实践的转化率」。**\n\n一条视频 100 万播放，不一定比一个只有3,000人但形成了持续学习社群的课程更有宗教教育价值。数据科学真正能帮佛教组织回答的问题是：哪些内容能吸引新人？哪些能形成持续学习？哪些语言市场需求最大？哪些课程流失严重？哪些新成员最终进入了线下社群？什么内容适合青年？不同国家的用户走的是不同路径吗？\n\n但有一条界线：**可以测量传播行为，不能轻易把「悟性、功德、证量」变成平台 KPI。** 一旦寺院开始用转化率考核法师，它就已经不是在弘法了。\n\n### 推荐算法与权力结构\n\n数字宗教研究近年日益强调：平台并非中性的传播管道。2026年一篇综述综合分析了88 项研究，指出平台基础设施、算法可见性与网络化公众正在改变宗教权威、仪式实践与社群形成（B 级，AlMazaedh 等，*Frontiers in Sociology* 11:1802281, 2026）。\n\n这对汉传非常重要，因为传播结构正在变。\n\n过去的传播结构是**寺院→法师→信众**。数字平台之后变成**寺院→法师→平台算法→用户**。而 AI 时代可能变成**经典／法师／寺院→AI 知识层→AI 推荐与问答→用户**。\n\n也就是说，**新的「中介者」可能不再只是平台，而是 AI 本身。**\n\n因此需要维护的，不只是流量，而是三样透明：**知识来源透明、推荐逻辑透明、教义边界透明。** 当一个信众的问题由 AI 回答时，「这个答案从哪里来」必须是他能查到的。\n\n### VR、AR 与身体的边界\n\nVR/AR 适合做的事很清楚：佛教艺术教育、石窟与寺院数字重建、历史场景可视化、佛教博物馆、经变图教学、建筑与艺术史教学、远程文化体验，以及某些类型的禅修环境辅助。\n\n已有研究系统评价了 VR 正念干预的效果，发现其在状态正念、负性情绪等方面具有一定短期积极效果，但不同研究的方法、对象与干预方式差异很大。一项2024年发表于 *Digital Health* 的系统综述与证据图纳入22 项研究，指出需要更大型、更严格的研究（B 级，Wieczorek 等，*Digit Health* 10, 2024）。\n\n这里有一处需要特别指出：流传材料称该研究为「2026年的一项 Meta 分析，纳入35 项研究、约1,550名参与者」。经核查，实际是2024年发表的**系统综述加证据图**（非 Meta 分析），纳入 **22 项**研究。年份、研究设计、样本量三处均不相符。这是核查中发现的最典型的一类错误——**数字精确到具体，却是错的**，比模糊的概括更容易骗过读者。\n\n因此必须严格区分两句话。**VR 可以辅助进入某种环境或注意状态**——这是可以研究、也已有初步证据的。**VR 能够制造禅定、悟境或证果**——这不是一个科学命题。\n\n脑电、心率变异性、呼吸、心率、睡眠、注意力、生理反馈、神经反馈——这些都值得研究。但目前的证据**不足以支持「利用这些指标直接识别高级佛教修行境界」**。2024年一项关于正念神经反馈的系统综述发现，EEG/fMRI 相关研究仍存在样本量、对照设计与迁移效应不足等问题，尤其缺少充分的假神经反馈对照；因此不能简单把神经信号变化解释为更高层次的修行成就（B 级，Treves、Greene、Bajwa 等，正式版见 *Imaging Neuroscience* 2:imag-2-00396, 2024；流传材料所引 PubMed 39314394 为预印本）。\n\n稳妥的方向是**「生理反馈辅助训练」**，而不是**「脑电测量证果」**。\n\n这一区分关乎的不只是科学严谨，还关乎教法本身。**把修行境界等同于某个生理指标，是用一个可测量的东西替换一个不可测量的东西——而替换掉的，恰恰是修行。**（判断·推论／依据：Treves 等 2024 指出该领域缺少假神经反馈对照）\n\n## 十三、项目生态概览\n\n当前值得关注的方向有五类，此处只列名目与定位，具体数据与链接见附录。\n\n**BDRC** 是佛教数字底座。它的思路是先把佛教数据建好，聊天机器人是以后的事。2026年的开放数据集计划尤其值得重视。\n\n**CBETA＋DILA＋SAT** 构成汉传佛教的数字学术底座，分别代表结构化经典、综合检索、版本与页面核验三个方向。三者未来非常值得进一步整合。\n\n**Dharmamitra / MITRA** 已把佛教多语搜索、文本复用检测与机器翻译作为明确研究方向，从实验演示进入了学术生产流程。\n\n**84000** 提供了一个值得汉传借鉴的范式：AI 作为专业翻译团队的增强工具，而不是替代专业译者。\n\n**新一代佛教 RAG 与知识图谱项目**近年陆续出现，把佛典聚合、RAG、知识图谱、跨语种对读结合起来。此类项目显示「佛教搜索引擎」正在向「AI 研究环境」演化，但其中一些项目的规模、准确率、数据覆盖范围仍主要来自项目方自身介绍，**目前不能与 CBETA、SAT、BDRC 这类长期专业项目直接等量齐观。**\n\n汉传自己的动作也已出现：佛光山的「人間雲」（2025年2月3日发表，语料为《星云大师全集》与《人间福报》25 年新闻库）、Vurbo.ai 术语翻译系统、灵隐寺的古籍 OCR 与「如是佛典」、法鼓山数典的知识图谱。这些是真实进展，起点是好的，规模与 CBETA、BDRC 相比仍然很小。\n\n**这里有一个战略判断：汉传不需要也来不及在每一项上都自建。** 它需要的是——在少数几件只有它能做的事上做到不可替代，其余部分接入别人的基础设施。（判断·推论／依据：第一章组织形态比较、第四章技术瓶颈分布）\n\n只有汉传才有的东西是什么？是汉文大藏经的权威版本与校勘、是汉传诸宗的义理体系与术语、是2,000年的注疏传统、是完整的比丘尼戒统、是人间佛教的现代实践经验。其余——OCR 引擎、向量数据库、RAG 框架、大模型——都应当用现成的，而不是重造。\n\n## 十四、五至十年路线\n\n把前面的判断落成时间表，大致分三段（见图 7）。细节见附录。\n\n**2026—2027：数据底座阶段。** 优先事项是 CBETA／DILA／SAT 等资源的协同、权威佛典数据标准、人物与寺院与法脉的知识图谱、佛教多语术语库、佛典版本与引用标准、高质量 OCR、多语平行语料、专业 RAG。这一阶段最重要的目标只有一个：**保证数据可信**。「智能」是以后的事。\n\n**2028—2030：知识智能化阶段。** 佛学 AI 研究助手、AI 翻译工作台、多语智能检索、学术文献 Agent、佛教知识图谱、个人佛学知识库、AI 课程助手、多语自动字幕、AI 数字博物馆、全球佛教知识门户。这一阶段最重要的变化是：**从「用户搜索佛典」转向「用户与佛教知识对话」。**\n\n**2031—2035：智能生态阶段。** 如果前两阶段的数据与治理基础建设成功，才可能发展多模态佛教 AI、个人终身佛学导师系统、AI 与 VR 结合的佛教教育、全球多语佛教课程自动适配、跨传统比较研究 Agent、佛教历史虚拟重建、个性化学习路径、国际佛教知识网络。\n\n<svg viewBox=\"0 0 780 372\" style=\"width:100%;max-width:780px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"1\" y=\"1\" width=\"778\" height=\"370\" rx=\"8\" fill=\"#faf7f1\" stroke=\"#e0d7c8\"/><line x1=\"40\" y1=\"48\" x2=\"740\" y2=\"48\" stroke=\"#b8863c\" stroke-width=\"2\"/><path d=\"M732,42 L744,48 L732,54 Z\" fill=\"#b8863c\"/><circle cx=\"135\" cy=\"48\" r=\"9\" fill=\"#c9b06a\"/><rect x=\"15\" y=\"70\" width=\"240\" height=\"264\" rx=\"8\" fill=\"#ffffff\" stroke=\"#c9b06a\" stroke-width=\"2\"/><text x=\"135\" y=\"96\" font-size=\"14\" font-weight=\"bold\" fill=\"#b8863c\" text-anchor=\"middle\">2026—2027</text><text x=\"135\" y=\"116\" font-size=\"12\" font-weight=\"bold\" fill=\"#4a3a22\" text-anchor=\"middle\">数据底座阶段</text><text x=\"135\" y=\"138\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">CBETA／DILA／SAT 协同</text><text x=\"135\" y=\"159\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">权威佛典数据标准</text><text x=\"135\" y=\"180\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">人物寺院法脉知识图谱</text><text x=\"135\" y=\"201\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">佛教多语术语库</text><text x=\"135\" y=\"222\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">版本与引用标准</text><text x=\"135\" y=\"243\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">高质量 OCR</text><text x=\"135\" y=\"264\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">多语平行语料</text><text x=\"135\" y=\"285\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">专业 RAG</text><circle cx=\"390\" cy=\"48\" r=\"9\" fill=\"#9aab74\"/><rect x=\"270\" y=\"70\" width=\"240\" height=\"306\" rx=\"8\" fill=\"#ffffff\" stroke=\"#9aab74\" stroke-width=\"2\"/><text x=\"390\" y=\"96\" font-size=\"14\" font-weight=\"bold\" fill=\"#b8863c\" text-anchor=\"middle\">2028—2030</text><text x=\"390\" y=\"116\" font-size=\"12\" font-weight=\"bold\" fill=\"#4a3a22\" text-anchor=\"middle\">知识智能化阶段</text><text x=\"390\" y=\"138\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">佛学 AI 研究助手</text><text x=\"390\" y=\"159\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">AI 翻译工作台</text><text x=\"390\" y=\"180\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">多语智能检索</text><text x=\"390\" y=\"201\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">学术文献 Agent</text><text x=\"390\" y=\"222\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">佛教知识图谱</text><text x=\"390\" y=\"243\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">个人佛学知识库</text><text x=\"390\" y=\"264\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">AI 课程助手</text><text x=\"390\" y=\"285\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">多语自动字幕</text><text x=\"390\" y=\"306\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">AI 数字博物馆</text><text x=\"390\" y=\"327\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">全球佛教知识门户</text><circle cx=\"645\" cy=\"48\" r=\"9\" fill=\"#7a9a6b\"/><rect x=\"525\" y=\"70\" width=\"240\" height=\"264\" rx=\"8\" fill=\"#ffffff\" stroke=\"#7a9a6b\" stroke-width=\"2\"/><text x=\"645\" y=\"96\" font-size=\"14\" font-weight=\"bold\" fill=\"#b8863c\" text-anchor=\"middle\">2031—2035</text><text x=\"645\" y=\"116\" font-size=\"12\" font-weight=\"bold\" fill=\"#4a3a22\" text-anchor=\"middle\">智能生态阶段</text><text x=\"645\" y=\"138\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">多模态佛教 AI</text><text x=\"645\" y=\"159\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">终身佛学导师系统</text><text x=\"645\" y=\"180\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">AI＋VR 佛教教育</text><text x=\"645\" y=\"201\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">多语课程自动适配</text><text x=\"645\" y=\"222\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">跨传统比较研究 Agent</text><text x=\"645\" y=\"243\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">佛教历史虚拟重建</text><text x=\"645\" y=\"264\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">个性化学习路径</text><text x=\"645\" y=\"285\" font-size=\"10.5\" fill=\"#6b5c45\" text-anchor=\"middle\">国际佛教知识网络</text><text x=\"390\" y=\"362\" font-size=\"10.5\" fill=\"#8a7b66\" text-anchor=\"middle\">前一阶段不成立，后一阶段无由开展：数据不可信，智能化即放大错误</text></svg>\n\n> 图 7｜五至十年三阶段路线\n\n但即使到了第三阶段，有一条底线建议始终保持：**AI 是工具、助手、媒介；人类导师、学者、僧团与真实社群仍然是核心。**\n\n### 六项原则\n\n| 原则 | 内容 | 主要适用场景 |\n|---|---|---|\n| 一、原典优先 | 任何重大教义性结论都尽可能回到原典 | 教义问答、义理解释 |\n| 二、出处优先 | 答案必须尽可能提供经名、卷次、章节或页码、版本 | 一切引用 |\n| 三、传统分层 | 不得把早期佛教、中观、唯识、天台、华严、禅宗、净土混成一个「佛教统一答案」 | 义理解释、宗派判定 |\n| 四、解释透明 | 须告知用户：此为经典原文／古代注疏／现代学术解释／AI 综合 | 一切生成内容 |\n| 五、人类导师在环 | 涉及戒律、心理危机、强烈宗教体验、师徒关系、医疗问题、高风险修行者，须设置人工介入 | 高风险咨询 |\n| 六、数据最小化 | 修行日志、个人经历、情绪与敏感身份数据，遵循最小采集原则，不因「做个性化 AI」而无限收集 | 修行日志、个人资料 |\n\n### 十项评测\n\n传统 AI 只测试「答案像不像」，佛学 AI 应当测试十项：\n\n| 指标 | 测什么 |\n|------|--------|\n| 原典准确率 | 引用的经典是否真的存在 |\n| 出处准确率 | 卷、页、品、版本是否准确 |\n| 版本识别率 | 是否把不同版本混为一谈 |\n| 宗派区分率 | 是否正确区分不同传统 |\n| 引文完整率 | 是否遗漏上下文 |\n| 翻译准确率 | 专业术语是否稳定 |\n| 幻觉率 | 是否生成不存在的经典、人物、引文 |\n| 可追溯率 | 用户能否点击回原典 |\n| 专家一致率 | 佛教学者对答案的认可度 |\n| 多语一致率 | 中英日韩等版本的核心意义是否一致 |\n\n**这十项里没有一项是「回答听起来多有智慧」。** 这不是疏忽，是立场：佛学 AI 的合格线应当由可核验的准确性划定，而不是由文本的感染力划定。（判断·立场／依据：无文献可据，系本文所持之规范立场）\n\n> **EN对应 · Chapters Twelve to Fourteen**\n>\n> **Twenty-Two: Measurement, Algorithms, and the Boundaries of the Body.**\n>\n> **Replacing \"how many saw it\" with \"how many stayed.\"** Transmission effectiveness can no longer be measured by follower counts, likes, and views. What matters more is a **dharma transmission funnel**:\n>\n> ```\n> Exposure → Viewing → Understanding → First study → Continued study\n> → Online group practice → In-person participation → Long-term study\n> → Volunteer service → Charitable practice → Community engagement\n> ```\n>\n> This brings a major shift: **from \"transmission volume\" to \"the conversion rate into study and practice.\"** A video with a million views is not necessarily of greater religious-educational value than a course of three thousand that formed a continuing study community. The questions data science can genuinely help Buddhist organizations answer are: what content attracts newcomers? What content produces sustained study? Which language markets have the greatest demand? Which courses lose people badly? Which new members eventually enter in-person communities? What content suits young people? Do users in different countries follow different paths?\n>\n> One line must be drawn: **transmission behaviour can be measured; insight, merit, and realization must not lightly be turned into platform KPIs.** Once a temple begins evaluating its monastics by conversion rates, it is no longer transmitting the dharma.\n>\n> **Recommender algorithms and the structure of power.** A 2026 review of digital religion, synthesizing 88 studies, argues that platform infrastructure, algorithmic visibility, and networked publics are changing religious authority, ritual practice, and community formation (Grade B, AlMazaedh et al., *Frontiers in Sociology* 11:1802281, 2026).\n>\n> This matters greatly, because the structure of transmission is changing. It once ran **temple → monastic → devotee**. After digital platforms it ran **temple → monastic → platform algorithm → user**. In the AI era it may run **scripture / monastic / temple → AI knowledge layer → AI recommendation and Q&A → user**. That is, **the new intermediary may no longer be the platform alone. It may be the AI itself.**\n>\n> What must therefore be maintained is not merely traffic but three kinds of transparency: **transparency of knowledge provenance, transparency of recommendation logic, and transparency of doctrinal boundaries.** When a devotee's question is answered by an AI, \"where did this answer come from\" must be something he can look up.\n>\n> **VR, AR, and the boundaries of the body.** What VR/AR suits is clear enough: Buddhist art education, digital reconstruction of cave sites and temples, visualization of historical scenes, museums, teaching from transformation tableaux, architectural and art-historical instruction, remote cultural experience, and certain kinds of environmental support for meditation.\n>\n> Studies have systematically reviewed VR-based mindfulness interventions, finding some short-term positive effects on state mindfulness and negative affect, but with wide variation in method, population, and intervention. A 2024 systematic review and evidence map in *Digital Health* included **22** studies and called for larger and more rigorous research (Grade B, Wieczorek et al., *Digit Health* 10, 2024).\n>\n> One point requires special note. Circulating materials describe this research as \"a 2026 meta-analysis including 35 studies and about 1,550 participants.\" On verification it is a **2024** publication, a **systematic review with evidence mapping** rather than a meta-analysis, including **22** studies. Year, design, and sample size are all three wrong. This is the most typical error found—**a figure precise in its specifics but incorrect**, likelier to slip past a reader than a vague generalization.\n>\n> Two sentences must therefore be strictly distinguished. **VR can help a person enter a certain environment or state of attention**—this can be studied, and preliminary evidence exists. **VR can produce meditative absorption, enlightenment, or fruition**—this is not a scientific proposition.\n>\n> Brain electrical activity, heart rate variability, respiration, heart rate, sleep, attention, physiological feedback, neurofeedback—all worth studying. But current evidence **does not support \"using these indicators to identify advanced Buddhist states of practice.\"** A 2024 systematic review of mindfulness-based neurofeedback found that EEG and fMRI studies still suffer from inadequate sample sizes, control designs, and attention to transfer effects, and notably lack adequate sham-neurofeedback controls; neural signal changes therefore cannot simply be interpreted as higher levels of attainment (Grade B, Treves, Greene, Bajwa et al., final version in *Imaging Neuroscience* 2:imag-2-00396, 2024; the PubMed record cited in circulating materials is a preprint).\n>\n> The sound direction is **\"physiological feedback as training support,\"** not **\"EEG measurement of attainment.\"**\n>\n> The distinction bears on more than scientific rigour. It bears on the teaching itself. **To equate a state of practice with a physiological index is to replace something unmeasurable with something measurable—and what gets replaced is precisely the practice.** (Judgment)\n>\n> **Twenty-Three: The Project Landscape.** Five directions are worth attention; figures and links are in Appendix Three.\n>\n> **BDRC** is the Buddhist digital foundation. Its approach is not to build a chatbot but to build high-quality Buddhist data first. Its 2026 open-dataset initiative deserves particular attention.\n>\n> **CBETA + DILA + SAT** form the digital scholarly foundation for Chinese Buddhism, representing respectively structured canonical texts, integrated search, and edition and page verification. Further integration of the three is well worth pursuing.\n>\n> **Dharmamitra / MITRA** has made multilingual Buddhist search, textual reuse detection, and machine translation explicit research directions, moving from experimental demonstration into scholarly production.\n>\n> **84000** offers a paradigm worth borrowing: AI as an enhancement tool for a professional translation team, not a replacement for professional translators.\n>\n> **A newer generation of Buddhist RAG and knowledge-graph projects** shows the \"Buddhist search engine\" evolving toward an \"AI research environment,\" but the scale, accuracy, and data coverage of some remain project self-descriptions, and **cannot currently be equated with long-standing professional projects such as CBETA, SAT, and BDRC.**\n>\n> Chinese Buddhism's own moves have begun: Foguang Shan's \"Humanistic Cloud\" (announced 3 February 2025, with the *Complete Works of Master Hsing Yun* and twenty-five years of the *Merit Times* archive as its corpus), the Vurbo.ai terminology system, Lingyin Temple's OCR work and the Rushi Fodian platform, and Dharma Drum's knowledge graphs. These are real advances and a good beginning; their scale remains small beside CBETA or BDRC.\n>\n> **A strategic judgment follows: Chinese Buddhism need not, and cannot, build everything itself.** What it needs is to become irreplaceable in the few things only it can do, and to connect to others' infrastructure for the rest. (Judgment)\n>\n> What does only Chinese Buddhism have? Authoritative editions and critical collations of the Chinese canon; the doctrinal systems and terminologies of its schools; two thousand years of commentary; the complete bhikṣuṇī ordination lineage; and the modern practical experience of Humanistic Buddhism. Everything else—OCR engines, vector databases, RAG frameworks, large models—should be adopted off the shelf, not rebuilt.\n>\n> **Twenty-Four: A Five- to Ten-Year Roadmap.** Reduced to a timetable, the preceding judgments fall into three stages (see Figure 7); details are in Appendix Three.\n>\n> **2026–2027: the data foundation stage.** Priorities are coordination among CBETA, DILA, and SAT; authoritative canonical data standards; knowledge graphs of persons, temples, and lineages; a multilingual Buddhist terminology database; edition and citation standards; high-quality OCR; multilingual parallel corpora; and professional RAG. The most important thing at this stage is not \"intelligence\" but **ensuring the data can be trusted.**\n>\n> **2028–2030: the knowledge intelligence stage.** AI research assistants for Buddhist studies, AI translation workbenches, multilingual intelligent retrieval, scholarly literature agents, Buddhist knowledge graphs, personal Buddhist knowledge bases, AI course assistants, automatic multilingual subtitling, AI digital museums, and a global Buddhist knowledge portal. The key change is **a shift from \"users search the canon\" to \"users converse with Buddhist knowledge.\"**\n>\n> **2031–2035: the intelligent ecosystem stage.** Only if the data and governance foundations of the first two stages succeed can there be multimodal Buddhist AI, lifelong personal study-mentor systems, AI-and-VR Buddhist education, automatic adaptation of global multilingual Buddhist courses, cross-traditional comparative research agents, virtual reconstruction of Buddhist history, personalized learning paths, and an international Buddhist knowledge network.\n>\n> Even in the third stage, one baseline should hold: **AI is a tool, an assistant, a medium; human teachers, scholars, monastic communities, and real communities remain the core.**\n>\n> **Six principles.**\n>\n> | Principle | Content | Principal application |\n> |---|---|---|\n> | One: canon first | Every significant doctrinal conclusion should return to the canon wherever possible | Doctrinal Q&A; interpretation |\n> | Two: source first | Answers must provide, wherever possible, the title, fascicle, chapter or page, and edition | All citation |\n> | Three: stratify by tradition | Early Buddhism, Madhyamaka, Yogācāra, Tiantai, Huayan, Chan, and Pure Land must not be blended into a single \"unified Buddhist answer\" | Interpretation; school adjudication |\n> | Four: transparent interpretation | Users must be told: this is canonical text / classical commentary / modern scholarship / AI synthesis | All generated content |\n> | Five: human mentor in the loop | Where precepts, psychological crisis, intense religious experience, teacher–student relations, medical questions, or high-risk practice are involved, human intervention must be provided | High-risk consultation |\n> | Six: data minimization | Practice journals, personal histories, emotional and sensitive identity data follow a principle of minimal collection, not gathered without limit \"to build a personalized AI\" | Practice journals; personal data |\n>\n> **Ten evaluation metrics.** Conventional AI tests only whether an answer sounds right. Buddhist AI should test ten things:\n>\n> | Metric | What it measures |\n> |---|---|\n> | Canonical accuracy | Does the cited scripture actually exist |\n> | Source accuracy | Are fascicle, page, chapter, and edition correct |\n> | Edition recognition | Are different editions conflated |\n> | School discrimination | Are traditions correctly distinguished |\n> | Quotation completeness | Is context omitted |\n> | Translation accuracy | Is terminology stable |\n> | Hallucination rate | Are nonexistent scriptures, figures, or quotations generated |\n> | Traceability | Can the user click back to the canon |\n> | Expert agreement | Do Buddhist scholars accept the answer |\n> | Multilingual consistency | Do Chinese, English, Japanese, and Korean versions agree in core meaning |\n>\n> **Not one of the ten is \"how wise the answer sounds.\"** That is not an oversight but a position: the pass mark for Buddhist AI should be set by verifiable accuracy, not by rhetorical appeal. (Judgment)\n\n---\n\n## 十五、建设主体与组织形式\n\n第三部已经说明：佛教 AI 的核心竞争力在语料、版本、出处、术语、传统区分，而不在模型大小。对汉传来说，这意味着一个明确的行动纲领。\n\n要做三件事。 其一，把汉文佛典的权威数据做成开放、可引用、有版本的标准。这件事不必新建，整合 CBETA、SAT、DILA 以及灵隐寺等已有的工作即可，再加上统一的元数据规范与版本控制。其二，把术语层与平行语料开放出来。其三，建立可验证的 AI 与覆盖率仪表盘，把「可信佛学 AI」的标准工作流（第七章）作为公开规范发布，让所有做佛教 AI 的团队都可以遵循。\n\n**这三件事做完，汉传在全球佛学知识秩序里的位置就确定了。** 反之，若十年后这三件事仍由别人在做，那么汉传就只能适配别人定下的秩序。（判断·预测／依据：属推估，无文献可据）\n\n### 实施主体\n\n上述各项工作的实施，从现有条件看，难以由任何单一机构承担。这一判断基于各类资源的实际分布：CBETA 掌握语料与学术信誉，但不具备教团层级的人力与资金；佛光山拥有国际网络与资金，但不以数字人文为专长；灵隐寺拥有技术团队与古籍，但工作范围限于本寺项目；学术机构具备方法，但不掌握经典与僧团。\n\n| 机构类型 | 所具资源 | 所缺资源 |\n|---|---|---|\n| CBETA 等语料机构 | 语料、学术信誉、编码规范 | 教团层级的人力与资金 |\n| 大型教团（如佛光山） | 国际网络、资金、信众基础 | 数字人文专长 |\n| 寺院技术团队（如灵隐寺） | 技术能力、古籍资源 | 跨机构协作范围 |\n| 学术机构 | 研究方法、评价体系 | 经典与僧团的直接掌握 |\n\n各方的资源缺口具有互补性，而任何一方的缺口都不足以由自身补足。因此，**跨机构协作并非一种倡议，而是现有资源分布的自然体现**。\n\n组织形式宜取轻量结构：一个**佛学 AI 与数字人文研究中心**，由高校、佛学院、大型佛教组织或跨机构联盟承办。最小可行团队不止于 AI 工程师，而应包含：佛学家、文献学家、数字人文学者、NLP / LLM 工程师、数据工程师、产品与体验人员、多语翻译专家、伦理治理人员。\n\n其中居于枢纽的一条是：**佛学专家须实质参与 AI 开发流程，而非仅在验收环节签署意见。** 此条听似常识，实则最易落空，因为它意味着佛教学者须在项目内投入工程性工作——整理语料、标注术语、校验出处——而此类工作不计入学术成果。**由此产生一项配套要求：使此类工作获得成果认定。** 若这一环节不解决，「专家进入流程」之议将无从落实。（判断·预测／依据：属推估，无文献可据）\n治理上采用三委员会结构：**学术委员会**负责经典、版本、历史、术语与研究规范；**技术委员会**负责数据、模型、RAG、评测与安全；**伦理治理委员会**负责隐私、权威模拟、宗教伦理、未成年人、心理风险与数据使用边界。\n\n---\n\n> **EN对应 · Fifteen: Who Should Build It, and in What Form**\n>\n> Part Three established that the core competitiveness of Buddhist AI lies in corpora, editions, provenance, terminology, and the distinguishing of traditions—not in model size. For Chinese Buddhism this yields a clear programme.\n>\n> **Three things to do.** First, make authoritative Chinese canonical data open, citable, and versioned—not new construction but the integration of existing work at CBETA, SAT, DILA, and Lingyin Temple, with unified metadata standards and version control. Second, open up the terminology layer and parallel corpora. Third, build verifiable AI and a coverage dashboard, publishing the standard workflow for trustworthy Buddhist AI (Chapter Seven) as an open specification that any Buddhist AI team may follow.\n>\n> **Once these three are done, Chinese Buddhism's place in the global order of Buddhist knowledge is settled.** Conversely, if in ten years the three are still being done by others, Chinese Buddhism will be adapting to an order someone else defined. (Judgment)\n>\n> **Who should build it.** The implementation of the foregoing work is, on present conditions, difficult for any single body to undertake. This rests on the actual distribution of resources: CBETA holds corpora and scholarly credibility but lacks the personnel and funding of an order; Foguang Shan has an international network and funding but no specialization in digital humanities; Lingyin Temple has a technical team and rare books but a scope limited to its own project; academic institutions have method but do not hold the canon or the sangha directly.\n>\n> | Institutional type | Resources held | Resources lacking |\n> |---|---|---|\n> | Corpus bodies (e.g. CBETA) | Corpora, scholarly credibility, encoding standards | Personnel and funding at order level |\n> | Large orders (e.g. Foguang Shan) | International network, funding, lay base | Digital humanities expertise |\n> | Temple technical teams (e.g. Lingyin Temple) | Technical capacity, rare books | Cross-institutional scope |\n> | Academic institutions | Research methods, evaluation systems | Direct command of canon and sangha |\n>\n> The resource gaps on each side are complementary, and none can be closed from within. **Cross-institutional collaboration is therefore not a proposal but the natural expression of the existing distribution of resources.**\n>\n> The organizational form suggested is light: a **centre for Buddhist AI and digital humanities**, hosted by a university, a Buddhist college, a large Buddhist organization, or a cross-institutional consortium. The minimal viable team is not an AI team alone but includes: Buddhologists, textual scholars, digital humanists, NLP and LLM engineers, data engineers, product and UX staff, multilingual translation specialists, and ethics and governance staff.\n>\n> Pivotal among these is this: **Buddhist specialists must participate substantively in the AI development process, not merely sign off at acceptance.** This sounds like common sense and is in practice the easiest thing to lose, because it means Buddhist scholars spending project time on engineering work—organizing corpora, annotating terminology, verifying sources—none of which counts as scholarship. **A companion requirement follows: that such work receive recognition as scholarly output.** Unless this is resolved, the proposal to bring specialists into the process cannot be implemented. (Judgment · forecast / basis: an estimate; no documentary basis)\n>\n> Governance takes a three-committee structure: an **academic committee** for canon, editions, history, terminology, and research norms; a **technical committee** for data, models, RAG, evaluation, and safety; and an **ethics and governance committee** for privacy, simulation of authority, religious ethics, minors, psychological risk, and the boundaries of data use.\n\n---\n\n## 十六、跨学科的知识构成与合作结构\n\n佛教 AI 是一个天然跨学科的题目——它不可能是纯粹的技术问题，也不可能是纯粹的教理问题。但「跨学科」一词在中文语境中常被宽泛使用，掩盖了三种性质不同的合作形态，而三者对项目成败的影响明显不同。\n\n### 三类跨学科形态\n\n**多学科（multidisciplinary）**：各学科并置，各做各的，最后拼在一起。一支技术团队做系统，另请几位佛教学者写内容，双方在交付节点上对接。这是最常见、成本最低、也最易失败的一种。\n\n**交叉学科（interdisciplinary）**：学科之间发生方法迁移。例如把文献学的校勘方法用于训练数据清洗，或把佛学的义项区分方法用于本体设计。合作发生在方法层，而不止于交付对接。\n\n**超学科（transdisciplinary）**：不止跨越学科边界，也跨越学术与实践、科学与社会的边界，知识在应用情境中生产。此概念由皮亚杰（Jean Piaget）1970年在一次关于跨学科教学的会议上提出，后经尼科莱斯库（Basarab Nicolescu）等人在1994年《超学科宪章》中系统化。其社会学对应物，是吉本斯（Michael Gibbons）等人1994年提出的「知识生产的模式二」——区别于以学科内部逻辑为驱动的模式一，模式二的知识在应用语境中产生，参与者异质，且具有反身性（B 级，Gibbons 等，*The New Production of Knowledge*, Sage, 1994）。\n\n**佛教 AI 属于模式二，也必须是超学科的。**（判断·推论／依据：Gibbons 等 1994 模式二之定义、Nicolescu 1994 超学科之定义）理由是：其成果的正确性无法由任何单一学科判定。一个检索系统的「准确」既涉及工程指标，也涉及义项划分是否正确；一个翻译工作台的「可用」既涉及模型性能，也涉及译师是否愿意使用。此类判断只能在多方共同参与的语境中作出。\n\n### 佛教 AI 所涉之学科构成\n\n| 学科 | 贡献 | 在佛教 AI 中的具体位置 |\n|------|------|----------------------|\n| 佛学／宗教学 | 教理、宗派分野、诠释传统 | 本体设计、义项区分、宗派分层、教义裁定 |\n| 文献学／校勘学 | 版本谱系、异文、断句、辑佚 | 权威文本层、版本控制、训练数据清洗 |\n| 图书馆学／信息科学 | 元数据、知识组织、分类法 | 元数据层、检索系统、长期保存 |\n| 计算语言学／NLP | 分词、嵌入、序列标注、翻译模型 | 语义层、机器翻译、实体识别 |\n| 计算机科学／人工智能 | 模型、检索架构、系统工程 | AI 层、检索增强生成、性能与安全 |\n| 翻译学／术语学 | 翻译理论、术语标准、质量评估 | 术语层、翻译工作流、分级标注 |\n| 伦理学／科技哲学 | 价值分析、责任归属、治理框架 | 伦理治理委员会、风险分级、数据边界 |\n| 认知科学／神经科学 | 冥想研究、意识研究、实验设计 | 修行辅助之效果评估与风险识别 |\n| 人类学／社会学 | 社群、权威、仪式、数字化实践 | 传播与接受研究、用户研究 |\n| 法学／公共政策 | 数据治理、宗教法规、知识产权 | 合规审查、跨境数据、许可协议 |\n| 教育学 | 课程设计、学习科学、评估方法 | 佛学教育产品、僧才培养 |\n| 设计学／人机交互 | 界面、可用性、可及性 | 面向僧团与学者的工具设计 |\n\n<svg viewBox=\"0 0 760 300\" style=\"width:100%;max-width:760px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"1\" y=\"1\" width=\"758\" height=\"298\" rx=\"8\" fill=\"#faf7f1\" stroke=\"#e0d7c8\"/><text x=\"190\" y=\"30\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#b8863c\" text-anchor=\"middle\">不可替代的四学科</text><text x=\"570\" y=\"30\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#5e8b9e\" text-anchor=\"middle\">可阶段性引入的八学科</text><text x=\"190\" y=\"50\" font-size=\"10.5\" fill=\"#8a7b66\" text-anchor=\"middle\">缺其一，成果的正确性即无从保证</text><text x=\"570\" y=\"50\" font-size=\"10.5\" fill=\"#8a7b66\" text-anchor=\"middle\">重要，但可按项目阶段依次引入</text><rect x=\"40\" y=\"70\" width=\"300\" height=\"38\" rx=\"6\" fill=\"#b8863c\"/><text x=\"190\" y=\"94\" font-size=\"12.5\" fill=\"#faf7f1\" text-anchor=\"middle\">佛学 / 宗教学</text><rect x=\"40\" y=\"118\" width=\"300\" height=\"38\" rx=\"6\" fill=\"#b8863c\"/><text x=\"190\" y=\"142\" font-size=\"12.5\" fill=\"#faf7f1\" text-anchor=\"middle\">文献学 / 校勘学</text><rect x=\"40\" y=\"166\" width=\"300\" height=\"38\" rx=\"6\" fill=\"#b8863c\"/><text x=\"190\" y=\"190\" font-size=\"12.5\" fill=\"#faf7f1\" text-anchor=\"middle\">计算语言学 / NLP</text><rect x=\"40\" y=\"214\" width=\"300\" height=\"38\" rx=\"6\" fill=\"#b8863c\"/><text x=\"190\" y=\"238\" font-size=\"12.5\" fill=\"#faf7f1\" text-anchor=\"middle\">翻译学 / 术语学</text><rect x=\"420\" y=\"70\" width=\"300\" height=\"19\" rx=\"4\" fill=\"#dce8ee\" stroke=\"#b9cfd8\"/><text x=\"570\" y=\"84\" font-size=\"10.5\" fill=\"#3f6b7d\" text-anchor=\"middle\">图书馆学 / 信息科学</text><rect x=\"420\" y=\"94\" width=\"300\" height=\"19\" rx=\"4\" fill=\"#dce8ee\" stroke=\"#b9cfd8\"/><text x=\"570\" y=\"108\" font-size=\"10.5\" fill=\"#3f6b7d\" text-anchor=\"middle\">计算机科学 / AI</text><rect x=\"420\" y=\"118\" width=\"300\" height=\"19\" rx=\"4\" fill=\"#dce8ee\" stroke=\"#b9cfd8\"/><text x=\"570\" y=\"132\" font-size=\"10.5\" fill=\"#3f6b7d\" text-anchor=\"middle\">伦理学 / 科技哲学</text><rect x=\"420\" y=\"142\" width=\"300\" height=\"19\" rx=\"4\" fill=\"#dce8ee\" stroke=\"#b9cfd8\"/><text x=\"570\" y=\"156\" font-size=\"10.5\" fill=\"#3f6b7d\" text-anchor=\"middle\">认知科学 / 神经科学</text><rect x=\"420\" y=\"166\" width=\"300\" height=\"19\" rx=\"4\" fill=\"#dce8ee\" stroke=\"#b9cfd8\"/><text x=\"570\" y=\"180\" font-size=\"10.5\" fill=\"#3f6b7d\" text-anchor=\"middle\">人类学 / 社会学</text><rect x=\"420\" y=\"190\" width=\"300\" height=\"19\" rx=\"4\" fill=\"#dce8ee\" stroke=\"#b9cfd8\"/><text x=\"570\" y=\"204\" font-size=\"10.5\" fill=\"#3f6b7d\" text-anchor=\"middle\">法学 / 公共政策</text><rect x=\"420\" y=\"214\" width=\"300\" height=\"19\" rx=\"4\" fill=\"#dce8ee\" stroke=\"#b9cfd8\"/><text x=\"570\" y=\"228\" font-size=\"10.5\" fill=\"#3f6b7d\" text-anchor=\"middle\">教育学</text><rect x=\"420\" y=\"238\" width=\"300\" height=\"19\" rx=\"4\" fill=\"#dce8ee\" stroke=\"#b9cfd8\"/><text x=\"570\" y=\"252\" font-size=\"10.5\" fill=\"#3f6b7d\" text-anchor=\"middle\">设计学 / 人机交互</text></svg>\n\n> 图 8｜跨学科的知识构成\n\n各学科在佛教 AI 中的位置，见图 8。上表之中，**佛学、文献学、计算语言学与翻译学四者为不可替代者**——缺其中任何一者，成果的正确性即无从保证。其余为重要但可阶段性引入者。（判断·本文评估／依据：无直接文献可据，系依各学科在佛教 AI 中的实际位置所作之分类）\n\n### 三类典型接口失效\n\n佛教 AI 项目的失败，多数不在技术，而在**接口**。可辨者有典型三类：\n\n| 失效类型 | 表现 | 暴露阶段 | 结构性对策 |\n|---|---|---|---|\n| 术语失配 | 工程师按通用自然语言处理理解「分词」，佛教学者按科判理解「段落」——前者以统计最优切分，后者以义理完整切分；双方各说「切分」而所指不同 | 需求阶段不易暴露，至标注阶段方显，届时返工成本极高 | 术语以书面定义冻结 |\n| 目标失配 | 技术团队优化「准确率」，其含义是平均值；佛学团队求「不出错」，其含义是底线。二者在数学上并非同一目标——准确率自 95% 升至 97%，可能同时提高某类严重错误之出现率 | 评测阶段 | 目标以分层指标表述，不以单一平均值 |\n| 权威失配 | 谁有权判定「这段文本属天台还是华严」？工程师不能判定，算法不能判定，通用佛教学者也未必能判定 | 数据标注与产出阶段 | 宗派判定权授予具名之学僧 |\n\n**在宗教文本上，平均值不是恰当的目标函数。**（判断·论证／依据：本段之数学论证——平均值与底线非同一目标）\n\n三类失配都不是「多加沟通」所能解决，需要在**项目结构**上设置机制：术语以书面定义冻结、目标以分层指标（而非单一平均值）表述、宗派判定权授予具名之学僧。\n\n### 实践者之参与地位\n\n超学科之关键特征，是**实践者不是研究对象，而是知识生产的共同参与者**。\n\n佛教 AI 所涉之实践者，至少包括：僧团（戒律与教义之权威所在）、译师（翻译工作流之实际使用者）、禅修指导者（修行辅助之风险判断者）、寺院管理者（治理与数据之实际处置者）、佛教院校教师（教材与课程之实际编写者）。\n\n具体之含义是明确的：译经工作台若没有译师在日常使用，其设计必不合用；术语库如果没有法师参与审定，其译名必不合教界习惯；修行辅助系统如果没有禅修指导者参与风险评估，其分级必不合实际。**一个由工程师独立完成、再请法师「试用并反馈」的佛教 AI，不属超学科，而是外部的。**（判断·推论／依据：本节超学科之定义——实践者为共同参与者而非研究对象）\n\n### 可审计性指标\n\n据此可以提出一项具体建议：**每一个佛教 AI 项目，应公开其学科构成与实践者参与方式。**\n\n此项披露不必复杂，列明即可：项目成员之学科背景、实践者以何种身份参与（顾问、共同设计、日常使用、有权否决）、宗派判定由谁负责、伦理审查由谁承担。\n\n其理由是：**佛教 AI 的质量瓶颈，不在算法，也不在语料，而在学科接口与实践者参与的制度化程度。**（判断·推论／依据：本章三种接口失败之分析）算法可以采购，语料可以积累，接口与制度只能建设。而既然只能建设，就可以被检查——公开披露即是检查的第一步。\n\n> **EN对应 · Sixteen: Disciplinary Composition and the Structure of Collaboration**\n>\n> Buddhist AI is inherently interdisciplinary—it can be neither a purely technical problem nor a purely doctrinal one. But \"interdisciplinary\" is used loosely in Chinese, obscuring three forms of collaboration with sharply different consequences.\n>\n> **Three kinds of crossing.** **Multidisciplinary** work places disciplines side by side, each doing its own part, assembled at the end: a technical team builds the system, several Buddhist scholars are engaged to write content, and the two sides meet at delivery nodes. This is the most common, the cheapest, and the most prone to failure. **Interdisciplinary** work involves method transfer between disciplines—for example, applying the textual critic's collation methods to training-data cleaning, or the Buddhist scholar's sense-discrimination methods to ontology design; collaboration occurs at the level of method, not merely at delivery. **Transdisciplinary** work crosses not only disciplinary boundaries but also the boundary between academia and practice, and between science and society, producing knowledge in the context of application. The term was proposed by Jean Piaget in 1970 at a conference on interdisciplinary teaching and systematized by Basarab Nicolescu and others in the 1994 *Charter of Transdisciplinarity*. Its sociological counterpart is the \"Mode 2\" knowledge production proposed by Michael Gibbons and colleagues in 1994—knowledge produced in the context of application, with heterogeneous participants, and reflexive—as distinct from Mode 1, driven by the internal logic of a discipline (Grade B, Gibbons et al., *The New Production of Knowledge*, Sage, 1994).\n>\n> **Buddhist AI is Mode 2, and must be transdisciplinary.** (Judgment) The reason: the correctness of its outputs cannot be adjudicated by any single discipline. Whether a retrieval system is \"accurate\" concerns engineering metrics and also whether sense-divisions are correct; whether a translation workbench is \"usable\" concerns model performance and also whether translators are willing to use it. Such judgments can be made only in a context of multi-party participation.\n>\n> **Which disciplines are required.**\n>\n> | Discipline | Contribution | Where it sits in Buddhist AI |\n> |---|---|---|\n> | Buddhist studies / religious studies | Doctrine, school distinctions, hermeneutic tradition | Ontology design, sense discrimination, school stratification, doctrinal adjudication |\n> | Philology / textual criticism | Edition genealogy, variant readings, punctuation, textual reconstruction | Authoritative text layer, version control, training-data cleaning |\n> | Library and information science | Metadata, knowledge organization, classification | Metadata layer, retrieval systems, long-term preservation |\n> | Computational linguistics / NLP | Segmentation, embeddings, sequence labelling, translation models | Semantic layer, machine translation, entity recognition |\n> | Computer science / AI | Models, retrieval architecture, systems engineering | AI layer, RAG, performance and safety |\n> | Translation studies / terminology | Translation theory, terminology standards, quality assessment | Terminology layer, translation workflow, graded labelling |\n> | Ethics / philosophy of technology | Value analysis, responsibility attribution, governance frameworks | Ethics committee, risk tiering, data boundaries |\n> | Cognitive science / neuroscience | Meditation research, consciousness studies, experimental design | Effect evaluation and risk identification for practice support |\n> | Anthropology / sociology | Community, authority, ritual, digital practice | Transmission and reception studies, user research |\n> | Law / public policy | Data governance, religious regulation, intellectual property | Compliance, cross-border data, licensing |\n> | Education | Curriculum design, learning science, assessment | Buddhist education products, monastic training |\n> | Design / human–computer interaction | Interface, usability, accessibility | Tools for monastic and scholarly users |\n>\n> The position of each discipline in Buddhist AI is shown in Figure 8. Of these, **Buddhist studies, philology, computational linguistics, and translation studies are irreplaceable**—absent any one of them, the correctness of the output cannot be guaranteed. The rest are important but may be introduced in stages. (Judgment)\n>\n> **Three typical interface failures.**\n>\n> | Failure type | Manifestation | Stage of exposure | Structural remedy |\n> |---|---|---|---|\n> | Terminological mismatch | Engineers understand \"segmentation\" in the sense of general NLP, Buddhist scholars understand \"passage\" in the sense of textual outline—the former cutting at the statistically optimal point, the latter at the doctrinally complete one; both say \"segmentation\" while meaning different things | Rarely visible at the requirements stage; surfaces at annotation, when rework is most expensive | Terminology frozen in written definitions |\n> | Objective mismatch | The technical team optimizes \"accuracy,\" meaning an average; the Buddhist team wants \"no errors,\" meaning a floor. These are not mathematically the same objective—raising accuracy from 95 to 97 percent may simultaneously raise the rate of a certain class of serious error | At evaluation | Objectives expressed as tiered metrics rather than a single average |\n> | Authority mismatch | Who has the right to determine whether a passage belongs to Tiantai or Huayan? Not the engineer, not the algorithm, and not necessarily a general Buddhist scholar | At annotation and output | School adjudication vested in a named scholar-monastic |\n>\n> **On religious texts, the mean is not the appropriate objective function.** (Judgment · argument / basis: the mathematical argument in this passage—an average and a floor are not the same objective)\n>\n> None of the three can be solved by \"more communication.\" They require **structural** mechanisms: terminology frozen in written definitions; objectives expressed as tiered metrics rather than a single average; and school adjudication vested in a named scholar-monastic.\n>\n> **The place of practitioners.** The key feature of transdisciplinarity is that **practitioners are not the object of study but co-participants in the production of knowledge.** Those involved in Buddhist AI include at least: the sangha (where authority over precepts and doctrine resides); translators (the actual users of a translation workflow); meditation instructors (those who judge risk in practice support); temple administrators (who actually handle governance and data); and Buddhist college teachers (who actually write textbooks and curricula). The implication is concrete: a translation workbench not used daily by translators will not fit their work; a terminology database without monastic participation in review will not match how the community actually renders terms; a practice-support system without meditation instructors in the risk assessment will not fit practice. **An AI designed by engineers alone, with monastics invited afterwards to \"try it and give feedback,\" is not transdisciplinary. It is external.** (Judgment)\n>\n> **An auditable indicator.** Hence a specific proposal: **every Buddhist AI project should disclose its disciplinary composition and the mode of practitioner participation**—the disciplinary backgrounds of members; the capacity in which practitioners participate (adviser, co-designer, daily user, holder of veto); who holds responsibility for school adjudication; who carries out ethical review. The reason: **the quality bottleneck in Buddhist AI lies neither in algorithms nor in corpora but in the institutionalization of disciplinary interfaces and practitioner participation.** (Judgment) Algorithms can be procured and corpora accumulated; interfaces and institutions can only be built. And what can only be built can also be inspected—public disclosure is the first step of inspection.\n\n---\n\n## 结语\n\n本文所论，可归纳为六项判断。以下逐项列出，并注明各判断在本文中的依据所在。\n\n**其一，佛教数字化面临的障碍，主要不在算法，而在数据；数据层面的障碍又主要不在技术，而在组织形态。**（第一章、第四章）三个传统比较的结果显示：藏传有单一主导机构与稳定资助，故可作十年之规划；汉传则机构分散、资源分散、标准不一，各处虽皆有实务，彼此却不相通。这一格局若不变，单纯增加技术投入的效果将十分有限。\n\n**其二，AI 在佛学研究中的作用是增益，而非替代。**（第三章、第五章）语义检索、文本复用检测与知识图谱均能显著拓展研究者的发现能力，但它们所发现的是「关联」，不能判定「意义」；宗派教义的判定、思想史的因果、文本的思想分量，仍须由受过专门训练的人承担。\n\n**其三，佛学 AI 的合格线应由可核验的准确性划定，不能由文本的感染力划定。**（第六章、第十四章）本文提出的十项评测——原典准确率、出处准确率、版本识别率、宗派区分率、引文完整率、翻译准确率、幻觉率、可追溯率、专家一致率、多语一致率——没有一项是「回答是否听来有智慧」。这不是疏漏，而是一种立场。\n\n**其四，AI 可以辅助「学」，不能替代「修」；其实质性伦理风险不在机器有无灵魂，而在人将权威让渡于算法。**（第十章、第十一章）历代祖师的权威建立在戒定慧的长期实践与僧团共同体的印可之上；这份权威无法转录为参数，也不应被模拟为一个可随时提问的对象。\n\n**其五，最具突破价值的基础设施是翻译；而 AI 令初译成本下降、审校成本上升。**（第八章）这一判断对僧伽教育的含义甚为具体：若十年后佛典翻译的瓶颈在审校，则今日开始的人才培养，方向应为培养能审校之人。\n\n**其六，佛教 AI 的质量瓶颈不在算法，也不在语料，而在学科接口与实践者参与的制度化程度。**（第十六章）佛教 AI 属于模式二的知识生产，其成果的正确性无法由任何单一学科判定；由工程师独立完成、再请法师试用并反馈的项目，不属超学科，而是外部的。\n\n以上六项，前两项关乎方向，中间两项关乎边界，后两项关乎方法。**概括而言，新技术对佛教的实际贡献，在于提升佛教文献与教法在保存、检索、理解与传播各环节上的准确性；至于代替佛教自身作出教义性的表述，则超出技术所能承担的范围。**（判断·总结／依据：全文 16 章之论述）\n\n尚须重申：本文为进行中调研之中期成果，上述各项判断均可能随材料与案例的补入而修订。其未竟之处与后续方向，见卷首声明与附录二第六节。\n\n> **EN对应 · Conclusion**\n>\n> The argument of this report may be reduced to six judgments. They are set out below, each with a reference to the place in this study where it is argued.\n>\n> **First, the obstacles facing Buddhist digitization lie chiefly not in algorithms but in data; and the obstacles at the level of data lie chiefly not in technology but in organizational form.** (Chapters One and Four) The comparison of the three traditions shows that Tibetan Buddhism has a single dominant institution and stable funding and can therefore plan a decade ahead, whereas Chinese Buddhism has dispersed institutions, dispersed resources, and non-uniform standards, so that each party has its own practice while none connects with the others. Unless this pattern changes, simply increasing technical investment will accomplish little.\n>\n> **Second, AI's role in Buddhist scholarship is amplification, not replacement.** (Chapters Three and Five) Semantic search, textual reuse detection, and knowledge graphs all substantially extend the researcher's capacity for discovery, but what they discover is **relations**, not meaning; doctrinal adjudication, causal explanation in intellectual history, and the intellectual weight of a text must still be borne by those with specialized training.\n>\n> **Third, the pass mark for Buddhist AI should be set by verifiable accuracy, not by rhetorical appeal.** (Chapters Six and Fourteen) Of the ten metrics proposed here—canonical accuracy, source accuracy, edition recognition, school discrimination, quotation completeness, translation accuracy, hallucination rate, traceability, expert agreement, and multilingual consistency—not one is \"whether the answer sounds wise.\" That is not an omission but a position.\n>\n> **Fourth, AI can assist study but cannot replace practice; and its substantive ethical risk lies not in whether a machine has a soul but in whether a person cedes authority to an algorithm.** (Chapters Ten and Eleven) The authority of the patriarchs rests on long practice in precepts, concentration, and wisdom and on the sanction of the monastic community; it cannot be transcribed into parameters, nor should it be simulated as an object one may question at will.\n>\n> **Fifth, the infrastructure most worth breaking through is translation; and AI lowers the cost of first drafts while raising the cost of review.** (Chapter Eight) The implication for monastic education is concrete: if in ten years the bottleneck is review, the training begun today should aim at producing reviewers.\n>\n> **Sixth, the quality bottleneck in Buddhist AI lies neither in algorithms nor in corpora but in the institutionalization of disciplinary interfaces and practitioner participation.** (Chapter Sixteen) Buddhist AI is Mode 2 knowledge production, and the correctness of its outputs cannot be adjudicated by any single discipline; a project designed by engineers alone and then shown to monastics for trial and feedback is not transdisciplinary but external.\n>\n> Of the six, the first two concern direction, the two in the middle concern boundaries, and the last two concern method. **In sum, the actual contribution of new technology to Buddhism lies in raising the accuracy with which Buddhist texts and teachings are preserved, retrieved, understood, and transmitted; to make doctrinal statements in Buddhism's place lies beyond what technology can undertake.** (Judgment · synthesis / basis: the argument of all sixteen chapters)\n>\n> It should be reiterated that this article is the interim result of an inquiry in progress, and that all the judgments above may be revised as further materials and cases are incorporated. Its outstanding work and future directions are set out in the notice at the head of this article and in Section 6 of Appendix Two.\n>\n---\n\n## 附录一　项目生态与路线细节\n\n| 项目 | 主办／性质 | 定位 | 关键数据（含口径说明） |\n|------|-----------|------|----------------------|\n| **CBETA** | 中华电子佛典协会／台湾。1998年由中华佛学研究所支持成立，2023年法人化（法鼓山佛教基金会捐资13,000,000为最大捐助者） | 汉文大藏经数字化主干 | 4,899部、22,150卷、逾 2.28 亿字（2026.R2）。TEI/XML 结构化 |\n| **DILA iSearch** | 法鼓文理学院 | 多档案综合检索 | 「超过 1.6 亿字符」「十多个佛教数字档案」（平台自述） |\n| **SAT** | 东京大学 | 《大正藏》数字文本与页面影像结合 | 2012年版本起提供原书页面影像，可定位到行 |\n| **BDRC / BUDA** | 佛教数字资源中心 | 佛教数字底座，先建数据后做 AI | 「超过 1,700 万页」（自述）；另有「59,000余册、30,000,000余幅图像」口径。2025年3月14日发布藏文 OCR 桌面工具（免费开源、可批量）。2026年2月28日公告开放 AI 数据集计划 |\n| **Dharmamitra / MITRA** | UC Berkeley BAIR，Keutzer＋Nehrdich，2023年4月创 irrors the Chinese section above; entries and figures are identical. Key items: CBETA — 4,899 titles, 22,150 fascicles, over 228 million characters, 2026 R2, TEI/XML. DILA iSearch — \"over 160 million characters,\" \"10+ Buddhist digital archives\" (self-reported). SAT — University of Tokyo; page images available since the 2012 version, locatable to the line. BDRC/BUDA — \"over 17 million pages\" (self-reported), with a separate \"over 59,000 volumes, over 30 million images\" figure; Tibetan OCR desktop tool released 14 March 2025; open AI dataset initiative announced 28 February 2026. Dharmamitra/MITRA — UC Berkeley BAIR, founded April 2023; MITRA-zh paper at NLP4DH 2023 (ACL Anthology 2023.nlp4dh-1.29); the Hugging Face model's own card notes named-entity problems and a tendency to hallucinate. 84000 — AI position paper quoted in Chapter Eight. Foguang Shan \"Humanistic Cloud\" — announced 3 February 2025. Vurbo.ai — released 18 April 2025 in Austin, integrating 10,000 terms. Lingyin Temple / Rushi Fodian — Hangzhou Yunlin Digital Buddhist Canon Research Institute inaugurated May 2026. Dharma Drum Digital Classics — spring results presentation 20 May 2026, six-step knowledge graph, 614 citation records. Buddharoid — Kyoto University IFOHS with Terraverse/XNOVA, unveiled 24 February 2026 at Chion-in, Unitree G1 with BuddhaBot Plus; \"assisting funeral services\" has no basis, and the Kōdai-ji android Kannon \"Minder\" (Ishiguro, Osaka University, 2019) is a different project. Shinran Bot / Vasubandhu Bot — released September 2023. Fojin — personal open-source project, 344 stars, Apache-2.0, created 10 March 2026; self-reported figures internally inconsistent. DeerPark AI — SUPERMIND PTE. LTD. (Singapore), domain deerpark.ai. bodhiai.cn — expired TLS certificate, inaccessible. NORBU — 2024. OpenPecha — founded 2019 by BDRC and Esukhia.)*\n>\n> *Roadmap detail (expanding Chapter Fourteen): the 2026–2027 priorities are coordination among CBETA, DILA, and SAT; authoritative canonical data standards; knowledge graphs of persons, temples, and lineages; a multilingual Buddhist terminology database; edition and citation standards; high-quality OCR; multilingual parallel corpora; and professional RAG. The 2028–2030 stage covers AI research assistants, AI translation workbenches, multilingual intelligent retrieval, scholarly literature agents, Buddhist knowledge graphs, personal Buddhist knowledge bases, AI course assistants, automatic multilingual subtitling, AI digital museums, and a global Buddhist knowledge portal. The 2031–2035 stage covers multimodal Buddhist AI, lifelong personal study-mentor systems, AI-and-VR Buddhist education, automatic adaptation of multilingual courses, cross-traditional comparative research agents, virtual reconstruction of Buddhist history, personalized learning paths, and an international Buddhist knowledge network.*\n\n---\n\n## 附录二　本研究之局限与待核登记\n\n依「边界自知·局限留档」之例，将本研究所受之限制、未能核实之项目、以及建议后续进行之工作，逐条登记于此。\n\n### 一、语种限制\n\n本文主要依据中文与英文材料。**日文、韩文的一手材料未能系统检索**，而日本佛教在学术化与数字化方面积累甚深——SAT 数据库由东京大学运营，BDK 英译大藏经由日本佛教传道协会推进，日本学界在佛典信息化上的会议论文与内部报告数量可观。韩国佛教的数字化状况同样未能展开。此为本研究最大的结构性缺口。\n\n欧洲方面，法文、德文、西班牙文学界在佛教数字人文上的成果，本文亦未系统检索。\n\n### 二、实证研究之普遍不足\n\n此为本领域之共同状况，非本文独有。所涉研究多数仍为概念性、探索性工作：AI 与宗教之系统性综述所检视者为文献，而非实验；VR 正念干预之综述虽纳入22 项研究，然其方法、对象与干预方式差异极大；正念神经反馈之研究则普遍缺少充分的假神经反馈对照。**至于佛教 AI 之用户研究、效果评估与长期追踪，目前基本没有。**\n\n本文凡涉及效果的地方，都标明了证据强度；读者不应把「有研究表明」理解为「已获确证」。\n\n### 三、待核项登记\n\n| 项目 | 状况 |\n|------|------|\n| BDK 完成度「约65%」 | 同一数字出现于 2017 与 2019 两版丛书前言。系沿用旧文还是进度停滞，未能核实 |\n| bodhiai.cn | 站点 TLS 证书已过期，无法访问；仅见一篇 MDPI《Religions》论文提及，且易与印度同名 EdTech 公司 BodhiAI（bodhiai.co.in）混淆 |\n| Fojin 项目之各项数字 | 嵌入、实体、关系、传承链、UI 语言数、词典部数，均为项目自述，且 README 内部自相矛盾（词典 32 部与 39 部两说并存） |\n| Buddharoid 之「辅助主持告别式」 | 无据。京都大学官方仅表述为宗教仪式辅助之未来设想 |\n| 「佛光大辞典英译项目中的 AI 专题小组」 | 无此编组名。可证者为 2024 年 4 月 23 日 Nehrdich 于佛光山东禅楼主讲「佛典翻譯與AI應用」 |\n| 2026年 BDRC 开放数据集计划之最终规模 | 现仅有公告后两月之进度，长期成果待观察 |\n| 各佛教 AI 项目之准确率声明 | 除 Dharmamitra 模型卡主动说明其命名实体问题与幻觉倾向外，其余项目之准确率多为自述，无第三方评测 |\n\n### 四、方法上之警示\n\n本文在核查中得出一条经验，值得记录：**判断一篇引用之真伪，只认逐条访问之结果，不认编号之直觉。** 核查中曾有数篇 arXiv 论文因编号形式罕见而被预先怀疑为伪造，逐条访问后证实全部真实；相反，真正的问题出在数篇真论文被挂到其并不支持的论断上——此类错误在通读时看不出任何异常。\n\n### 五、建议优先进行之工作\n\n1. **全球佛教 AI 项目之公开评测基准**。目前各项目自述准确率，无从横向比较。建立一套公共评测集与评测协议，是使「可信佛学 AI」从口号变为可检查指标的前提。\n2. **英译覆盖率之按页审计**。把 BDK 的「65%」变成可审计的指标。\n3. **佛教 AI 之用户研究**。僧团、学者、译师、一般信众如何使用此类工具、在哪里失去信任、在什么条件下愿意长期使用，目前几乎无数据。\n4. **各传统数字化程度之横向调查**。本文所作之三传统比较，依据为公开材料与项目自述；一次系统的、以统一口径进行的机构调查，将使这一比较获得更坚实的基础。\n\n### 六、本研究之未竟与后续方向\n\n本文为进行中之调研之中期成果。以下列出尚未完成、将于后续补入者，以明本文之边界与后续之方向。\n\n| 层面 | 未竟事项 | 后续安排 |\n|---|---|---|\n| 语种 | 日文、韩文、越南文之一手材料；法文、德文、西班牙文学界成果 | 系统检索日本 SAT／BDK、韩国佛教数字化与欧洲佛教数字人文之会议论文与项目报告 |\n| 地域 | 马来西亚、印尼、泰国、越南汉传社群之分口径数据；欧洲汉传所占比例；海外汉传僧人总数 | 依托各国普查与教团年报，建立可比口径 |\n| 实证 | 各项目准确率之第三方评测；佛教 AI 之用户研究与效果评估 | 待公共评测基准建立后逐步补入 |\n| 案例 | 项目生态之未及考察者；各项目之长期进展 | 持续跟踪，随版本更新 |\n| 方法 | 佛教 AI 评测基准、多语术语层标准、英译覆盖率指标 | 已列入第十四章路线，见附录一 |\n\n**凡后续补入者，皆循本文既有之信源分级与判断标注体例；凡一时不能确证者，仍标〔待核〕，不以推测填补。**\n>\n> **EN对应 · Appendix Two, Section 6: What Remains Unfinished, and Where the Inquiry Goes Next**\n>\n> This article is an interim result of an inquiry in progress. The following lists what is not yet done and will be incorporated later, so that the boundaries of this study and its future direction are clear.\n>\n> | Level | Outstanding | Next step |\n> |---|---|---|\n> | Languages | Primary materials in Japanese, Korean, and Vietnamese; scholarship in French, German, and Spanish | Systematic search of conference papers and project reports from Japan (SAT, BDK), Korean Buddhist digitization, and European Buddhist digital humanities |\n> | Regions | Disaggregated data on Chinese Buddhist communities in Malaysia, Indonesia, Thailand, and Vietnam; the Chinese Buddhist share in Europe; the total number of overseas Chinese Buddhist monastics | Build comparable definitions from national censuses and order annual reports |\n> | Empirical | Third-party evaluation of project accuracy claims; user studies and effect evaluations of Buddhist AI | To be incorporated once a public evaluation benchmark exists |\n> | Cases | Projects not yet surveyed; the long-term progress of each | Ongoing tracking, updated by version |\n> | Method | The Buddhist AI evaluation benchmark, the multilingual terminology standard, and the English translation coverage metric | Already placed on the roadmap in Chapter Fourteen; see Appendix One |\n>\n> **Everything subsequently incorporated will follow this article's existing source grading and judgment annotation; whatever cannot yet be confirmed will remain marked 〔pending verification〕, and will not be filled in with conjecture.**\n>\n> **EN对应 · Appendix Two: Limitations of This Study and Items Pending Verification**\n>\n> **1. Language limitations.** This study draws mainly on Chinese- and English-language materials. **Primary sources in Japanese and Korean were not systematically searched**, and Japanese Buddhism has deep accumulations in both scholarship and digitization—the SAT database is run by the University of Tokyo, the BDK English Tripiṭaka by the Japanese Society for the Promotion of Buddhism, and Japanese scholarship has produced a substantial body of conference papers and internal reports on Buddhist informatization. The state of Korean Buddhist digitization is likewise undeveloped here. This is the largest structural gap in the study. Materials in French, German, and Spanish on Buddhist digital humanities were also not systematically searched.\n>\n> **2. A general insufficiency of empirical research.** This is a condition of the field, not peculiar to this study. Most of the research concerned remains conceptual and exploratory: the systematic review of AI and religion examined literature, not experiments; the review of VR mindfulness interventions included twenty-two studies whose methods, populations, and interventions vary widely; and research on mindfulness-based neurofeedback generally lacks adequate sham-neurofeedback controls. **As for user studies, effect evaluations, and longitudinal tracking of Buddhist AI, there is at present essentially none.** Wherever this study makes a claim about effects, the strength of the evidence is marked; readers should not take \"research suggests\" to mean \"established.\"\n>\n> **3. Items pending verification.**\n>\n> | Item | Status |\n> |---|---|\n> | BDK completion \"about 65 percent\" | The same figure appears in the 2017 and 2019 prefaces. Whether this is a carried-over text or a genuine plateau could not be verified |\n> | bodhiai.cn | Site's TLS certificate expired; inaccessible. Mentioned in only one MDPI *Religions* paper, and easily confused with the Indian EdTech company BodhiAI (bodhiai.co.in) |\n> | Fojin project figures | Embeddings, entities, relations, lineage links, UI languages, dictionary volumes—all self-reported, and internally contradictory in the README (dictionary given as both 32 and 39 volumes) |\n> | Buddharoid \"assisting funeral services\" | No basis. Kyoto University's official statement describes ritual assistance only as a future scenario |\n> | \"The AI working group of the Foguang Dictionary translation project\" | No such working group exists. What is verifiable is Nehrdich's 23 April 2024 lecture at Foguang Shan's Dongchan Tower on \"Buddhist Translation and AI Applications\" |\n> | Final scale of BDRC's 2026 open dataset initiative | Only two months of progress are available; long-term results remain to be seen |\n> | Accuracy claims of Buddhist AI projects | Apart from the Dharmamitra model card, which itself states its named-entity problems and tendency to hallucinate, accuracy claims are mostly self-reported with no third-party evaluation |\n>\n> **4. A methodological warning.** One lesson from verification is worth recording: **whether a citation is genuine is decided by visiting it, never by trusting the look of its identifier.** Several arXiv papers were suspected in advance of being fabricated because of their unusual numbering; visited one by one, all proved genuine. The actual problems lay instead with several genuine papers attached to claims they do not support—an error that looks entirely normal on a reading pass.\n>\n> **5. Work that should be done first.** (1) **A public evaluation benchmark for Buddhist AI projects worldwide**—at present each project self-reports its accuracy with no basis for horizontal comparison; a common evaluation set and protocol is the precondition for turning \"trustworthy Buddhist AI\" from a slogan into a checkable metric. (2) **A page-by-page audit of English translation coverage**, turning BDK's \"65 percent\" into an auditable metric. (3) **User research on Buddhist AI**: how the sangha, scholars, translators, and ordinary adherents use such tools, where they lose trust, and under what conditions they will use them long term—for which there is almost no data. (4) **A cross-traditional survey of digitization levels**, conducted systematically and on uniform definitions; the three-tradition comparison attempted here rests on public materials and project self-descriptions, and a proper institutional survey would give it firmer ground.\n\n---\n\n## 附录三　判断与依据对照表\n\n本文凡标「（判断）」之处，均逐一注明类型与依据。正文中已随句标注，此处汇总，以便读者逐条检查。**凡无文献可据者，本表如实注明「无文献可据」或「属推测」，不以含糊之词掩饰。**\n\n### 一、有文献依据之判断\n\n| # | 类型 | 判断 | 依据 |\n|---|---|---|---|\n| 1 | 评估 |  | 本章三传统比较所举机构、资金、语料三项对照 |\n| 2 | 评估 |  | 第一章 CBETA 与 BDRC 之组织形态差异、第四章九项技术之瓶颈分布 |\n| 3 | 推论 |  | 同段所举通用模型能力提升与自建模型折旧两项条件 |\n| 4 | 评估 |  | 本章九项技术逐项评估中瓶颈之分布 |\n| 5 | 主张 |  | 同段所述汉传译经史多译并存之事实 |\n| 6 | 推论 |  | Dharmamitra 模型卡自述之命名实体与幻觉问题、Wei 2024 之人工评价结果 |\n| 7 | 主张 |  | 第二十一章第四层风险分级 |\n| 8 | 评估 |  | 第十章所列权威幻觉、拟人化、依赖、教义扁平化、数据隐私五项风险 |\n| 9 | 评估 |  | 本段所立「能否带来既有框架所无之维度」之检验标准 |\n| 10 | 评估 |  | Hariyanto 等 2026 五项维度之逐项对照 |\n| 11 | 推论 |  | Treves 等 2024 指出该领域缺少假神经反馈对照 |\n| 12 | 推论 |  | 第一章组织形态比较、第四章技术瓶颈分布 |\n| 13 | 推论 |  | Gibbons 等 1994 模式二之定义、Nicolescu 1994 超学科之定义 |\n| 14 | 推论 |  | 本节超学科之定义——实践者为共同参与者而非研究对象 |\n| 15 | 推论 |  | 本章三种接口失败之分析 |\n| 16 | 总结 |  | 全文 16 章之论述 |\n| 17 | 论证 | 在
