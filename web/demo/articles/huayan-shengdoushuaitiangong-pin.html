<script>
var ARTICLE = {"id": "huayan-shengdoushuaitiangong-pin", "file": "articles/huayan-shengdoushuaitiangong-pin.html", "title": "九九华严第二十三品 升兜率天宫品之拼读", "title_sub": "第五会首品·卷二十二～二十三·品文8473·不离而升第三叠·知足天宫纯过渡品（无说法正文）·六十 CBETA head 〈如來昇兜率天宮一切寶殿品第十九〉全称勘定·体量比101%（十三对中六十不缩反增罕见例）·摩尼藏/如意宝藏同物两译·藏译无平行章（n23→n24→n26）·李通玄迴向膝义窗·道霈敷座表法窗·L.328成篇·L.348深化", "icon": "⛩️", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第五会_兜率天宫_回向位/华严经细读_第二十三部_升兜率天宫品.md", "doc_md": "# 华严经细读·第二十三部《升兜率天宫品》之拼读\n\n> **EN · The Chapter on Rising to the Tushita Heaven**\n\n> **底本**：八十华严 `T10n0279`。**范围：卷第二十二～二十三（昇兜率天宮品第二十三·本品全文）**。本品属**第五会「兜率天宫会」·回向位**。\n\n---\n\n## 〇、凡例\n\n一、底本 `T10n0279`。二、引文程序注入（0 手抄·逐字回源）。三、存疑标〔待核〕推断标〔本文判断〕。四、体量自陈：**全文成篇**（L.328 缺口填实批）。\n\n<!-- ATLAS:BEGIN P23a -->\n### 〇之零、导读指南（阅读路径与方法）\n\n**定位：** 考证型细读（philological close reading），以「可复核性」为第一优先。8,473 CJK纯过渡品——第三次「不离而升」（品13→19→23），无正说法；兜率义「知足」——升而不离，知足无言。\n**本品一句：** **不离菩提树下及须弥山顶……而向于彼兜率天宫**——升非迁替，知足而后能回向。\n**路径：** 〇之二（二图四表）→ 一（品题与脉络）→ 二（全文逐段）→ 四（义理与名相）→ 五（诸家会读）→ 七（数据层）→ 附录按需查阅。\n**方法：** 先经文后诠释；〔实测〕／〔本文判断〕／〔存疑待核〕三分；负面证据同样入账；结构覆盖 100%，个体择要。\n**读前三问：** ①三叠何义？②知足何以为回向基？③纯过渡空白何义？\n\n## 〇之二、本品内容地图（未入其门，先观其海）\n\n> **本节体例。** 图与表之数据，一律取自本文已回源核定之 §二逐段表与 §7.1／§7.5 实测数；**凡属推断者标〔本文判断〕，不入图**。图各看一事，勿求一图而尽本品。\n\n### 〇之二.0 提要\n\n8,473 CJK／37p＋1lg；纯过渡品（无正说法）。\n\n| 图 | 画什么 | 一句话 |\n|---|---|---|\n| **图 〇-1　三会升而不离图** | 品13→19→23 | 忉利→夜摩→兜率，前处不离 |\n| **图 〇-2　过渡品定位图** | 无正说·仪式铺路 | 藏→升→偈赞→回向 |\n\n**〔读法之序〕**　观图〇-1得叠（三会升不离），读§2全引，末§7核量。\n\n> **EN corresponding · Map of the Chapter.** The third rising-while-not-leaving: to Tushita (Contentment) without leaving the bodhi site. Purely transitional.\n\n### 〇之二.1 图 〇-1　三会升而不离图\n\n<figure>\n<svg viewBox=\"0 0 1000 200\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"26\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#7a5a28\">三会升而不离（品13→19→23）</text>\n<ellipse cx=\"200\" cy=\"130\" rx=\"140\" ry=\"50\" fill=\"#f6efe1\" stroke=\"#b8863c\"/><text x=\"200\" y=\"130\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7a5a28\">菩提场+忉利（品13）</text>\n<ellipse cx=\"470\" cy=\"110\" rx=\"170\" ry=\"70\" fill=\"none\" stroke=\"#d4a03c\" stroke-dasharray=\"5,3\"/><text x=\"470\" y=\"110\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7a5a28\">+夜摩（品19）</text>\n<ellipse cx=\"750\" cy=\"90\" rx=\"200\" ry=\"85\" fill=\"none\" stroke=\"#b8863c\" stroke-width=\"1.5\"/><text x=\"750\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7a5a28\">+兜率·知足（品23）</text>\n<text x=\"500\" y=\"186\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5a5147\">后一环含前环——升非搬家而是扩灯</text></svg>\n<figcaption><b>图 〇-1　三会升而不离图。</b>三叠图。<div class=\"en-line\">Fig. 0-1. Three nested circles of rising.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. 看嵌套：后含前。\n2. 品23无说法：空白即义。\n3. 兜率＝知足。\n\n### 〇之二.2 图 〇-2　过渡品定位图\n\n<figure>\n<svg viewBox=\"0 0 1000 180\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"26\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#7a5a28\">过渡品定位</text>\n<rect x=\"80\" y=\"60\" width=\"220\" height=\"70\" rx=\"8\" fill=\"#f6efe1\" stroke=\"#b8863c\"/><text x=\"190\" y=\"90\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#7a5a28\">品22 十无尽藏</text>\n<rect x=\"390\" y=\"60\" width=\"220\" height=\"70\" rx=\"8\" fill=\"none\" stroke=\"#c46b5d\" stroke-width=\"2\"/><text x=\"500\" y=\"90\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#c46b5d\">品23 升兜率 ←纯过渡</text>\n<rect x=\"700\" y=\"60\" width=\"220\" height=\"70\" rx=\"8\" fill=\"none\" stroke=\"#d4a03c\" stroke-dasharray=\"5,3\"/><text x=\"810\" y=\"90\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#7a5a28\">品24偈赞→品25回向</text>\n<text x=\"500\" y=\"166\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5147\">知足无言——空白即义理</text></svg>\n<figcaption><b>图 〇-2　过渡品定位图。</b>过渡品定位。<div class=\"en-line\">Fig. 0-2. Position of the transitional chapter.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. 对比：藏有说·本品无·回向有。\n2. 知足义解。\n3. 不更求而后能回。\n\n### 〇之二.3 本品在第五会（兜率天宫·回向位）之坐标\n\n第五会之首（品23→24→25）：承品22藏之体，启品24/25之用。\n\n| 品 | 卷 | 位／科 | 一句提撕 | 与本品之关系 |\n|---|---|---|---|---|\n| 十無盡藏品（品22） | 卷二十二 | 第四会末 | 藏之体 | 本品流出之基 |\n| 兜率宮中偈讚品（品24） | 卷二十三 | 第五会 | 金刚幢等 | 本品后继 |\n| 十回向品（品25） | 卷二十三起 | 第五会正说 | 金刚幢说十回向 | 目的地 |\n\n### 〇之二.4 本品形式特征（与邻品对看）\n\n纯过渡。\n\n| 特征 | 本品表现〔实测〕 | 邻品之对照 | 读法上的后果 |\n|---|---|---|---|\n| 篇幅 | 8,473 CJK／37p＋1lg | 品19的782 | 约10倍 |\n| 正说法 | 无 | 品19有十菩萨偈 | 九会仅本品无正说 |\n\n### 〇之二.5 五种读法（导览）\n\n| 读法 | 路径 | 适合谁 | 得什么 |\n|---|---|---|---|\n| 三叠读法 | 图〇-1 | 结构读者 | 升而不离 |\n| 空白读法 | §4 | 义理读者 | 无说即说 |\n| 知足读法 | §4 | 实修读者 | 不更求 |\n| 对读法 | §6.3 | 版本学读者 | 六十增自在 |\n| 数据读法 | §7 | 数据读者 | 8,473 |\n\n### 〇之二.6 数与位之谱：本品之数，四等分录\n\n华严之数非计数之数。本品所涉之数，来源不一，性质亦不一；**先分其等，后论其义**，则不为数目所惑。\n\n| 等第 | 数 | 出处 | 性质 |\n|---|---|---|---|\n| **T0经文** | 全引 | §2 |  |\n| **T0实测** | 8,473 CJK | §7 |  |\n| **T1注疏** | 来意窗 | §5.1 |  |\n| **T0·六十** | 〈佛昇兜率自在品〉 | §6 | 对读未竟 |\n\n> 【读法】以「升」为性——读时问前两处的什么被含入了。\n\n\n<!-- ATLAS:END P23a -->\n\n## 一、概述与品题解义\n\n**品名**：**昇兜率天宮品第二十三**。说主：**佛**（神力并发）＋功德林菩萨等说偈。**实测**：品文净 **8,473 CJK**，37 `<p>`＋1 `<lg>`。\n\n**【定位】**第四会→第五会过渡品——「不离菩提场及须弥山顶……而向于彼兜率天宫」复沓延续（与品13/19同构）；兜率天宫为**回向位**之道场：兜率＝「知足」，知足而回向，回向而无著。\n\n**【一句】****升而不离——知足天宫，回向无著。**\n\n## 二、本品全文注\n\n### 2.0′ 玄记体总纲（据澄观《华严经疏》`T1735`·L.370·疏文程序切片回源）\n\n**门目（疏文实录·至四釋文前）**：\n\n> 兜率天宮品升兜率天宮品\n>\n> 第二十三從二十二經至二十五經一半自下\n>\n> 第五會,明上賢十向。四門同前。初來意中,先會來者,正為答前迴向問故,迴前解行以向真證,廣益自他,令行彌綸無不周故。《菩薩大乘藏經》云「以少善根引無量果者,謂迴向心,以迴向心為大利故。」故行後明之。又前解行既著,今悲願彌博。\n>\n> 後品來者,前會既終將陳後說,先明說處表法故來。二釋名者,先會得名,亦有三義,同前二會。二釋品名,兜率是處,佛以法界之身不起而應,故名為升。處此說者,表位超勝,是次第故。又上下放逸,此天知足,表世間行滿故,居喜足之天。又以彼有一生補處,表菩提之心功行滿故。\n>\n> 又積功累勳,知階未足,迴勳授子乃知有餘。菩薩亦爾,勤苦積行未見有餘,迴向眾生乃知自足。又欲界六天,此居其中,表悲智均平,處於中故。又生此天而修三福,謂施、戒、定,自餘不具、偏多不均,故處此說也。\n>\n> 第三宗趣者,會以十向大願為宗,得地為趣。品以升天赴感為宗,說向為趣。第\n\n**释文**（疏文实录）：\n\n四釋文。此會有三品經,初二當會由致、後一正說。所以無勝進者,由二義故:一以此會是三賢位終,攝前解行總為趣地方便,迴向當體自是勝進,是故無也。此經上下,其例有四:一約行滿入位之際,如〈賢首品〉,信滿總為入住方便。二約願滿入證之際,如此迴向初僧祇滿總為入地方便。三約功用滿,入無功用之際,如第八地初總攝前七地以為方便,此第二僧祇滿。四約因位成滿之際,如第十地初攝前九地為入方便,此約三僧祇滿處攝也。餘同位相接,即別有方便,故非一例。二方欲入地,必離進趣相,與無分別為方便故。就初二品,前一化主赴機、後品助化讚佛。今初品中,大分十段:一本會齊現、二不離而升、三見佛嚴處、四迎佛興供、五覩佛勝德、六請佛處殿、七如來受請、八天王獲益、九承力偈讚、十如來就坐。今初也。初言神力即是遍因,未必起神境通,但是修成心自在力。「十方」已下辨所現相,於中亦有化主、助化。望第四會,既加及須彌頂,此亦應云坐於樹下及須彌頂夜摩天宮,文無者略。以第二段中帶前升,後既全舉,前四則影,顯前四皆圓遍也。而演說者,亦通四會之所說也。第二「爾時」下明不離而升,謂前十方一切處四會皆儼然不散,而升此說,意明橫遍十方、豎該九會,佛法界身遍時處故。餘義具如第三會初。第三「時兜率」下見佛嚴處,中二:初明感應緣會;二「即於」已下正顯嚴處,於中分二,先明一方嚴處、後結通十方。今初。初雖標座,下列樓帳等皆兼處嚴。文分為二:初總顯體德、後「有百萬」下別明體用。今初,有十一句,初總、餘別。總中無盡大願隨意出生,悲智必俱生死無染,名摩尼藏。展行彌布,故有敷言。別有十種圓滿勝相,以斯妙座實德成故。初一自體相,以寶成故;次六因相,一深遠相、二勝妙相、三廣大相、四同體相、五具德相、六堅固相;後三總顯殊特,即座之德用,一端嚴故、二離染故、三無極故。二別明體用中,通有三百二種百萬億,廣上三段即為三別。初廣自體、次「有百萬億初發心」下廣前殊特、三「百萬億善根」下廣前因相。初一多明器世間嚴,後二顯眾生世間嚴,皆智正覺世間之力也。皆言百萬億者,位增十行之百萬故。初中,長分為十:前九色相嚴、後一音聲嚴,其一一嚴事皆即法門,可以意得。第一有十句座體嚴,於中初句辨座層級;後九覆座之嚴,雖四面行列執蓋亦為覆座。第二「樓閣」下十句,復於殿內建立樓閣繞座莊嚴,亦是嚴處,於中初句總、下九句別顯嚴閣。第三「寶鈴帳」下十句辨帳嚴,亦是繞座,前已辨覆故;若重辨者,帳上建樓、樓上覆帳,重重無盡耳。第四「妙寶華」下有十二句辨嚴座身。其頻婆帳應在寶華之前,類例穩便。亦可十二句辨帳,九句嚴座身。頻婆者,此云身影質,謂帳莊嚴具中現外質之影故。第五「因陀羅金剛寶」下有十七句,亦嚴座四周,皆明妙寶以為󰈧門及覆,亦嚴座體,以莊嚴其藏。是蓮華藏故,標中表法有異,住行不言蓮華,理實應有。或是座身之龕名藏。第六「真珠瓔珞」下十二句,瓔珞周垂嚴。「其摩尼身」下二句文似缺略,謂因陀羅妙色寶下無所結屬,又非下之香類,不可別為一段。第七「黑栴檀」下有十六句,以香為嚴。阿樓那者,此云紅赤色。第八「雨百萬」下二十句,雨雲為嚴。第九「建百萬」下四十八句,座外四面嚴。於中有四:初二十句,雜雜莊嚴,羅列座側。言樓閣延袤者,靜法云:「梵云蒲莫迦,此云帳輿。若是樓閣,應云微麼囊。既不爾者,譯之誤也。」此或應爾,前文已有樓閣故。若重辯者,亦無大失。寶悉底迦者,具云塞縛悉底迦,此云有樂,若見此相必獲安樂。其形如萬字,具於《音義》,今寶形似此。二「光明寶」下九句,光明嚴。言網覆者,若世之燈,以護夕蟲成隱映故。三「天寶衣」下九句,寶衣敷布嚴。四「天鈴幢」下十句,寶幢行列嚴。第十「天蠡出妙音」下,辨音聲嚴。於中二:初十句樂音嚴、後「悅意音」下二十句法音嚴。前中云牟陀羅者,此云鋒鼓,謂天樂初奏此鼓先作故。後法音嚴中,初十一句讚歎三寶、後「隨順音」下九句說法益物。大文第二廣前殊特者,前文略云見者無厭,亦已略明益相。今廣顯之,即座之德用。恭敬供養,復顯為嚴。文分為二:初明獲益、後申供養。前中有三十九句,曲分為四:初十約位辨益、二「得自在」下有十二句雜辨得益、三「得檀」下十句約行辨益、四「入一切佛剎」下七句約大用辨益。後三並通諸位,或可第二段明迴向、第三段明十行、第四段明十地。或唯約十住,通別無礙。二「諸天恭敬」下明供養,文分為五:初十七句雜明八部人天菩薩三業設敬,其中所作各隨類所宜。二「天女專心」下二十六句唯明諸天三業敬養。初之三句,即欲界天色究竟;後復言種種天者,或通無色,或總上諸類。善思惟天,亦通諸類。三「菩薩天」下有十二句。明菩薩事供養。四「諸天子從天宮出」下四句諸天身供養。五「思惟菩薩」下十句菩薩修法供養,亦明得益。菩薩多明得益、諸天但說供養者,諸天供養是益因故,諸天得益即菩薩故。第三「百萬億善根」下,廣前因深,十句可知。所以此會嚴事偏多者,一此天多以補處為王故。二賢位已極,大悲普周故。所以十住無菩薩嚴,表凡入位故;夜摩即有,已入位故,然亦未廣。而此勝相皆是如來海印所現法界差別自在實德,人法無礙、依正混融之嚴事也。第二「如此世界」下,結通十方,可知。第四「爾時」下迎佛興供。於中二:先將迎興供、二「爾時如來威神力」下見佛興供。前中二:初奉迎、二「以清淨」下興供。於中,先諸天興供。皆從身出者,非唯顯諸天福力,亦表身為供具,供自心生。後「兜率宮」下菩薩興供,可知。第二見佛興供中二,先諸天、後「百千億那由他先住」下明菩薩。前中三:初明承力見佛,一現佛神力、二宿善力、三法門力;二「同興」下慶遇奉迎;三「各以」下正明興供。於中三:初十句衣盛供以散佛,表修寂滅以趣果故。二「百千億」下十句明起心雨供嚴空,顯所修萬行稱法性空,空有無礙是嚴空義。三「百千億那由他阿僧祇天子」下九句雜申供養,表萬行雜修故。調順寂靜無放逸心,應分為二,則有十句。第二菩薩興供中二:先明行成依報供、後「其諸菩薩」下身出正報供。前中二十七句,文分為三:初十句多因成多果之供;次八句一因成一果供;後九句一因成多果供。應有四句,由多因成一果攝在初段,以多因能一一成故。又初段即一切中有一及一切中有一切,次段即一中一,後段即一中一切也。今初十句一時併舉多因,後通成諸供。出過諸天者,勝故多故。餘可知。第二一因一果中,皆因果相似。一蓋以障塵,若度能除敝。二帳以庇蔭,若悲為佛境;華以開敷,如覺解清淨。三法忍和悅,用嚴法身。四演教網則震金剛之妙音,觀教網則不礙文而見理。五香氣聞而不可見、見而不可攬,猶幻法見而不可取、取而不可得,知幻無堅以成堅法。六周遍法空,是佛智身所依之境,座之義也。七摧懈慢幢,樹法勝幢故。八諸法如夢,是佛棲託之所也。第三「無著」下一因多果供。無著無生但是一義,無生約理、無著約智,此二契合方成一因。文中九句,可知。第二身出正報供中,文有十句:初二明現身德量,謂一一量周法界、德齊佛故;次「以從」下三句明勝辯之因;次「具足」下四句顯勝辯所依;後「以不可」下一句正申辯讚,皆從總持辯藏之所流故,情動於中故形於言,言猶不足敬之至也。第五「爾時一切」下覩佛勝德中分二:先明覩佛身雲勝德、後「爾時如來大悲」下明現勝德意。前中分二:初覩佛勝德、後「爾時大眾咸見」下見佛光用。前通十眼所見,後約天眼所見。今初也。然此經文,次第具顯如來二十一種殊勝功德,以文言浩汗致古釋同迷。然〈離世間品〉雖具二十一句,而此文義兼廣,故隨便引於諸論。文分為三:初總觀如來、次別觀德相、三結成觀解。今初,略舉三德以顯一雄:一者如來;二言應者,即是應供;三正等覺,即正遍知。此一「應」字亦通屬下,隨應覺故。此即總句。〈離世間品〉名妙悟皆滿,《佛地》、《攝論》皆名最清淨覺。親光釋云「謂佛世尊普於一切有為無為所應覺境正開覺故。」此釋正義,揀異邪覺。又於一切所應覺境淨妙圓滿正開覺故,此釋最清淨義,亦明覺滿,揀異菩薩。又於一切如所有性、盡所有性正開覺故。此釋符今等字,謂雙照二諦平等覺故。亦是遍義,故云正遍知。彼經無正等言,此經缺最清淨。上〈妙嚴品〉則有最言,故云於一切法成最正覺。下離世間中復有妙悟,妙者微妙,離覺相故。悟覺及知,名異義同。妙正遍最名義俱別,所揀異故。若世親、無性不解總句,但以下別德成斯一覺,故清淨覺句句皆遍。第二「其身」下別觀德相。二十一德分二十段,後二合故。然《攝論》中二十一德通有三節:一先列經二十一句;二無著菩薩立功德名以為解釋三無性等,但釋論名以符經旨;今各句句配屬。其《佛地論》釋有同《攝論》、有異《攝論》,異者引之。今初,明不二現行,經也,即觀察如來一向無障礙轉功德。此是無著立名,他皆倣此。無性二釋:一云謂佛一向無障礙智,於一切事品類差別無著無疑故,非如聲聞等有處有障、有處無障二種。此約離所知障智德滿故,非如聲聞有處有障者,謂於極遠時方無邊差別諸佛法中有無智轉。第二釋云:或二處現行。此中無有如是所說二種現行,此釋二處亦前有障無障,但前釋約表為一智轉,此釋約遮故無彼二,正同下經二行永絕。世親同於後釋。親光云「凡夫二乘現行二障,世尊無故。凡夫現行生死起諸雜染,二乘現行涅槃棄利樂事,世尊無彼現行二事,故名不二現行。」無性生起云「云何而得此最勝覺?故次說此諸聲聞等,於所知境有二現行,所謂正智、不染無知。佛無此故。」文中分二:初廣顯利樂,明離所知故,不同二乘。二「住於」下結成所住,彰離煩惱不同凡夫。前中三:初明應廣順機令喜;二「普遍」下明其遍應,定慧莊嚴生物善根;三「示現」下彰應用深,雖超語言而無遺曲濟。二結成所住者,初句明智住法身,能住所住二俱廣大。下句心無煩惱,善根清淨,色相超倫,具上二義名清淨覺。他皆倣此。第二「智慧」已下明趣無相法,即觀察如來於有無無二相真如最清淨能入功德。無性云「為明斷德,故次說之。不住生死,涅槃相故,即無住涅槃。然無相法即是清淨真如,趣謂趣入,謂此真如諸法無性以為相故,非是有相。體即圓成,自相有故,非是無相。此二不相離,名無二相。諸法中勝,故名最勝。遠離客塵,故名清淨。既自能入亦令他入,為最清淨。自入則不住生死,他入則不住涅槃。」文中先明自入、後明他入。今初,先明不住生死,智稱如境,皆不可盡。無比三昧令智出生,又令真如出二障故。二「其身」下明不住涅槃,同體大悲遍住物身,心真如性物物遍故。二「令無量」下辨令他入,一則大悲冥熏、二則大智為說,令於身中見如來性,成一切智故。種性不斷是入義也,此用常寂名為涅槃。第三「住於諸佛究竟」已下,明住於佛住,即觀察如來無功用佛事、不休息功德,為欲得上無住涅槃,故次明之。文中,初明所住、後彰住益。今初,言住佛住者,謂聖天梵等皆佛所住,而於空大悲遍善安住,大悲性空即是佛家,故能不住生死涅槃為究竟住。此即恩德。是以親光亦名為觀,所調化功德常住大悲,晝夜六時觀世間故。後「令不可」下彰住家益。初明由住大悲,故能益物無遺,是不休息義。由住性空,自無功用,故能令物住無分別。出過眾生,總顯勝也。第四「獲一切」下明逮得一切佛平等性。下云得佛平等,即觀察如來於法身中所依意樂作事無差別功德,如上佛住為共不共,故次明之。此一切諸佛,展轉和雜而同住故。一切諸佛三事無差,非如聲聞但有所依。文即分三:初明所依無差別,謂一切智,以一切諸佛皆依真如清淨智故。「放大光」下顯智之用。二「普使」已下明意樂無差,謂同有利樂,勝意樂故。普使之言,即意樂也。不可壞智,即如來藏,普賢菩薩自體遍故。染而不染名不可壞,反源照極故名安住。三「遍住」下作業無差,一切皆作受用變化利他事故。於中,先明作業周遍、次「從於」下作業所依,即自受用身。一受不失,名為不退,謂得法性即念不退。此後親生佛智,此智生已還住法界。次「明了」已下正顯作業,初觀機;後「現不可說」下作業受用變化各有多類,名不可說差別之身。「能令」已下彰業之益。一能益他。二「隨初」下滿本所願,亦令於物能現色身。此上四段明其自利,後十七段明其利他。第五「等觀眾生」下明到無障處,即觀察如來修一切障對治功德。利他之中,先明化障對治,故次明之。謂已慣習一切煩惱及所知障對治聖道,即一切智及定自在性,故論名為修治。又已到永離一切習氣所依趣處,經名到無障處。二文互顯,以有治必無障,無障由有治故。文中,心無所著是無煩惱障,住無礙住明無所知障。得佛十力即是種智,是所知障治。心常寂定住一切智,即煩惱障治。第六「善能開演」下明不可轉法,即觀察如來降伏一切外道功德。由有上能治,故他不能轉利有情事,故次明之。謂教證二法皆不為他所動轉故,無有餘法勝過此故。文中,初明教道、「能悉」已下證道、「出生」已下二道之益。第七「恒以佛日」下明所行無礙,觀察如來生在世間不為世法所礙功德,顯示如來所化之中無高下礙,故次明之。謂世八風不能拘礙故。親光名降魔功德,謂色等境不能亂故。文中以佛身日普照法界則橫無礙,常現不沒則竪無礙。不以無信生盲等而不現故,正顯八風不礙。「恒住」已下顯無礙因,無有變異示無礙相,如摩尼珠不隨物變。不著我所於內無礙,世法不染於外無礙,由住出世如蓮華故。如有頌云「諸佛常游於世間,利樂一切有情類。八法勢風邪分別,不能傾動不拘礙。」第八「於一切」下明其所安立不可思議,即觀察如來安立正法功德,由依前方便能作饒益之事,故次明之。謂十二分教名所安立,由深廣故不可思議。文中分二:初約所詮以辨深廣、後約能詮以明深廣。今初,初句總顯,建即安立。「其智」下釋超世廣大,即是幢義。拔置智地,即是建義。「所有」已下福智相對,明高廣義。二「以大慈」下現身說法,約能詮教以明安立。第九「於去來今」下明遊於三世平等法性,即觀察如來授記功德,以上加行利有情事,三世諸佛皆悉平等,故次明之。謂於三世平等性中,能隨解了過去未來曾當轉事,皆如現在而授記故,故下經云「普見三世」。文中,初明三世平等之義,故云心常清淨自得平等,令物不著使他平等。「恒與」已下正明授記,授記未來令同過去種性,亦名平等。第十「常遊十方」下明其身流布一切世間,即觀察如來於一切世界示現受用變化身功德,顯上利益一時頓遍非次第作,故次明之。文中,初通辨二身,常約豎窮、遍約橫廣十方法界,綺互其文。後「諸眾生心」下總顯現相德,無不淨故不住生死,機無不鑒故普現世間。第十一「以智慧月」下明於一切法智無疑滯,即觀察如來斷疑功德,以於上十方彼彼之處作斷疑事,故次明之。謂於諸境善決定故,故下經云「智恒明達一切諸法」。文中,初自斷疑,非不自決能斷他疑故。智月普照總明了境,了達無得是了真境,非不證真能了俗故。「恒以智」下明了俗境。一切皆以心為自性,義通二境:攝境為心是世俗勝義,心之自性即是真如、是勝義。勝義如是而住,以無所得而為方便,雙照真俗無住住故。菩薩智光月,法界以為輪,遊於畢竟空,世間靡不現。亦可屬上現受用身。二「隨諸」已下能斷他疑。初明隨機現身。「如來」已下所斷疑境。為說緣起是斷疑法,深入緣起疑見亡故。知緣起無性故知法無相,無相無異故名一相。智體理成,故為其本。後「欲令」下正明斷疑。若離相著,開示菩提,疑方斷故。第十二「為欲救」下,明於一切行成就大覺,即觀察如來令入種種行功德,由所化生性有差別,故次明之,謂入種種行皆成大覺。下經但云「了一切行」。文中,初約說法令入。開示佛道者,令悟入故。後「令其」下約現身令入。攀緣修習,是進善行。「除滅」已下是離惡行。修菩提行,總舉萬行。心不散動,即是入義。既萬行齊修,則因無不滿、果無不成。第十三「悉能觀察」下明於諸法智無有疑惑,即觀察如來當來法生妙智功德,由即於前所化有能無能善巧別知,故次明之。謂聖聲聞言此人全無少分善根,如來知彼善法當生,現證過去微少善根種子所隨故,故文云「悉能觀察」。下經云「盡一切疑」。如求度者,遠劫採薪興一善念,佛便知故,觀已便化故,不壞其清淨業報。「智慧」已下釋其所以,以智普入無不知故。故親光名為能隨所應恒正教誨功德,謂於諸法懷疑惑者,無有堪能隨應教誨,唯佛能故,名智慧明了。則第十一是自斷疑,此斷他疑。第十四「永離一切」下明凡所現身不可分別。下經但云「無能測身」。即觀察如來,如其勝解示現功德。由上云「善巧別知」,故此次云「於前所化邪正及俱行中無有分別」。文中,初二句明無分別義。世虛妄解種現俱亡,故云永離,由自無分別故、餘不可以分別知故。親光名為能正攝受無染自體殊勝功德,謂佛身功德非是雜染分別所起,無煩惱業生之雜染,故不可分別。而無性云隨機現身如摩尼珠無分別者,則順今文佛無分別,不順彼經不可之言。次「放光明」下彰所示現皆無分別。見無厭足,而顯眾生不能分別,如瞿波觀佛毛孔,念念無厭不能窮究故。「以大功德」下辨能現德。「出生」已下明所現益。「諸根」已下辨所現相。謂諸根圓滿,境界自在。作諸佛事,總彰現意。作已便沒,明現時分。既隨勝解,現則感、謝應移。第十五「善能開示」下明一切菩薩等所求智,即觀察如來無量所依調伏有情加行功德,為欲引發任持不定種性聲聞,菩薩唯讚大乘,故次明之。言等所求者,無不求故。佛地名為正所求智,謂唯菩薩正能求故。文中,初明所求即一切智,此所求智即是無量菩薩所依。而言道者,通因果也。「為諸」已下即成所依義,謂由無量菩薩為欲調伏諸有情故發起加行,要以佛增上力故,聞法為先,獲得妙智而為所依。令其發起廣大欲樂者,即是調伏有情加行。受持修習者,即成智之因。第十六「成就一切」下明得佛無二住勝彼岸,即觀察如來平等法身波羅蜜多成滿功德。為遮所化,於大師所疑一切智非一切智,故次明之,由滿諸度是一切智。言無二者,即平等也。平等有二:一法身平等,於法身中滿諸度故。二果位諸度無增減故,名為平等。親光則以住於法身即是彼岸,不說諸度,故云法身無差別相名為無二。緣彼勝定常住其中,故名為住。即無二住,名勝彼岸。佛已窮到,故名為得。文中,初滿諸度,故云熾盛。次「無邊」下以度滿故、莊嚴故、身故。《法華》云「微妙淨法身,具相三十二。以八十種好,用莊嚴法身。」以十身圓融不相離故。言一切世間者,不隔凡聖,靡不現覩,雙覩受用變化之身。「永離」已下,無二礙故和合識破,相續心滅故。「於一切」下顯現法身,智純淨故。「於功德」下諸度滿故。第十七「為大法王」下明不相間雜如來解脫妙智究竟,即觀察如來隨其勝解示現差別佛土功德。以外人聞上平等,謂同一性,故次說言不相間雜。謂一切如來十身體用各各別故,猶如冥室千光。但經云「如來解脫」,無著釋云「隨其勝解」,世親、無性皆云「此中勝解名為解脫。」又勝解者,通機及佛,故無性云「謂觀眾生勝解差別,現金銀等土不相間雜。如來勝解現在前時,隨眾生樂皆悉顯現,無不了知,名如來解脫」等。親光又為一釋,即離障解脫,故云如來妙智令眾生解脫,名如來解脫妙智,佛於此智已得究竟。觀今經中諸論各得一意,復應加佛自得離障及作用解脫,謂文云離諸障翳故、具無邊德故、令其入道故。明見善惡是如來勝解,其心所樂即眾生勝解,是以不可偏取。下經但云「具足如來平等解脫」。在文分二:初明變化身土不雜、二明受用身土不雜。無著但云「差別佛土」,略舉一邊。親光則雙明身土,合今文意。今初,變化中,先身、後土。初中,先總顯化身超勝。次普現者,通十法界身放智慧光,合如日義。「欲令」已下彰所化意。能為多化,方顯佛德無邊所以。名不間雜者,以於一切世間普化。一佛既爾,餘何所化?故知所屬不同。重重皆遍,是不間雜義。後「以無礙」下別化因圓果滿之身,初明因圓、「為大醫」下現果滿身。二「一切世」下明現化土,初明非唯能化亦能遍往。「清淨慧」下明佛觀機,即是如來勝解現前。「於作不善」下隨機現土等。隨諸眾生應以何國起調伏心,入佛智慧而取佛土,故云善取時宜。無適淨穢,故云種種。欲該餘化,略無土言,義必含有。又對後平等,但言不善,亦應合有有漏之善。二「若諸眾生」下現受用身土,先土、後身。已證真如名平等心,覩受用土是平等報。上則心有高下,此則依於佛慧。後「隨其心樂」下現受用身。故親光云「於淨佛土現受用身,亦不相雜。」「令其」已下明現之益。親光云「大集會中現種種身,與諸菩薩受用法樂,亦不相雜。」得智心喜等,皆法樂也。又心大歡喜,即是初地見諸佛故生歡喜等。以證生信,故名深重。以證不退,故得永言。第十八「一切眾生」下明證無中邊佛平等地,即觀察如來三種佛身方處無分限功德。由疑上如來妙智究竟非一非異,其相云何?故次明此無中邊等。常無常等皆二邊相。言方處者,謂諸世界。無分限者,釋無中邊。此無中邊,略有四義:一世界無中邊,佛德如彼無有分限。二世界無邊,諸佛十身即於其中稱世界量平等遍滿。三此法身等,於佛地中平等遍滿,無中無邊無有分限。四此法身等遍一切處,為諸眾生現作饒益,然非自性無中無邊。親光復名此為真如相殊勝功德,謂真如相無有中邊,如此真如即是佛地平等法性,證此性故遍知一切,於中不染。今此文中總顯十身皆無分限,文中分二:先別顯四智十身、後「無數」下總結因果。今初,先就覺他翻明自覺成就法身。於中先明覺他,即妙觀察智及成所作智之所利樂。「若得見」下彰其所益。無依義智,即大圓鏡,是無中邊佛平等地,以無礙智身無所依故,則證真如為佛地性。轉昔染依為智所依,即是如如及如如智。既令他證,顯自己證也。次「智慧」下二句即妙觀察智。莊嚴無奪,顯圓鏡智所現之影。智山清淨,即平等性智,平等高出所以名山。四惑已亡,故云清淨。因惑為種生必待時,今能生自在,故種受芽稱。「或現」已下即平等性所現之影,兼顯十身不唯此二故。復言或令諸眾生至無患地者,即成佛地。以遠離微細念故,名為無患。後總結中,初總明,謂十力四智等莊嚴法身,業行所成即是報佛。現於世間,結他受用及變化身。總上諸義則有十身。「一切」已下總結異因同歸一智,謂智導萬行,故能證此佛平等地,若報若化無不清淨。第十九「常守本願」下明極於法界,即觀察如來窮生死際常現利益安樂一切有情功德。以上言無中邊相,云何無相?故次云極於法界。謂此法界最清淨故,離諸戲論是法界相。能起等流利益之事,極此法界無有盡期。親光亦名此德為證得果相殊勝功德,謂得窮極清淨法界,如是法界修道得故。以斯則極法界言有於二義:一同法界常故、二同法界清淨故。文中,先明常利樂、二廣利樂。今初,常守本願者,謂本發心,法界生界若有盡者我願乃盡。今生界未窮,故常現利樂。作善友者,世之善友略有七事:一遭苦不捨、二貧賤不輕、三密事\n\n（……释文余段照录从略·全文 12324 字·见 `T1735` 原文）\n\n> 体例：docs/工程治理/玄记体重排体例_v1.md——疏文照录；下节逐段层保持不动，与此总纲互指。\n\n\n### 2.1 全文（程序全引）\n\n> 昇兜率天宮品昇兜率天宮品\n>\n> 第二十三爾時，佛神力故，十方一切世界，一一四天下閻浮提中，皆見如來坐於樹下，各有菩薩承佛神力而演說法，靡不自謂恒對於佛。爾時，世尊復以神力，不離於此菩提樹下及須彌頂、夜摩天宮，而往詣於兜率陀天一切妙寶所莊嚴殿。時，兜率天王遙見佛來，即於殿上敷摩尼藏師子之座。\n>\n> 其師子座，天諸妙寶之所集成，過去修行善根所得，一切如來神力所現，無量百千億那由他阿僧祇善根所生，一切如來淨法所起，無邊福力之所嚴瑩；清淨業報，不可沮壞；觀者欣樂，無所厭足；是出世法，非世所染；一切眾生咸來觀察，無有能得究其妙好。\n>\n> 有百萬億層級，周匝圍遶；百萬億金網，百萬億華帳，百萬億寶帳，百萬億鬘帳，百萬億香帳，張施其上；華鬘垂下，香氣普熏；百萬億華蓋，百萬億鬘蓋，百萬億寶蓋，諸天執持，四面行列；百萬億寶衣，以敷其上；百萬億樓閣，綺煥莊嚴；百萬億摩尼網，百萬億寶網，彌覆其上；\n>\n> 百萬億寶瓔珞網，四面垂下；百萬億莊嚴具網，百萬億蓋網，百萬億衣網，百萬億寶帳網，以張其上；百萬億寶蓮華網，開敷光榮；百萬億寶香網，其香美妙，稱悅眾心；百萬億寶鈴帳，其鈴微動，出和雅音；百萬億栴檀寶帳，香氣普熏；百萬億寶華帳，其華敷榮；\n>\n> 百萬億眾妙色衣帳，世所希有；百萬億菩薩帳，百萬億雜色帳，百萬億真金帳，百萬億瑠璃帳，百萬億種種寶帳，悉張其上；百萬億一切寶帳，大摩尼寶以為莊嚴；百萬億妙寶華，周匝瑩飾；百萬億頻婆帳，殊妙間錯；百萬億寶鬘，百萬億香鬘，四面垂下；\n>\n> 百萬億天堅固香，其香普熏；百萬億天莊嚴具瓔珞，百萬億寶華瓔珞，百萬億勝藏寶瓔珞，百萬億摩尼寶瓔珞，百萬億海摩尼寶瓔珞，莊嚴座身；百萬億妙寶繒綵，以為垂帶；百萬億因陀羅金剛寶，百萬億自在摩尼寶，百萬億妙色真金藏，以為間飾；\n>\n> 百萬億毘盧遮那摩尼寶，百萬億因陀羅摩尼寶，光明照耀；百萬億天堅固摩尼寶，以為窓牖；百萬億清淨功德摩尼寶，彰施妙色；百萬億清淨妙藏寶，以為門闥；百萬億世中最勝半月寶，百萬億離垢藏摩尼寶，百萬億師子面摩尼寶，間錯莊嚴；百萬億心王摩尼寶，所求如意；\n>\n> 百萬億閻浮檀摩尼寶，百萬億清淨藏摩尼寶，百萬億帝幢摩尼寶，咸放光明，彌覆其上；百萬億白銀藏摩尼寶，百萬億須彌幢摩尼寶，莊嚴其藏；百萬億真珠瓔珞，百萬億瑠璃瓔珞，百萬億赤色寶瓔珞，百萬億摩尼瓔珞，百萬億寶光明瓔珞，百萬億種種藏摩尼瓔 行無量出離精進；百萬億菩薩，得禪波羅蜜，具足無量禪定光明；百萬億菩薩，得般若波羅蜜，智慧光明能普照耀；\n>\n> 百萬億菩薩，成就大願，悉皆清淨；百萬億菩薩，得智慧燈，明照法門；百萬億菩薩，為十方諸佛法光所照；百萬億菩薩，周遍十方，演離癡法；百萬億菩薩，普入一切諸佛剎土；百萬億菩薩，法身隨到一切佛國；百萬億菩薩，得佛音聲，能廣開悟；\n>\n> 百萬億菩薩，得出生一切智方便；百萬億菩薩，得成就一切法門；百萬億菩薩，成就法智，猶如寶幢，能普顯示一切佛法；百萬億菩薩，能悉示現如來境界。百萬億諸天王，恭敬禮拜；百萬億龍王，諦觀無厭；百萬億夜叉王，頂上合掌；百萬億乾闥婆王，起淨信心；\n>\n> 百萬億阿脩羅王，斷憍慢意；百萬億迦樓羅王，口銜繒帶；百萬億緊那羅王，歡喜踊躍；百萬億摩睺羅伽王，歡喜瞻仰；百萬億世主，稽首作禮；百萬億忉利天王，瞻仰不瞬；百萬億夜摩天王，歡喜讚歎；百萬億兜率天王，布身作禮；百萬億化樂天王，頭頂禮敬；\n>\n> 百萬億他化天王，恭敬合掌；百萬億梵天王，一心觀察；百萬億摩醯首羅天王，恭敬供養；百萬億菩薩，發聲讚歎；百萬億天女，專心供養；百萬億同願天，踊躍歡喜；百萬億往昔同住天，妙聲稱讚；百萬億梵身天，布身敬禮；百萬億梵輔天，合掌於頂；\n>\n> 百萬億梵眾天，圍遶侍衛；百萬億大梵天，讚歎稱揚無量功德；百萬億光天，五體投地；百萬億少光天，宣揚讚歎佛世難值；百萬億無量光天，遙向佛禮；百萬億光音天，讚歎如來甚難得見；百萬億淨天，與宮殿俱，而來詣此；百萬億少淨天，以清淨心，稽首作禮；\n>\n> 百萬億無量淨天，願欲見佛，投身而下；百萬億遍淨天，恭敬尊重，親近供養；百萬億廣天，念昔善根；百萬億少廣天，於如來所，生希有想；百萬億無量廣天，決定尊重，生諸善業；百萬億廣果天，曲躬恭敬；百萬億無煩天，信根堅固，恭敬禮拜；\n>\n> 百萬億無熱天，合掌念佛，情無厭足；百萬億善見天，頭面作禮；百萬億善現天，念供養佛，心無懈歇；百萬億阿迦尼吒天，恭敬頂禮；百萬億種種天，皆大歡喜，發聲讚歎；百萬億諸天，各善思惟，而為莊嚴；百萬億菩薩天，護持佛座，莊嚴不絕。\n>\n> 百萬億華手菩薩，雨一切華；百萬億香手菩薩，雨一切香；百萬億鬘手菩薩，雨一切鬘；百萬億末香手菩薩，雨一切末香；百萬億塗香手菩薩，雨一切塗香；百萬億衣手菩薩，雨一切衣；百萬億蓋手菩薩，雨一切蓋；百萬億幢手菩薩，雨一切幢；百萬億幡手菩薩，雨一切幡；\n>\n> 百萬億寶手菩薩，雨一切寶；百萬億莊嚴手菩薩，雨一切莊嚴具。百萬億諸天子，從天宮出，至於座所；百萬億諸天子，以淨信心，并宮殿俱；百萬億生貴天子，以身持座；百萬億灌頂天子，舉身持座。百萬億思惟菩薩，恭敬思惟；百萬億生貴菩薩，發清淨心；\n>\n> 百萬億菩薩，諸根悅樂；百萬億菩薩，深心清淨；百萬億菩薩，信解清淨；百萬億菩薩，諸業清淨；百萬億菩薩，受生自在；百萬億菩薩，法光照耀；百萬億菩薩，成就於地；百萬億菩薩，善能教化一切眾生。百萬億善根所生，百萬億諸佛護持，百萬億福德所圓滿，百萬億殊勝心所清淨，百萬億大願所嚴潔，百萬億善行所生起，百萬億善法所堅固，百萬億神力所示現，百萬億功德所成就，百萬億讚歎法而以讚歎。\n>\n> 如此世界兜率天王，奉為如來，敷置高座；一切世界兜率天王，悉為於佛，如是敷座，如是莊嚴，如是儀則，如是信樂，如是心淨，如是欣樂，如是喜悅，如是尊重，如是而生希有之想，如是踊躍，如是渴仰，悉皆同等。爾時，兜率天王為如來敷置座已，心生尊重，與十萬億阿僧祇兜率天子奉迎如來；\n>\n> 以清淨心，雨阿僧祇色華雲，雨不思議色香雲，雨種種色鬘雲，雨廣大清淨栴檀雲，雨無量種種蓋雲，雨細妙天衣雲，雨無邊眾妙寶雲，雨天莊嚴具雲，雨無量種種燒香雲，雨一切栴檀沈水堅固末香雲。諸天子眾各從其身出此諸雲時，百千億阿僧祇兜率天子，及餘在會諸天子，眾心大歡喜，恭敬頂禮；\n>\n> 阿僧祇天女，踊躍欣慕，諦觀如來。兜率宮中不可說諸菩薩眾，住虛空中，精勤一心，以出過諸天諸供養具，供養於佛，恭敬作禮。阿僧祇音樂一時同奏。爾時，如來威神力故，往昔善根之所流故，不可思議自在力故，兜率宮中一切諸天及諸天女，皆遙見佛，如對目前，同興念言：「如來出世難可值遇，我今得見具一切智於法無礙正等覺者。\n>\n> 」如是思惟，如是觀察，與諸眾會悉共同時奉迎如來；各以天衣，盛一切華，盛一切香，盛一切寶，盛一切莊嚴具，盛一切天栴檀末香，盛一切天沈水末香，盛一切天妙寶末香，盛一切天香華，盛一切天曼陀羅華，悉以奉散，供養於佛。百千億那由他阿僧祇兜率陀天子，住虛空中，咸於佛所起智慧境界心，燒一切香，香氣成雲莊嚴虛空；\n>\n> 又於佛所起歡喜心，雨一切天華雲莊嚴虛空；又於佛所起尊重心，雨一切天蓋雲莊嚴虛空；又於佛所起供養心，散一切天鬘雲莊嚴虛空；又於佛所生信解心，布阿僧祇金網彌覆虛空，一切寶鈴常出妙音；又於佛所生最勝福田心，以阿僧祇帳莊嚴虛空，雨一切瓔珞雲，無有斷絕；\n>\n> 又於佛所生深信心，以阿僧祇諸天宮殿莊嚴虛空，一切天樂出微妙音；又於佛所生最勝難遇心，以阿僧祇種種色天衣雲莊嚴虛空，雨於無比種種妙衣；又於佛所生無量歡喜踊躍心，以阿僧祇諸天寶冠莊嚴虛空，雨無量天冠，廣大成雲；又於佛所起歡喜心，以阿僧祇種種色寶莊嚴虛空，雨一切瓔珞雲，無有斷絕。\n>\n> 百千億那由他阿僧祇天子，咸於佛所生淨信心，散無數種種色天華，然無數種種色天香，供養如來；又於佛所起大莊嚴變化心，持無數種種色天栴檀末香，奉散如來；又於佛所起歡喜踊躍心，持無數種種色蓋，隨逐如來；又於佛所起增上心，持無數種種色天寶衣，敷布道路，供養如來；\n>\n> 又於佛所起清淨心，持無數種種色天寶幢，奉迎如來；又於佛所起增上歡喜心，持無數種種色天莊嚴具，供養如來；又於佛所生不壞信心，持無數天寶鬘，供養如來；又於佛所生無比歡喜心，持無數種種色天寶幡，供養如來。百千億那由他阿僧祇諸天子，以調順寂靜無放逸心，持無數種種色天樂，出妙音聲，供養如來。\n>\n> 百千億那由他不可說先住兜率宮諸菩薩眾，以從超過三界法所生，離諸煩惱行所生，周遍無礙心所生，甚深方便法所生，無量廣大智所生，堅固清淨信所增長不思議善根所生，起阿僧祇善巧變化所成就，供養佛心之所現，無作法門之所印，出過諸天諸供養具，供養於佛；\n>\n> 以從波羅蜜所生一切寶蓋，於一切佛境界清淨解所生一切華帳，無生法忍所生一切衣，入金剛法無礙心所生一切鈴網，解一切法如幻心所生一切堅固香，周遍一切佛境界如來座心所生一切佛眾寶妙座，供養佛不懈心所生一切寶幢，解諸法如夢歡喜心所生佛所住一切寶宮殿，無著善根無生善根所生一切寶蓮華雲、一切堅固香雲、一切無邊色華雲、一切種種色妙衣雲、一切無邊清淨栴檀香雲、一切妙莊嚴寶蓋雲、一切燒香雲、一切妙鬘雲、一切清淨莊嚴具雲，皆遍法界，出過諸天供養之具，供養於佛。\n>\n> 其諸菩薩一一身各出不可說百千億那由他菩薩，皆充滿法界、虛空界，其心等於三世諸佛，以從無顛倒法所起，無量如來力所加，開示眾生安隱之道，具足不可說名、味、句，普入無量法，一切陀羅尼種中生不可窮盡辯才之藏，心無所畏，生大歡喜，以不可說無量無盡如實讚歎法，讚歎如來，無有厭足。\n>\n> 爾時，一切諸天及諸菩薩眾，見於如來、應、正等覺——不可思議人中之雄。其身無量，不可稱數；現不思議種種神變，令無數眾生心大歡喜；普遍一切虛空界、一切法界，以佛莊嚴而為莊嚴；令一切眾生安住善根，示現無量諸佛神力，超過一切諸語言道，諸大菩薩所共欽敬；\n>\n> 隨所應化，皆令歡喜；住於諸佛廣大之身，功德善根悉已清淨；色相\n>\n> 第一，無能映奪；智慧境界，不可窮盡，無比三昧之所出生。其身無際，遍住一切眾生身中，令無量眾生皆大歡喜，令一切智種性不斷；住於諸佛究竟所住，生於三世諸佛之家；令不可數眾生信解清淨，令一切菩薩智慧成就、諸根悅豫；法雲普覆虛空法界，教化調伏無有遺餘；\n>\n> 隨眾生心，悉令滿足，令其安住無分別智；出過一切眾生之上，獲一切智，放大光明，宿世善根皆令顯現；普使一切發廣大心，令一切眾生安住普賢不可壞智；遍住一切眾生國土，從於不退正法中生，住於一切平等法界，明了眾生心之所宜，現不可說不可說種種差別如來之身，非世言辭而歎可盡；\n>\n> 能令一切常思念佛，充滿法界廣度群生；隨初發心所欲利益，以法惠施，令其調伏，信解清淨；示現色身不可思議，等觀眾生，心無所著；住無礙住，得佛十力，無所障礙；心常寂定，未曾散亂；住一切智，善能開演種種文句真實之義，能悉深入無邊智海，出生無量功德慧藏；\n>\n> 恒以佛日普照法界，隨本願力常現不沒；恒住法界，住佛所住，無有變異；於我、我所俱無所著，住出世法，世法無染；於一切世間建智慧幢，其智廣大，超過世間，無所染著；拔諸眾生令出淤泥，置於最上智慧之地，所有福德饒益眾生而無有盡；了知一切菩薩智慧，信向決定，當成正覺；\n>\n> 以大慈悲，現不可說無量佛身種種莊嚴；以妙音聲，演無量法，隨眾生意，悉令滿足；於去、來、今，心常清淨，令諸眾生不著境界；恒與一切諸菩薩記，令其皆入佛之種性，生在佛家，得佛灌頂；常遊十方，未曾休息，而於一切無所樂著；法界佛剎悉能遍往，諸眾生心靡不了知；\n>\n> 所有福德，離世清淨；不住生死，而於世間如影普現；以智慧月普照法界，了達一切悉無所得；恒以智慧，知諸世間如幻、如影、如夢、如化，一切皆以心為自性，如是而住；隨諸眾生業報不同、心樂差別、諸根各異，而現佛身；如來恒以無數眾生而為所緣，為說世間皆從緣起，知諸法相皆悉無相，唯是一相智慧之本；\n>\n> 欲令眾生離諸相著，示現一切世間性相而行於世，為其開示無上菩提；為欲救護一切眾生，出現世間開示佛道，令其得見如來身相，攀緣憶念，勤加修習；除滅世間煩惱之相，修菩提行，心不散動，於大乘門皆得圓滿，成就一切諸佛義利，悉能觀察眾生善根而不壞滅清淨業報；\n>\n> 智慧明了，普入三世，永離一切世間分別；放光明網普照十方，一切世界無不充滿；色身妙好，見者無厭；以大功德智慧神通，出生種種菩薩諸行；諸根境界，自在圓滿；作諸佛事，作已便沒；善能開示過、現、未來一切智道，為諸菩薩普雨無量陀羅尼雨，令其發起廣大欲樂，受持修習，成就一切諸佛功德；\n>\n> 圓滿熾盛無邊妙色莊嚴其身，一切世間靡不現覩；永離一切障礙之法，於一切法真實之義已得清淨，於功德法而得自在；為大法王，如日普照；為世福田，具大威德；於一切世間普現化身，放智慧光，悉令開悟；欲令眾生知佛具足無邊功德，以無礙繒繫頂受位，隨順世間方便開導；\n>\n> 以智慧手安慰眾生，為大醫王善療眾病，一切世間無量國土悉能遍往，未曾休息；清淨慧眼離諸障翳，悉能明見；於作不善惡業眾生，種種調伏，令其入道；善取時宜，無有休息；若諸眾生起平等心，即為化現平等業報，隨其心樂，隨其業果，為現佛身種種神變，而為說法，令其悟解，得法智慧，心大歡喜，諸根踊躍，見無量佛，起深重信，生諸善根，永不退轉；\n>\n> 一切眾生隨業所繫長眠生死，如來出世能覺悟之，安慰其心，使無憂怖；若得見者，悉令證入無依義智，智慧善巧，了達境界莊嚴妙好，無能映奪；智山法芽，悉已清淨；或現菩薩，或現佛身，令諸眾生至無患地；無數功德之所莊嚴，業行所成現於世間；\n>\n> 一切諸佛莊嚴清淨，莫不皆以一切智業之所成就；常守本願，不捨世間，作諸眾生堅固善友；清淨\n>\n> 第一，離垢光明，令一切眾生皆得現見；六趣眾生無量無邊，佛以神力常隨不捨；若有往昔同種善根，皆令清淨；而於六趣一切眾生不捨本願，無所欺誑，悉以善法方便攝取，令其修習清淨之業，摧破一切諸魔鬪諍，從無礙際出廣大力，最勝日藏無有障礙；\n>\n> 於淨心界而現影像，一切世間無不覩見，以種種法廣施眾生；佛是無邊光明之藏，諸力智慧皆悉圓滿；恒以大光普照眾生，隨其所願，皆令滿足，離諸怨敵，為上福田，一切眾生共所依怙；凡有所施，悉令清淨；修少善行，受無量福，悉令得入無盡智地；\n>\n> 為一切眾生種植善根淨心之主，為一切眾生發生福德最上良田；智慧甚深，方便善巧，能救一切三惡道苦。如是信解，如是觀察，如是入於智慧之淵，如是游於功德之海，如是普至虛空智慧，如是而知眾生福田，如是正念現前觀察，如是觀佛諸業相好，如是觀佛普現世間，如是觀佛神通自在。\n>\n> 時，彼大眾見如來身，一一毛孔出百千億那由他阿僧祇光明，一一光明有阿僧祇色、阿僧祇清淨、阿僧祇照明，令阿僧祇眾觀察、阿僧祇眾歡喜、阿僧祇眾快樂、阿僧祇眾深信增長、阿僧祇眾志樂清淨、阿僧祇眾諸根清涼、阿僧祇眾恭敬尊重。爾時，大眾咸見佛身，放百千億那由他不思議大光明，一一光明皆有不思議色、不思議光，照不思議無邊法界。\n>\n> 以佛神力，出大妙音；其音演暢百千億那由他不思議讚頌，超諸世間所有言辭，出世善根之所成就。復現百千億那由他不思議微妙莊嚴，於百千億那由他不思議劫歎不可盡，皆是如來無盡自在之所出生。又現不可說諸佛如來出興于世，令諸眾生入智慧門，解甚深義。\n>\n> 又現不可說諸佛如來所有變化，盡法界、虛空界，令一切世間平等清淨。如是，皆從如來所住無障礙一切智生，亦從如來所修行不思議勝德生。復現百千億那由他不思議妙寶光焰，從昔大願善根所起，以曾供養無量如來，修清淨行無放逸故，薩婆若心無有障礙生善根故，為顯如來力廣遍故，為斷一切眾生疑故，為令咸得見如來故，令無量眾生住善根故，顯示如來神通之力無映奪故，欲令眾生普得入於究竟海故，為令一切諸佛國土菩薩大眾皆來集故，為欲開示不可思議佛法門故。\n>\n> 爾時，如來大悲普覆，示一切智所有莊嚴，欲令不可說百千億那由他阿僧祇世界中眾生，未信者信，已信者增長，已增長者令其清淨，已清淨者令其成熟，已成熟者令心調伏；觀甚深法，具足無量智慧光明，發生無量廣大之心，薩婆若心無有退轉；不違法性，不怖實際，證真實理，滿足一切波羅蜜行，出世善根皆悉清淨；\n>\n> 猶如普賢，得佛自在，離魔境界，入諸佛境，了知深法，獲難思智，大乘誓願永不退轉；常見諸佛，未曾捨離；成就證智，證無量法，具足無邊福德藏力，發歡喜心入無疑地；離惡清淨，依一切智，見法不動，得入一切菩薩眾會，常生三世諸如來家。\n>\n> 世尊所現如是莊嚴，皆是過去先所積集善根所成，為欲調伏諸眾生故，開示如來大威德故，照明無礙智慧藏故，示現如來無邊勝德極熾然故，顯示如來不可思議大神變故，以神通力於一切趣現佛身故，示現如來神通變化無邊際故，本所志願悉成滿故，顯示如來勇猛智慧能遍往故，於法自在成法王故，出生一切智慧門故，示現如來身清淨故，又現其身最殊妙故，顯示證得三世諸佛平等法故，開示善根清淨藏故，顯示世間無能為諭上妙色故，顯示具足十力之相令其見者無厭足故，為世間日照三世故。\n>\n> 自在法王，一切功德，皆從往昔善根所現。一切菩薩，於一切劫，稱揚讚說，不可窮盡。爾時，兜率陀天王奉為如來嚴辦如是諸供具已，與百千億那由他阿僧祇兜率天子向佛合掌，白佛言：「善來世尊！善來善逝！善來如來、應、正等覺！唯見哀愍，處此宮殿！\n>\n> 」爾時，世尊以佛莊嚴而自莊嚴，具大威德；為令一切眾生生大歡喜故，一切菩薩發深悟解故，一切兜率陀天子增益欲樂故，兜率陀天王供養承事無厭足故，無量眾生緣念於佛而發心故，無量眾生種見佛善根福德無盡故，常能發起清淨信故，見佛供養無所求故，所有志願皆清淨故，勤集善根無懈息故，發大誓願求一切智故，受天王請，入一切寶莊嚴殿。\n>\n> 如此世界，十方所有一切世界，悉亦如是。爾時，一切寶莊嚴殿，自然而有妙好莊嚴，出過諸天莊嚴之上，一切寶網周匝彌覆，普雨一切上妙寶雲，普雨一切莊嚴具雲，普雨一切寶衣雲，普雨一切栴檀香雲，普雨一切堅固香雲，普雨一切寶莊嚴蓋雲，普雨不可思議華聚雲，普出不可思議妓樂音聲，讚揚如來一切種智，悉與妙法而共相應。\n>\n> 如是一切諸供養具，悉過諸天供養之上。時，兜率宮中，妓樂歌讚，熾然不息；以佛神力，令兜率王心無動亂，往昔善根皆得圓滿，無量善法益加堅固，增長淨信，起大精進，生大歡喜，淨深志樂，發菩提心，念法無斷，總持不忘。爾時，兜率陀天王承佛威力，即自憶念過去佛所所種善根而說頌言：「昔有如來無礙月，諸吉祥中最殊勝，彼曾入此莊嚴殿，是故此處最吉祥。\n>\n> 昔有如來名廣智，諸吉祥中最殊勝，彼曾入此金色殿，是故此處最吉祥。昔有如來名普眼，諸吉祥中最殊勝，彼曾入此蓮華殿，是故此處最吉祥。昔有如來號珊瑚，諸吉祥中最殊勝，彼曾入此寶藏殿，是故此處最吉祥。昔有如來論師子，諸吉祥中最殊勝，彼曾入此山王殿，是故此處最吉祥。\n>\n> 昔有如來名日照，諸吉祥中最殊勝，彼曾入此眾華殿，是故此處最吉祥。昔有佛號無邊光，諸吉祥中最殊勝，彼曾入此樹嚴殿，是故此處最吉祥：昔有如來名法幢，諸吉祥中最殊勝，彼曾入此寶宮殿，是故此處最吉祥。昔有如來名智燈，諸吉祥中最殊勝，彼曾入此香山殿，是故此處最吉祥。\n>\n> 昔有佛號功德光，諸吉祥中最殊勝，彼曾入此摩尼殿，是故此處最吉祥。」如此世界兜率天王，承佛神力以頌讚歎過去諸佛；十方一切諸世界中兜率天王，悉亦如是歎佛功德。爾時，世尊於一切寶莊嚴殿摩尼寶藏師子座上，結跏趺坐，法身清淨，妙用自在，與三世佛同一境界；\n>\n> 住一切智，與一切佛同入一性；佛眼明了，見一切法皆無障礙；有大威力，普遊法界未甞休息；具大神通，隨有可化眾生之處，悉能遍往；以一切諸佛無礙莊嚴而嚴其身，善知其時，為眾說法；不可說諸菩薩眾，各從他方種種國土而共來集；眾會清淨，法身無二，無所依止，而能自在，起佛身行。\n>\n> 坐此座已，於其殿中自然而有無量無數殊特妙好出過諸天供養之具，所謂：華鬘、衣服、塗香、末香、寶蓋、幢幡、妓樂、歌讚。如是等事，一一皆悉不可稱數。以廣大心恭敬尊重，供養於佛；十方一切兜率陀天，悉亦如是。\n\n**【句释】**（疏训释·体例 v1 第3条·L.431·据澄观《华严经疏》`T1735`）：\n- 「上下放逸，此天知足，表世間行滿故，居喜足之天」——处兜率说向之义：上下放逸、此天知足——表世间行满；又有一生补处表菩提心功行满。\n- 「勤苦積行未見有餘，迴向眾生乃知自足」——回向喻：积功累勋知阶未足、回勋授子乃知有余——菩萨勤苦积行、回向众生乃知自足。\n- 「欲界六天，此居其中，表悲智均平」——位义：欲界六天此居其中——表悲智均平；又生此天修施戒定三福。\n\n## 三、旁参与前接\n\n**承前**：品22〈十无尽藏品〉——藏含摄·行无尽；本品升兜率，行将转为回向。\n\n**启后**：品24〈兜率宮中偈讚品〉金刚幢等十菩萨偈赞→品25〈十回向品〉金刚幢正说回向。\n\n## 四、义理要点\n\n**【要点提炼】**\n\n1. **「不离……而向」第三叠**：品13升忉利·品19升夜摩·本品升兜率——三次「不离而升」，**升非迁替而是遍现**。\n2. **知足之义**：兜率（Tuṣita）义为「知足」——回向位以知足为基：**知足而后能回**，有求则不能舍。\n3. **纯长行过渡**：本品无菩萨说法正文，唯佛神力显现与菩萨云集——**过渡品的仪式功能**（铺垫下一会正说）。\n\n**【阐释】**（〔本文判断〕）品23是九会中第三次「升而不离」——每次升入新天，前处不离：佛不出菩提场而遍一切处。兜率之「知足」暗示：十行已满（品21-22），行者至此当知足——知足非自满，是**不更求而后能回向**。全品无说法正文，是九会中**纯过渡品**之一——仪式的空白处正是义理：升而不说，知足无言。\n\n**【启发】**读此品可对照品13/19之「不离而升」三叠——问自己：每一次「升进」，前一处真的不离吗？知足天宫的功课是：**在知足中准备回向**。\n\n## 五、注疏选要\n\n### 5.1 澄观（`T1735`）\n\n> 昇兜率天宮品〉中,彼有三段,文含四義。謂初一段,文有十句,明於多因以成多果,謂併列多因復說多果。故經云「百千億那由他不可說先住兜率宮諸菩薩眾,以從超過三界法所<anchorxml:id=\"nkr_note_mod_008\n\n（昇兜率天宮品·随疏演义钞释文——L.333 程序取窗）\n\n>\n\n（昇兜率天宮品·随疏演义钞释文——L.333 程序取窗）\n\n>\n\n### 5.2 诸家（实引·L.348 程序取窗）\n\n**李通玄《新華嚴經論》**（300 字·程序取窗）：\n\n> 十迴向。表此天處欲界之中理事無礙。故名迴向。初發心住時理事無礙。非獨此處方有迴向。但以次第名言法須安立。然實體中一一位中皆具足也。膝者明屈申迴旋自在說迴向義也。表真俗自在故。生死涅槃已自在成智悲故也。第七他化自在天中放眉間毫相果德光明。說十地位也。為十地菩薩因果位終故。還像此天依他起化。無自心化故。表十地菩薩但為眾生所須教化自無業化。又於欲界之際即無欲故。還同四禪及出三界之法門故。異彼小乘修生涅槃出三界惑故。又異權教菩薩於第四禪中成十地故。又從兜率天超過化樂天至他化自在天者。表十地位法遍法界故。不須次第。上界四禪亦在其會。不來而到。不往而至。不動而見故。上下諸天皆處其中。十\n\n（论十迴向表法：兜率处欲界之中·「膝者明屈申迴旋自在說迴向義」——回向位以身体部位表法之判。）\n\n**道霈《華嚴經疏論纂要》**（300 字·程序取窗）：\n\n> 兜率宮中不可說諸菩薩眾住虛空中。精勤一心.以出過諸天諸供養具供養於佛.恭敬作禮。阿僧祇音樂.一時同奏。【疏】前中二。初奉迎。二以清淨下.興供。於中先諸天興供。皆從身出者。非唯顯諸天福力。亦表身為供具。供自心生。後兜率宮下。菩薩興供。可知。【論】爾時兜率天王已下。至音樂一時同奏一段經。名兜率天王為佛敷座已。與諸天眾。以淨心興供養雲。及諸菩薩奉迎如來分。釋義云。與十萬億阿僧祇兜率天子奉迎如來有二義。一請佛入宮殿。二表法。以解脫無依住之大智。處一切生死.饒益眾生。即迎佛義。又一釋。如創入聖位。以方便三昧而入真門。如此十迴向.以取十住十行中無垢正智入大悲方便.為迎佛入宮殿。如三乘中。地前三十心為\n\n（纂要引论释兜率天王敷座分：「一請佛入宮殿。二表法。以解脫無依住之大智」——敷座即表法。）\n\n### 〇之二.9 文化资产参证（名胜·造像·图绘·L.443 落位）\n\n> **体例**：图像著录体系（登记册 `shengdoushuai_imagery.yaml`·唯一权威著录源）；授权 Commons 可核验（CC BY-SA 2.0）；**A/B/C 三分**——本批 1 件（B 类：弥勒造像传统）；凡边界不混同。\n\n<figure style=\"margin:14px 0 20px;text-align:center\">\n<img class=\"doc-img\" src=\"https://upload.wikimedia.org/wikipedia/commons/3/36/Gilt-bronze_Maitreya_in_Meditation_%28National_Treasure_No._83%29_%EA%B8%88%EB%8F%99%EB%AF%B8%EB%A5%B5%EB%B3%B4%EC%82%B4%EB%B0%98%EA%B0%80%EC%82%AC%EC%9C%A0%EC%83%81_%28%EA%B5%AD%EB%B3%B4_%EC%A0%9C83%ED%98%B8%29_02.jpg\" alt=\"韩国国宝 83 号·金铜弥勒半跏思维像\" loading=\"lazy\">\n<figcaption style=\"font-size:.78em;color:var(--text2);line-height:1.85;max-width:760px;margin:6px auto 0\">\n图 23-C1　韩国国宝 83 号·金铜弥勒半跏思维像——金铜弥勒半跏思维像（国宝 83 号）——兜率天弥勒造像传统 （CC 署名：angkor22 (a flickr user)）。<br>**边界**：B：弥勒造像传统·半跏思维像非本经专像。\n</figcaption>\n</figure>\n\n## 六、文本对读\n\n### 6.1 八十／六十对读（L.348·data/research/huayan_p23_24_60.json）\n\n- **品名**：八十〈昇兜率天宮品第二十三〉／六十·CBETA head 〈**如來昇兜率天宮一切寶殿品第十九**〉——品次 23↔19（六十〈卢舍那佛品〉合并后品次前移系统之延续）；通称〈昇兜率天宮品第十九〉系检索用，底本 head 存全称（`huayan_80_60_head_titles.json` 勘注）。\n- **体量**：八十 **8,473** CJK／六十 **8,593** CJK（比 **101%**）——八十/六十十三对全比对中**六十不缩反增之罕见例**〔本文判断：过渡品之仪式描写，六十铺陈更甚〕。\n\n**首段对勘窗（各300字·程序注入）**\n\n> **八十**：昇兜率天宮品昇兜率天宮品第二十三爾時，佛神力故，十方一切世界，一一四天下閻浮提中，皆見如來坐於樹下，各有菩薩承佛神力而演說法，靡不自謂恒對於佛。爾時，世尊復以神力，不離於此菩提樹下及須彌頂、夜摩天宮，而往詣於兜率陀天一切妙寶所莊嚴殿。時，兜率天王遙見佛來，即於殿上敷摩尼藏師子之座。其師子座，天諸妙寶之所集成，過去修行善根所得，一切如來神力所現，無量百千億那由他阿僧祇善根所生，一切如來淨法所起，無邊福力之所嚴瑩；清淨業報，不可沮壞；觀者欣樂，無所厭足；是出世法，非世所染；一切眾生咸來觀察，無有能得究其妙好。有百萬億層級，周匝圍遶；百萬億金網，百萬億華帳，百萬億寶帳，百萬億鬘帳，百萬億香帳，張施其\n\n> **六十**：如來昇兜率天宮一切寶殿品如來昇兜率天宮一切寶殿品第十九爾時，佛威神力故，十方一切世界、諸四天下、一一閻浮提，皆有如來坐菩提樹，無不顯現。彼諸菩薩承佛神力，說種種法，皆悉自謂在於佛所。爾時，如來以自在神力，不離菩提樹座及須彌頂妙勝殿，上夜摩天宮寶莊嚴殿，趣兜率天宮一切寶莊嚴殿。時，彼天王遙見佛來，即於殿上，敷如意寶藏師子之座，以種種天寶而莊嚴之。過去修習善根所得，一切如來威神護持，不可數那由他阿僧祇善根所生，一切諸佛淨法所起，一切眾生所共莊嚴，無量功德之所成就。離一切惡，清淨業報，一切樂觀，無有厭足，出離世間諸法所起，清淨無污，一切世間因緣所起，一切眾生見不能盡。以無量莊嚴具而莊嚴之，所謂：百萬\n\n| 异文点 | 八十 | 六十 |\n|---|---|---|\n| 开篇 | 「爾時，佛神力故」 | 「爾時，佛威神力故」 |\n| 阎浮提见佛 | 「皆見如來坐於樹下」 | 「皆有如來坐菩提樹」「無不顯現」 |\n| 升进句 | 「不離於此菩提樹下及須彌頂、夜摩天宮，而往詣於兜率陀天」 | 「不離菩提樹座及須彌頂妙勝殿，上夜摩天宮寶莊嚴殿，趣兜率天宮」 |\n| 殿名 | 「一切妙寶所莊嚴殿」 | 「一切寶莊嚴殿」 |\n| 敷座 | 「敷摩尼藏師子之座」 | 「敷如意寶藏師子之座」 |\n| 座生 | 「無量百千億那由他阿僧祇善根所生」 | 「不可數那由他阿僧祇善根所生」 |\n| 座现 | 「一切如來神力所現」 | 「一切如來威神護持」 |\n| 天王 | 「兜率天王」 | 「彼天王」 |\n\n〔释读〕**摩尼藏／如意寶藏**——同一 maṇi 两译策略（音译对义译）之标本，同段同物两名；升进句两译「不離」复沓同构而枝节详略异（八十殿前缺「上夜摩天宮」环节，六十备列三处）；殿名同构而序倒（妙寶所莊嚴对寶莊嚴）；六十无「兜率天王」专名而以「彼天王」承前——指称疏密之异〔本文判断〕。\n\n### 6.3 藏译（Toh 44）\n\n**藏译平行章勘定（L.352·rev L.348·data/alignment/tibetan_ch_map_L352.json）**：藏28（035·fol **347b.4**）＝**本品升兜率段**——词证：དགའ་ལྡན（兜率）在本章区段 **33 见**（5.7 万字窗）；藏章序 n27（十无尽藏）→n28（升兜率）→n29（兜率偈赞）→n30（十回向）→n31（十地）与汉品22→23→24→25→26 **逐章平行**（藏章号＝汉品号＋5）。〔**勘正**〕L.348 旧注藏译无兜率升进章系误判——佛神力·十方世界·如来住起首式为升天三章（n18 升须弥／n24 升夜摩／n28 升兜率）**共用式样**，单凭起首语不能定章；今以 དགའ་ལྡན 词频＋藏30 金刚幢名（རྡོ་རྗེའི་རྒྱལ་མཚན）＋藏31 十地章题三重证据重勘。藏译卷 035 དགའ་ལྡན 分布今重计：本品区段 33 见为主，世主妙严段王众为辅〔本文判断：据实重计〕。\n\n\n**藏文首段（德格 035 卷·章28·347b.4·程序取窗·去页码标记·L.354a 补）**\n\n> ཉི // ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=(sessionStorage.getItem('article_en_hide')||'')==='1';

}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}
