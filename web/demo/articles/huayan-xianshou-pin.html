—两译净身仅差 **69 字**，证文本实体相若（虽「颂／偈」计数差近两倍·§5.4）。\n\n**〔四〕宗眼·flagship（信为道元颂·义差直证）**：\n\n| 句 | 八十（`T10n0279`） | 六十（`juan6.txt`） | 异文类 |\n|---|---|---|---|\n| 第一句 | 信為道元功德母 | 信為道元功德母 | **同**（两译宗眼各唯一见·§1.5） |\n| 第二句 | **長養**一切諸善法 | **增長**一切諸善法 | 长养／增长 |\n| 第三句 | **斷除疑網出愛流** | **除滅一切諸疑惑** | 断疑网出爱流／除灭诸疑惑 |\n| 第四句 | **開示涅槃無上道** | **示現開發無上道** | 开示涅槃／示现开发 |\n\n〔本文判断〕两译宗眼首句全同，异在二～四句措辞——八十「斷除疑網出愛流」意象尤峻（疑网·爱流二喻），六十作「除滅一切諸疑惑」较平；此非义理之差，乃译词之别，各照底本不统一（§〇凡例 4）。\n\n**〔五〕问端偈（发起对读）**：八十「**我今已為諸菩薩，說佛往修清淨行，仁亦當於此會中，演暢修行勝功德。**」（§2.1）／六十「**佛子我已說，菩薩清淨行，一切諸世尊，咸共所讚歎。又諸大士眾，甚深微妙行，功德廣大義，仁者應演說。**」——六十问端多「佛子」「一切諸世尊咸共所讚歎」二句、体作五言，八十作七言；**句式（五言／七言）是两译最显之文体异**。〔本文判断〕八十通体七言偈、六十杂五七言，与两译整体译风一致。\n\n**〔六〕结叹·十方现证（对读）**：八十「**時，賢首菩薩說此偈已，十方世界六返震動，魔宮隱蔽，惡道休息。十方諸佛普現其前，各以右手而摩其頂，同聲讚言：「善哉！善哉！快說此法！我等一切悉皆隨喜。」**」（§2.6）／六十「**賢首說此品竟時，十方世界六返動，諸魔宮殿如聚墨，光照十方惡道滅。一切十方諸如來，悉皆普現賢首前，各伸右手摩其頂……『善哉善哉真佛子，快說是法我隨喜。』**」——同归「六返震动·右手摩顶·善哉随喜」，然**八十作长行散文结、六十作偈颂结**（六十「諸魔宮殿如聚墨」一句尤诗化·八十「魔宮隱蔽」较直）。实测八十侧「！」×20·「。」×312（§7.4）。\n\n### 6.1′　六十《賢首菩薩品第八》全本对照〔L.190 本批·全量入文〕\n\n品界跨 `T09n0278_juan6.txt`＋`juan7.txt` **拼接净身**（juan6「賢首菩薩品第八」@4212→卷六题「大方廣佛華嚴經卷第六」rfind 止·juan7「賢首菩薩品第八」@391→「佛昇須彌頂品第九」@391止·剔卷七题头／译场衔等非本品字）·**CJK 10,159·raw 11,633·736 段**（`_p12_cov_run.py` 同锚断言·§7.4）·以下**逐段照录原档分行**（序码 000–735·不转写不断句·末段「大方廣佛華嚴經」系原档卷七题头行残留于拼接窗口·照录并注）：\n\n> 000｜賢首菩薩品第八\n> 001｜之一\n> 002｜爾時，文殊師利以偈問了達深義淨德賢首菩薩曰：\n> 003｜「佛子我已說，菩薩清淨行，\n> 004｜一切諸世尊，咸共所讚歎。\n> 005｜又諸大士眾，甚深微妙行，\n> 006｜功德廣大義，仁者應演說。」\n> 007｜賢首菩薩答：「佛子善諦聽，\n> 008｜菩薩諸功德，無量無有邊，\n> 009｜我當隨力說，菩薩少功德，\n> 010｜我之所演暢，如海一微渧。\n> 011｜菩薩於生死，最初發心時，\n> 012｜一向求菩提，堅固不可動。\n> 013｜彼一念功德，深廣無邊際，\n> 014｜如來分別說，窮劫猶不盡。\n> 015｜何況於無量，無數無邊劫，\n> 016｜具足修諸度，諸地功德行。\n> 017｜十方世界中，一切諸如來，\n> 018｜說彼功德雲，亦不能究竟。\n> 019｜今我說菩薩，功德中少分，\n> 020｜如鳥履虛空，如地一微塵，\n> 021｜非是無所因，又亦非無緣，\n> 022｜菩薩初發意，直心大功德。\n> 023｜於佛及法僧，深起清淨信，\n> 024｜信敬三寶故，能發菩提心。\n> 025｜不求五欲樂，寶貨諸財利，\n> 026｜亦不求自安，希望世名聞，\n> 027｜滅除眾生苦，令盡無有餘，\n> 028｜誓度斯等類，菩薩初發心。\n> 029｜常欲令眾生，離苦永安樂，\n> 030｜嚴淨一切剎，供養無量佛，\n> 031｜樂立佛正法，欲得無上道，\n> 032｜淨修一切智，菩薩初發心。\n> 033｜「深心淨信不可壞，恭敬供養一切佛，\n> 034｜尊重正法及聖僧，信敬三寶故發心。\n> 035｜深信諸佛及正法，亦信菩薩所行道，\n> 036｜正心信向佛菩提，菩薩因是初發心。\n> 037｜信為道元功德母，增長一切諸善法，\n> 038｜除滅一切諸疑惑，示現開發無上道。\n> 039｜淨信離垢心堅固，滅除憍慢恭敬本，\n> 040｜信是寶藏第一法，為清淨手受眾行。\n> 041｜信能捨離諸染著，信解微妙甚深法，\n> 042｜信能轉勝成眾善，究竟必至如來處。\n> 043｜清淨明利諸善根，信力堅固不可壞，\n> 044｜信永除滅一切惡，信能逮得無師寶，\n> 045｜信於法門無障礙，捨離八難得無難，\n> 046｜信能超出眾魔境，示現無上解脫道。\n> 047｜一切功德不壞種，出生無上菩提樹，\n> 048｜長養最勝智慧門，信能示現一切佛，\n> 049｜是故演說次第行，信樂最勝甚難得。\n> 050｜譬如靈瑞優曇華，亦如隨意妙寶珠，\n> 051｜若信恭敬一切佛，則持淨戒順正教。\n> 052｜若持淨戒順正教，諸佛賢聖所讚歎，\n> 053｜戒是無上菩提本，應當具足持淨戒。\n> 054｜若能具足持淨戒，一切如來所讚歎，\n> 055｜若信恭敬一切佛，則能奇特供最勝。\n> 056｜若能奇特供最勝，彼信佛心難思議，\n> 057｜若信如來正真法，則常樂聞無厭足。\n> 058｜若樂聞法無厭足，欣悟不可思議法，\n> 059｜若信恭敬清淨僧，則信堅固不可壞。\n> 060｜若信堅固不可壞，彼人信力不可動，\n> 061｜若信堅固不可動，諸根明利悉清淨。\n> 062｜若根明利悉清淨，則離一切惡知識，\n> 063｜若能遠離惡知識，則能親近善知識。\n> 064｜若能親近善知識，則修無量諸功德，\n> 065｜若能廣修諸功德，則能善解諸因果。\n> 066｜若能善解諸因果，則成殊勝妙解脫，\n> 067｜若成殊勝妙解脫，則為一切佛所護。\n> 068｜若為一切佛所護，則生無上菩提心，\n> 069｜若生無上菩提心，則能勤修佛功德。\n> 070｜若能勤修佛功德，則能得生諸佛家，\n> 071｜若能得生諸佛家，則於諸法無所著。\n> 072｜若於諸法無所著，則得深心妙清淨，\n> 073｜若得深心妙清淨，則得殊勝無上心。\n> 074｜若得無上殊勝心，則修一切波羅蜜，\n> 075｜若修一切波羅蜜，則能具足摩訶衍。\n> 076｜若能具足摩訶衍，則法供養一切佛，\n> 077｜若法供養一切佛，則念佛定不可壞。\n> 078｜若念佛定不可壞，則常覩見十方佛，\n> 079｜若常覩見十方佛，則知如來常安住。\n> 080｜若知如來常安住，則於其人法永存，\n> 081｜若於其人法永存，則得辯才無窮盡。\n> 082｜若得辯才無窮盡，則能演說無量法，\n> 083｜若能演說無量法，則能度脫一切眾。\n> 084｜若能度脫一切眾，則得大悲心堅固，\n> 085｜若得大悲心堅固，則常喜樂甚深法。\n> 086｜若能喜樂甚深法，則能捨離有為過，\n> 087｜若能捨離有為過，則離我慢諸放逸。\n> 088｜若離我慢諸放逸，則能兼利一切眾，\n> 089｜若能兼利一切眾，則處生死無憂慼。\n> 090｜若處生死無憂慼，則能精進無有上，\n> 091｜若能精進無有上，則得一切諸神通。\n> 092｜若得一切諸神通，則解一切眾生行，\n> 093｜若解一切眾生行，則能成就諸眾生。\n> 094｜若能成就諸眾生，則得成就眾生智，\n> 095｜若得成就眾生智，則能具足四攝法。\n> 096｜若能具足四攝法，則與眾生無量利，\n> 097｜若與眾生無量利，則能具足方便慧。\n> 098｜若能具足方便慧，則能安住無上道，\n> 099｜若能安住無上道，則一切魔不能壞。\n> 100｜若一切魔不能壞，則能超出四魔道，\n> 101｜若能超出四魔道，則至堅固不動地。\n> 102｜若至堅固不動地，則得無生深法忍，\n> 103｜若得無生深法忍，則為諸佛所授記。\n> 104｜若為諸佛所授記，則常普現諸佛前，\n> 105｜若常普現諸佛前，則解諸佛微密教。\n> 106｜若解諸佛微密教，則為諸佛常護念，\n> 107｜若為諸佛常護念，以佛功德自莊嚴。\n> 108｜若佛功德自莊嚴，則得無量功德身，\n> 109｜若得無量功德身，其身顯耀如金山。\n> 110｜若身顯耀如金山，具足眾相三十二，\n> 111｜若具眾相三十二，八十種好自莊嚴。\n> 112｜八十種好自莊嚴，其身光明無有量，\n> 113｜若身光明無有量，光明莊嚴難思議。\n> 114｜若光莊嚴難思議，則出無量寶蓮華，\n> 115｜若出無量寶蓮華，一一華坐無量佛。\n> 116｜普現十方無量剎，教化度脫一切眾，\n> 117｜若能度脫一切眾，則得無量自在力。\n> 118｜若得無量自在力，則能嚴淨諸佛剎，\n> 119｜解說甚深微妙法，不可思議眾歡喜。\n> 120｜若說微妙甚深法，不可思議眾歡喜，\n> 121｜則能具足四辯力，自在能度一切眾。\n> 122｜若能具足四辯力，自在能度一切眾，\n> 123｜彼人智慧常在前，身口意業無錯謬。\n> 124｜若彼智慧常在前，身口意業無錯謬，\n> 125｜彼人願力得自在，隨眾所宜現其身。\n> 126｜若彼願力得自在，隨眾所宜現其身，\n> 127｜為諸眾生說法時，音聲微妙難思議。\n> 128｜若為眾生說法時，音聲微妙難思議，\n> 129｜於彼一切眾生類，一念之中悉知心。\n> 130｜若彼一切眾生類，一念之中悉知心，\n> 131｜其人生死永無餘，寂滅一切煩惱患。\n> 132｜若人生死永無餘，寂滅一切煩惱患，\n> 133｜法身功德智慧具，深解一切諸法實。\n> 134｜若身功德智慧具，深解一切諸法實，\n> 135｜十地十種自在力，皆悉究竟勝解脫。\n> 136｜若十地種自在力，皆悉究竟得解脫，\n> 137｜授記莊嚴悉具足，無量法門得自在。\n> 138｜若記莊嚴悉具足，無量法門得自在，\n> 139｜盡為一切十方佛，皆與授記無有餘。\n> 140｜若為一切十方佛，皆與授記無有餘，\n> 141｜甘露法水灌其頂，十方諸佛授記竟。\n> 142｜若甘露水灌其頂，十方諸佛授記竟，\n> 143｜法身充滿遍虛空，安住不動十方界。\n> 144｜若身充滿遍虛空，安住不動十方界，\n> 145｜一切諸天及世人，無等等界莫能知。\n> 146｜於本所行無不果，其見聞者悉不空，\n> 147｜此是無上大福田，供養施者大果報。\n> 148｜彼善男子威神力，正法常住永不滅，\n> 149｜十善功德諸妙行，無量法寶最無上。\n> 150｜彼威神力佛法海，法寶堅固如金剛，\n> 151｜智慧滿足不可盡，如是無量功德海。\n> 152｜或有剎土無有佛，於彼示現成正覺，\n> 153｜或有國土無有法，於彼示現說法藏。\n> 154｜菩薩希望一切斷，於一念頃遊十方，\n> 155｜示現十方如滿月，無量方便化眾生。\n> 156｜於彼十方世界中，念念示現成佛道，\n> 157｜轉正法輪入涅槃，現分舍利為眾生。\n> 158｜或現聲聞緣覺道，示現成佛普莊嚴，\n> 159｜現無量劫度眾生，以三乘門廣開化。\n> 160｜或現男女種種形，天人龍神阿脩羅，\n> 161｜隨諸眾生若干身，無量行業諸音聲。\n> 162｜一切示現無有餘，海印三昧勢力故，\n> 163｜不可思議莊嚴剎，恭敬供養一切佛。\n> 164｜光明莊嚴難思議，教化眾生無有量，\n> 165｜智慧自在不可議，說法教化得自在。\n> 166｜施戒忍辱精進禪，方便智慧諸功德，\n> 167｜一切自在難思議，華嚴三昧勢力故。\n> 168｜入微塵數諸三昧，一三昧生塵等定，\n> 169｜一塵中現無量剎，而彼微塵亦不增。\n> 170｜一塵內剎現有佛，或現有剎而無佛，\n> 171｜或現有剎淨不淨，或現大剎及中下，\n> 172｜或剎伏住或隨順，或如野馬或四方，\n> 173｜或有國土如天網，世界成敗無不現。\n> 174｜如一微塵所示現，一切微塵亦如是，\n> 175｜是名三昧自在力，亦無量稱解脫力。\n> 176｜若欲供養一切佛，出生無量三昧門，\n> 177｜能以一手覆三千，供養一切諸如來。\n> 178｜十方國土勝妙華，無價寶珠殊異香，\n> 179｜皆悉自然從手出，供養道樹諸最勝。\n> 180｜無價寶衣雜妙香，寶幢幡蓋而莊嚴，\n> 181｜金華寶帳妙校飾，十方一切上供具，\n> 182｜悉從手中自然出，供養道樹諸最勝。\n> 183｜一切十方諸妓樂，無量和雅妙音聲，\n> 184｜及以種種眾妙偈，讚歎諸佛實功德，\n> 185｜音聲遍滿十方界，悉從掌中自然出。\n> 186｜無量清淨諸行業，所得右手放光明，\n> 187｜香水普灑十方國，供養一切照世燈。\n> 188｜放妙莊嚴大光明，出生無量寶蓮華，\n> 189｜於蓮華中無量佛，相好具足自莊嚴。\n> 190｜放華莊嚴淨光明，莊嚴妙華以為帳，\n> 191｜散諸雜華遍十方，供養一切諸如來。\n> 192｜放香莊嚴淨光明，莊嚴妙香以為帳，\n> 193｜散諸雜香遍十方，供養一切諸如來。\n> 194｜放細末香淨光明，莊嚴末香以為帳，\n> 195｜散諸末香遍十方，供養一切諸如來。\n> 196｜放衣莊嚴淨光明，莊嚴寶衣以為帳，\n> 197｜散諸寶衣遍十方，供養一切諸如來。\n> 198｜放寶莊嚴淨光明，莊嚴妙寶以為帳，\n> 199｜散諸妙寶遍十方，供養一切諸如來。\n> 200｜放妙蓮華淨光明，眾妙蓮華以為帳，\n> 201｜散諸蓮華遍十方，供養一切諸如來。\n> 202｜放諸瓔珞淨光明，諸妙瓔珞以為帳，\n> 203｜散諸瓔珞遍十方，供養一切諸如來。\n> 204｜放莊嚴幢淨光明，其幢青黃赤白色，\n> 205｜無量種種而莊嚴，以幢嚴飾諸佛剎。\n> 206｜執持雜寶莊嚴蓋，眾寶繒綵為垂帶，\n> 207｜寶鈴演出最勝音，以此供養諸如來。\n> 208｜手出供具難思議，如是供養一導師，\n> 209｜供一切佛亦如是，大仙三昧自在力。\n> 210｜欲安一切眾生類，出生自在勝三昧，\n> 211｜一切所行諸功德，無量方便度眾生。\n> 212｜或現供養如來門，或現一切布施門，\n> 213｜或現具足持戒門，或現無盡忍辱門，\n> 214｜無量苦行精進門，禪定寂靜三昧門，\n> 215｜無量大辯智慧門，一切所行方便門，\n> 216｜現四無量神通門，大慈大悲四攝門，\n> 217｜無量功德智慧門，一切緣起解脫門，\n> 218｜清淨根力道法門，或現聲聞小乘門，\n> 219｜或現緣覺中乘門，或現無上大乘門，\n> 220｜或現無常眾苦門，或現無我眾生門，\n> 221｜或現不淨離欲門，寂靜滅定三昧門，\n> 222｜隨諸眾生起病門，一切對治諸法門，\n> 223｜隨彼眾生煩惱性，如應說法廣開化。\n> 224｜如是一切諸法門，隨其本性而濟度，\n> 225｜一切天人莫能知，是自在勝三昧力。\n> 226｜出生隨樂勝三昧，分別了知眾生心，\n> 227｜隨順教化諸群生，令離憂惱得歡喜。\n> 228｜劫中災難饑饉時，一切資生諸樂具，\n> 229｜隨其所須普周給，是為能作大施主。\n> 230｜肴膳香美上味食，寶衣莊嚴隨所樂，\n> 231｜己身國土珍愛施，好施眾生悉從化。\n> 232｜以諸相好莊嚴身，上妙衣服及眾華，\n> 233｜雜種末香以塗身，現此嚴飾度眾生。\n> 234｜一切世間所喜樂，種種殊勝淨妙色，\n> 235｜隨其所應普示現，令樂色者得解脫。\n> 236｜柔軟美聲如哀鸞，拘真羅等微妙音，\n> 237｜具足八種梵音聲，隨其所樂為說法。\n> 238｜八萬四千諸法門，諸佛以此度眾生，\n> 239｜分別諸法無量門，隨眾生性化導之。\n> 240｜眾生苦樂利無利，一切世間所行法，\n> 241｜悉能普應同其事，以此攝法度眾生。\n> 242｜無量無邊大苦海，為眾生故悉能忍，\n> 243｜與彼同事不念苦，饒益眾生令安樂。\n> 244｜若有不識出家法，樂著生死不求解，\n> 245｜是故菩薩捨國財，常樂出家求寂靜。\n> 246｜五欲所縛不離家，欲令眾生解脫故，\n> 247｜示現不樂處愛欲，是故出家求解脫。\n> 248｜欲令具足十種行，是佛如來本所修，\n> 249｜菩薩所行無有餘，修習是法度眾生。\n> 250｜或有眾生壽無量，煩惱微細樂世間，\n> 251｜為斯一切眾生類，示現生老病死患。\n> 252｜或有貪欲瞋恚癡，煩惱猛火常熾然，\n> 253｜為現生老病死苦，化度一切眾生故。\n> 254｜如來十力無所畏，及佛十八不共法，\n> 255｜最勝無量諸功德，以此妙法度眾生。\n> 256｜說法教誡及神足，住持自在神通力，\n> 257｜菩薩示現斯功德，以此濟度諸群生。\n> 258｜如是方便無有量，隨順世間度眾生，\n> 259｜不著世間如蓮華，能令眾生大歡喜。\n> 260｜博綜多識辯才王，文頌談論過世間，\n> 261｜示現世間眾技術，譬如幻師現眾像。\n> 262｜或為長者邑中主，或為賈客商人導，\n> 263｜或為國王及大臣，或為良醫療眾病，\n> 264｜或於曠野作大樹，或為良藥無盡藏，\n> 265｜或作寶珠隨所求，迷道眾生示正路。\n> 266｜若見世界始成立，眾生未知資生法，\n> 267｜是時菩薩為工匠，為之示現種種業。\n> 268｜不作惡業害生具，欲令群生壽安樂，\n> 269｜呪術藥草學眾論，悉為諸佛所稱歎。\n> 270｜或現仙人殊勝行，一切群生所愛樂，\n> 271｜示行苦行及深法，隨其所應悉能現。\n> 272｜或作外道出家人，或復示現事火法，\n> 273｜或現裸形無衣服，能為彼人作師長。\n> 274｜見有邪命種種行，習行非法以為勝，\n> 275｜一切梵志諸苦行，能於其中而化度。\n> 276｜五熱炙身隨日轉，或受牛鹿畜生戒，\n> 277｜被服草衣奉事火，為化是等作導師。\n> 278｜現樂遊行諸天廟，自投恒河求解脫，\n> 279｜食果服氣而飲水，思惟正法不放逸。\n> 280｜或現胡跪翹一足，或臥刺棘灰土上，\n> 281｜或臥杵石求解脫，為彼師導教化故。\n> 282｜如是等類諸外道，具觀彼意如應化，\n> 283｜菩薩苦行無與等，外道由是得解脫。\n> 284｜若見世間無正見，常依一切邪見住，\n> 285｜方便為說甚深法，悉令得解真實諦。\n> 286｜或以鬼神邊地語，為斯等類說四諦，\n> 287｜或以正語說四諦，或人天語說四諦，\n> 288｜或以法辯說四諦，或以義辯說四諦，\n> 289｜或以辭辯說四諦，或無盡辯說四諦，\n> 290｜或八部音說四諦，或一切音說四諦。\n> 291｜隨彼所解語言音，為說四諦令解脫，\n> 292｜知一切語不思議，是名說法三昧力。\n> 293｜安隱眾生勝三昧，為度一切眾生故，\n> 294｜放大光明難思議，以此光明救群生。\n> 295｜所放光明名善現，若有眾生遇斯光，\n> 296｜彼獲果報無有量，因是究竟無上道。\n> 297｜由彼顯現諸如來，亦現一切法僧道，\n> 298｜又現最勝塔形像，故獲光明名善現。\n> 299｜又放光明名清淨，映蔽一切天人光，\n> 300｜除滅一切諸闇冥，普照十方無量國。\n> 301｜彼光覺悟一切眾，執持燈明供養佛，\n> 302｜以燈供養諸佛故，得成最勝世間燈。\n> 303｜然諸香油及酥燈，或以竹木為炬明，\n> 304｜以能然此諸燈明，得是清淨妙光明。\n> 305｜又放光明名濟度，彼光覺悟一切眾，\n> 306｜當發無上菩提心，度脫欲海諸群生。\n> 307｜若發無上菩提心，度脫欲海諸群生，\n> 308｜彼悉能度四駛流，示導無畏解脫處。\n> 309｜造立無量諸橋梁，或作舟船度眾生，\n> 310｜毀呰有為讚寂靜，因此得成度光明。\n> 311｜又放光明名除愛，彼光覺悟一切眾，\n> 312｜捨離五欲諸渴愛，思樂解脫甘露水。\n> 313｜若能遠離五欲渴，思樂解脫甘露水，\n> 314｜以佛解脫甘露雨，滅除眾生諸渴愛。\n> 315｜惠施池井諸泉流，以求無上佛菩提，\n> 316｜毀呰五欲讚諸禪，因此得成滅愛光。\n> 317｜又放光明名歡喜，彼光覺悟一切眾，\n> 318｜歡喜愛樂佛菩提，發心願求無師寶。\n> 319｜建立如來大慈像，相好具足坐蓮華，\n> 320｜讚歎最勝諸功德，因是得成喜光明。\n> 321｜賢首菩薩品第八之二\n> 322｜「又放光明名愛樂，彼光覺悟一切眾，\n> 323｜心常愛樂諸如來，無上法寶清淨僧，\n> 324｜常會十方諸佛前，逮成無上深法忍。\n> 325｜教化無量群生類，心常念佛深妙法，\n> 326｜開發眾生菩提心，因是得成愛樂光。\n> 327｜又放光明名德聚，彼光覺悟一切眾，\n> 328｜普行種種無量施，以此願求無上道，\n> 329｜隨其所求皆滿足，一切施會悉清淨，\n> 330｜隨其所求惠施故，因是得成德聚光。\n> 331｜又放光明名深智，彼光覺悟一切眾，\n> 332｜於一法門一念中，悉解無量諸法門，\n> 333｜分別諸法化眾生，及諸法相如實義，\n> 334｜說法說義具足故，因是得成深智光。\n> 335｜又放光明名慧燈，彼光覺悟一切眾，\n> 336｜諸法空寂無生滅，解達非有亦非無，\n> 337｜譬如野馬水月形，亦如幻夢鏡中像，\n> 338｜諸法無主悉空寂，因是得成慧燈光。\n> 339｜又放光名法自在，彼光覺悟一切眾，\n> 340｜陀羅尼藏不可盡，能持如來一切法，\n> 341｜恭敬供養持法者，防衛守護眾賢聖，\n> 342｜以無量法施眾生，因是得成自在光。\n> 343｜又放光明名無慳，彼光覺悟除貪惜，\n> 344｜解知財寶非常有，悉能捨離無所著，\n> 345｜難制慳心能調伏，解財如夢如浮雲，\n> 346｜常能歡喜樂布施，因是得成無慳光。\n> 347｜又放光明名清涼，彼光覺悟毀禁者，\n> 348｜安立眾生淨戒中，啟導令逮無師寶，\n> 349｜十善業迹悉清淨，勸化眾生持淨戒，\n> 350｜開發眾生求佛道，因是得成清涼光。\n> 351｜又放光名忍莊嚴，彼光覺悟瞋恚者，\n> 352｜捨離瞋恚增上慢，常樂柔和忍辱法，\n> 353｜眾生惡性難忍者，悉能堪忍求佛道，\n> 354｜常能讚歎忍辱法，因是得成莊嚴光。\n> 355｜又放光明名轉勝，彼光覺悟懈怠者，\n> 356｜常能勤修三種業，恭敬供養佛法僧。\n> 357｜若能勤修三種業，恭敬供養佛法僧，\n> 358｜彼能超出四魔境，速成無上佛菩提。\n> 359｜勸化眾生令精進，恭敬供養佛法僧，\n> 360｜佛法欲滅能護持，因是得成轉勝光。\n> 361｜又放光明名寂靜，彼光覺悟亂意者，\n> 362｜捨離貪欲瞋恚癡，正住甚深諸三昧，\n> 363｜遠惡知識不善行，又離十種非法語，\n> 364｜讚歎坐禪空閑處，因是得成寂靜光。\n> 365｜又放光名慧莊嚴，彼光覺悟愚癡者，\n> 366｜善知緣起得解脫，智慧照明了諸根。\n> 367｜若知緣起得解脫，智慧照明了諸根，\n> 368｜得聖智慧諸三昧，逮等正覺照世間。\n> 369｜捨國財寶所愛身，精勤求法為佛道，\n> 370｜專心說法為眾生，因是得成慧光明。\n> 371｜又放光明名佛慧，彼光覺悟一切眾，\n> 372｜見不思議無量佛，各各坐寶蓮華上，\n> 373｜讚歎諸佛佛解脫，說佛自在無有量，\n> 374｜廣說佛力諸神通，因是得成佛慧光。\n> 375｜又放光明名無畏，彼光安慰恐怖者，\n> 376｜非人所持諸毒害，無量恐怖悉除滅，\n> 377｜普於眾生施無畏，心常慈忍離惱害，\n> 378｜拯濟危難無救者，因是得成無畏光。\n> 379｜又放光明名安隱，彼光所觸疾病者，\n> 380｜滅除一切諸苦痛，悉得正受三昧樂，\n> 381｜施諸良藥療眾患，摩以寶珠香塗身，\n> 382｜或酥油乳石蜜施，因是得成安隱光。\n> 383｜又放光明名見佛，彼光覺悟命終者，\n> 384｜念佛三昧必見佛，命終之後生佛前，\n> 385｜見彼臨終勸念佛，又示尊像令瞻敬，\n> 386｜又復勸令歸依佛，因是得成見佛光。\n> 387｜又放光明名樂法，彼光覺悟一切眾，\n> 388｜聽法講說及書寫，於正法中常愛樂，\n> 389｜佛法欲滅能護持，令求法者意充滿，\n> 390｜精勤修習佛正法，因是得成樂法光。\n> 391｜又放光明名妙音，彼光覺悟諸佛子，\n> 392｜一切世間所有聲，聞者皆是如來音，\n> 393｜大音讚揚諸如來，妓樂鐘磬供養佛，\n> 394｜又常讚歎佛音聲，因是得成妙音光。\n> 395｜又放光名施甘露，彼光覺悟一切眾，\n> 396｜遠離一切放逸行，皆悉具足諸功德，\n> 397｜分別無量大苦海，有為危脆非安隱，\n> 398｜宣揚讚歎寂滅樂，因是得成甘露光。\n> 399｜又放光明名殊勝，彼光覺悟一切眾，\n> 400｜於如來所聞勝戒，勝妙三昧勝智慧，\n> 401｜常歎諸佛勝妙戒，勝妙三昧勝智慧，\n> 402｜一心修習求菩提，因是得成勝光明。\n> 403｜又放光名寶莊嚴，彼光覺悟一切眾，\n> 404｜得勝寶藏不可盡，以此供養諸世尊，\n> 405｜以寶獻佛及塔廟，兼施一切諸貧乏，\n> 406｜以眾珍奇供最勝，因是成寶莊嚴光。\n> 407｜又放光明名妙香，彼光覺悟一切眾，\n> 408｜其有眾生聞是香，具足得佛諸功德，\n> 409｜以人天香塗其地，供養一切諸如來，\n> 410｜以香造像及塔廟，因是得成妙香光。\n> 411｜又放光名雜莊嚴，以幢幡蓋而嚴飾，\n> 412｜和雅妓樂微妙音，散眾寶華滿十方，\n> 413｜本以微妙妓樂音，和末塗香眾雜華，\n> 414｜幢蓋幡帳供諸佛，因是得成莊嚴光。\n> 415｜又放光明名端嚴，令十方地平如掌，\n> 416｜掃除僧坊大仙塔，因是得成端嚴光，\n> 417｜又放光明名大雲，彼光能雨妙香水，\n> 418｜香水灑塔及僧坊，因是得成大雲光。\n> 419｜又放光名衣莊嚴，令裸形者得上服，\n> 420｜以莊嚴服施眾生，因是成衣莊嚴光，\n> 421｜又放光明名上味，令飢餓者得美膳，\n> 422｜本施種種上味食，因是得成上味光。\n> 423｜又放光名示現寶，令諸貧乏得寶藏，\n> 424｜以無盡藏施三寶，因是得成示寶光，\n> 425｜又放光名眼清淨，能令盲者見眾色，\n> 426｜以燈供佛及塔廟，因是得成淨眼光。\n> 427｜又放光名耳清淨，能令聾者聞眾音，\n> 428｜妓樂供佛及塔廟，因是得成淨耳光。\n> 429｜又放光名鼻根淨，聞若不聞悉令聞，\n> 430｜眾香供佛及塔廟，因是得成鼻淨光。\n> 431｜又放光名舌根淨，以柔軟音讚諸佛，\n> 432｜永離麁獷不善語，因是得成淨舌光。\n> 433｜又放光名身根淨，諸根毀壞令具足，\n> 434｜禮拜諸佛及塔寺，因是得成身淨光。\n> 435｜又放光名意根淨，令失心者得正念，\n> 436｜修習三昧禪定力，因是得成意淨光。\n> 437｜又放光名色清淨，覩見不可思議佛，\n> 438｜以眾妙色莊嚴塔，因是得成色淨光。\n> 439｜又放光名聲清淨，解聲非聲悉空寂，\n> 440｜化眾令知聲如響，因是得成聲淨光。\n> 441｜又放光名香清淨，令諸臭穢成妙香，\n> 442｜香水洗塔菩提樹，因是得成淨香光。\n> 443｜又放光名味清淨，悉除一切味中毒，\n> 444｜供養佛僧及父母，因是得成味淨光。\n> 445｜又放光名觸清淨，堅強麁歰皆柔軟，\n> 446｜雨刀輪戟諸鋒刃，皆悉變成寶華鬘。\n> 447｜柔軟妙衣布道巷，最勝行時足蹈上，\n> 448｜香華上服用布施，因是得成觸淨光。\n> 449｜又放光名法清淨，一一毛孔無量佛，\n> 450｜各說妙法難思議，悉令眾生得歡喜。\n> 451｜因緣所生非生性，如來法身非是身，\n> 452｜湛然常住如虛空，因此化導成法光。\n> 453｜如是等比光明門，無量無邊恒沙數，\n> 454｜悉從大仙毛孔出，一切業果皆悉現。\n> 455｜如一毛孔所放光，無量無邊恒沙數，\n> 456｜一切毛孔亦如是，是大仙定自在力。\n> 457｜隨其本行得光明，宿世同行有緣者，\n> 458｜如其所應放光明，是名大仙智自在。\n> 459｜所修行業有同者，及行隨喜功德分，\n> 460｜聞見菩薩清淨行，彼人得見此光明。\n> 461｜若修無量諸功德，恭敬供養無數佛，\n> 462｜心常樂求無上道，彼人覺悟是光明。\n> 463｜譬如生盲不見日，非為無日出世間，\n> 464｜諸有目者悉覩見，各隨所務修其業。\n> 465｜大聖光明亦如是，或有眾生見不見，\n> 466｜邪見惡害所不覩，勝智慧者乃能見。\n> 467｜摩尼寶殿上輦乘，眾寶香味莊嚴具，\n> 468｜有功德者自然備，非無德者所能獲。\n> 469｜大聖光明亦如是，隨其行業見不見，\n> 470｜聞是分別諸光明，精勤恭敬信向者。\n> 471｜滅除一切諸疑惑，速成無上功德幢，\n> 472｜出生微妙勝三昧，諸佛眷屬大莊嚴。\n> 473｜神力於此得自在，悉能顯現示眾生，\n> 474｜三千大千妙莊嚴，化一蓮華滿世界，\n> 475｜結跏趺坐悉充滿，是名自在三昧力。\n> 476｜十方世界微塵剎，化作七寶大蓮華，\n> 477｜佛子眷屬共圍遶，是名自在勝三昧。\n> 478｜宿世成就善因緣，具足功德求佛道，\n> 479｜彼等眾生遶菩薩，一切合掌觀無厭。\n> 480｜彼大仙人法如是，甚深正受三昧力，\n> 481｜菩薩處彼清淨眾，如月在星獨明耀。\n> 482｜如此一方所示現，諸佛子等為眷屬，\n> 483｜一切十方亦如是，示現三昧自在力。\n> 484｜十方世界有緣故，往返出入度眾生，\n> 485｜或見菩薩入正受，或見菩薩從定起，\n> 486｜或東方見入正受，或西方見三昧起，\n> 487｜或西方見入正受，或東方見三昧起，\n> 488｜如是出入遍十方，或異方見入正受，\n> 489｜或異方見三昧起，是大仙定自在力。\n> 490｜東方世界無有餘，佛剎如來難思議，\n> 491｜菩薩常現彼佛前，是名寂靜三昧力。\n> 492｜東方一切諸佛前，常見安住入正受，\n> 493｜西方一切諸佛前，常見菩薩供養佛，\n> 494｜西方世界無有餘，佛剎如來難思議，\n> 495｜於彼一切諸佛前，常見菩薩入正受。\n> 496｜西方見彼入正受，東方佛剎無有餘，\n> 497｜於彼佛前三昧起，恭敬供養一切佛。\n> 498｜如是十方諸佛前，出入三昧無有餘，\n> 499｜或見菩薩入正受，或見恭敬供養佛。\n> 500｜於眼根中入正受，於色法中三昧起，\n> 501｜示現色法不思議，一切天人莫能知，\n> 502｜於色法中入正受，於眼起定念不亂，\n> 503｜觀眼無生無自性，說空寂滅無所有。\n> 504｜於耳根中入正受，於聲法中三昧起，\n> 505｜分別一切諸音聲，諸天世人莫能知，\n> 506｜於聲法中入正受，於耳起定念不亂，\n> 507｜觀耳無生無自性，說空寂滅無所有，\n> 508｜於鼻根中入正受，於香法中三昧起，\n> 509｜分別一切諸香法，諸天世人莫能知，\n> 510｜於香法中入正受，於鼻起定念不亂，\n> 511｜觀鼻無生無自性，說空寂滅無所有，\n> 512｜於舌根中入正受，於味法中三昧起，\n> 513｜分別一切諸味法，諸天世人莫能知，\n> 514｜於味法中入正受，於舌起定念不亂，\n> 515｜觀舌無生無自性，說空寂滅無所有，\n> 516｜於身根中入正受，於觸法中三昧起，\n> 517｜分別一切諸觸法，諸天世人莫能知，\n> 518｜於觸法中入正受，於身起定念不亂，\n> 519｜觀身無生無自性，說空寂滅無所有。\n> 520｜於意根中入正受，於諸法中三昧起，\n> 521｜分別一切諸法相，諸天世人莫能知，\n> 522｜於諸法中入正受，於意起定念不亂，\n> 523｜觀意無生無自性，說空寂滅無所有。\n> 524｜現童子身入正受，於壯年身三昧起；\n> 525｜現壯年身入正受，於老年身三昧起；\n> 526｜現老年身入正受，於善女人三昧起；\n> 527｜現善女人入正受，於善男子三昧起；\n> 528｜現善男子入正受，比丘尼身三昧起；\n> 529｜比丘尼身入正受，於比丘身三昧起；\n> 530｜現比丘身入正受，於學無學三昧起；\n> 531｜現學無學入正受，於緣覺身三昧起；\n> 532｜現緣覺身入正受，於如來身三昧起；\n> 533｜現如來身入正受，於諸天身三昧起；\n> 534｜現諸天身入正受，於龍神身三昧起；\n> 535｜現龍神身入正受，於大鬼神三昧起；\n> 536｜現大鬼神入正受，一切鬼神三昧起；\n> 537｜一切鬼神入正受，一毛孔中三昧起；\n> 538｜一毛孔中入正受，一切毛孔三昧起；\n> 539｜一切毛孔入正受，一毛端頭三昧起；\n> 540｜一毛端頭入正受，一切毛端三昧起；\n> 541｜一切毛端入正受，一微塵中三昧起；\n> 542｜一微塵中入正受，一切微塵三昧起；\n> 543｜一切微塵入正受，於金剛地三昧起；\n> 544｜現金剛地入正受，摩尼寶樹三昧起；\n> 545｜摩尼寶樹入正受，諸佛光明三昧起；\n> 546｜諸佛光明入正受，於大海水三昧起；\n> 547｜現大海水入正受，於大盛火三昧起；\n> 548｜現大盛火入正受，於風起定心不亂；\n> 549｜現於風大入正受，於地大中三昧起；\n> 550｜現地大中入正受，於天宮殿三昧起；\n> 551｜現天宮殿入正受，於虛空中三昧起。\n> 552｜是名無量功德者，三昧自在難思議，\n> 553｜十方一切諸如來，不思議劫說不盡。\n> 554｜一切諸佛皆共說，眾生業報難思議，\n> 555｜諸龍神變佛自在，禪定三昧亦難思，\n> 556｜今說聲聞自在力，無可為之作譬諭，\n> 557｜智慧明了聰達者，乃能解是甚深義。\n> 558｜得八解脫心自在，一身能作無量身，\n> 559｜以無量身作一身，於虛空中入火定，\n> 560｜身上出水身下火，身上出火身下水，\n> 561｜行住坐臥虛空中，於一念中自在變。\n> 562｜彼不具足大慈悲，不為眾生求佛道，\n> 563｜尚能示現難思議，況大饒益自在力，\n> 564｜現作日月遊虛空，普照十方諸世界，\n> 565｜或作河池井泉水，或作大海眾寶器。\n> 566｜如是等比難思議，普現十方諸世界，\n> 567｜深達三昧諸解脫，唯有諸佛能證知。\n> 568｜如淨水中四兵像，各各別異皆明了，\n> 569｜刀劍輪戟眾兵器，如是等仗皆悉現，\n> 570｜隨其器仗本形相，悉現於彼淨水中，\n> 571｜水影四兵無憎愛，是名大仙定自在。\n> 572｜海中有天名妙音，其中眾生若干種，\n> 573｜解彼一切諸音聲，皆悉令得大歡喜。\n> 574｜彼有貪欲瞋恚癡，猶能分別一切音，\n> 575｜況復總持自在力，而不能令眾生喜？\n> 576｜有一女人名辯才，父母求天由此生，\n> 577｜離諸惡法樂真實，能令眾生得辯才。\n> 578｜彼有貪欲瞋恚癡，猶能與眾勝辯才，\n> 579｜亦能令彼得歡喜，何況菩薩無量智？\n> 580｜譬如幻師善術法，能現種種無量色，\n> 581｜示現晝夜須臾頃，或現須臾作百年。\n> 582｜彼有貪欲瞋恚癡，幻力自在悅世間，\n> 583｜況禪解脫神通行，云何不令眾生喜？\n> 584｜天阿脩羅鬪戰時，阿脩羅眾即退散，\n> 585｜心大恐怖而奔走，四兵悉入藕絲孔。\n> 586｜彼有貪欲瞋恚癡，能作自在不思議，\n> 587｜況住自在無畏法，云何不能現神變？\n> 588｜釋提桓因有象王，彼知帝釋欲行時，\n> 589｜彼化作頭三十三，一一口中有六牙，\n> 590｜一一牙上七浴池，清淨香水湛然滿，\n> 591｜一一清淨池水中，各七蓮華為莊嚴。\n> 592｜彼諸嚴飾蓮華上，各各有七天玉女，\n> 593｜諸女竝奏微妙音，與彼帝釋相娛樂，\n> 594｜或時捨彼龍象身，化作天女極莊嚴，\n> 595｜威儀巧妙最無比，是名龍象自在力。\n> 596｜彼有貪欲瞋恚癡，能作如是諸神變，\n> 597｜何況具足方便智，而於諸定不自在？\n> 598｜如阿脩羅化作身，金剛地上安其足，\n> 599｜海水至深僅半身，其首廣大如須彌。\n> 600｜彼有貪欲瞋恚癡，乃能現是大神力，\n> 601｜況伏魔怨照世燈，而不能現大神變？\n> 602｜天阿脩羅共戰時，帝釋自在難思議，\n> 603｜隨阿脩羅軍眾數，現身等彼而交戰。\n> 604｜諸阿脩羅發是念：『釋提桓因來向我，\n> 605｜必取我身五種縛。』阿脩羅眾大恐怖，\n> 606｜帝釋現身有千眼，手執金剛出火焰，\n> 607｜被甲持杖自莊嚴，阿脩羅見即退散。\n> 608｜彼以微小功德力，猶能摧破大怨敵，\n> 609｜何況救度一切者，無量功德不自在？\n> 610｜教化忉利諸天故，得此果報妙音聲，\n> 611｜以諸天等放逸行，空中自然出此音，\n> 612｜一切五欲悉無常，虛偽無實如水沫，\n> 613｜如幻野馬水中月，有為如夢如浮雲。\n> 614｜一切放逸有憂諍，非甘露道生死徑，\n> 615｜若有行諸放逸者，入於生死摩竭口。\n> 616｜我所有者眾苦本，一切賢聖所厭患，\n> 617｜五欲功德磨滅法，常樂清淨真實行。\n> 618｜三十三天聞此音，一切來集善法堂，\n> 619｜帝釋為說微妙法，隨順離欲寂靜行。\n> 620｜彼音無形不可見，猶能饒益諸天眾，\n> 621｜何況應化眾生身，不能大利一切世？\n> 622｜天阿脩羅共鬪時，諸天眾侶大恐怖，\n> 623｜諸天功德勢力故，空中出聲言勿懼。\n> 624｜諸天聞此安慰聲，即離恐畏生大力，\n> 625｜時阿脩羅心震懼，所將兵眾悉退散。\n> 626｜何況甘露妙音聲，能滅眾生諸恐怖，\n> 627｜大慈具足摧眾魔，寂靜妙音除煩惱。\n> 628｜帝釋普應諸天女，九十有二那由他，\n> 629｜天女各各心自謂，天王獨與我娛樂。\n> 630｜現身集在善法堂，為天說法令歡喜，\n> 631｜帝釋能於一念中，悉皆現此大神變。\n> 632｜釋有貪欲瞋恚癡，能令眷屬悉歡喜，\n> 633｜況無量劫修神力，而不能令一切悅？\n> 634｜他化自在六天王，於欲界中得自在，\n> 635｜以業煩惱為羅網，繫縛一切諸凡夫。\n> 636｜彼有貪欲瞋恚癡，能伏欲界諸群生，\n> 637｜況具十種自在力，而不令眾同其行？\n> 638｜三千世界大梵王，一切諸梵所住處，\n> 639｜悉能現身於彼坐，演暢微妙梵音聲。\n> 640｜彼於世間四梵道，禪定五通得如意，\n> 641｜何況超出一切世，禪定解脫不自在？\n> 642｜摩醯首羅智自在，大海龍王降雨時，\n> 643｜悉能分別數其渧，於一念中皆明了。\n> 644｜無量億劫勤修學，得是無上菩提智，\n> 645｜云何當於一念中，不知一切眾生心？\n> 646｜眾生業報難思議，因大風輪起世界，\n> 647｜巨海諸山天宮殿，眾寶光明萬物種，\n> 648｜亦能興雲降大雨，亦能散滅諸雲氣，\n> 649｜亦能成熟一切穀，亦大饒益群生類。\n> 650｜風不能學波羅蜜，亦不學佛諸功德，\n> 651｜猶成不可思議事，何況具足諸願者？\n> 652｜男子女人諸異類，海龍雷震大音聲，\n> 653｜悉能了知皆如響，逮無障礙無盡辯，\n> 654｜為一切眾說妙法，其有聞者悉歡喜。\n> 655｜如海奇特未曾有，印現一切眾像類，\n> 656｜大身眾生妙寶藏，眾流悉入無增損。\n> 657｜如是眾生平等印，無盡功德禪解脫，\n> 658｜一切智慧諸功德，增長眾善無厭足。\n> 659｜龍王示現自在時，從金剛際至他化，\n> 660｜興雲充遍四天下，其雲種種莊嚴色。\n> 661｜第六他化自在天，於彼雲色如黃金，\n> 662｜化樂天上雲赤色，兜率陀天白寶色，\n> 663｜夜摩天上瑠璃色，三十三天碼碯色，\n> 664｜四王天上玻瓈色，於大海上金剛色，\n> 665｜緊那羅中妙香色，諸龍住處蓮華色，\n> 666｜微密天中白鵝色，阿脩羅中狀如山，\n> 667｜欝單越中金野馬，閻浮提境雲青色，\n> 668｜餘二天下雜種色，隨眾所樂以應之。\n> 669｜又復他化自在天，雲中電耀如日光，\n> 670｜化樂天上如月光，兜率天上閻浮金，\n> 671｜夜摩天上白寶色，釋處金雲如野馬，\n> 672｜四王天上最妙色，於大海上赤寶色，\n> 673｜緊那羅中青瑠璃，諸龍住處寶藏色，\n> 674｜微密天中玻瓈色，阿脩羅中瑪瑙色，\n> 675｜欝單越境火珠色，閻浮提界青寶色，\n> 676｜餘二天下雜莊嚴，隨眾所樂以應之。\n> 677｜他化雷震如梵音，化樂天上妙音聲，\n> 678｜兜率天上妓樂音，夜摩天上天女音，\n> 679｜於彼忉利諸天上，緊那羅女妙音聲，\n> 680｜四王天上乾闥聲，緊那羅中簫笛聲，\n> 681｜於彼一切大海中，猶如兩山相擊聲，\n> 682｜諸龍住處頻伽聲，微密天中龍女聲，\n> 683｜阿脩羅中天鼓聲，於人道中海潮聲。\n> 684｜又復他化自在天，雨妙香華為莊嚴，\n> 685｜化樂天上薝蔔華，曼陀羅華及澤香，\n> 686｜兜率天上摩尼珠，無上種種莊嚴寶，\n> 687｜明淨髻珠如月光，上妙細衣鍊金色，\n> 688｜夜摩幢蓋幡莊嚴，華鬘塗香勝莊嚴，\n> 689｜赤真珠衣金絞絡，種種微妙眾妓樂，\n> 690｜三十三天如意珠，堅固殊妙栴檀香，\n> 691｜種種欝金諸天華，雨雜清淨華香水，\n> 692｜四王天雨上味膳，眾味具足生氣力。\n> 693｜又雨不可思議寶，龍王降是種種雨，\n> 694｜又復於彼大海中，一一雨渧如車軸，\n> 695｜無量眾寶不可盡，又雨種種莊嚴寶，\n> 696｜緊那雨華青寶衣，摩利妙華細末香，\n> 697｜種種妓樂悉具足，如是無量妙莊嚴。\n> 698｜諸龍住處赤真珠，微密天中火珠寶，\n> 699｜阿脩羅中雨兵仗，摧伏一切諸怨敵。\n> 700｜欝單無價寶瓔珞，弗婆俱耶二天下，\n> 701｜婆師波利薝蔔華，清淨妙寶解脫華，\n> 702｜閻浮提雨清淨水，柔軟悅澤常 1–210565·卷十六·496 行窗口·分页符行剔除·余照原档行序·康熙部首码位已归一正字（L.199）·块块首尾相接即全文·无缺段〔程序验：各块串接 CJK＝窗口 CJK·注入器断言〕·窗口尾「大方廣佛華嚴經疏卷第十六／十七」两行及撰人衔照原位保留·本附录在 §二 审计区外不污引文审计）：\n\n**甲·品题科首（唐·清凉山大华严寺沙门澄观撰·卷十六）**\n\n賢首品第十二\n\n**乙·来意（行不虛設必有其德·收前行願成信德用·智首舉果徵因）**\n\n> 初來意者。夫行不虛設必有其德。既解行圓妙必勝德難思。收前行願 成信德用。故次來也。又前智首舉果徵因。文殊廣顯其因。略標其\n\n> 果。云獲一切勝妙功德。故問賢首令廣斯言。是以偈初躡前起後。二\n\n**丙·释名·宗趣（體性至順調善曰賢·於信門中成普賢行德）**\n\n> 釋名者。謂體性至順調善曰賢。吉祥勝德超絕名首。即以此名菩薩演 說此法。賢即是首。賢首之品。以當賢位之初攝諸德。故偏舉賢名。\n\n> 三宗趣者。於信門中成普賢行德。而自在莊嚴。無方大用建立眾生。 通貫始終該攝諸位。以為其宗。令起圓融信行成位德用。而為意趣。\n\n**丁·释文三分·经家叙述·正明发起（結前净行·客塵不濁·悲智雙游·長行影略）**\n\n> 四釋文者文有三分。初文殊發起。次賢首廣說。三十方現證。今初分 二。初經家敘述。二正明發起。二段各有結前生後。今初。先結前已\n\n> 說。順違皆順客塵不能濁其心。悲智雙游萬境不能亂其慮。是曰清淨 行矣。大功德者。即前所成之果。後欲顯示下生後。文含始終。約終\n\n> 則顯示信滿菩提心殊勝功德。廣具五位因行盡故。約始但於生死誓證 菩提。萬德攸依故。今顯。示二偈。正發起中前半結前。偈文窄故略\n\n> 無所成之德。後半勸說。令說修行之德。則與長行文有影略。第二時 賢首下。賢首廣說。於中先總標舉。以偈答者此略有二。一少言攝多\n\n> 義故。二美詞讚說令淨信故。以始德該終散說難盡故。顯此勝妙之功\n\n**戊一·正顯偈詞大三分（三百五十九頌半·四頌謙讚許說／三百四十六偈半正說勝德／九偈校量勸持）**\n\n> 德故。第二正顯偈詞。有三百五十九頌半。大為三分。初四頌謙讚許 說分。次三百四十六偈半。正說勝德分。三九偈校量勸持分。初中分\n\n> 二。初偈總明。前半讚問勸修。後半謙己少說。海喻次下當明。後三 開章以發心之德。況出修行巧顯深廣。於中初偈舉發心章。次偈況出\n\n> 修行章。初心祈於當證德已叵量。況長時入位遍修故。多佛不能盡 說。後偈許說分齊。前半法說。如是者雙指發心修行。下文具顯故前\n\n> 文雙問故。後半喻明。然有二意。一顯喻少分。謂發心行德如太空大 地。所說者陿如足履一塵。二密喻不異。謂鳥足之空不異太空。微細\n\n> 之塵不殊大地。故此略說義無不周。若廣若略皆無邊故。出現品云。 如鳥飛虛空經於百年。已經過處未經過處。皆不可量。何以故。虛空\n\n> 無邊際故等。彼就果行。此就因德。然普賢行德似同佛果。是故皆以 虛空為量。上下文中皆同此說。此初發心。與下文十住初發心住。及\n\n> 發心功德品。各何別耶。此中發心該於初後。取其成德乃是信終。取 其為本乃在初發。雖如輕毛功歸初簣故。十住初發。即是此終成彼初\n\n> 發。此終為能發彼是所發。此正是發起之發。義兼開發彼是開發之 發。義兼發起。其發心品。正顯十住初心之功德耳。以斯甄別非無有\n\n> 異。故瓔珞云。發心住者。是人始從具縛未識三寶。乃至值佛菩薩 教。法中起一念信。便發菩提心。既云始從凡夫最初發心。明知此中\n\n> 發心該於初後。問此既是初。何得乃具後諸行位及普賢德耶。古德釋 此略有二門。一行布次第門。謂從微至著從淺至深。次第相乘以階彼\n\n> 岸。如瓔珞仁王起信瑜伽等說。二圓融通攝門。謂一位即具一切位 等。如此經所說亦如大品等中。一行具一切行。此中有二門。一緣起\n\n> 相由門。二法界融攝門。前中普攬一切始終諸位。無邊行海同一緣 起。為普賢行德。良以諸緣相望略有二義。一約用。由相待故。有有\n\n> 力無力義。是故得相收及相入也。二約體。由相作故。有有體無體 義。是故得相即及相入是也。此經之中依斯義故。行位相收總有四\n\n> 說。一或始具終。如此門中。具一切行位。普賢德海者是也。二或終 具始。並在十地位。後如下文十定十通等說。三或諸位齊收並在十住\n\n> 等。一一位中各收一切。悉至究竟。如下文十住十行等說。四或諸位 皆泯行德顯然。如離世間品說。二法界融攝門者。謂此諸位及所修\n\n> 行。皆不離普賢無盡法界。然此法界圓融無限。隨在一位即具一切。 今在信門收無不盡。下諸位中皆具一切者。並準此釋。問下發心功德\n\n> 品。亦說初心具無邊德。與此何別。答此據行首信門所具。彼約行本 菩提心具。問約法相收是則可爾。約人修行。豈十千劫修信纔滿。即\n\n> 得如此無邊德海。答以法是圓融具德法故。若諸菩薩行此法行。是彼 所收。或無量劫或無定限。十千劫言非此所說。如下善財童子。及兜\n\n> 率天子等所行所得。並是其人不同。行布次第教中之所說也。又十千 劫。乃是一經。瓔珞但言一劫二劫。此經縱有行布亦皆圓融。亦有引\n\n> 此下文證成。此信乃是捨異生性。成就聖性出無明地。生如來家。以 有則獲灌頂而升位等。非是信故。若爾初地豈得灌頂升位等耶。若云\n\n> 展轉進入佛地。何以不得始自於信展轉入耶。若許從信展轉入者。何 以要判此乃捨凡入聖。下文自有十地之會。此中尚隔住行向等。判為\n\n> 入地。乃孟浪之談。下發心品。亦判為初地發心義。同此會。問下云 無量億劫勤修學。得是無上菩提智。斯則非一生也。亦非十千以為無\n\n> 量。通斯難者應有二義。一此約行布展轉義故。二約圓融展促無礙義 故。如上所辨故。善財見仙人。執手一一佛所。經無量劫故。修短難\n\n> 思特由於此故。賢首菩薩云。信大乘者猶為易。能信此法倍更難。以 初心即具一切功德。故難信也。第二菩薩發意下。正明發心修行勝\n\n**戊二·文分為五（发心行相五頌—信為道元—若常信奉—若為諸佛—或有剎土·结言尽此）**\n\n> 德。文分為五。初五頌發心行相。二信為道元下略示勝能。三若常信 奉下。所具行位。四或有剎土下無方大用。五一切如來下。喻況玄\n\n> 旨。然此五段。初一顯正發心。後四發心之德。第三亦兼修行。此及 後二皆修行之德。今初發心行相中。初偈總標餘文別顯瑜伽菩薩地。\n\n> 明發心有五種相。一自性。二行相。三所緣。四功德。五最勝。今文 五偈具之。謂發意。即是正願為發心自性也。希求菩提及下作有情義\n\n> 利。即行相也。菩提三寶有情皆其所緣。能攝一切菩提分法。為其功 德。不求五欲等。反顯菩薩所求最勝。言因緣者。謂親能發起求大菩\n\n> 提曰因。假之助發為緣。因即自性住性內熏之力。緣即習所成性。又 上二皆因善友及境外熏為緣。瑜伽云。由有四因四緣四力。菩薩發\n\n> 心。四因者。一種性具足。二賴佛菩薩善友攝受。三多起悲心。四長 時猛利難行苦行。無所怯畏。四緣者。一見聞佛神變威力。二聞法微\n\n> 妙。三見法欲滅。四見生受惑業苦。四力者。一自力。二他力。三因 力。以宿習故。四加行力。謂於現法親善聞法修善加行故。若具上因\n\n> 緣及初三二力。當知不退。若因二四力心不堅固。今經即初及三也。 又起信論智印經。有七因緣如彼應知。下別顯中。以三因四緣攝上諸\n\n> 義。三因者。謂信悲智。四緣者。三寶眾生也。今文中。後半總以信 智因緣三寶境。信謂於實德能深忍樂欲心淨為性。故云淨信。然實謂\n\n> 一切事理。德謂三寶淨德。能謂世出世善有其力能。今法寶中已攝初 後。亦三寶中。皆具此三。體實具德。大用救生故。大者智心求大菩\n\n> 提。廣者悲心廣濟含識。翻彼二乘小陿心也。別中初半偈揀去偏偽。 謂攝眷屬過。所不能染故。文中不求五事求即過故。一若求人天五\n\n> 欲。此能長貪多是鬼因。二求王位長瞋多地獄因。三求富饒長癡是畜 生因。實通三塗各從多說。四求自樂是二乘因。五求大名稱若勝負\n\n> 心。是修羅因。若我慢心是外道因。又以理求樂是人天因。為王攝屬 是魔羅因。有二乘心目之為偏。有餘心者名之為偽。後三偈半直顯真\n\n> 正別釋因緣。於中初偈悲因。下救嚴土供佛。亦為調生故。滅苦是 悲。利樂是慈。次一偈半大智上供。上二不二為真正發心。後偈總結\n\n> 成信。兼信因行。其中對上四因四緣。可以意得。又上從不求五欲。 下即顯信心之德故。瓔珞經云。修十信心須具十德。今文並具但不次\n\n> 耳。一遭苦能忍。即前反顯。二正顯中。初二句即慈悲深厚。三次句 及莊嚴國土。即修習善根。謂利他善及淨土因故。四有三字即供養諸\n\n> 佛。五受持一句志求勝法。六證菩提故即求佛智慧。七一句即深心平 等。八次二句即親近善友。九次二句即心常柔和。謂至誠供養柔和善\n\n> 順於佛法故。十有二句即愛樂大乘。十德備矣。又此十德。即求菩提 之意。下經休舍云。欲教化調伏一切眾生。盡無餘故發菩提心等。又\n\n> 末後偈。初句即自性住佛性。以信心佛眾生無差別故。方是真法可謂 深信。次句即引出佛性。後句即至得果性。又文有四弘。可以意得。\n\n> 又上云深心信解常清淨者。與理相應方曰深心。若昔染今淨。淨則有 始始即必終。非常淨也。信煩惱即菩提方為常淨。由稱本性而發心\n\n> 故。本來是佛。更無所進如在虛空。退至何所。慨眾生之迷此。起同 體大悲悼昔不知誓期當證。有悲故不為無邊所寂。有智故不為有邊所\n\n> 動。不動不寂直入中道。是謂真正發菩提心。第二信為道元下。七頌 略示勝能。於中初一頌總標。次五頌別釋。後一頌總結今初。初句又\n\n> 標道有二義。一果所謂菩提涅槃。二因謂三賢十聖。乘一直道。元亦 二義。一本義。菩提本故。其猶滔滔之水始於濫觴。二首義。元者善\n\n> 之長也。即一因之初功德。二義通因及果。母有二義。生長養育。下 三句共釋初句。長養即母二義。亦道元義。一切善法及第二句。即因\n\n> 功德。第三一句即果功德。無上道者。即大菩提。由信長善得此菩 提。由信斷疑出愛成涅槃證。不信身心如來知見。豈能開示菩提涅\n\n> 槃。次信無垢濁下。別顯中有二十句。一句辨一勝能。一心淨為性 故。能翻不信濁。二信理普敬故翻憍慢。三十藏之內信即是藏。七聖\n\n> 財中信為第一。四信方受取奉行。五信財如夢故無所悋。六智論云。 佛法大海信為能入。七增福智因。八到二嚴果。九十五根五力各在初\n\n> 故。十一信本無惑方斷惑根。十二若向餘德不名淨信。十三信境本空 故無所著。十四正信之人不生八難。十五非不正信。十六正信解脫。\n\n> 十七成不壞本。十八為菩提根。十九增佛勝智。二十究竟見佛。謂信 自己心自佛出現。信外諸佛諸佛現前故。下經云。一切諸佛從信心\n\n> 起。三是故下一偈。總結勝能。前法後喻。信樂者信三寶性。已於方 便諸度。求欲修行。信樂二字是菩薩正意。由此二故。於諸行有能故\n\n> 名最勝。非佛不信故云難得。喻如意珠。略有五義。一勝義。法寶中 王故。二希義。非佛輪王餘無有故。三淨義。能清不信濁故。四貴\n\n> 義。出位行寶等不可盡故。五蘊義。蘊眾德物無障礙故。第三若常信 奉下五十頌半。廣明信中所具行位。然有二意。一行布。二圓融。古\n\n> 約圓融故名信中所具。於中三。初明所具行。次辨所具位。三結歎功 德。今初八。頌半分二。先五頌明信三寶以成諸行。後三頌半。明信\n\n> 展轉以成諸行。前中初三頌信佛成行。初二句標章。持戒惡止也。修 學處善行也。瑜伽云既發心已。應於七處修學故名學處謂一自利處。\n\n> 二利他處。三真實義處。四威力處。五成熟有情處。六成熟自佛法 處。七無上正等菩提處。次一偈半雙顯二德。若不持戒。尚不能得疥\n\n> 癩野干之身。況於菩提。戒止妄非則性淨。菩提開發。因果功德。皆 依學處而生。故云地也。後一偈別明成供養行。謂財法供養故云大\n\n> 也。次一信法。後一偈信僧。文並可知。二有三頌半。成展轉行。展 轉依前功歸於信。二若為諸佛下。三十九頌明所具諸位。於中成後四\n\n> 位。即為四段。初三頌明十住位。有六句。初句發心住。次句治地修 行二住。次句生貴住。次句方便具足住。次句正心住。後句增上是不\n\n> 退住。最勝心是後三住。準下釋之。二若得增上下。二頌半明十行 位。波羅蜜是十行總名。摩訶衍是異二乘行。初二行收如法供養。是\n\n> 順理行。次二行攝念佛心不動。及常見佛並是定慧行。故屬後六行。 釋相可知。三若常覩見下。三頌明十迴向位。通顯三種迴向。佛體常\n\n> 住是向菩提。法永不滅是向實際。餘向眾生。四若得堅固下。三十頌 半明十地位。初半頌是初地。謂深法是所證真如。愛樂是極喜異名。\n\n> 二半頌是離垢地。以離犯戒有為過故。三一頌離慢等。是三四二地。 以三地於禪不著故無慢又以求法不懈亦名離慢。第四地得出世間道\n\n> 品。故云無放逸。然不捨攝生故云兼利四有一頌。明五地。謂雖得出 世而還處生死故無厭。真俗互違難合能合。餘地不過故云勇健無能\n\n> 勝。此是難勝之名也五有一頌明第六地。悲智不住般若現前。謂神通 攝物是大悲行。知眾生行是十二緣生。是大智行。六二頌半明七地。\n\n> 謂初一明有中殊勝行。後一頌半明空中方便智。準釋可知。七若具最 勝下。三頌明第八地。略辨六義。一道勝。謂無功用道。故云勇猛無\n\n> 上。二力勝。謂智力摧魔。三用勝。謂超四魔境捨分段。故無蘊魔。 無捨命故無死魔。惑不現行故超煩惱魔。覺佛十力故超天魔。四位\n\n> 勝。不動地故云不退也。五行勝。謂得無生忍。六因勝。謂此位中當 大授記位也。八二頌明第九地作大法師。略辨四義。一諸佛加持名佛\n\n> 現前。二解了諸佛深密之法。三諸佛憶念增其慧力。四佛德自嚴為眾\n\n**戊三·第十地位分五（九若以佛德下十九頌·三業殊勝—三句喻前法眼常全）**\n\n> 說法。九若以佛德下。十九頌。明第十地位分五。初八頌三業殊勝 德。初五頌半身業。於中前三頌明身體德殊勝。後二頌半明身業大\n\n> 用。次演說一頌半。語業勝說法益生。後二頌意業勝智先導故。二若 以智慧為先下。四頌明三業廣大功。三輪攝生德。初一頌身業。次一\n\n> 語業。後二意業。三若知煩惱下。二頌辨得法結位。四若得十地下。 三頌明三昧分大盡分受位分。並顯可知。五若蒙下。二頌明大用難\n\n> 測。亦是釋名分事也。謂以大法智雲含眾德水。能蔽如空麁重故。又 若蒙下二頌。亦是進入佛地。第三菩薩勤修下。三頌結歎其德。初二\n\n> 法說。後一喻況。前中賢首云。初二句悲願內滿。謂菩薩勤修等者。 結前若字下義。無不果者。結前則字下義。以若有彼則有此。非是前\n\n> 後鉤鎖相因。唯是本位信字。有此則有彼。同時具有而說有前後。是 故信門具足一切行位之相。然行雖無量。皆以悲願為首。故就此結\n\n> 之。次二句。明此悲願益物不空。次一頌。結前所具行位。初句舉人 標法。威神即信為能具之由。次句結能證智。眼證如如永常故。次二\n\n> 句結所證道。十善舉二地行。等取餘地及餘位餘道。謂教證等勝寶皆 現。後一頌喻況。唯喻後偈。初句及威力喻前初句。信體堅固以喻金\n\n> 剛。並居智海之內以信。威力能生。所生眾寶即喻前第三句行位。第\n\n**戊四·无方大用二百三頌·十門名单·海印三昧（一圓明海印—十寂用無涯·今初六頌明海印·十義）**\n\n>第四或有剎土下。二百三頌明無方大用。分彼能無邊大用者。由普賢德遍一切時處法界無限故。 略辨十門三昧業用。一圓明海印三昧門。二華嚴妙行三昧門。三因陀羅網三昧門。四手出廣供三昧門。五現諸法門三昧門。六四攝攝生三昧門。七俯同世間三昧門。八毛光照益三昧門。九主伴 嚴麗三昧門。十寂用無涯三昧門。以無不定心故皆云三昧。作用不同略辨十種。又初門依體起用\n\n>。末後明用不異體。中間並顯妙用自在。又十三昧皆具此三。今初六頌明海印三昧。文分為二。 前五別明業用周遍。後一總結大用所依。前中三。初三佛事。次一三乘。後一類餘。總顯十法界之化也。前中初一總明現佛說法。次一體用自在。初句揀非二義。一念無分別。二動無功用。下 三句顯正二義。謂無念之念。一念遍於十方。無功之功。多門攝於群品。月喻四義準法可知。後\n\n>一結用所依。海印之義。昔雖略解未盡其源。今以十義釋之。以表無盡之用。下經云。如淨水中 。四兵像。乃至莫不皆於水中現。又云。海有希奇殊特法。能為一切平等印眾生寶物及川流。普悉包容無所拒故。大集十四云。如閻浮提一切眾生身。及餘外色。如是等色海中皆有印像。以是 故名大海為印。菩薩亦爾。得大海印三昧。已能分別見一切眾生心行。於一切法門\n\n>皆得慧明。是為菩薩得海印三昧。見一切眾生心行所趣。然此經文多同出現。但出現現於四天下 像。又約佛菩提。大集唯閻浮約菩薩所得。然皆見心所趣等了根器也。此文所現形類應根器也。二文互舉皆是所現。菩薩定心以為能現。言十義者。一無心能現義。經云無有功用無分別故。二 現無所現義。經云如光影故。出現品云普現一切眾生心念根性欲樂。而無所現故。三能現與所現\n\n>非一義。四非異義。經云大海能現能所異故非一。水外求像不可得故非異。顯此定心與所現法。 即性之相能所宛然。即相之性物我無二。五無去來義。水不上取物不下就。而能顯現。三昧之心亦爾。現萬法於自心。彼亦不來。羅身雲於法界。未曾暫去。上之五義與鏡喻大同。六廣大義。 經云遍十方故。普悉包容無所拒故。明三昧心周于法界。則眾生色心皆定心中物。用周法界亦不\n\n>離此心。七普現義。經云一切皆能現故。出現云菩提普印諸心行故。此與廣大異者。此約所現不 揀巨細。彼約能現其量普周。又此約所現無類不現。彼約能現無行不修。八頓現義。經云一念現故。謂無前後如印頓成。九常現義。非如明鏡有現不現時。十非現現義。非如明鏡對至方現。經 云現於四天下像故。四兵羅空對而可現。四天之像不對而現。故云非現現也。以不待對。是故常\n\n>現該三際也。具上十義故稱海印。諸佛窮究菩薩相似。問仁王三賢。都無八相之文 。初地方云。方生百三千一時成正覺。此之八相豈在信門。答即上所引大集亦云。灌頂住菩薩得佛神力。若菩薩成就如是等法。能於無佛世界示現八相。乃至廣說。彼說住終。若占察經漸次作 佛。略有四種。何等為四。一者信滿法故作佛。所謂依種性地。決定信諸法不生不滅清淨平等。\n\n>無可願求故。二解滿作佛。三證滿作佛。謂淨心地。四一切功德行滿作佛。依究竟菩薩地。起信 依此說信成就發心。能八相作佛。文據昭然。況圓融門中不依位次。寄終教說信滿即能。因果無礙。以因門取常是菩薩以果門取即恒是佛。或雙存俱泯自在難思。又此化現非唯一位。依一類界 而能具攝一切地位。遍於時處。故云念念遍十方也。\n\n**戊五·二華嚴—三因陀羅網—四手出廣供—五現諸法門**\n\n> 念遍十方也。第二嚴淨下。華嚴好行三昧。文有十句。略辨七行。前 六句各一行。七八是十度行。九結上自在。十總結所依。萬行如華嚴\n\n> 法身故。餘如別說。第三一微塵中下。四頌明因陀羅網三昧門。於中 初二句。標定心境。然有二意。一由一多相即故入一定能成多定。由\n\n> 成多定。令一塵內有一切塵。一一塵中現一切剎。二但令一塵現剎一 切亦爾。故云成就一切微塵定。次二句明不壞相而普現。故云不增。\n\n> 次二頌明一塵中所現剎相。無礙如焰重現如帝網。次半頌舉一例餘。 亦有二意。一例上一塵之內所具之塵。二例如一塵入定示現。餘塵入\n\n> 定示現亦然。後二句結用所因。略辨三門。一三昧力。此同標中。二 不思議解脫力。如不思議品云。於一塵中現三世佛剎等。三神通力。\n\n> 謂幻通自在並如下說。第四若欲下十八頌。明手出廣供三昧門。初一 總標。後一通結。中間別顯。欲顯勝妙略舉一手。為供所依。由於昔\n\n> 時以手持供供佛施人。稱周法界。故令真流供具等諸佛之難思。第五 菩薩住下。八頌明現諸法門三昧門分四。初一總標多門。二有五頌。\n\n> 別顯二十種門供等。即門通入佛果故。三一頌半結多所因。由四悉檀 故。初半對治。次半世界。隨行差別即當為人。而成就言。謂第一\n\n**戊六·六四攝—七俯同世間（篾戾車語說四聖諦·一心說法得語實性）**\n\n> 義。四半頌結用難測。第六有妙下。十七頌明四攝攝生三昧門文分為 二。初一偈總標名用。餘頌別顯。於中分四。初四頌布施攝。初一偈\n\n> 半。求受用者恣其所須。次半偈。求自在者施以王位。又此施位即難 行施。以是可愛著故。次偈身行法施。後偈妙色悅心。是無畏施。又\n\n> 後二偈。初身行法儀。後服世妙飾。貴悅物心隨求即與。次二頌愛語 攝。一切愛語。謂慰喻慶悅勝益之言。言種種梵音者。即八種梵音。\n\n> 一最好聲。其音清雅。如迦陵鳥。二易了聲。言辭辯了。三和調。四 柔軟。五不誤。六不女。七尊慧。八深遠。言俱枳羅者。亦云都吒\n\n> 迦。此云眾音合和。微妙最勝皆愛語之具。隨心說法應在後偈。隨世 所宜應在前偈。以瑜伽一切愛語略有二種。一隨世儀軌語。二順正法\n\n> 教語。今開示佛說八萬法門。即順正教也。三有二頌明同事攝。物見 菩薩俯同其事。知有義利而修行故。於中初頌一切同事。八風等事皆\n\n> 悉同故。後偈謂行同事。忍於諸苦而同事故。四有八頌。明利行攝。 謂說趣義利之行。以益有情。於中初二偈。一切利行。此有三種。一\n\n> 於現法利勸導利行。謂令以德業招守財位。以益近故。經文略無。二 於後法利行。謂勸捨財位清淨出家。即當初偈。三於現法後法利行。\n\n> 謂勸離欲即後偈也。又初一偈。即難行利行。此自有三。一不識出 離。即外道異執。二不求解脫。即未種善因。三現捨國財。誘耽財位\n\n> 於此利行。是謂難行。次一句即攝二利行。一即十種清淨利行也。二 令離十惡。即此世他世樂利行。次三句即善士利行。慈心勸導等故。\n\n> 次二偈即遂求利行。謂眾生為八纏所繞開解令離故名遂求。初偈即化 無愧纏。以恃壽長不知進修。不知此身但婬欲生。終竟敗壞。具諸煩\n\n> 惱故。後偈開解無慚纏眾生。餘略不具。次二偈即一切種利行。初偈 即應攝受者而攝受之。後偈即應調伏者而調伏等。後一偈即一切門利\n\n> 行。謂不信令信故。亦總結諸利行也。瑜伽廣說利行居先略明同事居 後。此則先略明同事者。以利行中若以行勸修。與愛語相近。若自示\n\n> 行即同事相近。同事即是利行。利行未必同事。此二相近廣略互彰 耳。又次下三昧。亦同事故。第七雅思下。十七頌俯同世間三昧門。\n\n> 於中三。初六身同世間利益眾生。若依若正無不示為。次六示同外道 救彼邪黨。初五別辨。後一總結。義如別說。三眾生迷惑下。五頌明\n\n> 語業大用。初一總明。次三別顯。後一總結。別中云或邊呪語者。梵 云達邏鼻茶曼達邏鉢底鞞。言達邏鼻荼者。是南印度中邊國名也。此\n\n> 云消融。曼達邏者呪也。鉢底鞞者句也。謂其國人稟性純質。凡所出 言皆成神呪。若隣國侵害不用兵仗。但以言破之。彼自喪滅故曰消融\n\n> 呪句也。或云。唯童男童女方得言成呪句。餘不得也。又天密語等 者。婆沙七十九說。世尊有時為四天王。以聖語說四諦。二王領解二\n\n> 不能解。世尊憐愍故。以南印度邊國俗語說四諦。二天王中一解一不 解。世尊憐愍故。復以一種篾戾車語。說四聖諦。時四天王皆得領\n\n> 解。善破於他者。以因明比量等。真能破故。非外所動者。真能立 故。不為他破。後一偈類結。非唯說四諦。六度萬行等皆然。一心說\n\n> 法得語實性。能起隨類之用。名三昧力 (已下第十五經)\n\n**戊七·八毛光照益（八十九頌半·文分為五·門号叠咏疏解）**\n\n>第八有勝三昧下。八十九頌半。明毛光照益三昧門。智契解脫之門。慈熏身語意業。故得身同法 界大用無涯。毛光觸物為益萬品。遍於時處緣者會之。是謂菩薩圓建立眾生也。文分為五。初一頌標門總辨。二所放光明下別明一毛光明業用。三如一毛下。類顯一切毛光業用。四如其本行下 。釋成分齊。五若有聞下。聞信光益。今初。就所益說故名安樂。就第二段中二。\n\n>初略辨四十四門光用。後如是等下結略顯廣。就四十四光中皆有四義。一標光名。二辨光用。三 出光因。四結光果。類例相從分為十段五對。初有二光顯示三寶。二有四光令發大心。上二即三寶四弘對。三有二光總圓福智。四有二光入理持法。上即二嚴二持對。五有六光六度行圓。六有 七光四等救攝。即六度四等對。七有一光總彰三學。八有八光。雜彰萬行供養為先。為三學萬行\n\n>對。九有六光。令六根內淨動與理會。十有六光。明六塵外淨觸境皆道。即根清境淨對。今初。 二光中。前一顯現。於中初句標名以近初標。但云所放不言又放。次三句辨用。後偈辨因中。示三寶令其正歸。示正道令其正向。上通一體及別相三寶。亦示佛塔。令其正信義兼住持。後一光 照耀用有七句。一偈辨因並顯可知。第二四光。令發大心中即四弘願也。初一令眾生無邊誓願度\n\n>。因中興有為而毀有為。二一光令煩惱無邊誓願斷。因中興有為而讚禪定。上二皆事理兼修。三 上欣佛果。四愛樂三寶窮盡法門。因中四弘之終故。總結云及示發心功德行。第三有二光總圓福智。智因中分別法相。決了真理無虧理事。不減佛法故。得一念悉解多門。第四二光入理持法。 初一慧入二空即義持也。後一具四總持於法自在。第五六度光中戒因中。云發大心者。謂若發二\n\n>乘心。則破淨戒。大心導善不在人天。勤策萬行慧為上首。各加一偈餘可思之。第 六有七光。四等救攝中。初一慈光與佛慧真樂見無量佛。此有二義。一見事佛。真樂因故。二見心佛。一一心華有覺性故。次三悲光拔苦。初一厄難苦。次一疾病苦。後一死苦。令見佛者。一 捨命不恐。二惡道不畏。又要臨終勸者。智論二十八云。臨終少時。能勝終身行力。以猛利故。\n\n>如火如毒。依西域法。有欲捨命者令面向西於前安一立像。亦面向西。以旛頭挂像手指。令病人 手捉旛脚。口稱佛名。作隨佛往生淨土之意。兼與燒香鳴磬助稱佛名。若能行此。非直亡者得生佛前。抑亦終成見佛光也。若神游大方去留無礙者。置之言外。不爾勉旃斯行。次二光令生法喜 。初則欣法聽說。法喜已充。終則觸境無非佛法。成喜之極。後一令成大捨。捨除放逸眾惑之根\n\n>。第七一光總彰萬行。三學攝盡故曰普聞。第八八光雜明諸行供養為先。前五供敬由。後三施悲 田。第九六光內淨六根。第十六光外清六境。文並可知。戈者平頭戟也。鋋者小矛也。第二如是等比下。結略顯廣。一毛之用光。有塵沙。第三如一毛下。類顯一切毛光業用。及結用所依。謂 三昧力。第四如其下釋成分齊。如是等光。今何不見。謂有緣者見如目覩光。無緣不覺盲瞽常闇\n\n>。於中分二。初偈總明。如其本行牒前往因。所得光者。牒前果用。若有宿緣及曾同行者。則隨 其所見如是差別。後六偈別顯。於中初二法說。後四喻說。前中初偈宿緣。宿有四緣。一昔同業。二愛其行。三能隨喜。四但見所作。後偈現因。不必有緣但功行內著。光明爰燭 。有三種因。一修廣福。二供多佛。三求佛果。即福智二嚴也。上之七類皆蒙光照。二喻說中。\n\n>雙明見與不見二喻。皆有法合。初日出喻喻光為益因。合中謂法日常明。有智慧者心不住法。如 人有目則能得見。有三類人則不能見。一者凡愚。二邪信外道。三劣解二乘。皆無因緣如人無目。後寶嚴喻。喻光正益。明法寶常存。由福無福有處不處。第五若有下。一頌明聞信光益。謂信 仰解了不生疑惑。則成佛果。不以不見疑菩薩之無光。不以極苦莫救謂光明之無益。亦不高推果\n\n>用謂菩薩不能。故云永斷諸疑。\n\n**戊八·九主伴嚴麗—十寂用無涯三昧門**\n\n> 云永斷諸疑。第九有勝三昧下。六頌。主伴嚴麗三昧門。亦是出現三 昧文分三別。初一標門顯意。次四明一方業用。於中前三法說。後一\n\n> 喻合。既言量等三千。則不壞次第。劣於十地及等覺也。三一頌類顯 十方。第十有勝三昧名方網下。三十四頌半。明寂用無涯三昧門。約\n\n> 處名為方網。約相是謂寂用。亦總顯上來動寂無二故。文分為三。初 一標名總辨。十方交絡出入縱橫。故名為網。二或於下。三十二頌半\n\n> 正顯業用。三是名下一頌。總結難思。就業用中分三。初二頌。於十 方處交絡出入。明於器世間自在。二有五頌。十方佛所入出無礙。明\n\n> 於智正覺世間自在。三於眼根下。二十五頌半。通顯於三世間自在。 菩薩於三世間自在。略有二義。一以自身作三世間。故得自在。二菩\n\n> 薩於三世間處示現自在。今此三段。初二約後義。後一通二義。文或 綺互理實皆具。初二世間略有四重無礙。一約處。謂東處即是西處。\n\n> 是故菩薩常在東恒在西也。二約佛。謂東佛即西佛。是故在東佛恒在 西佛。三約菩薩身不分。謂在東之身即是西身。四約定。謂入定即是\n\n> 出定。所以爾者。略顯二因。一以所觀之法。事隨理融相即在故。二 能觀之心。亦寂用無礙故。然此文中。為顯菩薩祕密隱顯自在德故。\n\n> 但說後二。若辨前二。則似菩薩無力。三於眼下。通顯於三世間自 在。文分為四。一明根境相對以辨自在。二童子下。明於他身自在。\n\n> 三鬼神下。明微細自在。四一切塵下。器界事中以辨自在。今初。十 二頌六對。一一對中。有十義五對無礙之相。欲辨無礙先須明識定\n\n> 慧。此中云三昧起者觀也。入正受者定也。定慧雖多不出二種。一事 二理。制之一處無事不辦。事定門也。能觀心性契理不動。理定門\n\n> 也。明達法相事觀也。善了無生理觀也。諸經論中或單說事定。或但 明理定。二觀亦然。或敵體事理止觀相對。或以事觀對於理定。如起\n\n> 信論。止一切相乃至心不可得為止。而觀因緣生滅為觀。或以理觀對 於事定。下經云。一心不動入諸禪。了境無生名般若是也。或俱通\n\n> 二。如下云。禪定持心常一緣。智慧了境同三昧是也。或二俱泯非定 非散。或即觀之定但名為定。如觀心性名上定是也。或即定之觀但名\n\n> 為觀。如以無分別智觀名般若是也。或說雙運。謂即寂之照是也。所 以局見之者隨矚一文。互相非撥。偏修之者隨入一門。皆有剋證。然\n\n> 非圓暢。今此經文巧顯無礙。言五對者。第一對根境無礙。謂觀根入 定應從根出。而從境出者。為顯根境唯是一心。緣起無二理性融通。\n\n> 是故根入境出耳。境入根出亦然。第二對理事二定無礙。謂分別事相 應入事定。而入理定。欲觀性空應入理定。而入事定。以契即事之理\n\n> 而不動故。入理即是入事。制心即理之事而一緣故。入事即是入理。 而經文但云入正定。不言理事。及乎出觀境中。即云分別色相斯事觀\n\n> 也。根中即云性空寂者。理觀也。亦合將根事對於境理。以辨無礙。 第三對事理二觀無礙。謂欲分別事相。應從事觀起而反從理觀起者。\n\n> 以所觀之境既真俗雙融法界不二故。分別事智即是無生之智。二觀唯 是一心故。亦應將境事理對根事理。以辨無礙。第四對出入無礙。以\n\n> 起定即是入定故。起定而心不亂。若以事理相望。應成四句。謂事入 事起事入理起等。若以根境相望。又成四句。謂根事入境事起等。一\n\n> 一思之皆有所由。第五對二利體用無礙。謂於眼根起定心不亂是體 也。自利也。而不礙現於廣境是用也。人天不能知利他也。良以體用\n\n> 無二故。自利即是利他。此上十義。同為一聚法界緣起相即自在。菩 薩善達作用無礙。思之思之。又經且約根境相對。亦應境境相對。謂\n\n> 色塵入正受。聲香三昧起等。此如下童子身中入正定等中明。復應根 根相對。謂眼根入正受。耳根三昧起等。一塵入正受多根三昧起等。\n\n> 並略故不說。上來無礙深妙難思。始學之流如何趣入。今當總結。但 能知事理無礙根境一如。念慮不生自當趣入。又向云色性難思等。即\n\n> 色等總持。是色陀羅尼自在佛等。亦應云分別眼性難思。有眼陀羅尼 自在佛等。又眼中云性空寂滅。即眼之度門。眼等本淨。亦應云色等\n\n> 度門色等本淨。不唯取相為染無心為淨而已也。又以智論三觀束之。 分別色相等。是假名觀也。性空寂滅是空觀也。此二不二色性難思。\n\n> 中道觀也。三無前後皆是一心。對此三觀應辨三止。謂方便隨緣止。 體真止。離二邊分別。止既止觀雙運。亦名一心三生也。即一而三即\n\n> 三而一。雙照三一雙遮三一。是無礙也。一一釋文準思可見。此是菩 薩圓融功德。而自莊嚴。觸目對境常所行用。希心玄趣。幸願留神。\n\n> 二童子下六頌半。於他身得自在。此有三義。一如前眼根入等。但約 見境為出入耳。二菩薩化現彼身。作此轉變速疾也。三菩薩以眾生身\n\n> 作自身。如下十身相作等。是故於彼身入此身出。而彼不覺知。唯應 度者知得度也。三鬼神下二頌半。微細自在。謂毛孔約正報。即佛及\n\n> 眾生。毛頭約空處。微塵是色相多約器界。並身在中入定出定。為顯 三昧純熟隱顯自在故。亦通觀彼入出定等。即於境無礙也。若唯約身\n\n> 在彼下十定中。亦云無生法中入起。安有處耶。四一切塵下四頌半。 器界事中周偏入出。然菩薩身普遍略有四位。一普遍一切十方剎海。\n\n> 二遍彼剎內樹等物中。三遍一切塵毛等中。皆圓遍非分遍。是故皆全 身顯現。四以是法界身故。不異不分恒在此常在彼。無有前後。第三\n\n> 是名下一頌總結。初句以德命人。次句依人顯德。後半明說不盡。近 結第十定用無盡。遠結前十定大用無盡。以是無盡之法門故。第五一\n\n> 切下。喻況玄旨分。亦名舉劣顯勝分。以上所說普賢行德。窮于佛 境。蓋是信滿之位。既越常規乖於視聽。滯情封教取信無由。故舉斯\n\n**己·喻況七十九頌三段（總標喻意二頌—二十種喻·聲聞—天鼓六頌—長龙王二頌舉劣顯勝—結說難思）**\n\n> 近事以鏡玄趣。令開悟也。七十九頌分為三段。初二總標喻意。二七 十六頌別顯喻相。三一頌結說顯德。今初先一偈半。明非喻能喻。後\n\n> 半偈借喻通玄。今初舉四難思。意在菩薩神力。瑜伽決擇分有六種不 可思議。謂一者我。二有情。三世間。四有情業果。五諸修靜慮者靜\n\n> 慮境界。六諸佛世尊諸佛境界。今眾生含其前三。加龍變化所以有 四。菩薩神力。即靜慮者境界。舊經梵本。皆云禪定力用故。然眾生\n\n> 業報四因難思。謂處所差別故。事差別故。因差別故。異熟果差別 故。諸龍變化不起心念。六天四洲雲雨不同等。故難思也。佛自在者\n\n> 有五難思。謂真如甚深故。自在轉故。無漏界證得故。無障礙故。成 立有情所作事故。菩薩神力由三種相。除佛後二。以今經文分同佛\n\n> 五。以皆超言念故。無可同喻。後半中然取分喻。以小喻大。令聞喻 者忘象領意故。褒以智者。二聲聞下別辨中。略顯二十種大喻。以況\n\n> 菩薩之德。初有三頌半。明聲聞現通喻。況菩薩自在益生德。先明喻 末偈舉劣顯勝。不為眾生無大悲也。不求菩提無大智也。大饒益者具\n\n> 悲智也。二有二偈日月現影喻。況菩薩普應群機德。三有二頌水現四 兵喻。喻菩薩海印現像德。四有二頌善音巧辨喻。喻菩薩總持巧說\n\n> 德。五二頌女授辯才喻。喻授法益生德。六譬如幻師下。二頌幻師巧 術喻。喻不思議解脫德。七二頌修羅隱形喻。喻勝通隱顯德。八五頌\n\n> 象王隨變喻。喻定用自在德。九二頌修羅大身喻。喻法界身雲德。同 於上文主伴嚴麗。十有四頌帝釋破怨喻。喻降伏眾魔德。十一忉利天\n\n> 下六頌。天鼓說法喻。況菩薩以無功用現身說法德。十二有三頌。天 鼓安慰喻。況菩薩慈音除惱德。十三有三頌。天王普應喻。喻普應悅\n\n> 機德。十四有二頌。魔繫愚夫喻。喻攝生同行德。十五有二頌。梵王 殊現喻。況菩薩解脫自在德。十六魔醯下二頌。自在數滴喻。況菩薩\n\n> 一念普知德。十七三頌大風成事喻。喻大願宿成德。十八二頌眾聲悅 意喻。喻四辯悅機德。十九二頌。大海包含喻。喻禪慧普修德。二十\n\n> 大海龍下。二十四頌半。龍王遊戲喻。喻菩薩遊戲神變德。文分為 二。初二十二頌半。明龍王大用不同。後二頌正明舉劣顯勝。前中初\n\n> 半偈總標。餘頌別顯。於中四。初四偈半雲色不同。喻菩薩身雲各 異。次有四頌電光差別。喻菩薩光明等殊。第三偈云寶藏色者。梵云\n\n> 室利揭娑。此云勝藏。勝藏即寶名也。閻浮提中帝青色者。梵云天帝 火焰摩尼色。亦珠寶名也。三有三頌半雷聲不等。喻菩薩三昧多種。\n\n> 四有十頌所雨不一。喻菩薩說法多門。言曼陀羅者。此云悅意。澤香 即塗香也。鷄羅多摩者。鷄羅此云華蘂。多摩此云天上華。謂此香是\n\n> 天華蘂所作故也。婆利師迦者。此云雨時生華。末利香即華名。其色 猶黃金。第二如是無量下。二頌正舉劣顯勝。謂娑竭羅龍。於六欲天\n\n> 等總十五處。現斯作用。而身不動搖心無分別。但由業報之力現斯自 在。菩薩亦爾。住無功用不動不思。於十方界應現多種。亦以菩薩功\n\n> 德之力隨機見殊。此就喻意顯勝可知。第三彼諸下。一頌結說難思。 前半非喻能喻。後半結上略說。引諸喻者略有二意。一顯菩薩自在不\n\n> 同。二貴令眾生起信。且江南之人不信千人[疊*毛]帳。河北之者多疑 萬斛之舟。皆耳目不暨故耳。所以或舉目擊或據具縛之人。自在若\n\n> 斯。菩薩之用固當無惑。今猶疑者豈不傷哉。大文第三第一智慧下。\n\n**庚·校量勸持九頌（六慧結前·舉事校量·難信／福勝／餘行之難·後後過前前）**\n\n>九頌校量勸持分。此廣大用人皆有分。見而不習誠為自欺。故中人可勸而進也。於中分二。初一 頌結前所說。略就六慧結之。第一者上無加故。二廣大者。語其分量超二乘故。三真實者。明其體性內證無虛故。四無邊者有二義。一量智普知故。二離種種二邊故。即中道慧也 。五勝者。超地位故。六殊勝者同普賢故。二此法下八頌。明信受難得。於中初一總顯餘七別明\n\n>。前中希有者。佛出懸遠已難可遇。唯初成頓說故希有也。奇謂初能具後。特謂逈出諸乘。此句 讚也。下文勸耳。聞謂遇經。忍可謂信因。信則心淨。受謂領文領義。讚乃通言通筆。說唯約言。上皆所作總說皆難。後別明中三。初二偈半明難信。次半偈況出餘行。後四偈舉事校量。前中 初一偈明人天之器信為甚難。若爾今或能信何耶。由二力故。一現修淨福稱所求故。二昔因聞熏\n\n>今發種故。今不信者。願少聽聞為毒塗鼓。終成堅種。後一偈半舉三乘之信。展轉難得況於一乘 。明文昭然權實有據。第二半偈。況出餘行中信忍尚難。況具餘行。難中之難也。真實解者。亦有說行而不信圓融之旨。非真實解也。願諸學者善擇知見。第三四頌舉事校量。初三校量難信。 初二舉二難以況信難。後一舉福勝以彰信勝。後一校量餘行之難。唯明誦持餘略不說。亦顯修行\n\n>。真解非可校量也。此之四事。後後過於前前。巧辯深勝。\n\n**辛·顯實證成分（四事：動世界／蔽魔宮／息惡道／佛現證·三業皆證）＋「信行第二會竟」＋疏本卷十六／十七尾题·撰人衔原位**\n\n> 此之四事。後後過於前前。巧辯深勝。大段第三時賢首下。顯實證成 分。於中有四。一動世界大機發故。二蔽魔宮唯佛境故。三息惡道利\n\n> 樂深故。四佛現證契佛心故。於中摩頂讚善隨喜。即三業皆證。勸物 信行第二會竟。\n\n> 大方廣佛華嚴經疏卷第十六 大方廣佛華嚴經疏卷第十七\n\n> 唐清涼山大華嚴寺沙門澄觀撰\n\n### 附录五：对读简表\n（见 §6.1 表〔一〕–〔六〕、§6.3、§6.4 校勘九项）\n\n### 附录六：存疑清单\n| # | 项目 | 状态 |\n|---|------|------|\n| 1 | 偈颂数（澄观 359 半／慧苑 357 半／智俨 715 半）之「半」精确复现 | 〔待核·颂／偈计量口径·CBETA 平文不可直复·§1.3/§5.4/§6.4#5〕 |\n| 2 | 法藏 `T1733` 探玄记贤首正科未获直证（目录列·正文唯征引） | 〔待核·正科或阙·§5.2/§6.4#8〕 |\n| 3 | 藏译德格版逐字对勘 | 〔待核·本机无 Toh·仅编目级 in_tibetan=1·§6.3〕 |\n| 4 | P11 净行专篇 §1.5/§6.4#6「@129634 系卷十五首重题（列品目处）」表述 | 〔L.185 照记订正·@129634 系本品跨卷「之二」重题、非另品目录行·P11 结论不变·§1.5〕 |\n| 5 | 海云讲记于本品之正行段逐字讲记 | 〔待上架·本案只据覆盖频次·§5.3′〕 |\n| 6 | 演钞转述「天台依此一品立圓頓止觀」之他宗判释 | 〔备考·非本经自义·§三〕 |\n| 7 | 本品与《四圣谛品》跨品呼应（§2.4 说四谛段） | 〔本文判断·只标关联·§三〕 |\n\n### 附录七：引用书目\n- `T10n0279` 唐·实叉难陀译《大方广佛华严经》（八十华严）·卷十四末～卷十五\n- `T09n0278` 晋·佛驮跋陀罗译《大方广佛华严经》（六十华严）·卷六末～卷七（平文 `data/references/cbeta_txt/T09n0278_juan6.txt`＋`T09n0278_juan7.txt`·L.181 生成）\n- `T1735` 澄观《大方广佛华严经疏》卷十六 · `T1736` 澄观《随疏演义钞》\n- `T1733` 法藏《华严经探玄记》 · `T1732` 智俨《华严经内章门等杂问章句》（搜玄记）\n- X0221 慧苑《續華嚴略疏刊定記》 · `T1739` 李通玄《新华严经论》\n- `data/catalog/chapters.yaml`（order 12·title_en \"The Chief of Worthies\"·in_tibetan 1）\n- 海云继梦讲记 ep08／ep10／ep12（`docs/经学文献/海云讲记_九九华严/episodes/`）\n- `T1735` 澄观疏本科段全文照录件：`_e12_win.txt`（raw @195841–210565·496 行·本批附录四/§5.1 数据源）·`_e12_win_hdr.txt`\n- 本批提取层：`_e12_full.py`（9 单元 dump＋六十 736 段＋窗口）·`_e12_lines.py`（717 颂行＋`_e12_lines.txt`／`_e12_stats.txt`）·`_e12_probe2/5/6.py`（锚点·回源·科段行界预演·皆 0 miss）\n- **〔L.190 本批·近现代研究线索（仅书目登录·皆〔线索·未对勘〕·访问 2026-10-25）〕**\n  - 宣化《大方广佛华严经浅释·贤首品第十二》（在线·drbachinese.org）——现代讲记层·其偈颂讲解与 §2.7′ 序码可并观（讲记语只标不代立论·分层铁律）。\n  - 澄观疏「信為道元功德母」下七颂疏解之现代专题论文（CNKI／PhilPapers 检索线索）——〔线索·具体篇页待核〕。\n  - CBETA 线上 dila 版 `T10n0279`（cbetaonline.dila.edu.tw）——本机 XML 之外另一通道·apparatus 逐字校勘〔待后续专批〕。\n\n### 附录八：术语对照\n（梵汉：贤首 *Bhadramānuśa*〔拟·待核·澄观「体性至顺调善曰贤·吉祥胜德超绝名首」〕·信 *śraddhā*〔道元功德母·拟·待核〕·菩提心 *bodhi-citta*·三昧 *samādhi*·光明 *prabhā*·海印三昧 *sāgara-mudrā-samādhi*〔拟·待核〕·灌頂 *abhiṣeka*〔拟·待核〕）\n\n### 附录九：中英要目（EN Key-Point Correspondence）\n\n> 依全站固定术语表（`data/translation/glossary.yaml`·`data/catalog/chapters.yaml`） function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}

}/* ============================================================================
 * renderArticleBI —— 世主妙严品数据科学层渲染
 *
 * 守「严禁假信息」四条：
 *  1. 一切数字与文字皆来自注入的 ARTICLE_BI（源自 data/translation/miaoyan_bi.yaml），
 *     前端零硬编码数值；无数据即不渲染该节，绝不补空猜测。
 *  2. 方法（method）、口径（note）、限制（caveat）与网络截断（truncation）原样呈现，
 *     不得省略改写——省了限制，结论就会被误读为「经文事实」。
 *  3. 三层不得混同：经文事实(assembly) → 编辑析构(EDA) → 解释判断(数据科学层)。
 *     故本层各节标题皆标 [数据科学]，且 scorecard 刻意不给综合总分。
 *  4. 图表仅绘制既有矩阵，不外推、不插值、不跨轴比较（归一后尤忌）。
 * ==========================================================================*/
function renderArticleBI(){
  var bi = (typeof ARTICLE_BI !== 'undefined') ? ARTICLE_BI : null;
  if(!bi) return '';

  /* ---------- 小工具 ---------- */
  function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function md(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
  function zhEn(zh,en){var s='';if(zh)s+='<div>'+md(zh)+'</div>';if(en)s+='<div class="en-line" style="color:var(--text2)">📖 '+md(en)+'</div>';return s;}
  function num(v,d){
    if(v===null||v===undefined||v==='')return '—';
    var x=Number(v); if(!isFinite(x))return '—';
    if(Math.abs(x)>=10000)return x.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    if(Number.isInteger(x))return String(x);
    return x.toFixed(d===undefined?4:d).replace(/0+$/,'').replace(/\.$/,'');
  }
  function pct(v,d){return (v===null||v===undefined)?'—':(num(v*100,d===undefined?2:d)+'%');}
  function tbl(head,rows){
    var s='<table class="bi-tbl">';
    if(head)s+='<tr>'+head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr>';
    rows.forEach(function(r){s+='<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>';}).join('')+'</tr>';});
    return s+'</table>';
  }
  function kv(k,v){return tbl(null,[[esc(k),'<span style="text-align:right;font-family:var(--mono,monospace)">'+v+'</span>']]);}
  function note(zh,en){return '<div class="bi-note">'+zhEn(zh,en)+'</div>';}
  function caveat(zh,en){
    if(!zh&&!en)return '';
    return '<div class="bi-caveat">⚠️ '+zhEn(zh,en)+'</div>';
  }
  /* 分节：折叠门，首节默认展开 */
  var secState={};
  function sec(id,icon,title,titleEn,body,openByDefault){
    var open = secState[id]!==undefined ? secState[id] : !!openByDefault;
    return '<div class="wu-door'+(open?' open':'')+'" id="'+id+'" onclick="this.classList.toggle(\'open\')">'
      +'<span class="arrow">▶</span><span class="ttl">'+icon+' '+esc(title)+'</span>'
      +(titleEn?'<div class="en-line" style="font-size:0.62em;color:var(--text2);margin-left:18px;margin-bottom:4px">📖 '+esc(titleEn)+'</div>':'')
      +'<div class="body">'+body+'</div></div>';
  }

  var h='';
  h+='<section id="bi-report">';
  h+='<h2>📊 数据科学</h2>';
  h+='<div class="en-line" style="font-size:0.66em;color:var(--text2);margin:-6px 0 10px">📖 Data Science</div>';

  /* ---------- 0. 分层声明与总则 ---------- */
  var head='';
  if(bi.disclaimer&&(bi.disclaimer.zh||bi.disclaimer.en)) head+=note(bi.disclaimer.zh,bi.disclaimer.en);
  var m=bi.method||{};
  if(m.pipeline_zh)    head+='<div class="bi-li"><b>三层分源</b>：'+zhEn(m.pipeline_zh,m.pipeline_en)+'</div>';
  if(m.determinism_zh) head+='<div class="bi-li"><b>可复现</b>：'+zhEn(m.determinism_zh,m.determinism_en)+'</div>';
  if(m.deps_zh)        head+='<div class="bi-li"><b>零新增依赖</b>：'+zhEn(m.deps_zh,m.deps_en)+'</div>';
  if(m.integrity_zh)   head+='<div class="bi-li"><b>不改动 EDA</b>：'+zhEn(m.integrity_zh,m.integrity_en)+'</div>';
  h+=sec('bi-method','🔬','读法总则（分层 · 可复现 · 不改动上游）','How to Read This Report (Layers · Reproducibility)',head,true);

  /* ---------- 1. 网络截断声明（置于一切中心性结论之前）---------- */
  var nw=bi.network||{};
  var tr=nw.truncation;
  if(tr){
    var tb='';
    tb+='<div class="bi-caveat bi-caveat-warn">🔻 '+zhEn(tr.zh,tr.en)+'</div>';
    tb+=tbl(['共现对之计量','数值'],[
      ['全部相邻共现对',num(tr.n_all_pairs)],
      ['实际入网之边（权重最高前 N）',num(tr.n_used_edges)],
      ['被截断之对',num(tr.n_dropped_pairs)],
      ['截断比例',pct(tr.dropped_pct,2)]
    ]);
    if(tr.pair_counting_zh) tb+=note(tr.pair_counting_zh,tr.pair_counting_en);
    h+=sec('bi-truncation','🔻','网络截断声明（中心性之适用范围）','Network Truncation: Scope of Centrality Claims',tb,true);
  }

  /* ---------- 2. 记分卡 ---------- */
  var sc=bi.scorecard;
  if(sc&&sc.items&&sc.items.length){
    var b='';
    b+=note(sc.note,sc.note_en);
    b+='<div class="bi-kpis">';
    sc.items.forEach(function(it){
      b+='<div class="bi-kpi"><div class="bi-kpi-v">'+esc(it.display!==undefined?it.display:num(it.value))+'</div>'
        +'<div class="bi-kpi-k">'+esc(it.zh)+'</div>'
        +(it.definition?'<div class="bi-kpi-d">'+esc(it.definition)+'</div>':'')
        +(it.en?'<div class="en-line bi-kpi-d">📖 '+esc(it.en)+'</div>':'')+'</div>';
    });
    b+='</div>';
    h+=sec('bi-scorecard','🪧','记分卡（分项列示 · 刻意不给综合总分）','Scorecard (Components Only — No Composite Score)',b,true);
  }

  /* ---------- 3. 漏斗（两轨不可连读）---------- */
  var fn=bi.funnel;
  if(fn){
    var b=note(fn.note,fn.note_en);
    function track(title,zh,en){
      var s='<h4>'+esc(zh)+(en?'<span class="en-line" style="font-size:0.7em;color:var(--text2)"> 📖 '+esc(en)+'</span>':'')+'</h4>';
      var st=zh&&zh.stages||[];
      var mx=0; st.forEach(function(x){if(Number(x.n)>mx)mx=Number(x.n);});
      st.forEach(function(x){
        var w=mx?Number(x.n)/mx*100:0;
        s+='<div class="bi-stage"><div class="bi-stage-h">'
          +'<span class="bi-stage-zh">'+esc(x.zh)+'</span>'
          +'<span class="bi-stage-n">'+num(x.n)+'　<span style="color:var(--text2)">'+pct(x.pct_of_track,1)+'</span></span></div>'
          +'<div class="bi-bar"><span style="width:'+w.toFixed(1)+'%"></span></div>'
          +(x.definition?'<div class="bi-stage-d">'+esc(x.definition)+(x.en?'<div class="en-line">📖 '+esc(x.en)+'</div>':'')+'</div>':'')
          +'</div>';
      });
      return s;
    }
    if(fn.track_names)  b+=track('names',fn.track_names.zh,fn.track_names.en);
    if(fn.track_tokens) b+=track('tokens',fn.track_tokens.zh,fn.track_tokens.en);
    if(fn.conversion){
      b+='<table class="bi-tbl" style="margin-top:8px"><tr><th>换算</th><th>值</th></tr>'
        +'<tr><td>每名平均析为几位词素</td><td style="text-align:right">'+num(fn.conversion.tokens_per_name,4)+'</td></tr>'
        +'<tr><td>无核名（记 ∅）</td><td style="text-align:right">'+num(fn.conversion.no_core)+'</td></tr></table>';
    }
    var g=fn.grades||{};
    if(Object.keys(g).length){
      var grows=[];
      ['high','medium','low'].forEach(function(k){
        var x=g[k]; if(!x)return;
        grows.push([esc(k),num(x.n),pct(x.pct,2),esc(x.zh)+(x.duty?'<div style="font-size:0.85em;color:var(--text2)">'+esc(x.duty)+'</div>':'')
          +(x.en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(x.en)+(x.duty_en?' · '+esc(x.duty_en):'')+'</div>':'')]);
      });
      b+=tbl(['判读等级','词素位','占比','说明 · 义务'],grows);
    }
    if(fn.reconciliation){
      b+=note(fn.reconciliation.zh,fn.reconciliation.en);
      b+=caveat(fn.reconciliation.caveat_zh,fn.reconciliation.caveat_en);
    }
    h+=sec('bi-funnel','📉','转换漏斗（一名析为多位 · 属扩张非流失）','Conversion Funnel (Expansion, Not Attrition)',b,false);
  }

  /* ---------- 4. 语义域景观 ---------- */
  var dl=bi.domain_landscape;
  if(dl&&dl.rows&&dl.rows.length){
    var b=note(dl.note,dl.note_en);
    var mx=0; dl.rows.forEach(function(r){if(Number(r.n)>mx)mx=Number(r.n);});
    var rows=dl.rows.map(function(r){
      var w=mx?Number(r.n)/mx*100:0;
      return [ '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+esc(r.color||'var(--gold)')+';margin-right:5px"></span>'+esc(r.zh||r.key),
        String(r.rank),num(r.n),pct(r.pct,2),pct(r.cum_pct,2),
        '<div class="bi-bar" style="min-width:70px"><span style="width:'+w.toFixed(1)+'%;background:'+esc(r.color||'var(--gold)')+'"></span></div>' ];
    });
    b+=tbl(['语义域','#','词素位','占比','累计','分布'],rows);
    var c=dl.concentration||{};
    if(c.hhi!==undefined){
      b+=tbl(['集中度量','值','读法'],[
        ['HHI（Σp²）',num(c.hhi,6),c.hhi_note+(c.hhi_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.hhi_note_en)+'</div>':'')],
        ['归一化熵',num(c.normalized_entropy,4),'0＝全聚于一项，1＝完全均布'],
        ['有效域数 e^H',num(c.effective_domains,3),c.effective_note+(c.effective_note_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(c.effective_note_en)+'</div>':'')]
      ]);
    }
    h+=sec('bi-domain','🧭','语义域景观（构词层面貌 · 非教义权重）','Semantic-Domain Landscape (Morphemic Surface, Not Doctrinal Weight)',b,false);
  }

  /* ---------- 5. 群组 × 域 交叉表 ---------- */
  var ct=bi.crosstab;
  if(ct&&ct.matrix&&ct.groups&&ct.domains){
    var b=note(ct.note,ct.note_en);
    /* 行为语义域(17)，列为群组(5) */
    var G=ct.groups,D=ct.domains;
    var CW=Math.max(52,Math.min(74,Math.floor(820/Math.max(1,G.length))));
    var LW=Math.max(92,Math.min(150,Math.floor(260/Math.max(1,D.length))*3));
    var W=LW+G.length*CW+16, H=D.length*19+40;
    var mx=0; ct.matrix.forEach(function(r){r.forEach(function(v){if(Number(v)>mx)mx=Number(v);});});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+Math.min(W,900)+'px;height:auto" role="img" aria-label="group by domain heatmap">';
    svg+='<text x="4" y="12" font-size="10" fill="currentColor">域 ＼ 群</text>';
    G.forEach(function(g,j){
      var cx=LW+j*CW+CW/2;
      svg+='<text x="'+cx+'" y="12" font-size="9.5" fill="currentColor" text-anchor="end" transform="rotate(-42 '+cx+' 12)">'+esc(g.zh)+'</text>';
    });
    D.forEach(function(dm,i){
      var y=22+i*19;
      svg+='<text x="'+(LW-6)+'" y="'+(y+12)+'" font-size="9.5" text-anchor="end" fill="currentColor">'+esc(dm.zh||dm.key)+'</text>';
      for(var j=0;j<G.length;j++){
        var v=Number(ct.matrix[i][j]||0), t=mx?v/mx:0;
        svg+='<rect x="'+(LW+j*CW)+'" y="'+y+'" width="'+(CW-2)+'" height="17" fill="var(--gold)" opacity="'+(0.05+0.62*t).toFixed(3)+'"><title>'+esc(dm.zh)+' / '+esc(G[j].zh)+': '+v+'</title></rect>';
        if(v>0) svg+='<text x="'+(LW+j*CW+CW/2-1)+'" y="'+(y+12)+'" font-size="9" text-anchor="middle" fill="'+(t>0.55?'#1a1410':'currentColor')+'">'+v+'</text>';
      }
    });
    svg+='</svg>';
    b+='<div style="overflow-x:auto">'+svg+'</div>';
    if(ct.chi2!==undefined){
      b+=tbl(['统计量','值'],[
        ['χ²',num(ct.chi2,4)],
        ['自由度 df',num(ct.df)],
        ['Cramér’s V',num(ct.cramers_v,4)],
        ['p 值',esc(ct.p_approx_txt||num(ct.p_approx))+(ct.p_approx_txt_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(ct.p_approx_txt_en)+'</div>':'')],
        ['Wilson–Hilferty z',num(ct.p_wh_z,4)]
      ]);
    }
    if(ct.df_note_zh)    b+=note(ct.df_note_zh,ct.df_note_en);
    if(ct.v_strength_zh) b+=note(ct.v_strength_zh,ct.v_strength_en);
    if(ct.p_note)        b+=note(ct.p_note,ct.p_note_en);
    function liftTable(title,arr,color){
      if(!arr||!arr.length)return '';
      var s='<h4>'+esc(title)+'</h4>';
      s+=tbl(['语义域','群组','观测','期望','lift'],arr.slice(0,12).map(function(r){
        var hi=Number(r.lift)>1;
        return [esc(r.domain_zh),esc(r.group_zh),num(r.obs),num(r.exp,2),
          '<b style="color:'+(hi?'var(--gold)':'var(--text2)')+'">'+num(r.lift,3)+'</b>'];
      }));
      return s;
    }
    b+=liftTable('偏好此域之组合（lift > 1）· 前 12',ct.top_over);
    b+=liftTable('回避此域之组合（lift < 1）· 前 12',ct.top_under);
    h+=sec('bi-crosstab','🧮','群组 × 语义域 交叉表与独立性检验','Group × Domain Crosstab & Test of Independence',b,false);
  }

  /* ---------- 6. 相似度 ---------- */
  var sm=bi.similarity;
  if(sm){
    var b=note((sm.space_zh||'')+'<br>'+(sm.caveat_zh||''),'');
    if(sm.space_en) b+='<div class="en-line" style="color:var(--text2);font-size:0.9em">📖 '+esc(sm.space_en)+(sm.caveat_en?'<br>'+esc(sm.caveat_en):'')+'</div>';
    if(sm.matrix&&sm.names&&sm.names.length){
      var N=Math.min(sm.names.length,30);
      var SZ=Math.max(360,Math.min(600,N*17));
      var cell=SZ/N, LW2=Math.max(70,Math.min(130,SZ*0.22));
      var W2=LW2+SZ+8, H2=22+SZ+8;
      var mx3=0; for(var i=0;i<N;i++)for(var j=0;j<N;j++){var vv=Number(sm.matrix[i][j]||0);if(vv>mx3)mx3=vv;}
      var svg2='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;max-width:780px;height:auto" role="img" aria-label="similarity heatmap">';
      for(var i=0;i<N;i++)for(var j=0;j<N;j++){
        var v=Number(sm.matrix[i][j]||0), t=mx3?v/mx3:0;
        svg2+='<rect x="'+(LW2+j*cell)+'" y="'+(22+i*cell)+'" width="'+Math.max(1,cell-1)+'" height="'+Math.max(1,cell-1)+'" fill="var(--gold)" opacity="'+(0.05+0.6*t).toFixed(3)+'"><title>'+esc(sm.names[i])+' ↔ '+esc(sm.names[j])+': '+num(v,4)+'</title></rect>';
      }
      for(var i=0;i<N;i++){
        svg2+='<text x="'+(LW2-4)+'" y="'+(28+i*cell)+'" font-size="8.5" text-anchor="end" fill="currentColor">'+esc(sm.names[i])+'</text>';
        svg2+='<text x="'+(LW2+i*cell+2)+'" y="17" font-size="8.5" fill="currentColor" transform="rotate(-60 '+(LW2+i*cell+2)+' 17)">'+esc(sm.names[i])+'</text>';
      }
      svg2+='</svg>';
      b+='<div style="overflow-x:auto">'+svg2+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2);margin-top:4px">'+N+' / '+sm.names.length+' 类（按相似度矩阵前 '+N+' 类绘制；完整 40×40 见 YAML）</div>';
    }
    if(sm.within_mean!==undefined){
      b+=tbl(['平均相似度','值','n'],[
        ['同群组内',num(sm.within_mean,4),num(sm.within_n)],
        ['跨群组',num(sm.across_mean,4),num(sm.across_n)]
      ]);
    }
    if(sm.verdict_zh) b+=note(sm.verdict_zh,sm.verdict_en);
    var cf=sm.confound;
    if(cf){
      if(cf.adj_same_template_mean!==undefined){
        b+=tbl(['去混淆（同为类尾同字者 vs 不同）','值'],[
          ['相邻且同类尾',num(cf.adj_same_template_mean,4)],
          ['相邻但类尾不同',num(cf.adj_diff_template_mean,4)],
          ['差（同−异）',num(cf.same_minus_diff,4)]
        ]);
      }
      if(cf.tail_of_class) b+=note('类尾（模板代理）为：'+(cf.tail_of_class||[]).slice(0,12).map(function(t){return esc(t.cat)+'→'+esc(t.tail);}).join('、')+' …（共 '+(cf.tail_of_class||[]).length+' 类）','');
    }
    h+=sec('bi-sim','🔗','类间相似度（构词层语汇 · 非词义向量）','Inter-Class Similarity (Lexical Composition, Not Semantic Embedding)',b,false);
  }

  /* ---------- 7. 聚类 ---------- */
  var cl=bi.clustering;
  if(cl){
    var b='';
    b+=caveat(cl.caveat_zh,cl.caveat_en);
    if(cl.method_zh) b+=note(cl.method_zh,cl.method_en);
    if(cl.stability_method_zh) b+=note(cl.stability_method_zh,cl.stability_method_en);
    b+=tbl(['选定项','值'],[
      ['最佳簇数 k',num(cl.best_k)],
      ['平均轮廓系数',num(cl.best_silhouette,4)],
      ['扫描区间','k = '+(cl.k_range||[]).join(' … ')],
      ['共形相关系数',num(cl.cophenetic_corr,4)]
    ]);
    if(cl.k_boundary_note_zh) b+=note(cl.k_boundary_note_zh,cl.k_boundary_note_en);
    if(cl.weak_structure_zh)   b+=note(cl.weak_structure_zh,cl.weak_structure_en);
    if(cl.cophenetic_note_zh)  b+=note(cl.cophenetic_note_zh,cl.cophenetic_note_en);
    /* k–轮廓曲线 */
    if(cl.curve&&cl.curve.length){
      var W4=560,H4=200,P4=38;
      var xs=cl.curve.map(function(c){return Number(c.k);});
      var ys=cl.curve.map(function(c){return Number(c.silhouette);});
      var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
      var sx=function(v){return P4+(x1===x0?0:(v-x0)/(x1-x0)*(W4-2*P4));};
      var sy=function(v){return H4-P4-(y1===y0?0:(v-y0)/(y1-y0)*(H4-2*P4));};
      var pts=cl.curve.map(function(c){return sx(Number(c.k)).toFixed(1)+','+sy(Number(c.silhouette)).toFixed(1);}).join(' ');
      var svg4='<svg viewBox="0 0 '+W4+' '+H4+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="silhouette curve">';
      svg4+='<line x1="'+P4+'" y1="'+(H4-P4)+'" x2="'+(W4-P4)+'" y2="'+(H4-P4)+'" stroke="currentColor" opacity="0.35"/>';
      svg4+='<polyline points="'+pts+'" fill="none" stroke="var(--gold)" stroke-width="1.6"/>';
      cl.curve.forEach(function(c){
        var bk=Number(c.k)===Number(cl.best_k);
        svg4+='<circle cx="'+sx(Number(c.k)).toFixed(1)+'" cy="'+sy(Number(c.silhouette)).toFixed(1)+'" r="'+(bk?4.5:2.4)+'" fill="'+(bk?'var(--gold)':'currentColor')+'" opacity="'+(bk?1:0.6)+'"><title>k='+c.k+': '+num(c.silhouette,4)+'</title></circle>';
        svg4+='<text x="'+sx(Number(c.k)).toFixed(1)+'" y="'+(H4-P4+12)+'" font-size="8.5" text-anchor="middle" fill="currentColor">'+c.k+'</text>';
      });
      svg4+='<text x="4" y="12" font-size="9.5" fill="currentColor">轮廓系数</text><text x="'+(W4-4)+'" y="'+(H4-6)+'" font-size="9.5" text-anchor="end" fill="currentColor">k</text>';
      svg4+='</svg>';
      b+='<div style="overflow-x:auto">'+svg4+'</div>';
    }
    /* 簇成员 */
    if(cl.clusters&&cl.clusters.length){
      var rows=cl.clusters.map(function(c,ci){
        var mem=c.members||[];
        var gmap={}; mem.forEach(function(m){gmap[m.group_zh||m.group]=(gmap[m.group_zh||m.group]||0)+1;});
        var memTxt=mem.map(function(m){return esc(m.cat);}).join('、');
        return ['C'+(ci+1),String(mem.length),
          mem.length?esc(Object.keys(gmap).map(function(k){return k+'×'+gmap[k];}).join('　')):'—',
          '<span style="font-size:0.86em">'+memTxt+'</span>'];
      });
      b+=tbl(['簇','规模','群组构成','成员类'],rows);
    }
    h+=sec('bi-cluster','🌿','聚类结构（探索性切分 · 非经文自有类别）','Cluster Structure (Exploratory Partition, Not Sutra-given)',b,false);
  }

  /* ---------- 8. PCA ---------- */
  var pc=bi.pca;
  if(pc){
    var b=caveat(pc.caveat_zh,pc.caveat_en);
    if(pc.method_zh) b+=note(pc.method_zh,pc.method_en);
    if(pc.explained&&pc.explained.length){
      var W5=560,H5=170,P5=36;
      var mx5=0; pc.explained.forEach(function(e){if(Number(e.pct)>mx5)mx5=Number(e.pct);});
      var svg5='<svg viewBox="0 0 '+W5+' '+H5+'" style="width:100%;max-width:600px;height:auto" role="img" aria-label="explained variance">';
      var bw=W5/(pc.explained.length*1.7);
      pc.explained.forEach(function(e,i){
        var v=Number(e.pct), hgt=mx5?v/mx5*(H5-2*P5):0;
        var x=P5+i*bw*1.7,y=H5-P5-hgt;
        svg5+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="var(--gold)" opacity="0.75"><title>PC'+e.pc+': '+pct(v,2)+'</title></rect>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" text-anchor="middle" fill="currentColor">'+pct(v,1)+'</text>';
        svg5+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H5-P5+12)+'" font-size="9" text-anchor="middle" fill="currentColor">PC'+e.pc+'</text>';
      });
      svg5+='<line x1="'+P5+'" y1="'+(H5-P5)+'" x2="'+(W5-P5)+'" y2="'+(H5-P5)+'" stroke="currentColor" opacity="0.35"/>';
      svg5+='</svg>';
      b+='<div style="overflow-x:auto">'+svg5+'</div>';
    }
    if(pc.points&&pc.points.length){
      var xs=pc.points.map(function(p){return Number(p.x);});
      var ys=pc.points.map(function(p){return Number(p.y);});
      var xa=Math.min.apply(null,xs),xb=Math.max.apply(null,xs);
      var ya=Math.min.apply(null,ys),yb=Math.max.apply(null,ys);
      var W6=640,H6=440,P6=46;
      var sx=function(v){return P6+(xb===xa?0:(v-xa)/(xb-xa)*(W6-2*P6));};
      var sy=function(v){return H6-P6-(yb===ya?0:(v-ya)/(yb-ya)*(H6-2*P6));};
      var gc=pc.group_centroids||{};
      var gcol={}; var pal=['#b8863c','#5e8b9e','#8b5e8b','#6b8b3c','#a05e3c'];
      Object.keys(gc||{}).forEach(function(g,i){gcol[g]=pal[i%pal.length];});
      var svg6='<svg viewBox="0 0 '+W6+' '+H6+'" style="width:100%;max-width:660px;height:auto" role="img" aria-label="PCA scatter">';
      svg6+='<line x1="'+P6+'" y1="'+(H6-P6)+'" x2="'+(W6-P6)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+P6+'" x2="'+P6+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.35"/>';
      svg6+='<line x1="'+P6+'" y1="'+(sy(0).toFixed(1))+'" x2="'+(W6-P6)+'" y2="'+(sy(0).toFixed(1))+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      svg6+='<line x1="'+sx(0).toFixed(1)+'" y1="'+P6+'" x2="'+sx(0).toFixed(1)+'" y2="'+(H6-P6)+'" stroke="currentColor" opacity="0.16" stroke-dasharray="3 3"/>';
      pc.points.forEach(function(p){
        var cx=sx(Number(p.x)),cy=sy(Number(p.y));
        var r=Math.max(3,Math.min(9,Math.sqrt(Number(p.n_named||1))*1.5));
        svg6+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(gcol[p.group]||'var(--gold)')+'" opacity="0.8"><title>'+esc(p.cat)+' ('+esc(p.group_zh)+'): n_named='+num(p.n_named)+'</title></circle>';
      });
      Object.keys(gc||{}).forEach(function(g){
        var c0=gc[g]; if(!c0)return;
        var cx=sx(Number(c0.x!==undefined?c0.x:c0.cx)),cy=sy(Number(c0.y!==undefined?c0.y:c0.cy));
        svg6+='<path d="M'+(cx-6)+','+cy+'L'+(cx+6)+','+cy+'M'+cx+','+(cy-6)+'L'+cx+','+(cy+6)+'" stroke="'+(gcol[g]||'currentColor')+'" stroke-width="1.8"/>';
      });
      svg6+='<text x="'+(W6/2)+'" y="'+(H6-8)+'" font-size="10" text-anchor="middle" fill="currentColor">PC1</text>';
      svg6+='<text x="12" y="'+(H6/2)+'" font-size="10" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 '+(H6/2)+')">PC2</text>';
      svg6+='</svg>';
      b+='<div style="overflow-x:auto">'+svg6+'</div>';
      var leg='<div class="bi-legend">';
      Object.keys(gc||{}).forEach(function(g){
        leg+='<span class="bi-lg"><i style="background:'+(gcol[g]||'var(--gold)')+'"></i>'+esc((gc[g]&&(gc[g].zh||gc[g].group_zh))||g)+'</span>';
      });
      b+=leg+'</div>';
      b+='<div style="font-size:0.74em;color:var(--text2)">气泡大小＝该类名号数；十字＝群组重心（40 类逐类实点，未作任何外推）</div>';
    }
    h+=sec('bi-pca','📐','主成分分析（降维观察 · 投影有损）','PCA (Dimension Reduction; Projection Is Lossy)',b,false);
  }

  /* ---------- 9. 帕累托 ---------- */
  var pa=bi.pareto;
  if(pa&&pa.series&&pa.series.length){
    var b=note(pa.note_zh,pa.note_en);
    var rows=pa.series.map(function(s){
      return [esc(s.label)+(s.label_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(s.label_en)+'</div>':''),
        num(s.total),num(s.n_items),num(s.k80),pct(s.k80_pct_items,2)];
    });
    b+=tbl(['量度','总频次','项数','k80','k80 占项数比'],rows);
    /* 首项累计曲线（取第一组之 points） */
    var s0=pa.series[0];
    if(s0&&s0.points&&s0.points.length){
      var pts=s0.points.slice(0,40);
      var W7=600,H7=220,P7=40;
      var xs7=pts.map(function(p){return Number(p.rank);});
      var ys7=pts.map(function(p){return Number(p.cum_pct);});
      var x7a=Math.min.apply(null,xs7),x7b=Math.max.apply(null,xs7);
      var y7a=Math.min.apply(null,ys7),y7b=Math.max.apply(null,ys7);
      var sx7=function(v){return P7+(x7b===x7a?0:(v-x7a)/(x7b-x7a)*(W7-2*P7));};
      var sy7=function(v){return H7-P7-(y7b===y7a?0:(v-y7a)/(y7b-y7a)*(H7-2*P7));};
      var svg7='<svg viewBox="0 0 '+W7+' '+H7+'" style="width:100%;max-width:640px;height:auto" role="img" aria-label="cumulative curve">';
      /* 80% 参考线 */
      var y80=sy7(0.8);
      svg7+='<line x1="'+P7+'" y1="'+y80.toFixed(1)+'" x2="'+(W7-P7)+'" y2="'+y80.toFixed(1)+'" stroke="var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>';
      svg7+='<text x="'+(W7-P7)+'" y="'+(y80-4).toFixed(1)+'" font-size="9" text-anchor="end" fill="var(--red)">80% 线</text>';
      svg7+='<line x1="'+P7+'" y1="'+(H7-P7)+'" x2="'+(W7-P7)+'" y2="'+(H7-P7)+'" stroke="currentColor" opacity="0.35"/>';
      svg7+='<polyline points="'+pts.map(function(p){return sx7(Number(p.rank)).toFixed(1)+','+sy7(Number(p.cum_pct)).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--gold)" stroke-width="1.8"/>';
      pts.forEach(function(p){
        svg7+='<circle cx="'+sx7(Number(p.rank)).toFixed(1)+'" cy="'+sy7(Number(p.cum_pct)).toFixed(1)+'" r="2.2" fill="var(--gold)"><title>#'+p.rank+' '+esc(p.key)+' n='+num(p.n)+' 累计 '+pct(p.cum_pct,2)+'</title></circle>';
      });
      svg7+='<text x="4" y="12" font-size="9.5" fill="currentColor">'+esc(s0.label)+' · 累计占比（前 '+pts.length+' 项）</text>';
      svg7+='<text x="'+(W7/2)+'" y="'+(H7-6)+'" font-size="9.5" text-anchor="middle" fill="currentColor">位次 rank</text>';
      svg7+='</svg>';
      b+='<div style="overflow-x:auto">'+svg7+'</div>';
    }
    h+=sec('bi-pareto','📊','帕累托与集中度（语汇集中于少数词素）','Pareto & Concentration',b,false);
  }

  /* ---------- 10. 网络中心性（必置于截断声明之后）---------- */
  if(nw&&(nw.n_nodes!==undefined)){
    var b=note(nw.note_zh,nw.note_en);
    b+=caveat('本页以下中心性数值仅为**强共现子图**上之中心性，'+num(tr?tr.n_used_edges:0)+' 边（自全部 '+num(tr?tr.n_all_pairs:0)+' 对截断而来），**非全网之中心性**。','All centrality figures below are computed on the strong-co-occurrence subgraph, not on the full network.');
    b+=tbl(['网络规模','值'],[
      ['节点数（不同词素）',num(nw.n_nodes)],
      ['入网边数',num(nw.n_edges)],
      ['活跃节点（入网者）',num(nw.n_active)],
      ['孤立节点（零共现）',num(nw.isolated)]
    ]);
    if(nw.isolated_note_zh) b+=note(nw.isolated_note_zh,nw.isolated_note_en);
    if(nw.top_pagerank&&nw.top_pagerank.length){
      b+='<h4>PageRank（前 12）</h4>';
      b+=tbl(['词素','语义域','出现次数','PageRank','度'],[
        nw.top_pagerank.slice(0,12).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.n),num(r.pagerank,6),num(r.degree)];
        })
      ]);
    }
    if(nw.top_betweenness&&nw.top_betweenness.length){
      b+='<h4>介数中心性（前 10）</h4>';
      b+=tbl(['词素','语义域','介数'],[
        nw.top_betweenness.slice(0,10).map(function(r){
          return [esc(r.zh||r.id),esc(r.domain||''),num(r.betweenness!==undefined?r.betweenness:r.value,6)];
        })
      ]);
    }
    if(nw.communities&&nw.communities.length){
      b+='<h4>社群（'+(nw.communities||[]).length+' 个 · 覆盖 '+pct(nw.community_coverage,1)+'）</h4>';
      b+=tbl(['社群','规模','代表词素（前 8）'],[
        nw.communities.slice(0,12).map(function(c,i){
          var mem=c.members||[];
          return ['G'+(i+1),num(c.size!==undefined?c.size:mem.length),
            '<span style="font-size:0.86em">'+mem.slice(0,8).map(function(m){return esc(m.zh||m.id);}).join('、')+'</span>'];
        })
      ]);
    }
    if(nw.method_zh) b+=note(nw.method_zh,nw.method_en);
    h+=sec('bi-network','🕸️','词素共现网络中心性（限强共现子图）','Morpheme Co-occurrence Centrality (Strong Subgraph Only)',b,false);
  }

  /* ---------- 11. 序位置换检验 ---------- */
  var od=bi.ordinal;
  if(od){
    var b=note(od.note_zh,od.note_en);
    if(od.method_zh) b+=note(od.method_zh,od.method_en);
    b+=tbl(['观测量','值'],[
      ['相邻类平均相似度（观测）',num(od.adjacent_mean,4)],
      ['零分布均值（随机置换）',num(od.null_mean,4)],
      ['零分布标准差',num(od.null_sd,4)],
      ['z 值',num(od.z,4)],
      ['p 值（正态近似）',od.p===0?'< 1e-9':num(od.p,6)],
      ['全部两两平均相似度',num(od.all_pairs_mean,4)],
      ['同群组相邻对',num(od.same_group_adjacent,4)],
      ['跨群组相邻对',num(od.cross_group_adjacent,4)]
    ]);
    var cf2=od.confound;
    if(cf2&&cf2.adj_same_template_mean!==undefined){
      b+=tbl(['去混淆（模板代理＝类尾）','值'],[
        ['相邻且同类尾',num(cf2.adj_same_template_mean,4)],
        ['相邻但类尾不同',num(cf2.adj_diff_template_mean,4)],
        ['差（同−异）',num(cf2.same_minus_diff,4)]
      ]);
      b+=caveat('模板标签为**类首名末字之代理**（如「主城神」「主地神」皆以「神」为类尾），系分析层之代理变量，非经文所定之语义类。','Template labels are a proxy derived from the last character of each class name, not a sutra-given semantic class.');
    }
    if(od.segments&&od.segments.length){
      b+=tbl(['分段','类次范围','类数','段内相邻平均相似度'],[
        od.segments.map(function(s){
          return [esc(s.zh||s.group),(s.from_idx!==undefined?(s.from_idx+'–'+s.to_idx):'—'),num(s.n_classes),num(s.mean_sim_internal,4)];
        })
      ]);
    }
    if(od.conclusion_zh) b+='<div class="bi-find">'+zhEn(od.conclusion_zh,od.conclusion_en)+'</div>';
    h+=sec('bi-ordinal','🔢','序位结构检验（类次编排含语义梯度？）','Ordinal Structure Test: Is Sutra Order Semantic?',b,false);
  }

  /* ---------- 12. 质量与稳健性 ---------- */
  var q=bi.quality;
  if(q){
    var b=note(q.note_zh,q.note_en);
    if(q.grade_policy_zh) b+='<div class="bi-caveat">'+zhEn(q.grade_policy_zh,q.grade_policy_en)+'</div>';
    if(q.robustness&&q.robustness.length){
      var rows=q.robustness.map(function(r){
        return [esc(r.id||''),'<b>'+md(r.claim_zh||r.zh||'')+'</b>'+(r.claim_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.claim_en||r.en)+'</div>':'')
          ,md(r.finding_zh||r.result_zh||r.result||'')+(r.finding_en||r.result_en?'<div class="en-line" style="font-size:0.9em;color:var(--text2)">📖 '+esc(r.finding_en||r.result_en)+'</div>':'')];
      });
      b+=tbl(['#','稳健性检验','结果'],rows);
    }
    if(q.worst_classes&&q.worst_classes.length){
      b+='<h4>判读存疑率最高之群</h4>';
      b+=tbl(['群组','判读存疑率'],[
        q.worst_classes.slice(0,8).map(function(r){
          return [esc(r.zh||r.key||r.group_zh),pct(r.rate!==undefined?r.rate:r.pct,2)];
        })
      ]);
    }
    if(q.outliers&&q.outliers.length){
      b+='<h4>离群类（语汇面貌与他类皆不相近）</h4>';
      b+=tbl(['类','群组','与他类平均相似度'],[
        q.outliers.map(function(r){return [esc(r.cat),esc(r.group_zh),num(r.mean_sim,4)];})
      ]);
      if(q.outlier_note_zh) b+=note(q.outlier_note_zh,q.outlier_note_en);
    }
    h+=sec('bi-quality','✅','数据质量与稳健性（度量分析自身之可信度）','Data Quality & Robustness (Reliability of This Analysis)',b,false);
  }

  /* ---------- 13. 结论摘要 ---------- */
  var ex=bi.executive;
  if(ex&&ex.findings&&ex.findings.length){
    var b=note(ex.note_zh,ex.note_en);
    b+='<ol class="bi-findings">';
    ex.findings.forEach(function(f){
      b+='<li>'+(f.id?'<b>'+esc(f.id)+'</b>　':'')+md(f.zh||f.text_zh||'')
        +(f.en||f.text_en?'<div class="en-line" style="color:var(--text2);font-size:0.94em">📖 '+md(f.en||f.text_en)+'</div>':'')
        +(f.evidence?'<div style="font-size:0.78em;color:var(--text2);margin-top:2px">🔎 证据：'+esc(f.evidence)+'</div>':'')+'</li>';
    });
    b+='</ol>';
    h+=sec('bi-exec','📌','分析结论（解释层 · 非经文）','Findings (Interpretive Layer, Not Sutra Text)',b,false);
  }

  h+='</section>';
  return h;
}

</script>
