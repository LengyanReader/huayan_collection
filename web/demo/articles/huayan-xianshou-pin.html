var ARTICLE = {"id": "huayan-xianshou-pin", "file": "articles/huayan-xianshou-pin.html", "title": "九九华严第十二品 贤首品之拼读", "title_sub": "华严经第十二品·第二会·差别因果周·八十跨卷十四～十五（之一/之二二分）·文殊以偈问·贤首以偈答·宗眼「信为道元功德母」·初发心功德·十信相续链·三昧光明门·智自在譬喻·校量结叹·十方摩顶现证·偈颂数多源分歧（澄观359半·慧苑357半／依八十·智俨715半／依六十·颂偈口径别不裁）·注疏五家会读（澄观·法藏·智俨·慧苑·李通玄＋海云）·与六十《賢首菩薩品第八》对读·第二会六品收官·数据层·未完备已标明", "icon": "📖", "version": "", "meta": "", "doc": "docs/经学文献/华严经细读/第二会_普光明殿_差别因果周/华严经细读_第十二部_贤首品.md", "doc_md": "# 华严经细读·第十二部：贤首品（卷十四～十五·品十二）\n\n> **EN · Close Reading of the Avataṃsaka Sūtra, Part H: Chapter Twelve — *The Chief of Worthies*（贤首品）**（品题英译依 `data/catalog/chapters.yaml` order 12 · title_en \"The Chief of Worthies\" 直证〔L.185 取定〕；`in_tibetan: 1`——德格版 Toh 已入库（035–038），藏译逐字对勘未做〔未竟〕，见 §6.3）\n>\n> **底本**：唐·实叉难陀译《大方广佛华严经》（八十华严）`T10n0279`。**范围：卷第十四末～卷第十五·賢首品第十二（本品全文·分「之一」「之二」跨卷）**。本品属**第二会「普光明殿会」·差别因果周**，为第二会六品（名号·四圣谛·光明觉·问明·净行·贤首）之**收官**，亦十信法门之**结聚**。承第十一品《净行》（十信之「行」）之后，贤首明十信之**德**——问明明「解」、净行明「行」、贤首明「德」，三品共成十信（澄观、李通玄并判，见 §五）。全品为**文殊师利菩萨以偈问、贤首菩萨以偈答**之一大偈颂：文殊承净行「无浊乱清净行大功德」之端，「欲顯示菩提心功德故，以偈問賢首菩薩」；贤首以**三百余颂之偈**广说**初发心功德**，其眼目即「**信為道元功德母，長養一切諸善法，斷除疑網出愛流，開示涅槃無上道**」一颂，由此展开「信→持戒→供養→親近善知識→發菩提心→……→不退→受灌頂」之**十信相续功德链**，历三昧力供具、摄生十门、说四谛、一一光明门（恒沙）、三昧自在入出、智自在譬喻链（声闻·日月·幻师·阿脩罗·帝释千眼·天鼓·龙王兴云），末以**校量结叹**「若於此品能誦持，其福最勝過於彼」，感**十方诸佛现前摩顶赞叹**。此是《华严》**十信位「信德」之总汇**，亦汉传「**信为道元功德母**」一语最古、最完整之出处。\n> **立稿**：2026-10-25。承第一会六部及第二会前五部（第七至第十一部）之体例与校勘纪律。\n> **本篇进度（覆盖率自陈）**：**全稿成篇**——§〇 凡例、§一 概述与品题解义、§二 全文逐段细读（文殊偈问·贤首偈答·信德功德链·三昧光明门·智自在譬喻·校量结叹·十方现证）、§三 旁参与前接、§四 义理要点与名相、§五 注疏选要·诸家会读（5.1 澄观／5.2 法藏／5.2′ 智俨／5.2″ 慧苑／5.3 李通玄／5.3′ 海云讲记／5.4 小结）、§六 文本对读与校勘（八十／六十·跨卷之二分界·偈颂数三源分歧·校勘记）、§七 结构分析·数据层（7.1–7.4）、§八 附录、§九 台账，**皆已成**。本品六十辅读以 **STEP0 新入库 `T09n0278_juan6.txt`＋`juan7.txt`（L.181）** 逐字回源（跨卷拼接净身，见 §六·§7.4）。凡未能确证者标〔待核〕、属推断者标〔本文判断〕；**不以骨架冒充细读**。\n> **原则**：沿用既定校勘纪律、三层疏解（疏解／名相／会读）、存疑必标、推断必标「〔本文判断〕」、讲者之说疑误只标不改、三译主从分明、不擅改经文、可回源可复核。**引注疏原文一律繁体照底本、逐字回源并注经号与段落；会读按语用简体。**\n\n---\n\n## 〇　凡例\n\n1. **引文体例**：经文、注疏一律**繁体照底本、逐字回源**，括注经号与字符位（如 `T10n0279`@124463）。会读、疏解、按语用简体。\n2. **信度标识**：〔待核〕存疑未确证；〔本文判断〕属笔者推断，非疏家定论；〔讲师玄谈·非正行〕海云讲记玄谈段；⚖ 诸家异说并记不裁断。\n3. **主从分明**：八十为正本（跨卷十四～十五），六十（`T09n0278` 卷六～七《賢首菩薩品第八》·跨卷拼接）为辅读对勘本，四十无本品，藏译编目级记载 in_tibetan=1（见 §6.3）。\n4. **异文不统一**：两译自歧处各照其底本，不据一译改另一译。\n5. **数须实测**：品内一切计数（字数／偈颂数／关键词数／句读／分界位）**皆由 §7.4 复算脚本 `_p12_cov_run.py` 实测得出，不手录、不臆造**。本品偈颂数旧说纷纭（澄观「三百五十九頌半」／慧苑「三百五十七頌半」／智俨「七百一十五偈半」），须以底本实测对验（见 §六·§七），然**偈颂「半」之计量依疏家分行口径，非 CBETA 平文字符可直接复现**，故本案数只作诸家登录＋底本关键词实测，不强以今计裁古数〔待核·偈颂计量口径〕。\n\n---\n\n<!-- ATLAS:BEGIN P12 -->\n### 〇之零、导读指南（阅读路径与方法）\n\n**定位：** 考证型细读（philological close reading），以「可复核性」为第一优先。本品为第二会之**收官**，以偈颂为体，读法当**以颂为行、以链为脉**：七百一十七颂行，其骨在「信為道元功德母」一句，其肉在「若……則……」顶针一链。\n**本品一句：** **信為道元功德母，長養一切諸善法**——此十四字是全品宗眼；其后七百余颂，只是此一句的展转引申。\n**路径：** 〇之二（二图四表）→ 一（品题与脉络）→ 二（全文逐段）→ 四（义理与名相）→ 五（诸家会读）→ 七（数据层）→ 附录按需查阅。\n**方法：** 先经文后诠释；〔实测〕／〔本文判断〕／〔存疑待核〕三分；负面证据同样入账；结构覆盖 100%，个体择要。\n**读前三问：** ① 全品偈颂为主，而疏家所计之颂数（359 半／357 半／715 半）何以三源分歧？② 「若……則……」顶针链何以能长达数十环而不乱？③ 本品为十信之「德」，与净行之「行」、问明之「解」，三品之分界安在？\n\n## 〇之二、本品内容地图（未入其门，先观其海）\n\n> **本节体例。** 图与表之数据，一律取自本文已回源核定之 §二逐段表与 §7.1／§7.5 实测数；**凡属推断者标〔本文判断〕，不入图**。图各看一事，勿求一图而尽本品。\n\n### 〇之二.0 提要\n\n本品跨**卷第十四末至卷第十五**（起锚「賢首品第十二」首见 @124463，止锚「昇須彌山頂品第十三」@137665）。八十侧**净身 CJK 10,228 字**（剥空白 raw 11,694；之一 4,577＋之二 7,117），六十侧《賢首菩薩品第八》**10,159 字**（raw 11,633·跨 `juan6`／`juan7` 二拼接）——**两译仅差 69 字**，为全经两译篇幅最接近之品。全品**偈颂为主**：实测「頌」×**1**、「偈」×**3**，颂行 **717** 行（14 字行 ×716、13 字行 ×1），÷2＝**358.5 颂**；**问号 ×0**——文殊之问以偈托（「以偈問賢首菩薩曰」），不设「云何」句式。\n\n| 图 | 画什么 | 一句话 |\n|---|---|---|\n| **图 〇-1　颂行与两译计量图** | 量如何计 | 717 行 ÷2＝358.5 颂；三源 359.5／357.5／715.5；两译差 69 字 |\n| **图 〇-2　十信相续功德链·顶针图** | 链如何行 | 「若得 X，則 Y」而 Y 复为下句之 X：由信奉諸佛至身遍虚空 |\n\n**〔读法之序〕**　先观图 〇-1 得颂行之量与三源口径之别，次观图 〇-2 得顶针一链之骨，次读〇之二.3 之坐标，然后入 §二逐段。**量既明，链既见，然后可读其颂。**\n\n> **EN corresponding · Map of the Chapter.** The closing chapter of the second assembly, and almost entirely verse: 717 verse-lines (716 of fourteen characters, one of thirteen), that is 358.5 ślokas — against Chengguan's 359.5, Huiyuan's 357.5, and Zhiyan's 715.5 counted by line in the sixty-fascicle recension. Three figures, one text: a difference of counting, not of length. The eighty- and sixty-fascicle versions differ by only 69 characters. Fig. 0-1 plots the verse-lines and the three reckonings; Fig. 0-2 follows the chain of 「若…則…」 from faith in the Buddhas to a body filling space.\n\n### 〇之二.1 图 〇-1　颂行与两译计量图\n\n<figure>\n<svg viewBox=\"0 0 1000 560\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"24\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">七百一十七颂行：一行二句、二行一颂、三源三数</text>\n<text x=\"500\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a7a5e\">数据源 `_e12_lines.py`（3 lg／717 l）＋§7.5；条长按 CJK 字数比例（1 字＝0.058px）</text>\n\n<text x=\"30\" y=\"80\" font-size=\"13\" font-weight=\"bold\" fill=\"#7a5a28\">① 颂行之形</text>\n<rect x=\"150\" y=\"64\" width=\"416\" height=\"22\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/>\n<text x=\"576\" y=\"80\" font-size=\"12\" fill=\"#5a5147\">14 字行 ×716（10,024 字）</text>\n<rect x=\"150\" y=\"90\" width=\"1\" height=\"22\" fill=\"#b8863c\"/>\n<text x=\"160\" y=\"106\" font-size=\"12\" fill=\"#5a5147\">13 字行 ×1（L219「𢔌樂色者皆從道」·非 BMP 原字形照录）</text>\n<text x=\"30\" y=\"134\" font-size=\"11.5\" fill=\"#8a7a5e\">颂行 CJK 10,037 ＋ 散文题头 191 ＝ 10,228（§7.4 全体守恒）</text>\n\n<text x=\"30\" y=\"176\" font-size=\"13\" font-weight=\"bold\" fill=\"#7a5a28\">② 三源口径</text>\n<text x=\"30\" y=\"196\" font-size=\"11.5\" fill=\"#8a7a5e\">同一底本，三种计法；差在「颂／行」之口径，不在文本之多寡</text>\n<g font-size=\"12\" fill=\"#5a5147\">\n<text x=\"30\" y=\"228\">本文实测</text><rect x=\"150\" y=\"214\" width=\"358\" height=\"20\" fill=\"#f7ecd2\" stroke=\"#b8863c\" stroke-width=\"1.4\"/><text x=\"518\" y=\"229\" font-weight=\"bold\" fill=\"#7a5a28\">358.5 颂（717 行 ÷2）</text>\n<text x=\"30\" y=\"258\">澄观《疏》</text><rect x=\"150\" y=\"244\" width=\"359\" height=\"20\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"519\" y=\"259\">359.5 颂（差 +1）</text>\n<text x=\"30\" y=\"288\">慧苑《刊定记》</text><rect x=\"150\" y=\"274\" width=\"357\" height=\"20\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"517\" y=\"289\">357.5 颂（差 −1）</text>\n<text x=\"30\" y=\"318\">智俨《搜玄记》</text><rect x=\"150\" y=\"304\" width=\"715\" height=\"20\" fill=\"#ede4d2\" stroke=\"#c9b98f\"/><text x=\"875\" y=\"319\">715.5 偈（按行计·六十本）</text>\n</g>\n<text x=\"30\" y=\"344\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 智俨之数近本文之二倍，非经文多寡，乃「一颂＝二行」与「一行＝一偈」之别。古数不裁。</text>\n\n<text x=\"30\" y=\"386\" font-size=\"13\" font-weight=\"bold\" fill=\"#7a5a28\">③ 两译对</text>\n<g font-size=\"12\" fill=\"#5a5147\">\n<text x=\"30\" y=\"414\">八十 `T10n0279`</text><rect x=\"170\" y=\"400\" width=\"593\" height=\"20\" fill=\"#e6dbc5\" stroke=\"#c9b98f\"/><text x=\"773\" y=\"415\" font-weight=\"bold\" fill=\"#7a5a28\">10,228</text>\n<text x=\"30\" y=\"444\">六十 `T09n0278`</text><rect x=\"170\" y=\"430\" width=\"589\" height=\"20\" fill=\"#ede4d2\" stroke=\"#c9b98f\"/><text x=\"769\" y=\"445\" font-weight=\"bold\" fill=\"#b8863c\">10,159</text>\n</g>\n<text x=\"30\" y=\"468\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 差 69 字——全经两译篇幅最接近之品。然用字之偏则大异：三昧 33／68、光明 94／57、菩提心 3／6。</text>\n\n<line x1=\"30\" y1=\"490\" x2=\"970\" y2=\"490\" stroke=\"#d3c7ae\"/>\n<text x=\"30\" y=\"516\" font-size=\"12\" fill=\"#7a5a28\">体式：颂 ×1 · 偈 ×3 · 问号 ×0（「。」312·「，」1,001·「：」7·「；」112·「！」20）</text>\n<text x=\"30\" y=\"540\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 问号 0 而实有问：文殊「以偈問賢首菩薩曰」——问在偈中，不在句式。〔本文判断〕</text>\n</svg>\n<figcaption><b>图 〇-1　颂行与两译计量图。</b>三层：上为颂行之形（717 行、14 字为主），中为三源口径（358.5／359.5／357.5／715.5），下为两译总量（10,228／10,159）。<b>三源之差在「颂」与「行」之口径，不在文本之多寡</b>：澄观、慧苑按颂计（约 358），智俨按行计（约 716），恰为二倍。此图所要说明者唯一事——<b>数目之不合，先问口径，再问文本</b>。<div class=\"en-line\">Fig. 0-1. Three layers: the shape of the verse (717 lines, almost all fourteen characters); the three reckonings (358.5 by the present count, 359.5 Chengguan, 357.5 Huiyuan, 715.5 Zhiyan); and the totals of the two translations (10,228 / 10,159). The three figures differ by a factor of two because one counts ślokas and the others count lines. Ask about the measure before doubting the text.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. **「三百五十九颂半」不是文本，是口径。** 澄观所见即是今本；其数与本文实测仅差一颂，**差在「半颂」之断句处**。凡遇古德之数，先复原其计法。\n2. **智俨之 715.5 恰为本文之倍。** 一行一偈、二行一颂——**同一文本，两套度量衡**。不知此，则疑经文有增减。\n3. **两译差 69 字而用字之偏极大。** 三昧 33／68、光明 94／57——**总量近等而重心迥异**，此正是两译「译者之择」最清楚的证据。〔本文判断〕\n\n### 〇之二.2 图 〇-2　十信相续功德链·顶针图\n\n<figure>\n<svg viewBox=\"0 0 1000 580\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"24\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">十信相续功德链：一环扣一环，末环即首环之果</text>\n<text x=\"500\" y=\"44\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a7a5e\">取 §2.3 长段之要节为十三环（原链实有数十环）；箭头＝「則」字</text>\n\n<g font-size=\"12\" fill=\"#5a5147\">\n<rect x=\"60\" y=\"64\" width=\"330\" height=\"30\" rx=\"4\" fill=\"#f7ecd2\" stroke=\"#b8863c\" stroke-width=\"1.3\"/><text x=\"74\" y=\"84\">① 信奉諸佛</text><text x=\"330\" y=\"84\" font-size=\"10.5\" fill=\"#8a7a5e\">链首</text>\n<line x1=\"225\" y1=\"94\" x2=\"225\" y2=\"104\" stroke=\"#c9b98f\"/><text x=\"232\" y=\"104\" font-size=\"10\" fill=\"#b8863c\">則</text>\n<rect x=\"60\" y=\"104\" width=\"330\" height=\"30\" rx=\"4\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/><text x=\"74\" y=\"124\">② 持戒修學處</text>\n<line x1=\"225\" y1=\"134\" x2=\"225\" y2=\"144\" stroke=\"#c9b98f\"/><text x=\"232\" y=\"144\" font-size=\"10\" fill=\"#b8863c\">則</text>\n<rect x=\"60\" y=\"144\" width=\"330\" height=\"30\" rx=\"4\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/><text x=\"74\" y=\"164\">③ 具足諸功德</text>\n<line x1=\"225\" y1=\"174\" x2=\"225\" y2=\"184\" stroke=\"#c9b98f\"/><text x=\"232\" y=\"184\" font-size=\"10\" fill=\"#b8863c\">則</text>\n<rect x=\"60\" y=\"184\" width=\"330\" height=\"30\" rx=\"4\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/><text x=\"74\" y=\"204\">④ 遠離惡知識 · 親近善知識</text>\n<line x1=\"225\" y1=\"214\" x2=\"225\" y2=\"224\" stroke=\"#c9b98f\"/><text x=\"232\" y=\ 0\" rx=\"4\" fill=\"#f8f3ea\" stroke=\"#d9cdb8\"/><text x=\"624\" y=\"164\">⑫ 甘露灌頂</text>\n<line x1=\"775\" y1=\"134\" x2=\"775\" y2=\"124\" stroke=\"#c9b98f\"/><text x=\"782\" y=\"124\" font-size=\"10\" fill=\"#b8863c\">則</text>\n<rect x=\"610\" y=\"94\" width=\"330\" height=\"40\" rx=\"4\" fill=\"#f7ecd2\" stroke=\"#b8863c\" stroke-width=\"1.4\"/><text x=\"624\" y=\"112\">⑬ 身充遍如虛空</text><text x=\"624\" y=\"128\" font-size=\"10.5\" fill=\"#8a7a5e\">安住不動，滿十方</text>\n</g>\n\n<line x1=\"60\" y1=\"404\" x2=\"940\" y2=\"404\" stroke=\"#d3c7ae\"/>\n<text x=\"60\" y=\"430\" font-size=\"12\" fill=\"#7a5a28\">链法：「若得／若能 X，則 Y」；而 Y 即下句之 X——故数十环实为一环之展转。</text>\n<text x=\"60\" y=\"456\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 链首「信奉諸佛」出于「信」；链尾「身充遍如虛空」即「信」之满量。始终一信，中历万行。〔本文判断〕</text>\n<text x=\"60\" y=\"482\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 慧苑七科之「四若常信奉下所具行位」（`X0221`@145024）即指此链；澄观判为「摄前行愿，成信德用」。</text>\n<text x=\"60\" y=\"508\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 末环「甘露灌頂」正当十信满心、邻十住灌顶位——故本品之终即第三会之始，两会在位次上无缝。</text>\n<text x=\"60\" y=\"534\" font-size=\"11.5\" fill=\"#8a7a5e\">※ 望月轮／明月轮·如幻·如梦等譬喻在链后另起（§2.6 智自在况喻链），不在本图之列。</text>\n<text x=\"60\" y=\"560\" font-size=\"11.5\" fill=\"#7a5a28\">→ 读法：顺读见行位，逆读见一信。</text>\n</svg>\n<figcaption><b>图 〇-2　十信相续功德链·顶针图。</b>十三环取长段之要节（原链实有数十环），箭头即「則」字。<b>读法有二：顺读则见十信之行位层层增上，逆读则见始终只是一「信」</b>——链尾之「身充遍如虛空」，正是链首「信奉諸佛」之满量。末环「甘露灌頂」当十信满心、邻十住灌顶位，<b>故此品之终即第三会之始</b>，两会在位次上无缝相接。<div class=\"en-line\">Fig. 0-2. Thirteen nodes out of a much longer chain, the arrows being the word 則, \\\"then\\\". Read forward, the chain is a ladder of stations from faith to a body filling space; read backward, it is one faith unfolding. The last node, ambrosial consecration, is the very threshold of the ten abidings — so this chapter's end is the third assembly's beginning.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. **顶针不是修辞，是位次。** 「則 Y」之 Y 即下句之「若 X」——**法位相续，故句法相衔**；若视为文字游戏，则失其骨。\n2. **链可顺读亦可逆读，所得不同。** 顺读得「行位」，逆读得「一信」；**两读并存，方是华严「行布不碍圆融」之实例**〔本文判断〕。\n3. **链终即会终。** 甘露灌顶→身遍虚空，已越十信而抵十住之门；**故读本品末，须即读第十三品《升须弥山顶》**，不可断在两处。\n\n### 〇之二.3 本品在第二会（普光明殿·说十信）之坐标\n\n本品为第二会**第六品、亦收官之品**。第二会六品：前三（名号·四谛·光明觉）明所信之果（三业），后三（问明·净行·贤首）明能信之行（解·行·德）。**本品居末，以「德」结，以「信為道元」一句总摄前五品**。\n\n| 品 | 卷 | 位／科 | 一句提撕 | 与本品之关系 |\n|---|---|---|---|---|\n| 10 问明 | 卷13 | 十信·**解** | 九首递问，文殊总酬 | 解为行德之本 |\n| 11 净行 | 卷14 | 十信·**行** | 141 誓，遇事发愿 | 解而后行 |\n| **12 贤首（本品）** | 卷14–15 | 十信·**德**·满心 | 717 颂行，信為道元 | 行而后德，十信满心 |\n| 13 升须弥山顶 | 卷16 | 第三会·十住·**发起** | 偈赞佛德，不起而升 | 本品末之灌顶即彼会之门 |\n| 14 须弥顶上偈赞 | 卷16 | 第三会·十住·**方便发起** | 十菩萨各说一颂 | 由信入住之第一声 |\n| 15–18 十住·梵行·初发心·明法 | 卷16–18 | 第三会·十住·**正位·满足** | 十住阶位 | 本品所望之全体 |\n\n### 〇之二.4 本品形式特征（与邻品对看）\n\n本品之特色在**「偈颂为主而问号为零」**：全品以偈构成，文殊之问亦托于偈（「以偈問賢首菩薩曰」），故不设「云何」句式。**在三十九品中，以偈颂叹德、以顶针成链、而纯以「信」之一字立宗者，唯此一品**〔本文判断·据本文所核诸品文体〕。\n\n| 特征 | 本品表现〔实测〕 | 邻品之对照 | 读法上的后果 |\n|---|---|---|---|\n| 偈颂为主 | 颂行 717／颂 ×1／偈 ×3（实测） | 净行品颂 ×0·偈 ×0（纯长行） | 第二会文体之两极：一纯长行，一纯偈颂 |\n| 问号 ×0 | 「。」312·「？」**0** | 净行「云何」×20·问号 21 | 问在偈中，不在句式 |\n| 顶针长链 | 「若……則……」数十环，一气贯通 | 问明九段并列而不相衔 | 一为链，一为阵 |\n| 十门三昧 | 澄观「略辨十門三昧業用」：海印·華嚴·因陀羅網·手出廣供·現諸法門·四攝·俯同世間·毛光·主伴·寂用 | 他品无此十门之科 | 本品之「德」以三昧业用显，非以言说显 |\n| 两译近等 | 八十 10,228／六十 10,159，差 69 字 | 净行 141／140 誓；名号 211 两译同 | 总量近等而用字偏异（三昧 33／68） |\n| 颂数三源 | 澄观 359.5／慧苑 357.5／智俨 715.5 | 净行誓数疏家与实测全合 | 一为口径之别，一为文本之实 |\n\n### 〇之二.5 五种读法（导览）\n\n| 读法 | 路径 | 适合谁 | 得什么 |\n|---|---|---|---|\n| **链读** | 只读 §2.3 顶针一链，余皆暂置 | 初读本篇者 | 得十信行位之一气 |\n| **宗读** | 只读「信為道元功德母」四句，反复 | 欲把捉宗旨者 | 得全品之宗眼 |\n| **门读** | 依 §7.5 十门行链，逐门读三昧业用 | 好结构者 | 见「德」如何以业用显 |\n| **数读** | 图 〇-1 ＋ §7.5 L2 口径对验 | 欲核文本者 | 三源之数不复相碍 |\n| **承读** | 本品末 → 第十三品 §2.1 | 欲见会际衔接者 | 见灌顶如何接「不起而升」 |\n\n### 〇之二.6 数与位之谱：本品之数，四等分录\n\n华严之数非计数之数。本品所涉之数，来源不一，性质亦不一；**先分其等，后论其义**，则不为数目所惑。\n\n| 等第 | 数 | 出处 | 性质 |\n|---|---|---|---|\n| **T0 经文明文** | 「信為道元功德母，長養一切諸善法」 | `T10n0279` 卷十四 | 全品宗眼（两译各唯一见） |\n| **T0 经文明文** | 「以偈問賢首菩薩曰」 | 同上 | 问托于偈（故问号 0） |\n| **T0 本文实测** | **717 颂行／358.5 颂／10,228 字** | §7.5 `_e12_lines.py` | 计数（本文自测） |\n| **T0 本文实测** | 之一 4,577＋之二 7,117＝11,694（raw） | §6.1／§7.1 | 计数（本文自测） |\n| **T1 澄观《疏》** | 「第二正顯偈詞。有三百五十九頌半」 | `T1735`@195841 | 注疏之数（差 +1） |\n| **T1 慧苑** | 「總即三百五十七頌半」 | `X0221`@145024 | 注疏之数（差 −1） |\n| **T1 智俨** | 「此品有七百一十五偈半」 | `T1732`@29947（依六十·按行计） | 口径之别，非文本之差 |\n| **T2 转述** | 「贤首品明十信之德」 | 诸家科文 | 判摄语，须注家 |\n\n> **〔读法〕** 本品之「数」有一特殊难处：**三家所计皆与本文实测差 ±1 颂，而智俨之数恰为二倍**。故本篇之立场为——**不裁古数，不疑底本，先复原其计法**。凡数之不合，先问「一行还是一颂」，再问「谁所见本」；二者既明，则三源各安其位。\n\n<!-- ATLAS:END P12 -->\n\n## 一　概述\n\n### 1.1 品题解义\n\n**賢首品第十二**（八十·卷十四末～十五，跨卷分「之一」「之二」）；**賢首菩薩品第八**（六十·卷六～七，亦跨卷分「之一」「之二」）。\n\n- **「贤首」释义（澄观·持业／依主双释）**：「**體性至順調善曰賢。吉祥勝德超絕名首。即以此名菩薩演說此法。賢即是首。賢首之品。以當賢位之初攝諸德。故偏舉賢名**」（`T1735`@195841·§5.1）。是知「贤」＝体性至顺调善、「首」＝吉祥胜德超绝；贤首当「**贤位之初**」（十信满心、将入十住之贤位初），摄诸德故偏举贤名。\n- **慧苑梵义（有财／依主两释·直证专段存在）**：「**賢善也首勝也。謂性善德勝故曰賢首。此則賢之首故。有財釋也。賢首菩薩說此品故。名賢首品。此則賢首之品。亦依主釋也**」（`X0221`@145024·§5.2″）。——「贤之首」作有财释（持业）、「贤首之品」作依主释，二释并存。\n- **李通玄释（依行立名）**：「**以明信解如來因果普賢五位行門。心行調柔。順和正直深心正念。樂集善根常念利生。名之為賢。創從凡夫頓彰法界諸佛因果理智一時明現。名之為賢首……乃是於佛果海。文殊普賢行之賢首。為信佛因果理智之首圓滿法界解行無始終之首故為賢首品**」（`T1739`@177918·§5.3）——李通玄以「贤」为心行调柔之解行、「首」为顿彰法界因果理智之初心，**依行立菩萨之名**。\n- **来意（承前净行）**：澄观「**夫行不虛設必有其德。既解行圓妙必勝德難思。收前行願成信德用。故次來也。又前智首舉果徵因。文殊廣顯其因。略標其果。云獲一切勝妙功德。故問賢首令廣斯言**」（`T1735`@195841·§5.1）；慧苑「**前品明信中願行。今明信中德業。故次來也**」（`X0221`@145024·§5.2″）；智俨「**行既成立。次須廣歎德用成位故來也**」（`T1732`@29947·§5.2′）；李通玄「**此品明十信中所欣修佛果所行行願功德廣大故有此品來也**」（`T1739`@177918·§5.3）。四家同判：**净行明「行」、贤首明「德」（行所成之德用）**，行满则德显。\n- **宗趣**：澄观「**於信門中成普賢行德。而自在莊嚴。無方大用建立眾生。通貫始終該攝諸位。以為其宗。令起圓融信行成位德用。而為意趣**」（`T1735`@195841）；慧苑「**以信德用為宗。為後成位為趣**」（`X0221`@145024）；智俨「**三宗為歎德**」（`T1732`@29947）；李通玄「**明已生十信心已得福獲益為宗**」（`T1739`@177918）。——宗趣归在**信门中成普贤行德、叹信德之用的胜能**。\n\n### 1.2 品位与脉络（承上启下·第二会收官）\n\n本品在**第二会·普光明殿**（差别因果周·说十信）之**末**，为六品之结聚。三条脉络须并观：\n\n- **会内次**：名号（身业·遍应）→四圣谛（口业·说法）→光明觉（意业·遍觉）→问明（十信之**解**）→净行（十信之**行**）→**贤首（十信之德）**——贤首殿后，由行显德，三品（解·行·德）共成十信。\n- **三品共成十信**：李通玄「**又說光明覺品菩薩問明品淨行品賢首品。成就十信之門**」（`T1739`@41813·承 L.184）；澄观判净行「收前行願成信德用」、贤首「於信門中成普賢行德」，二品一「行」一「德」相承。\n- **十信满心·成位之枢**：智俨「**十信已滿位是賢聖之初。為凡頂菩薩中初故曰賢首品**」（`T1732`@29947·§5.2′）、澄观「**以當賢位之初攝諸德**」——贤首品正明**十信满心、将入十住贤位之初**，是十信法门之顶点与转出。〔本文判断〕「信为道元功德母」之所以立为本品宗眼，正在其总摄十信一切功德以为贤位之基。\n\n### 1.3 篇幅与结构量级（实测）\n\n本品八十侧**净身 CJK 10,228 字**（剥空白含标点 raw **11,694**·品界 @124463–137665，起锚「賢首品第十二」**首见**、止锚「昇須彌山頂品第十三」，见 §7.4）；六十侧《賢首菩薩品第八》**净身 CJK 10,159 字**（剥空白 raw **11,633**·跨 `juan6.txt`＋`juan7.txt` 之二拼接净身·§7.4）。本品**偈颂为主**——实测「頌」×**1**、「偈」×**3**（「以偈問」「以偈答」「稱揚……頌」类），与净行之「頌×0·偈×0」纯长行**判然相反**，亦与问明之「以頌答曰」偈答体同其质地。句读实测：「。」×**312**、「，」×**1,001**、「？」×**0**、「：」×**7**、「；」×**112**、「！」×**20**（§7.4）——**问号×0**，盖文殊之「问」以偈托（「以偈問賢首菩薩曰」），不设「云何」疑问句式，此与净行（问段「云何」×20·问号×21）为**文体之辨**。全品跨卷分「**之一**」（卷十四·@124463 起·body 相对位 0–4576，凡 4,577 字）与「**之二**」（卷十五·重题「賢首品第十二之二」@129634·body 相对位 4577·凡 7,117 字），二之和即全品（§7.4·§六〔一〕）。\n\n> **数须对验之声明**：本品偈颂数，疏家各据所见本计——澄观「**第二正顯偈詞。有三百五十九頌半**」（`T1735`@195841）、慧苑「**總即三百五十七頌半**」（`X0221`@145024）、智俨「**此品有七百一十五偈半……二有七百七偈半賢首正答**」（`T1732`@29947·依六十）。三源分歧（359 半／357 半／715 半），系「頌（四句一颂）」与「偈（一行一偈）」计量口径之别、及八十／六十文本分行之异。〔本文判断〕澄观、慧苑据八十（三百余**颂**），智俨据六十（七百五十**偈**·每行计），非经文多寡之实差。今**不裁古数**，只以底本关键词实测（信為道元×1、三昧×33、光明×94·§7.4）对读；偈颂「半」之精确复现〔待核·偈颂计量口径〕。\n\n### 1.4 核心要义（画龙点睛·EN）\n\n1. *Faith is the origin of the Way, the mother of all merit* — the chapter's signature verse \"信為道元功德母，長養一切諸善法，斷除疑網出愛流，開示涅槃無上道\" (faith, the mother of merit, nurtures all wholesome dharmas, cuts the net of doubt, and opens the path to nirvana); this is the earliest and fullest canonical source of the Chinese Huayan motto \"信为道元功德母\" (§2.2, the flagship line).\n2. *The功德 of the first arousal of the bodhi-mind, beyond measure* — 贤首 opens by declaring that even a bodhisattva's *initial* vow to seek awakening has merit \"無邊際，不可稱量無與等,\" illustrated as \"a single drop in the great ocean,\" \"a bird's footprint in the sky,\" \"one mote of the great earth\" (§2.1).\n3. *A chained genealogy of faith* — from \"若常信奉於諸佛\" through precepts, offering, close association with spiritual friends, arousal of bodhi-citta, up to non-retrogression and the coronation-anointing (灌頂), each link begets the next in a hundred-plus verse chain that maps the ten stages of faith (§2.3, the faith-genealogy).\n4. *Understanding → practice → virtue: three chapters complete the ten stages of faith* — Chengguan frames 贤首 as the \"virtue\" (德) consummating the \"understanding\" (问明) and \"practice\" (净行); the \"faith\" reaches fullness here and issues toward the worthy stage (§5.1).\n\n### 1.5 经文文本现象与信度标识\n\n- **「信为道元功德母」宗眼（直证）**：贤首偈答既叹初发心功德，即标「**信為道元功德母，長養一切諸善法，斷除疑網出愛流，開示涅槃無上道**」（`T10n0279` body@·之一·§2.2）——一颂统摄全品。实测八十侧「信為道元功德母」**×1**、六十侧也**×1**（`_p12_cov_run.py` §7.4），两译宗眼各唯一见，异文在第三、四句（详 §六〔四〕）。〔本文判断〕此颂是全品之脊，十信相续链（§2.3）即此颂之展开，非疏家附会。\n- **偈颂体·无「云何」疑问（直证）**：实测「？」×0（§7.4）——文殊「以偈問賢首菩薩曰」之「问」，以偈托问、不立疑问句式，与净行二十「云何」问（问号×21）相反。此是「德门」（叹德·说法）与「行门」（请问·发愿）之文体表征。〔本文判断〕纯偈颂叹德之体，正应「廣歎德用」（智俨·§1.1 来意）。\n- **初发心功德·三喻（直证）**：「**彼之功德無邊際，不可稱量無與等**」继以「**譬如鳥足所履空，亦如大地一微塵**」叹己之所说少（§2.1），又「**猶如大海一滴水**」喻（之一·§2.1「我今隨力說少分，猶如大海一滴水」）——三喻（鸟足履空／大地微尘／大海一滴）会于「说少分」之谦，与讲记口径合（§5.3′）。\n- **止锚「賢首品第十二」全档二见·P12 起锚规则（直证·订正 P11 表述）**：实测八十全档「賢首品第十二」见**2 次**，idx **[124463, 129634]**（`_p12_cov_run.py` §7.4 断言）。**首见 @124463 为本品真起锚**（之一·卷十四）；**第二见 @129634 系本品正文跨卷（卷十四→卷十五）时之「賢首品第十二之二」重题**，**非「列品目处」**。〔本文判断·照记订正〕P11 净行品专篇 §1.5／§6.4#6 尝述第二见 @129634 为「卷十五首重题（列品目处）」，于「重题」得之、于「列品目处」不精确——@129634 实为**本品自身之跨卷重题**（紧邻「之二」），非另品之目录行；P11 之「净行止锚取首见 @124463」结论**不变且更得直证**（若误用 @129634 将漏「之一」全段·4,577 字）。\n- **六十跨卷拼接（直证·数据层）**：六十《賢首菩薩品第八》同样跨卷六～七、分「之一」「之二」（`juan6.txt`「賢首菩薩品第八／之一」@·＋`juan7.txt`「賢首菩薩品第八／之二」·止锚「佛昇須彌頂品第九」）；§7.4 复算以品题起锚＋卷末／次品止锚**拼接净身**，剔 `juan7` 头之「大方廣佛華嚴經卷第七」「于闐國三藏…」等非本品字，得 CJK 10,159（详见 §六〔二〕·初版未剔卷七题头致虚高之误已订正）。\n\n---\n\n## 二　全文逐段细读\n\n本品通体偈颂，依慧苑四分科（`X0221`@145024·§5.2″）「一經家敘述文殊前說分。二我今已為下文殊勸說分。三爾時賢首菩薩下依勸演暢分。四時賢下顯實證成分」及澄观三分（`T1735`@195841）「初文殊發起。次賢首廣說。三十方現證」为纲，折为六段疏解。\n\n### 2.1 发起·文殊偈问与贤首谦许（之一·卷十四@124463–）\n\n> 爾時，文殊師利菩薩說無濁亂清淨行大功德已，欲顯示菩提心功德故，以偈問賢首菩薩曰：「我今已為諸菩薩，說佛往修清淨行，仁亦當於此會中，演暢修行勝功德。」爾時，賢首菩薩以偈答曰：「善哉仁者應諦聽，彼諸功德不可量，我今隨力說少分，猶如大海一滴水。若有菩薩初發心，誓求當證佛菩提，彼之功德無邊際，不可稱量無與等。何況無量無邊劫，具修地度諸功德，十方一切諸如來，悉共稱揚不能盡。如是無邊大功德，我今於中說少分，譬如鳥足所履空，亦如大地一微塵。」\n\n- **疏解**：经家叙「文殊說無濁亂清淨行大功德已」（结前净品）、「欲顯示菩提心功德故，以偈問賢首」（生后德门）——一句锁定本品之旨＝**显示菩提心功德**。贤首答端先**谦许**（善哉·谛听·说少分如大海一滴），再**总标初发心功德无边际**：「若有菩薩初發心，誓求當證佛菩提，彼之功德無邊際，不可稱量無與等」。慧苑「初歎廣說略」分、科「一歎廣說略。四頌謙讚許說分」（澄观语·§5.1），即此段。\n- **名相**：**賢首菩薩**（答主·训见 §1.1）；**初發心**（初发菩提心·誓求当证佛菩提）；**地度**（十地·诸度·「具修地度諸功德」）。\n\n### 2.2 宗眼·发心之因与「信为道元功德母」（之一·@·§1.5）\n\n> 菩薩發意求菩提，非是無因無有緣，於佛法僧生淨信，以是而生廣大心。……深信於佛及佛法，亦信佛子所行道，及信無上大菩提，菩薩以是初發心。**信為道元功德母，長養一切諸善法，斷除疑網出愛流，開示涅槃無上道。**信無垢濁心清淨，滅除憍慢恭敬本，亦為法藏第一財，為清淨手受眾行。信能惠施心無吝，信能歡喜入佛法，信能增長智功德，信能必到如來地。……信為功德不壞種，信能生長菩提樹，信能增益最勝智，信能示現一切佛。\n\n- **疏解**：先明发心之**因果**——「非是無因無有緣，於佛法僧生淨信，以是而生廣大心」（净信三宝为发心之因）；即立宗眼「**信為道元功德母**」一颂，为一切善法之所长养、能断疑网、出爱流、开涅槃道。其后一连「信能……」句（信能惠施／信能歡喜入佛法／信能增長智功德／信能必到如來地／信能永滅煩惱本／信能超出眾魔路／信能生長菩提樹／信能示現一切佛），将六度万行悉归于「信」之功德用。慧苑七科之「**三信為道元下略示勝能**」（`X0221`@145024·§5.2″）正指此段。\n- **名相**：**道元**（道之所始·之源）；**功德母**（能生功德）；**疑網**（疑如网缚）；**愛流**（贪爱之流·出爱流即超生死）；**法藏第一財**（信为法财之首）；**不壞種**（信为功德不坏之种）。\n\n### 2.3 十信相续功德链·「若常信奉于诸佛……」（之一·@·§1.4）\n\n> 若常信奉於諸佛，則能持戒修學處；若常持戒修學處，則能具足諸功德。……若常信奉於尊法，則聞佛法無厭足；……若常信奉清淨僧，則得信心不退轉；……則得諸根淨明利若得諸根淨明利則能遠離惡知識若能遠離惡知識則得親近善知識若得親近善知識則能修集。……若為諸佛所護念，則能發起菩提心。若能發起菩提心，則能勤修佛功德；……則得信樂心清淨；……則常修習波羅蜜；……則能如法供養佛；……則常覩見無量佛；……則得辯才無障礙；……則得堅固大悲心；……若能摧殄諸魔力則能超出四魔境若能超出四魔境則得至於不退地若得至於不退地則得無生深法忍。……則蒙十方一切佛手以甘露灌其頂若蒙十方一切佛手以甘露灌其頂則身充遍如虛空安住不動滿十方……\n\n- **疏解**：全品最长一段，是**顶针（递相衔接）式之十信功德链**——每一「若得／若能 X，則 Y」之 Y 复为下一句之 X，自「信奉諸佛」起，历**持戒→修學→供養→聞法→信僧→不退→親近善知識→修廣大善→發菩提心→勤修佛功德→生如來家→波羅蜜→摩訶衍→如法供養→見無量佛→辯才→慈愍度生→大悲心→舍有為過→兼利一切眾→處生死無疲厭→大神通→善攝眾生智→四攝法→不退地→無生法忍→授記→灌頂（甘露灌頂）→身遍虛空**。此链即「信為道元功德母」之别显，将十信位之展转增上，摄为一气贯通之偈。慧苑七科之「**四若常信奉下所具行位**」（`X0221`@145024）指此。\n- **名相**：**不退地**（位不退·转属十信满心向）；**無生深法忍**（无生法忍）；**甘露灌頂**（十信满心、邻十住之灌顶位·「則蒙十方一切佛，手以甘露灌其頂」）；**善知識／惡知識**（亲善离恶·净行品段六亦历此）。\n\n### 2.4 三昧力·供具·摄生十门·说四谛（之一末～卷十四末@·L172–296）\n\n> 若欲供養一切佛，入于三昧起神變，能以一手遍三千，普供一切諸如來。十方所有勝妙華，塗香末香無價寶，如是皆從手中出，供養道樹諸最勝。……菩薩住在三昧中，種種自在攝眾生……或以供養如來門，或以難思布施門，或以頭陀持戒門，或以不動堪忍門。或以苦行精進門，或以寂靜禪定門，或以決了智慧門……或以大乘自在門。……或邊呪語說四諦或善密語說四諦或人直語說四諦或天密語說四諦分別文字說四諦決定義理說四諦善破於他說四諦非外所動說四諦或八部語說四諦或一切語說四諦隨彼所解語言音為說四諦令解脫。（頂針全式·底本「說四諦」叠句×十・已验合）（卷第十四终·「大方廣佛華嚴經卷第十四」）\n> 所有一切諸佛法皆如是說無不盡知語境界不思議是名說法三昧力。〔卷第十四終·题头行见 §2.7′ 壬块原位〕\n\n- **疏解**：链后至**三昧力之别显**——(a) **掌中供具**：入三昧起神变，一手遍三千、华香宝衣妓乐皆从掌出，供养诸佛（§附录三）；(b) **摄生十门**：「或以……門」历供養／布施／持戒／堪忍／精進／禪定／智慧／方便／梵住神通／四攝／福智莊嚴／因緣解脫／根力正道／聲聞／獨覺／大乘等门，随众生差别而摄（「隨諸眾生病不同，悉以法藥而對治」）；(c) **说四谛**：以边咒语／善密语／人直语／天密语／分别文字／决定义理……九种语说四谛，「隨彼所解語言音，為說四諦令解脫」——**此段与第二会第四品《四圣谛》跨品呼应**（§三·旁参）。「大方廣佛華嚴經卷第十四」之题截于此段中（之一止·之二起）。\n- **名相**：**三昧**（等持·实测本品「三昧」×33·§7.4）；**頭陀**（净行品段四亦见·少欲知足）；**四攝**（布施／爱语／利行／同事）；**四諦**（苦集灭道·跨品呼应第四品）。\n\n### 2.5 一一光明门·恒沙无尽（之二·卷十五@129634–·L304–489）\n\n> 「有勝三昧名安樂，能普救度諸群生，放大光明不思議，令其見者悉調伏。\n>\n> 所放光明名善現……又放光明名照耀……又放光明名濟度……又放光明名滅愛……又放光明名歡喜……又放光明名愛樂……又放光明名福聚……又放光明名具智……又放光明名慧燈……又放光名法自在……又放光明名能捨……又放光明名除熱……又放光明名忍嚴……又放光明名勇猛……又放光明名寂靜……又放光明名慧嚴……又放光明名佛慧……又放光明名無畏……又放光明名安隱……又放光明名見佛……又放光明名樂法……又放光明名妙音……（門号叠咏·序码 L282–439 逐行全录见 §2.7′（癸）块）……又放光名眼清淨……又放光名耳清淨……（中略六根六尘十二清淨門·全偈逐行见 §2.7′）……又放光名法清淨……如是等比光明門，如恒河沙無限數，悉從大仙毛孔出，一一作業各差別。」\n\n- **疏解**：**之二**（卷十五重题「賢首品第十二之二」起）转说**光明门**——以「有勝三昧名安樂」总起，历「又放光明名善現／照耀／濟度／滅愛／歡喜／愛樂／福聚／具智／慧燈／法自在／能捨／除熱／忍嚴／勇猛／寂靜／慧嚴／佛慧／無畏／安隱／見佛／樂法／妙音／施甘露／最勝／寶嚴／香嚴／……」及六根六尘「眼清淨……法清淨」诸门，**每一光明门**皆先立名、复明「此光能覺一切眾，令……」（令发某行／得某果）、结「是故得成此光明」，**首尾回环、叠咏成章**。末汇于「**如是等比光明門，如恒河沙無限數，悉從大仙毛孔出，一一作業各差別**」——实测本品「光明」×**94**（§7.4），正应此恒沙光明门之叠咏质地。慧苑七科之「**五或有剎土下無方大用。六一切如來下喻況玄旨**」（§5.2″）摄此段及其下。\n- **名相**：**安樂三昧**（「有勝三昧名安樂」·光明门之总依）；**善現／照耀／濟度／滅愛……光明**（各门之名·随本行宿缘所得）；**恒河沙光明門**（叹其数无尽）；**大仙**（佛／大士之尊称）。\n\n### 2.6 智自在譬喻链·校量结叹·十方现证（之二·@·L490–759）\n\n> 如一毛孔所放光，無量無數如恒沙，一切毛孔悉亦然，此是大仙三昧力。……譬如生盲不見日，非為無日出世間……大士光明亦如是，有智慧者皆悉見，凡夫邪信劣解人，於此光明莫能覩。……聲聞心住八解脫……能以一身現多身……譬如日月遊虛空，影像普遍於十方……如淨水中四兵像……海中有神名善音……譬如幻師知幻法……天阿脩羅鬪戰時……釋提桓因有象王……自化作頭三十三……帝釋現身有千眼……忉利天中有天鼓……大海龍王遊戲時，普於諸處得自在，興雲充遍四天下……（智自在譬喻链）……十剎塵數如來所，悉皆承事盡一劫，**若於此品能誦持，其福最勝過於彼。**時，賢首菩薩說此偈已，十方世界六返震動，魔宮隱蔽，惡道休息。十方諸佛普現其前，各以右手而摩其頂，同聲讚言：「善哉！善哉！快說此法！我等一切悉皆隨喜。」\n\n- **疏解**：光明门后，转入**三昧／智自在之譬喻链**——(a) **入出遍十方**（「或於東方入正定，而於西方從定出」·根尘互入·童子身～如來身～天龍鬼神身展转入定）；(b) **智自在难思**，以七重「彼有貪欲瞋恚癡，尚能……況……」之**况喻**递显菩萨自在远胜：声闻八解脱一身多身／日月影像遍十方／净水四兵像／海中善音神／辩才女人／幻师／阿脩罗退走／帝释象王三十三头·千眼／忉利天鼓／摩醯首罗·大海龙兴云雨（各天云色·电色·雷音·所雨物·随类差别）。此链以有漏凡圣之劣神通，况显菩萨无漏自在之胜（「如是一切皆自在，以佛華嚴三昧力」）。末**校量结叹**：举顶戴三千大千界／手擎十佛剎／承事十剎尘数如来各经一劫，皆「未為難／未為勝」，唯「**信是法者**」「**若於此品能誦持，其福最勝過於彼**」为最——慧苑七科「**七第一智慧下校量勸持**」（§5.2″）指此。结以**十方现证**：「說此偈已，十方世界六返震動……十方諸佛普現其前，各以右手而摩其頂，同聲讚言：善哉！善哉！快說此法！我等一切悉皆隨喜」——澄观三分「**三十方現證**」、智俨「三……六偈經家所顯諸佛證成」（§5.1/§5.2′）之结聚分。\n- **名相**：**海印三昧**（「海印三昧威神力」·现一切法）；**八解脫**（声闻定·况喻之首）；**摩醯首羅**（色究竟天·智自在·数雨滴喻）；**六返震動**（六种震动·瑞应）；**摩頂隨喜**（十方佛印证）。\n### 2.7′　偈颂全文照录·八十 717 颂行逐行〔L.190 本批·全量入文〕\n\n本品通体偈颂：品内 div 实测 **3 个 `<lg>`·717 颂行**（L2／L278／L437·`_e12_lines.py` 逐行抽取·行长 14 字×716＋13 字×1——13 字行系底本「𢔌」（U+224CC·非 BMP）原字形所致·照录不替换）。**每行二句（7＋7）、四句一颂＝二行**，实测 717 行＝**358.5 颂**；澄观「三百五十九頌半」／慧苑「三百五十七頌半」／智俨「七百一十五偈半」三源分歧**并记不裁**（⚖口径辨·§1.3/§5.4/§7.5）。以下逐行照录（编号为全品序码 L000–L716·**引文照底本原字形、全角标点、「「」『』』号与跨卷题头／译场衔／重题原位保留·不转写不断句**）；散文单元（经家叙·结叹）与跨卷题头按 body 原位穿插·各 `>` 行 CJK 皆为 body80 连续子串（`_e12_probe2.py` 逐行验 **0 miss**·与 §二 引文审计同口径）。段题依澄观科（`T1735` 卷十六·附录四全文·§5.1 纲格），并注与 §2.1–§2.6 六段疏解之对应：\n\n**（甲）经家叙·文殊偈问（问偈 1 颂·§2.1）**\n\n> 賢首品第十二之一〔品题·重题「之一』非颂行·序码外〕\n\n> 爾時，文殊師利菩薩說無濁亂清淨行大功德已，欲顯示菩提心功德故，以偈問賢首菩薩曰：\n\n> 000｜「我今已為諸菩薩，說佛往修清淨行，\n> 001｜仁亦當於此會中，演暢修行勝功德。」\n\n**（乙）贤首谦许·四颂〔澄观「初四頌謙讚許說分」实测 8 行全合·§2.1〕**\n\n> 爾時，賢首菩薩以偈答曰：\n\n> 002｜「善哉仁者應諦聽，彼諸功德不可量，\n> 003｜我今隨力說少分，猶如大海一滴水。\n> 004｜若有菩薩初發心，誓求當證佛菩提，\n> 005｜彼之功德無邊際，不可稱量無與等。\n> 006｜何況無量無邊劫，具修地度諸功德，\n> 007｜十方一切諸如來，悉共稱揚不能盡。\n> 008｜如是無邊大功德，我今於中說少分，\n> 009｜譬如鳥足所履空，亦如大地一微塵。\n\n**（丙）发心行相·五颂〔澄观「文分為五。初五頌發心行相」实测 10 行全合·§2.2〕**\n\n> 010｜菩薩發意求菩提，非是無因無有緣，\n> 011｜於佛法僧生淨信，以是而生廣大心。\n> 012｜不求五欲及王位，富饒自樂大名稱，\n> 013｜但為永滅眾生苦，利益世間而發心。\n> 014｜常欲利樂諸眾生，莊嚴國土供養佛，\n> 015｜受持正法修諸智，證菩提故而發心。\n> 016｜深心信解常清淨，恭敬尊重一切佛，\n> 017｜於法及僧亦如是，至誠供養而發心。\n> 018｜深信於佛及佛法，亦信佛子所行道，\n> 019｜及信無上大菩提，菩薩以是初發心。\n\n**（丁）信为道元·略示胜能·七颂〔实测 14 行全合·宗眼 L020–021·§2.2〕**\n\n> 020｜信為道元功德母，長養一切諸善法，\n> 021｜斷除疑網出愛流，開示涅槃無上道。\n> 022｜信無垢濁心清淨，滅除憍慢恭敬本，\n> 023｜亦為法藏第一財，為清淨手受眾行。\n> 024｜信能惠施心無吝，信能歡喜入佛法，\n> 025｜信能增長智功德，信能必到如來地。\n> 026｜信令諸根淨明利，信力堅固無能壞，\n> 027｜信能永滅煩惱本，信能專向佛功德。\n> 028｜信於境界無所著，遠離諸難得無難，\n> 029｜信能超出眾魔路，示現無上解脫道。\n> 030｜信為功德不壞種，信能生長菩提樹，\n> 031｜信能增益最勝智，信能示現一切佛。\n> 032｜是故依行說次第，信樂最勝甚難得，\n> 033｜譬如一切世間中，而有隨意妙寶珠。\n\n**（戊）信三宝成行·八颂半〔澄观「第三若常信奉下」之初段·实测 17 行全合·§2.3〕**\n\n> 034｜若常信奉於諸佛，則能持戒修學處；\n> 035｜若常持戒修學處，則能具足諸功德。\n> 036｜戒能開發菩提本，學是勤修功德地；\n> 037｜於戒及學常順行，一切如來所稱美。\n> 038｜若常信奉於諸佛，則能興集大供養；\n> 039｜若能興集大供養，彼人信佛不思議。\n> 040｜若常信奉於尊法，則聞佛法無厭足；\n> 041｜若聞佛法無厭足，彼人信法不思議。\n> 042｜若常信奉清淨僧，則得信心不退轉；\n> 043｜若得信心不退轉，彼人信力無能動。\n> 044｜若得信力無能動，則得諸根淨明利；\n> 045｜若得諸根淨明利，則能遠離惡知識。\n> 046｜若能遠離惡知識，則得親近善知識；\n> 047｜若得親近善知識，則能修集廣大善。\n> 048｜若能修集廣大善，彼人成就大因力；\n> 049｜若人成就大因力，則得殊勝決定解。\n> 050｜若得殊勝決定解，則為諸佛所護念；\n\n**（己）所具诸位·三十九颂·十信相续功德链〔澄观「二若為諸佛下。三十九頌」实测 78 行全合·含不退·无生忍·授记·甘露灌顶 L124–127·§2.3〕**\n\n> 051｜若為諸佛所護念，則能發起菩提心。\n> 052｜若能發起菩提心，則能勤修佛功德；\n> 053｜若能勤修佛功德，則得生在如來家。\n> 054｜若得生在如來家，則善修行巧方便；\n> 055｜若善修行巧方便，則得信樂心清淨。\n> 056｜若得信樂心清淨，則得增上最勝心；\n> 057｜若得增上最勝心，則常修習波羅蜜。\n> 058｜若常修習波羅蜜，則能具足摩訶衍；\n> 059｜若能具足摩訶衍，則能如法供養佛。\n> 060｜若能如法供養佛，則能念佛心不動；\n> 061｜若能念佛心不動，則常覩見無量佛。\n> 062｜若常覩見無量佛，則見如來體常住；\n> 063｜若見如來體常住，則能知法永不滅。\n> 064｜若能知法永不滅，則得辯才無障礙；\n> 065｜若得辯才無障礙，則能開演無邊法。\n> 066｜若能開演無邊法，則能慈愍度眾生；\n> 067｜若能慈愍度眾生，則得堅固大悲心。\n> 068｜若得堅固大悲心，則能愛樂甚深法；\n> 069｜若能愛樂甚深法，則能捨離有為過。\n> 070｜若能捨離有為過，則離憍慢及放逸；\n> 071｜若離憍慢及放逸，則能兼利一切眾。\n> 072｜若能兼利一切眾，則處生死無疲厭；\n> 073｜若處生死無疲厭，則能勇健無能勝。\n> 074｜若能勇健無能勝，則能發起大神通；\n> 075｜若能發起大神通，則知一切眾生行。\n> 076｜若知一切眾生行，則能成就諸群生；\n> 077｜若能成就諸群生，則得善攝眾生智。\n> 078｜若得善攝眾生智，則能成就四攝法；\n> 079｜若能成就四攝法，則與眾生無限利。\n> 080｜若與眾生無限利，則具最勝智方便；\n> 081｜若具最勝智方便，則住勇猛無上道。\n> 082｜若住勇猛無上道，則能摧殄諸魔力；\n> 083｜若能摧殄諸魔力，則能超出四魔境。\n> 084｜若能超出四魔境，則得至於不退地；\n> 085｜若得至於不退地，則得無生深法忍。\n> 086｜若得無生深法忍，則為諸佛所授記；\n> 087｜若為諸佛所授記，則一切佛現其前。\n> 088｜若一切佛現其前，則了神通深密用；\n> 089｜若了神通深密用，則為諸佛所憶念。\n> 090｜若為諸佛所憶念，則以佛德自莊嚴；\n> 091｜若以佛德自莊嚴，則獲妙福端嚴身。\n> 092｜若獲妙福端嚴身，則身晃耀如金山；\n> 093｜若身晃耀如金山，則相莊嚴三十二。\n> 094｜若相莊嚴三十二，則具隨好為嚴飾；\n> 095｜若具隨好為嚴飾，則身光明無限量。\n> 096｜若身光明無限量，則不思議光莊嚴；\n> 097｜若不思議光莊嚴，其光則出諸蓮華。\n> 098｜其光若出諸蓮華，則無量佛坐華上；\n> 099｜示現十方靡不遍，悉能調伏諸眾生。\n> 100｜若能如是調眾生，則現無量神通力。\n> 101｜若現無量神通力，則住不可思議土，\n> 102｜演說不可思議法，令不思議眾歡喜。\n> 103｜若說不可思議法，令不思議眾歡喜，\n> 104｜則以智慧辯才力，隨眾生心而化誘。\n> 105｜若以智慧辯才力，隨眾生心而化誘，\n> 106｜則以智慧為先導，身語意業恒無失。\n> 107｜若以智慧為先導，身語意業恒無失，\n> 108｜則其願力得自在，普隨諸趣而現身。\n> 109｜若其願力得自在，普隨諸趣而現身，\n> 110｜則能為眾說法時，音聲隨類難思議。\n> 111｜若能為眾說法時，音聲隨類難思議，\n> 112｜則於一切眾生心，一念悉知無有餘。\n> 113｜若於一切眾生心，一念悉知無有餘，\n> 114｜則知煩惱無所起，永不沒溺於生死。\n> 115｜若知煩惱無所起，永不沒溺於生死，\n> 116｜則獲功德法性身，以法威力現世間。\n> 117｜若獲功德法性身，以法威力現世間，\n> 118｜則獲十地十自在，修行諸度勝解脫。\n> 119｜若獲十地十自在，修行諸度勝解脫，\n> 120｜則獲灌頂大神通，住於最勝諸三昧。\n> 121｜若獲灌頂大神通，住於最勝諸三昧，\n> 122｜則於十方諸佛所，應受灌頂而昇位。\n> 123｜若於十方諸佛所，應受灌頂而昇位，\n> 124｜則蒙十方一切佛，手以甘露灌其頂。\n> 125｜若蒙十方一切佛，手以甘露灌其頂，\n> 126｜則身充遍如虛空，安住不動滿十方。\n> 127｜若身充遍如虛空，安住不動滿十方，\n> 128｜則彼所行無與等，諸天世人莫能知。\n\n**（庚）结叹其德·三颂〔澄观「第三菩薩勤修下。三頌結歎其德」实测 6 行全合·§2.3 尾〕**\n\n> 129｜菩薩勤修大悲行，願度一切無不果，\n> 130｜見聞聽受若供養，靡不皆令獲安樂。\n> 131｜彼諸大士威神力，法眼常全無缺減，\n> 132｜十善妙行等諸道，無上勝寶皆令現。\n> 133｜譬如大海金剛聚，以彼威力生眾寶，\n> 134｜無減無增亦無盡，菩薩功德聚亦然。\n\n**（辛）无方大用·前十门之七门（之一段·实测 145 行＝72.5 颂·含海印 L146／因陀罗网 L161／手出广供 L169／现诸法门 L205／四摄 L221／俯同世间说四谛 L255–279·§2.4）**\n\n> 135｜或有剎土無有佛，於彼示現成正覺，\n> 136｜或有國土不知法，於彼為說妙法藏。\n> 137｜無有分別無功用，於一念頃遍十方，\n> 138｜如月光影靡不周，無量方便化群生。\n> 139｜於彼十方世界中，念念示現成佛道，\n> 140｜轉正法輪入寂滅，乃至舍利廣分布。\n> 141｜或現聲聞獨覺道，或現成佛普莊嚴，\n> 142｜如是開闡三乘教，廣度眾生無量劫。\n> 143｜或現童男童女形，天龍及以阿脩羅，\n> 144｜乃至摩睺羅伽等，隨其所樂悉令見。\n> 145｜眾生形相各不同，行業音聲亦無量，\n> 146｜如是一切皆能現，海印三昧威神力。\n> 147｜嚴淨不可思議剎，供養一切諸如來，\n> 148｜放大光明無有邊，度脫眾生亦無限。\n> 149｜智慧自在不思議，說法言辭無有礙，\n> 150｜施戒忍進及禪定，智慧方便神通等。\n> 151｜如是一切皆自在，以佛華嚴三昧力，\n> 152｜一微塵中入三昧，成就一切微塵定，\n> 153｜而彼微塵亦不增，於一普現難思剎。\n> 154｜彼一塵內眾多剎，或有有佛或無佛，\n> 155｜或有雜染或清淨，或有廣大或狹小，\n> 156｜或復有成或有壞，或有正住或傍住，\n> 157｜或如曠野熱時焰，或如天上因陀網。\n> 158｜如一塵中所示現，一切微塵悉亦然。\n> 159｜此大名稱諸聖人，三昧解脫神通力，\n> 160｜若欲供養一切佛，入于三昧起神變，\n> 161｜能以一手遍三千，普供一切諸如來。\n> 162｜十方所有勝妙華，塗香末香無價寶，\n> 163｜如是皆從手中出，供養道樹諸最勝。\n> 164｜無價寶衣雜妙香，寶幢幡蓋皆嚴好，\n> 165｜真金為華寶為帳，莫不皆從掌中雨。\n> 166｜十方所有諸妙物，應可奉獻無上尊，\n> 167｜掌中悉雨無不備，菩提樹前持供佛。\n> 168｜十方一切諸妓樂，鐘鼓琴瑟非一類，\n> 169｜悉奏和雅妙音聲，靡不從於掌中出。\n> 170｜十方所有諸讚頌，稱歎如來實功德，\n> 171｜如是種種妙言辭，皆從掌內而開演。\n> 172｜菩薩右手放淨光，光中香水從空雨，\n> 173｜普灑十方諸佛土，供養一切照世燈。\n> 174｜又放光明妙莊嚴，出生無量寶蓮華，\n> 175｜其華色相皆殊妙，以此供養於諸佛。\n> 176｜又放光明華莊嚴，種種妙華集為帳，\n> 177｜普散十方諸國土，供養一切大德尊。\n> 178｜又放光明香莊嚴，種種妙香集為帳，\n> 179｜普散十方諸國土，供養一切大德尊。\n> 180｜又放光明末香嚴，種種末香聚為帳，\n> 181｜普散十方諸國土，供養一切大德尊。\n> 182｜又放光明衣莊嚴，種種名衣集為帳，\n> 183｜普散十方諸國土，供養一切大德尊。\n> 184｜又放光明寶莊嚴，種種妙寶集為帳，\n> 185｜普散十方諸國土，供養一切大德尊。\n> 186｜又放光明蓮莊嚴，種種蓮華集為帳，\n> 187｜普散十方諸國土，供養一切大德尊。\n> 188｜又放光明瓔莊嚴，種種妙瓔集為帳，\n> 189｜普散十方諸國土，供養一切大德尊。\n> 190｜又放光明幢莊嚴，其幢絢煥備眾色，\n> 191｜種種無量皆殊好，以此莊嚴諸佛土。\n> 192｜種種雜寶莊嚴蓋，眾妙繒幡共垂飾，\n> 193｜摩尼寶鐸演佛音，執持供養諸如來。\n> 194｜手出供具難思議，如是供養一導師，\n> 195｜一切佛所皆如是，大士三昧神通力。\n> 196｜菩薩住在三昧中，種種自在攝眾生，\n> 197｜悉以所行功德法，無量方便而開誘。\n> 198｜或以供養如來門，或以難思布施門，\n> 199｜或以頭陀持戒門，或以不動堪忍門。\n> 200｜或以苦行精進門，或以寂靜禪定門，\n> 201｜或以決了智慧門，或以所行方便門。\n> 202｜或以梵住神通門，或以四攝利益門，\n> 203｜或以福智莊嚴門，或以因緣解脫門。\n> 204｜或以根力正道門，或以聲聞解脫門，\n> 205｜或以獨覺清淨門，或以大乘自在門。\n> 206｜或以無常眾苦門，或以無我壽者門，\n> 207｜或以不淨離欲門，或以滅盡三昧門。\n> 208｜隨諸眾生病不同，悉以法藥而對治；\n> 209｜隨諸眾生心所樂，悉以方便而滿足；\n> 210｜隨諸眾生行差別，悉以善巧而成就。\n> 211｜如是三昧神通相，一切天人莫能測。\n> 212｜有妙三昧名隨樂，菩薩住此普觀察，\n> 213｜隨宜示現度眾生，悉使歡心從法化。\n> 214｜劫中饑饉災難時，悉與世間諸樂具，\n> 215｜隨其所欲皆令滿，普為眾生作饒益。\n> 216｜或以飲食上好味，寶衣嚴具眾妙物，\n> 217｜乃至王位皆能捨，令好施者悉從化。\n> 218｜或以相好莊嚴身，上妙衣服寶瓔珞，\n> 219｜華鬘為飾香塗體，威儀具足度眾生。\n> 220｜一切世間所好尚，色相顏容及衣服，\n> 221｜隨應普現愜其心，𢔌樂色者皆從道。\n> 222｜迦陵頻伽美妙音，俱枳羅等妙音聲，\n> 223｜種種梵音皆具足，隨其心樂為說法。\n> 224｜八萬四千諸法門，諸佛以此度眾生，\n> 225｜彼亦如其差別法，隨世所宜而化度。\n> 226｜眾生苦樂利衰等，一切世間所作法，\n> 227｜悉能應現同其事，以此普度諸眾生。\n> 228｜一切世間眾苦患，深廣無涯如大海，\n> 229｜與彼同事悉能忍，令其利益得安樂。\n> 230｜若有不識出離法，不求解脫離諠憒，\n> 231｜菩薩為現捨國財，常樂出家心寂靜。\n> 232｜家是貪愛繫縛所，欲使眾生悉免離，\n> 233｜故示出家得解脫，於諸欲樂無所受。\n> 234｜菩薩示行十種行，亦行一切大人法，\n> 235｜諸仙行等悉無餘，為欲利益眾生故。\n> 236｜若有眾生壽無量，煩惱微細樂具足，\n> 237｜菩薩於中得自在，示受老病死眾患。\n> 238｜或有貪欲瞋恚癡，煩惱猛火常熾然，\n> 239｜菩薩為現老病死，令彼眾生悉調伏。\n> 240｜如來十力無所畏，及以十八不共法，\n> 241｜所有無量諸功德，悉以示現度眾生。\n> 242｜記心教誡及神足，悉是如來自在用，\n> 243｜彼諸大士皆示現，能使眾生盡調伏。\n> 244｜菩薩種種方便門，隨順世法度眾生，\n> 245｜譬如蓮華不著水，如是在世令深信。\n> 246｜雅思淵才文中王，歌舞談說眾所欣，\n> 247｜一切世間眾技術，譬如幻師無不現。\n> 248｜或為長者邑中主，或為賈客商人導，\n> 249｜或為國王及大臣，或作良醫善眾論。\n> 250｜或於曠野作大樹，或為良藥眾寶藏，\n> 251｜或作寶珠隨所求，或以正道示眾生。\n> 252｜若見世界始成立，眾生未有資身具，\n> 253｜是時菩薩為工匠，為之示現種種業。\n> 254｜不作逼惱眾生物，但說利益世間事，\n> 255｜呪術藥草等眾論，如是所有皆能說。\n> 256｜一切仙人殊勝行，人天等類同信仰，\n> 257｜如是難行苦行法，菩薩隨應悉能作。\n> 258｜或作外道出家人，或在山林自勤苦，\n> 259｜或露形體無衣服，而於彼眾作師長。\n> 260｜或現邪命種種行，習行非法以為勝，\n> 261｜或現梵志諸威儀，於彼眾中為上首。\n> 262｜或受五熱隨日轉，或持牛狗及鹿戒，\n> 263｜或著壞衣奉事火，為化是等作導師。\n> 264｜或有示謁諸天廟，或復示入恒河水，\n> 265｜食根果等悉示行，於彼常思已勝法。\n> 266｜或現蹲踞或翹足，或臥草棘及灰上，\n> 267｜或復臥杵求出離，而於彼眾作師首。\n> 268｜如是等類諸外道，觀其意解與同事，\n> 269｜所示苦行世靡堪，令彼見已皆調伏。\n> 270｜眾生迷惑稟邪教，住於惡見受眾苦，\n> 271｜為其方便說妙法，悉令得解真實諦。\n> 272｜或邊呪語說四諦，或善密語說四諦，\n> 273｜或人直語說四諦，或天密語說四諦，\n> 274｜分別文字說四諦，決定義理說四諦，\n> 275｜善破於他說四諦，非外所動說四諦，\n> 276｜或八部語說四諦，或一切語說四諦，\n> 277｜隨彼所解語言音，為說四諦令解脫。\n> 278｜所有一切諸佛法，皆如是說無不盡，\n> 279｜知語境界不思議，是名說法三昧力。\n\n**（壬）跨卷题头·原位照录（非颂行·卷十四～十五界）**\n\n> 大方廣佛華嚴經卷第十四\n> 大方廣佛華嚴經卷第十五\n> 于闐國三藏實叉難陀奉制譯\n> 賢首品第十二之二\n\n**（癸）毛光照益三昧门·光明门叠咏（实测 L280–441·162 行＝81 颂；澄观「第八有勝三昧下。八十九頌半」范围含后段⚖·四十四门名号叠咏 L282 起·结略显广 L440–441·§2.5）**\n\n> 280｜「有勝三昧名安樂，能普救度諸群生，\n> 281｜放大光明不思議，令其見者悉調伏。\n> 282｜所放光明名善現，若有眾生遇此光，\n> 283｜必令獲益不唐捐，因是得成無上智。\n> 284｜彼光示現於諸佛，示法示僧示正道，\n> 285｜亦示佛塔及形像，是故得成此光明。\n> 286｜又放光明名照耀，映蔽一切諸天光，\n> 287｜所有闇障靡不除，普為眾生作饒益。\n> 288｜此光覺悟一切眾，令執燈明供養佛，\n> 289｜以燈供養諸佛故，得成世中無上燈。\n> 290｜然諸油燈及酥燈，亦然種種諸明炬，\n> 291｜眾香妙藥上寶燭，以是供佛獲此光。\n> 292｜又放光明名濟度，此光能覺一切眾，\n> 293｜令其普發大誓心，度脫欲海諸群生。\n> 294｜若能普發大誓心，度脫欲海諸群生，\n> 295｜則能越度四瀑流，示導無憂解脫城。\n> 296｜於諸行路大水處，造立橋梁及船筏，\n> 297｜毀呰有為讚寂靜，是故得成此光明。\n> 298｜又放光明名滅愛，此光能覺一切眾，\n> 299｜令其捨離於五欲，專思解脫妙法味。\n> 300｜若能捨離於五欲，專思解脫妙法味，\n> 301｜則能以佛甘露雨，普滅世間諸渴愛。\n> 302｜惠施池井及泉流，專求無上菩提道，\n> 303｜毀呰五欲讚禪定，是故得成此光明。\n> 304｜又放光明名歡喜，此光能覺一切眾，\n> 305｜令其愛慕佛菩提，發心願證無師道。\n> 306｜造立如來大悲像，眾相莊嚴坐華座，\n> 307｜恒歎最勝諸功德，是故得成此光明。\n> 308｜又放光明名愛樂，此光能覺一切眾，\n> 309｜令其心樂於諸佛，及以樂法樂眾僧。\n> 310｜若常心樂於諸佛，及以樂法樂眾僧，\n> 311｜則在如來眾會中，逮成無上深法忍。\n> 312｜開悟眾生無有量，普使念佛法僧寶，\n> 313｜及示發心功德行，是故得成此光明。\n> 314｜又放光明名福聚，此光能覺一切眾，\n> 315｜令行種種無量施，以此願求無上道。\n> 316｜設大施會無遮限，有來求者皆滿足，\n> 317｜不令其心有所乏，是故得成此光明。\n> 318｜又放光明名具智，此光能覺一切眾，\n> 319｜令於一法一念中，悉解無量諸法門。\n> 320｜為諸眾生分別法，及以決了真實義，\n> 321｜善說法義無虧減，是故得成此光明。\n> 322｜又放光明名慧燈，此光能覺一切眾，\n> 323｜令知眾生性空寂，一切諸法無所有。\n> 324｜演說諸法空無主，如幻如焰水中月，\n> 325｜乃至猶如夢影像，是故得成此光明。\n> 326｜又放光名法自在，此光能覺一切眾，\n> 327｜令得無盡陀羅尼，悉持一切諸佛法。\n> 328｜恭敬供養持法者，給侍守護諸賢聖，\n> 329｜以種種法施眾生，是故得成此光明。\n> 330｜又放光明名能捨，此光覺悟慳眾生，\n> 331｜令知財寶悉非常，恒樂惠施心無著。\n> 332｜慳心難調而能調，解財如夢如浮雲，\n> 333｜增長惠施清淨心，是故得成此光明。\n> 334｜又放光明名除熱，此光能覺毀禁者，\n> 335｜普使受持清淨戒，發心願證無師道。\n> 336｜勸引眾生受持戒，十善業道悉清淨，\n> 337｜又令發向菩提心，是故得成此光明。\n> 338｜又放光明名忍嚴，此光覺悟瞋恚者，\n> 339｜令彼除瞋離我慢，常樂忍辱柔和法。\n> 340｜眾生暴惡難可忍，為菩提故心不動，\n> 341｜常樂稱揚忍功德，是故得成此光明。\n> 342｜又放光明名勇猛，此光覺悟嬾墮者，\n> 343｜令彼常於三寶中，恭敬供養無疲厭。\n> 344｜若彼常於三寶中，恭敬供養無疲厭，\n> 345｜則能超出四魔境，速成無上佛菩提。\n> 346｜勸化眾生令進策，常勤供養於三寶，\n> 347｜法欲滅時專守護，是故得成此光明。\n> 348｜又放光明名寂靜，此光能覺亂意者，\n> 349｜令其遠離貪恚癡，心不動搖而正定。\n> 350｜捨離一切惡知識，無義談說雜染行，\n> 351｜讚歎禪定阿蘭若，是故得成此光明。\n> 352｜又放光明名慧嚴，此光覺悟愚迷者，\n> 353｜令其證諦解緣起，諸根智慧悉通達。\n> 354｜若能證諦解緣起，諸根智慧悉通達，\n> 355｜則得日燈三昧法，智慧光明成佛果。\n> 356｜國財及己皆能捨，為菩提故求正法，\n> 357｜聞已專勤為眾說，是故得成此光明。\n> 358｜又放光明名佛慧，此光覺悟諸含識，\n> 359｜令見無量無邊佛，各各坐寶蓮華上。\n> 360｜讚佛威德及解脫，說佛自在無有量，\n> 361｜顯示佛力及神通，是故得成此光明。\n> 362｜又放光明名無畏，此光照觸恐怖者，\n> 363｜非人所持諸毒害，一切皆令疾除滅。\n> 364｜能於眾生施無畏，遇有惱害皆勸止，\n> 365｜拯濟厄難孤窮者，以是得成此光明。\n> 366｜又放光明名安隱，此光能照疾病者，\n> 367｜令除一切諸苦痛，悉得正定三昧樂。\n> 368｜施以良藥救眾患，妙寶延命香塗體，\n> 369｜酥油乳蜜充飲食，以是得成此光明。\n> 370｜又放光明名見佛，此光覺悟將沒者，\n> 371｜令隨憶念見如來，命終得生其淨國。\n> 372｜見有臨終勸念佛，又示尊像令瞻敬，\n> 373｜俾於佛所深歸仰，是故得成此光明。\n> 374｜又放光明名樂法，此光能覺一切眾，\n> 375｜令於正法常欣樂，聽聞演說及書寫。\n> 376｜法欲盡時能演說，令求法者意充滿，\n> 377｜於法愛樂勤修行，是故得成此光明。\n> 378｜又放光明名妙音，此光開悟諸菩薩，\n> 379｜能令三界所有聲，聞者皆是如來音。\n> 380｜以大音聲稱讚佛，及施鈴鐸諸音樂，\n> 381｜普使世間聞佛音，是故得成此光明。\n> 382｜又放光名施甘露，此光開悟一切眾，\n> 383｜令捨一切放逸行，具足修習諸功德。\n> 384｜說有為法非安隱，無量苦惱悉充遍，\n> 385｜恒樂稱揚寂滅樂，是故得成此光明。\n> 386｜又放光明名最勝，此光開悟一切眾，\n> 387｜令於佛所普聽聞，戒定智慧增上法。\n> 388｜常樂稱揚一切佛，勝戒勝定殊勝慧，\n> 389｜如是為求無上道，是故得成此光明。\n> 390｜又放光明名寶嚴，此光能覺一切眾，\n> 391｜令得寶藏無窮盡，以此供養諸如來。\n> 392｜以諸種種上妙寶，奉施於佛及佛塔，\n> 393｜亦以惠施諸貧乏，是故得成此光明。\n> 394｜又放光明名香嚴，此光能覺一切眾，\n> 395｜令其聞者悅可意，決定當成佛功德。\n> 396｜人天妙香以塗地，供養一切最勝主，\n> 397｜亦以造塔及佛像，是故得成此光明。\n> 398｜又放光名雜莊嚴，寶幢幡蓋無央數，\n> 399｜焚香散華奏眾樂，城邑內外皆充滿。\n> 400｜本以微妙妓樂音，眾香妙華幢蓋等，\n> 401｜種種莊嚴供養佛，是故得成此光明。\n> 402｜又放光明名嚴潔，令地平坦猶如掌，\n> 403｜莊嚴佛塔及其處，是故得成此光明。\n> 404｜又放光明名大雲，能起香雲雨香水，\n> 405｜以水灑塔及庭院，是故得成此光明。\n> 406｜又放光明名嚴具，令裸形者得上服，\n> 407｜嚴身妙物而為施，是故得成此光明。\n> 408｜又放光明名上味，能令飢者獲美食，\n> 409｜種種珍饌而為施，是故得成此光明。\n> 410｜又放光明名大財，令貧乏者獲寶藏，\n> 411｜以無盡物施三寶，是故得成此光明。\n> 412｜又放光名眼清淨，能令盲者見眾色，\n> 413｜以燈施佛及佛塔，是故得成此光明。\n> 414｜又放光名耳清淨，能令聾者悉善聽，\n> 415｜鼓樂娛佛及佛塔，是故得成此光明。\n> 416｜又放光名鼻清淨，昔未聞香皆得聞，\n> 417｜以香施佛及佛塔，是故得成此光明。\n> 418｜又放光名舌清淨，能以美音稱讚佛，\n> 419｜永除麁惡不善語，是故得成此光明。\n> 420｜又放光名身清淨，諸根缺者令具足，\n> 421｜以身禮佛及佛塔，是故得成此光明。\n> 422｜又放光名意清淨，令失心者得正念，\n> 423｜修行三昧悉自在，是故得成此光明。\n> 424｜又放光名色清淨，令見難思諸佛色，\n> 425｜以眾妙色莊嚴塔，是故得成此光明。\n> 426｜又放光名聲清淨，令知聲性本空寂，\n> 427｜觀聲緣起如谷響，是故得成此光明。\n> 428｜又放光名香清淨，令諸臭穢悉香潔，\n> 429｜香水洗塔菩提樹，是故得成此光明。\n> 430｜又放光名味清淨，能除一切味中毒，\n> 431｜恒供佛僧及父母，是故得成此光明。\n> 432｜又放光名觸清淨，能令惡觸皆柔軟，\n> 433｜戈鋋劍戟從空雨，皆令變作妙華鬘。\n> 434｜以昔曾於道路中，塗香散華布衣服，\n> 435｜迎送如來令蹈上，是故今獲光如是。\n> 436｜又放光名法清淨，能令一切諸毛孔，\n> 437｜悉演妙法不思議，眾生聽者咸欣悟。\n> 438｜因緣所生無有生，諸佛法身非是身，\n> 439｜法性常住如虛空，以說其義光如是。\n> 440｜如是等比光明門，如恒河沙無限數，\n> 441｜悉從大仙毛孔出，一一作業各差別。\n\n**（子）类显·主伴·寂用无涯三昧门（实测 99 行·「是名」总结 L539·十方不尽 L540·二百三颂无方大用尽此·§2.6 首部入出自在）**\n\n> 442｜如一毛孔所放光，無量無數如恒沙，\n> 443｜一切毛孔悉亦然，此是大仙三昧力。\n> 444｜如其本行所得光，隨彼宿緣同行者，\n> 445｜今放光明故如是，此是大仙智自在。\n> 446｜往昔同修於福業，及有愛樂能隨喜，\n> 447｜見其所作亦復然，彼於此光咸得見。\n> 448｜若有自修眾福業，供養諸佛無央數，\n> 449｜於佛功德常願求，是此光明所開覺。\n> 450｜譬如生盲不見日，非為無日出世間，\n> 451｜諸有目者悉明見，各隨所務修其業。\n> 452｜大士光明亦如是，有智慧者皆悉見，\n> 453｜凡夫邪信劣解人，於此光明莫能覩。\n> 454｜摩尼宮殿及輦乘，妙寶靈香以塗瑩，\n> 455｜有福德者自然備，非無德者所能處。\n> 456｜大士光明亦如是，有深智者咸照觸，\n> 457｜邪信劣解凡愚人，無有能見此光明。\n> 458｜若有聞此光差別，能生清淨深信解，\n> 459｜永斷一切諸疑網，速成無上功德幢。\n> 460｜有勝三昧能出現，眷屬莊嚴皆自在，\n> 461｜一切十方諸國土，佛子眾會無倫匹。\n> 462｜有妙蓮華光莊嚴，量等三千大千界，\n> 463｜其身端坐悉充滿，是此三昧神通力。\n> 464｜復有十剎微塵數，妙好蓮華所圍遶，\n> 465｜諸佛子眾於中坐，住此三昧威神力。\n> 466｜宿世成就善因緣，具足修行佛功德，\n> 467｜此等眾生遶菩薩，悉共合掌觀無厭。\n> 468｜譬如明月在星中，菩薩處眾亦復然，\n> 469｜大士所行法如是，入此三昧威神力。\n> 470｜如於一方所示現，諸佛子眾共圍遶，\n> 471｜一切方中悉如是，住此三昧威神力。\n> 472｜有勝三昧名方網，菩薩住此廣開示，\n> 473｜一切方中普現身，或現入定或從出。\n> 474｜或於東方入正定，而於西方從定出；\n> 475｜或於西方入正定，而於東方從定出；\n> 476｜或於餘方入正定，而於餘方從定出。\n> 477｜如是入出遍十方，是名菩薩三昧力。\n> 478｜盡於東方諸國土，所有如來無數量，\n> 479｜悉現其前普親近，住於三昧寂不動。\n> 480｜而於西方諸世界，一切諸佛如來所，\n> 481｜皆現從於三昧起，廣修無量諸供養。\n> 482｜盡於西方諸國土，所有如來無數量，\n> 483｜悉現其前普親近，住於三昧寂不動。\n> 484｜而於東方諸世界，一切諸佛如來所，\n> 485｜皆現從於三昧起，廣修無量諸供養。\n> 486｜如是十方諸世界，菩薩悉入無有餘，\n> 487｜或現三昧寂不動，或現恭敬供養佛。\n> 488｜於眼根中入正定，於色塵中從定出，\n> 489｜示現色性不思議，一切天人莫能知。\n> 490｜於色塵中入正定，於眼起定心不亂，\n> 491｜說眼無生無有起，性空寂滅無所作。\n> 492｜於耳根中入正定，於聲塵中從定出，\n> 493｜分別一切語言音，諸天世人莫能知。\n> 494｜於聲塵中入正定，於耳起定心不亂，\n> 495｜說耳無生無有起，性空寂滅無所作。\n> 496｜於鼻根中入正定，於香塵中從定出，\n> 497｜普得一切上妙香，諸天世人莫能知。\n> 498｜於香塵中入正定，於鼻起定心不亂，\n> 499｜說鼻無生無有起，性空寂滅無所作。\n> 500｜於舌根中入正定，於味塵中從定出，\n> 501｜普得一切諸上味，諸天世人莫能知。\n> 502｜於味塵中入正定，於舌起定心不亂，\n> 503｜說舌無生無有起，性空寂滅無所作。\n> 504｜於身根中入正定，於觸塵中從定出，\n> 505｜善能分別一切觸，諸天世人莫能知。\n> 506｜於觸塵中入正定，於身起定心不亂，\n> 507｜說身無生無有起，性空寂滅無所作。\n> 508｜於意根中入正定，於法塵中從定出，\n> 509｜分別一切諸法相，諸天世人莫能知。\n> 510｜於法塵中入正定，從意起定心不亂，\n> 511｜說意無生無有起，性空寂滅無所作。\n> 512｜童子身中入正定，壯年身中從定出，\n> 513｜壯年身中入正定，老年身中從定出；\n> 514｜老年身中入正定，善女身中從定出；\n> 515｜善女身中入正定，善男身中從定出；\n> 516｜善男身中入正定，比丘尼身從定出；\n> 517｜比丘尼身入正定，比丘身中從定出；\n> 518｜比丘身中入正定，學無學身從定出；\n> 519｜學無學身入正定，辟支佛身從定出；\n> 520｜辟支佛身入正定，現如來身從定出；\n> 521｜於如來身入正定，諸天身中從定出；\n> 522｜諸天身中入正定，大龍身中從定出；\n> 523｜大龍身中入正定，夜叉身中從定出；\n> 524｜夜叉身中入正定，鬼神身中從定出；\n> 525｜鬼神身中入正定，一毛孔中從定出；\n> 526｜一毛孔中入正定，一切毛孔從定出；\n> 527｜一切毛孔入正定，一毛端頭從定出；\n> 528｜一毛端頭入正定，一微塵中從定出；\n> 529｜一微塵中入正定，一切塵中從定出；\n> 530｜一切塵中入正定，金剛地中從定出；\n> 531｜金剛地中入正定，摩尼樹上從定出；\n> 532｜摩尼樹上入正定，佛光明中從定出；\n> 533｜佛光明中入正定，於河海中從定出；\n> 534｜於河海中入正定，於火大中從定出；\n> 535｜於火大中入正定，於風起定心不亂；\n> 536｜於風大中入正定，於地大中從定出；\n> 537｜於地大中入正定，於天宮殿從定出；\n> 538｜於天宮殿入正定，於空起定心不亂。\n> 539｜是名無量功德者，三昧自在難思議，\n> 540｜十方一切諸如來，於無量劫說不盡。\n\n**（丑）喻况玄旨·七十九颂·二十种大喻〔澄观「第五一切如來下」实测 158 行全合·声闻 L545·生盲在前段·天鼓 L598·龙王 L648·忘诠结说 L697–698·§2.6〕**\n\n> 541｜一切如來咸共說，眾生業報難思議，\n> 542｜諸龍變化佛自在，菩薩神力亦難思。\n> 543｜欲以譬諭而顯示，終無有諭能諭此，\n> 544｜然諸智慧聰達人，因於譬故解其義。\n> 545｜聲聞心住八解脫，所有變現皆自在，\n> 546｜能以一身現多身，復以多身為一身。\n> 547｜於虛空中入火定，行住坐臥悉在空，\n> 548｜身上出水身下火，身上出火身下水。\n> 549｜如是皆於一念中，種種自在無邊量。\n> 550｜彼不具足大慈悲，不為眾生求佛道，\n> 551｜尚能現此難思事，況大饒益自在力。\n> 552｜譬如日月遊虛空，影像普遍於十方，\n> 553｜泉池陂澤器中水，眾寶河海靡不現。\n> 554｜菩薩色像亦復然，十方普現不思議，\n> 555｜此皆三昧自在法，唯有如來能證了。\n> 556｜如淨水中四兵像，各各別異無交雜，\n> 557｜劍戟弧矢類甚多，鎧冑車輿非一種。\n> 558｜隨其所有相差別，莫不皆於水中現，\n> 559｜而水本自無分別，菩薩三昧亦如是。\n> 560｜海中有神名善音，其音普順海眾生，\n> 561｜所有語言皆辯了，令彼一切悉歡悅。\n> 562｜彼神具有貪恚癡，猶能善解一切音，\n> 563｜況復總持自在力，而不能令眾歡喜！\n> 564｜有一婦人名辯才，父母求天而得生，\n> 565｜若有離惡樂真實，入彼身中生妙辯。\n> 566｜彼有貪欲瞋恚癡，猶能隨行與辯才，\n> 567｜何況菩薩具智慧，而不能與眾生益！\n> 568｜譬如幻師知幻法，能現種種無量事，\n> 569｜須臾示作日月歲，城邑豐饒大安樂。\n> 570｜幻師具有貪恚癡，猶能幻力悅世間，\n> 571｜況復禪定解脫力，而不能令眾歡喜！\n> 572｜天阿脩羅鬪戰時，脩羅敗衄而退走，\n> 573｜兵仗車輿及徒旅，一時竄匿莫得見。\n> 574｜彼有貪欲瞋恚癡，尚能變化不思議，\n> 575｜況住神通無畏法，云何不能現自在！\n> 576｜釋提桓因有象王，彼知天主欲行時，\n> 577｜自化作頭三十三，一一六牙皆具足；\n> 578｜一一牙上七池水，清淨香潔湛然滿；\n> 579｜一一清淨池水中，各七蓮華妙嚴飾；\n> 580｜彼諸嚴飾蓮華上，各各有七天玉女，\n> 581｜悉善技藝奏眾樂，而與帝釋相娛樂。\n> 582｜彼象或復捨本形，自化其身同諸天，\n> 583｜威儀進止悉齊等，有此變現神通力。\n> 584｜彼有貪欲瞋恚癡，尚能現此諸神通，\n> 585｜何況具足方便智，而於諸定不自在！\n> 586｜如阿脩羅變作身，蹈金剛際海中立，\n> 587｜海水至深僅其半，首共須彌正齊等。\n> 588｜彼有貪欲瞋恚癡，尚能現此大神通，\n> 589｜況伏魔怨照世燈，而無自在威神力！\n> 590｜天阿脩羅共戰時，帝釋神力難思議，\n> 591｜隨阿脩羅軍眾數，現身等彼而與敵。\n> 592｜諸阿脩羅發是念：『釋提桓因來向我，\n> 593｜必取我身五種縛。』由是彼眾悉憂悴。\n> 594｜帝釋現身有千眼，手持金剛出火焰，\n> 595｜被甲持杖極威嚴，脩羅望見咸退伏。\n> 596｜彼以微小福德力，猶能摧破大怨敵，\n> 597｜何況救度一切者，具足功德不自在！\n> 598｜忉利天中有天鼓，從天業報而生得，\n> 599｜知諸天眾放逸時，空中自然出此音。\n> 600｜一切五欲悉無常，如水聚沫性虛偽，\n> 601｜諸有如夢如陽焰，亦如浮雲水中月。\n> 602｜放逸為怨為苦惱，非甘露道生死徑，\n> 603｜若有作諸放逸行，入於死滅大魚口。\n> 604｜世間所有眾苦本，一切聖人皆厭患，\n> 605｜五欲功德滅壞性，汝應愛樂真實法。\n> 606｜三十三天聞此音，悉共來昇善法堂，\n> 607｜帝釋為說微妙法，咸令順寂除貪愛。\n> 608｜彼音無形不可見，猶能利益諸天眾，\n> 609｜況隨心樂現色身，而不濟度諸群生！\n> 610｜天阿脩羅共鬪時，諸天福德殊勝力，\n> 611｜天鼓出音告其眾：『汝等宜應勿憂怖！』\n> 612｜諸天聞此所告音，悉除憂畏增益力。\n> 613｜時阿脩羅心震懼，所將兵眾咸退走。\n> 614｜甘露妙定如天鼓，恒出降魔寂靜音，\n> 615｜大悲哀愍救一切，普使眾生滅煩惱。\n> 616｜帝釋普應諸天女，九十有二那由他，\n> 617｜令彼各各心自謂：『天王獨與我娛樂。』\n> 618｜如天女中身普應，善法堂內亦如是，\n> 619｜能於一念現神通，悉至其前為說法。\n> 620｜帝釋具有貪恚癡，能令眷屬悉歡喜，\n> 621｜況大方便神通力，而不能令一切悅！\n> 622｜他化自在六天王，於欲界中得自在，\n> 623｜以業惑苦為罥網，繫縛一切諸凡夫。\n> 624｜彼有貪欲瞋恚癡，猶於眾生得自在，\n> 625｜況具十種自在力，而不能令眾同行！\n> 626｜三千世界大梵王，一切梵天所住處，\n> 627｜悉能現身於彼坐，演暢微妙梵音聲。\n> 628｜彼住世間梵道中，禪定神通尚如意，\n> 629｜況出世間無有上，於禪解脫不自在！\n> 630｜摩醯首羅智自在，大海龍王降雨時，\n> 631｜悉能分別數其滴，於一念中皆辨了。\n> 632｜無量億劫勤修學，得是無上菩提智，\n> 633｜云何不於一念中，普知一切眾生心！\n> 634｜眾生業報不思議，以大風力起世間，\n> 635｜巨海諸山天宮殿，眾寶光明萬物種。\n> 636｜亦能興雲降大雨，亦能散滅諸雲氣，\n> 637｜亦能成熟一切穀，亦能安樂諸群生。\n> 638｜風不能學波羅蜜，亦不學佛諸功德，\n> 639｜猶成不可思議事，何況具足諸願者！\n> 640｜男子女人種種聲，一切鳥獸諸音聲，\n> 641｜大海川流雷震聲，皆能稱悅眾生意。\n> 642｜況復知聲性如響，逮得無礙妙辯才，\n> 643｜普應眾生而說法，而不能令世間喜！\n> 644｜海有希奇殊特法，能為一切平等印，\n> 645｜眾生寶物及川流，普悉包容無所拒。\n> 646｜無盡禪定解脫者，為平等印亦如是，\n> 647｜福德智慧諸妙行，一切普修無厭足。\n> 648｜大海龍王遊戲時，普於諸處得自在，\n> 649｜興雲充遍四天下，其雲種種莊嚴色：\n> 650｜第六他化自在天，於彼雲色如真金，\n> 651｜化樂天上赤珠色；兜率陀天霜雪色；\n> 652｜夜摩天上瑠璃色；三十三天碼碯色；\n> 653｜四王天上玻瓈色；大海水上金剛色；\n> 654｜緊那羅中妙香色；諸龍住處蓮華色；\n> 655｜夜叉住處白鵝色；阿脩羅中山石色；\n> 656｜欝單越處金焰色；閻浮提中青寶色；\n> 657｜餘二天下雜莊嚴，隨眾所樂而應之。\n> 658｜又復他化自在天，雲中電耀如日光；\n> 659｜化樂天上如月光；兜率天上閻浮金；\n> 660｜夜摩天上珂雪色；三十三天金焰色；\n> 661｜四王天上眾寶色；大海之中赤珠色；\n> 662｜緊那羅界瑠璃色；龍王住處寶藏色；\n> 663｜夜叉所住玻瓈色；阿脩羅中碼碯色；\n> 664｜欝單越境火珠色；閻浮提中帝青色；\n> 665｜餘二天下雜莊嚴，如雲色相電亦然。\n> 666｜他化雷震如梵音；化樂天中大鼓音；\n> 667｜兜率天上歌唱音；夜摩天上天女音；\n> 668｜於彼三十三天上，如緊那羅種種音；\n> 669｜護世四王諸天所，如乾闥婆所出音；\n> 670｜海中兩山相擊聲；緊那羅中簫笛聲；\n> 671｜諸龍城中頻伽聲；夜叉住處龍女聲；\n> 672｜阿脩羅中天鼓聲；於人道中海潮聲。\n> 673｜他化自在雨妙香，種種雜華為莊嚴；\n> 674｜化樂天雨多羅華，曼陀羅華及澤香；\n> 675｜兜率天上雨摩尼，具足種種寶莊嚴，\n> 676｜髻中寶珠如月光，上妙衣服真金色；\n> 677｜夜摩中雨幢幡蓋，華鬘塗香妙嚴具，\n> 678｜赤真珠色上好衣，及以種種眾妓樂；\n> 679｜三十三天如意珠，堅黑沈水栴檀香，\n> 680｜欝金雞羅多摩等，妙華香水相雜雨；\n> 681｜護世城中雨美膳，色香味具增長力，\n> 682｜亦雨難思眾妙寶，悉是龍王之所作。\n> 683｜又復於彼大海中，注雨不斷如車軸，\n> 684｜復雨無盡大寶藏，亦雨種種莊嚴寶。\n> 685｜緊那羅界雨瓔珞，眾色蓮華衣及寶，\n> 686｜婆利師迦末利香，種種樂音皆具足；\n> 687｜諸龍城中雨赤珠；夜叉城內光摩尼；\n> 688｜阿脩羅中雨兵仗，摧伏一切諸怨敵；\n> 689｜欝單越中雨瓔珞，亦雨無量上妙華；\n> 690｜弗婆瞿耶二天下，悉雨種種莊嚴具；\n> 691｜閻浮提雨清淨水，微細悅澤常應時，\n> 692｜長養眾華及果藥，成熟一切諸苗稼。\n> 693｜如是無量妙莊嚴，種種雲電及雷雨，\n> 694｜龍王自在悉能作，而身不動無分別。\n> 695｜彼於世界海中住，尚能現此難思力，\n> 696｜況入法海具功德，而不能為大神變！\n> 697｜彼諸菩薩解脫門，一切譬諭無能顯，\n> 698｜我今以此諸譬諭，略說於其自在力。\n\n**（寅）校量劝持·九颂〔澄观「大文第三第一智慧下。九頌校量勸持分」实测 18 行全合·§2.6〕**\n\n> 699｜第一智慧廣大慧，真實智慧無邊慧，\n> 700｜勝慧及以殊勝慧，如是法門今已說。\n> 701｜此法希有甚奇特，若人聞已能忍可，\n> 702｜能信能受能讚說，如是所作甚為難。\n> 703｜世間一切諸凡夫，信是法者甚難得，\n> 704｜若有勤修清淨福，以昔因力乃能信。\n> 705｜一切世界諸群生，少有欲求聲聞乘，\n> 706｜求獨覺者轉復少，趣大乘者甚難遇。\n> 707｜趣大乘者猶為易，能信此法倍更難，\n> 708｜況復持誦為人說，如法修行真實解！\n> 709｜有以三千大千界，頂戴一劫身不動，\n> 710｜彼之所作未為難，信是法者乃為難。\n> 711｜有以手擎十佛剎，盡於一劫空中住，\n> 712｜彼之所作未為難，能信此法乃為難。\n> 713｜十剎塵數眾生所，悉施樂具經一劫，\n> 714｜彼之福德未為勝，信此法者為最勝。\n> 715｜十剎塵數如來所，悉皆承事盡一劫，\n> 716｜若於此品能誦持，其福最勝過於彼。」\n\n**（卯）经家结叹·十方现证（散文·§2.6）**\n\n> 時，賢首菩薩說此偈已，十方世界六返震動，魔宮隱蔽，惡道休息。十方諸佛普現其前，各以右手而摩其頂，同聲讚言：「善哉！善哉！快說此法！我等一切悉皆隨喜。」\n\n**（附）品界尾·跨卷题头原位照录（非颂行·卷十五～十六界·_p12_cov_run 口径内 34 字）**\n\n> 大方廣佛華嚴經卷第十五\n> 大方廣佛華嚴經卷第十六\n> 于闐國三藏實叉難陀奉制譯\n\n（`T10n0279` 卷十四末～十五·逐字（`_e12_full.py` 品内 div 结构化·`_e12_dump.txt`／`_e12_lines.txt`）·`_e12_probe2.py` 逐行回源 0 miss·L000–L716 全 717 行与散文／题头合起来即 body80 CJK 10,228 之全体〔L 行 10,037＋散文题头 191〕〕）\n\n---\n\n## 三　旁参与前接\n\n- **前接《净行品》（第十一品）**：净行明十信之「行」（智首问、文殊以一百四十一事愿答·显「善用其心」），贤首明十信之「德」（文殊偈问、贤首偈答·显「信为道元功德母」）。澄观判：「**收前行願成信德用。故次來也**」（`T1735`@195841·§1.1 来意）——行（净行）满则德（贤首）显，此二品之锁钥。承 L.184。\n- **承第二会《四圣谛品》（第四品）跨品呼应**：本品 §2.4「說四諦」段以九种语「為說四諦令解脫」，与第二会第四品《四圣谛品》（系列第八部·L.171）之转读四谛遥相呼应〔本文判断·非直接引文，只标关联〕。\n- **后接《升须弥山顶品》（第十三品）**：贤首品既明十信满心（灌顶·将入贤位），次品「昇須彌山頂」即入十住位（登上须弥顶·智俨「十信已滿位是賢聖之初」·§1.2）。止锚「昇須彌山頂品第十三」@137665 即次品题（§7.4）。\n- **跨典征引旁证**：\n  - 天台圓頓止觀（演钞 `T1736`@458042·承 L.184 所探）：「**天台智者依此一品立圓頓止觀……聞圓法起圓信立圓行住圓位**」——贤首品（十信·圆信）为天台化法之据〔本文判断·此为疏家转述他宗，非本经自义，只录备考〕。\n  - 海云讲记 ep08／ep10／ep12（「賢首」「十信」高频·实测 ep08 賢首×21 十信×23·ep10 賢首×13·ep12 賢首×11 十信×68·`_p12_cite.py`）——讲者以十信释贤首，与诸家合（§5.3′）。〔讲师玄谈·非正行〕\n\n---\n\n## 四　义理要点与名相\n\n1. **信为道元功德母·总摄十信**——本品之**宗眼**。全品以初发心功德无边际起，归于「信」之功德用：信能惠施、信能持戒、信能生長菩提樹、信能示現一切佛——**六度万行悉从信生**，故此颂为「一切諸善法」之母。「斷除疑網出愛流」二句，正对治十信位之根本病（疑、爱）。〔本文判断〕「信为道元功德母」后世为汉传华严、净土、天台共尊之信纲，其权威正建于八十（对照六十「增長一切諸善法／除滅一切諸疑惑／示現開發無上道」·§6.1 义差）。\n2. **行既成立·次叹德用·以成位**——智俨来意判「**行既成立。次須廣歎德用成位故來也**」（`T1732`@29947·§1.1）；澄观「**於信門中成普賢行德**」：净行之「行」至此凝为「德」，德满则**成贤位**（十信满心→邻十住）。本品十信相续链（§2.3）至「甘露灌頂」「不退地」，正是「成位」之文本标志。\n3. **菩提心功德·说少分·三喻**——初发心功德「無邊際，不可稱量無與等」，贤首三以喻叹己所说之少：「如海一滴水」「鳥足所履空」「大地一微塵」（§2.1）——以有限之辩显无边之德，是全品谦抑之致。〔本文判断〕此非谓功德可量，正谓其不可量。\n4. **光明门·随本行宿缘·恒沙差别**——之二十一光明门（善現／照耀／濟度／滅愛……·§2.5），每一光皆「如其本行所得光，隨彼宿緣同行者，今放光明故如是」（L474-475）——**光明之差别，源于本生愿行之差别**；「生盲不見日」二喻（§2.6）显此光明唯「有深智者咸照觸，邪信劣解凡愚人，無有能見」。〔本文判断〕光明门之「随本行得光」义，与净行品「以愿导行」一贯：愿行不同，故果德光明亦不同。\n5. **智自在·况喻显胜**——七重「彼有貪欲瞋恚癡，尚能現此……況……菩薩／大士……而無自在威神力」（§2.6），以声闻劣通、帝释天鼓、龙王兴云等**有漏尚能**之事，况显菩萨**无漏自在**之胜，然卒归「終無有諭能諭此……略說於其自在力」（喻不能尽·L576-577/736-737）——**遮诠（以况显胜）与忘诠（喻不足显）并用**。\n6. **名相辑要**：**賢首**（体性至顺调善曰贤·吉祥胜德超绝名首·§1.1）·**信為道元功德母**（宗眼）·**初發心**（菩提心之始）·**道元／功德母／疑網／愛流／法藏第一財／不壞種**（§2.2）·**不退地／無生法忍／甘露灌頂**（§2.3 成位）·**安樂三昧／海印三昧／善現等光明門**（§2.5）·**摩醯首羅／帝釋千眼／忉利天鼓**（§2.6 况喻）·**六返震動／摩頂隨喜**（十方现证）。\n\n---\n\n## 五　注疏选要·诸家会读\n\n> 本品祖典**五家齐备**：澄观、法藏、智俨、慧苑、李通玄皆有贤首专段（异于问明之慧苑缺记·L.183）。会读之眼在**偈颂数**与**科段**——澄观、慧苑据八十（三百余颂），智俨据六十（七百五十偈），法藏此典（探玄记·六十编次）本品**无独立科段、唯余处征引**。⚖ **数须对验**：本节所记诸家数，与两译底本实测（§7.4·关键词口径）互证，不强以今计裁古数。\n\n### 5.1 澄观《华严经疏》卷十六（`T1735`@195841–·「**賢首品第十二**」·五门分别）\n\n- **五门·来意**：「**初來意者。夫行不虛設必有其德。既解行圓妙必勝德難思。收前行願成信德用。故次來也。又前智首舉果徵因。文殊廣顯其因。略標其果。云獲一切勝妙功德。故問賢首令廣斯言。是以偈初躡前起後**」（@195841·§1.1）——承净行「行」成「信德用」，且点明「智首举果（获胜妙功德）→文殊广显其因→故问贤首广斯言」之问端缘起。\n- **释名**：「**二釋名者。謂體性至順調善曰賢。吉祥勝德超絕名首。即以此名菩薩演說此法。賢即是首。賢首之品。以當賢位之初攝諸德。故偏舉賢名**」（§1.1）。\n- **宗趣**：「**三宗趣者。於信門中成普賢行德。而自在莊嚴。無方大用建立眾生。通貫始終該攝諸位。以為其宗。令起圓融信行成位德用。而為意趣**」（§1.1）。\n- **释文·三分科**：「**四釋文者文有三分。初文殊發起。次賢首廣說。三十方現證。今初分二。初經家敘述。二正明發起。二段各有結前生後**」（§二纲·§2.1）——结前「順違皆順客塵不能濁其心。悲智雙游萬境不能亂其慮。是曰清淨行矣」释净行衔接。\n- **偈颂数·三颂分**：「**第二正顯偈詞。有三百五十九頌半。大為三分。初四頌謙讚許說分。次三百四十六偈半……**」（@195841 续·§1.3 数须对验）——**澄观据八十数「三百五十九頌半」**。\n- **结叹·心游大智（承净行段末·非本品新起）**：澄观于净行品已判「**舉足下足盡文殊心。見聞覺知皆普賢行**」（`T1735`@188478·L.184），贤首则总其「德用」。\n\n**〔L.190 本批·疏科长文全摘〕**（`T1735` 卷十六「賢首品第十二」本科段·raw @195841–210565·496 行·以下綱格六块照 raw 原字形·部首码位已归一（L.199）·**附录四全文照录**）\n\n*甲·释文三分＋经家叙·正明发起（「則與長行文有影略」·客塵不濁·悲智雙游）*：\n\n> 四釋文者文有三分。初文殊發起。次賢首廣說。三十方現證。今初分 二。初經家敘述。二正明發起。二段各有結前生後。今初。先結前已\n\n> 說。順違皆順客塵不能濁其心。悲智雙游萬境不能亂其慮。是曰清淨 行矣。大功德者。即前所成之果。後欲顯示下生後。文含始終。約終\n\n> 則顯示信滿菩提心殊勝功德。廣具五位因行盡故。約始但於生死誓證 菩提。萬德攸依故。今顯。示二偈。正發起中前半結前。偈文窄故略\n\n> 無所成之德。後半勸說。令說修行之德。則與長行文有影略。第二時 賢首下。賢首廣說。於中先總標舉。以偈答者此略有二。一少言攝多\n\n> 義故。二美詞讚說令淨信故。以始德該終散說難盡故。顯此勝妙之功\n\n*乙·正顯偈詞·三百五十九頌半·大為三分（初四頌謙讚許說／次三百四十六偈半正說勝德／三九偈校量勸持）*：\n\n> 德故。第二正顯偈詞。有三百五十九頌半。大為三分。初四頌謙讚許 說分。次三百四十六偈半。正說勝德分。三九偈校量勸持分。初中分\n\n> 二。初偈總明。前半讚問勸修。後半謙己少說。海喻次下當明。後三 開章以發心之德。況出修行巧顯深廣。於中初偈舉發心章。次偈況出\n\n> 修行章。初心祈於當證德已叵量。況長時入位遍修故。多佛不能盡 說。後偈許說分齊。前半法說。如是者雙指發心修行。下文具顯故前\n\n> 文雙問故。後半喻明。然有二意。一顯喻少分。謂發心行德如太空大 地。所說者陿如足履一塵。二密喻不異。謂鳥足之空不異太空。微細\n\n> 之塵不殊大地。故此略說義無不周。若廣若略皆無邊故。出現品云。 如鳥飛虛空經於百年。已經過處未經過處。皆不可量。何以故。虛空\n\n> 無邊際故等。彼就果行。此就因德。然普賢行德似同佛果。是故皆以 虛空為量。上下文中皆同此說。此初發心。與下文十住初發心住。及\n\n> 發心功德品。各何別耶。此中發心該於初後。取其成德乃是信終。取 其為本乃在初發。雖如輕毛功歸初簣故。十住初發。即是此終成彼初\n\n> 發。此終為能發彼是所發。此正是發起之發。義兼開發彼是開發之 發。義兼發起。其發心品。正顯十住初心之功德耳。以斯甄別非無有\n\n> 異。故瓔珞云。發心住者。是人始從具縛未識三寶。乃至值佛菩薩 教。法中起一念信。便發菩提心。既云始從凡夫最初發心。明知此中\n\n> 發心該於初後。問此既是初。何得乃具後諸行位及普賢德耶。古德釋 此略有二門。一行布次第門。謂從微至著從淺至深。次第相乘以階彼\n\n> 岸。如瓔珞仁王起信瑜伽等說。二圓融通攝門。謂一位即具一切位 等。如此經所說亦如大品等中。一行具一切行。此中有二門。一緣起\n\n> 相由門。二法界融攝門。前中普攬一切始終諸位。無邊行海同一緣 起。為普賢行德。良以諸緣相望略有二義。一約用。由相待故。有有\n\n> 力無力義。是故得相收及相入也。二約體。由相作故。有有體無體 義。是故得相即及相入是也。此經之中依斯義故。行位相收總有四\n\n> 說。一或始具終。如此門中。具一切行位。普賢德海者是也。二或終 具始。並在十地位。後如下文十定十通等說。三或諸位齊收並在十住\n\n> 等。一一位中各收一切。悉至究竟。如下文十住十行等說。四或諸位 皆泯行德顯然。如離世間品說。二法界融攝門者。謂此諸位及所修\n\n> 行。皆不離普賢無盡法界。然此法界圓融無限。隨在一位即具一切。 今在信門收無不盡。下諸位中皆具一切者。並準此釋。問下發心功德\n\n> 品。亦說初心具無邊德。與此何別。答此據行首信門所具。彼約行本 菩提心具。問約法相收是則可爾。約人修行。豈十千劫修信纔滿。即\n\n> 得如此無邊德海。答以法是圓融具德法故。若諸菩薩行此法行。是彼 所收。或無量劫或無定限。十千劫言非此所說。如下善財童子。及兜\n\n> 率天子等所行所得。並是其人不同。行布次第教中之所說也。又十千 劫。乃是一經。瓔珞但言一劫二劫。此經縱有行布亦皆圓融。亦有引\n\n> 此下文證成。此信乃是捨異生性。成就聖性出無明地。生如來家。以 有則獲灌頂而升位等。非是信故。若爾初地豈得灌頂升位等耶。若云\n\n> 展轉進入佛地。何以不得始自於信展轉入耶。若許從信展轉入者。何 以要判此乃捨凡入聖。下文自有十地之會。此中尚隔住行向等。判為\n\n> 入地。乃孟浪之談。下發心品。亦判為初地發心義。同此會。問下云 無量億劫勤修學。得是無上菩提智。斯則非一生也。亦非十千以為無\n\n> 量。通斯難者應有二義。一此約行布展轉義故。二約圓融展促無礙義 故。如上所辨故。善財見仙人。執手一一佛所。經無量劫故。修短難\n\n> 思特由於此故。賢首菩薩云。信大乘者猶為易。能信此法倍更難。以 初心即具一切功德。故難信也。第二菩薩發意下。正明發心修行勝\n\n*丙·文分為五（发心行相·信為道元·若常信奉·若為諸佛·或有剎土—结言尽此）*：\n\n> 德。文分為五。初五頌發心行相。二信為道元下略示勝能。三若常信 奉下。所具行位。四或有剎土下無方大用。五一切如來下。喻況玄\n\n> 旨。然此五段。初一顯正發心。後四發心之德。第三亦兼修行。此及 後二皆修行之德。今初發心行相中。初偈總標餘文別顯瑜伽菩薩地。\n\n> 明發心有五種相。一自性。二行相。三所緣。四功德。五最勝。今文 五偈具之。謂發意。即是正願為發心自性也。希求菩提及下作有情義\n\n> 利。即行相也。菩提三寶有情皆其所緣。能攝一切菩提分法。為其功 德。不求五欲等。反顯菩薩所求最勝。言因緣者。謂親能發起求大菩\n\n> 提曰因。假之助發為緣。因即自性住性內熏之力。緣即習所成性。又 上二皆因善友及境外熏為緣。瑜伽云。由有四因四緣四力。菩薩發\n\n> 心。四因者。一種性具足。二賴佛菩薩善友攝受。三多起悲心。四長 時猛利難行苦行。無所怯畏。四緣者。一見聞佛神變威力。二聞法微\n\n> 妙。三見法欲滅。四見生受惑業苦。四力者。一自力。二他力。三因 力。以宿習故。四加行力。謂於現法親善聞法修善加行故。若具上因\n\n> 緣及初三二力。當知不退。若因二四力心不堅固。今經即初及三也。 又起信論智印經。有七因緣如彼應知。下別顯中。以三因四緣攝上諸\n\n> 義。三因者。謂信悲智。四緣者。三寶眾生也。今文中。後半總以信 智因緣三寶境。信謂於實德能深忍樂欲心淨為性。故云淨信。然實謂\n\n> 一切事理。德謂三寶淨德。能謂世出世善有其力能。今法寶中已攝初 後。亦三寶中。皆具此三。體實具德。大用救生故。大者智心求大菩\n\n> 提。廣者悲心廣濟含識。翻彼二乘小陿心也。別中初半偈揀去偏偽。 謂攝眷屬過。所不能染故。文中不求五事求即過故。一若求人天五\n\n> 欲。此能長貪多是鬼因。二求王位長瞋多地獄因。三求富饒長癡是畜 生因。實通三塗各從多說。四求自樂是二乘因。五求大名稱若勝負\n\n> 心。是修羅因。若我慢心是外道因。又以理求樂是人天因。為王攝屬 是魔羅因。有二乘心目之為偏。有餘心者名之為偽。後三偈半直顯真\n\n> 正別釋因緣。於中初偈悲因。下救嚴土供佛。亦為調生故。滅苦是 悲。利樂是慈。次一偈半大智上供。上二不二為真正發心。後偈總結\n\n> 成信。兼信因行。其中對上四因四緣。可以意得。又上從不求五欲。 下即顯信心之德故。瓔珞經云。修十信心須具十德。今文並具但不次\n\n> 耳。一遭苦能忍。即前反顯。二正顯中。初二句即慈悲深厚。三次句 及莊嚴國土。即修習善根。謂利他善及淨土因故。四有三字即供養諸\n\n> 佛。五受持一句志求勝法。六證菩提故即求佛智慧。七一句即深心平 等。八次二句即親近善友。九次二句即心常柔和。謂至誠供養柔和善\n\n> 順於佛法故。十有二句即愛樂大乘。十德備矣。又此十德。即求菩提 之意。下經休舍云。欲教化調伏一切眾生。盡無餘故發菩提心等。又\n\n> 末後偈。初句即自性住佛性。以信心佛眾生無差別故。方是真法可謂 深信。次句即引出佛性。後句即至得果性。又文有四弘。可以意得。\n\n> 又上云深心信解常清淨者。與理相應方曰深心。若昔染今淨。淨則有 始始即必終。非常淨也。信煩惱即菩提方為常淨。由稱本性而發心\n\n> 故。本來是佛。更無所進如在虛空。退至何所。慨眾生之迷此。起同 體大悲悼昔不知誓期當證。有悲故不為無邊所寂。有智故不為有邊所\n\n> 動。不動不寂直入中道。是謂真正發菩提心。第二信為道元下。七頌 略示勝能。於中初一頌總標。次五頌別釋。後一頌總結今初。初句又\n\n> 標道有二義。一果所謂菩提涅槃。二因謂三賢十聖。乘一直道。元亦 二義。一本義。菩提本故。其猶滔滔之水始於濫觴。二首義。元者善\n\n> 之長也。即一因之初功德。二義通因及果。母有二義。生長養育。下 三句共釋初句。長養即母二義。亦道元義。一切善法及第二句。即因\n\n> 功德。第三一句即果功德。無上道者。即大菩提。由信長善得此菩 提。由信斷疑出愛成涅槃證。不信身心如來知見。豈能開示菩提涅\n\n> 槃。次信無垢濁下。別顯中有二十句。一句辨一勝能。一心淨為性 故。能翻不信濁。二信理普敬故翻憍慢。三十藏之內信即是藏。七聖\n\n> 財中信為第一。四信方受取奉行。五信財如夢故無所悋。六智論云。 佛法大海信為能入。七增福智因。八到二嚴果。九十五根五力各在初\n\n> 故。十一信本無惑方斷惑根。十二若向餘德不名淨信。十三信境本空 故無所著。十四正信之人不生八難。十五非不正信。十六正信解脫。\n\n> 十七成不壞本。十八為菩提根。十九增佛勝智。二十究竟見佛。謂信 自己心自佛出現。信外諸佛諸佛現前故。下經云。一切諸佛從信心\n\n> 起。三是故下一偈。總結勝能。前法後喻。信樂者信三寶性。已於方 便諸度。求欲修行。信樂二字是菩薩正意。由此二故。於諸行有能故\n\n> 名最勝。非佛不信故云難得。喻如意珠。略有五義。一勝義。法寶中 王故。二希義。非佛輪王餘無有故。三淨義。能清不信濁故。四貴\n\n> 義。出位行寶等不可盡故。五蘊義。蘊眾德物無障礙故。第三若常信 奉下五十頌半。廣明信中所具行位。然有二意。一行布。二圓融。古\n\n> 約圓融故名信中所具。於中三。初明所具行。次辨所具位。三結歎功 德。今初八。頌半分二。先五頌明信三寶以成諸行。後三頌半。明信\n\n> 展轉以成諸行。前中初三頌信佛成行。初二句標章。持戒惡止也。修 學處善行也。瑜伽云既發心已。應於七處修學故名學處謂一自利處。\n\n> 二利他處。三真實義處。四威力處。五成熟有情處。六成熟自佛法 處。七無上正等菩提處。次一偈半雙顯二德。若不持戒。尚不能得疥\n\n> 癩野干之身。況於菩提。戒止妄非則性淨。菩提開發。因果功德。皆 依學處而生。故云地也。後一偈別明成供養行。謂財法供養故云大\n\n> 也。次一信法。後一偈信僧。文並可知。二有三頌半。成展轉行。展 轉依前功歸於信。二若為諸佛下。三十九頌明所具諸位。於中成後四\n\n> 位。即為四段。初三頌明十住位。有六句。初句發心住。次句治地修 行二住。次句生貴住。次句方便具足住。次句正心住。後句增上是不\n\n> 退住。最勝心是後三住。準下釋之。二若得增上下。二頌半明十行 位。波羅蜜是十行總名。摩訶衍是異二乘行。初二行收如法供養。是\n\n> 順理行。次二行攝念佛心不動。及常見佛並是定慧行。故屬後六行。 釋相可知。三若常覩見下。三頌明十迴向位。通顯三種迴向。佛體常\n\n> 住是向菩提。法永不滅是向實際。餘向眾生。四若得堅固下。三十頌 半明十地位。初半頌是初地。謂深法是所證真如。愛樂是極喜異名。\n\n> 二半頌是離垢地。以離犯戒有為過故。三一頌離慢等。是三四二地。 以三地於禪不著故無慢又以求法不懈亦名離慢。第四地得出世間道\n\n> 品。故云無放逸。然不捨攝生故云兼利四有一頌。明五地。謂雖得出 世而還處生死故無厭。真俗互違難合能合。餘地不過故云勇健無能\n\n> 勝。此是難勝之名也五有一頌明第六地。悲智不住般若現前。謂神通 攝物是大悲行。知眾生行是十二緣生。是大智行。六二頌半明七地。\n\n> 謂初一明有中殊勝行。後一頌半明空中方便智。準釋可知。七若具最 勝下。三頌明第八地。略辨六義。一道勝。謂無功用道。故云勇猛無\n\n> 上。二力勝。謂智力摧魔。三用勝。謂超四魔境捨分段。故無蘊魔。 無捨命故無死魔。惑不現行故超煩惱魔。覺佛十力故超天魔。四位\n\n> 勝。不動地故云不退也。五行勝。謂得無生忍。六因勝。謂此位中當 大授記位也。八二頌明第九地作大法師。略辨四義。一諸佛加持名佛\n\n> 現前。二解了諸佛深密之法。三諸佛憶念增其慧力。四佛德自嚴為眾\n\n*丁·第十地位分五（九若以佛德下十九頌—三句喻前法眼常全）*：\n\n> 說法。九若以佛德下。十九頌。明第十地位分五。初八頌三業殊勝 德。初五頌半身業。於中前三頌明身體德殊勝。後二頌半明身業大\n\n> 用。次演說一頌半。語業勝說法益生。後二頌意業勝智先導故。二若 以智慧為先下。四頌明三業廣大功。三輪攝生德。初一頌身業。次一\n\n> 語業。後二意業。三若知煩惱下。二頌辨得法結位。四若得十地下。 三頌明三昧分大盡分受位分。並顯可知。五若蒙下。二頌明大用難\n\n> 測。亦是釋名分事也。謂以大法智雲含眾德水。能蔽如空麁重故。又 若蒙下二頌。亦是進入佛地。第三菩薩勤修下。三頌結歎其德。初二\n\n> 法說。後一喻況。前中賢首云。初二句悲願內滿。謂菩薩勤修等者。 結前若字下義。無不果者。結前則字下義。以若有彼則有此。非是前\n\n> 後鉤鎖相因。唯是本位信字。有此則有彼。同時具有而說有前後。是 故信門具足一切行位之相。然行雖無量。皆以悲願為首。故就此結\n\n> 之。次二句。明此悲願益物不空。次一頌。結前所具行位。初句舉人 標法。威神即信為能具之由。次句結能證智。眼證如如永常故。次二\n\n> 句結所證道。十善舉二地行。等取餘地及餘位餘道。謂教證等勝寶皆 現。後一頌喻況。唯喻後偈。初句及威力喻前初句。信體堅固以喻金\n\n> 剛。並居智海之內以信。威力能生。所生眾寶即喻前第三句行位。第\n\n*戊·無方大用二百三頌·十門三昧（海印—寂用無涯·門門頌数全出）*：\n\n> 三句喻前法眼常全。第四或有剎土下。二百三頌明無方大用。分彼能 無邊大用者。由普賢德遍一切時處法界無限故。略辨十門三昧業用。\n\n> 一圓明海印三昧門。二華嚴妙行三昧門。三因陀羅網三昧門。四手出 廣供三昧門。五現諸法門三昧門。六四攝攝生三昧門。七俯同世間三\n\n> 昧門。八毛光照益三昧門。九主伴嚴麗三昧門。十寂用無涯三昧門。 以無不定心故皆云三昧。作用不同略辨十種。又初門依體起用。末後> 明用不異體。中間並顯妙用自在。又十三昧皆具此三。今初六頌明海 印三昧。文分為二。前五別明業用周遍。後一總結大用所依。前中\n\n> 三。初三佛事。次一三乘。後一類餘。總顯十法界之化也。前中初一 總明現佛說法。次一體用自在。初句揀非二義。一念無分別。二動無\n\n> 功用。下三句顯正二義。謂無念之念。一念遍於十方。無功之功。多 門攝於群品。月喻四義準法可知。後一結用所依。海印之義。昔雖略\n\n> 解未盡其源。今以十義釋之。以表無盡之用。下經云。如淨水中。四 兵像。乃至莫不皆於水中現。又云。海有希奇殊特法。能為一切平等\n\n> 印眾生寶物及川流。普悉包容無所拒故。大集十四云。如閻浮提一切 眾生身。及餘外色。如是等色海中皆有印像。以是故名大海為印。菩\n\n> 薩亦爾。得大海印三昧。已能分別見一切眾生心行。於一切法門皆得 慧明。是為菩薩得海印三昧。見一切眾生心行所趣。然此經文多同出\n\n> 現。但出現現於四天下像。又約佛菩提。大集唯閻浮約菩薩所得。然 皆見心所趣等了根器也。此文所現形類應根器也。二文互舉皆是所\n\n> 現。菩薩定心以為能現。言十義者。一無心能現義。經云無有功用無 分別故。二現無所現義。經云如光影故。出現品云普現一切眾生心念\n\n> 根性欲樂。而無所現故。三能現與所現非一義。四非異義。經云大海 能現能所異故非一。水外求像不可得故非異。顯此定心與所現法。即\n\n> 性之相能所宛然。即相之性物我無二。五無去來義。水不上取物不下 就。而能顯現。三昧之心亦爾。現萬法於自心。彼亦不來。羅身雲於\n\n> 法界。未曾暫去。上之五義與鏡喻大同。六廣大義。經云遍十方故。 普悉包容無所拒故。明三昧心周于法界。則眾生色心皆定心中物。用\n\n> 周法界亦不離此心。七普現義。經云一切皆能現故。出現云菩提普印 諸心行故。此與廣大異者。此約所現不揀巨細。彼約能現其量普周。\n\n> 又此約所現無類不現。彼約能現無行不修。八頓現義。經云一念現 故。謂無前後如印頓成。九常現義。非如明鏡有現不現時。十非現現\n\n> 義。非如明鏡對至方現。經云現於四天下像故。四兵羅空對而可現。 四天之像不對而現。故云非現現也。以不待對。是故常現該三際也。\n\n> 具上十義故稱海印。諸佛窮究菩薩相似。問仁王三賢。都無八相之 文。初地方云。方生百三千一時成正覺。此之八相豈在信門。答即上\n\n> 所引大集亦云。灌頂住菩薩得佛神力。若菩薩成就如是等法。能於無 佛世界示現八相。乃至廣說。彼說住終。若占察經漸次作佛。略有四\n\n> 種。何等為四。一者信滿法故作佛。所謂依種性地。決定信諸法不生 不滅清淨平等。無可願求故。二解滿作佛。三證滿作佛。謂淨心地。\n\n> 四一切功德行滿作佛。依究竟菩薩地。起信依此說信成就發心。能八 相作佛。文據昭然。況圓融門中不依位次。寄終教說信滿即能。因果\n\n> 無礙。以因門取常是菩薩以果門取即恒是佛。或雙存俱泯自在難思。 又此化現非唯一位。依一類界而能具攝一切地位。遍於時處。故云念\n\n> 念遍十方也。第二嚴淨下。華嚴好行三昧。文有十句。略辨七行。前 六句各一行。七八是十度行。九結上自在。十總結所依。萬行如華嚴\n\n> 法身故。餘如別說。第三一微塵中下。四頌明因陀羅網三昧門。於中 初二句。標定心境。然有二意。一由一多相即故入一定能成多定。由\n\n> 成多定。令一塵內有一切塵。一一塵中現一切剎。二但令一塵現剎一 切亦爾。故云成就一切微塵定。次二句明不壞相而普現。故云不增。\n\n> 次二頌明一塵中所現剎相。無礙如焰重現如帝網。次半頌舉一例餘。 亦有二意。一例上一塵之內所具之塵。二例如一塵入定示現。餘塵入\n\n> 定示現亦然。後二句結用所因。略辨三門。一三昧力。此同標中。二 不思議解脫力。如不思議品云。於一塵中現三世佛剎等。三神通力。\n\n> 謂幻通自在並如下說。第四若欲下十八頌。明手出廣供三昧門。初一 總標。後一通結。中間別顯。欲顯勝妙略舉一手。為供所依。由於昔\n\n> 時以手持供供佛施人。稱周法界。故令真流供具等諸佛之難思。第五 菩薩住下。八頌明現諸法門三昧門分四。初一總標多門。二有五頌。\n\n> 別顯二十種門供等。即門通入佛果故。三一頌半結多所因。由四悉檀 故。初半對治。次半世界。隨行差別即當為人。而成就言。謂第一\n\n> 義。四半頌結用難測。第六有妙下。十七頌明四攝攝生三昧門文分為 二。初一偈總標名用。餘頌別顯。於中分四。初四頌布施攝。初一偈\n\n> 半。求受用者恣其所須。次半偈。求自在者施以王位。又此施位即難 行施。以是可愛著故。次偈身行法施。後偈妙色悅心。是無畏施。又\n\n> 後二偈。初身行法儀。後服世妙飾。貴悅物心隨求即與。次二頌愛語 攝。一切愛語。謂慰喻慶悅勝益之言。言種種梵音者。即八種梵音。\n\n> 一最好聲。其音清雅。如迦陵鳥。二易了聲。言辭辯了。三和調。四 柔軟。五不誤。六不女。七尊慧。八深遠。言俱枳羅者。亦云都吒\n\n> 迦。此云眾音合和。微妙最勝皆愛語之具。隨心說法應在後偈。隨世 所宜應在前偈。以瑜伽一切愛語略有二種。一隨世儀軌語。二順正法\n\n> 教語。今開示佛說八萬法門。即順正教也。三有二頌明同事攝。物見 菩薩俯同其事。知有義利而修行故。於中初頌一切同事。八風等事皆\n\n> 悉同故。後偈謂行同事。忍於諸苦而同事故。四有八頌。明利行攝。 謂說趣義利之行。以益有情。於中初二偈。一切利行。此有三種。一\n\n> 於現法利勸導利行。謂令以德業招守財位。以益近故。經文略無。二 於後法利行。謂勸捨財位清淨出家。即當初偈。三於現法後法利行。\n\n> 謂勸離欲即後偈也。又初一偈。即難行利行。此自有三。一不識出 離。即外道異執。二不求解脫。即未種善因。三現捨國財。誘耽財位\n\n> 於此利行。是謂難行。次一句即攝二利行。一即十種清淨利行也。二 令離十惡。即此世他世樂利行。次三句即善士利行。慈心勸導等故。\n\n> 次二偈即遂求利行。謂眾生為八纏所繞開解令離故名遂求。初偈即化 無愧纏。以恃壽長不知進修。不知此身但婬欲生。終竟敗壞。具諸煩\n\n> 惱故。後偈開解無慚纏眾生。餘略不具。次二偈即一切種利行。初偈 即應攝受者而攝受之。後偈即應調伏者而調伏等。後一偈即一切門利\n\n> 行。謂不信令信故。亦總結諸利行也。瑜伽廣說利行居先略明同事居 後。此則先略明同事者。以利行中若以行勸修。與愛語相近。若自示\n\n> 行即同事相近。同事即是利行。利行未必同事。此二相近廣略互彰 耳。又次下三昧。亦同事故。第七雅思下。十七頌俯同世間三昧門。\n\n> 於中三。初六身同世間利益眾生。若依若正無不示為。次六示同外道 救彼邪黨。初五別辨。後一總結。義如別說。三眾生迷惑下。五頌明\n\n> 語業大用。初一總明。次三別顯。後一總結。別中云或邊呪語者。梵 云達邏鼻茶曼達邏鉢底鞞。言達邏鼻荼者。是南印度中邊國名也。此\n\n> 云消融。曼達邏者呪也。鉢底鞞者句也。謂其國人稟性純質。凡所出 言皆成神呪。若隣國侵害不用兵仗。但以言破之。彼自喪滅故曰消融\n\n> 呪句也。或云。唯童男童女方得言成呪句。餘不得也。又天密語等 者。婆沙七十九說。世尊有時為四天王。以聖語說四諦。二王領解二\n\n> 不能解。世尊憐愍故。以南印度邊國俗語說四諦。二天王中一解一不 解。世尊憐愍故。復以一種篾戾車語。說四聖諦。時四天王皆得領\n\n> 解。善破於他者。以因明比量等。真能破故。非外所動者。真能立 故。不為他破。後一偈類結。非唯說四諦。六度萬行等皆然。一心說\n\n> 法得語實性。能起隨類之用。名三昧力 (已下第十五經)\n\n> 第八有勝三昧下。 八十九頌半。明毛光照益三昧門。智契解脫之門。慈熏身語意業。故\n\n> 得身同法界大用無涯。毛光觸物為益萬品。遍於時處緣者會之。是謂 菩薩圓建立眾生也。文分為五。初一頌標門總辨。二所放光明下別明\n\n> 一毛光明業用。三如一毛下。類顯一切毛光業用。四如其本行下。釋 成分齊。五若有聞下。聞信光益。今初。就所益說故名安樂。就第二\n\n> 段中二。初略辨四十四門光用。後如是等下結略顯廣。就四十四光中 皆有四義。一標光名。二辨光用。三出光因。四結光果。類例相從分\n\n> 為十段五對。初有二光顯示三寶。二有四光令發大心。上二即三寶四 弘對。三有二光總圓福智。四有二光入理持法。上即二嚴二持對。五\n\n> 有六光六度行圓。六有七光四等救攝。即六度四等對。七有一光總彰 三學。八有八光。雜彰萬行供養為先。為三學萬行對。九有六光。令\n\n> 六根內淨動與理會。十有六光。明六塵外淨觸境皆道。即根清境淨 對。今初。二光中。前一顯現。於中初句標名以近初標。但云所放不\n\n> 言又放。次三句辨用。後偈辨因中。示三寶令其正歸。示正道令其正 向。上通一體及別相三寶。亦示佛塔。令其正信義兼住持。後一光照\n\n> 耀用有七句。一偈辨因並顯可知。第二四光。令發大心中即四弘願 也。初一令眾生無邊誓願度。因中興有為而毀有為。二一光令煩惱無\n\n> 邊誓願斷。因中興有為而讚禪定。上二皆事理兼修。三上欣佛果。四 愛樂三寶窮盡法門。因中四弘之終故。總結云及示發心功德行。第三\n\n> 有二光總圓福智。智因中分別法相。決了真理無虧理事。不減佛法 故。得一念悉解多門。第四二光入理持法。初一慧入二空即義持也。\n\n> 後一具四總持於法自在。第五六度光中戒因中。云發大心者。謂若發 二乘心。則破淨戒。大心導善不在人天。勤策萬行慧為上首。各加一\n\n> 偈餘可思之。第六有七光。四等救攝中。初一慈光與佛慧真樂見無量 佛。此有二義。一見事佛。真樂因故。二見心佛。一一心華有覺性\n\n> 故。次三悲光拔苦。初一厄難苦。次一疾病苦。後一死苦。令見佛 者。一捨命不恐。二惡道不畏。又要臨終勸者。智論二十八云。臨終\n\n> 少時。能勝終身行力。以猛利故。如火如毒。依西域法。有欲捨命者 令面向西於前安一立像。亦面向西。以旛頭挂像手指。令病人手捉旛\n\n> 脚。口稱佛名。作隨佛往生淨土之意。兼與燒香鳴磬助稱佛名。若能 行此。非直亡者得生佛前。抑亦終成見佛光也。若神游大方去留無礙\n\n> 者。置之言外。不爾勉旃斯行。次二光令生法喜。初則欣法聽說。法 喜已充。終則觸境無非佛法。成喜之極。後一令成大捨。捨除放逸眾\n\n> 惑之根。第七一光總彰萬行。三學攝盡故曰普聞。第八八光雜明諸行 供養為先。前五供敬由。後三施悲田。第九六光內淨六根。第十六光\n\n> 外清六境。文並可知。戈者平頭戟也。鋋者小矛也。第二如是等比 下。結略顯廣。一毛之用光。有塵沙。第三如一毛下。類顯一切毛光\n\n> 業用。及結用所依。謂三昧力。第四如其下釋成分齊。如是等光。今 何不見。謂有緣者見如目覩光。無緣不覺盲瞽常闇。於中分二。初偈\n\n> 總明。如其本行牒前往因。所得光者。牒前果用。若有宿緣及曾同行 者。則隨其所見如是差別。後六偈別顯。於中初二法說。後四喻說。\n\n> 前中初偈宿緣。宿有四緣。一昔同業。二愛其行。三能隨喜。四但見 所作。後偈現因。不必有緣但功行內著。光明爰燭。有三種因。一修\n\n> 廣福。二供多佛。三求佛果。即福智二嚴也。上之七類皆蒙光照。二 喻說中。雙明見與不見二喻。皆有法合。初日出喻喻光為益因。合中\n\n> 謂法日常明。有智慧者心不住法。如人有目則能得見。有三類人則不 能見。一者凡愚。二邪信外道。三劣解二乘。皆無因緣如人無目。後\n\n> 寶嚴喻。喻光正益。明法寶常存。由福無福有處不處。第五若有下。 一頌明聞信光益。謂信仰解了不生疑惑。則成佛果。不以不見疑菩薩\n\n> 之無光。不以極苦莫救謂光明之無益。亦不高推果用謂菩薩不能。故 云永斷諸疑。第九有勝三昧下。六頌。主伴嚴麗三昧門。亦是出現三\n\n> 昧文分三別。初一標門顯意。次四明一方業用。於中前三法說。後一 喻合。既言量等三千。則不壞次第。劣於十地及等覺也。三一頌類顯\n\n> 十方。第十有勝三昧名方網下。三十四頌半。明寂用無涯三昧門。約 處名為方網。約相是謂寂用。亦總顯上來動寂無二故。文分為三。初\n\n> 一標名總辨。十方交絡出入縱橫。故名為網。二或於下。三十二頌半 正顯業用。三是名下一頌。總結難思。就業用中分三。初二頌。於十\n\n> 方處交絡出入。明於器世間自在。二有五頌。十方佛所入出無礙。明 於智正覺世間自在。三於眼根下。二十五頌半。通顯於三世間自在。\n\n> 菩薩於三世間自在。略有二義。一以自身作三世間。故得自在。二菩 薩於三世間處示現自在。今此三段。初二約後義。後一通二義。文或\n\n> 綺互理實皆具。初二世間略有四重無礙。一約處。謂東處即是西處。 是故菩薩常在東恒在西也。二約佛。謂東佛即西佛。是故在東佛恒在\n\n> 西佛。三約菩薩身不分。謂在東之身即是西身。四約定。謂入定即是 出定。所以爾者。略顯二因。一以所觀之法。事隨理融相即在故。二\n\n> 能觀之心。亦寂用無礙故。然此文中。為顯菩薩祕密隱顯自在德故。 但說後二。若辨前二。則似菩薩無力。三於眼下。通顯於三世間自\n\n> 在。文分為四。一明根境相對以辨自在。二童子下。明於他身自在。 三鬼神下。明微細自在。四一切塵下。器界事中以辨自在。今初。十\n\n> 二頌六對。一一對中。有十義五對無礙之相。欲辨無礙先須明識定 慧。此中云三昧起者觀也。入正受者定也。定慧雖多不出二種。一事\n\n> 二理。制之一處無事不辦。事定門也。能觀心性契理不動。理定門 也。明達法相事觀也。善了無生理觀也。諸經論中或單說事定。或但\n\n> 明理定。二觀亦然。或敵體事理止觀相對。或以事觀對於理定。如起 信論。止一切相乃至心不可得為止。而觀因緣生滅為觀。或以理觀對\n\n> 於事定。下經云。一心不動入諸禪。了境無生名般若是也。或俱通 二。如下云。禪定持心常一緣。智慧了境同三昧是也。或二俱泯非定\n\n> 非散。或即觀之定但名為定。如觀心性名上定是也。或即定之觀但名 為觀。如以無分別智觀名般若是也。或說雙運。謂即寂之照是也。所\n\n> 以局見之者隨矚一文。互相非撥。偏修之者隨入一門。皆有剋證。然 非圓暢。今此經文巧顯無礙。言五對者。第一對根境無礙。謂觀根入\n\n> 定應從根出。而從境出者。為顯根境唯是一心。緣起無二理性融通。 是故根入境出耳。境入根出亦然。第二對理事二定無礙。謂分別事相\n\n> 應入事定。而入理定。欲觀性空應入理定。而入事定。以契即事之理 而不動故。入理即是入事。制心即理之事而一緣故。入事即是入理。\n\n> 而經文但云入正定。不言理事。及乎出觀境中。即云分別色相斯事觀 也。根中即云性空寂者。理觀也。亦合將根事對於境理。以辨無礙。\n\n> 第三對事理二觀無礙。謂欲分別事相。應從事觀起而反從理觀起者。 以所觀之境既真俗雙融法界不二故。分別事智即是無生之智。二觀唯\n\n> 是一心故。亦應將境事理對根事理。以辨無礙。第四對出入無礙。以 起定即是入定故。起定而心不亂。若以事理相望。應成四句。謂事入\n\n> 事起事入理起等。若以根境相望。又成四句。謂根事入境事起等。一 一思之皆有所由。第五對二利體用無礙。謂於眼根起定心不亂是體\n\n> 也。自利也。而不礙現於廣境是用也。人天不能知利他也。良以體用 無二故。自利即是利他。此上十義。同為一聚法界緣起相即自在。菩\n\n> 薩善達作用無礙。思之思之。又經且約根境相對。亦應境境相對。謂 色塵入正受。聲香三昧起等。此如下童子身中入正定等中明。復應根\n\n> 根相對。謂眼根入正受。耳根三昧起等。一塵入正受多根三昧起等。 並略故不說。上來無礙深妙難思。始學之流如何趣入。今當總結。但\n\n> 能知事理無礙根境一如。念慮不生自當趣入。又向云色性難思等。即 色等總持。是色陀羅尼自在佛等。亦應云分別眼性難思。有眼陀羅尼\n\n> 自在佛等。又眼中云性空寂滅。即眼之度門。眼等本淨。亦應云色等 度門色等本淨。不唯取相為染無心為淨而已也。又以智論三觀束之。\n\n> 分別色相等。是假名觀也。性空寂滅是空觀也。此二不二色性難思。 中道觀也。三無前後皆是一心。對此三觀應辨三止。謂方便隨緣止。\n\n> 體真止。離二邊分別。止既止觀雙運。亦名一心三生也。即一而三即 三而一。雙照三一雙遮三一。是無礙也。一一釋文準思可見。此是菩\n\n> 薩圓融功德。而自莊嚴。觸目對境常所行用。希心玄趣。幸願留神。 二童子下六頌半。於他身得自在。此有三義。一如前眼根入等。但約\n\n> 見境為出入耳。二菩薩化現彼身。作此轉變速疾也。三菩薩以眾生身 作自身。如下十身相作等。是故於彼身入此身出。而彼不覺知。唯應\n\n> 度者知得度也。三鬼神下二頌半。微細自在。謂毛孔約正報。即佛及 眾生。毛頭約空處。微塵是色相多約器界。並身在中入定出定。為顯\n\n> 三昧純熟隱顯自在故。亦通觀彼入出定等。即於境無礙也。若唯約身 在彼下十定中。亦云無生法中入起。安有處耶。四一切塵下四頌半。\n\n> 器界事中周偏入出。然菩薩身普遍略有四位。一普遍一切十方剎海。 二遍彼剎內樹等物中。三遍一切塵毛等中。皆圓遍非分遍。是故皆全\n\n> 身顯現。四以是法界身故。不異不分恒在此常在彼。無有前後。第三 是名下一頌總結。初句以德命人。次句依人顯德。後半明說不盡。近\n\n> 結第十定用無盡。遠結前十定大用無盡。以是無盡之法門故。第五一 切下。喻況玄旨分。亦名舉劣顯勝分。以上所說普賢行德。窮于佛\n\n> 境。蓋是信滿之位。既越常規乖於視聽。滯情封教取信無由。故舉斯 近事以鏡玄趣。令開悟也。七十九頌分為三段。初二總標喻意。二七\n\n> 十六頌別顯喻相。三一頌結說顯德。今初先一偈半。明非喻能喻。後 半偈借喻通玄。今初舉四難思。意在菩薩神力。瑜伽決擇分有六種不\n\n> 可思議。謂一者我。二有情。三世間。四有情業果。五諸修靜慮者靜 慮境界。六諸佛世尊諸佛境界。今眾生含其前三。加龍變化所以有\n\n> 四。菩薩神力。即靜慮者境界。舊經梵本。皆云禪定力用故。然眾生 業報四因難思。謂處所差別故。事差別故。因差別故。異熟果差別\n\n> 故。諸龍變化不起心念。六天四洲雲雨不同等。故難思也。佛自在者 有五難思。謂真如甚深故。自在轉故。無漏界證得故。無障礙故。成\n\n> 立有情所作事故。菩薩神力由三種相。除佛後二。以今經文分同佛 五。以皆超言念故。無可同喻。後半中然取分喻。以小喻大。令聞喻\n\n> 者忘象領意故。褒以智者。二聲聞下別辨中。略顯二十種大喻。以況 菩薩之德。初有三頌半。明聲聞現通喻。況菩薩自在益生德。先明喻\n\n> 末偈舉劣顯勝。不為眾生無大悲也。不求菩提無大智也。大饒益者具 悲智也。二有二偈日月現影喻。況菩薩普應群機德。三有二頌水現四\n\n> 兵喻。喻菩薩海印現像德。四有二頌善音巧辨喻。喻菩薩總持巧說 德。五二頌女授辯才喻。喻授法益生德。六譬如幻師下。二頌幻師巧\n\n> 術喻。喻不思議解脫德。七二頌修羅隱形喻。喻勝通隱顯德。八五頌 象王隨變喻。喻定用自在德。九二頌修羅大身喻。喻法界身雲德。同\n\n> 於上文主伴嚴麗。十有四頌帝釋破怨喻。喻降伏眾魔德。十一忉利天 下六頌。天鼓說法喻。況菩薩以無功用現身說法德。十二有三頌。天\n\n> 鼓安慰喻。況菩薩慈音除惱德。十三有三頌。天王普應喻。喻普應悅 機德。十四有二頌。魔繫愚夫喻。喻攝生同行德。十五有二頌。梵王\n\n> 殊現喻。況菩薩解脫自在德。十六魔醯下二頌。自在數滴喻。況菩薩 一念普知德。十七三頌大風成事喻。喻大願宿成德。十八二頌眾聲悅\n\n> 意喻。喻四辯悅機德。十九二頌。大海包含喻。喻禪慧普修德。二十 大海龍下。二十四頌半。龍王遊戲喻。喻菩薩遊戲神變德。文分為\n\n> 二。初二十二頌半。明龍王大用不同。後二頌正明舉劣顯勝。前中初 半偈總標。餘頌別顯。於中四。初四偈半雲色不同。喻菩薩身雲各\n\n> 異。次有四頌電光差別。喻菩薩光明等殊。第三偈云寶藏色者。梵云 室利揭娑。此云勝藏。勝藏即寶名也。閻浮提中帝青色者。梵云天帝\n\n> 火焰摩尼色。亦珠寶名也。三有三頌半雷聲不等。喻菩薩三昧多種。 四有十頌所雨不一。喻菩薩說法多門。言曼陀羅者。此云悅意。澤香\n\n> 即塗香也。鷄羅多摩者。鷄羅此云華蘂。多摩此云天上華。謂此香是 天華蘂所作故也。婆利師迦者。此云雨時生華。末利香即華名。其色\n\n> 猶黃金。第二如是無量下。二頌正舉劣顯勝。謂娑竭羅龍。於六欲天 等總十五處。現斯作用。而身不動搖心無分別。但由業報之力現斯自\n\n> 在。菩薩亦爾。住無功用不動不思。於十方界應現多種。亦以菩薩功 德之力隨機見殊。此就喻意顯勝可知。第三彼諸下。一頌結說難思。\n\n> 前半非喻能喻。後半結上略說。引諸喻者略有二意。一顯菩薩自在不 同。二貴令眾生起信。且江南之人不信千人[疊*毛]帳。河北之者多疑\n\n> 萬斛之舟。皆耳目不暨故耳。所以或舉目擊或據具縛之人。自在若 斯。菩薩之用固當無惑。今猶疑者豈不傷哉。大文第三第一智慧下。\n\n> 九頌校量勸持分。此廣大用人皆有分。見而不習誠為自欺。故中人可 勸而進也。於中分二。初一頌結前所說。略就六慧結之。第一者上無\n\n> 加故。二廣大者。語其分量超二乘故。三真實者。明其體性內證無虛 故。四無邊者有二義。一量智普知故。二離種種二邊故。即中道慧\n\n> 也。五勝者。超地位故。六殊勝者同普賢故。二此法下八頌。明信受 難得。於中初一總顯餘七別明。前中希有者。佛出懸遠已難可遇。唯\n\n> 初成頓說故希有也。奇謂初能具後。特謂逈出諸乘。此句讚也。下文 勸耳。聞謂遇經。忍可謂信因。信則心淨。受謂領文領義。讚乃通言\n\n> 通筆。說唯約言。上皆所作總說皆難。後別明中三。初二偈半明難 信。次半偈況出餘行。後四偈舉事校量。前中初一偈明人天之器信為\n\n> 甚難。若爾今或能信何耶。由二力故。一現修淨福稱所求故。二昔因 聞熏今發種故。今不信者。願少聽聞為毒塗鼓。終成堅種。後一偈半\n\n> 舉三乘之信。展轉難得況於一乘。明文昭然權實有據。第二半偈。況 出餘行中信忍尚難。況具餘行。難中之難也。真實解者。亦有說行而\n\n> 不信圓融之旨。非真實解也。願諸學者善擇知見。第三四頌舉事校 量。初三校量難信。初二舉二難以況信難。後一舉福勝以彰信勝。後\n\n> 一校量餘行之難。唯明誦持餘略不說。亦顯修行。真解非可校量也。\n\n*己·喻況七十九頌·校量九頌·顯實證成分（四事·三業皆證—「信行第二會竟」上）*：\n\n> 此之四事。後後過於前前。巧辯深勝。大段第三時賢首下。顯實證成 分。於中有四。一動世界大機發故。二蔽魔宮唯佛境故。三息惡道利\n\n> 樂深故。四佛現證契佛心故。於中摩頂讚善隨喜。即三業皆證。勸物 信行第二會竟。\n\n> 大方廣佛華嚴經疏卷第十六 大方廣佛華嚴經疏卷第十七\n\n> 唐清涼山大華嚴寺沙門澄觀撰\n\n（以上六块即本科段全文之綱格切分·块块相接无缺·窗口尾「大方廣佛華嚴經疏卷第十六／十七」尾题与撰人衔照录于附录四末块）\n\n### 5.2 法藏《华严经探玄记》（`T1733`·**依六十编次·目录列「8 賢首菩薩品」**·本品无独立科段·唯征引）\n\n- **典首目录（直证六十品次）**：`T1733` 头部章节目次「……**7 淨行品／8 賢首菩薩品／9 佛昇須彌頂品**……」——法藏所据六十编次，贤首作**第八**（对照八十第十二·§6.1〔一〕）。\n- **征引·十信满心即得六位**：「**普門一位即一切位故。亦一運即一切運。名不思議乘。乘此乘者十信滿心即得六位。如賢首品等說**」（`T1733`@17740·§1.2）——法藏于别处（五教章性起／普贤机段）征引贤首品「**十信满心即得六位**」义，证本品为**十信满心·邻位成贤**之典据。\n- ⚖ **本品无独立科段**：实测 `T1733`「賢首品第十二」0 见（八十品题）、「賢首品」×14（皆征引·非科段正文）。〔本文判断〕探玄记现存卷帙或于贤首正科有阙（对照其净行品有专段·L.184），本案据目录列「8 賢首菩薩品」定其编次所依，科文之缺〔待核·探玄记贤首正科未获直证〕。\n\n### 5.2′ 智俨《华严经搜玄记》（`T1732`@29947·**依六十编次·品题「賢首品第八」**·四门）\n\n- **辨名**：「**一辨名者。十信已滿位是賢聖之初。為凡頂菩薩中初故曰賢首品**」（@29947·§1.2）——「贤圣之初·凡顶菩萨中初」，正明十信满心将入贤位。\n- **来意·宗**：「**二明來意。何故來。行既成立。次須廣歎德用成位故來也。三宗為歎德**」（@29947·§1.1/§4.2）。\n- **释文·三问科·偈数（据六十）**：「**四釋文。此品有七百一十五偈半。文中有三。初文殊問。二有七百七偈半賢首正答。三賢首說。此品竟時下有六偈。經家所顯諸佛證成。問文二。初長行。經家總顯文殊問意之相也。次有二偈。牒前淨行成是信因。以正請問……初十三偈總明信位發心行相。二深心下五百一十九偈半廣明信位德體殊能。三一切諸佛皆共說下一百五十四偈明所說旨深……**」（@29947·§1.3/§2.6）——**智俨据六十数「七百一十五偈半」**（每行计），三科「文殊問／賢首正答／諸佛證成」。\n- **依法生解·依解成行·依行彰德（三品位次）**：「**初信文分三。初一品明依法生解。二淨行品依解成行。三賢首品明依行彰德以成位耳**」（`T1732`@25548·§1.2）——智俨以此三句锁问明（解）·净行（行）·贤首（德）三品之序，是「三品共成十信」之早期判释。\n\n### 5.2″ 慧苑《续华严略疏刊定记》（X0221·@145024–·**有贤首专段**·四门·七分科）\n\n- **释名（有财／依主双释）**：「**初釋名者。賢善也首勝也。謂性善德勝故曰賢首。此則賢之首故。有財釋也。賢首菩薩說此品故。名賢首品。此則賢首之品。亦依主釋也**」（@145024·§1.1）。\n- **来意·宗趣**：「**二來意者。前品明信中願行。今明信中德業。故次來也。三宗趣者。以信德用為宗。為後成位為趣**」（@145024·§1.1）。\n- **四分科**：「**四釋文者。夫科此品。總為四分。一經家敘述文殊前說分。二我今已為下文殊勸說分。三爾時賢首菩薩下依勸演暢分。四時賢下顯實證成分**」（@145024·§二纲）——四分正是 §二 疏解之纲（发起·劝说·演畅·证成）。\n- **七分·偈数（据八十）**：「**就初分中四頌分二……於中。總即三百五十七頌半。曲科為七分。一歎廣說略。二菩薩發意下略辨行相。三信為道元下略示勝能。四若常信奉下所具行位。五或有剎土下無方大用。六一切如來下喻況玄旨。七第一智慧下校量勸持**」（@145024·§1.3/§2.2–2.6）——**慧苑据八十数「三百五十七頌半」**，七科次第与 §二 六段一一对应（歎廣說略→§2.1；略辨行相→§2.2 前；略示勝能→§2.2 宗眼；所具行位→§2.3；無方大用→§2.4–2.5；喻況玄旨→§2.6 譬喻链；校量勸持→§2.6 结叹）。\n\n### 5.3 李通玄《新华严经论》（`T1739`·贤首段 @177918–·**五门·含独特「明信心退住」门**）\n\n- **五门**：「**將釋此品約作五門分別。一釋品名目。二釋品來意。三明品之宗趣。四明信心退住。五隨文釋義**」（@177918·§1.1）——**「四明信心退住」是李通玄独设之门**（余四家皆四门），正对十信位「退／住」之疑。\n- **释品名目（依行立名）**：「**一釋品名目者。何故名為賢首。為依行立菩薩之名……以明信解如來因果普賢五位行門。心行調柔。順和正直深心正念。樂集善根常念利生。名之為賢。創從凡夫頓彰法界諸佛因果理智一時明現。名之為賢首……乃是於佛果海。文殊普賢行之賢首**」（@177918·§1.1）。\n- **来意·宗趣**：「**二釋品來意者。為第二會以來五品經。但明十信菩薩所修行法門及一百四十願等法。此品明十信中所欣修佛果所行行願功德廣大故有此品來也。三明品之宗趣者。明已生十信心已得福獲益為宗**」（@177918·§1.1）——李通玄以「一百四十願」回指净行（从六十口径·L.184），贤首明十信所欣佛果功德。\n- **明信心退住（独门·引起信论）**：「**四明信心退住者有二義。一三乘。二一乘。一三乘者。如起信論有三種發心。一信成就發心。二解行發心。三證發心。一信成就發心者……依不定聚眾生。有熏習善根力故……經一萬劫。信心成就故諸佛菩薩教令發心……**」（@178265·§1.1）——李通玄引《大乘起信论》三种发心（信成就／解行／证发心），辨十信位「退住」之义，是其以「信心」贯摄贤首之特色判释。〔本文判断〕「明信心退住」门为正统四门科判所无，属李通玄自家理路，录之以存一家之言。\n\n**【要点提炼】**（L.244 会读深化）\n\n1. **五门之独门**：「四明信心退住」为李氏自设（余四家皆四门）——正对十信位「退／住」之疑（上引五门段）。\n2. **依行立名**：「心行调柔……乐集善根常念利生名之为贤。创从凡夫顿彰法界诸佛因果理智一时明现，名之为**贤首**」——「于佛果海文殊普贤行之贤首」：贤首非人名而是**行之首位**（上引释品名目段）。\n3. **来意回指净行**：前五品明十信所修（一百四十愿等），本品明十信**所欣**佛果行愿功德广大（上引来意段）——净行（能行）与贤首（所欣）成对。\n4. **引起信论三发心**：信成就（一万劫信心成就）/解行/证发心辨「退住」二义（三乘/一乘）（上引「明信心退住」段）——**李氏以起信论注华严位次**之代表例。\n\n**【阐释】**（〔本文判断〕）「明信心退住」门是全系列唯一超出四门格式之科判——它承认信位有退（三乘口径·一万劫），而以一乘口径救之：贤首品之功德广说正是不退之「所欣」。**退与欣，一节两义**：本品 140 偈半实为「不退之引」。### 5.3′ 海云继梦讲记（〔讲师玄谈·非正行〕·ep08／ep10／ep12）\n\n- 实测覆盖：ep08「賢首」×21·「十信」×23；ep10「賢首」×13；ep12「賢首」×11·「十信」×68（`_p12_cite.py`）——讲者以**十信位**释贤首品，与五家「十信满心·成贤位」判释合（§1.2）。\n- 讲者于贤首品之**正行段逐字讲记**〔未上架·待补〕；本案只据其覆盖频次作口径旁证，**不引玄谈入经文疏解**（依〔编务总则·讲者疑误只标不改〕）。\n\n### 5.3″ 海云《贤首品》品级讲记会读（正行·逐字照录·L.226 新立）\n\n**系列清点（2026-10-28）**：`docs/huayanhai/华严云海/浩瀚华严海/八十华严之12品贤首品/` 存《华严经贤首品导读》（**72,964 CJK**·UTF-8·讲次目录体）——品级专讲，与 §5.3′ 之九九华严玄谈段（ep08/10/12）**两层并存**。\n\n**代表引文**（逐字照录·程序化抽取 0 手抄）：\n\n1. **信为道元与两译用字**：「信为道元功德母”，这个字啊，信为道元功德源，或者信为道元功德海，都没有关系，你要知道这个意思就好。“长养一切诸善法”，这里用“法”，那也有，《六十华严》是“长养一切诸善根”，这里头就牵涉到中国字的用法，善法跟善根是差别很大的。善法你知道吧？说好的都是善法嘛，对不对？一般人讲的：宗教，各种不同的宗教，不外乎劝人为善。」——讲者就「信为道元功德母／源／海」之传异先立「知其意」之读法，随即点出八十「長養一切諸善**法**」vs 六十「長養一切諸善**根**」之两译用字差，且以「善法跟善根是差别很大的」提其义理分际——〔本文判断〕此与 §6 六十对读之用字纪律（各照底本不统一）同法，而讲者更进一层指出**字差即义差**。\n2. **讲者之驳（对机语）**：「有没有？这叫一般常讲的，这叫不负责任的话，所有的宗教都劝人为善，那是最表面的，表相的。到本体上面来，所有的宗教都不一样，都不一样。」〔⚖讲者之判·照录不代立论·不入经文疏解。〕\n\n> **引用纪律**：同 §5.3″′（十住品体例）。\n\n> **EN corresponding · The Guide to the Chapter of the Chief of Worthies.** The archive holds Haiyun's guide (72,964 characters); he reads \"faith as the mother of merit\" by meaning first, then marks the eighty-versus-sixty divergence of \"wholesome dharmas / wholesome roots\" as a difference of doctrine-carrying usage, not mere wording.\n\n###
