自樂大名稱，但為永滅眾生苦，利益世間而發心。常欲利樂諸眾生，莊嚴國土供</blockquote>\n</section>\n\n**名相对应表**（对勘批 correspondence 原文迻录）\n\n| 目 | 八十（T10n0279） | 六十（T09n0278） | 藏（德格 Toh 44） |\n|---|---|---|---|\n| 开篇 | 「文殊師利菩薩說無濁亂清淨行大功德已」 | 「文殊師利以偈問了達深義淨德賢首菩薩」 | 藏 ཡོན་ཏན་ཡངས་པའི་སྤྱོད་ཡུལ（功德广行之境）文殊结偈 |\n| 称名 | 「賢首菩薩」 | 「了達深義淨德賢首菩薩」 | 藏 བཟང་པོའི་དཔལ（贤德·贤首） |\n\n> 藏开篇即文殊结偈（ཡོན་ཏན་ཡངས་པའི་སྤྱོད་ཡུལ——功德广行之境）而问 བཟང་པོའི་དཔལ（贤德·贤首）——与八十「說無濁亂清淨行大功德已，欲顯示菩提心功德故，以偈問賢首菩薩」、六十「文殊師利以偈問了達深義淨德賢首菩薩」三本同构；藏人名 བཟང་པོའི་དཔལ（贤·德）与「賢首」题义直合——**人名义译三本一贯**。\n\n<details class=\"tri-appx\">\n<summary>🧭 开篇种子〔订正〕登记（L.361 · 证据留痕）</summary>\n\n**判定**：题名块保留为段1（kind=title；规范译名为《大方廣佛華嚴經》第十八包），G2.2 对藏17 应以段2起比对；不改正 b2，仅登记本订正。\n\n**观察**：本专题 seg1 为章首题名块（སངས་རྒྱས་རྨད་ག་ཅད་…མདོ། བམ་པོ་བཅྭོ་བརྒྱད་པ། །·folio 219b.6），b2 bo_open 从正文／偈颂起；二者起点不同。\n\n**证据**（≥2 条独立佐证）：\n\n- 本专题 seg1 逐字回源：སངས་རྒྱས་རྨད་ག་ཅད་ཅེས་བྱ་བ་ཤིན་ཏུ་རྒྱས་པ་ཆེན་པོའི་མདོ། བམ་པོ་བཅྭོ་བརྒྱད་པ། །（folio 219b.6）\n- 本专题 seg2 起：ཡོན་ཏན་ཡངས་པའི་སྤྱོད་ཡུལ་ཡོངས་དག་པ། །…（正文／偈颂起点），与 b2 bo_open 同起\n\n**后续**：\n\n**机器检查**：``\n\n</details>\n\n> 〔口径〕对勘批 `bo_open` 字段经 L.361 订正登记判为旧偏移错切，本页**不展示**该字段；藏文开篇一律以本专题逐字复验 seg1 为准。订正不改对勘批 SSOT（各照底本·铁律）。\n\n## 三、延伸阅读\n\n**本仓专篇与总纲**\n\n- [华严经引读 · 系列总纲（§五 藏汉对应总表）](huayan-series-outline.html)\n- [华严经学 · 三十九品深度研究](huayan-studies.html) — 藏独有二章之法义归属见 §2.3\n\n**开篇试译**（L.354a 术语表 · 〔本文试译〕）\n\n> 〔bam po 18〕（文殊结偈）「功德广大之行境清净」——作是说已，于无垢众生，（文殊师利）问殊胜佛子贤德（བཟང་པོའི་དཔལ·贤首）以菩提功德：「行境清净之诸佛行，我今于此为诸佛子宣说；所有功德之行，佛子！今当由汝宣说。」贤德答言：「佛子谛听……」\n\n**数据源清单**（本页内容全部机械派生自下列库存）\n\n- 三语段数据层：`data/translation\\tibetan_avatamsaka_trilingual_segments_ch17.json`\n- 对勘批：`data/alignment\\tibetan_zhuhuju_b2.json`\n- 开篇订正登记：`data/alignment/tibetan_trilingual_opening_reconcile.json`\n- 试译术语表：`data/alignment/tibetan_shiyi_L354a.json`\n- 品目规划表：`data/alignment/tibetan_chinese_pin_plan_L360.json`\n",

  var btns = document.querySelectorAll('.tri-tab');
  for (var k = 0; k < btns.length; k++) btns[k].classList.toggle('is-on', k === i);
  try { localStorage.setItem('triTab:tibetan-avatamsaka-trilingual-ch17', String(i)); } catch (e) {}
};
(function () {
  function paneOf(el) {
    var root = document.getElementById('article-full');
    if (!root) return -1;
    var hs = root.querySelectorAll('h2.secfold');
    for (var i = 0; i < hs.length; i++) {
      if (el === hs[i]) return i;
      var b = hs[i].nextElementSibling;
      if (b && b.classList.contains('secfold-body') && b.contains(el)) return i;
    }
    return -1;
  }
  function fromHash() {
    var h = location.hash.slice(1);
    if (!h) return -1;
    var el = document.getElementById(h);
    return el ? paneOf(el) : -1;
  }
  function init() {
    var root = document.getElementById('article-full');
    if (!root || !root.querySelector('.secfold') || !root.querySelector('h2') || !root.querySelector('.tri-tabs')) return false;
    var hs = root.querySelectorAll('.secfold');
    for (var i = 0; i < hs.length; i++) {
      hs[i].classList.remove('is-folded');
      hs[i].setAttribute('aria-expanded', 'true');
    }
    // 窄屏页头换行可高达 200px+，固定 scroll-margin 会把锚点藏进页头 → 按实高同步
    function syncGap() {
      var top = document.getElementById('page-top');
      var gap = (top ? top.offsetHeight : 0) + 12;
      var as = document.querySelectorAll('.tri-anchor');
      for (var i = 0; i < as.length; i++) as[i].style.scrollMarginTop = gap + 'px';
    }
    syncGap();
    window.addEventListener('resize', syncGap);
    var lay = 'stack';
    try { lay = localStorage.getItem('triLayout') || 'stack'; } catch (e) {}
    window.__triLayout(lay);
    var tab = fromHash();
    if (tab < 0) {
      try { tab = parseInt(localStorage.getItem('triTab:tibetan-avatamsaka-trilingual-ch17') || '0', 10) || 0; } catch (e) { tab = 0; }
    }
    if (tab >= root.querySelectorAll('h2.secfold').length) tab = 0;
    window.__triTab(tab);
    root.addEventListener('click', function (e) {
      var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
      if (!a) return;
      var el = document.getElementById(a.getAttribute('href').slice(1));
      if (!el) return;
      e.preventDefault();
      var p = paneOf(el);
      if (p >= 0) window.__triTab(p);
      if (window._reveal) window._reveal(el);
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (history.replaceState) history.replaceState(null, '', a.getAttribute('href'));
    });
    window.addEventListener('hashchange', function () {
      var p = fromHash();
      if (p >= 0) window.__triTab(p);
    });
    return true;
  }
  function poll(n) { if (init()) return; if (n > 0) setTimeout(function () { poll(n - 1); }, 120); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { poll(20); });
  else poll(20);
})();
