  var t = el('text', {x:v._x, y:v._y - r - 6, 'text-anchor':'middle', 'font-size':11, fill:'var(--text1,#ddd)'}, g);
  t.textContent = '参' + v.card_no;
  var t2 = el('text', {x:v._x, y:v._y + r + 13, 'text-anchor':'middle', 'font-size':9.5, fill:'var(--text2,#aaa)'}, g);
  t2.textContent = v.role;
  var t3 = el('text', {x:v._x, y:v._y + r + 24, 'text-anchor':'middle', 'font-size':9, fill:'var(--text2,#999)'}, g);
  var nm = (v.n40 || v.teacher_t40.replace(/（.*?）/,'')).slice(0, 7);
  t3.textContent = nm;
  g.addEventListener('mousemove', function(ev){
    tip.style.display = 'block';
    tip.style.left = (ev.clientX + 14) + 'px';
    tip.style.top = (ev.clientY + 14) + 'px';
    tip.innerHTML = '<b>参'+v.card_no+'·'+v.n40+'</b><br>'+v.role+'｜'+v.city
      + '<br>法门：'+v.gate
      + '<br>四十：'+v.n40+'｜八十：'+(v.n80||v.shibai_name)+'｜六十：'+v.n60
      + '<br>篇幅：'+v.cjk.toLocaleString()+' CJK'
      + (SPECIAL[v.card_no] ? '<br>★ '+SPECIAL[v.card_no] : '');
  });
  g.addEventListener('mouseleave', function(){ tip.style.display = 'none'; });
  g.addEventListener('click', function(){
    document.getElementById('detail').innerHTML = '<h4>参'+v.card_no+'·'+v.n40
      + (SPECIAL[v.card_no] ? '<span class="badge">★'+SPECIAL[v.card_no]+'</span>' : '') + '</h4>'
      + '<div class="m">身份：'+v.role+'｜处所：'+v.city+'</div>'
      + '<div class="m">法门：'+v.gate+'</div>'
      + '<div class="m">三译师名：四十 <b>'+v.n40+'</b>｜八十 <b>'+(v.n80||v.shibai_name)+'</b>｜六十 <b>'+v.n60+'</b>'+(v.n_pan && v.n_pan !== '全同' ? '（'+v.n_pan+'）' : '（全同）')+'</div>'
      + '<div class="m">经文篇幅：'+v.cjk.toLocaleString()+' CJK（T0293 span '+v.span[0]+'–'+v.span[1]+'）</div>'
      + '<div class="m">canonical 参数：'+(typeof v.canon_no === 'number' ? ('第'+v.canon_no+'参') : v.canon_no)+'</div>';
  });
});

// 首尾标注
var lbl = el('text', {x:X0-40, y:Y0-30, 'font-size':13, fill:'var(--text1,#ddd)'});
lbl.textContent = '出发点：文殊授「求善知识三戒」';
var lbl2 = el('text', {x:pts[pts.length-1][0]-30, y:pts[pts.length-1][1]+60, 'font-size':13, fill:'var(--text1,#ddd)'});
lbl2.textContent = '终点：普賢十愿王 → 速往无量光佛剎';
</script>
