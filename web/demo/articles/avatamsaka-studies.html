e)\n  对照: 维特根斯坦在《逻辑哲学论》结尾说「对于不可说的东西,\n  必须保持沉默」, 华严则说「不可说但可以证入」——两者都承认\n  理性的边界, 但华严提供了「超越边界」的实践路径(修行·证入),\n  而维特根斯坦只停留在「沉默」。\n\n㉞ 如来十身相海品(第三十四) [Daśakāya]\n内容: 普贤菩萨说如来「十身」(十种佛身)的相好庄严——\n菩提身·愿身·化身·力持身·相好庄严身·威势身·意生身·福德身·法身·智身。\n每一身皆有无量相好, 如「有十莲华藏世界海微尘数大人相」。\n\n版本对照: 八十华严第34品 | 六十华严第28品「如来十身相海品」 | 藏译第35品\n\n【批注·阐释】\n·澄观《华严经疏》释「十身即十种佛格」: 澄观指出, 如来「十身」\n  不是「十个身体」, 而是「十种佛格」(十种佛的存在方式)——菩提身\n  是「成道之身」, 愿身是「度生之身」, 化身是「应现之身」,\n  力持身是「住持之身」, 相好庄严身是「色相之身」, 威势身是\n  「折伏之身」, 意生身是「随意之身」, 福德身是「积功之身」,\n  法身是「理体之身」, 智身是「智照之身」。十身互相含摄——\n  一身即十身, 十身即一身, 圆融无碍。澄观将十身与「四法界」\n  联系: 法身·智身是「理法界」, 菩提身·愿身是「事法界」,\n  其余六身是「理事无碍法界」与「事事无碍法界」的展现。\n·法藏《华严经探玄记》阐释「相好即法身的显现」: 法藏指出,\n  此品的「相好庄严」不是「外在的装饰」(佛的身体好看), 而是\n  「法身的自然显现」——佛的每一相好都是无量劫修行功德的凝缩,\n  是「因行」的「果德」表达。法藏以「金师子」喻解释: 金(法身)\n  是体, 师子的相好(十身)是用, 有体必有用, 有用必有体,\n  体用不二。「有十莲华藏世界海微尘数大人相」的描写, 正是\n  「一即一切」的相好观——一个相好中含无量相好, 无量相好归于\n  一个相好。\n\n㉟ 如来随好光明功德品(第三十五) [Anuvyañjana]\n内容: 佛说如来「随好」(微细相好)的光明功德——\n每一随好放无量光, 光中说无量法, 度无量众生。\n\n版本对照: 八十华严第35品 | 六十华严第29品「随好光明功德品」 | 藏译第36品\n\n【批注·阐释】\n·澄观《华严经疏》释「随好是微细功德」: 澄观指出, 「随好」\n  (anuvyañjana) 是佛的「微细相好」, 区别于「大相」(maha-lakṣaṇa,\n  三十二相)——大相是「粗显」的(肉眼可见), 随好是「微细」的\n  (唯佛与佛乃能知)。此品说「每一随好放无量光」, 表示佛的\n  「微细功德」同样具有「无尽」的特质——不仅大相无量, 随好也\n  无量; 不仅相好无量, 光明也无量; 不仅光明无量, 光中所说法\n  也无量。澄观将此品与「如来十身相海品」联系: 前品说「十身\n  的相好」(整体), 此品说「随好的光明」(细节), 两者共同表达\n  佛的「功德无尽」——从整体到细节, 从粗到细, 无不圆满。\n·海云继梦法师强调「光明即智慧的外显」: 海云法师指出, 此品的\n  「光明」不是「物理之光」, 而是「智慧之光」(般若光·法界光)。\n  「每一随好放无量光」表示佛的每一个「微细功德」都是「智慧的\n  显现」——佛没有「无智慧的功德」, 也没有「无功德的智慧」,\n  智慧与功德是一体的两面。海云法师将此与修行联系: 修行者\n  修「随好」(微细的善行), 同时也是修「光明」(智慧的显发),\n  因为「微细善行」本身就是「智慧的运用」。\n\n㊱ 普贤行品(第三十六) [Samantabhadra-caryā]\n内容: 普贤菩萨说「普贤行」——\n十种大愿(礼敬诸佛·称赞如来·广修供养·忏悔业障·随喜功德·请转法轮·\n请佛住世·常随佛学·恒顺众生·普皆回向)的详细展开。\n此品是华严「行愿」的核心——普贤十愿是华严修行的总纲。\n\n版本对照: 八十华严第36品 | 六十华严第30品「普贤行品」 | 藏译第37品\n\n【批注·阐释】\n·澄观《华严经疏》释「十愿为华严修行总纲」: 澄观指出, 普贤十愿\n  (礼敬诸佛·称赞如来·广修供养·忏悔业障·随喜功德·请转法轮·\n  请佛住世·常随佛学·恒顺众生·普皆回向)是华严「修行」的最核心\n  表达——前八会的「信·解」(理论理解)在此品中被转化为「行」\n  (实际修行)。澄观将十愿的结构解读为「从自到他·从因到果」:\n  前五愿(礼敬·称赞·供养·忏悔·随喜)是「自利行」(净化自身),\n  后五愿(请转法轮·请佛住世·常随佛学·恒顺众生·普皆回向)\n  是「利他行」(利益众生), 最后「普皆回向」统摄一切, 将所有\n  功德回向法界。澄观特别强调, 此品是「成行因果」(第四周)的\n  核心——将前三周的「信·解」(理论)化为「行」(实践)。\n·海云继梦法师强调「普贤行是实践的核心」: 海云法师指出, 华严经\n  的修行体系可归纳为「文殊解·普贤行」——文殊代表「智慧」(理解\n  法界), 普贤代表「实践」(行入法界)。此品是「普贤行」的最\n  完整表达, 十愿不仅是「发愿」(口头誓愿), 更是「正行」(实际\n  修行)。海云法师特别强调「恒顺众生」愿: 这是华严「平等观」\n  的最直接实践——不是「我来度你」(居高临下), 而是「恒顺」\n  (随顺众生的根机·因缘·方式), 这是「无我」的最高体现。\n·印顺法师讨论「普贤行愿与净土法门的关系」: 印顺指出, 普贤十愿\n  中的「普皆回向」与净土宗的「回向西方」有深层关联——普贤行愿\n  的最终归趣是「往生净土」(普贤行愿品末尾明确说「愿我临欲命终时,\n  尽除一切诸障碍, 面见彼佛阿弥陀, 即得往生安乐刹」)。印顺认为,\n  这说明华严与净土并非「对立」, 而是「华严为体·净土为用」——\n  华严的「法界观」是「体」, 净土的「往生」是「用」, 两者圆融。\n\n㊲ 如来出现品(第三十七) [Tathāgatotpattisaṃbhava]\n内容: 佛说如来「出现」(成道·转法轮·入灭)的因缘——\n如来以无量身·无量名·无量方便出现于世, 非仅释迦牟尼一佛。\n此品是「平等因果」的总结——佛佛平等·法法平等。\n\n版本对照: 八十华严第37品 | 六十华严第31品「如来兴显经」 | 藏译第38品\n\n【批注·阐释】\n·澄观《华严经疏》释「如来出现即法界全体的显现」: 澄观指出,\n  「如来出现」(tathāgatotpattisaṃbhava) 不是「一个佛从无到有」,\n  而是「法界全体的显现」——如来的「出现」就是法界的「显现」,\n  两者是一回事。澄观将此品的「出现」解读为三义: 一「出现」\n  (成道, 法界从「隐」到「显」), 二「转法轮」(说法, 法界从\n  「显」到「用」), 三「入灭」(涅槃, 法界从「用」归「体」)。\n  但「入灭」不是「消失」, 而是「回归法界」——如来从未离开\n  法界, 故「入灭」也是「出现」的另一种形式。澄观将此品与\n  「毗卢遮那品」(第六品)对照: 第六品追溯毗卢遮那的因地修行\n  (因), 此品说如来出现的果德(果), 因果圆满, 平等无二。\n·法藏《华严经探玄记》阐释「平等因果的总结」: 法藏指出, 此品是\n  「平等因果」(第三周)的总结——前品(如来十身相海品·随好光明\n  功德品)说佛的「果德」(相好·光明), 此品说佛的「出现因缘」\n  (为什么佛会出现于世)。法藏将「出现」解读为「因该果海·果彻\n  因源」的华严核心命题的最终表达: 佛的「出现」(果)以无量劫\n  修行(因)为根源, 无量劫修行(因)以佛的「出现」(果)为归趣,\n  因与果互相含摄, 圆融无碍。\n\n**═══ 第八会: 普光法堂三会 (卷53-59, 1品) ═══**\n说法处: 摩揭陀国普光明殿(第三次在此集会)\n会主: 普贤菩萨(普慧菩萨问·普贤菩萨答)\n宗旨: **成行因果[行]** — 说普贤二千行门\n\n㊳ 离世间品(第三十八) [Lokottara] (卷53-59, 约7卷)\n内容: 普慧菩萨以二百问请问普贤菩萨, 普贤菩萨以二千答酬对——\n问一答十, 显无尽义。内容涵盖从初发心乃至究竟成佛的一切修行法门,\n总摄五位(十住·十行·十回向·十地·等觉妙觉)的因行。\n「离世间」之义: 虽在世间修行, 却不为世间所染,\n以出世间的心行入世间度众生。\n\n版本对照: 八十华严第38品 | 六十华严第32品「离世间品」 | 藏译第39品\n\n【批注·阐释】\n·澄观《华严经疏》释「二百问二千答·总摄五位」: 澄观指出,\n  此品以「普慧菩萨二百问·普贤菩萨二千答」的问答形式, 将华严\n  全经的修行法门做了一次「总摄」——从初发心(十信)到究竟成佛\n  (等觉妙觉)的一切修行, 皆在此品中以「问一答十」的方式穷尽\n  展开。澄观将此品的功能归纳为「承前启后」: 总结前七会的\n  「信·解·行」(理论与实践), 为第九会(入法界品)的「证入」\n  做最后的理论铺垫。「离世间」之「离」不是「离开」世间,\n  而是「不染」世间——虽在世间中修行, 却不为世间的贪瞋痴\n  所染, 这是「即世间而出世间」的华严修行精神。\n·印顺法师讨论「此品的百科全书性质」: 印顺指出, 此品是华严经中\n  「涵盖面最广」的一品——二百问涵盖了从「发心」到「成佛」的\n  一切修行问题, 二千答则对每个问题给出十个层面的回答, 总计\n  二千条修行指导。印顺将此品与《大智度论》的「百法明门」对照:\n  两者都是对佛法修行的「百科全书式」总结, 但华严的「问一答十」\n  比《大智度论》的「百法」更为系统和完整。\n·海云继梦法师强调「问一答十·无尽法门」: 海云法师指出, 「问一答十」\n  不是「凑数」(故意答十个), 而是「法界本然」——每一个修行问题\n  在法界中都有「无尽的回答层面」, 十只是「约数」(代表「圆满」),\n  实际上是「无量答」。海云法师将此与华严「一即一切」联系:\n  一个问题中含无量问题, 一个回答中含无量回答, 这正是法界\n  「重重无尽」在问答形式中的体现。\n\n**═══ 第九会: 逝多林会 (卷60-80, 1品) ═══**\n说法处: 舍卫国逝多林给孤独园(重阁讲堂)\n会主: 文殊·弥勒·普贤三位大士(佛以神力加持)\n宗旨: **证入因果[证]** — 说入法界法门\n\n㊴ 入法界品(第三十九) [Gaṇḍavyūha] (卷60-80, 约21卷)\n内容: **全经最长的一品(约占全经四分之一)**, 也是华严经中最广为流传的部分。\n叙事结构:\n·文殊菩萨从善住楼阁出, 善财童子发心求法, 文殊指示他南行参访善知识。\n·善财依次参访五十三位善知识(「五十三参」), 涵盖国王·大臣·比丘·比丘尼·\n  居士·优婆夷·外道·婆罗门·天女·童女等各阶层·各性别·各信仰的人物。\n·每一位善知识各以自己的修行法门教导善财, 令他的智慧层层深入。\n·最终善财参访弥勒菩萨, 弥勒弹指间开「毗卢遮那庄严藏大楼阁」,\n  善财入楼阁中亲见法界全体——无量世界·无量佛·无量众生同在一身中。\n·善财出楼阁后, 参访文殊菩萨(证悟圆满), 最后参访普贤菩萨,\n  融入普贤菩萨的广大行愿中, 获得「一切世界海微尘数三昧」。\n·普贤菩萨说「十大愿王」(即普贤行愿品的核心), 以此总摄全经的修行纲领。\n此品以「善财南游」的叙事, 将前八会的理论(信·解·行)落实为具体的\n「证入」——从抽象的教理到活生生的人间参访, 是华严经「理论与实践统一」\n的最高典范。善财五十三参的叙事也展示了华严「一切皆可为善知识」的平等观。\n\n版本对照: 八十华严第39品 | 六十华严第33品「入法界品」 | 四十华严(全经仅此品) | 藏译第40品「入法界品」\n\n【批注·阐释】\n·澄观《华严经疏》释「五十三参·善财南游·证入法界」: 澄观指出,\n  入法界品是华严经「证入因果」(第五周)的唯一品目, 占全经\n  约四分之一篇幅(卷60-80, 约21卷), 这一巨大的比重说明「证入」\n  在华严修行体系中的核心地位——「信·解·行」最终都要落实为\n  「证入」, 否则只是「口头佛法」。澄观将善财五十三参的结构\n  解读为「从文殊发心→南行参访→弥勒开藏→普贤证入」的完整\n  修行路径: 文殊代表「解」(智慧发起), 五十三参代表「行」\n  (实践过程), 弥勒开楼阁代表「证」(亲见法界), 普贤十大愿\n  代表「入」(融入法界)。澄观特别强调「南行」的表法意义:\n  「南」表「光明」(南方属火, 火表智慧光), 善财「南行」即\n  「向智慧之光前进」。\n·印顺法师讨论「入法界品的独立流传史」: 印顺指出, 入法界品\n  (Gaṇḍavyūha) 在印度曾作为独立经典广泛流传, 其独立性远超\n  华严经的其他品目。现存梵文写本(于阗发现的Gaṇḍavyūha梵本)\n  末尾附有于阗文题记, 证明其在中亚的独立流传。印顺还指出,\n  四十华严(般若译, 796年)全经仅此一品, 说明入法界品本身\n  就足以构成一部完整的「华严修行经典」——从发心到证入的\n  完整路径, 无需其他品目的辅助。这从侧面证明了入法界品在\n  华严经中的「独立地位」。\n·方东美《华严宗哲学》将此品解读为「从理论到实践的最高典范」:\n  方氏指出, 前八会的「信·解·行」是「理论」(抽象的教理),\n  入法界品是「实践」(活生生的人间参访)。方氏特别强调, 善财\n  参访的五十三位善知识涵盖了「国王·大臣·比丘·比丘尼·居士·\n  优婆夷·外道·婆罗门·天女·童女」等一切阶层·一切性别·一切\n  信仰, 这在世界宗教史上是「绝无仅有的平等宣言」——佛法不\n  属于任何特定阶层·性别·信仰, 一切人皆可为善知识, 一切处\n  皆可为道场。\n·海云继梦法师强调「一切皆可为善知识」: 海云法师指出, 善财\n  五十三参的「善知识」不仅包括佛教修行者(比丘·菩萨), 也\n  包括外道·婆罗门·甚至「外道仙人」, 这说明华严的「善知识」\n  不以「信仰」为标准, 而以「智慧」为标准——任何能引导你\n  深入法界的人, 不管他信什么·是什么身份, 都是你的善知识。\n  海云法师将此与「文殊发心→普贤证入」联系: 文殊(智慧)是\n  「出发点」, 普贤(行愿)是「归宿」, 五十三参是从「出发」\n  到「归宿」的完整旅程。\n·法藏《华严经探玄记》阐释「善财参访的次第与心地法门」: 法藏\n  将五十三参的「参访次第」解读为「心地法门」的修行次第——\n  每一位善知识代表「心地」的一个层面: 前二十参(德云比丘至\n  观自在菩萨)是「信位」的展开, 中间十参(正趣菩萨至大天)\n  是「住位·行位·回向位」的展开, 后二十三参(安住地神至\n  普贤菩萨)是「地位·等觉·妙觉」的展开。法藏指出, 善财的\n  「参访」不是「外在的旅行」, 而是「内在的心地开发」——\n  每参一位善知识, 即开发一层「心地」, 直至心地圆满开发,\n  即证入法界。\n", "sources": ["Chengguan, Huayan jing shu (T35n1735)", "Fazang, Huayan jing tanxuan ji (T45n1851)", "Thomé Fang, The Philosophy of the Huayan School (1980)", "Haiyun Jimeng, Avataṃsaka practice teachings (huayen.world)", "Yinshun, The Origins of Early Mahāyāna Buddhism (1950)", "Nāgārjuna, Daśabhūmika-vibhāṣā (Tibetan translation)", "Vasubandhu, Daśabhūmika-sūtra-śāstra (trans. Bodhiruci, T26n1522)", "Bhikshu Dharmamitra, The Flower Adornment Sutra (Kalavinka Press, 2022)", "Thomas Cleary, The Flower Ornament Scripture (Shambhala, 1993)", "Lingyin Temple, 'The Content and Structure of the Avataṃsaka Sūtra' (2019)"], "en_body": "The complete structure of the eighty-fascicle Avataṃsaka, 39 chapters, seven\nplaces, nine assemblies, five cycles of cause and effect, is as follows —\n\n**═══ ASSEMBLY 1: THE BODHI TREE SITE (fascicles 1–11, 6 chapters) ═══**\nLocation: the bodhimaṇḍa in Magadha (the site of the Buddha's enlightenment)\nAssembly Master: Vairocana (the reward-body Buddha after enlightenment)\nTheme: **The cause and effect of what is to be believed [Faith]**\n\n① *Wondrous Adornments of the World Rulers* (ch. 1) [Sarva-lokendra-vyūha-naya-prabhāva]\nFascicles: ~3\nContent: The grand prologue. After Vairocana's enlightenment, all world-rulers\n(earth spirits, water spirits, wind spirits, tree spirits, city spirits,\nmountain spirits, etc.) assemble and praise the Buddha's virtues, establishing\nthe Avataṃsaka cosmological framework of infinite worlds, infinite buddha-lands,\n and infinite beings gathered in a single assembly.\n ·Chenggguan, Huayan jing shu: Interprets this chapter as the \"head\" (首) of \"generating faith\" (令物生信), arguing that the\n  Buddha's virtues are not self-proclaimed but revealed through\n  the world-rulers — a technique of \"others illuminating self\"\n  (他方显自). Places this chapter at the \"Faith\" position within\n  the \"cause and effect of what is to be believed,\" the starting\n  point of the entire sūtra's practice map.\n ·Thomé Fang, Philosophy of the Huayan School: The \"ocean assembly\"\n  scene embodies the Huayan core principle of \"one is all, all\n  is one\" — infinite world-rulers gathered in a single assembly,\n  each reflecting the totality of the dharmadhātu. Fang calls\n  this the \"cosmological declaration of dharmadhātu-pratītyasamutpāda.\"\n ·Haiyun Jimeng: The assembly-master is Vairocana (Sākyamuni's\n  reward body), not Sākyamuni's emanation body, indicating that\n  the Avataṃsaka speaks of the Buddha's \"realm of realization\"\n  rather than \"process of practice\" — not how the Buddha practiced,\n  but what the Buddha sees after enlightenment.\n ·Yinshun: Historically, the pantheon of world-rulers reflects\n  early Mahāyāna's strategy of \"incorporating\" the Hindu pantheon\n  into the Buddhist framework, demonstrating the \"all-embracing\"\n  religious strategy of Mahāyāna Buddhism.\n\n ② *Manifestations of the Thus Come One* (ch. 2) [Tathāgatotpattisaṃbhava]\nFascicles: ~1\nContent: Vairocana emits light from the white hair-mark between his brows,\nrevealing in the light infinite worlds, buddha-lands, beings, and\nbodhisattvas, enabling the assembly to directly see the entirety of the\ndharmadhātu. Establishes the core proposition that \"the Buddha-body is the\n dharmadhātu.\"\n ·Chengguan, Huayan jing shu: The core is \"the Buddha-body is the\n  dharmadhātu\" — the light reveals infinite worlds not as external\n  display but as the natural manifestation of the dharmadhātu\n  itself. \"Manifestation\" (现相) equals \"revealing the essence\"\n  (显体).\n ·Fazang, Huayan jing tanxuan ji: From the angle of \"light\n  symbolizing wisdom\" — the white hair-mark between the brows\n  signifies the \"light of the Middle Way,\" and the worlds\n  appearing within the light embody \"unhindered wisdom-illumination\"\n  (智照无碍). Fazang applies the \"six characteristics\" (六相)\n  framework: one light containing infinite worlds is precisely\n  the \"totality, particularity, identity, difference, formation,\n  and disintegration\" in perfect interpenetration.\n ·Thomé Fang: Interprets this chapter as the \"epistemological\n  declaration\" of Huayan philosophy — the Buddha's light \"manifests\"\n  without fabrication; it is the dharmadhātu presenting itself.\n  \"Manifestation\" is not \"manufacturing.\" This resonates with\n  Western philosophy's distinction between \"phenomenon\" and\n  \"noumenon.\"\n\n ③ *Samantabhadra's Samādhi* (ch. 3) [Samantabhadra-samādhi]\nFascicles: ~1\nContent: Samantabhadra enters the \"samādhi of the tathāgata-body treasury of\nall buddhas,\" and rising from it, with the Buddha's supernatural power\ndescribes the infinite, interpenetrating buddha-lands of the dharmadhātu.\nEstablishes Samantabhadra as the central representative of \"practice and vows\"\n in the Avataṃsaka.\n ·Chengguan, Huayan jing shu: The core is \"samādhi as practice\"\n  (三昧是行) — Samantabhadra's entry into samādhi is \"realizing\n  the essence\" (证体), and rising from it to speak is \"activating\n  function\" (起用). Essence and function are non-dual. The\n  samādhi's name — \"the tathāgata-body treasury of all buddhas\" —\n  takes all buddhas' dharmakāya as its object of contemplation,\n  the highest object of practice in the Avataṃsaka.\n ·Fazang, Huayan jing tanxuan ji: \"Tathāgatagarbha\" (如来藏)\n  speaks of the intrinsic nature within bondage; \"dharmakāya\"\n  (法身) speaks of the realization after liberation — ultimately\n  two faces of one reality. Samantabhadra's samādhi embodies\n  \"the cause encompasses the ocean of fruition, the fruition\n  penetrates the source of the cause.\"\n ·Haiyun Jimeng: Samantabhadra represents the \"path of practice\"\n  (行门), complementing Mañjuśrī's \"path of understanding\"\n  (解门). The fact that Samantabhadra first enters samādhi\n  (actual practice) then speaks (theory) demonstrates the\n  Avataṃsaka's principle of \"equal emphasis on practice and\n  understanding.\"\n ·Bhikshu Dharmamitra (2022): Establishes Samantabhadra as\n  the \"Lord of Practice and Vows,\" with the samādhi name\n  pointing directly to Vairocana's dharmakāya, implying the\n  fundamental unity of \"practice\" and \"realization.\"\n\n ④ *Creation of Worlds* (ch. 4) [Lokadhātu-samudra-nirdeśa]\nFascicles: ~1\nContent: Samantabhadra expounds the causes and conditions for the formation of\nthe \"ocean of world-realms\" (the totality of all worlds) — how worlds arise\nfrom the interplay of sentient beings' karma, the power of buddhas, and the\npower of the Dharma, and the ceaseless cycles of formation, abiding,\n disintegration, and emptiness.\n ·Chengguan, Huayan jing shu: \"Worlds stand on karma\" (世界依业\n  而立) — the ocean of world-realms is formed by three conditions:\n  sentient beings' karma, the tathāgatas' power, and the power\n  of the dharmadhātu. Unlike the Hīnayāna \"karma-conditioned\n  origination,\" the Avataṃsaka world is a \"dharmadhātu-conditioned\"\n  dynamic field where karma, buddha-power, and dharma-power\n  interpenetrate without obstruction.\n ·Yinshun, The Origins of Early Mahāyāna Buddhism: This chapter\n  reflects the mature form of the Mahāyāna \"worldview of\n  conditioned origination.\" Early Buddhism explained the world\n  through \"karma-conditioned origination\"; by the Avataṃsaka\n  period this developed into \"dharmadhātu-conditioned origination,\"\n  marking a major shift from \"individual liberation\" to\n  \"cosmic-wholeness.\"\n ·Haiyun Jimeng: The \"formation-abiding-disintegration-emptiness\"\n  cycle is not linear time but \"simultaneous complete presence\"\n  (同时具足) — all worlds simultaneously exist in different stages,\n  with no \"beginning\" or \"end,\" only the dharmadhātu's constant\n  manifestation.\n\n ⑤ *The Flower-Treasury World* (ch. 5) [Kusumatala-vyūhālaṃkāra-lokadhātu]\nFascicles: ~2\nContent: Detailed description of Vairocana's pure land, the \"Ocean of Worlds\nAdorned with the Flower-Treasury\" — twenty tiers of worlds stacked layer upon\nlayer, each world encircled by buddha-lands as numerous as dust-motes;\nsupported by wind wheels above which are fragrant-water seas, fragrant-water\nrivers, world-seeds, and worlds — an infinite nested structure. This is the\nmost central description of the Avataṃsaka cosmology. (The Tibetan translation\ndivides this chapter into 5 sub-chapters, reflecting an older chapter\n division.)\n ·Chengguan, Huayan jing shu: The Flower-Treasury World is the\n  \"reward land\" (报土) of Vairocana. Chengguan analyzes its\n  structure using the \"six characteristics\": the wind-wheel as\n  \"totality,\" the fragrant-water seas and world-seeds as\n  \"particularity\"; twenty tiers as \"identity,\" each world's\n  differences as \"distinction\"; the infinite nesting as\n  \"formation,\" each world's stability as \"disintegration.\"\n  The Flower-Treasury is not \"one\" world but \"all worlds\"\n  simultaneously manifesting.\n ·Thomé Fang: Interprets the twenty-tier structure as an \"infinite\n  nested cosmology\" — each tier contains infinite worlds within\n  worlds, layer upon layer without end. Fang argues this surpasses\n  Kant's concept of the \"sublime\": Kant's sublime is a subjective\n  experience of \"finite mind facing infinity,\" while the Avataṃsaka's\n  infinite nesting is an objective reality where \"infinity\n  completely manifests within the finite.\" This is the Huayan\n  philosophy's original answer to the finite-infinity problem.\n ·Yinshun: Approaches the cosmic description cautiously, noting\n  that the twenty-tier structure, wind-wheel, and fragrant-water\n  seas blend ancient Indian cosmology (e.g., Purāṇa cosmography)\n  with Mahāyāna religious imagination. The Avataṃsaka cosmology\n  is simultaneously religious symbolism (representing the\n  endlessness of the Dharma) and philosophical import (representing\n  the infinite unfolding of conditioned origination and emptiness).\n ·Thomas Cleary: The Flower-Treasury description functions as a\n  \"cosmic maṇḍala\" — its purpose is not merely to depict a cosmic\n  landscape but to provide an object of visualization for\n  practitioners. Through contemplating the infinite nesting, the\n  practitioner transcends the \"one-many\" dichotomy and realizes\n  the Avataṃsaka vision of \"one is all.\"\n\n ⑥ *Vairocana* (ch. 6) [Vairocana]\nFascicles: ~5\nContent: Traces Vairocana's cultivation from the initial aspiration through\ncountless kalpas of practicing the six pāramitās, saving beings, and\nperfecting the buddha-result. Demonstrates that the \"buddha-fruit\" is not\nachieved in an instant but through the accumulation of boundless kalpas of\n practice.\n ·Chengguan, Huayan jing shu: Interprets this chapter as \"tracing\n  the cause to illuminate the effect\" (追因显果) — the purpose\n  is not storytelling but demonstrating that \"the buddha-fruit\n  is not accidental.\" The four-part structure (aspiration →\n  practice → salvation → fruition) is the \"cause\" of the \"cause\n  and effect of what is to be believed,\" completing the first\n  assembly's faith structure.\n ·Fazang, Huayan jing tanxuan ji: From the angle of \"karmic\n  causes creating fruition\" — this chapter narratively embodies\n  the \"Indra's Net\" principle. Vairocana's every kalpa of practice\n  mutually reflects every other buddha's practice; there is no\n  \"isolated cause\" nor \"independent fruition.\" Five fascicles of\n  retrospective narration demonstrate \"all buddhas share one\n  path\" (佛佛道同).\n ·Yinshun: The retrospective narrative is historically significant\n  in restoring Vairocana from \"the supreme cosmological buddha\" to\n  \"a buddha who achieved through practice,\" emphasizing that\n  the buddha-fruit is karma-induced, not innate — reflecting the\n  core Mahāyāna conviction that \"the buddha-fruit is attainable.\"\n\n **═══ ASSEMBLY 2: THE HALL OF UNIVERSAL LIGHT (fascicles 12–15, 6 chapters) ═══**\nLocation: the Universal Radiance Hall near the Bodhi Tree site in Magadha\nAssembly Master: Mañjuśrī Bodhisattva\n Theme: **Differentiated cause and effect [Understanding]** — the Ten Faiths\n\n ⑦ *Names of the Thus Come One* (ch. 7) [Tathāgata-nāma]\n Content: The Thus Come One uses infinite names to liberate beings —\n in one world, the Buddha teaches all dharmas through one name;\n in all worlds, the Buddha teaches all dharmas through all names.\n Establishes the \"one is all\" principle of nomenclature.\n ·Chengguan: The core is \"one is all\" — the Buddha's name is not\n  a \"label\" but a direct manifestation of the dharmadhātu. One name\n  contains all names; all names converge into one — the Huayan\n  principle of \"perfect interpenetration\" in the domain of language.\n ·Fazang: \"Name as dharma-gate\" (名号即法门) — each of the Buddha's\n  names is a complete practice system, the condensation of \"fruition\n  virtues\" and the guidance of \"causal practice.\" This provides the\n  Huayan-theoretical basis for the Pure Land tradition's\n  \"name-faith\" practice.\n ·Bhikshu Dharmamitra (2022): Structurally, this chapter opens\n  Assembly 2 (Ten Faiths) under Mañjuśrī's presidency, using\n  \"names\" as the entry point for faith — the most direct gateway\n  to the Dharma, requiring no elaborate theory, only a single\n  moment of faith and acceptance.\n\n ⑧ *The Four Noble Truths* (ch. 8) [Catvāri-ārya-satyāni]\n Content: The Four Noble Truths are reinterpreted from the Avataṃsaka\n perspective — different worlds have different names and contents for\n the truths, yet all converge on one principle. Demonstrates the\n Huayan distinctiveness of \"identity-in-difference without obstruction.\"\n ·Chengguan: The core is \"identity and difference without\n  obstruction\" (同异无碍) — the Four Noble Truths bear different\n  names in different worlds, yet their essence is one. This is\n  the \"six characteristics\" principle of \"perfect interpenetration\n  of identity and difference.\"\n ·Yinshun: This chapter exemplifies the Avataṃsaka's \"absorption\n  and transcendence of Hīnayāna teaching\" — the Four Noble Truths\n  are the Hīnayāna core; the Avataṃsaka does not negate them\n  but \"elevates\" them to the level of the dharmadhātu, showing\n  the Mahāyāna strategy of \"returning from the small to the great.\"\n ·Thomé Fang: The \"identity-in-difference\" principle resembles\n  Hegel's \"concrete universality\" — the Four Noble Truths as\n  \"universality\" (same across worlds), names and contents as\n  \"particularity\" (different per world), unified in the\n  dharmadhātu without one dissolving the other.\n\n ⑨ *Enlightenment through Light* (ch. 9) [Prabhāsvara]\n Content: Vairocana emits light revealing in it all buddha-lands,\n all buddhas, all bodhisattvas, and all sentient beings of the\n ten directions, enabling the assembly to understand that \"whatever\n the buddha-light illuminates is the entirety of the dharmadhātu.\"\n ·Chengguan: \"Light symbolizes wisdom-illumination\" (光表智照) —\n  the buddha-light is not external \"illumination\" but the direct\n  manifestation of prajñā. The worlds, buddhas, and beings appearing\n  in the light are the complete scope of \"what wisdom illuminates.\"\n  This chapter and Chapter 2 are complementary: Ch. 2 is \"the\n  Buddha-body emitting light\" (体起用), Ch. 9 is \"seeing the\n  Dharma within light\" (用中显体).\n ·Thomé Fang: \"The buddha-light is the dharmadhātu itself\" —\n  light does not \"emanate from the Buddha\"; rather, \"the\n  dharmadhātu itself is light.\" The Buddha's emission of light\n  simply allows the dharmadhātu's original luminosity to be \"perceived.\"\n  \"Awakening\" is not acquiring something new but \"waking up\" —\n  one was always in the light, only previously unaware.\n ·Haiyun Jimeng: The \"enlightenment through light\" is not a\n  supernatural experience of \"seeing light\" but an \"awakening\n  of wisdom\" — recognizing in daily life that all states are\n  manifestations of the dharmadhātu. This is the \"principle\"\n  level of awakening, preparing for the \"practice\" level in\n  the following Pure Practices chapter.\n\n ⑩ *The Bodhisattvas' Questions* (ch. 10) [Bodhisattva-paripṛcchā]\n Content: Mañjuśrī and nine Bodhisattvas beginning with Virtuous\n Leader (觉首·财首·宝首·德首·目首·精进首·法首·智首·贤首)\n engage in mutual question-and-answer, discussing the relationship\n between \"mind, buddha, and sentient beings\" and the core doctrines\n of \"dharmatā, conditioned origination, and emptiness-nature.\"\n ·Chengguan: The core is \"mind, buddha, and sentient beings — the\n  three are without difference\" (心佛众生三无差别). The dialogue\n  is not \"one teaching, one learning\" but \"mutual stimulation,\n  mutual illumination\" in equality. The \"clarity\" (明) in the\n  chapter title is prajñā wisdom — the Q&A illuminates the\n  non-difference of mind, buddha, and beings.\n ·Fazang: The Q&A structure is not \"debate\" (争胜) but\n  \"pedagogy\" (显理). Each Q&A corresponds to one of the ten\n  faiths, deepening faith at each step. Mañjuśrī as \"question-\n  master\" does not give a \"standard answer\" but guides each\n  bodhisattva to express their own realized state, embodying the\n  Huayan principle that \"all dharma-gates are inexhaustible.\"\n ·Hisamatsu Shin'ichi: The dialogue pattern transforms the early\n  Indian Buddhist \"debate\" (vāda) tradition: originally used for\n  argumentation, in the Avataṃsaka it becomes \"perfectly\n  interpenetrating wisdom exchange\" — no \"winner or loser,\"\n  only \"mutual reflection.\" This marks the transition from\n  \"debate culture\" to \"harmony culture\" in Buddhism.\n\n ⑪ *Pure Practices* (ch. 11) [Gocara-pariśuddhi]\n Content: Mañjuśrī teaches Virtuous Wisdom Bodhisattva the \"140\n Great Vows\" — from every detail of daily life (dressing, eating,\n walking, sleeping...) arising great vows, transforming all states\n into practice. This is the Avataṃsaka's core classic of \"daily\n life as practice\" and one of the most widely circulated chapters.\n ·Chengguan: \"Everything can become an object of vow\" (一切皆可\n  发愿) — the 140 vows cover every detail from waking to sleeping.\n  The key lies not in each vow's specific object but in the\n  \"spirit of vow\": transforming all states (whether favorable or\n  adverse) into practice materials. This is the concrete operation\n  of \"transforming consciousness into wisdom\" in daily life.\n ·Haiyun Jimeng: The core is \"daily life as practice\" — the 140\n  vows are not ritual to be \"made and forgotten\" but a method of\n  \"reminding oneself at every moment.\" No need for monasticism,\n  meditation, or special settings; every act of穿衣吃饭·行路睡觉\n  can be practice. This is the most direct manifestation of the\n  Avataṃsaka principle of \"not leaving the world for awakening.\"\n ·Thomé Fang: This chapter is the \"paradigm of Huayan practical\n  philosophy.\" Huayan is not \"empty talk\" but has concrete\n  \"practice methods.\" Pure Practices bridges the cosmology\n  (Flower-Treasury World), epistemology (Enlightenment through\n  Light), and ontology (mind-buddha non-difference) of earlier\n  chapters into \"concrete daily-life operations,\" proving that\n  Huayan is a complete system of \"unity of knowledge and action.\"\n ·Thomas Cleary: This chapter profoundly influenced East Asian\n  Buddhism — virtually all schools (Chan, Pure Land, Vinaya,\n  Tiantai, Huayan) cite it as a classic basis for \"daily-life\n  practice.\" Its spirit of \"all states can become objects of vow\"\n  has deeply penetrated Chinese Buddhist practice tradition.\n\n ⑫ *The Virtuous Leader* (ch. 12) [Bhadraśrī]\n Content: The Virtuous Leader Bodhisattva, based on his own realized\n state, explains the virtues and characteristics of the \"Ten Faiths\"\n practice, and the principle of \"mind, buddha, and sentient beings\n — the three are without difference.\" This chapter serves as the\n summary of the Ten Faiths.\n ·Chengguan: This chapter is the \"summary of the Ten Faiths\"\n  (十信总结) — the Virtuous Leader summarizes the practice taught\n  in Chapters 7–11. The name itself is significant: \"Virtuous\"\n  (贤) = the virtuous one of \"initial aspiration\"; \"Leader\" (首) =\n  the head of \"all faiths.\" This bodhisattva represents the\n  perfection of the \"Faith\" position. Chengguan classifies its\n  function as \"concluding what came before and giving rise to\n  what follows.\"\n ·Fazang: \"Virtuous Leader as initial aspiration\" (贤首即初发心)\n  — the state the Virtuous Leader realized is the concrete\n  manifestation of \"at the moment of initial aspiration, one\n  already attains correct enlightenment.\" Fazang emphasizes that\n  \"faith\" is not \"blind belief\" but \"heart of faith\" (信心),\n  a \"genuine knowing and acceptance of the dharmadhātu.\" The\n  ten faiths' completion is measured not by \"how much one believes\"\n  but by \"how deep the faith goes.\"\n ·Haiyun Jimeng: This is the \"perfection of the Faith position\"\n  — though the ten faiths rank lowest among the five stages, faith\n  is not a beginner's exclusive domain but the foundation\n  throughout the entire practice path. Even at the highest stages\n  of Equal Enlightenment and Wondrous Enlightenment, one still\n  needs faith — faith in the dharmadhātu, in sentient beings,\n  in oneself.\n ·Kimura Kiyotaka: The Virtuous Leader chapter has special\n  significance in Huayan intellectual history — the third patriarch\n  Fazang (643–712) was honored as \"Master Virtuous Leader\"\n  (贤首大师), named after this chapter. This implies Fazang\n  self-identified as a practitioner of the \"Faith\" position,\n  aspiring to be \"Virtuous Leader\" — not claiming profundity\n  but exhorting himself with \"initial aspiration,\" embodying\n  the Huayan School's fundamental spirit of \"beginning practice\n  from faith.\"\n\n **═══ ASSEMBLY 3: THE TRĀYASTRIṂŚA HEAVEN (fascicles 16–18, 6 chapters) ═══**\nLocation: the Trāyastriṃśa Heaven (Heaven of the Thirty-Three)\nAssembly Master: Dharma Wisdom Bodhisattva (Fa-hui)\nTheme: **Differentiated cause and effect [Understanding]** — the Ten Abodes\n\n⑬ *Ascending to the Trāyastriṃśa Heaven* (ch. 13)\nContent: The Buddha ascends to the Trāyastriṃśa Heaven with supernatural\npower; the heavenly kings welcome him with boundless offerings. Together with\nthe next chapter, these are the ritual \"ascending–praising\" chapters common\nto each assembly.\n·Chengguan, Huayan jing shu: Interprets this as a \"ritual chapter symbolizing\n  the ascent of the practice-mind\" — the ascent is not a physical movement\n  but a metaphor for the practitioner advancing from the Faith position\n  (symbolized by the ground-level bodhimaṇḍa) to the First Abode\n  (symbolized by the Trāyastriṃśa Heaven), marking a leap in spiritual\n  rank.\n·Fazang, Huayan jing tanxuan ji: \"Ascent of the heaven signifies the\n  elevation of the mind-position\" — the heavenly king's offerings\n  symbolize the \"roots of virtue\" gathered in previous stages, which\n  naturally appear as resources for the new stage. Even seemingly\n  \"ritualistic transition\" chapters serve the structural need of\n  \"continuity of cause and effect.\"\n·Yinshun: The \"heavenly assembly\" narrative reflects early Mahāyāna's\n  literary tradition of \"teaching in the heavens,\" suggesting that the\n  Dharma transcends human limitations and possesses universal, cosmic\n  significance.\n\n Version Correspondence: 80-fascicle ch. 13 | 60-fascicle ch. 8 \"Trāyastriṃśa Heaven\" | Tibetan ch. 14\n\n ⑭ *Hymns in the Trāyastriṃśa Heaven* (ch. 14)\n Content: The bodhisattvas offer verse-hymns praising the Buddha's virtues\n and transfer merit to all beings.\n ·Chengguan: This chapter and the preceding one form the \"ritual pair\"\n   common to each assembly. The hymns function as \"praise that is itself\n   practice\" — in the Indian Buddhist tradition, verse-composition\n   (gāthā) carries contemplative power; praising the Buddha's virtues\n   is simultaneously口业清净 (purification of speech), 意业专注\n   (concentration of mind), and 身业礼拜 (prostration of body).\n ·Fazang: The hymns have a \"transfer of merit\" (pariṇāmanā) function —\n   praising the Buddha's virtues is for the sake of transferring merit\n   to beings, so that those who have not heard the Dharma may hear it,\n   and those who have heard it may deepen their understanding.\n ·Haiyun Jimeng: Verse-hymns are not \"literary exercises\" but a\n   \"teaching through sound\" — the rhythm, melody, and meaning of the\n   verses are unified, constituting a practice method in itself.\n\n Version Correspondence: 80-fascicle ch. 14 | 60-fascicle ch. 9 \"Hymns in the Trāyastriṃśa Heaven\" | Tibetan ch. 15\n\n ⑮ *The Ten Abodes* (ch. 15) [Daśa-vyavasthāna]\n Content: Dharma Wisdom Bodhisattva expounds the \"Ten Abodes\" of the\n bodhisattva path — the Abode of Initial Aspiration, the Abode of\n Cultivating the Ground, the Abode of Practice, the Abode of Noble Birth,\n the Abode of Complete Skillful Means, the Abode of Right Mind, the\n Abode of Non-Retrogression, the Abode of Innocence, the Abode of Dharma\n Prince, and the Abode of Coronation. The Ten Abodes form the foundation\n of \"non-retrogression in rank\" (位不退) on the bodhisattva path — once\n entering the abodes, one no longer retrogresses to the level of an\n ordinary being.\n ·Chengguan: \"The Ten Abodes are the foundation of non-retrogression on\n   the Path\" — vyavasthāna means \"establishment\"; the Ten Abodes are the\n   ten dimensions of \"establishing oneself in the Buddha-Dharma.\" The\n   \"Abode of Initial Aspiration\" is the gateway; the \"Abode of\n   Coronation\" is its perfection. The core function is avivartika\n   (non-retrogression): unlike the Ten Faiths where backsliding is\n   possible, entering the Abodes guarantees no regression.\n ·Fazang: \"The Abode of Initial Aspiration is the head of all practices\"\n   — not merely because it is the first, but because it \"encompasses all\n   nine subsequent abodes.\" Just as a foundation supports all buildings,\n   the \"initial aspiration\" of the First Abode contains the virtues of\n   all ten. Fazang explains through the \"one is all\" framework: one\n   abode is ten abodes; ten abodes are one abode — perfect interpenetration\n   without obstruction.\n ·Yinshun: Compares the Ten Abodes with Hīnayāna ordination — both mark\n   the transition from \"layperson\" to \"practitioner,\" but the Ten Abodes\n   are founded on \"bodhicitta\" (aspiring to buddhahood for all beings),\n   while Hīnayāna ordination is founded on \"renunciant-mind\" (seeking\n   personal liberation). This structural difference underlies the\n   Mahāyāna strategy of \"turning from the small to the great.\"\n\n Version Correspondence: 80-fascicle ch. 15 | 60-fascicle ch. 10 \"Ten Abodes\" | Tibetan ch. 16\n\n ⑯ *The Pure Life* (ch. 16) [Brahmacarya]\n Content: Dharma Wisdom Bodhisattva teaches \"all bodhisattva pure\n practices\" — encompassing the purification of body, speech, and mind,\n emphasizing that \"non-attainment\" (无所得) through emptiness-wisdom is\n the root of the pure life.\n ·Chengguan: \"Non-attainment is the root of the pure life\" — brahmacarya\n   originally means \"pure conduct,\" but the Avataṃsaka gives it a new\n   meaning: not purity through precept-observance alone, but purity\n   through \"using non-attainment as the方便\" (skillful means). One\n   actively practices body-speech-and-mind purification (there IS\n   practice) but is non-attaining regarding results (no attachment to\n   merit). This is the concrete application of prajñā in daily life.\n ·Haiyun Jimeng: This chapter is the \"general program of daily-life\n   practice.\" Though placed after the Ten Abodes, the pure life is\n   \"always available\" — regardless of one's stage, purification of\n   body-speech-and-mind is the perpetual foundation. Haiyun compares\n   it with the Pure Practices chapter (ch. 11): the Pure Practices\n   emphasize \"vow-power\" (transforming states through aspiration),\n   while the Pure Life emphasizes \"non-attainment\" (transcending\n   attachment through emptiness-wisdom) — the two are complementary\n   pillars of Avataṃsaka daily practice.\n ·Yinshun: From the perspective of vinaya studies, the \"pure life\"\n   encompasses the spirit of the bodhisattva precepts — not merely\n   \"refraining from evil\" (śīla-paripāṭi), but \"doing good\"\n   (kuśala-dharma-paripāṭi) and \"benefiting beings\"\n   (sattvārtha-kriyā). The Avataṃsaka extends \"pure life\" from\n   Hīnayāna \"personal purity\" to \"dharmadhātu-purity.\"\n\n Version Correspondence: 80-fascicle ch. 16 | 60-fascicle ch. 11 \"Pure Life\" | Tibetan ch. 17\n\n ⑰ *The Merit of Initial Aspiration* (ch. 17)\n Content: Dharma Wisdom Bodhisattva expounds the merit of a\n bodhisattva's initial aspiration — comparing the merit of initial\n aspiration with that of the Hīnayāna, heretical paths, and Brahma\n kings, demonstrating the incomparable superiority of initial\n aspiration.\n ·Chengguan: \"Initial aspiration encompasses all Buddha-Dharma\" —\n   the core proposition is that \"aspiring to supreme, complete\n   enlightenment immediately encompasses all Buddha-Dharma.\" Initial\n   aspiration is not \"beginning to learn Buddhism\" but \"already\n   containing the entirety of the buddha-fruit.\" Chengguan explains\n   through \"simultaneity of cause and effect\": the \"cause\" of initial\n   aspiration and the \"effect\" of the buddha-fruit are\n   \"simultaneously complete\" in the dharmadhātu — not a linear\n   \"first cause, then effect\" relationship.\n ·Thomé Fang: \"Seeing the infinite within the finite\" — initial\n   aspiration is \"finite\" (one thought-moment of one being), yet\n   the merit it contains is \"infinite\" (all Buddha-Dharma). Fang\n   considers this one of the most profound propositions of Huayan\n   philosophy: the infinite is not \"outside\" the finite but \"within\"\n   it — a single thought of aspiration is the complete manifestation\n   of the dharmadhātu. Fang compares this with Leibniz's monadology:\n   every \"monad\" (initial aspiration) reflects the entire universe\n   (all Buddha-Dharma), but the Avataṃsaka goes further — monads\n   interpenetrate without obstruction, not through \"pre-established\n   harmony\" but through \"one is all, all is one.\"\n ·Haiyun Jimeng: The \"comparison of merit\" is not \"competition\" but\n   \"positioning\" — helping practitioners recognize how extraordinary\n   their initial aspiration is within the entire Buddha-Dharma system.\n   Many practitioners \"sell themselves short,\" thinking they are\n   insignificant; this chapter's purpose is to let them \"know how\n   remarkable they are.\"\n\n Version Correspondence: 80-fascicle ch. 17 | 60-fascicle ch. 12 \"Merit of Initial Aspiration\" | Tibetan ch. 18\n\n ⑱ *Illumination of the Dharma* (ch. 18) [Dharmāloka]\n Content: Dharma Wisdom Bodhisattva expounds the specific methods and\n sequence for studying the \"Ten Abodes,\" and how to advance and\n avoid retrogression after entering them.\n ·Chengguan: \"The sequential study of the Ten Abodes\" — the previous\n   chapter (Ten Abodes) explains \"what the Ten Abodes are\" (essence);\n   this chapter explains \"how to practice them\" (function). \"Dharmāloka\"\n   means \"illumination through wisdom-prajñā\" of practice-methods,\n   providing the bridge from \"knowing\" to \"doing.\" The \"sequence\" here\n   is not linear progression but \"perfect interpenetration\" — each\n   abode's practice contains the virtues of all nine others.\n ·Fazang: \"Methods for advancing after entering the abodes\" — Fazang\n   summarizes the practice-methods as \"three essentials\": understanding\n   (解, grasping the meaning of the Ten Abodes), practice (行,\n   actually cultivating them), and realization (证, directly verifying\n   them). He emphasizes two key aspects: \"advancing\" (向前走,\n   progressing from the first to the final abode) and \"non-retrogression\"\n   (不后退, not losing previously attained virtues). Both are\n   indispensable — only simultaneous advancing and non-retrogression\n   constitutes true \"establishment\" (住).\n ·Yinshun: From the perspective of practice-psychology, the\n   \"illumination of the Dharma\" has a \"therapeutic\" function — each\n   abode's practice-method is designed to address the specific\n   \"obstacles\" that practitioners at that level may encounter. This\n   reflects the Avataṃsaka tradition of \"equal emphasis on\n   understanding and practice.\"\n\n Version Correspondence: 80-fascicle ch. 18 | 60-fascicle ch. 13 \"Illumination of the Dharma\" | Tibetan ch. 19\n\n **═══ ASSEMBLY 4: THE YĀMA HEAVEN (fascicles 19–21, 4 chapters) ═══**\nLocation: the Yāma Heaven (above the Trāyastriṃśa Heaven)\nAssembly Master: Merit Forest Bodhisattva (Kung-te-lin)\nTheme: **Differentiated cause and effect [Understanding]** — the Ten Practices\n\n⑲ *Ascending to the Yāma Heaven* (ch. 19)\nContent: The Buddha ascends to the Yāma Heaven; the heavenly kings\nwelcome and make offerings.\n·Chengguan: Ascending from the Trāyastriṃśa Heaven (Third Assembly,\n  Ten Abodes) to the Yāma Heaven (Fourth Assembly, Ten Practices)\n  symbolizes the practitioner's advance from \"self-benefit\" (ten\n  abodes' non-retrogression in rank) to \"other-benefit\" (ten\n  practices' altruistic activity).\n·Fazang: Each ascent signifies an expansion of \"mind-capacity\" —\n  the Trāyastriṃśa Heaven's capacity is \"self-benefit\"; the Yāma\n  Heaven's capacity is \"other-benefit.\" Ascending is not \"arriving\n  at a new place\" but \"opening a new dimension.\"\n·Haiyun Jimeng: When one shifts from \"personal practice\" to\n  \"benefiting sentient beings,\" one's \"world\" expands accordingly —\n  just as ascending from one heaven to the next reveals ever more\n  expansive vistas.\n\n Version Correspondence: 80-fascicle ch. 19 | 60-fascicle ch. 14 \"Yāma Heaven\" | Tibetan ch. 20\n\n ⑳ *Hymns in the Yāma Heaven* (ch. 20)\n Content: The bodhisattvas offer verse-hymns praising the Buddha.\n ·Chengguan: Functions like ch. 14 but adapted to the Fourth Assembly's\n   theme — the hymns shift from \"faith\" (Third Assembly) to \"practice\"\n   (Fourth Assembly), reflecting \"hymns that vary with the stage.\"\n ·Fazang: The hymns serve a \"concluding-what-came-before and giving-rise-\n   to-what-follows\" function — summarizing the Third Assembly's Ten\n   Abodes and opening the Fourth Assembly's Ten Practices. The hymns\n   correspond to the \"Joyful Practice\" (欢喜行): praising the Buddha's\n   virtues as the expression of \"joy,\" generating \"dharma-joy\" that\n   leads to altruistic activity.\n ·Yinshun: Though structurally identical to ch. 14, the literary quality\n   differs: ch. 14's hymns emphasize \"faith\" (trust in the Buddha's\n   virtues); ch. 20's hymns emphasize \"practice\" (praising the Buddha\n   through one's own cultivation). This reflects the Avataṃsaka's\n   narrative strategy of \"new meaning in every assembly.\"\n\n Version Correspondence: 80-fascicle ch. 20 | 60-fascicle ch. 15 \"Hymns in the Yāma Heaven\" | Tibetan ch. 21\n\n ㉑ *The Ten Practices* (ch. 21) [Daśa-caryā]\n Content: Merit Forest Bodhisattva expounds the \"Ten Practices\" of the\n bodhisattva path — the Joyful Practice, the Beneficent Practice, the\n Practice of Non-Hatred, the Practice of Unceasing Effort, the Practice\n of Undeluded Wisdom, the Practice of Manifesting Goodness, the Practice\n of Non-Attachment, the Practice of Beneficial Dharma, the Practice of\n Truth, and the Practice of Entering the Dharma Realm. The Ten Practices\n represent the unfolding (展开) of altruistic activity on the bodhisattva\n path — the shift from self-benefit to the broad salvation of beings.\n ·Chengguan: \"The Ten Practices are the unfolding of altruistic activity\"\n   — the Ten Abodes emphasize \"self-benefit\" (establishing one's own\n   practice); the Ten Practices emphasize \"other-benefit\" (applying\n   practice to benefit beings). Chengguan reads the ten as a progression\n   \"from interior to exterior\": the Joyful Practice is \"inner\n   dharma-joy\" → the Beneficent Practice is \"outward benefit\" → … →\n   the Practice of Entering the Dharma Realm is the perfection of\n   \"self-and-other non-duality.\" Each practice simultaneously contains\n   all others.\n ·Yinshun: \"The transition from self-benefit to other-benefit\" is one\n   of the most critical \"pivots\" in the Avataṃsaka system. The Ten\n   Abodes' \"non-retrogression\" is \"holding one's ground\"; the Ten\n   Practices' \"altruistic activity\" is \"extending outward.\" Yinshun\n   contrasts this with the Hīnayāna: the Hīnayāna path terminates\n   at the arhatship (self-benefit perfected), with no subsequent\n   \"other-benefit\"; the Mahāyāna Ten Practices make practice\n   \"unceasing\" because \"sentient beings are inexhaustible.\"\n ·Haiyun Jimeng: The Ten Practices are particularly relevant for\n   modern practitioners: the Joyful Practice reminds us \"practice is\n   joyful\" (not asceticism); the Beneficent Practice reminds us\n   \"practice is for others' benefit\" (not selfishness); the Practice\n   of Unceasing Effort reminds us \"practice has no endpoint\" (not\n   \"finish and done\"). The Ten Practices are the Avataṃsaka's best\n   operational guide for \"engaged practice in the world.\"\n\n Version Correspondence: 80-fascicle ch. 21 | 60-fascicle ch. 16 \"Ten Practices\" | Tibetan ch. 22\n\n ㉒ *The Ten Inexhaustible Treasuries* (ch. 22) [Daśa-akṣaya]\n Content: Merit Forest Bodhisattva teaches the \"Ten Inexhaustible\n Treasuries\" — the Treasury of Faith, Treasury of Precepts, Treasury\n of Moral Shame, Treasury of Moral Dread, Treasury of Learning,\n Treasury of Giving, Treasury of Wisdom, Treasury of Mindfulness,\n Treasury of Retention, and Treasury of Eloquence. These ten\n treasuries are the \"reserve supply\" of the bodhisattva's practice,\n ensuring that merit never runs out.\n ·Chengguan: \"The ten treasuries are reserves of merit\" — akṣaya\n   (inexhaustible) means \"the more one draws upon them, the more\n   they expand.\" The structure reads as a complete system \"from faith\n   to eloquence\": Faith is the \"gateway\" (all virtues arise from\n   faith); Eloquence is the \"outlet\" (all virtues are ultimately\n   deployed through eloquence in propagating the Dharma), with the\n   eight intermediate treasuries forming the chain from \"inner\n   cultivation\" to \"outer application.\"\n ·Fazang: \"Faith as the head, Eloquence as the tail\" — the ordering\n   is not arbitrary: Faith comes first because all virtues arise from\n   faith; Eloquence comes last because all virtues culminate in the\n   ability to teach. Fazang highlights the pairing of \"Moral Shame\"\n   (惭, internal self-reflection) and \"Moral Dread\" (愧, external\n   social responsibility) as the Avataṃsaka's distinctive contribution\n   to \"moral psychology\" — together they form the twin engines of\n   \"moral self-awareness.\"\n ·Yinshun: The Ten Inexhaustible Treasuries are a further unfolding of\n   the Six Pāramitās — the Six Pāramitās are \"six dimensions of\n   practice\"; the Ten Treasuries are \"ten reservoirs for sustaining\n   practice.\" Their significance lies in \"sustainability\": bodhisattva\n   practice is not a \"sprint\" (intense but brief) but a \"marathon\"\n   (spanning countless kalpas), requiring \"reserves\" to sustain it.\n\n Version Correspondence: 80-fascicle ch. 22 | 60-fascicle ch. 17 \"Ten Inexhaustible Treasuries\" | Tibetan ch. 23\n\n **═══ ASSEMBLY 5: THE TUṢITA HEAVEN (fascicles 22–33, 3 chapters) ═══**\nLocation: the Tuṣita Heaven (above the Yāma Heaven)\nAssembly Master: Vajra Banner Bodhisattva (Chin-kang-chuang)\nTheme: **Differentiated cause and effect [Understanding]** — the Ten Transferences\n\n㉓ *Ascending to the Tuṣita Heaven* (ch. 23)\nContent: The Buddha ascends to the Tuṣita Heaven; the heavenly kings\nwelcome and make offerings.\n·Chengguan: Ascending from the Yāma Heaven (Fourth Assembly, Ten\n  Practices) to the Tuṣita Heaven (Fifth Assembly, Ten Transferences)\n  symbolizes the advance from \"altruistic activity\" to \"transfer of\n  merit\" — the unification of self-benefit and other-benefit. The\n  Tuṣita Heaven is traditionally Maitreya's abode, suggesting that\n  \"transfer\" is \"future-oriented\" — directing merit toward future\n  beings and the buddha-way.\n·Fazang: The Tuṣita Heaven's \"mind-capacity\" surpasses the Yāma's —\n  the Ten Practices' \"other-benefit\" still maintains a duality\n  (\"I am benefiting you\"); the Ten Transferences' \"transfer\"\n  transcends this duality (the one who transfers, the one to whom\n  one transfers, and the transfer itself are all non-dual in the\n  dharmadhātu). Fazang reads this as a leap \"from duality to\n  non-duality.\"\n·Haiyun Jimeng: Tuṣita means \"contentment\" in Sanskrit, suggesting\n  that the Ten Transferences require a \"content\" mindset — not\n  clinging to \"how much merit I have accumulated\" but transferring\n  it all outward, thereby knowing true contentment.\n\n Version Correspondence: 80-fascicle ch. 23 | 60-fascicle ch. 18 \"Tuṣita Heaven\" | Tibetan ch. 24\n\n ㉔ *Hymns in the Tuṣita Heaven* (ch. 24)\n Content: The bodhisattvas offer verse-hymns praising the Buddha.\n ·Chengguan: Functions like chs. 14 and 20 but under Vajra Banner's\n   presidency — the hymns shift from \"practice\" (Fourth Assembly) to\n   \"transfer\" (Fifth Assembly). The name \"Vajra Banner\" (金刚幢)\n   symbolizes \"unshakable firmness\" — the transferring mind must be\n   as indestructible as vajra.\n ·Fazang: The hymns have an \"encompassing\" (总摄) function — gathering\n   the merits of the Third Assembly (Ten Abodes) and Fourth Assembly\n   (Ten Practices) as resources for \"transfer.\" The hymns correspond\n   to the \"Transfer of Equality with All Buddhes\" (等一切佛回向):\n   praising the Buddha's virtues is \"measuring oneself against the\n   Buddha\" as the standard for one's transfer of merit.\n ·Yinshun: The concept of pariṇāmanā (transfer of merit) existed in\n   early Buddhism, but the Avataṃsaka elevated it to an independent\n   \"stage of practice\" (Ten Transferences), marking an important\n   step in the \"systematization of Mahāyāna practice.\"\n\n Version Correspondence: 80-fascicle ch. 24 | 60-fascicle ch. 19 \"Hymns in the Tuṣita Heaven\" | Tibetan ch. 25\n\n ㉕ *The Ten Transferences* (ch. 25) [Daśa-pariṇāmanā] (~12 fascicles — the\n longest single chapter in the eighty-fascicle text)\n Content: Vajra Banner Bodhisattva expounds the \"Ten Transferences\" of the\n bodhisattva path — the Transfer of Delivering All Beings from the Mark of\n Beings, the Transfer of the Indestructible, the Transfer of Equality with\n All Buddhas, the Transfer of Reaching Everywhere, the Transfer of the\n Treasury of Inexhaustible Merit, the Transfer of Following the Equal\n Roots of Goodness, the Transfer of Following the Equal Contemplation of\n All Beings, the Transfer of the Character of Suchness, the Transfer of\n Liberation Without Bondage, and the Transfer of Entering the Immeasurable\n Dharma Realm. This is the longest chapter (~12 fascicles) in the entire\n Avataṃsaka, expounding how bodhisattvas transfer all accumulated roots\n of goodness toward beings, toward the buddha-way, and toward ultimate\n reality (suchness), achieving \"the smallest root of goodness draws forth measureless\n fruit\" and realizing the dual operation of compassion and wisdom.\n ·Chengguan: \"This chapter is the longest, ~12 fascicles, compassion and\n   wisdom in tandem\" — its exceptional length is not accidental but\n   reflects the complexity of \"transfer\": it requires \"compassion\"\n   (transferring for the sake of beings) and \"wisdom\" (knowing that\n   the one who transfers, the object of transfer, and the act of\n   transfer are all empty). Chengguan reads the ten as a progression\n   \"from marked to unmarked\": the first five are relatively \"marked\"\n   (specific objects of transfer); the last five are increasingly\n   \"unmarked\" (transfer toward suchness and the dharmadhātu).\n ·Thomé Fang: \"Transfer is the interpenetration of the dharmadhātu\"\n   — the essence of transfer is \"dissolving individual merit into the\n   totality of the dharmadhātu.\" It is not \"giving my merit to you\"\n   (still dualistic), but \"my merit was always part of the dharmadhātu\n   total — transfer merely lets it 'return' to its original position.\"\n   This is the Avataṃsaka principle of \"one is all\" operating at the\n   level of practice.\n ·Yinshun: The \"driving force\" of transfer is bodhicitta (the vow to\n   achieve buddhahood for all beings). Transfer without bodhicitta is\n   \"verbal only,\" lacking real power. Yinshun compares the Ten\n   Transferences with the \"Four Right Exertions\" (四正勤) of the\n   Thirty-Seven Wings of Awakening: the Four Right Exertions are\n   personal \"stopping evil and doing good\"; the Ten Transferences are\n   the dharmadhātu-ization of that — extending \"stopping evil and\n   doing good\" from the personal to \"stopping evil and doing good for\n   all beings.\"\n\n Version Correspondence: 80-fascicle ch. 25 | 60-fascicle ch. 20 \"Ten Transferences\" | Tibetan ch. 26\n\n **═══ ASSEMBLY 6: THE PARANIRMITAVAŚAVARTIN HEAVEN (fascicles 34–39, 1 chapter) ═══**\nLocation: the Paranirmitavaśavartin Heaven (the highest of the six\ndesire-heavens)\nAssembly Master: Vajra Treasury Bodhisattva (Chin-kang-tsang)\nTheme: **Differentiated cause and effect [Understanding]** — the Ten Grounds\n\n㉖ *The Ten Grounds* (ch. 26) [Daśa-bhūmi] (~6 fascicles — one of the most\nimportant chapters)\nContent: Vajra Treasury Bodhisattva expounds the \"Ten Grounds\" of the\nbodhisattva path — the Ground of Joy (初地), the Ground of Purity (二地),\nthe Ground of Luminosity (三地), the Ground of Flame-Wisdom (四地),\nthe Ground of Manifestation (五地), the Ground of Going Far (六地),\nthe Ground of Immovability (七地), the Ground of Good Wisdom (八地),\nthe Ground of Dharma Cloud (九地), and the Ground of Wisdom (十地, the\nperfection of the Dharma Cloud). This is one of the most important\nchapters in the entire Avataṃsaka — in India it was already extracted\nand circulated independently as the Daśabhūmika-sūtra, with commentaries\nby Nāgārjuna, Asaṅga, Vasubandhu, and others. The chapter provides the\nmost systematic classic basis for the Mahāyāna \"bodhisattva path,\"\ndetailing each ground's content of practice, elimination of obscurations,\nrealization of truth, and relationship to other stages.\n ·Chengguan: \"The Ten Grounds are the core of Avataṃsaka practice\" —\n   the First Ground (Ground of Joy) is the \"path-seeing position\"\n   (见道位) where the practitioner first directly realizes the\n   dharmadhātu, distinguishing it from the \"approximate realization\"\n   of the Ten Abodes, Ten Practices, and Ten Transferences. Chengguan\n   reads the ten as a progression \"from prajñā to upāya\": Grounds 1–7\n   deepen \"prajñā-wisdom\" (eliminating obscurations and realizing truth);\n   Grounds 8–10 unfold \"upāya-wisdom\" (activating function to benefit\n   beings). The structure of \"one ground eliminates one obscuration and\n   realizes one truth\" is the Avataṃsaka's most refined expression of\n   \"sequential practice.\"\n ·Nāgārjuna, Daśabhūmika-vibhāṣā (Commentary on the Ten Grounds):\n   Nāgārjuna was among the earliest commentators on the Ten Grounds\n   (Sanskrit fragments and complete Tibetan translation survive). He\n   interprets the ten through the lens of \"pāramitā\" — each ground's\n   practice is one dimension of prajñā-pāramitā. Nāgārjuna emphasizes\n   that the \"joy\" of the First Ground is not worldly happiness but\n   the \"dharma-joy\" of first directly experiencing the reality of\n   \"all dharmas are empty.\"\n ·Vasubandhu, Daśabhūmika-sūtra-śāstra (Commentary on the Sūtra of\n   the Ten Grounds, translated into Chinese by Bodhiruci, 10 fascicles):\n   Vasubandhu interprets the Ten Grounds through the lens of\n   \"vijñaptimātra\" (consciousness-only) — each ground's \"elimination\n   of obscurations\" corresponds to the purging of specific \"seeds\"\n   (bīja) in the ālayavijñāna. The \"realization of truth\" at each\n   ground is the process of \"transforming consciousness into wisdom\"\n   (转识成智). This represents a key intersection of Yogācāra and\n   Huayan thought.\n ·Thomé Fang: The philosophical narrative embedded in the ground-names:\n   \"Joy\" (first realization of dharmadhātu) → \"Purity\" (freedom from\n   afflictive obscurations) → \"Luminosity\" (wisdom-light appearing) →\n   \"Flame-Wisdom\" (wisdom-light blazing like fire) → \"Manifestation\"\n   (dharmadhātu reality manifesting) → \"Going Far\" (surpassing all\n   mundane practice) → \"Immovability\" (unmoved by any condition) →\n   \"Good Wisdom\" (attaining the four unobstructed eloquences) →\n   \"Dharma Cloud\" (Buddha-Dharma covering all like clouds) → \"Wisdom\"\n   (perfecting all-knowing wisdom). Fang reads this as a complete\n   philosophical journey \"from ontology to epistemology to praxis.\"\n ·Yinshun: \"The independent circulation of the Ten Grounds chapter in\n   India\" — the Ten Grounds holds a unique position: it is the only\n   chapter among the Avataṃsaka's 39 to be extracted and circulated\n   as an independent scripture (Daśabhūmika-sūtra). Yinshun argues\n   this is because its content (the bodhisattva path's practice-stages)\n   has \"independent practical value\" — even without reading the full\n   Avataṃsaka, the Ten Grounds alone provides a complete \"map of the\n   bodhisattva path.\" The chapter also influenced the Madhyamaka\n   (Nāgārjuna), Yogācāra (Asaṅga, Vasubandhu), and Mantra traditions,\n   making it a common foundation across Mahāyāna schools.\n\n Version Correspondence: 80-fascicle ch. 26 | 60-fascicle ch. 21 \"Ten Grounds\" | Nāgārjuna, Daśabhūmika-vibhāṣā | Tibetan ch. 27\n\n  **═══ ASSEMBLIES 7–8: RETURN TO THE HALL OF UNIVERSAL LIGHT ═══**\nAssemblies 7 and 8 return to the Hall of Universal Light, presenting the\nfinal stages of the path:\n\n ㉗ *The Ten Samādhis* (ch. 27) [Daśa-samādhi]\n Content: Samantabhadra Bodhisattva expounds the \"ten great samādhis\" — the\n Samādhi of Universal Light, the Samādhi of Wondrous Light, the Samādhi of\n Progressively Visiting All Buddha-lands, the Samādhi of Pure Deep-Mind\n Practice, the Samādhi of Knowing the Treasury of Past Adornments, the\n Samādhi of Wisdom-Light Treasury, the Samādhi of Knowing All Worlds'\n Buddha-Adornments, the Samādhi of Beings' Differentiated Bodies, the\n Samādhi of Dharmadhātu-Freedom, and the Samādhi of the Unhindered Wheel.\n **Note: This chapter appears only in the eighty-fascicle text and the\n Tibetan translation; it is absent from the sixty-fascicle text.**\n ·Chengguan, Huayan jing shu: Interprets this chapter as \"ten samādhis\n   as the cause of equality\" (十定是平等因) — the first six assemblies\n   taught \"differentiated cause and effect\" (different stages have\n   different practices); the seventh assembly transitions to \"equal cause\n   and effect\" (all buddhas, all dharmas, all practices are equal). The\n   ten samādhis are the \"cause\" of \"equality,\" using samādhi-power to\n   realize the equality-nature of the dharmadhātu. Chengguan emphasizes\n   the relationship between the ten samādhis and the ten grounds: the\n   grounds are the highest stage of \"practice with effort\" (有功用行);\n   the samādhis mark the beginning of \"effortless practice\" (无功用行).\n ·Haiyun Jimeng: This chapter, absent from the sixty-fascicle text,\n   fills a crucial gap in the sequential path from the ten grounds to\n   the ten superknowledges. Its addition demonstrates the eighty-fascicle\n   compilers' concern for completeness in the practice sequence.\n ·Yinshun: From a philological perspective, this chapter is \"editorial\n   evidence of the eighty-fascicle text's augmentation\" — its presence\n   is direct proof that the eighty-fascicle compilers added material\n   beyond the sixty-fascicle text.\n\n  Version Correspondence: 80-fascicle ch. 27 | **absent from 60-fascicle text** | Tibetan ch. 28 | ⚠️ added in the eighty-fascicle text\n\n ㉘ *The Ten Superknowledges* (ch. 28) [Daśa-abhijñā]\n Content: Samantabhadra Bodhisattva expounds the \"ten superknowledges\"\n (ten transcendental knowledges) — knowledge of others' minds, the\n divine eye, the divine ear, knowledge of past lives, knowledge of the\n future, the divine eye of wisdom, wisdom of past lives, knowledge of\n beings'生死方便, the unhindered divine ear of wisdom, and the\n knowledge of the cessation of all dharmas.\n ·Chengguan, Huayan jing shu: \"Superknowledges depend on samādhi for\n   their arising\" (神通依定而发) — the ten superknowledges are the\n   wisdom-functions arising from the ten samādhis. \"Superknowledge\"\n   (abhijñā) does not mean \"supernatural power\" in the worldly sense\n   but \"the unhindered application of wisdom.\" The arrangement progresses from\n   \"knowing others\" (others' minds) to \"knowing all dharmas\" (cessation).\n ·Fazang, Huayan jing tanxuan ji: \"The ten superknowledges are ten\n   kinds of wisdom\" (十通即十种智慧) — Fazang corresponds the ten\n   superknowledges with \"ten wisdoms,\" emphasizing they are not\n   \"supernatural abilities\" but \"ten kinds of unhindered wisdom.\"\n   The \"unhindered divine ear of wisdom\" (hearing) and \"knowledge of\n   cessation\" (realization) together form the complete wisdom chain\n   \"from hearing to realization.\"\n\n  Version Correspondence: 80-fascicle ch. 28 | 60-fascicle ch. 22 \"Ten Superknowledges\" | Tibetan ch. 29\n\n ㉙ *The Ten Patiences* (ch. 29) [Daśa-kṣānti]\n Content: Samantabhadra Bodhisattva expounds the \"ten patiences\" (ten\n kṣāntis) — the patience of hearing the sound of Dharma, the patience\n of accordance, the patience of the non-arising of dharmas, the patience\n of illusion, the patience of mirage, the patience of dream, the patience\n of echo, the patience of lightning, the patience of transformation, and\n the patience of space. These ten patiences are the key to the bodhisattva's\n achievement of wisdom — from the \"patience of hearing\" (enduring through\n hearing the Dharma) to the \"patience of space\" (penetrating the\n dharmatā like empty space).\n ·Chengguan, Huayan jing shu: \"From the patience of hearing to the\n   patience of space — this is the achievement of wisdom\" (从音声忍到\n   如空忍·是智慧成就). The ten patiences present a progression \"from\n   shallow to deep\": the patience of hearing = wisdom from hearing\n   (śruta-mayī prajñā); the patience of accordance = wisdom from\n   reflection (cintā-mayī prajñā); the patience of non-arising = wisdom\n   from practice (bhāvanā-mayī prajñā). The subsequent six patiences\n   (illusion, mirage, dream, etc.) express \"all dharmas are like\n   illusions\" through ten similes. The patience of space is wisdom's\n   perfection.\n ·Yinshun: \"The relationship between the levels of patience and prajñā\"\n   — kṣānti in Mahāyāna is not merely \"forbearance\" but \"acceptance\n   and abiding in truth.\" Yinshun correlates the ten patience with the\n   eighteen emptinesses of the Prajñāpāramitā, showing the deep\n   connection between the ten patiences and prajñā studies.\n\n  Version Correspondence: 80-fascicle ch. 29 | 60-fascicle ch. 23 \"Ten Patiences\" | Tibetan ch. 30\n\n ㉚ *Immeasurable Numbers* (ch. 30) [Asaṃkhyeya]\n Content: Mind-King Bodhisattva asks the Buddha about the meaning of\n \"asaṃkhyeya\" (immeasurable number), and the Buddha explains the infinite\n numerical series from asaṃkhyeya → amita → aparyāya → asaṃkhyeya →\n … → the inexhaustible. This chapter presents the Avataṃsaka's\n mathematical concept of \"infinity.\"\n ·Chengguan, Huayan jing shu: \"Infinite numerical series expressing the\n   boundlessness of the dharmadhātu\" (无穷数列·表法界无尽) — the\n   mathematical infinite series expresses the dharmadhātu's quality of\n   being inexhaustible. \"Ten\" signifies \"completion\"; \"asaṃkhyeya\"\n   signifies \"inexhaustibility\" — together they form the Avataṃsaka's\n   core numerical philosophy: practice is complete (ten) yet\n   inexhaustible (asaṃkhyeya).\n ·Thomé Fang, Philosophy of the Huayan School: \"The interweaving of\n   mathematics and metaphysics\" — the Avataṃsaka uses the mathematical\n   concept of infinity to express the metaphysical infinite reality\n   (dharmadhātu), a unique approach in world philosophy. Fang compares\n   this with Cantor's transfinite number theory: both layer \"infinity,\"\n   but the Avataṃsaka's purpose is not mathematical proof but using\n   mathematical imagery to express the religious experience of\n   \"dharmadhātu-boundlessness.\"\n\n  Version Correspondence: 80-fascicle ch. 30 | 60-fascicle ch. 24 \"Immeasurable Numbers\" | Tibetan ch. 31\n\n ㉛ *Life Spans of the Thus Come One* (ch. 31) [Āyuṣpramāṇa]\n Content: The Buddha explains that the Thus Come One's life span cannot\n be measured by calculation — in different worlds, buddhas have different\n life spans (some extremely short, like Śākyamuni's eighty years; some\n extremely long), but essentially the \"life span of the Thus Come One\"\n transcends the concept of time, symbolizing the dharmakāya's permanence.\n ·Chengguan, Huayan jing shu: \"The buddha's life span transcends time\n   and space\" (佛寿超越时空) — the core proposition is that the Thus\n   Come One's life span is not \"a segment on a timeline\" (with beginning\n   and end) but \"an eternity transcending time\" (without beginning or\n   end). Chengguan connects this with \"the permanence of the\n   dharmakāya\" — the dharmakāya is the Buddha's \"true body,\" unborn\n   and undying, not within time; the nirmāṇakāya is the \"responsive\n   body,\" with birth and death, within time. The chapter speaks of\n   \"the life span of the dharmakāya,\" not the nirmāṇakāya.\n ·Yinshun: \"The permanence of the dharmakāya and the exhibition of\n   the nirmāṇakāya\" — the \"different life spans of buddhas\" embody\n   the core Mahāyāna conviction that \"the dharmakāya is permanent while\n   the nirmāṇakāya manifests according to beings' faculties.\" This\n   addresses the theological problem of \"where do beings take refuge\n   after the Buddha's parinirvāṇa\": the nirmāṇakāya may pass away,\n   but the dharmakāya is eternally present, never departing from beings.\n\n  Version Correspondence: 80-fascicle ch. 31 | 60-fascicle ch. 25 \"Life Spans of the Thus Come One\" | Tibetan ch. 32\n\n ㉜ *Bodhisattva Abodes* (ch. 32) [Bodhisattva-vihāra]\n Content: Lists the abodes (bodhimaṇḍas) of great bodhisattvas throughout\n the world — Mañjuśrī at \"Mount Clear-and-Cool in the northeast\"\n (Mount Wutai), Samantabhadra at \"Mount Caitika in the east,\"\n Avalokiteśvara at \"Potalaka in the southern sea,\" etc. This chapter\n is an important text for studying the Avataṃsaka's geographical view\n and bodhisattva faith.\n ·Chengguan, Huayan jing shu: \"Bodhisattva abodes are bodhimaṇḍas\"\n   (菩萨住处即道场) — the listed abodes are not \"geographical notes\"\n   but \"symbolic expressions\" (表法). \"Abode\" (vihāra) is read as\n   \"bodhimaṇḍa\" — where a bodhisattva \"abides,\" there the bodhi\n   (enlightenment) is attained.\n ·Yinshun: \"The classical basis for the Mount Wutai faith\" — this\n   chapter's \"Mañjuśrī dwells at Mount Clear-and-Cool in the northeast\"\n   directly promoted Mount Wutai's status as a Buddhist sacred site\n   in China. This geographic description may reflect the compiler's\n   knowledge of Chinese geography, providing a geographic clue for\n   the Khotan compilation thesis.\n ·Haiyun Jimeng: \"The symbolic meaning of Mañjuśrī's bodhimaṇḍa\" —\n   \"Clear-and-Cool\" (清凉) means \"free from afflictive heat\" (离热恼),\n   symbolizing the extinction of the three poisons. Mañjuśrī dwelling\n   at \"Clear-and-Cool Mountain\" signifies that \"wisdom's bodhimaṇḍa\n   is the state free from afflictions.\"\n\n  Version Correspondence: 80-fascicle ch. 32 | 60-fascicle ch. 26 \"Bodhisattva Abodes\" | Tibetan ch. 33\n\n ㉝ *Inconceivable Dharmas* (ch. 33) [Acintya-dharma]\n Content: The Buddha explains that the dharmas realized, the realms\n manifested, and the teachings given by the Thus Come One are all\n inconceivable — beyond the reach of conceptual thought and verbal\n expression, known only through direct realization.\n ·Chengguan, Huayan jing shu: \"Inconceivability means transcending\n   words and concepts\" (不可思议即绝言说) — acintya in the Avataṃsaka\n   has three layers: (1) beyond conceptual reach, (2) beyond verbal\n   expression, (3) known only through direct realization. This is not\n   \"agnosticism\" but \"religious experience transcending reason\" — not\n   \"not knowing\" but \"knowing but unable to articulate.\"\n ·Thomé Fang: \"Religious experience transcending rationality\" — the\n   Avataṃsaka's \"inconceivable\" acknowledges that human reason and\n   language have a \"boundary,\" beyond which lies the \"realizable but\n   unsayable.\" Fang compares this with Wittgenstein's \"unsayable\":\n   both recognize reason's boundary, but the Avataṃsaka provides a\n   practical path for \"transcending the boundary\" (practice →\n   realization), while Wittgenstein remains at \"silence.\"\n\n  Version Correspondence: 80-fascicle ch. 33 | 60-fascicle ch. 27 \"Inconceivable Dharmas\" | Tibetan ch. 34\n\n ㉞ *The Ten Bodies of the Thus Come One* (ch. 34) [Daśakāya]\n Content: Samantabhadra Bodhisattva expounds the \"ten bodies\" (ten types\n of buddha-body) and their adornments — the Body of Enlightenment, the\n Body of Vow, the Emanation Body, the Body of Power-Sustaining, the\n Body of Adorned Marks, the Body of Majestic Authority, the\n Body of Mind-Generated, the Body of Blessed Merit, the Dharmakāya,\n and the Body of Wisdom. Each body has immeasurable marks, \"as many as\n the dust-motes of ten Flower-Treasury World-oceans.\"\n ·Chengguan, Huayan jing shu: \"Ten bodies are ten types of buddha-\n   nature\" (十身即十种佛格) — the ten bodies are not \"ten physical\n   bodies\" but \"ten modes of the buddha's existence.\" They mutually\n   contain each other: one body is ten bodies, ten bodies are one\n   body — perfect interpenetration without obstruction. Chengguan\n   correlates the ten bodies with the \"four dharmadhātus.\"\n ·Fazang, Huayan jing tanxuan ji: \"Marks are the dharmakāya's\n   manifestation\" (相好即法身的显现) — the adorned marks are not\n   \"external decorations\" but \"the natural manifestation of the\n   dharmakāya.\" Each mark is the condensation of immeasurable kalpas\n   of accumulated merit. Using the \"golden lion\" analogy: gold\n   (dharmakāya) is the essence; the lion's marks (ten bodies) are the\n   function — essence and function are non-dual.\n\n  Version Correspondence: 80-fascicle ch. 34 | 60-fascicle ch. 28 \"Ten Bodies of the Thus Come One\" | Tibetan ch. 35\n\n ㉟ *Secondary Marks and Light-Merits of the Thus Come One* (ch. 35) [Anuvyañjana]\n Content: The Buddha explains the light-merits of the Thus Come One's\n \"secondary marks\" (anuvyañjana) — each secondary mark emits immeasurable\n light, within which immeasurable dharmas are preached, saving immeasurable\n beings.\n ·Chengguan, Huayan jing shu: \"Secondary marks are subtle merits\"\n   (随好是微细功德) — anuvyañjana (secondary marks) are the Buddha's\n   \"subtle adornments,\" distinct from the \"major marks\" (mahā-lakṣaṇa,\n   the thirty-two marks). This chapter says \"each secondary mark emits\n   immeasurable light,\" showing that the Buddha's \"subtle merits\" are\n   equally \"inexhaustible\" — not only are the major marks immeasurable,\n   the secondary marks too; not only are the marks immeasurable, the\n   light is immeasurable; not only is the light immeasurable, the\n   dharmas preached within the light are immeasurable.\n ·Haiyun Jimeng: \"Light is the outer manifestation of wisdom\"\n   (光明即智慧的外显) — the \"light\" in this chapter is not physical\n   light but \"wisdom-light\" (prajñā-light, dharmadhātu-light). \"Each\n   secondary mark emits immeasurable light\" means every \"subtle merit\"\n   of the buddha is a \"manifestation of wisdom.\" The buddha has no\n   \"merit without wisdom\" and no \"wisdom without merit\" — the two\n   are one.\n\n  Version Correspondence: 80-fascicle ch. 35 | 60-fascicle ch. 29 \"Secondary Marks and Light-Merits\" | Tibetan ch. 36\n\n ㊱ *Samantabhadra's Practice* (ch. 36) [Samantabhadra-caryā]\n Content: Samantabhadra Bodhisattva expounds the \"practice of\n Samantabhadra\" — the detailed elaboration of the ten great vows\n (Homage to All Buddhas, Praise of the Thus Come One, Making Offerings,\n Confession of Negative Karma, Rejoicing in Merit, Requesting the\n Turning of the Wheel, Requesting the Buddha to Remain, Following the\n Buddha's Practice, Accommodating All Beings, and Transferring All Merit).\n This chapter is the core of the Avataṃsaka's \"practice and vows\" —\n Samantabhadra's ten vows are the general program of Avataṃsaka practice.\n ·Chengguan, Huayan jing shu: \"The ten vows are the general program of\n   Avataṃsaka practice\" (十愿为华严修行总纲) — the first eight\n   assemblies' \"faith and understanding\" (theory) is here transformed\n   into \"practice\" (actual cultivation). The ten vows' structure reads\n   \"from self to other, from cause to effect\": the first five (homage,\n   praise, offerings, confession, rejoicing) are \"self-benefit\";\n   the last five (requesting the wheel, requesting the Buddha to remain,\n   following, accommodating, transferring) are \"other-benefit.\" The\n   final \"transferring all merit\" encompasses everything.\n ·Haiyun Jimeng: \"Samantabhadra's practice is the core of\n   implementation\" (普贤行是实践的核心) — the Avataṃsaka's practice\n   system can be summarized as \"Mañjuśrī's understanding, Samantabhadra's\n   practice.\" \"Accommodating all beings\" (恒顺众生) is the most direct\n   practice of the Avataṃsaka's \"equality view\" — not \"I come to save\n   you\" (condescending) but \"perpetually accommodating\" (following\n   beings' faculties, conditions, and ways), the highest expression of\n   \"selflessness.\"\n ·Yinshun: \"The relationship between Samantabhadra's practice-vows and\n   the Pure Land tradition\" — Samantabhadra's \"transferring all merit\"\n   has a deep connection with the Pure Land practice of \"transferring\n   merit toward rebirth in the Pure Land.\" The final destination of\n   Samantabhadra's vows is rebirth in Amitābha's Pure Land, showing\n   that Huayan and Pure Land are not \"opposed\" but \"Huayan as essence,\n   Pure Land as function.\"\n\n  Version Correspondence: 80-fascicle ch. 36 | 60-fascicle ch. 30 \"Samantabhadra's Practice\" | Tibetan ch. 37\n\n ㊲ *The Manifestation of the Tathāgata* (ch. 37) [Tathāgatotpattisaṃbhava]\n Content: The Buddha explains the causes and conditions of the Thus\n Come One's \"manifestation\" (en turning the dharma-wheel, entering\n parinirvāṇa) — the Thus Come One manifests in the world with\n immeasurable bodies, immeasurable names, and immeasurable skillful\n means, not limited to Śākyamuni alone. This chapter is the conclusion\n of \"equal cause and effect\" — all buddhas are equal, all dharmas\n are equal.\n ·Chengguan, Huayan jing shu: \"The Tathāgata's manifestation is the\n   total revelation of the dharmadhātu\" (如来出现即法界全体的显现)\n   — \"manifestation\" (tathāgatotpattisaṃbhava) is not \"a buddha\n   arising from nothing\" but \"the dharmadhātu revealing itself.\" The\n   \"manifestation\" has three meanings: (1) appearing (enlightenment),\n   (2) turning the wheel (teaching), (3) entering parinirvāṇa\n   (returning to the dharmadhātu). Even \"entering parinirvāṇa\" is\n   not \"disappearing\" but \"returning\" — the Tathāgata has never left\n   the dharmadhātu.\n ·Fazang, Huayan jing tanxuan ji: \"The conclusion of equal cause and\n   effect\" (平等因果的总结) — this chapter concludes the third cycle\n   \"equal cause and effect\": the previous chapters expound the Buddha's\n   \"fruition-virtues\" (marks, light); this chapter expounds the\n   \"causes of manifestation.\" Fazang reads this as the ultimate\n   expression of the Avataṃsaka's core principle: \"the cause encompasses\n   the ocean of fruition; the fruition penetrates the source of the\n   cause\" — cause and fruit mutually contain each other, perfectly\n   interpenetrating.\n\n  Version Correspondence: 80-fascicle ch. 37 | 60-fascicle ch. 31 \"Manifestation of the Tathāgata\" | Tibetan ch. 38\n\n **═══ ASSEMBLY 8: THIRD MEETING AT THE HALL OF UNIVERSAL LIGHT ═══**\n\n ㊳ *Transcending the World* (ch. 38) [Lokottara] (~7 fascicles)\n Content: Universal Wisdom Bodhisattva poses 200 questions to Samantabhadra,\n who responds with 2,000 answers — one question yields ten answers,\n revealing the inexhaustible meaning. Content covers all practice dharmas\n from initial aspiration to final Buddhahood, encompassing the causal\n practice of all five stages (Ten Abodes, Ten Practices, Ten\n Transferences, Ten Grounds, Equal and Wondrous Enlightenment).\n \"Transcending the world\" means: though practicing within the world,\n one is not defiled by it — entering the world to save beings with\n a mind that transcends the world.\n ·Chengguan, Huayan jing shu: \"200 questions, 2000 answers — encompassing\n   all five stages\" (二百问二千答·总摄五位) — this chapter uses the\n   question-and-answer format to provide a comprehensive synthesis of all\n   the Avataṃsaka's practice dharmas. It serves as \"concluding what came\n   before and giving rise to what follows\": summarizing the first seven\n   assemblies' \"faith, understanding, and practice\" and providing the\n   final theoretical preparation for the ninth assembly's \"realization.\"\n ·Yinshun: \"The encyclopedic nature of this chapter\" — 200 questions\n   covering all practice problems from aspiration to Buddhahood, 2,000\n   answers providing ten levels of response for each, totaling 2,000\n   items of practice guidance. Yinshun compares this with the\n   Mahāprajñāpāramitā-śāstra's \"hundred doors of dhyāna-wisdom.\"\n ·Haiyun Jimeng: \"One question yields ten answers — the dharma-gate of\n   inexhaustibility\" (问一答十·无尽法门) — the \"one-to-ten\" ratio is\n   not artificial but reflects the dharmadhātu's nature: every practice\n   question has \"immeasurable layers of response.\" Ten is a \"conventional\n   number\" representing \"completion\"; in reality, it is \"immeasurable\n   answers.\"\n\n  Version Correspondence: 80-fascicle ch. 38 | 60-fascicle ch. 32 \"Transcending the World\" | Tibetan ch. 39\n\n**═══ ASSEMBLY 9: THE JETA GROVE (fascicles 60–80, 1 chapter) ═══**\nLocation: the Jeta Grove in Śrāvastī\nAssembly Masters: Mañjuśrī, Maitreya, and Samantabhadra\nTheme: **Realization of the cause and effect [Realization]** — Entering the\nDharma Realm\n\n㊴ *Entering the Dharma Realm* (ch. 39) [Gaṇḍavyūha] (~21 fascicles, ~¼ of\nthe entire sūtra)\nContent: The longest and most widely circulated chapter. Sudhana, inspired by\nMañjuśrī, sets out on a pilgrimage to visit fifty-three spiritual friends\n(kalyāṇamitra) of all types — kings, ministers, monks, nuns, laymen, laywomen,\nascetics, brāhmaṇas, celestial maidens, young girls — each teaching him their\nown practice. The climax comes when Sudhana visits Maitreya, who opens the\n\"Matrix Adorned with the Splendours of Vairocana\" tower, revealing infinite\nworlds within a single body. Finally, Sudhana merges with Samantabhadra's\nvast body of practice and receives the \"Ten Great Vows.\" This chapter\ntransforms the theoretical teachings of the first eight assemblies into\nconcrete, lived experience — the supreme model of the Avataṃsaka's unity of\ntheory and practice. The fifty-three pilgrimages also demonstrate the Avataṃsaka\n principle that \"anything and anyone can be a spiritual friend.\"\n  ·Chengguan, Huayan jing shu: \"The five-fold structure: Mañjuśrī\n    inspires → Southern pilgrimage → Maitreya opens the treasury →\n    Samantabhadra realizes → entry into the dharmadhātu\" — Sudhana's\n    pilgrimage follows a precise spiritual arc: Mañjuśrī represents\n    \"understanding\" (wisdom-initiation), the fifty-three visits represent\n    \"practice\" (implementation), Maitreya's tower represents \"realization\"\n    (direct perception of the dharmadhātu), and Samantabhadra's ten vows\n    represents \"entry\" (merging with the dharmadhātu). Chengguan emphasizes\n    the symbolic meaning of \"heading south\" — south symbolizes \"light\"\n    (the south is associated with fire, fire symbolizing the light of\n    wisdom); Sudhana heading south means \"advancing toward the light\n    of wisdom.\"\n  ·Yinshun: \"The independent circulation history of this chapter\" — the\n    Gaṇḍavyūha circulated widely as an independent scripture in India.\n    The surviving Sanskrit manuscript (found in Khotan), with its Khotanese\n    colophon, testifies to its transmission across Central Asia. The\n    forty-fascicle version (by Prajñā, 796 CE), consisting solely of\n    this chapter, suggests that the Gaṇḍavyūha alone constitutes a\n    \"complete Avataṃsaka practice text\" — the full path from aspiration\n    to realization — without requiring other chapters.\n  ·Thomé Fang: \"The supreme model of theory-practice unity\" — the first\n    eight assemblies provide \"theory\" (abstract teachings on faith,\n    understanding, and practice); the Gaṇḍavyūha provides \"practice\"\n    (lively, human pilgrimage). The fifty-three spiritual friends span\n    \"kings, ministers, monks,
