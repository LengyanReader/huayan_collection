 nuns, laymen, laywomen, ascetics,\n    brāhmaṇas, celestial maidens, young girls\" — all social classes,\n    all genders, all beliefs — a \"declaration of equality\" unparalleled\n    in world religious history.\n  ·Haiyun Jimeng: \"Anything can be a spiritual friend\" — the fifty-three\n    friends include not only Buddhist practitioners but also ascetics,\n    brāhmaṇas, and even \"heretical seers,\" demonstrating that the\n    Avataṃsaka's criterion for \"spiritual friend\" is not \"faith\" but\n    \"wisdom\" — anyone who guides you deeper into the dharmadhātu,\n    regardless of identity, is your spiritual friend.\n  ·Fazang, Huayan jing tanxuan ji: \"The pilgrimage as inner landscape\n    of the mind\" — Fazang interprets the sequence of fifty-three visits\n    as a progression of \"inner mind-development\": the first twenty\n    friends represent the \"faith\" stage, the middle ten represent the\n    \"abodes, practices, and transferences,\" and the final twenty-three\n    represent the \"grounds, equal-enlightenment, and wondrous-\n    enlightenment.\" The pilgrimage is not external travel but internal\n    unfolding of the mind-ground.\n\n  Version Correspondence: 80-fascicle ch. 39 | 60-fascicle ch. 33 \"Entering the Dharma Realm\" | **40-fascicle text (entire text = this chapter)** | Tibetan ch. 40\n"}, {"title": "四译本品目对照", "title_en": "Comparison of Chapter Divisions Across Four Versions", "body": "华严经在不同译本中品目数不同: 六十华严34品·八十华严39品·藏译45品·梵本(据智俨记录)44品。\n差异主要来自两个原因: (1)某些品目在某些版本中缺失, (2)品目的细分方式不同。\n\n**藏译独有而汉译缺失的品目**:\n·第11品「如来华严品」(Tathāgatāvataṃsaka) — 位于毗卢遮那品之后,\n  如来名号品之前, 阐述佛的华严装饰。\n·第32品「普贤宣说品」(Samantabhadra's Teaching) — 内容与实叉难陀所译\n  《大方广普贤所说经》(T298)相同, 但藏译将其收入华严经本部。\n\n**六十华严缺失·八十华严与藏译共有的品目**:\n·「十定品」(第七会·重会普光明殿, Daśa-samādhi) — 仅见于八十华严与藏译,\n  六十华严无此品（晋译无对应品; 别行本为竺法护译《等目菩萨所问三昧经》）。\n\n**品目细分的差异**:\n六十华严的「卢舍那佛品」(第2品)在八十华严中被分为五品(第2-6品),\n在藏译中被分为九品。同样, 八十华严的「华藏世界品」(第5品)在藏译与\n梵本(据智俨记录)中被分为五章。据慧苑(673-743)记载, 实叉难陀的\n梵文底本中「华藏世界品」原为五章, 实叉难陀在翻译时合为一品。\n", "sources": ["Zhiyan, Kongmu zhang (T45n1867) — records Sanskrit chapter titles", "H.R. Park, 'The Differences and Editing Process of Chapter Divisions' (IBK 62:2, 2014)", "Imre Hamar, 'The History of the Buddhāvataṃsaka-sūtra' (2007:139-167)"], "en_body": "The Avataṃsaka has different chapter counts across versions: 34 chapters in\nthe sixty-fascicle text, 39 in the eighty-fascicle text, 45 in the Tibetan\ntranslation, and 44 in the Sanskrit (according to Zhiyan's record). The\ndifferences stem from two causes: (1) certain chapters are absent in some\nversions, and (2) chapters are divided differently.\n\n**Chapters unique to the Tibetan translation, absent from Chinese**:\n·Ch. 11, \"Chapter on the Tathāgata's Avataṃsaka\" (Tathāgatāvataṃsaka) —\n  placed after the Vairocana chapter and before the Names chapter.\n·Ch. 32, \"Chapter on Samantabhadra's Teaching\" (Samantabhadra's Proclamation)\n  — same content as Śikṣānanda's separate translation T298, but included in\n  the Tibetan Kangyur as part of the Avataṃsaka.\n\n**Chapters absent from the sixty-fascicle text, shared by the eighty-fascicle and Tibetan translations**:\n·\"Chapter on Ten Samādhis\" (Daśa-samādhi; ch. 27 in the 7th assembly at the\n  Hall of Universal Light) — appears in the eighty-fascicle text and the\n  Tibetan translation but not in the sixty-fascicle text (the Jin text has\n  no counterpart; an independent translation is T288).\n\n**Differences in chapter subdivision**:\nThe \"Chapter on Vairocana Buddha\" (ch. 2) of the sixty-fascicle text was\nsplit into five chapters (chs. 2–6) in the eighty-fascicle text and into nine\nchapters in the Tibetan. Similarly, the \"Chapter on the Flower-Treasury World\"\n(ch. 5) of the eighty-fascicle text was divided into five sub-chapters in the\nTibetan and Sanskrit (according to Zhiyan). According to Huīyuàn (673–743),\nŚikṣānanda's Sanskrit base text originally had five sub-chapters, which\nŚikṣānanda combined into one during translation.\n"}, {"title": "五周因果——义理结构", "title_en": "Five Cycles of Cause and Effect — Doctrinal Structure", "body": "澄观(738-839)在《华严经疏》中将三十九品归纳为「五周因果」——\n(1) **所信因果周**[信](第1-6品, 11卷): 说毗卢遮那佛依正庄严, 令众生生信。\n(2) **差别因果周**[解·前半](第7-34品, 31卷): 说十信·十住·十行·十回向·十地·\n等觉·妙觉的修行次第, 因与果有差别(不同的阶位有不同的修行内容)。\n(3) **平等因果周**[解·后半](第35-37品, 约5卷): 说佛的相好·光明·出现,\n因与果平等(一切佛皆同此因·同此果)。\n(4) **成行因果周**[行](第38品, 7卷): 说普贤二千行门, 将理论化为具体的修行。\n(5) **证入因果周**[证](第39品, 21卷): 说善财五十三参, 将修行落实为实际的证入。\n\n五周因果与「信·解·行·证」四分法相对应:\n信(第一周) → 解(第二·三周) → 行(第四周) → 证(第五周)。\n全经由此构成从「听闻生信」→「深入理解」→「付诸实践」→「亲证法界」\n的完整菩萨道修行地图。\n", "sources": ["Chengguan, Huayan jing shu (T35n1735)", "Lingyin Temple, 'How to Divide the Hundreds of Thousands of Characters' (2019)"], "en_body": "Chengguan (738–839) summarized the 39 chapters into \"five cycles of cause\nand effect\" in his *Huayan jing shu* —\n(1) **The cycle of the cause and effect of what is to be believed** [Faith]\n  (chs. 1–6, 11 fascicles): expounding the adornments of Vairocana's\n  environment and body to inspire faith.\n(2) **The cycle of differentiated cause and effect** [Understanding, first\n  half] (chs. 7–34, 31 fascicles): expounding the sequential stages of the\n  Ten Faiths, Ten Abodes, Ten Practices, Ten Transferences, Ten Grounds,\n  Equality-Enlightenment, and Wonderful Enlightenment — cause and effect are\n  differentiated (each stage has its own content).\n(3) **The cycle of equal cause and effect** [Understanding, second half]\n  (chs. 35–37, ~5 fascicles): expounding the Buddha's marks, light, and\n  manifestation — cause and effect are equal (all buddhas share the same\n  cause and the same fruit).\n(4) **The cycle of completing the practice** [Practice] (ch. 38, 7 fascicles):\n  expounding Samantabhadra's 2,000 practices, transforming theory into\n  concrete cultivation.\n(5) **The cycle of realization** [Realization] (ch. 39, 21 fascicles):\n  expounding Sudhana's fifty-three pilgrimages, bringing cultivation to\n  actual realization.\n\nThe five cycles correspond to the fourfold structure of \"faith → understanding\n→ practice → realization\": Faith (cycle 1) → Understanding (cycles 2–3) →\nPractice (cycle 4) → Realization (cycle 5). The entire sūtra thus constitutes\na complete map of the bodhisattva path from \"hearing and generating faith\" →\n\"deep understanding\" → \"putting it into practice\" → \"directly realizing the\ndharmadhātu.\"\n"}, {"title": "表意表法——毗卢遮那与华藏世界", "title_en": "Symbolic Expression — Vairocana and the Ocean of Flower-Treasury Worlds", "body": "(1) **毗卢遮那**(Vairocana) = 法身佛, 非历史佛陀, 而是法界之体——\n「光明遍照」之义, 代表法界真理的遍在性与全照性。\n(2) **华藏世界海** = 毗卢遮那佛的净土, 二十重世界层层叠绕,\n每一世界有微尘数佛刹围绕——这不是物理宇宙的描述,\n而是**事事无碍法界的表法**: 一尘中含法界, 一毛中现无量佛刹。\n(3) **十** = 华严的核心数字表法: 十信·十住·十行·十回向·十地·十玄门·\n十方·十世……「十」代表**圆满**与**无尽**——菩萨道的修行是圆满的、\n无尽的行愿, 非线性的「到达终点」。\n", "sources": ["方立天《华严金师子章校释》(中华书局, 1983)", "Francis Cook, Hua-yen Buddhism: The Jewel Net of Indra (Penn State, 1977)"], "en_body": "(1) **Vairocana** = the dharmakāya Buddha, not a historical buddha but the\nvery substance of the dharmadhātu — his name means \"universal illumination,\"\nrepresenting the pervasiveness and all-illuminating quality of the truth of\nthe dharmadhātu.\n(2) **The Ocean of Flower-Treasury Worlds** (*gandavyūha* — *padmākaragarbha*)\n= the pure land of Vairocana, twenty tiers of worlds stacked layer upon\nlayer, each world encircled by buddha-lands as numerous as dust-motes — this\nis not a description of the physical cosmos but the symbolic expression of\nthe **dharmadhātu of the unimpeded interpenetration of all phenomena**:\nwithin a single mote of dust is contained the dharmadhātu, and in a single\nhair-tip appear countless buddha-lands.\n(3) **Ten** = the core symbolic number of Huayan: the ten faiths, ten\nabodes, ten practices, ten transfers, ten grounds, ten mysterious gates, ten\ndirections, ten times... \"Ten\" signifies **consummation** and **inexhaustibility**\n— the bodhisattva path is a perfect and endless vow-practice, not a linear\n\"arrival at a destination.\"\n"}]}, {"id": "doctrinal", "title": "义学阐释", "title_en": "Doctrinal Interpretation", "icon": "📖", "topics": [{"title": "核心教义体系", "title_en": "The Core Doctrinal System", "body": "(1) **法界缘起** — 一切现象在法界中互依互入, 非孤立的因果链,\n而是全息的法界整体。与「业感缘起」「阿赖耶缘起」「真如缘起」\n并列为大乘佛教四大缘起论, 且为最圆满者。\n(2) **四法界观** — 事法界(现象界)→理法界(真如界)→\n理事无碍法界(真如与现象相即)→事事无碍法界(一切现象互不相碍)。\n此为杜顺→法藏的华严禅观核心。\n(3) **十玄门** — 法藏以十对玄妙的范畴(同时具足·因陀罗网·秘密隐显·\n微细相容·十世隔法·诸藏纯杂·一多相容·诸法相即·唯心回转·托事显法)\n阐明事事无碍的具体展开, 是华严义学的最精密表达。\n(4) **六相圆融** — 总别·同异·成坏——三对六范畴同时具足,\n认识任一事物即含摄全部六相, 是「一即一切」的认识论基础。\n", "sources": ["法藏《华严一乘教义分齐章》(T45n1866)", "法藏《华严金师子章》(T45n1880)", "方立天《华严金师子章校释》(中华书局, 1983)"], "en_body": "(1) **Dharmadhātu conditionality — dependent origination of the\ndharmadhātu** (*fajie yuanqi*) — all phenomena in the dharmadhātu\ninterdepend and interpenetrate; it is not an isolated chain of cause and\neffect but a holographic whole. Together with \"conditioned arising through\nkarmic forces,\" \"conditioned arising from the ālayavijñāna,\" and\n\"conditioned arising from suchness,\" it is numbered among the four great\ntheories of dependent origination in Mahāyāna, and is the most perfect.\n(2) **The contemplation of the four dharmadhātus** — the dharmadhātu of\nphenomena → the dharmadhātu of principle (suchness) → the dharmadhātu of\nthe unimpeded interpenetration of principle and phenomena → the dharmadhātu\nof the unimpeded interpenetration of all phenomena. This is the core of the\nHuayan practice of contemplation from Dushun to Fazang.\n(3) **The Ten Mysterious Gates** (*shi xuan men*) — Fazang uses ten pairs of\nmysterious categories (simultaneous fulfillment, the net of Indra, the\nsecret and hidden, the subtle containing the minute, the ten times separate\nyet interpenetrating, the non-sequestering of all stores, the interpenetration\nof one and many, the mutual identification of all dharmas, the revolution of\nmind only, and the manifestation of the Dharma through particulars) to clarify\nthe concrete unfolding of the unimpeded interpenetration of all phenomena —\nthe most refined expression of Huayan doctrinal learning.\n(4) **The perfect fusion of the six characteristics** (*liu xiang yuanrong*)\n— the three pairs of whole and part, identity and difference, and\nintegration and disintegration are all simultaneously fulfilled; to know any one\nthing is to contain all six characteristics — the epistemological foundation\nof \"one is all.\"\n"}, {"title": "历代祖师的义学贡献", "title_en": "The Doctrinal Contributions of the Successive Patriarchs", "body": "**杜顺(557-640)** — 五教止观·法界观门 → 禅观实践奠基\n**智俨(602-668)** — 搜玄记·孔目章 → 六相·十玄初构\n**法藏(643-712)** — 探玄记·五教章·金师子章 → 五教十宗判教·十玄门完成\n**澄观(738-839)** — 华严经疏·随疏演义钞 → 八十华严科判·三圣圆融\n**宗密(780-841)** — 原人论·禅源诸诠集都序 → 禅教融合·会通儒道\n**李通玄(635-730)** — 新华严经论 → 以易经融会华严·长者系代表\n", "sources": ["CBETA 对应经号见各祖师条目"], "en_body": "**Dushun (557–640)** — *Five Teachings of Calming and Contemplation*\n(*Wu jiao zhiguan*), *Gate of the Contemplation of the Dharmadhātu*\n(*Fajie guan men*) → laid the foundation of contemplative practice.\n**Zhiyan (602–668)** — *Souxuan ji*, *Kongmu zhang* → the initial\nconstruction of the six characteristics and the ten mysterious gates.\n**Fazang (643–712)** — *Tanxuan ji*, *Wujiao zhang*, *Jinshizi zhang*\n→ the completion of the doctrinal classification of the five teachings and\nten schools, and of the ten mysterious gates.\n**Chengguan (738–839)** — *Huayan jing shu*, *Suishu yanyi chao* → the\nstructure (kējiàn) of the eighty-fascicle text and the perfect fusion of the\nthree holy ones.\n**Zongmi (780–841)** — *Yuaren lun*, *Chanyuan zhuquanjii duxu* → the\nfusion of Chan and doctrinal teaching, and the reconciliation with\nConfucianism and Daoism.\n**Li Tongxuan (635–730)** — *Xin Huayan jing lun* → fusing Huayan with the\n*Book of Changes*; the representative of the \"Elder\" (Zhangzhe) line of\ninterpretation.\n"}, {"title": "近现代学术研究", "title_en": "Modern and Contemporary Academic Research", "body": "**中国**: 方东美《华严宗哲学》(1980)、方立天《法藏评传》(2006)、\n吕澂《中国佛学源流略讲》(1979)、魏道儒《中国华严宗通史》(1998)\n**日本**: 镰田茂雄《中国华严思想史の研究》(1965)、\n木村清孝《初期中国华严思想の研究》(1977)、\n平川彰《印度佛教史》(1979)\n**西方**: Francis Cook, *Hua-yen Buddhism: The Jewel Net of Indra* (Penn State, 1977);\nPeter N. Gregory, *Tsung-mi and the Sinification of Buddhism* (Princeton, 1991);\nThomas Cleary, *The Flower Ornament Scripture* (Shambhala, 1993, 全译本);\nImre Hamar (ed.), *Reflecting Mirrors: Perspectives on Huayan Buddhism* (Harrassowitz, 2007)\n", "sources": ["以上著作均可在 Google Scholar / Goodreads / 豆瓣 检索", "[Cleary 全译本 (Shambhala)](https://www.shambhala.com/the-flower-ornament-scripture.html)"], "en_body": "**China**: Thomé H. Fang (Fang Dongmei), *The Philosophy of the Huayan\nSchool* (*Huayan zong zhexue*, 1980); Fang Litian, *A Critical Biography of\nFazang* (*Fazang pingzhuan*, 2006); Lü Cheng, *Brief Lectures on the Origins\nand Development of Chinese Buddhism* (*Zhongguo foxue yuanliu lüejiang*,\n1979); Wei Daoru, *A Comprehensive History of Chinese Huayan* (*Zhongguo\nHuayan zong tongshi*, 1998).\n**Japan**: Kamata Shigeo, *A Study of the History of Chinese Huayan Thought*\n(1965); Kiyotaka Kimura, *A Study of Early Chinese Huayan Thought* (1977);\nHirakawa Akira, *A History of Indian Buddhism* (1979).\n**The West**: Francis Cook, *Hua-yen Buddhism: The Jewel Net of Indra*\n(Penn State, 1977); Peter N. Gregory, *Tsung-mi and the Sinification of\nBuddhism* (Princeton, 1991); Thomas Cleary, *The Flower Ornament Scripture*\n(Shambhala, 1993, complete translation); Imre Hamar (ed.), *Reflecting\nMirrors: Perspectives on Huayan Buddhism* (Harrassowitz, 2007).\n"}]}, {"id": "global_research", "title": "全球华严研究", "title_en": "Huayan Studies Worldwide", "icon": "🌐", "topics": [{"title": "华严学报 (Journal of Huayen Buddhism)", "title_en": "Journal of Huayen Buddhism", "body": "台湾中华民国佛教华严学会于**2011年**创办的华严佛学专业学术半年刊。\nISSN: 2222-6885 · 出版地: 新北市中和区\n主编/推动者: 海云继梦法师(时任华严学会导师·陕西师范大学华严研究所所长)\n已出版至第8期(2014.12), 电子版可在CEPS中文电子期刊服务查阅(覆盖2011.04-2021.06)。\n代表性论文主题: 华严经众生观与十地·佛境界与法界观想·\n澄观《华严法界玄镜》禅修哲学·华严在云南大理的传播·\n宋代三大士图像学·日本华严图像创新·华严思想与现代思潮\n", "links": {"huayenworld": "https://www.huayenworld.org (华严学术中心-学报各期目录与摘要)", "ceps": "CEPS中文电子期刊服务 (2011-2021)", "princeton_catalog": "https://catalog.princeton.edu/catalog/99125426018406421"}, "en_body": "A professional semi-annual academic journal of Huayan Buddhist studies\nfounded in **2011** by the Huayen Buddhist Society of the Republic of China\n(Taiwan). ISSN: 2222-6885 · Place of publication: Zhonghe District,\nNew Taipei City. Editor-in-chief and driving force: Venerable Haiyun Jimeng\n(then spiritual guide of the Huayen Buddhist Society and director of the\nHuayan Research Institute of Shaanxi Normal University). It has published up\nto issue 8 (December 2014); the electronic edition is available through the\nCEPS Chinese Electronic Periodical Service (covering April 2011–June 2021).\nRepresentative paper topics: the Avataṃsaka view of sentient beings and the\nten grounds; the buddha-realm and the visualization of the dharmadhātu;\nthe meditation philosophy of Chengguan's *Huayan Fajie Xuanjing*; the spread\nof Huayan in Dali, Yunnan; the iconography of the three great sages in the\nSong dynasty; innovation in Japanese Huayan iconography; and Huayan thought\nin dialogue with modern currents of thought.\n"}, {"title": "国际华严研究关键著作", "title_en": "Key Works in International Huayan Studies", "body": "(1) **Robert M. Gimello & Peter N. Gregory (eds.), *Studies in Ch'an and Hua-yen***\nUniversity of Hawai'i Press, 1983. ISBN 978-0824808351\n开创性论文集, 含Gimello论李通玄·Gregory论宗密判教等。\n(2) **Imre Hamar (ed.), *Reflecting Mirrors: Perspectives on Huayan Buddhism***\nHarrassowitz Verlag, 2007. ISBN 978-3447055093\n欧洲华严研究的里程碑式论文集, 含12篇英文论文覆盖华严义学·历史·东亚传播。\n(3) **Francis H. Cook, *Hua-yen Buddhism: The Jewel Net of Indra***\nPenn State University Press, 1977. ISBN 978-0271021904\n西方第一本系统介绍华严宗的英文专著, 以因陀罗网为核心意象。\n(4) **Peter N. Gregory, *Tsung-mi and the Sinification of Buddhism***\nPrinceton University Press, 1991. ISBN 978-0691073735\n华严五祖宗密的最权威英文研究, 获美国宗教学会图书奖。\n(5) **Thomas Cleary, *The Flower Ornament Scripture: A Translation of the Avatamsaka Sutra***\nShambhala, 1993. ISBN 978-0877739401\n华严经英文全译本(据八十华严), 至今仍是英语世界最完整译本。\n(6) **Lancaster, Lewis R. & Sung-bae Park (eds.), *The Korean Buddhist Canon: A Descriptive Catalogue***\nUniversity of California Press, 1979. 韩国大藏经目录学基础, 含华严经在韩国的流传与版本记录。\n(7) **Robert E. Buswell Jr. (ed.), *Religions of Korea in Practice***\nPrinceton University Press, 2007. 含韩国华严宗实践研究专章。\n(8) **James Robson, *Power of Place: The Religious Landscape of the Southern Sacred Peak (Nanyue 南岳) in Medieval China***\nOxford University Press, 2009. 含华严宗在南岳的传播与地方化研究。\n", "en_body": "(1) **Robert M. Gimello & Peter N. Gregory (eds.), *Studies in Ch'an and Hua-yen*** —\nUniversity of Hawai'i Press, 1983. ISBN 978-0824808351. A pioneering\ncollection of essays, including Gimello on Li Tongxuan and Gregory on\nZongmi's doctrinal classification, among others.\n(2) **Imre Hamar (ed.), *Reflecting Mirrors: Perspectives on Huayan Buddhism*** —\nHarrassowitz Verlag, 2007. ISBN 978-3447055093. A landmark collection of\nEuropean Huayan studies, containing twelve English papers covering Huayan\ndoctrine, history, and East Asian transmission.\n(3) **Francis H. Cook, *Hua-yen Buddhism: The Jewel Net of Indra*** —\nPenn State University Press, 1977. ISBN 978-0271021904. The West's first\nsystematic English monograph on the Huayan school, taking Indra's net as its\ncentral image.\n(4) **Peter N. Gregory, *Tsung-mi and the Sinification of Buddhism*** —\nPrinceton University Press, 1991. ISBN 978-0691073735. The most authoritative\nEnglish study of Zongmi, the fifth patriarch of Huayan; winner of an American\nAcademy of Religion book award.\n(5) **Thomas Cleary, *The Flower Ornament Scripture: A Translation of the\nAvatamsaka Sutra*** — Shambhala, 1993. ISBN 978-0877739401. A complete English\ntranslation of the Avataṃsaka Sūtra (from the eighty-fascicle text) — to this\nday the most complete rendering in the English-speaking world.\n(6) **Lancaster, Lewis R. & Sung-bae Park (eds.), *The Korean Buddhist Canon: A Descriptive Catalogue*** —\nUniversity of California Press, 1979. A foundational catalog of the Korean\nBuddhist canon, including records of the Avataṃsaka Sūtra's transmission and\nversions in Korea.\n(7) **Robert E. Buswell Jr. (ed.), *Religions of Korea in Practice*** —\nPrinceton University Press, 2007. Contains a dedicated chapter on Korean Huayan\n(Hwaŏm) Buddhist practice.\n(8) **James Robson, *Power of Place: The Religious Landscape of the Southern\nSacred Peak (Nanyue 南岳) in Medieval China*** — Oxford University Press, 2009.\nIncludes research on the transmission and localization of the Huayan school at\nMount Nanyue.\n"}, {"title": "国际学术期刊中的华严研究", "title_en": "Huayan Studies in International Academic Journals", "body": "华严研究散见于以下国际期刊而非集中于单一刊物——\n**Journal of the International Association of Buddhist Studies**:\nGregory, \"The Teaching of Men and Gods: The Doctrinal and Social Basis of Lay Buddhist Practice in Hua-yen\"\n**Journal of Chinese Philosophy**: Imre Hamar, \"Interpretation of Yogācāra Philosophy in Huayan Buddhism\" (2010)\n**Philosophy East and West**: Nicholaos Jones, \"The Architecture of Fazang's Six Characteristics\" (2019)\n**Hualin International Journal of Buddhist Studies** (华林国际佛学学刊): 华严研究多语论文\n**Journal of Global Buddhism**: Hammerstrom, \"Avataṃsaka Transnationalism in Modern Sinitic Buddhism\" (2016)\n**Korean Hwaŏm 研究**: 《普照思想》(Pojo sasang)·《韩国佛教学》(Han'guk Pulgyohak) 大量刊载知讷·义湘·均如等韩国华严祖师研究\n**日本华严/华厳研究**: 《印度学佛教学研究》·《东方学报》·《仏教学研究》 刊载镰田茂雄·木村清孝·伊藤瑞叡等论文\n**Chinese Buddhist Studies**: 《世界宗教研究》·《佛学研究》·《中国哲学史》 刊载魏道儒·王颂·邱高兴·张文良等当代学者论文\n**Journal of the International Association of Tibetan Studies**: 藏文华严经(Toh44)校勘与翻译研究\n**Annual of the Society for the Study of Religion** (日本宗教学会年報): 华严与日本佛教思想研究\n**Religions** (MDPI): 2025-2026年多篇华严研究论文\n", "en_body": "Huayan research is scattered across the following international journals\nrather than concentrated in a single periodical —\n**Journal of the International Association of Buddhist Studies**:\nGregory, \"The Teaching of Men and Gods: The Doctrinal and Social Basis of Lay Buddhist Practice in Hua-yen\"\n**Journal of Chinese Philosophy**: Imre Hamar, \"Interpretation of Yogācāra Philosophy in Huayan Buddhism\" (2010)\n**Philosophy East and West**: Nicholaos Jones, \"The Architecture of Fazang's Six Characteristics\" (2019)\n**Hualin International Journal of Buddhist Studies**: multilingual papers on Huayan\n**Journal of Global Buddhism**: Hammerstrom, \"Avataṃsaka Transnationalism in Modern Sinitic Buddhism\" (2016)\n**Korean Hwaŏm studies**: journals such as *Pojo sasang* and *Han'guk\nPulgyohak* carry many studies of Korean Huayan patriarchs such as Chinul,\nŬisang, and Kyunyŏ.\n**Japanese Kegon studies**: journals such as *Indogaku Bukkyōgaku kenkyū*\n(Journal of Indian and Buddhist Studies), *Tōhō gakuhō*, and *Bukkyōgaku\nkenkyū* carry papers by Kamata Shigeo, Kiyotaka Kimura, Itō Zuiei, and others.\n**Chinese Buddhist Studies**: *World Religions Research* (*Shijie zongjiao\nyanjiu*), *Buddhist Studies* (*Foxue yanjiu*), and *History of Chinese\nPhilosophy* (*Zhongguo zhexue shi*) publish papers by contemporary scholars\nsuch as Wei Daoru, Wang Song, Qiu Gaoxing, and Zhang Wenliang.\n**Journal of the International Association of Tibetan Studies**: studies on\nthe collation and translation of the Tibetan Avataṃsaka (Toh44).\n**Annual of the Society for the Study of Religion** (Japan): research on Huayan\nand Japanese Buddhist thought.\n**Religions** (MDPI): multiple Huayan studies papers in 2025-2026.\n"}, {"title": "东亚华严研究重镇", "title_en": "Major Centers of Huayan Studies in East Asia", "body": "**中国**: 陕西师范大学华严研究所(海云继梦曾任所长)·南京大学·复旦大学·北京大学·中国人民大学·中国社会科学院·浙江大学·中山大学\n**台湾**: 中华民国佛教华严学会·华严专宗学院·华严莲社(贤度法师)·法鼓文理学院·佛光大学·慈济大学·玄奘大学\n**日本**: 大谷大学(Otani)·龙谷大学(Ryukoku)·东京大学·京都大学人文科学研究所·驹泽大学·立正大学·东北大学\n**韩国**: 东国大学(Dongguk)·中央僧伽大学·普照思想研究院·海印寺教学院·全州大学\n**欧美**: University of Hawai'i·Stanford·Harvard·Columbia·SOAS(London)·Eötvös Loránd(Budapest, Hamar所在)·UC Berkeley·Yale·Princeton·Oxford·Cambridge\n**南亚/东南亚**: University of Calcutta·University of Delhi·Mahachulalongkornrajavidyalaya University(泰国)·University of the Philippines\n", "en_body": "**China**: Huayan Research Institute of Shaanxi Normal University (Haiyun\nJimeng once served as its director) · Nanjing University · Fudan University ·\nPeking University · Renmin University of China · Chinese Academy of Social\nSciences · Zhejiang University · Sun Yat-sen University\n**Taiwan**: Huayen Buddhist Society of the Republic of China · Huayan\nMonastic Institute (Huayan College) · Huayan Lotus Society (Venerable\nXiandu) · Dharma Drum Graduate School of Humanities · Fo Guang University ·\nTzu Chi University · Hsuan Chuang University\n**Japan**: Ōtani University · Ryukoku University · University of Tokyo ·\nInstitute for Research in Humanities, Kyoto University · Komazawa\nUniversity · Risshō University · Tōhoku University\n**Korea**: Dongguk University · Jung-ang Sangha University · National\nInstitute of Bojo Thought · Haein-sa Monastic Academy · Chonbuk National\nUniversity\n**Europe and America**: University of Hawai'i · Stanford · Harvard ·\nColumbia · SOAS (London) · Eötvös Loránd (Budapest, where Hamar is based) ·\nUC Berkeley · Yale · Princeton · Oxford · Cambridge\n**South and Southeast Asia**: University of Calcutta · University of Delhi ·\nMahachulalongkornrajavidyalaya University (Thailand) · University of the\nPhilippines\n"}, {"title": "华严经学研究方法论", "title_en": "Research Methodologies in the Academic Study of the Avataṃsaka Sūtra", "body": "现代华严经学研究的五个主要进路:\n(1) **历史文献学进路**: 文本校勘·成经史重构·译本比较(印顺·木村清孝·平川彰)\n(2) **哲学义理学进路**: 法界缘起·四法界·六相十玄的逻辑结构与哲学意涵(Francis Cook·方立天·Hamar)\n(3) **跨文化/跨学科进路**: 华严与系统论·全息论·AI神经网络的对话(Capra·Varela·环保伦理学)\n(4) **比较宗教学进路**: 华严与基督教·印度教·伊斯兰教神秘主义的比较研究(Nakamura Hajime·Hajime Nakamura·Wayne Teasdale)\n(5) **社会历史学进路**: 华严宗的制度史·经济史·政治影响力研究(严耕望·陈寅恪·Tang Yongtong)\n五种进路互补——历史文献学提供事实基础, 哲学义理学展释义理深度,\n跨学科进路开拓当代对话空间, 比较宗教学拓展全球视野, 社会历史学揭示制度背景。\n", "en_body": "Five main approaches in modern academic study of the Avataṃsaka Sūtra:\n(1) **Historical-philological approach**: textual criticism, reconstruction\nof the history of the sūtra's formation, and comparison of translations\n(Yinshun, Kiyotaka Kimura, Hirakawa Akira).\n(2) **Philosophical-doctrinal approach**: the logical structure and\nphilosophical import of dharmadhātu conditionality, the four dharmadhātus,\nand the six characteristics and ten mysterious gates (Francis Cook, Fang\nLitian, Hamar).\n(3) **Cross-cultural and interdisciplinary approach**: dialogue between Huayan\nand systems theory, holographism, and AI neural networks (Capra, Varela,\nenvironmental ethics).\n(4) **Comparative religion approach**: comparative studies of Huayan with\nChristianity, Hinduism, and Islamic mysticism (Nakamura Hajime, Wayne\nTeasdale).\n(5) **Socio-historical approach**: institutional history, economic history,\nand political influence of the Huayan school (Yan Gengwang, Chen Yinke,\nTang Yongtong).\nThe five approaches are complementary — the historical-philological\napproach supplies the factual foundation, the philosophical-doctrinal\napproach unfolds the depth of the doctrine, the interdisciplinary\napproach opens up a space for contemporary dialogue, the comparative\nreligion approach expands global horizons, and the socio-historical\napproach reveals the institutional context.\n"}]}, {"id": "dharma_teachers", "title": "教内华严思想与修行", "title_en": "Huayan Thought and Practice within Buddhist Traditions", "icon": "🙏", "topics": [{"title": "海云继梦法师·华严思想体系", "title_en": "Venerable Haiyun Jimeng: The Huayan Thought System", "body": "海云继梦法师(1950-)，当代台湾华严宗代表人物，大华严寺创办人。\n「九九華嚴」结构诠释：将《八十华严》(前59卷) +《四十华严》(后40卷) = 「九九華嚴」，\n形成「理行圆融」的整体架构——八十华严为「理」(思想基础)，四十华严为「行」(实修行愿)。\n核心著作: 《九九華嚴玄談》5册(空庭书苑, 2026)·《华严经导读》系列·《华严思想的承先与启后》·《探玄記懸談講記》。\n修行体系: 提出「修行蓝图」三阶段(资粮道→加行道→见道→修道→无学道)，\n强调华严经是「完整的生命改造工程手册」。\nYouTube频道: @huayen-world，系统讲授华严经导读·九九華嚴·禅观法要·实修心要。\n学术贡献: 推动华严学与现代学术的对话，创办华严学会与华严学报，促进国际华严研究。\n", "en_body": "Venerable Haiyun Jimeng (1950–), contemporary representative of Taiwanese\nHuayan Buddhism, founder of the Great Huayan Monastery. \"Nine-Nine Huayan\"\nstructural interpretation: combining the *eighty-fascicle Avataṃsaka* (first\n59 fascicles) plus the *forty-fascicle Avataṃsaka* (last 40 fascicles) =\n\"Nine-Nine Huayan,\" forming an integrated framework of the \"perfect fusion\nof principle and practice\" — the eighty-fascicle text is the \"principle\" (the\nintellectual foundation), and the forty-fascicle text is the \"practice\"\n(actual practice and vows). Core works: *Jiujiu Huayan Xuantan*, 5 volumes\n(Kongting College of Buddhist Studies, 2026), *Avataṃsaka Sūtra Guide*\nseries, *Huayan Thought: Inheriting the Past and Opening the Future*, and\n*Lectures on the Xuantanji*. Practice system: proposes a three-stage\n\"Practice Blueprint\" (resource path → preparation path → seeing path →\ncultivation path → no-learning path), emphasizing that the Avataṃsaka Sūtra\nis \"a complete manual for the engineering of transforming one's life.\"\nYouTube channel: @huayen-world, systematically teaching Avataṃsaka Sūtra\nguides, Nine-Nine Huayan, Chan contemplation essentials, and practical\ncultivation essentials. Academic contributions: promoting dialogue between\nHuayan studies and modern academia, founding the Huayen Buddhist Society and\nthe Journal of Huayen Buddhism, advancing international Huayan research.\n"}, {"title": "贤度法师·华严专宗学院", "title_en": "Venerable Xiandu: Huayan Monastic Institute", "body": "贤度法师(Bhiksuni Xiandu, 1937-)，华严莲社住持，华严专宗学院院长，\n智光老和尚法孙，致力于华严义学的学院化研究与教学。\n代表作: 《华严经讲义》系列·《华严学概论》。\n学术贡献: 对华严经的「七处九会」结构、「信解行证」四分科判、以及华严判教体系有系统性的现代阐述。\n其讲记注重文献学考辨与修行实践的结合，为当代学院化的华严义学研究提供了重要范本。\n华严专宗学院: 位于台北，是华严宗的专修学院，系统教授华严经·华严义学·华严修行。\n", "en_body": "Venerable Xiandu (Bhikṣuṇī Xiandu, 1937–), abbess of the Huayan Lotus\nSociety (Huayan Lianshe) and president of the Huayan Monastic Institute\n(Huayan College), is a dharma-grandson of the Elder Zhiguang, devoted to\nthe academic study and teaching of Huayan doctrine. Representative works:\n*Lectures on the Avataṃsaka Sūtra* series and *An Introduction to Huayan\nStudies*. Academic contributions: systematic modern expositions of the\n\"seven places and nine assemblies\" structure, the four-part structure of\n\"faith, understanding, practice, and realization,\" and the Huayan doctrinal\nclassification system. Her lecture notes combine philological investigation\nwith practice, offering an important model for the contemporary academic\nstudy of Huayan doctrine. The Huayan Monastic Institute: located in Taipei,\na specialized institute for Huayan studies, systematically teaching the\nAvataṃsaka Sūtra, Huayan doctrine, and Huayan practice.\n"}, {"title": "慈舟法师·华严行法研究", "title_en": "Venerable Cizhou: Huayan Practice Studies", "body": "慈舟法师(1877-1958)，近代华严宗高僧，持松法师弟子，华严宗第42世传人。\n代表作: 《华严经普贤行愿品讲义》·《华严经疏钞演讲集》。\n学术贡献: 强调华严经的修行实践，将华严义理与念佛·持咒·禅修相结合，\n提出「华严念佛」的修行体系，对近现代华严修行有重要影响。\n弟子传承: 弟子贤度法师继承其华严法脉，成为华严莲社第三代住持。\n", "en_body": "Venerable Cizhou (1877–1958), modern Huayan patriarch, disciple of Venerable\nChisong, 42nd generation lineage holder of the Huayan school. Representative\nworks: *Lectures on the Samantabhadra Chapter of the Avataṃsaka Sūtra* and\n*Lectures on the Avataṃsaka Sūtra Commentary*. Academic contributions:\nemphasizing the practical cultivation of the Avataṃsaka Sūtra, combining\nHuayan doctrine with Buddha-recitation, mantra recitation, and meditation\npractice, proposing a \"Huayan Buddha-recitation\" system of cultivation that\nhad significant influence on modern Huayan practice. Lineage transmission:\ndisciple Venerable Xiandu inherited his Huayan dharma lineage, becoming the\nthird-generation abbess of the Huayan Lotus Society.\n"}, {"title": "太虚大师·华严判教思想", "title_en": "Master Taixu: Huayan Doctrinal Classification", "body": "太虚大师(1890-1947)，近代佛教改革运动领袖，对华严判教有独到见解。\n在《整理僧伽制度论》·《法相唯识学》等著作中，对华严宗的判教体系提出批判性反思。\n核心观点: 主张「八宗平等」，反对将华严宗判为最高，认为各宗各有其殊胜。\n对华严与唯识的关系有深入分析，提出「法界圆觉」与「唯识变现」的互补性。\n学术贡献: 推动近代佛教的理性化研究，对华严宗的历史地位有客观评价。\n", "en_body": "Master Taixu (1890–1947), leader of the modern Buddhist reform movement,\noffered unique perspectives on Huayan doctrinal classification. In works\nsuch as *On the Reorganization of the Saṅgha* and *Yogācāra Studies*, he\nproposed critical reflections on the Huayan school's classification system.\nCore viewpoint: advocating \"equality of the eight schools,\" opposing the\nplacement of the Huayan school as the highest, believing each school has its\nown excellence. In-depth analysis of the relationship between Huayan and\nYogācāra, proposing the complementarity of \"dharmadhātu perfect\nenlightenment\" and \"consciousness-only transformation.\" Academic\ncontributions: promoting rationalized study of modern Buddhism, providing\nobjective evaluation of the historical status of the Huayan school.\n"}, {"title": "印顺法师·华严经文献学研究", "title_en": "Venerable Yinshun: Avataṃsaka Sūtra Philological Studies", "body": "印顺法师(1906-2005)，台湾佛教导师，当代最重要的佛教思想家之一。\n在《初期大乘佛教之起源与开展》第十三章「华严法门」中，从文献学角度分析华严经的形成过程。\n核心观点: 华严经是「从单品到大集」的渐进编纂过程，非一次性成书。\n强调华严经与般若经·法华经·涅槃经等大乘经典的关联性。\n学术贡献: 从佛教思想史角度还原华严经的形成过程，为华严经文献学研究奠定基础。\n其他相关著作: 《印度之佛教》·《中国禅宗史》等对华严宗有间接论述。\n", "en_body": "Venerable Yinshun (1906–2005), Taiwanese Buddhist master, one of the most\nimportant modern Buddhist thinkers. In Chapter 13 \"The Huayan Dharma Gate\"\nof *The Origins and Development of Early Mahāyāna Buddhism*, he analyzes\nthe formation process of the Avataṃsaka Sūtra from a philological\nperspective. Core viewpoint: the Avataṃsaka Sūtra underwent a gradual\nprocess of compilation \"from individual scriptures to a great collection,\"\nnot composed in a single instance. Emphasizes the connections between the\nAvataṃsaka Sūtra and the Prajñāpāramitā, Saddharmapuṇḍarīka, and\nMahāparinirvāṇa sūtras. Academic contributions: reconstructing the\nformation process of the Avataṃsaka Sūtra from the perspective of Buddhist\nintellectual history, laying the foundation for Avataṃsaka Sūtra\nphilological studies. Other related works: *Indian Buddhism* and *History\nof Chinese Chan Buddhism* contain indirect discussions of the Huayan school.\n"}, {"title": "近现代华严修行传承", "title_en": "Modern and Contemporary Huayan Practice Lineages", "body": "近现代华严修行传承的主要脉络:\n(1) **月霞系**(1861-1917): 月霞法师·慈舟法师·应慈法师→华严宗复兴的重要力量\n(2) **华严莲社系**(1949-): 智光老和尚→贤度法师→华严专宗学院·学院化华严修行\n(3) **大华严寺系**(1980-): 海云继梦法师→九九華嚴·修行蓝图·国际化华严传播\n(4) **日本华严系**: 明惠上人(1173-1232)中兴→当代日本华严宗修行传统\n(5) **韩国华严系**: 知讷(1158-1210)→高丽华严禅修行传统\n各传承在修行方法上各有侧重，但都以华严经为根本经典。\n", "en_body": "The main lineages of modern and contemporary Huayan practice:\n(1) **Yuexia lineage** (1861–1917): Venerable Yuexia → Venerable Cizhou →\nVenerable Yingci → important force in the revival of the Huayan school.\n(2) **Huayan Lotus Society lineage** (1949–): Elder Zhiguang → Venerable\nXiandu → Huayan Monastic Institute → academic Huayan practice.\n(3) **Great Huayan Monastery lineage** (1980–): Venerable Haiyun Jimeng →\nNine-Nine Huayan → Practice Blueprint → international Huayan propagation.\n(4) **Japanese Kegon lineage**: Myōe Shōnin (1173–1232) revival →\ncontemporary Japanese Kegon practice tradition.\n(5) **Korean Hwaŏm lineage**: Chinul (1158–1210) → Goryeo Hwaŏm Chan\npractice tradition.\nEach lineage has its own emphasis in practice methods, but all take the\nAvataṃsaka Sūtra as their fundamental scripture.\n"}]}, {"id": "textual_studies", "title": "华严经文献学研究", "title_en": "Textual Studies of the Avataṃsaka Sūtra", "icon": "📜", "topics": [{"title": "梵文华严经本研究", "title_en": "Sanskrit Manuscript Studies of the Avataṃsaka Sūtra", "body": "梵文华严经本的研究现状:\n(1) **现存梵本**: 主要为单品残本，如《十地经》(Daśabhūmika Sūtra)、《入法界品》(Gaṇḍavyūha)等。\n(2) **重要抄本**: 尼泊尔写本(11-12世纪)、于阗写本(部分)、西藏梵夹写本。\n(3) **校勘成果**: Sylvain Lévi校订《十地经》(Journal Asiatique, 1907-1908)、\n立花俊道校订《华严经梵文残卷》(大正大学, 1930)、\n日本印度学佛教学会《梵文华严经》系列校订。\n(4) **学术意义**: 梵本校勘为华严经的文本形成史提供关键证据，揭示从印度单品到于阗大集的编纂过程。\n(5) **84000项目**: 正在进行梵文华严经的现代校勘与英译，已完成部分品目。\n", "en_body": "Current status of Sanskrit manuscript studies of the Avataṃsaka Sūtra:\n(1) **Extant Sanskrit texts**: mainly fragmentary individual scriptures, such\nas the *Daśabhūmika Sūtra* and the *Gaṇḍavyūha*.\n(2) **Important manuscripts**: Nepalese manuscripts (11th–12th centuries),\nKhotanese manuscripts (partial), Tibetan dbar-tscha manuscripts.\n(3) **Critical editions**: Sylvain Lévi's edition of the *Daśabhūmika Sūtra*\n(Journal Asiatique, 1907–1908), Tatsuhito Tachibana's edition of Sanskrit\nAvataṃsaka fragments (Taishō University, 1930), the Sanskrit Avataṃsaka\ncritical edition series by the Japanese Association of Indian and Buddhist\nStudies.\n(4) **Academic significance**: Sanskrit textual criticism provides key\nevidence for the history of the sūtra's formation, revealing the\ncompilation process from Indian individual scriptures to the Khotanese\ngreat collection.\n(5) **84000 Project**: currently conducting modern critical editions and\nEnglish translations of the Sanskrit Avataṃsaka, with some chapters\nalready completed.\n"}, {"title": "藏文华严经(Toh44)研究", "title_en": "Studies of the Tibetan Avataṃsaka (Toh44)", "body": "藏文《华严经》(Toh44)的研究现状:\n(1) **版本**: 藏文大藏经《甘珠尔》中收录，共45品，译自于阗本。\n(2) **与汉文差异**: 比汉文三译多2品(如来华严品·普贤宣说品)，结构组织有差异。\n(3) **校勘**: BDRC(藏传佛教资源中心)提供数字化校勘本，日本东北大学推进梵藏汉对校。\n(4) **翻译**: 84000项目正在翻译Toh44，已完成入法界品(Toh44-44, 2021)等。\n(5) **学术意义**: 藏文华严经保留了于阗本的特征，为研究华严经的中亚传承提供重要文本依据。\n", "en_body": "Current status of studies of the Tibetan Avataṃsaka (Toh44):\n(1) **Version**: contained in the Tibetan Buddhist canon (*Kangyur*), 45\nchapters total, translated from the Khotanese text.\n(2) **Differences from Chinese**: two chapters more than the three Chinese\ntranslations (the *Chapter on the Tathāgata's Avataṃsaka* and the *Chapter\non Samantabhadra's Proclamation*), with structural and organizational\ndifferences.\n(3) **Critical editions**: BDRC (Buddhist Digital Resource Center) provides\ndigitized critical editions; Tohoku University is advancing Sanskrit-Tibetan-\nChinese comparative collation.\n(4) **Translation**: the 84000 Project is translating Toh44, with the\n*Gaṇḍavyūha* (Toh44-44, 2021) already completed.\n(5) **Academic significance**: the Tibetan Avataṃsaka preserves features of\nthe Khotanese text, providing important textual evidence for studying the\nCentral Asian transmission of the Avataṃsaka Sūtra.\n"}, {"title": "于阗文华严经研究", "title_en": "Khotanese Avataṃsaka Studies", "body": "于阗文华严经的研究现状:\n(1) **历史背景**: 于阗(今新疆和田)是华严经的最终编纂地，于阗文是华严经的早期传播语言之一。\n(2) **现存文献**: 于阗文华严经残卷(部分品目)，收藏于大英图书馆·法国国家图书馆·新疆博物馆等。\n(3) **语言特征**: 于阗文属中古伊朗语支，与梵文有密切接触，华严经中出现的\"ysa\"一词即为于阗文特征。\n(4) **学术研究**: Bailey, Emmerick等学者校订于阗文华严经残卷；日本学者推进于阗文与汉文华严经的对勘。\n(5) **学术意义**: 于阗文华严经为华严经在于阗的编纂与传播提供直接语言证据，是华严经文献学研究的关键环节。\n", "en_body": "Current status of Khotanese Avataṃsaka studies:\n(1) **Historical background**: Khotan (modern Hotan, Xinjiang) was the final\nplace of compilation of the Avataṃsaka Sūtra; the Khotanese language was one\nof the early languages of transmission.\n(2) **Extant documents**: Khotanese Avataṃsaka fragments (partial chapters),\nhoused in the British Library, Bibliothèque nationale de France, Xinjiang\nMuseum, etc.\n(3) **Linguistic features**: Khotanese belongs to the Middle Iranian branch,\nwith close contact with Sanskrit; the word \"ysa\" appearing in the Avataṃsaka\nis a Khotanese linguistic feature.\n(4) **Academic research**: Bailey, Emmerick, and other scholars have edited\nKhotanese Avataṃsaka fragments; Japanese scholars are advancing comparative\ncollation of Khotanese and Chinese Avataṃsaka texts.\n(5) **Academic significance**: the Khotanese Avataṃsaka provides direct\nlinguistic evidence for the compilation and transmission of the Avataṃsaka\nSūtra in Khotan, a key link in Avataṃsaka textual studies.\n"}, {"title": "华严经版本学与校勘学", "title_en": "Avataṃsaka Sūtra Bibliography and Textual Criticism", "body": "华严经版本学与校勘学的主要成果:\n(1) **汉文版本**: 六十华严(唐·实叉难陀译)·八十华严(唐·实叉难陀译)·四十华严(唐·般若译)三译本的版本比较。\n(2) **CBETA校勘**: 中华电子佛典协会对汉文华严经三译本的数字化校勘，提供异文对照。\n(3) **梵藏汉对校**: 日本东北大学·84000项目推进梵文·藏文·汉文华严经的多语对校。\n(4) **敦煌写本**: 敦煌藏经洞出土的华严经写本，为研究华严经在中国的早期流传提供实物证据。\n(5) **学术意义**: 版本学与校勘学为华严经的文本可靠性提供保障，为义理研究奠定文献基础。\n", "en_body": "Major achievements in Avataṃsaka Sūtra bibliography and textual criticism:\n(1) **Chinese versions**: comparative study of the three translation versions —\nthe sixty-fascicle (Jin), eighty-fascicle (Tang), and forty-fascicle (Tang)\ntranslations.\n(2) **CBETA critical edition**: the Chinese Buddhist Electronic Text\nAssociation's digital critical edition of the three Chinese Avataṃsaka\ntranslations, providing variant readings.\n(3) **Sanskrit-Tibetan-Chinese collation**: Tohoku University and the 84000\nProject are advancing multilingual collation of Sanskrit, Tibetan, and\nChinese Avataṃsaka texts.\n(4) **Dunhuang manuscripts**: Avataṃsaka manuscripts excavated from the\nDunhuang library cave, providing material evidence for the early\ntransmission of the Avataṃsaka Sūtra in China.\n(5) **Academic significance**: bibliography and textual criticism guarantee\nthe textual reliability of the Avataṃsaka Sūtra, laying the documentary\nfoundation for doctrinal studies.\n"}]}, {"id": "recent_research", "title": "2024-2026年最新研究动态", "title_en": "Latest Research Developments (2024–2026)", "icon": "🔬", "topics": [{"title": "2026年最新学术论文", "title_en": "Latest Academic Papers (2026)", "body": "2026年华严研究的最新学术进展——\n(1) **Imre Hamar (2026)** \"Avataṃsaka Meditation in Khotan: Samādhi, Visualization, and the Cult of Buddha Images\"\n*Religions* 17(2):135. 研究于阗华严佛教禅定修行与佛像崇拜的关系，\n分析Devendraprajñā翻译的两部华严禅定文本(*Bhadrakarī Sūtra*和*Duravāsas Sūtra*)，\n揭示华严禅定中的可视化修行实践(Visualization Meditation)在中亚的传播。\n(2) **Saiping An (2026)** \"Science in Huayan Buddhism: The Apologetic Discourse of Zhong Maosen (b. 1973)\"\n*Religions* 17(3):309. 分析当代中国华严学者钟茂森用现代物理学(弦理论·量子力学·多维空间)\n为华严经「一多相容·事事无碍」思想进行科学辩护的论述策略。\n(3) **Jing Liu (2025)** \"Studies on the Buddhāvataṃsaka-sūtra\"\n*Journal of East Asian Cultures* 17(1):1–20. 综合检视华严经三大汉译本的翻译策略差异、\n华严感应故事集的文学传统、以及善财童子五十三参的叙事结构。\n", "en_body": "Latest scholarly developments in Huayan studies for 2026 —\n(1) **Imre Hamar (2026)** \"Avataṃsaka Meditation in Khotan: Samādhi, Visualization, and the Cult of Buddha Images\"\n*Religions* 17(2):135. Studies the relationship between Huayan Buddhist meditation and Buddha-image\nworship in Khotan, analyzing two Avataṃsaka meditation texts translated by Devendraprajñā\n(*Bhadrakarī Sūtra* and *Duravāsas Sūtra*), revealing the transmission of visualization\nmeditation practices in Central Asian Huayan Buddhism.\n(2) **Saiping An (2026)** \"Science in Huayan Buddhism: The Apologetic Discourse of Zhong Maosen (b. 1973)\"\n*Religions* 17(3):309. Analyzes contemporary Chinese Huayan scholar Zhong Maosen's use of modern\nphysics (string theory, quantum mechanics, multidimensional space) as an apologetic strategy\nfor the Avataṃsaka Sūtra's doctrines of \"interpenetration of one and many\" and \"unimpeded\ninterpenetration of all phenomena.\"\n(3) **Jing Liu (2025)** \"Studies on the Buddhāvataṃsaka-sūtra\"\n*Journal of East Asian Cultures* 17(1):1–20. A comprehensive examination of translation strategy\ndifferences across the three Chinese Avataṃsaka translations, the literary tradition of Huayan\nmiracle tales, and the narrative structure of Sudhana's fifty-three pilgrimages.\n", "sources": ["Hamar, I. (2026). Religions 17(2):135", "An, S. (2026). Religions 17(3):309", "Liu, J. (2025). Journal of East Asian Cultures 17(1):1–20"]}, {"title": "2025年学术专著与论文", "title_en": "Academic Monographs and Papers (2025)", "body": "2025年华严研究的重要成果——\n(1) **Zhang Y. (2025)** \"A Sanctuary of Avataṃsaka: The Theoretical and Practical Studies on Huayan Buddhism Embodied in the Sculptures of the Huayan Grotto in Anyue\"\n*Religions* 16(4):438. 研究安岳华严洞石窟(四川)中唐代石刻造像所体现的华严佛教理论与实践，\n分析柳赵教派(柳本尊·赵智凤)的华严思想体系及其在巴蜀地区的传播。\n(2) **Li Kang (2025)** \"How It All Depends: A Contemporary Reconstruction of Huayan Buddhism\"\n*Oxford Handbook of Chinese Philosophy*. 用当代本体论方法(ontological methodology)重构华严\n相互依存理论(Huayan interdependence)，与当代形而上学对话。\n(3) **Harvey D. (2025)** *On the Integration of Eastern and Western Spiritual Practices*\nMcGraw Hill. 包含华严佛教与基督教神秘主义的比较研究专章。\n(4) **杨维中 (2005)** \"《华严经》的形成、汉译、基本思想及其修行论意义\"\n发表于《普门学报》第26期(2005年3月), 页85-143。系统研究华严经从印度单品到于阗大集的形成过程，\n三大汉译本的翻译策略，以及华严经「法界缘起·心佛众生三无差别」的核心思想与修行论意义。\n(原文原系为三民书局2004年1月《新译〈华严经入法界品〉》所作导读的前半部分。)\n", "en_body": "Important achievements in Huayan studies for 2025 —\n(1) **Zhang Y. (2025)** \"A Sanctuary of Avataṃsaka: The Theoretical and Practical Studies on Huayan Buddhism Embodied in the Sculptures of the Huayan Grotto in Anyue\"\n*Religions* 16(4):438. Studies the Tang dynasty stone sculptures at the Huayan Grotto in Anyue\n(Sichuan) as embodying Huayan Buddhist theory and practice, analyzing the Huayan thought system\nof the Liu-Zhao school (Liu Benzun · Zhao Zhifeng) and its transmission in the Ba-Shu region.\n(2) **Li Kang (2025)** \"How It All Depends: A Contemporary Reconstruction of Huayan Buddhism\"\n*Oxford Handbook of Chinese Philosophy*. Reconstructs Huayan interdependence theory through\ncontemporary ontological methodology, engaging in dialogue with contemporary metaphysics.\n(3) **Harvey D. (2025)** *On the Integration of Eastern and Western Spiritual Practices*\nMcGraw Hill. Contains dedicated chapters comparing Huayan Buddhism with Christian mysticism.\n(4) **Yang Weizhong (2005)** \"The Formation, Chinese Translation, Basic Ideas, and Soteriological Significance of the Avataṃsaka Sūtra\"\nUniversal Gate Buddhist Journal no. 26 (March 2005), pp. 85–143. A systematic study of the Avataṃsaka's\nformation from Indian individual sutras to the Khotanese\ncompilation, translation strategies across the three Chinese versions, and the core doctrines of\n\"dharmadhātu conditionality\" and \"no difference between mind, buddha, and sentient beings.\"\n(Originally the first part of the introduction to the New Translation of the Avataṃsaka's\n\"Entry into the Dharmadhātu\" chapter, Sanmin Books, January 2004.)\n", "sources": ["Zhang Y. (2025). Religions 16(4):438", "Li Kang (2025). Oxford Handbook of Chinese Philosophy", "Harvey D. (2025). McGraw Hill", "杨维中 (2005). 普门学报 26期, 页85-143"]}, {"title": "2024年重要学术成果", "title_en": "Key Academic Achievements (2024)", "body": "2024年华严研究的重要成果——\n(1) **Stanford Encyclopedia of Philosophy (2024修订)** \"Huayan Buddhism\" 词条\n2024年9月进行实质性修订，更新了华严宗五祖思想的哲学分析、\n当代西方学者(如Cook·Gregory·Hamar·Jones)的研究综述、以及华严与当代哲学的对话。\n(2) **释观慧 (2024)** \"《大方廣佛華嚴經》經題之「大」、「方」、「廣」要義探究\"\n华梵大学印度与中国佛学系硕士论文。从梵文语源学角度分析华严经题中\n\"Mahā\"(大)·\"Samanta\"(方)·\"Vipula\"(广)三字的佛教哲学意涵。\n(3) **傅及斯 (2024)** \"杭州国家版本馆新入藏《华严经》探微\"\n*浙江大学学报*. 研究杭州国家版本馆新入藏的敦煌写本华严经的文献学价值，\n对写本的年代·抄写者·文本特征进行详细考证。\n(4) **李治华 (2024)** \"《華嚴經》與《楞嚴經》的菩薩階位比較再探\"\n华严专宗国际学术研讨会论文集。比较华严经与楞严经中的菩萨阶位系统(十信·十住·十行·十回向·十地)，\n揭示两经在修行次第上的异同。\n(5) **郭朝顺 (2025)** \"论《修华严奥旨妄尽还源观》作为汉传佛教修行实践心理学的基本架构\"\n*佛光学报*. 从修行实践心理学角度解读法藏《修华严奥旨妄尽还源观》，\n分析华严禅观中的「妄尽还源」(extinction of delusions and return to the source)\n作为佛教心理学的基本架构。\n", "en_body": "Key academic achievements in Huayan studies for 2024 —\n(1) **Stanford Encyclopedia of Philosophy (2024 revision)** \"Huayan Buddhism\" entry\nSubstantially revised in September 2024, updating the philosophical analysis of the five Huayan\npatriarchs' thought, research surveys by contemporary Western scholars (Cook, Gregory, Hamar,\nJones), and the dialogue between Huayan and contemporary philosophy.\n(2) **Śramaṇa Guànhuì (2024)** \"An Inquiry into the Key Meanings of 'Great,' 'Square,' and 'Vast'\nin the Title of the *Mahāvaipulya Buddhāvataṃsaka Sūtra*\"\nMaster's thesis, Huafan University. Analyzes the Buddhist philosophical connotations of the three\nSanskrit terms \"Mahā\" (great), \"Samanta\" (square — universal), and \"Vipula\" (vast) in the sūtra\ntitle from the perspective of Sanskrit etymology.\n(3) **Fu Jisi (2024)** \"A Preliminary Study of the Newly Acquired *Avataṃsaka Sūtra* at the\nHangzhou National Archives\"\n*Zhejiang University Journal*. Studies the philological value of a newly acquired Dunhuang\nmanuscript of the Avataṃsaka Sūtra, with detailed textual research on its date, scribe,\nand textual features.\n(4) **Li Zhihua (2024)** \"A Re-examination of the Comparison of Bodhisattva Stages in the\n*Avataṃsaka Sūtra* and the *Śūraṅgama Sūtra*\"\nProceedings of the International Academic Conference on Huayan Buddhism. Compares the bodhisattva\nstage systems (ten faiths, ten abodes, ten practices, ten transfers, ten grounds) across the two\nsūtras, revealing similarities and differences in their cultivation sequences.\n(5) **Guo Chaoshun (2025)** \"On the *Xiu Huayan Aozhi Wangjin Huayuan Guan* as the Basic\nFramework of East Asian Buddhist Practice and Psychological Architecture\"\n*Fo Guang Journal*. Interprets Fazang's *Xiu Huayan Aozhi Wangjin Huayuan Guan* from the\nperspective of practice psychology, analyzing the \"extinction of delusions and return to the\nsource\" (*wangjin huayuan*) as the basic framework of Huayan contemplative psychology.\n", "sources": ["Stanford Encyclopedia of Philosophy, Huayan Buddhism (2024 revision)", "释观慧 (2024). 华梵大学硕士论文", "傅及斯 (2024). 浙江大学学报", "李治华 (2024). 华严专宗国际学术研讨会论文集", "郭朝顺 (2025). 佛光学报"]}, {"title": "Stanford Encyclopedia of Philosophy华严词条详解", "title_en": "Stanford Encyclopedia of Philosophy — Huayan Buddhism Entry in Detail", "body": "Stanford Encyclopedia of Philosophy (SEP)的\"Huayan Buddhism\"词条是英语世界最权威的华严哲学概述。\n2024年9月进行了实质性修订，主要涵盖——\n(1) **华严宗五祖思想的哲学分析**: 从杜顺法界观→智俨十玄→法藏五教→澄观三圣圆融→宗密禅教一致，\n以分析哲学方法重新诠释各祖师的核心范畴。\n(2) **十玄门的逻辑结构**: Nicholaos Jones (2019)的分析——六相圆融(Fazang's six characteristics)\n作为华严的认识论基础，如何与当代逻辑学(模态逻辑·可能世界语义)对话。\n(3) **事事无碍的形上学**: 以当代形而上学方法(可能世界·反事实条件句)重构华严「一即一切」命题。\n(4) **当代学者研究综述**: Cook(1977)·Gregory(1991)·Hamar(2007)·Lai(2003)·\nMcGraw(2017, 2025)·Shields(2024)·Jones(2019)等。\n(5) **华严与当代哲学对话**: 华严缘起观与过程哲学(Whitehead)·唯心论与唯物论的张力·\n华严美学(缘起即美)的初步探讨。\n", "en_body": "The \"Huayan Buddhism\" entry in the Stanford Encyclopedia of Philosophy (SEP) is the most\nauthoritative philosophical overview of Huayan in the English-speaking world.\nSubstantially revised in September 2024, covering —\n(1) **Philosophical analysis of the five Huayan patriarchs' thought**: from Dushun's\ndharmadhātu contemplation → Zhiyan's ten mysterious gates → Fazang's five teachings →\nChengguan's perfect fusion of the three holy ones → Zongmi's Chan-doctrinal unity,\nreinterpreted through the methods of analytical philosophy.\n(2) **Logical structure of the ten mysterious gates**: Nicholaos Jones's (2019) analysis\n— how the six characteristics (Fazang's *liu xiang yuanrong*) serve as the epistemological\nfoundation of Huayan, engaging with contemporary logic (modal logic, possible-worlds semantics).\n(3) **Metaphysics of unimpeded interpenetration**: reconstructing the Huayan proposition\n\"one is all\" through contemporary metaphysical methods (possible worlds, counterfactual\nconditionals).\n(4) **Survey of contemporary scholarship**: Cook (1977), Gregory (1991), Hamar (2007),\nLai (2003), McGraw (2017, 2025), Shields (2024), Jones (2019), and others.\n(5) **Huayan and contemporary philosophy**: the dialogue between Huayan conditionality and\nprocess philosophy (Whitehead), the tension between idealism and materialism, and\npreliminary explorations of Huayan aesthetics (beauty as conditionality).\n", "sources": ["Stanford Encyclopedia of Philosophy: Huayan Buddhism (SEP, 2024 revision)", "Jones, N. (2019). Philosophy East and West 69(4)", "Cook, F. (1977). Hua-yen Buddhism: The Jewel Net of Indra", "Gregory, P. (1991). Tsung-mi and the Sinification of Buddhism", "Hamar, I. (2007). Reflecting Mirrors", "Lai, W. (2003). Studies in Huayan Buddhism", "McGraw, B. (2017). Religions 8(12)", "Shields, J. (2024). Journal of Buddhist Ethics 31", "Stanford Encyclopedia of Philosophy: Huayan Buddhism (2024 revision)", "[2024 SEP Huayan Buddhism entry](https://plato.stanford.edu/entries/huayan-buddhism/)"]}]}, {"id": "publications", "title": "华严经出版与研究专著", "title_en": "Publications and Research Monographs on the Avataṃsaka Sūtra", "icon": "📚", "topics": [{"title": "华严经注疏详解", "title_en": "Avataṃsaka Sūtra Commentaries and Sub-commentaries", "body": "华严经注疏的主要成果:\n(1) **法藏(643-712)**: 《华严经探玄记》20卷(T35n1733)——华严经最早的完整注疏。\n(2) **澄观(738-839)**: 《大方广佛华严经疏》60卷(T35n1735) + 《随疏演义钞》90卷(T36n1736)——最详尽的华严经科判与注疏。\n(3) **宗密(780-841)**: 《华严经行愿品疏钞》——入法界品的详细注疏。\n(4) **李通玄(635-730)**: 《新华严经论》40卷——以易经融会华严的独特注疏。\n(5) **净源(1011-1088)**: 《华严经疏论要钞》——宋代华严复兴的重要注疏。\n(6) **当代注疏**: 海云继梦《九九華嚴玄談》5册·贤度法师《华严经讲义》系列。\n这些注疏构成了华严经学的完整文献体系。\n", "en_body": "Major achievements in Avataṃsaka Sūtra commentaries:\n(1) **Fazang (643–712)**: *Tanxuanji* (Explorations of the Profundities),\n20 fascicles (T35n1733) — the earliest complete commentary on the\nAvataṃsaka Sūtra.\n(2) **Chengguan (738–839)**: *Dafangguang fo huayan jing shu* (Commentary),\n60 fascicles (T35n1735) + *Suishu yanyi chao* (Sub-commentary), 90 fascicles\n(T36n1736) — the most detailed structural analysis and commentary.\n(3) **Zongmi (780–841)**: *Huayan jing xingyuan pin shu chao* — detailed\ncommentary on the *Gaṇḍavyūha*.\n(4) **Li Tongxuan (635–730)**: *Xin Huayan jing lun* (New Avataṃsaka\nCommentary), 40 fascicles — a unique commentary integrating the *Book of\nChanges* with Huayan.\n(5) **Jingyuan (1011–1088)**: *Huayan jing shu lun yao chao* — an important\ncommentary in the Song dynasty Huayan revival.\n(6) **Contemporary commentaries**: Haiyun Jimeng's *Jiujiu Huayan Xuantan*,\n5 volumes; Venerable Xiandu's *Lectures on the Avataṃsaka Sūtra* series.\nThese commentaries constitute the complete documentary system of Avataṃsaka\nSūtra studies.\n"}, {"title": "华严宗史研究专著", "title_en": "Monographs on the History of the Huayan School", "body": "华严宗史研究的主要专著:\n(1) **魏道儒《中国华严宗通史》**(江苏古籍, 1998)——当代最系统的华严宗通史。\n(2) **镰田茂雄《中国华严思想史の研究》**(东京大学出版会, 1965)——日本学界的经典著作。\n(3) **木村清孝《初期中国华严思想の研究》**(春秋社, 1977)——华严宗初期思想的深入研究。\n(4) **方立天《法藏评传》**(人大出版社, 2006)——法藏法师的详细传记与思想研究。\n(5) **安藤俊雄《华严思想の研究》**(法藏馆, 1965)——日本华严思想研究的重要著作。\n(6) **石井修道《中国华严宗の研究》**(大东出版社, 1990)——中国华严宗的综合性研究。\n(7) **织田显祐《唐代华严教学の研究》**(法藏馆, 2000)——唐代华严教学的专题研究。\n(8) **王颂《宋代华严思想研究》**(宗教文化, 2008)——宋代华严复兴的深入研究。\n这些专著构成了华严宗史研究的完整学术谱系。\n", "en_body": "Major monographs on the history of the Huayan school:\n(1) **Wei Daoru, *A Comprehensive History of Chinese Huayan*** (Jiangsu\nAncient Books, 1998) — the most systematic contemporary Chinese monograph.\n(2) **Kamata Shigeo, *A Study of the History of Chinese Huayan Thought***\n(University of Tokyo Press, 1965) — a classic Japanese scholarly work.\n(3) **Kiyotaka Kimura, *A Study of Early Chinese Huayan Thought*** (Shunjin-\nsha, 1977) — in-depth study of early Huayan thought.\n(4) **Fang Litian, *A Critical Biography of Fazang*** (Renmin University\nPress, 2006) — detailed biography and thought study of Fazang.\n(5) **Andō Toshio, *Studies in Huayan Thought*** (Hōzōkan, 1965) — an\nimportant Japanese work on Huayan thought.\n(6) **Ishii Shūdō, *Studies on the Chinese Huayan School*** (Tōdō Bunko,\n1990) — comprehensive study of the Chinese Huayan school.\n(7) **Otera Kensuke, *Studies on Tang Dynasty Huayan Teaching*** (Hōzōkan,\n2000) — specialized study of Tang dynasty Huayan pedagogy.\n(8) **Wang Song, *Huayan Thought in the Song Dynasty*** (Religious Culture\nPress, 2008) — in-depth study of the Song dynasty Huayan revival.\nThese monographs constitute the complete academic genealogy of Huayan\nschool history studies.\n"}, {"title": "华严思想与当代对话", "title_en": "Huayan Thought and Contemporary Dialogue", "body": "华严思想与当代对话的主要研究:\n(1) **华严与系统论**: Fritjof Capra《The Tao of Physics》(1975)比较华严与现代物理学。\n(2) **华严与生态伦理**: David Loy, \"The Great Awakening: A Buddhist Social Theory\"(2003)。\n(3) **华严与AI**: 华严的因陀罗网与神经网络的结构相似性研究。\n(4) **华严与心理学**: 华严的唯心回转与认知科学的比较研究。\n(5) **华严与艺术**: 华严的华藏世界海与当代艺术的对话。\n(6) **华严与和平**: 华严的法界缘起思想对当代和平运动的启示。\n这些对话为华严思想的当代转化提供了重要路径。\n", "en_body": "Major research on Huayan thought and contemporary dialogue:\n(1) **Huayan and systems theory**: Fritjof Capra's *The Tao of Physics*\n(1975) comparing Huayan with modern physics.\n(2) **Huayan and ecological ethics**: David Loy, \"The Great Awakening: A\nBuddhist Social Theory\" (2003).\n(3) **Huayan and AI**: studies on the structural similarity between Huayan's\nIndra's net and neural networks.\n(4) **Huayan and psychology**: comparative studies of Huayan's \"revolution\nof mind-only\" and cognitive science.\n(5) **Huayan and art**: dialogue between Huayan's Ocean of Flower-Treasury\nWorlds and contemporary art.\n(6) **Huayan and peace**: the inspiration of Huayan's dharmadhātu\nconditionality thought for contemporary peace movements.\nThese dialogues provide important paths for the contemporary\ntransformation of Huayan thought.\n"}, {"title": "华严艺术与图像学研究", "title_en": "Huayan Art and Iconographic Studies", "body": "华严艺术与图像学研究的主要成果:\n(1) **毗卢遮那佛像**: 日本东大寺大佛(奈良, 752)——世界最大铜佛，依华严经建造。\n(2) **华严经变相**: 敦煌莫高窟华严经变壁画(唐代)——华严经的图像化表现。\n(3) **善财童子五十三参图**: 日本·韩国·中国的五十三参图像传统。\n(4) **华藏世界海图**: 华严宇宙观的图像化表现，见于绘画·雕塑·建筑。\n(5) **华严梵呗**: 华严四十二字母的音乐传统，见于日本声明·韩国梵呗。\n(6) **学术研究**: 村田靖子《佛像の系譜》·宫次男《平安時代の絵画》等对华严图像有深入分析。\n华严艺术研究为理解华严思想的视觉表达提供了重要视角。\n", "en_body": "Major achievements in Huayan art and iconographic studies:\n(1) **Vairocana images**: the Great Buddha of Tōdaiji (Nara, 752) — the\nworld's largest bronze Buddha, built according to the Avataṃsaka Sūtra.\n(2) **Avataṃsaka Sūtra mandalas**: Dunhuang Mogao Caves Avataṃsaka murals\n(Tang dynasty) — visual representations of the Avataṃsaka Sūtra.\n(3) **Sudhana's fifty-three pilgrimages images**: Japanese, Korean, and\nChinese traditions of depicting the fifty-three pilgrimages.\n(4) **Ocean of Flower-Treasury Worlds maps**: visual representations of the\nHuayan cosmology, found in paintings, sculptures, and architecture.\n(5) **Huayan chants**: the musical tradition of the forty-two Huayan\nletters, found in Japanese shōmyō and Korean beompae.\n(6) **Academic research**: Murata Yasuko's *Genealogy of Buddhist Images*\nand Miyatsugu Masao's *Heian Period Painting* provide in-depth analysis of\nHuayan iconography.\nHuayan art studies provide important perspectives for understanding the\nvisual expression of Huayan thought.\n"}, {"title": "华严经现代译本与普及读物", "title_en": "Modern Translations and Popular Works on the Avataṃsaka Sūtra", "body": "华严经现代译本与普及读物:\n(1) **Thomas Cleary, *The Flower Ornament Scripture*** (Shambhala, 1993)——英文全译本。\n(2) **84000项目**: 正在进行华严经(Toh44)的现代英译，已发布部分品目。\n(3) **xCBETA**: 中华电子佛典协会提供华严经三译本的数字化校勘本。\n(4) **普及读物**: 圣严《正信的佛教》·星云《华严经讲话》·海云继梦《华严经导读》系列。\n(5) **学术导读**: 方东美《华严宗哲学》·Francis Cook *Hua-yen Buddhism* 等学术普及著作。\n这些译本与读物为华严经的现代传播提供了重要载体。\n", "en_body": "Modern translations and popular works on the Avataṃsaka Sūtra:\n(1) **Thomas Cleary, *The Flower Ornament Scripture*** (Shambhala, 1993) —\ncomplete English translation.\n(2) **84000 Project**: currently conducting modern English translation of the\nAvataṃsaka (Toh44), with some chapters already published.\n(3) **xCBETA**: the Chinese Buddhist Electronic Text Association provides\ndigitized critical editions of the three Chinese Avataṃsaka translations.\n(4) **Popular works**: Shengyan's *What Buddhists Believe*, Hsingyun's\n*Avataṃsaka Sūtra Talks*, Haiyun Jimeng's *Avataṃsaka Sūtra Guide* series.\n(5) **Academic introductions**: Thomé Fang's *The Philosophy of the Huayan\nSchool*, Francis Cook's *Hua-yen Buddhism*, and other academic popularization\nworks.\nThese translations and works provide important vehicles for the modern\ndissemination of the Avataṃsaka Sūtra.\n"}]}], "references": ["印顺《初期大乘佛教之起源与开展》第十三章「华严法门」(正闻出版社, 1981)", "镰田茂雄《中国华严思想史の研究》(东京大学出版会, 1965)", "木村清孝《初期中国华严思想の研究》(春秋社, 1977)", "方东美《华严宗哲学》(黎明文化, 1980)", "方立天《法藏评传》(中国人民大学出版社, 2006)", "方立天《华严金师子章校释》(中华书局, 1983)", "魏道儒《中国华严宗通史》(江苏古籍出版社, 1998)", "Francis H. Cook, Hua-yen Buddhism: The Jewel Net of Indra (Penn State, 1977). ISBN 978-0271021904", "Peter N. Gregory, Tsung-mi and the Sinification of Buddhism (Princeton, 1991). ISBN 978-0691073735", "Thomas Cleary, The Flower Ornament Scripture: A Translation of the Avatamsaka Sutra (Shambhala, 1993). ISBN 978-0877739401", "Imre Hamar (ed.), Reflecting Mirrors: Perspectives on Huayan Buddhism (Harrassowitz, 2007). ISBN 978-3447055093", "Robert M. Gimello & Peter N. Gregory (eds.), Studies in Ch'an and Hua-yen (Hawai'i, 1983). ISBN 978-0824808351", "Lancaster & Park, The Korean Buddhist Canon: A Descriptive Catalogue (UC Press, 1979)", "Buswell, Religions of Korea in Practice (Princeton, 2007)", "Robson, Power of Place: The Religious Landscape of the Southern Sacred Peak (Oxford, 2009)", "海云继梦《华严思想的承先与启后》讲记(fjdh.cn)", "海云继梦《华严经导读》系列(空庭书苑)", "海云继梦《九九華嚴玄談》5册(空庭书苑, 2026)", "海云继梦《探玄記懸談講記》4册(空庭书苑)", "贤度法师《华严经讲义》系列(华严莲社)", "贤度法师《华严学概论》(华严莲社)", "[华严专宗学院](https://www.huayencollege.org)", "CBETA 中华电子佛典协会: T09n0278(六十)·T10n0279(八十)·T10n0293(四十)", "84000 Project: The Ten Bhumis (Toh44-31)", "84000 Project: The Gaṇḍavyūha (Toh44-44, 2021)", "[Stanford Encyclopedia of Philosophy: Huayan Buddhism (2024 revision)](https://plato.stanford.edu/entries/huayan-buddhism/)", "安藤俊雄《华严思想の研究》(法藏馆, 1965)", "伊藤瑞叡《华严教学の研究》(法藏馆, 1980)", "石井修道《中国华严宗の研究》(大东出版社, 1990)", "织田显祐《唐代华严教学の研究》(法藏馆, 2000)", "镰田茂雄《朝鲜佛教史》(东京大学出版会, 1980)", "吕澂《中国佛学源流略讲》(中华书局, 1979)", "王颂《宋代华严思想研究》(宗教文化出版社, 2008). ISBN 9787801239594", "邱高兴《李通玄佛学思想述评》(佛光文化, 2001)", "张文良《澄观华严思想研究》(日文, 东京大学, 2005)", "蒋维乔《中国佛教史》(商务印书馆, 1935)", "汤用彤《隋唐佛教史稿》(中华书局, 1982)", "陈寅恪《隋唐制度渊源略论稿》(中华书局, 1963)", "严耕望《唐代交通图考》(中央研究院历史语言研究所, 1985)", "Michael Quinn Norton, Hwaeom Buddhism of Korea (2018)", "Sem Vermeersch, The Power of the Buddhas: The Politics of Buddhism during the Goryeo Dynasty (Harvard, 2008)", "Robert Buswell, The Zen Monastic Experience (Princeton, 1992)", "Hamar, I. (2026). 'Avataṃsaka Meditation in Khotan: Samādhi, Visualization, and the Cult of Buddha Images.' Religions 17(2):135", "An, S. (2026). 'Science in Huayan Buddhism: The Apologetic Discourse of Zhong Maosen (b. 1973).' Religions 17(3):309", "Liu, J. (2025). 'Studies on the Buddhāvataṃsaka-sūtra.' Journal of East Asian Cultures 17(1):1–20", "Zhang Y. (2025). 'A Sanctuary of Avataṃsaka: The Theoretical and Practical Studies on Huayan Buddhism Embodied in the Sculptures of the Huayan Grotto in Anyue.' Religions 16(4):438", "Li Kang (2025). 'How It All Depends: A Contemporary Reconstruction of Huayan Buddhism.' Oxford Handbook of Chinese Philosophy", "Harvey D. (2025). On the Integration of Eastern and Western Spiritual Practices. McGraw Hill", "[杨维中 (2005). '《华严经》的形成、汉译、基本思想及其修行论意义.' 普门学报 26期, 页85-143](https://buddhism.lib.ntu.edu.tw/jp/search/search_detail.jsp?comefrom=authorinfo&seq=206722)", "[杨维中 (2002). '论华严宗的染净善恶观与妄尽还源的修行路径.' 闽南佛学第一辑, 岳麓书社](https://buddhism.lib.ntu.edu.tw/search/search_detail.jsp?comefrom=authorinfo&seq=207530)", "释观慧 (2024). '《大方廣佛華嚴經》經題之「大」、「方」、「廣」要義探究.' 华梵大学硕士论文", "傅及斯 (2024). '杭州国家版本馆新入藏《华严经》探微.' 浙江大学学报", "李治华 (2024). '《華嚴經》與《楞嚴經》的菩薩階位比較再探.' 华严专宗国际学术研讨会论文集", "郭朝顺 (2025). '论《修华严奥旨妄尽还源观》作为汉传佛教修行实践心理学的基本架构.' 佛光学报", "Nicholaos Jones (2019). 'The Architecture of Fazang's Six Characteristics.' Philosophy East and West 69(4)", "Hammerstrom (2016). 'Avataṃsaka Transnationalism in Modern Sinitic Buddhism.' Journal of Global Buddhism", "Imre Hamar (2010). 'Interpretation of Yogācāra Philosophy in Huayan Buddhism.' Journal of Chinese Philosophy", "Imre Hamar (2014). The Buddhāvatamsaka-sūtra and Its Chinese Interpretation. Hungarian Academy of Sciences"]}};

<script>
function _dynMD(s) {
  return String(s||'')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*]+?)\*(?!\*)/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target=_blank style="color:var(--blue)">$1</a>');
}
function _dynSectionLink(sec) { return 'avs-dyn-' + sec.id; }
function _dynTopicLink(sec, i) { return 'avs-topic-' + sec.id + '-' + i; }
// mode: 'article' = zhenwei 式连续全文（华严经学等，全展开可读）；默认 'doors' = 折叠门（判教互判等）
function renderDynTopics(data, mode) {
  if (!data || !data.sections) return '';
  var isArticle = (mode === 'article');
  var art = (typeof ARTICLE !== 'undefined') ? ARTICLE : {};
  var icon = data.icon || art.icon || '📌';
  var title = data.title || art.title || '';
  var subtitle = data.title_sub || art.title_sub || '';
  var backTab = art.back && art.back.tab ? '../tabs/' + art.back.tab + '.html' : '';
  var backLabel = (art.back && art.back.label) || '';
  var h = '';
  if (isArticle) {
    // ── 面包屑 ──
    h += '<div style="font-size:0.74em;color:var(--text2);margin-bottom:12px;">';
    h += '<a href="../index.html" style="color:var(--blue);text-decoration:none">主页</a> › ';
    h += '<a href="index.html" style="color:var(--blue);text-decoration:none">独立文章目录</a>';
    if (backTab) h += ' › <a href="' + backTab + '" style="color:var(--blue);text-decoration:none">' + backLabel + '</a>';
    h += '</div>';
    // ── 页头横幅 ──
    h += '<div style="background:linear-gradient(120deg,rgba(184,134,60,0.12),rgba(94,139,158,0.08));border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px;">';
    h += '  <div style="font-size:0.76em;color:var(--text2);letter-spacing:0.5px">📄 独立文章页 · 数据驱动全文（全量展开）</div>';
    h += '  <h2 style="color:var(--gold);margin:6px 0 4px">' + icon + ' ' + title + '</h2>';
    if (subtitle) h += '  <div style="font-size:0.85em;color:var(--text2)">' + subtitle + '</div>';
    if (data.intro) h += '  <p style="font-size:0.8em;color:var(--text2);line-height:1.8;white-space:pre-line;margin:10px 0 0">' + _dynMD(data.intro) + '</p>';
    h += '</div>';
    // ── 自动目录（含逐题锚点） ──
    h += '<div class="section"><h2>🧭 本文目录</h2>';
    h += '<div style="column-width:250px;column-gap:26px;font-size:0.8em;line-height:1.85">';
    data.sections.forEach(function(sec){
      h += '<div style="padding:2px 0"><a href="#' + _dynSectionLink(sec) + '" style="color:var(--gold);text-decoration:none;font-weight:600">' + (sec.icon||'') + ' ' + sec.title + '</a> <span style="color:var(--text2);font-size:0.85em">(' + ((sec.topics||[]).length) + '题)</span></div>';
      (sec.topics||[]).forEach(function(t,i){
        h += '<div style="padding-left:16px"><a href="#' + _dynTopicLink(sec,i) + '" style="color:var(--text2);text-decoration:none">· ' + t.title + '</a></div>';
      });
    });
    if (data.references) h += '<div style="padding:2px 0"><a href="#avs-dyn-refs" style="color:var(--gold);text-decoration:none;font-weight:600">📚 参考文献</a></div>';
    h += '</div></div>';
    // ── 全文（连续展开） ──
    h += '<div class="section" style="border-left:4px solid var(--gold)" id="article-full"><h2>📄 ' + title + ' · 全文</h2>';
    data.sections.forEach(function(sec){
      h += '<div id="' + _dynSectionLink(sec) + '">';
      h += '<h3 style="color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:18px">' + (sec.icon||'📌') + ' ' + sec.title + ' <span style="font-size:0.6em;color:var(--text2);font-weight:400">(' + ((sec.topics||[]).length) + '题)</span></h3>';
      if (sec.title_en) h += '<div class="en-line" style="font-size:0.74em;color:var(--text2);font-style:italic">' + sec.title_en + '</div>';
      if (sec.intro) h += '<p style="font-size:0.82em;color:var(--text2);line-height:1.8;white-space:pre-line">' + _dynMD(sec.intro) + '</p>';
      if (sec.intro_en) h += '<div class="en-line" style="font-size:0.78em;color:var(--text2);line-height:1.8;white-space:pre-line">📖 ' + _dynMD(sec.intro_en) + '</div>';
      (sec.topics||[]).forEach(function(t,i){
        h += '<div id="' + _dynTopicLink(sec,i) + '" style="margin:14px 0 4px;padding-left:14px;border-left:3px solid rgba(94,139,158,0.25);">';
        h += '<div style="font-size:0.92em;color:var(--blue);font-weight:600">' + (i+1) + '. ' + t.title;
        if (t.title_en) h += ' <span class="en-line" style="color:var(--text2);font-weight:400;font-style:italic;font-size:0.82em">(' + t.title_en + ')</span>';
        h += '</div>';
        h += '<div style="font-size:0.8em;line-height:1.8;white-space:pre-line;margin-top:4px">' + _dynMD(t.body) + '</div>';
        if (t.en_body) h += '<div class="en-line" style="font-size:0.78em;color:var(--text2);line-height:1.8;white-space:pre-line;margin-top:6px">📖 ' + _dynMD(t.en_body) + '</div>';
        var srcs = t.sources || (t.source ? [t.source] : []);
        if (srcs.length) {
          h += '<div style="font-size:0.7em;color:var(--text2);margin-top:6px">📎 ';
          srcs.forEach(function(s,si){ h += (si>0?'<br>':'') + _dynMD(s); });
          h += '</div>';
        }
        if (t.links) {
          h += '<div style="font-size:0.7em;margin-top:2px">';
          Object.keys(t.links).forEach(function(k){ h += '<a href="' + t.links[k] + '" target=_blank style="color:var(--blue)">🔗 ' + k + '</a> '; });
          h += '</div>';
        }
        h += '</div>';
      });
      h += '</div>';
    });
    h += '</div>';
    if (data.references) {
      h += '<div class="section" id="avs-dyn-refs"><h2>📚 参考文献</h2><ul style="font-size:0.8em;line-height:1.9;white-space:pre-line">';
      data.references.forEach(function(r){ h += '<li>' + _dynMD(r) + '</li>'; });
      h += '</ul></div>';
    }
    // ── 页脚 ──
    h += '<div style="margin-top:18px;padding-top:10px;border-top:1px solid var(--line);font-size:0.74em;color:var(--text2)">';
    h += '<a href="index.html" style="color:var(--blue);text-decoration:none">📚 返回独立文章目录</a>';
    if (backTab) h += ' · <a href="' + backTab + '" style="color:var(--blue);text-decoration:none">' + backLabel + '</a>';
    h += '</div>';
    return h;
  }
  // ── 折叠门布局（panjiao 等，默认） ──
  h += '<div style="font-size:0.74em;margin:4px 0 10px;color:var(--text2);display:flex;flex-wrap:wrap;gap:3px 12px">';
  data.sections.forEach(function(sec){ h += '<a href="#' + _dynSectionLink(sec) + '" style="color:var(--blue);text-decoration:none;white-space:nowrap">' + (sec.icon||'') + sec.title + '</a>'; });
  if (data.references) h += '<a href="#avs-dyn-refs" style="color:var(--blue);text-decoration:none;white-space:nowrap">📚 参考文献</a>';
  h += '</div>';
  data.sections.forEach(function(sec) {
    h += '<div class=section id=' + _dynSectionLink(sec) + '>';
    h += '<h2>' + (sec.icon||'📌') + ' ' + sec.title + ' <span style="font-size:0.62em;color:var(--text2);font-weight:400">(' + ((sec.topics||[]).length) + '题)</span></h2>';
    if (sec.title_en) h += '<div class="en-line" style="font-size:0.74em;color:var(--text2);font-style:italic;margin:-4px 0 6px">' + sec.title_en + '</div>';
    if (sec.intro) h += '<p style="font-size:0.82em;color:var(--text2);line-height:1.8;white-space:pre-line">' + _dynMD(sec.intro) + '</p>';
    if (sec.intro_en) h += '<div class="en-line" style="font-size:0.78em;color:var(--text2);line-height:1.8;white-space:pre-line">📖 ' + _dynMD(sec.intro_en) + '</div>';
    (sec.topics||[]).forEach(function(t, i) {
      var doOpen = (sec.topics[0]===t && i===0) ? ' open' : '';
      h += '<div class="wu-door' + doOpen + '" onclick="this.classList.toggle(\'open\')"><span class=arrow>▶</span><span class=ttl>' + t.title + '</span>';
      if (t.title_en) h += ' <span class="en-line" style="color:var(--text2);font-weight:400;font-style:italic;font-size:0.8em">(' + t.title_en + ')</span>';
      h += '<div class=body><div style="font-size:0.8em;line-height:1.8;white-space:pre-line">' + _dynMD(t.body) + '</div>';
      if (t.en_body) h += '<div class="en-line" style="font-size:0.78em;color:var(--text2);line-height:1.8;white-space:pre-line;margin-top:6px">📖 ' + _dynMD(t.en_body) + '</div>';
      var srcs = t.sources || (t.source ? [t.source] : []);
      if (srcs.length) {
        h += '<div style="font-size:0.7em;color:var(--text2);margin-top:6px">📎 ';
        srcs.forEach(function(s,si){ h += (si>0?'<br>':'') + _dynMD(s); });
        h += '</div>';
      }
      if (t.links) {
        h += '<div style="font-size:0.7em;margin-top:2px">';
        Object.keys(t.links).forEach(function(k){ h += '<a href="' + t.links[k] + '" target=_blank style="color:var(--blue)">🔗 ' + k + '</a> '; });
        h += '</div>';
      }
      h += '</div></div>';
    });
    h += '</div>';
  });
  if (data.references) {
    h += '<div class=section id=avs-dyn-refs><h2>📚 参考文献</h2><ul style="font-size:0.8em;line-height:1.9">';
    data.references.forEach(function(r){ h += '<li>' + _dynMD(r) + '</li>'; });
    h += '</ul></div>';
  }
  return h;
}

renderDynTopics(GAP_DATA[ARTICLE.data_source], 'article');
document.getElementById("article-root").innerHTML = renderDynTopics(GAP_DATA[ARTICLE.data_source], 'article');
</script>
