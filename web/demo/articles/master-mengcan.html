var ARTICLE = {"id": "master-mengcan", "file": "articles/master-mengcan.html", "title": "梦参（梦老）", "title_sub": "华严祖师 · 近代华严弘扬巨擘 · 圆满讲解「地藏三经」", "icon": "🧑", "version": "", "meta": "", "doc": "docs/梦参老和尚_综合深度研究.md", "doc_md": "# 梦参老和尚（1915—2017）：生平、修行、思想与弘法事业综合深度研究\n\n> 研究说明：本文延续《李通玄长者综合深度研究》《圭峰宗密综合深度研究》《华严宗初祖杜顺综合深度研究》《华严宗二祖智俨综合深度研究》诸文的方法论与结构，依据**可回溯、可核验**的资料展开，对史源分歧或资料出入之处以\"存疑\"标出。\n>\n> **信源分级（按置信度降序）**：\n> 1. **老和尚本人自述**（晚年专访、讲经开示中的自述、〈梦参老和尚讲述开刀的亲身体验〉等实录整理）——内心历程（梦、狱、病、求法）的一手材料；\n> 2. **道场官方生平**：五台山真容寺治丧委员会《梦参长老生平》（新浪佛学、凤凰佛教刊布），以及由剃度弟子隆仁法师住持的乐清汉济寺\"上梦下参长老生平\"页（hanjitemple.cn）——两者时间线基本一致，是本文时间节点的主校准源；\n> 3. **出版方资料**：方广文化事业（梦参老和尚绝大部分讲记的出版者，长年随座录制）网站所列小传与书单，对讲经起讫、著作目录有独家记录；\n> 4. **整理性传记与访问记**：佛弟子文库《梦参老法师略传》、〈到紫云山访梦参老和尚〉、学佛网《96岁梦参老和尚自传》等——系统性强，个别早期说法相互出入；\n> 5. **二手汇编**（百度百科、维基百科等）——仅作旁证索引，不作为论证依据。\n>\n> 凡上列各源之间不一致者，正文均已如实存目并以\"存疑\"标出。\n\n---\n\n## 前言\n\n在华严宗近代复兴的历史图景中，梦参老和尚（1915—2017）占据着一个独特而醒目的位置。他不是严格意义上的\"华严祖师\"，不由杜顺—智俨—法藏—澄观—宗密的官方祖统谱系推出；他显密兼修、教戒并弘，身历民国军阀时代、抗战、西藏求法时期、三十余年牢狱、改革开放后的佛学院重建、以及两岸三地与海外华人佛教的数十年，其道场足迹遍及黑龙江、北京、福建、青岛、西藏、四川、厦门、美国（纽约、洛杉矶）、加拿大（温哥华）、台湾、香港与五台山。他一生中无数个决定命运的去向，几乎都系于\"梦\"的指引——\"梦参\"这个自号，既是自谦（\"我没有觉也没有醒\"），也是自我定位：以梦为参，以参悟梦之既真且幻来勘验\"观梦自在\"的华严学智慧。\n\n在华严学传统内部，梦参老和尚的贡献集中在两处。其一，他在五台山普寿寺以九十三岁高龄、历经三年余讲完《大方广佛华严经》（八十华严）全本共五百余座，创下中国佛教史上讲解《华严经》年龄最高的纪录之一，其《八十华严讲述》（方广文化）成为当代最重要的华严全经讲记。其二，他与慈舟、倓虚、弘一三位师长的因缘链环，使他成为近代以来在莲池、藕益、弘一之后圆满讲解《地藏三经》并亲自教导占察轮相制作与使用的法师，将\"地藏三经\"从超度亡者的民间定位，重新提升为末法时代摄机广大、仗他力而可修的殊胜法门。\n\n汉济寺生平页对其一生的概括言简意赅：\"近百年来，长老亲炙虚云、慈舟、倓虚、弘一等近代高僧，显密兼修、教律并弘，尤以宣讲《华严经》《地藏三经》闻名……垂暮之年，仍不惜老病之躯，现身说法，俨然深山中的明灯，堪为中国佛教之龙象。\"本文即尝试对这位\"深山中的一盏明灯\"，作尽可能全面、审慎、且注重史料来源层次的深度研究。全文以生平七段为经，以华严、地藏两大法门为纬，最后集中辨析传记录述中的存疑之处，并如实呈现当代研究现状与空白。\n\n---\n\n## 一、生平概述\n\n### 1.1 出生与少年：1915—1931\n\n梦参老和尚于1915年7月13日（农历乙卯年六月初二）出生于中国黑龙江省开通县（今吉林省白城地区通榆县），俗名刘瑞庭。据其晚年访谈与传记材料，他自幼生长于信仰外道的家庭（存疑：见后），且曾有\"傻子还想吃东西，应该不是真傻\"之类的童稚疑问，被视为慧根早露——此系后世传记文学的追述式笔法，本文存目不作史实论。\n\n1928年，年仅十三岁的他入东北讲武堂军校。1931年九一八事变后，东北讲武堂撤至北京，但在此时，他的人生发生了根本转向。\n\n### 1.2 因梦出家：1931 兜率寺剃度、拈花寺受戒\n\n1931年（尚在军中），他梦见自己坠入大海，一位老人（一作\"老太太\"，两说并存，存疑）以小船将他救起，并指示他前往一处\"宫殿般的地方\"，说那是他\"一生的归宿\"。醒后询问多人，确认梦中的宫殿境界就是北京房山县上方山的寺院，遂于当年底前往上方山兜率寺，依止修林和尚出家。剃度法名\"觉醒\"；但他自谦\"觉也没有醒\"，又因作梦因缘出家，便自己取号为\"梦参\"。\n\n同年，他在北京拈花寺依止全朗和尚受具足戒。戒期圆满后，南下九华山朝礼地藏菩萨道场，正遇开启地藏菩萨肉身宝塔的法会（\"六十年一遇\"之说出自部分整理读物，存疑）。此次参礼，被各方传记视为他日后弘扬地藏法门的深远缘起。\n\n### 1.3 鼓山法界学苑：1932—1935 依止慈舟学《华严经》\n\n1932年，他转赴福建福州鼓山涌泉寺，自述对涌泉寺的一切\"似曾相似，仿佛故地重来\"。当时虚云老和尚于鼓山创办法界学苑，请慈舟老法师主讲《华严经》，他决定依止慈舟老法师学习《华严经》与戒律。\n\n最初约半年苦于无法契入华严义海，遂向慈舟老法师请法，依其教授，日夜读诵礼拜《普贤行愿品》，并以燃身、燃臂供佛的苦行开启智慧（北方受戒不烧戒疤，即以身背燃灯供养，燃灯一次约两个多钟头，持续二三个月），此后自然而然便能听懂慈老法师所讲《华严经》。他先后在法界学苑学习《华严经》，圆满于1935年——年限有\"历时三年\"（汉济寺生平）与\"约五年\"（新浪讣告、佛弟子文库略传）两说，存疑。除依止慈舟老法师学习经教外，他更旁及虚云老和尚的禅法，并常奉慈舟老法师指示代讲经论（如《阿弥陀经》）。当时的同学包括台湾的道源长老、灵源长老、慧三长老，以及大陆的净严法师——这批同门后来成为海峡两岸华严、戒律传承的重要节点。\n\n### 1.4 青岛湛山寺与弘一大师：1936—1940\n\n1936年，他赴青岛湛山寺，依止倓虚老法师学天台四教，并担任湛山寺书记，负责倓虚老法师的庶务与对外联络。在湛山寺期间，他积极宣扬慈舟老法师的戒律精神，奉倓虚老法师之命迎请慈舟老法师北上湛山讲律，又护送慈舟老法师到北京开讲《华严经》（汉济寺生平）。\n\n1936年底，他再奉倓虚老法师之命赴福建厦门，礼请弘一大师北上弘律（时间另有\"1936年秋末\"\"1937年\"之说，存疑）。因《梵网经》的讲法因缘，弘一大师同意北上湛山寺开讲《随机羯磨》。此后约半年，他担任弘一大师的外护，深受弘一大师身教熏染；期间就近依《占察善恶业报经》所述占察轮相，请弘一大师亲手制作一副以供修习。弘一大师为答谢他半年的外护，亲赠手书的〈净行品〉偈颂一本（此书法后随北京法源寺文物毁于文革期间），并嘱托他弘扬《地藏三经》。\n\n1937—1940年间，他随同倓虚老法师在长春般若寺传戒、宣讲四分戒律，并往来于东北各省、北京、天津、山东等地讲经弘法；其间接触了来自西藏的藏僧，引动赴藏求法的因缘。他在北京期间以善巧方便，掩护许多国共两党的抗日分子幸免于难。\n\n### 1.5 入藏求法：1940—1950\n\n1940年，终因掩护抗日分子遭检举、为逃避日军追捕，他乔装成雍和宫年轻喇嘛的身份（顶替一位已故侍者的身份持其护照）离开北京，经上海、香港，转往印度再赴西藏求法；旅费由香港方养秋居士鼎力资助（此段细节出自其自述，个别传记作1937年即开始接触藏僧、1941年经由海路入藏，本文以1940年出逃、约1941年抵藏为主体，存疑列出）。\n\n抵达西藏后，他在黄教三大寺之一的色拉寺依止夏巴仁波切修学菩提道次第，又依止赤江仁波切（第十世班禅之师）、灵仓仁波切等，并由能海老法师引进参拜康萨仁波切；藏传法名\"滚却图登\"（义\"具圆妙法\"之类，确切译法诸说不一，存疑）。他在拉萨修学约五年，后因藏区排汉风潮，转往青海、西康等地游历参学，总计在西藏修学约十年（约1941—1950）。\n\n1949年底，在夏巴仁波切与梦境的催促下，他离开藏区。其自述：\"后来我一直在西藏住到50年代，参学，研修整整十年。解放西藏之前，西藏局势不稳，我就从拉萨去了西康，去了没过多久西藏就解放了。\"\n\n### 1.6 牢狱三十三载：1950—1982\n\n1950年元月，正值青壮年的他于四川甘孜，因不愿意放弃僧人身份、不愿意进藏参与工作，虽经两年学习改造依旧不愿还俗，遂被捕入狱；又因在狱中宣传佛法，被以\"反革命\"之名判处有期徒刑十五年、劳动改造十八年，共计蒙冤三十三年（汉济寺生平页总括为\"一九五〇年至一九八二年蒙冤入狱三十三年\"）。自此\"梦参\"的名字在狱中被各种代号所替换。\n\n狱中境遇与观照（据老和尚自述系统整理）：\n- 他常诵持\"假使热铁轮，在汝顶上旋，终不以此苦，退失菩提心\"（语出《华严经》，亦见《大方便佛报恩经》）一偈以安其心；\n- 把牢房观想为闭关之所，\"门外有解放军站岗护法，每天衣食无缺，虎狮不侵\"；遭遇拷打时观想\"在母亲肚里就是这样，现在只是恢复原状\"，\"有觉觉痛，无痛痛觉\"；\n- 狱中第十年，因一批初入狱的喇嘛需要翻译，他不愿以僧人之身充当俗世传话工作，一夜间将十年所学藏语忘得一干二净，此举更增添狱期；\n- 入狱第二十二年时萌生绝命之念，当夜梦见有人请他讲经、法台极高、忽有老师父将他托上去，醒后由此安心，不复作此念。\n\n1982年秋，中央落实宗教政策，他以\"事出有因，查无实据\"获释平反出狱（汉济寺、新浪两版生平均作1982年；至于他自述\"1981年已在中国佛学院为正果法师代课、并曾在佛学院任教\"，与官方表的先后次序略有出入，存疑），时年六十九岁。出狱的第一件事便是换上袈裟，恢复出家人应有的威仪。他发愿以未来三十三年补足这段失落的岁月——此后三十余年，他弘法足迹遍布五大洲，直至九十三岁讲完八十华严。\n\n### 1.7 重建与海外弘法：1982—2001\n\n出狱后，他自四川返回北京落户，任教于北京中国佛学院，以讲师身份讲述《四分律》，迈出重新弘法的第一步。\n\n1984年，他接受福建南普陀寺妙湛老和尚、圆拙长老之邀赴厦门，协助重建闽南佛学院，并担任教务长一职。他一方面培育新一代僧人，一方面开讲《华严经》——这是他以九十三岁圆满讲完八十华严之前，最重要的一次华严讲说（后因赴美讲至〈离世间品〉——一作\"〈离世间品〉\"——而中止）。1987年，应美国万佛城宣化上人之邀首次访美（参与首次在美举办的陆空法会等），在美停留约一个月后返回福建。\n\n1988—1989年间，他旅居美国（定居年份有\"1988年\"与\"1989年\"两说，存疑）：先居于纽约，在菩提心基金会等协助下于纽约菩提学会等处开讲《占察善恶业报经》等地藏法门逾五年，由弟子誊录成书；又应洛杉矶妙法院旭朗法师之请，开讲《占察善恶业报经》《华严经·普贤行愿品》《地藏经》《心经》《金刚经》等。另有信众访问记提及，1989年美国佛教会曾有意礼请他担任纽约庄严寺方丈，因缘不具而未成（存疑，见访问记）。旅居纽约期间，据其自述，有三四个月断断续续作梦，梦见自己的前世\"从唐末开始到现生\"，\"像章回小说似的\"，使他了知宿世因缘。\n\n1991年，他应台北居士之请在新店开讲《占察善恶业报经》。原本不收弟子的他，该年底（农历十二月，据整理读物为暂归弥陀诞日的1991年12月22日，存疑）因种种因缘收了生平第一位弟子——陈鹤山（即海云继梦法师），为其剃度，赐法名\"昌一\"、号\"继梦\"（继承梦公弘扬华严一乘之愿）。此后他又陆续在新店花园精舍开讲《法界三观》、清泉会馆讲《华严经·净行品》等。\n\n1995年9月，旅居加拿大温哥华的三宝弟子礼请他初讲《大乘大集地藏十轮经》。同年（八十岁时）他自知罹患直肠癌，原欲放弃手术、专心念佛往生；弟子们不舍其受病苦，极力安排治疗。1996年元月，他在台湾接受手术治疗（据老和尚自述〈梦参老和尚讲述开刀的亲身体验〉：\"当我到台湾动手术开刀的时候（一九九六年元月）\"），术后以\"定时定量\"的善巧把造口护理控制到日一次，辅以信心修持，此后二十年间完全不影响弘法（详见第五章5.3节）。1998年夏，应五台山普寿寺律学院僧众之请，完整讲解《占察善恶业报经》。\n\n1999—2000年间，他开始于浙江雁荡山复建祖庭能仁寺（新浪讣告作2000年；佛弟子文库略传谓2004年前往修复，存疑），2008年10月中旬复建圆满，恭请了法法师任住持。2001年起（汉济寺生平页作2003年，存疑），他应邀常住五台山普寿寺讲经，并指导圣宝山愿成寺的僧众静修。\n\n### 1.8 五台山圆满：2004—2017\n\n2004年农历二月初二，他应普寿寺之请开讲《大方广佛华严经》（八十华严）全本（开讲年份另有真容寺治丧生平\"2003至2007年\"之说，存疑；方广文化出版方与汉济寺生平均作\"2004年开讲、至2007年圆满\"，历经约三年余至2007年圆满，共五百余座）。这是他一生的最高愿望，也是晚年\"落叶归根\"式的圆满。其间，又应各地皈依弟子之请，于2006年在普寿寺开讲《大乘大集地藏十轮经》（共七十三座圆满，方广文化出版方记载），并陆续开讲《法华经》《楞严经》等大乘经论（《楞严经》续讲圆满的时间与季节诸说不一，存疑）。\n\n2008年1月，他再次应台湾弟子祈请赴台弘法四十五天，讲经开示十余场并举办千人大法会，适逢台湾生命电视台每日定时播出他所讲的《华严经》。2009年春节，他在台北国际会议中心复讲《占察善恶业报经》，盛况空前，礼堂一再扩容、听众最多时达两千人之众，法会圆满日再举行三千人皈依法会，成为台湾佛教界弘法美谈；其后赴香港，于香港理工大学宣讲《法华经》大意、并于香港大学佛学研究所作佛学开示，听众上千（具体月份有5月/6月两说，存疑）。2010年秋，应中华佛教文化院之邀，参加在香港举行的\"首届中华佛教宗风论坛\"。\n\n2012年，他应五台山政府之请复建万佛洞真容寺，命弟子隆明主持复建具体事宜；2013年起，定居真容寺觉林丈室静修（有过\"2014年由深圳梦参精舍前往安居\"之说，存疑），以百岁高龄复兴道场，除身体违和外，一直维持定时定量的个人日课并接引信众。\n\n2017年11月27日（农历丁酉年十月初十）16时30分，梦参老和尚于五台山真容寺安详示寂，世寿一百零三虚岁，僧腊八十七载。12月3日，追思法会及荼毗法会于五台山举行；其后于真容寺分拣舍利、奉安灵骨。\n\n---\n\n## 二、师承与法脉\n\n### 2.1 依止四位大德：慈舟、倓虚、弘一与虚云\n\n梦参老和尚毕生学法，师承几乎囊括二十世纪上半叶中国北方汉传佛教最重要的人物：**慈舟老法师**授以《华严经》与戒律（鼓山法界学苑），**倓虚老法师**授以天台四教（青岛湛山寺），**弘一大师**授以戒律精神、占察轮相并付嘱《地藏三经》，而**虚云老和尚**创办的法界学苑提供了学习华严的场域，其禅法亦为梦参所旁及。这四位师长分别代表了民国佛教的持律、天台、华严与禅四大传统，梦参老和尚后来\"显密兼修、教戒并弘\"的格局，至此四根已备。\n\n### 2.2 鼓山法界学苑的华严传承与同门\n\n法界学苑由虚云老和尚于鼓山创办，请慈舟老法师主讲《华严经》。梦参老和尚在此学习《华严经》约三年（一说五年），起初半年不契，经慈舟老法师指导以读诵礼拜《普贤行愿品》、燃身燃臂供佛的苦行而忽然能解。慈舟老法师受持华严、精严戒律，讲经兼摄解行。梦参老和尚的同门中，道源长老、灵源长老、慧三长老后来皆赴台湾弘化，成为台湾佛教戒律与华严传承的重要人物——这批\"鼓山同学\"的存在，使法界学苑成为海峡两岸华严、戒律法脉的共同源头之一。\n\n### 2.3 弘一大师：戒律与地藏法门的付嘱\n\n在梦参老和尚的师承谱系中，弘一大师的授受尤具决定性。1936年底，他奉倓虚老法师之命赴厦门礼请弘一大师北上湛山寺开讲《随机羯磨》，因《梵网经》讲法因缘而获应允，其后担任外护约半年。期间（一）听受并请弘一大师亲手制作占察轮相；（二）受弘一大师\"誓作地藏孤臣\"精神感召；（三）亲蒙弘一大师题赠〈净行品〉偈颂；（四）受其嘱托弘扬《地藏三经》。梦参老和尚晚年回忆，他当时曾请教弘一大师：\"观音菩萨来弘扬地藏菩萨，那观音菩萨就不能把问题都解决了吗？\"弘一答：\"但是地狱的、三恶道的，还是地藏菩萨的效果大。\"——这句话成为他日后兼弘观音、地藏而又特别强调地藏法门殊胜的师门注脚（参见第四章4.3节）。\n\n### 2.4 临济法脉与法嗣\n\n梦参老和尚的临济宗法脉代次，本项目整理数据显示为**临济宗第四十六代**（其剃度弟子海云继梦为第四十七代）——此世系谱的完整可靠性存疑，仅为一说。1991年，他破例剃度陈鹤山居士为第一位弟子（赐法名\"昌一\"、号\"继梦\"）；海云继梦后来在台湾创办大华严寺、倡\"华严生命教育\"，是梦参法脉在华严当代表达中最具影响力的延伸（本仓库另见《docs/ref海云继梦法师_佛法修行体系研究.md》等专题资料）。此外，2000年于雁荡山能仁寺在他座下披剃的隆仁法师（今乐清汉济寺住持），明确\"承接梦参长老的地藏法脉\"，致力于弘扬地藏法门，并长期刊布梦参老和尚的《占察经》《地藏经》等开示法语。其剃度弟子总数多，官方评价\"剃度弟子遍及中国大陆、台湾、香港、新加坡、美国等地区\"。\n\n---\n\n## 三、华严思想与修行\n\n### 3.1 一门深入：以华严为归\n\n梦参老和尚初学即从《华严经》入（其自述\"我初学就是从《华严经》入的\"），在鼓山随慈舟老法师学完整部《华严经》。他一生讲经无数，从《阿弥陀经》《地藏经》《占察经》《心经》《金刚经》《法华经》《楞严经》到大小经论，但始终以《华严经》为\"经中之王\"、为其修学与讲说的最高归趣。\"志在弘扬《大方广佛华严经》\"是他入佛门便有的心愿，但因众生福报因缘，这个愿望直到九十三岁方才圆满。\n\n### 3.2 \"善用其心\"：华严境界的生活化\n\n他讲《华严经·净行品》，特别拈出\"善用其心\"四字作为华严修学的总纲——\"现在我们闻到佛法，随时缘念佛、缘念法、缘念僧，这就叫修行，就是'善用其心'\"。\"看不能领悟，不能领悟就种个善根，这就是华严境界。\"在他看来，《华严经》的大方广佛境界并非高不可攀的玄谈，而是落实到日用云为之间的一念心的善用。他常说：\"修行要和日常生活相结合。心越开阔，烦恼就越少，智慧越增长，一切事就看你怎样用心。\"这种把华严圆融境界拉回现实生活、以\"用心\"为枢机的讲法风格，是他区别于义学讲授的最明显特征。\n\n### 3.3 念念圆融：正念、念佛与华严\n\n在梦中、狱中、病中、讲经中，他反复回到\"一念\"的主题：\"一念，这个念是正念，一念正念。念什么？向无念处去，这一念向无念的念。一念要达到无念，连这一念也没有了。若有第二念，达不到本心了。\"他又常以华严与净土打通讲：念一句阿弥陀佛可以\"念到自他不二，念自性佛\"；\"念一句阿弥陀佛包括一部华严经，这你信吗？这就要看你怎么念了。\"这种以华严最高境界收摄净土念佛、又以念佛为华严方便的自在融通，正是他\"显密兼修、教戒并弘\"而不落门户的典型表现。\n\n### 3.4 苦行开慧：燃身燃臂与礼拜普贤行愿品\n\n梦参老和尚慧解的开启，有一个极具华严\"信解行证\"色彩的关键节点——1932年前后在鼓山，他初闻《华严经》约半年不契，遂依慈舟老法师的教授，日夜礼拜读诵《普贤行愿品》，并以身背燃灯供养：\"燃灯一次大概两个多钟头，这样做了大概有二、三个月，那就好了，自然而然的、不晓得怎么的，慈老法师讲《华严经》我都听的懂了。\"他日后每每以此开示后学：**解不了经，不是知性方法的问题，而是障重福薄、需要以苦行与对普贤愿力的全身心依止来开启宿慧**。这一经验与他晚年以九十三岁高龄圆满讲完八十华严，在精神上一脉相承——华严之学，本质上仍是行门的学问。\n\n### 3.5 八十华严五百余座：当代讲经纪录\n\n2004年农历二月初二至2007年，他在五台山普寿寺以九十三岁高龄讲完《大方广佛华严经》（八十华严）全本，共五百余座（开讲年份另有\"2003—2007\"一说，随之\"历时三年余/五年余\"两说，存疑）。此事件在当时被评价为讲解《华严经》年龄最高、历时最长的法师纪录之一（教界与整理读物之称，非学术定论）。其逐品逐卷的讲述由弟子整理为《八十华严讲述》十二册（第一会至第四会，方广文化）出版，成为继唐智俨《搜玄记》、法藏《探玄记》、澄观《华严经疏》、李通玄《新华严经论》之后，现代汉语语境下一部罕见的华严全经逐品讲记。\n\n### 3.6 三大师成就地藏法门：师承链环\n\n梦参老和尚自己曾总结，他得以弘扬《地藏三经》，得力于三位师长无意间的促成：在法界学苑学习华严圆满后经慈舟老法师介绍到湛山寺依止倓虚老法师天台教义，又奉倓虚老法师之命迎请弘一法师北上弘律，在半年外护期间圆满知悉《地藏三经》、并受弘一法师付嘱继续弘扬。慈舟结华严缘、倓虚结天台缘、弘一付嘱地藏——三位师长的接力，恰好构成他一生\"华严为体、地藏为用\"的最深因缘图谱。\n\n---\n\n## 四、地藏法门\n\n### 4.1 地藏三经的圆满讲解\n\n梦参老和尚的地藏法门弘扬，教界普遍称其为继莲池大师、藕益大师、弘一大师之后，圆满讲解《地藏三经》的法师——《占察善恶业报经》《地藏菩萨本愿经》《大乘大集地藏十轮经》三部地藏专经，他均逐品讲解且多次重讲（《占察经》：约1988—1989年纽约、1991年台北新店、1998年普寿寺、2009年台北；《地藏十轮经》：1995年温哥华、2002年香港东莲觉苑、2006年普寿寺；《地藏经》讲记与浅释自成系统）。他同时亲自教导占察轮相的制作与使用，并以占察忏悔法接引众多不得如法受戒、或欲消业除障的在家出家行者。**需说明：\"史上唯一/第一位圆满讲解地藏三经的法师\"一类表述，出自佛教网络与教界介绍，本文如实转述为教界评价，不作学术定论。**\n\n### 4.2 占察轮相：制作、修学与弘扬\n\n占察轮相出自《占察善恶业报经》，是地藏菩萨所说用于占察三业清净与否的木制轮相，与占察忏悔法配合，为末法无清净戒师时代提供\"自誓受戒\"的方便（藕益大师即依此得戒）。梦参老和尚与占察轮相的因缘始于弘一大师——1936年底至1937年间，他依经所述请弘一大师亲手制作一副，此后多年修习（\"史上第一副''占察轮相出现于世\"之说出自教界整理读物，存疑，学界无从独立核实）。他学得木轮相法后自述\"非常相应\"，此后数十年中只要安定即恢复拜《占察忏》。他将占察法门提炼为生活化的修行：\"在日常生活当中，你要摆脱很多痛苦、危难、忧恼，自己没办法，那你就占察一下，地藏王菩萨就会告诉你并且帮助你。\"他又强调拜占察轮必须真实、须得三业清净之轮相，不可冒充，并援引藕益大师依《占察经》自誓受戒的史实以明此法渊源。\n\n### 4.3 \"地藏菩萨与娑婆世界缘特别深\"：仗他力与末法摄机\n\n梦参老和尚对地藏法门的根本定位，在一则广为流传的开示中说得最透：\"地藏菩萨跟娑婆世界缘特别深，专解决三途苦难的——地狱、饿鬼、畜生。\"\"我所到的好多地方，要弘扬地藏三经的时候，效果特别大……在讲《占察善恶业报经》，效果就非常殊胜，一天最多是三千多人。\"他以\"仗他力\"注解《地藏经》摄机之广：\"因为《地藏经》是仗他力的，不是靠我们自力修行的，我们只要念念经，乃至于只要念地藏王菩萨圣号就可以得到好处……现在这个时代是末法时代，而这个世界叫五浊恶世，我们自己的力量很薄弱，障缘很多，修起来也很困难。因此要找一些仗他力的经典，《地藏经》是最合适的。\"这种\"法无大小，由修行人来定\"的圆融立场——他明确说过\"《地藏经》跟《华严经》一样的，不是光是地狱\"——使他的地藏学说不落入鬼神化的浅俗，而成为末法摄机甚广、又与华严圆教相通的修行方便。\n\n### 4.4 临终修法与日常应用\n\n他特别重视《地藏经》的临终修法（其〈浅谈地藏菩萨的临终修法〉一文即专论临终时节的修持方法），将读诵、称名、布施回向组织为可操作的临终关怀法门；同时又把地藏法门落实到现实生活——家宅平安、事业顺遂、消灾免难、眷属和合：\"如果你说你求家宅平安，求家庭的成员平安，就是灾害减少，生活过得幸福一点；或者做的事业能够得到成就，想发财……这种都是属于小乘的，是你心量小，不是法的问题。效果有没有呢？当然是有。\"他向信众开示\"念地藏菩萨解决障碍\"、\"把自心变成地藏\"，使地藏法门在当代城市信众中获得极大的现实亲和力。\n\n---\n\n## 五、修行观照与生命智慧\n\n### 5.1 梦观：观梦自在\n\n\"梦参\"之名，既是自谦，也是他最重要的修行主题与教学法门。他一生中每一次重大去向——出家、朝九华山、到鼓山、不离佛学院、狱中\"讲经之梦\"、纽约\"前世之梦\"——都系于梦。但他对\"梦\"的态度绝不是一个迷信的人，\"有道友问老和尚：梦是正确的吗？老和尚说假使你执着梦是真的，那就错了，佛告诉你如梦幻泡影；假使你当假的，对我来说梦是很真。\"他将《金刚经》\"如梦幻泡影\"之教与他对自身梦之实感的体验，收摄于一：\"真真假假，认真非真，认假非假，非真非假，观梦自在。\"这一\"观梦自在\"的四字总纲，实为华严\"事事无碍、重重无尽\"境界在识心层面的一种极为个人化的印证。\n\n### 5.2 牢狱观想：以华严偈颂安其心\n\n三十三年牢狱，是他自述\"真正的修行\"之所（\"我学讲经是调皮的，不是真实的，我真正的修行还幸亏住监狱\"）。他所诵持以自安的《华严经》偈\"假使热铁轮，在汝顶上旋，终不以此苦，退失菩提心\"，本是《华严经》赞叹菩萨大愿勇健之语（亦见《大方便佛报恩经》），在他这里却成为在极端处境下维系法身慧命、安然度过政治风暴的命根。出狱后他从不抱怨，而视之为\"自作自受、因果公平\"的代受业报之教，这种既不讳言苦难、又不以苦难诿过于人的态度，构成他\"历事炼心\"修行观最动人的注脚。\n\n### 5.3 老病观：直肠癌与\"八苦交煎总不妨\"\n\n八十岁时，他得知罹患直肠癌，因届高龄本想不手术、\"只等清清楚楚往生\"；弟子们不愿不舍，极力安排治疗，1996年元月在台湾接受手术。术后医生告知\"不能再讲经，也不能到大众间去，因为气味很大，估计您可存活五年\"（据访问记引述）。他以\"定时定量\"的善巧把造口护理控制到日一次，辅以信心修持，此后十余年间完全不影响弘法。他以此现身说法：\"对治老病最好的方法就是学佛法，当你明白如何来对待自己的生老病死时，不但控制死，还控制未来的生，生要生的自由，死要死的自在。\"他援引宋代真歇清了禅师\"八苦交煎总不妨\"之偈鼓励病者：\"如果障碍来了，我们有办法对治它，不怕它来，这叫真本事。\"\n\n### 5.4 补足三十三年：以愿力重燃法灯\n\n出狱时他已六十九岁。他把\"三十三年\"视为被剥夺的弘法岁月，立志\"以未来三十三年补足这段失落的岁月\"——从1982年到2015年前后，恰恰是三十余年弘法生涯，横跨中国佛学院、闽南佛学院、美国、加拿大、台湾、香港、新加坡与五台山，最终以九十三岁\"五百余座\"讲完八十华严作结。\n\n### 5.5 生活佛法：信佛让你生活愉快、死的安逸\n\n他晚年对老病的开示感动无数信众：\"信佛让你生活愉快，死的安逸，此生完了生到极乐世界去，我想这是大家所愿的吧！\"他把高深教理化为生活格言式的一期一会：\"你最初听到哪部经，就是你入佛门的因缘。我初学就是从《华严经》入的。\"\"世间相的不平等，从哪里来的？\"在当代汉传佛教中，他以其平实、亲切、敢于自剖老病、把佛法与具体生活智慧结合起来的讲说风格，形成独特的\"梦参语录体\"，通过书籍、音像与网络广为流传。\n\n---\n\n## 六、著述与会讲\n\n### 6.1 华严系列（方广文化出版）\n\n- 《八十华严讲述》十二册（第一会至第四会）——2004—2007年普寿寺五百余座讲经之逐品整理，当代最重要华严全经讲记之一；\n- 华严三品：〈净行品讲述〉〈梵行品新讲〉〈普贤行愿品讲述〉；\n- 《大乘起信论浅述》《浅说华严大意》《普贤行愿品大意》《华严经疏论导读》。\n\n### 6.2 地藏系列（方广文化出版）\n\n- 《占察善恶业报经讲记》（出版书目作《占察善恶报经讲记》）《占察善恶业报经新讲》；\n- 《大乘大集地藏十轮经讲记》六册；\n- 《地藏经讲述》三册、《浅说地藏经大意》；\n- 《地藏止观导引：大乘大集地藏十轮经序品、十轮品新讲》（110岁冥诞纪念书，2024）；\n- 圆寂纪念结缘书：《地藏经浅释》《发心》《念佛》《佛说阿弥陀经浅释》《妙法》等。\n\n### 6.3 天台／般若／楞严系列与开示录（方广文化出版）\n\n- 天台：〈妙法莲华经导读〉〈妙法莲华经讲述〉（上下二册）；\n- 般若：〈般若心经讲述〉〈金刚经讲述〉〈浅说金刚经大意〉〈应无所住：金刚经十四堂课〉〈无相：金刚经略讲〉；\n- 楞严：〈浅说五十种禅定阴魔〉〈楞严经浅释〉（三册）；\n- 开示录：〈修行〉〈向佛陀学习〉〈禅简单启示〉〈正念〉〈观照〉〈善用其心：华严经净行品浅释〉〈登欢喜地〉〈梵行〉。\n\n### 6.4 讲经的现代传播\n\n梦参老和尚的讲经事业，堪称当代佛教\"融媒体\"传播的先行案例：台湾生命电视台2008年前后每日定时播出其《华严经》讲记；2009年台北复讲《占察经》时有听众两千人、几千人皈依之盛况；其讲经音频视频在喜马拉雅、YouTube、弘善佛教网等平台广为流传，文字由佛弟子文库、汉济寺（地藏法门专弘平台）等长期整理刊布。本仓库《data/practice/mengcan_lectures.yaml》即收录了\"梦参老和尚一生讲法全目\"并接入华严教行（Tab3）「讲法资源」视图。\n\n---\n\n## 七、道场建设与当代影响\n\n### 7.1 重建雁荡山能仁寺（2000—2008）\n\n能仁寺为宋代真歇清了禅师祖庭，禅师尝作能仁寺方丈、于此圆寂茶毗。梦参老和尚晚年自述：\"我从来没发愿修庙的，但是我现在为什么去修能仁寺？因为我在鼓山当小和尚时，学习期间很苦，看到真歇了禅师写的偈子非常感动……以此因缘才来修庙的。将来庙修好了我不会在那住，就请与寺有缘之人在那住持。\"新浪讣告作2000年于浙江重建雁荡山祖庭，佛弟子文库略传谓2004年前往修复（存疑），2008年10月复建圆满，恭请了法法师任住持。\n\n### 7.2 复兴五台山真容寺、支持普寿寺\n\n晚年他承通愿法师之遗愿嘱托，鼎力掖助其弟子兴建女众戒律道场——五台山普寿寺，从2001年起（一说2003年）长住普寿寺讲经、指导僧众并在此完成八十华严五百余座的大愿。2012年，他应五台山政府之请复建万佛洞真容寺（弟子隆明日任其事），2013年起定居真容寺，以百岁高龄复兴这座历史悠久的古道场，使之成为他晚年的常住处与安详示寂之地。\n\n### 7.3 剃度弟子与海内外影响\n\n他弘法足迹遍及中国、美国、加拿大、澳大利亚、新加坡、香港、台湾等地区，广开皈依、剃度因缘；剃度弟子遍及中国大陆、台湾、香港、新加坡、美国等地，其中以海云继梦法师（1991年剃度）的现代华严弘化影响最广，另有承其地藏法脉的隆仁法师（汉济寺）等。其圆寂时，治丧委员会由传印长老任名誉主任，学诚、蒋坚永任主任，班禅额尔德尼·确吉杰布等列名，吊唁者覆盖两岸三地及海外。\n\n### 7.4 圆寂与身后影响\n\n2017年11月27日示寂后，12月3日荼毗于五台山，其后分拣舍利、奉安灵骨。治丧委员会的挽联概括其一生：\"耆宿希有，显密共持，心如磐，身如雪，际五洲作育龙象，享百三遐龄，可称寿矣；大德罕遇，讲修并重，演华严，阐地藏，尽六时敷演大乘，遍三千世界，常怀慈耳。\"圆寂后，方广文化等持续出版纪念版结缘书（《妙法》《地藏经浅释》《登欢喜地》《善用其心》《地藏止观导引》《无相》等），其讲记与法语至今仍在两岸三地与海外持续传播。\n\n---\n\n## 八、史料辨析与研究现状\n\n### 8.1 传记史料的来源层次\n\n与古代祖师不同，梦参老和尚的传记材料以年代近、可得性高为特征，可分为以下五层（亦见文首\"研究说明\"分级）：\n\n1. **本人自述**：晚年专访及讲记、开示中的自述（如\"狱中三十三年\"\"前世之梦\"\"燃臂开慧\"等）——专述内心历程；\n2. **道场官方生平**：五台山真容寺治丧委员会《梦参长老生平》与乐清汉济寺\"上梦下参长老生平\"页——本为时间节点的主校准源，二者关键年份（兜率寺出家1931、拈花寺受戒1931、鼓山圆满1935、湛山1936、狱中1950—1982、平反1982、闽南佛学院1984、圆寂2017等）相互印证；\n3. **出版方资料**：方广文化事业小传与书单——对讲经起讫（2004—2007八十华严五百余座、2006十轮经73座）、著作目录有独家记录；\n4. **整理性传记与访问记**：佛弟子文库《梦参老法师略传》、〈到紫云山访梦参老和尚〉、学佛网《96岁梦参老和尚自传》等——系统性强，个别早期说法出入；\n5. **二手汇编**（百度百科、维基百科等）——仅作旁证索引。\n\n### 8.2 史实出入与存疑点清单\n\n- **八十华严开讲与起讫**：出版方（方广）与汉济寺生平均作\"2004年开讲至2007年圆满、五百余座\"；真容寺治丧生平作\"2003至2007年\"。随之\"历时三年余/五年余\"两说并存。本文以2004年农历二月初二开讲、至2007年圆满为主体，他说明列；\n- **常住普寿寺**：2001年（治丧生平）vs 2003年（汉济寺）；\n- **鼓山法界学苑年限**：历时三年、1935年圆满（汉济寺）vs \"约五年\"（新浪讣告、略传）；\n- **梦中救助者**：一位老人（汉济寺）vs 一位老太太（自述采访整理）；\n- **迎请弘一**：1936年底（汉济寺、新浪）vs 1936年秋末（略传）vs 1937年（他处）；\n- **赴藏时间与修学年限**：\"1940年出逃、约1941年抵拉萨、在藏约十年\"vs \"1937年即接触藏僧、1941年入藏修学五年后再游青海西康\"两说；\n- **旅居美国年份**：1988年（方广、菩提心基金会系统）vs 1989年（新浪）；\n- **复建能仁寺年份**：2000年（新浪）vs 2004年（略传）；\n- **定居真容寺**：2012年应请复建、2013年定居（汉济寺）vs \"2014年自深圳梦参精舍前往安居\"（他处）；\n- **香港宣讲《法华经》月份**：2009年5月（新浪）vs 6月（汉济寺）；\n- **中国佛学院任教起始**：自述\"1981年即代正果法师讲课\"vs 官方\"1982年平反后任教\"；\n- **世寿**：官方\"享寿103虚岁、僧腊87\"vs 逐周岁推算102；\n- **教界说法存目**：\"史上唯一圆满讲解地藏三经\"\"第一副占察轮相\"\"讲解华严年龄最高纪录\"等，均属教界与整理读物之评价，非学术定论。\n\n### 8.3 当代学术研究现状\n\n就公开检索所见，梦参老和尚的专题学术研究仍相对有限：中文语境下，他数百小时的讲经音像与数十册讲记，尚未被佛教思想史研究充分消化；以华严宗史、当代佛教复兴为题的学位论文与期刊论文偶有提及，但专题论著罕见。其在以下三方面的文献价值已渐受学界与教界认知：（一）**二十世纪中国佛教史**个案——\"入藏求法—蒙冤入狱—宗教政策落实—海外弘法\"的完整生命轨迹；（二）**华严讲经传统**在当代的延续样本（八十华严五百余座全本讲记）；（三）**地藏信仰的现代化**——占察法门与占察忏的复兴、生活化。本仓库《data/practice/mengcan_lectures.yaml》将其一生讲法全目整理为结构化数据，作为华严教行（Tab3）「讲法资源」的权威来源。英文、日文学界对其专题研究尚付阙如，本文如实存此空白。\n\n---\n\n## 九、历史地位评价\n\n综合上述，可将梦参老和尚在华严传统与当代佛教中的位置概括如下：\n\n**其一，他是近代华严法脉与当代华严复兴之间的直接桥梁。** 他亲承慈舟老法师鼓山法界学苑的华严学统，又将之带往五台山、美国、加拿大、台湾与香港；他以\"善用其心\"，把《净行品》从教理名相转成活用的修行指令；他以九十三岁高龄讲完八十华严五百余座，使华严全经在当代仍保有\"逐品可闻\"的活的讲经传统。\n\n**其二，他是\"地藏三经\"现代复兴的代表人物。** 在弘一大师之后，他以数十年的反复讲解与占察轮相的制作教授，使《占察善恶业报经》这一向来\"讲的人很少\"的法门重新获得系统的大众理解与操作依据；他把\"法无大小\"的圆融判教与\"仗他力\"的末法摄机相结合，为地藏信仰在中国现代化进程中提供了一套信实而圆活的当代讲法。\n\n**其三，他的\"梦观\"与\"狱中作道场\"，是华严\"事事无碍\"在现代极端处境下的个人印证。** \"观梦自在\"与\"假使热铁轮\"的生死体验，使他的一切华严玄谈都具有了亲身实证的分量——这也是他在海内外信众中感动面特广、而其言说又始终不离\"念心\"\"观照\"的根本原因。\n\n**其四，他强调显密兼修、教戒并弘、解行相应，其弘法足迹与剃度弟子遍及五大洲，为两岸与海外华人大乘佛教的当代传续提供了标志性案例。** 治丧委员会挽联\"演华严，阐地藏，尽六时敷演大乘\"八字，可作为其一生功业最凝练的定评。\n\n---\n\n## 参考文献\n\n### 一、道场官方生平（高置信，主校准源）\n\n1. 五台山真容寺治丧委员会《梦参长老生平》及《讣告》《追思法会安排》（2017年11月28日），新浪佛学、凤凰佛教刊布。\n2. 浙江乐清汉济寺（地藏道场专弘平台）〈上梦下参长老生平〉，hanjitemple.cn/p/mengcan.html——由剃度弟子隆仁法师住持的道场官方页。\n\n### 二、第一手材料（老和尚自述）\n\n3. 《梦参老和尚专访》（记者刘红青、董飞）——生平自述：出家因缘、狱中经历、\"前世之梦\"、燃臂开慧、请弘一制轮等。\n4. 〈梦参老和尚讲述开刀的亲身体验〉（佛弟子文库整理）——\"一九九六年元月台湾动手术\"的自述实录。\n5. 梦参老和尚历年讲经开示（《华严经·净行品》《地藏经》《占察善恶业报经》《大乘大集地藏十轮经》等），汉济寺〔梦老法语〕、佛弟子文库等整理刊布。\n\n### 三、出版方资料\n\n6. 方广文化事业《梦参老和尚》小传及《梦参老和尚（书籍）》出版书单，fangoan.com.tw——含八十华严讲述十二册、华严三品、地藏系列、天台系列、般若系列、楞严系列、开示录及圆寂纪念结缘书。\n\n### 四、整理性传记与访问记\n\n7. 《梦参老法师略传》，佛弟子文库（fodizi.net）。\n8. 〈因梦出家——梦参长老的传奇故事〉，佛弟子文库（fodizi.net）。\n9. 《96岁梦参老和尚自传》，学佛网（xuefo.net）。\n10. 〈到紫云山访梦参老和尚〉，佛弟子文库（2013）——信众访问记，涉及纽约庄严寺方丈之议及老病观。\n11. 《百岁高僧将33年牢狱生活当作闭关 靠\"做梦\"度过难关》，凤凰佛教（2017年11月29日）。\n\n### 五、本仓库相关数据与文档\n\n12. `data/practice/mengcan_lectures.yaml`——梦参老和尚一生讲法全目（接入华严教行 Tab3「讲法资源」）。\n13. `data/translation/huayan_masters.yaml`、`data/knowledge_graph/*`、`data/events/person_trajectories.yaml`——与华严祖师、临济法脉、梦参—海云继梦传承相关的图数据。\n14. `docs/ref海云继梦法师_佛法修行体系研究.md`、`data/practice/haiyun_chengguan_compare.yaml`、`data/practice/cultivation_system.yaml`——其剃度弟子海云继梦法师的专题资料。\n\n> 说明：本文未采用百度百科、维基百科条目作为论证依据；凡高置信来源（道场官方生平、出版方资料、老和尚自述）与整理读物不一致处，正文均已注明并存目于8.2节。", "back": {"tab": "gap", "view": "master-mengcan", "label": "华严文献 · 华严祖师"}};

  if(location.hash){
    setTimeout(function(){
      var el=document.getElementById(location.hash.slice(1));
      if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    },80);
  }
}

if(document.readyState!=='loading'){renderArticle();}
else{document.addEventListener('DOMContentLoaded',renderArticle);}

// ═══ 多语对读阅读模式：折叠/展开英文批注块 ═══
// 批注块特征：以「英译对读 / 节级英译要义 / 术语格义 / 主题对读注 / 卷末批注」开头的 blockquote 视作「外文批注」，
// 可一键切换「仅中文正文」阅读；页头「源文本/对读体例」等研究说明块不受影响。
function _initArticleENMode(){
  var s=document.getElementById('article-en-style');
  if(!s){
    s=document.createElement('style');
    s.id='article-en-style';
    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);
  }
  var full=document.getElementById('article-full');
  if(full&&!full.dataset.enMarked){
    full.dataset.enMarked='1';
    full.querySelectorAll('blockquote').forEach(function(bq){
      var txt=(bq.textContent||'').replace(/\s+/g,' ').trim();
      if(/^(英译对读|EN对应|🔑|术语格义|主题对读注|卷末批注)/.test(txt)) bq.classList.add('en-block');
    });
  }
  _applyArticleENMode();
}
function toggleArticleEN(){
  var cur=localStorage.getItem('article_en_hide')==='1';
  localStorage.setItem('article_en_hide', cur?'0':'1');
  _applyArticleENMode();
  var block=document.getElementById('article-full');
  if(block){
    block.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(function(){window.scrollBy(0,-140);},200);
  }
}
function _applyArticleENMode(){
  var full=document.getElementById('article-full');
  var btn=document.getElementById('article-en-toggle');
  var hide=localStorage.getItem('article_en_hide')==='1';
  if(full) full.classList.toggle('en-hidden', hide);
  if(btn) btn.textContent=hide?'🌐 英文批注：展开':'🌐 英文批注：显示';
}
</script>
