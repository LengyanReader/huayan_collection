判断〕」；凡讲者之说疑误者只标不改。\n六、**文本现象与信度**：凡经文有缺文、增补、版本分合之别者，如实标识并系以文献/法义说明，给信度评级（见 §1.5）；**无从确证者只标〔疑阙〕／〔待核〕，不升级为断言**。\n七、**版本差异之惯例**：凡藏译、梵本、六十／四十华严与本品的分品、用字、文段有无、内容增减之别，**悉举而比之**，注版本与信度；**严禁以「藏译云」冒充未见之原文**。\n八、**计数口径**：字数以剥校勘之 CJK 口径计（含品题）；句数以句末标点（。！？）计；偈颂以底本 `<l>` 行计，**两行（＝4 句）为一颂**（与李通玄「两行为一颂」之说合）。凡另一口径另注。\n\n---\n\n<!-- ATLAS:BEGIN P4 -->\n### 〇之零、导读指南（阅读路径与方法）\n\n**定位：** 考证型细读（philological close reading），以「可复核性」为第一优先。本品一味以「境」为法，故读法以**十事为纲、以数为纬**：十事各长行＋颂，事二独得二十二颂；先谱十事之量，再看十因缘之答，末观图元成图。\n**本品一句：** **十事是问，十因缘是答**——世界海以「一」字冠首、以「海」为量；尘刹互入，恰成一张完全二部图，本品即说此「境」之总纲。\n**路径：** 〇之二（二图四表）→ 一（品题与脉络）→ 二（全文逐段）→ 四（义理与名相）→ 五（诸家会读）→ 七（数据层）→ 附录按需查阅。\n**方法：** 先经文后诠释；〔实测〕／〔本文判断〕／〔存疑待核〕三分；负面证据同样入账；结构覆盖 100%，个体择要。\n**读前三问：** ① 十事之中何以事二「所依住」独得二十二颂？② 十因缘八十列十缘、六十只八缘，省在何处？③ 尘刹互入之图为何是完全二部图、为何不可作欧氏平面读？\n\n## 〇之二、本品内容地图（未入其门，先观其海）\n\n> **本节体例。** 图与表之数据，一律取自本文已回源核定之 §二逐段表与 §7.1／§7.5 实测数；**凡属推断者标〔本文判断〕，不入图**。图各看一事，勿求一图而尽本品。\n\n### 〇之二.0 提要\n\n本品占**卷第七后半**，剥校勘 **CJK 5,894 字（含品题 7·净 5,887）／句末 173**（§7.1）。结构为**叙分**（遍观·牒问·许说·重颂 10 颂）＋**正宗分**（总标十事·十因缘，十事各「长行＋颂」）：`<p>` 24／`<lg>` 11／`<l>` 240＝**120 颂**，逐事颂数 **9／22／10／10／10／9／10／10／10／10**（§7.2·事非等量）。十事名目 **10／10 共享「世界海」词头**，十因缘 **10／10 以「故」结句**（§7.3）；「世界海」**59** 见（L.136 订正口径）。澄观谓十事「**亦攝十八圓滿**」；六十本无独立品名、无「劫轉變差別」「無差別門」二事、十因缘只八缘（§6）。\n\n| 图 | 画什么 | 一句话 |\n|---|---|---|\n| **图 〇-1　十事之量谱** | 十事各得几颂 | 9／22／10／10／10／9／10／10／10／10＝110＋叙分 10＝120 |\n| **图 〇-2　相入图元谱** | 尘刹互入之词如何成图 | 中 64·現 62·塵 48·一一 26……图元即图例 |\n\n**〔读法之序〕**　先观图 〇-1 以得其量（十事逐事颂数），次观图 〇-2 以得其图元（相入语汇即图例），次读〇之二.3 坐标、.6 数等，然后入 §二逐段。**量既明，海始可测。**\n\n> **EN corresponding · Map of the Chapter.** Book Seven (second half), the chapter on the accomplishment of worlds, states the total scheme of the ocean of worlds in ten topics, each with its prose items and verses: 120 stanzas in eleven verse-groups, the second topic alone taking twenty-two. The ten topic-names all share the head 'ocean of worlds', and the ten causal statements all end in 'therefore'; the sixty-book rendering drops two of the ten topics and merge e=\"12\" fill=\"#5a5147\">五 莊嚴</text>\n<rect x=\"360\" y=\"228\" width=\"80\" height=\"18\" fill=\"#b8863c\" stroke=\"#7a5a28\"/>\n<text x=\"448\" y=\"242\" font-size=\"11\" fill=\"#5a5147\">10 颂 · 条目 10</text>\n<text x=\"30\" y=\"272\" font-size=\"12\" fill=\"#5a5147\">六 清淨</text>\n<rect x=\"360\" y=\"258\" width=\"72\" height=\"18\" fill=\"#b8863c\" stroke=\"#7a5a28\"/>\n<text x=\"440\" y=\"272\" font-size=\"11\" fill=\"#5a5147\">9 颂 · 条目 10</text>\n<text x=\"30\" y=\"302\" font-size=\"12\" fill=\"#5a5147\">七 佛出興</text>\n<rect x=\"360\" y=\"288\" width=\"80\" height=\"18\" fill=\"#b8863c\" stroke=\"#7a5a28\"/>\n<text x=\"448\" y=\"302\" font-size=\"11\" fill=\"#5a5147\">10 颂 · 条目 10</text>\n<text x=\"30\" y=\"332\" font-size=\"12\" fill=\"#5a5147\">八 劫住</text>\n<rect x=\"360\" y=\"318\" width=\"80\" height=\"18\" fill=\"#b8863c\" stroke=\"#7a5a28\"/>\n<text x=\"448\" y=\"332\" font-size=\"11\" fill=\"#5a5147\">10 颂 · 条目 9</text>\n<text x=\"30\" y=\"362\" font-size=\"12\" fill=\"#5a5147\">九 劫轉變差別</text>\n<rect x=\"360\" y=\"348\" width=\"80\" height=\"18\" fill=\"#b8863c\" stroke=\"#7a5a28\"/>\n<text x=\"448\" y=\"362\" font-size=\"11\" fill=\"#5a5147\">10 颂 · 条目 10</text>\n<text x=\"30\" y=\"392\" font-size=\"12\" fill=\"#5a5147\">十 無差別門</text>\n<rect x=\"360\" y=\"378\" width=\"80\" height=\"18\" fill=\"#b8863c\" stroke=\"#7a5a28\"/>\n<text x=\"448\" y=\"392\" font-size=\"11\" fill=\"#5a5147\">10 颂 · 条目 10</text>\n\n<line x1=\"30\" y1=\"412\" x2=\"970\" y2=\"412\" stroke=\"#d8c9a8\" stroke-width=\"1\"/>\n<text x=\"30\" y=\"436\" font-size=\"11.5\" fill=\"#8a7a5e\">合计 120 颂（叙分 10＋十事 110）；`<p>` 24·`<lg>` 11·`<l>` 240（§7.2 实测）。十因缘八十 10 缘／六十 8 缘（§6）。</text>\n<text x=\"30\" y=\"458\" font-size=\"11.5\" fill=\"#8a7a5e\">事二「所依住」独厚、事四「體性」条目独繁——二处即本品之重心（§7.2 澄观分科）。</text>\n</svg>\n<figcaption><b>图 〇-1　十事之量谱。</b>十事逐事颂数与长行条目（§7.2 逐事实测·澄观分科）；叙分另 10 颂，合计 120。<div class=\"en-line\">Fig. 0-1. The ten topics charted by verse count and prose items (§7.2, counted item by item): the topic 'abiding support' alone takes twenty-two verses, the topic 'nature' alone carries twenty prose items; plus the ten stanza introduction, 120 stanzas in all.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. 先看两条最长的：**事二 22 颂、事四 20 条**——十事非均匀铺陈，重心自有厚薄，此即「依住」与「体性」之说最详。\n2. 再看条目与颂数的错落：**条 20 而颂 10（事四）、条 9 而颂 10（事八）**——条与颂各成一段，不互相折算。\n3. 末看底行：**叙分 10＋十事 110＝120**——先记总量，再入逐事，免为一事之繁所夺。\n\n### 〇之二.2 图 〇-2　相入图元谱\n\n<figure>\n<svg viewBox=\"0 0 1000 430\" width=\"100%\" style=\"max-width:1000px;height:auto\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"serif\">\n<text x=\"500\" y=\"26\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"bold\" fill=\"#7a5a28\">相入图元谱：本品「相入／显现」语汇之实点</text>\n<text x=\"500\" y=\"46\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#8a7a5e\">每见 6px；词级计数（剥校勘·卷七后半）；右栏注其图位（§7.4）</text>\n\n<text x=\"30\" y=\"86\" font-size=\"12\" fill=\"#5a5147\">「中」（方位）</text>\n<rect x=\"230\" y=\"72\" width=\"384\" height=\"18\" fill=\"#d4a03c\" stroke=\"#b8863c\"/>\n<text x=\"622\" y=\"86\" font-size=\"11.5\" font-weight=\"bold\" fill=\"#5a5147\">64</text>\n<text x=\"660\" y=\"86\" font-size=\"10.5\" fill=\"#8a7a5e\">含摄定位（尘中／刹中）</text>\n<text x=\"30\" y=\"116\" font-size=\"12\" fill=\"#5a5147\">「現」</text>\n<rect x=\"230\" y=\"102\" width=\"372\" height=\"18\" fill=\"#d4a03c\" stroke=\"#b8863c\"/>\n<text x=\"610\" y=\"116\" font-size=\"11.5\" font-weight=\"bold\" fill=\"#5a5147\">62</text>\n<text x=\"660\" y=\"116\" font-size=\"10.5\" fill=\"#8a7a5e\">显现（动作边·一现一切）</text>\n<text x=\"30\" y=\"146\" font-size=\"12\" fill=\"#5a5147\">「塵」</text>\n<rect x=\"230\" y=\"132\" width=\"288\" height=\"18\" fill=\"#b8863c\" stroke=\"#7a5a28\"/>\n<text x=\"526\" y=\"146\" font-size=\"11.5\" font-weight=\"bold\" fill=\"#5a5147\">48</text>\n<text x=\"660\" y=\"146\" font-size=\"10.5\" fill=\"#8a7a5e\">顶点（一侧基）</text>\n<text x=\"30\" y=\"176\" font-size=\"12\" fill=\"#5a5147\">「無量」</text>\n<rect x=\"230\" y=\"162\" width=\"216\" height=\"18\" fill=\"#b8863c\" stroke=\"#7a5a28\"/>\n<text x=\"454\" y=\"176\" font-size=\"11.5\" font-weight=\"bold\" fill=\"#5a5147\">36</text>\n<text x=\"660\" y=\"176\" font-size=\"10.5\" fill=\"#8a7a5e\">量之无界（基数无限）</text>\n<text x=\"30\" y=\"206\" font-size=\"12\" fill=\"#5a5147\">「一一」</text>\n<rect x=\"230\" y=\"192\" width=\"156\" height=\"18\" fill=\"#b8863c\" stroke=\"#7a5a28\"/>\n<text x=\"394\" y=\"206\" font-size=\"11.5\" font-weight=\"bold\" fill=\"#5a5147\">26</text>\n<text x=\"660\" y=\"206\" font-size=\"10.5\" fill=\"#8a7a5e\">全称量化（边生成子）</text>\n<text x=\"30\" y=\"236\" font-size=\"12\" fill=\"#5a5147\">「無邊」</text>\n<rect x=\"230\" y=\"222\" width=\"156\" height=\"18\" fill=\"#b8863c\" stroke=\"#7a5a28\"/>\n<text x=\"394\" y=\"236\" font-size=\"11.5\" font-weight=\"bold\" fill=\"#5a5147\">26</text>\n<text x=\"660\" y=\"236\" font-size=\"10.5\" fill=\"#8a7a5e\">量之无界</text>\n<text x=\"30\" y=\"266\" font-size=\"12\" fill=\"#5a5147\">「微塵」</text>\n<rect x=\"230\" y=\"252\" width=\"150\" height=\"18\" fill=\"#b8863c\" stroke=\"#7a5a28\"/>\n<text x=\"388\" y=\"266\" font-size=\"11.5\" font-weight=\"bold\" fill=\"#5a5147\">25</text>\n<text x=\"660\" y=\"266\" font-size=\"10.5\" fill=\"#8a7a5e\">顶点（点集基数）</text>\n<text x=\"30\" y=\"296\" font-size=\"12\" fill=\"#5a5147\">「入」</text>\n<rect x=\"230\" y=\"282\" width=\"132\" height=\"18\" fill=\"#b8863c\" stroke=\"#7a5a28\"/>\n<text x=\"370\" y=\"296\" font-size=\"11.5\" font-weight=\"bold\" fill=\"#5a5147\">22</text>\n<text x=\"660\" y=\"296\" font-size=\"10.5\" fill=\"#8a7a5e\">相入（动作边）</text>\n\n<line x1=\"30\" y1=\"322\" x2=\"970\" y2=\"322\" stroke=\"#d8c9a8\" stroke-width=\"1\"/>\n<text x=\"30\" y=\"348\" font-size=\"11.5\" fill=\"#5a5147\">读法：<tspan font-weight=\"bold\">尘—刹之间每对皆有边，故成完全二部图 K_{m,n}</tspan>——连通·直径≤2·非平面·邻域即全体（密着），不可作欧氏平面读（§7.4〔本文判断〕·`sjcj_puxian_studies.py` 可复算）。</text>\n<text x=\"30\" y=\"374\" font-size=\"11.5\" fill=\"#8a7a5e\">字级另计：「一」237·「海」174·「切」145·「或」130（§7.1 高频字）——字与词两种口径，不可互比；「世界海」59（L.136 订正口径）。</text>\n<text x=\"30\" y=\"400\" font-size=\"11.5\" fill=\"#8a7a5e\">图元即图例：读图 〇-2 所举诸词，即是读 §7.4 相入图之顶点、边与量。</text>\n</svg>\n<figcaption><b>图 〇-2　相入图元谱。</b>相入语汇词级实点（§7.4 图元表）；字级高频另见 §7.1，两口径不可互比。图元即相入图 K_{m,n} 之顶点、边与量词。<div class=\"en-line\">Fig. 0-2. The interpenetration vocabulary counted at word level (§7.4): 'middle' 64, 'appear' 62, 'dust' 48, 'without measure' 36, 'each-and-every' 26, 'enter' 22 — these counts are themselves the legend of the complete bipartite graph of dusts and worlds; character-level frequencies are a separate gauge and must not be mixed with these.</div></figcaption>\n</figure>\n\n**读法三事。**\n\n1. 先分两层：**上四条是「量与动作」（中·現·塵·無量），下四条是「边与生成」（一一·無邊·微塵·入）**——合起来恰是相入图之四要素。\n2. 再看右栏图位注：**每词皆有图职**——顶点、边、边生成子、基数；词表即图例，非装饰。\n3. 末记底线警语：**字级（一 237）与词级（一一 26）两种口径**——混读即错，凡引数必注口径。\n\n### 〇之二.3 本品在第一会（菩提场·所信因果周）之坐标\n\n本品在第一会居**说境之位**：前品（普贤三昧）起定成行，本品承起而总说世界海十事；后品（华藏世界）即十事总纲之别显（本师所严净之果相）。\n\n| 品 | 卷 | 位／科 | 一句提撕 | 与本品之关系 |\n|---|---|---|---|---|\n| 普贤三昧品（品 3） | 卷七前半 | 第一会·行·定 | 藏身三昧·九门起 | 本品承其起定而说境（§3.3 请说相续） |\n| 华藏世界品（品 5） | 卷八–十 | 第一会·果相 | 别辩华藏 | 本品十事总纲之别显 |\n| 如来现相品（品 2） | 卷六 | 第一会·果·现相 | 四十问致请 | 「安立」问由本品正答 |\n| 藏译 Toh 44 第 4 章 | 德格 035 卷 fol 88b（L.201 TOC） | 开篇「ཀུན་ཏུ་བཟང་པོས…བྱིན་གྱི་རླབས…འཇིག་རྟེན」（普贤·承佛加持·世界）〔L.211 实测〕 | 与本品「承佛神力遍观世界海」相应 | 对应判读〔本文判断〕·逐字对勘未作〔待核〕 |\n| 六十〈盧舍那佛品〉 | 卷三–四 | 晋译·无独立品名 | 无「劫轉變差別」「無差別門」二事 | 十因缘 8 缘·第十「壞方便」（§6） |\n\n### 〇之二.4 本品形式特征（与邻品对看）\n\n本品之形式特征皆与邻品对看而得；数字之出处逐条标注；「世界海」从 59（L.136 订正口径）。\n\n| 特征 | 本品表现〔实测〕 | 邻品之对照 | 读法上的后果 |\n|---|---|---|---|\n| 篇幅 | 5,894 CJK／句末 173（§7.1） | 第三品 1,995／第二品 8,119 | 中篇，十事宜按事分读 |\n| 说境体例 | 十事各「长行＋颂」，事非等量（9–22） | 第三品六分一链 | 以「事」为单位，不以「分」 |\n| 名目结构 | 10／10 共享「世界海」词头·10／10「故」尾（§7.3） | 第三品 9·9·10 三集 | 一纲十目·一缘一故，笛卡儿积之骨 |\n| 计数口径 | 「世界海」59（L.136 订正·两法皆 59） | 旧记 71 作废 | 凡引数必注口径与订正痕 |\n| 六十侧 | 并入〈盧舍那佛品〉·少二事·十因缘 8 | 八十十事俱全 | 收摄之异，非教义之别（§6.8） |\n\n### 〇之二.5 五种读法（导览）\n\n| 读法 | 路径 | 适合谁 | 得什么 |\n|---|---|---|---|\n| 结构读法 | 图 〇-1 → §7.2 矩阵 | 结构读者 | 十事条目×颂数之矩阵与澄观分科 |\n| 图元读法 | 图 〇-2 → §7.4 相入图 | 数据读者 | 词表即图例，K_{m,n} 五性质可复算 |\n| 义理读法 | §1.4／§4.1–4.2 | 义理读者 | 十事摄十八圆满·十因缘五力类·依正不二 |\n| 对勘读法 | §6 全节＋〇之二.5 | 版本学读者 | 少二事·十缘 8·第十「壞方便」之收摄分寸 |\n| 仪轨读法 | §2.1 叙分＋§5.3′.4 讲记 | 修行者 | 遍观—牒问—许说之说法仪 |\n\n### 〇之二.6 数与位之谱：本品之数，四等分录\n\n华严之数非计数之数。本品所涉之数，来源不一，性质亦不一；**先分其等，后论其义**，则不为数目所惑。\n\n| 等第 | 数 | 出处 | 性质 |\n|---|---|---|---|\n| **T0 经文明文** | 十事逐事颂数 9／22／10／10／10／9／10／10／10／10 | §7.2（`T10n0279` 卷七后半实点） | 事非等量 |\n| **T0 经文明文** | 十因缘 10 缘（皆以「故」结） | §2.2／§7.3 | 成刹之缘 |\n| **T0 经文明文** | `<p>` 24／`<lg>` 11／`<l>` 240＝120 颂 | §7.1–7.2 实测 | 结构总量 |\n| **T0 本文实测** | 5,894 字／173 句／独字 444／熵 7.4271／Zipf −1.3448 | §7.1（剥校勘） | 篇幅与信度 |\n| **T1 注疏** | 十事「亦攝十八圓滿」·梵题「世界海成就」 | `T1735`（§5.1·据疏转述） | 结构之判与题名之据 |\n| **T0·六十本实测** | 十因缘 8 缘·无「劫轉變差別」「無差別門」 | §6（`T09n0278` 卷三–四） | 收摄之异 |\n| **T0·藏本实测** | 藏 4 开篇「ཀུན་ཏུ་བཟང་པོས…བྱིན་གྱི་རླབས…འཇིག་རྟེན」 | L.201 TOC（fol 88b） | 开篇相应·逐字对勘未作 |\n\n> **〔读法〕** 本品之数有**三种口径**：字级（一 237）、词级（一一 26）、订正口径（世界海 59，旧 71 作废）——凡引必注。十事「非等量」与十因缘「十／八」并存，正是**各照其本**之铁律在数目上之呈现。\n\n<!-- ATLAS:END P4 -->\n\n## 一、概述与品题解义\n\n### 1.1 品题释义\n\n**品名**：**世界成就品**（八十华严第四品，唐·实叉难陀译）。**梵题**，据澄观《大方广佛华严经疏》所悉，作「**世界海成就**」——澄观云：「**準梵本中，云世界海成就，下文辯海，譯人略也**」（`T1735`）〔T1·据疏转述，非亲见梵本〕。藏译（Toh 44）对应品名与分章〔待核〕（参第二部 §6.4 之藏译品目考）。〔L.211 订正〕德格本已入库（L.200·`data/references/tibetan/derge_kangyur/avatamsaka/`）、45 品 TOC 已提取（L.201）；**藏 4 开篇实测**「ཀུན་ཏུ་བཟང་པོས…བྱིན་གྱི་རླབས…འཇིག་རྟེན」（普贤·承佛加持·世界），与本品开篇「承佛神力，遍观察一切世界海」相应〔对应判读〔本文判断〕·逐字对勘未作〕。\n\n**释名**（分「世界」「成就」「品」三节，据澄观 `T1735` §5.1、法藏 `T1733` §5.2、李通玄 `T1739` §5.3）：\n\n- **「世界」——所成就之境**。澄观：「**世謂三世，墮去來今故；界謂方分，有彼此故**」。又翻一层：「世謂隱覆，界亦分齊。謂諸有為可破壞，世即隱覆；無為不可壞，法從真性起，同無為法，即隱覆有為可破壞；世各不相雜，是其分齊。」法藏（六十本，就〈盧舍那佛品〉中此段）：「**世是時，界是分齊。謂於時中分齊顯現，從相得名；繁多奧積、深廣難窮，同名海也**」。\n- **「成就」——能成之缘**。澄观：「**成就者，即能成之緣，謂十緣等。能所合目。若以世界之成就，即依主釋也**」。即「世界」为所成，「成就」为能成之缘（十因缘），能所合举而立品名。\n- **「世界海」——品内数法之总名**。澄观：「**世界廣深，目之為海。謂積剎成種、積種成海，海無別體，世界都名**」。汉译从简，略「海」字而题「世界成就」。\n- **「品」**——科段之目。此品为一品独立之经段（品次第四，卷第七后半）。\n\n**李通玄《新华严经论》之品名目**（`T1739`/`X0223`）：「**為明世界海依住、形相、苦樂淨穢，皆是眾生自業果報之所莊嚴，不從他有；佛菩薩世界海依大願力、依自體清淨法性力、依諸波羅蜜諸行海等自體清淨力依，為度眾生大慈悲智力，以不思議變化力之所成就，故名世界成就品**」——**双源说**：众生业力（自业果报）＋佛菩萨愿力（大愿、法性、波罗蜜行、大悲变化）。\n\n**要义一字**：本品以一「**境**」字（或曰「**剎**」字）为骨——承第三品（普贤三昧，行）之「起」，转入「**普贤承力遍观十海 → 普告众海 → 说世界海十事**」之「**说境**」。全品骨节为「**叙分（遍观·牒问·许说·重颂）→ 正宗分（总标十事·十因缘·十事各长行＋颂）**」，正为下品《华藏世界品第五》「别辩果相」之总纲（§1.2、§3）。\n\n### 1.2 品位与脉络（承上启下·成刹之缘）\n\n**在八十华严三十九品中之位**：第一会（菩提场会）第四品，占**卷第七后半**（同卷前半为第三品《普贤三昧品》）。\n\n**判位**：清凉澄观判后三品为「**正陈法海分**」，更分：「**三品正陳法海，於中分二：初二品明果，後一品辯因**」——前二品（世界成就·华藏世界）明「果」（众生与诸佛之刹海），后一品（毗卢遮那）辩「因」（本师行因）。又：「**於中初品通辯諸佛及諸眾生所有剎海，後品別明本師之所嚴淨。又此品明成剎之緣，後品別辯果相故。此品答安立之問**」（`T1735`）。\n\n**先果后行（承第三品之判）**：\n- **承上**：《普贤三昧品》（行）——普贤入定受加、起定作证，品末大众以「国土云何得成立？诸佛云何而出现？及以一切众生海？」三问**请转法轮**（第三部 §2.7.2 第九偈）。\n- **本品（境）**：普贤**承此请**，「承佛神力，遍观察一切世界海……」，普告道场众海，说「**世界海十事**」——即答前请之「安立」问。\n- **启下**：《华藏世界品》（果之别明）——别辩本师所严净之「华藏庄严世界海」。\n\n澄观：「**前說緣既具，此下正陳所說，總明果相，別答法界安立海問，故此品來**」。李通玄释来意五：「一**答前世主三十七問**佛海、眾生海、波羅蜜海等……三十七問一時總答，令大眾海悟佛所行入普賢菩薩所行也。二令諸現在未來始發菩提心者識佛所行及菩薩行海。三令始發心菩薩知眾生業報同異差別由心造故。四令始發心者知眾生界廣大等法界虛空界如影相入重重無盡依住各別。五令始發心菩薩知諸佛菩薩境界海、眾生境界海一異不可得故，隨眾生自業轉變剎海轉變故，隨自業成壞剎海成壞故。」\n\n〔辨〕澄观「答法界安立海问」、李通玄「答三十七问」，**二数二据并存，各注所据**（与第二部 §1.1 四十问之辨同例）；本品确为「答问」之品，则诸家一致。\n\n### 1.3 篇幅与结构预览（**本品＝卷第七后半**）\n\n> **〔范围说明〕** 本稿范围＝**卷第七后半**（`T10n0279` 卷七，起「爾時，普賢菩薩摩訶薩以佛神力，遍觀察一切世界海」，止「……以願力故遍世間」）。卷七前半为《普贤三昧品第三》，**非本品范围**，另作 §三 前接。\n\n- **本品范围**：卷第七后半（`T10n0279`）。**实测 5,894 字**（CJK 剥校勘口径，含品题「世界成就品第四」7 字；**正文净 5,887 字**）；含标点 6,791 字；句末标点（。！？）173 处；独字 444〔详见 §7.1〕。\n- **品题对证**：卷七经首题「……**世界成就品第四**」；《八十华严品卷对照表》亦作「4 世界成就品＝卷 7」。同卷另有「3 普贤三昧品」。\n- **结构骨架**（依澄观 `T1735` 及李通玄 `T1739` 之科，参 §5）：\n  - **叙分**（李通玄：「初一段長行、一段偈頌是此品中敘分」）：①承力遍观十海 →②牒问许说（叹佛智＋十句所为／十一句所为）→③重颂（十颂）。\n  - **正宗分**（李通玄：「後十段長行及十段偈頌，是正說」）：④总标十事＋十因缘（长行）×1 ＋ 颂 ×1 →⑤十事各「长行＋颂」（事一至十）。\n- **统计要点**：**`<p>` 长行段 24**；**`<lg>` 偈组 11**；**`<l>` 行 240＝120 颂**（叙分颂 10＋十事颂 110）；**「世界海」59 见**（本品咏叹之总相用语；L.136 订正口径·raw XML 与剥标签两法皆 59，旧记 71 作废）〔详见 §7.1–§7.2〕〔L.211 归位〕。\n- **旁参／前接**：卷七前半《普贤三昧品》（前接，§三）；卷八起《华藏世界品第五》（旁参，§三）。\n\n### 1.4 核心要义（十事·十因缘·依正不二·重重无尽）\n\n本品要义五（详 §2、§4、§5）：\n1. **世界海十事**——起具因缘、所依住、形状、体性、庄严、清净、佛出兴、劫住、劫转变差别、无差别门。澄观谓此十「**亦攝十八圓滿**」，为「正陈法海」之总纲（§2.2、§4.1）。\n2. **十因缘（成刹之缘）**——如来神力、法应如是、众生行业、菩萨成一切智、众生菩萨同集善根、净国土愿力、不退行愿、清净胜解自在、如来善根所流及成道势力、普贤自在愿力。摄佛力／法力／众生业力／菩萨愿行力／普贤愿力五类（§2.2、§4.2）。\n3. **依正不二·刹由心异**——「剎由心異，當淨自心及他心」；染净由业，净秽随心（§4.3）。\n4. **重重无尽**——一一微尘中现一切刹、一切佛、一切三世，如因陀罗网（§4.4）。\n5. **无差别门为归**——前十（差别）即此（无差）之差，此无差即前十差之无差（澄观，§4.5）。\n\n> **EN · the three key points (dragon-eye gloss; sense-for-sense, not literal）**\n> 1. **A grammar of world-formation** — the whole chapter runs on *ten matters* (事): conditions of arising, support, shape, nature, adornment, purity, buddhas appearing, duration, transformation, and the gate of non-difference; each is summed as \"as many as the micro-dust of world-oceans.\"\n> 2. **Two sources behind every land** — the ten causes collapse into two: the *vows and power* of buddhas and bodhisattvas (能) and the *karma* of sentient beings (所); \"the kṣetra differs by mind,\" so the teaching turns on *purifying one's own mind and others'*.\n> 3. **Difference dissolves into non-difference** — the tenth gate (無差別門) gathers the nine differentiated ones: the many *is* the one's many, and the one *is* the many's one; like Indra's Net, each dust holds all lands, all buddhas, all three times.\n>\n> *Title gloss:* **世界成就** = \"the completion / attainment of the worlds\" — *how* world-oceans come to be formed and adorned; the environment-outcome (依报) expounded just *before* the Flower Treasury chapter itself (`title_en` \"Completions of the Worlds\" per `data/catalog/chapters.yaml`).\n\n### 1.5 经文文本现象与信度标识（沿用前三部惯例）\n\n**标识符号集**：\n\n| 标识 | 含义 | 于本品之例 |\n|------|------|------|\n| 〔缺文〕 | 经文有脱文/阙漏（据校勘或版本比勘可证） | 本品未见 |\n| 〔残〕 | 残卷/残句 | 本品未见 |\n| 〔疑阙〕 | 疑有阙文而未确 | 存而不论 |\n| 〔补〕/〔后人补〕 | 疑为后出增补 | 本品未见断证 |\n| 〔等〕 | 经文固有之省略代表例（非残缺） | 十事各「如是一一等，有世界海微塵數」之「等」 |\n\n**信度评级**（沿用本项目三级来源评级）：\n\n| 级 | 判据 | 例 |\n|----|------|----|\n| T0／一手 | 原典本身（CBETA 底本） | `T10n0279` 卷七后半文字 |\n| T1／原典 | 同系统译本/注疏（异译、古注原本） | 六十华严、澄观疏、法藏探玄记、李通玄论 |\n| T2／学术 | 同行评议论著、学术论文 | 84000 藏译编目 |\n| T3／二手 | 百科、官网、口说转述 | 法师讲记听录 |\n\n**于本品之应用（据实）**：\n- 本品**非残缺品**，篇幅中长（5,894 字），承第三品之短（1,988）而下启华藏世界。\n- 本品十事各「如是等，有世界海微塵數」为**经文固有之〔等〕例**（省略代表），**非残缺**。\n- 本品在**六十华严无独立品名**（其段并入〈卢舍那佛品第二〉）、**四十华严全无**——属**版本分合之差异**〔并存〕，非「缺」（§1.6）。\n\n### 1.6 版本差异之惯例与本品之版本情况\n\n> **惯例**：凡**藏译（Toh 44）、梵本残片、六十／四十华严**之对应段与本品有别者——不论**分品、用字、文段有无、内容增减**——**悉举而比对之**，并注版本与信度。**无别者亦标「与汉本大体同」**。\n\n**本品之版本情况**（据现有一手/二手材料，对读详 §六）：\n1. **六十华严（`T09n0278`）**：**无独立「世界成就品」**——其段并入〈**卢舍那佛品第二之二**〉（六十本第 2 品·**卷第三**；据 CBETA **繁体原字形** `T09n0278` 卷三，存 `data/references/cbeta_txt/T09n0278_juan3.txt`）。其段与八十本品**大体平行而文段、次第、数目有异**（详 §6）：\n   - **十事之名目异**：八十作「起具因緣／所依住／形狀／體性／莊嚴／清淨／佛出興／劫住／劫轉變差別／無差別門」；六十作「說世界海／起具因緣／住／形／體／莊嚴／清淨／如來出世／劫／壞方便」——**六十有「說世界海」为第一而无「劫轉變差別」「無差別門」二名**，其第十「壞方便」即下《华藏世界》所摄（法藏：「亦是釋第十壞世界，以成即是壞故」）。\n   - **十因缘之数异**：八十列 **10** 缘；六十列 **8** 缘（省「一切眾生及諸菩薩同集善根」「一切菩薩清淨勝解自在」等处合并）。\n   - **次第异**：六十「**观察十海普告**」置于本品（三昧）段内、**起定之前**；八十别立为第四品之首。\n   - **颂体异**：六十事一之颂为**四言**（「佛智境界，不可思議……」）；八十为**七言**（「所說無邊眾剎海……」）。\n2. **三昧名**（前接第三品）：八十「**一切諸佛毗盧遮那如來藏身**」／六十「**一切如來淨藏**」——**异译异名并列**（第三部 §6.3）。\n3. **梵本**：题「**世界海成就**」（据澄观疏转述，T1；非亲见梵本，标〔待核〕）。\n4. **藏译（Toh 44）**：对应品名与分章〔待核〕。〔L.211 订正〕德格本已入库（L.200）；藏 4 开篇实测普贤承佛加持观世界海，与本品开篇相应〔对应判读〔本文判断〕·逐字对勘未作〕。\n\n### 1.7 核心要义小结\n\n本品以一「**境**」立骨：**普贤承力遍观十海 → 普告众海 → 总标十事 → 说十因缘 → 十事各长行＋颂**。前品（普贤三昧）起「行」，本品说「境」，后品（华藏世界）「别辩果相」；三品相衔，正合华严「**先果后行**」之判。其要在「**成刹之缘**」与「**重重无尽**」二义——「積剎成種、積種成海」，而尘剎相入、依正不二，为下《华藏世界》别显本师所严净之总纲。\n\n---\n\n## 二、卷第七后半（世界成就品第四·本品全文）\n\n> **〔经文回源〕** 以下经文一律照 `T10n0279` 卷七后半底本原字形（繁体）；标点为底本所具，**不擅改**。段落划分依澄观「叙分（总标纲要）／正宗分（正陈本义）」之科（§5.1），逐段以「疏解／名相／会读」三层疏之。\n\n### 2.0 结构总表（据经切分）\n\n| 序 | 段（科） | 经段 | 长行 | 颂 |\n|---|---------|------|------|----|\n| 叙一 | 承力遍观 | 遍观察十海 | 1 | — |\n| 叙二 | 牒问许说·叹智 | 诸佛世尊知……不可思议（三十句）＋「我当承佛神力……具足宣说」＋十句所为 | 1 | — |\n| 叙三 | 许说分齐·重颂 | 复欲令……＋十一句所为＋「即说颂言」 | 1 | LG00·10颂 |\n| 正一 | 总标章门 | 「世界海有十种事」 | 1 | — |\n| 正二 | 事一 起具因缘 | 十种因缘 | 1 | LG01·9颂 |\n| 正三 | 事二 所依住 | 十种所依住 | 1 | LG02·22颂 |\n| 正四 | 事三 形状 | 种种形相 | 1 | LG03·10颂 |\n| 正五 | 事四 体性 | 种种体（二十种） | 1 | LG04·10颂 |\n| 正六 | 事五 庄严 | 种种庄严（十种） | 1 | LG05·10颂 |\n| 正七 | 事六 清净 | 清净方便海（十种） | 1 | LG06·9颂 |\n| 正八 | 事七 佛出兴 | 佛出现差别（十种） | 1 | LG07·10颂 |\n| 正九 | 事八 劫住 | 劫住（十大数） | 1 | LG08·10颂 |\n| 正十 | 事九 劫转变差别 | 劫转变（十种） | 1 | LG09·10颂 |\n| 正十一 | 事十 无差别门 | 无差别（十种） | 1 | LG10·10颂 |\n\n> **〔口径〕** 长行 `<p>` 段共 **24**（叙 3＋正 11＋各事「欲重宣其义」8 处导语等）；颂 `<lg>` 组 **11**；`<l>` 行 **240＝120 颂**（叙分 10＋十事 110）。逐事颂数：**9／22／10／10／10／9／10／10／10／10**（§7.1）。\n\n### 2.1 叙分一：承力遍观十海\n\n**经文**：\n\n> 爾時，普賢菩薩摩訶薩以佛神力，遍觀察一切世界海、一切眾生海、一切諸佛海、一切法界海、一切眾生業海、一切眾生根欲海、一切諸佛法輪海、一切三世海、一切如來願力海、一切如來神變海；如是觀察已，普告一切道場眾海諸菩薩言：\n\n**疏解**：澄观判此为「总标纲要·本分」之第一：「**先承力遍观，后牒问许说**」。上（第三品）「入三昧内契其源」，今云「**遍观外审其相**」——即**内证起而外观机境**。\n\n**名相**：\n- **以佛神力**——所依之因（承前品入定受加之余力）。澄观：「所入深广，要承力故」。\n- **十海**——遍观之十境：世界海、众生海、诸佛海、法界海、众生业海、众生根欲海、诸佛法轮海、三世海、如来愿力海、如来神变海。澄观：「**十海之义已如问释，但小不次耳。但观于十，已含余三十（问）**——佛海之中具身等故，大愿之中含因等故」〔按〕十海即前品（如来现相）果问三十句之总摄。\n\n**会读**：李通玄判「**初尔时已下四行半经，是普贤观察十海分**」（`T1739`）——即此段括十海而观，为全品「说境」之发端。\n\n### 2.2 叙分二·三：牒问许说＋重颂（毛光赞德式之引）\n\n**经文（牒问许说·叹智三十句·节录）**：\n\n> 「……佛子！諸佛世尊知一切世界海成壞清淨智不可思議，知一切眾生業海智不可思議，知一切法界安立海智不可思議，說一切無邊佛海智不可思議，入一切欲解根海智不可思議，一念普知一切三世智不可思議，顯示一切如來無量願海智不可思議，示現一切佛神變海智不可思議，轉法輪智不可思議，建立演說海不可思議，清淨佛身不可思議，無邊色相海普照明不可思議……（中略）……如是等一切法，我當承佛神力，及一切如來威神力故，具足宣說。\n> 為令眾生，入佛智慧海故；為令一切菩薩，於佛功德海中得安住故；……（十句所为，中略）……為令一切菩薩，安住普賢願海中故。」」\n\n**经文（许说分齐·十一句所为→说颂）**：\n\n> 是時，普賢菩薩復欲令無量道場眾海生歡喜故，令於一切法增長愛樂故，令生廣大真實信解海故，令淨治普門法界藏身故，令安立普賢願海故，令淨治入三世平等智眼故，令增長普照一切世間藏大慧海故，令生陀羅尼力持一切法輪故，令於一切道場中盡佛境界悉開示故，令開闡一切如來法門故，令增長法界廣大甚深一切智性故，即說頌言：\n\n**疏解**：澄观判「牒问许说」分四：「一**牒问略叹**，二**许说分齐**，三**说所成益**，四**赞胜诫听**」。\n- **牒问略叹**：「即从后向前，牒上果问三十句也」——「**观乃观海，叹乃叹智**」；「智之与海反覆相成」——「**海难思故佛智难思，佛智难思故海为深广**」；「又表唯所证知，故但说海」。\n- **许说分齐**：「谓具足说故。承佛力者，当会佛也。」（「如是等一切法，我当承佛神力……具足宣说」）。\n- **说所成益**：「为令众生入佛智慧海故」等**十句**，「摄为五对：一证智成福对，二严刹绍种对，三显义演教对，四生善灭恶对，五净业普愿对」。\n- **赞胜诫听**（「是时，普贤菩萨复欲令无量道场众海生欢喜故」等**十一句**）：「初一总标，谓令闻法必生喜故；余十别显喜义，亦为五对：一乐法生信对，二证性立愿对，三了真入俗对，四持法示佛对，五开法增智对」。\n\n**名相**：\n- **世界海成壞清淨智**——初句总，贯下「清净」言：「**离所知障，决断分明故**」（澄观）。「清净」贯下诸句（余略）。\n- **不可思议**——澄观：「皆以**多故、广故、深故、细故，重叠难知，逈超言念**，皆云不思议也」。\n\n**会读**：李通玄判此「叹智」为**六科**之第二至第五：\n- 二「如是观察已下可八行经，明普贤告众叹诸佛十种之智海十不可思议」；\n- 三「建立演说海已下可六行经，明普贤叹佛十种身业教化不可思议」；\n- 四「从勇猛调伏诸众生海无空过者已下七行经，是普贤叹佛身智二业随转法轮成就之众入佛之地十不可思议」；\n- 五「如是等一切法已下十八行半经，明普贤乘佛神力说佛智业身业教化饶益、成就众生海之德，令多菩萨一切众生入佛境界海故」。\n\n**逐颂细读（LG00·十颂）**：\n\n| 颂 | 经文（照底本） | 疏解 |\n|---|--------------|------|\n| 1 | 智慧甚深功德海，普現十方無量國，隨諸眾生所應見，光明遍照轉法輪。 | 总明佛智功德如海、随根普现而转法轮。（李通玄：「一明佛智慧甚深」＋「三明佛语业普周」） |\n| 2 | 十方剎海叵思議，佛無量劫皆嚴淨，為化眾生使成熟，出興一切諸國土。 | 明佛行多刹遍严、为化众生而出兴。（李通玄：「四明佛行多剎遍嚴」「六明佛普現出興與益」） |\n| 3 | 佛境甚深難可思，普示眾生令得入，其心樂小著諸有，不能通達佛所悟。 | 明众生根劣随迷，不能通达。（「七明眾生根劣隨迷」） |\n| 4 | 若有淨信堅固心，常得親近善知識，一切諸佛與其力，此乃能入如來智。 | 明净信坚固者堪为、诸佛与力方知。（「八明大心淨信堅固者堪為」「九明諸佛與力方知」） |\n| 5 | 離諸諂誑心清淨，常樂慈悲性歡喜，志欲廣大深信人，彼聞此法生欣悅。 | 明离谄慈悲、志欲深广者能入，闻法欣悦。（「十」）——**澄观、李通玄俱引此颂**为「若不闻此无边无尽无二之境，滞于权小」之证（§1.2 来意）。 |\n| 6 | 安住普賢諸願地，修行菩薩清淨道，觀察法界如虛空，此乃能知佛行處。 | 明观察法界如虚空而获善利。（「十一」） |\n| 7 | 此諸菩薩獲善利，見佛一切神通力，修餘道者莫能知，普賢行人方得悟。 | 简修余道者不堪，普贤行人得入。（「十二」） |\n| 8 | 眾生廣大無有邊，如來一切皆護念，轉正法輪靡不至，毘盧遮那境界力。 | 明众生界广大、法轮普至，归卢舍那境界力。（「十三」） |\n| 9 | 一切剎土入我身，所住諸佛亦復然，汝應觀我諸毛孔，我今示汝佛境界。 | 普贤自示身广大、劝众观毛孔。（「十四明普賢自示身廣大」「十五勸眾令觀毛孔」） |\n| 10 | 普賢行願無邊際，我已修行得具足，普眼境界廣大身，是佛所行應諦聽。 | 普贤自叹行具、叹是佛所行应听。（「十七」「十八」「二十」） |\n\n**疏解（总）**：澄观：「**十颂分二：初八赞，后二劝**。前中亦二：初二明佛出现意，后六辩定法器——初一拣非器，次四示法器，后一结归佛力。」〔按〕此十颂「**亦是牒问以赞**」——「前长行总显难思，此下略示难思之相」「三十句间列不次，含义并足」。\n\n**会读**：李通玄判末：「六明普贤说颂，重明前法。于此二十行颂中两行为一颂，于中意有二十，总答前三七问，为颂含多义故」——**「两行为一颂」之计数口径**即本稿颂数之所本（凡例八）。\n\n### 2.3 正宗·总标章门＋事一（起具因缘）\n\n**经文（总标十事·长行）**：\n\n> 爾時，普賢菩薩摩訶薩告諸大眾言：「諸佛子！世界海有十種事，過去、現在、未來諸佛，已說、現說、當說。何者為十？所謂：世界海起具因緣，世界海所依住，世界海形狀，世界海體性，世界海莊嚴，世界海清淨，世界海佛出興，世界海劫住，世界海劫轉變差別，世界海無差別門。諸佛子！略說世界海，有此十事；若廣說者，與世界海微塵數等，過去、現在、未來諸佛，已說、現說、當說。」\n\n**经文（事一·起具因缘·长行）**：\n\n> 「諸佛子！略說以十種因緣故，一切世界海已成、現成、當成。何者為十？所謂：如來神力故，法應如是故，一切眾生行業故，一切菩薩成一切智所得故，一切眾生及諸菩薩同集善根故，一切菩薩嚴淨國土願力故，一切菩薩成就不退行願故，一切菩薩清淨勝解自在故，一切如來善根所流及一切諸佛成道時自在勢力故，普賢菩薩自在願力故。諸佛子！是為略說十種因緣；若廣說者，有世界海微塵數。」\n\n**疏解（总标十事）**：澄观「标举章门」分三：「一**立数显同**（十事三世同说），二**征数列异**，三**结略显广**」。\n- 「**世界广深，目之为海**——谓积刹成种、积种成海，海无别体，世界都名。然事类广多，略举其十，以表无尽；三世同说，彰其要胜。」\n- 十事之次第义（澄观）：一**揽缘成立**、二**成已依住**、三**外状区分**、四**内体差别**、五**宝等庄校**、六**垢秽不生**、七**佛出差殊**、八**劫住修短**、九**随业改变**、十**包容必均**。又「此十**亦摄十八圆满**，后品当会」。\n\n**疏解（事一·十因缘）**：澄观「佛土之义虽有多，不出其三：一**法性土**、二**受用土**、三**变化土**；若开受用有自有他，则成四土……或性及相，融而为一，有异余宗」。十因中「**初三通显，次四别明，后三则融摄转变**」：\n- 初三：一**如来神力**（「一切净秽等土，皆是如来通慧力成……莲华藏海佛所严净，而内含净秽，然就佛言之，故无国而不净」）；二**法应如是**（梵云「达磨多」＝法尔/法性；「若云法尔者……法应如是不可致诘」）；三**众生业力**（「业有善恶，国有净秽」）。\n- 次四：一**自受用土因**（大圆镜智所成）；二**变化土因**（众生菩萨共构一缘、凡圣同居）；三四**他受用土因**（初即初地以上「修净土愿」，后即八地以上「不退行愿之所成」）。\n- 后三（融摄转变）：一**清净胜解自在**（「穷其因者清净胜解，胜解印持随心变故」）；二**如来善根所流及成道势力**（「成正觉时，其身充满十方世界微尘刹土，念劫圆融一时成立」）；三**普贤自在愿力**（「成与不成，常能融摄」——「前是妙觉，此是等觉；其法性土通为诸土之体」）。\n- **展转生起**（澄观）：「诸佛土总由佛力；何以由之？法如是故。法尔云何而有异耶？业不同故。众生由业，佛复由何成？一切智之所变故……何以复有纯菩萨国？菩萨愿行力故。既由行业，何可转变？胜解自在故。云何复得融摄重重？佛及普贤自在力故。」\n\n**名相**：\n- **世界海起具因緣**——「起」＝生起，「具」＝具足，「因缘」＝能成之缘（十缘等）。梵 `loka-dhātu-samudra-utpatti-pratyaya`〔待核〕。\n- **法應如是**／**法爾**——梵 `dharmatā`（达磨多），或译「法性」；澄观「以本识如来藏身为所依持，恒顿变起外诸器界」。\n- **普賢菩薩自在願力**——十因之末，与《华严》「普贤行愿」为刹海总因之说相印（李通玄「普贤菩萨善根故……普贤菩萨自在愿力故」）。\n\n**会读**：李通玄「此之一品有十一段经文。从初一段长行、一段偈颂是此品中叙分；后十段长行及十段偈颂，是正说」——**即此总标＋事一为「正说」第一段**。又其科此段长行「大意有六：一明普贤告众欲说其法；二正说世界海有十事之法，一切三世诸佛同敷；三正举世界形状体性有十广大无尽；四正说世界已成现成当成具十种因缘；五正说由如来神力法如是等如下十事因缘是也；六乘佛神力说颂」。\n\n**逐颂细读（LG01·九颂）**：\n\n| 颂 | 经文（照底本） | 疏解（据澄观「多以果显因，束为八段」＋李通玄） |\n|---|--------------|------|\n| 1 | 所說無邊眾剎海，毘盧遮那悉嚴淨，世尊境界不思議，智慧神通力如是。 | 颂佛神力（第一因）；「无边刹海皆遮那严净」——以果显因。 |\n| 2 | 菩薩修行諸願海，普隨眾生心所欲，眾生心行廣無邊，菩薩國土遍十方。 | 颂众生菩萨同集善根（第五因）；「普随众生心所欲」。 |\n| 3 | 菩薩趣於一切智，勤修種種自在力，無量願海普出生，廣大剎土皆成就。 | 颂第四「成一切智」自受用土因（前半因后半果）；大圆镜智相应净识所变佛土。 |\n| 4 | 修諸行海無有邊，入佛境界亦無量，為淨十方諸國土，一一土經無量劫。 | 颂第六严净愿力＋第七不退行愿（他受用土因）；「八地已上念念入法流，心心趣佛境」。 |\n| 5 | 眾生煩惱所擾濁，分別欲樂非一相，隨心造業不思議，一切剎海斯成立。 | 却颂第三「众生行业」（加造业因烦恼所扰），造于秽刹。 |\n| 6 | 佛子剎海莊嚴藏，離垢光明寶所成，斯由廣大信解心，十方所住咸如是。 | 颂第八菩萨胜解（清净胜解自在因）。 |\n| 7 | 菩薩能修普賢行，遊行法界微塵道，塵中悉現無量剎，清淨廣大如虛空。 | 超颂普贤愿力（第七偈「依中有依」）；重重尘刹。 |\n| 8 | 等虛空界現神通，悉詣道場諸佛所，蓮華座上示眾相，一一身包一切剎。 | 却颂如来自在（第八偈「正中有依」）；相入无碍（「身包一切」）。 |\n| 9 | 一念普現於三世，一切剎海皆成立，佛以方便悉入中，此是毘盧所嚴淨。 | 融于三世（第九偈）；「皆遮那严净」结归。 |\n\n**疏解（总）**：澄观：「第二偈颂，**多以果显因**，文有九偈，束为八段……三共显融摄无碍。」又由此颂开出「**无碍十种**」（理事无碍、成坏无碍、广陜无碍、相入无碍、相即无碍、微细无碍、隐显无碍、重现无碍、主伴无碍、时处无碍），「此十无碍同时具足，自在难知，散在诸文，可以六相融之」（详 §4.4）。\n\n### 2.4 事二（所依住）\n\n**经文（长行）**：\n\n> 爾時，普賢菩薩復告大眾言：「諸佛子！一一世界海有世界海微塵數所依住。所謂：或依一切莊嚴住，或依虛空住，或依一切寶光明住，或依一切佛光明住，或依一切寶色光明住，或依一切佛音聲住，或依如幻業生大力阿脩羅形金剛手住，或依一切世主身住，或依一切菩薩身住，或依普賢菩薩願所生一切差別莊嚴海住。諸佛子！世界海有如是等世界海微塵數所依住。」\n\n**疏解**：澄观「第二段，**所依住**，通染净也。长行释中，十事文并可知。然依异者，**由于心乐有差别故**」——逐列依住之心理动机：\n1. 依庄严住——「乐饰好故」；2. 依虚空住——「乐无碍故」；3. 依一切宝光明住——「乐即质光故」；4. 依佛光明住——「怖众苦故」；5. 依宝色光明住——「爱离质光故（光作宝色，非宝发光）」；6. 依佛音声住——「奉圣教故」；7. 依金刚手住——「求神护故」；8. 依世主身住——「求天护故」；9. 依菩萨身住——「菩萨愿力所任持故」；10. 依普贤愿所生住——「普安众生故」。\n- **「如何广大世界，依有情等小类而住？」** 澄观答二义：「一**外由内感**，故说依身」（复二：一宿因力——颂云「业力之所持故」；二现在转变力——世主菩萨神力任持摄属己故）；「二由**无漏体事**，大小无碍得相依住故」。\n\n**名相**：\n- **所依住**——刹之所依止。梵 `pratiṣṭhita`〔待核〕。\n- **如幻業生大力阿脩羅形金剛手**——「如幻业生」之「大力阿修罗形金刚手」（阿修罗形之金刚神），或作「摩诃那伽金刚力士」〔六十作「摩訶那伽金剛力士掌中」〕——**异译并列**〔待核〕。\n\n**会读**：李通玄「第二段中，尔时已下九行半经并四十四行颂，明世界依住，如文具明」。又「云何广狭之相，依何发心，乘佛大悲普济愿行广度」——**依住之问即「依何发心」之问**。\n\n**逐颂细读（LG02·二十二颂）**：澄观判「**初（一颂）总显一切世界依佛神力而住**；后二十一颂**别颂前文**，分之九」：\n- **总（颂1）**：遍滿十方虛空界，所有一切諸國土，如來神力之所加，處處現前皆可見。——梵本云「一切依佛神通现」，长行不列者，「若列则余九非佛神通故」；偈以此文该于前十，皆佛神力。\n- **别一（颂2）**：或有種種諸國土，無非離垢寶所成，清淨摩尼最殊妙，熾然普現光明海。——颂依庄严住（举能显所）。\n- **别二（颂3上）**：或有清淨光明剎，依止虛空界而住，或在摩尼寶海中，復有安住光明藏。——颂依空／依宝光明。\n- **别三（颂4）**：如來處此眾會海，演說法輪皆巧妙，諸佛境界廣無邊，眾生見者心歡喜。——颂佛光（禀佛教光成世界故）。\n- **别四（颂5）**：有以摩尼作嚴飾，狀如華燈廣分布，香焰光雲色熾然，覆以妙寶光明網。——颂宝色光明住（以严及覆影显依住）。\n- **别五（颂6）**：或有剎土無邊際，安住蓮華深大海，廣博清淨與世殊，諸佛妙善莊嚴故。——颂佛音声（「妙善所感，音声有威神故」）。\n- **别六（颂7–8）**：或有剎海隨輪轉……／或有住於金剛手，或復有住天主身，毘盧遮那無上尊，常於此處轉法輪。——颂第七八二住（金刚手、世主身），兼显说法。\n- **别七（颂9–14）**：或依寶樹平均住……／或有依止金剛幢……／或脩或短無量種……／如是種種各差別……／或有在空懸覆住……／十方諸佛大神通……。——颂依菩萨身住（「若树若水皆菩萨身菩萨现故」）；六颂。\n- **别八（颂15–22）**：或有國土周法界……／或現種種莊嚴藏……／一一國土微塵內……／為欲成熟眾生故……／法界國土一一塵……／如一塵中自在用……／一切廣大諸剎土，如影如幻亦如焰……／滅壞生成互循復……。——「皆颂普贤愿所生住。」澄观于中三：初明广大国土（周法界），次明微细国土调生自在（尘中现刹），末彰刹体性结归有在（「初偈明刹依性有，有即非有；次半成坏更起，犹若寻环；后半结归普愿，兼显广业」）。\n\n**疏解（总）**：此段二十二颂为全品各事之最富（他事 9–10 颂），故其义亦最繁——由「依住」一门，摄「佛神力·愿力·业力·大小无碍」诸义；末三颂（20–22）「如一尘中／一切广大诸刹土如影如幻／灭坏生成互循环」正为下「重重无尽」「无差别」之门。\n\n### 2.5 事三（形状）\n\n**经文（长行）**：\n\n> 爾時，普賢菩薩復告大眾言：「諸佛子！世界海有種種差別形相。所謂：或圓，或方，或非圓方，無量差別；或如水漩形，或如山焰形，或如樹形，或如華形，或如宮殿形，或如眾生形，或如佛形……。如是等，有世界海微塵數。」\n\n**疏解**：澄观「第三形相，亦通染净。长行释中，**非圆方者，三维八隅皆非圆方，故云无量差别**；山焰形者，如山似焰，皆取上尖，对上方圆等故」。颂「十偈分二：**初一总赞劝观，余皆正颂前义，兼举因显果**。于中初二颂前十段，后七颂前无量差别」。\n\n**名相**：\n- **水漩形**——如水洄澓（漩涡）之形；颂云「摩尼轮状」即「水旋之类」。\n- **山焰形**——「如山似焰」，上尖之形。\n- **三維及八隅**（颂2）——三维（三方）及八隅（八角），皆「非圆方」之属。\n\n**会读**：李通玄「第三段中，尔时已下有六行经，有二十行颂，明世界差别形，由业。如文具明」。\n\n**逐颂细读（LG03·十颂）**：\n1. 諸國土海種種別，種種莊嚴種種住，殊形共美遍十方，汝等咸應共觀察。——总赞劝观（「初一总赞劝观」）。\n2. 其狀或圓或有方，或復三維及八隅，摩尼輪狀蓮華等，一切皆由業令異。——正颂前十段；「摩尼轮者即水旋之类」。\n3. 或有清淨焰莊嚴，真金間錯多殊好，門闥競開無壅滯，斯由業廣意無雜。——颂山焰、门闼竞开（义兼宫殿）。\n4. 剎海無邊差別藏，譬如雲布在虛空，寶輪布地妙莊嚴，諸佛光明照耀中。——颂前差别藏、宝轮布地。\n5. 一切國土心分別，種種光明而照現，佛於如是剎海中，各各示現神通力。——「一切国土心分别」——总由心业。\n6. 或有雜染或清淨，受苦受樂各差別，斯由業海不思議，諸流轉法恒如是。——彰刹由因异（染净苦乐）。\n7. 一毛孔內難思剎，等微塵數種種住，一一皆有遍照尊，在眾會中宣妙法。——「后四明自在由佛」；毛孔内难思刹。\n8. 於一塵中大小剎，種種差別如塵數，平坦高下各不同，佛悉往詣轉法輪。——尘中大小刹「平坦高下」。\n9. 一切塵中所現剎，皆是本願神通力，隨其心樂種種殊，於虛空中悉能作。——结归本愿神通力。\n10. 一切國土所有塵，一一塵中佛皆入，普為眾生起神變，毘盧遮那法如是。——「一一尘中佛皆入」，结归毗卢遮那。\n\n### 2.6 事四（体性）\n\n**经文（长行）**：\n\n> 爾時，普賢菩薩復告大眾言：「諸佛子！應知世界海有種種體。所謂：或以一切寶莊嚴為體，或以一寶種種莊嚴為體，或以一切寶光明為體，或以種種色光明為體，或以一切莊嚴光明為體，或以不可壞金剛為體，或以佛力持為體，或以妙寶相為體，或以佛變化為體，或以日摩尼輪為體，或以極微細寶為體，或以一切寶焰為體，或以種種香為體，或以一切寶華冠為體，或以一切寶影像為體，或以一切莊嚴所示現為體，或以一念心普示現境界為體，或以菩薩形寶為體，或以寶華蘂為體，或以佛言音為體。」\n\n**疏解**：澄观「第四刹体，唯约净刹。长行**略辩二十种体**。然其刹体诸教不同——或以八微为体，或以唯心为体，或法性为体，或一切法为体。今皆具之：谓众宝等即是八微，加之佛音声即九微也；一念心现是唯识顿变；佛变化者或通果色，或一切法，令三世间互相作故。又融上说为无碍刹体」。\n\n**名相**：\n- **體性**——刹之体。梵 `loka-dhātu-svabhāva`〔待核〕。\n- **一念心普示現境界為體**——「唯识顿变」；**佛言音為體**——「无碍体事故，又依如来势力起故」。\n- **日摩尼輪**——即日轮（喻光明为体）。\n\n**会读**：李通玄「第四，尔时已下有十三行经、十行颂，明世界体差别」。\n\n**逐颂细读（LG04·十颂）**：澄观「颂中十偈」——\n1. 或有諸剎海，妙寶所合成，堅固不可壞，安住寶蓮華。——颂初三（一切宝庄严、一宝种种、不可坏金刚）。\n2. 或是淨光明，出生不可知，一切光莊嚴，依止虛空住。——颂第三（一切宝光明）、第四（种种色光明）。\n3. 或淨光為體，復依光明住，光雲作嚴飾，菩薩共遊處。——颂第五（一切庄严光明）。\n4. 或有諸剎海，從於願力生，猶如影像住，取說不可得。——颂二种体：「愿力生者颂佛力持，如影像现颂妙宝相」，兼二事颂佛变化。\n5. 或以摩尼成，普放日藏光，珠輪以嚴地，菩薩悉充滿。——上半颂日轮，下半颂微细宝。\n6. 有剎寶焰成，焰雲覆其上，眾寶光殊妙，皆由業所得。——颂宝焰殊妙（亦兼香）。\n7. 或從妙相生，眾相莊嚴地，如冠共持戴，斯由佛化起。——颂宝冠（宝冠亦佛变化）。\n8. 或從心海生，隨心所解住，如幻無處所，一切是分別。——颂「一念普现境界」（唯识顿变）。\n9. 或以佛光明，摩尼光為體，諸佛於中現，各起神通力。——颂一切宝庄严示现及后三体（菩萨形宝、宝华蘂、佛言音）。\n10. 或普賢菩薩，化現諸剎海，願力所莊嚴，一切皆殊妙。——结归普贤。\n\n### 2.7 事五（庄严）\n\n**经文（长行）**：\n\n> 爾時，普賢菩薩復告大眾言：「諸佛子！應知世界海有種種莊嚴。所謂：或以一切莊嚴具中出上妙雲莊嚴，或以說一切菩薩功德莊嚴，或以說一切眾生業報莊嚴，或以示現一切菩薩願海莊嚴，或以表示一切三世佛影像莊嚴，或以一念頃示現無邊劫神通境界莊嚴，或以出現一切佛身莊嚴，或以出現一切寶香雲莊嚴，或以示現一切道場中諸珍妙物光明照耀莊嚴，或以示現一切普賢行願莊嚴……。如是等，有世界海微塵數。」\n\n**疏解**：澄观「第五段刹庄严中，**唯明净刹**。其中或宝为严，或人或法，或说法修行示现融摄，皆为严刹，**以人法为宝故**。又由说法因等得庄严果，以果名因，为庄严也」。颂「十颂分二：初一总显刹严，后九别颂上文」。\n\n**名相**：\n- **莊嚴**——刹之严饰；此品以「**人法为宝**」——菩萨功德、众生业报、愿海、佛影像、普贤行愿皆可为庄严。\n- **一切莊嚴具中出上妙雲**——庄严具出妙云，即「妙云」庄严。\n\n**会读**：李通玄「第五，尔时已下有十一行经、二十行颂，明世界庄严差别」。\n\n**逐颂细读（LG05·十颂）**：\n1. 廣大剎海無有邊，皆由清淨業所成，種種莊嚴種種住，一切十方皆遍滿。——总显刹严（清净业成）。\n2. 無邊色相寶焰雲，廣大莊嚴非一種，十方剎海常出現，普演妙音而說法。——颂初「妙云」庄严。\n3. 菩薩無邊功德海，種種大願所莊嚴，此土俱時出妙音，普震十方諸剎網。——颂第二菩萨功德＋第四菩萨愿海。\n4. 眾生業海廣無量，隨其感報各不同，於一切處莊嚴中，皆由諸佛能演說。——却颂「说众生业报」。\n5. 三世所有諸如來，神通普現諸剎海，一一事中一切佛，如是嚴淨汝應觀。——颂三世佛影像庄严。\n6. 過去未來現在劫，十方一切諸國土，於彼所有大莊嚴，一一皆於剎中見。——颂一念顷示现无边劫神通境界。\n7. 一切事中無量佛，數等眾生遍世間，為令調伏起神通，以此莊嚴國土海。——颂出现一切佛身庄严。\n8. 一切莊嚴吐妙雲，種種華雲香焰雲，摩尼寶雲常出現，剎海以此為嚴飾。——颂宝香云庄严。\n9. 十方所有成道處，種種莊嚴皆具足，流光布逈若彩雲，於此剎海咸令見。——颂道场诸珍妙物光明照耀庄严。\n10. 普賢願行諸佛子，等眾生劫勤修習，無邊國土悉莊嚴，一切處中皆顯現。——颂普贤行愿庄严（结归）。\n\n### 2.8 事六（清净）\n\n**经文（长行）**：\n\n> 爾時，普賢菩薩復告大眾言：「諸佛子！應知世界海有世界海微塵數清淨方便海。所謂：諸菩薩親近一切善知識同善根故，增長廣大功德雲遍法界故，淨修廣大諸勝解故，觀察一切菩薩境界而安住故，修治一切諸波羅蜜悉圓滿故，觀察一切菩薩諸地而入住故，出生一切淨願海故，修習一切出要行故，入於一切莊嚴海故，成就清淨方便力故……。如是等，有世界海微塵數。」\n\n**疏解**：澄观「第六段明刹清净方便者，**唯约净也**。若约随宜摄物、佛应统之，则净秽皆称佛土；若就**行致**，唯净非秽」。净有二种：一**世间净**（离欲秽，以六行为方便，上二界为净土）；二**出世间净**（复二：出世间——二乘以缘谛为方便，权教说无别净土，约实言出三界外别有净土；出世上上净——菩萨以万行为方便，以实报七珍为土）。今此「**正明菩萨，兼显二乘**」。又「**起具因缘通于染净，此则唯净；庄严多约其果，清净多约其因**。又前多修善，此多治恶，故于世界，此如洗涤，彼如粉绘」。\n- 逐句配位：一近善友同善根（地前）；二智导慈云大弥法界；三法门胜解（皆已净治，约位地前）；四即初地证遍行如故（「观察一切菩萨境界而安住」）；五修治等（见道之后修道位）；六初地胜进遍学十地行法；七初地发愿顺行至第八地「一切皆成故名出生一切愿海」（纯无漏故）；八即九地（二乘出要唯止与观，菩萨出要唯无碍辩）；九一切庄严者（十地二严皆成满）；十净方便力（即普贤佛功德）。\n- 「**十中前三变化净因，后七受用净因**」；「若约横修，初心即可圆具其十」。\n\n**名相**：\n- **清淨方便海**——净因（方便）之海。澄观「净方便即是净因」。\n- **出要行**——出离之要行；「二乘出要唯止与观，菩萨出要唯无碍辩，令众出故」。\n\n**会读**：李通玄「第六，尔时已下有十行经并有二十行颂，所修行方便愿力故，出生诸世界海庄严故；业清净故庄严清净，业垢浊故庄严垢浊」。\n\n**逐颂细读（LG06·九颂）**：澄观「颂中九偈分二：**初一总明能所净，后八别颂前文**（初四如次颂上四净，第五颂修治净及超颂第七愿净，第六颂第八出要，第七颂第九及却颂观菩萨地，第八颂方便力）」：\n1. 一切剎海諸莊嚴，無數方便願力生，一切剎海常光耀，無量清淨業力起。——总明能所净（前半方便，后半清净；皆上句果下句因）。\n2. 久遠親近善知識，同修善業皆清淨，慈悲廣大遍眾生，以此莊嚴諸剎海。——颂第一近善友（「初地慈悲为首，故云为生修行，遍满真如故云广大」）。\n3. 一切法門三昧等，禪定解脫方便地，於諸佛所悉淨治，以此出生諸剎海。——颂第二、三（法门胜解、智导慈云）。\n4. 發生無量決定解，能解如來等無異，忍海方便已修治，故能嚴淨無邊剎。——颂第四（观察菩萨境界安住）。\n5. 為利眾生修勝行，福德廣大常增長，譬如雲布等虛空，一切剎海皆成就。——颂第五修治净，兼超颂第七愿净（愿通初地八地）。\n6. 諸度無量等剎塵，悉已修行令具足，願波羅蜜無有盡，清淨剎海從此生。——颂第六（观察诸地入住）／第八出要。\n7. 淨修無等一切法，生起無邊出要行，種種方便化群生，如是莊嚴國土海。——颂第八出要（兼却颂观菩萨地）。\n8. 修習莊嚴方便地，入佛功德法門海，普使眾生竭苦源，廣大淨剎皆成就。——颂第九（入一切庄严海）。\n9. 力海廣大無與等，普使眾生種善根，供養一切諸如來，國土無邊悉清淨。——颂第十（成就清净方便力）。\n\n### 2.9 事七（佛出兴）\n\n**经文（长行）**：\n\n> 爾時，普賢菩薩復告大眾言：「諸佛子！應知一一世界海有世界海微塵數佛出現差別。所謂：或現小身，或現大身，或現短壽，或現長壽，或唯嚴淨一佛國土，或有嚴淨無量佛土，或唯顯示一乘法輪，或有顯示不可思議諸乘法輪，或現調伏少分眾生，或示調伏無邊眾生……。如是等，有世界海微塵數。」\n\n**疏解**：澄观「第七段，佛出差別者，**十事五对**，于海及种有此差别。五中：初二**随彼类故**，次一**缘广陜故**，次一**随机宜故**，五**熟未熟故**」。颂「十颂分三：初一颂总标，次五偈别释（如次颂前五对），后四颂总结——既随心总遍故，刹海尘数未足为多」。\n\n**名相**：\n- **佛出現差別**——身（小/大）、寿（短/长）、土（一/无量）、乘（一乘/不可思议诸乘）、化（少分/无边）之五对。\n- **不可思議諸乘法輪**——随机示现种种乘（三乘、一乘等）。\n\n**会读**：李通玄「第七，尔时已下有八行经并二十行颂，明诸世界诸佛出现差别，依众生业行寿命修短，佛出现不同」。\n\n**逐颂细读（LG07·十颂）**：\n1. 諸佛種種方便門，出興一切諸剎海，皆隨眾生心所樂，此是如來善權力。——总标（佛以善权随乐出兴）。\n2. 諸佛法身不思議，無色無形無影像，能為眾生現眾相，隨其心樂悉令見。——别释第一对（身大小）：法身无相而现众相。\n3. 或為眾生現短壽，或現住壽無量劫，法身十方普現前，隨宜出現於世間。——别释第二对（寿短长）。\n4. 或有嚴淨不思議，十方所有諸剎海；或唯嚴淨一國土，於一示現悉無餘。——别释第三对（土一/无量）。\n5. 或隨眾生心所樂，示現難思種種乘；或有唯宣一乘法，一中方便現無量。——别释第四对（乘一/诸乘）。\n6. 或有自然成正覺，令少眾生住於道；或有能於一念中，開悟群迷無有數。——别释第五对（化少分/无边）。\n7. 或於毛孔出化雲，示現無量無邊佛，一切世間皆現覩，種種方便度群生。——总结（毛孔出化云）。\n8. 或有言音普周遍，隨其心樂而說法，不可思議大劫中，調伏無量眾生海。——总结（言音普周遍）。\n9. 或有無量莊嚴國，眾會清淨儼然坐，佛如雲布在其中，十方剎海靡不充。——总结（佛如云布）。\n10. 諸佛方便不思議，隨眾生心悉現前，普住種種莊嚴剎，一切國土皆周遍。——总结（随众生心悉现前）。\n\n### 2.10 事八（劫住）\n\n**经文（长行）**：\n\n> 爾時，普賢菩薩復告大眾言：「諸佛子！應知世界海有世界海微塵數劫住。所謂：或有阿僧祇劫住，或有无量劫住，或有無邊劫住，或有無等劫住，或有不可數劫住，或有不可稱劫住，或有不可思劫住，或有不可量劫住，或有不可說劫住……。如是等，有世界海微塵數。」\n\n**疏解**：澄观「第八段，**劫住不同**——谓刹住经停时分也。随能感因有长短故。长行略列有十大数，更有多少不同」。「**十中唯九者，欠「不可說不可說」也**，并如《阿僧祇品》」。颂「十颂……**劫但时分无别义理，故此偈文转势颂之**，略分为三：初二总标许说（颂上标也），次一通颂上列（兼显修短之因，以愿力故），余七总结（偈各一义）」。\n\n**名相**：\n- **劫住**——刹住之时分。梵 `kalpa`〔待核〕。十大数：阿僧祇、无量、无边、无等、不可数、不可称、不可思、不可量、不可说（欠「不可说不可说」）。\n- **十大数**——《华严》「数法」之十，详《阿僧祇品》（八十品第三十〔待核〕）。\n\n**会读**：李通玄「第八，尔时已下有七行经并二十行颂，明世界劫住不同由业」。\n\n**逐颂细读（LG08·十颂）**：\n1. 世界海中種種劫，廣大方便所莊嚴，十方國土咸觀見，數量差別悉明了。——总标许说（颂上标）。\n2. 我見十方世界海，劫數無量等眾生，或長或短或無邊，以佛音聲今演說。——总标许说（颂上列）。\n3. 我見十方諸剎海，或住國土微塵劫，或有一劫或無數，以願種種各不同。——通颂上列，兼显修短之因（以愿力故）。\n4. 或有純淨或純染，或復染淨二俱雜，願海安立種種殊，住於眾生心想中。——总结一：明修短通于染净，结以心想。\n5. 往昔修行剎塵劫，獲大清淨世界海，諸佛境界具莊嚴，永住無邊廣大劫。——总结二：净劫住久，释以因深。\n6. 有名種種寶光明，或名等音焰眼藏，離塵光明及賢劫，此清淨劫攝一切。——总结三：列诸劫名（种种宝光明、等音焰眼藏、离尘光明、贤劫），染净相摄。\n7. 有清淨劫一佛興，或一劫中無量現，無盡方便大願力，入於一切種種劫。——总结四：佛兴愿异，故入劫不同。\n8. 或無量劫入一劫，或復一劫入多劫，一切劫海種種門，十方國土皆明現。——总结五：一多互融，齐摄双现。\n9. 或一切劫莊嚴事，於一劫中皆現覩，或一劫內所莊嚴，普入一切無邊劫。——总结六：时法相摄，普入无边。\n10. 始從一念終成劫，悉依眾生心想生，一切剎海劫無邊，以一方便皆清淨。——总结七：结由想心，示以方便（「即了唯心也」；「一念与劫并由想心，心想不生，长短安在；非长非短是谓清净；不坏于相则劫海无边」）。\n\n### 2.11 事九（劫转变差别）\n\n**经文（长行）**：\n\n> 爾時，普賢菩薩復告大眾言：「諸佛子！應知世界海有世界海微塵數劫轉變差別。所謂：法如是故，世界海無量成壞劫轉變；染污眾生住故，世界海成染污劫轉變；修廣大福眾生住故，世界海成染淨劫轉變；信解菩薩住故，世界海成染淨劫轉變；無量眾生發菩提心故，世界海純清淨劫轉變；諸菩薩各各遊諸世界故，世界海無邊莊嚴劫轉變；十方一切世界海諸菩薩雲集故，世界海無量大莊嚴劫轉變；諸佛世尊入涅槃故，世界海莊嚴滅劫轉變；諸佛出現於世故，一切世界海廣博嚴淨劫轉變；如來神通變化故，世界海普清淨劫轉變……。如是等，有世界海微塵數。」\n\n**疏解**：澄观「第九段，**劫转变故差别**者，此有二种：一者但约感成住坏，劫皆名转变；二唯约**住劫之中居人善恶，令染净转变**」。释中具二：初一（法如是故）即前义（「无量成坏劫转变」）；余九释后义。\n- 逐句：一遇恶缘故净变为染（「泉池皆枯涸等」）；二修人天大福令世界多染少净（「粳米自然生等」）；三即地前（未断障故非纯净，以净多故先云净）；四即证发心居受用土故但云纯净；五各各游者即二地至十地诸菩萨（「游戏神通，以多庄严而严一刹，或以一严而严多刹，所至染刹则能庄严」）；六大庄严者即普贤位（严于微尘内刹）；七庄严灭者（「明失善缘故恶现，谓如来示灭，能事随灭」）；八如来兴世（「如弥勒来也」）；九如来神通（「如净名足指案地、法华三变净土」）。\n- 「**上之十事，初总余别，不出业故**。又初二属凡，次四菩萨，后三属佛。又约佛菩萨，即染令净；约于凡夫，即净成染。」颂「如次颂前可知」。\n\n〔辨〕**「染淨」与「染污」之译**：经文第三、四句并云「世界海成染淨劫轉變」，澄观疑「经多云染净，与前何别？或译人之失，或传写之误」——**存疑标此**〔待核〕。\n\n**名相**：\n- **劫轉變差別**——劫中染净之转变（成住坏／住劫中居人善恶）。\n- **法如是故**——即「法尔随业转也」；「因缘意在因，转变意彰于果」——**与事一之「起具因缘」之别在此**（澄观）。\n\n**会读**：李通玄「第九，尔时已下有十四行经并十行颂，明劫随业转变净秽」。\n\n**逐颂细读（LG09·十颂）**：\n1. 一切諸國土，皆隨業力生，汝等應觀察，轉變相如是。——总颂（皆随业力生）。\n2. 染污諸眾生，業惑纏可怖，彼心令剎海，一切成染污。——颂第一（遇恶缘，净变染）。\n3. 若有清淨心，修諸福德行，彼心令剎海，雜染及清淨。——颂第二（修人天福，染净杂）。\n4. 信解諸菩薩，於彼劫中生，隨其心所有，雜染清淨見。——颂第三（地前信解，见杂染清净）。\n5. 無量諸眾生，悉發菩提心，彼心令剎海，住劫恒清淨。——颂第四（证发心居受用土，纯清净）。\n6. 無量億菩薩，往詣於十方，莊嚴無有殊，劫中差別見。——颂第五（二地至十地菩萨各各游）。\n7. 一一微塵內，佛剎如塵數，菩薩共雲集，國土皆清淨。——颂第六（普贤位，严微尘内刹）。\n8. 世尊入涅槃，彼土莊嚴滅，眾生無法器，世界成雜染。——颂第七（庄严灭）。\n9. 若有佛興世，一切悉珍好，隨其心清淨，莊嚴皆具足。——颂第八（佛兴世）。\n10. 諸佛神通力，示現不思議，是時諸剎海，一切普清淨。——颂第九（如来神通变化）。\n\n### 2.12 事十（无差别门）\n\n**经文（长行）**：\n\n> 爾時，普賢菩薩復告大眾言：「諸佛子！應知世界海有世界海微塵數無差別。所謂：一一世界海中，有世界海微塵數世界無差別；一一世界海中，諸佛出現所有威力無差別；一一世界海中，一切道場遍十方法界無差別；一一世界海中，一切如來道場眾會無差別；一一世界海中，一切佛光明遍法界無差別；一一世界海中，一切佛變化名號無差別；一一世界海中，一切佛音聲普遍世界海無邊劫住無差別；一一世界海中，法輪方便無差別；一一世界海中，一切世界海普入一塵無差別；一一世界海中，一一微塵，一切三世諸佛世尊廣大境界皆於中現無差別。諸佛子！世界海無差別，略說如是；若廣說者，有世界海微塵數。」\n\n**疏解**：澄观「第十**无差别**者——谓前九辩诸世界，约相不同、随业染净，由于众生有差别故；今云无差，**性无二故**，故偈云「业性起也」。又约权设则种种差别，今约实说则一切无差。如教法中或说三乘即是差别，说华严时一切无差。又皆是诸佛之所用故，一一融摄等无异故。故**前九差别，是此无差之差；今此无差，即是前九差之无差也**（故法华云「众生见烧，净土不毁」，二皆相即）。由依此义，说净中十八圆满，一一称真皆周遍故」。\n- 释中十事：「一海中包数同（则尽海之尘，一尘一刹，已是含摄之义）；二佛示威力同；三道场同（同真性故）；四众会同（常随众故）；五光明；六名号；七音声；八法轮方便——**上七皆约不动一而普遍无差**；九尘含刹海；十尘容佛境——**此二约不坏相而广容无差**。」颂「十颂如次，颂上十义；但第六约身与前名体异耳。而前但约平漫无差，今显**尘内重叠融摄无差**之义」。\n\n**名相**：\n- **無差別門**——性无二（理实）；与前十（差别·权设）相即。\n- **業性起**（颂9）——「一切皆由业性起」——无差之差别由业性起。\n\n**会读**：李通玄「第十，尔时已下有十五行经、二十行颂，明一切世界海如来出现无差别，一一如文具明」。\n\n**逐颂细读（LG10·十颂）**：\n1. 一微塵中多剎海，處所各別悉嚴淨，如是無量入一中，一一區分無雜越。——颂一（海中包数同；无量入一，区分无杂越）。\n2. 一一塵內難思佛，隨眾生心普現前，一切剎海靡不周，如是方便無差別。——颂二（佛示威力同）。\n3. 一一塵中諸樹王，種種莊嚴悉垂布，十方國土皆同現，如是一切無差別。——颂三（道场同，同真性故；树王庄严）。\n4. 一一塵內微塵眾，悉共圍遶人中主，出過一切遍世間，亦不迫隘相雜亂。——颂四（众会同，常随众故）。\n5. 一一塵中無量光，普遍十方諸國土，悉現諸佛菩提行，一切剎海無差別。——颂五（光明同）。\n6. 一一塵中無量身，變化如雲普周遍，以佛神通導群品，十方國土亦無別。——颂六（「约身」与前名体异；变化如云）。\n7. 一一塵中說眾法，其法清淨如輪轉，種種方便自在門，一切皆演無差別。——颂七（音声同）／八（法轮方便同）。\n8. 一塵普演諸佛音，充滿法器諸眾生，遍住剎海無央劫，如是音聲亦無異。——颂七（佛音声普遍无边劫住）。\n9. 剎海無量妙莊嚴，於一塵中無不入，如是諸佛神通力，一切皆由業性起。——颂九（尘含刹海）＋结归「业性起」。\n10. 一一塵中三世佛，隨其所樂悉令見，體性無來亦無去，以願力故遍世間。——颂十（尘容佛境）＋「体性无来亦无去，以愿力故遍世间」。\n\n### 2.13 本品小结\n\n本品以「**十事**」为纲：**起具因缘（因）→所依住（依）→形状（外状）→体性（内体）→庄严（严饰）→清净（净因）→佛出兴（佛差）→劫住（时住）→劫转变（业变）→无差别（归性）**。前十事差别而归于一「**无差别门**」——「**前九差别，是此无差之差；今此无差，即是前九差之无差**」（澄观）。此即下《华藏世界品》「别辩果相」之总纲，亦全《华严》「**一即一切、一切即一**」「**尘刹相入、依正不二**」之教门所在。\n\n> **〔本文小结·字数分布〕** 十事之中，**事二（所依住）独富**（22 颂，占十事颂数之 20%），事一、事六各 9 颂，余七事各 10 颂——**颂数不齐**（§7.2）。此非结构失衡，乃「依住」一门最需铺陈（十种所依 × 心乐差别 × 大小无碍）之故。**事十（无差别）为归**，故其义最要而颂数居中（10 颂），以「一切皆由业性起」一语总收。\n\n---\n\n## 三、旁参与前接（**非本品**）\n\n### 3.1 前接：卷第七前半《普贤三昧品第三》\n\n> **〔前接非本品〕** 卷第七前半为《普贤三昧品第三》，**不属本方范围**（本方＝卷七后半）。然二品**请说相续、分品别行**——第三品末大众以「国土云何得成立？诸佛云何而出现？及以一切众生海？」三问**请转法轮**（第三部 §2.7.2 第九偈），本品普贤即**承此请**，「以佛神力，遍观察十海」而说十事。\n\n| 环 | 第三品（卷七前半） | 第四品（本品·卷七后半） |\n|----|-------------------|------------------------|\n| 请法 | 众赞毕，以「国土云何得成立？诸佛云何而出现？及以一切众生海？」请（第三部 §2.7.2） | — |\n| 领主 | 普贤入定受加，从定起而光赞 | 普贤「**以佛神力，遍观察十海**」，普告道场众海 |\n| 说法 | （止于众请，未说世界事） | 说「**世界海十事**」：总标＋十事各长行＋颂 |\n| 义理 | 起「**行**」（入定受加·圆定之总） | 说「**境**」（众生与诸佛之刹海·成刹之缘） |\n\n> **〔本文判断〕** 第三品与本品**请说相续、分品别行**：第三品止于「众请」，本品始于「承请而说」。故读本品者，其「遍观十海」正是应前请而来；而第三品末二偈（请转法轮）**不可截断**，为本品之直接引子（第三部 §3.2′）。**六十本将「观察十海普告」置于三昧段内、起定之前**，与八十之分品别行异（§6.4）。\n\n### 3.2 旁参：卷第八起《华藏世界品第五》\n\n> **〔旁参非本品〕** 卷第八起为《华藏世界品第五》，**不属本方范围**。然二品**纲（本品）与别（彼品）相衔**——澄观：「**此品明成刹之缘，后品别辩果相故**」；「**初二品明果**（世界成就、华藏世界），后一品辩因（毗卢遮那）」。本品总明诸佛与众生所有刹海、成刹之缘（十事·十因缘），彼品则**别明本师之所严净**（华藏庄严世界海）。\n\n- **六十本**：本品之事十「无差别门」，在六十本作第十「**坏方便**」，法藏谓「**亦是释第十坏世界。以成即是坏故**」——**六十本以《华藏世界》段摄第十门**，两本品界之画分不同（§6.4）。\n- **李通玄**：判本品与《华藏世界》《毗卢遮那》三品「总为**正说分**」，「**总通此品为世界成就品**」——即三品在义理上为一「世界成就」之总说。\n\n### 3.3 本节限度\n\n本节仅录前接、旁参之**轮廓与分品关系**，以明本品之「承上启下」；**第三品、第五品之逐段校勘、注疏会读，非本方范围**（第三品已有专篇；第五品留待后续）。凡所引经一律照 `T10n0279` 原字形。\n\n---\n\n## 四、义理要点与名相\n\n> **〔体例〕** 本节统理本品之义理专题（4.1–4.5）与名相训释总表（4.7）。义理凡出注疏者注经号；凡属推断者标〔本文判断〕；梵语无把握者标〔待核〕。**疏解／名相之零出**已见于 §2 各段，本节为之总摄。\n\n### 4.1 世界海十事（差异-无差异之总纲）\n\n本品以「十事」为纲。澄观判其九、十二门之关系为「**差之无差**」：\n- **前十事（差别）**：起具因缘·所依住·形状·体性·庄严·清净·佛出兴·劫住·劫转变差别——「约相不同，随业染净，由于众生有差别故」。\n- **第十（无差别）**：「**性无二故**」——「前九差别，是此无差之差；今此无差，即是前九差之无差也」。\n- 澄观又谓此十「**亦摄十八圆满**」（《华藏世界品》中广明）。\n\n〔本文判断〕十事之次第，实为「**从因到果、从相到性**」之序：**因（起具因缘）→ 依（所依住）→ 相（形状·体性·庄严）→ 净（清净）→ 佛（出兴）→ 时（劫住·劫转变）→ 性（无差别）**。此序与澄观「揽缘成立→成已依住→外状区分→内体差别→宝等庄校→垢秽不生→佛出差殊→劫住修短→随业改变→包容必均」之十判相合。\n\n### 4.2 十因缘（成刹之缘·双源）\n\n| 因缘 | 类 | 澄观释 |\n|------|----|--------|\n| 如来神力 | 佛力 | 一切净秽等土皆如来通慧力成，就佛言之无国不净 |\n| 法应如是（法尔／法性） | 法力 | 以本识如来藏身为所依持，恒顿变起外诸器界 |\n| 一切众生行业 | 众生业力 | 业有善恶，国有净秽 |\n| 一切菩萨成一切智所得 | 菩萨愿行力 | 自受用土因（大圆镜智所成） |\n| 众生及诸菩萨同集善根 | 共业 | 变化土因（凡圣同居，共构一缘） |\n| 菩萨严净国土愿力 | 愿力 | 他受用土因（初地以上「修净土愿」） |\n| 菩萨成就不退行愿 | 行愿 | 他受用土因（八地以上功用水） |\n| 菩萨清净胜解自在 | 胜解 | 融摄转变（胜解印持随心变故） |\n| 如来善根所流及成道势力 | 佛果用 | 成正觉时念劫圆融一时成立，受用变化相融 |\n| 普贤菩萨自在愿力 | 普贤愿力 | 成与不成常能融摄（等觉位） |\n\n〔按〕十因摄**佛力／法力／众生业力／菩萨愿行力／普贤愿力**五类，**正与李通玄「众生自业果报＋佛菩萨大愿力」二源之说相印**（§1.1）。澄观又谓「**此十事展转生起**」——诸佛土总由佛力（何以？法如是故）；法尔云何有异？业不同故；众生由业，佛复由何成？一切智之所变故；……云何复得融摄重重？佛及普贤自在力故。\n\n### 4.3 依正不二·刹由心异\n\n本品要义之一：**刹由心异**。澄观：「**佛果依正，闻修方起；众生业报，本自有之**」；「**刹由心异，当净自心及他心故**」。此义贯穿全品：\n- **所依住**（事二）：「依异者，由于心乐有差别故」；「如何广大世界，依有情等小类而住？——外由内感，故说依身」。\n- **形状**（事三）：颂「一切国土心分别，种种光明而照现」。\n- **劫住**（事八）：颂「始从一念终成劫，悉依众生心想生」。\n- **劫转变**（事九）：染净随业，「**约佛菩萨，即染令净；约于凡夫，即净成染**」。\n- **无差别**（事十）：颂「一切皆由业性起」。\n\n〔本文判断〕「依正不二」于本品之表述为「**境随心转**」——十事之差别（净秽·形体·劫住·转变）皆以众生业与佛菩萨愿为二源，故「净自心」即「净国土」之因。此义上承第二品「果德遍照」、第三品「圆定起行」，下启《华藏世界》「本师所严净」。\n\n### 4.4 重重无尽（尘刹相入）\n\n「**一一微尘中现一切刹、一切佛、一切三世**」——本品十事屡言之：\n- 事三（颂7–8）：「一毛孔内难思刹……于一尘中大小刹」。\n- 事六（颂14）：「一一微尘内，佛刹如尘数，菩萨共云集，国土皆清净」。\n- 事十（颂1、9、10）：「一微尘中多刹海……无量入一中，一一区分无杂越」「刹海无量妙庄严，于一尘中无不入」「一一尘中三世佛，随其所乐悉令见，体性无来亦无去，以愿力故遍世间」。\n\n又澄观由事一之颂（第七、八、九偈）开出「**无碍十种**」：理事无碍、成坏无碍、广陜无碍、相入无碍、相即无碍、微细无碍、隐显无碍、重现无碍、主伴无碍、时处无碍——「此十无碍同时具足，自在难知，散在诸文，可以**六相**融之」（§4.5）。法藏（六十本）亦就世界海立「**十门**」（种类·居人·名体·染净·漏无漏·共不共·世间涅槃·依正·人法·无碍，`T1733`）——**古今诸师皆以「无碍」为世界海之总义**。\n\n### 4.5 六相圆融（诸师释行之钥）\n\n澄观谓无碍十门「可以**六相**融之」——六相（总相·别相·同相·异相·成相·坏相）为《华严》十玄之钥。本品「十事」正可六相会之：\n- **总／别**：世界海为总，十事为别。\n- **同／异**：十事同是「世界海」之相用（同），而各各门别（异）。\n- **成／坏**：十事「展转生起」为成；「无差别门」则「成即是坏」（六十本第十「坏方便」，法藏「以成即是坏故」）——**事十正六相之「坏相」**。\n\n〔本文判断〕以六相会十事，则**事一至事九为「总别同异成」之展开，事十「无差别门」为「坏相」之归**——「成即是坏」，故十事终于「无差别」。此与前九「差别」相即（§4.1）为一义之两面。\n\n### 4.6 名相训释总表（梵汉·信度）\n\n| 名相 | 释义 | 出处 | 信度 |\n|------|------|------|------|\n| 世界（世·界） | 世＝三世（去来今）／隐覆；界＝方分／分齐 | §1.1（澄观、法藏） | T1 |\n| 世界海 | 积刹成种、积种成海，海无别体，世界都名 | §1.1（澄观） | T1 |\n| 成就（世界成就） | 能成之缘（十缘等），能所合目 | §1.1（澄观） | T1 |\n| 世界海成就（梵题） | 梵本作「世界海成就」，汉译略「海」 | §1.1（澄观转述） | T1〔待核〕 |\n| 起具因缘 | 世界海生起之具足因缘（十种） | §2.3 | T0 |\n| 法应如是／法尔 | 梵 `dharmatā`（达磨多），或译法性 | §2.3（澄观） | T1 |\n| 所依住 | 刹之所依止（十种） | §2.4 | T0 |\n| 体性 | 刹之体（二十种） | §2.6 | T0 |\n| 清净方便海 | 净因（方便）之海 | §2.8 | T0 |\n| 劫住 | 刹住之时分（十大数） | §2.10 | T0 |\n| 劫转变差别 | 劫中染净之转变 | §2.11 | T0 |\n| 无差别门 | 性无二（理实），与十事差别相即 | §2.12 | T0 |\n| 业性起 | 一切「皆由业性起」（无差之差别） | §2.12（颂9） | T0 |\n\n---\n\n## 五、注疏选要（诸家会读）\n\n> **〔本轮增补〕** 原列三家（澄观·法藏·李通玄）之外，本轮增**智俨《搜玄分齊通智方軌》**（`T1732`，见 §5.2′）与**慧苑《續華嚴略疏刊定記》**（`X0221`，见 §5.2″）二家，故统称「诸家」，不复以数限。下表仍以原有三家为准，不改。**〔四家补位〕** 本轮复据本机听录**逐字回源**，于 §5.3′ 补列**海云继梦和上讲记会读**——法藏·澄观·李通玄·海云**四家之位至此齐备**（讲记属「一家之判，非经证」，见 §5.3′ 界限）。\n\n> **〔体例〕** 取古今三家——**唐·法藏《探玄记》**（`T1733`，六十本）、**唐·李通玄《新华严经论》／《合论》**（`T1739`／`X0223`）、**唐·澄观《华严经疏》**（`T1735`）——逐字回源，各摘其判本品之要；**凡异说并存而不强断**。三家所据本不同（法藏据六十、李通玄据八十、澄观据八十），故此对读兼见**译本与判释之两重差异**。\n\n### 5.1 澄观《大方广佛华严经疏》（`T1735`）——「世界成就品第四」段\n\n**四門判**（*fourfold analysis*: 來意 *purpose/occasion*、釋名 *explanation of title*、宗趣 *main theme/doctrinal purport*、釋文 *exegesis*）：**來意**（「前說緣既具，此下正陳所說，總明果相，別答法界安立海問，故此品來」）、**釋名**（世＝三世·界＝方分·成就＝能成之緣·依主釋；梵題「世界海成就」）、**宗趣**（「標列無邊勝德，廣釋所知世界海為宗」（*the main theme: setting forth and expounding the ocean of worlds*，*ocean of worlds* = *dhātu-samudra*），意趣多種，「一令諸菩薩發大信解悟入為趣」……）、**釋文**。\n\n**释文·总判**：「**三品正陈法海，于中分二：初二品明果，后一品辩因**。然有二意：一约兼明，则前二品通答前三十句果问，后一品答前十句因问……二将前二品望前品末三问，通答依正……**于此品明成刹之缘，后品别辩果相故**。」\n\n**释文·科判**：\n- 「今初分二：**先总标纲要，即为本分；后正陈本义，即是说分**。前中亦二：**先承力遍观，后牒问许说**。」\n- 承力遍观：「上入三昧内契其源，今云遍观外审其相。十海之义已如问释，但小不次耳。」\n- 牒问许说分四：牒问略叹／许说分齐／说所成益／赞胜诫听。\n- 「第（正陈）中十事」：起具因缘（「佛土之义虽有多，不出法性·受用·变化三；开受用有自有他则成四」；十因「初三通显，次四别明，后三则融摄转变」）、所依住、形相、刹体、庄严、清净方便、佛出差别、劫住、劫转变、无差别。\n\n**總義**：「**世界廣深，目之為海。謂積剎成種、積種成海，海無別體，世界都名**」（*the ocean of worlds*，*dhātu-samudra*）；末門「**前九差別，是此無差之差；今此無差，即是前九差之無差也**」（*difference within non-difference / non-difference within difference*）。\n\n**【要点提炼】**（L.236 会读深化）\n\n1. **三品一答之总判**：「三品正陈法海，初二品明果，后一品辩因」——世界成就（缘）＋华藏世界（相）答果问，毗卢遮那答因问；本品之位是**答「法界安立海问」**（上引「释文总判」段）。\n2. **遍观之内外句**：「上入三昧内契其源，今云遍观外审其相」（上引科判段）——普贤三昧是内证，本品遍观是外审；**定与观之分工**在此一句（与第三部 §5.1 宗趣相接）。\n3. **十因之「四源三段」**：佛土不出法性/受用/变化三，开受用自有他则成四；十因「初三通显，次四别明，后三融摄转变」（上引段）——十因缘有源有段，非平列。\n4. **「无差之差」收十事**：末门无差别「前九差别是此无差之差，今此无差即是前九差之无差」（上引总义段）——十事以遮诠收，**差别门之究竟是无差别**。\n\n**【阐释】**（〔本文判断〕）\n\n- **总判之答问学**：澄观把三品读作「一答之三段」——本品答「缘」，后品答「相」，末品答「因」；读本品须知它只答问之一段，**不可于一品求全果**。\n- **「海无别体，世界都名」**：「海」不是实体，是积剎积种之**总名**——本品所成之「世界海」，其本体即世界之集；现代语：海是集合名词，非另一层存在。\n- **启发**：「无差之差」句式（A 是 B 之 X，B 是 A 之 X）是华严十门收尾的典型**互映句法**——它告诉你前十门是门，末门是门之 doorway。\n\n### 5.2 法藏《华严经探玄记》（`T1733`）——〈卢舍那佛品〉世界海段（六十本）\n\n法藏所据为六十本，本品并入〈卢舍那佛品第二〉，故其判不题「世界成就品」而就「世界海」立说（`T1733`）。\n\n**通释世界海十门**：「今通释诸世界海，略作十门：**一种类、二居人、三名体、四染净、五漏无漏、六共不共、七世间涅槃、八依正、九人法、十无碍**。」\n\n**十事名目**（六十本）：「此上三类通有十事为首成世界：**一说世界海、二起具因缘世界海、三住世界海、四形世界海、五体世界海、六庄严世界海、七清净世（界海）、八……**」——**六十本十事有「说世界海」而无「劫转变差别」「无差别门」**，第十作「坏方便」（属《华藏世界》段）。\n\n**科判**：「文中二：初**广辨世界海**，答前果问；二从乃往过去下答前因问。初中二：先散说世界，后偈颂总持。前中二：初通论十世界，后**别辨华藏界——亦是释第十坏世界，以成即是坏故**。」\n\n**【要点提炼】**（L.236·法藏）\n\n1. **十门＝世界海之范畴学**：种类/居人/名体/染净/漏无漏/共不共/世间涅槃/依正/人法/无碍（上引「通释十门」段）——每一门是一对（或一列）范畴，世界海由此十对构成。\n2. **六十十事之「说世界海」居首**：六十以「说世界海」为首事而无八十之「劫转变差别」「无差别门」，第十作「坏方便」（上引「十事名目」段）——两译十事之差即 §6.4 对照表之据。\n3. **科判答问两分**：广辨答果问＋往昔因缘答因问（上引「科判」段）——与澄观「三品一答」之分工一致（§5.1）。\n\n**【阐释】**（〔本文判断〕）法藏十门在六十本（无独立品名）下作，故其十门是「世界海」专题之**范畴总论**，非本品之科判——与澄观就本品立四门判者层次不同：法藏给「世界海」字典，澄观给「本品」路线图；读两表者各取其用。\n\n**净土判**：「小乘唯有一类娑婆等界，无别净土。三乘中有二：一约佛自住处有三（法性土·实德土·色相土）；二约佛摄化处亦有三（化身土·变染土·他受用土）。三依一乘有二：一约果分十佛自体国土海（当不可说，寄缘说十）；二约摄化处有三类（须弥山界及树形等为第一类／三千界外别有十世界为第二类／十莲华藏庄严世界海为第三类）。」\n\n### 5.2′ 智俨《搜玄分齊通智方軌》（`T1732`）\n\n**来源**：唐·智俨（华严二祖）《搜玄分齊通智方軌》（`T1732`）；本机藏 PDF 抽取本，康熙部首异体字已归一为正字，仍待二次校对〔待核〕。**旧著录误题「法藏」，本轮已订正**（见部1 八.5）。\n\n**智俨就六十本立论**：六十本**无独立〈世界成就品〉**——其内容并入〈盧舍那佛品第二〉（＝八十品2–6）。故 `T1732` 于本品**无逐品玄谈**；其可据者，为品2「四门分别」之通判：\n\n**（一）辨名**：\n\n> 「一釋名者。盧舍那此云廣博嚴淨。……正報強故舉人顯土。」（`T1732` 品2）\n\n**（二）来意**：「二來意者。何故此品來。既眾集已。次明所顯法故也。」\n\n**（三）宗趣**：\n\n> 「三辨宗趣者有二。一人。二法。……法者四種淨土為此會宗。又亦可法界及世界海為宗也。」（`T1732`）\n\n**按**：智俨以「**四種淨土**」为会宗，又以「**法界及世界海**」为宗——「世界海」正本品（及华藏世界品）之主题；此为「世界海为宗」之最早标举，与澄观「世界海成就」（§5.1）、法藏「四土」（§5.2）可对读〔本文判断〕。\n\n**（四）分文释（三分判）**：\n\n> 「二就品分者有三。初至光覺等來舉果勸樂生信分。二明難下明修因契果生解分。三離世間下辨依緣修行成德分。」（`T1732`）\n\n**【要点提炼】**（L.236）\n\n1. **「世界海为宗」之最早标举**：「法者四种净土为此会宗。又亦可**法界及世界海**为宗也」（上引宗趣段）——本品与华藏世界品之主题，智俨先揭。\n2. **「正报强故举人显土」**：辨名谓依报之品而题佛名，因正报强、举人显土（上引辨名段）——品题命名学之一则。\n3. **三分判定位**：本品属「举果劝乐生信分」（上引分文段）——与第二部同分（§第二部 §5.2′）。\n\n**【阐释】**（〔本文判断〕）智俨此宗趣句（「亦可法界及世界海为宗」）一语，是后来诸家「就海立宗」（澄观「世界海成就」·法藏「就世界海立说」）之源头——读第四、第五两部品，皆当带此句入门。\n\n**会读**：智俨三分判中，本品（八十品4）属「**舉果勸樂生信分**」；其「世界海为宗」之说，为读本品「成就＋世界海」二事之最早教判背景〔本文判断〕。\n\n### 5.2″ 慧苑《續華嚴略疏刊定記》（`X0221`）\n\n**来源**：唐·慧苑《續華嚴略疏刊定記》（`X0221`，卍续藏）；PDF 抽取本，异体字已归一，仍待二次校对〔待核〕。慧苑就八十本立论，本品（品4）于 `X0221` 有逐品玄谈，亦立「四门同前」。\n\n**（一）释名**（含梵题复原）：\n\n> 「初釋名者。世謂隱覆。界即分齊。謂諸有為可破壞世。則隱覆無為不可壞法。從真性起。同無為法。則隱覆有為可破壞世。各不相雜。是其分齊。……然則世界是所成就。成就是能成就。今此品中但辨能成。能成非即世界。從所成以立名。世界成就依主釋也。」（`X0221` 品4·释名）\n\n慧苑复列其所得梵本之**逐词对音**（「嚕迦駄都」＝世界、「三慕達羅」＝海也、「涅第奢」＝演說、「[這-言+(厂@若)]縛怛囊」＝觀察、「三牟陀儉摩」＝合集、「娜忙」＝名也、「鉢里冗多」＝品也），而後云：\n\n> 「若依逈文。總云名觀察十方世界海演說合集品。今但名世界成就品者。譯家存略太甚也。」（`X0221` 品4）\n\n**按**：慧苑**直判「譯家存略太甚」**——谓梵本总名当作「**觀察十方世界海演說合集品**」，汉译略为「世界成就品」。此与澄观「準梵本中，云世界海成就，下文辯海，譯人略也」（§5.1）**同为一事**（皆指汉译从简），而**慧苑之梵名复原更详**，可补澄观、法藏之未备〔本文判断〕。\n\n**（二）成意（来意）**：「二成成意者。前明方便。今辨正說。故此成也。」〔底本作「成成意」，疑「來意」之讹，照录不统一〕\n\n**（三）宗趣**：「三宗趣者。通說十方一切剎海能成就本末為宗。為明華藏剎海為趣。亦可觀十海說十智為宗。為說剎海成就本末為趣。」\n\n**（四）释文**：\n\n> 「四釋文者。自下三品經。明當會正說。於中初二品。通答前問三十句果相。後一品。明佛昔因。通答前問十句因相。」（`X0221` 品4）\n\n**（五）本品末结**：「上來略釋世界成就品竟。」（`X0221`）\n\n**【要点提炼】**（L.236）\n\n1. **「世＝隐覆、界＝分齐」之训**：有为可破坏世隐覆无为不可坏法，各不相杂是其分齐（上引「初释名者」段）——异于澄观「三世/方分」之训（§5.1），**训世两法并存**。\n2. **依主释定品名**：「世界是所成就，成就是能成就……从所成以立名，世界成就**依主释**也」（上引段）。\n3. **梵名逐词复原**：嚕迦駄都（世界）三慕達羅（海）涅第奢（演說）……总云「**觀察十方世界海演說合集品**」，直判「**译家存略太甚**」（上引梵名段）。\n4. **宗趣双判**：「通说十方一切刹海能成就本末为宗，为明华藏刹海为趣；亦可观十海说十智为宗」（上引宗趣段）。\n5. **三品答问**：初二品通答三十句果相、后一品通答十句因相（上引释文段）。\n\n**【阐释】**（〔本文判断〕）\n\n- **梵名复原之文献价值**：汉译四字题（《世界成就品》）对梵本十一字题（观察十方世界海演说合集品），存略之失由慧苑逐词对音记录而得见——**品名本身就是对读对象**；澄观「译人略也」（§5.1）一言，慧苑给出全部证据。\n- **训「世」两法**：慧苑「隐覆」训出**有遮无覆之结构**（有为隐覆无为），澄观「三世」训出时间义——两训不诤，各开一维。\n\n**会读**：慧苑「**初二品（世界成就·华藏世界）通答三十句果相，后一品（毗卢遮那）通答十句因相**」一判，为读本品「答果」性质之纲——与李通玄「此五品总是答前三十七问」（部2 §5.3′）、澄观科判可对读，**三家同为「答果相」之判**〔本文判断〕。\n\n### 5.3 李通玄《新华严经论》（`T1739`）／《华严经合论》（`X0223`）——「世界成就品第四」段\n\n**三門判**（*threefold analysis*）：「今釋此品，略作三門分別：**一釋品名目，二釋品來意，三隨文釋義**。」\n\n**釋品名目**：「為明世界海依住、形相、苦樂淨穢，皆是眾生**自業果報**之所莊嚴，不從他有；佛菩薩世界海依**大願力**、依自體清淨法性力、依諸波羅蜜諸行海等自體清淨力依，為度眾生大慈悲智力，以不思議變化力之所成就，故名世界成就品。」——**眾生業力＋佛菩薩願力，二源成就**（*twofold accomplishment*: *the karmic force of sentient beings* + *the power of vows of Buddhas and Bodhisattvas*）。\n\n**釋品來意**（五）：「一**答前世主三十七問**佛海眾生海波羅蜜海等，此品示業果報、示法果報……三十七問一時總答，令大眾海悟佛所行入普賢菩薩所行也，故號佛華嚴經；二令諸現在未來始發菩提心者識佛所行及菩薩行海……；三令始發心菩薩知眾生業報同異差別由心造故；四令始發心者知眾生界廣大等法界虛空界如影相入**重重無盡**（*infinite interpenetration*）依住各別……；五令始發心菩薩知諸佛菩薩境界海、眾生境界海一異不可得故，隨眾生自業轉變剎海轉變故，隨自業成壞剎海成壞故。」\n\n**随文释义**：「此之一品**有十一段经文**。从初一段长行、一段偈颂，是此品中**叙分**；后十段长行及十段偈颂，是**正说**。及至华藏世界海，总通此品为世界成就品，总为正说分。」**叙分长科为六**：「一尔时已下四行半经，是普贤观察十海分」（余五略）。\n\n**【要点提炼】**（L.236）\n\n1. **二源成就**：众生**自业果报**之所庄严不从他有＋佛菩萨依**大愿力**、清净法性力、波罗蜜行海、大慈悲智力、不思议变化力之所成就（上引「释品名目」段）——品名「成就」二字之总解。\n2. **来意五重皆向始发心**：答三十七问／识佛所行／知业报由心造／知重重无尽／知随业转变剎海成坏（上引「释品来意」段）——五重之受者全是**始发心菩萨**。\n3. **十一段经文**：叙分（一段长行一段偈颂）＋正说（十段长行十段偈颂）（上引「随文释义」段）。\n4. **颂数与答问**：二十行颂两行一颂＝二十颂，总答前三七问，「为颂含多义故」（上引「颂之计数」段）。\n\n**【阐释】**（〔本文判断〕）\n\n- **二源成就与 §2.2 十因缘对读**：李氏把十因缘收为「二源」（众生业力＋佛菩萨愿力）——恰是 §2.2 十因之归类（§1.4「摄佛力/法力/众生业力/菩萨愿行力/普贤愿力五类」之更简版）；二源说是李氏判教「信心成就在于自业与愿力之交」之根据。\n- **来意五重之教化性**：澄观来意答问、慧苑来意叙分，**李氏来意五重句句是对「始发心者」说话**——长者系之实践性格于此可见。\n\n**颂之计数**：「于此二十行颂中**两行为一颂**，于中意有二十，总答前三七问，为颂含多义故。」\n\n### 5.3′ 会读（海云讲记）\n\n**来源**：海云继梦和上《八十华严导读》（西安草堂寺 201005）讲记，本机 `docs/huayanhai/华严云海/浩瀚华严海/八十华严导读-西安草堂寺201005/听录/`（口说**听录**，属二手转写，措辞或有出入，凡与经不合者以经为正）。以下引海云语皆逐字取自听录原文。**另据 99华严讲记 Ep15（正行第三集）§四「世界成就品第四」以 CBETA `T10n0279` anchor 程序切片逐字回源**（见 §5.3′.4）——本品正行段已得，与第八品四圣谛俟 Ep16 不同。\n\n#### 5.3′.1 此品为普贤「作答」之始·十事十缘（导读05）\n\n> 「那么这个部分我们看啊，这个普贤菩萨开始作答，就是答这个世界海的部分，那世界海的部分那，主要就是<世界成就品>，<世界成就品>那，有没有?<世界成就品>讲十缘，成立呀其实有十个因缘、十件事。」（导读05）\n>\n> 「这是普贤菩萨告诉我们<世界成就品>这个部分，这个部分其实他不长，哦，他跟普贤三昧品合成一卷经文，这两品是一卷经文」（同）\n\n- **对读·十海**：海云于同讲口列所观诸海：「观察十海，哦世界海，众生海佛海，这个法界海业海根欲海，诸佛法轮海，三世海，如来愿力海，啊，如来神变海，大概十个。」——本席回核 `T10n0279` 品首（0034b10–b14），经文作：「爾時，普賢菩薩摩訶薩以佛神力，遍觀察一切**世界海、一切眾生海、一切諸佛海、一切法界海、一切眾生業海、一切眾生根欲海、一切諸佛法輪海、一切三世海、一切如來願力海、一切如來神變海**；如是觀察已……」——**十海名目与次第与经文全同**（口说省「一切」、「諸佛海」简作「佛海」）〔信度 A〕。惟同讲前半一次口列作「世界海、众生海、法界海、诸佛海、众生业海、众生根欲海……」（「法界海」提前），**口说前后次第小异，照录不改，以经本次第为正**。\n- **对读·卷次（可坐实）**：「他跟普贤三昧品合成一卷经文」——回核 `T10n0279`，卷第七确含《普賢三昧品第三》＋《世界成就品第四》（卷七起 0032c22，品四起 0034b09，卷七终 0039a08）〔信度 A〕。\n\n#### 5.3′.2 二源成就：菩萨愿力×众生业力（导读06）\n\n> 「今天，我们要跟各位讲的是<华藏世界品>，上一次我们提到的是<世界成就品>，<世界成就品>那有十件事谈，就是这个世界是怎么成立的。在<如来出现品>上面一再的强调一个世界的成就啊是来自菩萨的愿力与众生的业力，这两者相和合。……菩萨的愿力是能，众生的业力是所。所以，所构成的世界庄严都不一样的。」（导读06）\n\n- **〔辨·所出〕** 此语系海云**引《如来出现品》立说**，非本品经文。其「愿力＝能、业力＝所」之判，与李通玄「世界海依住、形相、苦乐净秽，皆是众生**自业果报**之所庄严……佛菩萨世界海依**大愿力**……之所成就」（§5.3）**二源正同**〔本文判断〕——唐人注疏与今讲所见相合。海云承之又云：「在<世界成就品>里呢，他把这两个能、所他分开，普贤菩萨跟我们提出来，他谈到的有十件事」（同讲）。\n\n#### 5.3′.3 依报之判（导读02）\n\n> 「那这个是依报——《世界成就品》跟《华藏世界品》是依报，《毗卢遮那品》是正报，因为这里面讲了四个佛」（导读02）\n\n- **对读**：澄观判「**三品正陈法海……初二品明果，后一品辩因**」（§5.1），智俨判「此品内佛加普贤说**净土依果**」（§5.2′），海云则径以「**依报／正报**」分二品——三判**所用名目不同而所指相承**：本品与《华藏世界》同为「依」（果·依报），《毗卢遮那》独为「正」（因·正报）〔本文判断〕。\n\n#### 5.3′.4 正行段逐字对勘（99华严 Ep15 §四·CBETA `T10n0279` anchor 回源）【P4·2026-10-24】\n\n本品已于 99华严讲记 **Ep15**（正行第三集·台北国际会议中心）§四「世界成就品第四」以 CBETA `T10n0279` anchor 程序切片**逐字回源**（**非手抄**·去 note/app/figure、剥标签、压平后由 `cut()` 锚点抽取·assert 命中·access 2026-10-24）。与第八品四圣谛俟 Ep16 不同，**本品正行逐字已得**，据实录入。\n\n- **叙分起首·十海（对应 Ep15 §四 4.2·讲者 §D01/§C01）**：底本「**世界成就品第四·爾時，普賢菩薩摩訶薩以佛神力，遍觀察一切世界海、一切眾生海、一切諸佛海、一切法界海、一切眾生業海、一切眾生根欲海、一切諸佛法輪海、一切三世海、一切如來願力海、一切如來神變海；如是觀察已，普告一切道場眾海諸菩薩言**」——讲者 §D01 口诵「爾時普賢菩薩摩訶薩告諸大眾言・諸佛子・世界海有十種事」·§C01「普告一切道場眾海諸菩薩言」**逐字合底本起首**〔T0·信度 A〕。十海名目与次第与经文全同（§5.3′.1 已核），此处再以 Ep15 anchor 直证。\n- **十「為令」句（对应 Ep15 §四 4.2b·讲者 §C01/§C05/§C06·作意义主证）**：底本「**為令眾生，入佛智慧海故；……為令一切菩薩，安住普賢願海中故**」十句——讲者 §C01「一共列了十個」·口诵「為令眾生入佛智慧海故」「令淨修治出要道」「安住普賢願海」**合底本**；底本冠「為令」，讲者引申作「欲令」，属口诵小异·只标不改。\n- **〔本文判断〕讲者义解非经证**：讲者以「稻子／花粉」喻「自然之作意」释「為令」之「作意义」（Ep15 §C02–C03），**非经文所有**，标〔本文判断〕，不据以改经。\n- **承 Ep14 宏觀段义解**：Ep14 §E 判「本元跟本體之間的差別……這個差別最重要的原因在哪裡，就在世界成就品」·「存在聚集即污染判」——属讲者**宏觀定位之判读**〔T3·二手口说〕，可与 §5.3′.3 依报／正报之判相参，**非经证**。\n\n**界限**：以上皆海云**口说听录**之**解读**，非经证、非法师著述，措辞出入须以 CBETA 经本为准；采录之意义在存其**判读视角**（作答十事·愿业二源·依报定位），**不以其说替代注疏**。又海云于此品十事**未逐条展开**——「要谈这十件事呀大概要六个钟头以上的时间才有可能，那我们就把这个部分给略了」（导读06）；本品逐段细读仍以 §2 与 §5.1–5.3 为准〔据听录如实记〕。\n\n### 5.4 诸家判释对照表\n\n| 门 | 澄观 `T1735`（八十） | 法藏 `T1733`（六十） | 李通玄 `T1739`/`X0223`（八十） |\n|----|---------------------|---------------------|------------------------------|\n| 所据本 | 八十（实叉难陀） | 六十（佛驮跋陀罗） | 八十 |\n| 品名 | 世界成就品（梵「世界海成就」） | 就〈卢舍那佛品〉之「世界海」段 | 世界成就品 |\n| 来意 | 别答法界安立海问 | 答前果问 | 答三十七问（五意） |\n| 十事名 | 起具因缘…无差别门（10） | 说世界海…坏方便（10，异名） | （未别列，判十一科） |\n| 正说分段 | 本分（总标）＋说分（正陈） | 广辨（散说＋偈颂）／答因 | 叙分（1段）＋正说（10段） |\n| 义理总归 | 无差别门「差之无差」 | 第十「坏方便」＝华藏段 | 一异不可得·重重无尽 |\n| 净土判 | 法性·受用（自他）·变化四土 | 十门（种类…无碍） | 众生业土＋佛菩萨愿土 |\n\n〔本文判断〕诸家**互有详略而义理相成**：澄观以「本分／说分」「差之无差」立骨，最便初学；法藏以「十门」「四土」「三类」广辨净土之义；李通玄以「二源成就」「重重无尽」揭住持之因。**三家皆以「无碍／无尽」为世界海之总义**，可相印证。\n\n### 5.5 本节限度\n\n本节所摘，皆**逐字回源**（引号内为原疏文字，脚注经号与段落）；**诸家之科判只录其纲，不逐句抄录**（逐句已见 §2 各段「会读」）。凡原疏用字有异体者照 CBETA 底本；**引文省略处以「……」示之，不代补**。\n\n---\n\n### 5.5 会读总汇（L.236 升格）\n\n**① 对照矩阵**\n\n| 维度 | 澄观 | 法藏 | 智俨 | 慧苑 | 李通玄 |\n|---|---|---|---|---|---|\n| 来意 | 正陈所说·别答安立海问 | （就世界海立说） | 众集已·次明所显法 | 前明方便·今辨正说 | 五重·皆向始发心 |\n| 宗趣 | 标列无边胜德·广释世界海 | （十门范畴） | **法界及世界海为宗**（最早） | 通说刹海本末·华藏为趣 | 二源成就 |\n| 梵题 | 世界海成就（译人略） | 不题品名（依六十） | — | **觀察十方世界海演說合集品**（复原） | — |\n| 本品科 | 先总标后正陈·十事 | 广辨＋答因问 | 三分 | 三品答问（30果＋10因） | 十一段（叙＋正说十段） |\n| 训「世」 | 三世·方分 | — | — | **隐覆**·分齐 | — |\n\n**② 同异辨**\n\n- **同**：五家皆以本品为「答果问」之正陈（澄观「别答安立海海问」/慧苑「通答三十句果相」/李「答三十七问」）；皆以「海」为宗。\n- **异一（梵题三说）**：澄观「世界海成就」／慧苑复原十一字题／法藏不题——**品名本身是对读对象**（存略之辨由慧苑坐实）。\n- **异二（训世两法）**：三世（澄观）vs 隐覆（慧苑）——时间维与结构维并行。\n- **异三（答问口径）**：澄观三品一答／慧苑 30＋10 两分／李五品总答三十七——诸家「答问地图」之详略。\n\n**③ 会读启发**（〔本文判断〕）\n\n1. **品名即一部小文献史**：四字汉题背后有十一字梵题——读华严品题当问「译家略了什么」，慧苑逐词对音是最早的答案。\n2. **二源成就之教理核心**：众生业力与佛菩萨愿力之交，是世界海成坏之总则（李）——与 §2.2 十因缘对读，十因是细目、二源是纲领。\n3. **现代联结**：「海无别体」（澄观）＋十门范畴（法藏）＝**一个集合名词的结构分析**——世界海不是实体而是关系总名，此与十门「无碍」收尾相合。\n\n## 六、文本对读与校勘（八十／六十）\n\n> **〔体例〕** 以八十（`T10n0279` 卷七后半）为准，取六十（`T09n0278` 卷第三·〈卢舍那佛品第二之二〉）逐门对读。**凡异译异文并列而不强断**；无别者亦标「与汉本大体同」。六十引文一律照 CBETA **繁体原字形**（来源 `data/references/cbeta_txt/T09n0278_juan3.txt`，2026-10-16 抓）。**【P4·全本复验】本批另以本机六十全本 `data/references/cbeta/T09n0278.xml`（sha256 a2bfcee6213f）逐名复核 §6.1–6.5 所据引文，结果见新增 §6.9**（一处叙分两源自歧）。**四十华严全无本品**（四十本仅译末会，无前六品），故此对读只涉八十／六十两本。\n\n### 6.1 分品与次第（**两本画分不同**）\n\n| 项 | 八十（`T10n0279`） | 六十（`T09n0278`） |\n|----|-------------------|-------------------|\n| 品名 | **世界成就品第四**（独立一品） | **无独立品名**，段入〈**卢舍那佛品第二之二**〉 |\n| 卷次 | 卷第七后半 | 卷第三（＝卷二之二） |\n| 「观察十海普告」长行之位 | **起定之后**，为本品之首 | **起定之前**（「从三昧起」句在其后） |\n| 叙分长行与重颂 | 相连（长行→即说颂言→颂） | **为诸段所间隔**（长行在起定前，重颂在六种震动·雨宝·诸佛光赞之后） |\n| 与《华藏世界》之界 | 本品终「无差别门」，下品另起《华藏世界品第五》 | 本品「劫住」后**直接转入「莲华藏世界海」**（即《华藏世界》段），无「劫转变」「无差别」独立段 |\n\n**经文（六十·观察十海普告＝本品叙分长行相当）**：\n\n> 爾時，普賢菩薩承佛神力，觀察一切諸世界海、一切眾生海、法界業海、一切眾生欲樂諸根海、一切三世諸佛海已，普告菩薩大眾海言：「佛子！諸佛一切世界海成敗清淨智、不可思議一切眾生界起智、觀察法界智、一切如來自在智、清淨願轉法輪智、力無所畏不共法智、光明讚歎音聲智、三種教化眾生智、無量三昧法門不壞智、如來種種自在智，如是等一切皆不可思議，我當承佛神力，具足演說，欲令一切眾生入佛智海。」\n\n> **〔对读〕** 六十之「观察十海」其海为**五**（世界海·众生海·法界业海·众生欲乐诸根海·三世诸佛海），八十扩为**十海**（§2.1）；六十之「叹智」为**十智**，八十扩为**三十余句**（§2.2）；六十之「所为」仅「欲令一切众生入佛智海」**一句**，八十有**十句＋十一句**（§2.2）。**此三条皆八十详、六十略**，为同一「承力·叹智·所为」骨架之繁简之别。\n\n### 6.2 十事名目对照表（**名目有异**）\n\n| # | 八十 | 六十 | 辨 |\n|---|------|------|----|\n| 1 | 世界海**起具因緣** | **說世界海** | 六十多「说世界海」为一，八十无此名（以其为总，故不列） |\n| 2 | 世界海**所依住** | **住**世界海 | 同（略） |\n| 3 | 世界海**形狀** | **形**世界海 | 同（略） |\n| 4 | 世界海**體性** | **體**世界海 | 同（略） |\n| 5 | 世界海**莊嚴** | **莊嚴**世界海 | 同 |\n| 6 | 世界海**清淨** | **清淨**世界海 | 同 |\n| 7 | 世界海**佛出興** | **如來出世**世界海 | 同（异名） |\n| 8 | 世界海**劫住** | **劫**世界海 | 同（略） |\n| 9 | 世界海**劫轉變差別** | **（无）** | 八十增此门 |\n| 10 | 世界海**無差別門** | **壞方便**世界海 | **名异义通**：六十「坏方便」＝法藏「释第十坏世界，以成即是坏故」，即《华藏世界》段 |\n\n> **〔本文判断〕** 两本十事**并非一一对应**：六十有「说世界海」（八十省之），八十有「劫转变差别」与「无差别门」（六十无独立名），而六十之第十「坏方便」在八十为下品《华藏世界》。**此非孰优孰劣，乃分品与科段之异**：六十以「坏方便」摄华藏世界，八十别立《华藏世界品》而于本品终以「无差别门」收（参 §5.4、§6.1）。\n\n### 6.3 十因缘对照表（**数异：八十 10／六十 8**）\n\n| 八十（10） | 六十（8） | 辨 |\n|-----------|----------|----|\n| 如來神力故 | 如來神力故 | 同 |\n| 法應如是故 | 法應如是故 | 同 |\n| 一切眾生行業故 | 眾生行業故 | 同 |\n| 一切菩薩成一切智所得故 | 一切菩薩應得無上道故 | 同（异译） |\n| 一切眾生及諸菩薩同集善根故 | **（无）** | 八十增 |\n| 一切菩薩嚴淨國土願力故 | 菩薩嚴淨佛土願行解脫自在故 | 六十以**一句摄八十之三** |\n| 一切菩薩成就不退行願故 | ↑（同上所摄） | 同上 |\n| 一切菩薩清淨勝解自在故 | ↑（同上所摄） | 同上 |\n| 一切如來善根所流及一切諸佛成道時自在勢力故 | 如來無上善根依果故 | 同（六十略） |\n| 普賢菩薩自在願力故 | 普賢菩薩自在願力故 | 同 |\n| **（无）** | 普賢菩薩善根故 | 六十增此一（八十无独立项） |\n\n> **〔对读〕** 六十之 **8 缘**，其「菩萨严净佛土愿行解脱自在」一句**兼摄八十之（六）（七）（八）三缘**（愿力·不退行愿·清净胜解自在）；而六十另有「**普贤菩萨善根**」一缘（八十无独立项，其义或已在「普贤菩萨自在愿力」中）。**两本收摄不同，非缺文**——六十末亦云「如是等世界海尘数因缘具故，一切世界海成」，明其为「略说」。\n\n### 6.4 叙分次第对照（**「观察十海」与「起定」之先后异**）\n\n- **八十**（`T10n0279`）：母品《普贤三昧品》**先起定**（「尔时，普贤菩萨从三昧起」），再另行《世界成就品》，其首即「承力遍观十海」。\n- **六十**（`T09n0278` 卷三）：**先「观察十海普告」**（line 86），**后「从三昧起」**（line 87：「尔时，普贤菩萨从彼三昧起……」）——即「观察十海」尚在三昧将出之际；其重颂（十颂）更在「六种震动·雨十种宝王云·诸佛光赞」之后。\n\n> **〔本文判断〕** 此**次第之异**，正见两本**分品之别**：八十以「普贤三昧品（行）」与「世界成就品（境）」**分立二品**，故「观察十海」独立为下品之首（承请而说）；六十则并之入〈卢舍那佛品〉，故「观察十海」脉连于三昧段（起定前）。**义理无别，唯分品科段不同**。\n\n### 6.5 逐事详略对照表（**长行条目数／颂**）\n\n| 事 | 八十·长行条目 | 八十·颂 | 六十·长行条目 | 六十·颂（行数） | 辨 |\n|----|--------------|---------|--------------|---------------|----|\n| 一 起具因缘 | 10 因缘 | 9 | **8 因缘** | 131–157（27 行） | 八十详 |\n| 二 所依住 | 10 依 | **22** | **7 依** | 160–192（33 行） | 八十详（条目）；颂两本皆富 |\n| 三 形状 | 10＋等 | 10 | **6** | 195–220（26 行） | 八十详 |\n| 四 体性 | **20** | 10 | **5** | 223–242（20 行） | 八十远详 |\n| 五 庄严 | 10 | 10 | **3** | 245–264（20 行） | 八十详 |\n| 六 清净 | 10 | 9 | 1（压缩一句） | 267–284（18 行） | 八十详 |\n| 七 佛出兴 | 10 | 10 | 2 | 287–306（20 行） | 八十详 |\n| 八 劫住 | 9 大数 | 10 | 2 | **无颂** | 八十详 |\n| 九 劫转变差别 | 10 | 10 | **无独立段** | — | 八十增 |\n| 十 无差别门 | 10 | 10 | **无独立段**（＝华藏「坏方便」） | — | 八十增 |\n\n〔按〕**大体八十详、六十略**：六十长行条目多经压缩（体性 20→5、庄严 10→3、清净 10→1、佛出兴 10→2、劫住 9→2），而其**颂则两本俱富**（事二颂尤其长）。**六十偈颂之确数**（本批实测）：据 CBETA 繁体逐偈组计**句末标点**，得 **9 组·468 句**，依「四句一颂」**÷4＝117 颂**〔本文判断·据句数÷4 估〕（四·五言混排，颂界不与「两行」齐，故以句数为准；与八十 120 颂近）；逐组句数 **56／40／80／66／70／40／40／36／40**。**此数已补附录四#3**。\n\n**经文（六十·事二 所依住 长行＝对读八十 P07）**：\n\n> 爾時，普賢菩薩告諸菩薩言：「佛子！一一世界海所依住，如世界微塵數，所謂：依一切莊嚴住、或依虛空住、或依一切寶住、或依佛光明住、或依幻業住、或依摩訶那伽金剛力士掌中住、或依普賢菩薩願力住。」\n\n> **〔异译〕** 六十之「**摩訶那伽金剛力士掌中住**」，八十作「**如幻業生大力阿脩羅形金剛手住**」——「摩诃那伽」（大龙／大象）与「大力阿修罗形」为**异译异文**，并存〔待核〕。六十「依幻业住」八十作「依一切宝色光明住」等，次序亦有小异。\n\n**经文（六十·事四 体性 长行＝对读八十 P11）**：\n\n> 爾時，普賢菩薩告諸菩薩言：「佛子！諸世界海有種種體，悉應當知，所謂：一切寶莊嚴體、或一寶體、或金剛堅固地體、或眾香體、或日珠輪體。」\n\n> **〔对读〕** 八十举**二十体**（§2.6），六十举**五体**（一切宝庄严／一宝／金刚坚固地／众香／日珠轮），而**其颂（223–242）仍为十颂**——即六十「长行略而颂详」，与八十「长行详而颂亦详」为例不同。两本**长行／颂之详略分配不一**，是校读时须并观者。\n\n### 6.6 颂体对照（**句式异：八十七言／六十四·五言混**）\n\n| 段 | 八十（七言为主） | 六十（四·五言混） |\n|----|----------------|------------------|\n| 叙分颂首 | 「智慧甚深功德海，普現十方無量國……」（七言） | 「諸佛深智功德海，充滿無量無邊剎……」（五言） |\n| 事一颂首 | 「所說無邊眾剎海，毘盧遮那悉嚴淨……」（七言） | 「佛智境界，不可思議，自在善住，悉皆如是……」（四言） |\n| 事二颂首 | 「遍滿十方虛空界，所有一切諸國土……」（七言） | 「無量無邊佛剎海，離垢妙寶以莊嚴……」（五言） |\n| 事九颂 | 「一切諸國土，皆隨業力生……」（五言） | （六 界海微尘数」（无量）。\n- **边**（据经「一一塵中，有世界海微塵數剎」＋「剎中有塵」）：\n  - **每尘**邻接**一切刹**；**每刹**邻接**一切尘**（双向）。\n- 故尘—刹之间**每对皆有边** ∴ G 为**完全二部图 K_{m,n}**（m＝尘数、n＝刹数）；其极限（m,n→无量）即「**处处互入**」。\n\n**图论—拓扑性质**（〔本文判断〕）：\n\n1. **连通**：任二顶点经一中间顶点可达（尘—刹—尘）。\n2. **直径 ≤ 2**：任二尘共邻一刹；尘刹之径为 1。\n3. **无孤立点**：每点度数＝对侧基数（→无量）。\n4. **非平面**（m,n≥3）：K_{3,3} 已非平面 ∴ 不可嵌入平面 → 境界**非「平面图」**。\n5. **邻域＝全体**：以「邻接」为邻域基，每点之邻域是其对侧全体 → **密着拓扑（indiscrete topology）**之离散类比；与欧氏「局部邻接」拓扑**相异**（欧氏每点邻域可任意小，此则不然）。\n\n〔**注疏印证**〕法藏《探玄记》于〈卢舍那佛品〉世界海段立「十无碍」，其「**五重现无碍**」云：「**謂於塵中見一切剎，剎內塵中見剎亦爾，如是重重如因陀羅網**」（`T1733`）——正记此**双向相入**；又「三相入无碍」（「以一佛土满十方，十方入一亦无余」）、「四相即无碍」（「无量世界即一世界」）（`T1733`）。澄观《疏》云：「**一海中包数同，则尽海之尘，一尘一刹，已是含摄之义**」（`T1735`）。\n\n**(三) 十事之「覆盖／商」结构**：\n\n- **覆盖（cover）**：十事＝对「世界海」之**十重开覆盖**——因缘·所依·形状·体性·庄严·清净·佛出·劫住·劫转变·无差别，各为「世界海」之一**侧面（chart）**；十事**总摄**世界海（「略说有此十事；若广说者，与世界海微尘数等」），故为**无尽之十纲**。\n- **商（quotient）**：事十「无差别门」＝**商结构**——澄观「**前九差别，是此无差之差；今此无差，即是前九差之无差也**」（`T1735`）。即：前九＝「差别纤维（fiber）」，事十＝「无差别底」；**差之无差**＝商空间，**无差之差**＝纤维。〔本文判断〕\n\n**(四) L3 结论**：本品拓扑骨架＝「**尘刹相入之完全二部图**（连通·直径 2·非平面·密着）」×「**十事之覆盖 ＋ 事十之商（差之无差）**」。前者示「**一一即一切**」之**横**相入，后者示「**总相十面·十面归一**」之**竖**收摄。\n\n#### 7.4.2 L4 几何：不可欧氏嵌入·自似嵌套·因陀罗网\n\n**(一) 几何测元（据经·注疏）**：\n\n| 测元 | 出处 | 几何义 |\n|------|------|--------|\n| 「微塵數」（无量） | 本品（18 见） | 尺度**无下限** |\n| 「不壞相而廣容」 | 澄观 `T1735` | **小容大**且**保形** |\n| 「塵內重疊融攝」 | 澄观 `T1735` | 嵌套·多层 |\n| 递归重数「第三重塵含第四重剎……無窮無盡」 | 澄观《演义钞》`T1736` | **递归嵌套**（重数→∞） |\n\n〔**注疏印证**〕澄观疏（世界成就品段）：「**九塵含剎海，十塵容佛境，此二約不壞相而廣容無差**」，又「今顯**塵內重疊融攝**無差之義」（`T1735`）。其《演义钞》释「因陀罗网境界门」明列**递归**：「且以一尘望余尘说……**第三重尘含第四重刹，第四重尘含第五重刹，重重尘成重重称性，无穷无尽犹如镜灯**」（`T1736`）。\n\n**(二) 欧氏不可嵌入判定**〔本文判断·形式〕：\n\n- 欧氏空间具**体积单调性**：若 A⊂B（保形）则 vol(A) ≤ vol(B)。\n- 然本品云「尘（小）**容**世界海微尘数刹（大）」且**不坏相**（保形）——二者相违。\n- ∴ 华严「世界海」境界**不可等距（保形）嵌入任何有限维欧氏空间**。→ 须**非欧／超度量（ultrametric）**之空间（如 p-adic 型）：其「球内任一点可为中心」「无中间尺」之性质，恰契「一即一切、无差别」。\n\n**(三) 自似嵌套与分形维类比**〔本文判断·类比〕：\n\n- 演义钞之递归「**尘⊃刹、刹＝尘聚、尘⊃刹……第 N 重……**」＝**自似嵌套**：结构与**每一重重复同一形**（尘与刹互同构）。\n- 若每重含 **N**＝微尘数、尺度比 **r→0**，则 Hausdorff 维 **D＝log N／log(1/r) → ∞**——即**维数无界**，正契「**重重无尽**」。\n- 传统喻**因陀罗网（帝网）**：演义钞「一珠之内顿现万象……**所现珠影复能现影**……重重影明，重重互现，故至无尽」（`T1736`）——珠影自似、影复现影。\n- 〔限〕此为**形式类比**，非实测维数；华严「无尽」为**教理之无尽**，非可度之实维数。\n\n**(四) 「形状」事（事三）之形状谱**：世界海有种种形（方·圆·三角·莲华·卍·众生形……，§2.5）——即**底空间之形状谱**；事十「无差别」归其**形之无差**（形状之商）。故本品几何亦含「**形状—无形状**」一对。\n\n**(五) L4 结论**：本品几何骨架＝「**不可欧氏嵌入（小容大·不坏相）× 自似嵌套（重重无尽→∞）× 因陀罗网（影复现影）**」；其「维数」非有限，其「嵌入」非欧氏，正华严「**一多无碍·广狭自在**」之几何表。\n\n### 7.5 口径留痕·订正\n\n| 项 | 旧记 | 本次实测 | 说明 |\n|----|------|---------|------|\n| 「世界海」 | 71 | **59** | 旧记 71 系误（或含异段）；本批以 `T10n0279` 卷七后半剥标点后计数，raw XML 与剥标签**两法皆 59**，从 59 |\n| CJK 字 | 5,894／净 5,887 | 5,894／净 5,887 | 一致 |\n| 熵／Zipf | 7.4271／−1.3448 | 同 | 一致 |\n| `<p>`／颂 | 24／120 | 24／120 | 一致 |\n| L3 拓扑（相入图） | — | **完全二部图 K_{m,n}**（连通·直径 2·非平面·密着） | 本批新增（§7.4.1） |\n| L4 几何（嵌入·维数） | — | **不可欧氏嵌入·自似嵌套→∞** | 本批新增（§7.4.2） |\n| 六十偈颂 | 〔待核〕 | **117 颂**（9 组·468 句÷4） | 本批实测（§6.5、附录四#3） |\n\n**〔口径总声明〕** 本品诸数（CJK／独字／熵／Zipf／颂／图元）皆依**同一范围口径**——`T10n0279` **卷七后半**（自「世界成就品第四」品题起，至卷七末），**剥校勘（`<note>`／`<app>`）**。诸行之**保真号**（如 K_{m,n}、直径 2、D→∞）为**形式模型之记号**，非经典概念，悉标〔本文判断〕。\n\n### 7.6 与第三部（普贤三昧品）之比较\n\n| 项 | 第三品（卷七前半） | 第四品（卷七后半） | 比 |\n|----|------------------|------------------|----|\n| CJK 字 | 1,995（净 1,988） | **5,894（净 5,887）** | 约 3 倍 |\n| 独字 | 306 | **444** | +45% |\n| 熵 | 7.1185 | **7.4271** | 高 |\n| Zipf | −1.1429 | **−1.3448** | 更陡 |\n| 颂 | 20（2 组） | **120（11 组）** | 6 倍 |\n| 高频首字 | 一(95) | **一(237)** | 「一」倍增 |\n\n**第一、二品之照**（据各该篇本文章，卷界口径）：第一品 世主妙严 **31,953 字／700 句**（`articles/shizhu-miaoyan.html`）、第二品 如来现相 **8,119 字／208 句**（`articles/ru-lai-xian-xiang.html`）。四品篇幅序为：**一（31,953）≫ 二（8,119）＞ 四（5,894）＞ 三（1,995）**。\n\n〔本文判断〕此序正见科判之轻重：**第一品「众海」最繁**（果德广陈·50 组）、**第二品「现相」居中**（11 组）、**第四品「世界海十事」别为一纲**（10 事·120 颂）、**第三品「入定受加」最简**（2 组·20 颂）。即**「果」（一·二）先铺陈其广，「境」（四）为总纲而铺陈其十面，「行」（三）以仪式为骨而最简**——与澄观「初二品明果，后一品辩因」之判相印（§5.1）。\n\n---\n\n## 八、附录（十一类）\n\n### 附录一·计数比勘（十事／长行条目／颂／十海）\n\n| 项 | 数 | 备注 |\n|----|----|------|\n| 十事 | 10 | 总标所列（§2.3） |\n| 十因缘 | 10 | 事一长行（§2.3） |\n| 长行 `<p>` 段 | 24 | 叙 3＋正 11＋导语 10（§7.2） |\n| 偈组 `<lg>` | 11 | 叙 function _initArticleENMode(){

    s.textContent='#article-full.en-hidden blockquote.en-block{display:none}';
    document.head.appendChild(s);

    full.querySelectorAll('blockquote').forEach(function(bq){

      if(/^(英译对读|EN对应|EN\s*corresponding|EN\s*note|EN\s*register|EN\s*block|🔑|术语格义|主题对读注|卷末批注)/i.test(txt)) bq.classList.add('en-block');
    });

  _applyArticleENMode();
}
