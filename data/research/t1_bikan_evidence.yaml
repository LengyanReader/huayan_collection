# ══ 二、否定性记录（T1 检索而「查无」者）══
# 〔体例〕比勘须双向：既记「查得何以为据」，亦记「查无何物」。
#   只记正面则易生「凡所立论皆有祖典支持」之错觉——
#   实则若干关键语汇在 T1 中**根本不存在**，此正是判断「建构」的依据。
negative_findings:
  - id: N5
    key: 「下手」／「入手處」——六本 T1 全 0 见
    probe: [下手, 入手處]
    result: 0 见（T1732/T1733/T1735/T1736/T1739/X0223 俱 0）
    判读: >-
      法师体系之枢为「下手处」，而此语在 T1 六本中全不见。足证「下手处」**非祖典语
      之转译**，系当代所立之操作语汇。据此本文 §5.1 之「下手处」判为**建构**。
  - id: N6
    key: 「十玄」／「十玄門」——法藏二书全 0 见
    probe: [十玄, 十玄門]
    result: >-
      T1732 0／T1733 0／T1735 6／T1736 32／T1739 11／X0223 12；
      即**仅见于澄观及李通玄，法藏二书全 0 见**。
    判读: >-
      本语料范围内，「十玄」一名非法藏原书用语。且澄观明标其出自「古德」（C18）。
      故称华严「十玄」时须注明系**澄观所显之古德说**，不得径题法藏。
      〔待补〕法藏《搜玄记》《探玄记》全 0 见一事，是否因本地底本为**会本节录**
      而非全帙，尚未能定〔存疑〕——若日后得全帙而再见，则此判断须改。
  - id: N7
    key: 「十觀」——李通玄二书全 0 见
    probe: [十觀]
    result: T1732 6／T1733 4／T1735 15／T1736 8／**T1739 0／X0223 0**
    判读: >-
      法藏／澄观系统以「十觀」为观法之分类（见 C01、C02），李通玄系统则**全不见
      「十觀」**。故 §5.1 之比勘须分两系而言，不可笼统称「华严观门」而不辨系属。
  - id: N8
    key: 「穿衣」——六本 T1 全 0 见
    probe: [穿衣]
    result: 0 见（六本俱 0）
    判读: >-
      法师生活化修行之经典依据不在「穿衣」等日常语汇，而在李通玄「行住坐臥四威儀」
      （C24–C27）。故本文 §5.5 之上溯应指李通玄之「四威儀为教体」，
      **不可虚系于「穿衣吃饭」之类之语**。

# ══ 三、比勘结论（本文判断·非祖典亦非法师原话） ══
# 〔体例〕结论必系于上列 C 条之出处，不得凭空。以下每条皆注明所据 C 号。

conclusions:
  - sec: "5.1"
    topic: 华严观门与禅观
    依: [C01, C02, N5, N7]
    判: 建构（其中「观法须分类而可依循」之意识与祖典方向相通）
    理由: >-
      祖典之「觀門」在法藏手係**对观法之分类名目**（《離世間品》十觀之目，
      见 C01、C02），属教义分判层面；法师之「下手处」则问**行法从何处起**，
      属行法操作层面。**二者不同层**。且「下手」「入手處」于 T1 全 0 见（N5），
      足证其非祖典语之转译。故 §5.1 判为**建构**。
    附: 须分系：法藏／澄观有「十觀」，李通玄全 0 见（N7）。
  - sec: "5.2"
    topic: 普贤行与善财五十三参
    依: [C03, C04, C05, C06, C07, C08, C09, C10, C11, L1]
    判: 复原（主）；「按图索骥」「大脑的解构」为桥接性建构成分
    理由: >-
      三家共以普贤行超出常规、非摸索可及：澄观「既越常規乖於視聽」
      「**滯情封教取信無由**」（C04、C05）、法藏「事越常規。是故須證」（C06）、
      李通玄「五位加行起差別智滿普賢行」「充滿十方佛果門」（C07、C08）。
      法师 L1「此不思议解脱的领域，**又岂是自己摸索所能企及**」「依止善知识
      的引导而按图索骥」，与澄观「滯情封教取信無由」**直接相应**——摸索者
      即「滞情封教」者。故此判为**复原**，非重构，更非建构。
      唯「按图索骥」「大脑的解构」二语为现代语汇，属桥接性建构成分，
      然不动摇主体之复原性。
    附: >-
      善财次第另须留意：李通玄主「**若欲行菩薩行先成正覺**」且善财
      「即便成正覺然後始詣諸友」（C09、C11），系**先证后依止**；
      与法师「先依止善知识、后按图索骥」之次第**方向相反**。
      此为可断言之歧异，本文不代其调合，两存并记。
  - sec: "5.3"
    topic: 心地观照与诸众解脱门
    依: [C12, C13, C14, C15, C16, C17, S2]
    判: 复原（门＝通入之义）＋ 建构（结构化抽象）
    理由: >-
      澄观明释「門」之义正在能通入：「遊入故號門也」（C12）「**以能通入彼果用故**」
      （C13）。法师以「門」为入道之径，与此**相合，故属复原**。
      然澄观又立一戒：「**若以門為門非能通矣**」（C15）——不可以门为门而执其形。
      而法师之「诸众解脱门」系将四十组「X解脫門Y」之名相（如 C17 所示，
      解脱门嵌于名号之中）**抽象为一个结构性概念**（「从门入之可能」的总体）。
      此一抽象为法师所加，属**建构**；而澄观「正入雙亡為真門矣」（C16）
      恰构成对此种抽象化之内在约束。
  - sec: "5.4"
    topic: 十玄四法界六相之观行转向
    依: [C18, C19, C20, C21, C22, C23, N6]
    判: 判准须增一条限制；本项仍不作「重排次第」之断语
    理由: >-
      两项语汇之出处须先行标明，否则易成「以他宗语充华严语」之失：
      ①**十玄**——澄观明标「且依古德。顯十玄門」（C18），且法藏二书全 0 见
      （N6），故十玄一名在本语料中**属澄观所显之古德说**，非法藏原书用语；
      ②**六相圆融**——澄观明标其出「解十地論。則六相圓融」（C23），
      即**世亲《十地经论》用语**，经《十地论》入华严，本非华严自造。
      又十玄之总纲为「同一緣起無礙圓融。隨其一門。即具一切」（C22），
      其第十门即「主伴圓明具德門」，与 §5.2 普贤行之「主伴」相应，可为互参之接点。
    判准: >-
      凡引十玄、六相，须先标其语汇出处（十玄→「依古德·澄观所显」；
      六相→「世亲《十地经论》」）；「四法界」之目本语料未见列举〔待补〕。
      至于法师所述是否重排次第，**本轮不据 C 条即作断语**，仍标〔待证〕。
  - sec: "5.5"
    topic: 日常修行（生活化）
    依: [C24, C25, C26, C27, N8]
    判: 复原有据（李通玄）；当代语汇为建构
    理由: >-
      生活化修行之 T1 依据实在，且颇明确：李通玄列十种教体，其第四为
      「**四以行住坐臥四威儀以為教體見敬發心不待語故**」（C24、C25）——
      即行住坐卧本身**为教体**，不待言语教化；又定其义为「行住坐臥**不離定體**」
      「曰威儀」（C26、C27）。故法师以日常行持为修行之场，**非无祖典依据**，
      可上溯至李通玄，属**复原**。
      然「穿衣」等具体日用语于 T1 六本全 0 见（N8），故其**落实为当代可行之生活
      规范**之部分属**建构**。
