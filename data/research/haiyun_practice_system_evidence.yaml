    strong＝直陈自身「拼图／摸索／补块／接线／标准作业流程」；
    medium＝陈体系要素之复原、接续、改良，有自述语气但非自陈建构史；
    limit＝法师自述之限制或警戒，划界反证。
  体例_zh: |
    quote 为底本同一行内连续字串。跨行内容分列多条（如 S7／S8／S9 同属一讲记而分三条），
