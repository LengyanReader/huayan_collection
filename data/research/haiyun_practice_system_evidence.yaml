# ══ 一、strong：法师自述其体系的「拼图」建构过程 ═══════════════
strong:
  - id: S1
    key: 法界拼图之自陈·并自承说不清所缺
    quote: 大拼盘里头，大家都在拼图，只要有心的人，都在拼图，不过我发现，有两个区块没有办法接起来，拼不起来，我也说不上那两块是什么。
    src: docs/huayanhai/华严云海/读经请深入/地藏合集/占察忏行法/占察善恶业报经-占察忏行法_1.txt
    line: 2116
    era_hint: 同段语境「我从发心以来，少说三十几年，真正发心以来，三十五年了」（同文件 L2116）
    判读: 法师自述以「拼图」喻其体系建构；且明言「我也说不上那两块是什么」＝如实承认证得不全，非事后美化的全知叙述
    信度: A
    status: 已回源

  - id: S2
    key: 拼图所缺两块之确切所指（下手处／出口处）
    quote: 我在摸索一个“这样修对吗”？我们一直有人教，但是你肯定他对吗？当然对，人家当然是把对的教给你，可是他没有办法把那个要领给讲出来。所以我们才说，在法界大拼图里我们一直在找，就缺了两块，一块就是这个下手处，这一块没有人能讲。一块是出口处，最后的成就是什么样子。
    src: docs/huayanhai/华严云海/读经请深入/地藏合集/占察忏行法/占察善恶业报经-占察忏行法_1.txt
    line: 2702
    判读: 关键词三重命中——「我在摸索」「这样修对吗」之自我质疑、「法界大拼图」；并给出所缺两块之确切所指，为可检验的技术命题而非玄语
    信度: A
    status: 已回源

  - id: S3
    key: 定型之标志（入口毕·出口清·下手处有·标准作业流程）
    quote: 是因为这样子，我们架构起这个法界大拼图没有错；但是就这两块没有，一个入口处找不到，找不到入口处，你就找不到出口处。现在是入口处架构完毕了，出口处也清楚了，下手处。现在我是跟各位讲，下手处有了，而且很清楚了，这一套整个修行作业过程，我们已经建立起标准作业流程。剩下的，是各位要努力了。
    src: docs/huayanhai/华严云海/读经请深入/地藏合集/占察忏行法/占察善恶业报经-占察忏行法_1.txt
    line: 5281
    判读: 与 S1／S2 同属一讲记而前后悬隔，构成体系自陈之闭环；「标准作业流程」为法师对「定型」之自用判准（区别于「最终完成」之断语）
    信度: A
    status: 已回源

  - id: S4
    key: 拼啊拼啊之自陈（无人指导·法门遍历·承认未竟）
    quote: 但是你真想修行，我相信一定可以找到善知识。这个是每一个人的指导方式不同。因为我个人是自己摸索出来，那么多法门，每个法门我都去经历，没人指导啊，那我简介也不算呐。所以我说，这个叫法界拼图啊，拼啊拼啊拼啊，最后有两块接不起来，那两块不知道在哪里。
    src: docs/huayanhai/华严云海/浩瀚华严海/华严经简介-温州圣寿寺201205/口录/华严经简介01_1.txt
    line: 372
    判读: 「我个人是自己摸索出来……每个法门我都去经历」＝方法论自述；同时自承「那两块不知道在哪里」＝承认未完成，非夸大
    信度: A
    status: 已回源

  - id: S5
    key: 拼图未竟而生「禅师团」（时间轴·助缘·曲折·取舍·未竟转专攻）
    quote: 所以我们在这样进行摸索的时候，十年，梦参老和尚找我剃度。再过二十就三十年了。钦因长老找我们华严宗传承衣钵给我们。就在那一年我说：“这禅法不能突破，你这个衣钵也有问题。我们成立禅师团，以团体的力量来攻克这一个部分。”这问题产生了，才一次活动，印度大瑜伽师叫我们一定要过去。因为他是国宝级人物，印度政府不准他出国，所以你只能到他那边去。这个修行的大拼图里头剩下两块没有办法拼起来的，从他这边领回来。我不是全套都跟他要的，你要全套去学学不到啊，我们整个修行的蓝图统统拼，一直拼拼，从完全没有的情况之下拼到完成了，这两块接不上去。没有办法，所以我才成立禅师团，专攻这个部分。
    src: docs/huayanhai/华严云海/参禅要参透/华严海印三昧行法-温州莲塘寺201205/口录/华严海印三昧行法04_1.txt
    line: 205
    判读: 本库最重之一条——单条内含六要素：①时间轴（十年剃度／二十年衣钵／三十年来拼）②助缘（梦参老和尚、钦因长老、印度大瑜伽师）③曲折与自我修正（「这禅法不能突破，你这个衣钵也有问题」）④拼图自陈（「整个修行的蓝图统统拼，一直拼拼」）⑤知取舍（「我不是全套都跟他要的」）⑥未竟转专攻（成立禅师团）
    信度: A
    status: 已回源
    附注: 「印度大瑜伽师」之名，此讲记作「惹扎西牟尼」（见 S6），生平与梵文原写待外证

  - id: S6
    key: 拼图实际部分接上（自陈已讲好几年）
    quote: 我从印度，惹扎西牟尼那里呀取回来了这个行法的晶片。我们叫芯片啦。因为这整个行法，我已经拼出来了，这个我已经讲了好几年，已经拼出来了。但是这个里面要怎么进行的实际部分，就像拼图，已经拼得差不多了，还有好几块接不上来，这一次全部把它接起来了，这个就是总关键。
    src: docs/huayanhai/华严云海/浩瀚华严海/四十华严-北京广化寺2006-2009/听录版/四十华严第四卷（第52-71讲）_1.txt
    line: 6913
    判读: 可定位之年代锚点——「我已经讲了好几年」；所属讲次见目录名「四十华严-北京广化寺2006-2009」
    信度: A
    status: 已回源

  - id: S7
    key: 摸索之对象＝新树苗接千年老树（并自陈代价）
    quote: 因为中国佛教是一棵老树，我们现在新去弄了一个树苗回来，要跟这棵老树怎么接在一起呢？这个就是问题了。所以这几年来我们一直在摸索这个部分，怎么样把这个新的秧苗跟这个千年老树结合在一起，这个是真正功夫的地方。在这个地方我们牺牲了将近三百个人，大家都投入
    src: docs/huayanhai/华严云海/读经请深入/地藏合集/占察忏行法/占察善恶业报经-占察忏行法_1.txt
    line: 2160
    判读: 「接」之比喻之最清晰表述：外来新法门与中国千年禅宗传统之接合点即「真正功夫的地方」；「牺牲了将近三百个人」为助缘与代价之并存陈述
    信度: A
    status: 已回源

  - id: S8
    key: 失传之认定与「接起来」之自陈
    quote: 这个道场唯一的最大的特色就是给你那个下手处，这个也是我跟牟尼吉学的，我们才发现真的中国的行法，已经失传了几百年，那我们最可贵的是把它找回来，接起来，跟我们传统的各部行法都接上来了
    src: docs/huayanhai/华严云海/修密莫修迷/密教行法指导/网络听录版/密教行法指导12_1.txt
    line: 65
    判读: 法师自陈「复原」之三动作：失传之认定 → 找回来 → 接起来 → 与各部传统接上。此为「复原」概念最直接之一手依据
    信度: A
    status: 已回源

  - id: S9
    key: 归纳自述·由《华严经》反复看而归纳（历时数十年）
    quote: 所以这三个原则，圆融道的这三个原则，我提醒给各位，不是谁教我的，是从《华严经》里一再反复地看，到底它行法是怎么进行的？我把它归纳出来。在那么多的修法跟行法当中，怎么把你归纳出这些东西啊？这几十年来一直在看、一直在看，《华严经》的行法到底在哪里？
    src: docs/huayanhai/华严云海/参禅要参透/华严海印三昧行法-温州莲塘寺201205/口录/华严海印三昧行法07-完_1.txt
    line: 173
    判读: 「复原」动作之最直接自陈——「不是谁教我的」＋「从《华严经》里一再反复地看」＋「我把它归纳出来」。且明言历时：「这几十年来一直在看」。三条合观可断：其体系之第一动作是**由经典归纳**，非由师承直接承受，亦非自创
    信度: A
    status: 已回源

  - id: S10
    key: 普贤心经讲记·自嘲「笨蛋」与病因诊断
    quote: 这个行法为什么交给我们，你到哪里去求法，已经失传了、绝种了，怎么又把它接回来？普贤菩萨叫牟尼吉来找我们呐，不是我要、我要什么？我在找没错啊。你把你的种下了，其他你不管，随缘。我就是要把行法给弄起来，所以我就已经把这个法界大拼图都拼的剩下两个洞，拼不起来，找不到资料。不是没资料，你不会用那些资料。我想普贤菩萨一定觉得很好笑，“这个笨蛋，就那么简单的事也不会！”所以他去找牟尼吉，“你去找他，大乘、大乘佛教的行者”，找到我们我还问他说：
    src: docs/huayanhai/华严云海/浩瀚华严海/八十华严之38品离世间品/普贤心经/听录-普贤心经/初稿/《普贤心经》讲记（全）_1.txt
    line: 1114
    判读: 极重要之一条。①「失传了、绝种了」——法师自用「绝种」，较他处「失传几百年」更强；②「不是我要、我要什么？**我在找没错啊**」——自陈其寻找之主动与不期；③「我就是要把行法给弄起来」——建构动机之直陈；④病因诊断精确：「**不是没资料，你不会用那些资料**」——此非「找不到」，而是「已得而不能善用」，是本文所见对其失败原因最具体的一处自我诊断；⑤自嘲「这个笨蛋，就那么简单的事也不会！」——法师对其自身状态之评价，与 S1「我也说不上那两块是什么」同向而不事文饰；⑥「我还问他说」——其受助时之不自许
    信度: A
    status: 已回源
    附注: 同源讲记另有二版（讲记（06）L126、初校-花园版 L187，后者作「Muniji」并作「拼得剩下两个洞」），可互校异文；然本文只据初稿全本引之

  # ── 以下 S11–S14 为「自述弯路」组（L.112）──────────────────────────
  # 立此一组之缘由（不可略）：法师多处**自述其摸索过程中的弯路与错认**
  # （曾拜错、曾改百遍而仍错、曾须全盘重来）。此前本库所收 S1–S10 之自述
  # 皆为「拼图／未竟／不自我」，其「错」之面向未被立为一手条目——本文
  # 易因此只取其「建构」一面而略其「挫折」一面，是为选择性引证。今补之。
  # **读法（见 rules.md「读法原则·自述弯路」）**：此类自述之「搞错／走错」
  # 乃**心路历程与摸索实践**之实录，不得径作「法师判断有误」之证据而挑之；
  # 然亦不得反向用作「其体系本无错」之辩护——二事分记，勿相混。

  - id: S11
    key: 自述弯路·拜佛二十几万拜后才觉「不对」，且此前已改过百多遍
    quote: 我自己拜佛拜到二十几万拜才发现不对
    src: docs/huayanhai/华严云海/修密莫修迷/准提法/根本佛母 -- 准提密法（一）_1.txt
    line: 212
    判读: 摸索实践之硬核实录：非「未改过」，而是「改了不下数百次、仍属小修正」；「骤然发现之前的种种小修正都不对」——所纠者非疏失而是**层面**（同段：「因为基础站错地方，于是最后还得进行大幅度的改变」）。此文驳「摸索者只是幼稚犯错」之-flat读法：其错在层级不在用心
    信度: A
    status: 已回源
    附注: 同段另见「每一拜都很注意，不是叩一下就跪下来拜」——**未懈怠而仍须大幅改变**，此一细节最见其心路

  - id: S12
    key: 自述弯路·每一拜自问「对吗」，二三十万拜后才发觉「根本上弄错了」
    quote: 我每一拜都问自己：“这样拜对吗？这样拜能成佛吗？”二、三十万拜以后，才发觉根本上弄错了。
    src: docs/huayanhai/华严云海/修密莫修迷/准提法/根本佛母 -- 准提密法（一）_1.txt
    line: 212
    判读: 判读之要点在「**对否之自问即其摸索之法**」——自问二十几万遍而终须外缘点破，故其结论落在「回想/反省」与「拜佛之心 vs 拜佛」之分辨（原文：「拜佛绝对没错，但拜佛之心可能会搞错」）。此条即「自述弯路」读法之一手依据：所「弄错」者为心与方向，非所行之仪轨本身
    信度: A
    status: 已回源

  - id: S13
    key: 自述弯路·拜《华严经》一字一字拜一月，被外缘点破「都弄错了」，遂全盘重来
    quote: 大约拜了一个月，有位师父到家里来一看，笑说：“小朋友拜佛，都弄错了！”
    src: docs/huayanhai/华严云海/修密莫修迷/神圣的游戏场/神圣的游戏场-华严密法_1.txt
    line: 821
    判读: 与 S11／S12 同类而境别：此为**外缘纠正**之例，且明记其初「觉得很不甘心」（同段：「我当然觉得很不甘心：『不然怎么拜？』」）——**不服与不得不改**之情绪层次完整保留，非事后美化的顺从叙述。可与 S12 合观：内自问不足，须外缘；外缘亦须内肯，方能「一切重头来」
    信度: A
    status: 已回源
    附注: 同段记「有位师父到家里来一看」——**未记其名、未记其道场**；〔待核〕不得代拟其人

  - id: S14
    key: 〔原则句〕修行不怕错，自然有人跑来帮你纠正
    quote: 你看，修行不怕错，自然有人跑来帮你纠正。
    src: docs/huayanhai/华严云海/修密莫修迷/神圣的游戏场/神圣的游戏场-华严密法_1.txt
    line: 823
    判读: 紧承 S13 而下之**法师自陈之原则化**：「不怕错」非宽容苟同，乃因「自然有人跑来帮你纠正」——以**助缘之必然**为可容错之根据。此条为「自述弯路不作为挑错对象」之最直接一手依据：其自述之错，在其体系内已被判为**过程之常态且具矫正机制**
    信度: A
    status: 已回源
    附注: 同段续云「问那些都没用，做就对了，自己慢慢会去调，而疑情那个动力会带动你」——**动力在疑情**，不在求证；此与 L1（普贤道须依止善知识）互为表里，当并观，不可只取其一

  # ── 以下 S15–S19 为「三分两用」组（L.112）─────────────────────────
  # 立此一组之缘由：本文 §1.3 初版断言「法师自陈之语中并无此三分」。
  # **此断言经实测已失效**——「建构」「重构」二词确为其自用语，且用法宏阔。
  # 故本组先立其**自述义**之一手根据，再由本文另立分析框架义（不相混），
  # 详见本文 §1.2「三分两用」表与 `rules.md` §J5。
  # **「复原」不在本组**：全库 39 处「复原」皆生理义（扭伤复原、复原的能力），
  # 无一用于复原本意，故该词非其自用语，只作〔本文判断〕之分析语。
  # **「兼容古今」亦未见其语**（全库 0 命中），其义在 S15「承先…启后」。

  - id: S15
    key: 体系建构之自陈·「承先…启后」与「包罗万象的法界原型」
    quote: 诸如思想体系的架构、行法修学次第的舖开、教学体系的建构、新世代的僧团体制，乃至新古典华严道场宗风、型态的建树。这些包罗万象的法界原型，即是今日华严行者的本色与应尽的责任。
    src: docs/huayanhai/义学专题/经论原典/八十华严-简-大华严寺袖珍版_1.txt
    line: 259
    判读: |
      **本组之枢纽条，亦为本文 §1.2「三分两用」之关键依据。**
      此系法师**自撰**之经典缘起（「本公司重刊编校华严经典」，即大华严寺），
      非讲记口语，故其用语带**宣言与纲领**之性质，可径作其自述义之根据。
      本条所引即其所列**五事**——思想体系之架构、行法修学次第之舖开、
      **教学体系之建构**、新世代之僧团体制，乃至新古典华严道场宗风与型态之建树——
      归结为「**这些包罗万象的法界原型，即是今日华严行者的本色与应尽的责任**」。
      故其「建构」自用义**非**桥接性过渡说明，而为**体系完备、兼容古典与新古典、
      面向今日行者**之宏阔工程。此与本文初版将「建构」定为「桥接性过渡说明·C 级」
      **方向相反**，故该初版判准已订正（撤回记录见本文 §8.3）。
      **其路径之表述在同段之首**：曰「**承先**，即是继承古典华严思想的传承与灯火」，
      曰「**启后**，即是开启**新古典**华严思想的新纪元」——即「兼容古今」之义所自出
      （然「兼容古今」四字**全库 0 命中**，非其原词，见 N6）。
      **然须严守两界**：①此为其**自述之志业**，非本文可代其证实之成果；
      ②「启后」「新纪元」属**自我期许**，非既成事实，不得径作已验之结论引之。
    信度: A
    status: 已回源
    附注: 同文件**繁体版**（八十华严-繁-大华严寺袖珍版_1.txt）同段可互校，语义全同；繁简两版并存，本文据简体版。〔核〕本条所引与「承先」「启后」二句**同在 L259 一行内**（同段三处，本条取其主句）

  - id: S16
    key: 建构之自陈·「建构工程面」且祖师大德亦从此路
    quote: 第一是技术面务必熟练，其次才是建构工程面。
    src: docs/huayanhai/华严云海/修密莫修迷/本尊曾于此-十一面观音/11透过咒语和字母，锻炼置心一处_1.txt
    line: 14
    判读: |
      「建构」在其体系论中**另有专义**：与「技术面」相对之「**建构工程面**」。
      同段续（第 16 行）云「**历来祖师大德在判教以后，创宗立派，都是从工程面来，
      不谈技术面**」——此一断言极重要：**其「建构」非仅指己身之作为，而被其
      视为祖师大德「创宗立派」之共同路径**；故此词于华严传统中**有先例、非独创**。
      此条与 S15 相合：建构乃**面**（面向、架构面），非零星之补缀。
      **须并存之另一面**：同段亦云「我们说过……不论禅法、密法、净土」皆须先
      熟练技术面——故「建构」虽重，仍**不废技术面**，二者为次第非取代。
    信度: A
    status: 已回源

  - id: S17
    key: 一脉相承·原意与「新发明」之关系（贤首→清凉，法身佛之基因）
    quote: 从贤首国师到清凉国师，这一脉相承里，他们都会有新发明。
    src: docs/huayanhai/华严云海/修密莫修迷/梁皇宝忏开示/梁皇宝忏开示01_1.txt
    line: 85
    判读: |
      **「一脉相承」全库仅 4 文件命中，此为其唯一与华严宗承传直接相关者**
      （另三处为礼佛三拜之「国家领导→师长→父母」及和上博客引中国文化 DNA，
      非此义）。其义有三层，**层層皆与其自述之「复原」意涵相应**：
      ①**承**——「从贤首国师到清凉国师」，明举祖师之名与其次序，非泛言；
      ②**原意**——同段云「他特别提出『法身佛』的概念来。**当然，贤首国师的时代
      就有这个东西**」，即后世所标举者，其义理之根在先代已具，非新造；
      ③**新发明不离其根**——同段作「所以，你必须在『法身佛』的**基因里头**，
      打下你很雄厚的桩。**根要扎实**」。「基因」「根要扎实」为其喻，
      正是「一脉相承」之实质：**可变者须植于不变之根**。
      〔待核〕同段另有一强断言：「你假如不穿透他，一开始就用你自己的狂想曲，
      要来编一套属于你自己认为的华严，**那是你的华严，不是佛的华严**」——
      此即「不离本意」之最重一手根据，然其「穿透」之义界底本未明标，须待考。
    信度: A
    status: 已回源

  - id: S18
    key: 「用现代的语言重新诠释」·并自承「只是一个尝试」
    quote: 就是说，你要用现代的语言，来重新诠释这整个的过程。
    src: docs/huayanhai/My Notes/八十华严—离世间品 10（陕师大开示）_1.txt
    line: 129
    判读: |
      **「现代人可接受方式」之最直接一手根据**。其所诠释者为「果行·觉悟的人生
      不染世法」——即以现代语汇表述「成佛后仍吃饭睡觉、平等无有差别」之义。
      **可注意的是其自限**：紧接同段云「**我这样讲，只是一个尝试**，能不能达到
      完美，他需要时间的洗练，把这些用词怎么样的调整到最圆满的地方，
      **有待于我们往后的努力**」——**自承未完美、待洗练**，非自许已成。
      故本文引此条时**必须并存此自限语**，否则即为「掐头去尾」之失真（违编务
      总则第 3 条）。另同篇另有「现在的道场只要有硬设备就可称为僧伽蓝了，
      这**并非当初的原意**」，可与 S17 合观为「原意」之两种用法：
      一为祖师相传之义理根，一为「造次颠沛时亦不可失」之生活义。
    信度: A
    status: 已回源
    附注: 本条与 S17 同属「原意／离本意」之论，然**一处论祖师承传、一处论
      当下失义**，层级不同，不可并作一句

  - id: S19
    key: 「重构」之自陈义·内在世界之重构、菩提道·生命之重构
    quote: 整个菩提道，生命的重构，重新这种建设，这种改造就在这个基础上
    src: docs/huayanhai/华严云海/参禅要参透/心地法门/心地法门13_1.txt
    line: 32
    判读: |
      「重构」之自用义与其「建构」不同，须分别：此条**不作教法次第之重编**，
      而作**「生命／世界」之重新建设**。同系讲记之姊妹篇可互证：
      心地法门12（L33）「因此可以透过般若智慧的展现而**重建内心世界**，
      此种**内在世界的重构**，乃至扩展到外在世界的更新，都属于力的法门」；
      心地法门13（L32）本条则以「整个菩提道，生命的重构」并提「重新这种建设、
      这种改造」，并云其「奠定整个菩提道的资粮与基础」——**以之为基，方能
      发动「整个生命的改造工程」**。
      故其「重构」有**内外之次第**：先内在（内心世界），次外在（更新）。
      **本文分析框架之「重构」（重编教法次第）与此自用义不可混**：
      一为层级编排，一为生命改造；层次不同，判准亦不同（本文 §1.2）。
    信度: A
    status: 已回源

  # ── 以下 S20–S25 为「§5.4 十玄四法界六相」组（L.113 结案用）─────
  # 立此一组之缘由：§5.4 之断语问「法师所述**重排次第**（＝重构）抑或
  # **仅作现代语汇转译**（＝复原）」。此问之答案不在 T1 之六相目，而在
  # **法师自己的讲法**——故本组实测 T0，核其十玄之**序**是否仍同、
  # 四法界是否仍四、语汇是否只换而义不改。结论见本文 §5.4 之分记。
  # **本组之最重要发现（S20）**：法师论「十玄」之提出者，与澄观「依古德」
  # **不一致**，且其**自陈待专家研究**——此一「史论待考」之态，本文前稿未录。

  - id: S20
    key: 十玄之提出者（贤首说）＋智俨已提出之说＋自陈待专家研究
    quote: 那“十玄门”是……应该来讲是贤首国师提出来的，不会是智俨提出来，可是我们讲，智俨就已经有提出了，那这个就要专家去研究啦。
    src: docs/huayanhai/华严云海/浩瀚华严海/八十华严之38品离世间品/普贤心经/听录-普贤心经/初稿/《普贤心经》讲记（02）_1.txt
    line: 193
    判读: |
      **本组最重要之发现，亦为本文前稿 §5.4 未录。** 三层，**须分记**：
      ①**其说**：以十玄门为**贤首国师所提**，非智俨所提。此与澄观《疏》
      「且依古德。顯十玄門」之「依古德」（谓承前人，非自创）**并不冲突**——
      澄观只说「依古德」，未指明何人；法师则**指名贤首**，且**不指澄观**。
      ②**其自陈两说并存**：同句紧接「**可是我们讲，智俨就已经有提出了**」——
      即其同时承认智俨亦有此说，故**提出者之事其本人亦未定**。
      ③**其明言未定**：「**那这个就要专家去研究啦**」——自陈此属待考之史学问题，
      **推诸学者**。此一「待考」之态**必须如实转述，不得略去**（编务总则第 3 条）。
      **与本文实测之相合处**：本地 T1 实测「十玄」于法藏《搜玄記》《探玄記》
      **全 0 见**，于澄观 6 见、李通玄 11 见（T1 否定记录 N6）——
      **实测与法师「贤首提出」之说相印证**，故本文 §5.4 原「或因会本节录所致」
      之〔存疑〕可减其疑虑：**至少在本地所据之二帙中，法藏确实未明示「十玄」**。
      **惟须严守**：①此仅为**消极之相合**（未见），非积极之证明；②「智俨已提出」
      一说本地**无**对应实测，且法师已自陈待考，故**不得代其断**。
    信度: A
    status: 已回源
    附注: 本条之三项（贤首说／智俨说／待专家研究）**同在 L193 一行内**。
      〔待核〕「十玄」之名是否真出于贤首、抑或更早——**本库无权断**，仅登记其说
      与待考之态

  - id: S21
    key: 华严十玄谈·十玄在经中之原位（玄谈前置）
    quote: 那些特别的理论它提到最前面先讲，所以叫“华严十玄谈”
    src: docs/huayanhai/华严云海/参禅要参透/禅要怎么参（楞严经耳根圆通章）/口录/楞严经耳根圆通章_1.txt
    line: 1304
    判读: |
      **本条为 §5.4「是否重排次第」之直接反证**：法师于讲《楞严》之中指出
      《华严》之特色正在于「那些特别的理论它提到最前面先讲」，故称「华严十玄谈」，
      并申言「玄谈通常分十个在前面讲」——即**十玄在经中自有其位（前置之玄谈）**，
      而非法师所新排。此与 §5.4 之断语直接相关：**法师述十玄，守其原位，不重其序**。
      同段并云「那部分在经典注解里它就不再讲了」——**并存一重张力**：经中前置，
      而疏中往往略而不讲，故须学者自行运用。此张力本文只记录，不代为调和。
    信度: A
    status: 已回源

  - id: S22
    key: 四法界之目（法师自述归属澄观·事理理事事事）
    quote: 他的四法界是这个“事法界”——这个是世间法界，“理法界”是阿罗汉的法界，“理事无碍法界”是菩萨法界，“事事无碍法界”是法身大士的法界
    src: docs/huayanhai/华严云海/浩瀚华严海/八十华严导读-西安草堂寺201005/听录/八十华严导读01_1.txt
    line: 204
    判读: |
      **补本文 §5.4 第六条〔待补〕之半**：四法界之**目**虽不在本地 T1 六帙，
      然**法师于 T0 中完整列出**，且**明标其归属**——「假如是照**清凉国师**所讲的
      一真法界……他的四法界是这个『事法界』……」。故四法界之目为
      **事法界／理法界／理事无碍法界／事事无碍法界**，而其**归属清凉**。
      **本条对 §5.4 之断语有实质意义**：四法界**仍四、序仍事→理→理事无碍→
      事事无碍之原序**，且法师**自陈系转述清凉**——此为**复原**（依原义转述）
      之明确一手根据，非重构。
      〔界〕法师所配之**位次**（世间／阿罗汉／菩萨／法身大士）为其讲法之配释，
      非四法界名相本身之定义，**二者须分记**，不可混为「四法界＝四圣位」。
    信度: A
    status: 已回源

  - id: S24
    key: 十玄第一门「同时具足相应门」·序不重排
    quote: 在华严里，这个叫做“同时具足相应门”——“十玄门”上面的第一门，本体
    src: docs/huayanhai/华严云海/修密莫修迷/密教大纲/密教大纲10_1.txt
    line: 33
    判读: |
      **§5.4 断语之第二项实证**：法师以「同时具足相应门」为「十玄门上面的**第一门**」
      ——**与澄观所列第一位全同，序不重排**。同段释其义为「我这个生命跟外面的
      生命是一致的」，并谓「这是百分之百相应的……在修学的立场上，这是一个
      很重要的前提」。故其于**语汇确已 modernization**（生命／同体大悲／无缘大慈），
      而**次第未动**——依 §1.2 之判准，此为**复原**而非重构。
      〔存疑〕同帙与「密教大纲_1」**内容重复**（T0 台账已知之重复讲记），
      本库据「密教大纲10」立条，**不合并两处为一条**。
    信度: A
    status: 已回源

