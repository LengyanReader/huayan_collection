  - M7 之历史论断（八思巴九级之制致禅宗入口失传）当另行对勘，本库仅录其为法师自述
  - 「三阶五次第」之名，与《占察善恶业报经》之逐项对应关系（法师自陈三阶为资粮道／激发能量／导引至昆达里尼，见同文件 L2168、4777）
  - 「惹扎西牟尼」所传何法之具体内容，与 S8「跟牟尼吉学的」之对象是否同一人（讲记中「印度大瑜伽师」与「牟尼吉」是否为一，涉 S5 与 S8 能否互证）〔待核〕
  - T1 注疏（T1733／T1735／T1736／T1739／X0223）与上列诸条之逐要素比勘——本文 §5 之判定待此完成后方定
  - S13 中「有位师父到家里来一看」之人为谁——底本**未记其名、未记其道场**；〔待核〕**不得代拟其人**，亦不得以「某位善知识」含糊带过而充作已证之助力
  - S11／S12 之时间坐标未详——「二十几万拜」「二、三十万拜」为拜数而**非年月**；其「数百次修改」之起讫年份底本未言。若欲与法师年表（1958 生）互校，须另寻他本讲记〔待核〕
  - 「修行不怕错」之适用界限——L.112 已将其入 `limit`，然其界在何处？S13 之纠正来自**具名之外的外缘**，而 L1 则明言普贤道「岂是自己摸索所能企及」。故「有外缘可纠」之断言**是否普适**，尤须在**不思议解脱**层面再验，**不可由行法层面之实例径推至全体**〔待核〕
