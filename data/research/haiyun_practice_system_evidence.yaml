    信度: A
    status: 已回源

  - id: S23
    key: 一心法界／一真法界（体法界）之别
    quote: 那假如是照清凉国师所讲的一真法界，有两个啊，一个是一心法界，一个是一真法界，一真法界，他也分四法界。他的四法界是这个“事法界”——这个是世间法界，“理法界”是阿罗汉的法界，“理事无碍法界”是菩萨法界，“事事无碍法界”是法身大士的法界，这个叫一真法界，这个是“体法界”——本体的体法界，这样来区分的，所以我们有“体法界”有“用法界”。
    src: docs/huayanhai/华严云海/浩瀚华严海/八十华严导读-西安草堂寺201005/听录/八十华严导读01_1.txt
    line: 204
    判读: |
      **〔L.113 补足引文〕** 本条旧引仅「所以我们有“体法界”有」十字，系为免强凑而自长段截取之短引；
      同段 L204 实有**完整对举**，今扩为同行连续 166 字（自「那假如是照清凉国师所讲……」至
      「……所以我们有“体法界”有“用法界”。」），**一举补足旧记为〔待补〕之两处所缺**：
      ①二名之并列（「一个是一心法界，一个是一真法界」）；②体／用之对举（「有“体法界”有“用法界”」）。
      法师明言「照清凉国师所讲」，故此为**澄观之分别**，属**复原**范畴。
      **〔信度不升·依判准不由字数定〕** 引文虽已足，然依 `grading_zh`，strong 限于「直陈自身
      拼图／摸索／补块／接线／标准作业流程」，而本条所陈为**体系要素之判释（法界判摄）**，
      仍属 medium 之定义域，**故信度维持 B，不因引文变长而升 A**——升降由内容性质定，不由字数定。
      **〔限度·如实交代〕** 本行虽列「一心／一真」与「体／用」两组，然**未明言「一心法界＝用法界」**；
      该等值句见**同文件 L202**（「一心是指“用法界”。」），**不在本条引文之内**，
      故本条**不据以断其等值**，须另行立条方可引用（〔待补〕）。
      **〔体例·记此勿再犯〕** 凡短于一整句而义不足者，宁入 medium 或标〔待补〕，
      **不可扩引充数**；本次之扩引系因底本同行确有其文，非为凑强。
    信度: B
    status: 已回源

  - id: S25
    key: 所用十玄名目之另一系统（「诸藏纯杂具成门」）
    quote: 我们十玄门叫诸藏纯杂具成门
    src: docs/huayanhai/华严云海/参禅要参透/禅观/口录/禅观_1.txt
    line: 89
    判读: |
      **此条为 §5.4 之反面材料，一并登记以防选择性取证**（本文自订之纪律：
      **凡立「不重排」之断语，须一并列出「像是重排／另用他系」之材料**）。
      法师于讲禅观中言「所以最早我们十玄门叫**诸藏纯杂具成门**」——此一名目
      **不属澄观所列十玄**（其第一门为「同時具足相應門」、第十门为「主伴圓明具德門」），
      而与他系名目相近。**然其紧接即释为「纯是从理论看／杂是从事相看」之华严自家语汇**。
      **故此不足以证「重排」**：①其所述为**别称／别解**，非**改次序**；
      ②名目虽异而释义仍归华严语汇；③**「重排次第」之判准为「序」之变**，
      而此条**未见其改序**。
      **〔L.114 已比勘·原〔待补〕结〕** 旧记「『诸藏纯杂具成门』之确切来源系统
      （是否出《大乘起信論》别记一系）**本地 T1 六帙未检**，〔待补〕」——**已检，非起信论系**：
      本地 T1 实测作「諸藏純雜具**德**門」（法师口语作「具**成**」，德／成之别系转录或口音，
      **不据以改其引文**），四证俱在本地：
      ①澄观《演义钞》「第十諸藏純雜具德門。**至相十玄中**。有此名也」（T1736:860）——
      **明记其属智俨（至相）十玄**；②同书「**故賢首改為廣狹自在無礙門**」（T1736:861）；
      ③同书「**賢首新立以替至相十玄**」（T1736:4879）——二系之**替代**关系有明文；
      ④法藏《搜玄记》第六门亦作「六諸藏純雜具德門」（T1732:185），见其早年仍用旧名。
      以上即 T1 库 **C28–C31**。
      **故该名系智俨十玄第六门，法藏改立为「广狭自在无碍门」后即不见于澄观系**；
      法师此语盖承**智俨一系**之旧名。**得此系属，原判不必改**——
      ①所述仍为名目之属，非**改次序**；②释义仍归华严语汇；
      ③「重排」之判准仍为「序」之变。**然新增一层须分辨者**：法师于**第一门**
      与**门数**与澄观系合（S21／S24），于**名目**则用智俨系——
      **是谓两系并用，抑或只是一处旧名之偶存，本库无据以断**，本文 §5.4 另立〔待核〕。
      **不得以「像某一系」而代其系谱**——今系谱已明，故**不得以「已知系属」反代「已知其改序」**，
      二者仍非一事。
    信度: B（已比勘）
    status: 已回源

# ══ 三、limit：法师自陈之限制与警戒（反证「摸索万能」之读法） ══
limit:
  - id: L1
    key: 摸索有界·普贤道须依止善知识
    quote: 圣解脱次第道的生命改造工程，完全是在大脑的解构基础上进行，可由人本身摸索前进。但普贤道中的不思议解脱工程，其知见之正确与否，居于绝对之地位，而此不思议解脱的领域，又岂是自己摸索所能企及？是以普贤道行法中，依止善知识的引导而按图索骥，乃必要条件之一
    src: docs/huayanhai/海云行愿/普贤行者二十一行_1.txt
    line: 149
    判读: 关键反证。法师自行划界：摸索仅适用于可解构之圣解脱次第道；其不思议解脱「岂是自己摸索所能企及」，须「依止善知识的引导而按图索骥」。故本文不得将其体系读为「白手摸索式自创」，助缘之地位由此得一手依据
    信度: A
    status: 已回源

  - id: L2
    key: 警戒·拼而不定则成跑江湖
    quote: 那就证明说，你所找的法门，都像拼图里面的一块而已。你在到处捡嘛！重复不重复不管，反正我有一堆就对了。那你要拼起来，人家以前叫“四不像”，你现在是“八不像”。什么也不像，不知道拼什么。讲是在修行，其实这叫“跑江湖”。你在到处跑，各山头、各道场、各大德、各法会到处跑，热闹可以。
    src: docs/huayanhai/华严云海/读经请深入/地藏合集/占察忏行法/占察善恶业报经-占察忏行法_1.txt
    line: 5743
    判读: 法师以其自身「拼图」语汇设警戒：只积材而不定则不成体系、反而「跑江湖」。此条与其自述互为表里，说明「拼图」在其口中非泛美词，而有成立条件
    信度: A
    status: 已回源

  - id: L4
    key: 警戒·拼错而不自知（斥「代死者黏补」）
    quote: 像那个拼图一样，他拼不起来，他弄错了他不管，他要找一个来替死的，拼在他拼不起来的地方，把他黏下去就对了。当他发现还有一块，他又要把你挖掉。
    src: docs/huayanhai/华严云海/浩瀚华严海/八十华严之18品明法品/明法品31_1.txt
    line: 75
    判读: 法师复用「拼图」以说明**拼错**之弊：接不起来而硬接，乃「找替死鬼」黏补，稍后又须挖掉。此为 L2 之外之二层警戒（L2 主警「只积材而不定」，L4 主警「硬拼而乱黏」）。所论者为众生过，故此条系以拼图喻他人之失，非自陈
    信度: A
    status: 已回源

  - id: L3
    key: 助缘叙述之完整版·含不自居语与时间坐标
    quote: 华严宗为什么我们接？这是观世音菩萨，跟我没关系，观世音菩萨跟钦因长老讲的，钦因长老说好，衣钵给你，我无缘无故捡到一个衣钵，而且观世音菩萨送的，不是我，我有什么本事，我也不知道贤首宗躲在哪个地方，你说这个禅法怎么修？修行方法怎么修，我是整个法界拼图拼了没错，但是两块怎么拼找不到啊，我是找不到那两块到底是什么，那是普贤菩萨叫牟尼吉来找我的。牟尼吉还派他的大使到美国去找了五年找不到，到2003年我们才碰面，是普贤菩萨叫他来找的。
    src: docs/huayanhai/华严云海/读经请深入/地藏合集/占察忏行法/占察善恶业报经-占察忏行法_1.txt
    line: 5480
    判读: 助缘叙述之完整版，含「我无缘无故捡到一个衣钵」之不自居语、「我也不知道贤首宗躲在哪个地方」之自承局限、2003 年碰面之时间坐标。然以菩萨感应解释人事，读者须知其为法师之信仰性陈述，非可证史实
    信度: A（史实待核）
    status: 已回源

  - id: L5
    key: 警戒·走错之必然性（「我要弄对了才要踏出去」＝永非修行人）
    quote: 所以你会经常走错。经常，这是必然的。你要迈向未知，谁说一定对啊？当你的心里是这样想：“我要弄对了才要踏出去啊”，你永远不是修行人。
    src: docs/huayanhai/华严云海/修密莫修迷/密教大纲/密教大纲08_1.txt
    line: 187
    判读: |
      **本组之枢纽条**。所论者为**迈向未知之必然代价**，非泛泛之宽解：
      「经常，这是必然的」——走错非例外而是常态；而其落点在乎
      **待证之心**：「我要弄对了才要踏出去啊」被判为「永远不是修行人」。
      故「走错」在其体系中有**方向性**——错在「不肯踏出」，不在「踏出后有失」。
      此条正是 S11–S14 之读法依据所在：**自述之弯路应作摸索实践与心路历程解**，
      而不可径作「法师判断有误」之证据——因其自用语言已明为此类，
      且明言有矫正机制（S14「自然有人跑来帮你纠正」）与自省机制（S12「每一拜都问自己」）。
      **然此亦不可被读成「可免于检核」**——L1（普贤道须依止善知识）
      正为其界：摸索有界，越界须依止。二条当并观。
    信度: A
    status: 已回源

# ══ 四、否定性记录：经检索而「查无」者（与「未查」严格分记） ══
negative_findings:
  - id: N1
    项: 以「犯过错误」类语自述其建构过程之失手
    状态: 查无（部分）
    检索范围: docs/huayanhai/ 全 645 篇，rg「犯过|走过弯路|走过错|错误的方向|走错」；L.112 复检另加「弄错|搞错|才发现不对|修行不怕错」
    实际命中: |
      「走错」诸命中有二层：①**教理层面**——「所以你会经常走错。经常，这是必然的」（密教大纲08 L187）论迈向未知者之必然，非法师自陈失手；此**原判正确**，今立为 **L5**。
      ②**法师自陈其亲身摸索之失手**——「我自己拜佛拜到二十几万拜才发现不对」「二、三十万拜以后，才发觉根本上弄错了」（准提法·准提密法（一）L212）、「小朋友拜佛，都弄错了」（神圣的游戏场·华严密法 L821）、「修行不怕错，自然有人跑来帮你纠正」（同文件 L823）；此四例**原判漏计**，今立为 **S11–S14**。
    结论: |
      **修正后之结论**：本文**可**据一手材料述及「法师自陈其摸索过程中曾走弯路／
      搞错过行法」，惟须**用其自用之语**（「不对」「根本上弄错了」「修行不怕错」），
      **不可代拟**「法师曾自承犯错」之类未见于底本之语；且所述范围限
      **其拜佛等行法之摸索实践**（S11–S14 之语境），
      非「其体系建构史之自我否定」。此界不可越：既不因自述弯路而否定其体系，
      亦不因体系已成而抹去其弯路。**取舍之权在读者，不在本文。**
    原判存疑_撤回于L112: |
      原判作「查无」，并注「皆为讲佛陀、弟子、众生，或讲『修行者难免会走错』之
      一般语境；无一条系法师自陈其体系建构中之失手」。**其①层判断成立，②层判断
      已撤回。** 漏计之因二：**①检索式不含「弄错／搞错／才发现不对」**——而法师
      自述时正惯用此三语；**②未逐条区分主语**——原文「你弄错了」（斥听众）与
      「我…弄错了」（自陈）同式混见，不作主语判准则无从分辨，极易在满目
      「弄错了」之中漏掉少数自陈之例（同 N4 之失）。
    读法_见: rules.md「读法原则·自述弯路」

  - id: N2
    项: 以「助缘」一词自述其体系建构之人际助力
    状态: 查无
    检索范围: docs/huayanhai/ 全 645 篇，rg「助缘」
    实际命中: 仅见于密法／准提法等技术语汇语境（如「助缘法门」类用法），未见法师以「助缘」自述体系建构之人际助力
    结论: 其自用词为「因缘」，且所举为具名人物与团体——梦参老和尚、钦因长老、德林老和尚、印度大瑜伽师（惹扎西牟尼）、牟尼吉及其所派大使、三百多个同修（见 S5、M2、M4、L3）。故本文行文宜以「助缘」为分析语汇，并标明系据上述具名因缘归纳，而非法师原词

  - id: N3
    项: 法师原词「拼图」及其变体之全量清点与语义边界
    状态: 已查（部分）
    检索范围: docs/huayanhai/ 全 645 篇，rg「拼图」（全变体）＋「拼盘」，逐文件核语境
    实际命中: 含「拼图／拼盘」者合计 20 处，分布于 9 个文件。分类：①法师自述建构 7 处（S1「法界大拼盘」、S2／S3／L3「法界大拼图」、S4「拼啊拼啊」、S5「修行的大拼图」、S6「就像拼图」、S10「法界大拼图都拼的剩下两个洞」）；②警戒 2 处（L2；L4）；③非法师建构语境 2 处——和上新浪博客 2009 L1397「系统正与吾人摸索中的碎片拼图相吻合，岂非奇哉、奇哉耶?!」（赞叹语）；明法品31 L75「像那个拼图一样……拼在他拼不起来的地方，把他黏下去」（斥他人之乱拼）
    结论: 该词义有严格限界——赞美自陈（体系建构）与警戒（拼而不定、拼错代偿）并存，不可单取赞美面。**方法论要点**：只检「拼图」二字会漏「拼盘」变体（S1 之「大拼盘」即因此一度未计），故此类清点须连变体一并检索

  - id: N4
    项: 「挫折」「失敗」二語在法師自述失手語境中之用例
    状态: 查无（部分）
    检索范围: docs/huayanhai/ 全 645 篇，rg「挫折|失敗|失败」，逐条核主语与语境
    实际命中: |
      「挫折」命中 490 文件、「失敗」亦有之，然**逐条核之，皆为他处引用**
      （如密教行法指导 L142 借「水管接到电线管」之喻说明行法接错之危险），
      **未见法师以其自述失手**。故就此**二字**而言，原判「查无」**成立，予以保留**。
      惟原判之**范围界定有误**：原将「挫折／失敗／走错」三项并列为一项而一并判「查无（部分）」，
      而实则「走错」一类**有**法师自陈之例（S11–S14、L5），
      「挫折／失敗」二字方真无。故本条之「项」已由三项并列表述**收窄为二字**。
    结论: |
      **二字（挫折／失敗）未用于自述失手**——此为经检索成立之否定结论。
      然**同类语义**确有自述（S11–S14），其自用之语为「不对」「从根本上弄错了」
      「修行不怕错」，**不在「挫折／失敗」二字**。
      故读者若检「挫折／失敗」以证法师自述失手，将一无所获而误以为其未自述；
      此**检索式之陷阱**须明记：**检索否定结论时，检索式须含目标语义之全部惯用语汇**。
    原判存疑_撤回于L112: |
      原判作「查无（部分）」，项为「『挫折／失敗／走错』等语在建构语境中之自陈」，
      注「『挫折』『失敗』之命中多为他处引用……非法师自陈失手」。
      **其「措辞／失敗」之判断成立；但「走错」被并入判为查无，实为错误**——
      漏计之因：**①检索式仅取「挫折|失败」，未含「走错／搞错／弄错」**，
      而法师自述其弯路时**惯用后者**；**②未设「主语为法师本人」之判准**，
      原文「你弄错了」（斥听众）密集出现，若只看关键词极易误判为「皆为他斥」，
      反向漏掉其中少数自陈之例。
      **教训**：凡据「检索未得」而作「查无」之判，须同时记录
      **①检索式全文 ②检索范围 ③命中之排除依据（判为非目标者之理由）**；
      三者缺一，则「查无」实为「未检得」之混称——**「查无」与「未查」须严格分记**。
      本条原记**有范围而无排除依据**，故其原判不成立。今三项补齐，原判一并留痕，不删改，以存其误。
    现判: 二字成立「查无」；「走错」一项已撤回并改立 S11–S14／L5

  - id: N5
    项: 「复原」一词之全量用例，及其是否用于「复原本典／祖师原意」之义
    状态: 查无（部分）
    检索范围: docs/huayanhai/ 全 645 篇，rg「复原」（含繁体「復原」），逐条核语境
    实际命中: |
      「复原／復原」命中 39 个文件。**逐条核之，全部为生理／物理义**，如
      「扭伤复原」「免疫力就是复原的能力」之类；**无一例**用于复原本典原意、
      传承灯火、祖师大德之一脉相承。
    结论: |
      故「复原」**非法师自用语**——本文标题与正文之「复原」一词，属
      **〔本文判断〕之分析语**，非其原词，不得称「法师所说的复原」。
      **然其义并非无据**：本文「复原」之立据在 **S17**（「从贤首国师到清凉国师，
      这一脉相承里」＋「基因里头」「根要扎实」）与「佛陀的原意」一类语，
      **不在「复原」二字之字面**。此点须明辨，否则将以不属之辞托意。
      〔界〕**「未见其语」不等于「其义无据」**，二者分记：前者为词汇事实，
      后者为其立论根据，二者不可互相顶替。
    排除依据: |
      判为「非目标义」者，依**所修饰对象**分类：**①身体／病伤**（如扭伤、疾病
      复原）——义为生理恢复；**②能力义**（「复原的能力」＝自愈力）——义为功能。
      二者与「本典／原意／传承」无涉，故一律排除。**未据「含『原』字」而纳入**——
      「原」字与「本原」相关，然与「复原本意」之「原」义不同，此处之别正在于此。

  - id: N6
    项: 「兼容古今」一语之用例
    状态: 查无
    检索范围: docs/huayanhai/ 全 645 篇，rg「兼容古今」，并及分词式「兼容」「古今」逐一复核
    实际命中: 「兼容古今」四字组合**全库 0 命中**。另单检「兼容」与「古今」，命中所指皆为他义（「兼容并包」之类，以及与本主题无关之「古今」用法），**无一构成「兼容古今」之义**。
    结论: |
      「兼容古今」**非其原词**，本文不得以其为法师之语。其义之根据在
      **S15** 之「**承先**，即是继承古典华严思想的传承与灯火……**启后**，
      即是开启**新古典**华严思想的新纪元」——古典与新古典相承而开新，
      即所谓「兼容古今」；然此系**本文据其「承先启后」之语而归纳之义**，
      与「兼容古今」四字之原语**不可混同**。本文引其意而不代拟其语。
    排除依据: |
      「兼容」「古今」分检之命中，均经逐条核语境后排除：「兼容」诸命中为
      「兼容并包／兼容并蓄」等固定成语或技术语境（如器材兼容）；
      「古今」诸命中或用于时间对举（如「古今中外」之泛论），或见于
      与华严体系无关之文。二者**无一与「古典华严→新古典华严」之承启义相应**，
      故不以其单独命中而充作本项之实证——**此即「须连词组检、不可逐词凑义」之实例**
      （与 N3「须连变体一并检索」互为表里）。

  - id: N7
    项: 六相之目（總相／別相／依相／圓相／證相／生起相）在本地 T1 六帙中可否连用得出
    状态: 查无（部分）
    检索范围: |
      data/references/cbeta_txt/ 全部 6 帙（T1732 5,539 行／T1733 22,762／T1735 26,556／
      T1736 43,919／T1739 17,576／X0223 67,752），NFKC＋RAD 双层归一后
      逐帙检「六相」及六目之单目，并专检**连用形态**（正則「總相[^。]{0,4}別相[^。]{0,4}依相」）
    实际命中: |
      「六相」一词本身命中甚多（T1732 7／T1733 27／T1735 25／T1736 32／T1739 32／X0223 36）。
      六目之**单目**命中：「總相」6 帙皆有、「別相」6 帙皆有、「依相」仅 T1735／T1736／
      T1739／X0223 四帙、「證相」六帙皆有、「**圓相**」**仅 T1736 一帙 2 见**、
      「**生起相**」**仅 T1736 一帙 1 见**。
      **连用形态：全六帙 0 见**——「總相…別相…依相」之罗列式**无一例**。
    结论: |
      **本文 §5.4 第六条之〔待补〕属实**：六相之**目**不可由本地六帙**连用得出**，
      故本地**无**「六相」六目之原始罗列文本可据。
      **然须限定其确切范围，不可概言「未列」**：单目之「總／別／證」三目
      六帙皆见，「依相」四帙见，足证**诸目散见于注疏**；所缺者**唯其罗列之次序
      与完整之目数**（六目齐全之一次罗列）。故准确之表述为
      **「散见而无一次完整罗列」**，非「六相之目不载于注疏」。
      **〔界〕**「圓相」仅 T1736 二见、「生起相」仅 T1736 一见，**尤须留意**：
      若日后得世亲《十地经论》或《唯识三十颂》全帙（**二帙均不在本地**），
      当据以补足其目与次序；**在此之前，不得以散见之单目拼凑成一「六相之目」
      而充作原典之罗列**——此即 N3／N6 所立「不可逐词凑义」之又一实例。
      〔方法论之要点〕**检索否定结论须分层**：区分「词见于他处」与「成列之文本存在」，
      二者效力不同；混之则「查无」将掩盖「散见」之实得。
    排除依据: |
      「六相」诸命中**排除为非本项者**，依**其义分三类**，逐类举例：
      ①**地动义**——「六相就是『动，起，涌，震，吼，击』，六种，大地震动的状况，
      有六种，叫**六种十八相**」（离世间品22·陕师大）——此为**震动之相**，
      与唯识六相无涉，**最易致误**，故明标排除；
      ②**如来出现之第几相**——「是为如来应正等觉出现**第六相**」（八十华严·降生品），
      此为**经中段落之序次**，非相类之名；
      ③**真谛/俗谛等泛称**——凡与「圓融」「總別」无涉而泛指「六」种相者，
      一概排除（如「三身六相」之类连缀）。
      **未据「含『相』字」而纳入**——此与 N5「未据含『原』字而纳入」同理。
    补见: 本文 §5.4 第六条宜据此改写其〔待补〕之**范围**（由「不载」改为「散见而无一次完整罗列」），
      并补入四法界之目（T0 之 S22，法师自述归属澄观）——**此为 §5.4 结案之实得**

