# 专题实证库：海云继梦法师修行体系之「复原·重构·建构」
# 用途：为 docs/随笔参考/海云继梦法师_复原·重构·建构的修行体系（草稿）.md 提供可溯证据位
# 原则：只登记逐字回源的原话（T0/A），逐条标注语境判定与存疑；不臆造、不代拟、不省略
# 生成方式：scripts/_hai_extract_quotes.py 抽取 → 人工按语境甄别 → 本文件登记
# 复核方式：python scripts/verify_haiyun_evidence.py（逐条回源，行号+字串双向校验）
#
# 【体例】每条 quote 必为底本**同一行内连续**之字串；跨行省略者拆为独立条目。
#         此体例由 verify_haiyun_evidence.py 之 C 道门禁强制——曾有跨行省略号致回源失败者。

