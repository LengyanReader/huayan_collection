# ══ 一、strong：法师自述其体系的「拼图」建构过程 ═══════════════
strong:
  - id: S1
    key: 法界拼图之自陈·并自承说不清所缺
    quote: 大拼盘里头，大家都在拼图，只要有心的人，都在拼图，不过我发现，有两个区块没有办法接起来，拼不起来，我也说不上那两块是什么。
    src: docs/huayanhai/华严云海/读经请深入/地藏合集/占察忏行法/占察善恶业报经-占察忏行法_1.txt
    line: 2116
    era_hint: 同段语境「我从发心以来，少说三十几年，真正发心以来，三十五年了」（同文件 L2116）
    判读: 法师自述以「拼图」喻其体系建构；且明言「我也说不上那两块是什么」＝如实承认证得不全，非事后美化的全知叙述
    信度: A
    status: 已回源

  - id: S2
    key: 拼图所缺两块之确切所指（下手处／出口处）
    quote: 我在摸索一个“这样修对吗”？我们一直有人教，但是你肯定他对吗？当然对，人家当然是把对的教给你，可是他没有办法把那个要领给讲出来。所以我们才说，在法界大拼图里我们一直在找，就缺了两块，一块就是这个下手处，这一块没有人能讲。一块是出口处，最后的成就是什么样子。
    src: docs/huayanhai/华严云海/读经请深入/地藏合集/占察忏行法/占察善恶业报经-占察忏行法_1.txt
    line: 2702
    判读: 关键词三重命中——「我在摸索」「这样修对吗」之自我质疑、「法界大拼图」；并给出所缺两块之确切所指，为可检验的技术命题而非玄语
    信度: A
    status: 已回源

  - id: S3
    key: 定型之标志（入口毕·出口清·下手处有·标准作业流程）
    quote: 是因为这样子，我们架构起这个法界大拼图没有错；但是就这两块没有，一个入口处找不到，找不到入口处，你就找不到出口处。现在是入口处架构完毕了，出口处也清楚了，下手处。现在我是跟各位讲，下手处有了，而且很清楚了，这一套整个修行作业过程，我们已经建立起标准作业流程。剩下的，是各位要努力了。
    src: docs/huayanhai/华严云海/读经请深入/地藏合集/占察忏行法/占察善恶业报经-占察忏行法_1.txt
    line: 5281
    判读: 与 S1／S2 同属一讲记而前后悬隔，构成体系自陈之闭环；「标准作业流程」为法师对「定型」之自用判准（区别于「最终完成」之断语）
    信度: A
    status: 已回源

  - id: S4
    key: 拼啊拼啊之自陈（无人指导·法门遍历·承认未竟）
    quote: 但是你真想修行，我相信一定可以找到善知识。这个是每一个人的指导方式不同。因为我个人是自己摸索出来，那么多法门，每个法门我都去经历，没人指导啊，那我简介也不算呐。所以我说，这个叫法界拼图啊，拼啊拼啊拼啊，最后有两块接不起来，那两块不知道在哪里。
    src: docs/huayanhai/华严云海/浩瀚华严海/华严经简介-温州圣寿寺201205/口录/华严经简介01_1.txt
    line: 372
    判读: 「我个人是自己摸索出来……每个法门我都去经历」＝方法论自述；同时自承「那两块不知道在哪里」＝承认未完成，非夸大
    信度: A
    status: 已回源

  - id: S5
    key: 拼图未竟而生「禅师团」（时间轴·助缘·曲折·取舍·未竟转专攻）
    quote: 所以我们在这样进行摸索的时候，十年，梦参老和尚找我剃度。再过二十就三十年了。钦因长老找我们华严宗传承衣钵给我们。就在那一年我说：“这禅法不能突破，你这个衣钵也有问题。我们成立禅师团，以团体的力量来攻克这一个部分。”这问题产生了，才一次活动，印度大瑜伽师叫我们一定要过去。因为他是国宝级人物，印度政府不准他出国，所以你只能到他那边去。这个修行的大拼图里头剩下两块没有办法拼起来的，从他这边领回来。我不是全套都跟他要的，你要全套去学学不到啊，我们整个修行的蓝图统统拼，一直拼拼，从完全没有的情况之下拼到完成了，这两块接不上去。没有办法，所以我才成立禅师团，专攻这个部分。
    src: docs/huayanhai/华严云海/参禅要参透/华严海印三昧行法-温州莲塘寺201205/口录/华严海印三昧行法04_1.txt
    line: 205
    判读: 本库最重之一条——单条内含六要素：①时间轴（十年剃度／二十年衣钵／三十年来拼）②助缘（梦参老和尚、钦因长老、印度大瑜伽师）③曲折与自我修正（「这禅法不能突破，你这个衣钵也有问题」）④拼图自陈（「整个修行的蓝图统统拼，一直拼拼」）⑤知取舍（「我不是全套都跟他要的」）⑥未竟转专攻（成立禅师团）
    信度: A
    status: 已回源
    附注: 「印度大瑜伽师」之名，此讲记作「惹扎西牟尼」（见 S6），生平与梵文原写待外证

  - id: S6
    key: 拼图实际部分接上（自陈已讲好几年）
    quote: 我从印度，惹扎西牟尼那里呀取回来了这个行法的晶片。我们叫芯片啦。因为这整个行法，我已经拼出来了，这个我已经讲了好几年，已经拼出来了。但是这个里面要怎么进行的实际部分，就像拼图，已经拼得差不多了，还有好几块接不上来，这一次全部把它接起来了，这个就是总关键。
    src: docs/huayanhai/华严云海/浩瀚华严海/四十华严-北京广化寺2006-2009/听录版/四十华严第四卷（第52-71讲）_1.txt
    line: 6913
    判读: 可定位之年代锚点——「我已经讲了好几年」；所属讲次见目录名「四十华严-北京广化寺2006-2009」
    信度: A
    status: 已回源

  - id: S7
    key: 摸索之对象＝新树苗接千年老树（并自陈代价）
    quote: 因为中国佛教是一棵老树，我们现在新去弄了一个树苗回来，要跟这棵老树怎么接在一起呢？这个就是问题了。所以这几年来我们一直在摸索这个部分，怎么样把这个新的秧苗跟这个千年老树结合在一起，这个是真正功夫的地方。在这个地方我们牺牲了将近三百个人，大家都投入
    src: docs/huayanhai/华严云海/读经请深入/地藏合集/占察忏行法/占察善恶业报经-占察忏行法_1.txt
    line: 2160
    判读: 「接」之比喻之最清晰表述：外来新法门与中国千年禅宗传统之接合点即「真正功夫的地方」；「牺牲了将近三百个人」为助缘与代价之并存陈述
    信度: A
    status: 已回源

  - id: S8
    key: 失传之认定与「接起来」之自陈
    quote: 这个道场唯一的最大的特色就是给你那个下手处，这个也是我跟牟尼吉学的，我们才发现真的中国的行法，已经失传了几百年，那我们最可贵的是把它找回来，接起来，跟我们传统的各部行法都接上来了
    src: docs/huayanhai/华严云海/修密莫修迷/密教行法指导/网络听录版/密教行法指导12_1.txt
    line: 65
    判读: 法师自陈「复原」之三动作：失传之认定 → 找回来 → 接起来 → 与各部传统接上。此为「复原」概念最直接之一手依据
    信度: A
    status: 已回源

  - id: S9
    key: 归纳自述·由《华严经》反复看而归纳（历时数十年）
    quote: 所以这三个原则，圆融道的这三个原则，我提醒给各位，不是谁教我的，是从《华严经》里一再反复地看，到底它行法是怎么进行的？我把它归纳出来。在那么多的修法跟行法当中，怎么把你归纳出这些东西啊？这几十年来一直在看、一直在看，《华严经》的行法到底在哪里？
    src: docs/huayanhai/华严云海/参禅要参透/华严海印三昧行法-温州莲塘寺201205/口录/华严海印三昧行法07-完_1.txt
    line: 173
    判读: 「复原」动作之最直接自陈——「不是谁教我的」＋「从《华严经》里一再反复地看」＋「我把它归纳出来」。且明言历时：「这几十年来一直在看」。三条合观可断：其体系之第一动作是**由经典归纳**，非由师承直接承受，亦非自创
    信度: A
    status: 已回源

  - id: S10
    key: 普贤心经讲记·自嘲「笨蛋」与病因诊断
    quote: 这个行法为什么交给我们，你到哪里去求法，已经失传了、绝种了，怎么又把它接回来？普贤菩萨叫牟尼吉来找我们呐，不是我要、我要什么？我在找没错啊。你把你的种下了，其他你不管，随缘。我就是要把行法给弄起来，所以我就已经把这个法界大拼图都拼的剩下两个洞，拼不起来，找不到资料。不是没资料，你不会用那些资料。我想普贤菩萨一定觉得很好笑，“这个笨蛋，就那么简单的事也不会！”所以他去找牟尼吉，“你去找他，大乘、大乘佛教的行者”，找到我们我还问他说：
    src: docs/huayanhai/华严云海/浩瀚华严海/八十华严之38品离世间品/普贤心经/听录-普贤心经/初稿/《普贤心经》讲记（全）_1.txt
    line: 1114
    判读: 极重要之一条。①「失传了、绝种了」——法师自用「绝种」，较他处「失传几百年」更强；②「不是我要、我要什么？**我在找没错啊**」——自陈其寻找之主动与不期；③「我就是要把行法给弄起来」——建构动机之直陈；④病因诊断精确：「**不是没资料，你不会用那些资料**」——此非「找不到」，而是「已得而不能善用」，是本文所见对其失败原因最具体的一处自我诊断；⑤自嘲「这个笨蛋，就那么简单的事也不会！」——法师对其自身状态之评价，与 S1「我也说不上那两块是什么」同向而不事文饰；⑥「我还问他说」——其受助时之不自许
    信度: A
    status: 已回源
    附注: 同源讲记另有二版（讲记（06）L126、初校-花园版 L187，后者作「Muniji」并作「拼得剩下两个洞」），可互校异文；然本文只据初稿全本引之

# ══ 二、medium：体系要素之复原、接续、改良（有自述语气） ════════
medium:
  - id: M1
    key: 改良种（重构之自陈）
    quote: 而我们在这里是真的下功夫了，这三四年的时间我们一再的在琢磨这个问题，他所讲的东西我们这边是怎么用的，这个用当中，怎么衔接起来的，他的目的在哪里，我们通通把他弄清楚了，然后回过头来，再跟他讲，我们的做法是这样。所以，你会发现到，我们这个行法，论效率来讲，比他的快，比印度的快，因为印度他是原生种的，我们是改良种的，因为我们是外民族，相对于印度文明来讲，我们是外民族，所以我们在行法上的一些改良，有他的特色。
    src: docs/huayanhai/华严云海/读经请深入/地藏合集/占察忏行法/占察善恶业报经-占察忏行法_1.txt
    line: 2278
    判读: 「改良种」「有他的特色」＝法师自认对外来行法有所改造（重构）；「怎么衔接起来……通通把它弄清楚」＝重构动作之自述；「三四年的时间」可与 S5「三十几年」并观，二者非矛盾（前者为一具体工程之工期）
    信度: A
    status: 已回源

  - id: M2
    key: 助缘之往复（德林老和尚之邀·自身两度回绝）
    quote: 好了，他现在主持高旻寺那么大的道场，全世界想要禅修的眼光都看着他，他没办法。二十年前他跟我说，德林老和尚说他主张夏学冬禅，冬天冬安居是禅修，夏天要讲学，你来讲华严经，他要我去了，我说不行，我这边忙死了，怎么有可能在那边常住呢？他说你就每年来三个月，我说不行，每年都来一次一个礼拜都没时间了，还要每年来三个月，这就是关键处。
    src: docs/huayanhai/华严云海/读经请深入/地藏合集/占察忏行法/占察善恶业报经-占察忏行法_1.txt
    line: 2164
    判读: 助缘（德林老和尚／高旻寺）与自身两度回绝之过程俱在，不回避自身之推辞；「这就是关键处」为其自陈之转折判断
    信度: A
    status: 已回源

  - id: M3
    key: 成果之名·三阶五次第
    quote: 现在我要告诉各位，这几年来，我们把这个部分完全嫁接起来，那个入口处要如何入口的问题，我们全部解决了。这个行法叫做，就前面入口的这个部分，叫做三阶五次第。
    src: docs/huayanhai/华严云海/读经请深入/地藏合集/占察忏行法/占察善恶业报经-占察忏行法_1.txt
    line: 2166
    判读: 成果之命名自陈：入口问题「全部解决」＋分阶之名「三阶五次第」。同讲记他处复以「SOP／标准作业流程」称之（line 3541、4777、5083），可互校
    信度: A
    status: 已回源

  - id: M4
    key: 四年的时间与三百多人之投入（接法之验证条件）
    quote: 我跟各位谈，当我们从印度把在中国消失的这个入门的部分接回来，要跟中国这一千多年来的禅宗心法相结合的时候，我们都花了四年的时间，三百多人投入去把他接起来，假如没有这三百多个同修前仆后继的这样去实践，去验证，你不能确定你所接的是对是不对，你知道吗？
    src: docs/huayanhai/华严云海/读经请深入/地藏合集/占察忏行法/占察善恶业报经-占察忏行法_1.txt
    line: 2276
    判读: 「接回来……相结合」＝复原与重构同举；「四年的时间」「三百多人」「实践去验证」「不能确定对是不对」＝其「建构」具实证与集体验证性质，非纯思辨。此条与 M1 相承（M1 言其果，此条言其证）
    信度: A
    status: 已回源

  - id: M5
    key: 拣别之过程与年限（2003–2008）
    quote: 你不要以为我跟牟尼吉来往，我不是不拣别呀。我从03年到08年，就拣别说他到底是玩什么游戏啊。第二个是看他的出口在哪里？入口我们失传了，我们把它捡回来
    src: docs/huayanhai/华严云海/修密莫修迷/密教行法指导/网络听录版/密教行法指导02_1.txt
    line: 23
    判读: 「拣别」（鉴别所传可信否）之自陈，明言非轻信、历五年（2003–2008）；此为「摸索」含鉴别义之直接证据。「入口我们失传了，我们把它捡回来」复现 S8 之复原三动作
    信度: A
    status: 已回源

  - id: M6
    key: 讲法之明确修订（〇八年前后念佛法门之表达改变）
    quote: 你要留意一下！在〇八年以前，我讲念佛法门，我是讲这边三声，这边三声，有没有？三声、三声、三声，然后倒过来一共十声。然后眼、耳、鼻、舌、身，是讲这个，一〇年以后，我就不这样讲，我是一口气念十声，我才把第十八愿的十念法门结合在一起，在这之前我自己摸索的是这样念，绝对没错。但是表达的时候不应该这样表达
    src: docs/huayanhai/华严云海/修密莫修迷/密教行法指导/网络听录版/密教行法指导12_1.txt
    line: 65
    判读: 「调整修订追踪」之最强一条：自陈具体年份（〇八年以前／一〇年以后）、自陈改前改后之表达、并区分「摸索所得不错」与「表达方式应调整」——此即「边修边讲·边理顺」之可证实例
    信度: A
    status: 已回源

  - id: M7
    key: 失传史之自述论断（八思巴九级之制）
    quote: 我们也产生质变了，从那忽必烈引进八思巴的行法过来，把我们禅宗打为，他把社会分成九级，你知道不知道，历史都不读，分九级，妓女，乞丐第九级，比丘比丘尼第八级，大家谁愿意当第八级，大家都要当喇嘛，所以都修密法，所以禅宗的行法入口处就失传了。所以明朝出来的时候，那禅宗，这个时候就没有禅宗了。所以净宗在明朝才会那么兴盛的原因是这样来的，这是我们的一念之间所发生的问题。
