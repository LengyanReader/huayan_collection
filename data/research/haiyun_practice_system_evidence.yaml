# ══ 三、limit：法师自陈之限制与警戒（反证「摸索万能」之读法） ══
limit:
  - id: L1
    key: 摸索有界·普贤道须依止善知识
    quote: 圣解脱次第道的生命改造工程，完全是在大脑的解构基础上进行，可由人本身摸索前进。但普贤道中的不思议解脱工程，其知见之正确与否，居于绝对之地位，而此不思议解脱的领域，又岂是自己摸索所能企及？是以普贤道行法中，依止善知识的引导而按图索骥，乃必要条件之一
    src: docs/huayanhai/海云行愿/普贤行者二十一行_1.txt
    line: 149
    判读: 关键反证。法师自行划界：摸索仅适用于可解构之圣解脱次第道；其不思议解脱「岂是自己摸索所能企及」，须「依止善知识的引导而按图索骥」。故本文不得将其体系读为「白手摸索式自创」，助缘之地位由此得一手依据
    信度: A
    status: 已回源

  - id: L2
    key: 警戒·拼而不定则成跑江湖
    quote: 那就证明说，你所找的法门，都像拼图里面的一块而已。你在到处捡嘛！重复不重复不管，反正我有一堆就对了。那你要拼起来，人家以前叫“四不像”，你现在是“八不像”。什么也不像，不知道拼什么。讲是在修行，其实这叫“跑江湖”。你在到处跑，各山头、各道场、各大德、各法会到处跑，热闹可以。
    src: docs/huayanhai/华严云海/读经请深入/地藏合集/占察忏行法/占察善恶业报经-占察忏行法_1.txt
    line: 5743
    判读: 法师以其自身「拼图」语汇设警戒：只积材而不定则不成体系、反而「跑江湖」。此条与其自述互为表里，说明「拼图」在其口中非泛美词，而有成立条件
    信度: A
    status: 已回源

  - id: L4
    key: 警戒·拼错而不自知（斥「代死者黏补」）
    quote: 像那个拼图一样，他拼不起来，他弄错了他不管，他要找一个来替死的，拼在他拼不起来的地方，把他黏下去就对了。当他发现还有一块，他又要把你挖掉。
    src: docs/huayanhai/华严云海/浩瀚华严海/八十华严之18品明法品/明法品31_1.txt
    line: 75
    判读: 法师复用「拼图」以说明**拼错**之弊：接不起来而硬接，乃「找替死鬼」黏补，稍后又须挖掉。此为 L2 之外之二层警戒（L2 主警「只积材而不定」，L4 主警「硬拼而乱黏」）。所论者为众生过，故此条系以拼图喻他人之失，非自陈
    信度: A
    status: 已回源

  - id: L3
    key: 助缘叙述之完整版·含不自居语与时间坐标
    quote: 华严宗为什么我们接？这是观世音菩萨，跟我没关系，观世音菩萨跟钦因长老讲的，钦因长老说好，衣钵给你，我无缘无故捡到一个衣钵，而且观世音菩萨送的，不是我，我有什么本事，我也不知道贤首宗躲在哪个地方，你说这个禅法怎么修？修行方法怎么修，我是整个法界拼图拼了没错，但是两块怎么拼找不到啊，我是找不到那两块到底是什么，那是普贤菩萨叫牟尼吉来找我的。牟尼吉还派他的大使到美国去找了五年找不到，到2003年我们才碰面，是普贤菩萨叫他来找的。
    src: docs/huayanhai/华严云海/读经请深入/地藏合集/占察忏行法/占察善恶业报经-占察忏行法_1.txt
    line: 5480
    判读: 助缘叙述之完整版，含「我无缘无故捡到一个衣钵」之不自居语、「我也不知道贤首宗躲在哪个地方」之自承局限、2003 年碰面之时间坐标。然以菩萨感应解释人事，读者须知其为法师之信仰性陈述，非可证史实
    信度: A（史实待核）
    status: 已回源

# ══ 四、否定性记录：经检索而「查无」者（与「未查」严格分记） ══
negative_findings:
  - id: N1
    项: 以「犯过错误／走过弯路」自述其建构过程之失手
    状态: 查无
    检索范围: docs/huayanhai/ 全 645 篇，rg「犯过|走过弯路|走过错|错误的方向|走错」
    实际命中: 皆为讲佛陀、弟子、众生，或讲「修行者难免会走错」之一般语境；无一条系法师自陈其体系建构中之失手
    结论: 依编务总则第 3 条（严禁假信息），本文不得代拟「法师曾自承犯错」之语。其曲折自陈另有其辞——见 S1「这两块接不起来」「我也说不上那两块是什么」与 S5「这禅法不能突破，你这个衣钵也有问题」，系以「拼图未竟」之客观陈述含蓄表达

  - id: N2
    项: 以「助缘」一词自述其体系建构之人际助力
    状态: 查无
    检索范围: docs/huayanhai/ 全 645 篇，rg「助缘」
    实际命中: 仅见于密法／准提法等技术语汇语境（如「助缘法门」类用法），未见法师以「助缘」自述体系建构之人际助力
    结论: 其自用词为「因缘」，且所举为具名人物与团体——梦参老和尚、钦因长老、德林老和尚、印度大瑜伽师（惹扎西牟尼）、牟尼吉及其所派大使、三百多个同修（见 S5、M2、M4、L3）。故本文行文宜以「助缘」为分析语汇，并标明系据上述具名因缘归纳，而非法师原词

  - id: N3
    项: 法师原词「拼图」及其变体之全量清点与语义边界
    状态: 已查（部分）
    检索范围: docs/huayanhai/ 全 645 篇，rg「拼图」（全变体）＋「拼盘」，逐文件核语境
    实际命中: 含「拼图／拼盘」者合计 20 处，分布于 9 个文件。分类：①法师自述建构 7 处（S1「法界大拼盘」、S2／S3／L3「法界大拼图」、S4「拼啊拼啊」、S5「修行的大拼图」、S6「就像拼图」、S10「法界大拼图都拼的剩下两个洞」）；②警戒 2 处（L2；L4）；③非法师建构语境 2 处——和上新浪博客 2009 L1397「系统正与吾人摸索中的碎片拼图相吻合，岂非奇哉、奇哉耶?!」（赞叹语）；明法品31 L75「像那个拼图一样……拼在他拼不起来的地方，把他黏下去」（斥他人之乱拼）
    结论: 该词义有严格限界——赞美自陈（体系建构）与警戒（拼而不定、拼错代偿）并存，不可单取赞美面。**方法论要点**：只检「拼图」二字会漏「拼盘」变体（S1 之「大拼盘」即因此一度未计），故此类清点须连变体一并检索

  - id: N4
    项: 「挫折／失败／走错」等语在建构语境中之自陈
    状态: 查无（部分）
    检索范围: 同 N1，另参 rg「挫折|失败」（限 docs/huayanhai/）
    实际命中: 「挫折」「失败」之命中多为他处引用（如密教行法指导 L142 借用「水管接到电线管」之喻说明行法接错之危险），非法师自陈失手
    结论: 与 N1 同断。惟 S7「牺牲了将近三百个人」为其自陈代价之语，可作曲折之一旁证；此仍非「犯错」之自陈

