# ═══════════════════════════════════════════════════════
# 判教互判 — 各宗派·各宗教·各文化·各学术科技流派的
# 判教（教相判释）与互判之全方位综述
# 佛教各宗·藏传·日本·儒道·世界宗教·学术界·科技圈
# 全部条目附出处 · 逐一追溯源流与发展演变
# ═══════════════════════════════════════════════════════
sections:
- id: overview
  title: 判教互判总论
  icon: ⚖️
  intro: |
    判教（教相判释）是各大传统内部自我定位与互相评判的普遍现象：将全部教法（或学说）组织为有次第的体系，确立本宗所依经典/文本的最高地位，并为修行（实践）提供「地图」。
    佛教判教最成体系；儒、道、耶、回、印度教、学术界与科技圈各有同构的「判教」现象。本页逐一梳理各系统判教的立场、思想、修行定位、义学定位、判教依据及其源流演变。
  topics:
  - title: 判教的性质与双重功能
    body: |
      「判教」即**教相判释**：按义理高下深浅、说法先后次序，把浩繁的经教组织成一个有结构、有次第的体系。
      其功能有二：①**义学定位**——确立本宗所依经典的了义地位；②**修行定位**——判摄的次第即修行的地图。各宗判教本质上都是为了确立本宗所依经典的最高地位（唯吉藏以「诸经平等」的「无所得」立场为异数）。
      南北朝涅槃师判教「为中国佛教开创了判教这一极其重要的方法论，后来成为中国佛教教理思想建构的基本方法论」。
    source: '王仲尧《南北朝涅槃师的判教及其价值意义》(佛光山人间佛教研究院 fgsihb.org) · 《吉藏大师判教思想之研究》(中国佛学院《法源》总第20期 2002)'
  - title: 三系判教的三大经典范式
    body: |
      **宗密《禅源诸诠集都序》三种教**（与禅三宗一一配对，总会为一味）：
      • 密意依性说相教（法相唯识＝有宗）↔ 息妄修心宗
      • 密意破相显性教（般若中观＝空宗）↔ 泯绝无寄宗
      • 显示真心即性教（如来藏＝性宗）↔ 直显心性宗
      **印顺《印度之佛教》(1942) 大乘三系**：性空唯名论（龙树）·虚妄唯识论（无著世亲）·真常唯心论（楞伽·密严·涅槃·金光明系）
      **太虚三宗**：法性空慧宗 · 法相唯识宗 · 法界圆觉宗（天台·华严·禅）
    source: '宗密《禅源诸诠集都序》(T48n2015) · 印顺《印度之佛教》(正闻学社1943; 中华书局2011) · 太虚《佛法总抉择谈》《论大乘三宗》'
  - title: 三系对照表
    body: |
      | 系 | 代表经论 | 核心命题 | 判教位置（法藏五教十宗） |
      | --- | --- | --- | --- |
      | 空宗 | 般若经·《中论》 | 缘起性空·八不中道 | 大乘始教（空始教）·一切皆空宗 |
      | 有宗 | 解深密经·瑜伽师地论·成唯识论 | 万法唯识·三性三无性 | 大乘始教（相始教）·说相教 |
      | 性宗 | 楞伽·密严·涅槃·起信论 | 真如缘起·如来藏·性起 | 终教·真德不空宗；顿教·相想俱绝宗 |
      | 圆教 | 《华严经》 | 事事无碍·主伴具足 | 一乘圆教·圆明具德宗（不共别圆） |
    source: '法藏《华严一乘教义分齐章》(T45n1866) 五教十宗 · 宗密《禅源诸诠集都序》'

- id: nanbei
  title: 判教前史 · 南三北七
  icon: 🌱
  intro: |
    判教非隋唐宗派才有：其嚆矢在北凉昙无谶译《涅槃经》的「五味」比喻，经竺道生、慧观、刘虬等南北朝涅槃师的发展，形成「南三北七」十家判教，天台智者大师在《法华玄义》中总括并超越之。
  topics:
  - title: 嚆矢：昙无谶与竺道生
    body: |
      据汤用彤等研究，判教活动**创始于北凉昙无谶**（385-433）：所译《大般涅槃经》卷十四以「从牛出乳、从乳出酪、从酪出生酥、从生酥出熟酥、从熟酥出醍醐」比喻教义高下深浅，树立教相判释之嚆矢。
      其后**竺道生**就如来说法立「善净、方便、真实、无余」**四法轮**之别，并唱导顿悟成佛。
    source: '汤用彤《汉魏两晋南北朝佛教史》 · 韩焕忠《华严判教论》(齐鲁书社)'
  - title: 慧观「二教五时」— 体系化判教之始
    body: |
      刘宋**慧观**（鸠摩罗什高足，曾参与修治南本《涅槃经》）立「**二教五时**」：
      • **顿教**：《华严经》；
      • **渐教**五时：①有相教（阿含）②无相教（般若）③抑扬教（维摩·思益，抑声闻扬菩萨）④同归教（法华，开三显一）⑤常住教（涅槃，佛身常住）。
      蓝日昌指出其划时代意义：**首次确立大、小乘经教之分**——此后判教与佛典目录编制基本都按此体系归纳区分。
    source: '韩焕忠《华严判教论》 · 蓝日昌《慧观判教观研究》 · 《高僧传》卷七'
  - title: 刘虬「五时七阶」
    body: |
      南齐隐士**刘虬**（437-495）在慧观五时基础上**增添人天教**：人天教→有相教→无相教→同归教→常住教（据隋慧远《大乘义章》记载）；又依《无量义经》序以「七阶」判经典关系。
      慧观与刘虬被视为**江南最早的判教家**，但其判教尚属对诸经外形的分类，未达内容的化法层面。
    source: '隋·净影慧远《大乘义章》 · 圣凯法师《地论学派的判教思想与南朝佛教》(fjdh.cn)'
  - title: 「南三北七」十家
    body: |
      智顗《法华玄义》总括南北朝判教为「**南三北七**」十家（「南三北七，义成百家」）：
      **江南三家**（顿渐不定三教判）：①虎丘岌法师——有相、无相、常住三时；②宗爱法师——有相、无相、同归、常住四时；③僧柔、慧次承慧观——五时。
      **江北七家**：①刘虬五时；②菩提流支——半字教与满字教；③佛陀三藏、光统律师（慧光）——因缘、假名、诳相、常四宗；④自轨法师——加「法界宗」为五宗；⑤安廪法师——因缘、假名、诳相、真、常、圆六宗；⑥北地某禅师——有相、无相二种大乘；⑦鸠摩罗什——一音教。
      王仲尧指出：南方三家及北方刘虬一家**都属于涅槃师系统的判教**。
    source: '智顗《法华玄义》卷十「南三北七」 · 王仲尧《南北朝涅槃师的判教及其价值意义》(fgsihb.org)'

- id: tiantai
  title: 天台五时八教
  icon: 🌸
  intro: |
    天台智者大师综贯「南三北七」而超越之，以《法华经》为中心建立判教体系。注意学术史考证：「五时八教」完整表述非智顗一人一次提出，而是经灌顶、湛然、谛观历代祖师逐步定型。
  topics:
  - title: 五时 — 佛说法的时序
    body: |
      依《涅槃经·圣行品》「五味相生」（乳→酪→生酥→熟酥→醍醐）分佛一生说法为**五时**：
      ①华严时（如日出先照高山·乳）②阿含时（鹿苑说四谛十二因缘·酪）③方等时（维摩·思益·楞伽·胜鬘，弹偏折小叹大褒圆·生酥）④般若时（般若系·熟酥）⑤法华涅槃时（如日轮当午·醍醐，最高最圆满）。
    source: '智顗《法华玄义》 · 谛观《天台四教仪》五味相生配对'
  - title: 化仪四教与化法四教
    body: |
      **化仪四教**（说法形式，「譬如药方」）：**顿、渐、秘密、不定**。「秘密」教为智顗首创——他在南北朝通行「顿渐不定」之外增加「显—密」范畴。
      **化法四教**（说法内容，「譬如药味」）：**藏、通、别、圆**。藏教（小乘三藏·析空观）→通教（体空观，通前通后）→别教（界外独菩萨法·次第观）→圆教（圆妙圆满圆足圆顿·一心三观）。
    source: '智顗《法华玄义》 · 灌顶《天台八教大意》 · 李四龙《略论智顗的「秘教」思想》(philosophy.org.cn)'
  - title: 三种教相 — 判教大纲
    body: |
      智顗《法华玄义》卷一上立「**三种教相**」为判教大纲：①根性融不融相（根机）②化导始终不始终相（佛意）③师弟远近不远近相（本迹）——从三方面论证《法华》殊胜：前四时为权，唯法华开权显实、废权立实、「纯圆独妙」。
    source: '智顗《法华玄义》卷一 · 圣严法师《天台心钥——教观纲宗贯注》(ddc.shengyen.org)'
  - title: 演变：从三教相到「五时八教」定型
    body: |
      学术史考证：智顗原本判教着重「三种教相」，说法形式只有**顿、渐、不定**三教；「秘密」为智顗首创。
      → 弟子**灌顶**《天台八教大意》明确区分化仪/化法；
      → 九祖**湛然**《法华玄义释签》始有「五时八教」连称；
      → 高丽**谛观**《天台四教仪》将五时与五味、化仪一一相配，宣称「天台智者大师，以五时八教，判释东流一代圣教，罄无不尽」——自此成为天台判教基本框架。
      「若将完整的『五时八教』说直接视为智顗原本的判教思想，则显然是一种误会。」
    source: '天台宗判教演变研究 (检索考证) · 谛观《天台四教仪》'

- id: madhyamaka
  title: 空宗·三论 — 二藏三轮
  icon: 🌌
  intro: |
    三论宗吉藏以「无所得」立场判教：破五时说而立二藏，会三乘而归法华。与诸宗「抬高本宗」不同，吉藏强调「诸经平等」——判教是破执的工具而非立宗的手段。
  topics:
  - title: 二藏 — 破五时之说
    body: |
      吉藏（549-623，嘉祥大师）继承罗什、僧肇、法朗一系，对慧观「五时」判教持批判态度：「**但应立大小二教，不应制于五时**」。
      **二藏**：声闻藏（小乘）与菩萨藏（大乘），亦称半字教/满字教；吉藏引《大品经》《法华经》《涅槃经》三经及《智度论》《地持论》《正观论》三论为据，论证经论中只有二藏而没有五时。
    source: '吉藏《三论玄义》 · 《吉藏大师判教思想之研究》(中国佛学院《法源》总第20期)'
  - title: 三轮 — 法华会归的结构
    body: |
      **三轮**（三法轮）：①**根本法轮**——佛初成道华严会上说《华严经》（一因一果）；②**枝末法轮**——《华严》后《法华》前，因薄福钝根众生不堪一乘，故「于一佛乘分别说三」的一切大小乘经；③**摄末归本法轮**——《法华经》会三归一。
      按此判摄《般若》当属枝末，但吉藏认为般若属大乘，仍归根本法轮。三论宗实以**二藏为主、三轮为辅**。
    source: '吉藏《三论玄义》 · 佛光大辞典「三轮教」词条 (fodian.cc)'
  - title: 「诸经平等」的无所得立场
    body: |
      与其他宗派抬高本宗经典不同，吉藏强调「**诸经平等**」「是法平等无有高下」，判教旨在**破斥有所得之执**，体现般若实相无所得的特色，反映隋唐佛教走向融合的趋势。
      后世华严家澄观批评吉藏三轮「**收义不尽**」：因《法华》之前亦说大乘，不可将《般若》等全判为枝末。
    source: '《吉藏大师判教思想之研究》(zgfxy.cn) · 澄观《华严经疏》对三轮之评'

- id: yogacara
  title: 有宗·唯识 — 三时判教
  icon: 🔬
  intro: |
    唯识宗依《解深密经》立「有、空、中」三时判教，以第三时中道了义为自宗依据——与天台五时、华严五教鼎足而立。
  topics:
  - title: 解深密经的三时
    body: |
      《解深密经·无自性相品》判一代圣教为**三时**：
      ①**初时**（有教/转法轮）：鹿野苑为声闻说四谛；
      ②**二时**（空教/照法轮）：为大乘说般若诸法皆空、无自性，以「**隐密相**」说法；
      ③**三时**（中道教/持法轮）：说三性及真如不空等唯识中道，以「**显了相**」说法，遣除第二时空执，普为三乘。
    source: '《解深密经·无自性相品》(T16n0676)'
  - title: 真谛与玄奘的立说
    body: |
      三时教为**真谛、玄奘**所立：真谛依《金光明经》立转、照、持三轮（成道后七年转小乘四谛→七年后说般若明空→三十年后说《解深密》明空有）；玄奘依《解深密经》《瑜伽师地论》立同样结构。
      玄奘在印度曾亲见**戒贤与师子光**各立三时以争「了义」——《解深密经》被唯识家奉为了义之教。
    source: '中国佛学院《华严三时判教说》(zgfxy.cn) · 《大唐大慈恩寺三藏法师传》'
  - title: 法藏的评判
    body: |
      法藏批评玄奘及印度中观派的三时判教**未将《华严经》包摄进去**，均不圆满——此即华严宗立「五教」、以圆教《华严》为最高判摄的因由之一。
      天台智顗则以五时八教突出《法华》为纯圆之教。三宗互评表明：各宗判教本质上都是为确立本宗所依经典的最高地位。
    source: '中国佛学院《华严三时判教说》(zgfxy.cn) · 法藏《华严一乘教义分齐章》'

- id: xingzong
  title: 性宗·真常 — 直显真心
  icon: 🌄
  intro: |
    性宗以「直显」为宗：一切众生本有空寂真心，名为佛性、如来藏、心地。宗密判为「显示真心即性教」——中国佛教义理的主流命脉，由《起信论》真如缘起开出华严「性起」说。
  topics:
  - title: 宗密「显示真心即性教」
    body: |
      宗密：「一切众生皆有空寂真心，无始本来，性自清净，明明不昧，了了常知，尽未来际，常住不灭，**名为佛性，亦名如来藏，亦名心地**。」「灵知之心，即是真性，与佛无异。」
      所依经论：《华严》《密严》《圆觉》《佛顶》《胜鬘》《如来藏》《法华》《涅槃》等四十余部经，《宝性》《佛性》《起信》《十地》《法界》《涅槃》等十五部论。
      宗密并批评前两教：「如何破相之党，但云寂灭，不许真知；说相之家，执凡异圣，不许即佛。」
    source: '宗密《禅源诸诠集都序》(T48n2015)'
  - title: 起信论与真如缘起
    body: |
      《大乘起信论》一心开二门：心真如门（不变）·心生灭门（随缘），真如缘起「不变随缘、随缘不变」。
      法藏判之为终教「真德不空宗」；华严宗「**性起**」说（智俨、法藏）即由此开出：性起＝依体起用，佛果之体性显现为无尽法界。
    source: '《大乘起信论》(T32n1666) · 法藏《华严一乘教义分齐章》(T45n1866)'
  - title: 中土佛性论的源头：竺道生
    body: |
      竺道生（355-434）见法显六卷《泥洹》言「除一阐提，皆有佛性」，独发「**一阐提人皆得成佛**」——「夫禀质二仪，皆有涅槃正因。阐提含生之类，何得独无佛性？盖是经来未尽耳。」
      被摈出僧团后「生公说法，顽石点头」；及北本《大般涅槃经》传至，经文与之符契，被追尊「涅槃圣」。汤用彤：「后日谈心性主顿悟者，盖不得不以生公为始祖矣。」
    source: '赖永海《中国佛性论》 · 汤用彤《汉魏两晋南北朝佛教史》 · 《高僧传》卷七'

- id: tathagatagarbha
  title: 如来藏 — 专论与争议
  icon: 💎
  intro: |
    如来藏（tathāgatagarbha）思想是「空有直性」议题的漩涡中心：它既是性宗的教理内核，也是近现代「起信论真伪」「批判佛教」两大论争的焦点。
  topics:
  - title: 经典与论典的谱系
    body: |
      早期如来藏系三部经：《如来藏经》《不增不减经》《胜鬘经》（高崎直道之说）；另有《楞伽》《密严》《大法鼓》《央掘魔罗》等。
      论典以《宝性论》（Ratnagotravibhāga）为最系统——以《如来藏经》「九譬喻」证成如来藏为烦恼所缠，是其理论核心；梵文校勘本以 E. H. Johnston 1950年刊本为国际通用标准。
    source: '高崎直道《如来藏思想的形成》(春秋社1974) · A Study on the Ratnagotravibhāga (Uttaratantra), Serie Orientale Roma XXXIII'
  - title: 本寂与本觉 — 吕澂的判分
    body: |
      吕澂《试论中国佛学有关心性的基本思想》提出著名的「**心性本寂**」（印度）与「**心性本觉**」（中国）之区分，认为中国佛学以「本觉」理解心性明净属「性觉」之说，将中国化佛教判定为「相似佛学」。
      支那内学院由此驳《起信》、难《楞严》、疑《圆觉》《占察》《仁王》《梵网》，对中国化佛教传统发起根本质疑。
    source: '吕澂《试论中国佛学有关心性的基本思想》 · 刘鹿鸣《「慈宗」构建与近代弥勒信仰复兴中的理论抉择》(aisixiang.com)'
  - title: 批判佛教的挑战与佛门驳议
    body: |
      日本驹泽大学袴谷宪昭、松本史朗：「如来藏思想不是佛教」——它是「**基体论**」（dhātu-vāda），主张单一实在的基体生起多元诸法，违背缘起与无我。松本引《大乘阿毘达磨经》「无始时来界，一切法等依，由此有诸趣，及涅槃证得」一偈为证。
      台湾释恒清《「批判佛教」驳议》（《国立台湾大学哲学论评》第24期，2001）依《胜鬘经》《大般涅槃经》《宝性论》《佛性论》反驳：如来藏（佛性）思想恰恰是实践中平等、正义的理论基础。
      林镇国认为批判佛教的真正意图指向社会现实与文化批判；周贵华指出其与内学院「相似佛教」判在「发生论的一元论」定性上一致。
    source: '释恒清《「批判佛教」驳议》, 《台大哲学论评》24期 (pdcnet.org) · 周贵华《日本「批判佛教」思潮：反应与研究》(fjdh.cn)'
  - title: 海云法师：如来即自性
    body: |
      海云法师《华严经·如来出现品》讲记：众生内在本有「取之不盡、用之不竭的寶藏」——「釋迦牟尼佛管它叫『**如來**』，我們稱其為『**自性**』」；「我們的自性、佛性呈現、開展，此即**如來出現**」。
      法师强调：**必须先证得空性**为基础，如来（佛自性）才能显现——「没有空性……那是人天善法，不是菩萨道的大功德」。
    source: '海云继梦《自性啟航——華嚴經如來出現品卷一講記》(空庭書苑2003) · 《四十华严讲记》第23讲 (fjdh.cn)'

- id: debates
  title: 近现代论争 — 空有之诤与起信真伪
  icon: ⚔️
  intro: |
    1920-40年代，支那内学院与武昌佛学院围绕唯识、起信论、如来藏展开的论争，是「判教互判」在近代最高强度的学术对决，其思想效应延续至今。
  topics:
  - title: 内学院与武昌佛学院的对垒
    body: |
      1922年欧阳竟无在南京创办支那内学院，太虚在武昌创办武昌佛学院，并列为两大佛学中心。
      内学院以专精唯识而道定一尊，对中国佛学天台、华严、禅宗猛攻猛破；欧阳竟无《唯识抉择谈》出，太虚作《佛法总抉择谈》依唯识三性（遍计所执性、依他起性、圆成实性）通论大乘回应。
    source: '太虚《佛法总抉择谈》 · 刘鹿鸣《「慈宗」构建与近代弥勒信仰复兴中的理论抉择》(aisixiang.com)'
  - title: 起信论真伪论争全景
    body: |
      • 隋法经《众经目录》已编《起信论》入「众经疑惑部」；
      • 日本望月信亨、梁启超（1922《大乘起信论考证》）据史料考证断为伪作；
      • 吕澂《起信与楞伽》从七个观点证明《起信论》是伪论——非从梵本译出，乃沿袭魏译《楞伽》「如来藏与藏识不同」之误而来；
      • 太虚「从《成唯识论》寻得此论立说之依据点」以唯识释起信辩护；
      • 印顺认为纵有译错，《起信》「真妄和合」结构吻合「真常唯心论」；
      • 牟宗三批评吕澂：「如来藏藏识」是复合词，有取性与解性两面，吕只取前一义。
    source: '圣严法师对近代起信论真伪两系之总结 (ddc.shengyen.org) · 吕澂《起信与楞伽》 · 梁启超《大乘起信论考证》'
  - title: 太虚与印顺之诤
    body: |
      1942年印顺将《印度之佛教》书稿寄请太虚作序，太虚撰《议印度之佛教》《再议印度之佛教》，批评印顺「独尊龙树」「孤取人间为本」；印顺以《敬答议印度之佛教》回应。
      这场争论被视为「人间佛教」（印顺）与「人生佛教」（太虚）路线分歧的重要前哨战。
    source: '印顺《印度之佛教》·《敬答议印度之佛教》 · 太虚《再议印度之佛教》 · 侯坤宏《从太虚大师到印顺法师：一个思想史角度的观察》(fjdh.cn)'

- id: ekayana
  title: 一佛乘 — 会三归一与别教一乘
  icon: 🛞
  intro: |
    「一佛乘」（eka-yāna）之争是台贤两宗判教对决的主战场：《法华》会三归一为「同教一乘」，华严直显不共为「别教一乘」。
  topics:
  - title: 法华的会三归一
    body: |
      《法华经·方便品》：「十方佛土中，唯有一乘法，无二亦无三。」
      天台《四教仪集注》以四义释「一」：**教一**（唯一佛乘）、**行一**（「正直舍方便，但说无上道」）、**人一**（「但为菩萨，不为小乘」）、**理一**（「世间相常住」）。
      天台自居圆教，判《华严》「兼别教而非纯圆教」，唯《法华》「部圆教圆」纯圆独妙。
    source: '《法华经·方便品》(T09n0262) · 《天台四教仪集注》'
  - title: 华严的别教一乘
    body: |
      法藏《华严一乘教义分齐章》（《五教章》）开十门，首门「建立一乘」，将一乘分「**别教**」「**同教**」二门（初由二祖智俨提出，法藏集大成）：
      • **别教一乘**（《华严》）：如来自证自悟境界，主伴具足无量教义、事事无碍、因果无二、三世间本来圆满；分「性海果分」（不可说——「因分可说，果分不可说」）与「缘起因分」（普贤境界）；
      • **同教一乘**（《法华》）：会三归一，与三乘教义相通、权实圆融，仍带权教性质。
      澄观：「百川不摄大海，大海必摄百川」。
    source: '法藏《华严一乘教义分齐章》(T45n1866) · 释正持《别教一乘与同教一乘之同异——以〈五教章〉为主》(huayencollege.org)'
  - title: 太虚的超宗派立场
    body: |
      太虚《佛教各宗派源流》：「清凉判法华兼终教非纯圆教，天台判华严兼别教非纯圆教，此乃独标自宗殊胜，令学者死尽偷心以起行趣证等。」
      究实而言「八宗皆实非权，皆圆非偏，皆妙非麤；皆究竟菩提故，皆同一教乘故」。
    source: '太虚《佛教各宗派源流》 · 太虚《我怎样判摄一切佛法》(books.fo)'

- id: yuanjiao
  title: 共同圆与不共别圆
  icon: 🏔️
  intro: |
    「共同圆教」与「不共别圆」是海云法师对法藏同别二教判的现代诠释：法华摄三归一为共同圆，华严直显佛果为不共别圆——「没有三车，只有露地大白牛车」。
  topics:
  - title: 五教十宗的判摄
    body: |
      法藏「就法分教，教类有五」：**小乘教**（人空法有）→ **大乘始教**（空门：般若中观，一分无性）→ **终教**（不空门：起信如来藏，一切众生皆有佛性）→ **顿教**（绝言真如：楞伽，言说顿绝）→ **圆教**（华严别教一乘，事事无碍）。
      十宗后四：一切皆空宗（始·空）、真德不空宗（终·性宗）、相想俱绝宗（顿）、圆明具德宗（圆）。
    source: '法藏《华严一乘教义分齐章》(T45n1866) · 方立天《法藏》五教章研究'
  - title: 海云法师：共同圆教 vs 不共别圆
    body: |
      海云法师《三圣圆融观》：「《法华经》上讲的佛乘，并非『一乘』，而是『共教』、是『同教』、『圆教』，所以称之为『**共同圆教**』」——核心是「摄三归一」「会三归一」，三车之外露地另有大白牛车，属「圣解脱道」，可思可议。
      华严则是「**不共别圆**」：不共教、别教、圆教，「真理即是如此，与三乘无关」——「**没有三车，只有露地大白牛车**」：一出三界，通通证入大白牛车境界。
      大乘分菩萨乘（波罗蜜乘）与一佛乘；一佛乘之下再分：密宗金刚乘属共同圆教；华严一佛乘特称「**普贤乘**」，为最高层次。
    source: '海云继梦《三圣圆融观》 (fjdh.cn: https://www.fjdh.cn/wumin/2013/09/085114285451.html)'
  - title: 「不共」在真发菩提心
    body: |
      「不共」究竟不共在哪里？海云法师：在「**真发阿耨多罗三藐三菩提心**」——不是形式上的发心，而是心真的在转化。真发菩提心理、事两个前提：
      • 理：对三宝具足信根，以普贤菩萨为本尊；
      • 事：尽形寿行菩萨道；一切荣耀归三宝，一切挫折向普贤本尊忏悔。
      真发心后「一切法皆可修行」——绘画、音乐、舞蹈、运动皆是普贤乘，「于一切法成最正觉」。
    source: '海云继梦《三圣圆融观》 (fjdh.cn)'
  - title: 普贤圆融道与法界力
    body: |
      华严行法称「**普贤圆融道**」（圆融道），「**不用大脑在大地上成就**」；所讲的是「**法界力**」——像万有引力一样本来存在，并非净土宗所说的「他力」，而是法界的本然运作。
      禅宗的「教外别传」其实也没有离开不共别圆的范畴。法华的大白牛，在华严是直接兑现，能直接证得法、报、化三身。
    source: '海云继梦《三圣圆融观》 (fjdh.cn) · 《同证法报化三身》(wuming.xuefo.com)'

- id: hupan
  title: 诸宗互判与合流
  icon: 🤝
  intro: |
    判教成熟之后，宗派之间与宗派内部展开了持续的互判：天台山家山外之争、台贤互判、禅教之争、台净合流——互判既是义学划界，也是融合的动力。
  topics:
  - title: 天台山家山外之争（约980-1030）
    body: |
      五代末天台典籍自高丽、日本回传复兴，但因文献久疏、受贤首慈恩学说及「兼讲」思潮影响，天台教义被夹杂混淆，引发**山家（四明知礼，960-1028，四明）与山外（慈光晤恩一系，钱塘；孤山智圆976-1022等）**三四十年的正统之争。
      四大论题：①《金光明经玄义》广略本真伪（知礼《释难扶宗记》《十义书》《观心二百问》，历时七年）；②**真心观vs妄心观**（山外受华严慈恩影响主真心观；知礼主妄心观）；③**别理随缘与理具三千**（知礼「若不谈体具者，随缘与不随缘，皆属别教」——以「理具」简别天台性具与华严性起）；④《十不二门指要钞》之诤（后衍生仁岳「后山外」）。
      知礼被推为「中兴天台」第十七代祖；南宋广智、神照、南屏三家承其说，山家终代表天台盛行于世。
    source: '吴忠伟《圆教的自拘——山家山外之争与宋代制度佛学》(philosophychina.cssn.cn) · 知礼《观无量寿经疏妙宗钞》研究 (minlun.org.tw) · 龚隽《北宋天台宗对〈大乘起信论〉与〈十不二门〉的诠释与论争》(wuming.xuefo.com)'
  - title: 台贤互判与智圆的反弹
    body: |
      天台判华严「兼别教而非纯圆」；清凉判法华「兼终教非纯圆」——太虚总结为「独标自宗殊胜」。
      山外智圆则批评「近人不晓，乃谓华严、起信宗师所谈圆极但是今家别教者，谬之甚矣」——真如须具三千法，「若非本具，云何能造」。湛然引入《起信论》「真如随缘」后，天台与华严界限模糊，正是山家山外分裂的义理根源。
    source: '龚隽《北宋天台宗对〈大乘起信论〉与〈十不二门〉的诠释与论争》(wuming.xuefo.com) · 太虚《佛教各宗派源流》'
  - title: 禅教之判与合流
    body: |
      宗密《禅源诸诠集都序》倡**教禅一致**：以三种教配禅三宗，「一一证之，然后总会为一味」——「今时弟子彼此迷源，修心者，以经论为别宗；讲说者，以禅门为别法」正是宗密要弥合的裂痕。
      永明延寿主张**禅教兼重、性相融合**，主动融合诸宗（其融会姿态甚至被学者视为促使天台山家山外论争产生的外部因素之一）。
    source: '宗密《禅源诸诠集都序》 · 悟殷法师《记〈中国佛教史略〉之特见》(xuefo.com) · 吴忠伟《圆教的自拘》(cssn.cn)'
  - title: 台净合流：教演天台，行归净土
    body: |
      知礼晚年力作《观无量寿经疏妙宗钞》（六十二岁成书，六十八岁加《料简十三科》）以天台圆宗诠释净土教义，确立「**教演天台，行归净土**」的修学方向，首唱**台净融合**之论，并弥补善导「凡夫入报土」论义理之不足。
    source: '知礼《观无量寿经疏妙宗钞》研究 (minlun.org.tw)'

- id: zangchuan
  title: 藏传判教 — 九乘与四部宗义
  icon: 🐉
  intro: |
    藏传判教自成体系：宁玛以「大圆满」为标准立九乘；格鲁以「应成中观」为究竟了义；「自空」与「他空」之争贯穿藏传思想史。
  topics:
  - title: 宁玛派九乘判教
    body: |
      宁玛派以「大圆满」为标准将一切佛法判为**九乘**（另列世间二类）：
      • 世间法：颠倒外道乘；因循人天乘（人乘五戒/天乘十善）；
      • **显三乘**（集聚招引三外乘）：声闻、独觉、菩萨；
      • **外密三乘**（苦行明觉内三乘）：事部、行部、瑜伽部；
      • **内密三乘**（深密随转方便三内乘）：摩诃瑜伽（生起）、阿努瑜伽（教敕）、阿底瑜伽（大圆满，分心部/界部/要门部）。
      九乘次第由前弘期**吉祥积译师**开创，**隆钦饶绛巴（1308-1363）**在《七宝藏论·宗论藏》中系统化。
    source: '土观·罗桑却吉尼玛《宗派源流》(1801) · 何杰峰《藏传佛教判教研究》(巴蜀书社) · 谈锡永《〈四法宝鬘〉导读》(xuefo.com)'
  - title: 四部宗义与「大中观」
    body: |
      显教三乘内摄印度**四部宗义**（「四宗河」）：毗婆沙（有部）·经量部·唯识宗·中观宗；中观又分**外宗**（自续派、应成派——说一切无自性）与**内宗**（他空中观、唯识中观——「**大中观**」）。
      宁玛判三转法轮：初转四谛、二转无自性为不了义，**三转法轮的他空大中观见为究竟了义**。敦珠法王《四部宗义要略》（谈锡永译）认为如来藏思想为佛家最究竟见，藏传宁玛、萨迦、噶举、觉囊及汉传诸宗皆依此建立，统称「大中观」。
    source: '敦珠法王《四部宗义要略》(谈锡永译, 附《九乘次第论集》) · 何杰峰《藏传佛教判教研究》'
  - title: 格鲁派的应成中观立场
    body: |
      格鲁派以**佛护、月称的中观应成派见为佛的究竟了义思想**——与宁玛派显教判释「南辕北辙」；格鲁派的出现被视为藏传思潮「由佛性论转向般若学」的重要标志。
      见修分歧：宁玛主张众生心体本净、顿悟自性元成；格鲁否认本具之说，认为众生心染污，须离垢清净、长时积集福智二资粮方能成佛。
      隆钦巴曾将应成中观置于显宗最高位；后世宁玛学者则认为应成中观虽非了义，在实修次第中有「下学上达」的作用。
    source: '何杰峰《藏传佛教判教研究》(巴蜀书社) · 谈锡永《〈四法宝鬘〉导读》'

- id: dzogchen
  title: 大圆满觉与觉囊他空
  icon: 🏔️
  intro: |
    「大圆满觉」在汉传语境对应《圆觉经》「圆满觉性」，在藏传语境对应大圆满（Dzogchen）之觉空无别——两者皆以「心性本净、光明本具」为共同义理结构，与如来藏系同源；觉囊「他空见」则是藏传最彻底的如来藏正统论。
  topics:
  - title: 藏传大圆满（Dzogchen）
    body: |
      大圆满（佐巴钦波）为宁玛九乘之顶（阿底瑜伽），主张**心性本具光明自然智**；实修有**彻却**（立断）与**妥噶**（顿超）。
      隆钦巴（14世纪，无垢光尊者）著《七宝藏》集大成，建立龙钦心髓；吉美林巴（1729/30-1798）获其净相传承，撰《功德藏》。大圆满与汉地禅宗关系长期受讨论，隆钦巴本人有对和尚教法属上等根器者的阐述。
    source: '中国西藏网《试论藏传佛教大圆满法与汉地禅的关系问题》(tibet.cn) · 《大圆满心性休息》讲解 (bicwny.com)'
  - title: 觉囊他空见 — 藏传如来藏正统论
    body: |
      觉囊派「**他空见**」（gzhan stong）：中观「诸法无自性」仅适用于世俗谛；与佛之无量功德无可异离的胜义谛应视为「他空」——所空者是客尘垢染。笃布巴·协饶坚赞（1292-1361）《山法了义海论》：「他空胜义谛常恒不变，周遍一切情器世界，**与如来藏同一意义**，在因位时即已本有。」
      觉囊以《如来藏经》等末转法轮为究竟了义；与格鲁自空见完全对立。多罗那他（1575-1643）著《印度佛教史》；五世达赖时卫藏觉囊遭禁绝，今存四川壤塘、青海果洛等传承。
    source: '土观《宗派源流》 · 沈卫荣主编《他空见与如来藏——觉囊派人物、教法、艺术和历史研究》(北京大学出版社)'
  - title: 汉地圆觉传统 — 宗密的圆满觉性
    body: |
      《圆觉经》：「知幻即离，不作方便；离幻即觉，亦无渐次。」
      宗密依《圆觉经》开悟（804年），判其教相：与终教「彼此克体全相摄属」（「此经亦依如来藏故」）、属大乘顿教、分摄圆教（有理事无碍、缺事事无碍）。
      核心命题：「**如来圆觉，妙心涅槃，即名佛性**」；「生本成佛，唯是《圆觉》《华严》」。与《华严》「虽文有广略，妙轨同侪」。
    source: '宗密《圆觉经大疏》《圆觉经大疏钞》 · 董群《融合的佛教》第七章 (fjdh.cn) · 龚隽《从〈华严经〉到〈圆觉经〉：唐代华严教学中的经典转移》'

- id: japan
  title: 日本判教 — 显密二教与十住心
  icon: 🗾
  intro: |
    日本佛教移植中国判教传统，称「教相判释」；空海《辨显密二教论》《十住心论》以密教为最高判摄，促成日本由奈良六宗式学派佛教向宗派佛教转化。
  topics:
  - title: 空海《辨显密二教论》— 显密二教判
    body: |
      空海（774-835）804年入唐，从青龙寺惠果受两部灌顶，为唐密第八祖；806年归国创真言宗。他入唐时中国尚无密教判教著作，其判教具开创性。
      《辨显密二教论》（二卷）：横向将全部佛法分为**显教与密教**——释迦等应化身所说为显教（浅显），《大日经》《金刚顶经》等大日如来法身所说为密教（秘奥）；主张「**显劣密胜**」，以六大（体）、四曼（相）、三密（用）为纲要，主张即身成佛。
    source: '空海《辨显密二教论》(T77n2427) · 《弘法大师空海密教思想研究》 · 陕西佛教祖庭文化资料 (sxlib.org.cn)'
  - title: 《十住心论》— 九显一密
    body: |
      空海依《大日经·住心品》，将信奉者心境由浅入深分**十住心**：①异生羝羊心（凡夫）②愚童持斋心（儒教）③婴童无畏心（外道·老庄）④唯蕴无我心（声闻）⑤拔业因种心（缘觉）⑥他缘大乘心（法相宗）⑦觉心不生心（三论宗）⑧一道无为心（天台宗）⑨极无自性心（华严宗）⑩秘密庄严心（真言密宗）。
      前九为显教，唯第十为密教——「**九显一密**」；由此**真言第一、华严第二、天台第三、三论第四、法相第五**。
      学者指出此体系可与黑格尔《精神现象学》相比拟——描述人心逐渐升华的过程，而非单纯佛说顺序。
    source: '空海《秘密曼荼罗十住心论》《秘藏宝钥》(830年天长七年奉诏进献) · 《弘法大师空海密教思想研究》'
  - title: 日本诸家判教谱系
    body: |
      日本判教主要代表：真言**空海**显密二教判及十住心；台密**安然**五时五教；净土真宗**亲鸾**二双四重；**日莲**立「五纲」之说（从教、机、时、国、师法先后等角度判释佛法）。
      日莲宗与净土宗、净土真宗、时宗等同属镰仓新佛教——日本僧人依据汉译佛经和中国著作自创的民族宗派，适应武士和平民信仰需求。
      空海的判教促成日本佛教由奈良六宗式的学派佛教向宗派佛教转化，深刻影响平安后期佛教发展。
    source: '末木文美士《日本佛教中判教(教判)的展开——经典解释的基础》 · 空海《辨显密二教论》'

- id: rujia
  title: 儒家判教传统 — 道统与学案
  icon: 📜
  intro: |
    儒家虽不言「判教」，却有其结构对应物：韩非「儒分为八」的学派谱系、韩愈的「道统」说、汉宋之学案、今古文之辨、朱陆之辩——都是儒家版的「教相判释」与「互判」。
  topics:
  - title: 儒分为八 — 最早的学派谱系
    body: |
      《韩非子·显学》：「自孔子之死也，有子张之儒，有子思之儒，有颜氏之儒，有孟氏之儒，有漆雕氏之儒，有仲良氏之儒，有孙氏之儒，有乐正氏之儒。」
      韩非的判语：「孔墨之后，儒分为八，墨离为三，**取舍相反、不同，而皆自谓真孔墨**」——八派观点各异，却都自称孔门正宗。
      八派中影响最大者为孟氏（孟子）与孙氏（荀子，避汉宣帝讳称孙卿）；子思、孟子后世合称「思孟学派」；郭沫若认为应补子夏氏之儒（韩非因视法家出于子夏而剔除）。
    source: '《韩非子·显学》 · 刘泽华《中国文化发展中的「复古」迷思》(rujiazg.com) · 张岱年主编《孔子大辞典》'
  - title: 道统说 — 儒家的「判教大纲」
    body: |
      韩愈《原道》首次完整构建儒家「**道统**」：「尧以是传之舜，舜以是传之禹，禹以是传之汤，汤以是传之文武周公，文武周公传之孔子，孔子传之孟轲，**轲之死，不得其传焉**。」其构建目的是抗衡佛教，并极力推尊孟子。
      后世批评甚烈：康有为指斥「后世之道术不明统绪不著者，皆韩愈粗疏灭裂之罪」；近代经学史研究指出「从孔子直接到孟子」是韩愈之后的一套理论，不正确。朱熹虽称赞韩愈「有辟佛老之功」，却把续接道统之功归于周敦颐和二程。
    source: '韩愈《原道》 · 康有为对韩愈道统之批评 (ctext.org 皇朝经世文新编) · 近代经学史研究'
  - title: 今古文经学之争
    body: |
      秦焚书后，五经靠儒生记忆背诵流传，以汉隶书写，称**今文经学**；后孔子故居发现战国「蝌蚪文」儒经，刘歆加以整理，称**古文经学**——两派在文本与解读方法上均有差异。
      后经**郑玄**基本统一今古文，争议渐息；至清末疑古之风再起：康有为认为东汉以来经学多出刘歆伪造，乃新莽一朝之学，此说后被学者驳斥。
    source: '中国经学史讲义 (book.douban.com) · 康有为《新学伪经考》之评述'
  - title: 朱陆鹅湖之会（1175）
    body: |
      淳熙二年（1175），吕祖谦约朱熹与陆九渊、陆九龄会于信州铅山鹅湖寺，「欲会归于一，而定所适从」。据陆门朱亨道记载：「元晦之意欲令人泛观博览而后归之约，二陆之意欲先发明人之本心而后使之博览。朱以陆之教人为太简，陆以朱之教人为支离。」
      陆九渊和诗：「**易简工夫终久大，支离事业竟浮沉**。」三年后朱熹和诗：「旧学商量加邃密，新知培养转深沉。」
      义理根源：朱熹「**性即理**」（理是客观实体，须格物穷理）；陆九渊「**心即理**」「宇宙即是吾心，吾心即是宇宙」（本心源出孟子四心）。黄宗羲总结：二人「同植纲常，同扶名教，同宗孔孟」。
      鹅湖之会开启了中国书院会讲与思辨探究的先河；1181年朱熹邀陆九渊白鹿洞讲「义利之辨」，刻石存之。
    source: '韩星《〈中庸〉「尊德性而道问学」章疏解》(rujiazg.com) · 中国孔子基金会「鹅湖之会」条目 (chinakongzi.org) · 《宋元学案·象山学案》'

- id: daojia
  title: 道家道教的判教
  icon: 🎋
  intro: |
    中国最早的「学术判教」出自道家一脉：《庄子·天下》开学术史之先河，司马谈《论六家要指》创「以家论学」之法；道教则以「三洞四辅」七部体制组织全部经籍，并以《夷夏论》参与佛道互判。
  topics:
  - title: 《庄子·天下》— 学术史开山
    body: |
      《天下》篇被学界视为**中国学术史的开山之作**，对六经有经典评述：「《诗》以道志，《书》以道事，《礼》以道行，《乐》以道和，《易》以道阴阳，《春秋》以道名分。」
      熊十力推崇其「于六经各以一二字总括其旨，皆足以包通全经，含藏万理」，《论六经》实以《天下》篇为依据。
      庄子评诸子限于战国中期（儒墨道名各家），并感叹「**道术为天下裂**」——对诸子分流抱有失望，主张回归整全之道。
    source: '《庄子·天下》 · 熊十力《论六经》 · 论「九流十家」的建构历程——从《天下》篇到《汉志》(cqvip.com)'
  - title: 司马谈《论六家要指》— 以家论学之始
    body: |
      司马谈（约前165-前110，太史令）《论六家要指》仅千字左右，但**首次以「家」论学**：先秦多以人论学（荀子《非十二子》、庄子《天下》只评个人），司马谈始据「要旨」分「家」，首分诸子为**阴阳、儒、墨、名、法、道德六家**，并首次将「道家」作为学派论述。
      评判标准为「**务为治**」：「夫阴阳、儒、墨、名、法、道德，此务为治者也，直所从言之异路，有省不省耳。」学术立场上崇信黄老，欲以道家统摄诸子。
    source: '司马谈《论六家要指》(《史记·太史公自序》引) · 「务为治」——读司马谈《论六家要旨》(光明日报 2020-05-11)'
  - title: 《汉书·艺文志》九流十家
    body: |
      刘歆《七略》→班固《汉书·艺文志》，在司马谈六家基础上扩展为「**九流十家**」，以六艺统摄诸子，附「诸子出于王官」说；并将司马谈所称「道家」降格为「杂家」。
      学界指出：「九流十家」之说并非对先秦思想的忠实还原，而是基于时代思潮与自身学术立场的**理论建构**。
    source: '《汉书·艺文志·诸子略》 · 论「九流十家」的建构历程——从《天下》篇到《汉志》(cqvip.com)'
  - title: 道教三洞四辅 — 七部道书体制
    body: |
      刘宋**陆修静**奉敕作《三洞经书目录》，以「**三洞**」总括《上清经》（洞真）、《灵宝经》（洞玄）、《三皇经》（洞神）三大系统经书——以三洞总括各派经书是陆修静的创造，在融会各道派、使道教整体化规范化方面作用重大。
      但三洞不载《太清经》与《道德经》，遂「增四辅以益三洞」——**太清、太平、太玄、正一**四辅，成**七部**体制。陈国符《道藏源流考》考定：七部法始于《正一经》（创立者孟景翼），非孟法师《玉纬七部经书目》。
    source: '陈国符《道藏源流考》 · 百年道学精华集成·经籍考古卷 (詹石窗总主编)'
  - title: 顾欢《夷夏论》— 佛道互判
    body: |
      顾欢（吴郡盐官人）作《夷夏论》（刘宋末年），核心论旨：
      • 「**道则佛也，佛则道也。其圣则符，其迹则反**」——二教圣道相符而教迹相反；
      • 「舟车均于致远，而有川陆之节」——佛道齐乎达化，而有夷夏之别，「舍华效夷」则悖德犯顺；
      • 优劣之辨：「佛教文而博，言华而引，经繁而显；道教质而精，言实而抑，经简而幽」；「佛是破恶之方，道是兴善之术」。
    source: '顾欢《夷夏论》(《全齐文》卷二十二, 严可均辑)'

- id: world
  title: 世界宗教的判教
  icon: 🌍
  intro: |
    判教现象不限于佛教：基督教三大传统、伊斯兰教法学派、印度教六派哲学——各大宗教内部同样以「正统—异端」「教法—学派」的结构组织自我与他者。
  topics:
  - title: 基督教 — 三大传统与神学路线
    body: |
      基督教经历1054年东西教会分裂与1517年宗教改革，形成**天主教、东正教、新教**三大传统——各传统各有教义判准（教宗权威/大公传统/唯独圣经）。
      当代神学内部又有「判教」：分析哲学与大陆哲学的分野深刻影响神学——以耶鲁大学为中心的**后自由主义学派**（Lindbeck、Hans Frei、Stanley Hauerwas、Kathryn Tanner）在与分析哲学传统对话方面走得最远，主要借鉴**后期维特根斯坦**（《哲学研究》），而非以弗雷格、罗素为代表的分析哲学主流所继承的早期维特根斯坦（《逻辑哲学论》）；宗教哲学家如 Richard Swinburne（后皈依东正教）则为分析式宗教哲学的典范。
    source: 'St. Vladimir Theological Quarterly Vol. 47 Issue 2 (2003) (archive.org) — 分析哲学与大陆哲学在神学中的体现'
  - title: 伊斯兰 — 逊尼什叶与四大教法学派
    body: |
      逊尼派与什叶派的分歧源于先知穆罕默德去世后**继承人问题**：多数人主张推选领导人（逊尼），另一些追随先知堂弟兼女婿阿里（什叶）。680年阿里之子侯赛因于卡尔巴拉遇难；第六任伊玛目贾法尔·萨迪克（卒765）的教义成为什叶**贾法里学派**的基础。
      逊尼派教法学派初期多达数百，至11世纪定型为**四大教法学派**：哈乃斐派（艾布·哈尼法，8世纪中叶，重类比推理「意见派」，奥斯曼帝国采纳，信众最多）、马立克派（马立克《穆宛塔》，重麦地那传统与公益）、沙斐仪派（兼采两长，确立四大法源：古兰/圣训/类比/公议）、罕百里派（重经典圣训，沙特主流）。
      什叶派教法学分**阿赫巴尔学派**与**乌苏勒学派**（现居主导，重当代权威教法学家决断）。
    source: '维基百科「伊斯兰教法学」(zh.wikipedia.org) · 教法史 (baike.baidu.com)'
  - title: 印度教 — 六派哲学与不二论
    body: |
      印度古代哲学按对待吠陀权威的态度分**正统派与非正统派**（异流三派：顺世论、耆那教、佛教）。尊奉吠陀的**六派哲学**：
      ①数论派（迦毗罗，《数论颂》——神我Purusha与自性Prakriti二原理）②瑜伽派（巴丹阇梨《瑜伽经》）③正理派（乔达摩《正理经》，重逻辑）④胜论派（羯那陀《胜论经》，六句义）⑤弥曼差派（耆米尼《弥曼差经》，重祭祀）⑥吠檀多派（巴达罗耶那《梵经》，「梵我一元论」，印度哲学主流）。
      **商羯罗**复兴吠檀多**不二论**：「梵我不二」——事物与梵不二，梵的幻力（无明）使人执差别，消除无明即解脱。
    source: '姚卫群编译《古印度六派哲学经典》(商务印书馆2003) · 木村泰贤《印度六派哲学》(2022中译本)'

- id: academic
  title: 学术与哲学流派的判教
  icon: 🎓
  intro: |
    学术界同样有自己的「判教」：司马谈六家、汉志九流是其古典形态；现代则有分析哲学与大陆哲学的分野、1923年科玄论战、库恩的「范式」之争。
  topics:
  - title: 分析哲学与大陆哲学的分野
    body: |
      20世纪哲学最大的「判教」是**分析哲学**与**大陆哲学**的分野。有中国学者将其放大为世界三种文化、三种哲学的划分：西方思维是分析思维→**分析哲学**；印度和阿拉伯思维是辩证思维→**宗教哲学**（与宗教传统紧密相连）；中国思维是综合思维→（被称）模糊哲学。该说主张中国哲学应汲取分析哲学之长以弥补分析思维的不足，同时汲取宗教哲学之长以弥补精神信仰的不足。
    source: '《中国哲学向何处去？——兼论世界三种文化、三种哲学》(河北学刊 2007年06期, cnki)'
  - title: 科玄论战（1923）— 科学主义的判教
    body: |
      1923年2月张君劢清华演讲《人生观》，提出科学与人生观**五点差异**（客观/主观、推理/直觉、分析/综合、因果律/自由意志、想象统一/人格单一），结论「科学无论如何发达，而人生观问题之解决，决非科学所能为力」。
      丁文江在《努力周报》发表《玄学与科学——评张君劢的〈人生观〉》，斥其为「玄学鬼」附身。论战形成**科学派**（丁文江、胡适、吴稚晖）、**玄学派**（张君劢、梁启超、张东荪）、**唯物史观派**（陈独秀、瞿秋白）三大阵营；1918年梁启超《欧游心影录》「科学万能之梦」的反思是玄学派的思想背景。
      刘钝（2023）指出：今日中国思想界三种主要思潮——马克思主义、自由主义、文化保守主义——在科玄论战中均可觅到踪影。
    source: '林毓生《民初「科学主义」的兴起与含意》(aisixiang.com) · 刘钝《「科玄论战」百年：回顾与展望》(ucas.edu.cn 2023) · 维基文库《丁文江的传记·〈玄学与科学〉的论争(1923)》'
  - title: 库恩「范式」— 科学界的判教模型
    body: |
      库恩1962年《科学革命的结构》创立**历史主义学派**，提出「**范式**」转换理论：科学共同体遵循「前科学—常规科学—危机—革命—新的常规科学」的周期性结构；科学革命本质是「范式转换」。
      **不可通约性**：不同范式下的科学语言无法完全互译（库恩强调「不可通约不是不可比」）。
      批判方：波普尔（《常规科学及其危险》，抨击其相对主义）、拉卡托斯（「不可能有什么逻辑，只有发现的心理学」）、沃特金斯（科学共同体「类似宗教团体」）——1965年伦敦国际科学哲学研讨会为集中爆发点。拉卡托斯另立「**科学研究纲领**」（硬核、保护带、启示规则）以保留科学的合理性。
    source: '方在庆《库恩的身份认同——纪念〈科学革命的结构〉问世50周年》(philosophychina.cssn.cn) · 历史主义学派条目 (baike.baidu.com)'

- id: tech
  title: 科技圈的判教 — 范式与路线之争
  icon: 🔭
  intro: |
    科技圈的分派与互判同样激烈：量子力学诠释之争、量子引力三大路线之争、AI三大学派之争——各自有「本体论立场」与「究竟方案」，与判教结构高度同构。
  topics:
  - title: 玻尔与爱因斯坦 — 量子诠释之争
    body: |
      爱因斯坦与玻尔围绕量子力学展开**三次论战**（测不准原理两次 + EPR）。1935年EPR论文借复合系统思想实验论证量子力学「并不为物理实在提供一个完全的描述」；玻尔在35天后即致信《自然》并以同标题发文回应，说明EPR所提问题是一切量子现象所共有。
      李田（2011）指出：爱因斯坦—玻尔之争是20世纪物理学史经典案例——「重大科学革命的科学争论背后必定是最根本的哲学问题之争」。
      当代诠释分裂更甚：范·弗拉森模态诠释、Fuchs的QBism、哥本哈根诠释、多世界诠释并存，量子信息学家Adán Cabello称诠释争论领域为「**疯狂地图**」（a map of madness）。
    source: '李田《科学争论中的逻辑推理——量子革命中的爱因斯坦-玻尔论战》(《自然辩证法研究》2011) · arXiv:2101.00255 Bohr’s Anti-Realist Realism (ar5iv.labs.arxiv.org)'
  - title: 量子引力三大路线 — 三种世界观
    body: |
      量子引力竞争的三大路径：**弦理论**（高维几何框架——「几何本体论」）、**圈量子引力**（自旋网络方案——「关系本体论」）、**信息基础论**（量子信息编码——「信息本体论」）。
      该研究认为：量子引力理论的竞争「本质上是三种世界观之争」，各路线表面上互不相容，但「可能各自捕获了真理的不同侧面」——多元竞争最终或走向统一；并展望「时空本身作为计算资源」的可能性。
    source: '《第五章：引力理论的未来图景——黑洞信息悖论与量子引力：万物理论的前哨战》(aiknowledge.cn)'
  - title: AI三大学派 — 符号·连接·行为
    body: |
      人工智能学界形成**三大学派**：「符号主义研究抽象思维，连接主义研究形象思维，行为主义研究感知思维」。
      • **符号主义**（智能即程序）：源于数理逻辑；西蒙、麦卡锡、纽厄尔、费根鲍姆；里程碑：LT逻辑理论机（1956）→专家系统DENTRAL（1968）→「深蓝」战胜卡斯帕罗夫（1997）；长期主导AI。
      • **连接主义**（智能即仿生）：源于仿生学；术语由赫布1940年代提出；里程碑：MP模型（1943）→感知机（1957）→反向传播（1986）→辛顿深度信念网络（2006）→深度学习；DeepSeek（2024）降低成本。
      • **行为主义**（智能即控制）：源于40-50年代控制论；重感知与行动，不需知识表示；代表：布鲁克斯六足行走机器人；影响强化学习。
      三派形成是还原论「分而治之」的结果（仿功能→符号主义，仿结构→连接主义，仿行为→行为主义）；当前趋势是**三派深度融合**（ChatGPT、Sora、DeepSeek推动感知→认知、专用→通用）。
    source: '《人工智能三大学派的理论分野》(中国社会科学报 2025-05-22, cssn.cn)'

- id: masters
  title: 海云·成观两位法师的阐释与评述
  icon: 🌊
  intro: |
    两位法师分属贤首宗第四十二世（海云继梦，贤首兼慈恩宗高原法系）与贤首兼慈恩宗第四十二世（成观法师，天台出家·东密阿阇梨·曹洞传人），对判教互判议题各有系统的宗内评述。
  topics:
  - title: 海云法师：空有性在华严判教中的位置
    body: |
      《四十华严讲记》第12讲：唯识／法相宗＝大乘始教（修真空观）；性宗＝大乘终教、真性宗＝大乘顿教（理事无碍观）；华严本宗＝法界宗（周遍含容观）。
      华严的包容性相当大，但从批判的角度看，要求又极为严格。
    source: '海云继梦《四十华严讲记》第一卷 第12讲 (fjdh.cn)'
  - title: 海云法师：唯识与唯性的判摄总纲
    body: |
      「唯识」研究**缘起法界**（如《地藏经》「起心动念无不是业无不是罪」），法印苦空无常无我，目标寂灭涅槃；「唯性」契**性起法界**，破一分无明证一分法身，目标常乐我净，涅槃后依体起用饶益众生。
      修行必须「转唯识成唯性」——苦空无常无我只是达到常乐我净的媒介和过渡。
    source: '海云继梦《菩萨问明品讲记》第二章 (wuming.xuefo.net)'
  - title: 海云法师：语言模式论
    body: |
      《华严金狮子章讲记》第十一：「法相宗有法相宗的语言模式，法性宗有法性宗的语言模式，**空宗有空宗的语言模式，性宗有性宗的语言模式**」，须透过华严宗的语言模式才能了解华严论文背后的整个状态。
      本体层层递进：金性是本体→空性是本体→空性、佛性、法性皆本体则空性又成相。以六相圆融看世间即转「法界」，本来寂灭，一真法界。
    source: '海云继梦《华严金狮子章讲记》第十一 (wuming.xuefo.net: http://wuming.xuefo.net/nr/7/70462.html)'
  - title: 海云法师：一佛乘的现代判摄
    body: |
      修行四阶次：小乘（出离心/出离道）→ 中乘（缘觉）→ 菩萨乘（波罗蜜乘）→ **普贤乘**（华严不共别圆，最高）。
      共同圆教只强调到菩萨行；不共别圆强调普贤行、普贤心、普贤乘——「不可思议的解脱境界」，与三乘完全无关。
    source: '海云继梦《三圣圆融观》 (fjdh.cn)'
  - title: 成观法师：性相不二、诸宗圆融
    body: |
      • 性相二宗如鸟之双翼，相辅相成；《起信论》是「小本的《楞伽经》」，性相圆融；
      • 解深密经、华严经、密严经、楞伽经四部皆是「性相圆融」经典，且同为显密二教所共尊；
      • 达摩以《楞伽经》印心（六祖始改为《金刚经》），禅宗正法眼藏原本「性相不分、显密不分」；后世分门修学是因众生根器转钝，「**并非法本有分派，而实系人根转浅所致**」；
      • 性相融会即「如来知见」——学性者不解相、学相者不了性是学佛最大难题之一；「执摸象之解」而自是非他、互相攻讦者「即是迷人，枉受辛勤，不入正理」。
    source: '成观法师《八识规矩颂义贯》相宗系列总序 (fjdh.cn) · 《楞伽阿跋多罗宝经义贯》卷第二 (fjdh.cn)'
  - title: 成观法师：末法退化史观
    body: |
      成观法师《天台小止观讲解》判各宗退化：
      • 禅宗：达摩依《楞伽》印心→五祖《金刚经》→唐宋参公案→宋末参话头→明清沦为「口头禅」（耍口头禅者为「禅和子」）；
      • 密教：唐密仪轨散佚「只剩下几个法，而且都是没有完全的仪轨」，只剩咒乃至印；
      • 净土：慧远大师修念佛三昧、般舟三昧、十六观，非散心念佛可成；「法就越来越少、越来越简化，然后简化到法几乎都没有了叫做末法」。
    source: '成观法师《天台小止观讲解》第三十八集 (wuming.xuefo.com: http://wuming.xuefo.com/nr/6/61435.html)'
  - title: 成观法师：译经宏愿与护法事业
    body: |
      成观法师（1947-，台北人）1988年依天台宗第45代显明老和尚出家，1996年获日本高野山真言宗第53世阿阇梨位，2010年承贤首宗兼慈恩宗第四十二世法脉，另具曹洞宗传承；1991年创办台北大毘卢寺，主修禅密，推行汉传东密。
      任「楞严座主、法华译主、华严译主」，建「新逍遥园译经院」将华严、法华等经译为英文——「唯有广译英文、存于世界各地，方能使佛陀正法的传承长久住世」。
    source: '百度百科「成观法师」 · 成观法师《天台小止观讲解》第三十八集'

references:
  - '智顗《法华玄义》· 灌顶《天台八教大意》· 湛然《法华玄义释签》· 谛观《天台四教仪》· 吉藏《三论玄义》 (CBETA)'
