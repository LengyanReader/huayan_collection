sections:
- id: overview
  title: 判教互判总论
  title_en: Overview of Doctrinal Classification and Mutual Critique
  icon: ⚖️
  intro: |
    判教（教相判释）是各大传统内部自我定位与互相评判的普遍现象：将全部教法（或学说）组织为有次第的体系，确立本宗所依经典/文本的最高地位，并为修行（实践）提供「地图」。
    佛教判教最成体系；儒、道、耶、回、印度教、学术界与科技圈各有同构的「判教」现象。本页逐一梳理各系统判教的立场、思想、修行定位、义学定位、判教依据及其源流演变。
  intro_en: |
    Doctrinal classification (jiaoxiang panjiao — 教相判释) is a universal phenomenon across major traditions: organizing all teachings (or doctrines) into a hierarchical system, establishing the supreme authority of the canonical texts relied upon by one's own school, and providing practitioners with a "map."
    Buddhist doctrinal classification is the most systematic; Confucianism, Daoism, Christianity, Islam, Hinduism, academia, and the technology sector each display structurally analogous phenomena. This page systematically examines the positions, philosophical orientations, practical and scholarly assessments, classification criteria, and historical evolution of each system.
  topics:
  - title: 判教的性质与双重功能
    title_en: The Nature and Dual Function of Doctrinal Classification
    body: |
      「判教」即**教相判释**：按义理高下深浅、说法先后次序，把浩繁的经教组织成一个有结构、有次第的体系。
      其功能有二：①**义学定位**——确立本宗所依经典的了义地位；②**修行定位**——判摄的次第即修行的地图。各宗判教本质上都是为了确立本宗所依经典的最高地位（唯吉藏以「诸经平等」的「无所得」立场为异数）。
      南北朝涅槃师判教「为中国佛教开创了判教这一极其重要的方法论，后来成为中国佛教教理思想建构的基本方法论」。
    en_body: |
      "Doctrinal classification" (panjiao) refers to jiaoxiang panjiao (教相判释): organizing the vast body of sutra teachings into a structured, hierarchical system according to the depth and subtlety of their doctrinal content and the chronological order of their proclamation.
      Its functions are twofold: (1) doctrinal positioning — establishing the definitive authority (nītārtha) of the canonical texts relied upon by one's own school; and (2) practical positioning — the hierarchy of classification serves as a map for cultivation. All schools' classifications essentially aim to establish the supreme authority of their own canonical texts (with Jizang as the sole exception, adopting the "equality of all suttas" standpoint of "non-attainment").
      The Nirvāṇa masters of the Northern and Southern Dynasties "established doctrinal classification for Chinese Buddhism as an extremely important methodology, which later became the fundamental methodology for the construction of Chinese Buddhist doctrinal thought."
    source: '王仲尧《南北朝涅槃师的判教及其价值意义》(佛光山人间佛教研究院 fgsihb.org) · 《吉藏大师判教思想之研究》(中国佛学院《法源》总第20期 2002)'
  - title: 三系判教的三大经典范式
    title_en: Three Classical Paradigms of Doctrinal Classification
    body: |
      **宗密《禅源诸诠集都序》三种教**（与禅三宗一一配对，总会为一味）：
      • 密意依性说相教（法相唯识＝有宗）↔ 息妄修心宗
      • 密意破相显性教（般若中观＝空宗）↔ 泯绝无寄宗
      • 显示真心即性教（如来藏＝性宗）↔ 直显心性宗
      **印顺《印度之佛教》(1942) 大乘三系**：性空唯名论（龙树）·虚妄唯识论（无著世亲）·真常唯心论（楞伽·密严·涅槃·金光明系）
      **太虚三宗**：法性空慧宗 · 法相唯识宗 · 法界圆觉宗（天台·华严·禅）
    en_body: |
      **Zongmi's "Three Teachings"** in the *Preface to the Complete Collection of Chan Sources* (corresponding one-to-one with the three Chan lineages, ultimately converging into one taste):
      - Teachings expounding phenomena through hidden meaning (Dharmalakṣaṇa (Consciousness-Only) = Existence school) ↔ The lineage of stilling delusions and cultivating the mind
      - Teachings revealing nature through breaking phenomena via hidden meaning (Prajñā (Mādhyamaka) = Emptiness school) ↔ The lineage of extinguishing all conceptual fixation
      - Teachings directly revealing the true mind as one's intrinsic nature (Tathāgatagarbha = Nature school) ↔ The lineage of directly manifesting mind-nature
      **Yinshun's *Buddhism in India* (1942) — Three Mahāyāna systems**: Emptiness-only-nominalism (Nāgārjuna) · Delusion-only-consciousness (Asaṅga and Vasubandhu) · Eternal-mind-only (Laṅkāvatāra, Guhyasamāja, Nirvāṇa, and Suvarṇaprabhāsa tradition)
      **Taixu's Three Lineages**: Dharmadhātu Prajñā lineage · Dharmalakṣaṇa Consciousness-Only lineage · Dharmadhātu Perfect Enlightenment lineage (Tiantai · Huayan · Chan)
    source: '宗密《禅源诸诠集都序》(T48n2015) · 印顺《印度之佛教》(正闻学社1943; 中华书局2011) · 太虚《佛法总抉择谈》《论大乘三宗》'
  - title: 三系对照表
    title_en: Comparative Table of the Three Systems
    body: |
      | 系 | 代表经论 | 核心命题 | 判教位置（法藏五教十宗） |
      | --- | --- | --- | --- |
      | 空宗 | 般若经·《中论》 | 缘起性空·八不中道 | 大乘始教（空始教）·一切皆空宗 |
      | 有宗 | 解深密经·瑜伽师地论·成唯识论 | 万法唯识·三性三无性 | 大乘始教（相始教）·说相教 |
      | 性宗 | 楞伽·密严·涅槃·起信论 | 真如缘起·如来藏·性起 | 终教·真德不空宗；顿教·相想俱绝宗 |
      | 圆教 | 《华严经》 | 事事无碍·主伴具足 | 一乘圆教·圆明具德宗（不共别圆） |
    en_body: |
      | System | Representative Sūtras and Śāstras | Core Thesis | Position in Fazang's Five Teachings and Ten Lineages |
      | --- | --- | --- | --- |
      | Emptiness | Prajñāpāramitā · *Mūlamadhyamakakārikā* | Dependent origination, emptiness of nature · Eight negations, Middle Way | Mahāyāna Initial Teaching (Emptiness) · All-Empty Lineage |
      | Existence | *Saṃdhinirmocana Sūtra* · *Yogācārabhūmi* · *Cheng Weishi Lun* | All phenomena are consciousness-only · Three natures, three non-natures | Mahāyāna Initial Teaching (Phenomena) · Expository Teaching |
      | Nature | Laṅkāvatāra · Guhyasamāja · Nirvāṇa · *Treatise on Awakening of Faith* | True suchness origination · Tathāgatagarbha · Nature arising | Complete Teaching · True Virtue Non-Emptiness Lineage; Sudden Teaching · Phenomena and Thought Both Extinguished Lineage |
      | Perfect | *Avataṃsaka Sūtra* | Interpenetration of all phenomena · Sovereign and retinue, complete | One Vehicle Perfect Teaching · Luminous Virtue Complete Lineage |
    source: '法藏《华严一乘教义分齐章》(T45n1866) 五教十宗 · 宗密《禅源诸诠集都序》'

- id: nanbei
  title: 判教前史 · 南三北七
  title_en: "Prehistory of Doctrinal Classification: Three Southern and Seven Northern Schools"
  icon: 🌱
  intro: |
    判教非隋唐宗派才有：其嚆矢在北凉昙无谶译《涅槃经》的「五味」比喻，经竺道生、慧观、刘虬等南北朝涅槃师的发展，形成「南三北七」十家判教，天台智者大师在《法华玄义》中总括并超越之。
  intro_en: |
    Doctrinal classification did not originate with the Sui-Tang schools: its earliest harbinger was the "five flavors" metaphor in Dharmakṣema's translation of the *Nirvāṇa Sūtra*, developed through the efforts of Zhu Daosheng, Huiguan, Liu Qiu, and other Northern and Southern Dynasties Nirvāṇa masters, eventually forming the "Three Southern and Seven Northern" ten schools of classification, which Tiantai's Master Zhiyi comprehended and surpassed in the *Profound Meaning of the Lotus Sūtra*.
  topics:
  - title: 嚆矢：昙无谶与竺道生
    title_en: "The Harbinger: Dharmakṣema and Zhu Daosheng"
    body: |
      据汤用彤等研究，判教活动**创始于北凉昙无谶**（385-433）：所译《大般涅槃经》卷十四以「从牛出乳、从乳出酪、从酪出生酥、从生酥出熟酥、从熟酥出醍醐」比喻教义高下深浅，树立教相判释之嚆矢。
      其后**竺道生**就如来说法立「善净、方便、真实、无余」**四法轮**之别，并唱导顿悟成佛。
    en_body: |
      According to Tang Yongtong and other scholars, doctrinal classification was **initiated by Dharmakṣema of Northern Liang** (385-433): his translation of the *Mahāparinirvāṇa Sūtra* (chapter 14) used the metaphor of "milk from the cow, curds from milk, butter from curds, fresh butter from butter, and ghee from fresh butter" to illustrate the varying depths of the teachings, establishing the harbinger of doctrinal classification.
      Subsequently, **Zhu Daosheng** established **Four Dharmacakras** for the Buddha's teaching — pure, expedient, true, and residual — and advocated the doctrine of sudden enlightenment.
    source: '汤用彤《汉魏两晋南北朝佛教史》 · 韩焕忠《华严判教论》(齐鲁书社)'
  - title: 慧观「二教五时」— 体系化判教之始
    title_en: Huiguan's "Two Teachings, Five Periods" — The Beginning of Systematic Classification
    body: |
      刘宋**慧观**（鸠摩罗什高足，曾参与修治南本《涅槃经》）立「**二教五时**」：
      • **顿教**：《华严经》；
      • **渐教**五时：①有相教（阿含）②无相教（般若）③抑扬教（维摩·思益，抑声闻扬菩萨）④同归教（法华，开三显一）⑤常住教（涅槃，佛身常住）。
      蓝日昌指出其划时代意义：**首次确立大、小乘经教之分**——此后判教与佛典目录编制基本都按此体系归纳区分。
    en_body: |
      **Huiguan** of the Liu Song dynasty (a chief disciple of Kumārajīva who participated in editing the southern recension of the *Nirvāṇa Sūtra*) established the **"Two Teachings, Five Periods"**:
      - **Sudden Teaching**: the *Avataṃsaka Sūtra*;
      - **Gradual Teaching** in five periods: (1) Teaching of Characteristics (*Āgama*), (2) Teaching of Emptiness (Prajñā), (3) Teaching of Elevation and Diminishment (*Vimalakīrti* · *Ratnamegha* — diminishing Śrāvakas, elevating Bodhisattvas), (4) Convergence Teaching (*Lotus Sūtra* — revealing the one through opening the three), (5) Eternity Teaching (*Nirvāṇa* — the eternal Buddha-body).
      Lan Richang noted its epochal significance: it **first established the distinction between Mahāyāna and Hīnayāna sūra teachings** — henceforth doctrinal classification and cataloguing of Buddhist scriptures were largely organized according to this system.
    source: '韩焕忠《华严判教论》 · 蓝日昌《慧观判教观研究》 · 《高僧传》卷七'
  - title: 刘虬「五时七阶」
    title_en: Liu Qiu's "Five Periods, Seven Stages"
    body: |
      南齐隐士**刘虬**（437-495）在慧观五时基础上**增添人天教**：人天教→有相教→无相教→同归教→常住教（据隋慧远《大乘义章》记载）；又依《无量义经》序以「七阶」判经典关系。
      慧观与刘虬被视为**江南最早的判教家**，但其判教尚属对诸经外形的分类，未达内容的化法层面。
    en_body: |
      The Southern Qi recluse **Liu Qiu** (437-495) **added the Human-Deva Teaching** to Huiguan's five periods: Human-Devas → Teaching of Characteristics → Teaching of Emptiness → Convergence Teaching → Eternity Teaching (according to Sui Huiyuan's *Comprehensive Treatise on Mahāyāna*); he also used the "seven stages" from the preface to the *Sūtra of Infinite Meanings* to classify the relationships among scriptures.
      Huiguan and Liu Qiu are regarded as **the earliest doctrinal classifiers south of the Yangtze**, but their classifications still pertained to the external form of the suttas and did not reach the level of content-based dharmic transformation.
    source: '隋·净影慧远《大乘义章》 · 圣凯法师《地论学派的判教思想与南朝佛教》(fjdh.cn)'
  - title: 「南三北七」十家
    title_en: The "Three Southern, Seven Northern" Ten Schools
    body: |
      智顗《法华玄义》总括南北朝判教为「**南三北七**」十家（「南三北七，义成百家」）：
      **江南三家**（顿渐不定三教判）：①虎丘岌法师——有相、无相、常住三时；②宗爱法师——有相、无相、同归、常住四时；③僧柔、慧次承慧观——五时。
      **江北七家**：①刘虬五时；②菩提流支——半字教与满字教；③佛陀三藏、光统律师（慧光）——因缘、假名、诳相、常四宗；④自轨法师——加「法界宗」为五宗；⑤安廪法师——因缘、假名、诳相、真、常、圆六宗；⑥北地某禅师——有相、无相二种大乘；⑦鸠摩罗什——一音教。
      王仲尧指出：南方三家及北方刘虬一家**都属于涅槃师系统的判教**。
    en_body: |
      Zhiyi's *Profound Meaning of the Lotus Sūtra* comprehended the Northern and Southern Dynasties classifications as the **"Three Southern, Seven Northern"** ten schools ("Three Southern and Seven Northern — their meanings become a hundred schools"):
      **Three Jiangnan schools** (sudden, gradual, indeterminate — three-doctrine classification): (1) Master Ji of Huqiu — three periods: characteristics, emptiness, eternity; (2) Master Zong'ai — four periods: characteristics, emptiness, convergence, eternity; (3) Sengrou and Huiji continuing Huiguan — five periods.
      **Seven Jiangbei schools**: (1) Liu Qiu's five periods; (2) Bodhiruci — half-word and full-word teachings; (3) Buddhasena and Lawyer Guangtong (Huiguang) — four lineages: conditionality,假名, illusion, eternity; (4) Master Zigui — added "Dharmadhātu lineage" for five lineages; (5) Master Anlin — six lineages; (6) A northern Chan master — two Mahāyānas: characteristics and emptiness; (7) Kumārajīva — the One-Sound Teaching.
      Wang Zhongyao noted that the three southern schools and Liu Qiu's school all **belong to the Nirvāṇa master system of doctrinal classification**.
    source: '智顗《法华玄义》卷十「南三北七」 · 王仲尧《南北朝涅槃师的判教及其价值意义》(fgsihb.org)'

- id: tiantai
  title: 天台五时八教
  title_en: Tiantai's Five Periods and Eight Teachings
  icon: 🌸
  intro: |
    天台智者大师综贯「南三北七」而超越之，以《法华经》为中心建立判教体系。注意学术史考证：「五时八教」完整表述非智顗一人一次提出，而是经灌顶、湛然、谛观历代祖师逐步定型。
  intro_en: |
    Tiantai's Master Zhizhe comprehended and surpassed the "Three Southern and Seven Northern" schools, establishing a classification system centered on the *Lotus Sūtra*. Scholarly research shows: the complete formulation of "Five Periods and Eight Teachings" was not proposed by Zhiyi alone at once, but was gradually crystallized through successive patriarchs including Guanding,湛然, and Diiguan.
  topics:
  - title: 五时 — 佛说法的时序
    title_en: The Five Periods — Chronological Order of the Buddha's Teaching
    body: |
      依《涅槃经·圣行品》「五味相生」（乳→酪→生酥→熟酥→醍醐）分佛一生说法为**五时**：
      ①华严时（如日出先照高山·乳）②阿含时（鹿苑说四谛十二因缘·酪）③方等时（维摩·思益·楞伽·胜鬘，弹偏折小叹大褒圆·生酥）④般若时（般若系·熟酥）⑤法华涅槃时（如日轮当午·醍醐，最高最圆满）。
    en_body: |
      Based on the "five flavors arising in succession" (milk → curds → fresh butter → mature butter → ghee) from the *Nirvāṇa Sūtra*'s "Chapter on the Noble Path," the Buddha's lifetime of teaching is divided into **Five Periods**:
      (1) Avataṃsaka Period (like sunrise first illuminating high mountains · milk); (2) Āgama Period (preaching the Four Noble Truths and Twelve Links at the Deer Park · curds); (3) Vaipulya Period (*Vimalakīrti* · *Ratnamegha* · *Laṅkāvatāra* · *Śrīmālā* — diminishing the partial, converting the small, praising the great, exalting the perfect · fresh butter); (4) Prajñā Period (Prajñā literature · mature butter); (5) Lotus-Nirvāṇa Period (like the sun at zenith · ghee — the highest and most perfect).
    source: '智顗《法华玄义》 · 谛观《天台四教仪》五味相生配对'
  - title: 化仪四教与化法四教
    title_en: Four Transformative Modes and Four Transformative Contents
    body: |
      **化仪四教**（说法形式，「譬如药方」）：**顿、渐、秘密、不定**。「秘密」教为智顗首创——他在南北朝通行「顿渐不定」之外增加「显—密」范畴。
      **化法四教**（说法内容，「譬如药味」）：**藏、通、别、圆**。藏教（小乘三藏·析空观）→通教（体空观，通前通后）→别教（界外独菩萨法·次第观）→圆教（圆妙圆满圆足圆顿·一心三观）。
    en_body: |
      **Four Transformative Modes** (mode of proclamation, "like a prescription"): **Sudden, Gradual, Secret, and Indeterminate**. The "Secret" teaching was Zhiyi's innovation — he added the category of "manifest-secret" beyond the commonly accepted "sudden-gradual-indeterminate" framework of the Northern and Southern Dynasties.
      **Four Transformative Contents** (content of proclamation, "like medicinal ingredients"): **Hīnayāna, Shared, Distinctive, and Perfect**. Hīnayāna (Śrāvaka Tripiṭaka · analytical emptiness) → Shared (experiential emptiness, bridging earlier and later) → Distinctive (exclusively Bodhisattva dharma beyond the realms · sequential contemplation) → Perfect (subtly wondrous, complete, perfect in fullness, sudden · single-mind triple contemplation).
    source: '智顗《法华玄义》 · 灌顶《天台八教大意》 · 李四龙《略论智顗的「秘教」思想》(philosophy.org.cn)'
  - title: 三种教相 — 判教大纲
    title_en: Three Doctrinal Aspects — The Framework of Classification
    body: |
      智顗《法华玄义》卷一上立「**三种教相**」为判教大纲：①根性融不融相（根机）②化导始终不始终相（佛意）③师弟远近不远近相（本迹）——从三方面论证《法华》殊胜：前四时为权，唯法华开权显实、废权立实、「纯圆独妙」。
    en_body: |
      Zhiyi's *Profound Meaning of the Lotus Sūtra* (chapter 1) establishes **"Three Doctrinal Aspects"** as the framework for classification: (1) whether the root-capacities converge or not (capacity); (2) whether the transformation is complete or not throughout (the Buddha's intention); (3) whether the distance between teacher and disciple is remote or near (original manifestation) — arguing from three perspectives for the supremacy of the *Lotus Sūtra*: the prior four periods are provisional, and only the *Lotus* opens the provisional to reveal the true, discards the provisional to establish the true, "purely perfect, uniquely wondrous."
    source: '智顗《法华玄义》卷一 · 圣严法师《天台心钥——教观纲宗贯注》(ddc.shengyen.org)'
  - title: 演变：从三教相到「五时八教」定型
    title_en: "Evolution: From Three Aspects to the Crystallization of Five Periods and Eight Teachings"
    body: |
      学术史考证：智顗原本判教着重「三种教相」，说法形式只有**顿、渐、不定**三教；「秘密」为智顗首创。
      → 弟子**灌顶**《天台八教大意》明确区分化仪/化法；
      → 九祖**湛然**《法华玄义释签》始有「五时八教」连称；
      → 高丽**谛观**《天台四教仪》将五时与五味、化仪一一相配，宣称「天台智者大师，以五时八教，判释东流一代圣教，罄无不尽」——自此成为天台判教基本框架。
      「若将完整的『五时八教』说直接视为智顗原本的判教思想，则显然是一种误会。」
    en_body: |
      Scholarly research shows: Zhiyi's original classification focused on the "Three Doctrinal Aspects," with only **Sudden, Gradual, and Indeterminate** as modes of proclamation; "Secret" was Zhiyi's innovation.
      → His disciple **Guanding**'s *Essentials of the Eight Teachings of Tiantai* clearly distinguished modes from contents;
      → Ninth patriarch **Zhanran**'s *Commentary on the Profound Meaning of the Lotus Sūtra* first used the combined phrase "Five Periods and Eight Teachings";
      → Goryeo's **Diiguan**'s *Tiantai Four Teachings Manual* matched each of the Five Periods with the Five Flavors and the Transformative Modes, declaring: "Master Zhizhi of Tiantai used the Five Periods and Eight Teachings to classify and interpret the entire body of teachings transmitted eastward, leaving nothing unaccounted for" — henceforth becoming the basic framework of Tiantai classification.
      "To take the complete 'Five Periods and Eight Teachings' formulation directly as Zhiyi's original doctrinal classification would clearly be a misunderstanding."
    source: '天台宗判教演变研究 (检索考证) · 谛观《天台四教仪》'

- id: madhyamaka
  title: 空宗·三论 — 二藏三轮
  title_en: "Emptiness School (Three Treatises): Two Collections and Three Rotations"
  icon: 🌌
  intro: |
    三论宗吉藏以「无所得」立场判教：破五时说而立二藏，会三乘而归法华。与诸宗「抬高本宗」不同，吉藏强调「诸经平等」——判教是破执的工具而非立宗的手段。
  intro_en: |
    Jizang of the Three Treatises school classified teachings from the standpoint of "non-attainment": refuting the five-period theory while establishing two collections, converging the three vehicles into the *Lotus Sūtra*. Unlike other schools that elevated their own canon, Jizang emphasized the "equality of all suttas" — doctrinal classification as a tool for breaking attachment, not a means of establishing a school.
  topics:
  - title: 二藏 — 破五时之说
    title_en: Two Collections — Refuting the Five-Period Theory
    body: |
      吉藏（549-623，嘉祥大师）继承罗什、僧肇、法朗一系，对慧观「五时」判教持批判态度：「**但应立大小二教，不应制于五时**」。
      **二藏**：声闻藏（小乘）与菩萨藏（大乘），亦称半字教/满字教；吉藏引《大品经》《法华经》《涅槃经》三经及《智度论》《地持论》《正观论》三论为据，论证经论中只有二藏而没有五时。
    en_body: |
      Jizang (549-623, Master Jiaxiang), inheriting the lineage of Kumārajīva, Sengzhao, and Falang, was critical of Huiguan's five-period classification: "**One should only establish two teachings — Hīnayāna and Mahāyāna — not restrict classification to five periods**."
      **Two Collections**: the Śrāvaka Collection (Hīnayāna) and the Bodhisattva Collection (Mahāyāna), also called half-word and full-word teachings; Jizang cited the *Prajñāpāramitā*, *Lotus*, and *Nirvāṇa* sūtras along with the *Treatise on the Perfection of Wisdom*, *Bodhisattva Ground*, and *Correct Contemplation* as evidence that the scriptures contain only two collections and not five periods.
    source: '吉藏《三论玄义》 · 《吉藏大师判教思想之研究》(中国佛学院《法源》总第20期)'
  - title: 三轮 — 法华会归的结构
    title_en: Three Rotations — The Structure of the Lotus Convergence
    body: |
      **三轮**（三法轮）：①**根本法轮**——佛初成道华严会上说《华严经》（一因一果）；②**枝末法轮**——《华严》后《法华》前，因薄福钝根众生不堪一乘，故「于一佛乘分别说三」的一切大小乘经；③**摄末归本法轮**——《法华经》会三归一。
      按此判摄《般若》当属枝末，但吉藏认为般若属大乘，仍归根本法轮。三论宗实以**二藏为主、三轮为辅**。
    en_body: |
      **Three Rotations** (three dharmacakras): (1) **Root Dharmakra** — upon first attaining enlightenment, the Buddha preached the *Avataṃsaka Sūtra* at the Avataṃsaka assembly (one cause, one fruition); (2) **Branch Dharmakra** — after the *Avataṃsaka* but before the *Lotus*, when beings of shallow blessings and dull faculties could not bear the One Vehicle, so "within the One Buddha Vehicle the three were distinguished" — all Hīnayāna and Mahāyāna sūtras in between; (3) **Gathering-Back-to-Root Dharmakra** — the *Lotus Sūtra* converging the three into one.
      By this classification, the *Prajñā* should fall under the branch rotation, but Jizang held that Prajñā belongs to Mahāyāna and should therefore remain in the root rotation. The Three Treatises school in practice placed **two collections as primary and three rotations as supplementary**.
    source: '吉藏《三论玄义》 · 佛光大辞典「三轮教」词条 (fodian.cc)'
  - title: 「诸经平等」的无所得立场
    title_en: The "Equality of All Suttas" — The Standpoint of Non-Attainment
    body: |
      与其他宗派抬高本宗经典不同，吉藏强调「**诸经平等**」「是法平等无有高下」，判教旨在**破斥有所得之执**，体现般若实相无所得的特色，反映隋唐佛教走向融合的趋势。
      后世华严家澄观批评吉藏三轮「**收义不尽**」：因《法华》之前亦说大乘，不可将《般若》等全判为枝末。
    en_body: |
      Unlike other schools that elevated their own canonical texts, Jizang emphasized the **"equality of all suttas"** — "this dharma is equal, without high or low" — and held that doctrinal classification aims to **break attachment to attainment**, embodying the Prajñā characteristic of non-attainment in the nature of reality, reflecting the trend toward synthesis in Sui-Tang Buddhism.
      The later Huayan master Chenguan criticized Jizang's three rotations as **"incompletely encompassing"**: since Mahāyāna was also taught before the *Lotus Sūtra*, the *Prajñā* and similar texts should not all be classified as branch rotations.
    source: '《吉藏大师判教思想之研究》(zgfxy.cn) · 澄观《华严经疏》对三轮之评'

- id: yogacara
  title: 有宗·唯识 — 三时判教
  title_en: "Existence School (Consciousness-Only): Three-Period Classification"
  icon: 🔬
  intro: |
    唯识宗依《解深密经》立「有、空、中」三时判教，以第三时中道了义为自宗依据——与天台五时、华严五教鼎足而立。
  intro_en: |
    The Consciousness-Only school established the three-period classification of "Existence, Emptiness, and Middle" based on the *Saṃdhinirmocana Sūtra*, with the Third Period's Middle Way as the definitive teaching of its own school — forming a tripartite structure alongside Tiantai's Five Periods and Huayan's Five Teachings.
  topics:
  - title: 解深密经的三时
    title_en: The Three Periods of the Saṃdhinirmocana Sūtra
    body: |
      《解深密经·无自性相品》判一代圣教为**三时**：
      ①**初时**（有教/转法轮）：鹿野苑为声闻说四谛；
      ②**二时**（空教/照法轮）：为大乘说般若诸法皆空、无自性，以「**隐密相**」说法；
      ③**三时**（中道教/持法轮）：说三性及真如不空等唯识中道，以「**显了相**」说法，遣除第二时空执，普为三乘。
    en_body: |
      The *Saṃdhinirmocana Sūtra*'s "Chapter on the Aspect of No-Own-Nature" classifies the entire body of sacred teaching into **three periods**:
      (1) **First Period** (Teaching of Existence — Turning the Dharma Wheel): at the Deer Park, preaching the Four Noble Truths to the Śrāvakas;
      (2) **Second Period** (Teaching of Emptiness — Illuminating the Dharma Wheel): preaching to the Mahāyāna that all phenomena are empty and without own-nature, through the **"implicit"** mode of exposition;
      (3) **Third Period** (Middle Way Teaching — Holding the Dharma Wheel): teaching the three natures and the non-emptiness of true suchness, the Consciousness-Only Middle Way, through the **"explicit"** mode, dispelling the attachment to emptiness of the second period, universally for all three vehicles.
    source: '《解深密经·无自性相品》(T16n0676)'
  - title: 真谛与玄奘的立说
    title_en: Paramārtha and Xuanzang's Formulations
    body: |
      三时教为**真谛、玄奘**所立：真谛依《金光明经》立转、照、持三轮（成道后七年转小乘四谛→七年后说般若明空→三十年后说《解深密》明空有）；玄奘依《解深密经》《瑜伽师地论》立同样结构。
      玄奘在印度曾亲见**戒贤与师子光**各立三时以争「了义」——《解深密经》被唯识家奉为了义之教。
    en_body: |
      The three-period teaching was established by **Paramārtha and Xuanzang**: Paramārtha, based on the *Suvarṇaprabhāsa Sūtra*, established the Turning, Illuminating, and Holding rotations (turning the Four Noble Truths of Hīnayāna seven years after enlightenment → expounding Prajñā and the nature of emptiness seven years later → teaching the *Saṃdhinirmocana* and the union of emptiness and existence thirty years later); Xuanzang, based on the *Saṃdhinirmocana Sūtra* and the *Yogācārabhūmi*, established an identical structure.
      Xuanzang personally witnessed in India how **Silābhadra and Siṃhaprabha** each established three-period systems to contest what constituted the "definitive meaning" — the *Saṃdhinirmocana Sūtra* was thus revered by the Consciousness-Only school as a teaching of definitive meaning.
    source: '中国佛学院《华严三时判教说》(zgfxy.cn) · 《大唐大慈恩寺三藏法师传》'
  - title: 法藏的评判
    title_en: Fazang's Critique
    body: |
      法藏批评玄奘及印度中观派的三时判教**未将《华严经》包摄进去**，均不圆满——此即华严宗立「五教」、以圆教《华严》为最高判摄的因由之一。
      天台智顗则以五时八教突出《法华》为纯圆之教。三宗互评表明：各宗判教本质上都是为确立本宗所依经典的最高地位。
    en_body: |
      Fazang criticized the three-period classification of Xuanzang and the Indian Mādhyamaka school for **not encompassing the *Avataṃsaka Sūtra***, rendering it incomplete — this was one of the reasons the Huayan school established the "Five Teachings" and placed the *Avataṃsaka* as the supreme Perfect Teaching.
      Tiantai's Zhiyi, on the other hand, used the Five Periods and Eight Teachings to highlight the *Lotus Sūtra* as purely perfect. The mutual evaluation of these three schools demonstrates that doctrinal classification is essentially aimed at establishing the supreme authority of one's own canonical texts.
    source: '中国佛学院《华严三时判教说》(zgfxy.cn) · 法藏《华严一乘教义分齐章》'

- id: xingzong
  title: 性宗·真常 — 直显真心
  title_en: Nature School (Eternal Truth) — Directly Revealing the True Mind
  icon: 🌄
  intro: |
    性宗以「直显」为宗：一切众生本有空寂真心，名为佛性、如来藏、心地。宗密判为「显示真心即性教」——中国佛教义理的主流命脉，由《起信论》真如缘起开出华严「性起」说。
  intro_en: |
    The Nature School's doctrine is "direct revelation": all sentient beings intrinsically possess a true mind of empty quiescence, called Buddha-nature, Tathāgatagarbha, the ground of mind. Zongmi classified it as the "Teaching that Reveals the True Mind as One's Nature" — the mainstream current of Chinese Buddhist thought, from which the *Treatise on Awakening of Faith*'s true suchness origination gives rise to Huayan's "nature-arising" (xingqi) teaching.
  topics:
  - title: 宗密「显示真心即性教」
    title_en: Zongmi's "Teaching That Reveals the True Mind as One's Nature"
    body: |
      宗密：「一切众生皆有空寂真心，无始本来，性自清净，明明不昧，了了常知，尽未来际，常住不灭，**名为佛性，亦名如来藏，亦名心地**。」「灵知之心，即是真性，与佛无异。」
      所依经论：《华严》《密严》《圆觉》《佛顶》《胜鬘》《如来藏》《法华》《涅槃》等四十余部经，《宝性》《佛性》《起信》《十地》《法界》《涅槃》等十五部论。
      宗密并批评前两教：「如何破相之党，但云寂灭，不许真知；说相之家，执凡异圣，不许即佛。」
    en_body: |
      Zongmi: "All sentient beings possess a true mind of empty quiescence; from beginningless time its nature has been intrinsically pure, luminous and unobscured, knowingly aware at all times, abiding eternally through all future time. **It is called Buddha-nature, also called Tathāgatagarbha, also called the ground of mind.**" "The mind of spiritual knowing is the true nature, no different from a Buddha."
      Sūtras and śāstras relied upon: the *Avataṃsaka*, *Guhyasamāja*, *圆觉*, *佛頂*, *Śrīmālā*, *Tathāgatagarbha*, *Lotus*, *Nirvāṇa*, and over forty other sūtras; the *Ratnagotravibhāga*, *Buddha-nature*, *Awakening of Faith*, *Daśabhūmika*, *Dharmadhātu*, *Nirvāṇa*, and fifteen other śāstras.
      Zongmi also criticized the previous two teachings: "How can the faction that breaks through phenomena only speak of cessation, refusing to grant true knowing; and the school that expounds phenomena cling to the distinction between ordinary and sage, refusing to accept that one is already a Buddha."
    source: '宗密《禅源诸诠集都序》(T48n2015)'
  - title: 起信论与真如缘起
    title_en: The Awakening of Faith and True Suchness Origination
    body: |
      《大乘起信论》一心开二门：心真如门（不变）·心生灭门（随缘），真如缘起「不变随缘、随缘不变」。
      法藏判之为终教「真德不空宗」；华严宗「**性起**」说（智俨、法藏）即由此开出：性起＝依体起用，佛果之体性显现为无尽法界。
    en_body: |
      The *Treatise on Awakening of Faith* opens two gates from one mind: the gate of mind's true suchness (unchanging) and the gate of mind's arising and ceasing (according to conditions) — true suchness origination: "unchanging yet responsive to conditions; responsive to conditions yet unchanging."
      Fazang classified it as the Complete Teaching's "True Virtue Non-Emptiness Lineage"; the Huayan school's **"nature-arising"** (xingqi) teaching (from Zhiyan and Fazang) derives from this: nature-arising means the function arising from the essence, the dharmadhātu of the Buddha-fruit's intrinsic nature manifesting as the inexhaustible dharmadhātu.
    source: '《大乘起信论》(T32n1666) · 法藏《华严一乘教义分齐章》(T45n1866)'
  - title: 中土佛性论的源头：竺道生
    title_en: "The Origin of Chinese Buddha-Nature Theory: Zhu Daosheng"
    body: |
      竺道生（355-434）见法显六卷《泥洹》言「除一阐提，皆有佛性」，独发「**一阐提人皆得成佛**」——「夫禀质二仪，皆有涅槃正因。阐提含生之类，何得独无佛性？盖是经来未尽耳。」
      被摈出僧团后「生公说法，顽石点头」；及北本《大般涅槃经》传至，经文与之符契，被追尊「涅槃圣」。汤用彤：「后日谈心性主顿悟者，盖不得不以生公为始祖矣。」
    en_body: |
      Zhu Daosheng (355-434), reading Faxian's six-fascicle *Mahāparinirvāṇa* which states "except icchantikas, all possess Buddha-nature," independently proclaimed that **"even icchantikas can attain Buddhahood"** — "All who receive form within the two principles of heaven and earth possess the true cause of Nirvāṇa. How could icchantikas and all such beings alone lack Buddha-nature? This must be because the sūtra has not yet arrived in full."
      After being expelled from the saṅgha, "When Master Sheng spoke the Dharma, even rocks nodded"; when the northern recension of the *Mahāparinirvāṇa Sūtra* arrived, its text confirmed his teaching, and he was posthumously honored as "Sage of Nirvāṇa." Tang Yongtong: "Those who later discussed mind-nature and advocated sudden awakening had no choice but to regard Master Sheng as their founding patriarch."
    source: '赖永海《中国佛性论》 · 汤用彤《汉魏两晋南北朝佛教史》 · 《高僧传》卷七'

- id: tathagatagarbha
  title: 如来藏 — 专论与争议
  title_en: Tathāgatagarbha — Treatise and Controversy
  icon: 💎
  intro: |
    如来藏（tathāgatagarbha）思想是「空有直性」议题的漩涡中心：它既是性宗的教理内核，也是近现代「起信论真伪」「批判佛教」两大论争的焦点。
  intro_en: |
    Tathāgatagarbha thought is the vortex of the "emptiness, existence, and intrinsic nature" question: it is both the doctrinal core of the Nature School and the focal point of two major modern controversies — the authenticity of the *Treatise on Awakening of Faith* and "Critical Buddhism."
  topics:
  - title: 经典与论典的谱系
    title_en: The Genealogy of Sūtras and Śāstras
    body: |
      早期如来藏系三部经：《如来藏经》《不增不减经》《胜鬘经》（高崎直道之说）；另有《楞伽》《密严》《大法鼓》《央掘魔罗》等。
      论典以《宝性论》（Ratnagotravibhāga）为最系统——以《如来藏经》「九譬喻」证成如来藏为烦恼所缠，是其理论核心；梵文校勘本以 E. H. Johnston 1950年刊本为国际通用标准。
    en_body: |
      The three early Tathāgatagarbha sūtras: the *Tathāgatagarbha Sūtra*, the *Anekāntāparyāya Sūtra* (Neither Increase nor Decrease), and the *Śrīmālā Sūtra* (according to Takasaki Jikidō); additionally the *Laṅkāvatāra*, *Guhyasamāja*, *Mahāmegha*, and *Aṅgulimālīya* sūtras.
      Among śāstras, the *Ratnagotravibhāga* is the most systematic — using the "nine similes" from the *Tathāgatagarbha Sūtra* to demonstrate that Tathāgatagarbha is bound by afflictions, which constitutes its theoretical core; the Sanskrit critical edition by E. H. Johnston (1950) serves as the international standard.
    source: '高崎直道《如来藏思想的形成》(春秋社1974) · A Study on the Ratnagotravibhāga (Uttaratantra), Serie Orientale Roma XXXIII'
  - title: 本寂与本觉 — 吕澂的判分
    title_en: "Quiescence and Awakening: Lü Cheng's Distinction"
    body: |
      吕澂《试论中国佛学有关心性的基本思想》提出著名的「**心性本寂**」（印度）与「**心性本觉**」（中国）之区分，认为中国佛学以「本觉」理解心性明净属「性觉」之说，将中国化佛教判定为「相似佛学」。
      支那内学院由此驳《起信》、难《楞严》、疑《圆觉》《占察》《仁王》《梵网》，对中国化佛教传统发起根本质疑。
    en_body: |
      Lü Cheng's *A Tentative Discussion of the Basic Ideas of Chinese Buddhist Mind-Nature Thought* proposed the famous distinction between **"intrinsically quiescent mind-nature"** (Indian) and **"intrinsically awakened mind-nature"** (Chinese), arguing that Chinese Buddhism's understanding of mind-nature's luminous purity as "intrinsic awakening" (xingjue) constituted a doctrine of "counterfeit Buddhism," thereby classifying Chinese Buddhism as such.
      The Inner Learning Academy (Jīna Neixueyuan) used this to reject the *Awakening of Faith*, question the *Śūraṅgama Sūtra*, and suspect the *圓覺*, *占察*, *仁王*, and *Brahma's Net* sūtras, launching a fundamental challenge to the Chinese Buddhist tradition.
    source: '吕澂《试论中国佛学有关心性的基本思想》 · 刘鹿鸣《「慈宗」构建与近代弥勒信仰复兴中的理论抉择》(aisixiang.com)'
  - title: 批判佛教的挑战与佛门驳议
    title_en: The Challenge of Critical Buddhism and Buddhist Responses
    body: |
      日本驹泽大学袴谷宪昭、松本史朗：「如来藏思想不是佛教」——它是「**基体论**」（dhātu-vāda），主张单一实在的基体生起多元诸法，违背缘起与无我。松本引《大乘阿毘达磨经》「无始时来界，一切法等依，由此有诸趣，及涅槃证得」一偈为证。
      台湾释恒清《「批判佛教」驳议》（《国立台湾大学哲学论评》第24期，2001）依《胜鬘经》《大般涅槃经》《宝性论》《佛性论》反驳：如来藏（佛性）思想恰恰是实践中平等、正义的理论基础。
      林镇国认为批判佛教的真正意图指向社会现实与文化批判；周贵华指出其与内学院「相似佛教」判在「发生论的一元论」定性上一致。
    en_body: |
      Japan's Komazawa University scholars Hakuun Kakuhō and Matsumoto Shirō: "Tathāgatagarbha thought is not Buddhism" — it is **"substratum theory"** (dhātu-vāda), positing a single real substratum giving rise to multiple phenomena, violating dependent origination and non-self. Matsumoto cited the verse from the *Mahāyānābhidharmasūtra*: "From beginningless time the dātu, the basis of all phenomena, through which there are the six destinies and the attainment of Nirvāṇa."
      Taiwan's Heng-ching Shih's "A Rebuttal of 'Critical Buddhism'" (*National Taiwan University Philosophical Review* No. 24, 2001) countered using the *Śrīmālā Sūtra*, *Mahāparinirvāṇa Sūtra*, *Ratnagotravibhāga*, and *Buddha-nature Treatise*: Tathāgatagarbha (Buddha-nature) thought is precisely the theoretical foundation of equality and justice in practice.
      Lin Zhenguo argued that Critical Buddhism's true intention points toward social reality and cultural critique; Zhou Guihua noted that its characterization aligns with the Inner Learning Academy's "counterfeit Buddhism" judgment in terms of "genetic monism."
    source: '释恒清《「批判佛教」驳议》, 《台大哲学论评》24期 (pdcnet.org) · 周贵华《日本「批判佛教」思潮：反应与研究》(fjdh.cn)'
  - title: 海云法师：如来即自性
    title_en: "Haiyun Jimeng: Thus-Come Is Intrinsic Nature"
    body: |
      海云法师《华严经·如来出现品》讲记：众生内在本有「取之不盡、用之不竭的寶藏」——「釋迦牟尼佛管它叫『**如來**』，我們稱其為『**自性**』」；「我們的自性、佛性呈現、開展，此即**如來出現**」。
      法师强调：**必须先证得空性**为基础，如来（佛自性）才能显现——「没有空性……那是人天善法，不是菩萨道的大功德」。
    en_body: |
      Haiyun Jimeng's lecture on the *Avataṃsaka Sūtra*'s "Chapter on the Tathāgata's Manifestation": sentient beings intrinsically possess an "inexhaustible, never-depleted treasure" — "Śākyamuni Buddha calls it the **'Thus-Come'**; we call it **'intrinsic nature'**." "The manifestation and unfolding of our intrinsic nature, our Buddha-nature — this is the **Tathāgata's Manifestation**."
      The master emphasized: **one must first realize emptiness of nature** as the foundation before the Thus-Come (the Buddha's intrinsic nature) can manifest — "Without emptiness of nature... that is merely the wholesome dharma of humans and devas, not the great merit of the Bodhisattva path."
    source: '海云继梦《自性啟航——華嚴經如來出現品卷一講記》(空庭書苑2003) · 《四十华严讲记》第23讲 (fjdh.cn)'

- id: debates
  title: 近现代论争 — 空有之诤与起信真伪
  title_en: Modern and Contemporary Debates — Emptiness-Existence Controversy and the Authenticity of the Awakening of Faith
  icon: ⚔️
  intro: |
    1920-40年代，支那内学院与武昌佛学院围绕唯识、起信论、如来藏展开的论争，是「判教互判」在近代最高强度的学术对决，其思想效应延续至今。
  intro_en: |
    During the 1920s-1940s, the controversies between the Inner Learning Academy (Jīna Neixueyuan) and the Wuchang Buddhist Academy concerning Consciousness-Only, the *Treatise on Awakening of Faith*, and Tathāgatagarbha constituted the most intense scholarly confrontation of "doctrinal classification and mutual critique" in modern times, with intellectual effects enduring to the present.
  topics:
  - title: 内学院与武昌佛学院的对垒
    title_en: The Standoff Between the Inner Learning Academy and Wuchang Buddhist Academy
    body: |
      1922年欧阳竟无在南京创办支那内学院，太虚在武昌创办武昌佛学院，并列为两大佛学中心。
      内学院以专精唯识而道定一尊，对中国佛学天台、华严、禅宗猛攻猛破；欧阳竟无《唯识抉择谈》出，太虚作《佛法总抉择谈》依唯识三性（遍计所执性、依他起性、圆成实性）通论大乘回应。
    en_body: |
      In 1922, Ouyang Jingwu founded the Inner Learning Academy in Nanjing, while Taixu founded the Wuchang Buddhist Academy in Wuchang, establishing the two as the twin centers of Buddhist scholarship.
      The Inner Learning Academy specialized exclusively in Consciousness-Only and pursued a singular authoritative path, launching fierce attacks on Chinese Buddhist schools including Tiantai, Huayan, and Chan; when Ouyang Jingwu published his *Discriminating Discussion of Consciousness-Only*, Taixu responded with the *Comprehensive Discriminating Discussion of the Buddha-Dharma*, using the three natures of Consciousness-Only (parikalpita, paratantra, pariniṣpanna) to provide a comprehensive account of the Mahāyāna.
    source: '太虚《佛法总抉择谈》 · 刘鹿鸣《「慈宗」构建与近代弥勒信仰复兴中的理论抉择》(aisixiang.com)'
  - title: 起信论真伪论争全景
    title_en: The Full Landscape of the Authenticity Debate on the Awakening of Faith
    body: |
      • 隋法经《众经目录》已编《起信论》入「众经疑惑部」；
      • 日本望月信亨、梁启超（1922《大乘起信论考证》）据史料考证断为伪作；
      • 吕澂《起信与楞伽》从七个观点证明《起信论》是伪论——非从梵本译出，乃沿袭魏译《楞伽》「如来藏与藏识不同」之误而来；
      • 太虚「从《成唯识论》寻得此论立说之依据点」以唯识释起信辩护；
      • 印顺认为纵有译错，《起信》「真妄和合」结构吻合「真常唯心论」；
      • 牟宗三批评吕澂：「如来藏藏识」是复合词，有取性与解性两面，吕只取前一义。
    en_body: |
      - Sui dynasty Fajing's *Catalogue of All Sūtras* had already placed the *Awakening of Faith* in the "section of suspected sūtras";
      - Japan's Mochizuki Shinkō and Liang Qichao (1922, *A Study of the Authenticity of the Mahāyāna Awakening of Faith*) judged it to be a forgery based on historical evidence;
      - Lü Cheng's *Awakening of Faith and the Laṅkāvatāra* demonstrated from seven angles that the *Awakening of Faith* is spurious — not translated from a Sanskrit source, but deriving from the error in the Wei translation of the *Laṅkāvatāra* conflating "Tathāgatagarbha" with "ālayavijñāna";
      - Taixu "found the basis for this treatise's doctrines in the *Cheng Weishi Lun*" and defended the *Awakening of Faith* using Consciousness-Only interpretation;
      - Yinshun held that even if there were translation errors, the *Awakening of Faith*'s structure of "true and deluded intermingling" accords with "eternal mind-only theory;"
      - Mou Zongsan criticized Lü Cheng: "tathāgatagarbha-ālayavijñāna" is a compound term with two aspects — the aspect of reception and the aspect of liberation — and Lü took only the former meaning.
    source: '圣严法师对近代起信论真伪两系之总结 (ddc.shengyen.org) · 吕澂《起信与楞伽》 · 梁启超《大乘起信论考证》'
  - title: 太虚与印顺之诤
    title_en: The Controversy Between Taixu and Yinshun
    body: |
      1942年印顺将《印度之佛教》书稿寄请太虚作序，太虚撰《议印度之佛教》《再议印度之佛教》，批评印顺「独尊龙树」「孤取人间为本」；印顺以《敬答议印度之佛教》回应。
      这场争论被视为「人间佛教」（印顺）与「人生佛教」（太虚）路线分歧的重要前哨战。
    en_body: |
      In 1942, Yinshun sent the manuscript of *Buddhism in India* to Taixu requesting a preface; Taixu wrote *Remarks on Buddhism in India* and *Further Remarks on Buddhism in India*, criticizing Yinshun for "exclusively elevating Nāgārjuna" and "taking only the human realm as fundamental"; Yinshun responded with *A Respectful Reply to Remarks on Buddhism in India*.
      This controversy is regarded as an important precursor battle in the divergence between "Humanistic Buddhism" (Yinshun) and "Life Buddhism" (Taixu).
    source: '印顺《印度之佛教》·《敬答议印度之佛教》 · 太虚《再议印度之佛教》 · 侯坤宏《从太虚大师到印顺法师：一个思想史角度的观察》(fjdh.cn)'

- id: ekayana
  title: 一佛乘 — 会三归一与别教一乘
  title_en: The One Buddha Vehicle — Converging the Three into One vs. Distinctive One Vehicle
  icon: 🛞
  intro: |
    「一佛乘」（eka-yāna）之争是台贤两宗判教对决的主战场：《法华》会三归一为「同教一乘」，华严直显不共为「别教一乘」。
  intro_en: |
    The controversy over the "One Buddha Vehicle" (eka-yāna) is the main battlefield of the doctrinal contest between Tiantai and Huayan: the *Lotus Sūtra*'s convergence of the three into one constitutes the "Shared-Teaching One Vehicle," while Huayan's direct revelation of the non-shared constitutes the "Distinctive One Vehicle."
  topics:
  - title: 法华的会三归一
    title_en: The Lotus Sūtra's Convergence of the Three into One
    body: |
      《法华经·方便品》：「十方佛土中，唯有一乘法，无二亦无三。」
      天台《四教仪集注》以四义释「一」：**教一**（唯一佛乘）、**行一**（「正直舍方便，但说无上道」）、**人一**（「但为菩萨，不为小乘」）、**理一**（「世间相常住」）。
      天台自居圆教，判《华严》「兼别教而非纯圆教」，唯《法华》「部圆教圆」纯圆独妙。
    en_body: |
      *Lotus Sūtra*, "Chapter on Expedient Means": "In the Buddha-lands of the ten directions, there is only the One Vehicle Dharma; there is no second and no third."
      Tiantai's *Collected Notes on the Four Teachings Manual* explains "one" through four meanings: **teaching is one** (only the One Buddha Vehicle); **practice is one** ("directly and without pretense setting aside expedients, teaching only the supreme Way"); **persons are one** ("only for Bodhisattvas, not for the lesser vehicles"); **principle is one** ("the characteristics of the world are eternal").
      Tiantai claimed for itself the Perfect Teaching, classifying the *Avataṃsaka* as "partially Distinctive and not purely Perfect," while only the *Lotus* was "its section is Perfect and its teaching is Perfect — purely perfect and uniquely wondrous."
    source: '《法华经·方便品》(T09n0262) · 《天台四教仪集注》'
  - title: 华严的别教一乘
    title_en: Huayan's Distinctive One Vehicle
    body: |
      法藏《华严一乘教义分齐章》（《五教章》）开十门，首门「建立一乘」，将一乘分「**别教**」「**同教**」二门（初由二祖智俨提出，法藏集大成）：
      • **别教一乘**（《华严》）：如来自证自悟境界，主伴具足无量教义、事事无碍、因果无二、三世间本来圆满；分「性海果分」（不可说——「因分可说，果分不可说」）与「缘起因分」（普贤境界）；
      • **同教一乘**（《法华》）：会三归一，与三乘教义相通、权实圆融，仍带权教性质。
      澄观：「百川不摄大海，大海必摄百川」。
    en_body: |
      Fazang's *Treatise on the Doctrinal Analysis of the One Vehicle of the Avataṃsaka* (the *Five Teachings Chapter*) opens ten gates, the first being "Establishing the One Vehicle," dividing the One Vehicle into **"Distinctive"** and **"Shared"** gates (initially proposed by the second patriarch Zhiyan, systematized by Fazang):
      - **Distinctive One Vehicle** (*Avataṃsaka*): the Tathāgata's self-realized, self-enlightened realm, with sovereign and retinue fully possessing infinite teachings, interpenetration of all phenomena, non-duality of cause and effect, and the three worlds originally complete; divided into the "fruit of the nature-ocean" (unspeakable — "the cause-aspect can be spoken, the fruit-aspect cannot") and the "dependent origination cause-aspect" (the Samantabhadra realm);
      - **Shared One Vehicle** (*Lotus*): converging the three into one, interconnected with the three-vehicle teachings, with provisional and true in perfect interfusion, still carrying the quality of provisional teaching.
      Chenguan: "A hundred rivers do not encompass the great ocean, but the great ocean necessarily encompasses a hundred rivers."
    source: '法藏《华严一乘教义分齐章》(T45n1866) · 释正持《别教一乘与同教一乘之同异——以〈五教章〉为主》(huayencollege.org)'
  - title: 太虚的超宗派立场
    title_en: Taixu's Trans-Sectarian Standpoint
    body: |
      太虚《佛教各宗派源流》：「清凉判法华兼终教非纯圆教，天台判华严兼别教非纯圆教，此乃独标自宗殊胜，令学者死尽偷心以起行趣证等。」
      究实而言「八宗皆实非权，皆圆非偏，皆妙非麤；皆究竟菩提故，皆同一教乘故」。
    en_body: |
      Taixu's *Origins of Buddhist Schools*: "Chenguan classified the *Lotus* as partially Complete and not purely Perfect; Tiantai classified the *Avataṃsaka* as partially Distinctive and not purely Perfect. This is each school exclusively highlighting its own excellence, to make practitioners exhaust all laziness of mind and advance toward realization."
      In truth, "All eight schools are real and not provisional, all are perfect and not partial, all are wondrous and not coarse; all are the ultimate bodhi, all belong to the same teaching-vehicle."
    source: '太虚《佛教各宗派源流》 · 太虚《我怎样判摄一切佛法》(books.fo)'

- id: yuanjiao
  title: 共同圆与不共别圆
  title_en: Shared Perfect and Non-Shared Distinctive Perfect
  icon: 🏔️
  intro: |
    「共同圆教」与「不共别圆」是海云法师对法藏同别二教判的现代诠释：法华摄三归一为共同圆，华严直显佛果为不共别圆——「没有三车，只有露地大白牛车」。
  intro_en: |
    "Shared Perfect Teaching" and "Non-Shared Distinctive Perfect" are Haiyun Jimeng's modern interpretation of Fazang's Shared-Distinctive twofold classification: the *Lotus Sūtra*'s convergence of the three into one is the Shared Perfect; Huayan's direct revelation of the Buddha-fruit is the Non-Shared Distinctive Perfect — "There are no three carts; there is only the Great White Ox-Cart in the open."
  topics:
  - title: 五教十宗的判摄
    title_en: The Classification of Five Teachings and Ten Lineages
    body: |
      法藏「就法分教，教类有五」：**小乘教**（人空法有）→ **大乘始教**（空门：般若中观，一分无性）→ **终教**（不空门：起信如来藏，一切众生皆有佛性）→ **顿教**（绝言真如：楞伽，言说顿绝）→ **圆教**（华严别教一乘，事事无碍）。
      十宗后四：一切皆空宗（始·空）、真德不空宗（终·性宗）、相想俱绝宗（顿）、圆明具德宗（圆）。
    en_body: |
      Fazang's principle of "dividing teachings according to dharma, there are five types of teaching": **Hīnayāna Teaching** (person is empty, phenomena exist) → **Initial Mahāyāna Teaching** (gate of emptiness: Prajñā Mādhyamaka, partially devoid of nature) → **Complete Teaching** (gate of non-emptiness: *Awakening of Faith* Tathāgatagarbha, all sentient beings possess Buddha-nature) → **Sudden Teaching** (true suchness beyond words: *Laṅkāvatāra*, speech cut off abruptly) → **Perfect Teaching** (*Avataṃsaka* Distinctive One Vehicle, interpenetration of all phenomena).
      The last four of the Ten Lineages: All-Empty Lineage (Initial · Emptiness), True Virtue Non-Emptiness Lineage (Complete · Nature), Phenomena and Thought Both Extinguished Lineage (Sudden), Luminous Virtue Complete Lineage (Perfect).
    source: '法藏《华严一乘教义分齐章》(T45n1866) · 方立天《法藏》五教章研究'
  - title: 海云法师：共同圆教 vs 不共别圆
    title_en: "Haiyun Jimeng: Shared Perfect Teaching vs. Non-Shared Distinctive Perfect"
    body: |
      海云法师《三圣圆融观》：「《法华经》上讲的佛乘，并非『一乘』，而是『共教』、是『同教』、『圆教』，所以称之为『**共同圆教**』」——核心是「摄三归一」「会三归一」，三车之外露地另有大白牛车，属「圣解脱道」，可思可议。
      华严则是「**不共别圆**」：不共教、别教、圆教，「真理即是如此，与三乘无关」——「**没有三车，只有露地大白牛车**」：一出三界，通通证入大白牛车境界。
      大乘分菩萨乘（波罗蜜乘）与一佛乘；一佛乘之下再分：密宗金刚乘属共同圆教；华严一佛乘特称「**普贤乘**」，为最高层次。
    en_body: |
      Haiyun Jimeng's *Contemplation of the Perfect Fusion of the Three Sages*: "The Buddha Vehicle spoken of in the *Lotus Sūtra* is not the 'One Vehicle,' but rather the 'Shared Teaching,' the 'Convergent Teaching,' the 'Perfect Teaching' — hence it is called the **'Shared Perfect Teaching.'**" Its core is "gathering the three into one" and "converging the three into one" — beyond the three carts, in the open there is the Great White Ox-Cart, belonging to the "path of holy liberation," which is thinkable and discussable.
      Huayan, however, is the **"Non-Shared Distinctive Perfect"**: non-shared teaching, distinctive teaching, perfect teaching — "Truth is just this, unrelated to the three vehicles" — **"There are no three carts; there is only the Great White Ox-Cart in the open"**: once out of the three realms, all are admitted to the Great White Ox-Cart realm.
      The Mahāyāna is divided into the Bodhisattva Vehicle (Pāramitā Vehicle) and the One Buddha Vehicle; the One Buddha Vehicle is further divided: the Vajrayāna of esoteric Buddhism belongs to the Shared Perfect Teaching; the Huayan One Buddha Vehicle is specifically called the **"Samantabhadra Vehicle,"** the highest level.
    source: '海云继梦《三圣圆融观》 ([fjdh.cn](https://www.fjdh.cn/wumin/2013/09/085114285451.html))'
  - title: 「不共」在真发菩提心
    title_en: The "Non-Shared" Lies in Truly Generating the Bodhicitta
    body: |
      「不共」究竟不共在哪里？海云法师：在「**真发阿耨多罗三藐三菩提心**」——不是形式上的发心，而是心真的在转化。真发菩提心理、事两个前提：
      • 理：对三宝具足信根，以普贤菩萨为本尊；
      • 事：尽形寿行菩萨道；一切荣耀归三宝，一切挫折向普贤本尊忏悔。
      真发心后「一切法皆可修行」——绘画、音乐、舞蹈、运动皆是普贤乘，「于一切法成最正觉」。
    en_body: |
      Where exactly lies the "non-shared"? Haiyun Jimeng: in **"truly generating the Anuttara-Samyak-Sambodhicitta"** — not a formal generation of mind, but a mind that is truly undergoing transformation. Truly generating the bodhicitta has two prerequisites — principle and practice:
      - Principle: possessing complete faith-root in the Three Jewels, with Samantabhadra Bodhisattva as the primary practice-deity;
      - Practice: devotedly practicing the Bodhisattva path for life; all glory going to the Three Jewels, all setbacks being confessed to the Samantabhadra practice-deity.
      After truly generating the mind, "all dharmas can be practiced" — painting, music, dance, and athletics are all the Samantabhadra Vehicle, "attaining the highest right enlightenment in all dharmas."
    source: '海云继梦《三圣圆融观》 (fjdh.cn)'
  - title: 普贤圆融道与法界力
    title_en: The Samantabhadra Path of Consummate Interfusion and Dharmadhātu Power
    body: |
      华严行法称「**普贤圆融道**」（圆融道），「**不用大脑在大地上成就**」；所讲的是「**法界力**」——像万有引力一样本来存在，并非净土宗所说的「他力」，而是法界的本然运作。
      禅宗的「教外别传」其实也没有离开不共别圆的范畴。法华的大白牛，在华严是直接兑现，能直接证得法、报、化三身。
    en_body: |
      Huayan practice is called the **"Samantabhadra Path of Consummate Interfusion"** (the Path of Consummate Interfusion), **"achieving realization on the great earth without relying on the conceptual mind"**; what it speaks of is **"Dharmadhātu Power"** — existing originally like gravitational force, not the "other-power" spoken of by the Pure Land school, but the natural functioning of the dharmadhātu itself.
      Chan's "separate transmission outside the teachings" has in fact not departed from the category of the Non-Shared Distinctive Perfect. The Great White Ox of the *Lotus Sūtra* is directly fulfilled in Huayan, capable of directly realizing the Dharma, Reward, and Transformation bodies.
    source: '海云继梦《三圣圆融观》 (fjdh.cn) · 《同证法报化三身》(wuming.xuefo.com)'

- id: hupan
  title: 诸宗互判与合流
  title_en: Mutual Classification and Convergence of the Schools
  icon: 🤝
  intro: |
    判教成熟之后，宗派之间与宗派内部展开了持续的互判：天台山家山外之争、台贤互判、禅教之争、台净合流——互判既是义学划界，也是融合的动力。
  intro_en: |
    After doctrinal classification matured, sustained mutual critique unfolded between and within schools: the Tiantai Inhwa vs. Oewa controversy, Tiantai-Huayan mutual critique, Chan-textual teachings debate, and Tiantai-Pure Land convergence — mutual critique served both as doctrinal demarcation and as a catalyst for synthesis.
  topics:
  - title: 天台山家山外之争（约980-1030）
    title_en: The Tiantai Inhwa vs. Oewa Controversy (c. 980-1030)
    body: |
      五代末天台典籍自高丽、日本回传复兴，但因文献久疏、受贤首慈恩学说及「兼讲」思潮影响，天台教义被夹杂混淆，引发**山家（四明知礼，960-1028，四明）与山外（慈光晤恩一系，钱塘；孤山智圆976-1022等）**三四十年的正统之争。
      四大论题：①《金光明经玄义》广略本真伪（知礼《释难扶宗记》《十义书》《观心二百问》，历时七年）；②**真心观vs妄心观**（山外受华严慈恩影响主真心观；知礼主妄心观）；③**别理随缘与理具三千**（知礼「若不谈体具者，随缘与不随缘，皆属别教」——以「理具」简别天台性具与华严性起）；④《十不二门指要钞》之诤（后衍生仁岳「后山外」）。
      知礼被推为「中兴天台」第十七代祖；南宋广智、神照、南屏三家承其说，山家终代表天台盛行于世。
    en_body: |
      At the end of the Five Dynasties, Tiantai scriptures returned from Goryeo and Japan, initiating a revival. However, due to prolonged separation from the texts, influence from Huayan and Consciousness-Only theories, and the trend of "combined lecturing," Tiantai doctrine became confused and hybridized, triggering a **thirty-to-forty-year orthodox controversy between the Inhwa school (Zhili of Siming, 960-1028) and the Oewa school (the lineage of Wuen of Ciguang; Zhiyuan of Gushan, 976-1022, and others)**.
      Four major issues: (1) the authenticity of the broad and abbreviated recensions of the *Suvarṇaprabhāsa Sūtra*'s profound meaning; (2) **true-mind contemplation vs. deluded-mind contemplation** (Oewa, influenced by Huayan and Consciousness-Only, advocated true-mind contemplation; Zhili advocated deluded-mind contemplation); (3) **distinctive principle's responsiveness to conditions vs. principle's inherent possession of the thousand worlds**; (4) the controversy over the *Essential Explanations on the Ten Non-Dual Gates*.
      Zhili was honored as the seventeenth patriarch of the "Tiantai Revival"; the Guangzhi, Shenzhao, and Nanping lineages of the Southern Song continued his teachings, and the Inhwa school ultimately represented Tiantai's flourishing.
    source: '吴忠伟《圆教的自拘——山家山外之争与宋代制度佛学》(philosophychina.cssn.cn) · 知礼《观无量寿经疏妙宗钞》研究 (minlun.org.tw) · 龚隽《北宋天台宗对〈大乘起信论〉与〈十不二门〉的诠释与论争》(wuming.xuefo.com)'
  - title: 台贤互判与智圆的反弹
    title_en: Tiantai-Huayan Mutual Critique and Zhiyuan's Rebuttal
    body: |
      天台判华严「兼别教而非纯圆」；清凉判法华「兼终教非纯圆」——太虚总结为「独标自宗殊胜」。
      山外智圆则批评「近人不晓，乃谓华严、起信宗师所谈圆极但是今家别教者，谬之甚矣」——真如须具三千法，「若非本具，云何能造」。湛然引入《起信论》「真如随缘」后，天台与华严界限模糊，正是山家山外分裂的义理根源。
    en_body: |
      Tiantai classified Huayan as "partially Distinctive and not purely Perfect"; Chenguan classified the *Lotus* as "partially Complete and not purely Perfect" — Taixu summarized this as "each school exclusively highlighting its own excellence."
      The Oewa school's Zhiyuan criticized: "Recent people fail to understand, claiming that the ultimate perfection spoken of by Huayan and *Awakening of Faith* masters is merely our Distinctive Teaching — this is greatly mistaken" — true suchness must inherently possess the thousand worlds, "if it were not inherently possessed, how could it produce [phenomena]?" After Zhanran introduced the *Awakening of Faith*'s "true suchness responding to conditions," the boundary between Tiantai and Huayan blurred — this was the doctrinal root of the Inhwa-Oewa split.
    source: '龚隽《北宋天台宗对〈大乘起信论〉与〈十不二门〉的诠释与论争》(wuming.xuefo.com) · 太虚《佛教各宗派源流》'
  - title: 禅教之判与合流
    title_en: The Chan-Textual Teachings Debate and Convergence
    body: |
      宗密《禅源诸诠集都序》倡**教禅一致**：以三种教配禅三宗，「一一证之，然后总会为一味」——「今时弟子彼此迷源，修心者，以经论为别宗；讲说者，以禅门为别法」正是宗密要弥合的裂痕。
      永明延寿主张**禅教兼重、性相融合**，主动融合诸宗（其融会姿态甚至被学者视为促使天台山家山外论争产生的外部因素之一）。
    en_body: |
      Zongmi's *Preface to the Complete Collection of Chan Sources* advocated **the unity of textual teachings and Chan**: matching the three teachings with the three Chan lineages, "verifying each one, then ultimately converging them into one taste" — "Present-day disciples are mutually lost at the source: cultivators treat the sūtras and treatises as a separate school; lecturers treat Chan as a separate dharma" — this is precisely the rift Zongmi sought to bridge.
      Yongming Yanshou advocated **equal emphasis on Chan and textual teachings, and the integration of nature and phenomena**, actively synthesizing the various schools (his integrative posture was even regarded by some scholars as one of the external factors that prompted the Tiantai Inhwa-Oewa controversy).
    source: '宗密《禅源诸诠集都序》 · 悟殷法师《记〈中国佛教史略〉之特见》(xuefo.com) · 吴忠伟《圆教的自拘》(cssn.cn)'
  - title: 台净合流：教演天台，行归净土
    title_en: "Tiantai-Pure Land Convergence: Teaching Through Tiantai, Practice Returning to Pure Land"
    body: |
      知礼晚年力作《观无量寿经疏妙宗钞》（六十二岁成书，六十八岁加《料简十三科》）以天台圆宗诠释净土教义，确立「**教演天台，行归净土**」的修学方向，首唱**台净融合**之论，并弥补善导「凡夫入报土」论义理之不足。
    en_body: |
      Zhili's late-life magnum opus, the *Commentary on the Contemplation Sūtra with Wondrous Understanding* (completed at age 62, with the *Thirteen Additional Questions* added at age 68), interpreted Pure Land doctrine through the lens of Tiantai's Perfect Teaching, establishing the direction of **"teaching through Tiantai, practice returning to Pure Land,"** inaugurating the thesis of **Tiantai-Pure Land integration**, and supplementing the doctrinal insufficiency of Shandao's theory of "ordinary beings entering the Reward Land."
    source: '知礼《观无量寿经疏妙宗钞》研究 (minlun.org.tw)'

- id: zangchuan
  title: 藏传判教 — 九乘与四部宗义
  title_en: Tibetan Doctrinal Classification — Nine Vehicles and Four Tenets
  icon: 🐉
  intro: |
    藏传判教自成体系：宁玛以「大圆满」为标准立九乘；格鲁以「应成中观」为究竟了义；「自空」与「他空」之争贯穿藏传思想史。
  intro_en: |
    Tibetan doctrinal classification constitutes its own self-contained system: Nyingma established the Nine Vehicles based on the standard of "Great Perfection"; Gelug regarded Prāsaṅgika-Mādhyamaka as the definitive meaning; the controversy between "emptiness of self" and "emptiness of other" pervades Tibetan intellectual history.
  topics:
  - title: 宁玛派九乘判教
    title_en: The Nyingma School's Nine-Vehicle Classification
    body: |
      宁玛派以「大圆满」为标准将一切佛法判为**九乘**（另列世间二类）：
      • 世间法：颠倒外道乘；因循人天乘（人乘五戒/天乘十善）；
      • **显三乘**（集聚招引三外乘）：声闻、独觉、菩萨；
      • **外密三乘**（苦行明觉内三乘）：事部、行部、瑜伽部；
      • **内密三乘**（深密随转方便三内乘）：摩诃瑜伽（生起）、阿努瑜伽（教敕）、阿底瑜伽（大圆满，分心部/界部/要门部）。
      九乘次第由前弘期**吉祥积译师**开创，**隆钦饶绛巴（1308-1363）**在《七宝藏论·宗论藏》中系统化。
    en_body: |
      The Nyingma school classifies all Buddhist teachings into **Nine Vehicles** based on the standard of the "Great Perfection" (with two additional worldly categories):
      - Worldly Dharma: the inverted heterodox vehicle; the conventional human-deva vehicle (human vehicle with five precepts and the deva vehicle with ten virtues);
      - **Three Outer Vehicles** (the three outer vehicles of gathering and attracting): Śrāvaka, Pratyekabuddha, Bodhisattva;
      - **Three Outer Tantric Vehicles** (the three inner vehicles of ascetic lucidity): Kriyā, Carya, Yoga;
      - **Three Inner Tantric Vehicles** (the three inner vehicles of profound secret, turning-with-ease): Mahāyoga (generation), Anuyoga (command), Atiyoga — the Great Perfection (divided into Mind, Space, and Pith Instruction series).
      The nine-vehicle order was initiated during the Early Diffusion period by **Translator Zhikye**, and systematized by **Longchenpa (1308-1363)** in the *Treasury of Philosophical Discussion* of the *Seven Treasuries*.
    source: '土观·罗桑却吉尼玛《宗派源流》(1801) · 何杰峰《藏传佛教判教研究》(巴蜀书社) · 谈锡永《〈四法宝鬘〉导读》(xuefo.com)'
  - title: 四部宗义与「大中观」
    title_en: The Four Tenets and the "Great Madhyamaka"
    body: |
      显教三乘内摄印度**四部宗义**（「四宗河」）：毗婆沙（有部）·经量部·唯识宗·中观宗；中观又分**外宗**（自续派、应成派——说一切无自性）与**内宗**（他空中观、唯识中观——「**大中观**」）。
      宁玛判三转法轮：初转四谛、二转无自性为不了义，**三转法轮的他空大中观见为究竟了义**。敦珠法王《四部宗义要略》（谈锡永译）认为如来藏思想为佛家最究竟见，藏传宁玛、萨迦、噶举、觉囊及汉传诸宗皆依此建立，统称「大中观」。
    en_body: |
      Within the Three Outer Vehicles of the Sūtra tradition, Indian **Four Tenets** ("Four Rivers of Tenets") are encompassed: Vaibhāṣika (Sarvāstivāda) · Sautrāntika · Yogācāra · Mādhyamaka; Mādhyamaka is further divided into the **Outer School** (Svātantrika, Prāsaṅgika — all phenomena are empty of own-nature) and the **Inner School** (Zhentong-Mādhyamaka, Yogācāra-Mādhyamaka — the **"Great Madhyamaka"**).
      Nyingma classifies the Three Turnings of the Dharma Wheel: the First Turning (Four Noble Truths) and Second Turning (emptiness of own-nature) are provisional; **the Zhentong Great Madhyamaka view of the Third Turning is the definitive meaning**. Dudjom Rinpoche's *Essence of the Four Tenets* (trans. Tenzi and Tai Sik) holds Tathāgatagarbha thought as Buddhism's ultimate view, upon which all Tibetan schools — Nyingma, Sakya, Kagyu, Jonang — and Chinese Buddhist schools are established, collectively called "Great Madhyamaka."
    source: '敦珠法王《四部宗义要略》(谈锡永译, 附《九乘次第论集》) · 何杰峰《藏传佛教判教研究》'
  - title: 格鲁派的应成中观立场
    title_en: The Gelug School's Prāsaṅgika-Mādhyamaka Standpoint
    body: |
      格鲁派以**佛护、月称的中观应成派见为佛的究竟了义思想**——与宁玛派显教判释「南辕北辙」；格鲁派的出现被视为藏传思潮「由佛性论转向般若学」的重要标志。
      见修分歧：宁玛主张众生心体本净、顿悟自性元成；格鲁否认本具之说，认为众生心染污，须离垢清净、长时积集福智二资粮方能成佛。
      隆钦巴曾将应成中观置于显宗最高位；后世宁玛学者则认为应成中观虽非了义，在实修次第中有「下学上达」的作用。
    en_body: |
      The Gelug school regards **Buddhapālita and Candrakīrti's Prāsaṅgika-Mādhyamaka as the definitive meaning of the Buddha's teaching** — diametrically opposed to Nyingma's sūra-based classification; the emergence of the Gelug school is regarded as an important marker of Tibetan thought's "turning from Buddha-nature theory to Prajñā scholarship."
      Disagreements on view and practice: Nyingma maintains that the essence of sentient beings' minds is intrinsically pure, with sudden awakening to the self-nature's original completion; Gelug denies the theory of inherent possession, holding that sentient beings' minds are defiled, requiring the removal of defilements and long accumulation of the two accumulations of merit and wisdom to attain Buddhahood.
      Longchenpa once placed Prāsaṅgika-Mādhyamaka at the highest position within the Sūtra tradition; later Nyingma scholars, however, held that although Prāsaṅgika-Mādhyamaka is not the definitive meaning, it serves a function of "learning the lower to reach the higher" within the sequential order of practice.
    source: '何杰峰《藏传佛教判教研究》(巴蜀书社) · 谈锡永《〈四法宝鬘〉导读》'

- id: dzogchen
  title: 大圆满觉与觉囊他空
  title_en: Great Perfection Awakening and Jonang Zhentong (Emptiness of Other)
  icon: 🏔️
  intro: |
    「大圆满觉」在汉传语境对应《圆觉经》「圆满觉性」，在藏传语境对应大圆满（Dzogchen）之觉空无别——两者皆以「心性本净、光明本具」为共同义理结构，与如来藏系同源；觉囊「他空见」则是藏传最彻底的如来藏正统论。
  intro_en: |
    "Great Perfection Awakening" corresponds in the Chinese context to the *Sūtra of Complete Enlightenment*'s "perfect awakened nature," and in the Tibetan context to the Great Perfection's (Dzogchen) inseparability of awareness and emptiness — both share the common doctrinal structure of "mind-nature intrinsically pure, luminosity inherently possessed," sharing the same root as the Tathāgatagarbha lineage; the Jonang school's "Zhentong" (emptiness of other) is Tibetan Buddhism's most thorough Tathāgatagarbha orthodoxy.
  topics:
  - title: 藏传大圆满（Dzogchen）
    title_en: The Tibetan Great Perfection (Dzogchen)
    body: |
      大圆满（佐巴钦波）为宁玛九乘之顶（阿底瑜伽），主张**心性本具光明自然智**；实修有**彻却**（立断）与**妥噶**（顿超）。
      隆钦巴（14世纪，无垢光尊者）著《七宝藏》集大成，建立龙钦心髓；吉美林巴（1729/30-1798）获其净相传承，撰《功德藏》。大圆满与汉地禅宗关系长期受讨论，隆钦巴本人有对和尚教法属上等根器者的阐述。
    en_body: |
      The Great Perfection (Dzogchen Chenpo) is the pinnacle of the Nyingma Nine Vehicles (Atiyoga), maintaining that **mind-nature intrinsically possesses luminous gnosis**; its practices include **Trekchö** (cutting through) and **Tögal** (leaping over).
      Longchenpa (14th century, the Omniscient One) authored the *Seven Treasuries*, bringing together the tradition in its fullest form and establishing the Longchen Nyingthig; Jigme Lingpa (1729 or 1730–1798) received its pure-vision transmission and composed the *Treasury of Qualities*. The relationship between the Great Perfection and Chinese Chan has long been discussed; Longchenpa himself articulated how the teachings of the "Monk" [Moheyan] are suited to practitioners of superior faculties.
    source: '中国西藏网《试论藏传佛教大圆满法与汉地禅的关系问题》(tibet.cn) · 《大圆满心性休息》讲解 (bicwny.com)'
  - title: 觉囊他空见 — 藏传如来藏正统论
    title_en: Jonang Zhentong — Tibetan Tathāgatagarbha Orthodoxy
    body: |
      觉囊派「**他空见**」（gzhan stong）：中观「诸法无自性」仅适用于世俗谛；与佛之无量功德无可异离的胜义谛应视为「他空」——所空者是客尘垢染。笃布巴·协饶坚赞（1292-1361）《山法了义海论》：「他空胜义谛常恒不变，周遍一切情器世界，**与如来藏同一意义**，在因位时即已本有。」
      觉囊以《如来藏经》等末转法轮为究竟了义；与格鲁自空见完全对立。多罗那他（1575-1643）著《印度佛教史》；五世达赖时卫藏觉囊遭禁绝，今存四川壤塘、青海果洛等传承。
    en_body: |
      The Jonang school's **"Zhentong"** (gzhan stong, emptiness of other): the Mādhyamaka principle of "all phenomena lack own-nature" applies only to the conventional truth; the ultimate truth, inseparable from the Buddha's infinite qualities, should be understood as "emptiness of other" — what is emptied is adventitious defilements. Dolpopa Sherab Gyaltsen (1292-1361), *The Mountain Dharma: Ocean of Definitive Meaning*: "The Zhentong ultimate truth is eternal and unchanging, pervading all sentient and material worlds, **identical in meaning with Tathāgatagarbha**, inherently present since the stage of causation."
      Jonang regards the *Tathāgatagarbha Sūtra* and other Third Turning sūtras as the definitive meaning; it stands in complete opposition to Gelug's emptiness-of-self view. Tāranātha (1575-1634) authored the *History of Buddhism in India*; during the Fifth Dalai Lama's era, Jonang in Ü-Tsang was suppressed, and its lineage now survives in Rangtang (Sichuan) and Golok (Qinghai).
    source: '土观《宗派源流》 · 沈卫荣主编《他空见与如来藏——觉囊派人物、教法、艺术和历史研究》(北京大学出版社)'
  - title: 汉地圆觉传统 — 宗密的圆满觉性
    title_en: The Chinese Complete Enlightenment Tradition — Zongmi's Perfect Awakened Nature
    body: |
      《圆觉经》：「知幻即离，不作方便；离幻即觉，亦无渐次。」
      宗密依《圆觉经》开悟（804年），判其教相：与终教「彼此克体全相摄属」（「此经亦依如来藏故」）、属大乘顿教、分摄圆教（有理事无碍、缺事事无碍）。
      核心命题：「**如来圆觉，妙心涅槃，即名佛性**」；「生本成佛，唯是《圆觉》《华严》」。与《华严》「虽文有广略，妙轨同侪」。
    en_body: |
      The *Sūtra of Complete Enlightenment*: "Knowing illusion, one is immediately free of it, without need for expedients; freed from illusion, one is awakened, with no sequence or stages."
      Zongmi achieved awakening through the *Sūtra of Complete Enlightenment* (804), classifying its doctrinal aspect as: substantially corresponding to the Complete Teaching ("this sūtra also relies on Tathāgatagarbha"), belonging to the Mahāyāna Sudden Teaching, and partially encompassing the Perfect Teaching (possessing the non-obstruction of principle and phenomena, but lacking the non-obstruction of phenomenon and phenomenon).
      Core propositions: "**The Tathāgata's Complete Enlightenment, the wondrous mind of Nirvāṇa — this is Buddha-nature**"; "Sentient beings are originally Buddhas, only in the *Sūtra of Complete Enlightenment* and the *Avataṃsaka*." Compared with the *Avataṃsaka*: "Although their texts differ in length, their wondrous track is the same."
    source: '宗密《圆觉经大疏》《圆觉经大疏钞》 · 董群《融合的佛教》第七章 (fjdh.cn) · 龚隽《从〈华严经〉到〈圆觉经〉：唐代华严教学中的经典转移》'

- id: japan
  title: 日本判教 — 显密二教与十住心
  title_en: Japanese Doctrinal Classification — Exoteric-Esoteric Duality and Ten Stages of Mind
  icon: 🗾
  intro: |
    日本佛教移植中国判教传统，称「教相判释」；空海《辨显密二教论》《十住心论》以密教为最高判摄，促成日本由奈良六宗式学派佛教向宗派佛教转化。
  intro_en: |
    Japanese Buddhism transplanted the Chinese tradition of doctrinal classification (kyōso hanshaku); Kūkai's *Discriminating Between the Exoteric and Esoteric Teachings* and *Treatise on the Ten Stages of Mind* placed esoteric Buddhism as the supreme classification, catalyzing Japan's transformation from the academic-school Buddhism of the Nara Six Sects toward sectarian Buddhism.
  topics:
  - title: 空海《辨显密二教论》— 显密二教判
    title_en: "Kūkai's *Discriminating Between Exoteric and Esoteric Teachings*"
    body: |
      空海（774-835）804年入唐，从青龙寺惠果受两部灌顶，为唐密第八祖；806年归国创真言宗。他入唐时中国尚无密教判教著作，其判教具开创性。
      《辨显密二教论》（二卷）：横向将全部佛法分为**显教与密教**——释迦等应化身所说为显教（浅显），《大日经》《金刚顶经》等大日如来法身所说为密教（秘奥）；主张「**显劣密胜**」，以六大（体）、四曼（相）、三密（用）为纲要，主张即身成佛。
    en_body: |
      Kūkai (774-835) entered Tang China in 804, receiving the two abhiṣekas from Huiguo at Qīnglóng Temple, becoming the eighth patriarch of Tang esoteric Buddhism; he returned to Japan in 806 and founded the Shingon school. At the time of his entry into China, there were no esoteric doctrinal classification works yet — his classification was pioneering.
      *Discriminating Between the Exoteric and Esoteric Teachings* (two fascicles): broadly dividing all Buddhist teachings into **exoteric (ken) and esoteric (mitsu)** — the teachings of Śākyamuni's incarnation bodies are exoteric (superficial), while the teachings of Vairocana's dharmakāya in the *Mahāvairocana Sūtra* and *Vajraśekhara Sūtra* are esoteric (profound); advocating **"exoteric is inferior, esoteric is superior,"** structured around the six elements (essence), four mandalas (characteristics), and three mysteries (function), and teaching attaining Buddhahood in this very body.
    source: '空海《辨显密二教论》(T77n2427) · 《弘法大师空海密教思想研究》 · 陕西佛教祖庭文化资料 (sxlib.org.cn)'
  - title: 《十住心论》— 九显一密
    title_en: "*Treatise on the Ten Stages of Mind* — Nine Exoteric, One Esoteric"
    body: |
      空海依《大日经·住心品》，将信奉者心境由浅入深分**十住心**：①异生羝羊心（凡夫）②愚童持斋心（儒教）③婴童无畏心（外道·老庄）④唯蕴无我心（声闻）⑤拔业因种心（缘觉）⑥他缘大乘心（法相宗）⑦觉心不生心（三论宗）⑧一道无为心（天台宗）⑨极无自性心（华严宗）⑩秘密庄严心（真言密宗）。
      前九为显教，唯第十为密教——「**九显一密**」；由此**真言第一、华严第二、天台第三、三论第四、法相第五**。
      学者指出此体系可与黑格尔《精神现象学》相比拟——描述人心逐渐升华的过程，而非单纯佛说顺序。
    en_body: |
      Based on the *Mahāvairocana Sūtra*'s "Chapter on the Stages of Mind," Kūkai divides the practitioner's mental state from shallow to deep into **Ten Stages of Mind**: (1) the mind of a sheep among the undisciplined (ordinary being); (2) the mind of a foolish child keeping precepts (Confucianism); (3) the mind of an infant without fear (heterodox schools · Laozi-Zhuangzi); (4) the mind of mere aggregates without self (Śrāvaka); (5) the mind of uprooting karmic seeds (Pratyekabuddha); (6) the mind of the other-dependent Mahāyāna (Consciousness-Only school); (7) the mind of awakened non-arising (Three Treatises school); (8) the mind of one path and non-action (Tiantai school); (9) the mind of ultimate non-own-nature (Huayan school); (10) the mind of esoteric splendor (Shingon esoteric school).
      The first nine are exoteric, only the tenth is esoteric — **"nine exoteric, one esoteric"**; hence **Shingon first, Huayan second, Tiantai third, Three Treatises fourth, Consciousness-Only fifth**.
      Scholars note that this system can be compared to Hegel's *Phenomenology of Spirit* — describing the process of the human mind's gradual elevation, rather than simply the order of the Buddha's teachings.
    source: '空海《秘密曼荼罗十住心论》《秘藏宝钥》(830年天长七年奉诏进献) · 《弘法大师空海密教思想研究》'
  - title: 日本诸家判教谱系
    title_en: Genealogy of Japanese Doctrinal Classifications
    body: |
      日本判教主要代表：真言**空海**显密二教判及十住心；台密**安然**五时五教；净土真宗**亲鸾**二双四重；**日莲**立「五纲」之说（从教、机、时、国、师法先后等角度判释佛法）。
      日莲宗与净土宗、净土真宗、时宗等同属镰仓新佛教——日本僧人依据汉译佛经和中国著作自创的民族宗派，适应武士和平民信仰需求。
      空海的判教促成日本佛教由奈良六宗式的学派佛教向宗派佛教转化，深刻影响平安后期佛教发展。
    en_body: |
      Major representatives of Japanese doctrinal classification: Shingon's **Kūkai** (exoteric-esoteric duality and ten stages of mind); Tendai-mitsu's **Annen** (five periods, five teachings); Jōdo Shinshū's **Hōnen and Shinran** (two pairs, four levels); **Nichiren** (established the "Five Standards," classifying the Buddha-dharma from the perspectives of teaching, capacity, time, land, and the sequence of teacher and dharma).
      The Nichiren school, along with Jōdo-shū, Jōdo Shinshū, and Jishū, belongs to the Kamakura New Buddhism — new national sects created by Japanese monks based on Chinese-translated sūtras and Chinese writings, adapted to the spiritual needs of warriors and commoners.
      Kūkai's doctrinal classification catalyzed Japan's transformation from the academic-school Buddhism of the Nara Six Sects toward sectarian Buddhism, profoundly influencing the development of Buddhism in the late Heian period.
    source: '末木文美士《日本佛教中判教(教判)的展开——经典解释的基础》 · 空海《辨显密二教论》'

- id: rujia
  title: 儒家判教传统 — 道统与学案
  title_en: Confucian Classification Tradition — Way-Thriving and Intellectual Lineages
  icon: 📜
  intro: |
    儒家虽不言「判教」，却有其结构对应物：韩非「儒分为八」的学派谱系、韩愈的「道统」说、汉宋之学案、今古文之辨、朱陆之辩——都是儒家版的「教相判释」与「互判」。
  intro_en: |
    Although Confucianism does not speak of "doctrinal classification," it possesses structural equivalents: Han Fei's "Confucianism divided into eight" school genealogies, Han Yu's "Way-Thriving" (daotong), the intellectual case-studies (xue'an) of Han and Song, the New vs. Old Texts controversy, and the Zhu-Lu debate — all are Confucian versions of doctrinal classification and mutual critique.
  topics:
  - title: 儒分为八 — 最早的学派谱系
    title_en: Confucianism Divided into Eight — The Earliest School Genealogies
    body: |
      《韩非子·显学》：「自孔子之死也，有子张之儒，有子思之儒，有颜氏之儒，有孟氏之儒，有漆雕氏之儒，有仲良氏之儒，有孙氏之儒，有乐正氏之儒。」
      韩非的判语：「孔墨之后，儒分为八，墨离为三，**取舍相反、不同，而皆自谓真孔墨**」——八派观点各异，却都自称孔门正宗。
      八派中影响最大者为孟氏（孟子）与孙氏（荀子，避汉宣帝讳称孙卿）；子思、孟子后世合称「思孟学派」；郭沫若认为应补子夏氏之儒（韩非因视法家出于子夏而剔除）。
    en_body: |
      *Han Feizi*, "Illustrated Learning": "Since the death of Confucius, there arose the Confucianism of Zizhang, the Confucianism of Zisi, the Confucianism of Yan clan, the Confucianism of Meng clan, the Confucianism of Qidiao clan, the Confucianism of Zhongliang clan, the Confucianism of Sun clan, and the Confucianism of Yuezheng clan."
      Han Fei's verdict: "After Confucius and Mozi, Confucianism split into eight and Mohism into three — **with opposing and divergent positions, yet all claiming to be the true Confucius or Mozi**" — eight schools with different views, all claiming to represent the orthodox Confucian lineage.
      Among the eight, the most influential were the Meng clan (Mencius) and Sun clan (Xunzi, called Master Sun to avoid the taboo of Emperor Xuan of Han); Zisi and Mencius were later collectively called the "Zisi-Mencius School"; Guo Moruo argued that the Zixia clan's Confucianism should be added (Han Fei excluded it because he regarded Legalism as deriving from Zixia).
    source: '《韩非子·显学》 · 刘泽华《中国文化发展中的「复古」迷思》(rujiazg.com) · 张岱年主编《孔子大辞典》'
  - title: 道统说 — 儒家的「判教大纲」
    title_en: The Way-Thriving — Confucianism's "Framework of Classification"
    body: |
      韩愈《原道》首次完整构建儒家「**道统**」：「尧以是传之舜，舜以是传之禹，禹以是传之汤，汤以是传之文武周公，文武周公传之孔子，孔子传之孟轲，**轲之死，不得其传焉**。」其构建目的是抗衡佛教，并极力推尊孟子。
      后世批评甚烈：康有为指斥「后世之道术不明统绪不著者，皆韩愈粗疏灭裂之罪」；近代经学史研究指出「从孔子直接到孟子」是韩愈之后的一套理论，不正确。朱熹虽称赞韩愈「有辟佛老之功」，却把续接道统之功归于周敦颐和二程。
    en_body: |
      Han Yu's "Essence of the Way" first fully constructed the Confucian **"Way-Thriving"** (daotong): "Yao transmitted it to Shun, Shun to Yu, Yu to Tang, Tang to King Wen and King Wu and the Duke of Zhou, King Wen and King Wu and the Duke of Zhou to Confucius, Confucius to Mencius — **after Mencius's death, it was not transmitted further.**" The purpose of its construction was to rival Buddhism, and to vigorously exalt Mencius.
      Later criticism was severe: Kang Youwei condemned "the failure of later ages to clarify the Way and make the lineage manifest was all the fault of Han Yu's carelessness and carelessness"; modern research on classical studies history indicates that the theory of "Confucius directly to Mencius" was a post-Han Yu construction and incorrect. Although Zhu Xi praised Han Yu for "having the merit of refuting Buddhism and Daoism," he attributed the merit of continuing the Way-Thriving to Zhou Dunyi and the Two Chengs.
    source: '韩愈《原道》 · 康有为对韩愈道统之批评 (ctext.org 皇朝经世文新编) · 近代经学史研究'
  - title: 今古文经学之争
    title_en: The New Texts vs. Old Texts Classics Controversy
    body: |
      秦焚书后，五经靠儒生记忆背诵流传，以汉隶书写，称**今文经学**；后孔子故居发现战国「蝌蚪文」儒经，刘歆加以整理，称**古文经学**——两派在文本与解读方法上均有差异。
      后经**郑玄**基本统一今古文，争议渐息；至清末疑古之风再起：康有为认为东汉以来经学多出刘歆伪造，乃新莽一朝之学，此说后被学者驳斥。
    en_body: |
      After the Qin burning of books, the Five Classics were transmitted through the memory and recitation of Confucian scholars, written in Han clerical script, called **New Text Confucianism**; later, Warring States "tadpole-script" Confucian texts were discovered in Confucius's former residence and edited by Liu Xin, called **Old Text Confucianism** — the two schools differed in both texts and interpretive methods.
      Later, **Zheng Xuan** basically unified the New and Old Texts, and the controversy gradually subsided; at the end of the Qing dynasty, the spirit of doubt rose again: Kang Youwei argued that most classical scholarship since the Eastern Han was forged by Liu Xin and constituted the learning of the Xin Mang dynasty, a claim later refuted by scholars.
    source: '中国经学史讲义 (book.douban.com) · 康有为《新学伪经考》之评述'
  - title: 朱陆鹅湖之会（1175）
    title_en: The Goose Lake Meeting of Zhu and Lu (1175)
    body: |
      淳熙二年（1175），吕祖谦约朱熹与陆九渊、陆九龄会于信州铅山鹅湖寺，「欲会归于一，而定所适从」。据陆门朱亨道记载：「元晦之意欲令人泛观博览而后归之约，二陆之意欲先发明人之本心而后使之博览。朱以陆之教人为太简，陆以朱之教人为支离。」
      陆九渊和诗：「**易简工夫终久大，支离事业竟浮沉**。」三年后朱熹和诗：「旧学商量加邃密，新知培养转深沉。」
      义理根源：朱熹「**性即理**」（理是客观实体，须格物穷理）；陆九渊「**心即理**」「宇宙即是吾心，吾心即是宇宙」（本心源出孟子四心）。黄宗羲总结：二人「同植纲常，同扶名教，同宗孔孟」。
      鹅湖之会开启了中国书院会讲与思辨探究的先河；1181年朱熹邀陆九渊白鹿洞讲「义利之辨」，刻石存之。
    en_body: |
      In the second year of Chunxi (1175), Lü Zuqian arranged a meeting between Zhu Xi and Lu Jiuyuan, Lu Jiuling at Goose Lake Temple in Yanshan, Xin Prefecture, "hoping to converge at one point and determine which path to follow." According to Lu's disciple Zhu Hengdao: "Zhu intended people to observe broadly and read extensively before converging on brevity; the Two Lus intended to first reveal the original mind and then have people read broadly. Zhu considered the Lu teaching too simplistic; Lu considered the Zhu teaching too fragmented."
      Lu Jiuyuan's responsive poem: "**The work of simplicity and directness ultimately endures and is great; the enterprise of fragmentation finally rises and falls.**" Three years later, Zhu Xi responded: "Discussing old learning, we add depth and precision; cultivating new knowledge, we turn toward profundity."
      Doctrinal roots: Zhu Xi's **"nature is principle"** (principle is an objective reality; one must investigate things to exhaust principle); Lu Jiuyuan's **"mind is principle"** — "The universe is my mind; my mind is the universe" (the original mind derives from Mencius's Four Beginnings). Huang Zongxi summarized: the two "together planted the bonds of Heaven and Earth, together upheld the teachings of names and roles, together revering Confucius and Mencius."
      The Goose Lake Meeting initiated the tradition of Chinese academy joint lectures and speculative inquiry; in 1181, Zhu Xi invited Lu Jiuyuan to lecture on "the distinction between righteousness and profit" at White Deer Grotto Academy, inscribing it on stone.
    source: '韩星《〈中庸〉「尊德性而道问学」章疏解》(rujiazg.com) · 中国孔子基金会「鹅湖之会」条目 (chinakongzi.org) · 《宋元学案·象山学案》'

- id: daojia
  title: 道家道教的判教
  title_en: Daoist and Daoism's Doctrinal Classification
  icon: 🎋
  intro: |
    中国最早的「学术判教」出自道家一脉：《庄子·天下》开学术史之先河，司马谈《论六家要指》创「以家论学」之法；道教则以「三洞四辅」七部体制组织全部经籍，并以《夷夏论》参与佛道互判。
  intro_en: |
    China's earliest academic classification originated from the Daoist lineage: Zhuangzi's "All Under Heaven" inaugurated the history of learning, Sima Tan's "Essentials of the Six Schools" created the method of discussing learning by "school"; Daoism organized all its scriptures through the seven-section "Three Caves, Four Supplements" system, and engaged in Buddhist-Daoist mutual critique through the *Treatise on Barbarians and Chinese*.
  topics:
  - title: 《庄子·天下》— 学术史开山
    title_en: Zhuangzi's "All Under Heaven" — The Inauguration of Intellectual History
    body: |
      《天下》篇被学界视为**中国学术史的开山之作**，对六经有经典评述：「《诗》以道志，《书》以道事，《礼》以道行，《乐》以道和，《易》以道阴阳，《春秋》以道名分。」
      熊十力推崇其「于六经各以一二字总括其旨，皆足以包通全经，含藏万理」，《论六经》实以《天下》篇为依据。
      庄子评诸子限于战国中期（儒墨道名各家），并感叹「**道术为天下裂**」——对诸子分流抱有失望，主张回归整全之道。
    en_body: |
      The "All Under Heaven" chapter is regarded by scholars as **the inauguration of Chinese intellectual history**, containing classic assessments of the Six Classics: "The *Odes* express intent; the *Documents* convey affairs; the *Rites* embody conduct; the *Music* achieves harmony; the *Changes* illuminate yin and yang; the *Spring and Autumn Annals* defines roles and status."
      Xiong Shili praised it for "using one or two words for each of the Six Classics to summarize their meaning, each sufficient to encompass the entire text and contain all principles"; his *On the Six Classics* was in fact based on the "All Under Heaven" chapter.
      Zhuangzi's evaluation of the Hundred Schools was limited to the mid-Warring States period (Confucianism, Mohism, Daoism, and the Names school), and he lamented that **"the Way has been torn apart under heaven"** — expressing disappointment at the fragmentation of the schools and advocating a return to the integral Way.
    source: '《庄子·天下》 · 熊十力《论六经》 · 论「九流十家」的建构历程——从《天下》篇到《汉志》(cqvip.com)'
  - title: 司马谈《论六家要指》— 以家论学之始
    title_en: Sima Tan's "Essentials of the Six Schools" — The Beginning of School-Based Learning
    body: |
      司马谈（约前165-前110，太史令）《论六家要指》仅千字左右，但**首次以「家」论学**：先秦多以人论学（荀子《非十二子》、庄子《天下》只评个人），司马谈始据「要旨」分「家」，首分诸子为**阴阳、儒、墨、名、法、道德六家**，并首次将「道家」作为学派论述。
      评判标准为「**务为治**」：「夫阴阳、儒、墨、名、法、道德，此务为治者也，直所从言之异路，有省不省耳。」学术立场上崇信黄老，欲以道家统摄诸子。
    en_body: |
      Sima Tan (c. 165-110 BCE, Grand Historian), "Essentials of the Six Schools," only about a thousand characters, but **the first to discuss learning by "school"**: Pre-Qin thought mostly discussed learning by individual (Xunzi's *Against the Twelve Masters*, Zhuangzi's "All Under Heaven" only evaluated individuals); Sima Tan first divided schools by their "essential meaning," initially dividing the Hundred Schools into **Yin-Yang, Confucian, Mohist, Names, Legalist, and Daoist — six schools**, and was the first to discuss "Daoism" as a school.
      The standard of evaluation was **"all aimed at governance"**: "Yin-Yang, Confucian, Mohist, Names, Legalist, Daoist — all aimed at governance; they differ only in the paths they take from speech, some more effective than others." His academic stance favored Huang-Lao, seeking to encompass the Hundred Schools under Daoism.
    source: '司马谈《论六家要指》(《史记·太史公自序》引) · 「务为治」——读司马谈《论六家要旨》(光明日报 2020-05-11)'
  - title: 《汉书·艺文志》九流十家
    title_en: The *Book of Han*'s "Nine Streams, Ten Schools"
    body: |
      刘歆《七略》→班固《汉书·艺文志》，在司马谈六家基础上扩展为「**九流十家**」，以六艺统摄诸子，附「诸子出于王官」说；并将司马谈所称「道家」降格为「杂家」。
      学界指出：「九流十家」之说并非对先秦思想的忠实还原，而是基于时代思潮与自身学术立场的**理论建构**。
    en_body: |
      Liu Xin's *Seven Summaries* → Ban Gu's *Book of Han, Treatise on Literature*, expanded Sima Tan's six schools into **"Nine Streams, Ten Schools,"** using the Six Classics to encompass the Hundred Schools, adding the theory that "the Hundred Schools all originated from official positions of the ancient kings"; and demoted Sima Tan's "Daoist" to the "Eclectic" school.
      Scholars note: the theory of "Nine Streams, Ten Schools" was not a faithful reconstruction of Pre-Qin thought, but rather a **theoretical construction** based on the intellectual currents and academic standpoint of its own era.
    source: '《汉书·艺文志·诸子略》 · 论「九流十家」的建构历程——从《天下》篇到《汉志》(cqvip.com)'
  - title: 道教三洞四辅 — 七部道书体制
    title_en: Daoism's Three Caves and Four Supplements — The Seven-Section Scripture System
    body: |
      刘宋**陆修静**奉敕作《三洞经书目录》，以「**三洞**」总括《上清经》（洞真）、《灵宝经》（洞玄）、《三皇经》（洞神）三大系统经书——以三洞总括各派经书是陆修静的创造，在融会各道派、使道教整体化规范化方面作用重大。
      但三洞不载《太清经》与《道德经》，遂「增四辅以益三洞」——**太清、太平、太玄、正一**四辅，成**七部**体制。陈国符《道藏源流考》考定：七部法始于《正一经》（创立者孟景翼），非孟法师《玉纬七部经书目》。
    en_body: |
      Liu Song's **Lu Xiujing**, by imperial command compiled the *Catalogue of the Three Cave Scriptures*, using the **"Three Caves"** to encompass the three great systems of scriptures: the *Shangqing* (Cave of Truth), *Lingbao* (Cave of Mystery), and *Sānhuáng* (Cave of the Spirit) — the use of Three Caves to encompass all schools' scriptures was Lu Xiujing's innovation, playing a major role in integrating the various Daoist lineages and making Daoism systematic and standardized.
      However, the Three Caves did not include the *Taiping* scriptures and the *Dàdé Jīng*, so he "added four supplements to enrich the Three Caves" — **Taiping, Taixuan, Zhengyi** — forming the **seven-section** system. Chen Guofu's *Research on the Origins of the Daoist Canon* established that the seven-section system originated with the *Zhengyi Scripture* (founded by Meng Jingyi), not with Master Meng's *Jade Essence Seven-Section Scripture Catalogue*.
    source: '陈国符《道藏源流考》 · 百年道学精华集成·经籍考古卷 (詹石窗总主编)'
  - title: 顾欢《夷夏论》— 佛道互判
    title_en: Gu Huan's *Treatise on Barbarians and Chinese* — Buddhist-Daoist Mutual Critique
    body: |
      顾欢（吴郡盐官人）作《夷夏论》（刘宋末年），核心论旨：
      • 「**道则佛也，佛则道也。其圣则符，其迹则反**」——二教圣道相符而教迹相反；
      • 「舟车均于致远，而有川陆之节」——佛道齐乎达化，而有夷夏之别，「舍华效夷」则悖德犯顺；
      • 优劣之辨：「佛教文而博，言华而引，经繁而显；道教质而精，言实而抑，经简而幽」；「佛是破恶之方，道是兴善之术」。
    en_body: |
      Gu Huan (of Yanuan, Wu Commandery) composed the *Treatise on Barbarians and Chinese* (late Liu Song dynasty), with core arguments:
      - **"The Dao is the Buddha, the Buddha is the Dao. Their sages correspond, but their traces are opposite"** — the two religions' sacred Ways correspond while their outward traces differ;
      - "Boats and carriages equally serve to go far, but there are the distinction of waterways and roads" — Buddhism and Daoism equally reach the transformation [of beings], but there is the distinction between barbarian and Chinese; "abandoning Chinese to emulate barbarian" would contravene virtue and transgress propriety;
      - On superiority and inferiority: "Buddhism is elegant and extensive, its language flowery and quotidian, its scriptures numerous and manifest; Daoism is plain and refined, its language factual and restrained, its scriptures simple and obscure"; "Buddhism is the method of breaking evil; Daoism is the art of promoting good."
    source: '顾欢《夷夏论》(《全齐文》卷二十二, 严可均辑)'

- id: world
  title: 世界宗教的判教
  title_en: Doctrinal Classification in World Religions
  icon: 🌍
  intro: |
    判教现象不限于佛教：基督教三大传统、伊斯兰教法学派、印度教六派哲学——各大宗教内部同样以「正统—异端」「教法—学派」的结构组织自我与他者。
  intro_en: |
    Doctrinal classification is not limited to Buddhism: the three major Christian traditions, Islamic jurisprudential schools, Hinduism's six philosophical systems — all major religions internally organize self and other through the structure of "orthodoxy-heresy" and "law-school."
  topics:
  - title: 基督教 — 三大传统与神学路线
    title_en: Christianity — Three Major Traditions and Theological Trajectories
    body: |
      基督教经历1054年东西教会分裂与1517年宗教改革，形成**天主教、东正教、新教**三大传统——各传统各有教义判准（教宗权威/大公传统/唯独圣经）。
      当代神学内部又有「判教」：分析哲学与大陆哲学的分野深刻影响神学——以耶鲁大学为中心的**后自由主义学派**（Lindbeck、Hans Frei、Stanley Hauerwas、Kathryn Tanner）在与分析哲学传统对话方面走得最远，主要借鉴**后期维特根斯坦**（《哲学研究》），而非以弗雷格、罗素为代表的分析哲学主流所继承的早期维特根斯坦（《逻辑哲学论》）；宗教哲学家如 Richard Swinburne（后皈依东正教）则为分析式宗教哲学的典范。
    en_body: |
      Christianity experienced the East-West Schism of 1054 and the Reformation of 1517, forming three major traditions: **Roman Catholicism, Eastern Orthodoxy, and Protestantism** — each with its own doctrinal authority (papal authority, the conciliar tradition, and sola scriptura).
      Contemporary theology has its own internal "classifications": the divide between analytic and continental philosophy profoundly impacts theology — the **post-liberal school** centered at Yale University (Lindbeck, Hans Frei, Stanley Hauerwas, Kathryn Tanner) has gone furthest in engaging the analytic philosophical tradition, drawing primarily on **later Wittgenstein** (*Philosophical Investigations*) rather than the early Wittgenstein (*Tractatus Logico-Philosophicus*) inherited by the analytic mainstream represented by Frege and Russell; the philosopher of religion Richard Swinburne (who later converted to Eastern Orthodoxy) exemplifies analytic philosophy of religion.
    source: 'St. Vladimir Theological Quarterly Vol. 47 Issue 2 (2003) (archive.org) — 分析哲学与大陆哲学在神学中的体现'
  - title: 伊斯兰 — 逊尼什叶与四大教法学派
    title_en: Islam — Sunnī-Shīʿa and the Four Schools of Jurisprudence
    body: |
      逊尼派与什叶派的分歧源于先知穆罕默德去世后**继承人问题**：多数人主张推选领导人（逊尼），另一些追随先知堂弟兼女婿阿里（什叶）。680年阿里之子侯赛因于卡尔巴拉遇难；第六任伊玛目贾法尔·萨迪克（卒765）的教义成为什叶**贾法里学派**的基础。
      逊尼派教法学派初期多达数百，至11世纪定型为**四大教法学派**：哈乃斐派（艾布·哈尼法，8世纪中叶，重类比推理「意见派」，奥斯曼帝国采纳，信众最多）、马立克派（马立克《穆宛塔》，重麦地那传统与公益）、沙斐仪派（兼采两长，确立四大法源：古兰/圣训/类比/公议）、罕百里派（重经典圣训，沙特主流）。
      什叶派教法学分**阿赫巴尔学派**与**乌苏勒学派**（现居主导，重当代权威教法学家决断）。
    en_body: |
      The Sunnī-Shīʿa division originated from the **question of succession** after the Prophet Muhammad's death: the majority advocated electing a leader (Sunnī), while others followed the Prophet's cousin and son-in-law ʿAlī (Shīʿa). In 680, ʿAlī's son Ḥusayn was killed at Karbalāʾ; the teachings of the sixth Imām Jaʿfar al-Ṣādiq (d. 765) became the foundation of the Shīʿa **Jaʿfarī school**.
      Sunnī jurisprudential schools initially numbered in the hundreds, crystallizing by the 11th century into **four major schools**: Ḥanafī (Abū Ḥanīfa, mid-8th century, emphasizing analogical reasoning, the "opinion school," adopted by the Ottoman Empire, the largest following); Mālikī (Mālik's *Muwaṭṭaʾ*, emphasizing Medinan tradition and public interest); Shāfiʿī (synthesizing both approaches, establishing the four sources of law: Qurʾān, Sunna, analogy, and consensus); Ḥanbalī (emphasizing scripture and hadith, dominant in Saudi Arabia).
      Shīʿa jurisprudence divides into the **Akhbārī** and **Uṣūlī** schools (the latter currently dominant, emphasizing the rulings of contemporary authoritative jurists).
    source: 'Schacht, Joseph. "Fiqh." Encyclopædia of Islam, Second Edition. Brill, 1965. · Hallaq, Wael B. A History of Islamic Legal Theories. Cambridge UP, 1997.'
  - title: 印度教 — 六派哲学与不二论
    title_en: Hinduism — Six Philosophical Schools and Non-Dualism
    body: |
      印度古代哲学按对待吠陀权威的态度分**正统派与非正统派**（异流三派：顺世论、耆那教、佛教）。尊奉吠陀的**六派哲学**：
      ①数论派（迦毗罗，《数论颂》——神我Purusha与自性Prakriti二原理）②瑜伽派（巴丹阇梨《瑜伽经》）③正理派（乔达摩《正理经》，重逻辑）④胜论派（羯那陀《胜论经》，六句义）⑤弥曼差派（耆米尼《弥曼差经》，重祭祀）⑥吠檀多派（巴达罗耶那《梵经》，「梵我一元论」，印度哲学主流）。
      **商羯罗**复兴吠檀多**不二论**：「梵我不二」——事物与梵不二，梵的幻力（无明）使人执差别，消除无明即解脱。
    en_body: |
      Indian ancient philosophy is divided by attitude toward Vedic authority into **orthodox (āstika) and heterodox (nāstika)** (the three heterodox schools: Cārvāka, Jainism, Buddhism). The **six orthodox schools** that follow the Vedas:
      (1) Sāṃkhya (Kapila, *Sāṃkhyakārikā* — Purusha and Prakriti as two principles); (2) Yoga (Patañjali, *Yoga Sūtra*); (3) Nyāya (Gaupama, *Nyāya Sūtra*, emphasizing logic); (4) Vaiśeṣika (Kaṇāda, *Vaiśeṣika Sūtra*, six categories); (5) Mīmāṃsā (Jaimini, *Mīmāṃsā Sūtra*, emphasizing ritual); (6) Vedānta (Bādarāyaṇa, *Brahma Sūtra*, "Brahman-Ātman monism," the mainstream of Indian philosophy).
      **Śaṅkara** revived Vedānta **Advaita** (non-dualism): "Brahman and Ātman are non-dual" — phenomena and Brahman are non-dual; Brahman's power of māyā (ignorance) causes attachment to differentiation; the elimination of ignorance is liberation.
    source: '姚卫群编译《古印度六派哲学经典》(商务印书馆2003) · 木村泰贤《印度六派哲学》(2022中译本)'
  - title: 犹太教 — 从圣殿祭司到拉比诸派
    title_en: Judaism — From Temple Priesthood to Rabbinic Schools
    body: |
      犹太教的「判教」以**谁是正典、谁有权威**为核心：第二圣殿时期已有**法利赛派（Pharisees）、撒都该派（Sadducees）、艾赛尼派（Essenes）**并立——法利赛重口传律法与会堂教育，撒都该只认成文律法（摩西五经），艾赛尼为苦修团体。公元70年圣殿被毁后，拉比犹太教取代祭司阶层成为正统。
      中世纪起拉比内部亦有「教派」判分：**卡拉派（Karaism）** 只认《塔纳赫》字面、拒斥口传《塔木德》，与拉比正统激烈对立。近现代则有**改革派（Reform）、保守派（Conservative）、正统派（Orthodox）** 三分——正统派以《托拉》与《塔木德》为绝对权威，改革派主张顺应现代性调整律法，保守派居中，犹太大屠杀后又有**哈西德派（Hasidism）** 复兴运动。其判教张力集中于：律法（Halakha）的权威与开放之间、选民观念与普世价值之间。
    en_body: |
      Judaism's "classification" centers on **who holds canonical authority**: during the Second Temple period **Pharisees, Sadducees, and Essenes** coexisted — the Pharisees emphasized oral law and synagogue education, the Sadducees recognized only the written law (Torah), and the Essenes were an ascetic community. After the Temple's destruction in 70 CE, Rabbinic Judaism replaced the priesthood as orthodoxy.
      From the Middle Ages onward, internal "sectarian" divisions arose: **Karaism** accepted only the literal *Tanakh*, rejecting the oral *Talmud*, in sharp conflict with rabbinic orthodoxy. The modern era brought the tripartite division of **Reform, Conservative, and Orthodox** Judaism — Orthodoxy treats the Torah and Talmud as absolute authorities, Reform urges adapting law to modernity, Conservatism stands between, and the **Hasidic** revival movement arose after the Holocaust. The classificatory tension centers on the authority and openness of law (Halakha), and between chosenness and universalism.
    source: 'Cohen, Shaye J. D. From the Maccabees to the Mishnah (1987) · 《塔木德》· Britannica (Judaism)'
  - title: 耆那教 — 白衣派与天衣派
    title_en: Jainism — Śvetāmbara and Digambara
    body: |
      耆那教以**大雄（Mahāvīra，约前6世纪，与佛陀同时）**为第24位（最后一位）渡者（Tīrthaṅkara）。其「判教」体现为**白衣派（Śvetāmbara，穿白衣）与天衣派（Digambara，露天不著衣）**的分裂——尤以**「女性能否得解脱」**为焦点：天衣派认为女身不得解脱（须转男身），白衣派认为可以；两派对成为大雄的经典《阿笈摩》（Āgama）的收集与保存也有分歧。此外有**非全能神**教义与对灵魂（jīva）、业（karma）、非暴力（ahiṃsā）的普遍坚持，成为区别于印度的判教标志。
    en_body: |
      Jainism regards **Mahāvīra** (c. 6th century BCE, contemporary of the Buddha) as the 24th and last **Tīrthaṅkara** (ford-crosser). Its "classification" is embodied in the split between the **Śvetāmbara** (white-clad) and **Digambara** (sky-clad, naked) traditions — focused especially on **whether women can attain liberation**: the Digambaras hold that a female body cannot attain liberation (one must be reborn male), while the Śvetāmbaras hold it can; the two also diverge over the compilation and preservation of the Āgama scriptures. There is also the doctrine of a **non-omnipotent deity**, alongside universal adherence to the soul (jīva), karma, and non-violence (ahiṃsā), which serve as distinct markers of Jain orthodoxy within India.
    source: 'Dundas, Paul. The Jains (Routledge, 2002) · 杜德《耆那教》(中译本) · Britannica (Jainism)'
  - title: 琐罗亚斯德教 — 二元论与「异端」之争
    title_en: Zoroastrianism — Dualism and the "Heresy" Debates
    body: |
      琐罗亚斯德教（祆教/拜火教）以先知**琐罗亚斯德（Zarathustra/Zoroaster，约前1200-前1000或更早）**创教。其核心教义为**善恶二元论**——善神阿胡拉·马兹达（Ahura Mazda）与恶灵安格拉·迈纽（Angra Mainyu）相对立，人须在善与恶之间抉择（自由意志）。其「判教」体现为对**正统（雅斯那 Yasna 祭祀体系与祭司 Mobed 阶层的仪轨）**的坚持，以及对**异端（如 Mazdakism，5-6世纪主张财产与妇女公有、反对琐罗亚斯德教的等级制度）**的否认与清除。阿契美尼德与萨珊王朝以之立为国教，其善恶对立的宇宙观深刻影响后来的诺斯替主义与犹太-基督-伊斯兰的天使/魔鬼观念。
    en_body: |
      Zoroastrianism (Mazdaism — fire-worship) was founded by the prophet **Zarathustra — Zoroaster** (c. 1200-1000 BCE or earlier). Its core teaching is **ethical dualism** — the good god Ahura Mazda opposes the evil spirit Angra Mainyu, and humans must choose between good and evil (free will). Its "classification" lies in adherence to **orthodoxy** (the Yasna sacrificial system and the ritual hierarchy of the Mobed priesthood) versus the denial and purging of **heresies** (such as Mazdakism, which in the 5th-6th centuries advocated communal property and women, and rejected the Zoroastrian hierarchy). Adopted as the state religion under the Achaemenid and Sasanian empires, its cosmic good-evil opposition profoundly influenced later Gnosticism and the angel-and-demon concepts of Judaism, Christianity, and Islam.
    source: 'Boyce, Mary. Zoroastrians: Their Religious Beliefs and Practices (Routledge, 1979) · Britannica (Zoroastrianism)'
  - title: 锡克教 — 祖师传承与「卡尔萨」正统
    title_en: Sikhism — Guru Succession and the Khālsā Orthodoxy
    body: |
      锡克教由**那纳克（Guru Nanak，1469-1539）**创立，信仰「一神、多显」（Ek Onkar）。其「判教」结构在于**「上师（Guru）」的传承谱系**——连续十位上师（Guru Nanak 至 Guru Gobind Singh），并以「古鲁·格兰特·萨希卜」（Guru Granth Sahib，圣典）为第十一位永恒的「上师经典」。1699年**卡尔萨（Khālsā）**体制确立——由第十位上师确立正统的受洗锡克身份（守五戒、持五K标识），并规定唯一正统教义，从而界定了「谁是锡克」。其判教以「神之名（Nām）」的虔信与对种姓的超越为核心。
    en_body: |
      Sikhism was founded by **Guru Nanak** (1469-1539), professing "one God, many names" (Ek Onkar). Its "classificatory" structure lies in the **lineage of Gurus** — ten successive Gurus (from Guru Nanak to Guru Gobind Singh) — with the scripture **Guru Granth Sahib** as the eleventh, eternal "Guru-book." In 1699 the **Khālsā** order was established — the tenth Guru defined the orthodox baptized Sikh identity (observing the five k's and the five prohibitions) and established sole orthodoxy, thereby defining "who is a Sikh." Its classification centers on devotion to the Divine Name (Nām) and the transcendence of caste.
    source: 'McLeod, W. H. Who Is a Sikh? (1989) · Singh, Patwant. The Sikhs (1999) · Britannica (Sikhism)'
  - title: 巴哈伊信仰 — 诸宗教同源的「超判教」
    title_en: The Baháʼí Faith — "Meta-Classification" of Religious Unity
    body: |
      巴哈伊信仰（1844年起源于巴孛，后由**巴哈欧拉 Baháʼuʼlláh（1817-1892）**确立）在诸宗教中独具「超判教」性格：它**不把自身判为唯一、而主张一切伟大宗教同源**——认为亚伯拉罕诸教、佛教、印度教、琐罗亚斯德教等皆是「上帝渐进启示」在不同时代、不同文明中的相继显现，故宗教本质统一、只是外在教法与习俗相异。这一立场以「宗教的渐进性（Progressive Revelation）」消解了传统「唯我独尊」的判教，而代之以「诸宗教皆为同一真理的不同容器」的统一论——其本身亦是一种更高层的判摄（把诸教安放在时间性的启示阶梯上）。
    en_body: |
      The Baháʼí Faith (originating in 1844 with the Báb, established by **Baháʼuʼlláh**, 1817-1892) possesses a uniquely "meta-classificatory" character among religions: rather than judging itself as exclusively true, it **affirms the common origin of all great religions** — regarding the Abrahamic religions, Buddhism, Hinduism, and Zoroastrianism as successive manifestations of God's progressive revelation in different ages and civilizations, so that religions are essentially one and differ only in outward law and custom. This position uses **Progressive Revelation** to dissolve the traditional exclusivist classification, replacing it with a unitive theory that all religions are vessels of the same Truth — itself a higher-order classification that places all religions on a temporal ladder of revelation.
    source: '巴哈欧拉《隐言经》《亚格达斯经》(中译本) · Britannica (Bahāʾī Faith)'

- id: academic
  title: 学术与哲学流派的判教
  title_en: Doctrinal Classification in Academic and Philosophical Schools
  icon: 🎓
  intro: |
    学术界同样有自己的「判教」：司马谈六家、汉志九流是其古典形态；现代则有分析哲学与大陆哲学的分野、1923年科玄论战、库恩的「范式」之争。
  intro_en: |
    Academia has its own "classifications" as well: Sima Tan's six schools and the *Book of Han*'s nine streams are their classical forms; the modern era features the analytic-continental philosophy divide, the 1923 Science-Metaphysics Controversy, and Kuhn's "paradigm" debates.
  topics:
  - title: 分析哲学与大陆哲学的分野
    title_en: The Divide Between Analytic and Continental Philosophy
    body: |
      20世纪哲学最大的「判教」是**分析哲学**与**大陆哲学**的分野。有中国学者将其放大为世界三种文化、三种哲学的划分：西方思维是分析思维→**分析哲学**；印度和阿拉伯思维是辩证思维→**宗教哲学**（与宗教传统紧密相连）；中国思维是综合思维→（被称）模糊哲学。该说主张中国哲学应汲取分析哲学之长以弥补分析思维的不足，同时汲取宗教哲学之长以弥补精神信仰的不足。
    en_body: |
      The greatest "classification" of 20th-century philosophy is the divide between **analytic philosophy** and **continental philosophy**. Some Chinese scholars have expanded this into a tripartite division of world cultures and philosophies: Western thinking is analytical → **analytic philosophy**; Indian and Arab thinking is dialectical → **religious philosophy** (closely linked with religious traditions); Chinese thinking is synthetic → (labeled) vague philosophy. This view advocates that Chinese philosophy should absorb the strengths of analytic philosophy to compensate for its lack of analytical thinking, while also absorbing the strengths of religious philosophy to compensate for its deficiency in spiritual faith.
    source: '《中国哲学向何处去？——兼论世界三种文化、三种哲学》(河北学刊 2007年06期, cnki)'
  - title: 科玄论战（1923）— 科学主义的判教
    title_en: The Science-Metaphysics Controversy (1923) — Scientism's Classification
    body: |
      1923年2月张君劢清华演讲《人生观》，提出科学与人生观**五点差异**（客观/主观、推理/直觉、分析/综合、因果律/自由意志、想象统一/人格单一），结论「科学无论如何发达，而人生观问题之解决，决非科学所能为力」。
      丁文江在《努力周报》发表《玄学与科学——评张君劢的〈人生观〉》，斥其为「玄学鬼」附身。论战形成**科学派**（丁文江、胡适、吴稚晖）、**玄学派**（张君劢、梁启超、张东荪）、**唯物史观派**（陈独秀、瞿秋白）三大阵营；1918年梁启超《欧游心影录》「科学万能之梦」的反思是玄学派的思想背景。
      刘钝（2023）指出：今日中国思想界三种主要思潮——马克思主义、自由主义、文化保守主义——在科玄论战中均可觅到踪影。
    en_body: |
      In February 1923, Zhang Junmai delivered a lecture at Tsinghua titled "Views on Life," proposing **five points of difference** between science and views on life (objective vs. subjective, reasoning vs. intuition, analysis vs. synthesis, causality vs. free will, imaginative unity vs. personal individuality), concluding that "however much science develops, the resolution of questions about views on life is by no means something science can accomplish."
      Ding Wenjiang published "Metaphysics and Science — A Critique of Zhang Junmai's 'Views on Life'" in the *Striving Weekly*, condemning him as possessed by a "metaphysics ghost." The controversy formed three camps: **the Science camp** (Ding Wenjiang, Hu Shi, Wu Zhihui), **the Metaphysics camp** (Zhang Junmai, Liang Qichao, Zhang Dongsun), and **the Historical Materialism camp** (Chen Duxiu, Qu Qiubai); Liang Qichao's 1918 *Reflections on a European Journey* and his "dream of science's omnipotence" provided the intellectual background for the Metaphysics camp.
      Liu Dun (2023) noted: the three main intellectual currents in contemporary China — Marxism, liberalism, and cultural conservatism — can all trace their origins to the Science-Metaphysics Controversy.
    source: '林毓生《民初「科学主义」的兴起与含意》(aisixiang.com) · 刘钝《「科玄论战」百年：回顾与展望》(ucas.edu.cn 2023) · 维基文库《丁文江的传记·〈玄学与科学〉的论争(1923)》'
  - title: 库恩「范式」— 科学界的判教模型
    title_en: Kuhn's "Paradigm" — Classification Model for Science
    body: |
      库恩1962年《科学革命的结构》创立**历史主义学派**，提出「**范式**」转换理论：科学共同体遵循「前科学—常规科学—危机—革命—新的常规科学」的周期性结构；科学革命本质是「范式转换」。
      **不可通约性**：不同范式下的科学语言无法完全互译（库恩强调「不可通约不是不可比」）。
      批判方：波普尔（《常规科学及其危险》，抨击其相对主义）、拉卡托斯（「不可能有什么逻辑，只有发现的心理学」）、沃特金斯（科学共同体「类似宗教团体」）——1965年伦敦国际科学哲学研讨会为集中爆发点。拉卡托斯另立「**科学研究纲领**」（硬核、保护带、启示规则）以保留科学的合理性。
    en_body: |
      Kuhn's 1962 *The Structure of Scientific Revolutions* established the **historicist school**, proposing the theory of **"paradigm"** shifts: the scientific community follows the cyclical structure of "pre-science → normal science → crisis → revolution → new normal science"; the essence of scientific revolution is "paradigm shift."
      **Incommensurability**: the scientific language of different paradigms cannot be fully translated into one another (Kuhn emphasized "incommensurability is not incomparability").
      Criticism came from: Popper (*Normal Science and Its Dangers*, attacking its relativism), Lakatos ("there can be no logic, only the psychology of discovery"), Watkins (the scientific community "resembles a religious order") — the 1965 London International Colloquium in the Philosophy of Science was the focal point of eruption. Lakatos independently established **"Scientific Research Programmes"** (hard core, protective belt, heuristic rules) to preserve the rationality of science.
    source: '方在庆《库恩的身份认同——纪念〈科学革命的结构〉问世50周年》(philosophychina.cssn.cn) · Masterman, Margaret. "The Nature of a Paradigm." In Criticism and the Growth of Knowledge, ed. Lakatos & Musgrave. Cambridge UP, 1970.'

- id: tech
  title: 科技圈的判教 — 范式与路线之争
  title_en: Classification in the Technology Sector — Paradigms and Route Wars
  icon: 🔭
  intro: |
    科技圈的分派与互判同样激烈：量子力学诠释之争、量子引力三大路线之争、AI三大学派之争——各自有「本体论立场」与「究竟方案」，与判教结构高度同构。
  intro_en: |
    Factions and mutual critiques in the technology sector are equally intense: the controversy over quantum mechanics interpretations, the three-route competition in quantum gravity, the three major schools of AI — each possessing "ontological standpoints" and "ultimate solutions," structurally isomorphic with doctrinal classification.
  topics:
  - title: 玻尔与爱因斯坦 — 量子诠释之争
    title_en: Bohr vs. Einstein — The Quantum Interpretation Controversy
    body: |
      爱因斯坦与玻尔围绕量子力学展开**三次论战**（测不准原理两次 + EPR）。1935年EPR论文借复合系统思想实验论证量子力学「并不为物理实在提供一个完全的描述」；玻尔在35天后即致信《自然》并以同标题发文回应，说明EPR所提问题是一切量子现象所共有。
      李田（2011）指出：爱因斯坦—玻尔之争是20世纪物理学史经典案例——「重大科学革命的科学争论背后必定是最根本的哲学问题之争」。
      当代诠释分裂更甚：范·弗拉森模态诠释、Fuchs的QBism、哥本哈根诠释、多世界诠释并存，量子信息学家Adán Cabello称诠释争论领域为「**疯狂地图**」（a map of madness）。
    en_body: |
      Einstein and Bohr conducted **three rounds of debate** on quantum mechanics (twice on the uncertainty principle + EPR). The 1935 EPR paper used a thought experiment with composite systems to argue that quantum mechanics "does not provide a complete description of physical reality"; Bohr wrote to *Nature* within 35 days and published a response under the same title, demonstrating that the EPR problem was common to all quantum phenomena.
      Li Tian (2011) noted: the Einstein-Bohr controversy is a classic case in the history of 20th-century physics — "Behind the scientific debate over a major scientific revolution, there must be a contest of the most fundamental philosophical questions."
      Contemporary interpretations are even more fragmented: van Fraassen's modal interpretation, Fuchs's QBism, the Copenhagen interpretation, the many-worlds interpretation all coexist; quantum information theorist Adán Cabello calls the field of interpretive controversy a **"map of madness."**
    source: '李田《科学争论中的逻辑推理——量子革命中的爱因斯坦-玻尔论战》(《自然辩证法研究》2011) · arXiv:2101.00255 Bohr''s Anti-Realist Realism (ar5iv.labs.arxiv.org)'
  - title: 量子引力三大路线 — 三种世界观
    title_en: Three Routes to Quantum Gravity — Three Worldviews
    body: |
      量子引力竞争的三大路径：**弦理论**（高维几何框架——「几何本体论」）、**圈量子引力**（自旋网络方案——「关系本体论」）、**信息基础论**（量子信息编码——「信息本体论」）。
      该研究认为：量子引力理论的竞争「本质上是三种世界观之争」，各路线表面上互不相容，但「可能各自捕获了真理的不同侧面」——多元竞争最终或走向统一；并展望「时空本身作为计算资源」的可能性。
    en_body: |
      The three competing routes to quantum gravity: **string theory** (higher-dimensional geometric framework — "geometric ontology"), **loop quantum gravity** (spin-network approach — "relational ontology"), and **information foundations** (quantum information encoding — "informational ontology").
      This research argues: the competition among quantum gravity theories is "essentially a competition among three worldviews" — the routes appear mutually incompatible, but "may each capture a different facet of the truth" — pluralistic competition may eventually converge toward unity; and it envisions the possibility of "spacetime itself as a computational resource."
    source: '《第五章：引力理论的未来图景——黑洞信息悖论与量子引力：万物理论的前哨战》(aiknowledge.cn)'
  - title: AI三大学派 — 符号·连接·行为
    title_en: The Three Major Schools of AI — Symbolic, Connectionist, Behaviorist
    body: |
      人工智能学界形成**三大学派**：「符号主义研究抽象思维，连接主义研究形象思维，行为主义研究感知思维」。
      • **符号主义**（智能即程序）：源于数理逻辑；西蒙、麦卡锡、纽厄尔、费根鲍姆；里程碑：LT逻辑理论机（1956）→专家系统DENTRAL（1968）→「深蓝」战胜卡斯帕罗夫（1997）；长期主导AI。
      • **连接主义**（智能即仿生）：源于仿生学；术语由赫布1940年代提出；里程碑：MP模型（1943）→感知机（1957）→反向传播（1986）→辛顿深度信念网络（2006）→深度学习；DeepSeek（2024）降低成本。
      • **行为主义**（智能即控制）：源于40-50年代控制论；重感知与行动，不需知识表示；代表：布鲁克斯六足行走机器人；影响强化学习。
      三派形成是还原论「分而治之」的结果（仿功能→符号主义，仿结构→连接主义，仿行为→行为主义）；当前趋势是**三派深度融合**（ChatGPT、Sora、DeepSeek推动感知→认知、专用→通用）。
    en_body: |
      The AI community has formed **three major schools**: "Symbolic AI studies abstract thinking; connectionism studies imagistic thinking; behaviorism studies perceptual thinking."
      - **Symbolism** (intelligence is program): originating from mathematical logic; Simon, McCarthy, Newell, Feigenbaum; milestones: LT Logic Theorist (1956) → expert system DENTRAL (1968) → "Deep Blue" defeating Kasparov (1997); long dominated AI.
      - **Connectionism** (intelligence is biomimicry): originating from bionics; the term coined by Hebb in the 1940s; milestones: McCulloch-Pitts model (1943) → Perceptron (1957) → backpropagation (1986) → Hinton's deep belief networks (2006) → deep learning; DeepSeek (2024) reduced costs.
      - **Behaviorism** (intelligence is control): originating from 1940s-50s cybernetics; emphasizing perception and action, no need for knowledge representation; exemplar: Brooks' hexapod walking robot; influenced reinforcement learning.
      The three schools emerged from reductionist "divide and conquer" (mimicking function → symbolism, mimicking structure → connectionism, mimicking behavior → behaviorism); the current trend is **deep integration of all three** (ChatGPT, Sora, DeepSeek driving perception → cognition, specialized → general).
    source: '《人工智能三大学派的理论分野》(中国社会科学报 2025-05-22, cssn.cn)'

- id: masters
  title: 海云·成观两位法师的阐释与评述
  title_en: Expositions and Commentaries by Haiyun Jimeng and Chengguan
  icon: 🌊
  intro: |
    两位法师分属贤首宗第四十二世（海云继梦，贤首兼慈恩宗高原法系）与贤首兼慈恩宗第四十二世（成观法师，天台出家·东密阿阇梨·曹洞传人），对判教互判议题各有系统的宗内评述。
  intro_en: |
    These two masters belong respectively to the forty-second generation of the Xianshou lineage (Haiyun Jimeng, Xianshou and Yogācāra lineage via the Gaoyuan dharma-system) and the forty-second generation of the Xianshou-Yogācāra lineage (Chengguan, ordained in the Tiantai tradition, Shingon ācārya, Caodong lineage), each offering systematic intra-school expositions on the topic of doctrinal classification and mutual critique.
  topics:
  - title: 海云法师：空有性在华严判教中的位置
    title_en: "Haiyun Jimeng: The Position of Emptiness, Existence, and Nature in Huayan Classification"
    body: |
      《四十华严讲记》第12讲：唯识／法相宗＝大乘始教（修真空观）；性宗＝大乘终教、真性宗＝大乘顿教（理事无碍观）；华严本宗＝法界宗（周遍含容观）。
      华严的包容性相当大，但从批判的角度看，要求又极为严格。
    en_body: |
      *Lecture on the Forty-Fascicle Avataṃsaka*, Lecture 12: Consciousness-Only (Dharmalakṣaṇa) school = Initial Mahāyāna Teaching (practicing contemplation of true emptiness); Nature school = Complete Mahāyāna Teaching, True Nature school = Sudden Mahāyāna Teaching (contemplation of non-obstruction of principle and phenomena); Huayan's own school = Dharmadhātu school (contemplation of all-pervasive all-inclusive interpenetration).
      Huayan's inclusiveness is quite vast, but from a critical perspective, its requirements are extremely rigorous.
    source: '海云继梦《四十华严讲记》第一卷 第12讲 (fjdh.cn)'
  - title: 海云法师：唯识与唯性的判摄总纲
    title_en: "Haiyun Jimeng: The General Framework of Consciousness-Only and Nature-Only"
    body: |
      「唯识」研究**缘起法界**（如《地藏经》「起心动念无不是业无不是罪」），法印苦空无常无我，目标寂灭涅槃；「唯性」契**性起法界**，破一分无明证一分法身，目标常乐我净，涅槃后依体起用饶益众生。
      修行必须「转唯识成唯性」——苦空无常无我只是达到常乐我净的媒介和过渡。
    en_body: |
      "Consciousness-Only" studies the **dharma-realm of dependent origination** (as in the *Kṣitigarbha Sūtra*: "Every thought and intention is karma and transgression"); its dharma-seals are suffering, emptiness, impermanence, and non-self, with the goal of Nirvāṇic cessation. "Nature-Only" accords with the **dharma-realm of nature-arising**, breaking one portion of ignorance to realize one portion of the dharmakāya, with the goal of eternal bliss, true self, and purity — after Nirvāṇa, functioning from the essence to benefit sentient beings.
      Cultivation must "transform Consciousness-Only into Nature-Only" — suffering, emptiness, impermanence, and non-self are merely the medium and transition to reach eternal bliss, true self, and purity.
    source: '海云继梦《菩萨问明品讲记》第二章 (wuming.xuefo.net)'
  - title: 海云法师：语言模式论
    title_en: "Haiyun Jimeng: On Modes of Language"
    body: |
      《华严金狮子章讲记》第十一：「法相宗有法相宗的语言模式，法性宗有法性宗的语言模式，**空宗有空宗的语言模式，性宗有性宗的语言模式**」，须透过华严宗的语言模式才能了解华严论文背后的整个状态。
      本体层层递进：金性是本体→空性是本体→空性、佛性、法性皆本体则空性又成相。以六相圆融看世间即转「法界」，本来寂灭，一真法界。
    en_body: |
      *Lecture on the Huayan Golden Lion Chapter*, Lecture 11: "The Dharmalakṣaṇa school has the Dharmalakṣaṇa school's mode of language; the Nature school has the Nature school's mode of language; **the Emptiness school has the Emptiness school's mode of language; the Nature school has the Nature school's mode of language**" — one must penetrate through the Huayan school's mode of language to understand the entire state behind the Huayan treatises.
      The essence progresses layer upon layer: gold-nature is the essence → emptiness-nature is the essence → when emptiness-nature, Buddha-nature, and dharma-nature are all the essence, emptiness-nature itself becomes a characteristic. Contemplating the world through the six aspects' perfect interfusion turns it into the "dharmadhātu" — originally quiescent and ceased, the One True Dharmadhātu.
    source: '海云继梦《华严金狮子章讲记》第十一 ([wuming.xuefo.net](http://wuming.xuefo.net/nr/7/70462.html))'
  - title: 海云法师：一佛乘的现代判摄
    title_en: "Haiyun Jimeng: The Modern Classification of the One Buddha Vehicle"
    body: |
      修行四阶次：小乘（出离心/出离道）→ 中乘（缘觉）→ 菩萨乘（波罗蜜乘）→ **普贤乘**（华严不共别圆，最高）。
      共同圆教只强调到菩萨行；不共别圆强调普贤行、普贤心、普贤乘——「不可思议的解脱境界」，与三乘完全无关。
    en_body: |
      The four stages of practice: Hīnayāna (renunciation — the path of renunciation) → Middle Vehicle (Pratyekabuddha) → Bodhisattva Vehicle (Pāramitā Vehicle) → **Samantabhadra Vehicle** (Huayan's Non-Shared Distinctive Perfect, the highest).
      The Shared Perfect Teaching only emphasizes up to the Bodhisattva practices; the Non-Shared Distinctive Perfect emphasizes the Samantabhadra practices, Samantabhadra mind, Samantabhadra Vehicle — the "ineffable realm of liberation," entirely unrelated to the three vehicles.
    source: '海云继梦《三圣圆融观》 (fjdh.cn)'
  - title: 成观法师：性相不二、诸宗圆融
    title_en: "Chengguan: Non-Duality of Nature and Phenomena, Perfect Fusion of All Schools"
    body: |
      • 性相二宗如鸟之双翼，相辅相成；《起信论》是「小本的《楞伽经》」，性相圆融；
      • 解深密经、华严经、密严经、楞伽经四部皆是「性相圆融」经典，且同为显密二教所共尊；
      • 达摩以《楞伽经》印心（六祖始改为《金刚经》），禅宗正法眼藏原本「性相不分、显密不分」；后世分门修学是因众生根器转钝，「**并非法本有分派，而实系人根转浅所致**」；
      • 性相融会即「如来知见」——学性者不解相、学相者不了性是学佛最大难题之一；「执摸象之解」而自是非他、互相攻讦者「即是迷人，枉受辛勤，不入正理」。
    en_body: |
      - The Nature and Phenomena schools are like the two wings of a bird, complementing each other; the *Treatise on Awakening of Faith* is "a small version of the *Laṅkāvatāra Sūtra*" — nature and phenomena in perfect interfusion;
      - The *Saṃdhinirmocana*, *Avataṃsaka*, *Guhyasamāja*, and *Laṅkāvatāra* sūtras are all texts of "nature-phenomena perfect interfusion," and are equally revered by both exoteric and esoteric traditions;
      - Bodhidharma used the *Laṅkāvatāra Sūtra* for mind-seal (the Sixth Patriarch changed it to the *Vajracchedikā*); Chan's dharma-eye treasury was originally "without division between nature and phenomena, without division between exoteric and esoteric"; later separation into different schools of practice was due to the dulling of sentient beings' faculties — **"not that the dharma itself had divisions, but rather that human faculties deteriorated"**;
      - The convergence of nature and phenomena is the "Tathāgata's knowledge and vision" — one who studies nature without understanding phenomena, or studies phenomena without understanding nature, faces one of the greatest difficulties in Buddhist study; those who "cling to the elephant-touching parable's partial understanding" and denounce others "are the deluded, toiling in vain without entering the true principle."
    source: '成观法师《八识规矩颂义贯》相宗系列总序 (fjdh.cn) · 《楞伽阿跋多罗宝经义贯》卷第二 (fjdh.cn)'
  - title: 成观法师：末法退化史观
    title_en: "Chengguan: A Historical View of Degeneration in the Dharma-Ending Age"
    body: |
      成观法师《天台小止观讲解》判各宗退化：
      • 禅宗：达摩依《楞伽》印心→五祖《金刚经》→唐宋参公案→宋末参话头→明清沦为「口头禅」（耍口头禅者为「禅和子」）；
      • 密教：唐密仪轨散佚「只剩下几个法，而且都是没有完全的仪轨」，只剩咒乃至印；
      • 净土：慧远大师修念佛三昧、般舟三昧、十六观，非散心念佛可成；「法就越来越少、越来越简化，然后简化到法几乎都没有了叫做末法」。
    en_body: |
      Chengguan's *Lectures on Tiantai's Minor Treatise on Calming and Contemplation* classifies the degeneration of each school:
      - Chan: Bodhidharma used the *Laṅkāvatāra* for mind-seal → Fifth Patriarch's *Vajracchedikā* → Tang-Song koan practice → late-Song huatou practice → Ming-Qing degeneration into "verbal Chan" (practitioners of which were called "Chan-joining monks");
      - Esoteric Buddhism: Tang esoteric ritual texts scattered and lost — "only a few practices remain, and none with complete rituals"; only mantras and even only mudrās left;
      - Pure Land: Master Huiyuan practiced buddha-recitation samādhi, pratyutpanna samādhi, and the sixteen contemplations — not achievable through scattered-mind nianfo; "The dharma grows fewer and fewer, more and more simplified, until simplified to the point where the dharma has almost vanished — this is called the Dharma-Ending Age."
    source: '成观法师《天台小止观讲解》第三十八集 ([wuming.xuefo.com](http://wuming.xuefo.com/nr/6/61435.html))'
  - title: 成观法师：译经宏愿与护法事业
    title_en: "Chengguan: Aspirations for Translation and the Dharma-Protection Enterprise"
    body: |
      成观法师（1947-，台北人）1988年依天台宗第45代显明老和尚出家，1996年获日本高野山真言宗第53世阿阇梨位，2010年承贤首宗兼慈恩宗第四十二世法脉，另具曹洞宗传承；1991年创办台北大毘卢寺，主修禅密，推行汉传东密。
      任「楞严座主、法华译主、华严译主」，建「新逍遥园译经院」将华严、法华等经译为英文——「唯有广译英文、存于世界各地，方能使佛陀正法的传承长久住世」。
    en_body: |
      Chengguan (1947-, born in Taipei) was ordained in 1988 under the 45th-generation Tiantai master Xianming, received the 53rd-generation Shingon ācārya rank from Kōyasan in 1996, inherited the 42nd-generation Xianshou-Yogācāra lineage in 2010, and additionally holds a Caodong lineage transmission; he founded the Dàpílú Temple in Taipei in 1991, with primary practice in Chan and esoteric Buddhism, promoting Chinese-transmitted Shingon.
      Serving as "Chair for the *Śūraṅgama*, Chief Translator for the *Lotus Sūtra*, Chief Translator for the *Avataṃsaka*," he established the "New Bliss-Nirvana Translation Monastery" to translate the *Avataṃsaka*, *Lotus*, and other sūtras into English — "Only through wide translation into English, preserved throughout the world, can the transmission of the Buddha's true Dharma endure long in this world."
    source: '新逍遥园译经院官网(abtemple.org) · 成观法师《天台小止观讲解》第三十八集'

- id: dimensions
  title: 判教分析维度 · 九维方法论
  title_en: Analytical Dimensions of Doctrinal Classification — A Nine-Fold Method
  icon: 🔍
  intro: |
    判教既是一种学问也是一种权力运作。要「全方位」审视任一判教体系，本专题提出**九维分析框架**：缘起、背景、前提、目的、动机、实操、效果、流变、局限。每一维度都是一面透镜，合观九维，方能既见其然、亦见其所以然，既不神化、也不贬抑任一判教。
  intro_en: |
    Doctrinal classification is both a discipline and an exercise of power. To examine any classificatory system from all angles, this section proposes a **nine-fold analytical framework**: origin, background, premise, purpose, motive, operation, effect, evolution, and limitation. Each dimension is a lens; viewing all nine together lets us see not only what a classification asserts but why, neither deifying nor belittling any of them.
  topics:
  - title: 缘起 · 判教何以发生
    title_en: Origin — Why Classification Arises
    body: |
      「判」（判定、区分、裁决）的冲动，源于**经典的多元**与**教义的张力**：当一部圣典与另一部圣典、或一段经文与另一段经文看似矛盾时，信徒便面临「如何安置这一切」的难题。凡一部有经有论、有宗有派的传统，几乎必然孕育判教——佛灭后部派分裂、大乘小乘相诤、三藏结集之先后，皆判教之土壤。判教的发生，本质上是对「多」与「一」之间张力的回应：用一套秩序把「多」（诸经、诸说、诸宗、诸修行法门）收摄为「一」（佛意、正法、正道、一味）。
    en_body: |
      The impulse to "classify" (pàn: to judge, differentiate, adjudicate) arises from **scriptural plurality** and **doctrinal tension**: when one scripture appears to contradict another, or one passage another, believers face the problem of "how to place it all." Any tradition with scriptures, treatises, sects, and schools almost inevitably generates classification — the sectarian divisions after the Buddha's nirvāṇa, the Mahāyāna-Hīnayāna debates, and the ordering of the three baskets are its soil. Classification fundamentally responds to the tension between the "many" and the "one": using an ordering to gather the many (sūtras, teachings, schools, practices) back into the one (the Buddha's intent, the true Dharma, the right path, the single taste).
    source: '法藏《华严一乘教义分齐章》卷一「辨教摄益」· 释印顺《教制教典与教学》(华雨集)'
  - title: 背景 · 历史·社会·知识语境
    title_en: Background — Historical, Social, and Intellectual Context
    body: |
      任何判教都是特定语境下的产物，须放入其历史、社会与知识坐标中理解。南北朝判教（南三北七）发生于**译经输入、师承竞争、政权护持**的背景下；天台五时八教与智者大师所处的**隋唐大一统与「摄末归本」的会通需求**呼应；华严判教以**佛典大量译出、义学繁盛、门第士族的哲学趣味**为土壤；玄奘立「三时判教」则是对**瑜伽行派传承及中印宗义**的正名。判教也常与**政权合法性**纠缠——北朝「皇帝即如来」、唐朝「佛道先后」之判，皆触国家宗教政策。故读判教须问：它在为谁、在何时、在何种权力与知识格局中发言？
    en_body: |
      Every classification is a product of its context and must be read in its historical, social, and intellectual coordinates. The Northern-Southern Dynasties classifications (南三北七) arose amid **scriptural translation, lineage competition, and state patronage**; Tiantai's Five Periods and Eight Teachings respond to **Sui-Tang unification and the need to harmonize "returning the many to the root"**; Huayan classification has its soil in **large-scale translation, flourishing doctrinal learning, and the philosophical taste of the aristocratic clans**; Xuanzang's "Three Periods" classification legitimizes **the Yogācāra lineage and Sino-Indian school affiliations**. Classification is also entangled with **political legitimacy** — the Northern Dynasties' "the emperor is the Tathāgata," and Tang-era rankings of Buddhism and Daoism, touch state religious policy. So when reading a classification we must ask: for whom, at what time, and within which structure of power and knowledge does it speak?
    source: '汤用彤《汉魏两晋南北朝佛教史》· 吕澂《中国佛学源流略讲》· 陈寅恪《隋唐制度渊源略论稿》'
  - title: 前提 · 判教预设的观念基础
    title_en: Premise — The Conceptual Presuppositions
    body: |
      每一判教都建立在若干**未经追问的前提 (presupposition)** 上。最常见的前提是：①**「圣言一致」**——佛不可能自相矛盾，若经文冲突，必有深浅之别、权实之分（天台所谓「于一佛乘分别说三」；唯识「依义不依语」）；②**「教必有次第」**——法有由浅入深、由权到实、由始到圆的阶梯（认知论上的「次第观」）；③**「一教能摄众教」**——确立一个最高教，使其余各教得其所位（目的论上的「统摄观」）；④**「最高教实有」**——必有一教真实圆满、其余皆为方便（价值论上的「圆教观」）。这些前提本身并非不证自明，恰是判教深层的检修点：若「圣言一致」与「教皆方便」的前提松动，判教大厦亦随之动摇。
    en_body: |
      Every classification rests on several **unexamined presuppositions**. The most common are: (1) **"the unity of the words"** — the Buddha cannot contradict himself, so apparent scriptural conflicts must indicate differences of depth vs. shallowness or of provisional vs. true (Tiantai's "preaching the three from the one buddha-vehicle"; Yogācāra's "rely on the meaning, not the words"); (2) **"teaching necessarily has stages"** — a ladder from shallow to deep, provisional to true, initial to perfect (a cognitive "stages view"); (3) **"one teaching can contain all teachings"** — establishing a supreme teaching that gives each other teaching its place (a teleological "unification view"); (4) **"a supreme teaching truly exists"** — one teaching is genuinely complete, the rest being skillful means (an axiological "perfect-teaching view"). These presuppositions are not self-evident — they are precisely where a classification invites deepest examination: if "unity of the words" and "all teachings are means" loosen, the entire edifice shakes.
    source: '智顗《法华玄义》「五时八教」「本末」之判 · 窥基《法华玄赞》 · 印顺《成佛之道》「五乘共法」序'
  - title: 目的 · 判教的宗旨指向
    title_en: Purpose — The Aims of Classification
    body: |
      判教的目的可析为多重：**①会通（harmonizing）**——消解经教之间的矛盾，使学习者不因经文相左而疑退；**②定位（positioning）**——为不同学人、不同根器安置相应教法（「随宜说法」「逗机设教」）；**③判摄（evaluating）**——分别权实、真妄、深浅，作为知见的指导；**④护教（apologetic）**——确立本宗为最高、最圆满、最直捷，以应对他宗的质疑与竞争。这四重目的并不总是和谐：会通求「和」，判摄求「别」，护教求「胜」——三者之间的紧张，正是判教之所以在历史上屡起争议、屡被修正的内在原因。
    en_body: |
      The aims of classification can be distinguished into several: **harmonizing** — dissolving contradictions between teachings so learners do not waver or retreat amid conflicting scriptures; **positioning** — placing appropriate doctrines for different persons and aptitudes ("preaching according to circumstances," "teaching according to capacity"); **evaluating** — distinguishing provisional from true, real from false, and shallow from deep, as a guide to correct views; and **apologetic** — establishing one's own school as highest, most complete, and most direct, to answer the challenges and competition of others. These four aims are not always in harmony: harmonizing seeks "unity," evaluating seeks "differentiation," and apologetics seeks "superiority" — the tension among them is precisely why classifications in history so often attracted controversy and were repeatedly revised.
    source: '法藏《华严一乘教义分齐章》「立教开宗」·宗密《禅源诸诠集都序》「教禅一致」'
  - title: 动机 · 判教的具体动力
    title_en: Motive — The Concrete Impetus Behind Classification
    body: |
      除学派性的「目的」外，判教背后还常有无形的**具体动机 (motive)**：①**师承与宗门的合法性**——立宗须有判教以自证其「得佛正意」（玄奘立三时以正瑜伽传承；法藏判五教以显华严为最高）；②**应对外部挑战**——如南朝刘宋初年佛道之争、唐武宗会昌法难后「教禅净」之争中的自存之判；③**学理上的完满欲**——义学僧追求「一家之言」的系统自洽；④**居士与政治家的统摄欲**——以一套判教统摄天下教门。可见判教既是**学问**，也是**权力话语**（discursive power）——它既指陈经典之「实」，也建构宗门之「势」。
    en_body: |
      Beyond the school-level "purpose," specific **motives** often operate invisibly behind a classification: (1) **the legitimacy of lineage and school** — founding a school demands a classification to prove it "attained the Buddha's true intent" (Xuanzang established the Three Periods to legitimize Yogācāra; Fazang adjudicated the Five Teachings to show Huayan as supreme); (2) **responding to external challenges** — such as the Buddhist-Daoist disputes of the early Liu-Song, or the "teaching-chan-pure-land" struggles for survival after the Huichang persecution of 845; (3) **a desire for doctrinal completeness** — scholastic monks pursuing the systematic self-consistency of "one house's doctrine"; (4) **the unifying aspiration of laymen and statesmen** — using one classification to govern all teachings. Thus classification is at once **learning** and **discursive power**: it both points to the "real" of the scriptures and constructs the "strength" of a school.
    source: '汤用彤《汉魏两晋南北朝佛教史》· 陈寅恪《武曌与佛教》(金明馆丛稿二编)· 龚隽《觉悟与迷情——汉魏两晋南北朝佛教史评论》'
  - title: 实操 · 判教的操作与判准
    title_en: Operation — The Working Method and Criteria of Classification
    body: |
      判教的操作有其可举的**判准 (criteria)** 与**方法 (method)**：最常见者有四：**①依经判**——以一部或几部经为最高准绳，其余经典俯就之（天台宗《法华》《涅槃》；华严宗《华严》）；**②依理判**——以某一义理（如「无所得」「如来藏」「法界缘起」）为尺度，衡量诸教之高下深浅（三论以「无所得」破之；性宗以「显示真心即性教」判之）；**③依时判**——按「说法先后」安置诸经（五时、三时、九乘、十住心皆属之）；**④依人判**——按「根器、位次」安置受法者（化仪四教、随机设教）。判教的操作通常多法并用，并辅以**「会通」的技巧**：以「别异」「通同」「旁正」「本末」诸对，把冲突经文重新编排进一个含摄性的结构。
    en_body: |
      Classification has enumerable **criteria** and **methods**. The four most common are: (1) **by scripture** — taking one or several sūtras as the supreme yardstick and subordinating the rest (Tiantai with the Lotus and Nirvāṇa; Huayan with the Avataṃsaka); (2) **by principle** — measuring the heights and depths of teachings by a single doctrine (such as "non-attainment," "tathāgatagarbha," or "dharmadhātu-conditioned arising" — the Three-Treatise school classifying by "non-attainment"; the Nature school by "revealing the true mind is the nature teaching"); (3) **by time** — placing scriptures according to the order of preaching (the Five Periods, Three Periods, Nine Vehicles, and Ten Minds belong here); (4) **by person** — placing recipients according to capacity and rank (the four modes of conversion, preaching according to capacity). Operation typically combines several methods, aided by the technique of **harmonization**: using oppositions such as "distinct vs. common," "auxiliary vs. principal," and "root vs. branch" to reorganize conflicting scriptures into a comprehensive structure.
    source: '谛观《天台四教仪》· 法藏《华严经探玄记》卷一「立教」·智顗《摩诃止观》'
  - title: 效果 · 判教的现实后果
    title_en: Effect — The Practical Consequences of Classification
    body: |
      判教的效果是双重的——既**统摄**也**分化**。正面效果：①**消解经教矛盾**，稳定信仰共同体；②**提供修学地图**，使不同根机者各得门径；③**确立宗门法统**，推动义学与宗派传承（天台、华严、真言诸宗皆赖判教而立）。反面与复杂效果：①**强化门户之见**，使「判教」沦为「争高」，演为宗派倾轧（台贤互判、天台山家山外之争）；②**窄化他宗**——被安置于「方便」「权教」「不了义」者，其本意或在判摄中被重构；③**固化等级**——判教隐含的「他者次于我」结构在政治与跨宗教语境中可能被挪用为排他与殖民的工具。故论判教之「效果」，不可只见其「会通」之功，亦当审视其「区隔」之弊。
    en_body: |
      The effect of classification is twofold — it both **unifies** and **differentiates**. Positive effects: (1) dissolving scriptural contradictions and stabilizing the religious community; (2) providing a map of practice so those of different capacities each find a gate; (3) establishing the school's dharma-lineage and advancing scholastic and sectarian transmission (Tiantai, Huayan, and Shingon all founded themselves on classification). Negative and complex effects: (1) intensifying sectarian bias, reducing "classification" to "one-upmanship" and sectarian rivalry (Tiantai-Huayan mutual classification, the Shanjia-Shanwai controversy); (2) narrowing other schools — those placed as "skillful means," "provisional teachings," or "non-definitive" may have their own meaning reconstructed in the classification; (3) entrenching hierarchy — the implied "the other is below me" structure of classification may, in political and cross-religious contexts, be appropriated as a tool of exclusion and colonialism. Thus in assessing the "effect" of classification, one should see not only its harmonizing merit but also its differentiating harm.
    source: '释印顺《成佛之道》「先成佛道，次明判教」·龚隽《禅史钩沉》·吴忠伟《圆教的自拘》'
  - title: 流变 · 判教的历史演变
    title_en: Evolution — The Historical Transformation of Classification
    body: |
      判教不是一成不变的教条，而是随译经、传承与时代因缘**不断流变 (evolution)** 的活结构。同一家的判教加以追溯，往往可见清晰的演变轨迹：天台从智顗「三教相」到荆溪、谛观「五时八教」的定型；华严从智俨「五教十宗」、法藏「五教」到澄观、宗密的阐发与「顿圆」之辨；唯识从真谛「三无性」到玄奘「三时」的立说；藏传从宁玛「九乘」到格鲁「应成」的自宗确立。判教的流变受三力驱动：**新经典的译入**（如《华严》《法华》全本、梵文残典）、**义学内部的修正**（对前人判摄的再检讨）、**时代问题的更换**（如会昌法难、近现代科玄论战）。读判教史，实为读一部「如何处理传统之多元」的观念史。
    en_body: |
      Classification is not an immutable dogma but a living structure that **evolves** with translation, transmission, and the circumstances of the age. Tracing a single school's classificatory doctrine often reveals a clear trajectory: Tiantai from Zhiyi's "three modes of scripture" to the crystallization of the "Five Periods and Eight Teachings" by Jingxi and Diguan; Huayan from Zhiyan's "five teachings and ten schools" and Fazang's "five teachings" to the elaboration and the Sudden-Perfect distinction of Chengguan and Zongmi; Yogācāra from Paramārtha's "three non-natures" to Xuanzang's "three periods"; Tibetan Buddhism from Nyingma's "nine vehicles" to Geluk's self-assertion of Prāsaṅgika. Three forces drive this evolution: **the entry of new scriptures** (full versions of the Avataṃsaka and Lotus, Sanskrit fragments), **internal scholastic revision** (re-examination of earlier classifications), and **the change of era-questions** (the Huichang persecution, the modern Science-Metaphysics Controversy). To read the history of classification is to read an intellectual history of "how to handle the plurality of tradition."
    source: '吕澂《中国佛学源流略讲》· 韩焕忠《华严判教论》· 何杰峰《藏传佛教判教研究》'
  - title: 局限 · 判教的内在界限与自反性
    title_en: Limitation — The Inner Limits and Reflexivity of Classification
    body: |
      判教的深藏之弊是**自反性难题 (reflexivity)**：作出判教者，必自居于所判诸教之「最高」或「最圆」——然这「最高」本身既是对已判之教的裁定，就须再被一更高之教来裁定它自己，如此无穷后退；任一家若自称「绝顶」，即是把「圆教」重新变成「别教」的话柄。此其一。其二，判教以「语言」与「概念」去捕捉「不可说」的实相，而它自身恰是「名相」的产物——正如禅宗「不立文字」对判教文字的治认离言，华严「事事无碍」对判教执定次第的治超。其三，判教预设「佛意可判、可得」，而大乘佛典又宣称「无有少法可得」——判教之「得」与佛旨之「无所得」构成深层的吊诡。故成熟之判教，须自觉其局限，对「判教云云」本身保持一种**开放的自我超越**（见末节「华严立场的meta判教」）。
    en_body: |
      The hidden defect of classification is the **problem of reflexivity**: whoever classifies must place themselves at the "highest" or "most perfect" of the classified teachings — yet this "highest" is itself an adjudication of what was classified, so it would itself need to be adjudicated by something higher, ad infinitum. If any school declares itself "the very summit," it turns the "perfect teaching" back into a "distinct teaching." This is the first limitation. Second, classification uses language and concepts to grasp an ineffable reality, yet it is itself a product of names and marks — just as Chan's "not establishing words" relativizes the textual classification, and Huayan's "unobstructed between phenomena" relativizes the fixed ladder of stages. Third, classification presupposes that the Buddha's intent can be adjudicated and attained, while the Mahāyāna scriptures proclaim "not a single dharma is obtained" — the "attainment" of classification and the "non-attainment" of the Buddhist intent form a deep paradox. A mature classification must therefore recognize its own limits and maintain an **open self-transcendence** toward "classification as such" (see the final section, "Huayan Meta-classification").
    source: '宗密《禅源诸诠集都序》「三教三宗」之自觉 · 吕澂《中国佛学源流略讲》论「判教之不能判」·印顺《印度之佛教》跋'

- id: summary
  title: 总结 · 判教「六方」横向综览
  title_en: Summary — A Cross-Sectional Overview of the "Six Realms"
  icon: 📊
  intro: |
    本专题前十八节分述佛界诸宗、儒家、道家、世界宗教、学界与科技诸传统。此总结不重复细节，而以**同构性**与**差异**两点，把「判教」作为一个普遍的人类文化现象加以综览：它有跨传统的共同结构，也有各传统独特的判准与后果；既有会通的善意，也难免区隔的偏见。
  intro_en: |
    The preceding sections describe the Buddhist schools, Confucianism, Daoism, world religions, academia, and technology. This summary does not repeat details but surveys "classification" as a universal human cultural phenomenon through **isomorphism** and **difference**: it has a common cross-traditional structure, yet each tradition has its own distinctive criteria and consequences; it carries both the goodwill of harmonization and the bias of differentiation.
  topics:
  - title: 共同结构 · 判教作为普遍文化现象
    title_en: Common Structure — Classification as a Universal Cultural Phenomenon
    body: |
      将佛门（天台五时八教、华严五教十宗、唯识三时、藏传九乘、日本显密）、中土儒道（道统、六家、九流、三洞四辅）、世界宗教（基督教三大传统、伊斯兰教法学派、吠檀多、犹太拉比、锡克卡尔萨）、学界（分析/大陆、科玄、范式）与科技（量子诠释、AI三派）并观，可见一个惊人的**同构模式**：①**都有一个「权威源」**（圣典、经典、范式、教法）；②**都区分「正宗/非正宗、绝对/相对、实/权」**；③**都有一个「最高真实」**（圆教、道统之最精义、吠檀多不二、范式之题解）；④**都以「次第/阶梯」安置殊异**；⑤**都服务于「统摄、护教、定位」三重功能**。这说明「判教」并非佛教独有，而是任何严肃意义系统的结构性需要——一种「如何把多归属于一」的普世智性操作。
    en_body: |
      Placing side by side the Buddhist schools (Tiantai Five Periods and Eight Teachings, Huayan Five Teachings and Ten Schools, Yogācāra Three Periods, Tibetan Nine Vehicles, Japanese Exoteric-Esoteric), Sino-Japanese Confucianism-Daoism (the Daotong, Six Schools, Nine Streams, Three Caverns and Four Supplements), world religions (the three Christian traditions, Islamic jurisprudential schools, Vedānta, Rabbinic Judaism, the Sikh Khālsā), academia (analytic vs. continental, Science-Metaphysics, paradigms), and technology (quantum interpretations, three AI schools) — one sees a striking **isomorphic pattern**: (1) each has a **source of authority** (scripture, canon, paradigm, law); (2) each distinguishes **orthodox vs. heterodox, absolute vs. relative, real vs. provisional**; (3) each posits a **supreme reality** (the perfect teaching, the quintessence of the Daotong, Vedāntic non-dualism, the paradigm's problem-solution); (4) each **arranges differences on a ladder of stages**; (5) each serves the **three functions of unification, apologetics, and positioning**. This shows that "classification" is not unique to Buddhism but a structural need of any serious system of meaning — a universal intellectual operation of "how to subordinate the many to the one."
    source: '本文综览所据上述诸节 · 参 Michel Foucault《知识考古学》(L''archéologie du savoir) 论话语之秩序'
  - title: 差异 · 各传统判准与后果之别
    title_en: Differences — Divergent Criteria and Consequences Across Traditions
    body: |
      同构之下，各传统的判准与后果又千差万别。**判准之别**：佛教多「依经、依理、依时」三种法并用，兼顾「智慧」与「慈悲」（权实、渐顿、了义不了义）；儒道重在「道」之传承与治理（道统、弘道），判准是「合道与否」而非「经之权实」；世界宗教往往以「正典权威」与「神学/律法」为判准，带有更强的「正统—异端、信—不信」的排他性；学界与科技则以「方法、证据、范式之解题力」为判准，较少「正统」色彩而带「进步/落后」之别。**后果之别**：佛教判教多导向「圆融会通」（华严「事事无碍」尤然），虽护教而常存「同他」之胸襟；某些一神教判教更易迈向「唯一真、余皆妄」的排他；学界判教则以「范式更替」承认多范式并存，比宗教判教更少终极性。理解这些差异，才能避免把「判教」一词一概而论。
    en_body: |
      Beneath the isomorphism, criteria and consequences differ greatly across traditions. **Differences in criteria**: Buddhism commonly employs the three methods of by-scripture, by-principle, and by-time, balancing "wisdom" and "compassion" (provisional vs. real, sudden vs. gradual, definitive vs. non-definitive); Confucianism-Daoism focuses on the transmission and governance of the Dao (Daotong), judging by "accordance with the Way" rather than the provisional-versus-real of scriptures; world religions often judge by canonical authority and theology and law, with a more exclusive "orthodox-heresy, belief-unbelief" character; academia and technology judge by method, evidence, and paradigm-solving power, with less "orthodoxy" and more "progress and backwardness." **Differences in consequences**: Buddhist classification tends toward "perfect interpenetration" (Huayan's "unobstructed between phenomena" especially), often retaining an open-mindedness toward others despite apologetics; certain monotheistic classifications more readily move toward the exclusive "only one is true, the rest false"; academic classification, by acknowledging paradigm shifts, allows multiple paradigms to coexist and is less ultimate than religious classification. Understanding these differences prevents treating "classification" as a single undifferentiated thing.
    source: '参 Huston Smith《世界宗教》(The World''s Religions)· 库恩《科学革命的结构》· 铃木大拙/柳田圣山论「不二与排他」'
  - title: 会通与区隔 · 判教的双刃
    title_en: Harmonization vs. Differentiation — The Double-Edged Sword
    body: |
      综观六方，判教始终是「**会通**」与「**区隔**」的双刃：它一方面把矛盾收摄进统一秩序（会通），另一方面又确立「我高彼低」的位阶（区隔）。圆熟的判教能「会通而不抹平、区隔而不轻慢」——如华严以「同教一乘」会通诸宗、以「别教一乘」标举自宗，既尊他宗为方便、又自居圆满；粗糙的判教则「以区隔为本、以排他为快」，使「判教」沦为「贬他」。此一双刃在跨宗教与政治语境中尤须警惕：当「判教」被用以支撑民族、政权或文明的优越叙事时，其「区隔」之刃便可能伤人。故成熟的态度是在会通与区隔之间保持张力，既善用判教之「和」，又警觉判教之「分」。
    en_body: |
      Across all six realms, classification is a double-edged sword of "**harmonization**" and "**differentiation**": it gathers contradictions into a unified order (harmonization), while establishing a hierarchy of "I am higher, you lower" (differentiation). A mature classification can "harmonize without flattening, and differentiate without disparaging" — as Huayan does when it harmonizes all schools through the "same teaching one vehicle" and marks its own through the "distinct teaching one vehicle," both honoring others as skillful means and claiming completeness for itself; a crude classification "takes differentiation as the root and takes pleasure in disparaging others," reducing classification to "belittling." This double edge demands vigilance especially in cross-religious and political contexts: when "classification" is used to support narratives of national, civilizational, or ethnic superiority, its "differentiating" edge can wound. A mature attitude keeps the tension between harmonization and differentiation, using the "unity" of classification while remaining alert to its "division."
    source: '法藏《华严一乘教义分齐章》「同别二教」· 释印顺《我之宗教观》'
  - title: 判教与修行 · 从判摄到实践
    title_en: Classification and Practice — From Adjudication to Praxis
    body: |
      判教若止于知识的高下之为、宗门的胜负之分，则与修行脱节。真正圆融的判教必通向**实践**：天台以「五时八教」之判，归于「一念三千」之观与「六即」之修；华严以「五教十宗」之判，归于「法界观」与「普贤行愿」；唯识以「三时」之判，归于「转识成智」之瑜伽行；净、禅、密诸宗亦各以判教确立其「行门」之正。判教的真正价值，在于它为修行者提供一张**可靠的修学地图**——使人在无尽教法中不迷于途，而能循「教—理—行—果」之次第真正上路。故论判教，最终须问：此判，能令行者「解行并进、解行圆融」否？能令众生「离苦得乐、悟入菩提」否？若不能，则再精巧的判教也只是一张画不出的地图。
    en_body: |
      If classification stops at intellectual distinctions of high and low, or the victory and defeat of schools, it is severed from practice. A truly perfect classification must lead to **praxis**: Tiantai's classification of the Five Periods and Eight Teachings returns to the contemplation of "the three thousand realms in one thought" and the practice of the "six identities"; Huayan's classification of the Five Teachings and Ten Schools returns to the "Dharma-dhātu contemplation" and the "Vows and Practices of Samantabhadra"; Yogācāra's "three periods" returns to the yoga of "transforming consciousness into wisdom"; and the Pure Land, Chan, and Esoteric schools each establish the correctness of their own "gate of practice" through classification. The true value of classification lies in providing practitioners a **reliable map of study and practice**, so that amid endless doctrines one does not lose the way but can actually set out on the path following the sequence of teaching-principle-practice-fruition. Thus in the end we must ask of any classification: does it enable practitioners to "advance in understanding and practice together, and to fuse understanding and practice"? Does it enable beings to "leave suffering and gain bliss, and awaken to bodhi"? If not, however ingenious, it is only a map that cannot be followed.
    source: '智顗《摩诃止观》「依教明观」· 法藏《修华严奥旨妄尽还源观》· 海云继梦《华严金狮子章讲记》'

- id: metapanjiao
  title: 华严立场的 meta判教 · 对诸判教之判教
  title_en: Huayan Meta-Classification — Classifying the Classifications
  icon: 👑
  intro: |
    末节为全篇之纲领——以**华严宗自身的判教立场**，回头对以上所述的一切判教（佛界诸宗、儒道、世界宗教、学界、科技）作一次**「判教之判教」（meta判教）**。此非欲称霸诸教，而是华严「圆教」之义本具的抱负：华严以「法界缘起」「十玄无尽」「别教一乘」为判准，既安顿诸教于其位，又不把任何一教钉死于「次第」，反而于「事事无碍」中融摄一切。故华严之「判」，是一种**「开放的圆摄」——判而无所判、尊而不自封**的妙印。
  intro_en: |
    The final section is the pivot of the whole: using **Huayan school's own classificatory standpoint**, we look back upon all the classifications discussed above (the Buddhist schools, Confucianism-Daoism, world religions, academia, and technology) and perform a **"classification of classifications" (meta-classification)**. The aim is not to dominate all teachings but to fulfill the inherent aspiration of Huayan as a "perfect teaching": using "dharmadhātu-conditioned arising," "the ten mysterious gates," and "the distinct teaching one vehicle" as criteria, Huayan both places every teaching in its own position and refuses to nail any teaching to a fixed stage, instead gathering everything into "unobstructed between phenomena." Thus Huayan's classification is an **"open perfect embrace" — judging without being bound by judgment, venerating without sealing itself off**.
  topics:
  - title: 判教的标准 · 华严的判摄准绳
    title_en: The Criterion — Huayan's Yardstick of Adjudication
    body: |
      华严评价一切教法（包括其他判教）的准绳，不是「谁经更古」，也不是「谁能斥他宗为妄」，而是**「此教能否彻尽法界之真实、并圆融地安顿万法」**。具体言之，华严以四义为尺：**①法界缘起（dharmadhātu-conditioned arising）**——真理是「无尽缘起、重重无尽」的全体，而非孤立之一法；**②理事无碍、事事无碍**——真与俗、一与多、正与邪能净无碍地相即相入，不须抹平其一；**③十玄门、三观**——以「同时具足」「广狭自在」「因陀罗网」等观万法之圆融；**④别教一乘**——华严自居「不共圆」「一乘圆教」，此「别」正是对诸教权实深浅的「判摄总纲」。据此，凡判教能「圆摄而不排他、定次而不执定、穷理而不坏俗」，即近于华严之圆；凡判教「执定一法、排斥万法、以高劣他」，即落华严所谓「别而不圆」之失。
    en_body: |
      Huayan's criterion for evaluating all teachings (including other classifications) is not "whose sūtra is older" nor "who can denounce others as false," but **"whether this teaching can exhaust the reality of the dharmadhātu and harmoniously place all dharmas."** Concretely, Huayan uses four measures: (1) **dharmadhātu-conditioned arising** — truth is the whole of "endless, layer-upon-layer conditioned arising," not an isolated single dharma; (2) **unobstructed between principle and phenomena, and unobstructed between phenomena** — the true and the conventional, the one and the many, even the correct and the erroneous can interpenetrate without being flattened; (3) **the ten mysterious gates and the three contemplations** — contemplating the perfect interpenetration of all dharmas through "the simultaneous fulfillment of the ten gates," "the unobstructed liberty of the vast and the narrow," "Indra's net," and so forth; (4) **the distinct teaching one vehicle** — Huayan claims the "non-common perfect teaching, the one-vehicle perfect teaching," and this "distinct" is precisely the master-yardstick of placing the provisional and true, shallow and deep. By this standard, any classification that "perfectly embraces without excluding, sets stages without being fettered by them, and exhausts principle without destroying convention" approaches Huayan's perfection; any that "clings to one dharma, rejects all dharmas, and disparages others as inferior" falls into what Huayan calls "distinct but not perfect."
    source: '法藏《华严一乘教义分齐章》·澄观《华严经疏》「法界缘起」·智俨《华严搜玄记》'
  - title: 对佛教内部判教的判摄 · 空·有·性·密·禅·净
    title_en: Classifying the Buddhist Classifications — Mādhyamika, Yogācāra, Nature, Esoteric, Chan, Pure Land
    body: |
      依华严「五教十宗」之判（小乘教一大乘始教二空、三有、四性相分、五顿、六圆，十宗总摄），前文佛教诸判可各得其所：**三论/中观（空宗）**近「始教」之「空」，破执有功而于「不空妙有」未及，华严以「理无碍」摄之；**唯识（有宗）**近「始教」之「有」，析「三时」而安「三性三无性」，华严以「事无碍、事理无碍」摄之；**天台五时八教**以其「圆融三谛」颇近华严，华严视之为「同教圆」而许其「圆」、惜其「未至极之圆」；**性宗（如来藏/真心）**近「终教」，宗密已判「显示真心即性教」居「顿」前，华严许其见「理」而未彻「事事无碍」；**禅宗「不立文字」**华严以「顿教」摄之，赞其直指而恐其偏于「遣语」；**净土他力**以「别时意趣」与「回向」会通，属「实教」之方便；**密宗真言**华严以「密意」待之、于「三密」与「一乘」之间会通。总言之，华严以「**别教一乘**」为最高位，而把空、有、性、禅、净、密——连同天台之圆——尽皆「圆摄」于法界缘起之中：**皆非「妄教」，只是「于圆教而言犹有未尽」**。
    en_body: |
      According to Huayan's "five teachings and ten schools" (the five: Lesser Vehicle, Initial Teaching — divided into emptiness and existence, Final Teaching, Sudden Teaching, Perfect Teaching), the Buddhist classifications above each find their place: the **Three-Treatise — Mādhyamika (emptiness)** is near the "emptiness" of the Initial Teaching — effective in destroying attachment, yet not reaching "wondrous existence that is non-empty"; Huayan gathers it through "unobstructed in principle." **Yogācāra (existence)** is near the "existence" of the Initial Teaching, analyzing the Three Periods and positing the three natures and three non-natures; Huayan gathers it through "unobstructed in phenomena, and in principle-phenomena." **Tiantai's Five Periods and Eight Teachings**, with its "perfect three truths," is quite close to Huayan; Huayan regards it as the "same teaching perfect" — granting its "perfect" nature while regretting that it is "not yet the ultimate perfect." **The Nature school (tathāgatagarbha — the true mind)** is near the Final Teaching; Zongmi already adjudged it "the nature teaching that reveals the true mind." **Chan's "no reliance on words"** Huayan gathers as the Sudden Teaching, praising its direct pointing yet fearing its bias toward abolishing words. **Pure Land's other-power** is harmonized through "the intent of the separate occasion" and "dedication," belonging to the skillful means of the real teaching. **Esoteric Shingon** Huayan treats by "hidden intention," harmonizing between the "three mysteries" and the one vehicle. In sum, Huayan places the **"distinct teaching one vehicle"** as supreme, perfectly embracing emptiness, existence, nature, Chan, Pure Land, and Esoteric — and even Tiantai's perfection — within dharmadhātu-conditioned arising: **none is a "false teaching" — they are simply "not yet fully consummated in relation to the perfect teaching."**
    source: '法藏《华严一乘教义分齐章》·宗密《禅源诸诠集都序》·澄观《华严经疏钞》'
  - title: 对藏传·日本判教的判摄
    title_en: Classifying the Tibetan and Japanese Classifications
    body: |
      对汉地之外的佛教判教，华严亦以「圆摄而非轻蔑」的胸襟安置。**藏传九乘**（宁玛）与**四部宗义**（说一切有部、经量部、唯识、中观）——华严以其「顿渐偏圆」之判摄观之：中观（尤应成）近华严「始教」之空相而重「破」；他空见（觉囊）与如来藏诸说近「终教」之「真心」；九乘之上「大圆满」近「顿教」之直显本觉。华严不以「谁先谁后」为高下，而以「能否穷尽法界、圆融安顿」为尺——故云：**藏传诸判各有其「圆」，而华严之「别教一乘」于汉地图中自成「圆摄之印」**，二者于「一心法界」上可会通于「真实智」。**日本判教**（空海《十住心论》九显一密、法相三时）——华严以「同别二教」观之：显教之极（天台华严之欲成佛）密教以「即身成佛」顿超，华严则认为「三密即身」与「法界缘起、即身即法界」精神相契，可于「圆」处相摄；然华严强调其「别教一乘」非仅「三密之密」，而是「法界全体的无尽圆融」——此为华严对日本「显密」之判尺。
    en_body: |
      Toward Buddhist classifications outside China, Huayan also adopts an attitude of "perfect embrace rather than contempt." The **Tibetan Nine Vehicles** (Nyingma) and **Four Tenet Systems** (Vaibhāṣika, Sautrāntika, Yogācāra, Mādhyamika) — Huayan views them through its "sudden-gradual, partial-perfect" adjudication: Mādhyamika (especially Prāsaṅgika) is near the "emptiness" of Huayan's Initial Teaching, emphasizing "destruction"; the other-emptiness view (Jonang) and tathāgatagarbha doctrines are near the "true mind" of the Final Teaching; above the Nine Vehicles, "Great Perfection" (Dzogchen) is near the Sudden Teaching's direct manifestation of innate awareness. Huayan does not judge by "who came first" but by the measure of "whether one exhausts the dharmadhātu and perfectly embraces it": hence — **the Tibetan classifications each possess their own "perfect," while Huayan's "distinct teaching one vehicle" forms in the Chinese sphere its own "seal of perfect embrace"; the two can meet in the "one-mind dharmadhātu" as "true wisdom."** Toward **Japanese classification** (Kūkai's *Ten Minds*, the nine exoteric and one esoteric; Hossō's Three Periods) — Huayan views these through the "same and distinct two vehicles": where the esoteric teaching's "attaining buddhahood in this very body" surmounts the summit of the exoteric teachings (Tiantai, Huayan's aspiration to buddhahood), Huayan holds that "the three mysteries and this very body" are consonant in spirit with "dharmadhātu-conditioned arising, this very body is the dharmadhātu" and can be embraced at the "perfect" level; yet Huayan stresses that its "distinct teaching one vehicle" is not merely the "esoteric of the three mysteries" but "the endless perfect interpenetration of the whole dharmadhātu" — this is Huayan's criterion for the Japanese "exoteric-esoteric" classification.
    source: '土观《宗派源流》·何杰峰《藏传佛教判教研究》·空海《秘密曼荼罗十住心论》·法藏「同别二教」·澄观《华严经疏》'
  - title: 对儒·道·学界·科技·世界宗教的圆教安置
    title_en: Placing Confucianism, Daoism, Academia, Technology, and World Religions Within the Perfect Teaching
    body: |
      华严圆教之极致是「法界无尽圆融」，故对一切人类文明之「判教系统」——包括佛教之外者——亦能圆摄安顿，而不以「非我佛门即斥为妄」：**对儒家**——华严以「理事无碍」观之：儒之「人伦日用、经世济民」即「事」，若能由事达理、由仁入智，即是「理无碍」之一分；华严不废世间法，而于「安济民生」处见「普贤行愿」之在世行持。**对道家/道教**——「道法自然、无为而无不为」之「理」，华严以「理法界」会通之；道教「身内身外、炼精化气」之「事」，华严以「事事无碍」摄其「法界身」之义。**对学界/科技**——科学之「如实观察、格物穷理」正合「照了真俗」之智；华严「因陀罗网、重重无尽」与量子纠缠、整体论宇宙观相映；AI之「模拟认知」亦可置于「识心缘起」之框架下审视。**对世界宗教**——一神教之「唯一真神」华严以「法界即真如、万法即一心」会通其「唯一」之向往；其「博爱、戒律」华严以「慈悲、行愿」摄之。华严之圆，不在「吞并诸教」，而在「**于一法中见万法、于万法中见一法**」——故对一切真善美之系统，皆能「摄而未吞、安而能敬」。
    en_body: |
      The culmination of the Huayan perfect teaching is "the endless perfect interpenetration of the dharmadhātu," so it can perfectly embrace and place all the classificatory systems of human civilization — including those outside Buddhism — without dismissing as false whatever is not its own: **toward Confucianism** — Huayan views it through "unobstructed between principle and phenomena": its "human relations, daily use, governing and benefiting the people" is "phenomena," and if one can reach principle through phenomena and enter wisdom through humaneness, that is one portion of "unobstructed in principle"; Huayan does not discard worldly dharmas but sees in "relieving and sustaining life" the in-worldly practice of "Samantabhadra's vows." **Toward Daoism** — the principle of "the Dao follows the natural, non-action yet nothing left undone" Huayan harmonizes with the "principle dharmadhātu"; the "matters" of Daoist alchemy — inner and outer body, refining essence into vital energy — Huayan gathers within "unobstructed between phenomena" as the meaning of the "dharma-body." **Toward academia and science** — science's "honest observation, investigating things to exhaust principle" accords with the wisdom that "illuminates the true and the conventional"; Huayan's "Indra's net, layer upon layer without end" mirrors quantum entanglement and holistic cosmologies; AI's "simulated cognition" can be examined within the framework of "consciousness-conditioned arising." **Toward world religions** — the monotheistic "one true God," Huayan harmonizes with its aspiration to "the one" through "the dharmadhātu is tathatā, all dharmas are one mind"; its "universal love and commandments" Huayan gathers through "compassion and vows." Huayan's perfection lies not in "annexing all religions" but in "**seeing all dharmas in one dharma, and one dharma in all dharmas**" — hence toward every system of the true, the good, and the beautiful, it can "embrace without swallowing, and place while honoring."
    source: '澄观《华严经疏》「法界观门」·章太炎《齐物论释》以华严会通庄子·沈有鼎/方东美论华严与科学意象·海云继梦《华严经导论》'
  - title: 「判教之判」的自觉 · 圆教不自封其高
    title_en: The Reflexivity of "Classifying the Classifications" — The Perfect Teaching Does Not Seal Off Its Own Height
    body: |
      meta判教最要紧处，是华严对自己的「最高位」亦保持**自觉与开放**，否则它就重蹈一切判教之覆辙——把「圆教」重新变作「别教」，把「无碍」重新执成「次第」。华严之圆有三个自戒：**①「圆教即无尽」**——既曰「无尽」，便不可自封为「已尽」，故圆教之「圆」，是一种永在开显、永无穷尽的「圆」，而非一个可握的终点；**②「教相归观行」**——一切判教最终须归于「法界观」「普贤行」，若只作名相之判而不落修行，则「判」未成「行」，反成障道；**③「无所得故无所判」**——究竟处，法界缘起「无有少法可得」，故华严之「判」在最高处是「判别而不执」，是「以无碍之心，赏鉴万法而无一法可弃」。故这一「meta判教」的结论不是「华严最高、余皆次第」，而是——**在「别教一乘」的印契下，一切真善美之教皆得其所、皆可成圆；而「圆」不在宗派之名，而在能否「回向法界、利益含识」的真实生命**。此即华严立场的判教之判：**判而无可判，尊而无所尊，圆而无碍。**
    en_body: |
      The crucial point of meta-classification is that Huayan also maintains **awareness and openness toward its own "supreme position"**; otherwise it would repeat the very mistake of all classifications — turning the "perfect teaching" back into a "distinct teaching," and re-fettering "unobstructed" as "stages." Huayan's perfection has three self-admonitions: (1) **"the perfect teaching is inexhaustible"** — since it is "inexhaustible," it cannot seal itself off as "exhausted," so the "perfection" of the perfect teaching is a "perfection" ever opening forth and never ending, not a graspable terminus; (2) **"teachings return to contemplation and practice"** — all classification must finally return to the "dharmadhātu contemplation" and "Samantabhadra practice"; if it remains mere conceptual adjudication without falling into practice, then the "classification" has not become "action" but an obstacle to the path; (3) **"because nothing is attained, nothing is adjudicated"** — in the final analysis, in dharmadhātu-conditioned arising "not a single dharma is obtained," so Huayan's "classification" at its highest is "to distinguish without clinging," "to appreciate all dharmas with an unobstructed mind and abandon not a single one." Thus the conclusion of this "meta-classification" is not "Huayan is highest, all else is staged," but — **under the seal of the "distinct teaching one vehicle," every teaching of the true, good, and beautiful finds its place and can become perfect; and "perfection" lies not in the name of a school but in whether one can truly "dedicate to the dharmadhātu and benefit all beings."** This is Huayan's classification of classifications: **to judge without being bound by judgment, to venerate without fixation, to be perfect without hindrance.**
    source: '法藏《华严经探玄记》「无尽」·澄观《华严经疏》「圆教无始终」·海云继梦《四十华严讲记》·印顺《华雨集》论「无所得」'

references:
  - '智顗《法华玄义》· 灌顶《天台八教大意》· 湛然《法华玄义释签》· 谛观《天台四教仪》· 吉藏《三论玄义》 (CBETA)'

