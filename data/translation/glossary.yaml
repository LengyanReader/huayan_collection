meta:
  version: "0.2.0"
  last_updated: "2026-08-05"
  note: "扩充至50条术语。新增25条（波罗蜜系列/海云体系术语/法界缘起等）。"
  categories:
    - doctrine      # 教理名相
    - practice      # 修行法门
    - cosmology     # 宇宙观/世界体系
    - name          # 佛菩萨名号
    - place         # 地点/世界名
    - scripture     # 经名
    - lineage       # 传承/宗派
    - ritual        # 仪轨
    - virtue        # 功德/果位
    - state         # 修行阶位/三昧

terms:
  # --- 核心教理名相 ---

  - id: term_001
    category: doctrine
    sa: dharmadhātu
    sa_iast: dharmadhātu
    bo_wylie: chos kyi dbyings
    bo_unicode: "ཆོས་ཀྱི་དབྱིངས།"
    zh: 法界
    en: Dharma realm
    definition_zh: "一切诸法所依之体，即是真如。华严宗以'事事无碍法界'为究竟，显一多相容、重重无尽之义。"
    definition_en: "The fundamental ground of all phenomena, synonymous with suchness (tathatā). In Huayan thought, the 'dharma realm of unobstructed interpenetration of all phenomena' is the ultimate."
    alt_translations:
      zh: ["法性", "实相", "真如法界"]
      en: ["realm of reality", "dharma element", "sphere of truth"]

  - id: term_002
    category: doctrine
    sa: tathatā
    sa_iast: tathatā
    bo_wylie: de bzhin nyid
    bo_unicode: "དེ་བཞིན་ཉིད།"
    zh: 真如
    en: suchness / thusness
    definition_zh: "诸法真实如是之性，离一切分别妄想。华严宗以真如为法界之体。"
    definition_en: "The true nature of all things as they actually are, beyond conceptual differentiation."

  - id: term_003
    category: doctrine
    sa: śūnyatā
    sa_iast: śūnyatā
    bo_wylie: stong pa nyid
    bo_unicode: "སྟོང་པ་ཉིད།"
    zh: 空性
    en: emptiness
    definition_zh: "一切法无自性，缘起而生。华严宗以真空不碍妙有，空有不二为宗。"
    definition_en: "The absence of inherent existence in all phenomena. Huayan emphasizes the non-duality of emptiness and phenomenal existence."

  - id: term_004
    category: doctrine
    sa: pratītyasamutpāda
    sa_iast: pratītyasamutpāda
    bo_wylie: rten cing 'brel bar 'byung ba
    bo_unicode: "རྟེན་ཅིང་འབྲེལ་བར་འབྱུང་བ།"
    zh: 缘起
    en: dependent origination
    definition_zh: "一切法依因缘和合而生。华严宗以'法界缘起'为究竟，一即一切，一切即一。"
    definition_en: "All phenomena arise through the interdependent coming together of causes and conditions. Huayan's 'dharma realm dependent origination' is the ultimate expression: one is all, all is one."

  - id: term_005
    category: doctrine
    sa: tathāgatagarbha
    sa_iast: tathāgatagarbha
    bo_wylie: de bzhin gshegs pa'i snying po
    bo_unicode: "དེ་བཞིན་གཤེགས་པའི་སྙིང་པོ།"
    zh: 如来藏
    en: Buddha-nature / Tathāgata embryo
    definition_zh: "一切众生本具的成佛潜能。华严宗以如来藏为一切众生皆具毗卢遮那佛性海之依据。"
    definition_en: "The innate potential for Buddhahood present in all sentient beings."

  # --- 华严宗特有教理 ---

  - id: term_006
    category: doctrine
    sa: āvaraṇa-vimokṣa
    sa_iast: āvaraṇa-vimokṣa
    bo_wylie: sgrib pa rnam par grol ba  # 待确认
    zh: 事事无碍
    en: unobstructed interpenetration of all phenomena
    definition_zh: "华严宗究竟教义。一切事法之间相互融通，无一法能障碍他法，一尘中含法界，一念摄无尽。"
    definition_en: "The ultimate Huayan doctrine: all phenomena interpenetrate without obstruction; a single dust mote contains the entire Dharma realm."
    alt_translations:
      zh: ["事事无碍法界", "圆融无碍"]
      en: ["non-obstruction among events", "perfect interpenetration"]

  - id: term_007
    category: doctrine
    zh: 理事无碍
    en: unobstructed interpenetration of principle and phenomena
    definition_zh: "理（真如、空性）与事（差别万象）之间圆融无碍。理遍于事，事揽理成。"
    definition_en: "The non-obstruction between universal principle (li) and particular phenomena (shi)."

  - id: term_008
    category: doctrine
    sa: daśa-bhūmayaḥ
    sa_iast: daśa-bhūmayaḥ
    bo_wylie: sa bcu
    bo_unicode: "ས་བཅུ།"
    zh: 十地
    en: ten grounds / ten bhūmis
    definition_zh: "菩萨修行的十个阶位: 欢喜地、离垢地、发光地、焰慧地、难胜地、现前地、远行地、不动地、善慧地、法云地。"
    definition_en: "The ten stages of bodhisattva practice."

  - id: term_009
    category: state
    sa: samādhi
    sa_iast: samādhi
    bo_wylie: ting nge 'dzin
    bo_unicode: "ཏིང་ངེ་འཛིན།"
    zh: 三昧 / 定
    en: meditative absorption / concentration
    definition_zh: "心一境性，专注不散。华严经中有'海印三昧'、'华严三昧'等殊胜禅定。"
    definition_en: "One-pointed concentration. The Avatamsaka Sūtra describes the 'Ocean-Seal Samādhi' and 'Huayan Samādhi'."

  - id: term_010
    category: state
    zh: 海印三昧
    en: Ocean-Seal Samādhi (sāgara-mudrā-samādhi)
    definition_zh: "佛说华严经时入于海印三昧。譬如大海，能映现一切万象；佛心如海，一时普现十方法界无尽缘起。"
    definition_en: "The samādhi in which the Buddha taught the Avatamsaka Sūtra. Like the ocean reflecting all images, the Buddha's mind simultaneously manifests the infinite interdependent arising of all realms."

  # --- 佛菩萨名号 ---

  - id: term_011
    category: name
    sa: Vairocana
    sa_iast: Vairocana
    bo_wylie: rnam par snang mdzad
    bo_unicode: "རྣམ་པར་སྣང་མཛད།"
    zh: 毗卢遮那佛
    en: Vairocana Buddha
    definition_zh: "华严经的本尊佛，光明遍照之意。为华藏世界的教主，是法身佛，一切诸佛之法身。"
    definition_en: "The central Buddha of the Avatamsaka Sūtra, whose name means 'The Illuminator'. He is the Dharmakāya Buddha presiding over the Lotus Treasury World."

  - id: term_012
    category: name
    sa: Samantabhadra
    sa_iast: Samantabhadra
    bo_wylie: kun tu bzang po
    bo_unicode: "ཀུན་ཏུ་བཟང་པོ།"
    zh: 普贤菩萨
    en: Samantabhadra Bodhisattva
    definition_zh: "华严经中代表大行大愿的菩萨，与文殊菩萨同为毗卢遮那佛之胁侍。普贤十大愿王出自《四十华严·普贤行愿品》。"
    definition_en: "The bodhisattva representing great practice and vows, appearing as Vairocana's attendant alongside Mañjuśrī."

  - id: term_013
    category: name
    sa: Mañjuśrī
    sa_iast: Mañjuśrī
    bo_wylie: "jam dpal dbyangs"
    bo_unicode: "འཇམ་དཔལ་དབྱངས།"
    zh: 文殊菩萨
    en: Mañjuśrī Bodhisattva
    definition_zh: "华严经中代表智慧第一的菩萨，与普贤菩萨共为毗卢遮那佛之胁侍。"
    definition_en: "The bodhisattva representing supreme wisdom."

  # --- 华严世界结构 ---

  - id: term_014
    category: cosmology
    zh: 华藏世界
    en: Lotus Treasury World (Padmagarbha-lokadhātu)
    definition_zh: "毗卢遮那佛所教化之世界，由无量香水海、世界种层层环绕而成。二十重世界，重重无尽。"
    definition_en: "The universe system presided over by Vairocana Buddha, consisting of incalculable worlds within worlds in infinite interpenetration."

  - id: term_015
    category: cosmology
    zh: 七处九会
    en: Seven Locations and Nine Assemblies
    definition_zh: "八十华严的说法结构。佛于七个地点召开九次法会，依次升进，展转深入华严教义。"
    definition_en: "The structural framework of the 80-fascicle Avatamsaka: nine assemblies held at seven locations, progressively revealing deeper teachings."

  # --- 修行阶位 ---

  - id: term_016
    category: state
    sa: bodhicitta
    sa_iast: bodhicitta
    bo_wylie: byang chub kyi sems
    bo_unicode: "བྱང་ཆུབ་ཀྱི་སེམས།"
    zh: 菩提心
    en: mind of awakening / bodhicitta
    definition_zh: "发愿成佛、利益众生的心。华严经以'初发心时便成正觉'彰显发心之殊胜。"
    definition_en: "The aspiration to attain Buddhahood for the benefit of all beings."

  - id: term_017
    category: state
    zh: 十信
    en: ten stages of faith
    definition_zh: "华严修行五十二位之最初十位: 信心、念心、精进心、慧心、定心、不退心、护法心、回向心、戒心、愿心。"
    definition_en: "The first ten of the 52 stages of Huayan practice, establishing the foundation of faith."

  - id: term_018
    category: state
    zh: 十住
    en: ten abodes
    definition_zh: "十信之后，安住于佛法正理，不再退转: 发心住、治地住、修行住、生贵住、方便具足住、正心住、不退住、童真住、法王子住、灌顶住。"
    definition_en: "The ten abodes following the ten faiths, where the practitioner stabilizes in authentic understanding."

  - id: term_019
    category: state
    zh: 十行
    en: ten practices
    definition_zh: "十住之后，广行利他: 欢喜行、饶益行、无瞋恨行、无尽行、离痴乱行、善现行、无著行、尊重行、善法行、真实行。"
    definition_en: "The ten practices of engaged beneficence following the ten abodes."

  - id: term_020
    category: state
    zh: 十回向
    en: ten dedications / ten transfers of merit
    definition_zh: "十行之后，将一切功德回向法界: 救护一切众生离众生相回向、不坏回向、等一切佛回向、至一切处回向、无尽功德藏回向、随顺平等善根回向、随顺等观一切众生回向、真如相回向、无缚解脱回向、法界无量回向。"
    definition_en: "The ten dedications of all merit to the Dharma realm."

  # --- 华严宗祖师简称 ---

  - id: term_021
    category: lineage
    zh: 五教十宗
    en: Five Teachings and Ten Schools (Huayan doctrinal classification)
    definition_zh: "法藏（贤首国师）建立的判教体系。五教: 小乘教、大乘始教、大乘终教、顿教、圆教（华严）。十宗进一步细分。"
    definition_en: "Fazang's system of doctrinal classification placing Huayan at the apex as the 'Perfect Teaching'."

  - id: term_022
    category: lineage
    zh: 华严五祖
    en: Five Huayan Patriarchs
    definition_zh: "杜顺、智俨、法藏、澄观、宗密。华严宗从初创到完成的五位核心祖师。"
    definition_en: "Dushun, Zhiyan, Fazang, Chengguan, and Zongmi — the five foundational masters of the Huayan school."

  # --- 品目相关 ---

  - id: term_023
    category: scripture
    sa: Gaṇḍavyūha
    sa_iast: Gaṇḍavyūha
    bo_wylie: sdong po bkod pa
    bo_unicode: "སྡོང་པོ་བཀོད་པ།"
    zh: 入法界品
    en: The Stem Array / Entry into the Dharma Realm
    definition_zh: "华严经最后一品，也是最宏大的一品。善财童子五十三参，遍历一百一十城，参访五十三位善知识，终入法界。"
    definition_en: "The final and most extensive chapter, recounting Sudhana's pilgrimage to 53 spiritual teachers."

  - id: term_024
    category: scripture
    sa: Bhadracarī-praṇidhāna
    sa_iast: Bhadracarī-praṇidhāna
    bo_wylie: bzang po spyod pa'i smon lam
    bo_unicode: "བཟང་པོ་སྤྱོད་པའི་སྨོན་ལམ།"
    zh: 普贤行愿品 / 普贤菩萨行愿赞
    en: The King of Aspiration Prayers / Samantabhadra's Aspiration
    definition_zh: "四十华严末品。普贤菩萨开示十大行愿。藏汉佛教共同尊奉为修行日课。"
    definition_en: "The aspirational prayer of Samantabhadra's ten great vows, revered in both Chinese and Tibetan Buddhism."

  - id: term_025
    category: scripture
    sa: Tathāgatāvataṃsaka
    sa_iast: Tathāgatāvataṃsaka
    zh: 如来华严品
    en: The Tathāgata Avatamsaka Chapter
    definition_zh: "藏文《华严经》特有品目（第11品）。位于毗卢遮那品后、如来名号品前。汉文诸译本均无此品。"
    definition_en: "A chapter unique to the Tibetan Avatamsaka (Ch.11), absent from all Chinese translations. A key translation target of this project."
    alt_translations:
      en: ["The Tathāgata's Ornament", "The Buddha's Garland Chapter"]

  # --- 补充术语 (从gap.js提取·共25条新词) ---

  - id: term_026
    category: state
    sa: bhūmi
    sa_iast: bhūmi
    bo_wylie: sa
    zh: 地 / 阶位
    en: stage / ground
    definition_zh: "菩萨修行的阶位。华严经立十地为根本修行框架。"
    definition_en: "A stage or level of bodhisattva practice. The Avatamsaka establishes ten bhūmis as the fundamental framework."

  - id: term_027
    category: scripture
    sa: Daśabhūmika
    sa_iast: Daśabhūmika
    bo_wylie: sa bcu pa
    zh: 十地品
    en: The Ten Bhūmis Sūtra
    definition_zh: "华严经核心品目。独立流通时有《十地经》《十住经》等别译本。世亲造《十地经论》注释。"
    definition_en: "A core chapter of the Avatamsaka, also circulating independently."

  - id: term_028
    category: practice
    sa: bhadracaryā
    sa_iast: bhadracaryā
    bo_wylie: bzang po spyod pa
    zh: 普贤行
    en: good conduct / Samantabhadra's practice
    definition_zh: "普贤菩萨所行之广大行愿。以十大愿王为纲领。"
    definition_en: "The vast practice and conduct of Samantabhadra Bodhisattva."

  - id: term_029
    category: practice
    sa: praṇidhāna
    sa_iast: praṇidhāna
    bo_wylie: smon lam
    zh: 愿 / 誓愿
    en: aspiration prayer / vow
    definition_zh: "菩萨发自内心深处的誓愿。普贤十大愿为此中最殊胜者。"
    definition_en: "A solemn vow or aspiration arising from the depths of a bodhisattva's heart."

  - id: term_030
    category: cosmology
    sa: vihāra
    sa_iast: vihāra
    bo_wylie: gnas
    zh: 住处 / 法会
    en: abode / assembly location
    definition_zh: "华严经七处九会中佛说法的各个地点。"
    definition_en: "The locations where the Buddha taught in the Avatamsaka's seven locations and nine assemblies."

  - id: term_031
    category: doctrine
    zh: 法界缘起
    en: dharma-realm dependent origination (dharmadhātu-pratītya-samutpāda)
    definition_zh: "华严宗核心教义。一切法在法界中互为因果、相即相入、重重无尽的缘起关系。超越业感缘起与阿赖耶缘起，为最究竟的缘起义。"
    definition_en: "The Huayan school's core teaching: all dharmas arise interdependently within the Dharma realm in mutual identity and interpenetration."

  - id: term_032
    category: doctrine
    sa: ekayāna
    sa_iast: ekayāna
    bo_wylie: theg pa gcig pa
    zh: 一乘
    en: single vehicle / one vehicle
    definition_zh: "唯一佛乘。华严宗以'别教一乘'判摄华严，谓华严教义超越三乘，直显佛之本怀。"
    definition_en: "The single Buddha vehicle. Huayan classifies itself as the 'distinct teaching of the One Vehicle' transcending the three vehicles."

  - id: term_033
    category: state
    sa: avaivartika / avinivartanīya
    sa_iast: avaivartika
    bo_wylie: phyir mi ldog pa
    zh: 不退转
    en: non-retrogressing / irreversible
    definition_zh: "修行达到不再退转的阶位。华严十信满心即入不退转位。"
    definition_en: "The stage at which spiritual progress becomes irreversible."

  - id: term_034
    category: state
    sa: anuttarā-samyak-saṃbodhi
    sa_iast: anuttarā-samyak-saṃbodhi
    bo_wylie: bla na med pa yang dag par rdzogs pa'i byang chub
    zh: 阿耨多罗三藐三菩提
    en: unsurpassed perfect enlightenment
    definition_zh: "无上正等正觉。佛之究竟觉悟。"
    definition_en: "The supreme, perfect enlightenment of a Buddha."

  - id: term_035
    category: doctrine
    sa: kuśala-mūla
    sa_iast: kuśala-mūla
    bo_wylie: dge ba'i rtsa ba
    zh: 善根
    en: roots of virtue
    definition_zh: "能生一切善法之根本。包括无贪、无瞋、无痴三善根。"
    definition_en: "The fundamental roots that give rise to all virtuous qualities."

  - id: term_036
    category: practice
    sa: pāramitā
    sa_iast: pāramitā
    bo_wylie: pha rol tu phyin pa
    zh: 波罗蜜 / 到彼岸
    en: perfection / transcendent virtue
    definition_zh: "菩萨修行之六种或十种究竟行法，从生死此岸度至涅槃彼岸。"
    definition_en: "The six or ten perfections by which the bodhisattva crosses from saṃsāra to nirvāṇa."

  - id: term_037
    category: practice
    sa: dāna-pāramitā
    sa_iast: dāna-pāramitā
    bo_wylie: sbyin pa'i pha rol tu phyin pa
    zh: 布施波罗蜜
    en: perfection of giving
    definition_zh: "六波罗蜜之首。财施、法施、无畏施三轮体空之行。"
    definition_en: "The first of the six perfections — the practice of giving in its three forms (wealth, Dharma, fearlessness) done with the three wheels (giver, receiver, gift) seen as empty of self-nature."

  - id: term_038
    category: practice
    sa: śīla-pāramitā
    sa_iast: śīla-pāramitā
    bo_wylie: tshul khrims kyi pha rol tu phyin pa
    zh: 持戒波罗蜜
    en: perfection of ethical conduct
    definition_zh: "以戒律清净身口意三业，防非止恶之行。"
    definition_en: "The perfection of ethical conduct — discipline that purifies body, speech, and mind, preventing wrongdoing and upholding goodness."

  - id: term_039
    category: practice
    sa: kṣānti-pāramitā
    sa_iast: kṣānti-pāramitā
    bo_wylie: bzod pa'i pha rol tu phyin pa
    zh: 忍辱波罗蜜
    en: perfection of patience
    definition_zh: "安忍于顺逆之境，心无瞋恼之行。"
    definition_en: "The perfection of patience — enduring favorable and adverse circumstances with equanimity, the mind free from anger and vexation."

  - id: term_040
    category: practice
    sa: vīrya-pāramitā
    sa_iast: vīrya-pāramitā
    bo_wylie: brtson 'grus kyi pha rol tu phyin pa
    zh: 精进波罗蜜
    en: perfection of diligence
    definition_zh: "勇猛无间于善法，勤修断恶修善之行。"
    definition_en: "The perfection of diligence — vigorous, untiring effort in wholesome practice, ceaselessly abandoning evil and cultivating good."

  - id: term_041
    category: practice
    sa: dhyāna-pāramitā
    sa_iast: dhyāna-pāramitā
    bo_wylie: bsam gtan gyi pha rol tu phyin pa
    zh: 禅定波罗蜜
    en: perfection of meditation
    definition_zh: "摄心一境，止观双运，得三摩地之行。"
    definition_en: "The perfection of meditation — gathering the mind in single-pointed concentration, uniting tranquility and insight in samadhi."

  - id: term_042
    category: practice
    sa: prajñā-pāramitā
    sa_iast: prajñā-pāramitā
    bo_wylie: shes rab kyi pha rol tu phyin pa
    zh: 般若波罗蜜
    en: perfection of wisdom
    definition_zh: "六波罗蜜之核心。照见诸法实相之无分别智。"
    definition_en: "The perfection of wisdom and the heart of the six perfections — the non-discriminating wisdom that directly discerns the true nature of all dharmas."

  - id: term_043
    category: scripture
    sa: Buddhāvataṃsaka
    sa_iast: Buddhāvataṃsaka
    bo_wylie: sangs rgyas phal po che
    zh: 华严 / 佛华严
    en: Buddha-ornament / Flower Ornament
    definition_zh: "华严经之梵文经题。具称《大方广佛华严经》。'华'喻菩萨万行，'严'喻庄严果德。"
    definition_en: "The Sanskrit title of the Avatamsaka Sūtra, meaning 'Buddha's Flower Ornament'."

  - id: term_044
    category: state
    zh: 十信位
    en: ten stages of faith
    definition_zh: "海云法师体系中的十信位果位对应：初信(舍识用根)→二信(确认菩提心)→三信(运用观照技术)→五信(三果)→六信(四果向)→七信(四果·破我执)→八信(发心破法执)→九信(我执法执双破)→十信圆满(照见五蕴空)→入法界。"
    definition_en: "The ten stages of faith in Venerable Haiyun's system, each with a fruit-correspondence: initial faith (abandoning consciousness, operating from the sense-base) → second (confirming bodhicitta) → third (applying contemplative technique) → fifth (the third fruit) → sixth (toward the fourth fruit) → seventh (fourth fruit, breaking self-grasping) → eighth (resolve to break dharma-grasping) → ninth (self- and dharma-grasping both broken) → tenth perfected (seeing the five aggregates as empty) → entering the dharma-realm."

  - id: term_045
    category: doctrine
    zh: 能所双泯
    en: dissolution of subject-object duality
    definition_zh: "海云继梦禅观体系核心概念。认识心(能)与所观境(所)的二元对立完全消融，为真如实观的究竟境界。"
    definition_en: "The complete dissolution of the duality between the cognizing subject and the cognized object."

  - id: term_046
    category: practice
    zh: 象限转移
    en: quadrant shift
    definition_zh: "海云法师禅修术语。从凡夫认知象限转移到行者觉知象限的质变过程，为净化禅到安般守意的关键转折。"
    definition_en: "A qualitative shift from ordinary cognitive mode to practitioner's awareness mode."

  - id: term_047
    category: lineage
    zh: 普贤乘华严宗
    en: Samantabhadra Vehicle Huayan School
    definition_zh: "海云继梦法师提出的华严宗新定位。以普贤菩萨行愿为修行总纲，融合华严教观与瑜伽行法。"
    definition_en: "A contemporary re-envisioning of Huayan by Ven. Haiyun Jimeng, centered on Samantabhadra's practice."

  - id: term_048
    category: practice
    zh: 工程面 / 技术面
    en: engineering dimension / technical dimension
    definition_zh: "海云法师禅观教学双轨。技术面(修定·身法)：可操作的禅修步骤序列；工程面(修慧·心法)：意识状态的质的转变。"
    definition_en: "A dual-track teaching approach: technical dimension (operational meditation steps) and engineering dimension (qualitative transformation of consciousness)."

  - id: term_049
    category: practice
    zh: 安般守意
    en: ānāpāna-smṛti / mindfulness of breathing
    definition_zh: "数息观。海云法师禅观前行核心法门：数、随、止三法次第。"
    definition_en: "Mindfulness of breathing, the core preliminary meditation method in Haiyun's system."

  - id: term_050
    category: practice
    zh: 驻佇心观
    en: abiding-mind contemplation
    definition_zh: "海云法师资粮道根本前行观法。停心于一处，为四种观法之基础。"
    definition_en: "The foundational preliminary contemplation in Haiyun's system, settling the mind at one point."
