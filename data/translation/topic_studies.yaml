    version: ⚠️ 草稿·征求意见 · 十六章·结语·二附录 · 八幅图表 · 九项技术盘点 · 六项原则与十项评测 · 局限与待核登记
    doc: docs/汉传佛教/新技术与佛教_AI与数字人文研究.md
    meta: |
      **定位**：佛教与新技术关系的专题研究——不作笼统的技术颂扬或技术怀疑，而是把相关技术
      逐项拆开，就「通用成熟度／佛教语域适配／主要瓶颈」三事分别评估，并给出可执行的治理框架。
      **方法**：信源以 A（机构官方发布／官方文件）、B（同行评议学术）、C（权威新闻与机构消息稿）
      三级标注；项目自述数据一律标【自述】；查无来源者如实标〔待核〕，不以推测填补；
      事实与判断分离（判断处标「（判断）」）。
      **立场**：对新技术不作笼统之褒贬，而致力于厘清其**前提条件与效能边界**——可为者言其可为，不可为者言其不可为。
      **看点**：汉传／藏传／南传数字化三传统比较（差距根源在组织形态而非技术能力）·
      九项技术成熟度盘点 · 佛教知识工程八层 · LLM 任务分级表 · 「可信佛学 AI」标准工作流 ·
      AI 辅助译经的分层术语标准与覆盖率仪表盘 · 修行辅助四层（学习辅助不等于修行本身）·
      「权威让渡」五风险 · 佛教哲学对 AI 伦理的贡献与其误用 · 六项原则与十项评测 ·
      跨学科（超学科）视角与实践者参与 · 建设主体「不需要新教团，需要联盟」。
