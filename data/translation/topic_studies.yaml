    doc: docs/佛门真伪问题_综合深度研究.md
    meta: |
      **定位**：以「真伪」为棱镜的佛门内部考据学全景——对象横跨文本层、人物层、行迹层、制度层、义理层。
      **方法**：信源四分级（A 原典/CBETA → B 学术 → C 教界转述 → D 线索）；判定可行性三轴
      （可判定 / 不可判定 / 超验）；名人「异处成道」传说检证四问；AI 时代真伪三问。
      **立场**：「伪」不等于「无用」；死磕的圆满在知道何时该问、何时该答、何时该沉默
      （箭喻、十无记、龙树离二边）。
      **看点**：达摩/慧能/虚云祖师叙事层累 · 坛经版本谱系 · 楞严/起信/心经考辨 ·
      化胡经与佛道互抄 · 耶稣「印度学佛」说三源并考 · 景教碑真伪 · 金瓶掣签制度 ·
      大乘非佛说与批判佛教 · 敦煌与会集本 · AI 参与生成、「AI 胡说八道与禅机」。
