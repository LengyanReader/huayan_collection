    title_sub: 综合研究报告（全文·中英对照）
    version: 四部三十三章 · 110 条断言逐条回一手来源核验 · 62 处中英对照 · 勘误记录 30 余项
    doc: docs/汉传佛教/汉传佛教全球传播与数字未来_综合研究报告.md
    meta: |
      **定位**：以汉传佛教自身立场出发的全球传播与数字化战略研究——先诊断（现状与九处问题），
      再剖析技术变量（AI 与知识基础设施），最后落到「应该如何传播和发展」的处方。
      **方法**：六稿合并，110 条可核查断言逐条回到一手来源核验；信源四级——
      A（一手统计／官方文件／司法通报／机构官网）、B（同行评议学术）、C（权威新闻与机构消息稿）、
      D（仅作检索线索，不作论据）；教团自述数据一律标【自述】；事实与判断分离（判断处标「（判断）」）。
      **立场**：站在汉传佛教内部说话，对自身问题力求坦白不避其丑；对新技术既不排斥亦不迷信。
      **看点**：佛光山道场数三种口径的来龙去脉 · 慈济「103 国」实为 103,329 位志工之误读 ·
      汉传独有的比丘尼戒统回传 · CBETA 收录量订正（9,200→4,899 部）· 学诚案次序勘误 ·
      佛典英译覆盖率仪表盘 · AI 的四层修行辅助与「权威让渡」五风险 · 佛教知识工程八层 ·
      公共产品化与「模块」为传播单位 · 本土化的边界判准 · 三大语系的交换结构 ·
      「判断引用真假只认逐条访问，不认编号直觉」。
    tags: [全球传播, 现状诊断, 治理公信, 语言与译经, 本土化, 数字人文, 佛教AI, 知识基础设施, 知识图谱, 信源考证]