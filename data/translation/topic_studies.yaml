# 专题研究 — gap Tab「专题研究」栏目
# 源: docs/*.md 整篇深度研究文档; build.py 依 doc 路径读取全文并注入 (doc_md)。
# 说明: 每篇专题即一部完整深度研究文档（信源分级、存疑标注、参考文献齐备），
#       前端整文渲染并自动生成章节目录；新增专题 = 在此加一条 article + doc 路径，不改代码。
# 用途: 供 Tab2 华严文献 → 专题研究 视图展示。

title: 🌏 专题研究
intro: |
  「专题研究」是华严文献页的深读库——每一篇即是一部完整的综合深度研究文档（构建时整篇注入，
  前端自动生成章节目录与锚点跳转）。专题以「真伪考据」与「文献学」为纲，遵循 A/B/C/D 信源分级、
  〔存疑〕标注与「伪不等于无用」的基本立场。
  首篇《佛门真伪问题》横向贯通疑经目录学→六部要籍文本考辨→人物祖谱层累→法脉祖统建构→
  佛道交涉与西来说→义理判准→近代考据学史→元反思（何时该死磕/置答）→AI 时代真伪。
  次篇《永嘉玄觉大师》则将视野延伸至禅门——以「一宿觉」公案、《永嘉证道歌》作者真伪公案、
  「禅林四大文字」为枢纽，在台禅交涉、天台「夺他成己」批评、百年跨国译介史之间架起桥梁。

