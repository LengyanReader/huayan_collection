      **立场**：作者公案不预设立场、存疑并陈（陈盛港「神会说」／贾晋华「洪州宗起源说」）；
      天台祖位异说（玄朗八祖、《宋高僧传》「传法号五祖」异文）如实胪列；各出版信息经考订订正。
      **看点**：从义《法华经三大部补注》卷十一「夺他成己」原文（并附其对澄观、宗密的批评）·《宋高僧传》
      「至若神秀门庭，遐征问法」·曹溪四句问答用字校勘·《维摩经》/《涅槃经》开悟两说并存·
      天台祖统序列·Red Pine 2019 与 BDK 2021 译本订正·铃木→陆宽昱→红松→蒲慕伦百年英译流变·
      宋行靖/明传灯/高丽己和历代注疏。
