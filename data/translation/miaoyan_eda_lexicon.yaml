  note: 〔更正·证伪〕旧注「音译『那』之疑似异体」（旧 py 字段作 na）经证伪，已删。经 T279 全篇核：①码位 U+2A5C7（旧注未记）；②全经 24 见，其中**仅 2 见在名号内**（「大精進金剛𪗇菩薩摩訶薩」「輪𪗇天王」），余 22 见皆在经文正文与韵文（如「於𪗇輪中放百萬阿僧祇光」「次前，於金剛𪗇佛所」「光味摩尼以為其𪗇」「十方一切諸佛𪗇中，皆放光明」「玉王𪗇臍眾神」）；③**CBETA 自家校勘在不同处分别作「𪗇＝齊」与「𪗇＝臍」，二者互不一致**——如「消＝銷【宮】𪗇＝齊【三】」「耀＝曜【宮】𪗇＝齊【宮】」「玉＝王【三】【宮】𪗇＝臍【三】【宮】」。校记既不能给出一致对应，正说明 CBETA 编校方亦将其视为底本字形存疑之衍/讹标记，而非有确定读音的音译字。故其义不可判，**不得归入任何音译域**；旧说之「那」在 CBETA 校勘中毫无支持，故 py 亦一并清空。**本条非「待归域」而是「已考订而不可归域」**，以 unresolved_glyph 标记。
