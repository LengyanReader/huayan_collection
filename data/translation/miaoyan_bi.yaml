    unit: ratio
funnel:
  note: 本漏斗分**两轨**，不可连读为一轨：轨道一「名号」逐层收窄，轨道二「词素位」逐层收窄；而二轨之间是**扩张**——一名析为多位词素。故「名号 414 < 词素位 1877」并非异常，而是转换之必然结果。若强并为一轨，则扩张之步会被误读为「流失」。又：t3
    之流失（medium+low 之和）**不表示数据缺失**，而表示判读存疑之比重；误读为「覆盖率不足」即错解此表。
  note_en: 'The funnel has two tracks that must not be read as one: track one (names) narrows, track two
    (token positions) narrows, and between the two lies an expansion — one name yields several token positions.
    ''414 names < 1877 positions'' is therefore not an anomaly but the necessary result of the transformation;
    merging the tracks would make that expansion look like attrition. Further, the loss at t3 (medium
    plus low) does not indicate missing data but the share of uncertain readings; reading it as a coverage
    deficit misreads the table.'
  conversion:
    tokens_per_name: 4.5338
    zh: 换算因子：每名平均析为几位词素
    en: 'conversion factor: mean token positions yielded per name'
    no_core: 0
  track_names:
    zh: 轨道一 · 名号
    en: Track one — names
    stages:
    - key: n1
      zh: 经文明列名号
      en: Named assemblies in the sutra
      n: 414
      pct_of_track: 1.0
      definition: 《世主妙严品》所明列之名号总数（assembly 层经文事实）
    - key: n2
      zh: 有可析之核名
      en: Names with an analysable core
      n: 414
      pct_of_track: 1.0
      definition: 剥去类尾后尚余有可析之核者；无核者记 ∅（CBETA 省文记号或核与类名全同者）
  track_tokens:
    zh: 轨道二 · 词素位
    en: Track two — token positions
    stages:
    - key: t1
      zh: 词素位
      en: Token positions
      n: 1877
      pct_of_track: 1.0
      definition: 核名按词素表切分之位置数（多字词一次计一位）
    - key: t2
      zh: 已归语义域
      en: Assigned to a semantic domain
      n: 1858
      pct_of_track: 0.9899
      definition: 归入十七语义域之一者；未定域者不入
    - key: t3
      zh: high 判读
      en: High-confidence reading
      n: 1589
      pct_of_track: 0.8466
      definition: 一字一句之义已核定者
  reconciliation:
    zh: '**对账**：本层自「逐词素」重算，EDA 之 metrics 为「导入时」统计，二者应当相符；不相符即数据有变或统计口径有别，须查因。'
    en: 'Reconciliation: this layer recomputes from the segments themselves while the EDA metrics were
      computed at import time. The two must agree; any gap means the data or the counting basis has changed
      and must be investigated.'
    caveat_zh: '**一处口径之差，须明辨**：EDA 之 lowconf_hits／medconf_hits 统计**全域**（含未定域词素）；本层 high/medium/low 只计**已归域**者。故「归域内
      low」少于「全域 low」，二者之差即未定域中之 low。两个数字都对，只是所计之集合不同——混用即错。'
    caveat_en: 'One counting difference must be made explicit: the EDA lowconf_hits and medconf_hits counts
      span all token positions including those with unassigned domain, whereas the high/medium/low split
      here covers assigned positions only. The gap is exactly the low-confidence unassigned positions.
      Both figures are correct; they simply count different sets, and conflating them would be an error.'
    tokens_total:
      bi: 1877
      eda: 1877
      match: true
    named_total:
      bi: 414
      eda: 414
      match: true
    no_core:
      bi: 0
      eda: 0
      match: true
    unassigned_segs:
      bi: 19
      eda: 19
      match: true
    lowconf_hits:
      bi: 19
      eda: 19
      match: true
    medconf_hits:
      bi: 258
      eda: 258
      match: true
    grade_matrix:
    - scope: assigned
      confidence: high
      n: 1589
    - scope: assigned
      confidence: low
      n: 16
    - scope: assigned
      confidence: medium
      n: 253
    - scope: unassigned
      confidence: high
      n: 11
    - scope: unassigned
      confidence: low
      n: 3
    - scope: unassigned
      confidence: medium
      n: 5
    grade_matrix_note_zh: 由此矩阵可直接读出「已归域／未定域」×「high／medium／low」之实数分布；页面须并列此矩阵，以免读者以「归域内 low」冒充「全域 low」。
    grade_matrix_note_en: This matrix gives the actual counts of assigned/unassigned against high/medium/low;
      the page must display it so that 'low within assigned' is never mistaken for 'low overall'.
  grades:
    high:
      n: 1589
      pct: 0.8552
      zh: 一字一句之义已核定
      en: reading settled
      duty: 无须标注
      duty_en: no annotation required
    medium:
