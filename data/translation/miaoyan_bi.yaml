benchmark:
  note_zh: 雷达图各轴皆已**逐轴极差归一**（同轴内最劣为 0、最优为 1），故只可比较「同一指标之相对位次」，**不可**跨轴比较绝对大小——归一即抹去量纲。轴之朝向为「外优内劣」，故多边形越外扩者越优；惟
    low 占比、判读存疑占比二轴本为「内优外劣」（越低越好），已在图中反向标示，不可误读为「越大越好」。
  note_en: Every axis is min-max normalised within itself (worst = 0, best = 1), so only the relative
    standing on one metric is comparable; magnitudes across axes are not, since normalisation removes
    scale. Outward is better, except the two uncertainty axes (low rate, uncertain-reading rate) where
    inward is better — these are drawn inverted and must not be read as 'bigger is better'.
