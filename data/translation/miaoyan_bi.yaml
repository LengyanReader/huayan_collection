  note_zh: 本节问：经文把四十类依次排出，其**前后相邻**之两类是否比随机两两更相近？若显著更高，则类次之编排本身含语义梯度（非随机排列）；若不显著，则类次或为编纂体例之故。此为统计检验，不涉教义。
  note_en: This section asks whether classes adjacent in the sutra's order are more similar than randomly
    chosen pairs. If significantly higher, the ordering itself carries a semantic gradient rather than
    being arbitrary; if not, the order may reflect editorial convention. This is a statistical test, not
    a doctrinal one.
  method_zh: 以 LCG 定种（种子 19970815）作 5000 次随机置换之零分布，取 z 值与正态近似 p
  method_en: Null distribution from 5000 random permutations drawn from a seeded LCG (seed 19970815);
    z statistic and normal-approximation p
  adjacent_mean: 0.5533
  null_mean: 0.3426
  null_sd: 0.0343
  z: 6.1388
  p: 0.0
  all_pairs_mean: 0.3422
  same_group_adjacent: 0.566
  cross_group_adjacent: 0.4421
  confound:
