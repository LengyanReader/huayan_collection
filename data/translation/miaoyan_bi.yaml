pca:
  method_zh: PCA：对「类×语义域」TF-IDF 加权矩阵按列中心化，求 17×17 协方差之特征分解（Jacobi 旋转，纯 Python 实现），取前若干主成分。坐标已作符号规范化以保证可复现。
  method_en: 'PCA: the class-by-domain TF-IDF matrix is column-centred, its 17x17 covariance matrix diagonalised
    by Jacobi rotations (pure-Python), and the leading components retained. Component signs are normalised
    so that results are reproducible.'
  caveat_zh: 二维散点**不可**读作「距离之远近」——主成分投影有损，三维以上之差异常被压平；两轴之正负亦无教义向背之意，仅为统计方向。
  caveat_en: 'The 2-D scatter must not be read as true distance: a principal-component projection is lossy
    and flattens differences lying beyond the retained axes. The signs of the axes carry no doctrinal
    valence; they are statistical directions only.'
