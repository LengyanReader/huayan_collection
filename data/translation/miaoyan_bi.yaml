clustering:
  method_zh: 层次聚类（average linkage）＋余弦距离；自 k=2 至 k=15 逐一切分并算全样本平均轮廓系数，取其最大者为最佳 k（仅取切分后确为 k 簇者入算）。稳定性以 LCG
    定种（种子 20240717）bootstrap 200 次量同簇共现率。
  stability_method_zh: 稳定性为**无放回 80% 子抽样**（jackknife 型）之同簇共现率：定种 LCG（种子 20240717）重复 200 次，每次无放回抽取 32/40
    个类，重作层次聚类并切于最佳 k；某一对类之共现率 = 该对同簇之次数 ÷ 该对同时入选之次数。**更正**：旧式用有放回 bootstrap，而仅 40 个类有放回抽 40 次时期望仅约 25.3
    个互异单位入选，任一对同时入选之概率本已受限，共现率因而被结构性压低；今改无放回，分母改为「同时入选之次数」，故新旧稳定度之数值不可直接比较。
  stability_method_en: 'Stability is the co-assignment rate under **subsampling without replacement at
    80%** (jackknife-type): a seeded LCG (seed 20240717) draws 32 of the 40 classes without replacement,
    200 times, re-runs hierarchical clustering and cuts at the best k; a pair''s rate is the number of
    resamples in which the pair co-clustered, divided by the number of resamples in which the pair was
    drawn together. **Correction**: an earlier implementation used bootstrap with replacement; drawing
    40 classes with replacement from only 40 classes leaves on average just 25.3 distinct units drawn,
    which mechanically depresses co-assignment. Subsampling removes that bias, so old and new stability
    figures are not directly comparable.'
  method_en: Agglomerative clustering (average linkage) on cosine distance; for k = 2..15 the data is
    cut at each k and the mean silhouette computed, the maximum being the chosen k (only cuts yielding
    exactly k clusters are admitted).
  caveat_zh: 聚类之数（k）非经文所定，乃算法依轮廓系数所择。故簇界可随参数而移，此表当读作「一种可复现之切分」，非「经文自有之类别」。
  caveat_en: The number of clusters is not fixed by the sutra; it is chosen by the algorithm via the silhouette
    coefficient. Cluster boundaries shift with parameters, so this table should be read as one reproducible
    partition, not as the sutra's own categories.
  best_k: 6
  best_silhouette: 0.43
  k_range:
  - 2
  - 15
  k_at_boundary: false
  k_boundary_note_zh: 最佳 k 落于区间内部。
  k_boundary_note_en: the best k lies inside the scanned range
  weak_structure_zh: 轮廓系数 0.43 分离度尚可：语汇面貌可见数处聚处，然仍非截然分群，故本页聚类当读作「一种可复现之切分」，不宜作「经文自有之类别」。
  weak_structure_en: the silhouette of 0.43 indicates moderate separation; several groupings are discernible,
    yet they are not sharply divided, so this partition should be read as one reproducible cut rather
    than the sutra's own categories.
