    note_zh: '**本节之 z 值须与混淆诊断对读**：全品中「主X神」诸类共用一句式（类尾同为「神」），句式相同故域分布趋同；此类又被排为相邻，故相邻相似度可能被推高。但实测混淆幅度有限：同句式相邻
      0.5675 与异句式相邻 0.5307 仅差 0.0368，故主效应非由此项造成。为不凭推理定论，另立**去混淆检验**（de-confounded，见下）：仅取异句式之相邻类对重作置换检验，此为「语义梯度」之真正所在之判据。'
    note_en: 'The z statistic must be read together with this confounding check. The 「主X神」 classes of
      this sutra share one template (the same class tail, 「神」), so their domain profiles converge; they
      are also placed adjacently, which could inflate adjacent similarity. The measured confound is however
      small: same-template adjacent 0.5675 differs from different-template adjacent 0.5307 by only 0.0368,
      so the main effect is not produced by it. Rather than settle this by argument, a separate de-confounded
      test is run below, using adjacent pairs with different templates only; that is the real criterion
      for a semantic gradient.'
    deconfounded:
      zh: 去混淆检验 · 仅取跨句式边界之相邻类对
      en: De-confounded test — adjacent pairs crossing a template boundary only
      n_pairs: 15
      observed_mean: 0.5307
      null_mean: 0.3217
      null_sd: 0.0358
      z: 5.8313
      p: 0.0
      significant: true
      null_pair_count_mean: 31.441
      method_zh: 零假设：句式标签沿类序之排列出于偶然。置换时标签随其所属类一同移动，于置换序中取「标签不同」之相邻类对求均值——与观测统计量口径全同。旧式实现误取置换序之前 n 个相邻类对而未筛标签，使同句式之对混入零分布，此已更正。
      method_en: 'Null hypothesis: the arrangement of template labels along the class order is accidental.
        Under permutation each label travels with its own class, and the statistic is the mean similarity
        of adjacent pairs whose labels differ — identical in construction to the observed statistic. An
        earlier implementation took the first n adjacent pairs of the permuted order without screening
        labels, so same-template pairs contaminated the null; this has been corrected.'
      caveat_zh: 置换后「跨边界相邻对」之个数并不恒等于观测之 15（零分布均值 31.441），故统计量在名义上略有异方差，z 值宜读作量级而非精确显著性。且句式标签仅取「类首名之末字」一端为代理，此一代理是否足表句式，仍属待考。
      caveat_en: The number of boundary-crossing adjacent pairs under permutation does not equal the observed
        15 (null mean 31.441), so the statistic is nominally heteroscedastic and z should be read as an
        order of magnitude rather than an exact significance. Template labels moreover take only the last
        character of each class's leading name as their proxy, and whether that proxy adequately represents
        the template remains an open question.
      note_zh: 此为**排除「同句式聚于相邻」这一混淆项之后**的独立检验。若仍显著，则「类次编排含语义梯度」之断不依赖句式同聚，可独立成立；若不显著，则该断只能归因于句式同聚，须撤回。
      note_en: This test excludes the confounding effect of same-template classes being adjacent. If it
        remains significant, the claim that the ordering carries a semantic gradient survives independently
        of template adjacency; if not, that claim must be withdrawn as an artefact of template adjacency.
