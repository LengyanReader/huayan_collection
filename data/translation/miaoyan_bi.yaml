crosstab:
  note: lift = 观测频数 ÷ 期望频数（期望按行×列独立假设）。lift>1 表示该群**偏好**此域，<1 表示**回避**。Cramér's V 为全域×群之关联强度（0 无关，1 完全决定）。两者皆只言「语汇构成之偏」，不言「教义侧重之别」。
  note_en: lift = observed ÷ expected frequency (expected under independence of row and column). lift>1
    marks a group's preference for a domain, <1 its avoidance. Cramér's V is the overall association strength
    between domain and group (0 = independent, 1 = fully determined). Both speak only to lexical composition,
    never to doctrinal emphasis.
