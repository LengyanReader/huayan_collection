article: shizhu-miaoyan
title_zh: 世主妙严品会众名号 · 数据报告
title_en: Data Report on the Assemblies of the World-Honoring Splendour Chapter
source: CBETA T10n0279《華嚴經》卷二·世主妙嚴品（實主娑婆）
source_url: https://cbetaonline.dila.edu.tw/zh/T10n0279
generated_by: scripts/miaoyan_bi.py ← data/translation/miaoyan_eda.yaml（← miaoyan_eda.py ← miaoyan_assembly.yaml
  ＋ miaoyan_eda_lexicon.yaml）
generated_at_source: scripts/miaoyan_eda.py（源：miaoyan_assembly.yaml + miaoyan_eda_lexicon.yaml）
disclaimer:
  zh: ⚠️ 体例：本报告为**分析层**产物，非经文陈述。名号之属类、成员、数量出《世主妙严品》（assembly 层）；词素切分、语义域归属、相似度、聚类、相关、模板诸项皆本站析构（EDA 层与
    BI 层）。经文自无「十七语义域」「余弦相似度」「轮廓系数」等名目。凡本报告所得，皆可复算而不可直作教义判读；一字一句之义，仍以经文为准。
  en: '⚠️ Convention: this report is an analytical product, not a statement of the sutra. Class membership,
    names and counts come from the World-Honoring Splendour Chapter (assembly layer); morpheme segmentation,
    domain assignment, similarity, clustering, correlation and templates are this site''s own analysis
    (EDA and BI layers). The sutra has no notion of ''seventeen domains'', ''cosine similarity'' or ''silhouette''.
    Everything here is reproducible but must not be read as doctrinal judgement; for the meaning of words,
    the sutra remains authoritative.'
method:
  pipeline_zh: 经文事实（assembly）→ 词素析构（EDA）→ BI 分析（本层）三层分源，逐层可回溯。
  pipeline_en: Three separated layers — sutra facts (assembly) → morphemic analysis (EDA) → BI analysis
    (this layer) — each independently traceable.
  determinism_zh: 凡涉随机处，一律以定种线性同余发生器（LCG）取样，禁用 Python random 默认源（其实现版本间可变，会破坏可复现性）。
  determinism_en: All sampling uses a seeded linear congruential generator (LCG); Python's random module
    is deliberately avoided because its implementations vary between versions and would break reproducibility.
  deps_zh: 零新增依赖：协方差特征分解用自实现 Jacobi 旋转，聚类/轮廓/中心性皆自实现，故结果不随第三方库版本而变。
  deps_en: 'No new dependencies: eigen-decomposition uses a self-implemented Jacobi rotation, and clustering,
    silhouette and centrality are all self-implemented, so results do not drift with third-party library
    versions.'
  integrity_zh: 本层不改 EDA 之任何数字，只读 EDA 而另作分析。故 L.101 以来之口径（high/medium/low 三分、low 单级为标注义务）在此原样承继。
  integrity_en: This layer alters no figure produced by the EDA; it only reads it and adds analysis. The
    calibers established since L.101 (three confidence grades, low alone carrying the annotation duty)
    are inherited unchanged.
scorecard:
  note: 本记分卡刻意**不给「综合总分」**：加权合成为单一数字须预设权重，而权重无经无据可依，臆造权重即等于臆造结论。故凡须合成为一数处，一律改为分项列示并各标口径。
  note_en: 'This scorecard deliberately withholds any composite index: collapsing metrics into a single
    number requires weights, and weights unsupported by evidence would amount to manufacturing a conclusion.
    Where a single figure would be wanted, metrics are listed separately with their definitions instead.'
  items:
  - key: classes
    zh: 会众类别数
    en: Classes
    value: 40.0
    display: '40'
    definition: 40 类（经文明列之群类）
    unit: count
  - key: named_total
    zh: 明列名号数
    en: Named assemblies
    value: 414.0
    display: '414'
    definition: 经文明列之名号总数
    unit: count
  - key: tokens_total
    zh: 词素位总数
    en: Token positions
    value: 1877.0
    display: 1,877
    definition: 可析核名切分后之词素位置总数（含多字词一次计一位）
    unit: count
  - key: tokens_per_name
    zh: 每名平均词素位
    en: Token positions per name
    value: 4.5338
    display: '4.53'
    definition: 词素位 ÷ 名号数 —— 名号之平均「信息长度」
    unit: dec2
  - key: names_per_class
    zh: 每类平均名号数
    en: Names per class
    value: 10.35
    display: '10.35'
    definition: 名号数 ÷ 类数 —— 群类之平均「列举密度」
    unit: dec2
  - key: distinct_tokens
