    confound_ratio: 1.2509
    note_zh: 此为**混淆项检验**：「主X神」诸类共用一句式，其域分布因句式而趋同，故彼此相似度可能反映的是句式同构而非语汇相近。读相似度矩阵时须扣除此项；否则「主夜神≈主昼神」一类结果将被过度解读。消混淆之对照量即「异句式类对之平均相似度」。
    note_en: 'This is a confounding check: the 「主X神」 series shares one syntactic template, so their domain
      profiles converge because of the template rather than through shared vocabulary. Similarity must
      be read with this subtracted, or results such as ''主夜神 ≈ 主晝神'' will be over-interpreted. The de-confounded
      reference is the mean similarity across pairs with different templates.'
