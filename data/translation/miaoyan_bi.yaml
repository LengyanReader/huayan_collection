templates:
  note_zh: 模板以**语义域序列**表述（而非原字），即「功德＋光明＋冠缀＋威势力」之类。此举把 414 个名号之构词抽象为有限之结构式样，正是「表法」「象征」二角度之可操作化：先见结构之型，再问其义。注意此为**结构**之陈述，非**意义**之解释。
  note_en: 'Templates are expressed as sequences of semantic domains rather than literal characters —
    for example virtue+luminosity+affix+power. This reduces the construction of the 414 names to a limited
    set of structural patterns, which is the operational form of the ''manifestation'' and ''symbol''
    perspectives: first the structural type, then its meaning. Note that this states structure, not meaning.'
  verdict_zh: '**两层方向相反，此反差本身即是发现**。字面层：414 名号之核名首二字只落在 255 种二字组上（最多者「清淨」占 3.14%），语汇复用率 38.4%，故高度模板化。语义域序列层：414
    名之仅 379 种式样，其中 356 种只现一次（占 86.0%），归一熵 0.9897；抽象到「首词素域×末词素域」之骨架仍有 100 种。故其构词之「模板性」在**字面**而不在**域构成**——华严会众之语汇，乃同一批字反复组装而成，非同一批语义反复填充。此反差本身可读为：经文之会众名号，重在其**名相之庄严整饬**（字字有出处、字字见对称），而其**语义配置**则逐名而异、乃至有意相重。'
  verdict_en: 'The two layers point in opposite directions, and the contrast is itself the finding. Literal
    layer: the first two characters of the 414 nuclei fall into only 255 distinct bigrams (the leading
    one, 「清淨」, covering 3.14%), a reuse rate of 38.4%, so this layer is highly templated. Domain-sequence
    layer: the same 414 names yield only 379 patterns, 356 of which occur exactly once (86.0%, normalised
    entropy 0.9897), and even the abstract head-by-tail skeleton still takes 100 forms. The templating
    therefore lies in the *characters*, not in the *domain composition*: Huayan assembly vocabulary re-assembles
    the same stock of characters rather than filling the same stock of meanings. The contrast itself is
    readable: these names excel in the dignity and orderliness of their wording (every character attested,
    every arrangement symmetrical), while their semantic configurations vary from name to name, and may
    even be deliberately overlapping.'
  n_members: 414
  layer1_literal:
    zh: 层一 · 字面 n-gram 复用
    en: Layer one — literal n-gram reuse
    measure_zh: '**衡量之法**：以「核名首二字」为准，一名只计一次，故覆盖率不会超过 100%。若改用「所有二字组出现次数之和」（一名可含多组），其和将超过名号数而得荒谬之 >100%
      覆盖率——此即常见之度量陷阱，页面不得混用。'
    measure_en: 'Measurement: based on the first two characters of each nucleus, counted once per name,
      so coverage cannot exceed 100%. Summing the occurrence counts of all bigrams instead (a name may
      contain several) would exceed the number of names and yield a nonsensical coverage above 100%; that
      is a common measurement trap and the two must not be mixed on the page.'
