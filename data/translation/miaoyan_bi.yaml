network:
  note_zh: 网络建于词素之**相邻共现**（同一名号内核名中相邻之两词素），非经文语序，亦非共现于全体文句。故此网所显者，名号构词之内在联结，非叙事结构。
  note_en: The network is built on adjacency co-occurrence of morphemes within a single core name, not
    on their order in the sutra nor co-occurrence across sentences. It therefore shows internal bonding
    in name-construction, not narrative structure.
  truncation:
    zh: '**须声明之截断**：本图之边取自 EDA 之 lex_edges，为相邻共现**全部 824 对中权重最高之 400 对**；其余 424 对（多为 n=1 之弱共现，占全对 51.5%）未入图。经独立复算（networkx
      之全图与截断图对读），此截断对 PageRank 之影响显著：全图之首五为「音」「須彌」「髻」「龍」「華」，截断后则「主」「光」显著上升、前二者消失。故本页之一切中心性数值皆为「**强共现子图**上之中心性」，**非全网之中心性**；且弱共现之被排除，恰恰抬高了强联结者之分。读本页中心性时须常带此caveat，勿径以「此词素在会众语汇中最具枢纽性」了之。'
    en: '**Declared truncation**: the edges here come from the EDA lex_edges, which are the 400 highest-weight
      pairs out of all 824 adjacent co-occurrence pairs; the remaining 424 pairs (mostly weak co-occurrences
      of n=1, 51.5% of the whole) are absent. An independent recomputation (networkx, full graph against
      truncated graph) shows this truncation materially changes PageRank: the full graph''s top five are
      「音」「須彌」「髻」「龍」「華」, while after truncation 「主」「光」 rise sharply and the first two vanish. Every centrality
      figure on this page is therefore centrality **within the strong-co-occurrence subgraph**, not within
      the full network, and the exclusion of weak co-occurrences raises the scores of the strongly connected.
      This caveat must accompany any reading of these centralities.'
    n_all_pairs: 824
    n_used_edges: 400
    n_dropped_pairs: 424
    dropped_pct: 0.5146
    pair_counting_zh: 相邻共现之对数：一名号内相邻两词素计一对，A-B 与 B-A 不分方向。
    pair_counting_en: 'Pair counting: adjacent morphemes within one name form one pair; A-B and B-A are
      not distinguished.'
  method_zh: PageRank（阻尼 0.85，幂迭代收敛）、无权介数中心性（Brandes）、加权标签传播社群（同步更新，遍历序按频次降序、同频按字序以保确定性）
  method_en: PageRank (damping 0.85, power iteration to convergence), unweighted betweenness centrality
    (Brandes), weighted label-propagation communities (synchronous update; nodes visited by descending
    frequency then by character order, so the result is deterministic)
  n_nodes: 304
  n_edges: 400
  n_active: 191
  isolated: 113
  isolated_note_zh: 孤立节点（零共现）不入中心性排名——它们在构词上不与他词素相邻，此事实本身亦是信息：单字成词之独立角色。
  isolated_note_en: 'Isolated nodes (no co-occurrence) are excluded from centrality rankings: they adjoin
    no other morpheme in name-construction, which is itself informative — the independent role of single-character
    morphemes.'
