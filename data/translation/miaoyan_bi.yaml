quality:
  note_zh: 本节度量「本分析自身之可信度」，非度量经文。稳健性检验回答的问题是：若剔除某一级数据，结论会不会翻转？翻转者不可依赖。
  note_en: 'This section measures the reliability of the analysis itself, not of the sutra. The robustness
    test asks: if one confidence grade were removed, would the conclusion flip? Conclusions that flip
    cannot be relied upon.'
  grade_policy_zh: low 单级＝标注义务（须显示〔待考〕）；med+low ＝比较之需。二者口径不同，严禁相混。
