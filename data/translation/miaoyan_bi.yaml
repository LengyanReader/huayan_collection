  df_note_zh: 自由度 = (行数−1)×(列数−1) = (17−1)×(5−1) = 64，其中行数为语义域 17（含「未定域」一行）、列数为群 5。Cramér's V 之分母用 min(行,列)−1
    = 4，故 V 之值与 df 之取法不同，二者不可互换。
  df_note_en: Degrees of freedom = (rows−1)(cols−1) = (17−1)(5−1) = 64, with 17 semantic domains as rows
    (including the unassigned row) and 5 groups as columns. Cramér's V uses min(rows,cols)−1 = 4 in its
    denominator, so V and the choice of df are not interchangeable.
  v_strength_zh: Cramér's V=0.2242 属中等：此关联统计上显著但效应量有限，不可称强。故「五群与语汇面貌大体相应」一语须以此弱至中等之关联为限，不可升级为「五群即语汇之分群」。
  v_strength_en: 'Cramér''s V of 0.2242 is moderate: the association is statistically significant but
    of limited effect size and must not be called strong. Any statement that the five groups broadly track
    lexical profile must stay within this weak-to-moderate effect and must not be upgraded to ''the five
    groups are lexical clusters''.'
  p_note: p 值为 Wilson–Hilferty 近似（非查表精确值），仅作量级参考
  p_note_en: p is a Wilson–Hilferty approximation, not a table-exact value; for order of magnitude only
similarity:
  space_zh: 语义域分布向量（17 维）× TF-IDF 加权 × 余弦相似度
  space_en: 17-dim semantic-domain distribution, TF-IDF weighted, cosine similarity
  caveat_zh: 此「相似度」量的是**构词层语汇构成之相近**，**不是词义相近**。两域分布相同之两类，其名号所指可能全然不同；反之词义相近而构词迥异者，此测度必测不到。故本页相似度只可读作「语汇面貌之相似」。
  caveat_en: This similarity measures closeness of lexical composition, not of meaning. Two classes with
    identical domain profiles may denote entirely different things, and semantically close classes built
    from different words are structurally invisible here. Read it strictly as similarity of lexical surface.
