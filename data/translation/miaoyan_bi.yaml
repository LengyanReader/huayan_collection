  conclusion_en: Adjacent classes are significantly more similar (z=6.14). The de-confounded test (different-template
    adjacent pairs only, n=15) remains significant (z=5.83), so the claim that the ordering carries a
    semantic gradient holds and does not depend on the effect of same-template classes being placed adjacently.
executive:
  note_zh: 以下六条为执行摘要，每条皆附**证据字段**指回本报告之算得小节，可逐条复算。凡摘要不得为正文所无之断语。
  note_en: The six findings below form the executive summary; each carries an evidence field pointing
    back to the computed section of this report and is independently recomputable. The summary may not
    assert anything absent from the body.
  findings:
  - id: F1
    zh: 会众名号之语汇高度模板化：不同词素 304 个撑起 1,877 个词素位，语汇复用率 83.80%。
    en: 'The vocabulary of the assemblies is strongly templated: 304 distinct morphemes support 1,877
      token positions, a reuse rate of 83.80%.'
    evidence: scorecard · reuse_rate；pareto · morphemes.k80=89
  - id: F2
    zh: 语义域分布并不均匀：主域为「冠綴类」占 19.02，有效域数仅 10.562（满值 16）。
    en: 'The domain distribution is uneven: the leading domain is affix at 19.02%, with an effective number
      of domains of only 10.562 (maximum 16).'
    evidence: domain_landscape · HHI=0.116655, 归一熵=0.8502
  - id: F3
    zh: 「五群」之划分与语汇面貌群内显著高于群外，故「五群」之划分与语汇面貌**大体相应**（群内均值 0.4161 vs 群外 0.3113）。惟此对应并不严密：域×群之关联强度 Cramér's
      V=0.2242，属弱至中等，故「五群」者乃**卷次所分之经文体例**，非由语汇面貌自然析出之类。
    en: 'The five-group division is within-group similarity clearly exceeds across-group, so the five-group
      division broadly tracks lexical profile (within-group mean 0.4161 vs across-group 0.3113). The correspondence
      is not tight, however: a Cramér''s V of 0.2242 between domain and group is weak to moderate, so
      the five groups are an editorial division by scroll, not classes that fall out of the lexical landscape.'
    evidence: similarity · within=0.4161 vs across=0.3113；crosstab · Cramér's V=0.2242
  - id: F4
    zh: 构词之模板性在**字面**而不在**域构成**：414 名之核名首二字只落在 255 种二字组上（复用率 38.4%），而语义域序列则碎为 379 种（356 种只现一次，占 86.0%，归一熵
      0.9897）。故此会众语汇乃同一批字反复组装，非同一批语义反复填充。
    en: 'The templating of these names lies in the characters, not in the domain composition: the first
      two characters of the 414 nuclei fall into only 255 distinct bigrams (a reuse rate of 38.4%), whereas
      the semantic-domain sequences fragment into 379 patterns (356 of them occurring exactly once, 86.0%
      of all names, normalised entropy 0.9897). The vocabulary therefore re-assembles the same stock of
      characters rather than filling the same stock of meanings.'
    evidence: templates · layer1_literal.n_distinct_bigram=255；layer2_domain.n_distinct=379，n_singleton=356
  - id: F5
    zh: 类次编排相邻类显著更相近（z=6.14）。去混淆检验（仅异句式相邻对，n=15）仍然显著（z=5.83），故「类次编排含语义梯度」之断成立，且不依赖同句式聚于相邻之效应。（相邻类平均相似度
      0.5533，置换零分布 0.3426，z=6.1388）。
    en: Adjacent classes are significantly more similar (z=6.14). The de-confounded test (different-template
      adjacent pairs only, n=15) remains significant (z=5.83), so the claim that the ordering carries
      a semantic gradient holds and does not depend on the effect of same-template classes being placed
      adjacently. (mean similarity of adjacent classes 0.5533, permutation null 0.3426, z=6.1388).
    evidence: ordinal · 5000 次置换检验；去混淆检验 n=15, z=5.8313
  - id: F6
    zh: 构词网络存在 22 个词素社群，覆盖 62.5% 之节点；此社群由名号内部共现生成，非经文语序。
    en: The morphological network yields 22 communities covering 62.5% of nodes; these arise from co-occurrence
      within names, not from the sutra's word order.
    evidence: network · label propagation
