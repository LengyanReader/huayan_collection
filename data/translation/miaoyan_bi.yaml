  note_zh: 散点为 40 类之逐类实点（气泡大小＝名号数）。相关系数仅言**统计关联**，**不含因果**；且 n=40 之样本，相关系数之抽样波动不可忽略，故并列 Spearman 秩相关以资对照——两者差距大者，提示非线性或离群点主导。
  note_en: Each point is one of the forty classes (bubble size = number of names). Correlation denotes
    statistical association only, never causation; with n=40 the sampling variation is not negligible,
    so Spearman rank correlation is given alongside Pearson — a large gap between them signals non-linearity
    or outlier dominance.
