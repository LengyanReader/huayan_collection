           ⑰ *The Merit of Initial Aspiration* (ch. 17)
           Content: Dharma Wisdom Bodhisattva expounds the merit of a
           bodhisattva's initial aspiration — comparing the merit of initial
           aspiration with that of the Hīnayāna, heretical paths, and Brahma
           kings, demonstrating the incomparable superiority of initial
           aspiration.
