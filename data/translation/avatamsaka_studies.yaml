           ⑮ *The Ten Abodes* (ch. 15) [Daśa-vyavasthāna]
           Content: Dharma Wisdom Bodhisattva expounds the "Ten Abodes" of the
           bodhisattva path — the Abode of Initial Aspiration, the Abode of
           Cultivating the Ground, the Abode of Practice, the Abode of Noble Birth,
           the Abode of Complete Skillful Means, the Abode of Right Mind, the
           Abode of Non-Retrogression, the Abode of Innocence, the Abode of Dharma
           Prince, and the Abode of Coronation. The Ten Abodes form the foundation
           of "non-retrogression in rank" (位不退) on the bodhisattva path — once
           entering the abodes, one no longer retrogresses to the level of an
           ordinary being.
           ·Chengguan: "The Ten Abodes are the foundation of non-retrogression on
             the Path" — vyavasthāna means "establishment"; the Ten Abodes are the
             ten dimensions of "establishing oneself in the Buddha-Dharma." The
             "Abode of Initial Aspiration" is the gateway; the "Abode of
             Coronation" is its perfection. The core function is avivartika
             (non-retrogression): unlike the Ten Faiths where backsliding is
             possible, entering the Abodes guarantees no regression.
           ·Fazang: "The Abode of Initial Aspiration is the head of all practices"
             — not merely because it is the first, but because it "encompasses all
             nine subsequent abodes." Just as a foundation supports all buildings,
             the "initial aspiration" of the First Abode contains the virtues of
             all ten. Fazang explains through the "one is all" framework: one
             abode is ten abodes; ten abodes are one abode — perfect interpenetration
             without obstruction.
           ·Yinshun: Compares the Ten Abodes with Hīnayāna ordination — both mark
             the transition from "layperson" to "practitioner," but the Ten Abodes
             are founded on "bodhicitta" (aspiring to buddhahood for all beings),
             while Hīnayāna ordination is founded on "renunciant-mind" (seeking
