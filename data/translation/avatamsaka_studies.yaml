  # ── 海云·贤度两位法师·结构研究 ──
  - id: modern_masters
    title: 海云·贤度两位法师·结构研究
    title_en: Structure Studies by Haiyun Jimeng and Venerable Xiandu
    icon: 🎓
    topics:
      - title: 海云继梦「九九華嚴」结构诠释
        title_en: Haiyun Jimeng's "Nine-Nine Huayan" Structural Interpretation
        body: |
          海云继梦法师将《八十华严》(前59卷) +《四十华严》(后40卷)=「九九華嚴」，
          形成「理行圆融」的整体架构——八十华严为「理」(思想基础)，四十华严为「行」(实修行愿)。
          此99卷框架超越了传统的「七处九会」单一结构观，将全经解读为「信→解→行→证」的完整菩萨道。
          相关著作: 《九九華嚴玄談》5册 (空庭书苑, 2026)。讲法: YouTube @huayen-world 九九華嚴系列。
          核心判摄: 「华严经不是一部经，而是一套完整的生命改造工程手册。」
        en_body: |
          Venerable Haiyun Jimeng takes the *eighty-fascicle Avataṃsaka* (the first 59
          fascicles) plus the *forty-fascicle Avataṃsaka* (the last 40 fascicles) as the
          "Nine-Nine Huayan" (*jiujiu huayan*), forming an integrated framework of the
          "perfect fusion of principle and practice" — the eighty-fascicle text is the
          "principle" (the intellectual foundation), and the forty-fascicle text is the
          "practice" (actual practice and vows). This 99-fascicle framework goes beyond
          the traditional single-structure view of the "seven places and nine
          assemblies," reading the entire sūtra as the complete bodhisattva path of
          "faith → understanding → practice → realization." Related works: *Jiujiu
          Huayan Xuantan*, 5 volumes (Kongting College of Buddhist Studies, 2026).
          Teachings: the Nine-Nine Huayan series on YouTube @huayen-world. Core
          judgment: "The Avataṃsaka Sūtra is not one sūtra but a complete manual for
          the engineering of transforming one's life."
      - title: 贤度法师·华严结构学
        title_en: Venerable Xiandu's Huayan Structural Studies
        body: |
          贤度法师(Bhiksuni Xiandu, 1937-)，华严莲社住持，华严专宗学院院长，
          智光老和尚法孙，致力于华严义学的学院化研究与教学。
          代表作《华严经讲义》系列、《华严学概论》等，对华严经的「七处九会」结构、
          「信解行证」四分科判、以及华严判教体系有系统性的现代阐述。
          其讲记注重文献学考辨与修行实践的结合，为当代学院化的华严义学研究提供了重要范本。
          华严专宗学院官网: https://www.huayencollege.org
          华严莲社: 台北华严莲社 (1949年创社)，贤度法师为第三代住持。
        en_body: |
          Venerable Xiandu (Bhikṣuṇī Xiandu, 1937–), abbess of the Huayan Lotus
          Society (Huayan Lianshe) and president of the Huayan Monastic Institute
          (Huayan College), is a dharma-grandson of the Elder Zhiguang, devoted to
          the academic study and teaching of Huayan doctrine. Her representative
          works include the *Lectures on the Avataṃsaka Sūtra* (Huayan jing jiangyi)
          series and *An Introduction to Huayan Studies* (Huayan xue gailun), which
          give systematic modern expositions of the "seven places and nine
          assemblies" structure, the four-part structure of "faith, understanding,
          practice, and realization," and the Huayan doctrinal classification system.
          Her lecture notes combine philological investigation with practice, offering
          an important model for the contemporary academic study of Huayan doctrine.
          Huayan College website: https://www.huayencollege.org
          Huayan Lotus Society: the Huayan Lotus Society in Taipei (founded 1949), of
          which Venerable Xiandu is the third-generation abbess.
      - title: "澄观《华严经疏》科判研究"
        title_en: Studies of the Structure (Kēpàn) of Chengguan's Huayan Jing Shu
        body: |
          澄观《大方广佛华严经疏》(T35n1735) 是华严经最详尽科判。
          澄观以「十门分别」为全经分科——十门中前五门为「玄义」(总体诠释框架)，
          后五门为「文义」(逐品科判)。海云继梦在《探玄記懸談講記》中
          对澄观的科判体系做了现代梳理，强调「玄谈」(悬谈)是理解华严经的
          方法论前设——不先掌握玄谈框架，直接读经文如同「没有地图的旅行」。
        en_body: |
          Chengguan's *Dafangguang fo huayan jing shu* (Commentary on the Great
          Vaipulya Sūtra of the Buddha's Flower Ornament, T35n1735) is the most
          detailed structural analysis (kēpàn) of the Avataṃsaka Sūtra. Chengguan
          divides the whole sūtra through his "analysis of the ten gates" — of the
          ten gates, the first five constitute the "profundity" (xuanyi, the overall
          hermeneutical framework) and the last five the "textual meaning" (wenyi,
          chapter-by-chapter structure). In his *Lectures on the Xuantanji* (*Tanxuan
          ji xuantan jiangji*), Haiyun Jimeng offers a modern reworking of Chengguan's
          structural system, stressing that the "prolegomena" (xuantan) is the
          methodological presupposition for understanding the sūtra — to read the text
          directly without first mastering the prolegomenal framework is like a
          "journey without a map."
