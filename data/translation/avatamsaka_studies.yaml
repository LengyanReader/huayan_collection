           **═══ ASSEMBLY 6: THE PARANIRMITAVAŚAVARTIN HEAVEN (fascicles 34–39, 1 chapter) ═══**
          Location: the Paranirmitavaśavartin Heaven (the highest of the six
          desire-heavens)
          Assembly Master: Vajra Treasury Bodhisattva (Chin-kang-tsang)
          Theme: **Differentiated cause and effect [Understanding]** — the Ten Grounds

          ㉖ *The Ten Grounds* (ch. 26) [Daśa-bhūmi] (~6 fascicles — one of the most
          important chapters)
          Content: Vajra Treasury Bodhisattva expounds the "Ten Grounds" of the
          bodhisattva path — the Ground of Joy (初地), the Ground of Purity (二地),
          the Ground of Luminosity (三地), the Ground of Flame-Wisdom (四地),
          the Ground of Manifestation (五地), the Ground of Going Far (六地),
          the Ground of Immovability (七地), the Ground of Good Wisdom (八地),
          the Ground of Dharma Cloud (九地), and the Ground of Wisdom (十地, the
          perfection of the Dharma Cloud). This is one of the most important
          chapters in the entire Avataṃsaka — in India it was already extracted
          and circulated independently as the Daśabhūmika-sūtra, with commentaries
          by Nāgārjuna, Asaṅga, Vasubandhu, and others. The chapter provides the
          most systematic classic basis for the Mahāyāna "bodhisattva path,"
          detailing each ground's content of practice, elimination of obscurations,
          realization of truth, and relationship to other stages.
           ·Chengguan: "The Ten Grounds are the core of Avataṃsaka practice" —
             the First Ground (Ground of Joy) is the "path-seeing position"
             (见道位) where the practitioner first directly realizes the
             dharmadhātu, distinguishing it from the "approximate realization"
             of the Ten Abodes, Ten Practices, and Ten Transferences. Chengguan
             reads the ten as a progression "from prajñā to upāya": Grounds 1–7
             deepen "prajñā-wisdom" (eliminating obscurations and realizing truth);
             Grounds 8–10 unfold "upāya-wisdom" (activating function to benefit
             beings). The structure of "one ground eliminates one obscuration and
             realizes one truth" is the Avataṃsaka's most refined expression of
             "sequential practice."
           ·Nāgārjuna, Daśabhūmika-vibhāṣā (Commentary on the Ten Grounds):
             Nāgārjuna was among the earliest commentators on the Ten Grounds
             (Sanskrit fragments and complete Tibetan translation survive). He
             interprets the ten through the lens of "pāramitā" — each ground's
             practice is one dimension of prajñā-pāramitā. Nāgārjuna emphasizes
             that the "joy" of the First Ground is not worldly happiness but
             the "dharma-joy" of first directly experiencing the reality of
             "all dharmas are empty."
           ·Vasubandhu, Daśabhūmika-sūtra-śāstra (Commentary on the Sūtra of
             the Ten Grounds, translated into Chinese by Bodhiruci, 10 fascicles):
             Vasubandhu interprets the Ten Grounds through the lens of
             "vijñaptimātra" (consciousness-only) — each ground's "elimination
             of obscurations" corresponds to the purging of specific "seeds"
             (bīja) in the ālayavijñāna. The "realization of truth" at each
             ground is the process of "transforming consciousness into wisdom"
             (转识成智). This represents a key intersection of Yogācāra and
             Huayan thought.
           ·Thomé Fang: The philosophical narrative embedded in the ground-names:
             "Joy" (first realization of dharmadhātu) → "Purity" (freedom from
             afflictive obscurations) → "Luminosity" (wisdom-light appearing) →
             "Flame-Wisdom" (wisdom-light blazing like fire) → "Manifestation"
             (dharmadhātu reality manifesting) → "Going Far" (surpassing all
             mundane practice) → "Immovability" (unmoved by any condition) →
             "Good Wisdom" (attaining the four unobstructed eloquences) →
             "Dharma Cloud" (Buddha-Dharma covering all like clouds) → "Wisdom"
             (perfecting all-knowing wisdom). Fang reads this as a complete
             philosophical journey "from ontology to epistemology to praxis."
           ·Yinshun: "The independent circulation of the Ten Grounds chapter in
             India" — the Ten Grounds holds a unique position: it is the only
             chapter among the Avataṃsaka's 39 to be extracted and circulated
             as an independent scripture (Daśabhūmika-sūtra). Yinshun argues
             this is because its content (the bodhisattva path's practice-stages)
             has "independent practical value" — even without reading the full
             Avataṃsaka, the Ten Grounds alone provides a complete "map of the
             bodhisattva path." The chapter also influenced the Madhyamaka
             (Nāgārjuna), Yogācāra (Asaṅga, Vasubandhu), and Mantra traditions,
             making it a common foundation across Mahāyāna schools.

           Version Correspondence: 80-fascicle ch. 26 | 60-fascicle ch. 21 "Ten Grounds" | Nāgārjuna, Daśabhūmika-vibhāṣā | Tibetan ch. 27

