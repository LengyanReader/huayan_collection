# 华严经学 — Avataṃsaka Sūtra Studies
# 起源·形成·流传·结构·义学阐释
# 原则: 有据可查·出处可溯·链接可验
# 最后更新: 2026-09-03

sections:
  - id: origins
    title: 起源与形成
    title_en: Origin and Formation
    icon: 🌏
    intro: |
      《华严经》(Skt. Buddhāvataṃsaka)并非一次性成书, 而是历经数百年的渐进编纂过程。
      学术界公认: 原本独立的华严类小品经典(如《兜沙经》《菩萨本业经》《十地经》
      《渐备一切智德经》《入法界品》等), 约在公元1-5世纪间, 从南印度→北印度→
      中亚(西域)流传过程中不断汇集增补, 最终在**于阗(今新疆和田)**编纂集成为
      大本《华严经》。这一过程犹如「滚雪球」——核心经典(如《十地经》)先已存在,
      其他品目围绕它逐步增添, 最终形成包含三十九品(八十华严)或四十五品(藏译)的
      宏伟巨构。荷兰汉学家Jan Nattier将最早期的华严经典称为"Proto-Avataṃsaka"
      (原型华严), 用以区分后世的完整结集本。
    intro_en: |
      The *Avataṃsaka Sūtra* (Skt. *Buddhāvataṃsaka*) was not composed in a single
      instance but rather underwent a gradual compilation process spanning several
      centuries. Scholars generally agree that originally independent shorter
      scriptures of the Avataṃsaka class (such as the *Tuṣa Sūtra*, the *Pusa benye
      jing*, the *Daśabhūmika Sūtra*, the *Daśabhūmika-saṃgraha*, and the
      *Gaṇḍavyūha*) circulated from roughly the 1st–5th centuries CE as they moved
      from South India to North India and then to Central Asia (the Western Regions),
      continuously gathering and expanding until they were finally compiled into the
      great *Avataṃsaka Sūtra* at **Khotan (modern Hotan, Xinjiang)**. This process
      was like a "rolling snowball" — core scriptures (such as the *Daśabhūmika*)
      already existed, and other chapters were gradually added around them, ultimately
      forming a monumental collection of thirty-nine chapters (eighty-fascicle text)
      or forty-five chapters (Tibetan translation). The Dutch sinologist Jan Nattier
      designated the earliest Avataṃsaka scriptures as the "Proto-Avataṃsaka" to
      distinguish them from later complete compilations.

    topics:
      - title: 华严经典的发展阶段——从单品到大集
        title_en: "The Developmental Stages of the Avataṃsaka Scriptures — From Individual Sūtras to the Great Collection"
        body: |
          华严经典的发展可分为四个阶段——

          **第一阶段: 原型华严(Proto-Avataṃsaka, 约公元1-2世纪)**
          最早的华严类经典已作为独立经本流传, 包括:
          ·《兜沙经》(Fo shuo dousha jing, T600) — 后汉支谶(Lokakṣema, 178-189译),
            对应八十华严的「如来名号品」「如来光明觉品」, 是最早可考的华严单品,
            内容简短, 叙述佛陀以名号度化众生, 预示了华严「一佛普说」的核心主题。
          ·《菩萨本业经》(Pusa benye jing, T601) — 吴·支谦译(约222-253),
            对应八十华严的「净行品」「十住品」等, 阐述菩萨修行的基本框架。
          ·《诸菩萨求佛本业经》(Zhū púsà qiú fó běnyè jīng, T282, 失译) — 进一步阐述菩萨道修行。
          ·《菩萨十住行道品》(Pūsa shízhù xíngdào pǐn, T283, 失译) — 菩萨十住修行的又一译本。

          Jan Nattier(2005)将这批最早的单品统称为"Proto-Avataṃsaka",
          认为它们构成了华严经典的核心「胚胎」, 其中已包含华严的基本宇宙观与菩萨道框架。
          更为重要的是, Nattier通过细致的文本分析提出了一个突破性的重建方案:
          T600(《兜沙经》, Lokakṣema译)并非一部独立的经典, 而是一部更长文本的残存部分;
          该长篇原本**至少包含三个后来被独立编目的经本**:
          T600(《兜沙经》) + T282(《诸菩萨求佛本业经》) + T283(《菩萨十住行道品》),
          三者共同构成了一部完整的"原型华严"单品。支谦翻译的T601(《菩萨本业经》)
          则是**同一重建文本的另一译本**(different recension), 与Lokakṣema的译本平行流传。
          Nattier指出, 这一组经本的术语体系(terminological usage)与翻译风格(translation style)
          之间存在系统性对应, 为这一文本重建提供了坚实的内在证据。

          Nattier还揭示了一个关键的神学发现: 在原型华严阶段, **释迦牟尼佛(Sākyamuni)
          而非毗卢遮那佛(Vairocana)才是核心佛陀**。后来的修订者将毗卢遮那佛提升至
          宇宙至高佛的地位——这是一个非同寻常的神学转变(theological shift),
          标志着华严思想从早期以历史佛陀为中心, 转向以法身佛为终极实在的宇宙论框架。
          此外, 原型华严中所描绘的菩萨形象是**男性、富裕且享有特权的**(male, wealthy,
          and privileged), 与后世苦行菩萨的形象形成鲜明对比。该文本还具有高度的
          视觉性(highly visual)——启示通过三摩地(samādhi)传递, 以禅定中的直接观想
          为核心传播方式。

          **第二阶段: 核心经典的确立(约2-4世纪)**
          以《十地经》(Daśabhūmika-sūtra)为核心的华严经典群逐步形成:
          ·《十地经》(Daśabhūmika-sūtra) — 华严经中最重要的单品之一,
            阐述菩萨修行的十个阶位(欢喜地→法云地), 在印度佛教中被广泛引用,
            龙树《大智度论》·寂天《集菩萨学论》均有征引。
          ·《渐备一切智德经》(Daśabhūmika-saṃgraha, 竺法护译) — 与十地经相关的
            另一版本, 阐述菩萨渐次修习的过程。
          ·《入法界品》(Gaṇḍavyūha) — 善财童子五十三参的叙事核心,
            描述菩萨从初发心到究竟成佛的完整修行历程。
          ·《如来兴显经》(Tathāgatotpattisaṃbhava-nirdeśa) — 阐述如来出现的因缘。
          这些经典在流传过程中逐步被「发现」为同一佛所说的不同部分。
          值得注意的是, 十地经与入法界品后来各自形成了独立的梵文传承,
          在中亚乃至东亚佛教中都有深远影响, 远超华严经整体框架之外。

          **第三阶段: 大本结集与增补(约3-5世纪)**
          在于阗地区, 独立的经典被编辑、整合为大本《华严经》:
          ·编辑者删除了各独立经本原有的「如是我闻」(evam mayā śrutam)开篇语,
            将「一时」(ekasmin samaye)改写为「尔时」(atha khalu)以统一叙事。
          ·删除了各独立经本的结尾语(如「闻菩萨所说, 皆大欢喜」)。
          ·部分品目的地点与听众相关语句被删除, 以整合为七处九会的统一框架。
          ·在整合过程中, 部分品目被进一步细分(如六十华严的「卢舍那佛品」在
            八十华严中被分为五品), 新品目被增补(如「十定品」仅见于八十华严与藏译)。
          ·最终形成三万六千偈(六十华严底本)或四万五千偈(八十华严底本)的大本。

          Imre Hamar(2026)进一步论证, 这一编纂过程并非简单的文本汇编,
          而是一项需要**「大量物质资源以及一个规模庞大、组织完善的僧团的制度性支持,
          使之能够承担大规模编辑活动」**(substantial material resources as well as the
          institutional support of a large and well-organized monastic community capable of
          undertaking extensive editorial activity)的系统工程。他指出, 于阗拥有
          **「显著的王室护持」**(significant royal patronage), 为如此宏大的编纂项目
          提供了必要的物质基础与制度保障。然而, 这一于阗编纂说并非没有争议:
          大竹晋(Ōtake Susumu, Hamar 2007, pp. 87-108)主张华严经的梵文原典
          **编纂于印度本土而非中亚**, 认为文本中保留的某些特征更符合印度写经传统
          而非中亚编辑实践。

          **第四阶段: 跨语言传播(约4世纪以后)**
          大本《华严经》从于阗向外传播:
          ·**汉译**: 418-421年佛陀跋陀罗译六十华严(34品); 695-699年实叉难陀译八十华严(39品)
          ·**藏译**: 约9世纪由智军(Ye shes sde)等译出藏文华严(45品), 译自于阗本,
            比汉译多出「如来华严品」「普贤宣说品」等2品
          ·**梵本**: 现存梵文华严仅为单品残本(十地经·入法界品·普贤行愿赞等),
            智俨(602-668)曾记录大慈恩寺所藏梵本的详细规格(541叶·每叶55字·20行)

          在跨语言传播阶段, 一个重要的目录学(doxographical)现象值得关注:
          真谛(Paramārtha, 约6世纪)将《华严经》定位为**「菩萨藏」(Bodhisattvapiṭaka)**,
          即大乘佛教经典中独立于经律论三藏之外的「第四藏」。敦煌写本题记中保存了
          这一分类的直接证据: 「解释十地, 名为渐次成就一切智智, 大乘经菩萨藏
          佛华严之一品」(Explication of the Ten Stages, entitled Creator of the Wisdom
          of an Omniscient Being by Degrees, a chapter of the Mahāyāna sūtra
          Bodhisattvapiṭaka Buddhāvataṃsaka)。这说明华严经在早期目录学中并非
          被简单地归入「经藏」, 而是被赋予了独立的、统摄性的教藏地位,
          体现了大乘佛教经典体系的多元分层结构。
        sources:
          - "Jan Nattier, 'The Proto-History of the Buddhāvataṃsaka' (ARIRIAB 8, 2005:323-360)"
          - "Imre Hamar, 'The History of the Buddhāvataṃsaka-sūtra: Shorter and Larger Texts' (2007:139-167)"
          - "Imre Hamar, 'The Buddhāvataṃsaka-sūtra in the History of Buddhism' (2026)"
          - "Ōtake Susumu, 'On the Origin of the Buddhāvataṃsaka' in Hamar ed., Reflecting Mirrors (2007:87-108)"
          - "H.R. Park, 'The Differences and Editing Process of Chapter Divisions in the Buddhavatamsaka-sutras' (IBK 62:2, 2014)"
          - "木村清孝《初期中国华严思想の研究》(春秋社, 1977)"
        en_body: |
          The development of the Avataṃsaka scriptures can be divided into four stages —

          **Stage 1: The Proto-Avataṃsaka (c. 1st–2nd centuries CE)**
          The earliest Avataṃsaka-class scriptures already circulated as independent
          works, including:
          ·The *Tuṣa Sūtra* (Fo shuo dousha jing, T600) — translated by Lokakṣema
            (178–189), corresponding to the "Chapter on the Names of the Thus Come One"
            and "Chapter on the Light of the Thus Come One" in the eighty-fascicle text;
            the earliest attested Avataṃsaka excerpt, brief in content, narrating how
            the Buddha saves beings through his names, foreshadowing the core Avataṃsaka
            theme of "one buddha teaching universally."
          ·The *Pusa benye jing* (T601) — translated by Zhi Qian (c. 222–253),
            corresponding to chapters such as "Pure Practices" and "Ten Abodes,"
            setting forth the basic framework of bodhisattva cultivation.
          ·The *Zhū púsà qiú fó běnyè jīng* (T282, anonymous translation) — further
            elaborating the bodhisattva path.
          ·The *Pūsa shízhù xíngdào pǐn* (T283, anonymous translation) — another
            rendering of the bodhisattva ten-abodes practice path.
          Jan Nattier (2005) designated this earliest group of excerpts collectively
          as the "Proto-Avataṃsaka," arguing that they formed the core "embryo" of the
          Avataṃsaka scriptures, already containing the fundamental cosmology and
          bodhisattva-path framework of the Avataṃsaka. More crucially, Nattier
          proposed a groundbreaking textual reconstruction: T600 (the *Tuṣa Sūtra*,
          translated by Lokakṣema) was not an independent scripture but the surviving
          remnant of a longer work that originally comprised at least three later
          separately catalogued texts — T600 (*Tuṣa Sūtra*) + T282 (*Zhū púsà qiú fó
          běnyè jīng*) + T283 (*Pūsa shízhù xíngdào pǐn*) — forming a single,
          complete "Proto-Avataṃsaka" excerpt. The *Pusa benye jing* (T601), translated
          by Zhi Qian, is a different recension of the same reconstructed text, forming
          a parallel transmission to Lokakṣema's version. Nattier demonstrated that the
          terminological usage and translation style across these texts exhibit
          systematic correspondences that provide robust internal evidence for this
          reconstruction.
          Nattier also revealed a key theological finding: in the Proto-Avataṃsaka
          stage, Śākyamuni, not Vairocana, was the central buddha. The later revision
          promoted Vairocana to the supreme cosmic position — a remarkable theological
          shift marking the transition from a historical-buddha-centered framework to
          the cosmological frame with the dharmakāya buddha as ultimate reality.
          Furthermore, the bodhisattva depicted in these texts is male, wealthy, and
          privileged — a striking contrast to later ascetic bodhisattva images. The text
          is also highly visual: revelations are transmitted through samādhi, with
          meditative direct vision as the core mode of propagation.

          **Stage 2: Establishment of Core Scriptures (c. 2nd–4th centuries)**
          A cluster of Avataṃsaka scriptures coalesced around the *Daśabhūmika-sūtra*
          as the central text:
          ·The *Daśabhūmika-sūtra* — one of the most important individual scriptures
            of the Avataṃsaka, expounding the ten stages of bodhisattva practice
            (Joyful Attaining through to the Cloud of Dharma); widely cited in
            Indian Buddhism, referenced by Nāgārjuna's *Mahāprajñāpāramitā Śāstra*
            and Śāntideva's *Śikṣāsamuccaya*.
          ·The *Daśabhūmika-saṃgraha* (translated by Dharmarakṣa) — a related version
            expounding the bodhisattva's gradual cultivation.
          ·The *Gaṇḍavyūha* — the narrative core of Sudhana's fifty-three pilgrimages,
            describing the complete path from initial aspiration to final Buddhahood.
          ·The *Tathāgatotpattisaṃbhava-nirdeśa* — expounding the causes and conditions
            of the Tathāgata's manifestation.
          These scriptures were gradually "discovered" in the course of their
          transmission to be different parts of the same Buddha's teaching.
          Notably, the *Daśabhūmika* and the *Gaṇḍavyūha* each later developed
          independent Sanskrit transmissions that exerted profound influence across
          Central Asian and East Asian Buddhism far beyond the Avataṃsaka's overall
          framework.

          **Stage 3: Compilation and Augmentation of the Great Text (c. 3rd–5th centuries)**
          In the Khotan region, independent scriptures were edited and integrated into
          the great *Avataṃsaka Sūtra*:
          ·The editors deleted the standard opening phrase "evam mayā śrutam" (Thus have
            I heard) from each independent sūtra and rewrote "ekasmin samaye" (at one
            time) as "atha khalu" (at that time) to unify the narrative.
          ·Closing phrases (such as "Hearing what the bodhisattva said, they were all
            greatly rejoiced") were deleted.
          ·Location and audience phrases in some chapters were removed to integrate them
            into the unified framework of seven places and nine assemblies.
          ·During the compilation, some chapters were further subdivided (e.g., the
            "Chapter on Vairocana Buddha" in the sixty-fascicle text was split into five
            chapters in the eighty-fascicle text), and new chapters were added (e.g., the
            "Chapter on Ten Samādhis" appears only in the eighty-fascicle text and the
            Tibetan translation).
          ·The final text comprised thirty-six thousand gāthās (base text of the
            sixty-fascicle translation) or forty-five thousand gāthās (base text of the
            eighty-fascicle translation).
          Imre Hamar (2026) further argued that this compilation was far more than
          simple textual aggregation — it constituted a systematic project requiring
          "substantial material resources as well as the institutional support of a large
          and well-organized monastic community capable of undertaking extensive editorial
          activity." He noted that Khotan enjoyed "significant royal patronage," which
          would have provided the necessary material infrastructure and institutional
          guarantees for such a monumental editorial undertaking. This Khotan compilation
          thesis is not without controversy, however: Ōtake Susumu (in Hamar 2007,
          pp. 87–108) argues that the Sanskrit original was compiled in India rather than
          Central Asia, contending that certain textual features are more consistent with
          Indian scribal traditions than with Central Asian editorial practices.

          **Stage 4: Cross-Lingual Transmission (from c. 4th century onward)**
          The great *Avataṃsaka Sūtra* spread outward from Khotan:
          ·**Chinese translations**: Buddhabhadra's sixty-fascicle text (34 chapters,
            418–421 CE); Śikṣānanda's eighty-fascicle text (39 chapters, 695–699 CE).
          ·**Tibetan translation**: translated c. 9th century by Ye shes sde and others
            (45 chapters), based on the Khotanese text, two chapters more than the
            Chinese translations ("Chapter on the Tathāgata's Avataṃsaka" and "Chapter
            on Samantabhadra's Proclamation").
          ·**Sanskrit manuscripts**: only fragmentary individual scriptures survive
            (Daśabhūmika, Gaṇḍavyūha, Bhadracaryāpraṇidhāna); Zhiyan (602–668)
            recorded detailed specifications of a Sanskrit manuscript held at the
            Dacien Temple (541 leaves, 55 syllables per line, 20 lines per leaf).
          A significant doxographical phenomenon merits attention in this stage:
          Paramārtha (c. 6th century) designated the *Avataṃsaka Sūtra* as the
          "Bodhisattvapiṭaka" — a "fourth basket" of the canon beyond the traditional
          tripiṭaka of sūtra, vinaya, and abhidharma. A Dunhuang manuscript colophon
          preserves direct evidence for this classification: "Explication of the Ten
          Stages, entitled Creator of the Wisdom of an Omniscient Being by Degrees, a
          chapter of the Mahāyāna sūtra Bodhisattvapiṭaka Buddhāvataṃsaka." This
          indicates that in early doxography, the *Avataṃsaka* was not simply subsumed
          under the "sūtra basket" but was accorded an independent, overarching
          classificatory status, reflecting the multi-layered structure of the Mahāyāna
          scriptural system.
        sources:
          - "Jan Nattier, 'The Proto-History of the Buddhāvataṃsaka' (ARIRIAB 8, 2005:323-360)"
          - "Imre Hamar, 'The History of the Buddhāvataṃsaka-sūtra: Shorter and Larger Texts' in Reflecting Mirrors (2007:139-167)"
          - "Imre Hamar, 'The Buddhāvataṃsaka-sūtra in the History of Buddhism' (2026)"
          - "Ōtake Susumu, 'On the Origin of the Buddhāvataṃsaka' in Hamar ed., Reflecting Mirrors (2007:87-108)"
          - "H.R. Park, 'The Differences and Editing Process of Chapter Divisions in the Buddhavatamsaka-sutras' (IBK 62:2, 2014)"
          - "Kiyotaka Kimura, A Study of Early Chinese Huayan Thought (Shunjisha, 1977)"

      - title: "印度根源——独立经典的独立生命"
        title_en: "Indian Roots: The Independent Lives of Separate Scriptures"
        body: |
          华严经并非凭空产生, 而是由若干在印度独立流传的经典汇编而成。
          Peter Skilling与Saerji(2013)在《The Circulation of the Buddhāvataṃsaka
          in India》(ARIRIAB 16:193-216)中证明: 在印度, 华严经的各组成部分
          **从未作为大部《华严经》的一部分被引用**, 而是始终以独立经典的身份流传。
          这意味着「华严经」作为一个整体, 可能从未在印度存在过。

          构成华严经的四大印度独立经典:

          (1) **《十地经》**(Daśabhūmika-sūtra) — 华严经中最古老的可辨识成分。
          大竹晋(Ōtake Susumu)认为它必然早于华严经群中所有其他经典, 因为
          所有其他经典都引用了「十地」的概念。该经在印度被独立广泛引用:
          龙树《十地毘婆沙论》(Daśabhūmika-vibhāṣā)是对它的注释;
          《宝性论》(Ratnagotravibhāga)也引用了它。现存梵文单行本(P.L. Vaidya校刊),
          鸠摩罗什曾于5世纪单独译出(T152)。

          (2) **《入法界品》**(Gaṇḍavyūha) — 华严经中最长的单品(约占全经四分之一),
          叙述善财童子五十三参。约成于公元200-300年, 学界共识认为它「后来被作为
          华严经的最终品目加入」。现存梵文写本——最古老的于阗发现的 Gaṇḍavyūha
          梵文写本(Hodgson 2(A)), 末尾附有**于阗文题记**, 证明该写本产自于阗语环境。
          敦煌文献中也保存有独立流传的《金刚幢经》(Vajradhvaja)写本。

          (3) **《普贤行愿赞》**(Bhadracaryāpraṇidhāna) — 普贤十大愿的偈颂体文本,
          常附于入法界品之末。独立梵文本存世。实叉难陀汉译入法界品中不含此赞;
          佛陀跋陀罗单独译出; 般若(798)将其纳入四十华严。

          (4) **《十地经论》/《菩萨地》**(Daśabhūmika-saṃgraha / Bodhisattvabhūmi)
          — 在梵文和藏文中均有广泛独立流传。

          Skilling & Saerji的年表显示: 从公元4世纪到9世纪, 华严经家族的经典在
          南亚持续被引用, 但始终以独立身份出现。寂天(Śāntideva, 685-763)在
          《集菩萨学论》(Śikṣāsamuccaya)中引用华严各品时, 仍使用独立经名
          (如Ratnolkādhārāṇī·Vajradhvaja-sūtra·Lokottaraparivarta·
          Gocarapariśuddhi-sūtra), 而非「华严经某品」——这说明即便在8世纪,
          华严经作为一个整体可能仍未在印度为人所知。
        sources:
          - "Peter Skilling & Saerji, 'The Circulation of the Buddhāvataṃsaka in India' (ARIRIAB 16, 2013:193-216)"
          - "Hamar, Reflecting Mirrors (2007), pp. 139-179"
          - "Hamar, 'The History of the Buddhāvataṃsaka-sūtra' (2007)"
          - "Encyclopedia of Buddhism, 'Buddhāvataṃsaka Sūtra' (Hamar, 2015)"
        en_body: |
          The Avataṃsaka was not created from nothing but was compiled from several
          scriptures that circulated independently in India. Peter Skilling and Saerji
          (2013) demonstrated in "The Circulation of the Buddhāvataṃsaka in India"
          (ARIRIAB 16:193–216) that in India, the constituent parts of the Avataṃsaka
          were **never cited as parts of the great *Avataṃsaka Sūtra***, but always
          circulated as independent scriptures. This means that the "Avataṃsaka Sūtra"
          as a unified whole may never have existed in India.

          Four principal Indian independent scriptures that constitute the Avataṃsaka:

          (1) **The *Daśabhūmika-sūtra*** — the oldest identifiable component. Ōtake
          Susumu argues it must predate all other Avataṃsaka-group texts, since all
          others cite the concept of the ten stages. Widely cited in Indian Buddhism:
          Nāgārjuna's *Daśabhūmika-vibhāṣā* is a commentary on it; the
          *Ratnagotravibhāga* also references it. Survives as an independent Sanskrit
          text (P.L. Vaidya edition); Kumārajīva translated it separately (T152).

          (2) **The *Gaṇḍavyūha*** — the longest single chapter (~¼ of the whole text),
          narrating Sudhana's fifty-three pilgrimages. Composed c. 200–300 CE; scholarly
          consensus holds it was "later added as the final chapter of the Avataṃsaka
          Sūtra." The oldest extant Sanskrit manuscript was found at Khotan (Hodgson
          2(A)), bearing a **Khotanese colophon**, proving its production in a
          Khotanese-language milieu. Independent manuscripts of the *Vajradhvaja*
          (related text) are preserved among the Dunhuang manuscripts.

          (3) **The *Bhadracaryāpraṇidhāna*** — Samantabhadra's ten vows in verse,
          often appended to the end of the Gaṇḍavyūha. Survives independently in
          Sanskrit. Śikṣānanda's Chinese Gaṇḍavyūha omits it; Buddhabhadra translated
          it separately; Prajñā (798) included it in his forty-fascicle version.

          (4) **The *Daśabhūmika-saṃgraha* / *Bodhisattvabhūmi*** — extensively
          circulated independently in both Sanskrit and Tibetan.

          Skilling & Saerji's chronology shows: from the 4th to the 9th century, the
          Avataṃsaka family scriptures were continuously cited in South Asia, but always
          under independent titles. Śāntideva (685–763), in his *Śikṣāsamuccaya*,
          cited Avataṃsaka chapters using their original independent names (Ratnolkā-
          dhārāṇī, Vajradhvaja-sūtra, Lokottaraparivarta, Gocarapariśuddhi-sūtra)
          rather than "Avataṃsaka Chapter X" — indicating that even in the 8th century,
          the Avataṃsaka as a unified whole may not yet have been known in India.
        sources:
          - "Peter Skilling & Saerji, 'The Circulation of the Buddhavatamsaka in India' (ARIRIAB 16, 2013:193-216)"
          - "Hamar, Reflecting Mirrors (2007), pp. 139-179"
          - "Hamar, 'The History of the Buddhavatamsaka-sutra' (2007)"
          - "Encyclopedia of Buddhism, 'Buddhavatamsaka Sutra' (Hamar, 2015)"

      - title: 于阗编纂说——学术共识与争议
        title_en: The Khotan Compilation Thesis — Academic Consensus and Controversy
        body: |
          支持于阗为最终编纂地的关键证据:
          (1) 文献证据: 印度本土只有单品流传, 龙树《大智度论》及寂天《集菩萨学论》
          所引华严类经典均未超出少数零部, 说明印度本无大部《华严经》。
          (2) 语言证据: 梵本《树严经》及八十华严卷五十八中出现"ysa"一词,
          属于**于阗文而非梵文**, 暗示最终编纂地在于阗。
          (3) 结构风格: 七处九会(天上四处·人间三处)的编排方式,
          与印度其他大乘经典的丛书式结构风格迥异, 带有异乡色彩。
          (4) 地理线索: 《菩萨住处品》指出文殊道场在"东北方清凉山"(即五台山),
          透露该经形成地点离中国不远。
          (5) 早期单品(如《兜沙经》《十地经》)约在公元1-2世纪产生,
          早于龙树时代(约2世纪), 后流传至西北印度和中亚。

          **于阗说的学术共识与关键细节**

          Hamar在多部著作中(2007/2021/2026)系统阐述了于阗编纂说的核心论据:
          (6) 语言学铁证: 华严经梵本中混入的「ysa」一词是**于阗文特有的语言标记**,
          而非梵文。这等于在梵文文本中发现了编辑者的「母语指纹」——
          编纂者是操于阗语的人, 在编辑过程中不自觉地将母语词汇混入梵文。
          (7) 皇家支持: Hamar(2021)论证华严经的编纂是一项需要「大量物质资源
          和制度支持」的大规模编辑工程, 需要「组织完善的大规模僧团从事广泛的
          编辑活动」。于阗在3-5世纪由**皇家大规模赞助大乘经典**,
          是唯一可能提供这种机构支持的地点。
          (8) 理念与目的: Hamar(2021)提出: 于阗编纂华严经的动机在于
          「使自己成为大乘佛教的中心和领袖」——通过创造一部汇集大乘思想精华的
          「大丛书」(cycle of sūtras), 于阗将自身打造为大乘佛教的学术圣地。

          于阗编纂说虽为主流共识, 但并非无争议:
          ·Park(2014): 于阗是流通地而非编纂地
          ·Seok Gil-am(2015): 五点反驳(详见「印度编纂说」专题)
          ·大竹晋/平川彰: 主张印度本土编纂
          这些反对意见详见专题「印度编纂说——反对声音与替代假说」。
        sources:
          - "印顺《初期大乘佛教之起源与开展》第十三章「华严法门」"
          - "平川彰《印度佛教史》(春秋社, 1979)"
          - "木村清孝《初期中国华严思想の研究》(春秋社, 1977)"
          - "H.R. Park, 'Was the Avataṃsaka Sutra Compiled in Khotan?' (2015)"
          - "Imre Hamar, 'The History of the Buddhāvataṃsaka-sūtra' (2007)"
          - "Hamar, 'The Circulation and Cultivation of the Buddhavatamsaka in Khotan' (2021)"
          - "Seok Gil-am, 'Was the Avatamsaka Sutra Compiled in Khotan?' (2015)"
        en_body: |
          The key evidence supporting Khotan as the final place of compilation:
          (1) Textual evidence: in India only individual short scriptures circulated;
          the Avataṃsaka-type texts cited by Nāgārjuna in the *Mahāprajñāpāramitā
          Śāstra* and by Śāntideva in the *Śikṣāsamuccaya* do not exceed a few
          scattered fragments, showing that India itself had no large *Avataṃsaka Sūtra*.
          (2) Linguistic evidence: in the Sanskrit manuscript of the *Gaṇḍavyūha*
          and in chapter 58 of the eighty-fascicle text appears the word "ysa,"
          which belongs to the **Khotanese language rather than Sanskrit**, suggesting
          that the final compilation took place in Khotan.
          (3) Structure and style: the arrangement of the seven places and nine
          assemblies (four in the heavens, three in the human realm) differs markedly
          from the anthology-style structure of other Indian Mahāyāna sūtras, bearing
          a foreign coloring.
          (4) Geographic clues: the chapter on the residences of bodhisattvas
          states that Mañjuśrī's bodhimaṇḍa lies at "Mount Clear-and-Cool in the
          northeast" (Mount Wutai), revealing that the sūtra took shape close to China.
          (5) The early short scriptures (such as the *Tuṣa Sūtra* and the
          *Daśabhūmika Sūtra*) arose in roughly the 1st–2nd centuries CE, earlier than
          Nāgārjuna's time (about the 2nd century), and later circulated to Northwest
          India and Central Asia.

          **Hamar's Academic Consensus and Key Details on the Khotan Thesis**

          Hamar has systematically set out the core arguments for the Khotan
          compilation thesis across multiple works (2007/2021/2026):
          (6) **Linguistic fingerprint**: the word "ysa" found in the Sanskrit
          Avataṃsaka is a **Khotanese linguistic marker**, not Sanskrit. This is
          equivalent to finding the editor's "mother-tongue fingerprint" in the
          Sanskrit text — the compilers were Khotanese speakers who inadvertently
          mixed their mother tongue into the Sanskrit during the editorial process.
          (7) **Royal patronage**: Hamar (2021) argues that compiling the Avataṃsaka
          was a large-scale editorial project requiring "substantial material
          resources and institutional support," including "a large and
          well-organized monastic community capable of extensive editorial activity."
          Khotan in the 3rd–5th centuries, with **royal large-scale sponsorship of
          Mahāyāna scriptures**, was the only location that could provide such
          institutional backing.
          (8) **Purpose and motivation**: Hamar (2021) proposes that Khotan's
          motivation for compiling the Avataṃsaka was to "make itself the center
          and leader of Mahāyāna Buddhism" — by creating a great "cycle of sūtras"
          that汇集 the cream of Mahāyāna thought, Khotan positioned itself as the
          academic holy land of Mahāyāna Buddhism.

          Although the Khotan thesis is the mainstream consensus, it is not without
          controversy:
          ·Park (2014): Khotan was a place of circulation, not compilation
          ·Seok Gil-am (2015): five-point rebuttal (see "Indian Compilation Thesis")
          ·Ōtake Susumu / Hirakawa Akira: argue for compilation in India proper
          These opposing views are detailed in the专题 "Indian Compilation Thesis —
          Opposition and Alternative Hypotheses."
        sources:
          - "Yinshun, The Origins and Development of Early Mahāyāna Buddhism, Ch. 13"
          - "Hirakawa Akira, A History of Indian Buddhism (Shunjisha, 1979)"
          - "Kiyotaka Kimura, A Study of Early Chinese Huayan Thought (Shunjisha, 1977)"
          - "H.R. Park, 'Was the Avataṃsaka Sutra Compiled in Khotan?' (2015)"
          - "Imre Hamar, 'The History of the Buddhāvataṃsaka-sūtra' (2007:139-167)"
          - "Hamar, 'The Circulation and Cultivation of the Buddhavatamsaka in Khotan' (2021)"
          - "Seok Gil-am, 'Was the Avatamsaka Sutra Compiled in Khotan?' (2015)"

      - title: "印度编纂说——反对声音与替代假说"
        title_en: "The Indian Compilation Thesis — Opposition and Alternative Hypotheses"
        body: |
          并非所有学者都接受于阗编纂说。以下为最主要的反对意见——

          **石崎研(Seok Gil-am, 2015): 于阗非编纂地**
          韩国学者石崎研在《Was the Avataṃsaka Sutra Compiled in Khotan?》
          (Korean Journal of Buddhist Studies 42:83-112)中提出五点反驳:
          (1) 文献仅证明流通:《華嚴經記》与闍那崛多(Lidaisanbaoji)的传记
          只能证实六十华严梵本的早期**流通地**在于阗, 不能作为编纂地的证据。
          (2) 地理视野偏向西北印度:《菩萨住处品》所列诸国住处的地理中心
          更偏向**西北印度**(犍陀罗·富楼沙·塔克西拉一带), 而非于阗。
          (3) 阿毗达磨回应遍布全经: 华严经中对部派佛教(声闻·缘觉)的回应
          不仅存在于核心单品中, 也存在于编纂过程中增补的部分。
          这意味着编纂地至少在4世纪中叶仍是部派佛教占优势的地区——
          而于阗在此时已是大乘佛教占主导。
          (4) 于阗佛教遗迹年代偏晚: 于阗反映华严经信仰的佛教遗迹,
          其年代与华严经编纂年代相差不远, 更可能是编纂后的产物,
          说明编纂后的经典**被传入**于阗, 而非在于阗编纂。
          (5) 塔信仰是编纂条件: 华严经以佛塔信仰为背景,
          而佛塔信仰在**西北印度**最为盛行。

          **平川彰(Hirakawa Akira)与大竹晋(Ōtake Susumu): 印度本土编纂**
          日本学者平川彰与大竹晋主张: 华严经的梵文原本是在**印度**编纂的,
          由已在流传的各独立经典汇编而成。大竹晋在Hamar(2007)所编
          《Reflecting Mirrors》(pp.87-108)中论证: 华严经的核心编纂工作
          发生在印度, 然后才流传至中亚。

          **Park, Hyunjin(2014): 流通地≠编纂地**
          Park在IBK 62:2中指出: 于阗说的主要依据(六十华严底本来自于阗)
          只能证明于阗是**流通地**而非**编纂地**。他进一步通过分析
          《菩萨住处品》的地理描写, 认为编纂者的地理视野中心
          在**西北印度**而非于阗。此外, 华严经中对阿毗达磨佛教的回应,
          暗示编纂地在4世纪中叶仍是部派佛教占优势的地区。

          **目前学术状态**: 于阗编纂说仍为主流, 但印度西北编纂说获得越来越多
          支持。两种假说均承认: 华严经的各组成部分起源于印度,
          最终的大本编纂发生在中亚或西北印度, 具体地点仍有争议。
        sources:
          - "Seok Gil-am, 'Was the Avatamsaka Sutra Compiled in Khotan?' (Korean J. Buddhist Studies 42, 2015:83-112)"
          - "Park Hyunjin, 'The Differences and Editing Process' (IBK 62:2, 2014)"
          - "Ōtake Susumu, 'On the Origin and Early Development' in Hamar (2007:87-108)"
          - "Hirakawa Akira, A History of Indian Buddhism (Shunjisha, 1979)"
          - "印顺《初期大乘佛教之起源与开展》第十三章"
        en_body: |
          Not all scholars accept the Khotan compilation thesis. The main
          objections are as follows —

          **Seok Gil-am (2015): Khotan Was Not the Compilation Site**
          The Korean scholar Seok Gil-am, in "Was the Avataṃsaka Sūtra Compiled in
          Khotan?" (Korean J. Buddhist Studies 42:83–112), presented five counter-
          arguments: (1) Textual evidence only proves circulation: the *Huayanjingji*
          and Jñānagupta's biography in the *Lidaisanbaoji* only confirm that the
          base text of the sixty-fascicle version was in early circulation in Khotan;
          this cannot serve as evidence for the compilation site. (2) The geographical
          horizon of the "Bodhisattva Residences" chapter centers on **Northwestern
          India** (Gandhāra, Puṣkalāvatī, Taxila), not Khotan. (3) Abhidharma
          references permeate the entire text: the Avataṃsaka's responses to sectarian
          Buddhism (śrāvaka, pratyekabuddha) appear not only in the core scriptures
          but also in the additions made during compilation. This means the
          compilation milieu was still dominated by Abhidharma Buddhism at least until
          the mid-4th century — by which time Khotan was already predominantly
          Mahāyāna. (4) Khotanese Buddhist relics are too late: relics reflecting
          Avataṃsaka faith date from shortly after compilation, suggesting the text
          was **introduced to** Khotan rather than compiled there. (5) Stūpa worship
          was a precondition: the Avataṃsaka is based on stūpa worship, which was
          most prevalent in **Northwestern India**.

          **Hirakawa Akira and Ōtake Susumu: Indian Compilation**
          The Japanese scholars Hirakawa and Ōtake argue that the Sanskrit original
          was compiled **in India** from sūtras already in circulation. Ōtake, in
          Hamar's *Reflecting Mirrors* (2007, pp. 87–108), argues that the core
          compilation took place in India before the text spread to Central Asia.

          **Park, Hyunjin (2014): Circulation Site ≠ Compilation Site**
          Park (IBK 62:2) points out that the Khotan thesis's main evidence (the
          sixty-fascicle base text coming from Khotan) only proves that Khotan was a
          place of **circulation** rather than **compilation**. Through examining the
          geographical descriptions in the "Bodhisattva Residences" chapter, he
          argues the compiler's geographical horizon was centered on **Northwestern
          India**, not Khotan. Furthermore, the Avataṃsaka's Abhidharma references
          suggest a compilation milieu where sectarian Buddhism was still dominant
          until at least the mid-4th century.

          **Current scholarly status**: the Khotan thesis remains mainstream, but the
          Northwestern Indian compilation thesis is gaining increasing support. Both
          hypotheses agree that the Avataṃsaka's constituent parts originated in
          India and that the final great compilation took place in Central Asia or
          Northwestern India, with the exact location still debated.
        sources:
          - "Seok Gil-am, 'Was the Avatamsaka Sutra Compiled in Khotan?' (Korean J. Buddhist Studies 42, 2015:83-112)"
          - "Park Hyunjin, 'The Differences and Editing Process' (IBK 62:2, 2014)"
          - "Ōtake Susumu, 'On the Origin and Early Development' in Hamar (2007:87-108)"
          - "Hirakawa Akira, A History of Indian Buddhism (Shunjisha, 1979)"
          - "Yinshun, The Origins and Development of Early Mahayana Buddhism, Ch. 13"

      - title: 编辑手法——独立经本如何变成一部大经
        title_en: Editorial Techniques — How Independent Sūtras Became One Great Scripture
        body: |
          将独立经本编纂为大本《华严经》的编辑手法, 主要包括以下几项——
          (1) **删除开篇语**: 各独立经本原有的「如是我闻, 一时佛在...」(evam mayā
          śrutam, ekasmin samaye...)被删除或改写。汉译二本将「一时」统一改写为
          「尔时」(atha khalu), 藏译则以「denas」(then)连接同一会座的各章。
          (2) **删除结尾语**: 独立经本的结束语(如「闻菩萨所说, 皆大欢喜」)被删除,
          使各品在叙事上首尾相接。但藏译华严中, 第31品(十地品)·第32品(普贤所说品)·
          第43品(如来出现品)仍保留了独立经本的结尾语, 显示编辑尚未彻底完成。
          (3) **统一叙事框架**: 通过删除或改写地点·听众相关语句, 将原本在不同时间·
          地点·听众面前所说的不同经本, 统一为「佛陀成道后, 于七处九会中连续宣说」
          的单一叙事。这是华严经最核心的编辑创新。
          (4) **品目细分与增补**: 部分品目在编纂过程中被进一步细分(如六十华严的
          「卢舍那佛品」在八十华严中被分为五品), 同时增补了新品目(如「十定品」
          仅见于八十华严与藏译, 六十华严无此品)。
          (5) **内容扩展**: 八十华严比六十华严多出约9,000偈(四万五千偈 vs 三万六千偈),
          新增内容包括更详细的菩萨行愿描述·更丰富的佛身相好·以及更完整的善财求法叙事。

          **Toyobunko 2024: 藏文华严经结构分析——编辑未完成的证据**
          堀晃(Hori Akira)在Toyobunko 2024研究《On the Structure and Format of
          the Tibetan Buddhāvataṃsakasūtra》中, 通过对比藏文华严经与汉译二本的
          品目结构, 发现了编辑过程尚未彻底完成的关键证据——

          三处保留独立经本结尾语的品目:
          ·第31品(十地品, Daśabhūmika) — 藏文保留了「如来欢喜品」结尾,
            汉译二本则已删除
          ·第32品(普贤所说品, Samantabhadra's Teaching) — 藏文保留了独立结尾,
            显示此品在编辑时仍被视为独立经本
          ·第43品(如来出现品, Tathāgata's Manifestation) — 同样保留了
            独立结尾语

          这三品恰好都是华严经中**最古老的核心成分**——十地经和如来兴显经
          早在华严经编纂之前就已独立流传。它们在藏译中保留独立结尾,
          说明编纂者在整合这些古老经典时, 并未完全抹去其独立来源的痕迹。
          这一发现支持了「华严经是渐进编纂而非一次性创作」的学术共识,
          也解释了为什么华严经的叙事框架虽然宏大统一, 但内部仍可见
          独立经本的「接缝」。

          **编辑手法的总体特征**
          综合以上分析, 华严经的编纂者采用了以下策略:
          ·**统一叙事框架**: 将分散的经典统一为「佛陀成道后七处九会」的连贯叙事
          ·**保留核心内容**: 尊重各经典的核心义理, 不作大幅删改
          ·**灵活处理边界**: 对古老经典(十地·如来出现)保留一定的独立性
          ·**渐进式增补**: 在统一框架下逐步增加新品目(如十定品)
          这种编辑策略使华严经既保持了各经典的思想深度, 又获得了
          作为「大丛书」的整体统一性。
        sources:
          - "H.R. Park, 'The Differences and Editing Process of Chapter Divisions' (IBK 62:2, 2014)"
          - "Imre Hamar, 'The History of the Buddhāvataṃsaka-sūtra' (2007:139-167)"
          - "On the Structure and Format of the Tibetan Buddhāvataṃsakasūtra (Toyobunko, 2024)"
        en_body: |
          The editorial techniques for compiling the independent sūtras into the great
          *Avataṃsaka Sūtra* mainly include the following —
          (1) **Deleting opening phrases**: the standard "evam mayā śrutam, ekasmin
          samaye..." (Thus have I heard, at one time...) from each independent sūtra
          was deleted or rewritten. Both Chinese translations rewrote "ekasmin samaye"
          as "atha khalu" (at that time); the Tibetan uses "denas" (then) to connect
          chapters within the same assembly.
          (2) **Deleting closing phrases**: the concluding phrases of independent sūtras
          (such as "Hearing what the bodhisattva said, they were all greatly rejoiced")
          were deleted so that each chapter connects narratively. However, in the
          Tibetan Avataṃsaka, chapters [31] (Ten Stages), [32] (Teaching by
          Samantabhadra), and [43] (Teaching on the Appearance of the Tathāgata) still
          retain their independent-sūtra closing phrases, showing that the editing was
          not entirely complete.
          (3) **Unifying the narrative framework**: by deleting or rewriting phrases
          related to location and audience, originally distinct sūtras preached at
          different times, places, and to different audiences were unified into a
          single narrative of "the Buddha, immediately after enlightenment, continuously
          preaching at seven places and nine assemblies." This is the most innovative
          editorial achievement of the Avataṃsaka.
          (4) **Chapter subdivision and addition**: some chapters were further subdivided
          during compilation (e.g., the "Chapter on Vairocana Buddha" in the sixty-
          fascicle text was split into five chapters in the eighty-fascicle text), while
          new chapters were added (e.g., the "Chapter on Ten Samādhis" appears only in
          the eighty-fascicle text and the Tibetan translation, not in the sixty-fascicle
          text).
          (5) **Content expansion**: the eighty-fascicle text contains approximately
          9,000 gāthās more than the sixty-fascicle text (45,000 vs. 36,000), with
          additional content including more detailed descriptions of bodhisattva vows,
          richer accounts of the Buddha's physical marks, and a more complete narrative
          of Sudhana's quest.

          **Toyobunko 2024: Structural Analysis of the Tibetan Avataṃsaka — Evidence
          of Incomplete Editing**
          Hori Akira, in his Toyobunko 2024 study *On the Structure and Format of the
          Tibetan Buddhāvataṃsakasūtra*, compared the chapter divisions of the Tibetan
          Avataṃsaka with those of the two Chinese translations and discovered key
          evidence that the editorial process was not entirely complete —

          Three chapters retaining independent sūtra closing phrases:
          ·Chapter 31 (Daśabhūmika / Ten Stages) — the Tibetan preserves the closing
            phrase of the "Chapter on the Tathāgata's Joy," which both Chinese
            translations have deleted
          ·Chapter 32 (Samantabhadra's Teaching) — the Tibetan retains an independent
            closing, showing this chapter was still treated as an independent sūtra
            during editing
          ·Chapter 43 (Tathāgata's Manifestation) — likewise retains an independent
            closing phrase

          These three chapters happen to be the **oldest core components** of the
          Avataṃsaka — the *Daśabhūmika* and the *Tathāgatotpattisaṃbhava-nirdeśa*
          circulated independently long before the Avataṃsaka was compiled. Their
          retention of independent closings in the Tibetan translation shows that the
          compilers, while integrating these ancient scriptures, did not completely
          erase traces of their independent origins. This finding supports the
          academic consensus that "the Avataṃsaka was gradually compiled, not created
          in a single act," and also explains why, despite the grand unified narrative
          framework, one can still detect the "seams" of independent sūtras within.

          **Overall Characteristics of the Editorial Approach**
          In summary, the compilers of the Avataṃsaka employed the following
          strategies:
          ·**Unified narrative framework**: consolidating dispersed scriptures into a
            coherent narrative of "the Buddha preaching at seven places and nine
            assemblies immediately after enlightenment"
          ·**Preserving core content**: respecting the essential teachings of each
            scripture without substantial deletion or alteration
          ·**Flexible handling of boundaries**: maintaining a degree of independence
            for ancient scriptures (Daśabhūmika, Tathāgata's Manifestation)
          ·**Gradual supplementation**: progressively adding new chapters within the
            unified framework (e.g., the Chapter on Ten Samādhis)
          This editorial strategy allowed the Avataṃsaka to retain the philosophical
          depth of each constituent scripture while achieving the overall coherence of
          a great "cycle of sūtras."
        sources:
          - "H.R. Park, 'The Differences and Editing Process of Chapter Divisions in the Buddhavatamsaka-sutras' (IBK 62:2, 2014)"
          - "Imre Hamar, 'The History of the Buddhāvataṃsaka-sūtra' in Reflecting Mirrors (2007:139-167)"
          - "On the Structure and Format of the Tibetan Buddhāvataṃsakasūtra (Toyobunko, 2024)"

      - title: "华严经的断代问题——何时编成?"
        title_en: "The Dating Problem — When Was the Avataṃsaka Compiled?"
        body: |
          华严经的编纂年代是学术界长期争论的问题。由于没有完整的梵文原本存世,
          只能通过间接证据推断——

          **下限(Terminus ante quem): 420年以前**
          佛陀跋陀罗于418-420年完成六十华严的翻译, 底本由支法领从于阗取回。
          这意味着「完整版」华严经的梵文底本**必须在约400年以前已经存在**。
          但六十华严并非全本—— Divākara(日照, 680年抵长安)带来了Gaṇḍavyūha
          梵文写本, 与法藏一同校对佛陀跋陀罗的旧译, 发现有**九个段落**在所有
          梵文写本中均存在, 但佛陀跋陀罗漏译了。这说明420年的底本已经是一个
          有固定内容的完整文本。

          **上限: 约公元1-2世纪**
          最早的华严单品(兜沙经, T280)由支谶于178-189年译出,
          说明其印度原型至少可追溯至公元1-2世纪。
          十地经(Daśabhūmika-sūtra)的年代可能更早,
          大竹晋认为它必然早于华严经群中所有其他经典。

          **学术界的年代估计**:
          ·Encyclopedia of Buddhism: 「至少在佛陀入灭后500年才开始编写」
          ·Britannica: 「最可能在**4世纪**以梵文编成」
          ·Gimello(2005/1987): 「3世纪末或4世纪」
          ·一般共识: 核心编纂约在**3-4世纪**, 持续增补至5世纪

          **梵文写本的物证**:
          堀晃(Hori Akira)在Toyobunko研究中识别出一批来自
          Khadaliq遗址(于阗以东约115公里)的梵文残片, 最可能属于
          一部包含完整华严经的单一大型写本。其中Gaṇḍavyūha残片
          (Hoernle Collection Or 15010/155)带有叶码「382」,
          如果是独立的Gaṇḍavyūha写本, 总叶数不会超过140,
          因此「382」暗示它是大部华严经写本的一部分。
          写本使用纸张, 字体为Early Turkestan Brāhmī type b,
          据Lore Sander断代为**5-6世纪**。这是目前已知最接近
          「完整华严经」的物理证据。

          **活的经典——华严经并非固定文本**
          一个重要认识: 华严经从未有过一个「定本」。
          从六十华严(36,000偈)到八十华严(45,000偈)再到藏译(45品),
          经典的内容和品目一直在扩展。藏译比汉译多出的「如来华严品」
          与「普贤宣说品」, 以及八十华严比六十华严多出的「十定品」,
          都说明编纂是一个持续数百年的**动态过程**。
        sources:
          - "Hori Akira, 'Extant Sanskrit Manuscripts of the Buddhavatamsaka' (Toyobunko)"
          - "Hamar, 'The History of the Buddhavatamsaka-sutra' (2007:139-179)"
          - "Encyclopedia of Buddhism, 'Buddhavatamsaka Sutra' (2026)"
          - "Grokipedia, 'Buddhavatamsaka Sutra'"
        en_body: |
          The dating of the Avataṃsaka's compilation is a long-standing scholarly
          debate. Since no complete Sanskrit original survives, scholars must rely on
          indirect evidence —

          **Terminus ante quem: before 420 CE**
          Buddhabhadra completed his sixty-fascicle translation in 418–420 CE from a
          base text obtained from Khotan by Zhi Faling. This means the "complete"
          Sanskrit Avataṃsaka **must have existed by approximately 400 CE**. However,
          the sixty-fascicle text was not the full version — Divākara (who arrived in
          Chang'an in 680) brought a Sanskrit Gaṇḍavyūha manuscript and, together with
          Fazang, compared it with Buddhabhadra's translation, finding **nine passages**
          present in all Sanskrit versions but omitted by Buddhabhadra. This confirms
          that the 420 base text was already a complete, fixed text.

          **Terminus post quem: approximately 1st–2nd centuries CE**
          The earliest Avataṃsaka excerpt (the *Tuṣa Sūtra*, T280) was translated by
          Lokakṣema in 178–189 CE, meaning its Indian original dates to at least the
          1st–2nd centuries. The *Daśabhūmika-sūtra* may be even earlier; Ōtake argues
          it must predate all other Avataṃsaka-group texts.

          **Scholarly dating estimates**:
          ·Encyclopedia of Buddhism: "composed in stages, beginning from at least 500
            years after the death of the Buddha"
          ·Britannica: "most likely composed in Sanskrit in the **4th century**"
          ·Gimello (2005/1987): "late third or the fourth century CE"
          ·General consensus: core compilation c. **3rd–4th century**, with continued
            additions through the 5th century

          **Physical evidence from Sanskrit manuscripts**:
          Hori Akira (Toyobunko) identified numerous Sanskrit fragments from the ruins
          of Khadaliq (c. 115 km east of Khotan) that most likely belonged to a single
          manuscript containing the entire Avataṃsaka. A Gaṇḍavyūha fragment (Hoernle
          Collection Or 15010/155) bears the folio number "382" — if it were an
          independent Gaṇḍavyūha manuscript, the total folios would not exceed 140,
          suggesting "382" indicates it was part of a large, complete Avataṃsaka
          manuscript. The writing support is paper, and the script is Early Turkestan
          Brāhmī type b, dated by Lore Sander to the **5th–6th century**. This is the
          closest physical evidence to a "complete Avataṃsaka" currently known.

          **A Living Scripture — the Avataṃsaka Was Never Fixed**
          A crucial realization: the Avataṃsaka never had a "definitive edition."
          From the sixty-fascicle text (36,000 gāthās) to the eighty-fascicle text
          (45,000 gāthās) to the Tibetan translation (45 chapters), the content and
          chapter divisions were continuously expanding. The Tibetan translation's two
          additional chapters ("Tathāgata Avataṃsaka" and "Samantabhadra's Teaching"),
          and the eighty-fascicle text's "Chapter on Ten Samādhis" absent from the
          sixty-fascicle version, all demonstrate that compilation was a **dynamic
          process** spanning several centuries.
        sources:
          - "Hori Akira, 'Extant Sanskrit Manuscripts of the Buddhavatamsaka' (Toyobunko)"
          - "Hamar, 'The History of the Buddhavatamsaka-sutra' (2007:139-179)"
          - "Encyclopedia of Buddhism, 'Buddhavatamsaka Sutra' (2026)"
          - "Grokipedia, 'Buddhavatamsaka Sutra'"

      - title: 于阗——华严经的故乡
        title_en: Khotan — The Homeland of the Avataṃsaka Sūtra
        body: |
          **于阗**(Khotan, 今新疆和田)是《华严经》形成与传播的最大策源地:
          (1) 遮拘迦国(于阗东南二千余里)「宫中自有摩诃般若·大集·华严三部」,
          各十万偈(据闍那崛多传记)。
          (2) 玄奘归国途经斫句迦(子合)时, 记载该国「大乘经典部数甚多,
          十万颂为部, 凡有十数」。
          (3) 晋译六十华严的底本(三万六千偈)由支法领**从于阗取回**。
          (4) 唐译八十华严的底本由武则天遣使**赴于阗求得**。
          (5) 藏文《华严经》(Toh44, 45品)原本同样**来自于阗**。
          (6) 海云继梦法师断言: 「《华严经》的故乡在西域」——
          于阗地处中国·印度·巴比伦·埃及·希腊罗马五大古文明中心,
          《华严经》是人类五大古文明的精华结晶。

          **于阗佛教的皇室支持传统**
          于阗佛教的发展与皇室支持密不可分。根据藏文史料《于阗国授记》
          (Li-yul lung-bstan-pa), 于阗历史上有过多位崇佛国王:
          ·尉迟舍耶(Vijaya Sambhava)时期: 大力弘扬佛法, 建立寺院
          ·尉迟菩提(Vijaya Bodhi)时期: 进一步扩大佛教影响
          于阗的皇家赞助使该地成为大乘经典的翻译与流通中心,
          华严经的编纂正是在这种皇室支持的制度背景下完成的。

          **Devendraprajñā(天慧智)与华严经在于阗的传持**
          根据藏文记载, Devendraprajñā(天慧智)是华严经在于阗的重要传持者。
          他将华严经的核心教义(特别是十地品和入法界品)在于阗僧团中
          广泛传播, 使其成为于阗大乘佛教的核心经典之一。
          这一传持传统为华严经的编纂提供了坚实的教理基础。

          **于阗作为「佛国」的文化身份**
          于阗不仅是一个地理概念, 更是一个佛教文化身份的象征。
          《华严经》在于阗的编纂与传持, 使于阗成为「大乘佛教的故乡」
          这一文化标签的核心支撑。海云继梦法师所言「华严经的故乡在西域」,
          正是对这一文化身份的确认——于阗作为五大古文明的交汇点,
          天然具备了产生「大丛书」式经典的地理与文化条件。
        sources:
          - "海云继梦《华严思想的承先与启后》(讲记, 大华严寺)"
          - "羽溪了谛《西域之佛教》(1923)"
        en_body: |
          **Khotan** (modern Hotan, Xinjiang) was the greatest center for the
          formation and spread of the *Avataṃsaka Sūtra*:
          (1) At Zakkuka (more than two thousand li southeast of Khotan), the royal
          palace was said to hold "the Mahāprajñāpāramitā, the Mahāsaṃnipāta, and the
          Avataṃsaka — three collections," each of one hundred thousand gāthās
          (according to the biography of Jñānagupta).
          (2) When Xuanzang returned home passing through Sokhsa (Zhejujia / Zihu),
          he recorded that this country "possessed a great many Mahāyāna scriptures,
          with one hundred thousand verses as a collection, over ten collections in all."
          (3) The Sanskrit base text of the Jin (sixty-fascicle) translation
          (thirty-six thousand gāthās) was brought **back from Khotan** by Zhi Faling.
          (4) The base text of the Tang (eighty-fascicle) translation was obtained
          **from Khotan** through an envoy dispatched by Empress Wu Zetian.
          (5) The Tibetan *Avataṃsaka Sūtra* (Toh44, 45 chapters) likewise
          **came from Khotan**.
          (6) Venerable Haiyun Jimeng asserts: "The homeland of the *Avataṃsaka Sūtra*
          lies in the Western Regions" — Khotan stood at the crossroads of the five
          great centers of ancient civilization (China, India, Babylon, Egypt,
          and Greco-Roman), and the *Avataṃsaka Sūtra* is the distilled essence of
          these five great civilizations of humanity.

          **The Tradition of Royal Patronage in Khotanese Buddhism**
          The development of Buddhism in Khotan was inseparable from royal support.
          According to the Tibetan historical text *Li-yul lung-bstan-pa* (Prophecy
          for the Li Country / Khotan), Khotan had multiple Buddhist kings:
          ·Vijaya Sambhava: vigorously promoted Buddhism and established monasteries
          ·Vijaya Bodhi: further expanded Buddhist influence
          Royal patronage in Khotan made it a center for the translation and
          circulation of Mahāyāna scriptures, and the compilation of the Avataṃsaka
          was accomplished within this institutional context of royal support.

          **Devendraprajñā and the Transmission of the Avataṃsaka in Khotan**
          According to Tibetan records, Devendraprajñā was an important transmitter
          of the Avataṃsaka in Khotan. He widely propagated the core teachings of
          the Avataṃsaka (especially the Daśabhūmika and the Gaṇḍavyūha) within
          the Khotanese monastic community, making it one of the central scriptures
          of Khotanese Mahāyāna Buddhism. This transmission tradition provided a
          solid doctrinal foundation for the compilation of the Avataṃsaka.

          **Khotan as a "Buddhist Kingdom" — Cultural Identity**
          Khotan was not merely a geographic concept but a symbol of Buddhist
          cultural identity. The compilation and transmission of the *Avataṃsaka
          Sūtra* in Khotan made "the homeland of Mahāyāna Buddhism" the core
          cultural label of the region. Venerable Haiyun Jimeng's assertion that
          "the homeland of the *Avataṃsaka Sūtra* lies in the Western Regions"
          is precisely a confirmation of this cultural identity — Khotan, as the
          crossroads of five great ancient civilizations, was naturally endowed
          with the geographic and cultural conditions to produce a "great cycle
          of sūtras."

      - title: 三龙传说——海云继梦的表法诠释
        title_en: The Legend of the Three Dragons — Haiyun Jimeng's Symbolic Reading
        body: |
          传统说法: 佛陀成道后宣讲华严, 大龙菩萨结集藏于龙宫。
          九百年后龙树菩萨入龙宫诵出十万偈, 流传人间。
          海云继梦法师将此「三龙传说」做了自性表法的诠释——
          **大龙菩萨** = 具大善根之人(非特指个体)
          **龙宫** = **自性海**(人人本具的佛性, 非海中龙宫)
          **龙树菩萨** = 有大善根且能起大作用饶益众生的人
          合而言之: 「有大善根的人, 把佛陀的教法汇集起来,
          从自性海中把它开发出来, 贡献给大众。」
          《华严经》的诞生, 本质是真理的存在由隐而显——
          古今中外的大德, 皆可名之为龙树、大龙, 乃至皆为法身大士。
        sources:
          - "海云继梦《华严思想的承先与启后》讲记(fjdh.cn)"
          - "海云继梦《华严经导读》系列(空庭书苑)"
        en_body: |
          The traditional account: after the Buddha's enlightenment he preached the
          Avataṃsaka, and the Nagarāja (Great Dragon Bodhisattva) assembled and
          stored it in the dragon palace. Nine hundred years later Nāgārjuna entered
          the dragon palace and recited the one hundred thousand gāthās, which were
          then transmitted in the human world. Venerable Haiyun Jimeng interprets this
          "legend of the three dragons" in terms of the reality of one's own nature —
          **the Great Dragon Bodhisattva** = a person of great good roots (not a
          single individual); **the dragon palace** = **the ocean of one's own nature**
          (the buddha-nature inherent in every person, not an ocean palace);
          **Nāgārjuna** = a person of great good roots who can bring about great
          benefit for sentient beings. In sum: "A person of great good roots gathers
          together the Buddha's teachings, develops them from the ocean of his own
          nature, and offers them to the multitude." The birth of the *Avataṃsaka
          Sūtra* is in essence the truth's passage from the hidden to the manifest —
          the great masters past and present, East and West, may all be called
           Nāgārjuna or the Great Dragon, and are all dharmakāya bodhisattvas.

      - title: "华严经与中国华严宗的形成"
        title_en: "The Avataṃsaka Sūtra and the Formation of the Chinese Huayan School"
        body: |
          华严经传入中国后, 直接催生了华严宗——中国佛教最具哲学深度的宗派之一。
          从文本到宗派的转化过程如下——

          **第一阶段: 文本传入(418-420年)**
          佛陀跋陀罗(Buddhabhadra, 359-429)在建康(南京)道场寺完成六十华严翻译。
          底本由支法领从于阗取回, 仅36,000偈(为全本的前半部)。
          这是华严经在中国的首次完整呈现, 但尚未形成独立的宗派。

          **第二阶段: 杜顺的直觉洞察(557-640)**
          杜顺(Dushun)被尊为华严宗初祖。他依据六十华严中的「修止观」章修行,
          据说亲证了华严经所描述的境界。他建立了华严的修证传统,
          但尚未产出系统的哲学论述。其核心贡献是**直觉性地认识到**
          华严经所蕴含的「事事无碍」思想的深邃性。

          **第三阶段: 智俨的系统讲座(602-668)**
          智俨(Zhiyan)是华严宗二祖, 对六十华严和八十华严(实叉难陀新译)
          均进行了系统的讲座, 并产出首批重要注疏。他记录了大慈恩寺所藏
          梵本华严经的详细规格(44品·541叶·每叶55字·20行)。
          他发展出华严哲学的初始框架:「十玄门」(十种玄妙的法界关系)
          和「五教判教」(将佛教教义分为五个层次的判教体系)。

          **第四阶段: 法藏的哲学体系化(643-712)**
          法藏(Fazang)是华严宗三祖, 也是华严哲学的**系统化者**。
          他参与了实叉难陀八十华严的翻译工作(695-699), 因此直接接触梵文原典。
          他为武则天建造了著名的「**十镜堂**」——十面镜子围成一圈,
          中间置一佛像, 点燃灯烛, 镜中佛像重重无尽, 具象化了
          「一即一切·一切即一」的华严核心教义。
          他撰写了《华严经探玄记》(六十华严的权威注疏),
          并完成了华严哲学的完整体系: 法界(dharmadhātu)四法界、
          事事无碍(shih-shih wu-ai)、六相、十玄门。

          **第五阶段: 澄观与宗密的深化(738-841)**
          澄观(Chengguan, 738-839, 四祖)和宗密(Zongmi, 780-841, 五祖)
          进一步将华严与禅宗等宗派整合, 扩大了华严的影响范围。
          澄观将华严经的「五周因果」归纳为信·解·行·证的完整修行地图,
          宗密则将华严与禅宗的心性思想相融通。
          
          华严宗的形成过程, 本身就是一个「从文本到哲学」的典范——
          一部来自于阗的巨型经典, 经由中国祖师的讲习·注疏·冥想·论证,
          最终成为东亚佛教最具系统性的哲学体系之一。
        sources:
          - "Hamar, Reflecting Mirrors (2007), Introduction"
          - "Gimello, 'Chih-yen' (1976, unpublished PhD dissertation, Harvard)"
          - "Fazang, Huayan jing tanxuan ji (T35n1736)"
          - "Chengguan, Huayan jing shu (T35n1735)"
          - "Peter Gregory, Tsung-mi and the Sinification of Buddhism (1991)"
        en_body: |
          After the Avataṃsaka was transmitted to China, it directly gave rise to the
          Huayan school — one of the most philosophically profound traditions in Chinese
          Buddhism. The transformation from text to school proceeded as follows —

          **Phase 1: Textual Transmission (418–420 CE)**
          Buddhabhadra (359–429) completed the sixty-fascicle translation at the
          Daochang Monastery in Jiankang (Nanjing). The base text, obtained from Khotan
          by Zhi Faling, comprised only 36,000 gāthās (the first half of the full
          text). This was the Avataṃsaka's first complete presentation in China, but
          it had not yet formed an independent school.

          **Phase 2: Dushun's Intuitive Insight (557–640)**
          Dushun (Du Shun) is revered as the first patriarch of Huayan. Practicing
          according to the "Calming and Contemplation" chapter of the sixty-fascicle
          text, he is said to have directly realized the states described in the
          Avataṃsaka. He established the Huayan tradition of practice and realization
          but did not yet produce systematic philosophical treatises. His core
          contribution was **intuitively recognizing** the profundity of the
          "non-obstruction of phenomenon and phenomenon" (shih-shih wu-ai) thought
          contained in the Avataṃsaka.

          **Phase 3: Zhiyan's Systematic Lectures (602–668)**
          Zhiyan, the second patriarch, delivered systematic lectures on both the
          sixty-fascicle and eighty-fascicle (Śikṣānanda's new translation) Avataṃsaka
          and produced the first major commentaries. He recorded the detailed
          specifications of a Sanskrit manuscript held at the Dacien Temple (44
          chapters, 541 leaves, 55 syllables per line, 20 lines per leaf). He
          developed the initial framework of Huayan philosophy: the "Ten Mysterious
          Gates" (shí xuán mén) and the "Five Teachings" classification system.

          **Phase 4: Fazang's Philosophical Systematization (643–712)**
          Fazang, the third and most influential patriarch, was the **systematizer** of
          Huayan philosophy. He participated in Śikṣānanda's translation of the
          eighty-fascicle text (695–699), giving him firsthand access to Sanskrit
          sources. He built the famous **"Hall of Ten Mirrors"** for Empress Wu — ten
          mirrors arranged in a circle with a Buddha image in the center; when lit,
          infinite Buddha reflections appeared in the mirrors, embodying the Huayan
          principle that "one is all, all is one." He authored the *Huayan jing tanxuan
          ji* (the definitive commentary on the sixty-fascicle text) and completed the
          full Huayan philosophical system: the fourfold dharmadhātu, non-obstruction
          of phenomenon and phenomenon, the six characteristics, and the ten
          mysterious gates.

          **Phase 5: Chengguan and Zongmi's Deepening (738–841)**
          Chengguan (738–839, fourth patriarch) and Zongmi (780–841, fifth patriarch)
          further integrated Huayan with Chan and other schools, expanding its
          influence. Chengguan synthesized the Avataṃsaka's "five cycles of cause and
          effect" into a complete map of faith → understanding → practice →
          realization; Zongmi harmonized Huayan with Chan's mind-nature thought.

          The formation of the Huayan school is itself a paradigm of "from text to
          philosophy" — a monumental scripture from Khotan, through the Chinese
          patriarchs' lectures, commentaries, meditation, and论证, ultimately became
          one of the most systematic philosophical traditions in East Asian Buddhism.
        sources:
          - "Hamar, Reflecting Mirrors (2007), Introduction"
          - "Gimello, 'Chih-yen' (1976, unpublished PhD dissertation, Harvard)"
          - "Fazang, Huayan jing tanxuan ji (T35n1736)"
          - "Chengguan, Huayan jing shu (T35n1735)"
          - "Peter Gregory, Tsung-mi and the Sinification of Buddhism (1991)"

  - id: transmission
    title: 翻译与流传
    title_en: Translation and Circulation
    icon: 📜
    topics:
      - title: 三大汉译本对照
        title_en: The Three Major Chinese Translations Compared
        body: |
          | 译本 | 译者 | 年代 | 卷/品 | 底本来源 |
          |------|------|------|--------|----------|
          | **六十华严**(晋译) | 佛陀跋陀罗(天竺) | 418-421 | 60卷/34品 | 支法领从于阗取回, 三万六千偈 |
          | **八十华严**(唐译) | 实叉难陀(于阗) | 695-699 | 80卷/39品 | 武则天遣使赴于阗求得梵本 |
          | **四十华严** | 般若(罽宾) | 796 | 40卷(仅入法界品) | 南印度乌荼国所进抄本 |
          另有东汉至唐单品别译约**三十余种**(支谦·竺法护·鸠摩罗什等)。
          藏文《华严经》(Toh44)含45品, 译自于阗本, 有2品为汉文三译完全缺失。
        sources:
          - "CBETA T09n0278(六十华严)·T10n0279(八十华严)·T10n0293(四十华严)"
          - "84000 Project: Toh44 translation"
        links:
          cbeta_60: https://cbetaonline.dila.edu.tw/zh/T09n0278
          cbeta_80: https://cbetaonline.dila.edu.tw/zh/T10n0279
          cbeta_40: https://cbetaonline.dila.edu.tw/zh/T10n0293
          toh44: https://read.84000.co/translation/toh44-31.html
        en_body: |
          | Translation | Translator | Dates | Fascicles/Chapters | Base Text |
          |------|------|------|--------|----------|
          | **Sixty-fascicle** (Jin trans.) | Buddhabhadra (India) | 418–421 | 60 fascicles/34 chapters | brought back from Khotan by Zhi Faling, 36,000 gāthās |
          | **Eighty-fascicle** (Tang trans.) | Śikṣānanda (Khotan) | 695–699 | 80 fascicles/39 chapters | Sanskrit text obtained from Khotan by Wu Zetian's envoy |
          | **Forty-fascicle** | Prajñā (Kaśmīr) | 796 | 40 fascicles (Gaṇḍavyūha only) | a manuscript presented from Oḍḍiyāna in South India |
          There were in addition some thirty-odd separate single-text translations
          from the Eastern Han through the Tang (Zhi Qian, Dharmarakṣa,
          Kumārajīva, etc.). The Tibetan *Avataṃsaka* (Toh44) comprises 45 chapters,
          translated from the Khotanese text, two of which are entirely absent from
          all three Chinese translations.

      - title: 华严经本分类(六种经本)
        title_en: The Six Kinds of Texts of the Avataṃsaka Sūtra
        body: |
          依法藏《探玄记》及澄观《华严经疏钞》, 经本共有六种:
          **恒本** — 如来恒常所说, 不可结集, 非凡夫受持
          **大本(普眼经)** — 须弥山聚笔、四大海水墨方能书写一品
          **上本** — 龙树于龙宫所见, 偈颂有十三千大千世界微尘数
          **中本** — 四十九万八千八百偈·一千二百品, 仍秘藏龙宫
          **下本** — 十万偈·三十八品(或四十八品), 龙树从龙宫带出弘传
          **略本** — 人间流传的六十卷本和八十卷本
          上·中二本因非凡夫力所能受持, 故龙树未携出龙宫。人间所传实为略本。
        sources:
          - "法藏《华严经探玄记》T35n1733"
          - "澄观《大方广佛华严经疏》T35n1735"
        en_body: |
          According to Fazang's *Tanxuanji* (Explorations of the Profundities) and
          Chengguan's *Huayan jing shu*, the sūtra has six kinds of text:
          **The Eternal Text** (*hengben*) — the Tathāgata's constant teaching, which
          cannot be collected and is not to be upheld by ordinary beings.
          **The Great Text**, the *Puyan jing* (Sarvabuddhaviṣayāvatāra) — to write a
          single chapter would require a brush of Mount Sumeru piled up and ink of the
          four great seas.
          **The Upper Text** (*shangben*) — seen by Nāgārjuna in the dragon palace,
          its gāthās numbering as many as the dust-motes of thirteen thousand great
          chiliocosms.
          **The Middle Text** (*zhongben*) — 498,800 gāthās and 1,200 chapters, still
          hidden in the dragon palace.
          **The Lower Text** (*xiaben*) — one hundred thousand gāthās and 38 (or 48)
          chapters, which Nāgārjuna brought out of the dragon palace to propagate.
          **The Abridged Text** (*lüeben*) — the sixty- and eighty-fascicle versions
          current in the human world.
          Because the upper and middle texts exceed the capacity of ordinary beings to
          uphold, Nāgārjuna did not bring them out of the dragon palace; what has been
          transmitted in the human world is in fact the abridged text.

      - title: 向东亚的传播
        title_en: Transmission to East Asia
        body: |
          **朝鲜**: 7世纪中, 新罗僧义湘入唐受学于智俨(华严二祖),
          回国后成为朝鲜华严宗初祖。
          **日本**: 8世纪中, 唐僧道睿东渡日本弘传华严, 成为日本华严宗初祖。
          东大寺为日本华严宗大本山, 大佛(卢舍那佛)即依《华严经》所造。
          12-13世纪, 明惠上人(1173-1232)中兴日本华严,
          与法然·亲鸾·道元·日莲等并列为镰仓佛教重要祖师。
        sources:
          - "镰田茂雄《朝鲜佛教史》(东京大学出版会, 1980)"
          - "镰田茂雄《中国华严思想史の研究》(东京大学出版会, 1965)"
        en_body: |
          **Korea**: in the mid-7th century the Silla monk Ŭisang entered Tang China and
          studied under Zhiyan (the second patriarch of Huayan), and after returning
          home became the founding patriarch of Korean Hwaŏm Buddhism.
          **Japan**: in the mid-8th century the Tang monk Dōshō (Daori) crossed to
          Japan to propagate Huayan, becoming the founding patriarch of Japanese
          Kegon. Tōdaiji is the head temple of the Japanese Kegon school, and its
          Great Buddha (Vairocana) was cast in accordance with the *Avataṃsaka Sūtra*.
          In the 12th–13th centuries, the monk Myōe Shōnin (1173–1232) revived Japanese
          Kegon and, together with Hōnen, Shinran, Dōgen, and Nichiren, is numbered
          among the great patriarchs of Kamakura Buddhism.

  - id: structure
    title: 结构关系与表法
    title_en: Structure and Symbolic Correspondence
    icon: 🏛
    topics:
      - title: 七处九会——空间结构
        title_en: Seven Places and Nine Assemblies — Spatial Structure
        body: |
          八十华严以**七处九会**为框架: 人间三处(菩提场·普光明殿·逝多林) +
          天上四处(忉利天·夜摩天·兜率天·他化天)。普光明殿重复三次(第二会·第七会·第八会),
          故七处共九会。九会的空间安排呈现「从地上升天·再从天回归地上」的完整弧线——
          第一会(菩提场, 地上)→ 第二会(普光明殿, 地上)→ 第三至第六会(依次上升至他化天)→
          第七·八会(回归普光明殿)→ 第九会(逝多林, 地上)。此空间弧线象征菩萨道
          从发心→升进→圆满→证入的修行轨迹。
          
          各会的**会主**(主持说法者)也各不相同:
          第一会·第七会·第八会: 佛(毗卢遮那)亲说; 第二会: 文殊师利菩萨;
          第三会: 法慧菩萨; 第四会: 功德林菩萨; 第五会: 金刚幢菩萨;
          第六会: 金刚藏菩萨; 第九会: 文殊·弥勒·普贤三位大士。
        sources:
          - "澄观《华严经疏》(T35n1735)中对七处九会的详细科判"
          - "灵隐寺《华严经的内容和结构》(2019)"
        en_body: |
          The eighty-fascicle *Avataṃsaka Sūtra* is framed by **seven places and nine
          assemblies**: three in the human realm (the Bodhi Tree site, the Universal
          Radiance Hall, and the Jeta Grove) plus four in the heavens (Trāyastriṃśa,
          Yāma, Tuṣita, and Paranirmitavaśavartin). The Universal Radiance Hall recurs
          three times (second, seventh, and eighth assemblies), so the seven places
          yield nine assemblies. The spatial arrangement of the nine assemblies forms a
          complete arc "ascending from earth to heaven, then descending from heaven back
          to earth" — the first assembly (Bodhi Tree, earth) → the second assembly
          (Universal Radiance Hall, earth) → assemblies three to six (ascending
          progressively to Paranirmitavaśavartin) → assemblies seven and eight
          (returning to the Universal Radiance Hall) → the ninth assembly (Jeta Grove,
          earth). This spatial arc symbolizes the trajectory of the bodhisattva path
          from initial aspiration → advancement → completion → realization.

          The **assembly masters** (those who preside over the teaching) also differ:
          assemblies 1, 7, and 8: the Buddha (Vairocana) teaches personally;
          assembly 2: Mañjuśrī Bodhisattva; assembly 3: Dharma-mati Bodhisattva;
          assembly 4: Guṇa-vṛkṣa Bodhisattva; assembly 5: Vajradhvaja Bodhisattva;
          assembly 6: Vajragarbha Bodhisattva; assembly 9: Mañjuśrī, Maitreya, and
          Samantabhadra.
        sources:
          - "Chengguan, Huayan jing shu (T35n1735), detailed structural analysis"
          - "Lingyin Temple, 'The Content and Structure of the Avataṃsaka Sūtra' (2019)"

      - title: 三十九品——逐品详解
        title_en: The Thirty-Nine Chapters — Detailed Chapter-by-Chapter Guide
        body: |
          八十华严39品·七处九会·五周因果的完整结构如下——

          **═══ 第一会: 菩提道场会 (卷1-11, 6品) ═══**
          说法处: 摩揭陀国阿若法菩提场(寂灭道场)
          会主: 毗卢遮那佛(释迦牟尼成道后的报身佛)
          宗旨: **所信因果[信]** — 宣说如来依正庄严, 令闻法众生生起信仰

          ① 世主妙严品(第一) [Sarva-lokendra-vyūha-naya-prabhāva]
          经文: 卷1-3 (约3卷)
          内容: 全经总序。毗卢遮那佛成道后, 佛号「普」, 以佛为会主。
          众海云集: 所有世界主(地神·水神·风神·树神·城神·山神等)皆来集会,
          各以自证境界赞佛功德。此品建立华严的宇宙观框架——无量世界·无量佛刹·
          无量众生同在一会。

          【批注·阐释】
          ·澄观《华严经疏》释此品为「令物生信」之首, 谓「佛成正觉,
            十方同见, 而云世主妙严者, 要因世主以显佛德」——佛的功德
            不由佛自说, 而由世间诸神(地神·水神等)以各自证境来赞显,
            这是「他方显自」的华严手法。澄观将此品归入「所信因果」之
            「信」位, 是全经修行地图的起点。
          ·方东美《华严宗哲学》指出此品的「众海云集」场景展示了华严
            哲学的核心特征——「一即一切, 一切即一」: 无量世界的诸神
            同在一会, 每一个个体都映照法界全体, 「个体」与「全体」
            不相妨碍。方氏称之为「法界缘起」的宇宙论宣言。
          ·海云继梦法师强调此品的「会主」是毗卢遮那佛(释迦牟尼的
            报身), 而非释迦牟尼的化身, 暗示华严经所说的是佛的「境界
            量」而非「修行量」——不是佛如何修行的过程, 而是佛证悟后
            所见的真实世界。此品是「果法门」的开端, 以佛的果德为
            修行的起点和归趣。
          ·印顺法师从历史角度指出: 此品所列的诸天·诸神体系反映了
            早期大乘佛教将印度教万神殿「收编」入佛教框架的做法,
            体现了大乘佛教「包容一切」的宗教策略。这也是华严经将
            一切众生(包括自然力量的化身)纳入佛教修行体系的早期
            表现, 为后文「一即一切」的哲学奠定了宗教基础。

          ② 如来现相品(第二) [Tathāgatotpattisaṃbhava]
          经文: 卷3-4
          内容: 毗卢遮那佛于眉间白毫放光, 光中显现无量世界·无量佛刹·无量众生·
          无量佛菩萨, 令在会大众亲见法界全体。此品          建立「佛身即法界」的核心命题。

          【批注·阐释】
          ·澄观《华严经疏》释此品核心为「佛身即法界」, 谓「如来一
            相, 一切相; 一法界, 一切法界」。佛从眉间放光, 光中含摄
            无量世界, 这不是外在的神通展示, 而是法界本体的自然显现
            ——佛身与法界无二无别, 「现相」即是「显体」。
          ·法藏《华严经探玄记》从「光明表智」的角度阐释: 眉间白毫
            表「中道之光」, 光中所现无量世界是「智照无碍」的体现,
            即佛的根本智同时照见一切法界的全体, 不是「先照此再照彼」
            的次第, 而是「一时普照」的顿照。法藏以「六相圆融」的
            框架解释此品: 一光之中含无量世界, 正是「总别同异成坏」
            的圆融无碍。
          ·方东美《华严宗哲学》将此品视为华严哲学的「认识论宣言」:
            佛以光明「现相」, 不是造作, 而是法界本身的呈现。他指出
            这里有一个深刻的哲学命题: 「显现」不等于「制造」, 佛的
            光明只是让本已存在的法界全体「被看见」, 而非「被创造」。
            这与西方哲学中「现象」与「本体」的关系形成有趣的对话。
          ·Thomas Cleary 在译注中指出, 此品的光明意象与早期印度佛教
            的「光明」(prabhā)传统一脉相承, 但在华严中被赋予了全新
            的宇宙论含义——光明不再仅是佛的功德象征, 而是法界全体
            的直接显现媒介。

          ③ 普贤三昧品(第三) [Samantabhadra-samādhi]
          经文: 卷4
          内容: 普贤菩萨入「一切诸佛毗卢遮那如来藏身」三昧, 从三昧起,
          以佛神力说一切诸佛毗卢遮那法界佛刹重重无尽之相。此品确立普贤菩萨
          作为华严「行愿」核心代表的地位。

          【批注·阐释】
          ·澄观《华严经疏》释此品核心为「三昧是行」, 谓普贤菩萨入
            三昧不是「住空」, 而是「从体起用」——入三昧是「证体」,
            从三昧起说华严法界是「起用」, 体用不二。澄观特别指出,
            此三昧名「一切诸佛毗卢遮那如来藏身」, 即以一切佛的法身
            为所缘, 这是华严行门的最高所缘境。
          ·法藏《华严经探玄记》阐释「如来藏身即法身」的深层义理:
            「如来藏」是「缠」中说(众生本具), 「法身」是「出缠」
            后说(诸佛证得), 实际上是一体之两面。普贤以此三昧为门,
            正是显示「因该果海, 果彻因源」——修行的起点(三昧)已经
            含摄了佛果的全体, 佛果不过是修行的圆满显现。
          ·海云继梦法师从修行实践的角度指出: 普贤菩萨代表「行门」,
            与文殊菩萨代表的「解门」相辅相成。此品普贤入三昧后
            「从三昧起」才说法, 说明华严的修行不是「说食数宝」的
            理论游戏, 而是必须有真实的禅定体验为基础。先入三昧
            (实修)再说法(理论), 这是华严「行解并重」的体现。
          ·Bhikshu Dharmamitra 在 2022 年译注中指出, 此品确立了
            普贤菩萨作为华严经「行愿之主」的独特地位, 其三昧的
            名称直接指向毗卢遮那佛的法身(如来藏), 暗示「行」与
            「证」的根本统一——普贤之行即是证入法身之行。

          ④ 世界成就品(第四) [Lokadhātu-samudra-nirdeśa]
          经文: 卷4-5
          内容: 普贤菩萨宣说世界海(无量世界的总体)的成立因缘——世界如何由
          众生业力·佛力·法力等因缘和合而成,           以及世界的成住坏空·无尽循环。

          【批注·阐释】
          ·澄观《华严经疏》释此品核心为「世界依业而立」, 谓「世界海
            成就, 略由三缘: 一众生业力, 二如来神力, 三法界力」。澄观
            特别强调, 华严所说的世界成立不是单一因缘(如仅由业力), 而
            是业力·佛力·法界力三者的圆融无碍。这与小乘佛教「业感缘
            起」的世界观形成鲜明对比——华严的世界是「法界缘起」的
            世界, 不是业力的被动产物。
          ·印顺法师从历史角度指出, 此品反映了大乘佛教「缘起世界观」
            的成熟形态。早期佛教以「业感缘起」解释世界, 到了华严时期
            发展为「法界缘起」, 世界不再是业力的被动承受者, 而是佛力
            ·法力·众生力共同作用的动态场域。印顺认为这是佛教世界观
            从「个体解脱」向「宇宙整体」的重大转变。
          ·海云继梦法师强调此品的「成住坏空」不是线性时间观, 而是
            「同时具足」——一切世界同时处于不同的成住坏空阶段, 没有
            「开始」和「结束」, 只有法界的恒常显现。这为后文华藏世界
            的「无尽重重」结构提供了宇宙论基础。

          ⑤ 华藏世界品(第五) [Kusumatala-vyūhālaṃkāra-lokadhātu]
          经文: 卷5-6 (约2卷)
          内容: 详细描述毗卢遮那佛的净土「华藏庄严世界海」——二十重世界层层叠绕,
          每一世界有微尘数佛刹围绕; 最底层为风轮所持, 风轮之上有香水海·
          香水河·世界种·世界等重重无尽的结构。此品是华严宇宙观最核心的描述。
          (藏译本将此品分为5章, 反映更古老的品目划分方式。)

          【批注·阐释】
          ·澄观《华严经疏》释此品为「华藏是报土」, 即毗卢遮那佛的
            实报庄严土。澄观以「六相」分析华藏世界的结构: 风轮为「总」,
            香水海·世界种·世界等为「别」; 二十重世界为「同」, 各世界
            差别为「异」; 重重无尽为「成」, 各各住持为「坏」。华藏世界
            不是「一个」世界, 而是「一切世界」的同时呈现——「一尘中
            一切刹, 一切刹中一切尘」。
          ·方东美《华严宗哲学》将华藏世界的二十重结构解读为「无穷
            嵌套宇宙观」: 每一重世界之中又含无量世界, 世界之中有世界,
            层层无尽。方氏指出, 这比康德的「崇高」(sublime)概念更为
            彻底——康德的崇高仍是「有限心智面对无限」的主观体验,
            而华严的无穷嵌套是「无限在有限中完整呈现」的客观实在。
            这是华严哲学对「有限与无限」关系的独创性解答。
          ·印顺法师对此品持谨慎态度, 认为其中的宇宙结构描述
            (二十重世界·风轮·香水海等)融合了印度古代宇宙论
            (如《往世书》Purāṇa 的宇宙图式)与大乘佛教的宗教想象。
            印顺指出, 华严的宇宙观既是宗教象征(表佛法的重重无尽),
            也包含哲学意涵(表缘起性空的无限展开), 不宜简单视为
            「神话」或「事实」。
          ·Thomas Cleary 在译注中指出, 华藏世界的结构描述在文学上
            是一种「宇宙曼荼罗」(cosmic maṇḍala), 其功能不仅是描绘
            宇宙图景, 更是为修行者提供观想的对象——通过观想华藏世界
            的重重无尽, 修行者可以突破「一多对立」的思维局限, 证入
            「一即一切」的华严境界。

          ⑥ 毗卢遮那品(第六) [Vairocana]
          经文: 卷6-11 (约5卷)
          内容: 追述毗卢遮那佛在无量劫前的因地修行——从最初发心·修行六度·
          度化众生·圆满佛果的完整过程。此品说明「佛果」非一蹴而就, 而是
          无量劫修行的累积。

          【批注·阐释】
          ·澄观《华严经疏》释此品为「追因显果」——此品追溯毗卢遮那
            佛的因地修行, 目的不在「讲故事」, 而在显明「佛果非偶然」。
            澄观指出, 此品所叙的「发心·修行·度生·成佛」四段结构,
            正是华严「五周因果」中「所信因果」的「因」——前五品说「果」
            (佛的庄严功德), 此品追「因」(佛如何修行至此), 因果圆满
            方成「信」。
          ·法藏《华严经探玄记》从「因行感果」的角度阐释: 此品是
            华严「因陀罗网」思想的叙事体现——毗卢遮那佛的每一劫
            修行都与其他佛的修行互相映照, 没有「孤立的因」, 也没有
            「独立的果」。法藏指出, 此品用五卷的篇幅追溯因地, 正是
            要说明「佛佛道同」——一切佛的修行路径本质上是同一的,
            只是因缘显现不同。
          ·印顺法师认为此品的「因地」叙事具有重要的历史意义:
            它将毗卢遮那佛从「宇宙论的最高佛」还原为「修行成就的
            佛」, 强调佛果是修因所感, 不是本自具足。印顺指出,
            这反映了大乘佛教「佛果可证」的核心信念——如果佛果是
            本有的, 则修行无意义; 正因为佛果是因行所感, 所以一切
            众生皆有成佛的可能。

          **═══ 第二会: 普光明殿会 (卷12-15, 6品) ═══**
          说法处: 摩揭陀国普光明殿(寂灭道场附近)
          会主: 文殊师利菩萨
          宗旨: **差别因果[解]** — 说十信法门, 令已生信者深入理解

          ⑦ 如来名号品(第七) [Tathāgata-nāma]
          内容: 如来以无量名号度化众生——于一世界中, 佛以一名说一切法;
          于一切世界中, 佛以一切名说一切法。此品建立「一即一切」的名号观。

          【批注·阐释】
          ·澄观《华严经疏》释此品为「一即一切」的名号观, 谓「佛以一
            名说一切法, 以一切名说一法, 名即法界, 法界即名」。澄观指出,
            此品的深层义理是「名即非名」——佛的名号不是「标签」, 而是
            法界的直接显现。一名中含一切名, 一切名归于一名, 这是华严
            「圆融」思想在「名言」层面的展现。
          ·法藏《华严经探玄记》阐释「名号即法门」: 佛的每一个名号
            (如「毗卢遮那」=光明遍照、「阿弥陀」=无量光)都不是
            空洞的称号, 而是一套完整的修行法门。法藏将此与「六度万行」
            联系: 佛的名号是「果德」的凝缩, 也是「因行」的导引——
            念佛名即是入佛法门, 这为后世净土宗的「名号信仰」提供了
            华严学的理论基础。
          ·Bhikshu Dharmamitra 在 2022 年译注中指出, 此品在结构上
            是第二会(十信法门)的开端, 由文殊菩萨主持, 以「名号」
            为切入点引导信众进入佛法——名号是最直接的「信」之门径,
            不需高深理论, 只需一念信受。

          ⑧ 四圣谛品(第八) [Catvāri-ārya-satyāni]
          内容: 以华严的立场重新阐释苦·集·灭·道四圣谛——
          不同世界的四谛有不同的名称·不同的内容, 却同归一理。
          此品展示华严「同异无碍」的思想特色。

          【批注·阐释】
          ·澄观《华严经疏》释此品核心为「同异无碍」: 四圣谛在不同
            世界有不同的名称(如「苦」在某世界名「逼迫」, 在另一世界
            名「流出」), 内容也随众生根机不同而有差异, 但「同归一理」
            ——苦·集·灭·道的本质在一切世界是同一的。澄观指出, 这
            正是华严「六相」中「同异圆融」的具体展现: 名相「异」而
            理体「同」, 同时并存而不相妨碍。
          ·印顺法师从历史角度指出, 此品是华严经「对声闻教的吸收
            与超越」的典型案例: 四圣谛是声闻乘(小乘)的核心教义,
            华严经没有否定它, 而是将其「提升」到法界的层面——四谛
            不只是个人解脱的教法, 而是整个法界的运作法则。印顺认为
            这体现了大乘佛教「回小向大」的判教策略。
          ·方东美《华严宗哲学》从比较哲学的角度指出, 此品的「同异
            无碍」思想与黑格尔的「具体的普遍性」(concrete universality)
            有相似之处: 四谛是「普遍性」(一切世界同), 名称内容是
            「特殊性」(各世界异), 华严的「同异无碍」正是将普遍与
            特殊统一于法界全体, 而不是让一方消融另一方。

          ⑨ 光明觉品(第九) [Prabhāsvara]
          内容: 毗卢遮那佛放光, 光中显现十方世界的一切佛刹·一切佛·一切菩萨·
          一切众生, 令在会大众了知「佛光所照, 即法界全体」。

          【批注·阐释】
          ·澄观《华严经疏》释此品为「光表智照」: 佛的光明不是外在
            的「照明」, 而是「智慧」(般若)的直接显现。光中所现的
            一切世界·一切佛·一切众生, 正是「佛智」所照的全部对象
            ——佛的智慧不是「选择性」的(照此不照彼), 而是「普遍性」
            的(一时普照法界全体)。澄观将此品与第二品「如来现相品」
            对照: 第二品是「佛身放光」(从体起用), 此品是「光中见法」
            (用中显体), 两者互为表里。
          ·方东美《华严宗哲学》将此品的光明意象解读为「佛光即法界
            全体」: 光不是「从佛发出」的, 而是「法界本身就是光」。
            佛的放光只是让法界本来的光明「被觉知」。方氏指出, 这里
            有一个深刻的哲学洞见: 「觉悟」不是获得新的东西, 而是「醒
            来」——本来就在光明中, 只是之前「不觉」而已。这与禅宗
            「本来面目」的思想一脉相承。
          ·海云继梦法师从修行实践的角度指出, 此品的「光明觉」不是
            「看到光」的神通体验, 而是「智慧的觉醒」——在日常生活中
            了知一切境界都是法界的显现, 没有什么「不是佛光所照」的
            地方。这是「理」的层面的觉醒, 为后文「事」的层面的修行
            (净行品的日常修行)做准备。

          ⑩ 菩萨问明品(第十) [Bodhisattva-paripṛcchā]
          内容: 文殊菩萨与觉首·财首·宝首·德首·目首·精进首·法首·智首·贤首等
          九首菩萨互相问答, 讨论「心·佛·众生」的关系, 以及「法性·缘起·性空」
          的核心义理。

          【批注·阐释】
          ·澄观《华严经疏》释此品核心为「心佛众生三无差别」: 文殊
            菩萨与九首菩萨的问答, 并非「一方教、一方学」的单向传授,
            而是「互相激荡·互相发明」的平等对话。澄观指出, 「问明」
            之「明」即是「般若智慧」——通过问答来「显明」心·佛·众生
            三者的无差别性。十位菩萨各从不同角度切入, 最终汇归同一
            法界, 正是「殊途同归」的华严精神。
          ·法藏《华严经探玄记》从「问答显深义」的角度阐释: 此品的
            问答结构不是「辩论」(争胜), 而是「教学法」(显理)。法藏
            将十位菩萨的问答对应「十信」的十个层面——每一问答都是
            对信心的一次深化。特别值得注意的是, 文殊菩萨作为「问主」
            (发起者), 并不给出「标准答案», 而是引导每位菩萨各自
            说出自己证悟的境界, 这体现了华严「一切法门无尽」的思想。
          ·Hisamatsu Shin'ichi(细川修)指出, 此品的问答模式反映了
            早期印度佛教「论议」(vāda)传统的转化: 原本用于辩论的
            问答形式, 在华严中被转化为「圆融无碍」的智慧交流, 没有
           「胜负」, 只有「互照」。这是佛教从「论辩文化」向「圆融
            文化」转型的标志性文本。

          ⑪ 净行品(第十一) [Gocara-pariśuddhi]
          内容: 文殊菩萨教导智首菩萨「一百四十大愿」——从日常生活的每一个细节
          (穿衣·吃饭·行路·睡眠...)发起大愿, 将一切境界转为修行。
          此品是华严「生活即修行」的核心经典, 也是华严经中最广为流通的品目之一。

          【批注·阐释】
          ·澄观《华严经疏》释此品为「一切皆可发愿」: 一百四十大愿
            覆盖了从晨起至入睡的一切生活细节——「见大楼阁, 愿一切
            众生住佛菩提」、「见桥梁, 愿一切众生为众作桥」。澄观指出,
            此品的关键不在于「愿的内容」(每一愿的具体对象), 而在于
            「愿的精神」——将一切境界(不论顺逆·善恶·美丑)都转化为
            修行的资粮。这是「转识成智」在日常生活中的具体操作。
          ·海云继梦法师强调此品的核心是「生活即修行」: 一百四十愿
            不是「发了就忘」的仪式, 而是「每一个当下都提醒自己」的
            修行方法。海云法师指出, 此品的修行不需要出家·不需要坐禅
            ·不需要特殊的修行场所——穿衣吃饭·行路睡觉, 每一个动作
            都可以是修行。这是华严经「不离世间觉」的最直接体现。
          ·方东美《华严宗哲学》将此品视为华严「实践哲学」的典范:
            方氏指出, 华严的哲学不是「空谈」, 而是有具体的「行法」
            。净行品将前几品的宇宙观(华藏世界)·认识论(光明觉)
            ·本体论(心佛无差)落实为「生活中的具体操作」, 证明华严
            是「知行合一」的完整体系。方氏称之为「从形而上学到
            日常生活的桥梁」。
          ·Thomas Cleary 在译注中指出, 此品在东亚佛教中影响极为
            深远, 几乎所有宗派(禅·净·律·天台·华严)都引用此品
            作为「日常修行」的经典依据, 其「一切境界皆可发愿」的
            精神已深深融入中国佛教的修行传统中。

          ⑫ 贤首品(第十二) [Bhadraśrī]
          内容: 贤首菩萨以自己证入的境界, 说「十信」法门的功德与行相,
          以及「心佛众生三无差别」的道理。此品为十信法门的总结。

          【批注·阐释】
          ·澄观《华严经疏》释此品为「十信总结」: 贤首菩萨以「自证
            境界」来总结前五品(⑦-⑪)所宣说的十信法门。澄观指出,
            贤首菩萨的名字本身即有意义——「贤」为「初发心」之贤,
            「首」为「诸信」之首, 此菩萨代表「信位」的圆满。澄观将
            此品的功能归纳为「结前生后」: 总结第一·二会的「信·解」,
            为第三会以降的「十住·十行·十回向·十地」铺路。
          ·法藏《华严经探玄记》阐释「贤首即初发心」: 贤首菩萨所证
            的境界, 正是「初发心时便成正觉」(《华严经》名句)的具体
            展现。法藏指出, 「信」不是「信仰」(盲目相信), 而是「信
            心」(对法界的如实认知与接受)。十信的圆满, 不在于「信了
            多少」, 而在于「信到什么深度」——从「浅信」(信有佛)
            到「深信」(信自己即是佛), 这是一个从「他力」到「自力」
            的转化过程。
          ·海云继梦法师从修行实践的角度指出, 此品是「信位的圆满」
            ——十信虽然在五位(十住·十行·十回向·十地·等觉妙觉)
            中排在最前面, 但海云法师强调「信」不是初学者的专利,
            而是贯穿整个修行过程的基础。即使到了等觉·妙觉的最高
            位, 仍然需要「信」——信法界·信众生·信自己。此品以
            贤首菩萨的自证境界来总结信位, 正是显示「信」的深广
            无尽。
          ·木村清孝指出, 贤首品在华严思想史上具有特殊地位: 华严
            宗的第三祖法藏(643-712)被尊称为「贤首大师」(Hyeansū/
            Xianshou), 即以此品命名。这暗示法藏自认是「信位」的
            修行者, 以「贤首」为志——不以高深自居, 而以「初发心」
            自励, 这体现了华严宗「从信起修」的根本精神。

          **═══ 第三会: 忉利天宫会 (卷16-18, 6品) ═══**
          说法处: 忉利天宫(三十三天)
          会主: 法慧菩萨
          宗旨: **差别因果[解]** — 说十住法门

          ⑬ 升忉利天宫品(第十三)
          内容: 佛以神力升忉利天宫, 天王以无量供养迎接。
          此品与以下⑭品为各会共有的「升天·偈赞」仪式性品目。

          版本对照: 八十华严第13品 | 六十华严第8品「忉利天宫品」 | 藏译第14品

          【批注·阐释】
          ·澄观《华严经疏》释此品为「仪式性品目·表修行升进」: 佛升天宫
            不是「物理空间的移动」, 而是「心位上升」的表法——从地上的
            菩提场(象征「凡夫位」)上升到忉利天(象征「初住位」), 表示
            修行者从信位进入住位的阶位跃升。澄观将「升天」解读为「心
            升」而非「身升」, 这是华严「表法」传统的典型体现。
          ·法藏《华严经探玄记》阐释「升天表心位上升」: 天王以供养迎接,
            象征「诸法善根」对修行者的「接引」——修行者进入新的阶位时,
            前此所修的一切善根自然现前, 成为新阶位的资粮。法藏指出,
            升天品虽看似「仪式性过渡」, 实则是「因果相续」的结构性
            需要——每一会的升天都标志着修行从「已证」向「未证」的
            推进。
          ·印顺法师从佛教仪式学的角度指出, 此品的「升天」结构反映了
            早期大乘佛教「天宫说法」的文学传统——佛在天宫说法, 暗示
            佛法超越人间的局限, 具有宇宙性的普遍意义。印顺认为这种
            「升天」叙事也与印度婆罗门教「天启」传统形成对话, 但
            佛教将其转化为「修行阶位」的象征体系。

          ⑭ 忉利天宫偈赞品(第十四)
          内容: 诸菩萨以偈颂赞叹佛功德, 回向众生。

          版本对照: 八十华严第14品 | 六十华严第9品「忉利天宫偈赞品」 | 藏译第15品

          【批注·阐释】
          ·澄观《华严经疏》释此品与升天品同为「仪式性品目」: 偈赞品的
            功能是「以赞显德」——诸菩萨以偈颂赞叹佛的功德, 不是「阿谀」,
            而是以文学形式「凝缩」佛的无量功德。澄观指出, 偈颂在印度
            佛教中具有「修行」的功能(如马鸣的《佛所行赞》), 此品的
            偈赞同样是「赞即是修」。
          ·法藏《华严经探玄记》指出, 此品的偈赞具有「回向」的功能——
            赞叹佛功德的目的是「回向众生」, 令未闻法者得闻, 令已闻者
            增长。法藏将此品的偈赞结构对应「十回向」中的「随顺等观
            一切众生回向」: 赞佛即是利益众生, 二者不二。
          ·海云继梦法师从修行实践的角度强调, 此品的偈赞不是「文人
            作诗」, 而是「以声说法」——偈颂的音韵·节奏·义理三者
            圆融, 本身就是一种修行法门。修行者诵持偈赞, 既是「口业
            清净」, 也是「意业专注」, 还是「身业礼拜」, 三业同时
            修行。

          ⑮ 十住品(第十五) [Daśa-vyavasthāna]
          内容: 法慧菩萨宣说菩萨「十住」法门——
          发心住·治地住·修行住·生贵住·方便具足住·正心住·不退住·童真住·法王子住·灌顶住。
          十住是菩萨道「位不退」的基础——入住后不再退转凡夫。

          版本对照: 八十华严第15品 | 六十华严第10品「十住品」 | 藏译第16品

          【批注·阐释】
          ·澄观《华严经疏》释「十住是道不退之基」: 澄观指出, 「住」的
            梵文 vyavasthāna 含「安立」之义, 十住是菩萨「安立于佛法」
            的十个层面。其中「发心住」是入门, 「灌顶住」是此位的圆满
            ——从「初发心」到「受灌顶」, 标志着菩萨在「信心」的基础上
            建立了不可动摇的修行根基。澄观特别强调「不退」(avaivartika)
            是十住的核心功能: 入住后, 即使遭遇逆缘也不会退转为凡夫
            (位不退), 这是区别于十信的关键(十信尚有退转的可能)。
          ·法藏《华严经探玄记》阐释「发心住为万行之首」: 法藏将「发心
            住」视为十住之首, 不仅因为它是第一住, 更因为它「总含一切
            住」——如同大地(治地住), 一切建筑皆依地而立, 发心住的
            「初发心」含摄了后九住的全部功德。法藏以「一即一切」的
            框架解释: 一住即十住, 十住即一住, 圆融无碍。
          ·印顺法师从比较学的角度讨论「十住与声闻戒的比较」: 印顺指出,
            十住的「发心住」与声闻乘的「受戒」有结构上的相似性——都
            标志着从「在家人」到「修行者」的身份转变。但十住的核心是
            「发菩提心」(为一切众生而成佛), 而声闻戒的核心是「出离心」
            (为自己解脱生死), 两者的「动机」根本不同。印顺认为, 这
            是大乘佛教「回小向大」的教理基础在修行阶位上的具体体现。

          ⑯ 梵行品(第十六) [Brahmacarya]
          内容: 法慧菩萨说「一切菩萨梵行」——
          涵盖身·口·意三业的清净修行, 强调「无所得」的空慧为梵行的根本。

          版本对照: 八十华严第16品 | 六十华严第11品「梵行品」 | 藏译第17品

          【批注·阐释】
          ·澄观《华严经疏》释「无所得为梵行之本」: 澄观指出, 「梵行」
            (brahmacarya) 原义为「清净行」, 但华严赋予它全新的含义
            ——不是「持戒清净」的梵行, 而是「以无所得为方便」的梵行。
            澄观强调, 「无所得」不是「什么都不做」, 而是「做了不执著」
            ——身·口·意三业的修行是「有的」(积极行善), 但对修行的
            「成果」是「无所得」的(不执著功德)。这种「无所得」的
            梵行, 正是「般若」(prajñā) 在日常修行中的具体运用。
          ·海云继梦法师强调此品是「日常修行的总纲」: 海云法师指出,
            梵行品虽在十住品之后, 但在修行实践中是「随时可用」的
            方法论——不管你在哪个阶位, 身·口·意的清净修行都是基础。
            海云法师将此品与净行品(第11品)对照: 净行品重在「发愿」
            (以愿力转化境界), 梵行品重在「无所得」(以空慧超越执著),
            两者相辅相成, 共同构成华严「生活修行」的两大支柱。
          ·印顺法师从戒律学的角度指出, 此品的「梵行」涵盖了菩萨戒的
            核心精神——不仅「止恶」(摄律仪戒), 更「行善」(摄善法戒)
            ·「利生」(饶益有情戒)。印顺认为, 华严将「梵行」从声闻
            戒的「个人清净」扩展为「法界清净」, 是大乘戒学的重大
            发展。

          ⑰ 初发心功德品(第十七)
          内容: 法慧菩萨说菩萨初发心时的功德——
          以初发心的功德与二乘·外道·梵天王等的功德比较, 显示初发心的殊胜无比。

          版本对照: 八十华严第17品 | 六十华严第12品「初发心功德品」 | 藏译第18品

          【批注·阐释】
          ·澄观《华严经疏》释「初发心即摄一切佛法」: 澄观指出, 此品
            的核心命题是「初发阿耨多罗三藐三菩提心, 即摄一切佛法」
            ——初发心不是「开始学佛」, 而是「已经含摄了佛果的全体」。
            澄观以「因果同时」来解释: 初发心的「因」与佛果的「果」
            在法界中是「同时具足」的, 不是「先因后果」的线性关系。
            这与华严「因该果海, 果彻因源」的核心思想完全一致。
          ·方东美《华严宗哲学》将此品解读为「有限中见无限」: 方氏
            指出, 初发心是「有限」的(一个众生的一念发心), 但它所
            含摄的功德是「无限」的(一切佛法)。方氏认为这是华严
            哲学最深刻的命题之一: 无限不是在有限「之外」, 而是在
            有限「之中」——一念发心即是法界全体的显现。方氏将此与
            莱布尼茨的「单子论」(monadology) 做比较: 每一个「单子」
            (初发心) 都映照整个宇宙(一切佛法), 但华严比莱布尼茨
            更彻底——单子之间不是「预定和谐」, 而是「即一即一切」
            的无碍圆融。
          ·海云继梦法师从修行者的角度强调, 此品的「功德比较」不是
            「竞争」, 而是「定位」——让修行者知道自己初发心的位置
            在整个佛法体系中有多殊胜。海云法师指出, 很多修行者「妄
            自菲薄」, 觉得自己是凡夫、功德很少; 此品的目的是让
            修行者「知道自己有多了不起」——一念发心即超越二乘·外道
            ·梵天王的全部功德, 这不是「自大」, 而是「如实了知」。

          ⑱ 明法品(第十八) [Dharmāloka]
          内容: 法慧菩萨说「十住」法门的具体修学方法与次第,
          以及入住后如何增进·不退。

          版本对照: 八十华严第18品 | 六十华严第13品「明法品」 | 藏译第19品

          【批注·阐释】
          ·澄观《华严经疏》释此品为「十住的修学次第」: 澄观指出, 前品
            (十住品)说「十住是什么」(体), 此品说「如何修十住」(用)。
            「明法」之「明」是「智慧」(prajñā), 「法」是「修行方法」
            (dharma), 此品以智慧来阐明修行方法, 为修行者提供从「知」
            到「行」的桥梁。澄观特别强调, 此品的「次第」不是「线性
            递进」, 而是「圆融次第」——每一住的修学都含摄其他九住
            的功德。
          ·法藏《华严经探玄记》阐释「入住增进之法」: 法藏将此品的
            修学方法归纳为「三要」: 一「解」(理解十住的义理), 二「行」
            (实际修行十住的法门), 三「证」(亲证十住的境界)。法藏指出,
            此品特别强调「增进」与「不退」两个方面: 「增进」是「向前
            走」(从初住向满住推进), 「不退」是「不后退」(已得的功德
            不丧失)。两者缺一不可——只有增进而不退, 才是真正的
            「住」。
          ·印顺法师从修行心理学的角度分析, 此品的「明法」具有「对治」
            的功能——每一住的修行方法都是针对该位修行者可能遇到的
            「障难」而设计的。印顺指出, 华严的修行阶位不是「空洞的
            理论框架」, 而是「实修的操作手册」, 每一阶位都有具体的
            「对治法门」, 这体现了华严「解行并重」的传统。

          **═══ 第四会: 夜摩天宫会 (卷19-21, 4品) ═══**
          说法处: 夜摩天宫(忉利天之上)
          会主: 功德林菩萨
          宗旨: **差别因果[解]** — 说十行法门

          ⑲ 升夜摩天宫品(第十九)
          内容: 佛升夜摩天宫, 天王迎接供养。

          版本对照: 八十华严第19品 | 六十华严第14品「夜摩天宫品」 | 藏译第20品

          【批注·阐释】
          ·澄观《华严经疏》释此品与升忉利天宫品同为「仪式性品目·表修行
            升进」: 从忉利天(第三会·十住)上升到夜摩天(第四会·十行),
            象征修行从「自利」(十住的「位不退」)向「利他」(十行的
            「利他行」)的跃升。澄观指出, 夜摩天在欲界中位于忉利天
            之上, 表示「利他」比「自利」更「高」——这不是价值判断,
            而是修行的自然升进。
          ·法藏《华严经探玄记》阐释「升天表心位上升」: 法藏强调, 每一次
            升天都标志着「心量」的扩大——忉利天的「心量」是「自利」,
            夜摩天的「心量」是「利他」, 兜率天的「心量」是「回向」,
            他化自在天的「心量」是「证入」。升天不是「到达新的地方」,
            而是「打开新的维度」。
          ·海云继梦法师从修行实践的角度指出, 此品的「升天」对修行者
            的启示是: 当你从「自我修行」转向「利益众生」时, 你的
            「世界」也随之扩大——就像从忉利天上升到夜摩天, 所见的
            「境界」更加广阔。

          ⑳ 夜摩天宫偈赞品(第二十)
          内容: 诸菩萨以偈颂赞佛。

          版本对照: 八十华严第20品 | 六十华严第15品「夜摩天宫偈赞品」 | 藏译第21品

          【批注·阐释】
          ·澄观《华严经疏》释此品同⑭: 偈赞品在每一会中都有出现,
            但每一次偈赞的内容随「会主」和「宗旨」的不同而有所变化。
            此品由功德林菩萨主持(第三会为法慧菩萨), 偈赞的内容从
            「十住」的「自利」转向「十行」的「利他」, 体现了「偈赞
            随位而异」的灵活性。
          ·法藏《华严经探玄记》指出, 此品的偈赞具有「承上启下」的
            功能——总结第三会的十住功德, 开启第四会的十行法门。法藏
            将此品的偈赞结构对应「十行」中的「欢喜行」: 以赞叹佛
            功德为「欢喜」的表达, 修行者因赞佛而生「法喜」, 因法喜
            而起「利他」之行。
          ·印顺法师从文学角度指出, 此品的偈赞在文学品质上与⑭品
            (忉利天宫偈赞品) 有所不同: ⑭品的偈赞侧重「信」的
            表达(对佛功德的信仰), 此品的偈赞侧重「行」的表达
            (以修行来赞佛)。印顺认为, 这种变化反映了华严经「会会
            有新意」的叙事策略——即使结构相同(升天·偈赞), 内容
            也在不断深化。

          ㉑ 十行品(第二十一) [Daśa-caryā]
          内容: 功德林菩萨宣说菩萨「十行」法门——
          欢喜行·饶益行·无瞋恨行·无尽行·离痴乱行·善现行·无着行·善法行·真实行·入法界行。
          十行是菩萨道「利他行」的展开——从自利转向广度众生。

          版本对照: 八十华严第21品 | 六十华严第16品「十行品」 | 藏译第22品

          【批注·阐释】
          ·澄观《华严经疏》释「十行是利他行的展开」: 澄观指出, 十住
            重在「自利」(成就自身的修行), 十行重在「利他」(将修行
            的成果利益众生)。澄观将十行的结构解读为「从内到外」的
            展开: 「欢喜行」是「内在的法喜」→「饶益行」是「外在的
            利益」→……→「入法界行」是「自他不二」的圆满。澄观特别
            强调, 十行不是「做完十件事」, 而是「十种利他的方式」,
            同时并存、互相含摄。
          ·印顺法师讨论「从自利到利他的转折」: 印顺指出, 十住→十行
            的转折是华严修行体系中最关键的「枢纽」之一。印顺认为,
            十住的「不退」是「守住阵地」, 十行的「利他」是「向外
            扩展」——修行者在「位不退」的基础上, 将修行的成果「回馈」
            给一切众生。印顺将此与声闻乘对比: 声闻乘的修行到「阿罗汉」
            即止(自利圆满), 不再有「利他」的后续; 大乘的十行则将
            修行「永不终止」地延续下去, 因为「众生无尽」。
          ·海云继梦法师从修行者的角度指出, 十行的修行对现代人特别
            有启发: 「欢喜行」提醒修行者「修行是快乐的」(不是苦行),
            「饶益行」提醒修行者「修行是为了利益他人」(不是自私),
            「无尽行」提醒修行者「修行没有终点」(不是「修完了就
            放下」)。海云法师认为, 十行是华严「入世修行」的最佳
            操作指南。

          ㉒ 十无尽藏品(第二十二) [Daśa-akṣaya]
          内容: 功德林菩萨说「十无尽藏」——
          信藏·戒藏·惭藏·愧藏·闻藏·施藏·慧藏·念藏·持藏·辩藏。
          此十藏是菩萨修行的「储备库」, 令功德无尽。

          版本对照: 八十华严第22品 | 六十华严第17品「十无尽藏品」 | 藏译第23品

          【批注·阐释】
          ·澄观《华严经疏》释「十藏是功德储备」: 澄观指出, 「藏」
            (akṣaya, 无尽) 的含义是「取之不尽·用之不竭」——菩萨修行
            的功德不是「消耗品」(用完就没了), 而是「储备库」(越用
            越多)。澄观将十藏的结构解读为「从信到辩」的完整系统:
            「信藏」是「入门」(信心是所有功德的根基), 「辩藏」是
            「出口」(以辩才将佛法传扬), 中间八藏是从「内修」到
            「外用」的完整链条。
          ·法藏《华严经探玄记》阐释「信为首·辩为末」: 法藏强调, 十藏
            的排列不是随意的——「信」为首, 因为一切功德从「信」而生;
            「辩」为末, 因为一切功德以「辩才」(弘法能力)为最终的
            运用。法藏特别指出, 「惭」与「愧」两藏在十藏中并列,
            这是华严对「道德心理学」的独特贡献: 「惭」是「对内的
            自我反省」(知道自己做得不够), 「愧」是「对外的社会
            责任」(知道对不起他人)。两者共同构成「道德自觉」的
            双引擎。
          ·印顺法师从修行实践的角度指出, 此品的「十无尽藏」是菩萨
            「六度万行」的进一步展开——六度(布施·持戒·忍辱·精进·
            禅定·般若)是「修行的六个维度」, 十藏是「修行的十个
            储备库」。印顺认为, 十藏的意义在于「可持续性」: 菩萨
            的修行不是「冲刺」(短时间的猛烈修行), 而是「马拉松」
            (无量劫的持续修行), 需要「储备库」来支撑。

          **═══ 第五会: 兜率天宫会 (卷22-33, 3品) ═══**
          说法处: 兜率天宫(夜摩天之上)
          会主: 金刚幢菩萨
          宗旨: **差别因果[解]** — 说十回向法门

          ㉓ 升兜率天宫品(第二十三)
          内容: 佛升兜率天宫, 天王迎接供养。

          版本对照: 八十华严第23品 | 六十华严第18品「兜率天宫品」 | 藏译第24品

          【批注·阐释】
          ·澄观《华严经疏》释此品同⑬⑲: 从夜摩天(第四会·十行)上升到
            兜率天(第五会·十回向), 象征修行从「利他行」(十行)向
            「回向」(统合自利利他)的跃升。澄观指出, 兜率天在佛教
            传统中是「弥勒菩萨」的居处, 弥勒是「未来佛」, 暗示「回向」
            是「面向未来」的修行——将所修功德回向给未来的众生和佛道,
            不是「停留在当下」。
          ·法藏《华严经探玄记》阐释「升天表心位上升」: 法藏强调, 兜率天
            的「心量」比夜摩天更广——十行的「利他」仍是「我在利益你」
            (有「能利」与「所利」的分别), 十回向的「回向」则是「自他
            不二」(能回向者与所回向者同在法界中)。法藏将此解读为
            「从二元到无二」的跃升。
          ·海云继梦法师从修行实践的角度指出, 兜率天的「兜率」
            (Tuṣita) 梵文意为「知足」, 暗示十回向的修行需要「知足」
            的心态——不执著于「我修了多少功德」, 而是将所有功德
            「回向」出去, 如此才能「知足常乐」。

          ㉔ 兜率天宫偈赞品(第二十四)
          内容: 诸菩萨以偈颂赞佛。

          版本对照: 八十华严第24品 | 六十华严第19品「兜率天宫偈赞品」 | 藏译第25品

          【批注·阐释】
          ·澄观《华严经疏》释此品同⑭⑳: 此品由金刚幢菩萨主持(第五会),
            偈赞的内容从「十行」的「利他」转向「十回向」的「回向」。
            澄观指出, 金刚幢菩萨的名号「金刚幢」象征「坚固不动」
            ——回向的心必须如金刚般坚固, 不为外境所动, 不为烦恼
            所摧。
          ·法藏《华严经探玄记》指出, 此品的偈赞具有「总摄」的功能
            ——将第三会(十住)·第四会(十行)的功德「总摄」为「回向」
            的资粮。法藏将偈赞的结构对应「十回向」中的「等一切佛
            回向」: 赞佛功德即是「向佛看齐」, 以佛为标准来「回向」
            自己的修行。
          ·印顺法师从佛教思想史的角度指出, 「回向」(pariṇāmanā)
            的概念在早期佛教中已有(如「回向功德」), 但华严将它
            发展为一个独立的「修行阶位」(十回向), 这是大乘佛教
            「修行体系化」的重要标志。印顺认为, 十回向的设置使得
            修行从「个别的善行」提升为「系统性的功德积累」。

          ㉕ 十回向品(第二十五) [Daśa-pariṇāmanā] (卷22-33, 约12卷)
          内容: 金刚幢菩萨宣说菩萨「十回向」法门——
          救护一切众生离众生相回向·不坏回向·等一切佛回向·至一切处回向·
          无尽功德藏回向·随顺平等善根回向·随顺等观一切众生回向·真如相回向·
          无缚解脱回向·入法界无量回向。
          **此品是八十华严中篇幅最大的一品(约12卷)**, 阐述菩萨如何将所修一切善根
          回向众生·回向佛道·回向实际(真如), 以「少善根引无量果」, 实现悲智双运。
          十住·十行偏于自利, 十回向则统合自利利他, 为进入十地做准备。

          版本对照: 八十华严第25品 | 六十华严第20品「十回向品」 | 藏译第26品

          【批注·阐释】
          ·澄观《华严经疏》释「此品最广·约12卷·悲智双运」: 澄观指出,
            十回向品是八十华严39品中篇幅最大的(约12卷), 这不是
            「偶然」, 而是因为「回向」是修行中最「复杂」的环节——
            回向需要「悲」(为众生而回向)与「智」(了知回向者·所回向
            ·回向处三者皆空)的双运, 缺一不可。澄观将十回向的结构
            解读为「从有相到无相」的递进: 前五回向偏「有相」(有具体
            的回向对象), 后五回向偏「无相」(回向于真如·法界)。
          ·方东美《华严宗哲学》将此品解读为「回向即法界交融」: 方氏
            指出, 「回向」的本质是「将个体的功德融入法界全体」——
            不是「把我的功德给你」(那仍是二元的), 而是「我的功德
            本来就是法界全体的一部分, 回向只是让它「回归」本来的
            位置」。方氏将此与华严的核心命题「一即一切, 一切即一」
            联系: 回向是「一即一切」在修行层面的具体操作。
          ·印顺法师讨论「回向与菩提心的关系」: 印顺指出, 回向的
            「动力」来自菩提心(为一切众生而成佛的誓愿), 没有菩提心
            的回向只是「口头上的」, 没有实质力量。印顺将十回向与
            「三十七道品」中的「四正勤」做比较: 四正勤是「断恶修善」
            的个人修行, 十回向是「断恶修善」的法界化——将个人的
            「断恶修善」扩展为「为一切众生断恶修善」。印顺认为,
            这是大乘佛教从「自利」到「利他」的最完整表达。

          **═══ 第六会: 他化自在天宫会 (卷34-39, 1品) ═══**
          说法处: 他化自在天宫(六欲天之最高处)
          会主: 金刚藏菩萨
          宗旨: **差别因果[解]** — 说十地法门

          ㉖ 十地品(第二十六) [Daśa-bhūmi] (卷34-39, 约6卷)
          内容: 金刚藏菩萨宣说菩萨「十地」法门——
          欢喜地(初地)·离垢地(二地)·发光地(三地)·焰慧地(四地)·
          现前地(五地)·远行地(六地)·不动地(七地)·善慧地(八地)·法云地(九地)·
          智慧地(十地, 即法云地圆满)。
          **此品是华严经中最重要的品目之一**, 在印度佛教中已被单独抽出广泛流传
          (Daśabhūmika-sūtra), 龙树·无著·世亲等大论师均有注释。
          十地品详细阐述菩萨从初地到十地的每一个阶位的修行内容·断障·证真·
          以及与其他阶位的关系, 是大乘佛教「菩萨道」最系统的经典依据。

          版本对照: 八十华严第26品 | 六十华严第21品「十地品」 | 龙树《十地毘婆沙论》注释 | 藏译第27品

          【批注·阐释】
          ·澄观《华严经疏》释「十地是华严修行的核心」: 澄观指出, 十地
            是华严「五位」(十住·十行·十回向·十地·等觉妙觉)中「圣位」
            的开端——初地(欢喜地)是「见道位」, 修行者在此首次「亲证
            法界」(与「十住·十行·十回向」的「相似证」不同)。澄观将
            十地的结构解读为「从般若到方便」的展开: 初地到七地是「般若
            智」的深化(断惑证真), 八地到十地是「方便智」的展开(起用
            利生)。澄观特别强调, 十地品的「一地断一障·证一真」的结构,
            是华严「次第修行」最精密的表达。
          ·龙树《十地毘婆沙论》(Daśabhūmika-vibhāṣā): 龙树是最早的
            十地品注释者之一, 其注释(现存梵文残卷·藏译全本)从「般若
            波罗蜜」的角度解读十地——每一地的修行都是「般若智慧」的
            一个层面。龙树特别强调初地(欢喜地)的「欢喜」不是「世俗
            的快乐」, 而是「证悟法界」的「法喜」——修行者在此首次
            体验到「一切法空」的实相, 因而生起「大欢喜」。
          ·世亲《十地经论》(Daśabhūmika-sūtra-śāstra): 世亲的注释
            (北魏菩提流支译, 10卷) 从「唯识学」的角度解读十地——每一
            地的「断障」对应「阿赖耶识」中某一层次的「种子」被断除。
            世亲将十地的「证真」解读为「转识成智」的过程: 初地「转
            第五识」(成所作智), 二地「转第六识」(妙观察智), ……
            至十地「转第八识」(大圆镜智)。这是「唯识学」与「华严学」
            的重要交叉点。
          ·方东美《华严宗哲学》解读「从欢喜地到法云地的哲学意涵」:
            方氏指出, 十地的名称本身就构成了一个「哲学叙事」: 「欢喜」
            (初证法界的喜悦) →「离垢」(远离烦恼的染污) →「发光」
            (智慧之光显现) →「焰慧」(智慧之光如火焰般炽盛) →
            「现前」(法界实相现前) →「远行」(超越一切世间修行) →
            「不动」(不为一切境所动) →「善慧」(获得四无碍辩才) →
            「法云」(佛法如云覆一切) →「智慧」(圆满一切智)。方氏
            将此解读为「从存在论到认识论再到实践论」的完整哲学旅程。
          ·印顺法师讨论「十地品在印度的独立流传」: 印顺指出, 十地品
            在印度佛教中具有独特的地位——它被单独抽出, 作为独立的
            经典(Daśabhūmika-sūtra) 广泛流传, 这在华严经的39品中是
            唯一的。印顺认为, 这是因为十地品的内容(菩萨道的修行
            阶位)具有「独立的实用价值」——即使不读全本华严经, 仅读
            十地品也能获得完整的「菩萨道修行地图」。印顺还指出, 十地
            品在中观学派(龙树)·瑜伽行派(无著·世亲)·密教中都有
            重要的影响, 是大乘佛教各学派共同的经典基础。

          **═══ 第七会: 普光法堂重会 (卷40-52, 11品) ═══**
          说法处: 摩揭陀国普光明殿(第二次在此集会)
          会主: 毗卢遮那佛(佛亲说)
          宗旨: **平等因果[解]** — 说等觉·妙觉法门

          ㉗ 十定品(第二十七) [Daśa-samādhi]
          内容: 普贤菩萨说「十种大三昧」(十定)——
          普光大三昧·妙光大三昧·次第遍往诸佛国土大三昧·清净深心行大三昧·
          知过去庄严藏大三昧·智光明藏大三昧·了知一切世界佛庄严大三昧·
          众生差别身大三昧·法界自在大三昧·无碍轮大三昧。
          **注意: 此品仅见于八十华严与藏译, 六十华严无此品。**

          版本对照: 八十华严第27品 | **六十华严无此品** | 藏译第28品 | ⚠️此品为八十华严新增

          【批注·阐释】
          ·澄观《华严经疏》释「十定是平等因」: 澄观指出, 此品说十种大三昧,
            是「平等因果」的开端——前六会说「差别因果」(不同阶位有不同修行),
            第七会转入「平等因果」(一切佛·一切法·一切行平等无二)。十定是
            「平等」之「因」, 即以三昧力证入法界平等性。澄观特别强调,
            此品的「十定」与第六会「十地」的关系: 十地是「有功用行」的
            最高阶段, 十定是「无功用行」的开始——从有作入无作, 从差别入
            平等。此品仅见于八十华严与藏译, 六十华严无此品, 表明八十华严
            的编纂者认为需要在十地品之后增加「三昧」的修行内容, 以完整呈现
            从「地」到「定」的过渡。
          ·海云继梦法师强调「此品为六十华严所缺·重要」: 海云法师指出,
            六十华严缺少此品, 使得从「十地」到「十通」的修行次第出现跳跃;
            八十华严增补此品, 正好填补了「地后定」的修行环节。十定品的增补
            体现了八十华严编纂者对修行次第完整性的高度重视——菩萨从初地到
            十地的修行是「有为」的, 进入十定后转入「无为」的三昧境界,
            这一过渡对于理解华严「从因到果」的修行路径至关重要。
          ·印顺法师从文献学角度指出此品是「八十华严新增的编辑证据」:
            印顺认为, 此品的存在是八十华严编纂者在六十华严基础上增补内容
            的直接证据——六十华严(约36,000偈)到八十华严(约45,000偈)之间
            增加的约9,000偈中, 此品是重要组成部分。印顺将此品与藏译对照,
            发现藏译第28品与八十华严第27品内容基本一致, 说明两者共享同一
            底本(于阗本), 而六十华严所据底本尚无此品。

          ㉘ 十通品(第二十八) [Daśa-abhijñā]
          内容: 普贤菩萨说「十种神通」(十通)——
          他心通·天眼通·天耳通·宿住随念通·知尽未来际通·天眼境界智通·
          宿住智通·知众生生死方便智通·无障碍天耳智通·入一切法灭尽智通。

          版本对照: 八十华严第28品 | 六十华严第22品「十通品」 | 藏译第29品

          【批注·阐释】
          ·澄观《华严经疏》释「神通依定而发」: 澄观指出, 「十通」即「十种
            神通」(daśa-abhijñā), 是菩萨依十种三昧(十定)所起的智慧作用。
            澄观特别强调「通」非「神通」的世俗含义, 而是「智慧的无碍运用」——
            他心通是「知他心之智」, 天眼通是「见法界之智」, 宿住随念通是
            「知过去之智」。十通的排列从「他心通」(知他)到「入一切法灭尽
            智通」(知一切法之寂灭), 呈现「从知他到知法」的递进。澄观将
            此品的功能归纳为「定后起用」——先入十定(证体), 再起十通(妙用),
            体用不二。
          ·法藏《华严经探玄记》阐释「十通即十种智慧」: 法藏将十通与「十智」
            对应, 认为十通不是「超自然能力」, 而是「十种无碍智慧」的展开。
            法藏特别强调「无障碍天耳智通」与「入一切法灭尽智通」的关系:
            前者是「闻法无碍」(闻慧), 后者是「证法无碍」(修慧), 两者共同
            构成「从闻到证」的完整智慧链条。法藏指出, 十通品在修行次第上
            紧接十定品, 正是「定发慧」的华严修行原理的体现。

          ㉙ 十忍品(第二十九) [Daśa-kṣānti]
          内容: 普贤菩萨说「十种忍」(十忍)——
          音声忍·顺忍·无生法忍·如幻忍·如焰忍·如梦忍·如响忍·如电忍·如化忍·如空忍。
          此十忍是菩萨成就智慧的关键——从「音声忍」(听闻佛法而忍)到「如空忍」
          (了达法性如虚空)。

          版本对照: 八十华严第29品 | 六十华严第23品「十忍品」 | 藏译第30品

          【批注·阐释】
          ·澄观《华严经疏》释「从音声忍到如空忍·是智慧成就」: 澄观指出,
            十忍的排列呈现「从浅到深」的智慧成就过程: 「音声忍」是「闻慧」
            (听闻佛法而生忍), 「顺忍」是「思慧」(随顺法义而深入),
            「无生法忍」是「修慧」(亲证一切法不生不灭); 此后「如幻忍」至
            「如化忍」是以十种譬喻(幻·焰·梦·响·电·化等)来表达「一切法
            如幻化」的般若智慧; 最后「如空忍」是智慧的圆满——了达法性
            如虚空, 无碍无住。澄观将十忍与「般若波罗蜜」联系: 十忍即是
            般若智慧从「闻」到「证」的完整展开。
          ·印顺法师讨论「忍的层次与般若的关系」: 印顺指出, 「忍」(kṣānti)
            在大乘佛教中不仅是「忍辱」, 更是「印可·认持」——对真理的
            深层接受与安住。印顺将十忍与《般若经》的「十八空」对照: 如幻忍
            对应「幻化空」, 如焰忍对应「焰象空」, 如空忍对应「毕竟空」,
            显示十忍与般若学的深度关联。印顺认为, 十忍品是华严将「般若」
            从「六度」之一扩展为「完整智慧体系」的典型表现。

          ㉚ 阿僧祇品(第三十) [Asaṃkhyeya]
          内容: 心王菩萨问佛「阿僧祇」(无量数)的名义,
          佛说从阿僧祇→无量→无边→无等→不可数→不可称→不可思→不可量→不可说→
          不可说不可说转的无穷数列。此品展示华严「无穷」的数学观。

          版本对照: 八十华严第30品 | 六十华严第24品「阿僧祇品」 | 藏译第31品

          【批注·阐释】
          ·澄观《华严经疏》释「无穷数列·表法界无尽」: 澄观指出, 此品以
            数学上的无穷数列(阿僧祇→无量→无边→……→不可说不可说转)来表显
            法界的无尽性——法界不是「有限」的(可以数尽), 也不是「虚无」的
            (什么都没有), 而是「无穷」的(永远说不尽)。澄观将此品与华严
            「无尽」思想联系: 「十」是「圆满」, 「阿僧祇」是「无尽」,
            两者共同构成华严的核心数字哲学——修行是圆满的(十), 同时也是
            无尽的(阿僧祇), 没有「终点」, 只有「无尽的深入」。
          ·方东美《华严宗哲学》将此品解读为「数学与形上学的交融」:
            方氏指出, 华严以数学上的无穷概念(阿僧祇)来表达形上学上的
            无限实在(法界), 这在世界哲学史上是独特的。方氏将此与西方
            数学哲学对照: 康托尔(Georg Cantor)的「超限数」(transfinite
            number)理论证明了「无穷大」可以被分层(可数无穷·不可数无穷等),
            而华严的无穷数列(阿僧祇→无量→无边→……)同样是将「无穷」分层
            表达。但华严的目的不是数学证明, 而是通过数学意象来表达「法界
            无尽」的宗教体验——方氏称之为「以数学为方便的形上学」。

          ㉛ 如来寿量品(第三十一) [Āyuṣpramāṇa]
          内容: 佛说如来的寿命非算数所能计量——
          不同世界中佛的寿命各不相同, 有的极短(如释迦牟尼佛八十岁), 有的极长,
          但本质上「如来寿量」超越时间概念, 是法身常住的表法。

          版本对照: 八十华严第31品 | 六十华严第25品「如来寿量品」 | 藏译第32品

          【批注·阐释】
          ·澄观《华严经疏》释「佛寿超越时空」: 澄观指出, 此品的核心命题是
            「如来寿量非算数所知」——佛的寿命不是「时间轴上的一段」(有始有终),
            而是「超越时间的永恒」(无始无终)。澄观将此与「法身常住」联系:
            法身(dharmakāya)是佛的「真实身」, 不生不灭, 不在时间中;
            化身(nirmāṇakāya)是佛的「应现身」, 有生有灭, 在时间中。
            如来寿量说的是「法身之寿」, 不是「化身之寿」, 故超越算数。
            澄观将此品与「阿僧祇品」对照: 阿僧祇品说「空间/数量的无穷」,
            如来寿量品说「时间/寿命的无穷」, 两者共同表达法界在「数量」
            与「时间」两个维度上的无尽性。
          ·印顺法师讨论「法身常住与化身示现」: 印顺指出, 此品的「佛寿
            各不同」(有的极短如释迦八十岁, 有的极长)体现了大乘佛教「法身
            常住·化身随机」的核心信仰——法身永恒不变, 但化身随众生根机
            而示现不同的寿命。印顺认为, 这一思想解决了「佛入灭后众生
            依怙何在」的神学问题: 佛的化身虽入灭, 法身永远常住, 从未
            离开众生。

          ㉜ 诸菩萨住处品(第三十二) [Bodhisattva-vihāra]
          内容: 列举诸大菩萨在世界各地的住处(道场)——
          文殊住「东北方清凉山」(五台山)·普贤住「东方支提山」·观音住「南海补陀洛迦」
          等。此品是研究华严地理观与菩萨信仰的重要文本。

          版本对照: 八十华严第32品 | 六十华严第26品「菩萨住处品」 | 藏译第33品

          【批注·阐释】
          ·澄观《华严经疏》释「菩萨住处即道场」: 澄观指出, 此品所列诸菩萨
            住处(文殊住清凉山·普贤住支提山·观音住补陀洛迦等), 不是「地理
            志」(记录菩萨的实际居住地), 而是「表法」(以地理意象表显修行
            境界)。澄观将「住处」解读为「道场」——菩萨「住」于何处,
            即在何处「成道」, 故「住处」即是「修行处」。文殊住「东北方
            清凉山」表「智慧从东方(日出)升起, 清凉表无烦恼」, 普贤住
            「东方支提山」表「行愿如山王不动」。
          ·印顺法师讨论「五台山信仰的经典依据」: 印顺指出, 此品是五台山
            成为文殊道场的经典依据——华严经「东北方有清凉山, 文殊师利
            住在其中」的记载, 直接推动了五台山在中国佛教中的圣地地位。
            印顺从历史角度分析, 这一地理描写可能反映了华严经编纂者(或
            底本流通者)对中国地理的认知——将五台山纳入菩萨住处体系,
            说明华严经的编纂与流通与中国有密切关系。这也是华严经「于阗
            编纂说」的地理线索之一。
          ·海云继梦法师强调「文殊道场的表法」: 海云法师指出, 文殊菩萨
            住「清凉山」的「清凉」二字是修行的关键——「清凉」即「离热恼」,
            热恼是贪瞋痴三毒的总称, 清凉即是三毒息灭的境界。文殊住清凉山,
            表示「智慧(文殊)的道场是离烦恼(清凉)的」——修行者若要
            见文殊(开智慧), 必须先「入清凉」(离烦恼), 这是华严「先
            断惑后证真」的修行原理的地理化表达。

          ㉝ 佛不思议法品(第三十三) [Acintya-dharma]
          内容: 佛说如来所证的法·所现的境·所教的法, 皆不可思议——
          非思量分别之所能知, 唯证方知。

          版本对照: 八十华严第33品 | 六十华严第27品「佛不思议法品」 | 藏译第34品

          【批注·阐释】
          ·澄观《华严经疏》释「不可思议即绝言说」: 澄观指出, 「不可思议」
            (acintya) 在华严中有三层含义: 一「非思量境」(不是思维可以
            到达的), 二「非言说境」(不是语言可以表达的), 三「唯证方知」
            (只有亲证才能了知)。澄观将此品与「十忍品」联系: 十忍品说
            「从音声忍到如空忍」的智慧成就过程, 此品则是智慧成就后的
            「境界呈现」——佛所证的法·所现的境·所教的法, 皆超越了
            「可思议」的范围, 唯有通过修行亲证才能了知。澄观特别强调,
            「不可思议」不是「不可知论」(agnosticism), 而是「超越理性
            的宗教体验」——不是「不知道」, 而是「知道了但说不出来」。
          ·方东美《华严宗哲学》将此品解读为「超越理性的宗教体验」:
            方氏指出, 「不可思议」是华严哲学中最深刻的「认识论命题」
            之一——它承认人类理性(思量)与语言(言说)有其「边界」,
            在这个边界之外, 存在着「可证而不可说」的实在。方氏将此与
            维特根斯坦(Ludwig Wittgenstein)的「不可说」(unsayable)
            对照: 维特根斯坦在《逻辑哲学论》结尾说「对于不可说的东西,
            必须保持沉默」, 华严则说「不可说但可以证入」——两者都承认
            理性的边界, 但华严提供了「超越边界」的实践路径(修行·证入),
            而维特根斯坦只停留在「沉默」。

          ㉞ 如来十身相海品(第三十四) [Daśakāya]
          内容: 普贤菩萨说如来「十身」(十种佛身)的相好庄严——
          菩提身·愿身·化身·力持身·相好庄严身·威势身·意生身·福德身·法身·智身。
          每一身皆有无量相好, 如「有十莲华藏世界海微尘数大人相」。

          版本对照: 八十华严第34品 | 六十华严第28品「如来十身相海品」 | 藏译第35品

          【批注·阐释】
          ·澄观《华严经疏》释「十身即十种佛格」: 澄观指出, 如来「十身」
            不是「十个身体」, 而是「十种佛格」(十种佛的存在方式)——菩提身
            是「成道之身」, 愿身是「度生之身」, 化身是「应现之身」,
            力持身是「住持之身」, 相好庄严身是「色相之身」, 威势身是
            「折伏之身」, 意生身是「随意之身」, 福德身是「积功之身」,
            法身是「理体之身」, 智身是「智照之身」。十身互相含摄——
            一身即十身, 十身即一身, 圆融无碍。澄观将十身与「四法界」
            联系: 法身·智身是「理法界」, 菩提身·愿身是「事法界」,
            其余六身是「理事无碍法界」与「事事无碍法界」的展现。
          ·法藏《华严经探玄记》阐释「相好即法身的显现」: 法藏指出,
            此品的「相好庄严」不是「外在的装饰」(佛的身体好看), 而是
            「法身的自然显现」——佛的每一相好都是无量劫修行功德的凝缩,
            是「因行」的「果德」表达。法藏以「金师子」喻解释: 金(法身)
            是体, 师子的相好(十身)是用, 有体必有用, 有用必有体,
            体用不二。「有十莲华藏世界海微尘数大人相」的描写, 正是
            「一即一切」的相好观——一个相好中含无量相好, 无量相好归于
            一个相好。

          ㉟ 如来随好光明功德品(第三十五) [Anuvyañjana]
          内容: 佛说如来「随好」(微细相好)的光明功德——
          每一随好放无量光, 光中说无量法, 度无量众生。

          版本对照: 八十华严第35品 | 六十华严第29品「随好光明功德品」 | 藏译第36品

          【批注·阐释】
          ·澄观《华严经疏》释「随好是微细功德」: 澄观指出, 「随好」
            (anuvyañjana) 是佛的「微细相好」, 区别于「大相」(maha-lakṣaṇa,
            三十二相)——大相是「粗显」的(肉眼可见), 随好是「微细」的
            (唯佛与佛乃能知)。此品说「每一随好放无量光」, 表示佛的
            「微细功德」同样具有「无尽」的特质——不仅大相无量, 随好也
            无量; 不仅相好无量, 光明也无量; 不仅光明无量, 光中所说法
            也无量。澄观将此品与「如来十身相海品」联系: 前品说「十身
            的相好」(整体), 此品说「随好的光明」(细节), 两者共同表达
            佛的「功德无尽」——从整体到细节, 从粗到细, 无不圆满。
          ·海云继梦法师强调「光明即智慧的外显」: 海云法师指出, 此品的
            「光明」不是「物理之光」, 而是「智慧之光」(般若光·法界光)。
            「每一随好放无量光」表示佛的每一个「微细功德」都是「智慧的
            显现」——佛没有「无智慧的功德」, 也没有「无功德的智慧」,
            智慧与功德是一体的两面。海云法师将此与修行联系: 修行者
            修「随好」(微细的善行), 同时也是修「光明」(智慧的显发),
            因为「微细善行」本身就是「智慧的运用」。

          ㊱ 普贤行品(第三十六) [Samantabhadra-caryā]
          内容: 普贤菩萨说「普贤行」——
          十种大愿(礼敬诸佛·称赞如来·广修供养·忏悔业障·随喜功德·请转法轮·
          请佛住世·常随佛学·恒顺众生·普皆回向)的详细展开。
          此品是华严「行愿」的核心——普贤十愿是华严修行的总纲。

          版本对照: 八十华严第36品 | 六十华严第30品「普贤行品」 | 藏译第37品

          【批注·阐释】
          ·澄观《华严经疏》释「十愿为华严修行总纲」: 澄观指出, 普贤十愿
            (礼敬诸佛·称赞如来·广修供养·忏悔业障·随喜功德·请转法轮·
            请佛住世·常随佛学·恒顺众生·普皆回向)是华严「修行」的最核心
            表达——前八会的「信·解」(理论理解)在此品中被转化为「行」
            (实际修行)。澄观将十愿的结构解读为「从自到他·从因到果」:
            前五愿(礼敬·称赞·供养·忏悔·随喜)是「自利行」(净化自身),
            后五愿(请转法轮·请佛住世·常随佛学·恒顺众生·普皆回向)
            是「利他行」(利益众生), 最后「普皆回向」统摄一切, 将所有
            功德回向法界。澄观特别强调, 此品是「成行因果」(第四周)的
            核心——将前三周的「信·解」(理论)化为「行」(实践)。
          ·海云继梦法师强调「普贤行是实践的核心」: 海云法师指出, 华严经
            的修行体系可归纳为「文殊解·普贤行」——文殊代表「智慧」(理解
            法界), 普贤代表「实践」(行入法界)。此品是「普贤行」的最
            完整表达, 十愿不仅是「发愿」(口头誓愿), 更是「正行」(实际
            修行)。海云法师特别强调「恒顺众生」愿: 这是华严「平等观」
            的最直接实践——不是「我来度你」(居高临下), 而是「恒顺」
            (随顺众生的根机·因缘·方式), 这是「无我」的最高体现。
          ·印顺法师讨论「普贤行愿与净土法门的关系」: 印顺指出, 普贤十愿
            中的「普皆回向」与净土宗的「回向西方」有深层关联——普贤行愿
            的最终归趣是「往生净土」(普贤行愿品末尾明确说「愿我临欲命终时,
            尽除一切诸障碍, 面见彼佛阿弥陀, 即得往生安乐刹」)。印顺认为,
            这说明华严与净土并非「对立」, 而是「华严为体·净土为用」——
            华严的「法界观」是「体」, 净土的「往生」是「用」, 两者圆融。

          ㊲ 如来出现品(第三十七) [Tathāgatotpattisaṃbhava]
          内容: 佛说如来「出现」(成道·转法轮·入灭)的因缘——
          如来以无量身·无量名·无量方便出现于世, 非仅释迦牟尼一佛。
          此品是「平等因果」的总结——佛佛平等·法法平等。

          版本对照: 八十华严第37品 | 六十华严第31品「如来兴显经」 | 藏译第38品

          【批注·阐释】
          ·澄观《华严经疏》释「如来出现即法界全体的显现」: 澄观指出,
            「如来出现」(tathāgatotpattisaṃbhava) 不是「一个佛从无到有」,
            而是「法界全体的显现」——如来的「出现」就是法界的「显现」,
            两者是一回事。澄观将此品的「出现」解读为三义: 一「出现」
            (成道, 法界从「隐」到「显」), 二「转法轮」(说法, 法界从
            「显」到「用」), 三「入灭」(涅槃, 法界从「用」归「体」)。
            但「入灭」不是「消失」, 而是「回归法界」——如来从未离开
            法界, 故「入灭」也是「出现」的另一种形式。澄观将此品与
            「毗卢遮那品」(第六品)对照: 第六品追溯毗卢遮那的因地修行
            (因), 此品说如来出现的果德(果), 因果圆满, 平等无二。
          ·法藏《华严经探玄记》阐释「平等因果的总结」: 法藏指出, 此品是
            「平等因果」(第三周)的总结——前品(如来十身相海品·随好光明
            功德品)说佛的「果德」(相好·光明), 此品说佛的「出现因缘」
            (为什么佛会出现于世)。法藏将「出现」解读为「因该果海·果彻
            因源」的华严核心命题的最终表达: 佛的「出现」(果)以无量劫
            修行(因)为根源, 无量劫修行(因)以佛的「出现」(果)为归趣,
            因与果互相含摄, 圆融无碍。

