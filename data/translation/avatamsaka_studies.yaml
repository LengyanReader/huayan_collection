             "manifestation" has three meanings: (1) appearing (enlightenment),
             (2) turning the wheel (teaching), (3) entering parinirvāṇa
             (returning to the dharmadhātu). Even "entering parinirvāṇa" is
             not "disappearing" but "returning" — the Tathāgata has never left
             the dharmadhātu.
           ·Fazang, Huayan jing tanxuan ji: "The conclusion of equal cause and
             effect" (平等因果的总结) — this chapter concludes the third cycle
             "equal cause and effect": the previous chapters expound the Buddha's
             "fruition-virtues" (marks, light); this chapter expounds the
             "causes of manifestation." Fazang reads this as the ultimate
             expression of the Avataṃsaka's core principle: "the cause encompasses
             the ocean of fruition; the fruition penetrates the source of the
             cause" — cause and fruit mutually contain each other, perfectly
             interpenetrating.

            Version Correspondence: 80-fascicle ch. 37 | 60-fascicle ch. 31 "Manifestation of the Tathāgata" | Tibetan ch. 38

           **═══ ASSEMBLY 8: THIRD MEETING AT THE HALL OF UNIVERSAL LIGHT ═══**

           ㊳ *Transcending the World* (ch. 38) [Lokottara] (~7 fascicles)
           Content: Universal Wisdom Bodhisattva poses 200 questions to Samantabhadra,
           who responds with 2,000 answers — one question yields ten answers,
           revealing the inexhaustible meaning. Content covers all practice dharmas
           from initial aspiration to final Buddhahood, encompassing the causal
           practice of all five stages (Ten Abodes, Ten Practices, Ten
           Transferences, Ten Grounds, Equal and Wondrous Enlightenment).
           "Transcending the world" means: though practicing within the world,
           one is not defiled by it — entering the world to save beings with
           a mind that transcends the world.
           ·Chengguan, Huayan jing shu: "200 questions, 2000 answers — encompassing
             all five stages" (二百问二千答·总摄五位) — this chapter uses the
             question-and-answer format to provide a comprehensive synthesis of all
             the Avataṃsaka's practice dharmas. It serves as "concluding what came
             before and giving rise to what follows": summarizing the first seven
             assemblies' "faith, understanding, and practice" and providing the
             final theoretical preparation for the ninth assembly's "realization."
           ·Yinshun: "The encyclopedic nature of this chapter" — 200 questions
             covering all practice problems from aspiration to Buddhahood, 2,000
             answers providing ten levels of response for each, totaling 2,000
             items of practice guidance. Yinshun compares this with the
             Mahāprajñāpāramitā-śāstra's "hundred doors of dhyāna-wisdom."
           ·Haiyun Jimeng: "One question yields ten answers — the dharma-gate of
             inexhaustibility" (问一答十·无尽法门) — the "one-to-ten" ratio is
             not artificial but reflects the dharmadhātu's nature: every practice
             question has "immeasurable layers of response." Ten is a "conventional
             number" representing "completion"; in reality, it is "immeasurable
             answers."

            Version Correspondence: 80-fascicle ch. 38 | 60-fascicle ch. 32 "Transcending the World" | Tibetan ch. 39

          **═══ ASSEMBLY 9: THE JETA GROVE (fascicles 60–80, 1 chapter) ═══**
          Location: the Jeta Grove in Śrāvastī
          Assembly Masters: Mañjuśrī, Maitreya, and Samantabhadra
          Theme: **Realization of the cause and effect [Realization]** — Entering the
          Dharma Realm

          ㊴ *Entering the Dharma Realm* (ch. 39) [Gaṇḍavyūha] (~21 fascicles, ~¼ of
          the entire sūtra)
          Content: The longest and most widely circulated chapter. Sudhana, inspired by
          Mañjuśrī, sets out on a pilgrimage to visit fifty-three spiritual friends
          (kalyāṇamitra) of all types — kings, ministers, monks, nuns, laymen, laywomen,
          ascetics, brāhmaṇas, celestial maidens, young girls — each teaching him their
          own practice. The climax comes when Sudhana visits Maitreya, who opens the
          "Matrix Adorned with the Splendours of Vairocana" tower, revealing infinite
          worlds within a single body. Finally, Sudhana merges with Samantabhadra's
          vast body of practice and receives the "Ten Great Vows." This chapter
          transforms the theoretical teachings of the first eight assemblies into
          concrete, lived experience — the supreme model of the Avataṃsaka's unity of
          theory and practice. The fifty-three pilgrimages also demonstrate the Avataṃsaka
           principle that "anything and anyone can be a spiritual friend."
            ·Chengguan, Huayan jing shu: "The five-fold structure: Mañjuśrī
              inspires → Southern pilgrimage → Maitreya opens the treasury →
              Samantabhadra realizes → entry into the dharmadhātu" — Sudhana's
              pilgrimage follows a precise spiritual arc: Mañjuśrī represents
              "understanding" (wisdom-initiation), the fifty-three visits represent
              "practice" (implementation), Maitreya's tower represents "realization"
              (direct perception of the dharmadhātu), and Samantabhadra's ten vows
              represents "entry" (merging with the dharmadhātu). Chengguan emphasizes
              the symbolic meaning of "heading south" — south symbolizes "light"
              (the south is associated with fire, fire symbolizing the light of
              wisdom); Sudhana heading south means "advancing toward the light
              of wisdom."
            ·Yinshun: "The independent circulation history of this chapter" — the
              Gaṇḍavyūha circulated widely as an independent scripture in India.
              The surviving Sanskrit manuscript (found in Khotan), with its Khotanese
              colophon, testifies to its transmission across Central Asia. The
              forty-fascicle version (by Prajñā, 796 CE), consisting solely of
              this chapter, suggests that the Gaṇḍavyūha alone constitutes a
              "complete Avataṃsaka practice text" — the full path from aspiration
              to realization — without requiring other chapters.
            ·Thomé Fang: "The supreme model of theory-practice unity" — the first
              eight assemblies provide "theory" (abstract teachings on faith,
              understanding, and practice); the Gaṇḍavyūha provides "practice"
              (lively, human pilgrimage). The fifty-three spiritual friends span
              "kings, ministers, monks, nuns, laymen, laywomen, ascetics,
              brāhmaṇas, celestial maidens, young girls" — all social classes,
              all genders, all beliefs — a "declaration of equality" unparalleled
              in world religious history.
            ·Haiyun Jimeng: "Anything can be a spiritual friend" — the fifty-three
              friends include not only Buddhist practitioners but also ascetics,
              brāhmaṇas, and even "heretical seers," demonstrating that the
              Avataṃsaka's criterion for "spiritual friend" is not "faith" but
              "wisdom" — anyone who guides you deeper into the dharmadhātu,
              regardless of identity, is your spiritual friend.
            ·Fazang, Huayan jing tanxuan ji: "The pilgrimage as inner landscape
              of the mind" — Fazang interprets the sequence of fifty-three visits
              as a progression of "inner mind-development": the first twenty
              friends represent the "faith" stage, the middle ten represent the
              "abodes, practices, and transferences," and the final twenty-three
              represent the "grounds, equal-enlightenment, and wondrous-
              enlightenment." The pilgrimage is not external travel but internal
              unfolding of the mind-ground.

            Version Correspondence: 80-fascicle ch. 39 | 60-fascicle ch. 33 "Entering the Dharma Realm" | **40-fascicle text (entire text = this chapter)** | Tibetan ch. 40
        sources:
          - "Chengguan, Huayan jing shu (T35n1735)"
          - "Fazang, Huayan jing tanxuan ji (T45n1851)"
          - "Thomé Fang, The Philosophy of the Huayan School (1980)"
          - "Haiyun Jimeng, Avataṃsaka practice teachings (huayen.world)"
          - "Yinshun, The Origins of Early Mahāyāna Buddhism (1950)"
          - "Nāgārjuna, Daśabhūmika-vibhāṣā (Tibetan translation)"
          - "Vasubandhu, Daśabhūmika-sūtra-śāstra (trans. Bodhiruci, T26n1522)"
          - "Bhikshu Dharmamitra, The Flower Adornment Sutra (Kalavinka Press, 2022)"
          - "Thomas Cleary, The Flower Ornament Scripture (Shambhala, 1993)"
          - "Lingyin Temple, 'The Content and Structure of the Avataṃsaka Sūtra' (2019)"

      - title: 四译本品目对照
        title_en: Comparison of Chapter Divisions Across Four Versions
        body: |
          华严经在不同译本中品目数不同: 六十华严34品·八十华严39品·藏译45品·梵本(据智俨记录)44品。
          差异主要来自两个原因: (1)某些品目在某些版本中缺失, (2)品目的细分方式不同。
          
          **藏译独有而汉译缺失的品目**:
          ·第11品「如来华严品」(Tathāgatāvataṃsaka) — 位于毗卢遮那品之后,
            如来名号品之前, 阐述佛的华严装饰。
          ·第32品「普贤宣说品」(Samantabhadra's Teaching) — 内容与实叉难陀所译
            《大方广普贤所说经》(T298)相同, 但藏译将其收入华严经本部。
          
          **汉译独有而藏译缺失的品目**:
          ·「十定品」(第十会, Daśa-samādhi) — 仅见于八十华严与藏译, 六十华严无此品。
          
          **品目细分的差异**:
          六十华严的「卢舍那佛品」(第2品)在八十华严中被分为五品(第2-6品),
          在藏译中被分为九品。同样, 八十华严的「华藏世界品」(第5品)在藏译与
          梵本(据智俨记录)中被分为五章。据慧苑(673-743)记载, 实叉难陀的
          梵文底本中「华藏世界品」原为五章, 实叉难陀在翻译时合为一品。
        sources:
          - "智俨《华严孔目章》(T45n1867) — 记录梵本品目"
          - "H.R. Park, 'The Differences and Editing Process of Chapter Divisions' (IBK 62:2, 2014)"
          - "Imre Hamar, 'The History of the Buddhāvataṃsaka-sūtra' (2007)"
        en_body: |
          The Avataṃsaka has different chapter counts across versions: 34 chapters in
          the sixty-fascicle text, 39 in the eighty-fascicle text, 45 in the Tibetan
          translation, and 44 in the Sanskrit (according to Zhiyan's record). The
          differences stem from two causes: (1) certain chapters are absent in some
          versions, and (2) chapters are divided differently.

          **Chapters unique to the Tibetan translation, absent from Chinese**:
          ·Ch. 11, "Chapter on the Tathāgata's Avataṃsaka" (Tathāgatāvataṃsaka) —
            placed after the Vairocana chapter and before the Names chapter.
          ·Ch. 32, "Chapter on Samantabhadra's Teaching" (Samantabhadra's Proclamation)
            — same content as Śikṣānanda's separate translation T298, but included in
            the Tibetan Kangyur as part of the Avataṃsaka.

          **Chapters unique to the Chinese translation, absent from Tibetan**:
          ·"Chapter on Ten Samādhis" (Daśa-samādhi) — appears in the eighty-fascicle
            text and Tibetan but not in the sixty-fascicle text.

          **Differences in chapter subdivision**:
          The "Chapter on Vairocana Buddha" (ch. 2) of the sixty-fascicle text was
          split into five chapters (chs. 2–6) in the eighty-fascicle text and into nine
          chapters in the Tibetan. Similarly, the "Chapter on the Flower-Treasury World"
          (ch. 5) of the eighty-fascicle text was divided into five sub-chapters in the
          Tibetan and Sanskrit (according to Zhiyan). According to Huīyuàn (673–743),
          Śikṣānanda's Sanskrit base text originally had five sub-chapters, which
          Śikṣānanda combined into one during translation.
        sources:
          - "Zhiyan, Kongmu zhang (T45n1867) — records Sanskrit chapter titles"
          - "H.R. Park, 'The Differences and Editing Process of Chapter Divisions' (IBK 62:2, 2014)"
          - "Imre Hamar, 'The History of the Buddhāvataṃsaka-sūtra' (2007:139-167)"

      - title: 五周因果——义理结构
        title_en: Five Cycles of Cause and Effect — Doctrinal Structure
        body: |
          澄观(738-839)在《华严经疏》中将三十九品归纳为「五周因果」——
          (1) **所信因果周**[信](第1-6品, 11卷): 说毗卢遮那佛依正庄严, 令众生生信。
          (2) **差别因果周**[解·前半](第7-34品, 31卷): 说十信·十住·十行·十回向·十地·
          等觉·妙觉的修行次第, 因与果有差别(不同的阶位有不同的修行内容)。
          (3) **平等因果周**[解·后半](第35-37品, 约5卷): 说佛的相好·光明·出现,
          因与果平等(一切佛皆同此因·同此果)。
          (4) **成行因果周**[行](第38品, 7卷): 说普贤二千行门, 将理论化为具体的修行。
          (5) **证入因果周**[证](第39品, 21卷): 说善财五十三参, 将修行落实为实际的证入。
          
          五周因果与「信·解·行·证」四分法相对应:
          信(第一周) → 解(第二·三周) → 行(第四周) → 证(第五周)。
          全经由此构成从「听闻生信」→「深入理解」→「付诸实践」→「亲证法界」
          的完整菩萨道修行地图。
        sources:
          - "澄观《华严经疏》(T35n1735)"
          - "灵隐寺《学处|数十万字的华严经如何分段》(2019)"
        en_body: |
          Chengguan (738–839) summarized the 39 chapters into "five cycles of cause
          and effect" in his *Huayan jing shu* —
          (1) **The cycle of the cause and effect of what is to be believed** [Faith]
            (chs. 1–6, 11 fascicles): expounding the adornments of Vairocana's
            environment and body to inspire faith.
          (2) **The cycle of differentiated cause and effect** [Understanding, first
            half] (chs. 7–34, 31 fascicles): expounding the sequential stages of the
            Ten Faiths, Ten Abodes, Ten Practices, Ten Transferences, Ten Grounds,
            Equality-Enlightenment, and Wonderful Enlightenment — cause and effect are
            differentiated (each stage has its own content).
          (3) **The cycle of equal cause and effect** [Understanding, second half]
            (chs. 35–37, ~5 fascicles): expounding the Buddha's marks, light, and
            manifestation — cause and effect are equal (all buddhas share the same
            cause and the same fruit).
          (4) **The cycle of completing the practice** [Practice] (ch. 38, 7 fascicles):
            expounding Samantabhadra's 2,000 practices, transforming theory into
            concrete cultivation.
          (5) **The cycle of realization** [Realization] (ch. 39, 21 fascicles):
            expounding Sudhana's fifty-three pilgrimages, bringing cultivation to
            actual realization.

          The five cycles correspond to the fourfold structure of "faith → understanding
          → practice → realization": Faith (cycle 1) → Understanding (cycles 2–3) →
          Practice (cycle 4) → Realization (cycle 5). The entire sūtra thus constitutes
          a complete map of the bodhisattva path from "hearing and generating faith" →
          "deep understanding" → "putting it into practice" → "directly realizing the
          dharmadhātu."
        sources:
          - "Chengguan, Huayan jing shu (T35n1735)"
          - "Lingyin Temple, 'How to Divide the Hundreds of Thousands of Characters' (2019)"

      - title: 表意表法——毗卢遮那与华藏世界
        title_en: Symbolic Expression — Vairocana and the Ocean of Flower-Treasury Worlds
        body: |
          (1) **毗卢遮那**(Vairocana) = 法身佛, 非历史佛陀, 而是法界之体——
          「光明遍照」之义, 代表法界真理的遍在性与全照性。
          (2) **华藏世界海** = 毗卢遮那佛的净土, 二十重世界层层叠绕,
          每一世界有微尘数佛刹围绕——这不是物理宇宙的描述,
          而是**事事无碍法界的表法**: 一尘中含法界, 一毛中现无量佛刹。
          (3) **十** = 华严的核心数字表法: 十信·十住·十行·十回向·十地·十玄门·
          十方·十世……「十」代表**圆满**与**无尽**——菩萨道的修行是圆满的、
          无尽的行愿, 非线性的「到达终点」。
        sources:
          - "方立天《华严金师子章校释》(中华书局, 1983)"
          - "Francis Cook, Hua-yen Buddhism: The Jewel Net of Indra (Penn State, 1977)"
        en_body: |
          (1) **Vairocana** = the dharmakāya Buddha, not a historical buddha but the
          very substance of the dharmadhātu — his name means "universal illumination,"
          representing the pervasiveness and all-illuminating quality of the truth of
          the dharmadhātu.
          (2) **The Ocean of Flower-Treasury Worlds** (*gandavyūha* / *padmākaragarbha*)
          = the pure land of Vairocana, twenty tiers of worlds stacked layer upon
          layer, each world encircled by buddha-lands as numerous as dust-motes — this
          is not a description of the physical cosmos but the symbolic expression of
          the **dharmadhātu of the unimpeded interpenetration of all phenomena**:
          within a single mote of dust is contained the dharmadhātu, and in a single
          hair-tip appear countless buddha-lands.
          (3) **Ten** = the core symbolic number of Huayan: the ten faiths, ten
          abodes, ten practices, ten transfers, ten grounds, ten mysterious gates, ten
          directions, ten times... "Ten" signifies **consummation** and **inexhaustibility**
          — the bodhisattva path is a perfect and endless vow-practice, not a linear
          "arrival at a destination."

  - id: doctrinal
    title: 义学阐释
    title_en: Doctrinal Interpretation
    icon: 📖
    topics:
      - title: 核心教义体系
        title_en: The Core Doctrinal System
        body: |
          (1) **法界缘起** — 一切现象在法界中互依互入, 非孤立的因果链,
          而是全息的法界整体。与「业感缘起」「阿赖耶缘起」「真如缘起」
          并列为大乘佛教四大缘起论, 且为最圆满者。
          (2) **四法界观** — 事法界(现象界)→理法界(真如界)→
          理事无碍法界(真如与现象相即)→事事无碍法界(一切现象互不相碍)。
          此为杜顺→法藏的华严禅观核心。
          (3) **十玄门** — 法藏以十对玄妙的范畴(同时具足·因陀罗网·秘密隐显·
          微细相容·十世隔法·诸藏纯杂·一多相容·诸法相即·唯心回转·托事显法)
          阐明事事无碍的具体展开, 是华严义学的最精密表达。
          (4) **六相圆融** — 总别·同异·成坏——三对六范畴同时具足,
          认识任一事物即含摄全部六相, 是「一即一切」的认识论基础。
        sources:
          - "法藏《华严一乘教义分齐章》(T45n1866)"
          - "法藏《华严金师子章》(T45n1880)"
          - "方立天《华严金师子章校释》(中华书局, 1983)"
        en_body: |
          (1) **Dharmadhātu conditionality / dependent origination of the
          dharmadhātu** (*fajie yuanqi*) — all phenomena in the dharmadhātu
          interdepend and interpenetrate; it is not an isolated chain of cause and
          effect but a holographic whole. Together with "conditioned arising through
          karmic forces," "conditioned arising from the ālayavijñāna," and
          "conditioned arising from suchness," it is numbered among the four great
          theories of dependent origination in Mahāyāna, and is the most perfect.
          (2) **The contemplation of the four dharmadhātus** — the dharmadhātu of
          phenomena → the dharmadhātu of principle (suchness) → the dharmadhātu of
          the unimpeded interpenetration of principle and phenomena → the dharmadhātu
          of the unimpeded interpenetration of all phenomena. This is the core of the
          Huayan practice of contemplation from Dushun to Fazang.
          (3) **The Ten Mysterious Gates** (*shi xuan men*) — Fazang uses ten pairs of
          mysterious categories (simultaneous fulfillment, the net of Indra, the
          secret and hidden, the subtle containing the minute, the ten times separate
          yet interpenetrating, the non-sequestering of all stores, the interpenetration
          of one and many, the mutual identification of all dharmas, the revolution of
          mind only, and the manifestation of the Dharma through particulars) to clarify
          the concrete unfolding of the unimpeded interpenetration of all phenomena —
          the most refined expression of Huayan doctrinal learning.
          (4) **The perfect fusion of the six characteristics** (*liu xiang yuanrong*)
          — the three pairs of total/particular, identity/difference, and
          integration/disintegration are all simultaneously fulfilled; to know any one
          thing is to contain all six characteristics — the epistemological foundation
          of "one is all."

      - title: 历代祖师的义学贡献
        title_en: The Doctrinal Contributions of the Successive Patriarchs
        body: |
          **杜顺(557-640)** — 五教止观·法界观门 → 禅观实践奠基
          **智俨(602-668)** — 搜玄记·孔目章 → 六相·十玄初构
          **法藏(643-712)** — 探玄记·五教章·金师子章 → 五教十宗判教·十玄门完成
          **澄观(738-839)** — 华严经疏·随疏演义钞 → 八十华严科判·三圣圆融
          **宗密(780-841)** — 原人论·禅源诸诠集都序 → 禅教融合·会通儒道
          **李通玄(635-730)** — 新华严经论 → 以易经融会华严·长者系代表
        sources:
          - "CBETA 对应经号见各祖师条目"
        en_body: |
          **Dushun (557–640)** — *Five Teachings of Calming and Contemplation*
          (*Wu jiao zhiguan*), *Gate of the Contemplation of the Dharmadhātu*
          (*Fajie guan men*) → laid the foundation of contemplative practice.
          **Zhiyan (602–668)** — *Souxuan ji*, *Kongmu zhang* → the initial
          construction of the six characteristics and the ten mysterious gates.
          **Fazang (643–712)** — *Tanxuan ji*, *Wujiao zhang*, *Jinshizi zhang*
          → the completion of the doctrinal classification of the five teachings and
          ten schools, and of the ten mysterious gates.
          **Chengguan (738–839)** — *Huayan jing shu*, *Suishu yanyi chao* → the
          structure (kējiàn) of the eighty-fascicle text and the perfect fusion of the
          three holy ones.
          **Zongmi (780–841)** — *Yuaren lun*, *Chanyuan zhuquanjii duxu* → the
          fusion of Chan and doctrinal teaching, and the reconciliation with
          Confucianism and Daoism.
          **Li Tongxuan (635–730)** — *Xin Huayan jing lun* → fusing Huayan with the
          *Book of Changes*; the representative of the "Elder" (Zhangzhe) line of
          interpretation.

      - title: 近现代学术研究
        title_en: Modern and Contemporary Academic Research
        body: |
          **中国**: 方东美《华严宗哲学》(1980)、方立天《法藏评传》(2006)、
          吕澂《中国佛学源流略讲》(1979)、魏道儒《中国华严宗通史》(1998)
          **日本**: 镰田茂雄《中国华严思想史の研究》(1965)、
          木村清孝《初期中国华严思想の研究》(1977)、
          平川彰《印度佛教史》(1979)
          **西方**: Francis Cook, *Hua-yen Buddhism: The Jewel Net of Indra* (Penn State, 1977);
          Peter N. Gregory, *Tsung-mi and the Sinification of Buddhism* (Princeton, 1991);
          Thomas Cleary, *The Flower Ornament Scripture* (Shambhala, 1993, 全译本);
          Imre Hamar (ed.), *Reflecting Mirrors: Perspectives on Huayan Buddhism* (Harrassowitz, 2007)
        sources:
          - "以上著作均可在 Google Scholar / Goodreads / 豆瓣 检索"
          - "Cleary全译本: https://www.shambhala.com/the-flower-ornament-scripture.html"
        en_body: |
          **China**: Thomé H. Fang (Fang Dongmei), *The Philosophy of the Huayan
          School* (*Huayan zong zhexue*, 1980); Fang Litian, *A Critical Biography of
          Fazang* (*Fazang pingzhuan*, 2006); Lü Cheng, *Brief Lectures on the Origins
          and Development of Chinese Buddhism* (*Zhongguo foxue yuanliu lüejiang*,
          1979); Wei Daoru, *A Comprehensive History of Chinese Huayan* (*Zhongguo
          Huayan zong tongshi*, 1998).
          **Japan**: Kamata Shigeo, *A Study of the History of Chinese Huayan Thought*
          (1965); Kiyotaka Kimura, *A Study of Early Chinese Huayan Thought* (1977);
          Hirakawa Akira, *A History of Indian Buddhism* (1979).
          **The West**: Francis Cook, *Hua-yen Buddhism: The Jewel Net of Indra*
          (Penn State, 1977); Peter N. Gregory, *Tsung-mi and the Sinification of
          Buddhism* (Princeton, 1991); Thomas Cleary, *The Flower Ornament Scripture*
          (Shambhala, 1993, complete translation); Imre Hamar (ed.), *Reflecting
          Mirrors: Perspectives on Huayan Buddhism* (Harrassowitz, 2007).

  - id: global_research
    title: 全球华严研究
    title_en: Huayan Studies Worldwide
    icon: 🌐
    topics:
      - title: 华严学报 (Journal of Huayen Buddhism)
        title_en: Journal of Huayen Buddhism
        body: |
          台湾中华民国佛教华严学会于**2011年**创办的华严佛学专业学术半年刊。
          ISSN: 2222-6885 · 出版地: 新北市中和区
          主编/推动者: 海云继梦法师(时任华严学会导师·陕西师范大学华严研究所所长)
          已出版至第8期(2014.12), 电子版可在CEPS中文电子期刊服务查阅(覆盖2011.04-2021.06)。
          代表性论文主题: 华严经众生观与十地·佛境界与法界观想·
          澄观《华严法界玄镜》禅修哲学·华严在云南大理的传播·
          宋代三大士图像学·日本华严图像创新·华严思想与现代思潮
        links:
          huayenworld: "https://www.huayenworld.org (华严学术中心-学报各期目录与摘要)"
          ceps: "CEPS中文电子期刊服务 (2011-2021)"
          princeton_catalog: "https://catalog.princeton.edu/catalog/99125426018406421"
        en_body: |
          A professional semi-annual academic journal of Huayan Buddhist studies
          founded in **2011** by the Huayen Buddhist Society of the Republic of China
          (Taiwan). ISSN: 2222-6885 · Place of publication: Zhonghe District,
          New Taipei City. Editor-in-chief / driving force: Venerable Haiyun Jimeng
          (then spiritual guide of the Huayen Buddhist Society and director of the
          Huayan Research Institute of Shaanxi Normal University). It has published up
          to issue 8 (December 2014); the electronic edition is available through the
          CEPS Chinese Electronic Periodical Service (covering April 2011–June 2021).
          Representative paper topics: the Avataṃsaka view of sentient beings and the
          ten grounds; the buddha-realm and the visualization of the dharmadhātu;
          the meditation philosophy of Chengguan's *Huayan Fajie Xuanjing*; the spread
          of Huayan in Dali, Yunnan; the iconography of the three great sages in the
          Song dynasty; innovation in Japanese Huayan iconography; and Huayan thought
          in dialogue with modern currents of thought.

      - title: 国际华严研究关键著作
        title_en: Key Works in International Huayan Studies
        body: |
          (1) **Robert M. Gimello & Peter N. Gregory (eds.), *Studies in Ch'an and Hua-yen***
          University of Hawai'i Press, 1983. ISBN 978-0824808351
          开创性论文集, 含Gimello论李通玄·Gregory论宗密判教等。
          (2) **Imre Hamar (ed.), *Reflecting Mirrors: Perspectives on Huayan Buddhism***
          Harrassowitz Verlag, 2007. ISBN 978-3447055093
          欧洲华严研究的里程碑式论文集, 含12篇英文论文覆盖华严义学·历史·东亚传播。
          (3) **Francis H. Cook, *Hua-yen Buddhism: The Jewel Net of Indra***
          Penn State University Press, 1977. ISBN 978-0271021904
          西方第一本系统介绍华严宗的英文专著, 以因陀罗网为核心意象。
          (4) **Peter N. Gregory, *Tsung-mi and the Sinification of Buddhism***
          Princeton University Press, 1991. ISBN 978-0691073735
          华严五祖宗密的最权威英文研究, 获美国宗教学会图书奖。
          (5) **Thomas Cleary, *The Flower Ornament Scripture: A Translation of the Avatamsaka Sutra***
          Shambhala, 1993. ISBN 978-0877739401
          华严经英文全译本(据八十华严), 至今仍是英语世界最完整译本。
          (6) **Lancaster, Lewis R. & Sung-bae Park (eds.), *The Korean Buddhist Canon: A Descriptive Catalogue***
          University of California Press, 1979. 韩国大藏经目录学基础, 含华严经在韩国的流传与版本记录。
          (7) **Robert E. Buswell Jr. (ed.), *Religions of Korea in Practice***
          Princeton University Press, 2007. 含韩国华严宗实践研究专章。
          (8) **James Robson, *Power of Place: The Religious Landscape of the Southern Sacred Peak (Nanyue 南岳) in Medieval China***
          Oxford University Press, 2009. 含华严宗在南岳的传播与地方化研究。
        en_body: |
          (1) **Robert M. Gimello & Peter N. Gregory (eds.), *Studies in Ch'an and Hua-yen*** —
          University of Hawai'i Press, 1983. ISBN 978-0824808351. A pioneering
          collection of essays, including Gimello on Li Tongxuan and Gregory on
          Zongmi's doctrinal classification, among others.
          (2) **Imre Hamar (ed.), *Reflecting Mirrors: Perspectives on Huayan Buddhism*** —
          Harrassowitz Verlag, 2007. ISBN 978-3447055093. A landmark collection of
          European Huayan studies, containing twelve English papers covering Huayan
          doctrine, history, and East Asian transmission.
          (3) **Francis H. Cook, *Hua-yen Buddhism: The Jewel Net of Indra*** —
          Penn State University Press, 1977. ISBN 978-0271021904. The West's first
          systematic English monograph on the Huayan school, taking Indra's net as its
          central image.
          (4) **Peter N. Gregory, *Tsung-mi and the Sinification of Buddhism*** —
          Princeton University Press, 1991. ISBN 978-0691073735. The most authoritative
          English study of Zongmi, the fifth patriarch of Huayan; winner of an American
          Academy of Religion book award.
          (5) **Thomas Cleary, *The Flower Ornament Scripture: A Translation of the
          Avatamsaka Sutra*** — Shambhala, 1993. ISBN 978-0877739401. A complete English
          translation of the Avataṃsaka Sūtra (from the eighty-fascicle text) — to this
          day the most complete rendering in the English-speaking world.
          (6) **Lancaster, Lewis R. & Sung-bae Park (eds.), *The Korean Buddhist Canon: A Descriptive Catalogue*** —
          University of California Press, 1979. A foundational catalog of the Korean
          Buddhist canon, including records of the Avataṃsaka Sūtra's transmission and
          versions in Korea.
          (7) **Robert E. Buswell Jr. (ed.), *Religions of Korea in Practice*** —
          Princeton University Press, 2007. Contains a dedicated chapter on Korean Huayan
          (Hwaŏm) Buddhist practice.
          (8) **James Robson, *Power of Place: The Religious Landscape of the Southern
          Sacred Peak (Nanyue 南岳) in Medieval China*** — Oxford University Press, 2009.
          Includes research on the transmission and localization of the Huayan school at
          Mount Nanyue.

      - title: 国际学术期刊中的华严研究
        title_en: Huayan Studies in International Academic Journals
        body: |
          华严研究散见于以下国际期刊而非集中于单一刊物——
          **Journal of the International Association of Buddhist Studies**:
          Gregory, "The Teaching of Men and Gods: The Doctrinal and Social Basis of Lay Buddhist Practice in Hua-yen"
          **Journal of Chinese Philosophy**: Imre Hamar, "Interpretation of Yogācāra Philosophy in Huayan Buddhism" (2010)
          **Philosophy East and West**: Nicholaos Jones, "The Architecture of Fazang's Six Characteristics" (2019)
          **Hualin International Journal of Buddhist Studies** (华林国际佛学学刊): 华严研究多语论文
          **Journal of Global Buddhism**: Hammerstrom, "Avataṃsaka Transnationalism in Modern Sinitic Buddhism" (2016)
          **Korean Hwaŏm 研究**: 《普照思想》(Pojo sasang)·《韩国佛教学》(Han'guk Pulgyohak) 大量刊载知讷·义湘·均如等韩国华严祖师研究
          **日本华严/华厳研究**: 《印度学佛教学研究》·《东方学报》·《仏教学研究》 刊载镰田茂雄·木村清孝·伊藤瑞叡等论文
          **Chinese Buddhist Studies**: 《世界宗教研究》·《佛学研究》·《中国哲学史》 刊载魏道儒·王颂·邱高兴·张文良等当代学者论文
          **Journal of the International Association of Tibetan Studies**: 藏文华严经(Toh44)校勘与翻译研究
          **Annual of the Society for the Study of Religion** (日本宗教学会年報): 华严与日本佛教思想研究
          **Religions** (MDPI): 2025-2026年多篇华严研究论文
        en_body: |
          Huayan research is scattered across the following international journals
          rather than concentrated in a single periodical —
          **Journal of the International Association of Buddhist Studies**:
          Gregory, "The Teaching of Men and Gods: The Doctrinal and Social Basis of Lay Buddhist Practice in Hua-yen"
          **Journal of Chinese Philosophy**: Imre Hamar, "Interpretation of Yogācāra Philosophy in Huayan Buddhism" (2010)
          **Philosophy East and West**: Nicholaos Jones, "The Architecture of Fazang's Six Characteristics" (2019)
          **Hualin International Journal of Buddhist Studies**: multilingual papers on Huayan
          **Journal of Global Buddhism**: Hammerstrom, "Avataṃsaka Transnationalism in Modern Sinitic Buddhism" (2016)
          **Korean Hwaŏm studies**: journals such as *Pojo sasang* and *Han'guk
          Pulgyohak* carry many studies of Korean Huayan patriarchs such as Chinul,
          Ŭisang, and Kyunyŏ.
          **Japanese Kegon studies**: journals such as *Indogaku Bukkyōgaku kenkyū*
          (Journal of Indian and Buddhist Studies), *Tōhō gakuhō*, and *Bukkyōgaku
          kenkyū* carry papers by Kamata Shigeo, Kiyotaka Kimura, Itō Zuiei, and others.
          **Chinese Buddhist Studies**: *World Religions Research* (*Shijie zongjiao
          yanjiu*), *Buddhist Studies* (*Foxue yanjiu*), and *History of Chinese
          Philosophy* (*Zhongguo zhexue shi*) publish papers by contemporary scholars
          such as Wei Daoru, Wang Song, Qiu Gaoxing, and Zhang Wenliang.
          **Journal of the International Association of Tibetan Studies**: studies on
          the collation and translation of the Tibetan Avataṃsaka (Toh44).
          **Annual of the Society for the Study of Religion** (Japan): research on Huayan
          and Japanese Buddhist thought.
          **Religions** (MDPI): multiple Huayan studies papers in 2025-2026.

      - title: 东亚华严研究重镇
        title_en: Major Centers of Huayan Studies in East Asia
        body: |
          **中国**: 陕西师范大学华严研究所(海云继梦曾任所长)·南京大学·复旦大学·北京大学·中国人民大学·中国社会科学院·浙江大学·中山大学
          **台湾**: 中华民国佛教华严学会·华严专宗学院·华严莲社(贤度法师)·法鼓文理学院·佛光大学·慈济大学·玄奘大学
          **日本**: 大谷大学(Otani)·龙谷大学(Ryukoku)·东京大学·京都大学人文科学研究所·驹泽大学·立正大学·东北大学
          **韩国**: 东国大学(Dongguk)·中央僧伽大学·普照思想研究院·海印寺教学院·全州大学
          **欧美**: University of Hawai'i·Stanford·Harvard·Columbia·SOAS(London)·Eötvös Loránd(Budapest, Hamar所在)·UC Berkeley·Yale·Princeton·Oxford·Cambridge
          **南亚/东南亚**: University of Calcutta·University of Delhi·Mahachulalongkornrajavidyalaya University(泰国)·University of the Philippines
        en_body: |
          **China**: Huayan Research Institute of Shaanxi Normal University (Haiyun
          Jimeng once served as its director) · Nanjing University · Fudan University ·
          Peking University · Renmin University of China · Chinese Academy of Social
          Sciences · Zhejiang University · Sun Yat-sen University
          **Taiwan**: Huayen Buddhist Society of the Republic of China · Huayan
          Monastic Institute (Huayan College) · Huayan Lotus Society (Venerable
          Xiandu) · Dharma Drum Graduate School of Humanities · Fo Guang University ·
          Tzu Chi University · Hsuan Chuang University
          **Japan**: Ōtani University · Ryukoku University · University of Tokyo ·
          Institute for Research in Humanities, Kyoto University · Komazawa
          University · Risshō University · Tōhoku University
          **Korea**: Dongguk University · Jung-ang Sangha University · National
          Institute of Bojo Thought · Haein-sa Monastic Academy · Chonbuk National
          University
          **Europe and America**: University of Hawai'i · Stanford · Harvard ·
          Columbia · SOAS (London) · Eötvös Loránd (Budapest, where Hamar is based) ·
          UC Berkeley · Yale · Princeton · Oxford · Cambridge
          **South and Southeast Asia**: University of Calcutta · University of Delhi ·
          Mahachulalongkornrajavidyalaya University (Thailand) · University of the
          Philippines

      - title: 华严经学研究方法论
        title_en: Research Methodologies in the Academic Study of the Avataṃsaka Sūtra
        body: |
          现代华严经学研究的五个主要进路:
          (1) **历史文献学进路**: 文本校勘·成经史重构·译本比较(印顺·木村清孝·平川彰)
          (2) **哲学义理学进路**: 法界缘起·四法界·六相十玄的逻辑结构与哲学意涵(Francis Cook·方立天·Hamar)
          (3) **跨文化/跨学科进路**: 华严与系统论·全息论·AI神经网络的对话(Capra·Varela·环保伦理学)
          (4) **比较宗教学进路**: 华严与基督教·印度教·伊斯兰教神秘主义的比较研究(Nakamura Hajime·Hajime Nakamura·Wayne Teasdale)
          (5) **社会历史学进路**: 华严宗的制度史·经济史·政治影响力研究(严耕望·陈寅恪·Tang Yongtong)
          五种进路互补——历史文献学提供事实基础, 哲学义理学展释义理深度,
          跨学科进路开拓当代对话空间, 比较宗教学拓展全球视野, 社会历史学揭示制度背景。
        en_body: |
          Five main approaches in modern academic study of the Avataṃsaka Sūtra:
          (1) **Historical-philological approach**: textual criticism, reconstruction
          of the history of the sūtra's formation, and comparison of translations
          (Yinshun, Kiyotaka Kimura, Hirakawa Akira).
          (2) **Philosophical-doctrinal approach**: the logical structure and
          philosophical import of dharmadhātu conditionality, the four dharmadhātus,
          and the six characteristics and ten mysterious gates (Francis Cook, Fang
          Litian, Hamar).
          (3) **Cross-cultural / interdisciplinary approach**: dialogue between Huayan
          and systems theory, holographism, and AI neural networks (Capra, Varela,
          environmental ethics).
          (4) **Comparative religion approach**: comparative studies of Huayan with
          Christianity, Hinduism, and Islamic mysticism (Nakamura Hajime, Wayne
          Teasdale).
          (5) **Socio-historical approach**: institutional history, economic history,
          and political influence of the Huayan school (Yan Gengwang, Chen Yinke,
          Tang Yongtong).
          The five approaches are complementary — the historical-philological
          approach supplies the factual foundation, the philosophical-doctrinal
          approach unfolds the depth of the doctrine, the interdisciplinary
          approach opens up a space for contemporary dialogue, the comparative
          religion approach expands global horizons, and the socio-historical
          approach reveals the institutional context.

  - id: dharma_teachers
    title: 教内华严思想与修行
    title_en: Huayan Thought and Practice within Buddhist Traditions
    icon: 🙏
    topics:
      - title: 海云继梦法师·华严思想体系
        title_en: "Venerable Haiyun Jimeng: The Huayan Thought System"
        body: |
          海云继梦法师(1950-)，当代台湾华严宗代表人物，大华严寺创办人。
          「九九華嚴」结构诠释：将《八十华严》(前59卷) +《四十华严》(后40卷) = 「九九華嚴」，
          形成「理行圆融」的整体架构——八十华严为「理」(思想基础)，四十华严为「行」(实修行愿)。
          核心著作: 《九九華嚴玄談》5册(空庭书苑, 2026)·《华严经导读》系列·《华严思想的承先与启后》·《探玄記懸談講記》。
          修行体系: 提出「修行蓝图」三阶段(资粮道→加行道→见道→修道→无学道)，
          强调华严经是「完整的生命改造工程手册」。
          YouTube频道: @huayen-world，系统讲授华严经导读·九九華嚴·禅观法要·实修心要。
          学术贡献: 推动华严学与现代学术的对话，创办华严学会与华严学报，促进国际华严研究。
        en_body: |
          Venerable Haiyun Jimeng (1950–), contemporary representative of Taiwanese
          Huayan Buddhism, founder of the Great Huayan Monastery. "Nine-Nine Huayan"
          structural interpretation: combining the *eighty-fascicle Avataṃsaka* (first
          59 fascicles) plus the *forty-fascicle Avataṃsaka* (last 40 fascicles) =
          "Nine-Nine Huayan," forming an integrated framework of the "perfect fusion
          of principle and practice" — the eighty-fascicle text is the "principle" (the
          intellectual foundation), and the forty-fascicle text is the "practice"
          (actual practice and vows). Core works: *Jiujiu Huayan Xuantan*, 5 volumes
          (Kongting College of Buddhist Studies, 2026), *Avataṃsaka Sūtra Guide*
          series, *Huayan Thought: Inheriting the Past and Opening the Future*, and
          *Lectures on the Xuantanji*. Practice system: proposes a three-stage
          "Practice Blueprint" (resource path → preparation path → seeing path →
          cultivation path → no-learning path), emphasizing that the Avataṃsaka Sūtra
          is "a complete manual for the engineering of transforming one's life."
          YouTube channel: @huayen-world, systematically teaching Avataṃsaka Sūtra
          guides, Nine-Nine Huayan, Chan contemplation essentials, and practical
          cultivation essentials. Academic contributions: promoting dialogue between
          Huayan studies and modern academia, founding the Huayen Buddhist Society and
          the Journal of Huayen Buddhism, advancing international Huayan research.

      - title: 贤度法师·华严专宗学院
        title_en: "Venerable Xiandu: Huayan Monastic Institute"
        body: |
          贤度法师(Bhiksuni Xiandu, 1937-)，华严莲社住持，华严专宗学院院长，
          智光老和尚法孙，致力于华严义学的学院化研究与教学。
          代表作: 《华严经讲义》系列·《华严学概论》。
          学术贡献: 对华严经的「七处九会」结构、「信解行证」四分科判、以及华严判教体系有系统性的现代阐述。
          其讲记注重文献学考辨与修行实践的结合，为当代学院化的华严义学研究提供了重要范本。
          华严专宗学院: 位于台北，是华严宗的专修学院，系统教授华严经·华严义学·华严修行。
        en_body: |
          Venerable Xiandu (Bhikṣuṇī Xiandu, 1937–), abbess of the Huayan Lotus
          Society (Huayan Lianshe) and president of the Huayan Monastic Institute
          (Huayan College), is a dharma-grandson of the Elder Zhiguang, devoted to
          the academic study and teaching of Huayan doctrine. Representative works:
          *Lectures on the Avataṃsaka Sūtra* series and *An Introduction to Huayan
          Studies*. Academic contributions: systematic modern expositions of the
          "seven places and nine assemblies" structure, the four-part structure of
          "faith, understanding, practice, and realization," and the Huayan doctrinal
          classification system. Her lecture notes combine philological investigation
          with practice, offering an important model for the contemporary academic
          study of Huayan doctrine. The Huayan Monastic Institute: located in Taipei,
          a specialized institute for Huayan studies, systematically teaching the
          Avataṃsaka Sūtra, Huayan doctrine, and Huayan practice.

      - title: 慈舟法师·华严行法研究
        title_en: "Venerable Cizhou: Huayan Practice Studies"
        body: |
          慈舟法师(1877-1958)，近代华严宗高僧，持松法师弟子，华严宗第42世传人。
          代表作: 《华严经普贤行愿品讲义》·《华严经疏钞演讲集》。
          学术贡献: 强调华严经的修行实践，将华严义理与念佛·持咒·禅修相结合，
          提出「华严念佛」的修行体系，对近现代华严修行有重要影响。
          弟子传承: 弟子贤度法师继承其华严法脉，成为华严莲社第三代住持。
        en_body: |
          Venerable Cizhou (1877–1958), modern Huayan patriarch, disciple of Venerable
          Chisong, 42nd generation lineage holder of the Huayan school. Representative
          works: *Lectures on the Samantabhadra Chapter of the Avataṃsaka Sūtra* and
          *Lectures on the Avataṃsaka Sūtra Commentary*. Academic contributions:
          emphasizing the practical cultivation of the Avataṃsaka Sūtra, combining
          Huayan doctrine with Buddha-recitation, mantra recitation, and meditation
          practice, proposing a "Huayan Buddha-recitation" system of cultivation that
          had significant influence on modern Huayan practice. Lineage transmission:
          disciple Venerable Xiandu inherited his Huayan dharma lineage, becoming the
          third-generation abbess of the Huayan Lotus Society.

      - title: 太虚大师·华严判教思想
        title_en: "Master Taixu: Huayan Doctrinal Classification"
        body: |
          太虚大师(1890-1947)，近代佛教改革运动领袖，对华严判教有独到见解。
          在《整理僧伽制度论》·《法相唯识学》等著作中，对华严宗的判教体系提出批判性反思。
          核心观点: 主张「八宗平等」，反对将华严宗判为最高，认为各宗各有其殊胜。
          对华严与唯识的关系有深入分析，提出「法界圆觉」与「唯识变现」的互补性。
          学术贡献: 推动近代佛教的理性化研究，对华严宗的历史地位有客观评价。
        en_body: |
          Master Taixu (1890–1947), leader of the modern Buddhist reform movement,
          offered unique perspectives on Huayan doctrinal classification. In works
          such as *On the Reorganization of the Saṅgha* and *Yogācāra Studies*, he
          proposed critical reflections on the Huayan school's classification system.
          Core viewpoint: advocating "equality of the eight schools," opposing the
          placement of the Huayan school as the highest, believing each school has its
          own excellence. In-depth analysis of the relationship between Huayan and
          Yogācāra, proposing the complementarity of "dharmadhātu perfect
          enlightenment" and "consciousness-only transformation." Academic
          contributions: promoting rationalized study of modern Buddhism, providing
          objective evaluation of the historical status of the Huayan school.

      - title: 印顺法师·华严经文献学研究
        title_en: "Venerable Yinshun: Avataṃsaka Sūtra Philological Studies"
        body: |
          印顺法师(1906-2005)，台湾佛教导师，当代最重要的佛教思想家之一。
          在《初期大乘佛教之起源与开展》第十三章「华严法门」中，从文献学角度分析华严经的形成过程。
          核心观点: 华严经是「从单品到大集」的渐进编纂过程，非一次性成书。
          强调华严经与般若经·法华经·涅槃经等大乘经典的关联性。
          学术贡献: 从佛教思想史角度还原华严经的形成过程，为华严经文献学研究奠定基础。
          其他相关著作: 《印度之佛教》·《中国禅宗史》等对华严宗有间接论述。
        en_body: |
          Venerable Yinshun (1906–2005), Taiwanese Buddhist master, one of the most
          important modern Buddhist thinkers. In Chapter 13 "The Huayan Dharma Gate"
          of *The Origins and Development of Early Mahāyāna Buddhism*, he analyzes
          the formation process of the Avataṃsaka Sūtra from a philological
          perspective. Core viewpoint: the Avataṃsaka Sūtra underwent a gradual
          process of compilation "from individual scriptures to a great collection,"
          not composed in a single instance. Emphasizes the connections between the
          Avataṃsaka Sūtra and the Prajñāpāramitā, Saddharmapuṇḍarīka, and
          Mahāparinirvāṇa sūtras. Academic contributions: reconstructing the
          formation process of the Avataṃsaka Sūtra from the perspective of Buddhist
          intellectual history, laying the foundation for Avataṃsaka Sūtra
          philological studies. Other related works: *Indian Buddhism* and *History
          of Chinese Chan Buddhism* contain indirect discussions of the Huayan school.

      - title: 近现代华严修行传承
        title_en: Modern and Contemporary Huayan Practice Lineages
        body: |
          近现代华严修行传承的主要脉络:
          (1) **月霞系**(1861-1917): 月霞法师·慈舟法师·应慈法师→华严宗复兴的重要力量
          (2) **华严莲社系**(1949-): 智光老和尚→贤度法师→华严专宗学院·学院化华严修行
          (3) **大华严寺系**(1980-): 海云继梦法师→九九華嚴·修行蓝图·国际化华严传播
          (4) **日本华严系**: 明惠上人(1173-1232)中兴→当代日本华严宗修行传统
          (5) **韩国华严系**: 知讷(1158-1210)→高丽华严禅修行传统
          各传承在修行方法上各有侧重，但都以华严经为根本经典。
        en_body: |
          The main lineages of modern and contemporary Huayan practice:
          (1) **Yuexia lineage** (1861–1917): Venerable Yuexia → Venerable Cizhou →
          Venerable Yingci → important force in the revival of the Huayan school.
          (2) **Huayan Lotus Society lineage** (1949–): Elder Zhiguang → Venerable
          Xiandu → Huayan Monastic Institute → academic Huayan practice.
          (3) **Great Huayan Monastery lineage** (1980–): Venerable Haiyun Jimeng →
          Nine-Nine Huayan → Practice Blueprint → international Huayan propagation.
          (4) **Japanese Kegon lineage**: Myōe Shōnin (1173–1232) revival →
          contemporary Japanese Kegon practice tradition.
          (5) **Korean Hwaŏm lineage**: Chinul (1158–1210) → Goryeo Hwaŏm Chan
          practice tradition.
          Each lineage has its own emphasis in practice methods, but all take the
          Avataṃsaka Sūtra as their fundamental scripture.

  - id: textual_studies
    title: 华严经文献学研究
    title_en: Textual Studies of the Avataṃsaka Sūtra
    icon: 📜
    topics:
      - title: 梵文华严经本研究
        title_en: Sanskrit Manuscript Studies of the Avataṃsaka Sūtra
        body: |
          梵文华严经本的研究现状:
          (1) **现存梵本**: 主要为单品残本，如《十地经》(Daśabhūmika Sūtra)、《入法界品》(Gaṇḍavyūha)等。
          (2) **重要抄本**: 尼泊尔写本(11-12世纪)、于阗写本(部分)、西藏梵夹写本。
          (3) **校勘成果**: Sylvain Lévi校订《十地经》(Journal Asiatique, 1907-1908)、
          立花俊道校订《华严经梵文残卷》(大正大学, 1930)、
          日本印度学佛教学会《梵文华严经》系列校订。
          (4) **学术意义**: 梵本校勘为华严经的文本形成史提供关键证据，揭示从印度单品到于阗大集的编纂过程。
          (5) **84000项目**: 正在进行梵文华严经的现代校勘与英译，已完成部分品目。
        en_body: |
          Current status of Sanskrit manuscript studies of the Avataṃsaka Sūtra:
          (1) **Extant Sanskrit texts**: mainly fragmentary individual scriptures, such
          as the *Daśabhūmika Sūtra* and the *Gaṇḍavyūha*.
          (2) **Important manuscripts**: Nepalese manuscripts (11th–12th centuries),
          Khotanese manuscripts (partial), Tibetan dbar-tscha manuscripts.
          (3) **Critical editions**: Sylvain Lévi's edition of the *Daśabhūmika Sūtra*
          (Journal Asiatique, 1907–1908), Tatsuhito Tachibana's edition of Sanskrit
          Avataṃsaka fragments (Taishō University, 1930), the Sanskrit Avataṃsaka
          critical edition series by the Japanese Association of Indian and Buddhist
          Studies.
          (4) **Academic significance**: Sanskrit textual criticism provides key
          evidence for the history of the sūtra's formation, revealing the
          compilation process from Indian individual scriptures to the Khotanese
          great collection.
          (5) **84000 Project**: currently conducting modern critical editions and
          English translations of the Sanskrit Avataṃsaka, with some chapters
          already completed.

      - title: 藏文华严经(Toh44)研究
        title_en: Studies of the Tibetan Avataṃsaka (Toh44)
        body: |
          藏文《华严经》(Toh44)的研究现状:
          (1) **版本**: 藏文大藏经《甘珠尔》中收录，共45品，译自于阗本。
          (2) **与汉文差异**: 比汉文三译多2品(如来华严品·普贤宣说品)，结构组织有差异。
          (3) **校勘**: BDRC(藏传佛教资源中心)提供数字化校勘本，日本东北大学推进梵藏汉对校。
          (4) **翻译**: 84000项目正在翻译Toh44，已完成入法界品(Toh44-44, 2021)等。
          (5) **学术意义**: 藏文华严经保留了于阗本的特征，为研究华严经的中亚传承提供重要文本依据。
        en_body: |
          Current status of studies of the Tibetan Avataṃsaka (Toh44):
          (1) **Version**: contained in the Tibetan Buddhist canon (*Kangyur*), 45
          chapters total, translated from the Khotanese text.
          (2) **Differences from Chinese**: two chapters more than the three Chinese
          translations (the *Chapter on the Tathāgata's Avataṃsaka* and the *Chapter
          on Samantabhadra's Proclamation*), with structural and organizational
          differences.
          (3) **Critical editions**: BDRC (Buddhist Digital Resource Center) provides
          digitized critical editions; Tohoku University is advancing Sanskrit-Tibetan-
          Chinese comparative collation.
          (4) **Translation**: the 84000 Project is translating Toh44, with the
          *Gaṇḍavyūha* (Toh44-44, 2021) already completed.
          (5) **Academic significance**: the Tibetan Avataṃsaka preserves features of
          the Khotanese text, providing important textual evidence for studying the
          Central Asian transmission of the Avataṃsaka Sūtra.

      - title: 于阗文华严经研究
        title_en: Khotanese Avataṃsaka Studies
        body: |
          于阗文华严经的研究现状:
          (1) **历史背景**: 于阗(今新疆和田)是华严经的最终编纂地，于阗文是华严经的早期传播语言之一。
          (2) **现存文献**: 于阗文华严经残卷(部分品目)，收藏于大英图书馆·法国国家图书馆·新疆博物馆等。
          (3) **语言特征**: 于阗文属中古伊朗语支，与梵文有密切接触，华严经中出现的"ysa"一词即为于阗文特征。
          (4) **学术研究**: Bailey, Emmerick等学者校订于阗文华严经残卷；日本学者推进于阗文与汉文华严经的对勘。
          (5) **学术意义**: 于阗文华严经为华严经在于阗的编纂与传播提供直接语言证据，是华严经文献学研究的关键环节。
        en_body: |
          Current status of Khotanese Avataṃsaka studies:
          (1) **Historical background**: Khotan (modern Hotan, Xinjiang) was the final
          place of compilation of the Avataṃsaka Sūtra; the Khotanese language was one
          of the early languages of transmission.
          (2) **Extant documents**: Khotanese Avataṃsaka fragments (partial chapters),
          housed in the British Library, Bibliothèque nationale de France, Xinjiang
          Museum, etc.
          (3) **Linguistic features**: Khotanese belongs to the Middle Iranian branch,
          with close contact with Sanskrit; the word "ysa" appearing in the Avataṃsaka
          is a Khotanese linguistic feature.
          (4) **Academic research**: Bailey, Emmerick, and other scholars have edited
          Khotanese Avataṃsaka fragments; Japanese scholars are advancing comparative
          collation of Khotanese and Chinese Avataṃsaka texts.
          (5) **Academic significance**: the Khotanese Avataṃsaka provides direct
          linguistic evidence for the compilation and transmission of the Avataṃsaka
          Sūtra in Khotan, a key link in Avataṃsaka textual studies.

      - title: 华严经版本学与校勘学
        title_en: Avataṃsaka Sūtra Bibliography and Textual Criticism
        body: |
          华严经版本学与校勘学的主要成果:
          (1) **汉文版本**: 六十华严(唐·实叉难陀译)·八十华严(唐·实叉难陀译)·四十华严(唐·般若译)三译本的版本比较。
          (2) **CBETA校勘**: 中华电子佛典协会对汉文华严经三译本的数字化校勘，提供异文对照。
          (3) **梵藏汉对校**: 日本东北大学·84000项目推进梵文·藏文·汉文华严经的多语对校。
          (4) **敦煌写本**: 敦煌藏经洞出土的华严经写本，为研究华严经在中国的早期流传提供实物证据。
          (5) **学术意义**: 版本学与校勘学为华严经的文本可靠性提供保障，为义理研究奠定文献基础。
        en_body: |
          Major achievements in Avataṃsaka Sūtra bibliography and textual criticism:
          (1) **Chinese versions**: comparative study of the three translation versions —
          the sixty-fascicle (Jin), eighty-fascicle (Tang), and forty-fascicle (Tang)
          translations.
          (2) **CBETA critical edition**: the Chinese Buddhist Electronic Text
          Association's digital critical edition of the three Chinese Avataṃsaka
          translations, providing variant readings.
          (3) **Sanskrit-Tibetan-Chinese collation**: Tohoku University and the 84000
          Project are advancing multilingual collation of Sanskrit, Tibetan, and
          Chinese Avataṃsaka texts.
          (4) **Dunhuang manuscripts**: Avataṃsaka manuscripts excavated from the
          Dunhuang library cave, providing material evidence for the early
          transmission of the Avataṃsaka Sūtra in China.
          (5) **Academic significance**: bibliography and textual criticism guarantee
          the textual reliability of the Avataṃsaka Sūtra, laying the documentary
          foundation for doctrinal studies.

  - id: recent_research
    title: 2024-2026年最新研究动态
    title_en: Latest Research Developments (2024–2026)
    icon: 🔬
    topics:
      - title: 2026年最新学术论文
        title_en: Latest Academic Papers (2026)
        body: |
          2026年华严研究的最新学术进展——
          (1) **Imre Hamar (2026)** "Avataṃsaka Meditation in Khotan: Samādhi, Visualization, and the Cult of Buddha Images"
          *Religions* 17(2):135. 研究于阗华严佛教禅定修行与佛像崇拜的关系，
          分析Devendraprajñā翻译的两部华严禅定文本(*Bhadrakarī Sūtra*和*Duravāsas Sūtra*)，
          揭示华严禅定中的可视化修行实践(Visualization Meditation)在中亚的传播。
          (2) **Saiping An (2026)** "Science in Huayan Buddhism: The Apologetic Discourse of Zhong Maosen (b. 1973)"
          *Religions* 17(3):309. 分析当代中国华严学者钟茂森用现代物理学(弦理论·量子力学·多维空间)
          为华严经「一多相容·事事无碍」思想进行科学辩护的论述策略。
          (3) **Jing Liu (2025)** "Studies on the Buddhāvataṃsaka-sūtra"
          *Journal of East Asian Cultures* 17/1:1-20. 综合检视华严经三大汉译本的翻译策略差异、
          华严感应故事集的文学传统、以及善财童子五十三参的叙事结构。
        en_body: |
          Latest scholarly developments in Huayan studies for 2026 —
          (1) **Imre Hamar (2026)** "Avataṃsaka Meditation in Khotan: Samādhi, Visualization, and the Cult of Buddha Images"
          *Religions* 17(2):135. Studies the relationship between Huayan Buddhist meditation and Buddha-image
          worship in Khotan, analyzing two Avataṃsaka meditation texts translated by Devendraprajñā
          (*Bhadrakarī Sūtra* and *Duravāsas Sūtra*), revealing the transmission of visualization
          meditation practices in Central Asian Huayan Buddhism.
          (2) **Saiping An (2026)** "Science in Huayan Buddhism: The Apologetic Discourse of Zhong Maosen (b. 1973)"
          *Religions* 17(3):309. Analyzes contemporary Chinese Huayan scholar Zhong Maosen's use of modern
          physics (string theory, quantum mechanics, multidimensional space) as an apologetic strategy
          for the Avataṃsaka Sūtra's doctrines of "interpenetration of one and many" and "unimpeded
          interpenetration of all phenomena."
          (3) **Jing Liu (2025)** "Studies on the Buddhāvataṃsaka-sūtra"
          *Journal of East Asian Cultures* 17/1:1-20. A comprehensive examination of translation strategy
          differences across the three Chinese Avataṃsaka translations, the literary tradition of Huayan
          miracle tales, and the narrative structure of Sudhana's fifty-three pilgrimages.
        sources:
          - "Hamar, I. (2026). Religions 17(2):135"
          - "An, S. (2026). Religions 17(3):309"
          - "Liu, J. (2025). Journal of East Asian Cultures 17/1:1-20"

      - title: 2025年学术专著与论文
        title_en: Academic Monographs and Papers (2025)
        body: |
          2025年华严研究的重要成果——
          (1) **Zhang Y. (2025)** "A Sanctuary of Avataṃsaka: The Theoretical and Practical Studies on Huayan Buddhism Embodied in the Sculptures of the Huayan Grotto in Anyue"
          *Religions* 16(4):438. 研究安岳华严洞石窟(四川)中唐代石刻造像所体现的华严佛教理论与实践，
          分析柳赵教派(柳本尊·赵智凤)的华严思想体系及其在巴蜀地区的传播。
          (2) **Li Kang (2025)** "How It All Depends: A Contemporary Reconstruction of Huayan Buddhism"
          *Oxford Handbook of Chinese Philosophy*. 用当代本体论方法(ontological methodology)重构华严
          相互依存理论(Huayan interdependence)，与当代形而上学对话。
          (3) **Harvey D. (2025)** *On the Integration of Eastern and Western Spiritual Practices*
          McGraw Hill. 包含华严佛教与基督教神秘主义的比较研究专章。
          (4) **杨维中 (2026)** "《华严经》的形成、汉译、基本思想及其修行论意义"
          系统研究华严经从印度单品到于阗大集的形成过程，三大汉译本的翻译策略，
          以及华严经「法界缘起·心佛众生三无差别」的核心思想与修行论意义。
        en_body: |
          Important achievements in Huayan studies for 2025 —
          (1) **Zhang Y. (2025)** "A Sanctuary of Avataṃsaka: The Theoretical and Practical Studies on Huayan Buddhism Embodied in the Sculptures of the Huayan Grotto in Anyue"
          *Religions* 16(4):438. Studies the Tang dynasty stone sculptures at the Huayan Grotto in Anyue
          (Sichuan) as embodying Huayan Buddhist theory and practice, analyzing the Huayan thought system
          of the Liu-Zhao school (Liu Benzun · Zhao Zhifeng) and its transmission in the Ba-Shu region.
          (2) **Li Kang (2025)** "How It All Depends: A Contemporary Reconstruction of Huayan Buddhism"
          *Oxford Handbook of Chinese Philosophy*. Reconstructs Huayan interdependence theory through
          contemporary ontological methodology, engaging in dialogue with contemporary metaphysics.
          (3) **Harvey D. (2025)** *On the Integration of Eastern and Western Spiritual Practices*
          McGraw Hill. Contains dedicated chapters comparing Huayan Buddhism with Christian mysticism.
          (4) **Yang Weizhong (2026)** "The Formation, Chinese Translation, Basic Ideas, and Soteriological Significance of the Avataṃsaka Sūtra"
          A systematic study of the Avataṃsaka's formation from Indian individual sutras to the Khotanese
          compilation, translation strategies across the three Chinese versions, and the core doctrines of
          "dharmadhātu conditionality" and "no difference between mind, buddha, and sentient beings."
        sources:
          - "Zhang Y. (2025). Religions 16(4):438"
          - "Li Kang (2025). Oxford Handbook of Chinese Philosophy"
          - "Harvey D. (2025). McGraw Hill"
          - "杨维中 (2026). 地藏论坛"

      - title: 2024年重要学术成果
        title_en: Key Academic Achievements (2024)
        body: |
          2024年华严研究的重要成果——
          (1) **Stanford Encyclopedia of Philosophy (2024修订)** "Huayan Buddhism" 词条
          2024年9月进行实质性修订，更新了华严宗五祖思想的哲学分析、
          当代西方学者(如Cook·Gregory·Hamar·Jones)的研究综述、以及华严与当代哲学的对话。
          (2) **释观慧 (2024)** "《大方廣佛華嚴經》經題之「大」、「方」、「廣」要義探究"
          华梵大学印度与中国佛学系硕士论文。从梵文语源学角度分析华严经题中
          "Mahā"(大)·"Samanta"(方)·"Vipula"(广)三字的佛教哲学意涵。
          (3) **傅及斯 (2024)** "杭州国家版本馆新入藏《华严经》探微"
          *浙江大学学报*. 研究杭州国家版本馆新入藏的敦煌写本华严经的文献学价值，
          对写本的年代·抄写者·文本特征进行详细考证。
          (4) **李治华 (2024)** "《華嚴經》與《楞嚴經》的菩薩階位比較再探"
          华严专宗国际学术研讨会论文集。比较华严经与楞严经中的菩萨阶位系统(十信·十住·十行·十回向·十地)，
          揭示两经在修行次第上的异同。
          (5) **郭朝顺 (2025)** "论《修华严奥旨妄尽还源观》作为汉传佛教修行实践心理学的基本架构"
          *佛光学报*. 从修行实践心理学角度解读法藏《修华严奥旨妄尽还源观》，
          分析华严禅观中的「妄尽还源」(extinction of delusions and return to the source)
          作为佛教心理学的基本架构。
        en_body: |
          Key academic achievements in Huayan studies for 2024 —
          (1) **Stanford Encyclopedia of Philosophy (2024 revision)** "Huayan Buddhism" entry
          Substantially revised in September 2024, updating the philosophical analysis of the five Huayan
          patriarchs' thought, research surveys by contemporary Western scholars (Cook, Gregory, Hamar,
          Jones), and the dialogue between Huayan and contemporary philosophy.
          (2) **Śramaṇa Guànhuì (2024)** "An Inquiry into the Key Meanings of 'Great,' 'Square,' and 'Vast'
          in the Title of the *Mahāvaipulya Buddhāvataṃsaka Sūtra*"
          Master's thesis, Huafan University. Analyzes the Buddhist philosophical connotations of the three
          Sanskrit terms "Mahā" (great), "Samanta" (square/universal), and "Vipula" (vast) in the sūtra
          title from the perspective of Sanskrit etymology.
          (3) **Fu Jisi (2024)** "A Preliminary Study of the Newly Acquired *Avataṃsaka Sūtra* at the
          Hangzhou National Archives"
          *Zhejiang University Journal*. Studies the philological value of a newly acquired Dunhuang
          manuscript of the Avataṃsaka Sūtra, with detailed textual research on its date, scribe,
          and textual features.
          (4) **Li Zhihua (2024)** "A Re-examination of the Comparison of Bodhisattva Stages in the
          *Avataṃsaka Sūtra* and the *Śūraṅgama Sūtra*"
          Proceedings of the International Academic Conference on Huayan Buddhism. Compares the bodhisattva
          stage systems (ten faiths, ten abodes, ten practices, ten transfers, ten grounds) across the two
          sūtras, revealing similarities and differences in their cultivation sequences.
          (5) **Guo Chaoshun (2025)** "On the *Xiu Huayan Aozhi Wangjin Huayuan Guan* as the Basic
          Framework of East Asian Buddhist Practice and Psychological Architecture"
          *Fo Guang Journal*. Interprets Fazang's *Xiu Huayan Aozhi Wangjin Huayuan Guan* from the
          perspective of practice psychology, analyzing the "extinction of delusions and return to the
          source" (*wangjin huayuan*) as the basic framework of Huayan contemplative psychology.
        sources:
          - "Stanford Encyclopedia of Philosophy, Huayan Buddhism (2024 revision)"
          - "释观慧 (2024). 华梵大学硕士论文"
          - "傅及斯 (2024). 浙江大学学报"
          - "李治华 (2024). 华严专宗国际学术研讨会论文集"
          - "郭朝顺 (2025). 佛光学报"

      - title: Stanford Encyclopedia of Philosophy华严词条详解
        title_en: Stanford Encyclopedia of Philosophy — Huayan Buddhism Entry in Detail
        body: |
          Stanford Encyclopedia of Philosophy (SEP)的"Huayan Buddhism"词条是英语世界最权威的华严哲学概述。
          2024年9月进行了实质性修订，主要涵盖——
          (1) **华严宗五祖思想的哲学分析**: 从杜顺法界观→智俨十玄→法藏五教→澄观三圣圆融→宗密禅教一致，
          以分析哲学方法重新诠释各祖师的核心范畴。
          (2) **十玄门的逻辑结构**: Nicholaos Jones (2019)的分析——六相圆融(Fazang's six characteristics)
          作为华严的认识论基础，如何与当代逻辑学(模态逻辑·可能世界语义)对话。
          (3) **事事无碍的形上学**: 以当代形而上学方法(可能世界·反事实条件句)重构华严「一即一切」命题。
          (4) **当代学者研究综述**: Cook(1977)·Gregory(1991)·Hamar(2007)·Lai(2003)·
          McGraw(2017, 2025)·Shields(2024)·Jones(2019)等。
          (5) **华严与当代哲学对话**: 华严缘起观与过程哲学(Whitehead)·唯心论与唯物论的张力·
          华严美学(缘起即美)的初步探讨。
        en_body: |
          The "Huayan Buddhism" entry in the Stanford Encyclopedia of Philosophy (SEP) is the most
          authoritative philosophical overview of Huayan in the English-speaking world.
          Substantially revised in September 2024, covering —
          (1) **Philosophical analysis of the five Huayan patriarchs' thought**: from Dushun's
          dharmadhātu contemplation → Zhiyan's ten mysterious gates → Fazang's five teachings →
          Chengguan's perfect fusion of the three holy ones → Zongmi's Chan-doctrinal unity,
          reinterpreted through the methods of analytical philosophy.
          (2) **Logical structure of the ten mysterious gates**: Nicholaos Jones's (2019) analysis
          — how the six characteristics (Fazang's *liu xiang yuanrong*) serve as the epistemological
          foundation of Huayan, engaging with contemporary logic (modal logic, possible-worlds semantics).
          (3) **Metaphysics of unimpeded interpenetration**: reconstructing the Huayan proposition
          "one is all" through contemporary metaphysical methods (possible worlds, counterfactual
          conditionals).
          (4) **Survey of contemporary scholarship**: Cook (1977), Gregory (1991), Hamar (2007),
          Lai (2003), McGraw (2017, 2025), Shields (2024), Jones (2019), and others.
          (5) **Huayan and contemporary philosophy**: the dialogue between Huayan conditionality and
          process philosophy (Whitehead), the tension between idealism and materialism, and
          preliminary explorations of Huayan aesthetics (beauty as conditionality).
        sources:
          - "Stanford Encyclopedia of Philosophy: Huayan Buddhism (SEP, 2024 revision)"
          - "Jones, N. (2019). Philosophy East and West 69/4"
          - "Cook, F. (1977). Hua-yen Buddhism: The Jewel Net of Indra"
          - "Gregory, P. (1991). Tsung-mi and the Sinification of Buddhism"
          - "Hamar, I. (2007). Reflecting Mirrors"
          - "Lai, W. (2003). Studies in Huayan Buddhism"
          - "McGraw, B. (2017). Religions 8/12"
          - "Shields, J. (2024). Journal of Buddhist Ethics 31"
          - "Stanford Encyclopedia of Philosophy: Huayan Buddhism (2024 revision)"
          - "2024 SEP Huayan Buddhism entry: https://plato.stanford.edu/entries/huayan-buddhism/"

  - id: publications
    title: 华严经出版与研究专著
    title_en: Publications and Research Monographs on the Avataṃsaka Sūtra
    icon: 📚
    topics:
      - title: 华严经注疏详解
        title_en: Avataṃsaka Sūtra Commentaries and Sub-commentaries
        body: |
          华严经注疏的主要成果:
          (1) **法藏(643-712)**: 《华严经探玄记》20卷(T35n1733)——华严经最早的完整注疏。
          (2) **澄观(738-839)**: 《大方广佛华严经疏》60卷(T35n1735) + 《随疏演义钞》90卷(T36n1736)——最详尽的华严经科判与注疏。
          (3) **宗密(780-841)**: 《华严经行愿品疏钞》——入法界品的详细注疏。
          (4) **李通玄(635-730)**: 《新华严经论》40卷——以易经融会华严的独特注疏。
          (5) **净源(1011-1088)**: 《华严经疏论要钞》——宋代华严复兴的重要注疏。
          (6) **当代注疏**: 海云继梦《九九華嚴玄談》5册·贤度法师《华严经讲义》系列。
          这些注疏构成了华严经学的完整文献体系。
        en_body: |
          Major achievements in Avataṃsaka Sūtra commentaries:
          (1) **Fazang (643–712)**: *Tanxuanji* (Explorations of the Profundities),
          20 fascicles (T35n1733) — the earliest complete commentary on the
          Avataṃsaka Sūtra.
          (2) **Chengguan (738–839)**: *Dafangguang fo huayan jing shu* (Commentary),
          60 fascicles (T35n1735) + *Suishu yanyi chao* (Sub-commentary), 90 fascicles
          (T36n1736) — the most detailed structural analysis and commentary.
          (3) **Zongmi (780–841)**: *Huayan jing xingyuan pin shu chao* — detailed
          commentary on the *Gaṇḍavyūha*.
          (4) **Li Tongxuan (635–730)**: *Xin Huayan jing lun* (New Avataṃsaka
          Commentary), 40 fascicles — a unique commentary integrating the *Book of
          Changes* with Huayan.
          (5) **Jingyuan (1011–1088)**: *Huayan jing shu lun yao chao* — an important
          commentary in the Song dynasty Huayan revival.
          (6) **Contemporary commentaries**: Haiyun Jimeng's *Jiujiu Huayan Xuantan*,
          5 volumes; Venerable Xiandu's *Lectures on the Avataṃsaka Sūtra* series.
          These commentaries constitute the complete documentary system of Avataṃsaka
          Sūtra studies.

      - title: 华严宗史研究专著
        title_en: Monographs on the History of the Huayan School
        body: |
          华严宗史研究的主要专著:
          (1) **魏道儒《中国华严宗通史》**(江苏古籍, 1998)——当代最系统的华严宗通史。
          (2) **镰田茂雄《中国华严思想史の研究》**(东京大学出版会, 1965)——日本学界的经典著作。
          (3) **木村清孝《初期中国华严思想の研究》**(春秋社, 1977)——华严宗初期思想的深入研究。
          (4) **方立天《法藏评传》**(人大出版社, 2006)——法藏法师的详细传记与思想研究。
          (5) **安藤俊雄《华严思想の研究》**(法藏馆, 1965)——日本华严思想研究的重要著作。
          (6) **石井修道《中国华严宗の研究》**(大东出版社, 1990)——中国华严宗的综合性研究。
          (7) **织田显祐《唐代华严教学の研究》**(法藏馆, 2000)——唐代华严教学的专题研究。
          (8) **王颂《宋代华严思想研究》**(宗教文化, 2008)——宋代华严复兴的深入研究。
          这些专著构成了华严宗史研究的完整学术谱系。
        en_body: |
          Major monographs on the history of the Huayan school:
          (1) **Wei Daoru, *A Comprehensive History of Chinese Huayan*** (Jiangsu
          Ancient Books, 1998) — the most systematic contemporary Chinese monograph.
          (2) **Kamata Shigeo, *A Study of the History of Chinese Huayan Thought***
          (University of Tokyo Press, 1965) — a classic Japanese scholarly work.
          (3) **Kiyotaka Kimura, *A Study of Early Chinese Huayan Thought*** (Shunjin-
          sha, 1977) — in-depth study of early Huayan thought.
          (4) **Fang Litian, *A Critical Biography of Fazang*** (Renmin University
          Press, 2006) — detailed biography and thought study of Fazang.
          (5) **Andō Toshio, *Studies in Huayan Thought*** (Hōzōkan, 1965) — an
          important Japanese work on Huayan thought.
          (6) **Ishii Shūdō, *Studies on the Chinese Huayan School*** (Tōdō Bunko,
          1990) — comprehensive study of the Chinese Huayan school.
          (7) **Otera Kensuke, *Studies on Tang Dynasty Huayan Teaching*** (Hōzōkan,
          2000) — specialized study of Tang dynasty Huayan pedagogy.
          (8) **Wang Song, *Huayan Thought in the Song Dynasty*** (Religious Culture
          Press, 2008) — in-depth study of the Song dynasty Huayan revival.
          These monographs constitute the complete academic genealogy of Huayan
          school history studies.

      - title: 华严思想与当代对话
        title_en: Huayan Thought and Contemporary Dialogue
        body: |
          华严思想与当代对话的主要研究:
          (1) **华严与系统论**: Fritjof Capra《The Tao of Physics》(1975)比较华严与现代物理学。
          (2) **华严与生态伦理**: David Loy, "The Great Awakening: A Buddhist Social Theory"(2003)。
          (3) **华严与AI**: 华严的因陀罗网与神经网络的结构相似性研究。
          (4) **华严与心理学**: 华严的唯心回转与认知科学的比较研究。
          (5) **华严与艺术**: 华严的华藏世界海与当代艺术的对话。
          (6) **华严与和平**: 华严的法界缘起思想对当代和平运动的启示。
          这些对话为华严思想的当代转化提供了重要路径。
        en_body: |
          Major research on Huayan thought and contemporary dialogue:
          (1) **Huayan and systems theory**: Fritjof Capra's *The Tao of Physics*
          (1975) comparing Huayan with modern physics.
          (2) **Huayan and ecological ethics**: David Loy, "The Great Awakening: A
          Buddhist Social Theory" (2003).
          (3) **Huayan and AI**: studies on the structural similarity between Huayan's
          Indra's net and neural networks.
          (4) **Huayan and psychology**: comparative studies of Huayan's "revolution
          of mind-only" and cognitive science.
          (5) **Huayan and art**: dialogue between Huayan's Ocean of Flower-Treasury
          Worlds and contemporary art.
          (6) **Huayan and peace**: the inspiration of Huayan's dharmadhātu
          conditionality thought for contemporary peace movements.
          These dialogues provide important paths for the contemporary
          transformation of Huayan thought.

      - title: 华严艺术与图像学研究
        title_en: Huayan Art and Iconographic Studies
        body: |
          华严艺术与图像学研究的主要成果:
          (1) **毗卢遮那佛像**: 日本东大寺大佛(奈良, 752)——世界最大铜佛，依华严经建造。
          (2) **华严经变相**: 敦煌莫高窟华严经变壁画(唐代)——华严经的图像化表现。
          (3) **善财童子五十三参图**: 日本·韩国·中国的五十三参图像传统。
          (4) **华藏世界海图**: 华严宇宙观的图像化表现，见于绘画·雕塑·建筑。
          (5) **华严梵呗**: 华严四十二字母的音乐传统，见于日本声明·韩国梵呗。
          (6) **学术研究**: 村田靖子《佛像の系譜》·宫次男《平安時代の絵画》等对华严图像有深入分析。
          华严艺术研究为理解华严思想的视觉表达提供了重要视角。
        en_body: |
          Major achievements in Huayan art and iconographic studies:
          (1) **Vairocana images**: the Great Buddha of Tōdaiji (Nara, 752) — the
          world's largest bronze Buddha, built according to the Avataṃsaka Sūtra.
          (2) **Avataṃsaka Sūtra mandalas**: Dunhuang Mogao Caves Avataṃsaka murals
          (Tang dynasty) — visual representations of the Avataṃsaka Sūtra.
          (3) **Sudhana's fifty-three pilgrimages images**: Japanese, Korean, and
          Chinese traditions of depicting the fifty-three pilgrimages.
          (4) **Ocean of Flower-Treasury Worlds maps**: visual representations of the
          Huayan cosmology, found in paintings, sculptures, and architecture.
          (5) **Huayan chants**: the musical tradition of the forty-two Huayan
          letters, found in Japanese shōmyō and Korean beompae.
          (6) **Academic research**: Murata Yasuko's *Genealogy of Buddhist Images*
          and Miyatsugu Masao's *Heian Period Painting* provide in-depth analysis of
          Huayan iconography.
          Huayan art studies provide important perspectives for understanding the
          visual expression of Huayan thought.

      - title: 华严经现代译本与普及读物
        title_en: Modern Translations and Popular Works on the Avataṃsaka Sūtra
        body: |
          华严经现代译本与普及读物:
          (1) **Thomas Cleary, *The Flower Ornament Scripture*** (Shambhala, 1993)——英文全译本。
          (2) **84000项目**: 正在进行华严经(Toh44)的现代英译，已发布部分品目。
          (3) **xCBETA**: 中华电子佛典协会提供华严经三译本的数字化校勘本。
          (4) **普及读物**: 圣严《正信的佛教》·星云《华严经讲话》·海云继梦《华严经导读》系列。
          (5) **学术导读**: 方东美《华严宗哲学》·Francis Cook *Hua-yen Buddhism* 等学术普及著作。
          这些译本与读物为华严经的现代传播提供了重要载体。
        en_body: |
          Modern translations and popular works on the Avataṃsaka Sūtra:
          (1) **Thomas Cleary, *The Flower Ornament Scripture*** (Shambhala, 1993) —
          complete English translation.
          (2) **84000 Project**: currently conducting modern English translation of the
          Avataṃsaka (Toh44), with some chapters already published.
          (3) **xCBETA**: the Chinese Buddhist Electronic Text Association provides
          digitized critical editions of the three Chinese Avataṃsaka translations.
          (4) **Popular works**: Shengyan's *What Buddhists Believe*, Hsingyun's
          *Avataṃsaka Sūtra Talks*, Haiyun Jimeng's *Avataṃsaka Sūtra Guide* series.
          (5) **Academic introductions**: Thomé Fang's *The Philosophy of the Huayan
          School*, Francis Cook's *Hua-yen Buddhism*, and other academic popularization
          works.
          These translations and works provide important vehicles for the modern
          dissemination of the Avataṃsaka Sūtra.

