  vow: 此諸菩薩，往昔皆與毘盧遮那如來共集善根，修菩薩行；皆從如來善根海生，諸波羅蜜悉已圓滿；慧眼明徹，等觀三世；於諸三昧，具足清淨；辯才如海，廣大無盡；具佛功德，尊嚴可敬；知眾生根，如應化伏；入法界藏，智無差別；證佛解脫，甚深廣大；能隨方便，入於一地，而以一切願海所持，恒與智俱盡未來際；了達諸佛希有廣大祕密之境，善知一切佛平等法，已踐如來普光明地，入於無量三昧海門；於一切處，皆隨現身；世法所行，悉同其事；總持廣大，集眾法海；辯才善巧，轉不退輪；一切如來功德大海，咸入其身；一切諸佛所在國土，皆隨願往；已曾供養一切諸佛，無邊際劫，歡喜無倦；一切如來得菩提處，常在其中，親近不捨；恒以所得普賢願海，令一切眾生智身具足。成就如是無量功德
