    viewpoint: "BDRC目录标注为于阗译出。部分学者认为有印度梵本中介"
    consensus: "85% consensus"
    color: "#7d9a6e"

  - topic: "Ch.11 如来华严品是否为独立经典后并入"
    viewpoint: "结构分析支持独立说，但无直接文献证据"
    consensus: "disputed"
    color: "#c8893e"

  - topic: "「观世音/观自在」拼写差异是否证明多版本"
    viewpoint: "法藏《探玄记》卷19明确记载差异；质疑者认为仅是音译习惯"
    consensus: "60% consensus"
    color: "#a08020"

  - topic: "藏文《离世间品》异译段落的来源"
    viewpoint: "可能反映更古老的于阗传承；学界尚未系统对勘"
    consensus: "unknown"
    color: "#c46b5d"

# ── 对译优先级 ──
priority_roadmap:
  - level: "P0"
    color: "#c46b5d"
    label: "最高优先"
    content: |
      Ch.11 如来华严品 · Ch.28 普贤宣说品 — 汉文三译全缺，学术价值最高。
      获取路径: ① BDRC/BUDA API (buda.bdrc.io, 需注册) → Toh44 Unicode电子文本 ② 84000项目: 已发布入法界品(2021), Ch.11+Ch.28尚未发布 ③ 兜底: 学术论文中对藏文独有品目的研究摘要。目前P0阶段可先整理已知内容结构大纲。

  - level: "P1"
    color: "#c8893e"
    label: "高优先"
    content: |
      Ch.27 十地品 · Ch.40 离世间品 — 有鸠摩罗什《十住经》、世亲《十地经论》、竺法护《度世品经》等别译可作对勘桥梁。

  - level: "P2"
    color: "#a08020"
    label: "中优先"
    content: |
      Ch.33 寿量品 · Ch.39 如来出现品 — 有玄奘《显无边佛土功德经》和竺法护《如来兴显经》等别译可对照。

