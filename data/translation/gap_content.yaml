# 汉藏华严差异对比内容 (从gap.js提取)
# Tab2 汉藏差异核心内容

core_finding: "藏文《华严经》(Toh44)译自中亚于阗原本，而非印度梵本。汉文《八十华严》亦由于阗请来梵本，但两者所据底本已不同——九世纪时华严梵本已多系分化。藏文45品中有2品为汉文三译所完全缺失（如来华严品、普贤宣说品），另有3品有实质性内容参差。"

