# 说明: 五位祖师(杜顺/智俨/法藏/澄观/宗密) + 在家学者李通玄;
#       「贤首国师」「清凉国师」子节完整呈现整份综述文档(review_doc 路径, 由 build.py 读取并按 master id 注入 review_mds)。
# 用途: 供 Tab2 华严文献 → 华严祖师 视图展示。

title: 🧑 华严祖师
intro: |
  华严宗祖师谱系——从初祖杜顺到五祖宗密（后世追认的「五祖」体系），及其东亚传承。
  「五祖」体系为后人追认（参见 Gimello 1976 对法藏史传写作的分析），现代学术视为宗派建构的产物，
  但对理解华严教学之传承位置仍具枢纽意义。
overview_note: |
  出處：鎌田茂雄《华严の思想》第2章；魏道儒《中国华严宗通史》。法藏被普遍视为「华严宗的实际上创建者与系统化者」（the systematizer），尽管谱系上列为三祖。

overview_header: [世系, 人物, 生卒, 主要贡献]
overview:
  - [初祖, 杜顺（法顺）, 557–640, 传《法界观》《五教止观》（传承性止观）]
  - [二祖, 智俨, 602–668, 著《华严经搜玄记》，建立「十玄」「六相」雏形]
  - [三祖, 法藏（贤首）, 643–712, 集大成，著《探玄记》《五教章》《金师子章》]
  - [四祖, 澄观（清凉）, 738–839, 著《华严经疏》《随疏演义钞》，融合华严与禅]
  - [五祖, 宗密（圭峰）, 780–841, 著《原人论》《禅源诸诠集都序》，华严禅之完成者]

masters:
  - id: dushun
    name: 杜顺（法顺）
    dates: 557–640
    role: 华严初祖 · 帝心尊者（隋末唐初）
    brief: 俗姓杜，雍州万年人。因神异与禅定著称，传说尝为唐太宗祈雨除病。华严一宗之发端，传《法界观门》《五教止观》。其「四法界」之名后由法藏、澄观系统发挥。
    works:
      - {t: 法界观门, u: T45n1884}
      - {t: 五教止观, u: T45n1867}
      - {t: 十门实相观}
  - id: zhiyan
    name: 智俨
    dates: 602–668
    role: 华严二祖 · 至相尊者
    brief: 俗姓赵，天水人。从杜顺入道，晚住长安至相寺（云华寺）讲《华严经》。建立「十玄」「六相」雏形，著《华严经搜玄记》。法藏年十六师事之，尽得其学；临终将法藏托付道成、薄尘。
    works:
      - {t: 搜玄记, u: T35n1732}
      - {t: 孔目章, u: T45n1870}
      - {t: 一乘十玄门, u: T45n1868}
      - {t: 五十要问答, u: T45n1869}
  - id: fazang
    name: 法藏（贤首国师）
    dates: 643–712
    role: 华严三祖 · 实际创立者
    brief: 俗姓康（康居国裔），长安人。华严宗三祖、贤首宗实际创立者。参与八十华严译场（笔受/证义），著《探玄记》《五教章》《金师子章》等三十余部，建立「五教十宗」「十玄门」「六相圆融」「四法界」完整教观体系。五帝门师，中宗、睿宗之菩萨戒师。
    works:
      - {t: 五教章, u: T45n1866}
      - {t: 探玄记, u: T35n1733}
      - {t: 金师子章, u: T45n1881}
      - {t: 华严经旨归, u: T45n1871}
      - {t: 妄尽还源观, u: T45n1876}
      - {t: 华严经问答, u: T45n1873}
      - {t: 义海百门, u: T45n1875}
      - {t: 华严经传记, u: T51n2073}
      - {t: 起信论义记, u: T44n1846}
      - {t: 心经略疏, u: T33n1712}
    review_doc: docs/法藏贤首国师全方位文献综述.md
  - id: chengguan
    name: 澄观（清凉国师）
    dates: 738–839
    role: 华严四祖 · 集大成者
    brief: 俗姓夏侯，越州山阴人。身历九朝、为七帝门师，世称「华严疏主」。著《华严经疏》60卷、《随疏演义钞》90卷（一说120卷），以禅解华严、融合华严与禅。门下有宗密。终南山华严寺（少陵原）今存其塔。
    works:
      - {t: 华严经疏, u: T35n1735}
      - {t: 演义钞, u: T36n1736}
      - {t: 法界玄镜, u: T45n1883}
      - {t: 三圣圆融观门, u: T45n1882}
      - {t: 华严经略策, u: T36n1737}
    review_doc: docs/清凉国师澄观全方位文献综述.md
  - id: zongmi
    name: 宗密（圭峰大师）
    dates: 780–841
    role: 华严五祖 · 禅教融合
    brief: 俗姓何，果州西充人。初习禅于荷泽宗道圆，后随澄观学华严。著《禅源诸诠集都序》《原人论》《注法界观门》，主张「教禅一致」，为华严禅之完成者。
    works:
      - {t: 禅源诸诠集, u: T48n2015}
      - {t: 原人论, u: T45n1886}
      - {t: 注法界观门, u: T45n1884}
      - {t: 圆觉经略疏, u: T39n1795}
      - {t: 金刚经疏论纂要, u: T33n1701}
    review_doc: docs/圭峰大师宗密全方位文献综述.md
  - id: litongxuan
    name: 李通玄（枣柏大士）
    dates: 635–730
    role: 在家学者
    brief: 沧州人，唐代著名在家华严学者，世称枣柏大士。不事宗匠、独觉观门，著《新华严经论》40卷，以「十十」法门诠释八十华严，与法藏判教另有径庭，为华严学另一源流。
    works:
      - {t: 新华严经论, u: T36n1739}
      - {t: 决疑论, u: T36n1741}