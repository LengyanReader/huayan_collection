geometry:
  method_zh: '顶点＝十方；λ(σ)＝σ 诸边共字数之最小值（顶点最先出现）；复形 K_t＝{σ : λ(σ) ≥ t}，t 自 max 降至 1 而自空渐满（增过滤）。以
    GF(2) 边界矩阵约化（standard reduction）得各维配对（birth, death）。与拓扑节之静态 Betti 数互补：静态只问某阈值下有几何环，持久则问环于何阈值生、何阈值灭。'
  method_en: 'Vertices = ten directions; λ(σ) = min shared-character count over the
    edges of σ (vertices first); complex K_t = {σ : λ(σ) ≥ t}, with t from max down
    to 1 (an increasing filtration). GF(2) boundary-matrix reduction yields per-dimension
    (birth, death) pairs. This complements the static Betti numbers of the topology
    lens: there we ask how many cycles at a threshold, here when each cycle is born
    and dies.'
