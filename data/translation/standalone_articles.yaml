# ═══ 独立文章页注册表 ═══
# 每一篇「完整的文章」在此登记后，build.py 自动生成 web/demo/articles/<id>.html 独立页面（独立 URL，可直接分享/收藏）。
# 登记方式两种（单一数据源，不重复登记）：
#  1) sources — 自动展开的数据源：
#       topic_studies   → 每篇专题研究文章（data/translation/topic_studies.yaml articles）
#       huayan_masters  → 每位祖师（data/translation/huayan_masters.yaml 中含 review_doc 者）
#  2) others — 显式登记其他 Tab 由整篇 docs/*.md 支撑的专题/子tab
#
# 字段说明：
#   id         文件名（articles/<id>.html）与 URL 标识
#   icon/title/title_sub/version  页面横幅元数据
#   doc        整篇 markdown 源文件（相对仓库根）
#   meta       可选：导览/摘要（markdown 内联）
#   back       返回链接：{tab, view, label}（label 为选项卡名+栏目名）
#   views      在哪些选项卡视图内显示「独立文章页」入口条（与各 Tab JS 的 view id 对应）

sources:
  - topic_studies
  - huayan_masters

