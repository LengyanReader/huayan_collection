    relevance_zh: "戴天冠、坐莲花、手握智拳印之大日如来（毗卢遮那），法身佛造像体系（毗卢印／智拳印）与本经教主图像学互证。"
    relevance_en: "A crown-wearing Mahavairocana in vajra-mudra, cross-reading with the iconography of this sutra's lord."
    href: "https://m.thepaper.cn/newsDetail_forward_33634018"
    source_note: "张素闻〈华严经变和毗卢遮那佛的艺术形象〉，澎湃新闻·古代艺术（2026-07-30）"
    license: "澎湃新闻公开报道页（学术参考、非商业使用）"

