    relevance_en: "The archive records eight of the nine Avatamsaka assemblies on the ceiling and Huayan worlds in the niche; the first assembly (this chapter's bodhimanda) is among them."
    href: "https://www.dha.ac.cn/info/1425/3583.htm"
