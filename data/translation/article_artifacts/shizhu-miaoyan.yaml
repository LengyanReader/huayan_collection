  # ── 敦煌 · 莫高窟 华严经变（敦煌研究院官方著录）──
  - artifact_id: dunhuang-cave-12
    title_zh: "莫高窟第12窟 北壁西侧《华严经变》（索法律窟）"
    title_en: "Mogao Cave 12, west side of north wall, Huayan Bianxiang (Su family cave)"
    era: "晚唐（归义军时代）"
    location: "甘肃敦煌莫高窟南区北端"
    category: mural
    grade: A1
    status: confirmed
    relevance_zh: "本品即七处九会之第一会（菩提场）始品。本图以莲花藏海与须弥山为背景，七处九会均清晰表现；善财求法绘于四铺屏风画中，其详细为他窟所无。敦煌研究院明记莫高窟华严经变共二十九铺，始于盛唐、盛行于中晚唐。"
    relevance_en: "This chapter opens the first of the nine assemblies (the bodhimanda). The mural takes the lotus-store sea and Mount Sumeru as backdrop with all seven places and nine assemblies clearly shown; Sudhana's quest fills four screen panels unmatched in detail elsewhere."
    href: "https://www.dha.ac.cn/info/1425/3658.htm"
    source_note: "敦煌研究院·莫高窟第12窟（数字资源·文化专题·悦读敦煌·敦煌石窟）"
    license: "敦煌研究院官网公开介绍（学术参考、非商业使用）"

