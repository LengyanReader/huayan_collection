  unresolved_glyph:
  - zh: 𪗇
    n: 2
    note: 〔更正·证伪〕旧注「音译『那』之疑似异体」（旧 py 字段作 na）经证伪，已删。经 T279 全篇核：①码位 U+2A5C7（旧注未记）；②全经 24 见，其中**仅 2 见在名号内**（「大精進金剛𪗇菩薩摩訶薩」「輪𪗇天王」），余
      22 见皆在经文正文与韵文（如「於𪗇輪中放百萬阿僧祇光」「次前，於金剛𪗇佛所」「光味摩尼以為其𪗇」「十方一切諸佛𪗇中，皆放光明」「玉王𪗇臍眾神」）；③**CBETA 自家校勘在不同处分别作「𪗇＝齊」与「𪗇＝臍」，二者互不一致**——如「消＝銷【宮】𪗇＝齊【三】」「耀＝曜【宮】𪗇＝齊【宮】」「玉＝王【三】【宮】𪗇＝臍【三】【宮】」。校记既不能给出一致对应，正说明
      CBETA 编校方亦将其视为底本字形存疑之衍/讹标记，而非有确定读音的音译字。故其义不可判，**不得归入任何音译域**；旧说之「那」在 CBETA 校勘中毫无支持，故 py 亦一并清空。**本条非「待归域」而是「已考订而不可归域」**，以
      unresolved_glyph 标记。
  - zh: 㵎
    n: 1
    note: 经 T279 全篇核：仅一见，在「普潔泉㵎主河神」（T279「普發迅流主河神、普潔泉㵎主河神、離塵淨眼主河神」），CBETA 未附任何校勘异文。旧注「疑『溢』之异体，待考」**无实证支撑，已删**——全篇既无第二处可比对，亦无字书或校记可据，按「严禁假信息」不保留此疑测。位置在「泉」之后、类尾「主河神」之前，依「普潔泉㵎」之构式，或为泉之形容，然具体所指待考。**本条非「待归域」而是「已考订而不可归域」**：字义在现有底本与字书内不可判定，任何归域皆属臆造，故保留
      unassigned 并以 unresolved_glyph 标记。
  backlog: []
lexicon_notes:
- 「輪」在本品类中皆从「光」（大威德光明、微密光輪、妙輪莊嚴幢），故暫入 luminosity；若据他例作转动义，则当改入 motion——待考。
- 「無」「微」「量」「邊」诸字在名号中作量词（無量、無邊、微塵），在经文数词中亦作程度副词，二义须辨，暂入 number。
- 「心」在「安樂世間心」「心不退轉」中，或为心量、或为肉心，暂入 body，待考。
- 「眾」在「眾妙宮殿」「眾妙最勝光天」中为形容语素（眾妙＝种种奇妙），非指众生，暂入 luminosity，待考。
- 「知」在「知足自在主水神」「知足天」中作知足义，与「智慧」义有别，暂入 wisdom 而标 medium，待考。
- 「善」在「善勇猛」「善時分」中作冠字（goodness），在「善慧」中与「慧」并为词素，暂入 affix 而标 medium，待考。
- 「𪗇」字 CBETA 保留、字书难收，见「大精進金剛𪗇菩薩摩訶薩」「輪𪗇天」，疑为音译「那」之异体，存疑待考，不臆定其义。
- 「執金剛神」类成员名（如「妙色那羅延執金剛神」）含梵天音译成分（「那羅延」＝narayana），本表不逐字拆解梵名，梵音译成分入 unassigned／待补。
- '表中 `c: low` 与标〔删〕的占位行，实际不参与切分（脚本按 c 与 domain 过滤），保留以备审计。'
- 「主」为本类群最高频词素（156 次），且**非语义成分**而是**句式标记**：十九类神名一率为「〔形容〕主〔所主〕」。脚本据此在 class_tails 中剥离「神」而保留「主Y」，使 EDA 能同时观察「所主」与「形容」两个层面。
- 单字切分会把「金剛」「摩尼」「瓔珞」「師子」「那羅延」等拆散。故 lexemes 段以**词**为单位登记，脚本做「先词后字」的最长匹配切分（two-pass），两法结果并列输出，供互校。
