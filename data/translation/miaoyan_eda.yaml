    formula 〔epithet〕主〔domain〕神 without exception (150 of 150 named members) — 主 is a grammatical marker
    of the governed domain, not a title, so these names are not free naming but fill-in-the-blank of one
    mould. The first four (執金剛神, 身眾神, 足行神, 道場神) do not take the 主X form but are 〔attribute〕神 suffix types.
    Four form-deity classes plus fifteen 主X神 classes together make up the nineteen classes of the 異生眾.
