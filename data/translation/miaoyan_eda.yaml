    40 处多字词，判读存疑 14.7%、low 1.8%。**群特有词素凡 107 个**（为五群最多），

    其中「所主」槽位字十三个（城、林、藥、稼、河、海、水、火、風、空、方、夜、晝）

    确为他群所无，惟「地」「山」二字兼见于八部（毘樓博叉、須彌堅固），

    故非本群所独。旧记「特有词素恰为十五个所主字」不确，今依实算正之：

    即句式的槽位本身成了该群的识别标记——此为 19 类神中 15 类「主X神」

