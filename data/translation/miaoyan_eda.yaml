  note: '实算：73 名 / 7 类，核名均值 4.25（2–9），108 个词素、21 处多字词，

    判读存疑（medium+low）16.4%、low 1.7%。类尾仅「天子」「天王」两种，无所主标记，

    故与十九类神之严格句式律成对照：同为天王而一为填空式、一为自由式。

    群特有词素 17 个（分、句、察、得、悟、慈、敬、正、滿、界、總、蘂、議、門、

    子、因陀羅、釋迦），多于八部之 5、少于天众之 107。其中「因陀羅」为帝释别名

    （Śakra），见于三十三天王「釋迦因陀羅天王」与他化自在天王

    「因陀羅力妙莊嚴光明天王」二处；旧记「仅见于三十三天王」不确，今正之。

    本群「光」「明」二词素之和 47，为群内最高，显示其名号仍以光明语汇为主调。'
  note_en: 'Measured: 73 names in 7 classes, mean core length 4.25 (2–9), 108

    morphemes, 21 multi-character words; 16.4% medium or low, 1.7% at the low

    tier. Class tails are only 「天子」 and 「天王」, with no governed-domain

    marker, so this group stands in contrast to the strict formula of the

    nineteen deity classes: both are 天王, but one is fill-in-the-blank and

    the other free. It has 17 exclusive morphemes (分 句 察 得 悟 慈 敬 正 滿 界

    總 蘂 議 門 子 因陀羅 釋迦) — more than the 八部''s 5, fewer than the devas''

    107. 因陀羅 is a name of Śakra occurring in **two** classes, the

    Trayastriṃśa (釋迦因陀羅天王) and the Nirmāṇarati

    (因陀羅力妙莊嚴光明天王); the earlier claim that it appeared solely in the

    Trayastriṃśa does not hold and is corrected. 光 and 明 together reach 47 occurrences

    within the group, the highest of any pair, so luminosity still dominates

    the group''s vocabulary.'
  character: 以「天子」「天王」二尾统摄，全群无句式律之群。
