  note: 「domain=unassigned」**不是单一性质的积压**，须分三类读（见 metrics 四项计数）：① **专名／音译型**——已注册为多字 lexeme（如「因陀羅」「那羅延」「普賢」「毘樓博叉」），注册目的正是阻止逐字强析，故其
    unassigned 是**设计结果而非待办**，强行归域反属臆造；② **不可归域型**——底本罕字，字义在现有底本与字书内不可判读（带 unresolved_glyph 标记，如「𪗇」「㵎」），已考订而止步于此；③
    **待归域型**——前两类之外者，方为真正可推进的积压。三者皆不得为凑「unassigned→0」而强并。
  note_en: '''unassigned'' is not a single kind of backlog and must be read in three classes: (1) proper
    names and transliterations registered as multi-character lexemes — their unassigned status is by design,
    since registration exists precisely to prevent character-by-character forcing; (2) base-text obscure
    glyphs whose meaning cannot be determined from the available text or dictionaries (flagged unresolved_glyph);
    (3) everything else, the only genuinely actionable backlog. None of the three may be collapsed merely
    to drive ''unassigned'' toward zero.'
  lexeme:
  - zh: 因陀羅
    n: 2
  - zh: 普賢
    n: 1
  - zh: 如來
    n: 1
