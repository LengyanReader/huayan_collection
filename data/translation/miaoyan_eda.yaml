  note: 十九类神可分两型：**后十五类「主X神」无一例外**（150/150 名）皆作「〔形容〕主〔所主〕神」——「主」为**句式标记**（非尊称、非语义成分），标示该类众之所主，故其名非自由命名，而是同一模子的填空；前四类（執金剛神·身眾神·足行神·道場神）则不作「主X」式，而为「〔属性〕神」尾缀型。四类造型神与十五类主X神并列，正合「异生众·十九类神」之数。
