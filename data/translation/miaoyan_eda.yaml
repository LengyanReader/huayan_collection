epithet_sharing:
  note: 「主X神」之名作「〔赞词〕主〔所主〕神」。核名含所主槽，故**同一赞词配不同所主**者（如「大光普照主火」与「大光普照主風」）核名相异，上一节「跨类重名」按整核比较，**结构上测不到**。故另测此项：剥去「主X」槽后比较前半赞词。凡十九类神之外者不具此句式，不入此项。
  note_en: Names in the 「主X神」 classes take the form 〔epithet〕主〔domain〕神. Because the core retains the
    domain slot, members sharing an epithet but governing different domains (e.g. 「大光普照主火」 vs 「大光普照主風」)
    have distinct cores and are structurally invisible to whole-core cross-class comparison. This metric
    therefore compares the epithet alone, after removing the 主X slot. Members outside the nineteen deity
    classes lack this pattern and are excluded. Each entry records only the class and the governed domain
    — member names are sutra fact and are held solely by the assembly.
  n_members_parsed: 150
  groups:
  - epithet: 清淨光明
    n: 3
    classes:
    - 主城神
    - 主林神
    - 主藥神
    members:
    - cat: 主城神
      domain: 城
    - cat: 主林神
      domain: 林
    - cat: 主藥神
      domain: 藥
  - epithet: 大光普照
    n: 2
    classes:
    - 主火神
    - 主風神
    members:
    - cat: 主火神
      domain: 火
    - cat: 主風神
      domain: 風
