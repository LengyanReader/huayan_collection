    判读存疑（medium+low）18.7% 为五群最高，而须标〔待考〕之 low 仅 1.5%、居五群

    第四——二者方向相反，正见其存疑之性质。其成因是**语料性质而非切分之弊**：

    八部名多以本类或本尊音译立名（羅睺、毘摩質多羅、毘沙門、娑竭羅、持國…），

    音译专名之读法「合理而未证」，故多落 medium 而非 low。后果须明言——**八部的 epithet 分析置信度最低**，

    涉八部之造词结论应加保留；欲比较「群间用字差异」，八部一组宜只看有判读的词素。'
  note_en: 'Measured: 80 names in 8 classes, mean core length 3.77 (2–8) — the

    shortest of the five groups; 124 morphemes, 22 multi-character words;

    18.7% of positions medium or low, the highest of the five, yet only 1.5% at

    the low tier that must be flagged — fourth of five. The two measures point

    in opposite directions, which is itself diagnostic. The cause is the nature

    of the material, not a defect of segmentation: many 八部 names are built on

    a transliterated class or deity name (羅睺, 毘摩質多羅, 毘沙門, 娑竭羅, 持國),

    whose readings are plausible but unverified and therefore settle at medium

    rather than low. The

    consequence must be stated plainly — **the epithet analysis of the 八部 is

    the least reliable of the five**; any claim about word-building in this

    group needs a caveat, and cross-group comparison should read only the

    morphemes that carry a reading.'
  character: 核名最短（均值 3.77）而判读存疑最厚（medium+low 18.7%，五群最高）之群。
