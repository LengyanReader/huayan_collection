  method_zh: 顶点＝四十类；λ(σ)＝σ 诸边共字数之最小值（顶点最先出现）；K_t＝{σ:λ(σ)≥t}，t 自 max 降至 1（增过滤）。以 GF(2)
    边界矩阵约化得各维配对（birth, death）。节点四十，为避免组合爆炸，限单纯形维数至 3（故只报 H0／H1／H2 三维持久条形），乃『限维旗复形』近似。
  method_en: Vertices = forty classes; λ(σ) = min shared-character count over the
    edges of σ (vertices first); K_t = {σ:λ(σ)≥t}, t from max down to 1 (increasing
