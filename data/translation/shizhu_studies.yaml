algebra:
  kind: census
  note_zh: 本品四十类会众无天然之对称群可作用（异于〈如来现相品〉之十方方位），故本视角作组合普查：以类目、摄属、列名员数三分，见其构成之数。
  note_en: The forty classes here admit no natural symmetry group (unlike the ten
    directions of the Tathāgata's Manifestation); this lens is thus a combinatorial
    census — by group, realm, and listed-member count.
  readout_zh: 四十类＝菩萨 1 ＋ 异生众 39（十九类神 19・八部四王 8・欲界天七众 7·色界天五众 5）；列名员数合计 414 名（n_named
    之和），与 assembly.metrics.named_total 相合。
  readout_en: Forty classes = 1 bodhisattva class + 39 other classes (19 god-classes,
    8 legions/kings, 7 desire-realm, 5 form-realm); listed members total 414, matching
    assembly.metrics.named_total.
  census:
  - title_zh: 按所属组
