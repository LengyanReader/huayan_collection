# ── 经典与佛典 (Sutras & Classics) ──
sutras:
  - id: avatamsaka-80
    title_zh: 大方广佛华严经（八十华严）
    title_sa: Buddhāvataṃsaka Sūtra (महावैपुल्यबुद्धावतंसकसूत्र)
    title_en: The Flower Ornament Scripture (80 fascicles)
    translator: 唐·实叉难陀 (Śikṣānanda)
    year: "695–699 CE"
    dynasty: 唐 (Tang)
    canon_ref: 大正藏 T10n0279
    quote_original: |
      「心如工画师，能画诸世间。五蕴悉从生，无法而不造。」
      ——《华严经·夜摩天宫偈赞品》(T10n0279, 卷十九)
    quote_en: |
      "The mind is like a painter, able to paint all the worlds.
      The five aggregates are born from it; there is nothing it does not create."
      — Avataṃsaka Sūtra, Ch. on Verses in the Suyāma Heaven Palace (Ch.19, tr. Thomas Cleary)
    links:
      cbeta_online: https://cbetaonline.dila.edu.tw/zh/T10n0279
      cbeta_tripitaka: https://tripitaka.cbeta.org/T10n0279
      cbeta_pdf: http://buddhism.lib.ntu.edu.tw/FULLTEXT/sutra/chi_pdf/sutra5/T10n0279.pdf
    tags: [lineage, gap, cosmology, frontier, spirit]

  - id: fazang-wujiaozhang
    title_zh: 华严一乘教义分齐章（华严五教章）
    title_en: Treatise on the Doctrinal Distinctions of the Huayan One Vehicle
    author_zh: 唐·法藏 (贤首国师, 643–712)
    year: "c. 680–700 CE"
    dynasty: 唐 (Tang)
    canon_ref: 大正藏 T45n1866
    quote_original: |
      「一即一切，一切即一。」
      ——法藏《华严一乘教义分齐章》/《金师子章》
    quote_en: |
      "One is all; all is one."
      — Fazang, Treatise on the Golden Lion / Huayan Wujiao Zhang
    links:
      cbeta_online: https://cbetaonline.dila.edu.tw/zh/T45n1866
    tags: [lineage, gap, frontier]

  - id: toh44-ten-bhumis
    title_bo: ཕགས་པ་ས་བཅུ་པའི་མདོ། ('phags pa sa bcu pa'i mdo)
    title_sa: Daśabhūmika-sūtra (दशभूमिकसूत्र)
    title_zh: 十地经（藏文《华严经》第31品）
    title_en: The Ten Bhūmis (Toh 44-31)
    translator_en: Peter Alan Roberts (from Tibetan, with Sanskrit reference)
    year: "2021–2026"
    publisher: "84000: Translating the Words of the Buddha"
    canon_ref: 德格版甘珠尔 Toh 44-31
    quote_original: |
      The bodhisattva progresses through ten stages (bhūmis), beginning with
      the Joyous (Pramuditā) and culminating in the Cloud of Dharma (Dharmameghā).
    quote_zh: |
      菩萨次第经历十地，从欢喜地（Pramuditā）至于法云地（Dharmameghā）。
    links:
      official: https://read.84000.co/translation/toh44-31.html
      chinese: https://84000.co/translation/toh44-31?lang=zh
      pdf: https://direct-read.84000.co/data/toh44-31_84000-the-ten-bhumis.pdf
    tags: [gap, frontier]

  - id: laozi-daodejing
    title_zh: 老子道德经
    title_en: Tao Te Ching (The Classic of the Way and Virtue)
    author_zh: 老子 (Lǎozǐ)
    year: "c. 6th–4th century BCE"
    dynasty: 春秋/战国
    quote_original: |
      人法地，地法天，天法道，道法自然。
      ——《老子》第二十五章
    quote_en: |
      "Man models himself on Earth, Earth on Heaven, Heaven on the Way,
      and the Way on that which is naturally so." (tr. D.C. Lau)
    links:
      ctext: https://ctext.org/dao-de-jing
    tags: [spirit]

  - id: zhuangzi-qiwulun
    title_zh: 庄子·齐物论
    title_en: Zhuangzi — Discussion on Making All Things Equal
    author_zh: 庄子 (Zhuāngzǐ)
    year: "c. 4th–3rd century BCE"
    dynasty: 战国
    quote_original: |
      天地与我并生，万物与我为一。
      ——《庄子·齐物论》
    quote_en: |
      "Heaven and earth were born together with me,
      and the ten thousand things and I are one." (tr. Burton Watson)
    links:
      ctext: https://ctext.org/zhuangzi
    tags: [spirit, frontier]

