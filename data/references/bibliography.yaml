  - id: schumacher-small-is-beautiful
    title_en: "Small Is Beautiful: Economics As If People Mattered"
    title_zh: 小的是美好的
    author_en: E.F. Schumacher
    author_zh: E.F. 舒马赫
    year: 1973
    publisher: "Harper & Row (US); Blond & Briggs (UK)"
    isbn: 978-0060803520
    quote_original: |
      "The system of nature, of which man is a part, tends to be self-balancing,
      self-adjusting, self-cleansing. Not so with technology." (Part II, Ch.5)

      "The Buddhist economist would consider this approach excessively irrational:
      since consumption is merely a means to human well-being, the aim should be
      to obtain the maximum of well-being with the minimum of consumption."
      — "Buddhist Economics" (Ch.4)
    quote_zh: |
      「自然系统——人类是其一部分——趋向于自我平衡、自我调节、自我净化。
      技术则不然。」（第二部分·第五章）

      「佛教经济学家会认为这种进路极不合理：消费只是达致人类福祉的手段，
      目标应以最少的消费获得最大的福祉。」——第四章「佛教经济学」
    links:
      official: https://centerforneweconomics.org
      buddhist_economics_full: https://centerforneweconomics.org/publications/buddhist-economics/
      translations: https://centerforneweconomics.org/publications/buddhist-economics-translations/
      goodreads: https://www.goodreads.com/book/show/1117634.Small_Is_Beautiful
      douban_2010: https://book.douban.com/subject/5410025/
      douban_2007: https://book.douban.com/subject/2004425/
      douban_2022: https://book.douban.com/subject/35918478/
    goodreads_rating: {score: 4.09, ratings: 7178, reviews: 765}
    douban_rating: {score: 8.1, note: "2022四川人民版; 2007译林版8.2 (578人); 1984商务版8.6 (257人)"}
    acclaim: "《泰晤士报文学增刊》评为二战后最具影响力的100本书之一"
    tags: [spirit]
    pages_tag: [humanistic_economics]

