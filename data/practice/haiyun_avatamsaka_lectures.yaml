overview:
  title: 华严经讲法全目
  note: |
    海云继梦法师以「新古典华严」复兴华严宗，
    讲法覆盖八十华严·四十华严·六十华严的
    整体玄谈与逐品解说。

# ── 一、整体讲法 ──
