# ── 二、玄谈系列 ──
xuantan:
  - title: "華嚴經經首 (S10)"
    platform: Spotify / Apple Podcast
    series: 普賢乘華嚴宗 第10季
    content: |
      华严经「经首」品——全经的序分与玄谈。
      海云法师在此系列中展开华严的语言模式/思惟模式/行为模式三框架。

  - title: "非常華嚴經——四十華嚴玄談"
    publisher: 空庭书苑
    format: 纸本/电子书
    content: 聚焦《四十华严》的玄义——从八十华严到四十华严的义理过渡

  - title: "非常華嚴經——華嚴經經首"
    content: 八十华严经首品玄谈——开经前的义理地基

  - title: "九九華嚴玄談 (YouTube系列)"
    year: "2024-2026"
    content: |
      2024-2026年最新讲座系列, 与纸本书同步推出。
      YouTube频道「華嚴教海」播放清单。
    links:
      youtube_channel: https://www.youtube.com/@huayen-world
      youtube_playlists: https://www.youtube.com/@huayen-world/playlists

  - title: "華嚴思想的承先與啟後"
    content: |
      海云法师关于华严经起源、形成、流传和现代意义的专题讲座。
      核心观点: 《华严经》的故乡在西域(于阗)——五大古文明的交汇地。
      三龙传说(大龙菩萨·龙宫·龙树)的自性表法诠释。

# ── 三、品目解说 ──
chapters:
  - chapter: 净行品
    title: "華嚴經淨行品 (S20)"
    platform: Spotify/Apple Podcast
    content: |
      《净行品》——华严经修行实践的核心品目之一。
      141愿「当愿众生」——日常行住坐卧中修菩萨行。

  - chapter: 十行品
    title: "十行品 (S23)"
    platform: Spotify/Apple Podcast
    year: "2023-2024"
    episodes: 8集
    content: |
      十行品之四「無屈撓行」——十行位的修行内容。

  - chapter: 普贤行愿品
    title: "普賢行願品 (S17)"
    platform: Spotify/Apple Podcast
    content: |
      十大愿王——圆融道的工程面核心。
      海云法师以此品衔接华严教理与日常实践。

  - chapter: 耳根圆通章
    title: "楞嚴經·耳根圓通章"
    platform: fjdh.cn
    lessons: 9+集
    content: |
      《楞严经》观世音菩萨耳根圆通章——与华严观音法门的交叉讲解。
    links:
      fjdh_example: http://wuming.xuefo.com/nr/7/70164.html

  - chapter: 十地品 ↔ 占察经
    title: "非常占察經 (3册)"
    publisher: 空庭书苑
    isbn: "9789867484918/4932/4949"
    year: "2015-2017"
    content: |
      《占察善恶业报经》讲记——四种观法中前二种(唯心识观·真如实观)的经典来源，
      与《华严经·十地品》有深层义理关联。

  - chapter: 其它
    title: 散见品目
    content: |
      • 十住品·十回向品·十定品·十通品: 散见于《九九華嚴玄談》各册
      • 如来出现品: 《探玄記懸談講記》涉及
      • 入法界品(善财五十三参): 《四十華嚴講記》完整覆盖

