# 律己戒他 — 中国佛教律宗
# Vinaya School of Chinese Buddhism
# 最后更新: 2026-08-08

sections:
  - id: vinaya_overview
    title: 律宗总览
    icon: 📏
    intro: |
      律宗，以研习与持守戒律为宗。中国律宗以《四分律》为根本，
      道宣律师（596-667）创南山律宗，成为汉传佛教戒律传承的主流。
      律宗的根本关怀：戒律不是束缚，而是解脱的资粮——
      「戒为无上菩提本，应当具足持净戒」。

  - id: vinaya_founders
    title: 律宗祖师谱系
    icon: 👥
    topics:
      - title: 戒律传入与早期翻译
        body: |
          • 三国曹魏嘉平年间(249-253)，昙摩迦罗译《僧祇戒心》，中国始有戒律
          • 东晋道安(312-385)制定《僧尼轨范》——中国僧团制度的先驱
          • 鸠摩罗什译《十诵律》(T23n1435)，佛陀耶舍译《四分律》(T22n1428)——律典传入的奠基时期
      - title: 道宣(596-667) — 南山律宗创立者
        body: |
          道宣，俗姓钱，浙江吴兴人。15岁出家，20岁依智首律师学律。
          居终南山丰德寺，故称南山律师。开创「南山三大部」：
          • 《四分律删繁补阙行事钞》(T40n1804)——律宗行事总纲，12卷
          • 《四分律含注戒本疏》——戒本注释
          • 《四分律删补随机羯磨疏》——羯磨法注释
          以「四分律通大乘」为宗旨，将戒律与唯识/华严义理会通，
          使律学从「小乘戒」提升为「大乘戒」。
          另有《续高僧传》(T50n2060)——中国佛教史最重要的传记文献之一。
      - title: 三大部与律宗传承
        body: |
          律宗「三大部」即道宣的《行事钞》《戒本疏》《羯磨疏》。
          唐代律宗三派并立：
          • 南山宗(道宣)——后为律宗正宗
          • 相部宗(法砺)——以相州日光寺得名
          • 东塔宗(怀素)——以太原东塔寺得名
          中唐以后南山宗独盛，宋元明清律宗传承皆以南山为宗。

  - id: vinaya_classics
    title: 律典要目
    icon: 📚
    topics:
      - title: 根本律典
        body: |
          • 《四分律》60卷(T22n1428)——汉传根本戒律。佛陀耶舍·竺佛念译
          • 《十诵律》61卷(T23n1435)——鸠摩罗什·弗若多罗译
          • 《五分律》30卷(T22n1421)——佛陀什·竺道生译
          • 《摩诃僧祇律》40卷(T22n1425)——佛陀跋陀罗·法显译
          • 《善见律毗婆沙》18卷(T24n1462)——律论
      - title: 大乘戒律
        body: |
          • 《梵网经》2卷(T24n1484)——大乘菩萨戒。十重四十八轻戒
          • 《菩萨璎珞本业经》——三聚净戒
          • 《优婆塞戒经》7卷(T24n1488)——在家菩萨戒
      - title: 律宗重要注疏
        body: |
          • 道宣《行事钞》12卷(T40n1804)
          • 元照《四分律行事钞资持记》(T40n1805)——宋代律学复兴巨著
          • 见月读体《毗尼日用切要》《传戒正范》——明末清初传戒规范
          • 弘一《四分律比丘戒相表记》——近代律学复兴标志

  - id: vinaya_history
    title: 律宗发展史
    icon: 📜
    topics:
      - title: 宋代复兴 — 元照与灵芝律学
        body: |
          唐末会昌法难后律学衰微。宋代元照(1048-1116)著《四分律行事钞资持记》，
          复兴南山律学，世称「灵芝律师」。其会通律、禅、净三门的立场，
          对后世影响深远。宋代设「律宗五山十刹」制度，律寺制度化。
      - title: 明清转型 — 传戒制度的成型
        body: |
          明末律宗复兴三大家：
          • 古心如馨(1541-1615)——重开律宗传承，称「中兴律祖」
          • 三昧寂光(1580-1645)——宝华山第一代律宗祖师
          • 见月读体(1601-1679)——宝华山第二代，《传戒正范》确立三坛大戒仪式
          宝华山律宗传承至今日，成为汉传佛教传戒的核心制度。
      - title: 近代复兴 — 弘一法师
        body: |
          弘一法师(李叔同，1880-1942)：近代律宗复兴的关键人物。
          • 1918年出家，专修南山律
          • 1931年创「南山律学院」，系统讲授戒律
          • 著《四分律比丘戒相表记》《南山律在家备览》等
          • 其「律己」精神——「惜福、习劳、持戒、自尊」——成为近代佛教人格典范
          弘一法师的律学复兴，使南山律宗在近代重现生机。
          赵朴初评价：「无尽奇珍供世眼，一轮圆月耀天心。」

  - id: vinaya_practice
    title: 戒律实践体系
    icon: 🙏
    topics:
      - title: 戒律的基本结构
        body: |
          • 三归五戒：在家众基础——不杀生·不偷盗·不邪淫·不妄语·不饮酒
          • 沙弥十戒：出家众初阶
          • 比丘二百五十戒·比丘尼三百四十八戒：具足戒
          • 菩萨戒：十重四十八轻(梵网)或三聚净戒
          • 三坛大戒：沙弥戒→比丘戒→菩萨戒的完整传戒仪式
      - title: 律宗修行特色
        body: |
          律宗以「戒」为修行本位，主张「戒律即是修行」：
          • 持戒清净为一切禅定智慧的根基——「由戒生定，由定发慧」
          • 律宗重视「羯磨」(僧团民主议决制度)——布萨·自恣·安居
          • 近代弘一法师以「持戒念佛」为毕生功课
          律宗与禅宗的关系：禅门「清规」即戒律的中国化创新，
          百丈怀海「一日不作一日不食」的农禅制度即戒律精神在禅宗的落实。

