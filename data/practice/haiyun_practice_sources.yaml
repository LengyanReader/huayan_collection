three_stages_quick_ref:
  stage1:
    name: 初阶·资粮道 (发心工程)
    name_en: "Stage one · the path of accumulation (the vow-engendering project)"
    technical: 数息法入门·注意息入息出长短·静中与动中观照
    technical_en: "Entering counting-the-breath practice, noting the length of the in- and out-breath, and illuminating contemplation in both stillness and movement"
    engineering: 破根本无明·勤忏悔·建立信根与定位
    engineering_en: "Breaking through the fundamental ignorance, diligent repentance, and establishing the root of faith and one's orientation"
    xuanmen: 句中玄
    source: 《禅修入门》系列 + 《煖身》(2021)
  stage2:
    name: 二阶·前行 (内摄工程)
    name_en: "Stage two · the preliminary practice (the inward-gathering project)"
    technical: 四种观法 (唯心识观→真如实观→毗婆舍那观→奢摩他观)·界内定
    technical_en: "The four contemplations (consciousness-only → suchness-reality → vipassanā → śamatha) and the concentration within the realms"
    engineering: 内摄·象限转移·瞬间定
    engineering_en: "Inward gathering, quadrant shifts, and momentary concentration"
    xuanmen: 句中玄→意中玄过渡
    source: 《禅修前行》系列 + 《迈向佛陀的境界》(2011)
  stage3:
    name: 三阶·正行 (等持工程)
    name_en: "Stage three · the actual practice (the meditative-equipoise project)"
    technical: 三摩呬多→三摩钵底→三摩地·法界三观·界外定
    technical_en: "samāhita → samāpatti → samādhi, the three contemplations of the dharma-realm, and the concentration beyond the realms"
    engineering: 观照(能所分离)→照住(能所合一)→照见(能所双泯)
    engineering_en: "illuminating contemplation (separation) → stabilized illumination (union) → clear seeing (mutual ceasing)"
    xuanmen: 意中玄→体中玄
    source: 《禅修正行》系列 (至少16集) + 《华严金师子章讲记》(2010)

