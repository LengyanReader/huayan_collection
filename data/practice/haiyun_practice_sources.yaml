# ── 技术面·工程面核心体系 ──
core_framework:
  description: |
    海云继梦法师将华严禅法分为「技术面」与「工程面」双轨——
    技术面 = 具体修行方法 (数息·提疑情·参话头·守风门)
    工程面 = 生命改造工程 (心灵转化·破无明·法身成长)
    三阶次第: 初阶(资粮道·发心工程) → 二阶(前行·内摄工程) → 三阶(正行·等持工程)
    正行三步骤: 观照(能所分离)→照住(能所合一)→照见(能所双泯)
  description_en: |
    Venerable Haiyun Jimeng frames Huayan chan practice along two tracks —
    the technical side and the engineering side —
    technical facet = concrete methods (counting the breath, raising the doubt-sensation,
    investigating the phrase head / huatou, guarding the breath-portal)
    engineering facet = a life-transformation project (transforming the mind,
    breaking through ignorance, the growth of the dharmakāya)
    The path proceeds in three stages: stage one (the path of accumulation, the vow-engendering
    project) → stage two (the preliminary practice, the inward-gathering project) →
    stage three (the actual practice, the meditative-equipoise project)
    The actual practice unfolds in three steps: illuminating contemplation (separation
    of perceiver and perceived) → stabilized illumination (union of perceiver and perceived) →
    clear seeing (the mutual ceasing of perceiver and perceived)
  source_lecture: "海云继梦《禅修正行》系列 (共至少12集, 2007-2008)"
  source_lecture_en: "Haiyun Jimeng, the \"Chan Practice Proper\" (Chan Xiu Zheng Xing) series — at least 12 sessions, 2007-2008"
  source_web: "华严禅观全程·修行蓝图 (大华严寺官网, 2025年11月访问)"

