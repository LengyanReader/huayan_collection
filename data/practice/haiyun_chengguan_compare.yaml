# 海云继梦 vs 成观法师 — 宗派·修行·思想对照
# 原则：每条必须可溯源，未检索到公开表述则注明
# 最后更新: 2026-08-08

meta:
  title: 海云继梦与成观法师 — 对照表
  note: |
    二人皆为贤首宗第42世传人(海云2008年·成观2010年)，皆活跃于当代台湾佛教。
    但法脉来源、修行重心、弘法风格迥异，构成当代华严系统两种互为补充的范式。
    本对照仅基于可公开检索的讲记和著作原文，未检索到公开表述处加注说明。

compare:
  - topic: 密宗·真言宗
    icon: 🔐
    haiyun:
      position: "瑜伽行派即密教"
      quote: |
        「瑜伽行派以『唯行』故，有驯服生命中杂染之功能，
        已逾越人类大脑的理性思维，而入不可思议之境，统称为『密』。」
        ——《显密两教定义之刍议》(fjdh.cn, 2013)
      note: |
        2008年底于印度接受胜师子王菩萨(Swami Rajarshi Muni)传法灌顶，
        自称接回「大乘瑜伽行法」(Maha Yogachar)，将其等同禅宗心法。
        著有《悠活三昧——密法修行概要》(空庭书苑)。
    chengguan:
      position: "显密性相合一炉"
      quote: |
        「我从初发心就相信佛讲的法是一切显密二教，是全体大法，
        显密性相都完整才叫圆满的全体佛法。」
        ——《大日经疏讲解》第11集(wmxf.net)
      note: |
        1996年于日本高野山获真言宗第53世传法灌顶阿阇梨位(三国传灯)。
        认为密法专门解决「七八识不可思议层面」的业力习气，
        补足显教仅到第六识的局限。著有《我的学密历程》。
    contrast: |
      海云以「瑜伽行=密」的范式将密宗纳入大乘瑜伽行派框架，
      强调逾越理性思维的「唯行」特质。
      成观以「显密性相全体」的范式将东密与唯识并举，
      强调密法在「七八识深层面」的技术不可替代性。
      二人对密宗的定位不同但皆非排斥立场。

  - topic: 唯识宗
    icon: 📖
    haiyun:
      position: "唯识须有实修心得"
      quote: |
        「千五百年来唯识宗未曾有人提出实修心得。必须依于实修，
        从有为行成就无为境。」
        ——《心法 转识成智》(fjdh.cn, 2013)
      note: |
        慈恩宗高原法系第18世传人。强调「转识成智」不能仅靠理论，
        需通过密法实修完成。其「三性三无性」的三转破执为唯识修法核心。
    chengguan:
      position: "唯识是修道心理学"
      quote: |
        「唯识学是专为佛法修行人设计的修道心理学，
        不能把唯识当作纯粹的学术来研究。」
        ——《唯识三十论颂义贯》讲解
      note: |
        慈恩宗第42世传人。著有唯识系列5种(三十论/百法/八识/观所缘缘/因明)。
        以「五位百法」为修行纲领，目标是「了有为、证无为」。
    contrast: |
      海云批评唯识缺乏实修传统，强调须以密法补足。
      成观则已将唯识本身作为修行体系来运用(百法→断惑证真)。
      二人分处「批判性补充」与「体系化运用」两个不同位置。

  - topic: 华严宗
    icon: 🪷
    haiyun:
      position: "普贤乘·新古典华严"
      note: |
        2008年承接贤首宗第42世法脉。以「普贤乘」命名当代华严实践体系，
        主张「教属华严，观属禅宗心法」，将华严理事圆融与东山法门等持工程融合。
        著有《九九華嚴玄談》《探玄記懸談講記》等，以现代语言重新诠释华严经教。
    chengguan:
      position: "贤首宗·慈恩宗双传"
      note: |
        2010年承接贤首宗第42世法脉(兼慈恩宗)。以译经为核心弘法方式，
        英译十余部汉传经典。《華嚴法門集要》为华严专书(见abtemple经书目录)。
        其华严弘传以忠实译介和经典注疏为主要形式，与海云的体系化创新形成对比。
    contrast: |
      海云以「重构」为旗帜(新古典华严·普贤乘·灵性经济学)，
      成观以「传承」为主轴(译经·注疏·义贯)。
      二人共同成就当代台湾华严传承的「创新」与「守正」两极。

  - topic: 天台宗
    icon: 📐
    haiyun:
      position: "中观论派·唯性学派"
      quote: |
        「唯性学派，又有天台宗……唯识的精微、唯智的般若、
        天台的性具，以及贤首的圆宗」皆属中观论派。
        ——综合《显密两教定义之刍议》等文
      note: 以判教方式将天台定位为「中观论派下的唯性学派」，与华严同属「性宗」。
    chengguan:
      position: "天台宗第46世传人"
      note: |
        1988年于纽约庄严寺依天台宗第45代传人显明老和尚座下披剃出家。
        但此后其弘法重心转向真言宗·贤首宗·唯识宗，天台宗相关内容
        在公开讲记和著作中所占比例较小。
        [注: 未检索到成观法师对天台教观的专门系统性评述]
    contrast: |
      海云以判教框架中定位天台；成观虽得天台剃度但弘法重心不在天台。

  - topic: 修行方法论
    icon: 🧘
    haiyun:
      position: "技术面+工程面双轨"
      note: |
        核心框架: 技术面(数息·提疑情·置心一处) + 工程面(生命改造·破无明)。
        三阶次第: 初阶(资粮道·发心工程) → 二阶(前行·内摄工程) → 三阶(正行·等持工程)。
        强调「直接从欲界出三界」的活心自观路线，以话头禅为核心方法。
        著有《禅修正行》《迈向佛陀的境界》《煖身》等修行指导。
    chengguan:
      position: "显密性相融汇"
      note: |
        以楞严经为修行总纲(被誉为「楞严座主」)，辅以唯识百法为心识地图，
        密宗真言为深层转化工具。强调「性相融合」——
        《大乘起信论》为「小本楞伽经」，将性宗与相宗打通。
        著有《楞严经义贯》等。
    contrast: |
      海云以「话头禅+瑜伽行」为双翼，重禅堂实修和次第推进。
      成观以「楞严为纲·唯识为目·真言为用」三足鼎立，重经教义贯和显密融合。
      海云的体系更具「禅宗本位」色彩，成观的体系更具「教下本位」色彩。

  - topic: 道家
    icon: ☯
    haiyun:
      position: "技术面对比参照"
      note: |
        在禅观教学中偶尔以道家「小周天」「太极」等概念做技术面对比参照。
        引庄子「齐物」与华严「事事无碍」、老子「道法自然」与「理事无碍」对读。
        [注: 未见海云法师对道家有系统性专论或评价]
    chengguan:
      position: "[未检索到公开表述]"
      note: |
        在可检索的公开讲记和著作中，未发现成观法师对道家思想的系统性评述。
    contrast: |
      海云以技术面对比的方式将道家纳入华严禅观的参照系。
      成观未见公开评述。

  - topic: 西方思想·哲学
    icon: 🌐
    haiyun:
      position: "灵性经济学批判"
      note: |
        中兴大学经济系毕业。以「灵性经济学」批判西方资本主义的
        「以物质欲望为驱动」模式，提出「第四波灵性革命」替代方案。
        引用Capra《物理学之道》、Varela神经现象学等西方前沿学术，
        将华严因陀罗网与西方系统论·全息论进行对话。
    chengguan:
      position: "译经实践"
      note: |
        台湾师范大学英语系毕业，美国德州TCU英研所深造。
        以英译汉传经典为实践方式，将《法华》《楞严》《金刚》《坛经》
        等十余部核心经典译为英文，让西方世界直接接触汉传佛教原典。
        [注: 未检索到成观法师对西方哲学的专门性评述]
    contrast: |
      海云以「批判+对话」姿态处理西方思想(灵性经济学·跨学科对话)。
      成观以「翻译+传播」姿态让汉传经典走向西方。
      二人面向西方的策略互补而非对立。