sections:
- id: yk_overview
  title: 名相辨析 · 般若·空宗·三论·中观
  title_en: "Terminology: Prajñā, the Emptiness School, the Three Treatise School, and Madhyamaka"
  icon: 🕳
  intro_en: |-
    The terms prajñā, the "emptiness school," the Three Treatise school, and Madhyamaka are often used interchangeably in Chinese Buddhist discourse, yet each names a distinct—even if overlapping—object of reference. This section maps the four terms across literature, doctrinal allegiance, institutional lineage, and philosophical school, then traces their interrelations through Indian origins, Chinese translations, and modern reappraisals.
  intro: '「般若」「空宗」「三论宗」「中观」四个名相在汉语佛教语境里常被交替使用，但严格说指向四个既重叠又不完全等同的对象：

    **般若**是文献学范畴——一整套「诸法性空」的般若波罗蜜多经典系统；

    **空宗**是立场/阵营范畴——与「有宗」（唯识）相对举的思想阵营，外延随时代而变；

    **三论宗**是宗派建制范畴——隋代吉藏基于鸠摩罗什所译龙树、提婆三部论典建立的具体宗派；

    **中观**是哲学学派范畴——龙树开创、经数百年发展出应成/自续分支、在汉地失传后于藏地延续至今的印度学派。

    本页循此脉络，从印度龙树奠基，经魏晋格义与罗什译场、吉藏集大成，到藏传格鲁派当代辩经传统与法尊、印顺的重新引介，再落脚于西方学界与日本「批判佛教」思潮的当代争议——六个维度（学术·教界·演变·法脉·融合·现代）彼此交织、互相印证。'

  topics:
  - title: 「性宗—相宗」框架中的定位
    title_en: "Positioning within the Xingzong/Xiangzong Binary"
    body: '在汉传「性宗」「相宗」二元框架中，本页所论的四者统属「性宗」（空宗）一侧，与法相唯识（相宗，见「法相玄机」tab）相对举。

      **但性宗内部并不整齐**——既包括般若中观系统，也包括如来藏·真常唯心一系（天台·华严·禅宗所依托的思想资源）。

      二者在近现代「空有之争」之外，还存在一场同样重要却较少被系统梳理的张力——「性寂与性觉」之辨（详见下文「融合与张力」节）。

      **四者边界有别**：般若(文献) ⊇ 空宗(阵营) ⊇ 三论宗(建制) ⊇ 中观(学派)，交集极大但各有侧重，读者宜在具体语境下辨析其确切所指。'
    source: 本系列姊妹篇《法相唯识宗全方位研究》· 刘峰教授三论宗研究
    en_body: |-
      In the Chinese framing of "nature schools" versus "characteristics schools," all four objects of this page fall on the nature-school (emptiness) side, opposed to Dharma-characteristics Yogācāra. Yet the nature school itself is not uniform: it embraces both the prajñā-Madhyamaka system and the tathāgatagarbha "permanently true mind" lineage underlying Tiantai, Huayan, and Chan. Beyond the modern "emptiness versus existence" dispute lies another tension—that between "nature quiescence" and "nature awakening"—taken up in the synthesis section. The four terms stand in a hierarchy of scope: prajñā (literature) ⊇ emptiness school (camp) ⊇ Three Treatise school (institution) ⊇ Madhyamaka (school).
  - title: 一个方法论提醒 — 宗派史叙述的层累
    title_en: "A Methodological Caution: The Stratified Nature of Lineage Histories"
    body: '本领域的「宗派史」叙述，相当一部分是后世（尤其日本学僧）系统化整理的产物，与史料本身的原始记载之间存在不小的层累距离。

      **「三论宗」名号即为一例**：这一宗派名称最早见于日本僧人凝然（1240-1321）所撰《八宗纲要钞》与《三国佛法传通源起》，完整的印度—中国祖师谱系（印度以文殊·马鸣·龙树为高祖至三祖，中国起于罗什、下传昙济·道朗·僧诠·法朗·吉藏）也是在凝然著作中首次定型。

       中文与日文维基百科均指出：「因为三论宗在印度及汉地的传承来自于后世日本僧人的整理，所以它的内容多有疑问。」

      **这不意味着罗什—僧肇—僧朗—僧诠—法朗—吉藏的实际师承是虚构的**（《续高僧传》等中土史料有扎实记载），而是提醒：把这条脉络包装成具有印度「高祖—次祖—三祖」完整谱系的「宗派」，是后世（尤其日本佛教）的建构工作。

      类似地，「应成」「自续」之名在印度并不存在，是藏地学者对既有论辩史的追认式系统化——与「三论宗」名号形成一组有趣的跨文化平行案例。（作为存疑提示：将这组分类术语直接套用于佛护、清辨在世时的印度原境，可能存在轻微的时代错置风险。）'
    source: 凝然《八宗纲要钞》· 前田慧云《三论宗纲要》· 学界关于「应成/自续」名相系藏地后设的讨论
    en_body: |-
      Much of the "lineage history" in this field is the product of later—chiefly Japanese-monastic—systematization, standing at some remove from the raw sources. The very name "Three Treatise school" is a case in point: it first appears in the works of the Japanese monk Ninken (Gyonen, 1240–1321), who also fixed the full Indian-Chinese patriarch list. This does not mean the actual teacher-student chain from Kumārajīva through Sengzhao, Senglang, Sengquan, Falang, to Jizang is fictitious—it is well attested in Chinese sources—but it reminds us that framing it as an "Indian-lineaged school" is a later construction. Similarly, the names Prāsaṅgika and Svātantrika did not exist in India itself but were retrospective systematizations by Tibetan scholars—an instructive cross-cultural parallel, with a caveat that applying these labels to the living context of Buddhapālita and Bhāviveka may risk mild anachronism.

- id: yk_india
  title: 印度渊源
  title_en: "Indian Origins"
  icon: 🌏
  intro_en: |-
    The Indian sources of the Madhyamaka school: the rise and compilation of the Perfection of Wisdom sūtras, the foundational work of Nāgārjuna and Āryadeva, the "Prāsaṅgika-Svātantrika" divergence among Buddhapālita, Bhāviveka, and Candrakīrti, and the Yogācāra-Madhyamaka synthesis of Śāntarakṣita and Kamalaśīla.
  intro: '中观学派的印度源头：般若经典的兴起与结集、龙树与提婆的奠基、
    佛护·清辨·月称「应成—自续」的分流、寂护·莲花戒「随瑜伽行中观」的综合。'
  topics:
  - title: 般若经典的兴起与结集
    title_en: "The Rise and Compilation of the Perfection of Wisdom Sūtras"
    body: '般若类经典是大乘佛教中形成最早的一批经典。据西方学者爱德华·孔兹（Edward Conze）的四阶段分期，最早的《八千颂般若》约成立于公元一世纪中叶印度案达罗王朝时期；此后结集增衍延续至公元十世纪，形成从八千颂、二万五千颂、十万颂乃至更庞大的「大品」「小品」诸本并行的复杂文献群。

      核心思想两大支柱：**空性**——「一切皆空、不可得」的体悟；**慈悲**——普度有情的利他实践。

      龙树活跃的公元二三世纪之交，正是《小品般若》《大品般若》两大系统流行的时代，构成他建构中观哲学的直接文献基础。'
    en_body: |-
      The Perfection of Wisdom (Prajñāpāramitā) sūtras are among the earliest Mahāyāna scriptures. Following Edward Conze's four-phase periodization, the earliest *Aṣṭasāhasrikā* (Eight Thousand-line) text dates to the mid-first century CE under the Indian Andhra dynasty, with compilation continuing into the tenth century and producing a complex family of texts ranging from eight thousand to twenty-five thousand, a hundred thousand, and more lines. The corpus rests on two pillars: emptiness—the realization that all dharmas are empty and ungraspable—and compassion, the altruistic practice of liberating beings. Nāgārjuna was active at the turn of the second and third centuries, precisely when the Smaller and Greater Perfection of Wisdom systems circulated; they formed the direct textual basis of his Madhyamaka philosophy.
  - title: 龙树与提婆 — 中观学派的奠基
    title_en: "Nāgārjuna and Āryadeva: The Founders of the Madhyamaka School"
    body: '**龙树**（Nāgārjuna，约150-250）出身南印度婆罗门种姓，先习小乘后转大乘，被尊为「第二代释迦」、汉传「八宗共祖」。依《般若经》「缘起性空」造《中论》（《中观论颂》），以「缘起—性空—假名—中道」四者等同立宗：

      「**众因缘生法，我说即是空，亦为是假名，亦是中道义**」

      另著《十二门论》《七十空性论》《六十如理论》《回诤论》《大智度论》等。印顺依藏传传统将其著作分「深观」（《中论》等，抉择甚深法义的方法学）与「广行」（《大智度论》等，阐述菩萨广大行）。

       **提婆**（Āryadeva，约170-270，狮子国王族或南印度婆罗门二说）以「破而不立」著《百论》，最负盛名者为十六品《四百论》——仅后八品译成汉文（《广百论本》），前八品长期唯赖藏译保存，是汉藏传译「各有缺环、彼此互补」的例证。提婆长于论辩屡挫外道，相传遭外道怀恨遇刺身亡；其「独目」（一说舍一目供神、一说赠予求乞妇人）的传说，也为其形象增添了几分传奇色彩。汉传尊龙树、提婆为初祖、二祖；禅宗「西天二十八祖」列提婆为第十五祖；藏传并称「二胜六庄严」之「二胜」。

      **注意**：「中观学派」作为具备明确轮廓的思想共同体，其实是龙树身后约三百年、经佛护与清辨相继为《中论》作注后才真正成形——龙树开创的是「思想」，「学派」的建制化是后人的工作。'
    en_body: |-
      Nāgārjuna (c. 150–250), a Brahmin of South India, first studied Hīnayāna before turning to Mahāyāna; revered as a "second Śākyamuni" and a common patriarch of the eight Chinese schools, he composed the Mūlamadhyamakakārikā on the basis of the prajñā teaching that dependent origination and emptiness are one, declaring that conditioned arising, emptiness, conventional designation, and the middle way are equivalent. He also wrote the Dvādaśanikāyaśāstra, the *Śūnyatāsaptativi*, the *Yuktiṣaṣṭikā*, the *Vigrahavyāvartanī*, and the Mahāprajñāpāramitāśāstra. Āryadeva (c. 170–270), famed for "refuting without positing," composed the Śataśāstra and the sixteen-chapter *Catuḥśataka*, only the last eight chapters of which survive in Chinese—the rest preserved only in Tibetan, exemplifying how the Chinese and Tibetan canons complement each other. The "Madhyamaka school" as a coherent community only truly took shape some three centuries later, through the commentaries of Buddhapālita and Bhāviveka; what Nāgārjuna founded was a way of thinking, and its institutionalization was the work of later generations.
  - title: 佛护·清辨·月称 — 应成与自续的分流
    title_en: "Buddhapālita, Bhāviveka, Candrakīrti: The Prāsaṅgika-Svātantrika Split"
    body: '**佛护**（Buddhapālita，约470-540）著《中论注》，以「归谬论证」（随应破，prasaṅga）解经：只破对方论点中的矛盾，不正面提出独立主张，甚至连「空」这一说法本身也要一并遣除（「非唯空有，亦复空空」）。

      **清辨**（Bhāviveka，约490-570）认为佛护此法不够严谨，主张援引陈那因明逻辑、以独立比量（自续，svatantra）正面立论，著《般若灯论释》，其中二十余次直接批评佛护。

      **月称**（Candrakīrti，约七世纪）著《明句论》《入中论》反驳清辨、力挺佛护，巩固「随应破」一系。

      北大学报专论概括：「中观派思想格局的形成，正是以反对或拥护佛护为分水岭，是发端于佛护，成型于清辨，巩固于月称。」

      后世藏传据此分**应成派**（Prāsaṅgika，佛护·月称·寂天为宗主）与**自续派**（Svātantrika，清辨为宗主，后再分「顺经部行自续」与「顺瑜伽行自续」两支）。'
    en_body: |-
      Buddhapālita (c. 470–540) commented on the Mūlamadhyamakakārikā by redargutio ad absurdum—only refuting the internal contradictions of an opponent's position without advancing an independent thesis, going so far as to negate even emptiness as a claim. Bhāviveka (c. 490–570) judged this insufficiently rigorous and instead drew on Dignāga's logic to argue positively by independent inference (svatantra), composing the *Prajñāpradīpa* and criticizing Buddhapālita more than twenty times. Candrakīrti (seventh century), in his *Prasannapadā* and Madhyamakāvatāra, rebutted Bhāviveka and defended Buddhapālita, consolidating the "reductio" line. As a Peking University study summarizes, the doctrinal shape of the Madhyamaka school turned on support for or opposition to Buddhapālita—beginning with him, crystallized by Bhāviveka, and consolidated by Candrakīrti. Later Tibetan tradition accordingly divided the school into Prāsaṅgika (Buddhapālita, Candrakīrti, Śāntideva) and Svātantrika (Bhāviveka), the latter further splitting into Sautrāntika- and Yogācāra-flavored branches.
  - title: 寂护·莲花戒 — 随瑜伽行中观的综合
    title_en: "Śāntarakṣita and Kamalaśīla: The Yogācāra-Madhyamaka Synthesis"
    body: '七、八世纪之交，中观与瑜伽行两大学派由分庭抗礼走向交融。清辨门下的**寂护**（Śāntarakṣita）著《中观庄严论》，将唯识心识分析纳入中观自续派框架，建立「**随瑜伽行中观派**」：世俗谛层面「无外境、有内心」，胜义谛层面「内心亦无自性」——折衷调和空有二宗。

      弟子**莲花戒**（Kamalaśīla）著《中观庄严论精释》《中观光明论》阐发。寂护应藏王赤松德赞之请入藏弘法，藏王一度诏令全藏以寂护之见为规范，是较早将成体系中观思想引入西藏的关键人物；朗达玛灭佛后其影响相对有限，部分见地主要保留在宁玛派传承中。

      **《中观庄严论》直至2004年才由当代译者完整译成汉文出版**——一个跨越千余年的翻译缺口在21世纪才被填补。'
    en_body: |-
      At the turn of the seventh and eighth centuries the two great schools of Madhyamaka and Yogācāra moved from rivalry toward convergence. Śāntarakṣita, of Bhāviveka's lineage, wrote the *Madhyamakālaṃkāra* and incorporated Yogācāra analysis of consciousness into the Svātantrika-Madhyamaka frame, founding the "Yogācāra-Madhyamaka" school: at the conventional level no external objects exist though mind does, while at the ultimate level even mind lacks self-nature—a compromise between the emptiness and existence schools. His disciple Kamalaśīla, author of the *Madhyamakālaṃkārapañjikā* and the *Madhyamāloka*, elaborated this. Invited to Tibet by King Trisong Detsen, Śāntarakṣita helped introduce organized Madhyamaka thought into the region; though its influence waned after the persecution of Langdarma, some of its views survive in the Nyingma tradition. Remarkably, the Madhyamakālaṃkāra was not fully translated into Chinese until 2004—a thousand-year gap filled only in the twenty-first century.

- id: yk_lineage
  title: 汉传法脉
  title_en: "The Chinese Transmission"
  icon: 🏛
  intro_en: |-
    From the eastward transmission of prajñā and the age of "matching meanings" (geyi), through the translation project of Kumārajīva and Sengzhao's Zhao Lun, to the Three Treatises lineage of Mount She (Senglang, Sengquan, Falang) and its culmination in Jizang—a "nature school" that took root, flourished, and then fell silent in China.
  intro: '从般若东传与「格义」时代、鸠摩罗什译场、僧肇《肇论》，
    到摄山三论（僧朗·僧诠·法朗）与吉藏集大成——一条「性宗」义学在中国扎根、鼎盛又迅速沉寂的轨迹。'
  topics:
  - title: 般若东传 — 早期汉译与格义时代
    title_en: "The Eastward Transmission of Prajñā: Early Translations and the Geyi Era"
    body: '般若类经典是最早传入中国的大乘经典。东汉桓灵之际（约178-189）**支娄迦讖**译出《道行般若经》十卷（即《八千颂般若》），是般若学在中国的开端。

      此后：朱士行260年西行至于阗求梵本，无罗叉·竺叔兰291年共译《放光般若经》；竺法护286年译《光赞般若经》；鸠摩罗什404、408年重译《大品》《小品般若》——译笔精审，成为最通行文本；直至唐代玄奘659-663年在玉华宫寺主持编译600卷《大般若经》（十六会），般若经典的汉译方告完备。

      **六家七宗**（格义）：鸠摩罗什精审译出之前，中土对「空」义的理解长期借助黄老之学与魏晋玄学类比诠释——「格义」。刘宋昙济（411-475）著《六家七宗论》（已佚，赖宝唱《续法论》引文保留）归纳为（本有六家，「本无」析为二宗遂成七宗）：

      - **本无宗**（道安）：以「无」为诸法本体，近于玄学「贵无」论；

      - **本无异宗**（竺法深、竺法汰）：于本无宗基础上另立新解；

      - **即色宗**（支遁/支道林，314-366）：「色不自色，虽色亦空，即色是空，非色灭空」——色法当体即空，不待色灭而后为空；

      - **识含宗**（于法开）：三界如长夜大梦、心识为梦主，带唯识「识变」思想的早期萌芽；

      - **幻化宗**（道壹）：世谛诸法皆如幻化，唯「心神」不空；

      - **心无宗**（支愍度等）：主张心不执取外物（心无），但不否认外物本身的实有；

      - **缘会宗**（于道邃）：诸法因缘和合而有，缘散则无。

      其中即色、本无异、心无三家，正是僧肇《不真空论》逐一批破的对象。'
    en_body: |-
      The Perfection of Wisdom scriptures were among the earliest Mahāyāna texts brought to China. Zhi Loujiachen (Lokakṣema) rendered the Daoxing Prajñā in ten fascicles (the Eight Thousand-line text) circa 178–189 CE, marking the beginning of prajñā studies in China. Subsequent translations included Zhu Shixing's westward quest for the Sanskrit text (260), the Fangguang Prajñā (291), Zhu Fahu's Guangzan Prajñā (286), and Kumārajīva's meticulous retranslations of the Greater and Smaller Prajñā (404, 408), which became the standard versions; the project reached completion only when Xuanzang produced the six-hundred-fascicle Mahāprajñāpāramitā-sūtra at Yuhua Palace in 659–663. Before these precise renderings, Chinese understanding of emptiness relied on "matching meanings" (geyi) with Daoist and Xuanxue categories. The monk Tanji (411–475) systematized the "six schools, seven schools" (six schools, with "original nonbeing" split into two giving seven): Benwu, Benwuyi, Jise, Shihan, Huanhua, Xinwu, and Yuanhui—of which Sengzhao's Bu Zhenkong Lun later singled out the Jise, Benwuyi, and Xinwu schools for refutation.
    source: 僧祐《出三藏记集》· 僧叡六家说 · 昙济《六家七宗论》(佚·宝唱引) · 僧镜《实相六相论》· 周颙《三宗论》
  - title: 僧肇与《肇论》 — 格义的终结
    title_en: "Sengzhao and the Zhao Lun: The End of Geyi"
    body: '**僧肇**（384-414）京兆长安人，早年精研老庄，二十岁已是关中名僧，后拜罗什为师、协助译经，被誉为「解空第一」，为「什门四圣」之一。

      将四篇哲学论文——《般若无知论》《不真空论》《物不迁论》《涅槃无名论》——总编为《**肇论**》。

      《不真空论》专门针对心无、即色、本无异三家逐一批驳：诸法虽因缘和合、虚妄不真（「不真」），却并非空无一物（「故空」），真正中道应是「非有非无，亦有亦无」。

      **意义**：标志着中国佛教对般若性空义理的理解，从依附玄学概念的「格义」阶段，第一次真正达到印度中观原典的精微层次——后世吉藏《中论疏》回顾六家七宗时，仅认可道安「本无义」与支道林「即色义」较近经论正义。'
    en_body: |-
      Sengzhao (384–414), from Chang'an, studied Laozi and Zhuangzi intensively in his youth and was already a celebrated monk of Guanzhong at twenty before studying under Kumārajīva and assisting in his translations; lauded as "first in understanding emptiness," he was one of the "four sages of Kumārajīva's gate." His four philosophical essays—the *Bore Wuzhi Lun* (on prajñā's non-knowing), *Bu Zhenkong Lun* (on the unreality of emptiness), *Wu Buqian Lun* (on the immobility of things), and *Niepan Wuming Lun*—were gathered into the Zhao Lun. The *Bu Zhenkong Lun* refutes in turn the Xinwu, Jise, and Benwuyi schools: though dharmas, arising through dependent origination, are unreal ("not true"), they are not absolute nothingness ("therefore empty"); the true middle way is "neither existent nor nonexistent, both existent and nonexistent." Its significance: for the first time Chinese Buddhism's grasp of prajñā emptiness reached the subtlety of the Indian Madhyamaka originals, leaving behind the geyi stage that leaned on Xuanxue concepts.
  - title: 鸠摩罗什与译场 — 三论理论的奠基
    title_en: "Kumārajīva and the Translation Bureau: Grounding the Three Treatise Doctrine"
    body: '**鸠摩罗什**（343-413）生于西域龟兹，父天竺人、母龟兹王妹，幼年出家，先习小乘后遍学大乘般若。前秦吕光西征后被挟持滞留凉州十七年——这段经历使他深谙中土语言民情，为翻译事业打下基础。

      后秦弘始三年（401）姚兴迎罗什入长安，次年于逍遥园开译场，聚集僧俗数千人，「三千弟子共翻经」。据僧祐《出三藏记集》较可信统计，罗什一生译出经论35部294卷（《开元释教录》记为74部384卷，其中混入失译、伪托之作，需加辨别）。

      重要译作：《摩诃般若》《小品般若》《妙法莲华经》《维摩诘经》《阿弥陀经》《金刚经》，以及龙树、提婆一系《中论》《百论》《十二门论》《大智度论》（百卷）等中观根本论典。

      413年罗什圆寂，临终发愿所译若不谬愿荼毘后舌根不烂——后世相传应验，舌舍利供奉于甘肃武威鸠摩罗什寺塔。'
    en_body: |-
      Kumārajīva (343–413), born in Kucha to an Indian father and a Kuchan princess-mother, left home early, studying first Hīnayāna and then the Mahāyāna prajñā. Detained at Liangzhou for seventeen years after Lü Guang's western campaign, he gained a deep command of Chinese language and customs that served his translation work. In 401 Emperor Yao Xing welcomed him to Chang'an, and from the next year he presided over a translation bureau at Xiaoyao Garden, gathering thousands of monks and laymen—the "three thousand disciples translating scriptures together." By the more reliable count of Sengyou's *Chu Sanzang Jiji*, he translated 35 works in 294 fascicles. His major works include the Mahāprajñā, the Smaller Prajñā, the Lotus, the Vimalakīrti, the Amida, the Diamond Sūtra, and the core Madhyamaka texts—the Mūlamadhyamakakārikā, Śataśāstra, Dvādaśanikāyaśāstra, and the hundred-fascicle Mahāprajñāpāramitāśāstra. On his death in 413 he vowed that if his translations were true, his tongue would remain intact after cremation—a vow tradition holds was fulfilled; the relic is enshrined in his stūpa at Wuwei.
    source: 僧祐《出三藏记集》· 慧皎《高僧传·鸠摩罗什传》
  - title: 什门弟子 — 四圣·八俊·十哲
    title_en: "The Disciples of Kumārajīva: Four Sages, Eight Worthies, Ten Philosophers"
    body: '罗什门下弟子号称三千，佼佼者的组合排序历来诸说不一（史料本身并不统一）：

      **什门四圣**（关中四圣，4人）：道生、僧肇、道融、僧叡（另有版本作道生·僧肇·道融·慧观，或道生·慧睿·慧观·慧严）

      **什门八俊**（8人）：四圣 + 昙影、慧严、慧观、道恒

      **什门十哲**（10人）：八俊 + 道标、僧䂮
      其中**僧叡与僧肇并称「三论宗二祖」**——罗什传译三论、僧肇以《肇论》贯通义理，二人共同奠定三论学说在中国扎根的理论基础。'
    en_body: |-
      Rumored three thousand disciples studied under Kumārajīva, and the groupings of his most outstanding followers vary across the sources, which are themselves inconsistent. The "four sages, eight worthies, and ten philosophers" are the most common framings. The four sages are Daosheng, Sengzhao, Daorong, and Sengrui (though some versions substitute other names). The eight worthies add Tanying, Huiyan, Huiguan, and Daoheng to the four; the ten philosophers add Daobiao and Sengnie. Among these, Sengrui and Sengzhao are jointly honored as the "two patriarchs of the Three Treatise school": Kumārajīva transmitted the three treatises, and Sengzhao unified their doctrine through the Zhao Lun, together establishing the theoretical foundation for the Three Treatise teaching to take root in China.

  - title: 摄山三论 — 僧朗·僧诠·法朗
    title_en: "The Three Treatises of Mount She: Senglang, Sengquan, and Falang"
    body: '罗什、僧肇相继辞世后（413、414），三论之学一度陷入沉寂——注意：这并非缘于某「外部」学派挤压，而是罗什门下弟子群体自身分流：僧肇早逝，僧叡·道生·慧观等转弘《法华》《涅槃》，僧嵩·僧导专意弘扬《成实论》（出自罗什译场），遂使「成实宗」自罗什门下分化而出，至梁代法云、僧旻、智藏「梁代三大法师」时一度成为南朝佛教主流。南北朝中期以后《成实论》《十地经论》《摄大乘论》日益流行，三论学说的低潮一直持续至僧朗重振（约401-480）。

      **僧朗**（齐建武年间494-497，一说479）高丽僧，北游入关学得罗什、僧肇旧义后南下，隐居摄山（栖霞山）师事法度，以「难成实师」力挫《成实论》——三论重光，栖霞寺因此常被尊为「三论宗初祖」道场。**但僧朗在北方从何人学得三论正义，吉藏自述已「传承不明」**——史源本身承认存在断裂的环节。

      **僧诠**：梁武帝遣僧诠等十人从僧朗受学，唯僧诠尽得法要，长住摄山止观寺、终身不下山，世称「止观诠」，倡「唯存中观」（吉藏《二谛义》评此一系「直辔一乘，横行出世」）。门下「**诠公四友**」：法朗、慧辩、慧勇、慧布（时人语「四句朗，领悟辩，文章勇，得意布」），三论自此从山林走向城邑。

      **法朗**：陈永定二年（558）奉诏入京住兴皇寺，大张讲席二十五年，「常随之众千余人」「西至巴蜀，南极吴越，北到河北」，人称「伏虎朗」。三论至此成为南朝陈代主流之一，门下集大成者正是吉藏。'
    source: 吉藏《中论疏》《二谛义》· 《续高僧传·法朗传》· 三论宗在金陵与成实学派竞争的学界考订
    en_body: |-
      After the deaths of Kumārajīva and Sengzhao (413, 414), the Three Treatise teaching fell into silence—owing not to pressure from an external school but to the internal divergence of Kumārajīva's own disciples: Sengzhao died young, while Sengrui, Daosheng, and Huiguan turned to the Lotus and Nirvāṇa and Sengsong and Sengdao devoted themselves to the Satyasiddhi, giving rise to a "Satyasiddhi school" that became mainstream in the Southern Dynasties. Its low ebb lasted until the revival under Senglang (c. 401–480). Senglang, a monk of Koguryŏ ancestry, learned the orthodox teaching of Kumārajīva and Sengzhao in the north, then retired to Mount She (Qixia) under Fayuan, defeating the Satyasiddhi masters and restoring the Three Treatises—though Jizang himself admitted the source of Senglang's northern transmission was "unclear." His student Sengquan, alone among the ten sent by Emperor Wu of Liang, mastered the doctrine, dwelling all his life at Zhiguan Monastery and advocating "only the middle view." His "four friends"—Falang, Huibian, Huiyong, and Huibu—carried the school from the mountains to the cities. Falang, summoned to the capital in 558 to preside at Xinghuang Temple for twenty-five years, drew audiences from across the realm, and under him the Three Treatises became a mainstream of Chen-dynasty learning—his culminating heir being Jizang.
  - title: 吉藏 — 三论宗的实际集大成者
    title_en: "Jizang: The True Culminator of the Three Treatise School"
    body: '**吉藏**（549-623）祖籍安息（中亚），生于金陵，父亲曾携他拜谒在金陵弘法的真谛（唯识旧译关键人物），真谛为其取名「吉藏」——日后「性宗」集大成者的名字出自「相宗」旧译传统开创者之手，是一个饶富意味的细节。

      七岁投法朗门下，十九岁代师复讲；隋平百越后移住会稽嘉祥寺，「嘉祥大师」之号由此而来。一生历经梁·陈·后梁·北齐·北周·隋·唐数朝更迭，据学者统计前后经历约三十四位国主、四十五个年号。

      著述宏富：《中观论疏》《百论疏》《十二门论疏》《大乘玄论》《二谛义》《法华玄论》等数十部。其中奉隋炀帝之命而作的《**三论玄义**》以「立宗宣言」姿态确立三论理论纲领——将罗什·僧肇·僧诠·法朗数代积累系统化，使三论从「学派」升格为具严密理论架构的「宗派」（581-623年为黄金时代）。

       他自幼长于激烈义学辩论环境，养成好辩性格，创宗前后纵横破斥地论师·摄论师诸家，与享誉三代的僧粲公开辩论数日终获胜绩；因早年即受皇室礼遇也养成了几分骄慢的作风，后人甚至讥其「爱狎风流」——这些不那么「高僧传」式的记载，恰恰提醒我们吉藏是一个有血有肉的历史人物，而非单薄的教条化祖师形象。晚年亲搜散佚文疏积满三间屋子，著述中因此保存了不少已佚珍贵史料（如僧睿《成实论序》马鸣、龙树年代记载）。临终撰《死不怖论》示寂。'
    en_body: |-
      Jizang (549–623), of Parthian (Central Asian) ancestry, was born in Jinling. His father once brought him to pay respects to Paramārtha, the key figure of the old Yogācāra translation tradition, who gave him the name "Jizang"—a striking detail, that the culler of the "nature school" received his name from the founder of the old "characteristics school" translation line. At seven he joined Falang's circle and at nineteen substituted for his teacher in lecturing; after the Sui pacification he moved to Jiaxiang Temple in Kuaiji, whence the title "Great Master Jiaxiang." His life spanned a succession of dynasties—Liang, Chen, Later Liang, Northern Qi, Northern Zhou, Sui, Tang—roughly thirty-four rulers and forty-five reign-names. His prolific writings include commentaries on the three treatises, the Da Cheng Xuan Lun, the Er Di Yi, and more; among them the San Lun Xuan Yi, composed at the behest of Emperor Yang of Sui, stands as a founding manifesto that systematized the accumulated work of his predecessors and elevated the Three Treatises from a "school" to a "lineage" with rigorous theoretical architecture (its golden age, 581–623). Nurtured in fierce doctrinal debate, he acquired a combative temper and a measure of pride from early imperial favor—facts that remind us he was a man of flesh and blood, not a flat hagiographic icon. In his old age he gathered scattered lost texts to fill three rooms, thereby preserving valuable vanished materials.

- id: yk_doctrine
  title: 核心教义
  title_en: "Core Doctrine"
  icon: ⚖
  intro_en: |-
    The originality of the two truths doctrine "grounded in the middle way," the layered negation of the eightfold denial of the middle way, and the method of "refuting the erroneous to reveal the correct" without establishing a school of one's own—at bottom the core doctrine of the Three Treatise lineage is a set of negative analytical tools rather than a positive ontology.
  intro: '二谛义「以中道为体」的独创、八不中道的层层遮遣、破邪显正不立一宗的方法论——
    三论一系的核心教义本质上是一套否定性的分析工具，而非一套正面的存在论建构。'
  topics:
  - title: 二谛义 — 吉藏「以中道为体」的独创
    title_en: "The Two Truths: Jizang's Original Doctrine of the Middle Way as Their Substance"
    body: '**二谛**（真谛、俗谛）是印度中观学说的基本框架，但吉藏在此基础上提出一个学界公认**三论宗独创、印度原典所无**的论点：二谛不仅是「教」（言教方便），更应「**以中道为体**」——真俗二谛的根本依据、其所表之理，就是不落两边的中道本身。

      《大乘玄论》将二谛义展开为十重（标大意·释名·立名·有无·二谛体·中道·相即·摄法·辨教·同异），并强调「**于教二谛，他家所无，唯山门相承有此义也**」——二谛本身即是佛陀施设的言教（能诠），其所诠之理是超越有无二边的「不二」。此「教二谛」说被吉藏视为三论一系区别于他宗的独门心印。

      学者指出，这一思路明显受魏晋玄学「言意之辨」「本末体用」论争启发，但在思想实质上与玄学论题根本差异，是一次成功的哲学范畴移植与再创造。'
    source: 吉藏《大乘玄论》卷二 · 《二谛义》
    en_body: |-
      The two truths (conventional and ultimate) are a basic framework of Indian Madhyamaka, but Jizang added a point widely regarded as original to the Three Treatise school and absent from the Indian sources: the two truths are not merely "teachings" (expedients of speech), but should be "grounded in the middle way"—the ultimate basis and the principle they express is the middle way itself, which falls to neither extreme. The Da Cheng Xuan Lun unfolds the two truths through ten layers and stresses, quoting the master's own words, that understanding the two truths as both teaching and taught (the "teaching two truths") is the exclusive heart-seal of this lineage. Scholars note the idea is clearly inspired by the Wei-Jin Xuanxue debates on "words and meaning" and "root and function," yet in substance it is fundamentally different from those Xuanxue topics—a successful transplantation and recreation of a philosophical category.
  - title: 八不中道
    title_en: "The Eightfold Negation of the Middle Way"
    body: '《中论》开篇标举「**八不**」：「不生亦不灭，不常亦不断，不一亦不异，不来亦不出」。吉藏据此发展出精细的「八不中道」论，将四对否定分别对应四类须被对治的执见：

      - **不生不灭**：对治阐提（断灭善根者与执定诸法实有者两种极端）的偏执

      - **不常不断**：对治声闻乘畏惧生死、耽著涅槃两种执着

      - **不一不异**：对治外道「我与五蕴一」或「我与五蕴异」两种见解

      - **不来不出**：对治独觉与初发心菩萨对因缘生灭来去之见

      通过层层遮遣，最终「正显三论宗的三种中道」——不落世谛、不落真谛、非真非俗。'
    source: 吉藏《中观论疏》· 《中论》归敬颂
    en_body: |-
      The Mūlamadhyamakakārikā opens with the "eight denials"—neither arising nor ceasing, neither permanent nor annihilated, neither one nor many, neither coming nor going. Jizang developed from this a refined doctrine of the eightfold negation of the middle way, mapping each pair of negations onto a class of mistaken attachment to be counteracted: neither arising nor ceasing counters the two extremes of the icchantika; neither permanent nor annihilated counters the śrāvaka's fear of saṃsāra and attachment to nirvāṇa; neither one nor many counters the two heterodox views that the self is identical with or distinct from the aggregates; neither coming nor going counters the views of pratyekabuddhas and newly aspiring bodhisattvas concerning arising, ceasing, coming, and going. Through this layered negation, the three middle ways of the Three Treatise school are finally revealed—falling into neither the conventional nor the ultimate truth, and beyond both true and false.
  - title: 破邪显正 — 不立一宗的方法论
    title_en: "Refuting the Erroneous to Reveal the Correct: A Method That Establishes No School"
    body: '吉藏将三论一系的根本方法概括为「**破邪显正**」——通过破斥一切「有所得」的偏执见解，间接显明「无所得」的诸法实相，而不正面另立一套新的实体性主张。

      这一方法论上承佛护「是遮非表」的应成传统，呼应龙树、提婆「破而不立」的立场。

      **这正说明三论宗为何在中国诸宗中显得「最不像一个有实质内容的宗派」**——它本质上是一套否定性的分析工具，而非正面的存在论建构；也正因如此，「破邪显正」作为方法论，反而可以穿越宗派边界，成为禅宗「空观」与天台「三谛圆融」的共用资源。'
    en_body: |-
      Jizang summed up the fundamental method of the Three Treatise lineage as "refuting the erroneous to reveal the correct" (po xie xian zheng)—by refuting all one-sided views tainted by attainment (you suo de), indirectly revealing the true aspect of dharmas as non-attainment (wusuode), without positively erecting a new substantive system. This method inherits Buddhapālita's reductio tradition of "only negating, not asserting," echoing the "refute without positing" stance of Nāgārjuna and Āryadeva. It explains why the Three Treatise school appears the "least like a school with real content" among Chinese schools: it is essentially a set of negative analytical tools rather than a positive ontology. For this very reason, the method could cross sectarian boundaries and become a shared resource for both Chan "emptiness contemplation" and Tiantai's "perfect interpenetration of the three truths."

- id: yk_decline
  title: 演变式微
  title_en: "Decline and Fading"
  icon: 📉
  intro_en: |-
    After Jizang, the Three Treatise school fell silent in China for nearly a millennium—for four principal reasons—a trajectory closely paralleling the fate of Dharma-characteristics Yogācāra in the sister "Faxiang Xuanji" tab of this series.
  intro: '吉藏之后，三论宗在中土迅速沉寂近千年——原因可归纳为四大方面，
    这一轨迹与本系列「法相玄机」中法相唯识的命运高度相似。'
  topics:
  - title: 四大式微原因
    title_en: "Four Causes of Decline"
    body: '1. **吉藏之后再无同等量级领军人物**：「藏门五英」（慧远·智凯·智命·寂师·知命）虽各有专精，均未能达到吉藏「独步当时」的综合成就，宗派缺乏持续理论创新动力；

      2. **缺乏切实的行证传统**：「破邪显正」本质上是分析性、否定性的，长于义理思辨而相对疏于具体止观修证法门——这与三论宗高度依赖「论辩」而非「仪轨/禅法」的历史形成方式直接相关；

      3. **被同时代新兴宗派正面挤压**：吉藏身后不久，玄奘·窥基法相唯识宗以更严整的因明体系登场，天台宗以「教观并重」确立地位——中土文献明确记载「因天台、慈恩各宗和它相竞，不久就渐趋衰微」；

      4. **禅宗兴盛与思潮转向**：中唐以降「不立文字、教外别传」的禅宗以更简易直捷的修行方式取代繁琐义学辩论，三论式高密度论证风格逐渐失去社会土壤。

      **对照**：两个在唐初一度并峙的「新学」（法相尚「有」、三论尚「空」），最终都在中唐以后让位于更本土化、简易化的性宗诸派（天台·华严·禅·净）。'
    source: 汤用彤·吕澂等对三论宗式微的史源归纳
    en_body: |-
      Four reasons account for the near-millennium of silence after Jizang. First, no leader of comparable stature followed him: the "five worthies of the Zang gate" each had their own expertise but none matched his comprehensive achievement, so the school lacked sustained theoretical innovation. Second, it lacked a substantial tradition of actual practice: "refuting the erroneous" is analytical and negative, strong in doctrinal debate but weak in specific practices of meditation and ritual—tied to the school's historical formation through disputation rather than liturgy or chan. Third, it was pressed by newer contemporaneous schools: soon after Jizang, Xuanzang and Kuiji's Dharma-characteristics school appeared with more rigorous logic, and Tiantai established itself through "teaching and contemplation held in equal regard," so that, as Chinese sources record, competing with Tiantai and Cien schools it soon declined. Fourth, the rise of Chan and a turn in intellectual currents: from the mid-Tang, Chan's "no dependence on words" offered a simpler, more direct path, and the Three Treatises' dense argumentation lost its social footing. In sum, the two once-rivaling "new studies" of the early Tang both yielded after the mid-Tang to the more nativized and simplified nature schools—Tiantai, Huayan, Chan, and Pure Land.

- id: yk_overseas
  title: 域外传播
  title_en: "Transmission Abroad"
  icon: 🗺
  intro_en: |-
    After its silence in China, the Three Treatise teaching became the very beginning of sectarian Buddhism in Japan (one of the Nara Six Schools); on the high plateau of Tibet, meanwhile, Madhyamaka took a completely different path of independent development that continues to this day.
  intro: '三论之学在汉地沉寂后，却在日本成为宗派佛教的开端（南都六宗之一）；
    而在雪域高原，中观思想走上一条截然不同、延续至今的独立发展路径。'
  topics:
  - title: 日本三论宗 — 南都六宗
    title_en: "The Japanese Three Treatise School: One of the Nara Six Schools"
    body: '吉藏的高丽弟子**慧灌**于隋唐之际入华，在吉藏门下学成后625年奉命东渡日本，在元兴寺大弘三论之学——是日本宗派佛教的开端，三论宗列入「南都六宗」。

      慧灌弟子智藏（二祖）、再传道慈（三祖，曾入唐兼学多宗、师从元康）先后赴华求法，形成元兴寺、大安寺两大流派。

      但入日后的三论宗因与新兴法相唯识宗竞争，逐渐「已失其本真」——日僧勤操·玄睿·隆海等人实际更多援引天台「权实」判教框架对抗唯识，而非严格的中观论辩。奈良时代之后逐渐式微，但吉藏著述反因日僧持续研习、翻刻而在日本获得比故土更长久的流传。'
    en_body: |-
      Jizang's Korean disciple Ekwan (Huiguan) studied in China and, at the turn of the Sui-Tang period, was dispatched to Japan in 625, where he propagated the Three Treatise teaching at Gangō-ji—marking the beginning of sectarian Buddhism in Japan, with the Three Treatise school counted among the "six Nara schools." Ekwan's disciple Chizō (second patriarch) and his successor Dōji (third patriarch, who also studied various schools in Tang China) successively journeyed to China, giving rise to the Gangō-ji and Daian-ji branches. Yet once in Japan the school, competing with the nascent Dharma-characteristics tradition, gradually "lost its true character"—Japanese monks such as Gongō, Genbai, and Ryūkai more often invoked the Tiantai "provisional versus real" panjiao framework against Yogācāra than actual Madhyamaka debate. It faded after the Nara era, though Jizang's works, kept in circulation by continuous Japanese study and reprinting, enjoyed a longer lifespan in Japan than in his homeland.
  - title: 新罗「新三论」的疑点
    title_en: "The Dubious New-Three-Treatises Theory of Silla"
    body: '日本学者前田慧云（1857-1930）提出「新三论宗」说——经日照三藏（613-687）另传智光、清辨系新学说，再传至华严宗贤首法藏与新罗元晓。

      **疑点**：日照三藏所传文献实际以密宗与法相唯识为主、罕见中观论著，中日两地学界普遍认为这一支「新三论」传承「可能是虚构的」。读者若遇此说，应留意其史源薄弱性。'
    en_body: |-
      The Japanese scholar Maeda Eun (1857–1930) proposed a "new Three Treatise school" theory—that Rizhao (613–687) separately transmitted a new doctrine of the Zhiguang and Bhāviveka line, which passed on to the Huayan master Fazang and the Silla monk Wonhyo. The problem: the texts Rizhao transmitted were chiefly esoteric and Dharma-characteristics in nature, with Madhyamaka treatises rarely among them, and scholars in both China and Japan generally regard this "new Three Treatises" transmission as possibly fictitious. Readers encountering this theory should note its weak textual basis.
  - title: 藏传中观的独立发展路径
    title_en: "The Independent Development of Tibetan Madhyamaka"
    body: '与汉传三论宗命运形成鲜明对照：中观思想在藏传佛教中不仅未曾断绝，反而经历持续近千年的系统化发展并延续至今。

      **汉藏两地对印度中观遗产的继承走上截然不同的两条路**：中土主要传译罗什时代（佛护、清辨之前）相对早期的中观论典（《中论》《十二门论》《百论》《大智度论》）；应成派与随瑜伽行自续派晚期核心论著则「由西藏人大量译入藏文，得以保存至今」，直至民国经法尊法师重新译回汉文，汉语世界才第一次系统接触这一支学说的完整晚期面貌。

      **饶富意味的细节**：后续零星译出的清辨系论典——《大乘掌珍论》《广百论本》及护法所释《大乘广百论释论》——其汉译者恰恰是**玄奘**：这位「有宗」法相唯识的开创者晚年亲自译出这几部「空宗」论典，是「空有二宗」在同一位译者身上直接交汇的例证（不过在其毕生逾千卷译经中，中观部仅占三卷）。'
    en_body: |-
      In stark contrast to the fate of the Chinese Three Treatise school, Madhyamaka in Tibetan Buddhism was never interrupted but underwent nearly a millennium of systematic development continuing to the present. The two regions inherited the Indian Madhyamaka legacy along completely different paths: China chiefly translated the relatively early treatises from Kumārajīva's era (predating Buddhapālita and Bhāviveka)—the Mūlamadhyamakakārikā, the Dvādaśanikāyaśāstra, the Śataśāstra, and the Mahāprajñāpāramitāśāstra—while the late core works of the Prāsaṅgika and Yogācāra-Svātantrika lines were translated into Tibetan on a large scale and so preserved; only when Fazun retranslated them into Chinese in the Republican period did the Chinese-speaking world first systematically encounter this line's complete late form. A telling detail: the Bhāviveka-line texts later sporadically rendered into Chinese—the *Mahāyānakaraṭāla-ratna*, the later chapters of the *Catuḥśataka*, and Dharmapāla's *Mahāyāna-śatakā-śāstra-vṛtti*—were translated precisely by Xuanzang, the founder of the "existence school" of Dharma-characteristics, who in his later years personally translated these "emptiness school" treatises: a direct meeting of the two schools in a single translator (though of his thousand-plus fascicles of translations, the Madhyamaka portion occupies a mere three).

- id: yk_tibetan
  title: 藏传格鲁派与中观应成见
  title_en: "The Tibetan Gelug and the Prāsaṅgika View"
  icon: 🏔
  intro_en: |-
    The entry of the Prāsaṅgika into Tibet (Atiśa and the Kadam school), Tsongkhapa's establishment of the Gelug Prāsaṅgika view, and the Gelug debating-college system—the most complete contemporary presentation of "Madhyamaka" as a living contemplative tradition.
  intro: '应成派入藏（阿底峡·噶当派）、宗喀巴确立格鲁派应成中观见、格鲁派辩经学院制度——
    「中观学」作为一种活的修行传统在当代最完整的呈现形式。'
  topics:
  - title: 阿底峡与噶当派 — 应成派入藏
    title_en: "Atiśa and the Kadam: The Prāsaṅgika Enters Tibet"
    body: '寂护·莲花戒一系的随瑜伽行中观在朗达玛灭佛（九世纪中叶）后一度式微。西藏佛教「后弘期」，**阿底峡**尊者依寂天一系教义入藏传法，著《菩提道灯论》，创立**噶当派**，将月称一系的应成中观正式引入西藏，为后来格鲁派思想体系奠定基础。'
    en_body: |-
      The Yogācāra-Madhyamaka line of Śāntarakṣita and Kamalaśīla declined after King Langdarma's persecution of Buddhism (mid-ninth century). In the "later dissemination" (phyi dar) of Tibetan Buddhism, the renowned Indian master Atiśa entered Tibet following the teaching of Śāntideva's line, composed the Bodhipathapradīpa (Lamp for the Path to Enlightenment), and founded the Kadam school, thereby formally introducing the Prāsaṅgika Madhyamaka of Candrakīrti's line into Tibet and laying the foundation for the later Gelug doctrinal system.
  - title: 宗喀巴与格鲁派的确立
    title_en: "Tsongkhapa and the Establishment of the Gelug"
    body: '**宗喀巴**（1357-1419）少时先习显密诸法，16岁入卫藏学习《中观论》《因明论》《般若经》《律经》等，42岁获读佛护《中论注》，由此「认识到月称和清辨两家见解的异同，了悟『缘起性空』，提倡『应成派中观见』」。44岁完成《菩提道次第广论》，52岁作《辨了不了义论》，59岁作《菩提道次第略论》，62岁完成《入中论广释》。

      将应成中观确立为**格鲁派**（黄教）核心宗义，并建立系统显密教理与庞大辩经学院制度，使此见地此后数百年在藏传佛教格局中居于主导。民国时期法尊法师将《菩提道次第广论》《密宗道次第广论》《入中论善显密意疏》等译为汉文，是汉语世界系统了解格鲁派中观见的主要渠道。'
    en_body: |-
      Tsongkhapa (1357–1419) first studied the sūtras and tantras in his youth, entered Ü-Tsang at sixteen to study the Mūlamadhyamakakārikā, logic, the Perfection of Wisdom, and the Vinaya, and at forty-two read Buddhapālita's commentary on the Mūlamadhyamakakārikā, through which he "recognized the differences between the views of Candrakīrti and Bhāviveka, comprehended dependent origination and emptiness, and advocated the Prāsaṅgika view." At forty-four he completed the Lamrim Chenmo, at fifty-two the Drang nges legs bshad snying po, at fifty-nine the Lamrim Chungwa, and at sixty-two his great commentary on the Madhyamakāvatāra. He established the Prāsaṅgika view as the core doctrine of the Gelug (Yellow Hat) school, built a systematic sūtra-tantra curriculum and vast debating-college system, and this view dominated the Tibetan Buddhist landscape for centuries to come. In the Republican era, Fazun translated the Lamrim Chenmo, the sNgags rim chen mo, and the Zab mo dgongs pa'i rgyan into Chinese, providing the Chinese-speaking world its main channel to the Gelug Madhyamaka view.
  - title: 宁玛·萨迦·觉囊的不同声音
    title_en: "The Differing Voices of Nyingma, Sakya, and Jonang"
    body: '**提醒**：「应成派中观见即藏传佛教中观正统」的印象，很大程度上是格鲁派自17世纪后凭政教合一地位与大规模辩经学院系统塑造的结果——近代中国（主要经由法尊等入藏求法僧人）与西方学者接触藏传中观时，所得诠释角度因此几乎「一面倒」偏向格鲁宗风。

      但藏传佛教内部远非铁板一块：**觉囊派「他空见」**（遍计所执、依他起可说「自空」，但圆成实性、如来藏、阿赖耶识本身「自性有、实体有」）与格鲁派「自空」针锋相对，被格鲁派视为大力破斥的异见；**萨迦派**批评觉囊「他空」落于「常边」；近代**宁玛派**大师米旁（1846-1912）专门重申宁玛派与格鲁派不尽相同的独立见地。

      「藏传中观」本身也是内部存在长期辩论的复合体。'
    en_body: |-
      The impression that the Prāsaṅgika view is the orthodox Madhyamaka of Tibetan Buddhism was largely shaped by the Gelug's dominance since the seventeenth century, through its politico-religious position and its vast debating-college system; consequently, both modern Chinese (chiefly via monks such as Fazun who studied in Tibet) and Western scholars encountered Tibetan Madhyamaka almost uniformly through a Gelug lens. Yet Tibetan Buddhism is far from monolithic: the Jonang "other-emptiness" (gzhan stong) view—that the perfected nature, tathāgatagarbha, and ālayavijñāna are intrinsically real—sharply opposes the Gelug "self-emptiness," which forcefully refutes it; the Sakya school criticizes Jonang other-emptiness as falling to the permanentist extreme; and the modern Nyingma master Mipham (1846–1912) explicitly reaffirmed a Nyingma view distinct from the Gelug. "Tibetan Madhyamaka" is thus itself a composite marked by long-standing internal debate.
  - title: 格鲁派辩经传统 — 活的中观修学实践
    title_en: "The Gelug Debating Tradition: Living Madhyamaka Practice"
    body: '与三论宗在中土因「缺乏切实行证」而衰微形成对照：藏传格鲁派将中观应成见的学习制度化为一套延续至今、活生生的辩经实践——僧人以立宗、答辩、因明论式往复攻防的方式，将抽象的空性哲学转化为日常修学功课。

      僧人自入寺起按显教课程次第学习《中观论》《入中论》等根本论典，通过日复一日的立宗答辩将抽象空性论证内化为直觉性观照能力。这套体系经宗喀巴创立以来六百余年持续运作，是「中观学」作为活的修行传统在当代最完整的呈现形式。'
    en_body: |-
      In contrast to the Three Treatise school's decline in China from a lack of concrete practice, the Tibetan Gelug institutionalized the study of the Prāsaṅgika view as a living debating practice that continues today: monks engage in repeated dialectical attack and defense—stating a thesis, answering challenges, and wielding the forms of Buddhist logic—thereby converting abstract emptiness philosophy into daily study. From entering the monastery, monks progress through the exoteric curriculum of such foundational texts as the Mūlamadhyamakakārikā and the Madhyamakāvatāra, internalizing abstract emptiness arguments into an intuitive capacity of insight through day-to-day thesis-and-response debate. Operating continuously for over six hundred years since Tsongkhapa, this system is the most complete contemporary embodiment of Madhyamaka as a living contemplative tradition.

- id: yk_revival
  title: 近现代复兴与发展
  title_en: "Modern Revival and Development"
  icon: 📜
  intro_en: |-
    Yang Renshan's recovery of Three Treatise commentaries from Japan, Fazun's systematic introduction of Tibetan Prāsaṅgika texts, and Yinshun's historical-critical studies of Madhyamaka—the twentieth-century revival of the Three Treatise school shared its documentary champions with the Yogācāra revival.
  intro: '杨仁山从日本抄回三论章疏、法尊系统引入藏传中观应成典籍、
    印顺开启历史考证式中观研究——二十世纪的三论复兴，与唯识复兴共享同一批文献功臣。'
  topics:
  - title: 杨仁山与金陵刻经处 — 三论章疏重见天日
    title_en: "Yang Renshan and the Jinling Scriptural Press: The Three Treatise Commentaries Recovered"
    body: '近现代般若中观之学的复兴，第一步归功于**杨仁山**——金陵刻经处从日本抄回、刻印流通的散佚典籍，不仅包括唯识宗文献，也包括早已「基本失传」的三论宗古籍。二十世纪初三论章疏得以重见天日，杨仁山之功不亚于对唯识文献的贡献。'
    en_body: |-
      The first step in the modern revival of prajñā-Madhyamaka learning belongs to Yang Renshan (Yang Wenhui), whose Jinling Scriptural Press recovered from Japan, reprinted, and circulated lost works—including not only Yogācāra texts but also the long-lost commentaries of the Three Treatise school. It was in the early twentieth century that these Three Treatise commentaries saw the light of day again, and Yang Renshan's contribution here is no less than his service to the Yogācāra corpus.
  - title: 法尊法师与汉藏教理院 — 藏传中观的系统引入
    title_en: "Fazun and the Sino-Tibetan Buddhist Studies Institute: The Systematic Introduction of Tibetan Madhyamaka"
    body: '**法尊法师**（1902-1980）民国「留藏学法团」核心成员，1930年抵拉萨师从安东格西钻研《菩提道次第》《入中论》，1931年——恰与太虚创办**汉藏教理院**同年——开始翻译《菩提道次第广论》。1934年返内地后长期主持汉藏教理院教学。

      此后数十年陆续译出《入中论》《入中论自释》（月称造）、《入中论善显密意疏》（宗喀巴造）等应成中观根本典籍——是二十世纪汉语世界系统引入藏传中观应成见最重要的翻译家，直接填补了「应成派典籍未及时传入汉地」的历史缺口。'
    en_body: |-
      Fazun (1902–1980), a core member of the Republican-era "group for studying the Dharma in Tibet," reached Lhasa in 1930 and studied the Lamrim and Madhyamakāvatāra under the Geshe Ngando; in 1931—the same year Taixu founded the Sino-Tibetan Buddhist Studies Institute—he began translating the Lamrim Chenmo. Returning to the interior in 1934, he long directed teaching at the Institute. Over the following decades he translated the Madhyamakāvatāra, Candrakīrti's own commentary, and Tsongkhapa's Zab mo dgongs pa'i rgyan, among other foundational Prāsaṅgika works—the most important translator of the twentieth century for systematically introducing the Tibetan Prāsaṅgika view to the Chinese-speaking world, directly filling the historical gap left by the late arrival of Prāsaṅgika texts in China.
  - title: 印顺法师的中观研究之路
    title_en: "Yinshun's Path of Madhyamaka Studies"
    body: '**印顺法师**（1906-2005）与中观的因缘据其自述颇富传奇：1927年初读佛典第一部就是《中论》，当时「什么都不明白」却生出难以言喻的向往，最终促成出家；出家后一度专攻唯识，「不久即回归空宗——嘉祥的三论宗」。

      抗战西游四川接触藏传中观学说，治学方法发生重大转折——「不再以玄谈为满足，而从初期圣典中，领略到佛法的精神」，即从纯粹思辨转向以阿含、部派文献为基础的历史考证式研究。1942-43年讲授《中论》（由演培记录整理，后成《中论讲记》初稿），1946年于汉藏教理院开讲「性空导论」，1947年冬应《海潮音》之约以「中观今论」为题随讲随刊——当时现场真正能完全听懂的听众仅续明、星森二人。

      原计划撰「性空思想史」（上编阿含之空·阿毗昙之空；中编性空大乘经之空·中论之空；下编真常者之空·唯识者之空·中观者之空），因战乱未成，仅上编约十万字独立成书为《性空学探源》。晚年集大成之作《空之探究》（1985）系统追溯「空」义从阿含经、部派论书到《中论》的演进脉络。

      **注意**：印顺站在中观「自空」立场，批判锋芒不仅指向唯识，也延伸至天台、华严二宗——认为二者仍带「他空」性质残余自性见。**这是印顺个人判教立场，代表教界内部一种历史考证式批判声音，而非教界共识**；太虚一系及当代主流修学依据者持不同看法，两种立场至今并存于汉传佛教内部。'
    en_body: |-
      Yinshun (1906–2005) recounted his karmic connection with Madhyamaka: in 1927 the first Buddhist text he read was the Mūlamadhyamakakārikā, which he "did not understand in the least" yet felt an inexpressible attraction that eventually led to his ordination. After ordination he focused briefly on Yogācāra before "soon returning to the emptiness school—Jiashan's Three Treatise school." During the war he went to Sichuan and encountered Tibetan Madhyamaka, a turning point in method as he moved from abstract speculation to historical-critical study grounded in the Āgamas and Abhidharma literature. He lectured on the Mūlamadhyamakakārikā in 1942–43, opened a course on "emptiness" at the Sino-Tibetan Institute in 1946, and published the Zhong Guan Jin Lun serially from 1947. His planned "history of the thought of emptiness" never came to completion owing to the war, but its first part became the Xing Kong Xue Tan Yuan; his late magnum opus, the Exploration of Emptiness (1985), systematically traced the evolution of "emptiness" from the Āgamas and Abhidharma to the Mūlamadhyamakakārikā. His critique from the "self-emptiness" standpoint extended even to Tiantai and Huayan, treating them as retaining a "other-emptiness" residue—a personal judgment voiced as one historical-critical voice within the Buddhist community, not a consensus; Taixu's circle and contemporary mainstream practice hold different views, and both positions persist.

- id: yk_practice
  title: 修行界与内部视角
  title_en: "The Practice World and Internal Perspectives"
  icon: 🧘
  intro_en: |-
    In sharp contrast to the decline of the Three Treatise school as an institutional sect, the Perfection of Wisdom scriptures themselves have always stayed at the very frontier of everyday Han Buddhist practice. This section presents how contemporary monks still teaching in the front line directly interpret and teach prajñā, Madhyamaka, and tathāgatagarbha.
  intro: '与三论宗作为建制性「宗派」早已衰微形成鲜明对照：般若类经典本身始终活跃于汉传日常修持最前沿。
    本节呈现当代仍在一线弘法的法师本人对般若、中观、如来藏诸义理的直接阐释与教学取向。'
  topics:
  - title: 般若经典在汉传日常修持中的地位
    title_en: "The Place of the Perfection of Wisdom Scriptures in Everyday Han Buddhist Practice"
    body: '《**般若波罗蜜多心经**》全文仅二百余字，是中国佛教各宗各派共同持诵、传播最广的经典，几乎没有宗派边界；《**金刚经**》是出家在家信众日常早晚课核心经典之一，历代《金刚般若经集验记》一类感应故事集记录了诵经获福、避祸、乃至超度亡者的灵验传说——如隋代秦州人王陀诵《金刚经》，却退了前来索命的恶鬼——般若信仰由此在民间社会落地生根、从哲学思辨演变为具体宗教实践。

      因六祖惠能闻经开悟的公案，《金刚经》与禅宗结下不解之缘。本系列已梳理的**成观法师**著述目录中亦有专门「心经系列」，并将《金刚经》译为英文（*The Diamond Sutra*）——可见即便以法相唯识见长的教内学者，般若经典注解与弘传也是其法务一部分，印证了般若经典「跨宗派」的独特地位。'
    en_body: |-
      The Heart Sūtra, only a little over two hundred characters, is the most widely recited scripture shared by every school of Chinese Buddhism, almost without sectarian boundary; the Diamond Sūtra is a core text of the daily morning and evening services for monastics and laypeople alike, and collections of miracle tales such as the record of responses to the Diamond Prajñā document accounts of blessings, harm-averting, and even liberating the dead—as where Wang Tuo of Qinzhou in the Sui dynasty recited the Diamond Sūtra and drove off a vengeful ghost. Prajñā faith thus took root in popular society, evolving from philosophical reflection into concrete religious practice. Through the famous kōan of Huineng's awakening upon hearing it, the Diamond Sūtra became bound up with Chan. In this series, Master Chengguan's bibliography includes a dedicated Heart Sūtra series and an English translation of the Diamond Sūtra—showing that even scholars of the Dharma-characteristics school treat the annotation and propagation of prajñā scriptures as part of their work, confirming the "trans-sectarian" standing of the prajñā scriptures.
  - title: 圣严法师 — 「心的经典」同一部经的三种讲法
    title_en: "Master Shengyan: The Mind Classic—One Sūtra Taught Three Ways"
    body: '台湾法鼓山创办人**圣严法师**《心的经典：心经新释》是当代汉语世界流传最广的《心经》诠释著作之一，汇集三次讲说记录——是观察「教界如何因应不同受众调整同一教义讲法」的绝佳样本：

      **「心经禅解」**（纽约东初禅寺）：听众程度整齐，侧重佛学思想与禅观贯通，征引大小乘经论，便于学人实际禅修参考；

      **「心经讲记」**（台北农禅寺）：依传统「序分·正宗分·流通分」科判逐句解说，逐层标示佛教宇宙观、人生观、三世因果观及菩萨佛果位次，体系严谨；

      **「心经实践」**（台北国父纪念馆）：一连三晚、每晚三四千人，讲法更通俗、贴近日常生活应用。

      圣严自述《心经》「以基本原始的佛法为底子，以大乘空义的佛法为灵魂」，是「遇浅即浅、逢深则深」的经典——这段夫子自道恰是对「内部视角」与「学术视角」何以能共存于同一部经典诠释史的最好注脚。'
    source: 圣严法师《心的经典：心经新释》（陕西师范大学出版社，2010）
    en_body: |-
      Master Shengyan, founder of Taiwan's Dharma Drum Mountain, authored "The Mind Classic: A New Explanation of the Heart Sūtra," among the most widely circulated Chinese commentaries on the Heart Sūtra, bringing together records of three talks and offering a fine sample of how the Buddhist community adapts the same teaching to different audiences. The "Heart Sūtra Chan Explanation," given at the Eastern Ch'an Temple in New York before a uniformly trained audience, stresses the union of Buddhist thought and chan contemplation and cites scriptures of both great and lesser vehicles for practical meditators. The "Heart Sūtra Commentary," given at Nung Chan Monastery in Taipei, follows the traditional tripartite structure of introduction, main body, and circulation, systematically laying out Buddhist cosmology, worldview, the view of three-time karma, and the stages of bodhisattva and Buddha. The "Heart Sūtra Practice," given at the Sun Yat-sen Memorial Hall over three nights to three or four thousand people each, was more accessible and life-oriented. Shengyan described the Heart Sūtra as "built on fundamentally primitive Buddhism with the emptiness thought of the Mahāyāna as its soul," a text that "is shallow when met with shallow, deep when met with deep"—the best gloss on how internal and academic perspectives can coexist in the history of interpreting one scripture.
  - title: 济群法师 — 中观·唯识·如来藏：大乘的三个基本正见
    title_en: "Master Jiqun: Madhyamaka, Yogācāra, and Tathāgatagarbha as the Three Basic Correct Views of the Mahāyāna"
    body: '苏州西园寺戒幢佛学研究所所长**济群法师**在其「四十五年说法的精髓」系列开示中有专章正面处理三者关系——当代教界一线弘法人士对本主题最直接、最完整的公开表态之一。

      开宗明义将三者并列为「**大乘的三个基本正见**」，借用印顺「性空唯名系、虚妄唯识系、真常唯心系」说法作参照——但与印顺带历史考证、层级判摄意味的处理不同，济群的讲法整体更接近「三者各有安立、应机而用」的并列态度，而非裁定何者「了义」、何者「方便」。

      - **中观**：汉传之外藏传同样高度重视般若经典——许多藏族家庭供奉《般若八千颂》为加持祈福，格鲁派「对般若思想推崇备至，并以中观应成派的见地为究竟」。

       - **唯识**：以「绳蛇之喻」说明三性——绳（依他起）客观存在，蛇（遍计所执）纯属错觉却「作用是真实的」，修行即「改变蛇的认识，恢复绳的认识」，进而照见绳亦是缘起假有；个人表态「在我二十多年的弘法过程中，也深深受益于唯识思想」，认为唯识对妄心的细致剖析与现代心理学相通，故「更容易被现代人所接受」。他还提及真谛早年译出《十七地论》（即玄奘后来重译《瑜伽师地论》之祖本）因战乱仅译五卷而中辍、玄奘西行求法正是为求此论全本的因缘。

      - **如来藏**：依《坛经》「一念迷即众生，一念悟即佛」说明顿悟法门成立根据正是「本来就具有和诸佛无二无别的潜质」这一见地；随即给出坦率的教界内部反省：「越是快捷的方法，对根机的要求越高……好简会流于肤浅，直接会流于粗陋，心地法门会流于口头玄谈……**这也是汉传佛教走向衰落的原因之一**」——他将自创的「三级修学」明确定位为针对这一具体病灶的建制性回应。'
    source: 济群法师《走近佛陀，认识佛法（四十五年说法的精髓之中观、唯识、如来藏）》· 山东宁津普渡寺网站转载
    en_body: |-
      Master Jiqun, director of the Jiezhuang Institute of Buddhist Studies at West Garden Temple in Suzhou, devotes a chapter of his series "the essence of forty-five years of teaching" to directly handling the relations among Madhyamaka, Yogācāra, and tathāgatagarbha—one of the most direct and complete public statements on this theme by a contemporary frontline Dharma teacher. He names the three together as "the three basic correct views of the Mahāyāna," borrowing Yinshun's schema of the emptiness-and-name-only, false-discrimination-only-consciousness, and true-constant-mind systems as reference—but unlike Yinshun's historical-critical and hierarchical treatment, Jiqun takes a more equalized stance that "each has its own place and is applied according to capacity," rather than adjudicating which is definitive and which expedient. On Madhyamaka he notes Tibetan Buddhism too prizes the prajñā scriptures, many Tibetan families enshrining the Aṣṭasāhasrikā for blessing and the Gelug holding the Prāsaṅgika view as ultimate. On Yogācāra he uses the rope-snake simile for the three natures, finding Yogācāra's meticulous analysis of the deluded mind comparable to modern psychology and thus more readily accepted; he recalls that Paramārtha's early partial translation of the seventeen-ground text was interrupted by war, which Xuanzang later went west to seek in full. On tathāgatagarbha he grounds the sudden teaching in the inherent potential identical with the buddhas, and offers a candid internal reflection that over-simplification and facile directness are among the reasons for the decline of Han Buddhism—positioning his own "three-stage curriculum" as an institutional response to this very malady.
  - title: 三论「破而不立」精神的修行意涵
    title_en: "The Contemplative Import of the Three Treatises' Spirit of Refuting Without Positing"
    body: '三论宗虽作为具体宗派早已式微，但其「破邪显正」「无所得」的方法论精神，通过散见于禅宗语录、天台止观论著中的「空观」分析持续发挥实际的修行指导作用——不预设任何实体性见解、以彻底否定性分析破除一切「有所得」执着，这一方法论本身即是一种可操作的观行次第，而非纯然书斋思辨。'
    en_body: |-
      Though the Three Treatise school has long faded as a concrete sect, the methodological spirit of "refuting the erroneous to reveal the correct" and "non-attainment" continues to function as practical contemplative guidance through the analyses of "emptiness contemplation" scattered in Chan records and Tiantai meditation treatises. Without presupposing any substantive view, this method uses thorough negative analysis to break all attachment to attainment—a methodology that is itself an operable sequence of observation and practice, not mere bookish speculation.
  - title: 汉传三论义学的当代薪传 — 刘峰教授个案
    title_en: "The Contemporary Transmission of Han Three Treatise Doctrine: The Case of Professor Liu Feng"
    body: '与藏传辩经体系兴旺形成对照，汉传三论宗直至最近仍面临「有教材、无传人」的窘境——太虚、印顺虽在近代陆续讲授中观思想，但严格以「三论宗」义学为专精方向、致力于培养后继研究者的僧才长期屈指可数。

      据教界内部资料，**中国佛学院刘峰教授**近年投入大量心力专门培养三论宗研究方向学僧，被视为当代汉传佛教院校体系内三论义学薪传的一个具体、可考的个案。

      **对照**：法相唯识虽亦无独立法脉，但因太虚以来被列入僧伽教育核心课程而广泛传习；三论宗连这一「必修课」式建制化传承都相对薄弱，当代命运更多系于个别学者、个别院校的专门投入——印证了「三论宗缺乏持续行证与传承建制」的历史病灶至今仍未完全愈合。'
    en_body: |-
      In contrast to the thriving Tibetan debating system, the Han Chinese Three Treatise school until recently faced the predicament of "having textbooks but no successors": although Taixu and Yinshun lectured on Madhyamaka in modern times, monks strictly specializing in Three Treatise doctrine and dedicated to cultivating successors have long been few. According to internal community sources, Professor Liu Feng of the Chinese Buddhist Academy has in recent years devoted considerable effort to training monastic students in the Three Treatise direction, and is regarded as a concrete, verifiable case of passing on Three Treatise learning within the contemporary Han Buddhist academy system. In comparison, although Dharma-characteristics Yogācāra also lacks an independent lineage, it has been widely transmitted since Taixu as a core curricular subject for monastic education; the Three Treatise school has lacked even such an institutionalized transmission, its modern fate resting on the special investment of individual scholars and institutions—confirming that the historical malady of the school's weak sustained practice and transmission structure remains unhealed.

- id: yk_academic
  title: 学术前沿
  title_en: "Academic Frontiers"
  icon: 🔬
  intro_en: |-
    The genealogy of Western Madhyamaka studies (Stcherbatsky to Murti to Garfield to Westerhoff), the contemporary debate on Nāgārjuna's four propositions and paraconsistent logic, the Japanese "Critical Buddhism" movement and its echoes in China and the West, and the contemporary extensions of the emptiness-versus-existence dispute and the nature-quiescence versus nature-awakening debate.
  intro: '西方学界的中观研究谱系（舍尔巴茨基→穆尔提→加菲尔德→韦斯特霍夫）、
    龙树「四句」与次协调逻辑的当代论战、日本「批判佛教」思潮及其中西回响、
    以及空有之争与性寂性觉之辨的当代延伸。'
  topics:
  - title: 西方学界的中观研究谱系
    title_en: "The Genealogy of Western Madhyamaka Studies"
    body: '据学者安德鲁·塔克（Andrew Tuck）分期，西方对中观的系统研究大致分三阶段：

      **奠基期**：舍尔巴茨基（Stcherbatsky）《佛教涅槃的概念》（1927）与 **T.R.V.穆尔提**（T.R.V. Murti）《佛教的中心哲学》（1955）——穆尔提经典类比「中观学派在印度哲学中的地位，类似于康德在近代欧洲哲学中的地位」长期主导西方理解框架。

      **现代期**：**贾伊·加菲尔德**（Jay Garfield）译注龙树《中论》（*The Fundamental Wisdom of the Middle Way*，1995，诠释路径明显借鉴格鲁派传统）并翻译宗喀巴《辨了不了义论》相关论著；**扬·韦斯特霍夫**（Jan Westerhoff）2010年出版《龙树的中观：一部哲学导论》——首部系统运用西方分析哲学工具处理龙树整体哲学的专著。

      **有趣的历史**：西方对藏传中观的系统关注可追溯到十七、十八世纪意大利耶稣会传教士德西德里（Ippolito Desideri）——以天主教立场撰文驳斥藏传教义，是已知最早的西方系统性文献之一（立场是护教性批判而非学术研究）。'
    en_body: |-
      Following the periodization of the scholar Andrew Tuck, Western systematic study of Madhyamaka falls into roughly three stages. The founding phase begins with Stcherbatsky's Buddhist Nirvāṇa (1927) and T.R.V. Murti's The Central Philosophy of Buddhism (1955), whose celebrated analogy—that the Madhyamaka school's place in Indian philosophy resembles that of Kant in modern European philosophy—dominated the Western understanding for a long time. The modernist phase features Jay Garfield's annotated translation of Nāgārjuna's Mūlamadhyamakakārikā (The Fundamental Wisdom of the Middle Way, 1995, drawing explicitly on the Gelug interpretive tradition) along with his translations of Tsongkhapa, and Jan Westerhoff's "Nāgārjuna's Madhyamaka: A Philosophical Introduction" (2010), the first monograph to systematically apply the tools of Western analytic philosophy to Nāgārjuna's thought as a whole. A curious historical note: Western systematic attention to Tibetan Madhyamaka traces to the seventeenth- and eighteenth-century Italian Jesuit Ippolito Desideri, who wrote polemics against Tibetan doctrine from a Catholic standpoint—among the earliest Western treatments, though apologist-critical rather than academic.
  - title: 龙树「四句」与次协调逻辑论战
    title_en: "Nāgārjuna's Four Propositions and the Paraconsistent-Logic Debate"
    body: '韦斯特霍夫在《龙树的中观》中重点辨析了龙树「四句」（catuṣkoṭi，四不可得）论式中两种不同性质的否定：蕴涵性否定（paryudāsa）与非蕴涵性否定（prasajya-pratiṣedha），由此引出一场持续至今的技术性论战：

      - **格雷厄姆·普里斯特**（Graham Priest）与出口康夫等主张龙树应被理解为某种「二谛论者」（dialetheist，承认存在真矛盾）；加菲尔德在部分论著持相近立场；

      - **蒂尔曼斯**（Tillemans）等学者提出更审慎的「弱二谛论」读法。

      这场论战将龙树哲学与当代分析哲学「次协调逻辑」（paraconsistent logic）直接勾连——是「中观学与现代逻辑学对话」最活跃的当代场域之一。另可参照马克·西德里茨（Mark Siderits）、大卫·卡鲁帕哈纳（David Kalupahana）等专著。'
    en_body: |-
      In his book, Westerhoff closely distinguishes two kinds of negation in Nāgārjuna's arrangement of the four propositions (catuṣkoṭi, the four ungraspables): the implicative negation (paryudāsa) and the non-implicative negation (prasajya-pratiṣedha), thereby opening a technical debate that continues to this day. Graham Priest and Yasuo Deguchi hold that Nāgārjuna should be read as a kind of dialetheist who affirms true contradictions; Garfield leans toward a similar position in parts of his work. Other scholars such as Tillemans propose a more cautious "weak dialetheist" reading. This debate directly connects Nāgārjuna's philosophy with contemporary analytic "paraconsistent logic"—one of the liveliest current sites of dialogue between Madhyamaka and modern logic. One may also consult the monographs of Mark Siderits and David Kalupahana.
  - title: 日本「批判佛教」思潮及其中西回响
    title_en: "The Japanese Critical Buddhism Movement and Its Echoes in China and the West"
    body: '八十年代中期，日本驹泽大学两位学者**松本史朗**与**袴谷宪昭**发起「**批判佛教**」（Critical Buddhism），是当代佛教研究最具冲击力也最具争议性的公案之一。

      **松本史朗**1985年发表《如来藏不是佛教》：佛教根本原理是「无我」与「缘起」，而如来藏、佛性思想预设恒常不变的「基体」（dhātu-vāda，基体说）根本背离此原理，批判矛头指向整个建立在如来藏思想基础上的东亚大乘佛教。

      **袴谷宪昭**从社会批判切入：考察曹洞宗内部对部落民歧视现象，将其思想根源追溯至日本天台「本觉思想」，1989年《本觉思想批判》、1990年《批判佛教》提出「佛教即批判」「只有批判的才是佛教」。「批判佛教」一词借自十七世纪意大利哲学家维柯对笛卡尔理性主义的称呼。

      **学术性反驳**（均为学界内部方法论质疑）：花野充道指出松本史朗先预设「何为正确佛教」的信念再剪裁历史，恰是旧式宗学方法；桂绍隆指出「批判佛教」内部自相矛盾——既然主张不存在「正确的佛教」，袴谷所谓可通过教理论争确认的「释迦正法」又从何谈起。高崎直道、平川彰乃至德国学者兰伯特·施密特豪森（Lambert Schmithausen）均撰文异议，1993年美国宗教学会年会更专门设组讨论。台湾学者林镇国提出：袴谷、松本表面清算佛教教理，实则是借此对日本现代保守主义思想文化釜底抽薪；恒清法师则依《胜鬘经》《大般涅槃经》《宝性论》等原典正面反驳对如来藏思想的定性。

      **中国平行**：周贵华等研究者明确指出，这场日本论争与中国近代支那内学院欧阳竟无、吕澂一系对《大乘起信论》真伪及禅宗、华严「真如缘起」说的尖锐质疑存在深刻历史平行——本质上正是以般若中观（或唯识古学）立场对中国化佛教「真常唯心」主流传统发起「回真向俗」式批判——这场中国「批判佛教」比日本同类思潮早了半个多世纪。'
    source: 松本史朗《缘起と空》(1989) · 袴谷宪昭《本觉思想批判》(1989)《批判仏教》(1990) · 恒清法师《「批判佛教」驳议》 · 孙晶、张文良《日本「批判佛教」的最新进展及其理论意义》
    en_body: |-
      In the mid-1980s two scholars of Japan's Komazawa University, Matsumoto Shirō and Hakamaya Noriaki, launched the "Critical Buddhism" movement—one of the most striking and controversial episodes in contemporary Buddhist studies. Matsumoto's 1985 essay "Tathāgatagarbha Is Not Buddhism" held that the fundamental principles of Buddhism are non-self and dependent origination, and that tathāgatagarbha and buddha-nature, presupposing an unchanging substrate (dhātu-vāda), fundamentally violate these—leveling critique at the entire East Asian Mahāyāna built on tathāgatagarbha thought. Hakamaya approached from social criticism, tracing discrimination against the burakumin within the Sōtō school to Japanese Tendai "original enlightenment" thought; his 1989 Critique of Original Enlightenment and 1990 Critical Buddhism advanced "Buddhism is criticism" and "only what is critical is Buddhist," the very term borrowed from Vico's critique of Cartesian rationalism. Scholarly rebuttals, chiefly methodological, came from within the field: Haneda Mitsuo saw Matsumoto's approach as preselecting a notion of "correct Buddhism"; Katsura Shōryū found the movement self-contradictory. Takasaki Jikidō, Hirakawa Akira, and the German scholar Lambert Schmithausen all objected, and the 1993 American Academy of Religion annual meeting devoted a panel to it. Scholars note a deep historical parallel with the critique of the Awakening of Faith advanced by Ouyang Jingwu and Lü Cheng of the Chinese inner college a half-century earlier—a "return-to-truth" criticism of the "true-constant-mind" mainstream from a prajñā-Madhyamaka (or ancient Yogācāra) standpoint.

- id: yk_synthesis
  title: 融合与张力
  title_en: "Synthesis and Tension"
  icon: ⚔
  intro_en: |-
    The doctrinal roots shared by the Three Treatise school and Tiantai and Chan, the contemporary echoes of the emptiness-versus-existence dispute between Madhyamaka and Yogācāra, and the "nature-quiescence versus nature-awakening" debate—an enduring tension spanning ages and borders.
  intro: '三论与天台、禅宗的思想渊源，中观与唯识的「空有之争」当代回响，
    以及「性寂与性觉」之辨——一场跨越时代、跨越国界的持久张力。'
  topics:
  - title: 三论与天台 — 共享同一份般若中观遗产
    title_en: "The Three Treatise School and Tiantai: Sharing the Same Prajñā-Madhyamaka Heritage"
    body: '天台宗实际创宗者智顗（538-597）与吉藏大致同时而略早，天台「一心三观」「三谛圆融」核心教义深受罗什所译《中论》「三是偈」直接启发——智顗将「空、假、中」三谛分别对应偈中「空」「假名」「中道」三词，构建起天台独有的圆融观法。

      **这意味着**：三论与天台虽在制度上各自立宗、甚至中晚唐一度构成竞争，但在思想源头二者共享同一份般若中观遗产——「性宗」内部「分」「合」辩证的又一例证。'
    en_body: |-
      Zhiyi (538–597), the actual founder of the Tiantai school, was roughly contemporary with Jizang and slightly earlier. Tiantai's core doctrines of "one mind, three contemplations" and "the perfect interpenetration of the three truths" were directly inspired by the "verse on the threefold predication" of the Mūlamadhyamakakārikā as translated by Kumārajīva: Zhiyi correlated the three truths of emptiness, conventional, and middle to the words emptiness, conventional designation, and middle way in the verse, constructing Tiantai's distinctive perfectly fused contemplation. This means that although the Three Treatise and Tiantai schools each established themselves institutionally and even competed in the mid-to-late Tang, at the level of their intellectual origins they share one and the same prajñā-Madhyamaka heritage—another instance of the dialectic of "division and union" within the "nature school."
  - title: 三论与禅宗 — 牛头一脉的地缘渊源
    title_en: "The Three Treatise School and Chan: The Geographical Bonds of the Niutou Line"
    body: '除《金刚经》与六祖惠能公案这一著名交集外，还存在一条较少被提及、史料线索相对具体的地缘性关联——**牛头宗**开创者**法融**（594-657）出身于兴皇法朗门下弟子茅山大明法师一系，后自立牛头一脉，传统上视为亲承禅宗四祖道信付法。

      学者考订：三论一系在金陵地区与《成实论》学派竞争获胜、经营百余年的佛学氛围，客观上塑造了当地独特氛围，牛头宗正是在此氛围中萌芽，修学风格明显不同于以《楞伽经》为宗的「东山法门」主流禅系；法朗另一门人智锴兼习天台、隐居庐山大林寺二十年，而禅宗四祖道信恰也曾在同一座大林寺居留十年——道信此后改以般若经教（而非达摩以来的《楞伽经》）为印心依据，学者认为「不能说没有受到三论宗的影响」。

      此线索史料不算确凿只能谨慎推断，但足以说明「性宗」内部三论与禅宗的关联远比制度性宗派边界更纠缠。'
    en_body: |-
      Beyond the celebrated meeting of the Diamond Sūtra and Huineng's awakening, there is a less-often-mentioned but relatively concrete geographical link: Farong (594–657), founder of the Niutou (Oxhead) school, came from the line of Daming of Maoshan, a disciple of Xinghuang Falang, and later established the Niutou lineage, traditionally regarded as receiving transmission from the fourth Chan patriarch Daoxin. Scholars hold that the century of fruitful rivalry between the Three Treatise school and the Satyasiddhi school in the Jinling region shaped a distinctive local Buddhist atmosphere in which the Niutou school germinated, its style clearly differing from the mainstream "East Mountain Dharma Gate" Chan grounded in the Laṅkāvatāra Sūtra. Another of Falang's students, Zhi Kai, studied both Tiantai and Chan, living in seclusion for twenty years at Dalin Hermitage on Mount Lu—where the fourth patriarch Daoxin himself had also resided for a decade, after which Daoxin shifted his seal-of-mind basis to the prajñā scriptures rather than the Laṅkāvatāra inherited from Bodhidharma. The evidence is suggestive rather than certain, but it shows the ties between the Three Treatises and Chan within the "nature school" to be far more entangled than institutional sectarian boundaries would suggest.
  - title: 中观与唯识 — 空有之争的当代回响
    title_en: "Madhyamaka and Yogācāra: The Contemporary Echo of the Emptiness-versus-Existence Dispute"
    body: '本系列前一份报告已详述「空有之争」近现代演进——从杨仁山、太虚、周叔迦主张空有「语诤意同」，到法尊、印顺一系主张二者确有「实有诤论」，论争后更延伸至藏传中观学参与。

      本页第十章所述法尊系统翻译格鲁派应成中观典籍，客观上为「空有之争」提供了远比中土旧译更细致的印度晚期论辩资源，使这场发源于南北朝「三论、唯识孰为了义」的古老争论，在二十世纪获得了全新的、藏传参照系下的当代表述。'
    en_body: |-
      The earlier report in this series recounted the modern evolution of the "emptiness-versus-existence dispute"—from Yang Renshan, Taixu, and Zhou Shujia holding that the two schools merely "dispute in words yet agree in meaning," to the school of Fazun and Yinshun insisting they genuinely "dispute over ultimate reality," with the conflict later extending to Tibetan Madhyamaka. Fazun's systematic translation of Gelug Prāsaṅgika texts, described in this page's earlier chapter, objectively supplied the dispute with far more detailed material from late Indian debate than the older Chinese translations had offered, so that this ancient controversy, originating in the Northern and Southern Dynasties over which school was definitive—the Three Treatises or Yogācāra—received in the twentieth century a wholly new formulation within a Tibetan frame of reference.
  - title: 性寂与性觉 — 吕澂与熊十力之辨
    title_en: "Nature-Quiescence and Nature-Awakening: The Dispute Between Lü Cheng and Xiong Shili"
    body: '支那内学院一系对「真常唯心」传统的批判，方法论资源相当程度上正来自般若中观「性空」立场——吕澂晚年提出的「**性寂**」与熊十力所代表的「**性觉**」之辨，是这场批判最凝练的理论表述。1943年二人往复书信十余通（不同整理稿分别记为十六或十七通），后以《辩佛学根本问题》发表于1984年《中国哲学》第十一辑。

      **吕澂核心论点**：印度佛学「心性本净」应依「**性寂**」（自性涅槃）解——「净」梵文本意是「光明不著」而非「清除污垢」意义上的「清净」，「心性本净」只说明众生「有解脱的可能性」而非当下已然清净，故修行重心在「所缘境界依」，须经「闻熏」渐次转依，精神是「**革新**」；中土佛学误读为「**性觉**」（自性菩提），以为心性当下圆满具足，修行只需「返本」，此误读源头可追溯至《大乘起信论》混淆合并《楞伽经》「藏识」与「如来藏」，并开出「中土伪书」谱系：「由《起信》而《占察》，而《金刚三昧》，而《圆觉》，而《楞严》，一脉相承。」

      **正面回应**（内部辩护立场）：1930年代太虚所领导武昌佛学院一系已「针锋相对，坚决捍卫如来藏本觉思想合法性」，太虚「大乘佛教三宗」说重要动机之一正是为如来藏思想找稳固依据。新儒家牟宗三从义理内部给出更具论证性的辩护：若阿赖耶识纯属虚妄杂染，则无漏清净种子只能「寄附在有漏中」、有待后天「正闻熏习」方生，闻熏又靠外在善知识因缘际会，「一切众生皆能成佛」的必然性便无从保证——因此「就佛教内部教义的发展，顺着问题之逼迫，必须往前推进，肯定有一超越的真常心，作为众生成佛的超越根据」——这正是牟宗三不遗余力捍卫《起信论》合法性的义理动因。

      **元层面的解构观察**：2017年学者王川提出，吕、熊对「性寂」「性觉」的理解未必真正契合原始意涵——吕澂「性寂」与朱熹「性即理」、熊十力「性觉」与陆九渊「心即理」高度神似，二人「革新」与「返本」的工夫论分歧与朱陆「格物」「明心」之争如出一辙——这场披着佛学外衣的论战，实质更接近宋明理学朱陆之争在二十世纪的续演。读者宜将「性寂/性觉」之辩理解为二十世纪教界内部众多严肃立场中的一组、而非整个汉传佛教的定论。'
    source: 吕澂·熊十力《辩佛学根本问题》(1984《中国哲学》第11辑) · 王川《佛教经学视域中的「性寂」与「性觉」之争》(《江汉论坛》2017年第10期) · 李四龙《现代中国佛教的批判与反批判》
    en_body: |-
      The critique of the "true-constant-mind" tradition mounted by the Chinese inner-college school drew methodologically on the emptiness standpoint of prajñā-Madhyamaka. Lü Cheng's late doctrine of "nature-quiescence" (xing ji) and Xiong Shili's "nature-awakening" (xing jue) are its most condensed theoretical expression: in 1943 the two exchanged over ten letters, later published in 1984 as "Disputing the Fundamental Questions of Buddhism." Lü held that the Indian Buddhist "originally pure mind-nature" should be read as "quiescence" (intrinsic nirvāṇa)—pure in the sense of "undefiled by light" rather than "freed from defilement," signifying only the possibility of liberation, so that practice centers on transformation through hearing; while Chinese Buddhism misread it as "awakening," as if the mind were already perfect, requiring only "returning to the source"—a misreading traced to the Awakening of Faith's conflation of ālayavijñāna and tathāgatagarbha. Taixu's circle firmly defended the legitimacy of tathāgatagarbha original-awakening thought, and the new Confucian Mou Zongsan argued internally that without a transcendent true-constant mind the certainty of universal buddhahood could not be secured. On the meta-level, the 2017 scholar Wang Chuan suggested the pair's readings do not fully match the original meanings, their "reform" versus "return" mirroring the Zhu Xi–Lu Jiuyuan controversy—renewing the Song-Ming Neo-Confucian debate in the twentieth century.
  - title: 法相·般若·如来藏 — 大乘思想的三角结构
    title_en: "Dharma-Characteristics, Prajñā, and Tathāgatagarbha: The Triangular Structure of Mahāyāna Thought"
    body: '「性寂/性觉」之辨与日本「批判佛教」思潮遥相呼应，共同构成「般若中观的性空立场」与「如来藏系的性觉立场」之间跨越时代、跨越国界的持久张力。

      **法相唯识、般若中观、如来藏真常**，三者共同构成大乘佛教思想史上彼此定义、彼此制约的一组「三角结构」——这也是理解本页与「法相玄机」tab之间深层义理关联的一把钥匙：济群法师「三者各有安立、应机而用」的并存态度，或许是当代教学一线对这组三角结构最平衡的处理方式。'
    en_body: |-
      The nature-quiescence/nature-awakening dispute echoes the Japanese Critical Buddhism movement, together constituting an enduring tension across ages and borders between the emptiness standpoint of prajñā-Madhyamaka and the awakening standpoint of the tathāgatagarbha school. Dharma-characteristics Yogācāra, prajñā-Madhyamaka, and tathāgatagarbha truth-constancy together form a "triangular structure" of mutually defining and mutually constraining positions in the history of Mahāyāna thought—the key to understanding the deep doctrinal connection between this page and the "Faxiang Xuanji" tab; Master Jiqun's equalizing stance that "each has its own place and is applied according to capacity" may be the most balanced contemporary handling of this triangle.

- id: yk_haiyun
  title: 海云法师 · 空性诠释
  title_en: "Master Haiyun: Interpreting Emptiness"
  icon: 🌊
  intro_en: |-
    Haiyun Jimeng, grounded in the Huayan nature-school tradition, offers a distinctive assessment and interpretation of prajñā emptiness and the Madhyamaka schools. Every entry below cites a verifiable original source (fjdh.cn Buddhist Navigation transcripts, Heshanlan Huayan Culture publications); quotations are marked with quotation marks and paraphrases clearly identified for readers to check against the originals.
  intro: '海云继梦法师以华严性宗立基，对般若空性与中观论派有独特的判摄与诠释——
    以下各条均注明可查核的原文出处（fjdh.cn 佛教导航逐字稿、鹤山嵐華嚴文化出版资料等），
    引文一律加引号、转述一律标明，供读者据原文复核。'
  topics:
  - title: 中观论派 — 四大教派的判摄
    title_en: "The Madhyamaka Schools: A Classification of the Four Great Schools"
    body: '海云继梦法师在《密法·显密两教定义之刍议》中，将大乘佛教判为两大系统：

      **中观论派（显教）**——原文：「于中观论派系统，总有法相、三论、天台、华严『四大教派』，专显佛陀真理之修学」；「中观论派以其『显言』，故能驯服大脑之理性思维，通称为『显』」。

      **瑜伽行派（密教）**——原文：「大乘瑜伽行法，可展开于禅、净、律、密（真言）『四大宗派』之行法领域」；「瑜伽行派以『唯行』故，遂有驯服生命中杂染、杂质与噪声之功能……统称为『密』」。

      法师总括：「中观论派（显）与瑜伽行派（密），实为大乘佛教之一体两面，自不可分也！」又以今日大脑科学作比：「中观论派倾向左脑思维，而瑜伽行派倾向右脑功能的训练。」

      **中观论派三次第**（法师原文）：

      ① **唯识**——「详明转凡成圣之契理及众生之由致也」；

      ② **唯智**——「详明转凡成圣过程中最重要之契机，即三昧境中的『空相』状态，此空相状态唯存法性，不由法相也」；

      ③ **唯性**——「宏观即明法界之体、用；微观详明入法界之次第道，以及圆融道之理事互融也」。

      （本页其余章节所用「空宗/有宗」之分，属学界通行框架，非海云法师原文用语；「三论宗最早最纯粹代表」等表述亦非法师原文，仅为本页转述，读者注意区分。）'
    source: 海云继梦《密法·显密两教定义之刍议》(fjdh.cn, 2013-09-01)
    links:
      原文全文: https://www.fjdh.cn/wumin/2013/09/070905286372.html
    en_body: |-
      In his "Dharma and Tantra: A Working Definition of the Two Vehicles," Master Haiyun Jimeng divides the Mahāyāna into two great systems. The Madhyamaka schools (the exoteric), in his words, "always comprise the four great schools of Dharma-characteristics, the Three Treatises, Tiantai, and Huayan, devoted to manifesting the Buddha's truth for cultivation," and because they "use plain speech" they can tame the rational mind and are called "exoteric." The Yogācāra schools (the esoteric), which can unfold as the four great practice traditions of Chan, Pure Land, Vinaya, and Mantra, "tame the defilements, impurities, and noise of life through mere practice" and are termed "esoteric." He concludes the two are "two aspects of one Mahāyāna, inseparable," comparing them to brain science: the Madhyamaka leaning toward left-brain thought and the Yogācāra toward right-brain training. He further sets out the three stages of the Madhyamaka: consciousness-only, wisdom-only, and nature-only, each clarifying the transition from ordinary being to sage. The note clarifies that the "emptiness/existence school" distinction used elsewhere on this page is the scholarly convention, not the master's own wording.
  - title: 一法印取代三法印 — 中观论派的核心主张
    title_en: "Replacing the Three Seals with the Single Seal: The Central Thesis of the Madhyamaka School"
    body: '海云法师论中观论派的历史性定义，原文：

      「中观论派之历史性定义，即在大小乘的交替过程中，提出以般若空性的『一法印』，取代了原始佛教中的『三法印』；以空性的妙用广大，而令佛教的视野与境界得以无限量的扩大。是故，举凡般若经典的产生、翻译、阐释，乃至释论等，皆归中观论派之范畴。」

      **对等人物评价**（法师原文）：

      「以此定义故，玄奘与吉藏则具同等之地位，一经一论故。又，罗什与慧远于中观论派中亦具同等之地位，一南一北故。此外，觉贤、实叉难陀、义净等译经大德，于中观论派之推广上，占有极重大的份量，以经为本故。而道安则是将中观论派从中国文化的格义桎梏中解放出来的伟大法匠。」

      （引文均出《密法·显密两教定义之刍议》。「义学双峰」「互补而共成一代佛教」等措辞并非法师原文，本页不采用。）'
    source: 海云继梦《密法·显密两教定义之刍议》(fjdh.cn, 2013-09-01)
    links:
      原文全文: https://www.fjdh.cn/wumin/2013/09/070905286372.html
    en_body: |-
      On the historical definition of the Madhyamaka school, Master Haiyun states in his own words: its historical definition lies in proposing, amid the transition between the greater and lesser vehicles, to replace the "three seals" of early Buddhism with the "single seal" of prajñā emptiness; relying on the vast wonder-working of emptiness, Buddhism's vision and horizon were expanded without limit; hence the production, translation, and explanation of prajñā scriptures, and their commentaries, all fall under the Madhyamaka rubric. He also gauges the school's key figures: on this definition Xuanzang and Jizang stand on equal footing, one for the sūtra and one for the treatise; Kumārajīva and Huiyuan likewise, one from the south and one from the north; the great translators Buddhayaśas, Śikṣānanda, and Yijing weigh heavily in its propagation, being scripture-based; and Dao'an is lauded as the great craftsman who freed the school from the shackles of Chinese geyi. The closing note observes that phrases such as "twin peaks of exegetical learning" are not the master's own words and are avoided on this page.
  - title: 解空丛书 — 《非常坛经》《非常金刚经》《非常心经》
    title_en: "The Series on Understanding Emptiness: The Unusual Platform Sūtra, Unusual Diamond Sūtra, and Unusual Heart Sūtra"
    body: '海云法师的「解空」系列共十二册，每经四册（空庭书苑出版）：

      **《非常坛经》**（一~四册）· **《非常金刚经》**（一~四册）· **《非常心经》**（一~四册）。

      丛书关系（原书内容提要原文）：「《心经》其实只是一条运用的公式而已。为解释及实践这条空性之路，必须依《金刚经》为指导，而欲明其要旨，《六祖坛经》洵为最佳途径。」

      **《非常心经》关键章目（据原书目次及提要）：**

      - **第七章「解空第一的特色在『无诤』上」**——原文：「真正的无诤是不与人辩，别人讲的时候，他都对！对！对！等到适当时机他才：『不过……』像打高尔夫球一样，把球引到洞口，轻轻一拨，丢！让你掉进空性去……」

      - **第九章「草绳与蛇」**——原文：「诸法空相？一切法都是三有性，将其转成三无性，即是转成空相。走路忽然看见一条蛇，吓一大跳！那条蛇是『情有』，这个情有的当下，在理上是无的（理无）。等定睛一看，原来是草绳！草绳是『假有』，是因缘和合所生……」——注意：法师原文只以此蛇喻说明「情有→理无」「假有」二义，「草绳亦空」为编者续句，非原文，请读者注意。

      - **第十章「智慧从这里发生……」**——原文：「生命有四个层次：第一是十二有支缘起，通常指声闻；第二是业感缘起，指缘觉；第三，真如缘起，是菩萨生命；第四，无碍法界无尽缘起，即华严所谓法身大士。整个般若系统谈的智慧，主要都依此四者，若从修行立场言，还得加入苦集灭道。」

      丛书总旨（原书提要原文）：「这十二册『解空』，虽是在解『空性』，却有着深刻的华严底蕴。海云继梦法师说，生命的真象就在这里！」'
    source: 海云继梦《非常心经（一）》目次与内容提要（鹤山嵐·華嚴文化，ISBN 9789572941676）
    links:
      原书资料页: https://huayenculture.com/product/9789572941676/
    en_body: |-
      Master Haiyun's "understanding emptiness" series comprises twelve volumes, four for each scripture, published by Kongting Shuyuan: the Unusual Platform Sūtra, the Unusual Diamond Sūtra, and the Unusual Heart Sūtra. According to the publisher's own abstract, the Heart Sūtra "is but a formula for practice"; to explain and realize this path of emptiness one must rely on the Diamond Sūtra as guide, and the Platform Sūtra is the best route to its essentials. Key chapters of the Unusual Heart Sūtra are drawn: a chapter on the distinctive no-contention of one who is first at understanding emptiness, where true no-contention is not arguing, agreeing all the while until the opportune moment one raises a "however," guiding one into emptiness like guiding a golf ball to the hole; the chapter "Straw Rope and Snake," where a rope seen as a snake is "existence through affection" while empty in principle, and the rope itself is a conventionally existent, dependently arisen thing (noting the master's text itself only conveys the two meanings "affectional existence→principial non-existence" and "conventional existence," the added "the straw rope too is empty" being the editor's continuation); and a chapter on wisdom arising, distinguishing the four levels of life from twelve-limb dependent origination to the unimpeded dharmadhātu of inconceivable dependent origination of Huayan's dharmakāya mahāsattvas. The series, though explaining "emptiness," bears a profound Huayan undercurrent.
  - title: 探空方程式 — 证空性的教学系统
    title_en: "The Probe-into-Emptiness Equation: A Teaching System for Realizing Emptiness"
    body: '海云法师界定「探空」教学体系，原文：

      「瑜伽行法既然是实践学，则应当是在瑜伽行法中，有完整的教学体系与整套的行法系统，而此瑜伽行法的进程，我们称之为『探空』的教学体系，或探空方程式。此即华严三段教学法中的第二段：正行，证空性的教学系统。」

      （注意：法师此处以「三段教学法」指华严教学体系中的前行/正行等段位，并未使用「信解行证」字样。）

      核心开示（原文）：

      - 「空性非是大脑思惟之所能及，是则探空之行则非大脑逻辑之所能为，因此探空的教学方式亦有异于大脑之思辨方式；是故《大经》之必依善知识教，善知识是集一切智的最初因缘」——「此是之谓破大脑的经验主义，而依善知识的空性如实经验，方能启动迈向空性的菩提大道。」

      - 「先立果而行因，即先破无明，破根本无明而后，方能明确（如实了知）能所的存在……今破根本无明（即擒贼先擒王），则能所分离；能所既分，能则为真心（即能观心），此能观心必须训练（此即因行之始）成静态的能观，不可主动的起用。」

      - **五阶段进程**（原文）：能所分离→所观之身尽情奔放（触功德）→能观心随所而行（「正行」行法的重头戏）→能所相符（舍识用根，照见即是智慧）→能所双泯（无功用行）——「当『能所双泯』便进入第五阶段，即是父母未生之前的本来面目现前。上合十方诸佛本妙觉心，明心也！下合六道众生诸法本性，见性也！既能所双泯，则畅行法界而无所碍矣！」

      - 此时「所的根性是以觉性为引导」，故《净行品》称「**以智为先导**」——「超越能所、净秽等对立之境界，而成一大圆融的『一真法界』欤！故此智为先导非是大脑逻辑的论辩，而是生命中的如实境界。」'
    source: 海云继梦《瑜伽行的教法：约理》(fjdh.cn, 2013-09-01)
    links:
      原文全文: https://www.fjdh.cn/wumin/2013/09/081851285942.html
    en_body: |-
      Master Haiyun defines the "probe-into-emptiness" (tankong) teaching system: since Yogācāra practice is a practical discipline, it must have a complete teaching curriculum and a full set of practices within it, and this course of Yogācāra practice he calls the "probe-into-emptiness" system or equation—the second stage of the Huayan three-stage pedagogy, the "main practice," the system for realizing emptiness (the note clarifies that his "three-stage pedagogy" refers to the preparatory/main stages of the Huayan teaching framework, not the phrase "faith, understanding, practice, realization"). Core teachings: because emptiness is beyond what the brain's thinking can reach, the practice of probing into emptiness cannot be done by cerebral logic, and its teaching differs from cerebral speculation; hence the Great Sūtra's insistence on following an excellent teacher, who is the first cause gathering all-knowledge—a breaking of cerebral empiricism, relying on the teacher's veridical experience of emptiness to set out on the bodhi path of emptiness. The progression unfolds in five stages, from the separation of subject and object, through the body of the observed freely unfolding and the observing mind following what it observes, to the correspondence of subject and object and their mutual extinction (effortless practice), where "the original face before one's parents were born appears," uniting with the buddhas' pure enlightened mind and the nature of beings, roaming the dharmadhātu without obstruction. At this point the root nature of the object is led by awakening, so the Purifying Practice chapter speaks of "wisdom as forerunner"—not cerebral logical debate but an actual state of life.
  - title: 华严经的空性观 — 时空亦是缘起性空
    title_en: "The Avataṃsaka's View of Emptiness: Space and Time Themselves Are Dependent Origination and Empty of Nature"
    body: '海云法师在《高阶心行》中论《华严经》的空性观，原文：

      - 「『蕴、处、界、缘起』四者，是佛法中修学的四项根本要素……此中，处约『能』言，界约『所』言，蕴则约『功能』言——此曰三轮是也。此之三轮若能依缘起之架构实观之，则知三轮所显一切万法，皆是缘起性空。」

      - 「《净行品》中智首菩萨于其成佛之道中的第四阶提到『修行的充分条件』时，有时间善巧及空间善巧；融此『时、空』两要素，并沤和三轮万法的善巧，皆缘起生灭的法空观，此不正是大乘行法之心髓吗？是则时间、空间以及一切万法皆三轮体空，那么，缘七菩提分而入三三昧，不就是极自然的结果吗？」

      - 「何以《大经》独具慧眼，了知时空亦是缘起性空！？……在《净行品》中，不但一切万法皆三轮缘起性空，且更加入时空的因素考量；此中是华严性宗的思想超越大乘之处……关键不在时空的两因素的增入，而是思想的穷尽与圆满！」

      （上述引文经与 fjdh.cn 逐字稿逐字核对。法师原文对「此是华严性宗超越大乘之处」的判断，本身附有保留：「亦或大乘思想中的记载有所疏漏？目前尚无法求证。」）'
    source: 海云继梦《高阶心行》(fjdh.cn, 2013-09-01)
    links:
      原文全文: https://www.fjdh.cn/wumin/2013/09/091334285959.html
    en_body: |-
      In "Higher Mind Practice," Master Haiyun expounds the Avataṃsaka Sūtra's view of emptiness in his own words. The four essentials of Buddhist practice are the aggregates, sense bases, elements, and dependent origination: sense bases relate to the subjective, elements to the objective, and aggregates to function—these are the "three wheels," and seen in the framework of dependent origination all dharmas they manifest are dependently arisen and empty of nature. In the Purifying Practice chapter, Bodhisattva Wisdom-First, at the fourth stage of his path to buddhahood, mentions among the sufficient conditions for practice both skill in time and skill in space; fusing these two elements of time and space with the upāya of the three wheels of all dharmas yields the dharma-emptiness contemplation of dependently arisen arising and ceasing—is this not the very marrow of Mahāyāna practice? If time, space, and all dharmas are thus threefold-empty, then entering the three samādhis through the seven limbs of enlightenment is the most natural result. Why does the Great Sūtra alone see that even space and time are dependently arisen and empty? In the Purifying Practice chapter not only are all dharmas dependently arisen and empty through the three wheels, but the factors of time and space are added as well—this is where the Huayan nature school's thought surpasses the Mahāyāna; the point lies not in the addition of two factors but in the exhaustion and perfection of thought. A note records that these quotations were checked verbatim against the fjdh.cn transcript, and that the master's own judgment itself carries a hedge: "Or perhaps the Mahāyāna records contain omissions? This cannot presently be verified."
  - title: 空性正见 — 空不是不存在
    title_en: "The Correct View of Emptiness: Emptiness Is Not Non-Existence"
    body: '海云法师在《心法·再窥心性》中的原文：

      「心的存在不能讲空，存在就是存在，存在就是空性，空不是不存在。若把空性认作不存在，即是断见，非佛正知见。然而在大乘佛教的领域里，充斥着这种空等于不存在的唯心论断见！」

      **语境提示**：此语就「心（法界本体）的存在」而言——心之存在不可讲空，空即该存在之空性。海云法师另在《十二因缘讲记》中以「绳蛇」类比呼应：空性是本体，色、受、想、行、识是「相」与「用」，「本体的存在，必须要有色相显现才能知道有本体……所以说『色不异空，空不异色；色即是空，空即是色』」。

      《解心——心要法门讲记》亦明示：「执着于『空』、『有』都不对，两边都要不执着……佛法才叫无边」。

      （本页综合上述三篇原文转述「空不是不存在」之正见；「声是实有，法性空寂」「真空即是妙有之体」等表述未见于所核原文，故不采用。）'
    source: 海云继梦《心法·再窥心性》(学佛网/佛教导航, 2013) · 《十二因缘讲记》第四集 · 《解心——心要法门讲记》(空庭书苑)
    links:
      再窥心性全文: http://www.wmxf.net/nr/6/59615.html
    en_body: |-
      In "Reexamining the Mind-Nature," Master Haiyun writes: "The existence of the mind cannot be called empty; existence is existence, existence is emptiness of nature, emptiness is not non-existence. To take emptiness of nature as non-existence is annihilationism, not the Buddha's true correct view. Yet the field of the Mahāyāna is filled with this idealist annihilationist view equating emptiness with non-existence." The context note explains this concerns the existence of the mind (the substance of the dharmadhātu)—its existence cannot be spoken of as empty, emptiness being precisely the emptiness of that existence. In his lectures on the twelvefold chain, Haiyun uses the rope-and-snake analogy in response: emptiness of nature is the substance, while form, feeling, conception, volition, and consciousness are marks and functions, adding that "the existence of the substance must be known through the manifestation of form," hence "form is not other than emptiness, emptiness not other than form." The "Explaining the Mind: Essential Dharma Practices" lectures likewise state that attaching to either "emptiness" or "existence" is wrong. The page synthesizes these three verified texts; expressions not found in the checked originals are not adopted.
- id: yk_chengguan
  title: 成观法师 · 空性与禅密诠释
  title_en: "Master Chengguan: Interpreting Emptiness and the Chan-Mantra Dimensions"
  icon: ☸
  intro_en: |-
    Master Chengguan (42nd-generation holder of both the Huayan and Cien schools) takes the prajñā Heart Sūtra as pivotal, interpreting emptiness through the two layers of "explicit exposition" and "the Tathāgata's hidden meaning," and bridging the Chan and mantra paths. Every entry below cites a verifiable original source (Buddhist Navigation transcript); quotations are marked and paraphrases clearly identified.
  intro: '成观法师（贤首宗兼慈恩宗第42世）以般若《心经》为枢要，
    以「显说」与「如来密义」两层诠释空性，并贯通禅、密二门——
    以下各条均注明可查核的原文出处（学佛网/佛教导航逐字稿），
    引文一律加引号、转述一律标明。'
  topics:
  - title: 《心经》的显说与奥义 — 两层诠释框架
    title_en: "The Heart Sūtra's Explicit Exposition and Hidden Meaning: A Two-Layer Hermeneutic"
    body: '成观法师在《心经系列》自序中说明四文结构与诠释方法：

      「鄙人今将历年来在美国各地所开示之《般若心经》之阐释文字，汇集成册……本集中包括《心经显说》、《心经奥义》、《心经奥义析微》、《心经与禅密修行》四文。」

      其「显说」大抵依一般传统解释文字义理；「奥义」则依禅门无上法开阐如来密义（原文：「以如来密义甚深秘奥，凡俗不能得窥，故名之为『奥义』」）。

      法师强调完整讲解须两法并立（原文）：「完整的《心经》讲解应包括两部份：一、是显说、二、是密说，所谓密说，亦即所谓『如来密义』——诸位不要以为显宗就没有『密』法，其实让你看不出来的『密』才真是密。」

      并以《心经》与唯识对比（原文）：「像『相宗』——玄奘法师他最擅长的就是『法相宗』、又称『唯识宗』——看起来令人觉得很深，事实上不见得，只不过名相很多、很繁复，一时间不容易掌握要领，然而一旦把握住了原理之后，就不难精通。而《心经》看来简单，其实深邃无比，与唯识学比起来，《心经》中的名相少得很，可是义理却十分深奥，故称为『如来密义』。总而言之，《心经》所阐示的东西，主要是要靠『悟』的，故其层次相当高，而受持《心经》的难处也就在此。」'
    source: 成观法师《心经系列》（一）·自序（学佛网）
    links:
      原文全文: http://www.wmxf.net/nr/6/61361.html
      佛教导航版: https://www.fjdh.cn/wumin/2013/09/090239288741.html
    en_body: |-
      In the preface to his Heart Sūtra Series, Master Chengguan explains the structure and hermeneutic method of the collection, gathered from his talks on the Prajñā Heart Sūtra given across the United States, comprising four texts: the Heart Sūtra's Explicit Exposition, its Hidden Meaning, the Analysis of the Hidden Meaning, and the Heart Sūtra and Chan-Mantra Practice. The "explicit exposition" generally follows the traditional literal interpretation, while the "hidden meaning" opens up the Tathāgata's hidden import in accordance with the unsurpassed teaching of the Chan school; because that hidden meaning is profoundly secret, it is called the "Hidden Meaning." Chengguan stresses that a complete exposition requires both: first the explicit, then the esoteric, and "what I call the esoteric, namely the Tathāgata's hidden meaning—do not think the exoteric school has no 'secret' teaching; the truly secret is what you cannot see." He compares the Heart Sūtra with Yogācāra: Dharma-characteristics (Xuanzang's specialty) looks deep but is not really, having many technical terms yet being graspable once the principle is held; the Heart Sūtra looks simple yet is unfathomably profound—fewer terms but deeper doctrine, hence "the Tathāgata's hidden meaning." What it reveals is grasped chiefly by awakening, so its level is very high, and therein lies the difficulty of upholding it.
  - title: 整篇《心经》就是一整套的禅观法门
    title_en: "The Whole Heart Sūtra Is a Complete Set of Chan Contemplative Practices"
    body: '法师在《心经与禅密修行》中，将《心经》定位为禅观法门（原文）：

      「如法研习《心经》就是一系列的『思惟修』，而『思惟修』就是『禅』，故研习《心经》亦即是在修习一系列的『禅观』。所以整篇《心经》就是一整套的禅观法门，学者须常依经作如是观、如是思惟、如是熏修、如是自省、以期如是自觉。」

      又依密教「字轮观」指出「不可得」为《心经》神髓（原文）：「……所以都要观这些悉檀字母所代表之法『不可得』，而这『不可得』即是《般若心经》的神髓。」

      关于「无所得」（原文）：「『以无所得故，菩提萨埵，依般若波罗蜜多故，心无罣碍；无罣碍故，无有恐怖；远离颠倒梦想，究竟涅槃。』到此为止，是这部经的高潮。」'
    source: 成观法师《心经系列》（五）·《心经与禅密修行》（学佛网）
    links:
      原文全文: http://www.xuefo.com/nr/article62/619258.html
    en_body: |-
      In "The Heart Sūtra and Chan-Mantra Practice," Master Chengguan positions the Heart Sūtra as a chan contemplative system, in his own words: studying the Heart Sūtra properly is a series of "reflective cultivation" (cintā-bhāvanā), and reflective cultivation is chan; hence studying the Heart Sūtra is cultivating a series of chan contemplations, so the whole Heart Sūtra is a complete set of chan contemplative practices, and students should constantly make such observation, reflection, cultivation, and self-examination according to the sūtra. Following the mantra practice of "letter-wheel contemplation," he points to "non-attainment" as the very marrow of the Prajñā Heart Sūtra: one contemplates that all dharmas signified by the siddhaṃ letters are "non-attainable," and this non-attainment is its essence. On non-attainment he cites the passage—"Because of non-attainment, the bodhisattva, relying on prajñāpāramitā, has no hindrances in mind; free from hindrance, no fear; far from inverted dreams, ultimately nirvāṇa"—declaring this to be the climax of the sūtra.
  - title: 空如来藏 — 凡夫与三乘境界皆其变现
    title_en: "The Empty Tathāgatagarbha: The Realms of Ordinary Beings and the Three Vehicles Are Its Manifestations"
    body: '法师以如来藏融摄般若空性（原文）：

      「凡夫境界皆是如来藏之所幻化。连声闻、缘觉、权教菩萨的境界也是空如来藏之所变现。」

      （此语将「空」安立于如来藏体系：凡夫乃至三乘所证，皆是「空如来藏」之变现——与海云法师「存在就是空性，空不是不存在」的取向可互参，但二者思想底座不同：海云立足华严性宗，成观则归摄于如来藏·真常一系，读者注意区分。）'
    source: 成观法师《心经系列》（五）·《心经与禅密修行》（学佛网）
    links:
      原文全文: http://www.xuefo.com/nr/article62/619258.html
    en_body: |-
      In "The Heart Sūtra and Chan-Mantra Practice," Master Chengguan fuses emptiness with the tathāgatagarbha: "The realm of ordinary beings is entirely a transformation of the tathāgatagarbha. Even the realms of the voice-hearers, pratyekabuddhas, and provisional Mahāyāna bodhisattvas are manifestations of the empty tathāgatagarbha," grounding "emptiness" within the tathāgatagarbha system. The note sets this alongside Master Haiyun's orientation, where "existence is emptiness of nature; emptiness is not non-existence," yet observes that the two rest on different foundations: Haiyun stands on the Huayan nature school, while Chengguan gathers everything into the tathāgatagarbha/true-constancy tradition—the reader should distinguish them.
  - title: 禅门与空 — 舍有入空、入于不思议
    title_en: "The Chan School and Emptiness: Abandoning Existence and Entering Emptiness, Entering the Inconceivable"
    body: '在《大日经疏讲解》第21集中，法师归纳禅宗空观的修证次第（原文）：
      ①「以思议破执」→ ②「离妄、离执；离妄离执就是离染」→ ③「入清净地」→ ④「无所住著入无所得」→ ⑤「澈本心源，本自清净」→ ⑥「离一切言说思议就入不思议。入不思议那就是一切显教乃至于禅宗的最高、顶点」。

      第22集更明确界定（原文）：「禅是什么？简单讲就是舍有入空，这个有是什么？有就是三有，三界称为有。舍有入空、舍染入净。」

      并警惕断灭空（原文）：「不是不得佛法，所以一般人就入了断灭空、恶取空。」——「不求是不求世法不是不求佛法；不得是不得世法，而不是不得佛法，这佛法的一切智、种种智慧福德都要得的，得但是心里面不贪着。」'
    source: 成观法师《大日经疏讲解》第21·22集（佛教导航）
    links:
      第21集: https://www.fjdh.cn/wumin/2013/11/130349305066.html
      第22集: https://www.fjdh.cn/wumin/2013/11/130439305067.html
    en_body: |-
      In the 21st lecture of his Commentary on the Mahāvairocanābhisaṃbodhi Sūtra, Master Chengguan condenses the Chan school's contemplative order of realization, in his own words: (1) breaking attachment by thought; (2) separating from delusion and clinging—separating from delusion and clinging is separating from defilement; (3) entering the pure ground; (4) abiding nowhere and entering non-attainment; (5) penetrating the mind's original source, originally pure; (6) still leaving all speech and thought, entering the inconceivable—"entering the inconceivable is precisely the highest and apex of all exoteric teaching and even of Chan." The 22nd lecture defines it more simply: "What is chan? In short, abandoning existence to enter emptiness. What is existence? Existence is the three existences; the three realms are called existence. Abandon existence and enter emptiness, abandon defilement and enter purity." He also warns against annihilatory emptiness: "not attaining the Dharma is why ordinary folk fall into annihilatory emptiness and evil grasping of emptiness"—"not seeking means not seeking worldly dharmas, not that one does not seek the Dharma; not attaining means not attaining worldly dharmas, not that one does not attain the Dharma—the all-wisdom and manifold wisdom and merit of this Dharma must all be attained, attained yet without grasping in the mind."
  - title: 从空出有 — 显教顶点、密教起点
    title_en: "From Emptiness to Existence: The Apex of the Exoteric, the Starting Point of the Esoteric"
    body: '法师以「舍有入空」为显教（禅）至极，而以「从空出有」为密教向上一著（原文，第22集）：

      「我们刚刚讲显教里面最高的禅宗是舍有入空，密教再从空出有，所以才更上一层楼……密教从空出有那个出就是生出的意思，从这个空的这个根本……从空根本生出一切法来……所以从空出有就变成无量庄严，无量方便。」

      第21集则明言（原文）：「显教的顶点是密教的起点。」

      关于《心经》与密（原文，第5集）：「其实『般若波罗蜜』本身就是个密，不须再更求其密，以其有无上秘密威神力故……若光持诵『摩诃般若波罗蜜』一词，即是在修『密法』。」'
    source: 成观法师《大日经疏讲解》第21·22集 · 《心经系列》（五）
    links:
      第21集: https://www.fjdh.cn/wumin/2013/11/130349305066.html
      第22集: https://www.fjdh.cn/wumin/2013/11/130439305067.html
      心经系列五: http://www.xuefo.com/nr/article62/619258.html
    en_body: |-
      In the 22nd lecture, Master Chengguan makes "abandoning existence to enter emptiness" the utmost of the exoteric teaching (Chan) and raises "from emptiness to existence" as the esoteric's further ascent: "We just said the highest Chan of the exoteric school is abandoning existence to enter emptiness; the esoteric goes further from emptiness to existence, rising yet another level... in 'from emptiness to existence,' that 'out' means to bring forth, from this root of emptiness one brings forth all dharmas... so from emptiness to existence becomes measureless adornment and measureless skillful means." The 21st lecture states plainly: "The apex of the exoteric teaching is the starting point of the esoteric." On the Heart Sūtra and the esoteric (5th lecture): "prajñāpāramitā itself is an esoteric; there is no need to seek further esotericism, for it possesses unsurpassed secret majestic power... merely reciting the phrase 'mahā-prajñāpāramitā' is itself practicing the esoteric Dharma."
