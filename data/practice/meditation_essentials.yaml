# 华严行法 — 禅观法要 (来自 practice.js renderPractice() pv-meditation 区块)
subpage: 禅观法要
subpage_en: Meditation Essentials

system_overview:
  description: |
    海云继梦和上华严禅观三阶段: 资粮道(发心工程.驻佇心观) → 前行(界内定.四种观法) → 正行(界外定.法界三观)。技术面(修定.身法)与工程面(修慧.心法)始终双轨并行。
  description_en: |
    Master Haiyun Jirong's Huayan practice unfolds in three stages: the path of accumulation (the resolve-engendering project, the abiding mind-contemplation) → the preliminary practice (concentration within the realms, the four contemplations) → the actual practice (concentration beyond the realms, the threefold vision of the dharmadhātu). The technical track (cultivating concentration, the bodily methods) and the engineering track (cultivating wisdom, the mind methods) always advance in parallel.
  stages_table:
    headers: [阶段, 定位, 核心工程, 观法, 禅定, 果位]
    rows:
      - stage: 资粮道
        position: "发心工程\n界外准备"
        core_engineering: |
          五科(戒.律.调身.调息.调心)
          驻佇心观(停心)
          净化禅->象限转移
        observation: "驻佇心观\n(根本前行)"
        meditation: "瞬定境(妙高定)\n粗住->细住->欲界定"
        fruition: "三信位前\n(发心位)"
        rowspan: 2
      - stage: ""
        position: ""
        core_engineering: ""
        observation: ""
        meditation: ""
        fruition: ""
        note: |
          制度入门: 前行三年(教材/听经笔记/华藏工程)->禅师团审核->正授行法。三要件各有三。
          课程配比70%修行面+30%健康面。一日禅.二日禅.忍可禅七。
      - stage: 前行
        position: "内摄工程\n界内定"
        core_engineering: |
          安那般那数息观
          (数.随.止)
          安般守意
        observation: "数法/随法"
        meditation: "粗住->细住\n->欲界定->未到定"
        fruition: "二信~四信位"
        rowspan: 2
      - stage: ""
        position: ""
        core_engineering: ""
        observation: |
          止法+四种观法
          (1)唯心识(初-二信)
          (2)真如实(二信+)
          (3)毗婆舍那(中信)
          (4)奢摩他(后信)
        meditation: "四天王定->忉利定\n->空居天定->色界定\n->无色界定->出界定"
        fruition: |
          初信~十信位
          初果(初信)->四果(七信)->十信满心
      - stage: 正行
        position: "等持工程\n界外定"
        core_engineering: |
          三摩呬多->三摩钵底
          ->三摩地(海印三昧)
        observation: |
          杜顺法界三观
          (真空绝相.理事无碍.周遍含容)
        meditation: |
          初禅定关口:
          左转->四禅八定(外道)
          右转->四果成就(解脱)
        fruition: "十信满心\n->初住至七地(37位)"
        rowspan: 2
      - stage: ""
        position: ""
        core_engineering: |
          四次灌顶
          (1)忍可(破无明)
          (2)行者(证初果)
          (3)进阶(能所合一)
          (4)高阶(能所双泯)
        observation: "界外定.无功用行"
        meditation: ""
        fruition: "八地至妙觉(5位)\n共42位圆满"
  source_note: |
    三阶段架构名称据大华严寺官网「修行蓝图: 华严禅观全程」(2025年11月访问)。观法细节(四种观法/界内定界外定/果位对应等)据海云继梦《四十华严讲记》第67讲(2009.2.26)+《海云继梦禅观概论》(2015)+《迈向佛陀的境界》(2011)。凡官网与讲记表述有异处,以官网为框架、讲记为展开。
  source_note_en: |
    The names of the three-stage framework follow the official Dahuayan Temple website, "The Path of Practice: The Full Course of Huayan Meditation" (accessed November 2025). Details of the contemplations (the four methods, concentration within and beyond the realms, and the correspondence with fruits) follow Haiyun's Commentary on the Avatamsaka in Forty Fascicles, lecture 67 (26 Feb 2009), together with his Outline of Huayan Meditation (2015) and Toward the Realm of Buddhahood (2011). Where the website and the lecture notes differ, the website supplies the framework and the lectures the elaboration.

two_paths:
  description: |
    海云和上将修行路径分为两条: 次第道(圣解脱道/智德门)与圆融道(普贤道/福德门)。核心差异: 次第道必须证得空性、即身成就; 圆融道不必证空性,凡夫亦可修,具足信根即可,经分段生死至他方净土证无生。法师明确开示:「凡夫行圆融道,就是没有那个充分条件,你没有证得空性。你行圆融道就那么一个条件,要尽形寿行菩萨道,对三宝具足信心。」但凡夫行圆融道须避讳「聚财」与「聚众」,否则在缺乏空性的前提下易入歧途。若避此忌,报尽必生净土。华严禅观三段教学法(前行->正授行法->妙行)中,前两区块属入法界次第道,第三区块「妙行」属已入法界后的圆融道。
  description_en: |
    Master Haiyun divides the path of practice into two: the graduated path (the noble path of liberation, the gate of wisdom) and the perfectly-integrated path (the Samantabhadra path, the gate of merit). The core difference: the graduated path must realize emptiness and attain attainment in this very life; the integrated path need not realize emptiness—even an ordinary person with complete faith can practice it, and through the delimited births and deaths reaches a pure land elsewhere and realizes non-arising. As the Master states plainly: "When an ordinary person walks the integrated path, it is because they lack the sufficient condition—they have not realized emptiness. There is only one condition: to walk the bodhisattva path for one's whole life with complete faith in the Three Jewels." Yet an ordinary person on the integrated path must guard against "hoarding wealth" and "gathering followers," lest—in the absence of emptiness—they fall into error. If these taboos are avoided, at the exhaustion of karmic reward they will surely be reborn in a pure land. In the three-part Huayan meditation pedagogy (preliminary practice → the conferral of the actual practice → the wondrous practice), the first two parts belong to the graduated path of entering the dharmadhātu, and the third, the "wondrous practice," belongs to the integrated path after one has already entered the dharmadhātu.
  comparison_table:
    headers: [维度, 次第道(入法界次第道), 圆融道(法界圆融道)]
    rows:
      - dimension: 空性条件
        cidi: 必须证得空性
        yuanrong: 不必证空性,以信根具足替代
      - dimension: 生死方式
        cidi: "变易生死,即身成就(依色身)"
        yuanrong: "分段生死,即生成就(依法身),经他方净土证无生"
      - dimension: 实践目标
        cidi: "目的论明显,止观双运.定慧等持"
        yuanrong: "无明显目的性,重行法过程,以信愿行为归"
      - dimension: 核心技术
        cidi: "以「定」为范围,置心一处为归"
        yuanrong: "以歌咏赞叹诸佛为归,理事合一地置心一处"
      - dimension: 工程面
        cidi: "以《大经》(华严经)为归"
        yuanrong: "以十大愿王为依归"
      - dimension: 性质
        cidi: "由凡入圣——清除人性杂质恶质,由粗糙转入精微"
        yuanrong: "由圣入圣——法身本具但迷不晓,藉佛号唱颂内引法身"
  three_conditions:
    description: |
      三大核心条件: (1)对三宝的具足信——信心绝对,毫无折扣,100分 (2)尽形寿奋进于菩萨道——定位明确,一辈子做一件事(事修),从生命尊重与人性关怀出发服务众生 (3)一再的归零功课——每日反复检视自身,遇到挫折压力则拜忏(一百零八拜),将业力寄放在法界。
    description_en: |
      The three core conditions: (1) complete faith in the Three Jewels—absolute, undiluted, a full hundred percent; (2) striving on the bodhisattva path for one's whole life—a clear orientation, doing one thing all one's life (the cultivation of deeds), serving beings out of respect for life and care for humanity; (3) the repeated resets—examining oneself daily, and upon encountering setbacks or pressure undertaking repentance prostrations (one hundred and eight), entrusting one's karma to the dharmadhātu.
    warning: |
      凡夫行圆融道的避讳: 必须避讳「聚财」与「聚众」,否则在缺乏空性的前提下易入歧途——善者落人天善道,恶者成魔成精。若避此忌,报尽必生净土。
    warning_en: |
      Taboos for an ordinary person on the integrated path: one must avoid "hoarding wealth" and "gathering followers," otherwise—in the absence of emptiness—one easily goes astray: the virtuous fall into the good destinies of humans and gods, the vicious become demons. If these taboos are avoided, at the exhaustion of karmic reward one will surely be reborn in a pure land.
    examples: |
      法师以德雷莎修女为例: 具足对上帝的绝对信心(信根),一辈子只做「服务最穷的人」这一件事(事修),尽形寿不改——「行一法即行一切法」。梦参老和尚被关33年仍坚守信仰,亦属圆融道行者的典范。
    examples_en: |
      The Master cites Mother Teresa: absolute faith in God (the root of faith), and for her whole life doing only the one thing of "serving the poorest" (the cultivation of deeds), unchanging throughout her life—"practicing one dharma is practicing all dharmas." Venerable Master Mengcan, who held to his faith through thirty-three years of imprisonment, is likewise a model of the integrated path.
    source: |
      出处: 海云继梦《华严禅观的入法界次第道》(fjdh.cn 2013.9) . 《四十华严讲记》第14讲.第68讲 . https://www.fjdh.cn/wumin/2013/09/175337285861.html
  ten_vows:
    description: |
      普贤十大愿王是善财童子五十三参的总结与精要——「《入不思议解脱境界普贤行愿品》中,不思议解脱境界即是法界,而普贤行愿是直接入法界的行法。」海云和上先后五次重要讲解: 1992年台北初讲.2001年5月加拿大湛山精舍(共52讲,分三册出版: 《普贤行愿》2002/《不思议解脱》2003/《大方广境界》2003).2006年台北(《普贤十大愿王行法精要》).2007年槟城+2008年新加坡(合并出版《十大愿王修行法要》)。另有2011年昆明开示系列(fjdh.cn收录)。
    description_en: |
      Samantabhadra's ten great vows are the summation and essence of the youth Sudhana's fifty-three visits—"In the Practice and Vows of Samantabhadra on Entering the Inconceivable Realm of Liberation, the inconceivable realm of liberation is the dharmadhātu itself, and the Samantabhadra practice and vows are the practice that enters the dharmadhātu directly." Master Haiyun has expounded them five times in important series: first Taipei in 1992; Canada's Chan Mountain Monastery in May 2001 (fifty-two lectures, published in three volumes: Samantabhadra's Practice and Vows 2002 / the Inconceivable Liberation 2003 / the Vast and Great Scope 2003); Taipei 2006 (The Essence of Practicing the Ten Great Vows); and Penang 2007 plus Singapore 2008 (combined as The Essentials of Cultivating the Ten Great Vows). There is also a 2011 Kunming lecture series (held at fjdh.cn).
    hierarchy:
      title: 十大愿王三层次结构
      title_en: The Three Tiers of the Ten Great Vows
      levels:
        - level: 根本（第1-3愿）
          level_en: The Foundation (vows 1-3)
          items: "礼敬诸佛.称赞如来.广修供养"
          items_en: "venerating all buddhas, praising the Tathāgata, making extensive offerings"
          position: 真正要实修的根本,可各选一门主修
          position_en: The true root to be actually practiced; one may choose a single vow as one's main cultivation.
        - level: 补充（第4愿）
          level_en: The Supplement (vow 4)
          items: 忏悔业障
          items_en: confessing karmic obstructions
          position: "修前三愿遇挫折时以此补救,具关键性地位"
          position_en: When obstacles arise in the first three vows, this is the remedy; it holds a pivotal place.
        - level: 圆融扩大（第5-7愿）
          level_en: The Perfect Enlargement (vows 5-7)
          items: "随喜功德.请转法轮.请佛住世"
          items_en: "rejoicing in merits, requesting the turning of the dharma-wheel, requesting the buddhas to remain in the world"
          position: 使基础修行圆满
          position_en: Brought to completion by these, the foundational practice is made perfect.
        - level: 无限扩大（第8-10愿）
          level_en: The Infinite Enlargement (vows 8-10)
          items: "常随佛学(百).恒顺众生(千/重重无尽).普皆迴向(万/无有止境)"
          items_en: "always following the Buddha's teaching, according with beings, and universal dedication"
          position: "代表无限的扩大——「虚空界尽.众生界尽.众生业尽.众生烦恼尽,我此愿力无有穷尽」"
          position_en: Represents the infinite enlargement—"though the realms of space, of beings, of their deeds, and of their afflictions be exhausted, my power of vows knows no end."
    core_principles: |
      (1)普贤行愿力——海云和上在2011年昆明《普贤行愿品》开示中指出: 「普贤菩萨是法界的第一尊佛,你看得到,你能够认识到佛的第一个形象,就是普贤菩萨。那么在自性海中所修行的法,都叫普贤行愿。你在自性海中所修行的法,所产生的威神力,叫做普贤行愿力。」「我以普贤行愿力故,深心信解,如对目前」(即亲自体验证得,非推测想象)
      (2)四无尽观——每一大愿皆以虚空界尽.众生界尽.众生业尽.众生烦恼尽为所依,四者无有尽故修行无有穷尽,心量无限放大
      (3)念念相续无有疲厌——倾向于圆融道行法,不可一曝十寒。
    core_principles_en: |
      (1) The power of the Samantabhadra vows—in his 2011 Kunming explanation of the Practice and Vows chapter, Master Haiyun notes: "Samantabhadra is the first buddha of the dharmadhātu; the first form of the Buddha you can see and recognize is Samantabhadra. All the dharmas practiced within the sea of one's own nature are called the Samantabhadra vows; the awe-inspiring power they generate is the power of the Samantabhadra vows." "Through the power of the Samantabhadra vows, I believe and understand with deep resolve, as if before my very eyes" (that is, realized through direct experience, not by conjecture and imagination).
      (2) The contemplation of the four exhaustions—each great vow rests on the exhaustion of the realms of space, of beings, of their deeds, and of their afflictions; since these four have no end, so the practice has no end and the mind expands without limit.
      (3) Thought after thought continuing without fatigue or weariness—inclined toward the integrated path, never doing things by fits and starts.
    source: |
      出处: 《普贤十大愿王行法精要》(空庭书苑, 2006年台北讲记, ISBN 9789867484734) . 《十大愿王修行法要》(空庭书苑, 2007槟城+2008新加坡) . 2011年昆明开示系列(fjdh.cn收录) . https://findbook.com.tw/9789867484734

stage1_foundation:
  title: "第一阶段: 禅修入门 — 发心工程（资粮道）"
  title_en: "Stage One: Meditation for Beginners — the Resolve-Engendering Project (the path of accumulation)"
  description: |
    资粮道是一切禅观的基础准备，约需1-3年。核心任务是发心工程——使行者从散乱中「静下来」。通过「驻佇心观」(停心)将心初步收摄，成为「堪受法器」后方可进入前行。
  description_en: |
    The path of accumulation is the foundational preparation for all meditation, lasting roughly one to three years. Its core task is the resolve-engendering project—enabling the practitioner to "settle down" from distraction. Through the abiding mind-contemplation (stopping the mind) one gathers the mind initially; only after becoming a "vessel worthy of the teaching" does one proceed to the preliminary practice.
  sections:
    - title: 制度性入门 — 修行不是DIY
      title_en: Institutional Entry — Practice Is Not Do-It-Yourself
      content: |
        法师强调:「它是一套制度」——个人能走到哪一步靠「法的传承」，但能否进入这套体系靠「宗的传承」建制。

        前行三年: 完成道场指定基础教材、听经笔记(共修时核实)、每周共修、参加「华藏工程」建立语言和思维模式。经禅师团同意、道场推荐、禅师团审核，方取得「正授行法」资格。

        五科训练: 戒.律.调身.调息.调心。课程配比: 70%修行面(戒/律/调心)+30%健康面(调身/调息)。

        三要件各有三: (1)心性要件-行者先决条件 (2)内摄要件-调身+调息=暖身二法 (3)内观要件-等持工程三昧基础，属一乘不共别圆。

        出处: 大华严寺官网「资粮道」页面 . 海云继梦《四十华严讲记》第67讲(2009年2月26日开示, fjdh.cn收录逐字稿)
      content_en: |
        The Master stresses: "It is an institution"—how far one advances rests on the "transmission of the teaching," but whether one may enter the system rests on the establishment of the "transmission of the school."

        The three-year preliminary: complete the temple-assigned basic study materials, keep lecture notes (checked during communal practice), attend weekly communal practice, and join the "Huazang Project" to build up a shared language and way of thinking. With the consent of the meditation masters, a temple recommendation, and the masters' review, one obtains the qualification for the "conferral of the actual practice."

        The five disciplines: moral precepts, monastic rules, the settling of the body, of the breath, and of the mind. Course balance: 70% practice (precepts, rules, mind) plus 30% wellbeing (body, breath).

        Each of the three requirements has three aspects: (1) the character requirement—the practitioner's prerequisite; (2) the internal-gathering requirement—settling body and breath, the two warming-up methods; (3) the insight requirement—the basis of the samādhi of the equipoise project, belonging to the one-vehicle, unshared, specifically-perfect teaching.
    - title: "调身.调息.调心 — 五科训练详解"
      title_en: Setting the Body, the Breath, and the Mind — the Five Disciplines in Detail
      content: |
        五科(戒.律.调身.调息.调心)是资粮道的实操基础。海云和上指出: 身.息.心三者一体不二——调息可及于调身,调身效果又可及于调心。实际行法中三者同时并行,非先后次第。核心著作: 《煖身: 华严禅修入门》(布克文化 2021, ISBN 9789865405984)。
      content_en: |
        The five disciplines (precepts, rules, and the settling of body, breath, and mind) form the practical foundation of the path of accumulation. Master Haiyun points out that body, breath, and mind are one and indivisible—settling the breath can reach the body, and the effect of settling the body can reach the mind. In actual practice the three proceed simultaneously, not in sequence. Core work: Warming Up: An Introduction to Huayan Meditation (Book Culture 2021).
      subsections:
        - title: "调身 — 毗卢遮那七支坐相"
          title_en: Settling the Body — the Seven-Point Posture of Vairocana
          description: |
            据海云和上《迈向佛陀的境界——华严禅前行概论》第六章「毗卢遮那七支坐法」(fjdh.cn收录全文)。和上强调:「七支坐相的目的,旨在调身……若人以此来摄心,即能顿证佛性海。」
          description_en: |
            Drawn from chapter six, "The Seven-Point Posture of Vairocana," of Master Haiyun's Toward the Realm of Buddhahood. The Master stresses: "The purpose of the seven-point posture is to settle the body… if one gathers the mind by this means, one can directly realize the ocean of buddha-nature."
          items:
            - name: "(1)跏趺坐"
              name_en: (1) The full lotus
              detail: "双盘为佳,单盘或金刚坐亦可。臀与两膝三点鼎立成正三角形,稳固久坐不倾"
              detail_en: "The full lotus is best; the half lotus or vajra seat is also acceptable. Buttocks and two knees form three points of an equilateral triangle for stability in long sitting without toppling."
            - name: "(2)手结定印"
              name_en: (2) The mudrā of concentration
              detail: "两掌相迭掌心向上,拇指轻拄(指甲碰指甲即可)。「五心向上」(两掌心/两足心/顶门)令气流畅"
              detail_en: "The two palms are stacked with the palms up, the thumbs lightly touching (fingernail to fingernail suffices). The 'five centers turned up' (two palms, two soles, crown) allow the vital energy to flow."
            - name: "(3)头正颈正"
              name_en: (3) Head straight, neck straight
              detail: "头不左右偏。「头正、颈正」与「脊直、肩平」构成十字形"
              detail_en: "The head does not tilt left or right. 'Head straight, neck straight' together with 'spine straight, shoulders level' form a cross shape."
            - name: "(4)脊直肩平"
              name_en: (4) Spine straight, shoulders level
              detail: "脊椎挺直,两肩平正放松,神经/血液/内分泌系统自然运作"
              detail_en: "The spine is erect, the two shoulders level and relaxed, so that the nervous, circulatory, and endocrine systems operate naturally."
            - name: "(5)眼平视"
              name_en: (5) The gaze level
              detail: "眼帘自然下垂以遮光为度,取「三分慈眼」。「此三相摄三千威仪」(头正/脊直/眼平视)"
              detail_en: "The eyelids lower naturally just enough to shade the light, adopting the 'three-part compassionate gaze.' 'These three aspects encompass the three thousand dignified manners' (head straight, spine straight, gaze level)."
            - name: "(6)舌抵颚"
              name_en: (6) The tongue against the palate
              detail: "舌尖轻顶上颚齿龈(上门牙牙龈处),口水自然由舌根两旁下流入咽喉"
              detail_en: "The tip of the tongue lightly presses the gum above the upper front teeth, so that saliva naturally flows down beside the root of the tongue into the throat."
            - name: "(7)收下颚"
              name_en: (7) The chin drawn in
              detail: "头不前后偏,百会穴与海底穴重迭。如此方能「经劫不替」,久坐不倾"
              detail_en: "The head does not lean forward or back, the crown point and the base point overlap. Only thus can one sit 'unchanged through the eons,' long sitting without toppling."
        - title: "调息 — 息之四相与数息法"
          title_en: Settling the Breath — the Four Phases of Breath and the Breath-Counting Method
          description: |
            息之四相出自智者大师《释禅波罗蜜次第法门》,海云和上在《禅修前行》第六集(fjdh.cn 2013.11)中引用并详加解说: 「守风则散,守喘则结,守气则劳,守息即定。」
          description_en: |
            The four phases of breath come from the Great Master Zhiyi's Explanation of the Graduated Methods of Chan and Pāramitā, which Master Haiyun cites and explains at length in his Preliminary Meditation Practice, episode six: "To watch the wind is to scatter, to watch the pant is to bind, to watch the coarse air is to weary, to watch the still breath is to settle."
          breath_phases:
            - name: 风相
              name_en: the wind phase
              feature: "鼻息粗重,出入有声"
              feature_en: "The breath from the nose is coarse and heavy, audible in and out."
              meaning: "身心不安宁->先安心,放下身心世界"
              meaning_en: "Body and mind unsettled—first settle the mind, letting go of body, mind, and world."
            - name: 喘相
              name_en: the panting phase
              feature: "息无声但出入结滞不通"
              feature_en: "The breath is silent but its passage is blocked and labored."
              meaning: "身体多病->宽放身体,放松情绪"
              meaning_en: "The body is prone to illness—loosen the body and relax the emotions."
            - name: 气相
              name_en: the coarse-air phase
              feature: "息不结滞但不细"
              feature_en: "The breath is not blocked, yet it is not fine."
              meaning: "初修状态->观想气行遍毛孔肢节,愈微愈妙"
              meaning_en: "The beginner's state—visualize the energy flowing through every pore and limb, the subtler the better."
            - name: 息相
              name_en: the still-breath phase
              feature: "无声.不结.不粗,出入绵密若存若亡"
              feature_en: "Silent, unblocked, and fine, in and out dense and continuous as if present yet absent."
              meaning: "调相——可入定"
              meaning_en: "The settled phase—one may enter concentration."
          counting_method: |
            数息要领: 注意力集中于「风门」(鼻中膈底部,两鼻孔间接近上唇处),觉知息入息出。在「息入尽」及「息出尽」的换气处数息(一入一出为一圈)。初学者从数「一至三」起,稳定后增至「一至五」->「一至七」->「一至十」。
          counting_method_en: |
            Essentials of breath-counting: focus the attention on the "wind gate" (the base of the nasal septum, between the two nostrils just above the upper lip) and be aware of each in-breath and out-breath. Count at the turning point where the in-breath ends and the out-breath ends (one in and one out makes one cycle). Beginners start counting "one to three," and once stable increase to "one to five," then "one to seven," then "one to ten."
        - title: "调心 — 治沉.浮.宽.急四相"
          title_en: Settling the Mind — Treating the Four Phases of Sinking, Floating, Loosening, and Tension
          heart_phases:
            - name: 沉相
              name_en: the sinking phase
              symptom: "昏沉欲睡.精神涣散.低头垂颈"
              symptom_en: "Drowsy and dozing, scattered in spirit, head bowed and neck drooping."
              remedy: "补充营养(综合维他命);意守风门,守息入息出"
              remedy_en: "Supplement nutrition (multivitamins); hold the mind at the wind gate, watching the in- and out-breath."
            - name: 浮相
              symptom: "精神亢奋.心念多缘.身躁动"
            - name: 浮相
              name_en: the floating phase
              symptom: "精神亢奋.心念多缘.身躁动"
              symptom_en: "Agitated in spirit, the mind grasping onto many objects, the body restless."
              remedy: "少食五辛.补品.牛羊肉等;系念丹田"
              remedy_en: "Eat less of the five pungent roots, tonics, beef, mutton, etc.; hold the mind at the lower elixir field (dāntián)."
            - name: 宽相
              name_en: the loosening phase
              symptom: "心意不举.身好躺卧.口中多水"
              symptom_en: "The mind cannot rouse itself, the body loves to lie down, the mouth fills with saliva."
              remedy: "饮食多温热少寒凉;摄身挺腰,心安住息中"
              remedy_en: "Eat more warm food and less cold; draw the body up and straighten the spine, abiding the mind in the breath."
            - name: 急相
              name_en: the tension phase
              symptom: "胸中疼痛.气上举不调"
              symptom_en: "Pain in the chest, the energy rising unregulated."
              remedy: "多食寒凉少食燥热;放宽身心,意不卑不亢"
              remedy_en: "Eat more cool food and less hot-drying food; loosen body and mind, holding the attention neither too low nor too high."
          note: "若风门举意仍无效,可提意至眉间(风门至眉间称「金刚宝剑」,道家称「小周天」)。"
          note_en: "If raising the attention at the wind gate still proves ineffective, one may raise it to between the brows (the stretch from wind gate to brows is called the 'vajra sword'; in Daoism, the 'small heavenly cycle')."
        - title: "入相.住相.出相 — 一座禅修的三阶段"
          title_en: The Entering, Abiding, and Emergent Phases — the Three Stages of a Meditation Sit
          phases:
            - name: 入相（由粗到细）
              name_en: the entering phase (from coarse to fine)
              detail: "调身(七支坐相)->调息(觉息相.数息)->调心(治沉浮宽急)"
              detail_en: "Settle the body (the seven-point posture), then the breath (perceiving the breath and counting), then the mind (treating sinking, floating, loosening, and tension)."
            - name: 住相（住于细中）
              name_en: the abiding phase (abiding in the fine)
              detail: "摄心于息,同时觉知身.息.心三相是否调和,随觉随治"
              detail_en: "Gather the mind in the breath while sensing whether the three phases of body, breath, and mind are in harmony, correcting as one perceives."
            - name: 出相（由细到粗）
              name_en: the emergent phase (from fine to coarse)
              detail: "先放心异缘(调心)->开口放气,息从百脉散(调息)->微动身躯.肩臂.头颈.双足,揉毛孔.摩掌熨眼(调身),待身热后方可出入,站定后拍打全身"
              detail_en: "First release the mind to other objects (settling the mind), then open the mouth and let out the breath so it disperses through the hundred channels (settling the breath), then gently move the torso, shoulders, arms, neck, and feet, rubbing the pores and warming the eyes with cupped palms (settling the body); only after the body is warm may one rise, and once standing, pat the whole body."
      source: |
        出处: 《煖身: 华严禅修入门》(布克文化 2021, ISBN 9789865405984) . 七支坐相原文: 海云和上《迈向佛陀的境界——华严禅前行概论》第六章(fjdh.cn 2013.11) https://www.fjdh.cn/wumin/2013/11/183343302811.html . 《禅修正行》第12集 . 《禅修前行》第6集 . https://play.google.com/store/books/details?id=QREREAAAQBAJ
    - title: "驻佇心观(停心工程) — 一切禅观的根本前行"
      title_en: The Abiding Mind-Contemplation (the Stopping Project) — the Fundamental Preliminary of All Meditation
      content: |
        海云法师:「你要能够停下心来，然后，我们要观心！停心是一个前行，都办不到了，怎么观心啊？」核心次第: 「停心」->「观心」。

        停心(体.相二门):
        体上停心: 心念不起，六根对六尘境界不会攀缘。
        相上停心: 不妄加猜测、攀缘分别。标准——「心是不是静止下来，像墙壁一样，动都不动！」

        四种停心方法:
        (1)参话头: 「看话头就是把心停在那里」
        (2)置心一处: 心安鼻端风门,心跑掉就拉回来
        (3)数息/随息: 从呼吸入手
        (4)依禅堂规矩: 该动则动.该静则静.身心放下。

        观心与验证:
        停心之后才能观心——六根对六尘如何作用,看得清清楚楚,「没有任何推理、没有任何意识形态」。法师强调:「不停心你看不到！」六项自检: 空.明.定.智.善心.柔软。

        出处: 海云继梦《华严禅行法—禅观》第四集 . https://www.fjdh.cn/wumin/2013/11/165329303084.html . https://www.fjdh.cn/wumin/2013/09/155711285715.html
      content_en: |
        Master Haiyun: "You must be able to stop the mind, and then we contemplate the mind! Stopping the mind is a preliminary; if you cannot even do that, how can you contemplate the mind?" The core sequence: "stopping the mind" → "contemplating the mind."

        Stopping the mind (the two gates of substance and appearance):
        In substance: no thoughts arise and the six senses do not cling to the objects of the six sense-fields.
        In appearance: one adds no groundless conjecture, clinging, or discrimination. The standard—"has the mind become still, like a wall, not moving at all!"

        Four methods of stopping the mind:
        (1) Investigating a huàtóu: "watching the huàtóu is stopping the mind right there"
        (2) Setting the mind in one place: settle the mind at the wind gate of the nose, drawing it back whenever it runs off
        (3) Counting or following the breath: working from the breath
        (4) Following the rules of the meditation hall: move when one should move, be still when one should be still, letting body and mind go.

        Contemplating and verifying the mind:
        Only after stopping can one contemplate the mind—seeing clearly how the six senses operate upon the six sense-fields, "without any reasoning, without any ideology." The Master stresses: "If you do not stop the mind, you cannot see!" Six self-checks: emptiness, luminosity, stillness, wisdom, a wholesome mind, and gentleness.

stage2_preparation:
  title: "第二阶段: 禅修前行 — 内摄工程"
  title_en: "Stage Two: The Preliminary Practice — the Internal-Gathering Project"
  description: |
    前行是禅观体系的核心训练阶段，在界内定中进行。四种观法构成工程面主干，贯穿初信至十信位。前二种出自《占察善恶业报经》(T17n0839)，后二种是标准大乘止观。
  description_en: |
    The preliminary practice is the core training stage of the meditation system, carried out within concentration in the realms. The four contemplations form the backbone of the engineering track, running from the first to the tenth stage of faith. The first two come from the Sūtra of the Divination of the Wholesome and Evil Results of Karma (T17n0839); the latter two are standard Mahāyāna calming-and-insight.
  sections:
    - title: "技术面.工程面双轨详解"
      title_en: The Technical and Engineering Tracks in Detail
      subsections:
        - title: "参禅金三角 — 置心一处 . 放轻松 . 息入息出"
          title_en: The Golden Triangle of Meditation — Setting the Mind in One Place, Relaxing, and the Clear In- and Out-Breath
          description: |
            参禅金三角是海云和上禅修教学中 最核心的入门架构,三个条件缺一不可。法师强调:「这三点若能做到及格,触功德就会发起,身心得到调整,人格性可达七十五分以上。完成参禅金三角即进入心一境性。」
          description_en: |
            The golden triangle is the most central beginner's architecture in Master Haiyun's teaching; all three conditions are indispensable. The Master stresses: "If these three can be done to a passing standard, the touch-attributes will arise, body and mind are reordered, and one's personality can reach above seventy-five points. Completing the golden triangle means entering one-pointedness of mind."
          elements:
            - name: "(1)置心一处"
              name_en: (1) Setting the mind in one place
              description: "将心念安住「风门」(鼻孔气息出入处)"
              description_en: "Settle the mind at the 'wind gate' (where the breath enters and leaves the nostrils)."
              operation: "用数息法从一到十循环计数。莫用大脑推理思考,只用感受"
              operation_en: "Use breath-counting, cycling from one to ten. Do not reason it out with the intellect; use only sensation."
            - name: "(2)放轻松"
              name_en: (2) Relaxing
              description: "身体肌肉.神经系统都要放下;心理上也完全放松,不起执着"
              description_en: "Let go in the muscles and nervous system; also relax psychologically, holding nothing."
              operation: "不能为了专注而肩膀紧绷。「呼吸归呼吸,妄想归妄想」——不跟妄想纠缠"
              operation_en: "Do not tense the shoulders for the sake of concentration. 'Breath is breath, and wandering thoughts are wandering thoughts'—do not entangle with the delusions."
            - name: "(3)息入息出清楚"
              name_en: (3) The in- and out-breath clearly perceived
              description: "对呼吸的出入看得清清楚楚,不能昏沉睡着"
              description_en: "Perceive the coming and going of the breath clearly, without dozing off."
              operation: "「六根门头全开放」——心在宁静中保持鲜活。守住风门,身心放松,妄念停止"
              operation_en: "'All the gates of the six senses wide open'—the mind stays alive within stillness. Guard the wind gate, relax body and mind, and wandering thoughts cease."
          full_process: |
            整体流程: 调身(七支坐相)->调息(自然呼吸,数息1-10)->置心一处于风门->同时放松身心->息入息出清清楚楚->达成金三角(心一境性)->触功德发起(轻安舒服感)->继续觉照根性->象限转移->破无明->入菩提道。
          full_process_en: |
            The whole process: settle the body (the seven-point posture) → settle the breath (natural breathing, counting one to ten) → set the mind in one place at the wind gate → at the same time relax body and mind → perceive the in- and out-breath clearly → attain the golden triangle (one-pointedness) → the touch-attributes arise (a comfortable ease) → continue illuminating the faculties → the quadrant shift → breaking through ignorance → entering the bodhi path.
          warning: |
            警示: 修得轻安感后不可耽于禅味,否则会掉入四禅八定而失去对根性的觉照。
          warning_en: |
            Warning: once one gains the ease, one must not linger in its flavor, or one will fall into the four dhyānas and eight concentrations and lose the illumination of the faculties.
          source: |
            出处: 海云继梦《何谓参禅金三角》(fjdh.cn 2013.12) . https://www.fjdh.cn/fjask/2013/12/133616318955.html . http://read.goodweb.top/news/news_view.asp?newsid=82958
        - title: "技术面: 安那般那 — 数.随.止三法"
          title_en: "The Technical Track: Ānāpāna — the Three Methods of Counting, Following, and Stopping"
          methods:
            - name: 数法
              name_en: the counting method
              state: "粗住->细住->欲界定"
              state_en: "coarse abiding → fine abiding → the desire-realm concentration"
              operation: "置心风门,1数到10循环。克服四种妄想: 心理/物理/生理/社会制度"
              operation_en: "Set the mind at the wind gate and count from 1 to 10 in a cycle. Overcome four kinds of wandering thoughts: psychological, physical, physiological, and social-institutional."
              pitfall: "⚠ 掉入「舒服禅」——枯木禅非真修"
              pitfall_en: "Beware of falling into the 'comfortable meditation'—a withered-tree chan is not true practice."
            - name: 随法
              name_en: the following method
              state: "欲界定->未到定"
              state_en: "the desire-realm concentration → the concentration before the first dhyāna"
              operation: "注意「息入尽」与「息出尽」的每一个细节。妄想被堵住"
              operation_en: "Attend to every detail of the end of the in-breath and the end of the out-breath. Wandering thoughts are blocked."
              pitfall: "追求境界名相,忽略身心柔和"
              pitfall_en: "Chasing the terms and states of attainments while neglecting gentleness of body and mind."
            - name: 止法
              name_en: the stopping method
              state: "置心一处.心一境性"
              state_en: "setting the mind in one place, one-pointedness of mind"
              operation: "所有妄想脱落,心境合一。八触十功德"
              operation_en: "All wandering thoughts fall away; mind and its object become one. The eight contacts and ten attributes."
              pitfall: "⚠ 左转入外道禅;须「右转」向四果"
              pitfall_en: "Beware: turning left one enters the hermit schools' meditation; one must 'turn right' toward the four fruits."
        - title: "工程面: 三阶段心法 + 三层功夫"
          title_en: "The Engineering Track: The Three-Stage Mind Method and the Three Layers of Effort"
          stages:
            - name: A阶段
              name_en: Stage A
              detail: 感受息之长短与动静差异
              detail_en: Sensing the difference in the length, movement, and stillness of the breath.
            - name: B阶段
              name_en: Stage B
              detail: "洞悉呼吸因果轨迹(法师称「生命的秘笈」)"
              detail_en: "Penetrating the causal course of the breath (called by the Master 'the secret key to life')."
            - name: C阶段
              name_en: Stage C
              detail: "心王.心所.境界(公开资料未完全展开)"
              detail_en: "The mind-king, mental factors, and objects (not fully elaborated in public materials)."
          three_layers: |
            内摄(技术面): 「妄想一起,把心抓回来放在风门」
            内观(工程面): 在数随止中感受法身存在,分三级: 寂而常照/照而常寂/寂照双亡
            禅观: 粗(数随止中感受)->细(置心一处后)->微妙(十信圆满后)
          three_layers_en: |
            Internal gathering (the technical track): "when a wandering thought arises, bring the mind back to the wind gate"
            Internal contemplation (the engineering track): within counting, following, and stopping, sense the presence of the dharmakāya, in three degrees: still yet ever illuminating / illuminating yet ever still / the extinction of both stillness and illumination
            Meditation: coarse (sensed within counting, following, stopping) → fine (after setting the mind in one place) → subtle and wondrous (after completing the ten stages of faith)
      source: |
        出处: 大华严寺官网「修行蓝图」. 海云继梦《禅修正行》《禅观》系列 . 《海云继梦禅观概论》(2015)第四章
    - title: "四种观法体系 — 前行工程面核心"
      title_en: The System of Four Contemplations — the Core of the Preliminary Engineering Track
      table:
        headers: [观法, 信位, 禅定, 工程, 核心操作, 成就]
        rows:
          - name: "(1)唯心识观"
            name_en: (1) The consciousness-only contemplation
            stage: 初信~二信
            stage_en: First to second stage of faith
            meditation: "四天王定(煖法)"
            meditation_en: "the concentration of the four heavenly kings (the warm stage)"
            engineering: 自省三业
            engineering_en: introspecting the three deeds
            operation: "守记内心;避免无记攀缘;行禅/闭眼抬手训练"
            operation_en: "Sustain mindful attention within; avoid idle grasping; walking meditation / eyes-closed hand-raising drills."
            achievement: 色寂三昧
            achievement_en: the samādhi of the stilling of form
          - name: "(2)真如实观"
            name_en: (2) The suchness reality contemplation
            stage: 二信位+
            stage_en: Second stage of faith and beyond
            meditation: "忉利定(顶法)"
            meditation_en: "the Trayastrimśa concentration (the summit stage)"
            engineering: 观五蕴流转
            engineering_en: contemplating the flow of the five aggregates
            operation: "思惟心性无生无灭;反观自性;超越四空定"
            operation_en: "Reflect that the nature of mind is unborn and unceasing; turn back to see one's own nature; go beyond the four formless concentrations."
            achievement: "相似空三昧->心寂三昧->一行三昧"
            achievement_en: "the semblance emptiness samādhi → the mind-stilled samādhi → the single-practice samādhi"
          - name: "(3)毗婆舍那观"
            name_en: (3) The vipaśyanā contemplation
            stage: 中信位
            stage_en: the middle stage of faith
            meditation: "空居天定->色界定"
            meditation_en: "the sky-dwelling heavens' concentration → the form-realm concentration"
            engineering: "观根尘识;照住色受间"
            engineering_en: "contemplate sense-faculties, sense-objects, and consciousness; hold one's illumination between form and feeling"
            operation: "观六根六尘六识流动;照住色受动态止观"
            operation_en: "Watch the flow of the six faculties, six objects, and six consciousnesses; hold one's illumination in the dynamic calming-and-insight between form and feeling."
            achievement: "渐舍五识(色界定)"
            achievement_en: "gradually relinquishing the five consciousnesses (the form-realm concentration)"
          - name: "(4)奢摩他观"
            name_en: (4) The śamatha contemplation
            stage: 后信位
            stage_en: the later stage of faith
            meditation: "无色界定->出界定"
            meditation_en: "the formless-realm concentration → the abandonment concentration"
            engineering: "照见五蕴空;入正真位"
            engineering_en: "see that the five aggregates are empty; enter the true and genuine stage"
            operation: "舍意识;能所双泯;照见五蕴皆空"
            operation_en: "Relinquish the mental consciousness; the extinction of both perceiver and perceived; see that the five aggregates are all empty."
            achievement: "十信满心;入法界;圆教初住位"
            achievement_en: "completing the tenth stage of faith; entering the dharmadhātu; the first abiding stage of the perfect teaching"
      classical_source: |
        《占察善恶业报经》:「若欲依一实境界修信解者,应当学习二种观道。何等为二?一者唯心识观,二者真如实观。」海云法师称此经为「小本华严」。
        https://cbeta.buddhism.org.hk/xml/T17/T17n0839_002.xml
      classical_source_en: |
        The Sūtra of the Divination of Good and Evil Karmic Results: "If one wishes, relying on the true reality of one reality, to cultivate faith and understanding, one should study the two kinds of contemplation-paths. What are the two? The first is the consciousness-only contemplation, and the second is the suchness reality contemplation." Master Haiyun calls this sūtra "the Small Huayan."
      sharp_dull_differentiation: |
        利钝分判: 利根者(阴盖轻微.散乱心少)->直修真如实观; 钝根者(染着情厚.心难调伏)->先修唯心识观。海云法师补充: 钝根先以唯心识观摄心,令妄想降伏后方转入真如实观,此即「由相入性」。
      sharp_dull_differentiation_en: |
        Discriminating quick and dull faculties: those of keen faculties (with light veils and little scatteredness) directly cultivate the suchness reality contemplation; those of dull faculties (with deep attachment and an unruly mind) first cultivate the consciousness-only contemplation. Master Haiyun adds: the dull first gather the mind with the consciousness-only contemplation, and only after subduing delusions turn to the suchness reality contemplation—this is "entering the nature by way of the marks."
      detail_1_title: "(1) 唯心识观 — 毗钵舍那(观).法相宗.钝根先修"
      detail_1_title_en: "(1) The Consciousness-Only Contemplation — vipaśyanā (insight), the dharma-character school, cultivated first by the dull"
      detail_1_content: |
        定位: 初信~二信位。工程: 自省三业(身.语.意),在定中境中唯观一切三业「唯心生.唯心灭」。四天王定是行者从「定外境」转入「定内境」的起点,属坚信位「煖法」;忉利定属「顶法」,不仅唯见三业之既成,更能见到「三业中心之所由起」。

        「学唯心识观者,于一切时一切处,随身口意所有作业,悉当观察,知唯是心。勿令使心无记攀缘,不自觉知。」「一切法唯心想生。若使离心,则无一法一相而能自见有差别也。」

        两大重点: (正面)守记内心-念念清楚;(反面)避免无记攀缘-口头禅.摸头发等惯性动作。
        具体训练: (1)闭眼抬手-「手在哪里?你知道吗?要很清楚地感知到」 (2)行禅-脚步慢慢抬起->停->放下,清清楚楚了知 (3)口诀-「唯心识观就是不用大脑,让灵性生命浮现出来」。得色寂三昧。
      detail_1_content_en: |
        Setting: the first to second stage of faith. Engineering: introspecting the three deeds (body, speech, mind); within the stilled contemplation, seeing all three deeds as "born only from mind, ceasing only in mind." The concentration of the four heavenly kings is the point where the practitioner passes from "the stage-spheres outside concentration" to "the stage-spheres within concentration," belonging to the "warm stage" of the firmly believing stage; the Trayastrimśa concentration belongs to the "summit stage," seeing not only the already-accomplished three deeds but also "the source from which the center of the three deeds arises."

        "One who studies the consciousness-only contemplation observes, at all times and in all places, all the deeds of body, speech, and mind, knowing that they are only mind. Do not let the mind grasp idly without knowing itself." "All dharmas arise from thought alone. If one leaves the mind, not a single dharma or mark can be seen as different by itself."

        Two key points: (positively) sustain mindful attention within—clear in every moment; (negatively) avoid idle grasping—habitual motions such as catchphrases or touching the hair.
        Concrete drills: (1) with eyes closed, raise the hand—"where is your hand? do you know? you must perceive it very clearly"; (2) walking meditation—slowly raise the foot, pause, put it down, aware of each clearly; (3) the gist—"the consciousness-only contemplation is not to use the brain, but to let the spiritual life emerge." One attains the samādhi of the stilling of form.
      detail_2_title: "(2) 真如实观 — 奢摩他(止).法性宗.利根直修"
      detail_2_title_en: "(2) The Suchness Reality Contemplation — śamatha (calming), the dharma-nature school, cultivated directly by the keen"
      detail_2_content: |
        定位: 二信位及以上。工程: 观五蕴流转。与唯心识观的差别: 前者看「身语意三业(表层)」,后者深入「五蕴(身心基本元素)」的微观生灭。法理: 大乘起信论「一心开二门」—唯心识观对心生灭门(心之用),真如实观对心真如门(心之体)。

        「思惟心性无生无灭,不住见闻觉知,永离一切分别之想,渐渐能过空处.识处.无少处.非想非非想处等定境界相,得相似空三昧。」「展转能入心寂三昧……即复能入一行三昧,见佛无数,发深广行心,住坚信位。」

        海云判摄[语境: 2013年高雄《占察善恶业报经》开示]: 「唯心识观是让你了解心的存在跟作用-它像流水一样,前念接后念。真如实观是直接去看那个源头-心性的本源,无生无灭的那个。」
      detail_2_content_en: |
        Setting: the second stage of faith and beyond. Engineering: contemplating the flow of the five aggregates. Its difference from the consciousness-only contemplation: the former watches the three deeds of body, speech, and mind (the surface); the latter penetrates into the microscopic rising and ceasing of the five aggregates (the basic constituents of body and mind). Grounds: the Awakening of Faith's "one mind opening into two gates"—the consciousness-only contemplation corresponds to the gate of the arising-and-ceasing mind (the function of mind), and the suchness reality contemplation to the gate of the mind suchness (the substance of mind).

        "Reflecting that the nature of mind is unborn and unceasing, not dwelling in seeing, hearing, sensation, or knowing, forever free of all thoughts of discrimination, gradually one can pass through the concentration states of emptiness, consciousness, nothing whatsoever, and neither perception nor non-perception, attaining the semblance emptiness samādhi." "By degrees one can enter the mind-stilled samādhi… and then the single-practice samādhi, seeing countless buddhas, arousing a vast and deep mind of practice, abiding in the firmly believing stage."

        Haiyun's discernment [context: the 2013 Kaohsiung exposition of the Divination Sūtra]: "The consciousness-only contemplation lets you understand the existence and function of mind—it is like flowing water, thought following thought. The suchness reality contemplation looks directly at that source—the origin of the mind-nature, that which is unborn and unceasing."
      detail_3_title: "(3) 毗婆舍那观 — 深化观照.中信位"
      detail_3_title_en: "(3) The Vipaśyanā Contemplation — deepening insight, the middle stage of faith"
      detail_3_content: |
        定位: 中信位(约五~六信位)。含两个递进层面: (a)观照六根六尘相接时的六识流动-比唯心识观更精微,从行为觉知深入到感知通道机制 (b)照住色与受之间的动态止观-「色」(物质性感受)与「受」(心理性感受)的细微边界。成就: 渐舍五识,进入色界定。
      detail_3_content_en: |
        Setting: the middle stage of faith (about the fifth to sixth). It has two advancing layers: (a) contemplating the flow of the six consciousnesses as the six faculties meet the six objects—finer than the consciousness-only contemplation, going from awareness of behavior into the mechanism of the perceptual channels; (b) holding one's illumination in the dynamic calming-and-insight between form (the material sensation) and feeling (the psychological sensation)—the subtle boundary between them. Attainment: gradually relinquishing the five consciousnesses and entering the form-realm concentration.
      detail_4_title: "(4) 奢摩他观 — 究竟止观.后信位.能所双泯"
      detail_4_title_en: "(4) The Śamatha Contemplation — the ultimate calming-and-insight, the later stage of faith, the extinction of both perceiver and perceived"
      detail_4_content: |
        定位: 后信位(七~十信位)。三步骤: (a)舍意识-三界定功总纲最后阶段 (b)能所双泯-完全泯除主客二元对立,即《心经》「照见五蕴皆空」 (c)入正真位.十信满心-得「能所双泯」,正式「入法界」,成圆教初住位,转入正行。
      detail_4_content_en: |
        Setting: the later stage of faith (the seventh to tenth). Three steps: (a) relinquish the mental consciousness—the final phase of the general scheme of cultivating the abandoning of the three realms; (b) the extinction of both perceiver and perceived—completely dissolving the duality of subject and object, that is, the Heart Sūtra's "seeing that the five aggregates are all empty"; (c) entering the true and genuine stage, completing the tenth stage of faith—attaining "the extinction of both perceiver and perceived," formally "entering the dharmadhātu," becoming the first abiding stage of the perfect teaching, and turning to the actual practice.
      three_realms_discarding:
        title: "三界定功总纲(海云法师判摄)"
        title_en: The General Scheme of Cultivating the Abandoning in the Three Realms (Master Haiyun's discernment)
        rows:
          - realm: 欲界定
            realm_en: the desire-realm concentration
            core: 捨妄念
            core_en: relinquish wandering thoughts
            observation: "唯心识观+真如实观"
            observation_en: "the consciousness-only and suchness reality contemplations"
            stage: 初信~四信位
            stage_en: first to fourth stage of faith
          - realm: 色界定
            realm_en: the form-realm concentration
            core: 捨五识
            core_en: relinquish the five consciousnesses
            observation: 毗婆舍那观
            observation_en: the vipaśyanā contemplation
            stage: 五信~六信位
            stage_en: fifth to sixth stage of faith
          - realm: 无色界定
            realm_en: the formless-realm concentration
            core: 捨意识
            core_en: relinquish the mental consciousness
            observation: 奢摩他观
            observation_en: the śamatha contemplation
            stage: 七信~九信位
            stage_en: seventh to ninth stage of faith
          - realm: 出界定
            realm_en: the abandonment concentration
            core: "能所双泯.入法界"
            core_en: "the extinction of both perceiver and perceived, entering the dharmadhātu"
            observation: 奢摩他观究竟
            observation_en: the ultimate śamatha contemplation
            stage: 十信满心
            stage_en: completing the tenth stage of faith
      source: |
        出处: 《非常占察经》讲记三册(空庭书苑 2015-2017, ISBN 9789867484918/4932/4949) . 播客「普賢乘華嚴宗」S18(46集) . https://podcasts.apple.com/au/podcast/普賢乘華嚴宗/id1523368889 . https://open.spotify.com/show/2ZDlq4cOOiynQvlzPARkmc
    - title: "十信法门.果位对应 — 四种观法的阶位映射"
      title_en: The Ten Stages of Faith and Their Fruits — the Stage Mapping of the Four Contemplations
      content: |
        海云法师将声闻「四果」与华严「十信位」逐级对应。「破根本无明」是初果的门槛而非彻悟终点——「破根本无明才叫做悟后起修！」[语境: 2009年2月26日《四十华严讲记》第67讲, 台北]
      content_en: |
        Master Haiyun maps the śrāvaka "four fruits" step by step onto the Huayan "ten stages of faith." "Breaking through fundamental ignorance" is the threshold of the first fruit, not the end of full awakening—"Only having broken through fundamental ignorance is it called practice after awakening!" [Context: Commentary on the Avatamsaka in Forty Fascicles, lecture 67, 26 February 2009, Taipei]
      mapping_table:
        headers: [传统果位, 华严信位, 对应观法, 禅定层次, 关键标准]
        rows:
          - fruition: "初果(预流果)"
            fruition_en: First fruit (stream-enterer)
            stage: 初信位
            stage_en: first stage of faith
            observation: 唯心识观
            observation_en: the consciousness-only contemplation
            meditation: "四天王定(煖法)"
            meditation_en: "the four heavenly kings' concentration (the warm stage)"
            standard: "「舍识用根」"
            standard_en: "relinquishing consciousness and employing the faculties"
          - fruition: "—"
            fruition_en: —
            stage: 二信位
            stage_en: second stage of faith
            observation: "唯心识->真如实"
            observation_en: "consciousness-only → suchness reality"
            meditation: "忉利定(顶法)"
            meditation_en: "the Trayastrimśa concentration (the summit stage)"
            standard: "确认菩提心.毗卢遮那七支坐相.收心工程"
            standard_en: "Confirming bodhicitta, the Vairocana seven-point posture, the mind-gathering project"
          - fruition: "二果(一来果)"
            fruition_en: Second fruit (once-returner)
            stage: 三信位
            stage_en: third stage of faith
            observation: 真如实观
            observation_en: the suchness reality contemplation
            meditation: 欲界空居天定
            meditation_en: the desire-realm sky-dwelling heaven concentration
            standard: "开始运用「观照」.具轻安三相+天王三德"
            standard_en: "Beginning to employ 'the illumination'; endowed with the three marks of ease and the three virtues of a heavenly king"
          - fruition: "—"
            fruition_en: —
            stage: 四信位
            stage_en: fourth stage of faith
            observation: 真如实观
            observation_en: the suchness reality contemplation
            meditation: 同上
            meditation_en: as above
            standard: "安般守意工程: 置心于风门"
            standard_en: "the ānāpāna mind-guarding project: setting the mind at the wind gate"
          - fruition: "三果(不还果)"
            fruition_en: Third fruit (non-returner)
            stage: 五信位
            stage_en: fifth stage of faith
            observation: 毗婆舍那观
            observation_en: the vipaśyanā contemplation
            meditation: 色界定
            meditation_en: the form-realm concentration
            standard: 渐舍五识
            standard_en: gradually relinquishing the five consciousnesses
          - fruition: 四果向
            fruition_en: approaching the fourth fruit
            stage: 六信位
            stage_en: sixth stage of faith
            observation: 毗婆舍那观
            observation_en: the vipaśyanā contemplation
            meditation: 色界定
            meditation_en: the form-realm concentration
            standard: "照住-色受动态止观"
            standard_en: "holding the illumination—the dynamic calming-and-insight between form and feeling"
          - fruition: "四果(阿罗汉)"
            fruition_en: Fourth fruit (arhat)
            stage: 七信位
            stage_en: seventh stage of faith
            observation: 奢摩他观
            observation_en: the śamatha contemplation
            meditation: 无色界定
            meditation_en: the formless-realm concentration
            standard: 我法二执尚未双破
            standard_en: the clinging to self and to dharmas not yet both broken
          - fruition: 发心破法执
            fruition_en: arousing the resolve to break the clinging to dharmas
            stage: 八信位
            stage_en: eighth stage of faith
            observation: 奢摩他观
            observation_en: the śamatha contemplation
            meditation: 无色界定
            meditation_en: the formless-realm concentration
            standard: 回小向大
            standard_en: turning from the lesser to the greater
          - fruition: 我执法执双破
            fruition_en: the clinging to self and to dharmas both broken
            stage: 九信位
            stage_en: ninth stage of faith
            observation: 奢摩他观
            observation_en: the śamatha contemplation
            meditation: 出界定
            meditation_en: the abandonment concentration
            standard: 渐舍意识
