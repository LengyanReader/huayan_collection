          - fruition: 十信位圆满
            fruition_en: the completion of the tenth stage of faith
            stage: 十信位
            stage_en: tenth stage of faith
            observation: 奢摩他究竟
            observation_en: the ultimate śamatha
            meditation: "出界定.入法界"
            meditation_en: "the abandonment concentration, entering the dharmadhātu"
            standard: "能所双泯=照见五蕴皆空.成圆教初住位"
            standard_en: "the extinction of both perceiver and perceived = seeing that the five aggregates are all empty, becoming the first abiding stage of the perfect teaching"
      post_note: |
        十信位之后: 初住位至七地(37位.正行.对应金刚界曼荼罗37尊)->八地至妙觉(5位.无功用行)——共42位圆满佛果。
      post_note_en: |
        After the ten stages of faith: from the first abiding stage through the seventh ground (37 stations, the actual practice, corresponding to the 37 deities of the vajra-realm maṇḍala) → from the eighth ground through the wonderful enlightenment (5 stations, the effortless practice)—forty-two stations in all completing the perfect buddhahood.
    - title: "三重观照技术: 观照.照住.照见"
      title_en: "The Threefold Illumination Technique: Illumination, Held Illumination, and Direct Seeing"
      content: |
        贯穿四种观法的操作层面技术: 观照(二果开始,能所分离,唯心识观在此运作)-> 照住(至四果,能所合一,毗婆舍那观在此深化)-> 照见(十信满心,能所双泯,奢摩他观在此圆满)。

        法师说明:《心经》《金刚经》在他的判摄里都属于圆教初住位的教法——证量标的其实是「十信位圆满.入法界」之后的境界。
      content_en: |
        The operative techniques running through the four contemplations: illumination (from the second fruit, perceiver and perceived separated, where the consciousness-only contemplation operates) → held illumination (up to the fourth fruit, perceiver and perceived united, where the vipaśyanā contemplation deepens) → direct seeing (completing the tenth stage of faith, the extinction of both perceiver and perceived, where the śamatha contemplation comes to fulfillment).

        The Master explains: in his discernment, both the Heart Sūtra and the Diamond Sūtra belong to the teaching of the first abiding stage of the perfect teaching—their standard of attainment is in fact the state after "completing the ten stages of faith and entering the dharmadhātu."

stage3_main:
  title: "第三阶段: 禅修正行 — 等持工程（内观）"
  title_en: "Stage Three: The Actual Practice — the Equipoise Project (inner contemplation)"
  description: |
    十信满心之后,转入正行。等持工程为官网正式名称。前半程三摩呬多(samahita),后半程定慧等持(三摩钵底 samapatti),究竟等至(三摩地 samadhi)。官网: 「以观导定、以定成观,当下验果,端身正坐,置心风门,依次第而进,步步可检核。」海云和上在讲记中进一步以「界内定/界外定」区分前行与正行的禅定层次,并以杜顺法界三观为究竟指导。
  description_en: |
    After completing the tenth stage of faith, one turns to the actual practice. "The equipoise project" is the official name on the temple website. The first half rests on samāhita, the second half on the equipoise of concentration and wisdom (samāpatti), and the final attainment is samādhi. The website: "Guided by contemplation toward concentration, and formed into contemplation by concentration, verifying the fruit on the spot, sitting upright, setting the mind at the wind gate, advancing stage by stage with every step checkable." In his lectures Master Haiyun further distinguishes the concentration levels of the preliminary and actual practice as "concentration within the realms" and "concentration beyond the realms," and takes Dushun's threefold vision of the dharmadhātu as the ultimate guide.
  sections:
    - title: "杜顺法界三观 — 正行核心指导框架"
      title_en: Dushun's Threefold Vision of the Dharmadhātu — the Core Guiding Framework of the Actual Practice
      content: |
        杜顺和尚(华严初祖)所立三重观法,是华严禅观正行的究竟指导。海云和上指出: 龙树将三法印汇归一法印——空性(真空绝相观);杜顺进一步推进为理事无碍观;最终倡事事无碍观(周遍含容观)——举事即能通事,无需再透过理的转辙,此唯法身大士之行径。
      content_en: |
        The threefold contemplation established by the venerable Dushun (the first patriarch of Huayan) is the ultimate guide of the actual practice. Master Haiyun points out: Nāgārjuna gathered the three dharma-seals into one—emptiness (the contemplation of true emptiness and the cutting off of marks); Dushun advanced this further into the contemplation of the unimpeded interpenetration of principle and phenomena; and ultimately advocated the contemplation of the unimpeded interpenetration of phenomena and phenomena (the pervasive and inclusive contemplation)—taking up one phenomenon one directly penetrates all phenomena, without needing to pass through the pivot of principle; this is the conduct only of adepts of the dharmakāya.
      table:
        headers: [观法, 对应法界, 核心义理, "海云法师判摄"]
        rows:
          - name: "(1)真空绝相观"
            name_en: (1) The contemplation of true emptiness and the cutting off of marks
            realm: 理法界
            realm_en: the dharmadhātu of principle
            theory: "会色归空,明空即色,空色无碍。一切法当体即空"
            theory_en: "Gathering form back into emptiness, understanding that emptiness is form, and that emptiness and form are unobstructed. All dharmas are empty in their very essence."
            interpretation: "龙树空性一法印之极致——理无碍即阿罗汉空性观"
            interpretation_en: "The culmination of Nāgārjuna's single seal of emptiness—unimpeded principle is the arhat's emptiness contemplation"
          - name: "(2)理事无碍观"
            name_en: (2) The contemplation of the unimpeded interpenetration of principle and phenomena
            realm: 理事无碍法界
            realm_en: the dharmadhātu of the unobstructed interpenetration of principle and phenomena
            theory: "理遍于事,事遍于理。理(真如)不碍事(万象),事不碍理"
            theory_en: "Principle pervades phenomena and phenomena pervade principle. Principle (suchness) does not obstruct phenomena (the myriad things), nor do phenomena obstruct principle."
            interpretation: "事无碍即生活中的一切事物——「吾辈行者,亦当力行乎此」"
            interpretation_en: "Unimpeded phenomena are all the things of everyday life—'We practitioners, too, should strive hard in this.'"
          - name: "(3)周遍含容观"
            name_en: (3) The pervasive and inclusive contemplation
            realm: 事事无碍法界
            realm_en: the dharmadhātu of the unobstructed interpenetration of phenomena and phenomena
            theory: "事如理融,遍摄无碍。如因陀罗网,一即一切,重重无尽"
            theory_en: "Phenomena, fused like principle, pervasively encompass one another without hindrance. Like Indra's net—one is all, and all inter-reflect without end."
            interpretation: "举事即通事,不经理之转辙——唯法身大士境界。即海印三昧现前"
            interpretation_en: "Taking up one phenomenon one directly penetrates phenomena, without the pivot of principle—the exclusive state of an adept of the dharmakāya. It is the ocean-seal samādhi manifesting."
      source: |
        出处: 杜顺《法界观门》 . 海云继梦《迈向佛陀的境界》(空庭书苑 2011) . http://wuming.xuefo.net/nr/6/59482.html
    - title: "正授行法 — 四次灌顶制度"
      title_en: The Conferral of the Actual Practice — the System of the Four Initiations
      table:
        headers: [灌顶, 目标, 关键]
        rows:
          - name: "(1)忍可灌顶"
            name_en: (1) The acquiescence initiation
            goal: 破根本无明
            goal_en: breaking through fundamental ignorance
            key: "约十人中八人被「踢出去」重修"
            key_en: "of about ten people, eight are 'kicked out' to start over"
          - name: "(2)行者灌顶"
            name_en: (2) The practitioner initiation
            goal: "证初果.寻生命原形"
            goal_en: "realizing the first fruit, seeking the original shape of life"
            key: "通过后取得正式「行者」资格"
            key_en: "passing it grants the formal status of a 'practitioner'"
          - name: "(3)进阶灌顶"
            name_en: (3) The advanced initiation
            goal: "能所合一.破我法二执"
            goal_en: "uniting perceiver and perceived, breaking the clinging to self and to dharmas"
            key: 成就四智
            key_en: the accomplishment of the four wisdoms
          - name: "(4)高阶灌顶"
            name_en: (4) The higher initiation
            goal: "能所双泯.入法界"
            goal_en: "the extinction of both perceiver and perceived, entering the dharmadhātu"
            key: "「照见根性,能所双泯」=「照见五蕴皆空」"
            key_en: "'illuminating the faculties, the extinction of both perceiver and perceived' = 'seeing that the five aggregates are all empty'"
    - title: "三摩呬多.三摩钵底.三摩地"
      title_en: "Samāhita, Samāpatti, Samādhi"
      table:
        headers: [名相, 梵语, 定位, 操作要点]
        rows:
          - name: 三摩呬多
            name_en: samāhita
            sanskrit: Samahita
            position: "入定前.专注调心"
            position_en: "before entering concentration; focused settling of the mind"
            operation: "粗住->细住->欲界定。排除妄想执著"
            operation_en: "coarse abiding → fine abiding → the desire-realm concentration. Excluding delusions and attachments."
          - name: 三摩钵底
            name_en: samāpatti
            sanskrit: Samapatti
            position: "以观导定.定慧双运"
            position_en: "guided by contemplation toward concentration; concentration and insight in tandem"
            operation: "勘定三界定。须善知识勘定"
            operation_en: "certifying the concentrations of the three realms. It requires certification by a good teacher."
          - name: 三摩地
            name_en: samādhi
            sanskrit: Samadhi
            position: "究竟.心一境性.海印三昧"
            position_en: "ultimate; one-pointedness; the ocean-seal samādhi"
            operation: "出入自在。破法执我执"
            operation_en: "entering and emerging at will. Breaking the clinging to dharmas and to self."
      note: |
        术语说明: 「三摩地」(samadhi)标准译语为「等持」,「三摩钵底」(samapatti)标准译语为「等至」。大华严寺官方资料中的配对与此恰好相反——此系道场自身的术语使用习惯。
      note_en: |
        On the terms: the standard rendering of samādhi is "equipoise" (dengchi), and of samāpatti "attainment" (dengzhi). The pairing in the Dahuayan Temple's official materials is exactly the reverse—this reflects the tradition's own usage.

classical_foundations:
  title: "古典义理地基 — 杜顺和尚五教止观"
  title_en: The Classical Doctrinal Foundation — the Venerable Dushun's Five Teachings of Calming and Contemplation
  description: |
    华严初祖杜顺大师所立五教止观,是华严宗禅观的古典义理框架。海云和上的四种观法是实际操作体系,五教止观则是其背后的意识状态分类学——二者构成「行」与「解」的互补关系。
  description_en: |
    The five teachings of calming and contemplation established by the great master Dushun, the first patriarch of Huayan, form the classical doctrinal framework of Huayan meditation. Master Haiyun's four contemplations are an operational system; the five teachings of calming and contemplation are the classification of the states of consciousness underlying them—the two form a complementary relation of "practice" and "understanding."
  entries:
    - name: "一.法有我无门(小乘教)"
      name_en: "I. The gate of dharma-exists-self-does-not (the Hīnayāna teaching)"
      content: "破除「我执」,体悟我空,但法执犹存。对应四禅八定。"
      content_en: "Breaks the clinging to self and realizes that self is empty, yet the clinging to dharmas remains. It corresponds to the four dhyānas and eight concentrations."
      hy_mapping: "在海云体系中对应: 资粮道阶段的基本停心功夫。"
      hy_mapping_en: "In Haiyun's system this corresponds to: the basic mind-stopping work of the path of accumulation."
    - name: "二.生即无生门(大乘始教)"
      name_en: "II. The gate of arising-is-non-arising (the initial Mahāyāna teaching)"
      content: "体悟「法空」——外境皆由阿赖耶识变现。"
      content_en: "Realizes the emptiness of dharmas—the external world is all transformed and manifested by ālayavijñāna."
      hy_mapping: "在海云体系中对应: 唯心识观——「知唯是心」的义理背景。"
      hy_mapping_en: "In Haiyun's system this corresponds to: the consciousness-only contemplation—the doctrinal background of 'knowing that it is only mind.'"
    - name: "三.事理圆融门(大乘终教)"
      name_en: "III. The gate of the interpenetration of principle and phenomena (the final Mahāyāna teaching)"
      content: "空有不二,理事圆融无碍。"
      content_en: "Emptiness and existence are non-dual; principle and phenomena interpenetrate without obstruction."
      hy_mapping: "在海云体系中对应: 真如实观——理(真如)与事(五蕴流转)融合的义理背景。"
      hy_mapping_en: "In Haiyun's system this corresponds to: the suchness reality contemplation—the doctrinal background in which principle (suchness) and phenomena (the flow of the five aggregates) are fused."
    - name: "四.语观双绝门(大乘顿教)"
      name_en: "IV. The gate of the cutting off of both speech and observation (the sudden Mahāyāna teaching)"
      content: "言语道断,心行处灭。"
      content_en: "The path of speech is cut off and the place of mental activity is extinguished."
      hy_mapping: "在海云体系中对应: 奢摩他观——「舍意识」「能所双泯」的义理背景。"
      hy_mapping_en: "In Haiyun's system this corresponds to: the śamatha contemplation—the doctrinal background of 'relinquishing the mental consciousness' and 'the extinction of both perceiver and perceived.'"
    - name: "五.华严三昧门(一乘圆教.究竟)"
      name_en: "V. The gate of the Huayan samādhi (the one-vehicle perfect teaching, ultimate)"
      content: "见法界缘起之相——万象影现,一即一切、圆融无碍。此即海印三昧。"
      content_en: "Sees the marks of the dependent origination of the dharmadhātu—the myriad things appear like reflections, one is all, perfectly interpenetrating without obstruction. This is the ocean-seal samādhi."
      hy_mapping: "在海云体系中对应: 正行究竟——三摩地.海印三昧.法界三观现前.42位圆满。"
      hy_mapping_en: "In Haiyun's system this corresponds to: the ultimate actual practice—samādhi, the ocean-seal samādhi, the threefold vision of the dharmadhātu manifesting, and the completion of the forty-two stations."

xianshou_wujiao:
  title: "贤首五教仪 — 华严判教: 小.始.终.顿.圆"
  title_en: "The Xianshou Five-Teaching Liturgy — the Huayan Doctrine of Classifying Teachings: Hīnayāna, Initial, Final, Sudden, and Perfect"
  description: |
    贤首五教仪由华严三祖法藏(贤首国师)创立,清续法大师集大成,是华严宗判教理论的核心框架。海云继梦和上称判教为「文化解剖学」——将印度佛教文明基因与中国文明基因进行重组的方式。五教与杜顺五教止观一一对应: 小教(法有我无门).始教(生即无生门).终教(事理圆融门).顿教(语观双绝门).圆教(华严三昧门)。法师于2008年5月19日至7月17日在台北讲授《贤首五教仪—法界观》,可确认至少53集。播客音频于2020年3月9日前后由「海云继梦法师讲经」频道集中上传至Spotify/Apple Podcast等平台。
  description_en: |
    The Xianshou five-teaching liturgy was founded by Fazang (the Xianshou National Master, third patriarch of Huayan) and brought to completion by the Qing master Xufa; it is the core framework of Huayan's doctrine of classifying teachings. Master Haiyun Jirong calls doctrinal classification "cultural anatomy"—a way of recombining the civilizational gene of Indian Buddhism with that of Chinese civilization. The five teachings correspond one-to-one with Dushun's five teachings of calming and contemplation: the Hīnayāna (the gate of dharma-exists-self-does-not), the initial (arising-is-non-arising), the final (the interpenetration of principle and phenomena), the sudden (the cutting off of both speech and observation), and the perfect (the Huayan samādhi). From 19 May to 17 July 2008 the Master taught the Xianshou Five-Teaching Liturgy and the Vision of the Dharmadhātu in Taipei, in at least fifty-three confirmed lectures. Around 9 March 2020 the podcast audio was uploaded in a batch by the "Master Haiyun Jirong's Lectures" channel to Spotify, Apple Podcasts, and other platforms.
  table:
    headers: [五教, 核心义理, "海云法师判摄", 修证品数]
    rows:
      - name: 小教
        name_en: the Hīnayāna teaching
        theory: |
          只说人空,不明法空。依六识三毒建立染净根本。
          「如木作灰,如色归空,断烦恼障,灭分段死」
        theory_en: |
          Speaks only of the emptiness of the person, not the emptiness of dharmas. It establishes the root of the defiled and the pure on the six consciousnesses and the three poisons.
          "Like wood turning to ashes, like form returning to emptiness: cutting the afflictions obstruction and extinguishing the delimited births and deaths."
        interpretation: "封闭型心态,只执一法门。总相念=始教十回向"
        interpretation_en: "A closed mentality, clinging to a single dharma-gate. The total-mark contemplation equals the initial teaching's ten dedications."
        grades: "—"
        grades_en: —
      - name: 始教
        name_en: the initial teaching
        theory: |
          分空始教(般若)与相始教(唯识)。说一切皆空或分别诸法性相。定性二乘不成佛
        theory_en: |
          Divided into the emptiness-initial (Prajñā) and the mark-initial (Yogācāra). It says all is empty, or discriminates the natures and marks of dharmas. The fixed-nature two vehicles do not attain buddhahood.
        interpretation: "「如镜离垢,如月出云,断二障,灭二死,显二空,证二果」"
        interpretation_en: "'Like a mirror freed of grime, like the moon emerging from clouds: cutting the two obstructions, extinguishing the two deaths, revealing the two emptinesses, and realizing the two fruits.'"
        grades: 十二品
        grades_en: twelve grades
      - name: 终教
        name_en: the final teaching
        theory: |
          说如来藏随缘成阿赖耶识。定性二乘.无性阐提悉当成佛。少说法相,广说真性
        theory_en: |
          Says the tathāgatagarbha arises according to conditions into ālayavijñāna. The fixed-nature two vehicles and the icchantikas without a nature all become buddhas. It speaks little of dharma-marks and extensively of the true nature.
        interpretation: "「如器成金,如冰即水」——将事相会归于理体,大乘至极之说"
        interpretation_en: "'Like a vessel forged into gold, like ice turning to water'—gathering the phenomenal into the substance of principle, the ultimate expression of the Greater Vehicle."
        grades: 四十二品
        grades_en: forty-two grades
      - name: 顿教
        name_en: the sudden teaching
        theory: |
          一念不生,即名为佛。唯是一念,无时可说。无明不起时即无时空;无明起时便有三大阿僧祇劫
        theory_en: |
          When not a single thought arises, that is called buddhahood. It is but a single moment, with nothing temporal to be said. When ignorance does not arise there is no time or space; when ignorance arises there are the three great incalculable eons.
        interpretation: "「如狂迷歇,如睡梦觉」——一切烦恼本来自离,不是烦恼缠你,是你招揽烦恼。关键: 置心一处"
        interpretation_en: "'Like ceasing to be mad and deluded, like waking from sleep and dream'—all afflictions are inherently absent; it is not that afflictions entangle you, but that you summon them. The key: setting the mind in one place."
        grades: 五十二品
        grades_en: fifty-two grades
      - name: 圆教
        name_en: the perfect teaching
        theory: |
          一切即一,一即一切。念劫圆融,自在无碍。一位即一切位,十信满心即摄五位成正觉。依普贤法界,性相圆融,主伴无尽
        theory_en: |
          All is one and one is all. Moment and eon interpenetrate, free and unobstructed. One station is all stations; completing the tenth stage of faith encompasses the five stations in attaining enlightenment. Relying on the Samantabhadra dharmadhātu, nature and marks interpenetrate, principal and attendants without end.
        interpretation: "「如拆棉花,如融金狮」——不破而圆融,一切时分同时具足。初住至妙觉,三地超顿教妙觉"
        interpretation_en: "'Like teasing apart cotton, like the molten golden lion'—perfectly fused without breaking, all times simultaneously complete. From the first abiding stage to the wonderful enlightenment; the third ground surpasses the sudden teaching's wonderful enlightenment."
        grades: 六十二品
        grades_en: sixty-two grades
  gradual_vs_sudden:
    title: "渐教.顿教的实践义 — 从判教到操作"
    title_en: The Practical Meaning of the Gradual and Sudden Teachings — from Classification to Operation
    content: |
      海云和上将判教转化为实际操作: 渐教(始教+终教)——次第修证路线,对应四种观法中的唯心识观->真如实观->毗婆舍那观,一级一级深入。顿教——「一念不生,即名为佛」「唯是一念,无时可说」。关键操作: 置心一处——守住风门(或佛号.咒语.数息),其他六尘境界一概不理,「能置心一处,一切烦恼自然离开」。顿教与始教.终教的根本区别: 小教与始教都在「无明的前提下」讲时间与次第;顿教直接告诉你无明不起时,即无时间可得——这是大脑想象不到.言语道断的境界。
      出处: 海云继梦《贤首五教仪—法界观》第40-45集(2008.7.8-7.10)
    content_en: |
      Master Haiyun turns the doctrinal classification into actual operation: the gradual teaching (the initial plus the final)—a sequential path of cultivation, corresponding to the consciousness-only → suchness reality → vipaśyanā contemplations among the four, advancing level by level. The sudden teaching—"when not a single thought arises, that is called buddhahood"; "it is but a single moment, with nothing temporal to be said." The key operation: setting the mind in one place—guard the wind gate (or the buddha-name, a mantra, or breath-counting) and pay no attention whatsoever to the other objects of the six sense-fields; "if you can set the mind in one place, all afflictions naturally leave." The fundamental difference between the sudden and the initial/final: the Hīnayāna and initial teachings both speak of time and sequence "under the premise of ignorance"; the sudden teaching tells you directly that when ignorance does not arise, there is no time to be had—a state the thinking mind cannot imagine and speech cannot convey.
      Source: Haiyun Jirong's Xianshou Five-Teaching Liturgy and the Vision of the Dharmadhātu, lectures 40-45 (8-10 July 2008)
  source: |
    出处: 海云继梦 2008年台北《贤首五教仪—法界观》53集+ . https://www.listennotes.com/podcasts/海云继梦法师讲经-播客/ . https://open.spotify.com/show/2ZDlq4cOOiynQvlzPARkmc . 续法《贤首五教仪》原著

yicheng_bieyuan:
  title: "一乘不共别圆 — 普贤乘的判教定位"
  title_en: "The One-Vehicle Unshared Specifically-Perfect Teaching — the Doctrinal Position of the Samantabhadra Vehicle"
  description: |
    「一乘不共别圆」是华严宗对自身教义的最高定位——「别人所没有的,所以叫做『别』」。「不共」谓不与三乘共,独为圆顿大根菩萨所说;「别圆」指有别于天台宗以《法华》为圆教的立场,华严自许为最圆满的别教一乘。海云和上特别强调: 这种不共别圆的特质不在理论层面,而在行法的内在蕴藏——「他在经文里头表达得很清楚,但是因为你不懂这种语言模式跟思维模式,所以你以为经文好像讲故事一样讲过去。」
  description_en: |
    "The one-vehicle unshared specifically-perfect teaching" is Huayan's highest self-designation of its own doctrine—"what others do not have is called 'specific.'" "Unshared" means not shared with the three vehicles, spoken uniquely for bodhisattvas of perfect and sudden great faculties; "specifically-perfect" means it differs from the Tiantai school's position of taking the Lotus as the perfect teaching—Huayan regards itself as the most complete specifically-different one-vehicle teaching. Master Haiyun stresses in particular: this unshared, specifically-perfect character lies not on the level of theory but in the inner reserve of the practice—"it is all expressed very clearly in the scriptures, but because you do not understand this mode of language and this mode of thought, you take the scriptures to be merely told like a story."
  table:
    headers: [概念, 定位, 特点]
    rows:
      - name: 别教一乘
        name_en: the specifically-different one-vehicle
        position: "《华严经》——纯圆至实,别于三乘"
        position_en: "The Avatamsaka Sūtra—purely perfect and supremely real, differing from the three vehicles."
        features: |
          智俨《孔目章》:「别教者,别于三乘故。」法藏《五教章》: 分「性海果分」(佛自证,不可说)与「缘起因分」(普贤境界,可说)
        features_en: |
          Zhiyan's Kǒumù chapter: "The specifically-different is so called because it differs from the three vehicles." Fazang's Chapter on the Five Teachings divides it into "the fruit-division of the sea of nature" (the Buddha's own realization, ineffable) and "the cause-division of dependent arising" (the Samantabhadra realm, expressible).
      - name: 同教一乘
        name_en: the common one-vehicle
        position: "《法华经》——会三归一,摄末归本"
        position_en: "The Lotus Sūtra—gathering the three into the one, drawing the branches back to the root."
        features: "智俨: 开三乘方便显一乘真实。法藏判同教一乘较别教一乘低一位,因须「会三归一」方显一乘"
        features_en: "Zhiyan: open the expedients of the three vehicles to reveal the reality of the one vehicle. Fazang judges the common one-vehicle one station lower than the specifically-different one-vehicle, because it must 'gather the three into the one' to reveal the one vehicle."
  puxian_interpretation: |
    海云和上以「普贤乘」名其体系——此即华严别教一乘的实践展开。法师在《四十华严讲记》第68讲中指出: 「普贤乘」的关键在直接兑现,非如三乘出离需次第渐修——「能观心即生成报身(文殊),所观心则生成法身(普贤),置心一处可滋长法身慧命。」并强调此不共别圆的特质不在理论,而在行法的内在蕴藏——「他在经文里头表达得很清楚,但是因为你不懂这种语言模式跟思维模式,所以你以为经文好像讲故事一样讲过去。」[语境: 2009年《四十华严》第68讲,台北]
  puxian_interpretation_en: |
    Master Haiyun names his system the "Samantabhadra Vehicle"—this is the practical unfolding of Huayan's specifically-different one-vehicle teaching. In lecture 68 of his Commentary on the Avatamsaka in Forty Fascicles the Master points out that the key of the "Samantabhadra Vehicle" lies in immediate fulfillment, not, as with the three-vehicle renunciation, in gradual step-by-step cultivation—"the observing mind generates in this very life the reward body (Mañjuśrī), while the observed mind generates the dharmakāya (Samantabhadra); setting the mind in one place can nourish the life and wisdom of the dharmakāya." He further stresses that this unshared, specifically-perfect character lies not in theory but in the inner reserve of the practice—"it is all expressed very clearly in the scriptures, but because you do not understand this mode of language and this mode of thought, you take the scriptures to be merely told like a story." [Context: 2009, Avatamsaka in Forty Fascicles, lecture 68, Taipei]
  source: |
    出处: 智俨《华严经孔目章》.法藏《五教章》.海云继梦《四十华严讲记》第68讲 . 《华严学报》第3期(2012)

important_texts:
  - name: "法藏《华严金师子章》 — 十门妙诠华严法界玄奥"
    name_en: "Fazang's Chapter on the Golden Lion — Ten Gates Wonderfully Expounding the Mysteries of the Huayan Dharmadhātu"
    content: |
      《金师子章》是华严三祖法藏为武则天讲解华严奥义之作——以殿中金狮子为喻,从明缘起.辨色空.约三性.显无相.说无生.论五教.勒十玄.括六相.成菩提.入涅槃十门,仅约一千五百字,妙诠华严法界玄奥。海云继梦和上于2006年在台北开示,共14集。后由空庭书苑整理出版为《华严金师子章讲记》(265页,2010年出版)。讲记逐字稿于2013年11月由fjdh.cn(佛教导航)集中发布。

      核心判摄: 十段分三——(1~3)缘起/色空/三性=基础理论 (4~5)无相/无生=般若空性 (6)五教=判教入华严 (7)十玄=事事无碍最高境界 (8)六相=综合圆融(初地) (9)成菩提=二次圆融 (10)入涅槃=三次圆融,重重无尽。

      十玄门要义: 同时具足相应门(金体与师子相同时成立).因陀罗网境界门(一一毛处各有金师子,重重无尽,一即一切).十世隔法异成门(九世融于一念)。

      修行三区块: 凡夫区(变异念->善恶念->净识念).行者区(初果向到破我法二执).法身区(根本智->后得智->自受用->他受用)。法师强调:「知道不算,做到才算。」

      出处: 海云继梦《华严金师子章讲记》(空庭书苑 2010) . http://wuming.xuefo.net/nr/7/70462.html . https://www.got1shop.com/mobile/index.php?m=default&c=goods&a=index&id=3459706
    content_en: |
      The Chapter on the Golden Lion was composed by Fazang, the third patriarch of Huayan, to expound the profound meaning of Huayan for Empress Wu Zetian—taking the golden lion in the hall as its metaphor. In ten gates—clarifying dependent origination, discerning form and emptiness, approaching the three natures, revealing the signless, expounding non-arising, discussing the five teachings, setting forth the ten mysterious gates, encompassing the six characteristics, accomplishing bodhi, and entering nirvāṇa—it runs only about fifteen hundred characters, wonderfully expounding the hidden wonder of the Huayan dharmadhātu. Master Haiyun Jirong lectured on it in Taipei in 2006 in fourteen episodes; the lectures were edited and published by Kōngtíng Shūyuàn as Lectures on the Huayan Chapter on the Golden Lion (265 pages, 2010). The verbatim transcripts were released in a batch by fjdh.cn (Buddhist Navigation) in November 2013.

      Core discernment: the ten sections fall into three—(1-3) dependent origination / form and emptiness / the three natures = basic theory; (4-5) the signless / non-arising = Prajñā emptiness; (6) the five teachings = doctrinal classification entering Huayan; (7) the ten mysterious gates = the supreme state of unobstructed interpenetration of phenomena; (8) the six characteristics = an integrated perfection (the first ground); (9) accomplishing bodhi = a second integration; (10) entering nirvāṇa = a third integration, layer upon layer without end.

      The gist of the ten mysterious gates: the gate of simultaneous and complete correspondence (the gold substance and the lion's form are established together); the gate of the realm of Indra's net (each hair bears a golden lion, layer upon layer without end, one being all); the gate of the ten times separated and differently accomplished (the nine times fused into a single thought).

      The three zones of practice: the ordinary zone (transforming thoughts → wholesome and unwholesome thoughts → pure discerning thoughts); the practitioner zone (from approaching the first fruit to breaking the clinging to self and dharmas); the dharmakāya zone (fundamental → subsequent wisdom, then self-enjoyment → enjoyment for others). The Master stresses: "Knowing does not count; doing is what counts."
  - name: "澄观《心要法门》 — 「至道本乎其心,心法本乎无住」"
    name_en: "Chengguan's Essential Gates of the Mind — 'The supreme path is rooted in the mind, and the dharma of the mind is rooted in non-abiding'"
    content: |
      《心要法门》是华严四祖清凉澄观大师(738-839)所撰,全文仅数百字,阐述「至道本乎其心,心法本乎无住」的华严心法核心要义——无住心体是华严禅观的终极归趣。海云继梦和上以现代语言逐段译解,出版为《解心: 心要法门讲记》(空庭书苑 2001年6月30日初版, ISBN 9573067129, 326页; 宗教文化出版社 2005年9月简体版, 187页)。

      核心思想: 「无住心体」——真心不执著于任何一处,灵知不昧,性相寂然,包含德用,该摄内外。能证此者,即入法界。「心法本乎无住」——一切心法的根本在于无住,无住即不执取,不执取即解脱。

      海云法师判摄: 此即华严禅观的终极指向——四种观法(唯心识->真如实->毗婆舍那->奢摩他)层层深入,最终所证即是此「无住心体」。「无心于万物,而万物未尝无」——不是消灭万物,而是于万物中不执取,此即事事无碍法界的日常体现。

      法师后续出版《是心,非心,还是心!——从心要法门谈心》(空庭书苑 2013, ISBN 9789867484710),进一步深化「无住心体」与华严禅观修行次第的内在关联。

      出处: 海云继梦《解心: 心要法门讲记》(空庭书苑 2001/宗教文化出版社 2005) . https://www.buybook.tw/book-0010164666.htm . https://webpac.taichung.gov.tw/bookDetail/730070
    content_en: |
      The Essential Gates of the Mind was composed by Chengguan (738-839), the Qingliang Great Master and fourth patriarch of Huayan. The whole text runs only a few hundred characters, expounding the core meaning of the Huayan mind-dharma—"the supreme path is rooted in the mind, and the dharma of the mind is rooted in non-abiding"—namely that the non-abiding mind-substance is the ultimate goal of Huayan meditation. Master Haiyun Jirong interpreted it section by section in modern language, published as Unraveling the Mind: Lectures on the Essential Gates (Kōngtíng Shūyuàn, first edition 30 June 2001, ISBN 9573067129, 326 pages; Religious Culture Press, mainland simplified edition September 2005, 187 pages).

      Core thought: the "non-abiding mind-substance"—the true mind does not cling to any single place; its numinous knowing is never obscured, its nature and marks are serene, it contains all attributes and functions, and gathers within and without. One who realizes this enters the dharmadhātu. "The dharma of the mind is rooted in non-abiding"—the root of all mind-dharmas lies in non-abiding; non-abiding is non-grasping, and non-grasping is liberation.

      Master Haiyun's discernment: this is the ultimate orientation of Huayan meditation—the four contemplations (consciousness-only → suchness reality → vipaśyanā → śamatha), each layer deepening, finally realize precisely this "non-abiding mind-substance." "With a mind free of the myriad things, yet the myriad things have never been absent"—not the destruction of things, but non-grasping within them; this is the daily embodiment of the dharmadhātu of unimpeded interpenetration of phenomena.

      The Master later published Is It Mind, Not-Mind, or Still Mind?!—On the Mind from the Essential Gates (Kōngtíng Shūyuàn 2013, ISBN 9789867484710), further deepening the inner connection between the "non-abiding mind-substance" and the sequence of Huayan meditation practice.
  - name: "华严三品行法 — 净行品·梵行品·普贤行愿品"
    name_en: "The Practice of the Three Huayan Chapters — the Pure Practice Chapter, the Brahmā Practice Chapter, and the Samantabhadra Practice and Vows Chapter"
    content: |
      据《华藏妙海》听经笔记整理,海云和上将华严三品对应修行三阶段: 净行品——前行阶段的修行法门,信位菩萨所修,在日常生活中即可修; 梵行品——正行阶段的修行法门; 普贤行愿品——成佛以后的修学法门,「众生有尽,我愿无穷」。三品都是行门,构成从初学到究竟的完整行法链条。

      结界工程(据同来源): 结界是针对自己弱点,在自己能力范围内做最妥善的调整与安排,是个人修行资粮道的基础。从结界中可以学到如何肯定自己、认识自己——「结界工程是个人资粮道的基础」。

      出处: 《华藏妙海》听经笔记整理版(docs/notes4it目录)。
      弥勒菩萨章: 海云和上于善财五十三参第51参详讲弥勒菩萨——毗卢遮那庄严藏楼阁,共12集视频(B站 BV1X142147EN)+播客(Podwise)。此为法师关于弥勒的最主要讲记,目前文字整理尚不完整,建议直接观看视频。
    content_en: |
      Compiled from the lecture notes of the Huazang Miaohai, Master Haiyun maps the three Huayan chapters onto the three stages of practice: the Pure Practice chapter—the practice of the preliminary stage, cultivated by bodhisattvas at the stage of faith, practicable in everyday life; the Brahmā Practice chapter—the practice of the actual stage; and the Samantabhadra Practice and Vows chapter—the study and practice after attaining buddhahood, "though beings be exhausted, my vows are endless." All three chapters are practices, forming a complete chain of practice from the beginner to the ultimate.

      The bounded-practice project (from the same source): bounding one's practice is to address one's own weaknesses, making the most fitting adjustment and arrangement within one's own capacity; it is the foundation of an individual's path of accumulation. From bounding one's practice one learns how to affirm and know oneself—"the bounded-practice project is the foundation of an individual's path of accumulation."
      The Maitreya chapter: in the fifty-first visit of Sudhana's fifty-three, Master Haiyun lectured in detail on Maitreya—the tower of the majestic treasury of Vairocana—in twelve video episodes (Bilibili BV1X142147EN) plus a podcast (Podwise). This is the Master's most substantial lecture on Maitreya; the textual transcription is still incomplete, so it is recommended to watch the videos directly.

verification:
  title: "贯穿全程 — 验证机制.关键原则"
  title_en: Throughout the Whole Path — the Verification Mechanism and Key Principles
  sections:
    - title: "验证机制 — 200+测验 & 归零重修"
      title_en: The Verification Mechanism — 200+ Tests and Reset-and-Restart
      content: |
        法师强调修行进程「绝对理性」「不能讲人情」: 全程设有两百余种具体测验——制造顺境诱发贪着反应、制造逆境激发嗔心反应。

        失败重修的规则极为严格: 并非退回上一级,而是打回初信(初果)从头开始——「四果再重修,就从这个地方开始,再从初果开始。」
      content_en: |
        The Master stresses that the course of practice is "absolutely rational" and "shows no favoritism": throughout it there are more than two hundred specific tests—creating favorable conditions to trigger the clinging reaction, and adverse conditions to provoke the aversion reaction.

        The rule for failing and restarting is extremely strict: one does not fall back a single level but is sent all the way back to the first stage of faith (the first fruit) to begin again—"if the fourth fruit is to be practiced again, one starts from this point, again from the first fruit."
    - title: 三大关键原则
      title_en: The Three Key Principles
      content: |
        (1)不走四禅八定: 法师称其为「共外道法」——「我们不走那条路,我们直接走出三界。」[语境: 2009年《四十华严讲记》第67讲]

        (2)大脑临界点: 置心一处之前可运用理性思维;一旦跨过初果门槛,必须弃用概念思维——「只要用大脑,初果进不去,就这么简单。」[语境: 2009年《四十华严讲记》第67讲]

        (3)两种歧路: 置心一处后产生「舒服.喜悦.轻安」或「恐惧」。若被执取,两种都会导向外道禅——必须连这类感受也一并放下。
      content_en: |
        (1) Do not walk the path of the four dhyānas and eight concentrations: the Master calls it "a dharma shared with the non-Buddhist schools"—"we do not take that path; we go straight out of the three realms." [Context: Commentary on the Avatamsaka in Forty Fascicles, 2009, lecture 67]

        (2) The brain's threshold point: before setting the mind in one place, rational thought may be used; once one crosses the threshold of the first fruit, conceptual thinking must be abandoned—"if you use the brain, you cannot enter the first fruit; it is that simple." [Context: 2009, lecture 67]

        (3) The two wrong turnings: after setting the mind in one place there arise "comfort, joy, ease" or else "fear." If grasped, both lead to the meditation of the non-Buddhist schools—one must let go even of these feelings.

