sections:
  - id: xinfa
    title: 心法模式
    icon: ❤️
    intro: |
      海云继梦法师的「心法」体系以澄观《心要法门》「至道本乎其心，心法本乎无住」为根基，
      以「置心一处」为总纲，以「自观活心」为核心方法。
      区分「大脑思惟」与「生命思惟」——前者属识性分别，后者是法身慧命的启用。
    quotes:
      - text: |
          「至道本乎其心，心法本乎无住。无住心体，灵知不昧。」
        source: 澄观《心要法门》· 海云继梦《解心·心要法门讲记》(宗教文化出版社, 2005)
        context: 华严四祖澄观原著，海云法师逐段现代阐释。全书326页(台版)/187页(简体版)。
        links:
          - "空庭书苑 2001年初版 ISBN 9573067129"
      - text: |
          「置心一处之心与处，必须愈专且范围愈小愈好，成就即大也愈殊胜。」
        source: "[心法 置心一处之「心」与「处」](http://wuming.xuefo.net/nr/6/59565.html)"
        context: 解释「置心一处」的技术面操作——先「找心」(确定心放在哪)，再「定位」(确定所缘处)。
      - text: |
          「若心他缘即是大脑起用；而心定不动则是生命起用，法身发芽矣！」
        source: "[心法 心定不动生命起用](http://www.wmxf.net/nr/6/59618.html)"
        context: 关键分判——大脑思惟(心他缘)vs生命思惟(心定不动)，后者是法身慧命滋长的起点。
      - text: |
          「自观心乃是活人之计，非枯木禅之所能知。禅之所以活人、觉人，自在里许。
          故经文谓：『成就慧身不由他悟』，唯是此活人之计耳！」
        source: "[心法 自观活心](http://www.wmxf.net/nr/6/59622.html)"
        context: 「活人」vs「枯木」——自观心是让心活起来的法门，非死守枯坐。
      - text: |
          「置心一处实是将心安住于心所……若此心纯以注意力安住，而不起意识分别(余思杂觉)，
          唯是安住而已——则将由此安住而起生命改造工程的进程；
          而此工程将不经八识等之作用，是乃法身慧命得以滋长耶！」
        source: "[心法 置心一处](http://wuming.xuefo.net/nr/6/59566.html)"

  - id: sichenbading
    title: 四禅八定
    icon: 🧘
    intro: |
      海云继梦将「四禅八定」定位为**世间禅的根本味禅**(三品十二门)——
      是出世间善法之所依，但非究竟。若耽著禅味而无觉性，则堕「禅定窟」成天魔外道。
      核心判摄: 「不向四禅八定去，要向念头处看。」
    quotes:
      - text: |
          「若未臻置心一处或直上四禅八定，皆非上菩提道！
          唯真能止住妄念，又能活心、自观心、入菩萨学处，乃真禅人也！」
        source: "[止住妄念，自观活心](https://www.sushimei.com/tags/35178.html)"
        context: 四禅八定若不结合活心自观，不能上菩提道。
      - text: |
          「若息心入定，则不能观心；此乃超入禅定与径入法界之别！」
        source: "[华严禅前行概论 捌·无尽的超越](http://wuming.xuefo.com/nr/7/70374.html)"
        context: 全书最核心的分判——息心入定(入色界天)vs 活心入法界(菩萨道)。
      - text: |
          「息心入定之定功固可嘉，然于息心之同时即不置心一处矣！
          如欲置心于一处必须先能制心也；而于制心时，乃调心至活其心，不使其心乱缘尘境，
          方有生命观境之可言。否则，若制心至息心，则心死意亡……
          此时，尘境无用矣，死心不可用也，故曰入定去矣！」
        source: 同上
        context: 详细解释为何息心入定(四禅八定)不能观心——心死意亡则无法进行生命观境。
      - text: |
          「要修学到初禅定，即使你很用功，差不多也要三年的时间。」
        source: "[华严禅前行概论 捌](http://wuming.xuefo.com/nr/7/70374.html)"
        context: 初禅定是「了生死出三界」不可逾越的基础。
      - text: |
          「进入初禅定……这个触功德就叫做初禅的特相……他定了五个标准:
          心一境性(置心一处)，然后会产生寻、伺、喜、乐。」
        source: "[禅观 第九集](http://read.goodweb.top/news/news_view.asp?newsid=60398)"
        context: 初禅五觉支的技术面描述。
      - text: |
          「十二门禅就是四禅八定，从四禅定到四空定之间，
          要再修慈·悲·喜·舍四无量心。」
        source: "[华严禅前行概论 捌](http://wuming.xuefo.com/nr/7/70374.html)"
        context: 四禅八定的系统结构——三品十二门。
      - text: |
          「杂讯与贪心重的学员常堕四禅八定，无法觅本根源，反堕外道禅的范畴。」
        source: "[直接从欲界出三界](http://wuming.xuefo.net/nr/6/59098.html)"

  - id: yoga
    title: 瑜伽行法
    icon: 🕉️
    intro: |
      海云继梦将「瑜伽行派」(Yogācāra)译为「禅观正行」——
      「瑜伽行的完整翻译应称禅观正行，古云相应行」。
      2008年底，法师自称通过惹查西牟尼灌顶接回**大乘瑜伽行法(Maha Yogachar)**，
      将其作为贤首宗的核心修行体系。瑜伽行法的关键是——
      「根性即prana，放任根性作用而不作意压抑」。
    quotes:
      - text: |
          「瑜伽行的完整翻译应称『禅观正行』，古云『相应行』有几分神似，
          重点是在系统教学的指导下，每一个步骤所呈现的相应效果，故云相应。」
        source: "[瑜伽行与禅观正行](http://wuming.xuefo.com/nr/6/59391.html)"
      - text: |
          「根性即prana，其行法的第一步即放任根性的作用而不作意压抑，
          任令根性带动身体的自由活动，直到压抑的根性能量释放完毕，
          『能观心』就能观『所观心』。」
        source: "[瑜伽行派的传承(心能观身)](https://www.fjdh.cn/wumin/2013/09/083454285947.html)"
      - text: |
          「此正行中的前奏亦有三: 一、呼吸法。二、体位法。三、左右呼吸法。
          经此三部分的前奏之后，闭眼静坐，令身心分开；
          此一步骤的重点在眼闭静观，以静心去感觉身体的微动，而后令身自然而动，
          行者不用意志去加以压抑、控制或操纵！」
        source: "[瑜伽行的教学体系: 约事之二](http://wuming.xuefo.com/nr/6/59385.html)"
      - text: |
          「瑜伽行法的进程，我们称之为『探空』的教学体系，或探空方程式。
          此即华严三段教学法中的第二段: 正行，证空性的教学系统。」
        source: "[瑜伽行的教法: 约理](https://www.fjdh.cn/wumin/2013/09/081851285942.html)"

  - id: sanskrit_terms
    title: 梵汉术语比对
    icon: 📝
    intro: |
      海云继梦法师在教学中常将核心术语进行梵文(Sanskrit)与中文的对照辨析。
      以下辑录其关键术语比对——正法(Dharma) vs 心法(Moksha)、
      般若(Prajñā) vs 般那(Prāṇa/Ānāpāna)、三摩地(Samādhi)等。
      每一个术语均注明了法师本人的定义和出处。
    quotes:
      - text: |
          「法(Dharma)与解脱(Moksha)是截然不同的。
          在『说法』的范围里皆属资粮道，而『解脱』则属行法。」
        source: "[心法 经典法本与行法](http://wuming.xuefo.net/nr/6/59614.html)"
        context: 正法(学佛认知)≠解脱(生命改造实践)——阿难多闻即正法者但未解脱之例
      - text: |
          「佛法中内明的认知与内明的实践——
          内明的认知属于正法(Dharma)，一般所谓的『学佛』即是，
          它是认知红尘的人生与涅槃之存在，属于观念上的感悟，
          对于『道』圣谛知道而未能做到。

          内明的实践乃是心法或(Moksha)，即是『修行』，
          是一项真正的生命改造工程，此一工程暨精且密，
          有赖于系统的科班训练与指导。」
        source: 同上
        context: Dharma=认知层面「知道」, Moksha=实践层面「做到」
      - text: |
          「若唯般那之法，为外道之四禅八定；
          若唯般若之法，则为正法非心法。
          故心法必般那与般若二法并举不偏废也。」
        source: 同上
        context: 核心判摄——般那(定)与般若(慧)必须双运，单修任一皆非心法(不解脱)
      - text: |
          「讲心法乃就约『般那』而言，讲内明则是约『般若』言。
          激发、成长般那与般若的『般那工程、般若工程』，
          可谓华严禅观之双璧。」
        source: 同上
        context: 般那工程=定学(内摄·法界系统), 般若工程=慧学(内观·法身系统)
      - text: |
          「安那般那(Ānāpāna)——安那(ānā)=入息, 般那(āpāna)=出息。
          东汉安世高译为『安般守意』: 安为定, 般为莫使动摇,
          守意为莫使乱意也。安般守意名为, 御意至得无为也。」
        source: "《禅修正行——「安那般那」数息观》(空庭书苑 2015, ISBN 9789867484895) + 安世高译《安般守意经》"
        link_book: https://play.google.com/store/books/details?id=mnf6CgAAQBAJ
        context: 六妙门(数随止观还净)以 Ānāpāna 为体——安那(入)·般那(出)——「般那」一词从此来
      - text: |
          「三摩地(Samādhi)——玄奘大师译为『心一境性』，
          是能所交融、定慧等持的境界。进入三摩地之前的阶段
          称为『止/止息』(Śamatha)。
          华严禅观中的『入定』即『入三昧』，入三昧即
          『出三界，入法界』，透过海印三昧展现佛陀在菩提树下
          所证得的华严境界。」
        source: "[心法 入定与定中见](http://wuming.xuefo.net/nr/6/59579.html) + 综合华严禅前行概论"
      - text: |
          「心法之心非心意识之心，而是真心之法。
          欲修行解脱道者于此必须有明确之认识，不可滥也！」
        source: "[心法 经典法本与行法](https://www.fjdh.cn/wumin/2013/09/181114286325.html)"


  - id: three_paths
    title: 三条路径的总判摄
    icon: 🔀
    intro: |
      这是海云继梦体系中最核心的修行路径分判——
      三条从欲界出离的路径，判然有别:
    quotes:
      - text: |
          路径一·共外道禅(四禅八定): 挤到禅定里面去→入色界天/无色界天。
          若没有觉性，就落入「禅定窟」，成为天魔外道。

          路径二·不共外道禅(有止无定): 不必有禅定，但必须有「止」的功夫。
          「止」不等于「定」——带着觉性，不陷入禅定窟，从欲界直接出三界。

          路径三·活心入法界(菩萨道): 「若息心入定则不能观心；
          此乃超入禅定与径入法界之别。」活心自观心→入法界大门→菩萨学处(初果至四果)。
        source: 综合自以上各篇，为海云法师反复阐述的核心框架
        context: 三条路径的关键区别——「不向四禅八定去，要向念头处看」

