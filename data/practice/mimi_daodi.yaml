sections:
- id: mm_overview
  title: 名相辨析 · 密宗·金刚乘·真言宗·唐密·东密·台密·藏密
  icon: 🔐
  intro: '「密宗」是汉语世界对这一传统的统称，梵语原词「金刚乘」(Vajrayāna)强调「金刚不坏、方便迅疾」的修证特质；
    「真言宗」是日本空海所创宗派的正式名称；「唐密」专指盛唐善无畏、金刚智、不空建立的汉传密教；
    「东密」是日本真言宗别称（因以京都东寺为根本道场），与「台密」（天台宗所传密法）相对举；
    「藏密」泛指藏传佛教中的金刚乘修法体系。

    本页循此脉络，从印度「杂密→纯密」的演变、开元三大士的汉传法脉、空海东传日本的东密一系、
    藏传金刚乘的独立发展，到民国以来的回传复兴与当代「显密圆融」——九个维度彼此交织、互相印证。
    凡引文均注明出处链接，供读者据原文复核。'

  topics:
  - title: 七个名相的语义边界
    body: '**密宗·金刚乘·真言宗·唐密·东密·台密·藏密**七个称谓各有侧重，不可混用：

      - **密宗**：汉语世界统称，宽泛指一切以真言、陀罗尼、灌顶、坛城为特质的佛教传统；

      - **金刚乘**(Vajrayāna)：梵语原词，突出「金刚不坏、方便迅疾」的修证特质，西方学界与藏传语境常用；

      - **真言宗**：日本空海所创宗派的正式名称，以「真言」(mantra) 为核心修法；

      - **唐密**：专指盛唐时期善无畏、金刚智、不空（「开元三大士」）建立、后在中土失传的汉传密教；

      - **东密**：日本真言宗别称，因空海以京都东寺为根本道场得名；与天台宗所传的「台密」相对举；

      - **藏密**：泛指藏传佛教中的金刚乘修法体系（宁玛·噶举·萨迦·格鲁诸派所共）。

      **值得注意**：宽旭法师受访时曾指出，唐代及之前汉地即称「密宗」，并无「汉密」「藏密」之分——「今天大家就是为了区别，好像就是有汉密，有藏密……其实最早的时候没有」。（原话见2016年凤凰佛教专访。）'
    source: 《密宗全方位研究.md》· 凤凰佛教专访宽旭法师(2016-12)
    links:
      专访实录: https://shanxifojiao.com.cn/index.php?a=index&aid=2389&c=View&m=home
  - title: 「Vajrayāna」作为学术分类的方法论审慎
    body: '西方学界近年对「Vajrayāna」这一分类术语本身存有方法论上的审慎——因其具体所指在不同文献与传统中并不完全一致（西方密教研究起步较晚，谭崔文献浩繁却缺乏系统整理，加之秘密传授的性质使修行者不愿透露来源，研究门槛极高）。

      **公认的奠基性研究**：罗纳德·戴维森(Ronald M. Davidson)《印度密教：谭崔运动的社会史》(2002) 与《西藏文艺复兴》(2005)；米兰达·萧(Miranda Shaw)《热情的证悟：密教中的女性》(1995) 从性别研究切入，获学界多项奖项。

      「Vajrayāna」能否准确统摄唐密、东密、藏密等具体传统，至今仍是开放讨论——本页各节并列呈现不同视角，不作裁断。（此即原研究文档「附：存疑与延伸问题」所列条目之一。）'
    source: 《密宗全方位研究.md》第八章 · Davidson 2002/2005 · Shaw 1995
    links:
      研究文档: docs/密宗全方位研究.md

- id: mm_india
  title: 印度渊源
  icon: 🌏
  intro: '密教在印度的形成经历了从「杂密」到「纯密」的漫长渐进过程；
    「两部大法」（《大日经》《金刚顶经》）的出现标志着系统化密教的成熟，
    而密教自身的传法谱系则将源头追溯至龙树开塔亲受密法的「铁塔传说」。'
  topics:
  - title: 从杂密到纯密 — 两部大法的成立
    body: '**原始佛教时期**：《长阿含经》《中阿含经》记载佛陀曾开许持诵善咒治疗蛇毒、齿痛、腹痛等病苦，《杂阿含经》亦有佛陀为舍利弗说毒蛇护身咒的记载；但咒语真正的源头在婆罗门教，佛陀在世时基本禁止咒语进入佛教教说，僧团对此保持相当的警惕。部派时期犊子部将各类真言密咒结集为「明咒藏」，四世纪左右出现专说咒法的独立经典《孔雀明王经》——此一阶段咒语应用零散、不成体系，称「**杂密**」。

      **七世纪纯密**：印度大乘佛教进入全盛期，密教结合大乘哲学精粹、以真言陀罗尼为中心发展为「**纯密**」。标志性事件是两部大法先后出现：

      - 《**大日经**》——成立于中印度，「胎藏界」曼荼罗的根据经典，理论被认为「可能承自《华严经》的法界思想」；

      - 《**金刚顶经**》——稍晚出现、流行于南印度，传自瑜伽行派，以「五相成身观」为核心，是「金刚界」曼荼罗的根据经典。

      二者教主皆为大日如来（法身毗卢遮那佛），与显教诸经不同。**注意**：这一「纯密」体系在印度本土存续时间不长「不久即告消灭」，反而是东传日本（唐密→东密）与北传西藏的两支分流各自延续了更长的生命力。'
    source: 《密宗全方位研究.md》第二章 2.1 节
    links:
      研究文档: docs/密宗全方位研究.md
  - title: 龙树、龙智 — 密教祖师叙事
    body: '密教自身的传法谱系将**龙树**尊为密法重要传承环节——相传龙树于南印度**铁塔开塔**，从金刚萨埵处亲受密法，传予**龙智**(Nāgabodhi)，龙智又传予金刚智，开启密教东传中国的法脉。空海《御请来目录》即记：「昔金刚萨埵亲受遍照如来，数百岁后授龙猛菩萨，龙猛菩萨授龙智阿阇梨，龙智阿阇梨授金刚智阿阇梨。」

      **学术审慎**：「龙树开塔」在教内被视为金刚乘传承合法性的根本依据，但其历史真实性在现代学术考证中难以坐实——宜将其理解为密教自身的传法神话（教内视角），而非可资严格历史考订的事件（学术视角）。这与「龙树亦为八宗共祖」的现象一脉相承：几乎每一个后起的大乘宗派，都倾向于将法脉上溯至这位「第二代释迦」。'
    source: 《密宗全方位研究.md》第二章 2.2 节 · 空海《御请来目录》(CBETA T2161)
    links:
      御请来目录: https://deerpark.app/cbeta/T2161

- id: mm_lineage
  title: 汉传法脉 · 唐密的建立与式微
  icon: 🏛
  intro: '唐玄宗开元年间「开元三大士」相继入华，共同奠定汉传密教（唐密）的基础；
    一行与惠果完成「两部一具」的义理与仪轨集大成；
    而会昌法难之后，唐密在中土究竟是一次性中断、还是渐进衰亡，学界至今仍有讨论。'
  topics:
  - title: 开元三大士 — 善无畏、金刚智、不空
    body: '唐玄宗开元年间，三位印度密教高僧相继入华，史称「**开元三大士**」，共同奠定汉传密教（唐密）的基础：

      - **善无畏**(Śubhakarasiṃha，637-735)：出身中印度王族，以八十高龄于开元四年(716)抵达长安，玄宗礼为国师；翌年奉诏与弟子一行合作译出《大日经》（《大毗卢遮那成佛神变加持经》），开元二十三年(735)示寂，世寿九十九，葬龙门西山广化寺；

      - **金刚智**(Vajrabodhi，669-741)：出身南印度摩赖耶国婆罗门家庭，十岁于那烂陀寺出家，此后数十年间广学声明、因明、律学、中观（《般若灯论》《百论》《十二门论》）乃至瑜伽行教典（依止胜贤论师习《瑜伽论》《唯识论》《辩中边论》三年）——这段学历说明密教在印度本就建立在显教义学之上；三十一岁起依止龙树弟子**龙智**七年，习得《金刚顶瑜伽经》等密法及五部灌顶。开元七年(719)经海路抵广州，723年开始译出《金刚顶经》系列，将「金刚界」法门系统传入中国；与善无畏恰各携一部大法入华（善无畏陆路、金刚智海路），后世常以此并举为「开中国两部密法之始祖」。741年圆寂于返印途中的洛阳广福寺，塔建于龙门奉先寺；

      - **不空**(Amoghavajra，705-774)：狮子国（今斯里兰卡）人，十四岁在爪哇随金刚智出家，720年随师入华。金刚智圆寂后，奉遗命远赴天竺、师子国求法三年，从「普贤阿阇梨」（传统上认定即龙智）处重受五部灌顶，746年携大量梵本返回长安，此后系统译出《金刚顶经》全帙，历事玄宗、肃宗、代宗三朝，封「大唐智藏」国师，774年圆寂，与鸠摩罗什、真谛、玄奘并称「中国佛教四大译经家」。

      **当代节点**：1988年11月15日，中日佛教界于龙门为善无畏、金刚智举行「显彰碑」揭幕，碑文由时任中国佛教协会会长赵朴初书丹；2009年「开元三士纪念堂」在洛阳广化寺落成，2015年正式开幕。'
    source: 《密宗全方位研究.md》第三章 3.1 节 · 百度百科「善无畏」「金刚智」「不空」
    links:
      唐密·百度百科: https://baike.baidu.com/item/%E5%94%90%E5%AF%86/5338474
  - title: 一行与惠果 — 唐密的义理与仪轨集大成
    body: '**一行**(683-727)：俗名张遂，出身没落的初唐世族，因父母双亡出家于嵩山普寂门下，后师事善无畏，担任《大日经》汉译笔受，并独力撰成二十卷《大日经疏》，是理解唐密教义体系最核心的注释文献；同时是唐代第一流的天文学家、数学家，主持修订《大衍历》，其学术生涯本身即是「显密兼通、佛学与世学并重」的例证。日本真言宗列其为「付法八祖」之一。

      **惠果**(746-805)：九岁于昙贞门下学法、慈恩寺受具足戒，十七岁起从不空亲承金刚界密法——「我之法教，汝其兴之也」一语即出自不空对他的这段早年托付；另于二十二岁从善无畏弟子**玄超**处受学胎藏界密法——换言之，惠果「两部一具、金刚不二」是分别承接不空（金刚界）与玄超（胎藏界）**两条师承**、在自身一人身上完成合流，而非直接同时受教于善无畏、金刚智。惠果此后住长安青龙寺东塔院，历任代宗、德宗、顺宗三朝国师，日本真言宗自身传承谱系中列其为「付法八祖」第七祖（空海为第八祖）。他的声誉在空海到来之前已远播海外——建中元年(780)即有爪哇僧人辨弘、次年新罗僧人惠日相继前来求法，门下弟子据载多达千余人。'
    source: 《密宗全方位研究.md》第三章 3.2 节
    links:
      研究文档: docs/密宗全方位研究.md
  - title: 会昌法难与唐密中断 — 「一次性断裂」还是「渐进衰亡」
    body: '公元845年唐武宗「**会昌法难**」重创佛教诸宗。唐密因高度依赖长安、洛阳的都城译场与坛场建制，受创尤为严重，法脉自此在中土基本中断——仅部分密法元素（如楞严咒、大悲咒）融入汉传日常课诵延续至今。

      **两种说法并存（本页并列不作定论）**：

      ① **法难一次性中断说**：通行说法，认为会昌法难直接导致唐密断绝；

      ② **渐进衰亡说**（学术补充意见）：惠果门下义操一系付法阿阇梨灌顶位者史载多达一百一十二人，且惠果再传弟子**智慧轮**在会昌法难之后（咸通六年，865年）仍在长安传法，仍有日本真言宗僧人专程入唐向其求授密法——说明唐密衰亡更可能是延续数代、渐进的过程；宋代「瑜伽密法」的复兴迹象亦为旁证。'
    source: 《密宗全方位研究.md》第三章 3.3 节
    links:
      研究文档: docs/密宗全方位研究.md

- id: mm_doctrine
  title: 核心教义体系
  icon: ⚖
  intro: '两部曼荼罗、三密相应、即身成佛、阿字观、灌顶——密宗教义的核心不是一套纯思辨体系，
    而是「理」（教理）与「事」（仪轨实修）高度一体化的架构。
    本节并置教理定义与教界内部立场（如印光大师对「即身成佛」的审慎提醒），供读者多视角参看。'
  topics:
  - title: 两部曼荼罗与六大四曼
    body: '**胎藏界**曼荼罗依《大日经》而立，以「菩提心为因，大悲为根本，方便为究竟」为宗要，喻示众生本具的清净菩提心犹如胎儿在母胎、莲花种子蕴含于花中，尚待大悲哺育、次第开显；**金刚界**曼荼罗依《金刚顶经》而立，以「五相成身观」为核心，强调心识本具的坚固不坏、能摧破一切烦恼的智慧。

      空海将二者关系概括为「**色心不二，金胎为一**」：胎藏界代表「色法」（五大：地水火风空），金刚界代表「心法」（识），二者共同构成宇宙万有的「**六大**」（地水火风空识）；众生心中本自具足六大，与大日如来体性无别——由此展开「六大无碍常瑜伽、四曼不离、三密加持」的教理架构。'
    source: 《密宗全方位研究.md》第四章 4.1 节
    links:
      研究文档: docs/密宗全方位研究.md
  - title: 三密相应与三密加持
    body: '密宗修行的核心法门是「**三密加持**」：行者以手结印契（**身密**）、口诵真言（**语密**）、意观本尊（**意密**），三业与本尊佛的身口意三密相应，借助如来的加持力（「加」）与行者自身的信心（「持」）相互作用，最终达成「佛智证悟」。

      空海在《即身成佛义》中以「三密加持速疾显」一语概括此一法门效验迅捷之特质。

      法门修学的前提（教界共识）：须「通达显教、打好大乘基础」，方可「选择明师、得灌顶、坚守三昧耶戒」——这一「先显后密」的次第观，是密宗区别于可自行阅经修习的显教诸宗的制度性特征。'
    source: 《密宗全方位研究.md》第四章 4.2 节 · 空海《即身成佛义》
    links:
      研究文档: docs/密宗全方位研究.md
  - title: 即身成佛 — 三层次与教界的审慎态度
    body: '「**即身成佛**」是密宗最鲜明的教义标签，唐密传统内部对其含义有精细的三层区分：

      - **理具成佛**（依「体大」六大而说）：众生本来理具的成佛可能性；

      - **加持成佛**（依「相大」四曼而说）：依灌顶加持而获得的成就；

      - **显得成佛**（依「用大」三密相应而说）：真正现前证得的佛果。

      三者之中，唐密祖师明确「所求的不是理具成佛，也不是加持成佛，而在于显得成佛」——真实的、现证的成佛，而非仅止于理论上的「本来是佛」。《大日经》本身也强调此速疾法门仍须以无量劫积累的功德智慧为基础。

      **教界内部的审慎提醒**（印光大师，详见「修行界视角」节）：「密宗现身成佛，或云即生成佛，此与禅宗见性成佛之话相同，皆称其工夫湛深之谓，不可认做真能现身成佛。须知现身成佛，唯释迦牟尼佛一人也。」'
    source: 《密宗全方位研究.md》第四章 4.3 节 · 印光《复周志诚居士书》
    links:
      印光文钞原文: http://www.wmxf.net/nr/26/261087.html
  - title: 阿字观 — 一个具体的修行法门
    body: '东密传统中最具代表性、至今仍在实际教授的一项具体禅观法门是「**阿字观**」——以梵文悉昙体「阿」(अ) 字为所观对象，观想其安住于月轮之中、莲花之上，藉由体认「阿」字所表「本不生」（诸法本来不生不灭）之义，与大日如来的法身境界相应。此法根本依据出自《大日经》。

      **学术考订（学术视角）**：教内相传阿字观为空海直接传授，但学界认为它作为一套完整成型、可供次第操作的观修体系，更可能是在平安时代末期经**觉鑁**(1095-1143)等人系统整理、至镰仓时代才最终定型（日文维基百科「阿字観」条即持此说：实际并非空海以来直传，「平安末期の興教大師覚鑁の著作をもとにして鎌倉時代から始まった」）。这与本系列「一空到底」所述「五重唯识观」归于窥基名下、却也历经后世层累整理的情形，构成一组相似的「祖师托名」案例。

      **当代实践**：阿字观在当代日本并未局限于寺院秘传，多座真言宗寺院常年开设面向一般信众乃至游客的体验课程；2020年新冠疫情期间部分寺院转为线上教授——是密教古老观修法门因应时代持续调适的实例。'
    source: 《密宗全方位研究.md》第四章 4.4 节 · 日文维基百科「阿字観」
    links:
      日文维基·阿字観: https://ja.wikipedia.org/wiki/%E9%98%BF%E5%AD%97%E8%A6%B3
  - title: 灌顶 — 从三昧耶戒到传法阿阇梨位
    body: '「**灌顶**」(abhiṣeka) 是密法修习的必经门槛，梵藏原意为「授权」，兼含传法、加持、净化三重意涵。

      - 唐密胎藏界灌顶分三部（事业、秘印、心授），金刚界灌顶分五部（另加光明、甘露）；

      - 藏密无上瑜伽部则有宝瓶、秘密、智慧、胜义四级灌顶，其中最高层级「智慧灌顶」涉及气脉明点、双运次第之说，历来是藏密教义中争议最集中、也最容易被误解或滥用的部分。

      教界内部的共识是：未经如法灌顶、未受持相应密乘戒律者，不得擅自修习相关法门——「没得灌顶的不是密宗弟子」。「选择明师、得灌顶、坚守三昧耶戒」缺一不可，这一严格的师承要求正是密宗区别于可自行阅经修习的显教诸宗的制度性特征。'
    source: 《密宗全方位研究.md》第四章 4.5 节
    links:
      研究文档: docs/密宗全方位研究.md

- id: mm_overseas
  title: 域外传播 · 东密的建立
  icon: 🗺
  intro: '空海入唐求法，于青龙寺在短短三个月内尽得两部大法——这一师承史实以《御请来目录》等原始文献存世；
    东密此后以高野山为总本山延续千余年，是四地密教法脉中传承最完整的一支。'
  topics:
  - title: 空海入唐求法 — 三月尽得两部大法
    body: '**空海**(774-835)出身四国赞岐国豪族，804年随遣唐使团（与日后创立天台宗的最澄同船）渡海入唐，历经风浪漂流至福州登陆，辗转抵达长安，初住西明寺。805年于青龙寺东塔院拜谒惠果——此时距惠果圆寂已不足数月，尽管惠果门下不乏追随十年、二十年的资深弟子，他却依空海《御请来目录》所述：

      「和尚乍见含笑，喜欢告曰：我先知汝来，相待久矣，今日相见大好大好。报命欲竭，无人付法，必须速辨香花，入灌顶坛。」

      随后「六月上旬入学法灌顶坛，是日临大悲胎藏大曼陀罗，依法抛花，偶然著中台毗卢遮那如来身上，阿阇梨讚曰不可思议不可思议，再三讚叹，即沐五部灌顶……七月上旬更临金刚界大曼荼罗，重受五部灌顶，亦抛花得毗卢遮那……八月上旬亦受传法阿阇梨位之灌顶。」——**短短三个月**，空海完成胎藏、金刚两部大法及传法阿阇梨位灌顶，惠果赐名「遍照金刚」，后世视投花连中中台大日如来为殊胜法缘的印证，惠果之托付亦被视为「预见到唐密在中土的命运、而将法脉重心转向东瀛」的深具历史意味的抉择。

      806年空海携216部561卷佛典及大量法器画像归国，翌年编成《请来目录》进献天皇；823年获赐东寺为专修密教之根本道场，日本真言宗自此确立，因以东寺为发祥地而称「**东密**」，与天台宗自身所传密法「**台密**」相对举。'
    source: 《密宗全方位研究.md》第五章 5.1 节 · 空海《御请来目录》(CBETA T2161)
    links:
      御请来目录全文: https://deerpark.app/cbeta/T2161
      七祖惠果与空海大师: https://www.fjdh.cn/wumin/2009/04/17030262163.html
  - title: 东密与台密的分野
    body: '东密与台密同源于唐代密教，但在修法侧重与门规上存在差异——据部分教内文献记载，「观想跟实践双修法」在东密门规中被严格禁止（违者逐出宗门），唯台密与藏密在其各自体系中保留相关修习。

      这一差异与东密「六大四曼三密」的独立教理架构有关：东密以自身「极密」概念安立最高修证层级，其阐释路径不同于藏密对应「无上瑜伽部」的独立名目体系——两个传统在最高阶密法的具体内容与教理框架上，实际存在相当程度的独立发展，而非简单的同源分支关系。'
    source: 《密宗全方位研究.md》第五章 5.2 节
    links:
      研究文档: docs/密宗全方位研究.md
  - title: 高野山真言宗的当代存续
    body: '空海晚年于高野山创建金刚峰寺作为真言宗根本道场，835年圆寂于此，谥号「弘法大师」。此后千余年间高野山真言宗持续运作、未曾中断，是四地密教法脉中传承最完整、制度最健全的一支，至今仍是日本重要的宗教文化中心与阿阇梨培育机构。

      **当代实例**：本系列已详述的**成观法师**（详见「修行界视角」节）于1991至1996年间在高野山完成六年修学，1996年8月8日入坛受金胎两部大法「传法灌顶」，得「三国传灯真言宗第五十三世阿阇梨」位——这是「东密」法脉在当代汉语世界延续的具体例证。'
    source: 《密宗全方位研究.md》第五章 5.3 节 · 大毘卢寺官方资料
    links:
      遍照院·大毘卢寺: https://www.abtemple.org/index.php?information_id=9&route=information%2Finformation&store=2

- id: mm_tibetan
  title: 藏传金刚乘的独立发展
  icon: 🏔
  intro: '与前弘期「师君三尊」奠基、朗达玛灭佛的百年黑暗期、后弘期新译诸派的繁盛——
    藏传密教发展出比汉传更系统化的「四部密续」分类（事·行·瑜伽·无上瑜伽），
    是今日全球影响力最大的密教形态。'
  topics:
  - title: 寂护、莲花生与桑耶寺 — 前弘期的奠基
    body: '约八世纪中叶，吐蕃赞普赤松德赞迎请印度论师**寂护**入藏，因显教义理难以应对苯教徒诘难一度被迫离藏；寂护临行前建议迎请精通密法的**莲花生**前来助阵。莲花生降伏本土苯教神祇与反对势力，与寂护共同创建西藏第一座佛教寺院**桑耶寺**，剃度首批七名藏族僧人（「七觉士」），三人合称「**师君三尊**」。莲花生所传密法自成一体，后世宁玛派尊其为「释迦牟尼第二」、宗派鼻祖，「宁玛」（古旧）之名即因该派恪守前弘期旧密咒传承而得名。

      **学术性提醒**：现代学术考证指出，寂护与莲花生传入西藏的密法因后世传承一度断绝，其原始面貌「现今已不可知」，学者仅能依据二人与「开元三大士」大致同时的年代背景，推测其所传或与胎藏界、金刚界系统有关，但无法确证。此外，关于莲花生的身份，也有学者（学术考辨视角）依据早期史料指出，他很可能并非受具足戒的比丘、而更接近维摩诘式的在家密行者，后弘期大量「伏藏」（埋藏经典）文献中的莲花生传记对此往往有所模糊处理——这是「教内圣传」与「史料考辨」相互张力的又一案例。'
    source: 《密宗全方位研究.md》第六章 6.1 节
    links:
      研究文档: docs/密宗全方位研究.md
  - title: 朗达玛灭佛与传承的隐没
    body: '九世纪中叶，赞普朗达玛发动大规模灭佛运动，寺院被毁、经典被焚、僧团被迫还俗或遭杀害，西藏佛教陷入长达百年的「黑暗期」，正规僧团一度在藏地绝迹。

      但密法咒语因其修持方式相对隐蔽、不完全依赖寺院建制，仍得以在民间以更隐秘的方式延续——宁玛派也正因此在这一断裂期中地位相对提升，成为连接前弘期与后弘期的重要纽带。'
    source: 《密宗全方位研究.md》第六章 6.2 节
    links:
      研究文档: docs/密宗全方位研究.md
  - title: 后弘期 — 四部密续与九乘三部体系
    body: '后弘期以来，印度晚期无上瑜伽部密续陆续传入西藏，形成「**新译派**」，主要分化为噶当、噶举、萨迦三大主流，后起的格鲁派综合前人传统成为最强盛的一支。

      与汉传/东密以「事、理、行、证」为主轴的教理框架不同，藏传密教发展出更系统化的「**四部密续**」分类（事部、行部、瑜伽部、无上瑜伽部），其中无上瑜伽部被视为即身成佛的究竟次第，以《密集金刚》《胜乐金刚》《喜金刚》《时轮金刚》等续典为核心，涉及气脉明点、生起圆满二次第等精深修法。宁玛派另有「**九乘三部**」独立判摄体系（显三乘、外密三乘、内密三乘），将「大圆满」法门安立于九乘之顶。

      **宋代遗憾**：曾有少量无上瑜伽部密续（如《密集金刚》《大威德金刚》等）经法天、天息灾、施护等译师传入中国，北宋一度出现「开灌顶道场」「水陆道场」盛况，但北宋天禧元年朝廷曾明令禁止《频那夜迦成就仪轨经》编入大藏经，此后无上瑜伽部密法在明代以后即「不再有太大影响」，未能像藏地那样发展为完整体系。'
    source: 《密宗全方位研究.md》第六章 6.3 节
    links:
      研究文档: docs/密宗全方位研究.md
  - title: 藏密与东密的教理比较
    body: '东密与藏密虽同源于印度晚期大乘密教，却各自独立发展出不同的教理重心：

      - **东密**：以空海所立「付法八祖」为传承脉络，根本经典限于《大日经》《金刚顶经》两部大法，教理架构止于事·行·瑜伽三部对应层级，「极密」概念并不直接对应藏密「无上瑜伽部」的独立名目；

      - **藏密**：完整继承事·行·瑜伽·无上瑜伽四部体系，将无上瑜伽部的气脉明点、双运次第明确列为究竟法门。

      有藏传学者据此对东密的完整性提出质疑；也有比较研究指出，唐密最高经典《理趣经》虽在理论上论及「以五毒烦恼成就佛果」的甚深见地，但相应的饮血尊/亥噜迦本尊体系与配套实修法门，在唐密传统中始终「有理论而无实践」——这一比较说明「密宗」并非内部高度统一的单一体系，汉传（唐密/东密）与藏传在教理完整度与实修法门的具体展开上存在实质差异，不宜简单等量齐观。'
    source: 《密宗全方位研究.md》第六章 6.4 节
    links:
      研究文档: docs/密宗全方位研究.md

- id: mm_revival
  title: 近代复兴运动
  icon: 📜
  intro: '密教在中土沉寂近千年后，近代复兴与法相唯识复兴几乎同步展开，同样发端于杨仁山金陵刻经处一脉的余绪——
    王弘愿、大勇、持松东渡重续唐密，大勇继而转向藏密、法尊接棒入藏——
    「东密路径」与「藏密路径」在具体人物的生命历程中常常相互交织、彼此转化。'
  topics:
  - title: 王弘愿与权田雷斧 — 东密回传的开端
    body: '杨仁山入室弟子桂伯华于清末即已东渡日本学习密法，开风气之先。1924年，广东潮州居士**王弘愿**翻译日本真言宗丰山派大僧正**权田雷斧**的著作并邀其来华，权田雷斧以七十九岁高龄亲赴潮州为王弘愿等人灌顶授法；翌年王弘愿亲赴日本修习密法，成为民国时期最早取得东密传承的中国居士之一。

      **原始文献**：权田雷斧《示王弘愿居士文》存世（佛教导航收录），其中溯传法谱系「始自法身如来，今及愚衲四十八代」，并感叹中华「自嫡流涨日东，渐次颓微，乃至明全灭」，而「今王弘愿居士……深信密教，于中华民国重兴密教」。王弘愿1926年受金胎两部普门传灯大阿阇梨传法灌顶，回国后建「震旦密教重兴会」，当时有人称他「当代复兴唐密第一人」。'
    source: 《密宗全方位研究.md》第七章 7.1 节 · 权田雷斧《示王弘愿居士文》(fjdh.cn)
    links:
      示王弘愿居士文: https://www.fjdh.cn/wumin/2009/05/07062180231.html
      民国唐密回传史述: http://ifo.ifeng.com/44991877/news.shtml
  - title: 大勇、持松 — 留日学密与「贤密初祖」
    body: '继王弘愿之后，僧侣中赴日求法者渐多，最具代表性的是**大勇法师**与**持松法师**——二人于民国初年同赴日本高野山学习密法，皆获阿阇梨位，1924年归国后在上海、杭州、武汉等地大力弘传，「社会人士趋之若鹜」。

      **持松法师**(1894-1972)尤为突出：三度留学日本，学通显密，1953年在上海静安寺创立真言宗道场，被尊为「**唐密复兴初祖**」。其著述横跨密教与显教：密教方面有《密宗通关》《大日经·住心品撰注》《金刚大教王经疏》《即身成佛》等，显教方面涉及《摄大乘论义记》《心经阐秘》《华严宗教义始末记》等——这种「一身兼弘密教、唯识、般若、华严」的广博学风，与当代成观法师、海云继梦法师的多宗兼弘取向形成跨越近一个世纪的呼应。持松尤其撰有《**贤密教衡**》，专论华严（贤首宗）与密教义理的会通关系，是「密教与华严融合」这一当代命题最早的近代先声。'
    source: 《密宗全方位研究.md》第七章 7.2 节 · 维基百科「释持松」
    links:
      释持松·维基百科: https://zh.wikipedia.org/wiki/%E9%87%8A%E6%8C%81%E6%9D%BE
      民国唐密回传史述: http://ifo.ifeng.com/44991877/news.shtml
  - title: 从东密到藏密 — 大勇的转向与法尊的接棒
    body: '**大勇法师**的经历尤具历史转折意味：他与持松同赴日本习得东密阿阇梨位后，转而认为藏传密法更为究竟完整，遂率领「**入藏学法团**」西行求法，试图直接向西藏本土传承取经——这与本系列「一空到底」所述法尊法师系统翻译藏传中观应成典籍的历史，实为同一场求法运动的一体两面。

      大勇法师1929年病逝于西康打箭炉（今四川康定），未能抵达拉萨；其未竟之志由团中的**法尊法师**继承完成——法尊其后在拉萨依止安东格西钻研显密教法，与太虚大师1931年创办的**汉藏教理院**相呼应，成为二十世纪汉语世界最重要的藏传佛学翻译家之一。

      一位法师从东密转向藏密、客死途中，另一位法师接棒完成入藏求法之志——「东密路径」与「藏密路径」并非截然分离的两条平行线，而是常常在具体人物的生命历程中相互交织、彼此转化。'
    source: 《密宗全方位研究.md》第七章 7.3 节
    links:
      研究文档: docs/密宗全方位研究.md

- id: mm_modern
  title: 当代发展
  icon: 🌐
  intro: '法门寺地宫曼荼罗的考古发现、宽旭法师重赴高野山回传法脉、
    西方学界的密教研究兴起、藏传佛教的全球传播——唐密、东密、藏密在当代的命运各不相同。'
  topics:
  - title: 法门寺地宫曼荼罗 — 唐密复兴的考古学基础
    body: '1987年，陕西扶风**法门寺地宫**出土大批唐代宫廷密教法器与曼荼罗遗存。据《法门寺地宫唐密曼荼罗之研究》（吴立民主编）等研究，整个地宫在封闭时被布置为**供养佛指舍利的唐密曼荼罗**：地宫总体为舍利供养大曼荼罗，佛指舍利为三昧耶曼荼罗，供养法器为法曼荼罗，如法供养即羯磨曼荼罗；后室八重宝函四十五尊造像为金刚界成身会曼荼罗，捧真身菩萨莲台座錾刻金胎二界融合的大曼荼罗。

      地宫安奉与空海当年携归日本、至今仍存东寺的「御请来品」在样式工艺上高度吻合，为唐密的历史实存提供了直接考古学证据。已故中国佛教协会会长赵朴初、西安大兴善寺已故住持界明老和尚均是唐密复兴运动的重要推动者。

      **学术争论并存**：亦有学者（如罗炤）认为地宫并非曼荼罗，而是按帝陵墓室规格构建的佛塔地宫——两说并存，本页如实并列。'
    source: 《密宗全方位研究.md》第八章 8.1 节 · 中国文化研究院·法门寺唐密曼荼罗
    links:
      法门寺唐密曼荼罗: http://chiculture.org.hk/sc/china-five-thousand-years/3650
      地宫与唐密: http://tangmi7.com/digong.php?id=7
  - title: 宽旭法师 — 唐密法脉重续祖庭（2015-2016）
    body: '当代唐密「回传」最具象征意义的最新节点发生在2015至2016年间：西安大兴善寺方丈、青龙寺住持**宽旭法师**亲赴日本高野山求法。

      据中国西藏网专访报道（2016年12月）：宽旭法师1997年任青龙寺住持时即发愿「回传中华」；2015年5月赴高野山作修法准备，2016年1月在高野山管长中西启宝大阿阇梨门下「得度」，2016年5月起集中学习，先受戒、经21天四度加行前行、再经整整100天四度加行正行修习，掌握了十八道、金刚界、胎藏界、护摩等所有咒语、手印（咒语300多条、手印180多个）；**2016年11月3日得授传法阿阇梨位灌顶**，成为「唐密复兴第一代阿阇梨」。

      这与成观法师1996年在同一座高野山获阿阇梨位，构成跨越二十年、分别由大陆及台湾教界人士完成的两次「法脉回传」具体案例。'
    source: 《密宗全方位研究.md》第八章 8.2 节 · 中国西藏网/凤凰财经报道(2016-12-27)
    links:
      凤凰财经专访: https://finance.ifeng.com/a/20161227/15106165_0.shtml
      澎湃新闻转载: https://m.thepaper.cn/newsDetail_forward_1588151
  - title: 西方学界的密教研究
    body: '西方学界对密教/金刚乘的系统研究起步较晚，方法论上存在公认困难：谭崔经典文献浩繁却缺乏系统整理；秘密传授的性质使许多修行者不愿透露信息来源；该传统横跨多个文化与语言脉络、研究门槛极高。

      尽管如此，已形成公认的奠基性著作：**罗纳德·戴维森**(Ronald M. Davidson)《印度密教：谭崔运动的社会史》(2002) 与《西藏文艺复兴：密教在藏文化重生中的作用》(2005)；**米兰达·萧**(Miranda Shaw)《热情的证悟：密教中的女性》(1995) 从性别研究角度切入密教史。此外，「Vajrayāna」这一分类术语本身在西方学界近年颇受方法论质疑，仍是开放议题。'
    source: 《密宗全方位研究.md》第八章 8.3 节
    links:
      研究文档: docs/密宗全方位研究.md
  - title: 藏传佛教的全球传播
    body: '与唐密、东密相对局限于特定地域的传承规模不同，藏传金刚乘自二十世纪中叶起借由达赖喇嘛及大批仁波切的海外弘法活动，已发展为全球范围内影响最广的密教传统——欧美各地设有大量藏传佛教中心（如格鲁派「大乘保护基金会」FPMT 在西方的连锁道场网络），成为当代西方人接触、修习金刚乘最主要的渠道。

      这也是「藏密」相较「唐密」「东密」在当代具有更强活力与更广受众的一个重要原因。'
    source: 《密宗全方位研究.md》第八章 8.4 节
    links:
      研究文档: docs/密宗全方位研究.md

- id: mm_practice
  title: 修行界与内部视角
  icon: 🧘
  intro: '以下呈现当代仍在一线弘法的法师本人对密法的直接阐释与教学实践，
    以及教界内部对密宗最具冲击力教义的审慎制衡之声——凡属教界人士本人立场或教学表述之处，均已标示出处。'
  topics:
  - title: 显密次第 — 教界对密法修学条件的共识
    body: '如「核心教义」节所述，教界内部对密法修学的门槛存在相当一致的共识——须先「通达显教、打好大乘基础」，方可「选择明师、得灌顶、坚守三昧耶戒」。这一「先显后密」「显密圆融」的次第观，是本页所论两位法师（成观、海云继梦）共同的教学取向，也是理解密宗为何始终未能像般若、唯识那样发展为可自行阅经修习之「显学」的关键。'
    source: 《密宗全方位研究.md》第九章 9.1 节
    links:
      研究文档: docs/密宗全方位研究.md
  - title: 印光大师的审慎提醒 — 「现身成佛唯释迦牟尼佛一人」
    body: '即便在教界内部，对密宗最具冲击力的「即身成佛」教义，也始终存在着源自其他宗派立场的清醒制衡之声。净土宗近代祖师**印光大师**在《复周志诚居士书》中明确告诫（原文）：

      「密宗现身成佛，或云即生成佛，此与禅宗见性成佛之话相同，皆称其工夫湛深之谓，不可认做真能现身成佛。须知现身成佛，唯释迦牟尼佛一人也。此外即古佛示现，亦无现身成佛之事。无知之人，每每错认，其失大矣。」

      印光另在《复朱南圃居士书》中警告：「若认做决定实能，则恐佛尚未成，魔已先成。」——这段告诫展示了汉传佛教内部对密教最具冲击力教义主张的清醒制衡，「内部视角」本身也并非铁板一块，而是包含着不同宗派立场之间的相互监督与审慎对话。'
    source: 《密宗全方位研究.md》第四章 4.3 节 · 印光《复周志诚居士书》(《印光大师文钞》三编) · 《复朱南圃居士书》(文钞续编卷上)
    links:
      文钞三编·复周志诚居士书: http://www.wmxf.net/nr/26/261087.html
      文钞续编·复朱南圃居士书: http://wuming.xuefo.net/nr/26/260267.html
  - title: 成观法师 — 《大日经疏》的当代讲席与东密传承
    body: '**成观法师**(1947年生)1990年前后于美国、台湾参学藏密、唐密、东密；1991年起正式进入日本真言宗总本山高野山修学，六年间辛勤往返，**1996年8月8日入坛受金胎两部大法传法灌顶**，成为「三国传灯真言宗第五十三世阿阇梨」。其台北「大毘卢寺」四楼设有「真言殿」，供奉金胎二界大日如来、准提菩萨、爱染明王等本尊，寺方自述所修法门「以禅密为主体，而兼容他宗」，每月定期举行「密一」「密三」真言法会。

      成观法师留有一部逐集讲解的《**大日经疏讲解**》（连载于佛教导航网站），是当代汉语世界少见的、对一行《大日经疏》进行系统白话阐释的公开讲席。在已公开的讲记片段中，他以颇具个人风格的方式讲述空海归国后的历史：推重惠果「预见密教命运」的智慧、盛赞空海归国后受到日本皇室礼遇的历史意义，并特别提到日本圣德太子立佛教为国教的史事，感慨「中国没有（立佛教为国教）就是了，中国比较可怜」——这一评价属其个人史观表述。他也以细致的文物鉴赏笔法，比对空海「请来品」法器与法门寺地宫出土文物的工艺细节（如「太子型柄香炉」、金刚杵内莲花纹饰），并直言当代台湾、大陆的工艺水准「反而」不及唐代原件精细——这类具体而微、带有强烈现场感的讲经风格，是成观法师区别于纯学术性密教研究的鲜明特色。

      其对「即身成佛」的阐释（第17集）：「即心是佛比较容易，即身成佛就难……身如果是佛身，里里外外都是佛」「第一个要观想自己是佛……要用佛的标准来要求自己、成就自己」。他也曾评论持松法师（密林阿阇梨）重续断了一千多年唐密法脉之功——「这本来应该是丰功伟业，很了不起的一件事情」。

      （成观法师关于空性与禅密的系统阐释，详见「一空到底」页「成观法师·空性与禅密诠释」节。）'
    source: 《密宗全方位研究.md》第九章 9.3 节 · 大毘卢寺官方资料 · 成观《大日经疏讲解》第6·10·15·17集
    links:
      大毘卢寺官方: https://www.abtemple.org/index.php?information_id=9&route=information%2Finformation&store=2
      大日经疏讲解·第10集: https://www.fjdh.cn/wumin/2013/11/125510305055.html
      大日经疏讲解·第15集: https://www.fjdh.cn/wumin/2013/11/125926305060.html
      大日经疏讲解·第17集: http://wuming.xuefo.tw/nr/7/71893.html
  - title: 海云继梦 — 「华严密法」：密与教的当代融合个案
    body: '**海云继梦法师**（华严宗第四十二世传人）名下有一套独立的「**解密**」系列著述，与其「解空」系列（《非常坛经》《非常金刚经》《非常心经》）并列，包括：《深深密——密行指引》《生命密境——曼荼罗的世界》《悠活三昧——密法修行概要》《神圣的游戏场——华严密法》《本尊曾于此——十一面观音密法》《根本佛母——准提密法（一）》等六种（空庭书苑出版）。

      海云继梦并未简单移植藏密或东密的既有体系，而是明确提出「**华严密法**」这一自创概念——将密教的曼荼罗观、本尊法（十一面观音、准提菩萨）与自身华严教理系统结合，以华严「法界缘起」的义理框架容纳、诠释密法的坛城与本尊修持。这一「以显摄密、显密一体」的处理方式，与其「教属华严，观属禅宗心法，教观双举」的整体修学架构逻辑一致——密法在其系统中被安立为「观」（实修法门）的具体展开层次。

      其《根本佛母·准提密法》论「显、密之别」（原文）：密法「一定得透过上师指导」，「若无上师，就得不到法，光有佛没有用」；而准提法重点「全在镜坛」，「镜坛代表清净，准提就是清净，自性清净心在这清净的镜面上显现时，才叫修行功夫」——「真正重要的是文字背后所代表的『状况』」。

      **思想史呼应**：「密教与华严相互融通」的思路早在持松法师《贤密教衡》已有先声，海云继梦「华严密法」可视为这一近代命题的当代延续与再创造——二者并无直接师承关系可考，宜理解为思想史意义上的呼应，而非法脉传承意义上的直接承袭。'
    source: 《密宗全方位研究.md》第九章 9.4 节 · 海云继梦《根本佛母·准提密法》(学佛网) · 空庭书苑书目
    links:
      维基百科·海云继梦书目: https://zh.wikipedia.org/wiki/%E6%B5%B7%E9%9B%B2%E7%B9%BC%E5%A4%A2
      准提密法·显密之别: http://www.wmxf.net/nr/7/69442.html
      生命密境·台大书目: https://buddhism.lib.ntu.edu.tw/search/search_detail.jsp?comefrom=authorinfo&seq=128964

- id: mm_synthesis
  title: 融合与张力
  icon: ⚖
  intro: '密教传入中国的时间晚于天台、华严两大判教体系的成立，造成「判教未能预摄」的时代错位；
    民国「密教门户」之争、与华严的会通尝试（从持松到海云继梦）——
    密宗从来不是一个封闭自足的独立体系，而是持续在与汉传既有的义理传统对话、协商、相互塑造。'
  topics:
  - title: 密教与显教判摄的时代错位
    body: '密教系统性传入中国（八世纪初）的时间点，晚于天台智顗(538-597)与华严贤首法藏(643-712)两大判教体系的成立——因此汉传佛教两大最具影响力的判教框架（天台五时八教、华严五教十宗）均未能将密教纳入其原有的义理位阶之中。

      教界文献对此直言：「以时代居先，不知将来有唐密特出，故所判教未能预摄之」「唐以后，吾华大德，又未尝以本宗纲领弘扬于世」，以至于「即号称显教大善知识，亦未能明辨」唐密的真实面目。

      这一「时代错位」造成的判教空白，某种意义上正是密教在中土始终未能像天台、华严那样获得稳固教理定位、进而更容易在会昌法难后彻底失传的深层原因之一。'
    source: 《密宗全方位研究.md》第十章 10.1 节
    links:
      研究文档: docs/密宗全方位研究.md
  - title: 显密二教的历史冲突 — 民国「密教门户」之争
    body: '近代密教回传中国的过程并非坦途：王弘愿因其传法资格问题（以居士身份传承唐密法脉）引发教界内部持续质疑，太虚大师曾予以严厉批评；「显密二教互相攻击」的局面一度令密教在中国的发展「举步为艰」；东密回流本身「因回流自日本人手中」，在民族情感复杂的民国时期也曾被官方视为禁忌。

      权田雷斧之师深知其中难处，留下「白衣传法世间希，只为支那佛法微」的诗句——情不得已之下才作权宜之计把密法传给居士王弘愿，让他担纲传法使命。

      这场围绕密教「正当性」的近代争论，与「性相之争」「空有之争」「内学院与如来藏系之争」一样，都是「佛教中国化」进程中反复出现的同一母题——一种新引入或重新引入的教法体系，如何在既有的汉传佛教格局中确立自身的合法位置。'
    source: 《密宗全方位研究.md》第十章 10.2 节 · 凤凰网·民国唐密回传史述
    links:
      民国唐密回传史述: http://ifo.ifeng.com/44991877/news.shtml
  - title: 华严与密教的会通尝试
    body: '从民国持松法师《贤密教衡》到当代海云继梦「华严密法」，「密教与华严相互融通」构成了一条跨越近一个世纪的、具体可考的思想线索。

      这一融合尝试之所以选择华严而非其他宗派作为对话对象，或许并非偶然：

      - 《大日经》「胎藏界」理论「可能承自《华严经》的法界思想」这一学术推测（见「印度渊源」节），本身即为二者的义理亲缘性提供了一定的文本基础；

      - 华严「法界缘起、事事无碍」的圆融哲学，也确实为容纳密教「坛城互摄、本尊与法界同构」的宇宙论提供了较为自然的义理接口。

       换言之，华严的「圆融」架构与密教的「曼荼罗」宇宙观之间，存在一种义理结构上的亲和——这正是「显密圆融」在汉语语境中最具张力的可能接口。'
    source: 《密宗全方位研究.md》第十章 10.3 节
    links:
      研究文档: docs/密宗全方位研究.md
  - title: 存疑案例 — 「立川流」的「异端」标签如何被历史书写制造
    body: '镰仓时代文献将日本真言宗内部的一支旁系「**立川流**」描绘为混杂骷髅崇拜与性力仪轨的邪流，并遭官方查禁；但现代日本学界（此为学术考辨视角）已提出修正意见——该流本属醍醐寺三宝院正统法脉的一支旁系，其「邪教」污名很可能是后世宗派论争中，被对手刻意与另一支毫不相干的「陀吉尼天信仰」团体混为一谈所致。

      这一案例提醒我们：教派史上的「异端」标签本身，也常常是历史书写与宗派政治的产物，需要审慎的史料甄别，而非照单全收——它与本页「民国密教门户之争」中王弘愿所受的「正当性」质疑，构成一组跨越时空的呼应。'
    source: 《密宗全方位研究.md》附·存疑与延伸问题
    links:
      研究文档: docs/密宗全方位研究.md
references:
  classical:
  - 《大日经》（《大毗卢遮那成佛神变加持经》）、一行《大日经疏》、空海《大日经疏讲解》(当代成观法师逐集讲解)
