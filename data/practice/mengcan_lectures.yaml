# 梦参老和尚 (1915-2017) — 一生讲法全目
# Ven. Mengcan — Complete Lecture Catalog
# 最后更新: 2026-08-08

biography:
  name: 梦参老和尚
  name_en: Ven. Mengcan (Mèngcān)
  secular_name: 刘瑞庭
  birth: 1915
  death: 2017 (世寿103岁·僧腊87载)
  birthplace: 黑龙江开通县(今吉林白城)
  lineage: 临济宗
  key_locations:
    - "1931: 北京上方山兜率寺出家·法名觉醒"
    - "1937: 青岛湛山寺·依倓虚老法师学天台教观"
    - "1940: 入藏求学密法·拉萨色拉寺十年·依止赤江仁波切"
    - "1950-1982: 入狱33年(含劳改)·以「假使热铁轮,于汝顶上旋,终不以此苦,退失菩提心」自励"
    - "1982: 平反出狱·任教于北京中国佛学院"
    - "1988: 应请至美国纽约弘法·旅美十余年"
    - "2012: 应五台山政府之请复建万佛洞真容寺·2013年起定居真容寺静修"
    - "2004-2007: 九旬高龄于五台山普寿寺开讲《八十华严》五百余座圆满"
    - "2017年11月27日: 于五台山真容寺安详示寂"
  key_locations_en:
    - "1931: Left home at Doushuai Monastery on Shangfang Mountain, Beijing; dharma name Juexing"
    - "1937: At Zhanshan Monastery, Qingdao, studied Tiantai contemplation under the elder Venerable Tanxu"
    - "1940: Went to Tibet to study esoteric dharma; ten years at Sera Monastery in Lhasa, relying on the Venerable Chijiang Rinpoche"
    - "1950-1982: Imprisoned for thirty-three years (including labor reform); encouraged himself with 'Even if a wheel of scalding iron spins upon my head, I will never for this suffering retreat from the resolve for awakening'"
    - "1982: Exonerated and released; taught at the Chinese Buddhist Institute in Beijing"
    - "1988: Invited to spread the dharma in New York; over a decade traveling and teaching in America"
    - "2012: At the request of the Wutai government, restored the Zhenrong Monastery at the Cave of Ten Thousand Buddhas; settled there to practice in quiet from 2013"
    - "2004-2007: In his nineties, lectured on the Eighty-fascicle Avataṃsaka at Pusheshou Monastery, Wutai, completing over five hundred sessions"
    - "November 27, 2017: Passed away peacefully at Zhenrong Monastery, Wutai"
  relation_to_huayan: |
    海云继梦法师于1991年依梦参老和尚祝发出家，
    成为梦老法嗣之一。梦参老和尚以百岁高龄讲完《八十华严》五百余座，
    是近代佛教史上最完整的华严经讲解之一。
  relation_to_huayan_en: |
    Ven. Haiyun Jihong left home under Ven. Mengcan in 1991, becoming one
    of the old master's dharma heirs. Having completed, in his hundredth
    year, over five hundred lectures on the Eighty-fascicle Avataṃsaka,
    Venerable Mengcan's exposition stands among the most complete
    commentaries on the Avataṃsaka Sūtra in modern Buddhist history.
  life_motto_en: |
    "Even if a wheel of scalding iron spins upon the crown of my head, I
    will never on account of this suffering retreat from the resolve for
    awakening." — Ven. Mengcan's self-encouragement, his resolve never
    yielding through thirty-three years of imprisonment.

lectures:
  # ═══ 华严部 ═══
  - sutra: 华严经 (八十卷)
    sutra_en: Avataṃsaka Sūtra (eighty fascicles)
    title_full: 大方广佛华严经八十卷
    title_full_en: The Flower Ornament Scripture in eighty fascicles
    venue: 五台山普寿寺
    year: "2004-2007"
    length: 五百余座(讲)
    significance: 九旬高龄开讲·近代佛教史上最完整的八十华严讲解之一
    significance_en: opened at age ninety; one of the most complete expositions of the eighty-fascicle Avataṃsaka in modern Buddhist history
    publication: "《八十华严讲述》方广文化(分册出版) 第1-12册+"
    publication_en: "Exposition of the Eighty-fascicle Avataṃsaka, Fangguang Culture, published in volumes, nos. 1-12 and more"
    note: |
      历时三年余（2004年农历二月初二开讲·一说2003—2007历时五年余）。
      涵盖从世主妙严品到入法界品全部39品。
      网络流传版本多不完整(仅到贤首品)，
      完整版可联系五台山普寿寺华严部。
    note_en: |
      It ran some three years and more (opened on the second day of the
      second lunar month, 2004; some give 2003-2007, some five years and
      more), covering all thirty-nine chapters from "The Wondrous Adornments
      of the Rulers" to "Entering the Dharma Realm." Versions circulating
      online are mostly incomplete (often only reaching the "Virtue of the
      Wise Leader" chapter); the complete text may be obtained through the
      Avataṃsaka department of Pusheshou Monastery, Wutai.
    link_wechat_draft: https://mp.weixin.qq.com/s?__biz=MzU1OTk1MzgzNw==&mid=2247510054&idx=7&sn=14eadd95e5af42a1afd32b2f7b4baa4b
