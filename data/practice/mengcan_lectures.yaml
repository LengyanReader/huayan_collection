life_motto: |
  「假使热铁轮，于汝顶上旋，
   终不以此苦，退失菩提心。」
   ——梦参老和尚以33年牢狱之身而道心不退的自我激励

relation_to_project: |
  海云继梦法师于1991年依梦参老和尚出家。
  梦老九十高龄于五台山普寿寺开讲《八十华严》五百余座的壮举，
  与本项目所承载的华严法脉传承一脉相承。
relation_to_project_en: |
  Ven. Haiyun Jihong left home under Ven. Mengcan in 1991. The old
  master's achievement of lecturing on the Eighty-fascicle Avataṃsaka for
  over five hundred sessions at Pusheshou Monastery, Wutai, in his
  nineties, is in direct continuity with the transmission of the Huayan
  lineage that this project upholds.