    title: 普贤行愿品讲记
    title_en: Commentary on the Samantabhadra's Vows chapter
    venue: 五台山普寿寺 / 美国纽约
    content: 十大愿王·导归极乐·华严修行总持
    content_en: the ten great vows of the king of vows, guiding all to rebirth in the Pure Land, the essential practice of the Avataṃsaka school

  - sutra: 华严经·梵行品
    sutra_en: Avataṃsaka Sūtra · the Pure Practices chapter
    title: 華嚴經梵行品新講
    title_en: A New Exposition of the Pure Practices Chapter of the Avataṃsaka Sūtra
    publisher: 方广文化
    year: 2018
    isbn: "9789869301836"
    link: https://www.cosmosbooks.com.hk/index.php?route=product/product&path=10300&product_id=986707803

  - sutra: 华严大意
    sutra_en: The General Meaning of the Avataṃsaka
