  - id: heart-gandhara
    emoji: 📰
    title: 实修心要 — 永远的犍陀罗·禅修实操系列
    title_en: "Essentials of Actual Practice — The Eternal Gandhāra: A Practical Chan Series"
    blocks:
      - type: p
        html: |-
          <p style=font-size:.78em;color:var(--text2);margin-bottom:6px>以下10篇文章来自微信公众号「<b>永远的犍陀罗</b>」· <b>实修心要</b>专辑。内容为海云继梦和上关于禅修实操的开示,由仁悦整理。原文链接为微信公众号文章,全文已保存至 <code>docs/hy_refs/wechat/</code> 目录。</p>
