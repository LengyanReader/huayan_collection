# 华严行法 — 修行体系 (来自 practice.js renderPractice() pv-system 区块)
subpage: 修行体系

wip_notice:
  text: |
    本页面内容基于大华严寺官网(2025.11版)和海云继梦和上已公开的讲经视频/音频/逐字稿/出版物整理。
    法师讲法内容不断更新演化，当前整理仍不完整，需要大量结构化梳理和补充核实，仅供参考，持续更新中。
    最新修行体系请以大华严寺官网为准。
  updated: "2026-08-02"

header:
  title: 华严行法 — 普贤乘修行体系
  description: |
    参考大华严寺海云继梦和上所立 普贤乘华严宗 修行体系。以华严禅法为核心，透过心法工程止住安心、令真心起作用。体系涵盖从资粮道到正行、从初信到法身大士的完整修行次第。

three_stages:
  - name: 禅修入门
    subtitle: 发心工程（资粮道）
    detail: "五科：戒·律·调身·调息·调心"
    color: gold
    description: |
      三门必修: 人格健康+出离心+菩提心。含五科（戒·律·调身·调息·调心）。技术面: 纯化禅(动→静)→象限转移→瞬间定。工程面: 心性培养+戒律基础。官网: 「发心——出三界、入法界之志,建立信根与定位。」
  - name: 禅修前行
    subtitle: 内摄工程
    detail: "安般守意·四种观法"
    color: blue
    description: |
      核心: 安那般那数息观(数.随.止)。官网: 「调息安稳,气息有序;守意——令心不外驰,身息心三者逐步协同。」观法次第: 驻佇心观(停心前行)->唯心识观(钝根先修.毗钵舍那)->真如实观(利根直修.奢摩他)->毗婆舍那->奢摩他。详见「📐 禅观法要」子页。
  - name: 禅修正行
    subtitle: 等持工程（内观）
    detail: "三摩呬多→三摩钵底→三摩地"
    color: red
    description: |
      前半程三摩呬多→后半程三摩钵底→究竟三摩地。官网: 「以观导定、以定成观,当下验果,不逐境界名相而重身心之柔和、稳定、清明。」课程配比: 70%修行面 + 30%健康面。延伸: 一日禅·二日禅·忍可禅七。

four_stages_blueprint:
  description: |
    据海云法师《四十华严讲记》第四卷第67讲及大华严寺官网「修行蓝图」页面。整套蓝图涵盖从信众到证量的完整阶次。
  stages:
    - name: 出离乘
      description: |
        出离心→出离道→出离行。以脱离轮回、了生死为基础动机，建立「出三界、入法界」之志。
    - name: 菩提乘
      description: |
        菩提心→菩提道→菩提行。发心求觉悟。法师称此「只是起步」。
    - name: 菩萨乘
      description: |
        菩萨心→菩萨道→菩萨行。法师称此「还没有究竟」——仍属因地修行。
    - name: 普贤乘
      description: |
        普贤心→普贤行→普贤道。究竟归趣。法师称「究竟要到普贤乘来」——此即「普贤乘华严宗」名称的义理出处。
      is_ultimate: true

six_subjects:
  description: |
    海云法师将传统华严义学重组为可依次修学的课程架构。「五大行法」即六科中除总论外的五项——禅、净、律、密、经教——主张华严宗并非纯粹「解门」而有完整「行门」。
  subjects:
    - name: 华严学概论
      content: "华严经结构·五教十宗·法界缘起（总纲性导论）"
    - name: 华严经教行法
      content: "经文解读·修行法门·善财五十三参（经教门）"
    - name: 华严禅行法
      content: "安般守意·置心一处·三摩地次第（禅门）"
    - name: 华严戒律观
      content: "菩萨戒·梵网经·现代持戒（律门）"
    - name: 华严净土法门
      content: "华藏世界·毗卢遮那净土（净门）"
    - name: 华严密法
      content: "华严字母·曼荼罗·真言持诵·秽迹金刚法（密门）"

three_lineages:
  description: |
    海云法师对三条汇流法脉在体系中各自的功能分工（据大华严寺官网及讲记）：
  lineages:
    - name: 中观论派
      role: 解
      description: |
        义理/空性论证——负责「理解」层面的理论基础。
    - name: 华严思想
      role: 架构
      description: |
        提供整体的世界观与义理框架——「事事无碍法界」「法界缘起」等核心世界观。
    - name: 瑜伽行派
      role: 行
      description: |
        禅观正行/实修技术来源。源自印度 Maha Yoga 传承（胜师子王菩萨），法师将其等同于「禅宗的禅观正行」。
      note: |
        官网将这支传承直接注解为「大乘瑜伽行派／Yogācāra 之行门精义」，读者可留意其中的诠释性跨度。

four_projects:
  projects:
    - name: 结界工程
      description: "短期共修——调整身心频率的具体操作"
    - name: 华藏工程
      description: |
        双重意涵: ①个人前行阶段必修课程（建立语言/思维模式）②跨世代文明教育志业——法师称「华藏工程五百年」
    - name: 华严大学
      description: "体制化培育弘法与研究人才的当代项目（非月霞法师等创办的历史性华严大学）"
    - name: BQ广场
      description: "四大工程之一，目前公开资料中未见「BQ」具体所指的清晰界定"

cognitive_levels:
  description: |
    法师自创的认知层次术语，用以区分凡夫、行者、法身大士三个阶段所依靠的不同认知机制：
  levels:
    - name: 识性
      stage: 凡夫阶段
      description: |
        「能」——妄想心。「识性的能绑虚妄的身」——凡夫是「身心混杂」状态。
    - name: 根性
      stage: 初果至四果阶段
      description: |
        「所」。此阶段关键操作是「舍识用根」。
    - name: 智
      stage: 十信位圆满之后
      description: |
        此后「以智为先导」，不再「以所为先导」。
      note: |
        法师坦承这套区分是借助现代汉语语法结构对古典义理的诠释性翻译，非声称唯一表述。

three_refuges:
  intro: |
    海云法师在传统「皈依三宝」之外，提出更具操作性的归依框架：
  practice_attitude: |
    法师强调「自顾灵山，不顾名山」「知道不算，做到才算」——真正的修行来自扎实的日常践行。
  items:
    - name: 缘念道场
      description: "缘念僧团，以道场为修行依止处"
    - name: 缘念善知识
      description: "缘念具体指导的师长，接受僧团制度性指导"
    - name: 缘念法门
      description: "缘念自己实际修学的具体法门，不杂修不盲从"

latest_news:
  - year: "2023"
    title: "国立台北大学杰出校友"
    description: |
      获遴选为母校杰出校友(2023年)。2024年1月促成华严学会与台北大学签署学术合作协议(一期两年.合计三期共六年),合办「新世纪永续发展」高峰论坛(2024-2025年)。
  - year: "2026"
    title: "「九九华严」五年讲座（TICC）"
    description: |
      于台北国际会议中心举行，每月举办。将华严哲理「转化为通俗易懂的现代心理学与生命科学」语言，回应「AI科技与永续新时代」的挑战——「AI给得了答案，但给得了心安吗？」
  - year: "2026.7.9"
    title: "支提山大华严寺动土"
    description: |
      苗栗县通霄镇。面向台湾海峡，与福建宁德支提华严祖庭隔海相望——「山海相应、法脉相承」。四百余位护法善信参与，五十三位嘉宾共同执铲（呼应善财五十三参）。
  - year: "ongoing"
    title: "第四期佛教"
    description: |
      大华严寺官网对海云法师使命的表述——「以中兴汉传佛教，开展第四期佛教思想发展为使命」。目前尚未见对第一至第三期的系统性论述。

