  expanded_academic:
    title: 学术脉络补充 (chanref 深度内容)
    topics:
      - title: 胡适-铃木大拙论战与「胡适禅学案」
        body: |
          1953年，胡适发表《禅宗在中国——它的历史与方法》，铃木大拙以《禅：答胡适博士》反驳。
          柳田圣山将往来文字编成《胡适禅学案》——历史考证能否触及「禅的本质体验」至今是方法论起点。
          胡适晚年曾质疑《虚云和尚年谱》中父亲任职记录的真实性，去信要求「拿证据来」，
          典型体现了历史考据学对传记材料的态度: 不否定修证经验，但要求证据检验。
      - title: 宗密《禅源诸诠集都序》三宗三教与华严禅
        body: |
          宗密(780-841)，华严五祖，亦为禅宗荷泽宗法嗣。于《禅源诸诠集都序》中判禅三宗:
          ① 息妄修心宗(北宗神秀一系)
          ② 泯绝无寄宗(牛头·石头一系)
          ③ 直显心性宗(荷泽·洪州一系)
          配教三种(密意依性说相教·密意破相显性教·显示真心即性教)，
          以融合荷泽禅与华严宗为「华严禅」——此为后世华严-禅合流的直接经典源头。
          这一「三宗三教」说对理解海云继梦「教属华严、观属禅宗」的定位至关重要。
      - title: 达摩《二入四行论》 — 禅宗修学体系的奠基文本
        body: |
          「理入」与「行入」是禅宗最早的系统修行纲领。
          行入四行: 报冤行·随缘行·无所求行·称法行。
          该文本本身即是敦煌出土写本——禅宗最早文献恰恰来自20世纪考古发现而非传统灯录传承。
      - title: 批判佛教 — 松本史朗与袴谷宪昭
        body: |
          松本史朗(1985):「如来藏不是佛教」——认为如来藏「基体说」(dhātu-vāda)与「无我」「空」矛盾，
          因此「禅思想非佛教」。袴谷宪昭(1989)从曹洞宗内部部落民歧视问题切入，
          批判日本佛教「本觉观」丧失社会批判力，出版《本觉思想批判》《批判佛教》。
          中国现代佛学早有先声: 支那内学院吕澂立足印度唯识「性寂」批判《起信论》「性觉」框架
          ——这条批判路线与禅宗「直指人心、见性成佛」的如来藏预设构成正面交锋。
      - title: 中国禅宗史学术专著 (1990s-2000s)
        body: |
          印顺《中国禅宗史》(1971, 1973年获日本大正大学博士学位)——部分为回应胡适「神会造坛经」说而作。
          洪修平《禅宗思想的形成与发展》(1992)
          杜继文·魏道儒《中国禅宗通史》(1993)
          葛兆光《中国禅思想史——从6世纪到9世纪》(1995)
          杨曾文《唐五代禅宗史》(1999)
          龚隽《禅史钩沉：以问题为中心的思想史论述》(2006)
    references:
      - "柳田圣山编《胡适禅学案》"
      - "宗密《禅源诸诠集都序》T48n2015"
      - "达摩《二入四行论》(敦煌本·铃木大拙校刊)"
      - "松本史朗《缘起与空》(1989)·袴谷宪昭《本觉思想批判》(1989)·《批判佛教》(1990)"
      - "印顺《中国禅宗史》(正闻出版社, 1971)"
      - "葛兆光《中国禅思想史》(北京大学出版社, 1995)"

  chan_practice_expanded:
    title: 实修脉络补充
    topics:
      - title: 牛头宗与印顺的发现
        body: |
          印顺《中国禅宗史》为牛头宗单辟一章——
          牛头宗的「虚空为道本」「无心合道」融合江东玄学，
          是禅宗吸收中国本土形而上学的重要关节点。
      - title: 临济·曹洞宗风
        body: |
          临济「三玄三要」(句中玄·意中玄·体中玄) + 「四料简」(夺人不夺境等)。
          曹洞「五位君臣」(正中偏·偏中正·正中来·兼中至·兼中到, 洞山良价创立)。
          海云继梦将「三玄」配修行三阶段: 句中玄=资粮道, 意中玄=正行, 体中玄=法身妙行。
      - title: 禅净合流
        body: |
          「念佛是谁」本身即是禅净合流产物: 永明延寿→明末云栖袾宏/蕅益智旭
          → 清代丛林实际主流模式 → 虚云本人亦出身这一混合传统。
          所以把看话/默照当作独立二选一过于简化——
          近代大多数僧人的实修实际上是「参究+佛号」的混融状态。
      - title: 圣严法师「中华禅法鼓宗」(2005)
        body: |
          将传统话头禅与默照禅整合进同一套四阶次第:
          散乱心→集中心→统一心→无心。每阶各有修行方法。
          把大慧与宏智八百年前的分歧直接合并入同一框架，不再视二者为互斥选项。
          圣严本人对禅宗流弊有清醒自省: 仅看公案语录未实修者，易落入不敬三宝、
          不忏悔不持戒的偏狂断见——与净慧提出生活禅的初衷相互呼应。

  # ═══ 五、祖师传承详表 ═══
  - id: chan_lineage_detail
    title: 祖师传承详表
    icon: 📊
    intro: |
      禅宗法脉传承的详细世系表。从初祖达摩至六祖慧能，
      再到五家七宗的分灯，最后汇聚于近现代虚云老和尚的兼祧五宗。
    topics:
      - title: 从达摩到六祖——中国禅宗正传
        body: |
          ① **初祖菩提达摩**(?-536): 南天竺香至国王子。梁普通年间来华。嵩山少林寺面壁九年。
          付法偈: 「吾本来兹土，传法救迷情。一花开五叶，结果自然成。」弟子: 慧可。
          ② **二祖慧可**(487-593): 立雪断臂求法。北周灭佛时南下隐于皖公山。
          ③ **三祖僧璨**(?-606): 《信心铭》作者。隋开皇年间隐于司空山。
          ④ **四祖道信**(580-651): 开创「农禅并重」的定居修行模式。双峰山聚众五百。
          ⑤ **五祖弘忍**(601-674): 黄梅东山传法，「东山法门」确立。门下七百。
          ⑥ **六祖慧能**(638-713): 广东新兴人，闻《金刚经》开悟。曹溪宝林寺传法。
          《坛经》为唯一中国祖师所造之「经」。弟子: 南岳怀让·青原行思·荷泽神会。
      - title: 五家七宗分灯
        body: |
          **临济宗**: 义玄(?-867)创。以棒喝·三玄三要·四料简著称。→杨岐派(方会)·黄龙派(慧南)。
          **曹洞宗**: 洞山良价(807-869)+曹山本寂(840-901)。五位君臣·回互偏正。
          **沩仰宗**: 沩山灵祐(771-853)+仰山慧寂(807-883)。圆相默契。五代后衰微。
          **云门宗**: 云门文偃(864-949)。一句三句·涵盖乾坤。北宋极盛，南宋衰微。
          **法眼宗**: 法眼文益(885-958)。《宗门十规论》。永明延寿(904-975)为其三祖，禅净融合先驱。
          明清以后仅临济·曹洞二宗法脉连续可考。
      - title: 虚云老和尚(1840-1959)得力弟子详表
        body: |
          虚云一生兼祧五宗，门下弟子众多。以下为其主要法嗣与再传弟子的传承关系:

          **承接法脉的弟子**:
          - 本焕长老(1907-2012): 承临济44世。深圳弘法寺开山。106岁圆寂。
          - 佛源长老(1923-2009): 承云门13世。广东云门寺中兴。禅门尊宿。
          - 净慧长老(1933-2013): 承五宗法脉(临济44·曹洞48·沩仰9·法眼9·云门13)。生活禅创立者。
          - 传印长老(1927-2023): 承沩仰9世。中国佛教协会会长(2010-2015)。
          - 一诚长老(1927-2017): 承沩仰9世。中国佛教协会会长(2005-2010)。
          - 宣化上人(1918-1995): 承沩仰9世。美国万佛城创办者。

          **海外传承**:
          - 宣化上人→美国法界佛教总会: 汉传佛教西传的重要一脉
          - 2009年净慧长老传临济45世法卷予德国本笃禅修中心Willigis Jäger: 禅宗脉入欧洲

          **再传代表**:
          - 净慧→明海法师(柏林禅寺方丈·中国佛协副会长)
          - 净慧→明杰法师等(四祖寺·生活禅体系)
          - 本焕→印顺法师(深圳弘法寺方丈)
          - 佛源→明向法师等(云门寺)
        source: "综合虚云年谱·各寺院官方资料·中国佛教协会文献"
      - title: 传法偈与印可制度
        body: |
          禅宗传法的核心制度: **印可**(师对弟子悟境的印可)与**传法偈**。
          达摩付法偈: 「吾本来兹土，传法救迷情。一花开五叶，结果自然成。」
          慧能传法偈: 「心地含诸种，普雨悉皆萌。顿悟华情已，菩提果自成。」
          传法凭证: 袈裟(至六祖止)+法卷(后世)+拂子+拄杖。
          法卷记载: 世系传承·传法偈·印证时间·印证地点。
          虚云老和尚以「法卷」形式复兴云门·沩仰·法眼三家断绝的法脉——
          这既是宗教意义的「继绝」，也引发了学界关于「法脉真实性」的讨论。
        source: "综合灯录·虚云年谱·McRae对法脉建构性的研究"
