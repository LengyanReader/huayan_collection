# 禅门实迹 — Chan Authentic Traces
# 全球学界视角 + 门内实修 + 近现代禅门 + 海云法师禅法
# 最后更新: 2026-08-08

sections:
  # ═══ 一、全球学界视角 ═══
  - id: chan_academic
    title: 全球学界视角·禅宗全貌
    icon: 🔍
    intro: |
      20世纪以来，国际学界对禅宗(Chan/Zen/Sŏn/Thiền)的研究经历了
      从「传统宗派史」到「批判文献学」再到「文化批判」的范式演变。
      以下梳理关键学者、核心著作与主要学术争论。
    topics:
      - title: 经典奠基期 — Heinrich Dumoulin《Zen Buddhism - A History》
        body: |
          Heinrich Dumoulin (1905-1995), 德国耶稣会士, 两卷本Zen Buddhism: A History
          (Vol.1 India and China, 1988; Vol.2 Japan, 1990, Macmillan) 英文版
          长期为英语世界最详尽的禅宗通史。优点: 综览日文·德文·法文·英文研究成果,
          覆盖印度源流→中国→日本的完整传播链。局限: 偏向日本立场;
          被视为「宗派史」(church history)范式; 假设存在一个「真正的禅」;
          忽略韩国·越南·中国后宋禅宗。
      - title: 批判转向 — John McRae《Seeing Through Zen》(2003)
        body: |
          John R. McRae (1947-2011), 美国学者。Seeing Through Zen: Encounter,
          Transformation, and Genealogy in Chinese Chan Buddhism
          (University of California Press, 2003. ISBN 978-0520237988)。
          提出「禅宗研究的四个原则」:
          ① It's not true, therefore it's more important
             (正因不是史实, 所以更重要——虚构反映的是创造者的价值观)
          ② Lineage is about religious identity, not genealogy
             (法系传承是宗教认同, 非历史血缘)
          ③ Encounter dialogue is a Song-dynasty retrospective creation
             (机锋问答是宋代禅僧回溯性创作的宗教文学, 非历史实录)
          ④ Chan is a process, not a fixed essence
             (禅宗是一个不断建构的过程, 没有一个不变的「禅宗本质」)
        links:
          ucpress: https://www.ucpress.edu/book/9780520237988/seeing-through-zen
      - title: 文献学革命 — 柳田圣山(Yanagida Seizan)与敦煌禅籍
        body: |
          柳田圣山(1922-2006), 日本早期禅宗文献研究第一人。
          系统整理敦煌禅宗写本, 出版的《初期禅宗史书の研究》(1967)
          彻底改变了学界对早期禅宗的理解——
          发现北宗并非「渐悟」的保守派, 而是盛唐时期的主流禅法;
          《六祖坛经》有多个版本, 敦煌本(最早)与宗宝本(通行)差异极大。
          柳田于1989年写道: 「敦煌禅文献被发现已九十年, 研究似已穷尽,
          然事实上什么也还没有解决……大半材料仍未被整体通读。」
      - title: 文化批判 — Bernard Faure《The Rhetoric of Immediacy》(1991)
        body: |
          Bernard Faure (1948-), 法国学者, 哥伦比亚大学教授。
          The Rhetoric of Immediacy: A Cultural Critique of Chan/Zen Buddhism
          (Princeton, 1991. ISBN 978-0691029634)。
          核心批判: 禅宗自称「不立文字」「教外别传」——
          但「不立文字」本身就是一种精心构建的「修辞」,
          且恰恰依赖巨量的文字传统来传播「不立文字」的叙事。
          这种「反传统的传统主义」是禅宗最具悖论性的文化特征。
      - title: 关键通论与参考
        body: |
          • Robert Buswell (UCLA): 韩国禅(Sŏn)研究权威, 主编The Zen Canon (Oxford, 2004)
          • T. Griffith Foulk (Sarah Lawrence): 质疑「禅宗」(Ch'an Tsung)作为制度性实体在10世纪之前的存在
          • Albert Welter (Arizona): 宋代禅宗的社会史研究——禅宗如何在宋代成为主流
          • Mario Poceski (Florida): 马祖道一与洪州宗的再评估
          • 印顺(1906-2005): 《中国禅宗史》(1971)——中国学者最早的批判性禅宗史,
            考证《坛经》非神会伪作, 推翻胡适「神会造《坛经》」说
          • 忽滑谷快天(Nukariya Kaiten): 日本最早的系统禅学史作者

  # ═══ 二、门内实修 ═══
  - id: chan_practice
    title: 佛门内部·实修视角
    icon: 🧘
    intro: |
      佛教内部对禅宗的梳理以「修行」为核心, 区别于学术界的「批判性」视角。
      其核心关切不是文本真伪或历史建构, 而是修行次第·禅法分类·法脉传承。
    topics:
      - title: 禅宗修行总纲 — 戒·定·慧三学
        body: |
          禅宗虽云「教外别传」, 实不离戒定慧三学。
          • 戒: 百丈清规→丛林规矩→禅堂规约。一日不作一日不食(农禅)
          • 定: 四禅八定(共外道)→欲界定→未到定→初禅(三品十二门)
          • 慧: 从文字般若→观照般若→实相般若
          海云和尚: 「没有初禅定的功夫, 了生死出三界根本不可能。」
      - title: 两大法门 — 话头禅(临济宗) vs 默照禅(曹洞宗)
        body: |
          禅宗修行至宋代形成两大主流门庭:
          **话头禅**(看话禅)— 临济宗大慧宗杲(1089-1163)弘扬。
          以一句「无义味语」(如「狗子无佛性」「念佛是谁」)截断意识流,
          起大疑情, 疑情成团后爆破——「大疑大悟, 小疑小悟, 不疑不悟」。
          **默照禅** — 曹洞宗宏智正觉(1091-1157)弘扬。
          「默默忘言, 昭昭现前」——只管打坐, 默然静照, 不求开悟而自然悟入。
          两门非对立而是互补: 话头有「疑」无「默」则浮躁;
          默照有「默」无「疑」则枯寂。明末四大高僧多兼弘二者。
      - title: 参禅进阶 — 三关·三玄三要
        body: |
          门内传统以「三关」衡量参禅功夫:
          初关(破本参): 截断意识流, 亲见本来面目。话头疑情成团→疑团爆破。
          重关(透重关): 保住功夫, 悟后起修。历境练心, 于一切境缘中不动摇。
          牢关(末后牢关): 大事了毕, 生死自在。末后一句, 不通凡圣。
          临济义玄更立「三玄三要」(句中玄·意中玄·体中玄)为参究细密功夫。
          海云继梦将此三玄配修行三阶段: 句中玄=资粮道, 意中玄=正行, 体中玄=法身妙行。
      - title: 丛林制度 — 禅宗的社会实践
        body: |
          马祖建丛林, 百丈立清规(唐代) ——
          这是禅宗对中国佛教最革命性的贡献之一:
          走出律寺, 另立禅寺; 不依律藏, 别创清规。
          核心精神: 「一日不作, 一日不食」(百丈怀海)。
          禅堂规矩: 禅七(七日密集禅修)·打七·起七·解七·跑香·坐香。
          虚云老和尚中兴多处禅堂, 恢复古规, 重振宗风。

  # ═══ 三、近现代禅门 ═══
  - id: chan_modern
    title: 近现代禅门发展
    icon: 📜
    intro: |
      19世纪末至21世纪, 中国禅宗经历了从衰微到复兴的艰难历程。
      虚云老和尚 (1840-1959) 与来果禅师 (1881-1953)
      是近代禅宗复兴的两大柱石。其后净慧长老、本焕长老、佛源长老等接续。
    topics:
      - title: 虚云老和尚(1840-1959) — 兼祧五宗的禅宗泰斗
        body: |
          虚云, 俗姓萧, 湖南湘乡人, 生于福建泉州。19岁于福州鼓山涌泉寺出家。
          一生兼祧临济·曹洞·沩仰·法眼·云门五宗法脉。
          修复大小寺院八十余处: 鸡足山祝圣寺·南华寺·云门寺·云居山真如寺等。
          1959年于云居山圆寂, 世寿120岁。
          核心贡献: ① 以一己之力复兴多处禅宗祖庭;
          ② 坚持农禅并重, 在战乱和文革前夕守住禅堂香火;
          ③ 留下大量禅七开示, 强调「参禅要起疑情」的临济宗本色;
          ④ 培养了一代法嗣(本焕·佛源·净慧·传印·一诚等)。
      - title: 净慧长老(1933-2013) — 生活禅的创立
        body: |
          净慧, 俗姓黄, 湖北新洲人。1951年于广东云门寺虚云座下受戒,
          承接禅宗五家法脉。1956年入中国佛学院, 1979年恢复工作后任《法音》主编20年。
          1988年兴复河北赵州柏林禅寺, 1993年提出「生活禅」理念:
          「觉悟人生, 奉献人生」「将信仰落实于生活, 将修行落实于当下」
          连续举办24届「生活禅夏令营」, 影响数万青年学佛者。
          2003年住持湖北黄梅四祖寺·五祖寺, 2013年于四祖寺圆寂。
      - title: 其他近代禅门高僧
        body: |
          **来果禅师(1881-1953)**: 江苏高旻寺住持30年, 改革禅堂规矩, 编《来果禅师语录》。
          **本焕长老(1907-2012)**: 虚云法嗣, 深圳弘法寺开山, 106岁仍每日接待信众。
          **佛源长老(1923-2009)**: 虚云法嗣, 广东云门寺方丈, 云门宗第十三代传人。
          **梦参老和尚(1915-2017)**: 见另节「梦参老和尚讲法全目」。
      - title: 禅宗全球化
        body: |
          日本: 铃木大拙(D.T. Suzuki, 1870-1966)将Zen引入西方——
          Essays in Zen Buddhism三卷(1927-1934)为英语世界首批Zen通论。
          西方: Philip Kapleau《The Three Pillars of Zen》(1965);
          Shunryu Suzuki《Zen Mind, Beginner's Mind》(1970)。
          韩国: 崇山行愿(Seung Sahn, 1927-2004)在北美创办Kwan Um School of Zen。
          越南: 一行禅师(Thích Nhất Hạnh, 1926-2022)将正念禅融入日常生活与和平运动。
          中国: 净慧长老生活禅夏令营模式被多国汉传寺院采纳。

  # ═══ 四、海云法师禅法 ═══
  - id: chan_haiyun
    title: 海云法师·禅法诠释
    icon: 🌊
    intro: |
      海云继梦法师自称「教属华严, 观属禅宗心法」, 教观双举。
      其禅法以重建唐代「东山法门」为旗帜, 以「话头」参究为核心方法,
      以华严理事圆融为理论框架, 融合大乘瑜伽行派「身-息-心」观行次第。
    topics:
      - title: 东山法门的重建
        body: |
          海云继梦认为中国禅宗正法心法教学自元代八思巴为国师后失传约七八百年。
          他发心重建唐代五祖弘忍开创的「东山法门」——
          其特质是「运水搬柴皆是禅·行住坐卧皆修行」的可操作·可检核行为指导系统。
          他将华严宗理路与大乘瑜伽行派「身→息→心」次第会通,
          提出上下双回向的实修结构: 「华严理事圆融」≡「东山法门等持工程」。
      - title: 参禅的核心 — 话头与疑情
        body: |
          海云禅法以「话头禅」为核心, 未见其对「默照」的专门诠释。
          **话头的产生**: 话头从入佛门进禅堂时即已诞生, 关键在于行者觉察。
          「念佛是谁?」「走路的是谁?」「感受到冷的是谁?」——让心回到立场上。
          **疑情的守护**: 「紧紧守住疑情、深参话头」是行者本色。
          疑情会在生命中「回荡」三十年, 临终迸发惊天动地的力量——
          他以一位印度行者参究「这一切到最后都会回到你身上」三十年为例。
          **句中玄三阶段**:
          初要: 从文句如「念佛是谁」开始, 发现心法/色法两层面
          中要: 区分心法色法, 观照心念起伏与存在
          上要: 深入观心王·心所·尘境关系
        source: "《非常坛经》(海南出版社) + fjdh.cn海云法师·禅宗系列讲记"
      - title: 心王·心所·尘境 — 海云禅法的认识论基础
        body: |
          海云继梦建立了一套精细的心识分析作为禅法基础:
          • 心王: 心的主体——能知·能觉·能动的「真心」
          • 心所: 心王的作用——如注意力·情绪·思维等
          • 尘境: 六根对六尘所产生的外境(色声香味触法)
          修行功夫的核心: 「照见心王如何作用, 心所如何被影响」。
          一切放不下的根本原因是「不知道心王在作用」——
          心与境界黏着, 无法分离。在参话头中照住五蕴(色受想行识)的运作轨迹,
          直至心能主导境界而不被境转。
        source: "[抓住话头深参, 照住心的活动轨迹](http://wuming.xuefo.com/nr/6/59257.html)"
      - title: 身根 — 最佳切入点
        body: |
          海云继梦特别强调「身根对尘境的直接感受」是参禅的最佳契入处。
          在寒冷中参「感受到冷的是谁?」——从身根接触触尘,
          不透过意识分别, 直接让心产生捕捉作用。
          此时身体不再感到寒冷,「一股热,会从你内心的深处激发出来」。
          这正是禅修大德们喜爱在寒冷处修行的原因——
          「身根直接对我们的那一种影响力, 是你最好契入的方法」。
        source: "[紧紧守住那个话头](http://wuming.xuefo.com/nr/6/59222.html)"
      - title: 一门深入·断绝杂思
        body: |
          参禅必须「一门深入, 只有一条路可走」。禅堂规矩和禅师说法是绝对依止。
          在话头功夫未纯熟前, 即使是布施·持戒·六度万行也「通通不要管它」——
          「在这里头有一点点的夹杂, 它就是不清净」。
          你只能参这一个话头, 只有这一条路, 其他一切放下。
          不是不起念, 而是「不与念相应」。
        source: "[世界的成就是这样来的](https://www.fjdh.cn/wumin/2013/09/164743285782.html)"

