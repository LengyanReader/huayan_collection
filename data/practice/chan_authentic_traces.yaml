sections:
- id: chan_academic
  title: 全球学界视角·禅宗全貌
  icon: 🔍
  intro: '禅宗学术研究一百年，经历了四个阶段的范式转移：

    第一阶段(1910s-1930s)铃木大拙向西方译介Zen，以信仰者视角构建「禅的哲学」；

    第二阶段(1930s-1970s)胡适与铃木论战开启历史批判研究，敦煌禅籍出土重塑早期禅史；

    第三阶段(1980s-2000s)柳田圣山文献学与McRae解构主义，质疑法脉叙事的历史真实性；

    第四阶段(2000s-)批判佛教(松本史朗)与社会史转向(Foulk·Welter)，研究重心从「禅思想」转向「禅的制度与权力」。

    中国学界自印顺《中国禅宗史》(1971)起形成独立脉络，葛兆光、龚隽等人持续深化。'
  topics:
  - title: 研究理路总览 — 四个阶段与中外脉络
    body: '**第一阶段·西传期(1910s-1930s)**: 铃木大拙《Essays in Zen Buddhism》三卷(1927-1934)将Zen译介至西方。其写作以「体验者的证言」而非「学者的考据」为基调——为西方读者构建了「禅=超越理性的纯粹体验」的图景。此阶段禅学研究尚属「信仰者的自我表达」。

      **第二阶段·批判转折(1930s-1970s)**: 胡适《禅宗在中国——它的历史与方法》(1953)与铃木《禅：答胡适博士》公开论战，形成「胡适禅学案」。敦煌禅籍(《楞伽师资记》《历代法宝记》等)的出土，为早期禅史提供了独立于后代灯录的原始材料。忽滑谷快天、宇井伯寿等日本学者奠定文献学基础。

      **第三阶段·解构期(1980s-2000s)**: 柳田圣山系统整理敦煌禅籍，McRae《Seeing Through Zen》(2003)提出「法脉是宗教认同而非历史血缘」「机锋问答是宋代回溯性创作」。Bernard
      Faure《The Rhetoric of Immediacy》(1991)批判「不立文字」本身即是修辞。

      **第四阶段·社会史转向(2000s-)**: T. Griffith Foulk质疑「禅宗」作为制度实体在10世纪前的存在；Albert Welter研究宋代禅宗如何成为主流；Mario
      Poceski重估洪州宗。批判佛教(松本史朗·袴谷宪昭)从义理层面质疑「本觉思想」。

      **中国脉络**: 印顺《中国禅宗史》(1971, 1973年获日本大正大学博士学位)部分为回应胡适「神会造坛经」说而作。此后洪修平、杜继文、魏道儒、葛兆光、龚隽等形成独立研究传统。葛兆光晚年反思:
      「现在的禅史研究仍在胡适的延长线上」。'
  - title: 经典奠基期 — Heinrich Dumoulin《Zen Buddhism - A History》
    body: 'Heinrich Dumoulin (1905-1995), 德国耶稣会士, 两卷本Zen Buddhism: A History

      (Vol.1 India and China, 1988; Vol.2 Japan, 1990, Macmillan) 英文版

      长期为英语世界最详尽的禅宗通史。优点: 综览日文·德文·法文·英文研究成果,

      覆盖印度源流→中国→日本的完整传播链。局限: 偏向日本立场;

      被视为「宗派史」(church history)范式; 假设存在一个「真正的禅」;

      忽略韩国·越南·中国后宋禅宗。

      '
  - title: 批判转向 — John McRae《Seeing Through Zen》(2003)
    body: "John R. McRae (1947-2011), 美国学者。Seeing Through Zen: Encounter,\nTransformation,\
      \ and Genealogy in Chinese Chan Buddhism\n(University of California Press, 2003.\
      \ ISBN 978-0520237988)。\n提出「禅宗研究的四个原则」:\n① It's not true, therefore it's more\
      \ important\n   (正因不是史实, 所以更重要——虚构反映的是创造者的价值观)\n② Lineage is about religious\
      \ identity, not genealogy\n   (法系传承是宗教认同, 非历史血缘)\n③ Encounter dialogue is a\
      \ Song-dynasty retrospective creation\n   (机锋问答是宋代禅僧回溯性创作的宗教文学, 非历史实录)\n④ Chan\
      \ is a process, not a fixed essence\n   (禅宗是一个不断建构的过程, 没有一个不变的「禅宗本质」)\n"
    links:
      ucpress: https://www.ucpress.edu/book/9780520237988/seeing-through-zen
  - title: 文献学革命 — 柳田圣山(Yanagida Seizan)与敦煌禅籍
    body: '柳田圣山(1922-2006), 日本早期禅宗文献研究第一人。

      系统整理敦煌禅宗写本, 出版的《初期禅宗史书の研究》(1967)

      彻底改变了学界对早期禅宗的理解——

      发现北宗并非「渐悟」的保守派, 而是盛唐时期的主流禅法;

      《六祖坛经》有多个版本, 敦煌本(最早)与宗宝本(通行)差异极大。

      柳田于1989年写道: 「敦煌禅文献被发现已九十年, 研究似已穷尽,

      然事实上什么也还没有解决……大半材料仍未被整体通读。」

      '
  - title: 文化批判 — Bernard Faure《The Rhetoric of Immediacy》(1991)
    body: 'Bernard Faure (1948-), 法国学者, 哥伦比亚大学教授。

      The Rhetoric of Immediacy: A Cultural Critique of Chan/Zen Buddhism

      (Princeton, 1991. ISBN 978-0691029634)。

      核心批判: 禅宗自称「不立文字」「教外别传」——

      但「不立文字」本身就是一种精心构建的「修辞」,

      且恰恰依赖巨量的文字传统来传播「不立文字」的叙事。

      这种「反传统的传统主义」是禅宗最具悖论性的文化特征。

      '
  - title: 关键通论与参考
    body: "• Robert Buswell (UCLA): 韩国禅(Sŏn)研究权威, 主编The Zen Canon (Oxford, 2004)\n\
      • T. Griffith Foulk (Sarah Lawrence): 质疑「禅宗」(Ch'an Tsung)作为制度性实体在10世纪之前的存在\n\
      • Albert Welter (Arizona): 宋代禅宗的社会史研究——禅宗如何在宋代成为主流\n• Mario Poceski (Florida):\
      \ 马祖道一与洪州宗的再评估\n• 印顺(1906-2005): 《中国禅宗史》(1971)——中国学者最早的批判性禅宗史,\n  考证《坛经》非神会伪作,\
      \ 推翻胡适「神会造《坛经》」说\n• 忽滑谷快天(Nukariya Kaiten): 日本最早的系统禅学史作者\n"
- id: chan_practice
  title: 佛门内部·实修视角
  icon: 🧘
  intro: '佛门内部的禅宗史观与学界不同——它不追问「法脉是否虚构」，

    而关注「这条修行道路如何被历代祖师真实地走出来」。

    以下从义理演化·技术演进·制度创新三个层面，梳理禅宗作为修行传统的内在发展逻辑。'
  topics:
  - title: 义理演化 — 从楞伽到般若再到禅教融合
    body: '**早期(达摩-弘忍)**: 依《楞伽经》「自性清净心」立宗。达摩「二入四行」以「理入」为根本。道信引入「一行三昧」(《文殊说般若经》)，弘忍「守本真心」——此期禅法以「安心」为纲。

      **六祖革命(慧能)**: 以《金刚经》「应无所住而生其心」为宗，开「无念·无相·无住」三无法门。从「看净」转向「见性」——禅法重心从「修」转向「悟」。

      **洪州宗(马祖道一)**: 「平常心是道」「即心即佛」——禅法彻底日常化。百丈「一日不作一日不食」确立农禅制度。

      **禅教融合(宗密)**: 华严五祖宗密以《圆觉经》通禅教，判禅三宗、教三种，倡「禅教一致」——此后的禅宗义理始终带有华严/圆觉的色彩。

      **宋以后**: 大慧「看话禅」以疑情为本，宏智「默照禅」以静照为门。明末四大高僧(云栖袾宏·紫柏真可·憨山德清·蕅益智旭)融合禅净教律——「禅净合流」成为明清丛林主流。'
  - title: 技术演进 — 禅法的操作体系如何逐步精密化
    body: '**初传期(6世纪)**: 达摩「壁观」——面壁默坐，直契真如。技术含量最低，全凭理入。

      **东山法门(7世纪)**: 道信「守一不移」，弘忍「守本真心」——出现明确的「所缘境」概念。此期禅法仍是「止」的一系。

      **南宗顿悟(8世纪)**: 慧能「定慧等持」，取消坐禅的形式要求——「道由心悟，岂在坐也」。神会「知之一字，众妙之门」。

      **机锋时代(9世纪)**: 马祖·石头门下发展出棒喝·圆相·翘足·竖拂等教学手段——禅法从「自修」转向「师教」。

      **文字禅(11世纪)**: 汾阳善昭「颂古」评唱公案，圆悟克勤《碧岩录》集其大成——公案成为可被反复参究的「话头库」。

      **看话禅(12世纪)**: 大慧宗杲以「无」字话头摄一切妄念——「千疑万疑只是一疑，话头上疑破则千疑万疑一时破」。技术操作达到最精密形态。

      **默照禅(12世纪)**: 宏智正觉「只管打坐」——取消话头，直以静坐本身为法。

      **近现代**: 虚云坚持传统看话禅；来果改革高旻寺禅堂规矩；圣严将话头·默照整合为四阶次第；净慧以「生活禅」把功夫延伸到日用。'
  - title: 禅宗修行总纲 — 戒·定·慧三学
    body: '禅宗虽云「教外别传」, 实不离戒定慧三学。

      • 戒: 百丈清规→丛林规矩→禅堂规约。一日不作一日不食(农禅)

      • 定: 四禅八定(共外道)→欲界定→未到定→初禅(三品十二门)

      • 慧: 从文字般若→观照般若→实相般若

      海云和尚: 「没有初禅定的功夫, 了生死出三界根本不可能。」

      '
  - title: 两大法门 — 话头禅(临济宗) vs 默照禅(曹洞宗)
    body: '禅宗修行至宋代形成两大主流门庭:

      **话头禅**(看话禅)— 临济宗大慧宗杲(1089-1163)弘扬。

      以一句「无义味语」(如「狗子无佛性」「念佛是谁」)截断意识流,

      起大疑情, 疑情成团后爆破——「大疑大悟, 小疑小悟, 不疑不悟」。

      **默照禅** — 曹洞宗宏智正觉(1091-1157)弘扬。

      「默默忘言, 昭昭现前」——只管打坐, 默然静照, 不求开悟而自然悟入。

      两门非对立而是互补: 话头有「疑」无「默」则浮躁;

      默照有「默」无「疑」则枯寂。明末四大高僧多兼弘二者。

      '
  - title: 参禅进阶 — 三关·三玄三要
    body: '门内传统以「三关」衡量参禅功夫:

      初关(破本参): 截断意识流, 亲见本来面目。话头疑情成团→疑团爆破。

      重关(透重关): 保住功夫, 悟后起修。历境练心, 于一切境缘中不动摇。

      牢关(末后牢关): 大事了毕, 生死自在。末后一句, 不通凡圣。

      临济义玄更立「三玄三要」(句中玄·意中玄·体中玄)为参究细密功夫。

      海云继梦将此三玄配修行三阶段: 句中玄=资粮道, 意中玄=正行, 体中玄=法身妙行。

      '
  - title: 丛林制度 — 禅宗的社会实践
    body: '马祖建丛林, 百丈立清规(唐代) ——

      这是禅宗对中国佛教最革命性的贡献之一:

      走出律寺, 另立禅寺; 不依律藏, 别创清规。

      核心精神: 「一日不作, 一日不食」(百丈怀海)。

      禅堂规矩: 禅七(七日密集禅修)·打七·起七·解七·跑香·坐香。

      虚云老和尚中兴多处禅堂, 恢复古规, 重振宗风。

      '
  - title: 制度创新 — 丛林清规与法脉传付
    body: '**丛林制度**: 马祖建丛林，百丈立清规——禅宗走出律寺、另立禅寺的制度革命。《百丈清规》确立: 不立佛殿唯树法堂·普请(集体劳动)·禅堂坐香制度。

      **传法制度**: 以袈裟(至六祖止)·法卷·拂子为信物。灯录(传灯录·五灯会元)记录世系。宗法式传承确保法脉延续，也使「谁是谁的弟子」成为宗教权威的核心依据。

      **清规演化**: 宋《禅苑清规》·元《敕修百丈清规》·明清丛林规约——仪轨日趋细密。禅七制度(七日密集禅修)自明末定型，成为禅堂修行最核心的形式。

      **近代变革**: 来果改革高旻寺——恢复古规·整肃道风。虚云中兴云门·云居等多处禅堂——「农禅并重」传统在现代的延续。'
- id: chan_modern
  title: 近现代禅门发展
  icon: 📜
  intro: '近代禅门的发展, 是一部从「衰微」到「复兴」的历史。

    晚清庙产兴学与战乱重创丛林, 但虚云·来果守住禅堂香火;

    杨文会·太虚开辟文献整理与人间佛教两条新路;

    1949年后, 禅宗在大陆·台湾·海外三地各自发展,

    最终在全球化时代迎来禅法的世界性传播。'
  topics:
  - title: 清末民初 — 禅门的衰落与危机的双重夹击
    body: '晚清禅门的衰微, 有两重结构性原因:

      **外缘**: 1898年张之洞《劝学篇》提出「庙产兴学」——以寺产办新式学堂。此后几十年间, 各地提拨寺产、改寺为学成风。1928-1930年国民政府又两次颁布「寺庙管理条例」,
      引起全国佛教界的强烈反弹(太虚领导佛教革新运动与之对抗)。

      **内因**: 丛林制度僵化——禅堂规矩废弛, 经忏佛事盛行, 真正参禅者日稀。来果禅师描述当时高旻寺以外的禅堂:「禅堂成了养老院」。

      **转机**: 杨文会(1837-1911)创办金陵刻经处(1866), 刊刻流通禅门典籍; 与日本佛教学者南条文雄的交流, 带回中土失传典籍(如《中论疏》等),
      为禅宗复兴奠定文献基础。杨文会门下出太虚、欧阳竟无等人。'
  - title: 复兴的三大路线 — 丛林路线·学术路线·人间佛教路线
    body: '民国禅宗复兴呈现三条并行的路线:

      **丛林路线(虚云·来果)**: 直接复兴传统禅堂。虚云中兴鸡足山·云门·云居等祖庭, 恢复禅七古规; 来果主持高旻寺三十年, 整顿禅堂规矩, 拒绝经忏,
      保持「专门禅堂」本色。此路线以「恢复古制」为旗帜。

      **学术路线(金陵刻经处·支那内学院)**: 杨文会、欧阳竟无、吕澂等以文献整理和义学研究为基础。吕澂对《起信论》与禅宗「性觉」说的批判, 构成民国佛学思想史上最大的义理争论之一。

      **人间佛教路线(太虚)**: 太虚(1890-1947)提出「人间佛教」——佛教不应离世而修, 而应关怀现实人生。太虚不废禅修, 但将重心从「山林禅堂」转向「人间关怀」。此路线后来由净慧的「生活禅」直接继承并落实为修行法门。

      三条路线在1949年后各有延续: 丛林路线由虚云弟子(本焕·佛源·一诚·传印)在大陆延续; 学术路线转为大学佛学研究; 人间佛教路线在台湾由星云·圣严·证严等人发扬光大。'
  - title: 虚云老和尚(1840-1959) — 兼祧五宗的禅宗泰斗
    body: '虚云, 俗姓萧, 湖南湘乡人, 生于福建泉州。19岁于福州鼓山涌泉寺出家。

      一生兼祧临济·曹洞·沩仰·法眼·云门五宗法脉。

      修复大小寺院八十余处: 鸡足山祝圣寺·南华寺·云门寺·云居山真如寺等。

      1959年于云居山圆寂, 世寿120岁。

      核心贡献: ① 以一己之力复兴多处禅宗祖庭;

      ② 坚持农禅并重, 在战乱和文革前夕守住禅堂香火;

      ③ 留下大量禅七开示, 强调「参禅要起疑情」的临济宗本色;

      ④ 培养了一代法嗣——详见「祖师传承详表」之「虚云老和尚的复兴禅门与传承」。'
  - title: 来果禅师(1881-1953) — 专门禅堂的守护者
    body: '来果, 俗姓刘, 湖北黄冈人。1905年出家, 1919年参学高旻寺, 1922年任住持, 主持高旻寺三十年。

      来果的贡献在于「守」——守住专门禅堂的纯粹性:

      • 拒绝经忏佛事——高旻寺不接经忏, 保持禅堂本色

      • 改革禅堂规矩——编著《来果禅师语录》《高旻寺规约》

      • 坚持「禅七」制度——每年冬季禅七不断

      1949年后, 来果留在大陆。1953年圆寂。来果与虚云并称民国禅门「一守一兴」——虚云以「兴」为主(复兴祖庭), 来果以「守」为主(守护禅堂纯粹性)。'
  - title: 净慧长老(1933-2013) — 生活禅的创立
    body: '净慧, 俗姓黄, 湖北新洲人。1951年于广东云门寺虚云座下受戒,

      承接禅宗五家法脉。1956年入中国佛学院, 1979年恢复工作后任《法音》主编20年。

      1988年兴复河北赵州柏林禅寺, 1993年提出「生活禅」理念:

      「觉悟人生, 奉献人生」「将信仰落实于生活, 将修行落实于当下」

      连续举办24届「生活禅夏令营」, 影响数万青年学佛者。

      2003年住持湖北黄梅四祖寺·五祖寺, 2013年于四祖寺圆寂。'
  - title: 台湾禅门 — 三大体系的并行发展
    body: '1949年后, 台湾成为汉传佛教的重要基地。禅门发展呈现三大体系:

      **法鼓山(圣严法师, 1931-2009)**: 留学日本立正大学获博士学位(论文为明末佛教研究)。1975年赴美弘法, 1977年创办中华佛学研究所。1989年创建法鼓山,
      2005年立「中华禅法鼓宗」——将话头禅与默照禅整合为「散乱心→集中心→统一心→无心」四阶次第。圣严以「学术僧」身份, 使禅法教学现代化·系统化。

      **佛光山(星云法师, 1927-2023)**: 临济宗48世。1967年开创佛光山, 以「人间佛教」为旗帜。星云虽非禅堂本位, 但其「禅净共修」「生活禅修」普及了禅法的大众化。佛光山在全球300+道场。

      **中台山(惟觉法师, 1928-2016)**: 早年参学基隆十方大觉禅寺, 长期闭关苦修。1987年创中台禅寺, 以「教禅合一」「丛林学院化」为特色。中台禅寺建筑恢宏,
      寺内设佛学院。

      另有慈济(证严法师)等体系, 虽以慈善为主, 但亦有禅修传统。'
  - title: 禅宗全球化 — 从铃木大拙到正念革命
    body: '**日本→西方(铃木大拙)**: D.T. Suzuki(1870-1966)以《Essays in Zen Buddhism》三卷(1927-1934)将Zen引入西方。铃木的写作以「体验者的证言」为基调,
      影响了垮掉的一代(Alan Watts·Gary Snyder·Jack Kerouac)。其传播策略后来受学界批评(过度强调「非理性」「神秘体验」),
      但历史影响深远。

      **西方禅修中心**: Philip Kapleau《The Three Pillars of Zen》(1965); Shunryu Suzuki(铃木俊隆)在旧金山建立禅中心,
      《Zen Mind, Beginner''s Mind》(1970)成为西方禅修经典; Robert Aitken、Bernie Glassman等人建立西方禅师传承。

      **韩国→西方(崇山行愿)**: Seung Sahn(1927-2004)在北美创办Kwan Um School of Zen, 以「只不知」(Only
      Don''t Know)教学法著称, 在欧美建立百余禅修中心。

      **越南→西方(一行禅师)**: Thích Nhất Hạnh(1926-2022)将正念禅融入日常生活与和平运动, 创办梅村(Plum Village)。其「正念呼吸」实践影响了全球的正念运动(mindfulness
      movement), 使禅修走出宗教范畴, 进入医学·教育·企业领域。

      **中国→海外(宣化上人)**: 宣化(1918-1995)在旧金山创办万佛城, 是美国最大的汉传佛教道场之一, 主持译经事业。'
- id: chan_haiyun
  title: 海云法师·禅法诠释
  icon: 🌊
  intro: '海云继梦法师自称「教属华严, 观属禅宗心法」, 教观双举。

    其禅法以重建唐代「东山法门」为旗帜, 以「话头」参究为核心方法,

    以华严理事圆融为理论框架, 融合大乘瑜伽行派「身-息-心」观行次第。

    '
  topics:
  - title: 东山法门的重建
    body: '海云继梦认为中国禅宗正法心法教学自元代八思巴为国师后失传约七八百年。

      他发心重建唐代五祖弘忍开创的「东山法门」——

      其特质是「运水搬柴皆是禅·行住坐卧皆修行」的可操作·可检核行为指导系统。

      他将华严宗理路与大乘瑜伽行派「身→息→心」次第会通,

      提出上下双回向的实修结构: 「华严理事圆融」≡「东山法门等持工程」。

      '
  - title: 参禅的核心 — 话头与疑情
    body: '海云禅法以「话头禅」为核心, 未见其对「默照」的专门诠释。

      **话头的产生**: 话头从入佛门进禅堂时即已诞生, 关键在于行者觉察。

      「念佛是谁?」「走路的是谁?」「感受到冷的是谁?」——让心回到立场上。

      **疑情的守护**: 「紧紧守住疑情、深参话头」是行者本色。

      疑情会在生命中「回荡」三十年, 临终迸发惊天动地的力量——

      他以一位印度行者参究「这一切到最后都会回到你身上」三十年为例。

      **句中玄三阶段**:

      初要: 从文句如「念佛是谁」开始, 发现心法/色法两层面

      中要: 区分心法色法, 观照心念起伏与存在

      上要: 深入观心王·心所·尘境关系

      '
    source: 《非常坛经》(海南出版社) + fjdh.cn海云法师·禅宗系列讲记
  - title: 心王·心所·尘境 — 海云禅法的认识论基础
    body: '海云继梦建立了一套精细的心识分析作为禅法基础:

      • 心王: 心的主体——能知·能觉·能动的「真心」

      • 心所: 心王的作用——如注意力·情绪·思维等

      • 尘境: 六根对六尘所产生的外境(色声香味触法)

      修行功夫的核心: 「照见心王如何作用, 心所如何被影响」。

      一切放不下的根本原因是「不知道心王在作用」——

      心与境界黏着, 无法分离。在参话头中照住五蕴(色受想行识)的运作轨迹,

      直至心能主导境界而不被境转。

      '
    source: '[抓住话头深参, 照住心的活动轨迹](http://wuming.xuefo.com/nr/6/59257.html)'
  - title: 身根 — 最佳切入点
    body: '海云继梦特别强调「身根对尘境的直接感受」是参禅的最佳契入处。

      在寒冷中参「感受到冷的是谁?」——从身根接触触尘,

      不透过意识分别, 直接让心产生捕捉作用。

      此时身体不再感到寒冷,「一股热,会从你内心的深处激发出来」。

      这正是禅修大德们喜爱在寒冷处修行的原因——

      「身根直接对我们的那一种影响力, 是你最好契入的方法」。

      '
    source: '[紧紧守住那个话头](http://wuming.xuefo.com/nr/6/59222.html)'
  - title: 一门深入·断绝杂思
    body: '参禅必须「一门深入, 只有一条路可走」。禅堂规矩和禅师说法是绝对依止。

      在话头功夫未纯熟前, 即使是布施·持戒·六度万行也「通通不要管它」——

      「在这里头有一点点的夹杂, 它就是不清净」。

      你只能参这一个话头, 只有这一条路, 其他一切放下。

      不是不起念, 而是「不与念相应」。

      '
    source: '[世界的成就是这样来的](https://www.fjdh.cn/wumin/2013/09/164743285782.html)'
- id: chan_lineage_detail
  title: 祖师传承详表
  icon: 📊
  intro: '禅宗法脉传承的详细世系表。从初祖达摩至六祖慧能，

    再到五家七宗的分灯，最后汇聚于近现代虚云老和尚的兼祧五宗。

    '
  topics:
  - title: 从达摩到六祖——中国禅宗正传
    body: '① **初祖菩提达摩**(?-536): 南天竺香至国王子。梁普通年间来华。嵩山少林寺面壁九年。

      付法偈: 「吾本来兹土，传法救迷情。一花开五叶，结果自然成。」弟子: 慧可。

      ② **二祖慧可**(487-593): 立雪断臂求法。北周灭佛时南下隐于皖公山。

      ③ **三祖僧璨**(?-606): 《信心铭》作者。隋开皇年间隐于司空山。

      ④ **四祖道信**(580-651): 开创「农禅并重」的定居修行模式。双峰山聚众五百。

      ⑤ **五祖弘忍**(601-674): 黄梅东山传法，「东山法门」确立。门下七百。

      ⑥ **六祖慧能**(638-713): 广东新兴人，闻《金刚经》开悟。曹溪宝林寺传法。

      《坛经》为唯一中国祖师所造之「经」。弟子: 南岳怀让·青原行思·荷泽神会。

      '
  - title: 五家七宗分灯
    body: '**临济宗**: 义玄(?-867)创。以棒喝·三玄三要·四料简著称。→杨岐派(方会)·黄龙派(慧南)。

      **曹洞宗**: 洞山良价(807-869)+曹山本寂(840-901)。五位君臣·回互偏正。

      **沩仰宗**: 沩山灵祐(771-853)+仰山慧寂(807-883)。圆相默契。五代后衰微。

      **云门宗**: 云门文偃(864-949)。一句三句·涵盖乾坤。北宋极盛，南宋衰微。

      **法眼宗**: 法眼文益(885-958)。《宗门十规论》。永明延寿(904-975)为其三祖，禅净融合先驱。

      明清以后仅临济·曹洞二宗法脉连续可考。

      '
  - title: 虚云老和尚(1840-1959)得力弟子详表
    body: '虚云一生兼祧五宗，门下弟子众多。以下为其主要法嗣与再传弟子的传承关系:


      **承接法脉的弟子**:

      - 本焕长老(1907-2012): 承临济44世。深圳弘法寺开山。106岁圆寂。

      - 佛源长老(1923-2009): 承云门13世。广东云门寺中兴。禅门尊宿。

      - 净慧长老(1933-2013): 承五宗法脉(临济44·曹洞48·沩仰9·法眼9·云门13)。生活禅创立者。

      - 传印长老(1927-2023): 承沩仰9世。中国佛教协会会长(2010-2015)。

      - 一诚长老(1927-2017): 承沩仰9世。中国佛教协会会长(2005-2010)。

      - 宣化上人(1918-1995): 承沩仰9世。美国万佛城创办者。


      **海外传承**:

      - 宣化上人→美国法界佛教总会: 汉传佛教西传的重要一脉

      - 2009年净慧长老传临济45世法卷予德国本笃禅修中心Willigis Jäger: 禅宗脉入欧洲


      **再传代表**:

      - 净慧→明海法师(柏林禅寺方丈·中国佛协副会长)

      - 净慧→明杰法师等(四祖寺·生活禅体系)

      - 本焕→印顺法师(深圳弘法寺方丈)

      - 佛源→明向法师等(云门寺)

      '
    source: 综合虚云年谱·各寺院官方资料·中国佛教协会文献
  - title: 传法偈与印可制度
    body: '禅宗传法的核心制度: **印可**(师对弟子悟境的印可)与**传法偈**。

      达摩付法偈: 「吾本来兹土，传法救迷情。一花开五叶，结果自然成。」

      慧能传法偈: 「心地含诸种，普雨悉皆萌。顿悟华情已，菩提果自成。」

      传法凭证: 袈裟(至六祖止)+法卷(后世)+拂子+拄杖。

      法卷记载: 世系传承·传法偈·印证时间·印证地点。

      虚云老和尚以「法卷」形式复兴云门·沩仰·法眼三家断绝的法脉——

      这既是宗教意义的「继绝」，也引发了学界关于「法脉真实性」的讨论。

      '
    source: 综合灯录·虚云年谱·McRae对法脉建构性的研究
