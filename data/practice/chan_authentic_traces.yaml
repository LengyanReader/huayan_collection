diagrams:
  lineage_evolution:
    title: 禅宗法脉传承与行法演进
    mermaid: "```mermaid\ngraph TD\n  subgraph 印度源流\n    BODHI[佛陀·灵山拈花<br/>Mahākāśyapa微笑]\
      \ --> BODHI2[二十八代传至菩提达摩]\n  end\n\n  subgraph 中国禅宗奠基\n    DAMO[菩提达摩?–536<br/>二入四行论·壁观]\
      \ --> HUIKE[慧可487–593<br/>二祖·立雪断臂]\n    HUIKE --> SENGCAN[僧璨?–606<br/>三祖·信心铭]\n\
      \    SENGCAN --> DAOXIN[道信580–651<br/>四祖·守一不移<br/>开创东山法门]\n    DAOXIN --> HONGREN[弘忍601–674<br/>五祖·东山法门确立]\n\
      \  end\n\n  subgraph 南宗分裂\n    HONGREN --> SHENXIU[神秀606–706<br/>北宗·渐悟<br/>两京法主·三帝门师]\n\
      \    HONGREN --> HUINENG[慧能638–713<br/>南宗·顿悟<br/>六祖·坛经]\n  end\n\n  subgraph\
      \ 五家七宗_唐五代\n    HUINENG --> NANYUE[南岳怀让677–744]\n    HUINENG --> QINGYUAN[青原行思671–740]\n\
      \    NANYUE --> MAZU[马祖道一709–788<br/>洪州宗·平常心是道]\n    QINGYUAN --> SHITOU[石头希迁700–790<br/>石头宗]\n\
      \    MAZU --> LINJI[临济义玄?–867<br/>临济宗·棒喝]\n    SHITOU --> CAODONG[洞山良价＋曹山本寂<br/>曹洞宗·五位君臣]\n\
      \    MAZU --> WEIYANG[沩山灵祐＋仰山慧寂<br/>沩仰宗·圆相默契]\n    SHITOU --> YUNMEN[云门文偃864–949<br/>云门宗·一字关]\n\
      \    SHITOU --> FAYAN[法眼文益885–958<br/>法眼宗]\n  end\n\n  subgraph 宋代禅_看话与默照\n\
      \    LINJI --> DAHUI[大慧宗杲1089–1163<br/>看话禅·无字话头<br/>焚碧岩录刻板]\n    CAODONG -->\
      \ HONGZHI[宏智正觉1091–1157<br/>默照禅·只管打坐]\n    DAHUI --> ZJ_DEBATE[看话vs默照<br/>大慧与宏智为好友<br/>公开论战·私人情谊]\n\
      \    HONGZHI --> ZJ_DEBATE\n  end\n\n  subgraph 明清禅净合流\n    LINJI --> ZYJM[禅净合流<br/>永明延寿→云栖袾宏<br/>→蕅益智旭→清代丛林<br/>'念佛是谁'成为主流话头]\n\
      \  end\n\n  subgraph 现代禅宗复兴_19_21世纪\n    XUYUN[虚云1840–1959<br/>兼祧五宗·坚守看话禅<br/>修复祖庭八十余处]\
      \ --> BENHUAN[本焕1907–2012<br/>深圳弘法寺]\n    XUYUN --> FOYUAN[佛源1923–2009<br/>广东云门寺]\n\
      \    XUYUN --> JINGHUI[净慧1933–2013<br/>生活禅·柏林禅寺]\n    XUYUN --> CHUANYIN[传印/一诚等法嗣]\n\
      \n    LAIGUO[来果1881–1953<br/>高旻寺·改革禅堂规矩] --> JUXU[延续看话禅传统]\n\n    SHENGYAN[圣严1931–2009<br/>法鼓宗·四阶次第<br/>整合看话+默照]\
      \ --> DD[法鼓山体系]\n\n    TAOXU[太虚1890–1947<br/>人间佛教] --> JINGHUI2[净慧·生活禅<br/>承接太虚方向]\n\
      end\n```\n"
  practice_evolution:
    title: 禅宗行法演进时间线
    mermaid: "```mermaid\ntimeline\n  title 禅宗行法演进史\n  6世纪 达摩 : 二入四行·壁观<br/>理入＋行入\n\
      \  7世纪 道信弘忍 : 东山法门<br/>守一不移·农禅\n  8世纪 慧能神会 : 顿悟法门<br/>无念·无相·无住\n  8_9世纪 马祖石头\
      \ : 机锋问答<br/>平常心是道\n  10世纪 法眼文益 : 宗门十规论<br/>禅门流弊反省\n  11世纪 汾阳善昭 : 颂古·文字禅<br/>公案评唱开端\n\
      \  12世纪 大慧宏智 : 看话禅vs默照禅<br/>疑情vs默照·二水分流\n  13_14世纪 元明 : 禅净合流<br/>念佛是谁·话头＋佛号\n\
      \  19_20世纪 虚云来果 : 传统看话禅坚守<br/>参'念佛是谁'\n  20世纪末 圣严净慧 : 现代体系化<br/>四阶次第·生活禅\n"
chanref_additions:
  note: 以下内容来自 docs/hy_refs/chanref.md 的系统研究，已交叉核证多个来源。
  daily_life_chan:
    title: 生活禅·净慧体系 (来自chanref.md详尽梳理)
    description: 净慧(1933-2013)，虚云法嗣兼祧五宗，生活禅创立者，柏林禅寺·四祖寺中兴住持。一岁半由父母送入尼庵，亲历云门事件，后遭15年劳改，1979年平反后任《法音》主编20年。
    core_principles:
    - '宗旨: 觉悟人生, 奉献人生 (1993年定)'
    - '原则: 在生活中修行, 在修行中生活'
    - '十六字纲宗: 发菩提心, 树般若见, 修息道观, 入生活禅 (2000年系统化)'
    - '四句要求: 将信仰落实于生活, 将修行落实于当下, 将佛法融化于世间, 将个人融化于大众'
    - '禅生活觉受: 专注·清明·绵密·轻安'
    - '六对目标: 尽责中求满足, 义务中求心安, 奉献中求幸福, 无我中求进取, 生活中透禅机, 保任中证解脱'
    - '二八方针(2006): 做人-信仰因果良心道德; 做事-感恩包容分享结缘'
    institutional_innovation:
    - '生活禅夏令营(1993起, 大陆最早): 面向青年学生, 7天禅修+讲座, 仅2008因奥运暂停一次'
    - '河北省佛学院(1998试办, 2001批准): 信·戒·学·修 四字方针'
    - '《中国禅学》学术年刊(2002创刊, 中华书局): 与北大楼宇烈教授合设怀云奖学金'
    - '传临济45世法卷予德国本笃禅修中心Willigis Jäger(2009): 禅宗脉入欧洲'
    books:
    - '《生活禅钥》(三联, 2008): 二十讲系统阐述, 有日译本(末木文美士序)'
    - 《入禅之门》《坛经一滴》
    - 《中国佛教与生活禅》(黄夏年编, 宗教文化出版社)
    - 《净慧长老全集》(多卷本·持续更新)
    sources:
    - 黄梅四祖寺编年事辑
    - 柏林禅寺官网
    - 2013年北大「净慧长老与生活禅」三机构联合研讨会纪要
    - 人文中国网·生活禅理论架构系统梳理
    - 《法音》·《禅》杂志
  expanded_academic:
    title: 学术脉络补充 (chanref 深度内容)
    topics:
    - title: 胡适-铃木大拙论战与「胡适禅学案」
      body: '1953年，胡适发表《禅宗在中国——它的历史与方法》，铃木大拙以《禅：答胡适博士》反驳。

        柳田圣山将往来文字编成《胡适禅学案》——历史考证能否触及「禅的本质体验」至今是方法论起点。

        胡适晚年曾质疑《虚云和尚年谱》中父亲任职记录的真实性，去信要求「拿证据来」，

        典型体现了历史考据学对传记材料的态度: 不否定修证经验，但要求证据检验。

        '
    - title: 宗密《禅源诸诠集都序》三宗三教与华严禅
      body: '宗密(780-841)，华严五祖，亦为禅宗荷泽宗法嗣。于《禅源诸诠集都序》中判禅三宗:

        ① 息妄修心宗(北宗神秀一系)

        ② 泯绝无寄宗(牛头·石头一系)

        ③ 直显心性宗(荷泽·洪州一系)

        配教三种(密意依性说相教·密意破相显性教·显示真心即性教)，

        以融合荷泽禅与华严宗为「华严禅」——此为后世华严-禅合流的直接经典源头。

        这一「三宗三教」说对理解海云继梦「教属华严、观属禅宗」的定位至关重要。

        '
    - title: 达摩《二入四行论》 — 禅宗修学体系的奠基文本
      body: '「理入」与「行入」是禅宗最早的系统修行纲领。

        行入四行: 报冤行·随缘行·无所求行·称法行。

        该文本本身即是敦煌出土写本——禅宗最早文献恰恰来自20世纪考古发现而非传统灯录传承。

        '
    - title: 批判佛教 — 松本史朗与袴谷宪昭
      body: '松本史朗(1985):「如来藏不是佛教」——认为如来藏「基体说」(dhātu-vāda)与「无我」「空」矛盾，

        因此「禅思想非佛教」。袴谷宪昭(1989)从曹洞宗内部部落民歧视问题切入，

        批判日本佛教「本觉观」丧失社会批判力，出版《本觉思想批判》《批判佛教》。

        中国现代佛学早有先声: 支那内学院吕澂立足印度唯识「性寂」批判《起信论》「性觉」框架

        ——这条批判路线与禅宗「直指人心、见性成佛」的如来藏预设构成正面交锋。

        '
    - title: 中国禅宗史学术专著 (1990s-2000s)
      body: '印顺《中国禅宗史》(1971, 1973年获日本大正大学博士学位)——部分为回应胡适「神会造坛经」说而作。

        洪修平《禅宗思想的形成与发展》(1992)

        杜继文·魏道儒《中国禅宗通史》(1993)

        葛兆光《中国禅思想史——从6世纪到9世纪》(1995)

        杨曾文《唐五代禅宗史》(1999)

        龚隽《禅史钩沉：以问题为中心的思想史论述》(2006)

        '
    references:
    - 柳田圣山编《胡适禅学案》
    - 宗密《禅源诸诠集都序》T48n2015
    - 达摩《二入四行论》(敦煌本·铃木大拙校刊)
    - 松本史朗《缘起与空》(1989)·袴谷宪昭《本觉思想批判》(1989)·《批判佛教》(1990)
    - 印顺《中国禅宗史》(正闻出版社, 1971)
    - 葛兆光《中国禅思想史》(北京大学出版社, 1995)
  chan_practice_expanded:
    title: 实修脉络补充
    topics:
    - title: 牛头宗与印顺的发现
      body: '印顺《中国禅宗史》为牛头宗单辟一章——

        牛头宗的「虚空为道本」「无心合道」融合江东玄学，

        是禅宗吸收中国本土形而上学的重要关节点。

        '
    - title: 临济·曹洞宗风
      body: '临济「三玄三要」(句中玄·意中玄·体中玄) + 「四料简」(夺人不夺境等)。

        曹洞「五位君臣」(正中偏·偏中正·正中来·兼中至·兼中到, 洞山良价创立)。

        海云继梦将「三玄」配修行三阶段: 句中玄=资粮道, 意中玄=正行, 体中玄=法身妙行。

        '
    - title: 禅净合流
      body: '「念佛是谁」本身即是禅净合流产物: 永明延寿→明末云栖袾宏/蕅益智旭

        → 清代丛林实际主流模式 → 虚云本人亦出身这一混合传统。

        所以把看话/默照当作独立二选一过于简化——

        近代大多数僧人的实修实际上是「参究+佛号」的混融状态。

        '
    - title: 圣严法师「中华禅法鼓宗」(2005)
      body: '将传统话头禅与默照禅整合进同一套四阶次第:

        散乱心→集中心→统一心→无心。每阶各有修行方法。

        把大慧与宏智八百年前的分歧直接合并入同一框架，不再视二者为互斥选项。

        圣严本人对禅宗流弊有清醒自省: 仅看公案语录未实修者，易落入不敬三宝、

        不忏悔不持戒的偏狂断见——与净慧提出生活禅的初衷相互呼应。

        '
