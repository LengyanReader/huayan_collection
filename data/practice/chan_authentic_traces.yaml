# ═══ 禅宗法脉传承 · 行法演进 — Diagram ═══
diagrams:
  lineage_evolution:
    title: 禅宗法脉传承与行法演进
    mermaid: |
      ```mermaid
      graph TD
        subgraph 印度源流
          BODHI[佛陀·灵山拈花<br/>Mahākāśyapa微笑] --> BODHI2[二十八代传至菩提达摩]
        end

        subgraph 中国禅宗奠基
          DAMO[菩提达摩?–536<br/>二入四行论·壁观] --> HUIKE[慧可487–593<br/>二祖·立雪断臂]
          HUIKE --> SENGCAN[僧璨?–606<br/>三祖·信心铭]
          SENGCAN --> DAOXIN[道信580–651<br/>四祖·守一不移<br/>开创东山法门]
          DAOXIN --> HONGREN[弘忍601–674<br/>五祖·东山法门确立]
        end

        subgraph 南宗分裂
          HONGREN --> SHENXIU[神秀606–706<br/>北宗·渐悟<br/>两京法主·三帝门师]
          HONGREN --> HUINENG[慧能638–713<br/>南宗·顿悟<br/>六祖·坛经]
        end

        subgraph 五家七宗_唐五代
          HUINENG --> NANYUE[南岳怀让677–744]
          HUINENG --> QINGYUAN[青原行思671–740]
          NANYUE --> MAZU[马祖道一709–788<br/>洪州宗·平常心是道]
          QINGYUAN --> SHITOU[石头希迁700–790<br/>石头宗]
          MAZU --> LINJI[临济义玄?–867<br/>临济宗·棒喝]
          SHITOU --> CAODONG[洞山良价＋曹山本寂<br/>曹洞宗·五位君臣]
          MAZU --> WEIYANG[沩山灵祐＋仰山慧寂<br/>沩仰宗·圆相默契]
          SHITOU --> YUNMEN[云门文偃864–949<br/>云门宗·一字关]
          SHITOU --> FAYAN[法眼文益885–958<br/>法眼宗]
        end

        subgraph 宋代禅_看话与默照
          LINJI --> DAHUI[大慧宗杲1089–1163<br/>看话禅·无字话头<br/>焚碧岩录刻板]
          CAODONG --> HONGZHI[宏智正觉1091–1157<br/>默照禅·只管打坐]
