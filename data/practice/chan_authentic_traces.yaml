  daily_life_chan:
    title: 生活禅·净慧体系 (来自chanref.md详尽梳理)
    description: "净慧(1933-2013)，虚云法嗣兼祧五宗，生活禅创立者，柏林禅寺·四祖寺中兴住持。一岁半由父母送入尼庵，亲历云门事件，后遭15年劳改，1979年平反后任《法音》主编20年。"
    core_principles:
      - "宗旨: 觉悟人生, 奉献人生 (1993年定)"
      - "原则: 在生活中修行, 在修行中生活"
      - "十六字纲宗: 发菩提心, 树般若见, 修息道观, 入生活禅 (2000年系统化)"
      - "四句要求: 将信仰落实于生活, 将修行落实于当下, 将佛法融化于世间, 将个人融化于大众"
      - "禅生活觉受: 专注·清明·绵密·轻安"
      - "六对目标: 尽责中求满足, 义务中求心安, 奉献中求幸福, 无我中求进取, 生活中透禅机, 保任中证解脱"
      - "二八方针(2006): 做人-信仰因果良心道德; 做事-感恩包容分享结缘"
    institutional_innovation:
      - "生活禅夏令营(1993起, 大陆最早): 面向青年学生, 7天禅修+讲座, 仅2008因奥运暂停一次"
      - "河北省佛学院(1998试办, 2001批准): 信·戒·学·修 四字方针"
      - "《中国禅学》学术年刊(2002创刊, 中华书局): 与北大楼宇烈教授合设怀云奖学金"
      - "传临济45世法卷予德国本笃禅修中心Willigis Jäger(2009): 禅宗脉入欧洲"
    books:
