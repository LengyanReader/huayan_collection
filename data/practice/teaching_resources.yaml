# ── 按主题分类讲法资源 ──
topics:
  - t: "📖 华严经讲记系列"
    d: "《华严经导读》(三册)《探玄记悬谈讲记》(四册)《世主妙严品》《光明觉品》《净行品》《贤首品》《明法品》《普贤三昧品》《普贤行品》《四圣谛品》等单品讲记。2006年11月-2010年6月北京广化寺《四十华严》全本讲记。"
    title_en: "📖 Avatamsaka Sutra Lecture Series"
    description_en: "Lecture notes on the Guide to the Avatamsaka Sutra (3 vols), the commentary on the Tanxuanji (4 vols), and individual chapter teachings (Shizhumiayan, Guangmingjue, Jingxing, Xianshou, Mingfa, Samantabhadra Samadhi, Samantabhadra Practices, Four Noble Truths). Complete lecture on the Forty-Fascicle Avatamsaka at Beijing Guanghua Temple, Nov 2006 - Jun 2010."
    yt: "华严经+海云继梦"
    bl: "华严经+海云继梦"

  - t: "🧘 禅修系列"
    d: "《禅修入门》(2020)《禅修正行——安那般那数息观》(2017)《禅修前行》《禅观概论》(2011)《禅，怎么参？》(2011)《华严禅行法》系列（含《禅修正行》《禅观》等辑）。核心: 安般守意·置心一处·三摩地次第。"
    title_en: "🧘 Chan Meditation Series"
    description_en: "Introduction to Meditation (2020), Chan Practice - Anapanasati Counting Breaths (2017), Preliminary Chan Practice, Outline of Chan Contemplation (2011), How to Practice Chan? (2011), and the Huayan Chan Practice series. Core: calming the mind through breath awareness, single-minded focus, progressive samadhi stages."
    yt: "海云继梦+禅修"
    bl: "海云继梦+禅修"

  - t: "🔮 密法系列"
    d: "《根本佛母——准提密法》(2020再版)《神圣的游戏场——华严密法》《生命密境——曼荼罗的世界》《深深密——密行指引》《悠活三昧》《本尊曾于此——十一面观音密法》。贤首宗本宗密法: 秽迹金刚法。"
    title_en: "🔮 Esoteric Practice Series"
    description_en: "Fundamental Mother Buddha - Cundi Esoteric Practice (2020 reprint), The Sacred Playground - Huayan Esoteric Practice, Mystic Life Realms - The World of Mandalas, Deep Secret - Guidance in Secret Practice, Living Samadhi, and The Deity Was Here - Eleven-Faced Avalokitesvara Esoteric Practice. The school's own esoteric art: the Ucchusma Vajra method."
    yt: "海云继梦+密法"
    bl: "海云继梦+密法"

  - t: "📕 三部曲"
    d: "《非常坛经》(4册·2004)《非常金刚经》《非常心经》——主张「要懂《心经》先懂《金刚经》，要懂《金刚经》先懂《坛经》」。三经共同构成修行理论体系。"
    title_en: "📕 The Unusual Trilogy"
    description_en: "The Unusual Platform Sutra (4 vols, 2004), The Unusual Diamond Sutra, and The Unusual Heart Sutra - holding that to understand the Heart Sutra one must first grasp the Diamond Sutra, and to grasp the Diamond Sutra one must start with the Platform Sutra. Together the three form a systematic foundation of practice theory."
    yt: "海云继梦+坛经+金刚经+心经"
    bl: "海云继梦+心经"

  - t: "👣 善财五十三参"
    d: "以《四十华严》（即《入法界品》）为本，逐参讲授。整套「制度性入门—果位对应」蓝图即是他解读善财童子在文殊菩萨座下修学历程时所展开的具体框架。"
    title_en: "👣 Sudhana's Fifty-Three Visits"
    description_en: "Taught visit by visit, grounded in the Forty-Fascicle Avatamsaka (the Entry into the Dharma Realm chapter). The blueprint relating institutional initiation to fruit-attainments is the framework he unfolds in interpreting Sudhana's pilgrimage under Manjushri."
    yt: "海云继梦+善财"
    bl: "海云继梦+善财"

  - t: "🌏 地藏/药师系列"
    d: "《开启灵性的钥匙》(上下·2018)《就从这里入法界——地藏菩萨行法》(2011)《转吧！地藏象限》(2018)《叩问药师佛的法界密码》(2018)《成佛方程式——药师经讲记》(2018)。"
    title_en: "🌏 Ksitigarbha / Bhaisajyaguru Series"
    description_en: "The Key to Awakening Spirituality (2 vols, 2018), Enter the Dharma Realm from Here - Ksitigarbha Practice (2011), Turn the Ksitigarbha Quadrant! (2018), Inquiring into the Dharma-Realm Code of the Medicine Buddha (2018), and The Equation of Buddhahood - Lectures on the Bhaisajyaguru Sutra (2018)."
    yt: "海云继梦+地藏+药师"
    bl: "海云继梦+地藏"

  - t: "🙏 净土/行愿系列"
    d: "《从极乐世界迈向永恒的生命——解弥陀经》(2011)《普贤十大愿王行法精要》(2011)《十大愿王修行法要》。华严与净土法门的会通。"
    title_en: "🙏 Pure Land / Vows Series"
    description_en: "From the Land of Bliss Toward Eternal Life - Exposition of the Amitabha Sutra (2011), Essentials of the Ten Great Vows of Samantabhadra Practice (2011), and The Essentials of Cultivating the Ten Great Vows. A convergence of the Huayan and Pure Land approaches."
    yt: "海云继梦+净土+普贤"
    bl: "海云继梦+普贤"

  - t: "💡 生活应用系列"
    d: "《认真最幸福》(2005)《看见幸福》(2006)《幸福就这样》(2006)《生命故乡的呼唤01——让心活起来》(2019)《幸福冏小孩》(2014)《我们只有一个选择》(2010)。围绕五大人生议题: 事业/健康/家庭/青少年/老人。"
    title_en: "💡 Life Application Series"
    description_en: "Being Earnest is the Happiest (2005), Seeing Happiness (2006), Happiness Is Like This (2006), The Call of Life's Homeland 01 - Awaken the Heart (2019), The Awkward Happy Child (2014), and We Have Only One Choice (2010). Centered on five life themes: career, health, family, youth, and the elderly."
    yt: "海云继梦+幸福+人生"
    bl: "海云继梦+人生"

  - t: "🆕 九九华严（2026最新）"
    d: "于台北国际会议中心(TICC)举行，为期五年，每月举办。定位: 将华严哲理转化为现代心理学与生命科学语言，回应AI时代挑战。新一季已「从传承走向新时代」，正式进入经文本文讲授。"
    title_en: "🆕 Ninety-Nine Avatamsaka (2026 Latest)"
    description_en: "Held monthly over five years at the Taipei International Convention Center (TICC). Its aim is to translate the Avatamsaka philosophy into the language of modern psychology and life sciences, responding to the challenges of the AI era. The new season has moved from heritage into a new age and now formally teaches the sutra text."
    yt: "九九华严+海云继梦"
    bl: "九九华严+海云继梦"

