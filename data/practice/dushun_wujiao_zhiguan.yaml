# 杜顺《华严五教止观》— 原文 · 各家注解 · 评注
# Dushun's "Five Teachings of Calming & Contemplation"
# 大正藏 T45n1867
# 最后更新: 2026-08-08

text_info:
  title: 华严五教止观
  title_full: 华严五教止观（一卷）
  author: 隋·杜顺禅师 (帝心尊者, 557–640)
  author_title: 华严宗初祖
  canon_ref: 大正藏 T45n1867
  dynasty: 隋 (Sui)
  cbeta_url: https://cbetaonline.dila.edu.tw/zh/T45n1867
  wikisource_url: https://zh.wikisource.org/wiki/華嚴五教止觀
  kanripo_url: https://www.kanripo.org/ed/KR6e0081/T/001
  significance: |
    《华严五教止观》是华严宗禅观修行的奠基性文本——杜顺以五重止观门
    （法有我无→生即无生→事理圆融→语观双绝→华严三昧）层层升进，
    从破我执到入法界缘起，建立了从初入到圆顿的修行总纲。
    此五门成为后世法藏「五教十宗」判教体系的禅观根基。

overview:
  opening_line: |
    行人修道，简邪入正，止观法门有五：
    一、法有我无门（小乘教）
    二、生即无生门（大乘始教）
    三、事理圆融门（大乘终教）
    四、语观双绝门（大乘顿教）
    五、华严三昧门（一乘圆教）
  structure_summary: |
    五门由浅入深：第一门破凡夫我执（界分别观），第二门破名相入空性，
    第三门明理事圆融（如来藏缘起），第四门遣言绝观直契真如，
    第五门入华严事事无碍法界。前四为方便，第五为究竟。

gates:
  - id: gate1
    name: 法有我无门
    name_en: "Gate 1: Dharma Exists, Self Does Not"
    panjiao: 小乘教 (Hīnayāna)
    practice: 界分别观（五停心观之一）
    original_text: |
      第一法有我无门。夫对病而裁方，病尽而方息。治执我之病，故有界分别之观。
      众生执我之病有二种：一者离身执我——谓外道所计，谓身内别有神我故。
      二者即身执我——谓凡夫所计，谓色身即是我之自体故。
      今破此二执，以四药治四病：
      一、色心分别——对治执身为「一我」者
      二、四大分别——对治执四大为我者
      三、五阴分别——对治执五阴为我者
      四、十二入分别——对治执十二入为我者
      如是四法，一一推求，皆无有我。人我既无，法我何有？
    commentaries:
      - source: 法藏《五教章》
        text: |
          法藏以「愚法二乘教」判此门——彼但知人空，未达法空。
          然杜顺于此门中已隐示「法空」之机：「人我既无，法我何有？」
          此即从小入大之转捩点。
      - source: 智俨《搜玄记》
        text: |
          智俨承杜顺衣钵，于《搜玄记》中将此界分别观摄入
          「十玄门」之因门——破执方能显性，遮诠即是表诠之基。
      - source: 海云继梦判摄
        text: |
          海云和上称此门为「封闭型心态的打开」——界分别观
          不是否定现象（色心、四大、五阴、十二入），而是
          看破「在这些组合中找不到一个固定不变的『我』」。
          这四药治四病法，核心在「解析→重组」：
          把粗的拆成细的，细到发现「没有那个我以为的我」。
    critical_notes:
      - author: 牟宗三《佛性与般若》
        text: |
          牟宗三指出：杜顺「法有我无」的遮诠策略与龙树中观
          的「缘起无我」有方法论上的亲和，但杜顺不破「法有」，
          只破「我执」，为后续「生即无生」的空性展开保留了
          必要的阶梯。此即华严「渐次引归圆顿」之教育智慧。

  - id: gate2
    name: 生即无生门
    name_en: "Gate 2: Arising is Non-Arising"
    panjiao: 大乘始教 (Elementary Mahāyāna)
    practice: 无生观 + 无相观（二观双运）
    original_text: |
      第二生即无生门。生即无生门者，就此门中，先简名相，后入无生门。

      （一）简名相者：随取一物征即得。今且就一枕上征。
      问：不违世间，唤作何物？答：是枕。
      问：复是何？答：是名。又问：此是何？答：是名相事。
      问：名相事复是何？答：由见闻熏习而成种，起名相事。
      ……智人唯见色法，不见名相。此简名竟。

      （二）入无生门：夫智人观色法者，且如色法。眼识得时实无分别，
      不是不得而无分别。此即是法眼识亲证如色无异。
      及其意识不了，妄计我，生假分别，倒见沉沦。
      ……是故证法无人。何以故？法无分别故。

      又开二观：
      一者无生观——法无自性，相由故生。生非实有，是则为空。
      空无毫末，故曰无生。经云「因缘故有，无性故空。」

      二者无相观——相即无相也。何以故？法离相故。
      一切法皆空，无有毫末相。

      前门则得人无我智。……此始教菩萨则得人法二空，亦名法无我智也。
    commentaries:
      - source: 法藏《金师子章》
        text: |
          法藏以金师子为喻释「生即无生」：师子（现象）由金（本体）而成，
          揽金成相，即有而空；金不守自性，即空而有。
          「以金收师子尽」，名相寂灭，唯金独存——
          此即杜顺「智人唯见色法，不见名相」之深化。
      - source: 澄观《华严经疏》
        text: |
          清凉澄观（华严四祖）将杜顺「简名相」与「入无生」二段，
          融入其三圣圆融观——文殊智（简名相之分析智）与
          普贤行（入无生之实践）一体不二。
      - source: 海云继梦判摄
        text: |
          海云和上特别重视「枕喻」的现代意义——
          「当你看到枕头时，真的看到『枕头』吗？还是只看到色法
          （颜色、形状、质感），然后意识加上『枕头』的标签？」
          此即「置心一处」的认知科学基础——
          停心就是停止意识的自动贴标签程序，回到眼识的纯知觉。
    critical_notes:
      - author: 方立天《法藏与金师子章》
        text: |
          方立天指出：杜顺「生即无生」的论证方法——从日常物品
          （枕）出发的层层追问——与西方现象学「现象学还原」
          （悬置自然态度，回到事物本身）有方法论上的可比之处。
          但杜顺的目的不是描述意识结构，而是证入「无生」的解脱境界，
          二者的终极取向有根本差异。
      - author: Peter N. Gregory (格里高利)
        text: |
          美国华严学者 Gregory 在《Tsung-mi and the Sinification of Buddhism》
          中指出：杜顺「简名相」的认知分析为宗密的「禅教融合」
          提供了认识论基础——名相是「教」的方便施设，
          「入无生」是「禅」的亲证境界。

  - id: gate3
    name: 事理圆融门
    name_en: "Gate 3: Phenomena and Principle Interpenetrate"
    panjiao: 大乘终教 (Final Mahāyāna)
    practice: 真如门（理）与心生灭门（事）的圆融观照
    original_text: |
      第三事理圆融门。夫事理两门圆融一际者，复有二门。
      一者心真如门，二者心生灭门。
      心真如门者是理，心生灭者是事。
      即谓空有二见，自在圆融，隐显不同，竟无障碍。

      言无碍者，指事理圆融也。夫事理者，理是真如，事是生灭。

      ○空有圆融：
      空是不碍有之空，即空而常有。
      有是不碍空之有，即有而常空。

      ○止观四句：
      以空而不有故名止。
      以空即有而不空故名观。
      空有全收，不二而二故，亦止亦观。
      空有互夺，二而不二故，非止非观。

      ○四句妙义（涅槃生死自在）：
      以有即空故，不住生死。
      以空即有故，不住涅槃。
      空有一块而两存故，亦住生死亦住涅槃。
      以空有相夺两不存故，非住生死非住涅槃。
    commentaries:
      - source: 智俨《孔目章》
        text: |
          智俨将杜顺「事理圆融」摄为「六相圆融」之总相与别相——
          理（总）= 真如平等一味，事（别）= 缘起森罗万象。
          总别相即，同异相入，成坏同时——六相齐观，即事理圆融之展开。
      - source: 法藏《大乘起信论义记》
        text: |
          法藏以《起信论》「一心开二门」整合此门：
          心真如门=理=不变=性起之体
          心生灭门=事=随缘=性起之用
          「不变随缘，随缘不变」即杜顺「理事圆融」的浓缩表达。
      - source: 宗密《原人论》
        text: |
          宗密以「本觉真心」会通理事——
          理即本觉之体（寂），事即不觉之相（动）。
          从不觉返本觉的过程，即是杜顺五门从「法有我无」
          到「华严三昧」的完整修行路径。
    critical_notes:
      - author: 吕澂《中国佛学源流略讲》
        text: |
          吕澂指出：《起信论》「一心二门」为华严理事圆融观提供了
          印度佛学与中国思维的交汇点——「理」的概念吸收了中国道家
          「道」的形上学意涵，但杜顺以「空有圆融」保持了中观
          不落二边的般若精神，使理事说既不失空性正见，
          又能正面展开大乘菩萨行的实践基础。
      - author: 镰田茂雄 (Shigeo Kamata)『中国華厳思想史の研究』
        text: |
          日本华严学泰斗镰田茂雄认为：「事理圆融门」是华严思想史上
          最具原创性的贡献之一——它将《起信论》的形上学架构与
          《华严经》的实践体系进行了创造性整合，开辟了从「空宗」
          （中观）到「性宗」（如来藏）的义理通途。

  - id: gate4
    name: 语观双绝门
    name_en: "Gate 4: Language and Observation Both Cease"
    panjiao: 大乘顿教 (Sudden Teaching)
    practice: 离言绝虑·言语道断·心行处灭
    original_text: |
      第四语观双绝门。夫语观双绝者，言语道断，心行处灭。
      经云「言语道断，心行处灭」。

      夫语者，言说也。观者，观照也。双绝者，俱泯也。
      何故须绝？真如妙理，非言所及，非心所缘。
      以言遣言，以观遣观。言观俱遣，方契真如。

      譬如有人，以指指月。智者因指见月，愚者执指为月。
      语观即指也，真如即月也。执语观者，如执指为月者也。
      故须双绝语观，方可契入真如。
    commentaries:
      - source: 宗密《禅源诸诠集都序》
        text: |
          宗密将此门配「禅三宗」之第二——「泯绝无寄宗」：
          「凡圣等法，皆如梦幻，都无所有，本来空寂，
          非今始无。……无佛无众生，法界亦是假名。」
          语观双绝即此宗的修行纲要——一切名相俱遣，
          连「遣除」本身亦遣。
      - source: 海云继梦判摄
        text: |
          海云和上以「置心一处」为语观双绝的操作化——
          「置心一处，无事不办。」守住风门，一切六尘不理会，
          言语自然断绝，观照自然放下。
          「一念不生，即名为佛」——顿教的全部秘密在此一句。
          不是不起念，是「不与念相应」。
    critical_notes:
      - author: 傅伟勋《从创造的诠释学到大乘佛学》
        text: |
          傅伟勋以「创造的诠释学」分析杜顺四→五的过渡：
          语观双绝（第四门）相当于「存有论的断裂」——
          从概念思维到亲证境界的跳跃无法用任何渐进逻辑完成，
          只能「顿」。这一认识与禅宗「顿悟」和天台「一念三千」
          构成中国佛教三种不同的「顿」模式。

  - id: gate5
    name: 华严三昧门
    name_en: "Gate 5: Huayan Samādhi"
    panjiao: 一乘圆教 (One Vehicle Perfect Teaching)
    practice: 海印三昧·因陀罗网·事事无碍法界
    original_text: |
      第五华严三昧门。……即一切法界，无尽缘起，重重无尽。
      犹如因陀罗网，珠珠相映，影现重重。
      一尘中见法界，一毛中现无量佛刹。
      此即华严三昧之境界。

      若有直见色等诸法从缘，即是法界缘起。
      故见色为法界缘起时，不必更观真如。
      何以故？即此色等诸法，举体是法界缘起，
      全体是真如故。是故见色即见心，见心即见佛。
    commentaries:
      - source: 法藏《华严经探玄记》
        text: |
          法藏将杜顺此门展开为「十玄门」与「六相圆融」：
          一即一切（同时具足相应门），一切即一（因陀罗网境界门），
          一摄一切（一多相容不同门），一切摄一（诸法相即自在门）……
          此即从杜顺「一尘中见法界」的直觉洞见，到法藏
          严密哲学体系的完成。
      - source: 李通玄《新华严经论》
        text: |
          李通玄以《易经》融会华严，将「华严三昧」与「太极」
          对应：一尘即太极，法界即无极而太极。
          李通玄的「东方智慧」解经路线为杜顺的禅观提供了
          中国本土哲学的诠释维度。
      - source: 海云继梦「普贤乘」
        text: |
          海云和上以「普贤乘」为华严三昧的实践展开——
          「一尘中见法界」不是玄想，而是禅定中的现量境界。
          从技术面（数随止）到工程面（观照凝），
          最终入海印三昧——万象影现，如大海印。
    critical_notes:
      - author: 木村清孝 (Kiyotaka Kimura)『東アジア仏教思想史の構築』
        text: |
          日本华严学者木村清孝认为：杜顺「见色即见心，见心即见佛」
          的三联结构，是华严「性起」思想的雏形——
          不是「心生万法」，而是「法法即性」。
          在法界缘起中，每一个现象都完整地呈现着整个法界的实相。
          「色→心→佛」不是因果关系，而是华严三昧中直观到的
          一体圆融。
      - author: "Francis Cook《Hua-yen Buddhism: The Jewel Net of Indra》"
        text: |
          美国学者 Francis Cook 以「因陀罗网」为核心意象，
          将华严三昧的哲学意涵引介到西方——
          每一颗宝珠都映现着所有其他宝珠，
          这不是比喻，而是华严对法界实相的直接描述。
          Cook 指出：这种「全息性」(holographic)世界观
          与当代物理学和文化生态学有深层对话空间。

lineage_development:
  title: 从杜顺五门到法藏五教——华严禅观的演进
  stages:
    - period: 隋 (c. 600 CE)
      figure: 杜顺 (557–640)
      contribution: 五教止观——以禅观实践为本的五门次第
      key_text: 《华严五教止观》(T45n1867)
    - period: 唐初 (c. 650 CE)
      figure: 智俨 (602–668)
      contribution: 将五门禅观融入「六相」「十玄」义学框架
      key_text: 《搜玄记》《华严经孔目章》
    - period: 盛唐 (c. 690 CE)
      figure: 法藏 (643–712)
      contribution: 「五教十宗」判教体系——从实践到教相的完成
      key_text: 《华严五教章》《探玄记》
    - period: 中唐 (c. 780 CE)
      figure: 澄观 (738–839)
      contribution: 综合杜顺-智俨-法藏，著《华严经疏》
      key_text: 《大方广佛华严经疏》
    - period: 晚唐 (c. 830 CE)
      figure: 宗密 (780–841)
      contribution: 禅教融合——五教止观与禅宗顿渐之会通
      key_text: 《禅源诸诠集都序》
    - period: 当代 (2000–)
      figure: 海云继梦 (1950–)
      contribution: 普贤乘——五教止观的当代修行实践体系
      key_text: 大华严寺修行体系 / YouTube讲经系列

