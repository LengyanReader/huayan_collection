sections:
- id: fx_overview
  title: 名相辨析与整体定位
  icon: 🔍
  intro: '法相唯识宗（唯识宗·慈恩宗·瑜伽行派·有相宗·五性宗）是汉传佛教史上

    教义体系最严密、也最具争议性的宗派之一。它既是一场持续千余年的哲学工程，

    也是一面映照「佛教中国化」张力的镜子：一个理论上最纯粹、最忠于印度原典的宗派，

    为何在中土仅两三传即告式微，又为何在千年之后成为近现代佛学复兴运动的旗帜？

    '
  topics:
  - title: 「法相」与「唯识」之辨
    body: '「法相唯识分宗」之辩由欧阳竟无最早提出：

      **法相学**阐明「是什么」——五位百法的存在论分类；

      **唯识学**阐明「为什么」——万法皆识所变现的成立论证。

      唯识可摄法相，而法相不能尽摄唯识。

      太虚大师反对割裂二者，主张法相、唯识本是一体两面。

      '
    source: 欧阳竟无《唯识抉择谈》· 太虚《佛法总抉择谈》
  - title: 别称与判教位置
    body: '因玄奘、窥基常住长安大慈恩寺，称**慈恩宗**；

      因源出印度瑜伽行派（Yogācāra），称**瑜伽宗**；

      因主张「识外无境」，称**有相宗**、**相宗**——

      与主张「缘起性空」的般若中观系（性宗/空宗）相对举。

      在汉传八大宗中，法相唯识与三论宗一起，是少数未被归入「性宗」阵营的宗派。

      日本「南都六宗」中，法相宗是唯一延续至今、仍有法脉活动的古宗之一。

      '
- id: fx_india
  title: 印度渊源
  icon: 🌏
  topics:
  - title: 弥勒—无著—世亲：学派的奠基
    body: '瑜伽行派尊弥勒菩萨（Maitreya，或历史人物「弥勒论师」）为初祖，

      实际的学派奠基者是四、五世纪的**无著**（Asaṅga）与异母弟**世亲**（Vasubandhu）。

      相传无著于禅定中上升兜率天，从弥勒受学《瑜伽师地论》《辨中边论》等「弥勒五论」。

      世亲原习说一切有部，著《俱舍论》，后经无著感化转入大乘，

      晚年造《唯识三十颂》（Triṃśikā）与《唯识二十论》（Viṃśatikā），

      以极精简的偈颂形式将唯识学说体系化——此后一切唯识论著共同的诠释母本。

      '
  - title: 世亲之后的分化：陈那因明与护法—安慧两系
    body: '世亲身后沿两条线索发展：

      ① **陈那**（Dignāga）开创佛教逻辑学（因明/量论），经**法称**（Dharmakīrti）发扬；

      ② 《唯识三十颂》注释传统在那烂陀寺形成**十大论师**（亲胜·火辨·德慧·安慧·难陀·净月·护法·胜友·胜子·智月）诠释群体。

      最重要分野：

      **护法**（Dharmapala）一系 = 「有相唯识」/「唯识今学」——相分具实在建构性，立「四分说」（见分·相分·自证分·证自证分）；

      **安慧**（Sthiramati）一系 = 「无相唯识」/「唯识古学」——更接近早期瑜伽行简朴形态。

      护法与中观自续派清辨之间有著名的「空有之诤」（二人未曾当面辩论），护法英年早逝仅三十二岁。

      这一「有相/无相」分野日后以戏剧性方式重现于二十世纪——

      藏传主要传承安慧一系，汉传主要传承护法一系。

      '
  - title: 那烂陀寺与戒贤
    body: '护法思想经弟子**戒贤**（Śīlabhadra）在那烂陀寺发扬光大。

      戒贤晚年即是玄奘在印度求法期间的授业恩师。

      那烂陀寺在七世纪已是全印度首屈一指的佛教学术中心。

      这段师承直接决定了此后汉传唯识学「独尊护法」的基本立场——

      也正因如此，近代学者才需借助藏译文献回溯安慧一系的原貌。

      '
- id: fx_lineage
  title: 汉传法脉传承
  icon: 📜
  topics:
  - title: 玄奘之前：真谛与「唯识古学」
    body: '玄奘之前，唯识学说已借**真谛**（Paramārtha，499-569）的翻译活动传入中国，

      形成「地论师」「摄论师」等学派，后世称「唯识古学」。

      真谛译本带有较强的如来藏化色彩（掺入「阿摩罗识」等独特诠释），

      与玄奘之后引入的护法系「唯识今学」在义理取向上颇有出入。

      '
  - title: 玄奘西行与《成唯识论》的编译
    body: '**玄奘**（602-664）归国后于显庆四年（659年）主持编译《成唯识论》。

      原计划将十大论师注释逐一全译，采纳窥基「以护法为宗，糅译诸家」建议，

      改为以护法之说为主线、糅合其余九家而成十卷定本，窥基「笔受」。

      学术细节：由于十家学说熔铸剪裁为一体，各家原说边界难辨，

      窥基疏释又以护法标准解读全书——《成唯识论》从一开始就是

      一部经过「护法化」处理、带鲜明立场的编译之作。

      吕澂通过梵藏文献比对对此做出尖锐揭示。

      '
  - title: 窥基：慈恩宗的实际创立者
    body: '**窥基**（632-682）出身鲜卑尉迟部，唐开国功臣尉迟敬德之侄。

      「三车和尚」传说（携金银·酒·美女三车出家）现代考辨认为历史依据薄弱——

      窥基自述出家因少年丧母、家世沧桑，《宋高僧传》只提及玄奘依相术之言劝其出家。

      窥基住大慈恩寺，世称「慈恩大师」，「百部疏主」，

      注疏数十种：《成唯识论述记》《大乘法苑义林章》《瑜伽论略纂》《因明入正理论疏》。

      古评：「奘师为瑜伽唯识开创之祖，基乃守文述作之宗」——

      现代学界多视窥基（而非玄奘）为法相唯识宗名副其实的创宗者。

      '
  - title: 圆测公案：西明系与慈恩系之争
    body: '**圆测**（613-696）出身新罗王族，三岁出家，十五岁入唐，

      早年师从法常、僧辩钻研真谛旧唯识，后又拜入玄奘门下，住长安西明寺。

      武则天曾尊为国师，新罗数请归国均未获准，圆寂后塔葬洛阳龙门香山寺。

      实质教义分歧在「五种姓说」：圆测所代表的**西明一系**持论宽和，

      接近「一切众生皆有佛性」主流；窥基弟子**慧沼**明确反对西明系，坚持「一分无性」。

      这场「西明与慈恩之争」最终以贴近中土佛性论主流的一方占优而告终。

      '
  - title: 慧沼、智周与传承的式微
    body: '**慧沼**（648-714）著《成唯识论了义灯》扶正窥基一系；

      **智周**（668-723）著《成唯识论演秘》。

      「唯识三疏」——《述记》《了义灯》《演秘》——是研习《成唯识论》的必读注本。

      智周之后中土师资传承渐趋模糊。会昌法难（845年）毁灭性打击后此宗传承断绝，

      近八百年仅有零星著作（元代云峰《唯识开蒙问答》），直至近代复兴运动重新接续。

      '
- id: fx_doctrine
  title: 核心教义体系
  icon: 📖
  topics:
  - title: 八识
    body: '眼耳鼻舌身「前五识」（感官识）→ 第六**意识**（统合思虑）→

      第七**末那识**（manas，恒执第八识见分为「自我」，我执根源）→

      第八**阿赖耶识**（ālayavijñāna，「藏识」，含藏一切种子，轮回与认知连续的根本依托）。

      前七识依阿赖耶识而生起、又反过来向其「熏习」种子——自我维持的因果循环。

      '
  - title: 三性三无性
    body: '**遍计所执性**：凡夫由名言概念虚妄计度而执取的「实我实法」，纯属妄想构造；

      **依他起性**：依托众缘和合而生的现象本身（识之相分见分），「后得智」境界；

      **圆成实性**：诸法的圆满真实体性（即真如），「根本智」所证境界。

      相应之**三无性**（相无性·生无性·胜义无性）呼应中观「空」义——

      这正是唯识学自称「中道」（唯识中道宗）而非单纯「有宗」的关键。

      '
  - title: 种子说
    body: '阿赖耶识中含藏无数「种子」（bīja），是一切现象生起的潜在功能。

      长期聚讼：「本有种子」（法尔本具）vs「新熏种子」（现行熏习形成）。

      《成唯识论》采取调和立场（本有新熏并存），

      但历代注疏对二者比重与运作机制的理解仍多分歧。

      傅新毅《识体与识变》以专章处理这一问题。

      '
  - title: 五位百法与转识成智
    body: '窥基据《瑜伽师地论》《百法明门论》将一切法归纳为「五位百法」：

      心法·心所法·色法·心不相应行法·无为法——分析一切存在的坐标系。

      修行终极目标是**转识成智**——通过转依（āśraya-parāvṛtti），

      将染污八识转化为「四智」（大圆镜智·平等性智·妙观察智·成所作智）。

      '
  - title: 五种姓说及其争议
    body: '依《瑜伽师地论》《成唯识论》，众生分五类：

      定性声闻·定性缘觉·定性菩萨·**不定种性**（可转向大乘）·**无种性**（「无性阐提」，永无出世无漏种子）。

      与竺道生以来「一切众生悉有佛性」的主流正面冲突。

      窥基的补救：佛性有「理佛性」（真如理性，众生平等）与「行佛性」（成佛功能种子，依五种姓而有差别）；

      「阐提」又分「断善根阐提」与「大悲阐提」（菩萨悲愿深重自愿不入涅槃）。

      陈寅恪：印度种姓观念渗入宗教证道体系，五种姓说是社会结构在修行论上的投影——

      恰恰最难被强调「人人皆可成佛」的中国社会接纳。

      任继愈：唯识宗式微的根本原因是「这一宗派不适合中国的需要」。

      '
  - title: 因明与「真唯识量」
    body: '**因明**（Hetuvidyā）由陈那系统化，经玄奘传入并与唯识学深度结合。

      玄奘在戒日王主持的曲女城无遮大会上立「真故极成色不离于眼识」一量

      （后世称「真唯识量」），十八日无人能破。

      此比量后世聚讼千年——窥基式因明研究与西方逻辑学检验两种路径并存。

      吕澂、熊十力等近代学者均撰文讨论玄奘所用「简别语」（「自许」）的精妙。

      '
  - title: 五重唯识观：修行次第
    body: '窥基《大乘法苑义林章》提出由浅入深的观行次第：

      ① 遣虚存实识——遣遍计所执虚妄，存依他起圆成实（空有相对观）

      ② 舍滥留纯识——舍相分，唯留见分等三分（心境相对观）

      ③ 摄末归本识——摄见相分归结于自证分（体用相对观）

      ④ 隐劣显胜识——隐心所显心王（王所相对观）

      ⑤ 遣相证性识——遣除唯识事相，证入真如（事理双泯）

      前四重为「有漏观境」（资粮位·加行位），第五重为「无漏观境」（见道后）。

      唯识学从来不是纯粹思辨的概念游戏，而是可落实于止观禅修的操作性框架。

      '
    source: 窥基《大乘法苑义林章》·《摄大乘论》·《成唯识论》
- id: fx_decline
  title: 演变与式微
  icon: 🍂
  topics:
  - title: 式微的四大原因
    body: '法相唯识宗拥有最庞大的国家译经资源、最高的皇室礼遇（玄奘被视为「国宝」），

      却是汉传八大宗中传承中断最早、最彻底的一支。综合近代学者（任继愈）及教界反思（济群法师）：

      ① **义理体系过于庞杂精密**——「繁博精严，牵一发而动全身」，六经十一论、三类境、五种姓动辄聚讼千年，门槛过高；

      ② **五种姓说与中土佛性论主流的深层冲突**——「一阐提永不成佛」与「一切众生皆有佛性」正面抵触；

      ③ **翻译语言的「异质性」**——因明论式、梵文名相音译对中国士人陌生疏离；

      ④ **会昌法难的物理性打击**——长安是核心据点，典籍·译场·僧团被毁；

      同时期禅宗、净土宗因「简易直捷」民间基础稳固，受冲击较小，此消彼长加速唯识宗边缘化。

      概言之：「高度印度化的义理体系」与「要求本土化、简易化的中国宗教市场」之间结构性错位。

      '
- id: fx_overseas
  title: 域外传播：法脉的分流
  icon: 🌐
  topics:
  - title: 日本法相宗
    body: '四次传入，形成「南寺传」与「北寺传」两支：

      第一传 653年 道昭 亲从玄奘 → 元兴寺（南寺传）

      第二传 658年 智通·智达 → 元兴寺（南寺传）

      第三传 703年 智凤·智鸾·智雄 师承智周 → 兴福寺（北寺传前身）

      第四传 717年 玄昉 师承智周 → 兴福寺（北寺传）

      法相宗是日本「南都六宗」之一，奈良·平安时代影响力最大。

      北寺传弟子善珠被尊为「慈恩大师之后身」，与南寺传「护命」一起与天台最澄、真言空海论战。

      现以奈良**兴福寺**与**药师寺**为大本山，是南都古宗中少数延续至今者。

      京都清水寺独立为「北法相宗」，法隆寺演变为「圣德宗」。

      '
  - title: 新罗与高丽
    body: '圆测门下弟子**道证**归国弘传，再传弟子**太贤**在新罗系统整理法相宗义。

      圆测终身未能归国、塔葬洛阳龙门香山寺——这座中国寺院被尊为「韩国唯识宗祖庭」，

      圆测被誉为「**海东瑜伽之祖**」——法脉认同超越地理疆界的典型案例。

      '
  - title: 藏传「唯识见」：另一条法脉
    body: '藏传「宗义书」（grub mtha''）体系中，唯识被置于毗婆沙、经部之上，

      但仍在中观（尤其应成派）之下，被视为尚未究竟了义的「权说」——

      与华严「五教」判唯识为「大乘始教」结构相似。

      **传承内容分野**：藏传主要继承**安慧**（无相唯识/古学）一系，

      其代表论著在中国久已失传，反完整保存于藏文大藏经；

      汉传独尊**护法**（有相唯识/今学）一系。

      「唯识学」在汉藏两大传承中实际对应两种不同义理形态。

      八世纪寂护（Śāntarakṣita）开创「**随瑜伽行中观**」，

      融合唯识心识分析与中观究竟空义，成为宁玛派早期教法重要资源。

      '
- id: fx_revival
  title: 近现代复兴运动
  icon: 🔥
  topics:
  - title: 杨仁山与金陵刻经处
    body: '**杨仁山**（1837-1911，号「深柳大师」）是「近代佛教先觉者」。

      1866年创办**金陵刻经处**——近代中国第一家由居士创办、融雕版印刷与佛学研究于一体的机构。

      赴日访得大量中国本土散佚的唯识典籍（窥基·慧沼·智周重要疏释），刻印流通，

      使绝响千年的法相唯识学重获文本基础。

      1908年办「祗洹精舍」、1910年办佛学研究会，培养出太虚、欧阳竟无。

      梁启超：「今代治佛学者，殆无一不与佛学有关系，而凡有真信仰者，率归依文会。」

      '
  - title: 欧阳竟无与支那内学院
    body: '**欧阳竟无**（1871-1943，名渐）1922年创办**支那内学院**，

      吸引梁启超、梁漱溟、熊十力、汤用彤从学。

      核心方法「**简别体用**」：体是体，用是用，不生不灭为体、生灭变化为用；

      而《起信论》《楞严经》「真如缘起」传统「用从体起、即体即用」混淆体用分际。

      《唯识抉择谈》公开质疑《起信论》义理乃至真实性，

      提出「法相与唯识分宗」说，主张回归印度唯识学本来面目。

      '
  - title: 韩清净与三时学会：「南欧北韩」
    body: '**韩清净**（1884-1949）1921年发起「法相研究会」，1927年改组为**三时学会**，

      与欧阳竟无并称「**南欧北韩**」。

      治学对比：欧阳「不在逐字寻求其来源，而在扼其大意」重义理综观；

      韩清净「精兵主义」，字字有据、句句溯源，

      晚年积毕生之力撰百万言《瑜伽师地论科句披寻记》，

      以严谨文献学方法校订唯识根本论典的文句舛误与章节错简。

      '
  - title: 太虚与「三宗判」
    body: '**太虚**（1889-1947）反对内学院「独尊唯识」立场，1922年创办**武昌佛学院**。

      提出「**三宗判**」：法性空慧宗（般若中观）·法相唯识宗·法界圆觉宗（如来藏系），

      主张三宗「平等无二，唯建言与制行门径不同」。

      《佛法总抉择谈》正面批驳欧阳竟无对《起信论》的否定。

      此「三宗判」后经印顺修订为「三系说」，成为二十世纪汉语佛学史上影响最深远的判教框架之一。

      '
  - title: 熊十力《新唯识论》公案
    body: '熊十力早年从学欧阳竟无，1932年出版《新唯识论》——

      提出「体用不二」本体论，以「翕辟成变」描述本体流行，实为融摄儒道的一元论哲学体系，

      日后被视为「新儒家」奠基之作。

      内学院视之为对唯识学根本误读：欧阳竟无作序，命刘衡如撰《**破新唯识论**》；

      熊十力随即撰《**破破新唯识论**》回应：「吾爱吾师，尤爱真理」。

      吕澂与熊十力晚年书信论辩往复十七封，整理为《辩佛学根本问题》。

      这场公案是「唯识学作为严格印度佛教哲学」vs「唯识学作为中国思想家重构以回应现代性的资源」两种取向的正面碰撞。

      '
  - title: 世俗知识分子的挪用
    body: '龚自珍、谭嗣同援用因明三支比量与唯识概念；

      章太炎以唯识三性·四分·八识建构「以唯识为宗」的思想体系，

      尝试融通《庄子·齐物论》，将因明与西方逻辑学、《墨经》比较；

      梁启超以法相唯识学阐述「佛教心理学」，与康德、马赫会通。

      「援佛入哲」思潮构成近代中国思想史独特插曲。

      '
- id: fx_practice
  title: 修行界与内部视角
  icon: 🧘
  topics:
  - title: 印顺法师的三系判摄
    body: '印顺（1906-2005）在太虚「三宗判」基础上修订提出「**三系判摄**」：

      **性空唯名论**（《般若经》·中观）·**虚妄唯识论**（《摄大乘论》·《成唯识论》）·**真常唯心论**（楞伽·胜鬘·华严·起信论）。

      印顺将「真常唯心系」判为佛教思想史上较晚出现、为「摄化神我外道思想」而生的「方便说」，

      非究竟了义——中国佛教除三论、唯识外几乎都属于这一系统。

      牟宗三批评「宗派作祟」，认为中国佛教诸宗恰恰是印度佛教合乎逻辑的历史延展，

      《起信论》「真常心」体系正是解决「虚妄阿赖耶识如何保证成佛必然性」的必要环节。

      印顺回应：不认同内学院「起信论纯属伪说」的强硬立场——

      占据「唯识纯粹派」与「如来藏辩护派」之间的第三重位置。

      '
  - title: 唯识在僧伽教育中的位置
    body: '尽管独立「宗派」意义上的法相唯识宗早已没有严格法脉传灯，

      但唯识学的**义理教育**因近代复兴重新扎根于教内建制——

      自太虚倡导以来，唯识学被确立为佛学院教育必修课程。

      中国佛学院、闽南佛学院等普遍将《成唯识论》《唯识三十论》《百法明门论》列入核心课程。

      唯识学作为精密心识分析工具，已渗透进整个汉传佛教僧伽教育的知识基座。

      '
  - title: 济群法师与「三级修学」
    body: '当代实践个案：**济群法师**（1962年生，苏州西园寺戒幢佛学研究所所长）创立「三级修学」。

      以「皈依、发心、戒律、正见、止观」五要素为核心，分初中高三级。

      高级阶段以《唯识三十论》为起点——「了解妄心差别，认识唯识中道见及唯识学的修证次第」，

      随后进入般若中观与禅宗修学。

      济群反思：「唯识宗因缺乏汉文化的基础，仅传两三代便湮没无闻」；

      天台华严「证法传承未能完整沿袭」「有教无观」；

      唯有禅净因「解行简单」得以普及。

      '
  - title: 教界内部的张力
    body: '近现代教界内部四条并行路线：

      **内学院式印度纯粹主义**（欧阳竟无·韩清净——回归梵文原典，批判中国化教义）

      **太虚式综合平等主义**（各宗平等，以人生佛教为归趋）

      **新儒家式哲学重构主义**（熊十力——借唯识之名行儒学重建之实）

      **印顺式历史批判主义**（以印度佛教思想史演进逻辑重新安放中国佛教诸宗位置）

      这四条路线之间的对话与冲突，构成理解「唯识学在现代中国教界处境」的基本坐标。

      '
- id: fx_academic
  title: 学术视角：现代研究方法论与前沿争议
  icon: 🎓
  topics:
  - title: 西方学界：现象学诠释与唯心论之争
    body: '**丹·卢斯特豪斯**（Dan Lusthaus）2002年《佛教现象学》（*Buddhist Phenomenology*）：

      经典瑜伽行派不应被诠释为形而上学「唯心论」（idealism），

      而应理解为关于苦、无我、无常与解脱等经典佛教问题的「现象学与认识论式探究」——

      方法上更接近胡塞尔、梅洛-庞蒂，而非贝克莱、康德。

      「反唯心论」诠释路径在西方学界引发持续辩论：

      Waldron等高度评价，也有学者主张唯识学恰恰应理解为佛教式唯心论。

      **威廉·瓦尔德伦**（William Waldron）开辟唯识学与认知科学对话进路——

      《佛教的无意识》（2003）与《只是心而已》（*Making Sense of Mind Only*, 2023），

      将阿赖耶识类比为「文化无意识」（cultural unconscious）。

      '
  - title: 汉语学界复兴与五大公案
    body: '近三十年汉语唯识学研究进入「大时代」。

      九十年代台湾·香港与国际接轨（叶阿月·陈荣灼·林镇国·释惠敏·邓伟仁·姚治华等）；

      大陆2000年前后涌现：程恭让（2000）·周贵华（2004·2009）·圣凯（2006）·傅新毅（2006）·杨维中（2008）。

      五大公案：

      ① 新旧二译之辩（梅光曦·太虚 vs 守培·印顺，1931-32）——真谛古学与玄奘今学关系

      ② 真如缘起说之批判（欧阳竟无 vs 太虚·王恩洋，延及熊十力）——唯识学与《起信论》如来藏学关系

      ③ 相见同别种之辩（景昌极1928·缪凤林·太虚，霍韬晦1963深化）——见分相分种子是否同一

      ④ 空有之争（杨仁山·太虚·周叔迦「语诤意同」 vs 法尊·印顺「实有诤论」）

      ⑤ 真如能否为疏所缘缘（黄居素1924 vs 王恩洋·吕澂）

      '
- id: fx_masters
  title: 海云·成观两位法师的阐释与评述
  icon: 🌊
  topics:
  - title: 海云继梦法师论唯识
    body: '**「唯识(缘起法界)」与「唯性(性起法界)」的判摄**: 海云法师将佛法「唯心」分为两部分——唯识研究缘起法界(典型如《地藏经》: 「起心动念无不是业无不是罪」),
      华严研究唯性即性起法界(「无不是普贤境界」)。唯识偏向现象界、有为法, 修行目标寂灭涅槃; 性起法界重视常乐我净, 破无明证法身。修行须「转唯识成唯性」——此即《起信论》「一心生二门」的运用。


      **对唯识宗的批评**: 「唯识的空壳子理论却一直很盛行」「纯属学者之见, 缺乏修行的实践经验」——欲以有为行成就无为境, 「纵经尘劫、无有是处」。中国唯识宗「先天不良、闹双胞,
      新旧唯识皆为了必也正乎名, 而闹了一千五百年」, 千五百年来唯识宗未曾有人提出转识成智的实修心得。


      **转识成智的实修进路**: 在「住」的第二念中转——「泯『住』的第二念, 以成『生』的第一念」。第二念中分为八识, 第一念中分为四智或五智。华严禅的特胜处是在「话头」中直接导入萨婆若海——第一念中无转无成,
      唯是「看住」与「欣赏」。


      **转三性为三无性(如来圣性观)**: 「舍识用根、转识成智的具体修法」——遍计所执性的情有性转理无性, 依他起性的假有性转性无性, 圆成实性的实有性转相无性。此为「工程浩大的生命改造工程」,
      非名词而是行法。批评「修到大圆镜智现前即是究竟成就」的说法是患了圆成实性的宿命。引空海《十住心论》: 「大乘始自法相弥勒, 经法性文殊、观音到华严之普贤而入毗卢性海与十大愿王合。」'
    source: 《菩萨问明品讲记》第二章(wuming.xuefo.net) ·《心法 转识成智》(fjdh.cn 2013) ·《密法 转三性为三无性》(wmxf.net)
      ·《看念头》
  - title: 成观法师论唯识
    body: '**「唯识」之义**: 「唯=唯有; 识=心识, 即八种识」——一切法皆是心识所变现, 主观之见分与客观之相分皆是八识所变, 故说「唯识无境」。与《华严经》「三界唯心、万法唯识」、《楞伽经》「自心现量」一致,
      性相二宗之理相通。


      **阿赖耶识三藏**: ①能藏=持种功能; ②所藏=受薰功能; ③执藏=「我爱执藏」——第七识念念执第八识为自内我, 阿赖耶为「我执」之库房。以银行账户比喻:
      善业多则余额多, 恶业多则透支负债。「异熟识」比喻为「窝藏人犯、收购赃物」, 「扫黑」即清净业识。


      **唯识学的修证旨趣**: 基本骨干是「修善断恶」(六根本烦恼+二十随烦恼), 最终趣「六无为法」中的真如无为——即世亲《唯识三十论颂》所说「唯识实性」,
      亦即圆成实性。


      **研读次第建议**: 先《大乘百法明门论》→《大乘广五蕴论》→《因明入正理论》→《唯识三十论颂》→《八识规矩颂》→《观所缘缘论》→《六离合释》→《俱舍论》→《解深密经》→《瑜伽师地论》→《摄大乘论》。


      **《楞伽经义贯》的转识说**: 「诸圣因于妄法不分别, 能转变八识现行习气及根本无明种子之性, 将妄想自性转变为真如自性」——「一切自性习气、藏意意识见习转变,
      名为涅槃」, 「转变」处涅槃与真如一体异名。'
    source: 《唯识三十论颂义贯》第一·三章(xuefo.net) ·《八识规矩颂义贯》相宗系列总序(fjdh.cn 2013) ·《楞伽阿跋多罗宝经义贯》卷二(fjdh.cn)
