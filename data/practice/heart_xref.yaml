  "入禅九阶":
    title_en: "The Nine Stages of Entering Chan"
    r1_huayan: |
      ◆ 体系总览·三阶段: 资粮道→前行→正行。入禅九阶涵盖资粮道至前行初期。
      ◆ 华严初祖·杜顺《五教止观》五重次第(CBETA T45n1867): 法有我无门→生即无生门→事理圆融门→语观双绝门→华严三昧门。
      ◆ 华严二祖·智俨《搜玄记》(CBETA T35n1732): 十玄门。
      ◆ 华严三祖·法藏《金师子章》十门(CBETA T45n1880): 明缘起→辨色空→约三性→显无相→说无生→论五教→勒十玄→括六相→成菩提→入涅槃。
      ◆ 华严四祖·澄观·五祖宗密·宋代子璿·净源: 一脉相承的华严修行阶次。
    r1_huayan_en: |
      ◆ Overview of the system — three stages: the path of accumulating merit → the preliminary path → the main practice. The nine stages of entering chan span from the path of accumulating merit to the beginning of the preliminary path.
      ◆ Du Shun, first Huayan patriarch, "Cessation of Concepts in the Five Teachings" — the fivefold progressive stages (CBETA T45n1867): dharma exists, self does not → arising is already non-arising → the mutual fusion of affairs and principle → the severance of both words and contemplation → the samādhi-gate of Huayan.
      ◆ Zhiyan, second Huayan patriarch, "Searching for the Profound Meaning" (CBETA T35n1732): the ten mysterious gates.
      ◆ Fazang, third Huayan patriarch, "Treatise on the Golden Lion" — ten gates (CBETA T45n1880): clarifying dependent arising → discerning form and emptiness → reckoning the three natures → revealing the signless → speaking of the unproduced → discussing the five teachings → gathering the ten mysterious gates → embracing the six marks → accomplishing bodhi → entering nirvāṇa.
      ◆ Chengguan, fourth patriarch; Zongmi, fifth patriarch; and the Song dynasties' Zi Xuan and Jing Yuan: a single transmitted lineage of Huayan stages of cultivation.
    r1_source: "T45n1867 五教止观 · T35n1732 搜玄记 · T45n1880 金师子章 · 澄观/宗密/子璿/净源"

    r2_other: |
      ◆ 天台·六即佛(CBETA T46n1911 摩诃止观): 理即→名字即→观行即→相似即→分证即→究竟即。入禅九阶属「观行即」实操展开。智者:「所行如所言,所言如所行。」
      ◆ 大乘·《华严经·十地品》(CBETA T10n0279): 欢喜地至法云地,与海云判摄形成完整对照链。
