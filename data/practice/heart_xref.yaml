      ◆ 华严二祖·智俨《搜玄记》(CBETA T35n1732): 十玄门。
      ◆ 华严三祖·法藏《金师子章》十门(CBETA T45n1880): 明缘起→辨色空→约三性→显无相→说无生→论五教→勒十玄→括六相→成菩提→入涅槃。
      ◆ 华严四祖·澄观·五祖宗密·宋代子璿·净源: 一脉相承的华严修行阶次。
