      ◆ Chan · Mazu Daoyi (Hongzhou school): "The ordinary mind is the Way. What is the ordinary mind? Without contriving, without right and wrong, without grasping and rejecting, without permanence and extinction, without saint and commoner" ("Jingde Chuandeng Lu," juan six). To cultivate in everyday ordinariness—precisely the spiritual source of the article's "do not flee from activity."
      ◆ Chan · Huangbo Xiyun's "Essential Dharma of Transmitting the Mind" (CBETA T48n2012A): "Recognize the original mind amid seeing, hearing, awareness and knowing; yet the original mind does not belong to seeing, hearing, awareness and knowing, nor is it apart from them. Only do not form views on seeing, hearing, awareness and knowing, nor stir thoughts within them." Not departing from daily functioning yet not turned by circumstances—not losing the original mind amid the turbulence.
      ◆ Mahāyāna · "Vimalakīrti Sūtra" (CBETA T14n0475): "Without entering the great sea of afflictions, one cannot obtain the treasure of all-knowledge." One enters nirvāṇa without cutting off the afflictions.
      ◆ Daoist · "Zhuangzi, Recorded in the Human World": when Zi Gao asked Confucius, Confucius answered: "Ride things and wander the mind; make use of what cannot be helped to nurture the center—this is supreme." Without leaving the world's turmoil, one wanders the mind and nurtures the center.
      ◆ Daoist · "Zhuangzi, Autumn Floods": "One who knows the Way must reach principle; one who reaches principle must understand adaptation; one who understands adaptation does not let things harm him." Responding to change without clinging—the Daoist version of walking, dwelling, sitting and lying as all chan.
      ◆ Confucian · Dong Zhongshu's "Chunqiu Fanlu": "Make upright one's righteousness without seeking benefit; illuminate the Way without reckoning merit."—correcting the mind and illumining the Way without avoiding worldly affairs, corresponding to the article's spirit of cultivating within, not apart from, the world.
