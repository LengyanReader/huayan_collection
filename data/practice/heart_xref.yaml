    r2_other: |
      ◆ 天台·智者大师《小止观》调和第四(CBETA T46n1915): 「行者修习,善调五事,必使和适,则三昧易生。」调身——「不宽不急,是身调相。」调息——息有四相(风喘气息),「守风则散,守喘则结,守气则劳,守息即定。不涩不滑,是调息相。」调心——治沉浮宽急,「不沉不浮,是心调相。」身息心三事「的无前后,随不调者而调适之。」与本文调身调息调心体系完全互证。
      ◆ 禅宗·《六祖坛经》坐禅品(CBETA T48n2008): 「外于一切善恶境界,心念不起,名为坐;内见自性不动,名为禅。」「外离相为禅,内不乱为定。」坛经之禅定不在形躯而在心性——但惠能同时批判「空心静坐,百物不思」的枯禅(与本文「不能用大脑」非弃绝思维而是转向身体感知,有对应之妙)。
      ◆ 道家·庄子心斋: 《庄子·人间世》:「若一志,无听之以耳而听之以心,无听之以心而听之以气。听止于耳,心止于符。气也者,虚而待物者也。唯道集虚。虚者,心斋也。」「听之以气」即甩开意识思维,归于气息感知——与本文「不能用大脑,用身体感知」异曲同工。郭象注:「遗耳目,去心意,而付气性之自得。」
      ◆ 道家·列子·心凝形释: 《列子·黄帝》:「心凝形释,骨肉都融,不觉形之所倚,足之所履。」与停心后身心消融的状态相通。
      ◆ 儒家·《大学》知止: 「知止而后有定,定而后能静,静而后能安。」知止即大脑停歇——与「不能用大脑」的先秦儒学源头遥相呼应。
      ◆ 瑜伽·Pratyahara(制感): Patanjali《瑜伽经》2.54-55: 感官从外境收摄向内,如心之本形——对应本文从「大脑外驰」转向「身体内觉」。
    r2_other_en: |
      ◆ Tiantai · Zhiyi's "Lesser Samatha-Vipaśyanā", chapter four on harmonizing (CBETA T46n1915): "When the practitioner cultivates well and harmonizes the five matters so that they are agreeable, samādhi arises easily." Regulating the body—"neither tense nor slack is the mark of a well-regulated body." Regulating the breath—the four marks (wind, gasping, coarse, fine): "to hold to wind is to scatter, to hold to gasping is to bind, to hold to coarse is to weary, and to hold to fine is to be settled; neither rough nor smooth is the mark of well-regulated breath." Regulating the mind—governing heaviness, flightiness, tension and slackness: "neither sunken nor floating is the mark of a well-regulated mind." The three matters of body, breath and mind "have in truth no before and after; one harmonizes whichever is unregulated." This fully corroborates the article's system of regulating body, breath and mind.
      ◆ Chan · "Platform Sutra of the Sixth Patriarch", chapter on sitting meditation (CBETA T48n2008): "Not to raise thoughts amidst all external good and evil realms is called sitting; to see the self-nature within as unmoving is called chan." "To be free of marks without is chan; to be unconfused within is concentration." The platform's meditation concerns mind-nature rather than the physical posture — yet Huineng also condemns "empty-minded sitting in stillness, thinking of nothing," which parallels the article's point that "don't use the brain" is not the rejection of thought but a turn toward bodily awareness.
      ◆ Daoist · Zhuangzi's "fasting of the mind" ("Recorded in the Human World"): "Unify your will; do not listen with the ear but with the mind; do not listen with the mind but with the vital breath. Listening stops at the ear, the mind stops at what tallies. The vital breath is empty and awaits things; the Way alone gathers in emptiness. Emptiness is the fasting of the mind." To "listen with the vital breath" is to cast off discursive thought and return to the perception of the breath — the same intent as the article's "don't use the brain; perceive with the body." Guo Xiang's commentary: "discard the ears and eyes, set aside the mind and will, and entrust oneself to the spontaneity of breath-nature."
      ◆ Daoist · Liezi's "mind congealed, body dissolved" ("Yellow Emperor" chapter): "The mind congealed and the body dissolved, bones and flesh all melted, unaware of what the body leans on or what the feet tread." This corresponds to the dissolution of body and mind after the mind is stilled.
      ◆ Confucian · "Great Learning": "When one knows where to rest, one becomes settled; settled, one becomes calm; calm, one becomes at ease." Knowing where to rest is the halting of the brain — an early Confucian echo of "don't use the brain."
      ◆ Yoga · Pratyāhāra (withdrawal of the senses): Patanjali's Yoga Sūtras 2.54–55: the senses are drawn inward from external objects, back to the original form of the mind — matching the article's shift from the mind's outward rushing to inner bodily awareness.
    r2_source: "CBETA T46n1915 · T48n2008 ·《老子》《庄子》《列子》《大学》·《瑜伽经》2.54"

  "四段呼吸":
    title_en: "The Four-Phase Breath"
    r1_huayan: |
      ◆ 安那般那数息观(数·随·止): 禅观法要·技术面详解。数法1→10循环;随法注意「息入尽」与「息出尽」每一细节。本文「四段呼吸——息入·息住·息出·息停」对应随法对呼吸全过程的精细觉知。
      ◆ 华严三祖·法藏《妄尽还源观》(CBETA T45n1876): 第二门「依体起二用」中,海印三昧心如大海澄净万象影现——此澄净之用,以息之细密调柔为入门方便。法藏云:「言海印者,真如本觉也。妄尽心澄,万象齐现。」调息至「息相」(出入绵绵若存若亡)即是「妄尽心澄」的前行基础。
      ◆ 息之四相: 从粗至细——风→喘→气→息,四段呼吸的清晰觉知正是从「气相」趋入「息相」的关键。
    r1_huayan_en: |
      ◆ Ānāpāna counting and following the breath (counting, following, stopping): treated in detail in the section on meditation technique. The counting method runs in a I→10 cycle; the following method attends to every detail of "the end of the in-breath" and "the end of the out-breath." The article's "four-phase breath—in, dwell, out, pause" corresponds to the following method's fine awareness of the entire course of the breath.
      ◆ Fazang, third Huayan patriarch, "Contemplation on Returning to the Source and Wiping Away Delusion" (CBETA T45n1876), the second gate, "relying on the essence to give rise to the two functions": in the samādhi of the ocean-seal, the mind is like a vast calm ocean in which all appearances are reflected — and this lucidity is entered through the gateway of a breath made subtle and gentle. Fazang says: "By 'ocean-seal' is meant true suchness, the fundamental awakening. When delusion is exhausted and the mind clarified, the myriad appearances appear together." To regulate the breath until it reaches the "fine breath mark" (the coming and going become faint and almost imperceptible) is the preparatory basis for "delusion exhausted, mind clarified."
      ◆ The four marks of the breath: from coarse to fine — wind → gasping → coarse → fine; clear awareness of the four-phase breath is precisely the key to passing from the "coarse mark" into the "fine mark."
    r1_source: "禅观法要→安那般那数息观· 调息息之四相 · T45n1876 妄尽还源观"

    r2_other: |
      ◆ 天台·《小止观》息之四相(CBETA T46n1915): 「不声不结不粗,出入绵绵,若存若亡,资神安稳,情抱悦豫——此是息相也。守风则散,守喘则结,守气则劳,守息即定。」海云和上息之四相全出于此。
      ◆ 南传·安那般那念(MN 118): 十六阶段安般念从「知入息长」到「观灭·观舍」，与四段呼吸有对应的微观觉照结构。
      ◆ 道家·《抱朴子》胎息: 「得胎息者,能不以鼻口嘘吸,如在胞胎之中,则道成矣。」即息相「出入绵密若存若亡」之极致。
      ◆ 藏传·密勒日巴尊者: 《十万歌集》:「气之出入往来处,即是心之所行处。」「持气之法如灯烛,微风不动光焰住。」藏传那洛六法之「瓶气」(rlung bum pa can)细分为入、满、消、射四段——与本文「息入·息住·息出·息停」结构完全对应。
      ◆ 儒家·朱熹《调息箴》: 朱子晚年静坐调息之作——《晦庵集》卷八十五:「鼻端有白,我其观之。随时随处,容与猗移。静极而嘘,如春沼鱼。动极而翕,如百虫蛰。氤氲阖辟,其妙无穷。谁其尸之?不宰之功。」朱子以鼻端白为观想对象,与置心风门异曲同工。
    r2_other_en: |
      ◆ Tiantai · the four marks of the breath in the "Lesser Samatha-Vipaśyanā" (CBETA T46n1915): "Without sound, without knots, without coarseness, coming and going faintly, as if present and as if absent, nourishing the spirit in stability and soothing the mind in joy—this is the fine breath mark. To hold to wind is to scatter, to hold to gasping is to bind, to hold to coarse is to weary, and to hold to fine is to be settled." The Venerable Haiyun's four marks of the breath derive entirely from this.
      ◆ Theravada · ānāpānasati (MN 118): the sixteen-stage breath meditation proceeds from "discerning the long in-breath" to "contemplating fading away and relinquishment," sharing a microstructure of fine awareness with the four-phase breath.
      ◆ Daoist · embryonic breathing in the "Baopuzi": "One who attains embryonic breathing can breathe without the nose and mouth, as if still within the womb, and then the Way is accomplished." This is the extreme of the fine breath mark, coming and going densely yet faintly.
      ◆ Tibetan · the master Milarepa, "The Hundred Thousand Songs": "Where the breath comes in and goes out, there is where the mind travels." "The method of holding the breath is like a lamp flame that stays steady when no breeze stirs." The "vase breath" (rlung bum pa can) of the Tibetan Nāro's six yogas is subdivided into four phases—intake, filling, dissolving, shooting—precisely matching the article's "in, dwell, out, pause" structure.
      ◆ Confucian · Zhu Xi's "Admonition on Regulating the Breath": a work of his later years on sitting meditation—"Hui'an Collection," juan 85: "At the tip of the nose there is a whiteness; I contemplate it. At all times and everywhere, I drift at ease. At the utmost stillness I exhale, like a fish in a spring pond; at the utmost motion I inhale, like the hundred insects hiding. Dense and opening and closing, its wonder is inexhaustible. Who presides over it? The working of the non-governing." Zhu Xi takes the white at the nose tip as the object of contemplation — a close counterpart to placing the mind at the wind gate.
    r2_source: "CBETA T46n1915 · MN 118 ·《抱朴子·释滞》· 密勒日巴· 朱熹 ·《老子》《庄子》"

  "闭气不是憋气":
    title_en: "Holding the Breath Is Not Suppressing It"
    r1_huayan: |
      ◆ 参禅金钥匙·吸闭吐: 第九讲详述——「吸(自然吸气)→闭(自然停住,不憋气)→吐(自然呼气),三个动作自然连贯。」本文是金钥匙「闭」字的准确诠释。
      ◆ 华严五祖·宗密《禅源诸诠集都序》(CBETA T48n2015):「息妄者,非谓息灭其心,但令不起妄念而已。如水有波,波因风起;风息波停,水自澄净。」自然闭气恰如「风息波停」——非强力止波(憋气),而是风(用力)自息,水(呼吸)自澄。宗密以禅教融合之见,释「自然息妄」——与本文「自然闭气非憋气」完全互证。
      ◆ 数于尽处: 在「息入尽」与「息出尽」的O点——即自然闭气之处数息。
    r1_huayan_en: |
      ◆ The "golden key" of chan inquiry—breathe in, hold, breathe out: fully set out in lecture nine—"in (naturally inhale) → hold (naturally stop, without suppressing) → out (naturally exhale), three movements connected naturally in sequence." The article is an exact exegesis of the "hold" character of the "golden key."
      ◆ Zongmi, fifth Huayan patriarch, "Preface to the Collected Source of Chan" (CBETA T48n2015): "To quiet the deluded is not to extinguish the mind, but merely to prevent the rising of deluded thoughts. As water has waves and the waves arise because of the wind, so when the wind stops the waves settle and the water becomes clear by itself." Natural breath-holding is exactly "when the wind stops the waves settle"—not forcibly stopping the waves (suppressing), but the wind (exertion) ceasing of itself and the water (breath) clearing of itself. With his syncretic view of Chan and doctrine, Zongmi explains "the natural quieting of delusion," fully corroborating the article's "natural breath-holding is not suppression."
      ◆ Counting at the point of exhaustion: count at the O-point of "the end of the in-breath" and "the end of the out-breath"—that is, at the place of the natural breath-pause.
    r1_source: "禅观法要→参禅金三角·技术面数随止 · T48n2015 禅源诸诠集都序"

    r2_other: |
      ◆ 瑜伽·Kumbhaka(住气): 《哈达瑜伽之光》(Haṭha Yoga Pradīpikā) 2.44-47: Sahita Kumbhaka(有作住气)为刻意屏息,Kevala Kumbhaka(无作住气)为自然呼吸停止——无需用力,呼吸自然止息。后者与本文「自然闭气」完全一致。
      ◆ 道家·《庄子·大宗师》踵息: 「古之真人……其息深深。真人之息以踵,众人之息以喉。」真人之息深至脚跟,闭气是深息的自然结果,非强制憋气。成玄英疏:「踵,足根也。真人息于踵,至深至细。」
      ◆ 道家·《老子》第10章: 「专气致柔,能如婴儿乎?」柔和自然的呼吸如婴儿,闭气是柔和的延伸而非刚强的对抗。
    r2_other_en: |
      ◆ Yoga · Kumbhaka (breath retention): "Haṭha Yoga Pradīpikā" 2.44–47: Sahita Kumbhaka (retention with effort) is a deliberate breath-holding, while Kevala Kumbhaka (retention without effort) is a spontaneous stopping of the breath — needing no force, the breath halts of itself. The latter accords exactly with the article's "natural breath-holding."
      ◆ Daoist · heel breathing in "Zhuangzi, The Great Ancestral Teacher": "The true men of old ... their breathing went deep. The true man breathes from the heels; the common man breathes from the throat." The true man's breath reaches deep down to the heels; breath-holding is the natural result of deep breathing, not a forced suppression. Cheng Xuanying's commentary: "The heel is the root of the foot. The true man breathes from the heel, to the utmost depth and fineness."
      ◆ Daoist · "Laozi," ch. 10: "Concentrate the breath and attain suppleness—can one be like a newborn babe?" A soft and natural breath is like that of an infant; breath-holding is an extension of suppleness, not a rigid confrontation.
    r2_source: "《哈达瑜伽之光》Ch.2 ·《庄子·大宗师》·《老子》10/16/20/43/55/76/78/50"

  "转折点":
    title_en: "The Turning Point"
    r1_huayan: |
      ◆ 工程面A阶段·感受息之长短动静: 本文O点感知即A阶段的具体操作——在「息入尽」与「息出尽」的转折处感受能量的转换。
      ◆ 华严二祖·智俨《华严一乘十玄门》同时具足相应门(CBETA T45n1868):「如海一滴,具百川味。」一念间具足万法——息入息出之O点,虽微细如一滴,实含呼吸全体因果。在此转折处顿见息之全体大用,即华严「微细相容安立门」的禅观实践。
      ◆ 参禅金三角·息入息出清楚: 「对呼吸的出入看得清清楚楚」——看清O点即是看得最清楚的时刻。
    r1_huayan_en: |
      ◆ Stage A of the engineering aspect—perceiving the length, movement and stillness of the breath: the article's perception of the O-point is the concrete operation of Stage A — sensing the shift of energy precisely at the turning point between "the end of the in-breath" and "the end of the out-breath."
      ◆ Zhiyan, second Huayan patriarch, "The Ten Mysterious Gates of the One Vehicle" (CBETA T45n1868), the gate of the simultaneous fulfillment and correspondence of all dharmas: "As a single drop of the ocean contains the flavor of all the hundred rivers," so within a single instant all dharmas are complete. At the O-point of the breath's in and out, subtle as a single drop, the entire cause-and-effect of breathing is contained; seeing the breath's whole great function at this very turning point is the meditative practice of the Huayan "gate of the subtle compatibility and mutual establishment."
      ◆ The "golden triangle" of chan inquiry—in and out clearly discerned: "to see clearly the in-breath and the out-breath"—to see the O-point clearly is the moment of the clearest seeing.
    r1_source: "禅观法要→工程面A阶段·参禅金三角 · T45n1868 十玄门"

    r2_other: |
      ◆ 天台·六妙门「止」门原文(CBETA T46n1917): 「息诸缘虑,不念数随,凝寂其心,是名修止。」「止」的入口即在息之转折——O点不属入也不属出,是最自然的「止」处。智者在《六妙门》中进一步说:「以止为妙门者,行者因止心故,即便次第发五轮禅。」
      ◆ 道家·《老子》第6章·玄牝之门: 「谷神不死,是谓玄牝。玄牝之门,是谓天地根。绵绵若存,用之不勤。」呼吸转折处如玄牝之门——似无实有,绵绵不绝,是天地之根。河上公注:「玄,天也,于人为鼻。牝,地也,于人为口。」鼻口之间的呼吸转折即天地之根。
      ◆ 道家·《列子·天瑞》: 「生物者不生,化物者不化。」息入息出的O点——不属生灭、不属出入——即「不生不化」之处。
    r2_other_en: |
