# 10篇文章的华严行法对照 + 他宗印证
# 源: 微信公众号「永远的犍陀罗」· 实修心要专辑

entries:
  "别用大脑":
    title_en: "Don't Use the Brain"
    r1_huayan: |
      ◆ 调身·调息·调心(五科训练): 海云和上《煖身:华严禅修入门》(布克文化2021)系统阐述,强调「身·息·心三者一体不二」。本文「暖身二法」即五科中调身+调息的实操展开。
      ◆ 驻佇心观(停心工程): 《华严禅行法—禅观》第四集:「你要能够停下心来,然后我们要观心!停心是一个前行。」本文「不能用大脑」即停心基本操作。
      ◆ 华严初祖·杜顺《法界观门》真空观·泯绝无寄(CBETA T45n1884):「不可言即色不即色,亦不可言即空不即空,一切法皆不可,不可亦不可,此语亦不受。迥绝无寄,非言所及,非解所到。」此即「不能用大脑」的华严宗源头——「生心动念,即乖法体、失正念故。」
      ◆ 华严四祖·澄观: 「心心无住,念念无着。」与本文「不用大脑,用身体感知」归趣一致。
      ◆ 参禅金三角: fjdh.cn(2013.12)「置心一处·放轻松·息入息出很清楚」。
    r1_huayan_en: |
      ◆ Regulating the body, the breath, and the mind (the five trainings): set forth by the Venerable Haiyun in "Warming the Body: An Introduction to Huayan Meditation" (Buke Culture, 2021), which stresses that body, breath, and mind form a single non-dual whole. The article's "two methods of warming the body" are the practical extension of the body- and breath-regulating trainings.
      ◆ The mind-abiding contemplation (the project of stilling the mind): from "Huayan Meditation Practice—Contemplation," Session Four: "You must be able to bring the mind to rest, and then contemplate the mind; stopping the mind is a preliminary step." The article's "don't use the brain" is this basic operation of stopping the mind.
      ◆ Du Shun, first Huayan patriarch, "Contemplation of the Realm of Dharma" (CBETA T45n1884), the contemplation of true emptiness—utterly severed, with nothing to rest on: "It cannot be said that form is not form, nor that emptiness is not emptiness; all dharmas are unattainable, the unattainable too is unattainable, and even this statement is not accepted. Utterly severed with nothing to rest on, beyond speech and beyond understanding." This is the Huayan source of "don't use the brain"—"the very stirring of thought already violates the substance of the dharma and loses right mindfulness."
      ◆ Chengguan, fourth Huayan patriarch: "Mind after mind has nothing abiding; thought after thought has nothing to cling to" — concordant with the article's "don't use the brain; perceive with the body."
      ◆ The "golden triangle" of chan inquiry (fjdh.cn, Dec 2013): "place the mind in one spot, let go and relax, and see clearly the in-breath and the out-breath."
    r1_source: "禅观法要→调身调息调心·驻佇心观 · T45n1884 法界观门"

