  "内动来了":
    title_en: "When the Inner Stirring Comes"
    r1_huayan: |
      ◆ 参禅金三角全程流程: fjdh.cn全文——调身→调息→置心一处→金三角→触功德→内动→金钥匙→觉照根性→象限转移→破无明→入菩提道。本文「内动来了,用金钥匙」处于触功德发起之后。
      ◆ 华严四祖·澄观《华严经随疏演义钞》(CBETA T36n1736):「以定发慧,以慧资定。定慧均等,如鸟二翼。」内动是「定」的深化(从散乱到心一境性,产生色身微细变化),金钥匙是「慧」的引导(觉照息之出入——不落无记,不失观照)。澄观此语正是定慧双运的华严正见。
      ◆ 触功德·八触十功德: 「内动」即八触中的「动触」——身体内部能量被激活的自然反应。
    r1_huayan_en: |
      ◆ The full flow of the golden triangle of chan inquiry: from the full text of fjdh.cn—regulate the body → regulate the breath → set the mind in one place → the golden triangle → the touch-merits → the inner stirring → the golden key → the awakening-illumination of the root nature → the quadrant shift → breaking ignorance → entering the bodhi path. The article's "when the inner stirring comes, use the golden key" occurs after the touch-merits have begun.
      ◆ Chengguan, fourth Huayan patriarch, "Commentary and Sub-commentary Expounding the Avatamsaka Sūtra" (CBETA T36n1736): "With concentration one develops insight, and with insight one nourishes concentration; concentration and insight are equal, like the two wings of a bird." The inner stirring is the deepening of "concentration" (from scattering to one-pointedness, giving rise to subtle physical changes), while the golden key is the guidance of "insight" (aware-illuminating the in- and out-breath—not falling into stupor, not losing awareness). Chengguan's words are precisely the Huayan orthodox vision of the union of śamatha and prajñā.
      ◆ Touch-merits—the eight touches and ten merits: "the inner stirring" is the "touch of movement" among the eight touches—the natural response of the body's inner energy being activated.
    r1_source: "fjdh.cn·参禅金三角全文 · T36n1736 演义钞"

    r2_other: |
      ◆ 瑜伽·Kundalini(拙火)与Bandha(收束法): 《哈达瑜伽之光》3.5:「沉睡的Kundalini如蛇蜷伏在Mooladhara(根轮),瑜伽士应以各种方法唤醒她。」内动类比Kundalini的觉醒。Bandha(收束法)——Jalandhara(喉锁)·Uddiyana(腹锁)·Mula(根锁)——在Kumbhaka时配合运用,引导Prana向上进入中脉。与金钥匙「闭→吐」的能量引导功能相似。
      ◆ 道家·火候·进阳火退阴符: 内丹术语——「子时一阳生,进阳火;午时一阴生,退阴符。」以呼吸配合意念引导内气沿任督二脉运行(小周天)。金钥匙「吸(进火)→闭(温养)→吐(退符)」与内丹火候的进-炼-退结构有对应的模式。《周易参同契》:「朔旦屯直事,至暮蒙当受。昼夜各一卦,用之如次序。」
      ◆ 中国武术·丹田内转: 太极拳/形意拳等内家拳以丹田为气机枢纽,「气沉丹田,以意领气」——吸时气沉丹田,闭时气转丹田,吐时气贯四梢。与金钥匙的吸·闭·吐三字诀有共通的身体操作模式。
    r2_other_en: |
      ◆ Yoga · Kundalini and Bandha (locks): "Haṭha Yoga Pradīpikā" 3.5: "The sleeping Kundalini lies coiled like a serpent in Mooladhara (the root cakra); the yogin should awaken her by various methods." The inner stirring is analogous to the awakening of Kundalini. The Bandhas—Jalandhara (throat lock), Uddiyana (abdominal lock), Mula (root lock)—are applied during Kumbhaka to guide Prana upward into the central channel. This resembles the golden key's "in-hold-out" energy-guiding function.
      ◆ Daoist · the firing schedule, advancing yang-fire and retreating yin-patterns: inner alchemy terms—"at the zi hour one yang is born, advance the yang fire; at the wu hour one yin is born, retreat the yin patterns." Breath coordinated with intention guides the inner qi along the conception and governing vessels (the microcosmic orbit). The golden key's "in (advance fire) → hold (nourish warmth) → out (retreat patterns)" corresponds to the alchemical advance-refine-retreat structure. The "Zhouyi Cantong Qi": "At dawn the Tun hexagram governs the matter; by dusk the Meng hexagram should receive it; day and night one hexagram each, used in orderly sequence."
      ◆ Chinese martial arts · the turning of the dantian: internal styles such as taijiquan and xingyiquan treat the dantian as the pivot of energy—"sink the qi to the dantian, lead the qi with intention"—on the in-breath the qi sinks to the dantian, on the hold it turns within the dantian, on the out-breath it reaches the four extremities. This shares a common bodily operating pattern with the golden key's "in, hold, out."
