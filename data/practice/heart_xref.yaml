    r2_other_en: |
      ◆ Tiantai · the six identities of Tiantai (CBETA T46n1911, "Móhē Zhǐguān"): the identity in principle → identity in name → identity in contemplation and practice → identity in semblance → identity in partial realization → identity in ultimate realization. The nine stages of entering chan are the practical unfolding of the "identity in contemplation and practice." Zhiyi: "What one practices matches what one says; what one says matches what one practices."
      ◆ Mahāyāna · the "Ten Grounds Chapter" of the Avatamsaka Sūtra (CBETA T10n0279): from the ground of joy to the ground of dharma-cloud, forming a complete chain of comparison with the Venerable Haiyun's classifications.
      ◆ Daoist · from the foundation of inner alchemy to refining the void: laying the foundation → refining essence into qi (one hundred days) → refining qi into spirit (ten months) → refining spirit to return to the void (three years) → refining the void to merge with the Way (nine years). The "Zhonglü Chuandao Ji": "Refine the body into qi, refine qi into spirit, refine spirit to merge with the Way."
      ◆ Daoist · Zhang Boduan's "Awakening to Reality" (Wuzhen Pian): "I urge you to exhaustively seek the place of birth; returning to the source is the king of medicines."—from the warming of the body to the golden key, the nine stages are precisely the practical sequence of "returning to the source," forming a correspondence with the alchemical stages of the Wuzhen Pian.
      ◆ Confucian · "Xunzi, Encouraging Learning": "Without accumulating half-steps one cannot reach a thousand li; without amassing small streams one cannot form rivers and seas." From the first stage of warming the body to the ninth stage of entering chan is the process of accumulating half-steps to reach a thousand li.
      ◆ Confucian · "Xunzi, Dispelling Obstructions": "Be empty, unified, and still—this is called the great clarity." The nine stages deepen layer by layer to entrance into chan, passing from emptiness to unity to stillness, and finally to great clarity.
      ◆ Martial arts · the three layers of xingyiquan: manifest force (transforming the bones) → hidden force (transforming the sinews) → transformed force (transforming the marrow). From Sun Lutang's "Shuyi Shuzhen," the three layers of accomplishment.
