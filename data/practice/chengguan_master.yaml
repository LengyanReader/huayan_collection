lecture_highlights:
- topic: 楞严经义贯（全345讲·第三次完整讲解）
  topic_en: The Śūraṅgama Sūtra with Its Meaning Interwoven — 345 lectures, the third, complete run
  significance: '成观法师最具代表性的讲法。以自著《大佛顶首楞严经义贯》(2006)为讲义。讲经缘起: 第一次在大毗卢寺讲一部分, 因唯识内容太多而暂停,
    回头先讲《大乘百法明门论》打基础; 第二次在佛陀教育基金会讲一部分, 因太忙中止; 第三次从头完整开讲(开讲时62岁)。'
  significance_en: "Master Chengguan's most representative series, using his own Śūraṅgama Commentary (2006) as the text. Background: the first run, at the Great Vairochana Temple, paused because the Consciousness-Only content proved too dense; he turned to lecture the Hundred Dharmas Gate to lay the groundwork. The second run, at the Buddha Educational Foundation, stopped midway for lack of time. The third run proceeded from the very beginning in full (he was 62 when it began)."
  links:
  - name: B站全345讲
    url: https://www.bilibili.com/video/BV19MFUz3Eoz/
  - name: B站1-167讲合集
    url: https://www.bilibili.com/video/BV1uUA8eYET1/
  - name: 喜马拉雅读诵
    url: https://www.ximalaya.com/album/93230717
- topic: 大日经疏讲解（东密根本经典）
  topic_en: Lectures on the Commentaries on the Mahāvairocana Sūtra — the foundational scripture of East-Asian Shingon
  significance: '以高野山真言宗传法阿阇梨身份系统讲解《大日经》注疏。已见第11-22集文字稿(fjdh.cn/wmxf.net)。核心开示: 「禅是舍有入空,
    密教是从空出有」——密教如飞机最快, 但要有本钱买得起票。'
  significance_en: 'Systematic exposition of the Mahāvairocana commentaries in his capacity as a Dharma-transmitting ācārya of Kōyasan Shingon; transcripts of sessions 11–22 are available (fjdh.cn/wmxf.net). Key instruction: "Chan releases existence to enter emptiness; the esoteric teaching emerges from emptiness into existence" — the esoteric teaching is like the fastest aircraft, but one must be able to afford the ticket.'
  links:
  - name: 第22集文字稿
    url: https://www.fjdh.cn/wumin/2013/11/130439305067.html
- topic: 大乘百法明门论今注（DVD 71集·已整理字幕）
  topic_en: Modern Commentary on the Mahāyāna Hundred Dharmas Gate — 71-session DVD, subtitled
  significance: 唯识学入门系列。成观法师以「五位百法」为修行纲领——心法·心所有法·色法·心不相应行法, 最终从「有为法」入「无为法」证真如。71集DVD已整理字幕。
  significance_en: 'An introduction to Consciousness-Only. Master Chengguan takes the "five categories, hundred dharmas" as the framework of practice — mind-dharmas, dharmas in association with mind, form-dharmas, dharmas not concurrent with mind — and finally enters the "unconditioned dharmas" from the "conditioned dharmas" to realize Suchness. All 71 DVD sessions carry subtitles.'
  links: []
- topic: 天台小止观讲解（24集+）
  topic_en: Lectures on the Tiantai Small Calming-and-Contemplation (24+ sessions)
  significance: '以天台止观框架讲解实修次第。第24集有对西方科学哲学的批判: 「佛法是先于科学、超越于科学……哲学家只能说的不能做的」——修行人当一概放舍世间学问。'
  significance_en: 'An exposition of the practical sequence of cultivation within the Tiantai śamatha-vipaśyanā framework. Session 24 contains a critique of Western science and philosophy: "The Buddha-dharma precedes, surpasses, and transcends science … the philosopher can only speak, not do" — the practitioner should set aside worldly learning altogether.'
  links:
  - name: 第24集文字稿
    url: https://www.fjdh.cn/wumin/2013/09/111813288817.html
- topic: 唯识三十论颂义贯·八识规矩颂·观所缘缘论·因明入正理论
  topic_en: The Consciousness-Only series — Thirty Verses, Eight Consciousnesses, Examining Object, and Hetuvidyā commentaries
  significance: 唯识学系列讲法。常引《大乘起信论》阐述「性相圆融」——「起信论是小本的楞伽经, 性相融合」。
  significance_en: 'Lectures in the Consciousness-Only series. Frequently cites the Awakening of Faith to unfold the "fusion of nature and marks": "The Awakening of Faith is a miniature Laṅkāvatāra Sūtra — nature and marks in fusion."'
  links: []
- topic: 心经系列（1997年美国密西根遍照寺）
  topic_en: The Heart Sūtra Series (1997, Bianzhao Temple, Michigan, USA)
  significance: '含《心经显说》《心经奥义》《心经奥义析微》《心经与禅密修行》四文。核心: 「即禅即密, 即密即禅」——依《心经》修则习禅甚佳、修密亦胜,
    禅密并修尤胜。真言宗全轨法本每一部都要诵《心经》。'
  significance_en: 'Comprising "An Expansive Explanation of the Heart Sūtra," "The Profound Meaning of the Heart Sūtra," "Refinements in the Profound Meaning of the Heart Sūtra," and "The Heart Sūtra and Chan-Tantric Practice." Core teaching: "Chan within Tantra, Tantra within Chan" — cultivating by the Heart Sūtra is excellent for Chan, better still for Tantra, and best of all when the two are practiced together. Every full ceremonial manual of the Shingon school recites the Heart Sūtra.'
  links:
  - name: 心经系列(一)
    url: http://wuming.xuefo.net/nr/6/61361.html
- topic: 六祖法宝坛经·金刚经释义
  topic_en: The Platform Sūtra of the Sixth Patriarch · Dharmic Meaning of the Diamond Sūtra
  significance: 禅宗经典讲法。与楞严、唯识系列构成「禅教双修」的教学体系。
  significance_en: 'Lectures on the classics of the Chan school. Together with the Śūraṅgama and Consciousness-Only series they form a teaching system of "dual practice of Chan and doctrinal study."'
  links: []
- topic: 楞严法会（例行举办）
  topic_en: The Śūraṅgama Dharma Assembly (held regularly)
  significance: 大毗卢寺例行法会——诵楞严咒、静坐、讲经。成观法师因此被誉为「楞严座主」。
  significance_en: 'The regular assembly of the Great Vairochana Temple — reciting the Śūraṅgama Mantra, sitting in meditation, and lecturing on the sūtra. For this Master Chengguan is honored as the "Śūraṅgama Seat-Master."'
  links: []
comparison_with_haiyun:
  note: '成观法师与海云继梦法师皆承接贤首宗(华严宗)第42世法脉 ——

    成观法师2010年承接，海云继梦2008年承接，二人几乎同时代。

    成观以「楞严+唯识+真言」为三柱，以译经为弘法主轴；

    海云以「华严禅观+灵性经济学」为旗帜，以讲经和寺院建设为主轴。

    二人共同构成当代台湾华严系统两位风格迥异、互为补充的重要弘法者。

    '
  note_en: "Both Master Chengguan and Master Haiyun Jihong are heirs of the 42nd-generation lineage of the Xianshou (Huayan) School — Chengguan received it in 2010, Haiyun in 2008; the two are near-contemporaries. Chengguan's three pillars are 'Śūraṅgama + Consciousness-Only + Shingon,' with sutra translation as the main vehicle of his teaching; Haiyun's banners are 'Huayan meditation + the economics of the spirit,' with lecturing and temple construction as his main vehicles. Together they constitute the two figures of the contemporary Taiwanese Huayan tradition whose styles are distinct yet complementary."
  lineage_diagram: "```mermaid\ngraph TD\n  subgraph 天台宗\n    TC[谛闲大师] --> XM[显明老和尚<br/>天台45世]\n\
    \    XM --> CG[成观法师<br/>天台46世<br/>1988年披剃·纽约]\n  end\n\n  subgraph 真言宗\n    KYS[高野山真言宗<br/>金剛峯寺]\
    \ --> CG2[成观法师<br/>真言宗53世<br/>传法灌顶阿阇梨<br/>1996年]\n  end\n\n  subgraph 华严宗\n  \
    \  DS[杜顺→智俨→法藏<br/>→澄观→宗密] --> LJ[历代祖师]\n    LJ --> CG3[成观法师<br/>贤首宗42世<br/>慈恩宗42世<br/>2010年承接]\n\
    \  end\n\n  subgraph Institutions\n    CG --> JY[新逍遥园译经院<br/>1991年创办·台北]\n   \
    \ CG --> BZS[美国密西根遍照寺<br/>住持]\n  end\n\n  subgraph Works\n    CG --> LY[楞严座主<br/>楞严经义贯上下]\n\
    \    CG --> WS[唯识系列<br/>百法·三十论·八识]\n    CG --> ZY[译经: 英译经典11种<br/>法华·楞严·金刚·坛经...]\n\
    \    CG --> ZM[真言密法<br/>汉传东密推行]\n  end\n```\n"
