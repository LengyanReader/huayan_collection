lecture_highlights:
  - topic: 楞严法会
    significance: 成观法师最具代表性的讲法，定期在台北和美国两地举办，深入《大佛顶首楞严经》。
  - topic: "唯识三十论颂 / 八识规矩颂 / 百法明门论"
    note: 系统地跨经论讲说，常引《大乘起信论》阐述「性相圆融」——指出《起信论》为马鸣菩萨所著，「小本的《楞伽经》」，性相融合。
  - topic: 真言宗密法
    note: 以高野山传法阿阇梨身份，在日本系统学习后在台湾推行汉传东密。
  - topic: 英汉对照经典系列
    note: 独创性事业——以一人之力将十余部汉传大乘经典译为英文，每部均有详细注释(义贯)。

comparison_with_haiyun:
  note: |
    成观法师与海云继梦法师皆承接贤首宗(华严宗)第42世法脉 ——
    成观法师2010年承接，海云继梦2008年承接，二人几乎同时代。
    成观以「楞严+唯识+真言」为三柱，以译经为弘法主轴；
    海云以「华严禅观+灵性经济学」为旗帜，以讲经和寺院建设为主轴。
    二人共同构成当代台湾华严系统两位风格迥异、互为补充的重要弘法者。

