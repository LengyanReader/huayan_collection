    - title: "楞伽经义贯"
    - title: "心经系列"
    - title: "大乘百法明门论今注"
    - title: "唯识三十论颂义贯"
    - title: "八识规矩颂义贯"
    - title: "观所缘缘论义贯"
    - title: "因明入正理论义贯"
    - title: "六离合释法式义贯"
    - title: "禅之甘露"
    - title: "地藏法门系列"
    - title: "北美开示录 (上·下)"
    - title: "我的学密历程"

