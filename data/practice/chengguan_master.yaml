biography:
  name: 成观法师
  name_en: Ven. Chengguan (Chéngguān)
  secular_name: (未查)
  birth: 1947
  birthplace: 台湾台北
  birthplace_en: Taipei, Taiwan
  education:
  - 台湾师范大学英语系毕业
  - 美国德州TCU英研所(全额奖学金)
  education_en:
  - Graduated from the English Department of National Taiwan Normal University
  - Graduate studies at Texas Christian University (TCU), USA, on a full scholarship
  ordination: 1988年于纽约庄严寺依天台宗第45代传人显明老和尚座下披剃
  ordination_en: Ordained in 1988 at Zhuangyan (Adorned) Temple, New York, under Venerable Xianming, the 45th-generation patriarch of the Tiantai School
  lineage:
  - 天台宗第46世(显明老和尚传)
  - 日本高野山真言宗第53世传法灌顶阿阇梨(1996)
  - 贤首宗(华严宗)兼慈恩宗(唯识宗)第42世法脉传人(2010)
  lineage_en:
  - 46th generation of the Tiantai School (transmitted by Venerable Xianming)
  - 53rd-generation Dharma-transmitting Abhiṣeka Ācārya of the Shingon School of Mount Kōya, Japan (1996)
  - 42nd-generation Dharma heir of both the Xianshou (Huayan) and Cien (Consciousness-Only) Schools (2010)
  current_position: 台湾新逍遥园译经院(原大毘卢寺)创办人·住持; 美国密西根遍照寺住持
  current_position_en: Founder and abbot of the New Xiaoyaoyuan Translation Institute in Taiwan (formerly the Great Vairochana Temple); abbot of the Bianzhao (Universal Radiance) Temple in Michigan, USA
  title: 楞严座主·译经大师·真言宗传法阿阇梨
institutions:
- name: 新逍遥园译经院 (原大毘卢寺)
  name_en: New Xiaoyaoyuan Translation Institute (formerly the Great Vairochana Temple)
  founded: 1991
  location: 台北市文山区景美
  practice: 禅密双修·推行汉传东密
  practice_en: Joint practice of Chan and esoteric Buddhism; promoting Chinese-transmitted Shingon (Higashi-mitsu)
  website: https://abtemple.org
  note: 定期举办楞严法会。法师发起筹建译经院，旨在系统翻译《华严经》《法华经》等经典为英文。
  note_en: The Śūraṅgama dharma assembly is held on a regular basis. The Master initiated the Institute with the aim of systematically rendering such scriptures as the Avatamsaka Sūtra and the Lotus Sūtra into English.
works_chinese:
