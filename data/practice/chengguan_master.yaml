        XM --> CG[成观法师<br/>天台46世<br/>1988年披剃·纽约]
      end

      subgraph 真言宗
        KYS[高野山真言宗<br/>金剛峯寺] --> CG2[成观法师<br/>真言宗53世<br/>传法灌顶阿阇梨<br/>1996年]
      end

      subgraph 华严宗
        DS[杜顺→智俨→法藏<br/>→澄观→宗密] --> LJ[历代祖师]
        LJ --> CG3[成观法师<br/>贤首宗42世<br/>慈恩宗42世<br/>2010年承接]
      end

      subgraph Institutions
