  intro: 英文译著已出版11种
  intro_en: Eleven English translations have been published
  items:
  - 英译法华经 (The Lotus Sutra)
  - 英译金刚经 (The Diamond Sutra)
  - 英译心经 (The Heart Sutra)
  - 英译六祖坛经 (The Platform Sutra)
