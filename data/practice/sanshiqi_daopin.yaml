# 三十七道品 — 技术面·工程面子节
# 内容来源: 《三十七道品全方位研究》+ 历代经典注疏 + 当代弘法资料
# 整理日期: 2026-08-20

section_id: sys-sanshiqi
icon: "☸"
title: "三十七道品 — 三乘共法的修行地图"
title_en: "The Thirty-Seven Aids to Awakening — A Practice Map Shared by the Three Vehicles"

intro: |
  三十七道品（三十七菩提分法）是横跨南传上座部、汉传大乘诸宗、藏传金刚乘乃至当代西方正念运动的基础修行框架，
  被公认为「三乘共法」。它不是某一宗派的专属建制，而是一套诞生于阿含语境、历经两千五百年不断被重新组织与诠释的修行地图——
  从部派阿毗达磨的系统化，到龙树「应无所得」的大乘重诠，再到卡巴金的当代临床转化，始终未曾被真正取代或废弃。
  以下整理从名相辨析、七科详论到历代传承的全方位研究，所有内容均可追溯至原始文献出处。
intro_en: |
  The thirty-seven aids to awakening (sattatiṃsa bodhipakkhiyā dhammā /
  saptatriṃśad bodhipakṣā dharmāḥ) are a foundational framework of practice
  shared across the Theravāda, the various Chinese Mahāyāna schools, the
  Tibetan Vajrayāna, and even the contemporary Western mindfulness movement —
  the "common Dharma of the three vehicles." Far from being any one school's
  exclusive institution, they are a practice map born in the Āgama context and
  ceaselessly reorganised and reinterpreted over 2,500 years: from the
  systematisation of scholastic Abhidharma, through Nāgārjuna's Mahāyāna
  re-reading in the key of "apprehending nothing to be obtained," to
  Kabat-Zinn's contemporary clinical transformation — never in fact replaced
  or discarded. What follows is a comprehensive study from terminological
  analysis and the detailed treatment of the seven groups to the traditions'
  successive transmissions; every point is traceable to primary sources.

topics:
  - id: sq-overview
    title: "一、总论：名相辨析与总体架构"
    title_en: "1. General Survey: Terminology and Overall Structure"
    body: |
      <b>梵语释义</b>：「道品」为梵语 bodhi-pakṣika 之意译，又作菩提分、觉支，指趋向觉悟、进入涅槃境界的三十七种修行方法。
      「分」（巴利语 pakkhiyā）字根来自巴利语 pakkha 或梵语 pakṣa，<b>本义是鸟类的双翼</b>，引申为「资助、助益」之意；
      觉音在《清净道论》中特以巴利语 upakāra（助成）来诠释这一字根——三十七道品，即是「助成觉悟」的三十七种要素。

      <b>七科总览</b>：
      <table class=v-table style="font-size:.78em;margin:8px 0">
      <tr><th>科目</th><th>数目</th><th>内容</th></tr>
      <tr><td><b>四念处</b></td><td>4</td><td>身念处、受念处、心念处、法念处</td></tr>
      <tr><td><b>四正勤</b></td><td>4</td><td>已生恶令断、未生恶令不生、未生善令生、已生善令增长</td></tr>
      <tr><td><b>四如意足</b></td><td>4</td><td>欲如意足、精进如意足、心如意足、思惟如意足</td></tr>
      <tr><td><b>五根</b></td><td>5</td><td>信根、精进根、念根、定根、慧根</td></tr>
      <tr><td><b>五力</b></td><td>5</td><td>信力、精进力、念力、定力、慧力</td></tr>
      <tr><td><b>七觉支</b></td><td>7</td><td>念·择法·精进·喜·轻安·定·舍</td></tr>
      <tr><td><b>八正道</b></td><td>8</td><td>正见·正思惟·正语·正业·正命·正精进·正念·正定</td></tr>
      </table>

      <b>名相层累构建</b>：据现代文献学考订，在最早期南北传经典中，「菩提分法」仅专指七觉支——
      四念住、四正胜、四神足、五根、五力、八道支虽已个别出现，却尚未被并称为「菩提分法」，更未统合为「三十七」这一固定数目。
      直到《增一阿含》及其别行单经，才首次使用「三十七菩提分」；直至说一切有部《大毘婆沙论》、
      南传《弥兰王问经》与《清净道论》，这一固定名相才最终定型。

      <b>分别说部「四十一菩提分法」</b>：分别说部系统曾提出「四十一菩提分法」之说（三十七加「四圣种」），
      说明这一数目在部派佛教内部也并非绝对统一，体现了「名相层累」的教法体系定型模式。
    source: |
      📎 《杂阿含经》(CBETA T02n0099) · 《增一阿含经》(CBETA T02n0125) · 觉音《清净道论》(Visuddhimagga) · 《大毘婆沙论》(CBETA T27n1545) · 分别说部《舍利弗阿毘昙论》(CBETA T28n1548)
    en_body: |
      <b>Sanskrit semantics</b>: "aids" renders bodhi-pakṣika, also
      translated "factors of awakening" — the thirty-seven methods leading to
      awakening and nirvāṇa. The root "pakṣa" literally means the paired
      wings of a bird, hence "that which assists"; Buddhaghosa glosses it
      with the Pāli upakāra, "co-operating to bring about" — the thirty-seven
      aids are thus the thirty-seven factors that bring awakening about.

      <b>The seven groups</b>: the four establishments of mindfulness, the
      four right strivings, the four bases of psychic power, the five
      faculties, the five powers, the seven awakening factors, and the
      eightfold noble path — 37 in all.

      <b>Layered growth of the term</b>: modern philology shows that the
      earliest texts used bodhi-pakkhiyā dhammā strictly for the seven
      awakening factors; the separate groups appear individually but are not
      yet unified under the fixed number "thirty-seven." That unification
      comes only in the Ekottara-Āgama and subsequently is fixed in the
      Sarvāstivāda Mahāvibhāṣā, the Milindapañha and Visuddhimagga. The
      Vibhajyavāda school even proposed "forty-one" aids (adding the four
      noble lineages) — the number itself was not absolute even within the
      early schools.

  - id: sq-si-nianchu
    title: "二、四念处 — 身·受·心·法"
    title_en: "2. The Four Establishments of Mindfulness — Body, Feelings, Mind, Phenomena"
    body: |
      「念」为能观之智，「处」为所观之境，以智观境即是「念处」。

      <b>身念处</b>：观此色身内外污秽充满、无有净处，故观身不净；
      <b>受念处</b>：观一切苦乐等感受悉皆是苦（心与境相合而苦果随之）；
      <b>心念处</b>：观此识心念念生灭、刹那不住，无有常主；
      <b>法念处</b>：观一切法皆从因缘和合而生，无自主自在之性，故为诸法无我。

      <b>《大念处经》的核心地位</b>：南传《长部》第22经《大念处经》（Mahāsatipaṭṭhāna Sutta）
      将四念处修习方法阐述得最为系统详尽，明确指出「这是唯一的道路，可以使众生清净、克服愁叹、灭除苦忧、
      实践真理、体证涅槃」，故四念处历来被视为三十七道品乃至整个解脱道最核心、最基础的入手处，「总境」之称由此而来。

      <b>历代注疏</b>：觉音（Buddhaghosa，五世纪中叶）《清净道论》「慧地品」在正式进入观禅修法之前，
      先系统铺陈五蕴、十二处、十八界等阿毗达磨基础理论，其严谨的止观次第论述至今仍是南传禅法研习者的必读典籍。

      <b>当代实践</b>：帕奥禅师对四念处入出息观（安那般那念）的教学堪称典范——对「入出息长短」的操作说明极为精确：
      「（长短）是指时间的长短……只需要知道息是长或短，而专注力仍然放在与鼻孔或人中接触的息，
      不要跟随息进入身体或出去身体」，体现了南传禅法「止观经验传承」的具体样态。
    source: |
      📎 《大念处经》(长部22经, DN 22) · 《杂阿含经》(CBETA T02n0099) · 觉音《清净道论》"慧地品"(Visuddhimagga ch.14-17) · 帕奥禅师《如实知见》(Pa-Auk Forest Monastery) · Bhikkhu Anālayo, <i>Satipaṭṭhāna: The Direct Path to Realization</i> (2003)
    en_body: |
      "Mindfulness" is the knowing faculty, "establishment" the object
      contemplated; to contemplate objects with wisdom is satipaṭṭhāna. The
      body is observed as impure, feelings (all felt as suffering, since
      contact of mind and object brings suffering), the mind as arising and
      perishing moment by moment without a permanent owner, and phenomena as
      dependently arisen and ownerless — hence the four contemplations of
      impurity, suffering, impermanence, and non-self.

      The Great Discourse on the Establishments of Mindfulness (DN 22) is the
      most systematic exposition: "this is the one way … for the purification
      of beings, overcoming sorrow and lamentation, ending pain and grief,
      attaining the true way and realising nirvāṇa." Hence the four
      establishments are regarded as the core and most fundamental point of
      entry of the whole path. Buddhaghosa's Visuddhimagga ("ground of
      understanding," ch. 14–17) systematically lays out the Abhidharma
      foundations before the actual insight practice. In modern Burma,
      Pa-Auk Sayadaw's teaching of mindfulness-of-breathing gives famously
      precise operational instructions — noting only whether the breath is
      long or short while keeping attention at the nostril tip or upper lip,
      without following the breath into or out of the body.

  - id: sq-si-zhengqin
    title: "三、四正勤 — 断恶修善的意志力"
    title_en: "3. The Four Right Strivings — The Will-Power of Abandoning Evil and Cultivating Good"
    body: |
      又作四正断，是精进力在断恶修善四个方向上的具体落实：
      (1) <b>已生之恶令永断除</b>——对已发生的恶行立即止息；
      (2) <b>未生之恶令不生起</b>——预防尚未发生的恶行；
      (3) <b>未生之善令得生起</b>——主动培育尚未生起的善法；
      (4) <b>已生之善令得增长</b>——使已有的善法持续增长广大。

      <b>与精进波罗蜜的关系</b>：四正勤强调修行不能停留于内观的被动观照，还须辅以主动、有方向性的意志努力。
      此科对应大乘六度中的「精进波罗蜜」（vīrya-pāramitā），是菩萨道「四摄六度」中精进精神在解脱道语境下的具体化表达。
      七科之中，四正勤与四如意足构成「意志-定力」的连续体：四正勤是善法生起的动力，四如意足是由此动力趋向禅定的基础。
    source: |
      📎 《杂阿含经》(CBETA T02n0099) · 《增一阿含经》(CBETA T02n0125) · 世亲《俱舍论》(CBETA T29n1558) · 《瑜伽师地论》(CBETA T30n1579) 卷二十九
    en_body: |
      Also rendered "the four right abandonings" (sammappadhāna): the
      effort of abandonment and cultivation on four fronts — (1) evil
      already arisen is cut off; (2) evil not yet arisen does not arise; (3)
      good not yet arisen is made to arise; (4) good already arisen is
      increased and enlarged. The four strivings insist that practice cannot
      rest in passively observing sights but requires active, directed
      volitional effort. This group corresponds to the pāramitā of vigour
      (vīrya) in the Mahāyāna six perfections. Together the four strivings
      and the four bases of psychic power form a "will–concentration"
      continuum: the strivings are the driving force that gives rise to
      good, the bases of psychic power the ground by which that force moves
      toward absorption.

  - id: sq-si-ruyi
    title: "四、四如意足 — 禅定的四种基础"
    title_en: "4. The Four Bases of Psychic Power — Four Grounds of Concentration"
    body: |
      又作四神足，指四种能令禅定「如愿满足」的定力基础：
      (1) <b>欲如意足</b>——以善欲、善愿摄心得定；
      (2) <b>精进如意足</b>——依四正勤精进不懈得定；
      (3) <b>心（念）如意足</b>——以摄心专注、正念得定；
      (4) <b>思惟（观）如意足</b>——以智慧观察思惟得定。

      <b>《瑜伽师地论》的「加行三摩地」</b>：《瑜伽师地论》卷二十九特别指出，依四如意足的增上力，
      可得四种「加行三摩地」，是由定力更进一步趋向智慧解脱的枢纽。
      此处「加行」非唯识五位中的「加行道」概念，而是指禅定修行的加功用行——
      以欲、精进、心、观四种要素为方便，令心安住于所缘而不散乱，从而为后续的五根、五力、七觉支、八正道奠定定力基础。
    source: |
      📎 《瑜伽师地论》卷二十九(CBETA T30n1579) · 《杂阿含经》(CBETA T02n0099) · 世亲《俱舍论》(CBETA T29n1558)
    en_body: |
      Also "the four roads to psychic power" (iddhipāda): four bases by
      which concentration is "fulfilled as wished" — (1) the base of desire
      (wholesome wish); (2) the base of vigour (unremitting striving,
      inheriting the four right strivings); (3) the base of mind
      (one-pointed mindfulness); (4) the base of investigation (wisdom-led
      reflection). The Yogaśāstra (juan 29) notes that by the superior power
      of these four one obtains four "applied samādhis" (prayoga-samādhi) —
      here "applied" (加行) meaning exerting the factors that settle the mind
      on its object without scattering, providing the concentration base for
      the ensuing faculties, powers, awakening factors and path, and serving
      as the hinge advancing from concentration toward wisdom and
      liberation.

  - id: sq-wu-gen-li
    title: "五、五根与五力 — 信·进·念·定·慧"
    title_en: "5. The Five Faculties and Five Powers — Faith, Vigour, Mindfulness, Concentration, Wisdom"
    body: |
      五根、五力内容完全相同——<b>信、精进、念、定、慧</b>——区别在于功能层次：

      <b>根（初生巩固）</b>：「根」是能生一切善法之意，指此五者初步生起、尚待巩固的阶段，如同树根初植，尚未深入土壤。
      <b>力（坚固摧惑）</b>：指五根增长、坚固到足以摧破相应烦恼障碍的阶段，如同大树根深蒂固、不可动摇。
      具体而言：信力破诸疑惑、精进力破身心懈怠、念力破诸邪念、定力破诸乱想、慧力遮止三界见思二惑。

      <b>信根/信力贯通三学</b>：五根之「信根」、五力之「信力」贯通戒定慧三学，
      是「若无信心，无法学佛，何况成就三无漏学」这一佛教修学基本前提的教理落实处。
      在修证位次的对应中，五根对应加行道暖、顶二位，五力对应加行道忍、世第一法二位——
      从「根」到「力」的递进，正是行者从资粮道进入见道位的关键加行阶段。
    source: |
      📎 《杂阿含经》(CBETA T02n0099) · 世亲《俱舍论》(CBETA T29n1558) · 《瑜伽师地论》(CBETA T30n1579) · 《辩中边论》(CBETA T31n1602)
    en_body: |
      The five faculties (indriya) and the five powers (bala) share the same
      content — faith, vigour, mindfulness, concentration, wisdom — and
      differ only in function and depth: faculties are the five as first
      arisen and still to be consolidated, like saplings not yet rooted;
      powers are the five grown firm enough to crush their corresponding
      hindrances, like deep-rooted, immovable trees — faith breaks doubt,
      vigour sloth of body and mind, mindfulness false thoughts, concentration
      scattered thoughts, wisdom the two errant views of the three realms.
      The faith faculty/power runs through the whole three trainings, for
      without faith none can study the Dharma, let alone accomplish the three
      undefiled learnings. In the stage-correspondence, the five faculties
      match the warmth and summit of the applied path, the five powers the
      endurance and highest-worldly states — the progression from faculty to
      power is the crucial applied stage by which a practitioner passes from
      the provision stage to the path of seeing.

  - id: sq-qi-juezhi
    title: "六、七觉支 — 觉悟的七要素"
    title_en: "6. The Seven Awakening Factors — Seven Elements of Awakening"
    body: |
      又作七菩提分、七觉分，是三十七道品中「觉」之自体所在：
      (1) <b>念觉支</b>——于境明记不忘；
      (2) <b>择法觉支</b>——以智慧简择诸法真伪；
      (3) <b>精进觉支</b>——于修道法勇猛不杂；
      (4) <b>喜觉支</b>——契悟真法、心生欢喜；
      (5) <b>轻安觉支</b>——身心调畅安适；
      (6) <b>定觉支</b>——专注所缘、心不散乱；
      (7) <b>舍觉支</b>——远离沉掉、平等舍离染污。

      <b>枢纽地位</b>：七觉支中，「择法」为智慧之体，「精进、喜、轻安、舍」为智慧之用，
      由智慧坚固定力、定慧相应而生正念。教界内部注疏特别强调，三十七道品统称为「觉」，
      而「觉」的自体正落在此七支之中，故七觉支在七科之中具有承前启后的枢纽地位。
      在修证位次对应中，七觉支对应见道位（初证空性、破除见惑），是从迷启悟的关键转折点。

      <b>龙树《大智度论》卷十九的大乘重诠</b>：龙树对七觉支所作的「不忆不念，是名念觉分」式重新诠释，
      是大乘论师对声闻道品进行创造性转化最早、也最具权威性的一例——
      将原本意指「专注忆念」的「念觉支」径直诠释为「不忆不念」的空性观照，
      这一近乎悖论式的重新表述，正是大乘般若「应无所得」精神的典型手法。
    source: |
      📎 龙树《大智度论》卷十九(CBETA T25n1509) · 《杂阿含经》(CBETA T02n0099) · 觉音《清净道论》(Visuddhimagga) · 世亲《俱舍论》(CBETA T29n1558)
    en_body: |
      Also "seven factors of awakenment": (1) mindfulness — clearly
      remembering the object; (2) investigation of phenomena — discerning
      true from false by wisdom; (3) vigour — energetically and purely
      cultivating the path; (4) joy — delight on realising the true Dharma;
      (5) tranquillity — ease and comfort of body and mind; (6)
      concentration — focus on the object without scattering; (7) equanimity
      — letting go, dropping sloth and excitation alike.

      Of the seven, "investigation" is the substance of wisdom, and
      vigour/joy/tranquillity/equanimity its function; wisdom firms up
      concentration, and their integration gives right mindfulness. Since the
      name "awakening" (bojjhaṅga) has its own substance in these seven,
      this group holds a pivotal, connecting position among the seven groups;
      in stage-correspondence it matches the path of seeing (first attainment
      of emptiness, uprooting the errant views). Nāgārjuna's Mahāprajñāpāramitā
      Śāstra (juan 19) provides the classic Mahāyāna re-creation: the
      mindfulness-factor "neither remembers nor notes" — an almost paradoxical
      reformulation in the spirit of "apprehending nothing to be obtained."

  - id: sq-ba-zhengdao
    title: "七、八正道 — 戒定慧的圆满呈现"
    title_en: "7. The Eightfold Noble Path — The Perfect Realisation of Precepts, Concentration and Wisdom"
    body: |
      又称八圣道、八圣道分，是三十七道品的最终圆满呈现：
      (1) <b>正见</b>——如实了知四谛、八正道等出世间正法；
      (2) <b>正思惟</b>——以出离心、无瞋心、无害心三种善思惟；
      (3) <b>正语</b>——离妄语、离恶口、离两舌、离绮语；
      (4) <b>正业</b>——离杀生、离偷盗、离邪淫；
      (5) <b>正命</b>——以正当方式维持生活，远离五种邪命；
      (6) <b>正精进</b>——于已生未生善恶法之断修精进；
      (7) <b>正念</b>——以四念处为所缘，于境明记；
      (8) <b>正定</b>——离欲恶不善法，乃至得第四禅。

      <b>对治五种邪命</b>：正语、正业、正命特别对治「五种邪命」——诈现奇特、自说功德、占相吉凶、
      高声现威、称得供养以动人心等以利养为目的的不正当营生方式，是三十七道品中「戒学」最集中的落实处。

      <b>「已觉」之道</b>：八正道被视为「已觉」之道（相对七觉支的「从迷启悟」而言），
      是整套体系修证圆满的最终呈现形式。在修证位次对应中，八正道对应修道位（断除俱生烦恼、圆满智慧），
      是从见道证悟之后，持续深入、直至无学果位的完整修行道路。
    source: |
      📎 《杂阿含经》(CBETA T02n0099) · 《大念处经》(长部22经, DN 22) · 世亲《俱舍论》(CBETA T29n1558) · 《瑜伽师地论》(CBETA T30n1579)
    en_body: |
      The final, perfect realisation of the thirty-seven aids: (1) right view
      — knowing the four truths and the supramundane Dharma as they are; (2)
      right thought — the three wholesome deliberations of renunciation,
      non-aversion and non-harming; (3) right speech — abstaining from false,
      harsh, divisive and frivolous speech; (4) right action — abstaining from
      killing, stealing and sexual misconduct; (5) right livelihood — earning a
      living righteously, avoiding the "five wrong livelihoods"
      (self-publicised wonders, self-praise, fortune-telling, roaring for
      prestige, gaining offerings by stirring the mind) — together with right
      speech and right action, the most concentrated embodiment of the
      "precepts" training; (6) right effort — the four strivings; (7) right
      mindfulness — the four establishments; (8) right concentration — the
      wholesome one-pointedness up to the fourth absorption.

      The eightfold path is the path "already awakened" (in contrast to the
      seven factors' "awakening from delusion") — the perfect form of the
      whole system's accomplishment, corresponding in stage-terms to the path
      of cultivation, the complete course from the path of seeing to the stage
      of no-more-learning.

  - id: sq-india
    title: "八、印度渊源：从阿含到阿毗达磨"
    title_en: "8. Indian Origins: From the Āgamas to the Abhidharma"
    body: |
      <b>《杂阿含经》的枢纽地位</b>：三十七道品分散见载于四部阿含（尤以《杂阿含经》最为集中），
      传统上被视为「佛法及修持的重心」「贯穿三藏十二部经论」的「学佛基础」。
      《杂阿含经》整部经典的内容架构可分为「有情事、受用事、安住事、染净事、差别事、所说事、众会事」七类，
      其中「所说事」一类的核心内容正是三十七道品。经中记载佛陀以「城市唯有一门」为喻，
      说三十七道品是趋向解脱唯一必经之门。

      <b>部派佛教的统合：七科对应五道</b>：三十七道品作为完整体系的理论化工作在阿毗达磨阶段完成。
      现代学者据《俱舍论》梳理出一套极具解释力的对应关系——三十七道品并非平铺并列，而是<b>依修行进程次第分科</b>：
      <table class=v-table style="font-size:.78em;margin:8px 0">
      <tr><th>修证阶段</th><th>对应科目</th><th>核心内容</th></tr>
      <tr><td><b>资粮道</b></td><td>四念处</td><td>出离心、空正见初步生起</td></tr>
      <tr><td><b>加行道·暖顶</b></td><td>五根</td><td>信进念定慧初步生起</td></tr>
      <tr><td><b>加行道·忍世第一</b></td><td>五力</td><td>五根坚固、摧破烦恼</td></tr>
      <tr><td><b>见道位</b></td><td>七觉支</td><td>初证空性、破除见惑</td></tr>
      <tr><td><b>修道位</b></td><td>八正道</td><td>断除俱生烦恼、圆满智慧</td></tr>
      </table>

      <b>说一切有部的精细安立</b>：《大毘婆沙论》对此有系统的论议与安立，
      而《俱舍论》则以更精炼的体系化形式将七科三十七法整合为一套具有明确纵深结构的修证地图，
      是理解三十七道品为何能贯通从凡夫发心直至无学果位全过程的关键。
    source: |
      📎 《杂阿含经》(CBETA T02n0099) · 世亲《俱舍论》(CBETA T29n1558) · 《大毘婆沙论》(CBETA T27n1545) · 《增一阿含经》(CBETA T02n0125)
    en_body: |
      The Saṃyukta-Āgama is the pivotal source: the thirty-seven aids appear
      scattered through the four Āgamas (most densely in the Saṃyukta), and
      their content forms the core of the category of "discoursed things" in
      its seven-fold structural taxonomy. The Buddha taught, by the parable of
      the city with a single gate, that the thirty-seven aids are the one
      obligatory gate toward liberation.

      The theoretical unification was completed in the Abhidharma. Modern
      scholarship, drawing on the Abhidharmakośa, recovers a highly
      explanatory correspondence: the thirty-seven are not a flat list but
      arranged by the stages of the practice-progress — the provision stage
      (four establishments), the applied stage's warmth/summit (five
      faculties), its endurance/highest-worldly (five powers), the path of
      seeing (seven awakening factors), and the path of cultivation (eightfold
      path). The Mahāvibhāṣā debates the scheme at length, and the Kośa
      refines the seven groups and thirty-seven items into a map with clear
      depth-structure — the key to why the aids can run from the first
      aspiration of the ordinary person right up to the stage of
      no-more-learning.

  - id: sq-nanchuan
    title: "九、南传上座部的传承"
    title_en: "9. The Theravāda Transmission"
    body: |
      <b>巴利藏中的相应部</b>：南传巴利藏《相应部》专设「菩提分相应」（Bojjhaṅga-saṃyutta）、「念处相应」
      （Satipaṭṭhāna-saṃyutta）、「道相应」（Magga-saṃyutta）等专经群，系统阐述七科教法；
      《长部》第22经《大念处经》与《中部》第10经为四念处修法最详尽的原始依据，
      历来被上座部传统奉为止观禅修的根本圣典。

      <b>觉音《清净道论》</b>：觉音（Buddhaghosa，五世纪中叶）是南传巴利语系佛教最重要的论师，
      出身北印度菩提场附近婆罗门族，后至斯里兰卡大寺从僧伽波罗长老学习三藏及僧伽罗文义疏，
      撰成《清净道论》（Visuddhimagga），综述南传上座部教理最详尽完整的论著，
      被誉为「三藏和义疏的精要」。其「慧地品」（第十四至十七章）在正式进入观禅修法之前，
      先系统铺陈五蕴、十二处、十八界等阿毗达磨基础理论，至今仍是三十七道品在南传语境下最权威的系统化诠释。

      <b>近现代缅甸内观传统</b>：近现代缅甸涌现一批以四念处禅法闻名的禅师，
      其中<b>帕奥禅师</b>（Pa-Auk T Sayadaw）对四念处入出息观的教学堪称典范，
      将传统教理转化为极具操作性的当代禅修指导。其教学特色在于对修法细节给出极其精确的操作说明，
      体现了南传禅法「经验传承」的核心特质。
    source: |
      📎 《相应部》菩提分相应/念处相应/道相应 · 《大念处经》(DN 22) · 觉音《清净道论》(Visuddhimagga) · 帕奥禅师教学文献(Pa-Auk Forest Monastery) · Bhikkhu Anālayo, <i>Satipaṭṭhāna: The Direct Path to Realization</i> (2003)
    en_body: |
      The Pāli Saṃyutta-Nikāya devotes dedicated saṃyuttas to the awakening
      factors (Bojjhaṅga-saṃyutta), the establishments of mindfulness
      (Satipaṭṭhāna-saṃyutta) and the path (Magga-saṃyutta); the Great
      Discourse (DN 22) and the shorter one (MN 10) are the most detailed
      primary bases of the four-establishments practice, revered in the
      Theravāda as the root scriptures of tranquillity-and-insight.

      Buddhaghosa (mid-5th c.), the greatest commentator of the Pāli
      tradition, a North-Indian Brahmin who studied at the Mahāvihāra in Sri
      Lanka, composed the Visuddhimagga — the most complete synthesis of
      Theravāda doctrine, "the essence of the three piṭakas and their
      commentaries." Its "ground of understanding" (ch. 14–17) systematically
      expounds the Abhidharma foundations before the insight methods proper —
      still the authoritative systematisation of the thirty-seven aids in the
      Theravāda context. In the modern era, Burmese teachers — above all
      Pa-Auk T Sayadaw — have turned this doctrinal inheritance into
      eminently practicable instruction, embodying the tradition's "experiential
      transmission."

  - id: sq-dacheng
    title: "十、汉传大乘的重新安立"
    title_en: "10. The Re-establishment in the Chinese Mahāyāna"
    body: |
      <b>般若经与《大智度论》：「应无所得」的助道定位</b>：三十七道品传入汉传大乘语境后，
      最重要的诠释转向发生在般若类经典与龙树《大智度论》之中——大乘将三十七道品从「正修法门」（声闻乘视角）
      重新定位为「<b>助道</b>」（大乘另有六度万行为正道），但同时强调应「以无所得为方便」修习之，
      即在实际操作层面完全遵循七科之法，却不著于「我在修念处」「我已得觉支」之相。
      《大智度论》卷十九：「菩萨于一切法，不忆不念，是名念觉分」——
      将原本意指「专注忆念」的「念觉支」径直诠释为「不忆不念」的空性观照。

      <b>瑜伽行派《瑜伽师地论》的系统整合</b>：《瑜伽师地论》因系统论述三乘行人依「九次第定」与三十七道品次第修行、
      终至证果的完整境界，全论分为十七种境地，故又简称「十七地论」——
      从「闻所成地」「思所成地」「修所成地」直至「声闻地」「独觉地」「菩萨地」，
      三十七道品正是贯穿这套修证地图的核心操作性内容。

      <b>济群法师：先共后不共</b>：济群法师在讲解《辩中边论》「辩修对治品」时明确指出：
      「三十七道品属于声闻乘的内容……唯识宗兼通大小，善巧融摄了解脱道和菩萨道的修行。」
      《辩中边论》先于「辩修对治品」中阐述三十七道品，再于「辩无上乘品」中指出大乘的不共之处，
      「使我们在认识解脱道的同时，了解菩萨道的殊胜」——这一「先共后不共」的论述次第，
      正是唯识学处理声闻道品与菩萨道关系最典范的方式。

      <b>天台、华严语境</b>：三十七道品同样内嵌于天台止观次第与华严五十二位修证体系之中，
      构成大乘「教观并重」「解行相应」传统中不可或缺的基础一环。
    source: |
      📎 龙树《大智度论》卷十九(CBETA T25n1509) · 《瑜伽师地论》(CBETA T30n1579) · 《辩中边论》(CBETA T31n1602) · 济群《〈辩中边论〉辩修对治品讲记》(jiqun.com)
    en_body: |
      In the Prajñāpāramitā sūtras and the Mahāprajñāpāramitā Śāstra the
      crucial shift occurred: the Mahāyāna repositioned the thirty-seven aids
      from "the method proper" (śrāvaka viewpoint) to an "aiding practice"
      (since the Mahāyāna has the six perfections as its true path), yet
      insisted they be cultivated "with non-acquisition as the skilful means" —
      fully following the seven groups in operation while not clinging to "I
      am cultivating mindfulness" or "I have realised an awakening factor."
      Nāgārjuna: "For the bodhisattva, to neither remember nor note any
      phenomenon is called the mindfulness-factor of awakening."

      The Yogācāra Yogācārabhūmi integrates the whole scheme: from the "ground
      of learning, thought and practice" up to the śrāvaka, pratyekabuddha and
      bodhisattva grounds of the seventeen, the thirty-seven aids are the core
      operational content running through the cultivation map. Venerable
      Jiqun remarks on the Madhyāntavibhāga's "first the common, then the
      distinct" ordering: the treatise first expounds the thirty-seven aids,
      then the chapter on the Unsurpassed Vehicle points out what is distinct
      to the Mahāyāna, so that in knowing the liberation path one also
      understands the excellence of the bodhisattva path. The same aids are
      embedded in the Tiantai śamatha-vipaśyanā sequences and the Huayan
      fifty-two-stage system.

  - id: sq-zangchuan
    title: "十一、藏传佛教：现观庄严论与道次第"
    title_en: "11. Tibetan Buddhism: The Ornament of Clear Realisation and the Stages of the Path"
    body: |
      <b>《现观庄严论》「一切智」品</b>：弥勒（慈氏）五论之一《现观庄严论》（Abhisamayālaṃkāra）
      是统摄一切《般若经》密意的纲要性论典，全论分八品、展开为七十义。
      三十七道品被系统安立于第三品「<b>一切智</b>」（又译基智）之中，具体表述为
      「随顺声闻之一切相智的智相」——菩萨虽以证得佛果为终极目标，但仍须完整通达声闻乘所修的三十七道品
      作为「一切智」的重要构成部分，方能进一步趋向「道相智」与「一切相智」（佛智）。
      这一安立方式与瑜伽行派「先共后不共」的处理逻辑高度一致。

      <b>宗喀巴《菩提道次第广论》</b>：将三十七道品全数纳入「中士道」（求个人解脱之道）修学框架，
      并给出精炼概括：「三十七助道，四念处正勤，及四如意足，五根五力等，七觉八正道……
      菩提道次第，即起三十七道品作用之方便，三十七道品可摄一切法，亦即总持，<b>大小乘所共修，密教亦不能外</b>。」
      这一「密教亦不能外」的明确表态，说明在格鲁派判摄体系中，
      三十七道品被视为一切修行阶位共同不可或缺的基础，而非某一特定阶段可以绕过的初级教法。

      <b>法尊法师的引介</b>：法尊法师（1902–1980）早年（1935年前后）在《海潮音》发表专文，
      向汉语学界系统介绍《现观庄严论》「八品七十义」的完整架构，
      是二十世纪汉语世界理解这套体系最重要的引介文献之一。
    source: |
      📎 弥勒《现观庄严论》(CBETA T30n1604) · 宗喀巴《菩提道次第广论》(CBETA T44n1823) · 法尊《现观庄严论》引介(《海潮音》1935年前后)
    en_body: |
      In Abhisamayālaṃkāra, one of Maitreya's five treatises and the
      outline-compendium of the Prajñāpāramitā's hidden intention, the
      thirty-seven aids are systematically placed in the third chapter on
      "knowledge of all aspects" (here: the knowledge of all bases, "world
      wisdom"), as "the modes of an omniscient knowledge conforming to the
      śrāvakas" — the bodhisattva, though aiming at Buddhahood, must still
      fully master the śrāvaka aids as a constituent of that knowledge before
      proceeding to "knowledge of paths" and "knowledge of all aspects"
      (Buddha wisdom). This matches the Yogācāra logic of "first the common,
      then the distinct."

      Tsongkhapa's Great Treatise on the Stages of the Path places all
      thirty-seven in the "medium spirit" (the path of personal liberation),
      summarising: "…the stages of the path at once operate the thirty-seven
      aids, which gather all phenomena and are the common practice of great
      and small vehicles — the secret teachings too cannot be excepted."
      This explicit "not even the esoteric can be excepted" shows that in the
      Gelug scheme the aids are the indispensable common foundation of every
      stage of practice, not a beginning-level teaching to be bypassed. Venerable
      Fazun (1902–1980) introduced the eight chapters and seventy topics of
      the Ornament to the Chinese in the 1930s via the journal Shengchao
      (Hai Chao Yin), the most important such introduction in the
      twentieth-century Chinese world.

  - id: sq-haiyun
    title: "十二、海云继梦法师：解脱道作为华严修学的既定阶段"
    title_en: "12. Master Haiyun Jihong: The Liberation Path as a Defined Stage of Huayan Study"
    body: |
      <b>修学次第中的定位</b>：海云继梦法师将声闻、缘觉二乘（即三十七道品所属的「解脱道」）
      明确安立为其整体修学体系中一个具名的<b>既定阶段</b>——
      其修学次第明确列出「<b>第二阶段—解脱道—声闻乘，缘觉乘</b>」，
      说明声闻乘「以四谛法门为交通工具……得到偏空涅槃，成阿罗汉的结果」，
      缘觉乘「以十二因缘法门为交通工具……成辟支佛的结果」，
      二者同属「解脱道」，被置于「出离心为基础，菩提心为根本……究竟要到普贤乘」这一更宏大四阶段蓝图中承前启后的第二环节。

      <b>声闻乘初果对应华严十信位</b>：海云法师在《四十华严讲记》中，
      曾将声闻乘「初果」（须陀洹）对应至华严「十信位」这一菩萨阶位体系的起点——
      这一对应方式，与《现观庄严论》「一切智品」将声闻教法安立为菩萨智慧之基础的处理逻辑结构神似。

      <b>「先共后不共」与华严五十二位</b>：声闻道品作为华严五十二位修证体系的「共法」基础，
      是进入菩萨道之前不可逾越的既定阶段。

      <b>四阶段蓝图</b>：
      (1) 出离乘（解脱道·声闻缘觉）→ (2) 菩提乘（般若道·空性智慧）→
      (3) 菩萨乘（方便道·六度万行）→ (4) 普贤乘（华严法界·一即一切）。

      <b>文献说明</b>：笔者未能检得海云继梦法师以三十七道品为专题的完整独立讲记，
      其「解脱道」阶段的具体教学内容多分散于长篇讲经系列的相关段落之中，
      此处仅为可查证的片段与教团官方教理架构说明。
    source: |
      📎 海云继梦"解脱道"教理架构(美国国际华严会 huayanworld.wordpress.com) · 海云继梦《四十华严讲记》第67讲 · 海云继梦《地藏经》北美开示系列
    en_body: |
      In Master Haiyun's overall curriculum the śrāvaka- and
      pratyekabuddha-vehicles (the "liberation path" to which the thirty-seven
      aids belong) are installed explicitly as a named, defined stage —
      "Stage Two — the Liberation Path — Śrāvaka Vehicle, Pratyekabuddha
      Vehicle" — the one bringing the four truths as its vehicle and reaching
      "partial-nirvāṇa … with the result of an Arhat," the other riding the
      twelve links of conditioned arising toward "a pratyekabuddha's
      result." Both belong to the liberation path, positioned as the
      bridge-stage within a grander four-stage blueprint whose ground is
      renunciation and root bodhicitta, culminating in the Samantabhadra-yāna.

      In his Forty-Fascicle Avataṃsaka lectures he once mapped the śrāvaka
      "first fruit" (stream-entry) onto the Huayan "ten abidings of faith,"
      structurally akin to the Abhisamayālaṃkāra's establishment of the
      śrāvaka teaching as the basis of bodhisattva wisdom. The four-stage
      blueprint runs: (1) the vehicle of departure (liberation path, śrāvaka +
      pratyekabuddha) → (2) the vehicle of bodhi (yāna of prajñā, emptiness
      wisdom) → (3) the bodhisattva vehicle (the six perfections) → (4) the
      Samantabhadra-yāna (the Huayan dharma-realm, one in all).

      Documentary note: no complete, standalone lecture by Master Haiyun
      devoted specifically to the thirty-seven aids was located; his teaching
      on this stage is dispersed in long scripture lecture series, so what is
      quoted here are only verifiable fragments and the official doctrinal
      structure of his community.

  - id: sq-xiandai
    title: "十三、现代学术与正念运动"
    title_en: "13. Modern Scholarship and the Mindfulness Movement"
    body: |
      <b>印顺法师的阿含学研究</b>：印顺法师是近现代汉语佛学界公认对原始佛教、阿含经教用功最深的学问僧，
      著有《佛法概论》《原始佛教圣典之集成》《杂阿含经论会编》等专著。
      他提出一项极具综合性的洞见：「<b>《阿含经》是一切佛法的总根源</b>」——
      龙树《中论》、弥勒《瑜伽论》都引证自《阿含经》教授来说明诸法实相；
      如来藏说渊源于《阿含经》「心清净、为客尘所染」之说；华严唯心论同样受《阿含经》影响。
      这一论断意味着，法相唯识、般若中观、密宗、天台华严等庞大教理体系，
      若依印顺法师的阿含学立场回溯，最终都可望汇归于三十七道品所代表的最基础解脱论架构。

      <b>乔恩·卡巴金 MBSR正念减压疗法</b>：卡巴金（Jon Kabat-Zinn，1944年生，MIT分子生物学博士）
      1979年在麻省大学医学院创立「正念减压疗法」（Mindfulness-Based Stress Reduction, MBSR），
      将多元禅修传统融汇为一套刻意剥离宗教框架、以科学话语包装的临床干预方案——
      这一「去宗教化」策略，正是「正念」得以进入医疗、教育、企业、监狱等主流建制的关键原因。

      <b>正念认知疗法（MBCT）</b>：经多项荟萃分析证实，MBCT可将重度抑郁症复发率降低约<b>百分之四十三</b>，
      是四念处教法在当代循证医学领域最具实证支持的转化成果。

      <b>学界审视</b>：塔尔顿论文（<i>Contemporary Buddhism</i>，2018年）明确指出，
      卡巴金所谓「普遍的法之基础」（universal dharma foundation）实际上是融汇南传止观与大乘不二见地的产物，
      而非单一传统的直接移植。部分学者认为，剥离四念处原有的戒学、缘起见、解脱论目标等脉络后，
      所余下的「正念」实践「本质上已是一种全然不同的修法」。
    source: |
      📎 印顺《佛法概论》(CBETA 图书) · 印顺《原始佛教圣典之集成》 · Jon Kabat-Zinn, <i>Full Catastrophe Living</i> (1990) · Tommi Husgafvel et al., "The 'Universal Dharma Foundation' of MBSR" (<i>Contemporary Buddhism</i>, 2018)
    en_body: |
      Venerable Yinshun, the scholar-monk most deeply engaged with the early
      teachings in modern Chinese Buddhism, proposed the integrative thesis:
      "the Āgamas are the single root of all the Dharma" — Nāgārjuna's
      Madhyamaka and Maitreya's Yogācāra both cite Āgama instruction to
      explain reality; tathāgatagarbha derives from the Āgama idea of a mind
      "pure but stained by adventitious defilements"; Huayan mind-only
      thought likewise bears the Āgama impress. On this view, the vast
      structures of Consciousness-Only, Madhyamaka, esoteric Buddhism, Tiantai
      and Huayan all ultimately converge, in origin, on the basic
      liberation-theory architecture represented by the thirty-seven aids.

      Jon Kabat-Zinn (b. 1944, MIT molecular biology PhD) founded
      Mindfulness-Based Stress Reduction (MBSR) at the University of
      Massachusetts Medical School in 1979, blending diverse meditation
      traditions into a clinical intervention deliberately stripped of
      religious framing and couched in scientific language — a secularising
      strategy that let "mindfulness" enter medicine, education, business
      and prisons. Meta-analyses show Mindfulness-Based Cognitive Therapy
      lowers major-depression relapse by roughly 43%. Scholarship (e.g.,
      Husgafvel et al., Contemporary Buddhism, 2018) cautions that Kabat-Zinn's
      "universal dharma foundation" is itself a blend of Theravāda
      tranquillity-insight and Mahāyāna non-dual insight rather than a direct
      transplant of a single tradition; removing the precepts, dependent
      origination and the soteriological goal, what remains is in essence an
      entirely different practice.

  - id: sq-fusion
    title: "十四、融合与张力"
    title_en: "14. Convergence and Tension"
    body: |
      <b>共与不共</b>：综观汉传瑜伽行派与藏传《现观庄严论》，
      处理三十七道品与大乘菩萨道关系的基本逻辑高度一致——
      <b>三十七道品是「共法」（三乘共同必修），六度万行、十地阶位等是「不共法」（唯菩萨乘独有）</b>，
      菩萨道的殊胜之处必须建立在对解脱道的完整通达之上，而非绕道而行。
      这一「先共后不共」的结构性共识，比诸多宗派论争（性相之争、空有之争）更具跨传统的一致性。

      <b>显讲、直讲、论讲</b>：海云继梦法师对三大传统处理经教的方式差异提出个人观察（此为一家之言）：
      南传佛教「以阿含藏为主……他直讲，不像经典是隐讲」；
      藏传佛教「会讲论，不会讲经」；
      唯独汉传大乘因系「整个团队翻译」而形成独特「语言模式跟思维模式」，素有「讲经」传统。
      三大传统处理三十七道品的方式——南传以《清净道论》直讲为主，藏传以论著科判为主要载体，
      汉传则始终带有「随经重新诠释」色彩——恰好印证了这一观察。

      <b>正念运动的「去佛教化」争议</b>：当代西方「正念」运动将四念处从整套三十七道品体系
      （乃至戒学、缘起见、解脱论目标）中抽离出来、单独发展为世俗化的临床与教育工具，
      本身就是「三十七道品作为一套整体架构，其各部分能否被拆解、单独提取而仍保有效力」这一问题的当代实验场。
      这与大乘「应无所得」式重新诠释形成有趣对照——二者出发点截然不同（一为世俗化临床应用，一为大乘义理升华），
      却都涉及「脱离原有修证脉络后，这套教法是否还保有其本来效力」这一共通的方法论问题。
    source: |
      📎 《瑜伽师地论》(CBETA T30n1579) · 《辩中边论》(CBETA T31n1602) · 弥勒《现观庄严论》(CBETA T30n1604) · 海云继梦公开讲席 · Jon Kabat-Zinn相关文献
    en_body: |
      Common and non-common: across the Chinese Yogācāra and the Tibetan
      Abhisamayālaṃkāra, the basic logic governing the relation of the
      thirty-seven aids to the bodhisattva path is highly consistent — the aids
      are the "common Dharma" (obligatory for all three vehicles), while the
      six perfections and the ten-bhūmi stages are the "non-common Dharma"
      (peculiar to the bodhisattva vehicle). The excellence of the bodhisattva
      path must be built upon complete mastery of the liberation path, not by
      skirting it. This structural consensus of "first the common, then the
      distinct" holds across traditions more firmly than many sectarian
      disputes.

      Direct, elided and commentarial exposition: Master Haiyun offers his own
      observation (a personal view) that the Theravāda "expounds directly,
      unlike the sūtras' elided teaching," the Tibetan tradition "teaches the
      śāstras but not the sūtras," while the Chinese Mahāyāna, formed through
      team translation, has its distinctive language-and-thought patterns and
      a tradition of "expounding the sūtras." The three traditions' treatment
      of the thirty-seven aids — Theravāda via the Visuddhimagga's direct
      exposition, Tibetan mainly in commented treatises, Chinese in a perpetual
      "reinterpretation along with the sūtra" — bears this out.

      The "de-Buddhised" mindfulness controversy: the modern Western
      mindfulness movement extracts the four establishments from the entire
      thirty-seven-aids system (and from the precepts, dependent-origination
      view and liberation goal) into a secularised clinical and educational
      tool — a live experiment on whether parts of a whole can be detached and
      retain their efficacy. This is amusingly parallel to the Mahāyāna
      "non-acquisition" style reinterpretation: utterly different starting
      points, yet both raise the common methodological question of whether the
      teaching retains its original efficacy outside its original practice
      context.

  - id: sq-classical
    title: "十五、经典依据与文献出处"
    title_en: "15. Canonical Basis and Sources"
    body: |
      <b>汉传经典</b>：
      ·《杂阿含经》(CBETA T02n0099) — 三十七道品最集中的原始出处，「所说事」核心内容
      ·《增一阿含经》(CBETA T02n0125) — 首次使用「三十七菩提分」名称
      ·《中阿含经》(CBETA T01n0026) — 四念处·八正道等单经出处
      ·《长阿含经》(CBETA T01n0001) — 因缘法·四谛法教说
      ·龙树《大智度论》卷十九(CBETA T25n1509) — 大乘对七觉支的经典重诠
      ·世亲《俱舍论》(CBETA T29n1558) — 七科三十七法的精细安立
      ·《瑜伽师地论》卷二十九(CBETA T30n1579) — 四如意足「加行三摩地」·十七地修证体系
      ·《辩中边论》(CBETA T31n1602) — 「辩修对治品」「先共后不共」的论述次第
      ·《大毘婆沙论》(CBETA T27n1545) — 部派佛教对「三十七」数目的定型
      ·《舍利弗阿毘昙论》(CBETA T28n1548) — 分别说部的道支归类

      <b>南传经典</b>：
      ·《大念处经》(长部22经, DN 22) — 四念处修法最详尽的原始依据
      ·《相应部》菩提分相应/念处相应/道相应 — 七科教法系统阐述
      ·觉音《清净道论》(Visuddhimagga) — 南传三十七道品最权威的系统化诠释

      <b>藏传经典</b>：
      ·弥勒《现观庄严论》(CBETA T30n1604) — 「一切智」品中安立声闻道品
      ·宗喀巴《菩提道次第广论》(CBETA T44n1823) — 「中士道」全数纳入三十七道品

      <b>近现代研究举要</b>：
      ·印顺《佛法概论》《原始佛教圣典之集成》《杂阿含经论会编》
      ·法尊译介《现观庄严论》八品七十义（《海潮音》1935年前后）
      ·释开仁《阿含经三十七品与菩萨行》（2011年）
      ·郑石岩《三十七道品讲义》（佛陀教育基金会，2010年）
      ·济群《〈辩中边论〉辩修对治品讲记》

      <b>英文学界与当代正念运动</b>：
      ·Jon Kabat-Zinn, <i>Full Catastrophe Living</i> (1990) / MBSR相关研究文献
      ·Bhikkhu Anālayo, <i>Satipaṭṭhāna: The Direct Path to Realization</i> (2003)
      ·Tommi Husgafvel et al., "The 'Universal Dharma Foundation' of MBSR" (<i>Contemporary Buddhism</i>, 2018)
    source: |
      📎 CBETA电子佛典(cbetaonline.dila.edu.tw) · 巴利三藏(SuttaCentral/Bodhi Translation) · 印顺法师著作 · 济群法师官网(jiqun.com) · Bhikkhu Anālayo著作
    en_body: |
      The full apparatus — Chinese canon (Saṃyukta-Āgama T02n0099, the most
      concentrated primary source; Ekottara T02n0125, first to use the name
      "thirty-seven factors of bodhi"; Madhyama T01n0026; Dīrgha T01n0001;
      Nāgārjuna's Mahāprajñāpāramitā Śāstra juan 19; Vasubandhu's
      Abhidharmakośa; the Yogācārabhūmi juan 29; the Madhyāntavibhāga; the
      Mahāvibhāṣā; the Śāriputrābhidharma), the Pāli texts (DN 22, the
      Bojjhaṅga/Satipaṭṭhāna/Magga saṃyuttas, the Visuddhimagga), the Tibetan
      canon (Abhisamayālaṃkāra, Lamrim Chenmo), and the modern works
      (Yinshun, Fazun, Shi Kairen, Zheng Shiyan, Jiqun; Jon Kabat-Zinn,
      Anālayo; Husgafvel et al.) is listed in the Chinese text beside this
      summary.

