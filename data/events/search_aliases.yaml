# 搜索别名映射 · Search alias map
# 供 Tab1/全部页面人名模糊搜索使用（原名 ↔ 别名/异写/尊称 双向映射，
# 由 init.js `_matchSearch` 消费，注入为 var SEARCH_ALIASES）。
# 逐条考证：王守仁号阳明（阳明先生）；慧能/惠能 敦煌写本与后世通行异写；
# 卢舍那/毗卢遮那 为华严教主之别译（此界报身 vs 法身之别称，古来并行）；
# 清凉国师=澄观（赐号大统清凉国师）、贤首国师=法藏（赐号贤首大师）、
# 圭峰=宗密（圭峰草堂寺）、帝心=杜顺（帝心尊者）、至相=智俨（至相寺）；
# 海云继梦=海雲繼夢 简繁异写（正体英文 Haiyun Jimeng）。
aliases:
  王阳明: 王守仁
  王守仁: 王阳明
  慧能: 惠能
  惠能: 慧能
  卢舍那: 毗卢遮那
  清凉国师: 澄观
  贤首国师: 法藏
  圭峰: 宗密
  帝心: 杜顺
  至相: 智俨
  海云继梦: 海雲繼夢
  海雲繼夢: 海云继梦
