# 其他佛教宗派 (从lineage.js OTHER_SCHOOLS提取)
# 7个宗派

schools:
  - n: "天台宗"
    y: 597
    lat: 29.2
    lng: 121.0
    c: "#7d9a6e"
    founder: "智𫖮"
    loc: "天台山"
    desc: "中国最早成立的佛教宗派。以《法华经》为根本经典。华严宗判教体系中「同教一乘」即针对天台而设。澄观曾参学天台。"
    src: "《续高僧传》卷十七·智𫖮传 /《宋高僧传》卷五·澄观传"

  - n: "三论宗"
    y: 597
    lat: 34.3
    lng: 108.9
    c: "#a09080"
    founder: "吉藏"
    loc: "长安"
    desc: "以《中论》《百论》《十二门论》立宗。华严宗继承三论空性论证方法，法藏判教将三论归入大乘始教。"
    src: "《续高僧传》卷十一·吉藏传"

  - n: "唯识宗"
    y: 645
    lat: 34.3
    lng: 108.9
    c: "#8b7a9e"
    founder: "玄奘"
    loc: "长安"
    desc: "以《成唯识论》立宗。与华严宗同源瑜伽行派但取径不同。玄奘译《显无边佛土功德经》(T0289)即华严寿量品别译。"
    src: "《大唐大慈恩寺三藏法师传》"

  - n: "净土宗"
    y: 402
    lat: 29.6
    lng: 116.0
    c: "#b8863c"
    founder: "慧远"
    loc: "庐山"
    desc: "以念佛往生为宗旨。华严经普贤行愿品为净土行者重视，华严「华藏世界」与净土「极乐世界」之间有深层义学互动。"
    src: "《高僧传》卷六·慧远传"

  - n: "禅宗"
    y: 520
    lat: 34.5
    lng: 112.5
    c: "#d48476"
    founder: "达摩→慧能"
    loc: "少林寺→曹溪"
    desc: "以教外别传为宗。华严五祖宗密同时是禅宗荷泽系传人，著《禅源诸诠集都序》系统融合禅教。澄观亦参谒禅门牛头宗。"
    src: "《宋高僧传》卷六·宗密传 / 宗密《禅源诸诠集都序》"

  - n: "律宗"
    y: 626
    lat: 33.9
    lng: 109.0
    c: "#9e8b6e"
    founder: "道宣"
    loc: "终南山"
    desc: "以四分律为根本。与华严宗同以终南山为根本道场。慧光(地论师·华严义学前身)同时被尊为四分律宗初祖。"
    src: "《宋高僧传》卷十四·道宣传 / 《续高僧传》卷二十一·慧光传"

  - n: "密宗"
    y: 716
    lat: 34.3
    lng: 108.9
    c: "#c8893e"
    founder: "善无畏·金刚智·不空"
    loc: "长安"
    desc: "唐代开元三大士传入。华严宗内贤首密法(秽迹金刚)自成体系。海云继梦所得印度瑜伽行传承亦与此有历史关联。"
    src: "《宋高僧传》卷二·善无畏传 / 大华严寺官方资料"
