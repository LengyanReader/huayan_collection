# 华严关联批注 — 各人物/事件与华严宗在各个层面上的联系/回应/印证
# 字段: note (批注文本), level (关联层次: direct/indirect/dialogue/parallel/influence)

persons:
  person_000a:  # 龙树
    note: 华严宗奉为远祖。据传入龙宫取回《华严经》下本十万偈。造《十住毗婆沙论》注释《十地品》，为华严义学最早论释之一。其「中道空性」思想经华严宗发展为「真空绝相观」。
    level: direct
  person_000b:  # 世亲
    note: 造《十地经论》，首创「六相」名相（总别同异成坏），后被华严宗吸收为「六相圆融」义。其唯识学说经地论师传承，构成华严宗义学前身。
    level: direct
  person_001:  # 杜顺
    note: 华严初祖。著《法界观门》开创华严观法体系，「真空观·理事无碍观·周遍含容观」三观为华严宗修行核心框架。传说其以神通示现「帝网无尽观」。
    level: direct
  person_002:  # 智俨
    note: 华严二祖。著《搜玄记》开华严经疏之先河。创「十玄门」义理，系统化华严宗的「一即一切」圆融思想，为法藏集大成奠定基础。
    level: direct
  person_003:  # 法藏
    note: 华严三祖·实际创立者。系统化「五教十宗」判教与「法界缘起」义理。著《华严五教章》《探玄记》《金师子章》。以殿前金师子为武则天说华严，为佛教中国化之典范。
    level: direct
  person_004:  # 澄观
    note: 华严四祖·集大成者。著《华严经疏》六十卷、《演义钞》九十卷。历七帝之师，德宗赐号「清凉」。融会禅教诸宗入华严体系。
    level: direct
  person_005:  # 宗密
    note: 华严五祖·禅教融合者。著《禅源诸诠集都序》融会禅宗与华严。其《原人论》以华严圆教判摄儒道释三家，为跨传统对话的先驱。
    level: direct
  person_006:  # 佛驮跋陀罗
    note: 六十华严译者。首次将华严经完整译为汉文（七处八会三十四品），为华严思想传入汉地之始。与鸠摩罗什在禅法上有分歧而南下。
    level: direct
  person_007:  # 实叉难陀
    note: 八十华严译者。于阗人。其译本（七处九会三十九品）为后世华严宗的根本经典依据。法藏曾参与其译场证义，译经与创宗同步进行。
    level: direct
  person_009:  # 李通玄
    note: 唐代华严居士学者。以《易经》融会华严，方法独特。著《新华严经论》四十卷，其「东方智慧」路线与法藏「西方梵文」路线形成华严中国化的双轨。
    level: direct
  person_010:  # 义天
    note: 高丽王子。入宋从净源受华严，归国编《义天录》为华严文献学奠基。华严宗经其传入朝鲜半岛，形成海东华严传统。
    level: direct
  person_011:  # 净源
    note: 宋代华严中兴之祖。住杭州慧因寺，传法义天。义天归国后送金书华严经供养，慧因寺世称「华严第一道场」。
    level: direct
  person_042:  # 海云继梦
    note: 当代华严传承者。2008年三脉汇一（临济+华严+大乘瑜伽）。提出「普贤乘华严宗」新定位，复兴失传八百年的「东山法门」。将华严修行重构为可操作的「工程面/技术面」双轨体系。
    level: direct
  person_101:  # 马鸣
    note: 古印度大乘论师。传统著录为《大乘起信论》作者。该论「一心二门三大四信五门」之说为华严宗判教与心性论提供了核心理论资源。法藏著《大乘起信论义记》为最权威注释之一。
    level: direct
  person_102:  # 无著
    note: 瑜伽行派创始人。其唯识学说经世亲《十地经论》传入汉地，深刻影响地论学派。华严宗「法界缘起」思想与瑜伽行派「唯识无境」有深层义学对话——华严以「性起」对瑜伽之「缘起」。
    level: indirect
  person_103:  # 鸠摩罗什
    note: 四大译师之首。译《十住经》（十地品别译）、《十住毗婆沙论》为华严学在汉地的传播提供了关键文本基础。其「中观空性」精义经华严宗发展为「真空妙有」之中道观。
    level: indirect
  person_104:  # 菩提流支
    note: 译《十地经论》十二卷，直接催生了南北朝地论学派。地论师南道派（慧光系）经数代传承至智俨、法藏，构成华严宗义学之远源。
    level: indirect
  person_105:  # 燃灯佛
    note: 华严经中「佛佛相续无尽法界缘起」之始。据《如来名号品》，十方三世无尽诸佛构成华严宗「法界缘起」之佛佛相望网络。
    level: direct
  person_107:  # 毗卢遮那佛
    note: 华严经根本教主。法身遍一切处。华严宗「法界缘起」「一即一切」等核心教义皆围绕毗卢遮那佛法身展开——非历史人物，为华严教义之法身源头。
    level: direct
  person_100:  # 释迦牟尼
    note: 华严宗传统认为《华严经》为释迦成道后最初三七日于菩提树下为法身大士所说。此说虽非历史批判学的结论，但构成了华严宗「华严为顿教圆教」之判教基础。
    level: direct
  person_060:  # 元晓
    note: 新罗学僧。与义湘同代。其《起信论疏》与法藏《起信论义记》并称东亚起信论三大疏。海东华严传统的重要先驱。
    level: indirect
  person_061:  # 义湘
    note: 海东华严初祖。入唐从智俨学华严，与法藏同学。归国创浮石寺。其《华严一乘法界图》以诗偈图式浓缩华严法界观——为华严义学的东亚传播之关键人物。
    level: direct
  person_070:  # 慧苑
    note: 法藏上首弟子。改五教为四教、以十门代十玄，被澄观系统批判。慧苑的「异解」是推动澄观重新集大成的关键动力——在思想史上「错误」往往比「正确」更能激发体系完善。
    level: direct
  person_080:  # 续法
    note: 清代华严集大成者。著《贤首五教仪》系统整理法藏判教，编《华严宗佛祖传》梳理传承谱系。为华严宗在清代的中兴之祖。
    level: direct
  person_090:  # 慧光
    note: 北魏地论师南道派始祖。从勒那摩提学《十地经论》，世称「光统律师」。其学说经数代传承至智俨、法藏，是为华严宗义学之远源。
    level: indirect
  person_110:  # 法显
    note: 西行求法先驱。399年以65岁高龄从长安出发至印度，历时14年。其《佛国记》记录的印度佛教圣迹为后世理解华严经中的地理描述提供了实地参照。
    level: indirect
  person_111:  # 玄奘
    note: 大翻译家·法相宗创始人。其译《大般若经》六百卷与华严经同属大乘圆教体系。华严宗与法相宗在判教上有深层对话——华严以「性起」对法相之「缘起阿赖耶」。
    level: dialogue
  person_112:  # 义净
    note: 海上求法僧。其翻译偏重律藏。《南海寄归内法传》记录7世纪印度佛教实践，与华严经中的修行体系有互补参考价值。
    level: indirect
  person_140:  # 罗摩克里希纳
    note: 19世纪印度神秘主义者。主张「各宗教皆为通向同一真理的路径」。与华严宗「事事无碍法界」在宗教多元主义的哲学基础上形成跨文化对话——华严以「一即一切」破宗派之执。
    level: dialogue
  person_142:  # 奥罗宾多
    note: 印度整体瑜伽创立者。其「超心智演化」哲学——物质向精神的进化——与华严「法界缘起」中一切法相即相入的动态世界观有深层对话空间：二者皆否定终极的二元分离。
    level: dialogue
  person_143:  # 拉玛那·马哈希
    note: 印度不二论大师。其「Who am I?」参问法门直证自性。与华严宗「能所双泯」「真如实观」在修行论上有可比拟处——皆以消解自我虚妄为入道之门。
    level: parallel
  person_150:  # 寂天
    note: 那烂陀寺中观大师。著《入菩萨行论》。其「自他交换」菩提心修法与华严《普贤行愿品》「代众生苦」的菩萨行思想互相参照——不同传统在利他精神上的殊途同归。
    level: parallel
  person_152:  # 宗喀巴
    note: 藏传格鲁派创始人。其《菩提道次第广论》以三士道次第接引凡夫。与华严宗五教判教（小始终顿圆）在修行阶段论上有结构性的对比研究价值——皆以渐次引归圆顿。
    level: dialogue
  person_134:  # 胜师子王菩萨
    note: 印度国师·大乘瑜伽行法传承者。2008年于阿弥塔巴市传大乘瑜伽行法灌顶予海云继梦。此传法事件标志着印度古典瑜伽行法与汉传华严宗在当代的汇流——「三脉汇一」之瑜伽行支。
    level: direct

  # ── 汉地高僧新增 ──
  person_daoan:
    note: 中国佛教奠基人。首创僧团制度统一「释」姓。其弥勒净土信仰与华严宗毗卢遮那净土在「法身佛」层面形成呼应——皆以超越性法界为归依。
    level: indirect
  person_huiyuan:
    note: 净土宗初祖。庐山白莲社念佛结社。其《沙门不敬王者论》「方外之宾」的宗教独立性立场与华严宗「事事无碍」的入世圆融构成张力——早期佛教中国化在「出世」与「即世」之间的两极摇摆。
    level: dialogue
  person_sengzhao:
    note: 鸠摩罗什高足。著《肇论》以中观空性融会老庄语言。其「般若无知」论与华严「海印三昧」在「无分别智」上有深层义学对话——不同经论体系对「圣智」的共同描述。
    level: indirect
  person_daoxuan:
    note: 南山律宗创始人。著《续高僧传》为研究华严祖师（杜顺、智俨、法藏）的最重要原始文献之一。其《四分律删繁补阙行事钞》与华严菩萨戒（梵网经）在戒律学上互相补益。
    level: indirect
  person_hongren:
    note: 禅宗五祖。创东山法门开禅宗新纪元。海云继梦复兴「东山法门」之名，将华严禅观溯源至道信-弘忍-慧能一系，以此建立「华严禅」与「东山法门」的历史连续性。
    level: indirect
  person_linji:
    note: 临济宗创始人。其「无位真人」「随处作主」的禅风与华严「事事无碍」在日常行为中的落实有可比拟处。临济宗与华严宗在宗密「禅教融合」之后有持续的互动。
    level: dialogue
  person_yongming:
    note: 禅净双修倡导者。著《宗镜录》百卷以「一心」统摄诸宗——与华严「一心法界」的圆融旨趣相通。其四料简确立净土在末法时代的地位，对华严宗后世融合净土有启发。
    level: parallel
  person_hanshan:
    note: 明末四大高僧。刺血书《华严经》于五台山。其《楞严经通议》中大量引用澄观《华严经疏》，为明清华严学在禅宗中的延续之重要代表。
    level: indirect
  # ── 道家新增 ──
  person_gehong:
    note: 丹鼎派集大成者。著《抱朴子》内外篇。其「玄道」宇宙论与华严「法界」本体论在「终极实在」描述上有跨传统对话空间——皆以生生不息为宇宙本相。
    level: dialogue
  person_chengtuan:
    note: 希夷先生。著《无极图》授周敦颐，间接催生了理学宇宙论。周敦颐《太极图说》与华严「法界缘起」均以「无极化生」为宇宙生成模式——道教内丹、儒家理学、华严佛学在北宋的思想交汇。
    level: dialogue
  person_qiuchuji:
    note: 全真龙门派创始人。万里西行见成吉思汗「一言止杀」——宗教大师以道德力量介入世俗政治的典范。与华严祖师法藏为武则天说法、澄观为七帝师相呼应：宗教智慧在权力场中的「事事无碍」实践。
    level: parallel
  # ── 儒家新增 ──
  person_guangyu:
    note: 清学开山。著《日知录》以考证方法重建经学。其「经世致用」与华严「即世间而证法界」在「知行合一」上形成对比：儒家实证理性 vs 华严圆融实修。
    level: dialogue

  # ── 汉地高僧新增批注 ──
  person_anshigao:
    note: 汉译佛经第一人。译《安般守意经》为中国禅学之始。其「安般守意」数息法与华严禅观「数随止」三法中的「数法」在技术上有直接的渊源关系——中国佛教禅观从安世高到杜顺的千年传承脉络。
    level: indirect
  person_daoan:
    note: 中国佛教奠基人。首创僧团统一「释」姓、编定经录、确立戒律。其弥勒净土信仰与华严毗卢遮那净土在「法身佛」信仰上有结构呼应。道安的经典整理工作为后来华严经的翻译与研究奠定了制度基础。
    level: indirect
  person_huiyuan:
    note: 净土宗初祖。庐山白莲社念佛结社开中国净土宗先河。其《沙门不敬王者论》的宗教独立立场与华严宗「事事无碍」的入世圆融构成中国佛教「出世」与「即世」的经典张力。庐山与终南山(华严发源地)隔江相望——净土与华严的地理对话。
    level: dialogue
  person_sengzhao:
    note: 鸠摩罗什高足·解空第一。著《肇论》以中观空性融会老庄语言——「般若无知论」「物不迁论」。其「真空」思想经华严宗发展为「真空绝相观」(杜顺法界三观之第一观)，为中观空性向华严法界观的义理过渡之关键。
    level: indirect
  person_daoxuan:
    note: 南山律宗创始人。著《续高僧传》为研究华严祖师(杜顺、智俨、法藏)最重要的原始文献。《四分律删繁补阙行事钞》的戒律体系与华严菩萨戒(梵网经)在「以戒摄教」上有互补。终南山净业寺与至相寺(华严祖庭)同在终南山——律宗与华严宗的地理共生。
    level: indirect
  person_hongren:
    note: 禅宗五祖。创「东山法门」以《楞伽经》印心。海云继梦复兴「东山法门」之名，将华严禅观溯源至道信-弘忍-慧能一系——以此建立「华严禅」与「东山法门」的谱系连续性，为华严宗在当代的「禅观化」提供历史合法性。
    level: indirect
  person_shenxiu:
    note: 北宗禅创始人。武后迎为国师。「身是菩提树，心如明镜台」的渐修路线与华严宗「五教止观」的渐进体系在方法论上有可比拟处——皆以渐修次第为入道之门。神秀的「观心」与华严「驻佇心观」在技术面上亦有对应。
    level: parallel
  person_linji:
    note: 临济宗创始人。「无位真人」「随处作主」的峻烈禅风与华严「事事无碍」在日常行为中的自由落实形成深度对话——临济的「立处即真」与华严的「当相即道」在超越二元对立的实践哲学上殊途同归。
    level: dialogue
  person_yongming:
    note: 禅净双修倡导者。著《宗镜录》百卷以「一心」统摄诸宗，与华严「一心法界」的圆融旨趣深层相通。其「四料简」(有禅有净土/无禅无净土)确立净土在末法时代的修行地位——华严宗后世亦吸收此融合理路。
    level: parallel
  person_hanshan:
    note: 明末四大高僧。刺血书《华严经》于五台山。其《楞严经通议》大量引用澄观《华严经疏》。憨山中兴曹溪南华寺(六祖道场)，体现明末「禅教融合」中华严义学对禅宗的渗透。
    level: indirect
  person_zhuhong:
    note: 明末四大高僧·净土宗八祖。著《竹窗随笔》倡禅净融合。其云栖道场的念佛结社模式与华严宗的「普贤行愿」在日常实践中的落实形成对比——净土以「念佛」为行门，华严以「普贤行」为行门。
    level: parallel
  person_ouyi:
    note: 明末四大高僧。著《阅藏知津》为佛教目录学经典，《周易禅解》以禅解易——与李通玄以易解华严形成有趣的「方向相反」：李通玄以易入佛，蕅益以佛解易。二者皆体现中国佛教与儒家经典的双向诠释传统。
    level: dialogue
  # ── 道家新增批注 ──
  person_gehong:
    note: 丹鼎派集大成者。著《抱朴子》内外篇，内篇言丹道、外篇言儒术。「玄者自然之始祖」的宇宙论与华严「法界缘起」在「终极实在」的描述上有跨传统对话——葛洪以「玄」为万物本根，华严以「法界」为万法之源。
    level: dialogue
  person_chengtuan:
    note: 希夷先生·睡仙。著《无极图》授周敦颐，间接催生了理学宇宙论。周敦颐《太极图说》的「无极而太极」与华严「法界缘起」的「真空生妙有」在宇宙生成模式上有结构相似性——道教内丹、儒家理学、华严佛学在北宋形成思想三角。
    level: dialogue
  person_qiuchuji:
    note: 全真龙门派创始人。万里西行见成吉思汗「一言止杀」——宗教智慧介入世俗权力的经典案例。与华严祖师法藏为武则天说法(金师子章)、澄观为七帝之师相呼应：皆在最高权力面前以智慧转化暴力。
    level: parallel
  person_zhangsanfeng:
    note: 太极拳祖师。创内家拳以「松柔克刚」「以静制动」为要。太极拳的「松」与华严禅观的「舍识用根」在身心转化的技术面上有可比拟处——皆以放松身心为入门。武当山与禅宗少林并称——道教内丹与佛教禅观在身体技术上的并行发展。
    level: dialogue
  person_ludongbin:
    note: 八仙之首·纯阳真人。「黄粱一梦」典故出自其与钟离权的相遇——以梦境破执著。与华严「事事无碍」中破「法执」的修行逻辑有可比拟处：皆以超越对现象世界的执著为入道之门。
    level: parallel
  # ── 儒家新增批注 ──
  person_guangyu:
    note: 清学开山·亭林先生。著《日知录》以考证方法重建经学。「天下兴亡匹夫有责」的担当精神与华严「即世间而证法界」的入世取向在实践哲学上有对话空间——顾炎武以「经世致用」回应时代危机，华严以「事事无碍」圆融世间与出世。
    level: dialogue
  person_huangzongxi:
    note: 梨洲先生·启蒙思想家。著《明夷待访录》批判君主专制，《明儒学案》为中国第一部学术史。其「天下为主君为客」的民主思想与华严「一即一切」的平等观在政治哲学上有跨传统对话——华严以「法界平等」破一切等级之执。
    level: dialogue
  person_wangfuzhi:
    note: 船山先生·唯物主义先驱。「六经责我开生面」的学术担当与华严「事事无碍」在方法论上有可比拟处——皆以动态的、整体的视角把握实在。王夫之「气一元论」与华严「法界缘起」在万物一体观上有结构对应。
    level: dialogue
  person_simaqian:
    note: 太史公·《史记》作者。其「究天人之际通古今之变」的历史哲学与华严「法界缘起」的时间观——过去现在未来三世贯通——在历史意识上有跨传统对话：司马迁以史为鉴，华严以「一念摄无尽劫」超越线性时间。
    level: dialogue
  # ── 日本华严 ──
  person_j06:
    note: 日本华严中兴之祖·高山寺开山。著《摧邪轮》批判净土宗法然，复兴东大寺华严教学。明惠的「华严复兴」与宋代净源的「华严中兴」在东亚华严史上形成隔海呼应——十二三世纪华严宗在日本和中国的同步再生。
    level: direct
  person_124:
    note: 日本真言宗开祖·弘法大师。入唐从慧果受密法，归国后于高野山创真言宗。著《十住心论》以华严判教框架判摄显密诸宗——将华严宗「五教十宗」与密宗「十住心」结合，为东亚佛教判教思想的创造性融合。
    level: direct

events:
  - year: -563
    note: 释迦诞生。华严宗传统将华严经的教说定位在佛陀成道后的「最初三七日」，以此确立华严为「顿教」——佛陀最初直说的圆满大法。
  - year: -528
    note: 释迦成道。华严宗的「法界缘起」义理即从此觉悟的核心体验出发——佛陀在一念中顿见法界实相。
  - year: 167
    note: 支娄迦谶译《兜沙经》。这是《华严经》最早被翻译为汉文的单行经（对应《如来名号品》），标志着华严思想的汉传起点。
  - year: 344
    note: 鸠摩罗什诞生。其《十住经》译本为华严宗核心品目《十地品》在汉地的首次系统引入。
  - year: 401
    note: 鸠摩罗什抵长安。逍遥园译场开启中国历史上规模最大的佛经翻译工程，为华严学在中国的传播奠定了术语和义理基础。
  - year: 420
    note: 佛驮跋陀罗译出《六十华严》，华严经首次以完整形态进入汉文世界。
  - year: 508
    note: 菩提流支译《十地经论》，南北朝地论学派兴起——这是华严宗义学最重要的远源。
  - year: 557
    note: 杜顺诞生。一位开创性的禅僧，将华严经的义理转化为可操作的观法体系——华严宗由此从「经典注释」走向「修行宗派」。
  - year: 643
    note: 法藏诞生。华严宗将在他的手中完成从学派到宗派的飞跃——「贤首国师」的判教体系至今仍为华严教义的权威框架。
  - year: 699
    note: 实叉难陀译出《八十华严》（七处九会），华严宗的根本经典定型。法藏参与译场证义——译经与创宗同步进行。
  - year: 780
    note: 宗密诞生。其「禅教融合」的思想路线将深远影响后世华严宗的走向——华严从此不再是纯粹义学，而有了禅观的实践维度。
  - year: 1055
    note: 义天诞生。这位高丽王子将把华严宗带向朝鲜半岛——华严宗从此成为东亚佛教的共同遗产。
  - year: 1085
    note: 义天入宋求法于杭州慧因寺，华严宗传入朝鲜半岛。此事件标志着华严思想从「中国宗派」向「东亚传统」的转型。
  - year: 1858
    note: 月霞诞生。清末民初的华严复兴将由此人开启——华严大学的创立为现代华严学术研究奠定了基础。
  - year: 1914
    note: 月霞于常熟兴福寺创立华严大学，中国近代第一所华严专宗教育机构——「宗学」传统向现代「学术」的转型。
  - year: 1952
    note: 华严莲社在台北创立——华严宗在台湾落地生根，开启了海外弘传的新篇章。
  - year: 2008
    note: 海云继梦三脉汇流：受钦因传华严衣钵（贤首42世）+ 受胜师子王菩萨传瑜伽行法——华严宗在当代的「三脉汇一」标志着古典传统的新一轮创造性整合。
  - year: 2026
    note: 「九九华严」讲座 + 支提山大华严寺动土——华严宗在AI时代的自我更新与空间落地。
