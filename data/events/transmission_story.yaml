story:
  - y: -1500
    p: "吠陀仙人"
    lat: 29.0
    lng: 76.0
    ev: "雅利安人进入印度,吠陀宗教体系形成。梨俱吠陀为印度最古老宗教文献。轮回(karma)、禅定(dhyāna)等概念开始萌芽,为后来佛教思想提供了深厚的文化土壤。"
    src: "印度上古史"

  - y: -800
    p: "奥义书哲人"
    lat: 26.5
    lng: 82.0
    ev: "奥义书时代思想家提出梵(Brahman)与阿特曼(ātman)的哲学概念。佛教「无我」(anātman)说正是在与这一传统的对话和批判中形成。"
    src: "奥义书文献"

  - y: -563
    p: "释迦牟尼"
    lat: 27.5
    lng: 83.3
    ev: "悉达多太子诞生于迦毗罗卫城蓝毗尼园(今尼泊尔)。幼年受婆罗门传统教育,后出家求道,经历六年苦行。"
    src: "巴利文献·佛传"

  - y: -528
    p: "释迦牟尼"
    lat: 24.7
    lng: 84.99
    ev: "35岁时于菩提伽耶菩提树下觉悟成佛。华严宗传统认为《华严经》即于此后三七日中,于定中为法身大士所说,揭示法界缘起之宇宙实相。此为华严经教之源头。"
    src: "华严宗传统"

  - y: -528
    p: "释迦牟尼"
    lat: 25.4
    lng: 83.0
    ev: "成道后至鹿野苑为五比丘初转法轮,讲四圣谛八正道。佛教僧团成立。此后45年游化恒河流域,讲经三百余会。"
    src: "《杂阿含经》"

  - y: -483
    p: "释迦牟尼"
    lat: 26.7
    lng: 83.9
    ev: "80岁时于拘尸那罗入灭。佛教由此向四方传播。华严宗法身思想将释迦入灭理解为「化身隐而法身常」,毗卢遮那佛永恒说法于华藏世界。"
    src: "《大般涅槃经》"

  - y: -260
    p: "阿育王"
    lat: 25.3
    lng: 83.0
    ev: "阿育王皈依佛教,派传教师向四方传播佛法。第三次结集后佛教开始向中亚、东南亚扩散。"
