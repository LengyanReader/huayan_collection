  - y: 65
    lat: 33.7
    lng: 72.8
    z: 4
    label: "迦腻色迦王·犍陀罗结集"
    info: "贵霜帝国第四次结集。佛法深入中亚,犍陀罗成东传枢纽。大乘经论在此大量结集。"

