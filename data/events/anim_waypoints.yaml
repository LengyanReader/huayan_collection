    info: "佛陀时代六大非佛教思想家活跃。耆那教(尼乾陀若提子)、唯物论(阿耆多)、宿命论(末伽梨)等与佛教同时竞争。佛教正是在这一多元思想生态中确立其独特教义。"
    bg: true
    src: "《沙门果经》(DN 2)"

  - y: -528
    lat: 25.4
    lng: 83
    z: 5
    label: "初转法轮·鹿野苑"
