  - y: 675
    lat: 25.1
    lng: 85.4
    z: 5
    label: "义净·那烂陀寺留学"
    info: "义净抵达那烂陀寺,留学十载。学习瑜伽、中观、因明,并抄写戒律典籍。期间还到访王舍城灵鹫山等圣迹。"
    src: "《南海寄归内法传》"

  - y: 695
    lat: 34.3
    lng: 108.9
