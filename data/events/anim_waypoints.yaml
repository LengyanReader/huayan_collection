  - y: -483
    lat: 26.74
    lng: 83.89
    z: 5
    label: "释迦入灭·拘尸那罗"
    info: "80岁于拘尸那罗入灭。弟子结集经律,佛教由此向四方传播。"

  # ── 佛教东传 ──
  - y: -260
    lat: 25.3
    lng: 83
    z: 4
