  - y: 671
    lat: 23.1
    lng: 113.3
    z: 5
    label: "义净·广州乘船赴印"
    info: "义净(635-713)37岁从广州搭乘波斯商船出发,经南海诸国至印度。选择海路避开了西域战乱,开辟求法新路线。"
