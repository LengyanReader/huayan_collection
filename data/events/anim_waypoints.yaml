# 动画路径点 (从lineage.js ANIM_WAYPOINTS提取)
# 共约85条路径点，覆盖公元前1500年至2026年

waypoints:
  # ── 古印度文明·中国先秦 ──
  - y: -1500
    lat: 29
    lng: 76
    z: 3
    label: "吠陀文明·梨俱吠陀"
    info: "雅利安人入印,吠陀宗教体系形成。轮回、业力、禅定概念萌芽。"

  - y: -800
    lat: 26.5
    lng: 82
    z: 3
    label: "奥义书哲人·梵我哲学"
    info: "梵(Brahman)与阿特曼(ātman)概念提出。佛教「无我」说在此对话中形成。"

  - y: -600
    lat: 34.0
    lng: 114.0
    z: 5
    rel: "daoist"
    label: "☯老子·《道德经》"
    info: "老子(约前6世纪),道家学派创始人。据《史记》为周守藏室之史,居洛邑。后见周衰,西出函谷关,应关令尹喜之请著《道德经》五千言而去。"
    src: "《史记·老子韩非列传》"

  - y: -570
    lat: 34.6
    lng: 112.4
    z: 5
    rel: "daoist"
    label: "☯老子·周守藏室之史"
    info: "老子居洛邑任周王室守藏室之史(国家图书馆馆长)。在此期间博览典籍,形成其道法自然的哲学体系。"
    src: "《史记·老子韩非列传》"

  - y: -551
    lat: 35.6
    lng: 116.9
    z: 5
    rel: "confucian"
    label: "📖孔子诞生·鲁国陬邑"
    info: "孔子(前551-前479)生于鲁国陬邑(今山东曲阜)。父叔梁纥,母颜徵在。三岁丧父,家贫而好学。"
    src: "《史记·孔子世家》"

  - y: -522
    lat: 35.6
    lng: 116.9
    z: 5
    rel: "confucian"
    label: "📖孔子·三十而立·始教"
    info: "孔子约三十岁时开始授徒讲学,创办私学。主张有教无类,打破贵族对教育的垄断。"
    src: "《史记·孔子世家》"

  - y: -497
    lat: 36.0
    lng: 117.0
    z: 5
    rel: "confucian"
    label: "📖孔子·周游列国"
    info: "孔子55岁离开鲁国,开始14年周游列国之旅。先后至卫宋陈蔡等十余国,宣扬仁政德治,然终不见用。途中困于陈蔡之间,仍弦歌不辍。"
    src: "《史记·孔子世家》"

  - y: -484
    lat: 35.6
    lng: 116.9
    z: 5
    rel: "confucian"
    label: "📖孔子·归鲁删述六经"
    info: "68岁归鲁。整理《诗》《书》《礼》《乐》《易》《春秋》六经,为中国文化传承做出奠基性贡献。"
    src: "《史记·孔子世家》"

  - y: -479
    lat: 35.6
    lng: 116.9
    z: 5
    rel: "confucian"
    label: "📖孔子逝世·儒学历程开始"
    info: "73岁卒于鲁国。弟子编《论语》,儒学逐渐成为中华文明主流思想,后与佛教形成长达两千年的融突关系。"

  - y: -372
    lat: 35.5
    lng: 117.0
    z: 5
    rel: "confucian"
    label: "📖孟子·性善论"
    info: "孟子(约前372-前289),战国儒家代表。提出性善论仁政说。其心性之学后与佛教如来藏思想有深层对话空间。"
    src: "《史记·孟子荀卿列传》"

  - y: -335
    lat: 36.0
    lng: 117.0
    z: 5
    rel: "confucian"
    label: "📖孟子·游说齐梁"
    info: "孟子效法孔子周游列国,先后至齐梁等国宣扬仁政王道。齐宣王时曾为客卿,但主张终不见用。晚年退而与弟子万章等作《孟子》七篇。"
    src: "《史记·孟子荀卿列传》"

  - y: -469
    lat: 37.9
    lng: 23.7
    z: 4
    rel: "western"
    label: "🏛苏格拉底·雅典"
    info: "苏格拉底(前469-前399),古希腊哲学奠基人。与孔子大致同时代,东西方哲学两大源头并行发展。"
    bg: true
    src: "西洋哲学史"

  - y: -334
    lat: 33.0
    lng: 44.0
    z: 3
    rel: "western"
    label: "🏛亚历山大大帝东征"
    info: "亚历山大东征至印度河流域,希腊文化与印度文明首次大规模接触。为后来犍陀罗佛教艺术的出现埋下伏笔。"
    bg: true
    src: "世界史"

  - y: -369
    lat: 33.5
    lng: 115.0
    z: 5
    rel: "daoist"
    label: "☯庄子·蒙地漆园吏"
    info: "庄子(约前369-前286)生于宋国蒙地(今豫皖交界)。曾任漆园吏,后弃官隐居。楚威王曾聘其为相,庄子笑拒:宁游戏污渎之中自快,无为有国者所羁。"
    src: "《史记·老子韩非列传》"

  - y: -300
    lat: 33.5
    lng: 115.0
    z: 5
    rel: "daoist"
    label: "☯庄子·著《南华真经》"
    info: "庄子晚年著书十万余言。《逍遥游》论精神自由,《齐物论》破主客二元,《养生主》说庖丁解牛。其坐忘心斋之说后与佛教禅观相通。"
    src: "《庄子》/《史记》"

  - y: -313
    lat: 35.0
    lng: 116.0
    z: 5
    rel: "confucian"
    label: "📖荀子·性恶论"
    info: "荀子(约前313-前238),战国儒家。性恶隆礼重法。其天人之分与佛教缘起论有可比较处。"
    src: "《史记·孟子荀卿列传》"

  # ── 释迦生平 ──
  - y: -563
    lat: 27.5
    lng: 83.3
    z: 5
    label: "释迦诞生·蓝毗尼园"
    info: "悉达多太子生于迦毗罗卫。幼受婆罗门教育,后出家求道。"

  - y: -528
    lat: 24.7
    lng: 85
    z: 5
    label: "释迦成道·菩提伽耶"
    info: "35岁菩提树下觉悟。华严宗传统:此后三七日于定中说《华严经》,揭示法界缘起。"

  - y: -500
    lat: 25.5
    lng: 83.0
    z: 4
