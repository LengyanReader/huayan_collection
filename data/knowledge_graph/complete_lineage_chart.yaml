meta:
  version: "0.1.0"
  last_updated: "2024-07-24"
  total_generations: 42
  note: >
    贤首宗即华严宗，因三祖法藏受封"贤首国师"得名。
    五祖宗密后经唐武宗灭佛一度中衰，宋代长水子璿、晋水净源中兴。
    明末清初由南山真萃门下分化出高原、雪浪、云栖、宝通四大法系。
    当代高原法系在台湾由福慧寺和大华严寺分别传承。

lineages:

