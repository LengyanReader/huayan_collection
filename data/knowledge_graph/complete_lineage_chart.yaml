  - id: lineage_yunqi
    name: "贤首宗·云栖法系"
    period: "明代 — 2011年"
    note: >
      第26世云栖莲池大师中兴此系。
      传至月霞(32世)创立华严大学(1914)，开启近现代华严教育。
      南亭(34世)与智光共创台北华严莲社(1952)。
      成一(36世)创立华严专宗学院(1975)。
    generations:
