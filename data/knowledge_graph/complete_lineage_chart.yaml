  - id: lineage_hw_patriarchs
    name: "华严五祖根本法脉"
    period: "557-841 CE (唐)"
    note: "华严宗思想体系的创立者，五人奠定了华严教学的完整框架"
    generations:
      - {order: 1, name: "杜顺", title: "帝心尊者", years: "557-640", also_known_as: ["法顺"], note: "华严初祖，著《法界观门》"}
      - {order: 2, name: "智俨", title: "云华尊者", years: "602-668", also_known_as: ["至相尊者"], note: "华严二祖，著《搜玄记》"}
      - {order: 3, name: "法藏", title: "贤首国师", years: "643-712", also_known_as: ["香象大师", "康藏国师"], note: "华严三祖·贤首宗实际创立者·贤首第一世", sx_order: 1}
      - {order: 4, name: "澄观", title: "清凉国师", years: "738-839", also_known_as: ["大统国师"], note: "华严四祖·集大成者·贤首第二世", sx_order: 2}
      - {order: 5, name: "宗密", title: "圭峰禅师", years: "780-841", also_known_as: ["定慧禅师"], note: "华严五祖·禅教融合者·贤首第三世", sx_order: 3}

