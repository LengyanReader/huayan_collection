# ═══════════════════════════════════════════════════════
# 四、论释 — 对华严经各品的系统性注释
# ═══════════════════════════════════════════════════════

treatises:
  - id: text_treat_001
    title_zh: "十住毗婆沙论"
    title_sa: "Daśabhūmika-vibhāṣā"
    taisho_no: "T26n1521"
    volumn_count: 17
    dynasty: "姚秦"
    translator: "鸠摩罗什（据佛陀耶舍口述）"
    author: "龙树 (Nāgārjuna)"
    context_note: >
      【语境注意】经名虽含"十住"，实际是对《华严经·十地品》的注释。
      现存仅十七卷（仅注释至第二地），全本已佚。
      据传译自《大不思议论》十万颂。
      这是现存最早的《十地品》系统注释，被华严宗奉为法统源头之一。

  - id: text_treat_002
    title_zh: "十地经论"
    title_sa: "Daśabhūmika-sūtra-śāstra"
    taisho_no: "T26n1522"
    volumn_count: 12
    dynasty: "后魏"
    translator: "菩提流支等"
    author: "世亲 (Vasubandhu)"
    context_note: >
      世亲菩萨对《十地品》的系统注释。创新"六相"等名相范畴，
      汉译本催生了南北朝地论师学派。澄观《华严经疏钞》全面吸收
      其思想。是连接印度唯识学与汉传华严学的关键论典。

  - id: text_treat_003
    title_zh: "大乘起信论"
    title_sa: "Mahāyāna-śraddhotpāda-śāstra"
    taisho_no: "T32n1666"
    volumn_count: 1
    dynasty: "梁"
    translator: "真谛（另一说马鸣造·实叉难陀译）"
    author: "马鸣 (Aśvaghoṣa) [传统著录]"
    context_note: >
      虽非直接注释华严经，但"一心开二门""真如缘起"等核心思想
      与华严宗"法界缘起"理论深度关联。法藏著《大乘起信论义记》
      为最权威注释之一。

