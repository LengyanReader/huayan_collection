# ============================================================
# 华严宗部文献完整目录
# 版本: 0.2.0
# 覆盖: 大正藏 T09-T10 华严部 + 论藏相关 + 近现代著作
# 每部文献附语境关联标注，避免望文生义
# ============================================================

meta:
  version: "0.2.0"
  last_updated: "2024-07-24"
  scope: >
    覆盖范围:
    (1) 主体华严经三大汉译本 (六十/八十/四十)
    (2) 支流别译经 (各品异译本，需逐品对校语境)
    (3) 眷属经 (与华严义理相关但非正部)
    (4) 论释 (十地经论、十住毗婆沙论等)
    (5) 华严祖师章疏论著
    (6) 藏文华严 (Toh 44) 及相关文献
    (7) 近现代华严研究著作
  principle: >
    【语境关联原则】:
    别译本、眷属经与大经正文的关联必须基于整体内容和义理语境判断，
    不可仅凭经名或品名望文生义。例如:
    - 《最胜问菩萨十住除垢断结经》(T0309): 虽以十住为名，法藏明确判为
      "非十住品亦非十地品"，不可简单归入十住品别译
    - 《十住毗婆沙论》: 虽以十住为名，实为十地品注释（仅至第二地）
    - 藏译华严与汉译的品目差异需逐品对勘内容，不可机械映射序号
  sources:
    - "大正新修大藏经 第9-10册 华严部 (T0278-T0309)"
    - "CBETA 目录整理"
    - "法藏《华严经传记》"
    - "义天《新编诸宗教藏总录》(义天录)"
    - "法经《众经目录》"
    - "德格版甘珠尔目录 (Toh 44)"

# ═══════════════════════════════════════════════════════
# 一、主体华严经 — 三大汉译本
# ═══════════════════════════════════════════════════════

main_sutras:
  - id: text_main_001
    title_zh: "大方广佛华严经（六十华严）"
    title_sa: "Buddhāvataṃsaka-nāma-mahāvaipulya-sūtra"
    title_en: "The Avatamsaka Sutra (60-fascicle)"
    taisho_no: "T09n0278"
    cbeta_id: "T09n0278"
    type: sutra
    dynasty: "东晋"
    translator: "佛驮跋陀罗 (Buddhabhadra)"
    date_text: "约418-420年"
    volumn_count: 60
    chapter_count: 34
    structure: "七处八会"
    context_note: >
      最早汉译全本华严。译自支法领从于阗带回的梵本。
      三十四品中，《宝王如来性起品》为八十华严之《如来出现品》所替代，
      结构亦有调整。六十华严保留了部分更接近早期梵本的表述。
    related_to: ["text_main_002", "text_main_003"]
    relation_type: "earlier_translation"

  - id: text_main_002
    title_zh: "大方广佛华严经（八十华严）"
    title_sa: "Buddhāvataṃsaka-nāma-mahāvaipulya-sūtra"
    title_en: "The Avatamsaka Sutra (80-fascicle)"
    taisho_no: "T10n0279"
    cbeta_id: "T10n0279"
    type: sutra
    dynasty: "唐"
    translator: "实叉难陀 (Śikṣānanda)"
    date_text: "约695-699年"
    volumn_count: 80
    chapter_count: 39
    structure: "七处九会"
    context_note: >
      目前汉传佛教最通用的华严经版本。武则天从于阗请来梵本，
      诏实叉难陀等于洛阳佛授记寺翻译。法藏参与证义。
      三十九品，七处九会结构较六十华严完整。
      缺藏译本中的《如来华严品》和《普贤宣说品》。
    related_to: ["text_main_001", "text_main_003", "text_bo_001"]
    relation_type: "standard_version"

  - id: text_main_003
    title_zh: "大方广佛华严经（四十华严）"
    title_sa: "Gaṇḍavyūha-sūtra"
    title_en: "The Avatamsaka Sutra (40-fascicle) / The Stem Array"
    taisho_no: "T10n0293"
    cbeta_id: "T10n0293"
    type: sutra
    dynasty: "唐"
    translator: "般若 (Prajñā)"
    date_text: "约796-798年"
    volumn_count: 40
    chapter_count: 1
    structure: "单品（入法界品全本）"
    context_note: >
      即《入法界品》的单行全本翻译。内容比六十华严和八十华严中的
      《入法界品》更完整。文末附《普贤菩萨行愿赞》，为藏汉佛教
      共同尊奉的重要修行文献。善财童子五十三参的故事全本在此。
    related_to: ["text_main_002", "text_bo_001"]
    relation_type: "expanded_chapter"

