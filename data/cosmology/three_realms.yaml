# 三界诸天·修行对应图 (从cosmology.js drawTower() data数组提取)
# 据大华严寺官网「华严禅观全程一览表」及海云法师《四十华严讲记》《华严禅行法》系列
# 28天对应三阶修行次第 + 十信位果位 + 禅定进路

# Column configuration for rendering
columns:
  practice:
    x: 10
    w: 120
    label: "修行次第(海云法师体系)"
  heaven:
    x: 140
    w: 40
    label: "二十八天"
  bar:
    x: 280
    w: 260
  stage:
    x: 560
    w: 120
    label: "十信位·果位"
  method:
    x: 680
    w: 180
    label: "禅定进路"

