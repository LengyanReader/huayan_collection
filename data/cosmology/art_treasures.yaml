      - text: "Wikimedia更多"
        url: "https://commons.wikimedia.org/wiki/Category:Todaiji_Daibutsu_in_art"

  - id: 5
    title: "犍陀罗·华严佛传造像(贵霜时期·1-3世纪)"
    icon: "🏺"
    description: |
      犍陀罗(今巴基斯坦北部)为大乘佛教发源地之一。贵霜时期大量佛传浮雕:舍卫城神变、燃灯佛授记等场景与《华严经》所述佛陀大光明神变在图像学上有渊源。栗田功《大美之佛像:犍陀罗艺术》(文物出版社2017)为权威参考。
    links:
      - text: "大英博物馆·犍陀罗"
        url: "https://www.britishmuseum.org/collection/search?keyword=gandhara"
      - text: "大都会博物馆"
        url: "https://www.metmuseum.org/search?q=gandhara"
      - text: "B站犍陀罗"
        url: "https://www.bilibili.com/search?keyword=%E7%8A%8D%E9%99%80%E7%BD%97+%E4%BD%9B%E5%83%8F"

  - id: 6
    title: "莫高窟第237窟·双头瑞像(中唐·吐蕃时期)"
    icon: "🖼"
    description: |
      中唐代表窟。西壁佛龛顶部绘双头瑞像——故事发生在犍陀罗国:两位贫士各请画师绘释迦像,画师收两份钱绘一尊,佛像显灵现双头一身神变。身着吐蕃服装的俗人仰礼,见证汉蕃丝路文化交流。
    links:
      - text: "敦煌研究院·237窟"
        url: "https://www.dha.ac.cn/info/1425/3641.htm"

  - id: 7
    title: "洛阳龙门·奉先寺卢舍那大佛(唐·17m)"
    icon: "🗿"
    image: "https://commons.wikimedia.org/wiki/Special:FilePath/Vairocana%2C_Fengxian_Temple%2C_Longmen_Grottoes_%2810240207654%29.jpg?width=800"
    image_caption: "龙门奉先寺卢舍那大佛 · 唐·672年 · 通高17.14m · 图片: Wikimedia CC0 Public Domain"
    description: |
      龙门石窟奉先寺卢舍那大佛(通高17.14m),唐高宗咸亨三年(672)武则天赞助营造。华严教主毗卢遮那佛的盛唐皇家造像巅峰,被誉东方蒙娜丽莎。与东大寺卢舍那、敦煌华严经变并称三大华严艺术瑰宝。
