# ── 华严四十二字母 ──
alphabet_intro: |
  华严四十二字母出自《华严经·入法界品》(T10n0279),善财童子参访第四十四位善知识——众艺童子所传授的「字智法门」。依音节分一合(单字33个)·二合(双字拼合8个)·三合(三字拼合1个)。因字有语、因语有名、因名有义,唱诵可获殊胜功德。佛光山梵呗团版为最完整权威版本。

alphabet_table:
  - category: "一合(单字)"
    count: 33
    characters: "阿·多·波·左·那·逻·拖·婆·茶·沙·嚩·哆·也·瑟吒·迦·娑·么·伽·他·社·鏁·拖·奢·佉·叉·娑多·壤·曷攞多·婆·车·娑么·诃婆·縒·伽·吒·拏·娑颇·娑迦·也娑·室左·侘·陀"

  - category: "二合(双字拼合)"
    count: 8
    characters: "娑多·曷攞多·婆·车·娑么·诃婆·縒·伽"

  - category: "三合(三字拼合)"
    count: 1
    characters: "曷攞多"

alphabet_source: "《大方广佛华严经·入法界品》(CBETA T10n0279卷八十) · 众艺童子传授善财童子「善知众艺菩萨字智法门」"

