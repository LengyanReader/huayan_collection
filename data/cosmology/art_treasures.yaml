art_treasures:
  - id: 1
    title: "敦煌·华严经七处九会绢画(五代·吉美博物馆藏)"
    icon: "🏛"
    description: |
      唯一存世的敦煌藏经洞华严经全经绢画 · MG.26462 · 194×179cm · 10世纪

      敦煌藏经洞出土,近2米大幅绢本。九铺说法图对应七处九会:菩提场、普光明殿(3次)、忉利天宫、夜摩天宫、兜率天宫、他化天宫、逝多林。底部绘莲华藏世界海。据实叉难陀译八十华严绘制。《伯希和敦煌图录》第一卷图22即为莫高窟146窟同类题材。
    location: "法国吉美国立亚洲艺术博物馆 (Musée Guimet, Paris) · 伯希和收集品"
    links:
      - text: "吉美博物馆官网"
        url: "https://www.guimet.fr"
      - text: "IDP 高清大图"
        url: "http://idp.bl.uk/database/oo_scroll_h.a4d?uid=59205289518;bst=1;recnum=13528"
      - text: "数字敦煌"
        url: "https://www.e-dunhuang.com"
      - text: "图说华严经"
        url: "https://www.sohu.com/a/406251191_467442"

  - id: 2
    title: "敦煌·十地品变相图(唐·绢本设色)"
    icon: "🏛"
    description: |
      绢本设色,62.5×20cm,藏经洞出土。毗卢遮那佛于他化自在天宣说十地法门,十幅画面逐层展现欢喜地至法云地的修行次第。两侧胁侍解脱月菩萨与金刚藏菩萨。
    location: "法国吉美国立东方美术馆"
    links:
      - text: "吉美博物馆"
        url: "https://www.guimet.fr"
      - text: "图说华严经"
        url: "https://www.sohu.com/a/406251191_467442"

  - id: 3
    title: "莫高窟·华严经变壁画群(28个洞窟·盛唐~宋)"
    icon: "🖼"
    description: |
      敦煌莫高窟现存华严经变洞窟28个(盛唐44窟至宋454窟)。中唐后成熟:九宫格七处九会+底部莲华藏世界+善财五十三参屏风画。代表:第12窟(北壁·数字敦煌有收录)/第237窟(双头瑞像)/第146窟(伯希和图录)。
    links:
      - text: "敦煌研究院"
        url: "https://www.dha.ac.cn"
      - text: "数字敦煌"
        url: "https://www.e-dunhuang.com"
      - text: "伯希和图录 146窟"
        url: "https://dsr.nii.ac.jp/reference/pelliot/entry/1-022.html.zh"

  - id: 4
    title: "奈良东大寺·卢舍那大佛(8世纪·世界遗产)"
    icon: "🗿"
    image: "https://commons.wikimedia.org/wiki/Special:FilePath/NaraTodaijiDaibutsu0212.jpg?width=640"
    image_caption: "东大寺卢舍那大佛 · 金铜铸造 · 高约15m · 752年开眼 · 图片: Wikipedia Public Domain (Fg2, 2005)"
    description: |
      日本华严宗总本山。金铜卢舍那大佛高约15m,743年圣武天皇发愿铸造,752年开眼。大佛殿为世界现存最大木构建筑(宽57m×高49m)。正仓院藏唐代华严相关文物300+件(含全球唯一存世唐五弦琵琶)。1998年世界文化遗产。
    links:
      - text: "东大寺官网"
        url: "https://www.todaiji.or.jp"
      - text: "正仓院(宫内厅)"
        url: "https://shosoin.kunaicho.go.jp"
