article: lou-yulie
title_zh: 楼宇烈纪念综述·图像登记册
title_en: Imagery register for the memorial survey on Lou Yulie
purpose: 本文正文插图之**唯一权威著录源**。凡正文引用之图像，须在此登记：名称／年代／现址／作者、**授权类型与授权链接**、以及「图像与所述人物之关系边界」。图块、图注、图源署名与文末著录总表皆由 scripts/gen_louyl_imagery.py 由此登记源生成，杜绝手工转录 URL 与著录笔误。
license_policy: 一律取自 Wikimedia Commons 可核验授权文件，按 Commons 结构化元数据（extmetadata：LicenseShortName／LicenseUrl／Artist／DateTimeOriginal）逐条核验。优先级：① Public domain／CC0；② CC BY；③ CC BY-SA。一律不用 NC／ND／Fair use／授权不明者。CC BY／CC BY-SA 必填 author_zh；无著录作者者如实标〔待核〕，不得臆造。核验于 2026-11-24（Commons API 抽验＋全量 HEAD 200 复检）。
boundary_principle: 本文为纪念性综述。经全量检索，**楼宇烈本人、奚啸伯、欧阳中石在 Wikimedia Commons 均无自由授权照片**（见 negative_findings），故本册**零 A 类（本人影像）**，所收皆为：交游人物本人影像（B 类：俞平伯、张允和、张伯驹——图中确系其人，但**图中无楼宇烈**）、场景／类型样本与器物／古籍参照（C 类：昆曲演出、京剧舞台、古琴、未名湖、马王堆帛书、荀子像）。**每一图注必须含「边界」二字**，明示「图中无楼宇烈本人」「非演出实景」等不可等同之处（由 scripts/verify_imagery_gen.py 强制校验）。
negative_findings:
  - id: neg-lou-portrait
    claim: 楼宇烈本人照片
    result: 未检得
    detail: Commons 全文检索（Lou Yulie／楼宇烈）无人物照命中；命中共 CADAL 丛书扫描噪音。正文因此**不设楼氏肖像**；文首场景图（未名湖）为燕园环境参照。新闻媒体所载楼氏照片均属版权作品，本项目不用。
  - id: neg-xi-xiaobo
    claim: 奚啸伯照片
    result: 未检得
    detail: 'Xi Xiaobo／奚啸伯 检索命中皆无关文件或古籍扫描噪音。§4.4 之「京剧老生」图以民国老生名家刘鸿声戏装照作**类型样本**充位，图注已明标「非奚啸伯本人」。'
  - id: neg-ouyang-zhongshi
    claim: 欧阳中石照片
    result: 未检得
    detail: 仅一段 2020 年追忆视频（.webm·授权未核·非照片），按宁缺毋滥排除；余为以其题字命名之建筑照，不录用。
