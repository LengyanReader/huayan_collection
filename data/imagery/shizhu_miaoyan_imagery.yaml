  source_page: https://commons.wikimedia.org/wiki/File:Eight_Bodhisattvas_Mandala_from_Cave_25,_Yulin_Caves.jpg
  relevance_zh: 与图 1-1 同窟（榆林窟第25窟）之**会众**部分，可与本节「上首二十名、十一冠普」之广列会众对读——然**两者体系不同，须严格分开**。Commons 将此图归入「**Womb Realm Vairocana**」类目，该类目展开即「**胎藏界大日如来**」（*Garbhadhātu* 曼荼罗），故其仪轨依据为密教《大毘卢遮那成佛神变加持经》之灌顶法，**非本经之华藏体系**。**边界**：①「八大菩萨」为曼荼罗中依方位配置的八尊，**非经中名号之罗列**，故不得据以图解「二十名／十一位冠普」；②图中所绘诸尊之名，本文未逐一比对画面与题记，Commons 类目所列（文殊、普贤、虚空藏、弥勒、药师、金刚手、金刚萨埵、地藏等）仅备参考〔待核〕；③Commons 另有一幅「复原图」（2700×1080）系现代修复摹本（derivativeFX），**不得当作历史原状**引用，本文只用现状图。
  relevance_en: 'The assembly of the same cave as Fig. 1-1, to be read against this section''s broad listing of the twenty chief ones — but the two systems must be kept apart. Commons files this under "Womb Realm Vairocana," a category whose description reads *胎藏界大日如来*; the ritual basis is therefore the maṇḍala of the Esoteric *Garbhadhātu* as transmitted in the *Mahāvairocanatathāgatotpādanirdeśa* (大毘盧遮那成佛神変加持経), **not** the Avatamsaka''s own Avataraṇḍa system. Boundaries: (1) the "eight great bodhisattvas" are eight figures disposed by position, **not a list of names**, and cannot be used to illustrate "twenty names, eleven Samanta-…"; (2) the names in the Commons categories (Maṇjuśrī, Samantabhadra, Ākāśagarbha, Maitreya, Bhaiṣajyaguru, Vajrapāṇi, Sarvanivāraṇaviṣkambhin, Kṣitigarbha) have not been collated against the paintings themselves [to be verified]; (3) the companion "restored" version (2700×1080) is a modern retouching, **not the historical state**, and is not used here.'
  caption_zh: 榆林窟第25窟·八大菩萨曼荼罗（现状，8世纪末·吐蕃统治期）——与图 1-1 同窟，主尊两侧绘八大菩萨曼荼罗，**然其体系与本经不同**：Commons 归其于「Womb Realm Vairocana（**胎藏界大日如来**）」，即密教**胎藏界**曼荼罗，仪轨依据为《大毘卢遮那成佛神变加持经》，**非本经之华藏**。**术语之辨（易混）**：本经《华藏世界品》之「**华藏**」（*Avataraṇḍa*，「藏」亦译 *garbha*）与密教「**胎藏界**」（*Garbhadhātu*）同用一个「藏」字，而**分属两套体系**：前者为毗卢遮那所住之世界海，后者为曼荼罗中之佛。**边界**：八大菩萨系依方位配置之八尊，**非经中名号之罗列**，不得据以图解「二十名／十一位冠普」；Commons 另有一幅现代修复「复原图」，非历史原状，本文不用〔待核〕。
  caption_en: 'The assembly of the same cave as Fig. 1-1 — eight bodhisattvas disposed about the central image, **but belonging to a different system**: Commons classes it as "Womb Realm Vairocana" (*胎藏界大日如来*), i.e. the Esoteric *Garbhadhātu* maṇḍala, whose ritual basis is the *Mahāvairocanatathāgatotpādanirdeśa*, **not** this sutra''s Avataraṇḍa. A terminological trap worth stating: the *Avataraṇḍa* of the "Perasambhavati Viśodaya" and the Esoteric *Garbhadhātu* both render the same Chinese character 藏 while denoting **two different systems** — the world-sea in which Vairocana abides, and the Buddha within a maṇḍala. Boundary: the eight figures are disposed by position, **not a list of names**, and cannot illustrate "twenty names, eleven Samanta-…"; a modern retouched "restored" version exists on Commons and is not used here [to be verified].'
  status: confirmed
  kind_label: 【同佛名·华严道场】
- id: ajanta-kinnara-veena
  kind: C
