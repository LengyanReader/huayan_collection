  title_en: The four great continents and the mountains of Mount Sumeru (1921)
  era_zh: 1921（民国十六年辛酉）
  location_zh: 中土
  file: File:四大部洲須彌諸山.jpg
  thumb_url: https://upload.wikimedia.org/wikipedia/commons/thumb/1/1c/%E5%9B%9B%E5%A4%A7%E9%83%A8%E6%B4%B2%E9%A0%88%E5%BD%8C%E8%AB%B8%E5%B1%B1.jpg/960px-%E5%9B%9B%E5%A4%A7%E9%83%A8%E6%B4%B2%E9%A0%88%E5%BD%8C%E8%AB%B8%E5%B1%B1.jpg
  source_page: https://commons.wikimedia.org/wiki/File:%E5%9B%9B%E5%A4%A7%E9%83%A8%E6%B4%B2%E9%A0%88%E5%BD%8C%E8%AB%B8%E5%B1%B1.jpg
  license_zh: 公有领域
  license_en: Public domain
  license_url: ''
  author_zh: 观月比丘兴慈（一九五〇年圆寂）
  date: '1921'
  relevance_zh: 置于**器世间**一节，用作**反面对照**：此为中土传统的须弥山宇宙图， 即19—20 世纪汉地教内仍通行的「四洲八山、咸水内海」之器世间观。 华严宗**不取此说为实**——澄观《疏》即以「一切处、唯心所现」斥之， 故本品十九类神所主之「城、地、山、林、药、稼、河、海、水、火、風、空、方、夜、晝」 非「地图上之实体」，而是**如来境界之投影**。此图之用， 正为使读者见「所斥者何物」。**边界声明**：此为后世教内制图， 非本品之图，亦非唐宋造像；其宇宙观与本经不同，不得据以读经。
  relevance_en: 'Placed in the "vessel world" section as a deliberate foil: this is the traditional Sumeru-cosmography chart still current in Chinese Buddhist circles in 1921 — four continents, eight mountains, the encircling salt sea. Huayan does not take this as real; the nineteen classes of deities preside not over entities on a map but over projections of the Tathagata''s field. The image is included so the reader can see what Huayan rejects. Boundary: a later Chinese religious chart, not a Huayan image.'
  status: confirmed
  kind_label: 【后世·反面对照】
  caption_zh: 四大部洲须弥诸山图（1921 年民国重订《二课合解》刊本，观月比丘兴慈绘）——置于**器世间**一节，作**反面对照**：此为中土传统须弥山宇宙图，即二十世纪汉地教内仍通行的「四洲八山、咸水内海」之器世间观。华严不取此说为实，澄观《疏》即以「一切处、唯心所现」斥之，故本品十九类神所主之「城、地、山、林、藥、稼、河、海、水、火、風、空、方、夜、晝」非地图上之实体，而是如来境界之投影——此图之用，正为使读者见「所斥者何物」。**边界**：后世教内制图，非本品之图，不得据以读经。
  caption_en: 'A deliberate foil in the "vessel world" section: the traditional Sumeru cosmography still current in Chinese Buddhist circles in 1921 — four continents, eight mountains, the encircling salt sea. Huayan does not take this as real, and the nineteen classes of deities preside not over entities on a map but over projections of the Tathagata''s field. The image is included so the reader can see what Huayan rejects. Boundary: a later Chinese religious chart, not a Huayan image.'
