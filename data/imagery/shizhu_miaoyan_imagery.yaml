  relevance_zh: 本品「其師子座高廣妙好，摩尼為臺，蓮華為網」之**座之实物**： 唐建中三年南禅寺大殿为我国现存最早之木构建筑，殿内释迦牟尼像下即为须弥座。 座之下枋以「壸门」承托，其制度即后世「师子座」之祖型。 **边界声明**：须弥座与师子座非一物——须弥座承物、师子座以师子为座饰； 此取其「高广妙好」之制度以为参照，不作等同〔存疑待考〕。
  relevance_en: 'Material counterpart to the chapter''s lion-throne: the Śākyamuni image of Nanchan Temple (782) — the earliest surviving timber building in China — stands on a xumizuo pedestal. Boundary: a xumizuo is not a lion-throne (sumeru-pedestal bears; lion-throne is ornamented with lions), so the comparison is one of institution, not identity.'
  status: confirmed
  kind_label: 【实物·制度参照】
  caption_zh: 五台山南禅寺大殿释迦牟尼须弥座（唐建中三年 782）——对应「其師子座高廣妙好，摩尼為臺，蓮華為網」之**座之实物**；南禅寺大殿为我国现存最早之木构建筑。**边界**：须弥座承物、师子座以师子为座饰，二者非一物，此取其「高廣妙好」之制度以为参照，不作等同〔存疑待考〕。
  caption_en: 'Material counterpart to the chapter''s lion-throne: the Śākyamuni image of Nanchan Temple (782) — the earliest surviving timber building in China — stands on a xumizuo pedestal. Boundary: a xumizuo bears, a lion-throne is ornamented with lions; the comparison is one of institution, not identity.'
