  caption_zh: 敦煌莫高窟第61窟·五台山图（十世纪）中之文殊道场——对应「智正覺世間」之**「智」**：文殊之净土在清凉五台山，此窟因文殊而名「文殊堂」。此图为**现存最早之中国地图之一**，以山川方位画「文殊所居」之世界，示「智」亦有可主之境，与「名號即所主」之通例相合。**边界**：属文殊／五台信仰之图像，非华严经变，亦非本品之图。
  caption_en: 'For "the world of right knowledge and enlightenment": Manjusri''s pure land is Mount Wutai, and Cave 61 takes its name from him. Among the earliest surviving Chinese maps, it shows that "wisdom" too has a place and a presiding deity — consonant with the chapter''s rule that a name mirrors its domain. Boundary: a Wutai/Manjusri image, not a Huayan tableau.'
- id: sumeru-four-continents-1921
  kind: C
  section: '2.10'
  figure_no: 2-12
