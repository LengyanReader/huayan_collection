article: shizhu-miaoyan
title_zh: 世主妙严品·会众意象图像登记册
title_en: Imagery register for the Chapter on the Majestic Adornment of the World-Lord
purpose: 本文件为《华严经细读·第一部》正文插图的**唯一权威著录源**。凡正文引用之图像， 须在此登记：所应之经句、图像本身之名称／时代／现址／作者、**授权类型与授权链接**、 以及「图像与经文之关系边界」（凡图像与经文并非同一事物者，必须如实标注，不得混同）。
license_policy: 一律取自 Wikimedia Commons 之可核验授权文件，并按 Commons 结构化元数据（extmetadata：LicenseShortName／LicenseUrl／Artist／DateTimeOriginal／ObjectName）逐条核验。优先级：① Public domain／CC0（无署名义务，最优先）；② CC BY 4.0（须署名）；③ CC BY-SA 4.0（须署名并保持同授权）。一律不用来源不明、无授权著录，或授权为「非商业」「仅研究」者。**署名义务**：凡 CC BY／CC BY-SA 必填 author_zh；无著录作者者如实标〔待核〕摄影者，**不得留白、不得臆造**。
verification_note: 全量核验于 2026-10-01 完成：13 项 thumb_url 与 source_page 逐条 HTTP HEAD 实测，本批次新增项 2/2 均为 HTTP 200，全库 26/26 均为 HTTP 200；榆林窟第25窟八大菩萨曼荼罗一项另经 Commons extmetadata 与 Category:Womb Realm Vairocana 类目正文双重核验（该类目展开即「胎藏界大日如来」），据以判定其为密教胎藏界体系而非本经之华藏体系。
boundary_principle: '本品（T279《世主妙严品》）之图像**皆无同时代「依本经」之专像**，故三类须严格区分，不得混为一谈：

  (A) **依本经之造像／壁画**——专为《世主妙严品》而作者。**本批 0 件**（见 scope_note）。

  (B) **同题域之他经／他题域图像**——非本经之变，然同属华严／毗卢遮那／文殊等题域，可作图像学对读，但**其教义归属不可与本品相混**。本批 6 件：榆林窟第25窟、飞来峰第5龛（卢舍那佛会）、龙门奉先寺卢舍那大佛龛、大足宝顶山华严三圣（以上四件属华严／毗卢遮那题域）、莫高窟第172窟《观无量寿经变》之楼阁（净土经变）、莫高窟第61窟五台山图（文殊／五台信仰）。

  (C) **实物或后世图像**——「意象之实物」（菩提树、佛殿、须弥座、摩尼宝珠、佛殿遗址）或后世 rendition（1921 年须弥山宇宙图），属意象之参照或**反面对照**，非经文之图像化。本批 6 件。

  每一登记项以 kind 字段标明其属 A／B／C；**B／C 类之正文图注必须含「边界」二字**（由 scripts/verify_imagery.py 强制校验），明示其不可等同之处。

  **判准**：是否**为本经而作**（A），抑或仅**同题域**（B）／**意象之实物或后世**（C）——宁可归 B、C 而不冒称 A（凡例九「严禁假信息·考证优先」）。'
