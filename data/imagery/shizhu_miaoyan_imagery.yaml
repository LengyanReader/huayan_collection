  relevance_zh: 本文 5.2 组末为**妙色那罗延执金刚神**（*vajradhara*，「执金刚杵之神」；卷一「复有佛世界微尘数执金刚神」居十九类神之首，卷四则殿末）。此件即**其所执之物**——五钴（金刚杵，*vajra*；日本称「五具杵」*kongōsho*）之实物：中央柄与五支钴相纽，中段作莲座状，两端各具杵形。Commons 述其源流曰：「形似《吠陀》所载诸神所持之武器，**金刚杵（kongōsho）**久用于**密教仪轨**」——故此图所呈者乃**金刚神所执之器物本身**，可与卷一「执金刚神」之名相对读。**边界**：①此为**日本密教（真言宗）法器**，其杵形与汉地、藏传之五钴杵**大体同类而细节有别**〔待核〕，不可径以日本式样为中国／印度式样；②本经之「执金刚神」**仅立名号**，卷四此组之颂**不述其所执之器形**，故此物**不可反推为经中之法器形制**〔待核〕；③Commons 著录年代作「900s」（九世纪），本文沿用而未独立断代〔待核〕。
  relevance_en: 'The last group of our §5.2 is **Vajra-bearers** (*vajradhara*; the nineteen classes of Book One open with "佛世界微塵數執金剛神"), and this object is **the thing they hold** — the five-pronged vajra (thunderbolt pestle, *kongōsho*): a central grip with five prongs joined at each end, a lotus-form middle. Commons describes its pedigree: "Resembling weapons wielded by deities described in the Vedas … the vajra pestle has long been used in **Esoteric Buddhist rituals**." Boundaries: (1) this is a **Japanese Shingon** implement; its prongs resemble but are not identical to Chinese and Tibetan five-pronged vajras [to be verified], and the Japanese form must not stand for the Chinese or Indian one; (2) our sutra names the vajra-bearers **only by name** — Book Four''s verses do not describe the form of what they hold — so **no implement-form may be inferred backwards from this object into the text** [to be verified]; (3) Commons gives the date as "900s"; this is adopted without independent dating [to be verified].'
  status: confirmed
  kind_label: 【象征·他国法器】
  caption_zh: 【象征·他国法器】五钴金刚杵（平安时代·日本·「五具杵」·藏克利夫兰美术馆）——置于此组，取其即**执金刚神所执之器物本身**：中央柄、两端五钴相纽、中段作莲座状，与卷一「复有佛世界微尘数**执金刚神**」之名相正对。**边界**：①此为**日本密教（真言宗）法器**，其杵形与汉地、藏传五钴杵**大体同类而细节有别**〔待核〕，不可径以日本式样为中国／印度式样；②本经于「执金刚神」**仅立名号**，卷四此组之颂**不述其所执之器形**，故**不可由此器反推经中之法器形制**〔待核〕；③Commons 著录年代作「900s」（九世纪），本文沿用而未独立断代〔待核〕。<br>
  caption_en: 'Five-pronged Vajra Pestle (*kongōsho*), Heian period, Japan (Cleveland Museum of Art) — placed in this section as **the very implement the vajra-bearers hold**: central grip, five prongs joined at each end, lotus-form middle, answering to Book One''s "復有佛世界微塵數執金剛神." Boundaries: (1) a **Japanese Shingon** implement whose prongs resemble but differ in detail from Chinese and Tibetan five-pronged vajras [to be verified]; the Japanese form must not stand for the Chinese or Indian one. (2) The sutra names the vajra-bearers **only**; Book Four''s verses do not describe the form of what they hold, so **no implement-form may be inferred backwards into the text** [to be verified]. (3) Commons dates it "900s"; adopted without independent dating [to be verified].'
- id: emei-ten-faced-puxian-stupa
  kind: B
  section: '6.1'
  figure_no: 6-1
  typology: 名相
  motif_zh: 普賢（十方普賢·騎六牙象）
  motif_en: Samantabhadra, ten-faced form on the elephant
  title_zh: 峨眉山十方普贤像（骑六牙白象）
  title_en: Ten-faced Samantabhadra (Puxian) on a six-tusked white elephant, Mount Emei
  era_zh: 〔待核：Commons 未著录造像年代；本文未独立断代〕
  location_zh: 四川峨眉山
  file: File:China - Mount Emei - EmeiShan - Sichuan 08.jpg
  thumb_url: https://upload.wikimedia.org/wikipedia/commons/d/de/China_-_Mount_Emei_-_EmeiShan_-_Sichuan_08.jpg
  source_page: https://commons.wikimedia.org/wiki/File:China_-_Mount_Emei_-_EmeiShan_-_Sichuan_08.jpg
  license_zh: 署名—相同方式共享 4.0（CC BY-SA 4.0）
  license_en: CC BY-SA 4.0
  license_url: https://creativecommons.org/licenses/by-sa/4.0
  author_zh: Vanvelthem Cédric（摄影，2010-07-20）
  date: '2010-07-20'
  relevance_zh: 本文卷五（6.1）**以普贤菩萨独作十偈之颂开卷**（「以自功德，復承如來威神之力」）。此件为**中国峨眉山之十方普贤像**——骑六牙白象、其身十面，故兼具**普贤（骑象）**与**十方（十面）**两重名相，与卷五「嚴淨一切佛國土……普詣一切如來所修具足功德境界」之门义可对读。**边界**：①此系**中国佛教（华严／峨眉信仰）中之普贤像**，属**同一佛名（普贤）之他像**，故为 B 类；②「十方普贤」之名与**密教金刚界曼荼罗**之配置有关（十面表十方／十智），**非本经所立**〔待核〕——本经卷五仅作「普賢菩薩」之名号，不言其十面；③Commons 著录作 "Samantabhadra riding an elephant" 与 "Ten-faced Puxian Stupa" 两类目，本文据其可见形态（十面、骑象）著录，**造像年代未回源**〔待核〕。
  relevance_en: 'Book Five (§6.1) **opens with Samantabhadra alone**, "by his own merit, and moreover sustained by the Tathāgata''s spiritual power." This is a **Chinese image of Samantabhadra from Mount Emei** — riding a six-tusked white elephant, ten-faced — thus bearing both names at once, *Samantabhadra* (on the elephant) and *Puxian, ten-faced* (in the ten directions), readable against the chapter''s gates "purify all Buddha-lands" and "reach every Tathāgata''s fully-accomplished realm of merit." Boundaries: (1) a **Chinese Buddhist image** (Huayan/Emei cult) of the **same Buddha-name** — hence class B; (2) the name "ten-faced Puxian" is tied to the **Vajradhātu maṇḍala** (ten faces for the ten directions / ten knowledges) and is **not established by this sutra** [to be verified] — Book Five gives only the name "Samantabhadra" and says nothing of ten faces; (3) Commons files it under "Samantabhadra riding an elephant" and "Ten-faced Puxian Stupa"; this entry follows what is visible (ten faces, on an elephant), and the age of the image is not re-sourced [to be verified].'
  status: confirmed
  kind_label: 【同佛名·普贤他像】
  caption_zh: 【同佛名·普贤他像】峨眉山十方普贤像（骑六牙白象·藏四川峨眉山）——置此卷五之首，取其与 6.1「**以自功德，復承如來威神之力**」之普贤正对：骑六牙白象为普贤之常相，身具十面则为「十方」，兼含**普贤**与**十方普贤**两重名相。**边界**：①此系**中国佛教（华严／峨眉信仰）中之普贤像**，为**同一佛名之他像**，故归 B 类；②「十方普贤」之名与**密教金刚界曼荼罗**之配置有关（十面对应十方／十智），**非本经所立**〔待核〕——卷五仅作「普賢菩薩」之名号，**不言其十面**；③Commons 归其于 "Samantabhadra riding an elephant" 与 "Ten-faced Puxian Stupa" 两类目，本文依可见形态著录，**造像年代未回源**〔待核〕。<br>
  caption_en: 'Ten-faced Samantabhadra (Puxian) riding a six-tusked white elephant, Mount Emei — placed at the head of Book Five to meet §6.1''s Samantabhadra, "by his own merit, and moreover sustained by the Tathāgata''s spiritual power": the elephant is his constant form, and the ten faces are the "ten directions," so the image bears both names. Boundaries: (1) a **Chinese Buddhist image** of the **same Buddha-name**, hence class B; (2) the title "ten-faced Puxian" is tied to the **Vajradhātu maṇḍala** (ten faces for ten directions/knowledges) and is **not established by this sutra** [to be verified] — Book Five names only "Samantabhadra" and says nothing of ten faces; (3) Commons files it under both "Samantabhadra riding an elephant" and "Ten-faced Puxian Stupa"; this entry follows what is visible, and the age of the image is not re-sourced [to be verified].'
