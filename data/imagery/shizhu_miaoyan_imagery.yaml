  relevance_zh: 对应本品「其菩提樹高顯殊特」之**菩提树**。取十九世纪玻璃干版， 非当代观光照片，所存为朝礼者登阶之实况。**边界声明有二，勿混**： ①此树为菩提伽耶本树之分株（阿育王时代移栽），**非释迦道成之处原树**； ②经文之树为「金剛為身、琉璃為幹、眾雜妙寶以為枝條……復以摩尼而為其果」之 **变现的宝树**，与此实生之树不同。两者之关系是「意象与实物」， 正如以木塔喻「宮殿樓閣」之喻，非等同。
  relevance_en: 'A nineteenth-century glass negative of worshippers ascending to the Sacred Bodhi Tree. Two boundaries must be stated: the Anuradhapura tree is a descendant cutting, not the original tree of enlightenment; and the tree of the text is a *manifest* jewel-tree of vajra body and jeweled branches, not a living tree. The relation is one of image to referent, exactly as a wooden pagoda is an image of the scripture''s palaces.'
  status: confirmed
  kind_label: 【实物·意象】
  caption_zh: 圣菩提树（斯里兰卡阿努拉德普勒）登阶，1875—1880 年玻璃干版摄影（阿姆斯特丹国立博物馆藏，CC0）——对应「其菩提樹高顯殊特」；取十九世纪干版而非当代观光照。**边界有二，勿混**：①此树为菩提伽耶本树之分株，**非释迦道成之原树**；②经文之树为「金剛為身，琉璃為幹……復以摩尼而為其果」之**变现宝树**，与此实生之树不同——两者之关系是「意象与实物」，正如以木塔喻「宮殿樓閣」。
  caption_en: 'A nineteenth-century glass negative of worshippers ascending to the Sacred Bodhi Tree. Two boundaries must be stated: the Anuradhapura tree is a descendant cutting, not the original tree of enlightenment; and the tree of the text is a *manifest* jewel-tree of vajra body and jeweled branches, not a living tree. The relation is one of image to referent — exactly as a wooden pagoda is an image of the scripture''s palaces.'
