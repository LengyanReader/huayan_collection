  relevance_zh: 本批**带明确榜题**之毗卢遮那／卢舍那像：题作「清净法身卢那舍佛」，可与本文 2.7 之结论参看——本经卷十六「見佛」语境中之卢舍那指**法身**，而非后世三身判摄所配之「释迦成道后之报身」。**边界**：此像**非为本经而作**（窟室营造早于本经题名之定型，非经变、非本经专像），故只作**同题域之题名参证**，不作本经之图像化。榜题全文与纪年未逐字回源〔待核〕。
  relevance_en: 'The only Vairocana/Rocana image in this batch carrying a legible title, "Pure Dharmakāya Rocana Buddha," to be read alongside the finding in §2.7 that the Rocana of ch. 16 denotes the dharmakāya. Boundary: the image was **not made for this scripture** — the cave predates the fixing of the text''s title, and it is neither a jataka tableau nor an illustration of the chapter. It is title-parallell evidence for the same Buddha-name, nothing more. The full inscription and its date have not been collated word for word [to be verified].'
  status: confirmed
  kind_label: 【同题域·同佛名】
