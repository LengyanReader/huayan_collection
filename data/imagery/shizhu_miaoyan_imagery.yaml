  author_zh: Huangdan2060（摄影，2017-10-05）
  date: '2017-10-05'
  relevance_zh: 与图 6-1 配对，为**普贤「骑象」之中国通行的另一种造型**：结跏趺坐于莲台、象身在其下，形象端严近于汉地庙塑，可与图 6-1 之十面造型对读——**同一佛名在中国之两种样式**（藏／印系之十方普贤 vs 汉系之骑象普贤），恰可与本经卷五「十一位冠普」之**同名异相**问题对读。**边界**：①此为**近现代庙塑**〔待核：Commons 仅著录摄影作 2017，造像年代未载〕；②密印寺与本经**无依据之关系**〔待核〕，故只作**同一佛名之造型对照**；③Commons 著录仅题「Samantabhadra bodhisattva at the Hall of Samantabhadra, in Miyin Temple」，**未著录造像年代、作者与开龛年月**，本文不据以推定〔待核〕。
  relevance_en: 'Paired with Fig. 6-1 as a second rendering of the "**Samantabhadra on the elephant**" in modern Chinese practice: seated in full lotus on a lotus-throne with the elephant beneath, a restrained Chinese temple image, which reads against 6-1''s ten-faced form as **one Buddha-name, two styles** — the point at which our Book Five''s "eleven bearing the name Samanta-" becomes visible as a question of form as well as of name. Boundaries: (1) a **modern temple image** (photographed 2017) [to be verified: the age of the image is not recorded], a recent Chinese casting rather than an antique; (2) Miyin Temple has **no documented relation** to this sutra [to be verified], so the image serves only as a **formal comparison of one Buddha-name**; (3) Commons records only "Samantabhadra bodhisattva at the Hall of Samantabhadra, in Miyin Temple," **without date, maker, or founding record**, and nothing is inferred from its silence [to be verified].'
  status: confirmed
  kind_label: 【同佛名·普贤他像】
  caption_zh: 【同佛名·普贤他像】普贤菩萨像（骑六牙象·藏长沙密印寺普贤殿）——与图 6-1 配对，为普贤「骑象」之**中国另一种造型**：结跏趺坐于莲台、象在其下，形象近汉地庙塑，与 6-1 之十面造型对读，即**同一佛名之两种样式**，可供体会卷五「十一位冠普」之同名异相。**边界**：①此为**近现代庙塑**〔待核：Commons 仅著录摄影作 2017〕；②密印寺与本经**无依据之关系**〔待核〕，只作**同一佛名之造型对照**；③Commons 未著录其造像年代、作者与开龛年月，本文不据其阙文推定〔待核〕。<br>
  caption_en: 'Samantabhadra riding an elephant, Hall of Samantabhadra, Miyin Temple, Changsha — paired with Fig. 6-1 as the other Chinese rendering of "**Samantabhadra on the elephant**": full lotus on a lotus-throne, elephant beneath, a restrained local temple style. Read against 6-1''s ten-faced form it shows **one Buddha-name, two styles**, which is how Book Five''s "eleven bearing the name Samanta-" becomes a question of form as well as of name. Boundaries: (1) a **modern temple image** [to be verified: Commons records only the 2017 photograph]; (2) Miyin Temple has **no documented relation** to this sutra [to be verified], the image serving only as a **formal comparison of one Buddha-name**; (3) Commons does not record its age, maker, or founding, and nothing is inferred from that silence [to be verified].'
