  relevance_zh: 对应「毘盧遮那為法界主」与「上首二十名（十一位冠普）」之**题域**：菩萨非人名而「法名」，以所证为体；背壁八十一尊圆龛小佛，可与「彼須彌山微塵數菩薩圍繞」之相参看。**边界**：此系**华严教（华严三圣判摄）之造像**，其图像依据在澄观一系之判教，**非本经之专像**、非本品之会众图；三尊高度与龛位编号未回源，故本文不举具体数字〔待核〕。
  relevance_en: 'Relevant to the theme "Vairocana as lord of the dharmadhātu" and of "the twenty chief ones, eleven Samanta-…": a bodhisattva''s name here is a dharma-name, constituted by what is realised; the eighty-one small niches behind answer "the bodhisattvas surrounding him in number as the dust motes of Mount Sumeru." Boundary: this is a **Huayan-doctrine** composition (the triad as judged by Chengguan''s school), **not made for this scripture** and not a rendering of this chapter''s assembly; the figures'' heights and niche numbers were not collated, so no measurements are given [to be verified].'
