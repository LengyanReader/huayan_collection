  relevance_zh: 「樓閣」之**实物遗存**：我国现存最早之木构楼阁之一（另一说为最早）， 与经文「廣博嚴麗」之想象相比，其面阔三间、深五间、置十六足观音， 实为「一阁之中而层层」之可验之例。**边界声明**：此非本经之殿， 亦非华严寺院，仅为「楼阁」这一建筑类型之现存样本。
  relevance_en: 'Surviving fabric for "broad and stately pavilions": among the earliest surviving timber pavilions in China. Boundary: not a hall of this scripture nor a Huayan monastery — a surviving specimen of the architectural type only.'
