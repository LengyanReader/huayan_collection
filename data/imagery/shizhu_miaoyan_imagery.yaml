article: shizhu-miaoyan
title_zh: 世主妙严品·会众意象图像登记册
title_en: Imagery register for the Chapter on the Majestic Adornment of the World-Lord
purpose: 本文件为《华严经细读·第一部》正文插图的**唯一权威著录源**。凡正文引用之图像， 须在此登记：所应之经句、图像本身之名称／时代／现址／作者、**授权类型与授权链接**、 以及「图像与经文之关系边界」（凡图像与经文并非同一事物者，必须如实标注，不得混同）。
license_policy: 一律取自 Wikimedia Commons 之可核验授权文件，并按 Commons 结构化元数据（extmetadata：LicenseShortName／LicenseUrl／Artist／DateTimeOriginal／ObjectName）逐条核验。优先级：① Public domain／CC0（无署名义务，最优先）；② CC BY 4.0（须署名）；③ CC BY-SA 4.0（须署名并保持同授权）。一律不用来源不明、无授权著录，或授权为「非商业」「仅研究」者。**署名义务**：凡 CC BY／CC BY-SA 必填 author_zh；无著录作者者如实标〔待核〕摄影者，**不得留白、不得臆造**。
verification_note: 全量核验于 2026-10-02 完成：26 项 thumb_url 与 source_page 逐条 HTTP HEAD 实测，全库 **26/26 均为 HTTP 200**。本轮新增 13 件（图 4-1～4-10、5-1、6-1～6-2）另经 Commons 结构化元数据（extmetadata）逐条回源核对题名、作者、授权与年代，凡元数据未载者一律在 era_zh 内标〔待核〕而不填补：其中夜叉头部、迦楼罗头部（Commons 未著录年代）、五钴金刚杵（著录作「900s」）、峨眉十方普贤（未著录造像年代）、密印寺普贤（未著录造像年代）五件之年代待考，凡此五件皆以「Commons 未载／未回源」如实标注。缩略图 URL 一律去查询参数并由 thumb.wikimedia.org 归一为 upload.wikimedia.org；峨眉十方普贤一项因 960px 派生档不适用而采用 Commons 原始档（720×540，经 HEAD 核验 200）。另：榆林窟第25窟八大菩萨曼荼罗一项经 Commons extmetadata 与 Category:Womb Realm Vairocana 类目正文双重核验（该类目展开即「胎藏界大日如来」），据以判定其为密教胎藏界体系而非本经之华藏体系。
boundary_principle: '本品（T279《世主妙严品》）之图像**皆无同时代「依本经」之专像**，故三类须严格区分，不得混为一谈：

  (A) **依本经之造像／壁画**——专为《世主妙严品》而作者。**本批 0 件**（见 scope_note）。

  (B) **同佛名／同题域之他像**——非本经之变，然同属华严／毗卢遮那／文殊等题域，或于他处为**同一佛名**所作之像，可作图像学对读，但**其教义归属与造像系统不可与本品相混**。本批 **9 件**：榆林窟第25窟毗卢遮那、飞来峰第5龛（卢舍那佛会）、龙门奉先寺卢舍那大佛龛、大足宝顶山华严三圣（以上四件属华严／毗卢遮那题域）、莫高窟第172窟《观无量寿经变》之楼阁（净土经变）、莫高窟第61窟五台山图（文殊／五台信仰）、榆林窟第25窟八大菩萨曼荼罗（同窟会众）、峨眉山十方普贤与长沙密印寺普贤（同一佛名「普贤」之他像）。

  (C) **他经图像·实物·类型或制度参照**——「意象之实物」（菩提树、佛殿、须弥座、摩尼宝珠、佛殿遗址）、**他经造像或壁画**（阿旃陀、占城、犍陀罗、真觉寺等）、**类型样本**（泰国素可泰之夜叉与迦楼罗头部）、**制度或器物参照**（日本密教五钴金刚杵）或后世 rendition（1921 年须弥山宇宙图），属意象之参照或**反面对照**，非经文之图像化。本批 **17 件**。

  每一登记项以 kind 字段标明其属 A／B／C；**B／C 类之正文图注必须含「边界」二字**（由 scripts/verify_imagery.py 强制校验），明示其不可等同之处。

  **判准**：是否**为本经而作**（A），抑或仅**同题域**（B）／**意象之实物或后世**（C）——宁可归 B、C 而不冒称 A（凡例九「严禁假信息·考证优先」）。'
typology_definitions:
  内容: 经文所述之**事物·场景·场所**之可见实物或图像样本——道场、菩提树、楼阁、佛殿、寺院建筑等「读经时可指认之物」。所配之图为该事物之他处实例，故可作「经文之物如何见于实物」之参看。
  名相: 经文**名号本身**之形象样本——某佛、某菩萨、某神王、某类众生（乾闼婆、夜叉、迦楼罗、普贤等）之造像、壁画或塑像头部。所配之图为该名号之造型谱系之一端，用于「名相之形象传统」，不作经中之会众图。
  行动: 经文所述诸众之**作为·事仪**之图像样本——供养、护佛、舞赞、降伏、说法、仪轨所持等。适用于经文以「事」而非以「物」为主之条目（如执金刚神之于金刚杵、迦楼罗之于降龙）。
  象征: 经文之**抽象义理·宇宙结构**之他物象化——摩尼宝珠、须弥座、须弥山宇宙图、法器等。所配之图不指经中具体一物，而示该义理在另一系统中之惯用图式，故须另加制度或系统之说明。
