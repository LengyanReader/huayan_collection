  relevance_zh: 对应本品「摩尼為幢常放光明」「摩尼寶王變現自在」之**摩尼**。 摩尼（cintāmaṇi）者，随意变现、如意珠也；此器以火焰形金铜包覆宝珠， 正见「以火承宝」之形制。**边界声明**：此系东密系统之舍利容器， 非本品之「摩尼」；用以说明「摩尼」在佛教美术中之实象，不作等同。
  relevance_en: 'Material counterpart to the maṇi of "the jewel-banner ever shedding light" and "the jewel-king manifest at will." Note the boundary: this is an esoteric Buddhist reliquary of the Japanese tradition, not the Huayan maṇi; it illustrates what a maṇi looks like as a Buddhist object, nothing more.'
