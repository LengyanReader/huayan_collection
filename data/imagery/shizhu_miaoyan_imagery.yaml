  title_zh: 洛阳龙门石窟奉先寺·卢舍那大佛龛（唐上元二年 675）
  title_en: Colossal Vairocana Buddha, Fengxian Temple, Longmen Grottoes (Tang, 675)
  era_zh: 唐上元二年（675）
  location_zh: 河南洛阳龙门石窟
  file: File:Ancient Buddhist Grottoes at Longmen- Fengxian Temple Grand Buddha Niche with Colossal Statue of Vairocana Buddha.jpg
  thumb_url: https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/Ancient_Buddhist_Grottoes_at_Longmen-_Fengxian_Temple_Grand_Buddha_Niche_with_Colossal_Statue_of_Vairocana_Buddha.jpg/960px-Ancient_Buddhist_Grottoes_at_Longmen-_Fengxian_Temple_Grand_Buddha_Niche_with_Colossal_Statue_of_Vairocana_Buddha.jpg
  source_page: https://commons.wikimedia.org/wiki/File:Ancient_Buddhist_Grottoes_at_Longmen-_Fengxian_Temple_Grand_Buddha_Niche_with_Colossal_Statue_of_Vairocana_Buddha.jpg
  license_zh: CC0 1.0
  license_en: CC0 1.0
  license_url: http://creativecommons.org/publicdomain/zero/1.0/deed.en
  author_zh: Gary Todd
  date: '2011-06-11'
  relevance_zh: 与 2.7 考辨相接：奉先寺本尊作**卢舍那**（梵 *Rocana*），而非一般作「毗卢遮那」；其造像题记作「奉先寺大卢舍那象」〔待核：题记全称〕。此像为汉传「卢舍那即报身」之说之实践化代表，可与榆林窟第25窟「清净法身卢那舍佛」榜题并观：同一佛名之**两种判摄**，正显本经文本与后世注疏、与造像实践三者之层次。**边界**：此造于唐上元二年（675），**远早于本经汉译**，故**非本经之专像**，只作**后世造像实践**之参证；**存疑**：谓其面相据武则天者，自唐以来即有争议，今学界多不主此说〔存疑待考〕。
  relevance_en: 'Pairs with the textual analysis of §2.7: the Fengxian niche names its central image *Rocana* (卢舍那), not Vairocana — the very distinction at issue; its dedicatory inscription is cited as "the great Luṣṇā image of Fengxian Temple" [to be verified]. The image embodies the Chinese reading "Rocana = the rūpādāya-buddha." Set against the Yulin Cave 25 title "Pure Dharmakāya Rocana Buddha," the two show two different judgements on one Buddha-name, displaying the layers of text, commentary and sculptural practice. Boundary: cut in 675, **more than four centuries before the Chinese translation**, hence **not made for this scripture** — admissible as evidence of later sculptural practice only. Unresolved: the old claim that the features were modelled on Empress Wu Zetian is contested [to be verified].'
  status: confirmed
  kind_label: 【同题域·同佛名】
  caption_zh: 洛阳龙门石窟奉先寺·卢舍那大佛龛（唐上元二年 675）——与 2.7 考辨相接：奉先寺本尊作**卢舍那**（*Rocana*），而非一般作「毗卢遮那」；与榆林窟第25窟「清净法身卢那舍佛」榜题并观，可见**同一佛名之两种判摄**——经文本义与后世造像实践之层次。**边界**：此造于唐上元二年（675），远早于本经汉译，**非本经之专像**，只作后世造像实践之参证。**存疑**：谓其面相据武则天者，自唐以来即有争议，今学界多不主此说〔存疑待考〕。
  caption_en: 'Pairs with the textual analysis of §2.7: the Fengxian niche names its central image *Rocana*, not Vairocana — the very distinction at issue. Set against the Yulin Cave 25 inscription "Pure Dharmakāya Rocana Buddha," the two images show two different judgements on one Buddha-name: the text''s own sense, and later sculptural practice. Boundary: cut in 675, more than four centuries before the Chinese translation, hence **not made for this scripture** — admissible as evidence of later sculptural practice only. Unresolved: the old claim that the features were modelled on Empress Wu Zetian is contested.'
