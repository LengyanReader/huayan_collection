  author_zh: Wshzhcn
  date: '2024-08-26'
  relevance_zh: 本尊卢舍那居中说法，文殊骑狮、普贤骑象，四菩萨、四天王及龛外二飞天环侍，共十七身；龛内题记含「说法状／智拳印」两说〔存疑待考〕。可用以见北宋时卢舍那佛会（三圣＋侍众）之**通行组合**。**边界**：此系北宋卢舍那佛会之龛造，**非本经之专像**、非本品的会众图，亦与本经开卷之「道场·佛身·会众」无经文依据之对应关系——两者之相似属**图像传统之相近**，不可据此谓本品之图即此〔存疑待考〕。
  relevance_en: 'Rocana at the centre preaching, Manjusri on a lion and Samantabhadra on an elephant, four bodhisattvas, four heavenly kings and two flying celestials — seventeen figures; the niche inscription carries two unresolved readings of the hand gesture [to be verified]. Useful as evidence of the *conventional* Northern-Song Rocana-assembly triad. Boundary: a Northern-Song niche, **not an image made for this scripture** and not a rendering of this chapter''s assembly; its resemblance to the chapter''s threefold opening is a similarity of iconographic tradition, not a correspondence the text licenses.'
  status: confirmed
  kind_label: 【同题域·同佛名】
