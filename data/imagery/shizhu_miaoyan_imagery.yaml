  title_en: Mandala of the Eight Great Bodhisattvas, Cave 25, Yulin Caves (present state)
  era_zh: 8世纪末·吐蕃统治期〔待核：Commons 著录窟内八大菩萨曼荼罗作「约776–781」，窟内各龛断代学界不一，本文不擅断〕
  location_zh: 甘肃榆林窟第25窟
