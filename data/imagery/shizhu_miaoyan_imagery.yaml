  date: ''
  relevance_zh: 与图 4-1 配对，为其**载体之全景**：莲华色（*Padmapani*，即观世音之另一名相）立像之两侧侍以奏乐之半歌神，可看出「**香音众侍于大圣之前**」这一供养图式之整体布局——此即本经诸天王「各于其处……普觀一切……眾已，即說頌言」之**供养场域**在造像传统中之一个实例。**边界**：①此为阿旃陀第1窟之供养造像，属**他经（莲花色／观世音系统）**之壁面，**非本经之图**；②「观世音」非本经此组之领众，此图于本文**只作供养场域之背景**，不作名相之对勘〔待核〕；③Commons 著录之断代「450—490」系书籍著录之沿用，本文未独立回源〔待核〕。
  relevance_en: 'The full panel of which Fig. 4-1 is a detail: the bodhisattva *Padmapani* (i.e. Avalakiteshvara under another name) flanked by musician-kinnaras, showing the whole schema of **musical attendance upon a great being** — the setting in which our sutra''s heavenly kings each survey their assembly and then chant. Boundaries: (1) this is an offering image in a **different scripture''s programme** (the Padmapani/Avalakiteshvara complex), **not an image of our text**; (2) Avalakiteshvara is not the chief of this group, so the image serves only as the background of the offering-scene, never as evidence for a name [to be verified]; (3) the dating follows the book record on Commons and has not been independently re-sourced [to be verified].'
  status: confirmed
  kind_label: 【内容·他窟供养场景】
  caption_zh: 【内容·他窟供养场景】阿旃陀石窟第1窟·莲华色（Padmapani）菩萨造像（公元450—490，颜料敷岩，高约1.2米）——与图 4-1 配对，为其载体之全景：立像两侧侍以奏乐之半歌神，可看出「**香音众侍于大圣之前**」之供养场域整体布局，亦即本经诸天王「各于其处……普觀一切眾已，即說頌言」之**场域**在造像传统之一实例。**边界**：①此属**他经（莲花色／观世音系统）**之壁面，**非本经之图**；②观世音非本组之领众，故**只作供养场域之背景**，不作名相对勘〔待核〕；③Commons 之断代「450—490」系书籍著录沿用，本文未独立回源〔待核〕。<br>
  caption_en: 'Bodhisattva Padmapani, Cave 1, Ajanta (ca. 450–490 CE, pigment on rock, c. 1.2 m) — the full panel of which Fig. 4-1 is a detail: musician-kinnaras flank the standing figure, showing the whole schema of **musical attendance upon a great being**, and with it the setting in which our sutra''s heavenly kings survey their assemblies before chanting. Boundaries: (1) a wall painting of a **different programme** (Padmapani/Avalakiteshvara), **not an image of our scripture**; (2) Avalakiteshvara is not the chief of this group, so the image serves only as offering-scene background, not as evidence for any name [to be verified]; (3) the dating follows the book record on Commons and has not been independently re-sourced [to be verified].'
- id: amaravati-yaksha-fiery-pillar
  kind: C
  section: '4.6'
  figure_no: 4-3
  typology: 名相
  motif_zh: 夜叉（yakṣa）
  motif_en: Yakṣa
  title_zh: 「以火柱为佛」之礼拜（夜叉舞赞火柱，阿摩罗伐蒂栏板浮雕残片）
  title_en: Veneration of the Buddha as a Fiery Pillar — yakshas praising the pillar (Amaravati coping-stone)
  era_zh: 公元175年〔Commons／馆藏著录 DateTimeOriginal = 175〕
  location_zh: 印度安得拉邦阿摩罗伐蒂（Amaravati）大乘佛教遗址·栏板浮雕；现藏克利夫兰美术馆，藏品号 1943.72
  file: File:Clevelandart 1943.72.jpg
  thumb_url: https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Clevelandart_1943.72.jpg/960px-Clevelandart_1943.72.jpg
  source_page: https://commons.wikimedia.org/wiki/File:Clevelandart_1943.72.jpg
  license_zh: CC0 1.0（公有领域贡献）
  license_en: CC0 1.0
  license_url: http://creativecommons.org/publicdomain/zero/1.0/deed.en
  author_zh: 克利夫兰美术馆（The Cleveland Museum of Art），藏品号 1943.72；Commons 著录无机器可读之作者
  date: '175'
  relevance_zh: 夜叉（*yakṣa*）为本文 4.6 组之领众（毘沙门夜叉王、多聞大夜叉王）。此件系阿摩罗伐蒂栏板浮雕残片，Commons／馆藏著录作「*Veneration of the Buddha as a Fiery Pillar*」，描述作「一群天界众生或自然神祇（**yakshas**）舞赞火柱，火柱代佛而在」——是**夜叉形象与夜叉事仪**在印度大乘造像传统中之一确证实例，可与本组「眾生罪惡深可怖……為救是等佛興世」之门义对读。**边界**：①此浮雕表现的是**火柱礼拜**之题材，非本经夜叉组之会众，亦非「夜叉王」之标准像；②Commons 将天众笼统著录为 "yakshas"，而该词在印度教语境中亦可为半兽形神祇类名，与本经「夜叉（此云能夺／捷疾）」之义不尽相同〔待核〕；③本浮雕之原始出土位置与所属栏板编号，本文未回源〔待核〕。
  relevance_en: 'The yakṣas head the group of §4.6. This fragment of an Amaravati coping-stone is catalogued as *Veneration of the Buddha as a Fiery Pillar*; the description reads "lively, attenuated figures of celestial beings or nature divinities (**yakshas**) dance and praise the fiery pillar, which stands in for the presence of the Buddha" — a documented instance of yakṣa form and yakṣa office in the Indian Mahayana image tradition, readable against this group''s "眾生罪惡深可怖……為救是等佛興世." Boundaries: (1) the relief depicts the **veneration of a fiery pillar**, not our text''s yakṣha assembly, nor a canonical image of a yakṣa king; (2) Commons generically labels the figures "yakshas," a term that in Indian usage may also denote half-bestial divine classes and does not exactly match the sutra''s gloss "able to seize / swift" [to be verified]; (3) the original find-spot and slab number have not been re-sourced [to be verified].'
  status: confirmed
  kind_label: 【名相·他国造像】
  caption_zh: 【名相·他国造像】「以火柱为佛」之礼拜——夜叉舞赞火柱（阿摩罗伐蒂栏板浮雕残片，公元175，藏克利夫兰美术馆）——取其**夜叉形象与夜叉事仪**在印度大乘造像传统之一确证：Commons／馆藏著录作 *Veneration of the Buddha as a Fiery Pillar*，「一群天界众生或自然神祇（yakshas）舞赞火柱，火柱代佛而在」，可与本组「眾生罪惡深可怖……為救是等佛興世」对读。**边界**：①此系**火柱礼拜**题材，**非本经夜叉组之会众**，亦非「夜叉王」之标准像；②Commons 泛著录为 "yakshas"，该词于印度教语境亦可为半兽形神祇类名，与本经「能夺／捷疾」之义不尽相同〔待核〕；③浮雕出土位置与栏板编号未回源〔待核〕。<br>
  caption_en: 'Veneration of the Buddha as a Fiery Pillar — yakṣas praising the pillar (Amaravati coping-stone, 175 CE, Cleveland Museum of Art) — admitted as documented evidence of **yakṣa form and yakṣa office** in the Indian Mahayana image tradition: Commons and the museum catalogue the piece as *Veneration of the Buddha as a Fiery Pillar*, its description reading "lively, attenuated figures of celestial beings or nature divinities (yakshas) dance and praise the fiery pillar, which stands in for the presence of the Buddha." Boundaries: (1) a **fiery-pillar veneration** subject, **not our yakṣa assembly**, and not a canonical image of a yakṣa king; (2) Commons generically labels them "yakshas," which in Indian usage may denote half-bestial divine classes and does not exactly match the sutra''s gloss "able to seize / swift" [to be verified]; (3) find-spot and slab number not re-sourced [to be verified].'
