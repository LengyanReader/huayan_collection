  source_page: https://commons.wikimedia.org/wiki/File:Head_of_Yaksa,_Ramkhamhaeng_Museum,_Sukhothai_(46924292024).jpg
  license_zh: 公有领域（Flickr 公有领域标记 PD-author-FlickrPDM）
  license_en: Public domain
  license_url: ''
  author_zh: Gary Todd（摄影，2019-04-20）
  date: '2019-04-20'
  relevance_zh: 夜叉为本文 4.6 组之领众。此件为素可泰（泰国）之**夜叉头部造像**，可见**獠牙外突、眉弓深陷、狮象相揉合**之造型特征——即东南亚佛教艺术中夜叉（*yakṣa*，亦作 *yaksha*）之标准面貌，可与卷一杂类神众之「主夜神」形象传统对看。**边界**：①此为**上座部／泰国**造像之头部，与本经（北传大乘）之夜叉**无任何宗派或谱系关联**；②Commons 著录**未载年代与出土位置**，本文之时代系依馆藏与风格暂系〔待核〕；③素可泰之夜叉（*yaksha*，常作蹲踞之镇宅灵）之职能为**护寺镇魔**，与本经夜叉「得以無邊方便救護惡眾生」之教义方向**恰相反**（护恶众生 vs 驱恶灵），此一差异**尤须标明**，不得以「皆为夜叉」混同之。
  relevance_en: 'Yakṣas head the group of §4.6. This is a **yakṣa head** from Sukhothai, Thailand, showing the standard South-East Asian yakṣa face — protruding fangs, deep-set brows, a fusion of leonine and elephantine traits — which may be compared with the iconographic tradition of the "night deities" among the miscellaneous gods of Book One. Boundaries: (1) a **Theravāda/Thai** image head with no denominational or genealogical connection whatever to the yakṣas of our Northern transmission; (2) Commons records **neither date nor find-spot**, and the period assigned here follows museum context and style alone [to be verified]; (3) the Sukhothai *yaksha* guards a monastery and repels demons — the **opposite orientation** to our sutra''s yakṣas, whose gate is "unlimited skillful means for protecting evil-doing beings." That difference must be stated: "both are yakṣas" is not a bridge.'
  status: confirmed
  kind_label: 【名相·他国造像】
  caption_zh: 【名相·他国造像】夜叉头部造像（泰国素可泰·兰甘亨博物馆）——取其为**东南亚夜叉（yaksha）之标准面貌**之样本：獠牙外突、眉弓深陷、狮象相揉合，可与卷一杂类神众「主夜神」之形象传统对看。**边界**：①此为**上座部／泰国**造像头部，与本经（北传大乘）之夜叉**无宗派或谱系关联**；②Commons **未载年代与出土位置**，本文之时代系依馆藏与风格暂系〔待核〕；③素可泰之 *yaksha* 职能为**护寺镇魔**（蹲踞之镇宅灵），与本经夜叉「得以無邊方便救護惡眾生」之方向**恰相反**（护恶众生 vs 驱恶灵），此差异**尤须标明**，不得以「皆为夜叉」混同之。<br>
  caption_en: 'Head of a Yakṣa (Ramkhamhaeng Museum, Sukhothai, Thailand) — admitted as a sample of the **standard South-East Asian yakṣa face**: protruding fangs, deep-set brows, leonine features fused with elephantine, comparable with the iconographic tradition of the "night deities" among Book One''s miscellaneous gods. Boundaries: (1) a **Theravāda/Thai** head with no denominational or genealogical link to the yakṣas of our Northern transmission; (2) Commons records **neither date nor find-spot**, the period here following museum context and style alone [to be verified]; (3) the Sukhothai *yaksha* guards monasteries and repels demons — the **opposite orientation** to our yakṣas, whose gate is "unlimited skillful means for protecting evil-doing beings." This difference must be stated rather than glossed.'
