  relevance_zh: 对应本品「智正覺世間」之「智」：文殊之淨土在**清涼五臺山**， 此窟因文殊而名「文殊堂」。此图为**现存最早之中国地图之一**， 以山川方位画「文殊所居」之世界，示「智」亦有**所主之境**， 与「名號即所主」之通例相合。**边界声明**：此属文殊／五台信仰之图像， 非华严经变，亦非本品之图。
  relevance_en: 'For "the world of right knowledge and enlightenment": Manjusri''s pure land is Mount Wutai, and Cave 61 takes its name from him. Among the earliest surviving Chinese maps, it shows that "wisdom" too has a place and a presiding deity — consonant with the chapter''s rule that a name mirrors its domain. Boundary: a Wutai/Manjusri image, not a Huayan tableau.'
  status: confirmed
