  source_page: https://commons.wikimedia.org/wiki/File:Kinnara_with_kachchapa_veena,_part_of_Padmapani_Bodhisattva-Ajanta_Caves-Aurangabad-Maharashtra.jpg
  license_zh: 署名—相同方式共享 4.0（CC BY-SA 4.0）
  license_en: CC BY-SA 4.0
  license_url: https://creativecommons.org/licenses/by-sa/4.0
  author_zh: 〔待核〕佚名（Commons 著录 "Unknown artist from the 5th century C.E."，上传者 User:Abhideo21；系自 Commons 既有阿旃陀照片裁切）
  date: ''
  relevance_zh: 乾闼婆（*gandharva*，此云「香音」）为帝释之乐神，本文 4.3 组首「持国乾闼婆王」即其王。此图取阿旃陀第1窟莲华色（*Padmapani*）菩萨造像之陪饰，作**持筌篪（kacchapa-vīṇā）之半歌神**——*kinnara*（紧那罗／乾闼婆之同类，「人首鸟身」）为印度—中亚音乐与供养图式中之固定角色，与「香音神」之名相扣合。**边界**：①此为阿旃陀（约5世纪）之壁面彩绘，**非本经之图**，年代亦远早于本经之定型；②「乾闼婆」与「紧那罗」在经中分列两族（见 4.3 与 4.8），而 *kinnara* 一名于汉译经文中**不固定对应其中之一**〔待核〕，故此图只作**名相之造型谱系**参证，不得据以判别本文 4.3／4.8 两组之名分；③Commons 著录此为裁切自他图（cropped），非独立拍摄。
  relevance_en: 'The dryatravas (*gandharvas*, "fragrant-scented") are the celestial musicians of Indra, and the head of the first group in §4.3 is their king. This detail from the *Padmapani* bodhisattva panel at Ajanta Cave 1 shows a **kinnara with a kachchapa-vīṇā** — the kinnara ("part man, part bird") is a fixed role in the Indic-Central Asian music-and-offering repertoire, and answers to the "fragrant-scented" name. Boundaries: (1) this is a **cave painting of the Ajanta complex (ca. 5th c.)**, **not an image of this scripture**, far earlier than the fixing of our text; (2) the Chinese *qiántuópó* and *jǐnnàluó* are listed as **two separate classes** in the sutra (§§4.3, 4.8), while Sanskrit *kinnara* maps to neither consistently [to be verified] — so this serves only as iconographic evidence for the name, never as a verdict on the two groups; (3) Commons records it as cropped from another file, not an independent exposure.'
  status: confirmed
  kind_label: 【名相·他窟壁画】
  caption_zh: 【名相·他窟壁画】阿旃陀石窟第1窟·莲华色（Padmapani）菩萨壁中之持筌篪之乾闼婆（kinnara，局部，公元450—490）——置于此组，取其为**「香音神」之造型谱系之一端**：*kinnara*（人首鸟身之半歌神）持 kacchapa-vīṇā 作供养奏乐，与本组「帝释之乐神，其王持国领之」之名相扣。**边界**：①此系阿旃陀壁面，**非本经之图**，年代远早于本经定型；②经中「乾闼婆」与「紧那罗」**分列两族**（4.3、4.8 各为一组），而 *kinnara* 一名于汉译经中不固定对应其一〔待核〕，故**不得据以判别两组之名分**，只作名相参证；③Commons 著录系裁切他图。<br>
  caption_en: 'Kinnara with a kachchapa-vīṇā, detail from the *Padmapani* panel, Ajanta Cave 1 (ca. 450–490 CE) — placed here as **one end of the iconographic repertoire of the "fragrant-scented" name**: the kinnara, part man and part bird, plays in attendance, answering to §4.3 "the celestial musicians of Indra, whose king is Dhṛtarāṣṭra." Boundaries: (1) an Ajanta wall painting, **not an image of this scripture**, far earlier than our text; (2) the sutra lists the gandharvas and the kinnaras as **two separate classes** (§§4.3 and 4.8), and Sanskrit *kinnara* corresponds to neither with any consistency [to be verified] — so this cannot be used to decide the identity of either group; (3) Commons records the file as cropped from another.'
