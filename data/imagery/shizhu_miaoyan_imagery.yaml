  date: 唐
  relevance_zh: 本品「如來所處宮殿樓閣，廣博嚴麗充遍十方」之**最接近同时代图像**： 唐代中期西域式楼阁（梵 *acaladeśa*「钩楼阁」）之形制、层叠、栏楯， 与经文「眾色摩尼之所集成……從宮出生流彌寶網」可对读。 **边界声明**：此为《观无量寿经》之净土经变，**非华严经变**； 取其作为「唐代西域楼阁」之图像依据，其教义归属不可混同。
  relevance_en: 'The closest contemporary image for "the palaces and pavilions where the Tathagata abides, broad and stately, filling the ten directions": Tang-dynasty Central Asian-style acaladeśa pavilions. Boundary: this is a Sukhāvatī tableau from the Contemplation Sutra, not a Huayan tableau; it serves as an image of Tang palace architecture only.'
  status: confirmed
  kind_label: 【同题域·他经】
  caption_zh: 敦煌莫高窟第172窟·观无量寿经变（唐）中之楼阁——对应「如來所處宮殿樓閣，廣博嚴麗充遍十方」之**最接近同时代图像**：唐中期西域式楼阁（*acaladeśa*「钩楼阁」）之层叠、栏楯，可与「眾色摩尼之所集成……從宮出生流彌寶網」对读。**边界**：此为《观无量寿经》之净土经变，**非华严经变**，仅取为唐代西域楼阁之图像依据，其教义归属不可混同。
  caption_en: 'The closest contemporary image for "the palaces and pavilions where the Tathagata abides, broad and stately, filling the ten directions": Tang-dynasty Central Asian-style acaladeśa pavilions, whose tiered railings answer the text''s "assembled from manifold jewels… jeweled nets issuing from the palaces." Boundary: a Sukhāvatī tableau from the Contemplation Sutra, not a Huayan tableau — an image of Tang palace architecture only.'
