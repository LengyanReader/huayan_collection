  relevance_zh: 本文 4.5 组为龙众（毘樓博叉龍王领十王，全组 11 门）。此件为藏传十一世纪壁画：Commons 著录作「**那伽（在上）与诸天于鹿野苑礼佛**」，是**龙众／天龙八部参与礼佛**这一图式在喜马拉雅地区的确证，亦合本经「汝觀如來法常爾，一切眾生咸利益」之场景。**边界**：①Commons 所摄为**孟买 CSMVS 之复制件**，非原作在现场之状，且原作出土地 Tasparang 未回源〔待核〕，故年代与产地**降级为「依 Commons 著录」**；②本壁画属藏传佛教之他处题域，**非本经之图**，尤不得据以说明本组诸龙王之名相；③藏语区壁画与汉译本经之龙众名号（娑竭羅、雲音幢、德叉迦等）无可对勘之关系〔待核〕。
  relevance_en: 'Our group three of §4.5 is the nāgas, headed by Veṇacitra with eleven gates. This eleventh-century Tibetan mural is catalogued as "**nāgas (above) and devas honouring the Buddha at his preaching in the Deer Park**" — documented evidence, in the Himalayan region, of the schema **dragons and the eight classes taking part in the Buddha''s worship**, matching the setting of "汝觀如來法常爾，一切眾生咸利益." Boundaries: (1) what Commons photographed is a **copy at the CSMVS, Mumbai**, not the mural in situ, and the find-spot "Tasparang" is not re-sourced [to be verified] — date and origin are therefore **demoted to "per the Commons record"**; (2) the mural belongs to a Tibetan Buddhist domain, **not to this scripture**, and must not be used to illustrate the names of this group''s dragon-kings; (3) no collation between the Tibetan mural and the Chinese sutra''s dragon names is possible on this evidence [to be verified].'
  status: confirmed
  kind_label: 【名相·他域壁画】
  caption_zh: 【名相·他域壁画】那伽与众天礼佛（西藏第十一世纪壁画·藏孟买 CSMVS 复制件）——取其为**龙众／天龙八部参与礼佛**图式在喜马拉雅地区之确证，合本组颂首「汝觀如來法常爾，一切眾生咸利益」之场景。**边界**：①Commons 所摄为**孟买 CSMVS 之复制件**，非原作现场之状；原作出土地 Commons 作 Tasparang〔待核：疑为拉达克 Thaspang 寺，本文未回源〕，故年代与产地**降级为「依 Commons 著录」**；②本件属藏传佛教他域，**非本经之图**，不得据以说明本组诸龙王名相；③藏语区壁画与汉译本经龙众名号（娑竭羅、雲音幢、德叉迦等）无可对勘之关系〔待核〕。<br>
  caption_en: 'Nāgas and devas honouring the Buddha (11th-century Tibetan mural, copy at CSMVS Mumbai) — admitted as documented evidence, in the Himalayan region, of the schema **dragons and the eight classes joining the Buddha''s worship**, answering to the verse "汝觀如來法常爾，一切眾生咸利益." Boundaries: (1) what is photographed is a **copy in Mumbai, not the mural in situ**; Commons gives the find-spot as Tasparang [to be verified: possibly Thaspang, Ladakh — not re-sourced], so date and origin are **demoted to "per the Commons record"**; (2) the work belongs to a Tibetan domain, **not to this scripture**, and cannot illustrate the names of this group''s dragon-kings; (3) no collation between the mural and the Chinese dragon names is possible on this evidence [to be verified].'
