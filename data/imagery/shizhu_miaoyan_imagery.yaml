  relevance_zh: 与图 4-7 配对，为**迦楼罗—龙（或那伽王）之对置**在占城（Champa）石刻中之另一实例：迦楼罗作人首鸟身、执物，与那伽（龙）相向。此类「迦楼罗与龙对峙」的构图，是本经 4.9 组「一佛同时坐于十方觉树之下而演法如云」之**护法与被护关系**在东南亚石刻中的惯用图式之一，可作对读。**边界**：①此系**占城（Champa）砂岩造像**，位于今越南，**非本经之图**，且本经迦楼罗组之图像依据不在此一区域〔待核〕；②Commons 著录未详此像之具体题材（降龙／护龙／对置）〔待核〕，本文仅依可见形态与著录题名描述，**不断言其情节**；③是否即出土于比定（Binh Dinh）之原物，本文未独立回源〔待核〕。
  relevance_en: 'Paired with Fig. 4-7, this is another instance of the **garuḍa–dragon (Nāgarāja) juxtaposition** in Cham stone sculpture: a human-headed, bird-bodied garuḍa with implement, facing the nāga. The schema of garuḍa confronting dragon is among the conventional Southeast Asian compositions for the guardian-and-guarded relation, and may be read against this group''s verses on the Buddha''s unconfined powers and the Dharma-cloud. Boundaries: (1) a **Cham sandstone image** in present-day Vietnam, **not an image of our sutra**, whose garuḍa group has no iconographic basis in this region [to be verified]; (2) Commons does not state the subject — subduing, protecting, or mere confrontation [to be verified] — so this entry describes only what is visible and what the title asserts, and **asserts no narrative**; (3) whether this is the original from Binh Dinh has not been independently re-sourced [to be verified].'
  status: confirmed
  kind_label: 【名相·他国造像】
  caption_zh: 【名相·他国造像】占城砂岩雕像·迦楼罗与那伽（十二—十三世纪·藏越南国家历史博物馆占城石刻馆）——与图 4-7 配对，为**迦楼罗—龙（那伽王）之对置**在占城石刻中之另一实例（迦楼罗人首鸟身、执物，与那伽相向），此类构图惯用「护法与被护」之关系。**边界**：①此系**占城（Champa）砂岩造像**，位于今越南，**非本经之图**，本经迦楼罗组之图像依据不在此一区域〔待核〕；②Commons 著录未详其题材（降龙／护龙／对置）〔待核〕，本文仅依可见形态与著录题名描述，**不断言其情节**；③是否即出土于比定（Binh Dinh）之原物未回源〔待核〕。<br>
  caption_en: 'Cham sandstone sculpture of Garuḍa and Nāgarāja (12th–13th c., Champa Stone Gallery, National Museum of Vietnamese History, Hanoi) — paired with Fig. 4-7 as a second instance of the **garuḍa–nāga juxtaposition** in Cham sculpture (human-headed bird-bodied garuḍa with implement, facing the nāga), a conventional composition for the guardian relation. Boundaries: (1) a **Cham** sandstone image in present-day Vietnam, **not an image of our sutra**, whose garuḍa group has no iconographic basis in this region [to be verified]; (2) Commons does not state the subject — subduing, protecting, or confrontation [to be verified] — so this entry describes only what is visible and what the title asserts, and **asserts no narrative**; (3) whether this is the original from Binh Dinh has not been re-sourced [to be verified].'
- id: sukhothai-garuda-head
  kind: C
  section: '4.9'
  figure_no: 4-9
