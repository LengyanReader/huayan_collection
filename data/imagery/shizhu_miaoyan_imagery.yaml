  date: '2016-05-26'
  relevance_zh: 本文 4.9 组为迦楼罗（*garuḍa*，此云「金翅鸟」，食龙为生），组首「大速疾力迦樓羅王」，其门「無著無礙眼普觀察眾生界」以**「眼」**为纲。此件为中国**明代石刻**之迦楼罗形象（作人首鸟身，执物立于莲台），并与**龙女**对置——「迦楼罗与龙」之相对，正合本经卷一「复有佛世界微尘数迦楼罗王、紧那罗王、摩睺罗伽王、龙王」之**龙／迦楼罗相并**之编制。**边界**：①此系**中国明代造像之类型样本**，与本经之印度系迦楼罗（紧那罗、毗湿奴之坐骑、迦楼罗—龙闘之本生）**形象系统不同**（中国迦楼罗多受大鹏金翅明王、准胝观音等教法塑造）；②真觉寺金刚宝座塔与本经**无任何依据之关系**〔待核〕，不得以此图为「本品之迦楼罗」；③Commons 未著录此石刻之年代，本文依真觉寺塔成于明成化九年（1473）暂系为明代〔待核〕。
  relevance_en: 'Our group seven of §4.9 is the garuḍas, headed by Great Swift-Strength Garuḍa King, whose gate — "**unattached, unobstructed eyes**, universally surveying the realm of beings" — turns on sight. This is a **Chinese Ming-dynasty** image of a garuḍa (human-headed, bird-bodied, standing on a lotus) set against **the dragon girl**: the juxtaposition of garuḍa and dragon matches Book One''s listing, where garuḍa-king and dragon-king stand side by side. Boundaries: (1) a **type-sample of Chinese Ming iconography**, a different image-system from the Indic garuḍa (kinnara, Viṣṇu''s vāhana, the garuḍa–naga combat jātaka), and Chinese garuḍas are largely shaped by Vajrapani and related esoteric doctrinal formations; (2) **no documented relation whatever** between the Diamond Throne Stupa at Zhenjue Temple and this sutra [to be verified] — the image must not be offered as "the garuḍa of this text"; (3) Commons gives no date for the relief; the Ming attribution here follows the stupa''s recorded completion in 1473 [to be verified].'
  status: confirmed
  kind_label: 【名相·中国造像】
  caption_zh: 【名相·中国造像】北京真觉寺金刚宝座塔·六挐具迦楼罗与龙女石刻（明代·藏北京真觉寺）——取其**中国造像中之迦楼罗形态**（人首鸟身、执物立于莲台）与**「迦楼罗与龙」之对置**，后者合本经卷一「迦楼罗王、紧那罗王、摩睺罗伽王、龙王」龙／迦楼罗相并之编制。**边界**：①此系**中国明代造像之类型样本**，与本经之印度系迦楼罗（紧那罗／毗湿奴坐骑／迦楼罗—龙闘本生）**形象系统不同**（中国迦楼罗多受大鹏金翅明王、准胝观音等教法塑造）；②真觉寺金刚宝座塔与本经**无任何依据之关系**〔待核〕，**不得以此图为「本品之迦楼罗」**；③Commons 未著录石刻年代，本文依该塔成于明成化九年（1473）暂系为明代〔待核〕。<br>
  caption_en: 'Garuda and the Dragon Girl, Diamond Throne Stupa, Zhenjue Temple, Beijing (Ming) — admitted as the **Chinese garuḍa type** (human-headed, bird-bodied, standing on a lotus) and for the **juxtaposition of garuḍa and dragon**, which matches Book One''s side-by-side listing of garuḍa-king and dragon-king. Boundaries: (1) a **type-sample of Chinese Ming iconography**, a system distinct from the Indic garuḍa (kinnara, Viṣṇu''s vāhana, the garuḍa–naga combat jātaka); Chinese garuḍas are largely shaped by Vajrapani and related esoteric formations. (2) **No documented relation** between the Diamond Throne Stupa and this sutra [to be verified] — the image must not be offered as "the garuḍa of this text"; (3) Commons gives no date for the relief, the Ming attribution following the stupa''s recorded completion in 1473 [to be verified].'
