  date: '1100'
  relevance_zh: 龙众之于本经之意义，在颂文中为**救苦拔难**而非「龙形可畏」（见 4.5 疏解之「拔彼畏塗淪墜者」）。此件所现者为**佛陀坐于那伽（蛇王）之上**——即佛教艺术中最著行之「**那伽王（摩護那迦）擁護佛陀**」图式：龙王以身缠绕、以首为座而护佛，与本组「德叉迦得以清淨救護音滅除一切怖畏」「無熱惱得以大悲普覆雲滅一切世間苦」之门义正可对读。**边界**：①此造像为**高棉／吴哥王权**语境，Commons 描述其意为「Jayavarman VII 建大寺于 Banteay Chhmar，自比于坐于蛇（那伽）上之佛，以为其受供奉之神圣化身」——**属政治神学，非本经之龙众**；②「摩護那迦」之名**不在本经卷三诸龙王名号之内**（本经作毘樓博叉、娑竭羅等）〔待核〕，故此图**只作「龙护佛」这一事仪之图式参照**；③吴哥造像风格与汉译本经之龙众形貌无可对勘〔待核〕。
  relevance_en: 'The nāgas of this group matter in the sutra''s verse as **deliverers of suffering**, not as dragon-forms to fear (see §4.5, "拔彼畏塗淪墜者"). This object shows the **Buddha seated upon a nāga** — the canonical image of the **nāga-king Mucalinda shielding the Buddha**, coiling round and offering his head as a seat — which reads directly against this group''s gates: De叉迦''s pure rescuing sound that destroys all terror, Wu-re-nào''s cloud of great compassion that extinguishes all worldly suffering. Boundaries: (1) the image belongs to the **Khmer/Angkor kingship** programme; Commons states its meaning to be that "Jayavarman VII, who built the great royal temple at Banteay Chhmar, linked himself with the image of the Buddha seated on a serpent, or naga, as the divine form under which he would be honored" — **political theology, not our sutra''s nāgas**; (2) the name **Mucalinda does not occur among the dragon-kings named in Book Three** (our text has Veṇacitra, Sagara…) [to be verified], so the object serves only as a schema-reference for the act of dragon-shielding; (3) Angkor style and the Chinese text''s dragon forms cannot be collated [to be verified].'
  status: confirmed
  kind_label: 【行动·他国造像】
  caption_zh: 【行动·他国造像】那伽座佛（十二世纪·吴哥砂岩·藏克利夫兰美术馆）——取其**龙护佛**之事仪：本组诸门义在「救苦拔难」（「德叉迦得以清淨救護音滅除一切怖畏」「無熱惱得以大悲普覆雲滅一切世間苦」），而此像所现者即佛教艺术中最著行之「**那伽王擁護佛陀**」图式——龙王以身缠绕、以首为座。**边界**：①此造像属**高棉／吴哥王权**语境，Commons 述其意为 Jayavarman VII 自比于「坐于蛇上之佛」以受供奉，**属政治神学，非本经之龙众**；②「摩護那迦」之名**不在本经卷三诸龙王名号之内**（本经作毘樓博叉、娑竭羅等）〔待核〕，故**只作「龙护佛」事仪之图式参照**；③吴哥风格与本经龙众形貌无可对勘〔待核〕。<br>
  caption_en: 'Naga-Enthroned Buddha (12th c., Angkor-period sandstone, Cleveland Museum of Art) — admitted for the **act of dragon-shielding**: this group''s gates are about delivering beings from suffering, and this object shows the canonical image of the **nāga-king Mucalinda shielding the Buddha**, coiling round and offering his head as a seat. Boundaries: (1) a **Khmer/Angkor kingship** image; Commons glosses it as Jayavarman VII identifying himself with the Buddha seated on the serpent as the divine form under which he would be honoured — **political theology, not our sutra''s nāgas**; (2) **Mucalinda does not occur among the dragon-kings named in Book Three** (Veṇacitra, Sagara…) [to be verified], so the object serves only as a schema-reference for the act; (3) Angkor style and the sutra''s dragon forms cannot be collated [to be verified].'
- id: sukhothai-yaksha-head
  kind: C
