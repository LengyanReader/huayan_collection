  figure_no: 4-1
  typology: 名相
  motif_zh: 乾闼婆（香音神）
  motif_en: Gandharva / kinnara, celestial musician
  title_zh: 阿旃陀石窟第1窟·莲华色（Padmapani）菩萨壁中之持筌篪之乾闼婆（局部）
  title_en: Kinnara with a kachchapa-veena, detail from the Padmapani Bodhisattva, Cave 1, Ajanta
  era_zh: 公元450—490年〔Commons 著录 450-490 C.E.〕
  location_zh: 印度马哈拉施特拉邦奥兰加巴德·阿旃陀石窟第1窟（壁面彩绘，颜料敷岩）
  file: File:Kinnara with kachchapa veena, part of Padmapani Bodhisattva-Ajanta Caves-Aurangabad-Maharashtra.jpg
