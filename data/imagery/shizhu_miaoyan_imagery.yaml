  title_zh: 迦楼罗头部造像（泰国素可泰·兰甘亨博物馆）
  title_en: Head of a Garuḍa, Sukhothai (Ramkhamhaeng Museum)
  era_zh: 〔待核：Commons 未著录年代；本文依馆藏与素可泰王朝（13—14世纪）之风格暂系，未独立回源〕
  location_zh: 泰国素可泰·兰甘亨博物馆（Ramkhamhaeng Museum, Museum of Sukhothai History）
  file: File:Head of Garuda, Ramkhamhaeng Museum, Sukhothai (40681653773).jpg
  thumb_url: https://upload.wikimedia.org/wikipedia/commons/thumb/e/ed/Head_of_Garuda%2C_Ramkhamhaeng_Museum%2C_Sukhothai_%2840681653773%29.jpg/960px-Head_of_Garuda%2C_Ramkhamhaeng_Museum%2C_Sukhothai_%2840681653773%29.jpg
  source_page: https://commons.wikimedia.org/wiki/File:Head_of_Garuda,_Ramkhamhaeng_Museum,_Sukhothai_(40681653773).jpg
  license_zh: 公有领域（Flickr 公有领域标记 PD-author-FlickrPDM）
  license_en: Public domain
  license_url: ''
  author_zh: Gary Todd（摄影，2019-04-20）
  date: '2019-04-20'
  relevance_zh: 与图 4-6 同馆同批次，为**迦楼罗头部**造像——其**人面、弯角（角状宝冠）与人身鸟喙之合构**，可见东南亚对「人首鸟身」之迦楼罗如何作**面具化**处理；本经 4.9 组以「眼」为纲、以「普觀」为门，此像之**正面双眼与宝冠**之特写，恰可供读者体会「無著無礙眼」一类门名之造型背景。**边界**：①此为**上座部／泰国**造像头部，与本经之迦楼罗**无宗派关联**；②Commons 著录**未载年代与出土位置**〔待核〕；③素可泰之迦楼罗多为其建筑（塔门、门楣、屋脊）之镇护构件，职能为**护法镇宅**，与本经迦楼罗「得無著無礙眼普觀察眾生界」之**观照与教化**方向并不相同〔本文判断〕，不得以「同为迦楼罗」而径直对勘。
  relevance_en: 'Same museum and same shooting day as Fig. 4-6, but a **garuḍa head**: human face, curved horn-like crown, and a bird''s beak fused into one mask. It shows how South-East Asia treats the "man-headed bird" garuḍa as a **mask**, and its frontal eyes and crown give the reader a visual ground for gate-names of the "unattached, unobstructed eyes" type. Boundaries: (1) a **Theravāda/Thai** head with no denominational link to our garuḍas; (2) Commons records **neither date nor find-spot** [to be verified]; (3) in Sukhothai the garuḍa is normally a **guardian architectural member** (gables, door frames, ridges), so its office is apotropaic rather than the surveying-and-teaching office of our group''s gate — a difference that forbids a flat equation merely because both are called garuḍa [this article''s judgement].'
  status: confirmed
  kind_label: 【名相·他国造像】
  caption_zh: 【名相·他国造像】迦楼罗头部造像（泰国素可泰·兰甘亨博物馆）——与图 4-6 同馆同批次，取其**人面、弯角宝冠与人身鸟喙之合构**，可见东南亚对「人首鸟身」之迦楼罗如何作**面具化**处理；其正面双眼与宝冠之特写，可供体会「無著無礙眼」一类门名之造型背景。**边界**：①此为**上座部／泰国**造像头部，与本经之迦楼罗**无宗派关联**；②Commons 著录**未载年代与出土位置**〔待核〕；③素可泰之迦楼罗多为其建筑（塔门、门楣、屋脊）之**镇护构件**，职能为护法镇宅，与本经「得無著無礙眼普觀察眾生界」之**观照教化**方向并不相同〔本文判断〕，不得以「同为迦楼罗」而径直对勘。<br>
  caption_en: 'Head of a Garuḍa (Ramkhamhaeng Museum, Sukhothai) — same museum and day as Fig. 4-6, showing the fusion of human face, horn-like crown and bird''s beak into a **mask**, and giving a visual ground for gate-names of the "unattached, unobstructed eyes" type. Boundaries: (1) a **Theravāda/Thai** head with no denominational link to our garuḍas; (2) Commons records **neither date nor find-spot** [to be verified]; (3) in Sukhothai the garuḍa is normally a **guardian architectural member** (gables, door frames, ridges), apotropaic in office, whereas our group''s gate is surveying and teaching — a difference that forbids flat equation merely because both are garuḍa [this article''s judgement].'
- id: gandhara-garuda-naga-combat
  kind: C
  section: '4.9'
  figure_no: 4-10
  typology: 行动
  motif_zh: 迦樓羅降龍（迦楼罗—龙闘）
  motif_en: Garuḍa vanquishing the nāgas
  title_zh: 迦楼罗降服龙族（犍陀罗·片岩雕刻·大都会艺术博物馆）
  title_en: Garuḍa vanquishing the Nāga clan (schist, Gandhara, Metropolitan Museum of Art)
  era_zh: 公元二—三世纪〔Commons 转录馆藏著录 ca. 2nd–3rd century〕
  location_zh: 现藏纽约大都会艺术博物馆；高 33.3 厘米、宽 25.1 厘米；原出犍陀罗（今巴基斯坦西北部）
  file: File:Garuda vanquishing the Naga clan. Gandhara. Met.jpg
  thumb_url: https://upload.wikimedia.org/wikipedia/commons/thumb/d/d7/Garuda_vanquishing_the_Naga_clan._Gandhara._Met.jpg/960px-Garuda_vanquishing_the_Naga_clan._Gandhara._Met.jpg
  source_page: https://commons.wikimedia.org/wiki/File:Garuda_vanquishing_the_Naga_clan._Gandhara._Met.jpg
  license_zh: 署名—相同方式共享 4.0（CC BY-SA 4.0）
  license_en: CC BY-SA 4.0
  license_url: https://creativecommons.org/licenses/by-sa/4.0
  author_zh: Ismoon（摄影，2015-11-29）；原作作者佚名（古代）
  date: '2015-11-29'
  relevance_zh: 本文 4.9 组颂文不写「食龙」而写「佛眼廣大無邊際……現大神通悉調伏」，其**「調伏」**之义与此像之题材正相应——迦楼罗与龙族之闘（Commons 归其于 *Kākāti Jātaka* 类目）是印度佛教造像中**迦楼罗之最大动作**，可为「金翅鸟食龙」这一名相之训释提供图像之据。**边界**：①Commons／馆藏著录其题材属**本生故事（*Kākāti Jātaka*，迦楼罗—龙族之闘）**，属**他经本生之图像化**，**非本经**；本经卷三迦楼罗组之颂**未载此斗事**〔待核〕，故**不得以本生图像为本经会众之图**；②此像虽出犍陀罗（与本经之印度本土相去不远），然其**具体窟址与出土层位**本文未回源〔待核〕。
  relevance_en: 'The verses of our group do not say "eats dragons" but "the Buddha''s eye is vast without bound … and by great divine powers subdues them all" — and the word **subdue** is exactly the subject of this object. The combat of garuḍa with the nāga clan (Commons files it under the *Kākāti Jātaka*) is the **largest single action** of the garuḍa in Indian Buddhist sculpture, and supplies visual ground for the name "golden-winged bird that devours dragons." Boundaries: (1) museum and Commons give the subject as a **jātaka narrative** (the *Kākāti Jātaka*, garuḍa vs. nāgas) — an image of **another scripture**, and **not of ours**; the verses of our garuḍa group contain no account of this combat [to be verified], so a jātaka image must never be offered as the assembly of this sutra; (2) although Gandhara is geographically near the Indian home of our text, the **specific cave-site and stratigraphy** of this piece have not been re-sourced [to be verified].'
  status: confirmed
  kind_label: 【行动·本生图像】
  caption_zh: 【行动·本生图像】迦楼罗降服龙族（犍陀罗·片岩雕刻·约公元二—三世纪·藏大都会艺术博物馆）——取其正应本组颂中「**現大神通悉調伏**」之「調伏」义：迦楼罗与龙族之闘（Commons 归 *Kākāti Jātaka* 类目）为印度佛教造像中**迦楼罗之最大动作**，可证「金翅鸟食龙」之名相训释。**边界**：①馆藏著录其题材属**本生故事（迦楼罗—龙族之闘）**，属**他经之图像化**，**非本经**；本经卷三此组颂中**并无降龙之句**〔待核〕，故**不得以本生图像充为本经会众之图**；②虽出犍陀罗，与本经之印度本土相近，然其具体窟址与出土层位未回源〔待核〕。<br>
  caption_en: 'Garuḍa vanquishing the Nāga clan (schist, Gandhara, ca. 2nd–3rd c., Metropolitan Museum of Art) — admitted because it answers the verse''s **"subdues them all"** by great divine powers: the combat of garuḍa with nāgas (Commons files it under the *Kākāti Jātaka*) is the **largest action** of the garuḍa in Indian Buddhist sculpture, and evidences the name "bird that devours dragons." Boundaries: (1) the catalogue gives a **jātaka narrative** (garuḍa vs. nāgas) — an image of **another scripture**, **not of ours**; our Book Three group contains **no account of this combat** [to be verified], so a jātaka image must not be passed off as the assembly of this sutra; (2) though Gandhara lies near the Indian home of our text, the specific cave-site and stratigraphy have not been re-sourced [to be verified].'
