article: puxian-sanmei
title_zh: 普贤三昧品·文化资产参证登记册
title_en: Cultural-asset register for the Samantabhadra-samadhi chapter
purpose: 本文件为《华严经细读·第三部》正文插图与名胜参证的**唯一权威著录源**。凡正文引用之图像/古迹，须在此登记：所应之经句或义理、图像本身之名称/时代/现址、**授权类型与授权链接**、以及「图像与经文之关系边界」。
license_policy: 一律取自 Wikimedia Commons 之可核验授权文件，按 extmetadata 逐条核验。优先级：① PD／CC0；② CC BY（须署名）；③ CC BY-SA（须署名并同授权）。
verification_note: 核验于 2026-11-13：3 项 thumb_url 逐条 HTTP HEAD 实测 200（含 429 重试）；授权与作者经 Commons extmetadata 回源。
boundary_principle: >
  (A) 依本经而作——0 件。(B) 同题域之他像——2 件：榆林窟第3窟普贤菩萨赴会图（西夏·普贤变题域）、唐代普贤石像（造像传统）。(C) 名胜古迹实况——1 件：峨眉山十方普贤（普贤道场·与 P1 登记册同源文件独立登记）。
