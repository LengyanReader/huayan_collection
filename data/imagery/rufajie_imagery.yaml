article: huayan-rufajie-pin
title_zh: 入法界品·文化资产参证登记册（名胜古迹·造像·浮雕·图绘）
title_en: Cultural-asset register for the Chapter on Entering the Dharma Realm
purpose: 本文件为《华严经细读·第三十九部》正文插图与名胜参证的**唯一权威著录源**。凡正文引用之图像/遗址，须在此登记：所应之经句或叙事、图像本身之名称/时代/现址、**授权类型与授权链接**、以及「图像与经文之关系边界」（凡非依本经而作者，必须如实标注，不得混同）。
license_policy: 一律取自 Wikimedia Commons 之可核验授权文件，按 extmetadata 逐条核验（LicenseShortName/Artist/DateTimeOriginal）。优先级：① PD／CC0；② CC BY 4.0（须署名）；③ CC BY-SA（须署名并同授权）。署名义务：凡 CC BY／CC BY-SA 必填 author_zh，不得留白、不得臆造。
verification_note: 全量核验于 2026-11-13 完成：4 项 thumb_url 逐条 HTTP HEAD 实测（见 verification_log）；授权与作者经 Commons extmetadata 回源，凡未载者如实标〔待核〕。缩略图 URL 去查询参数。
boundary_principle: >
  (A) 依本经而作者——0 件（本批无「专为本品而作」之考得图像）。
  (B) 同题域之他像——2 件：婆罗浮屠善财巡礼浮雕（学界以婆罗浮屠回廊浮雕叙事与《入法界品》五十三参对应·通说引为华严题域·〔待核〕个案断代与教义归属）、明代木雕善财童子像（依善财形象传统）。
  (C) 名胜古迹实况——2 件：莫高窟第61窟五台山图（文殊道场图·善财巡礼终点区之题域参证·非本经变）、祇园精舍香室遗址（本品「逝多林·给孤独园」说处之今日实存·遗址非经文图像）。
