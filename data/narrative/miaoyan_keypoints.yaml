meta:
  id: shizhu-miaoyan-keypoints
  title_zh: "世主妙严品 · 要点导览"
  title_en: "Adorning the World-Ruler · A Guided Tour of the Key Points"
  source_primary: "CBETA T10n0279《大方廣佛華嚴經》（實叉難陀譯，八十卷本）·世主妙嚴品第一＝卷一至卷五"
  source_url: "https://cbetaonline.dila.edu.tw/zh/T10n0279"
  source_text_verified: true
  note_zh: "以「位之四层」为骨架，取本品八处要点置于环上周匝，循序播放。图形为示意，不按比例；凡属本文判断者逐条标明。"
  note_en: "Eight key points placed on a ring of four registers and played in sequence. Spatial arrangement is illustrative, not to scale; judgments of this article are marked point by point."
  icon_note_zh: "各要点之小图为抽象线画，只作辨识之用，非图像史意义上的形象依据。"
  version: "1.0.0"
  status: "draft"

# 示意之骨架：位之四层。环半径之比取「由内而外、摄化愈广」之意，
# 非经文所定之距离，亦非任何比例尺（本文 图 〇-4 之位之四层）。
frame:
  title_zh: "位之四层 · 由内而外"
  title_en: "Four registers, from centre outward"
  disclaimer_zh: "此环为示意：半径之比取「摄化愈广」之意，非经文所定之距离，亦非比例尺。"
  disclaimer_en: "Schematic only: the radii express the widening of activity, not any textual scale."
  center_label_zh: "佛座"
  center_label_en: "The Buddha's seat"
  sweep_zh: "周匝之环"
  sweep_en: "The encircling ring"
  layers:
    - id: r1
      order: 1
      label_zh: "同生众 · 菩萨二十"
      label_en: "Bodhisattvas — twenty"
      radius: 0.40
      tone: gold
    - id: r2
      order: 2
      label_zh: "异生众 · 天众十二"
      label_en: "Celestial classes — twelve"
      radius: 0.62
      tone: jade
    - id: r3
      order: 3
      label_zh: "异生众 · 八部四王八"
      label_en: "The eightfold assembly — eight"
      radius: 0.79
      tone: lapis
    - id: r4
      order: 4
      label_zh: "异生众 · 十九类神"
      label_en: "The nineteen classes of deities"
      radius: 0.94
      tone: ash

# 证据等级之释义（页面徽标与页脚皆据此渲染，不另写死文案）
evidence_levels:
  T0:
    label_zh: "T0 经文明文"
    label_en: "T0 — explicit in the text"
    rule_zh: "经文本身明文如此。"
    rule_en: "Stated explicitly in the scripture."
  T1:
    label_zh: "T1 注疏·实测"
    label_en: "T1 — commentarial or measured"
    rule_zh: "据注疏之说，或由结构互证、逐处实测而得，经文未明书其数。"
    rule_en: "From commentarial tradition or from structural inference and counting; the text does not state the figure."
  T2:
    label_zh: "T2 学理判断"
    label_en: "T2 — scholarly judgment"
    rule_zh: "属分析判断，非经文或注疏所言。"
    rule_en: "An analytical judgment, not a statement of the text or its commentarial tradition."

# 八处要点。
#  `idx` 一律依此排序（勿用 `no`：YAML 1.1 会将裸 `no` 解析为布尔键 False）
#  `quote_zh` 必逐字见于 T279（由 scripts/verify_keypoints_render.js 断言）
#  `judgment: true` ⟺ 必有 judgment_zh（双向不变量）
#  `point_at` 为单位圆上之点 [cosθ, sinθ]，半径取所属层
keypoints:
  - idx: 1
    layer: r1
    title_zh: "开篇即是正觉之境"
    title_en: "The text opens already inside the realization"
    gist_zh: "首句「始成正觉」，随即转入「其地坚固，金刚所成」——经不先叙问答，先写佛所处之境。"
    gist_en: "The opening moves at once from the Buddha's awakening to the ground he occupies, rather than retelling the question-and-answer frame."
    quote_zh: "如是我聞：一時，佛在摩竭提國阿蘭若法菩提場中，始成正覺。其地堅固，金剛所成"
    ref: "T279 卷一"
    evidence: T0
    judgment: false
    duration_s: 9.0
    point_at: [0.5, 0.0]
    icon: "M4 17h16M6.5 17a5.5 5.5 0 0 1 11 0M12 11.5V7M9.4 7h5.2M12 7V4.4"

  - idx: 2
    layer: r4
    title_zh: "周匝而非高下"
    title_en: "A circuit, not a hierarchy"
    gist_zh: "四层众皆围绕、周匝佛座而集，非层层升阶。故位之别在「所主」与「摄化之广狭」，不在功德高下。"
    gist_en: "All four registers encircle the same seat; the distinction lies in what each presides over and how far its activity reaches, not in rank."
    quote_zh: "有佛世界微塵數"
    ref: "T279 卷一，各众 introductions"
    evidence: T0
    judgment: true
    judgment_zh: "「四层为一周匝而非一座塔」系本文由「众皆围绕佛座」推出，非经文明言。"
    duration_s: 10.0
    point_at: [0.0, 1.0]
    icon: "M12 3.2v17.6M3.2 12h17.6M12 8.4a3.6 3.6 0 1 0 0 7.2a3.6 3.6 0 1 0 0-7.2"

  - idx: 3
    layer: r2
    title_zh: "四十类之数，由结构互证"
    title_en: "The count of forty, attested by structure"
    gist_zh: "卷一四十类各作一次「如是等而為上首」，结构互证而得四十。经文并未明书「四十」这个数目字。"
    gist_en: "Forty classes each close with the same formula; the number follows from that structure, not from an explicit numeral in the text."
    quote_zh: "如是等而為上首"
    ref: "T279 卷一（四十现，本文逐卷分布实测）"
    evidence: T0
    judgment: true
    judgment_zh: "「四十」为由四十个类块与四十次结句两项结构事实推出之〔本文实测〕，非经文明文；澄观《疏》「四十眾」与之相合。"
    duration_s: 11.0
    point_at: [0.866, 0.5]
    icon: "M6.5 5.5h11M6.5 12h11M6.5 18.5h11M3.6 4.6l2 2M3.6 11.1l2 2M3.6 17.6l2 2"

  - idx: 4
    layer: r3
    title_zh: "十二、十三、十四——所唱之卷次归属"
    title_en: "Twelve, thirteen, fourteen — by the book each class sings in"
    gist_zh: "卷二唱天之十二，卷三唱八部八并神之类五，卷四唱神之类十四，卷五唱菩萨：12 + 13 + 14 = 39，加卷五一轨，凡四十类。"
    gist_en: "The thirty-nine classes outside the bodhisattva track divide among Books Two to Four as 12 + 13 + 14; with Book Five's own track, forty."
    quote_zh: "如是等而為上首"
    ref: "T279 卷二至卷五"
    evidence: T0
    judgment: true
    judgment_zh: "「卷次归属」为本文所分（十二／十三／十四），经文自身不以此数自陈。"
    duration_s: 10.0
    point_at: [0.633, 0.766]
    icon: "M6.5 19.5V9M12 19.5V4.5M17.5 19.5v-7M4.4 19.5h15.2"

  - idx: 5
    layer: r1
    title_zh: "卷一无颂，只是点名"
    title_en: "Book One has no verses — it only names"
    gist_zh: "全品五百二十七颂，卷一不出颂。故读本品：卷一宜快览，卷二以下宜细读。"
    gist_en: "All 527 verses come after Book One, which only names the assembly; read it quickly, then read the rest closely."
    quote_zh: "有十佛世界微塵數"
    ref: "本文逐卷实测；参本文 〇之二.6「数之四等」"
    evidence: T1
    judgment: true
    judgment_zh: "「五百二十七颂」为本文实测累加，非经文明陈之总数。"
    duration_s: 10.0
    point_at: [0.134, 0.5]
    icon: "M6.5 4.2h8l4 4v11.6h-12zM14.5 4.2v4h4M9.4 13.4h6M9.4 17h4.4"

  - idx: 6
    layer: r2
    title_zh: "所唱之序，逆于所列之序"
    title_en: "The order sung is the reverse of the order listed"
    gist_zh: "异生三十九类所唱之序，逆于卷一所列之序，而首尾相衔，成环（如图 〇-2）。"
    gist_en: "The sequence in which the classes sing reverses the sequence in which they were listed, closing on itself into a ring."
    quote_zh: "普應群情闡妙門"
    ref: "T279 卷二；本文比对卷一列次与卷二至卷四所唱（本文图 〇-2）"
    evidence: T0
    judgment: true
    judgment_zh: "「倒唱成环」为本文比对列次与所唱之次所成之观察，非经文自陈之结构名目。"
    duration_s: 10.0
    point_at: [0.5, 1.0]
    icon: "M4.6 12a7.4 7.4 0 0 1 14.8 0M19.4 12a7.4 7.4 0 0 1-14.8 0M15.2 8.9l4.2 3.1-4.2 3.1M8.8 15.1l-4.2-3.1 4.2-3.1"

  - idx: 7
    layer: r4
    title_zh: "四十众各得一门，而所入者一"
    title_en: "Forty gates, but one suchness entered"
    gist_zh: "各众各得一解脱门，而众之门「并在一时」：门有四十，所入者一。澄观《疏》谓「各得一者，显佛德无尽故」。"
    gist_en: "Each class gains one gate of liberation, yet all gates are entered at once: forty gates, one suchness. Chengguan reads this as the Buddha's inexhaustible virtue."
    quote_zh: "令入難思清淨法"
    ref: "T279 卷二；澄观《疏》T35n1735（本文 8.7 甲）"
    evidence: T0
    judgment: true
    judgment_zh: "「门有四十而所入者一」系据澄观之说推出，非经文明言。"
    duration_s: 11.0
    point_at: [0.0, 0.0]
    icon: "M4.5 20h4.4v-5h5v-5h5.6V5"

  - idx: 8
    layer: r1
    title_zh: "起于名，终于礼"
    title_en: "Opening with names, closing with offerings"
    gist_zh: "开卷「众海云集」，结卷供养则云「雨无尽宝及众妙华分散于地」——起于名，终于礼。"
    gist_en: "The chapter opens with an ocean of names and closes with a cloud of offerings: it begins with naming and ends with reverence."
    quote_zh: "雨無盡寶及眾妙華分散於地"
    ref: "T279 卷一开篇 / 卷五供养段"
    evidence: T0
    judgment: true
    judgment_zh: "「起于名，终于礼」为本文对首尾呼应的概括。"
    duration_s: 10.0
    point_at: [1.0, 0.0]
    icon: "M6.8 12.6a2.9 2.9 0 0 1 5.6 0a2.9 2.9 0 0 1 4.6 1.4M11.6 17.6l2.4 2.8 2.4-2.8M4.4 8.2h4.2M6.5 6.1v4.2"

closer:
  zh: "〔本文判断〕本导览之环位与走向皆为示意，取「位之四层」与「倒唱成环」二意为骨架，不据经文所定之方位，亦不按比例。凡经文明文者标 T0；据注疏或由实测互证者标 T1；属本文推论者另附判断说明。"
  en: "The ring and its sequence are schematic, built on the four registers and the reversed ring; no textual distances or proportions are implied."
