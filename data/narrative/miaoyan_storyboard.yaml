corrections:
- 'no': 1
  zh: 普賢入三昧在卷五开篇（已移入合幕第 23 镜）；卷一仅作列名上首（第 16 镜）
  en: Samantabhadra's entry into the samadhi is at the opening of fascicle 5 (shot 23); in fascicle 1
    he appears only as first among the named (shot 16).
- 'no': 2
  zh: 卷五内「迴向」0 次，「卷末回向」不成立，合幕改为「卷末頌別」
  en: The word 迴向 occurs zero times in fascicle 5; the planned "closing dedication" does not exist, so
    the coda closes with a verse.
- 'no': 3
  zh: 「四十類雲集」真锚点在卷二开篇「眾海悉已雲集」（置于承幕第 17 镜），非卷末
  en: The true anchor for "the forty classes gathered" is at the opening of fascicle 2 (shot 17), not
    the end.
acts:
- 'no': 序
  id: prelude
  layout: buddhafield
  title_zh: 序幕 · 正觉所现之境庄严
  title_en: 'Prelude: The Adornment Manifested at Awakening'
  fascicle_zh: 卷一（品首）
  fascicle_en: Fascicle 1
  lead_zh: 一時，佛在摩竭提國阿蘭若法菩提場中，始成正覺。
  lead_en: At one time, the Buddha, in the Place of Enlightenment at Araññavipṛśa in Magadha, attained
    perfect awakening.
  props:
  - id: ground
    kind: ground
    label_zh: 地·堅固
    label_en: Ground, solid
    quote_zh: 其地堅固，金剛所成
    quote_en: The ground is solid, made of vajra.
    level: 0
  - id: wheel
    kind: wheel
    label_zh: 上妙寶輪
    label_en: Wondrous jeweled wheel
    quote_zh: 上妙寶輪，及眾寶華、清淨摩尼，以為嚴飾
    quote_en: Above it a wondrous jeweled wheel, with jeweled blossoms and pure jewels as adornment.
    level: 0
  - id: blossom
    kind: lotus
    label_zh: 眾寶華
    label_en: Jeweled blossoms
    quote_zh: 眾寶華、清淨摩尼，以為嚴飾
    quote_en: Jeweled blossoms and pure jewels serve as adornment.
    level: 0
  - id: mani
    kind: jewel
    label_zh: 清淨摩尼
    label_en: Pure maṇi jewel
    quote_zh: 眾寶華、清淨摩尼，以為嚴飾
    quote_en: Jeweled blossoms and pure jewels serve as adornment.
    level: 0
  - id: formsea
    kind: lightsea
    label_zh: 諸色相海
    label_en: Sea of forms and colors
    quote_zh: 諸色相海，無邊顯現
    quote_en: Seas of forms and colors appear without bound.
    level: 0
  - id: banner
    kind: banner
    label_zh: 摩尼為幢
    label_en: Maṇi as banner
    quote_zh: 摩尼為幢，常放光明，恒出妙音
    quote_en: A maṇi banner, constantly radiating light, forever emitting wondrous sound.
    level: 1
  - id: net
    kind: net
    label_zh: 眾寶羅網
    label_en: Jeweled net
    quote_zh: 眾寶羅網，妙香華纓，周匝垂布
    quote_en: A jeweled net and scented blossom-garlands hang all around.
    level: 1
  - id: garland
    kind: cloud
    label_zh: 妙香華纓
    label_en: Scented blossom-garlands
    quote_zh: 眾寶羅網，妙香華纓，周匝垂布
    quote_en: A jeweled net and scented blossom-garlands hang all around.
    level: 1
  - id: maniking
    kind: jewelrain
    label_zh: 摩尼寶王
    label_en: Maṇi jewel-king
    quote_zh: 摩尼寶王，變現自在，雨無盡寶及眾妙華分散於地
    quote_en: The maṇi jewel-king manifests freely, raining endless jewels and wondrous blossoms upon
      the ground.
    level: 0
  - id: trees
    kind: tree
    label_zh: 寶樹行列
    label_en: Rows of jeweled trees
    quote_zh: 寶樹行列，枝葉光茂
    quote_en: Jeweled trees stand in rows, their branches and leaves luminous and flourishing.
    level: 0
  - id: bodhi
    kind: tree
    label_zh: 菩提樹
    label_en: The Bodhi Tree
    quote_zh: 其菩提樹高顯殊特：金剛為身，瑠璃為幹
    quote_en: 'Its bodhi tree, tall and singular: vajra for its body, lapis lazuli for its trunk.'
    level: 0
    role: focus
  - id: bodhi_trunk
    kind: trunk
    label_zh: 瑠璃為幹
    label_en: Lapis lazuli trunk
    quote_zh: 其菩提樹高顯殊特：金剛為身，瑠璃為幹
    quote_en: Vajra for its body, lapis lazuli for its trunk.
    level: 1
  - id: bodhi_branch
    kind: branch
    label_zh: 寶為枝條・寶葉扶踈
    label_en: Jewel branches, jewel leaves
    quote_zh: 眾雜妙寶以為枝條；寶葉扶踈，垂蔭如雲
    quote_en: Assorted wondrous jewels for its branches; jewel-leaves support and spread, hanging shade
      like clouds.
    level: 2
  - id: bodhi_fruit
    kind: jewel
    label_zh: 寶華雜色・摩尼為果
    label_en: Jewel blossoms, maṇi fruit
    quote_zh: 寶華雜色，分枝布影，復以摩尼而為其果，含輝發焰
    quote_en: Jewel-blossoms of varied colors, branching and casting shadows; and maṇi jewels for its
      fruit, holding radiance, emitting flames.
    level: 3
  - id: bodhi_inner
    kind: assembly
    label_zh: 寶內諸菩薩如雲
    label_en: Bodhisattvas within, a cloud
    quote_zh: 摩尼寶內，有諸菩薩，其眾如雲，俱時出現
    quote_en: Within the maṇi jewels there are bodhisattvas, a host like clouds, appearing all at once.
    level: 3
  - id: bodhi_sound
    kind: sound
    label_zh: 恒出妙音
    label_en: Ever-sounding wondrous tone
    quote_zh: 其菩提樹恒出妙音，說種種法，無有盡極
    quote_en: The bodhi tree forever emits wondrous sound, speaking all manner of Dharma without end.
    level: 1
  - id: palace
    kind: palace
    label_zh: 宮殿樓閣
    label_en: Palace and mansions
    quote_zh: 如來所處宮殿樓閣，廣博嚴麗充遍十方
    quote_en: The palace and mansions where the Tathāgata abides are spacious and stately, filling the
      ten directions.
    level: 0
  - id: adorn
    kind: lightstream
    label_zh: 莊嚴具流光成幢
    label_en: Adornments streaming light into banners
    quote_zh: 諸莊嚴具流光如雲，從宮殿間萃影成幢
    quote_en: All adornments stream light like clouds; their shadows gather from between the mansions
      into banners.
    level: 1
  - id: manicloud
    kind: cloudpair
    label_zh: 摩尼光雲
    label_en: Clouds of maṇi light
    quote_zh: 摩尼光雲，互相照耀；十方諸佛，化現珠玉
    quote_en: Clouds of maṇi light illuminate one another; the Buddhas of the ten directions manifest
      as pearls and gems.
    level: 1
  - id: seat
    kind: seat
    label_zh: 師子座
    label_en: The Lion Throne
    quote_zh: 其師子座，高廣妙好：摩尼為臺，蓮華為網
    quote_en: 'His lion throne, tall and broad: maṇi for its platform, lotus for its net.'
    level: 0
  - id: seat_detail
    kind: hall
    label_zh: 堂榭階砌戶牖
    label_en: Halls, steps, doors and windows
    quote_zh: 堂榭、樓閣、階砌、戶牖，凡諸物像，備體莊嚴
    quote_en: Halls, pavilions, towers, steps, terraces, doors and windows — every form is fully adorned.
    level: 1
  - id: awake
    kind: sun
    label_zh: 成最正覺
    label_en: Perfect awakening
    quote_zh: 於一切法成最正覺
    quote_en: He attained the unsurpassed right awakening to all phenomena.
    level: 0
  - id: void
    kind: void
    label_zh: 虛空譬
    label_en: Simile of space
    quote_zh: 譬如虛空具含眾像，於諸境界無所分別
    quote_en: Like space, which contains all images and distinguishes no realms.
    level: 0
  - id: hairtip
    kind: hairtip
    label_zh: 毛端容世界
    label_en: All worlds in a hair-tip
    quote_zh: 一一毛端，悉能容受一切世界而無障礙
    quote_en: In each single hair-tip he contains all worlds without obstruction.
    level: 0
