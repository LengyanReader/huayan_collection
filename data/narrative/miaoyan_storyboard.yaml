- 'no': 合
  id: coda
  layout: mandala
  title_zh: 合 · 普贤入三昧 · 四十类总现 · 卷末颂别
  title_en: 'Coda: Samantabhadra Enters the Ocean of Merit, the Forty Classes Appear, the Final Verse'
  fascicle_zh: 卷五
  fascicle_en: Fascicle 5
  lead_zh: 復次，普賢菩薩摩訶薩，入不思議解脫門方便海，入如來功德海。
  lead_en: Then Samantabhadra Bodhisattva entered the ocean of the inconceivable liberation-doors and
    expedients, and the ocean of the Buddhas's merits.
  note_zh: 【据回源更正】台账 L.94⑩-3 原拟「合（四十类云集·卷末回向）」。实测卷五内「迴向」二字为 0 次，卷五以妙色那羅延執金剛神之頌收束（「…示佛所行處。」），故不作回向；「四十类云集」之真锚点为卷二开篇「眾海悉已雲集」（已置于承幕第
    17 镜）。
  note_en: 'Correction: the originally planned "closing dedication" does not exist — the word 迴向 occurs
    zero times in fascicle 5, which closes instead with the verse of the vajra-holding spirit Vimalaprabha.'
  props:
  - id: samantabhadra
    kind: seat
    label_zh: 普賢菩薩入三昧
    label_en: Samantabhadra enters the samadhi
    quote_zh: 復次，普賢菩薩摩訶薩，入不思議解脫門方便海，入如來功德海
    quote_en: Then Samantabhadra Bodhisattva entered the ocean of the inconceivable liberation-doors and
      expedients, and the ocean of the Buddhas's merits.
    level: 0
    role: focus
  - id: gate1
    kind: gate
    label_zh: 嚴淨一切佛國土
    label_en: Purifying all Buddhaland
    quote_zh: 有解脫門，名：嚴淨一切佛國土調伏眾生令究竟出離
    quote_en: 'There is a liberation-door named: purifying all Buddhaland and taming sentient beings,
      bringing them to final release.'
    level: 1
  - id: gate2
    kind: gate
    label_zh: 普現微塵數無量身
    label_en: Manifesting countless bodies
    quote_zh: 有解脫門，名：普現法界微塵數無量身
    quote_en: 'There is a liberation-door named: universally manifesting countless bodiless bodies.'
    level: 1
  - id: gate3
    kind: gate
    label_zh: 一念現三世劫成壞
    label_en: A moment containing aeons
    quote_zh: 有解脫門，名：一念中現三世劫成壞事
    quote_en: 'There is a liberation-door named: within a single moment, manifesting the arising and perishing
      of aeons across the three times.'
    level: 1
  - id: gaze_all
    kind: assembly
    label_zh: 普觀一切眾會海
    label_en: Surveying the whole ocean of assemblies
    quote_zh: 普觀一切眾會海已，即說頌言
    quote_en: Having surveyed the whole ocean of assemblies, he spoke this verse.
    level: 0
  - id: mandala
    kind: mandala
    label_zh: 四十類雲集（曼荼羅全景）
    label_en: The forty classes gathered (mandala view)
    quote_zh: 爾時，如來道場眾海，悉已雲集
    quote_en: Then the ocean of the assembly at the Tathāgata's field had fully gathered.
    level: 0
    rings_ref: miaoyan_narrative.yaml:space.rings
  - id: final
    kind: sound
