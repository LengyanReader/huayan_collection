# 世主妙严品 · 电影式分镜数据（序/承/转/合 · 26 镜）
# 一切引文逐字见于 CBETA T10n0279（八十华严·实叉难陀译）；本文件由脚本生成并附核验断言。
# 空间关系/取景/运镜/光色氛围为现代视觉重构，凡此标 reconstruction: true 并附 judgment_zh。
meta:
  id: shizhu-miaoyan-storyboard
  article: shizhu-miaoyan
  title_zh: 世主妙严品 · 电影式分镜
  title_en: 'Adorning the World-Ruler: A Cinematic Storyboard'
  subtitle_zh: 四幕二十六镜——序幕·承·转·合
  subtitle_en: 'Four acts, twenty-six shots: Prelude, Assumption, Transition, Coda'
  source_primary: CBETA T10n0279（八十华严·实叉难陀译）——本经唯一现行底本
  source_ref: https://cbetaonline.dila.edu.tw/zh/T10n0279
  spec_ref: 本设计依用户 2026-10-01 指示之「动画电影式分镜」规格（台账 L.94 ⑩-3）编排
  tradition_zh: 佛教「變相圖／經變」传统以圖繪釋教義、構畫佛會之莊嚴；本分鏡與之可相比擬，然其形制與布局出于现代视觉重构，**非經變圖之复现**，不可混同。
  tradition_en: Comparable to the bianxiang tu (經變) tradition of Buddhist pictorial exegesis, this storyboard
    is nonetheless a modern visual reconstruction, not a reproduction of such images.
  method_zh: 每镜之**要素**（地・樹・珠・殿・座・網・幢等）悉出底本，逐字可覆核；其**空间关系、取景、运镜、光色氛围**则属现代重构，凡此一律标〔本文判断〕，不冒充经文所陈。
  method_en: Every element in every shot derives from the base text and can be verified word for word;
    spatial relations, framing, camera moves and atmosphere are modern reconstruction, always marked as
    editorial judgement.
  uncertainty_zh: 经文所述为同时圆融之境，非时间先后。分镜之先后为阅读之便而设，不代表义理上的次第〔待考〕。四幕之界亦然。
  uncertainty_en: The states described are simultaneous, not successive; the shot order is editorial (pending
    verification).
  reconstruction_flag_zh: 〔本文判断〕
  reconstruction_flag_en: '[Editorial judgement]'
