# 海云继梦法师「灵性经济学」原文辑录
# Primary Source Collection — Verbatim Statements from Ven. Haiyun Jimeng
# 原则: 只收录可回溯原文出处的直接引述，杜绝推测与臆想
# 最后更新: 2026-08-08

meta:
  title: 海云继梦法师论灵性经济学——原文辑录
  principle: |
    本辑录恪守「原文优先·出处可溯」原则——
    每一条引述均标注可验证的来源（著作/讲座/论坛）。
    「仁本经济学」一词未在本次检索中找到海云法师本人的直接使用出处，
    暂不收录为独立条目。如后续发现原文出处，当补充。
  sources_verified:
    - 著作《我们只有一个选择》(空庭书苑, 2010)
    - 2024年新世纪永续发展高峰论坛 (台北大学·大华严寺合办)
    - 华光书院/华严学会公开讲记

quotes:
  - id: q1
    text_zh: |
      「经济成长，成了今天破坏人性、灵性、人际与世界平衡的元凶。」
    context: 2010年第一届华严全球论坛高峰会发表的著作
    source: "《我们只有一个选择》(空庭书苑, 2010, ISBN 9789867484475)"
    note: 中英对照本，收录于「理事无碍系列」丛书

  - id: q2
    text_zh: |
      「我们要寻找灵性资源，来开发灵性资源，不是开发自然资源。
      （开发）自然资源必然造成世界的恐慌跟毁灭。」
    context: 华光书院或华严学会公开讲记中的口头表述
    source: 华光书院/华严学会公开讲记（转引自百科TA说·海云继梦条目）
    note: 此为讲记口语转写，非书面出版文本

  - id: q3
    text_zh: |
      灵性经济学的三个构面对应华严经教「三世间」——
      一、地球环境（器世间）——保护自然生态
      二、人际族群（眷属世间）——恢复人际温情与族群和谐
      三、灵性智慧（正觉世间）——开发内在灵性
    context: 2024年5月24日台北大学「新世纪永续发展高峰论坛」
    source: 大华严寺官网报道 (huayenworld.org)
    note: 此为框架性陈述，系对海云法师论坛演讲要点的概括

  - id: q4
    text_zh: |
      「我们只有一个选择——以灵性成长取代物质欲望。」
    context: 著作核心命题
    source: "《我们只有一个选择》核心论点（空庭书苑, 2010）"

  - id: q5
    text_zh: |
      「将追求自然资源开发转为『灵性开发』」；
      「以『以人为本』取代『以利润为本』，顺应以人性建构社会制度」；
      「通过教育与宗教两条途径推动——教育重拾『仁義禮智信』之本心，
      宗教以定人心、安忧思、充沛灵性。」
    context: 著作中提出的实践路径
    source: "《我们只有一个选择》(空庭书苑, 2010)"
    note: 三条路径并列陈述，源自著作中「灵性经济学的三个构面」章节

  - id: q6
    text_zh: |
      「让我们的良知活起来，良心活起来。」
    context: 华光书院讲座
    source: 华光书院/华严学会讲记

about_renben:
  note: |
    关于「仁本经济学」一词：
    在本次检索中，未能找到海云继梦法师本人公开使用「仁本经济学」
    这一术语的原文出处。法师的著作和讲座中，核心术语为「灵性经济学」。
    「仁本」一词可能源于：
    （1）法师在台北大学论坛中「以『以人为本』取代『以利润为本』」、
        「教育重拾『仁義禮智信』之本心」等表述——「仁本」为研究者
        或学人对法师此一系列思想的概括命名，而非法师本人确立的术语。
    （2）华严学会/大华严寺官方出版物中可能另有使用「仁本经济学」
        的文献——待后续发现后补充。
    在获得可验证的原文出处之前，灵性仁本页面中统一使用
    「灵性经济学」为首要术语，提及「仁本经济学」时加注说明。
  action_items:
    - "检索大华严寺官网 (huayenworld.org) 全站「仁本经济学」"
    - "查阅海云法师著作《我们只有一个选择》全文，确认是否使用「仁本」一词"
    - "检索海云法师 YouTube 频道相关讲座标题和讲记原文"

framing_for_page: |
  在灵性仁本页面的表述中，遵循以下原则——
  1. 海云法师体系使用「灵性经济学」为首要术语
  2. 西方学术传统使用「人本经济学」(Humanistic Economics)
  3. 二者并列以供互鉴，但清楚标示来源差异:
     灵性经济学 = 海云法师以华严三世间为框架的原创范式
     人本经济学 = Schumacher et al. 的世俗人文主义批判
  4. 「灵性仁本」作为页面总标题中的「仁本」，
     取自儒家「仁者爱人」的世间表达，与法师「以人为本」
     「教育重拾仁义礼智信之本心」的表述一脉相承——
     此「仁」是灵性在世间的人伦落实，非西方学术概念