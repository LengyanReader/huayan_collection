# 灵性仁本·澄明永续 — 数据内容
# Spirituality Rooted in Humanity · Luminous Sustainability
#
# 聚焦：灵性经济学 · 人本经济学 · 修行传统与永续发展 · 本土知识体系

sections:
  - id: overview
    title: 灵性仁本·澄明永续
    icon: 🌱
    summary: |
      以华严「一心法界」为根基，融汇灵性经济学、人本经济学、修行传统与本土知识体系，
      探索人类文明在二十一世纪的永续之道。澄明自性，仁泽众生——灵性不是出世的逃避，
      而是入世转化文明的根本力量。

  - id: spiritual_economics
    title: 灵性经济学·仁本经济学
    icon: 💎
    intro: |
      海云继梦法师（贤首宗高原法系第四十二世传人）提出「灵性经济学」——
      不是关于「灵性」的附加学问，而是以灵性为文明之根本的经济学范式转换。
      从「以物质为基础」转向「以生命（灵性）为基础」的文明重构。
      法师又常以<b>「仁本经济学」</b>名之——以儒家「仁」学（仁者爱人、推己及人）
      为世间表达，以华严「一心法界」为出世间根基，灵性与仁本一体不二。
    topics:
      - title: 灵性经济学的核心命题
        body: |
          海云法师指出：当代全球危机的根源在于「以物质欲望为驱动」的经济模式。
          灵性经济学的核心追问是——「经济活动的终极目的是什么？」
          不是GDP增长，不是物质积累，而是每一个生命的觉醒与圆满。
          华严「一即一切」为此提供了宇宙论基础：每一个体的经济行为都影响着法界全体。
          因此，经济活动本质上是灵性实践——「一切资生事业皆是佛法」（《华严经》）。
      - title: 从「竞争」到「共生」的范式转换
        body: |
          传统经济学预设「资源稀缺」与「理性自利」，驱动竞争与增长。
          灵性经济学指认：真正稀缺的不是物质资源，而是觉醒的心灵。
          华严「因陀罗网」揭示——法界中每一节点都含摄全体，
          共生(conviviality)而非竞争才是存在的根本形式。
          实践层面：从「拥有更多」转向「成为更多」——生命品质的提升替代物质数量的膨胀。
      - title: 第四波工业革命与灵性文明
        body: |
          海云法师预判：人类文明经历「农业革命→工业革命→信息革命→灵性革命」四个阶段。
          第四波不是技术革命，而是意识革命——从「外在工具」转向「内在觉醒」。
          AI与自动化将物质生产推向极限效率，而人类的独特价值将回归灵性——
          创造力、慈悲心、觉照力、审美力——这些是AI无法替代的「灵性维度」。
      - title: 灵性GDP：新的文明度量
        body: |
          海云法师提出替代GDP的度量体系：灵性GDP衡量一个社会的——
          觉醒指数（禅修普及率）、慈悲指数（志愿服务率）、
          智慧指数（教育资源投入）、和谐指数（冲突化解率）。
          正如不丹的「国民幸福总值」(GNH)，灵性GDP将「生命品质」重新确立为发展的终极目标。

  - id: humanistic_economics
    title: 仁本经济学·人本经济学
    icon: 📐
    intro: |
      ⚠ 概念辨析：海云继梦和上提出的<b>「仁本经济学」</b>，与其灵性经济学一脉相承——「仁」
      取自儒家仁学（仁者爱人）、「本」即以生命/灵性为文明根本。这不是西方学术界
      「Humanistic Economics」的翻译，而是华严宗原创的经济学范式——从物质欲望驱动
      转向灵性觉醒驱动，以「灵性GDP」替代GDP作为文明度量。<br><br>
      西方<b>「人本经济学」</b>传统（E.F. Schumacher, Tim Jackson, Kate Raworth 等）
      是对主流经济学的世俗人文主义批判——「economics as if people mattered」、
      「prosperity without growth」、「doughnut economics」——虽与佛教经济学有交集，
      但不建立在灵性修行与华严宇宙观之上。<br><br>
      二者在批判物质主义增长方面同道，但根基不同：一者以华严法界缘起为体，
      一者以世俗人文主义与生态科学为体。本节并列介绍，以供互鉴。
    topics:
      - title: Schumacher《小即是美》与佛教经济学
        body: |
          E.F. Schumacher(1911-1977)在《Small Is Beautiful》(1973)中首次提出「佛教经济学」——
          以「正命」(Right Livelihood)为核心的另类经济学范式。
          核心理念：工作不仅是谋生手段，更是人格发展与心灵成长的途径；
          消费的目的不是最大化，而是满足真实需求后的「知足」(contentment)。
          Schumacher深受缅甸佛教经济学家在「第三世界发展」讨论中的影响——
          其「中间技术」(Intermediate Technology)理念与华严「事事无碍」在
          「因地制宜、因缘和合」的方法论上有深层共鸣。
      - title: 正命(Right Livelihood)：八正道中的经济学
        body: |
          佛陀在八正道中单列「正命」——谋生方式本身就是修行。
          正命的五个标准：(1)不伤害生命(不贩卖武器/肉/毒/酒/奴隶)；
          (2)不欺骗(如实标示)；(3)不过度消费(少欲知足)；
          (4)利益众生(服务导向)；(5)与法和合(符合智慧与慈悲)。
          这五条标准为当代「伦理消费」「社会企业」「B-Corp」提供了
          两千五百年历史的深彻根基。
      - title: 后增长(Post-Growth)与去增长(Degrowth)
        body: |
          21世纪的后增长运动（Tim Jackson《无增长的繁荣》、Kate Raworth《甜甜圈经济学》、
          Giorgos Kallis《去增长》）与佛教经济学的「知足」理念高度一致。
          华严「事事无碍」为后增长提供了超越「增长vs衰退」二元对立的宇宙观——
          真正的繁荣不依赖于物质的无限扩张，而在于法界中一切存在的相即相入与圆满互摄。
      - title: 人本经济学的全球实践
        body: |
          • 不丹GNH(国民幸福总值)：以佛教价值观替代GDP作为发展指标
          • 日本里山(Satoyama)倡议：传统社区与自然共生的可持续模式
          • 意大利慢食(Slow Food)运动：从「效率最大化」回归「品质与关系」
          • 全球生态村网络(GEN)：以灵性/生态/社区三支柱重建人类聚落
          • 佛教Tzu Chi基金会：以「感恩经济」驱动的全球慈善循环

  - id: contemplative_traditions
    title: 修行传统与永续发展
    icon: 🧘
    intro: |
      世界各大修行传统（佛教、道家、印度瑜伽、基督教隐修、苏菲、原住民灵性）
      蕴含着丰富的生态智慧与永续实践——这些传统不是「过去」的遗物，
      而是应对当代生态危机与意义危机的深层资源。
    topics:
      - title: 佛教生态智慧：从缘起到共生
        body: |
          佛教缘起法——「此有故彼有，此无故彼无」——是最古老的生态哲学。
          一切事物相互依存、相互关联，没有孤立的存在。
          一行禅师(Thích Nhất Hạnh)「互即互入」(Interbeing)发展了缘起法的生态维度：
          「一片云中有一杯茶」——云、雨、土壤、茶农、饮者……无尽因缘共同构成了「一杯茶」。
          泰国「森林僧传统」(Forest Monks)通过「树木授戒」(Tree Ordination)
          将环保行动整合为宗教仪式——将森林保护提升至「护生」的戒律层面。
          不丹宪法规定森林覆盖率不低于60%——佛教国家将生态永续写入根本大法。
      - title: 道家与深层生态学
        body: |
          道家「道法自然」「无为而治」与深层生态学(Deep Ecology)的核心理念高度契合。
          Arne Næss的「生态智慧T」(Ecosophy T)明确受到老子与斯宾诺莎的启发——
          以「自我实现」(Self-realization)的扩展为核心，从小我→社会我→生态我→宇宙我。
          这与华严「从初发心到法身大士」的修行历程在扩展「自我边界」上有结构对应：
          初信=小我意识→十信=社会意识→十住=生态意识→十地=宇宙意识→等觉=法界意识。
      - title: 原住民灵性与地球伦理
        body: |
          全球原住民仅占世界人口约5%，却保护着地球80%的生物多样性（UNESCO数据）。
          这不是巧合——原住民的灵性传统以「土地为神圣」「万物有灵」「七代责任」为核心。
          毛利人的「Kaitiakitanga」(守护者责任)、安第斯「Pachamama」(大地母亲)、
          北美原住民「七代原则」(Seven Generations)——每一个决策必须考虑对未来七代的影响。
          2017年新西兰赋予Whanganui河流「法律人格」——原住民法理与现代环境法的突破性融合。
          华严「无情有性」（无生命之物也有佛性）与此深度共鸣。
      - title: 修行传统的气候行动
        body: |
          2015年佛教《气候变化宣言》由达赖喇嘛与一行禅师联署，呼吁全球佛教徒参与气候行动。
          伊斯兰《清洁能源宣言》、印度教《Bhumi Devi(大地女神)宣言》、
          东正教《绿色宣言》(君士坦丁堡宗主教巴多罗买被称为「绿色宗主教」)——
          全球宗教传统正在将灵性洞见转化为气候行动的伦理基础。
          华严的「理事无碍」为此提供了整合框架：理=灵性洞见，事=具体行动，二者圆融无碍。

  - id: indigenous_knowledge
    title: 本土知识体系·多元智慧
    icon: 🌏
    intro: |
      「本土知识」(Indigenous Knowledge)不是「原始的」或「过时的」——
      它是人类数千年与特定生态系统共生的精炼智慧。联合国IPBES(生物多样性与生态系统服务
      政府间平台)已将本土知识正式纳入全球评估框架。
    topics:
      - title: 本土知识的认识论地位
        body: |
          现代科学以「客观」「可复现」「普遍性」为标准——本土知识则以
          「关系性」「口传」「在地性」为特征。二者不是高下之分，而是不同的认知方式(Ways of Knowing)。
          华严「事事无碍」为此提供了包容性的认识论框架：
          科学知识（一事）、本土知识（另一事）——在法界中各自有其合法性与界限，
          互不相碍而能相资为用。正如法藏大师「六相圆融」所示：总别同异成坏——
          科学与本土知识互为「总/别」，在不同的脉络中各为「总」。
      - title: 中国传统中的生态智慧
        body: |
          中国二十四节气——世界上最古老、最完整的「物候历」——将天文、气候、
          农业、饮食、养生整合为一个动态的生态时间体系。
          2016年二十四节气入选UNESCO人类非物质文化遗产。
          中国传统农书的生态智慧：《齐民要术》《农政全书》记录了两千年
          的可持续农业实践——轮作、绿肥、天敌除虫——比现代有机农业早了一千多年。
          华严宗的「华严时」(一套以《华严经》为时间坐标的历法观)与此有深度亲和——
          「一念万年」「三世一时」的时间观超越了线性进步主义的时间观。
      - title: 全球本土知识案例
        body: |
          • 印度「神圣树林」(Sacred Groves)：数千片被宗教禁忌保护的原始森林——印度最早的「自然保护区」
          • 安第斯「ayllu」社区体系：以互惠(ayni)为核心的生态-社会-灵性共同体
          • 西非「Sankofa」哲学（加纳Akan族）：回顾过去以走向未来——传统智慧是未来的资源
          • 日本「镇守之森」：神社周边的原生林——日本最古老的森林保护制度
          • 蒙古「Ovoo」：游牧民族以敖包祭祀维护草原生态平衡
          • 澳大利亚原住民「歌之途」(Songlines)：以歌谣记录地形、水源、物种——活的地图与百科全书
      - title: 华严与本土知识的汇通之路
        body: |
          华严「六相圆融」为本土知识与现代性的互摄提供了独特的哲学框架：
          「总」(二者皆为人类智慧遗产)、「别」(各有方法论的独立性)、
          「同」(皆指向生命永续)、「异」(认识论路径不同)、
          「成」(互补互成)、「坏」(各自皆有局限)。
          法藏大师曰：「一切法门无尽海，同会一法道场中」——
          本土知识不必被现代科学「证明」才有价值，
          正如现代科学不必被本土传统「认可」才有合法性。
          二者在「灵性仁本」的道场中平等交辉。

  - id: practice
    title: 澄明永续·人间实践
    icon: 🙏
    intro: |
      从理念到行动——灵性仁本不是书斋哲学，而是转化为具体的人间实践。
      全球已有众多以灵性/人本/生态/本土知识为驱动力的社区、组织与运动。
    topics:
      - title: 灵性共同体与生态村运动
        body: |
          全球生态村网络(GEN)已有超过10,000个注册社区，以「灵性·生态·社群·经济」
          四维重建人类聚落。苏格兰Findhorn生态村(始于1962)——以灵性实践
          （与自然灵沟通）驱动沙漠变绿洲；印度Auroville(1968)——以Sri Aurobindo
          的「整体瑜伽」为灵性根基的全球城市实验。
          华严的「事事无碍」为生态村的多维实践提供了整合哲学——
          灵性不是社区的「一项活动」，而是贯穿生态/社群/经济的底色。
      - title: 人本教育：从「培训」到「觉醒」
        body: |
          灵性仁本的教育不是「灌输知识」而是「开启觉性」。
          一行禅师创办的「Wake Up Schools」——将正念融入课堂，已在全球上千所学校推行。
          泰国Sathya Sai学校——以「人类价值教育」(Educare)替代应试教育。
          芬兰现象教学法——虽非宗教灵性但以「全人发展」为核心，暗合灵性仁本的人本精神。
          华严「善财童子五十三参」是终极的人本教育隐喻——善财参访五十三位善知识
          （各行各业、男女老少、在家出家），在真实生活中学习法界智慧。
      - title: 灵性仁本宣言
        body: |
          综合灵性经济学、人本经济学、修行传统、本土知识体系的核心理念，
          灵性仁本的实践原则可归纳为——
          ① 生命为本：经济活动服务于生命觉醒，非反之
          ② 知足为富：「够用」比「更多」更富足
          ③ 关系为实：存在的本质是互即互入，非孤立的个体
          ④ 传统为源：修行传统与本土知识是未来的资源，非过去的遗物
          ⑤ 澄明为道：自心的澄明是一切外在澄明的基础
          ⑥ 永续为果：在法界中，每一念澄明的增长即法界永续的增长
          此六条不构成封闭体系——正如华严「善财五十三参」所示，
          灵性仁本永远向更多的智慧传统、更多的人类经验开放。

