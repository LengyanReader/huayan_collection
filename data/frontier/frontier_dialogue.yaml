      - domain: "苏菲神秘主义 & 华严"
        id: sufi
        icon: "☪"
        core_issues:
          - "Ibn Arabi「万有单一论」(Wahdat al-Wujud)与华严「事事无碍」"
          - "「完全的人」(al-Insan al-Kamil)与华严「即身成佛」"
          - "苏菲「玛尔卡兹」(markaz, 中心)与华严「法界一心」"
          - "12-13世纪东西方同时出现的圆融思想高峰"
        huayan_perspective: |
          华严与苏菲的比较:
          (1)万有单一论与事事无碍:
          Ibn Arabi(1165-1240, 安达卢西亚): 「万有单一论」(Wahdat al-Wujud)——一切存在都是唯一真实(wujūd, 真主)的显现(mazhar)。不是「泛神论」(pantheism: 真主=世界),而是「超泛神论」(panentheism: 世界在真主中,真主超越世界)。
          华严「一即一切」: 一切法都是法界的显现,法界不是任何一法,但遍在一切法中。
          结构相似性: 二者皆否定终极的多元分离,主张「多」是「一」的显现; 但华严的「一」(法界)是非位格的,苏菲的「一」(真主)是位格的(尽管Ibn Arabi的「万有单一论」在某些解释中趋向非位格)。
          (2)完全的人与即身成佛:
          苏菲「完全的人」(al-Insan al-Kamil): 人可以通过灵性修炼(ma'rifa, 认识真主)成为真主完美显现的载体——「完人」是宇宙的「中心」(markaz),万物围绕他而存在。
          华严「即身成佛」「初发心时便成正觉」(T10n0279): 一切众生本具佛性,发心即成正觉。
          对比: 苏菲的「完人」需要修炼才能达到(渐修),华严的「初发心」即含佛果(顿悟); 但二者皆主张人的终极圆满与宇宙的终极真实是同一的。
          (3)时代巧合:
          Ibn Arabi(1165-1240)与日本华严中兴之祖明惠上人(1173-1232)几乎同时代——12-13世纪东西方同时出现「一即一切」的圆融思想高峰。这是否暗示了某种「轴心时代」(Axial Age)之后的「第二轴心」(Second Axial Age)？凯伦·阿姆斯特朗(Karen Armstrong)《轴心时代》(2006)讨论了此问题。
          (4)当代苏菲-华严对话:
          20世纪苏菲学者如Martin Lings(1909-2005)和 Seyyed Hossein Nasr(1933-)对Ibn Arabi的注释为华严与苏菲的比较研究提供了学术基础。Nasr《知识与灵性的赞歌》(The Need for a Sacred Science, 1993)中将伊斯兰「知识学」(ʿilm)与佛教「般若」(prajñā)进行比较,间接涉及华严法界观。
        related:
          - name: "Ibn Arabi(1165-1240)"
            affiliation: "伊斯兰苏菲神秘主义者"
            description: "《智慧之光》(Fusus al-Hikam)《麦加的启示》(al-Futuhat al-Makkiyya)——「万有单一论」(Wahdat al-Wujud)的集大成者。"
