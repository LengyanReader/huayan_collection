            description: "MBSR(正念减压)创始人——将佛教正念从宗教框架中去脉络化,应用到医疗领域。"
          - name: "Eckhart Tolle(1948-)"
            affiliation: "灵性作家"
            description: "《当下的力量》(1997)——新时代灵性代表人物,其「当下」概念与华严「初发心时便成正觉」有表面相似但深层差异。"
          - name: "David Loy(1950-)"
            affiliation: "独立学者"
            description: "《The Great Awakening: A Buddhist Social Theory》(2003)——从佛教(含华严)视角批判现代性,同时对正念运动的商业化保持警惕。"
          - name: "Rupert Sheldrake(1942-)"
            affiliation: "生物学家"
            description: "「形变场」(morphic field)理论——与华严「法界」的「信息场」隐喻有可比较性,但方法论完全不同。"
