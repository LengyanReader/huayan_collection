      - domain: "唯识宗 & 华严唯心"
        id: weishi
        icon: "🔬"
        core_issues:
          - "阿赖耶缘起(唯识)与法界缘起(华严)的本体论对比"
          - "唯识三性(遍计所执/依他起/圆成实)与华严三观(真空/理事无碍/事事无碍)"
          - "玄奘与实叉难陀的翻译差异: 「阿赖耶识」vs「如来藏」"
          - "法藏判唯识为「大乘始教」的判教意涵"
        huayan_perspective: |
          华严与唯识的义理对话:
          (1)缘起论对比:
          唯识「阿赖耶缘起」: 万法唯识——一切现象由阿赖耶识(alāyavijñāna)中种子(bīja)现行而生。《成唯识论》(T31n1585): 「阿赖耶识为一切法种子所集起故。」——是「识」的缘起,强调认识主体(识)对现象世界的构造作用。
          华严「法界缘起」: 一切现象称性而起,相即相入,互摄互入。《华严经》「一切众生皆有如来智慧德相」(T10n0279, 卷五〈如来出现品〉)——是「法界」的缘起,强调法界全体的整体性和互摄性。
          (2)三性与三观的对应:
          唯识三性: 遍计所执性(虚妄执著)→依他起性(因缘生法)→圆成实性(真如法性)。
          华严三观: 真空观(破遍计)→理事无碍观(明依他)→事事无碍观(证圆成)。
          但华严的「事事无碍」超越了唯识「圆成实」的范围——唯识的圆成实仍是「理」的层面,华严的事事无碍则在「事」的层面实现圆融。
          (3)翻译差异:
          玄奘译《成唯识论》(T31n1585): 强调「阿赖耶识」作为一切法的所依,偏重「识」的分析。
          实叉难陀译《华严经》(T10n0279): 强调「如来藏」/「法界」作为一切法的根源,偏重「心」的圆融。
          此翻译差异反映了两个传统不同的思想重心: 唯识偏「分析」(将世界解析为识的构造),华严偏「圆融」(将世界统合为法界的全体)。
          (4)法藏的判教立场:
          法藏《华严五教章》(T45n1886)判唯识为「大乘始教」——虽明法空(遍计执空)但未及事事无碍。此判教意涵: 唯识是通往华严的「入门」(始),而非华严本身(圆)。但当代学者如赖永海指出,此判教可能低估了唯识学的深度——尤其是护法系唯识的「四智」说与华严「法界四智」有深层呼应。
