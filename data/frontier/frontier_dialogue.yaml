      - domain: "净土宗 & 华严净土"
        id: jingtu
        icon: "🙏"
        core_issues:
          - "毗卢遮那华藏世界海 vs 阿弥陀佛西方极乐世界"
          - "华严法身净土与净土宗报土的本体论差异"
          - "普贤行愿品的净土归趣: 华严与净土融合的经典依据"
          - "明代四大高僧兼弘华严与净土的传统"
        huayan_perspective: |
          华严与净土的净土观对话:
          (1)两种净土观:
          华严净土: 毗卢遮那佛的华藏世界海(《华严经》〈华藏世界品〉T10n0279, 卷八)——一即一切、重重无尽的法身净土。华藏世界海中有无数香水海,每一香水海中有无数世界种,每一世界种中有无数世界——是「依正不二」(环境与生命不二)的宇宙论图景。强调「即身成佛」「即世间即净土」。
          净土宗弥陀净土: 阿弥陀佛的西方极乐世界(《无量寿经》T12n0360)——「其佛世界,自然七宝合成」。强调「他力本愿」: 阿弥陀佛四十八愿,其中第十八愿「十念必生」是净土法门的核心。强调「仗佛力」往生。
          (2)融合经典依据:
          《华严经·普贤行愿品》(T10n0293, 四十华严最后一品): 普贤菩萨以十大愿王导归极乐——「临命终时,一切诸根悉皆败坏……唯此愿王,不相舍离,于一切时,引导其前,一刹那中,即得往生极乐世界。」此品成为华严宗与净土宗融合的经典纽带。
          (3)本体论差异:
          华严的「法身净土」是「法界全体」的呈现(依正不二),无空间方位的限制;
          净土宗的「报土」虽也是佛的果报庄严,但有「西方」「十万亿佛土」的空间描述。
          但善导大师(613-681)《观经四帖疏》将极乐世界解释为「报土非化土」——极乐是阿弥陀佛的实报庄严土,非化身权现。
          (4)明代融合: 明代四大高僧——莲池祩宏(兼弘华严与净土)、紫柏真可、憨山德清、蕅益智旭——多兼弘华严与净土,形成「贤净双修」(华严+净土)的传统。蕅益智旭《弥陀要解》以天台释净,但其深层架构受华严法界观影响。
