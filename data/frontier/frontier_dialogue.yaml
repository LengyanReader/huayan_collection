      - domain: "印度瑜伽 & 华严禅定"
        id: indian-yoga
        icon: "🧘"
        core_issues:
          - "帕坦伽利《瑜伽经》八支与华严止观的修行技术比较"
          - "瑜伽「三摩地」(samādhi)与华严「海印三昧」的境界对比"
          - "瑜伽「无种子三摩地」(nirbīja samādhi)与「能所双泯」"
          - "2008年海云继梦受大乘瑜伽行法: 印度瑜伽与华严的当代汇流"
        huayan_perspective: |
          华严与印度瑜伽的修行对话:
          (1)修行技术对比:
          帕坦伽利《瑜伽经》(Yoga Sūtra, 约公元前2世纪-公元4世纪)八支: (1)持戒(yama)→(2)劝制(niyama)→(3)坐法(āsana)→(4)调息(prāṇāyāma)→(5)制感(pratyāhāra)→(6)执持(dhāraṇā)→(7)禅那(dhyāna)→(8)三摩地(samādhi)。
          华严「五科训练」(海云继梦法师归纳): 戒→律→调身→调息→调心(止→观→还→净)。
          结构对应: 瑜伽前五支(持戒→制感)与华严前五科(戒→调息)在入门技术上有显著重叠——皆从「身」的规范开始,逐步过渡到「心」的专注。
          关键差异: 瑜伽八支以「三摩地」为终极目标(「瑜伽是心念波动的止息」,Yoga Sūtra 1.2: yogaś citta-vṛtti-nirodhaḥ),华严止观以「法界圆融」为终极——三摩地是「定」,华严还要「定后起观」,达到「定慧等持」。
          (2)三摩地与海印三昧:
          瑜伽「无种子三摩地」(nirbīja samādhi): 一切心识种子(bīja)完全止息,不再有新的业力种子产生——是「灭尽定」(nirodha-samāpatti)的极致。
          华严「海印三昧」(《华严经》〈世主妙严品〉T10n0279, 卷一): 「一切众生念念海印三昧」——法界全体在心中如大海水面印现万象,无有遗漏。
          对比: 瑜伽三摩地偏「灭」(止息心念),海印三昧偏「显」(心念止息后法界全体显现)——「灭」后「显」的逻辑,使华严的「海印三昧」超越了瑜伽的「无种子三摩地」。
          (3)当代汇流:
          2008年海云继梦法师受胜师子王菩萨传大乘瑜伽行法——印度古典瑜伽(哈他瑜伽/王瑜伽)与汉传华严在当代的实践性汇流。海云法师认为: 瑜伽的「身体修行」(āsana/prāṇāyāma)可以作为华严禅修的「前行」(准备),但华严的「心法」(法界观)超越了瑜伽的「定境」(三摩地)。
        related:
          - name: "帕坦伽利(Patañjali, 约公元前2世纪-公元4世纪)"
            affiliation: "瑜伽学派"
            description: "《瑜伽经》(Yoga Sūtra)——瑜伽修行体系的根本经典,定义「瑜伽是心念波动的止息」。"
