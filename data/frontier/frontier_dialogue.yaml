  # ══════════════════════════════════════════════════════════════
  # SECTION 3: 与佛教的对话 — 跨传统的思想对话
  # ══════════════════════════════════════════════════════════════
  buddhist:
    title: "🕉 与佛教的对话 — 跨传统的思想对话"
    intro: "华严宗的「法界缘起」思想与印度中观、藏传佛教、南传佛教等不同佛教传统在空性观、修行次第、心性论等层面有丰富的对话空间。此板块梳理这些跨传统的对话与比较研究。"
    domains:
      - domain: "中观般若 & 华严法界"
        id: madhyamaka
        icon: "🌐"
        core_issues:
          - "龙树《中论》空性与华严「真空妙有」的义理演进"
          - "八不中道与华严「六相圆融」的辩证结构"
          - "因陀罗网与中观「缘起性空」的关系"
          - "遮诠(否定式)与表诠(肯定式)的方法论差异"
        huayan_perspective: |
          华严与中观的空性对话:
          (1)义理脉络:
          中观: 龙树《中论》(T30n1564, 鸠摩罗什译): 「众因缘生法,我说即是空,亦为是假名,亦是中道义」(〈观四谛品〉二十四)。以「八不」(不生亦不灭,不常亦不断,不一亦不异,不来亦不出)破一切执,归于无所得。
          华严: 法藏《华严五教章》(T45n1886): 从「真空绝相观」(对应中观空性)→「理事无碍观」(空有不二)→「事事无碍观」(周遍含容)——空性在现象层面的积极展开。
          (2)关键演进:
          龙树的「空」是遮诠(否定式描述): 不说「什么是」,而说「什么不是」——破一切自性见(prakṛti-svabhāva)。
          华严的「事事无碍」是表诠(肯定式描述): 正面描述法界的圆融实相——一即一切,一切即一。
          从「破执」到「圆融」的义理跨越: 中观完成「解构」(deconstruction),华严完成「重构」(reconstruction)——但华严的重构建立在中观解构的基础之上,否则「事事无碍」会沦为「事事相碍」(执有)。
          (3)因陀罗网与缘起性空:
          因陀罗网(帝网珠喻)在结构上预设了「缘起性空」: 珠与珠之间的互映之所以可能,正因为珠无自性(svabhāva)——若有自性,则珠是封闭的实体,无法映现他珠。因此,因陀罗网是「缘起性空」在宇宙论层面的「正面表达」。
          (4)法藏对中观的继承与超越:
          法藏《十二门论宗致义记》(T42n1826)——华严祖师对龙树《十二门论》的注释,显示华严宗并非「反中观」,而是「接着中观讲」: 接受空性为「基础」(base),在空性之上建立「法界缘起」的「上层建筑」(superstructure)。
        related:
          - name: "龙树(Nāgārjuna, 约150-250)"
            affiliation: "中观学派创始人"
            description: "《中论》《十二门论》《大智度论》——建立「缘起性空」的中观哲学体系,被尊为「八宗共祖」。"
          - name: "法藏(643-712)"
            affiliation: "华严宗三祖"
            description: "在继承龙树空性的基础上建立「事事无碍」法界观,完成从「破执」到「圆融」的义理跨越。"
          - name: "月称(Candrakīrti, 约600-650)"
            affiliation: "印度中观应成派"
            description: "《入中论》(Madhyamakāvatāra)——应成中观的集大成者,其「缘起性空」论证与华严「法界缘起」形成有趣的张力: 月称只承认「空」,不承认「有」的积极面向。"
