      - domain: "藏传佛教 & 华严"
        id: vajrayana
        icon: "🔴"
        core_issues:
          - "华严五教判与宗喀巴三士道的修行次第对比"
          - "《华严经》藏译本(Toh44)的独特文献价值"
          - "格鲁派《现观庄严论》与华严「行布门」的修行阶位"
          - "达赖喇嘛对华严思想的现代评价"
        huayan_perspective: |
          华严与藏传佛教的对话:
          (1)判教/修行次第对比:
          华严五教判(法藏): 小乘教→大乘始教→大乘终教→顿教→圆教——以华严为圆教之极,强调「别教一乘」。
          藏传格鲁派三士道(宗喀巴《菩提道次第广论》,Toh4146): 下士道(求人天乐)→中士道(求解脱)→上士道(求菩提)——以「止观双运」(śamatha-vipaśyanā)为道枢,以密集金刚(mahāmudrā)/大圆满(dzogchen)为极。
          共同结构: 二者皆以「渐次引归圆顿」为修行总纲——华严从「小」到「圆」,藏传从「下」到「上」。但华严的「圆」强调「顿入」(初发心时便成正觉),藏传的「上」强调「渐修」(三大阿僧祇劫)。
          (2)藏译《华严经》(Toh44):
          84000 Project将《华严经》藏译本编为Toh44(共45品),译自于阗本。其中2品(如来华严品/普贤宣说品)为汉文三译(六十华严/八十华严/四十华严)完全缺失——藏文本为华严研究提供了不可替代的文献资源。
          84000 Project (2021-2026): 正在系统翻译藏文大藏经,其中Toh44-31(十地品,十地品)的英译已完成,提供了汉藏对照的学术基础。
          (3)现观庄严论与华严行布:
          弥勒《现观庄严论》(Toh4024)阐述「三智」(一切智/道种智/一切种智)和「八事七十义」——是般若学的修行次第体系。与华严「行布门」(从十信到佛果的五十二阶位)在「渐修」的结构上有可比较性。但华严强调「行布不碍圆融」(渐修中含顿悟),而格鲁派的道次第更强调次第的不可逾越性。
          (4)现代对话:
          达赖喇嘛在多次公开演讲中评价华严思想: 认为华严的「因陀罗网」与藏传佛教的「时轮」(Kālacakra)宇宙观在「一切事物相互依存」的理念上一致;同时指出华严的「事事无碍」在哲学上与中观的「缘起性空」不矛盾——「事事无碍」可以被理解为「缘起性空」在现象层面的积极表达。
