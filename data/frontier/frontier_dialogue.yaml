      - domain: "瑜伽行派 & 华严"
        id: yogacara
        icon: "📖"
        core_issues:
          - "唯识三性(遍计所执/依他起/圆成实)与华严三观的义理关联"
          - "弥勒五论与华严义学的传承关系"
          - "世亲《十地经论》如何催生华严宗的义学前身(地论师)"
          - "无著-世亲的唯识学与华严「法界缘起」的当代比较"
        huayan_perspective: |
          华严与瑜伽行派的历史传承:
          (1)世亲《十地经论》的遗产:
          世亲(Vasubandhu, 约4-5世纪)《十地经论》(T26n1522, 菩提流支译): 注释《华严经·十地品》,首创「六相」(总/别/同/异/成/坏)名相——后为华严宗吸收为「六相圆融」义(法藏《华严五教章》)。这是瑜伽行派直接催生华严义学的关键文献。
          (2)地论师的传承:
          菩提流支译《十地经论》→南北朝地论学派(南道: 慧光→法上→净影慧远; 北道: 道宠)→慧光南道派→传承至智俨(华严二祖)、法藏(华严三祖)——构成华严宗义学之远源。
          (3)三性与三观:
          唯识三性(《瑜伽师地论》T30n1579): 遍计所执性(虚妄执著,如执绳为蛇)→依他起性(因缘生法,如绳由麻等因缘而成)→圆成实性(真如法性,如绳之实相)。
          华严三观(法藏): 真空观(破遍计,知一切法无自性)→理事无碍观(明依他,知理与事不二)→事事无碍观(证圆成,知一切法相即相入)。
          关键差异: 唯识的三性是「分析性」的(将现象解析为三种存在方式),华严的三观是「实践性」的(修行者逐步深入的观法)。
          (4)弥勒五论与华严:
          弥勒五论(《瑜伽师地论》《大乘庄严经论》《辨中边论》《辨法法性论》《现观庄严论》)——华严宗虽非唯识宗,但法藏在《华严经探玄记》(T36n1732)中大量引用弥勒论典,尤其是《瑜伽师地论》的「十七地」修行框架,作为华严修行阶位(五十二位)的参照。
          (5)当代意义:
          无著、世亲的唯识学与华严宗法界缘起在当代「意识研究」「认知科学」中有不同面向的对话价值: 唯识的「识」的分析与认知科学的「信息处理」模型有结构亲缘性,华严的「法界」与全息原理有结构亲缘性——二者共同构成佛教对当代意识科学的双重理论资源。
        related:
          - name: "无著(Asaṅga, 约300-390)"
            affiliation: "瑜伽行派创始人"
            description: "《瑜伽师地论》《大乘庄严经论》——与弥勒(或其化名)共同建立唯识学体系。"
          - name: "世亲(Vasubandhu, 约320-400)"
            affiliation: "瑜伽行派集大成者"
            description: "《十地经论》《唯识三十论》《成唯识论》(注释)——通过《十地经论》直接影响华严宗的形成。"
          - name: "慧光(468-537)"
            affiliation: "地论师南道派"
            description: "传承《十地经论》学说,为华严宗的义学前身。"
          - name: "智俨(602-668)"
            affiliation: "华严宗二祖"
            description: "《华严经搜玄记》——华严宗义学的奠基者,继承地论师传统。"
          - name: "周贵华"
            affiliation: "中国社会科学院"
            description: "《唯识通论》(2015)——系统梳理唯识学在中国的传承,涉及唯识与华严的关系。"
        sources:
          - "T26n1522《十地经论》十二卷,世亲造,菩提流支译。华严义学的直接催生文献。"
          - "T30n1579《瑜伽师地论》一百卷,弥勒说,无著记,玄奘译。唯识根本论典。"
