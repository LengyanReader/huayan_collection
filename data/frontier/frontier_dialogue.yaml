      - domain: "基督教 & 华严"
        id: christian
        icon: "✝"
        core_issues:
          - "互摄互入(mutual interpenetration)与基督教位格神(personal God)"
          - "因陀罗网与普世救赎(universal salvation)"
          - "否定神学(via negativa)与华严「真空观」"
          - "Teilhard de Chardin「Omega Point」与华严法界缘起"
        huayan_perspective: |
          华严与基督教的对话:
          (1)互摄互入与位格神:
          华严「互摄互入」: 一切法相即相入,无有障碍——法界是「非位格的」(impersonal),无有主宰者。
          基督教「位格神」: 上帝是「位格的」(personal)——有意志、有目的、与人有「我-你」(I-Thou, Buber)的关系。
          张力: 华严的法界是「无主」的(没有一个「造物主」),基督教的上帝是「有主」的(万物由上帝创造)。但基督教神秘主义(如Meister Eckhart)中的「Gottheit」(神性本身,超越位格)与华严的「法界」有可对话的空间。
          (2)因陀罗网与普世救赎:
          华严因陀罗网: 一切众生互摄互入——一个众生的觉悟影响一切众生。
          基督教普世救赎: 「上帝愿万人得救」(《提摩太前书》2:4)——基督的救赎是为全人类。
          对话: 因陀罗网的「互摄互入」可以被理解为「普世救赎」的宇宙论基础——因为一切众生互摄互入,所以一个众生的解脱(或堕落)影响一切众生。
          (3)否定神学与真空观:
          伪狄奥尼修斯(Pseudo-Dionysius, 约5-6世纪)「上帝不是任何存在物」(《神秘神学》)与龙树、华严的「真空观」在「超越概念描述」的方法论上相通: 二者皆通过「否定」来接近终极实在(「否定神学」vs「遮诠」)。
          Meister Eckhart(1260-1328): 「Gelassenheit」(放下/泰然任之)——灵魂通过彻底放空自我而与上帝合一(「我祈求上帝让我摆脱上帝」)。与华严「能所双泯」「无心」的修行境界有深刻的跨文化对应。
          (4)Teilhard de Chardin:
          Pierre Teilhard de Chardin(1881-1955): 「Omega Point」(《人的现象》1955)——宇宙向意识的终极汇聚,「万物在基督中合一」。与华严「法界缘起」「一切即一」的宇宙观在整体论(holism)上有比较价值。但Teilhard是「进化论」的(宇宙向「Omega」进化),华严是「本具论」的(法界从本以来就是圆融的,无需「进化」)。
