  # ══════════════════════════════════════════════════════════════
  # SECTION 4: 跨宗教对话 — 跨传统的智慧互鉴
  # ══════════════════════════════════════════════════════════════
  others:
    title: "🌏 跨宗教对话 — 跨传统的智慧互鉴"
    intro: "华严思想的「事事无碍」「一即一切」与道家、儒家、印度瑜伽、基督教神秘主义、伊斯兰苏菲、现代灵性运动等不同宗教传统在宇宙观、修行论、心性论等层面存在深层对话空间。此板块梳理这些跨传统的比较与互鉴。"
    domains:
      - domain: "道家 & 华严自然观"
        id: daoist
        icon: "☯"
        core_issues:
          - "老子「道生一」与华严「一即一切」的生成论对比"
          - "庄子「齐物论」与华严「事事无碍」的齐一观"
          - "道教内丹与华严禅观的技术面对话"
          - "陈抟《无极图》与华严「法界缘起」的宇宙生成论"
        huayan_perspective: |
          华严与道家的比较:
          (1)道与法界:
          老子「道生一,一生二,二生三,三生万物」(《道德经》四十二章): 是「创生」逻辑——有一个「道」作为万物的根源,从「道」生出万物。
          华严「一即一切,一切即一」(T10n0279): 是「互摄」逻辑——没有「生」的过程,而是一切法从本以来就是法界的全体显现,无有能生/所生。
          结构差异: 道家重「生」的创生逻辑(有时间性的展开),华严重「即」的互摄逻辑(无时间性的当下圆成)。
          (2)庄子齐物与事事无碍:
          庄子「天地与我并生,万物与我为一」(《齐物论》): 超越大小、贵贱、是非的二元对立。
          华严「一尘中含法界」(T36n1732): 一切法相即相入,无有障碍。
          共同: 皆以超越二元对立为究竟; 差异: 庄子的「齐物」更偏「破」(破除偏见),华严的「无碍」更偏「立」(正面描述圆融)。
          (3)内丹与禅观:
          道教内丹(「炼精化气→炼气化神→炼神还虚→炼虚合道」)与华严禅观(「数随止→观→还→净」)在修行技术的「阶段化」上有结构相似性: 皆从粗到细、从有为到无为。陈抟《无极图》→周敦颐《太极图说》→理学宇宙论,与华严「法界缘起」的宇宙生成模式有可比较的结构。
          (4)历史互动:
          李通玄(683-727): 以《易经》融会华严,著《新华严经论》四十卷,开「东方智慧」解经路线——是华严与道家/易学对话的最早尝试。
          宗密《原人论》(T45n1887): 以华严判摄儒道释三家——「儒道二教,人天乘故」——最早的跨传统判教框架。
