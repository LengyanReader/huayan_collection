  litreview:
    title: "📑 多语言文献综述 (2023-2026)"
    intro: "定期更新相关领域的前沿论文与综述。涵盖AI意识/神经现象学/佛教与认知科学/心灵哲学/跨宗教比较/华严宗研究等交叉领域。"
    trends:
      - title: "冥想神经科学走向机制化"
        description: "从早期「冥想改变大脑」的相关性研究,转向因果实验——DMN抑制与自我感消退、γ波同步的信息整合理论(IIT)解释、cessation(体验中断)的神经动力学建模。2024年Laukkonen/Millière等人的cessation研究标志着此领域从描述性阶段进入机制性阶段。"
      - title: "AI意识与佛教无我对话"
        description: "LLM的自我报告(Claude/GPT-4)引发AI意识争论。佛教「无我」(anātman)提供独特视角——意识不需要「自我」(ātman)作为前提。2024-2026年,此对话从哲学思辨进入实证阶段: 有研究者尝试用IIT(信息整合理论)评估AI系统的意识水平。"
      - title: "预测加工与佛教认识论趋同"
        description: "Friston自由能原理(free energy principle)与「万法唯识」在结构上趋同: 二者皆将「认知」理解为「预测-更新」的循环。但佛教「转识成智」超越了预测加工的解释边界——「智」(jñāna)不是更精确的预测,而是对「预测者」本身的消解。"
      - title: "华严研究的跨语言转向"
        description: "84000 Project推动《华严经》藏译本(Toh44)的英译,使华严研究从汉学(Sinology)内部的议题变为跨语言、跨传统的比较宗教学议题。2023-2026年,至少3篇涉及华严与藏传比较的英文学术论文发表。"
      - title: "跨宗教对话的学术化"
        description: "华严与伊斯兰神秘主义(Ibn Arabi)、基督教神秘主义(Eckhart)、道家的比较研究从「通俗比较」转向严格的学术比较方法论: 使用glossolalia分析、概念史方法(conceptual history)、影响研究与平行研究的区分。"
    critical_assessment:
      - title: "前提假设差异"
        description: "神经科学预设物理主义(physicalism: 意识是脑的产物),佛教预设「心佛众生三无差别」(idealism: 意识是法界本具)。对话需明确前提分歧,而非简单嫁接。华严宗的「唯心」(cittamātra)不等于西方哲学的「唯心论」(idealism),前者是修行者的证量描述,后者是哲学家的理论预设。"
      - title: "方法论局限"
        description: "冥想神经科学依赖fMRI/EEG第三人称数据,佛教禅修依赖第一人称实证。计算现象学试图桥接二者(如Varela的neurophenomenology),但缺乏公认的形式化框架。2024年Laukkonen的cessation研究尝试了第一人称-第三人称数据的同步采集,是方法论的重要进步。"
      - title: "诠释风险"
        description: "将华严「事事无碍」简单类比为量子纠缠或神经网络全息性,存在严重过度诠释(over-interpretation)。华严「法界缘起」是证量境界描述,非物理学理论模型。Capra《物理学之道》的经典错误在于混淆了「结构相似性」(structural similarity)与「因果关联」(causal connection)。"
      - title: "跨宗教比较的方法论陷阱"
        description: "将华严「互摄互入」与基督教「位格神」、苏菲「万有单一论」简单等同,忽视了各传统自身的语境(context)和修行路径(praxis)。比较宗教学需区分「影响研究」(influence study, 确实存在的历史因果)与「平行研究」(parallel study, 结构相似但无历史因果)。华严与苏菲的关系属于后者。"
