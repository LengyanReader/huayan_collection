      - domain: "儒家 & 华严仁学"
        id: confucian
        icon: "📜"
        core_issues:
          - "朱熹「理一分殊」与华严「理事无碍」的结构对比"
          - "王阳明「心即理」与华严「一心法界」的心学对话"
          - "华严心学与阳明心学: 佛儒心性论的交汇"
          - "海云继梦「仁本经济学」: 华严思想与儒家仁学的当代合流"
        huayan_perspective: |
          华严与儒家的比较:
          (1)朱熹与华严:
          朱熹「理一分殊」(《四书章句集注》): 一理(太极)摄万理——万物各有一理,而万理归于一理(太极)。「月印万川」: 一个月亮映在千万条河水中,每条河中的月影都是完整的月亮。
          华严「理事无碍观」(法藏): 理(法界全体)与事(一切法)不碍——一理摄万事,万事归于一理。「一月普现一切水,一切水月一月摄」(T36n1732引《华严经》偈)。
          结构相似性: 「理一分殊」与「理事无碍」在「一多相即」上有惊人的结构对应。朱熹早年出入佛老,其「理」的概念被认为受华严「理法界」影响。
          差异: 朱熹的「理」是「实理」(道德本体),华严的「理」是「空性」(法界本性)。朱熹排斥佛教为「虚无」,但其「理一分殊」的深层结构实受华严影响。
          (2)王阳明与华严:
          王阳明「心外无物」「知行合一」「致良知」与华严「一心法界」——皆以「心」为万法之源。但王阳明「心即理」重伦理实践(良知是道德直觉),华严重「法界圆融」的宇宙论(一心是法界全体)。
          「四句教」(无善无恶心之体,有善有恶意之动,知善知恶是良知,为善去恶是格物)与华严「四法界」(事法界→理法界→理事无碍法界→事事无碍法界)在「从体到用」的结构上可比较。
          (3)《大学》「知止」与禅观:
          《大学》「知止而后有定,定而后能静,静而后能安,安而后能虑,虑而后能得」与华严禅观的「停心」(驻佇心观)在「停止思维惯性」的操作面上一致——儒家的「定静安」与佛家的「止」(śamatha)有修行技术的共通性。
          (4)海云继梦「仁本经济学」:
          海云继梦法师将华严「同体大悲」与儒家「仁」(「仁者,爱人」《论语》)合流,提出「仁本经济学」: 经济活动应以「仁」(对他者的关怀)为本,而非以「利」(利润最大化)为本。这与华严「法界缘起」的伦理学意涵一致: 一切众生互摄互入,因此「利他」就是「利己」。
        related:
          - name: "朱熹(1130-1200)"
            affiliation: "南宋理学集大成者"
            description: "《四书章句集注》《朱子语类》——「理一分殊」思想,其深层结构受华严影响。"
