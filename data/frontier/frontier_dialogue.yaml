            affiliation: "华严学会"
            description: "2008年接受大乘瑜伽行法传承,推动印度瑜伽与华严的当代汇流。"
          - name: "B.K.S. Iyengar(1918-2014)"
            affiliation: "印度瑜伽大师"
            description: "《光之瑜伽经》(Light on the Yoga Sūtras of Patañjali, 1996)——当代瑜伽经的权威注释。"
          - name: "Georg Feuerstein(1947-2012)"
            affiliation: "瑜伽研究学者"
            description: "《The Yoga Tradition》(2008)——系统梳理瑜伽的历史与哲学,涉及瑜伽与佛教的关系。"
        sources:
          - "Patañjali. Yoga Sūtra (《瑜伽经》): 1.2 yogaś citta-vṛtti-nirodhaḥ; 1.3 tadā draṣṭuḥ svarūpe 'vasthānam."
          - "T10n0279,卷一〈世主妙严品〉: 海印三昧。"
