      - domain: "南传上座部 & 华严"
        id: theravada
        icon: "🟤"
        core_issues:
          - "四念处与华严修行次第的对话"
          - "内观(vipassanā)与法界观的异同"
          - "十二缘起(缘觉乘)与法界缘起的义理演进"
          - "「个人解脱」与「法界圆融」的修行目标差异"
        huayan_perspective: |
          华严与南传上座部的缘起对话:
          (1)缘起观的演进:
          原始佛教: 十二因缘(avīṭṭisamuppāda)——无明缘行、行缘识……「此有故彼有,此生故彼生;此无故彼无,此灭故彼灭」(《杂阿含经》T02n099)。是线性因果的描述——从「因」到「果」的链条。
          华严: 法界缘起——「一即一切,一切即一」——从线性因果到全息互摄的宇宙观。一切法互为因缘,无有先后、主次之别。
          (2)修行方法对比:
          南传四念处: 身念处(kāya)→受念处(vedanā)→心念处(citta)→法念处(dhamma)——逐层深入的观察修行,核心是「如实观照」(yathābhūta)。
          华严法界观: 真空观→理事无碍观→事事无碍观——从「解构」到「圆融」的观法体系。
          共同基础: 二者在「如实观照」(vipassanā的「观」与华严「观照」)的技术面有共同基础——都是对当下经验的直接观察,不依赖推理。
          根本差异: 南传内观的终极目标是「涅槃」(nirodha)——苦的止息,偏向「个人解脱」;华严法界观的终极目标是「法界圆融」——一切众生皆成佛,偏向「大悲普度」。前者是「解脱道」(śrāvakayāna),后者是「菩萨道」(bodhisattvayāna)。
          (3)当代对话:
          南传内观(vipassanā)在西方的传播(如Goenka传承、S.N. Goenka, 10日内观营)为华严修行提供了「技术面」的参考: 华严的「事事无碍观」在具体操作上需要「内观」的基础——先如实观察自身经验,再超越个人经验而安住法界。海云继梦法师的「华严禅观」修行体系中,「数随止」(技术面)的操作与南传内观有显著的重叠。
        related:
          - name: "S.N. Goenka(1924-2013)"
            affiliation: "印度/缅甸内观传承"
            description: "将南传内观(vipassanā)系统推广到全球,10日内观营模式影响深远。"
          - name: "Mahasi Sayadaw(1904-1982)"
            affiliation: "缅甸马哈希禅修中心"
            description: "「马哈希内观」——以「记名」(labeling)技术系统化内观修行。"
          - name: "菩提比丘(Bhikkhu Bodhi, 1944-)"
            affiliation: "美国/斯里兰卡"
            description: "南传上座部经典的权威英译者,《相应部》(Saṃyutta Nikāya)英译。"
          - name: "海云继梦法师"
            affiliation: "华严学会"
            description: "将南传内观技术与华严修行体系进行对话,在「技术面」上承认二者的共通性。"
        sources:
