# ═══ 站点导航配置 ═══
# build.py 读取本文件生成各 Tab 侧边栏（sidebar）HTML。
# 新增知识主题时：在此登记导航项 + 在对应内容 YAML 添加 section，无需改 build.py / JS。
#
# 结构说明：
#   heading    侧边栏标题（<h3>）
#   heading_sub 标题旁小字（可选，<small>）
#   nav        导航项数组
#     label      显示文本（可含 emoji）
#     label_sub  显示文本旁小字（可选，<small>）
#     active     默认高亮（可选，仅顶层）
#     open       默认展开子链接（可选，仅含 subs 的项）
#     action     点击行为（顶层自动追加 ,this；子项不追加）
#       - {type: call,  fn: switchGapView, args: [overview]}
#       - {type: assign, var: SPIRIT_ACTIVE, value: overview, call: renderSpirit}
#       - {href: '#co-mandala'}  纯锚点跳转（无 onclick）
#     subs       子链接数组（action 同顶层结构，但不传 this）
#     subsub     第三级链接（{label, action}）
#   view_id     content 容器 id
#   render      页面渲染调用
#   title       <title> 与 <h1>

