[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huayan-collection"
version = "0.1.0"
description = "华严宗部文献与修行资料数字化梳理平台"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "yunan"}
]
keywords = ["huayan", "avatamsaka", "buddhism", "digital-humanities", "knowledge-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Religion",
    "Topic :: Digital Humanities",
]

dependencies = [
    # 2026-09-27 依赖瘦身：原 9 核心依赖中 rich/sqlite-utils/lxml/pandas/httpx/tqdm 全仓(scripts+src+web) 0 处 import，
    # 已移除；neo4j 移入 graph 额外项（仅 load_neo4j.py 校验工具需要）；余下两项为真实生产依赖。
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
]
web = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
]
ner = [
    "spacy>=3.7",
    "transformers>=4.35",
]
graph = [
    # 图校验层：scripts/load_neo4j.py 需要；非站点运行依赖
    "neo4j>=5.14",
]
search = [
    # 计划中的语义检索（sentence-transformers 嵌入）；scripts/src 尚未接入，故移出核心依赖，按需 `pip install -e ".[search]"`
    "sentence-transformers>=2.2",
]

[project.scripts]
huayan = "src.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
